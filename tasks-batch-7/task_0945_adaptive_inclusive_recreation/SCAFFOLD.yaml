scenario: "945. Adaptive & Inclusive Recreation Program: participant intake & ability/support-need, activity & 1:1 support staffing, adaptive-equipment inventory, transportation, scholarship/waiver funding, caregiver & consent, progress/goal, reporting"
domain_name: "adaptive-inclusive-recreation"
api_prefix: "/recreation"

complexity_profile:
  primary_archetype: "Quota / allocation"
  secondary_archetype: "Compliance / audit"
  complexity_layers:
    - "Optimistic concurrency"
    - "Cascading side effects"
    - "Dual-variant calculation"
    - "Ops-run checkpoint"
  entity_topology: graph
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# Global constants — EVERY named constant referenced anywhere in this scaffold
# has its numeric/string value declared here. Nothing downstream may guess.
# ---------------------------------------------------------------------------
global_constants:
  DEFAULT_CLOCK_UTC: "2026-05-01T00:00:00Z"

  # Support-need tier -> pooled staffing demand, expressed in integer
  # "support points". ONE_TO_ONE participants are excluded from the pooled
  # sum entirely (they consume a dedicated staffer instead), hence 0.
  SUPPORT_POINTS_INDEPENDENT: 25
  SUPPORT_POINTS_INTERMITTENT: 50
  SUPPORT_POINTS_SUBSTANTIAL: 100
  SUPPORT_POINTS_ONE_TO_ONE: 0
  STAFF_POINT_CAPACITY: 400
  MIN_GROUP_STAFF: 1

  # Activity risk tier -> multiplier applied to the pooled support-point sum,
  # in basis points (10000 bp = 1.0x).
  RISK_MULTIPLIER_BP_LOW: 10000
  RISK_MULTIPLIER_BP_MODERATE: 12500
  RISK_MULTIPLIER_BP_HIGH: 15000

  # Eligibility windows.
  ASSESSMENT_VALIDITY_DAYS: 365
  SESSION_ENROLLMENT_CUTOFF_HOURS: 24
  STAFF_TURNAROUND_BUFFER_MINUTES: 30
  TRANSPORT_ARRIVAL_BUFFER_MINUTES: 15
  MAX_SESSION_UNLOCKS: 2
  PROMOTIONS_PER_RELEASE: 1

  # Fee / money.
  MONEY_ROUNDING: "round_half_up"
  SIBLING_DISCOUNT_BP: 1500
  SIBLING_DISCOUNT_MIN_ENROLLED: 2
  TRANSPORT_BASE_FARE_CENTS: 300
  TRANSPORT_PER_MILE_CENTS: 85
  TRANSPORT_ACCESSIBLE_SURCHARGE_CENTS: 250
  FUNDING_EXHAUSTED_AT_AVAILABLE_CENTS: 0
  SUBSIDY_REQUIRED_INCOME_BANDS: ["BAND_A", "BAND_B"]

  # Equipment.
  INSPECTION_INTERVAL_DAYS: 180
  WEIGHT_CAPACITY_TOLERANCE_KG: 0

  # Goals / ratings.
  RATING_SCORE_MIN: 1
  RATING_SCORE_MAX: 5
  DEFAULT_MASTERY_WINDOW_M: 5
  DEFAULT_MASTERY_HITS_N: 4
  WAITLIST_EQUITY_SCHOLARSHIP_BONUS: 50

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: OperatingPeriod
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Human label for the program/fiscal period, e.g. 'FY26 Summer'."
      - name: starts_on
        type: string
        source: input
        description: "Inclusive first calendar date of the period, ISO date YYYY-MM-DD."
      - name: ends_on
        type: string
        source: input
        description: "Inclusive last calendar date of the period, ISO date YYYY-MM-DD."
        constraints: "ends_on >= starts_on"
      - name: status
        type: enum
        source: system
        description: "Operating posture that drives the global write gate."
        default: "OPEN"
        constraints: "One of OPEN, RESTRICTED, FROZEN, CLOSING, CLOSED"

  - name: FeeScaleBand
    parent: null
    common_fields: false
    fields:
      - name: household_size_min
        type: integer
        source: input
        description: "Inclusive lower bound of household size this band covers."
        constraints: ">= 1"
      - name: household_size_max
        type: integer
        source: input
        description: "Inclusive upper bound of household size this band covers."
        constraints: ">= household_size_min"
      - name: income_band
        type: enum
        source: input
        description: "Income bracket this row prices."
        constraints: "One of BAND_A, BAND_B, BAND_C, BAND_D"
      - name: per_session_cents
        type: integer
        source: input
        description: "Sliding-scale price for one session before any program multiplier."
        constraints: ">= 0"
      - name: series_cents
        type: integer
        source: input
        description: "Sliding-scale price for a whole series before any program multiplier."
        constraints: ">= 0"

  - name: Participant
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Participant legal name."
      - name: date_of_birth
        type: string
        source: input
        description: "ISO date YYYY-MM-DD; drives consent signer-authority rules."
      - name: household_id
        type: string
        source: input
        description: "Opaque household grouping key; siblings share the same value. Not a foreign key."
      - name: household_size
        type: integer
        source: input
        description: "Number of people in the household; selects the FeeScaleBand row."
        constraints: ">= 1"
      - name: income_band
        type: enum
        source: input
        description: "Income bracket; selects the FeeScaleBand row."
        constraints: "One of BAND_A, BAND_B, BAND_C, BAND_D"
      - name: weight_kg
        type: integer
        source: input
        description: "Participant weight in whole kilograms; checked against adaptive-equipment weight capacity."
        constraints: ">= 1"
      - name: mobility_profile
        type: enum
        source: input
        description: "Determines which transport position type the participant may occupy."
        constraints: "One of WHEELCHAIR, AMBULATORY"
      - name: guardianship_status
        type: enum
        source: input
        description: "Legal decision-making status; combined with age_years to decide consent signer authority."
        constraints: "One of SELF, GUARDIAN_REQUIRED, CONSERVATORSHIP"
      - name: status
        type: enum
        source: system
        description: "Intake lifecycle axis."
        default: "INTAKE"
        constraints: "One of INTAKE, ACTIVE, INACTIVE, EXITED"
      - name: age_years
        type: integer
        source: computed
        description: "Whole years between date_of_birth and the logical clock date, floor."
      - name: effective_support_tier
        type: enum
        source: computed
        description: "support_tier of this participant's SupportAssessment whose status == ACTIVE; null when none exists."
        constraints: "One of INDEPENDENT, INTERMITTENT, SUBSTANTIAL, ONE_TO_ONE, or null"
      - name: enrollment_posture
        type: enum
        source: computed
        description: "Derived gate summary recomputed on every read of the eligibility endpoint; see calculations.participant_enrollment_posture."
        constraints: "One of CLEARED, NOT_ACTIVE, CONSENT_BLOCKED, ASSESSMENT_STALE, FINANCIALLY_BLOCKED"

  - name: Caregiver
    parent: Participant
    common_fields: true
    fields:
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id; the participant this caregiver is attached to."
      - name: full_name
        type: string
        source: input
        description: "Caregiver name."
      - name: relationship
        type: enum
        source: input
        description: "Relationship to the participant."
        constraints: "One of PARENT, GUARDIAN, SIBLING, OTHER"
      - name: is_legal_guardian
        type: boolean
        source: input
        description: "True when this caregiver holds legal guardianship; required to sign for GUARDIAN_REQUIRED / CONSERVATORSHIP participants."
        default: false
      - name: contact_phone
        type: string
        source: input
        description: "Contact phone number."

  - name: SupportAssessment
    parent: Participant
    common_fields: true
    fields:
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id; the assessed participant."
      - name: assessed_on
        type: string
        source: input
        description: "ISO date YYYY-MM-DD the assessment was performed; drives ASSESSMENT_VALIDITY_DAYS staleness."
      - name: effective_from
        type: datetime
        source: input
        description: "ISO 8601 UTC instant from which this assessment governs; sessions starting before it keep the prior assessment."
      - name: support_tier
        type: enum
        source: input
        description: "Assessed support need."
        constraints: "One of INDEPENDENT, INTERMITTENT, SUBSTANTIAL, ONE_TO_ONE"
      - name: support_points
        type: integer
        source: computed
        description: "Pooled staffing demand for this tier: SUPPORT_POINTS_INDEPENDENT 25, SUPPORT_POINTS_INTERMITTENT 50, SUPPORT_POINTS_SUBSTANTIAL 100, SUPPORT_POINTS_ONE_TO_ONE 0."
      - name: status
        type: enum
        source: system
        description: "Assessment lifecycle axis."
        default: "DRAFT"
        constraints: "One of DRAFT, ACTIVE, SUPERSEDED"

  - name: ConsentArtifact
    parent: Participant
    common_fields: true
    fields:
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id; the participant the consent covers."
      - name: consent_type
        type: enum
        source: input
        description: "Which consent artifact this is."
        constraints: "One of MEDIA_RELEASE, EMERGENCY_MEDICAL, BEHAVIOR_SUPPORT_PLAN, MEDICATION_ADMIN"
      - name: signed_by_caregiver_id
        type: string
        source: input
        description: "FK -> Caregiver.id; the caregiver who signed. Null while status == PENDING_SIGNATURE, and null when signer_role == SELF."
      - name: signer_role
        type: enum
        source: system
        description: "Authority under which the signature was accepted; set by the sign transition."
        constraints: "One of SELF, LEGAL_GUARDIAN, or null while PENDING_SIGNATURE"
      - name: signed_on
        type: string
        source: system
        description: "ISO date YYYY-MM-DD taken from the logical clock at signing; null while PENDING_SIGNATURE."
      - name: expires_on
        type: string
        source: input
        description: "ISO date YYYY-MM-DD after which the consent no longer covers a session."
      - name: status
        type: enum
        source: system
        description: "Consent lifecycle axis."
        default: "PENDING_SIGNATURE"
        constraints: "One of PENDING_SIGNATURE, SIGNED, EXPIRED, REVOKED"

  - name: ActivityProgram
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Program label, e.g. 'Adaptive Aquatics Level 1'."
      - name: activity_type
        type: enum
        source: input
        description: "Activity family; consent requirements are keyed to it."
        constraints: "One of AQUATICS, FITNESS, ARTS, SPORTS, COMMUNITY_OUTING"
      - name: risk_tier
        type: enum
        source: input
        description: "Risk tier selecting the staffing multiplier: LOW 10000 bp, MODERATE 12500 bp, HIGH 15000 bp."
        constraints: "One of LOW, MODERATE, HIGH"
      - name: pricing_mode
        type: enum
        source: input
        description: "Branch condition selecting the participant_session_fee_cents variant."
        constraints: "One of PER_SESSION, SERIES_FLAT"
      - name: rounding_policy
        type: enum
        source: input
        description: "Branch condition selecting the family_responsibility_total_cents variant."
        constraints: "One of ROUND_PER_LINE, ROUND_ON_TOTAL"
      - name: waitlist_policy
        type: enum
        source: input
        description: "Branch condition selecting the waitlist_priority_score variant."
        constraints: "One of FIFO, EQUITY_WEIGHTED"
      - name: fee_multiplier_bp
        type: integer
        source: input
        description: "Program multiplier applied to the FeeScaleBand price, in basis points (10000 = 1.0x)."
        constraints: ">= 0"
      - name: scheduled_session_count
        type: integer
        source: input
        description: "Number of sessions the SERIES_FLAT price is divided across; must equal the number of ProgramSession rows the program is allowed to hold."
        constraints: ">= 1"
      - name: required_consent_types
        type: array
        source: input
        description: "Consent types that must be SIGNED and unexpired at the session date before an Enrollment on this program may be confirmed."
        default: []
        constraints: "Subset of MEDIA_RELEASE, EMERGENCY_MEDICAL, BEHAVIOR_SUPPORT_PLAN, MEDICATION_ADMIN"
      - name: required_certification_types
        type: array
        source: input
        description: "Certification types every GROUP or LEAD StaffAssignment on this program's sessions must hold."
        default: []
        constraints: "Subset of ADAPTIVE_AQUATICS, BEHAVIOR_SUPPORT, MEDICATION_ADMIN, CPR"
      - name: requires_medication_admin
        type: boolean
        source: input
        description: "When true, staffing lock additionally requires MEDICATION_ADMIN coverage on the session."
        default: false
      - name: required_equipment_model_code
        type: string
        source: input
        description: "Adaptive-equipment model code every enrolled participant must hold a reservation for; null when the program needs no equipment."
        default: null
      - name: required_equipment_size_code
        type: string
        source: input
        description: "Size code the reserved equipment must match exactly; null when required_equipment_model_code is null."
        default: null
      - name: session_count_created
        type: integer
        source: computed
        description: "Count of ProgramSession rows whose program_id == this program."
        default: 0

  - name: ProgramSession
    parent: ActivityProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> ActivityProgram.id; the program this session belongs to."
      - name: sequence_number
        type: integer
        source: system
        description: "1-based position within the program's series, assigned as session_count_created + 1 at creation. Session 1 carries the SERIES_FLAT rounding remainder."
      - name: start_at
        type: datetime
        source: input
        description: "ISO 8601 UTC session start instant."
      - name: end_at
        type: datetime
        source: input
        description: "ISO 8601 UTC session end instant."
        constraints: "end_at > start_at"
      - name: slot_capacity
        type: integer
        source: input
        description: "Program-slot capacity: how many Enrollments may hold enrollment_status == CONFIRMED at once."
        constraints: ">= 0"
      - name: slots_committed
        type: integer
        source: computed
        description: "Count of Enrollment rows on this session with enrollment_status == CONFIRMED."
        default: 0
      - name: slots_available
        type: integer
        source: computed
        description: "slot_capacity - slots_committed; conserved by invariant slot_conservation."
      - name: one_to_one_pool_size
        type: integer
        source: input
        description: "Number of dedicated one-to-one support staffers budgeted for this session. Counted separately from slot_capacity; the two counters are never interchangeable."
        constraints: ">= 0"
      - name: one_to_one_committed
        type: integer
        source: computed
        description: "Count of Enrollment rows on this session with enrollment_status == CONFIRMED whose effective support tier at this session is ONE_TO_ONE."
        default: 0
      - name: one_to_one_available
        type: integer
        source: computed
        description: "one_to_one_pool_size - one_to_one_committed; conserved by invariant one_to_one_pool_conservation."
      - name: one_to_one_staffed
        type: integer
        source: computed
        description: "Count of StaffAssignment rows on this session with assignment_role == ONE_TO_ONE and status IN {PROPOSED, CONFIRMED}."
        default: 0
      - name: assigned_group_staff_count
        type: integer
        source: computed
        description: "Count of StaffAssignment rows on this session with assignment_role IN {LEAD, GROUP} and status IN {PROPOSED, CONFIRMED}."
        default: 0
      - name: required_group_staff_planned
        type: integer
        source: computed
        description: "PLANNED variant of calculations.required_group_staff_count (roster = CONFIRMED enrollments)."
        default: 0
      - name: required_group_staff_delivered
        type: integer
        source: computed
        description: "DELIVERED variant of calculations.required_group_staff_count (roster = ATTENDED enrollments); null until the session is DELIVERED."
        default: null
      - name: staffing_gap
        type: integer
        source: computed
        description: "See calculations.session_staffing_gap; must equal 0 before staffing may be locked."
        default: 0
      - name: unlock_count
        type: integer
        source: system
        description: "How many times staffing has been unlocked; capped at MAX_SESSION_UNLOCKS = 2."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Session lifecycle axis with a capped unlock loop."
        default: "DRAFT"
        constraints: "One of DRAFT, OPEN, STAFFING_LOCKED, DELIVERED, CANCELLED"

  - name: Enrollment
    parent: ProgramSession
    common_fields: true
    fields:
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id; the enrolled participant."
      - name: session_id
        type: string
        source: input
        description: "FK -> ProgramSession.id; the session enrolled in."
      - name: transport_requested
        type: boolean
        source: input
        description: "True when the family asked for a transport position on the session's TransportRun."
        default: false
      - name: enrollment_status
        type: enum
        source: system
        description: "Roster axis; evolves independently of funding_status on the same row."
        default: "REQUESTED"
        constraints: "One of REQUESTED, WAITLISTED, CONFIRMED, ATTENDED, NO_SHOW, WITHDRAWN, DENIED"
      - name: funding_status
        type: enum
        source: system
        description: "Money axis; evolves independently of enrollment_status on the same row."
        default: "QUOTED"
        constraints: "One of UNFUNDED, QUOTED, ENCUMBERED, DISBURSED, RELEASED"
      - name: waitlist_score
        type: integer
        source: computed
        description: "See calculations.waitlist_priority_score; recomputed whenever the row enters WAITLISTED."
        default: 0
      - name: promoted_at
        type: datetime
        source: system
        description: "Logical-clock instant at which a WAITLISTED row was promoted to CONFIRMED; null otherwise."
        default: null
      - name: effective_support_tier_at_session
        type: enum
        source: computed
        description: "See calculations.effective_support_tier; the tier that governs this enrollment's staffing contribution."
        constraints: "One of INDEPENDENT, INTERMITTENT, SUBSTANTIAL, ONE_TO_ONE, or null"

  - name: EnrollmentCharge
    parent: Enrollment
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the enrollment this charge prices. Exactly one charge per enrollment; created by the enrollment-create cascade, never by a client."
      - name: fee_scale_band_id
        type: string
        source: input
        description: "FK -> FeeScaleBand.id; the sliding-scale row matched at charge creation, pinned thereafter."
      - name: program_fee_cents
        type: integer
        source: computed
        description: "See calculations.participant_session_fee_cents."
      - name: scholarship_applied_cents
        type: integer
        source: computed
        description: "Sum of ScholarshipAward.encumbered_cents for awards on this enrollment with status IN {ENCUMBERED, PARTIALLY_DISBURSED, DISBURSED}."
        default: 0
      - name: copay_cents
        type: integer
        source: computed
        description: "max(0, program_fee_cents - scholarship_applied_cents)."
        default: 0
      - name: transport_fee_cents
        type: integer
        source: computed
        description: "Sum of TransportBooking.fare_cents for bookings on this enrollment with status IN {RESERVED, CONFIRMED, RIDDEN}."
        default: 0
      - name: sibling_discount_bp
        type: integer
        source: computed
        description: "SIBLING_DISCOUNT_BP (1500) when the household has at least SIBLING_DISCOUNT_MIN_ENROLLED (2) CONFIRMED enrollments on the same session, else 0."
        default: 0
      - name: family_responsibility_cents
        type: integer
        source: computed
        description: "See calculations.family_responsibility_total_cents."
        default: 0
      - name: amount_paid_cents
        type: integer
        source: computed
        description: "Running total of accepted family payments on this charge."
        default: 0
      - name: balance_cents
        type: integer
        source: computed
        description: "family_responsibility_cents - amount_paid_cents; may be negative only transiently, and is clamped at 0 by the recompute rule."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "See calculations.enrollment_charge_settlement for the exact derivation of each value."
        default: "QUOTED"
        constraints: "One of QUOTED, OUTSTANDING, SETTLED, VOIDED"

  - name: StaffMember
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Staff member name."
      - name: role_title
        type: string
        source: input
        description: "Free-text job title, e.g. 'Recreation Therapist'."

  - name: StaffCertification
    parent: StaffMember
    common_fields: true
    fields:
      - name: staff_member_id
        type: string
        source: input
        description: "FK -> StaffMember.id; the certified staffer."
      - name: certification_type
        type: enum
        source: input
        description: "Which certification this row records."
        constraints: "One of ADAPTIVE_AQUATICS, BEHAVIOR_SUPPORT, MEDICATION_ADMIN, CPR"
      - name: issued_on
        type: string
        source: input
        description: "ISO date YYYY-MM-DD the certification was issued."
      - name: expires_on
        type: string
        source: input
        description: "ISO date YYYY-MM-DD the certification lapses; validity is inclusive (valid while expires_on >= the date being checked)."
      - name: status
        type: enum
        source: system
        description: "Certification validity axis, advanced by the clock checkpoint."
        default: "VALID"
        constraints: "One of VALID, EXPIRED"

  - name: StaffAssignment
    parent: ProgramSession
    common_fields: true
    fields:
      - name: session_id
        type: string
        source: input
        description: "FK -> ProgramSession.id; the session staffed."
      - name: staff_member_id
        type: string
        source: input
        description: "FK -> StaffMember.id; the assigned staffer."
      - name: dedicated_participant_id
        type: string
        source: input
        description: "FK -> Participant.id; required when assignment_role == ONE_TO_ONE, null otherwise."
        default: null
      - name: assignment_role
        type: enum
        source: input
        description: "LEAD and GROUP count toward assigned_group_staff_count; ONE_TO_ONE counts toward one_to_one_staffed only."
        constraints: "One of LEAD, GROUP, ONE_TO_ONE"
      - name: qualified_at_assignment
        type: boolean
        source: computed
        description: "AT_ASSIGNMENT variant of calculations.staff_certification_validity, frozen at creation."
      - name: qualified_at_session_date
        type: boolean
        source: computed
        description: "AT_SESSION_DATE variant of calculations.staff_certification_validity, recomputed on staffing lock, on revalidate, and by the clock checkpoint."
      - name: status
        type: enum
        source: system
        description: "Assignment lifecycle axis with a lapse/restore loop."
        default: "PROPOSED"
        constraints: "One of PROPOSED, CONFIRMED, LAPSED, WITHDRAWN, DELIVERED"

  - name: EquipmentItem
    parent: null
    common_fields: true
    fields:
      - name: item_kind
        type: enum
        source: input
        description: "SERIALIZED rows are single physical units with an inspection cycle; POOLED rows are fungible consumables tracked by count."
        constraints: "One of SERIALIZED, POOLED"
      - name: model_code
        type: string
        source: input
        description: "Adaptive-equipment model code, matched against ActivityProgram.required_equipment_model_code."
      - name: size_code
        type: string
        source: input
        description: "Size code, matched exactly against ActivityProgram.required_equipment_size_code."
      - name: weight_capacity_kg
        type: integer
        source: input
        description: "Maximum supported participant weight in whole kilograms; fit requires weight_capacity_kg >= participant.weight_kg + WEIGHT_CAPACITY_TOLERANCE_KG (0)."
        constraints: ">= 0"
      - name: serial_number
        type: string
        source: input
        description: "Physical serial; required when item_kind == SERIALIZED, null when POOLED."
        default: null
      - name: inspection_due_date
        type: string
        source: input
        description: "ISO date YYYY-MM-DD the next inspection is due; required when item_kind == SERIALIZED, null when POOLED."
        default: null
      - name: condition_status
        type: enum
        source: system
        description: "Condition axis with an inspection loop. POOLED rows stay SERVICEABLE unless retired."
        default: "SERVICEABLE"
        constraints: "One of SERVICEABLE, INSPECTION_DUE, OUT_OF_SERVICE, RETIRED"
      - name: pooled_total
        type: integer
        source: input
        description: "Total units held for a POOLED row; 1 for SERIALIZED rows."
        default: 1
        constraints: ">= 1"
      - name: pooled_available
        type: integer
        source: computed
        description: "pooled_total - pooled_held - pooled_checked_out; conserved by invariant pooled_equipment_conservation."
      - name: pooled_held
        type: integer
        source: computed
        description: "Count of EquipmentReservation rows on this item with status == HELD."
        default: 0
      - name: pooled_checked_out
        type: integer
        source: computed
        description: "Count of EquipmentReservation rows on this item with status == CHECKED_OUT."
        default: 0

  - name: EquipmentReservation
    parent: EquipmentItem
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the enrollment the equipment is held for."
      - name: equipment_item_id
        type: string
        source: input
        description: "FK -> EquipmentItem.id; the reserved item."
      - name: return_condition
        type: enum
        source: input
        description: "Condition reported at return; null until the return transition runs."
        default: null
        constraints: "One of GOOD, DAMAGED, or null"
      - name: status
        type: enum
        source: system
        description: "Reservation lifecycle axis, a branching fork with divergent side-effect sets per branch."
        default: "HELD"
        constraints: "One of HELD, CHECKED_OUT, RETURNED_GOOD, RETURNED_DAMAGED, RELEASED, VOIDED_INSPECTION_FAIL"

  - name: TransportRun
    parent: ProgramSession
    common_fields: true
    fields:
      - name: session_id
        type: string
        source: input
        description: "FK -> ProgramSession.id; the session this run serves."
      - name: pickup_start_at
        type: datetime
        source: input
        description: "ISO 8601 UTC start of the pickup window."
      - name: pickup_end_at
        type: datetime
        source: input
        description: "ISO 8601 UTC end of the pickup window."
        constraints: "pickup_end_at > pickup_start_at"
      - name: fare_mode
        type: enum
        source: input
        description: "Branch condition selecting the transport_fare_cents variant."
        constraints: "One of FLAT, ZONE_MILEAGE"
      - name: flat_fare_cents
        type: integer
        source: input
        description: "Fare used by the FLAT variant; ignored by ZONE_MILEAGE."
        default: 0
        constraints: ">= 0"
      - name: route_miles_x10
        type: integer
        source: input
        description: "Route length in tenths of a mile (integer); used by the ZONE_MILEAGE variant."
        default: 0
        constraints: ">= 0"
      - name: accessible_positions
        type: integer
        source: input
        description: "Wheelchair-securement positions on the vehicle. Never interchangeable with ambulatory_seats."
        constraints: ">= 0"
      - name: accessible_committed
        type: integer
        source: computed
        description: "Count of TransportBooking rows on this run with position_type == ACCESSIBLE and status IN {RESERVED, CONFIRMED, RIDDEN}."
        default: 0
      - name: accessible_available
        type: integer
        source: computed
        description: "accessible_positions - accessible_committed; conserved by invariant transport_position_conservation."
      - name: ambulatory_seats
        type: integer
        source: input
        description: "Ordinary seats on the vehicle. Never interchangeable with accessible_positions."
        constraints: ">= 0"
      - name: ambulatory_committed
        type: integer
        source: computed
        description: "Count of TransportBooking rows on this run with position_type == AMBULATORY and status IN {RESERVED, CONFIRMED, RIDDEN}."
        default: 0
      - name: ambulatory_available
        type: integer
        source: computed
        description: "ambulatory_seats - ambulatory_committed; conserved by invariant transport_position_conservation."
      - name: status
        type: enum
        source: system
        description: "Run occupancy axis, driven entirely by booking cascades; re-enters PLANNED when a counter frees."
        default: "PLANNED"
        constraints: "One of PLANNED, BOARDING_FULL, CANCELLED"

  - name: TransportBooking
    parent: TransportRun
    common_fields: true
    fields:
      - name: transport_run_id
        type: string
        source: input
        description: "FK -> TransportRun.id; the run booked."
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the enrollment riding."
      - name: position_type
        type: enum
        source: input
        description: "Exactly one position is consumed; ACCESSIBLE draws from accessible_positions, AMBULATORY from ambulatory_seats."
        constraints: "One of ACCESSIBLE, AMBULATORY"
      - name: fare_cents
        type: integer
        source: computed
        description: "See calculations.transport_fare_cents; pinned at booking creation."
      - name: status
        type: enum
        source: system
        description: "Booking lifecycle axis."
        default: "RESERVED"
        constraints: "One of RESERVED, CONFIRMED, RIDDEN, NO_SHOW, CANCELLED"

  - name: FundingSource
    parent: OperatingPeriod
    common_fields: true
    fields:
      - name: operating_period_id
        type: string
        source: input
        description: "FK -> OperatingPeriod.id; the fiscal period that bounds this source."
      - name: name
        type: string
        source: input
        description: "Funding source label."
      - name: source_kind
        type: enum
        source: input
        description: "Restricted grants are drawn before general funds."
        constraints: "One of RESTRICTED_GRANT, GENERAL_FUND"
      - name: priority_rank
        type: integer
        source: input
        description: "Draw order; lower rank is drawn first by the funding selector."
        constraints: ">= 1"
      - name: award_mode
        type: enum
        source: input
        description: "Branch condition selecting the scholarship_award_amount_cents variant."
        constraints: "One of NEED_PCT, FLAT_CAP"
      - name: award_pct_bp
        type: integer
        source: input
        description: "Percentage of net need awarded under the NEED_PCT variant, in basis points."
        default: 0
        constraints: "0 <= award_pct_bp <= 10000"
      - name: flat_award_cents
        type: integer
        source: input
        description: "Per-enrollment cap awarded under the FLAT_CAP variant."
        default: 0
        constraints: ">= 0"
      - name: total_budget_cents
        type: integer
        source: input
        description: "Immutable ceiling; conserved by invariant funding_ledger_conservation."
        constraints: ">= 0"
      - name: available_cents
        type: integer
        source: computed
        description: "Unencumbered remainder. Initialised to total_budget_cents."
      - name: encumbered_cents
        type: integer
        source: computed
        description: "Committed but not yet paid out."
        default: 0
      - name: disbursed_cents
        type: integer
        source: computed
        description: "Paid out."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Source availability axis; re-enters OPEN when a release restores available_cents above FUNDING_EXHAUSTED_AT_AVAILABLE_CENTS (0)."
        default: "OPEN"
        constraints: "One of OPEN, EXHAUSTED, CLOSED"

  - name: ScholarshipAward
    parent: FundingSource
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the enrollment subsidised."
      - name: funding_source_id
        type: string
        source: input
        description: "FK -> FundingSource.id; the source drawn from. Optional on create — when omitted the funding selector picks it."
      - name: awarded_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the FundingOfficer who created the award; the same user may not disburse it (segregation of duties). Not a foreign key."
      - name: disbursed_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the FundingOfficer who disbursed; null until a disbursement occurs. Not a foreign key."
        default: null
      - name: amount_cents
        type: integer
        source: computed
        description: "See calculations.scholarship_award_amount_cents; pinned at creation."
      - name: encumbered_cents
        type: integer
        source: computed
        description: "Amount currently held against the source for this award."
        default: 0
      - name: disbursed_cents
        type: integer
        source: computed
        description: "Amount already paid out for this award."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Award lifecycle axis."
        default: "PROPOSED"
        constraints: "One of PROPOSED, ENCUMBERED, PARTIALLY_DISBURSED, DISBURSED, RELEASED, LAPSED_NO_FUNDS"

  - name: Goal
    parent: Participant
    common_fields: true
    fields:
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id; whose goal this is."
      - name: title
        type: string
        source: input
        description: "Goal statement."
      - name: measure
        type: string
        source: input
        description: "What is scored, e.g. 'independent transfers per session'."
      - name: baseline_value
        type: integer
        source: input
        description: "Baseline rating recorded at goal creation."
        constraints: "RATING_SCORE_MIN 1 <= baseline_value <= RATING_SCORE_MAX 5"
      - name: target_value
        type: integer
        source: input
        description: "Target rating."
        constraints: "RATING_SCORE_MIN 1 <= target_value <= RATING_SCORE_MAX 5"
      - name: mastery_mode
        type: enum
        source: input
        description: "Branch condition selecting the goal_mastery_status variant."
        constraints: "One of N_OF_M, CONSECUTIVE"
      - name: mastery_criterion_score
        type: integer
        source: input
        description: "A rating at or above this score counts as a hit."
        constraints: "RATING_SCORE_MIN 1 <= mastery_criterion_score <= RATING_SCORE_MAX 5"
      - name: mastery_window_m
        type: integer
        source: input
        description: "The M in 'N of the last M rated sessions'."
        default: 5
        constraints: ">= 1"
      - name: mastery_hits_n
        type: integer
        source: input
        description: "The N in 'N of the last M rated sessions'."
        default: 4
        constraints: "1 <= mastery_hits_n <= mastery_window_m"
      - name: review_due_on
        type: string
        source: input
        description: "ISO date YYYY-MM-DD the goal is next reviewed."
      - name: rating_count
        type: integer
        source: computed
        description: "Count of GoalRating rows whose goal_id == this goal."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Goal axis; non-monotone — a goal may leave and re-enter MASTERED as newer ratings arrive."
        default: "ACTIVE"
        constraints: "One of ACTIVE, MASTERED, DISCONTINUED"

  - name: GoalRating
    parent: Goal
    common_fields: false
    fields:
      - name: goal_id
        type: string
        source: input
        description: "FK -> Goal.id; the goal rated."
      - name: session_id
        type: string
        source: input
        description: "FK -> ProgramSession.id; the session the rating is anchored to."
      - name: rated_by_staff_id
        type: string
        source: input
        description: "FK -> StaffMember.id; the ActivityLead who recorded the rating."
      - name: score
        type: integer
        source: input
        description: "Rating on the goal's measure."
        constraints: "RATING_SCORE_MIN 1 <= score <= RATING_SCORE_MAX 5"
      - name: rated_session_start_at
        type: datetime
        source: computed
        description: "Copy of the rated ProgramSession.start_at, pinned at creation; the mastery window is ordered by this field DESC, then created_at DESC."
      - name: note
        type: string
        source: input
        description: "Free-text progress note."
        default: ""

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: OperatingPeriod
    axis: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "POST /recreation/operating-periods/{period_id}/posture with target_status RESTRICTED"
        actor: ProgramAdmin
        preconditions: ["period.status == OPEN"]
        side_effects: ["Financial-write endpoints listed in validations[priority=10] begin rejecting with ERR_PERIOD_RESTRICTED", "increments OperatingPeriod.version by 1"]
      - from: RESTRICTED
        to: OPEN
        trigger: "POST /recreation/operating-periods/{period_id}/posture with target_status OPEN"
        actor: ProgramAdmin
        preconditions: ["period.status == RESTRICTED"]
        side_effects: ["Financial-write endpoints resume accepting requests", "increments OperatingPeriod.version by 1"]
      - from: OPEN
        to: FROZEN
        trigger: "POST /recreation/operating-periods/{period_id}/posture with target_status FROZEN"
        actor: ProgramAdmin
        preconditions: ["period.status == OPEN"]
        side_effects: ["Global write gate engages: every mutating endpoint except POST /recreation/_clock/set_current_utc and POST /recreation/operating-periods/{period_id}/posture rejects with ERR_PERIOD_FROZEN", "increments OperatingPeriod.version by 1"]
      - from: RESTRICTED
        to: FROZEN
        trigger: "POST /recreation/operating-periods/{period_id}/posture with target_status FROZEN"
        actor: ProgramAdmin
        preconditions: ["period.status == RESTRICTED"]
        side_effects: ["Global write gate engages", "increments OperatingPeriod.version by 1"]
      - from: FROZEN
        to: OPEN
        trigger: "POST /recreation/operating-periods/{period_id}/posture with target_status OPEN"
        actor: ProgramAdmin
        preconditions: ["period.status == FROZEN"]
        side_effects: ["Global write gate disengages", "increments OperatingPeriod.version by 1"]
      - from: OPEN
        to: CLOSING
        trigger: "POST /recreation/operating-periods/{period_id}/posture with target_status CLOSING"
        actor: ProgramAdmin
        preconditions: ["period.status == OPEN"]
        side_effects: ["Behaves like RESTRICTED for the global write gate", "increments OperatingPeriod.version by 1"]
      - from: CLOSING
        to: CLOSED
        trigger: "POST /recreation/operating-periods/{period_id}/posture with target_status CLOSED"
        actor: ProgramAdmin
        preconditions: ["period.status == CLOSING"]
        side_effects:
          - "CASCADE F hop 1: period.status := CLOSED."
          - "CASCADE F hop 2 (caused by hop 1): every FundingSource whose operating_period_id == this period and whose status IN {OPEN, EXHAUSTED} transitions to CLOSED."
          - "CASCADE F hop 3 (caused by hop 2): every ScholarshipAward on each newly CLOSED source whose status == PROPOSED transitions to LAPSED_NO_FUNDS."
          - "CASCADE F hop 4 (caused by hop 3): each lapsed award's Enrollment.funding_status transitions QUOTED -> UNFUNDED."
          - "increments OperatingPeriod.version by 1, and the version of every entity touched by hops 2-4"
        note: "CLOSED is terminal and the gate treats it exactly like FROZEN, so a test that closes the current period must afterwards move the logical clock outside [starts_on, ends_on] or create a later period to resume writing."
      - from: CLOSING
        to: OPEN
        trigger: "POST /recreation/operating-periods/{period_id}/posture with target_status OPEN"
        actor: ProgramAdmin
        preconditions: ["period.status == CLOSING"]
        side_effects: ["Close is abandoned; no funding source is touched", "increments OperatingPeriod.version by 1"]

  - entity: Participant
    axis: status
    initial_state: INTAKE
    terminal_states: [EXITED]
    transitions:
      - from: INTAKE
        to: ACTIVE
        trigger: "POST /recreation/participants/{participant_id}/status with target_status ACTIVE"
        actor: IntakeCoordinator
        preconditions:
          - "participant.status == INTAKE"
          - "at least one SupportAssessment with participant_id == participant.id has status == ACTIVE"
        side_effects: ["participant.effective_support_tier is refreshed from the ACTIVE SupportAssessment", "increments Participant.version by 1"]
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /recreation/participants/{participant_id}/status with target_status INACTIVE"
        actor: IntakeCoordinator
        preconditions: ["participant.status == ACTIVE"]
        side_effects: ["No enrollment may be created or confirmed while INACTIVE (validations[priority=33])", "increments Participant.version by 1"]
      - from: INACTIVE
        to: ACTIVE
        trigger: "POST /recreation/participants/{participant_id}/status with target_status ACTIVE"
        actor: IntakeCoordinator
        preconditions:
          - "participant.status == INACTIVE"
          - "at least one SupportAssessment with participant_id == participant.id has status == ACTIVE"
        side_effects: ["increments Participant.version by 1"]
        note: "Re-entry into ACTIVE — the axis is cyclic, not linear."
      - from: ACTIVE
        to: EXITED
        trigger: "POST /recreation/participants/{participant_id}/status with target_status EXITED"
        actor: IntakeCoordinator
        preconditions: ["participant.status == ACTIVE"]
        side_effects:
          - "CASCADE E hop 1: participant.status := EXITED."
          - "CASCADE E hop 2 (caused by hop 1): every Goal whose participant_id == this participant and whose status IN {ACTIVE, MASTERED} transitions to DISCONTINUED."
          - "CASCADE E hop 3 (also caused by hop 1): every Enrollment of this participant whose enrollment_status IN {REQUESTED, WAITLISTED, CONFIRMED} and whose session.start_at > logical clock transitions to WITHDRAWN, running the full CASCADE A side-effect set for each."
          - "increments Participant.version by 1"
      - from: INACTIVE
        to: EXITED
        trigger: "POST /recreation/participants/{participant_id}/status with target_status EXITED"
        actor: IntakeCoordinator
        preconditions: ["participant.status == INACTIVE"]
        side_effects: ["Same CASCADE E hops 2 and 3 as from ACTIVE", "increments Participant.version by 1"]

  - entity: SupportAssessment
    axis: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /recreation/support-assessments/{assessment_id}/activate"
        actor: IntakeCoordinator
        preconditions: ["assessment.status == DRAFT"]
        side_effects:
          - "Any other SupportAssessment of the same participant with status == ACTIVE transitions to SUPERSEDED."
          - "participant.effective_support_tier := this assessment's support_tier."
          - "For every Enrollment of this participant whose session.status IN {DRAFT, OPEN, STAFFING_LOCKED} and whose session.start_at >= this assessment's effective_from, effective_support_tier_at_session is recomputed and the session's required_group_staff_planned, one_to_one_committed, one_to_one_available and staffing_gap are recomputed. Enrollments on sessions with status == DELIVERED are NOT touched."
          - "increments SupportAssessment.version by 1 on both rows and Participant.version by 1"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "System, as a side effect of activating a newer SupportAssessment for the same participant"
        actor: system
        preconditions: ["assessment.status == ACTIVE", "a different SupportAssessment of the same participant is transitioning DRAFT -> ACTIVE"]
        side_effects: ["increments SupportAssessment.version by 1"]

  - entity: ConsentArtifact
    axis: status
    initial_state: PENDING_SIGNATURE
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING_SIGNATURE
        to: SIGNED
        trigger: "POST /recreation/consents/{consent_id}/sign"
        actor: CaregiverUser
        preconditions:
          - "consent.status == PENDING_SIGNATURE"
          - "the signer satisfies calculations.consent_signer_authority for this participant"
          - "consent.expires_on >= logical clock date"
        side_effects: ["consent.signed_on := logical clock date", "consent.signer_role := SELF or LEGAL_GUARDIAN per the authority rule", "consent.signed_by_caregiver_id := the acting Caregiver id, or null when signer_role == SELF", "increments ConsentArtifact.version by 1"]
      - from: SIGNED
        to: EXPIRED
        trigger: "System clock checkpoint: POST /recreation/_clock/set_current_utc"
        actor: system
        preconditions: ["consent.status == SIGNED", "consent.expires_on < the new logical clock date"]
        side_effects: ["Enrollments that relied on this consent begin failing validations[priority=34] at their next gate evaluation", "increments ConsentArtifact.version by 1"]
      - from: SIGNED
        to: REVOKED
        trigger: "POST /recreation/consents/{consent_id}/revoke"
        actor: CaregiverUser
        preconditions: ["consent.status == SIGNED"]
        side_effects: ["increments ConsentArtifact.version by 1"]
      - from: PENDING_SIGNATURE
        to: REVOKED
        trigger: "POST /recreation/consents/{consent_id}/revoke"
        actor: IntakeCoordinator
        preconditions: ["consent.status == PENDING_SIGNATURE"]
        side_effects: ["increments ConsentArtifact.version by 1"]

  - entity: ProgramSession
    axis: status
    initial_state: DRAFT
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /recreation/program-sessions/{session_id}/open"
        actor: ActivityLead
        preconditions: ["session.status == DRAFT", "session.start_at > logical clock"]
        side_effects: ["Enrollments may now be created and confirmed against this session", "increments ProgramSession.version by 1"]
      - from: OPEN
        to: STAFFING_LOCKED
        trigger: "POST /recreation/program-sessions/{session_id}/lock-staffing"
        actor: ActivityLead
        preconditions:
          - "session.status == OPEN"
          - "session.staffing_gap == 0 after recomputation"
          - "every StaffAssignment on the session with status IN {PROPOSED, CONFIRMED} has qualified_at_session_date == true"
          - "when program.requires_medication_admin is true, at least one StaffAssignment on the session with status IN {PROPOSED, CONFIRMED} is held by a StaffMember with a VALID MEDICATION_ADMIN certification whose expires_on >= date(session.start_at)"
        side_effects: ["Every StaffAssignment on the session with status == PROPOSED transitions to CONFIRMED", "New Enrollments may no longer be created against the session", "increments ProgramSession.version by 1"]
      - from: STAFFING_LOCKED
        to: OPEN
        trigger: "POST /recreation/program-sessions/{session_id}/unlock-staffing, or system as CASCADE C hop 4"
        actor: ActivityLead
        preconditions: ["session.status == STAFFING_LOCKED", "session.unlock_count < MAX_SESSION_UNLOCKS (2)"]
        side_effects: ["session.unlock_count += 1", "increments ProgramSession.version by 1"]
        note: "Capped retry loop: the third unlock attempt is rejected with ERR_UNLOCK_LIMIT_REACHED, and the system-triggered CASCADE C hop 4 is skipped (leaving the session STAFFING_LOCKED with a non-zero staffing_gap) once the cap is reached."
      - from: STAFFING_LOCKED
        to: DELIVERED
        trigger: "POST /recreation/program-sessions/{session_id}/deliver"
        actor: ActivityLead
        preconditions: ["session.status == STAFFING_LOCKED", "logical clock >= session.end_at"]
        side_effects:
          - "Every Enrollment on the session still in enrollment_status == CONFIRMED transitions to NO_SHOW."
          - "session.required_group_staff_delivered := the DELIVERED variant of calculations.required_group_staff_count (roster = ATTENDED enrollments)."
          - "Every StaffAssignment on the session with status == CONFIRMED transitions to DELIVERED."
          - "Every EnrollmentCharge on ATTENDED enrollments is finalised: status recomputed per calculations.enrollment_charge_settlement."
          - "increments ProgramSession.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /recreation/program-sessions/{session_id}/cancel"
        actor: ActivityLead
        preconditions: ["session.status == DRAFT"]
        side_effects: ["increments ProgramSession.version by 1"]
      - from: OPEN
        to: CANCELLED
        trigger: "POST /recreation/program-sessions/{session_id}/cancel"
        actor: ActivityLead
        preconditions: ["session.status == OPEN"]
        side_effects:
          - "CASCADE B hop 1: session.status := CANCELLED."
          - "CASCADE B hop 2 (caused by hop 1): every Enrollment on the session with enrollment_status IN {REQUESTED, WAITLISTED, CONFIRMED} transitions to WITHDRAWN; session.slots_committed and one_to_one_committed drop to 0 and slots_available / one_to_one_available are restored."
          - "CASCADE B hop 3 (caused by hop 2): every TransportBooking of those enrollments with status IN {RESERVED, CONFIRMED} transitions to CANCELLED."
          - "CASCADE B hop 4 (caused by hop 3): each affected TransportRun decrements accessible_committed or ambulatory_committed (never both) and, when its status == BOARDING_FULL and either counter is now above 0, transitions BOARDING_FULL -> PLANNED."
          - "Waitlist promotion does NOT run for slots released by CASCADE B."
          - "increments ProgramSession.version by 1 and the version of every entity touched by hops 2-4"
      - from: STAFFING_LOCKED
        to: CANCELLED
        trigger: "POST /recreation/program-sessions/{session_id}/cancel"
        actor: ActivityLead
        preconditions: ["session.status == STAFFING_LOCKED"]
        side_effects:
          - "Same CASCADE B hops 2-4 as from OPEN."
          - "Every StaffAssignment on the session with status IN {PROPOSED, CONFIRMED, LAPSED} transitions to WITHDRAWN."
          - "increments ProgramSession.version by 1"

  - entity: Enrollment
    axis: enrollment_status
    initial_state: REQUESTED
    terminal_states: [ATTENDED, NO_SHOW, WITHDRAWN, DENIED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /recreation/enrollments/{enrollment_id}/confirm"
        actor: IntakeCoordinator
        preconditions:
          - "enrollment.enrollment_status == REQUESTED"
          - "all six ordered sub-gates of validations[priority=34] through validations[priority=60] pass in ladder order"
        side_effects:
          - "session.slots_committed += 1 and session.slots_available -= 1."
          - "when enrollment.effective_support_tier_at_session == ONE_TO_ONE: session.one_to_one_committed += 1 and session.one_to_one_available -= 1."
          - "session.required_group_staff_planned and session.staffing_gap are recomputed."
          - "every ScholarshipAward on this enrollment with status == PROPOSED transitions to ENCUMBERED (which moves cents from the source's available_cents to its encumbered_cents), and enrollment.funding_status advances QUOTED -> ENCUMBERED."
          - "this enrollment's EnrollmentCharge is recomputed, then every OTHER EnrollmentCharge whose enrollment is CONFIRMED on the same session and whose participant shares this participant's household_id is recomputed in created_at ASC order (sibling-discount fixpoint, see calculations.family_responsibility_total_cents)."
          - "every TransportBooking on this enrollment with status == RESERVED transitions to CONFIRMED."
          - "increments Enrollment.version by 1 and ProgramSession.version by 1"
      - from: REQUESTED
        to: WAITLISTED
        trigger: "POST /recreation/enrollments/{enrollment_id}/confirm with on_full WAITLIST"
        actor: IntakeCoordinator
        preconditions:
          - "enrollment.enrollment_status == REQUESTED"
          - "sub-gates A, B (consent, assessment) and D, E (equipment, transport) pass"
          - "sub-gate C (capacity) fails: session.slots_available == 0, or the participant's tier is ONE_TO_ONE and session.one_to_one_available == 0"
        side_effects: ["enrollment.waitlist_score := calculations.waitlist_priority_score", "no counter on the session changes", "increments Enrollment.version by 1"]
      - from: REQUESTED
        to: DENIED
        trigger: "POST /recreation/enrollments/{enrollment_id}/confirm with on_full DENY"
        actor: IntakeCoordinator
        preconditions:
          - "enrollment.enrollment_status == REQUESTED"
          - "sub-gate C (capacity) fails"
        side_effects: ["enrollment.funding_status transitions to RELEASED when it was ENCUMBERED, releasing any award", "the EnrollmentCharge status becomes VOIDED", "increments Enrollment.version by 1"]
      - from: WAITLISTED
        to: CONFIRMED
        trigger: "System, as CASCADE A hop 3 of POST /recreation/enrollments/{enrollment_id}/withdraw"
        actor: system
        preconditions:
          - "enrollment.enrollment_status == WAITLISTED"
          - "this row is the top-ranked candidate under calculations.waitlist_priority_score"
          - "this row independently satisfies every one of the six ordered sub-gates, evaluated in the same order as a client-driven confirm"
        side_effects:
          - "enrollment.promoted_at := logical clock"
          - "the same counter, award, charge and booking side effects as REQUESTED -> CONFIRMED"
          - "increments Enrollment.version by 1 and ProgramSession.version by 1"
        note: "At most PROMOTIONS_PER_RELEASE (1) promotion runs per released slot. Candidates that fail any sub-gate are skipped and the next-ranked candidate is tried, until one succeeds or the waitlist is exhausted."
      - from: CONFIRMED
        to: WAITLISTED
        trigger: "System, as CASCADE A hop 8 or CASCADE F hop 4, when the enrollment's funding lapses"
        actor: system
        preconditions:
          - "enrollment.enrollment_status == CONFIRMED"
          - "enrollment.funding_status has just become UNFUNDED"
          - "participant.income_band IN SUBSIDY_REQUIRED_INCOME_BANDS ['BAND_A', 'BAND_B']"
        side_effects:
          - "session.slots_committed -= 1 and session.slots_available += 1; when the tier is ONE_TO_ONE, one_to_one_committed -= 1 and one_to_one_available += 1."
          - "session.required_group_staff_planned and staffing_gap are recomputed."
          - "enrollment.waitlist_score is recomputed."
          - "increments Enrollment.version by 1 and ProgramSession.version by 1"
        note: "Re-entry edge. Waitlist promotion is deliberately NOT run for a slot released by this demotion — that pin is what makes the cascade terminate."
      - from: CONFIRMED
        to: ATTENDED
        trigger: "POST /recreation/enrollments/{enrollment_id}/attendance with outcome ATTENDED"
        actor: ActivityLead
        preconditions: ["enrollment.enrollment_status == CONFIRMED", "session.status == STAFFING_LOCKED", "logical clock >= session.start_at"]
        side_effects: ["the enrollment's TransportBooking with status == CONFIRMED transitions to RIDDEN", "increments Enrollment.version by 1"]
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /recreation/enrollments/{enrollment_id}/attendance with outcome NO_SHOW, or system during POST /recreation/program-sessions/{session_id}/deliver"
        actor: ActivityLead
        preconditions: ["enrollment.enrollment_status == CONFIRMED", "session.status == STAFFING_LOCKED", "logical clock >= session.start_at"]
        side_effects: ["the enrollment's TransportBooking with status == CONFIRMED transitions to NO_SHOW", "increments Enrollment.version by 1"]
      - from: CONFIRMED
        to: WITHDRAWN
        trigger: "POST /recreation/enrollments/{enrollment_id}/withdraw"
        actor: IntakeCoordinator
        preconditions: ["enrollment.enrollment_status == CONFIRMED", "session.status IN {OPEN, STAFFING_LOCKED}"]
        side_effects:
          - "CASCADE A hop 1: enrollment.enrollment_status := WITHDRAWN."
          - "CASCADE A hop 2 (caused by hop 1): session.slots_committed -= 1, session.slots_available += 1; when the tier is ONE_TO_ONE, one_to_one_committed -= 1 and one_to_one_available += 1; required_group_staff_planned and staffing_gap recomputed. Every EquipmentReservation of this enrollment with status IN {HELD, CHECKED_OUT} transitions to RELEASED and its item's pooled counters are restored. Every TransportBooking of this enrollment with status IN {RESERVED, CONFIRMED} transitions to CANCELLED and its run's position counter is restored. Every StaffAssignment with assignment_role == ONE_TO_ONE and dedicated_participant_id == this participant on this session transitions to WITHDRAWN. Every ScholarshipAward on this enrollment with status IN {PROPOSED, ENCUMBERED, PARTIALLY_DISBURSED} transitions to RELEASED, restoring its release amount to its source; enrollment.funding_status becomes RELEASED. The EnrollmentCharge status becomes VOIDED."
          - "CASCADE A hop 3 (caused by the freed slot in hop 2): the top-ranked WAITLISTED Enrollment on this session that independently satisfies all six sub-gates transitions WAITLISTED -> CONFIRMED."
          - "CASCADE A hop 4 (caused by hop 3): that promoted enrollment's ScholarshipAward with status == PROPOSED transitions to ENCUMBERED."
          - "CASCADE A hop 5 (caused by hop 4): its FundingSource.available_cents -= award.amount_cents and encumbered_cents += award.amount_cents."
          - "CASCADE A hop 6 (caused by hop 5): when that source's available_cents reaches FUNDING_EXHAUSTED_AT_AVAILABLE_CENTS (0), the source transitions OPEN -> EXHAUSTED."
          - "CASCADE A hop 7 (caused by hop 6): every ScholarshipAward on that now-EXHAUSTED source whose status == PROPOSED transitions to LAPSED_NO_FUNDS."
          - "CASCADE A hop 8 (caused by hop 7): each lapsed award's Enrollment.funding_status becomes UNFUNDED, and when that enrollment is CONFIRMED and its participant.income_band is in SUBSIDY_REQUIRED_INCOME_BANDS it is demoted CONFIRMED -> WAITLISTED."
          - "increments Enrollment.version by 1 and the version of every entity touched by hops 2-8"
      - from: WAITLISTED
        to: WITHDRAWN
        trigger: "POST /recreation/enrollments/{enrollment_id}/withdraw"
        actor: IntakeCoordinator
        preconditions: ["enrollment.enrollment_status == WAITLISTED"]
        side_effects: ["No session counter changes (a waitlisted row never held one) and no waitlist promotion runs", "any ScholarshipAward on the enrollment with status IN {PROPOSED, ENCUMBERED} transitions to RELEASED", "the EnrollmentCharge status becomes VOIDED", "increments Enrollment.version by 1"]
      - from: REQUESTED
        to: WITHDRAWN
        trigger: "POST /recreation/enrollments/{enrollment_id}/withdraw"
        actor: IntakeCoordinator
        preconditions: ["enrollment.enrollment_status == REQUESTED"]
        side_effects: ["Same as from WAITLISTED", "increments Enrollment.version by 1"]

  - entity: Enrollment
    axis: funding_status
    initial_state: QUOTED
    terminal_states: [DISBURSED]
    transitions:
      - from: QUOTED
        to: ENCUMBERED
        trigger: "POST /recreation/scholarship-awards/{award_id}/encumber, or the auto-encumber side effect of enrollment confirmation"
        actor: FundingOfficer
        preconditions: ["enrollment.funding_status == QUOTED", "a ScholarshipAward on this enrollment has just entered status ENCUMBERED"]
        side_effects: ["the EnrollmentCharge's scholarship_applied_cents, copay_cents and family_responsibility_cents are recomputed", "increments Enrollment.version by 1"]
      - from: ENCUMBERED
        to: DISBURSED
        trigger: "POST /recreation/scholarship-awards/{award_id}/disburse that brings the award to status DISBURSED"
        actor: FundingOfficer
        preconditions: ["enrollment.funding_status == ENCUMBERED", "the award's disbursed_cents == its encumbered_cents"]
        side_effects: ["increments Enrollment.version by 1"]
      - from: ENCUMBERED
        to: RELEASED
        trigger: "POST /recreation/scholarship-awards/{award_id}/release, or CASCADE A hop 2"
        actor: FundingOfficer
        preconditions: ["enrollment.funding_status == ENCUMBERED"]
        side_effects: ["the EnrollmentCharge's scholarship_applied_cents drops to 0 and copay_cents / family_responsibility_cents are recomputed", "increments Enrollment.version by 1"]
      - from: QUOTED
        to: UNFUNDED
        trigger: "System, as CASCADE A hop 8 or CASCADE F hop 4, when the enrollment's only award lapses"
        actor: system
        preconditions: ["enrollment.funding_status == QUOTED", "every ScholarshipAward on the enrollment now has status IN {LAPSED_NO_FUNDS, RELEASED}"]
        side_effects: ["may trigger the CONFIRMED -> WAITLISTED demotion on the enrollment_status axis", "increments Enrollment.version by 1"]
      - from: UNFUNDED
        to: QUOTED
        trigger: "POST /recreation/scholarship-awards creating a new PROPOSED award on this enrollment"
        actor: FundingOfficer
        preconditions: ["enrollment.funding_status == UNFUNDED", "enrollment.enrollment_status NOT IN {WITHDRAWN, DENIED, ATTENDED, NO_SHOW}"]
        side_effects: ["increments Enrollment.version by 1"]
        note: "Re-entry edge on the money axis; it evolves independently of the roster axis on the same row."
      - from: RELEASED
        to: QUOTED
        trigger: "POST /recreation/scholarship-awards creating a new PROPOSED award on this enrollment"
        actor: FundingOfficer
        preconditions: ["enrollment.funding_status == RELEASED", "enrollment.enrollment_status NOT IN {WITHDRAWN, DENIED, ATTENDED, NO_SHOW}"]
        side_effects: ["increments Enrollment.version by 1"]

  - entity: StaffCertification
    axis: status
    initial_state: VALID
    terminal_states: []
    transitions:
      - from: VALID
        to: EXPIRED
        trigger: "System clock checkpoint: POST /recreation/_clock/set_current_utc"
        actor: system
        preconditions: ["certification.status == VALID", "certification.expires_on < the new logical clock date"]
        side_effects:
          - "CASCADE C hop 1: certification.status := EXPIRED."
          - "CASCADE C hop 2 (caused by hop 1): every StaffAssignment with status == CONFIRMED held by this staffer, on a session whose status IN {OPEN, STAFFING_LOCKED} and whose required_certification_types include this certification_type, transitions CONFIRMED -> LAPSED."
          - "CASCADE C hop 3 (caused by hop 2): each affected session's assigned_group_staff_count / one_to_one_staffed drops and staffing_gap is recomputed."
          - "CASCADE C hop 4 (caused by hop 3): each affected session whose status == STAFFING_LOCKED and whose recomputed staffing_gap > 0 transitions STAFFING_LOCKED -> OPEN and increments unlock_count, unless unlock_count is already MAX_SESSION_UNLOCKS (2), in which case the session stays STAFFING_LOCKED with a non-zero gap."
          - "increments StaffCertification.version by 1 and the version of every entity touched by hops 2-4"
      - from: EXPIRED
        to: VALID
        trigger: "POST /recreation/staff-certifications/{certification_id}/renew"
        actor: ProgramAdmin
        preconditions: ["certification.status == EXPIRED", "the submitted new_expires_on >= logical clock date"]
        side_effects: ["certification.expires_on := new_expires_on", "increments StaffCertification.version by 1"]
        note: "Renewal alone does NOT restore a LAPSED assignment; the assignment must be revalidated explicitly."
      - from: VALID
        to: VALID
        trigger: "POST /recreation/staff-certifications/{certification_id}/renew"
        actor: ProgramAdmin
        preconditions: ["certification.status == VALID", "the submitted new_expires_on > certification.expires_on"]
        side_effects: ["certification.expires_on := new_expires_on", "increments StaffCertification.version by 1"]

  - entity: StaffAssignment
    axis: status
    initial_state: PROPOSED
    terminal_states: [WITHDRAWN, DELIVERED]
    transitions:
      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /recreation/staff-assignments/{assignment_id}/confirm, or the lock-staffing side effect"
        actor: ActivityLead
        preconditions: ["assignment.status == PROPOSED", "assignment.qualified_at_session_date == true after recomputation", "session.status IN {OPEN, STAFFING_LOCKED}"]
        side_effects: ["session.staffing_gap recomputed", "increments StaffAssignment.version by 1"]
      - from: CONFIRMED
        to: LAPSED
        trigger: "System, as CASCADE C hop 2"
        actor: system
        preconditions: ["assignment.status == CONFIRMED", "a certification this assignment depends on has just transitioned VALID -> EXPIRED"]
        side_effects: ["assignment.qualified_at_session_date := false", "session.assigned_group_staff_count or one_to_one_staffed decremented and staffing_gap recomputed", "increments StaffAssignment.version by 1"]
      - from: LAPSED
        to: CONFIRMED
        trigger: "POST /recreation/staff-assignments/{assignment_id}/revalidate"
        actor: ActivityLead
        preconditions: ["assignment.status == LAPSED", "recomputed qualified_at_session_date == true", "session.status IN {OPEN, STAFFING_LOCKED}"]
        side_effects: ["session.assigned_group_staff_count or one_to_one_staffed restored and staffing_gap recomputed", "increments StaffAssignment.version by 1"]
        note: "Restore edge — the axis is a lapse/restore loop, not a linear pipeline."
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /recreation/staff-assignments/{assignment_id}/withdraw"
        actor: ActivityLead
        preconditions: ["assignment.status == PROPOSED"]
        side_effects: ["session counters and staffing_gap recomputed", "increments StaffAssignment.version by 1"]
      - from: CONFIRMED
        to: WITHDRAWN
        trigger: "POST /recreation/staff-assignments/{assignment_id}/withdraw"
        actor: ActivityLead
        preconditions: ["assignment.status == CONFIRMED", "session.status != DELIVERED"]
        side_effects: ["session counters and staffing_gap recomputed", "increments StaffAssignment.version by 1"]
      - from: LAPSED
        to: WITHDRAWN
        trigger: "POST /recreation/staff-assignments/{assignment_id}/withdraw"
        actor: ActivityLead
        preconditions: ["assignment.status == LAPSED"]
        side_effects: ["increments StaffAssignment.version by 1"]
      - from: CONFIRMED
        to: DELIVERED
        trigger: "System, during POST /recreation/program-sessions/{session_id}/deliver"
        actor: system
        preconditions: ["assignment.status == CONFIRMED", "session is transitioning STAFFING_LOCKED -> DELIVERED"]
        side_effects: ["increments StaffAssignment.version by 1"]

  - entity: EquipmentItem
    axis: condition_status
    initial_state: SERVICEABLE
    terminal_states: [RETIRED]
    transitions:
      - from: SERVICEABLE
        to: INSPECTION_DUE
        trigger: "System clock checkpoint: POST /recreation/_clock/set_current_utc"
        actor: system
        preconditions: ["item.item_kind == SERIALIZED", "item.condition_status == SERVICEABLE", "item.inspection_due_date < the new logical clock date"]
        side_effects: ["The item stops satisfying calculations.equipment_fit_eligibility; existing HELD reservations are left untouched", "increments EquipmentItem.version by 1"]
      - from: INSPECTION_DUE
        to: SERVICEABLE
        trigger: "POST /recreation/equipment-items/{item_id}/inspections with disposition PASS"
        actor: ProgramAdmin
        preconditions: ["item.condition_status == INSPECTION_DUE"]
        side_effects: ["item.inspection_due_date := logical clock date + INSPECTION_INTERVAL_DAYS (180)", "increments EquipmentItem.version by 1"]
      - from: OUT_OF_SERVICE
        to: SERVICEABLE
        trigger: "POST /recreation/equipment-items/{item_id}/inspections with disposition PASS"
        actor: ProgramAdmin
        preconditions: ["item.condition_status == OUT_OF_SERVICE"]
        side_effects: ["item.inspection_due_date := logical clock date + INSPECTION_INTERVAL_DAYS (180)", "increments EquipmentItem.version by 1"]
        note: "Cyclic axis: an item can move OUT_OF_SERVICE and back any number of times."
      - from: SERVICEABLE
        to: OUT_OF_SERVICE
        trigger: "POST /recreation/equipment-items/{item_id}/inspections with disposition FAIL, or the RETURNED_DAMAGED reservation branch"
        actor: ProgramAdmin
        preconditions: ["item.condition_status == SERVICEABLE"]
        side_effects:
          - "CASCADE D hop 1: item.condition_status := OUT_OF_SERVICE."
          - "CASCADE D hop 2 (caused by hop 1): every EquipmentReservation on this item with status == HELD transitions to VOIDED_INSPECTION_FAIL."
          - "CASCADE D hop 3 (caused by hop 2): item.pooled_held is decremented once per voided reservation and pooled_available is recomputed."
          - "increments EquipmentItem.version by 1 and the version of every voided reservation"
      - from: INSPECTION_DUE
        to: OUT_OF_SERVICE
        trigger: "POST /recreation/equipment-items/{item_id}/inspections with disposition FAIL"
        actor: ProgramAdmin
        preconditions: ["item.condition_status == INSPECTION_DUE"]
        side_effects: ["Same CASCADE D hops 2-3 as from SERVICEABLE", "increments EquipmentItem.version by 1"]
      - from: SERVICEABLE
        to: RETIRED
        trigger: "POST /recreation/equipment-items/{item_id}/inspections with disposition RETIRE"
        actor: ProgramAdmin
        preconditions: ["item.condition_status == SERVICEABLE"]
        side_effects: ["Same CASCADE D hops 2-3", "increments EquipmentItem.version by 1"]
      - from: INSPECTION_DUE
        to: RETIRED
        trigger: "POST /recreation/equipment-items/{item_id}/inspections with disposition RETIRE"
        actor: ProgramAdmin
        preconditions: ["item.condition_status == INSPECTION_DUE"]
        side_effects: ["Same CASCADE D hops 2-3", "increments EquipmentItem.version by 1"]
      - from: OUT_OF_SERVICE
        to: RETIRED
        trigger: "POST /recreation/equipment-items/{item_id}/inspections with disposition RETIRE"
        actor: ProgramAdmin
        preconditions: ["item.condition_status == OUT_OF_SERVICE"]
        side_effects: ["increments EquipmentItem.version by 1"]

  - entity: EquipmentReservation
    axis: status
    initial_state: HELD
    terminal_states: [RETURNED_GOOD, RETURNED_DAMAGED, RELEASED, VOIDED_INSPECTION_FAIL]
    transitions:
      - from: HELD
        to: CHECKED_OUT
        trigger: "POST /recreation/equipment-reservations/{reservation_id}/check-out"
        actor: ActivityLead
        preconditions:
          - "reservation.status == HELD"
          - "the reserved EquipmentItem.condition_status == SERVICEABLE"
          - "the enrollment's session.status == STAFFING_LOCKED"
          - "the enrollment's enrollment_status == CONFIRMED"
        side_effects: ["item.pooled_held -= 1 and item.pooled_checked_out += 1; pooled_available is unchanged", "increments EquipmentReservation.version by 1 and EquipmentItem.version by 1"]
      - from: CHECKED_OUT
        to: RETURNED_GOOD
        trigger: "POST /recreation/equipment-reservations/{reservation_id}/return with return_condition GOOD"
        actor: ActivityLead
        preconditions: ["reservation.status == CHECKED_OUT"]
        side_effects: ["item.pooled_checked_out -= 1 and pooled_available += 1", "the item's condition_status is NOT changed", "increments EquipmentReservation.version by 1 and EquipmentItem.version by 1"]
      - from: CHECKED_OUT
        to: RETURNED_DAMAGED
        trigger: "POST /recreation/equipment-reservations/{reservation_id}/return with return_condition DAMAGED"
        actor: ActivityLead
        preconditions: ["reservation.status == CHECKED_OUT"]
        side_effects:
          - "item.pooled_checked_out -= 1 and pooled_available += 1."
          - "the item transitions SERVICEABLE -> OUT_OF_SERVICE (or INSPECTION_DUE -> OUT_OF_SERVICE), running CASCADE D hops 2-3 for its remaining HELD reservations."
          - "increments EquipmentReservation.version by 1 and EquipmentItem.version by 1"
        note: "Divergent branch: GOOD leaves the item usable, DAMAGED takes it out of service and voids its sibling holds. Same from-state, different side-effect sets."
      - from: HELD
        to: RELEASED
        trigger: "POST /recreation/equipment-reservations/{reservation_id}/release, or CASCADE A hop 2"
        actor: ActivityLead
        preconditions: ["reservation.status == HELD"]
        side_effects: ["item.pooled_held -= 1 and pooled_available += 1", "increments EquipmentReservation.version by 1 and EquipmentItem.version by 1"]
      - from: CHECKED_OUT
        to: RELEASED
        trigger: "System, as CASCADE A hop 2 of an enrollment withdrawal"
        actor: system
        preconditions: ["reservation.status == CHECKED_OUT", "the reservation's enrollment is transitioning to WITHDRAWN"]
        side_effects: ["item.pooled_checked_out -= 1 and pooled_available += 1", "increments EquipmentReservation.version by 1 and EquipmentItem.version by 1"]
      - from: HELD
        to: VOIDED_INSPECTION_FAIL
        trigger: "System, as CASCADE D hop 2"
        actor: system
        preconditions: ["reservation.status == HELD", "the reserved item has just left SERVICEABLE for OUT_OF_SERVICE or RETIRED"]
        side_effects: ["item.pooled_held -= 1 and pooled_available += 1", "increments EquipmentReservation.version by 1"]

  - entity: TransportRun
    axis: status
    initial_state: PLANNED
    terminal_states: [CANCELLED]
    transitions:
      - from: PLANNED
        to: BOARDING_FULL
        trigger: "System, immediately after a TransportBooking is created on this run"
        actor: system
        preconditions: ["run.status == PLANNED", "run.accessible_available == 0", "run.ambulatory_available == 0"]
        side_effects: ["increments TransportRun.version by 1"]
      - from: BOARDING_FULL
        to: PLANNED
        trigger: "System, immediately after a TransportBooking on this run is cancelled"
        actor: system
        preconditions: ["run.status == BOARDING_FULL", "run.accessible_available > 0 OR run.ambulatory_available > 0"]
        side_effects: ["increments TransportRun.version by 1"]
        note: "Re-entry edge; the run oscillates as bookings come and go."
      - from: PLANNED
        to: CANCELLED
        trigger: "System, as CASCADE B hop 4 when the served session is cancelled"
        actor: system
        preconditions: ["run.status == PLANNED", "the run's session is transitioning to CANCELLED"]
        side_effects: ["increments TransportRun.version by 1"]
      - from: BOARDING_FULL
        to: CANCELLED
        trigger: "System, as CASCADE B hop 4 when the served session is cancelled"
        actor: system
        preconditions: ["run.status == BOARDING_FULL", "the run's session is transitioning to CANCELLED"]
        side_effects: ["increments TransportRun.version by 1"]

  - entity: TransportBooking
    axis: status
    initial_state: RESERVED
    terminal_states: [RIDDEN, NO_SHOW, CANCELLED]
    transitions:
      - from: RESERVED
        to: CONFIRMED
        trigger: "POST /recreation/transport-bookings/{booking_id}/confirm, or the enrollment-confirm side effect"
        actor: TransportDispatcher
        preconditions: ["booking.status == RESERVED", "the booking's enrollment has enrollment_status == CONFIRMED"]
        side_effects: ["no counter changes — the position was already committed at RESERVED", "increments TransportBooking.version by 1"]
      - from: CONFIRMED
        to: RIDDEN
        trigger: "System, when the booking's enrollment transitions CONFIRMED -> ATTENDED"
        actor: system
        preconditions: ["booking.status == CONFIRMED"]
        side_effects: ["increments TransportBooking.version by 1"]
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "System, when the booking's enrollment transitions CONFIRMED -> NO_SHOW"
        actor: system
        preconditions: ["booking.status == CONFIRMED"]
        side_effects: ["the run's committed counter for this position_type is decremented and accessible_available / ambulatory_available restored", "increments TransportBooking.version by 1 and TransportRun.version by 1"]
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /recreation/transport-bookings/{booking_id}/cancel, or CASCADE A hop 2, or CASCADE B hop 3"
        actor: TransportDispatcher
        preconditions: ["booking.status == RESERVED"]
        side_effects: ["the run's committed counter for this position_type is decremented and the matching available counter restored; the other position counter is untouched", "the EnrollmentCharge's transport_fee_cents and family_responsibility_cents are recomputed", "increments TransportBooking.version by 1 and TransportRun.version by 1"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /recreation/transport-bookings/{booking_id}/cancel, or CASCADE A hop 2, or CASCADE B hop 3"
        actor: TransportDispatcher
        preconditions: ["booking.status == CONFIRMED"]
        side_effects: ["Same counter and charge side effects as from RESERVED", "increments TransportBooking.version by 1 and TransportRun.version by 1"]

  - entity: FundingSource
    axis: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: EXHAUSTED
        trigger: "System, immediately after an encumbrance drains the source"
        actor: system
        preconditions: ["source.status == OPEN", "source.available_cents == FUNDING_EXHAUSTED_AT_AVAILABLE_CENTS (0)"]
        side_effects:
          - "CASCADE A hop 7 / CASCADE F-style lapse: every ScholarshipAward on this source with status == PROPOSED transitions to LAPSED_NO_FUNDS."
          - "increments FundingSource.version by 1"
      - from: EXHAUSTED
        to: OPEN
        trigger: "System, immediately after a release restores the source"
        actor: system
        preconditions: ["source.status == EXHAUSTED", "source.available_cents > FUNDING_EXHAUSTED_AT_AVAILABLE_CENTS (0)"]
        side_effects: ["already-lapsed awards are NOT revived; a new award must be created", "increments FundingSource.version by 1"]
        note: "Re-entry edge."
      - from: OPEN
        to: CLOSED
        trigger: "POST /recreation/funding-sources/{source_id}/close, or CASCADE F hop 2"
        actor: FundingOfficer
        preconditions: ["source.status == OPEN"]
        side_effects: ["every ScholarshipAward on this source with status == PROPOSED transitions to LAPSED_NO_FUNDS", "increments FundingSource.version by 1"]
      - from: EXHAUSTED
        to: CLOSED
        trigger: "POST /recreation/funding-sources/{source_id}/close, or CASCADE F hop 2"
        actor: FundingOfficer
        preconditions: ["source.status == EXHAUSTED"]
        side_effects: ["increments FundingSource.version by 1"]

  - entity: ScholarshipAward
    axis: status
    initial_state: PROPOSED
    terminal_states: [DISBURSED, RELEASED, LAPSED_NO_FUNDS]
    transitions:
      - from: PROPOSED
        to: ENCUMBERED
        trigger: "POST /recreation/scholarship-awards/{award_id}/encumber, or the enrollment-confirm auto-encumber side effect"
        actor: FundingOfficer
        preconditions: ["award.status == PROPOSED", "source.status != CLOSED", "source.available_cents >= award.amount_cents", "the source's OperatingPeriod.status == OPEN"]
        side_effects:
          - "award.encumbered_cents := award.amount_cents."
          - "source.available_cents -= award.amount_cents and source.encumbered_cents += award.amount_cents."
          - "the source may transition OPEN -> EXHAUSTED."
          - "the enrollment's funding_status advances QUOTED -> ENCUMBERED and its EnrollmentCharge is recomputed."
          - "increments ScholarshipAward.version by 1, FundingSource.version by 1, Enrollment.version by 1"
      - from: ENCUMBERED
        to: PARTIALLY_DISBURSED
        trigger: "POST /recreation/scholarship-awards/{award_id}/disburse with amount_cents < award.encumbered_cents"
        actor: FundingOfficer
        preconditions: ["award.status == ENCUMBERED", "the acting X-User-ID != award.awarded_by_user_id", "amount_cents < award.encumbered_cents"]
        side_effects: ["award.disbursed_cents += amount_cents", "source.encumbered_cents -= amount_cents and source.disbursed_cents += amount_cents", "award.disbursed_by_user_id := the acting X-User-ID", "increments ScholarshipAward.version by 1 and FundingSource.version by 1"]
      - from: PARTIALLY_DISBURSED
        to: DISBURSED
        trigger: "POST /recreation/scholarship-awards/{award_id}/disburse with amount_cents == award.encumbered_cents - award.disbursed_cents"
        actor: FundingOfficer
        preconditions: ["award.status == PARTIALLY_DISBURSED", "the acting X-User-ID != award.awarded_by_user_id", "amount_cents == award.encumbered_cents - award.disbursed_cents"]
        side_effects: ["award.disbursed_cents := award.encumbered_cents", "source.encumbered_cents -= amount_cents and source.disbursed_cents += amount_cents", "the enrollment's funding_status advances ENCUMBERED -> DISBURSED", "increments ScholarshipAward.version by 1"]
      - from: ENCUMBERED
        to: DISBURSED
        trigger: "POST /recreation/scholarship-awards/{award_id}/disburse with amount_cents == award.encumbered_cents"
        actor: FundingOfficer
        preconditions: ["award.status == ENCUMBERED", "the acting X-User-ID != award.awarded_by_user_id", "amount_cents == award.encumbered_cents"]
        side_effects: ["award.disbursed_cents := award.encumbered_cents", "source.encumbered_cents -= amount_cents and source.disbursed_cents += amount_cents", "the enrollment's funding_status advances ENCUMBERED -> DISBURSED", "increments ScholarshipAward.version by 1"]
      - from: ENCUMBERED
        to: RELEASED
        trigger: "POST /recreation/scholarship-awards/{award_id}/release, or CASCADE A hop 2"
        actor: FundingOfficer
        preconditions: ["award.status == ENCUMBERED"]
        side_effects: ["release_cents := award.encumbered_cents (FULL variant of calculations.encumbrance_release_cents)", "source.encumbered_cents -= release_cents and source.available_cents += release_cents", "award.encumbered_cents := 0", "the source may transition EXHAUSTED -> OPEN", "increments ScholarshipAward.version by 1 and FundingSource.version by 1"]
      - from: PARTIALLY_DISBURSED
        to: RELEASED
        trigger: "POST /recreation/scholarship-awards/{award_id}/release, or CASCADE A hop 2"
        actor: FundingOfficer
        preconditions: ["award.status == PARTIALLY_DISBURSED"]
        side_effects: ["release_cents := award.encumbered_cents - award.disbursed_cents (REMAINDER variant of calculations.encumbrance_release_cents)", "source.encumbered_cents -= release_cents and source.available_cents += release_cents", "award.encumbered_cents := award.disbursed_cents", "increments ScholarshipAward.version by 1 and FundingSource.version by 1"]
      - from: PROPOSED
        to: RELEASED
        trigger: "System, as CASCADE A hop 2 of an enrollment withdrawal"
        actor: system
        preconditions: ["award.status == PROPOSED"]
        side_effects: ["no cents move — a PROPOSED award never held any", "increments ScholarshipAward.version by 1"]
      - from: PROPOSED
        to: LAPSED_NO_FUNDS
        trigger: "System, as CASCADE A hop 7, CASCADE F hop 3, or the funding-source close transition"
        actor: system
        preconditions: ["award.status == PROPOSED", "the award's FundingSource has just entered EXHAUSTED or CLOSED"]
        side_effects: ["the enrollment's funding_status transitions QUOTED -> UNFUNDED when no other live award remains", "increments ScholarshipAward.version by 1"]

  - entity: Goal
    axis: status
    initial_state: ACTIVE
    terminal_states: [DISCONTINUED]
    transitions:
      - from: ACTIVE
        to: MASTERED
        trigger: "System, after POST /recreation/goals/{goal_id}/ratings recomputes calculations.goal_mastery_status"
        actor: system
        preconditions: ["goal.status == ACTIVE", "the recomputed mastery status is true"]
        side_effects: ["increments Goal.version by 1"]
      - from: MASTERED
        to: ACTIVE
        trigger: "System, after POST /recreation/goals/{goal_id}/ratings recomputes calculations.goal_mastery_status"
        actor: system
        preconditions: ["goal.status == MASTERED", "the recomputed mastery status is false"]
        side_effects: ["increments Goal.version by 1"]
        note: "Non-monotone: a newer low rating entering the window can push the goal back out of mastery, and a later high rating can pull it back in."
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "System, as CASCADE E hop 2 when the participant exits"
        actor: system
        preconditions: ["goal.status == ACTIVE", "the goal's participant is transitioning to EXITED"]
        side_effects: ["increments Goal.version by 1"]
      - from: MASTERED
        to: DISCONTINUED
        trigger: "System, as CASCADE E hop 2 when the participant exits"
        actor: system
        preconditions: ["goal.status == MASTERED", "the goal's participant is transitioning to EXITED"]
        side_effects: ["increments Goal.version by 1"]

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules — OCC on the parent's `version` only
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: enrollment-create-stale-session
    parent_entity: ProgramSession
    write_endpoint: "POST /recreation/enrollments"
    occ_field: "expected_session_version"
    description: |
      Creating an Enrollment against a ProgramSession whose version has advanced
      since the client last read it is rejected. The session's version advances on
      every enrollment create, confirm, withdrawal, promotion and staffing change,
      so a stale version means the client's picture of slots_available,
      one_to_one_available and staffing_gap is out of date.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: assessment-create-stale-participant
    parent_entity: Participant
    write_endpoint: "POST /recreation/support-assessments"
    occ_field: "expected_participant_version"
    description: |
      Creating a SupportAssessment that will supersede the participant's current
      ACTIVE assessment is rejected when the client's participant version is stale.
      This is the CREATE-with-supersede case: the new assessment legitimately
      supersedes the prior one, so nothing in the state machine rejects it, and only
      the version check catches a writer who has not seen the prior supersession.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: award-create-stale-funding-source
    parent_entity: FundingSource
    write_endpoint: "POST /recreation/scholarship-awards"
    occ_field: "expected_funding_source_version"
    description: |
      Creating a ScholarshipAward against a FundingSource whose version has advanced
      is rejected. The amount a NEED_PCT or FLAT_CAP award may claim is capped by the
      source's available_cents, which changes on every encumbrance, disbursement and
      release, so a stale version means the awarded amount was computed against a
      balance that no longer exists.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: reservation-create-stale-equipment-item
    parent_entity: EquipmentItem
    write_endpoint: "POST /recreation/equipment-reservations"
    occ_field: "expected_item_version"
    description: |
      Creating an EquipmentReservation against an EquipmentItem whose version has
      advanced is rejected. The item's version advances on every hold, check-out,
      return, inspection and condition change, so a stale version means the client
      reserved against a pooled_available count or a condition_status it no longer has.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: booking-create-stale-transport-run
    parent_entity: TransportRun
    write_endpoint: "POST /recreation/transport-bookings"
    occ_field: "expected_run_version"
    description: |
      Creating a TransportBooking against a TransportRun whose version has advanced is
      rejected. Because the accessible and ambulatory counters are independent and
      non-interchangeable, a stale version means the client cannot know which of the
      two pools it is actually competing for.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: fee_scale_band_match
    trigger: "During POST /recreation/enrollments, before the EnrollmentCharge is created"
    algorithm: selector_policy
    formula: |
      candidate_set := FeeScaleBand rows where
          band.household_size_min <= participant.household_size <= band.household_size_max
          AND band.income_band == participant.income_band
      ranking      := household_size_min DESC
      tie_break    := created_at ASC          # never id
      fallback     := empty candidate_set -> ERR_FEE_BAND_NOT_FOUND (404)
      result       := the first row after ranking + tie-break; its id is pinned onto
                      EnrollmentCharge.fee_scale_band_id and never re-matched afterwards.
    input_set: "All FeeScaleBand rows; FeeScaleBand is immutable configuration (common_fields: false)."
    constants: {}
    precision: "integer cents"

  - name: participant_session_fee_cents
    trigger: "During POST /recreation/enrollments (EnrollmentCharge creation) and on every EnrollmentCharge recompute"
    algorithm: tiered_pricing
    formula: |
      band    := the FeeScaleBand pinned on EnrollmentCharge.fee_scale_band_id
      program := the ActivityProgram of the enrollment's ProgramSession

      IF program.pricing_mode == "PER_SESSION":            # variant PER_SESSION
          program_fee_cents = round_half_up(band.per_session_cents * program.fee_multiplier_bp / 10000)
      ELSE:                                                 # variant SERIES_FLAT
          series_total = round_half_up(band.series_cents * program.fee_multiplier_bp / 10000)
          base         = floor(series_total / program.scheduled_session_count)
          remainder    = series_total - base * program.scheduled_session_count
          program_fee_cents = base + (remainder IF session.sequence_number == 1 ELSE 0)
    input_set: "One FeeScaleBand row and one ActivityProgram row; the ProgramSession supplies sequence_number."
    constants:
      MONEY_ROUNDING: "round_half_up"
    precision: "integer cents, round_half_up"
    variants:
      - name: PER_SESSION
        when: "program.pricing_mode == 'PER_SESSION'"
        difference: "Prices one session directly off band.per_session_cents; scheduled_session_count and sequence_number are ignored entirely."
      - name: SERIES_FLAT
        when: "program.pricing_mode == 'SERIES_FLAT'"
        difference: "Prices the whole series off band.series_cents, divides by scheduled_session_count with floor, and loads the entire division remainder onto sequence_number 1, so sessions in the same series carry different fees for identical participants."

  - name: required_group_staff_count
    trigger: "On every enrollment confirm / withdraw / promote / demote, on support-assessment activation, and during POST /recreation/program-sessions/{session_id}/deliver"
    algorithm: threshold
    formula: |
      roster := (variant PLANNED)   Enrollments on the session with enrollment_status == "CONFIRMED"
             := (variant DELIVERED) Enrollments on the session with enrollment_status == "ATTENDED"
      pooled := [e IN roster WHERE e.effective_support_tier_at_session != "ONE_TO_ONE"]

      IF pooled is empty:
          RETURN 0                       # empty-set boundary: MIN_GROUP_STAFF does NOT apply

      points   = sum over pooled of support_points(e.effective_support_tier_at_session)
                 where support_points: INDEPENDENT -> 25, INTERMITTENT -> 50,
                 SUBSTANTIAL -> 100, ONE_TO_ONE -> 0
      # ROUNDING ORDER IS PINNED: ceil the risk-weighted point total to whole points
      # FIRST, then divide by capacity and ceil again. Dividing first gives different answers.
      weighted = ceil(points * risk_multiplier_bp / 10000)
                 where risk_multiplier_bp: LOW -> 10000, MODERATE -> 12500, HIGH -> 15000
      RETURN max(MIN_GROUP_STAFF, ceil(weighted / STAFF_POINT_CAPACITY))
    input_set: "Enrollments on one ProgramSession filtered by enrollment_status; ONE_TO_ONE participants are excluded from the pooled sum and are covered by dedicated assignments instead."
    constants:
      SUPPORT_POINTS_INDEPENDENT: 25
      SUPPORT_POINTS_INTERMITTENT: 50
      SUPPORT_POINTS_SUBSTANTIAL: 100
      SUPPORT_POINTS_ONE_TO_ONE: 0
      RISK_MULTIPLIER_BP_LOW: 10000
      RISK_MULTIPLIER_BP_MODERATE: 12500
      RISK_MULTIPLIER_BP_HIGH: 15000
      STAFF_POINT_CAPACITY: 400
      MIN_GROUP_STAFF: 1
    precision: "whole staffers; two separate ceil steps in the pinned order"
    variants:
      - name: PLANNED
        when: "session.status IN {DRAFT, OPEN, STAFFING_LOCKED}; written to session.required_group_staff_planned"
        difference: "Roster is the set of CONFIRMED enrollments — everyone who is expected."
      - name: DELIVERED
        when: "session.status == DELIVERED; written to session.required_group_staff_delivered during the deliver transition"
        difference: "Roster is the set of ATTENDED enrollments only, so every NO_SHOW drops out and the delivered requirement is normally strictly lower than the planned one for the same session."

  - name: one_to_one_demand_count
    trigger: "On every enrollment confirm / withdraw / promote / demote and on support-assessment activation"
    algorithm: aggregation
    formula: |
      one_to_one_committed = count of Enrollment rows on the session with
          enrollment_status == "CONFIRMED"
          AND effective_support_tier_at_session == "ONE_TO_ONE"
      one_to_one_available = session.one_to_one_pool_size - one_to_one_committed
    input_set: "Enrollments on one ProgramSession with enrollment_status == CONFIRMED."
    constants: {}
    precision: "whole participants"

  - name: session_staffing_gap
    trigger: "On every StaffAssignment mutation, every enrollment roster change, and before POST /recreation/program-sessions/{session_id}/lock-staffing"
    algorithm: aggregation
    formula: |
      assigned_group_staff_count = count of StaffAssignment on the session with
          assignment_role IN {"LEAD", "GROUP"} AND status IN {"PROPOSED", "CONFIRMED"}
      one_to_one_staffed = count of StaffAssignment on the session with
          assignment_role == "ONE_TO_ONE" AND status IN {"PROPOSED", "CONFIRMED"}
      group_gap       = max(0, session.required_group_staff_planned - assigned_group_staff_count)
      one_to_one_gap  = max(0, session.one_to_one_committed - one_to_one_staffed)
      staffing_gap    = group_gap + one_to_one_gap
    input_set: "StaffAssignment rows on one ProgramSession, filtered by status; LAPSED and WITHDRAWN assignments do not count."
    constants: {}
    precision: "whole staffers"

  - name: staff_certification_validity
    trigger: "During POST /recreation/staff-assignments (AT_ASSIGNMENT) and during lock-staffing, assignment confirm and assignment revalidate (AT_SESSION_DATE)"
    algorithm: threshold
    formula: |
      required := program.required_certification_types of the session's ActivityProgram
      check_date := (variant AT_ASSIGNMENT)    date(logical clock)
                 := (variant AT_SESSION_DATE)  date(session.start_at)

      qualified = for EVERY t IN required there exists a StaffCertification row with
          staff_member_id == assignment.staff_member_id
          AND certification_type == t
          AND expires_on >= check_date              # INCLUSIVE: equal dates are valid
      # The comparison is on expires_on, never on the StaffCertification.status mirror,
      # which the clock checkpoint maintains only for reporting.
    input_set: "All StaffCertification rows of one StaffMember; required set comes from the program."
    constants: {}
    precision: "boolean; date comparison at whole-day granularity"
    variants:
      - name: AT_ASSIGNMENT
        when: "evaluated by POST /recreation/staff-assignments; stored as StaffAssignment.qualified_at_assignment"
        difference: "Compares expires_on against today's logical-clock date, so a certification that lapses between today and the session date still passes."
      - name: AT_SESSION_DATE
        when: "evaluated by lock-staffing, assignment confirm and assignment revalidate; stored as StaffAssignment.qualified_at_session_date"
        difference: "Compares expires_on against date(session.start_at), so the very same certification that satisfied AT_ASSIGNMENT fails here whenever it lapses inside the interval — the two variants disagree on identical data."

  - name: effective_support_tier
    trigger: "On enrollment creation, on support-assessment activation, on every roster recompute, and during POST /recreation/program-sessions/{session_id}/deliver"
    algorithm: projection
    formula: |
      IF session.status == "DELIVERED":                    # variant AS_OF_SESSION
          candidates := SupportAssessments of the participant with
              status IN {"ACTIVE", "SUPERSEDED"} AND effective_from <= session.start_at
          ranking   := effective_from DESC
          tie_break := created_at DESC                     # never id
          RETURN first candidate's support_tier, or null when candidates is empty
      ELSE:                                                 # variant CURRENT
          RETURN the support_tier of the participant's SupportAssessment whose
                 status == "ACTIVE", or null when none exists
    input_set: "All SupportAssessment rows of one Participant."
    constants: {}
    precision: "enum"
    variants:
      - name: CURRENT
        when: "session.status IN {DRAFT, OPEN, STAFFING_LOCKED, CANCELLED}"
        difference: "Reads the single ACTIVE assessment, so a mid-series re-assessment immediately changes staffing math for every not-yet-delivered session."
      - name: AS_OF_SESSION
        when: "session.status == DELIVERED"
        difference: "Replays the assessment history against session.start_at and can return a SUPERSEDED assessment's tier, so a session already delivered keeps the tier it was staffed under even after a re-assessment."

  - name: equipment_fit_eligibility
    trigger: "During POST /recreation/equipment-reservations and during enrollment sub-gate D"
    algorithm: constraint_propagation
    formula: |
      required_model := program.required_equipment_model_code
      required_size  := program.required_equipment_size_code

      fit_ok  = item.model_code == required_model
                AND item.size_code == required_size
                AND item.weight_capacity_kg >= participant.weight_kg + WEIGHT_CAPACITY_TOLERANCE_KG
      cond_ok = item.condition_status == "SERVICEABLE"
      insp_ok = item.item_kind == "POOLED"
                OR item.inspection_due_date >= date(session.start_at)
      cap_ok  = item.pooled_available >= 1

      eligible = fit_ok AND cond_ok AND insp_ok AND cap_ok
      # SERIALIZED items always have pooled_total == 1, so cap_ok is exclusive
      # occupancy. POOLED items admit up to pooled_total concurrent holds — the same
      # predicate, two different occupancy semantics.
    input_set: "One EquipmentItem row plus its live reservations; the program supplies the required model and size."
    constants:
      WEIGHT_CAPACITY_TOLERANCE_KG: 0
    precision: "boolean; weight compared in whole kilograms with >= (equal capacity fits)"

  - name: transport_fare_cents
    trigger: "During POST /recreation/transport-bookings, pinned onto TransportBooking.fare_cents"
    algorithm: tiered_pricing
    formula: |
      surcharge = TRANSPORT_ACCESSIBLE_SURCHARGE_CENTS IF booking.position_type == "ACCESSIBLE" ELSE 0

      IF run.fare_mode == "FLAT":                          # variant FLAT
          fare_cents = run.flat_fare_cents + surcharge
      ELSE:                                                 # variant ZONE_MILEAGE
          fare_cents = round_half_up((TRANSPORT_BASE_FARE_CENTS * 10
                                      + TRANSPORT_PER_MILE_CENTS * run.route_miles_x10) / 10)
                       + surcharge
    input_set: "One TransportRun row and the booking's position_type."
    constants:
      TRANSPORT_BASE_FARE_CENTS: 300
      TRANSPORT_PER_MILE_CENTS: 85
      TRANSPORT_ACCESSIBLE_SURCHARGE_CENTS: 250
      MONEY_ROUNDING: "round_half_up"
    precision: "integer cents, round_half_up applied once, before the surcharge is added"
    variants:
      - name: FLAT
        when: "run.fare_mode == 'FLAT'"
        difference: "route_miles_x10 is ignored entirely; the fare is a stored constant plus surcharge, so no rounding occurs."
      - name: ZONE_MILEAGE
        when: "run.fare_mode == 'ZONE_MILEAGE'"
        difference: "flat_fare_cents is ignored; the fare is derived from route length in tenths of a mile and rounds half-up before the surcharge, so identical runs priced both ways differ in cents."

  - name: sibling_discount_bp
    trigger: "Inside every EnrollmentCharge recompute, immediately before family_responsibility_total_cents"
    algorithm: aggregation
    formula: |
      sibling_count = count of DISTINCT Enrollment.participant_id WHERE
          enrollment.session_id == this_enrollment.session_id
          AND enrollment.enrollment_status == "CONFIRMED"
          AND that participant's household_id == this participant's household_id
      sibling_discount_bp = SIBLING_DISCOUNT_BP IF sibling_count >= SIBLING_DISCOUNT_MIN_ENROLLED ELSE 0

      # EVALUATION ORDER IS PINNED (the value looks circular otherwise, because
      # confirming one sibling changes the other sibling's discount):
      #   1. set enrollment_status := CONFIRMED and update the session counters;
      #   2. recompute THIS enrollment's charge (so it counts itself);
      #   3. recompute every OTHER EnrollmentCharge whose enrollment is CONFIRMED on the
      #      same session and whose participant shares this household_id, in
      #      created_at ASC order;
      #   4. stop — exactly one sweep, no further passes.
      # Withdrawal is the mirror image: set WITHDRAWN, VOID this charge, then re-run
      # step 3 in created_at ASC order.
    input_set: "Enrollments on one ProgramSession with enrollment_status == CONFIRMED, grouped by Participant.household_id."
    constants:
      SIBLING_DISCOUNT_BP: 1500
      SIBLING_DISCOUNT_MIN_ENROLLED: 2
    precision: "basis points, integer"

  - name: family_responsibility_total_cents
    trigger: "On every EnrollmentCharge recompute (enrollment confirm/withdraw, award encumber/release, transport booking create/cancel, family payment)"
    algorithm: waterfall_allocation
    formula: |
      # Application order is load-bearing and pinned:
      #   sliding-scale program fee -> scholarship -> copay -> transport fee -> sibling discount
      copay_cents         = max(0, charge.program_fee_cents - charge.scholarship_applied_cents)
      transport_fee_cents = sum of TransportBooking.fare_cents on this enrollment with
                            status IN {"RESERVED", "CONFIRMED", "RIDDEN"}
      d                   = charge.sibling_discount_bp

      IF program.rounding_policy == "ROUND_PER_LINE":       # variant ROUND_PER_LINE
          family_responsibility_cents =
              round_half_up(copay_cents * (10000 - d) / 10000)
            + round_half_up(transport_fee_cents * (10000 - d) / 10000)
      ELSE:                                                  # variant ROUND_ON_TOTAL
          family_responsibility_cents =
              round_half_up((copay_cents + transport_fee_cents) * (10000 - d) / 10000)
    input_set: "One EnrollmentCharge plus the live TransportBookings of its enrollment."
    constants:
      MONEY_ROUNDING: "round_half_up"
    precision: "integer cents"
    variants:
      - name: ROUND_PER_LINE
        when: "program.rounding_policy == 'ROUND_PER_LINE'"
        difference: "Rounds the discounted copay and the discounted transport fee independently and then sums, so two half-cent fragments can both round up."
      - name: ROUND_ON_TOTAL
        when: "program.rounding_policy == 'ROUND_ON_TOTAL'"
        difference: "Sums first and rounds once, so the two half-cent fragments cancel or combine; identical inputs land one cent apart from ROUND_PER_LINE."

  - name: enrollment_charge_settlement
    trigger: "On every EnrollmentCharge recompute and on POST /recreation/enrollment-charges/{charge_id}/payments"
    algorithm: aggregation
    formula: |
      scholarship_applied_cents = sum of ScholarshipAward.encumbered_cents for awards on this
          enrollment with status IN {"ENCUMBERED", "PARTIALLY_DISBURSED", "DISBURSED"}
      copay_cents   = max(0, program_fee_cents - scholarship_applied_cents)
      balance_cents = max(0, family_responsibility_cents - amount_paid_cents)

      status = "VOIDED"      IF enrollment.enrollment_status IN {"WITHDRAWN", "DENIED"}
             = "QUOTED"      ELSE IF enrollment.enrollment_status IN {"REQUESTED", "WAITLISTED"}
             = "SETTLED"     ELSE IF balance_cents == 0
             = "OUTSTANDING" ELSE
    input_set: "One EnrollmentCharge, its enrollment, and that enrollment's ScholarshipAward rows filtered by status."
    constants: {}
    precision: "integer cents"

  - name: funding_source_selector
    trigger: "During POST /recreation/scholarship-awards when funding_source_id is omitted"
    algorithm: selector_policy
    formula: |
      candidate_set := FundingSource rows WHERE
          status == "OPEN"
          AND available_cents > FUNDING_EXHAUSTED_AT_AVAILABLE_CENTS
          AND the row's OperatingPeriod.status == "OPEN"
      ranking      := priority_rank ASC          # restricted grants are given lower ranks
      tie_break_1  := available_cents DESC
      tie_break_2  := created_at ASC             # never id
      fallback     := empty candidate_set -> ERR_INSUFFICIENT_FUNDS (409)
    input_set: "All FundingSource rows joined to their OperatingPeriod."
    constants:
      FUNDING_EXHAUSTED_AT_AVAILABLE_CENTS: 0
    precision: "selects exactly one FundingSource row"

  - name: scholarship_award_amount_cents
    trigger: "During POST /recreation/scholarship-awards, pinned onto ScholarshipAward.amount_cents"
    algorithm: threshold
    formula: |
      net_need_cents := the enrollment's EnrollmentCharge.program_fee_cents
      source         := the explicit funding_source_id, else calculations.funding_source_selector

      IF requested_amount_cents was supplied in the request body:
          amount_cents = requested_amount_cents
          # validated by validations[priority=57] (available balance) and [priority=58] (net need)
      ELSE IF source.award_mode == "NEED_PCT":               # variant NEED_PCT
          raw = round_half_up(net_need_cents * source.award_pct_bp / 10000)
          amount_cents = min(raw, source.available_cents)
      ELSE:                                                   # variant FLAT_CAP
          amount_cents = min(net_need_cents, source.flat_award_cents, source.available_cents)

      IF amount_cents == 0 -> ERR_INSUFFICIENT_FUNDS (409)
    input_set: "One EnrollmentCharge and one FundingSource row."
    constants:
      MONEY_ROUNDING: "round_half_up"
    precision: "integer cents, round_half_up"
    variants:
      - name: NEED_PCT
        when: "funding_source.award_mode == 'NEED_PCT' and requested_amount_cents is omitted"
        difference: "Awards a proportion of net need and only then clips to the balance, so a partially funded source produces a fractional-percentage award that leaves a family remainder."
      - name: FLAT_CAP
        when: "funding_source.award_mode == 'FLAT_CAP' and requested_amount_cents is omitted"
        difference: "Awards the smallest of net need, a per-enrollment flat cap, and the balance — no percentage is ever taken, so the same enrollment and the same balance yield a different award than NEED_PCT."

  - name: encumbrance_release_cents
    trigger: "During POST /recreation/scholarship-awards/{award_id}/release and during CASCADE A hop 2"
    algorithm: aggregation
    formula: |
      IF award.status == "ENCUMBERED":                       # variant FULL
          release_cents = award.encumbered_cents
      ELSE IF award.status == "PARTIALLY_DISBURSED":         # variant REMAINDER
          release_cents = award.encumbered_cents - award.disbursed_cents
      ELSE IF award.status == "PROPOSED":
          release_cents = 0

      source.encumbered_cents -= release_cents
      source.available_cents  += release_cents
      # disbursed_cents on both award and source are never touched by a release.
    input_set: "One ScholarshipAward and its FundingSource."
    constants: {}
    precision: "integer cents"
    variants:
      - name: FULL
        when: "award.status == 'ENCUMBERED'"
        difference: "Returns the entire encumbrance; award.encumbered_cents drops to 0."
      - name: REMAINDER
        when: "award.status == 'PARTIALLY_DISBURSED'"
        difference: "Returns only the not-yet-paid part; award.encumbered_cents drops to award.disbursed_cents, so the same release action on the same award amount moves a strictly smaller number of cents."

  - name: waitlist_priority_score
    trigger: "When an Enrollment enters WAITLISTED, and again when CASCADE A hop 3 selects a promotion candidate"
    algorithm: weighted_scoring
    formula: |
      IF program.waitlist_policy == "FIFO":                  # variant FIFO
          waitlist_score = 0
      ELSE:                                                   # variant EQUITY_WEIGHTED
          waitlist_score = support_points(enrollment.effective_support_tier_at_session)
                         + (WAITLIST_EQUITY_SCHOLARSHIP_BONUS IF the enrollment has a
                            ScholarshipAward with status IN {"PROPOSED", "ENCUMBERED"} ELSE 0)

      # Promotion selector
      candidate_set := Enrollments on the session with enrollment_status == "WAITLISTED"
      ranking       := waitlist_score DESC
      tie_break     := created_at ASC                        # never id
      fallback      := empty candidate_set -> no promotion occurs and no error is raised
      # At most PROMOTIONS_PER_RELEASE candidates are promoted per released slot.
      # Candidates failing any of the six sub-gates are skipped, and the next-ranked
      # candidate is tried, until one is promoted or the candidate set is exhausted.
    input_set: "Enrollments on one ProgramSession with enrollment_status == WAITLISTED."
    constants:
      SUPPORT_POINTS_INDEPENDENT: 25
      SUPPORT_POINTS_INTERMITTENT: 50
      SUPPORT_POINTS_SUBSTANTIAL: 100
      SUPPORT_POINTS_ONE_TO_ONE: 0
      WAITLIST_EQUITY_SCHOLARSHIP_BONUS: 50
      PROMOTIONS_PER_RELEASE: 1
    precision: "integer score"
    variants:
      - name: FIFO
        when: "program.waitlist_policy == 'FIFO'"
        difference: "Every candidate scores 0, so the ranking collapses to created_at ASC — the earliest waitlisted row always wins regardless of support need."
      - name: EQUITY_WEIGHTED
        when: "program.waitlist_policy == 'EQUITY_WEIGHTED'"
        difference: "Scores support need plus a scholarship bonus, so a later-arriving SUBSTANTIAL scholarship holder (150) outranks an earlier INDEPENDENT self-payer (25) — the opposite winner from FIFO on identical rows."

  - name: goal_mastery_status
    trigger: "During POST /recreation/goals/{goal_id}/ratings, after the new GoalRating is persisted"
    algorithm: projection
    formula: |
      ordered := GoalRating rows of this goal ordered by
                 rated_session_start_at DESC, then created_at DESC
      window  := the first goal.mastery_window_m entries of `ordered`

      IF goal.mastery_mode == "N_OF_M":                      # variant N_OF_M
          mastered = len(window) >= goal.mastery_window_m
                     AND count(r IN window WHERE r.score >= goal.mastery_criterion_score)
                         >= goal.mastery_hits_n
      ELSE:                                                   # variant CONSECUTIVE
          head = the first goal.mastery_hits_n entries of `ordered`
          mastered = len(head) == goal.mastery_hits_n
                     AND every r IN head has r.score >= goal.mastery_criterion_score

      # The result is NOT monotone: a rating anchored to an older session can enter the
      # window and evict a hit, moving the goal MASTERED -> ACTIVE.
    input_set: "All GoalRating rows of one Goal; ordering is by the rated session's start instant, not by insertion order."
    constants:
      DEFAULT_MASTERY_WINDOW_M: 5
      DEFAULT_MASTERY_HITS_N: 4
      RATING_SCORE_MIN: 1
      RATING_SCORE_MAX: 5
    precision: "boolean"
    variants:
      - name: N_OF_M
        when: "goal.mastery_mode == 'N_OF_M'"
        difference: "Counts hits anywhere in the last M ratings, so one miss in the middle of a strong run still masters."
      - name: CONSECUTIVE
        when: "goal.mastery_mode == 'CONSECUTIVE'"
        difference: "Requires the most recent N ratings to all be hits, so the very same rating history that masters under N_OF_M fails here whenever the newest rating is a miss."

  - name: consent_signer_authority
    trigger: "During POST /recreation/consents/{consent_id}/sign"
    algorithm: constraint_propagation
    formula: |
      age_years = whole years from participant.date_of_birth to date(logical clock), floor

      IF consent.consent_type == "MEDICATION_ADMIN":
          accepted_signer_role = "LEGAL_GUARDIAN"     # never self-signed, at any age
      ELSE IF participant.guardianship_status == "SELF" AND age_years >= 18:
          accepted_signer_role = "SELF"
      ELSE:
          accepted_signer_role = "LEGAL_GUARDIAN"

      IF accepted_signer_role == "SELF":
          the request must carry signed_by_caregiver_id == null and be made as IntakeCoordinator
      ELSE:
          the request must carry a signed_by_caregiver_id naming a Caregiver whose
          participant_id == consent.participant_id AND is_legal_guardian == true

      Any other combination -> ERR_CONSENT_SIGNER_NOT_AUTHORIZED (422)
    input_set: "One Participant, one ConsentArtifact, and the Caregiver rows of that participant."
    constants: {}
    precision: "enum"

  - name: participant_enrollment_posture
    trigger: "On every GET /recreation/participants/{participant_id}/eligibility and internally as the ordered sub-gate evaluation for enrollment confirmation"
    algorithm: constraint_propagation
    formula: |
      check_date := date(session.start_at) when a session_id query parameter is supplied,
                    else date(logical clock)
      program    := that session's ActivityProgram when supplied, else no consent set is checked

      posture = "NOT_ACTIVE"          IF participant.status != "ACTIVE"
              = "CONSENT_BLOCKED"     ELSE IF any t IN program.required_consent_types has no
                                        ConsentArtifact of this participant with consent_type == t,
                                        status == "SIGNED" and expires_on >= check_date
              = "ASSESSMENT_STALE"    ELSE IF there is no SupportAssessment with status == "ACTIVE",
                                        or that assessment's assessed_on + ASSESSMENT_VALIDITY_DAYS
                                        < check_date
              = "FINANCIALLY_BLOCKED" ELSE IF the participant has any EnrollmentCharge with
                                        status == "OUTSTANDING" whose session.status == "DELIVERED"
              = "CLEARED"             ELSE
    input_set: "One Participant plus its ConsentArtifact, SupportAssessment and EnrollmentCharge rows."
    constants:
      ASSESSMENT_VALIDITY_DAYS: 365
    precision: "enum; the branch order is exactly the ladder order of validations[priority=33], [priority=34], [priority=37] and [priority=60]"

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table — ONE ordered ladder, 60 numbered rungs.
# Rung 9 is the GLOBAL WRITE GATE. Rungs 34, 37, 45, 49, 52 and 56 head the six
# ordered sub-gates (consent, assessment, capacity, equipment, transport, funding)
# that enrollment confirmation and waitlist promotion both walk, in this order.
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "The X-User-Role header is present and non-empty."
    error_id: ERR_MISSING_ROLE_HEADER
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "The X-User-ID header is present and non-empty."
    error_id: ERR_MISSING_USER_ID_HEADER
    http_status: 401
    applies_to: "all"
  - priority: 3
    category: auth
    check: "X-User-Role names one of the six roles declared in the RBAC matrix."
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: "all"
  - priority: 4
    category: auth
    check: "The role is listed in the called endpoint's roles set."
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"
  - priority: 5
    category: auth
    check: "For entity-backed roles, X-User-ID resolves to an existing row: ActivityLead -> StaffMember.id, CaregiverUser -> Caregiver.id."
    error_id: ERR_IDENTITY_NOT_FOUND
    http_status: 403
    applies_to: "all endpoints called as ActivityLead or CaregiverUser"
  - priority: 6
    category: auth
    check: "A CaregiverUser may only touch resources belonging to the participant named by its own Caregiver row (Caregiver.participant_id)."
    error_id: ERR_CAREGIVER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "all endpoints called as CaregiverUser that name a participant, enrollment, consent or goal"
  - priority: 7
    category: auth
    check: "For session-delivery operations, the acting ActivityLead's StaffMember.id must appear on a StaffAssignment for that session with status IN {PROPOSED, CONFIRMED, DELIVERED}."
    error_id: ERR_STAFF_NOT_ASSIGNED_TO_SESSION
    http_status: 403
    applies_to: "POST /recreation/program-sessions/{session_id}/deliver, POST /recreation/enrollments/{enrollment_id}/attendance, POST /recreation/equipment-reservations/{reservation_id}/check-out, POST /recreation/equipment-reservations/{reservation_id}/return, POST /recreation/goals/{goal_id}/ratings"
  - priority: 8
    category: auth
    check: "Segregation of duties: the acting X-User-ID must differ from ScholarshipAward.awarded_by_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /recreation/scholarship-awards/{award_id}/disburse"
  - priority: 9
    category: state
    check: "GLOBAL WRITE GATE. Resolve the current OperatingPeriod (the row whose starts_on <= clock date <= ends_on; ranking starts_on DESC, tie-break created_at ASC; when no row matches, the gate does not fire). When that row's status IN {FROZEN, CLOSED}, every mutating endpoint is rejected. Exempt: all GET endpoints, POST /recreation/_clock/set_current_utc, and POST /recreation/operating-periods/{period_id}/posture. Cascaded side effects fired by an already-admitted request are NOT re-gated."
    error_id: ERR_PERIOD_FROZEN
    http_status: 409
    applies_to: "all POST, PATCH, PUT and DELETE endpoints except the two exemptions"
  - priority: 10
    category: state
    check: "When the current OperatingPeriod.status IN {RESTRICTED, CLOSING}, the financial-write set is rejected: POST /recreation/funding-sources, POST /recreation/funding-sources/{source_id}/close, POST /recreation/scholarship-awards, POST /recreation/scholarship-awards/{award_id}/encumber, POST /recreation/scholarship-awards/{award_id}/disburse, POST /recreation/scholarship-awards/{award_id}/release, POST /recreation/enrollment-charges/{charge_id}/payments."
    error_id: ERR_PERIOD_RESTRICTED
    http_status: 409
    applies_to: "the seven financial-write endpoints listed in the check"
  - priority: 11
    category: existence
    check: "Every referenced Participant id resolves, validated left-to-right in the path then in the body."
    error_id: ERR_PARTICIPANT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints naming a participant"
  - priority: 12
    category: existence
    check: "Every referenced ActivityProgram id resolves."
    error_id: ERR_PROGRAM_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints naming a program"
  - priority: 13
    category: existence
    check: "Every referenced ProgramSession id resolves."
    error_id: ERR_SESSION_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints naming a session"
  - priority: 14
    category: existence
    check: "Every referenced Enrollment id resolves; a referenced EnrollmentCharge id resolves at this same rung."
    error_id: ERR_ENROLLMENT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints naming an enrollment or a charge"
    note: "Sibling code at this rung: ERR_CHARGE_NOT_FOUND (404) when the missing resource is the EnrollmentCharge."
  - priority: 15
    category: existence
    check: "Every referenced StaffMember, StaffCertification or StaffAssignment id resolves."
    error_id: ERR_STAFF_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints naming a staffing resource"
    note: "Sibling codes at this rung: ERR_CERTIFICATION_NOT_FOUND (404) for StaffCertification, ERR_ASSIGNMENT_NOT_FOUND (404) for StaffAssignment."
  - priority: 16
    category: existence
    check: "Every referenced EquipmentItem or EquipmentReservation id resolves."
    error_id: ERR_EQUIPMENT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints naming an equipment resource"
    note: "Sibling code at this rung: ERR_RESERVATION_NOT_FOUND (404) for EquipmentReservation."
  - priority: 17
    category: existence
    check: "Every referenced TransportRun or TransportBooking id resolves."
    error_id: ERR_TRANSPORT_RUN_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints naming a transport resource"
    note: "Sibling code at this rung: ERR_TRANSPORT_BOOKING_NOT_FOUND (404) for TransportBooking."
  - priority: 18
    category: existence
    check: "Every referenced FundingSource, ScholarshipAward or FeeScaleBand id resolves, including the FeeScaleBand lookup performed by calculations.fee_scale_band_match."
    error_id: ERR_FUNDING_SOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints naming a funding resource, plus POST /recreation/enrollments"
    note: "Sibling codes at this rung: ERR_AWARD_NOT_FOUND (404) for ScholarshipAward, ERR_FEE_BAND_NOT_FOUND (404) when no FeeScaleBand row covers the participant's household_size and income_band."
  - priority: 19
    category: existence
    check: "Every referenced ConsentArtifact, SupportAssessment or Caregiver id resolves."
    error_id: ERR_CONSENT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints naming a consent, assessment or caregiver"
    note: "Sibling codes at this rung: ERR_ASSESSMENT_NOT_FOUND (404) for SupportAssessment, ERR_CAREGIVER_NOT_FOUND (404) for Caregiver."
  - priority: 20
    category: existence
    check: "Every referenced Goal or GoalRating id resolves."
    error_id: ERR_GOAL_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints naming a goal or rating"
    note: "Sibling code at this rung: ERR_RATING_NOT_FOUND (404) for GoalRating."
  - priority: 21
    category: existence
    check: "Every referenced OperatingPeriod id resolves."
    error_id: ERR_PERIOD_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints naming an operating period"
  - priority: 22
    category: business_constraint
    check: "Every field declared required in the endpoint's input is present, of the declared JSON type, and within its declared numeric range (for example GoalRating.score between RATING_SCORE_MIN 1 and RATING_SCORE_MAX 5, household_size >= 1, end_at > start_at, ends_on >= starts_on)."
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all POST, PATCH and PUT endpoints"
  - priority: 23
    category: business_constraint
    check: "Every enum-typed input field carries a declared member of that enum."
    error_id: ERR_INVALID_ENUM
    http_status: 400
    applies_to: "all POST, PATCH and PUT endpoints with enum inputs"
  - priority: 24
    category: business_constraint
    check: "Pagination parameters obey limit between 1 and 100 and offset >= 0."
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all GET list endpoints"
  - priority: 25
    category: state
    check: "The supplied expected_<parent>_version equals the parent's current version, per the matching concurrency_rules entry."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /recreation/enrollments, POST /recreation/support-assessments, POST /recreation/scholarship-awards, POST /recreation/equipment-reservations, POST /recreation/transport-bookings"
  - priority: 26
    category: state
    check: "The target entity is in a declared `from:` state for the requested transition."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every state-transition endpoint"
  - priority: 27
    category: state
    check: "The target entity is not already in one of its axis's terminal states."
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "every state-transition endpoint"
    note: "Evaluated after rung 26, so a non-terminal but wrong from-state yields ERR_INVALID_STATE and a terminal one yields ERR_ALREADY_TERMINAL."
  - priority: 28
    category: state
    check: "Cross-entity: the enrollment's ProgramSession.status == OPEN."
    error_id: ERR_SESSION_NOT_OPEN
    http_status: 409
    applies_to: "POST /recreation/enrollments, POST /recreation/enrollments/{enrollment_id}/confirm"
  - priority: 29
    category: business_temporal
    check: "session.start_at is at least SESSION_ENROLLMENT_CUTOFF_HOURS (24) after the logical clock."
    error_id: ERR_ENROLLMENT_CUTOFF_PASSED
    http_status: 422
    applies_to: "POST /recreation/enrollments"
  - priority: 30
    category: business_referential
    check: "Cross-reference coherence: a TransportBooking's enrollment and its TransportRun must serve the same ProgramSession; a GoalRating's session must be one on which the goal's participant holds an Enrollment at all. Equipment fit is deliberately NOT checked here — it is sub-gate D (rungs 49-51) — so that the fit, inspection and availability rungs remain individually reachable."
    error_id: ERR_PROGRAM_SESSION_MISMATCH
    http_status: 422
    applies_to: "POST /recreation/transport-bookings, POST /recreation/goals/{goal_id}/ratings"
  - priority: 31
    category: business_constraint
    check: "A participant holds at most one non-terminal Enrollment per session: no existing row with the same participant_id and session_id whose enrollment_status IN {REQUESTED, WAITLISTED, CONFIRMED}."
    error_id: ERR_DUPLICATE_ENROLLMENT
    http_status: 409
    applies_to: "POST /recreation/enrollments"
  - priority: 32
    category: business_constraint
    check: "A goal carries at most one GoalRating per session: no existing GoalRating with the same goal_id and session_id."
    error_id: ERR_DUPLICATE_GOAL_RATING
    http_status: 409
    applies_to: "POST /recreation/goals/{goal_id}/ratings"
  - priority: 33
    category: business_safety
    check: "The participant's status == ACTIVE."
    error_id: ERR_PARTICIPANT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /recreation/enrollments, POST /recreation/enrollments/{enrollment_id}/confirm, and the waitlist-promotion gate walk"
  - priority: 34
    category: business_safety
    check: "SUB-GATE A (consent), head rung. For every consent_type in the session's ActivityProgram.required_consent_types there exists a ConsentArtifact of the participant with that consent_type and status == SIGNED."
    error_id: ERR_REQUIRED_CONSENT_MISSING
    http_status: 422
    applies_to: "POST /recreation/enrollments/{enrollment_id}/confirm and the waitlist-promotion gate walk"
  - priority: 35
    category: business_safety
    check: "SUB-GATE A continued. Each such SIGNED ConsentArtifact has expires_on >= date(session.start_at). A consent that has lapsed for one activity type blocks only enrollments on programs that require that consent_type; it never blocks the participant's other enrollments."
    error_id: ERR_CONSENT_EXPIRED
    http_status: 422
    applies_to: "POST /recreation/enrollments/{enrollment_id}/confirm and the waitlist-promotion gate walk"
  - priority: 36
    category: business_safety
    check: "The signer satisfies calculations.consent_signer_authority for this participant and consent_type."
    error_id: ERR_CONSENT_SIGNER_NOT_AUTHORIZED
    http_status: 422
    applies_to: "POST /recreation/consents/{consent_id}/sign"
  - priority: 37
    category: business_safety
    check: "SUB-GATE B (assessment), head rung. The participant has a SupportAssessment with status == ACTIVE whose assessed_on + ASSESSMENT_VALIDITY_DAYS (365) >= date(session.start_at)."
    error_id: ERR_ASSESSMENT_STALE
    http_status: 422
    applies_to: "POST /recreation/enrollments/{enrollment_id}/confirm and the waitlist-promotion gate walk"
  - priority: 38
    category: business_safety
    check: "When ActivityProgram.requires_medication_admin is true, the session carries at least one StaffAssignment with status IN {PROPOSED, CONFIRMED} whose StaffMember holds a MEDICATION_ADMIN StaffCertification with expires_on >= date(session.start_at)."
    error_id: ERR_MED_ADMIN_COVERAGE_MISSING
    http_status: 422
    applies_to: "POST /recreation/program-sessions/{session_id}/lock-staffing"
  - priority: 39
    category: business_safety
    check: "The assigned StaffMember holds a StaffCertification row for every certification_type in the program's required_certification_types."
    error_id: ERR_STAFF_CERT_MISSING
    http_status: 422
    applies_to: "POST /recreation/staff-assignments, POST /recreation/staff-assignments/{assignment_id}/confirm, POST /recreation/staff-assignments/{assignment_id}/revalidate, POST /recreation/program-sessions/{session_id}/lock-staffing"
  - priority: 40
    category: business_safety
    check: "AT_ASSIGNMENT variant of calculations.staff_certification_validity: every required certification has expires_on >= date(logical clock)."
    error_id: ERR_STAFF_CERT_EXPIRED_AT_ASSIGNMENT
    http_status: 422
    applies_to: "POST /recreation/staff-assignments only"
  - priority: 41
    category: business_safety
    check: "AT_SESSION_DATE variant of calculations.staff_certification_validity: every required certification has expires_on >= date(session.start_at). Deliberately NOT applied at assignment creation, so a staffer may be assigned while qualified today and still fail here."
    error_id: ERR_STAFF_CERT_EXPIRES_BEFORE_SESSION
    http_status: 422
    applies_to: "POST /recreation/staff-assignments/{assignment_id}/confirm, POST /recreation/staff-assignments/{assignment_id}/revalidate, POST /recreation/program-sessions/{session_id}/lock-staffing"
  - priority: 42
    category: business_temporal
    check: "Staff overlap, HALF-OPEN intervals WITH a turnaround buffer: reject when new.start_at < existing.end_at + STAFF_TURNAROUND_BUFFER_MINUTES (30) AND existing.start_at < new.end_at + 30 minutes, over the staffer's StaffAssignments with status IN {PROPOSED, CONFIRMED} on sessions with status IN {DRAFT, OPEN, STAFFING_LOCKED}. Back-to-back sessions therefore DO collide for staff."
    error_id: ERR_STAFF_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /recreation/staff-assignments"
  - priority: 43
    category: business_temporal
    check: "Participant overlap, STRICTLY HALF-OPEN intervals with NO buffer: reject when new.start_at < existing.end_at AND existing.start_at < new.end_at, over the participant's Enrollments with enrollment_status IN {REQUESTED, WAITLISTED, CONFIRMED}. Back-to-back sessions (new.start_at == existing.end_at) therefore do NOT collide for participants."
    error_id: ERR_PARTICIPANT_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /recreation/enrollments"
  - priority: 44
    category: business_referential
    check: "The goal's participant has an Enrollment on the rated session with enrollment_status == ATTENDED."
    error_id: ERR_RATING_SESSION_NOT_ATTENDED
    http_status: 422
    applies_to: "POST /recreation/goals/{goal_id}/ratings"
  - priority: 45
    category: business_constraint
    check: "SUB-GATE C (capacity), head rung. session.slots_available >= 1. When the confirm request carries on_full WAITLIST or DENY, this rung does not raise; the enrollment is routed to WAITLISTED or DENIED instead."
    error_id: ERR_SESSION_FULL
    http_status: 409
    applies_to: "POST /recreation/enrollments/{enrollment_id}/confirm and the waitlist-promotion gate walk"
  - priority: 46
    category: business_constraint
    check: "SUB-GATE C continued. When the participant's effective tier at this session is ONE_TO_ONE, session.one_to_one_available >= 1. The 1:1 pool is a separate counter from slot_capacity and the two are never interchangeable. Same on_full routing as rung 45."
    error_id: ERR_ONE_TO_ONE_POOL_EXHAUSTED
    http_status: 409
    applies_to: "POST /recreation/enrollments/{enrollment_id}/confirm and the waitlist-promotion gate walk"
  - priority: 47
    category: business_constraint
    check: "session.staffing_gap == 0 after recomputation."
    error_id: ERR_STAFFING_GAP
    http_status: 409
    applies_to: "POST /recreation/program-sessions/{session_id}/lock-staffing"
  - priority: 48
    category: business_constraint
    check: "session.unlock_count < MAX_SESSION_UNLOCKS (2)."
    error_id: ERR_UNLOCK_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /recreation/program-sessions/{session_id}/unlock-staffing"
  - priority: 49
    category: business_constraint
    check: "SUB-GATE D (equipment), head rung. The item's model_code and size_code match the program's requirement and item.weight_capacity_kg >= participant.weight_kg + WEIGHT_CAPACITY_TOLERANCE_KG (0); equality fits."
    error_id: ERR_EQUIPMENT_FIT_MISMATCH
    http_status: 422
    applies_to: "POST /recreation/equipment-reservations, and the enrollment-confirm / waitlist-promotion gate walk when the program declares required_equipment_model_code"
  - priority: 50
    category: business_constraint
    check: "SUB-GATE D continued. For a SERIALIZED item, condition_status == SERVICEABLE and inspection_due_date >= date(session.start_at). POOLED items skip the inspection clause."
    error_id: ERR_EQUIPMENT_INSPECTION_OVERDUE
    http_status: 409
    applies_to: "POST /recreation/equipment-reservations, POST /recreation/equipment-reservations/{reservation_id}/check-out, and the gate walk"
  - priority: 51
    category: business_constraint
    check: "SUB-GATE D continued. item.pooled_available >= 1. For SERIALIZED items (pooled_total == 1) this is exclusive occupancy; for POOLED items it is aggregate capacity up to pooled_total."
    error_id: ERR_EQUIPMENT_UNAVAILABLE
    http_status: 409
    applies_to: "POST /recreation/equipment-reservations and the gate walk"
  - priority: 52
    category: business_constraint
    check: "SUB-GATE E (transport), head rung. position_type must match participant.mobility_profile exactly: WHEELCHAIR -> ACCESSIBLE, AMBULATORY -> AMBULATORY."
    error_id: ERR_POSITION_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /recreation/transport-bookings"
  - priority: 53
    category: business_temporal
    check: "SUB-GATE E continued. Containment with a buffer: run.pickup_end_at <= session.start_at minus TRANSPORT_ARRIVAL_BUFFER_MINUTES (15), and run.pickup_start_at < run.pickup_end_at. Equality at the buffer boundary is accepted."
    error_id: ERR_TRANSPORT_WINDOW_MISMATCH
    http_status: 422
    applies_to: "POST /recreation/transport-bookings"
  - priority: 54
    category: business_constraint
    check: "SUB-GATE E continued. When position_type == ACCESSIBLE, run.accessible_available >= 1."
    error_id: ERR_ACCESSIBLE_POSITIONS_FULL
    http_status: 409
    applies_to: "POST /recreation/transport-bookings and the gate walk"
  - priority: 55
    category: business_constraint
    check: "SUB-GATE E continued. When position_type == AMBULATORY, run.ambulatory_available >= 1. A free accessible position never satisfies an ambulatory request and vice versa."
    error_id: ERR_AMBULATORY_SEATS_FULL
    http_status: 409
    applies_to: "POST /recreation/transport-bookings and the gate walk"
  - priority: 56
    category: business_fiscal
    check: "SUB-GATE F (funding), head rung. The named FundingSource.status != CLOSED AND its OperatingPeriod.status == OPEN. An EXHAUSTED (but not closed) source deliberately falls through to rung 57 so that ERR_INSUFFICIENT_FUNDS stays reachable."
    error_id: ERR_FUNDING_PERIOD_CLOSED
    http_status: 409
    applies_to: "POST /recreation/scholarship-awards, POST /recreation/scholarship-awards/{award_id}/encumber"
  - priority: 57
    category: business_fiscal
    check: "SUB-GATE F continued. The award amount is >= 1 cent and source.available_cents >= the amount; when funding_source_id is omitted, calculations.funding_source_selector returned a non-empty candidate set."
    error_id: ERR_INSUFFICIENT_FUNDS
    http_status: 409
    applies_to: "POST /recreation/scholarship-awards, POST /recreation/scholarship-awards/{award_id}/encumber"
  - priority: 58
    category: business_fiscal
    check: "SUB-GATE F continued. A supplied requested_amount_cents must not exceed the enrollment's EnrollmentCharge.program_fee_cents (net need)."
    error_id: ERR_AWARD_EXCEEDS_NEED
    http_status: 422
    applies_to: "POST /recreation/scholarship-awards"
  - priority: 59
    category: business_fiscal
    check: "A disbursement's amount_cents must be >= 1 and <= award.encumbered_cents - award.disbursed_cents."
    error_id: ERR_DISBURSEMENT_EXCEEDS_ENCUMBRANCE
    http_status: 422
    applies_to: "POST /recreation/scholarship-awards/{award_id}/disburse"
  - priority: 60
    category: business_fiscal
    check: "SUB-GATE F continued, last rung of the ladder. The participant carries no EnrollmentCharge with status == OUTSTANDING whose ProgramSession.status == DELIVERED."
    error_id: ERR_FAMILY_BALANCE_OUTSTANDING
    http_status: 402
    applies_to: "POST /recreation/enrollments, POST /recreation/enrollments/{enrollment_id}/confirm and the waitlist-promotion gate walk"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # --- logical clock (ops-run checkpoint) -----------------------------------
  - method: POST
    path: "/recreation/_clock/set_current_utc"
    description: "Sets the server's logical clock. Before any call the clock reads exactly 2026-05-01T00:00:00Z and NEVER falls back to real wall-clock time. Setting the clock runs the epoch checkpoint: consent expiry, certification expiry (CASCADE C), and serialized-equipment inspection-due sweeps, in that order."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string, consents_expired: integer, certifications_expired: integer, assignments_lapsed: integer, sessions_unlocked: integer, items_inspection_due: integer }
    side_effects:
      - "ConsentArtifact SIGNED -> EXPIRED for every row whose expires_on < the new clock date"
      - "StaffCertification VALID -> EXPIRED, running CASCADE C hops 2-4"
      - "EquipmentItem SERVICEABLE -> INSPECTION_DUE for every SERIALIZED row whose inspection_due_date < the new clock date"
      - "Exempt from the global write gate (validations[priority=9])"

  # --- operating periods (global write gate) --------------------------------
  - method: POST
    path: "/recreation/operating-periods"
    description: "Creates an operating/fiscal period."
    roles: [ProgramAdmin]
    code: 201
    input: [name, starts_on, ends_on]
    output: OperatingPeriod
    side_effects: ["OperatingPeriod created with status OPEN and version 1"]
  - method: GET
    path: "/recreation/operating-periods/{period_id}"
    description: "Reads one operating period, including its current posture and version."
    roles: [ProgramAdmin, IntakeCoordinator, ActivityLead, FundingOfficer, TransportDispatcher]
    code: 200
    input: []
    output: OperatingPeriod
    side_effects: []
  - method: POST
    path: "/recreation/operating-periods/{period_id}/posture"
    description: "Moves the period along its posture axis. Exempt from the global write gate so a FROZEN period can always be thawed."
    roles: [ProgramAdmin]
    code: 200
    input: [target_status]
    output: OperatingPeriod
    side_effects: ["state_machines.OperatingPeriod transition per target_status", "CASCADE F when target_status is CLOSED", "increments OperatingPeriod.version by 1"]

  # --- fee scale bands ------------------------------------------------------
  - method: POST
    path: "/recreation/fee-scale-bands"
    description: "Creates one sliding-scale row keyed by household-size range and income band."
    roles: [ProgramAdmin]
    code: 201
    input: [household_size_min, household_size_max, income_band, per_session_cents, series_cents]
    output: FeeScaleBand
    side_effects: []
  - method: GET
    path: "/recreation/fee-scale-bands/{band_id}"
    description: "Reads one sliding-scale row."
    roles: [ProgramAdmin, IntakeCoordinator, ActivityLead, FundingOfficer, TransportDispatcher]
    code: 200
    input: []
    output: FeeScaleBand
    side_effects: []

  # --- participants ---------------------------------------------------------
  - method: POST
    path: "/recreation/participants"
    description: "Intakes a participant. The row starts in status INTAKE and cannot enroll until it is ACTIVE."
    roles: [IntakeCoordinator]
    code: 201
    input: [legal_name, date_of_birth, household_id, household_size, income_band, weight_kg, mobility_profile, guardianship_status]
    output: Participant
    side_effects: ["Participant created with status INTAKE, effective_support_tier null, version 1"]
  - method: GET
    path: "/recreation/participants"
    description: "Lists participants with pagination and filters."
    roles: [ProgramAdmin, IntakeCoordinator, ActivityLead, FundingOfficer, TransportDispatcher]
    code: 200
    input: ["status?", "household_id?", "limit?", "offset?"]
    output: Participant[]
    side_effects: []
  - method: GET
    path: "/recreation/participants/{participant_id}"
    description: "Reads one participant, including computed age_years, effective_support_tier and version."
    roles: [ProgramAdmin, IntakeCoordinator, ActivityLead, FundingOfficer, TransportDispatcher, CaregiverUser]
    code: 200
    input: []
    output: Participant
    side_effects: []
  - method: PATCH
    path: "/recreation/participants/{participant_id}"
    description: "Updates the household and physical attributes that drive fee banding and equipment fit. Does not re-price existing EnrollmentCharges, whose fee_scale_band_id is pinned."
    roles: [IntakeCoordinator]
    code: 200
    input: ["household_size?", "income_band?", "weight_kg?", "mobility_profile?"]
    output: Participant
    side_effects: ["increments Participant.version by 1"]
  - method: POST
    path: "/recreation/participants/{participant_id}/status"
    description: "Drives the participant intake axis: INTAKE/INACTIVE -> ACTIVE, ACTIVE -> INACTIVE, ACTIVE/INACTIVE -> EXITED (CASCADE E)."
    roles: [IntakeCoordinator]
    code: 200
    input: [target_status]
    output: Participant
    side_effects: ["state_machines.Participant transition", "CASCADE E when target_status is EXITED", "increments Participant.version by 1"]
  - method: GET
    path: "/recreation/participants/{participant_id}/eligibility"
    description: "Computed read: evaluates calculations.participant_enrollment_posture, optionally against a nominated session."
    roles: [ProgramAdmin, IntakeCoordinator, ActivityLead, FundingOfficer, TransportDispatcher, CaregiverUser]
    code: 200
    input: ["session_id?"]
    output: { participant_id: string, enrollment_posture: string, consent_gate_ok: boolean, assessment_gate_ok: boolean, financial_gate_ok: boolean, effective_support_tier: string, age_years: integer }
    side_effects: []

  # --- caregivers -----------------------------------------------------------
  - method: POST
    path: "/recreation/caregivers"
    description: "Attaches a caregiver to a participant."
    roles: [IntakeCoordinator]
    code: 201
    input: [participant_id, full_name, relationship, is_legal_guardian, contact_phone]
    output: Caregiver
    side_effects: []
  - method: GET
    path: "/recreation/caregivers"
    description: "Lists caregivers, filterable by participant."
    roles: [ProgramAdmin, IntakeCoordinator, ActivityLead, FundingOfficer, TransportDispatcher]
    code: 200
    input: ["participant_id?", "limit?", "offset?"]
    output: Caregiver[]
    side_effects: []
  - method: GET
    path: "/recreation/caregivers/{caregiver_id}"
    description: "Reads one caregiver."
    roles: [ProgramAdmin, IntakeCoordinator, ActivityLead, FundingOfficer, TransportDispatcher, CaregiverUser]
    code: 200
    input: []
    output: Caregiver
    side_effects: []

  # --- support assessments --------------------------------------------------
  - method: POST
    path: "/recreation/support-assessments"
    description: "Creates a DRAFT support assessment. OCC-guarded on the participant because activating it will supersede the participant's current ACTIVE assessment."
    roles: [IntakeCoordinator]
    code: 201
    input: [participant_id, assessed_on, effective_from, support_tier, expected_participant_version]
    output: SupportAssessment
    side_effects: ["SupportAssessment created in DRAFT with support_points derived from support_tier", "increments Participant.version by 1"]
  - method: GET
    path: "/recreation/support-assessments"
    description: "Lists support assessments, filterable by participant and status."
    roles: [ProgramAdmin, IntakeCoordinator, ActivityLead, FundingOfficer, TransportDispatcher]
    code: 200
    input: ["participant_id?", "status?", "limit?", "offset?"]
    output: SupportAssessment[]
    side_effects: []
  - method: GET
    path: "/recreation/support-assessments/{assessment_id}"
    description: "Reads one support assessment."
    roles: [ProgramAdmin, IntakeCoordinator, ActivityLead, FundingOfficer, TransportDispatcher]
    code: 200
    input: []
    output: SupportAssessment
    side_effects: []
  - method: POST
    path: "/recreation/support-assessments/{assessment_id}/activate"
    description: "Activates a DRAFT assessment, superseding the prior ACTIVE one and re-deriving staffing math for every not-yet-delivered session."
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: SupportAssessment
    side_effects: ["prior ACTIVE assessment -> SUPERSEDED", "participant.effective_support_tier refreshed", "required_group_staff_planned / one_to_one_committed / staffing_gap recomputed on affected sessions", "increments SupportAssessment.version by 1 and Participant.version by 1"]

  # --- consents -------------------------------------------------------------
  - method: POST
    path: "/recreation/consents"
    description: "Creates a consent artifact in PENDING_SIGNATURE."
    roles: [IntakeCoordinator]
    code: 201
    input: [participant_id, consent_type, expires_on]
    output: ConsentArtifact
    side_effects: []
  - method: GET
    path: "/recreation/consents"
    description: "Lists consent artifacts, filterable by participant, signer and type."
    roles: [ProgramAdmin, IntakeCoordinator, ActivityLead, FundingOfficer, TransportDispatcher, CaregiverUser]
    code: 200
    input: ["participant_id?", "signed_by_caregiver_id?", "consent_type?", "status?", "limit?", "offset?"]
    output: ConsentArtifact[]
    side_effects: []
  - method: GET
    path: "/recreation/consents/{consent_id}"
    description: "Reads one consent artifact."
    roles: [ProgramAdmin, IntakeCoordinator, ActivityLead, FundingOfficer, TransportDispatcher, CaregiverUser]
    code: 200
    input: []
    output: ConsentArtifact
    side_effects: []
  - method: POST
    path: "/recreation/consents/{consent_id}/sign"
    description: "Signs a consent under calculations.consent_signer_authority. Omit signed_by_caregiver_id for a SELF signature."
    roles: [IntakeCoordinator, CaregiverUser]
    code: 200
    input: ["signed_by_caregiver_id?"]
    output: ConsentArtifact
    side_effects: ["consent.status -> SIGNED", "signer_role and signed_on stamped", "increments ConsentArtifact.version by 1"]
  - method: POST
    path: "/recreation/consents/{consent_id}/revoke"
    description: "Revokes a consent from PENDING_SIGNATURE or SIGNED."
    roles: [IntakeCoordinator, CaregiverUser]
    code: 200
    input: []
    output: ConsentArtifact
    side_effects: ["consent.status -> REVOKED", "increments ConsentArtifact.version by 1"]

  # --- activity programs ----------------------------------------------------
  - method: POST
    path: "/recreation/activity-programs"
    description: "Creates a program: risk tier, pricing mode, rounding policy, waitlist policy and the consent / certification / equipment requirements every session inherits."
    roles: [ProgramAdmin]
    code: 201
    input: ["name", "activity_type", "risk_tier", "pricing_mode", "rounding_policy", "waitlist_policy", "fee_multiplier_bp", "scheduled_session_count", "required_consent_types?", "required_certification_types?", "requires_medication_admin?", "required_equipment_model_code?", "required_equipment_size_code?"]
    output: ActivityProgram
    side_effects: ["ActivityProgram created with session_count_created 0"]
  - method: GET
    path: "/recreation/activity-programs/{program_id}"
    description: "Reads one program."
    roles: [ProgramAdmin, IntakeCoordinator, ActivityLead, FundingOfficer, TransportDispatcher]
    code: 200
    input: []
    output: ActivityProgram
    side_effects: []

  # --- program sessions -----------------------------------------------------
  - method: POST
    path: "/recreation/program-sessions"
    description: "Creates a session in DRAFT; sequence_number is assigned as program.session_count_created + 1."
    roles: [ProgramAdmin]
    code: 201
    input: [program_id, start_at, end_at, slot_capacity, one_to_one_pool_size]
    output: ProgramSession
    side_effects: ["sequence_number stamped", "program.session_count_created += 1", "slots_available := slot_capacity, one_to_one_available := one_to_one_pool_size", "increments ActivityProgram.version by 1"]
  - method: GET
    path: "/recreation/program-sessions"
    description: "Lists sessions, filterable by program and status."
    roles: [ProgramAdmin, IntakeCoordinator, ActivityLead, FundingOfficer, TransportDispatcher]
    code: 200
    input: ["program_id?", "status?", "limit?", "offset?"]
    output: ProgramSession[]
    side_effects: []
  - method: GET
    path: "/recreation/program-sessions/{session_id}"
    description: "Reads one session, including every capacity and staffing counter and its version."
    roles: [ProgramAdmin, IntakeCoordinator, ActivityLead, FundingOfficer, TransportDispatcher, CaregiverUser]
    code: 200
    input: []
    output: ProgramSession
    side_effects: []
  - method: GET
    path: "/recreation/program-sessions/{session_id}/staffing-summary"
    description: "Computed read: the PLANNED and DELIVERED staffing figures, the pooled support-point total and the current gap."
    roles: [ProgramAdmin, IntakeCoordinator, ActivityLead, FundingOfficer, TransportDispatcher]
    code: 200
    input: []
    output: { session_id: string, pooled_support_points: integer, required_group_staff_planned: integer, required_group_staff_delivered: integer, assigned_group_staff_count: integer, one_to_one_committed: integer, one_to_one_staffed: integer, staffing_gap: integer }
    side_effects: []
  - method: POST
    path: "/recreation/program-sessions/{session_id}/open"
    description: "Opens a DRAFT session for enrollment."
    roles: [ActivityLead, ProgramAdmin]
    code: 200
    input: []
    output: ProgramSession
    side_effects: ["session.status -> OPEN", "increments ProgramSession.version by 1"]
  - method: POST
    path: "/recreation/program-sessions/{session_id}/lock-staffing"
    description: "Locks the roster and staffing. Requires staffing_gap == 0 and every live assignment qualified at the SESSION date."
    roles: [ActivityLead]
    code: 200
    input: []
    output: ProgramSession
    side_effects: ["PROPOSED assignments -> CONFIRMED", "session.status -> STAFFING_LOCKED", "increments ProgramSession.version by 1"]
  - method: POST
    path: "/recreation/program-sessions/{session_id}/unlock-staffing"
    description: "Reopens a locked session; capped at MAX_SESSION_UNLOCKS (2)."
    roles: [ActivityLead]
    code: 200
    input: []
    output: ProgramSession
    side_effects: ["session.unlock_count += 1", "session.status -> OPEN", "increments ProgramSession.version by 1"]
  - method: POST
    path: "/recreation/program-sessions/{session_id}/deliver"
    description: "Closes out a delivered session: auto-NO_SHOWs the remaining CONFIRMED roster, computes the DELIVERED staffing variant, and finalises charges."
    roles: [ActivityLead]
    code: 200
    input: []
    output: ProgramSession
    side_effects: ["remaining CONFIRMED enrollments -> NO_SHOW", "required_group_staff_delivered computed", "CONFIRMED assignments -> DELIVERED", "EnrollmentCharge statuses recomputed", "increments ProgramSession.version by 1"]
  - method: POST
    path: "/recreation/program-sessions/{session_id}/cancel"
    description: "Cancels a session and runs CASCADE B."
    roles: [ActivityLead, ProgramAdmin]
    code: 200
    input: []
    output: ProgramSession
    side_effects: ["CASCADE B hops 1-4", "increments ProgramSession.version by 1"]

  # --- enrollments ----------------------------------------------------------
  - method: POST
    path: "/recreation/enrollments"
    description: "Requests an enrollment. Creates the row in REQUESTED / QUOTED and synthesises its EnrollmentCharge; the charge is discoverable only through GET /recreation/enrollment-charges."
    roles: [IntakeCoordinator, CaregiverUser]
    code: 201
    input: ["participant_id", "session_id", "expected_session_version", "transport_requested?"]
    output: Enrollment
    side_effects: ["EnrollmentCharge created with fee_scale_band_id pinned and program_fee_cents computed", "increments ProgramSession.version by 1"]
  - method: GET
    path: "/recreation/enrollments"
    description: "Lists enrollments, filterable by participant, session and either status axis."
    roles: [ProgramAdmin, IntakeCoordinator, ActivityLead, FundingOfficer, TransportDispatcher, CaregiverUser]
    code: 200
    input: ["participant_id?", "session_id?", "enrollment_status?", "funding_status?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []
  - method: GET
    path: "/recreation/enrollments/{enrollment_id}"
    description: "Reads one enrollment, including both status axes and the effective tier at its session."
    roles: [ProgramAdmin, IntakeCoordinator, ActivityLead, FundingOfficer, TransportDispatcher, CaregiverUser]
    code: 200
    input: []
    output: Enrollment
    side_effects: []
  - method: POST
    path: "/recreation/enrollments/{enrollment_id}/confirm"
    description: "Walks the six ordered sub-gates. on_full selects what happens when only the capacity sub-gate fails: ERROR (default) raises, WAITLIST parks the row, DENY terminates it."
    roles: [IntakeCoordinator]
    code: 200
    input: ["on_full?"]
    output: Enrollment
    side_effects: ["session counters updated", "PROPOSED awards auto-encumbered", "sibling charges recomputed in created_at ASC order", "RESERVED transport bookings -> CONFIRMED", "increments Enrollment.version by 1 and ProgramSession.version by 1"]
  - method: POST
    path: "/recreation/enrollments/{enrollment_id}/withdraw"
    description: "Withdraws an enrollment and runs CASCADE A, including at most one waitlist promotion."
    roles: [IntakeCoordinator, CaregiverUser]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["CASCADE A hops 1-8", "increments Enrollment.version by 1 and ProgramSession.version by 1"]
  - method: POST
    path: "/recreation/enrollments/{enrollment_id}/attendance"
    description: "Records attendance on a locked session that has already started."
    roles: [ActivityLead]
    code: 200
    input: [outcome]
    output: Enrollment
    side_effects: ["enrollment -> ATTENDED or NO_SHOW", "the enrollment's CONFIRMED TransportBooking -> RIDDEN or NO_SHOW", "increments Enrollment.version by 1"]

  # --- enrollment charges ---------------------------------------------------
  - method: GET
    path: "/recreation/enrollment-charges"
    description: "Lists enrollment charges, filterable by enrollment, fee band and settlement status. This is the only discovery channel for a cascade-created charge."
    roles: [ProgramAdmin, IntakeCoordinator, ActivityLead, FundingOfficer, TransportDispatcher, CaregiverUser]
    code: 200
    input: ["enrollment_id?", "fee_scale_band_id?", "status?", "limit?", "offset?"]
    output: EnrollmentCharge[]
    side_effects: []
  - method: GET
    path: "/recreation/enrollment-charges/{charge_id}"
    description: "Reads one enrollment charge with every money line."
    roles: [ProgramAdmin, IntakeCoordinator, ActivityLead, FundingOfficer, TransportDispatcher, CaregiverUser]
    code: 200
    input: []
    output: EnrollmentCharge
    side_effects: []
  - method: POST
    path: "/recreation/enrollment-charges/{charge_id}/payments"
    description: "Records a family payment against the charge and re-derives balance_cents and status."
    roles: [FundingOfficer]
    code: 200
    input: [amount_cents]
    output: EnrollmentCharge
    side_effects: ["amount_paid_cents += amount_cents", "balance_cents and status recomputed per calculations.enrollment_charge_settlement", "increments EnrollmentCharge.version by 1"]

  # --- staff members and certifications -------------------------------------
  - method: POST
    path: "/recreation/staff-members"
    description: "Creates a staff member. The id is what an ActivityLead presents as X-User-ID."
    roles: [ProgramAdmin]
    code: 201
    input: [full_name, role_title]
    output: StaffMember
    side_effects: []
  - method: GET
    path: "/recreation/staff-members/{staff_id}"
    description: "Reads one staff member."
    roles: [ProgramAdmin, IntakeCoordinator, ActivityLead, FundingOfficer, TransportDispatcher]
    code: 200
    input: []
    output: StaffMember
    side_effects: []
  - method: POST
    path: "/recreation/staff-certifications"
    description: "Records a certification with an expiry date."
    roles: [ProgramAdmin]
    code: 201
    input: [staff_member_id, certification_type, issued_on, expires_on]
    output: StaffCertification
    side_effects: ["StaffCertification created with status VALID"]
  - method: GET
    path: "/recreation/staff-certifications"
    description: "Lists certifications, filterable by staffer, type and validity."
    roles: [ProgramAdmin, IntakeCoordinator, ActivityLead, FundingOfficer, TransportDispatcher]
    code: 200
    input: ["staff_member_id?", "certification_type?", "status?", "limit?", "offset?"]
    output: StaffCertification[]
    side_effects: []
  - method: GET
    path: "/recreation/staff-certifications/{certification_id}"
    description: "Reads one certification."
    roles: [ProgramAdmin, IntakeCoordinator, ActivityLead, FundingOfficer, TransportDispatcher]
    code: 200
    input: []
    output: StaffCertification
    side_effects: []
  - method: POST
    path: "/recreation/staff-certifications/{certification_id}/renew"
    description: "Extends the expiry. Renewal alone never restores a LAPSED assignment."
    roles: [ProgramAdmin]
    code: 200
    input: [new_expires_on]
    output: StaffCertification
    side_effects: ["expires_on updated", "status -> VALID when it was EXPIRED", "increments StaffCertification.version by 1"]

  # --- staff assignments ----------------------------------------------------
  - method: POST
    path: "/recreation/staff-assignments"
    description: "Proposes an assignment. Certification validity is checked at TODAY's date here (AT_ASSIGNMENT), never at the session date."
    roles: [ActivityLead, ProgramAdmin]
    code: 201
    input: ["session_id", "staff_member_id", "assignment_role", "dedicated_participant_id?"]
    output: StaffAssignment
    side_effects: ["qualified_at_assignment stamped", "session counters and staffing_gap recomputed", "increments ProgramSession.version by 1"]
  - method: GET
    path: "/recreation/staff-assignments"
    description: "Lists assignments, filterable by session, staffer, dedicated participant and status."
    roles: [ProgramAdmin, IntakeCoordinator, ActivityLead, FundingOfficer, TransportDispatcher]
    code: 200
    input: ["session_id?", "staff_member_id?", "dedicated_participant_id?", "status?", "limit?", "offset?"]
    output: StaffAssignment[]
    side_effects: []
  - method: GET
    path: "/recreation/staff-assignments/{assignment_id}"
    description: "Reads one assignment, including both qualification flags."
    roles: [ProgramAdmin, IntakeCoordinator, ActivityLead, FundingOfficer, TransportDispatcher]
    code: 200
    input: []
    output: StaffAssignment
    side_effects: []
  - method: POST
    path: "/recreation/staff-assignments/{assignment_id}/confirm"
    description: "Confirms a proposed assignment. Certification validity is checked at the SESSION date here (AT_SESSION_DATE)."
    roles: [ActivityLead]
    code: 200
    input: []
    output: StaffAssignment
    side_effects: ["qualified_at_session_date recomputed", "assignment -> CONFIRMED", "staffing_gap recomputed", "increments StaffAssignment.version by 1"]
  - method: POST
    path: "/recreation/staff-assignments/{assignment_id}/withdraw"
    description: "Withdraws an assignment from PROPOSED, CONFIRMED or LAPSED."
    roles: [ActivityLead, ProgramAdmin]
    code: 200
    input: []
    output: StaffAssignment
    side_effects: ["session counters and staffing_gap recomputed", "increments StaffAssignment.version by 1"]
  - method: POST
    path: "/recreation/staff-assignments/{assignment_id}/revalidate"
    description: "Re-runs the AT_SESSION_DATE qualification check and restores a LAPSED assignment to CONFIRMED when it now passes."
    roles: [ActivityLead]
    code: 200
    input: []
    output: StaffAssignment
    side_effects: ["qualified_at_session_date recomputed", "assignment LAPSED -> CONFIRMED on success", "staffing_gap recomputed", "increments StaffAssignment.version by 1"]

  # --- adaptive equipment ---------------------------------------------------
  - method: POST
    path: "/recreation/equipment-items"
    description: "Creates a serialized unit (serial_number and inspection_due_date required, pooled_total 1) or a pooled consumable row (pooled_total > 1, no inspection cycle)."
    roles: [ProgramAdmin]
    code: 201
    input: ["item_kind", "model_code", "size_code", "weight_capacity_kg", "serial_number?", "inspection_due_date?", "pooled_total?"]
    output: EquipmentItem
    side_effects: ["EquipmentItem created SERVICEABLE with pooled_available := pooled_total, pooled_held 0, pooled_checked_out 0"]
  - method: GET
    path: "/recreation/equipment-items/{item_id}"
    description: "Reads one equipment item, including condition, inspection due date, pooled counters and version."
    roles: [ProgramAdmin, IntakeCoordinator, ActivityLead, FundingOfficer, TransportDispatcher]
    code: 200
    input: []
    output: EquipmentItem
    side_effects: []
  - method: POST
    path: "/recreation/equipment-items/{item_id}/inspections"
    description: "Records an inspection outcome. PASS restores SERVICEABLE and pushes inspection_due_date out by INSPECTION_INTERVAL_DAYS (180); FAIL and RETIRE both run CASCADE D on the item's HELD reservations."
    roles: [ProgramAdmin]
    code: 200
    input: [disposition]
    output: EquipmentItem
    side_effects: ["state_machines.EquipmentItem transition per disposition", "CASCADE D hops 2-3 on FAIL and RETIRE", "increments EquipmentItem.version by 1"]
  - method: POST
    path: "/recreation/equipment-reservations"
    description: "Places a hold. OCC-guarded on the item because its pooled counters and condition move under the client."
    roles: [ActivityLead, IntakeCoordinator]
    code: 201
    input: [enrollment_id, equipment_item_id, expected_item_version]
    output: EquipmentReservation
    side_effects: ["reservation created HELD", "item.pooled_held += 1 and pooled_available -= 1", "increments EquipmentItem.version by 1"]
  - method: GET
    path: "/recreation/equipment-reservations"
    description: "Lists reservations, filterable by enrollment, item and status."
    roles: [ProgramAdmin, IntakeCoordinator, ActivityLead, FundingOfficer, TransportDispatcher]
    code: 200
    input: ["enrollment_id?", "equipment_item_id?", "status?", "limit?", "offset?"]
    output: EquipmentReservation[]
    side_effects: []
  - method: GET
    path: "/recreation/equipment-reservations/{reservation_id}"
    description: "Reads one reservation."
    roles: [ProgramAdmin, IntakeCoordinator, ActivityLead, FundingOfficer, TransportDispatcher]
    code: 200
    input: []
    output: EquipmentReservation
    side_effects: []
  - method: POST
    path: "/recreation/equipment-reservations/{reservation_id}/check-out"
    description: "Physically issues the held item to a confirmed participant on a locked session."
    roles: [ActivityLead]
    code: 200
    input: []
    output: EquipmentReservation
    side_effects: ["reservation -> CHECKED_OUT", "item.pooled_held -= 1 and pooled_checked_out += 1", "increments EquipmentItem.version by 1"]
  - method: POST
    path: "/recreation/equipment-reservations/{reservation_id}/return"
    description: "Returns the item. GOOD leaves the item usable; DAMAGED takes it OUT_OF_SERVICE and voids its remaining holds."
    roles: [ActivityLead]
    code: 200
    input: [return_condition]
    output: EquipmentReservation
    side_effects: ["reservation -> RETURNED_GOOD or RETURNED_DAMAGED", "item counters restored", "CASCADE D on DAMAGED", "increments EquipmentItem.version by 1"]
  - method: POST
    path: "/recreation/equipment-reservations/{reservation_id}/release"
    description: "Drops a hold without issuing the item."
    roles: [ActivityLead, IntakeCoordinator]
    code: 200
    input: []
    output: EquipmentReservation
    side_effects: ["reservation -> RELEASED", "item.pooled_held -= 1 and pooled_available += 1", "increments EquipmentItem.version by 1"]

  # --- transportation -------------------------------------------------------
  - method: POST
    path: "/recreation/transport-runs"
    description: "Creates a run serving one session, with two independent capacity pools."
    roles: [TransportDispatcher]
    code: 201
    input: ["session_id", "pickup_start_at", "pickup_end_at", "fare_mode", "flat_fare_cents?", "route_miles_x10?", "accessible_positions", "ambulatory_seats"]
    output: TransportRun
    side_effects: ["run created PLANNED with accessible_available := accessible_positions and ambulatory_available := ambulatory_seats"]
  - method: GET
    path: "/recreation/transport-runs"
    description: "Lists runs, filterable by session and status."
    roles: [ProgramAdmin, IntakeCoordinator, ActivityLead, FundingOfficer, TransportDispatcher]
    code: 200
    input: ["session_id?", "status?", "limit?", "offset?"]
    output: TransportRun[]
    side_effects: []
  - method: GET
    path: "/recreation/transport-runs/{run_id}"
    description: "Reads one run, including both counter pairs and its version."
    roles: [ProgramAdmin, IntakeCoordinator, ActivityLead, FundingOfficer, TransportDispatcher]
    code: 200
    input: []
    output: TransportRun
    side_effects: []
  - method: POST
    path: "/recreation/transport-bookings"
    description: "Books exactly one position. OCC-guarded on the run because the two counters move independently."
    roles: [TransportDispatcher]
    code: 201
    input: [transport_run_id, enrollment_id, position_type, expected_run_version]
    output: TransportBooking
    side_effects: ["fare_cents pinned from calculations.transport_fare_cents", "the matching committed counter += 1 and available counter -= 1", "the enrollment's EnrollmentCharge transport_fee_cents and family_responsibility_cents recomputed", "run may transition PLANNED -> BOARDING_FULL", "increments TransportRun.version by 1"]
  - method: GET
    path: "/recreation/transport-bookings"
    description: "Lists bookings, filterable by run, enrollment and status."
    roles: [ProgramAdmin, IntakeCoordinator, ActivityLead, FundingOfficer, TransportDispatcher]
    code: 200
    input: ["transport_run_id?", "enrollment_id?", "status?", "limit?", "offset?"]
    output: TransportBooking[]
    side_effects: []
  - method: GET
    path: "/recreation/transport-bookings/{booking_id}"
    description: "Reads one booking."
    roles: [ProgramAdmin, IntakeCoordinator, ActivityLead, FundingOfficer, TransportDispatcher]
    code: 200
    input: []
    output: TransportBooking
    side_effects: []
  - method: POST
    path: "/recreation/transport-bookings/{booking_id}/confirm"
    description: "Confirms a reserved booking whose enrollment is already CONFIRMED."
    roles: [TransportDispatcher]
    code: 200
    input: []
    output: TransportBooking
    side_effects: ["booking -> CONFIRMED; no counter changes", "increments TransportBooking.version by 1"]
  - method: POST
    path: "/recreation/transport-bookings/{booking_id}/cancel"
    description: "Cancels a booking and restores exactly one counter."
    roles: [TransportDispatcher, IntakeCoordinator]
    code: 200
    input: []
    output: TransportBooking
    side_effects: ["booking -> CANCELLED", "the matching committed counter -= 1", "charge recomputed", "run may transition BOARDING_FULL -> PLANNED", "increments TransportRun.version by 1"]

  # --- scholarship funding --------------------------------------------------
  - method: POST
    path: "/recreation/funding-sources"
    description: "Creates a funding source inside an operating period. Financial write — blocked when the current period is RESTRICTED or CLOSING."
    roles: [FundingOfficer]
    code: 201
    input: ["operating_period_id", "name", "source_kind", "priority_rank", "award_mode", "award_pct_bp?", "flat_award_cents?", "total_budget_cents"]
    output: FundingSource
    side_effects: ["source created OPEN with available_cents := total_budget_cents, encumbered_cents 0, disbursed_cents 0"]
  - method: GET
    path: "/recreation/funding-sources"
    description: "Lists funding sources, filterable by period, kind and status."
    roles: [ProgramAdmin, IntakeCoordinator, ActivityLead, FundingOfficer, TransportDispatcher]
    code: 200
    input: ["operating_period_id?", "source_kind?", "status?", "limit?", "offset?"]
    output: FundingSource[]
    side_effects: []
  - method: GET
    path: "/recreation/funding-sources/{source_id}"
    description: "Reads one funding source with its full ledger and version."
    roles: [ProgramAdmin, IntakeCoordinator, ActivityLead, FundingOfficer, TransportDispatcher]
    code: 200
    input: []
    output: FundingSource
    side_effects: []
  - method: POST
    path: "/recreation/funding-sources/{source_id}/close"
    description: "Closes a source at a fiscal boundary; its PROPOSED awards lapse."
    roles: [FundingOfficer]
    code: 200
    input: []
    output: FundingSource
    side_effects: ["source -> CLOSED", "PROPOSED awards -> LAPSED_NO_FUNDS", "affected enrollments' funding_status -> UNFUNDED", "increments FundingSource.version by 1"]
  - method: GET
    path: "/recreation/funding-selection"
    description: "Computed read: runs calculations.funding_source_selector for one enrollment and returns the winning source with the version the client must echo back as expected_funding_source_version. Raises ERR_INSUFFICIENT_FUNDS when the candidate set is empty."
    roles: [FundingOfficer, ProgramAdmin]
    code: 200
    input: [enrollment_id]
    output: { enrollment_id: string, funding_source_id: string, funding_source_version: integer, award_mode: string, net_need_cents: integer, projected_award_cents: integer }
    side_effects: []
  - method: POST
    path: "/recreation/scholarship-awards"
    description: "Creates a PROPOSED award. amount_cents comes from the source's award_mode variant unless requested_amount_cents overrides it. OCC-guarded on the funding source."
    roles: [FundingOfficer]
    code: 201
    input: ["enrollment_id", "funding_source_id", "expected_funding_source_version", "requested_amount_cents?"]
    output: ScholarshipAward
    side_effects: ["amount_cents pinned from calculations.scholarship_award_amount_cents", "awarded_by_user_id := acting X-User-ID", "enrollment.funding_status UNFUNDED/RELEASED -> QUOTED when applicable", "increments FundingSource.version by 1"]
  - method: GET
    path: "/recreation/scholarship-awards"
    description: "Lists awards, filterable by enrollment, source and status."
    roles: [ProgramAdmin, IntakeCoordinator, ActivityLead, FundingOfficer, TransportDispatcher]
    code: 200
    input: ["enrollment_id?", "funding_source_id?", "status?", "limit?", "offset?"]
    output: ScholarshipAward[]
    side_effects: []
  - method: GET
    path: "/recreation/scholarship-awards/{award_id}"
    description: "Reads one award with its encumbered / disbursed split."
    roles: [ProgramAdmin, IntakeCoordinator, ActivityLead, FundingOfficer, TransportDispatcher]
    code: 200
    input: []
    output: ScholarshipAward
    side_effects: []
  - method: POST
    path: "/recreation/scholarship-awards/{award_id}/encumber"
    description: "Moves the award amount from the source's available_cents to its encumbered_cents."
    roles: [FundingOfficer]
    code: 200
    input: []
    output: ScholarshipAward
    side_effects: ["award -> ENCUMBERED", "source ledger moved", "source may transition OPEN -> EXHAUSTED", "enrollment charge recomputed", "increments ScholarshipAward.version by 1 and FundingSource.version by 1"]
  - method: POST
    path: "/recreation/scholarship-awards/{award_id}/disburse"
    description: "Pays out part or all of the encumbrance. Segregation of duties: the acting X-User-ID must differ from awarded_by_user_id."
    roles: [FundingOfficer]
    code: 200
    input: [amount_cents]
    output: ScholarshipAward
    side_effects: ["award -> PARTIALLY_DISBURSED or DISBURSED", "source.encumbered_cents -> disbursed_cents", "disbursed_by_user_id stamped", "increments ScholarshipAward.version by 1 and FundingSource.version by 1"]
  - method: POST
    path: "/recreation/scholarship-awards/{award_id}/release"
    description: "Returns the un-disbursed encumbrance to the source, using the FULL or REMAINDER variant of calculations.encumbrance_release_cents."
    roles: [FundingOfficer]
    code: 200
    input: []
    output: ScholarshipAward
    side_effects: ["award -> RELEASED", "source.available_cents restored", "source may transition EXHAUSTED -> OPEN", "enrollment charge recomputed", "increments ScholarshipAward.version by 1 and FundingSource.version by 1"]

  # --- goals and progress ---------------------------------------------------
  - method: POST
    path: "/recreation/goals"
    description: "Creates a goal with its mastery criterion. mastery_window_m defaults to 5 and mastery_hits_n to 4."
    roles: [IntakeCoordinator]
    code: 201
    input: ["participant_id", "title", "measure", "baseline_value", "target_value", "mastery_mode", "mastery_criterion_score", "mastery_window_m?", "mastery_hits_n?", "review_due_on"]
    output: Goal
    side_effects: ["Goal created ACTIVE with rating_count 0"]
  - method: GET
    path: "/recreation/goals"
    description: "Lists goals, filterable by participant and status."
    roles: [ProgramAdmin, IntakeCoordinator, ActivityLead, FundingOfficer, TransportDispatcher, CaregiverUser]
    code: 200
    input: ["participant_id?", "status?", "limit?", "offset?"]
    output: Goal[]
    side_effects: []
  - method: GET
    path: "/recreation/goals/{goal_id}"
    description: "Reads one goal, including its current mastery status and rating_count."
    roles: [ProgramAdmin, IntakeCoordinator, ActivityLead, FundingOfficer, TransportDispatcher, CaregiverUser]
    code: 200
    input: []
    output: Goal
    side_effects: []
  - method: POST
    path: "/recreation/goals/{goal_id}/ratings"
    description: "Records a rating anchored to a session the participant ATTENDED, then re-derives mastery. rated_by_staff_id is taken from the acting ActivityLead's X-User-ID."
    roles: [ActivityLead]
    code: 201
    input: ["session_id", "score", "note?"]
    output: GoalRating
    side_effects: ["rated_session_start_at pinned", "goal.rating_count += 1", "goal may transition ACTIVE <-> MASTERED", "increments Goal.version by 1"]
  - method: GET
    path: "/recreation/goal-ratings"
    description: "Lists ratings, filterable by goal, session and rater."
    roles: [ProgramAdmin, IntakeCoordinator, ActivityLead, FundingOfficer, TransportDispatcher, CaregiverUser]
    code: 200
    input: ["goal_id?", "session_id?", "rated_by_staff_id?", "limit?", "offset?"]
    output: GoalRating[]
    side_effects: []
  - method: GET
    path: "/recreation/goal-ratings/{rating_id}"
    description: "Reads one rating."
    roles: [ProgramAdmin, IntakeCoordinator, ActivityLead, FundingOfficer, TransportDispatcher]
    code: 200
    input: []
    output: GoalRating
    side_effects: []

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_MISSING_ROLE_HEADER
    http: 401
    condition: "X-User-Role header absent or empty."
  - id: ERR_MISSING_USER_ID_HEADER
    http: 401
    condition: "X-User-ID header absent or empty."
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not one of the six declared roles."
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The role is not listed in the called endpoint's roles set."
  - id: ERR_IDENTITY_NOT_FOUND
    http: 403
    condition: "An entity-backed role's X-User-ID does not resolve to a StaffMember (ActivityLead) or Caregiver (CaregiverUser)."
  - id: ERR_CAREGIVER_SCOPE_VIOLATION
    http: 403
    condition: "A CaregiverUser touched a resource belonging to a participant other than its own Caregiver.participant_id."
  - id: ERR_STAFF_NOT_ASSIGNED_TO_SESSION
    http: 403
    condition: "An ActivityLead performed a session-delivery operation on a session it holds no PROPOSED/CONFIRMED/DELIVERED StaffAssignment for."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The FundingOfficer disbursing an award is the same X-User-ID that created it."
  - id: ERR_PERIOD_FROZEN
    http: 409
    condition: "The current OperatingPeriod is FROZEN or CLOSED and a non-exempt mutating endpoint was called."
  - id: ERR_PERIOD_RESTRICTED
    http: 409
    condition: "The current OperatingPeriod is RESTRICTED or CLOSING and one of the seven financial-write endpoints was called."
  - id: ERR_PARTICIPANT_NOT_FOUND
    http: 404
    condition: "A referenced Participant id does not exist."
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "A referenced ActivityProgram id does not exist."
  - id: ERR_SESSION_NOT_FOUND
    http: 404
    condition: "A referenced ProgramSession id does not exist."
  - id: ERR_ENROLLMENT_NOT_FOUND
    http: 404
    condition: "A referenced Enrollment id does not exist."
  - id: ERR_CHARGE_NOT_FOUND
    http: 404
    condition: "A referenced EnrollmentCharge id does not exist."
  - id: ERR_STAFF_NOT_FOUND
    http: 404
    condition: "A referenced StaffMember id does not exist."
  - id: ERR_CERTIFICATION_NOT_FOUND
    http: 404
    condition: "A referenced StaffCertification id does not exist."
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "A referenced StaffAssignment id does not exist."
  - id: ERR_EQUIPMENT_NOT_FOUND
    http: 404
    condition: "A referenced EquipmentItem id does not exist."
  - id: ERR_RESERVATION_NOT_FOUND
    http: 404
    condition: "A referenced EquipmentReservation id does not exist."
  - id: ERR_TRANSPORT_RUN_NOT_FOUND
    http: 404
    condition: "A referenced TransportRun id does not exist."
  - id: ERR_TRANSPORT_BOOKING_NOT_FOUND
    http: 404
    condition: "A referenced TransportBooking id does not exist."
  - id: ERR_FUNDING_SOURCE_NOT_FOUND
    http: 404
    condition: "A referenced FundingSource id does not exist."
  - id: ERR_AWARD_NOT_FOUND
    http: 404
    condition: "A referenced ScholarshipAward id does not exist."
  - id: ERR_FEE_BAND_NOT_FOUND
    http: 404
    condition: "No FeeScaleBand row covers the participant's household_size and income_band, or a referenced band id does not exist."
  - id: ERR_CONSENT_NOT_FOUND
    http: 404
    condition: "A referenced ConsentArtifact id does not exist."
  - id: ERR_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "A referenced SupportAssessment id does not exist."
  - id: ERR_CAREGIVER_NOT_FOUND
    http: 404
    condition: "A referenced Caregiver id does not exist."
  - id: ERR_GOAL_NOT_FOUND
    http: 404
    condition: "A referenced Goal id does not exist."
  - id: ERR_RATING_NOT_FOUND
    http: 404
    condition: "A referenced GoalRating id does not exist."
  - id: ERR_PERIOD_NOT_FOUND
    http: 404
    condition: "A referenced OperatingPeriod id does not exist."
  - id: ERR_VALIDATION
    http: 400
    condition: "A required input field is missing, of the wrong JSON type, or outside its declared numeric range."
  - id: ERR_INVALID_ENUM
    http: 400
    condition: "An enum-typed input field carries a value that is not a declared member of that enum."
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside 1..100 or offset below 0."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "An expected_<parent>_version input does not equal the parent's current version."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target entity is not in a declared from-state for the requested transition, and is not terminal."
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "The target entity is already in a terminal state of the axis being driven."
  - id: ERR_SESSION_NOT_OPEN
    http: 409
    condition: "An enrollment create or confirm named a session whose status is not OPEN."
  - id: ERR_ENROLLMENT_CUTOFF_PASSED
    http: 422
    condition: "The session starts less than SESSION_ENROLLMENT_CUTOFF_HOURS (24) after the logical clock."
  - id: ERR_PROGRAM_SESSION_MISMATCH
    http: 422
    condition: "A cross-reference names resources that do not belong to the same ProgramSession or program."
  - id: ERR_DUPLICATE_ENROLLMENT
    http: 409
    condition: "The participant already holds a REQUESTED, WAITLISTED or CONFIRMED enrollment on this session."
  - id: ERR_DUPLICATE_GOAL_RATING
    http: 409
    condition: "The goal already carries a GoalRating for this session."
  - id: ERR_PARTICIPANT_NOT_ACTIVE
    http: 409
    condition: "The participant's status is not ACTIVE."
  - id: ERR_REQUIRED_CONSENT_MISSING
    http: 422
    condition: "A consent_type in the program's required_consent_types has no SIGNED ConsentArtifact for the participant."
  - id: ERR_CONSENT_EXPIRED
    http: 422
    condition: "A required SIGNED consent has expires_on earlier than the session date."
  - id: ERR_CONSENT_SIGNER_NOT_AUTHORIZED
    http: 422
    condition: "The signer does not satisfy calculations.consent_signer_authority for this participant and consent_type."
  - id: ERR_ASSESSMENT_STALE
    http: 422
    condition: "No ACTIVE SupportAssessment, or its assessed_on is more than ASSESSMENT_VALIDITY_DAYS (365) before the session date."
  - id: ERR_MED_ADMIN_COVERAGE_MISSING
    http: 422
    condition: "The program requires medication administration but no live assignment on the session holds a MEDICATION_ADMIN certification valid at the session date."
  - id: ERR_STAFF_CERT_MISSING
    http: 422
    condition: "The staffer holds no StaffCertification row for a certification_type the program requires."
  - id: ERR_STAFF_CERT_EXPIRED_AT_ASSIGNMENT
    http: 422
    condition: "A required certification's expires_on is earlier than today's logical-clock date, checked at assignment creation."
  - id: ERR_STAFF_CERT_EXPIRES_BEFORE_SESSION
    http: 422
    condition: "A required certification's expires_on is earlier than the session date, checked at assignment confirm, revalidate and staffing lock."
  - id: ERR_STAFF_TIME_CONFLICT
    http: 409
    condition: "The staffer's live assignments collide under half-open intervals widened by STAFF_TURNAROUND_BUFFER_MINUTES (30)."
  - id: ERR_PARTICIPANT_TIME_CONFLICT
    http: 409
    condition: "The participant's live enrollments collide under strictly half-open intervals with no buffer."
  - id: ERR_RATING_SESSION_NOT_ATTENDED
    http: 422
    condition: "The goal's participant has no ATTENDED enrollment on the rated session."
  - id: ERR_SESSION_FULL
    http: 409
    condition: "session.slots_available is 0 and the confirm request did not carry on_full WAITLIST or DENY."
  - id: ERR_ONE_TO_ONE_POOL_EXHAUSTED
    http: 409
    condition: "The participant's tier is ONE_TO_ONE, session.one_to_one_available is 0, and the confirm request did not carry on_full WAITLIST or DENY."
  - id: ERR_STAFFING_GAP
    http: 409
    condition: "session.staffing_gap is greater than 0 at staffing lock."
  - id: ERR_UNLOCK_LIMIT_REACHED
    http: 409
    condition: "session.unlock_count already equals MAX_SESSION_UNLOCKS (2)."
  - id: ERR_EQUIPMENT_FIT_MISMATCH
    http: 422
    condition: "The item's model_code or size_code differs from the program requirement, or its weight_capacity_kg is below the participant's weight_kg."
  - id: ERR_EQUIPMENT_INSPECTION_OVERDUE
    http: 409
    condition: "A SERIALIZED item is not SERVICEABLE, or its inspection_due_date falls before the session date."
  - id: ERR_EQUIPMENT_UNAVAILABLE
    http: 409
    condition: "item.pooled_available is 0."
  - id: ERR_POSITION_TYPE_MISMATCH
    http: 422
    condition: "position_type does not match participant.mobility_profile."
  - id: ERR_TRANSPORT_WINDOW_MISMATCH
    http: 422
    condition: "run.pickup_end_at is later than session.start_at minus TRANSPORT_ARRIVAL_BUFFER_MINUTES (15)."
  - id: ERR_ACCESSIBLE_POSITIONS_FULL
    http: 409
    condition: "run.accessible_available is 0 for an ACCESSIBLE booking."
  - id: ERR_AMBULATORY_SEATS_FULL
    http: 409
    condition: "run.ambulatory_available is 0 for an AMBULATORY booking."
  - id: ERR_FUNDING_PERIOD_CLOSED
    http: 409
    condition: "The named funding source is CLOSED, or its OperatingPeriod is not OPEN. An EXHAUSTED source is NOT reported here; it falls through to ERR_INSUFFICIENT_FUNDS."
  - id: ERR_INSUFFICIENT_FUNDS
    http: 409
    condition: "The computed or requested award exceeds source.available_cents, resolves to 0 cents, or the funding selector's candidate set is empty."
  - id: ERR_AWARD_EXCEEDS_NEED
    http: 422
    condition: "requested_amount_cents exceeds the enrollment's EnrollmentCharge.program_fee_cents."
  - id: ERR_DISBURSEMENT_EXCEEDS_ENCUMBRANCE
    http: 422
    condition: "A disbursement's amount_cents is below 1 or above award.encumbered_cents minus award.disbursed_cents."
  - id: ERR_FAMILY_BALANCE_OUTSTANDING
    http: 402
    condition: "The participant carries an OUTSTANDING EnrollmentCharge on an already-DELIVERED session."

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: ProgramAdmin
    description: "Configures periods, fee bands, programs, sessions, staff, certifications and the equipment catalogue, and drives the logical clock. Deliberately cannot enroll participants, sign consents, or move money."
    identity: "opaque"
    exclusive_operations:
      - "POST /recreation/_clock/set_current_utc"
      - "POST /recreation/operating-periods"
      - "POST /recreation/operating-periods/{period_id}/posture"
      - "POST /recreation/fee-scale-bands"
      - "POST /recreation/activity-programs"
      - "POST /recreation/program-sessions"
      - "POST /recreation/staff-members"
      - "POST /recreation/staff-certifications"
      - "POST /recreation/staff-certifications/{certification_id}/renew"
      - "POST /recreation/equipment-items"
      - "POST /recreation/equipment-items/{item_id}/inspections"
    shared_operations:
      - "POST /recreation/program-sessions/{session_id}/open (with ActivityLead)"
      - "POST /recreation/program-sessions/{session_id}/cancel (with ActivityLead)"
      - "POST /recreation/staff-assignments (with ActivityLead)"
      - "POST /recreation/staff-assignments/{assignment_id}/withdraw (with ActivityLead)"
      - "GET /recreation/funding-selection (with FundingOfficer)"
      - "every GET read endpoint"

  - name: IntakeCoordinator
    description: "Owns participant intake, caregivers, assessments, consents, goals and the enrollment roster. Cannot create money, staff a session, or drive the clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /recreation/participants"
      - "PATCH /recreation/participants/{participant_id}"
      - "POST /recreation/participants/{participant_id}/status"
      - "POST /recreation/caregivers"
      - "POST /recreation/support-assessments"
      - "POST /recreation/support-assessments/{assessment_id}/activate"
      - "POST /recreation/consents"
      - "POST /recreation/enrollments/{enrollment_id}/confirm"
      - "POST /recreation/goals"
    shared_operations:
      - "POST /recreation/enrollments (with CaregiverUser)"
      - "POST /recreation/enrollments/{enrollment_id}/withdraw (with CaregiverUser)"
      - "POST /recreation/consents/{consent_id}/sign (with CaregiverUser)"
      - "POST /recreation/consents/{consent_id}/revoke (with CaregiverUser)"
      - "POST /recreation/equipment-reservations (with ActivityLead)"
      - "POST /recreation/equipment-reservations/{reservation_id}/release (with ActivityLead)"
      - "POST /recreation/transport-bookings/{booking_id}/cancel (with TransportDispatcher)"
      - "every GET read endpoint"

  - name: ActivityLead
    description: "A StaffMember who runs sessions: opens, staffs, locks, delivers, records attendance, issues equipment and rates goals. X-User-ID is that StaffMember's id, and delivery-time operations additionally require an assignment on the session."
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /recreation/program-sessions/{session_id}/lock-staffing"
      - "POST /recreation/program-sessions/{session_id}/unlock-staffing"
      - "POST /recreation/program-sessions/{session_id}/deliver"
      - "POST /recreation/enrollments/{enrollment_id}/attendance"
      - "POST /recreation/staff-assignments/{assignment_id}/confirm"
      - "POST /recreation/staff-assignments/{assignment_id}/revalidate"
      - "POST /recreation/equipment-reservations/{reservation_id}/check-out"
      - "POST /recreation/equipment-reservations/{reservation_id}/return"
      - "POST /recreation/goals/{goal_id}/ratings"
    shared_operations:
      - "POST /recreation/program-sessions/{session_id}/open (with ProgramAdmin)"
      - "POST /recreation/program-sessions/{session_id}/cancel (with ProgramAdmin)"
      - "POST /recreation/staff-assignments (with ProgramAdmin)"
      - "POST /recreation/staff-assignments/{assignment_id}/withdraw (with ProgramAdmin)"
      - "POST /recreation/equipment-reservations (with IntakeCoordinator)"
      - "POST /recreation/equipment-reservations/{reservation_id}/release (with IntakeCoordinator)"
      - "every GET read endpoint"

  - name: FundingOfficer
    description: "Owns funding sources, scholarship awards, disbursements and family payments. Segregation of duties: the officer who created an award may never disburse it."
    identity: "opaque"
    exclusive_operations:
      - "POST /recreation/funding-sources"
      - "POST /recreation/funding-sources/{source_id}/close"
      - "POST /recreation/scholarship-awards"
      - "POST /recreation/scholarship-awards/{award_id}/encumber"
      - "POST /recreation/scholarship-awards/{award_id}/disburse"
      - "POST /recreation/scholarship-awards/{award_id}/release"
      - "POST /recreation/enrollment-charges/{charge_id}/payments"
    shared_operations:
      - "GET /recreation/funding-selection (with ProgramAdmin)"
      - "every GET read endpoint"

  - name: TransportDispatcher
    description: "Owns transport runs and the two independent position pools."
    identity: "opaque"
    exclusive_operations:
      - "POST /recreation/transport-runs"
      - "POST /recreation/transport-bookings"
      - "POST /recreation/transport-bookings/{booking_id}/confirm"
    shared_operations:
      - "POST /recreation/transport-bookings/{booking_id}/cancel (with IntakeCoordinator)"
      - "every GET read endpoint"

  - name: CaregiverUser
    description: "A Caregiver acting for exactly one participant. X-User-ID is that Caregiver's id, and every request is scoped to Caregiver.participant_id."
    identity: "entity_backed:Caregiver"
    exclusive_operations: []
    shared_operations:
      - "POST /recreation/enrollments (with IntakeCoordinator)"
      - "POST /recreation/enrollments/{enrollment_id}/withdraw (with IntakeCoordinator)"
      - "POST /recreation/consents/{consent_id}/sign (with IntakeCoordinator)"
      - "POST /recreation/consents/{consent_id}/revoke (with IntakeCoordinator)"
      - "GET reads scoped to its own participant: participants, caregivers, consents, program-sessions, enrollments, enrollment-charges, goals, goal-ratings"

# ---------------------------------------------------------------------------
# Conservation invariants — each is a compensating-action invariant pinned as an
# explicit formula over declared entity fields. Every forward action and its
# compensating action must leave the named quantity unchanged.
# ---------------------------------------------------------------------------
invariants:
  - name: slot_conservation
    quantity: "program-slot occupancy on one ProgramSession"
    formula: |
      ProgramSession.slot_capacity == ProgramSession.slots_committed + ProgramSession.slots_available
      AND ProgramSession.slots_committed == count(Enrollment WHERE session_id == session.id
                                                  AND enrollment_status == "CONFIRMED")
    holds_after: ["enrollment confirm", "enrollment withdraw (CASCADE A)", "waitlist promotion", "CONFIRMED -> WAITLISTED demotion", "session cancel (CASCADE B)", "attendance"]
  - name: one_to_one_pool_conservation
    quantity: "dedicated 1:1 support capacity on one ProgramSession"
    formula: |
      ProgramSession.one_to_one_pool_size == ProgramSession.one_to_one_committed
                                           + ProgramSession.one_to_one_available
      AND ProgramSession.one_to_one_committed == count(Enrollment WHERE session_id == session.id
              AND enrollment_status == "CONFIRMED"
              AND effective_support_tier_at_session == "ONE_TO_ONE")
    holds_after: ["enrollment confirm", "enrollment withdraw", "support-assessment activation that changes a tier", "session cancel"]
  - name: funding_ledger_conservation
    quantity: "cents in one FundingSource"
    formula: |
      FundingSource.total_budget_cents == FundingSource.available_cents
                                        + FundingSource.encumbered_cents
                                        + FundingSource.disbursed_cents
      AND FundingSource.encumbered_cents == sum(ScholarshipAward.encumbered_cents
              - ScholarshipAward.disbursed_cents
              WHERE funding_source_id == source.id
              AND status IN {"ENCUMBERED", "PARTIALLY_DISBURSED"})
    holds_after: ["award encumber", "award disburse (full and partial)", "award release (FULL and REMAINDER variants)", "enrollment withdraw (CASCADE A)", "funding-source close", "period close (CASCADE F)"]
  - name: transport_position_conservation
    quantity: "seats on one TransportRun, tracked as two non-interchangeable pools"
    formula: |
      TransportRun.accessible_positions == TransportRun.accessible_committed
                                         + TransportRun.accessible_available
      AND TransportRun.ambulatory_seats == TransportRun.ambulatory_committed
                                         + TransportRun.ambulatory_available
      AND no action ever moves a unit between the accessible and ambulatory pools
    holds_after: ["booking create", "booking cancel", "booking NO_SHOW", "enrollment withdraw (CASCADE A)", "session cancel (CASCADE B)"]
  - name: pooled_equipment_conservation
    quantity: "physical units of one EquipmentItem"
    formula: |
      EquipmentItem.pooled_total == EquipmentItem.pooled_available
                                  + EquipmentItem.pooled_held
                                  + EquipmentItem.pooled_checked_out
      AND EquipmentItem.pooled_held == count(EquipmentReservation WHERE equipment_item_id == item.id
                                             AND status == "HELD")
      AND EquipmentItem.pooled_checked_out == count(EquipmentReservation
                                             WHERE equipment_item_id == item.id
                                             AND status == "CHECKED_OUT")
    holds_after: ["reservation create", "check-out", "return (GOOD and DAMAGED)", "release", "CASCADE D void", "enrollment withdraw (CASCADE A)"]
