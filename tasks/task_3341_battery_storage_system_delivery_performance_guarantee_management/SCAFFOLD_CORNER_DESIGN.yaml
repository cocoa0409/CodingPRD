          setup_api_calls:
            - *ck
            - call: "POST /equipment-supply-agreements"
              payload: { project_id: "${proj_id}", contracted_power_mw: 10, contracted_energy_mwh: 40, guaranteed_capacity_mwh: 38, guaranteed_rte_pct: 0.88, price_per_mwh_cents: 300000, ld_rate_per_day_cents: 40000, ld_cap_cents: 1200000, guaranteed_delivery_date: "2026-10-01T00:00:00Z", longstop_date: "2026-12-01T00:00:00Z" }
              as: ProjectDeveloper
              captures: { esa_id: $.data.id }
            - call: "POST /safety-permits"
              payload: { project_id: "${proj_id}", permit_type: "THERMAL_RUNAWAY_PLAN", authority_reference: "T" }
              as: ProjectDeveloper
              captures: { p1: $.data.id }
            - call: "POST /safety-permits"
              payload: { project_id: "${proj_id}", permit_type: "FIRE_CODE", authority_reference: "F" }
              as: ProjectDeveloper
              captures: { p2: $.data.id }
            - call: "POST /safety-permits"
              payload: { project_id: "${proj_id}", permit_type: "LOCAL_APPROVAL", authority_reference: "L" }
              as: ProjectDeveloper
              captures: { p3: $.data.id }
            - call: "POST /safety-permits/${p1}/decide"
              payload: { decision: "APPROVED" }
              as: SafetyAuthority
            - call: "POST /safety-permits/${p2}/decide"
              payload: { decision: "APPROVED" }
              as: SafetyAuthority
            - call: "POST /safety-permits/${p3}/decide"
              payload: { decision: "APPROVED" }
              as: SafetyAuthority
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: ProjectDeveloper
              captures: { proj_v: $.data.version }
            - call: "POST /equipment-supply-agreements/${esa_id}/execute"
              payload: { expected_project_version: "${proj_v}" }
              as: ProjectDeveloper
            - call: "POST /delivery-milestones"
              payload: { esa_id: "${esa_id}", kind: "COMMISSIONING", planned_date: "2026-09-02T00:00:00Z" }
              as: ProjectDeveloper
              captures: { mc: $.data.id }
            - call: "POST /delivery-milestones/${mc}/record-outcome"
              payload: { outcome: "ACHIEVED", actual_date: "2026-09-01T00:00:00Z" }
              as: ProjectDeveloper
            - call: "POST /projects/${proj_id}/recompute-projection"
              payload: { equivalent_cycles: 0 }
              as: PerformanceEngineer
          trigger:
            - call: "POST /augmentation-events"
              payload: { project_id: "${proj_id}", planned_window_start: "2026-09-01T00:00:00Z", planned_window_end: "2026-10-01T00:00:00Z", added_capacity_mwh: 2 }
              as: ServiceEngineer
              captures: { a1: $.data.id }
            - call: "POST /augmentation-events"
              payload: { project_id: "${proj_id}", planned_window_start: "2026-09-01T00:00:00Z", planned_window_end: "2026-10-01T00:00:00Z", added_capacity_mwh: 5 }
              as: ServiceEngineer
              captures: { a2: $.data.id }
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: ProjectDeveloper
              captures: { proj_v2: $.data.version }
            - call: "POST /augmentation-events/${a1}/execute"
              payload: { expected_project_version: "${proj_v2}" }
              as: ServiceEngineer
            - call: "POST /augmentation-events/${a2}/cancel"
              payload: {}
              as: ServiceEngineer
          assert:
            - "Project.${proj_id}.projected_capacity_mwh == 42.0 (40 + 2; the cancelled 5 MWh event never entered the sum)"
            - "Project.${proj_id}.augmentation_count == 1 (PLANNED+EXECUTED count; the cancelled event drops out)"
            - "AugmentationEvent.${a2}.status == CANCELLED and origin == MANUAL"

      - name: dual_variant_coverage_stubs
        claim_type: excluded_stub
        grounds: [calculations.warranty_credit, calculations.capacity_guarantee_evaluation]
        distinguishing_aspect: "Both dual-variant calculations are covered by difficulty instances."
        excluded_because:
          difficulty_instance: dual_variant_calc / warranty_credit_straight_vs_output_divergence
          rationale: "Both variants of warranty_credit and capacity_guarantee_evaluation are asserted with literal values in the two dual_variant_calc instances."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_visible_in_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "The record-outcome response itself carries the computed days_late and ld_applied_cents; a follow-up GET of the ESA shows accrued_ld_cents already updated — no async lag."
        test_recipe:
          setup: ["Project + permits + executed ESA; one DELIVERY milestone planned 2026-10-01."]
          setup_api_calls:
            - *ck
            - call: "POST /equipment-supply-agreements"
              payload: { project_id: "${proj_id}", contracted_power_mw: 10, contracted_energy_mwh: 40, guaranteed_capacity_mwh: 38, guaranteed_rte_pct: 0.88, price_per_mwh_cents: 300000, ld_rate_per_day_cents: 40000, ld_cap_cents: 1200000, guaranteed_delivery_date: "2026-10-01T00:00:00Z", longstop_date: "2026-12-01T00:00:00Z" }
              as: ProjectDeveloper
              captures: { esa_id: $.data.id }
            - call: "POST /safety-permits"
              payload: { project_id: "${proj_id}", permit_type: "THERMAL_RUNAWAY_PLAN", authority_reference: "T" }
              as: ProjectDeveloper
              captures: { p1: $.data.id }
            - call: "POST /safety-permits"
              payload: { project_id: "${proj_id}", permit_type: "FIRE_CODE", authority_reference: "F" }
              as: ProjectDeveloper
              captures: { p2: $.data.id }
            - call: "POST /safety-permits"
              payload: { project_id: "${proj_id}", permit_type: "LOCAL_APPROVAL", authority_reference: "L" }
              as: ProjectDeveloper
              captures: { p3: $.data.id }
            - call: "POST /safety-permits/${p1}/decide"
              payload: { decision: "APPROVED" }
              as: SafetyAuthority
            - call: "POST /safety-permits/${p2}/decide"
              payload: { decision: "APPROVED" }
              as: SafetyAuthority
            - call: "POST /safety-permits/${p3}/decide"
              payload: { decision: "APPROVED" }
              as: SafetyAuthority
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: ProjectDeveloper
              captures: { proj_v: $.data.version }
            - call: "POST /equipment-supply-agreements/${esa_id}/execute"
              payload: { expected_project_version: "${proj_v}" }
              as: ProjectDeveloper
            - call: "POST /delivery-milestones"
              payload: { esa_id: "${esa_id}", kind: "DELIVERY", planned_date: "2026-10-01T00:00:00Z" }
              as: ProjectDeveloper
              captures: { m1: $.data.id }
          trigger:
            - call: "POST /delivery-milestones/${m1}/record-outcome"
              payload: { outcome: "MISSED", actual_date: "2026-10-06T00:00:00Z" }
              as: ProjectDeveloper
              captures: { days: $.data.days_late, ld: $.data.ld_applied_cents }
            - call: "GET /equipment-supply-agreements/${esa_id}"
              payload: {}
              as: ProjectDeveloper
              captures: { accrued: $.data.accrued_ld_cents }
          assert:
            - "the record-outcome response itself has days_late == 5 and ld_applied_cents == 200000"
            - "the immediate follow-up GET shows EquipmentSupplyAgreement.${esa_id}.accrued_ld_cents == 200000 and net_ld_due_cents == 200000"
