            - { call: "POST /auxiliary/placements/${p1}/rescind", payload: { reason: "schedule conflict" }, as: VolunteerCoordinator }
            - { call: "GET /auxiliary/department-requests/${req_id}", as: VolunteerCoordinator, captures: { st2: $.data.status, f2: $.data.slots_filled } }
            - { call: "POST /auxiliary/placements", payload: { request_id: "${req_id}", volunteer_id: "${v3}" }, as: VolunteerCoordinator, captures: { p3: $.data.id } }
            - { call: "POST /auxiliary/placements/${p3}/accept", as: Volunteer, as_user_id: "${v3}" }
