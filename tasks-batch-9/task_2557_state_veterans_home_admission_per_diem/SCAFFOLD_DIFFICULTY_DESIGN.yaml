              captures: { released_row_flag: "$.data[0].claimed", released_row_claim: "$.data[0].per_diem_claim_id" }
            - call: "POST /svh/per-diem-claims"
              payload: { veterans_home_id: "${home_id}", care_unit_id: "${nu_id}", claim_month: "2026-08", basis: "AUDITED_BASIS" }
              as: BusinessOfficeManager
              as_user_id: "bom-1"
              captures: { c2_id: "$.data.id", c2_rd: "$.data.resident_day_count", c2_amt: "$.data.claim_amount_cents" }
          assert:
            - "c1_amt == 367567"
            - "claimed_row_flag == true"
            - "claimed_row_claim == ${c1_id}"
            - "PerDiemClaim.${c1_id}.status == REJECTED"
            - "PerDiemClaim.${c1_id}.paid_amount_cents == 0"
            - "PerDiemClaim.${c1_id}.rejection_code == CENSUS_MISMATCH"
            - "released_row_flag == false"
            - "released_row_claim == null"
            - "c2_rd == 31"
            - "c2_amt == 367567"
            - "PerDiemClaim.${c2_id}.billable_day_count == 31"
            - "PerDiemClaim.${c2_id}.census_reported_resident_count == 1"
