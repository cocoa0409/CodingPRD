          Mode (b) nested rounding where order matters: per-line round-then-sum is
          pinned. Two PURCHASE lines at unit_cost 33.335 cents/serving x 3
          servings each: raw line = 100.005 -> per-line round_half_up = 100.01;
          pinned total = 200.02 cents, whereas sum-then-round gives
          round(200.01) = 200.01 — a one-cent divergence that identifies the
