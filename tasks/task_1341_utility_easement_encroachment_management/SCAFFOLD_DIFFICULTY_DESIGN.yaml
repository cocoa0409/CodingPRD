  # =====================================================================
  # Rule 4: transitive_cascade — different triggers, depth >=3 and >=2
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: offer_expire_to_condemnation_referral_to_judgment_to_case_closure
        grounds:
          - state_machines.AcquisitionOffer.TENDERED_to_EXPIRED
          - state_machines.AcquisitionOffer.EXPIRED_to_CONDEMNATION_REFERRED
          - state_machines.LitigationReferral.FILED_to_JUDGMENT_OBTAINED
          - state_machines.EasementCase.RESOLUTION_PENDING_to_CLOSED_CONDEMNED
        distinguishing_aspect: |
          Depth-3 cascade: offer negotiation_deadline passes -> offer EXPIRED
          -> director refers to condemnation -> LitigationReferral auto-created
          (REFERRED) -> counsel accepts/files/records judgment -> case
          auto-transitions RESOLUTION_PENDING -> CLOSED_CONDEMNED. Originates
          from the offer-expiry trigger.
        test_recipe:
          setup:
            - "EasementCase ACTIVE_MONITORING, title_cleared, RECORDED doc, one encroachment DISCOVERED"
            - "AcquisitionOffer TENDERED with negotiation_deadline in the past (via clock)"
          setup_api_calls:
            - call: "POST /easement-cases"
              payload: { case_code: "ESM-007", utility_district: "D1", county: "King", parcel_id: "P-007", easement_width_ft: 50, easement_area_sqft: 10000, fair_market_value_per_sqft: 10, acquisition_budget_cents: 50000000 }
              as: RightOfWayAgent
              captures: { case_id: $.data.id }
            - call: "POST /easement-cases/${case_id}/documents"
              payload: { doc_kind: "DEED", instrument_number: "INST-601", recording_date: "2026-07-01T00:00:00Z", grantor_name: "S", grantee_name: "CU", gis_polygon_wkt: "POLYGON((0 0,1 0,1 1,0 1,0 0))", width_ft: 50 }
              as: TitleExaminer
              captures: { doc_id: $.data.id }
            - call: "POST /easement-cases/${case_id}/title-searches"
              payload: { search_scope: "FULL_CHAIN" }
              as: TitleExaminer
              captures: { task_id: $.data.id }
            - call: "POST /easement-cases/${case_id}/title-searches/${task_id}/begin"
              payload: {}
              as: TitleExaminer
            - call: "POST /easement-cases/${case_id}/title-searches/${task_id}/complete"
              payload: { liens_found: 0, defects_found: 0, chain_of_title_json: { links: [] } }
              as: TitleExaminer
            - call: "POST /easement-cases/${case_id}/documents/${doc_id}/record"
              payload: {}
              as: TitleExaminer
            - call: "POST /easement-cases/${case_id}/begin-mapping"
              payload: {}
              as: RightOfWayAgent
            - call: "POST /easement-cases/${case_id}/activate-monitoring"
              payload: {}
              as: RightOfWayAgent
            - call: "POST /easement-cases/${case_id}/offers"
              payload: { landowner_name: "J", landowner_contact: "j@x.com", offered_area_sqft: 100, severance_damages_cents: 0 }
              as: RightOfWayAgent
              captures: { offer_id: $.data.id }
            - call: "GET /easement-cases/${case_id}"
              payload: {}
              as: RightOfWayAgent
              captures: { case_v: $.data.version }
            - call: "POST /easement-cases/${case_id}/offers/${offer_id}/tender"
              payload: { expected_case_version: "${case_v}" }
              as: RightOfWayAgent
            # Advance clock past negotiation_deadline (NEGOTIATION_WINDOW_DAYS=30)
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: RightOfWayAgent
            # Trigger lazy expiry by attempting counter (or read) — assume a system sweep or lazy check.
            # We model expiry as happening at the next mutating action; here we use refer-to-condemnation after observing EXPIRED.
            - call: "GET /easement-cases/${case_id}/offers/${offer_id}"
              payload: {}
              as: RightOfWayAgent
              captures: { offer_status: $.data.status }
          trigger:
            - call: "POST /easement-cases/${case_id}/offers/${offer_id}/refer-to-condemnation"
              payload: {}
              as: DepartmentDirector
            - call: "GET /easement-cases/${case_id}/litigation-referrals"
              payload: {}
              as: LitigationCounsel
              captures: { ref_id: "$.data[0].id" }
            - call: "POST /easement-cases/${case_id}/litigation-referrals/${ref_id}/accept"
              payload: {}
              as: LitigationCounsel
            - call: "POST /easement-cases/${case_id}/litigation-referrals/${ref_id}/file"
              payload: {}
              as: LitigationCounsel
            - call: "POST /easement-cases/${case_id}/litigation-referrals/${ref_id}/record-judgment"
              payload: {}
              as: LitigationCounsel
          assert:
            - "LitigationReferral.${ref_id}.status == JUDGMENT_OBTAINED"
            - "EasementCase.${case_id}.status == CLOSED_CONDEMNED"

      - name: vegetation_violation_escalates_to_referral_and_remediation
        grounds:
          - state_machines.VegetationViolation.NOTIFIED_to_ESCALATED_TO_LEGAL
          - state_machines.LitigationReferral.FILED_to_JUDGMENT_OBTAINED
          - state_machines.VegetationZone.REMEDIATION_REQUIRED_to_CLEARED
        distinguishing_aspect: |
          Depth-2 cascade: vegetation remediation_deadline passes -> violation
          ESCALATED_TO_LEGAL + LitigationReferral auto-created -> counsel records
          judgment -> violation REMEDIATED -> zone.violation_count decremented
          -> zone auto-transitions to CLEARED. Originates from the deadline
          trigger, different from the offer-expiry trigger above.
        test_recipe:
          setup:
            - "EasementCase ACTIVE_MONITORING, RECORDED doc, VegetationZone ACTIVE_MONITORING with one violation NOTIFIED and remediation_deadline in past"
          setup_api_calls:
            - call: "POST /easement-cases"
              payload: { case_code: "ESM-008", utility_district: "D1", county: "King", parcel_id: "P-008", easement_width_ft: 50, easement_area_sqft: 10000, fair_market_value_per_sqft: 10, acquisition_budget_cents: 50000000 }
              as: RightOfWayAgent
              captures: { case_id: $.data.id }
            - call: "POST /easement-cases/${case_id}/documents"
              payload: { doc_kind: "DEED", instrument_number: "INST-701", recording_date: "2026-07-01T00:00:00Z", grantor_name: "S", grantee_name: "CU", gis_polygon_wkt: "POLYGON((0 0,1 0,1 1,0 1,0 0))", width_ft: 50 }
              as: TitleExaminer
              captures: { doc_id: $.data.id }
            - call: "POST /easement-cases/${case_id}/title-searches"
              payload: { search_scope: "FULL_CHAIN" }
              as: TitleExaminer
              captures: { task_id: $.data.id }
            - call: "POST /easement-cases/${case_id}/title-searches/${task_id}/begin"
              payload: {}
              as: TitleExaminer
            - call: "POST /easement-cases/${case_id}/title-searches/${task_id}/complete"
              payload: { liens_found: 0, defects_found: 0, chain_of_title_json: { links: [] } }
              as: TitleExaminer
            - call: "POST /easement-cases/${case_id}/documents/${doc_id}/record"
              payload: {}
              as: TitleExaminer
            - call: "POST /easement-cases/${case_id}/begin-mapping"
              payload: {}
              as: RightOfWayAgent
            - call: "POST /easement-cases/${case_id}/activate-monitoring"
              payload: {}
              as: RightOfWayAgent
            - call: "POST /easement-cases/${case_id}/vegetation-zones"
              payload: { zone_label: "Z1", max_allowed_height_ft: 20, prohibited_species: ["Kudzu"], wire_zone_width_ft: 25, border_zone_width_ft: 25 }
              as: VegetationInspector
              captures: { zone_id: $.data.id }
            - call: "POST /easement-cases/${case_id}/vegetation-zones/${zone_id}/violations"
              payload: { species: "Oak", observed_height_ft: 30, location_within_zone: "BORDER_ZONE" }
              as: VegetationInspector
              captures: { viol_id: $.data.id }
            - call: "POST /easement-cases/${case_id}/vegetation-zones/${zone_id}/violations/${viol_id}/notify"
              payload: {}
              as: VegetationInspector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: VegetationInspector
          trigger:
            # Force lazy escalation by reading; then accept/file/judge
            - call: "GET /easement-cases/${case_id}/vegetation-zones/${zone_id}/violations"
              payload: {}
              as: VegetationInspector
            - call: "GET /easement-cases/${case_id}/litigation-referrals"
              payload: {}
              as: LitigationCounsel
              captures: { ref_id: "$.data[0].id" }
            - call: "POST /easement-cases/${case_id}/litigation-referrals/${ref_id}/accept"
              payload: {}
              as: LitigationCounsel
            - call: "POST /easement-cases/${case_id}/litigation-referrals/${ref_id}/file"
              payload: {}
              as: LitigationCounsel
            - call: "POST /easement-cases/${case_id}/litigation-referrals/${ref_id}/record-judgment"
              payload: {}
              as: LitigationCounsel
          assert:
            - "LitigationReferral.${ref_id}.status == JUDGMENT_OBTAINED"
            - "VegetationViolation.${viol_id}.status == REMEDIATED"
            - "VegetationZone.${zone_id}.violation_count == 0"
            - "VegetationZone.${zone_id}.status == CLEARED"

  # =====================================================================
  # Rule 5: priority_pair_validation_conflict — different error-category pairs
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_fiscal_on_offer_tender
        grounds:
          - validations[priority=5]
          - validations[priority=14]
          - errors[ERR_OFFER_NOT_TENDERED]
          - errors[ERR_COMPENSATION_EXCEEDS_BUDGET]
        distinguishing_aspect: |
          Conflict pair: state (priority 5) vs business_fiscal (priority 14).
          When an offer is in the wrong state AND its compensation would exceed
          budget, the state error ERR_OFFER_NOT_TENDERED (or ERR_INVALID_STATE)
          must win over ERR_COMPENSATION_EXCEEDS_BUDGET.
        test_recipe:
          setup:
            - "EasementCase ACTIVE_MONITORING, title_cleared, RECORDED doc"
            - "AcquisitionOffer DRAFT with total_compensation_cents > acquisition_budget_cents (impossible via tender; so we craft: tender a small offer to consume budget, then attempt to tender a second DRAFT offer that would exceed remaining balance)"
            - "Actually: to force dual-failure we make a DRAFT offer (state violation for accept) AND budget exceeded. Use accept on DRAFT offer with requires_director_approval=false but budget already consumed."
          setup_api_calls:
            - call: "POST /easement-cases"
              payload: { case_code: "ESM-009", utility_district: "D1", county: "King", parcel_id: "P-009", easement_width_ft: 50, easement_area_sqft: 10000, fair_market_value_per_sqft: 10, acquisition_budget_cents: 1000000 }
              as: RightOfWayAgent
              captures: { case_id: $.data.id }
            - call: "POST /easement-cases/${case_id}/documents"
              payload: { doc_kind: "DEED", instrument_number: "INST-801", recording_date: "2026-07-01T00:00:00Z", grantor_name: "S", grantee_name: "CU", gis_polygon_wkt: "POLYGON((0 0,1 0,1 1,0 1,0 0))", width_ft: 50 }
              as: TitleExaminer
              captures: { doc_id: $.data.id }
            - call: "POST /easement-cases/${case_id}/title-searches"
              payload: { search_scope: "FULL_CHAIN" }
              as: TitleExaminer
              captures: { task_id: $.data.id }
            - call: "POST /easement-cases/${case_id}/title-searches/${task_id}/begin"
              payload: {}
              as: TitleExaminer
            - call: "POST /easement-cases/${case_id}/title-searches/${task_id}/complete"
              payload: { liens_found: 0, defects_found: 0, chain_of_title_json: { links: [] } }
              as: TitleExaminer
            - call: "POST /easement-cases/${case_id}/documents/${doc_id}/record"
              payload: {}
              as: TitleExaminer
            - call: "POST /easement-cases/${case_id}/begin-mapping"
              payload: {}
              as: RightOfWayAgent
            - call: "POST /easement-cases/${case_id}/activate-monitoring"
              payload: {}
              as: RightOfWayAgent
            - call: "POST /easement-cases/${case_id}/offers"
              payload: { landowner_name: "A", landowner_contact: "a@x.com", offered_area_sqft: 900, severance_damages_cents: 0 }
              as: RightOfWayAgent
              captures: { offer1_id: $.data.id }
            - call: "POST /easement-cases/${case_id}/offers"
              payload: { landowner_name: "B", landowner_contact: "b@x.com", offered_area_sqft: 900, severance_damages_cents: 0 }
              as: RightOfWayAgent
              captures: { offer2_id: $.data.id }
            - call: "GET /easement-cases/${case_id}"
              payload: {}
              as: RightOfWayAgent
              captures: { case_v1: $.data.version }
            - call: "POST /easement-cases/${case_id}/offers/${offer1_id}/tender"
              payload: { expected_case_version: "${case_v1}" }
              as: RightOfWayAgent
          trigger:
            # offer2 is DRAFT (state violation for accept) AND budget remaining is 100000
            # while offer2.total = 900*10*100 = 900000 (fiscal violation).
            - call: "POST /easement-cases/${case_id}/offers/${offer2_id}/accept"
              payload: {}
              as: RightOfWayAgent
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_OFFER_NOT_TENDERED"

      - name: business_safety_vs_business_referential_on_document_record
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_TITLE_NOT_CLEARED]
          - errors[ERR_DUPLICATE_INSTRUMENT_NUMBER]
        distinguishing_aspect: |
          Conflict pair: business_safety (priority 7, title clearance) vs
          business_constraint (priority 8, duplicate instrument_number). When
          recording a document whose title search is not clean AND whose
          instrument_number is already used in the county, the safety error
          ERR_TITLE_NOT_CLEARED must win.
        test_recipe:
          setup:
            - "EasementCase in MAPPING with one RECORDED document INST-901 and title_cleared=false (latest search completed WITH_DEFECTS)"
            - "A second DRAFT document with the same instrument_number INST-901"
          setup_api_calls:
            - call: "POST /easement-cases"
              payload: { case_code: "ESM-010", utility_district: "D1", county: "King", parcel_id: "P-010", easement_width_ft: 50, easement_area_sqft: 10000, fair_market_value_per_sqft: 10, acquisition_budget_cents: 50000000 }
              as: RightOfWayAgent
              captures: { case_id: $.data.id }
            - call: "POST /easement-cases/${case_id}/documents"
              payload: { doc_kind: "DEED", instrument_number: "INST-901", recording_date: "2026-07-01T00:00:00Z", grantor_name: "S", grantee_name: "CU", gis_polygon_wkt: "POLYGON((0 0,1 0,1 1,0 1,0 0))", width_ft: 50 }
              as: TitleExaminer
              captures: { doc1_id: $.data.id }
            - call: "POST /easement-cases/${case_id}/begin-mapping"
              payload: {}
              as: RightOfWayAgent
            - call: "POST /easement-cases/${case_id}/title-searches"
              payload: { search_scope: "FULL_CHAIN" }
              as: TitleExaminer
              captures: { task_id: $.data.id }
            - call: "POST /easement-cases/${case_id}/title-searches/${task_id}/begin"
              payload: {}
              as: TitleExaminer
            - call: "POST /easement-cases/${case_id}/title-searches/${task_id}/complete"
              payload: { liens_found: 1, defects_found: 0, chain_of_title_json: { links: [] } }
              as: TitleExaminer
            - call: "POST /easement-cases/${case_id}/documents/${doc1_id}/record"
              payload: {}
              as: TitleExaminer
            - call: "POST /easement-cases/${case_id}/documents"
              payload: { doc_kind: "PLAT", instrument_number: "INST-901", recording_date: "2026-07-15T00:00:00Z", grantor_name: "S", grantee_name: "CU", gis_polygon_wkt: "POLYGON((0 0,2 0,2 1,0 1,0 0))", width_ft: 50 }
              as: TitleExaminer
              captures: { doc2_id: $.data.id }
          trigger:
            - call: "POST /easement-cases/${case_id}/documents/${doc2_id}/record"
              payload: {}
              as: TitleExaminer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_INSTRUMENT_NUMBER"
            # Note: title_cleared is false but duplicate instrument (priority 8)
            # is checked before title (priority 7) only if ordering says so.
            # Per §1.4 priority 7 (business_safety) < priority 8 (business_constraint),
            # so ERR_TITLE_NOT_CLEARED (7) should win over ERR_DUPLICATE_INSTRUMENT_NUMBER (8).
            # We assert the actual behavior pinned by priority: lower number wins.

  # =====================================================================
  # Rule 6: boundary_precision_check — different metrics/endpoints
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: director_approval_threshold_exactly_at_boundary
        grounds:
          - entities.AcquisitionOffer.fields.requires_director_approval
          - calculations.total_compensation
        distinguishing_aspect: |
          Metric: total_compensation_cents. Boundary: DIRECTOR_APPROVAL_THRESHOLD_CENTS.
          Test that total exactly == threshold triggers requires_director_approval=true
          (>= semantics), while total == threshold-1 does not.
        test_recipe:
          setup:
            - "EasementCase ACTIVE_MONITORING, title_cleared, RECORDED doc, FMV such that offered_area_sqft produces total exactly == threshold (assume DIRECTOR_APPROVAL_THRESHOLD_CENTS=10000000)"
          setup_api_calls:
            - call: "POST /easement-cases"
              payload: { case_code: "ESM-011", utility_district: "D1", county: "King", parcel_id: "P-011", easement_width_ft: 50, easement_area_sqft: 10000, fair_market_value_per_sqft: 100, acquisition_budget_cents: 100000000 }
              as: RightOfWayAgent
              captures: { case_id: $.data.id }
            - call: "POST /easement-cases/${case_id}/documents"
              payload: { doc_kind: "DEED", instrument_number: "INST-1001", recording_date: "2026-07-01T00:00:00Z", grantor_name: "S", grantee_name: "CU", gis_polygon_wkt: "POLYGON((0 0,1 0,1 1,0 1,0 0))", width_ft: 50 }
              as: TitleExaminer
              captures: { doc_id: $.data.id }
            - call: "POST /easement-cases/${case_id}/title-searches"
              payload: { search_scope: "FULL_CHAIN" }
              as: TitleExaminer
              captures: { task_id: $.data.id }
            - call: "POST /easement-cases/${case_id}/title-searches/${task_id}/begin"
              payload: {}
              as: TitleExaminer
            - call: "POST /easement-cases/${case_id}/title-searches/${task_id}/complete"
              payload: { liens_found: 0, defects_found: 0, chain_of_title_json: { links: [] } }
              as: TitleExaminer
            - call: "POST /easement-cases/${case_id}/documents/${doc_id}/record"
              payload: {}
              as: TitleExaminer
            - call: "POST /easement-cases/${case_id}/begin-mapping"
              payload: {}
              as: RightOfWayAgent
            - call: "POST /easement-cases/${case_id}/activate-monitoring"
              payload: {}
              as: RightOfWayAgent
          trigger:
            # FMV=100/sqft -> 1000 sqft = 10000000 cents = threshold (if threshold=10000000)
            - call: "POST /easement-cases/${case_id}/offers"
              payload: { landowner_name: "X", landowner_contact: "x@x.com", offered_area_sqft: 1000, severance_damages_cents: 0 }
              as: RightOfWayAgent
              captures: { offer_at: $.data.id }
            - call: "POST /easement-cases/${case_id}/offers"
              payload: { landowner_name: "Y", landowner_contact: "y@x.com", offered_area_sqft: 999, severance_damages_cents: 9999 }
              as: RightOfWayAgent
              captures: { offer_below: $.data.id }
          assert:
            # At threshold: 1000*100*100 = 10000000 -> requires_director_approval == true
            - "AcquisitionOffer.${offer_at}.requires_director_approval == true"
            # Below: 999*100*100 + 9999 = 9999999 -> false
            - "AcquisitionOffer.${offer_below}.requires_director_approval == false"

      - name: open_encroachment_count_zero_boundary_on_case_close
        grounds:
          - entities.EasementCase.fields.open_encroachment_count
          - state_machines.EasementCase.ACTIVE_MONITORING_to_CLOSED_RESOLVED
