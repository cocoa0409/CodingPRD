- rule_id: cross_entity_state_dependency
  instances:
  - name: report_submit_requires_active_tester
    grounds:
    - validations[priority=5]
    - entities.Tester.fields.status
    - errors[ERR_TESTER_NOT_CERTIFIED]
    distinguishing_aspect: Creating a TestReport requires the referenced Tester.status == ACTIVE; with a SUSPENDED tester (device itself ACTIVE/testable) submission fails ERR_TESTER_NOT_CERTIFIED — dependency TestReport -> Tester.
    test_recipe:
      setup:
      - Connection + ACTIVE RP device.
      - Tester registered then SUSPENDED.
      setup_api_calls:
      - call: POST /service-connections
        payload:
          account_number: AC-0012
          address: 1 Main St
          owner_user_id: owner-1
          hazard_class: HIGH_HAZARD
        as: UtilityAdmin
        captures:
          conn_id: $.data.id
          conn_ver: $.data.version
      - call: POST /devices
        payload:
          service_connection_id: ${conn_id}
          serial_number: SN-0012
          device_type: RP
          hazard_rating: HIGH
          test_interval_months: 12
          install_date: '2026-01-01T00:00:00Z'
        as: UtilityAdmin
        captures:
          dev_id: $.data.id
      - call: POST /testers
        payload:
          name: Jane Tester
          certification_number: CN-0012
          cert_effective_date: '2025-01-01T00:00:00Z'
          cert_expiry_date: '2027-01-01T00:00:00Z'
        as: UtilityAdmin
        captures:
          tester_id: $.data.id
      - call: POST /testers/${tester_id}/suspend
        payload: {}
        as: UtilityAdmin
      trigger:
      - call: POST /test-reports
        payload:
          device_id: ${dev_id}
          tester_id: ${tester_id}
          test_date: '2026-02-20T00:00:00Z'
          relief_valve_differential_psid: 2.5
          check_valve_1_psid: 1.5
        as: Tester
        as_user_id: ${tester_id}
        captures:
          err: $.data.error_id
      assert:
      - response error_id == ERR_TESTER_NOT_CERTIFIED (device is ACTIVE; only the tester state blocks)
      - HTTP status == 422
  - name: device_remove_blocked_when_connection_shutoff
    grounds:
    - validations[priority=6]
    - state_machines.BackflowDevice.ACTIVE_to_REMOVED
    - entities.ServiceConnection.fields.compliance_posture
    - errors[ERR_CONNECTION_SHUTOFF]
    distinguishing_aspect: A BackflowDevice ACTIVE->REMOVED transition is blocked while its ServiceConnection.compliance_posture == SHUTOFF, returning ERR_CONNECTION_SHUTOFF — dependency BackflowDevice -> ServiceConnection, a different entity pair than TestReport -> Tester.
    test_recipe:
      setup:
      - Connection with one ACTIVE device.
      - A notice issued and enforced after its due date puts the connection in SHUTOFF.
      setup_api_calls:
      - call: POST /service-connections
        payload:
          account_number: AC-0013
          address: 1 Main St
          owner_user_id: owner-1
          hazard_class: HIGH_HAZARD
        as: UtilityAdmin
        captures:
          conn_id: $.data.id
          conn_ver: $.data.version
      - call: POST /devices
        payload:
          service_connection_id: ${conn_id}
          serial_number: SN-0013
          device_type: RP
          hazard_rating: HIGH
          test_interval_months: 12
          install_date: '2026-01-01T00:00:00Z'
        as: UtilityAdmin
        captures:
          dev_id: $.data.id
      - call: POST /shutoff-notices
        payload:
          service_connection_id: ${conn_id}
          reason: UNREPAIRED_DEVICE
        as: UtilityAdmin
        captures:
          notice_id: $.data.id
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-04-01T00:00:00Z'
        as: UtilityAdmin
      - call: POST /shutoff-notices/${notice_id}/enforce
        payload: {}
        as: UtilityAdmin
      trigger:
      - call: POST /devices/${dev_id}/remove
        payload: {}
        as: UtilityAdmin
        captures:
          err: $.data.error_id
      assert:
      - response error_id == ERR_CONNECTION_SHUTOFF
      - BackflowDevice.${dev_id}.status == ACTIVE (transition blocked)
- rule_id: resource_temporal_overlap
  instances:
  - name: tester_double_booked_half_open_overlap
    grounds:
    - validations[priority=10]
    - errors[ERR_TESTER_DOUBLE_BOOKED]
    distinguishing_aspect: A second appointment for the same tester whose [09:30,10:30) overlaps an existing [09:00,10:00) BOOKED appointment is rejected ERR_TESTER_DOUBLE_BOOKED; adjacency (start==other end) would be allowed — half-open interval semantics on the Tester resource.
    test_recipe:
      setup:
      - One tester; two devices on two DIFFERENT connections (so the premises buffer never applies).
      - Appointment 1 booked 2026-04-10 09:00-10:00 for the tester.
      setup_api_calls:
      - call: POST /service-connections
        payload:
          account_number: AC-0014A
          address: 1 Main St
          owner_user_id: owner-1
          hazard_class: HIGH_HAZARD
        as: UtilityAdmin
        captures:
          conn_id: $.data.id
      - call: POST /service-connections
        payload:
          account_number: AC-0014B
          address: 2 Oak St
          owner_user_id: owner-1
          hazard_class: LOW_HAZARD
        as: UtilityAdmin
        captures:
          conn2_id: $.data.id
      - call: POST /devices
        payload:
          service_connection_id: ${conn_id}
          serial_number: SN-0014A
          device_type: RP
          hazard_rating: HIGH
          test_interval_months: 12
          install_date: '2026-01-01T00:00:00Z'
        as: UtilityAdmin
        captures:
          dev1: $.data.id
      - call: POST /devices
        payload:
          service_connection_id: ${conn2_id}
          serial_number: SN-0014B
          device_type: DC
          hazard_rating: LOW
          test_interval_months: 12
          install_date: '2026-01-01T00:00:00Z'
        as: UtilityAdmin
        captures:
          dev2: $.data.id
      - call: POST /testers
        payload:
          name: Jane Tester
          certification_number: CN-0014
          cert_effective_date: '2025-01-01T00:00:00Z'
          cert_expiry_date: '2027-01-01T00:00:00Z'
        as: UtilityAdmin
        captures:
          tester_id: $.data.id
      - call: POST /test-appointments
        payload:
          device_id: ${dev1}
          tester_id: ${tester_id}
          scheduled_start: '2026-04-10T09:00:00Z'
          scheduled_end: '2026-04-10T10:00:00Z'
        as: Tester
        as_user_id: ${tester_id}
        captures:
          appt1_id: $.data.id
      trigger:
      - call: POST /test-appointments
        payload:
          device_id: ${dev2}
          tester_id: ${tester_id}
          scheduled_start: '2026-04-10T09:30:00Z'
          scheduled_end: '2026-04-10T10:30:00Z'
        as: Tester
        as_user_id: ${tester_id}
        captures:
          err: $.data.error_id
      assert:
      - response error_id == ERR_TESTER_DOUBLE_BOOKED (09:30 < 10:00 overlaps the tester interval)
      - HTTP status == 409
  - name: premises_buffer_conflict_within_60_min
    grounds:
    - validations[priority=11]
    - errors[ERR_PREMISES_BUFFER_CONFLICT]
    distinguishing_aspect: Two appointments on devices of the SAME connection separated by only 30 minutes (09:00-10:00 then 10:30-11:00) violate the 60-minute premises buffer -> ERR_PREMISES_BUFFER_CONFLICT; the intervals do not overlap, so this is buffer (not half-open overlap) semantics on the ServiceConnection resource.
    test_recipe:
      setup:
      - One connection with two devices; one tester.
      - Appointment 1 booked 2026-04-11 09:00-10:00 on device 1.
      setup_api_calls:
      - call: POST /service-connections
        payload:
