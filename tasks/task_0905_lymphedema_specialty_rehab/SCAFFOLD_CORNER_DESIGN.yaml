# =============================================================================
# Task 0905 — Lymphedema & Specialty Rehab Clinic
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index (breadth probe)
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: creation_patient_returns_system_fields
        claim_type: Creation
        grounds: [entities.Patient]
        distinguishing_aspect: "POST /patients with full_name+mrn returns 201 and a Patient with server-minted id, version == 1, status == ACTIVE."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { full_name: "New Patient", mrn: "MRN-1" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
          assert:
            - "Response 201; Patient.${pat_id}.status == ACTIVE and version == 1 and created_at is present"

      - name: required_field_missing_on_evaluation_returns_validation
        claim_type: Required Fields
        grounds: [entities.Evaluation.fields.isl_stage]
        distinguishing_aspect: "POST /evaluations omitting the required isl_stage field returns 422 ERR_VALIDATION."
        test_recipe:
          setup: ["A patient exists."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "P", mrn: "MRN-1" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
          trigger:
            - call: "POST /evaluations"
              payload: { patient_id: "${pat_id}", body_region: "LEFT_ARM", etiology: "PRIMARY", interval_cm: 4, circumferences_cm: [18,20], contralateral_circumferences_cm: [18,20], expected_patient_version: "${pat_v}" }
              as: Clinician
              captures: { err: $.data.error_id }
          assert:
            - "Response 422 with data.error_id == ERR_VALIDATION"

      - name: not_found_get_missing_patient
        claim_type: Not Found
        grounds: [entities.Patient]
        distinguishing_aspect: "GET /patients/{unknown-uuid} returns 404 ERR_PATIENT_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /patients/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ClinicAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response 404 with data.error_id == ERR_PATIENT_NOT_FOUND"

      - name: invalid_enum_isl_stage_on_evaluation
        claim_type: Type Constraints
        grounds: [entities.Evaluation.fields.isl_stage]
        distinguishing_aspect: "POST /evaluations with isl_stage 'STAGE_IV' (outside the declared enum) returns 422 ERR_INVALID_ENUM."
        test_recipe:
          setup: ["A patient exists."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "P", mrn: "MRN-1" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
          trigger:
            - call: "POST /evaluations"
              payload: { patient_id: "${pat_id}", body_region: "LEFT_ARM", etiology: "PRIMARY", isl_stage: "STAGE_IV", interval_cm: 4, circumferences_cm: [18,20], contralateral_circumferences_cm: [18,20], expected_patient_version: "${pat_v}" }
              as: Clinician
              captures: { err: $.data.error_id }
          assert:
            - "Response 422 with data.error_id == ERR_INVALID_ENUM"

      - name: adherence_log_is_immutable_no_version
        claim_type: Immutability
        grounds: [entities.AdherenceLog]
        distinguishing_aspect: "AdherenceLog has common_fields:false; a created log carries id and created_at but no version or updated_at, and there is no update endpoint."
        test_recipe:
          setup: ["A patient with a FINALIZED eval, an authorization and a plan (prescribed_daily_minutes 60)."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "P", mrn: "MRN-1" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /evaluations"
              payload: { patient_id: "${pat_id}", body_region: "LEFT_ARM", etiology: "SECONDARY", isl_stage: "STAGE_II", interval_cm: 4, circumferences_cm: [18,18,20,22,24], contralateral_circumferences_cm: [16,16,17,18,19], expected_patient_version: "${pat_v}" }
              as: Clinician
              captures: { eval_id: $.data.id }
            - call: "POST /evaluations/${eval_id}/finalize"
              payload: {}
              as: Clinician
            - call: "POST /authorizations"
              payload: { patient_id: "${pat_id}", body_region: "LEFT_ARM", payer_name: "Acme", auth_number: "AUTH-1", visit_cap: 5, effective_start_date: "2026-05-01", effective_end_date: "2026-12-31" }
              as: Authorizer
              captures: { auth_id: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pat_id}", evaluation_id: "${eval_id}", authorization_id: "${auth_id}", prescribed_daily_minutes: 60 }
              as: Clinician
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /adherence-logs"
              payload: { plan_id: "${plan_id}", log_date: "2026-06-01", minutes_completed: 60, wore_garment: true }
              as: Clinician
              captures: { log_id: $.data.id }
          assert:
            - "AdherenceLog.${log_id} response contains id and created_at but no version and no updated_at field"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: approve_already_approved_authorization_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Authorization.SUBMITTED_to_APPROVED]
        distinguishing_aspect: "Approving an authorization already in APPROVED returns 409 ERR_INVALID_STATE; no state change."
        test_recipe:
          setup: ["A patient with an APPROVED authorization."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "P", mrn: "MRN-1" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /authorizations"
              payload: { patient_id: "${pat_id}", body_region: "LEFT_ARM", payer_name: "Acme", auth_number: "AUTH-1", visit_cap: 5, effective_start_date: "2026-05-01", effective_end_date: "2026-12-31" }
              as: Authorizer
              captures: { auth_id: $.data.id }
            - call: "POST /authorizations/${auth_id}/submit"
              payload: {}
              as: Authorizer
            - call: "POST /authorizations/${auth_id}/approve"
              payload: {}
              as: Authorizer
          trigger:
            - call: "POST /authorizations/${auth_id}/approve"
              payload: {}
              as: Authorizer
              captures: { err: $.data.error_id }
          assert:
            - "Response 409 with data.error_id == ERR_INVALID_STATE; Authorization.${auth_id}.status remains APPROVED"

      - name: finalize_already_finalized_evaluation_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Evaluation.DRAFT_to_FINALIZED]
        distinguishing_aspect: "Finalizing an evaluation already in FINALIZED returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["A patient with a FINALIZED evaluation."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "P", mrn: "MRN-1" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /evaluations"
              payload: { patient_id: "${pat_id}", body_region: "LEFT_ARM", etiology: "SECONDARY", isl_stage: "STAGE_II", interval_cm: 4, circumferences_cm: [18,18,20,22,24], contralateral_circumferences_cm: [16,16,17,18,19], expected_patient_version: "${pat_v}" }
              as: Clinician
              captures: { eval_id: $.data.id }
            - call: "POST /evaluations/${eval_id}/finalize"
              payload: {}
              as: Clinician
          trigger:
            - call: "POST /evaluations/${eval_id}/finalize"
              payload: {}
              as: Clinician
              captures: { err: $.data.error_id }
          assert:
            - "Response 409 with data.error_id == ERR_INVALID_STATE"

      - name: return_already_returned_dispense_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.Dispense.DISPENSED_to_RETURNED]
        distinguishing_aspect: "Returning a Dispense already in RETURNED returns 409 ERR_INVALID_STATE and does not double-credit DMEItem stock."
        test_recipe:
          setup: ["A patient with a FINALIZED LEFT_ARM eval, an APPROVED garment order (L8100), a DME item L8100 stock 10, one DISPENSED-then-RETURNED dispense of qty 2."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "P", mrn: "MRN-1" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /evaluations"
              payload: { patient_id: "${pat_id}", body_region: "LEFT_ARM", etiology: "SECONDARY", isl_stage: "STAGE_II", interval_cm: 4, circumferences_cm: [18,18,20,22,24], contralateral_circumferences_cm: [16,16,17,18,19], expected_patient_version: "${pat_v}" }
              as: Clinician
              captures: { eval_id: $.data.id }
            - call: "POST /evaluations/${eval_id}/finalize"
              payload: {}
              as: Clinician
            - call: "GET /patients/${pat_id}"
              payload: {}
              as: Clinician
              captures: { pat_v2: $.data.version }
            - call: "POST /garment-orders"
              payload: { patient_id: "${pat_id}", evaluation_id: "${eval_id}", quantity: 1, expected_patient_version: "${pat_v2}" }
              as: Clinician
              captures: { go_id: $.data.id }
            - call: "POST /garment-orders/${go_id}/approve"
              payload: {}
              as: Authorizer
            - call: "POST /dme-items"
              payload: { sku: "SLV-L8100", l_code: "L8100", initial_stock_qty: 10 }
              as: DMECoordinator
              captures: { dme_id: $.data.id }
            - call: "POST /dispenses"
              payload: { garment_order_id: "${go_id}", dme_item_id: "${dme_id}", quantity: 2 }
              as: DMECoordinator
              captures: { disp_id: $.data.id }
            - call: "POST /dispenses/${disp_id}/return"
              payload: {}
              as: DMECoordinator
          trigger:
            - call: "POST /dispenses/${disp_id}/return"
              payload: {}
              as: DMECoordinator
              captures: { err: $.data.error_id }
          assert:
            - "Response 409 with data.error_id == ERR_INVALID_STATE; DMEItem.${dme_id}.on_hand_qty == 10 (not double-credited)"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: adherence_rate_zero_logs_is_zero
        claim_type: Correct Result
        grounds: [calculations.adherence_rate, entities.TreatmentPlan.fields.adherence_rate]
        distinguishing_aspect: "A plan with no AdherenceLog entries has adherence_rate == 0.0 (empty-set guard, no division error)."
        test_recipe:
          setup: ["A plan with zero adherence logs."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "P", mrn: "MRN-1" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /evaluations"
              payload: { patient_id: "${pat_id}", body_region: "LEFT_ARM", etiology: "SECONDARY", isl_stage: "STAGE_II", interval_cm: 4, circumferences_cm: [18,18,20,22,24], contralateral_circumferences_cm: [16,16,17,18,19], expected_patient_version: "${pat_v}" }
              as: Clinician
              captures: { eval_id: $.data.id }
            - call: "POST /evaluations/${eval_id}/finalize"
              payload: {}
              as: Clinician
            - call: "POST /authorizations"
              payload: { patient_id: "${pat_id}", body_region: "LEFT_ARM", payer_name: "Acme", auth_number: "AUTH-1", visit_cap: 5, effective_start_date: "2026-05-01", effective_end_date: "2026-12-31" }
              as: Authorizer
              captures: { auth_id: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pat_id}", evaluation_id: "${eval_id}", authorization_id: "${auth_id}", prescribed_daily_minutes: 60 }
              as: Clinician
              captures: { plan_id: $.data.id }
          trigger:
            - call: "GET /treatment-plans/${plan_id}"
              payload: {}
              as: Clinician
          assert:
            - "TreatmentPlan.${plan_id}.adherence_rate == 0.0"

      - name: adherence_rate_compliant_fraction
        claim_type: Constants Applied
        grounds: [calculations.adherence_rate]
        distinguishing_aspect: "With prescribed_daily_minutes 60 and 3 logs (60&wore, 30&wore, 90&not-wore) exactly 1 of 3 is compliant, so adherence_rate == 33.3."
        test_recipe:
          setup: ["A plan (prescribed_daily_minutes 60) with 3 adherence logs: (60,true),(30,true),(90,false)."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "P", mrn: "MRN-1" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /evaluations"
              payload: { patient_id: "${pat_id}", body_region: "LEFT_ARM", etiology: "SECONDARY", isl_stage: "STAGE_II", interval_cm: 4, circumferences_cm: [18,18,20,22,24], contralateral_circumferences_cm: [16,16,17,18,19], expected_patient_version: "${pat_v}" }
              as: Clinician
              captures: { eval_id: $.data.id }
            - call: "POST /evaluations/${eval_id}/finalize"
              payload: {}
              as: Clinician
            - call: "POST /authorizations"
              payload: { patient_id: "${pat_id}", body_region: "LEFT_ARM", payer_name: "Acme", auth_number: "AUTH-1", visit_cap: 5, effective_start_date: "2026-05-01", effective_end_date: "2026-12-31" }
              as: Authorizer
              captures: { auth_id: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pat_id}", evaluation_id: "${eval_id}", authorization_id: "${auth_id}", prescribed_daily_minutes: 60 }
              as: Clinician
              captures: { plan_id: $.data.id }
            - call: "POST /adherence-logs"
              payload: { plan_id: "${plan_id}", log_date: "2026-06-01", minutes_completed: 60, wore_garment: true }
              as: Clinician
            - call: "POST /adherence-logs"
              payload: { plan_id: "${plan_id}", log_date: "2026-06-02", minutes_completed: 30, wore_garment: true }
              as: Clinician
            - call: "POST /adherence-logs"
              payload: { plan_id: "${plan_id}", log_date: "2026-06-03", minutes_completed: 90, wore_garment: false }
              as: Clinician
          trigger:
            - call: "GET /treatment-plans/${plan_id}"
              payload: {}
              as: Clinician
          assert:
            - "TreatmentPlan.${plan_id}.adherence_rate == 33.3"

      - name: garment_classification_leg_class4_custom
        claim_type: Correct Result
        grounds: [calculations.garment_classification, entities.GarmentOrder.fields.compression_class]
        distinguishing_aspect: "STAGE_III LEFT_LEG evaluation with excess_volume_ml 1746.8: base 3, +bump (>=500), capped -> CLASS_4, custom (>=1200 and class 4) -> l_code L8112, garment_type STOCKING."
        test_recipe:
          setup: ["A patient with a FINALIZED STAGE_III LEFT_LEG evaluation whose excess_volume_ml == 1746.8."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "P", mrn: "MRN-1" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /evaluations"
              payload: { patient_id: "${pat_id}", body_region: "LEFT_LEG", etiology: "SECONDARY", isl_stage: "STAGE_III", interval_cm: 4, circumferences_cm: [40,45,50,55,60], contralateral_circumferences_cm: [30,32,34,36,38], expected_patient_version: "${pat_v}" }
              as: Clinician
              captures: { eval_id: $.data.id }
            - call: "POST /evaluations/${eval_id}/finalize"
              payload: {}
              as: Clinician
            - call: "GET /patients/${pat_id}"
              payload: {}
              as: Clinician
              captures: { pat_v2: $.data.version }
          trigger:
            - call: "POST /garment-orders"
              payload: { patient_id: "${pat_id}", evaluation_id: "${eval_id}", quantity: 1, expected_patient_version: "${pat_v2}" }
              as: Clinician
              captures: { go_id: $.data.id }
          assert:
            - "GarmentOrder.${go_id}.compression_class == CLASS_4 and l_code == L8112 and garment_type == STOCKING and custom_fabrication == true"

      - name: limb_volume_rounding_covered_by_difficulty
        claim_type: Precision
        grounds: [calculations.limb_volume_ml]
        excluded_because:
          difficulty_instance: "combinatorial_formula / combinatorial_limb_volume_rounding_order"
          rationale: "The per-segment rounding order and the exact limb_volume_ml literal are pinned by the named §1.8 instance."

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: error_measurement_length_mismatch
        claim_type: Violation to Error
        grounds: ["validations[priority=9]"]
        distinguishing_aspect: "POST /evaluations with affected len 3 and contralateral len 2 returns 422 ERR_MEASUREMENT_LENGTH_MISMATCH."
        test_recipe:
          setup: ["A patient exists."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "P", mrn: "MRN-1" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
          trigger:
            - call: "POST /evaluations"
              payload: { patient_id: "${pat_id}", body_region: "LEFT_ARM", etiology: "PRIMARY", isl_stage: "STAGE_I", interval_cm: 4, circumferences_cm: [18,20,22], contralateral_circumferences_cm: [18,20], expected_patient_version: "${pat_v}" }
              as: Clinician
              captures: { err: $.data.error_id }
          assert:
            - "Response 422 with data.error_id == ERR_MEASUREMENT_LENGTH_MISMATCH"

      - name: error_dme_lcode_mismatch_on_dispense
        claim_type: Cross-entity validation
        grounds: ["validations[priority=7]", "entities.Dispense.fields.dme_item_id"]
        distinguishing_aspect: "Dispensing a DME item whose l_code (L8110) differs from the APPROVED garment order l_code (L8100) returns 409 ERR_DME_LCODE_MISMATCH."
        test_recipe:
          setup: ["A patient with FINALIZED LEFT_ARM eval, an APPROVED garment order (L8100), and a DME item with l_code L8110 stock 10."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "P", mrn: "MRN-1" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /evaluations"
              payload: { patient_id: "${pat_id}", body_region: "LEFT_ARM", etiology: "SECONDARY", isl_stage: "STAGE_II", interval_cm: 4, circumferences_cm: [18,18,20,22,24], contralateral_circumferences_cm: [16,16,17,18,19], expected_patient_version: "${pat_v}" }
              as: Clinician
              captures: { eval_id: $.data.id }
            - call: "POST /evaluations/${eval_id}/finalize"
              payload: {}
              as: Clinician
            - call: "GET /patients/${pat_id}"
              payload: {}
              as: Clinician
              captures: { pat_v2: $.data.version }
            - call: "POST /garment-orders"
              payload: { patient_id: "${pat_id}", evaluation_id: "${eval_id}", quantity: 1, expected_patient_version: "${pat_v2}" }
              as: Clinician
              captures: { go_id: $.data.id }
            - call: "POST /garment-orders/${go_id}/approve"
              payload: {}
              as: Authorizer
            - call: "POST /dme-items"
              payload: { sku: "GAU-L8110", l_code: "L8110", initial_stock_qty: 10 }
              as: DMECoordinator
              captures: { dme_id: $.data.id }
          trigger:
            - call: "POST /dispenses"
              payload: { garment_order_id: "${go_id}", dme_item_id: "${dme_id}", quantity: 1 }
              as: DMECoordinator
              captures: { err: $.data.error_id }
          assert:
            - "Response 409 with data.error_id == ERR_DME_LCODE_MISMATCH"

      - name: error_dme_insufficient_stock_on_dispense
        claim_type: Aggregate validation
        grounds: ["validations[priority=9]", "calculations.dme_stock"]
        distinguishing_aspect: "Dispensing quantity 5 from an item with on_hand_qty 1 returns 409 ERR_DME_INSUFFICIENT_STOCK."
        test_recipe:
          setup: ["A patient with FINALIZED LEFT_ARM eval, an APPROVED garment order (L8100), a DME item L8100 initial_stock_qty 1."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "P", mrn: "MRN-1" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /evaluations"
              payload: { patient_id: "${pat_id}", body_region: "LEFT_ARM", etiology: "SECONDARY", isl_stage: "STAGE_II", interval_cm: 4, circumferences_cm: [18,18,20,22,24], contralateral_circumferences_cm: [16,16,17,18,19], expected_patient_version: "${pat_v}" }
              as: Clinician
              captures: { eval_id: $.data.id }
            - call: "POST /evaluations/${eval_id}/finalize"
              payload: {}
              as: Clinician
            - call: "GET /patients/${pat_id}"
              payload: {}
              as: Clinician
              captures: { pat_v2: $.data.version }
            - call: "POST /garment-orders"
              payload: { patient_id: "${pat_id}", evaluation_id: "${eval_id}", quantity: 1, expected_patient_version: "${pat_v2}" }
              as: Clinician
              captures: { go_id: $.data.id }
            - call: "POST /garment-orders/${go_id}/approve"
              payload: {}
              as: Authorizer
            - call: "POST /dme-items"
              payload: { sku: "SLV-L8100", l_code: "L8100", initial_stock_qty: 1 }
              as: DMECoordinator
              captures: { dme_id: $.data.id }
          trigger:
            - call: "POST /dispenses"
              payload: { garment_order_id: "${go_id}", dme_item_id: "${dme_id}", quantity: 5 }
              as: DMECoordinator
              captures: { err: $.data.error_id }
          assert:
            - "Response 409 with data.error_id == ERR_DME_INSUFFICIENT_STOCK; DMEItem.${dme_id}.on_hand_qty remains 1"

      - name: error_session_outside_auth_window_isolated
        claim_type: Temporal validation
        grounds: ["validations[priority=8]"]
        distinguishing_aspect: "A session scheduled 2026-06-01 against an APPROVED auth whose window is 2026-05-01..2026-05-10 (session.authorization_id matches the plan, so referential passes) returns 409 ERR_SESSION_OUTSIDE_AUTH_WINDOW."
        test_recipe:
          setup: ["Patient with FINALIZED eval, APPROVED auth window 2026-05-01..2026-05-10, ACTIVE plan on that auth, therapist."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "P", mrn: "MRN-1" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /evaluations"
              payload: { patient_id: "${pat_id}", body_region: "LEFT_ARM", etiology: "SECONDARY", isl_stage: "STAGE_II", interval_cm: 4, circumferences_cm: [18,18,20,22,24], contralateral_circumferences_cm: [16,16,17,18,19], expected_patient_version: "${pat_v}" }
              as: Clinician
              captures: { eval_id: $.data.id }
            - call: "POST /evaluations/${eval_id}/finalize"
              payload: {}
              as: Clinician
            - call: "POST /authorizations"
              payload: { patient_id: "${pat_id}", body_region: "LEFT_ARM", payer_name: "Acme", auth_number: "AUTH-1", visit_cap: 5, effective_start_date: "2026-05-01", effective_end_date: "2026-05-10" }
              as: Authorizer
              captures: { auth_id: $.data.id }
            - call: "POST /authorizations/${auth_id}/submit"
              payload: {}
              as: Authorizer
            - call: "POST /authorizations/${auth_id}/approve"
              payload: {}
              as: Authorizer
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pat_id}", evaluation_id: "${eval_id}", authorization_id: "${auth_id}", prescribed_daily_minutes: 60 }
              as: Clinician
              captures: { plan_id: $.data.id }
