              as: FinanceAdmin
              captures: { pol: "$.data.id" }
            - call: "POST /cards"
              payload: { company_id: "${co}", employee_id: "${emp_h}", spend_policy_id: "${pol}", form_factor: "VIRTUAL", card_limit_cents: 500000 }
              as: FinanceAdmin
              captures: { card: "$.data.id", v1: "$.data.version" }
          trigger:
            - call: "POST /cards/${card}/freeze"
              payload: {}
              as: FinanceAdmin
              captures: { v2: "$.data.version", st: "$.data.status" }
          assert:
