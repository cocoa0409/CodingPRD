              as_user_id: "bcm-1"
            - *OBS9000
          trigger:
            - call: "POST /price-observations/${obs2}/evaluate"
              payload: {}
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { pp: $.data.provisional_points, vid: $.data.violation_id }
          assert:
            - "HTTP 200"
            - "${pp} == 9"
            - "Violation.${vio}.status == VOIDED"
            - "Violation.${vio}.assessed_points == null"
            - "Violation.${vid}.provisional_points == 9"
            - "Reseller.${res}.violation_points_total == 0"

      - name: violation_points_zero_when_the_listing_is_at_the_floor
        claim_type: correct_result
        grounds: ["calculations.violation_points"]
        distinguishing_aspect: "deviation_cents uses max(0, floor - eff), so a listing ABOVE the floor short-circuits to 0 points with deviation_pct 0 and no violation row at all."
        test_recipe:
          setup: ["Policy MAP-2026-A PUBLISHED; product floor 15000; matched reseller Acme; listing at 15500."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
