        distinguishing_aspect: |
          Mode (c), a circular-looking dependency whose evaluation order the scaffold pins: the
          eligibility ratio is read from the pre-rollover ledger (10_000_000 / 20_000_000 ==
          0.5000) BEFORE the call writes any row, and step 3 marks the encumbered FY2027 EQUIPMENT
          tranche OBLIGATED while steps 4-6 still sweep its available balance, so the FY2028
          destination ends at available_balance_cents == 7_000_000; the rejected order (mark
