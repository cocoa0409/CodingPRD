  - rule_id: transitive_cascade
    instances:
      - name: unwound_delivery_cascades_four_links_to_the_accrual_ledger
        grounds:
          - state_machines.RetailDelivery.VALIDATED_to_UNWOUND
          - state_machines.Claim.SCHEDULED_to_CHARGED_BACK
          - calculations.chargeback_recovery_amount
          - calculations.program_accrual_ledger
          - calculations.program_committed_ledger
          - entities.BudgetAccrual.fields.reversal_cents
        distinguishing_aspect: |
          Depth 4 from the RetailDelivery.VALIDATED_to_UNWOUND trigger, with each link caused by
          the previous one and not by the unwind call: the unwind moves the claim to CHARGED_BACK
          (link 1), the claim transition mints the UNWOUND_DEAL Chargeback for 150000 (link 2),
          the Chargeback appends the BudgetAccrual REVERSAL row for 150000 (link 3), and the
          reversal drives accrued_budget_cents to -4125 and the committed ledger to 0 (link 4).
