            - "data.error_id == \"ERR_SCOPE_DEFINITION_NOT_FOUND\" - not ERR_VALIDATION and not ERR_DELIVERABLE_WEIGHT_TOTAL_INVALID"
            - "GET /scope-definitions returns HTTP 200 with total_count == 0"
      - name: error_volunteer_not_found_beats_not_resource_owner
        claim_type: error_triggerable
