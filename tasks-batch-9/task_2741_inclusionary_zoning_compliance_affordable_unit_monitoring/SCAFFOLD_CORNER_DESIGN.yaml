            - "RegulatoryAgreement.${ao_id}.state == RECORDED, doc_number == DOC-PC-0002, version == ${a_v}; Project.${po_id}.state == AGREEMENT_RECORDED"
            - "the doc_number DOC-PC-0002 reserved by the rejected attempt is reusable — a refused recording must not consume the unique key"

      - name: re_screening_a_screened_project_is_refused_not_reapplied
        claim_type: idempotency
        grounds:
          - validations.priority_9
          - state_machines.Project.DRAFT_to_SCREENED_SUBJECT
          - entities.Project.fields.screen_count
        distinguishing_aspect: |
          Screening is only declared out of DRAFT, so a second screen on an already-screened
          project is refused at priority 9 rather than recomputed. screen_count is the
          observable proof: it stays at 1 across the refused call, and the project's version
          does not move either. The only legal way to re-screen is to PATCH the project back
          to DRAFT, which then makes screen_count reach 2 and re-derives the obligation from
          the amended unit count.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ordinance IZ-2024-01 and AmiSchedule 2026 published."
            - "Project (R-4, 27 units, approval 2026-01-15) already screened once: SUBJECT, 4 units, fractional_obligation_bps 500, total_obligation_bps 40500."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/ordinances", payload: { code: "IZ-2024-01", effective_date: "2024-01-01", min_project_units_threshold: 10, set_aside_bps_by_district: { "R-2": 1000, "R-4": 1500, "C-2": 2000 }, gap_basis_cents_by_level: { "5000": 24000000, "8000": 18000000, "12000": 12000000 }, fee_gap_level_bps: 5000, surcharge_bps: 350, surcharge_cap_cents: 5000000, discount_tiers: [ { min_pre_discount_cents: 0, discount_bps: 0 }, { min_pre_discount_cents: 20000000, discount_bps: 150 }, { min_pre_discount_cents: 100000000, discount_bps: 400 } ], fee_due_days: 45, alternative_paths_allowed: ["IN_LIEU_FEE", "OFFSITE"] }, as: ProgramAdministrator, captures: { ord_id: $.data.id } }
            - { call: "POST /iz-compliance/ami-schedules", payload: { effective_year: 2026, median_income_cents_by_size: { "1": 9868000, "2": 11278000, "3": 12669800, "4": 14082000, "5": 15214000 }, utility_allowance_cents_by_bedrooms: { "0": 8500, "1": 11000, "2": 14500, "3": 18000 } }, as: ProgramAdministrator, captures: { ami26_id: $.data.id } }
            - { call: "POST /iz-compliance/projects", payload: { name: "Idempotent Screen", zoning_district: "R-4", total_units: 27, approval_date: "2026-01-15" }, as: Developer, as_user_id: "dev-1", captures: { p_id: $.data.id } }
            - { call: "POST /iz-compliance/projects/${p_id}/screen", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { p_v1: $.data.version } }
          trigger:
            - { call: "POST /iz-compliance/projects/${p_id}/screen", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { err: $.data.error_id } }
            - { call: "PATCH /iz-compliance/projects/${p_id}", payload: { total_units: 30 }, as: Developer, as_user_id: "dev-1" }
            - { call: "POST /iz-compliance/projects/${p_id}/screen", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { p_v3: $.data.version } }
          assert:
            - "the repeated screen returns HTTP 409 with error_id ERR_INVALID_PROJECT_STATE"
            - "immediately after the refusal Project.${p_id}.screen_count == 1 and version == ${p_v1} — nothing was re-applied"
            - "the PATCH resets Project.${p_id} to DRAFT with applicability PENDING, ordinance_id null, total_obligation_bps 0 and compliance_posture PENDING, while screen_count stays 1"
            - "the second screen succeeds with HTTP 200: screen_count == 2, applicability SUBJECT, required_affordable_units == 5, fractional_obligation_bps == 0 and total_obligation_bps == 50000 for 30 R-4 units"
            - "Project.${p_id}.version == ${p_v3} and ${p_v3} == 4 — create, first screen, PATCH, second screen"

      - name: a_closed_out_project_and_its_released_agreement_accept_no_writes
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Project.MONITORING_to_CLOSED_OUT
          - state_machines.RegulatoryAgreement.RECORDED_to_RELEASED
          - validations.priority_9
        distinguishing_aspect: |
          CLOSED_OUT is the Project machine's only terminal state and RELEASED is the
          agreement's, and close-out drives both in one call. Afterwards every write route
          that names the project is refused at priority 9 with ERR_INVALID_PROJECT_STATE —
          including a second close-out, so the terminal state is not idempotently re-enterable
          — while read routes keep working.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ordinance IZ-2024-01 and AmiSchedule 2026 published."
