      - call: POST /treatment-network/facilities/${mew_fac}/service-offerings
        payload:
          service_code: IOP_GROUP
          level_of_care: ASAM_3_1
          required_min_credential_tier: TIER_3_LICENSED
          requires_medical_provider: false
        as: PlatformAdmin
        captures:
          mew_svc_i: $.data.id
      - call: POST /treatment-network/clinicians/${mew_clin_A}/facility-credentials
        payload:
          facility_id: ${mew_fac}
          effective_at: '2026-01-01T00:00:00Z'
          expires_at: '2027-01-01T00:00:00Z'
        as: PlatformAdmin
        captures:
          mew_cred: $.data.id
      - call: POST /treatment-network/facilities/${mew_fac}/accreditations
        payload:
          accreditation_class: ACCREDITATION_BODY
          granting_body: CARF
          effective_at: '2026-01-01T00:00:00Z'
          expires_at: '2027-01-01T00:00:00Z'
        as: PlatformAdmin
        captures:
          mew_acc_body: $.data.id
      - call: POST /treatment-network/facilities/${mew_fac}/accreditations
        payload:
          accreditation_class: STATE_LICENSE
          granting_body: MN-DHS
          effective_at: '2026-01-01T00:00:00Z'
          expires_at: '2027-01-01T00:00:00Z'
          license_level_max: ASAM_3_5
          credential_tier_min: TIER_3_LICENSED
        as: PlatformAdmin
        captures:
          mew_acc_lic: $.data.id
      - call: POST /treatment-network/payers
        payload:
          name: Northlight Health Plan
          initial_authorized_days_by_loc:
            ASAM_3_5: 14
            ASAM_3_1: 10
            ASAM_2_1: 8
          step_down_coverage_map:
            ASAM_3_5:
            - ASAM_3_1
            - ASAM_2_1
            - ASAM_1_0
            ASAM_3_1:
            - ASAM_2_1
            - ASAM_1_0
            ASAM_2_1:
            - ASAM_1_0
            ASAM_1_0: []
          concurrent_review_interval_days: 7
          credential_min_tier_by_loc:
            ASAM_3_5: TIER_3_LICENSED
            ASAM_3_1: TIER_3_LICENSED
            ASAM_2_1: TIER_2_COUNSELOR
            ASAM_1_0: TIER_1_SUPPORT
        as: PlatformAdmin
        captures:
          mew_payer_P: $.data.id
      - call: POST /treatment-network/facilities/${mew_fac}/treatment-episodes
        payload:
          patient_ref: PT-8001
        as: AdmissionsIntakeNurse
        captures:
          mew_ep: $.data.id
      - call: POST /treatment-network/facilities/${mew_fac}/treatment-episodes
        payload:
          patient_ref: PT-8002
        as: AdmissionsIntakeNurse
        captures:
          mew_ep: $.data.id
      - call: POST /treatment-network/facilities/${mew_fac}/treatment-episodes
        payload:
          patient_ref: PT-8003
        as: AdmissionsIntakeNurse
        captures:
          mew_ep: $.data.id
      trigger:
      - call: GET /treatment-network/facilities/${mew_fac}/treatment-episodes
        payload:
          clinical_status: AWAITING_ASSESSMENT
          limit: 2
          offset: 0
        as: Any
        as_user_id: ur-dana
        captures:
          mew_eps: $.data[0].id
      assert:
      - the response status is 200 and response_type is array
      - the response returns exactly 2 rows with total_count == 3 and has_more == true (total_count and
        has_more travel in meta, not in data)
      - the same list with limit 2 offset 2 returns exactly 1 row with total_count == 3 and has_more ==
        false
      - the same list with no query parameters returns 3 rows with limit defaulting to 10 and offset to
        0
      - filtering on clinical_status IN_TREATMENT returns 0 rows
  - name: facility_get_with_unknown_id_returns_facility_not_found
    claim_type: Not Found
    grounds:
    - endpoints.GET_/treatment-network/facilities/{id}
    - errors[ERR_FACILITY_NOT_FOUND]
    - validations[priority=6]
    distinguishing_aspect: A syntactically valid but unallocated id on the facility path segment returns
      the entity-specific 404 ERR_FACILITY_NOT_FOUND rather than a generic 400.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z. No facility created.
      setup_api_calls:
      - call: POST /treatment-network/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: GET /treatment-network/facilities/00000000-0000-4000-8000-000000000000
        payload: {}
        as: Any
        as_user_id: ur-dana
        captures:
          mew_err: $.data.error_id
      assert:
      - the response status is 404 and error_id == ERR_FACILITY_NOT_FOUND
      - response_type is error and data carries both error_id and message
  - name: assessment_create_missing_dimension_scores_returns_invalid_request
