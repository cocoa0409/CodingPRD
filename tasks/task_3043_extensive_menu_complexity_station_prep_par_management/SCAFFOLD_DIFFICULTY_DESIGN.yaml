            - call: "POST /api/shift-assignments"
              payload: { cook_id: "${cook_id}", station_id: "${st_id}", shift_start: "2026-09-02T11:00:00Z", shift_end: "2026-09-02T13:00:00Z" }
              as: KitchenManager
              as_user_id: "${mgr_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "First assignment 08:00-12:00 created (201)"
            - "Second assignment 12:00-16:00 created (201) — touching intervals do NOT intersect"
            - "Third assignment 11:00-13:00 rejected 409 with ERR_SHIFT_OVERLAP"
            - "GET /api/shift-assignments?cook_id=${cook_id} returns exactly 2 rows"

