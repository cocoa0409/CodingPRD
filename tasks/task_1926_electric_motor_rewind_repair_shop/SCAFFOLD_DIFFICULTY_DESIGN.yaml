            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/diagnose"
              payload: { failure_diagnosis: "winding short", rewind_hours: 5, materials_cents: 10000, replacement_cost_cents: 999999 }
              as: Technician
            - call: "GET /shops/${shop_id}/work-orders/${wo_id}"
              as: Estimator
              captures: { wo_v: $.data.version }
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/quotes"
              payload: { expected_work_order_version: "${wo_v}" }
              as: Estimator
              captures: { q1: $.data.id }
            - call: "GET /shops/${shop_id}/work-orders/${wo_id}"
              as: Estimator
              captures: { wo_v2: $.data.version }
          trigger:
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/quotes"
              payload: { expected_work_order_version: "${wo_v2}" }
              as: Estimator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_ACTIVE   # Q1 still ISSUED; one live quote per work order"
            - "After POST .../quotes/${q1}/revise supersedes Q1, a fresh issue succeeds"

  # ==========================================================================
  # Rule 9 — compensating_invariant: two forward/compensate pairs conserving
  # DIFFERENT named quantities.
  # ==========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: quote_revise_and_reissue_conserves_single_active_quote
        grounds:
          - state_machines.Quote.ISSUED_to_SUPERSEDED
          - state_machines.WorkOrder.AWAITING_APPROVAL_to_QUOTED
          - validations[priority=9]
        distinguishing_aspect: |
          Conserved quantity: count(Quote where work_order_id == W and status
          == ISSUED) + (WorkOrder.active_quote_id is null ? 0 : 1) is invariant
          at exactly 1 across the revise -> reissue cycle; revise (forward) and
          reissue (compensating) never leave 0 or 2 live quotes.
        test_recipe:
          setup:
            - "WorkOrder AWAITING_APPROVAL with Q1 ISSUED"
          setup_api_calls:
            - call: "POST /shops"
              payload: { shop_name: "S", easa_accreditation_id: "EASA-12345", labor_rate_small_cents: 8500, labor_rate_medium_cents: 9500, labor_rate_large_cents: 11200, labor_rate_xlarge_cents: 13800, rush_premium_pct: 0.35, replace_threshold_pct: 0.65, supplies_low_pct: 0.08, supplies_high_pct: 0.06, warranty_months: 12, pool_slot_monthly_cents: 4500, pool_loan_daily_cents: 1800, pool_loan_grace_days: 3 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /shops/${shop_id}/customers"
              payload: { company_name: "C" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
            - call: "POST /shops/${shop_id}/motors"
              payload: { owner_customer_id: "${cust_id}", serial_number: "M-16", rated_kw: 30, frame_mm: 200, voltage_v: 460, manufacture_year: 2020 }
              as: ServiceManager
              captures: { motor_id: $.data.id }
            - call: "POST /shops/${shop_id}/work-orders"
              payload: { customer_id: "${cust_id}", motor_id: "${motor_id}", priority: "STANDARD" }
              as: Technician
              captures: { wo_id: $.data.id }
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/tests"
              payload: { kind: "INCOMING", insulation_megohms: 500 }
              as: Technician
              as_user_id: "op-t"
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/diagnose"
              payload: { failure_diagnosis: "winding short", rewind_hours: 5, materials_cents: 10000, replacement_cost_cents: 999999 }
              as: Technician
            - call: "GET /shops/${shop_id}/work-orders/${wo_id}"
              as: Estimator
              captures: { wo_v: $.data.version }
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/quotes"
              payload: { expected_work_order_version: "${wo_v}" }
              as: Estimator
              captures: { q1: $.data.id }
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/quotes/${q1}/send"
              as: Estimator
          trigger:
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/quotes/${q1}/revise"
              as: Estimator
            - call: "GET /shops/${shop_id}/work-orders/${wo_id}"
              as: Estimator
              captures: { wo_v2: $.data.version }
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/quotes"
              payload: { expected_work_order_version: "${wo_v2}" }
              as: Estimator
              captures: { q2: $.data.id }
          assert:
            - "After revise: count(ISSUED quotes for W) == 0 and active_quote_id is null"
            - "After reissue: count(ISSUED quotes for W) == 1 and active_quote_id == ${q2}"
            - "Quote.${q1}.status == SUPERSEDED and Quote.${q2}.status == ISSUED — the invariant never observed 2 live quotes"

      - name: payment_waterfall_conserves_total_cents
        grounds:
          - calculations.payment_waterfall
          - entities.Invoice.fields.balance_due_cents
          - entities.Customer.fields.account_credit_cents
        distinguishing_aspect: |
          Conserved quantity: sum(applied_cents across invoices) +
          credit_added_cents == payment_cents for every payment; the forward
          action (payment) and its compensating remainder posting conserve the
          total cents across Invoice.balance_due_cents reductions and the
          customer credit bucket. Different conserved quantity (money vs quote
          cardinality) from the sibling instance.
        test_recipe:
          setup:
            - "Shop canonical rates; Customer C; motors M-WF1/M-WF2"
            - "W1 (1h STANDARD frame 200) released at 2026-08-01 -> I1 total 34680c; W2 (2h STANDARD frame 200) released at 2026-08-02 -> I2 total 43860c"
            - "Clock at 2026-08-10 (both invoices OPEN, none overdue)"
          setup_api_calls:
            - call: "POST /shops"
              payload: { shop_name: "S", easa_accreditation_id: "EASA-12345", labor_rate_small_cents: 8500, labor_rate_medium_cents: 9500, labor_rate_large_cents: 11200, labor_rate_xlarge_cents: 13800, rush_premium_pct: 0.35, replace_threshold_pct: 0.65, supplies_low_pct: 0.08, supplies_high_pct: 0.06, warranty_months: 12, pool_slot_monthly_cents: 4500, pool_loan_daily_cents: 1800, pool_loan_grace_days: 3 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /shops/${shop_id}/customers"
              payload: { company_name: "C" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
            - call: "POST /shops/${shop_id}/motors"
              payload: { owner_customer_id: "${cust_id}", serial_number: "M-WF1", rated_kw: 10, frame_mm: 200, voltage_v: 460, manufacture_year: 2020 }
              as: ServiceManager
              captures: { mw1: $.data.id }
            - call: "POST /shops/${shop_id}/motors"
              payload: { owner_customer_id: "${cust_id}", serial_number: "M-WF2", rated_kw: 10, frame_mm: 200, voltage_v: 460, manufacture_year: 2020 }
              as: ServiceManager
              captures: { mw2: $.data.id }
            - call: "POST /shops/${shop_id}/work-orders"
              payload: { customer_id: "${cust_id}", motor_id: "${mw1}", priority: "STANDARD" }
              as: Technician
              captures: { wf1: $.data.id }
            - call: "POST /shops/${shop_id}/work-orders/${wf1}/tests"
              payload: { kind: "INCOMING", insulation_megohms: 500 }
              as: Technician
              as_user_id: "op-t"
            - call: "POST /shops/${shop_id}/work-orders/${wf1}/diagnose"
              payload: { failure_diagnosis: "x", rewind_hours: 1, materials_cents: 0, replacement_cost_cents: 999999 }
              as: Technician
              as_user_id: "op-t"
            - call: "GET /shops/${shop_id}/work-orders/${wf1}"
              as: Estimator
              captures: { wf1v: $.data.version }
            - call: "POST /shops/${shop_id}/work-orders/${wf1}/quotes"
              payload: { expected_work_order_version: "${wf1v}" }
              as: Estimator
              captures: { wfq1: $.data.id }
            - call: "POST /shops/${shop_id}/work-orders/${wf1}/quotes/${wfq1}/send"
              as: Estimator
            - call: "POST /shops/${shop_id}/work-orders/${wf1}/quotes/${wfq1}/accept"
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /shops/${shop_id}/work-orders/${wf1}/start-rewind"
              as: WindingTechnician
              as_user_id: "op-w"
            - call: "POST /shops/${shop_id}/work-orders/${wf1}/coil-data"
              payload: { wire_gauge_awg: "14", turns_per_coil: 22, coils_per_phase: 6, connection: "WYE", winding_resistance_ohms: 0.42 }
              as: WindingTechnician
              as_user_id: "op-w"
            - call: "POST /shops/${shop_id}/work-orders/${wf1}/tests"
              payload: { kind: "FINAL", vibration_mm_s: 2.0, insulation_megohms: 900 }
              as: Technician
              as_user_id: "op-t2"
            - call: "POST /shops/${shop_id}/work-orders/${wf1}/release"
              as: ServiceManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: ShopAdmin
            - call: "POST /shops/${shop_id}/work-orders"
              payload: { customer_id: "${cust_id}", motor_id: "${mw2}", priority: "STANDARD" }
              as: Technician
              captures: { wf2: $.data.id }
            - call: "POST /shops/${shop_id}/work-orders/${wf2}/tests"
              payload: { kind: "INCOMING", insulation_megohms: 500 }
              as: Technician
              as_user_id: "op-t"
            - call: "POST /shops/${shop_id}/work-orders/${wf2}/diagnose"
              payload: { failure_diagnosis: "x", rewind_hours: 2, materials_cents: 0, replacement_cost_cents: 999999 }
              as: Technician
              as_user_id: "op-t"
            - call: "GET /shops/${shop_id}/work-orders/${wf2}"
              as: Estimator
              captures: { wf2v: $.data.version }
            - call: "POST /shops/${shop_id}/work-orders/${wf2}/quotes"
              payload: { expected_work_order_version: "${wf2v}" }
              as: Estimator
              captures: { wfq2: $.data.id }
            - call: "POST /shops/${shop_id}/work-orders/${wf2}/quotes/${wfq2}/send"
              as: Estimator
            - call: "POST /shops/${shop_id}/work-orders/${wf2}/quotes/${wfq2}/accept"
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /shops/${shop_id}/work-orders/${wf2}/start-rewind"
              as: WindingTechnician
              as_user_id: "op-w"
            - call: "POST /shops/${shop_id}/work-orders/${wf2}/coil-data"
              payload: { wire_gauge_awg: "14", turns_per_coil: 22, coils_per_phase: 6, connection: "WYE", winding_resistance_ohms: 0.42 }
              as: WindingTechnician
              as_user_id: "op-w"
            - call: "POST /shops/${shop_id}/work-orders/${wf2}/tests"
              payload: { kind: "FINAL", vibration_mm_s: 2.0, insulation_megohms: 900 }
              as: Technician
              as_user_id: "op-t2"
            - call: "POST /shops/${shop_id}/work-orders/${wf2}/release"
              as: ServiceManager
            - call: "GET /shops/${shop_id}/work-orders/${wf1}/invoices"
              as: ServiceManager
              captures: { i1: "$.data[0].id" }
            - call: "GET /shops/${shop_id}/work-orders/${wf2}/invoices"
              as: ServiceManager
              captures: { i2: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ShopAdmin
          trigger:
            - call: "POST /shops/${shop_id}/customers/${cust_id}/payments"
              payload: { payment_cents: 70000 }
              as: ServiceManager
          assert:
            - "sum(response.applied[*].applied_cents) + response.credit_added_cents == 70000   # conservation of the payment cents"
            - "response.applied[0].invoice_id == ${i1} and applied[0].applied_cents == 34680   # oldest issued_at first"
            - "response.applied[1].invoice_id == ${i2} and applied[1].applied_cents == 35320   # min(remaining 35320, 43860)"
            - "response.credit_added_cents == 0"
            - "Invoice.${i1}.status == PAID and Invoice.${i2}.status == OPEN with balance_due_cents == 8540"

