# =============================================================================
# Scaffold: Aircraft Title, Escrow & Registration Service (Oklahoma City)
# =============================================================================

scenario: |
  1129. Aircraft Title, Escrow & Registration Service (Oklahoma City title/escrow agent): title search & lien discovery, escrow funding & disbursement instructions, FAA registry filing sequence & international registry priority, deregistration & export certificate, lien release coordination with lender, closing document package & signature logistics, trustee ownership structures, post-closing recording verification

domain_name: aircraft-title-escrow
api_prefix: /api

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers: [optimistic_concurrency, cascading_side_effects, dual_variant_calculation, ops_run_checkpoint]
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Aircraft
    parent: null
    common_fields: true
    fields:
      - { name: n_number, type: string, source: input, description: "Registration N-number; unique across all Aircraft", constraints: "unique; non-empty" }
      - { name: serial_number, type: string, source: input, description: "Manufacturer serial number" }
      - { name: make_model, type: string, source: input, description: "Make and model, e.g. 'Cessna 560XL'" }
      - { name: year, type: integer, source: input, description: "Manufacture year", constraints: "1900 <= year <= 2100" }
      - { name: is_international_registry, type: boolean, source: input, default: false, description: "Aircraft is eligible for / subject to Cape Town International Registry interests" }
      - { name: registry_status, type: enum, source: system, default: REGISTERED, description: "REGISTERED | DEREGISTRATION_PENDING | DEREGISTERED | EXPORTED", constraints: "transitions only via Filing side effects" }

  - name: Party
    parent: null
    common_fields: true
    fields:
      - { name: party_type, type: enum, source: input, description: "BUYER | SELLER | LENDER | TRUSTEE" }
      - { name: legal_name, type: string, source: input, description: "Legal name of the party" }
      - { name: email, type: string, source: input, description: "Contact email", constraints: "optional" }
      - { name: is_citizenship_verified, type: boolean, source: input, default: false, description: "True when the party's citizenship/qualification evidence is on file (required of trustees)" }

  - name: EscrowFile
    parent: null
    common_fields: true
    fields:
      - { name: aircraft_id, type: string, source: input, description: "FK -> Aircraft.id; subject aircraft" }
      - { name: buyer_party_id, type: string, source: input, description: "FK -> Party.id; buyer" }
      - { name: seller_party_id, type: string, source: input, description: "FK -> Party.id; seller" }
      - { name: lender_party_id, type: string, source: input, description: "FK -> Party.id; optional lender funding the purchase", constraints: "optional" }
      - { name: trustee_party_id, type: string, source: input, description: "FK -> Party.id; optional owner-trustee", constraints: "optional" }
      - { name: requires_trust, type: boolean, source: input, default: false, description: "True when ownership will vest in an owner trustee (non-citizen structure); gates posture" }
      - { name: purchase_price_cents, type: integer, source: input, description: "Agreed purchase price", constraints: "> 0" }
      - { name: annual_registration_fee_cents, type: integer, source: input, description: "Annual registration/tax amount used for proration", constraints: ">= 0" }
      - { name: proration_method, type: enum, source: input, description: "DAILY | MONTHLY; selects the closing_proration variant" }
      - { name: expected_close_date, type: string, source: input, description: "YYYY-MM-DD used as the proration anchor date" }
      - { name: status, type: enum, source: system, default: OPENED, description: "OPENED | SEARCH_ORDERED | SEARCH_COMPLETE | CLEARED | FUNDED | CLOSED | RECORDED | VERIFIED | ON_HOLD | CANCELLED" }
      - { name: posture, type: enum, source: computed, default: READY, description: "READY | LIEN_BLOCKED | TRUST_BLOCKED | LIEN_AND_TRUST_BLOCKED; recomputed from Lien and TrustAgreement states" }
      - { name: hold_return_state, type: enum, source: system, description: "Status to restore on resume; null unless ON_HOLD", constraints: "nullable" }
      - { name: escrow_fee_cents, type: integer, source: computed, description: "Escrow agent fee per escrow_fee_schedule; frozen at creation" }
      - { name: proration_amount_cents, type: integer, source: computed, description: "Buyer-to-seller registration proration per closing_proration; frozen at creation" }
      - { name: buyer_amount_due_cents, type: integer, source: computed, description: "purchase_price_cents + proration_amount_cents + escrow_fee_cents per closing_statement_totals" }
      - { name: total_funded_cents, type: integer, source: computed, description: "Sum of Deposit.amount_cents with status RECEIVED on this file" }
      - { name: escrow_balance_cents, type: integer, source: computed, description: "total_funded_cents - sum of RELEASED DisbursementInstruction.amount_cents" }
      - { name: seller_net_proceeds_cents, type: integer, source: computed, description: "purchase_price + proration - escrow_fee - released LIEN_PAYOFF - released TAX_REMITTANCE" }
      - { name: closed_at, type: datetime, source: system, description: "Set when status becomes CLOSED", constraints: "nullable" }

  - name: TrustAgreement
    parent: null
    common_fields: true
    fields:
      - { name: aircraft_id, type: string, source: input, description: "FK -> Aircraft.id; aircraft placed in trust" }
      - { name: trustee_party_id, type: string, source: input, description: "FK -> Party.id; owner trustee (party_type TRUSTEE)" }
      - { name: beneficiary_name, type: string, source: input, description: "Trust beneficiary legal name" }
      - { name: beneficiary_citizenship, type: enum, source: input, description: "US_CITIZEN | NON_US_CITIZEN" }
      - { name: effective_date, type: string, source: input, description: "YYYY-MM-DD trust term start (closed interval start)" }
      - { name: expiry_date, type: string, source: input, description: "YYYY-MM-DD trust term end (closed interval end); must be > effective_date" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | ACCEPTED | REJECTED | EXPIRED" }
      - { name: submitted_at, type: datetime, source: system, description: "Set on submit", constraints: "nullable" }

  - name: TitleSearch
    parent: null
    common_fields: true
    fields:
      - { name: escrow_file_id, type: string, source: input, description: "FK -> EscrowFile.id; file the search serves" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | COMPLETED | STALE" }
      - { name: effective_at, type: datetime, source: system, description: "Logical-clock instant when results were completed (or refreshed); staleness measured from this", constraints: "nullable" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock instant of completion", constraints: "nullable" }
      - { name: finding_count, type: integer, source: system, default: 0, description: "Number of liens created by completion" }

  - name: Lien
    parent: null
    common_fields: true
    fields:
      - { name: escrow_file_id, type: string, source: system, description: "FK -> EscrowFile.id; file whose search discovered the lien" }
      - { name: aircraft_id, type: string, source: system, description: "FK -> Aircraft.id; copied from the escrow file" }
      - { name: title_search_id, type: string, source: system, description: "FK -> TitleSearch.id; discovering search" }
      - { name: lienor_party_id, type: string, source: system, description: "FK -> Party.id; lienholder (party_type LENDER) from the finding" }
      - { name: lienor_name, type: string, source: system, description: "Lienholder name as reported" }
      - { name: original_amount_cents, type: integer, source: system, description: "Face amount of the lien from the finding" }
      - { name: amount_paid_cents, type: integer, source: computed, default: 0, description: "Effective payoff frozen when a LienRelease is RECORDED" }
      - { name: outstanding_cents, type: integer, source: computed, description: "original_amount_cents - amount_paid_cents" }
      - { name: lien_type, type: enum, source: system, description: "FAA_RECORDED | IR_INTEREST | STATE | JUDGMENT" }
      - { name: filed_at, type: string, source: system, description: "YYYY-MM-DD FAA recording date from the finding" }
      - { name: ir_registered_at, type: string, source: system, description: "YYYY-MM-DD International Registry registration date; set only for IR_INTEREST", constraints: "nullable" }
      - { name: priority_rank, type: integer, source: computed, description: "1-based payoff priority per lien_priority_ranking" }
      - { name: status, type: enum, source: system, default: DISCOVERED, description: "DISCOVERED | DISPUTED | RELEASE_PENDING | RELEASED" }

  - name: LienRelease
    parent: null
    common_fields: true
    fields:
      - { name: lien_id, type: string, source: system, description: "FK -> Lien.id; lien being released" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED | QUOTED | RELEASE_RECEIVED | FILED | RECORDED | VOIDED | QUOTE_EXPIRED" }
      - { name: payoff_basis, type: enum, source: system, description: "FLAT | PER_DIEM; set at quote", constraints: "nullable" }
      - { name: quoted_payoff_cents, type: integer, source: system, description: "Base payoff quoted by lender", constraints: "nullable" }
      - { name: per_diem_cents, type: integer, source: system, description: "Daily accrual for PER_DIEM quotes", constraints: "nullable" }
      - { name: quote_date, type: string, source: system, description: "YYYY-MM-DD logical date of the quote", constraints: "nullable" }
      - { name: good_through_date, type: string, source: system, description: "YYYY-MM-DD inclusive last day the quote window is open", constraints: "nullable" }

  - name: Deposit
    parent: null
    common_fields: true
    fields:
      - { name: escrow_file_id, type: string, source: system, description: "FK -> EscrowFile.id; file funded" }
      - { name: payer_party_id, type: string, source: input, description: "FK -> Party.id; party sending funds" }
      - { name: amount_cents, type: integer, source: input, description: "Funds received", constraints: "> 0" }
      - { name: purpose, type: enum, source: input, description: "EARNEST_MONEY | BUYER_FUNDS | LENDER_FUNDS" }
      - { name: status, type: enum, source: system, default: RECEIVED, description: "RECEIVED | RETURNED" }
      - { name: returned_at, type: datetime, source: system, description: "Set on return", constraints: "nullable" }

  - name: DisbursementInstruction
    parent: null
    common_fields: true
    fields:
      - { name: escrow_file_id, type: string, source: system, description: "FK -> EscrowFile.id; file paying out" }
      - { name: payee_party_id, type: string, source: input, description: "FK -> Party.id; recipient" }
      - { name: lien_id, type: string, source: input, description: "FK -> Lien.id; required iff purpose == LIEN_PAYOFF", constraints: "nullable; conditional-required" }
      - { name: amount_cents, type: integer, source: input, description: "Amount to pay out", constraints: "> 0" }
      - { name: purpose, type: enum, source: input, description: "LIEN_PAYOFF | SELLER_PROCEEDS | ESCROW_FEE | TAX_REMITTANCE | OTHER" }
      - { name: status, type: enum, source: system, default: PENDING_APPROVAL, description: "PENDING_APPROVAL | APPROVED | RELEASED | VOIDED" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the drafter (segregation-of-duties reference)" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of the approver", constraints: "nullable" }

  - name: Filing
    parent: null
    common_fields: true
    fields:
      - { name: escrow_file_id, type: string, source: system, description: "FK -> EscrowFile.id; file the filing serves" }
      - { name: aircraft_id, type: string, source: system, description: "FK -> Aircraft.id; copied from the escrow file" }
      - { name: filing_type, type: enum, source: input, description: "BILL_OF_SALE | REGISTRATION_APPLICATION | MORTGAGE_RECORDATION | DEREGISTRATION | EXPORT_CERTIFICATE" }
      - { name: status, type: enum, source: system, default: QUEUED, description: "QUEUED | SUBMITTED | ACCEPTED | REJECTED | WITHDRAWN" }
      - { name: verification_status, type: enum, source: system, default: NONE, description: "NONE | PENDING | MATCHED | MISMATCHED; parallel dimension, set PENDING on accept" }
      - { name: registry_confirmation_code, type: string, source: system, description: "Confirmation code recorded at accept time", constraints: "nullable" }
      - { name: reject_reason, type: string, source: system, description: "Registry rejection reason", constraints: "nullable" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock instant of (re)submission", constraints: "nullable" }
      - { name: sequence_index, type: integer, source: system, description: "1-based order among this file's submissions, assigned at submit in submission order", constraints: "nullable" }

  - name: ClosingDocument
    parent: null
    common_fields: true
    fields:
      - { name: escrow_file_id, type: string, source: system, description: "FK -> EscrowFile.id; file the document belongs to" }
      - { name: doc_type, type: enum, source: input, description: "PURCHASE_AGREEMENT | ESCROW_INSTRUCTIONS | BILL_OF_SALE_DOC | WIRE_AUTHORIZATION | CLOSING_STATEMENT" }
      - { name: required_signer_party_ids, type: array, source: input, description: "Party ids that must sign; each must be a party on the file" }
      - { name: signed_party_ids, type: array, source: system, default: [], description: "Party ids that have signed so far (append-only, no duplicates)" }
      - { name: status, type: enum, source: system, default: PREPARED, description: "PREPARED | OUT_FOR_SIGNATURE | PARTIALLY_SIGNED | FULLY_SIGNED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: EscrowFile
    initial_state: OPENED
    terminal_states: [VERIFIED, CANCELLED]
    transitions:
      - from: OPENED
        to: SEARCH_ORDERED
        trigger: "POST /api/escrow-files/{id}/title-searches (automatic on first search order)"
        actor: system
        preconditions: ["search order accepted"]
        side_effects: ["EscrowFile.version += 1"]
      - from: SEARCH_ORDERED
        to: SEARCH_COMPLETE
        trigger: "POST /api/title-searches/{id}/complete (automatic)"
        actor: system
        preconditions: ["search completed"]
        side_effects: ["posture recomputed (new liens may set LIEN_BLOCKED)"]
      - from: SEARCH_COMPLETE
        to: CLEARED
        trigger: "automatic bubble-up when posture becomes READY"
        actor: system
        preconditions: ["posture == READY"]
        side_effects: ["if total_funded_cents >= buyer_amount_due_cents, immediately auto-transition to FUNDED"]
      - from: CLEARED
        to: FUNDED
        trigger: "automatic when total_funded_cents >= buyer_amount_due_cents (inclusive threshold)"
        actor: system
        preconditions: ["total_funded_cents >= buyer_amount_due_cents"]
        side_effects: []
      - from: FUNDED
        to: CLEARED
        trigger: "automatic revert when a deposit return drops total_funded_cents below buyer_amount_due_cents"
        actor: system
        preconditions: ["total_funded_cents < buyer_amount_due_cents"]
        side_effects: []
      - from: FUNDED
        to: CLOSED
        trigger: "POST /api/escrow-files/{id}/close"
        actor: EscrowOfficer
        preconditions: ["posture == READY", "every ClosingDocument on the file is FULLY_SIGNED (zero documents allowed)", "latest TitleSearch is COMPLETED and fresh (now <= effective_at + 30 days, inclusive)", "expected_escrow_file_version matches current version (OCC)"]
        side_effects: ["closed_at = logical clock now", "computed money fields frozen", "EscrowFile.version += 1"]
      - from: CLOSED
        to: RECORDED
        trigger: "automatic bubble-up when both BILL_OF_SALE and REGISTRATION_APPLICATION filings are ACCEPTED"
        actor: system
        preconditions: ["filing(BILL_OF_SALE).status == ACCEPTED", "filing(REGISTRATION_APPLICATION).status == ACCEPTED"]
        side_effects: []
      - from: RECORDED
        to: VERIFIED
        trigger: "automatic bubble-up when no filing is SUBMITTED or REJECTED and every ACCEPTED filing has verification_status == MATCHED"
        actor: system
        preconditions: ["no Filing in {SUBMITTED, REJECTED}", "every ACCEPTED Filing has verification_status == MATCHED"]
        side_effects: []
      - from: "OPENED|SEARCH_ORDERED|SEARCH_COMPLETE|CLEARED|FUNDED"
        to: ON_HOLD
        trigger: "POST /api/escrow-files/{id}/hold"
        actor: EscrowOfficer
        preconditions: []
        side_effects: ["hold_return_state = prior status"]
      - from: ON_HOLD
        to: "(stored hold_return_state)"
        trigger: "POST /api/escrow-files/{id}/resume"
        actor: EscrowOfficer
        preconditions: []
        side_effects: ["status = hold_return_state", "hold_return_state = null"]
      - from: "OPENED|SEARCH_ORDERED|SEARCH_COMPLETE|CLEARED|FUNDED|ON_HOLD"
        to: CANCELLED
        trigger: "POST /api/escrow-files/{id}/cancel"
        actor: EscrowOfficer
        preconditions: []
        side_effects: ["all RECEIVED Deposits -> RETURNED", "all PENDING_APPROVAL or APPROVED DisbursementInstructions -> VOIDED", "all QUEUED or REJECTED Filings -> WITHDRAWN", "all non-terminal LienReleases (REQUESTED|QUOTED|RELEASE_RECEIVED|FILED) -> VOIDED", "each Lien left without any active release returns RELEASE_PENDING -> DISCOVERED", "aircraft occupation released"]

  - entity: TitleSearch
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /api/title-searches/{id}/complete"
        actor: EscrowOfficer
        preconditions: ["parent EscrowFile not ON_HOLD / CANCELLED / VERIFIED"]
        side_effects: ["effective_at = completed_at = logical clock now", "finding_count = len(findings)", "one Lien (DISCOVERED) created per findings entry, in array order", "EscrowFile posture recomputed; if file SEARCH_ORDERED -> SEARCH_COMPLETE"]
      - from: COMPLETED
        to: STALE
        trigger: "clock sweep on POST /api/_clock/set_current_utc when now > effective_at + 30 days"
        actor: system
        preconditions: ["logical now > effective_at + 30 days"]
        side_effects: []
      - from: STALE
        to: ACTIVE
        trigger: "POST /api/title-searches/{id}/refresh"
        actor: EscrowOfficer
        preconditions: []
        side_effects: ["effective_at = logical clock now", "finding_count unchanged (prior liens persist)"]

  - entity: Lien
    initial_state: DISCOVERED
    terminal_states: [RELEASED]
    transitions:
      - from: DISCOVERED
        to: DISPUTED
        trigger: "POST /api/liens/{id}/dispute"
        actor: EscrowOfficer
        preconditions: []
        side_effects: ["EscrowFile posture recomputed"]
      - from: DISPUTED
        to: DISCOVERED
        trigger: "POST /api/liens/{id}/resolve-dispute"
        actor: EscrowOfficer
        preconditions: []
        side_effects: ["EscrowFile posture recomputed"]
      - from: DISCOVERED
        to: RELEASE_PENDING
        trigger: "automatic on POST /api/liens/{id}/releases"
        actor: system
        preconditions: []
        side_effects: []
      - from: RELEASE_PENDING
        to: DISCOVERED
        trigger: "automatic when its last active LienRelease becomes VOIDED or QUOTE_EXPIRED"
        actor: system
        preconditions: ["no LienRelease of this lien in {REQUESTED, QUOTED, RELEASE_RECEIVED, FILED}"]
        side_effects: ["EscrowFile posture recomputed"]
      - from: RELEASE_PENDING
        to: RELEASED
        trigger: "automatic when a LienRelease of this lien becomes RECORDED"
        actor: system
        preconditions: []
        side_effects: ["amount_paid_cents = effective payoff of the recorded release", "outstanding_cents = original_amount_cents - amount_paid_cents", "EscrowFile posture recomputed (cascade link toward CLEARED)"]

  - entity: LienRelease
    initial_state: REQUESTED
    terminal_states: [RECORDED, VOIDED, QUOTE_EXPIRED]
    transitions:
      - from: REQUESTED
        to: QUOTED
        trigger: "POST /api/releases/{id}/quote"
        actor: LenderRep
        preconditions: ["X-User-ID == lien.lienor_party_id", "payoff_basis == PER_DIEM requires per_diem_cents present"]
        side_effects: ["quote_date = logical clock date", "good_through_date stored"]
      - from: QUOTED
        to: RELEASE_RECEIVED
        trigger: "POST /api/releases/{id}/receive-release"
        actor: LenderRep
        preconditions: ["X-User-ID == lien.lienor_party_id"]
        side_effects: []
      - from: RELEASE_RECEIVED
        to: FILED
        trigger: "POST /api/releases/{id}/file"
        actor: EscrowOfficer
        preconditions: []
        side_effects: []
      - from: FILED
        to: RECORDED
        trigger: "POST /api/releases/{id}/record"
        actor: EscrowOfficer
        preconditions: ["logical clock date <= good_through_date (inclusive)"]
        side_effects: ["effective payoff computed per effective_lien_payoff and frozen onto Lien.amount_paid_cents", "Lien RELEASE_PENDING -> RELEASED", "EscrowFile posture recomputed; if posture becomes READY and file is SEARCH_COMPLETE -> auto CLEARED (then possibly auto FUNDED)"]
      - from: QUOTED
        to: QUOTE_EXPIRED
        trigger: "clock sweep on POST /api/_clock/set_current_utc when current date > good_through_date"
        actor: system
        preconditions: []
        side_effects: ["if lien has no other active release, Lien RELEASE_PENDING -> DISCOVERED"]
      - from: "REQUESTED|QUOTED|RELEASE_RECEIVED|FILED"
        to: VOIDED
        trigger: "POST /api/releases/{id}/void (or EscrowFile cancel cascade)"
        actor: EscrowOfficer
        preconditions: []
        side_effects: ["if lien has no other active release, Lien RELEASE_PENDING -> DISCOVERED"]

  - entity: Deposit
    initial_state: RECEIVED
    terminal_states: [RETURNED]
    transitions:
      - from: RECEIVED
        to: RETURNED
        trigger: "POST /api/deposits/{id}/return (or EscrowFile cancel cascade)"
        actor: EscrowOfficer
        preconditions: ["parent EscrowFile status not in {CLOSED, RECORDED, VERIFIED, CANCELLED}"]
        side_effects: ["returned_at = logical clock now", "EscrowFile.total_funded_cents and escrow_balance_cents recomputed", "if file FUNDED and total_funded_cents < buyer_amount_due_cents -> revert to CLEARED"]

  - entity: DisbursementInstruction
    initial_state: PENDING_APPROVAL
    terminal_states: [RELEASED, VOIDED]
    transitions:
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /api/disbursements/{id}/approve"
        actor: EscrowManager
        preconditions: ["approver X-User-ID != created_by_user_id (segregation of duties)"]
        side_effects: ["approved_by_user_id = X-User-ID"]
      - from: APPROVED
        to: RELEASED
        trigger: "POST /api/disbursements/{id}/release"
        actor: EscrowManager
        preconditions: ["parent EscrowFile status in {CLOSED, RECORDED}", "amount_cents <= parent escrow_balance_cents (equality allowed)", "if purpose == LIEN_PAYOFF: lien.status == RELEASED", "if purpose == LIEN_PAYOFF: amount_cents == lien.amount_paid_cents"]
        side_effects: ["EscrowFile.escrow_balance_cents and seller_net_proceeds_cents recomputed"]
      - from: "PENDING_APPROVAL|APPROVED"
        to: VOIDED
        trigger: "POST /api/disbursements/{id}/void (or EscrowFile cancel cascade)"
        actor: EscrowManager
        preconditions: []
        side_effects: []

  - entity: Filing
    initial_state: QUEUED
    terminal_states: [ACCEPTED, WITHDRAWN]
    note: "Two parallel dimensions: status (lifecycle) and verification_status (post-closing recording verification). verification_status: NONE -> PENDING on accept; PENDING -> MATCHED|MISMATCHED on verify; MISMATCHED -> MATCHED|MISMATCHED on re-verify."
    transitions:
      - from: QUEUED
        to: SUBMITTED
        trigger: "POST /api/filings/{id}/submit"
        actor: EscrowOfficer
        preconditions: ["parent EscrowFile status in {CLOSED, RECORDED}", "prerequisite filing types for this filing_type on the same file are ACCEPTED: REGISTRATION_APPLICATION<-[BILL_OF_SALE], MORTGAGE_RECORDATION<-[REGISTRATION_APPLICATION], DEREGISTRATION<-[BILL_OF_SALE], EXPORT_CERTIFICATE<-[DEREGISTRATION]", "DEREGISTRATION additionally: every Lien of the file is RELEASED and aircraft.registry_status == REGISTERED"]
        side_effects: ["submitted_at = logical clock now", "sequence_index = count of this file's filings ever submitted (including this one)", "DEREGISTRATION: Aircraft.registry_status REGISTERED -> DEREGISTRATION_PENDING"]
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /api/filings/{id}/accept"
        actor: EscrowOfficer
        preconditions: []
        side_effects: ["registry_confirmation_code = input confirmation_code", "verification_status NONE -> PENDING", "DEREGISTRATION: Aircraft DEREGISTRATION_PENDING -> DEREGISTERED", "EXPORT_CERTIFICATE: Aircraft DEREGISTERED -> EXPORTED", "EscrowFile CLOSED -> RECORDED bubble-up check", "EscrowFile RECORDED -> VERIFIED bubble-up check"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /api/filings/{id}/reject"
        actor: EscrowOfficer
        preconditions: []
        side_effects: ["reject_reason stored"]
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /api/filings/{id}/resubmit"
        actor: EscrowOfficer
        preconditions: ["same prerequisites as QUEUED -> SUBMITTED, re-evaluated at resubmit time"]
        side_effects: ["submitted_at refreshed", "sequence_index reassigned", "reject_reason cleared"]
      - from: "QUEUED|REJECTED"
        to: WITHDRAWN
        trigger: "EscrowFile cancel cascade only"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ClosingDocument
    initial_state: PREPARED
    terminal_states: [FULLY_SIGNED]
    transitions:
      - from: PREPARED
        to: OUT_FOR_SIGNATURE
        trigger: "POST /api/documents/{id}/send"
        actor: EscrowOfficer
        preconditions: []
        side_effects: []
      - from: OUT_FOR_SIGNATURE
        to: PARTIALLY_SIGNED
        trigger: "POST /api/documents/{id}/sign (first valid signature)"
        actor: EscrowOfficer
        preconditions: ["signer_party_id in required_signer_party_ids", "signer_party_id not already in signed_party_ids"]
        side_effects: ["signer_party_id appended to signed_party_ids"]
      - from: PARTIALLY_SIGNED
        to: PARTIALLY_SIGNED
        trigger: "POST /api/documents/{id}/sign (subsequent valid signature, not last)"
        actor: EscrowOfficer
        preconditions: ["signer_party_id in required_signer_party_ids", "signer_party_id not already in signed_party_ids"]
        side_effects: ["signer_party_id appended to signed_party_ids"]
      - from: "OUT_FOR_SIGNATURE|PARTIALLY_SIGNED"
        to: FULLY_SIGNED
        trigger: "POST /api/documents/{id}/sign (final required signature)"
        actor: EscrowOfficer
        preconditions: ["after appending, signed_party_ids set == required_signer_party_ids set"]
        side_effects: ["signer_party_id appended to signed_party_ids"]

  - entity: TrustAgreement
    initial_state: DRAFT
    terminal_states: [EXPIRED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/trust-agreements/{id}/submit"
        actor: EscrowOfficer
        preconditions: ["trustee Party.is_citizenship_verified == true"]
        side_effects: ["submitted_at = logical clock now"]
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /api/trust-agreements/{id}/accept"
        actor: EscrowManager
        preconditions: ["no other ACCEPTED TrustAgreement for the same aircraft whose [effective_date, expiry_date] strictly overlaps (touching endpoints allowed)"]
        side_effects: ["posture recomputed on every EscrowFile for this aircraft with requires_trust == true"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /api/trust-agreements/{id}/reject"
        actor: EscrowManager
        preconditions: []
        side_effects: []
      - from: REJECTED
        to: DRAFT
        trigger: "POST /api/trust-agreements/{id}/revise"
        actor: EscrowOfficer
        preconditions: ["if dates supplied, effective_date < expiry_date"]
        side_effects: ["dates replaced when supplied", "submitted_at cleared"]
      - from: ACCEPTED
        to: EXPIRED
        trigger: "clock sweep on POST /api/_clock/set_current_utc when current date > expiry_date"
        actor: system
        preconditions: []
        side_effects: ["posture recomputed on affected escrow files (may become TRUST_BLOCKED)"]

  - entity: Aircraft
    initial_state: REGISTERED
    terminal_states: [EXPORTED]
    transitions:
      - from: REGISTERED
        to: DEREGISTRATION_PENDING
        trigger: "side effect of DEREGISTRATION Filing submit"
        actor: system
        preconditions: []
        side_effects: []
      - from: DEREGISTRATION_PENDING
        to: DEREGISTERED
        trigger: "side effect of DEREGISTRATION Filing accept"
        actor: system
        preconditions: []
        side_effects: []
      - from: DEREGISTERED
        to: EXPORTED
        trigger: "side effect of EXPORT_CERTIFICATE Filing accept"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: occ-deposit-create-on-stale-file
    parent_entity: EscrowFile
    write_endpoint: "POST /api/escrow-files/{id}/deposits"
    occ_field: "expected_escrow_file_version"
    description: |
      Creating a Deposit against an EscrowFile whose version has advanced since
      the client last observed it is rejected with ERR_STALE_VERSION, because
      funding math and the FUNDED auto-transition must be evaluated against the
      version of the file the client actually saw.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: occ-disbursement-create-on-stale-file
    parent_entity: EscrowFile
    write_endpoint: "POST /api/escrow-files/{id}/disbursements"
    occ_field: "expected_escrow_file_version"
    description: |
      Creating a DisbursementInstruction against an EscrowFile whose version has
      advanced since the client last observed it is rejected with
      ERR_STALE_VERSION; the drafter must re-read the file before drafting a payout.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: occ-close-on-stale-file
    parent_entity: EscrowFile
    write_endpoint: "POST /api/escrow-files/{id}/close"
    occ_field: "expected_escrow_file_version"
    description: |
      Closing an EscrowFile whose version has advanced since the client last
      observed it is rejected with ERR_STALE_VERSION; closing freezes money fields
      and must not apply to a file state the closer never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: escrow_fee_schedule
    trigger: "EscrowFile creation; result frozen into escrow_fee_cents"
    algorithm: tiered_pricing
    formula: |
      base = purchase_price_cents + proration_amount_cents   # pinned: proration FIRST, fee SECOND; fee itself is NEVER part of base
      tier1 = round_half_up(min(base, TIER1_CAP) * TIER1_BPS / 10000)
      tier2 = round_half_up(max(0, min(base, TIER2_CAP) - TIER1_CAP) * TIER2_BPS / 10000)
      tier3 = round_half_up(max(0, base - TIER2_CAP) * TIER3_BPS / 10000)
      tier_sum = tier1 + tier2 + tier3                       # pinned: round per tier, THEN sum
      fee = min(max(tier_sum, MIN_FEE_CENTS) + (requires_trust ? TRUST_SURCHARGE_CENTS : 0), FEE_CAP_CENTS)
    input_set: "the EscrowFile being created (single row)"
    constants:
      TIER1_CAP: 50000000
      TIER1_BPS: 30
      TIER2_CAP: 200000000
      TIER2_BPS: 20
      TIER3_BPS: 10
      MIN_FEE_CENTS: 150000
      TRUST_SURCHARGE_CENTS: 75000
      FEE_CAP_CENTS: 2500000
    precision: "integer cents; per-tier round_half_up, then sum"
    variants: []

  - name: closing_proration
    trigger: "EscrowFile creation, BEFORE escrow_fee_schedule; result frozen into proration_amount_cents"
    algorithm: forward_looking
    formula: |
      Buyer reimburses seller for the post-closing portion of the annual registration fee.
      DAILY variant:
        days_remaining = number of whole days strictly after expected_close_date through Dec 31 of the same year (inclusive of Dec 31)
        amount = round_half_up(annual_registration_fee_cents * days_remaining / 365)
      MONTHLY variant:
        full_months = count of calendar months strictly after the month containing expected_close_date, through December
        partial = 0.5 if day(expected_close_date) <= 15 else 0
        amount = full_months * round_half_up(annual_registration_fee_cents / 12)
                 + (partial == 0.5 ? round_half_up(annual_registration_fee_cents / 24) : 0)
        # pinned rounding: round each month's share to cents, THEN sum (never sum-then-round)
    input_set: "the EscrowFile being created"
    constants:
      DAYS_PER_YEAR: 365
      MONTHS_PER_YEAR: 12
      PARTIAL_MONTH_DAY_CUTOFF: 15
    precision: "integer cents, round_half_up"
    variants:
      - name: DAILY
        when: "EscrowFile.proration_method == DAILY"
        difference: "day-count fraction of the annual fee; single final rounding"
      - name: MONTHLY
        when: "EscrowFile.proration_method == MONTHLY"
        difference: "month-count fraction with half-month credit for closings on/before day 15; per-month rounding then sum"

  - name: closing_statement_totals
    trigger: "EscrowFile creation (freeze of fee/proration/due), every Deposit create/return, every DisbursementInstruction release/void"
    algorithm: aggregation
    formula: |
      Evaluation order is PINNED to break the circular-looking dependency
      (due gates FUNDED, FUNDED gates close, close date feeds proration, proration feeds due):
        (1) proration_amount_cents := closing_proration at expected_close_date (frozen at creation)
        (2) escrow_fee_cents      := escrow_fee_schedule on base = purchase_price_cents + proration_amount_cents (frozen)
        (3) buyer_amount_due_cents := purchase_price_cents + proration_amount_cents + escrow_fee_cents (frozen)
        (4) total_funded_cents := sum(Deposit.amount_cents where escrow_file_id = file AND status == RECEIVED)   # live
        (5) escrow_balance_cents := total_funded_cents - sum(DisbursementInstruction.amount_cents where escrow_file_id = file AND status == RELEASED)   # live
        (6) seller_net_proceeds_cents := purchase_price_cents + proration_amount_cents - escrow_fee_cents
              - sum(RELEASED disbursements with purpose == LIEN_PAYOFF)
              - sum(RELEASED disbursements with purpose == TAX_REMITTANCE)                                       # live
    input_set: "Deposits with status RECEIVED only; DisbursementInstructions with status RELEASED only; RETURNED/VOIDED rows excluded"
    constants: {}
    precision: "integer cents"
    variants: []

  - name: effective_lien_payoff
    trigger: "LienRelease FILED -> RECORDED transition; result frozen into Lien.amount_paid_cents"
    algorithm: threshold
    formula: |
      FLAT variant:    payoff = quoted_payoff_cents
      PER_DIEM variant:
        days = min((record_date - quote_date).days, (good_through_date - quote_date).days)
        payoff = quoted_payoff_cents + per_diem_cents * days
      record must satisfy record_date <= good_through_date (inclusive) or the release has already
      been swept to QUOTE_EXPIRED and the transition does not exist.
    input_set: "the LienRelease being recorded"
    constants: {}
    precision: "integer cents"
    variants:
      - name: FLAT
        when: "LienRelease.payoff_basis == FLAT"
        difference: "payoff is the quoted amount regardless of record date"
      - name: PER_DIEM
        when: "LienRelease.payoff_basis == PER_DIEM"
        difference: "payoff accrues per_diem_cents per whole day after quote_date, capped at good_through_date"

  - name: lien_priority_ranking
    trigger: "recomputed whenever a Lien is created for an aircraft"
    algorithm: topological
    formula: |
      Order all Liens of the aircraft (any escrow file, any non-RELEASED or RELEASED status):
        class 1: lien_type == IR_INTEREST,      sorted by ir_registered_at ASC
        class 2: lien_type == FAA_RECORDED,     sorted by filed_at ASC
        class 3: lien_type in {STATE, JUDGMENT}, sorted by filed_at ASC
      Classes concatenate (1 before 2 before 3). Ties within a class break by Lien.created_at ASC.
      priority_rank is the 1-based position. (id is NEVER used as a tie-break.)
    input_set: "all Liens whose aircraft_id matches, regardless of status"
    constants: {}
    precision: "integer ranks"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; role is a known role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "role is in the endpoint's roles list", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "LenderRep: X-User-ID equals the lien's lienor_party_id", error_id: ERR_FORBIDDEN_IDENTITY, http_status: 403, applies_to: "POST /api/releases/{id}/quote, POST /api/releases/{id}/receive-release" }
  - { priority: 4, category: existence, check: "request body schema: required fields present, no unknown fields, enum members valid, integer amounts > 0", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all POST endpoints" }
  - { priority: 5, category: existence, check: "every path id resolves, left-to-right; nested child must belong to the path parent", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 6, category: state, check: "parent EscrowFile ON_HOLD blocks all child mutations and close", error_id: ERR_FILE_ON_HOLD, http_status: 409, applies_to: "all endpoints scoped under /api/escrow-files/{id}/... plus close" }
  - { priority: 7, category: state, check: "parent EscrowFile in terminal state (CANCELLED, VERIFIED) blocks all mutations", error_id: ERR_ALREADY_TERMINAL, http_status: 409, applies_to: "all endpoints scoped under /api/escrow-files/{id}/... plus hold/resume/cancel/close" }
  - { priority: 8, category: state, check: "state-machine transition preconditions of §1.2 (from-state and cross-entity state gates)", error_id: ERR_INVALID_TRANSITION, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 9, category: state, check: "OCC: expected_escrow_file_version equals current EscrowFile.version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /api/escrow-files/{id}/deposits, POST /api/escrow-files/{id}/disbursements, POST /api/escrow-files/{id}/close" }
  - { priority: 10, category: business_safety, check: "segregation of duties: disbursement approver X-User-ID != created_by_user_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /api/disbursements/{id}/approve" }
  - { priority: 11, category: business_safety, check: "trustee Party.is_citizenship_verified == true", error_id: ERR_TRUSTEE_NOT_QUALIFIED, http_status: 422, applies_to: "POST /api/trust-agreements/{id}/submit" }
  - { priority: 12, category: business_constraint, check: "n_number unique across Aircraft", error_id: ERR_DUPLICATE_N_NUMBER, http_status: 409, applies_to: "POST /api/aircraft" }
  - { priority: 13, category: business_constraint, check: "aircraft occupation: no other EscrowFile for the aircraft with status NOT IN {CANCELLED, VERIFIED} (unbounded-until-terminal interval)", error_id: ERR_AIRCRAFT_UNDER_CONTRACT, http_status: 409, applies_to: "POST /api/escrow-files" }
  - { priority: 14, category: business_constraint, check: "no existing TitleSearch for the file with status ACTIVE or COMPLETED (STALE allowed)", error_id: ERR_SEARCH_ALREADY_ACTIVE, http_status: 409, applies_to: "POST /api/escrow-files/{id}/title-searches" }
  - { priority: 15, category: business_constraint, check: "quote window: no other LienRelease for the lien in status QUOTED whose [quote_date, good_through_date] window still covers today (inclusive end)", error_id: ERR_QUOTE_WINDOW_OPEN, http_status: 409, applies_to: "POST /api/liens/{id}/releases" }
  - { priority: 16, category: business_constraint, check: "trust term overlap: no ACCEPTED TrustAgreement for the aircraft with strict interior overlap of [effective_date, expiry_date] (touching endpoints allowed)", error_id: ERR_TRUST_OVERLAP, http_status: 409, applies_to: "POST /api/trust-agreements/{id}/accept" }
  - { priority: 17, category: business_constraint, check: "one non-WITHDRAWN Filing per (escrow_file_id, filing_type)", error_id: ERR_DUPLICATE_FILING, http_status: 409, applies_to: "POST /api/escrow-files/{id}/filings" }
  - { priority: 18, category: business_constraint, check: "filing sequence: prerequisite filing types ACCEPTED on the same file per §1.2 Filing submit", error_id: ERR_FILING_SEQUENCE_VIOLATION, http_status: 409, applies_to: "POST /api/filings/{id}/submit, POST /api/filings/{id}/resubmit" }
  - { priority: 19, category: business_constraint, check: "signer_party_id not already in signed_party_ids", error_id: ERR_ALREADY_SIGNED, http_status: 409, applies_to: "POST /api/documents/{id}/sign" }
  - { priority: 20, category: business_referential, check: "every required_signer_party_ids entry is one of the file's buyer/seller/lender/trustee parties", error_id: ERR_SIGNER_NOT_PARTY, http_status: 422, applies_to: "POST /api/escrow-files/{id}/documents" }
  - { priority: 21, category: business_referential, check: "signer_party_id is in required_signer_party_ids", error_id: ERR_SIGNER_NOT_REQUIRED, http_status: 422, applies_to: "POST /api/documents/{id}/sign" }
  - { priority: 22, category: business_referential, check: "DEREGISTRATION submit: every Lien of the file is RELEASED", error_id: ERR_LIENS_OUTSTANDING, http_status: 409, applies_to: "POST /api/filings/{id}/submit, POST /api/filings/{id}/resubmit" }
  - { priority: 23, category: business_referential, check: "close requires posture == READY", error_id: ERR_POSTURE_NOT_READY, http_status: 409, applies_to: "POST /api/escrow-files/{id}/close" }
  - { priority: 24, category: business_referential, check: "close requires every ClosingDocument FULLY_SIGNED (zero documents allowed)", error_id: ERR_DOCUMENTS_INCOMPLETE, http_status: 409, applies_to: "POST /api/escrow-files/{id}/close" }
  - { priority: 25, category: business_referential, check: "LIEN_PAYOFF release requires lien.status == RELEASED", error_id: ERR_LIEN_NOT_RELEASED, http_status: 409, applies_to: "POST /api/disbursements/{id}/release" }
  - { priority: 26, category: business_temporal, check: "close requires latest TitleSearch COMPLETED with logical now <= effective_at + 30 days (inclusive)", error_id: ERR_SEARCH_STALE, http_status: 409, applies_to: "POST /api/escrow-files/{id}/close" }
  - { priority: 27, category: business_temporal, check: "TrustAgreement effective_date < expiry_date", error_id: ERR_INVALID_DATE_RANGE, http_status: 422, applies_to: "POST /api/trust-agreements, POST /api/trust-agreements/{id}/revise" }
  - { priority: 28, category: business_fiscal, check: "disbursement release: amount_cents <= escrow_balance_cents (equality allowed; exact-zero balance reachable)", error_id: ERR_ESCROW_SHORTFALL, http_status: 422, applies_to: "POST /api/disbursements/{id}/release" }
  - { priority: 29, category: business_fiscal, check: "LIEN_PAYOFF release: amount_cents == lien.amount_paid_cents (frozen effective payoff)", error_id: ERR_PAYOFF_MISMATCH, http_status: 422, applies_to: "POST /api/disbursements/{id}/release" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/api/_clock/set_current_utc", description: "Set the logical clock (test-driving). Startup default is exactly 2026-05-01T00:00:00Z; the server never falls back to wall-clock. Side effects: sweeps TitleSearch COMPLETED->STALE (age > 30d), LienRelease QUOTED->QUOTE_EXPIRED (date > good_through), TrustAgreement ACCEPTED->EXPIRED (date > expiry), then recomputes affected postures.", roles: [EscrowManager], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["clock sweeps per description", "posture recompute"] }

  - { method: POST, path: "/api/aircraft", description: "Register a subject aircraft", roles: [EscrowOfficer], code: 201, input: [n_number, serial_number, make_model, year, "is_international_registry?"], output: Aircraft, side_effects: [] }
  - { method: GET, path: "/api/aircraft/{id}", description: "Get aircraft", roles: [EscrowOfficer, EscrowManager, LenderRep, Auditor], code: 200, input: [], output: Aircraft, side_effects: [] }
  - { method: GET, path: "/api/aircraft/{id}/trust-agreements", description: "List trust agreements covering the aircraft", roles: [EscrowOfficer, EscrowManager, LenderRep, Auditor], code: 200, input: [], output: "TrustAgreement[]", side_effects: [] }

  - { method: POST, path: "/api/parties", description: "Create a transaction party", roles: [EscrowOfficer], code: 201, input: [party_type, legal_name, "email?", "is_citizenship_verified?"], output: Party, side_effects: [] }
  - { method: GET, path: "/api/parties/{id}", description: "Get party", roles: [EscrowOfficer, EscrowManager, LenderRep, Auditor], code: 200, input: [], output: Party, side_effects: [] }

  - { method: POST, path: "/api/escrow-files", description: "Open an escrow file; computes and freezes fee/proration/due", roles: [EscrowOfficer], code: 201, input: [aircraft_id, buyer_party_id, seller_party_id, "lender_party_id?", "trustee_party_id?", "requires_trust?", purchase_price_cents, annual_registration_fee_cents, proration_method, expected_close_date], output: EscrowFile, side_effects: ["closing_proration then escrow_fee_schedule then buyer_amount_due_cents frozen", "posture initialized"] }
  - { method: GET, path: "/api/escrow-files/{id}", description: "Get escrow file", roles: [EscrowOfficer, EscrowManager, LenderRep, Auditor], code: 200, input: [], output: EscrowFile, side_effects: [] }
  - { method: GET, path: "/api/escrow-files", description: "List escrow files; default sort created_at ASC", roles: [EscrowOfficer, EscrowManager, LenderRep, Auditor], code: 200, input: ["aircraft_id?", "buyer_party_id?", "seller_party_id?", "lender_party_id?", "trustee_party_id?", "status?", "limit?", "offset?"], output: "EscrowFile[]", side_effects: [] }
  - { method: POST, path: "/api/escrow-files/{id}/hold", description: "Place an active file ON_HOLD (stores return state)", roles: [EscrowOfficer], code: 200, input: [], output: EscrowFile, side_effects: ["hold_return_state stored"] }
  - { method: POST, path: "/api/escrow-files/{id}/resume", description: "Resume an ON_HOLD file to its stored return state", roles: [EscrowOfficer], code: 200, input: [], output: EscrowFile, side_effects: [] }
  - { method: POST, path: "/api/escrow-files/{id}/cancel", description: "Cancel a pre-closing file; cascades per §1.2", roles: [EscrowOfficer], code: 200, input: [], output: EscrowFile, side_effects: ["cancel cascade: deposits RETURNED, disbursements VOIDED, filings WITHDRAWN, releases VOIDED, liens back to DISCOVERED where applicable"] }
  - { method: POST, path: "/api/escrow-files/{id}/close", description: "Close a FUNDED file (OCC-guarded); freezes money fields", roles: [EscrowOfficer], code: 200, input: [expected_escrow_file_version], output: EscrowFile, side_effects: ["status -> CLOSED", "closed_at set", "increments EscrowFile.version by 1"] }
  - { method: GET, path: "/api/escrow-files/{id}/statement", description: "Computed closing statement read", roles: [EscrowOfficer, EscrowManager, LenderRep, Auditor], code: 200, input: [], output: { purchase_price_cents: integer, proration_amount_cents: integer, escrow_fee_cents: integer, buyer_amount_due_cents: integer, total_funded_cents: integer, escrow_balance_cents: integer, seller_net_proceeds_cents: integer }, side_effects: [] }

  - { method: POST, path: "/api/escrow-files/{id}/title-searches", description: "Order a title search (status ACTIVE). Allowed file statuses: OPENED, SEARCH_ORDERED, SEARCH_COMPLETE, CLEARED, FUNDED, CLOSED, RECORDED; rejects when another search is ACTIVE or COMPLETED-non-stale (ERR_SEARCH_ALREADY_ACTIVE)", roles: [EscrowOfficer], code: 201, input: [], output: TitleSearch, side_effects: ["EscrowFile OPENED -> SEARCH_ORDERED"] }
  - { method: POST, path: "/api/title-searches/{id}/complete", description: "Complete a search with findings; one Lien (DISCOVERED) created per findings entry in array order. Each findings item: { lienor_party_id (Party with party_type LENDER), lienor_name, amount_cents (>0), lien_type (FAA_RECORDED|IR_INTEREST|STATE|JUDGMENT), filed_at (YYYY-MM-DD), ir_registered_at? (required iff lien_type == IR_INTEREST) }", roles: [EscrowOfficer], code: 200, input: [findings], output: TitleSearch, side_effects: ["Liens created in findings array order", "EscrowFile SEARCH_ORDERED -> SEARCH_COMPLETE", "posture recompute; possible auto CLEARED then auto FUNDED"] }
  - { method: POST, path: "/api/title-searches/{id}/refresh", description: "Refresh a STALE search back to ACTIVE with a new effective_at", roles: [EscrowOfficer], code: 200, input: [], output: TitleSearch, side_effects: ["effective_at refreshed"] }
  - { method: GET, path: "/api/escrow-files/{id}/title-searches", description: "List searches for a file", roles: [EscrowOfficer, EscrowManager, LenderRep, Auditor], code: 200, input: [], output: "TitleSearch[]", side_effects: [] }

  - { method: GET, path: "/api/liens", description: "List liens; default sort created_at ASC", roles: [EscrowOfficer, EscrowManager, LenderRep, Auditor], code: 200, input: ["escrow_file_id?", "aircraft_id?", "title_search_id?", "lienor_party_id?", "status?", "limit?", "offset?"], output: "Lien[]", side_effects: [] }
  - { method: GET, path: "/api/liens/{id}", description: "Get lien", roles: [EscrowOfficer, EscrowManager, LenderRep, Auditor], code: 200, input: [], output: Lien, side_effects: [] }
  - { method: POST, path: "/api/liens/{id}/dispute", description: "Dispute a discovered lien", roles: [EscrowOfficer], code: 200, input: ["reason?"], output: Lien, side_effects: ["posture recompute"] }
  - { method: POST, path: "/api/liens/{id}/resolve-dispute", description: "Return a disputed lien to DISCOVERED", roles: [EscrowOfficer], code: 200, input: [], output: Lien, side_effects: ["posture recompute"] }

  - { method: POST, path: "/api/liens/{id}/releases", description: "Request lien release coordination from the lienholder (status REQUESTED)", roles: [EscrowOfficer], code: 201, input: [], output: LienRelease, side_effects: ["Lien DISCOVERED -> RELEASE_PENDING"] }
  - { method: GET, path: "/api/liens/{id}/releases", description: "List releases for a lien", roles: [EscrowOfficer, EscrowManager, LenderRep, Auditor], code: 200, input: [], output: "LienRelease[]", side_effects: [] }
  - { method: POST, path: "/api/releases/{id}/quote", description: "Lender submits payoff quote (FLAT or PER_DIEM)", roles: [LenderRep], code: 200, input: [payoff_basis, quoted_payoff_cents, "per_diem_cents?", good_through_date], output: LienRelease, side_effects: ["quote_date = clock date"] }
  - { method: POST, path: "/api/releases/{id}/receive-release", description: "Lender confirms signed release document received", roles: [LenderRep], code: 200, input: [], output: LienRelease, side_effects: [] }
  - { method: POST, path: "/api/releases/{id}/file", description: "Officer files the release with the registry", roles: [EscrowOfficer], code: 200, input: [], output: LienRelease, side_effects: [] }
  - { method: POST, path: "/api/releases/{id}/record", description: "Officer confirms registry recordation; freezes effective payoff onto the lien (cascade: lien RELEASED -> posture -> possible auto CLEARED/FUNDED)", roles: [EscrowOfficer], code: 200, input: [], output: LienRelease, side_effects: ["effective_lien_payoff computed and frozen", "Lien -> RELEASED", "posture recompute", "possible EscrowFile auto CLEARED then FUNDED"] }
  - { method: POST, path: "/api/releases/{id}/void", description: "Void a non-terminal release", roles: [EscrowOfficer], code: 200, input: [], output: LienRelease, side_effects: ["lien back to DISCOVERED if no other active release"] }

  - { method: POST, path: "/api/escrow-files/{id}/deposits", description: "Record incoming escrow funds (OCC-guarded). Allowed file statuses: OPENED, SEARCH_ORDERED, SEARCH_COMPLETE, CLEARED, FUNDED", roles: [EscrowOfficer], code: 201, input: [payer_party_id, amount_cents, purpose, expected_escrow_file_version], output: Deposit, side_effects: ["total_funded_cents / escrow_balance_cents recompute", "auto CLEARED -> FUNDED at threshold", "increments EscrowFile.version by 1"] }
  - { method: POST, path: "/api/deposits/{id}/return", description: "Return a received deposit (pre-closing only)", roles: [EscrowOfficer], code: 200, input: [], output: Deposit, side_effects: ["funded/balance recompute", "possible FUNDED -> CLEARED revert"] }
  - { method: GET, path: "/api/deposits", description: "List deposits", roles: [EscrowOfficer, EscrowManager, LenderRep, Auditor], code: 200, input: ["escrow_file_id?", "payer_party_id?", "status?", "limit?", "offset?"], output: "Deposit[]", side_effects: [] }
  - { method: GET, path: "/api/deposits/{id}", description: "Get deposit", roles: [EscrowOfficer, EscrowManager, LenderRep, Auditor], code: 200, input: [], output: Deposit, side_effects: [] }

  - { method: POST, path: "/api/escrow-files/{id}/disbursements", description: "Draft a disbursement instruction (lands PENDING_APPROVAL; OCC-guarded). Allowed file statuses: SEARCH_COMPLETE, CLEARED, FUNDED, CLOSED, RECORDED; purpose == LIEN_PAYOFF requires lien_id of a lien belonging to the file", roles: [EscrowOfficer, EscrowManager], code: 201, input: [payee_party_id, amount_cents, purpose, "lien_id?", expected_escrow_file_version], output: DisbursementInstruction, side_effects: ["created_by_user_id = X-User-ID", "increments EscrowFile.version by 1"] }
  - { method: POST, path: "/api/disbursements/{id}/approve", description: "Manager approves (segregation of duties enforced)", roles: [EscrowManager], code: 200, input: [], output: DisbursementInstruction, side_effects: [] }
  - { method: POST, path: "/api/disbursements/{id}/release", description: "Release approved funds (fiscal + payoff-match checks)", roles: [EscrowManager], code: 200, input: [], output: DisbursementInstruction, side_effects: ["balance and seller_net recompute"] }
  - { method: POST, path: "/api/disbursements/{id}/void", description: "Void a non-released instruction", roles: [EscrowManager], code: 200, input: [], output: DisbursementInstruction, side_effects: [] }
  - { method: GET, path: "/api/disbursements", description: "List disbursement instructions", roles: [EscrowOfficer, EscrowManager, LenderRep, Auditor], code: 200, input: ["escrow_file_id?", "payee_party_id?", "lien_id?", "status?", "limit?", "offset?"], output: "DisbursementInstruction[]", side_effects: [] }
  - { method: GET, path: "/api/disbursements/{id}", description: "Get disbursement instruction", roles: [EscrowOfficer, EscrowManager, LenderRep, Auditor], code: 200, input: [], output: DisbursementInstruction, side_effects: [] }

  - { method: POST, path: "/api/escrow-files/{id}/filings", description: "Queue a registry filing of the given type. Allowed file statuses: CLEARED, FUNDED, CLOSED, RECORDED; one non-WITHDRAWN filing per (file, filing_type)", roles: [EscrowOfficer], code: 201, input: [filing_type], output: Filing, side_effects: ["aircraft_id copied from file"] }
  - { method: POST, path: "/api/filings/{id}/submit", description: "Submit a QUEUED filing to the registry (sequence + lien gates)", roles: [EscrowOfficer], code: 200, input: [], output: Filing, side_effects: ["sequence_index assigned", "DEREGISTRATION moves Aircraft to DEREGISTRATION_PENDING"] }
  - { method: POST, path: "/api/filings/{id}/accept", description: "Record registry acceptance with its confirmation code", roles: [EscrowOfficer], code: 200, input: [confirmation_code], output: Filing, side_effects: ["verification_status -> PENDING", "aircraft status side effects", "RECORDED / VERIFIED bubble-up checks"] }
  - { method: POST, path: "/api/filings/{id}/reject", description: "Record registry rejection", roles: [EscrowOfficer], code: 200, input: [reason], output: Filing, side_effects: [] }
  - { method: POST, path: "/api/filings/{id}/resubmit", description: "Resubmit a REJECTED filing (prerequisites re-evaluated)", roles: [EscrowOfficer], code: 200, input: [], output: Filing, side_effects: ["sequence_index reassigned"] }
  - { method: POST, path: "/api/filings/{id}/verify", description: "Post-closing recording verification: MATCHED iff recorded_confirmation_code == registry_confirmation_code; re-verify allowed from MISMATCHED", roles: [EscrowOfficer], code: 200, input: [recorded_confirmation_code], output: Filing, side_effects: ["verification_status updated", "VERIFIED bubble-up check"] }
  - { method: GET, path: "/api/filings", description: "List filings; default sort created_at ASC", roles: [EscrowOfficer, EscrowManager, LenderRep, Auditor], code: 200, input: ["escrow_file_id?", "aircraft_id?", "filing_type?", "status?", "limit?", "offset?"], output: "Filing[]", side_effects: [] }
  - { method: GET, path: "/api/filings/{id}", description: "Get filing", roles: [EscrowOfficer, EscrowManager, LenderRep, Auditor], code: 200, input: [], output: Filing, side_effects: [] }

  - { method: POST, "path": "/api/trust-agreements", description: "Draft an owner-trust agreement", roles: [EscrowOfficer], code: 201, input: [aircraft_id, trustee_party_id, beneficiary_name, beneficiary_citizenship, effective_date, expiry_date], output: TrustAgreement, side_effects: [] }
  - { method: POST, path: "/api/trust-agreements/{id}/submit", description: "Submit trust for approval (trustee qualification checked)", roles: [EscrowOfficer], code: 200, input: [], output: TrustAgreement, side_effects: [] }
  - { method: POST, path: "/api/trust-agreements/{id}/accept", description: "Accept trust (overlap check)", roles: [EscrowManager], code: 200, input: [], output: TrustAgreement, side_effects: ["posture recompute on requires_trust files for the aircraft"] }
  - { method: POST, path: "/api/trust-agreements/{id}/reject", description: "Reject trust", roles: [EscrowManager], code: 200, input: [], output: TrustAgreement, side_effects: [] }
  - { method: POST, path: "/api/trust-agreements/{id}/revise", description: "Revise a REJECTED trust back to DRAFT (cycle)", roles: [EscrowOfficer], code: 200, input: ["effective_date?", "expiry_date?"], output: TrustAgreement, side_effects: [] }
  - { method: GET, path: "/api/trust-agreements", description: "List trust agreements", roles: [EscrowOfficer, EscrowManager, LenderRep, Auditor], code: 200, input: ["aircraft_id?", "trustee_party_id?", "status?", "limit?", "offset?"], output: "TrustAgreement[]", side_effects: [] }
  - { method: GET, path: "/api/trust-agreements/{id}", description: "Get trust agreement", roles: [EscrowOfficer, EscrowManager, LenderRep, Auditor], code: 200, input: [], output: TrustAgreement, side_effects: [] }

  - { method: POST, path: "/api/escrow-files/{id}/documents", description: "Add a closing document with its required signer set. Allowed file statuses: SEARCH_COMPLETE, CLEARED, FUNDED; every required signer must be a file party (buyer/seller/lender/trustee)", roles: [EscrowOfficer], code: 201, input: [doc_type, required_signer_party_ids], output: ClosingDocument, side_effects: ["increments EscrowFile.version by 1"] }
  - { method: POST, path: "/api/documents/{id}/send", description: "Send document for signature", roles: [EscrowOfficer], code: 200, input: [], output: ClosingDocument, side_effects: [] }
  - { method: POST, path: "/api/documents/{id}/sign", description: "Record one party's signature (duplicate and non-required signers rejected)", roles: [EscrowOfficer], code: 200, input: [signer_party_id], output: ClosingDocument, side_effects: ["possible FULLY_SIGNED auto-transition"] }
  - { method: GET, path: "/api/escrow-files/{id}/documents", description: "List closing documents of a file", roles: [EscrowOfficer, EscrowManager, LenderRep, Auditor], code: 200, input: [], output: "ClosingDocument[]", side_effects: [] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing/unknown role or user headers" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "role not in endpoint roles list" }
  - { id: ERR_FORBIDDEN_IDENTITY, http: 403, condition: "LenderRep acting on a lien whose lienor_party_id differs from X-User-ID" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "missing required field, unknown field, bad enum member, non-positive amount, or LIEN_PAYOFF without lien_id" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "path id does not resolve (left-to-right), or nested child not under path parent" }
  - { id: ERR_FILE_ON_HOLD, http: 409, condition: "mutation attempted while parent EscrowFile is ON_HOLD" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "mutation attempted on a CANCELLED or VERIFIED EscrowFile" }
  - { id: ERR_INVALID_TRANSITION, http: 409, condition: "state-machine from-state or cross-entity state precondition not met" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_escrow_file_version != current EscrowFile.version" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "disbursement approver is the same X-User-ID that drafted it" }
  - { id: ERR_TRUSTEE_NOT_QUALIFIED, http: 422, condition: "trustee party lacks citizenship verification at trust submit" }
  - { id: ERR_DUPLICATE_N_NUMBER, http: 409, condition: "aircraft n_number already registered" }
  - { id: ERR_AIRCRAFT_UNDER_CONTRACT, http: 409, condition: "another non-terminal EscrowFile already occupies the aircraft" }
  - { id: ERR_SEARCH_ALREADY_ACTIVE, http: 409, condition: "a TitleSearch in ACTIVE or COMPLETED (non-stale) already exists for the file" }
  - { id: ERR_SEARCH_STALE, http: 409, condition: "close attempted with latest search older than 30 days (strictly greater)" }
  - { id: ERR_QUOTE_WINDOW_OPEN, http: 409, condition: "another QUOTED release's [quote_date, good_through_date] window still covers today" }
  - { id: ERR_TRUST_OVERLAP, http: 409, condition: "strict interior overlap with an ACCEPTED trust for the same aircraft" }
  - { id: ERR_INVALID_DATE_RANGE, http: 422, condition: "effective_date >= expiry_date" }
  - { id: ERR_DUPLICATE_FILING, http: 409, condition: "non-WITHDRAWN filing of the same type already exists on the file" }
  - { id: ERR_FILING_SEQUENCE_VIOLATION, http: 409, condition: "prerequisite filing type not ACCEPTED on the same file" }
  - { id: ERR_LIENS_OUTSTANDING, http: 409, condition: "DEREGISTRATION submitted while any lien of the file is not RELEASED" }
  - { id: ERR_SIGNER_NOT_PARTY, http: 422, condition: "required signer is not a party on the escrow file" }
  - { id: ERR_SIGNER_NOT_REQUIRED, http: 422, condition: "signer_party_id not in required_signer_party_ids" }
  - { id: ERR_ALREADY_SIGNED, http: 409, condition: "signer already in signed_party_ids" }
  - { id: ERR_POSTURE_NOT_READY, http: 409, condition: "close attempted while posture != READY" }
  - { id: ERR_DOCUMENTS_INCOMPLETE, http: 409, condition: "close attempted with a ClosingDocument not FULLY_SIGNED" }
  - { id: ERR_LIEN_NOT_RELEASED, http: 409, condition: "LIEN_PAYOFF release against a lien not yet RELEASED" }
  - { id: ERR_ESCROW_SHORTFALL, http: 422, condition: "disbursement release amount exceeds escrow_balance_cents" }
  - { id: ERR_PAYOFF_MISMATCH, http: 422, condition: "LIEN_PAYOFF release amount != lien.amount_paid_cents" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: EscrowOfficer
    description: "Title/escrow agent operator (Oklahoma City office); runs the day-to-day file"
    identity: opaque
    exclusive_operations: [create aircraft/parties/files/searches/deposits/filings/documents/trusts, complete/refresh searches, dispute/resolve liens, request/file/record/void releases, sign documents, submit/accept/reject/resubmit/verify filings, hold/resume/cancel/close files]
    shared_operations: [all GET endpoints]
  - name: EscrowManager
    description: "Supervising manager; approves money movement and trust acceptances; operates the logical clock"
    identity: opaque
    exclusive_operations: [approve/release/void disbursements, accept/reject trust agreements, set logical clock]
    shared_operations: [all GET endpoints, draft disbursement instructions]
  - name: LenderRep
    description: "Lienholder representative; quotes payoffs and confirms lien releases for own liens only"
    identity: "entity_backed:Party"
    exclusive_operations: [quote release, confirm release received]
    shared_operations: [all GET endpoints]
  - name: Auditor
    description: "Read-only compliance auditor"
    identity: opaque
    exclusive_operations: []
    shared_operations: [all GET endpoints]
