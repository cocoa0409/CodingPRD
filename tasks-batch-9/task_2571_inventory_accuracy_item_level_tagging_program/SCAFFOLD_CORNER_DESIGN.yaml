            - "GET /inventory-integrity/count-tasks/${task1} still reads status \"COUNTING\" and submitted_at null"
            - "a ShrinkPeriod for S100 covering 2026-06-01..2026-06-30 does NOT unblock the submit — the range must contain the submit date inclusively — so the identical call still returns 409"
            - "after POST /inventory-integrity/shrink-periods for S100 covering 2026-07-01..2026-09-30 with sales_at_cost_cents 5000000, the identical submit returns 200 with status \"SUBMITTED\" and GET /inventory-integrity/variance-investigations?count_line_id=${line1} returns total_count 0 because the line had no variance"

      - name: shrink_period_overlap_and_inverted_range_rejected
        claim_type: violation_to_error
        grounds:
          - errors.ERR_SHRINK_PERIOD_OVERLAP
          - errors.ERR_INVALID_PERIOD_RANGE
          - validations.priority_75_ERR_SHRINK_PERIOD_OVERLAP
        distinguishing_aspect: "ShrinkPeriod ranges are INCLUSIVE on both ends, unlike count windows which are half-open: a new period starting exactly on the incumbent's period_end collides, while starting one day later is accepted."
        test_recipe:
          setup:
            - "Stores S100 and S200 exist."
            - "One ShrinkPeriod for S100 covering 2026-07-01..2026-09-30."
          setup_api_calls:
            - call: "POST /inventory-integrity/stores"
              payload: { code: "S100", name: "Store 100", reader_capability: "BOTH", overhead_reader_capacity: 2 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { store_s100: "$.data.id" }
            - call: "POST /inventory-integrity/stores"
              payload: { code: "S200", name: "Store 200", reader_capability: "HANDHELD_ONLY", overhead_reader_capacity: 0 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { store_s200: "$.data.id" }
            - call: "POST /inventory-integrity/shrink-periods"
              payload: { store_id: "${store_s100}", period_start: "2026-07-01", period_end: "2026-09-30", sales_at_cost_cents: 5000000 }
              as: ShrinkController
              as_user_id: "u_ctrl_1"
              captures: { sp1: "$.data.id" }
          trigger:
            - call: "POST /inventory-integrity/shrink-periods"
              payload: { store_id: "${store_s100}", period_start: "2026-09-30", period_end: "2026-12-31", sales_at_cost_cents: 4000000 }
              as: ShrinkController
              as_user_id: "u_ctrl_1"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status 409 and data.error_id == \"ERR_SHRINK_PERIOD_OVERLAP\" — the single shared day 2026-09-30 is enough under inclusive semantics"
            - "GET /inventory-integrity/shrink-periods?store_id=${store_s100} returns total_count 1"
            - "the same range for S200 is accepted with 201 — the constraint is per store"
            - "period_start 2026-10-01 / period_end 2026-12-31 at S100 is accepted with 201, giving S100 two adjacent non-overlapping periods"
            - "period_start 2026-12-31 / period_end 2026-01-01 at S200 returns 422 ERR_INVALID_PERIOD_RANGE, and scheduled_end_date before scheduled_start_date on POST /inventory-integrity/physical-inventories returns the same 422 id"

