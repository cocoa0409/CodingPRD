# =============================================================================
# PRD Benchmark Seed Tables — task_2180 Logging Contractor & Log Trucking Ops
# Difficulty band: EXPERT+ (deliberately above the §0.4 Expert envelope)
# =============================================================================

scenario: |
  desgin task harder than expert level.!!!!2180. Logging Contractor & Log Trucking Operations (logging contractor): tract assignment & production plan, crew/equipment allocation & move-in cost, log sorting by species/grade & mill quota, truck dispatch & mill delivery ticket, weight/scale limits & permit routes, wet-weather shutdown & seasonal access, contractor insurance & safety compliance, settlement per ton and haul distance

domain_name: logging-contractor-trucking

# Flat/graph topology: every aggregate is mounted at the server root, so the
# prefix is empty and all §1.5 paths below are absolute from "/".
api_prefix: ""

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: graph
  # Tract, Mill, Crew, HaulContractor are four independent aggregate roots wired
  # together by junction entities (CrewAssignment = Crew x Tract,
  # HaulRoute = Tract x Mill, Load = Tract x MillContract x HaulRoute x Truck).
  # Load additionally references itself (rehaul_of_load_id), so the reference
  # graph contains a self-edge.

  state_machine_shape: cyclic
  # Tract   : ACTIVE <-> SUSPENDED revision loop driven by ShutdownOrder
  # Statement: SUBMITTED -> DISPUTED -> REVISED -> SUBMITTED negotiation loop
  # Load     : two independent status axes on one row (dispatch_status and
  #            settlement_status advance on different triggers)
  # MillContract: OPEN <-> FILLED derived from the aggregate of its child Loads

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # A SettlementAccountant may never approve a statement they compiled
  # (compiled_by_user_id != approved_by_user_id), and a MillScaler may only act
  # on tickets belonging to their own Mill.

  consistency_model: immediate

  difficulty_level: expert_plus
  entity_count: 15
  endpoint_count: 57
  error_code_count: 55
  calculation_count: 8
  state_machine_count: 7   # 7 entities; Load carries two independent status machines

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:

  - name: Mill
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Mill trade name"
        constraints: "1..120 chars, required"
      - name: state_code
        type: string
        source: input
        description: "Two-letter US state code the mill sits in"
        constraints: "exactly 2 upper-case letters"
      - name: receiving_status
        type: enum
        source: input
        default: OPEN
        description: "Whether the mill yard accepts inbound loads right now"
        constraints: "OPEN | CLOSED"

  - name: MillContract
    parent: null
    common_fields: true
    fields:
      - name: mill_id
        type: string
        source: input
        description: "FK -> Mill.id; the mill that owns this quota"
      - name: species
        type: enum
        source: input
        description: "Log species this quota buys"
        constraints: "DOUGLAS_FIR | WESTERN_HEMLOCK | RED_ALDER | PONDEROSA_PINE"
      - name: grade
        type: enum
        source: input
        description: "Log grade this quota buys"
        constraints: "PEELER | SAWLOG_1 | SAWLOG_2 | PULP"
      - name: quota_tons
        type: number
        source: input
        description: "Total tons the mill has committed to buy in the period"
        constraints: "> 0, 2 decimal places"
      - name: overrun_tolerance_pct
        type: number
        source: input
        default: 0.05
        description: "Fraction of quota_tons that certified deliveries may exceed before certification is refused"
        constraints: "0 <= value <= 0.25"
      - name: base_rate_cents_per_ton
        type: integer
        source: input
        description: "Mill pay rate in whole cents per delivered ton; used only by the rehaul selector ranking"
        constraints: "> 0"
      - name: period_start
        type: string
        source: input
        description: "First date (inclusive, YYYY-MM-DD) the quota may be drawn against"
      - name: period_end
        type: string
        source: input
        description: "Last date (inclusive, YYYY-MM-DD) the quota may be drawn against"
      - name: reserved_tons
        type: number
        source: computed
        default: 0
        description: "Sum of Load.estimated_net_tons over Loads on this contract with dispatch_status IN {DISPATCHED, IN_TRANSIT, AT_MILL}"
      - name: delivered_tons
        type: number
        source: computed
        default: 0
        description: "Sum of DeliveryTicket.net_tons over CERTIFIED tickets whose Load has dispatch_status == DELIVERED and mill_contract_id == this contract"
      - name: available_tons
        type: number
        source: computed
        description: "quota_tons - reserved_tons - delivered_tons; may go negative inside the overrun tolerance"
      - name: status
        type: enum
        source: system
        default: OPEN
        description: "OPEN | FILLED | SUSPENDED | CLOSED; FILLED is derived (available_tons <= 0) and is never settable by a client"

  - name: HaulContractor
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Trucking contractor legal name"
        constraints: "1..120 chars, required"
      - name: dot_number
        type: string
        source: input
        description: "Motor-carrier DOT registration number"
        constraints: "1..32 chars, unique across HaulContractor"
      - name: base_state_code
        type: string
        source: input
        description: "Home state of the carrier"
        constraints: "exactly 2 upper-case letters"
      - name: compliance_status
        type: enum
        source: system
        default: COMPLIANT
        description: "COMPLIANT | WARNED | SUSPENDED; set only by safety findings, insurance cascade, suspend, reinstate"
      - name: compliance_score
        type: number
        source: computed
        description: "Result of calculations.contractor_compliance_score under the rolling_180_day variant, recomputed on every event that feeds it"
      - name: lifetime_settled_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of SettlementStatement.net_pay_cents over this contractor's statements with status == PAID"

  - name: InsuranceCertificate
    parent: HaulContractor
    common_fields: true
    fields:
      - name: haul_contractor_id
        type: string
        source: input
        description: "FK -> HaulContractor.id; the insured carrier"
      - name: coverage_type
        type: enum
        source: input
        description: "GENERAL_LIABILITY | AUTO_LIABILITY | WORKERS_COMP; all three are required for compliance"
      - name: effective_on
        type: string
        source: input
        description: "First date (inclusive, YYYY-MM-DD) the policy covers"
      - name: expires_on
        type: string
        source: input
        description: "Last date (inclusive, YYYY-MM-DD) the policy covers"
      - name: limit_cents
        type: integer
        source: input
        description: "Per-occurrence coverage limit in whole cents"
        constraints: "> 0"
      - name: revoked_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant the certificate was revoked; null while never revoked"
      - name: status
        type: enum
        source: computed
        description: "REVOKED if revoked_at is not null; else PENDING if clock_date < effective_on; else EXPIRED if clock_date > expires_on; else ACTIVE"
        constraints: "PENDING | ACTIVE | EXPIRED | REVOKED"

  - name: Truck
    parent: HaulContractor
    common_fields: true
    fields:
      - name: haul_contractor_id
        type: string
        source: input
        description: "FK -> HaulContractor.id; the carrier that owns the unit"
      - name: unit_number
        type: string
        source: input
        description: "Fleet unit number"
        constraints: "1..32 chars, unique within a haul_contractor_id"
      - name: axle_config
        type: enum
        source: input
        description: "FIVE_AXLE | SIX_AXLE | SEVEN_AXLE; selects the axle gross cap in calculations.effective_max_gross_weight"
      - name: tare_weight_lbs
        type: integer
        source: input
        description: "Empty weight of the tractor plus trailer in pounds"
        constraints: "10000 <= value <= 60000"
      - name: permit_class
        type: enum
        source: input
        description: "STANDARD | DIVISIBLE_LOAD_PERMIT | LONGER_COMBINATION; ranked STANDARD < DIVISIBLE_LOAD_PERMIT < LONGER_COMBINATION"
      - name: status
        type: enum
        source: computed
        description: "OUT_OF_SERVICE when the owning HaulContractor.compliance_status == SUSPENDED; else DISPATCHED when at least one Load on this truck has dispatch_status IN {DISPATCHED, IN_TRANSIT, AT_MILL}; else AVAILABLE"
        constraints: "AVAILABLE | DISPATCHED | OUT_OF_SERVICE"

  - name: SafetyFinding
    parent: HaulContractor
    common_fields: false
    fields:
      - name: haul_contractor_id
        type: string
        source: input
        description: "FK -> HaulContractor.id; the audited carrier"
      - name: severity
        type: enum
        source: input
        description: "MINOR | MAJOR | CRITICAL; MAJOR warns the carrier, CRITICAL suspends it"
      - name: points
        type: integer
        source: input
        description: "Demerit points this finding contributes to contractor_compliance_score"
        constraints: "0 <= value <= 100"
      - name: occurred_on
        type: string
        source: input
        description: "Date (YYYY-MM-DD) the finding was observed; drives both scoring windows"
      - name: note
        type: string
        source: input
        default: null
        description: "Free-text auditor note"
        constraints: "0..500 chars, optional"

  - name: Tract
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Harvest unit name"
        constraints: "1..120 chars, required"
      - name: legal_description
        type: string
        source: input
        description: "Township/range/section legal description"
        constraints: "1..200 chars, required"
      - name: gross_acres
        type: number
        source: input
        description: "Acreage inside the unit boundary"
        constraints: "> 0"
      - name: planned_volume_tons
        type: number
        source: input
        description: "Total tons the operator expects to remove from the tract"
        constraints: "> 0"
      - name: access_class
        type: enum
        source: input
        description: "ALL_SEASON | SUMMER_ONLY | FROZEN_ONLY; gates activation and dispatch by calendar month"
      - name: status
        type: enum
        source: system
        default: PLANNED
        description: "PLANNED | MOBILIZING | ACTIVE | SUSPENDED | COMPLETED"
      - name: suspension_count
        type: integer
        source: system
        default: 0
        description: "Number of times this tract has entered SUSPENDED; incremented on every ACTIVE -> SUSPENDED transition"
      - name: move_in_cost_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of CrewAssignment.move_in_cost_cents over every CrewAssignment on this tract regardless of assignment status"
      - name: produced_tons
        type: number
        source: computed
        default: 0
        description: "Sum of DeliveryTicket.net_tons over CERTIFIED tickets whose Load has tract_id == this tract and dispatch_status == DELIVERED"

  - name: ProductionPlan
    parent: Tract
    common_fields: true
    fields:
      - name: tract_id
        type: string
        source: input
        description: "FK -> Tract.id; the tract this plan schedules"
      - name: target_tons_per_week
        type: number
        source: input
        description: "Weekly production target in tons"
        constraints: "> 0"
      - name: plan_horizon_weeks
        type: integer
        source: input
        description: "Number of weeks the plan covers"
        constraints: "1 <= value <= 52"
      - name: planned_volume_tons
        type: number
        source: computed
        description: "target_tons_per_week * plan_horizon_weeks, rounded half-up to 2 decimal places"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "DRAFT | APPROVED | SUPERSEDED"

  - name: Crew
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Crew name"
        constraints: "1..120 chars, required"
      - name: crew_type
        type: enum
        source: input
        description: "HAND_FALLING | MECHANIZED_GROUND | CABLE_YARDING; selects the equipment surcharge in calculations.move_in_cost"
      - name: equipment_pieces
        type: integer
        source: input
        description: "Number of yarders/processors/skidders that must be lowboyed to the tract"
        constraints: "1 <= value <= 24"
      - name: daily_rate_cents
        type: integer
        source: input
        description: "Crew day rate in whole cents"
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        default: IDLE
        description: "IDLE | MOBILIZING | ON_TRACT | STOOD_DOWN"

  - name: CrewAssignment
    parent: Tract
    common_fields: true
    fields:
      - name: tract_id
        type: string
        source: input
        description: "FK -> Tract.id; the tract the crew moves onto"
      - name: crew_id
        type: string
        source: input
        description: "FK -> Crew.id; the crew being allocated"
      - name: move_in_miles
        type: integer
        source: input
        description: "One-way lowboy distance from the crew's last landing to this tract"
        constraints: "0 <= value <= 600"
      - name: window_start
        type: string
        source: input
        description: "First date (inclusive, YYYY-MM-DD) of the crew's occupation window"
      - name: window_end
        type: string
        source: input
        description: "Exclusive end date (YYYY-MM-DD) of the crew's occupation window; must be strictly after window_start"
      - name: lowboy_trips
        type: integer
        source: computed
        description: "ceil(Crew.equipment_pieces / 2), pinned at assignment creation"
      - name: move_in_cost_cents
        type: integer
        source: computed
        description: "Result of calculations.move_in_cost, pinned at assignment creation and never recomputed"
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: "SCHEDULED | MOVED_IN | WORKING | STOOD_DOWN | RELEASED"

  - name: HaulRoute
    parent: null
    common_fields: true
    fields:
      - name: tract_id
        type: string
        source: input
        description: "FK -> Tract.id; the loading end of the route"
      - name: mill_id
        type: string
        source: input
        description: "FK -> Mill.id; the receiving end of the route"
      - name: distance_miles
        type: integer
        source: input
        description: "One-way haul distance in whole miles; drives both the rate band and the per-mile rehaul cost"
        constraints: "1 <= value <= 400"
      - name: legal_gross_weight_lbs
        type: integer
        source: input
        description: "Posted legal gross combination weight for this route outside frost season"
        constraints: "40000 <= value <= 120000"
      - name: permit_class_required
        type: enum
        source: input
        description: "STANDARD | DIVISIBLE_LOAD_PERMIT | LONGER_COMBINATION; the minimum truck permit class allowed on the route"
      - name: frost_law_start_on
        type: string
        source: input
        default: null
        description: "First date (inclusive, YYYY-MM-DD) of the seasonal frost-law posting; null when the route is never posted"
      - name: frost_law_end_on
        type: string
        source: input
        default: null
        description: "Last date (inclusive, YYYY-MM-DD) of the seasonal frost-law posting; null when the route is never posted"
      - name: status
        type: enum
        source: input
        default: OPEN
        description: "OPEN | POSTED_RESTRICTED | CLOSED; POSTED_RESTRICTED applies the frost-law weight reduction on every date"

  - name: ShutdownOrder
    parent: Tract
    common_fields: true
    fields:
      - name: tract_id
        type: string
        source: input
        description: "FK -> Tract.id; the suspended tract"
      - name: reason
        type: enum
        source: input
        description: "WET_WEATHER | FROST_LAW | FIRE_DANGER | SAFETY_STAND_DOWN"
      - name: soil_moisture_index
        type: integer
        source: input
        description: "Field moisture reading 0..100 taken when the order was declared"
        constraints: "0 <= value <= 100"
      - name: lift_soil_moisture_index
        type: integer
        source: system
        default: null
        description: "Moisture reading supplied on the lift call; null while the order is ACTIVE"
      - name: declared_at
        type: datetime
        source: system
        description: "Logical-clock instant the order was declared"
      - name: lifted_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant the order was lifted; null while ACTIVE"
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: "ACTIVE | LIFTED"

  - name: Load
    parent: null
    common_fields: true
    fields:
      - name: tract_id
        type: string
        source: input
        description: "FK -> Tract.id; the tract the wood came off"
      - name: mill_contract_id
        type: string
        source: input
        description: "FK -> MillContract.id; the quota this load draws against"
      - name: haul_route_id
        type: string
        source: input
        description: "FK -> HaulRoute.id; the permitted route from tract to mill"
      - name: truck_id
        type: string
        source: input
        description: "FK -> Truck.id; the unit hauling the load"
      - name: haul_contractor_id
        type: string
        source: computed
        description: "FK -> HaulContractor.id; copied from Truck.haul_contractor_id at dispatch and never changed"
      - name: rehaul_of_load_id
        type: string
        source: system
        default: null
        description: "FK -> Load.id; set only on a system-created rehaul load, pointing at the load the mill rejected"
      - name: declared_species
        type: enum
        source: input
        description: "DOUGLAS_FIR | WESTERN_HEMLOCK | RED_ALDER | PONDEROSA_PINE as sorted in the woods"
      - name: declared_grade
        type: enum
        source: input
        description: "PEELER | SAWLOG_1 | SAWLOG_2 | PULP as sorted in the woods"
      - name: estimated_net_tons
        type: number
        source: input
        description: "Woods estimate of payable tons; this is the amount reserved against the mill quota"
        constraints: "> 0, at most 2 decimal places"
      - name: scheduled_depart_at
        type: datetime
        source: input
        description: "Planned landing departure instant; start of the truck occupation interval"
      - name: scheduled_arrive_at
        type: datetime
        source: input
        description: "Planned mill arrival instant; end of the truck occupation interval, must be strictly after scheduled_depart_at"
      - name: dispatch_status
        type: enum
        source: system
        default: DISPATCHED
        description: "DISPATCHED | IN_TRANSIT | AT_MILL | DELIVERED | REJECTED | CANCELLED — first of the two independent status axes on this row"
      - name: settlement_status
        type: enum
        source: system
        default: UNSETTLED
        description: "UNSETTLED | ACCRUED | STATEMENTED | PAID — second, independent status axis advanced only by settlement events"
      - name: rehaul_status
        type: enum
        source: system
        default: NONE
        description: "NONE | REHAULED | NO_ALTERNATE; set when a mill rejection runs the rehaul selector"
      - name: departed_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant recorded by the depart call"
      - name: arrived_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant recorded by the arrive call; the demurrage clock starts here"
      - name: rejected_on
        type: string
        source: system
        default: null
        description: "Date (YYYY-MM-DD) of the logical clock when the mill rejected the load"
      - name: settlement_event_on
        type: string
        source: computed
        default: null
        description: "Date (YYYY-MM-DD) used to place this load in a settlement period: the certification date for DELIVERED loads, rejected_on for REJECTED loads with rehaul_status == NO_ALTERNATE, and null otherwise"
      - name: wait_minutes
        type: integer
        source: computed
        default: null
        description: "floor((certified_at - arrived_at) in seconds / 60); null until the load's ticket is certified"
      - name: rate_cents_per_ton_mile
        type: integer
        source: computed
        default: null
        description: "Rate band selected from HaulRoute.distance_miles by calculations.load_haul_pay; pinned at dispatch and reused by the final variant"
      - name: provisional_haul_pay_cents
        type: integer
        source: computed
        description: "calculations.load_haul_pay under the provisional_at_dispatch variant; written once at dispatch and never revised"
      - name: line_haul_cents
        type: integer
        source: computed
        default: null
        description: "Final-variant line-haul component; null until certification"
      - name: fuel_surcharge_cents
        type: integer
        source: computed
        default: null
        description: "Final-variant fuel surcharge, already rounded to whole cents at the load level; null until certification"
      - name: demurrage_cents
        type: integer
        source: computed
        default: null
        description: "Final-variant demurrage component; null until certification"
      - name: incentive_cents
        type: integer
        source: computed
        default: null
        description: "Final-variant volume incentive component; null until certification"
      - name: regrade_adjustment_cents
        type: integer
        source: computed
        default: null
        description: "Final-variant regrade penalty subtracted when the scaled grade differs from declared_grade; null until certification"
      - name: final_haul_pay_cents
        type: integer
        source: computed
        default: null
        description: "calculations.load_haul_pay under the final_at_certification variant; null until certification"

  - name: DeliveryTicket
    parent: Load
    common_fields: true
    fields:
      - name: load_id
        type: string
        source: input
        description: "FK -> Load.id; the load being scaled"
      - name: mill_id
        type: string
        source: computed
        description: "FK -> Mill.id; copied from the load's MillContract.mill_id when the ticket is written"
      - name: gross_weight_lbs
        type: integer
        source: input
        description: "Loaded gross combination weight read off the mill scale"
        constraints: "0 <= value <= 200000"
      - name: tare_weight_lbs
        type: integer
        source: computed
        description: "Copied from Truck.tare_weight_lbs at ticket creation; client input for this field is ignored"
      - name: net_weight_lbs
        type: integer
        source: computed
        description: "gross_weight_lbs - tare_weight_lbs"
      - name: defect_deduction_pct
        type: number
        source: input
        description: "Scaler's defect/cull deduction as a fraction of net weight"
        constraints: "0 <= value <= 0.50"
      - name: defect_deducted_lbs
        type: integer
        source: computed
        description: "round_half_up(net_weight_lbs * defect_deduction_pct) in whole pounds"
      - name: payable_lbs
        type: integer
        source: computed
        description: "net_weight_lbs - defect_deducted_lbs"
      - name: net_tons
        type: number
        source: computed
        description: "round_half_up(payable_lbs / 2000, 2) — the scaled tonnage every downstream money figure uses"
      - name: max_allowed_gross_lbs
        type: integer
        source: computed
        description: "Result of calculations.effective_max_gross_weight evaluated when the ticket is written"
      - name: scaled_species
        type: enum
        source: input
        description: "DOUGLAS_FIR | WESTERN_HEMLOCK | RED_ALDER | PONDEROSA_PINE as determined at the mill"
      - name: scaled_grade
        type: enum
        source: input
        description: "PEELER | SAWLOG_1 | SAWLOG_2 | PULP as determined at the mill"
      - name: ticket_status
        type: enum
        source: system
        default: DRAFT
        description: "DRAFT | CERTIFIED | REJECTED"
      - name: certified_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant the scaler certified the ticket"
      - name: certified_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the MillScaler that certified the ticket (equals the Mill id)"
      - name: reject_reason
        type: enum
        source: system
        default: null
        description: "SPECIES_MISMATCH | EXCESS_DEFECT | CONTAMINATION | OVERWEIGHT; set only on rejection"

  - name: SettlementStatement
    parent: HaulContractor
    common_fields: true
    fields:
      - name: haul_contractor_id
        type: string
        source: input
        description: "FK -> HaulContractor.id; the carrier being paid"
      - name: period_start
        type: string
        source: input
        description: "First date (inclusive, YYYY-MM-DD) of the settlement period"
      - name: period_end
        type: string
        source: input
        description: "Last date (inclusive, YYYY-MM-DD) of the settlement period; must be >= period_start"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "DRAFT | SUBMITTED | APPROVED | DISPUTED | REVISED | PAID | VOID"
      - name: compiled_by_user_id
        type: string
        source: system
        description: "X-User-ID of the SettlementAccountant that compiled the statement"
      - name: approved_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the SettlementAccountant that approved it; must differ from compiled_by_user_id"
      - name: compliance_score_at_compile
        type: number
        source: computed
        description: "calculations.contractor_compliance_score under the period_to_date variant, frozen at compile/recompile time"
      - name: holdback_pct
        type: number
        source: computed
        description: "Insurance holdback fraction selected from compliance_score_at_compile"
      - name: lines
        type: array
        source: computed
        description: "Ordered settlement lines, each { line_type, load_id, tons, distance_miles, amount_cents }, in the order defined by calculations.settlement_statement_rollup"
      - name: gross_pay_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of lines[].amount_cents over line_type IN {HAUL, FUEL_SURCHARGE, DEMURRAGE}"
      - name: reject_deduction_cents
        type: integer
        source: computed
        default: 0
        description: "Absolute value of the sum of lines[].amount_cents over line_type == REJECT_DEDUCTION"
      - name: holdback_cents
        type: integer
        source: computed
        default: 0
        description: "Absolute value of the single INSURANCE_HOLDBACK line amount"
      - name: deduction_cents
        type: integer
        source: computed
        default: 0
        description: "reject_deduction_cents + holdback_cents"
      - name: net_pay_cents
        type: integer
        source: computed
        default: 0
        description: "gross_pay_cents - deduction_cents"
      - name: dispute_reason
        type: string
        source: system
        default: null
        description: "Free text captured by the dispute call"
      - name: payment_reference
        type: string
        source: system
        default: null
        description: "Payment reference captured by the pay call"

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:

  # ---- Tract: cyclic ACTIVE <-> SUSPENDED revision loop -------------------
  - entity: Tract
    initial_state: PLANNED
    terminal_states: [COMPLETED]
    transitions:
      - from: PLANNED
        to: MOBILIZING
        trigger: "POST /tracts/{id}/mobilize"
        actor: OperationsManager
        preconditions:
          - "Tract.status == PLANNED"
          - "At least one ProductionPlan with tract_id == this tract has status == APPROVED"
          - "At least one CrewAssignment with tract_id == this tract has status == SCHEDULED"
        side_effects:
          - "Every CrewAssignment on this tract with status == SCHEDULED moves to MOVED_IN"
          - "Because a CrewAssignment moved to MOVED_IN, its Crew moves from IDLE to MOBILIZING"
          - "Tract.updated_at refreshed and Tract.version incremented by 1"

      - from: MOBILIZING
        to: ACTIVE
        trigger: "POST /tracts/{id}/activate"
        actor: OperationsManager
        preconditions:
          - "Tract.status == MOBILIZING"
          - "At least one CrewAssignment with tract_id == this tract has status == MOVED_IN"
          - "No ShutdownOrder with tract_id == this tract has status == ACTIVE"
          - "Seasonal access gate passes: Tract.access_class == ALL_SEASON, or access_class == SUMMER_ONLY and the logical clock month is in {5,6,7,8,9}, or access_class == FROZEN_ONLY and the logical clock month is in {12,1,2}"
        side_effects:
          - "Every CrewAssignment on this tract with status == MOVED_IN moves to WORKING"
          - "Because a CrewAssignment moved to WORKING, its Crew moves from MOBILIZING to ON_TRACT"
          - "Tract.updated_at refreshed and Tract.version incremented by 1"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /tracts/{id}/shutdown-orders"
        actor: OperationsManager
        preconditions:
          - "Tract.status == ACTIVE"
          - "No ShutdownOrder with tract_id == this tract has status == ACTIVE"
          - "If reason == WET_WEATHER then soil_moisture_index >= 72"
        side_effects:
          - "Hop 1: a ShutdownOrder row is created with status ACTIVE and declared_at == the logical clock; Tract.status becomes SUSPENDED and Tract.suspension_count is incremented by 1"
          - "Hop 2a: because the Tract became SUSPENDED, every CrewAssignment on it with status == WORKING moves to STOOD_DOWN"
          - "Hop 3a: because a CrewAssignment moved to STOOD_DOWN, its Crew moves from ON_TRACT to STOOD_DOWN"
          - "Hop 2b: because the Tract became SUSPENDED, every Load with tract_id == this tract and dispatch_status IN {DISPATCHED, IN_TRANSIT} moves to CANCELLED (loads already AT_MILL are left alone because the wood is already on the mill scale)"
          - "Hop 3b: because a Load moved to CANCELLED, the MillContract it drew against loses that load's estimated_net_tons from reserved_tons and available_tons is recomputed"
          - "Hop 4b: because that MillContract.available_tons rose above 0, a MillContract whose status was FILLED returns to OPEN"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /shutdown-orders/{id}/lift"
        actor: OperationsManager
        preconditions:
          - "ShutdownOrder.status == ACTIVE"
          - "Tract.status == SUSPENDED"
          - "If ShutdownOrder.reason == WET_WEATHER then the lift call's soil_moisture_index < 72"
        side_effects:
          - "ShutdownOrder.status becomes LIFTED, lifted_at == the logical clock, lift_soil_moisture_index stores the supplied reading"
          - "Because the order was lifted and no other ACTIVE ShutdownOrder remains on the tract, Tract.status returns to ACTIVE"
          - "Because the Tract returned to ACTIVE, every CrewAssignment on it with status == STOOD_DOWN returns to WORKING"
          - "Because a CrewAssignment returned to WORKING, its Crew returns from STOOD_DOWN to ON_TRACT"
        note: "This is the revision loop: ACTIVE -> SUSPENDED -> ACTIVE may repeat, and suspension_count records how many laps were run."

      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /tracts/{id}/complete"
        actor: OperationsManager
        preconditions:
          - "Tract.status == ACTIVE"
          - "No Load with tract_id == this tract has dispatch_status IN {DISPATCHED, IN_TRANSIT, AT_MILL}"
        side_effects:
          - "Every CrewAssignment on this tract with status IN {MOVED_IN, WORKING, STOOD_DOWN} moves to RELEASED"
          - "Because a CrewAssignment moved to RELEASED, its Crew returns to IDLE"
          - "Every ProductionPlan on this tract with status == APPROVED moves to SUPERSEDED"

  # ---- Load: two independent status axes on one row -----------------------
  - entity: Load
    initial_state: DISPATCHED
    terminal_states: [DELIVERED, REJECTED, CANCELLED]
    transitions:
      - from: DISPATCHED
        to: IN_TRANSIT
        trigger: "POST /loads/{id}/depart"
        actor: HaulContractor
        preconditions:
          - "Load.dispatch_status == DISPATCHED"
          - "X-User-ID equals Load.haul_contractor_id"
          - "Truck.status != OUT_OF_SERVICE"
        side_effects:
          - "Load.departed_at is stamped with the logical clock"

      - from: IN_TRANSIT
        to: AT_MILL
        trigger: "POST /loads/{id}/arrive"
        actor: HaulContractor
        preconditions:
          - "Load.dispatch_status == IN_TRANSIT"
          - "X-User-ID equals Load.haul_contractor_id"
        side_effects:
          - "Load.arrived_at is stamped with the logical clock; the demurrage clock starts running from this instant"

      - from: AT_MILL
        to: DELIVERED
        trigger: "POST /delivery-tickets/{id}/certify"
        actor: MillScaler
        preconditions:
          - "DeliveryTicket.ticket_status == DRAFT and its Load.dispatch_status == AT_MILL"
          - "X-User-ID equals the Mill.id of the load's MillContract"
          - "MillContract.delivered_tons after adding this ticket's net_tons is <= MillContract.quota_tons * (1 + MillContract.overrun_tolerance_pct)"
        side_effects:
          - "Hop 1: DeliveryTicket.ticket_status becomes CERTIFIED, certified_at is stamped with the logical clock and certified_by_user_id records the scaler"
          - "Hop 2: because the ticket was certified, Load.dispatch_status becomes DELIVERED, Load.wait_minutes, rate_cents_per_ton_mile, line_haul_cents, fuel_surcharge_cents, demurrage_cents, incentive_cents, regrade_adjustment_cents and final_haul_pay_cents are written from calculations.load_haul_pay under the final_at_certification variant, Load.settlement_event_on is set to the certification date, and Load.settlement_status moves UNSETTLED -> ACCRUED on the independent settlement axis"
          - "Hop 3: because the Load became DELIVERED, its MillContract loses estimated_net_tons from reserved_tons, gains the ticket's net_tons in delivered_tons, and recomputes available_tons; Tract.produced_tons is recomputed the same way"
          - "Hop 4: because that MillContract.available_tons fell to 0 or below, MillContract.status moves OPEN -> FILLED"

      - from: AT_MILL
        to: REJECTED
        trigger: "POST /delivery-tickets/{id}/reject"
        actor: MillScaler
        preconditions:
          - "DeliveryTicket.ticket_status == DRAFT and its Load.dispatch_status == AT_MILL"
          - "X-User-ID equals the Mill.id of the load's MillContract"
        side_effects:
          - "Hop 1: DeliveryTicket.ticket_status becomes REJECTED and reject_reason stores the supplied reason"
          - "Hop 2: because the ticket was rejected, Load.dispatch_status becomes REJECTED and Load.rejected_on is set to the logical clock date"
          - "Hop 3: because the Load became REJECTED, its MillContract loses estimated_net_tons from reserved_tons and recomputes available_tons; a FILLED contract whose available_tons rose above 0 returns to OPEN"
          - "Hop 4: because the Load became REJECTED, the owning HaulContractor.compliance_score is recomputed (the rejection adds REJECT_PENALTY_POINTS to both scoring windows)"
          - "Hop 5: calculations.rehaul_alternate_selection runs. When it returns a MillContract, the system creates a new Load with rehaul_of_load_id == this load's id and sets this load's rehaul_status to REHAULED. When the candidate set is empty, this load's rehaul_status becomes NO_ALTERNATE, Load.settlement_event_on is set to rejected_on and Load.settlement_status moves UNSETTLED -> ACCRUED so a REJECT_DEDUCTION line can accrue"

      - from: DISPATCHED
        to: CANCELLED
        trigger: "POST /loads/{id}/cancel"
        actor: OperationsManager
        preconditions:
          - "Load.dispatch_status IN {DISPATCHED, IN_TRANSIT}"
        side_effects:
          - "The load's MillContract loses estimated_net_tons from reserved_tons and recomputes available_tons"
          - "Because that MillContract.available_tons rose above 0, a FILLED contract returns to OPEN"
          - "Load.settlement_status stays UNSETTLED forever; a CANCELLED load never enters a settlement statement"

      - from: IN_TRANSIT
        to: CANCELLED
        trigger: "POST /loads/{id}/cancel"
        actor: OperationsManager
        preconditions:
          - "Load.dispatch_status IN {DISPATCHED, IN_TRANSIT}"
        side_effects:
          - "Identical to the DISPATCHED -> CANCELLED transition: reserved_tons released, available_tons recomputed, FILLED contract may return to OPEN"

  # ---- Load settlement axis: advances independently of dispatch_status ----
  - entity: Load
    initial_state: UNSETTLED
    terminal_states: [PAID]
    transitions:
      - from: UNSETTLED
        to: ACCRUED
        trigger: "POST /delivery-tickets/{id}/certify (DELIVERED path) or POST /delivery-tickets/{id}/reject with an empty rehaul candidate set"
        actor: MillScaler
        preconditions:
          - "Load.dispatch_status becomes DELIVERED, or becomes REJECTED with rehaul_status == NO_ALTERNATE"
        side_effects:
          - "Load.settlement_event_on is populated so the load becomes visible to settlement compilation"
        note: "This axis is independent of dispatch_status: a load may sit at DELIVERED/ACCRUED, DELIVERED/STATEMENTED or DELIVERED/PAID, and a REJECTED load may be ACCRUED while another REJECTED load stays UNSETTLED because it was rehauled."

      - from: ACCRUED
        to: STATEMENTED
        trigger: "POST /settlement-statements/{id}/submit"
        actor: SettlementAccountant
        preconditions:
          - "The load appears in the submitted statement's lines"
        side_effects:
          - "Load.settlement_status becomes STATEMENTED; dispatch_status is untouched"

      - from: STATEMENTED
        to: ACCRUED
        trigger: "POST /settlement-statements/{id}/revise"
        actor: SettlementAccountant
        preconditions:
          - "The statement is in DISPUTED and the load is attached to it"
        side_effects:
          - "Load.settlement_status returns to ACCRUED so the load can be recompiled onto a corrected statement; no money field on the Load is altered"

      - from: STATEMENTED
        to: PAID
        trigger: "POST /settlement-statements/{id}/pay"
        actor: SettlementAccountant
        preconditions:
          - "The statement is in APPROVED and the load is attached to it"
        side_effects:
          - "Load.settlement_status becomes PAID"

  # ---- MillContract: compound status derived from its child Loads ---------
  - entity: MillContract
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: FILLED
        trigger: "system event: available_tons recomputed to a value <= 0 after a dispatch or a certification"
        actor: system
        preconditions:
          - "MillContract.status == OPEN"
          - "quota_tons - reserved_tons - delivered_tons <= 0"
        side_effects:
          - "MillContract.status becomes FILLED; further dispatch against this contract is refused with ERR_INVALID_MILL_CONTRACT_STATE"

      - from: FILLED
        to: OPEN
        trigger: "system event: available_tons recomputed to a value > 0 after a cancel, a rejection or a shutdown cascade"
        actor: system
        preconditions:
          - "MillContract.status == FILLED"
          - "quota_tons - reserved_tons - delivered_tons > 0"
        side_effects:
          - "MillContract.status returns to OPEN and the freed tons become dispatchable again"

      - from: OPEN
        to: SUSPENDED
        trigger: "PATCH /mill-contracts/{id} with status SUSPENDED"
        actor: PlatformAdmin
        preconditions:
          - "MillContract.status IN {OPEN, FILLED}"
        side_effects:
          - "Dispatch against the contract is refused while SUSPENDED; existing loads are untouched"

      - from: SUSPENDED
        to: OPEN
        trigger: "PATCH /mill-contracts/{id} with status OPEN"
        actor: PlatformAdmin
        preconditions:
          - "MillContract.status == SUSPENDED"
        side_effects:
          - "available_tons is recomputed on resume; if it is <= 0 the contract immediately auto-transitions to FILLED"

      - from: OPEN
        to: CLOSED
        trigger: "PATCH /mill-contracts/{id} with status CLOSED"
        actor: PlatformAdmin
        preconditions:
          - "MillContract.status IN {OPEN, FILLED, SUSPENDED}"
        side_effects:
          - "The contract leaves the rehaul selector candidate set permanently"

  # ---- HaulContractor: branching compliance machine with a reinstate loop -
  - entity: HaulContractor
    initial_state: COMPLIANT
    terminal_states: []
    transitions:
      - from: COMPLIANT
        to: WARNED
        trigger: "POST /haul-contractors/{id}/safety-findings with severity MAJOR"
        actor: SafetyOfficer
        preconditions:
          - "HaulContractor.compliance_status == COMPLIANT"
        side_effects:
          - "compliance_score recomputed under the rolling_180_day variant; dispatch remains permitted while the score is >= 70"

      - from: COMPLIANT
        to: SUSPENDED
        trigger: "POST /haul-contractors/{id}/safety-findings with severity CRITICAL, or POST /haul-contractors/{id}/suspend, or the insurance-revocation cascade"
        actor: SafetyOfficer
        preconditions:
          - "HaulContractor.compliance_status IN {COMPLIANT, WARNED}"
        side_effects:
          - "Hop 1: compliance_status becomes SUSPENDED and compliance_score is recomputed"
          - "Hop 2: because the carrier became SUSPENDED, every Truck it owns derives status OUT_OF_SERVICE"
          - "Hop 3: because a Truck became OUT_OF_SERVICE, every Load on that truck with dispatch_status IN {DISPATCHED, IN_TRANSIT, AT_MILL} moves to CANCELLED"
          - "Hop 4: because a Load moved to CANCELLED, its MillContract loses estimated_net_tons from reserved_tons and recomputes available_tons; a FILLED contract returns to OPEN"

      - from: WARNED
        to: SUSPENDED
        trigger: "POST /haul-contractors/{id}/safety-findings with severity CRITICAL, or POST /haul-contractors/{id}/suspend, or the insurance-revocation cascade"
        actor: SafetyOfficer
        preconditions:
          - "HaulContractor.compliance_status IN {COMPLIANT, WARNED}"
        side_effects:
          - "Identical four-hop cascade as the COMPLIANT -> SUSPENDED transition"

      - from: SUSPENDED
        to: COMPLIANT
        trigger: "POST /haul-contractors/{id}/reinstate"
        actor: SafetyOfficer
        preconditions:
          - "HaulContractor.compliance_status == SUSPENDED"
          - "Every one of GENERAL_LIABILITY, AUTO_LIABILITY and WORKERS_COMP has at least one InsuranceCertificate whose derived status == ACTIVE"
        side_effects:
          - "compliance_status returns to COMPLIANT and compliance_score is recomputed; every Truck it owns derives status AVAILABLE again"
        note: "Reinstatement closes the compliance loop; loads cancelled by the suspension cascade are not resurrected."

  # ---- CrewAssignment: stand-down loop inside the tract lifecycle ---------
  - entity: CrewAssignment
    initial_state: SCHEDULED
    terminal_states: [RELEASED]
    transitions:
      - from: SCHEDULED
        to: MOVED_IN
        trigger: "POST /tracts/{id}/mobilize"
        actor: OperationsManager
        preconditions: ["Tract.status == PLANNED at the moment of the call"]
        side_effects: ["Crew.status moves IDLE -> MOBILIZING"]
      - from: MOVED_IN
        to: WORKING
        trigger: "POST /tracts/{id}/activate"
        actor: OperationsManager
        preconditions: ["Tract.status == MOBILIZING at the moment of the call"]
        side_effects: ["Crew.status moves MOBILIZING -> ON_TRACT"]
      - from: WORKING
        to: STOOD_DOWN
        trigger: "POST /tracts/{id}/shutdown-orders"
        actor: OperationsManager
        preconditions: ["Tract.status moved ACTIVE -> SUSPENDED on this call"]
        side_effects: ["Crew.status moves ON_TRACT -> STOOD_DOWN"]
      - from: STOOD_DOWN
        to: WORKING
        trigger: "POST /shutdown-orders/{id}/lift"
        actor: OperationsManager
        preconditions: ["Tract.status moved SUSPENDED -> ACTIVE on this call"]
        side_effects: ["Crew.status moves STOOD_DOWN -> ON_TRACT"]
      - from: WORKING
        to: RELEASED
        trigger: "POST /tracts/{id}/complete"
        actor: OperationsManager
        preconditions: ["Tract.status moved ACTIVE -> COMPLETED on this call"]
        side_effects: ["Crew.status returns to IDLE"]
      - from: MOVED_IN
        to: RELEASED
        trigger: "POST /tracts/{id}/complete"
        actor: OperationsManager
        preconditions: ["Tract.status moved ACTIVE -> COMPLETED on this call"]
        side_effects: ["Crew.status returns to IDLE"]
      - from: STOOD_DOWN
        to: RELEASED
        trigger: "POST /tracts/{id}/complete"
        actor: OperationsManager
        preconditions: ["Tract.status moved ACTIVE -> COMPLETED on this call"]
        side_effects: ["Crew.status returns to IDLE"]

  # ---- DeliveryTicket -----------------------------------------------------
  - entity: DeliveryTicket
    initial_state: DRAFT
    terminal_states: [CERTIFIED, REJECTED]
    transitions:
      - from: DRAFT
        to: CERTIFIED
        trigger: "POST /delivery-tickets/{id}/certify"
        actor: MillScaler
        preconditions:
          - "DeliveryTicket.ticket_status == DRAFT"
          - "Load.dispatch_status == AT_MILL"
          - "X-User-ID equals DeliveryTicket.mill_id"
          - "Overrun tolerance on the load's MillContract is not breached"
        side_effects:
          - "Drives the four-hop certification cascade described on the Load AT_MILL -> DELIVERED transition"
      - from: DRAFT
        to: REJECTED
        trigger: "POST /delivery-tickets/{id}/reject"
        actor: MillScaler
        preconditions:
          - "DeliveryTicket.ticket_status == DRAFT"
          - "Load.dispatch_status == AT_MILL"
          - "X-User-ID equals DeliveryTicket.mill_id"
        side_effects:
          - "Drives the five-hop rejection cascade described on the Load AT_MILL -> REJECTED transition"

  # ---- SettlementStatement: dispute/revise negotiation loop ---------------
  - entity: SettlementStatement
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /settlement-statements/{id}/submit"
        actor: SettlementAccountant
        preconditions:
          - "SettlementStatement.status IN {DRAFT, REVISED}"
          - "The statement has at least one line (lines is not empty)"
        side_effects:
          - "Every Load referenced by a HAUL, FUEL_SURCHARGE, DEMURRAGE or REJECT_DEDUCTION line moves settlement_status ACCRUED -> STATEMENTED"

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /settlement-statements/{id}/approve"
        actor: SettlementAccountant
        preconditions:
          - "SettlementStatement.status == SUBMITTED"
          - "X-User-ID != SettlementStatement.compiled_by_user_id (segregation of duties)"
        side_effects:
          - "approved_by_user_id records the approving accountant"

      - from: APPROVED
        to: PAID
        trigger: "POST /settlement-statements/{id}/pay"
        actor: SettlementAccountant
        preconditions:
          - "SettlementStatement.status == APPROVED"
        side_effects:
          - "payment_reference is stored; every attached Load moves settlement_status STATEMENTED -> PAID"
          - "HaulContractor.lifetime_settled_cents increases by this statement's net_pay_cents"

      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /settlement-statements/{id}/dispute"
        actor: HaulContractor
        preconditions:
          - "SettlementStatement.status IN {SUBMITTED, APPROVED}"
          - "When the caller is a HaulContractor, X-User-ID equals SettlementStatement.haul_contractor_id"
        side_effects:
          - "dispute_reason is stored; approved_by_user_id is cleared back to null; attached Loads keep settlement_status STATEMENTED until the statement is revised"

      - from: APPROVED
        to: DISPUTED
        trigger: "POST /settlement-statements/{id}/dispute"
        actor: HaulContractor
        preconditions:
          - "SettlementStatement.status IN {SUBMITTED, APPROVED}"
          - "When the caller is a HaulContractor, X-User-ID equals SettlementStatement.haul_contractor_id"
        side_effects:
          - "Identical to the SUBMITTED -> DISPUTED transition"

      - from: DISPUTED
        to: REVISED
        trigger: "POST /settlement-statements/{id}/revise"
        actor: SettlementAccountant
        preconditions:
          - "SettlementStatement.status == DISPUTED"
        side_effects:
          - "Every attached Load returns settlement_status STATEMENTED -> ACCRUED"
          - "lines, compliance_score_at_compile, holdback_pct, gross_pay_cents, reject_deduction_cents, holdback_cents, deduction_cents and net_pay_cents are recompiled from scratch by calculations.settlement_statement_rollup over the same eligibility filter"

      - from: REVISED
        to: SUBMITTED
        trigger: "POST /settlement-statements/{id}/submit"
        actor: SettlementAccountant
        preconditions:
          - "SettlementStatement.status IN {DRAFT, REVISED}"
          - "The statement has at least one line"
        side_effects:
          - "Attached Loads move ACCRUED -> STATEMENTED again; this closes the dispute/revise negotiation loop"

      - from: DRAFT
        to: VOID
        trigger: "system event: POST /settlement-statements creates a statement whose period overlaps this DRAFT statement for the same contractor"
        actor: system
        preconditions:
          - "SettlementStatement.status == DRAFT"
        side_effects:
          - "The superseded statement's lines are cleared and all money fields reset to 0; VOID is terminal"

# =============================================================================
# Concurrency Rules (Section 1.2.1) — OCC on a parent entity's version only
# =============================================================================
concurrency_rules:
  - rule_id: plan-create-stale-tract
    parent_entity: Tract
    write_endpoint: "POST /tracts/{id}/production-plans"
    occ_field: "expected_tract_version"
    description: |
      Creating a ProductionPlan against a Tract whose version has advanced since
      the client last observed it is rejected. Creating a plan legitimately
      supersedes any prior DRAFT or APPROVED plan on the tract, so a writer whose
      view of the tract is stale would silently overwrite a supersede decision it
      never saw; the OCC check turns that into a deterministic 412.
    error_id: ERR_STALE_TRACT_VERSION
    http_status: 412

  - rule_id: statement-compile-stale-contractor
    parent_entity: HaulContractor
    write_endpoint: "POST /settlement-statements"
    occ_field: "expected_haul_contractor_version"
    description: |
      Compiling a SettlementStatement for a HaulContractor whose version has
      advanced since the client last observed it is rejected. A new statement
      legitimately voids a prior DRAFT statement covering an overlapping period,
      and every compliance event on the carrier also advances its version, so a
      stale view can void a statement the writer never inspected.
    error_id: ERR_STALE_HAUL_CONTRACTOR_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
# Global conventions used by every formula below:
#   round_half_up(x)      -> nearest integer, .5 away from zero
#   round_half_up(x, 2)   -> nearest 1/100, .5 away from zero
#   floor(x), ceil(x)     -> usual integer floor / ceiling
#   clock_date            -> the calendar date (UTC) of the logical clock, whose
#                            server startup default is 2026-08-01T00:00:00Z
#   No selector, ranking, tie-break, allocation order, cascade order or replay
#   order anywhere in this scaffold may read an `id` field. Where a precise
#   common-field fallback is needed the rule says `created_at ASC`.
# =============================================================================
calculations:

  - name: move_in_cost
    trigger: "POST /tracts/{id}/crew-assignments — evaluated once, at CrewAssignment creation, and never recomputed"
    algorithm: tiered_pricing
    formula: |
      lowboy_trips   = ceil(Crew.equipment_pieces / PIECES_PER_LOWBOY)
      tiered_mileage = MILE_RATE_T1 * min(move_in_miles, 25)
                     + MILE_RATE_T2 * max(0, min(move_in_miles, 75) - 25)
                     + MILE_RATE_T3 * max(0, move_in_miles - 75)
      base_cents     = lowboy_trips * tiered_mileage
      access_mult    = ACCESS_MULTIPLIER[Tract.access_class]
      scaled_cents   = round_half_up(base_cents * access_mult)
      subtotal_cents = scaled_cents + CREW_TYPE_SURCHARGE_CENTS[Crew.crew_type]
      move_in_cost_cents = min(max(subtotal_cents, MIN_MOVE_IN_CENTS), MAX_MOVE_IN_CENTS)
      # Evaluation order is pinned: the tiered mileage waterfall is summed first,
      # multiplied by the trip count, then by the access multiplier and rounded
      # to whole cents BEFORE the flat crew-type surcharge is added. The floor is
      # applied before the cap, so a subtotal below MIN and a cap below MIN can
      # never both bind.
    input_set: "The Crew named by crew_id (equipment_pieces, crew_type), the Tract named in the path (access_class) and the request's move_in_miles. No other CrewAssignment influences the result."
    constants:
      PIECES_PER_LOWBOY: 2
      MILE_RATE_T1: 900
      MILE_RATE_T2: 725
      MILE_RATE_T3: 610
      ACCESS_MULTIPLIER: { ALL_SEASON: 1.00, SUMMER_ONLY: 1.15, FROZEN_ONLY: 1.35 }
      CREW_TYPE_SURCHARGE_CENTS: { HAND_FALLING: 0, MECHANIZED_GROUND: 120000, CABLE_YARDING: 275000 }
      MIN_MOVE_IN_CENTS: 185000
      MAX_MOVE_IN_CENTS: 1250000
    precision: "whole cents, round_half_up at the single rounding point shown above"
    variants: []

  - name: effective_max_gross_weight
    trigger: "POST /loads/{id}/delivery-tickets — evaluated when the scale ticket is written, and stored on DeliveryTicket.max_allowed_gross_lbs"
    algorithm: threshold
    formula: |
      frost_active = (HaulRoute.status == 'POSTED_RESTRICTED')
                     OR (HaulRoute.frost_law_start_on IS NOT NULL
                         AND HaulRoute.frost_law_start_on <= clock_date
                         AND clock_date <= HaulRoute.frost_law_end_on)
      effective_legal_lbs = floor(HaulRoute.legal_gross_weight_lbs * (1 - FROST_LAW_REDUCTION_PCT))
                            if frost_active else HaulRoute.legal_gross_weight_lbs
      permit_uplift_lbs   = PERMIT_UPLIFT_LBS
                            if (Truck.permit_class == 'LONGER_COMBINATION'
                                AND HaulRoute.permit_class_required == 'LONGER_COMBINATION')
                            else 0
      max_allowed_gross_lbs = min(effective_legal_lbs + permit_uplift_lbs,
                                  AXLE_CAP_LBS[Truck.axle_config])
      # Rejection is strict: gross_weight_lbs > max_allowed_gross_lbs fails with
      # ERR_OVERWEIGHT_LOAD; gross_weight_lbs == max_allowed_gross_lbs passes.
    input_set: "The HaulRoute named on the load (status, legal_gross_weight_lbs, frost-law window, permit_class_required), the Truck named on the load (permit_class, axle_config) and the logical clock date. The frost-law window is a CLOSED interval on both endpoints."
    constants:
      FROST_LAW_REDUCTION_PCT: 0.20
      PERMIT_UPLIFT_LBS: 10000
      AXLE_CAP_LBS: { FIVE_AXLE: 80000, SIX_AXLE: 91000, SEVEN_AXLE: 105500 }
    precision: "whole pounds; the frost reduction floors, it does not round"
    variants: []

  - name: ticket_net_tons
    trigger: "POST /loads/{id}/delivery-tickets — evaluated once when the ticket row is created"
    algorithm: aggregation
    formula: |
      net_weight_lbs      = gross_weight_lbs - Truck.tare_weight_lbs
      defect_deducted_lbs = round_half_up(net_weight_lbs * defect_deduction_pct)
      payable_lbs         = net_weight_lbs - defect_deducted_lbs
      net_tons            = round_half_up(payable_lbs / 2000, 2)
      # Rounding order is pinned: the defect deduction is rounded to whole POUNDS
      # first and subtracted, and only the resulting integer payable_lbs is
      # converted to tons and rounded to 2 decimals. Converting to tons first and
      # then deducting is forbidden.
    input_set: "The request's gross_weight_lbs and defect_deduction_pct, plus Truck.tare_weight_lbs copied from the load's truck. Client-supplied tare is ignored."
    constants:
      LBS_PER_TON: 2000
    precision: "defect in whole pounds (round_half_up), net_tons to 2 decimal places (round_half_up)"
    variants: []

  - name: load_haul_pay
    trigger: "POST /loads (provisional_at_dispatch variant, writing Load.provisional_haul_pay_cents) and POST /delivery-tickets/{id}/certify (final_at_certification variant, writing Load.line_haul_cents, fuel_surcharge_cents, demurrage_cents, incentive_cents, regrade_adjustment_cents and final_haul_pay_cents)"
    algorithm: tiered_pricing
    formula: |
      # rate band is selected from the WHOLE route distance (average-rate
      # selection, not a marginal waterfall)
      rate_cents_per_ton_mile = 26 if distance_miles <= 30
                           else 22 if distance_miles <= 70
                           else 19
      line_haul_cents      = round_half_up(tons * rate_cents_per_ton_mile * distance_miles)
      fuel_surcharge_cents = round_half_up(line_haul_cents * FUEL_SURCHARGE_PCT)
      demurrage_cents      = max(0, wait_minutes - FREE_WAIT_MINUTES) * DEMURRAGE_CENTS_PER_MINUTE
      subtotal_cents       = line_haul_cents + fuel_surcharge_cents + demurrage_cents
      incentive_pct        = 0.04 if subtotal_cents >= 120000
                        else 0.02 if subtotal_cents >= 60000
                        else 0.00
      incentive_cents      = round_half_up(subtotal_cents * incentive_pct)
      regrade_adjustment_cents = round_half_up(line_haul_cents * REGRADE_PENALTY_PCT)
                                 if regrade_applies else 0
      haul_pay_cents = subtotal_cents + incentive_cents - regrade_adjustment_cents
      # Evaluation order is pinned and is NOT a fixed point: the incentive tier is
      # keyed on subtotal_cents (line haul + fuel + demurrage) and never on
      # haul_pay_cents. The fuel surcharge is rounded to whole cents HERE, on the
      # single load, before anything sums it.
    input_set: |
      Both variants read HaulRoute.distance_miles from the load's route. They differ in
      which tonnage, wait and grade they see — see variants below. wait_minutes is
      floor((DeliveryTicket.certified_at - Load.arrived_at) in seconds / 60).
    constants:
      RATE_BAND_1_MAX_MILES: 30
      RATE_BAND_2_MAX_MILES: 70
      RATE_BAND_1_CENTS: 26
      RATE_BAND_2_CENTS: 22
      RATE_BAND_3_CENTS: 19
      FUEL_SURCHARGE_PCT: 0.075
      FREE_WAIT_MINUTES: 45
      DEMURRAGE_CENTS_PER_MINUTE: 150
      INCENTIVE_TIER_1_MIN_CENTS: 60000
      INCENTIVE_TIER_1_PCT: 0.02
      INCENTIVE_TIER_2_MIN_CENTS: 120000
      INCENTIVE_TIER_2_PCT: 0.04
      REGRADE_PENALTY_PCT: 0.05
    precision: "whole cents at every rounding point, round_half_up"
    variants:
      - name: provisional_at_dispatch
        when: "Runs inside POST /loads, before any wood reaches the mill scale"
        difference: "tons = Load.estimated_net_tons (the woods estimate, BEFORE any defect deduction); wait_minutes = 0 so demurrage_cents is always 0; regrade_applies is always false. The result is stored in Load.provisional_haul_pay_cents and is never revised, even after certification."
      - name: final_at_certification
        when: "Runs inside POST /delivery-tickets/{id}/certify"
        difference: "tons = DeliveryTicket.net_tons (scaled AFTER the defect deduction); wait_minutes is measured from Load.arrived_at to DeliveryTicket.certified_at; regrade_applies is true when DeliveryTicket.scaled_grade != Load.declared_grade. The result is stored in Load.final_haul_pay_cents. Identical route and identical wood therefore produce a different number from the provisional variant whenever the scale disagrees with the woods estimate, the truck waited past the free window, or the mill regraded the load."

  - name: mill_contract_quota_position
    trigger: "Recomputed on every POST /loads, POST /loads/{id}/cancel, POST /delivery-tickets/{id}/certify, POST /delivery-tickets/{id}/reject, PATCH /mill-contracts/{id}, and on every cascade hop that moves a Load into or out of a reserving state"
    algorithm: aggregation
    formula: |
      reserved_tons  = SUM(Load.estimated_net_tons)
                       WHERE Load.mill_contract_id == C.id
                         AND Load.dispatch_status IN {DISPATCHED, IN_TRANSIT, AT_MILL}
      delivered_tons = SUM(DeliveryTicket.net_tons)
                       WHERE DeliveryTicket.ticket_status == CERTIFIED
                         AND DeliveryTicket's Load.mill_contract_id == C.id
                         AND DeliveryTicket's Load.dispatch_status == DELIVERED
      available_tons = round_half_up(C.quota_tons - reserved_tons - delivered_tons, 2)
      # Dispatch admission (strict): a POST /loads is refused with
      # ERR_QUOTA_EXCEEDED when estimated_net_tons > available_tons. Exact
      # equality is admitted and drives available_tons to exactly 0.00.
      # Certification admission (strict): certification is refused with
      # ERR_OVERRUN_TOLERANCE_EXCEEDED when
      #   delivered_tons_after > round_half_up(C.quota_tons * (1 + C.overrun_tolerance_pct), 2)
      # Auto-transition: available_tons <= 0 sends an OPEN contract to FILLED;
      # available_tons > 0 sends a FILLED contract back to OPEN.
    input_set: "Only Loads whose mill_contract_id names this contract. CANCELLED and REJECTED loads contribute to neither sum. The status filters above are the complete inclusion rule; there is no date filter."
    constants:
      RESERVING_STATUSES: [DISPATCHED, IN_TRANSIT, AT_MILL]
      DELIVERED_STATUSES: [DELIVERED]
    precision: "tons to 2 decimal places, round_half_up"
    variants: []

  - name: contractor_compliance_score
    trigger: "Recomputed on POST /haul-contractors/{id}/safety-findings, POST /haul-contractors/{id}/insurance-certificates, POST /insurance-certificates/{id}/revoke, POST /haul-contractors/{id}/suspend, POST /haul-contractors/{id}/reinstate, POST /_clock/set_current_utc, and on every Load transition into REJECTED. Also evaluated under the period_to_date variant by POST /settlement-statements and POST /settlement-statements/{id}/revise."
    algorithm: weighted_scoring
    formula: |
      finding_points = SUM(SafetyFinding.points)
                       WHERE SafetyFinding.haul_contractor_id == H.id
                         AND window_start <= SafetyFinding.occurred_on <= window_end
      missing_coverage = COUNT of coverage types in
                         {GENERAL_LIABILITY, AUTO_LIABILITY, WORKERS_COMP}
                         that have NO InsuranceCertificate on H whose derived
                         status == ACTIVE at clock_date
      reject_count   = COUNT(Load) WHERE Load.haul_contractor_id == H.id
                         AND Load.dispatch_status == REJECTED
                         AND window_start <= Load.rejected_on <= window_end
      raw   = BASE_SCORE
            - finding_points
            - INSURANCE_PENALTY_POINTS * missing_coverage
            - REJECT_PENALTY_POINTS * reject_count
      score = max(SCORE_FLOOR, min(BASE_SCORE, raw))
      # Both window endpoints are INCLUSIVE in both variants.
    input_set: "SafetyFinding rows on the carrier, InsuranceCertificate rows on the carrier, and REJECTED Loads whose haul_contractor_id is the carrier. The window is what distinguishes the two variants."
    constants:
      BASE_SCORE: 100
      SCORE_FLOOR: 0
      SAFETY_LOOKBACK_DAYS: 180
      INSURANCE_PENALTY_POINTS: 25
      REJECT_PENALTY_POINTS: 3
      MIN_DISPATCH_SCORE: 70
    precision: "integer points; no rounding is required because every input is an integer"
    variants:
      - name: rolling_180_day
        when: "Whenever HaulContractor.compliance_score is written, and at the POST /loads dispatch gate"
        difference: "window_start = clock_date - 180 days, window_end = clock_date, both inclusive. Missing-coverage is evaluated at clock_date. Dispatch is refused with ERR_COMPLIANCE_SCORE_TOO_LOW when this score < 70."
      - name: period_to_date
        when: "Inside POST /settlement-statements and POST /settlement-statements/{id}/revise, writing SettlementStatement.compliance_score_at_compile"
        difference: "window_start = SettlementStatement.period_start, window_end = SettlementStatement.period_end, both inclusive. Missing-coverage is still evaluated at clock_date. Because the settlement period and the 180-day rolling window cover different spans, the two variants score the SAME finding and rejection history differently, and the holdback tier keys on this variant only."

  - name: settlement_statement_rollup
    trigger: "POST /settlement-statements (initial compile) and POST /settlement-statements/{id}/revise (recompile after a dispute)"
    algorithm: waterfall_allocation
    formula: |
      # Step 1 — eligibility (no fuzzy adjectives; this list is the whole filter)
      eligible = Loads L WHERE
                   L.haul_contractor_id == S.haul_contractor_id
               AND L.settlement_status == 'ACCRUED'
               AND L.dispatch_status IN {DELIVERED, REJECTED}
               AND L.settlement_event_on IS NOT NULL
               AND S.period_start <= L.settlement_event_on <= S.period_end
      ordered  = eligible ORDER BY L.created_at ASC     # never by L.id
      # Step 2 — emit lines in this exact order, per load, in `ordered` order
      for L in ordered:
        if L.dispatch_status == 'DELIVERED':
          emit HAUL            amount_cents = L.line_haul_cents + L.incentive_cents - L.regrade_adjustment_cents
          emit FUEL_SURCHARGE  amount_cents = L.fuel_surcharge_cents
          if L.demurrage_cents > 0:
            emit DEMURRAGE     amount_cents = L.demurrage_cents
        else:   # REJECTED with rehaul_status == NO_ALTERNATE
          emit REJECT_DEDUCTION amount_cents = -round_half_up(L.provisional_haul_pay_cents * REJECT_DEDUCTION_PCT)
      # Step 3 — money, in this pinned order. The fuel surcharge is NEVER
      # recomputed here: each load's already-rounded whole-cent value is summed.
      # Summing unrounded ton-miles and taking 7.5% of the aggregate is forbidden
      # and produces a different total.
      gross_pay_cents        = SUM(amount_cents WHERE line_type IN {HAUL, FUEL_SURCHARGE, DEMURRAGE})
      reject_deduction_cents = ABS(SUM(amount_cents WHERE line_type == 'REJECT_DEDUCTION'))
      compliance_score_at_compile = contractor_compliance_score[period_to_date]
      holdback_pct           = 0.00 if score >= 90
                          else 0.02 if score >= 80
                          else 0.05 if score >= 70
                          else 0.10
      # Step 4 — the holdback looks circular (it is a percentage of what the
      # carrier is actually paid) so the base is PINNED to the settleable base,
      # computed BEFORE the holdback exists. No fixed-point solving.
      settleable_base_cents  = gross_pay_cents - reject_deduction_cents
      holdback_cents         = round_half_up(settleable_base_cents * holdback_pct)
      emit INSURANCE_HOLDBACK amount_cents = -holdback_cents      # always last line
      deduction_cents        = reject_deduction_cents + holdback_cents
      net_pay_cents          = gross_pay_cents - deduction_cents
    input_set: "Only the eligible set in Step 1. CANCELLED loads, loads already STATEMENTED or PAID, REJECTED loads whose rehaul_status == REHAULED (their settlement_event_on stays null), and loads whose settlement_event_on falls outside the closed period are all excluded."
    constants:
      REJECT_DEDUCTION_PCT: 0.35
      HOLDBACK_TIER_A_MIN_SCORE: 90
      HOLDBACK_TIER_A_PCT: 0.00
      HOLDBACK_TIER_B_MIN_SCORE: 80
      HOLDBACK_TIER_B_PCT: 0.02
      HOLDBACK_TIER_C_MIN_SCORE: 70
      HOLDBACK_TIER_C_PCT: 0.05
      HOLDBACK_TIER_D_PCT: 0.10
    precision: "whole cents everywhere; each line is an integer before any sum is taken"
    variants: []

  - name: rehaul_alternate_selection
    trigger: "POST /delivery-tickets/{id}/reject — hop 5 of the rejection cascade"
    algorithm: selector_ranking
    formula: |
      # (a) eligibility filter — an explicit predicate, no fuzzy adjectives
      candidates = { (C, R) : C is a MillContract, R is a HaulRoute, and
            C.status == 'OPEN'
        AND C.species == DeliveryTicket.scaled_species
        AND C.grade   == DeliveryTicket.scaled_grade
        AND C.period_start <= clock_date <= C.period_end
        AND C.available_tons >= DeliveryTicket.net_tons
        AND C.mill_id != the rejecting Mill's id
        AND Mill(C.mill_id).receiving_status == 'OPEN'
        AND R.tract_id == Load.tract_id
        AND R.mill_id  == C.mill_id
        AND R.status IN {OPEN, POSTED_RESTRICTED}
        AND permit_rank(Truck.permit_class) >= permit_rank(R.permit_class_required) }
      # (b) ranking expression — maximise net yield, in whole cents
      net_yield_cents(C, R) = round_half_up(C.base_rate_cents_per_ton * DeliveryTicket.net_tons)
                              - R.distance_miles * REHAUL_MILE_COST_CENTS
      winner = candidate with the greatest net_yield_cents
      # (c) tie-break, applied in this order
      #     1. smaller R.distance_miles wins
      #     2. earlier C.created_at wins        (never C.id)
      # (d) empty-candidate fallback
      #     No candidate: Load.rehaul_status = 'NO_ALTERNATE',
      #     Load.settlement_event_on = Load.rejected_on and Load.settlement_status
      #     moves UNSETTLED -> ACCRUED so a REJECT_DEDUCTION line accrues.
      #     A winner exists: Load.rehaul_status = 'REHAULED', no reject deduction
      #     accrues on the original load (settlement_event_on stays null), and the
      #     system creates the rehaul Load below.
      # rehaul Load construction (system-created, exempt from the truck-window
      # overlap check and the compliance-score gate because the eligibility filter
      # above already proved quota, route, permit and mill availability):
      #     tract_id            = original.tract_id
      #     mill_contract_id    = winner C.id
      #     haul_route_id       = winner R.id
      #     truck_id            = original.truck_id
      #     rehaul_of_load_id   = original.id
      #     declared_species    = DeliveryTicket.scaled_species
      #     declared_grade      = DeliveryTicket.scaled_grade
      #     estimated_net_tons  = DeliveryTicket.net_tons
      #     scheduled_depart_at = the logical clock
      #     scheduled_arrive_at = scheduled_depart_at
      #                           + ceil(R.distance_miles * 60 / REHAUL_SPEED_MPH) minutes
      #     dispatch_status     = DISPATCHED, settlement_status = UNSETTLED
      #     provisional_haul_pay_cents = load_haul_pay[provisional_at_dispatch]
    input_set: "Every MillContract in the system paired with every HaulRoute out of the rejected load's tract, filtered by (a). The rejecting mill's own contracts are excluded by construction."
    constants:
      REHAUL_MILE_COST_CENTS: 85
      REHAUL_SPEED_MPH: 45
      PERMIT_RANK: { STANDARD: 1, DIVISIBLE_LOAD_PERMIT: 2, LONGER_COMBINATION: 3 }
    precision: "net_yield_cents in whole cents, round_half_up on the revenue term only"
    variants: []

# =============================================================================
# Table 4: Validation Rules Table (evaluated strictly in ascending priority)
# =============================================================================
validations:
  - priority: 10
    category: auth
    check: "X-User-Role header present and one of the six declared roles, and X-User-ID header present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 20
    category: auth
    check: "The X-User-Role value appears in the called endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 30
    category: business_constraint
    check: "Request body schema: every required input field present, enum members legal, numbers inside their declared ranges, window_end strictly after window_start, scheduled_arrive_at strictly after scheduled_depart_at, period_end >= period_start, and status values that are derived-only (MillContract FILLED) rejected"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 40
    category: existence
    check: "Path resources resolve left to right, then body foreign keys resolve in the order they appear in the endpoint's declared input list"
    error_id: "ERR_MILL_NOT_FOUND | ERR_MILL_CONTRACT_NOT_FOUND | ERR_HAUL_CONTRACTOR_NOT_FOUND | ERR_INSURANCE_CERTIFICATE_NOT_FOUND | ERR_TRUCK_NOT_FOUND | ERR_TRACT_NOT_FOUND | ERR_PRODUCTION_PLAN_NOT_FOUND | ERR_CREW_NOT_FOUND | ERR_CREW_ASSIGNMENT_NOT_FOUND | ERR_HAUL_ROUTE_NOT_FOUND | ERR_SHUTDOWN_ORDER_NOT_FOUND | ERR_LOAD_NOT_FOUND | ERR_DELIVERY_TICKET_NOT_FOUND | ERR_SETTLEMENT_STATEMENT_NOT_FOUND"
    http_status: 404
    applies_to: "all"

  - priority: 50
    category: auth
    check: "MillScaler ownership: X-User-ID equals the Mill id that owns the ticket (DeliveryTicket.mill_id, i.e. the mill_id of the load's MillContract)"
    error_id: ERR_SCALER_MILL_MISMATCH
    http_status: 403
    applies_to: "POST /loads/{id}/delivery-tickets, POST /delivery-tickets/{id}/certify, POST /delivery-tickets/{id}/reject, PATCH /mills/{id}"

  - priority: 50
    category: auth
    check: "HaulContractor ownership: X-User-ID equals the haul_contractor_id of the load, truck, certificate or statement being acted on"
    error_id: ERR_CONTRACTOR_NOT_OWNER
    http_status: 403
    applies_to: "POST /loads/{id}/depart, POST /loads/{id}/arrive, POST /haul-contractors/{id}/insurance-certificates, POST /haul-contractors/{id}/trucks, POST /settlement-statements/{id}/dispute"

  - priority: 50
    category: auth
    check: "Segregation of duties: the approving accountant's X-User-ID differs from SettlementStatement.compiled_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /settlement-statements/{id}/approve"

  - priority: 55
    category: state
    check: "Optimistic concurrency: expected_tract_version equals the current Tract.version"
    error_id: ERR_STALE_TRACT_VERSION
    http_status: 412
    applies_to: "POST /tracts/{id}/production-plans"

  - priority: 55
    category: state
    check: "Optimistic concurrency: expected_haul_contractor_version equals the current HaulContractor.version"
    error_id: ERR_STALE_HAUL_CONTRACTOR_VERSION
    http_status: 412
    applies_to: "POST /settlement-statements"

  - priority: 58
    category: business_safety
    check: "The tract carries no ShutdownOrder with status == ACTIVE. This duplicate-order gate deliberately sits BELOW the priority-60 tract-state check, so a second shutdown declared on an already suspended tract reports the existing order rather than the tract's SUSPENDED status."
    error_id: ERR_ACTIVE_SHUTDOWN_ORDER
    http_status: 409
    applies_to: "POST /tracts/{id}/shutdown-orders"

  - priority: 60
    category: state
    check: "The Tract named in the path is in a state that admits this transition (PLANNED for mobilize, MOBILIZING for activate, ACTIVE for shutdown-orders and complete)"
    error_id: ERR_INVALID_TRACT_STATE
    http_status: 409
    applies_to: "POST /tracts/{id}/mobilize, POST /tracts/{id}/activate, POST /tracts/{id}/complete, POST /tracts/{id}/shutdown-orders"

  - priority: 60
    category: state
    check: "The Load is in a dispatch_status that admits this transition (DISPATCHED for depart, IN_TRANSIT for arrive, AT_MILL for ticket creation, DISPATCHED or IN_TRANSIT for cancel) and has no DRAFT or CERTIFIED ticket already"
    error_id: ERR_INVALID_LOAD_STATE
    http_status: 409
    applies_to: "POST /loads/{id}/depart, POST /loads/{id}/arrive, POST /loads/{id}/cancel, POST /loads/{id}/delivery-tickets"

  - priority: 60
    category: state
    check: "The DeliveryTicket is still DRAFT"
    error_id: ERR_INVALID_TICKET_STATE
    http_status: 409
    applies_to: "POST /delivery-tickets/{id}/certify, POST /delivery-tickets/{id}/reject"

  - priority: 60
    category: state
    check: "The SettlementStatement is in a status that admits this transition (DRAFT or REVISED for submit, SUBMITTED for approve, SUBMITTED or APPROVED for dispute, DISPUTED for revise, APPROVED for pay)"
    error_id: ERR_INVALID_STATEMENT_STATE
    http_status: 409
    applies_to: "POST /settlement-statements/{id}/submit, POST /settlement-statements/{id}/approve, POST /settlement-statements/{id}/dispute, POST /settlement-statements/{id}/revise, POST /settlement-statements/{id}/pay"

  - priority: 60
    category: state
    check: "The ShutdownOrder is still ACTIVE"
    error_id: ERR_INVALID_SHUTDOWN_ORDER_STATE
    http_status: 409
    applies_to: "POST /shutdown-orders/{id}/lift"

  - priority: 60
    category: state
    check: "The ProductionPlan is still DRAFT"
    error_id: ERR_INVALID_PLAN_STATE
    http_status: 409
    applies_to: "POST /production-plans/{id}/approve"

  - priority: 60
    category: state
    check: "The requested MillContract status change is legal from the current status; FILLED can never be requested"
    error_id: ERR_INVALID_MILL_CONTRACT_STATE
    http_status: 409
    applies_to: "PATCH /mill-contracts/{id}"

  - priority: 62
    category: business_safety
    check: "The owning HaulContractor has compliance_status IN {COMPLIANT, WARNED}. This gate sits ABOVE the truck-status gate on purpose: a suspended carrier is reported as a compliance failure, not as an equipment failure, even though the suspension also derives OUT_OF_SERVICE on its trucks."
    error_id: ERR_CONTRACTOR_NOT_COMPLIANT
    http_status: 422
    applies_to: "POST /loads"

  - priority: 64
    category: state
    check: "Cross-entity: the tract has at least one ProductionPlan with status == APPROVED. Checked BEFORE the crew-eligibility gate at priority 65."
    error_id: ERR_PLAN_NOT_APPROVED
    http_status: 409
    applies_to: "POST /tracts/{id}/mobilize"

  - priority: 65
    category: state
    check: "Cross-entity: the Tract named on the load has status == ACTIVE"
    error_id: ERR_TRACT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /loads"

  - priority: 65
    category: state
    check: "Cross-entity: the MillContract named on the load has status == OPEN"
    error_id: ERR_INVALID_MILL_CONTRACT_STATE
    http_status: 409
    applies_to: "POST /loads"

  - priority: 65
    category: state
    check: "Cross-entity: the Mill that owns the MillContract has receiving_status == OPEN"
    error_id: ERR_MILL_NOT_RECEIVING
    http_status: 409
    applies_to: "POST /loads"

  - priority: 65
    category: state
    check: "Cross-entity: the HaulRoute has status IN {OPEN, POSTED_RESTRICTED}"
    error_id: ERR_ROUTE_NOT_OPEN
    http_status: 409
    applies_to: "POST /loads"

  - priority: 65
    category: state
    check: "Cross-entity: the Truck has derived status != OUT_OF_SERVICE"
    error_id: ERR_TRUCK_OUT_OF_SERVICE
    http_status: 409
    applies_to: "POST /loads, POST /loads/{id}/depart"

  - priority: 65
    category: state
    check: "Cross-entity: at least one CrewAssignment on the tract has status == MOVED_IN (activate) or status == SCHEDULED plus an APPROVED ProductionPlan (mobilize)"
    error_id: ERR_NO_ELIGIBLE_CREW
    http_status: 409
    applies_to: "POST /tracts/{id}/mobilize, POST /tracts/{id}/activate"

  - priority: 65
    category: state
    check: "Cross-entity: no Load on the tract has dispatch_status IN {DISPATCHED, IN_TRANSIT, AT_MILL}"
    error_id: ERR_LOADS_STILL_OPEN
    http_status: 409
    applies_to: "POST /tracts/{id}/complete"

  - priority: 70
    category: business_safety
    check: "The owning HaulContractor has compliance_score >= 70 under the rolling_180_day variant"
    error_id: ERR_COMPLIANCE_SCORE_TOO_LOW
    http_status: 422
    applies_to: "POST /loads"

  - priority: 70
    category: business_safety
    check: "Every one of GENERAL_LIABILITY, AUTO_LIABILITY and WORKERS_COMP has an InsuranceCertificate with derived status == ACTIVE"
    error_id: ERR_INSURANCE_COVERAGE_INCOMPLETE
    http_status: 422
    applies_to: "POST /haul-contractors/{id}/reinstate"

  - priority: 70
    category: business_safety
    check: "A WET_WEATHER shutdown order requires soil_moisture_index >= 72; lifting a WET_WEATHER order requires the supplied soil_moisture_index < 72"
    error_id: "ERR_WET_THRESHOLD_NOT_MET | ERR_WET_THRESHOLD_STILL_MET"
    http_status: 422
    applies_to: "POST /tracts/{id}/shutdown-orders, POST /shutdown-orders/{id}/lift"

  - priority: 75
    category: business_temporal
    check: "Seasonal access gate: ALL_SEASON always passes; SUMMER_ONLY requires the logical clock month in {5,6,7,8,9}; FROZEN_ONLY requires the logical clock month in {12,1,2}"
    error_id: ERR_SEASONAL_ACCESS_CLOSED
    http_status: 422
    applies_to: "POST /tracts/{id}/activate, POST /loads"

  - priority: 75
    category: business_temporal
    check: "Crew occupation overlap, HALF-OPEN [window_start, window_end) with a MOVE_BUFFER_DAYS=2 tail appended to every existing assignment: reject when new.window_start < existing.window_end + 2 days AND new.window_end > existing.window_start, over the crew's assignments with status != RELEASED"
    error_id: ERR_CREW_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /tracts/{id}/crew-assignments"

  - priority: 75
    category: business_temporal
    check: "Truck occupation overlap, CLOSED [scheduled_depart_at, scheduled_arrive_at] with no buffer: reject when new.scheduled_depart_at <= existing.scheduled_arrive_at AND new.scheduled_arrive_at >= existing.scheduled_depart_at, over the truck's Loads with dispatch_status IN {DISPATCHED, IN_TRANSIT, AT_MILL}"
    error_id: ERR_TRUCK_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /loads"

  - priority: 75
    category: business_temporal
    check: "The MillContract period covers the logical clock date: period_start <= clock_date <= period_end"
    error_id: ERR_CONTRACT_PERIOD_CLOSED
    http_status: 422
    applies_to: "POST /loads"

  - priority: 75
    category: business_temporal
    check: "No other SettlementStatement for the same contractor with status NOT IN {DRAFT, VOID} has a period that intersects the requested closed interval [period_start, period_end]. An intersecting statement still in DRAFT is voided instead of rejected."
    error_id: ERR_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /settlement-statements"

  - priority: 80
    category: business_constraint
    check: "Truck permit rank >= route permit rank, where STANDARD=1, DIVISIBLE_LOAD_PERMIT=2, LONGER_COMBINATION=3"
    error_id: ERR_PERMIT_CLASS_INSUFFICIENT
    http_status: 422
    applies_to: "POST /loads"

  - priority: 80
    category: business_referential
    check: "The HaulRoute's tract_id equals the load's tract_id and its mill_id equals the MillContract's mill_id"
    error_id: ERR_ROUTE_TRACT_MILL_MISMATCH
    http_status: 422
    applies_to: "POST /loads"

  - priority: 80
    category: business_constraint
    check: "declared_species equals MillContract.species and declared_grade equals MillContract.grade"
    error_id: ERR_SPECIES_GRADE_MISMATCH
    http_status: 422
    applies_to: "POST /loads"

  - priority: 80
    category: business_constraint
    check: "gross_weight_lbs <= DeliveryTicket.max_allowed_gross_lbs from calculations.effective_max_gross_weight; exact equality passes"
    error_id: ERR_OVERWEIGHT_LOAD
    http_status: 422
    applies_to: "POST /loads/{id}/delivery-tickets"

  - priority: 80
    category: business_constraint
    check: "The computed net_tons is strictly greater than 0.00"
    error_id: ERR_ZERO_NET_TONS
    http_status: 422
    applies_to: "POST /loads/{id}/delivery-tickets"

  - priority: 90
    category: business_fiscal
    check: "estimated_net_tons <= MillContract.available_tons; exact equality is admitted"
    error_id: ERR_QUOTA_EXCEEDED
    http_status: 422
    applies_to: "POST /loads"

  - priority: 90
    category: business_fiscal
    check: "delivered_tons after this certification <= round_half_up(quota_tons * (1 + overrun_tolerance_pct), 2)"
    error_id: ERR_OVERRUN_TOLERANCE_EXCEEDED
    http_status: 422
    applies_to: "POST /delivery-tickets/{id}/certify"

  - priority: 90
    category: business_fiscal
    check: "The statement has at least one line; an empty lines array cannot be submitted"
    error_id: ERR_NO_SETTLEABLE_LOADS
    http_status: 422
    applies_to: "POST /settlement-statements/{id}/submit"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
# Every path parameter is literally named {id} and always refers to the resource
# named by the immediately preceding collection segment.
# =============================================================================
endpoints:

  # ---- logical clock (test-driving endpoint, /_ namespace) ----------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. The clock's startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint every date/window/expiry rule reads that instant, never real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects:
      - "Recomputes InsuranceCertificate.status for every certificate"
      - "Recomputes HaulContractor.compliance_score under the rolling_180_day variant for every carrier"

  # ---- Mill ---------------------------------------------------------------
  - method: POST
    path: "/mills"
    description: "Register a receiving mill"
    roles: [PlatformAdmin]
    code: 201
    input: [name, state_code, "receiving_status?"]
    output: Mill
    side_effects: []

  - method: GET
    path: "/mills/{id}"
    description: "Read one mill"
    roles: [PlatformAdmin, OperationsManager, MillScaler, SafetyOfficer, SettlementAccountant, HaulContractor]
    code: 200
    input: []
    output: Mill
    side_effects: []

  - method: PATCH
    path: "/mills/{id}"
    description: "Open or close the mill yard for receiving"
    roles: [PlatformAdmin, MillScaler]
    code: 200
    input: [receiving_status]
    output: Mill
    side_effects:
      - "Closing the yard blocks new dispatch against every MillContract of this mill"

  # ---- MillContract -------------------------------------------------------
  - method: POST
    path: "/mill-contracts"
    description: "Open a species/grade quota with a mill for a period"
    roles: [PlatformAdmin]
    code: 201
    input: [mill_id, species, grade, quota_tons, base_rate_cents_per_ton, period_start, period_end, "overrun_tolerance_pct?"]
    output: MillContract
    side_effects:
      - "reserved_tons and delivered_tons initialise to 0 and available_tons to quota_tons"

  - method: GET
    path: "/mill-contracts/{id}"
    description: "Read one quota contract including its live quota position"
    roles: [PlatformAdmin, OperationsManager, MillScaler, SafetyOfficer, SettlementAccountant, HaulContractor]
    code: 200
    input: []
    output: MillContract
    side_effects: []

  - method: GET
    path: "/mill-contracts"
    description: "List quota contracts, filterable by mill, species, grade and status"
    roles: [PlatformAdmin, OperationsManager, MillScaler, SafetyOfficer, SettlementAccountant]
    code: 200
    input: ["mill_id?", "species?", "grade?", "status?", "limit?", "offset?"]
    output: MillContract[]
    side_effects: []

  - method: PATCH
    path: "/mill-contracts/{id}"
    description: "Suspend, resume or close a quota contract. FILLED is derived and may never be requested."
    roles: [PlatformAdmin]
    code: 200
    input: [status, "reason?"]
    output: MillContract
    side_effects:
      - "Resuming to OPEN recomputes available_tons and may immediately auto-transition the contract to FILLED"

  # ---- HaulContractor -----------------------------------------------------
  - method: POST
    path: "/haul-contractors"
    description: "Register a log-trucking contractor"
    roles: [PlatformAdmin]
    code: 201
    input: [name, dot_number, base_state_code]
    output: HaulContractor
    side_effects:
      - "compliance_status initialises to COMPLIANT and compliance_score to 25 (all three coverages missing at registration)"

  - method: GET
    path: "/haul-contractors/{id}"
    description: "Read one carrier including its live compliance score and version"
    roles: [PlatformAdmin, OperationsManager, MillScaler, SafetyOfficer, SettlementAccountant, HaulContractor]
    code: 200
    input: []
    output: HaulContractor
    side_effects: []

  - method: POST
    path: "/haul-contractors/{id}/insurance-certificates"
    description: "File a certificate of insurance for one coverage type"
    roles: [PlatformAdmin, HaulContractor]
    code: 201
    input: [coverage_type, effective_on, expires_on, limit_cents]
    output: InsuranceCertificate
    side_effects:
      - "Recomputes HaulContractor.compliance_score and increments HaulContractor.version by 1"

  - method: GET
    path: "/haul-contractors/{id}/insurance-certificates"
    description: "List every certificate filed by this carrier with its derived status"
    roles: [PlatformAdmin, SafetyOfficer, SettlementAccountant, HaulContractor]
    code: 200
    input: ["coverage_type?", "status?", "limit?", "offset?"]
    output: InsuranceCertificate[]
    side_effects: []

  - method: POST
    path: "/insurance-certificates/{id}/revoke"
    description: "Revoke a filed certificate; drives the four-hop insurance cascade"
    roles: [SafetyOfficer]
    code: 200
    input: [reason]
    output: InsuranceCertificate
    side_effects:
      - "Certificate status becomes REVOKED"
      - "If a required coverage type is now uncovered the carrier moves to SUSPENDED, its trucks derive OUT_OF_SERVICE, their non-terminal loads are CANCELLED and the affected MillContracts release reserved tons"

  - method: POST
    path: "/haul-contractors/{id}/safety-findings"
    description: "Record a safety audit finding against the carrier"
    roles: [SafetyOfficer]
    code: 201
    input: [severity, points, occurred_on, "note?"]
    output: SafetyFinding
    side_effects:
      - "Recomputes HaulContractor.compliance_score; a MAJOR finding moves a COMPLIANT carrier to WARNED, a CRITICAL finding drives the four-hop suspension cascade"

  - method: GET
    path: "/haul-contractors/{id}/safety-findings"
    description: "List safety findings recorded against the carrier"
    roles: [PlatformAdmin, SafetyOfficer, SettlementAccountant, HaulContractor]
    code: 200
    input: ["severity?", "limit?", "offset?"]
    output: SafetyFinding[]
    side_effects: []

  - method: POST
    path: "/haul-contractors/{id}/suspend"
    description: "Administratively suspend the carrier; drives the four-hop suspension cascade"
    roles: [SafetyOfficer]
    code: 200
    input: [reason]
    output: HaulContractor
    side_effects:
      - "compliance_status becomes SUSPENDED; trucks derive OUT_OF_SERVICE; their non-terminal loads are CANCELLED; affected MillContracts release reserved tons and a FILLED contract may return to OPEN"

  - method: POST
    path: "/haul-contractors/{id}/reinstate"
    description: "Return a suspended carrier to COMPLIANT once all three coverages are ACTIVE"
    roles: [SafetyOfficer]
    code: 200
    input: ["note?"]
    output: HaulContractor
    side_effects:
      - "compliance_status returns to COMPLIANT and every truck derives AVAILABLE again; cancelled loads are NOT resurrected"

  - method: POST
    path: "/haul-contractors/{id}/trucks"
    description: "Add a truck to the carrier's fleet"
    roles: [PlatformAdmin, HaulContractor]
    code: 201
    input: [unit_number, axle_config, tare_weight_lbs, permit_class]
    output: Truck
    side_effects: []

  - method: GET
    path: "/haul-contractors/{id}/trucks"
    description: "List the carrier's fleet with each unit's derived status"
    roles: [PlatformAdmin, OperationsManager, SafetyOfficer, HaulContractor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Truck[]
    side_effects: []

  # ---- Tract --------------------------------------------------------------
  - method: POST
    path: "/tracts"
    description: "Open a harvest unit"
    roles: [OperationsManager]
    code: 201
    input: [name, legal_description, gross_acres, planned_volume_tons, access_class]
    output: Tract
    side_effects: []

  - method: GET
    path: "/tracts/{id}"
    description: "Read one tract including move_in_cost_cents, produced_tons, suspension_count and version"
    roles: [PlatformAdmin, OperationsManager, MillScaler, SafetyOfficer, SettlementAccountant]
    code: 200
    input: []
    output: Tract
    side_effects: []

  - method: POST
    path: "/tracts/{id}/production-plans"
    description: "Compile a production plan for the tract; supersedes any prior DRAFT or APPROVED plan"
    roles: [OperationsManager]
    code: 201
    input: [target_tons_per_week, plan_horizon_weeks, expected_tract_version]
    output: ProductionPlan
    side_effects:
      - "Any prior ProductionPlan on this tract with status IN {DRAFT, APPROVED} moves to SUPERSEDED"
      - "Increments Tract.version by 1"

  - method: GET
    path: "/tracts/{id}/production-plans"
    description: "List the tract's production plans"
    roles: [PlatformAdmin, OperationsManager, SettlementAccountant]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ProductionPlan[]
    side_effects: []

  - method: POST
    path: "/production-plans/{id}/approve"
    description: "Approve a DRAFT production plan"
    roles: [OperationsManager]
    code: 200
    input: []
    output: ProductionPlan
    side_effects:
      - "ProductionPlan.status becomes APPROVED, unlocking mobilization of its tract"

  - method: POST
    path: "/crews"
    description: "Register a logging crew and its equipment count"
    roles: [PlatformAdmin]
    code: 201
    input: [name, crew_type, equipment_pieces, daily_rate_cents]
    output: Crew
    side_effects: []

  - method: GET
    path: "/crews/{id}"
    description: "Read one crew including its derived status"
    roles: [PlatformAdmin, OperationsManager, SafetyOfficer]
    code: 200
    input: []
    output: Crew
    side_effects: []

  - method: POST
    path: "/tracts/{id}/crew-assignments"
    description: "Allocate a crew and its equipment to the tract for an occupation window and price the move-in"
    roles: [OperationsManager]
    code: 201
    input: [crew_id, move_in_miles, window_start, window_end]
    output: CrewAssignment
    side_effects:
      - "Computes lowboy_trips and move_in_cost_cents via calculations.move_in_cost and pins them"
      - "Adds move_in_cost_cents to Tract.move_in_cost_cents and increments Tract.version by 1"

  - method: GET
    path: "/crew-assignments/{id}"
    description: "Read one crew assignment"
    roles: [PlatformAdmin, OperationsManager, SafetyOfficer]
    code: 200
    input: []
    output: CrewAssignment
    side_effects: []

  - method: GET
    path: "/crew-assignments"
    description: "List crew assignments, filterable by crew, tract and status"
    roles: [PlatformAdmin, OperationsManager, SafetyOfficer]
    code: 200
    input: ["crew_id?", "tract_id?", "status?", "limit?", "offset?"]
    output: CrewAssignment[]
    side_effects: []

  - method: POST
    path: "/tracts/{id}/mobilize"
    description: "Move the approved crews onto the tract"
    roles: [OperationsManager]
    code: 200
    input: []
    output: Tract
    side_effects:
      - "SCHEDULED crew assignments become MOVED_IN and their crews move IDLE -> MOBILIZING"

  - method: POST
    path: "/tracts/{id}/activate"
    description: "Start production on the tract"
    roles: [OperationsManager]
    code: 200
    input: []
    output: Tract
    side_effects:
      - "MOVED_IN crew assignments become WORKING and their crews move MOBILIZING -> ON_TRACT"

  - method: POST
    path: "/tracts/{id}/complete"
    description: "Close out production on the tract"
    roles: [OperationsManager]
    code: 200
    input: []
    output: Tract
    side_effects:
      - "All non-RELEASED crew assignments become RELEASED, their crews return to IDLE, and APPROVED plans become SUPERSEDED"

  - method: POST
    path: "/tracts/{id}/shutdown-orders"
    description: "Declare a wet-weather, frost-law, fire-danger or safety stand-down shutdown; drives the four-hop shutdown cascade"
    roles: [OperationsManager]
    code: 201
    input: [reason, soil_moisture_index]
    output: ShutdownOrder
    side_effects:
      - "Tract moves ACTIVE -> SUSPENDED and suspension_count increments"
      - "WORKING crew assignments stand down and their crews follow"
      - "DISPATCHED and IN_TRANSIT loads on the tract are CANCELLED, their MillContracts release reserved tons and a FILLED contract returns to OPEN"

  - method: GET
    path: "/tracts/{id}/shutdown-orders"
    description: "List shutdown orders declared on the tract"
    roles: [PlatformAdmin, OperationsManager, SafetyOfficer]
    code: 200
    input: ["status?", "reason?", "limit?", "offset?"]
    output: ShutdownOrder[]
    side_effects: []

  - method: POST
    path: "/shutdown-orders/{id}/lift"
    description: "Lift an active shutdown order and resume the tract"
    roles: [OperationsManager]
    code: 200
    input: [soil_moisture_index]
    output: ShutdownOrder
    side_effects:
      - "Order becomes LIFTED; the tract returns to ACTIVE; STOOD_DOWN crew assignments return to WORKING and their crews to ON_TRACT"

  # ---- HaulRoute ----------------------------------------------------------
  - method: POST
    path: "/haul-routes"
    description: "Declare a permitted route from a tract to a mill, with its posted weight, permit class and optional frost-law window"
    roles: [PlatformAdmin]
    code: 201
    input: [tract_id, mill_id, distance_miles, legal_gross_weight_lbs, permit_class_required, "frost_law_start_on?", "frost_law_end_on?", "status?"]
    output: HaulRoute
    side_effects: []

  - method: GET
    path: "/haul-routes/{id}"
    description: "Read one haul route"
    roles: [PlatformAdmin, OperationsManager, MillScaler, SafetyOfficer, HaulContractor]
    code: 200
    input: []
    output: HaulRoute
    side_effects: []

  - method: GET
    path: "/haul-routes"
    description: "List haul routes, filterable by tract, mill and status"
    roles: [PlatformAdmin, OperationsManager, MillScaler, SafetyOfficer, HaulContractor]
    code: 200
    input: ["tract_id?", "mill_id?", "status?", "limit?", "offset?"]
    output: HaulRoute[]
    side_effects: []

  # ---- Load ---------------------------------------------------------------
  - method: POST
    path: "/loads"
    description: "Dispatch a truck load of sorted logs against a mill quota"
    roles: [OperationsManager]
    code: 201
    input: [tract_id, mill_contract_id, haul_route_id, truck_id, declared_species, declared_grade, estimated_net_tons, scheduled_depart_at, scheduled_arrive_at]
    output: Load
    side_effects:
      - "Copies Truck.haul_contractor_id onto Load.haul_contractor_id"
      - "Writes Load.rate_cents_per_ton_mile and Load.provisional_haul_pay_cents via calculations.load_haul_pay under the provisional_at_dispatch variant"
      - "Adds estimated_net_tons to MillContract.reserved_tons, recomputes available_tons, increments MillContract.version by 1 and may auto-transition the contract OPEN -> FILLED"

  - method: GET
    path: "/loads/{id}"
    description: "Read one load with both status axes and every money component"
    roles: [PlatformAdmin, OperationsManager, MillScaler, SafetyOfficer, SettlementAccountant, HaulContractor]
    code: 200
    input: []
    output: Load
    side_effects: []

  - method: GET
    path: "/loads"
    description: "List loads, filterable by tract, contract, route, truck, carrier, originating load and either status axis"
    roles: [PlatformAdmin, OperationsManager, MillScaler, SafetyOfficer, SettlementAccountant, HaulContractor]
    code: 200
    input: ["tract_id?", "mill_contract_id?", "haul_route_id?", "truck_id?", "haul_contractor_id?", "rehaul_of_load_id?", "dispatch_status?", "settlement_status?", "limit?", "offset?"]
    output: Load[]
    side_effects: []

  - method: POST
    path: "/loads/{id}/depart"
    description: "Record the loaded truck leaving the landing"
    roles: [HaulContractor]
    code: 200
    input: []
    output: Load
    side_effects:
      - "Stamps Load.departed_at with the logical clock and moves dispatch_status DISPATCHED -> IN_TRANSIT"

  - method: POST
    path: "/loads/{id}/arrive"
    description: "Record the truck arriving at the mill; starts the demurrage clock"
    roles: [HaulContractor]
    code: 200
    input: []
    output: Load
    side_effects:
      - "Stamps Load.arrived_at with the logical clock and moves dispatch_status IN_TRANSIT -> AT_MILL"

  - method: POST
    path: "/loads/{id}/cancel"
    description: "Cancel a dispatched or in-transit load and release its quota reservation"
    roles: [OperationsManager]
    code: 200
    input: [reason]
    output: Load
    side_effects:
      - "MillContract.reserved_tons loses estimated_net_tons, available_tons is recomputed and a FILLED contract returns to OPEN"

  - method: POST
    path: "/loads/{id}/delivery-tickets"
    description: "Write the mill scale ticket for a load standing at the mill"
    roles: [MillScaler]
    code: 201
    input: [gross_weight_lbs, defect_deduction_pct, scaled_species, scaled_grade]
    output: DeliveryTicket
    side_effects:
      - "Copies Truck.tare_weight_lbs and the MillContract's mill_id onto the ticket"
      - "Computes max_allowed_gross_lbs, net_weight_lbs, defect_deducted_lbs, payable_lbs and net_tons"

  - method: GET
    path: "/delivery-tickets/{id}"
    description: "Read one scale ticket"
    roles: [PlatformAdmin, OperationsManager, MillScaler, SafetyOfficer, SettlementAccountant, HaulContractor]
    code: 200
    input: []
    output: DeliveryTicket
    side_effects: []

  - method: GET
    path: "/delivery-tickets"
    description: "List scale tickets, filterable by load, mill and ticket status"
    roles: [PlatformAdmin, OperationsManager, MillScaler, SafetyOfficer, SettlementAccountant, HaulContractor]
    code: 200
    input: ["load_id?", "mill_id?", "ticket_status?", "limit?", "offset?"]
    output: DeliveryTicket[]
    side_effects: []

  - method: POST
    path: "/delivery-tickets/{id}/certify"
    description: "Certify the scale ticket; drives the four-hop certification cascade"
    roles: [MillScaler]
    code: 200
    input: []
    output: DeliveryTicket
    side_effects:
      - "Ticket becomes CERTIFIED; the load becomes DELIVERED with its final money components written; quota moves from reserved to delivered; the contract may auto-transition to FILLED; Tract.produced_tons is recomputed; the load's settlement axis moves UNSETTLED -> ACCRUED"

  - method: POST
    path: "/delivery-tickets/{id}/reject"
    description: "Reject the load at the mill; drives the five-hop rejection cascade including the rehaul selector"
    roles: [MillScaler]
    code: 200
    input: [reject_reason]
    output: DeliveryTicket
    side_effects:
      - "Ticket becomes REJECTED, the load becomes REJECTED and releases its reservation, the carrier's compliance score is recomputed, and calculations.rehaul_alternate_selection either creates a rehaul Load or marks the original NO_ALTERNATE and accrues it"

  # ---- SettlementStatement ------------------------------------------------
  - method: POST
    path: "/settlement-statements"
    description: "Compile a settlement statement for a carrier and a closed date period"
    roles: [SettlementAccountant]
    code: 201
    input: [haul_contractor_id, period_start, period_end, expected_haul_contractor_version]
    output: SettlementStatement
    side_effects:
      - "Runs calculations.settlement_statement_rollup, writing lines and every money field"
      - "Voids any DRAFT statement of the same carrier whose period intersects this one"
      - "Increments HaulContractor.version by 1"

  - method: GET
    path: "/settlement-statements/{id}"
    description: "Read one settlement statement with its full line array"
    roles: [PlatformAdmin, SettlementAccountant, SafetyOfficer, HaulContractor]
    code: 200
    input: []
    output: SettlementStatement
    side_effects: []

  - method: GET
    path: "/settlement-statements"
    description: "List settlement statements, filterable by carrier and status"
    roles: [PlatformAdmin, SettlementAccountant, SafetyOfficer, HaulContractor]
    code: 200
    input: ["haul_contractor_id?", "status?", "limit?", "offset?"]
    output: SettlementStatement[]
    side_effects: []

  - method: POST
    path: "/settlement-statements/{id}/submit"
    description: "Submit the compiled statement to the carrier"
    roles: [SettlementAccountant]
    code: 200
    input: []
    output: SettlementStatement
    side_effects:
      - "Every load on the statement moves settlement_status ACCRUED -> STATEMENTED"

  - method: POST
    path: "/settlement-statements/{id}/approve"
    description: "Approve a submitted statement; the approver may not be the compiler"
    roles: [SettlementAccountant]
    code: 200
    input: []
    output: SettlementStatement
    side_effects:
      - "approved_by_user_id records the approving accountant's X-User-ID"

  - method: POST
    path: "/settlement-statements/{id}/dispute"
    description: "Dispute a submitted or approved statement"
    roles: [SettlementAccountant, HaulContractor]
    code: 200
    input: [dispute_reason]
    output: SettlementStatement
    side_effects:
      - "Clears approved_by_user_id back to null and stores the dispute reason"

  - method: POST
    path: "/settlement-statements/{id}/revise"
    description: "Recompile a disputed statement from scratch"
    roles: [SettlementAccountant]
    code: 200
    input: ["note?"]
    output: SettlementStatement
    side_effects:
      - "Attached loads return settlement_status STATEMENTED -> ACCRUED and every line and money field is recomputed by calculations.settlement_statement_rollup"

  - method: POST
    path: "/settlement-statements/{id}/pay"
    description: "Record payment of an approved statement"
    roles: [SettlementAccountant]
    code: 200
    input: [payment_reference]
    output: SettlementStatement
    side_effects:
      - "Statement becomes PAID, its loads move settlement_status STATEMENTED -> PAID and HaulContractor.lifetime_settled_cents increases by net_pay_cents"

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:

  # -- authentication / authorisation --------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role missing/unknown or X-User-ID missing on any request"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The caller's role is not listed in the endpoint's roles"
  - id: ERR_SCALER_MILL_MISMATCH
    http: 403
    condition: "A MillScaler acts on a ticket, load or mill whose mill id differs from the caller's X-User-ID"
  - id: ERR_CONTRACTOR_NOT_OWNER
    http: 403
    condition: "A HaulContractor acts on a load, truck, certificate or statement belonging to a different carrier"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The accountant approving a settlement statement is the same X-User-ID that compiled it"

  # -- existence ------------------------------------------------------------
  - id: ERR_MILL_NOT_FOUND
    http: 404
    condition: "No Mill with the referenced id"
  - id: ERR_MILL_CONTRACT_NOT_FOUND
    http: 404
    condition: "No MillContract with the referenced id"
  - id: ERR_HAUL_CONTRACTOR_NOT_FOUND
    http: 404
    condition: "No HaulContractor with the referenced id"
  - id: ERR_INSURANCE_CERTIFICATE_NOT_FOUND
    http: 404
    condition: "No InsuranceCertificate with the referenced id"
  - id: ERR_TRUCK_NOT_FOUND
    http: 404
    condition: "No Truck with the referenced id"
  - id: ERR_TRACT_NOT_FOUND
    http: 404
    condition: "No Tract with the referenced id"
  - id: ERR_PRODUCTION_PLAN_NOT_FOUND
    http: 404
    condition: "No ProductionPlan with the referenced id"
  - id: ERR_CREW_NOT_FOUND
    http: 404
    condition: "No Crew with the referenced id"
  - id: ERR_CREW_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "No CrewAssignment with the referenced id"
  - id: ERR_HAUL_ROUTE_NOT_FOUND
    http: 404
    condition: "No HaulRoute with the referenced id"
  - id: ERR_SHUTDOWN_ORDER_NOT_FOUND
    http: 404
    condition: "No ShutdownOrder with the referenced id"
  - id: ERR_LOAD_NOT_FOUND
    http: 404
    condition: "No Load with the referenced id"
  - id: ERR_DELIVERY_TICKET_NOT_FOUND
    http: 404
    condition: "No DeliveryTicket with the referenced id"
  - id: ERR_SETTLEMENT_STATEMENT_NOT_FOUND
    http: 404
    condition: "No SettlementStatement with the referenced id"

  # -- schema ---------------------------------------------------------------
  - id: ERR_VALIDATION
    http: 400
    condition: "Missing required field, illegal enum member, value outside its declared range, window_end <= window_start, scheduled_arrive_at <= scheduled_depart_at, period_end < period_start, or a request to set MillContract.status to the derived value FILLED"

  # -- optimistic concurrency ----------------------------------------------
  - id: ERR_STALE_TRACT_VERSION
    http: 412
    condition: "expected_tract_version does not equal the current Tract.version on production-plan creation"
  - id: ERR_STALE_HAUL_CONTRACTOR_VERSION
    http: 412
    condition: "expected_haul_contractor_version does not equal the current HaulContractor.version on settlement-statement compilation"

  # -- own-resource state ---------------------------------------------------
  - id: ERR_INVALID_TRACT_STATE
    http: 409
    condition: "The tract's status does not admit the requested lifecycle transition"
  - id: ERR_INVALID_LOAD_STATE
    http: 409
    condition: "The load's dispatch_status does not admit depart, arrive, cancel or ticket creation, or the load already has a DRAFT/CERTIFIED ticket"
  - id: ERR_INVALID_TICKET_STATE
    http: 409
    condition: "The delivery ticket is no longer DRAFT"
  - id: ERR_INVALID_STATEMENT_STATE
    http: 409
    condition: "The settlement statement's status does not admit submit, approve, dispute, revise or pay"
  - id: ERR_INVALID_SHUTDOWN_ORDER_STATE
    http: 409
    condition: "The shutdown order is already LIFTED"
  - id: ERR_INVALID_PLAN_STATE
    http: 409
    condition: "The production plan is no longer DRAFT"
  - id: ERR_INVALID_MILL_CONTRACT_STATE
    http: 409
    condition: "The mill contract's status forbids the requested change, or a load is dispatched against a contract that is not OPEN"

  # -- cross-entity state ---------------------------------------------------
  - id: ERR_TRACT_NOT_ACTIVE
    http: 409
    condition: "A load is dispatched from a tract whose status is not ACTIVE"
  - id: ERR_MILL_NOT_RECEIVING
    http: 409
    condition: "A load is dispatched to a mill whose receiving_status is CLOSED"
  - id: ERR_ROUTE_NOT_OPEN
    http: 409
    condition: "A load is dispatched over a haul route whose status is CLOSED"
  - id: ERR_TRUCK_OUT_OF_SERVICE
    http: 409
    condition: "A load is dispatched on, or departed with, a truck whose derived status is OUT_OF_SERVICE"
  - id: ERR_NO_ELIGIBLE_CREW
    http: 409
    condition: "Mobilize found no SCHEDULED crew assignment, or activate found no MOVED_IN crew assignment"
  - id: ERR_PLAN_NOT_APPROVED
    http: 409
    condition: "Mobilize was attempted on a tract with no APPROVED production plan"
  - id: ERR_LOADS_STILL_OPEN
    http: 409
    condition: "Complete was attempted while loads on the tract are still DISPATCHED, IN_TRANSIT or AT_MILL"

  # -- safety / compliance --------------------------------------------------
  - id: ERR_ACTIVE_SHUTDOWN_ORDER
    http: 409
    condition: "The tract already carries an ACTIVE shutdown order"
  - id: ERR_CONTRACTOR_NOT_COMPLIANT
    http: 422
    condition: "The load's carrier has compliance_status == SUSPENDED"
  - id: ERR_COMPLIANCE_SCORE_TOO_LOW
    http: 422
    condition: "The load's carrier has a rolling_180_day compliance_score below 70"
  - id: ERR_INSURANCE_COVERAGE_INCOMPLETE
    http: 422
    condition: "Reinstatement was attempted while at least one required coverage type has no ACTIVE certificate"
  - id: ERR_WET_THRESHOLD_NOT_MET
    http: 422
    condition: "A WET_WEATHER shutdown was declared with soil_moisture_index < 72"
  - id: ERR_WET_THRESHOLD_STILL_MET
    http: 422
    condition: "A WET_WEATHER shutdown order was lifted with soil_moisture_index >= 72"

  # -- temporal -------------------------------------------------------------
  - id: ERR_SEASONAL_ACCESS_CLOSED
    http: 422
    condition: "The tract's access_class forbids operations in the logical clock's calendar month"
  - id: ERR_CREW_WINDOW_CONFLICT
    http: 409
    condition: "The crew's half-open occupation window, expanded by the two-day move buffer, intersects an existing non-RELEASED assignment"
  - id: ERR_TRUCK_WINDOW_CONFLICT
    http: 409
    condition: "The truck's closed haul interval touches or intersects an existing non-terminal load's interval"
  - id: ERR_CONTRACT_PERIOD_CLOSED
    http: 422
    condition: "The logical clock date falls outside the mill contract's [period_start, period_end]"
  - id: ERR_PERIOD_OVERLAP
    http: 409
    condition: "Another non-DRAFT, non-VOID settlement statement for the same carrier covers an intersecting period"

  # -- constraint -----------------------------------------------------------
  - id: ERR_PERMIT_CLASS_INSUFFICIENT
    http: 422
    condition: "The truck's permit rank is below the route's required permit rank"
  - id: ERR_ROUTE_TRACT_MILL_MISMATCH
    http: 422
    condition: "The haul route does not connect the load's tract to the mill contract's mill"
  - id: ERR_SPECIES_GRADE_MISMATCH
    http: 422
    condition: "declared_species/declared_grade do not match the mill contract's species/grade"
  - id: ERR_OVERWEIGHT_LOAD
    http: 422
    condition: "gross_weight_lbs exceeds the ticket's computed max_allowed_gross_lbs"
  - id: ERR_ZERO_NET_TONS
    http: 422
    condition: "The ticket's computed net_tons is 0.00 or below"

  # -- fiscal ---------------------------------------------------------------
  - id: ERR_QUOTA_EXCEEDED
    http: 422
    condition: "estimated_net_tons is strictly greater than the mill contract's available_tons"
  - id: ERR_OVERRUN_TOLERANCE_EXCEEDED
    http: 422
    condition: "Certifying this ticket would push delivered_tons past quota_tons * (1 + overrun_tolerance_pct)"
  - id: ERR_NO_SETTLEABLE_LOADS
    http: 422
    condition: "Submit was attempted on a statement whose lines array is empty"

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:

  - name: PlatformAdmin
    description: "Back-office operator who seeds reference data: mills, quota contracts, carriers, trucks, crews, haul routes, and the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /mills"
      - "POST /mill-contracts"
      - "PATCH /mill-contracts/{id}"
      - "POST /haul-contractors"
      - "POST /crews"
      - "POST /haul-routes"
    shared_operations:
      - "PATCH /mills/{id} (with MillScaler)"
      - "POST /haul-contractors/{id}/insurance-certificates (with HaulContractor)"
      - "POST /haul-contractors/{id}/trucks (with HaulContractor)"
      - "All GET reads"

  - name: OperationsManager
    description: "Logging contractor's woods boss: opens tracts, compiles and approves production plans, allocates crews and equipment, runs the tract lifecycle, declares and lifts shutdowns, and dispatches loads."
    identity: "opaque"
    exclusive_operations:
      - "POST /tracts"
      - "POST /tracts/{id}/production-plans"
      - "POST /production-plans/{id}/approve"
      - "POST /tracts/{id}/crew-assignments"
      - "POST /tracts/{id}/mobilize"
      - "POST /tracts/{id}/activate"
      - "POST /tracts/{id}/complete"
      - "POST /tracts/{id}/shutdown-orders"
      - "POST /shutdown-orders/{id}/lift"
      - "POST /loads"
      - "POST /loads/{id}/cancel"
    shared_operations:
      - "All GET reads over tracts, crews, routes, loads and tickets"

  - name: HaulContractor
    description: "Trucking contractor acting as itself. X-User-ID is the HaulContractor id, so ownership checks compare it directly to the resource's haul_contractor_id."
    identity: "entity_backed:HaulContractor"
    exclusive_operations:
      - "POST /loads/{id}/depart"
      - "POST /loads/{id}/arrive"
    shared_operations:
      - "POST /haul-contractors/{id}/insurance-certificates (with PlatformAdmin)"
      - "POST /haul-contractors/{id}/trucks (with PlatformAdmin)"
      - "POST /settlement-statements/{id}/dispute (with SettlementAccountant)"
      - "GET reads scoped to its own fleet, loads, certificates and statements"

  - name: MillScaler
    description: "Scale-house operator acting on behalf of one mill. X-User-ID is the Mill id, so a scaler may only touch tickets whose mill_id equals its own id."
    identity: "entity_backed:Mill"
    exclusive_operations:
      - "POST /loads/{id}/delivery-tickets"
      - "POST /delivery-tickets/{id}/certify"
      - "POST /delivery-tickets/{id}/reject"
    shared_operations:
      - "PATCH /mills/{id} (with PlatformAdmin)"
      - "GET reads over mills, contracts, loads, routes and tickets"

  - name: SafetyOfficer
    description: "Independent compliance auditor. Records safety findings, revokes insurance certificates, and suspends or reinstates carriers. Never dispatches, scales or settles."
    identity: "opaque"
    exclusive_operations:
      - "POST /haul-contractors/{id}/safety-findings"
      - "POST /insurance-certificates/{id}/revoke"
      - "POST /haul-contractors/{id}/suspend"
      - "POST /haul-contractors/{id}/reinstate"
    shared_operations:
      - "GET reads across carriers, findings, certificates, crews, tracts and loads"

  - name: SettlementAccountant
    description: "Pays the carriers. Compiles, submits, approves, disputes, revises and pays settlement statements. Segregation of duties applies: the X-User-ID that compiled a statement may never be the X-User-ID that approves it."
    identity: "opaque"
    exclusive_operations:
      - "POST /settlement-statements"
      - "POST /settlement-statements/{id}/submit"
      - "POST /settlement-statements/{id}/approve"
      - "POST /settlement-statements/{id}/revise"
      - "POST /settlement-statements/{id}/pay"
    shared_operations:
      - "POST /settlement-statements/{id}/dispute (with HaulContractor)"
      - "GET reads over statements, loads, tickets, carriers and findings"
