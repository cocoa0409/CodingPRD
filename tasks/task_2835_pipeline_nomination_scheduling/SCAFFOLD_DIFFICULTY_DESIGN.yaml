# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Cross-reference of SCAFFOLD.yaml §1.1-§1.7 against the nine Difficulty Rules of §0.5.
# Every numeric literal below was computed by executing the §1.3 formulas as code.
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: proration_policy_history_vs_volume_divergence
        grounds:
          - calculations.capacity_proration
          - calculations.shipper_history_base
          - calculations.effective_capacity
          - entities.PipelineSegment.fields.proration_policy
          - entities.Nomination.fields.history_base_bbl
          - entities.NominationCycle.fields.proration_factor
        distinguishing_aspect: |
          The variant switch is the segment's proration_policy: on identical nomination data
          (ALPHA 70000 bbl with a 36000 bbl history base, BRAVO 50000 bbl with an 18000 bbl
          history base, effective capacity 100000 bbl) HISTORY_WEIGHTED awards ALPHA 60000 bbl
          while VOLUME_WEIGHTED awards ALPHA 58334 bbl — a 1666 bbl divergence — even though
          both variants report the same proration_factor of 0.833333.
        test_recipe:
          setup:
            - "One segment HOU-NAS, capacity 101000 bbl/cycle, transmix reserve 1000 bbl, linefill requirement 20000 bbl fully funded, so effective capacity is exactly 100000 bbl."
            - "ALPHA has two FINAL history rows (30000 and 42000 bbl) inside the 365-day lookback, so its history base is 36000 bbl and its class is HISTORICAL."
            - "BRAVO has two FINAL history rows (20000 and 16000 bbl), so its history base is 18000 bbl and its class is HISTORICAL."
            - "Two cycles are open on the segment with identical nominations: ALPHA 70000 bbl of ULSD and BRAVO 50000 bbl of CBOB; both cycles are CLOSED and awaiting proration."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TariffAdministrator
            - call: "POST /pipeline/terminals"
              payload: { terminal_code: "HOU", name: "Houston Origin", role_kind: "ORIGIN", shell_capacity_bbl: 500000, min_operating_inventory_bbl: 10000, injection_bays: 2 }
              as: TariffAdministrator
              captures: { org_id: "$.data.id", org_v0: "$.data.version" }
            - call: "POST /pipeline/terminals"
              payload: { terminal_code: "NAS", name: "Nashville Delivery", role_kind: "DESTINATION", shell_capacity_bbl: 400000, min_operating_inventory_bbl: 5000 }
              as: TariffAdministrator
              captures: { dst_id: "$.data.id" }
            - call: "POST /pipeline/product-grades"
              payload: { grade_code: "ULSD", name: "Ultra Low Sulfur Diesel", sequence_rank: 3, max_sulfur_ppm: 15, max_rvp_psi: 12 }
              as: TariffAdministrator
              captures: { ulsd_id: "$.data.id" }
            - call: "POST /pipeline/product-grades"
              payload: { grade_code: "CBOB", name: "Conventional Blendstock", sequence_rank: 4, max_sulfur_ppm: 80, max_rvp_psi: 15 }
              as: TariffAdministrator
              captures: { cbob_id: "$.data.id" }
            - call: "POST /pipeline/segments"
              payload: { segment_code: "HOU-NAS", origin_terminal_id: "${org_id}", destination_terminal_id: "${dst_id}", linefill_grade_id: "${ulsd_id}", capacity_bbl_per_cycle: 101000, transmix_reserve_bbl: 1000, transmix_cut_bbl: 250, min_tender_bbl: 6000, linefill_requirement_bbl: 20000, proration_policy: "HISTORY_WEIGHTED" }
              as: TariffAdministrator
              captures: { seg_id: "$.data.id" }
            - call: "POST /pipeline/terminals/${org_id}/inventory-adjustments"
              payload: { expected_terminal_version: "${org_v0}", adjustment_kind: "LINEFILL", adjustment_bbl: 20000, reason: "initial linefill of HOU-NAS", segment_id: "${seg_id}" }
              as: TerminalOperator
              captures: { org_v1: "$.data.version" }
            - call: "POST /pipeline/shippers"
              payload: { shipper_code: "ALPHA", name: "Alpha Trading", credit_limit_usd: 250000 }
              as: TariffAdministrator
              captures: { alpha_id: "$.data.id" }
            - call: "POST /pipeline/shippers"
              payload: { shipper_code: "BRAVO", name: "Bravo Fuels", credit_limit_usd: 250000 }
              as: TariffAdministrator
              captures: { bravo_id: "$.data.id" }
            - call: "POST /pipeline/shipping-history"
              payload: { shipper_id: "${alpha_id}", segment_id: "${seg_id}", cycle_code: "2026-06", actual_shipped_bbl: 30000, cycle_end_at: "2026-06-30T00:00:00Z", record_status: "FINAL" }
              as: TariffAdministrator
            - call: "POST /pipeline/shipping-history"
              payload: { shipper_id: "${alpha_id}", segment_id: "${seg_id}", cycle_code: "2026-07", actual_shipped_bbl: 42000, cycle_end_at: "2026-07-31T00:00:00Z", record_status: "FINAL" }
              as: TariffAdministrator
            - call: "POST /pipeline/shipping-history"
              payload: { shipper_id: "${bravo_id}", segment_id: "${seg_id}", cycle_code: "2026-06", actual_shipped_bbl: 20000, cycle_end_at: "2026-06-30T00:00:00Z", record_status: "FINAL" }
              as: TariffAdministrator
            - call: "POST /pipeline/shipping-history"
              payload: { shipper_id: "${bravo_id}", segment_id: "${seg_id}", cycle_code: "2026-07", actual_shipped_bbl: 16000, cycle_end_at: "2026-07-31T00:00:00Z", record_status: "FINAL" }
              as: TariffAdministrator
            - call: "POST /pipeline/tariffs"
              payload: { segment_id: "${seg_id}", grade_id: "${ulsd_id}", base_rate_usd_per_bbl: 1.855, tier1_min_bbl: 25000, tier1_rate_usd_per_bbl: 1.705, tier2_min_bbl: 45000, tier2_rate_usd_per_bbl: 1.555, tender_minimum_bbl: 6000, imbalance_penalty_rate_usd_per_bbl: 0.45, effective_from: "2026-07-01T00:00:00Z" }
              as: TariffAdministrator
              captures: { tar_ulsd_id: "$.data.id" }
            - call: "POST /pipeline/tariffs/${tar_ulsd_id}/activate"
              payload: {}
              as: TariffAdministrator
            - call: "POST /pipeline/tariffs"
              payload: { segment_id: "${seg_id}", grade_id: "${cbob_id}", base_rate_usd_per_bbl: 1.855, tier1_min_bbl: 25000, tier1_rate_usd_per_bbl: 1.705, tier2_min_bbl: 45000, tier2_rate_usd_per_bbl: 1.555, tender_minimum_bbl: 6000, imbalance_penalty_rate_usd_per_bbl: 0.45, effective_from: "2026-07-01T00:00:00Z" }
              as: TariffAdministrator
              captures: { tar_cbob_id: "$.data.id" }
            - call: "POST /pipeline/tariffs/${tar_cbob_id}/activate"
              payload: {}
              as: TariffAdministrator
            - call: "POST /pipeline/cycles"
              payload: { cycle_code: "2026-09", segment_id: "${seg_id}", window_open_at: "2026-08-01T00:00:00Z", window_close_at: "2026-08-20T00:00:00Z", ship_start_at: "2026-09-01T00:00:00Z", ship_end_at: "2026-09-30T00:00:00Z" }
              as: PipelineScheduler
              captures: { cyc_id: "$.data.id", cyc_v0: "$.data.version" }
            - call: "POST /pipeline/nominations"
              payload: { cycle_id: "${cyc_id}", shipper_id: "${alpha_id}", grade_id: "${ulsd_id}", origin_terminal_id: "${org_id}", destination_terminal_id: "${dst_id}", nominated_bbl: 70000, expected_cycle_version: "${cyc_v0}" }
              as: Shipper
              as_user_id: "${alpha_id}"
              captures: { nom_a_id: "$.data.id" }
            - call: "GET /pipeline/cycles/${cyc_id}"
              payload: {}
              as: PipelineScheduler
              captures: { cyc_v1: "$.data.version" }
            - call: "POST /pipeline/nominations"
              payload: { cycle_id: "${cyc_id}", shipper_id: "${bravo_id}", grade_id: "${cbob_id}", origin_terminal_id: "${org_id}", destination_terminal_id: "${dst_id}", nominated_bbl: 50000, expected_cycle_version: "${cyc_v1}" }
              as: Shipper
              as_user_id: "${bravo_id}"
              captures: { nom_b_id: "$.data.id" }
            - call: "POST /pipeline/cycles/${cyc_id}/close"
              payload: {}
              as: PipelineScheduler
            - call: "POST /pipeline/cycles"
              payload: { cycle_code: "2026-10", segment_id: "${seg_id}", window_open_at: "2026-08-01T00:00:00Z", window_close_at: "2026-08-20T00:00:00Z", ship_start_at: "2026-10-01T00:00:00Z", ship_end_at: "2026-10-31T00:00:00Z" }
              as: PipelineScheduler
              captures: { cyc2_id: "$.data.id", cyc2_v0: "$.data.version" }
            - call: "POST /pipeline/nominations"
              payload: { cycle_id: "${cyc2_id}", shipper_id: "${alpha_id}", grade_id: "${ulsd_id}", origin_terminal_id: "${org_id}", destination_terminal_id: "${dst_id}", nominated_bbl: 70000, expected_cycle_version: "${cyc2_v0}" }
              as: Shipper
              as_user_id: "${alpha_id}"
              captures: { nom_a2_id: "$.data.id" }
            - call: "GET /pipeline/cycles/${cyc2_id}"
              payload: {}
              as: PipelineScheduler
              captures: { cyc2_v1: "$.data.version" }
            - call: "POST /pipeline/nominations"
              payload: { cycle_id: "${cyc2_id}", shipper_id: "${bravo_id}", grade_id: "${cbob_id}", origin_terminal_id: "${org_id}", destination_terminal_id: "${dst_id}", nominated_bbl: 50000, expected_cycle_version: "${cyc2_v1}" }
              as: Shipper
              as_user_id: "${bravo_id}"
              captures: { nom_b2_id: "$.data.id" }
            - call: "POST /pipeline/cycles/${cyc2_id}/close"
              payload: {}
              as: PipelineScheduler
          trigger:
            - call: "POST /pipeline/cycles/${cyc_id}/prorate"
              payload: {}
              as: PipelineScheduler
            - call: "POST /pipeline/segments/${seg_id}/proration-policy"
              payload: { proration_policy: "VOLUME_WEIGHTED" }
              as: TariffAdministrator
            - call: "POST /pipeline/cycles/${cyc2_id}/prorate"
              payload: {}
              as: PipelineScheduler
          assert:
            - "NominationCycle.${cyc_id}.effective_capacity_bbl == 100000"
            - "Nomination.${nom_a_id}.history_base_bbl == 36000.00 and Nomination.${nom_a_id}.allocation_class == HISTORICAL"
            - "Nomination.${nom_a_id}.allocated_bbl == 60000"
            - "Nomination.${nom_b_id}.allocated_bbl == 40000"
            - "NominationCycle.${cyc_id}.allocated_total_bbl == 100000 and NominationCycle.${cyc_id}.unallocated_capacity_bbl == 0"
            - "NominationCycle.${cyc_id}.proration_factor == 0.833333"
            - "Nomination.${nom_a2_id}.allocated_bbl == 58334"
            - "Nomination.${nom_b2_id}.allocated_bbl == 41666"
            - "NominationCycle.${cyc2_id}.allocated_total_bbl == 100000 and NominationCycle.${cyc2_id}.unallocated_capacity_bbl == 0"
            - "NominationCycle.${cyc2_id}.proration_factor == 0.833333"
            - "Nomination.${nom_a_id}.allocated_bbl - Nomination.${nom_a2_id}.allocated_bbl == 1666"

      - name: settlement_basis_scheduled_vs_delivered_divergence
        grounds:
          - calculations.tariff_charge
          - calculations.loss_allocation
          - calculations.imbalance_charge
          - entities.ImbalanceSettlement.fields.basis_mode
          - entities.ImbalanceSettlement.fields.alt_basis_charge_usd
          - entities.ImbalanceSettlement.fields.basis_delta_usd
          - state_machines.NominationCycle.PUBLISHED_to_SETTLED
        distinguishing_aspect: |
          The variant switch is the settle request's basis_mode, not an entity configuration, and it
          governs money rather than barrels: on the same two delivered batches the DELIVERED basis
          bills 95312.92 USD while the SCHEDULED (ship-or-pay) basis bills 95650.50 USD, and the
          settlement records the 337.58 USD divergence in basis_delta_usd.
        test_recipe:
          setup:
            - "Segment HOU-NAS as above, effective capacity 100000 bbl, linefill funded at 20000 bbl."
            - "ALPHA (credit limit 250000 USD, history base 36000 bbl) holds two nominations in one cycle: 30000 bbl of ULSD and 26100 bbl of CBOB; both are fully allocated because 56100 bbl is inside capacity."
            - "The schedule is published; the origin terminal has been funded with 100000 bbl of inventory."
            - "Ticket 1 (ULSD, 30000 bbl, transmix 0) injects 30000 bbl and delivers 29901 bbl; ticket 2 (CBOB, 26100 bbl, transmix 250 bbl) injects 26100 bbl and delivers 26001 bbl; segment system loss is 198 bbl."
