  - section: state_machines
    instances:
      - name: newly_created_rows_start_in_their_declared_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.RepairOrder.initial_state
          - state_machines.ProcedureRecord.initial_state
          - state_machines.PartsLine.initial_state
          - entities.ProcedureRecord.fields.calibration_status
        distinguishing_aspect: >-
          Four machines, four initial states, and one of them is conditional: a ProcedureRecord with
          requires_calibration true opens at REQUIRED while one with the flag defaulted opens at
          NOT_REQUIRED, which is already terminal. The order also proves that INTAKE is left only by
          recording a finding - asking stage-advance for TEARDOWN is not a declared transition.
        test_recipe:
          setup:
            - "One Customer, one Insurer and one RepairOrder created with the minimum fields."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Nia Ash", phone: "555-1013", email: "nia@example.com" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /insurers"
              payload: { insurer_code: "CRNR-13", name: "Cornerstone Mutual", rate_ceiling_cents: { BODY: 6000, FRAME: 8000, REFINISH: 5800, MECHANICAL: 11000, ALUMINUM_BODY: 8800 } }
              as: ShopAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { customer_id: "${cust_id}", insurer_id: "${ins_id}", claim_number: "CLM-90017", vehicle_vin: "1HGCV1F30LA090017", vehicle_model_year: 2019, vehicle_make_model: "Honda Accord", initial_authorized_cents: 400000, deductible_cents: 25000 }
              as: ShopAdmin
              captures: { ro_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/procedure-records"
              payload: { procedure_code: "SEAM-SEAL", source: "ALLDATA", operation_scope: "STRUCTURAL" }
              as: Technician
              as_user_id: "tech-100"
              captures: { pr_plain: $.data.id }
          trigger:
            - call: "POST /repair-orders/${ro_id}/procedure-records"
              payload: { procedure_code: "ADAS-CAL-Z", source: "OEM_PORTAL", operation_scope: "ADAS", requires_calibration: true, calibration_type: "STATIC" }
              as: Technician
              as_user_id: "tech-100"
              captures: { pr_cal: $.data.id }
          assert:
            - "ProcedureRecord.${pr_cal}.calibration_status == REQUIRED with bay_id, window_start, window_end and post_scan_dtc_count all null"
            - "ProcedureRecord.${pr_plain}.calibration_status == NOT_REQUIRED - the default requires_calibration false lands directly in a terminal state"
            - "RepairOrder.${ro_id}.stage == INTAKE and authorization_posture == OPEN"
            - "POST /repair-orders/${ro_id}/stage-advance with to_stage = TEARDOWN is refused ERR_STAGE_SEQUENCE_INVALID (409) - INTAKE is left only by recording a finding"

      - name: blueprint_before_any_teardown_finding_is_refused_for_missing_findings
