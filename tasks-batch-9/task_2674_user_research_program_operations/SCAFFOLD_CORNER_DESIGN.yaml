              as: ResearchOpsAdmin
              as_user_id: "u_ops_1"
              captures: { pool_id: $.data.id }
            - call: "POST /studies"
              payload: { research_request_id: "${req_id}", participant_pool_id: "${pool_id}", method: "INTERVIEW", target_participant_count: 3, screening_criteria: { required_segment: "POWER_USER", required_locale: "en-US", target_answers: ["A1", "A2"], disqualifying_answers: ["X9"] }, incentive_amount_cents: 5000, fielding_start: "2026-08-03T00:00:00Z", fielding_end: "2026-08-21T00:00:00Z" }
