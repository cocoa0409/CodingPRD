          assert:
            - "trigger response error_id == \"ERR_INSURANCE_INVALID\""
            - "trigger response http_status == 422"

      - name: liveaboard_not_allowed_beats_date_conflict_on_create
        grounds:
          - validations[priority=7]
          - validations[priority=9]
        distinguishing_aspect: |
          On POST /leases, two violations coincide: vessel/tenant not
          approved for liveaboard (priority 7, business_safety /
          ERR_LIVEABOARD_NOT_ALLOWED) AND requested window overlaps an
          existing lease on the same slip (priority 9, business_temporal /
