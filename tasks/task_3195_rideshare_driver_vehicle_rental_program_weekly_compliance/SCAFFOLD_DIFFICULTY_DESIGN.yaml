  - rule_id: compensating_invariant
    instances:
      - name: maintenance_loaner_conserves_assigned_fleet_units
        grounds:
          - state_machines.MaintenanceEvent.IN_PROGRESS_to_LOANER_ISSUED
          - state_machines.MaintenanceEvent.LOANER_ISSUED_to_COMPLETED
          - entities.ProgramVehicle.fields.vehicle_status
          - errors[ERR_LOANER_UNAVAILABLE]
        distinguishing_aspect: |
          Across issue-loaner followed by complete, the region's count of ProgramVehicle
          rows in ASSIGNED returns exactly to its pre-event value because the loaner's
          release and the original unit's reassignment are one compensating pair; the two
          vehicle ids carrying ASSIGNED differ before and after even though the count does not.
