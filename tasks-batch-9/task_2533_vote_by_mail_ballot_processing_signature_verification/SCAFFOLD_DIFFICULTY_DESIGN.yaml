  - rule_id: boundary_precision_check
    instances:
      - name: confidence_score_auto_accept_threshold_cap_and_rounding_edges
        grounds:
          - calculations.signature_confidence_score
          - calculations.escalation_quorum_resolution
          - endpoints.POST_/vote-by-mail/signature-reviews/{id}/decision
        distinguishing_aspect: |
          Metric under test: the 4-decimal confidence_score against SIGNATURE_AUTO_ACCEPT_THRESHOLD (0.72),
          exercised on the decision endpoint. Three distinct edges on that one metric: exactly at the
          threshold, one reachable step below it, the SIGNATURE_ON_FILE_CAP clamp that keeps a high
          on-file count from crossing the threshold, and a raw value whose 5th decimal is exactly 5 so
          round_half_up is distinguishable from round-half-even.
        test_recipe:
          setup:
            - "One election in posture RECEIVING; clock 2026-11-03T12:00:00Z; exactly one TRAINED reviewer rvT (party NPP) in the pool, so reviewer selection is unambiguous and no CERTIFIED_LEAD bonus ever applies"
            - "Four voters, all with last_signature_update_at 2026-01-05T00:00:00Z (signature age 302 days, far below SIGNATURE_STALENESS_DAYS 1460, so no penalty): vA signature_on_file_count 1, vB 1, vC 6, vD 4"
            - "Four dispatched 28 g packets and four DROPBOX envelopes, one per voter, each with an open round-1 review assigned to rvT"
          setup_api_calls:
            - call: "POST /vote-by-mail/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
