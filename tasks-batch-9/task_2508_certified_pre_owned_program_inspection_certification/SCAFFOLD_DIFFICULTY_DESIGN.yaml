  - rule_id: combinatorial_formula
    instances:
      - name: certification_fee_cap_before_volume_discount
        grounds:
          - calculations.certification_fee
          - entities.ProgramConfig.fields.surcharge_cap_pct
          - entities.ProgramConfig.fields.volume_discount_tiers
          - entities.Certification.fields.fee_surcharge_cents
          - entities.Certification.fields.fee_discount_cents
          - entities.Certification.fields.fee_charged_cents
          - state_machines.Certification.SUBMITTED_to_ACTIVE
        distinguishing_aspect: |
          The vehicle's raw surcharge (2 chargeable age years -> 25000 plus 3 mileage blocks -> 27000
          = 52000) exceeds the cap floor(89900 * 0.35) == 31465, and a 10% volume tier is in force, so
          the answer is decided by evaluation order: capping first gives subtotal 121365, discount
          floor(12136.5) == 12136 and fee 109229, while discounting the uncapped 141900 subtotal would
          give 127710. Only this instance pins the cap-before-discount ordering.
        test_recipe:
          setup:
            - "volume_discount_tiers replaced by a single tier [{min_count: 0, pct: 0.10}] so the dealer's very first activation is discounted."
            - "Vehicle in_service_date 2020-09-01 with 79000 miles: 2159 days old at inspection (inside max_age_days 2190) and inside max_odometer_miles 80000."
            - "A PASSED inspection recorded odometer_at_inspection 79000 and a SUBMITTED certification exists; the dealer's lifetime_activated_count is still 0."
            - "The clock is at its 2026-08-01T00:00:00Z default, so the activation date is 2026-08-01 and the vehicle is 2160 days old at pricing time."
          setup_api_calls:
            - call: "PUT /cpo/program-config"
              payload: { volume_discount_tiers: [{ min_count: 0, pct: 0.10 }] }
              as: ProgramAdministrator
            - call: "POST /cpo/dealers"
              payload: { name: "Summit Motors", franchise_code: "FR-3001", region_code: "WEST" }
