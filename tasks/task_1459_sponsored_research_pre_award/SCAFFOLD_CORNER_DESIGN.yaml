              payload: { expected_proposal_version: "${pv2}", origin: "SPONSOR", offered_total_cents: 14000000 }
              as: OSPDirector
              captures: { offer_id: $.data.id }
            - { call: "POST /pre-award/negotiation-offers/${offer_id}/accept", payload: {}, as: OSPDirector }
          trigger:
            - call: "POST /pre-award/negotiation-offers/${offer_id}/accept"
              payload: {}
              as: OSPDirector
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_OFFER_INVALID_STATE"

      - name: error_opportunity_closed_on_submit
        claim_type: violation_to_error
        grounds: ["errors[ERR_OPPORTUNITY_CLOSED]"]
        excluded_because:
          difficulty_instance: referential_vs_temporal_on_submit
          rationale: "ERR_OPPORTUNITY_CLOSED is asserted as the winning error of the §1.8 referential-vs-temporal priority instance."

      - name: error_internal_deadline_passed
        claim_type: violation_to_error
        grounds: ["errors[ERR_INTERNAL_DEADLINE_PASSED]"]
        excluded_because:
          difficulty_instance: internal_deadline_boundary
          rationale: "Asserted one second past the internal deadline in the §1.8 boundary instance."

      - name: error_cost_share_inadequate
        claim_type: violation_to_error
        grounds: ["errors[ERR_COST_SHARE_INADEQUATE]"]
        excluded_because:
          difficulty_instance: cost_share_floor_boundary
          rationale: "Asserted one cent below the floor in the §1.8 boundary instance."

      - name: error_pi_effort_exceeded
        claim_type: violation_to_error
        grounds: ["errors[ERR_PI_EFFORT_EXCEEDED]"]
        excluded_because:
          difficulty_instance: pi_effort_aggregate_capacity
          rationale: "Asserted at 100.01 in the §1.8 temporal-overlap instance."

      - name: error_fa_rate_window_overlap
        claim_type: violation_to_error
        grounds: ["errors[ERR_FA_RATE_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: final_rate_window_overlap_adjacency
          rationale: "Asserted on the straddling FINAL window in the §1.8 overlap instance."

      - name: error_subrec_high_risk_not_acked
        claim_type: violation_to_error
        grounds: ["errors[ERR_SUBREC_HIGH_RISK_NOT_ACKED]"]
        excluded_because:
          difficulty_instance: verify_requires_org_risk_ack
          rationale: "Asserted on the HIGH-tier org without acknowledgment in the §1.8 cross-entity instance."

      - name: error_compliance_review_pending
        claim_type: violation_to_error
        grounds: ["errors[ERR_COMPLIANCE_REVIEW_PENDING]"]
        excluded_because:
          difficulty_instance: handoff_ready_requires_reviews_approved
          rationale: "Asserted on mark-ready with a PENDING IRB review in the §1.8 cross-entity instance."

      - name: error_compliance_disapproved
        claim_type: violation_to_error
        grounds: ["errors[ERR_COMPLIANCE_DISAPPROVED]"]
        excluded_because:
          difficulty_instance: safety_vs_temporal_on_handoff
          rationale: "Asserted as the winning error of the §1.8 safety-vs-temporal priority instance."

