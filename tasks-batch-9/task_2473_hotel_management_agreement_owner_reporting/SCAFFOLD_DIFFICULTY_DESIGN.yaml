              payload: {}
              as: HotelManagerOps
              as_user_id: "u-mgr-1"
            - call: "POST /hotel-management/budgets/${bud25}/decision"
              payload: { decision: "APPROVE" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "GET /hotel-management/agreements/${agr3a}"
              payload: {}
              as: HotelManagerOps
              captures: { agr3a_v3: $.data.version }
            - call: "POST /hotel-management/agreements/${agr3a}/budgets"
              payload: { fiscal_year: 2026, budgeted_revenue_cents: 620000000, budgeted_operating_expenses_cents: 410000000, budgeted_capital_ffe_cents: 21000000, budgeted_capital_brand_cents: 11000000, expected_agreement_version: "${agr3a_v3}" }
              as: HotelManagerOps
              captures: { bud26: $.data.id }
            - call: "POST /hotel-management/budgets/${bud26}/submit"
              payload: {}
              as: HotelManagerOps
              as_user_id: "u-mgr-1"
            - call: "POST /hotel-management/budgets/${bud26}/decision"
              payload: { decision: "REQUEST_REVISION", note: "reduce rooms payroll" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "POST /hotel-management/budgets/${bud26}/submit"
              payload: { budgeted_revenue_cents: 618000000, budgeted_operating_expenses_cents: 408000000, budgeted_capital_ffe_cents: 21000000, budgeted_capital_brand_cents: 11000000 }
