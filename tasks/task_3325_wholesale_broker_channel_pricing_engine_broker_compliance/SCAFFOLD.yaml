# =============================================================================
# PRD Benchmark Seed Tables — task_3325
# Wholesale Broker Channel, Pricing Engine & Broker Compliance
# (United Wholesale Mortgage style)
# =============================================================================

scenario: |
  Wholesale Broker Channel, Pricing Engine & Broker Compliance (United Wholesale Mortgage): broker approval with licensing verification, financial review and volume expectations, pricing engine delivering rate sheets with adjustments by credit, loan-to-value, occupancy and product with intraday reprices, loan submission with broker-prepared files and lender underwriting responsibility, broker compensation election as lender-paid or borrower-paid with plan-level consistency requirements and rate impact, exclusivity policies restricting brokers from working with certain competitors with enforcement consequences, turn time commitments on underwriting and closing with escalation paths, quality control review of broker-submitted files with repurchase and buyback exposure, broker portal tooling, training and lead programs

domain_name: wholesale-broker-channel
api_prefix: /wholesale-channel

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - derived_field_reconciliation
    - contagion_risk_propagation
    - scheduled_deferred_actions
  entity_topology: flat
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table  (§1.1)
# =============================================================================
entities:
  - name: Broker
    parent: null
    common_fields: true  # id, created_at, updated_at, version
    fields:
      - { name: legal_name, type: string, source: input, description: "Legal name of the mortgage brokerage" }
      - { name: nmls_id, type: string, source: input, description: "NMLS company identifier; unique across all brokers" }
      - { name: home_state, type: string, source: input, description: "Two-letter USPS state code of the brokerage's principal place of business" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | SUSPENDED | TERMINATED — set by the approval state machine, never client-supplied" }
      - { name: financial_strength_score, type: number, source: computed, default: 0.00, description: "0-100 net-worth grade; starts at 0.00 at submission and is overwritten only when a FinancialReview decision is PASSED" }
      - { name: tier, type: enum, source: computed, description: "UNRATED | TIER_1 | TIER_2 | TIER_3 — derived from financial_strength_score via the broker_tier calculation; UNRATED until the first financial review" }
      - { name: licensed_states, type: array, source: computed, description: "Distinct state_code values of the broker's licenses whose expires_on is strictly after the logical clock; recomputed on license create, license revocation and /_clock/set_current_utc" }
      - { name: approved_product_codes, type: array, source: computed, description: "Distinct product_code values of the broker's APPROVED product eligibilities" }
      - { name: volume_expectation_cents, type: integer, source: input, description: "Approved annual funded-volume expectation in cents; set at approval time, inclusive lower bound for the tier ladder" }
      - { name: rolling_funded_volume_cents, type: integer, source: computed, default: 0, description: "Sum of loan_amount_cents over the broker's FUNDED loans; decremented when a funded loan is repurchased (repurchase reverses the volume credit)" }
      - { name: rolling_quality_score, type: number, source: computed, default: 100, description: "Starts at 100; each QC DEFECT finding subtracts that finding's weighted_defect_points after multiplying them by the open defect tier multiplier, floored at 0.00" }
      - { name: open_defect_tier, type: integer, source: computed, default: 0, description: "Count of defect findings across this broker's loans that are not yet REMEDIATED or VOIDED; drives the QC defect multiplier and the suspension ladder" }
      - { name: exclusivity_status, type: enum, source: computed, default: CLEAR, description: "CLEAR | WARNED | RESTRICTED | BLOCKED — derived from the number of distinct ACTIVE exclusivity policies this broker has breached; CLEAR when none" }
      - { name: active_loan_count, type: integer, source: computed, default: 0, description: "Loans in a non-terminal status (SUBMITTED, UNDERWRITING, CONDITIONAL_APPROVAL, SUSPENDED_REVIEW, CLEAR_TO_CLOSE); gates termination and drives suspension" }
      - { name: total_active_compensation_commitment_cents, type: integer, source: computed, default: 0, description: "Rolling total of lender_paid_comp_cents for this broker's loans in status SUBMITTED, UNDERWRITING or CONDITIONAL_APPROVAL — the conserved quantity reconciled by submission and cancellation" }
      - { name: suspended_reason, type: string, source: system, description: "Populated by the automatic suspension transition; null while the broker is not SUSPENDED" }

  - name: BrokerLicense
    parent: Broker
    common_fields: true
    fields:
      - { name: broker_id, type: string, source: system, description: "FK -> Broker.id; the licensed brokerage" }
      - { name: state_code, type: string, source: input, description: "Two-letter USPS state code this license covers" }
      - { name: license_number, type: string, source: input, description: "State-issued license number" }
      - { name: license_type, type: enum, source: input, description: "MORTGAGE_BROKER | MORTGAGE_LENDER | DUAL_AUTHORITY" }
      - { name: expires_on, type: datetime, source: input, description: "License expiry instant; the license is valid only while the logical clock is strictly before this instant" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXPIRED | REVOKED — ACTIVE on create, EXPIRED when the logical clock passes expires_on at approval time, REVOKED on explicit revocation" }
      - { name: revoked_at, type: datetime, source: system, description: "Logical-clock instant the license was revoked; null while ACTIVE or EXPIRED" }

  - name: FinancialReview
    parent: Broker
    common_fields: true
    fields:
      - { name: broker_id, type: string, source: system, description: "FK -> Broker.id; the reviewed brokerage" }
      - { name: net_worth_cents, type: integer, source: input, description: "Audited net worth in cents; minimum NET_WORTH_FLOOR_CENTS is required before a passing grade is possible" }
      - { name: liquidity_cents, type: integer, source: input, description: "Audited liquid assets in cents" }
      - { name: total_liabilities_cents, type: integer, source: input, description: "Audited total liabilities in cents" }
      - { name: years_in_business, type: integer, source: input, description: "Whole years the brokerage has been operating" }
      - { name: prior_year_funded_volume_cents, type: integer, source: input, description: "Funded volume reported for the prior twelve months; compared against volume_expectation_cents on the banded ladder" }
      - { name: audit_attested, type: boolean, source: input, default: false, description: "Whether the broker attested the audit; an unattested review remains PENDING regardless of its computed score" }
      - { name: computed_financial_strength_score, type: number, source: computed, description: "0-100 weighted score from the four weighted_terms; recorded even while the review is PENDING" }
      - { name: status, type: enum, source: system, description: "PENDING | PASSED | FAILED — PENDING on create, PASSED or FAILED set by the broker-approval decision endpoint" }
      - { name: is_current, type: boolean, source: computed, default: false, description: "True only for the single most recently PASSED review of each broker; every earlier PASSED review is demoted to false when a newer one passes" }

  - name: ProductEligibility
    parent: Broker
    common_fields: true
    fields:
      - { name: broker_id, type: string, source: system, description: "FK -> Broker.id; the eligible brokerage" }
      - { name: product_code, type: enum, source: input, description: "CONVENTIONAL | FHA | VA | JUMBO | USDA" }
      - { name: max_ltv, type: number, source: input, description: "Maximum loan-to-value this brokerage may deliver for the product, inclusive; 0.8000 means LTV <= 0.8000 passes" }
      - { name: min_fico, type: integer, source: input, description: "Minimum representative credit score accepted for the product, inclusive" }
      - { name: max_loan_amount_cents, type: integer, source: input, description: "Maximum loan amount accepted for the product, inclusive" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | REVOKED — PENDING on create, APPROVED or REVOKED by the eligibility decision endpoint" }
      - { name: approved_at, type: datetime, source: system, description: "Logical-clock instant of approval; null while PENDING or REVOKED" }

  - name: ExclusivityPolicy
    parent: Broker
    common_fields: true
    fields:
      - { name: broker_id, type: string, source: system, description: "FK -> Broker.id; the brokerage bound by the policy" }
      - { name: competitor_identifier, type: string, source: input, description: "Portal account identifier of the restricted competitor; matched case-insensitively against the competitor identifier a loan discloses" }
      - { name: competitor_name, type: string, source: input, description: "Human-readable name of the restricted competitor" }
      - { name: effective_from, type: datetime, source: input, description: "Instant the policy takes effect, inclusive" }
      - { name: effective_to, type: datetime, source: input, description: "Instant the policy lapses, exclusive; must be strictly after effective_from" }
      - { name: status, type: enum, source: input, default: ACTIVE, description: "DRAFT | ACTIVE | SUPERSEDED | VOIDED — the single field on this entity a client may supply; an ACTIVE policy is the only one that can be breached" }
      - { name: breach_count, type: integer, source: computed, default: 0, description: "Number of distinct loans that have recorded an exclusivity breach against this policy" }
      - { name: restriction_scope, type: enum, source: input, default: LOAN_SUBMISSION, description: "LOAN_SUBMISSION | RATE_LOCK | ALL — which operations the policy blocks once its breach escalates the broker to RESTRICTED" }

  - name: RateSheet
    parent: Broker
    common_fields: true
    fields:
      - { name: broker_id, type: string, source: system, description: "FK -> Broker.id; the brokerage this sheet prices for" }
      - { name: product_code, type: enum, source: input, description: "CONVENTIONAL | FHA | VA | JUMBO | USDA — the product this sheet prices" }
      - { name: base_rate_pct, type: number, source: input, description: "Par note rate in percent before any adjustment; EARLY_FUNDING_CUTOFF_UTC is used only for the round-half-up rounding of this value" }
      - { name: status, type: enum, source: system, description: "PUBLISHED | SUPERSEDED | RETIRED — PUBLISHED on create, SUPERSEDED by the next sheet the repricing cycle publishes for the same broker and product" }
      - { name: superseded_by_sheet_id, type: string, source: computed, description: "FK -> RateSheet.id; the sheet that replaced this one, null while PUBLISHED" }
      - { name: published_at, type: datetime, source: system, description: "Logical-clock instant the PUBLISHED sheet was created" }
      - { name: publish_sequence, type: integer, source: system, description: "1-based ordering of sheets within the (broker, product) pair; the sheet holding the highest publish_sequence is the PUBLISHED one" }
      - { name: adjustment_table, type: array, source: input, description: "Ordered list of { dim, bucket, adjust_pct } rows; dim is one of credit | ltv | occupancy | product, bucket names the band, adjust_pct is signed" }

  - name: PricingQuote
    parent: RateSheet
    common_fields: false  # immutable pricing snapshot: id + created_at only, no version, no update endpoint
    fields:
      - { name: rate_sheet_id, type: string, source: system, description: "FK -> RateSheet.id; the exactly-one sheet this quote was priced from" }
      - { name: broker_id, type: string, source: system, description: "FK -> Broker.id; the requesting brokerage, copied from the sheet" }
      - { name: product_code, type: enum, source: system, description: "Copied from the sheet at quote time so the snapshot is self-describing" }
      - { name: representative_fico, type: integer, source: input, description: "Representative credit score used to select the credit bucket" }
      - { name: ltv_ratio, type: number, source: input, description: "Loan-to-value as a decimal fraction, 0.0000-1.0000 with four decimals" }
      - { name: occupancy_type, type: enum, source: input, description: "PRIMARY_RESIDENCE | SECOND_HOME | INVESTMENT" }
      - { name: loan_amount_cents, type: integer, source: input, description: "Requested loan amount in cents" }
      - { name: lock_period_days, type: integer, source: input, description: "Requested lock length in days; selects one of the three lock buckets" }
      - { name: loan_purpose, type: enum, source: input, description: "PURCHASE | RATE_TERM_REFINANCE | CASH_OUT_REFINANCE" }
      - { name: overall_adjustment_pct, type: number, source: computed, description: "Sum of the four dimension adjustments in the pinned evaluation order credit → ltv → occupancy → product; independent of loan_purpose" }
      - { name: note_rate_pct, type: number, source: computed, description: "sheet.base_rate_pct + overall_adjustment_pct + lock_adjustment_pct, summed full precision then rounded once to three decimals half-up" }
      - { name: lock_adjustment_pct, type: number, source: computed, description: "Surcharge for the requested lock length: LOCK_SURCHARGE_15D below 30 days, LOCK_SURCHARGE_30D at 30 to 59 days, LOCK_SURCHARGE_60D at 60 days and above" }
      - { name: price_points, type: number, source: computed, description: "Price in points from the base grid: PRICE_TABLE[round(representative_fico, -1)][ltv_band_label(ltv_ratio)] with the overall adjustment added; loan_purpose is deliberately excluded" }
      - { name: adjustment_trace, type: array, source: computed, description: "Array of the four dimension rows evaluated, each { dim, bucket, adjust_pct }, in the order credit, ltv, occupancy, product" }
      - { name: is_repriced, type: boolean, source: computed, description: "True when the calling broker's PUBLISHED sheet publish_sequence has advanced past the publish_sequence of rate_sheet_id" }

  - name: LoanSubmission
    parent: Broker
    common_fields: true
    fields:
      - { name: broker_id, type: string, source: system, description: "FK -> Broker.id; the submitting brokerage" }
      - { name: pricing_quote_id, type: string, source: input, description: "FK -> PricingQuote.id; the immutable quote the broker is submitting against" }
      - { name: comp_plan_id, type: string, source: input, description: "FK -> CompensationPlan.id; the compensation plan elected for this loan; must belong to the same broker and its default_election must equal compensation_election" }
      - { name: borrower_name, type: string, source: input, description: "Primary borrower legal name" }
      - { name: property_state, type: string, source: input, description: "Two-letter USPS state code of the subject property; must be covered by an unexpired license at submission" }
      - { name: loan_amount_cents, type: integer, source: input, description: "Requested loan amount in cents; added to rolling_funded_volume_cents when the loan funds and reversed when it is repurchased" }
      - { name: lock_expires_at, type: datetime, source: input, description: "Instant the rate lock lapses; must be strictly after the logical clock, and is the sole setter of the submission-rate lock countdown" }
      - { name: competitor_channel_identifier, type: string, source: input, description: "Portal account identifier of any competitor involved in the transaction; matched case-insensitively against ACTIVE exclusivity policies" }
      - { name: compensation_election, type: enum, source: input, description: "LENDER_PAID | BORROWER_PAID | UNDECIDED — may only move UNDECIDED → LENDER_PAID or UNDECIDED → BORROWER_PAID, and only while status is SUBMITTED" }
      - { name: lender_paid_comp_cents, type: integer, source: computed, description: "0 for BORROWER_PAID, comp_plan.lender_paid_amount_cents for LENDER_PAID, and only materialized inside the compensation election block" }
      - { name: borrower_paid_comp_cents, type: integer, source: computed, description: "comp_plan.borrower_paid_amount_cents for BORROWER_PAID, 0 for LENDER_PAID — the borrower-paid branch of the compensation split" }
      - { name: rate_impact_pct, type: number, source: computed, description: "0.000 when the election equals the plan default, +0.250 when LENDER_PAID is elected against a BORROWER_PAID default, -0.250 in the mirrored case" }
      - { name: final_note_rate_pct, type: number, source: computed, description: "quote.note_rate_pct + rate_impact_pct for a decided election; quote.note_rate_pct when compensation_election is still UNDECIDED" }
      - { name: defect_remediation_open, type: boolean, source: computed, default: false, description: "True while at least one QC finding on this loan has remediation_status OPEN; blocks funding while true" }
      - { name: underwriting_due_at, type: datetime, source: system, description: "submitted_at + UNDERWRITING_TURN_DAYS on submission; reset to the decision instant + UNDERWRITING_TURN_DAYS when a counter-offer or a resubmission returns the loan to UNDERWRITING" }
      - { name: closing_due_at, type: datetime, source: system, description: "cleared_at + CLOSING_TURN_DAYS when the loan reaches CLEAR_TO_CLOSE; null before that" }
      - { name: repurchase_exposure_cents, type: integer, source: computed, default: 0, description: "0 unless the loan is repurchased; otherwise the compensating total of the origination fee reversal and the funded-volume share reversal, whose sum is exactly loan_amount_cents" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDERWRITING | CONDITIONAL_APPROVAL | SUSPENDED_REVIEW | CLEAR_TO_CLOSE | FUNDED | DENIED | WITHDRAWN | REPURCHASED" }
      - { name: closing_path, type: enum, source: system, description: "null | ESCALATION_PATH | STANDARD_PATH — set when the loan reaches CLEAR_TO_CLOSE, published on the closing-pipeline read" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock instant of submission; the base for underwriting_due_at" }
      - { name: cleared_at, type: datetime, source: system, description: "Logical-clock instant the loan reached CLEAR_TO_CLOSE; the base for closing_due_at" }

  - name: CompensationPlan
    parent: Broker
    common_fields: true
    fields:
      - { name: broker_id, type: string, source: system, description: "FK -> Broker.id; the brokerage the plan binds" }
      - { name: plan_code, type: enum, source: input, description: "PLAN_A | PLAN_B | PLAN_C; unique per broker, and the identifier the broker-wide election consistency rule compares" }
      - { name: default_election, type: enum, source: input, description: "LENDER_PAID | BORROWER_PAID — the plan-level default the broker's loans must elect" }
      - { name: lender_paid_amount_cents, type: integer, source: input, description: "Lender-paid compensation in cents; materialized on a loan only inside the election block for this branch" }
      - { name: borrower_paid_amount_cents, type: integer, source: input, description: "Borrower-paid compensation in cents; materialized on a loan only inside the election block for this branch" }
      - { name: is_active, type: boolean, source: input, default: true, description: "False excludes the plan from new elections; loans already decided keep their amounts" }

  - name: UnderwritingDecision
    parent: LoanSubmission
    common_fields: true
    fields:
      - { name: loan_submission_id, type: string, source: system, description: "FK -> LoanSubmission.id; the underwritten loan" }
      - { name: broker_id, type: string, source: system, description: "FK -> Broker.id; denormalized for the filtered-list read" }
      - { name: underwriter_id, type: string, source: system, description: "X-User-ID of the acting underwriter; compared against the prior decision's underwriter_id for the resubmission cooling-off rule" }
      - { name: decision_type, type: enum, source: input, description: "APPROVED | CONDITIONAL | SUSPENDED | DENIED — the branch selector for the loan's underwriting fork-join" }
      - { name: conditions, type: array, source: input, description: "Required when decision_type is CONDITIONAL; each element a free-text condition string" }
      - { name: decision_notes, type: string, source: input, description: "Free-text underwriter notes echoed into the loan's suspension reason when decision_type is SUSPENDED" }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock instant of the decision; the base for the loan's next underwriting deadline" }
      - { name: is_final, type: boolean, source: computed, default: false, description: "Set true when the loan leaves UNDERWRITING through this decision; a final decision cannot be revised" }

  - name: TurnTimeEscalation
    parent: LoanSubmission
    common_fields: true
    fields:
      - { name: loan_submission_id, type: string, source: system, description: "FK -> LoanSubmission.id; the loan whose commitment lapsed" }
      - { name: broker_id, type: string, source: system, description: "FK -> Broker.id; denormalized for the filtered-list read" }
      - { name: stage, type: enum, source: system, description: "UNDERWRITING | CLOSING — the stage whose due-at was crossed" }
      - { name: opened_at, type: datetime, source: system, description: "Logical-clock instant the escalation opened" }
      - { name: target_due_at, type: datetime, source: system, description: "The underwriting_due_at or closing_due_at that lapsed" }
      - { name: resolved_at, type: datetime, source: system, description: "Logical-clock instant of resolution; null while OPEN" }
      - { name: resolution_note, type: string, source: input, description: "Required when resolving an escalation; recorded verbatim" }
      - { name: status, type: enum, source: system, description: "OPEN | RESOLVED — OPEN on creation, RESOLVED by the resolve endpoint" }

  - name: QualityControlReview
    parent: LoanSubmission
    common_fields: true
    fields:
      - { name: loan_submission_id, type: string, source: system, description: "FK -> LoanSubmission.id; the reviewed funded loan" }
      - { name: broker_id, type: string, source: system, description: "FK -> Broker.id; the broker whose rolling_quality_score the findings debit" }
      - { name: reviewer_id, type: string, source: system, description: "X-User-ID of the acting QC reviewer from the X-User-ID header" }
      - { name: defect_type, type: enum, source: input, description: "INCOME_DISCREPANCY | UNDISCLOSED_LIABILITY | APPRAISAL_DEVIATION | TITLE_DEFECT | LICENSE_DEFECT — each with a distinct defect weight in the weighted_defect_points calculation (a NON_DEFECT review contributes 0)" }
      - { name: severity, type: enum, source: input, description: "MINOR | MAJOR | CRITICAL — scales the defect weight and sets the review's expiry tier" }
      - { name: weighted_defect_points, type: number, source: computed, description: "severity multiplier times the defect-type weight; 0.00 for a NON_DEFECT review" }
      - { name: outcome, type: enum, source: system, description: "PENDING | CLEAR | DEFECT — derived from defect_type; PENDING on create, CLEAR when defect_type is NON_DEFECT, DEFECT otherwise" }
      - { name: remediation_status, type: enum, source: system, description: "NONE | OPEN | REMEDIATED | VOIDED — NONE for CLEAR reviews; a DEFECT review is REJECTED at creation unless it arrives already REMEDIATED, and a dating-only mint correction keeps REMEDIATED while adding its weighted points to the broker" }
      - { name: repurchase_required, type: boolean, source: computed, default: false, description: "True only for a CRITICAL defect whose weighted_defect_points is at least REPURCHASE_POINTS_THRESHOLD" }
      - { name: repurchase_due_at, type: datetime, source: system, description: "created_at + REPURCHASE_WINDOW_DAYS set at creation when repurchase_required is true; null otherwise" }
      - { name: reviewed_at, type: datetime, source: system, description: "Logical-clock instant the review was created" }

# =============================================================================
# Table 2: State Machine Table  (§1.2)
# =============================================================================
state_machines:
  - entity: Broker
    initial_state: SUBMITTED
    terminal_states: [TERMINATED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: POST /wholesale-channel/brokers/{broker_id}/approve
        actor: ChannelManager
        preconditions:
          - "broker.status must be SUBMITTED (ERR_BROKER_NOT_SUBMITTED)"
          - "exclusivity_status must not be BLOCKED (ERR_BROKER_EXCLUSIVITY_BLOCKED, checked before every other business precondition)"
          - "open_defect_tier must be <= 2 (ERR_BROKER_DEFECT_HOLD)"
          - "At least one FinancialReview with status PASSED must exist (ERR_FINANCIAL_REVIEW_PENDING)"
          - "At least one BrokerLicense whose expires_on is strictly after the logical clock must exist (ERR_NO_VALID_LICENSE)"
        side_effects:
          - "status = APPROVED"
          - "tier = broker_tier(broker) — recomputed from financial_strength_score"
          - "broker.version += 1"

      - from: SUBMITTED
        to: TERMINATED
        trigger: POST /wholesale-channel/brokers/{broker_id}/terminate
        actor: ChannelManager
        preconditions:
          - "active_loan_count == 0 (ERR_ACTIVE_LOANS_PRESENT)"
        side_effects:
          - "status = TERMINATED"
          - "Every LoanSubmission of this broker in status SUBMITTED → WITHDRAWN"
          - "For each loan withdrawn by the hop above: total_active_compensation_commitment_cents -= loan.lender_paid_comp_cents"
          - "broker.version += 1"

      - from: APPROVED
        to: SUSPENDED
        trigger: "system (automatic when rolling_quality_score < 40.00, or open_defect_tier >= 5, or financial_strength_score < 40.00, or exclusivity_status == BLOCKED)"
        actor: system
        preconditions:
          - "Broker is APPROVED and at least one listed suspension trigger is true"
          - "Re-evaluated after every QualityControlReview creation, every FinancialReview decision, every exclusivity_status recompute, and every /_clock/set_current_utc"
        side_effects:
          - "status = SUSPENDED; suspended_reason records the first trigger in the listed order"
          - "Every LoanSubmission of this broker in status SUBMITTED → WITHDRAWN"
          - "For each loan withdrawn by the hop above: total_active_compensation_commitment_cents -= loan.lender_paid_comp_cents"
          - "broker.version += 1"

      - from: APPROVED
        to: SUSPENDED
        trigger: POST /wholesale-channel/brokers/{broker_id}/suspend
        actor: ChannelManager
        preconditions:
          - "Broker is APPROVED (ERR_BROKER_NOT_SUSPENDABLE)"
        side_effects:
          - "status = SUSPENDED; suspended_reason = the supplied reason"
          - "Every LoanSubmission of this broker in status SUBMITTED → WITHDRAWN"
          - "For each loan withdrawn by the hop above: total_active_compensation_commitment_cents -= loan.lender_paid_comp_cents"
          - "broker.version += 1"

      - from: SUSPENDED
        to: APPROVED
        trigger: POST /wholesale-channel/brokers/{broker_id}/reinstate
        actor: ChannelManager
        preconditions:
          - "broker.status == SUSPENDED (ERR_BROKER_NOT_SUBMITTED)"
          - "rolling_quality_score >= 60.00 (ERR_BROKER_QUALITY_BELOW_REINSTATEMENT)"
          - "open_defect_tier <= 2 (ERR_BROKER_DEFECT_HOLD)"
          - "exclusivity_status must not be BLOCKED (ERR_BROKER_EXCLUSIVITY_BLOCKED)"
        side_effects:
          - "status = APPROVED; suspended_reason = null"
          - "broker.version += 1"

      - from: APPROVED
        to: TERMINATED
        trigger: POST /wholesale-channel/brokers/{broker_id}/terminate
        actor: ChannelManager
        preconditions:
          - "active_loan_count == 0 (ERR_ACTIVE_LOANS_PRESENT)"
        side_effects:
          - "status = TERMINATED"
          - "Every LoanSubmission of this broker in status SUBMITTED → WITHDRAWN"
          - "For each loan withdrawn by the hop above: total_active_compensation_commitment_cents -= loan.lender_paid_comp_cents"
          - "broker.version += 1"

      - from: SUSPENDED
        to: TERMINATED
        trigger: POST /wholesale-channel/brokers/{broker_id}/terminate
        actor: ChannelManager
        preconditions:
          - "active_loan_count == 0 (ERR_ACTIVE_LOANS_PRESENT)"
        side_effects:
          - "status = TERMINATED"
          - "broker.version += 1"
        note: "A SUSPENDED broker has no non-terminal loans other than those already pushed to SUSPENDED_REVIEW or beyond, so no withdrawal hop fires unless a loan was revived by a reinstate/underwrite cycle."

  - entity: BrokerLicense
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (automatic when the logical clock is at or after expires_on, re-evaluated by POST /_clock/set_current_utc)"
        actor: system
        preconditions:
          - "license.status == ACTIVE and clock >= expires_on"
        side_effects:
          - "broker.licensed_states recomputed (this state_code is dropped when no other unexpired license covers it)"
          - "broker.version += 1"
        note: "Expiry never reverses an already-granted approval; it only affects subsequent submissions, quote requests and loan submissions, which re-check licensed_states."

      - from: ACTIVE
        to: REVOKED
        trigger: POST /wholesale-channel/brokers/{broker_id}/licenses/{license_id}/revoke
        actor: ComplianceOfficer
        preconditions:
          - "license.status == ACTIVE (ERR_LICENSE_NOT_REVOCABLE)"
        side_effects:
          - "status = REVOKED; revoked_at = logical clock"
          - "broker.licensed_states recomputed; broker.version += 1"
          - "CASCADE hop 1→2: every LoanSubmission of the broker whose property_state equals this license's state_code and whose status is SUBMITTED or UNDERWRITING → SUSPENDED_REVIEW with suspended_reason = LICENSE_REVOKED"
          - "CASCADE hop 2→3: for each loan moved to SUSPENDED_REVIEW by the previous hop, (a) broker.total_active_compensation_commitment_cents -= loan.lender_paid_comp_cents, and (b) every TurnTimeEscalation of that loan with status RESOLVED → OPEN with resolved_at = null and target_due_at = loan.underwriting_due_at + UNDERWRITING_EXTENSION_DAYS"

  - entity: FinancialReview
    initial_state: PENDING
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: PENDING
        to: PASSED
        trigger: POST /wholesale-channel/financial-reviews/{review_id}/decision
        actor: ChannelManager
        preconditions:
          - "review.status == PENDING (ERR_REVIEW_ALREADY_DECIDED)"
          - "review.audit_attested must be true (ERR_FINANCIAL_REVIEW_PENDING) — an unattested review can never pass"
          - "review.net_worth_cents >= NET_WORTH_FLOOR_CENTS (ERR_NET_WORTH_BELOW_MINIMUM)"
        side_effects:
          - "status = PASSED"
          - "broker.financial_strength_score = review.computed_financial_strength_score"
          - "broker.tier recomputed from the new score"
          - "Every other PASSED FinancialReview of the same broker → is_current = false; this review → is_current = true"
          - "broker.version += 1"
          - "Broker suspension triggers re-evaluated (financial_strength_score component)"

      - from: PENDING
        to: FAILED
        trigger: POST /wholesale-channel/financial-reviews/{review_id}/decision
        actor: ChannelManager
        preconditions:
          - "review.status == PENDING (ERR_REVIEW_ALREADY_DECIDED)"
        side_effects:
          - "status = FAILED; is_current stays false"
          - "broker.financial_strength_score is NOT updated by a FAILED review"
          - "broker.version += 1"

  - entity: ProductEligibility
    initial_state: PENDING
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: POST /wholesale-channel/product-eligibilities/{eligibility_id}/decision
        actor: ChannelManager
        preconditions:
          - "eligibility.status == PENDING (ERR_ELIGIBILITY_ALREADY_DECIDED)"
          - "broker.exclusivity_status must not be BLOCKED (ERR_BROKER_EXCLUSIVITY_BLOCKED)"
        side_effects:
          - "status = APPROVED; approved_at = logical clock"
          - "broker.approved_product_codes recomputed; broker.version += 1"

      - from: PENDING
        to: REVOKED
        trigger: POST /wholesale-channel/product-eligibilities/{eligibility_id}/decision
        actor: ChannelManager
        preconditions:
          - "eligibility.status == PENDING (ERR_ELIGIBILITY_ALREADY_DECIDED)"
        side_effects:
          - "status = REVOKED; broker.approved_product_codes recomputed; broker.version += 1"

  - entity: RateSheet
    initial_state: PUBLISHED
    terminal_states: [RETIRED]
    transitions:
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: POST /wholesale-channel/brokers/{broker_id}/rate-sheets (publishing a sheet for the same broker and product_code)
        actor: ChannelManager
        preconditions:
          - "A new sheet for the same (broker_id, product_code) pair has just been created with the next publish_sequence"
        side_effects:
          - "status = SUPERSEDED; superseded_by_sheet_id = new sheet id"
          - "broker.version += 1"
        note: "Repricing does not retroactively alter PricingQuote rows: every existing quote keeps its sheet and reports is_repriced = true once its publish_sequence falls behind the PUBLISHED sheet's."

      - from: PUBLISHED
        to: RETIRED
        trigger: POST /wholesale-channel/brokers/{broker_id}/rate-sheets/{sheet_id}/retire
        actor: ChannelManager
        preconditions:
          - "No PricingQuote references this sheet (ERR_SHEET_IN_USE)"
        side_effects:
          - "status = RETIRED"
          - "broker.version += 1"

      - from: SUPERSEDED
        to: RETIRED
        trigger: POST /wholesale-channel/brokers/{broker_id}/rate-sheets/{sheet_id}/retire
        actor: ChannelManager
        preconditions:
          - "No PricingQuote references this sheet (ERR_SHEET_IN_USE)"
        side_effects:
          - "status = RETIRED"
          - "broker.version += 1"

  - entity: LoanSubmission
    initial_state: SUBMITTED
    terminal_states: [FUNDED, DENIED, WITHDRAWN, REPURCHASED]
    transitions:
      - from: SUBMITTED
        to: UNDERWRITING
        trigger: POST /wholesale-channel/loan-submissions/{loan_id}/underwrite
        actor: Underwriter
        preconditions:
          - "loan.status == SUBMITTED (ERR_LOAN_NOT_SUBMITTED)"
          - "loan.compensation_election must not be UNDECIDED (ERR_COMPENSATION_ELECTION_PENDING)"
          - "broker.status == APPROVED (ERR_BROKER_NOT_APPROVED) and broker.exclusivity_status must not be BLOCKED (ERR_BROKER_EXCLUSIVITY_BLOCKED)"
        side_effects:
          - "status = UNDERWRITING"
          - "submitted_at = logical clock; underwriting_due_at = submitted_at + UNDERWRITING_TURN_DAYS"
          - "broker.active_loan_count recomputed"
          - "broker.version += 1"

      - from: UNDERWRITING
        to: CONDITIONAL_APPROVAL
        trigger: POST /wholesale-channel/underwriting-decisions (decision_type = CONDITIONAL)
        actor: Underwriter
        preconditions:
          - "loan.status == UNDERWRITING (ERR_LOAN_NOT_UNDERWRITING)"
          - "conditions must be a non-empty array (ERR_DECISION_CONDITIONS_REQUIRED)"
        side_effects:
          - "status = CONDITIONAL_APPROVAL"
          - "UnderwritingDecision created with decision_type CONDITIONAL, underwriter_id from X-User-ID, decided_at = clock"
          - "underwriting_due_at = decided_at + UNDERWRITING_TURN_DAYS"
          - "broker.version += 1"

      - from: UNDERWRITING
        to: SUSPENDED_REVIEW
        trigger: POST /wholesale-channel/underwriting-decisions (decision_type = SUSPENDED)
        actor: Underwriter
        preconditions:
          - "loan.status == UNDERWRITING (ERR_LOAN_NOT_UNDERWRITING)"
        side_effects:
          - "status = SUSPENDED_REVIEW"
          - "UnderwritingDecision created with decision_type SUSPENDED and is_final = true"
          - "CASCADE hop 1→2 (guarded): when broker.open_defect_tier >= 1, an UnderwritingDecision with decision_type SUSPENDED is auto-created carrying is_final = false and decision_notes = 'QC_DEFECT_HOLD'"
          - "CASCADE hop 2→3 (conditional on the guarded hop above): that auto-created decision flips loan.underwriting_due_at to clock + OPEN_DEFECT_DEADLINE_DAYS and sets broker.suspended_reason only when the auto-created decision was the first row for this loan"
          - "broker.version += 1"

      - from: CONDITIONAL_APPROVAL
        to: CLEAR_TO_CLOSE
        trigger: POST /wholesale-channel/loan-submissions/{loan_id}/clear-to-close
        actor: Underwriter
        preconditions:
          - "loan.status == CONDITIONAL_APPROVAL (ERR_LOAN_NOT_CONDITIONAL)"
          - "loan.defect_remediation_open must be false (ERR_DEFECT_REMEDIATION_OPEN)"
          - "No TurnTimeEscalation of this loan with status OPEN and stage CLOSING (ERR_CLOSING_ESCALATION_OPEN)"
        side_effects:
          - "status = CLEAR_TO_CLOSE; cleared_at = logical clock; closing_due_at = cleared_at + CLOSING_TURN_DAYS"
          - "closing_path = ESCALATION_PATH when any TurnTimeEscalation of this loan (any stage, any status) exists at this instant, otherwise STANDARD_PATH"
          - "broker.version += 1"

      - from: CLEAR_TO_CLOSE
        to: FUNDED
        trigger: POST /wholesale-channel/loan-submissions/{loan_id}/fund
        actor: Underwriter
        preconditions:
          - "loan.status == CLEAR_TO_CLOSE (ERR_LOAN_NOT_CLEAR_TO_CLOSE)"
          - "loan.defect_remediation_open must be false (ERR_DEFECT_REMEDIATION_OPEN)"
          - "No TurnTimeEscalation of this loan with status OPEN (ERR_CLOSING_ESCALATION_OPEN)"
          - "broker.status == APPROVED (ERR_BROKER_NOT_APPROVED)"
        side_effects:
          - "status = FUNDED"
          - "broker.rolling_funded_volume_cents += loan.loan_amount_cents"
          - "broker.active_loan_count recomputed; broker.version += 1"
          - "No QualityControlReview is created by funding; funding only makes the loan eligible for a later QC review"

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: POST /wholesale-channel/loan-submissions/{loan_id}/withdraw
        actor: BrokerUser
        preconditions:
          - "loan.status must be SUBMITTED, UNDERWRITING or CONDITIONAL_APPROVAL (ERR_LOAN_NOT_WITHDRAWABLE)"
        side_effects:
          - "status = WITHDRAWN"
          - "broker.total_active_compensation_commitment_cents -= loan.lender_paid_comp_cents"
          - "broker.active_loan_count recomputed; broker.version += 1"

      - from: UNDERWRITING
        to: WITHDRAWN
        trigger: POST /wholesale-channel/loan-submissions/{loan_id}/withdraw
        actor: BrokerUser
        preconditions:
          - "loan.status must be SUBMITTED, UNDERWRITING or CONDITIONAL_APPROVAL (ERR_LOAN_NOT_WITHDRAWABLE)"
        side_effects:
          - "status = WITHDRAWN"
          - "broker.total_active_compensation_commitment_cents -= loan.lender_paid_comp_cents"
          - "broker.active_loan_count recomputed; broker.version += 1"

      - from: CONDITIONAL_APPROVAL
        to: WITHDRAWN
        trigger: POST /wholesale-channel/loan-submissions/{loan_id}/withdraw
        actor: BrokerUser
        preconditions:
          - "loan.status must be SUBMITTED, UNDERWRITING or CONDITIONAL_APPROVAL (ERR_LOAN_NOT_WITHDRAWABLE)"
        side_effects:
          - "status = WITHDRAWN"
          - "broker.total_active_compensation_commitment_cents -= loan.lender_paid_comp_cents"
          - "broker.active_loan_count recomputed; broker.version += 1"

      - from: FUNDED
        to: REPURCHASED
        trigger: POST /wholesale-channel/quality-control-reviews/{review_id}/repurchase
        actor: QualityControlAnalyst
        preconditions:
          - "review.status is DEFECT and review.repurchase_required is true (ERR_REPURCHASE_NOT_REQUIRED)"
          - "logical clock <= review.repurchase_due_at (ERR_REPURCHASE_WINDOW_EXPIRED)"
          - "No other QualityControlReview of the same loan already has status REPURCHASED (ERR_LOAN_ALREADY_REPURCHASED)"
        side_effects:
          - "loan.status = REPURCHASED"
          - "loan.repurchase_exposure_cents = (broker.rolling_funded_volume_cents * loan.loan_amount_cents) / (broker.rolling_funded_volume_cents + loan.loan_amount_cents) + loan.loan_amount_cents / 2, summed full precision then rounded once half-up to an integer number of cents"
          - "broker.rolling_funded_volume_cents -= loan.loan_amount_cents"
          - "broker.active_loan_count recomputed; broker.version += 1"

  - entity: TurnTimeEscalation
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: null
        to: OPEN
        trigger: "system (automatic at POST /_clock/set_current_utc when clock >= loan.underwriting_due_at and loan.status is UNDERWRITING or CONDITIONAL_APPROVAL, or clock >= loan.closing_due_at and loan.status is CLEAR_TO_CLOSE)"
        actor: system
        preconditions:
          - "No TurnTimeEscalation already exists for the same loan_id, stage and status OPEN"
        side_effects:
          - "TurnTimeEscalation created with stage UNDERWRITING or CLOSING, opened_at = clock, target_due_at = the lapsed due-at, status OPEN"

      - from: OPEN
        to: RESOLVED
        trigger: POST /wholesale-channel/turn-time-escalations/{escalation_id}/resolve
        actor: ChannelManager
        preconditions:
          - "escalation.status == OPEN (ERR_ESCALATION_ALREADY_RESOLVED)"
          - "resolution_note must be present and at least 10 characters (ERR_INVALID_REQUEST)"
        side_effects:
          - "status = RESOLVED; resolved_at = logical clock; resolution_note recorded"
          - "When stage == UNDERWRITING and the loan's status is UNDERWRITING or CONDITIONAL_APPROVAL: loan.underwriting_due_at = clock + UNDERWRITING_TURN_DAYS"
          - "No other loan field changes: a resolved escalation never rewrites closing_path, which is a snapshot taken at CLEAR_TO_CLOSE"

      - from: RESOLVED
        to: OPEN
        trigger: "system (reopened by the BrokerLicense revocation cascade hop 2→3)"
        actor: system
        preconditions:
          - "The owning loan was pushed to SUSPENDED_REVIEW by a license revocation whose state_code equals the loan's property_state"
        side_effects:
          - "status = OPEN; resolved_at = null; target_due_at = loan.underwriting_due_at + UNDERWRITING_EXTENSION_DAYS"

  - entity: QualityControlReview
    initial_state: PENDING
    terminal_states: [VOIDED]
    transitions:
      - from: PENDING
        to: CLEAR
        trigger: "system (automatic at creation when defect_type is NON_DEFECT)"
        actor: system
        preconditions:
          - "loan.status is one of FUNDED, CLEAR_TO_CLOSE, REPURCHASED, CONDITIONAL_APPROVAL"
        side_effects:
          - "outcome = CLEAR; remediation_status = NONE; weighted_defect_points = 0.00"
          - "No QualityControlReview may already exist for this loan (ERR_QC_REVIEW_EXISTS), which is why the later mint correction travels through the resolve endpoint rather than a second review"

      - from: PENDING
        to: DEFECT
        trigger: "system (automatic at creation when defect_type is not NON_DEFECT)"
        actor: system
        preconditions:
          - "remediation_status supplied at creation must be NONE or REMEDIATED (ERR_INVALID_REQUEST otherwise); a defect review is never created with remediation_status OPEN"
        side_effects:
          - "outcome = DEFECT; weighted_defect_points = severity multiplier × defect weight"
          - "CASCADE hop 1→2: broker.rolling_quality_score = max(0.00, broker.rolling_quality_score - weighted_defect_points × defect_multiplier(broker.open_defect_tier at the time the finding is counted))"
          - "CASCADE hop 1→2 (guarded): when remediation_status == OPEN, broker.open_defect_tier += 1"
          - "CASCADE hop 2→3 (conditional on the guarded hop above): when open_defect_tier >= 1, loan.defect_remediation_open = true, and when the loan's status is CLEAR_TO_CLOSE or CONDITIONAL_APPROVAL that flip is what makes the subsequent fund / clear-to-close call fail with ERR_DEFECT_REMEDIATION_OPEN"
          - "CASCADE hop 2→3 (independent branch): when weighted_defect_points >= REPURCHASE_POINTS_THRESHOLD and severity == CRITICAL, repurchase_required = true and repurchase_due_at = reviewed_at + REPURCHASE_WINDOW_DAYS"
          - "CASCADE hop 2→3 (independent branch): when the loan's status is CLEAR_TO_CLOSE, loan → SUSPENDED_REVIEW; when the loan's status is CONDITIONAL_APPROVAL it stays and is gated by the remediation flag"
          - "broker.version += 1; suspension triggers re-evaluated"

      - from: DEFECT
        to: REMEDIATED
        trigger: POST /wholesale-channel/quality-control-reviews/{review_id}/resolve with resolution_type = REMEDIATED
        actor: QualityControlAnalyst
        preconditions:
          - "review.remediation_status == OPEN (ERR_INVALID_REQUEST otherwise)"
        side_effects:
          - "remediation_status = REMEDIATED"
          - "broker.open_defect_tier -= 1"
          - "When the loan's defect_remediation_open was set by this finding and no other OPEN finding remains on the loan: loan.defect_remediation_open = false"
          - "broker.version += 1"

      - from: DEFECT
        to: CLEAR
        trigger: POST /wholesale-channel/quality-control-reviews/{review_id}/resolve with resolution_type = REMEDIATED on a dating-only mint correction
        actor: QualityControlAnalyst
        preconditions:
          - "The review was created with remediation_status = REMEDIATED"
        side_effects:
          - "remediation_status stays REMEDIATED; outcome is unchanged at DEFECT"
          - "broker.rolling_quality_score = max(0.00, broker.rolling_quality_score - weighted_defect_points × defect_multiplier(broker.open_defect_tier))"
          - "loan.defect_remediation_open = true"

      - from: CLEAR
        to: VOIDED
        trigger: POST /wholesale-channel/quality-control-reviews/{review_id}/resolve with resolution_type = VOIDED
        actor: QualityControlAnalyst
        preconditions:
          - "review.remediation_status == NONE (ERR_INVALID_REQUEST otherwise)"
        side_effects:
          - "remediation_status = VOIDED"
          - "broker.rolling_quality_score = min(100.00, broker.rolling_quality_score + weighted_defect_points × defect_multiplier(broker.open_defect_tier)); 0.00 for a NON_DEFECT review, so the value is unchanged"
          - "broker.version += 1"
        note: "Freezing a CLEAR review and voiding it must leave rolling_quality_score exactly where it started."

      - from: DEFECT
        to: VOIDED
        trigger: POST /wholesale-channel/quality-control-reviews/{review_id}/resolve with resolution_type = VOIDED
        actor: QualityControlAnalyst
        preconditions:
          - "review.status == DEFECT (ERR_INVALID_REQUEST otherwise)"
        side_effects:
          - "remediation_status = VOIDED"
          - "broker.rolling_quality_score = min(100.00, broker.rolling_quality_score + weighted_defect_points × defect_multiplier(broker.open_defect_tier))"
          - "When the voided finding's prior remediation_status was OPEN: broker.open_defect_tier -= 1, and when no other OPEN finding remains on the loan, loan.defect_remediation_open = false"
          - "When the voided finding's prior remediation_status was REMEDIATED: open_defect_tier is unchanged"
          - "broker.version += 1"

  - entity: CompensationPlan
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: PUT /wholesale-channel/compensation-plans/{plan_id}
        actor: ChannelManager
        preconditions:
          - "plan.is_active == true (ERR_INVALID_REQUEST otherwise)"
          - "At least one other CompensationPlan of the same broker must remain active (ERR_LAST_ACTIVE_COMPENSATION_PLAN)"
        side_effects:
          - "is_active = false"
          - "Loans already decided keep their lender_paid_comp_cents / borrower_paid_comp_cents and rate_impact_pct"

      - from: INACTIVE
        to: ACTIVE
        trigger: PUT /wholesale-channel/compensation-plans/{plan_id}
        actor: ChannelManager
        preconditions:
          - "plan.is_active == false"
        side_effects:
          - "is_active = true"

# =============================================================================
# Concurrency Rules  (§1.2.1) — true races only, all resolved via OCC on the
# parent's version field.
# =============================================================================
concurrency_rules:
  - rule_id: loan-underwrite-stale-broker
    parent_entity: Broker
    write_endpoint: "POST /wholesale-channel/loan-submissions/{loan_id}/underwrite"
    occ_field: "expected_broker_version"
    description: |
      Moving a loan into underwriting against a Broker whose version has
      advanced since the client last read it is rejected. The broker's
      version advances on every license revocation, every QC defect finding,
      every financial-review decision and every exclusivity escalation, all
      of which legitimately change the broker's standing while the client
      still holds the earlier snapshot; the write is refused rather than
      silently applied against stale broker facts.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: eligibility-decision-stale-broker
    parent_entity: Broker
    write_endpoint: "POST /wholesale-channel/product-eligibilities/{eligibility_id}/decision"
    occ_field: "expected_broker_version"
    description: |
      Approving or revoking a product eligibility against a Broker version
      the client has already observed as advanced is rejected, because
      broker.approved_product_codes is derived from the full set of
      eligibility decisions and the caller's view of that set is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: quote-supersede-stale-sheet
    parent_entity: RateSheet
    write_endpoint: "POST /wholesale-channel/rate-sheets/{sheet_id}/pricing-quotes"
    occ_field: "expected_rate_sheet_version"
    description: |
      The product allows a broker to price a second quote off a sheet that
      has already been priced against, with the newer quote superseding the
      prior one for the same loan purpose, so a sequential second call is
      not rejected on state alone. The write is refused when the RateSheet
      version the client observed has advanced, because publishing a
      replacement sheet or retiring this one mutates sheet-level fields
      that the quote inherits.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table  (§1.3)
# =============================================================================
calculations:
  - name: broker_financial_strength_score
    trigger: "FinancialReview creation (records computed_financial_strength_score) and FinancialReview decision (installs it on the Broker)"
    algorithm: weighted_scoring
    formula: |
      net_worth_component  = min(1.0, net_worth_cents / NET_WORTH_TARGET_CENTS) * 40
      liquidity_component  = min(1.0, liquidity_cents / LIQUIDITY_TARGET_CENTS) * 30
      leverage_denominator = max(1, net_worth_cents * LEVERAGE_CAP_RATIO)
      leverage_component   = max(0.0, 1.0 - total_liabilities_cents / leverage_denominator) * 20
      experience_component = min(1.0, years_in_business / EXPERIENCE_TARGET_YEARS) * 10
      raw   = net_worth_component + liquidity_component + leverage_component + experience_component
      scored = round_half_up(clamp(raw, 0.0, 100.0), 2)

      Volume attainment is scored separately and never feeds `scored`:
      attainment_ratio = prior_year_funded_volume_cents / broker.volume_expectation_cents
      band = MEETS_EXPECTATION when attainment_ratio >= 1.0
             NEAR_EXPECTATION  when attainment_ratio >= 0.75
             BELOW_EXPECTATION otherwise
      band_score = MEETS_EXPECTATION -> 100, NEAR_EXPECTATION -> 75, BELOW_EXPECTATION -> 40
    input_set: "The single FinancialReview row being evaluated, plus its broker's volume_expectation_cents"
    constants:
      NET_WORTH_TARGET_CENTS: 100000000
      LIQUIDITY_TARGET_CENTS: 40000000
      LEVERAGE_CAP_RATIO: 3.0
      EXPERIENCE_TARGET_YEARS: 5
      NET_WORTH_FLOOR_CENTS: 25000000
      ATTAINMENT_MEETS_RATIO: 1.0
      ATTAINMENT_NEAR_RATIO: 0.75
    precision: "2 decimal places, round_half_up, clamped to [0.00, 100.00]"
    variants:
      - name: lender_basis_pending_review
        when: "Pinned behaviour. The score is computed and stored on the FinancialReview as computed_financial_strength_score at creation, but broker.financial_strength_score is only overwritten at PASSED decision time."
        difference: "A PENDING review leaves broker.financial_strength_score unchanged even though its own computed score is visible on the review row."
      - name: broker_declared_basis
        when: "Rejected interpretation. Installing the declared score on the broker as soon as the review row is created."
        difference: "Same numbers, different broker.financial_strength_score at the same instant; an unattested or floor-breaching review would move the broker's tier before any decision."

  - name: broker_tier
    trigger: "Broker approval, broker reinstatement, and every change to broker.financial_strength_score"
    algorithm: threshold
    formula: |
      if financial_strength_score >= 85.00: tier = TIER_1
      elif financial_strength_score >= 60.00: tier = TIER_2
      elif financial_strength_score >= 40.00: tier = TIER_3
      else: tier = UNRATED

      Volume cap applied after banding: when the most recent PASSED FinancialReview's band
      is not MEETS_EXPECTATION, a computed TIER_1 is capped down to TIER_2. A TIER_2 or
      TIER_3 result is never capped upward.
      With no PASSED review on file: tier = UNRATED.
    input_set: "broker.financial_strength_score and the band of the broker's is_current PASSED FinancialReview"
    constants:
      TIER_1_MIN_SCORE: 85.00
      TIER_2_MIN_SCORE: 60.00
      TIER_3_MIN_SCORE: 40.00
    precision: "thresholds compared at 2 decimals, half-up rounded before comparison"

  - name: overall_rate_adjustment
    trigger: "PricingQuote creation"
    algorithm: tiered_pricing
    formula: |
      Evaluate the four dimensions in this pinned order and sum in this order:
        credit_row    = RateSheet.adjustment_table row with dim == credit   whose bucket contains representative_fico
        ltv_row       = RateSheet.adjustment_table row with dim == ltv      whose bucket contains ltv_ratio
        occupancy_row = RateSheet.adjustment_table row with dim == occupancy whose bucket equals occupancy_type
        product_row   = RateSheet.adjustment_table row with dim == product   whose bucket equals product_code
      overall_adjustment_pct = credit_row.adjust_pct + ltv_row.adjust_pct
                             + occupancy_row.adjust_pct + product_row.adjust_pct

      Buckets are half-open except the last: credit [760,inf), [740,760), [720,740), [700,720),
      [680,700), (-inf,680). ltv (-inf,0.60], (0.60,0.70], (0.70,0.80], (0.80,0.90],
      (0.90,0.95], (0.95,inf). loan_purpose is deliberately NOT a dimension: it does not
      appear in overall_adjustment_pct, note_rate_pct or the adjustment_trace.
    input_set: "The quote's representative_fico, ltv_ratio, occupancy_type, product_code and the rate sheet's adjustment_table"
    constants:
      CREDIT_BUCKETS: "760-plus:-0.125, 740-759:-0.050, 720-739:0.000, 700-719:0.125, 680-699:0.250, under-680:0.500"
      LTV_BUCKETS: "up-to-60:0.000, 60-70:0.050, 70-80:0.125, 80-90:0.250, 90-95:0.375, over-95:0.500"
      OCCUPANCY_BUCKETS: "PRIMARY_RESIDENCE:0.000, SECOND_HOME:0.250, INVESTMENT:0.500"
      PRODUCT_BUCKETS: "CONVENTIONAL:0.000, FHA:0.125, VA:-0.125, JUMBO:0.375, USDA:0.250"
    precision: "3 decimal places, round_half_up, applied once to the summed value only at note_rate_pct"

  - name: pricing_quote_note_rate
    trigger: "PricingQuote creation"
    algorithm: threshold
    formula: |
      lock_adjustment_pct = LOCK_SURCHARGE_15D when lock_period_days < 30
                            LOCK_SURCHARGE_30D when 30 <= lock_period_days < 60
                            LOCK_SURCHARGE_60D when lock_period_days >= 60
      raw = rate_sheet.base_rate_pct + overall_adjustment_pct + lock_adjustment_pct
      note_rate_pct = round_half_up(raw, 3)

      PINNED ROUNDING ORDER: the three components are summed at full float precision and
      rounded exactly once. Never round base_rate_pct or overall_adjustment_pct first.
    input_set: "The quote's rate sheet base rate, its four-dimension adjustment total, and its lock bucket"
    constants:
      LOCK_SURCHARGE_15D: 0.125
      LOCK_SURCHARGE_30D: 0.000
      LOCK_SURCHARGE_60D: -0.125
      LOCK_BOUNDARY_SHORT_DAYS: 30
      LOCK_BOUNDARY_LONG_DAYS: 60
    precision: "3 decimal places, round_half_up, single rounding at the end"
    variants:
      - name: sum_then_round
        when: "Pinned behaviour. Raw sum rounded once."
        difference: "base 6.125 + adjustment 0.125 + lock 0.125 = 6.375 exactly."
      - name: round_per_component
        when: "Rejected interpretation. Each component rounded to 3 decimals before summing."
        difference: "For base 6.125 + adjustment 0.500 + lock 0.125 the two orders agree at 6.750, but summing a repeating term such as base 6.1241667 yields 6.749 under sum_then_round and 6.749 under per-component rounding only by luck; the scaffold pins sum_then_round so the tie-break is not left to float noise."

  - name: pricing_quote_price_points
    trigger: "PricingQuote creation"
    algorithm: tiered_pricing
    formula: |
      step 1: fico_bucket = round_half_up(representative_fico, -1)
      step 2: ltv_band = ltv_band_label(ltv_ratio) using the same half-open bands as overall_rate_adjustment
      step 3: base_points = PRICE_TABLE[fico_bucket][ltv_band]
      step 4: provisional_points = base_points + overall_adjustment_pct
      step 5: tier = PLATINUM when provisional_points <= -0.50
                     GOLD     when provisional_points <= 0.00
                     SILVER   when provisional_points <= 0.50
                     BRONZE   otherwise
      step 6: discount_pct = TIER_DISCOUNT[tier]
      step 7: price_points = round_half_up(provisional_points + discount_pct, 3)

      EVALUATION ORDER IS PINNED AND CIRCULAR LOOKING: the discount is keyed on the tier of
      the PROVISIONAL (pre-discount) point value, so step 5 always reads step 4's output and
      the final price never re-enters step 5. A quote at exactly provisional_points = -0.50 is
      PLATINUM (inclusive); a quote at exactly 0.00 is GOLD (inclusive); 0.50 is SILVER.
    input_set: "The quote's representative_fico, ltv_ratio and overall_adjustment_pct, priced against the immutable base grid"
    constants:
      PRICE_TABLE: "fico 760+: {-1.00,-0.75,-0.50,-0.25,0.00,0.25} by ltv band; fico 740: {-0.75,-0.50,-0.25,0.00,0.25,0.50}; fico 720: {-0.50,-0.25,0.00,0.25,0.50,0.75}; fico 700: {-0.25,0.00,0.25,0.50,0.75,1.00}; fico 680: {0.00,0.25,0.50,0.75,1.00,1.25}; fico 660: {0.25,0.50,0.75,1.00,1.25,1.50}; fico under 660: {0.50,0.75,1.00,1.25,1.50,1.75}"
      TIER_DISCOUNT: "PLATINUM:-0.25, GOLD:-0.10, SILVER:0.000, BRONZE:0.25"
      PLATINUM_MAX_POINTS: -0.50
      GOLD_MAX_POINTS: 0.00
      SILVER_MAX_POINTS: 0.50
    precision: "3 decimal places, round_half_up"
    variants:
      - name: base_grid_plus_adjustment
        when: "Pinned behaviour. The quote snapshots its own sheet's base grid at creation."
        difference: "An intraday reprice leaves the existing quote's price_points unchanged."
      - name: yield_based_reprice
        when: "Rejected interpretation. Recompute the base from the broker's current PUBLISHED sheet at read time."
        difference: "Same quote row returns different price_points before and after a reprice; the scaffold pins base_grid_plus_adjustment and exposes the staleness through is_repriced instead."

  - name: compensation_split
    trigger: "Compensation election on a loan submission"
    algorithm: waterfall_allocation
    formula: |
      plan = the ACTIVE CompensationPlan of the loan's broker whose plan_code == loan.comp_plan_id
      if compensation_election == LENDER_PAID:
          lender_paid_comp_cents   = plan.lender_paid_amount_cents
          borrower_paid_comp_cents = 0
      elif compensation_election == BORROWER_PAID:
          lender_paid_comp_cents   = 0
          borrower_paid_comp_cents = plan.borrower_paid_amount_cents
      else:
          lender_paid_comp_cents   = 0
          borrower_paid_comp_cents = 0
      rate_impact_pct = 0.000 when the election equals plan.default_election
                      = +0.250 when LENDER_PAID is elected and the default is BORROWER_PAID
                      = -0.250 when BORROWER_PAID is elected and the default is LENDER_PAID
                      = 0.000 while the election is UNDECIDED
      final_note_rate_pct = round_half_up(quote.note_rate_pct + rate_impact_pct, 3) when decided
                          = quote.note_rate_pct when UNDECIDED
    input_set: "The loan's compensation_election and comp_plan_id, the referenced immutable PricingQuote, and the plan's amounts and default"
    constants:
      LENDER_PAID_RATE_IMPACT: 0.250
      BORROWER_PAID_RATE_IMPACT: -0.250
    precision: "rate impact at 3 decimal places, round_half_up"

  - name: repurchase_exposure
    trigger: "QC repurchase of a FUNDED loan"
    algorithm: waterfall_allocation
    formula: |
      f = loan.loan_amount_cents
      v = broker.rolling_funded_volume_cents measured BEFORE this repurchase decrements it
      volume_share_reversal = (v * f) / (v + f)
      origination_fee_reversal = f / 2
      repurchase_exposure_cents = round_half_up(volume_share_reversal + origination_fee_reversal, 0)

      ORDER IS PINNED: v is read before the volume decrement, and the two reversals are
      summed at full precision and rounded exactly once to whole cents.
      CONSERVED IDENTITY: the compensating quantity conserved by the repurchase is the loan's
      funded contribution measured on the pair (loan_amount_cents f, rolling_funded_volume v):
      pair_fraction(f) + volume_share_reversal == f, where pair_fraction(f) = f - (v*f)/(v+f).
    input_set: "The funded loan's loan_amount_cents and its broker's rolling_funded_volume_cents before the decrement"
    constants:
      ORIGINATION_FEE_SHARE: 0.5
    precision: "whole cents, round_half_up, single rounding at the end"
    variants:
      - name: compensating_reversal
        when: "Pinned behaviour. Loan-representative share (v*f)/(v+f) plus half the loan amount."
        difference: "Preserves the pair invariant volume_share_reversal + pair_fraction(f) == f exactly."
      - name: flat_reversal
        when: "Rejected interpretation. Charge the entire loan_amount_cents back to the broker."
        difference: "For f = 40000000 and v = 60000000 the pinned exposure is (60000000*40000000)/100000000 + 20000000 = 44000000, while the flat interpretation charges 40000000 — a 4000000 cent divergence for identical inputs."

  - name: lock_adjustment
    trigger: "PricingQuote creation"
    algorithm: threshold
    formula: |
      lock_period_days < 30            -> LOCK_SURCHARGE_15D
      30 <= lock_period_days < 60      -> LOCK_SURCHARGE_30D
      lock_period_days >= 60           -> LOCK_SURCHARGE_60D
    input_set: "The quote's lock_period_days"
    constants:
      LOCK_SURCHARGE_15D: 0.125
      LOCK_SURCHARGE_30D: 0.000
      LOCK_SURCHARGE_60D: -0.125
      LOCK_BOUNDARY_SHORT_DAYS: 30
      LOCK_BOUNDARY_LONG_DAYS: 60
    precision: "3 decimal places"

  - name: weighted_defect_points
    trigger: "QualityControlReview creation"
    algorithm: weighted_scoring
    formula: |
      base = DEFECT_WEIGHTS[defect_type]        # NON_DEFECT -> 0.00
      weighted_defect_points = round_half_up(base * SEVERITY_MULTIPLIERS[severity], 2)
      repurchase_required = (severity == CRITICAL) and (weighted_defect_points >= REPURCHASE_POINTS_THRESHOLD)
    input_set: "The review's defect_type and severity"
    constants:
      DEFECT_WEIGHTS: "INCOME_DISCREPANCY:8.00, UNDISCLOSED_LIABILITY:5.00, APPRAISAL_DEVIATION:6.00, TITLE_DEFECT:7.00, LICENSE_DEFECT:10.00, NON_DEFECT:0.00"
      SEVERITY_MULTIPLIERS: "MINOR:0.50, MAJOR:1.00, CRITICAL:1.50"
      REPURCHASE_POINTS_THRESHOLD: 12.00
    precision: "2 decimal places, round_half_up"

  - name: defect_multiplier
    trigger: "Every change to broker.open_defect_tier"
    algorithm: threshold
    formula: |
      open_defect_tier 0        -> 1.00
      open_defect_tier 1        -> 1.25
      open_defect_tier 2        -> 1.50
      open_defect_tier 3        -> 2.00
      open_defect_tier >= 4     -> 2.50
      The multiplier is read at the instant a finding is counted; later tier changes never
      retroactively restate the debit already applied to rolling_quality_score.
    input_set: "broker.open_defect_tier"
    constants:
      TIER_MULTIPLIERS: "0:1.00, 1:1.25, 2:1.50, 3:2.00, 4-plus:2.50"
    precision: "2 decimal places, round_half_up"

  - name: exclusivity_status_derivation
    trigger: "Every ExclusivityBreach recording and every exclusivity-policy change"
    algorithm: threshold
    formula: |
      breached_policies = count of distinct ExclusivityPolicy of this broker (status ACTIVE or
                          SUPERSEDED) that have breach_count >= 1
      breached_policies == 0 -> exclusivity_status = CLEAR
      breached_policies == 1 -> exclusivity_status = WARNED
      breached_policies == 2 -> exclusivity_status = RESTRICTED
      breached_policies >= 3 -> exclusivity_status = BLOCKED
    input_set: "ExclusivityPolicy rows of the broker with breach_count >= 1"
    constants:
      WARNED_AT_BREACHED_POLICIES: 1
      RESTRICTED_AT_BREACHED_POLICIES: 2
      BLOCKED_AT_BREACHED_POLICIES: 3
    precision: "integer counts, cohort filter: policies with breach_count >= 1"

  - name: licensed_states_reconciliation
    trigger: "BrokerLicense create, BrokerLicense revocation, BrokerLicense expiry, and every /_clock/set_current_utc"
    algorithm: aggregation
    formula: |
      licensed_states = distinct sorted state_code values over licenses where
                        status == ACTIVE and expires_on > logical clock
      Sorted ascending by state_code. Expired and REVOKED licenses never contribute, even
      when a later license of the same state is still valid.
    input_set: "The broker's BrokerLicense rows, filtered by status and expiry against the logical clock"
    constants: {}
    precision: "exact set equality, ascending state_code order"

  - name: funded_volume_rollup
    trigger: "Loan funding and loan repurchase"
    algorithm: aggregation
    formula: |
      on FUNDED:       rolling_funded_volume_cents += loan.loan_amount_cents
      on REPURCHASED:  rolling_funded_volume_cents -= loan.loan_amount_cents
      Cohort: every loan of the broker whose status is FUNDED or REPURCHASED contributes
      exactly once across its lifetime; SUBMITTED/UNDERWRITING/CONDITIONAL_APPROVAL/
      SUSPENDED_REVIEW/CLEAR_TO_CLOSE/DENIED/WITHDRAWN loans contribute zero.
    input_set: "The broker's LoanSubmission rows"
    constants: {}
    precision: "integer cents"

  - name: compensation_commitment_reconciliation
    trigger: "Loan submission, loan cancellation, loan withdrawal, broker suspension and broker termination"
    algorithm: aggregation
    formula: |
      total_active_compensation_commitment_cents =
        sum(loan.lender_paid_comp_cents) over the broker's loans whose status is
        SUBMITTED, UNDERWRITING or CONDITIONAL_APPROVAL
      BORROWER_PAID loans contribute 0 because their lender_paid_comp_cents is 0.
      INVARIANT (submission direction): submitting one LENDER_PAID loan and then withdrawing
      it leaves total_active_compensation_commitment_cents exactly at its pre-submission value.
      INVARIANT (broker-wide direction): the sum of rolling_funded_volume_cents and the
      current-age volume still in suspension cannot exceed the broker's lifetime funded
      volume plus loans in flight; the reconciliation endpoint reports the difference as
      commitment_drift_cents, which must be 0 after any compensating sequence.
    input_set: "The broker's loans in SUBMITTED, UNDERWRITING or CONDITIONAL_APPROVAL"
    constants: {}
    precision: "integer cents"

  - name: turn_time_commitments
    trigger: "Loan submission, underwrite, every underwriting decision, clear-to-close, escalation resolution and license-revocation cascade"
    algorithm: forward_looking
    formula: |
      underwriting_due_at = the instant of the loan's most recent entry into UNDERWRITING,
                            CONDITIONAL_APPROVAL or SUSPENDED_REVIEW, plus UNDERWRITING_TURN_DAYS
      closing_due_at      = the instant the loan reached CLEAR_TO_CLOSE, plus CLOSING_TURN_DAYS
      Reopened escalation target_due_at = loan.underwriting_due_at + UNDERWRITING_EXTENSION_DAYS
      Auto-created QC defect-hold decision resets underwriting_due_at to
                            the decision instant + OPEN_DEFECT_DEADLINE_DAYS
      repurchase_due_at   = QC review creation instant + REPURCHASE_WINDOW_DAYS
      A TurnTimeEscalation opens the first time the logical clock reaches or passes the
      relevant due-at while the loan sits in the matching stage. EARLY_FUNDING_CUTOFF_UTC is
      a fixed reference instant carried in the constants for reproducibility of the rounded
      base rates in fixtures; it is not a business deadline and no rule reads it.
    input_set: "The loan's status, its most recent stage-entry instant, and the logical clock"
    constants:
      UNDERWRITING_TURN_DAYS: 10
      CLOSING_TURN_DAYS: 7
      UNDERWRITING_EXTENSION_DAYS: 5
      OPEN_DEFECT_DEADLINE_DAYS: 3
      REPURCHASE_WINDOW_DAYS: 30
      EARLY_FUNDING_CUTOFF_UTC: "2026-09-01T00:00:00Z"
    precision: "whole days added to an ISO 8601 instant, preserving the time of day"

  - name: active_loan_count_derivation
    trigger: "Loan submission, withdrawal, underwrite, clear-to-close, fund, resubmission, and every cascade that moves a loan between statuses"
    algorithm: aggregation
    formula: |
      active_loan_count = count of the broker's LoanSubmission rows whose status is in
      {SUBMITTED, UNDERWRITING, CONDITIONAL_APPROVAL, SUSPENDED_REVIEW, CLEAR_TO_CLOSE}
      FUNDED, DENIED, WITHDRAWN and REPURCHASED loans never contribute.
    input_set: "The broker's LoanSubmission rows"
    constants: {}
    precision: "integer count"

  - name: broker_suspension_triggers
    trigger: "Every mutation that changes broker.rolling_quality_score, broker.open_defect_tier, broker.financial_strength_score or broker.exclusivity_status, and every /_clock/set_current_utc"
    algorithm: threshold
    formula: |
      Broker is APPROVED and moves to SUSPENDED when ANY of, evaluated in this first-match order
      (suspended_reason records the first that is true):
        1. rolling_quality_score < 40.00                     -> SUSPENSION_REASON QUALITY
        2. open_defect_tier >= 5                              -> SUSPENSION_REASON DEFECTS
        3. financial_strength_score < 40.00                   -> SUSPENSION_REASON FINANCIAL
        4. exclusivity_status == BLOCKED                      -> SUSPENSION_REASON EXCLUSIVITY
      INVARIANT (compensating, broker-wide): bringing rolling_quality_score and
      financial_strength_score back to at least 60.00, open_defect_tier to at most 2 and
      exclusivity_status to CLEAR and then calling the reinstate endpoint restores the broker
      to APPROVED, and the broker's active_loan_count, rolling_funded_volume_cents and
      total_active_compensation_commitment_cents are exactly the values they held immediately
      before the suspension transition. The system adds nothing and removes nothing.
    input_set: "The broker's four derived fields"
    constants:
      QUALITY_SUSPENSION_THRESHOLD: 40.00
      DEFECT_SUSPENSION_TIER: 5
      FINANCIAL_SUSPENSION_THRESHOLD: 40.00
      REINSTATEMENT_QUALITY_THRESHOLD: 60.00
      REINSTATEMENT_DEFECT_TIER: 2
    precision: "comparisons at 2 decimals for scores, integer thresholds for tier and counts"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)  (§1.4)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and name a declared role"
    error_id: ERR_MISSING_USER_CONTEXT
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "The X-User-Role value must be permitted for the endpoint per §1.5 roles and §1.7 matrix"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Referenced resources must exist, checked left to right in the order the endpoint's input list declares them"
    error_id: "ERR_BROKER_NOT_FOUND / ERR_RATE_SHEET_NOT_FOUND / ERR_QUOTE_NOT_FOUND / ERR_LOAN_NOT_FOUND / ERR_LICENSE_NOT_FOUND / ERR_REVIEW_NOT_FOUND / ERR_ELIGIBILITY_NOT_FOUND / ERR_PLAN_NOT_FOUND / ERR_ESCALATION_NOT_FOUND"
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: concurrency
    check: "expected_broker_version must equal Broker.version on the two Broker-guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /wholesale-channel/loan-submissions/{id}/underwrite, POST /wholesale-channel/product-eligibilities/{id}/decision"

  - priority: 5
    category: concurrency
    check: "expected_rate_sheet_version must equal RateSheet.version on the quote-pricing write"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /wholesale-channel/rate-sheets/{id}/pricing-quotes"

  - priority: 6
    category: state
    check: "Broker must be in SUBMITTED state to be approved"
    error_id: ERR_BROKER_NOT_SUBMITTED
    http_status: 409
    applies_to: "POST /wholesale-channel/brokers/{id}/approve"

  - priority: 7
    category: business_compliance
    check: "broker.exclusivity_status must not be BLOCKED"
    error_id: ERR_BROKER_EXCLUSIVITY_BLOCKED
    http_status: 403
    applies_to: "POST /wholesale-channel/brokers/{id}/approve, POST /wholesale-channel/brokers/{id}/reinstate, POST /wholesale-channel/product-eligibilities/{id}/decision, POST /wholesale-channel/loan-submissions/{id}/underwrite"

  - priority: 8
    category: business_safety
    check: "broker.open_defect_tier must be <= 2"
    error_id: ERR_BROKER_DEFECT_HOLD
    http_status: 403
    applies_to: "POST /wholesale-channel/brokers/{id}/approve, POST /wholesale-channel/brokers/{id}/reinstate"

  - priority: 9
    category: business_fiscal
    check: "At least one FinancialReview of the broker with status PASSED must exist; on the decision endpoint, review.audit_attested must be true"
    error_id: ERR_FINANCIAL_REVIEW_PENDING
    http_status: 409
    applies_to: "POST /wholesale-channel/brokers/{id}/approve, PASSED branch of POST /wholesale-channel/financial-reviews/{id}/decision"

  - priority: 10
    category: business_constraint
    check: "At least one BrokerLicense whose expires_on is strictly after the logical clock must exist for the broker"
    error_id: ERR_NO_VALID_LICENSE
    http_status: 409
    applies_to: "POST /wholesale-channel/brokers/{id}/approve"

  - priority: 11
    category: business_compliance
    check: "No ACTIVE exclusivity policy of the broker may list the loan's competitor_channel_identifier (case-insensitive match)"
    error_id: ERR_EXCLUSIVITY_POLICY_BREACH
    http_status: 403
    applies_to: "POST /wholesale-channel/loan-submissions, POST /wholesale-channel/rate-sheets/{id}/pricing-quotes"

  - priority: 12
    category: business_compliance
    check: "broker.exclusivity_status must not be RESTRICTED when the breached policy's restriction_scope covers the operation"
    error_id: ERR_BROKER_EXCLUSIVITY_RESTRICTED
    http_status: 403
    applies_to: "POST /wholesale-channel/loan-submissions, POST /wholesale-channel/rate-sheets/{id}/pricing-quotes"

  - priority: 13
    category: business_safety
    check: "loan.property_state must appear in broker.licensed_states (a valid license must cover the property state)"
    error_id: ERR_PROPERTY_STATE_NOT_LICENSED
    http_status: 422
    applies_to: "POST /wholesale-channel/loan-submissions"

  - priority: 14
    category: business_constraint
    check: "An APPROVED ProductEligibility must exist on the quote's product with max_ltv, min_fico and max_loan_amount_cents all satisfying their inclusive bounds"
    error_id: ERR_PRODUCT_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /wholesale-channel/loan-submissions"

  - priority: 15
    category: business_temporal
    check: "The referenced RateSheet must still carry status PUBLISHED (a SUPERSEDED sheet is rejected)"
    error_id: ERR_PRICING_QUOTE_SUPERSEDED
    http_status: 409
    applies_to: "POST /wholesale-channel/loan-submissions, POST /wholesale-channel/rate-sheets/{id}/pricing-quotes"

  - priority: 16
    category: business_constraint
    check: "broker.status must be APPROVED for any operation that moves a loan forward"
    error_id: ERR_BROKER_NOT_APPROVED
    http_status: 403
    applies_to: "POST /wholesale-channel/loan-submissions/{id}/underwrite, POST /wholesale-channel/loan-submissions/{id}/fund"

  - priority: 17
    category: business_constraint
    check: "The elected compensation plan must be an ACTIVE CompensationPlan of the loan's own broker and its default_election must equal the loan's elected value (broker-wide consistency)"
    error_id: ERR_COMPENSATION_PLAN_MISMATCH
    http_status: 422
    applies_to: "POST /wholesale-channel/loan-submissions, POST /wholesale-channel/loan-submissions/{id}/compensation-election"

  - priority: 18
    category: business_state
    check: "Compensation election may not change after the loan leaves SUBMITTED, and a no-op UNDECIDED → UNDECIDED election is rejected"
    error_id: ERR_COMPENSATION_ELECTION_IMMUTABLE
    http_status: 409
    applies_to: "POST /wholesale-channel/loan-submissions/{id}/compensation-election"

  - priority: 19
    category: business_state
    check: "loan.status must be in the set the operation requires"
    error_id: "ERR_LOAN_NOT_SUBMITTED / ERR_LOAN_NOT_UNDERWRITING / ERR_LOAN_NOT_CONDITIONAL / ERR_LOAN_NOT_CLEAR_TO_CLOSE / ERR_LOAN_NOT_WITHDRAWABLE"
    http_status: 409
    applies_to: "all loan action endpoints"

  - priority: 20
    category: business_constraint
    check: "loan.compensation_election must be LENDER_PAID or BORROWER_PAID before underwriting begins"
    error_id: ERR_COMPENSATION_ELECTION_PENDING
    http_status: 409
    applies_to: "POST /wholesale-channel/loan-submissions/{id}/underwrite"

  - priority: 21
    category: business_safety
    check: "loan.defect_remediation_open must be false"
    error_id: ERR_DEFECT_REMEDIATION_OPEN
    http_status: 409
    applies_to: "POST /wholesale-channel/loan-submissions/{id}/clear-to-close, POST /wholesale-channel/loan-submissions/{id}/fund"

  - priority: 22
    category: business_temporal
    check: "No TurnTimeEscalation of the loan may be OPEN"
    error_id: ERR_CLOSING_ESCALATION_OPEN
    http_status: 409
    applies_to: "POST /wholesale-channel/loan-submissions/{id}/clear-to-close, POST /wholesale-channel/loan-submissions/{id}/fund"

  - priority: 23
    category: business_temporal
    check: "The repurchase must still be inside its window, the review must actually require one, and the loan must not already be repurchased"
    error_id: "ERR_REPURCHASE_NOT_REQUIRED / ERR_REPURCHASE_WINDOW_EXPIRED / ERR_LOAN_ALREADY_REPURCHASED"
    http_status: 409
    applies_to: "POST /wholesale-channel/quality-control-reviews/{id}/repurchase"

  - priority: 24
    category: business_constraint
    check: "At most one QualityControlReview may exist per loan submission"
    error_id: ERR_QC_REVIEW_EXISTS
    http_status: 409
    applies_to: "POST /wholesale-channel/quality-control-reviews"

  - priority: 25
    category: business_constraint
    check: "A CompensationPlan deactivation must leave at least one ACTIVE plan on the broker"
    error_id: ERR_LAST_ACTIVE_COMPENSATION_PLAN
    http_status: 409
    applies_to: "PUT /wholesale-channel/compensation-plans/{id}"

  - priority: 26
    category: business_constraint
    check: "A rate sheet may only be retired when no PricingQuote references it"
    error_id: ERR_SHEET_IN_USE
    http_status: 409
    applies_to: "POST /wholesale-channel/brokers/{id}/rate-sheets/{id}/retire"

  - priority: 27
    category: state
    check: "Escalation must still be OPEN to be resolved; review and eligibility rows must still be undecided; licenses must still be ACTIVE to be revoked"
    error_id: "ERR_ESCALATION_ALREADY_RESOLVED / ERR_REVIEW_ALREADY_DECIDED / ERR_ELIGIBILITY_ALREADY_DECIDED / ERR_LICENSE_NOT_REVOCABLE"
    http_status: 409
    applies_to: "POST /wholesale-channel/turn-time-escalations/{id}/resolve, POST /wholesale-channel/financial-reviews/{id}/decision, POST /wholesale-channel/product-eligibilities/{id}/decision, POST /wholesale-channel/brokers/{id}/licenses/{id}/revoke"

  - priority: 28
    category: business_fiscal
    check: "review.net_worth_cents must be at least NET_WORTH_FLOOR_CENTS before a PASSED decision"
    error_id: ERR_NET_WORTH_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /wholesale-channel/financial-reviews/{id}/decision"

  - priority: 29
    category: existence
    check: "Body-level foreign keys and enum members must be well formed; a CONDITIONAL decision needs a non-empty conditions array, a resolve call needs a resolution_note of at least 10 characters, and a QCC defect creation needs remediation_status in {NONE, REMEDIATED}"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a body"

  - priority: 30
    category: business_constraint
    check: "broker.nmls_id must be unique across all brokers"
    error_id: ERR_DUPLICATE_NMLS_ID
    http_status: 409
    applies_to: "POST /wholesale-channel/brokers"

  - priority: 31
    category: auth
    check: "A BrokerUser may act only on resources whose broker_id equals the X-User-ID header value"
    error_id: ERR_BROKER_RESOURCE_FORBIDDEN
    http_status: 403
    applies_to: "POST /wholesale-channel/loan-submissions, POST /wholesale-channel/loan-submissions/{id}/compensation-election, POST /wholesale-channel/loan-submissions/{id}/withdraw, POST /wholesale-channel/loan-submissions/{id}/resubmit, POST /wholesale-channel/rate-sheets/{id}/pricing-quotes"

  - priority: 32
    category: business_compliance
    check: "Segregation of duties: the QC reviewer of a loan must not be the underwriter named on that loan's most recent final UnderwritingDecision"
    error_id: ERR_SEGREGATION_OF_DUTIES_VIOLATION
    http_status: 403
    applies_to: "POST /wholesale-channel/quality-control-reviews"

  - priority: 33
    category: business_state
    check: "A loan may only be resubmitted while it sits in SUSPENDED_REVIEW"
    error_id: ERR_LOAN_NOT_SUSPENDED
    http_status: 409
    applies_to: "POST /wholesale-channel/loan-submissions/{id}/resubmit"

  - priority: 34
    category: business_constraint
    check: "broker.status must be APPROVED to create a loan submission or request a pricing quote"
    error_id: ERR_BROKER_NOT_APPROVED
    http_status: 403
    applies_to: "POST /wholesale-channel/loan-submissions, POST /wholesale-channel/rate-sheets/{id}/pricing-quotes"

# =============================================================================
# Table 5: API Endpoint Table  (§1.5)
# =============================================================================
endpoints:
  # --- Brokers ---
  - method: POST
    path: "/wholesale-channel/brokers"
    description: "Submit a new brokerage for wholesale channel approval"
    roles: [ChannelManager]
    code: 201
    input: [legal_name, nmls_id, home_state, volume_expectation_cents]
    output: Broker
    side_effects:
      - "status = SUBMITTED; tier = UNRATED; financial_strength_score = 0.00; rolling_quality_score = 100.00; open_defect_tier = 0; exclusivity_status = CLEAR"
      - "rolling_funded_volume_cents = 0, active_loan_count = 0, total_active_compensation_commitment_cents = 0; licensed_states = []"

  - method: GET
    path: "/wholesale-channel/brokers"
    description: "List brokerages with optional filters"
    roles: [Any]
    code: 200
    input: ["status?", "home_state?", "tier?", "exclusivity_status?", "limit?", "offset?"]
    output: "Broker[]"
    side_effects: []

  - method: GET
    path: "/wholesale-channel/brokers/{id}"
    description: "Get one brokerage"
    roles: [Any]
    code: 200
    input: []
    output: Broker
    side_effects: []

  - method: GET
    path: "/wholesale-channel/brokers/{id}/reconciliation"
    description: "Broker-level compensation and volume reconciliation snapshot"
    roles: [Any]
    code: 200
    input: []
    output: "{ total_active_compensation_commitment_cents: integer, rolling_funded_volume_cents: integer, commitment_drift_cents: integer, active_loan_count: integer }"
    side_effects: []

  - method: POST
    path: "/wholesale-channel/brokers/{id}/approve"
    description: "Approve a submitted brokerage"
    roles: [ChannelManager]
    code: 200
    input: []
    output: Broker
    side_effects: ["status → APPROVED; tier recomputed; increments Broker.version by 1"]

  - method: POST
    path: "/wholesale-channel/brokers/{id}/reinstate"
    description: "Reinstate a suspended brokerage"
    roles: [ChannelManager]
    code: 200
    input: []
    output: Broker
    side_effects: ["status → APPROVED; suspended_reason cleared; increments Broker.version by 1"]

  - method: POST
    path: "/wholesale-channel/brokers/{id}/suspend"
    description: "Manually suspend an approved brokerage"
    roles: [ChannelManager]
    code: 200
    input: [reason]
    output: Broker
    side_effects:
      - "status → SUSPENDED; suspended_reason = reason"
      - "Every LoanSubmission of this broker in status SUBMITTED → WITHDRAWN"
      - "For each loan withdrawn by the hop above: total_active_compensation_commitment_cents -= loan.lender_paid_comp_cents"
      - "increments Broker.version by 1"

  - method: POST
    path: "/wholesale-channel/brokers/{id}/terminate"
    description: "Terminate a brokerage relationship"
    roles: [ChannelManager]
    code: 200
    input: []
    output: Broker
    side_effects: ["status → TERMINATED; withdrawal cascade for any SUBMITTED loans; increments Broker.version by 1"]

  # --- Licenses ---
  - method: POST
    path: "/wholesale-channel/brokers/{id}/licenses"
    description: "Record a brokerage license"
    roles: [ChannelManager]
    code: 201
    input: [state_code, license_number, license_type, expires_on]
    output: BrokerLicense
    side_effects: ["status = ACTIVE; broker.licensed_states recomputed; increments Broker.version by 1"]

  - method: GET
    path: "/wholesale-channel/brokers/{id}/licenses"
    description: "List a brokerage's licenses"
    roles: [Any]
    code: 200
    input: ["status?"]
    output: "BrokerLicense[]"
    side_effects: []

  - method: POST
    path: "/wholesale-channel/brokers/{id}/licenses/{id}/revoke"
    description: "Revoke a license and cascade to affected loans"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: BrokerLicense
    side_effects:
      - "status → REVOKED; revoked_at = logical clock; broker.licensed_states recomputed"
      - "CASCADE hop 1: loans with property_state == license.state_code and status in {SUBMITTED, UNDERWRITING} → SUSPENDED_REVIEW"
      - "CASCADE hop 2: for each such loan, total_active_compensation_commitment_cents -= lender_paid_comp_cents and its RESOLVED TurnTimeEscalations → OPEN"
      - "increments Broker.version by 1"

  # --- Financial reviews ---
  - method: POST
    path: "/wholesale-channel/brokers/{id}/financial-reviews"
    description: "Record a brokerage financial review"
    roles: [ChannelManager]
    code: 201
    input: [net_worth_cents, liquidity_cents, total_liabilities_cents, years_in_business, prior_year_funded_volume_cents, "audit_attested?"]
    output: FinancialReview
    side_effects: ["status = PENDING; computed_financial_strength_score computed and stored on the review (the Broker score is untouched)"]

  - method: GET
    path: "/wholesale-channel/brokers/{id}/financial-reviews"
    description: "List a brokerage's financial reviews"
    roles: [Any]
    code: 200
    input: ["status?"]
    output: "FinancialReview[]"
    side_effects: []

  - method: POST
    path: "/wholesale-channel/financial-reviews/{id}/decision"
    description: "Record the PASSED or FAILED decision on a financial review"
    roles: [ChannelManager]
    code: 200
    input: [outcome]
    output: FinancialReview
    side_effects:
      - "status → PASSED or FAILED"
      - "On PASSED: broker.financial_strength_score = review.computed_financial_strength_score; broker.tier recomputed; all other PASSED reviews → is_current = false; this review → is_current = true"
      - "increments Broker.version by 1"

  # --- Product eligibility ---
  - method: POST
    path: "/wholesale-channel/brokers/{id}/product-eligibilities"
    description: "Request a product eligibility for a brokerage"
    roles: [ChannelManager]
    code: 201
    input: [product_code, max_ltv, min_fico, max_loan_amount_cents]
    output: ProductEligibility
    side_effects: ["status = PENDING"]

  - method: GET
    path: "/wholesale-channel/brokers/{id}/product-eligibilities"
    description: "List a brokerage's product eligibilities"
    roles: [Any]
    code: 200
    input: ["status?", "product_code?"]
    output: "ProductEligibility[]"
    side_effects: []

  - method: POST
    path: "/wholesale-channel/product-eligibilities/{id}/decision"
    description: "Approve or revoke a product eligibility"
    roles: [ChannelManager]
    code: 200
    input: [outcome, expected_broker_version]
    output: ProductEligibility
    side_effects:
      - "status → APPROVED or REVOKED; approved_at set on approval"
      - "broker.approved_product_codes recomputed"
      - "increments Broker.version by 1"

  # --- Exclusivity ---
  - method: POST
    path: "/wholesale-channel/exclusivity-policies"
    description: "Register a competitor exclusivity policy against a brokerage"
    roles: [ChannelManager]
    code: 201
    input: [broker_id, competitor_identifier, competitor_name, effective_from, effective_to, "status?", "restriction_scope?"]
    output: ExclusivityPolicy
    side_effects: ["breach_count = 0; broker.exclusivity_status recomputed"]

  - method: GET
    path: "/wholesale-channel/brokers/{id}/exclusivity-policies"
    description: "List a brokerage's exclusivity policies"
    roles: [Any]
    code: 200
    input: ["status?"]
    output: "ExclusivityPolicy[]"
    side_effects: []

  - method: POST
    path: "/wholesale-channel/exclusivity-policies/{id}/void"
    description: "Void an exclusivity policy"
    roles: [ChannelManager]
    code: 200
    input: [reason]
    output: ExclusivityPolicy
    side_effects: ["status → VOIDED; broker.exclusivity_status recomputed"]

  # --- Compensation plans ---
  - method: POST
    path: "/wholesale-channel/compensation-plans"
    description: "Create a broker compensation plan"
    roles: [ChannelManager]
    code: 201
    input: [broker_id, plan_code, default_election, lender_paid_amount_cents, borrower_paid_amount_cents, "is_active?"]
    output: CompensationPlan
    side_effects: []

  - method: GET
    path: "/wholesale-channel/brokers/{id}/compensation-plans"
    description: "List a brokerage's compensation plans"
    roles: [Any]
    code: 200
    input: ["is_active?"]
    output: "CompensationPlan[]"
    side_effects: []

  - method: GET
    path: "/wholesale-channel/compensation-plans/{id}"
    description: "Get one compensation plan"
    roles: [Any]
    code: 200
    input: []
    output: CompensationPlan
    side_effects: []

  - method: PUT
    path: "/wholesale-channel/compensation-plans/{id}"
    description: "Activate or deactivate a compensation plan"
    roles: [ChannelManager]
    code: 200
    input: [is_active, "default_election?", "lender_paid_amount_cents?", "borrower_paid_amount_cents?"]
    output: CompensationPlan
    side_effects: ["is_active toggled; loans already decided are untouched"]

  # --- Rate sheets ---
  - method: POST
    path: "/wholesale-channel/brokers/{id}/rate-sheets"
    description: "Publish a rate sheet for a broker and product; supersedes the prior PUBLISHED sheet"
    roles: [ChannelManager]
    code: 201
    input: [product_code, base_rate_pct, adjustment_table]
    output: RateSheet
    side_effects:
      - "status = PUBLISHED; published_at = logical clock; publish_sequence = prior max + 1"
      - "The prior PUBLISHED sheet for the same (broker, product) → SUPERSEDED with superseded_by_sheet_id = new sheet id; increments that prior RateSheet.version by 1"
      - "increments Broker.version by 1"

  - method: GET
    path: "/wholesale-channel/brokers/{id}/rate-sheets"
    description: "List a brokerage's rate sheets"
    roles: [Any]
    code: 200
    input: ["product_code?", "status?"]
    output: "RateSheet[]"
    side_effects: []

  - method: POST
    path: "/wholesale-channel/brokers/{id}/rate-sheets/{id}/retire"
    description: "Retire a rate sheet that has never been priced against"
    roles: [ChannelManager]
    code: 200
    input: []
    output: RateSheet
    side_effects: ["status → RETIRED; increments Broker.version by 1"]

  # --- Pricing quotes ---
  - method: POST
    path: "/wholesale-channel/rate-sheets/{id}/pricing-quotes"
    description: "Price a scenario against an immutable rate sheet"
    roles: [BrokerUser]
    code: 201
    input: [representative_fico, ltv_ratio, occupancy_type, loan_amount_cents, lock_period_days, loan_purpose, expected_rate_sheet_version]
    output: PricingQuote
    side_effects:
      - "overall_adjustment_pct, lock_adjustment_pct, note_rate_pct, price_points and adjustment_trace computed and frozen"
      - "broker_id copied from the sheet"
      - "increments RateSheet.version by 1"

  - method: GET
    path: "/wholesale-channel/rate-sheets/{id}/pricing-quotes"
    description: "List the quotes priced off a rate sheet"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "PricingQuote[]"
    side_effects: []

  - method: GET
    path: "/wholesale-channel/pricing-quotes/{id}"
    description: "Get one pricing quote snapshot"
    roles: [Any]
    code: 200
    input: []
    output: PricingQuote
    side_effects: []

  - method: GET
    path: "/wholesale-channel/pricing-quotes"
    description: "List pricing quotes, optionally filtered by broker"
    roles: [Any]
    code: 200
    input: ["broker_id?", "product_code?", "limit?", "offset?"]
    output: "PricingQuote[]"
    side_effects: []

  - method: GET
    path: "/wholesale-channel/rate-sheets"
    description: "List rate sheets, optionally filtered by broker or by the sheet that superseded them"
    roles: [Any]
    code: 200
    input: ["broker_id?", "product_code?", "status?", "superseded_by_sheet_id?", "limit?", "offset?"]
    output: "RateSheet[]"
    side_effects: []

  - method: GET
    path: "/wholesale-channel/rate-sheets/{id}"
    description: "Get one rate sheet"
    roles: [Any]
    code: 200
    input: []
    output: RateSheet
    side_effects: []

  # --- Loan submissions ---
  - method: POST
    path: "/wholesale-channel/loan-submissions"
    description: "Submit a broker-prepared loan file against a pricing quote"
    roles: [BrokerUser]
    note: "An intraday reprice makes prior quotes stale but never blocks submission: the sheet-status gate is the only sheet-level check, so a quote whose sheet was superseded usually still carries PUBLISHED and is accepted with is_repriced true."
    code: 201
    input: [broker_id, pricing_quote_id, borrower_name, property_state, loan_amount_cents, lock_expires_at, "competitor_channel_identifier?", "compensation_election?", "comp_plan_id?"]
    output: LoanSubmission
    side_effects:
      - "status = SUBMITTED; submitted_at = logical clock; underwriting_due_at = submitted_at + UNDERWRITING_TURN_DAYS"
      - "compensation_split applied when an election was supplied (lender_paid_comp_cents, borrower_paid_comp_cents, rate_impact_pct, final_note_rate_pct); broker.total_active_compensation_commitment_cents += lender_paid_comp_cents"
      - "A competitor_channel_identifier matching an ACTIVE policy records a breach and recomputes exclusivity_status"
      - "broker.active_loan_count recomputed; increments Broker.version by 1"

  - method: GET
    path: "/wholesale-channel/loan-submissions"
    description: "List loan submissions with filters"
    roles: [Any]
    code: 200
    input: ["broker_id?", "status?", "property_state?", "pricing_quote_id?", "comp_plan_id?", "limit?", "offset?"]
    output: "LoanSubmission[]"
    side_effects: []

  - method: GET
    path: "/wholesale-channel/loan-submissions/{id}"
    description: "Get one loan submission"
    roles: [Any]
    code: 200
    input: []
    output: LoanSubmission
    side_effects: []

  - method: POST
    path: "/wholesale-channel/loan-submissions/{id}/compensation-election"
    description: "Elect lender-paid or borrower-paid compensation before underwriting"
    roles: [BrokerUser]
    code: 200
    input: [compensation_election, comp_plan_id]
    output: LoanSubmission
    side_effects:
      - "compensation_split recomputed; total_active_compensation_commitment_cents adjusted by the lender-paid delta"
      - "increments Broker.version by 1"

  - method: POST
    path: "/wholesale-channel/loan-submissions/{id}/underwrite"
    description: "Accept the broker file into underwriting"
    roles: [Underwriter]
    code: 200
    input: [expected_broker_version]
    output: LoanSubmission
    side_effects:
      - "status → UNDERWRITING; submitted_at = logical clock; underwriting_due_at = submitted_at + UNDERWRITING_TURN_DAYS"
      - "broker.active_loan_count recomputed"
      - "increments Broker.version by 1"

  - method: POST
    path: "/wholesale-channel/loan-submissions/{id}/resubmit"
    description: "Return a suspended-review loan to the underwriter queue"
    roles: [BrokerUser]
    code: 200
    input: [resubmission_note]
    output: LoanSubmission
    side_effects: ["status → SUBMITTED; underwriting_due_at = logical clock + UNDERWRITING_TURN_DAYS; increments Broker.version by 1"]

  - method: POST
    path: "/wholesale-channel/loan-submissions/{id}/withdraw"
    description: "Withdraw a loan before it clears"
    roles: [BrokerUser]
    code: 200
    input: []
    output: LoanSubmission
    side_effects: ["status → WITHDRAWN; total_active_compensation_commitment_cents -= lender_paid_comp_cents; increments Broker.version by 1"]

  - method: POST
    path: "/wholesale-channel/loan-submissions/{id}/clear-to-close"
    description: "Clear the loan to close and stamp its closing commitment"
    roles: [Underwriter]
    code: 200
    input: []
    output: LoanSubmission
    side_effects: ["status → CLEAR_TO_CLOSE; cleared_at and closing_due_at stamped; closing_path = ESCALATION_PATH when any escalation exists on this loan, else STANDARD_PATH; increments Broker.version by 1"]

  - method: POST
    path: "/wholesale-channel/loan-submissions/{id}/fund"
    description: "Fund the loan"
    roles: [Underwriter]
    code: 200
    input: []
    output: LoanSubmission
    side_effects: ["status → FUNDED; broker.rolling_funded_volume_cents += loan_amount_cents; increments Broker.version by 1"]

  - method: GET
    path: "/wholesale-channel/closing-pipeline"
    description: "Closing pipeline view splitting loans by their stamped closing_path"
    roles: [Any]
    code: 200
    input: ["broker_id?", "limit?", "offset?"]
    output: "{ escalated_count: integer, standard_count: integer, near_deadline_count: integer, escalated_loan_ids: string[], standard_loan_ids: string[] }"
    side_effects: []

  # --- Underwriting decisions ---
  - method: POST
    path: "/wholesale-channel/underwriting-decisions"
    description: "Record an underwriter decision on a loan in underwriting"
    roles: [Underwriter]
    code: 201
    input: [loan_submission_id, decision_type, "conditions?", "decision_notes?"]
    output: UnderwritingDecision
    side_effects:
      - "UnderwritingDecision created with underwriter_id from X-User-ID and decided_at = logical clock"
      - "CONDITIONAL → loan.CONDITIONAL_APPROVAL; SUSPENDED → loan.SUSPENDED_REVIEW; DENIED → loan.DENIED; APPROVED → loan.CONDITIONAL_APPROVAL with no conditions (an approval with conditions is expressed as CONDITIONAL)"
      - "loan.underwriting_due_at = decided_at + UNDERWRITING_TURN_DAYS for CONDITIONAL and SUSPENDED"
      - "increments Broker.version by 1"

  - method: GET
    path: "/wholesale-channel/loan-submissions/{id}/underwriting-decisions"
    description: "List the underwriting decisions recorded on a loan, oldest first"
    roles: [Any]
    code: 200
    input: []
    output: "UnderwritingDecision[]"
    side_effects: []

  - method: GET
    path: "/wholesale-channel/brokers/{id}/underwriting-decisions"
    description: "List every underwriting decision recorded against a brokerage's loans"
    roles: [Any]
    code: 200
    input: ["decision_type?", "limit?", "offset?"]
    output: "UnderwritingDecision[]"
    side_effects: []

  # --- Turn-time escalations ---
  - method: GET
    path: "/wholesale-channel/loan-submissions/{id}/turn-time-escalations"
    description: "List a loan's turn-time escalations"
    roles: [Any]
    code: 200
    input: ["status?"]
    output: "TurnTimeEscalation[]"
    side_effects: []

  - method: GET
    path: "/wholesale-channel/brokers/{id}/turn-time-escalations"
    description: "List a brokerage's turn-time escalations"
    roles: [Any]
    code: 200
    input: ["status?", "stage?", "limit?", "offset?"]
    output: "TurnTimeEscalation[]"
    side_effects: []

  - method: POST
    path: "/wholesale-channel/turn-time-escalations/{id}/resolve"
    description: "Resolve or reopen-extend a turn-time escalation"
    roles: [ChannelManager]
    code: 200
    input: [resolution_note]
    output: TurnTimeEscalation
    side_effects:
      - "status → RESOLVED; resolved_at = logical clock"
      - "When stage == UNDERWRITING and the loan is UNDERWRITING or CONDITIONAL_APPROVAL: loan.underwriting_due_at = logical clock + UNDERWRITING_TURN_DAYS"
      - "Never rewrites loan.closing_path"

  # --- Quality control ---
  - method: POST
    path: "/wholesale-channel/quality-control-reviews"
    description: "Open a post-funding quality control review on a funded loan"
    roles: [QualityControlAnalyst]
    code: 201
    input: [loan_submission_id, defect_type, severity, remediation_status]
    output: QualityControlReview
    side_effects:
      - "outcome = CLEAR for NON_DEFECT, DEFECT otherwise; weighted_defect_points computed"
      - "DEFECT: broker.rolling_quality_score = max(0.00, score - weighted_defect_points × defect_multiplier(broker.open_defect_tier))"
      - "DEFECT with remediation_status OPEN: broker.open_defect_tier += 1 and loan.defect_remediation_open = true"
      - "CRITICAL DEFECT at or above REPURCHASE_POINTS_THRESHOLD: repurchase_required = true and repurchase_due_at = reviewed_at + REPURCHASE_WINDOW_DAYS"
      - "A DEFECT whose loan is CLEAR_TO_CLOSE pushes the loan to SUSPENDED_REVIEW"
      - "increments Broker.version by 1; broker suspension triggers re-evaluated"

  - method: GET
    path: "/wholesale-channel/brokers/{id}/quality-control-reviews"
    description: "List a brokerage's quality control reviews"
    roles: [Any]
    code: 200
    input: ["outcome?", "limit?", "offset?"]
    output: "QualityControlReview[]"
    side_effects: []

  - method: GET
    path: "/wholesale-channel/loan-submissions/{id}/quality-control-reviews"
    description: "List the quality control reviews recorded on a loan"
    roles: [Any]
    code: 200
    input: []
    output: "QualityControlReview[]"
    side_effects: []

  - method: GET
    path: "/wholesale-channel/quality-control-reviews"
    description: "List quality control reviews across brokers, optionally filtered by broker or loan"
    roles: [Any]
    code: 200
    input: ["broker_id?", "loan_submission_id?", "outcome?", "limit?", "offset?"]
    output: "QualityControlReview[]"
    side_effects: []

  - method: POST
    path: "/wholesale-channel/quality-control-reviews/{id}/resolve"
    description: "Remediate, void or date-correct a quality control finding"
    roles: [QualityControlAnalyst]
    code: 200
    input: [resolution_type, resolution_note]
    output: QualityControlReview
    side_effects:
      - "remediation_status → REMEDIATED or VOIDED"
      - "REMEDIATED on an OPEN defect: broker.open_defect_tier -= 1 and loan.defect_remediation_open cleared when no OPEN finding remains"
      - "VOIDED: broker.rolling_quality_score = min(100.00, score + weighted_defect_points × defect_multiplier(broker.open_defect_tier))"
      - "A dating-only mint correction keeps REMEDIATED and debits the score by weighted_defect_points × defect_multiplier(broker.open_defect_tier)"
      - "increments Broker.version by 1"

  - method: POST
    path: "/wholesale-channel/quality-control-reviews/{id}/repurchase"
    description: "Exercise repurchase on a critical defect inside its window"
    roles: [QualityControlAnalyst]
    code: 200
    input: []
    output: LoanSubmission
    side_effects:
      - "loan.status → REPURCHASED; repurchase_exposure_cents computed as the pair-share reversal plus the origination-fee reversal"
      - "broker.rolling_funded_volume_cents -= loan.loan_amount_cents"
      - "increments Broker.version by 1"

  # --- Test-driving endpoint ---
  - method: POST
    path: "/wholesale-channel/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is exactly 2026-09-01T00:00:00Z; before any call the clock reads that default and never real wall-clock time. Setting the clock re-evaluates license expiry, opens any newly-lapsed turn-time escalations, and re-derives licensed_states and exclusivity_status."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime, licenses_expired: integer, escalations_opened: integer }"
    side_effects:
      - "BrokerLicense rows whose expires_on is at or before the new clock and status ACTIVE → EXPIRED"
      - "TurnTimeEscalation rows opened for loans whose underwriting_due_at or closing_due_at has passed and which have no OPEN escalation for that stage"
      - "broker.licensed_states recomputed for every broker; suspension triggers re-evaluated"

# =============================================================================
# Table 6: Error Code Catalog  (§1.6)
# =============================================================================
errors:
  - id: ERR_MISSING_USER_CONTEXT
    http: 400
    condition: "X-User-ID or X-User-Role header absent or naming an undeclared role"
  - id: ERR_INSUFFICIENT_PERMISSIONS
    http: 403
    condition: "The caller's role is not permitted for the endpoint"
  - id: ERR_BROKER_RESOURCE_FORBIDDEN
    http: 403
    condition: "A BrokerUser invoked a broker-scoped operation for a broker_id other than its own X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES_VIOLATION
    http: 403
    condition: "The acting QualityControlAnalyst is the underwriter named on the loan's most recent final UnderwritingDecision"
  - id: ERR_BROKER_NOT_FOUND
    http: 404
    condition: "broker_id does not resolve to a Broker"
  - id: ERR_LICENSE_NOT_FOUND
    http: 404
    condition: "license_id does not resolve to a BrokerLicense"
  - id: ERR_REVIEW_NOT_FOUND
    http: 404
    condition: "review_id does not resolve to a FinancialReview or QualityControlReview for that endpoint"
  - id: ERR_ELIGIBILITY_NOT_FOUND
    http: 404
    condition: "eligibility_id does not resolve to a ProductEligibility"
  - id: ERR_RATE_SHEET_NOT_FOUND
    http: 404
    condition: "sheet_id does not resolve to a RateSheet"
  - id: ERR_QUOTE_NOT_FOUND
    http: 404
    condition: "quote_id or pricing_quote_id does not resolve to a PricingQuote"
  - id: ERR_LOAN_NOT_FOUND
    http: 404
    condition: "loan_id or loan_submission_id does not resolve to a LoanSubmission"
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "plan_id does not resolve to a CompensationPlan, or comp_plan_id names no plan of the loan's broker"
  - id: ERR_ESCALATION_NOT_FOUND
    http: 404
    condition: "escalation_id does not resolve to a TurnTimeEscalation"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_broker_version or expected_rate_sheet_version no longer equals the parent's current version"
  - id: ERR_BROKER_NOT_SUBMITTED
    http: 409
    condition: "Broker approval attempted from a status other than SUBMITTED, or reinstatement attempted from a status other than SUSPENDED"
  - id: ERR_BROKER_NOT_SUSPENDABLE
    http: 409
    condition: "Manual suspension attempted from a status other than APPROVED"
  - id: ERR_BROKER_NOT_APPROVED
    http: 403
    condition: "A forward-moving loan operation, quote request or loan submission attempted while broker.status is not APPROVED"
  - id: ERR_BROKER_EXCLUSIVITY_BLOCKED
    http: 403
    condition: "broker.exclusivity_status is BLOCKED on a gate that forbids it"
  - id: ERR_BROKER_EXCLUSIVITY_RESTRICTED
    http: 403
    condition: "broker.exclusivity_status is RESTRICTED and the breached policy's restriction_scope covers the attempted operation"
  - id: ERR_EXCLUSIVITY_POLICY_BREACH
    http: 403
    condition: "A loan discloses a competitor_channel_identifier listed on an ACTIVE exclusivity policy of the broker"
  - id: ERR_BROKER_DEFECT_HOLD
    http: 403
    condition: "broker.open_defect_tier exceeds 2 on approval or reinstatement"
  - id: ERR_BROKER_QUALITY_BELOW_REINSTATEMENT
    http: 403
    condition: "broker.rolling_quality_score is below 60.00 on reinstatement"
  - id: ERR_ACTIVE_LOANS_PRESENT
    http: 409
    condition: "Broker termination attempted while active_loan_count is non-zero"
  - id: ERR_FINANCIAL_REVIEW_PENDING
    http: 409
    condition: "No PASSED FinancialReview exists for the broker, or a PASSED decision was requested on an unattested review"
  - id: ERR_NO_VALID_LICENSE
    http: 409
    condition: "The broker has no license whose expires_on is strictly after the logical clock at approval time"
  - id: ERR_DUPLICATE_NMLS_ID
    http: 409
    condition: "A Broker already exists with the submitted nmls_id"
  - id: ERR_PROPERTY_STATE_NOT_LICENSED
    http: 422
    condition: "loan.property_state is absent from broker.licensed_states"
  - id: ERR_PRODUCT_NOT_ELIGIBLE
    http: 422
    condition: "No APPROVED ProductEligibility covers the submission's product with its amount, LTV and FICO inside the inclusive bounds"
  - id: ERR_PRICING_QUOTE_SUPERSEDED
    http: 409
    condition: "The referenced RateSheet has status SUPERSEDED or RETIRED and may no longer be priced against or submitted against"
  - id: ERR_COMPENSATION_PLAN_MISMATCH
    http: 422
    condition: "comp_plan_id names a plan that is not ACTIVE, not owned by the loan's broker, or whose default_election differs from the elected value"
  - id: ERR_COMPENSATION_ELECTION_IMMUTABLE
    http: 409
    condition: "A compensation election change was attempted after the loan left SUBMITTED, or the election value repeated the stored value"
  - id: ERR_COMPENSATION_ELECTION_PENDING
    http: 409
    condition: "Underwriting was requested while compensation_election is still UNDECIDED"
  - id: ERR_LOAN_NOT_SUBMITTED
    http: 409
    condition: "Underwriting was requested on a loan whose status is not SUBMITTED"
  - id: ERR_LOAN_NOT_UNDERWRITING
    http: 409
    condition: "An underwriting decision was recorded against a loan whose status is not UNDERWRITING"
  - id: ERR_LOAN_NOT_CONDITIONAL
    http: 409
    condition: "Clear-to-close was requested on a loan whose status is not CONDITIONAL_APPROVAL"
  - id: ERR_LOAN_NOT_CLEAR_TO_CLOSE
    http: 409
    condition: "Funding was requested on a loan whose status is not CLEAR_TO_CLOSE"
  - id: ERR_LOAN_NOT_WITHDRAWABLE
    http: 409
    condition: "Withdrawal attempted from a status outside {SUBMITTED, UNDERWRITING, CONDITIONAL_APPROVAL}"
  - id: ERR_LOAN_NOT_SUSPENDED
    http: 409
    condition: "Resubmission attempted on a loan whose status is not SUSPENDED_REVIEW"
  - id: ERR_DEFECT_REMEDIATION_OPEN
    http: 409
    condition: "clear-to-close or fund attempted while loan.defect_remediation_open is true"
  - id: ERR_CLOSING_ESCALATION_OPEN
    http: 409
    condition: "clear-to-close or fund attempted while an OPEN TurnTimeEscalation exists on the loan"
  - id: ERR_QC_REVIEW_EXISTS
    http: 409
    condition: "A QualityControlReview already exists for the loan submission"
  - id: ERR_REPURCHASE_NOT_REQUIRED
    http: 409
    condition: "Repurchase exercised on a review that is not a CRITICAL defect at or above the repurchase threshold"
  - id: ERR_REPURCHASE_WINDOW_EXPIRED
    http: 409
    condition: "The logical clock has passed review.repurchase_due_at"
  - id: ERR_LOAN_ALREADY_REPURCHASED
    http: 409
    condition: "The loan already carries a repurchase or does not sit in FUNDED"
  - id: ERR_LAST_ACTIVE_COMPENSATION_PLAN
    http: 409
    condition: "Deactivating a plan would leave the broker with no ACTIVE CompensationPlan"
  - id: ERR_SHEET_IN_USE
    http: 409
    condition: "Retiring a RateSheet that one or more PricingQuote rows reference"
  - id: ERR_ESCALATION_ALREADY_RESOLVED
    http: 409
    condition: "The escalation is already RESOLVED"
  - id: ERR_REVIEW_ALREADY_DECIDED
    http: 409
    condition: "The FinancialReview is not PENDING"
  - id: ERR_ELIGIBILITY_ALREADY_DECIDED
    http: 409
    condition: "The ProductEligibility is not PENDING"
  - id: ERR_LICENSE_NOT_REVOCABLE
    http: 409
    condition: "The license is not ACTIVE"
  - id: ERR_NET_WORTH_BELOW_MINIMUM
    http: 422
    condition: "review.net_worth_cents is below NET_WORTH_FLOOR_CENTS on a PASSED decision"
  - id: ERR_DECISION_CONDITIONS_REQUIRED
    http: 400
    condition: "decision_type is CONDITIONAL but conditions is missing or empty"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body: unknown enum member, missing required field, resolution_note shorter than 10 characters, or a QCC defect created with remediation_status OPEN"

# =============================================================================
# Table 7: RBAC Permission Matrix  (§1.7)
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operates the logical clock; holds no loan, pricing or compliance authority"
    identity: opaque
    exclusive_operations: ["POST /wholesale-channel/_clock/set_current_utc"]
    shared_operations: []

  - name: ChannelManager
    description: "Lender-side wholesale account manager: broker onboarding decisions, rate sheet publication, compensation plans, escalations"
    identity: opaque
    exclusive_operations:
      - "POST /wholesale-channel/brokers/{id}/approve"
      - "POST /wholesale-channel/brokers/{id}/reinstate"
      - "POST /wholesale-channel/brokers/{id}/suspend"
      - "POST /wholesale-channel/brokers/{id}/terminate"
      - "POST /wholesale-channel/financial-reviews/{id}/decision"
      - "POST /wholesale-channel/exclusivity-policies"
      - "POST /wholesale-channel/compensation-plans"
      - "PUT /wholesale-channel/compensation-plans/{id}"
      - "POST /wholesale-channel/brokers/{id}/rate-sheets"
      - "POST /wholesale-channel/turn-time-escalations/{id}/resolve"
    shared_operations:
      - "POST /wholesale-channel/brokers"
      - "POST /wholesale-channel/brokers/{id}/licenses"
      - "POST /wholesale-channel/brokers/{id}/financial-reviews"
      - "POST /wholesale-channel/brokers/{id}/product-eligibilities"
      - "POST /wholesale-channel/product-eligibilities/{id}/decision"

  - name: Underwriter
    description: "Owns the underwriting and closing decision surface on submitted loans; may not price, elect compensation, or review quality"
    identity: opaque
    exclusive_operations:
      - "POST /wholesale-channel/loan-submissions/{id}/underwrite"
      - "POST /wholesale-channel/underwriting-decisions"
      - "POST /wholesale-channel/loan-submissions/{id}/clear-to-close"
      - "POST /wholesale-channel/loan-submissions/{id}/fund"
    shared_operations: []

  - name: ComplianceOfficer
    description: "Owns license revocation; may not approve brokers, underwrite, or review quality"
    identity: opaque
    exclusive_operations: ["POST /wholesale-channel/brokers/{id}/licenses/{id}/revoke"]
    shared_operations: []

  - name: QualityControlAnalyst
    description: "Post-funding file review, defect resolution and repurchase exercise; must not also be the loan's underwriter"
    identity: opaque
    exclusive_operations:
      - "POST /wholesale-channel/quality-control-reviews"
      - "POST /wholesale-channel/quality-control-reviews/{id}/resolve"
      - "POST /wholesale-channel/quality-control-reviews/{id}/repurchase"
    shared_operations: []

  - name: BrokerUser
    description: "Brokerage portal user acting as the brokerage identified by X-User-ID; may only touch its own broker's resources"
    identity: "entity_backed:Broker"
    exclusive_operations:
      - "POST /wholesale-channel/rate-sheets/{id}/pricing-quotes"
      - "POST /wholesale-channel/loan-submissions"
      - "POST /wholesale-channel/loan-submissions/{id}/compensation-election"
      - "POST /wholesale-channel/loan-submissions/{id}/withdraw"
      - "POST /wholesale-channel/loan-submissions/{id}/resubmit"
    shared_operations: []

  - name: Any
    description: "Any authenticated caller; used only on read endpoints, which apply no ownership filter"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "Every GET endpoint in §1.5 and no POST, PUT, PATCH or DELETE endpoint"