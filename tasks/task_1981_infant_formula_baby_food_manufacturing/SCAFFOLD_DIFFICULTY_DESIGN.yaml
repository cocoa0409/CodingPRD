  # =========================================================================
  # Rule 3: non_linear_state_machine — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: formula_review_revision_cycle
        grounds:
          - state_machines.Formula
          - state_machines.Formula.DRAFT_to_IN_REVIEW
          - state_machines.Formula.IN_REVIEW_to_DRAFT
        distinguishing_aspect: |
          Formula has a cyclic review loop: DRAFT -> IN_REVIEW -> DRAFT (return for revision)
          -> IN_REVIEW again. This is a non-linear cycle on the Formula entity, distinct
          from linear pipelines. The cycle can repeat multiple times before approval.
        test_recipe:
          setup:
            - "An APPROVED NutrientProfile exists."
            - "Clock is at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ADMIN
            - call: "POST /api/v1/nutrient-profiles"
              payload:
                profile_code: "INF-0-6M"
                nutrient_specs:
                  - nutrient_code: "PROTEIN"
                    unit: "g"
                    min_per_100kcal: 1.80
                    max_per_100kcal: 3.50
                    target_per_100kcal: 2.50
                regulation_ref: "21 CFR 107.100"
                effective_from: "2026-01-01T00:00:00Z"
              as: REGULATORY_AFFAIRS
              captures: { npc_id: $.data.id }
            - call: "POST /api/v1/nutrient-profiles/${npc_id}/submit"
              payload: {}
              as: REGULATORY_AFFAIRS
            - call: "POST /api/v1/nutrient-profiles/${npc_id}/approve"
              payload: {}
              as: REGULATORY_AFFAIRS
            - call: "POST /api/v1/ingredients"
              payload:
                ingredient_code: "WPC-CYCLE"
                ingredient_name: "Whey Protein Cycle Test"
                category: "DAIRY_BASE"
                pathogen_risk_class: "HIGH_RISK"
                storage_condition: "REFRIGERATED"
              as: QA_MANAGER
              captures: { ingc_id: $.data.id }
            - call: "POST /api/v1/formulas"
              payload:
                formula_code: "IF-CYCLE-1"
                product_name: "Cycle Test Formula"
                nutrient_profile_id: "${npc_id}"
                ingredients:
                  - ingredient_id: "${ingc_id}"
                    percentage_by_weight: 100.000
                    is_critical: true
                process_type: "DRY_BLEND"
              as: REGULATORY_AFFAIRS
              captures: { fc_id: $.data.id }
          trigger:
            - call: "POST /api/v1/formulas/${fc_id}/submit-for-review"
              payload: {}
              as: REGULATORY_AFFAIRS
              captures: { f_after_submit: $.data }
            - call: "POST /api/v1/formulas/${fc_id}/return-for-revision"
              payload: {}
              as: QA_MANAGER
              captures: { f_after_return: $.data }
            - call: "POST /api/v1/formulas/${fc_id}/submit-for-review"
              payload: {}
              as: REGULATORY_AFFAIRS
              captures: { f_after_resubmit: $.data }
          assert:
            - "Formula.${fc_id}.status after first submit == IN_REVIEW"
            - "Formula.${fc_id}.status after return-for-revision == DRAFT"
            - "Formula.${fc_id}.status after second submit == IN_REVIEW"
            - "Formula.${fc_id}.version increments with each transition"

      - name: label_submission_review_revision_cycle
        grounds:
          - state_machines.LabelSubmission
          - state_machines.LabelSubmission.DRAFT_to_SUBMITTED
          - state_machines.LabelSubmission.UNDER_REVIEW_to_DRAFT
        distinguishing_aspect: |
          LabelSubmission has a cyclic review loop: DRAFT -> SUBMITTED -> UNDER_REVIEW
          -> DRAFT (return for revision) -> SUBMITTED again. This is a non-linear cycle
          on the LabelSubmission entity, distinct from the Formula cycle. Multiple
          review rounds can occur before final approval or rejection.
        test_recipe:
          setup:
            - "An APPROVED Formula exists (via DRAFT->IN_REVIEW->APPROVED)."
            - "Clock is at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ADMIN
            - call: "POST /api/v1/nutrient-profiles"
              payload:
                profile_code: "INF-6-12M"
                nutrient_specs:
                  - nutrient_code: "CALCIUM"
                    unit: "mg"
                    min_per_100kcal: 60.00
                    max_per_100kcal: 180.00
                    target_per_100kcal: 120.00
                regulation_ref: "21 CFR 107.100"
                effective_from: "2026-01-01T00:00:00Z"
              as: REGULATORY_AFFAIRS
              captures: { npl_id: $.data.id }
            - call: "POST /api/v1/nutrient-profiles/${npl_id}/submit"
              payload: {}
              as: REGULATORY_AFFAIRS
            - call: "POST /api/v1/nutrient-profiles/${npl_id}/approve"
              payload: {}
              as: REGULATORY_AFFAIRS
            - call: "POST /api/v1/ingredients"
              payload:
                ingredient_code: "CALC-CARB"
                ingredient_name: "Calcium Carbonate"
                category: "MINERAL_PREMIX"
                pathogen_risk_class: "LOW_RISK"
                storage_condition: "AMBIENT"
              as: QA_MANAGER
              captures: { ingl_id: $.data.id }
            - call: "POST /api/v1/formulas"
              payload:
                formula_code: "IF-LABEL-CYCLE"
                product_name: "Label Cycle Test"
                nutrient_profile_id: "${npl_id}"
                ingredients:
                  - ingredient_id: "${ingl_id}"
                    percentage_by_weight: 100.000
                    is_critical: true
                process_type: "DRY_BLEND"
              as: REGULATORY_AFFAIRS
              captures: { fl_id: $.data.id }
            - call: "POST /api/v1/formulas/${fl_id}/submit-for-review"
              payload: {}
              as: REGULATORY_AFFAIRS
            - call: "POST /api/v1/process-validations"
              payload:
                formula_id: "${fl_id}"
                validation_type: "DRY_BLEND_HOMOGENEITY"
                protocol_version: "PV-2026-006"
                validation_validity_days: 365
              as: QA_MANAGER
              captures: { pvl_id: $.data.id }
            - call: "POST /api/v1/process-validations/${pvl_id}/start"
              payload: {}
              as: PRODUCTION_SUPERVISOR
            - call: "POST /api/v1/process-validations/${pvl_id}/complete"
              payload:
                test_results:
                  - test_name: "homogeneity_cv"
                    measured_value: 4.0
                    acceptance_criteria: "<= 5.0"
                    pass: true
              as: QUALITY_ANALYST
            - call: "POST /api/v1/formulas/${fl_id}/approve"
              payload: {}
              as: QA_MANAGER
          trigger:
            - call: "POST /api/v1/label-submissions"
              payload:
                formula_id: "${fl_id}"
                submission_type: "NEW_PRODUCT_REGISTRATION"
                label_text: "Label Cycle Test - Initial label"
              as: REGULATORY_AFFAIRS
              captures: { lsc_id: $.data.id }
            - call: "POST /api/v1/label-submissions/${lsc_id}/submit"
              payload: {}
              as: REGULATORY_AFFAIRS
            - call: "POST /api/v1/label-submissions/${lsc_id}/assign-reviewer"
              payload: { reviewer_id: "usr_qa_mgr_01" }
              as: QA_MANAGER
            - call: "POST /api/v1/label-submissions/${lsc_id}/return-for-revision"
              payload: {}
              as: QA_MANAGER
              captures: { ls_returned: $.data }
            - call: "POST /api/v1/label-submissions/${lsc_id}/submit"
              payload: {}
              as: REGULATORY_AFFAIRS
              captures: { ls_resubmitted: $.data }
          assert:
            - "LabelSubmission.${lsc_id}.status after return-for-revision == DRAFT"
            - "LabelSubmission.${lsc_id}.status after resubmit == SUBMITTED"
            - "LabelSubmission version increments with each transition"

  # =========================================================================
  # Rule 4: transitive_cascade — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: supplier_suspend_cascades_to_lots_then_blocks_batch
        grounds:
          - state_machines.Supplier.QUALIFIED_to_SUSPENDED
          - state_machines.IngredientLot.QC_PASSED_to_QUARANTINED
          - state_machines.ProductionBatch
        distinguishing_aspect: |
          Depth-3 cascade: Supplier QUALIFIED->SUSPENDED triggers IngredientLot
          QC_PASSED->QUARANTINED (link 1->2), which then blocks any
          ProductionBatch.start-production that would consume those lots (link 2->3).
          The cascade is caused by each previous link, not directly by the original action.
        test_recipe:
          setup:
            - "A QUALIFIED Supplier S-CASC exists with audit passing."
            - "An Ingredient ING-CASC exists."
            - "An IngredientLot IL-CASC exists with qc_status QC_PASSED, supplied by S-CASC."
            - "Clock is at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ADMIN
            - call: "POST /api/v1/suppliers"
              payload:
                supplier_code: "SUP-CASC"
                legal_name: "Cascade Test Supplier"
                ingredient_categories: ["DAIRY_BASE"]
                audit_frequency_days: 180
              as: QA_MANAGER
              captures: { sup_casc_id: $.data.id }
            - call: "POST /api/v1/suppliers/${sup_casc_id}/audits"
              payload:
                audit_type: "INITIAL"
                audit_date: "2026-07-01T00:00:00Z"
                auditor_name: "Cascade Auditor"
                score: 90.00
                findings: []
              as: QUALITY_ANALYST
            - call: "POST /api/v1/ingredients"
              payload:
                ingredient_code: "ING-CASC"
                ingredient_name: "Cascade Ingredient"
                category: "DAIRY_BASE"
                pathogen_risk_class: "HIGH_RISK"
                storage_condition: "REFRIGERATED"
              as: QA_MANAGER
              captures: { ing_casc_id: $.data.id }
            - call: "POST /api/v1/ingredient-lots"
              payload:
                ingredient_id: "${ing_casc_id}"
                supplier_id: "${sup_casc_id}"
                lot_number: "LOT-CASC-001"
                quantity_kg: 200.000
                received_date: "2026-07-15T00:00:00Z"
                expiry_date: "2027-07-15T00:00:00Z"
              as: SUPPLY_CHAIN_PLANNER
              captures: { lot_casc_id: $.data.id }
            - call: "POST /api/v1/ingredient-lots/${lot_casc_id}/qc-pass"
              payload: {}
              as: QUALITY_ANALYST
          trigger:
            - call: "POST /api/v1/suppliers/${sup_casc_id}/suspend"
              payload: { reason: "Pathogen found in facility environmental swab" }
              as: QUALITY_ANALYST
            - call: "GET /api/v1/ingredient-lots/${lot_casc_id}"
              as: QUALITY_ANALYST
              captures: { lot_after_suspend: $.data }
          assert:
            - "Supplier.${sup_casc_id}.qualification_status == SUSPENDED"
            - "IngredientLot.${lot_casc_id}.qc_status == QUARANTINED (cascaded from supplier suspension)"

