              payload: {}
              as: DistributionPlanner
              captures: { stale_win_v: "$.data.version" }
          trigger:
            - call: "POST /vaccine-distribution/site-orders/${order_a}/accept"
              payload: { accepted_cartons: 2, deliver_at: "2026-09-01T06:00:00Z", expected_allocation_window_version: "${stale_win_v}" }
              as: DistributionPlanner
              captures: { accepted_a: "$.data.accepted_cartons" }
            - call: "POST /vaccine-distribution/site-orders/${order_b}/accept"
              payload: { accepted_cartons: 3, deliver_at: "2026-09-01T06:00:00Z", expected_allocation_window_version: "${stale_win_v}" }
