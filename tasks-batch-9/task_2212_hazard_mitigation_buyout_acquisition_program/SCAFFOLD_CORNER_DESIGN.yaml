      - name: purchase_offer_actions_from_a_state_that_does_not_admit_them
        claim_type: invalid_transition
        grounds:
          - validations.priority_28
          - state_machines.PurchaseOffer
          - errors.ERR_INVALID_OFFER_STATE
        excluded_because:
          difficulty_instance: offer_state_check_outranks_federal_cap_check_on_presentation
          rationale: |
            That instance presents an offer twice and shows the second presentation returning 409
            ERR_INVALID_OFFER_STATE from PRESENTED even though the federal cap is also breached, which
            exercises the offer machine's invalid-transition claim at greater depth than a bare
            wrong-state probe.

      - name: parcel_participation_and_acquisition_dimensions_evolve_independently
        claim_type: parallel
        grounds:
          - state_machines.Parcel
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: parcel_participation_and_acquisition_dimensions_advance_independently
          rationale: |
            The parallel-shape claim is exactly that instance's subject: it drives participation_status
            to VOLUNTARY_CONFIRMED while acquisition_status is still NOT_STARTED and then advances
            acquisition_status without touching participation_status.

      - name: deed_recording_cascades_down_to_the_project_open_space_total
        claim_type: cascade_down
        grounds:
          - state_machines.ClosingRecord
          - calculations.protected_open_space_acres
        excluded_because:
          difficulty_instance: deed_recording_cascades_four_levels_into_project_open_space_acreage
          rationale: |
            The downward cascade claim is that instance's subject - work order completion to parcel to
            new deed restriction to project acreage - and it asserts every intermediate literal.

      - name: a_revoked_utility_confirmation_bubbles_up_to_the_work_order
        claim_type: bubble_up
        grounds:
          - state_machines.UtilityDisconnection
          - state_machines.DemolitionWorkOrder
        excluded_because:
          difficulty_instance: utility_disconnection_failed_self_loop_bubbles_work_order_back_to_hold
          rationale: |
            That instance drives a CONFIRMED child back to FAILED and asserts the parent returning
            READY -> UTILITY_HOLD together with the recomputed confirmed_utility_types, which is the
            bubble-up claim in full.

      - name: participation_withdrawal_cascades_across_aggregates
        claim_type: cross_entity
        grounds:
          - state_machines.Parcel
          - endpoints.POST_parcels_parcel_id_participation
        excluded_because:
          difficulty_instance: participation_withdrawal_cascades_four_levels_into_federal_deobligation
          rationale: |
            Withdrawal is the scenario's widest cross-entity cascade (offer, relocation case,
            acquisition dimension, project obligation and viability rollups) and that instance asserts
            each level's literal outcome.

      - name: program_income_entries_stay_in_sync_with_the_project_balance
        claim_type: ledger_sync
        grounds:
          - entities.ProgramIncomeLedgerEntry
          - calculations.program_income_federal_share
        excluded_because:
          difficulty_instance: program_income_balance_returns_to_the_same_literal_after_ledger_entry_reversal
          rationale: |
            That instance posts, reverses and re-posts ledger entries and asserts the project balance
            literal after each step, which is the ledger-sync claim.

      - name: dob_reversal_compensates_without_rewriting_the_offer
        claim_type: compensation
        grounds:
          - state_machines.Parcel
          - calculations.dob_deduction_total
        excluded_because:
          difficulty_instance: dob_reversal_restores_parcel_deduction_total_without_rewriting_the_created_offer
          rationale: |
            The compensation claim - a reversal that restores one derived field while deliberately
            leaving a snapshotted downstream figure alone - is that instance's whole point.

      - name: withdrawal_cascade_is_conditional_on_how_far_acquisition_progressed
        claim_type: conditional_cascade
        grounds:
          - validations.priority_61
          - endpoints.POST_parcels_parcel_id_participation
        excluded_because:
          difficulty_instance: participation_withdrawal_cascades_four_levels_into_federal_deobligation
          rationale: |
            The same instance shows the cascade firing only for a pre-closing parcel; the
            post-recording case is refused with ERR_OPEN_SPACE_RESTRICTION_ACTIVE, which is covered by
            the endpoints-section instance withdrawal_after_open_space_recording_is_refused.

  - section: calculations
    instances:

      - name: appraisal_validity_end_clamps_to_month_end_only_when_the_anchor_day_is_missing
        claim_type: correct_result
        grounds:
          - calculations.appraisal_validity_window
          - global_constants.APPRAISAL_VALIDITY_MONTHS
          - entities.Appraisal.fields.validity_end_date
        distinguishing_aspect: |
          Three INITIAL appraisals on three different parcels anchor on a leap day, on a 31-day month
          end and on another 31-day month end: only the leap-day anchor is clamped (2028-02-29 ->
          2029-02-28), while 2028-01-31 -> 2029-01-31 and 2028-08-31 -> 2029-08-31 keep their
          day-of-month, so the clamp is conditional on the target month's length rather than applied
          to every month-end anchor.
        test_recipe:
          setup:
            - "One APPROVED MitigationProject with three parcels."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
