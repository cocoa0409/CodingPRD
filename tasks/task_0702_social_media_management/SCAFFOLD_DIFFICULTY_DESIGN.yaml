# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_0702_social_media_management
# 9 rule_ids x >=2 instances = 18 instances total
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: retainer_churn_quote_forward_vs_chronological
        grounds:
          - calculations.retainer_proration_on_churn
          - entities.Client.fields.retainer_fee_cents
          - entities.Client.fields.posts_published_this_cycle
          - entities.Client.fields.monthly_post_quota
        distinguishing_aspect: |
          On the Client domain, forward_full owed (=retainer_fee_cents=500000) and
          chronological_prorated owed (=ceil(500000*3/10)=150000) differ for the
          identical client; the churn-quote returns both and they are not equal.
        test_recipe:
          setup:
            - "ACTIVE client with retainer_fee_cents=500000, monthly_post_quota=10, and exactly 3 ContentItems PUBLISHED in the current cycle (posts_published_this_cycle=3)."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Acme", account_manager_id: "am-1" }
              as: AccountManager
              captures: { cid: $.data.id }
            - call: "POST /retainer-packages"
              payload: { client_id: "${cid}", tier: "GROWTH", monthly_retainer_fee_cents: 500000, monthly_boost_budget_cents: 1000000, monthly_post_quota: 10, included_channels: 3 }
              as: AccountManager
              captures: { pkg: $.data.id }
            - call: "POST /retainer-packages/${pkg}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /channels"
              payload: { client_id: "${cid}", platform: "INSTAGRAM", handle: "@acme" }
              as: AccountManager
              captures: { ch: $.data.id }
            - call: "POST /channels/${ch}/connect"
              payload: {}
              as: AccountManager
            - call: "POST /channels/${ch}/go-live"
              payload: {}
              as: AccountManager
            - call: "POST /clients/${cid}/activate"
              payload: {}
              as: AccountManager
            # publish 3 content items
            - call: "POST /content-items"
              payload: { client_id: "${cid}", author_id: "cc-1", title: "P1", body: "b1" }
              as: ContentCreator
              captures: { ci1: $.data.id }
            - call: "POST /content-targets"
              payload: { content_item_id: "${ci1}", channel_id: "${ch}" }
              as: ContentCreator
            - call: "POST /content-items/${ci1}/submit"
              payload: {}
              as: ContentCreator
            - call: "POST /content-items/${ci1}/approve"
              payload: {}
              as: Approver
            - call: "POST /content-items/${ci1}/schedule"
              payload: { channel_id: "${ch}", slot_start_utc: "2026-03-01T09:00:00Z", duration_minutes: 15 }
              as: AccountManager
            - call: "POST /content-items/${ci1}/publish"
              payload: {}
              as: AccountManager
            - call: "POST /content-items"
              payload: { client_id: "${cid}", author_id: "cc-1", title: "P2", body: "b2" }
              as: ContentCreator
              captures: { ci2: $.data.id }
            - call: "POST /content-targets"
              payload: { content_item_id: "${ci2}", channel_id: "${ch}" }
              as: ContentCreator
            - call: "POST /content-items/${ci2}/submit"
              payload: {}
              as: ContentCreator
            - call: "POST /content-items/${ci2}/approve"
              payload: {}
              as: Approver
            - call: "POST /content-items/${ci2}/schedule"
              payload: { channel_id: "${ch}", slot_start_utc: "2026-03-01T10:00:00Z", duration_minutes: 15 }
              as: AccountManager
            - call: "POST /content-items/${ci2}/publish"
              payload: {}
              as: AccountManager
            - call: "POST /content-items"
              payload: { client_id: "${cid}", author_id: "cc-1", title: "P3", body: "b3" }
              as: ContentCreator
              captures: { ci3: $.data.id }
            - call: "POST /content-targets"
              payload: { content_item_id: "${ci3}", channel_id: "${ch}" }
              as: ContentCreator
            - call: "POST /content-items/${ci3}/submit"
              payload: {}
              as: ContentCreator
            - call: "POST /content-items/${ci3}/approve"
              payload: {}
              as: Approver
            - call: "POST /content-items/${ci3}/schedule"
              payload: { channel_id: "${ch}", slot_start_utc: "2026-03-01T11:00:00Z", duration_minutes: 15 }
              as: AccountManager
            - call: "POST /content-items/${ci3}/publish"
              payload: {}
              as: AccountManager
          trigger:
            - call: "GET /clients/${cid}/churn-quote"
              payload: {}
              as: AccountManager
              captures: { fwd: $.data.forward_full_cents, chrono: $.data.chronological_prorated_cents }
          assert:
            - "churn-quote.forward_full_cents == 500000"
            - "churn-quote.chronological_prorated_cents == 150000"
            - "forward_full_cents != chronological_prorated_cents"

      - name: boost_cost_provisional_reserved_vs_final_spent
        grounds:
          - calculations.boost_settlement_cost
          - entities.BoostCampaign.fields.reserved_budget_cents
          - entities.BoostCampaign.fields.spent_budget_cents
          - state_machines.BoostCampaign.RUNNING_to_COMPLETED
        distinguishing_aspect: |
          On the BoostCampaign domain (different entity than Client retainer), the
          provisional_reserved cost (=reserved_budget_cents=300000) and the
          final_spent cost (=min(120000, 200000*1, 300000)=120000) diverge for the
          same campaign; reserved figure is read while RUNNING, spent figure after COMPLETED.
        test_recipe:
          setup:
            - "ACTIVE client (boost_budget_limit_cents=1000000) with a RUNNING BoostCampaign reserved=300000, daily_cap=200000, after one record-spend of 120000 (spent=120000, days_elapsed=1)."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "BoostCo", account_manager_id: "am-1" }
              as: AccountManager
              captures: { cid: $.data.id }
            - call: "POST /retainer-packages"
              payload: { client_id: "${cid}", tier: "SCALE", monthly_retainer_fee_cents: 400000, monthly_boost_budget_cents: 1000000, monthly_post_quota: 10, included_channels: 3 }
              as: AccountManager
              captures: { pkg: $.data.id }
            - call: "POST /retainer-packages/${pkg}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /channels"
              payload: { client_id: "${cid}", platform: "FACEBOOK", handle: "@boostco" }
              as: AccountManager
              captures: { ch: $.data.id }
            - call: "POST /channels/${ch}/connect"
              payload: {}
              as: AccountManager
            - call: "POST /channels/${ch}/go-live"
              payload: {}
              as: AccountManager
            - call: "POST /clients/${cid}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /content-items"
              payload: { client_id: "${cid}", author_id: "cc-1", title: "Boosted", body: "b" }
              as: ContentCreator
              captures: { ci: $.data.id }
            - call: "POST /content-targets"
              payload: { content_item_id: "${ci}", channel_id: "${ch}" }
              as: ContentCreator
            - call: "POST /content-items/${ci}/submit"
              payload: {}
              as: ContentCreator
            - call: "POST /content-items/${ci}/approve"
              payload: {}
              as: Approver
            - call: "POST /content-items/${ci}/schedule"
              payload: { channel_id: "${ch}", slot_start_utc: "2026-03-01T09:00:00Z", duration_minutes: 15 }
              as: AccountManager
            - call: "POST /content-items/${ci}/publish"
              payload: {}
              as: AccountManager
            - call: "POST /boost-campaigns"
              payload: { client_id: "${cid}", content_item_id: "${ci}", requested_budget_cents: 300000, daily_cap_cents: 200000, duration_days: 3 }
              as: FinanceController
              captures: { bc: $.data.id }
            - call: "GET /clients/${cid}"
              payload: {}
              as: FinanceController
              captures: { cver: $.data.version }
            - call: "POST /boost-campaigns/${bc}/reserve"
              payload: { expected_client_version: "${cver}" }
              as: FinanceController
            - call: "POST /boost-campaigns/${bc}/launch"
              payload: {}
              as: FinanceController
            - call: "POST /boost-campaigns/${bc}/record-spend"
              payload: { amount_cents: 120000 }
              as: FinanceController
          trigger:
            - call: "GET /boost-campaigns/${bc}"
              payload: {}
              as: FinanceController
              captures: { reserved: $.data.reserved_budget_cents, spent: $.data.spent_budget_cents }
            - call: "POST /boost-campaigns/${bc}/complete"
              payload: {}
              as: FinanceController
              captures: { reserved_after: $.data.reserved_budget_cents, spent_after: $.data.spent_budget_cents }
          assert:
            - "BoostCampaign.${bc}.reserved_budget_cents (while RUNNING, before complete) == 300000"
            - "BoostCampaign.${bc}.spent_budget_cents == 120000"
            - "provisional_reserved cost (300000) != final_spent cost (120000)"
            - "BoostCampaign.${bc}.reserved_budget_cents after COMPLETED == 0"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: collab_settlement_round_per_line_then_sum
        grounds:
          - calculations.collab_settlement_amount
          - entities.InfluencerCollab.fields.offer_fee_cents
          - entities.InfluencerCollab.fields.deliverable_count
          - entities.InfluencerCollab.fields.approved_asset_count
        distinguishing_aspect: |
          Mode (b) nested rounding where order matters: per_deliverable_value=floor(100000/4)=25000,
          bonus=floor(25000*0.05)*1(tier2 unit for approved=3..5)*... with approved=6 ->
          tier2_units=3, tier3_units=1 -> bonus=floor(1250)*3 + floor(2500)*1 = 3750+2500=6250,
          settlement=106250; 'sum then round' would differ. Order is pinned to per-line floor.
        test_recipe:
          setup:
            - "ACTIVE client with an ACCEPTED InfluencerCollab offer_fee_cents=100000, deliverable_count=4, and 6 UGCAssets RIGHTS_CLEARED (approved_asset_count=6)."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "CollabCo", account_manager_id: "am-1" }
              as: AccountManager
              captures: { cid: $.data.id }
            - call: "POST /retainer-packages"
              payload: { client_id: "${cid}", tier: "GROWTH", monthly_retainer_fee_cents: 400000, monthly_boost_budget_cents: 500000, monthly_post_quota: 10, included_channels: 2 }
              as: AccountManager
              captures: { pkg: $.data.id }
            - call: "POST /retainer-packages/${pkg}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /channels"
              payload: { client_id: "${cid}", platform: "TIKTOK", handle: "@collabco" }
              as: AccountManager
              captures: { ch: $.data.id }
            - call: "POST /channels/${ch}/connect"
              payload: {}
              as: AccountManager
            - call: "POST /channels/${ch}/go-live"
              payload: {}
              as: AccountManager
            - call: "POST /clients/${cid}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /influencer-collabs"
              payload: { client_id: "${cid}", influencer_handle: "@star", offer_fee_cents: 100000, deliverable_count: 4 }
              as: AccountManager
              captures: { col: $.data.id }
            - call: "POST /influencer-collabs/${col}/accept"
              payload: {}
              as: AccountManager
            - call: "POST /ugc-assets"
              payload: { collab_id: "${col}", asset_url: "http://u/1" }
              as: AccountManager
              captures: { a1: $.data.id }
            - call: "POST /ugc-assets/${a1}/clear-rights"
              payload: {}
              as: AccountManager
            - call: "POST /ugc-assets"
              payload: { collab_id: "${col}", asset_url: "http://u/2" }
              as: AccountManager
              captures: { a2: $.data.id }
            - call: "POST /ugc-assets/${a2}/clear-rights"
              payload: {}
              as: AccountManager
            - call: "POST /ugc-assets"
              payload: { collab_id: "${col}", asset_url: "http://u/3" }
              as: AccountManager
              captures: { a3: $.data.id }
            - call: "POST /ugc-assets/${a3}/clear-rights"
              payload: {}
              as: AccountManager
            - call: "POST /ugc-assets"
              payload: { collab_id: "${col}", asset_url: "http://u/4" }
              as: AccountManager
              captures: { a4: $.data.id }
            - call: "POST /ugc-assets/${a4}/clear-rights"
              payload: {}
              as: AccountManager
            - call: "POST /ugc-assets"
              payload: { collab_id: "${col}", asset_url: "http://u/5" }
              as: AccountManager
              captures: { a5: $.data.id }
            - call: "POST /ugc-assets/${a5}/clear-rights"
              payload: {}
              as: AccountManager
            - call: "POST /ugc-assets"
              payload: { collab_id: "${col}", asset_url: "http://u/6" }
              as: AccountManager
              captures: { a6: $.data.id }
            - call: "POST /ugc-assets/${a6}/clear-rights"
              payload: {}
              as: AccountManager
          trigger:
            - call: "GET /influencer-collabs/${col}/settlement-quote"
              payload: {}
              as: AccountManager
              captures: { amt: $.data.settlement_amount_cents }
          assert:
            - "settlement-quote.settlement_amount_cents == 106250"
            - "InfluencerCollab.${col}.approved_asset_count == 6"

      - name: boost_final_cost_nested_min_of_three_ceilings
        grounds:
          - calculations.boost_settlement_cost
          - entities.BoostCampaign.fields.spent_budget_cents
          - entities.BoostCampaign.fields.daily_cap_cents
          - entities.BoostCampaign.fields.days_elapsed
          - entities.BoostCampaign.fields.reserved_budget_cents
        distinguishing_aspect: |
          Mode (a) >=3-input non-linear min/max: final_spent =
          min(spent=180000, daily_cap*days_elapsed=100000*2=200000, reserved=300000)
          = 180000 (the spent ceiling binds, not the pacing or reservation ceiling).
        test_recipe:
          setup:
            - "ACTIVE client; RUNNING BoostCampaign reserved=300000, daily_cap=100000, two record-spends 90000 then 90000 (spent=180000, days_elapsed=2)."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "MinCo", account_manager_id: "am-1" }
              as: AccountManager
              captures: { cid: $.data.id }
            - call: "POST /retainer-packages"
              payload: { client_id: "${cid}", tier: "SCALE", monthly_retainer_fee_cents: 400000, monthly_boost_budget_cents: 1000000, monthly_post_quota: 10, included_channels: 2 }
              as: AccountManager
              captures: { pkg: $.data.id }
            - call: "POST /retainer-packages/${pkg}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /channels"
              payload: { client_id: "${cid}", platform: "X", handle: "@minco" }
              as: AccountManager
              captures: { ch: $.data.id }
            - call: "POST /channels/${ch}/connect"
              payload: {}
              as: AccountManager
            - call: "POST /channels/${ch}/go-live"
              payload: {}
              as: AccountManager
            - call: "POST /clients/${cid}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /content-items"
              payload: { client_id: "${cid}", author_id: "cc-1", title: "B", body: "b" }
              as: ContentCreator
              captures: { ci: $.data.id }
            - call: "POST /content-targets"
              payload: { content_item_id: "${ci}", channel_id: "${ch}" }
              as: ContentCreator
            - call: "POST /content-items/${ci}/submit"
              payload: {}
              as: ContentCreator
            - call: "POST /content-items/${ci}/approve"
              payload: {}
              as: Approver
            - call: "POST /content-items/${ci}/schedule"
              payload: { channel_id: "${ch}", slot_start_utc: "2026-03-01T09:00:00Z", duration_minutes: 15 }
              as: AccountManager
            - call: "POST /content-items/${ci}/publish"
              payload: {}
              as: AccountManager
            - call: "POST /boost-campaigns"
              payload: { client_id: "${cid}", content_item_id: "${ci}", requested_budget_cents: 300000, daily_cap_cents: 100000, duration_days: 3 }
              as: FinanceController
              captures: { bc: $.data.id }
            - call: "GET /clients/${cid}"
              payload: {}
              as: FinanceController
              captures: { cver: $.data.version }
            - call: "POST /boost-campaigns/${bc}/reserve"
              payload: { expected_client_version: "${cver}" }
              as: FinanceController
            - call: "POST /boost-campaigns/${bc}/launch"
              payload: {}
              as: FinanceController
            - call: "POST /boost-campaigns/${bc}/record-spend"
              payload: { amount_cents: 90000, spend_day_index: 0 }
              as: FinanceController
            - call: "POST /boost-campaigns/${bc}/record-spend"
              payload: { amount_cents: 90000, spend_day_index: 1 }
              as: FinanceController
          trigger:
            - call: "GET /boost-campaigns/${bc}"
              payload: {}
              as: FinanceController
              captures: { spent: $.data.spent_budget_cents, days: $.data.days_elapsed }
          assert:
            - "BoostCampaign.${bc}.spent_budget_cents == 180000"
            - "BoostCampaign.${bc}.days_elapsed == 2"
            - "final_spent cost == min(180000, 100000*2, 300000) == 180000"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: content_item_revision_cycle_loop
        grounds:
          - state_machines.ContentItem.IN_REVIEW_to_CHANGES_REQUESTED
          - state_machines.ContentItem.CHANGES_REQUESTED_to_IN_REVIEW
          - entities.ContentItem.fields.revision_round
        distinguishing_aspect: |
          ContentItem cycles IN_REVIEW->CHANGES_REQUESTED->IN_REVIEW (a true A->B->A
          loop); each resubmit increments revision_round, so after two loops
          revision_round==2 — a linear pipeline could never revisit IN_REVIEW.
        test_recipe:
          setup:
            - "ACTIVE client with a ContentItem (with one ContentTarget) that has been submitted, sent back for changes, resubmitted, sent back again, resubmitted (two full revision loops)."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "RevCo", account_manager_id: "am-1" }
              as: AccountManager
              captures: { cid: $.data.id }
            - call: "POST /retainer-packages"
              payload: { client_id: "${cid}", tier: "STARTER", monthly_retainer_fee_cents: 200000, monthly_boost_budget_cents: 0, monthly_post_quota: 5, included_channels: 1 }
              as: AccountManager
              captures: { pkg: $.data.id }
            - call: "POST /retainer-packages/${pkg}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /channels"
              payload: { client_id: "${cid}", platform: "LINKEDIN", handle: "@revco" }
              as: AccountManager
              captures: { ch: $.data.id }
            - call: "POST /channels/${ch}/connect"
              payload: {}
              as: AccountManager
            - call: "POST /channels/${ch}/go-live"
              payload: {}
              as: AccountManager
            - call: "POST /clients/${cid}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /content-items"
              payload: { client_id: "${cid}", author_id: "cc-1", title: "Loop", body: "b" }
              as: ContentCreator
              captures: { ci: $.data.id }
            - call: "POST /content-targets"
              payload: { content_item_id: "${ci}", channel_id: "${ch}" }
              as: ContentCreator
            - call: "POST /content-items/${ci}/submit"
              payload: {}
              as: ContentCreator
            - call: "POST /content-items/${ci}/request-changes"
              payload: { note: "fix1" }
              as: Approver
            - call: "POST /content-items/${ci}/resubmit"
              payload: {}
              as: ContentCreator
            - call: "POST /content-items/${ci}/request-changes"
              payload: { note: "fix2" }
              as: Approver
          trigger:
            - call: "POST /content-items/${ci}/resubmit"
              payload: {}
              as: ContentCreator
              captures: { st: $.data.status, rr: $.data.revision_round }
          assert:
            - "ContentItem.${ci}.status == IN_REVIEW"
            - "ContentItem.${ci}.revision_round == 2"

      - name: influencer_collab_counter_negotiation_loop
        grounds:
          - state_machines.InfluencerCollab.PROPOSED_to_COUNTERED
          - state_machines.InfluencerCollab.COUNTERED_to_COUNTERED
          - entities.InfluencerCollab.fields.negotiation_round
        distinguishing_aspect: |
          InfluencerCollab (different entity than ContentItem) self-loops on COUNTERED
          (COUNTERED->COUNTERED) over multiple counter rounds; after two counters
          negotiation_round==2 and offer_fee_cents reflects the latest counter (=85000).
        test_recipe:
          setup:
            - "ACTIVE client with a PROPOSED InfluencerCollab offer_fee_cents=100000; one counter to 90000 then another to 85000 (two counter rounds)."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "NegoCo", account_manager_id: "am-1" }
              as: AccountManager
              captures: { cid: $.data.id }
            - call: "POST /retainer-packages"
              payload: { client_id: "${cid}", tier: "GROWTH", monthly_retainer_fee_cents: 300000, monthly_boost_budget_cents: 0, monthly_post_quota: 5, included_channels: 1 }
              as: AccountManager
              captures: { pkg: $.data.id }
            - call: "POST /retainer-packages/${pkg}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /channels"
              payload: { client_id: "${cid}", platform: "INSTAGRAM", handle: "@negoco" }
              as: AccountManager
              captures: { ch: $.data.id }
            - call: "POST /channels/${ch}/connect"
              payload: {}
              as: AccountManager
            - call: "POST /channels/${ch}/go-live"
              payload: {}
              as: AccountManager
            - call: "POST /clients/${cid}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /influencer-collabs"
              payload: { client_id: "${cid}", influencer_handle: "@infl", offer_fee_cents: 100000, deliverable_count: 2 }
              as: AccountManager
              captures: { col: $.data.id }
            - call: "POST /influencer-collabs/${col}/counter"
              payload: { counter_fee_cents: 90000 }
              as: AccountManager
          trigger:
            - call: "POST /influencer-collabs/${col}/counter"
              payload: { counter_fee_cents: 85000 }
              as: AccountManager
              captures: { st: $.data.status, nr: $.data.negotiation_round, fee: $.data.offer_fee_cents }
          assert:
            - "InfluencerCollab.${col}.status == COUNTERED"
            - "InfluencerCollab.${col}.negotiation_round == 2"
            - "InfluencerCollab.${col}.offer_fee_cents == 85000"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: client_churn_cascade_depth3
        grounds:
          - state_machines.Client.ONBOARDING_to_CHURNED
          - state_machines.Channel.LIVE_to_DISCONNECTED
          - state_machines.ScheduleSlot.RESERVED_to_RELEASED
          - state_machines.ContentItem.SCHEDULED_to_APPROVED
        distinguishing_aspect: |
          Depth-3 chain originating from client churn: churn -> Channel DISCONNECTED ->
          its RESERVED ScheduleSlot RELEASED -> that slot's SCHEDULED ContentItem reverts
          to APPROVED with scheduled_slot_id cleared. Each hop is caused by the prior hop.
        test_recipe:
          setup:
            - "ACTIVE client with a LIVE channel and a ContentItem in SCHEDULED state (slot RESERVED), no RESERVED/RUNNING boosts."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "ChurnCo", account_manager_id: "am-1" }
              as: AccountManager
              captures: { cid: $.data.id }
            - call: "POST /retainer-packages"
              payload: { client_id: "${cid}", tier: "GROWTH", monthly_retainer_fee_cents: 300000, monthly_boost_budget_cents: 500000, monthly_post_quota: 10, included_channels: 2 }
              as: AccountManager
              captures: { pkg: $.data.id }
            - call: "POST /retainer-packages/${pkg}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /channels"
              payload: { client_id: "${cid}", platform: "FACEBOOK", handle: "@churnco" }
              as: AccountManager
              captures: { ch: $.data.id }
