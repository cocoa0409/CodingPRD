# =============================================================================
# PRD Benchmark Seed Tables — task_3099
# Domain: credit rating assignment, surveillance & analyst rotation (agency model)
# =============================================================================

scenario: |
  Generate task much harder than expert level!

  Credit Rating Assignment, Surveillance & Analyst Rotation (Moody's): rating
  request intake with engagement letters and fee arrangements, analytical team
  assignment with rotation requirements and conflict screening, rating committee
  process with voting, documentation and dissent recording, rating publication
  with rationale, outlook and watch designations, ongoing surveillance with
  periodic review requirements and event-driven rating actions, issuer appeal of
  a rating prior to publication with new information only, unsolicited rating
  disclosure and methodology publication requirements, analyst compensation
  separation from fee generation and look-back reviews for analysts who leave
  for a rated issuer

domain_name: credit-rating-agency
api_prefix: /rating-agency

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - version_pinning_on_approval
    - selector_policy
    - scheduled_deferred_actions
  entity_topology: graph
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: RatedEntity
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered legal name of the issuer being rated" }
      - { name: sector, type: enum, source: input, description: "CORPORATE_FINANCE | FINANCIAL_INSTITUTIONS | SOVEREIGN | STRUCTURED_FINANCE | PROJECT_FINANCE" }
      - { name: domicile_country, type: string, source: input, description: "ISO-3166 alpha-2 country of incorporation" }
      - { name: revenue_band, type: enum, source: input, description: "LARGE | MID | SMALL — drives surveillance cycle length" }
      - { name: methodology_id, type: string, source: input, description: "FK -> Methodology.id; methodology pinned to this issuer for its ratings" }
      - { name: solicitation_status, type: enum, source: system, default: SOLICITED, description: "SOLICITED | UNSOLICITED — UNSOLICITED forces disclosure on every published decision" }
      - { name: surveillance_posture, type: enum, source: computed, default: NORMAL, description: "NORMAL | ACTIVE_WATCH | RESTRICTED — derived posture gating all surveillance writes" }
      - { name: first_rated_at, type: datetime, source: system, description: "Timestamp of the first PUBLISHED RatingDecision; null until then" }
      - { name: current_grade, type: enum, source: computed, description: "Grade of the most recently PUBLISHED RatingDecision for this entity; null if none" }

  - name: EngagementLetter
    parent: null
    common_fields: true
    fields:
      - { name: rated_entity_id, type: string, source: input, description: "FK -> RatedEntity.id; the issuer this engagement covers" }
      - { name: fee_amount_cents, type: integer, source: input, description: "Total contracted fee in cents, non-negative integer" }
      - { name: fee_structure, type: enum, source: input, description: "FLAT_ANNUAL | MILESTONE | TRANSACTION" }
      - { name: fee_payer_is_issuer, type: boolean, source: input, description: "True when the rated issuer pays; false when a third party pays" }
      - { name: signed_at, type: datetime, source: input, description: "ISO 8601 timestamp the letter was countersigned" }
      - { name: cooling_off_end_at, type: datetime, source: computed, description: "= signed_at + 90 days; no rating may be published before this instant" }
      - { name: fee_credited_cents, type: integer, source: computed, default: 0, description: "Sum of per-request allocations already recognized" }
      - { name: fee_reversed_cents, type: integer, source: computed, default: 0, description: "Sum of allocations reversed by termination" }
      - { name: status, type: enum, source: system, description: "DRAFT → SIGNED → ACTIVE → TERMINATED; SIGNED may revert to DRAFT" }

  - name: RatingRequest
    parent: null
    common_fields: true
    fields:
      - { name: engagement_letter_id, type: string, source: input, description: "FK -> EngagementLetter.id; the engagement that funds this request" }
      - { name: rated_entity_id, type: string, source: input, description: "FK -> RatedEntity.id; the issuer being rated" }
      - { name: instrument_type, type: enum, source: input, description: "SENIOR_UNSECURED | SUBORDINATED | SHORT_TERM | REVOLVER" }
      - { name: instrument_notional_cents, type: integer, source: input, description: "Notional in cents; the allocation weight for engagement fee sharing" }
      - { name: requested_rating_scale, type: enum, source: input, description: "GLOBAL_LONG_TERM | GLOBAL_SHORT_TERM | NATIONAL_SCALE" }
      - { name: received_at, type: datetime, source: system, description: "Server-stamped intake timestamp" }
      - { name: allocated_fee_cents, type: integer, source: computed, default: 0, description: "Per-request share of the engagement fee, per the pinned rounding order" }
      - { name: request_status, type: enum, source: system, description: "SUBMITTED → SCREENING → TEAM_CONFIRMED → COMMITTEE_DECIDED → PUBLISHED, plus WITHDRAWN and APPEALED" }

  - name: Analyst
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Analyst display name" }
      - { name: primary_sector, type: enum, source: input, description: "CORPORATE_FINANCE | FINANCIAL_INSTITUTIONS | SOVEREIGN | STRUCTURED_FINANCE | PROJECT_FINANCE" }
      - { name: analyst_tier, type: enum, source: input, description: "LEAD | SUPPORT | COMMITTEE_ELIGIBLE" }
      - { name: independence_declared_at, type: datetime, source: input, description: "Timestamp of the most recent signed independence declaration" }
      - { name: first_assignment_at, type: datetime, source: computed, description: "created_at of this analyst's earliest AnalyticalTeamAssignment; null if none" }
      - { name: last_lead_assignment_at, type: datetime, source: computed, description: "latest assigned_at where this analyst was the lead; null if none" }
      - { name: consecutive_lead_months, type: integer, source: computed, default: 0, description: "Lead-service months on the current unbroken lead streak, 30-day months, floored" }
      - { name: rotation_eligible, type: boolean, source: computed, default: true, description: "False once consecutive_lead_months >= 60 without an approved exemption" }
      - { name: is_departed, type: boolean, source: system, default: false, description: "True after POST /analysts/{id}/depart" }
      - { name: departed_to_entity_id, type: string, source: system, description: "FK -> RatedEntity.id; nullable; set when the analyst departs to a rated issuer" }

  - name: AnalyticalTeamAssignment
    parent: null
    common_fields: true
    fields:
      - { name: rating_request_id, type: string, source: input, description: "FK -> RatingRequest.id; the request this team serves" }
      - { name: lead_analyst_id, type: string, source: input, description: "FK -> Analyst.id; the lead analyst" }
      - { name: support_analyst_id, type: string, source: input, description: "FK -> Analyst.id; the support analyst" }
      - { name: assigned_at, type: datetime, source: system, description: "Server-stamped assignment timestamp" }
      - { name: window_start, type: datetime, source: input, description: "Inclusive start of the assignment occupancy interval" }
      - { name: window_end, type: datetime, source: input, description: "Exclusive end of the assignment occupancy interval (half-open [start, end))" }
      - { name: conflict_status, type: enum, source: computed, default: PENDING_SCREEN, description: "PENDING_SCREEN | CLEAR | POTENTIAL | DISQUALIFYING; derived from ConflictScreening rows" }
      - { name: rotation_exemption_granted, type: boolean, source: input, default: false, description: "Committee-chair-approved exemption from forced rotation" }
      - { name: rotation_exemption_reason, type: string, source: input, description: "Required when rotation_exemption_granted is true; >= 20 chars" }
      - { name: status, type: enum, source: system, description: "PROPOSED → SCREENED → CONFIRMED → REVOKED; SCREENED may revert to PROPOSED" }

  - name: ConflictScreening
    parent: null
    common_fields: false
    fields:
      - { name: team_assignment_id, type: string, source: input, description: "FK -> AnalyticalTeamAssignment.id; the assignment being screened" }
      - { name: analyst_id, type: string, source: input, description: "FK -> Analyst.id; the analyst whose conflicts are screened" }
      - { name: conflict_type, type: enum, source: input, description: "NONE | PRIOR_EMPLOYMENT | FAMILY_TIE | SECURITY_HOLDING | FEE_DEPENDENCE" }
      - { name: screening_result, type: enum, source: input, description: "CLEAR | POTENTIAL | DISQUALIFYING" }
      - { name: reviewer_user_id, type: string, source: input, description: "Opaque compliance reviewer identifier from X-User-ID" }
      - { name: screened_at, type: datetime, source: system, description: "Server-stamped screening timestamp" }

  - name: RatingCommittee
    parent: null
    common_fields: true
    fields:
      - { name: rating_request_id, type: string, source: input, description: "FK -> RatingRequest.id; the request under committee review" }
      - { name: committee_date, type: datetime, source: input, description: "Scheduled sitting date; drives the session occupancy interval" }
      - { name: required_voting_members, type: integer, source: input, description: "Quorum size, integer in [2, 9]" }
      - { name: votes_cast, type: integer, source: computed, default: 0, description: "Count of CommitteeVote rows on this committee" }
      - { name: quorum_met, type: boolean, source: computed, default: false, description: "True when votes_cast >= required_voting_members" }
      - { name: dissent_count, type: integer, source: computed, default: 0, description: "Count of CommitteeVote rows with a recorded dissent" }
      - { name: committee_status, type: enum, source: system, description: "CONVENED → IN_SESSION → DECIDED → DISSOLVED, or CONVENED → QUORUM_FAILED" }

  - name: CommitteeVote
    parent: null
    common_fields: false
    fields:
      - { name: rating_committee_id, type: string, source: input, description: "FK -> RatingCommittee.id; the committee the vote belongs to" }
      - { name: analyst_id, type: string, source: input, description: "FK -> Analyst.id; the voting analyst" }
      - { name: vote_value, type: enum, source: input, description: "UPGRADE | AFFIRM | DOWNGRADE | ABSTAIN" }
      - { name: assigned_grade, type: enum, source: input, description: "Grade this voter assigns; required unless vote_value is ABSTAIN" }
      - { name: dissent_rationale, type: string, source: input, description: "Required (>= 40 chars) when the vote differs from the committee majority" }
      - { name: is_dissent, type: boolean, source: computed, default: false, description: "True when this row is recorded as a dissent against the decided majority" }
      - { name: voted_at, type: datetime, source: system, description: "Server-stamped vote timestamp; the chronological replay key" }

  - name: RatingDecision
    parent: null
    common_fields: true
    fields:
      - { name: rating_request_id, type: string, source: input, description: "FK -> RatingRequest.id; the request this decision resolves" }
      - { name: assigned_grade, type: enum, source: input, description: "AAA | AA | A | BAA | BA | B | CAA | CA | C" }
      - { name: prior_grade, type: enum, source: computed, description: "RatedEntity.current_grade at the moment the committee decided; null on first rating" }
      - { name: outlook, type: enum, source: input, description: "POSITIVE | STABLE | NEGATIVE | DEVELOPING" }
      - { name: watch_status, type: enum, source: input, description: "NO_WATCH | WATCH_UPGRADE | WATCH_DOWNGRADE" }
      - { name: rationale, type: string, source: input, description: "Published rationale, >= 200 characters" }
      - { name: dissent_count, type: integer, source: computed, default: 0, description: "Votes recorded against the majority at decision time" }
      - { name: dissent_score, type: number, source: computed, default: 0, description: "Weighted dissent score (variant-dependent weight)" }
      - { name: decision_status, type: enum, source: system, description: "DRAFT → APPEAL_WINDOW → PUBLISHED → WITHDRAWN; APPEAL_WINDOW → DRAFT on accepted appeal" }
      - { name: published_at, type: datetime, source: system, description: "Server-stamped publication instant; null until published" }
      - { name: appeal_window_end_at, type: datetime, source: computed, description: "= publishing-intent timestamp + 5 days; the only window in which an appeal is admissible" }
      - { name: is_unsolicited, type: boolean, source: computed, default: false, description: "Mirrors RatedEntity.solicitation_status == UNSOLICITED at decision time" }
      - { name: methodology_code, type: string, source: computed, description: "Version-pinned methodology code from the issuer's pinned Methodology" }

  - name: IssuerAppeal
    parent: null
    common_fields: true
    fields:
      - { name: rating_decision_id, type: string, source: input, description: "FK -> RatingDecision.id; the decision appealed against" }
      - { name: filer_user_id, type: string, source: input, description: "Opaque identifier of the issuer-side filer from X-User-ID" }
      - { name: new_information_summary, type: string, source: input, description: "Summary of the new information, >= 100 chars; must not restate prior filings" }
      - { name: contains_new_information, type: boolean, source: computed, default: false, description: "True when the summary introduces information absent from the decision's filed materials" }
      - { name: appeal_outcome, type: enum, source: system, description: "PENDING → ACCEPTED | REJECTED" }
      - { name: submitted_at, type: datetime, source: system, description: "Server-stamped appeal intake timestamp" }
      - { name: resolution_notes, type: string, source: input, description: "Required (>= 30 chars) when the appeal is resolved" }

  - name: SurveillanceReview
    parent: null
    common_fields: true
    fields:
      - { name: rated_entity_id, type: string, source: input, description: "FK -> RatedEntity.id; the issuer under surveillance" }
      - { name: rating_decision_id, type: string, source: input, description: "FK -> RatingDecision.id; the decision being monitored" }
      - { name: review_type, type: enum, source: input, description: "PERIODIC | EVENT_DRIVEN" }
      - { name: review_cycle_months, type: integer, source: computed, description: "Derived from revenue_band: LARGE=6, MID=12, SMALL=24" }
      - { name: review_due_at, type: datetime, source: input, description: "Calendar instant the review falls due" }
      - { name: overdue_days, type: integer, source: computed, default: 0, description: "max(0, floor((now - review_due_at) / 1 day))" }
      - { name: escalation_index, type: integer, source: computed, default: 0, description: "Priority index; tier bonus applied after raw base is computed" }
      - { name: review_status, type: enum, source: system, description: "SCHEDULED → IN_PROGRESS → COMPLETED, or SCHEDULED → OVERDUE → ESCALATED → IN_PROGRESS" }

  - name: RatingActionEvent
    parent: null
    common_fields: false
    fields:
      - { name: surveillance_review_id, type: string, source: input, description: "FK -> SurveillanceReview.id; the review that raised the event" }
      - { name: rating_decision_id, type: string, source: input, description: "FK -> RatingDecision.id; the decision the action acts upon" }
      - { name: event_type, type: enum, source: input, description: "UPGRADE | DOWNGRADE | AFFIRM | WATCH_PLACEMENT | WITHDRAWAL" }
      - { name: target_grade, type: enum, source: input, description: "Grade the action moves the entity to; required for UPGRADE/DOWNGRADE, ignored otherwise" }
      - { name: effective_at, type: datetime, source: input, description: "Instant the action takes effect; may be in the future of the logical clock" }
      - { name: event_status, type: enum, source: system, description: "PENDING → APPLIED; PENDING → REVERTED" }
      - { name: applied_at, type: datetime, source: system, description: "Server-stamped instant the action was applied; null while PENDING" }

  - name: AppearanceReconciliation
    parent: null
    common_fields: true
    fields:
      - { name: analyst_id, type: string, source: input, description: "FK -> Analyst.id; the analyst whose past appearance is being reconciled" }
      - { name: rating_decision_id, type: string, source: input, description: "FK -> RatingDecision.id; the decision the analyst appeared on" }
      - { name: stated_role, type: enum, source: input, description: "LEAD_ANALYST | SUPPORT_ANALYST | COMMITTEE_VOTER — role the analyst actually held on the decision" }
      - { name: evidence_reference, type: string, source: input, description: "Dossier reference for the appearance evidence; >= 10 characters" }
      - { name: confirmed_at, type: datetime, source: system, description: "Server-stamped instant a breach was confirmed; null while PENDING" }
      - { name: reconciliation_status, type: enum, source: system, description: "PENDING → BREACH_CONFIRMED | CLEARED; BREACH_CONFIRMED → APPEAL_PENDING; APPEAL_PENDING → CLEARED | BREACH_CONFIRMED" }

  - name: ReviewSlot
    parent: null
    common_fields: true
    fields:
      - { name: analyst_id, type: string, source: input, description: "FK -> Analyst.id; the analyst whose calendar this slot books" }
      - { name: surveillance_review_id, type: string, source: input, description: "FK -> SurveillanceReview.id; the review occupying the slot" }
      - { name: slot_start, type: datetime, source: input, description: "Inclusive start of the booked calendar interval" }
      - { name: slot_end, type: datetime, source: input, description: "Inclusive end of the booked calendar interval (CLOSED [start, end])" }
      - { name: pre_buffer_minutes, type: integer, source: computed, default: 30, description: "Fixed preparation buffer required before any booking" }
      - { name: post_buffer_minutes, type: integer, source: computed, default: 30, description: "Fixed wrap-up buffer required after any booking" }
      - { name: status, type: enum, source: system, description: "BOOKED → CANCELLED | UNFILLED" }

  - name: Methodology
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Methodology display name" }
      - { name: version_code, type: string, source: input, description: "Version label, e.g. 2026.1" }
      - { name: methodology_code, type: string, source: input, description: "Globally unique methodology code, e.g. CF-SENIOR-2026.1" }
      - { name: sector, type: enum, source: input, description: "CORPORATE_FINANCE | FINANCIAL_INSTITUTIONS | SOVEREIGN | STRUCTURED_FINANCE | PROJECT_FINANCE" }
      - { name: is_public, type: boolean, source: computed, default: false, description: "True only after POST /methodologies/{id}/publish-disclosure; unsolicited ratings require a public methodology" }
      - { name: effective_from, type: datetime, source: system, description: "Server-stamped publication instant" }
      - { name: effective_to, type: datetime, source: system, description: "Instant this version was superseded; null while current" }
      - { name: status, type: enum, source: system, description: "DRAFT → PUBLISHED → SUPERSEDED" }

  - name: AnalystCompensation
    parent: null
    common_fields: true
    fields:
      - { name: analyst_id, type: string, source: input, description: "FK -> Analyst.id; the compensated analyst" }
      - { name: base_salary_cents, type: integer, source: input, description: "Fixed base compensation in cents for the period" }
      - { name: compensation_separation_pct, type: number, source: computed, default: 1.0, description: "Fraction of total compensation that is fee-independent; always 1.0 because fee_generation_bonus_cents is 0" }
      - { name: fee_generation_bonus_cents, type: integer, source: computed, default: 0, description: "Always 0 — analytical compensation must never vary with engagement fee revenue" }
      - { name: rating_accuracy_score, type: number, source: input, description: "Accuracy score in [0, 100] used for the accuracy-only bonus" }
      - { name: accuracy_bonus_cents, type: integer, source: computed, default: 0, description: "Bonus derived ONLY from rating_accuracy_score" }
      - { name: comp_period, type: string, source: input, description: "Period label, e.g. 2026-H1" }
      - { name: total_compensation_cents, type: integer, source: computed, description: "Conserved quantity: base_salary_cents + accuracy_bonus_cents + fee_generation_bonus_cents" }
      - { name: status, type: enum, source: system, description: "DRAFT → APPROVED → PAID" }

  - name: LookBackReview
    parent: null
    common_fields: true
    fields:
      - { name: analyst_id, type: string, source: input, description: "FK -> Analyst.id; the departed analyst under review" }
      - { name: departed_to_entity_id, type: string, source: input, description: "FK -> RatedEntity.id; the rated issuer the analyst joined" }
      - { name: departure_date, type: datetime, source: input, description: "Analyst's last day of service" }
      - { name: lookback_period_months, type: integer, source: input, description: "Months before departure scanned for the analyst's published decisions" }
      - { name: affected_decisions_count, type: integer, source: computed, default: 0, description: "Published decisions the departed analyst led or supported inside the look-back window" }
      - { name: review_status, type: enum, source: system, description: "INITIATED → IN_PROGRESS → CLOSED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: EngagementLetter
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: SIGNED
        trigger: "POST /engagement-letters/{id}/submit"
        actor: EngagementManager
        preconditions:
          - "fee_amount_cents >= 0 (ERR_FEE_AMOUNT_NEGATIVE)"
          - "signed_at is strictly after the logical clock default instant (ERR_ENGAGEMENT_ALREADY_TERMINAL)"
        side_effects: ["cooling_off_end_at = signed_at + 90 days"]
      - from: SIGNED
        to: ACTIVE
        trigger: "POST /engagement-letters/{id}/activate"
        actor: EngagementManager
        preconditions:
          - "cooling off has elapsed: cooling_off_end_at <= now (ERR_COOLING_OFF_ACTIVE)"
          - "letter is in SIGNED (ERR_ENGAGEMENT_NOT_SIGNED)"
        side_effects: ["status ACTIVE unlocks RatingRequest intake under this engagement"]
      - from: SIGNED
        to: DRAFT
        trigger: "POST /engagement-letters/{id}/revert-to-draft"
        actor: EngagementManager
        preconditions:
          - "no RatingRequest exists under this engagement_letter_id (ERR_ENGAGEMENT_ALREADY_TERMINAL)"
        side_effects:
          - "cooling_off_end_at reset to null"
          - "reverses the cooling-off clock advance record for this letter"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /engagement-letters/{id}/terminate"
        actor: EngagementManager
        preconditions:
          - "letter is in ACTIVE (ERR_ENGAGEMENT_NOT_ACTIVE)"
        side_effects:
          - "fee_reversed_cents = fee_credited_cents"
          - "every RatingRequest under this engagement with request_status NOT IN {PUBLISHED} moves to WITHDRAWN"
          - "every AnalyticalTeamAssignment whose request was just withdrawn moves PROPOSED|SCREENED|CONFIRMED → REVOKED"
          - "each revoked assignment's analysts lose that window's lead credit (consecutive_lead_months recomputed)"
          - "every RatingCommittee with committee_status IN {CONVENED, IN_SESSION} for a withdrawn request moves to DISSOLVED"
          - "each dissolved committee's RatingDecision in DRAFT moves to WITHDRAWN"
          - "every SurveillanceReview under a withdrawn published-free entity is left untouched, but newly created reviews for the entity are blocked by surveillance_posture"
        note: "Depth-4 transitive cascade: EngagementLetter → RatingRequest → AnalyticalTeamAssignment → Analyst, with a parallel RatingCommittee → RatingDecision branch."

  - entity: RatingRequest
    initial_state: SUBMITTED
    terminal_states: [PUBLISHED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: SCREENING
        trigger: "POST /rating-requests/{id}/open-screening"
        actor: ComplianceOfficer
        preconditions:
          - "parent EngagementLetter.status == ACTIVE (ERR_ENGAGEMENT_NOT_ACTIVE)"
          - "RatedEntity.methodology_id resolves to a Methodology with status PUBLISHED (ERR_METHODOLOGY_NOT_PUBLISHED)"
        side_effects: ["allocated_fee_cents computed and fee_credited_cents on the engagement increased"]
      - from: SCREENING
        to: SUBMITTED
        trigger: "POST /rating-requests/{id}/return-to-submitted"
        actor: ComplianceOfficer
        preconditions:
          - "request is in SCREENING (ERR_REQUEST_NOT_SCREENING)"
        side_effects: ["reverses allocated_fee_cents into fee_reversed_cents on the engagement"]
        note: "Cyclic reset: a screening can be sent back for re-intake without abandoning the request."
      - from: SCREENING
        to: TEAM_CONFIRMED
        trigger: "POST /rating-requests/{id}/confirm-team"
        actor: ComplianceOfficer
        preconditions:
          - "a AnalyticalTeamAssignment for this request has status CONFIRMED (ERR_TEAM_NOT_CONFIRMED)"
          - "that assignment's conflict_status == CLEAR (ERR_CONFLICT_NOT_CLEARED)"
        side_effects: ["request advances only after the team-level conflict screen cleared"]
        note: "Analytical fork: this joins with the compliance fork (POST /rating-requests/{id}/return-to-submitted sends the request back to SUBMITTED/SCREENING). The request must sit at exactly SCREENING with a CONFIRMED, CLEAR team before the committee can decide."
      - from: TEAM_CONFIRMED
        to: COMMITTEE_DECIDED
        trigger: "POST /rating-committees/{id}/decide"
        actor: CommitteeChair
        preconditions:
          - "committee_status IN {CONVENED, IN_SESSION} (ERR_COMMITTEE_NOT_IN_SESSION)"
          - "quorum_met == true (ERR_COMMITTEE_QUORUM_NOT_MET)"
          - "no CommitteeVote with vote_value ABSTAIN on this committee (ERR_COMMITTEE_ABSTENTION_NOT_PERMITTED)"
          - "request is in TEAM_CONFIRMED — the analytical branch has already joined (ERR_REQUEST_NOT_TEAM_CONFIRMED)"
        side_effects:
          - "RatingDecision created in DRAFT with dissent_count and dissent_score computed"
          - "committee_status → DECIDED"
          - "request_status → COMMITTEE_DECIDED"
        note: "Fork-join: the request must have cleared BOTH the compliance branch (screening) AND the analytical branch (team) before the committee decision joins. Deciding while the team is still PROPOSED|SCREENED leaves the request in SCREENING and the committee without a decidable request."
      - from: COMMITTEE_DECIDED
        to: APPEALED
        trigger: "POST /rating-decisions/{id}/appeals"
        actor: Anonymous
        preconditions:
          - "decision_status == APPEAL_WINDOW (ERR_APPEAL_WINDOW_CLOSED)"
          - "appeal body contains new information (ERR_APPEAL_NOT_NEW_INFORMATION)"
        side_effects:
          - "decision_status → DRAFT"
          - "request_status → APPEALED"
          - "the approved decision's version is pinned; reopening bumps RatingRequest.version"
      - from: APPEALED
        to: COMMITTEE_DECIDED
        trigger: "POST /rating-committees/{id}/redecide"
        actor: CommitteeChair
        preconditions:
          - "committee_status IN {DECIDED, IN_SESSION} (ERR_COMMITTEE_NOT_IN_SESSION)"
          - "quorum_met == true (ERR_COMMITTEE_QUORUM_NOT_MET)"
        side_effects:
          - "a new RatingDecision is created in DRAFT; the superseded decision moves to WITHDRAWN"
          - "request_status → COMMITTEE_DECIDED"
        note: "Cyclic re-decision round: appeal → committee → decision can repeat while new information keeps arriving."
      - from: COMMITTEE_DECIDED
        to: PUBLISHED
        trigger: "POST /rating-decisions/{id}/publish"
        actor: CommitteeChair
        preconditions:
          - "the request's current RatingDecision has decision_status == APPEAL_WINDOW (ERR_DECISION_NOT_IN_APPEAL_WINDOW)"
          - "cooling_off_end_at <= now on the parent engagement letter (ERR_COOLING_OFF_ACTIVE)"
          - "RatedEntity.solicitation_status == SOLICITED OR the pinned Methodology.is_public == true (ERR_UNSOLICITED_DISCLOSURE_MISSING)"
          - "rationale length >= 200 characters (ERR_RATIONALE_TOO_SHORT)"
        side_effects:
          - "decision_status → PUBLISHED, published_at stamped"
          - "RatedEntity.current_grade = assigned_grade; first_rated_at set on first publication"
          - "a SurveillanceReview is auto-created with review_due_at = published_at + review_cycle_months"
          - "RatedEntity.surveillance_posture recomputed from the published watch_status"
      - from: TEAM_CONFIRMED
        to: WITHDRAWN
        trigger: "POST /rating-requests/{id}/withdraw"
        actor: EngagementManager
        preconditions:
          - "request_status IN {SUBMITTED, SCREENING, TEAM_CONFIRMED} (ERR_REQUEST_NOT_WITHDRAWABLE)"
        side_effects:
          - "each AnalyticalTeamAssignment on this request moves to REVOKED (hop 1)"
          - "because hop 1 revoked the assignment, each affected analyst's consecutive_lead_months recomputes over its remaining SCREENED|CONFIRMED rows (hop 2)"
          - "because hop 2 shrank the lead's streak below 60, that analyst's rotation_eligible returns to true (hop 3)"
          - "each CONVENED|IN_SESSION RatingCommittee for the request moves to DISSOLVED and any DRAFT RatingDecision for it moves to WITHDRAWN (parallel branch)"
          - "allocated_fee_cents moved to fee_reversed_cents on the engagement"

  - entity: AnalyticalTeamAssignment
    initial_state: PROPOSED
    terminal_states: [REVOKED]
    transitions:
      - from: PROPOSED
        to: SCREENED
        trigger: "POST /team-assignments/{id}/screen"
        actor: ComplianceOfficer
        preconditions:
          - "the target request's RatedEntity.methodology_id resolves to a PUBLISHED Methodology (ERR_METHODOLOGY_NOT_PUBLISHED — checked before analyst conflict checks)"
          - "for each of lead_analyst_id and support_analyst_id: a ConflictScreening row with screening_result != DISQUALIFYING exists (ERR_CONFLICT_SCREENING_DISQUALIFYING)"
          - "the lead analyst is not the support analyst (ERR_DUAL_ROLE_ASSIGNMENT)"
          - "no analyst has left for a rated issuer in the last 24 months (ERR_LOOKBACK_WINDOW_BLOCKING)"
          - "the lead analyst belongs to the request's entity sector or holds a sector waiver (ERR_SECTOR_MISMATCH)"
        side_effects:
          - "conflict_status recomputed as DISQUALIFYING > POTENTIAL > CLEAR over the assignment's screening rows"
          - "Analyst.first_assignment_at set on the lead if previously null"
      - from: SCREENED
        to: PROPOSED
        trigger: "POST /team-assignments/{id}/return-to-proposed"
        actor: ComplianceOfficer
        preconditions:
          - "status == SCREENED (ERR_TEAM_ASSIGNMENT_NOT_SCREENED)"
        side_effects: ["clears the screening rows' effect on conflict_status back to PENDING_SCREEN"]
        note: "Cyclic revert: an assignment can be bounced back for re-screening with a different analyst pair."
      - from: SCREENED
        to: CONFIRMED
        trigger: "POST /team-assignments/{id}/confirm"
        actor: CommitteeChair
        preconditions:
          - "rotation rule passes: lead_analyst.consecutive_lead_months < 60 OR rotation_exemption_granted == true (ERR_ANALYST_ROTATION_REQUIRED)"
          - "conflict_status == CLEAR (ERR_CONFLICT_NOT_CLEARED)"
          - "the assignment occupancy window does not overlap another non-REVOKED assignment of the same lead analyst (ERR_ANALYST_ASSIGNMENT_OVERLAP)"
          - "status == SCREENED (ERR_TEAM_ASSIGNMENT_NOT_SCREENED)"
        side_effects:
          - "Analyst.last_lead_assignment_at and consecutive_lead_months updated for the lead"
          - "if consecutive_lead_months reaches 60, lead.rotation_eligible = false"
      - from: PROPOSED
        to: REVOKED
        trigger: "POST /team-assignments/{id}/revoke"
        actor: ComplianceOfficer
        preconditions:
          - "status IN {PROPOSED, SCREENED, CONFIRMED} (ERR_TEAM_ASSIGNMENT_ALREADY_REVOKED)"
        side_effects: ["if the assignment was CONFIRMED, the parent request returns to SCREENING and its committee is dissolved"]
      - from: SCREENED
        to: REVOKED
        trigger: "POST /team-assignments/{id}/revoke"
        actor: ComplianceOfficer
        preconditions:
          - "status IN {PROPOSED, SCREENED, CONFIRMED} (ERR_TEAM_ASSIGNMENT_ALREADY_REVOKED)"
        side_effects: ["the revocation recomputes the lead's consecutive_lead_months over its surviving rows"]
      - from: CONFIRMED
        to: REVOKED
        trigger: "POST /team-assignments/{id}/revoke or system (parent request withdrawn or its engagement terminated)"
        actor: ComplianceOfficer | system
        preconditions:
          - "status IN {PROPOSED, SCREENED, CONFIRMED} (ERR_TEAM_ASSIGNMENT_ALREADY_REVOKED)"
        side_effects:
          - "the revocation recomputes the lead's consecutive_lead_months over its surviving SCREENED|CONFIRMED rows (hop)"
          - "because the streak shortened, the lead's rotation_eligible returns to true when the recomputed value drops below 60 (hop)"
          - "the parent request returns to SCREENING if it was still TEAM_CONFIRMED, and its committee is dissolved (parallel branch)"
        note: "CONFIRMED is not terminal precisely because a termination or withdrawal can revoke it."

  - entity: RatingCommittee
    initial_state: CONVENED
    terminal_states: [DECIDED, DISSOLVED, QUORUM_FAILED]
    transitions:
      - from: CONVENED
        to: IN_SESSION
        trigger: "POST /rating-committees/{id}/open-session"
        actor: CommitteeChair
        preconditions:
          - "committee_date <= now (ERR_COMMITTEE_NOT_DUE)"
          - "the sitting datetime does not overlap another CONVENED|IN_SESSION committee's session interval (ERR_COMMITTEE_SCHEDULE_OVERLAP)"
        side_effects: ["session interval opened at committee_date"]
      - from: IN_SESSION
        to: DECIDED
        trigger: "POST /rating-committees/{id}/decide"
        actor: CommitteeChair
        preconditions:
          - "quorum_met == true (ERR_COMMITTEE_QUORUM_NOT_MET)"
          - "no ABSTAIN vote (ERR_COMMITTEE_ABSTENTION_NOT_PERMITTED)"
          - "all appearing voters hold a current independence declaration within 180 days (ERR_INDEPENDENCE_DECLARATION_STALE)"
        side_effects: ["committee_status → DECIDED; parent request → COMMITTEE_DECIDED"]
      - from: CONVENED
        to: QUORUM_FAILED
        trigger: "system (automatic when votes_cast < required_voting_members at committee_date)"
        actor: system
        preconditions: ["votes_cast < required_voting_members (ERR_COMMITTEE_QUORUM_NOT_MET)"]
        side_effects: ["parent request returns to SCREENING; a replacement committee may be convened"]
      - from: DECIDED
        to: IN_SESSION
        trigger: "POST /rating-committees/{id}/reopen"
        actor: CommitteeChair
        preconditions:
          - "parent request request_status == APPEALED (ERR_COMMITTEE_NOT_REOPENABLE)"
        side_effects: ["committee_status → IN_SESSION; a fresh decision round begins"]
        note: "Cyclic reopen on accepted appeal."
      - from: CONVENED
        to: DISSOLVED
        trigger: "system (automatic when the parent request is withdrawn)"
        actor: system
        preconditions: ["parent request request_status == WITHDRAWN"]
        side_effects: ["any DRAFT RatingDecision for the request moves to WITHDRAWN"]

  - entity: RatingDecision
    initial_state: DRAFT
    terminal_states: [PUBLISHED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: APPEAL_WINDOW
        trigger: "POST /rating-decisions/{id}/open-appeal-window"
        actor: CommitteeChair
        preconditions:
          - "decision_status == DRAFT (ERR_DECISION_NOT_DRAFT)"
          - "the parent request request_status == COMMITTEE_DECIDED (ERR_REQUEST_NOT_COMMITTEE_DECIDED)"
        side_effects: ["appeal_window_end_at = now + 5 days"]
      - from: APPEAL_WINDOW
        to: PUBLISHED
        trigger: "POST /rating-decisions/{id}/publish"
        actor: CommitteeChair
        preconditions:
          - "the parent engagement's cooling_off_end_at <= now (ERR_COOLING_OFF_ACTIVE)"
          - "RatedEntity.solicitation_status == SOLICITED OR pinned Methodology.is_public == true (ERR_UNSOLICITED_DISCLOSURE_MISSING)"
        side_effects:
          - "published_at stamped; RatingEntity.current_grade = assigned_grade; first_rated_at set on first publication (hop 1)"
          - "because hop 1 recorded a new grade, RatedEntity.surveillance_posture recomputes and → ACTIVE_WATCH when watch_status is WATCH_UPGRADE or WATCH_DOWNGRADE (hop 2)"
          - "a successor SurveillanceReview is auto-created for the entity with review_due_at = published_at + review_cycle_months (fan-out, created before hop 3)"
          - "because hop 2 flipped the posture, every OPEN SurveillanceReview of the entity (including the one just created) is floored at escalation_index 25 (hop 3)"
      - from: APPEAL_WINDOW
        to: DRAFT
        trigger: "POST /rating-decisions/{id}/appeals"
        actor: Anonymous
        preconditions:
          - "the appeal carries new information (ERR_APPEAL_NOT_NEW_INFORMATION)"
        side_effects: ["decision reopens; the pinned methodology version stays pinned to the issuer"]
        note: "Cyclic: publish-intent window ↔ draft while new information keeps arriving."
      - from: DRAFT
        to: WITHDRAWN
        trigger: "system (automatic when the parent request is withdrawn or its committee dissolved)"
        actor: system
        preconditions: ["parent request request_status == WITHDRAWN OR parent committee committee_status == DISSOLVED"]
        side_effects: ["no rating published; the pinned methodology is released"]

  - entity: IssuerAppeal
    initial_state: PENDING
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /issuer-appeals/{id}/resolve"
        actor: CommitteeChair
        preconditions:
          - "contains_new_information == true (ERR_APPEAL_NOT_NEW_INFORMATION)"
          - "resolution_notes length >= 30 characters (ERR_APPEAL_RESOLUTION_NOTES_REQUIRED)"
          - "the linked decision is in APPEAL_WINDOW or DRAFT (ERR_APPEAL_WINDOW_CLOSED)"
        side_effects:
          - "decision_status → DRAFT"
          - "the RatingCommittee for the request reopens to IN_SESSION"
          - "parent RatingRequest → APPEALED"
      - from: PENDING
        to: REJECTED
        trigger: "POST /issuer-appeals/{id}/resolve"
        actor: CommitteeChair
        preconditions:
          - "resolution_notes length >= 30 characters (ERR_APPEAL_RESOLUTION_NOTES_REQUIRED)"
        side_effects: ["the decision's appeal window continues to run to its normal close"]

  - entity: SurveillanceReview
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: OVERDUE
        trigger: "system (automatic when now > review_due_at and review_status == SCHEDULED)"
        actor: system
        preconditions: ["now > review_due_at"]
        side_effects: ["overdue_days recomputed on read"]
      - from: OVERDUE
        to: ESCALATED
        trigger: "system (automatic when overdue_days >= 30)"
        actor: system
        preconditions: ["overdue_days >= 30"]
        side_effects:
          - "RatedEntity.surveillance_posture → ACTIVE_WATCH"
          - "escalation_index += 25"
      - from: ESCALATED
        to: IN_PROGRESS
        trigger: "POST /surveillance-reviews/{id}/start"
        actor: RatingAnalyst
        preconditions:
          - "RatedEntity.surveillance_posture != RESTRICTED (ERR_POSTURE_RESTRICTED)"
          - "review_status IN {SCHEDULED, OVERDUE, ESCALATED} (ERR_SURVEILLANCE_NOT_STARTABLE)"
        side_effects: ["review_status → IN_PROGRESS"]
      - from: SCHEDULED
        to: OVERDUE
        trigger: "POST /_clock/set_current_utc (clock advance past review_due_at)"
        actor: system
        preconditions: []
        side_effects: ["no side effect beyond recomputed overdue_days"]
        note: "Same target as the automatic transition; the clock endpoint is the deterministic trigger."
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /surveillance-reviews/{id}/complete"
        actor: RatingAnalyst
        preconditions:
          - "review_status == IN_PROGRESS (ERR_SURVEILLANCE_NOT_IN_PROGRESS)"
        side_effects: ["a successor SurveillanceReview is auto-created with review_due_at = published_at + cycle"]
      - from: COMPLETED
        to: IN_PROGRESS
        trigger: "POST /surveillance-reviews/{id}/reopen"
        actor: RatingAnalyst
        preconditions:
          - "a RatingActionEvent with event_type == WITHDRAWAL exists for the linked decision (ERR_SURVEILLANCE_REOPEN_NOT_GROUNDED)"
        side_effects: ["review_status → IN_PROGRESS"]
        note: "Cyclic reopen grounded in an event-driven withdrawal."

  - entity: RatingActionEvent
    initial_state: PENDING
    terminal_states: [APPLIED, REVERTED]
    transitions:
      - from: PENDING
        to: APPLIED
        trigger: "POST /rating-action-events/{id}/apply"
        actor: RatingAnalyst
        preconditions:
          - "effective_at <= now (ERR_ACTION_EFFECTIVE_IN_FUTURE)"
          - "RatedEntity.surveillance_posture != RESTRICTED (ERR_POSTURE_RESTRICTED)"
          - "event_status == PENDING (ERR_ACTION_NOT_PENDING)"
        side_effects:
          - "RatingDecision.outlook and watch_status updated per event_type"
          - "RatedEntity.current_grade updated for UPGRADE/DOWNGRADE"
          - "RatedEntity.surveillance_posture recomputed (WATCH_* → ACTIVE_WATCH)"
      - from: PENDING
        to: REVERTED
        trigger: "POST /rating-action-events/{id}/cancel"
        actor: RatingAnalyst
        preconditions:
          - "event_status == PENDING (ERR_ACTION_NOT_PENDING)"
          - "effective_at > now (ERR_ACTION_ALREADY_EFFECTIVE)"
        side_effects: ["escalation_index += 25 on the linked SurveillanceReview"]

  - entity: ReviewSlot
    initial_state: BOOKED
    terminal_states: [CANCELLED, UNFILLED]
    transitions:
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /review-slots/{id}/cancel"
        actor: RatingAnalyst
        preconditions: ["status == BOOKED (ERR_SLOT_NOT_BOOKED)"]
        side_effects: ["the slot is released; its buffered interval no longer blocks new bookings"]
      - from: BOOKED
        to: UNFILLED
        trigger: "system (automatic when the slot's review is withdrawn)"
        actor: system
        preconditions: ["the linked SurveillanceReview is reopened or its action event is cancelled"]
        side_effects: ["slot time is freed for rebooking"]

  - entity: Methodology
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /methodologies/{id}/publish"
        actor: ComplianceOfficer
        preconditions:
          - "no other PUBLISHED Methodology shares this (methodology_code) in the same sector (ERR_METHODOLOGY_CODE_CONFLICT)"
        side_effects: ["is_public = true; effective_from stamped"]
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "POST /methodologies/{id}/supersede"
        actor: ComplianceOfficer
        preconditions:
          - "a replacement Methodology for the same sector is PUBLISHED (ERR_NO_REPLACEMENT_METHODOLOGY)"
        side_effects:
          - "effective_to stamped"
          - "every RatedEntity pinned to this methodology_id stays pinned to this version (ERR_METHODOLOGY_NOT_PUBLISHED blocks only future pins)"
        note: "Status PUBLISHED covers both disclosed and undisclosed versions; public disclosure is the separate is_public flag flipped by POST /methodologies/{id}/publish-disclosure."

  - entity: AnalystCompensation
    initial_state: DRAFT
    terminal_states: [PAID]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /compensation-records/{id}/approve"
        actor: CompensationCommittee
        preconditions:
          - "the linked analyst has no AnalyticalTeamAssignment with status CONFIRMED in the current comp period (ERR_COMPENSATION_CONFLICT)"
          - "Analyst.is_departed == false (ERR_COMPENSATION_ANALYST_DEPARTED)"
        side_effects:
          - "accuracy_bonus_cents computed from rating_accuracy_score"
          - "fee_generation_bonus_cents held at 0"
          - "total_compensation_cents = base + accuracy bonus + 0"
      - from: APPROVED
        to: PAID
        trigger: "POST /compensation-records/{id}/pay"
        actor: CompensationCommittee
        preconditions: ["status == APPROVED (ERR_COMPENSATION_NOT_APPROVED)"]
        side_effects: ["total_compensation_cents is conserved across APPROVED → PAID"]
      - from: APPROVED
        to: DRAFT
        trigger: "POST /compensation-records/{id}/revise"
        actor: CompensationCommittee
        preconditions: ["status == APPROVED (ERR_COMPENSATION_NOT_APPROVED)"]
        side_effects: ["total_compensation_cents recomputed with the conserved formula"]

  - entity: LookBackReview
    initial_state: INITIATED
    terminal_states: [CLOSED]
    transitions:
      - from: INITIATED
        to: IN_PROGRESS
        trigger: "POST /look-back-reviews/{id}/start"
        actor: ComplianceOfficer
        preconditions:
          - "the departed analyst's departure_date is set (ERR_LOOKBACK_NOT_GROUNDED)"
        side_effects: ["affected_decisions_count computed over the look-back window"]
      - from: IN_PROGRESS
        to: CLOSED
        trigger: "POST /look-back-reviews/{id}/close"
        actor: ComplianceOfficer
        preconditions:
          - "review_status == IN_PROGRESS (ERR_LOOKBACK_NOT_IN_PROGRESS)"
          - "affected_decisions_count has been computed (>= 0)"
        side_effects:
          - "the departed analyst's existing AnalyticalTeamAssignment rows on the affected decisions are flagged for re-screening"
          - "RatedEntity.surveillance_posture of the joined issuer → ACTIVE_WATCH"

  - entity: AppearanceReconciliation
    initial_state: PENDING
    terminal_states: [CLEARED]
    transitions:
      - from: PENDING
        to: CLEARED
        trigger: "POST /appearance-reconciliations/{id}/clear"
        actor: CommitteeChair
        preconditions: ["status IN {PENDING, APPEAL_PENDING} (ERR_RECONCILIATION_ALREADY_CLEARED)"]
        side_effects: ["the linked decision's appeal admissibility gate reopens"]
      - from: PENDING
        to: BREACH_CONFIRMED
        trigger: "POST /appearance-reconciliations/{id}/confirm-breach"
        actor: CommitteeChair
        preconditions: ["status IN {PENDING, APPEAL_PENDING} (ERR_RECONCILIATION_ALREADY_CLEARED)"]
        side_effects: ["confirmed_at stamped; the linked decision's appeals are blocked until this row clears"]
      - from: BREACH_CONFIRMED
        to: APPEAL_PENDING
        trigger: "POST /appearance-reconciliations/{id}/appeal"
        actor: RatingAnalyst
        preconditions: ["status == BREACH_CONFIRMED (ERR_RECONCILIATION_NOT_BREACHED)"]
        side_effects: ["the row stays blocking while the analyst's own appeal is pending"]
        note: "Cyclic: BREACH_CONFIRMED ↔ APPEAL_PENDING can repeat as evidence is re-examined."
      - from: APPEAL_PENDING
        to: CLEARED
        trigger: "POST /appearance-reconciliations/{id}/clear"
        actor: CommitteeChair
        preconditions: ["status IN {PENDING, APPEAL_PENDING} (ERR_RECONCILIATION_ALREADY_CLEARED)"]
        side_effects: ["the blocking state ends; the linked decision's appeal admissibility gate reopens"]
      - from: APPEAL_PENDING
        to: BREACH_CONFIRMED
        trigger: "POST /appearance-reconciliations/{id}/confirm-breach"
        actor: CommitteeChair
        preconditions: ["status IN {PENDING, APPEAL_PENDING} (ERR_RECONCILIATION_ALREADY_CLEARED)"]
        side_effects: ["the breach stands; the linked decision's appeals remain blocked"]
        note: "Cyclic re-confirmation: APPEAL_PENDING returns to BREACH_CONFIRMED."

  # =============================================================================
  # Concurrency Rules (true races only — OCC on the parent's version)
# =============================================================================
concurrency_rules:
  - rule_id: request-publish-stale-decision
    parent_entity: RatingRequest
    write_endpoint: "POST /rating-decisions/{id}/publish"
    occ_field: "expected_rating_request_version"
    description: |
      Publishing a RatingDecision against a RatingRequest whose version has
      advanced since the client last observed it is rejected. The request's
      version moves whenever an accepted appeal reopens the decision, so a
      publish call built on the pre-appeal view of the request is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: team-confirm-stale-request
    parent_entity: RatingRequest
    write_endpoint: "POST /team-assignments/{id}/confirm"
    occ_field: "expected_rating_request_version"
    description: |
      Confirming an AnalyticalTeamAssignment whose parent RatingRequest has
      advanced in version since the client last read it is rejected, because
      another writer has already moved the request between screening and team
      confirmation in the meantime.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: allocated_fee_cents
    trigger: "POST /rating-requests/{id}/open-screening"
    algorithm: waterfall_allocation
    formula: |
      denominator = sum(instrument_notional_cents) over ALL RatingRequest rows
                    sharing this engagement_letter_id, of every request_status
                    (SUBMITTED, SCREENING, ..., WITHDRAWN all included)
      base_share      = fee_amount_cents * instrument_notional_cents / denominator
      tier_multiplier = 1.00 when base_share < 2_500_000
                        0.95 when 2_500_000 <= base_share < 10_000_000
                        0.90 when base_share >= 10_000_000
      raw             = base_share * tier_multiplier
      allocated_fee_cents = round_half_up(raw)                # round PER REQUEST first
      fee_credited_cents  = sum(allocated_fee_cents) over the letter's requests
      Pinned order: round per request, then sum — never sum the raw shares then round once.
    input_set: "All RatingRequest rows sharing the same engagement_letter_id, any status, including rows in WITHDRAWN; the row being opened is included in its own denominator."
    constants:
      TIER_1_CEILING_CENTS: 2500000
      TIER_2_CEILING_CENTS: 10000000
      TIER_1_MULT: 1.00
      TIER_2_MULT: 0.95
      TIER_3_MULT: 0.90
    precision: "round_half_up to whole cents"
    variants:
      - name: per_request_then_sum
        when: "the engagement has two or more open requests"
        difference: "rounding each share before summing can differ from the sum-then-round value; three equal thirds of 100,000 give 33,333 each (99,999 total) against a single rounding of 100,000, a 1-cent divergence"
      - name: sum_then_round
        when: "a single request only"
        difference: "with one request the two orders coincide"

  - name: dissent_score
    trigger: "POST /rating-committees/{id}/decide"
    algorithm: weighted_scoring
    formula: |
      For every CommitteeVote on the committee with is_dissent == true:
        weight = 3 when vote_value == DOWNGRADE
                 2 when vote_value == UPGRADE or vote_value == AFFIRM
        contribution = weight * grade_step_distance(vote.assigned_grade, decided.assigned_grade)
                       where grade_step_distance counts the number of steps on the
                       ordered scale [AAA, AA, A, BAA, BA, B, CAA, CA, C] between
                       the two grades (0 when they are equal).
      dissent_score = round(sum(contribution), 2)
      dissent_count = count(is_dissent == true)
    input_set: "CommitteeVote rows on the deciding committee only; ABSTAIN rows never count as dissent and are already rejected by the committee's decide precondition."
    constants:
      DOWNGRADE_WEIGHT: 3
      DEFAULT_WEIGHT: 2
    precision: "2 decimal places, round_half_up"
    variants:
      - name: publication_weighted
        when: "the decision is being prepared for publication (APPEAL_WINDOW or later)"
        difference: "uses DOWNGRADE_WEIGHT 3 on every DOWNGRADE dissent, so publication_weighted - internal_weighted == grade_step_distance summed over the DOWNGRADE dissents"
      - name: internal_weighted
        when: "the decision is still internal (DRAFT)"
        difference: "weights every dissent at 2 regardless of vote direction"

  - name: accuracy_only_compensation
    trigger: "POST /compensation-records/{id}/approve"
    algorithm: weighted_scoring
    formula: |
      accuracy_bonus_cents = round_half_up(base_salary_cents * max(0, rating_accuracy_score - 70) / 200)
      fee_generation_bonus_cents = 0                       # unconditional
      total_compensation_cents  = base_salary_cents + accuracy_bonus_cents + fee_generation_bonus_cents
      compensation_separation_pct = (base_salary_cents + accuracy_bonus_cents) / total_compensation_cents
      Pinned order: the accuracy bonus is rounded once, before the total is formed.
    input_set: "One AnalystCompensation row; base_salary_cents and rating_accuracy_score are the only inputs. EngagementLetter.fee_credited_cents and fee_reversed_cents are deliberately excluded."
    constants:
      ACCURACY_FLOOR: 70
      ACCURACY_SCALE: 200
    precision: "round_half_up to whole cents for the bonus; separation_pct to 4 dp"
    variants:
      - name: fee_blind
        when: "always — the only sanctioned variant"
        difference: "total is invariant under any change to the engagements the analyst touched; a fee-linked variant would move total_compensation_cents with fee_credited_cents"
      - name: fee_linked_counterexample
        when: "never — documented purely as the forbidden shape"
        difference: "adding a fee component would break the conservation invariant total == base + accuracy_bonus + 0"

  - name: escalation_index
    trigger: "SurveillanceReview reads and the OVERDUE → ESCALATED transition"
    algorithm: aggregation
    formula: |
      base = overdue_days
      tier_bonus = 25 when review_type == EVENT_DRIVEN
                   0  when review_type == PERIODIC
      escalation_index = base + tier_bonus
      Posture-driven floor: when an entity's surveillance_posture flips to
      ACTIVE_WATCH, every OPEN review of that entity (review_status IN
      {SCHEDULED, OVERDUE, ESCALATED, IN_PROGRESS}) has its escalation_index
      raised to max(escalation_index, 25). The floor is idempotent — applying
      it twice does not compound.
    input_set: "One SurveillanceReview; overdue_days floored at 0."
    constants:
      EVENT_DRIVEN_BONUS: 25
    precision: "integer"
    variants:
      - name: base_only
        when: "review_type == PERIODIC"
        difference: "the tier bonus is not added, so escalation_index equals overdue_days"

  - name: consecutive_lead_months
    trigger: "POST /team-assignments/{id}/confirm and POST /team-assignments/{id}/revoke"
    algorithm: chronological
    formula: |
      Walk the lead's AnalyticalTeamAssignment rows in assigned_at ASC. assigned_at
      has one-second resolution, so ties do not arise in practice; when two rows
      share an assigned_at value the tie is broken by created_at ASC (never by id).
      start = MIN(assigned_at of rows whose status != REVOKED)
      end   = MAX(window_start of CONFIRMED rows)  (or now when any CONFIRMED row is open-ended)
      months = floor((end - start) / 30 days)
      A REVOKED row does not extend `end`; it also does not reset `start`.
      consecutive_lead_months = months
    input_set: "AnalyticalTeamAssignment rows where lead_analyst_id == this analyst AND status IN {SCREENED, CONFIRMED} for the `end` bound; REVOKED rows are ignored for the bound but retained for the tie-break ordering."
    constants:
      MONTH_DAYS: 30
      ROTATION_LIMIT_MONTHS: 60
    precision: "integer months, floor"
    variants:
      - name: strict_sixty
        when: "rotation_eligible is recomputed"
        difference: "the boundary is >= 60 — a exactly-60.0-month streak is NOT eligible; a strict > 60 branch would wrongly let a 60.0-month streak pass"
      - name: exemption_applied
        when: "rotation_exemption_granted == true on the assignment being confirmed"
        difference: "the exemption suppresses the ERR_ANALYST_ROTATION_REQUIRED rejection but does not reset consecutive_lead_months, so the streak keeps accruing"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority, lowest number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role is present and names a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the acting role is permitted for the operation; entity_backed roles also require X-User-ID to equal the acting entity's id"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "path resources exist, validated left-to-right in path order"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: business_referential
    check: "referenced RatingRequest.engagement_letter_id resolves to an EngagementLetter that exists"
    error_id: ERR_ENGAGEMENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /rating-requests"
  - priority: 5
    category: business_referential
    check: "referenced RatedEntity.methodology_id resolves to a Methodology row"
    error_id: ERR_METHODOLOGY_NOT_FOUND
    http_status: 404
    applies_to: "POST /rated-entities, POST /rating-requests/{id}/open-screening"
  - priority: 6
    category: business_safety
    check: "the pinned Methodology.status == PUBLISHED before any analyst conflict checks run"
    error_id: ERR_METHODOLOGY_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /rating-requests/{id}/open-screening, POST /team-assignments/{id}/screen"
  - priority: 7
    category: business_constraint
    check: "no analyst on the team is flagged DISQUALIFYING by a ConflictScreening row"
    error_id: ERR_CONFLICT_SCREENING_DISQUALIFYING
    http_status: 409
    applies_to: "POST /team-assignments/{id}/screen"
  - priority: 8
    category: business_safety
    check: "the lead analyst and support analyst rows on one assignment name different analysts"
    error_id: ERR_DUAL_ROLE_ASSIGNMENT
    http_status: 400
    applies_to: "POST /team-assignments/{id}/screen"
  - priority: 9
    category: business_safety
    check: "no analyst on the team departed to a rated issuer within the last 24 months"
    error_id: ERR_LOOKBACK_WINDOW_BLOCKING
    http_status: 409
    applies_to: "POST /team-assignments/{id}/screen"
  - priority: 10
    category: business_safety
    check: "the lead analyst's consecutive_lead_months is below 60 or an exemption was granted"
    error_id: ERR_ANALYST_ROTATION_REQUIRED
    http_status: 409
    applies_to: "POST /team-assignments/{id}/confirm"
  - priority: 11
    category: business_constraint
    check: "the lead analyst's new window overlaps no non-REVOKED assignment of that analyst"
    error_id: ERR_ANALYST_ASSIGNMENT_OVERLAP
    http_status: 409
    applies_to: "POST /team-assignments/{id}/confirm"
  - priority: 12
    category: state
    check: "the target resource is in the state its transition requires"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 13
    category: business_temporal
    check: "the engagement's 90-day cooling-off period has elapsed before any publication"
    error_id: ERR_COOLING_OFF_ACTIVE
    http_status: 409
    applies_to: "POST /rating-decisions/{id}/publish"
  - priority: 14
    category: business_temporal
    check: "an unsolicited rating may not be published unless its pinned Methodology.is_public == true"
    error_id: ERR_UNSOLICITED_DISCLOSURE_MISSING
    http_status: 409
    applies_to: "POST /rating-decisions/{id}/publish"
  - priority: 15
    category: business_constraint
    check: "the committee sitting interval overlaps no other CONVENED|IN_SESSION committee"
    error_id: ERR_COMMITTEE_SCHEDULE_OVERLAP
    http_status: 409
    applies_to: "POST /rating-committees/{id}/open-session"
  - priority: 16
    category: business_temporal
    check: "an analyst's new review slot must not fall inside another BOOKED slot's pre/post-buffered interval on the same analyst"
    error_id: ERR_REVIEW_SLOT_OVERLAP
    http_status: 409
    applies_to: "POST /review-slots"
  - priority: 17
    category: business_fiscal
    check: "an analytical compensation record must not carry any fee-generation component"
    error_id: ERR_COMPENSATION_FEE_LINKAGE
    http_status: 402
    applies_to: "POST /compensation-records, POST /compensation-records/{id}/approve"
  - priority: 18
    category: business_fiscal
    check: "allocated_fee_cents never pushes the engagement's fee_credited_cents above fee_amount_cents"
    error_id: ERR_FEE_ALLOCATION_EXCEEDS_ENGAGEMENT
    http_status: 402
    applies_to: "POST /rating-requests/{id}/open-screening"
  - priority: 19
    category: business_constraint
    check: "a rotation exemption requires a reason of at least 20 characters"
    error_id: ERR_ROTATION_EXEMPTION_REASON_REQUIRED
    http_status: 400
    applies_to: "POST /team-assignments"
  - priority: 20
    category: state
    check: "the parent engagement letter must be ACTIVE before a request can enter screening"
    error_id: ERR_ENGAGEMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /rating-requests/{id}/open-screening"
  - priority: 21
    category: state
    check: "the engagement letter must be SIGNED before activation, and must not be TERMINATED"
    error_id: ERR_ENGAGEMENT_NOT_SIGNED
    http_status: 409
    applies_to: "POST /engagement-letters/{id}/activate"
  - priority: 22
    category: state
    check: "the engagement letter is not already TERMINATED when a draft-reverting action is attempted"
    error_id: ERR_ENGAGEMENT_ALREADY_TERMINAL
    http_status: 409
    applies_to: "POST /engagement-letters/{id}/submit, POST /engagement-letters/{id}/revert-to-draft"
  - priority: 23
    category: state
    check: "the request must be SCREENING before it can be returned to intake"
    error_id: ERR_REQUEST_NOT_SCREENING
    http_status: 409
    applies_to: "POST /rating-requests/{id}/return-to-submitted"
  - priority: 24
    category: state
    check: "the request must be TEAM_CONFIRMED before the committee can decide"
    error_id: ERR_REQUEST_NOT_TEAM_CONFIRMED
    http_status: 409
    applies_to: "POST /rating-committees/{id}/decide, POST /rating-committees/{id}/redecide"
  - priority: 25
    category: state
    check: "the request must be in SUBMITTED, SCREENING or TEAM_CONFIRMED to be withdrawn"
    error_id: ERR_REQUEST_NOT_WITHDRAWABLE
    http_status: 409
    applies_to: "POST /rating-requests/{id}/withdraw"
  - priority: 26
    category: state
    check: "the team assignment must be SCREENED before confirmation or return"
    error_id: ERR_TEAM_ASSIGNMENT_NOT_SCREENED
    http_status: 409
    applies_to: "POST /team-assignments/{id}/confirm, POST /team-assignments/{id}/return-to-proposed"
  - priority: 27
    category: state
    check: "the team assignment must not already be REVOKED"
    error_id: ERR_TEAM_ASSIGNMENT_ALREADY_REVOKED
    http_status: 409
    applies_to: "POST /team-assignments/{id}/revoke"
  - priority: 28
    category: business_constraint
    check: "the request must carry a CONFIRMED team assignment before confirm-team succeeds"
    error_id: ERR_TEAM_NOT_CONFIRMED
    http_status: 409
    applies_to: "POST /rating-requests/{id}/confirm-team"
  - priority: 29
    category: business_constraint
    check: "the team assignment's conflict_status must be CLEAR before confirmation or request advance"
    error_id: ERR_CONFLICT_NOT_CLEARED
    http_status: 409
    applies_to: "POST /team-assignments/{id}/confirm, POST /rating-requests/{id}/confirm-team"
  - priority: 30
    category: state
    check: "the committee must be CONVENED or IN_SESSION to decide, and DECIDED or IN_SESSION to redecide"
    error_id: ERR_COMMITTEE_NOT_IN_SESSION
    http_status: 409
    applies_to: "POST /rating-committees/{id}/decide, POST /rating-committees/{id}/redecide"
  - priority: 31
    category: business_temporal
    check: "the committee session may not open before committee_date"
    error_id: ERR_COMMITTEE_NOT_DUE
    http_status: 409
    applies_to: "POST /rating-committees/{id}/open-session"
  - priority: 32
    category: business_constraint
    check: "votes_cast must be at least required_voting_members before a decision"
    error_id: ERR_COMMITTEE_QUORUM_NOT_MET
    http_status: 409
    applies_to: "POST /rating-committees/{id}/decide, POST /rating-committees/{id}/redecide"
  - priority: 33
    category: business_constraint
    check: "no ABSTAIN vote may be outstanding when the committee decides"
    error_id: ERR_COMMITTEE_ABSTENTION_NOT_PERMITTED
    http_status: 409
    applies_to: "POST /rating-committees/{id}/decide"
  - priority: 34
    category: state
    check: "a committee may reopen only while its request is APPEALED"
    error_id: ERR_COMMITTEE_NOT_REOPENABLE
    http_status: 409
    applies_to: "POST /rating-committees/{id}/reopen"
  - priority: 35
    category: business_safety
    check: "every appearing voter holds an independence declaration dated within 180 days"
    error_id: ERR_INDEPENDENCE_DECLARATION_STALE
    http_status: 409
    applies_to: "POST /rating-committees/{id}/decide"
  - priority: 36
    category: business_constraint
    check: "a voter is COMMITTEE_ELIGIBLE and has not already voted on this committee"
    error_id: ERR_VOTE_NOT_ELIGIBLE_MEMBER
    http_status: 409
    applies_to: "POST /rating-committees/{id}/votes"
  - priority: 37
    category: state
    check: "the decision must be DRAFT to open its appeal window"
    error_id: ERR_DECISION_NOT_DRAFT
    http_status: 409
    applies_to: "POST /rating-decisions/{id}/open-appeal-window"
  - priority: 38
    category: state
    check: "the current decision must be in APPEAL_WINDOW before publication"
    error_id: ERR_DECISION_NOT_IN_APPEAL_WINDOW
    http_status: 409
    applies_to: "POST /rating-decisions/{id}/publish"
  - priority: 39
    category: state
    check: "the request must be COMMITTEE_DECIDED before an appeal window opens"
    error_id: ERR_REQUEST_NOT_COMMITTEE_DECIDED
    http_status: 409
    applies_to: "POST /rating-decisions/{id}/open-appeal-window"
  - priority: 40
    category: business_constraint
    check: "the published rationale is at least 200 characters"
    error_id: ERR_RATIONALE_TOO_SHORT
    http_status: 400
    applies_to: "POST /rating-committees/{id}/decide, POST /rating-committees/{id}/redecide"
  - priority: 41
    category: business_temporal
    check: "the appeal is filed inside the open appeal window"
    error_id: ERR_APPEAL_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /rating-decisions/{id}/appeals, POST /issuer-appeals/{id}/resolve"
  - priority: 42
    category: business_constraint
    check: "the appeal summary introduces information absent from the decision's filed materials"
    error_id: ERR_APPEAL_NOT_NEW_INFORMATION
    http_status: 409
    applies_to: "POST /rating-decisions/{id}/appeals, POST /issuer-appeals/{id}/resolve"
  - priority: 43
    category: business_constraint
    check: "resolution notes are at least 30 characters"
    error_id: ERR_APPEAL_RESOLUTION_NOTES_REQUIRED
    http_status: 400
    applies_to: "POST /issuer-appeals/{id}/resolve"
  - priority: 44
    category: state
    check: "the review is SCHEDULED, OVERDUE or ESCALATED before it can start"
    error_id: ERR_SURVEILLANCE_NOT_STARTABLE
    http_status: 409
    applies_to: "POST /surveillance-reviews/{id}/start"
  - priority: 45
    category: state
    check: "the review must be IN_PROGRESS to complete"
    error_id: ERR_SURVEILLANCE_NOT_IN_PROGRESS
    http_status: 409
    applies_to: "POST /surveillance-reviews/{id}/complete"
  - priority: 46
    category: business_constraint
    check: "a completed review may reopen only when a WITHDRAWAL action event exists for its decision"
    error_id: ERR_SURVEILLANCE_REOPEN_NOT_GROUNDED
    http_status: 409
    applies_to: "POST /surveillance-reviews/{id}/reopen"
  - priority: 47
    category: business_constraint
    check: "the entity's surveillance_posture is not RESTRICTED"
    error_id: ERR_POSTURE_RESTRICTED
    http_status: 409
    applies_to: "POST /surveillance-reviews/{id}/start, POST /rating-action-events/{id}/apply"
  - priority: 48
    category: business_temporal
    check: "the action's effective_at has been reached before it is applied"
    error_id: ERR_ACTION_EFFECTIVE_IN_FUTURE
    http_status: 409
    applies_to: "POST /rating-action-events/{id}/apply"
  - priority: 49
    category: business_temporal
    check: "the action is still in the future when it is cancelled"
    error_id: ERR_ACTION_ALREADY_EFFECTIVE
    http_status: 409
    applies_to: "POST /rating-action-events/{id}/cancel"
  - priority: 50
    category: state
    check: "the action event must be PENDING for apply or cancel"
    error_id: ERR_ACTION_NOT_PENDING
    http_status: 409
    applies_to: "POST /rating-action-events/{id}/apply, POST /rating-action-events/{id}/cancel"
  - priority: 51
    category: business_fiscal
    check: "the analyst holds no CONFIRMED team assignment in the compensation period"
    error_id: ERR_COMPENSATION_CONFLICT
    http_status: 402
    applies_to: "POST /compensation-records/{id}/approve"
  - priority: 52
    category: state
    check: "the compensation record must be APPROVED to be paid or revised"
    error_id: ERR_COMPENSATION_NOT_APPROVED
    http_status: 409
    applies_to: "POST /compensation-records/{id}/pay, POST /compensation-records/{id}/revise"
  - priority: 53
    category: state
    check: "the analyst must not be departed when compensation is approved"
    error_id: ERR_COMPENSATION_ANALYST_DEPARTED
    http_status: 409
    applies_to: "POST /compensation-records/{id}/approve"
  - priority: 54
    category: business_constraint
    check: "no other PUBLISHED methodology shares this methodology_code in the same sector"
    error_id: ERR_METHODOLOGY_CODE_CONFLICT
    http_status: 409
    applies_to: "POST /methodologies/{id}/publish"
  - priority: 55
    category: state
    check: "a replacement methodology for the same sector must already be PUBLISHED before superseding"
    error_id: ERR_NO_REPLACEMENT_METHODOLOGY
    http_status: 409
    applies_to: "POST /methodologies/{id}/supersede"
  - priority: 56
    category: state
    check: "the departed analyst has a recorded departure_date before the look-back starts"
    error_id: ERR_LOOKBACK_NOT_GROUNDED
    http_status: 409
    applies_to: "POST /look-back-reviews/{id}/start"
  - priority: 57
    category: state
    check: "the look-back review must be IN_PROGRESS to close"
    error_id: ERR_LOOKBACK_NOT_IN_PROGRESS
    http_status: 409
    applies_to: "POST /look-back-reviews/{id}/close"
  - priority: 58
    category: state
    check: "the review slot must be BOOKED to cancel"
    error_id: ERR_SLOT_NOT_BOOKED
    http_status: 409
    applies_to: "POST /review-slots/{id}/cancel"
  - priority: 59
    category: business_constraint
    check: "the named lead analyst is at tier LEAD"
    error_id: ERR_ANALYST_NOT_LEAD
    http_status: 400
    applies_to: "POST /team-assignments"
  - priority: 60
    category: business_fiscal
    check: "fee_amount_cents is a non-negative integer"
    error_id: ERR_FEE_AMOUNT_NEGATIVE
    http_status: 400
    applies_to: "POST /engagement-letters"
  - priority: 61
    category: business_safety
    check: "the lead analyst's sector matches the request's entity sector, or a sector waiver is recorded"
    error_id: ERR_SECTOR_MISMATCH
    http_status: 409
    applies_to: "POST /team-assignments/{id}/screen"
  - priority: 62
    category: business_constraint
    check: "the client's expected parent version matches the parent RatingRequest's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /team-assignments/{id}/confirm, POST /rating-decisions/{id}/publish"
  - priority: 63
    category: state
    check: "the methodology version is not already publicly disclosed"
    error_id: ERR_METHODOLOGY_ALREADY_PUBLIC
    http_status: 409
    applies_to: "POST /methodologies/{id}/publish-disclosure"
  - priority: 64
    category: business_safety
    check: "no AppearanceReconciliation for the decision sits in a blocking state (BREACH_CONFIRMED or APPEAL_PENDING)"
    error_id: ERR_APPEALS_BLOCKED_PENDING_RECONCILIATION
    http_status: 409
    applies_to: "POST /rating-decisions/{id}/appeals"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Methodologies ---
  - method: POST
    path: "/rating-agency/methodologies"
    description: "Author a new rating methodology version"
    roles: [ComplianceOfficer]
    code: 201
    input: [name, version_code, methodology_code, sector]
    output: Methodology
    side_effects: ["status = DRAFT; is_public = false"]
  - method: GET
    path: "/rating-agency/methodologies"
    description: "List methodologies, optionally filtered"
    roles: [Any]
    code: 200
    input: ["methodology_code?", "sector?", "status?", "limit?", "offset?"]
    output: "Methodology[]"
    side_effects: []
  - method: GET
    path: "/rating-agency/methodologies/{methodologyId}"
    description: "Get a methodology"
    roles: [Any]
    code: 200
    input: []
    output: Methodology
    side_effects: []
  - method: POST
    path: "/rating-agency/methodologies/{methodologyId}/publish"
    description: "Publish a methodology version, making it citable"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Methodology
    side_effects: ["status → PUBLISHED; effective_from stamped"]
  - method: POST
    path: "/rating-agency/methodologies/{methodologyId}/publish-disclosure"
    description: "Make a published methodology version publicly disclosed, enabling unsolicited ratings that cite it"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Methodology
    side_effects: ["is_public = true"]
  - method: POST
    path: "/rating-agency/methodologies/{methodologyId}/supersede"
    description: "Supersede a published methodology version"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Methodology
    side_effects: ["status → SUPERSEDED; effective_to stamped"]

  # --- Rated Entities ---
  - method: POST
    path: "/rating-agency/rated-entities"
    description: "Register an issuer to be rated"
    roles: [EngagementManager]
    code: 201
    input: [legal_name, sector, domicile_country, revenue_band, methodology_id, "solicitation_status?"]
    output: RatedEntity
    side_effects: ["surveillance_posture = NORMAL; current_grade = null"]
  - method: GET
    path: "/rating-agency/rated-entities"
    description: "List rated entities, optionally filtered"
    roles: [Any]
    code: 200
    input: ["methodology_id?", "sector?", "solicitation_status?", "surveillance_posture?", "limit?", "offset?"]
    output: "RatedEntity[]"
    side_effects: []
  - method: GET
    path: "/rating-agency/rated-entities/{ratedEntityId}"
    description: "Get a rated entity"
    roles: [Any]
    code: 200
    input: []
    output: RatedEntity
    side_effects: []

  # --- Engagement Letters ---
  - method: POST
    path: "/rating-agency/engagement-letters"
    description: "Draft an engagement letter with its fee arrangement"
    roles: [EngagementManager]
    code: 201
    input: [rated_entity_id, fee_amount_cents, fee_structure, fee_payer_is_issuer, signed_at]
    output: EngagementLetter
    side_effects: ["status = DRAFT"]
  - method: GET
    path: "/rating-agency/engagement-letters"
    description: "List engagement letters, optionally filtered"
    roles: [Any]
    code: 200
    input: ["rated_entity_id?", "status?", "limit?", "offset?"]
    output: "EngagementLetter[]"
    side_effects: []
  - method: GET
    path: "/rating-agency/engagement-letters/{engagementLetterId}"
    description: "Get an engagement letter"
    roles: [Any]
    code: 200
    input: []
    output: EngagementLetter
    side_effects: []
  - method: POST
    path: "/rating-agency/engagement-letters/{engagementLetterId}/submit"
    description: "Submit the signed engagement letter"
    roles: [EngagementManager]
    code: 200
    input: []
    output: EngagementLetter
    side_effects: ["status → SIGNED; cooling_off_end_at = signed_at + 90 days"]
  - method: POST
    path: "/rating-agency/engagement-letters/{engagementLetterId}/activate"
    description: "Activate an engagement letter after cooling off"
    roles: [EngagementManager]
    code: 200
    input: []
    output: EngagementLetter
    side_effects: ["status → ACTIVE; request intake unlocked"]
  - method: POST
    path: "/rating-agency/engagement-letters/{engagementLetterId}/revert-to-draft"
