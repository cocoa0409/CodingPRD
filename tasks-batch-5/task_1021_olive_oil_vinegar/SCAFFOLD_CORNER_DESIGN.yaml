  # ==========================================================================
  - section: errors
    instances:
      - name: fulfill_expired_fusti_returns_expired
        claim_type: Violation to Error
        grounds: ["validations[priority=12]", "errors[ERR_FUSTI_EXPIRED]"]
        distinguishing_aspect: "Fulfilling a REFILL order whose IN_SERVICE fusti is past best_by (clock 2026-07-15, best_by 2026-07-01) returns ERR_FUSTI_EXPIRED (fusti is not quarantined, so the freshness check is the sole failure)."
        test_recipe:
          setup: ["A short-shelf (30d) BULK_OIL fusti (harvest 2026-06-01, best_by 2026-07-01); a paid REFILL order; clock advanced past best_by to 2026-07-15."]
