              payload: { outcome: "VERIFIED" }
              as: PlatformAdmin
            - call: "POST /pod/storefronts"
              payload: { creator_id: "${creator_id}", slug: "cd13-sf", integration_channel: "SHOPIFY", markup_bps: 5000 }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { sf_id: $.data.id, sf_v_initial: $.data.version }
            # Bump storefront.version via a PUT markup_bps (unrelated write bumps version)
            - call: "PUT /pod/storefronts/${sf_id}"
              payload: { markup_bps: 6000 }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { sf_v_after_put: $.data.version }
          trigger:
            - call: "POST /pod/storefronts/${sf_id}/link-channel"
              payload: { expected_storefront_version: "${sf_v_initial}" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_STALE_STOREFRONT_VERSION"

