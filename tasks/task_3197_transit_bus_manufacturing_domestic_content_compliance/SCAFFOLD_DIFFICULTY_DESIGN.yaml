          assert:
            - "occ1 == ${bu_id} (forward action occupies the slot)"
            - "sl_st == CANCELLED and occ2 == null (compensating action releases occupancy)"
            - "bu_st == ENGINEERED (bus unchanged by the round trip)"

      - name: warranty_reserve_release_stock_invariant
        grounds:
          - state_machines.WarrantyClaim.UNDER_REVIEW_to_APPROVED
          - state_machines.WarrantyClaim.APPROVED_to_PAID
          - entities.PartsStock.fields.quantity
          - entities.PartsStock.fields.reserved_quantity
        distinguishing_aspect: |
          Different conserved quantity than slot occupancy: PartsStock
          quantity - reserved_quantity (available stock). approve then pay
          leaves available == 3 both after approve (5 - 2) and after pay
          (3 - 0) — the reserve/release pair conserves available units while
          moving 2 units from on-hand to consumed.
        test_recipe:
          setup:
            - "ACCEPTED bus; PartsStock quantity 5 reserved 0 for the claim's component; claim approved with approved_amount 150000 and component unit_cost 75000 (reserve 2)"
          setup_api_calls:
            - call: "POST /api/agencies"
              payload: { name: "Orchard Transit", agency_code: "OTA1", federally_funded: true, transition_target_year: 2036 }
              as: PlatformAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /api/contracts"
              payload: { agency_id: "${ag_id}", base_quantity: 1, base_unit_price_cents: 50000000, base_contract_year: 2027, escalation_index: PPI_1413 }
              as: ProcurementOfficer
              captures: { ct_id: $.data.id, ct_v0: $.data.version }
            - call: "POST /api/components"
              payload: { name: "Alternator", category: ELECTRICAL, unit_cost_cents: 75000, is_domestic: true }
              as: ComplianceOfficer
              captures: { c1: $.data.id }
            - call: "POST /api/bus-configurations"
              payload: { contract_id: "${ct_id}", propulsion_type: DIESEL, seating_layout: { rows: 10 }, fare_equipment: {}, accessibility_features: ["WHEELCHAIR_LIFT"], component_ids: ["${c1}"] }
              as: ConfigEngineer
              captures: { cfg_id: $.data.id }
            - call: "POST /api/bus-configurations/${cfg_id}/submit-review"
              payload: {}
              as: ConfigEngineer
            - call: "POST /api/bus-configurations/${cfg_id}/freeze"
              payload: { expected_contract_version: "${ct_v0}" }
              as: ConfigEngineer
            - call: "POST /api/contracts/${ct_id}/award"
              payload: {}
              as: ProcurementOfficer
            - call: "POST /api/audit-records"
              payload: { contract_id: "${ct_id}", audit_type: PRE_AWARD, auditor_id: "aud-1" }
              as: Auditor
              captures: { au_id: $.data.id }
            - call: "POST /api/components/${c1}/supplier-docs"
              payload: {}
              as: SupplierRep
              as_user_id: "sup-1"
            - call: "POST /api/components/${c1}/verify-docs"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /api/audit-records/${au_id}/complete"
              payload: {}
              as: Auditor
            - call: "POST /api/contracts/${ct_id}/activate"
              payload: {}
              as: ProcurementOfficer
            - call: "POST /api/bus-units"
              payload: { contract_id: "${ct_id}", bus_configuration_id: "${cfg_id}", assembly_location: US_MAIN }
              as: ProductionPlanner
              captures: { bu_id: $.data.id }
            - call: "POST /api/bus-units/${bu_id}/engineer"
              payload: {}
              as: ConfigEngineer
            - call: "POST /api/production-slots"
              payload: { line_id: LINE_B, start_ts: "2026-09-01T00:00:00Z", end_ts: "2026-09-04T00:00:00Z" }
              as: ProductionPlanner
              captures: { sl: $.data.id }
            - call: "POST /api/production-slots/${sl}/assign"
