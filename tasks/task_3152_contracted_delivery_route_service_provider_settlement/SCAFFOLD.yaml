    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_MISSING_AUTH_HEADER
    http: 401
    condition: "X-User-Role or X-User-ID header absent on any request"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the calling role is not in the endpoint's roles list"
  - id: ERR_PROVIDER_NOT_FOUND
    http: 404
    condition: "ServiceProvider id does not resolve"
  - id: ERR_SERVICE_AREA_NOT_FOUND
    http: 404
    condition: "ServiceArea id does not resolve"
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "Agreement id does not resolve"
  - id: ERR_SETTLEMENT_PERIOD_NOT_FOUND
    http: 404
    condition: "SettlementPeriod id does not resolve"
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "RouteAssignment id does not resolve"
  - id: ERR_VEHICLE_NOT_FOUND
    http: 404
    condition: "Vehicle id does not resolve"
  - id: ERR_DRIVER_NOT_FOUND
    http: 404
    condition: "Driver id does not resolve"
  - id: ERR_CHARGEBACK_CLAIM_NOT_FOUND
    http: 404
    condition: "ChargebackClaim id does not resolve"
  - id: ERR_DISPUTE_NOT_FOUND
    http: 404
    condition: "Dispute id does not resolve"
  - id: ERR_PEAK_DECLARATION_NOT_FOUND
    http: 404
    condition: "PeakSeasonDeclaration id does not resolve"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required body field is missing, an enum value is outside its declared set, or a body foreign key does not resolve"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the requested transition is not legal from the resource's current status"
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "the resource is already in a terminal state and rejects every transition"
  - id: ERR_AREA_ALREADY_ASSIGNED
    http: 409
    condition: "another RouteAssignment on the same service_area_id is in {ACTIVE, PENDING_TRANSFER}"
  - id: ERR_TEMPORAL_OVERLAP
    http: 409
    condition: "the candidate assignment occupancy interval overlaps another assignment occupancy interval on the same service_area_id; abutting endpoints are permitted"
  - id: ERR_DRIVER_HOURS_EXCEEDED
    http: 409
    condition: "the candidate duty interval rides over the previous duty interval on the same driver inside the inclusive guard buffer; intervals sharing only a start/end instant are rejected"
  - id: ERR_DRIVER_NOT_QUALIFIED
    http: 422
    condition: "a non-temporary driver on the signing roster is UNQUALIFIED or holds only CLASS_C"
  - id: ERR_INSURANCE_INSUFFICIENT
    http: 422
    condition: "the provider's AUTO_LIABILITY coverage is below the agreement floor or the policy has expired"
  - id: ERR_BRANDING_NONCOMPLIANT
    http: 422
    condition: "a non-temporary vehicle of the provider on the affected service area reports branding_compliance == FAILED"
  - id: ERR_VEHICLE_INELIGIBLE
    http: 422
    condition: "the vehicle_class and gvwr_pounds do not satisfy the selector's eligibility tier for the service area"
  - id: ERR_STOP_CAPACITY_EXCEEDED
    http: 422
    condition: "the week's summed stops_count exceeds ServiceArea.stop_capacity_weekly"
  - id: ERR_PEAK_CAPACITY_EXCEEDED
    http: 422
    condition: "the temporary asset count exceeds the declaration's authorized counts, or no ACTIVE declaration covers the instant"
  - id: ERR_DEDUCTION_CAP_EXCEEDED
    http: 422
    condition: "the summed non-CHARGEBACK deduction segments exceed DEDUCTION_CAP on a period not flagged as an over-cap reconcile"
  - id: ERR_CHARGEBACK_OUTSTANDING
    http: 422
    condition: "the transferring provider has a nonzero chargeback_outstanding_cents"
  - id: ERR_DISPUTE_WINDOW_EXPIRED
    http: 422
    condition: "the dispute is filed at or after week_start_at + 7 days + 90 days"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "the supplied expected_<parent>_version differs from the parent's current version"
  - id: ERR_NEGOTIATION_ROUND_LIMIT
    http: 422
    condition: "the agreement's renegotiation round budget is exhausted, or a renewal round is opened with more than 30 days remaining"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operational administrator who publishes fuel index rows, manipulates the logical clock, and may act on any operation for support purposes."
    identity: "opaque"
    exclusive_operations: ["POST /fuel-index-rates", "POST /_clock/set_current_utc", "GET /_clock/current_utc"]
    shared_operations: ["GET /fuel-index-rates", "GET /fuel-index-rates/{id}"]

  - name: AccountManager
    description: "Company-side contracting and operations manager who negotiates agreements, approves transfers, and releases settlements."
    identity: "opaque"
    exclusive_operations: ["POST /service-providers/{id}/approve", "POST /service-providers/{id}/suspend", "POST /agreements/{id}/sign", "POST /route-assignments/{id}/approve-transfer", "POST /settlement-periods/{id}/release", "POST /agreements/{id}/expire"]
    shared_operations: ["POST /service-providers", "POST /service-areas", "POST /agreements", "POST /route-assignments", "POST /chargeback-claims", "POST /peak-season-declarations", "GET /settlement-periods", "GET /agreements/{id}/renewal-recommendation", "POST /disputes/{id}/resolve"]

  - name: SettlementAnalyst
    description: "Analyst who runs the weekly accrual and reconciliation cycle and answers provider disputes."
    identity: "opaque"
    exclusive_operations: ["POST /settlement-periods", "POST /settlement-periods/{id}/close-accrual", "POST /settlement-periods/{id}/reconcile", "POST /settlement-periods/{id}/deductions", "POST /performance-metrics", "POST /performance-metrics/{id}/compose", "POST /disputes/{id}/counter", "POST /disputes/{id}/escalate"]
    shared_operations: ["POST /settlement-periods/{id}/stop-observations", "GET /settlement-periods/{id}/summary", "POST /disputes/{id}/resolve", "GET /fuel-index-rates"]

  - name: ComplianceOfficer
    description: "Officer who verifies insurance certificates and inspects vehicle branding and driver qualifications."
    identity: "opaque"
    exclusive_operations: ["POST /insurance-policies/{id}/verify", "POST /vehicles/{id}/branding-check", "POST /drivers/{id}/qualify", "POST /drivers/{id}/suspend"]
    shared_operations: ["GET /insurance-policies", "GET /vehicles", "GET /drivers", "GET /service-providers/{id}"]

  - name: ServiceProvider
    description: "Independent contracted provider that owns route titles, employs drivers and files disputes."
    identity: "entity_backed:ServiceProvider"
    exclusive_operations: ["POST /route-assignments/{id}/request-transfer", "POST /route-assignments/{id}/withdraw-transfer", "POST /agreements/{id}/submit", "POST /settlement-periods/{id}/dispute", "POST /disputes/{id}/submit-evidence", "POST /disputes/{id}/resubmit-evidence", "POST /disputes/{id}/withdraw", "POST /insurance-policies", "POST /drivers/{id}/duty-shifts"]
    shared_operations: ["POST /vehicles", "POST /drivers", "POST /settlement-periods/{id}/stop-observations", "GET /settlement-periods", "GET /route-assignments", "GET /service-providers/{id}"]

  - name: Anonymous
    description: "Unauthenticated caller used only to exercise the authentication gate."
    identity: "opaque"
    exclusive_operations: []
    shared_operations: []