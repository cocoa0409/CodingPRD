        grounds:
          - endpoints.POST /laboratories
          - endpoints.GET /laboratories/{id}
          - entities.Laboratory
        distinguishing_aspect: "The laboratory surface is create-and-read only: POST with just name, biosafety_level and bench_capacity applies decontamination_buffer_days 0 and status OPEN, GET /laboratories/{id} returns byte-identical field values, and a second POST that supplies every optional field at its extreme legal value (BSL3, 40 seats, 30 buffer days, CLOSED) round-trips unchanged. No update or delete endpoint is declared in the API surface, so a stored laboratory can only be read back."
