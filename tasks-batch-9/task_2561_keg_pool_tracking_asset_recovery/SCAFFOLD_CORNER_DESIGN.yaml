      - name: only_the_claimant_distributor_and_the_named_brewer_may_respond_to_a_claim
        claim_type: shared_operations
        excluded_because:
          difficulty_instance: claim_counter_negotiation_cycle_hits_round_limit_then_agrees
          rationale: "That §1.8 instance already drives POST /reconciliation-claims/{claim_id}/respond from both declared sides through a full counter cycle, and its refusals cover the two ways this shared endpoint narrows: a third party of the right role (priority 8 ERR_NOT_RESOURCE_OWNER) and the correct party out of turn (priority 19 ERR_RESPONDER_OUT_OF_TURN). Re-probing the shared role list here would only re-run those calls with the same asserts."

  # ==========================================================================
  # CROSS-CUTTING COMPLEXITY LAYERS — only the four layers declared in
  # complexity_profile.complexity_layers are probed: optimistic_concurrency,
  # cascading_side_effects, dual_variant_calculation, rate_threshold_triggers.
  # soft_delete, idempotency, pagination_with_filtering, bulk_operations,
  # scheduled_actions, multi_tenancy, derived_field_reconciliation and
  # conditional_feature_flags are NOT declared for this task; where the API
  # happens to touch them (the replenishment sweep's idempotence, the keg and
  # scan-event list filters, the bulk keg attach) they are probed as endpoint
  # claims above, not as layer claims here.
  # ==========================================================================
  - section: Cross-Cutting Complexity Layers
    instances:
      - name: one_request_bumps_each_touched_row_exactly_once_however_many_cascade_links_hit_it
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.VERSION SEMANTICS
          - concurrency_rules.order-allocate-stale-agreement
          - state_machines.Keg.custody_state["IN_FLOAT -> ISSUED_TO_BREWER"]
        distinguishing_aspect: "A single allocate names the agreement twice (its own side effect and cascade L4 over every ACTIVE agreement on the pool) and moves TWO kegs through one pool census, yet the agreement advances 2 -> 3 and the pool advances once, not once per link and not once per keg. The counter-facts are asserted in the same instance: rows the request did not change (the brewer) do not move at all, and the eight reads used to observe this move nothing either."
        test_recipe:
          setup:
            - "Clock 2026-08-01T23:00:00Z; brewer RDG (version 1); pool HB-50L created (version 1) and then stocked with four kegs, each import changing kegs_total and so bumping the pool to version 5."
            - "Agreement created (version 1) and activated (version 2); its float_posture is TIGHT with pending_replenishment_kegs 4."
            - "One order for TWO kegs, so the allocate moves two kegs inside one request."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T23:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /brewers"
              payload: { name: "Ridgeline Brewing", brand_code: "RDG", credit_limit_cents: 400000 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { b1_id: "$.data.id" }
            - call: "POST /pools"
              payload: { pool_code: "HB-50L", size_liters: 50, stainless_weight_kg: 12.5, replacement_cost_cents: 23500, region_code: "CO" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { p1_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0001" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { k1_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0002" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { k2_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0003" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0004" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /float-agreements"
              payload: { brewer_id: "${b1_id}", pool_id: "${p1_id}", float_size_kegs: 4, per_fill_rate_cents: 2200 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { fa1_id: "$.data.id" }
            - call: "POST /float-agreements/${fa1_id}/activate"
              payload: { effective_date: "2026-08-01" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { fa1_v: "$.data.version" }
            - call: "GET /pools/${p1_id}"
              payload: {}
              as: PoolOperator
              as_user_id: "op-1"
              captures: { p1_v_before: "$.data.version" }
            - call: "POST /issuance-orders"
              payload: { agreement_id: "${fa1_id}", requested_keg_count: 2 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { o1_id: "$.data.id" }
          trigger:
            - call: "POST /issuance-orders/${o1_id}/allocate"
              payload: { expected_agreement_version: "${fa1_v}" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "GET /float-agreements/${fa1_id}"
              payload: {}
              as: PoolOperator
              as_user_id: "op-1"
              captures: { fa1_v_after: "$.data.version" }
            - call: "GET /pools/${p1_id}"
              payload: {}
              as: PoolOperator
              as_user_id: "op-1"
            - call: "GET /brewers/${b1_id}"
              payload: {}
              as: PoolOperator
              as_user_id: "op-1"
            - call: "GET /issuance-orders/${o1_id}"
              payload: {}
              as: PoolOperator
              as_user_id: "op-1"
            - call: "GET /float-agreements/${fa1_id}"
              payload: {}
              as: PoolOperator
              as_user_id: "op-1"
          assert:
            - "the captured fa1_v == 2 (create 1, activate 2) and p1_v_before == 5 (create 1 plus one bump per keg import, four imports)"
            - "the allocate returns HTTP 200 and fa1_v_after == 3: the agreement is written by its own side effect AND by cascade L4 in the same request, and that is ONE bump, not two"
            - "KegPool.${p1_id}.version == 6 after the allocate: two kegs changed custody inside one request and the census/posture recompute still bumps the pool exactly once"
            - "Keg.${k1_id}.version == 2 and Keg.${k2_id}.version == 2 — each moved row bumps once"
            - "IssuanceOrder.${o1_id}.version == 2 with status == ALLOCATED, allocated_keg_count == 2, allocation_shortfall == 0 and per_fill_price_cents_pinned == 2200"
            - "Brewer.${b1_id}.version == 1: the allocate did not touch the brewer, and an untouched row is never bumped for company"
            - "the five reads after the allocate return the same version numbers as the first one: FloatAgreement.${fa1_id}.version is 3 on both reads, so GETs never bump"
            - "the agreement's own fields moved once and consistently: kegs_issued_count == 2, kegs_at_brewer_count == 2, float_posture == TIGHT, pending_replenishment_kegs == 2"

      - name: fleet_imports_walk_the_pool_from_open_through_restricted_to_frozen_and_back
        claim_type: cascading_side_effects
        grounds:
          - endpoints["POST /pools/{pool_id}/kegs"].side_effects
          - calculations.pool_posture
          - calculations.float_posture
          - validations[priority=13]
        distinguishing_aspect: "An endpoint that only imports one keg reaches four rows deep: keg -> pool census -> pool posture -> every ACTIVE agreement's float_posture -> the next allocate's verdict. The chain is exercised in both directions in one instance, and the no-op links are asserted too: the nine imports that keep the posture at RESTRICTED leave the agreement at version 2, because a recompute that changes nothing is not a write."
        test_recipe:
          setup:
            - "Clock 2026-08-01T23:00:00Z; brewer RDG; pool HB-50L with default thresholds (restrict 25, freeze 10) holding ONE IN_FLOAT keg, so available_pct starts at 100.00 and posture is OPEN."
            - "Agreement float_size_kegs 1 at 2200 activated 2026-08-01 (version 2, float_posture TIGHT), and one REQUESTED order for one keg created while the pool is still OPEN."
            - "Nine kegs are then imported with initial_custody_state QUARANTINED. They land in kegs_servicing, so available_pct falls to 100 * 1 / 10 = 10.00, exactly the freeze threshold, which is RESTRICTED (both comparisons are >=)."
