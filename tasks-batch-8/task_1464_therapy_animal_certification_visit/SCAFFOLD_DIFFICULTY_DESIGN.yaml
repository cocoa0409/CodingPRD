            - { call: "POST /v1/evaluations/${e}/score", payload: { aptitude_score: 70, obedience_score: 70 }, as: Evaluator, as_user_id: "${ev}", captures: { st1: $.data.status, comp1: $.data.composite_score } }
            - { call: "POST /v1/evaluations/${e}/appeal", payload: {}, as: Handler, as_user_id: "${h}", captures: { st2: $.data.status } }
