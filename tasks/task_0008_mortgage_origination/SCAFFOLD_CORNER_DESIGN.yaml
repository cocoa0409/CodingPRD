  # =========================================================================
  # Section 8 — Cross-Cutting Complexity Layers
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: occ_stale_application_version_blocks_ratelock_create
        claim_type: optimistic_concurrency
        grounds: [concurrency_rules.ratelock-create-stale-application, "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Two sequential POST /rate-locks calls with the same expected_application_version: first succeeds (bumps version), second is rejected with 412 ERR_STALE_VERSION because it carries the now-stale expected version."
        test_recipe:
          setup: ["Empty DB. Applicant + LoanApplication PREQUALIFIED."]
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_name: "OC", email: "oc@test.com", ssn_last4: "1400", annual_income_cents: 7726104, monthly_debt_cents: 50000, credit_score: 720, state_code: "CA" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { applicant_id: $.data.id }
            - call: "POST /loan-applications"
              payload: { applicant_id: "${applicant_id}", property_address: "X", property_state_code: "CA", loan_purpose: "PURCHASE", requested_loan_amount_cents: 30000000, property_value_cents: 31578948, loan_term_months: 360 }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { app_id: $.data.id }
            - call: "POST /loan-applications/${app_id}/prequalify"
              payload: {}
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { v1: $.data.version }
            - call: "POST /rate-locks"
              payload: { application_id: "${app_id}", locked_rate_bps: 625, lock_term_days: 30, expected_application_version: "${v1}" }
              as: LoanOfficer
              as_user_id: "lo-001"
          trigger:
            - call: "POST /rate-locks"
              payload: { application_id: "${app_id}", locked_rate_bps: 650, lock_term_days: 30, expected_application_version: "${v1}" }
              as: LoanOfficer
              as_user_id: "lo-001"
          assert:
            - "response.status_code == 412"
            - "response.data.error_id == 'ERR_STALE_VERSION'"

      - name: occ_stale_application_version_blocks_disclosure_create
        claim_type: optimistic_concurrency
        grounds: [concurrency_rules.disclosure-create-stale-application, "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "POST /disclosures with stale expected_application_version → 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Empty DB. Applicant + LoanApplication PREQUALIFIED. ACTIVE RateLock."]
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_name: "OD", email: "od@test.com", ssn_last4: "1410", annual_income_cents: 7726104, monthly_debt_cents: 50000, credit_score: 720, state_code: "CA" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { applicant_id: $.data.id }
            - call: "POST /loan-applications"
              payload: { applicant_id: "${applicant_id}", property_address: "X", property_state_code: "CA", loan_purpose: "PURCHASE", requested_loan_amount_cents: 30000000, property_value_cents: 31578948, loan_term_months: 360 }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { app_id: $.data.id }
            - call: "POST /loan-applications/${app_id}/prequalify"
              payload: {}
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { v1: $.data.version }
            - call: "POST /rate-locks"
              payload: { application_id: "${app_id}", locked_rate_bps: 687, lock_term_days: 30, expected_application_version: "${v1}" }
              as: LoanOfficer
              as_user_id: "lo-001"
          trigger:
            - call: "POST /disclosures"
              payload: { application_id: "${app_id}", disclosure_type: "LOAN_ESTIMATE", expected_application_version: "${v1}" }
              as: LoanOfficer
              as_user_id: "lo-001"
          assert:
            - "response.status_code == 412"
            - "response.data.error_id == 'ERR_STALE_VERSION'"

      - name: scheduled_clock_drive_advances_consummation_eligibility
        claim_type: scheduled_actions
        grounds: [calculations.trid_timeline_calc, endpoints]
        distinguishing_aspect: "Advancing the system clock past earliest_consummation_at enables POST /close to succeed where it would have failed earlier — the test-driving clock endpoint operationalises the TRID waiting period without wall-clock waits."
        test_recipe:
          setup: ["Empty DB. Clock 2026-06-01. Full path to CLEAR_TO_CLOSE with earliest_consummation_at = 2026-06-08T10:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
