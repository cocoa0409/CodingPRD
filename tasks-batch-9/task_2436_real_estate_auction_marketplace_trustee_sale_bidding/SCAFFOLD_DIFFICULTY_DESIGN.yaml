  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: county_slot_buffer_is_inclusive_at_thirty_minutes
        grounds:
          - calculations.county_slot_overlap
          - validations[priority=47]
          - errors[ERR_COUNTY_SLOT_CONFLICT]
          - endpoints[POST /auction-events]
        distinguishing_aspect: |
          The county slot test is a CLOSED interval widened by COUNTY_BUFFER_MINUTES 30, so a
          candidate event starting exactly 19:30:00Z after a 19:00:00Z end is REJECTED while
          one starting at 19:30:01Z is accepted — a one-second boundary. The same rejected
          window is nevertheless accepted in a different county, proving the interval is
          keyed on county_code and not global.
        test_recipe:
          setup:
            - "An empty database with the clock at 2026-08-05T00:00:00Z."
            - "One existing AuctionEvent in CA-ALAMEDA occupying 2026-09-15T17:00:00Z..19:00:00Z, so its buffered slot is 16:30:00Z..19:30:00Z inclusive."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /auction-events"
              payload: { title: "Alameda Slot Anchor", county_code: "CA-ALAMEDA", starts_at: "2026-09-15T17:00:00Z", ends_at: "2026-09-15T19:00:00Z" }
              as: AuctionOps
              captures: { anchor_id: $.data.id }
          trigger:
            - call: "POST /auction-events"
              payload: { title: "Alameda Touching Buffer", county_code: "CA-ALAMEDA", starts_at: "2026-09-15T19:30:00Z", ends_at: "2026-09-15T21:00:00Z" }
              as: AuctionOps
              captures: { err_id: $.data.error_id }
            - call: "POST /auction-events"
              payload: { title: "Alameda One Second Clear", county_code: "CA-ALAMEDA", starts_at: "2026-09-15T19:30:01Z", ends_at: "2026-09-15T21:00:00Z" }
              as: AuctionOps
              captures: { clear_id: $.data.id }
            - call: "POST /auction-events"
              payload: { title: "Contra Costa Same Window", county_code: "CA-CONTRA-COSTA", starts_at: "2026-09-15T17:00:00Z", ends_at: "2026-09-15T19:00:00Z" }
              as: AuctionOps
              captures: { other_county_id: $.data.id }
          assert:
            - "The 19:30:00Z candidate is 409 with ${err_id} == ERR_COUNTY_SLOT_CONFLICT (the failing call is POST /auction-events)"
            - "The 19:30:01Z candidate is 201: AuctionEvent.${clear_id}.event_status == SCHEDULED and starts_at == 2026-09-15T19:30:01Z"
            - "The CA-CONTRA-COSTA candidate is 201 even though its window is identical to the anchor: AuctionEvent.${other_county_id}.event_status == SCHEDULED"
            - "AuctionEvent.${anchor_id}.event_status == SCHEDULED and version is unchanged by the rejected attempt"
            - "GET /auction-events?county_code=CA-ALAMEDA returns exactly 2 events (anchor plus the 19:30:01Z event)"

      - name: same_asset_lot_windows_are_half_open_across_events
        grounds:
          - calculations.lot_window_overlap
          - validations[priority=48]
          - validations[priority=32]
          - errors[ERR_LOT_WINDOW_CONFLICT]
          - concurrency_rules.lot-add-stale-event
        distinguishing_aspect: |
          Lot windows for the SAME asset use a HALF-OPEN comparison (strict `<`), the opposite
          convention from the county slot rule in the sibling instance: two touching windows
          (…18:00:00Z and 18:00:00Z…) are accepted, while a 30-minute genuine overlap is
          rejected. The rejected call must still carry the CURRENT event version, because the
          OCC rule at priority 32 precedes the overlap rule at 48 and would otherwise mask it.
        test_recipe:
          setup:
            - "One VACANT asset X in CA-ALAMEDA (used by every lot in this instance)."
            - "Event A in CA-ALAMEDA runs 2026-09-15T17:00:00Z..18:00:00Z; Event B is in CA-CONTRA-COSTA and runs 18:00:00Z..19:00:00Z, so the county buffer never applies between them."
            - "Lot A on event A covers 17:00:00Z..18:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sellers"
              payload: { org_name: "Bay Ridge Holdings", seller_type: "PRIVATE_SELLER", contact_email: "sell@bayridge.example", settlement_account_ref: "ACH-BAY-7" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /asset-listings"
              payload: { seller_id: "${seller_id}", street_address: "5 Bay Ridge Ln", city: "Oakland", county_code: "CA-ALAMEDA", state_code: "CA", estimated_value_cents: 31000000 }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { asset_x: $.data.id }
            - call: "POST /asset-listings/${asset_x}/disclosures"
              payload: { occupancy_status: "VACANT", title_condition: "CLEAR" }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /auction-events"
              payload: { title: "Event A Alameda Early", county_code: "CA-ALAMEDA", starts_at: "2026-09-15T17:00:00Z", ends_at: "2026-09-15T18:00:00Z" }
              as: AuctionOps
              captures: { event_a: $.data.id, event_a_v: $.data.version }
            - call: "POST /auction-events"
              payload: { title: "Event B Contra Costa Late", county_code: "CA-CONTRA-COSTA", starts_at: "2026-09-15T18:00:00Z", ends_at: "2026-09-15T19:00:00Z" }
              as: AuctionOps
              captures: { event_b: $.data.id, event_b_v1: $.data.version }
            - call: "POST /auction-events/${event_a}/lots"
              payload: { asset_listing_id: "${asset_x}", lot_number: 1, lot_window_start_at: "2026-09-15T17:00:00Z", lot_window_end_at: "2026-09-15T18:00:00Z", opening_bid_cents: 20000000, reserve_price_cents: 20000000, expected_auction_event_version: "${event_a_v}" }
              as: AuctionOps
              captures: { lot_a: $.data.id }
          trigger:
            - call: "POST /auction-events/${event_b}/lots"
              payload: { asset_listing_id: "${asset_x}", lot_number: 1, lot_window_start_at: "2026-09-15T18:00:00Z", lot_window_end_at: "2026-09-15T19:00:00Z", opening_bid_cents: 20000000, reserve_price_cents: 20000000, expected_auction_event_version: "${event_b_v1}" }
              as: AuctionOps
              captures: { lot_b: $.data.id }
            - call: "GET /auction-events/${event_b}"
              payload: {}
              as: AuctionOps
              captures: { event_b_v2: $.data.version }
            - call: "POST /auction-events/${event_b}/lots"
              payload: { asset_listing_id: "${asset_x}", lot_number: 2, lot_window_start_at: "2026-09-15T18:30:00Z", lot_window_end_at: "2026-09-15T19:00:00Z", opening_bid_cents: 20000000, reserve_price_cents: 20000000, expected_auction_event_version: "${event_b_v2}" }
              as: AuctionOps
              captures: { err_id: $.data.error_id }
          assert:
            - "The touching lot is 201: AuctionLot.${lot_b}.lot_window_start_at == 2026-09-15T18:00:00Z and lot_status == PENDING"
            - "AuctionLot.${lot_a}.lot_window_end_at == 2026-09-15T18:00:00Z (touching endpoints do not overlap)"
            - "The 18:30:00Z..19:00:00Z lot is 409 with ${err_id} == ERR_LOT_WINDOW_CONFLICT (the failing call is POST /auction-events/{id}/lots)"
            - "${err_id} != ERR_STALE_EVENT_VERSION and ${err_id} != ERR_LOT_WINDOW_OUTSIDE_EVENT"
            - "GET /auction-lots?auction_event_id=${event_b} returns exactly 1 lot"
            - "AuctionEvent.${event_b}.lot_count == 1"
            - "AssetListing.${asset_x}.listing_status == LISTED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: deposit_pool_conserved_when_outbid_hold_is_released
        grounds:
          - calculations.deposit_ledger
          - calculations.required_deposit
          - state_machines.AuctionLot.OPEN_to_OPEN_on_bid
          - entities.DepositHold.fields.released_reason
          - entities.Bidder.fields.deposit_available_cents
        distinguishing_aspect: |
          Being outbid must release the loser's hold in the SAME request that creates the
          winner's hold, so the platform-wide identity available + held + forfeited == funded
          holds for BOTH bidders after a single call. A naive implementation that only creates
          the new hold leaves bidder 1 at 2000000 available instead of the required 3000000,
          which is exactly the drift this instance detects.
        test_recipe:
          setup:
            - "One VACANT asset in CA-ALAMEDA on a REO AuctionEvent (17:00:00Z..19:00:00Z) with one OPEN lot: opening_bid 20000000, reserve 20000000, min_increment 500000, required_deposit 1000000."
            - "Bidder 1 is VERIFIED and funded with 3000000; bidder 2 is VERIFIED and funded with 2500000."
            - "Bidder 1 already holds the WINNING bid of 20000000 with a HELD deposit of 1000000, leaving deposit_available_cents 2000000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sellers"
              payload: { org_name: "Northgate REO", seller_type: "BANK", contact_email: "reo@northgate.example", settlement_account_ref: "ACH-NORTH-9" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /asset-listings"
              payload: { seller_id: "${seller_id}", street_address: "150 Northgate Rd", city: "Oakland", county_code: "CA-ALAMEDA", state_code: "CA", estimated_value_cents: 27500000 }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /asset-listings/${listing_id}/disclosures"
              payload: { occupancy_status: "VACANT", title_condition: "CLEAR" }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /auction-events"
              payload: { title: "Alameda REO Northgate", county_code: "CA-ALAMEDA", starts_at: "2026-09-15T17:00:00Z", ends_at: "2026-09-15T19:00:00Z" }
              as: AuctionOps
              captures: { event_id: $.data.id, event_v: $.data.version }
            - call: "POST /auction-events/${event_id}/lots"
              payload: { asset_listing_id: "${listing_id}", lot_number: 1, lot_window_start_at: "2026-09-15T17:00:00Z", lot_window_end_at: "2026-09-15T18:00:00Z", opening_bid_cents: 20000000, reserve_price_cents: 20000000, min_increment_cents: 500000, expected_auction_event_version: "${event_v}" }
              as: AuctionOps
              captures: { lot_id: $.data.id }
            - call: "POST /bidders"
              payload: { legal_name: "Northgate First Bidder LLC", email: "one@northbid.example", mailing_address: "1 Northgate Rd, Oakland CA" }
              as: Anonymous
              captures: { b1_id: $.data.id }
            - call: "POST /bidders/${b1_id}/identity-verification"
              payload: { decision: "VERIFIED", document_reference: "KYC-N1" }
              as: ComplianceOfficer
            - call: "POST /bidders/${b1_id}/deposits"
              payload: { amount_cents: 3000000, funding_reference: "WIRE-N1" }
              as: Bidder
              as_user_id: "${b1_id}"
            - call: "POST /bidders"
              payload: { legal_name: "Northgate Second Bidder LLC", email: "two@northbid.example", mailing_address: "2 Northgate Rd, Oakland CA" }
              as: Anonymous
              captures: { b2_id: $.data.id }
            - call: "POST /bidders/${b2_id}/identity-verification"
              payload: { decision: "VERIFIED", document_reference: "KYC-N2" }
              as: ComplianceOfficer
            - call: "POST /bidders/${b2_id}/deposits"
              payload: { amount_cents: 2500000, funding_reference: "WIRE-N2" }
              as: Bidder
              as_user_id: "${b2_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T17:05:00Z" }
              as: PlatformAdmin
            - call: "POST /auction-events/${event_id}/open"
              payload: {}
              as: AuctionOps
            - call: "POST /auction-lots/${lot_id}/bids"
              payload: { bidder_id: "${b1_id}", amount_cents: 20000000 }
              as: Bidder
              as_user_id: "${b1_id}"
              captures: { bid_1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T17:20:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /auction-lots/${lot_id}/bids"
              payload: { bidder_id: "${b2_id}", amount_cents: 20500000 }
              as: Bidder
              as_user_id: "${b2_id}"
              captures: { bid_2: $.data.id }
          assert:
            - "Bid.${bid_1}.bid_status == OUTBID and Bid.${bid_2}.bid_status == WINNING"
            - "Bidder.${b1_id}.deposit_available_cents == 3000000 and deposit_funded_cents == 3000000 and deposit_forfeited_cents == 0"
            - "Bidder.${b2_id}.deposit_available_cents == 1500000 and deposit_funded_cents == 2500000 and deposit_forfeited_cents == 0"
            - "GET /deposit-holds?bidder_id=${b1_id} returns exactly 1 hold with status == RELEASED and released_reason == OUTBID and amount_cents == 1000000"
            - "GET /deposit-holds?bidder_id=${b2_id} returns exactly 1 hold with status == HELD and amount_cents == 1000000"
            - "AuctionLot.${lot_id}.current_high_bid_cents == 20500000 and bid_count == 2 and lot_status == OPEN"
            - "Invariant for bidder 1: 3000000 + 0 + 0 == 3000000; invariant for bidder 2: 1500000 + 1000000 + 0 == 2500000"

      - name: settlement_identity_survives_fallout_void
        grounds:
          - calculations.settlement_split
          - calculations.forfeiture_split
          - state_machines.SaleContract.POSTED_to_VOID
          - entities.Seller.fields.settled_net_cents
          - endpoints[POST /sale-contracts/{id}/fallout]
        distinguishing_aspect: |
          Two DIFFERENT conservation identities must hold on the same contract row before and
          after the void: seller_net + platform_fee + buyer_premium == settlement_gross
          (18885000 + 1115000 + 2150000 == 22150000) while POSTED, and
          forfeiture_seller_net + forfeiture_platform_fee == forfeited_deposit
          (750000 + 500000 == 1250000) after VOID. The posted numbers are RETAINED rather than
          zeroed, so the Seller ledger must be reversed by exactly the posted seller_net and
          re-credited the forfeiture share (final 750000) instead of being recomputed.
        test_recipe:
          setup:
            - "The fixture of postponement-free REO sale: TENANT_OCCUPIED asset in CA-ALAMEDA verified CLOUDED, hammer 20000000, contract EXECUTED with settlement POSTED."
            - "Posted settlement: buyer_premium 2150000, platform_fee 1115000, seller_net 18885000, settlement_gross 22150000; Seller.settled_net_cents 18885000."
            - "The sole bidder funded 2000000 and has a HELD deposit of 1250000."
            - "Logical clock at 2026-09-21T00:00:00Z, before the 2026-10-06T18:05:00Z closing deadline."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sellers"
              payload: { org_name: "Lakeview Servicing", seller_type: "SERVICER", contact_email: "reo@lakeview.example", settlement_account_ref: "ACH-LAKE-14", default_commission_bps: 500 }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /asset-listings"
              payload: { seller_id: "${seller_id}", street_address: "44 Lakeshore Ave", city: "Oakland", county_code: "CA-ALAMEDA", state_code: "CA", estimated_value_cents: 27000000 }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /asset-listings/${listing_id}/disclosures"
              payload: { occupancy_status: "TENANT_OCCUPIED", title_condition: "UNKNOWN" }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /auction-events"
              payload: { title: "Alameda REO Lakeshore", county_code: "CA-ALAMEDA", starts_at: "2026-09-15T17:00:00Z", ends_at: "2026-09-15T19:00:00Z" }
              as: AuctionOps
              captures: { event_id: $.data.id, event_v: $.data.version }
            - call: "POST /auction-events/${event_id}/lots"
              payload: { asset_listing_id: "${listing_id}", lot_number: 1, lot_window_start_at: "2026-09-15T17:00:00Z", lot_window_end_at: "2026-09-15T18:00:00Z", opening_bid_cents: 20000000, reserve_price_cents: 20000000, expected_auction_event_version: "${event_v}" }
              as: AuctionOps
              captures: { lot_id: $.data.id }
            - call: "POST /bidders"
              payload: { legal_name: "Lakeshore Equity LLC", email: "bid@lakeshoreequity.example", mailing_address: "9 Lakeshore Ave, Oakland CA" }
              as: Anonymous
              captures: { bidder_id: $.data.id }
            - call: "POST /bidders/${bidder_id}/identity-verification"
              payload: { decision: "VERIFIED", document_reference: "KYC-LK1" }
              as: ComplianceOfficer
            - call: "POST /bidders/${bidder_id}/deposits"
              payload: { amount_cents: 2000000, funding_reference: "WIRE-LK1" }
              as: Bidder
              as_user_id: "${bidder_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T17:05:00Z" }
              as: PlatformAdmin
            - call: "POST /auction-events/${event_id}/open"
              payload: {}
              as: AuctionOps
            - call: "POST /auction-lots/${lot_id}/bids"
              payload: { bidder_id: "${bidder_id}", amount_cents: 20000000 }
              as: Bidder
              as_user_id: "${bidder_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T18:05:00Z" }
              as: PlatformAdmin
            - call: "POST /auction-lots/${lot_id}/close"
              payload: {}
              as: AuctionOps
              as_user_id: "ops-closer-1"
            - call: "POST /asset-listings/${listing_id}/title-clearance"
              payload: { clearance_outcome: "CLOUDED_DISCLOSED", verified_title_condition: "CLOUDED", title_report_reference: "TR-LK-77" }
              as: TitleOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T18:10:00Z" }
              as: PlatformAdmin
            - call: "POST /auction-lots/${lot_id}/sale-contract"
              payload: { closing_window_days: 21 }
              as: AuctionOps
              as_user_id: "ops-contract-2"
              captures: { contract_id: $.data.id }
            - call: "GET /sale-contracts/${contract_id}"
              payload: {}
              as: AuctionOps
              captures: { posted_net: $.data.seller_net_cents, posted_fee: $.data.platform_fee_cents, posted_prem: $.data.final_buyer_premium_cents, posted_gross: $.data.settlement_gross_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-21T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /sale-contracts/${contract_id}/fallout"
              payload: { fallout_reason: "buyer financing collapsed" }
              as: AuctionOps
              as_user_id: "ops-contract-2"
          assert:
            - "Before the void: ${posted_net} == 18885000, ${posted_fee} == 1115000, ${posted_prem} == 2150000, ${posted_gross} == 22150000"
            - "Before the void the identity holds: 18885000 + 1115000 + 2150000 == 22150000"
            - "Seller.${seller_id}.settled_net_cents was 18885000 while the contract was POSTED"
            - "After the void: SaleContract.${contract_id}.settlement_status == VOID and contract_status == FALLOUT"
            - "SaleContract.${contract_id}.seller_net_cents == 18885000 and platform_fee_cents == 1115000 and final_buyer_premium_cents == 2150000 and settlement_gross_cents == 22150000 (retained, not zeroed)"
            - "SaleContract.${contract_id}.forfeited_deposit_cents == 1250000, forfeiture_seller_net_cents == 750000, forfeiture_platform_fee_cents == 500000"
            - "After the void the forfeiture identity holds: 750000 + 500000 == 1250000"
            - "Seller.${seller_id}.settled_net_cents == 750000"
            - "Bidder.${bidder_id}.deposit_forfeited_cents == 1250000 and deposit_available_cents == 750000 and deposit_funded_cents == 2000000"
