              as: QualityManager
              captures: { f1: $.data.id }
            - call: "POST /evaluation-forms/${f1}/activate"
              payload: {}
              as: QualityManager
            - call: "POST /evaluation-forms"
              payload: { name: "Collections Quality", version_label: "2026.08-B", auto_fail_policy: "ZERO_TOTAL", min_compliance_item_score: 3, behaviors: [ { code: "DISCLOSE", label: "Disclosures", weight_pct: 40.00, compliance_critical: true, auto_fail_on_violation: true, max_points: 5, allows_not_applicable: false, guidance_text: "State the recording disclosure." }, { code: "GREET", label: "Greeting", weight_pct: 30.00, compliance_critical: false, auto_fail_on_violation: false, max_points: 5, allows_not_applicable: false, guidance_text: "Use the branded greeting." }, { code: "RESOLVE", label: "Resolution", weight_pct: 30.00, compliance_critical: false, auto_fail_on_violation: false, max_points: 5, allows_not_applicable: false, guidance_text: "Resolve or set a next step." } ] }
              as: QualityManager
