            - { call: "POST /fafsa/senior-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", student_ref: "S1", full_name: "Ana Lee", dob: "2009-03-04", home_language: "en" }, captures: { sr: $.data.id, sr_v: $.data.version } }
            - { call: "POST /fafsa/aid-records", as: DataImporter, payload: { campaign_id: "${camp}", external_ref: "EXT1", full_name: "Ana Lee", dob: "2009-03-04", school_code: "SC01", district_code: "D01", initial_status: "VERIFICATION_SELECTED", effective_date: "2027-01-10" }, captures: { ar: $.data.id } }
            - { call: "POST /fafsa/consent-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { senior_record_id: "${sr}", scopes: ["STATUS_DETAIL"], granted_by: "PARENT" } }
            - { call: "POST /fafsa/match-links", as: MatchReviewer, payload: { senior_record_id: "${sr}", aid_record_id: "${ar}", expected_senior_record_version: "${sr_v}" } }
            - { call: "GET /fafsa/support-cases?senior_record_id=${sr}", as: CampaignAdmin, captures: { cs: "$.data[0].id" } }
            - { call: "POST /fafsa/support-cases/${cs}/accept", as: Specialist, as_user_id: "${spec}" }
            - { call: "GET /fafsa/document-checklists?senior_record_id=${sr}", as: CampaignAdmin, captures: { cl: "$.data[0].id" } }
            - { call: "GET /fafsa/document-checklists/${cl}/items", as: CampaignAdmin, captures: { it1: "$.data[0].id", it2: "$.data[1].id", it3: "$.data[2].id", it4: "$.data[3].id" } }
          trigger:
            - { call: "POST /fafsa/support-cases/${cs}/resolve", as: Specialist, as_user_id: "${spec}", captures: { err: $.data.error_id } }
            - { call: "POST /fafsa/checklist-items/${it1}/receive", as: SchoolCoordinator, as_user_id: "${sch}" }
            - { call: "POST /fafsa/checklist-items/${it1}/verify", as: SchoolCoordinator, as_user_id: "${sch}" }
            - { call: "POST /fafsa/checklist-items/${it2}/receive", as: SchoolCoordinator, as_user_id: "${sch}" }
            - { call: "POST /fafsa/checklist-items/${it2}/verify", as: SchoolCoordinator, as_user_id: "${sch}" }
            - { call: "POST /fafsa/checklist-items/${it3}/receive", as: SchoolCoordinator, as_user_id: "${sch}" }
            - { call: "POST /fafsa/checklist-items/${it3}/verify", as: SchoolCoordinator, as_user_id: "${sch}" }
            - { call: "POST /fafsa/checklist-items/${it4}/receive", as: SchoolCoordinator, as_user_id: "${sch}" }
            - { call: "POST /fafsa/checklist-items/${it4}/verify", as: SchoolCoordinator, as_user_id: "${sch}" }
            - { call: "POST /fafsa/support-cases/${cs}/resolve", as: Specialist, as_user_id: "${spec}", captures: { st: $.data.status, outcome: $.data.resolution_outcome } }
          assert:
            - "First resolve: error_id == ERR_CHECKLIST_NOT_COMPLETE (HTTP 409)"
            - "After all 4 items VERIFIED: checklist status == COMPLETE and resolve succeeds with status RESOLVED, resolution_outcome VERIFICATION_COMPLETED"

  - rule_id: resource_temporal_overlap
    instances:
      - name: staff_double_booking_half_open_adjacency
        grounds:
          - calculations.overlap_checks
          - errors[ERR_STAFF_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Resource StaffProfile with HALF-OPEN interval semantics: a confirmed
          assignment on 10:00-12:00 blocks a second confirm on 11:00-13:00 but
          ALLOWED the adjacent 12:00-14:00 (touching endpoints). Contrasts with
          the venue rule's buffered semantics on a different resource.
        test_recipe:
          setup:
            - "Campaign OPEN; school ENROLLED; three events same day: E1 10:00-12:00, E2 12:00-14:00, E3 11:00-13:00 (all DRAFT, cost 1000)"
            - "Staff X (EVENT_STAFF, background CLEARED); three assignments created while none are CONFIRMED (create-time pre-check passes), then all accepted"
          setup_api_calls:
            - { call: "POST /fafsa/campaigns", as: CampaignAdmin, payload: { name: "C27", academic_year: "2027-2028", state_grant_deadline: "2027-04-15T00:00:00Z", federal_deadline: "2028-06-30T00:00:00Z", total_budget_cents: 100000 }, captures: { camp: $.data.id } }
            - { call: "POST /fafsa/campaigns/${camp}/activate", as: CampaignAdmin }
            - { call: "POST /fafsa/schools", as: CampaignAdmin, payload: { campaign_id: "${camp}", name: "North HS", district_code: "D01", school_code: "SC01" }, captures: { sch: $.data.id } }
            - { call: "POST /fafsa/schools/${sch}/enroll", as: CampaignAdmin }
            - { call: "POST /fafsa/events", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", title: "E1", start_time: "2026-09-10T10:00:00Z", end_time: "2026-09-10T12:00:00Z", capacity: 10, cost_estimate_cents: 1000, required_expert_count: 0, supported_languages: [] }, captures: { ev1: $.data.id } }
            - { call: "POST /fafsa/events", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", title: "E2", start_time: "2026-09-10T12:00:00Z", end_time: "2026-09-10T14:00:00Z", capacity: 10, cost_estimate_cents: 1000, required_expert_count: 0, supported_languages: [] }, captures: { ev2: $.data.id } }
            - { call: "POST /fafsa/events", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", title: "E3", start_time: "2026-09-10T11:00:00Z", end_time: "2026-09-10T13:00:00Z", capacity: 10, cost_estimate_cents: 1000, required_expert_count: 0, supported_languages: [] }, captures: { ev3: $.data.id } }
            - { call: "POST /fafsa/staff-profiles", as: CampaignAdmin, payload: { campaign_id: "${camp}", full_name: "Vol Vic", capabilities: ["EVENT_STAFF"], languages: ["en"] }, captures: { st: $.data.id } }
            - { call: "POST /fafsa/staff-profiles/${st}/background-check", as: CampaignAdmin, payload: { result: "CLEARED" } }
            - { call: "POST /fafsa/staff-assignments", as: SchoolCoordinator, as_user_id: "${sch}", payload: { event_id: "${ev1}", staff_profile_id: "${st}", assigned_role: "VOLUNTEER" }, captures: { a1: $.data.id } }
            - { call: "POST /fafsa/staff-assignments", as: SchoolCoordinator, as_user_id: "${sch}", payload: { event_id: "${ev2}", staff_profile_id: "${st}", assigned_role: "VOLUNTEER" }, captures: { a2: $.data.id } }
            - { call: "POST /fafsa/staff-assignments", as: SchoolCoordinator, as_user_id: "${sch}", payload: { event_id: "${ev3}", staff_profile_id: "${st}", assigned_role: "VOLUNTEER" }, captures: { a3: $.data.id } }
            - { call: "POST /fafsa/staff-assignments/${a1}/accept", as: StaffMember, as_user_id: "${st}" }
            - { call: "POST /fafsa/staff-assignments/${a2}/accept", as: StaffMember, as_user_id: "${st}" }
            - { call: "POST /fafsa/staff-assignments/${a3}/accept", as: StaffMember, as_user_id: "${st}" }
          trigger:
            - { call: "POST /fafsa/staff-assignments/${a1}/confirm", as: SchoolCoordinator, as_user_id: "${sch}" }
            - { call: "POST /fafsa/staff-assignments/${a2}/confirm", as: SchoolCoordinator, as_user_id: "${sch}", captures: { a2_st: $.data.status } }
            - { call: "POST /fafsa/staff-assignments/${a3}/confirm", as: SchoolCoordinator, as_user_id: "${sch}", captures: { err: $.data.error_id } }
            - { call: "GET /fafsa/staff-profiles/${st}", as: CampaignAdmin, captures: { hrs: $.data.confirmed_hours_total } }
          assert:
            - "A2 confirm succeeds (status CONFIRMED): E2 starts exactly when E1 ends — half-open adjacency allowed"
            - "A3 confirm: error_id == ERR_STAFF_DOUBLE_BOOKED (E3 11:00-13:00 overlaps both confirmed windows)"
            - "StaffProfile.${st}.confirmed_hours_total == 4.0 (2h + 2h; the rejected confirm added nothing)"

      - name: school_venue_thirty_minute_buffer
        grounds:
          - calculations.overlap_checks
          - errors[ERR_EVENT_OVERLAP_BUFFER]
        distinguishing_aspect: |
          Resource School with BUFFERED interval semantics: publishing an event
          whose window starts 15 minutes after another PUBLISHED event ends is
          rejected (gap < 30-minute buffer), while exactly 30 minutes is allowed.
          Different resource (School vs StaffProfile) and different semantics
          (buffered, adjacency forbidden) from the double-booking rule.
        test_recipe:
          setup:
            - "Campaign OPEN; school ENROLLED; E1 PUBLISHED 10:00-12:00 (staffing trivial)"
            - "E2 12:15-13:00 and E3 12:30-13:30 both in DRAFT"
          setup_api_calls:
            - { call: "POST /fafsa/campaigns", as: CampaignAdmin, payload: { name: "C27", academic_year: "2027-2028", state_grant_deadline: "2027-04-15T00:00:00Z", federal_deadline: "2028-06-30T00:00:00Z", total_budget_cents: 100000 }, captures: { camp: $.data.id } }
            - { call: "POST /fafsa/campaigns/${camp}/activate", as: CampaignAdmin }
            - { call: "POST /fafsa/schools", as: CampaignAdmin, payload: { campaign_id: "${camp}", name: "North HS", district_code: "D01", school_code: "SC01" }, captures: { sch: $.data.id } }
            - { call: "POST /fafsa/schools/${sch}/enroll", as: CampaignAdmin }
            - { call: "POST /fafsa/events", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", title: "E1", start_time: "2026-09-10T10:00:00Z", end_time: "2026-09-10T12:00:00Z", capacity: 10, cost_estimate_cents: 1000, required_expert_count: 0, supported_languages: [] }, captures: { ev1: $.data.id } }
            - { call: "POST /fafsa/events/${ev1}/publish", as: SchoolCoordinator, as_user_id: "${sch}" }
            - { call: "POST /fafsa/events", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", title: "E2", start_time: "2026-09-10T12:15:00Z", end_time: "2026-09-10T13:00:00Z", capacity: 10, cost_estimate_cents: 1000, required_expert_count: 0, supported_languages: [] }, captures: { ev2: $.data.id } }
            - { call: "POST /fafsa/events", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", title: "E3", start_time: "2026-09-10T12:30:00Z", end_time: "2026-09-10T13:30:00Z", capacity: 10, cost_estimate_cents: 1000, required_expert_count: 0, supported_languages: [] }, captures: { ev3: $.data.id } }
          trigger:
            - { call: "POST /fafsa/events/${ev2}/publish", as: SchoolCoordinator, as_user_id: "${sch}", captures: { err: $.data.error_id } }
            - { call: "POST /fafsa/events/${ev3}/publish", as: SchoolCoordinator, as_user_id: "${sch}", captures: { ev3_st: $.data.status } }
          assert:
            - "E2 publish: error_id == ERR_EVENT_OVERLAP_BUFFER (HTTP 409) — 15-minute gap < 30-minute buffer"
            - "E3 publish succeeds (status PUBLISHED) — gap exactly 30 minutes satisfies the >= 30 rule"

  - rule_id: compensating_invariant
    instances:
      - name: budget_commit_cancel_roundtrip
        grounds:
          - calculations.budget_ledger
          - entities.Campaign.fields.committed_budget_cents
          - entities.Campaign.fields.budget_balance_cents
        distinguishing_aspect: |
          Conserved quantity: BUDGET CENTS. Forward action (publish E1 commits
          30000) paired with its compensating action (cancel E1 releases it)
          returns committed_budget_cents and budget_balance_cents to their exact
          pre-publish values while a second event's commitment is unaffected.
        test_recipe:
          setup:
            - "Campaign OPEN, total_budget_cents 100000; school ENROLLED; E1 cost 30000, E2 cost 15000 (both DRAFT, staffing trivial)"
          setup_api_calls:
            - { call: "POST /fafsa/campaigns", as: CampaignAdmin, payload: { name: "C27", academic_year: "2027-2028", state_grant_deadline: "2027-04-15T00:00:00Z", federal_deadline: "2028-06-30T00:00:00Z", total_budget_cents: 100000 }, captures: { camp: $.data.id } }
            - { call: "POST /fafsa/campaigns/${camp}/activate", as: CampaignAdmin }
            - { call: "POST /fafsa/schools", as: CampaignAdmin, payload: { campaign_id: "${camp}", name: "North HS", district_code: "D01", school_code: "SC01" }, captures: { sch: $.data.id } }
            - { call: "POST /fafsa/schools/${sch}/enroll", as: CampaignAdmin }
            - { call: "POST /fafsa/events", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", title: "E1", start_time: "2026-09-10T10:00:00Z", end_time: "2026-09-10T12:00:00Z", capacity: 10, cost_estimate_cents: 30000, required_expert_count: 0, supported_languages: [] }, captures: { ev1: $.data.id } }
            - { call: "POST /fafsa/events", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", title: "E2", start_time: "2026-09-11T10:00:00Z", end_time: "2026-09-11T12:00:00Z", capacity: 10, cost_estimate_cents: 15000, required_expert_count: 0, supported_languages: [] }, captures: { ev2: $.data.id } }
          trigger:
            - { call: "POST /fafsa/events/${ev1}/publish", as: SchoolCoordinator, as_user_id: "${sch}" }
            - { call: "POST /fafsa/events/${ev2}/publish", as: SchoolCoordinator, as_user_id: "${sch}" }
            - { call: "GET /fafsa/campaigns/${camp}", as: CampaignAdmin, captures: { committed_peak: $.data.committed_budget_cents, balance_peak: $.data.budget_balance_cents } }
            - { call: "POST /fafsa/events/${ev1}/cancel", as: SchoolCoordinator, as_user_id: "${sch}" }
            - { call: "GET /fafsa/campaigns/${camp}", as: CampaignAdmin, captures: { committed_end: $.data.committed_budget_cents, balance_end: $.data.budget_balance_cents } }
          assert:
            - "After both publishes: committed_budget_cents == 45000 and budget_balance_cents == 55000"
            - "After E1 cancel: committed_budget_cents == 15000 (exactly E2's cost — the publish/cancel pair left zero net drift) and budget_balance_cents == 85000"
            - "Invariant holds: committed == sum(cost_estimate over events in {PUBLISHED, IN_PROGRESS}) == 15000"

      - name: staff_hours_confirm_cancel_roundtrip
        grounds:
          - calculations.staff_hours_accrual
          - entities.StaffProfile.fields.confirmed_hours_total
        distinguishing_aspect: |
          Conserved quantity: STAFF HOURS (a different quantity type from budget
          cents). Confirm accrues 3.0 hours; cancelling the same assignment
          releases exactly 3.0 — the round trip returns confirmed_hours_total
          to its pre-confirm value with no residue.
        test_recipe:
          setup:
            - "Campaign OPEN; school ENROLLED; event 10:00-13:00 (3.0h); staff EVENT_STAFF background CLEARED; assignment INVITED then ACCEPTED"
          setup_api_calls:
            - { call: "POST /fafsa/campaigns", as: CampaignAdmin, payload: { name: "C27", academic_year: "2027-2028", state_grant_deadline: "2027-04-15T00:00:00Z", federal_deadline: "2028-06-30T00:00:00Z", total_budget_cents: 100000 }, captures: { camp: $.data.id } }
            - { call: "POST /fafsa/campaigns/${camp}/activate", as: CampaignAdmin }
            - { call: "POST /fafsa/schools", as: CampaignAdmin, payload: { campaign_id: "${camp}", name: "North HS", district_code: "D01", school_code: "SC01" }, captures: { sch: $.data.id } }
            - { call: "POST /fafsa/schools/${sch}/enroll", as: CampaignAdmin }
            - { call: "POST /fafsa/events", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", title: "E1", start_time: "2026-09-10T10:00:00Z", end_time: "2026-09-10T13:00:00Z", capacity: 10, cost_estimate_cents: 1000, required_expert_count: 0, supported_languages: [] }, captures: { ev: $.data.id } }
            - { call: "POST /fafsa/staff-profiles", as: CampaignAdmin, payload: { campaign_id: "${camp}", full_name: "Vol Vic", capabilities: ["EVENT_STAFF"], languages: ["en"] }, captures: { st: $.data.id } }
            - { call: "POST /fafsa/staff-profiles/${st}/background-check", as: CampaignAdmin, payload: { result: "CLEARED" } }
            - { call: "POST /fafsa/staff-assignments", as: SchoolCoordinator, as_user_id: "${sch}", payload: { event_id: "${ev}", staff_profile_id: "${st}", assigned_role: "VOLUNTEER" }, captures: { asg: $.data.id } }
            - { call: "POST /fafsa/staff-assignments/${asg}/accept", as: StaffMember, as_user_id: "${st}" }
          trigger:
            - { call: "GET /fafsa/staff-profiles/${st}", as: CampaignAdmin, captures: { hrs0: $.data.confirmed_hours_total } }
            - { call: "POST /fafsa/staff-assignments/${asg}/confirm", as: SchoolCoordinator, as_user_id: "${sch}" }
            - { call: "GET /fafsa/staff-profiles/${st}", as: CampaignAdmin, captures: { hrs1: $.data.confirmed_hours_total } }
            - { call: "POST /fafsa/staff-assignments/${asg}/cancel", as: SchoolCoordinator, as_user_id: "${sch}" }
            - { call: "GET /fafsa/staff-profiles/${st}", as: CampaignAdmin, captures: { hrs2: $.data.confirmed_hours_total } }
          assert:
            - "confirmed_hours_total: 0.0 before, 3.0 after confirm, 0.0 after cancel — exact round trip"
            - "Invariant: confirmed_hours_total == sum(duration_hours over assignments in {CONFIRMED, CHECKED_IN}) == 0 after cancel"

      - name: caseload_pause_resume_roundtrip
        grounds:
          - calculations.caseload_invariant
          - state_machines.SupportCase
          - state_machines.ConsentRecord
          - entities.StaffProfile.fields.active_case_count
        distinguishing_aspect: |
          Conserved quantity: CASE COUNT (integer occupancy, different from
          money and hours). Consent revoke pauses the case (count 1 -> 0) and
          regrant resumes it to its preserved previous_status (count 0 -> 1):
          the revoke/regrant pair leaves active_case_count and the case's
          working state exactly as before.
        test_recipe:
          setup:
            - "Campaign OPEN; school ENROLLED; specialist (CASE_SPECIALIST, [en])"
            - "Senior AUTO_CONFIRMED-matched to VERIFICATION_SELECTED aid record -> auto-case OPEN assigned to specialist; consent scopes include STATUS_DETAIL (granted BEFORE the link so the case is not born PAUSED)"
            - "Case moved OPEN -> IN_REVIEW before the revoke"
          setup_api_calls:
            - { call: "POST /fafsa/campaigns", as: CampaignAdmin, payload: { name: "C27", academic_year: "2027-2028", state_grant_deadline: "2027-04-15T00:00:00Z", federal_deadline: "2028-06-30T00:00:00Z", total_budget_cents: 100000 }, captures: { camp: $.data.id } }
            - { call: "POST /fafsa/campaigns/${camp}/activate", as: CampaignAdmin }
            - { call: "POST /fafsa/schools", as: CampaignAdmin, payload: { campaign_id: "${camp}", name: "North HS", district_code: "D01", school_code: "SC01" }, captures: { sch: $.data.id } }
            - { call: "POST /fafsa/schools/${sch}/enroll", as: CampaignAdmin }
            - { call: "POST /fafsa/staff-profiles", as: CampaignAdmin, payload: { campaign_id: "${camp}", full_name: "Spec Sal", capabilities: ["CASE_SPECIALIST"], languages: ["en"] }, captures: { spec: $.data.id } }
            - { call: "POST /fafsa/senior-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", student_ref: "S1", full_name: "Ana Lee", dob: "2009-03-04", home_language: "en" }, captures: { sr: $.data.id, sr_v: $.data.version } }
            - { call: "POST /fafsa/consent-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { senior_record_id: "${sr}", scopes: ["STATUS_DETAIL"], granted_by: "PARENT" }, captures: { cons: $.data.id } }
            - { call: "POST /fafsa/aid-records", as: DataImporter, payload: { campaign_id: "${camp}", external_ref: "EXT1", full_name: "Ana Lee", dob: "2009-03-04", school_code: "SC01", district_code: "D01", initial_status: "VERIFICATION_SELECTED", effective_date: "2027-01-10" }, captures: { ar: $.data.id } }
            - { call: "POST /fafsa/match-links", as: MatchReviewer, payload: { senior_record_id: "${sr}", aid_record_id: "${ar}", expected_senior_record_version: "${sr_v}" } }
            - { call: "GET /fafsa/support-cases?senior_record_id=${sr}", as: CampaignAdmin, captures: { cs: "$.data[0].id" } }
            - { call: "POST /fafsa/support-cases/${cs}/accept", as: Specialist, as_user_id: "${spec}" }
          trigger:
            - { call: "GET /fafsa/staff-profiles/${spec}", as: CampaignAdmin, captures: { cnt0: $.data.active_case_count } }
            - { call: "POST /fafsa/consent-records/${cons}/revoke", as: SchoolCoordinator, as_user_id: "${sch}" }
            - { call: "GET /fafsa/support-cases/${cs}", as: CampaignAdmin, captures: { cs_st1: $.data.status, cs_prev: $.data.previous_status } }
            - { call: "GET /fafsa/staff-profiles/${spec}", as: CampaignAdmin, captures: { cnt1: $.data.active_case_count } }
            - { call: "POST /fafsa/consent-records/${cons}/regrant", as: SchoolCoordinator, as_user_id: "${sch}" }
            - { call: "GET /fafsa/support-cases/${cs}", as: CampaignAdmin, captures: { cs_st2: $.data.status, cs_prev2: $.data.previous_status } }
            - { call: "GET /fafsa/staff-profiles/${spec}", as: CampaignAdmin, captures: { cnt2: $.data.active_case_count } }
          assert:
            - "active_case_count: 1 before revoke, 0 while PAUSED, 1 after regrant — exact round trip"
            - "Case while paused: status == PAUSED with previous_status == IN_REVIEW"
            - "Case after regrant: status == IN_REVIEW (restored), previous_status == null"
            - "Invariant: active_case_count == count(cases assigned with status in {OPEN, IN_REVIEW, AWAITING_FAMILY, ESCALATED})"
