  - section: rbac
    instances:

      - name: missing_or_unknown_auth_headers_returns_unauthenticated
        claim_type: unauthenticated
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority=10]
        distinguishing_aspect: |
          P10 runs before everything else: a call with no headers and a call whose
          X-User-Role names a role outside the declared six both return
          ERR_UNAUTHENTICATED (401), not ERR_UNAUTHORIZED (403) and not
          ERR_CYCLE_NOT_FOUND — even though the same request with valid headers
          reads the cycle successfully.
        test_recipe:
          setup:
            - "CornerMain cycle OPEN"
          setup_api_calls:
            - *n_clock
            - *n_cycle
            - *n_disc
            - *n_open
          trigger:
            # sent with neither X-User-ID nor X-User-Role
            - { call: "GET /grants/cycles/${cyc}", payload: {} }
            # X-User-Role names a role outside the six declared in §1.7
            - { call: "GET /grants/cycles/${cyc}", payload: {}, as: ExternalAuditor, as_user_id: "auditor-1" }
            # X-User-Role present but X-User-ID empty
            - { call: "GET /grants/cycles/${cyc}", payload: {}, as: ProgramOfficer, as_user_id: "" }
            - { call: "GET /grants/cycles/${cyc}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
          assert:
            - "All three malformed calls return 401 ERR_UNAUTHENTICATED"
            - "The well-formed call returns 200 with the cycle's status \"OPEN\" and available_cents 5700000"

      - name: a_role_cannot_invoke_another_roles_exclusive_operation
        claim_type: unauthorized
        grounds:
          - errors[ERR_UNAUTHORIZED]
          - roles[*].exclusive_operations
        distinguishing_aspect: |
          Four cross-role calls, each authenticated and each aimed at an endpoint
          that exists and whose target row exists: the P20 check must reject all
          four with ERR_UNAUTHORIZED before any state or fiscal evaluation. The
          fifth call shows the entity-backed identity rule — role Artist with an
          X-User-ID that is not an Artist row is also ERR_UNAUTHORIZED, not
          ERR_ARTIST_NOT_FOUND.
