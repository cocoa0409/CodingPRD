              as: PlatformAdmin
              captures: { p1_id: $.data.id }
            - call: "GET /sites/${s_id}"
              as: PlatformAdmin
              captures: { s_v2: $.data.version }
          trigger:
            - call: "POST /pricing-policies"
              payload: { site_id: "${s_id}", expected_site_version: "${s_v2}", swap_price_cents: 2599, core_deposit_cents: 3500, tax_rate_bps: 825, refill_tier1_cents_per_lb: 349, refill_tier1_max_lbs: 15.00, refill_tier2_cents_per_lb: 299, effective_from: "2026-05-10" }
              as: PlatformAdmin
              captures: { p2_id: $.data.id, p2_cur: $.data.is_current }
            - call: "GET /sites/${s_id}"
