            - "CleaningJob.${job_b}.billing_status == UNBILLED"

      - name: invariant_reserved_slot_count_conserved_on_book_then_cancel
        grounds:
          - state_machines.CleaningJob.QUOTED_to_BOOKED
          - state_machines.CleaningJob.BOOKED_to_CANCELLED
          - state_machines.ScheduledSlot.RESERVED_to_RELEASED
          - entities.ScheduledSlot.fields.status
        distinguishing_aspect: |
          Conserved quantity = count of RESERVED ScheduledSlot on a crew (a
          cardinality, not a monetary sum). Forward action book adds one
          RESERVED slot (count 0->1); compensating action cancel releases it
          (count 1->0). The crew ends with zero RESERVED slots — the count
          returns to its pre-book value.
        test_recipe:
          setup:
            - "Crew Rig-CN starts with zero slots; a QUOTED job is BOOKED onto [600,720) (one RESERVED slot), then the job is CANCELLED"
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Slot Conserve", email: "sc@x.com" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /service-catalogs"
              payload: { service_type: "STEAM", base_rate_cents_per_sqft: 50, stain_addon_cents: 2500, pet_addon_cents: 1800, protectant_cents_per_sqft: 12, move_furniture_flat_cents: 3000, dry_time_minutes: 240 }
              as: ServiceManager
              captures: { cat_id: $.data.id }
            - call: "POST /crews"
              payload: { crew_name: "Rig-CN", supported_service_type: "STEAM", turnaround_buffer_minutes: 30 }
              as: Dispatcher
              captures: { crew_id: $.data.id, crew_v: $.data.version }
            - call: "POST /cleaning-jobs"
              payload: { customer_id: "${cust_id}", service_catalog_id: "${cat_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_id: $.data.id }
            - call: "POST /cleaning-jobs/${job_id}/rooms"
              payload: { area_label: "Rm", area_sqft: 100, soiling_level: "LIGHT" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /cleaning-jobs/${job_id}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /cleaning-jobs/${job_id}/book"
              payload: { crew_id: "${crew_id}", start_minute: 600, end_minute: 720, expected_crew_version: "${crew_v}" }
              as: Dispatcher
              captures: { slot_id: $.data.scheduled_slot_id }
          trigger:
            - call: "POST /cleaning-jobs/${job_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "ScheduledSlot.${slot_id}.status == RELEASED"
            - "CleaningJob.${job_id}.lifecycle_status == CANCELLED"
            - "CleaningJob.${job_id}.scheduled_slot_id == null"
            - "GET /crews/${crew_id}/scheduled-slots?status=RESERVED returns 0 rows"
