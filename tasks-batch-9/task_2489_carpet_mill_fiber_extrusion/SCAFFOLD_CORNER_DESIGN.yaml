              as: MillPlanner
          assert:
            - "the discontinue returns HTTP 200 with CarpetStyle.${st}.status == RUNOUT"
            - "immediately after the discontinue, CutOrder.${co}.status == SUBMITTED (a RUNNING_LINE order is not cascade-cancelled)"
            - "the cancel returns HTTP 200 with CutOrder.${co}.status == CANCELLED and CutOrder.${co}.reserved_credit_cents == 0"
