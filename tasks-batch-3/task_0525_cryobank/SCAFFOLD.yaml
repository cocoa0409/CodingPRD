# =============================================================================
# Cryobank & Donor Gamete Bank — seed tables (v1) — EXPERT
# =============================================================================

scenario: |
  525. Cryobank & Donor Gamete Bank (California Cryobank style): donor application & screening (FDA/genetic), specimen collection & cryo-inventory, donor catalog & matching/family-limit, vial reservation & LN2-dewar shipment, recipient consent & quarantine release, storage billing & renewal, sibling registry, regulatory reporting

domain_name: cryobank
api_prefix: ""

# -----------------------------------------------------------------------------
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# -----------------------------------------------------------------------------
# complexity_profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency        # vial reservation supersede on DonorInventory.version
    - cascading_side_effects        # donor deferral -> quarantine hold -> reservation void -> shipment cancel
    - dual_variant_calculation      # storage bill: prorated-on-renewal vs full-period-on-lapse
    - rate_threshold_triggers       # family-limit birth-count breakpoint gates catalog listing & reservation

  entity_topology: flat             # peer entities linked by FK; reservations/shipments/consents reference donors & inventory
  state_machine_shape: branching    # application approve/defer fork; consent branch; quarantine release fork-join
  relationship_patterns:
    - one_to_many                   # Donor -> Specimen -> DonorInventory; Recipient -> VialReservation
    - many_to_many                  # SiblingRegistryEntry links Recipient families under a Donor
    - cross_aggregate               # VialReservation crosses Recipient + DonorInventory + Donor

  role_model: peer_roles            # ScreeningOfficer / LabTech / CatalogManager / Recipient / ComplianceOfficer / BillingClerk
  consistency_model: immediate

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Donor
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: display_code, type: string, source: input, description: "Public catalog code, e.g. 'D-14829'" }
      - { name: full_name, type: string, source: input, description: "Legal name (never exposed in catalog)" }
      - { name: donor_type, type: enum, source: input, description: "SPERM | OOCYTE" }
      - { name: blood_type, type: enum, source: input, description: "A_POS|A_NEG|B_POS|B_NEG|AB_POS|AB_NEG|O_POS|O_NEG" }
      - { name: fda_eligible, type: boolean, source: input, default: false, description: "FDA 21 CFR 1271 donor-eligibility determination recorded at screening approval" }
      - { name: genetic_panel_clear, type: boolean, source: input, default: false, description: "True when carrier-screening panel returned no disqualifying variant" }
      - { name: family_limit, type: integer, source: input, description: "Max number of distinct recipient families permitted (positive integer)" }
      - { name: reported_family_count, type: integer, source: computed, default: 0, description: "Count of distinct recipient families with a CONFIRMED live birth reported in SiblingRegistry for this donor" }
      - { name: status, type: enum, source: system, description: "APPLICANT -> SCREENING -> APPROVED -> (ACTIVE) / DEFERRED / RETIRED; ACTIVE is entered on first specimen release-to-catalog" }
      - { name: is_family_limit_reached, type: boolean, source: computed, default: false, description: "True when reported_family_count >= family_limit" }

  - name: ScreeningApplication
    parent: null
    common_fields: true
    fields:
      - { name: donor_id, type: string, source: input, description: "FK -> Donor.id" }
      - { name: fda_risk_flag, type: boolean, source: input, default: false, description: "True if donor questionnaire flagged an FDA ineligibility risk" }
      - { name: genetic_carrier_count, type: integer, source: input, description: "Number of pathogenic carrier variants found in panel (>=0)" }
      - { name: partner_screening_required, type: boolean, source: input, default: false, description: "True when genetic_carrier_count > 0 and disposition requires partner testing" }
      - { name: decision_note, type: string, source: input, required: false, description: "Officer note recorded at approve/defer" }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> UNDER_REVIEW -> APPROVED / DEFERRED; DEFERRED is terminal" }

  - name: Specimen
    parent: null
    common_fields: true
    fields:
      - { name: donor_id, type: string, source: input, description: "FK -> Donor.id" }
      - { name: collection_date, type: datetime, source: input, description: "ISO 8601 date the ejaculate/retrieval was collected" }
      - { name: initial_vial_count, type: integer, source: input, description: "Vials cryopreserved from this collection (positive integer)" }
      - { name: quarantine_release_date, type: datetime, source: input, description: "Earliest UTC instant the 180-day FDA quarantine may be released" }
      - { name: retest_negative, type: boolean, source: input, default: false, description: "True when the 180-day repeat infectious-disease retest is negative" }
      - { name: status, type: enum, source: system, description: "COLLECTED -> QUARANTINE -> RELEASED / DISCARDED; RELEASED enables catalog listing" }

  - name: DonorInventory
    parent: null
    common_fields: true
    fields:
      - { name: specimen_id, type: string, source: input, description: "FK -> Specimen.id" }
      - { name: donor_id, type: string, source: system, description: "FK -> Donor.id" }
      - { name: dewar_code, type: string, source: input, description: "LN2 dewar / tank storage location code" }
      - { name: total_vials, type: integer, source: computed, description: "= Specimen.initial_vial_count for this specimen's single inventory lot" }
      - { name: reserved_vials, type: integer, source: computed, default: 0, description: "Sum of vial_count over VialReservation in state {HELD, CONFIRMED} for this inventory" }
      - { name: shipped_vials, type: integer, source: computed, default: 0, description: "Sum of vial_count over VialReservation in state SHIPPED for this inventory" }
      - { name: available_vials, type: integer, source: computed, description: "= total_vials - reserved_vials - shipped_vials (booking/pessimistic view: HELD holds consume availability)" }
      - { name: committed_available_vials, type: integer, source: computed, description: "= total_vials - (sum vial_count over {CONFIRMED, SHIPPED}) (settlement/optimistic view: HELD holds are treated as not-yet-committed and are NOT subtracted)" }
      - { name: is_listed, type: boolean, source: computed, default: false, description: "True when Specimen.status == RELEASED AND Donor.status == ACTIVE AND NOT Donor.is_family_limit_reached AND available_vials > 0" }
      - { name: hold_status, type: enum, source: computed, default: OPEN, description: "OPEN | FROZEN; FROZEN when Donor is DEFERRED — blocks all new reservations" }

  - name: Recipient
    parent: null
    common_fields: true
    fields:
      - { name: family_name, type: string, source: input, description: "Recipient family identifier" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }
      - { name: consent_on_file, type: boolean, source: computed, default: false, description: "True when a RecipientConsent for this recipient is in state SIGNED" }
      - { name: status, type: enum, source: system, description: "REGISTERED -> ACTIVE / SUSPENDED; ACTIVE on first signed consent" }

  - name: RecipientConsent
    parent: null
    common_fields: true
    fields:
      - { name: recipient_id, type: string, source: input, description: "FK -> Recipient.id" }
      - { name: donor_id, type: string, source: input, description: "FK -> Donor.id" }
      - { name: acknowledges_open_id, type: boolean, source: input, description: "Recipient acknowledges donor open-identity disclosure terms" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SIGNED / REVOKED; SIGNED required before reservation" }

  - name: VialReservation
    parent: null
    common_fields: true
    fields:
      - { name: recipient_id, type: string, source: input, description: "FK -> Recipient.id" }
      - { name: inventory_id, type: string, source: input, description: "FK -> DonorInventory.id" }
      - { name: donor_id, type: string, source: system, description: "FK -> Donor.id" }
      - { name: vial_count, type: integer, source: input, description: "Number of vials requested (positive integer)" }
      - { name: expected_inventory_version, type: integer, source: input, description: "OCC guard: DonorInventory.version the client last observed" }
      - { name: hold_expiry, type: datetime, source: computed, description: "= reservation created_at + HOLD_TTL_DAYS; a HELD reservation past this is expirable" }
      - { name: status, type: enum, source: system, description: "HELD -> CONFIRMED -> SHIPPED / (HELD|CONFIRMED)->CANCELLED / HELD->EXPIRED" }

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - { name: reservation_id, type: string, source: input, description: "FK -> VialReservation.id" }
      - { name: recipient_id, type: string, source: system, description: "FK -> Recipient.id" }
      - { name: clinic_address, type: string, source: input, description: "Destination fertility-clinic address" }
      - { name: ln2_dewar_serial, type: string, source: input, description: "Serial of the dry-shipper LN2 dewar dispatched" }
      - { name: dispatched_at, type: datetime, source: system, description: "UTC instant the shipment left the bank" }
      - { name: status, type: enum, source: system, description: "PREPARING -> DISPATCHED -> DELIVERED / CANCELLED" }

  - name: StorageAccount
    parent: null
    common_fields: true
    fields:
      - { name: recipient_id, type: string, source: input, description: "FK -> Recipient.id" }
      - { name: reservation_id, type: string, source: input, description: "FK -> VialReservation.id" }
      - { name: stored_vials, type: integer, source: input, description: "Vials held in long-term storage under this account (positive integer)" }
      - { name: period_start, type: datetime, source: system, description: "UTC start of the current billing period" }
      - { name: paid_through, type: datetime, source: computed, description: "UTC end of the period covered by the last PAID StorageInvoice" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> LAPSED / CLOSED; LAPSED when current period unpaid past grace" }

  - name: StorageInvoice
    parent: null
    common_fields: true
    fields:
      - { name: storage_account_id, type: string, source: input, description: "FK -> StorageAccount.id" }
      - { name: period_index, type: integer, source: system, description: "0-based sequential billing period this invoice covers" }
      - { name: billing_mode, type: enum, source: system, description: "RENEWAL (prorated to renewal date) | LAPSE (full period assessed at lapse)" }
      - { name: amount_cents, type: integer, source: computed, description: "Charge for this period (see 1.3 storage_bill)" }
      - { name: status, type: enum, source: system, description: "ISSUED -> PAID / VOID" }

  - name: SiblingRegistryEntry
    parent: null
    common_fields: true
    fields:
      - { name: donor_id, type: string, source: input, description: "FK -> Donor.id" }
      - { name: recipient_id, type: string, source: input, description: "FK -> Recipient.id" }
      - { name: birth_reported_date, type: datetime, source: input, description: "ISO 8601 date of the live birth being registered" }
      - { name: status, type: enum, source: system, description: "PENDING -> CONFIRMED / REJECTED; CONFIRMED counts toward family-limit" }

  - name: CollectionAppointment
    parent: null
    common_fields: true
    fields:
      - { name: donor_id, type: string, source: input, description: "FK -> Donor.id" }
      - { name: room_code, type: string, source: input, description: "Collection-room resource this appointment occupies" }
      - { name: window_start, type: datetime, source: input, description: "UTC start of the booked window (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "UTC end of the booked window (exclusive)" }
      - { name: status, type: enum, source: system, description: "BOOKED -> COMPLETED / CANCELLED" }

  - name: DewarMaintenanceWindow
    parent: null
    common_fields: true
    fields:
      - { name: dewar_code, type: string, source: input, description: "LN2 dewar/tank being serviced (matches DonorInventory.dewar_code)" }
      - { name: service_start, type: datetime, source: input, description: "UTC start of the maintenance window (inclusive)" }
      - { name: service_end, type: datetime, source: input, description: "UTC end of the maintenance window (inclusive) — a SETTLE_BUFFER_HOURS buffer is applied on BOTH ends for overlap" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> DONE / CANCELLED" }

  - name: RegulatoryReport
    parent: null
    common_fields: true
    fields:
      - { name: donor_id, type: string, source: input, description: "FK -> Donor.id" }
      - { name: report_type, type: enum, source: input, description: "ADVERSE_REACTION | FDA_ANNUAL | GENETIC_UPDATE" }
      - { name: as_of, type: datetime, source: input, description: "UTC snapshot instant the report summarizes" }
      - { name: total_families_at_report, type: integer, source: computed, description: "Snapshot of Donor.reported_family_count at as_of" }
      - { name: total_vials_shipped_at_report, type: integer, source: computed, description: "Sum of vial_count over the donor's SHIPPED reservations at as_of" }
      - { name: status, type: enum, source: system, description: "FILED (terminal)" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ScreeningApplication
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DEFERRED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /screening-applications/{id}/start-review"
        actor: ScreeningOfficer
        preconditions: ["application.status == SUBMITTED"]
        side_effects: ["set Donor.status = SCREENING (donor was APPLICANT)"]
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /screening-applications/{id}/approve"
        actor: ScreeningOfficer
        preconditions:
          - "application.status == UNDER_REVIEW"
          - "application.fda_risk_flag == false"
          - "application.genetic_carrier_count == 0 OR application.partner_screening_required == false"
        side_effects:
          - "set Donor.status = APPROVED"
          - "set Donor.fda_eligible = true"
          - "set Donor.genetic_panel_clear = (application.genetic_carrier_count == 0)"
      - from: UNDER_REVIEW
        to: DEFERRED
        trigger: "POST /screening-applications/{id}/defer"
        actor: ScreeningOfficer
        preconditions: ["application.status == UNDER_REVIEW"]
        side_effects:
          - "set Donor.status = DEFERRED"
          - "CASCADE: every Specimen of this donor not in DISCARDED -> DISCARDED (see Specimen RELEASED->DISCARDED / QUARANTINE->DISCARDED)"
          - "CASCADE: every DonorInventory of this donor sets hold_status = FROZEN"

  - entity: Specimen
    initial_state: COLLECTED
    terminal_states: [DISCARDED]
    transitions:
      - from: COLLECTED
        to: QUARANTINE
        trigger: "POST /specimens/{id}/begin-quarantine"
        actor: LabTech
        preconditions: ["specimen.status == COLLECTED", "Donor.status == APPROVED"]
        side_effects: ["create one DonorInventory lot with total_vials = specimen.initial_vial_count, available_vials = initial_vial_count, hold_status = OPEN"]
      - from: QUARANTINE
        to: RELEASED
        trigger: "POST /specimens/{id}/release-quarantine"
        actor: ComplianceOfficer
        preconditions:
          - "specimen.status == QUARANTINE"
          - "specimen.retest_negative == true"
          - "current_utc >= specimen.quarantine_release_date"
          - "Donor.status == APPROVED"
        side_effects:
          - "on first RELEASED specimen for the donor: set Donor.status = ACTIVE"
          - "recompute DonorInventory.is_listed for this specimen's inventory"
      - from: QUARANTINE
        to: DISCARDED
        trigger: "system: donor deferral cascade OR POST /specimens/{id}/discard"
        actor: system
        preconditions: ["specimen.status == QUARANTINE"]
        side_effects: ["void every VialReservation in {HELD, CONFIRMED} on this specimen's inventory (-> CANCELLED); recompute inventory counts"]
      - from: RELEASED
        to: DISCARDED
        trigger: "system: donor deferral cascade OR POST /specimens/{id}/discard"
        actor: system
        preconditions: ["specimen.status == RELEASED"]
        side_effects:
          - "CASCADE: void every VialReservation in {HELD, CONFIRMED} on this specimen's inventory -> CANCELLED"
          - "CASCADE: each just-cancelled reservation with a Shipment in {PREPARING, DISPATCHED} sets that Shipment -> CANCELLED"
          - "recompute DonorInventory counts and is_listed"

  - entity: RecipientConsent
    initial_state: DRAFT
    terminal_states: [REVOKED]
    transitions:
      - from: DRAFT
        to: SIGNED
        trigger: "POST /recipient-consents/{id}/sign"
        actor: Recipient
        preconditions: ["consent.status == DRAFT", "consent.acknowledges_open_id == true", "Donor.status IN {APPROVED, ACTIVE}"]
        side_effects: ["set Recipient.consent_on_file = true", "on first signed consent set Recipient.status = ACTIVE"]
      - from: SIGNED
        to: REVOKED
        trigger: "POST /recipient-consents/{id}/revoke"
        actor: Recipient
        preconditions: ["consent.status == SIGNED", "no VialReservation of this recipient+donor in {HELD, CONFIRMED, SHIPPED}"]
        side_effects: ["recompute Recipient.consent_on_file (false if no other SIGNED consent remains)"]

  - entity: VialReservation
    initial_state: HELD
    terminal_states: [SHIPPED, CANCELLED, EXPIRED]
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "POST /vial-reservations/{id}/confirm"
        actor: CatalogManager
        preconditions:
          - "reservation.status == HELD"
          - "current_utc < reservation.hold_expiry"
          - "DonorInventory.hold_status == OPEN"
        side_effects: ["reservation counted in DonorInventory.reserved_vials still (no count change); StorageAccount not yet created"]
      - from: CONFIRMED
        to: SHIPPED
        trigger: "POST /shipments (creates Shipment, DISPATCHED) then POST /shipments/{id}/dispatch"
        actor: LabTech
        preconditions: ["reservation.status == CONFIRMED", "linked Shipment.status == DISPATCHED", "DonorInventory.hold_status == OPEN"]
        side_effects:
          - "move vial_count from DonorInventory.reserved_vials to shipped_vials (available unchanged)"
          - "create StorageAccount (ACTIVE, stored_vials = vial_count, period_start = current_utc)"
          - "issue StorageInvoice period_index=0 (billing_mode RENEWAL for a full first period)"
      - from: HELD
        to: CANCELLED
        trigger: "POST /vial-reservations/{id}/cancel OR system cascade"
        actor: CatalogManager
        preconditions: ["reservation.status == HELD"]
        side_effects: ["subtract vial_count from DonorInventory.reserved_vials; recompute available_vials and is_listed"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /vial-reservations/{id}/cancel OR system cascade"
        actor: CatalogManager
        preconditions: ["reservation.status == CONFIRMED"]
        side_effects: ["subtract vial_count from DonorInventory.reserved_vials; recompute available_vials and is_listed; if a Shipment in {PREPARING, DISPATCHED} exists it -> CANCELLED"]
      - from: HELD
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc then POST /vial-reservations/{id}/expire (sweep)"
        actor: system
        preconditions: ["reservation.status == HELD", "current_utc >= reservation.hold_expiry"]
        side_effects: ["subtract vial_count from DonorInventory.reserved_vials; recompute available_vials and is_listed"]

  - entity: Shipment
    initial_state: PREPARING
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: PREPARING
        to: DISPATCHED
        trigger: "POST /shipments/{id}/dispatch"
        actor: LabTech
        preconditions: ["shipment.status == PREPARING", "linked VialReservation.status == CONFIRMED", "DonorInventory.hold_status == OPEN"]
        side_effects: ["set dispatched_at = current_utc; drive VialReservation CONFIRMED->SHIPPED (see reservation side_effects)"]
      - from: DISPATCHED
        to: DELIVERED
        trigger: "POST /shipments/{id}/deliver"
        actor: LabTech
        preconditions: ["shipment.status == DISPATCHED"]
        side_effects: ["set VialReservation stays SHIPPED (terminal)"]
      - from: PREPARING
        to: CANCELLED
        trigger: "system cascade (specimen discard / reservation cancel)"
        actor: system
        preconditions: ["shipment.status == PREPARING"]
        side_effects: ["none beyond marking CANCELLED"]
      - from: DISPATCHED
        to: CANCELLED
        trigger: "system cascade (specimen discard)"
        actor: system
        preconditions: ["shipment.status == DISPATCHED"]
        side_effects: ["none beyond marking CANCELLED"]

  - entity: StorageAccount
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: LAPSED
        trigger: "POST /storage-accounts/{id}/assess-lapse (sweep after clock advance)"
        actor: BillingClerk
        preconditions: ["account.status == ACTIVE", "current_utc >= paid_through + GRACE_DAYS days"]
        side_effects: ["issue StorageInvoice with billing_mode = LAPSE for the full unpaid period (see 1.3 storage_bill)"]
      - from: LAPSED
        to: ACTIVE
        trigger: "POST /storage-invoices/{id}/pay (paying the lapse invoice)"
        actor: BillingClerk
        preconditions: ["account.status == LAPSED", "invoice.status == ISSUED", "invoice.billing_mode == LAPSE"]
        side_effects: ["advance paid_through by one BILLING_PERIOD_DAYS; set account.status = ACTIVE"]
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /storage-accounts/{id}/close"
        actor: BillingClerk
        preconditions: ["account.status == ACTIVE"]
        side_effects: ["void every StorageInvoice in ISSUED for this account"]

  - entity: CollectionAppointment
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: BOOKED
        to: COMPLETED
        trigger: "POST /collection-appointments/{id}/complete"
        actor: LabTech
        preconditions: ["appointment.status == BOOKED"]
        side_effects: ["none"]
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /collection-appointments/{id}/cancel"
        actor: LabTech
        preconditions: ["appointment.status == BOOKED"]
        side_effects: ["releases the room window so a later booking may overlap it"]

  - entity: DewarMaintenanceWindow
    initial_state: SCHEDULED
    terminal_states: [DONE, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: DONE
        trigger: "POST /dewar-maintenance-windows/{id}/complete"
        actor: LabTech
        preconditions: ["window.status == SCHEDULED"]
        side_effects: ["none"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /dewar-maintenance-windows/{id}/cancel"
        actor: LabTech
        preconditions: ["window.status == SCHEDULED"]
        side_effects: ["releases the dewar window so a later window may overlap it"]

  - entity: SiblingRegistryEntry
    initial_state: PENDING
    terminal_states: [CONFIRMED, REJECTED]
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /sibling-registry/{id}/confirm"
        actor: ComplianceOfficer
        preconditions:
          - "entry.status == PENDING"
          - "recipient has at least one SHIPPED VialReservation for this donor"
        side_effects:
          - "recompute Donor.reported_family_count = count of distinct recipient_id with a CONFIRMED entry for this donor"
          - "recompute Donor.is_family_limit_reached; if reached, recompute is_listed=false on every DonorInventory of the donor"
      - from: PENDING
        to: REJECTED
        trigger: "POST /sibling-registry/{id}/reject"
        actor: ComplianceOfficer
        preconditions: ["entry.status == PENDING"]
        side_effects: ["none"]

# -----------------------------------------------------------------------------
# 1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: reservation-create-stale-inventory
    parent_entity: DonorInventory
    write_endpoint: "POST /vial-reservations"
    occ_field: "expected_inventory_version"
    description: |
      Creating a VialReservation against a DonorInventory whose version has
      advanced since the client last read it is rejected on stale version.
      Another writer may have just placed a hold that legitimately consumed
      the available_vials the current writer believed were free, so the
      current writer's view of the inventory (and its available_vials) is
      stale and must be re-fetched before retrying.
    error_id: ERR_STALE_INVENTORY_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: storage_bill
    trigger: "StorageInvoice issuance: at CONFIRMED->SHIPPED (period 0), at renewal payment, and at ACTIVE->LAPSED"
    algorithm: dual_variant
    formula: |
      base = stored_vials * ANNUAL_RATE_CENTS_PER_VIAL      # per full BILLING_PERIOD_DAYS
      RENEWAL variant (prorated to the renewal instant):
        elapsed_days   = floor((renewal_utc - period_start_utc) / 1 day)
        remaining_days = BILLING_PERIOD_DAYS - elapsed_days     # days left in the period being renewed early
        amount = round_half_up( base * remaining_days / BILLING_PERIOD_DAYS )   # cents, integer
        (period_index 0 first invoice is a special RENEWAL case with remaining_days = BILLING_PERIOD_DAYS => amount = base)
      LAPSE variant (full period assessed, no proration):
        amount = base
    input_set: "stored_vials from the StorageAccount; period boundaries from period_start / paid_through"
    constants:
      ANNUAL_RATE_CENTS_PER_VIAL: 42000     # $420.00 per vial per full period
      BILLING_PERIOD_DAYS: 365
      GRACE_DAYS: 30
    precision: "integer cents, round_half_up"
    variants:
      - name: RENEWAL
        when: "invoice issued at first ship (full period) or at an early renewal before period end"
        difference: "amount prorated by remaining_days/BILLING_PERIOD_DAYS; identical data as LAPSE yields a SMALLER amount whenever elapsed_days > 0"
      - name: LAPSE
        when: "invoice issued when the account crosses ACTIVE->LAPSED past grace"
        difference: "full base charged regardless of elapsed_days; no proration"

  - name: family_limit_gate
    trigger: "on SiblingRegistryEntry PENDING->CONFIRMED and on any VialReservation create/confirm eligibility check"
    algorithm: threshold
    formula: |
      reported_family_count = count( distinct recipient_id
                                      where SiblingRegistryEntry.donor_id == donor.id
                                        and SiblingRegistryEntry.status == CONFIRMED )
      is_family_limit_reached = (reported_family_count >= donor.family_limit)     # NOTE: >= not >
      # gate: a new HELD reservation is refused when is_family_limit_reached is true at create time
    input_set: "distinct CONFIRMED recipient families for the donor; excludes PENDING and REJECTED entries"
    constants: {}
    precision: "integer counts"
    variants: []

  - name: inventory_availability
    trigger: "recomputed on every reservation create/confirm/cancel/expire, shipment dispatch, and specimen discard"
    algorithm: aggregation
    formula: |
      reserved_vials  = sum( vial_count for VialReservation in {HELD, CONFIRMED} on this inventory )
      shipped_vials   = sum( vial_count for VialReservation in {SHIPPED} on this inventory )
      available_vials           = total_vials - reserved_vials - shipped_vials          # BOOKING (pessimistic): HELD counts against availability
      committed_available_vials = total_vials - sum(vial_count for {CONFIRMED, SHIPPED}) # SETTLEMENT (optimistic): HELD excluded
      is_listed       = ( Specimen.status == RELEASED
                          and Donor.status == ACTIVE
                          and not Donor.is_family_limit_reached
                          and hold_status == OPEN
                          and available_vials > 0 )
    input_set: "VialReservation rows for this inventory filtered by status; total_vials fixed from the specimen lot"
    constants: {}
    precision: "integer vials"
    variants:
      - name: BOOKING
        when: "available_vials — used by the create-reservation capacity guard (ERR_INSUFFICIENT_VIALS)"
        difference: "subtracts HELD + CONFIRMED + SHIPPED; a pending HELD hold reduces what a new reservation may claim"
      - name: SETTLEMENT
        when: "committed_available_vials — reporting/analytics view of firmly-committed vials"
        difference: "subtracts only CONFIRMED + SHIPPED; identical data yields a LARGER number than BOOKING whenever any HELD hold exists"

  - name: overlap_detection
    trigger: "on CollectionAppointment create and DewarMaintenanceWindow create"
    algorithm: interval_merge
    formula: |
      ROOM (half-open, no buffer):
        conflict(a,b) := a.window_start < b.window_end AND b.window_start < a.window_end
        # touching endpoints (a.window_end == b.window_start) do NOT conflict
      DEWAR (closed, symmetric buffer of SETTLE_BUFFER_HOURS on both ends):
        conflict(a,b) := (a.service_start - buffer) <= b.service_end AND b.service_start <= (a.service_end + buffer)
        # touching or within-buffer endpoints DO conflict
    input_set: "same-room BOOKED appointments; same-dewar SCHEDULED windows"
    constants:
      SETTLE_BUFFER_HOURS: 24
    precision: "datetime comparison"
    variants: []

  - name: report_snapshot
    trigger: "on POST /regulatory-reports (report filed)"
    algorithm: aggregation
    formula: |
      total_families_at_report      = Donor.reported_family_count (value at as_of)
      total_vials_shipped_at_report = sum( vial_count for VialReservation
                                           where donor_id == donor.id and status == SHIPPED )
    input_set: "donor's SHIPPED reservations and current reported_family_count"
    constants: {}
    precision: "integer"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except pagination-only public catalog reads"

  - priority: 2
    category: auth
    check: "acting role is permitted for this operation per 1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all mutating endpoints"

  - priority: 3
    category: existence
    check: "every path/body id resolves to an existing entity, validated left-to-right in the path"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints referencing ids"

  - priority: 4
    category: state
    check: "target entity is in a state from which the requested transition is defined in 1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 5
    category: business_safety
    check: "Specimen release-quarantine requires retest_negative == true (FDA infectious-disease retest)"
    error_id: ERR_RETEST_NOT_NEGATIVE
    http_status: 422
    applies_to: "POST /specimens/{id}/release-quarantine"

  - priority: 6
    category: business_temporal
    check: "Specimen release-quarantine requires current_utc >= quarantine_release_date (180-day hold not elapsed)"
    error_id: ERR_QUARANTINE_NOT_ELAPSED
    http_status: 422
    applies_to: "POST /specimens/{id}/release-quarantine"

  - priority: 7
    category: business_safety
    check: "ScreeningApplication approve requires fda_risk_flag == false (FDA donor-eligibility)"
    error_id: ERR_FDA_INELIGIBLE
    http_status: 422
    applies_to: "POST /screening-applications/{id}/approve"

  - priority: 8
    category: business_safety
    check: "ScreeningApplication approve requires NOT (genetic_carrier_count > 0 AND partner_screening_required == true)"
    error_id: ERR_GENETIC_SCREENING_INCOMPLETE
    http_status: 422
    applies_to: "POST /screening-applications/{id}/approve"

  - priority: 9
    category: business_referential
    check: "VialReservation create requires a SIGNED RecipientConsent for (recipient_id, donor of the inventory)"
    error_id: ERR_CONSENT_MISSING
    http_status: 422
    applies_to: "POST /vial-reservations"

  - priority: 10
    category: business_constraint
    check: "VialReservation create refused when the donor's is_family_limit_reached is true"
    error_id: ERR_FAMILY_LIMIT_REACHED
    http_status: 422
    applies_to: "POST /vial-reservations"

  - priority: 11
    category: business_constraint
    check: "VialReservation create refused when DonorInventory.hold_status == FROZEN or Specimen not RELEASED or is_listed false"
    error_id: ERR_INVENTORY_NOT_LISTED
    http_status: 422
    applies_to: "POST /vial-reservations"

  - priority: 12
    category: business_fiscal
    check: "VialReservation create/confirm-driven allocation requires vial_count <= DonorInventory.available_vials"
    error_id: ERR_INSUFFICIENT_VIALS
    http_status: 422
    applies_to: "POST /vial-reservations"

  - priority: 13
    category: business_constraint
    check: "expected_inventory_version must equal current DonorInventory.version (OCC guard)"
    error_id: ERR_STALE_INVENTORY_VERSION
    http_status: 412
    applies_to: "POST /vial-reservations"

  - priority: 14
    category: business_temporal
    check: |
      CollectionAppointment create rejected when [window_start, window_end) overlaps a BOOKED
      appointment on the same room_code. Half-open semantics: touching endpoints (a.end == b.start)
      do NOT overlap. No buffer.
    error_id: ERR_ROOM_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /collection-appointments"

  - priority: 15
    category: business_temporal
    check: |
      DewarMaintenanceWindow create rejected when the requested window, expanded by SETTLE_BUFFER_HOURS
      on BOTH ends, overlaps a SCHEDULED window on the same dewar_code. Closed semantics with a symmetric
      buffer: two windows conflict when (a.service_start - buffer) <= b.service_end AND (a.service_end + buffer) >= b.service_start.
    error_id: ERR_DEWAR_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /dewar-maintenance-windows"

  - priority: 16
    category: business_constraint
    check: "positive-integer fields (initial_vial_count, vial_count, family_limit, stored_vials) must be >= 1; genetic_carrier_count >= 0; window_end > window_start"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all create endpoints"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Donor ----
  - { method: POST, path: "/donors", description: "Register a donor applicant", roles: [ScreeningOfficer], code: 201,
      input: [display_code, full_name, donor_type, blood_type, family_limit], output: Donor,
      side_effects: ["Donor created status=APPLICANT, reported_family_count=0"] }
  - { method: GET, path: "/donors/{id}", description: "Get donor", roles: [ScreeningOfficer, CatalogManager, ComplianceOfficer, Recipient, LabTech, BillingClerk], code: 200,
      input: [], output: Donor, side_effects: [] }
  - { method: GET, path: "/donors", description: "List/catalog donors (paginated); filterable", roles: [ScreeningOfficer, CatalogManager, ComplianceOfficer, Recipient, LabTech, BillingClerk], code: 200,
      input: ["status?", "donor_type?", "blood_type?", "limit?", "offset?"], output: "Donor[]", side_effects: [] }

  # ---- ScreeningApplication ----
  - { method: POST, path: "/screening-applications", description: "Submit a screening application for a donor", roles: [ScreeningOfficer], code: 201,
      input: [donor_id, fda_risk_flag, genetic_carrier_count, partner_screening_required, "decision_note?"], output: ScreeningApplication,
      side_effects: ["application created status=SUBMITTED"] }
  - { method: GET, path: "/screening-applications/{id}", description: "Get application", roles: [ScreeningOfficer, ComplianceOfficer], code: 200, input: [], output: ScreeningApplication, side_effects: [] }
  - { method: GET, path: "/screening-applications", description: "List applications; filter by donor_id", roles: [ScreeningOfficer, ComplianceOfficer], code: 200,
      input: ["donor_id?", "status?", "limit?", "offset?"], output: "ScreeningApplication[]", side_effects: [] }
  - { method: POST, path: "/screening-applications/{id}/start-review", description: "Begin review", roles: [ScreeningOfficer], code: 200,
      input: [], output: ScreeningApplication, side_effects: ["Donor.status=SCREENING"] }
  - { method: POST, path: "/screening-applications/{id}/approve", description: "Approve donor screening", roles: [ScreeningOfficer], code: 200,
      input: ["decision_note?"], output: ScreeningApplication, side_effects: ["Donor.status=APPROVED", "Donor.fda_eligible=true", "Donor.genetic_panel_clear set"] }
  - { method: POST, path: "/screening-applications/{id}/defer", description: "Defer (reject) donor screening", roles: [ScreeningOfficer], code: 200,
      input: ["decision_note?"], output: ScreeningApplication,
      side_effects: ["Donor.status=DEFERRED", "cascade: specimens DISCARDED, inventories FROZEN, reservations CANCELLED, shipments CANCELLED"] }

  # ---- Specimen ----
  - { method: POST, path: "/specimens", description: "Record a specimen collection for a donor", roles: [LabTech], code: 201,
      input: [donor_id, collection_date, initial_vial_count, quarantine_release_date, "retest_negative?"], output: Specimen,
      side_effects: ["Specimen created status=COLLECTED"] }
  - { method: GET, path: "/specimens/{id}", description: "Get specimen", roles: [LabTech, ComplianceOfficer, CatalogManager], code: 200, input: [], output: Specimen, side_effects: [] }
  - { method: GET, path: "/specimens", description: "List specimens; filter by donor_id", roles: [LabTech, ComplianceOfficer, CatalogManager], code: 200,
      input: ["donor_id?", "status?", "limit?", "offset?"], output: "Specimen[]", side_effects: [] }
  - { method: POST, path: "/specimens/{id}/begin-quarantine", description: "Move specimen to quarantine and mint inventory lot", roles: [LabTech], code: 200,
      input: [dewar_code], output: Specimen, side_effects: ["Specimen.status=QUARANTINE", "create DonorInventory lot"] }
  - { method: POST, path: "/specimens/{id}/release-quarantine", description: "Release specimen from 180-day quarantine", roles: [ComplianceOfficer], code: 200,
      input: [], output: Specimen, side_effects: ["Specimen.status=RELEASED", "Donor.status=ACTIVE on first release", "recompute is_listed"] }
  - { method: POST, path: "/specimens/{id}/discard", description: "Discard a specimen (destroys inventory)", roles: [ComplianceOfficer], code: 200,
      input: [], output: Specimen, side_effects: ["Specimen.status=DISCARDED", "cascade cancel reservations & shipments; recompute counts"] }

  # ---- DonorInventory ----
  - { method: GET, path: "/donor-inventories/{id}", description: "Get an inventory lot", roles: [CatalogManager, LabTech, ComplianceOfficer, Recipient], code: 200, input: [], output: DonorInventory, side_effects: [] }
  - { method: GET, path: "/donor-inventories", description: "List inventory lots; filter by specimen_id or donor_id", roles: [CatalogManager, LabTech, ComplianceOfficer, Recipient], code: 200,
      input: ["specimen_id?", "donor_id?", "is_listed?", "limit?", "offset?"], output: "DonorInventory[]", side_effects: [] }

  # ---- Recipient ----
  - { method: POST, path: "/recipients", description: "Register a recipient family", roles: [CatalogManager, Recipient], code: 201,
      input: [family_name, contact_email], output: Recipient, side_effects: ["Recipient created status=REGISTERED"] }
  - { method: GET, path: "/recipients/{id}", description: "Get recipient", roles: [CatalogManager, Recipient, ComplianceOfficer, BillingClerk], code: 200, input: [], output: Recipient, side_effects: [] }
  - { method: GET, path: "/recipients", description: "List recipients", roles: [CatalogManager, ComplianceOfficer, BillingClerk], code: 200,
      input: ["status?", "limit?", "offset?"], output: "Recipient[]", side_effects: [] }

  # ---- RecipientConsent ----
  - { method: POST, path: "/recipient-consents", description: "Draft a recipient consent for a donor", roles: [Recipient, CatalogManager], code: 201,
      input: [recipient_id, donor_id, acknowledges_open_id], output: RecipientConsent, side_effects: ["consent created status=DRAFT"] }
  - { method: GET, path: "/recipient-consents/{id}", description: "Get consent", roles: [Recipient, CatalogManager, ComplianceOfficer], code: 200, input: [], output: RecipientConsent, side_effects: [] }
  - { method: GET, path: "/recipient-consents", description: "List consents; filter by recipient_id or donor_id", roles: [Recipient, CatalogManager, ComplianceOfficer], code: 200,
      input: ["recipient_id?", "donor_id?", "status?", "limit?", "offset?"], output: "RecipientConsent[]", side_effects: [] }
  - { method: POST, path: "/recipient-consents/{id}/sign", description: "Recipient signs consent", roles: [Recipient], code: 200,
      input: [], output: RecipientConsent, side_effects: ["consent.status=SIGNED", "Recipient.consent_on_file=true", "Recipient.status=ACTIVE on first"] }
  - { method: POST, path: "/recipient-consents/{id}/revoke", description: "Recipient revokes consent", roles: [Recipient], code: 200,
      input: [], output: RecipientConsent, side_effects: ["consent.status=REVOKED", "recompute consent_on_file"] }

  # ---- VialReservation ----
  - { method: POST, path: "/vial-reservations", description: "Place a vial hold against an inventory lot", roles: [CatalogManager, Recipient], code: 201,
      input: [recipient_id, inventory_id, vial_count, expected_inventory_version], output: VialReservation,
      side_effects: ["reservation created status=HELD", "hold_expiry set", "increments DonorInventory.version by 1", "recompute reserved_vials/available_vials/is_listed"] }
  - { method: GET, path: "/vial-reservations/{id}", description: "Get reservation", roles: [CatalogManager, Recipient, LabTech, ComplianceOfficer, BillingClerk], code: 200, input: [], output: VialReservation, side_effects: [] }
  - { method: GET, path: "/vial-reservations", description: "List reservations; filter by recipient_id, inventory_id, donor_id", roles: [CatalogManager, Recipient, LabTech, ComplianceOfficer, BillingClerk], code: 200,
      input: ["recipient_id?", "inventory_id?", "donor_id?", "status?", "limit?", "offset?"], output: "VialReservation[]", side_effects: [] }
  - { method: POST, path: "/vial-reservations/{id}/confirm", description: "Confirm a held reservation", roles: [CatalogManager], code: 200,
      input: [], output: VialReservation, side_effects: ["reservation.status=CONFIRMED"] }
  - { method: POST, path: "/vial-reservations/{id}/cancel", description: "Cancel a held/confirmed reservation", roles: [CatalogManager, Recipient], code: 200,
      input: [], output: VialReservation, side_effects: ["reservation.status=CANCELLED", "recompute counts", "cascade cancel shipment if present"] }
  - { method: POST, path: "/vial-reservations/{id}/expire", description: "Sweep-expire a held reservation past hold_expiry", roles: [CatalogManager], code: 200,
      input: [], output: VialReservation, side_effects: ["reservation.status=EXPIRED if past hold_expiry", "recompute counts"] }

  # ---- Shipment ----
  - { method: POST, path: "/shipments", description: "Prepare a shipment for a confirmed reservation", roles: [LabTech], code: 201,
      input: [reservation_id, clinic_address, ln2_dewar_serial], output: Shipment, side_effects: ["shipment created status=PREPARING"] }
  - { method: GET, path: "/shipments/{id}", description: "Get shipment", roles: [LabTech, ComplianceOfficer, Recipient], code: 200, input: [], output: Shipment, side_effects: [] }
  - { method: GET, path: "/shipments", description: "List shipments; filter by reservation_id or recipient_id", roles: [LabTech, ComplianceOfficer, Recipient], code: 200,
      input: ["reservation_id?", "recipient_id?", "status?", "limit?", "offset?"], output: "Shipment[]", side_effects: [] }
  - { method: POST, path: "/shipments/{id}/dispatch", description: "Dispatch the LN2 dewar; ships the reservation", roles: [LabTech], code: 200,
      input: [], output: Shipment, side_effects: ["shipment.status=DISPATCHED", "reservation CONFIRMED->SHIPPED", "move reserved->shipped vials", "create StorageAccount + period-0 invoice"] }
  - { method: POST, path: "/shipments/{id}/deliver", description: "Mark shipment delivered", roles: [LabTech], code: 200,
      input: [], output: Shipment, side_effects: ["shipment.status=DELIVERED"] }

  # ---- StorageAccount / StorageInvoice ----
  - { method: GET, path: "/storage-accounts/{id}", description: "Get storage account", roles: [BillingClerk, Recipient], code: 200, input: [], output: StorageAccount, side_effects: [] }
  - { method: GET, path: "/storage-accounts", description: "List storage accounts; filter by recipient_id or reservation_id", roles: [BillingClerk, Recipient], code: 200,
      input: ["recipient_id?", "reservation_id?", "status?", "limit?", "offset?"], output: "StorageAccount[]", side_effects: [] }
  - { method: POST, path: "/storage-accounts/{id}/assess-lapse", description: "Assess a lapsed billing period past grace", roles: [BillingClerk], code: 200,
      input: [], output: StorageAccount, side_effects: ["account.status=LAPSED if past grace", "issue LAPSE invoice"] }
  - { method: POST, path: "/storage-accounts/{id}/renew", description: "Early-renew: prorate and issue a RENEWAL invoice", roles: [BillingClerk], code: 200,
      input: [], output: StorageAccount, side_effects: ["issue RENEWAL invoice for remaining days of current period"] }
  - { method: POST, path: "/storage-accounts/{id}/close", description: "Close a storage account", roles: [BillingClerk], code: 200,
      input: [], output: StorageAccount, side_effects: ["account.status=CLOSED", "void ISSUED invoices"] }
  - { method: GET, path: "/storage-invoices/{id}", description: "Get invoice", roles: [BillingClerk, Recipient], code: 200, input: [], output: StorageInvoice, side_effects: [] }
  - { method: GET, path: "/storage-invoices", description: "List invoices; filter by storage_account_id", roles: [BillingClerk, Recipient], code: 200,
      input: ["storage_account_id?", "status?", "billing_mode?", "limit?", "offset?"], output: "StorageInvoice[]", side_effects: [] }
  - { method: POST, path: "/storage-invoices/{id}/pay", description: "Pay an issued invoice", roles: [BillingClerk], code: 200,
      input: [], output: StorageInvoice, side_effects: ["invoice.status=PAID", "advance paid_through", "LAPSED->ACTIVE if lapse invoice"] }

  # ---- SiblingRegistry ----
  - { method: POST, path: "/sibling-registry", description: "Report a live birth into the sibling registry", roles: [ComplianceOfficer, Recipient], code: 201,
      input: [donor_id, recipient_id, birth_reported_date], output: SiblingRegistryEntry, side_effects: ["entry created status=PENDING"] }
  - { method: GET, path: "/sibling-registry/{id}", description: "Get registry entry", roles: [ComplianceOfficer, Recipient], code: 200, input: [], output: SiblingRegistryEntry, side_effects: [] }
  - { method: GET, path: "/sibling-registry", description: "List registry entries; filter by donor_id or recipient_id", roles: [ComplianceOfficer, Recipient], code: 200,
      input: ["donor_id?", "recipient_id?", "status?", "limit?", "offset?"], output: "SiblingRegistryEntry[]", side_effects: [] }
  - { method: POST, path: "/sibling-registry/{id}/confirm", description: "Confirm a registry entry; counts toward family-limit", roles: [ComplianceOfficer], code: 200,
      input: [], output: SiblingRegistryEntry, side_effects: ["entry.status=CONFIRMED", "recompute reported_family_count + is_family_limit_reached + is_listed"] }
  - { method: POST, path: "/sibling-registry/{id}/reject", description: "Reject a registry entry", roles: [ComplianceOfficer], code: 200,
      input: [], output: SiblingRegistryEntry, side_effects: ["entry.status=REJECTED"] }

  # ---- CollectionAppointment ----
  - { method: POST, path: "/collection-appointments", description: "Book a collection-room window for a donor", roles: [LabTech], code: 201,
      input: [donor_id, room_code, window_start, window_end], output: CollectionAppointment,
      side_effects: ["appointment created status=BOOKED (rejected on room-window overlap)"] }
  - { method: GET, path: "/collection-appointments/{id}", description: "Get appointment", roles: [LabTech, ScreeningOfficer], code: 200, input: [], output: CollectionAppointment, side_effects: [] }
  - { method: GET, path: "/collection-appointments", description: "List appointments; filter by donor_id or room_code", roles: [LabTech, ScreeningOfficer], code: 200,
      input: ["donor_id?", "room_code?", "status?", "limit?", "offset?"], output: "CollectionAppointment[]", side_effects: [] }
  - { method: POST, path: "/collection-appointments/{id}/complete", description: "Complete appointment", roles: [LabTech], code: 200, input: [], output: CollectionAppointment, side_effects: ["status=COMPLETED"] }
  - { method: POST, path: "/collection-appointments/{id}/cancel", description: "Cancel appointment", roles: [LabTech], code: 200, input: [], output: CollectionAppointment, side_effects: ["status=CANCELLED; window freed"] }

  # ---- DewarMaintenanceWindow ----
  - { method: POST, path: "/dewar-maintenance-windows", description: "Schedule an LN2 dewar maintenance window", roles: [LabTech], code: 201,
      input: [dewar_code, service_start, service_end], output: DewarMaintenanceWindow,
      side_effects: ["window created status=SCHEDULED (rejected on buffered dewar overlap)"] }
  - { method: GET, path: "/dewar-maintenance-windows/{id}", description: "Get maintenance window", roles: [LabTech, ComplianceOfficer], code: 200, input: [], output: DewarMaintenanceWindow, side_effects: [] }
  - { method: GET, path: "/dewar-maintenance-windows", description: "List maintenance windows; filter by dewar_code", roles: [LabTech, ComplianceOfficer], code: 200,
      input: ["dewar_code?", "status?", "limit?", "offset?"], output: "DewarMaintenanceWindow[]", side_effects: [] }
  - { method: POST, path: "/dewar-maintenance-windows/{id}/complete", description: "Complete maintenance", roles: [LabTech], code: 200, input: [], output: DewarMaintenanceWindow, side_effects: ["status=DONE"] }
  - { method: POST, path: "/dewar-maintenance-windows/{id}/cancel", description: "Cancel maintenance", roles: [LabTech], code: 200, input: [], output: DewarMaintenanceWindow, side_effects: ["status=CANCELLED; window freed"] }

  # ---- RegulatoryReport ----
  - { method: POST, path: "/regulatory-reports", description: "File a regulatory report snapshot for a donor", roles: [ComplianceOfficer], code: 201,
      input: [donor_id, report_type, as_of], output: RegulatoryReport,
      side_effects: ["report created status=FILED", "snapshot total_families_at_report + total_vials_shipped_at_report"] }
  - { method: GET, path: "/regulatory-reports/{id}", description: "Get report", roles: [ComplianceOfficer], code: 200, input: [], output: RegulatoryReport, side_effects: [] }
  - { method: GET, path: "/regulatory-reports", description: "List reports; filter by donor_id", roles: [ComplianceOfficer], code: 200,
      input: ["donor_id?", "report_type?", "limit?", "offset?"], output: "RegulatoryReport[]", side_effects: [] }

  # ---- test-driving clock ----
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time.", roles: [ScreeningOfficer, LabTech, CatalogManager, ComplianceOfficer, BillingClerk, Recipient], code: 200,
      input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["logical clock set to to_iso8601"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Acting role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced entity id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition not defined from the entity's current state" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad enum, or non-positive count where a positive integer is required" }
  - { id: ERR_RETEST_NOT_NEGATIVE, http: 422, condition: "release-quarantine attempted while retest_negative == false" }
  - { id: ERR_QUARANTINE_NOT_ELAPSED, http: 422, condition: "release-quarantine attempted before current_utc >= quarantine_release_date" }
  - { id: ERR_FDA_INELIGIBLE, http: 422, condition: "approve attempted while application.fda_risk_flag == true" }
  - { id: ERR_GENETIC_SCREENING_INCOMPLETE, http: 422, condition: "approve attempted while genetic_carrier_count > 0 AND partner_screening_required == true" }
  - { id: ERR_CONSENT_MISSING, http: 422, condition: "reservation create without a SIGNED consent for (recipient, donor)" }
  - { id: ERR_FAMILY_LIMIT_REACHED, http: 422, condition: "reservation create while donor.is_family_limit_reached == true" }
  - { id: ERR_INVENTORY_NOT_LISTED, http: 422, condition: "reservation create against FROZEN/unreleased/unlisted inventory" }
  - { id: ERR_INSUFFICIENT_VIALS, http: 422, condition: "reservation vial_count exceeds available_vials" }
  - { id: ERR_STALE_INVENTORY_VERSION, http: 412, condition: "expected_inventory_version != DonorInventory.version (OCC)" }
  - { id: ERR_REGISTRY_NO_SHIPMENT, http: 422, condition: "sibling-registry confirm without a SHIPPED reservation for (recipient, donor)" }
  - { id: ERR_CONSENT_NOT_ACKNOWLEDGED, http: 422, condition: "consent sign attempted while acknowledges_open_id == false" }
  - { id: ERR_ACTIVE_RESERVATION_EXISTS, http: 409, condition: "consent revoke blocked by an active reservation of the same recipient+donor" }
  - { id: ERR_GRACE_NOT_ELAPSED, http: 422, condition: "assess-lapse attempted before current_utc >= paid_through + GRACE_DAYS" }
  - { id: ERR_ROOM_WINDOW_CONFLICT, http: 409, condition: "collection appointment overlaps a BOOKED window on the same room_code (half-open, no buffer)" }
  - { id: ERR_DEWAR_WINDOW_CONFLICT, http: 409, condition: "dewar maintenance window overlaps a SCHEDULED window on the same dewar_code (closed, symmetric SETTLE_BUFFER_HOURS buffer)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ScreeningOfficer
    description: "Intakes donor applicants and runs FDA/genetic screening decisions"
    identity: "opaque"
    exclusive_operations:
      - "POST /donors"
      - "POST /screening-applications"
      - "POST /screening-applications/{id}/start-review"
      - "POST /screening-applications/{id}/approve"
      - "POST /screening-applications/{id}/defer"
    shared_operations: ["GET donors/screening-applications reads"]

  - name: LabTech
    description: "Records specimen collection, quarantine start, and shipment dispatch"
    identity: "opaque"
    exclusive_operations:
      - "POST /specimens"
      - "POST /specimens/{id}/begin-quarantine"
      - "POST /shipments"
      - "POST /shipments/{id}/dispatch"
      - "POST /shipments/{id}/deliver"
    shared_operations: ["GET specimen/inventory/shipment reads"]

  - name: ComplianceOfficer
    description: "Releases quarantine, confirms sibling registry, discards specimens, files regulatory reports"
    identity: "opaque"
    exclusive_operations:
      - "POST /specimens/{id}/release-quarantine"
      - "POST /specimens/{id}/discard"
      - "POST /sibling-registry/{id}/confirm"
      - "POST /sibling-registry/{id}/reject"
      - "POST /regulatory-reports"
    shared_operations: ["GET reads across compliance surface"]

  - name: CatalogManager
    description: "Manages catalog listing and vial reservation lifecycle (hold/confirm/cancel/expire)"
    identity: "opaque"
    exclusive_operations:
      - "POST /vial-reservations/{id}/confirm"
      - "POST /vial-reservations/{id}/expire"
    shared_operations: ["POST /recipients", "POST /recipient-consents", "POST /vial-reservations", "POST /vial-reservations/{id}/cancel"]

  - name: Recipient
    description: "A recipient family: registers, consents, reserves, reports births"
    identity: "entity_backed:Recipient"
    exclusive_operations:
      - "POST /recipient-consents/{id}/sign"
      - "POST /recipient-consents/{id}/revoke"
    shared_operations: ["POST /recipients", "POST /recipient-consents", "POST /vial-reservations", "POST /vial-reservations/{id}/cancel", "POST /sibling-registry"]

  - name: BillingClerk
    description: "Runs storage billing: lapse assessment, renewal, payments, account close"
    identity: "opaque"
    exclusive_operations:
      - "POST /storage-accounts/{id}/assess-lapse"
      - "POST /storage-accounts/{id}/renew"
      - "POST /storage-accounts/{id}/close"
      - "POST /storage-invoices/{id}/pay"
    shared_operations: ["GET billing reads"]
