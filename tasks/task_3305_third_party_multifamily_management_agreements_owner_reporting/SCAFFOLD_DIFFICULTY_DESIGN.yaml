              payload: { vendor_name: "LiftCo", service_type: "ELEVATOR", monthly_cost_cents: 50000, start_date: "2026-08-01T00:00:00Z", end_date: "2027-07-31T00:00:00Z" }
              as: PropertyAccountant
              captures: { v7_id: $.data.id }
            - call: "POST /mgmt/onboardings/${ob7_id}/verify_resident_data"
              payload: {}
              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${ob7_id}/import_ledger"
              payload: { deposits_received_cents: 0, prepaid_rent_cents: 0, delinquency_cents: 0 }
              as: PropertyAccountant
