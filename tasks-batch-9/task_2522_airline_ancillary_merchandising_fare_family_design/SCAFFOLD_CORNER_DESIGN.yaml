            - "FareFamily.unbundled_value_cents == 4750, a_la_carte_total_cents == 16750, bundle_discount_bp == 1045, included_attribute_count == 2"
            - "FareFamily.fee_fingerprint == \"ECO_TWO|1|BAG_CHECKED_1:INCLUDED:1:3500;PRIORITY_BOARDING:INCLUDED:1:1250\""
            - "FareFamily.revision_no is still 1 and reviewer_user_id is still null"
            - "FareFamily.version == 4 (create 1, two attribute writes, this submit)"

      - name: submit_family_with_zero_active_attributes_returns_family_has_no_attributes
        claim_type: precondition_enforcement
        grounds:
          - state_machines.FareFamily.status.DRAFT_to_IN_REVIEW
          - validations.priority_45
          - validations.priority_49
          - errors[ERR_FAMILY_HAS_NO_ATTRIBUTES]
        distinguishing_aspect: "A DRAFT family with no attribute at all fails the attribute-count precondition with ERR_FAMILY_HAS_NO_ATTRIBUTES (priority 45) even though its bundle_price_cents 14000 also exceeds the attribute-free a_la_carte_total_cents 12000 (priority 49)."
        test_recipe:
          setup:
            - "DRAFT family ECO_BARE (ECONOMY, base_fare 12000, bundle 14000) has zero FamilyAttribute rows"
          setup_api_calls:
            - call: "POST /fare-families"
              payload: { code: "ECO_BARE", name: "Economy Bare", cabin_class: "ECONOMY", base_fare_cents: 12000, bundle_price_cents: 14000, refundability: "NON_REFUNDABLE", change_fee_cents: 7500, boarding_priority_tier: 4 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { f_bare_id: $.data.id }
          trigger:
            - call: "POST /fare-families/${f_bare_id}/submit"
              payload: {}
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 422 and data.error_id == \"ERR_FAMILY_HAS_NO_ATTRIBUTES\" (not ERR_BUNDLE_DISCOUNT_FLOOR_BREACH)"
            - "GET /fare-families/${f_bare_id} still shows status == \"DRAFT\" and version == 1"
            - "FareFamily.fee_fingerprint == \"ECO_BARE|1|\" (the empty-attribute-set form)"

      - name: approve_review_decision_promotes_pending_publication_to_in_parity
        claim_type: side_effect_execution
        grounds:
          - state_machines.FareFamily.status.IN_REVIEW_to_PUBLISHED
          - state_machines.ChannelPublication.parity_state.PENDING_to_IN_PARITY
          - entities.ChannelPublication.fields.published_family_version
          - entities.ChannelPublication.fields.published_fee_fingerprint
          - entities.DistributionChannel.fields.content_parity_status
        distinguishing_aspect: "The APPROVE decision promotes the family's PENDING publication to IN_PARITY and pins published_family_version 5 - the family version as of the END of the approve request, not the version the publication was created against."
        test_recipe:
          setup:
            - "DRAFT family ECO_PUB with one ACTIVE INCLUDED BAG_CHECKED_1 attribute, and a PENDING ChannelPublication of it on DIRECT_WEB"
            - "the family has been submitted for review, so its status is IN_REVIEW"
          setup_api_calls:
            - call: "POST /ancillary-products"
              payload: { sku: "BAG_CHECKED_1", name: "First checked bag", category: "BAGGAGE", list_price_cents: 3500, tax_treatment: "TAXABLE_SERVICE", revenue_class: "NON_AIR", revenue_account_code: "4100" }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { p_bag_id: $.data.id }
            - call: "POST /fare-families"
              payload: { code: "ECO_PUB", name: "Economy Pub", cabin_class: "ECONOMY", base_fare_cents: 12000, bundle_price_cents: 14000, refundability: "NON_REFUNDABLE", change_fee_cents: 7500, boarding_priority_tier: 4 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { f_pub_id: $.data.id }
            - call: "POST /fare-families/${f_pub_id}/attributes"
              payload: { ancillary_product_id: "${p_bag_id}", inclusion: "INCLUDED", included_quantity: 1 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
            - call: "POST /distribution-channels"
              payload: { channel_code: "DIRECT_WEB", channel_type: "DIRECT", commission_bp: 0, markup_bp: 0, max_ancillary_price_cents: 20000, supported_categories: ["BAGGAGE", "SEAT", "CHANGE", "BOARDING", "ONBOARD"], parity_required: true }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { ch_direct_id: $.data.id }
            - call: "GET /fare-families/${f_pub_id}"
              payload: {}
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { f_ver: $.data.version }
            - call: "POST /channel-publications"
              payload: { fare_family_id: "${f_pub_id}", distribution_channel_id: "${ch_direct_id}", expected_fare_family_version: "${f_ver}" }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { pub_id: $.data.id }
            - call: "POST /fare-families/${f_pub_id}/submit"
              payload: {}
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
          trigger:
            - call: "POST /fare-families/${f_pub_id}/review-decision"
              payload: { decision: "APPROVE", review_note: "fare family approved for sale" }
              as: PricingApprover
              as_user_id: "pa-001"
          assert:
            - "FareFamily.status == \"PUBLISHED\", reviewer_user_id == \"pa-001\", revision_no still 1 and version == 5"
            - "ChannelPublication.${pub_id}.parity_state == \"IN_PARITY\" with drift_reason == null"
            - "ChannelPublication.${pub_id}.published_family_version == 5 and published_fee_fingerprint == \"ECO_PUB|1|BAG_CHECKED_1:INCLUDED:1:3500\""
            - "FareFamily.publication_count == 1"
            - "DistributionChannel.${ch_direct_id}.content_parity_status == \"COMPLIANT\" and parity_breach_count == 0"

      - name: cancel_of_already_cancelled_booking_returns_booking_state_invalid
        claim_type: invalid_transition
        grounds:
          - state_machines.Booking.booking_status.HELD_to_CANCELLED
          - validations.priority_9
          - errors[ERR_BOOKING_STATE_INVALID]
        distinguishing_aspect: "CANCELLED is a terminal booking_status with no outgoing transition, so a second cancel answers ERR_BOOKING_STATE_INVALID (409) and Booking.version does not move again."
        test_recipe:
          setup:
            - "channel DIRECT_WEB, family ECO_LITE and flight AC510 exist"
            - "booking CANC02 was created HELD and then cancelled once"
          setup_api_calls:
            - call: "POST /distribution-channels"
              payload: { channel_code: "DIRECT_WEB", channel_type: "DIRECT", commission_bp: 0, markup_bp: 0, max_ancillary_price_cents: 20000, supported_categories: ["BAGGAGE", "SEAT", "CHANGE", "BOARDING", "ONBOARD"], parity_required: true }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { ch_direct_id: $.data.id }
            - call: "POST /fare-families"
              payload: { code: "ECO_LITE", name: "Economy Lite", cabin_class: "ECONOMY", base_fare_cents: 12000, bundle_price_cents: 14000, refundability: "NON_REFUNDABLE", change_fee_cents: 7500, boarding_priority_tier: 4 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { f_lite_id: $.data.id }
            - call: "POST /flights"
              payload: { flight_no: "AC510", origin: "SFO", destination: "JFK", scheduled_departure_utc: "2026-09-01T15:00:00Z", cabin_seat_total: 120 }
              as: OperationsController
              as_user_id: "oc-001"
              captures: { fl_id: $.data.id }
            - call: "POST /bookings"
              payload: { record_locator: "CANC02", flight_id: "${fl_id}", fare_family_id: "${f_lite_id}", distribution_channel_id: "${ch_direct_id}", passenger_name: "Ada Lovelace" }
              as: ChannelPartner
              as_user_id: "${ch_direct_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /bookings/${bk_id}/cancel"
