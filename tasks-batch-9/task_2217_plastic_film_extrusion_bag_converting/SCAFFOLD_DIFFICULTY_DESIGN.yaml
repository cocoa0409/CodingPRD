  - rule_id: resource_temporal_overlap
    instances:
      - name: line_exclusive_occupancy_with_conditional_purge_buffer
        grounds:
          - calculations.line_occupancy_conflict
          - validations[priority=13]
          - errors[ERR_LINE_WINDOW_CONFLICT]
          - entities.ExtrusionLine.fields.purge_buffer_minutes
        distinguishing_aspect: |
          The exclusion window is not the scheduled window: whether a purge gap applies depends on
          the neighbour's recipe. RUN-NF-2 abuts RUN-NF-1 exactly at 14:00 on the SAME recipe, so
          the gap is 0 and the half-open comparison admits it; RUN-NF-3 abuts RUN-NF-2 exactly at
          20:00 on a DIFFERENT recipe, so the 45-minute purge gap is inserted and the same kind of
          abutment is refused; shifting the start to 20:45 clears it.
        test_recipe:
          setup:
            - "line L-NF with purge_buffer_minutes 45 carrying RUN-NF-1 SCHEDULED 06:00-14:00 on APPROVED recipe R-NF-0"
            - "a second APPROVED non-food recipe R-NF-6 (50 % LL-1001 / 50 % PC-7007) exists for the same product"
            - "logical clock is 2026-08-05T06:00:00Z"
          setup_api_calls:
            - *a_clock_d1_0600
            - *a_p_nf
            - *a_g_ll
            - *a_line_nf
            - *a_pool_nf
            - *a_g_pc
            - *a_r0_new
            - *a_r0_c1
            - *a_r0_sub
            - *a_r0_app
            - *a_r6_new
            - *a_r6_c1
            - *a_r6_c2
            - *a_r6_sub
            - *a_r6_app
            - *a_run1_new
          trigger:
            - { call: "POST /extrusion-runs", payload: { run_code: "RUN-NF-2", line_id: "${line_nf}", blend_recipe_id: "${r0}", scheduled_start: "2026-08-05T14:00:00Z", scheduled_end: "2026-08-05T20:00:00Z", target_output_kg: 500.0 }, as: ExtrusionOperator, captures: { run2: "$.data.id" } }
            - { call: "POST /extrusion-runs", payload: { run_code: "RUN-NF-3", line_id: "${line_nf}", blend_recipe_id: "${r6}", scheduled_start: "2026-08-05T20:00:00Z", scheduled_end: "2026-08-05T23:00:00Z", target_output_kg: 300.0 }, as: ExtrusionOperator }
            - { call: "POST /extrusion-runs", payload: { run_code: "RUN-NF-4", line_id: "${line_nf}", blend_recipe_id: "${r6}", scheduled_start: "2026-08-05T20:45:00Z", scheduled_end: "2026-08-05T23:45:00Z", target_output_kg: 300.0 }, as: ExtrusionOperator, captures: { run4: "$.data.id" } }
          assert:
            - "RUN-NF-2 -> 201 (same blend_recipe_id, gap 0, half-open abutment at 14:00) and ExtrusionRun.${run2}.status == SCHEDULED"
            - "RUN-NF-3 -> 409 ERR_LINE_WINDOW_CONFLICT (different blend_recipe_id, 45-minute purge gap covers 20:00)"
            - "RUN-NF-4 -> 201 and ExtrusionRun.${run4}.scheduled_start == '2026-08-05T20:45:00Z'"
            - "ExtrusionLine.${line_nf}.purge_buffer_minutes == 45 and posture == OPEN"
            - "GET /extrusion-runs filtered by line_id ${line_nf} and status SCHEDULED returns total_count 3"
            - "BlendRecipe.${r0}.pinned_run_count == 2 and BlendRecipe.${r6}.pinned_run_count == 1"
      - name: press_cylinder_capacity_is_aggregate_across_overlapping_windows
        grounds:
          - calculations.press_cylinder_capacity
          - validations[priority=13]
          - errors[ERR_PRESS_CYLINDER_CAPACITY]
          - entities.PrintPress.fields.cylinder_capacity
          - entities.PrintJob.fields.cylinders_required
        distinguishing_aspect: |
          A capacity overlap rather than an exclusive one, on a different resource with no purge
          buffer: the press admits any number of concurrent jobs whose frozen cylinders_required
          sum stays within cylinder_capacity 8. A 4-cylinder job and a 6-cylinder job each fit
          alone but their 09:00-12:00 overlap sums to 10 and is refused; moving the 6-cylinder job
          to 12:00-18:00 makes the half-open windows disjoint and it is admitted.
        test_recipe:
          setup:
