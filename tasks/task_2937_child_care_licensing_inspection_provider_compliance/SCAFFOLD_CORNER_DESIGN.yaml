            - "${vc} == 2 and Inspection.${ins}.cap_required == true"

      - name: calc_aggregation_clearance_flips_with_each_attached_person
        claim_type: aggregation
        grounds:
          - calculations.provider_clearance_completeness
          - global_constants.REQUIRED_CHECK_TYPES
          - entities.Provider.fields.clearance_complete
          - entities.StaffMember.fields.clearance_status
        distinguishing_aspect: "clearance_complete is an all-staff aggregate: it turns true once the sole DIRECTOR holds both REQUIRED_CHECK_TYPES, falls to false the instant an uncleared ASSISTANT is attached, and returns to true only after that assistant's own two checks clear — the reversal is exact, not sticky."
        test_recipe:
          setup:
            - "A CENTER provider whose DIRECTOR has both required checks CLEARED at clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/providers"
              payload: { legal_name: "Bright Start Center", county_code: "CTY-01", site_address: "12 Elm St", program_type: "CENTER", requested_capacity: 10 }
              as: Applicant
              captures: { prov: $.data.id }
            - call: "POST /licensing/staff-members"
              payload: { provider_id: "${prov}", full_name: "Dana Reed", member_type: "DIRECTOR", date_of_birth: "1985-04-02", qualified_age_groups: ["PRESCHOOL"], role_title: "Director" }
              as: Applicant
              as_user_id: "${prov}"
              captures: { dir: $.data.id }
            - call: "POST /licensing/background-checks"
              payload: { staff_member_id: "${dir}", check_type: "FBI_FINGERPRINT" }
              as: BackgroundCheckUnit
              captures: { bc_fbi: $.data.id }
            - call: "POST /licensing/background-checks/${bc_fbi}/result"
              payload: { result: "CLEARED" }
              as: BackgroundCheckUnit
            - call: "POST /licensing/background-checks"
              payload: { staff_member_id: "${dir}", check_type: "CHILD_ABUSE_REGISTRY" }
              as: BackgroundCheckUnit
              captures: { bc_car: $.data.id }
            - call: "POST /licensing/background-checks/${bc_car}/result"
              payload: { result: "CLEARED" }
              as: BackgroundCheckUnit
              captures: { exp: $.data.expires_at }
          trigger:
            - call: "GET /licensing/providers/${prov}"
              as: LicensingSupervisor
              captures: { cc_after_dir: $.data.clearance_complete }
            - call: "POST /licensing/staff-members"
              payload: { provider_id: "${prov}", full_name: "Sam Ortiz", member_type: "ASSISTANT", date_of_birth: "1996-11-20", qualified_age_groups: ["PRESCHOOL"] }
              as: Applicant
              as_user_id: "${prov}"
              captures: { asst: $.data.id }
            - call: "GET /licensing/providers/${prov}"
              as: LicensingSupervisor
              captures: { cc_after_asst: $.data.clearance_complete }
            - call: "POST /licensing/background-checks"
              payload: { staff_member_id: "${asst}", check_type: "FBI_FINGERPRINT" }
              as: BackgroundCheckUnit
              captures: { bc2_fbi: $.data.id }
            - call: "POST /licensing/background-checks/${bc2_fbi}/result"
              payload: { result: "CLEARED" }
              as: BackgroundCheckUnit
            - call: "POST /licensing/background-checks"
              payload: { staff_member_id: "${asst}", check_type: "CHILD_ABUSE_REGISTRY" }
              as: BackgroundCheckUnit
              captures: { bc2_car: $.data.id }
            - call: "POST /licensing/background-checks/${bc2_car}/result"
              payload: { result: "CLEARED" }
              as: BackgroundCheckUnit
              captures: { cc_final: $.data.id }
            - call: "GET /licensing/providers/${prov}"
              as: LicensingSupervisor
              captures: { cc_after_clear: $.data.clearance_complete }
          assert:
            - "${exp} == 2031-08-01T00:00:00Z (CLEARANCE_VALIDITY_MONTHS == 60)"
            - "${cc_after_dir} == true — one DIRECTOR holding FBI_FINGERPRINT and CHILD_ABUSE_REGISTRY satisfies the aggregate"
            - "${cc_after_asst} == false — attaching an uncleared ASSISTANT breaks it even though the director is untouched"
            - "StaffMember.${asst}.clearance_status == PENDING at that point"
            - "${cc_after_clear} == true once the assistant's two checks are CLEARED"
            - "StaffMember.${asst}.clearance_status == CLEARED and supervision_eligible == false (ASSISTANT is not a lead-eligible member_type)"
            - "Provider.${prov}.application_status stays DRAFT throughout — clearance is independent of the application edge"

      - name: calc_precision_round_half_up_at_two_decimals
        claim_type: precision
        grounds:
          - calculations.inspection_compliance_score
          - global_constants.AGE_GROUP_EXPOSURE_WEIGHT
        excluded_because:
          difficulty_instance: boundary_round_half_up_at_two_decimals_in_compliance_score
          rationale: "That §1.8 instance pins the exact half-up tie at the second decimal and contrasts round-each-line-then-sum against sum-then-round, which is the whole content of the precision claim for this scaffold."

      - name: calc_threshold_enforcement_point_thresholds
        claim_type: threshold
        grounds:
          - calculations.enforcement_ladder_step
          - global_constants.PROBATION_THRESHOLD
        excluded_because:
          difficulty_instance: boundary_enforcement_point_thresholds_on_proposal
          rationale: "The threshold-minus-one / at-threshold / above-threshold triple for the enforcement ladder, including ERR_NO_ENFORCEMENT_BASIS below 15 and ERR_LADDER_STEP_SKIP at 29 points, is exactly what that §1.8 instance walks."

      - name: calc_constraint_propagation_roster_flags_reach_a_fixed_point
        claim_type: constraint_propagation
        grounds:
          - calculations.ratio_group_size_supervision_verification
          - endpoints.PATCH /licensing/age-group-rosters/{roster_id}
        excluded_because:
          difficulty_instance: boundary_ratio_and_group_size_counts_on_roster_patch
          rationale: "The PATCH-driven re-derivation of required_staff_count and all three flags — the propagation reaching its fixed point in two hops without looping — is asserted at the ceil and group-size boundaries by that §1.8 instance."

      - name: calc_variant_divergence_preliminary_versus_final_score
        claim_type: variant_divergence
        grounds:
          - calculations.inspection_compliance_score.variants
          - endpoints.GET /licensing/inspections/{inspection_id}/compliance-score
        excluded_because:
          difficulty_instance: dual_variant_inspection_compliance_preliminary_vs_final
          rationale: "Both variants over one stored violation set, and the signed delta between them after mixed dispositions, are computed and asserted there; a breadth duplicate would add no new discrimination."

      - name: calc_variant_selection_risk_variant_follows_the_caller_context
        claim_type: variant_selection
        grounds:
          - calculations.provider_risk_assessment.variants
          - endpoints.GET /licensing/providers/{provider_id}/risk-assessment
        excluded_because:
          difficulty_instance: dual_variant_provider_risk_intake_vs_enforcement
          rationale: "That instance shows INTAKE_SCREENING weighting inconclusive determinations at 0 while ENFORCEMENT_REVIEW weights them at 4, and that the persisted risk_score/risk_tier follow the ENFORCEMENT_REVIEW variant — the selection claim in full."

      - name: calc_reconciliation_final_score_moves_with_the_point_ledger
        claim_type: reconciliation
        grounds:
          - calculations.inspection_compliance_score.variants
          - entities.Provider.fields.resolved_violation_points
        excluded_because:
          difficulty_instance: dual_variant_inspection_compliance_preliminary_vs_final
          rationale: "The switch from the as-cited view to the post-correction view, and the matching movement of the provider's open and resolved point ledger, are reconciled step by step in that §1.8 instance while preliminary_compliance_score stays frozen."

  # ---------------------------------------------------------------------------
  # Guide section 4 — From Table 4 (Validations) and the validation-pattern rows.
  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: val_violation_to_error_pass_outcome_with_critical_citation
        claim_type: violation_to_error
        grounds:
          - validations.priority_80_ERR_OUTCOME_SEVERITY_MISMATCH
          - errors[ERR_OUTCOME_SEVERITY_MISMATCH]
          - endpoints.POST /licensing/inspections/{inspection_id}/submit-for-review
        distinguishing_aspect: "Submitting PASS while a non-VACATED CRITICAL citation stands returns ERR_OUTCOME_SEVERITY_MISMATCH 409 and leaves the inspection IN_PROGRESS; resubmitting the very same call with outcome FAIL is accepted, so the rule is about outcome-versus-severity agreement and nothing else."
        test_recipe:
          setup:
            - "One IN_PROGRESS ANNUAL inspection at clock 2026-08-05T09:00:00Z carrying a single CRITICAL PRESCHOOL citation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/checklist-items"
              payload: { code: "SU-101", title: "Direct supervision of children", category: "SUPERVISION", default_severity: "CRITICAL", age_groups_applicable: ["INFANT", "TODDLER", "PRESCHOOL", "SCHOOL_AGE"], infant_sensitive: true }
              as: AgencyAdmin
              captures: { ci_su: $.data.id }
            - call: "POST /licensing/providers"
              payload: { legal_name: "Bright Start Center", county_code: "CTY-01", site_address: "12 Elm St", program_type: "CENTER", requested_capacity: 10 }
              as: Applicant
              captures: { prov: $.data.id }
            - call: "POST /licensing/inspectors"
              payload: { full_name: "Ivy Cole", county_code: "CTY-01", certified_age_groups: ["PRESCHOOL"] }
              as: AgencyAdmin
              captures: { insp: $.data.id }
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${prov}", inspector_id: "${insp}", inspection_type: "ANNUAL", scheduled_for: "2026-08-05T09:00:00Z", target_age_groups: ["PRESCHOOL"] }
              as: LicensingSupervisor
              captures: { ins: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/inspections/${ins}/start"
              as: LicensingInspector
              as_user_id: "${insp}"
            - call: "POST /licensing/violations"
              payload: { inspection_id: "${ins}", checklist_item_id: "${ci_su}", primary_age_group: "PRESCHOOL", narrative: "Children unsupervised at the sink." }
              as: LicensingInspector
              as_user_id: "${insp}"
              captures: { vio: $.data.id }
          trigger:
            - call: "POST /licensing/inspections/${ins}/submit-for-review"
              payload: { outcome: "PASS", age_groups_observed: ["PRESCHOOL"] }
              as: LicensingInspector
              as_user_id: "${insp}"
              captures: { e_out: $.data.error_id }
            - call: "POST /licensing/inspections/${ins}/submit-for-review"
              payload: { outcome: "FAIL", age_groups_observed: ["PRESCHOOL"] }
              as: LicensingInspector
              as_user_id: "${insp}"
              captures: { st: $.data.status, oc: $.data.outcome }
          assert:
            - "${e_out} == ERR_OUTCOME_SEVERITY_MISMATCH with HTTP 409"
            - "Inspection.${ins}.status is still IN_PROGRESS after the refused call and submitted_at is still null"
            - "${st} == PENDING_REVIEW and ${oc} == FAIL on the second call (HTTP 200)"
            - "Violation.${vio}.status == CITED — submit-for-review does not move citations"

      - name: val_satisfaction_to_pass_conditional_pass_with_only_a_minor
        claim_type: satisfaction_to_pass
        grounds:
          - validations.priority_80_ERR_OUTCOME_SEVERITY_MISMATCH
