  - rule_id: cross_entity_state_dependency
    instances:
      - name: record_creation_depends_on_station_being_open
        grounds:
          - state_machines.InspectionStation.PLANNED_to_OPEN
          - validations.priority_14_ERR_STATION_NOT_OPEN
          - entities.InspectionRecord.fields.station_id
          - endpoints.POST_/inspection-records
        distinguishing_aspect: |
          Entity pair InspectionRecord -> InspectionStation. Nothing about the
          request is wrong: the vessel exists, the inspector is ACTIVE and
          arrived_at sits inside a valid hours window. The only defect lives on a
          DIFFERENT row - the station is still PLANNED - and the sole remedy is a
          state transition on that other entity, after which the byte-identical
          request succeeds. A SUSPENDED station is rejected the same way, so the
          dependency is on the specific state OPEN and not merely on
          not-being-CLOSED.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T09:00:00Z."
            - "Station 'Ennis Access' created with an hours window [2026-07-01T00:00:00Z, 2026-10-01T00:00:00Z) but LEFT in status PLANNED - no /status call."
            - "Inspector 'Ada Field' ACTIVE LEVEL_1 homed at that station; Watercraft MT-9300 registered."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /water-bodies"
              payload: { name: "Ennis Lake", state_code: "MT", water_body_class: "LAKE", risk_tier: "MODERATE", infestation_status: "CLEAN" }
              as: ProgramAdmin
              captures: { wb_id: $.data.id }
            - call: "POST /inspection-stations"
              payload: { name: "Ennis Access", station_type: "WATERBODY_ACCESS", water_body_id: "${wb_id}", mandatory_inspection: true, decon_bay_count: 1, hot_water_capable: true, seal_stock_initial_count: 2 }
              as: ProgramAdmin
              captures: { st_id: $.data.id }
            - call: "POST /inspection-stations/${st_id}/hours"
              payload: { opens_at: "2026-07-01T00:00:00Z", closes_at: "2026-10-01T00:00:00Z", staffing_level: "SINGLE" }
              as: ProgramAdmin
            - call: "POST /inspectors"
              payload: { full_name: "Ada Field", home_station_id: "${st_id}" }
              as: ProgramAdmin
              captures: { insp_a: $.data.id }
            - call: "POST /inspectors/${insp_a}/training-records"
              payload: { module_code: "AIS-101", hours: 8, passed: true }
              as: TrainingOfficer
            - call: "POST /watercraft"
              payload: { registration_number: "MT-9300", home_state_code: "MT", vessel_type: "OPEN_HULL", hull_length_ft: 15 }
              as: ProgramAdmin
              captures: { wc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /inspection-records"
              payload: { station_id: "${st_id}", watercraft_id: "${wc_id}", arrived_at: "2026-08-05T09:00:00Z" }
              as: Inspector
              as_user_id: "${insp_a}"
          assert:
            - "the trigger returns 409 with error_id ERR_STATION_NOT_OPEN"
            - "no InspectionRecord row exists for watercraft ${wc_id}"
            - "InspectionStation.${st_id}.status == PLANNED and its version is unchanged"
            - "control: POST /inspection-stations/${st_id}/status with target_status OPEN as ProgramAdmin, then the identical trigger returns 201 with inspection_status INITIATED"
            - "control: moving the station on to SUSPENDED and repeating the trigger returns 409 ERR_STATION_NOT_OPEN again"

