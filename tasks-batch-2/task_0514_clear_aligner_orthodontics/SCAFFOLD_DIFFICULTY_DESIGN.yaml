              payload: {}
              as: Clinician
              captures: { tc14: $.data.total_contracted_cents }
          assert:
            - "TreatmentCase.${case14}.total_contracted_cents == 240000"

      - name: empty_intake_set_blocks_submit_for_review
        grounds:
          - validations[priority=9]
          - state_machines.TreatmentCase.INTAKE_PENDING_to_UNDER_REVIEW
          - entities.IntakeRecord.fields.quality_score
        distinguishing_aspect: |
          Empty-usable-collection / zero-count edge on a DIFFERENT metric and endpoint
          (submit-for-review): a case whose only IntakeRecord has quality_score 0.50 (below
          the 0.60 usability floor) has ZERO usable intakes and cannot leave INTAKE_PENDING,
          returning ERR_INTAKE_NOT_USABLE. Not a numeric tier threshold.
        test_recipe:
          setup:
            - "Case INTAKE_PENDING with one intake at quality_score 0.50 (below 0.60 usability floor)."
          setup_api_calls:
            - call: "POST /clinicians"
              payload: { full_name: "Dr CB2", license_state_codes: ["CA"], role_type: "DENTIST" }
              as: BillingAdmin
