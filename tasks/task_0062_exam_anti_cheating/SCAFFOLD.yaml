# =============================================================================
# Task 0062: Online Exam Anti-Cheating System — SCAFFOLD.yaml
# Sibling: SCAFFOLD_DIFFICULTY_DESIGN.yaml (Test Targeting Index)
# =============================================================================

scenario: |
  Online exam anti-cheating system: exam paper composition with question bank
  management, question-type and difficulty tagging, sampling rules
  (random/stratified/blueprint-based), option shuffling,
  single-paper-per-candidate generation, and paper-version archiving; candidate
  identity authentication with multi-factor authentication (ID card/face/
  live-detection), pre-exam identity verification, in-exam re-verification on
  suspicious events, identity-mismatch handling, and authentication record
  archiving; answering and timing with exam-start and submit window, server-side
  timing, network-disconnection handling and resume, single-question time limit
  (optional), and forced-submit on timeout; abnormal behavior marking with
  monitoring channels (screen/camera/audio/process/network), behavior-rule
  library (face-leave/multi-person/window-switch/external-device), severity
  classification, real-time alert and after-the-fact marking, and evidence-clip
  archiving; grading with objective auto-grading, subjective multi-marker
  scoring, double-blind marking and arbitration, scoring-rubric configuration,
  score-aggregation rules, and grading-progress monitoring; score review and
  appeal with score publication, appeal submission window, secondary marking
  workflow, decision and score adjustment, and appeal record archiving;
  event-driven synchronization with identity verification, IM, and learning
  management systems; audit logging for abnormal events and score adjustments.

domain_name: exam-anti-cheating
api_prefix: /exams

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - rate_threshold_triggers
    - dual_variant_calculation
    - idempotency
    - scheduled_deferred_actions
  entity_topology: hybrid
  state_machine_shape: compound      # Exam.status reflects aggregate progress; ExamAttempt + GradingAssignment have cycles
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic                    # AuditLogEntry references different subject entities
  role_model: segregation_of_duties  # Marker cannot also be ArbitrationOfficer for same item; ApprealOfficer cannot have been original marker
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Exam
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Exam display title" }
      - { name: start_time, type: integer, source: input, description: "Unix seconds — earliest moment a candidate may transition ExamAttempt to ACTIVE" }
      - { name: end_time, type: integer, source: input, description: "Unix seconds — strict upper bound; server forces submit at this instant" }
      - { name: appeal_window_seconds, type: integer, source: input, default: 86400, description: "Seconds the exam remains in APPEAL_WINDOW after SCORES_PUBLISHED" }
      - { name: per_question_time_limit_seconds, type: integer, source: input, default: 0, description: "Per-question hard cap; 0 means no per-question limit (only overall window applies)" }
      - { name: sampling_rule_type, type: enum, source: input, description: "RANDOM | STRATIFIED | BLUEPRINT — drives paper_composition_sampling" }
      - { name: sampling_rule_spec, type: object, source: input, description: "Mode-specific spec (e.g., target_count for RANDOM; difficulty_buckets and type_quotas for STRATIFIED; ordered blueprint slots for BLUEPRINT)" }
      - { name: option_shuffle, type: boolean, source: input, default: true, description: "Whether single-choice options are shuffled per candidate paper" }
      - { name: max_score, type: number, source: computed, description: "Sum of question.max_points across the canonical question bank; recomputed when bank changes" }
      - { name: grading_progress_pct, type: number, source: computed, description: "0–100, derived from grading-progress monitoring formula" }
      - { name: status, type: enum, source: system, description: "DRAFT → OPEN_REGISTRATION → READY → IN_SESSION → GRADING → SCORES_PUBLISHED → APPEAL_WINDOW → ARCHIVED" }

  - name: Question
    parent: Exam
    common_fields: true
    fields:
      - { name: exam_id, type: string, source: system, description: "Parent exam id" }
      - { name: question_type, type: enum, source: input, description: "SINGLE_CHOICE | MULTI_CHOICE | TRUE_FALSE | SHORT_ANSWER | ESSAY (SINGLE_CHOICE/MULTI_CHOICE/TRUE_FALSE are objective; SHORT_ANSWER/ESSAY are subjective)" }
      - { name: difficulty, type: enum, source: input, description: "EASY | MEDIUM | HARD — used by STRATIFIED sampling" }
      - { name: topic, type: string, source: input, description: "Blueprint slot key; used by BLUEPRINT sampling" }
      - { name: stem, type: string, source: input, description: "Question prompt text" }
      - { name: options, type: array, source: input, description: "Array of { option_key, text }; required for SINGLE_CHOICE/MULTI_CHOICE; ignored for SHORT_ANSWER/ESSAY" }
      - { name: correct_answer, type: array, source: input, description: "Array of option_keys (objective) or rubric_keypoint_ids (subjective auto-hint, optional)" }
      - { name: max_points, type: number, source: input, description: "Maximum points for this question; constraint: > 0" }
      - { name: rubric, type: array, source: input, description: "Array of { keypoint, points } for subjective questions; sum of points MUST equal max_points; null for objective" }

  - name: CandidateRegistration
    parent: Exam
    common_fields: true
    fields:
      - { name: exam_id, type: string, source: system, description: "Parent exam id" }
      - { name: candidate_id, type: string, source: input, description: "Candidate user id (X-User-ID for role Candidate)" }
      - { name: id_card_number, type: string, source: input, description: "Government ID for identity binding" }
      - { name: enrolled_at, type: integer, source: system, description: "Unix seconds when registration was created" }
      - { name: status, type: enum, source: system, description: "REGISTERED | DISQUALIFIED — DISQUALIFIED set on identity_mismatch cascade or CRITICAL severity event" }
    # No `updated_at`/`version` cycle on status changes? — common_fields:true ensures version increments on every mutation.

  - name: ExamAttempt
    parent: Exam
    common_fields: true
    fields:
      - { name: exam_id, type: string, source: system, description: "Parent exam id" }
      - { name: registration_id, type: string, source: input, description: "Linked CandidateRegistration id; one attempt per registration" }
      - { name: candidate_id, type: string, source: computed, description: "Mirrored from registration.candidate_id at attempt creation" }
      - { name: paper_version_hash, type: string, source: computed, description: "SHA-256 hex of the canonical JSON of paper_question_ids ++ option_order ++ exam.version at generation; archived for audit; never mutated" }
      - { name: paper_question_ids, type: array, source: computed, description: "Ordered list of Question.id selected by paper_composition_sampling; persisted on attempt creation; immutable" }
      - { name: paper_option_order, type: object, source: computed, description: "Per-question option_key ordering after shuffling; key=question_id, value=array of option_keys; immutable" }
      - { name: started_at, type: integer, source: system, description: "Unix seconds when status first became ACTIVE; null until then" }
      - { name: submitted_at, type: integer, source: system, description: "Unix seconds when SUBMITTED; null until then" }
      - { name: suspended_total_seconds, type: integer, source: computed, default: 0, description: "Aggregate seconds the attempt spent in SUSPENDED across resume cycles; subtracted from elapsed when enforcing per-question and overall caps" }
      - { name: current_suspend_started_at, type: integer, source: system, description: "Unix seconds at which the current SUSPENDED interval began; null when not SUSPENDED" }
      - { name: provisional_score, type: number, source: computed, description: "Sum of available scores while grading in progress (see provisional_score_calculation)" }
      - { name: final_score, type: number, source: computed, description: "Authoritative score after arbitration and appeals (see final_score_calculation)" }
      - { name: identity_verification_count, type: integer, source: computed, default: 0, description: "Count of IdentityVerificationRecord rows whose attempt_id == this id; invariant" }
      - { name: status, type: enum, source: system, description: "ENROLLED → IDENTITY_PENDING → ACTIVE ⇄ SUSPENDED → SUBMITTED → GRADED → FINALIZED, or DISQUALIFIED (terminal)" }

  - name: IdentityVerificationRecord
    parent: ExamAttempt
    common_fields: false              # Append-only archive — only id + created_at
    fields:
      - { name: attempt_id, type: string, source: system, description: "Parent ExamAttempt id" }
      - { name: verification_phase, type: enum, source: input, description: "PRE_EXAM | IN_EXAM_RECHECK — when this verification occurred relative to attempt lifecycle" }
      - { name: factor_results, type: object, source: input, description: "Per-factor results: { id_card: bool, face: bool, live_detection: bool }; all three required" }
      - { name: outcome, type: enum, source: computed, description: "PASS if all three factors true; MISMATCH if any false" }
      - { name: triggered_by_event_id, type: string, source: input, description: "AbnormalEvent.id that triggered an IN_EXAM_RECHECK; null for PRE_EXAM" }

  - name: AbnormalEvent
    parent: ExamAttempt
    common_fields: false              # Append-only event log
    fields:
      - { name: attempt_id, type: string, source: system, description: "Parent ExamAttempt id" }
      - { name: detected_at, type: integer, source: input, description: "Unix seconds of detection (server-clamped to ACTIVE interval)" }
      - { name: monitoring_channel, type: enum, source: input, description: "SCREEN | CAMERA | AUDIO | PROCESS | NETWORK" }
      - { name: behavior_rule_code, type: enum, source: input, description: "FACE_LEAVE | MULTI_PERSON | WINDOW_SWITCH | EXTERNAL_DEVICE" }
      - { name: severity, type: enum, source: computed, description: "INFO | WARNING | CRITICAL — computed from severity_classification" }
      - { name: severity_score, type: number, source: computed, description: "Numeric score per severity_classification formula" }
      - { name: marking_mode, type: enum, source: input, description: "REALTIME_ALERT (auto-emitted by monitoring) | AFTER_THE_FACT (proctor review after submission)" }
      - { name: evidence_clip_uri, type: string, source: input, description: "URI of archived evidence clip; required for severity != INFO" }
      - { name: forced_recheck_emitted, type: boolean, source: computed, default: false, description: "True when this event triggered creation of an IdentityVerificationRecord (only fires for CRITICAL face/identity rules during ACTIVE)" }

  - name: GradingAssignment
    parent: ExamAttempt
    common_fields: true
    fields:
      - { name: attempt_id, type: string, source: system, description: "Parent ExamAttempt id" }
      - { name: question_id, type: string, source: input, description: "Question being graded; MUST be subjective (SHORT_ANSWER or ESSAY)" }
      - { name: marker_id, type: string, source: input, description: "Opaque marker identifier; X-User-ID for role Marker" }
      - { name: blind_slot, type: enum, source: system, description: "BLIND_A | BLIND_B | ARBITRATION — first two markers fill BLIND_A/BLIND_B; ARBITRATION is spawned only when their delta exceeds ARBITRATION_THRESHOLD" }
      - { name: candidate_answer_snapshot, type: string, source: system, description: "Frozen copy of candidate's response at GradingAssignment creation; immutable" }
      - { name: awarded_points, type: number, source: input, description: "Points awarded by this marker; required when transitioning to SUBMITTED; 0 <= awarded_points <= question.max_points" }
      - { name: rubric_breakdown, type: array, source: input, description: "Per-keypoint awarded sub-points; sum MUST equal awarded_points" }
      - { name: status, type: enum, source: system, description: "PENDING → IN_PROGRESS → SUBMITTED → RESOLVED (cycles back to IN_PROGRESS via ARBITRATION when blind_A vs blind_B disagree); DISCARDED is terminal" }

  - name: Appeal
    parent: ExamAttempt
    common_fields: true
    fields:
      - { name: attempt_id, type: string, source: system, description: "Parent ExamAttempt id" }
      - { name: question_id, type: string, source: input, description: "Specific question being appealed; MUST appear in attempt.paper_question_ids" }
      - { name: candidate_reason, type: string, source: input, description: "Candidate-supplied appeal rationale" }
      - { name: secondary_awarded_points, type: number, source: input, description: "Points decided by AppealOfficer during secondary marking; required when transitioning to APPROVED or REJECTED" }
      - { name: decision, type: enum, source: input, description: "APPROVED | REJECTED — APPROVED triggers score adjustment cascade" }
      - { name: score_delta, type: number, source: computed, description: "secondary_awarded_points - prior_awarded_points; can be negative" }
      - { name: status, type: enum, source: system, description: "SUBMITTED → UNDER_REVIEW → DECISION_PENDING → APPROVED / REJECTED (terminal)" }

  - name: AuditLogEntry
    parent: null
    common_fields: false              # Append-only; only id + created_at
    fields:
      - { name: subject_type, type: enum, source: input, description: "EXAM_ATTEMPT | ABNORMAL_EVENT | APPEAL | SCORE_ADJUSTMENT — polymorphic reference" }
      - { name: subject_id, type: string, source: input, description: "Id of the subject entity instance" }
      - { name: actor_role, type: string, source: input, description: "Role that triggered the audited action" }
      - { name: actor_id, type: string, source: input, description: "X-User-ID of the actor" }
      - { name: action_code, type: enum, source: input, description: "ABNORMAL_EVENT_RECORDED | IDENTITY_MISMATCH | FORCED_SUBMIT | APPEAL_APPROVED | SCORE_ADJUSTED" }
      - { name: delta, type: object, source: input, description: "Free-form { before, after } pair; pinned shape depends on action_code" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Exam
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: OPEN_REGISTRATION
        trigger: POST /exams/{examId}/open-registration
        actor: ExamAdmin
        preconditions:
          - "At least one Question exists under this Exam (ERR_QUESTION_BANK_EMPTY)"
          - "sampling_rule_spec is feasible against the question bank (ERR_SAMPLING_INFEASIBLE)"
        side_effects:
          - "max_score recomputed = sum(Question.max_points)"
      - from: OPEN_REGISTRATION
        to: READY
        trigger: POST /exams/{examId}/close-registration
        actor: ExamAdmin
        preconditions: []
        side_effects: []
      - from: READY
        to: IN_SESSION
        trigger: "system (automatic when _clock advances to >= Exam.start_time)"
        actor: system
        preconditions:
          - "_clock.now >= Exam.start_time"
        side_effects: []
      - from: IN_SESSION
        to: GRADING
        trigger: "system (automatic when _clock advances to >= Exam.end_time)"
        actor: system
        preconditions:
          - "_clock.now >= Exam.end_time"
        side_effects:
          - "All ExamAttempts still ACTIVE or SUSPENDED → SUBMITTED (forced_submit cascade)"
          - "AuditLogEntry rows appended for every forced submit (action_code=FORCED_SUBMIT)"
      - from: GRADING
        to: SCORES_PUBLISHED
        trigger: POST /exams/{examId}/publish-scores
        actor: ExamAdmin
        preconditions:
          - "grading_progress_pct == 100 (ERR_GRADING_INCOMPLETE)"
        side_effects:
          - "final_score frozen on every non-DISQUALIFIED ExamAttempt; status → FINALIZED"
      - from: SCORES_PUBLISHED
        to: APPEAL_WINDOW
        trigger: "system (automatic when _clock advances to publish_time +1s)"
        actor: system
        preconditions: []
        side_effects: []
      - from: APPEAL_WINDOW
        to: ARCHIVED
        trigger: "system (automatic when _clock advances to publish_time + appeal_window_seconds)"
        actor: system
        preconditions: []
        side_effects:
          - "All PENDING Appeal rows auto-transition SUBMITTED→REJECTED (timeout)"

  - entity: CandidateRegistration
    initial_state: REGISTERED
    terminal_states: [DISQUALIFIED]
    transitions:
      - from: REGISTERED
        to: DISQUALIFIED
        trigger: "system (cascade from ExamAttempt → DISQUALIFIED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ExamAttempt
    initial_state: ENROLLED
    terminal_states: [FINALIZED, DISQUALIFIED]
    transitions:
      - from: ENROLLED
        to: IDENTITY_PENDING
        trigger: POST /exams/{examId}/attempts/{attemptId}/begin-identity-check
        actor: Candidate
        preconditions:
          - "Exam.status == IN_SESSION (ERR_EXAM_NOT_IN_SESSION)"
        side_effects: []
      - from: IDENTITY_PENDING
        to: ACTIVE
        trigger: POST /exams/{examId}/attempts/{attemptId}/identity-verifications  # PRE_EXAM verification
        actor: Candidate
        preconditions:
          - "Latest IdentityVerificationRecord.outcome == PASS (ERR_IDENTITY_MISMATCH)"
          - "Exam.status == IN_SESSION (ERR_EXAM_NOT_IN_SESSION)"
        side_effects:
          - "started_at set to _clock.now"
          - "Paper composition: paper_question_ids and paper_option_order generated by paper_composition_sampling and option_shuffle; paper_version_hash computed"
          - "identity_verification_count += 1"
      - from: IDENTITY_PENDING
        to: DISQUALIFIED
        trigger: POST /exams/{examId}/attempts/{attemptId}/identity-verifications  # PRE_EXAM, MISMATCH outcome
        actor: Candidate
        preconditions: []
        side_effects:
          - "CandidateRegistration.status → DISQUALIFIED (cascade)"
          - "AuditLogEntry appended (action_code=IDENTITY_MISMATCH)"
          - "identity_verification_count += 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: POST /exams/{examId}/attempts/{attemptId}/network-disconnect
        actor: Candidate
        preconditions: []
        side_effects:
          - "current_suspend_started_at = _clock.now"
      - from: SUSPENDED
        to: ACTIVE
        trigger: POST /exams/{examId}/attempts/{attemptId}/network-resume
        actor: Candidate
        preconditions:
          - "Exam.status == IN_SESSION (ERR_EXAM_NOT_IN_SESSION)"
          - "_clock.now < Exam.end_time (else forced_submit wins per priority pair)"
        side_effects:
          - "suspended_total_seconds += (_clock.now - current_suspend_started_at)"
          - "current_suspend_started_at = null"
      - from: ACTIVE
        to: ACTIVE
        trigger: POST /exams/{examId}/attempts/{attemptId}/identity-verifications  # IN_EXAM_RECHECK, PASS outcome
        actor: Candidate
        preconditions:
          - "An AbnormalEvent with severity == CRITICAL and behavior_rule_code in {FACE_LEAVE, MULTI_PERSON} exists for this attempt with forced_recheck_emitted=true and no later IdentityVerificationRecord (ERR_NO_PENDING_RECHECK)"
        side_effects:
          - "identity_verification_count += 1"
        note: "Self-transition documenting in-exam re-verification PASS; preserves ACTIVE state"
      - from: ACTIVE
        to: DISQUALIFIED
        trigger: POST /exams/{examId}/attempts/{attemptId}/identity-verifications  # IN_EXAM_RECHECK, MISMATCH outcome
        actor: Candidate
        preconditions: []
        side_effects:
          - "CandidateRegistration.status → DISQUALIFIED (cascade)"
          - "AuditLogEntry appended (action_code=IDENTITY_MISMATCH)"
          - "All PENDING/IN_PROGRESS GradingAssignment for this attempt → DISCARDED"
          - "final_score forced to 0; provisional_score forced to 0"
          - "identity_verification_count += 1"
      - from: ACTIVE
        to: DISQUALIFIED
        trigger: POST /exams/{examId}/attempts/{attemptId}/abnormal-events    # severity=CRITICAL on MULTI_PERSON or EXTERNAL_DEVICE
        actor: Proctor
        preconditions: []
        side_effects:
          - "CandidateRegistration.status → DISQUALIFIED (cascade)"
          - "final_score forced to 0; provisional_score forced to 0 (depth-3 cascade hop 2)"
          - "Exam.grading_progress_pct recomputed (depth-3 cascade hop 3)"
          - "AuditLogEntry appended (action_code=SCORE_ADJUSTED, before/after captured)"
      - from: ACTIVE
        to: SUBMITTED
        trigger: POST /exams/{examId}/attempts/{attemptId}/submit
        actor: Candidate
        preconditions:
          - "Exam.status == IN_SESSION (ERR_EXAM_NOT_IN_SESSION)"
        side_effects:
          - "submitted_at = _clock.now"
          - "Objective questions auto-graded immediately"
          - "GradingAssignment rows created (PENDING) for each subjective question (2 blind slots each)"
      - from: SUBMITTED
        to: SUBMITTED
        trigger: "system (forced_submit on _clock.now >= Exam.end_time while still ACTIVE/SUSPENDED)"
        actor: system
        preconditions: []
        side_effects:
          - "submitted_at = Exam.end_time"
          - "Objective auto-graded; subjective GradingAssignment rows created"
          - "AuditLogEntry appended (action_code=FORCED_SUBMIT)"
        note: "Logical 'from: ACTIVE or SUSPENDED' shorthand — both forced into SUBMITTED at end_time"
      - from: SUBMITTED
        to: GRADED
        trigger: "system (automatic when all GradingAssignment rows for the attempt are RESOLVED or DISCARDED)"
        actor: system
        preconditions: []
        side_effects:
          - "final_score recomputed via final_score_calculation"
          - "Exam.grading_progress_pct recomputed"
      - from: GRADED
        to: FINALIZED
        trigger: "system (cascade from Exam → SCORES_PUBLISHED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: GradingAssignment
    initial_state: PENDING
    terminal_states: [RESOLVED, DISCARDED]
    transitions:
      - from: PENDING
        to: IN_PROGRESS
        trigger: POST /exams/{examId}/grading-assignments/{assignmentId}/claim
        actor: Marker
        preconditions:
          - "Marker has not previously claimed the other blind_slot for this (attempt_id, question_id) pair (ERR_DOUBLE_BLIND_VIOLATION)"
        side_effects: []
      - from: IN_PROGRESS
        to: SUBMITTED
        trigger: POST /exams/{examId}/grading-assignments/{assignmentId}/score
        actor: Marker
        preconditions:
          - "sum(rubric_breakdown.points) == awarded_points (ERR_RUBRIC_SUM_MISMATCH)"
          - "0 <= awarded_points <= Question.max_points (ERR_AWARDED_OUT_OF_RANGE)"
        side_effects: []
      - from: SUBMITTED
        to: RESOLVED
        trigger: "system (automatic when sibling blind_slot is SUBMITTED and |delta| <= ARBITRATION_THRESHOLD)"
        actor: system
        preconditions: []
        side_effects:
          - "ExamAttempt.provisional_score recomputed"
      - from: SUBMITTED
        to: IN_PROGRESS
        trigger: "system (automatic when sibling blind_slot is SUBMITTED and |delta| > ARBITRATION_THRESHOLD — a third GradingAssignment row is spawned as the arbitrator slot)"
        actor: system
        preconditions: []
        side_effects:
          - "A third GradingAssignment row spawned with blind_slot=ARBITRATION (extends the enum), status=PENDING, marker_id=null"
          - "The two SUBMITTED sibling rows remain SUBMITTED until the arbitrator scores; then all three transition to RESOLVED simultaneously"
        note: "Cycle: SUBMITTED → IN_PROGRESS via arbitration loop. The ARBITRATION row, once scored, takes status RESOLVED and pulls the two siblings with it."
      - from: PENDING
        to: DISCARDED
        trigger: "system (cascade when ExamAttempt → DISQUALIFIED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: DISCARDED
        trigger: "system (cascade when ExamAttempt → DISQUALIFIED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Appeal
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: POST /exams/{examId}/appeals/{appealId}/claim
        actor: AppealOfficer
        preconditions:
          - "AppealOfficer.id NOT IN {marker_id of any GradingAssignment for (attempt_id, question_id)} (ERR_APPEAL_OFFICER_WAS_MARKER)"
          - "Exam.status == APPEAL_WINDOW (ERR_EXAM_NOT_IN_APPEAL_WINDOW)"
        side_effects: []
      - from: UNDER_REVIEW
        to: DECISION_PENDING
        trigger: POST /exams/{examId}/appeals/{appealId}/secondary-mark
        actor: AppealOfficer
        preconditions:
          - "0 <= secondary_awarded_points <= Question.max_points (ERR_AWARDED_OUT_OF_RANGE)"
        side_effects:
          - "score_delta = secondary_awarded_points - prior_awarded_points"
      - from: DECISION_PENDING
        to: APPROVED
        trigger: POST /exams/{examId}/appeals/{appealId}/decide  # body: decision=APPROVED
        actor: AppealOfficer
        preconditions: []
        side_effects:
          - "ExamAttempt.final_score += score_delta (depth-2 cascade hop 1)"
          - "AuditLogEntry appended (action_code=APPEAL_APPROVED + SCORE_ADJUSTED with before/after final_score, depth-2 cascade hop 2)"
      - from: DECISION_PENDING
        to: REJECTED
        trigger: POST /exams/{examId}/appeals/{appealId}/decide  # body: decision=REJECTED
        actor: AppealOfficer
        preconditions: []
        side_effects:
          - "AuditLogEntry appended (action_code=APPEAL_APPROVED with decision=REJECTED is misnomer; use SCORE_ADJUSTED skipped — only audit row written for traceability)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "system (cascade when Exam.status transitions APPEAL_WINDOW → ARCHIVED with appeal still PENDING)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two Markers simultaneously claim the same GradingAssignment"
    guarantee: "Exactly one claim succeeds; second is rejected"
    error_id: ERR_GRADING_ALREADY_CLAIMED
    http_status: 409
    serialization: "First-writer-wins on GradingAssignment.marker_id transitioning PENDING→IN_PROGRESS"

  - scenario: "Same Marker tries to claim both blind_slots for a single (attempt_id, question_id) pair concurrently"
    guarantee: "At most one of the two claims succeeds; the other rejected to preserve double-blind"
    error_id: ERR_DOUBLE_BLIND_VIOLATION
    http_status: 409
    serialization: "First-writer-wins on (attempt_id, question_id, marker_id) tuple"

  - scenario: "Candidate submits attempt while system forced_submit fires at end_time"
    guarantee: "Exactly one transition to SUBMITTED is recorded; the loser receives ERR_INVALID_STATE because the attempt is no longer ACTIVE"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on ExamAttempt.status leaving ACTIVE"

  - scenario: "Network-resume race with forced_submit at end_time"
    guarantee: "If _clock.now >= end_time, resume is rejected — forced_submit wins"
    error_id: ERR_EXAM_WINDOW_CLOSED
    http_status: 409
    serialization: "Server-side timing check evaluated atomically against ExamAttempt.status"

  - scenario: "Two AbnormalEvent inserts of severity=CRITICAL on the same ACTIVE attempt cascade DISQUALIFIED"
    guarantee: "Both events are persisted; exactly one cascade to DISQUALIFIED is applied (idempotent score-zeroing)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on ExamAttempt.status leaving ACTIVE; subsequent CRITICAL events still persist but get ERR_INVALID_STATE on the cascade attempt"

  - scenario: "Two AppealOfficers claim the same SUBMITTED Appeal"
    guarantee: "First-writer-wins; loser receives ERR_INVALID_STATE because appeal is no longer SUBMITTED"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Appeal.status leaving SUBMITTED"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: paper_composition_sampling
    trigger: "ExamAttempt IDENTITY_PENDING → ACTIVE (PRE_EXAM PASS)"
    algorithm: combinatorial_sampling
    formula: |
      Inputs: Exam.sampling_rule_type, Exam.sampling_rule_spec, Question rows for the exam,
              deterministic seed = sha256(attempt.id)[:16] as uint64.

      Mode RANDOM:
        spec = { target_count: int }
        Eligible pool = all Questions under the exam.
        If len(pool) < target_count: ERR_SAMPLING_INFEASIBLE.
        Use seed to shuffle pool with a stable algorithm (Fisher–Yates), take first target_count.

      Mode STRATIFIED:
        spec = { difficulty_buckets: { EASY: int, MEDIUM: int, HARD: int } }
        For each bucket B: eligible = Questions with difficulty == B; if len(eligible) < spec[B]:
          ERR_SAMPLING_INFEASIBLE. Shuffle eligible with seed (independent stream per bucket),
          take first spec[B]. Concatenate buckets in order [EASY, MEDIUM, HARD].

      Mode BLUEPRINT:
        spec = { slots: ordered list of { topic, question_type, difficulty, count } }
        For each slot S in declared order: eligible = Questions matching all three filters;
        if len(eligible) < S.count: ERR_SAMPLING_INFEASIBLE. Shuffle with seed (independent
        stream per slot), take first S.count. Concatenate slots in declared order.

      Option shuffling (after question selection):
        For each selected Question whose question_type IN {SINGLE_CHOICE, MULTI_CHOICE}:
          If Exam.option_shuffle == true: shuffle question.options with a new seed
            sha256(attempt.id || question.id)[:16] as uint64.
          Else: keep original option order.
          Record the resulting key sequence in paper_option_order[question.id].

      Output:
        paper_question_ids := the concatenated ordered list
        paper_option_order := the per-question option key sequence
        paper_version_hash := sha256(json_canonical({ ids: paper_question_ids,
                                                     opts: paper_option_order,
                                                     exam_version: exam.version }))
    input_set: "All Question rows under the exam; sampling_rule_type drives branch (RANDOM/STRATIFIED/BLUEPRINT)"
    constants:
      SEED_HASH_ALG: sha256
    precision: "Exact (no floating-point)"

  - name: severity_classification
    trigger: "AbnormalEvent creation (POST .../abnormal-events)"
    algorithm: threshold
    formula: |
      Inputs: behavior_rule_code, monitoring_channel, marking_mode.

      Base score by behavior_rule_code:
        FACE_LEAVE       => 30
        MULTI_PERSON     => 70
        WINDOW_SWITCH    => 40
        EXTERNAL_DEVICE  => 80

      Channel multiplier:
        SCREEN, NETWORK  => 1.0
        CAMERA, AUDIO    => 1.2
        PROCESS          => 1.1

      Marking-mode multiplier:
        REALTIME_ALERT   => 1.0
        AFTER_THE_FACT   => 0.5  (penalty halved when discovered post-hoc)

      severity_score = round(base * channel_mult * mode_mult, 2)   # round_half_up, 2 dp

      severity bucket:
        severity_score < 35          => INFO
        35 <= severity_score < 70    => WARNING
        severity_score >= 70         => CRITICAL

      forced_recheck_emitted = true iff severity == CRITICAL AND
                                       behavior_rule_code IN {FACE_LEAVE, MULTI_PERSON} AND
                                       ExamAttempt.status == ACTIVE
    constants:
      BASE_FACE_LEAVE: 30
      BASE_MULTI_PERSON: 70
      BASE_WINDOW_SWITCH: 40
      BASE_EXTERNAL_DEVICE: 80
      THRESHOLD_INFO_HI: 35
      THRESHOLD_WARNING_HI: 70
    precision: "round_half_up to 2 decimal places"
    variants:
      - name: realtime_variant
        when: "marking_mode == REALTIME_ALERT (event emitted during ACTIVE attempt)"
        difference: "Full multiplier (1.0); can trigger forced_recheck"
      - name: after_the_fact_variant
        when: "marking_mode == AFTER_THE_FACT (proctor review post-submit)"
        difference: "Multiplier halved (0.5); never triggers forced_recheck (attempt is no longer ACTIVE)"

  - name: provisional_score_calculation
    trigger: "GradingAssignment SUBMITTED→RESOLVED, ExamAttempt SUBMITTED, AbnormalEvent CRITICAL cascade"
    algorithm: aggregation
    formula: |
      Objective points (always finalizable at submission):
        objective_points = sum over Question q in paper_question_ids where q.question_type IN
          {SINGLE_CHOICE, MULTI_CHOICE, TRUE_FALSE} of:
            q.max_points if candidate_answer matches q.correct_answer exactly (set equality
              for MULTI_CHOICE; scalar equality otherwise), else 0.

      Subjective provisional points (only RESOLVED GradingAssignment rows are counted):
        For each subjective question q in paper_question_ids:
          Let resolved_rows = GradingAssignment rows where attempt_id=this AND question_id=q
                              AND status == RESOLVED.
          If resolved_rows is empty:
            per_question_subjective[q] = 0
          Elif len(resolved_rows) == 2 (BLIND_A + BLIND_B, no arbitration needed):
            per_question_subjective[q] = round( (BLIND_A.awarded + BLIND_B.awarded) / 2, 2 )
              # ROUND-PER-QUESTION FIRST — pinned ordering
          Elif len(resolved_rows) == 3 (BLIND_A + BLIND_B + ARBITRATION):
            per_question_subjective[q] = round( ARBITRATION.awarded_points, 2 )
              # Arbitration value supersedes; the two blinds remain RESOLVED for audit but
              # do not contribute to the score
        subjective_points = sum( per_question_subjective[q] for q in paper_question_ids )
                            # ROUND THEN SUM — sum is exact, not re-rounded

      provisional_score = objective_points + subjective_points
    input_set: "All Questions in paper_question_ids; RESOLVED GradingAssignment rows only (excludes PENDING/IN_PROGRESS/SUBMITTED/DISCARDED)"
    constants:
      ARBITRATION_THRESHOLD: 2.0   # If |BLIND_A.awarded - BLIND_B.awarded| > 2.0, an ARBITRATION row is spawned
    precision: "round_half_up to 2 dp per question, then exact sum"
    variants:
      - name: provisional
        when: "Exam.status in {GRADING}; some subjective questions not yet RESOLVED"
        difference: "Treats unresolved questions as 0; underestimates final_score"
      - name: final
        when: "Exam.status SCORES_PUBLISHED; all RESOLVED"
        difference: "Same formula but evaluated when every subjective question has a RESOLVED row; equals final_score before appeal adjustments"

  - name: final_score_calculation
    trigger: "ExamAttempt → GRADED, Exam → SCORES_PUBLISHED, Appeal → APPROVED cascade"
    algorithm: aggregation
    formula: |
      Same as provisional_score_calculation when entering GRADED.
      Then on Appeal → APPROVED: final_score := final_score + Appeal.score_delta
      (delta computed in §1.2 Appeal DECISION_PENDING transition: score_delta =
       secondary_awarded_points - prior_awarded_points, where prior_awarded_points is
       per_question_subjective[question_id] used in the most recent final_score_calculation).

      Disqualification override:
        If ExamAttempt.status == DISQUALIFIED, final_score := 0 (overrides everything).
    input_set: "Same as provisional plus Appeal.score_delta for APPROVED appeals on this attempt"
    constants: {}
    precision: "round_half_up to 2 dp per question, then exact sum"
    variants:
      - name: pre_appeal_final
        when: "ExamAttempt status == GRADED, no APPROVED appeals yet"
        difference: "Equals provisional with full RESOLVED set"
      - name: post_appeal_final
        when: "At least one APPROVED Appeal applied"
        difference: "Equals pre_appeal_final plus algebraic sum of score_delta values"

  - name: grading_progress_pct
    trigger: "GradingAssignment status change, ExamAttempt → SUBMITTED/DISQUALIFIED, Exam.status read"
    algorithm: aggregation
    formula: |
      total_slots = count(GradingAssignment rows where attempt's Exam == this exam AND
                          attempt.status NOT IN {DISQUALIFIED})
      done_slots  = count of those whose status IN {RESOLVED, DISCARDED}
      grading_progress_pct = 100 if total_slots == 0 else round(100 * done_slots / total_slots, 2)
    input_set: "All GradingAssignment rows under non-DISQUALIFIED ExamAttempts of this Exam"
    precision: "round_half_up to 2 dp"

  - name: identity_verification_count_invariant
    trigger: "Read on ExamAttempt; recomputed in tests"
    algorithm: aggregation
    formula: |
      identity_verification_count == count(IdentityVerificationRecord
                                           where attempt_id == this attempt.id)
      Must hold after every PRE_EXAM creation, every IN_EXAM_RECHECK creation, and every
      DISQUALIFIED cascade (cascade does NOT delete records; invariant preserved).
    input_set: "All IdentityVerificationRecord rows for the attempt"
    precision: "Integer, exact"

  - name: appeal_window_close
    trigger: "_clock advance past Exam.publish_time + appeal_window_seconds"
    algorithm: chronological
    formula: |
      All Appeal rows with status IN {SUBMITTED, UNDER_REVIEW, DECISION_PENDING} at the
      instant Exam.status transitions APPEAL_WINDOW → ARCHIVED are forcibly transitioned
      to REJECTED. No score adjustment. AuditLogEntry NOT appended (terminal cascade).
    input_set: "All Appeal rows for the Exam in non-terminal status"
    precision: "Exact"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per RBAC matrix (and entity-backed identity matches when required)"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path resource ids resolve left-to-right (examId, then attemptId, then assignmentId/appealId)"
    error_id: "ERR_EXAM_NOT_FOUND | ERR_QUESTION_NOT_FOUND | ERR_REGISTRATION_NOT_FOUND | ERR_ATTEMPT_NOT_FOUND | ERR_GRADING_ASSIGNMENT_NOT_FOUND | ERR_APPEAL_NOT_FOUND"
    http_status: 404
    applies_to: all nested resource endpoints

  - priority: 4
    category: state
    check: "Exam.status matches operation prerequisite (e.g., paper-generation only IN_SESSION; appeals only APPEAL_WINDOW)"
    error_id: "ERR_EXAM_NOT_IN_SESSION | ERR_EXAM_NOT_IN_APPEAL_WINDOW | ERR_EXAM_NOT_GRADING | ERR_INVALID_STATE"
    http_status: 409
    applies_to: "operations gated by Exam lifecycle"

  - priority: 5
    category: state
    check: "Target resource (ExamAttempt | GradingAssignment | Appeal) is in correct state for this operation"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "state-transition endpoints"

  - priority: 6
    category: business_safety
    check: "Identity verification outcome MUST be PASS to transition IDENTITY_PENDING→ACTIVE or remain ACTIVE on in-exam recheck; MISMATCH triggers DISQUALIFIED cascade"
    error_id: ERR_IDENTITY_MISMATCH
    http_status: 422
    applies_to: "POST .../identity-verifications, POST .../submit (priority over state when forced_submit collision)"

  - priority: 7
    category: business_safety
    check: "Forced submit at exam end_time overrides candidate-initiated state transitions (network-resume, submit, in-exam recheck) once _clock.now >= end_time"
    error_id: ERR_EXAM_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST .../network-resume, POST .../submit, POST .../identity-verifications during ACTIVE"

  - priority: 8
    category: business_referential
    check: "GradingAssignment.marker_id MUST NOT equal any prior marker_id for the same (attempt_id, question_id) — preserves double-blind"
    error_id: ERR_DOUBLE_BLIND_VIOLATION
    http_status: 409
    applies_to: "POST .../grading-assignments/{id}/claim"

  - priority: 9
    category: business_referential
    check: "AppealOfficer claiming an Appeal MUST NOT equal any GradingAssignment.marker_id under the same (attempt_id, question_id)"
    error_id: ERR_APPEAL_OFFICER_WAS_MARKER
    http_status: 409
    applies_to: "POST .../appeals/{id}/claim"

  - priority: 10
    category: business_constraint
    check: "sampling_rule_spec must be feasible against the current question bank; question bank must be non-empty"
    error_id: "ERR_QUESTION_BANK_EMPTY | ERR_SAMPLING_INFEASIBLE"
    http_status: 422
    applies_to: "POST /exams/{examId}/open-registration"

  - priority: 11
    category: business_constraint
    check: "Question.rubric for subjective questions: sum(keypoint.points) MUST equal max_points; objective questions MUST omit rubric"
    error_id: ERR_RUBRIC_INVALID
    http_status: 422
    applies_to: "POST /exams/{examId}/questions"

  - priority: 12
    category: business_constraint
    check: "GradingAssignment.awarded_points MUST satisfy 0 <= awarded_points <= question.max_points AND sum(rubric_breakdown.points) == awarded_points"
    error_id: "ERR_AWARDED_OUT_OF_RANGE | ERR_RUBRIC_SUM_MISMATCH"
    http_status: 422
    applies_to: "POST .../grading-assignments/{id}/score"

  - priority: 13
    category: business_referential
    check: "Appeal.question_id MUST appear in attempt.paper_question_ids (you can only appeal a question you saw)"
    error_id: ERR_QUESTION_NOT_ON_PAPER
    http_status: 422
    applies_to: "POST .../appeals"

  - priority: 14
    category: business_temporal
    check: "Appeal submission only allowed while Exam.status == APPEAL_WINDOW; appeals SUBMITTED before the window closes survive even if their decision is later"
    error_id: ERR_EXAM_NOT_IN_APPEAL_WINDOW
    http_status: 409
    applies_to: "POST .../appeals"

  - priority: 15
    category: business_constraint
    check: "Appeal.secondary_awarded_points MUST satisfy 0 <= value <= question.max_points"
    error_id: ERR_AWARDED_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST .../appeals/{id}/secondary-mark"

  - priority: 16
    category: business_referential
    check: "AbnormalEvent.evidence_clip_uri required when computed severity != INFO"
    error_id: ERR_EVIDENCE_REQUIRED
    http_status: 422
    applies_to: "POST .../abnormal-events"

  - priority: 17
    category: business_constraint
    check: "Pagination: limit in [1,100], offset >= 0"
    error_id: ERR_INVALID_PAGINATION_PARAMETERS
    http_status: 400
    applies_to: "all list endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Test-driving system endpoints (REQUIRED for state reachability) ----
  - method: POST
    path: "/_clock/advance"
    description: "Advance server clock to the supplied unix-second instant; drives all time-gated automatic transitions (Exam IN_SESSION/GRADING/APPEAL_WINDOW/ARCHIVED entry, forced_submit, appeal_window_close)"
    roles: [TestHarness]
    code: 200
    input: [to_unix_seconds]
    output: null
    side_effects:
      - "Triggers all eligible automatic Exam transitions and forced_submit cascades up to to_unix_seconds"
      - "Closes appeal window if to_unix_seconds >= publish_time + appeal_window_seconds"

  # ---- Exam (lifecycle) ----
  - method: POST
    path: "/exams"
    description: "Create a new Exam in DRAFT"
    roles: [ExamAdmin]
    code: 201
    input: [title, start_time, end_time, "appeal_window_seconds?", "per_question_time_limit_seconds?", sampling_rule_type, sampling_rule_spec, "option_shuffle?"]
    output: Exam
    side_effects: ["status = DRAFT; max_score = 0; grading_progress_pct = 0"]

  - method: GET
    path: "/exams"
    description: "List exams"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "Exam[]"
    side_effects: []

  - method: GET
    path: "/exams/{examId}"
    description: "Get an exam"
    roles: [Any]
    code: 200
    input: []
    output: Exam
    side_effects: []

  - method: POST
    path: "/exams/{examId}/open-registration"
    description: "DRAFT → OPEN_REGISTRATION; checks question bank non-empty AND sampling feasibility"
    roles: [ExamAdmin]
    code: 200
    input: []
    output: Exam
    side_effects: ["max_score recomputed", "status → OPEN_REGISTRATION"]

  - method: POST
    path: "/exams/{examId}/close-registration"
    description: "OPEN_REGISTRATION → READY"
    roles: [ExamAdmin]
    code: 200
    input: []
    output: Exam
    side_effects: ["status → READY"]

  - method: POST
    path: "/exams/{examId}/publish-scores"
    description: "GRADING → SCORES_PUBLISHED; gated by grading_progress_pct == 100"
    roles: [ExamAdmin]
    code: 200
    input: []
    output: Exam
    side_effects:
      - "status → SCORES_PUBLISHED; subsequent _clock tick advances to APPEAL_WINDOW"
      - "Non-DISQUALIFIED attempts → FINALIZED; final_score frozen"

  # ---- Question (bank) ----
  - method: POST
    path: "/exams/{examId}/questions"
    description: "Add a question to the bank"
    roles: [ExamAdmin]
    code: 201
    input: [question_type, difficulty, topic, stem, "options?", correct_answer, max_points, "rubric?"]
    output: Question
    side_effects:
      - "Exam.max_score recomputed (only persists after open-registration runs)"

  - method: GET
    path: "/exams/{examId}/questions"
    description: "List questions for an exam"
    roles: [ExamAdmin, Proctor]
    code: 200
    input: ["limit?", "offset?"]
    output: "Question[]"
    side_effects: []

  - method: GET
    path: "/exams/{examId}/questions/{questionId}"
    description: "Get a question"
    roles: [ExamAdmin, Proctor]
    code: 200
    input: []
    output: Question
    side_effects: []

  # ---- CandidateRegistration ----
  - method: POST
    path: "/exams/{examId}/registrations"
    description: "Register a candidate for an exam (only during OPEN_REGISTRATION)"
    roles: [ExamAdmin]
    code: 201
    input: [candidate_id, id_card_number]
    output: CandidateRegistration
    side_effects: ["status = REGISTERED"]

  - method: GET
    path: "/exams/{examId}/registrations"
    description: "List registrations for an exam"
    roles: [ExamAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "CandidateRegistration[]"
    side_effects: []

  # ---- ExamAttempt ----
  - method: POST
    path: "/exams/{examId}/attempts"
    description: "Create an attempt for a registration (one per registration; Exam must be IN_SESSION); attempt starts in ENROLLED"
    roles: [Candidate]
    code: 201
    input: [registration_id]
    output: ExamAttempt
    side_effects: ["status = ENROLLED; candidate_id mirrored from registration"]

  - method: GET
    path: "/exams/{examId}/attempts/{attemptId}"
    description: "Get an attempt (only visible to the Candidate it belongs to or ExamAdmin/Proctor)"
    roles: [Candidate, ExamAdmin, Proctor]
    code: 200
    input: []
    output: ExamAttempt
    side_effects: []

  - method: POST
    path: "/exams/{examId}/attempts/{attemptId}/begin-identity-check"
    description: "ENROLLED → IDENTITY_PENDING"
    roles: [Candidate]
    code: 200
    input: []
    output: ExamAttempt
    side_effects: ["status → IDENTITY_PENDING"]

  - method: POST
    path: "/exams/{examId}/attempts/{attemptId}/identity-verifications"
    description: "Submit identity verification (PRE_EXAM gates ACTIVE; IN_EXAM_RECHECK gates remaining ACTIVE or DISQUALIFY); appends an IdentityVerificationRecord"
    roles: [Candidate]
    code: 201
    input: [verification_phase, factor_results, "triggered_by_event_id?"]
    output: IdentityVerificationRecord
    side_effects:
      - "outcome computed (PASS iff all three factors true)"
      - "PRE_EXAM PASS: ExamAttempt IDENTITY_PENDING→ACTIVE, paper composed, paper_version_hash archived"
      - "PRE_EXAM MISMATCH: ExamAttempt IDENTITY_PENDING→DISQUALIFIED, registration cascaded"
      - "IN_EXAM_RECHECK PASS: ExamAttempt stays ACTIVE, identity_verification_count incremented"
      - "IN_EXAM_RECHECK MISMATCH: ExamAttempt ACTIVE→DISQUALIFIED, cascade (final_score=0, gradings DISCARDED, audit appended)"

  - method: POST
    path: "/exams/{examId}/attempts/{attemptId}/network-disconnect"
    description: "ACTIVE → SUSPENDED; records current_suspend_started_at"
    roles: [Candidate]
    code: 200
    input: []
    output: ExamAttempt
    side_effects: ["status → SUSPENDED"]

  - method: POST
    path: "/exams/{examId}/attempts/{attemptId}/network-resume"
    description: "SUSPENDED → ACTIVE; rejected if _clock.now >= Exam.end_time (forced_submit wins)"
    roles: [Candidate]
    code: 200
    input: []
    output: ExamAttempt
    side_effects:
      - "status → ACTIVE; suspended_total_seconds increased by gap"

  - method: POST
    path: "/exams/{examId}/attempts/{attemptId}/abnormal-events"
    description: "Record an abnormal behavior event"
    roles: [Proctor]
    code: 201
    input: [detected_at, monitoring_channel, behavior_rule_code, marking_mode, evidence_clip_uri]
    output: AbnormalEvent
    side_effects:
      - "severity & severity_score computed (severity_classification)"
      - "If severity == CRITICAL AND behavior_rule_code IN {MULTI_PERSON, EXTERNAL_DEVICE} AND attempt.status == ACTIVE: cascade DISQUALIFIED (final_score=0, gradings DISCARDED, registration cascaded, audit appended)"
      - "If severity == CRITICAL AND behavior_rule_code IN {FACE_LEAVE, MULTI_PERSON} AND attempt.status == ACTIVE: forced_recheck_emitted=true (candidate must POST identity-verifications IN_EXAM_RECHECK before any other state-changing call)"

  - method: GET
    path: "/exams/{examId}/attempts/{attemptId}/abnormal-events"
    description: "List abnormal events for an attempt"
    roles: [Proctor, ExamAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "AbnormalEvent[]"
    side_effects: []

  - method: POST
    path: "/exams/{examId}/attempts/{attemptId}/submit"
    description: "ACTIVE → SUBMITTED; auto-grades objective; creates 2 PENDING GradingAssignment rows per subjective question"
    roles: [Candidate]
    code: 200
    input: ["answers?"]   # answers may have been submitted incrementally; final POST locks them
    output: ExamAttempt
    side_effects: ["status → SUBMITTED; objective scored; subjective GradingAssignment created (blind_slot=BLIND_A and BLIND_B)"]

  # ---- GradingAssignment ----
  - method: GET
    path: "/exams/{examId}/grading-assignments"
    description: "List grading assignments (Marker sees only own claims and PENDING pool)"
    roles: [Marker, ExamAdmin]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "GradingAssignment[]"
    side_effects: []

  - method: POST
    path: "/exams/{examId}/grading-assignments/{assignmentId}/claim"
    description: "PENDING → IN_PROGRESS; double-blind invariant enforced"
    roles: [Marker]
    code: 200
    input: []
    output: GradingAssignment
    side_effects: ["status → IN_PROGRESS; marker_id set to X-User-ID"]

  - method: POST
    path: "/exams/{examId}/grading-assignments/{assignmentId}/score"
    description: "IN_PROGRESS → SUBMITTED; sibling auto-resolves or spawns arbitration"
    roles: [Marker]
    code: 200
    input: [awarded_points, rubric_breakdown]
    output: GradingAssignment
    side_effects:
      - "status → SUBMITTED"
      - "If sibling blind_slot also SUBMITTED: if |delta| <= ARBITRATION_THRESHOLD both → RESOLVED, provisional_score recomputed; else third arbitration row spawned"

  # ---- Appeal ----
  - method: POST
    path: "/exams/{examId}/attempts/{attemptId}/appeals"
    description: "Submit an appeal for a question; only during APPEAL_WINDOW"
    roles: [Candidate]
    code: 201
    input: [question_id, candidate_reason]
    output: Appeal
    side_effects: ["status = SUBMITTED"]

  - method: POST
    path: "/exams/{examId}/appeals/{appealId}/claim"
    description: "SUBMITTED → UNDER_REVIEW; AppealOfficer must not be a prior marker"
    roles: [AppealOfficer]
    code: 200
    input: []
    output: Appeal
    side_effects: ["status → UNDER_REVIEW"]

  - method: POST
    path: "/exams/{examId}/appeals/{appealId}/secondary-mark"
    description: "UNDER_REVIEW → DECISION_PENDING; record secondary_awarded_points; compute score_delta"
    roles: [AppealOfficer]
    code: 200
    input: [secondary_awarded_points]
    output: Appeal
    side_effects: ["status → DECISION_PENDING; score_delta = secondary_awarded_points - prior_awarded_points"]

  - method: POST
    path: "/exams/{examId}/appeals/{appealId}/decide"
    description: "DECISION_PENDING → APPROVED/REJECTED; APPROVED applies score_delta cascade"
    roles: [AppealOfficer]
    code: 200
    input: [decision]
    output: Appeal
    side_effects:
      - "APPROVED: ExamAttempt.final_score += score_delta; AuditLogEntry appended (SCORE_ADJUSTED, APPEAL_APPROVED)"
      - "REJECTED: no score adjustment"

  - method: GET
    path: "/exams/{examId}/appeals"
    description: "List appeals (Candidate sees own; AppealOfficer sees all SUBMITTED/UNDER_REVIEW; ExamAdmin sees all)"
    roles: [Candidate, AppealOfficer, ExamAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "Appeal[]"
    side_effects: []

  # ---- AuditLogEntry ----
  - method: GET
    path: "/audit-log"
    description: "List audit log entries (read-only; Audit/Admin roles)"
    roles: [ExamAdmin]
    code: 200
    input: ["subject_type?", "subject_id?", "limit?", "offset?"]
    output: "AuditLogEntry[]"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # Auth / Authz
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header missing or invalid"
  - id: ERR_INSUFFICIENT_PERMISSIONS
    http: 403
    condition: "Role lacks permission for the operation, or entity-backed identity does not match the resource owner"

  # Existence
  - id: ERR_EXAM_NOT_FOUND
    http: 404
    condition: "Exam with examId does not exist"
  - id: ERR_QUESTION_NOT_FOUND
    http: 404
    condition: "Question with questionId does not exist under the exam"
  - id: ERR_REGISTRATION_NOT_FOUND
    http: 404
    condition: "CandidateRegistration does not exist for this exam/candidate"
  - id: ERR_ATTEMPT_NOT_FOUND
    http: 404
    condition: "ExamAttempt does not exist"
  - id: ERR_GRADING_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "GradingAssignment does not exist"
  - id: ERR_APPEAL_NOT_FOUND
    http: 404
    condition: "Appeal does not exist"

  # State
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in the required state for this operation"
  - id: ERR_EXAM_NOT_IN_SESSION
    http: 409
    condition: "Operation requires Exam.status == IN_SESSION"
  - id: ERR_EXAM_NOT_GRADING
    http: 409
    condition: "Operation requires Exam.status == GRADING"
  - id: ERR_EXAM_NOT_IN_APPEAL_WINDOW
    http: 409
    condition: "Operation requires Exam.status == APPEAL_WINDOW"
  - id: ERR_GRADING_INCOMPLETE
    http: 409
    condition: "publish-scores called while grading_progress_pct < 100"
  - id: ERR_EXAM_WINDOW_CLOSED
    http: 409
    condition: "_clock.now >= Exam.end_time; ACTIVE-state mutations rejected — forced_submit owns this transition"
  - id: ERR_NO_PENDING_RECHECK
    http: 409
    condition: "IN_EXAM_RECHECK identity-verification submitted but no outstanding forced_recheck_emitted event exists"

  # Identity / safety
  - id: ERR_IDENTITY_MISMATCH
    http: 422
    condition: "IdentityVerificationRecord.outcome == MISMATCH (at least one factor failed)"
  - id: ERR_EVIDENCE_REQUIRED
    http: 422
    condition: "AbnormalEvent with computed severity != INFO must include evidence_clip_uri"

  # Grading invariants
  - id: ERR_GRADING_ALREADY_CLAIMED
    http: 409
    condition: "GradingAssignment claim race — another marker won"
  - id: ERR_DOUBLE_BLIND_VIOLATION
    http: 409
    condition: "Marker tried to claim a GradingAssignment for an (attempt, question) pair where they previously claimed the sibling blind_slot"
  - id: ERR_AWARDED_OUT_OF_RANGE
    http: 422
    condition: "awarded_points outside [0, question.max_points] OR secondary_awarded_points outside [0, question.max_points]"
  - id: ERR_RUBRIC_SUM_MISMATCH
    http: 422
    condition: "sum(rubric_breakdown.points) != awarded_points"
  - id: ERR_RUBRIC_INVALID
    http: 422
    condition: "Subjective question rubric: sum(keypoint.points) != max_points; OR objective question carries a rubric"

  # Appeal invariants
  - id: ERR_APPEAL_OFFICER_WAS_MARKER
    http: 409
    condition: "AppealOfficer claiming an appeal previously served as a Marker on the same (attempt_id, question_id)"
  - id: ERR_QUESTION_NOT_ON_PAPER
    http: 422
    condition: "Appeal.question_id is not in the attempt's paper_question_ids"

  # Paper composition
  - id: ERR_QUESTION_BANK_EMPTY
    http: 422
    condition: "open-registration attempted with zero questions in the bank"
  - id: ERR_SAMPLING_INFEASIBLE
    http: 422
    condition: "sampling_rule_spec cannot be satisfied by the current question bank (insufficient EASY/MEDIUM/HARD count, missing blueprint slot, etc.)"

  # Pagination
  - id: ERR_INVALID_PAGINATION_PARAMETERS
    http: 400
    condition: "Pagination limit not in [1,100] or offset < 0"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ExamAdmin
    description: "Owns the Exam lifecycle: configures the exam, manages the question bank, registers candidates, publishes scores"
    identity: opaque
    exclusive_operations:
      - "POST /exams"
      - "POST /exams/{examId}/open-registration"
      - "POST /exams/{examId}/close-registration"
      - "POST /exams/{examId}/publish-scores"
      - "POST /exams/{examId}/questions"
      - "POST /exams/{examId}/registrations"
      - "GET /audit-log"
    shared_operations:
      - "GET /exams/{examId}/questions, GET /exams/{examId}/questions/{questionId} (with Proctor)"
      - "GET /exams/{examId}/registrations"
      - "GET /exams/{examId}/attempts/{attemptId} (with Candidate, Proctor)"
      - "GET /exams/{examId}/attempts/{attemptId}/abnormal-events (with Proctor)"
      - "GET /exams/{examId}/grading-assignments (with Marker)"
      - "GET /exams/{examId}/appeals (with Candidate, AppealOfficer)"

  - name: Proctor
    description: "Monitors live exams; records abnormal behavior events"
    identity: opaque
    exclusive_operations:
      - "POST /exams/{examId}/attempts/{attemptId}/abnormal-events"
    shared_operations:
      - "GET /exams/{examId}/questions, GET /exams/{examId}/questions/{questionId} (with ExamAdmin)"
      - "GET /exams/{examId}/attempts/{attemptId}"
      - "GET /exams/{examId}/attempts/{attemptId}/abnormal-events"

  - name: Candidate
    description: "Exam taker; owns one CandidateRegistration and the resulting ExamAttempt per exam"
    identity: "entity_backed:CandidateRegistration"
    exclusive_operations:
      - "POST /exams/{examId}/attempts (registration_id MUST belong to acting Candidate)"
      - "POST /exams/{examId}/attempts/{attemptId}/begin-identity-check"
      - "POST /exams/{examId}/attempts/{attemptId}/identity-verifications"
      - "POST /exams/{examId}/attempts/{attemptId}/network-disconnect"
      - "POST /exams/{examId}/attempts/{attemptId}/network-resume"
      - "POST /exams/{examId}/attempts/{attemptId}/submit"
      - "POST /exams/{examId}/attempts/{attemptId}/appeals"
    shared_operations:
      - "GET /exams, GET /exams/{examId}"
      - "GET /exams/{examId}/attempts/{attemptId} (only own attempt)"
      - "GET /exams/{examId}/appeals (only own appeals)"
    note: "Ownership rule: X-User-ID MUST equal CandidateRegistration.candidate_id for the attempt's registration. Server compares X-User-ID against attempt → registration → candidate_id."

  - name: Marker
    description: "Grades a single blind_slot of a single subjective question; cannot grade both slots of the same (attempt, question) pair"
    identity: opaque
    exclusive_operations:
      - "POST /exams/{examId}/grading-assignments/{assignmentId}/claim"
      - "POST /exams/{examId}/grading-assignments/{assignmentId}/score"
    shared_operations:
      - "GET /exams/{examId}/grading-assignments (with ExamAdmin)"

  - name: AppealOfficer
    description: "Reviews and decides appeals; segregation of duties — cannot have been a Marker on the same (attempt_id, question_id)"
    identity: opaque
    exclusive_operations:
      - "POST /exams/{examId}/appeals/{appealId}/claim"
      - "POST /exams/{examId}/appeals/{appealId}/secondary-mark"
      - "POST /exams/{examId}/appeals/{appealId}/decide"
    shared_operations:
      - "GET /exams/{examId}/appeals (with Candidate, ExamAdmin)"

  - name: TestHarness
    description: "Test-only role for advancing the server clock to drive time-gated automatic transitions"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/advance"

  - name: Any
    description: "Catch-all for endpoints open to every authenticated role"
    identity: opaque
    shared_operations:
      - "GET /exams"
      - "GET /exams/{examId}"
