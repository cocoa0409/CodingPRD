scaffold_corner_design:
  # ===========================================================================
  # Section: entities — creation, defaults, required fields, immutability,
  # parent relationships, computed fields.
  # ===========================================================================
  - section: entities
    instances:
      - name: employee_create_required_field_omission_returns_invalid_request
        claim_type: required_field
        grounds:
          - entities.Employee.fields.job_family
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          POST /employees without required field `job_family` returns 400
          ERR_INVALID_REQUEST; no Employee row is persisted.
        test_recipe:
          setup:
            - "Org unit OU1 exists"
          setup_api_calls:
            - call: "POST /hr-org-units"
              payload: { name: "OU1" }
              as: HRSystemAdmin
              captures: { ou_id: $.data.id }
          trigger:
            - call: "POST /hr-org-units/${ou_id}/employees"
              payload: { full_name: "No Family", email: "nf@x.com", job_level: 5 }
              as: HRSystemAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: employee_parent_org_unit_must_exist
        claim_type: parent_relationship
        grounds:
          - entities.Employee.fields.hr_org_unit_id
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: |
          Employee is hierarchical under HROrgUnit. Creating an employee
          under a non-existent org unit returns 404 ERR_NOT_FOUND.
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "POST /hr-org-units/00000000-0000-0000-0000-000000000000/employees"
              payload: { full_name: "X", email: "x@x.com", job_family: "ENGINEERING", job_level: 5 }
              as: HRSystemAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "error_id == ERR_NOT_FOUND"

      - name: employee_manager_id_self_reference_and_job_level_range
        claim_type: type_constraint
        grounds:
          - entities.Employee.fields.manager_id
          - entities.Employee.fields.job_level
        distinguishing_aspect: |
          Employee.manager_id is a self-referential FK. Top-of-chain
          employee with manager_id omitted is valid. job_level outside
          1..10 returns 400 ERR_INVALID_REQUEST.
        test_recipe:
          setup:
            - "Org unit OU1 exists"
          setup_api_calls:
            - call: "POST /hr-org-units"
              payload: { name: "OU1" }
              as: HRSystemAdmin
              captures: { ou_id: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees"
              payload: { full_name: "CEO", email: "ceo@x.com", job_family: "OPERATIONS", job_level: 10 }
              as: HRSystemAdmin
              captures: { ceo_id: $.data.id }
          trigger:
            - call: "POST /hr-org-units/${ou_id}/employees"
              payload: { full_name: "Bad Level", email: "bl@x.com", job_family: "ENGINEERING", job_level: 11, manager_id: "${ceo_id}" }
              as: HRSystemAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: employee_employment_status_ignored_input_defaults_to_active
        claim_type: defaults
        grounds:
          - entities.Employee.fields.employment_status
        distinguishing_aspect: |
          employment_status is system-sourced; input is ignored. Fresh
          employee defaults to ACTIVE.
        test_recipe:
          setup:
            - "Org unit OU1 exists"
          setup_api_calls:
            - call: "POST /hr-org-units"
              payload: { name: "OU1" }
              as: HRSystemAdmin
              captures: { ou_id: $.data.id }
          trigger:
            - call: "POST /hr-org-units/${ou_id}/employees"
              payload: { full_name: "New Hire", email: "nh@x.com", job_family: "SUPPORT", job_level: 3, employment_status: "TERMINATED" }
              as: HRSystemAdmin
              captures: { emp_id: $.data.id, status: $.data.employment_status }
          assert:
            - "HTTP status == 201"
            - "Employee.${emp_id}.employment_status == ACTIVE (client-supplied TERMINATED ignored)"

      - name: pip_template_default_status_draft_and_ignored_input
        claim_type: defaults
        grounds:
          - entities.PIPTemplate.fields.template_status
          - entities.PIPTemplate.fields.goal_blueprints
        distinguishing_aspect: |
          New template starts in DRAFT regardless of any client-supplied
          template_status; goal_blueprints are validated at create and
          again at publish.
        test_recipe:
          setup:
            - "Org unit OU1; HRBP H1"
          setup_api_calls:
            - call: "POST /hr-org-units"
              payload: { name: "OU1" }
              as: HRSystemAdmin
              captures: { ou_id: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees"
              payload: { full_name: "HRBP", email: "h@x.com", job_family: "OPERATIONS", job_level: 7 }
              as: HRSystemAdmin
              captures: { hrbp_id: $.data.id }
          trigger:
            - call: "POST /hr-org-units/${ou_id}/pip-templates"
              payload:
                name: "T"
                category: "QUALITY"
                goal_blueprints:
                  - { metric_key: "defects", target_value: 2, unit: "count", weight: 100 }
                duration_days: 30
                check_in_cadence_days: 10
                template_status: "PUBLISHED"
              as: HRBusinessPartner
              as_user_id: "${hrbp_id}"
              captures: { tpl_id: $.data.id, status: $.data.template_status }
          assert:
            - "HTTP status == 201"
            - "PIPTemplate.${tpl_id}.template_status == DRAFT (input PUBLISHED ignored)"

      - name: coaching_log_entry_immutable_no_version_field
        claim_type: immutability
        grounds:
          - entities.ManagerCoachingLogEntry
        distinguishing_aspect: |
          ManagerCoachingLogEntry has common_fields: false. Response
          payloads carry id and created_at only; there is no version,
          updated_at, or any update endpoint. Verified via the read-back
          shape after creation.
        test_recipe:
          setup:
            - "Org unit OU1; manager M1; employee E1"
          setup_api_calls:
            - call: "POST /hr-org-units"
              payload: { name: "OU1" }
              as: HRSystemAdmin
              captures: { ou_id: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees"
              payload: { full_name: "Boss", email: "m@x.com", job_family: "ENGINEERING", job_level: 6 }
              as: HRSystemAdmin
              captures: { mgr_id: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees"
              payload: { full_name: "E1", email: "e@x.com", job_family: "ENGINEERING", job_level: 5, manager_id: "${mgr_id}" }
              as: HRSystemAdmin
              captures: { emp_id: $.data.id }
          trigger:
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/coaching-log-entries"
              payload: { occurred_at: "2026-07-01T10:00:00Z", category: "QUALITY", severity: "INFORMAL", narrative: "Initial informal conversation about code review turnaround and pair programming expectations." }
              as: Manager
              as_user_id: "${mgr_id}"
              captures: { ce_id: $.data.id }
          assert:
            - "ManagerCoachingLogEntry.${ce_id} response has keys {id, created_at, employee_id, author_manager_id, occurred_at, category, severity, narrative, concern_id} only"
            - "Response has no `version` field (common_fields: false)"
            - "Response has no `updated_at` field (common_fields: false)"

      - name: pip_computed_end_date_from_start_plus_duration
        claim_type: computed_field
        grounds:
          - entities.PerformanceImprovementPlan.fields.end_date
        distinguishing_aspect: |
          end_date is computed as start_date + duration_days. Client
          cannot supply it. For start=2026-08-01 and duration=30,
          end_date = 2026-08-31T00:00:00Z.
        test_recipe:
          setup:
            - "Org unit, manager M1, HRBP H1, employee E1, ACCEPTED concern, PUBLISHED template duration=30"
          setup_api_calls:
            - call: "POST /hr-org-units"
              payload: { name: "OU1" }
              as: HRSystemAdmin
              captures: { ou_id: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees"
              payload: { full_name: "Boss", email: "m@x.com", job_family: "ENGINEERING", job_level: 6 }
              as: HRSystemAdmin
              captures: { mgr_id: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees"
              payload: { full_name: "HRBP", email: "h@x.com", job_family: "OPERATIONS", job_level: 7 }
              as: HRSystemAdmin
              captures: { hrbp_id: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees"
              payload: { full_name: "E1", email: "e@x.com", job_family: "ENGINEERING", job_level: 5, manager_id: "${mgr_id}" }
              as: HRSystemAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/coaching-log-entries"
              payload: { occurred_at: "2026-07-01T10:00:00Z", category: "QUALITY", severity: "DOCUMENTED", narrative: "Documented coaching on quality defects." }
              as: Manager
              as_user_id: "${mgr_id}"
              captures: { cle1: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/coaching-log-entries"
              payload: { occurred_at: "2026-07-08T10:00:00Z", category: "QUALITY", severity: "DOCUMENTED", narrative: "Second documented coaching session." }
              as: Manager
              as_user_id: "${mgr_id}"
              captures: { cle2: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/performance-concerns"
              payload: { category: "QUALITY", summary: "Quality below bar", coaching_log_entry_ids: ["${cle1}", "${cle2}"] }
              as: Manager
              as_user_id: "${mgr_id}"
              captures: { concern_id: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/performance-concerns/${concern_id}/submit"
              payload: {}
              as: Manager
              as_user_id: "${mgr_id}"
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/performance-concerns/${concern_id}/accept"
              payload: {}
              as: HRBusinessPartner
              as_user_id: "${hrbp_id}"
            - call: "POST /hr-org-units/${ou_id}/pip-templates"
              payload:
                name: "T"
                category: "QUALITY"
                goal_blueprints:
                  - { metric_key: "defects", target_value: 2, unit: "count", weight: 100 }
                duration_days: 30
                check_in_cadence_days: 10
              as: HRBusinessPartner
              as_user_id: "${hrbp_id}"
              captures: { tpl_id: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/pip-templates/${tpl_id}/publish"
              payload: {}
              as: HRBusinessPartner
              as_user_id: "${hrbp_id}"
          trigger:
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/pips"
              payload: { concern_id: "${concern_id}", template_id: "${tpl_id}", start_date: "2026-08-01T00:00:00Z" }
              as: HRBusinessPartner
              as_user_id: "${hrbp_id}"
              captures: { pip_id: $.data.id, end_date: $.data.end_date }
          assert:
            - "PerformanceImprovementPlan.${pip_id}.end_date == 2026-08-31T00:00:00Z"

      - name: pip_pins_template_published_version_at_issuance
        claim_type: computed_field
        grounds:
          - entities.PerformanceImprovementPlan.fields.template_published_version
          - entities.PerformanceImprovementPlan.fields.policy_version_at_issuance
        distinguishing_aspect: |
          PIP snapshots template_published_version and
          policy_version_at_issuance at creation. Subsequent template
          publishes bump the org-unit policy_version but MUST NOT mutate
          already-issued PIPs.
        test_recipe:
          setup:
            - "Org unit with PIP P1 created against template T1 (published_version=2 after first publish)"
            - "T2 published later bumps policy_version to 3"
          setup_api_calls:
            - call: "POST /hr-org-units"
              payload: { name: "OU1" }
              as: HRSystemAdmin
              captures: { ou_id: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees"
              payload: { full_name: "Boss", email: "m@x.com", job_family: "ENGINEERING", job_level: 6 }
              as: HRSystemAdmin
              captures: { mgr_id: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees"
              payload: { full_name: "HRBP", email: "h@x.com", job_family: "OPERATIONS", job_level: 7 }
              as: HRSystemAdmin
              captures: { hrbp_id: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees"
              payload: { full_name: "E1", email: "e@x.com", job_family: "ENGINEERING", job_level: 5, manager_id: "${mgr_id}" }
              as: HRSystemAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/coaching-log-entries"
              payload: { occurred_at: "2026-07-01T10:00:00Z", category: "QUALITY", severity: "DOCUMENTED", narrative: "Documented coaching session one." }
              as: Manager
              as_user_id: "${mgr_id}"
              captures: { cle1: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/coaching-log-entries"
              payload: { occurred_at: "2026-07-08T10:00:00Z", category: "QUALITY", severity: "DOCUMENTED", narrative: "Documented coaching session two." }
              as: Manager
              as_user_id: "${mgr_id}"
              captures: { cle2: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/performance-concerns"
              payload: { category: "QUALITY", summary: "Quality below bar", coaching_log_entry_ids: ["${cle1}", "${cle2}"] }
              as: Manager
              as_user_id: "${mgr_id}"
              captures: { concern_id: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/performance-concerns/${concern_id}/submit"
              payload: {}
              as: Manager
              as_user_id: "${mgr_id}"
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/performance-concerns/${concern_id}/accept"
              payload: {}
              as: HRBusinessPartner
              as_user_id: "${hrbp_id}"
            - call: "POST /hr-org-units/${ou_id}/pip-templates"
              payload:
                name: "T1"
                category: "QUALITY"
                goal_blueprints:
                  - { metric_key: "defects", target_value: 2, unit: "count", weight: 100 }
                duration_days: 30
                check_in_cadence_days: 10
              as: HRBusinessPartner
              as_user_id: "${hrbp_id}"
              captures: { tpl1: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/pip-templates/${tpl1}/publish"
              payload: {}
              as: HRBusinessPartner
              as_user_id: "${hrbp_id}"
              captures: { tpl1_pub_version: $.data.published_version }
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/pips"
              payload: { concern_id: "${concern_id}", template_id: "${tpl1}", start_date: "2026-08-01T00:00:00Z" }
              as: HRBusinessPartner
              as_user_id: "${hrbp_id}"
              captures: { pip_id: $.data.id, pip_pinned_tpl_version: $.data.template_published_version, pip_pinned_policy: $.data.policy_version_at_issuance }
            - call: "POST /hr-org-units/${ou_id}/pip-templates"
              payload:
                name: "T2"
                category: "VELOCITY"
                goal_blueprints:
                  - { metric_key: "sp", target_value: 10, unit: "points", weight: 100 }
                duration_days: 30
                check_in_cadence_days: 10
              as: HRBusinessPartner
              as_user_id: "${hrbp_id}"
              captures: { tpl2: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/pip-templates/${tpl2}/publish"
              payload: {}
              as: HRBusinessPartner
              as_user_id: "${hrbp_id}"
          trigger:
            - call: "GET /hr-org-units/${ou_id}/employees/${emp_id}/pips/${pip_id}"
              payload: {}
              as: HRBusinessPartner
              as_user_id: "${hrbp_id}"
          assert:
            - "PerformanceImprovementPlan.${pip_id}.template_published_version == ${tpl1_pub_version} (unchanged after T2 publish)"
            - "PerformanceImprovementPlan.${pip_id}.policy_version_at_issuance == 2 (pinned; the second publish bumped org-unit policy to 3 but the PIP does not move)"

  # ===========================================================================
  # Section: state_machines — initial state, valid transitions, invalid
  # transitions, terminal lockdown, side effects, idempotency.
  # ===========================================================================
  - section: state_machines
    instances:
      - name: concern_submit_from_submitted_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.PerformanceConcern.SUBMITTED_to_ACCEPTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Submitting an already-SUBMITTED concern returns 409
          ERR_INVALID_STATE. No transition fires; submitted_at is
          unchanged.
        test_recipe:
          setup:
            - "Concern C1 in SUBMITTED status"
          setup_api_calls:
            - call: "POST /hr-org-units"
              payload: { name: "OU1" }
              as: HRSystemAdmin
              captures: { ou_id: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees"
              payload: { full_name: "Boss", email: "m@x.com", job_family: "ENGINEERING", job_level: 6 }
              as: HRSystemAdmin
              captures: { mgr_id: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees"
              payload: { full_name: "E1", email: "e@x.com", job_family: "ENGINEERING", job_level: 5, manager_id: "${mgr_id}" }
              as: HRSystemAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/coaching-log-entries"
              payload: { occurred_at: "2026-07-01T10:00:00Z", category: "QUALITY", severity: "DOCUMENTED", narrative: "Documented coaching session." }
              as: Manager
              as_user_id: "${mgr_id}"
              captures: { cle1: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/coaching-log-entries"
              payload: { occurred_at: "2026-07-08T10:00:00Z", category: "QUALITY", severity: "DOCUMENTED", narrative: "Second documented coaching session." }
              as: Manager
              as_user_id: "${mgr_id}"
              captures: { cle2: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/performance-concerns"
              payload: { category: "QUALITY", summary: "Quality below bar", coaching_log_entry_ids: ["${cle1}", "${cle2}"] }
              as: Manager
              as_user_id: "${mgr_id}"
              captures: { concern_id: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/performance-concerns/${concern_id}/submit"
              payload: {}
              as: Manager
              as_user_id: "${mgr_id}"
          trigger:
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/performance-concerns/${concern_id}/submit"
              payload: {}
              as: Manager
              as_user_id: "${mgr_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: concern_terminal_lockdown_rejected_insufficient
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.PerformanceConcern
        distinguishing_aspect: |
          Concern in REJECTED_INSUFFICIENT is terminal; submit, accept,
          reject all return ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Concern C1 in REJECTED_INSUFFICIENT"
          setup_api_calls:
            - call: "POST /hr-org-units"
              payload: { name: "OU1" }
              as: HRSystemAdmin
              captures: { ou_id: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees"
              payload: { full_name: "Boss", email: "m@x.com", job_family: "ENGINEERING", job_level: 6 }
              as: HRSystemAdmin
              captures: { mgr_id: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees"
              payload: { full_name: "HRBP", email: "h@x.com", job_family: "OPERATIONS", job_level: 7 }
              as: HRSystemAdmin
              captures: { hrbp_id: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees"
              payload: { full_name: "E1", email: "e@x.com", job_family: "ENGINEERING", job_level: 5, manager_id: "${mgr_id}" }
              as: HRSystemAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/coaching-log-entries"
              payload: { occurred_at: "2026-07-01T10:00:00Z", category: "QUALITY", severity: "DOCUMENTED", narrative: "Documented coaching." }
              as: Manager
              as_user_id: "${mgr_id}"
              captures: { cle1: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/coaching-log-entries"
              payload: { occurred_at: "2026-07-08T10:00:00Z", category: "QUALITY", severity: "DOCUMENTED", narrative: "Second documented coaching." }
              as: Manager
              as_user_id: "${mgr_id}"
              captures: { cle2: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/performance-concerns"
              payload: { category: "QUALITY", summary: "Quality below bar", coaching_log_entry_ids: ["${cle1}", "${cle2}"] }
              as: Manager
              as_user_id: "${mgr_id}"
              captures: { concern_id: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/performance-concerns/${concern_id}/submit"
              payload: {}
              as: Manager
              as_user_id: "${mgr_id}"
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/performance-concerns/${concern_id}/reject"
              payload: {}
              as: HRBusinessPartner
              as_user_id: "${hrbp_id}"
          trigger:
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/performance-concerns/${concern_id}/accept"
              payload: {}
              as: HRBusinessPartner
              as_user_id: "${hrbp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: pip_initial_state_is_draft
        claim_type: initial_state
        grounds:
          - state_machines.PerformanceImprovementPlan
        distinguishing_aspect: |
          Freshly created PIP is in DRAFT status, not ISSUED or ACTIVE.
        test_recipe:
          setup:
            - "Org unit with employee E1, ACCEPTED concern, PUBLISHED template"
          setup_api_calls:
            - call: "POST /hr-org-units"
              payload: { name: "OU1" }
              as: HRSystemAdmin
              captures: { ou_id: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees"
              payload: { full_name: "Boss", email: "m@x.com", job_family: "ENGINEERING", job_level: 6 }
              as: HRSystemAdmin
              captures: { mgr_id: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees"
              payload: { full_name: "HRBP", email: "h@x.com", job_family: "OPERATIONS", job_level: 7 }
              as: HRSystemAdmin
              captures: { hrbp_id: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees"
              payload: { full_name: "E1", email: "e@x.com", job_family: "ENGINEERING", job_level: 5, manager_id: "${mgr_id}" }
