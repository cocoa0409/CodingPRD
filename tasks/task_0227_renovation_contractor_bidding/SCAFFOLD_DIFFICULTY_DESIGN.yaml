          Conserved quantity = total escrow money: the invariant
          funded_cents == available_cents + released_cents + retained_cents holds
          before AND after the forward action (approve moves retainage to retained)
          paired with its compensation (dispute OVERTURNED returns retainage to
          available). Net drift on the named sum is zero.
