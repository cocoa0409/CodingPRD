            - "ra1 (expires 2026-08-20, inside 30d window) contributes EXPIRY_IMMINENT +8; ra2 (2026-12-01) contributes 0"
            - "after clock passes 2026-08-20 the sweep flips ra1 to EXPIRED and re-opens x1"

  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: open_exception_count_conserved_across_plan_lifecycle
        grounds:
          - entities.AssessmentCycle.fields.open_exception_count
          - state_machines.RemediationPlan.COMPLETED_to_VERIFIED
          - state_machines.RemediationPlan.COMPLETED_to_REJECTED
        distinguishing_aspect: |
          Conserved quantity = AssessmentCycle.open_exception_count. Invariant:
          count == number of ExceptionFindings in {OPEN, IN_REMEDIATION}.
          Accept transitions move OPEN->IN_REMEDIATION (count unchanged);
          verify-approve moves IN_REMEDIATION->CLOSED_REMEDIATED (count -= k);
          verify-reject moves IN_REMEDIATION->OPEN (count unchanged). The
          forward+compensating pair (accept then reject) leaves the count and
          the underlying set exactly as before.
        test_recipe:
          setup:
            - "Cycle in REMEDIATION with two OPEN exceptions X1,X2 (count=2); plan P covering both accepted then verified with reject"
          setup_api_calls:
            - call: "POST /vsa/tier-policies"
              payload: { name: "P1", active: true, tier_matrix: {}, tier1_reassessment_months: 36, tier2_reassessment_months: 24, tier3_reassessment_months: 12, tier4_reassessment_months: 6 }
              as: PlatformAdmin
