              as_user_id: "liaison-02"
              captures: { e_cert: $.data.error_id }
            - call: "POST /terms/${term_id}/status"
              payload: { to_status: CLOSED }
              as: RegistrarOfficer
              as_user_id: "registrar-01"
              captures: { e_close: $.data.error_id }
          assert:
            - "e_cert == ERR_ROSTER_NOT_READY with HTTP 409 — certification_readiness is BLOCKED with blocking_reason_codes containing EXCEPTIONS_OUTSTANDING"
            - "e_close == ERR_ROSTER_NOT_READY with HTTP 409 — the Term cannot close while one of its rosters is still uncertified and not ready"
            - "FacultyRoster.${roster_df_id}.status is still GENERATED with certified_at == null and certified_by_user_id == null"
            - "Term.${term_id}.status is still ROSTER_LOCKED"
            - "CourseAssignment.${asn_x_df_id}.status == EXCEPTION_FLAGGED with exception_code == DISCIPLINE_MISALIGNED"

      - name: fully_satisfied_preconditions_let_the_certification_chain_succeed
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=33].ERR_ROSTER_NOT_READY
          - validations[priority=13].ERR_SEGREGATION_OF_DUTIES
          - state_machines.FacultyRoster.GENERATED_to_CERTIFIED
          - state_machines.Term.OPEN_to_ROSTER_LOCKED
        distinguishing_aspect: |
          The mirror image of the blocking corners: with zero exceptions, an ADEQUATE ratio, no
          review in REMEDIATION_REQUIRED and a certifier who decided no justification, every
          guard passes and the roster reaches CERTIFIED — so an implementation that always
          returns ERR_ROSTER_NOT_READY cannot pass.
        test_recipe:
          setup:
            - "Morgan Ellis (Journalism MASTERS, 36 graduate hours) is the sole INSTRUCTOR_OF_RECORD on the DEGREE_FIELD program's MONDAY 3-credit Journalism section, so the assignment lands VERIFIED_QUALIFIED / TERMINAL_DEGREE."
            - "No tested-experience justification and no accreditor review exist, so neither the segregation rule nor the lockout can fire."
            - "The roster for (DEGREE_FIELD program, 2026FA) has been generated with adequacy 1.0000."
          setup_api_calls:
            - *c_clock
            - *c_comm
            - *c_journ
            - *c_pr
            - *c_prog_df
            - *c_prog_cw
            - *c_term
            - *c_term_open
            - *c_fac_m
            - *c_rec_m_journ
            - *c_tr_m_journ
            - *c_vf_m_journ
            - *c_sec_df
            - *c_asn_m_df
            - *c_roster_df
            - *c_roster_df_gen
          trigger:
            - call: "POST /faculty-rosters/${roster_df_id}/certification"
              payload: { attestation_note: "All instructors of record hold terminal degrees in discipline." }
              as: AccreditationLiaison
              as_user_id: "liaison-02"
              captures: { cert_status: $.data.status }
            - call: "POST /terms/${term_id}/status"
              payload: { to_status: ROSTER_LOCKED }
              as: RegistrarOfficer
              as_user_id: "registrar-01"
          assert:
            - "cert_status == CERTIFIED with certified_by_user_id == liaison-02 and certified_at == the pinned clock value 2026-08-01T00:00:00Z"
            - "FacultyRoster.${roster_df_id}.certification_readiness == READY with blocking_reason_codes == []"
            - "FacultyRoster.${roster_df_id}.adequacy_ratio_snapshot == 1.0000, total_assignment_count == 1, flagged_exception_count == 0, terminal_qualified_headcount == 1"
            - "Term.${term_id}.status == ROSTER_LOCKED — closing the certification gate also unblocks the term transition"
            - "CourseAssignment.${asn_m_df_id}.status == VERIFIED_QUALIFIED and remains immutable while the roster is CERTIFIED"

      - name: state_lock_outranks_business_constraint_checks
        claim_type: priority_ordering
        grounds: ["validations[priority=10]", "validations[priority=24]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / term_locked_state_outranks_teaching_block_business_constraint
          rationale: "That instance sends one request that violates both the term-status lock (priority 10) and the teaching-block constraint (priority 24) and asserts ERR_TERM_LOCKED is the code returned."

      - name: safety_lock_outranks_fiscal_budget_checks
        claim_type: priority_ordering
        grounds: ["validations[priority=12]", "validations[priority=35]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / accreditor_lockout_safety_outranks_credential_budget_fiscal
          rationale: "That instance sends one request that violates both the accreditor lockout (priority 12) and the credential budget (priority 35) and asserts ERR_ACCREDITOR_REVIEW_LOCKOUT is the code returned."

      - name: auth_and_ownership_precede_every_later_rule
        claim_type: priority_ordering
        grounds: ["validations[priority=1]", "validations[priority=2]", "validations[priority=3]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / term_locked_state_outranks_teaching_block_business_constraint
          rationale: "The auth band's own ordering is asserted by the §1.9 rbac instance missing_user_identity_outranks_role_and_ownership_checks, which violates priorities 1, 2 and 3 on one request and expects the 401; the §1.8 instance cited here supplies the same lowest-priority-wins discipline for the state/business bands."

  # ===========================================================================
  # ENDPOINTS
  # ===========================================================================
  - section: endpoints
    instances:
      - name: adequacy_read_on_an_empty_roster_returns_zero_not_an_error
        claim_type: computed_read
        grounds:
          - endpoints[GET /programs/{programId}/adequacy]
          - calculations.program_faculty_adequacy
          - calculations.roster_snapshot_recompute
        distinguishing_aspect: |
          The degenerate denominator is the corner: a roster generated with zero assignments must
          report numerator 0, denominator 0 and adequacy_ratio 0.0000 rather than raising a
          division error or omitting the field, and the status must be INSUFFICIENT rather than a
          vacuously ADEQUATE "nothing is wrong".
        test_recipe:
          setup:
            - "The DEGREE_FIELD program (HEADCOUNT basis, min_terminal_ratio 0.60) exists in the OPEN 2026FA term with no course sections and no assignments."
            - "A roster for (DEGREE_FIELD program, 2026FA) has been created and generated, so generation_epoch is 1."
          setup_api_calls:
            - *c_clock
            - *c_comm
            - *c_journ
            - *c_pr
            - *c_prog_df
            - *c_prog_cw
            - *c_term
            - *c_term_open
            - *c_roster_df
            - *c_roster_df_gen
          trigger:
            - call: "GET /programs/${prog_df_id}/adequacy"
              payload: { term_id: "${term_id}" }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
              captures: { z_num: $.data.numerator, z_den: $.data.denominator, z_ratio: $.data.adequacy_ratio, z_status: $.data.adequacy_status, z_unq: $.data.unqualified_assignment_count, z_roster: $.data.roster_id }
          assert:
            - "HTTP 200 with z_num == 0, z_den == 0 and z_ratio == 0.0000 — the empty denominator resolves to zero, not to an error and not to 1.0000"
            - "z_status == INSUFFICIENT — 0.0000 < 0.60 - 0.15, so an empty program is never ADEQUATE"
            - "z_unq == 0 and z_roster == ${roster_df_id}"
            - "data.basis_applied == HEADCOUNT and data.program_id == ${prog_df_id}, data.term_id == ${term_id}"
            - "FacultyRoster.${roster_df_id}.total_assignment_count == 0, distinct_faculty_count == 0, credit_hours_total == 0, generation_epoch == 1, certification_readiness == BLOCKED with blocking_reason_codes == [ADEQUACY_BELOW_MINIMUM]"

      - name: revision_endpoint_clears_the_decision_trail_and_reopens_the_draft
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /tested-experience-justifications/{justificationId}/revision]
          - state_machines.TestedExperienceJustification.REJECTED_to_DRAFT
          - entities.TestedExperienceJustification.fields.decided_by_user_id
        distinguishing_aspect: |
          The re-open is not a plain state change: it must null out decided_by_user_id and
          decision_rationale so the segregation-of-duties anchor disappears, while the
          already-computed tested_experience_score and the untouched backing assignment stay
          exactly as the REJECT arm left them.
        test_recipe:
          setup:
            - "Alex Stone (Public Relations MASTERS only) is EXCEPTION_FLAGGED / DISCIPLINE_MISALIGNED on the DEGREE_FIELD program's TUESDAY 3-credit Journalism section."
            - "The dean filed a thin justification (2 documented years, one alternative credential code, industry_certification_level NONE, attestation on file) so tested_experience_score is 0.2000."
            - "The justification was submitted, taken under review, and rejected by analyst-02 (analyst-01 verified Alex's credential, so analyst-02 avoids the segregation rule)."
          setup_api_calls:
            - *c_clock
            - *c_comm
            - *c_journ
            - *c_pr
            - *c_prog_df
            - *c_prog_cw
            - *c_term
            - *c_term_open
            - *c_fac_x
            - *c_rec_x_pr
            - *c_tr_x_pr
            - *c_vf_x_pr
            - *c_sec_df_b
            - *c_asn_x_df_b
            - &c_just_thin
              call: "POST /tested-experience-justifications"
              payload: { course_assignment_id: "${asn_x_id}", narrative: "Two years in a regional newsroom", alternative_credential_codes: ["OSHA-30"], documented_years_experience: 2, industry_certification_level: NONE, supervisor_attestation_on_file: true }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
              captures: { just_thin_id: $.data.id, just_thin_score: $.data.tested_experience_score }
            - call: "POST /tested-experience-justifications/${just_thin_id}/status"
              payload: { to_status: SUBMITTED }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
            - call: "POST /tested-experience-justifications/${just_thin_id}/review"
              payload: {}
              as: CredentialAnalyst
              as_user_id: "analyst-02"
            - call: "POST /tested-experience-justifications/${just_thin_id}/decision"
              payload: { decision: REJECT, decision_rationale: "Two years is below the documented minimum" }
              as: CredentialAnalyst
              as_user_id: "analyst-02"
          trigger:
            - call: "POST /tested-experience-justifications/${just_thin_id}/revision"
              payload: {}
              as: ProgramDean
              as_user_id: "${prog_df_id}"
              captures: { rev_status: $.data.status, rev_decider: $.data.decided_by_user_id, rev_rationale: $.data.decision_rationale }
          assert:
            - "just_thin_score == 0.2000 — 0.5*(2/8) + 0.3*(1/4) + 0.2*0.0 = 0.1250 + 0.0750 + 0.0000"
            - "Before the trigger: status == REJECTED with decided_by_user_id == analyst-02 and decision_rationale == the rejection text"
            - "rev_status == DRAFT, rev_decider == null and rev_rationale == null — the decision trail is erased, not merely superseded"
            - "TestedExperienceJustification.${just_thin_id}.tested_experience_score is still 0.2000 — revision does not recompute the score (only a SUBMITTED transition does)"
            - "CourseAssignment.${asn_x_id}.status is still EXCEPTION_FLAGGED with exception_code == DISCIPLINE_MISALIGNED — the REJECT arm fired no cascade and the revision fires none either"
            - "TestedExperienceJustification.${just_thin_id}.version incremented by exactly 1 across the trigger"

      - name: program_launch_is_gated_then_denied_then_approved_after_remediation
        claim_type: conditional_action
        grounds:
          - endpoints[POST /programs/{programId}/launch-review]
          - endpoints[POST /programs/{programId}/launch-decision]
          - state_machines.Program.ADEQUACY_DENIED_to_ADEQUACY_REVIEW
          - validations[priority=34].ERR_PROGRAM_ADEQUACY_INSUFFICIENT
        distinguishing_aspect: |
          The whole revision loop runs in one instance: APPROVE is refused while the roster carries
          an unqualified assignment, DENY parks the program in ADEQUACY_DENIED, a re-review after
          the roster is remediated re-writes adequacy from INSUFFICIENT to ADEQUATE, and only then
          does the identical APPROVE call succeed — so the gate cannot be implemented as a
          one-shot check at review time.
        test_recipe:
          setup:
            - "The DEGREE_FIELD program (HEADCOUNT, min_terminal_ratio 0.60, is_substantive_change omitted so it defaults to false) owns the TUESDAY 3-credit Journalism section."
            - "Alex Stone (Public Relations MASTERS) holds that section and is EXCEPTION_FLAGGED; Morgan Ellis (Journalism MASTERS, 36 graduate hours) is verified and unassigned."
            - "The roster for (DEGREE_FIELD program, 2026FA) has been generated, so adequacy_ratio is 0.0000 / INSUFFICIENT with unqualified_assignment_count 1."
          setup_api_calls:
            - *c_clock
            - *c_comm
            - *c_journ
            - *c_pr
            - *c_prog_df
            - *c_prog_cw
            - *c_term
            - *c_term_open
            - *c_fac_x
            - *c_rec_x_pr
            - *c_tr_x_pr
            - *c_vf_x_pr
            - *c_fac_m
            - *c_rec_m_journ
            - *c_tr_m_journ
            - *c_vf_m_journ
            - *c_sec_df_b
            - *c_asn_x_df_b
            - *c_roster_df
            - *c_roster_df_gen
          trigger:
            - call: "POST /programs/${prog_df_id}/launch-review"
              payload: { term_id: "${term_id}" }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
              captures: { lr1_status: $.data.launch_status, lr1_adeq: $.data.adequacy_status }
            - call: "POST /programs/${prog_df_id}/launch-decision"
              payload: { decision: APPROVE, rationale: "Requesting launch approval" }
              as: AccreditationLiaison
              as_user_id: "liaison-01"
              captures: { e_launch: $.data.error_id }
            - call: "POST /programs/${prog_df_id}/launch-decision"
              payload: { decision: DENY, rationale: "One unqualified instructor of record" }
              as: AccreditationLiaison
              as_user_id: "liaison-01"
              captures: { ld_status: $.data.launch_status }
            - call: "GET /course-sections/${sec_df_b_id}"
              payload: {}
              as: ProgramDean
              as_user_id: "${prog_df_id}"
              captures: { sec_df_b_v2: $.data.version }
            - call: "POST /course-assignments"
              payload: { course_section_id: "${sec_df_b_id}", faculty_member_id: "${fac_m_id}", assignment_role: INSTRUCTOR_OF_RECORD, expected_section_version: "${sec_df_b_v2}" }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
              captures: { asn_fix_id: $.data.id }
            - call: "POST /faculty-rosters/${roster_df_id}/generate"
              payload: {}
              as: AccreditationLiaison
              as_user_id: "liaison-01"
              captures: { regen_ratio: $.data.adequacy_ratio_snapshot, regen_epoch: $.data.generation_epoch }
            - call: "POST /programs/${prog_df_id}/launch-review"
              payload: { term_id: "${term_id}" }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
              captures: { lr2_status: $.data.launch_status, lr2_adeq: $.data.adequacy_status }
            - call: "POST /programs/${prog_df_id}/launch-decision"
              payload: { decision: APPROVE, rationale: "Roster remediated; all instructors of record hold terminal degrees" }
              as: AccreditationLiaison
              as_user_id: "liaison-01"
              captures: { final_status: $.data.launch_status }
          assert:
            - "Trigger 1: lr1_status == ADEQUACY_REVIEW and lr1_adeq == INSUFFICIENT with adequacy_ratio 0.0000 and adequacy_term_id == ${term_id}"
            - "Trigger 2: HTTP 409 with e_launch == ERR_PROGRAM_ADEQUACY_INSUFFICIENT and launch_status still ADEQUACY_REVIEW"
            - "Trigger 3: ld_status == ADEQUACY_DENIED — DENY has no adequacy precondition"
            - "Trigger 5: CourseAssignment.${asn_fix_id}.status == VERIFIED_QUALIFIED / TERMINAL_DEGREE and CourseAssignment.${asn_x_id}.status == SUPERSEDED with superseded_by_assignment_id == ${asn_fix_id}"
            - "Trigger 6: regen_ratio == 1.0000 and regen_epoch == 2; certification_readiness == READY with blocking_reason_codes == []"
            - "Trigger 7: lr2_status == ADEQUACY_REVIEW and lr2_adeq == ADEQUATE — the ADEQUACY_DENIED -> ADEQUACY_REVIEW loop re-runs the calculation"
            - "Trigger 8: final_status == APPROVED_TO_LAUNCH; Program.${prog_df_id}.unqualified_assignment_count == 0 and APPROVED_TO_LAUNCH is terminal"

      - name: assignment_creation_links_section_and_faculty_from_both_directions
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /course-assignments]
          - endpoints[GET /course-sections/{sectionId}/course-assignments]
          - entities.CourseSection.fields.instructor_of_record_id
        distinguishing_aspect: |
          One write must be observable from three directions — the section's nested assignment
          collection, the faculty-filtered flat collection and the section's denormalized
          instructor_of_record_id pointer — so an implementation that stores the row without
          re-pointing the section, or that only serves the flat list, fails.
        test_recipe:
          setup:
            - "Morgan Ellis has a VERIFIED Journalism MASTERS dossier and no assignments; the DEGREE_FIELD program owns the MONDAY 3-credit Journalism section whose instructor_of_record_id is null."
          setup_api_calls:
            - *c_clock
            - *c_comm
            - *c_journ
            - *c_pr
            - *c_prog_df
            - *c_prog_cw
            - *c_term
            - *c_term_open
            - *c_fac_m
            - *c_rec_m_journ
            - *c_tr_m_journ
            - *c_vf_m_journ
            - *c_sec_df
          trigger:
            - *c_asn_m_df
            - call: "GET /course-sections/${sec_df_id}/course-assignments"
              payload: { limit: 10, offset: 0 }
              as: AccreditationLiaison
              as_user_id: "liaison-01"
              captures: { nested_first_id: "$.data[0].id" }
            - call: "GET /course-assignments"
              payload: { faculty_member_id: "${fac_m_id}", status: VERIFIED_QUALIFIED, limit: 10, offset: 0 }
              as: AccreditationLiaison
              as_user_id: "liaison-01"
              captures: { flat_first_id: "$.data[0].id" }
            - call: "GET /course-sections/${sec_df_id}"
              payload: {}
              as: AccreditationLiaison
              as_user_id: "liaison-01"
              captures: { sec_ior: $.data.instructor_of_record_id }
          assert:
            - "The nested collection returns meta total_count 1 with nested_first_id == ${asn_m_df_id} and that row's course_section_id == ${sec_df_id}"
            - "The flat collection filtered by faculty_member_id and status VERIFIED_QUALIFIED returns total_count 1 with flat_first_id == ${asn_m_df_id} — the same write is reachable through the faculty filter"
            - "sec_ior == ${fac_m_id} — the INSTRUCTOR_OF_RECORD assignment re-pointed the section's denormalized pointer"
            - "FacultyMember.${fac_m_id}.assigned_credit_hours == 3 and FacultyMember.${fac_m_id}.version incremented by 1"
            - "CourseSection.${sec_df_id}.version == ${sec_df_v} + 1 — the OCC parent moved exactly once"

      - name: faculty_update_is_partial_and_re_runs_pd_compliance
        claim_type: standard_crud
        grounds:
          - endpoints[POST /faculty-members/{facultyMemberId}]
          - calculations.professional_development_compliance
          - entities.FacultyMember.fields.pd_compliant
        distinguishing_aspect: |
          The update is both partial and side-effecting: omitting email leaves it untouched while a
          single employment_class change from ADJUNCT to FULL_TIME re-runs the compliance check
          against a different required-hours constant, flipping pd_compliant from true to false on
          the very same 20.0 recorded hours.
        test_recipe:
          setup:
            - "Dana Reyes is ADJUNCT (REQUIRED_HOURS 20) in the DEGREE_FIELD program with email dana.reyes@example.edu."
            - "Two VERIFIED in-cycle PD records total exactly 20.0 discipline-relevant hours (12.0 Journalism plus 8.0 Communication), so pd_compliant is true and pd_hours_current_cycle is 20.0."
          setup_api_calls:
            - *c_clock
            - *c_comm
            - *c_journ
            - *c_pr
            - *c_prog_df
            - *c_prog_cw
            - *c_term
            - *c_term_open
            - *c_fac_d
            - *c_pd_d_journ
            - call: "POST /pd-records"
              payload: { faculty_member_id: "${fac_d_id}", discipline_id: "${comm_id}", activity_type: COURSEWORK, contact_hours: 8.0, activity_date: "2026-06-01" }
              as: RegistrarOfficer
              as_user_id: "registrar-01"
              captures: { pd_comm2_id: $.data.id }
            - call: "POST /pd-records/${pd_d_journ_id}/status"
              payload: { to_status: VERIFIED }
              as: CredentialAnalyst
              as_user_id: "analyst-01"
            - call: "POST /pd-records/${pd_comm2_id}/status"
              payload: { to_status: VERIFIED }
              as: CredentialAnalyst
              as_user_id: "analyst-01"
          trigger:
            - call: "POST /faculty-members/${fac_d_id}"
              payload: { employment_class: FULL_TIME }
              as: RegistrarOfficer
              as_user_id: "registrar-01"
              captures: { upd_class: $.data.employment_class, upd_email: $.data.email, upd_hours: $.data.pd_hours_current_cycle, upd_compliant: $.data.pd_compliant }
          assert:
            - "Before the trigger: pd_hours_current_cycle == 20.0 and pd_compliant == true against REQUIRED_HOURS[ADJUNCT] 20"
            - "upd_class == FULL_TIME while upd_email == dana.reyes@example.edu and full_name == Dana Reyes — omitted fields are left alone"
            - "upd_hours == 20.0 — the recorded hours do not change"
            - "upd_compliant == false — 20.0 < REQUIRED_HOURS[FULL_TIME] 40, so the threshold followed the class change"
            - "ProfessionalDevelopmentRecord.${pd_comm2_id}.discipline_relevant is still true — home_program_id was not touched, so no relevance is rewritten"
            - "FacultyMember.${fac_d_id}.version incremented by exactly 1 and MAX_TERM_CREDIT_HOURS now resolves to 15 for this faculty"

  # ===========================================================================
  # ERRORS
  # ===========================================================================
  - section: errors
    instances:
      - name: attestation_gate_is_independent_of_the_tested_experience_score
        claim_type: error_triggerable
        grounds:
          - errors[ERR_ATTESTATION_MISSING]
          - validations[priority=31].ERR_ATTESTATION_MISSING
          - state_machines.TestedExperienceJustification.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          The last error in the catalog with no other trigger, and it is proved to be a genuinely
          separate gate: a justification with a perfect 1.0000 score, 8 documented years and a
          BOARD_CERTIFIED level is still refused for a missing attestation, while an otherwise
          identical justification that has the attestation on file is approved and fires the whole
          three-hop tested-experience cascade.
        test_recipe:
          setup:
            - "Dana Reyes and Alex Stone each hold only a Public Relations MASTERS (verified by analyst-01) and each is EXCEPTION_FLAGGED / DISCIPLINE_MISALIGNED on a 3-credit Journalism section of the DEGREE_FIELD program — Dana on MONDAY, Alex on TUESDAY."
            - "The roster for (DEGREE_FIELD program, 2026FA) has been generated: total 2, flagged 2, adequacy 0.0000."
            - "Both justifications carry 8 documented years, four distinct alternative credential codes and industry_certification_level BOARD_CERTIFIED, so both score 1.0000; only Alex's has supervisor_attestation_on_file true."
            - "All analyst decisions are taken by analyst-02 because analyst-01 verified both credential records."
          setup_api_calls:
            - *c_clock
            - *c_comm
            - *c_journ
            - *c_pr
            - *c_prog_df
            - *c_prog_cw
            - *c_term
            - *c_term_open
            - *c_fac_d
            - *c_rec_d_pr
            - *c_tr_d_pr
            - *c_vf_d_pr
            - *c_fac_x
            - *c_rec_x_pr
            - *c_tr_x_pr
            - *c_vf_x_pr
            - *c_sec_df
            - *c_sec_df_b
            - call: "POST /course-assignments"
              payload: { course_section_id: "${sec_df_id}", faculty_member_id: "${fac_d_id}", assignment_role: INSTRUCTOR_OF_RECORD, expected_section_version: "${sec_df_v}" }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
              captures: { asn_d_df_id: $.data.id }
            - *c_asn_x_df_b
            - *c_roster_df
            - *c_roster_df_gen
            - call: "POST /tested-experience-justifications"
