      - name: expirable_band_window_boundary_on_clock
        grounds:
          - calculations.expirable_band
          - entities.CredentialItem.fields.expirable_band
          - endpoints./_clock/set_current_utc
        distinguishing_aspect: |
          Numeric day-threshold boundary on the expiring_soon_window (default 90), reached via
          POST /_clock/set_current_utc. days_remaining==90 is EXPIRING_SOON (inclusive); ==91 is VALID.
          Item expires 2026-05-30; clock 2026-03-01 -> dr=90 -> EXPIRING_SOON.
        test_recipe:
          setup:
            - "Org default window 90. One CredentialItem expiring 2026-05-30. Clock at 2026-03-01 (exactly 90 days before)."
          setup_api_calls:
            - call: "POST /credentialing-orgs"
              payload: { name: "CVO" }
              as: SystemAdmin
              captures: { org_id: $.data.id }
            - call: "POST /providers"
              payload: { org_id: "${org_id}", npi: "1234567890", full_name: "Dr A", specialty: "IM", caqh_id: "CAQH-A" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { p_id: $.data.id }
            - call: "POST /providers/${p_id}/credential-items"
              payload: { item_type: "STATE_LICENSE", identifier: "LIC-1", issued_date: "2025-01-01T00:00:00.000Z", expiration_date: "2026-05-30T00:00:00.000Z" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { ci_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "GET /providers/${p_id}/credential-items"
              payload: {}
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { band0: "$.data[0].expirable_band" }
          assert:
            - "CredentialItem.${ci_id}.expirable_band == 'EXPIRING_SOON'"

      - name: quorum_count_boundary_on_finalize
        grounds:
          - validations[priority=13]
          - errors[ERR_QUORUM_NOT_MET]
          - state_machines.CredentialingFile.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          A DIFFERENT metric (collection count, not a numeric day threshold) reached through a DIFFERENT
          endpoint (POST /credentialing-files/{id}/finalize): exactly 2 non-ABSTAIN votes fails quorum
          (>=3 required) with ERR_QUORUM_NOT_MET; the third vote would satisfy it.
        test_recipe:
          setup:
            - "File UNDER_REVIEW with only 2 YES votes (one short of the quorum of 3)."
          setup_api_calls:
            - call: "POST /credentialing-orgs"
              payload: { name: "CVO" }
              as: SystemAdmin
              captures: { org_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /providers"
              payload: { org_id: "${org_id}", npi: "1234567890", full_name: "Dr A", specialty: "IM", caqh_id: "CAQH-A" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { p_id: $.data.id }
            - call: "POST /providers/${p_id}/credential-items"
              payload: { item_type: "STATE_LICENSE", identifier: "LIC-1", issued_date: "2025-01-01T00:00:00.000Z", expiration_date: "2030-01-01T00:00:00.000Z" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { ci_id: $.data.id }
            - call: "POST /providers/${p_id}/submit-application"
              payload: {}
              as: CredentialingSpecialist
              as_user_id: "spec-1"
            - call: "POST /providers/${p_id}/begin-verification"
              payload: {}
              as: CredentialingSpecialist
              as_user_id: "spec-1"
            - call: "POST /credential-items/${ci_id}/verification-requests"
              payload: { method: "PRIMARY_SOURCE", source_reference: "https://lic.example/1" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { vr_id: $.data.id }
            - call: "POST /verification-requests/${vr_id}/complete"
              payload: { outcome: "PASS" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
            - call: "POST /providers/${p_id}/finalize-verification"
              payload: {}
              as: CredentialingSpecialist
              as_user_id: "spec-1"
            - call: "POST /peer-reviewers"
              payload: { org_id: "${org_id}", user_id: "md-1", full_name: "Chair MD" }
              as: SystemAdmin
              captures: { rv_chair: $.data.id }
            - call: "POST /peer-reviewers"
              payload: { org_id: "${org_id}", user_id: "rev-2", full_name: "Rev 2" }
              as: SystemAdmin
              captures: { rv2: $.data.id }
            - call: "POST /providers/${p_id}/credentialing-files"
              payload: {}
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { file_id: $.data.id }
            - call: "POST /credentialing-files/${file_id}/open-review"
              payload: {}
              as: MedicalDirector
              as_user_id: "md-1"
            - call: "POST /credentialing-files/${file_id}/cast-vote"
              payload: { reviewer_id: "${rv2}", ballot: "YES" }
              as: PeerReviewer
              as_user_id: "rev-2"
            - call: "POST /credentialing-files/${file_id}/cast-vote"
              payload: { reviewer_id: "${rv_chair}", ballot: "YES" }
              as: MedicalDirector
              as_user_id: "md-1"
            - call: "GET /credentialing-files/${file_id}"
              payload: {}
              as: MedicalDirector
              as_user_id: "md-1"
              captures: { file_v: $.data.version }
          trigger:
            - call: "POST /credentialing-files/${file_id}/finalize"
              payload: { decision: "APPROVE", expected_credentialing_file_version: "${file_v}" }
              as: MedicalDirector
              as_user_id: "md-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == 'ERR_QUORUM_NOT_MET'"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: enrollment_submit_requires_provider_cleared
        grounds:
          - state_machines.PayerEnrollment.REQUESTED_to_SUBMITTED
          - validations[priority=15]
          - entities.Provider.fields.credentialing_status
          - errors[ERR_PROVIDER_NOT_CLEARED]
        distinguishing_aspect: |
          Entity pair PayerEnrollment -> Provider: PayerEnrollment.REQUESTED->SUBMITTED is gated by
          Provider.credentialing_status==CLEARED. Submitting an enrollment for a not-yet-cleared (PENDING)
          provider is rejected with ERR_PROVIDER_NOT_CLEARED.
        test_recipe:
          setup:
            - "Provider in PENDING posture (application submitted, not cleared). One payer. One REQUESTED enrollment."
          setup_api_calls:
            - call: "POST /credentialing-orgs"
              payload: { name: "CVO" }
              as: SystemAdmin
              captures: { org_id: $.data.id }
            - call: "POST /providers"
              payload: { org_id: "${org_id}", npi: "1234567890", full_name: "Dr A", specialty: "IM", caqh_id: "CAQH-A" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { p_id: $.data.id }
            - call: "POST /providers/${p_id}/credential-items"
              payload: { item_type: "STATE_LICENSE", identifier: "LIC-1", issued_date: "2025-01-01T00:00:00.000Z", expiration_date: "2030-01-01T00:00:00.000Z" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
            - call: "POST /payers"
              payload: { org_id: "${org_id}", name: "Plan X", payer_type: "COMMERCIAL", retroactive_allowed: false, panel_capacity: 5 }
              as: EnrollmentCoordinator
              as_user_id: "enr-1"
              captures: { payer_id: $.data.id }
            - call: "POST /providers/${p_id}/payer-enrollments"
              payload: { payer_id: "${payer_id}" }
              as: EnrollmentCoordinator
              as_user_id: "enr-1"
              captures: { en_id: $.data.id }
          trigger:
            - call: "POST /payer-enrollments/${en_id}/submit"
              payload: {}
              as: EnrollmentCoordinator
              as_user_id: "enr-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == 'ERR_PROVIDER_NOT_CLEARED'"

      - name: open_review_requires_provider_ready
        grounds:
          - state_machines.CredentialingFile.ASSEMBLING_to_UNDER_REVIEW
          - entities.Provider.fields.application_status
          - errors[ERR_PROVIDER_NOT_READY]
        distinguishing_aspect: |
          A DIFFERENT entity pair CredentialingFile -> Provider: CredentialingFile.ASSEMBLING->UNDER_REVIEW
          is gated by Provider.application_status==READY_FOR_REVIEW. Opening review on a file whose provider
          is only SUBMITTED is rejected with ERR_PROVIDER_NOT_READY (no sanctions involved, isolating the
          state gate).
        test_recipe:
          setup:
            - "Provider only SUBMITTED (not READY_FOR_REVIEW), no sanctions. A file in ASSEMBLING."
          setup_api_calls:
            - call: "POST /credentialing-orgs"
              payload: { name: "CVO" }
              as: SystemAdmin
              captures: { org_id: $.data.id }
            - call: "POST /providers"
              payload: { org_id: "${org_id}", npi: "1234567890", full_name: "Dr A", specialty: "IM", caqh_id: "CAQH-A" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { p_id: $.data.id }
            - call: "POST /providers/${p_id}/credential-items"
              payload: { item_type: "STATE_LICENSE", identifier: "LIC-1", issued_date: "2025-01-01T00:00:00.000Z", expiration_date: "2030-01-01T00:00:00.000Z" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
            - call: "POST /providers/${p_id}/submit-application"
              payload: {}
              as: CredentialingSpecialist
              as_user_id: "spec-1"
            - call: "POST /providers/${p_id}/credentialing-files"
              payload: {}
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { file_id: $.data.id }
          trigger:
            - call: "POST /credentialing-files/${file_id}/open-review"
              payload: {}
              as: MedicalDirector
              as_user_id: "md-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == 'ERR_PROVIDER_NOT_READY'"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: credential_item_interval_overlap_closed_closed
        grounds:
          - validations[priority=5.5]
          - errors[ERR_CREDENTIAL_INTERVAL_OVERLAP]
          - entities.CredentialItem.fields.expiration_date
        distinguishing_aspect: |
          CredentialItem resource, CLOSED-CLOSED interval semantics with adjacency allowed: a second
          STATE_LICENSE [2026-06-01, 2027-06-01] overlaps the interior of an existing [2026-01-01,
          2026-12-31] -> ERR_CREDENTIAL_INTERVAL_OVERLAP. (Contrast the ongoing-singleton enrollment rule.)
        test_recipe:
          setup:
            - "Provider with a STATE_LICENSE valid 2026-01-01..2026-12-31. A second STATE_LICENSE whose window 2026-06-01..2027-06-01 overlaps the interior."
          setup_api_calls:
            - call: "POST /credentialing-orgs"
              payload: { name: "CVO" }
              as: SystemAdmin
              captures: { org_id: $.data.id }
            - call: "POST /providers"
              payload: { org_id: "${org_id}", npi: "1234567890", full_name: "Dr A", specialty: "IM", caqh_id: "CAQH-A" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { p_id: $.data.id }
            - call: "POST /providers/${p_id}/credential-items"
              payload: { item_type: "STATE_LICENSE", identifier: "LIC-1", issued_date: "2026-01-01T00:00:00.000Z", expiration_date: "2026-12-31T00:00:00.000Z" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
          trigger:
            - call: "POST /providers/${p_id}/credential-items"
              payload: { item_type: "STATE_LICENSE", identifier: "LIC-2", issued_date: "2026-06-01T00:00:00.000Z", expiration_date: "2027-06-01T00:00:00.000Z" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == 'ERR_CREDENTIAL_INTERVAL_OVERLAP'"

      - name: duplicate_payer_enrollment_ongoing_singleton
        grounds:
          - validations[priority=14.5]
          - errors[ERR_DUPLICATE_PAYER_ENROLLMENT]
          - entities.PayerEnrollment.fields.payer_id
        distinguishing_aspect: |
          PayerEnrollment resource, ONGOING-SINGLETON semantics (different interval arithmetic than the
          closed-closed CredentialItem rule): a non-terminal enrollment occupies an unbounded window, so a
          second REQUESTED enrollment with the same payer overlaps regardless of dates ->
          ERR_DUPLICATE_PAYER_ENROLLMENT.
        test_recipe:
          setup:
            - "Provider with one REQUESTED enrollment against payer P. A second enrollment request against the same payer P."
          setup_api_calls:
            - call: "POST /credentialing-orgs"
              payload: { name: "CVO" }
              as: SystemAdmin
              captures: { org_id: $.data.id }
            - call: "POST /providers"
              payload: { org_id: "${org_id}", npi: "1234567890", full_name: "Dr A", specialty: "IM", caqh_id: "CAQH-A" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { p_id: $.data.id }
            - call: "POST /payers"
              payload: { org_id: "${org_id}", name: "Plan P", payer_type: "COMMERCIAL", retroactive_allowed: false, panel_capacity: 5 }
              as: EnrollmentCoordinator
              as_user_id: "enr-1"
              captures: { payer_id: $.data.id }
            - call: "POST /providers/${p_id}/payer-enrollments"
              payload: { payer_id: "${payer_id}" }
              as: EnrollmentCoordinator
              as_user_id: "enr-1"
              captures: { en1: $.data.id }
          trigger:
            - call: "POST /providers/${p_id}/payer-enrollments"
              payload: { payer_id: "${payer_id}" }
              as: EnrollmentCoordinator
              as_user_id: "enr-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == 'ERR_DUPLICATE_PAYER_ENROLLMENT'"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: panel_slot_conservation_activate_then_terminate
        grounds:
          - state_machines.PayerEnrollment.SUBMITTED_to_ACTIVE
          - state_machines.PayerEnrollment.ACTIVE_to_TERMINATED
          - entities.Payer.fields.panel_capacity
          - validations[priority=16]
        distinguishing_aspect: |
          Conserved quantity = Payer ACTIVE-enrollment count (panel occupancy). Forward (activate) +1,
          compensating (terminate) -1. The invariant 'count of ACTIVE PayerEnrollment for payer P' must
          return to its pre-activation value of 0 after activate-then-terminate, freeing the slot.
        test_recipe:
          setup:
            - "Provider CLEARED at 2026-03-01. Payer panel_capacity 1, currently 0 ACTIVE. One enrollment submitted."
          setup_api_calls:
            - call: "POST /credentialing-orgs"
              payload: { name: "CVO" }
              as: SystemAdmin
              captures: { org_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
