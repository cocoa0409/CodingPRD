            - call: "POST /brand-inspection/inspectors"
              payload: { badge_number: "DF-001", home_territory_id: "${terr_d}", certification_expires_on: "2027-12-31T00:00:00Z" }
              as: BoardAdmin
              captures: { insp_1: "$.data.id", insp_1_v: "$.data.version" }
            - call: "POST /brand-inspection/inspection-orders"
              payload: { owner_id: "${own_a}", territory_id: "${terr_d}", inspection_purpose: "MOVEMENT", requested_window_start_at: "2026-08-05T08:00:00Z", requested_window_end_at: "2026-08-05T17:00:00Z" }
              as: LivestockOwner
              as_user_id: "${own_a}"
              captures: { ord_1: "$.data.id" }
            - call: "POST /brand-inspection/inspection-orders/${ord_1}/schedule"
              payload: { inspector_id: "${insp_1}", scheduled_start_at: "2026-08-05T09:00:00Z", scheduled_end_at: "2026-08-05T11:00:00Z", expected_inspector_version: "${insp_1_v}" }
              as: BoardAdmin
            - call: "POST /brand-inspection/inspection-orders/${ord_1}/begin"
              payload: {}
              as: FieldInspector
              as_user_id: "${insp_1}"
            - call: "POST /brand-inspection/inspection-orders/${ord_1}/lots"
              payload: { species_class: "CATTLE", head_count: 12 }
              as: FieldInspector
              as_user_id: "${insp_1}"
              captures: { lot_1: "$.data.id" }
            - call: "POST /brand-inspection/animal-lots/${lot_1}/finding"
              payload: { finding: "NO_LEGIBLE_BRAND" }
              as: FieldInspector
              as_user_id: "${insp_1}"
            - call: "GET /brand-inspection/estray-cases?animal_lot_id=${lot_1}"
              payload: {}
              as: BoardAdmin
              captures: { est_1: "$.data[0].id" }
            - call: "POST /brand-inspection/_clock/set_current_utc"
