  - rule_id: combinatorial_formula
    instances:
      - name: stipend_amount_proration_multiplier_budget_cap
        grounds:
          - calculations.stipend_amount
          - calculations.program_budget_remaining
          - entities.StipendPayment.fields.amount_cents
        distinguishing_aspect: "Mode (a) combinatorial formula with >= 3 inputs and non-linear interaction: tentative = round_half_up(base_stipend_cents x fte_fraction x early_bird_multiplier) = round(300000 x 0.8 x 1.10) = 264000, then capped by min against budget_remaining_cents 200000 -> amount_cents 200000; distinct mode from the weighted-score rounding-order instance."
        test_recipe:
          setup:
            - "Clock 2027-01-10; cycle NB-2027 OPEN; candidate CAP (NM, D-100, fte_fraction 0.8) ELIGIBLE; assessors R1/R2 ACTIVE; center capacity 5."
            - "IncentiveProgram NB-STIPEND: sponsor_state NM, sponsor_district_code null (statewide), budget_total_cents 200000, base_stipend_cents 300000, early_bird_multiplier 1.10, early_bird_deadline 2027-12-31T00:00:00Z."
            - "Candidate CAP fully scored (CKA 3.00, P1 2.50, P2 1.50, P3 2.00) so the CERTIFIED transition fires at clock 2027-01-20T15:00:00Z, before the early-bird deadline."
          setup_api_calls:
            - *clk_jan10
            - *mk_cycle_nb
            - *open_cycle_nb
            - call: "POST /candidates"
              payload: { full_name: "Candidate Cap", email: "cap@x.com", license_number: "LIC-CAP", license_state: "NM", district_code: "D-100", years_experience: 6, fte_fraction: 0.8 }
              as: Anonymous
              captures: { cand_cap: $.data.id }
            - call: "POST /candidates/${cand_cap}/submit-eligibility"
              payload: { license_document_ref: "lic-cap.pdf", employer_verification_ref: "emp-cap.pdf" }
              as: Candidate
              as_user_id: "${cand_cap}"
            - call: "POST /candidates/${cand_cap}/verify-eligibility"
              payload: { decision: "APPROVE" }
              as: BoardAdministrator
            - *mk_bench
            - *mk_r1
            - *r1_train
            - *r1_calibrating
