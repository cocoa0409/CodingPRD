      - name: enrolling_under_a_builder_that_is_not_approved_returns_builder_not_approved
        claim_type: "Violation to Error"
        grounds:
          - validations.priority_41
          - errors[ERR_BUILDER_NOT_APPROVED]
        distinguishing_aspect: "A home enrolled under a builder still in UNDER_REVIEW must be refused with ERR_BUILDER_NOT_APPROVED 409 before any premium is quoted."
        excluded_because:
          difficulty_instance: "enrollment_prefers_builder_not_approved_over_builder_posture_frozen"
          rationale: "That difficulty instance triggers ERR_BUILDER_NOT_APPROVED as the winning error while the frozen-posture rule is violated at the same time, so it already proves this error is reachable and additionally pins its precedence; a plain single-violation test would assert a strict subset of the same response."

      - name: enrolling_under_a_frozen_builder_returns_builder_posture_frozen
        claim_type: "Violation to Error"
        grounds:
          - validations.priority_70
          - errors[ERR_BUILDER_POSTURE_FROZEN]
        distinguishing_aspect: "An APPROVED builder whose monitoring_posture has been driven to FROZEN by its loss ratio must be refused a new enrollment with ERR_BUILDER_POSTURE_FROZEN 409, and the same code guards reinstatement of a suspended builder."
        excluded_because:
          difficulty_instance: "enrollment_prefers_builder_not_approved_over_builder_posture_frozen"
          rationale: "The same instance isolates ERR_BUILDER_POSTURE_FROZEN in its second leg, where the builder is APPROVED so priority 41 passes and only priority 70 can answer; a standalone corner test would repeat that leg verbatim."

      - name: activating_a_policy_under_an_enrollment_hold_returns_enrollment_on_hold
        claim_type: "Violation to Error"
        grounds:
          - validations.priority_43
          - errors[ERR_ENROLLMENT_ON_HOLD]
          - entities.WarrantyPolicy.fields.enrollment_hold
        distinguishing_aspect: "A PENDING_ENROLLMENT policy whose enrollment_hold was set by a sibling claim's cascade must refuse activation with ERR_ENROLLMENT_ON_HOLD 409 even though its premium is PAID."
        excluded_because:
          difficulty_instance: "single_payment_propagates_six_links_to_a_sibling_policy_enrollment_hold"
          rationale: "The cascade instance is the only reachable route to enrollment_hold == true - it is a computed flag with no input path - and it already asserts the refused activation at the end of the six-link chain, so an isolated test could not even reach the precondition without rebuilding that chain."

      - name: filing_a_claim_on_a_policy_that_is_not_active_returns_policy_not_active
        claim_type: "Violation to Error"
        grounds:
          - validations.priority_44
          - errors[ERR_POLICY_NOT_ACTIVE]
        distinguishing_aspect: "Claim intake against a PENDING_ENROLLMENT, EXPIRED or VOIDED policy is refused with ERR_POLICY_NOT_ACTIVE 409, and the premium axis is irrelevant to that decision."
        excluded_because:
          difficulty_instance: "claim_intake_depends_on_the_policy_coverage_axis_not_the_premium_axis"
          rationale: "That instance files against a PAID-but-PENDING_ENROLLMENT policy and an unpaid-but-ACTIVE policy in the same test, so it proves ERR_POLICY_NOT_ACTIVE is reachable and simultaneously proves the premium axis does not gate intake; the isolated version drops the second half."

      - name: a_transfer_dated_outside_the_structural_term_returns_coverage_term_elapsed
        claim_type: "Violation to Error"
        grounds:
          - validations.priority_54
          - errors[ERR_COVERAGE_TERM_ELAPSED]
        distinguishing_aspect: "A transfer_date outside the BASE STRUCTURAL closed interval is refused with ERR_COVERAGE_TERM_ELAPSED 409, since there is no residual coverage left to hand to a subsequent buyer."
        excluded_because:
          difficulty_instance: "transfer_prefers_coverage_term_elapsed_over_transferee_is_current_owner"
          rationale: "The precedence instance violates priority 54 and priority 59 in one request and asserts that 54 answers, which subsumes the single-violation claim for this code."

      - name: a_transfer_to_the_current_owner_returns_transferee_is_current_owner
        claim_type: "Violation to Error"
        grounds:
          - validations.priority_59
          - errors[ERR_TRANSFEREE_IS_CURRENT_OWNER]
        distinguishing_aspect: "Naming the policy's own current_owner_id as new_owner_id is refused with ERR_TRANSFEREE_IS_CURRENT_OWNER 422 - a self-transfer would silently re-derive the transfer fee."
        excluded_because:
          difficulty_instance: "transfer_prefers_coverage_term_elapsed_over_transferee_is_current_owner"
          rationale: "The same instance isolates priority 59 in its in-term leg, where the date is valid so only the transferee identity can fail; duplicating that leg as its own corner adds no discriminating power."

      - name: an_overlapping_session_window_on_one_neutral_returns_neutral_window_conflict
        claim_type: "Violation to Error"
        grounds:
          - validations.priority_57
          - errors[ERR_NEUTRAL_WINDOW_CONFLICT]
        distinguishing_aspect: "Two EscalationCase windows on the same Neutral that overlap under half-open semantics plus the turnaround buffer are refused with ERR_NEUTRAL_WINDOW_CONFLICT 409."
        excluded_because:
          difficulty_instance: "neutral_session_windows_are_half_open_but_widened_by_a_two_hour_turnaround"
          rationale: "The boundary instance already books an exactly-abutting window that is accepted and a window inside the two-hour buffer that is refused, which covers the error's reachability at the only interesting point of its domain."

      - name: an_endorsement_term_touching_an_existing_term_returns_coverage_term_overlap
        claim_type: "Violation to Error"
        grounds:
          - validations.priority_58
          - errors[ERR_COVERAGE_TERM_OVERLAP]
        distinguishing_aspect: "An ENDORSEMENT CoverageTerm whose start_date equals an existing same-type term's end_date is refused with ERR_COVERAGE_TERM_OVERLAP 422, because both intervals are closed on both ends."
        excluded_because:
          difficulty_instance: "endorsement_coverage_terms_are_closed_intervals_so_a_touching_start_date_overlaps"
          rationale: "That instance pins the closed-interval reading at the exact touching date and accepts the next day, so it establishes both the error and the off-by-one that makes it interesting."

      - name: recording_a_transfer_while_a_claim_sits_in_the_dispute_ladder_returns_open_dispute_blocks_transfer
        claim_type: "Violation to Error"
        grounds:
          - validations.priority_61
          - errors[ERR_OPEN_DISPUTE_BLOCKS_TRANSFER]
        distinguishing_aspect: "Recording an APPROVED transfer is refused with ERR_OPEN_DISPUTE_BLOCKS_TRANSFER 409 while any claim on the policy is in MEDIATION or ARBITRATION."
        excluded_because:
          difficulty_instance: "transfer_recording_depends_on_no_claim_sitting_in_the_dispute_ladder"
          rationale: "That instance walks a claim onto and off the ladder around one unchanged recording request, so it triggers the error and then shows the same request succeeding - strictly more than the single-violation claim."

