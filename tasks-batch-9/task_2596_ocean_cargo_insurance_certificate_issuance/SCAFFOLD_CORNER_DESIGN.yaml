      - name: overlapping_declaration_periods_are_rejected_but_adjacent_ones_are_not
        claim_type: temporal_validation
        grounds:
          - validations.priority_16
          - errors.ERR_DECLARATION_PERIOD_OVERLAP
          - entities.PremiumDeclaration.fields.period_start
        distinguishing_aspect: |
          Overlap is tested with half-open semantics against every existing
          declaration of the same policy, in all three geometries a naive
          `start > other.start` test gets wrong: a period straddling the right
          edge, one strictly contained inside, and one straddling the left edge
          are all 409, while the period beginning exactly at the incumbent's
          period_end is accepted with 201.
        test_recipe:
          setup:
            - "one ACTIVE OpenPolicy with a single declaration D1 covering [2026-06-01, 2026-07-01)"
