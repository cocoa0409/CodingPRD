              as: ConditionSurveyor
              as_user_id: "surv-1"
              captures: { assess_id: $.data.id }
            - call: "POST /public-art/condition-assessments/${assess_id}/photos"
              payload: { view_code: "FRONT", media_ref: "media/a/1.jpg" }
              as: ConditionSurveyor
              as_user_id: "surv-1"
            - call: "POST /public-art/condition-assessments/${assess_id}/photos"
              payload: { view_code: "SIDE", media_ref: "media/a/2.jpg" }
              as: ConditionSurveyor
