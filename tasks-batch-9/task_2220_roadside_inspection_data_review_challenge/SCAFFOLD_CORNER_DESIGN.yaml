          - validations[priority 25]
          - errors.ERR_EVIDENCE_REQUIRED
          - errors.ERR_DUPLICATE_OPEN_CHALLENGE
        distinguishing_aspect: |
          Evidence sufficiency is type-specific, not a bare count: a WRONG_CARRIER challenge with one
          PHOTO row (evidence_count 1) still fails until a BILL_OF_LADING or LEASE_AGREEMENT row exists,
          and once the first challenge occupies the (report_id, WRONG_CARRIER, null) triple a second
          fully evidenced challenge on the same triple is refused at submit, not at creation.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; carriers c1 (MEDIUM, quota_limit 3) and c2; code 392.2S; UNSAFE_DRIVING/MEDIUM threshold."
            - "SCORED report r1 of c1 with violation v1."
            - "Two DRAFT WRONG_CARRIER challenges chA and chB on r1 asserting c2; chA holds one PHOTO evidence row, chB holds one BILL_OF_LADING row."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
