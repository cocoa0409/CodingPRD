# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index (task 1854)
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_final_assignment_pay
        grounds:
          - calculations.provisional_pay
          - calculations.final_payout
          - entities.Assignment.fields.provisional_pay_cents
          - entities.Assignment.fields.final_payout_cents
        distinguishing_aspect: |
          Same assignment inputs yield two different pay numbers: the provisional variant
          (scheduled_days x premium snapshot, computed at acceptance) estimates 3 days of work,
          while the final variant (APPROVED timesheets with streak-based rates, computed at
          verification) pays only the 2 approved days — 60000 vs 40000 on identical offer data.
        test_recipe:
          setup:
            - "District with defaults; school NONE tier with budget 1000000; teacher T1 MATH/HIGH"
            - "Substitute SUB base 20000, qualified MATH/HIGH, clearances verified through 2027-12-31, ACTIVE"
            - "Clock at 2026-07-29T00:00:00Z so lead time 120h yields premium 1.00"
            - "Absence Mon 2026-08-03 .. Wed 2026-08-05 (3 weekdays, total_days 3 <= 5 so approval NOT_REQUIRED)"
            - "Assignment accepted; only Mon+Tue timesheets approved, Wed rejected"
          setup_api_calls:
            - { call: "POST /districts", payload: { name: "D1" }, as: DistrictAdmin, captures: { dist: $.data.id } }
            - { call: "POST /schools", payload: { district_id: "${dist}", name: "S1", coverage_budget_total_cents: 1000000, hard_to_fill_tier: "NONE" }, as: DistrictAdmin, captures: { sch: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Teach One", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin, captures: { t1: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Coord One", subject: "ADMIN", grade_band: "HIGH", is_coordinator: true }, as: DistrictAdmin, captures: { coord: $.data.id } }
            - { call: "POST /substitutes", payload: { full_name: "Sub A", base_daily_rate_cents: 20000 }, as: DistrictAdmin, captures: { subA: $.data.id } }
            - { call: "POST /qualifications", payload: { substitute_id: "${subA}", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin }
            - { call: "POST /clearances", payload: { substitute_id: "${subA}", clearance_type: "BACKGROUND_CHECK", expires_on: "2027-12-31" }, as: DistrictAdmin, captures: { clr1: $.data.id } }
            - { call: "POST /clearances/${clr1}/verify", payload: {}, as: DistrictAdmin }
            - { call: "POST /clearances", payload: { substitute_id: "${subA}", clearance_type: "TEACHING_CREDENTIAL", expires_on: "2027-12-31" }, as: DistrictAdmin, captures: { clr2: $.data.id } }
            - { call: "POST /clearances/${clr2}/verify", payload: {}, as: DistrictAdmin }
            - { call: "POST /substitutes/${subA}/activate", payload: {}, as: DistrictAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-29T00:00:00Z" }, as: DistrictAdmin }
            - { call: "POST /absences", payload: { staff_member_id: "${t1}", start_date: "2026-08-03", end_date: "2026-08-05", absence_type: "SICK", required_subject: "MATH", required_grade_band: "HIGH" }, as: Teacher, as_user_id: "${t1}", captures: { abs1: $.data.id } }
            - { call: "POST /assignments", payload: { absence_id: "${abs1}", substitute_id: "${subA}" }, as: SchoolCoordinator, as_user_id: "${coord}", captures: { asg1: $.data.id } }
            - { call: "POST /assignments/${asg1}/respond", payload: { decision: "ACCEPT" }, as: Substitute, as_user_id: "${subA}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T18:00:00Z" }, as: DistrictAdmin }
            - { call: "POST /assignments/${asg1}/report-outcome", payload: { outcome: "WORKED" }, as: SchoolCoordinator, as_user_id: "${coord}" }
            - { call: "POST /timesheets", payload: { assignment_id: "${asg1}", work_date: "2026-08-03", hours_worked: 8.0 }, as: Substitute, as_user_id: "${subA}", captures: { ts1: $.data.id } }
            - { call: "POST /timesheets", payload: { assignment_id: "${asg1}", work_date: "2026-08-04", hours_worked: 8.0 }, as: Substitute, as_user_id: "${subA}", captures: { ts2: $.data.id } }
            - { call: "POST /timesheets", payload: { assignment_id: "${asg1}", work_date: "2026-08-05", hours_worked: 8.0 }, as: Substitute, as_user_id: "${subA}", captures: { ts3: $.data.id } }
            - { call: "POST /timesheets/${ts1}/review", payload: { decision: "APPROVE" }, as: SchoolCoordinator, as_user_id: "${coord}" }
            - { call: "POST /timesheets/${ts2}/review", payload: { decision: "APPROVE" }, as: SchoolCoordinator, as_user_id: "${coord}" }
            - { call: "POST /timesheets/${ts3}/review", payload: { decision: "REJECT" }, as: SchoolCoordinator, as_user_id: "${coord}" }
          trigger:
            - { call: "POST /assignments/${asg1}/verify", payload: {}, as: SchoolCoordinator, as_user_id: "${coord}" }
          assert:
            - "Assignment.${asg1}.provisional_pay_cents == 60000 (3 scheduled days x round(20000 x 1.00))"
            - "Assignment.${asg1}.final_payout_cents == 40000 (2 approved days at 20000; rejected Wednesday excluded)"
            - "Assignment.${asg1}.provisional_pay_cents != Assignment.${asg1}.final_payout_cents"
            - "Assignment.${asg1}.long_term_converted == false"
            - "Absence.${abs1}.days_covered_sub == 2 and Absence.${abs1}.days_uncovered == 1"

      - name: reliability_lifetime_vs_trailing_window
        grounds:
          - calculations.reliability_scores
          - entities.Substitute.fields.reliability_lifetime_score
          - entities.Substitute.fields.reliability_trailing_score
        distinguishing_aspect: |
          Same reliability event log on the Substitute entity yields two different scores once the
          only event ages past the 90-day trailing window: lifetime stays 75 while trailing
          returns to 100 — a dual-variant split on a different entity domain (Substitute risk
          scoring) than assignment pay.
        test_recipe:
          setup:
            - "District defaults (reliability_window_days 90); school NONE budget 1000000; teacher MATH/HIGH"
            - "Sub A base 20000, qualified, clearances valid through 2027-12-31, ACTIVE"
            - "1-day absence Mon 2026-08-03; assignment accepted; NO_SHOW reported at 2026-08-03T13:00:00Z (-25)"
          setup_api_calls:
            - { call: "POST /districts", payload: { name: "D1" }, as: DistrictAdmin, captures: { dist: $.data.id } }
            - { call: "POST /schools", payload: { district_id: "${dist}", name: "S1", coverage_budget_total_cents: 1000000 }, as: DistrictAdmin, captures: { sch: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Teach One", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin, captures: { t1: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Coord One", subject: "ADMIN", grade_band: "HIGH", is_coordinator: true }, as: DistrictAdmin, captures: { coord: $.data.id } }
            - { call: "POST /substitutes", payload: { full_name: "Sub A", base_daily_rate_cents: 20000 }, as: DistrictAdmin, captures: { subA: $.data.id } }
            - { call: "POST /qualifications", payload: { substitute_id: "${subA}", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin }
            - { call: "POST /clearances", payload: { substitute_id: "${subA}", clearance_type: "BACKGROUND_CHECK", expires_on: "2027-12-31" }, as: DistrictAdmin, captures: { clr1: $.data.id } }
            - { call: "POST /clearances/${clr1}/verify", payload: {}, as: DistrictAdmin }
            - { call: "POST /clearances", payload: { substitute_id: "${subA}", clearance_type: "TEACHING_CREDENTIAL", expires_on: "2027-12-31" }, as: DistrictAdmin, captures: { clr2: $.data.id } }
            - { call: "POST /clearances/${clr2}/verify", payload: {}, as: DistrictAdmin }
            - { call: "POST /substitutes/${subA}/activate", payload: {}, as: DistrictAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-29T00:00:00Z" }, as: DistrictAdmin }
            - { call: "POST /absences", payload: { staff_member_id: "${t1}", start_date: "2026-08-03", end_date: "2026-08-03", absence_type: "SICK", required_subject: "MATH", required_grade_band: "HIGH" }, as: Teacher, as_user_id: "${t1}", captures: { abs1: $.data.id } }
            - { call: "POST /assignments", payload: { absence_id: "${abs1}", substitute_id: "${subA}" }, as: SchoolCoordinator, as_user_id: "${coord}", captures: { asg1: $.data.id } }
            - { call: "POST /assignments/${asg1}/respond", payload: { decision: "ACCEPT" }, as: Substitute, as_user_id: "${subA}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T13:00:00Z" }, as: DistrictAdmin }
            - { call: "POST /assignments/${asg1}/report-outcome", payload: { outcome: "NO_SHOW" }, as: SchoolCoordinator, as_user_id: "${coord}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-20T00:00:00Z" }, as: DistrictAdmin }
          trigger:
            - { call: "GET /substitutes/${subA}", payload: {}, as: DistrictAdmin }
          assert:
            - "Substitute.${subA}.reliability_lifetime_score == 75 (100 - 25, event never ages out)"
            - "Substitute.${subA}.reliability_trailing_score == 100 (NO_SHOW event at 2026-08-03T13:00 is outside the 90-day window ending 2026-11-20)"
            - "Substitute.${subA}.reliability_lifetime_score != Substitute.${subA}.reliability_trailing_score"

      - name: fill_rate_sub_only_vs_any_coverage
        grounds:
          - calculations.fill_rate_analytics
        distinguishing_aspect: |
          The same absence population produces two different fill rates on the analytics entity
          domain: Tuesday's internally-covered absence counts as unfilled under SUB_ONLY (0.0)
          but filled under ANY_COVERAGE (1.0); the two variants diverge on identical input.
        test_recipe:
          setup:
            - "District defaults; school S1 NONE budget 1000000; teachers T1 (MATH/HIGH) and T2"
            - "Sub A ACTIVE, qualified MATH/HIGH only"
            - "Absence A1 Mon 2026-08-03 MATH -> filled by sub; absence A2 Tue 2026-08-04 SCIENCE -> UNFILLED (empty pool) then COVERED_INTERNALLY; absence A3 Wed 2026-08-05 -> CANCELLED"
          setup_api_calls:
            - { call: "POST /districts", payload: { name: "D1" }, as: DistrictAdmin, captures: { dist: $.data.id } }
            - { call: "POST /schools", payload: { district_id: "${dist}", name: "S1", coverage_budget_total_cents: 1000000 }, as: DistrictAdmin, captures: { sch: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Teach One", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin, captures: { t1: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Teach Two", subject: "SCIENCE", grade_band: "HIGH" }, as: DistrictAdmin, captures: { t2: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Coord One", subject: "ADMIN", grade_band: "HIGH", is_coordinator: true }, as: DistrictAdmin, captures: { coord: $.data.id } }
            - { call: "POST /substitutes", payload: { full_name: "Sub A", base_daily_rate_cents: 20000 }, as: DistrictAdmin, captures: { subA: $.data.id } }
            - { call: "POST /qualifications", payload: { substitute_id: "${subA}", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin }
            - { call: "POST /clearances", payload: { substitute_id: "${subA}", clearance_type: "BACKGROUND_CHECK", expires_on: "2027-12-31" }, as: DistrictAdmin, captures: { clr1: $.data.id } }
            - { call: "POST /clearances/${clr1}/verify", payload: {}, as: DistrictAdmin }
            - { call: "POST /clearances", payload: { substitute_id: "${subA}", clearance_type: "TEACHING_CREDENTIAL", expires_on: "2027-12-31" }, as: DistrictAdmin, captures: { clr2: $.data.id } }
            - { call: "POST /clearances/${clr2}/verify", payload: {}, as: DistrictAdmin }
            - { call: "POST /substitutes/${subA}/activate", payload: {}, as: DistrictAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-29T00:00:00Z" }, as: DistrictAdmin }
            - { call: "POST /absences", payload: { staff_member_id: "${t1}", start_date: "2026-08-03", end_date: "2026-08-03", absence_type: "SICK", required_subject: "MATH", required_grade_band: "HIGH" }, as: Teacher, as_user_id: "${t1}", captures: { abs1: $.data.id } }
            - { call: "POST /assignments", payload: { absence_id: "${abs1}", substitute_id: "${subA}" }, as: SchoolCoordinator, as_user_id: "${coord}", captures: { asg1: $.data.id } }
            - { call: "POST /assignments/${asg1}/respond", payload: { decision: "ACCEPT" }, as: Substitute, as_user_id: "${subA}" }
            - { call: "POST /absences", payload: { staff_member_id: "${t2}", start_date: "2026-08-04", end_date: "2026-08-04", absence_type: "SICK", required_subject: "SCIENCE", required_grade_band: "HIGH" }, as: Teacher, as_user_id: "${t2}", captures: { abs2: $.data.id } }
            - { call: "POST /absences", payload: { staff_member_id: "${t1}", start_date: "2026-08-05", end_date: "2026-08-05", absence_type: "PERSONAL", required_subject: "MATH", required_grade_band: "HIGH" }, as: Teacher, as_user_id: "${t1}", captures: { abs3: $.data.id } }
            - { call: "POST /absences/${abs3}/cancel", payload: {}, as: Teacher, as_user_id: "${t1}" }
            - { call: "POST /dispatch-batches", payload: { district_id: "${dist}", run_for_date: "2026-08-04" }, as: DistrictAdmin, captures: { batch: $.data.id } }
            - { call: "POST /internal-coverages", payload: { absence_id: "${abs2}", staff_member_id: "${t2}", coverage_date: "2026-08-04", periods: 3 }, as: SchoolCoordinator, as_user_id: "${coord}", captures: { cov1: $.data.id } }
            - { call: "POST /internal-coverages/${cov1}/review", payload: { decision: "APPROVE" }, as: DistrictAdmin }
          trigger:
            - { call: "GET /analytics/fill-rate", payload: { from_date: "2026-08-03", to_date: "2026-08-09", school_id: "${sch}" }, as: DistrictAdmin }
          assert:
            - "Row (school=${sch}, day_of_week=1): reported_count == 1, sub_only_fill_rate == 1.0, any_coverage_fill_rate == 1.0"
            - "Row (school=${sch}, day_of_week=2): reported_count == 1, sub_only_filled_count == 0, sub_only_fill_rate == 0.0, any_coverage_filled_count == 1, any_coverage_fill_rate == 1.0"
            - "Row (school=${sch}, day_of_week=3): reported_count == 0 (cancelled absence excluded from denominator), sub_only_fill_rate == null, any_coverage_fill_rate == null"

  - rule_id: combinatorial_formula
    instances:
      - name: premium_multiplier_nested_cap_and_tiers
        grounds:
          - calculations.premium_multiplier
          - entities.Assignment.fields.premium_multiplier_snapshot
        distinguishing_aspect: |
          Mode (a) — a >=3-input non-linear formula: school tier branch (0.40 custom HIGH) plus
          short-notice branch (0.25 for 12h lead) sums to 1.65 and is clamped by the nested
          min() against premium_cap_multiplier 1.50, so the snapshot is 1.50 and not 1.65.
        test_recipe:
          setup:
            - "District with htf_high_premium_pct 0.40 (other defaults); school HIGH tier budget 1000000"
            - "Sub A base 20000 ACTIVE qualified; absence Mon 2026-08-03 single day"
            - "Clock 2026-08-02T12:00:00Z -> lead 12h (< 24 -> short-notice 0.25)"
          setup_api_calls:
            - { call: "POST /districts", payload: { name: "D1", htf_high_premium_pct: 0.40 }, as: DistrictAdmin, captures: { dist: $.data.id } }
            - { call: "POST /schools", payload: { district_id: "${dist}", name: "S1", coverage_budget_total_cents: 1000000, hard_to_fill_tier: "HIGH" }, as: DistrictAdmin, captures: { sch: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Teach One", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin, captures: { t1: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Coord One", subject: "ADMIN", grade_band: "HIGH", is_coordinator: true }, as: DistrictAdmin, captures: { coord: $.data.id } }
            - { call: "POST /substitutes", payload: { full_name: "Sub A", base_daily_rate_cents: 20000 }, as: DistrictAdmin, captures: { subA: $.data.id } }
            - { call: "POST /qualifications", payload: { substitute_id: "${subA}", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin }
            - { call: "POST /clearances", payload: { substitute_id: "${subA}", clearance_type: "BACKGROUND_CHECK", expires_on: "2027-12-31" }, as: DistrictAdmin, captures: { clr1: $.data.id } }
            - { call: "POST /clearances/${clr1}/verify", payload: {}, as: DistrictAdmin }
            - { call: "POST /clearances", payload: { substitute_id: "${subA}", clearance_type: "TEACHING_CREDENTIAL", expires_on: "2027-12-31" }, as: DistrictAdmin, captures: { clr2: $.data.id } }
            - { call: "POST /clearances/${clr2}/verify", payload: {}, as: DistrictAdmin }
            - { call: "POST /substitutes/${subA}/activate", payload: {}, as: DistrictAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T12:00:00Z" }, as: DistrictAdmin }
            - { call: "POST /absences", payload: { staff_member_id: "${t1}", start_date: "2026-08-03", end_date: "2026-08-03", absence_type: "SICK", required_subject: "MATH", required_grade_band: "HIGH" }, as: Teacher, as_user_id: "${t1}", captures: { abs1: $.data.id } }
          trigger:
            - { call: "POST /assignments", payload: { absence_id: "${abs1}", substitute_id: "${subA}" }, as: SchoolCoordinator, as_user_id: "${coord}", captures: { asg1: $.data.id, prem: $.data.premium_multiplier_snapshot, prov: $.data.provisional_pay_cents } }
          assert:
            - "Assignment.${asg1}.premium_multiplier_snapshot == 1.5 (min(1.0 + 0.40 + 0.25, 1.50) — cap binds, not the raw 1.65)"
            - "Assignment.${asg1}.provisional_pay_cents == 30000 (1 day x round_half_up(20000 x 1.50))"
            - "Assignment.${asg1}.offer_source == MANUAL_OFFER and status == OFFERED"

      - name: final_payout_per_day_rounding_order
        grounds:
          - calculations.final_payout
          - entities.Timesheet.fields.day_pay_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: with base 10002 and long-term rate
          1.15, round-per-day-then-sum yields 3 x 11502 = 34506 for the converted days while
          sum-then-round would yield 34507 (34506.90); the scaffold pins per-day rounding and
          the verified total is 124524, not 124525.
        test_recipe:
          setup:
            - "District defaults; school NONE budget 2000000; sub base 10002 ACTIVE qualified"
            - "Clock 2026-07-29T00:00:00Z -> premium 1.00; absence Mon 2026-08-03..Tue 2026-08-18 = 12 weekdays"
            - "total_days 12 > 5 -> approval PENDING -> APPROVED; offer accepted (provisional 120024)"
            - "All 12 weekdays reported WORKED and timesheets approved in date order"
          setup_api_calls:
            - { call: "POST /districts", payload: { name: "D1" }, as: DistrictAdmin, captures: { dist: $.data.id } }
            - { call: "POST /schools", payload: { district_id: "${dist}", name: "S1", coverage_budget_total_cents: 2000000 }, as: DistrictAdmin, captures: { sch: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Teach One", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin, captures: { t1: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Coord One", subject: "ADMIN", grade_band: "HIGH", is_coordinator: true }, as: DistrictAdmin, captures: { coord: $.data.id } }
            - { call: "POST /substitutes", payload: { full_name: "Sub A", base_daily_rate_cents: 10002 }, as: DistrictAdmin, captures: { subA: $.data.id } }
            - { call: "POST /qualifications", payload: { substitute_id: "${subA}", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin }
            - { call: "POST /clearances", payload: { substitute_id: "${subA}", clearance_type: "BACKGROUND_CHECK", expires_on: "2027-12-31" }, as: DistrictAdmin, captures: { clr1: $.data.id } }
            - { call: "POST /clearances/${clr1}/verify", payload: {}, as: DistrictAdmin }
            - { call: "POST /clearances", payload: { substitute_id: "${subA}", clearance_type: "TEACHING_CREDENTIAL", expires_on: "2027-12-31" }, as: DistrictAdmin, captures: { clr2: $.data.id } }
            - { call: "POST /clearances/${clr2}/verify", payload: {}, as: DistrictAdmin }
            - { call: "POST /substitutes/${subA}/activate", payload: {}, as: DistrictAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-29T00:00:00Z" }, as: DistrictAdmin }
            - { call: "POST /absences", payload: { staff_member_id: "${t1}", start_date: "2026-08-03", end_date: "2026-08-18", absence_type: "SICK", required_subject: "MATH", required_grade_band: "HIGH" }, as: Teacher, as_user_id: "${t1}", captures: { abs1: $.data.id } }
            - { call: "POST /absences/${abs1}/review", payload: { decision: "APPROVE" }, as: DistrictAdmin }
            - { call: "POST /assignments", payload: { absence_id: "${abs1}", substitute_id: "${subA}" }, as: SchoolCoordinator, as_user_id: "${coord}", captures: { asg1: $.data.id } }
            - { call: "POST /assignments/${asg1}/respond", payload: { decision: "ACCEPT" }, as: Substitute, as_user_id: "${subA}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-18T18:00:00Z" }, as: DistrictAdmin }
            - { call: "POST /assignments/${asg1}/report-outcome", payload: { outcome: "WORKED" }, as: SchoolCoordinator, as_user_id: "${coord}" }
            - { call: "POST /timesheets", payload: { assignment_id: "${asg1}", work_date: "2026-08-03", hours_worked: 8.0 }, as: Substitute, as_user_id: "${subA}", captures: { ts1: $.data.id } }
            - { call: "POST /timesheets", payload: { assignment_id: "${asg1}", work_date: "2026-08-04", hours_worked: 8.0 }, as: Substitute, as_user_id: "${subA}", captures: { ts2: $.data.id } }
            - { call: "POST /timesheets", payload: { assignment_id: "${asg1}", work_date: "2026-08-05", hours_worked: 8.0 }, as: Substitute, as_user_id: "${subA}", captures: { ts3: $.data.id } }
            - { call: "POST /timesheets", payload: { assignment_id: "${asg1}", work_date: "2026-08-06", hours_worked: 8.0 }, as: Substitute, as_user_id: "${subA}", captures: { ts4: $.data.id } }
            - { call: "POST /timesheets", payload: { assignment_id: "${asg1}", work_date: "2026-08-07", hours_worked: 8.0 }, as: Substitute, as_user_id: "${subA}", captures: { ts5: $.data.id } }
            - { call: "POST /timesheets", payload: { assignment_id: "${asg1}", work_date: "2026-08-10", hours_worked: 8.0 }, as: Substitute, as_user_id: "${subA}", captures: { ts6: $.data.id } }
            - { call: "POST /timesheets", payload: { assignment_id: "${asg1}", work_date: "2026-08-11", hours_worked: 8.0 }, as: Substitute, as_user_id: "${subA}", captures: { ts7: $.data.id } }
