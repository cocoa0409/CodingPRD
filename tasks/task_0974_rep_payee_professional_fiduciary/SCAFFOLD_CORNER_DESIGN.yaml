          setup: ["ACTIVE client, funded RESTRICTED account (100000), ACTIVE bond through 2027, APPROVED 2026-06 budget, order GRANTED with expiry 2026-06-30, disbursement 20000 APPROVED with the order; clock then advanced to 2026-07-01"]
