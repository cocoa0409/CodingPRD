  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: decline_releases_bed_then_promotes_waitlist_depth3
        grounds:
          - state_machines.Application.OFFERED_to_DECLINED
          - state_machines.Application.SUBMITTED_to_WAITLISTED
          - calculations.lottery_offer_selection
          - entities.WaitlistEntry.fields.status
        distinguishing_aspect: |
          Depth-3 cascade from POST decline: (1) Application -> DECLINED releases
          the offered bed on the Room; (2) the now-free Room triggers
          waitlist_promotion which mutates the head WaitlistEntry -> PROMOTED;
          (3) that promotion mutates the promoted Application WAITLISTED ->
          OFFERED on the freed Room. Each hop caused by the prior.
        test_recipe:
          setup:
            - "One SINGLE room; two SUBMITTED apps; high-priority SENIOR offered the room, low-priority FRESHMAN WAITLISTED with a QUEUED entry; cycle ASSIGNMENT_OPEN"
          setup_api_calls:
