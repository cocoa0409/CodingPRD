# =============================================================================
# Task 0893 — Sex-Offender & Registrant Compliance (SORNA)
# Difficulty: Expert
# =============================================================================

scenario: |
  893. Sex-Offender & Registrant Compliance (SORNA): registration & tier/verification,
  address & employment/school update, periodic verification schedule, absconder &
  non-compliance flag, community-notification & exclusion-zone, travel/inter-jurisdiction,
  petition-to-deregister, reporting

domain_name: sorna-registrant-compliance
api_prefix: /sorna

# -----------------------------------------------------------------------------
# Complexity Profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects
    - optimistic_concurrency
    - dual_variant_calculation
    - scheduled_deferred_actions
    - derived_field_reconciliation

  entity_topology: flat
  # All entities are top-level collections under /sorna keyed by foreign-key
  # references (registrant_id, jurisdiction_id); no nesting in the resource
  # identity path beyond the create/list convenience sub-resources.

  state_machine_shape: cyclic
  # Registrant loops ACTIVE<->DELINQUENT and ABSCONDER->ACTIVE; TravelNotice and
  # Petition are branching fork-join machines.

  relationship_patterns:
    - one_to_many          # Registrant -> Offense/Address/VerificationEvent/Flag/TravelNotice/Notification/Petition
    - cross_aggregate      # Registrant.jurisdiction_id, TravelNotice.destination_jurisdiction_id, ExclusionZone.jurisdiction_id

  role_model: segregation_of_duties
  # RegistrationOfficer opens flags / records verifications / decides travel;
  # ComplianceReviewer alone decides petitions; RegistryAdmin owns config;
  # Registrant self-serves address updates, travel notices, and petitions on
  # its own record only.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Jurisdiction
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Jurisdiction / agency name" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code" }
      - { name: verification_grace_days, type: integer, source: input, default: 3, description: "Days past next_verification_due before a registrant is deemed overdue" }
      - { name: est_households_per_notification, type: integer, source: input, default: 100, description: "Baseline household count used by the estimated community-notification variant" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | INACTIVE; INACTIVE jurisdictions cannot receive inbound travel or relocation", constraints: "enum: ACTIVE, INACTIVE" }
      - { name: active_registrant_count, type: integer, source: computed, description: "Count of Registrant rows with jurisdiction_id == this.id and status in {ACTIVE, DELINQUENT}" }
      - { name: active_travel_hold_count, type: integer, source: computed, description: "Count of inbound TravelNotice rows (destination_jurisdiction_id == this.id) currently in status APPROVED or ACTIVE" }

  - name: ExclusionZone
    parent: Jurisdiction
    common_fields: true
    fields:
      - { name: jurisdiction_id, type: string, source: system, description: "FK -> Jurisdiction.id; owning jurisdiction (from path)" }
      - { name: name, type: string, source: input, description: "Zone name" }
      - { name: zone_type, type: enum, source: input, description: "Protected-place category", constraints: "enum: SCHOOL, PARK, DAYCARE" }
      - { name: center_x, type: integer, source: input, description: "Zone center X coordinate in integer meters on the jurisdiction grid" }
      - { name: center_y, type: integer, source: input, description: "Zone center Y coordinate in integer meters on the jurisdiction grid" }
      - { name: radius_meters, type: integer, source: input, description: "Protected radius in meters" }
      - { name: buffer_meters, type: integer, source: input, default: 100, description: "Additional statutory buffer in meters added to radius" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE (zones are enforced from creation; no deactivation path in this version)", constraints: "enum: ACTIVE" }

  - name: Registrant
    parent: null
    common_fields: true
    fields:
      - { name: jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id; jurisdiction of registration" }
      - { name: full_name, type: string, source: input, description: "Registrant legal name" }
      - { name: date_of_birth, type: datetime, source: input, description: "Date of birth (ISO 8601 UTC)" }
      - { name: initial_registration_date, type: datetime, source: computed, description: "Set to the logical clock at activation; anchor for duration/deregistration eligibility" }
      - { name: tier, type: enum, source: computed, description: "TIER_1 | TIER_2 | TIER_3, derived from offenses by tier_score", constraints: "enum: TIER_1, TIER_2, TIER_3" }
      - { name: tier_score, type: integer, source: computed, description: "Numeric score from offenses driving tier (see calculations.tier_score)" }
      - { name: verification_interval_days, type: integer, source: computed, description: "Periodic verification interval derived from tier: TIER_1=365, TIER_2=180, TIER_3=90" }
      - { name: last_verified_date, type: datetime, source: computed, description: "completed_date of the most recent VERIFIED VerificationEvent, else null" }
      - { name: next_verification_due, type: datetime, source: computed, description: "last_verified_date (or initial_registration_date) + verification_interval_days" }
      - { name: risk_score, type: integer, source: computed, description: "Provisional risk score over OPEN ComplianceFlags with time decay (see calculations.risk_score)" }
      - { name: current_residence_address_id, type: string, source: computed, description: "id of the VERIFIED Address with address_type RESIDENCE, else null" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING -> ACTIVE <-> DELINQUENT, -> ABSCONDER -> ACTIVE, -> DEREGISTERED", constraints: "enum: PENDING, ACTIVE, DELINQUENT, ABSCONDER, DEREGISTERED" }

  - name: Offense
    parent: Registrant
    common_fields: false
    fields:
      - { name: registrant_id, type: string, source: system, description: "FK -> Registrant.id; owning registrant (from path)" }
      - { name: statute_code, type: string, source: input, description: "Statute / offense code" }
      - { name: offense_class, type: enum, source: input, description: "Severity class", constraints: "enum: CLASS_A, CLASS_B, CLASS_C" }
      - { name: is_aggravated, type: boolean, source: input, default: false, description: "Aggravating circumstance flag" }
      - { name: victim_minor, type: boolean, source: input, default: false, description: "Victim was a minor" }
      - { name: conviction_date, type: datetime, source: input, description: "Conviction date (ISO 8601 UTC)" }
      - { name: offense_points, type: integer, source: computed, description: "Per-offense contribution to tier_score (see calculations.tier_score)" }

  - name: Address
    parent: Registrant
    common_fields: true
    fields:
      - { name: registrant_id, type: string, source: system, description: "FK -> Registrant.id; owning registrant (from path)" }
      - { name: address_type, type: enum, source: input, description: "Kind of address", constraints: "enum: RESIDENCE, EMPLOYMENT, SCHOOL, TEMPORARY" }
      - { name: line1, type: string, source: input, description: "Street line" }
      - { name: city, type: string, source: input, description: "City" }
      - { name: state_code, type: string, source: input, description: "State code" }
      - { name: postal_code, type: string, source: input, description: "Postal code" }
      - { name: grid_x, type: integer, source: input, description: "X coordinate in integer meters on the jurisdiction grid" }
      - { name: grid_y, type: integer, source: input, description: "Y coordinate in integer meters on the jurisdiction grid" }
      - { name: effective_from, type: datetime, source: input, description: "Start of occupancy window (required for TEMPORARY, else defaults to clock at creation)" }
      - { name: effective_to, type: datetime, source: input, description: "End of occupancy window (required for TEMPORARY, null otherwise)" }
      - { name: status, type: enum, source: system, default: VERIFIED, description: "VERIFIED | HISTORICAL; a new RESIDENCE supersedes the prior one which becomes HISTORICAL", constraints: "enum: VERIFIED, HISTORICAL" }

  - name: VerificationEvent
    parent: Registrant
    common_fields: false
    fields:
      - { name: registrant_id, type: string, source: system, description: "FK -> Registrant.id; owning registrant (from path)" }
      - { name: verification_type, type: enum, source: input, description: "Reason for verification", constraints: "enum: INITIAL, PERIODIC, ADDRESS_CHANGE" }
      - { name: method, type: enum, source: input, default: IN_PERSON, description: "Verification method", constraints: "enum: IN_PERSON, MAIL" }
      - { name: officer_ref, type: string, source: input, description: "Opaque id of the recording officer" }
      - { name: completed_date, type: datetime, source: computed, description: "Logical clock at recording" }
      - { name: result, type: enum, source: system, default: VERIFIED, description: "Always VERIFIED in this version", constraints: "enum: VERIFIED" }

  - name: ComplianceFlag
    parent: Registrant
    common_fields: true
    fields:
      - { name: registrant_id, type: string, source: system, description: "FK -> Registrant.id; owning registrant (from path)" }
      - { name: flag_type, type: enum, source: input, description: "Non-compliance category", constraints: "enum: LATE_VERIFICATION, UNREPORTED_MOVE, EXCLUSION_VIOLATION, TRAVEL_VIOLATION, ABSCONDED" }
      - { name: severity, type: enum, source: computed, description: "MINOR | MAJOR | CRITICAL derived from flag_type (see calculations.flag_severity)", constraints: "enum: MINOR, MAJOR, CRITICAL" }
      - { name: base_points, type: integer, source: computed, description: "Undecayed points for flag_type: MINOR=5, MAJOR=15, CRITICAL=40" }
      - { name: opened_date, type: datetime, source: computed, description: "Logical clock when flag opened" }
      - { name: resolved_date, type: datetime, source: computed, description: "Logical clock when flag resolved, else null" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | RESOLVED", constraints: "enum: OPEN, RESOLVED" }
      - { name: note, type: string, source: input, description: "Optional free-text note" }

  - name: TravelNotice
    parent: Registrant
    common_fields: true
    fields:
      - { name: registrant_id, type: string, source: system, description: "FK -> Registrant.id; owning registrant (from path)" }
      - { name: destination_jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id; destination jurisdiction" }
      - { name: travel_type, type: enum, source: input, description: "Nature of travel", constraints: "enum: TEMPORARY, RELOCATION" }
      - { name: departure_date, type: datetime, source: input, description: "Window start (ISO 8601 UTC)" }
      - { name: return_date, type: datetime, source: input, description: "Window end (required for TEMPORARY; null for RELOCATION)" }
      - { name: decision_note, type: string, source: input, description: "Officer note supplied on the decision call" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED -> APPROVED|DENIED; APPROVED -> ACTIVE|CANCELLED; ACTIVE -> COMPLETED|OVERDUE|CANCELLED", constraints: "enum: SUBMITTED, APPROVED, DENIED, ACTIVE, COMPLETED, OVERDUE, CANCELLED" }

  - name: NotificationRecord
    parent: Registrant
    common_fields: false
    fields:
      - { name: registrant_id, type: string, source: system, description: "FK -> Registrant.id; subject registrant (from path)" }
      - { name: audience_scope, type: enum, source: input, description: "Intended audience", constraints: "enum: LAW_ENFORCEMENT, SCHOOLS_ONLY, PUBLIC" }
      - { name: radius_meters, type: integer, source: computed, description: "Notification radius by tier: TIER_1=0, TIER_2=500, TIER_3=1500" }
      - { name: estimated_recipients, type: integer, source: computed, description: "Forward-looking estimate (see calculations.notification_recipients, estimated variant)" }
      - { name: actual_recipients, type: integer, source: computed, description: "Actual count at dispatch (see calculations.notification_recipients, actual variant)" }
      - { name: dispatched_date, type: datetime, source: computed, description: "Logical clock at dispatch" }

  - name: Petition
    parent: Registrant
    common_fields: true
    fields:
      - { name: registrant_id, type: string, source: system, description: "FK -> Registrant.id; petitioning registrant (from path)" }
      - { name: petition_type, type: enum, source: input, description: "Relief sought", constraints: "enum: DEREGISTER, TIER_REDUCTION" }
      - { name: filed_date, type: datetime, source: computed, description: "Logical clock at filing" }
      - { name: adjudicated_risk_score, type: integer, source: computed, description: "Lifetime risk over ALL flags (OPEN+RESOLVED), undecayed, at filing (see calculations.risk_score, adjudicated variant)" }
      - { name: eligibility_met, type: boolean, source: computed, description: "Whether deregistration eligibility held at filing (see calculations.deregistration_eligibility)" }
      - { name: reviewer_ref, type: string, source: input, description: "Opaque id of the deciding reviewer, set on the decision call" }
      - { name: decided_date, type: datetime, source: computed, description: "Logical clock at decision, else null" }
      - { name: decision, type: enum, source: system, default: PENDING, description: "PENDING -> GRANTED | DENIED | WITHDRAWN", constraints: "enum: PENDING, GRANTED, DENIED, WITHDRAWN" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Registrant
    initial_state: PENDING
    terminal_states: [DEREGISTERED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /sorna/registrants/{id}/activate"
        actor: RegistrationOfficer
        preconditions:
          - "Registrant has at least one Offense (else ERR_NO_OFFENSES)"
        side_effects:
          - "Set initial_registration_date = logical clock"
          - "Compute tier / tier_score / verification_interval_days from offenses"
          - "Set last_verified_date = null; next_verification_due = initial_registration_date + verification_interval_days"

      - from: ACTIVE
        to: DELINQUENT
        trigger: "system: on ComplianceFlag open when recomputed risk_score >= DELINQUENT_THRESHOLD (15)"
        actor: system
        preconditions:
          - "A ComplianceFlag was just opened whose contribution pushes risk_score >= 15"
        side_effects:
          - "Recompute risk_score over OPEN flags"
          - "Cascade: any Petition of this registrant in decision PENDING transitions to DENIED (eligibility lost)"

      - from: DELINQUENT
        to: ACTIVE
        trigger: "system: on ComplianceFlag resolve when no OPEN flags remain and risk_score < 15"
        actor: system
        preconditions:
          - "Registrant has zero ComplianceFlag rows in status OPEN after the resolve, and status != ABSCONDER"
        side_effects:
          - "Recompute risk_score over OPEN flags (-> 0 when none remain)"

      - from: ACTIVE
        to: ABSCONDER
        trigger: "POST /sorna/registrants/{id}/flags with flag_type ABSCONDED"
        actor: RegistrationOfficer
        preconditions: []
        side_effects:
          - "Open a CRITICAL ABSCONDED flag; recompute risk_score"
          - "Cascade: any TravelNotice of this registrant in status SUBMITTED/APPROVED/ACTIVE transitions to CANCELLED and decrements destination Jurisdiction.active_travel_hold_count when it was APPROVED/ACTIVE"

      - from: DELINQUENT
        to: ABSCONDER
        trigger: "POST /sorna/registrants/{id}/flags with flag_type ABSCONDED"
        actor: RegistrationOfficer
        preconditions: []
        side_effects:
          - "Open a CRITICAL ABSCONDED flag; recompute risk_score"

      - from: ABSCONDER
        to: ACTIVE
        trigger: "POST /sorna/compliance-flags/{id}/resolve on the ABSCONDED flag"
        actor: RegistrationOfficer
        preconditions:
          - "The resolved flag has flag_type ABSCONDED and no other OPEN flags remain"
        side_effects:
          - "Recompute risk_score"

      - from: ACTIVE
        to: DEREGISTERED
        trigger: "POST /sorna/petitions/{id}/decision with decision GRANT"
        actor: ComplianceReviewer
        preconditions:
          - "Petition.decision == PENDING and Petition.petition_type == DEREGISTER"
          - "Registrant.status == ACTIVE and zero OPEN ComplianceFlags"
          - "Deregistration eligibility holds at decision (calculations.deregistration_eligibility)"
        side_effects:
          - "Set Petition.decision = GRANTED, decided_date = clock"
          - "Cascade: every Address of this registrant in status VERIFIED transitions to HISTORICAL"
          - "Set current_residence_address_id = null"

  - entity: TravelNotice
    initial_state: SUBMITTED
    terminal_states: [DENIED, COMPLETED, CANCELLED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /sorna/travel-notices/{id}/decision with decision APPROVE"
        actor: RegistrationOfficer
        preconditions:
          - "Owning Registrant.status == ACTIVE (else ERR_REGISTRANT_NOT_ACTIVE)"
          - "Destination Jurisdiction.status == ACTIVE (else ERR_JURISDICTION_INACTIVE)"
        side_effects:
          - "Increment destination Jurisdiction.active_travel_hold_count by 1"

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /sorna/travel-notices/{id}/decision with decision DENY"
        actor: RegistrationOfficer
        preconditions: []
        side_effects:
          - "Record decision_note; no hold count change"

      - from: APPROVED
        to: ACTIVE
        trigger: "POST /sorna/registrants/{id}/verification-check (system re-evaluation) when clock >= departure_date"
        actor: system
        preconditions:
          - "clock >= departure_date"
        side_effects: []

      - from: APPROVED
        to: CANCELLED
        trigger: "POST /sorna/travel-notices/{id}/cancel"
        actor: RegistrationOfficer
        preconditions: []
        side_effects:
          - "Decrement destination Jurisdiction.active_travel_hold_count by 1 (compensating; restores pre-approval value)"

      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /sorna/travel-notices/{id}/cancel"
        actor: RegistrationOfficer
        preconditions: []
        side_effects:
          - "Decrement destination Jurisdiction.active_travel_hold_count by 1 (compensating)"

      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /sorna/registrants/{id}/verification-check (system) when travel_type TEMPORARY and clock >= return_date"
        actor: system
        preconditions:
          - "travel_type == TEMPORARY and clock >= return_date"
        side_effects:
          - "Decrement destination Jurisdiction.active_travel_hold_count by 1"

      - from: ACTIVE
        to: OVERDUE
        trigger: "POST /sorna/registrants/{id}/verification-check (system) when TEMPORARY and clock > return_date + TRAVEL_OVERDUE_GRACE_DAYS and not completed"
        actor: system
        preconditions:
          - "travel_type == TEMPORARY and clock > return_date + TRAVEL_OVERDUE_GRACE_DAYS (2)"
        side_effects:
          - "Open a MAJOR TRAVEL_VIOLATION ComplianceFlag on the registrant"

  - entity: Petition
    initial_state: PENDING
    terminal_states: [GRANTED, DENIED, WITHDRAWN]
    transitions:
      - from: PENDING
        to: GRANTED
        trigger: "POST /sorna/petitions/{id}/decision with decision GRANT"
        actor: ComplianceReviewer
        preconditions:
          - "Registrant.status == ACTIVE with zero OPEN flags and deregistration eligibility holds"
        side_effects:
          - "Cascade into Registrant ACTIVE -> DEREGISTERED (see Registrant machine)"

      - from: PENDING
        to: DENIED
        trigger: "POST /sorna/petitions/{id}/decision with decision DENY, OR system cascade when Registrant becomes DELINQUENT"
        actor: ComplianceReviewer | system
        preconditions: []
        side_effects:
          - "Set decided_date = clock"

      - from: PENDING
        to: WITHDRAWN
        trigger: "POST /sorna/petitions/{id}/decision with decision WITHDRAW"
        actor: ComplianceReviewer
        preconditions: []
        side_effects: []

# -----------------------------------------------------------------------------
# 1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: address-create-stale-registrant
    parent_entity: Registrant
    write_endpoint: "POST /sorna/registrants/{id}/addresses"
    occ_field: "expected_registrant_version"
    description: |
      Adding a RESIDENCE Address supersedes the registrant's prior RESIDENCE
      (marking it HISTORICAL and repointing current_residence_address_id), which
      is a legitimate mutation of the registrant. A create that carries a
      registrant version older than the registrant's current version is rejected
      as stale: another residence update has already advanced the record since
      the client last read it.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: flag_severity
    trigger: "On ComplianceFlag creation"
    algorithm: aggregation
    formula: |
      severity/base_points by flag_type:
        LATE_VERIFICATION -> MAJOR, 15
        UNREPORTED_MOVE   -> MAJOR, 15
        TRAVEL_VIOLATION  -> MINOR, 5     # note: TRAVEL_VIOLATION is MINOR
        EXCLUSION_VIOLATION -> CRITICAL, 40
        ABSCONDED         -> CRITICAL, 40
    input_set: "The single flag being created"
    constants: { MINOR: 5, MAJOR: 15, CRITICAL: 40 }
    precision: "integer"

  - name: tier_score
    trigger: "On POST offense and on Registrant activation"
    algorithm: weighted_scoring
    formula: |
      # Mode (a): >=3 inputs, non-linear interaction (multiplier + tiered selection).
      base(offense_class): CLASS_A=30, CLASS_B=20, CLASS_C=10
      agg = AGG_BONUS if offense.is_aggravated else 0
      raw = base + agg
      offense_points = round_half_up(raw * (MINOR_MULT if offense.victim_minor else 1.0))
      # offense_points is stored per Offense.
      total_offense_points = sum(offense_points over all offenses of registrant)
      prior_conviction_bonus = max(0, (offense_count - 1)) * PRIOR_BONUS_PER
      tier_score = total_offense_points + prior_conviction_bonus
      tier = TIER_3 if tier_score >= T3_MIN
             else TIER_2 if tier_score >= T2_MIN
             else TIER_1
      verification_interval_days = 365 if TIER_1 else 180 if TIER_2 else 90
    input_set: "All Offense rows of the registrant"
    constants: { CLASS_A: 30, CLASS_B: 20, CLASS_C: 10, AGG_BONUS: 10, MINOR_MULT: 1.5, PRIOR_BONUS_PER: 5, T2_MIN: 30, T3_MIN: 60 }
    precision: "round_half_up at the per-offense multiply step, then integer sum"

  - name: risk_score
    trigger: "On ComplianceFlag open/resolve; adjudicated variant on Petition filing"
    algorithm: decay_function
    formula: |
      # Mode (b): per-flag rounding BEFORE summation is pinned.
      days_open = floor((clock - flag.opened_date) in days)          # >= 0
      decay_factor = max(DECAY_FLOOR, 1.0 - DECAY_PER_DAY * days_open)
      contribution = round_half_up(flag.base_points * decay_factor)  # round EACH flag first
      provisional risk_score = sum(contribution over flags with status OPEN)  # then sum
      DELINQUENT when risk_score >= DELINQUENT_THRESHOLD (15)
    input_set: "provisional: OPEN flags only; adjudicated: ALL flags (OPEN+RESOLVED)"
    constants: { DECAY_PER_DAY: 0.01, DECAY_FLOOR: 0.5, DELINQUENT_THRESHOLD: 15 }
    precision: "round_half_up per flag, then integer sum"
    variants:
      - name: provisional
        when: "Live Registrant.risk_score, and DELINQUENT threshold checks"
        difference: "Includes only OPEN flags; applies time decay per flag"
      - name: adjudicated
        when: "Petition.adjudicated_risk_score computed at filing"
        difference: "Includes ALL flags ever opened (OPEN+RESOLVED); NO decay (uses full base_points)"

  - name: verification_schedule
    trigger: "On activation and on POST verification (reset); evaluated by verification-check"
    algorithm: threshold
    formula: |
      last = completed_date of most recent VERIFIED VerificationEvent, else initial_registration_date
      next_verification_due = last + verification_interval_days
      overdue when clock >= next_verification_due + jurisdiction.verification_grace_days  # >= boundary
    input_set: "VERIFIED VerificationEvent rows of the registrant + owning jurisdiction grace"
    constants: {}
    precision: "whole days"

  - name: exclusion_proximity
    trigger: "On POST address with address_type RESIDENCE"
    algorithm: threshold
    formula: |
      For each ACTIVE ExclusionZone in the registrant's jurisdiction:
        distance = sqrt((addr.grid_x - zone.center_x)^2 + (addr.grid_y - zone.center_y)^2)
        prohibited when distance <= zone.radius_meters + zone.buffer_meters   # <= boundary
      If any zone prohibits -> ERR_EXCLUSION_ZONE_VIOLATION
    input_set: "ACTIVE ExclusionZone rows in registrant.jurisdiction_id"
    constants: {}
    precision: "exact real distance; comparison is <= threshold"

  - name: notification_recipients
    trigger: "On POST notification (dispatch)"
    algorithm: forward_looking
    formula: |
      radius_meters = 0 if TIER_1 else 500 if TIER_2 else 1500
      tier_multiplier = 0 if TIER_1 else 3 if TIER_2 else 10
      estimated_recipients = jurisdiction.est_households_per_notification * tier_multiplier
      actual_recipients = count of VERIFIED RESIDENCE Address rows belonging to
        OTHER registrants whose grid distance to the subject's current residence
        is <= radius_meters
    input_set: "estimated: owning jurisdiction config; actual: all other registrants' VERIFIED RESIDENCE addresses"
    constants: { TIER1_RADIUS: 0, TIER2_RADIUS: 500, TIER3_RADIUS: 1500, TIER1_MULT: 0, TIER2_MULT: 3, TIER3_MULT: 10 }
    precision: "integer counts"
    variants:
      - name: estimated
        when: "Forward-looking projection from jurisdiction household baseline"
        difference: "Uses est_households_per_notification * tier_multiplier; ignores actual addresses"
      - name: actual
        when: "Measured at dispatch"
        difference: "Counts real VERIFIED RESIDENCE addresses of other registrants within radius"

  - name: deregistration_eligibility
    trigger: "On Petition filing and re-checked on GRANT decision"
    algorithm: threshold
    formula: |
      MIN_YEARS by tier: TIER_1=10, TIER_2=25, TIER_3=999 (lifetime, never eligible)
      duration_met = clock >= initial_registration_date + MIN_YEARS[tier] years
      clean = (count OPEN flags == 0) AND (no ComplianceFlag with severity CRITICAL ever)
              AND (adjudicated_risk_score < ADJ_MAX)
      eligibility_met = (petition_type == DEREGISTER) AND (tier != TIER_3)
                        AND duration_met AND clean
    input_set: "Registrant tier + all ComplianceFlag rows"
    constants: { TIER1_MIN_YEARS: 10, TIER2_MIN_YEARS: 25, TIER3_MIN_YEARS: 999, ADJ_MAX: 30 }
    precision: "whole years for duration"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and recognized", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all except POST /sorna/_clock/set_current_utc auth is still required" }
  - { priority: 2, category: auth, check: "Acting role is permitted for this operation per RBAC; entity_backed Registrant may act only on its own record (X-User-ID == registrant.id)", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path resources exist, validated left-to-right (jurisdiction, registrant, address, compliance-flag, travel-notice, petition, exclusion-zone)", error_id: "ERR_<RESOURCE>_NOT_FOUND", http_status: 404, applies_to: "all id-bearing paths" }
  - { priority: 4, category: state, check: "Target resource is in a state that permits the transition (registrant ACTIVE for travel/notification/petition-file; flag OPEN for resolve; petition/travel PENDING/SUBMITTED for decision; registrant PENDING for activate)", error_id: "ERR_<STATE>", http_status: 409, applies_to: "all state-changing endpoints" }
  - { priority: 5, category: business_referential, check: "Foreign keys supplied in the body resolve (destination_jurisdiction_id on travel-notices)", error_id: ERR_JURISDICTION_NOT_FOUND, http_status: 404, applies_to: "POST /sorna/registrants/{id}/travel-notices" }
  - { priority: 6, category: business_temporal, check: "Date ordering / not-in-past: TEMPORARY travel requires return_date > departure_date and departure_date >= clock; TEMPORARY address requires effective_to > effective_from", error_id: ERR_INVALID_TRAVEL_DATES, http_status: 422, applies_to: "POST /sorna/registrants/{id}/travel-notices, POST /sorna/registrants/{id}/addresses" }
  - { priority: 7, category: business_safety, check: "RESIDENCE address must not fall within any ACTIVE exclusion zone (distance <= radius + buffer)", error_id: ERR_EXCLUSION_ZONE_VIOLATION, http_status: 409, applies_to: "POST /sorna/registrants/{id}/addresses" }
  - { priority: 8, category: business_constraint, check: "No overlapping travel window (half-open) for the registrant; no overlapping TEMPORARY address window (closed, touching endpoints conflict); no duplicate PENDING petition; TEMPORARY travel/address require a return/effective_to", error_id: "ERR_<CONFLICT>", http_status: 409, applies_to: "POST travel-notices, POST addresses, POST petitions" }
  - { priority: 9, category: state, check: "OCC: expected_registrant_version must equal Registrant.version on address create", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /sorna/registrants/{id}/addresses" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Jurisdiction / configuration ----
  - { method: POST, path: "/sorna/jurisdictions", description: "Create a jurisdiction (status defaults ACTIVE; may be seeded INACTIVE for testing inbound-travel gating)", roles: [RegistryAdmin], code: 201, input: [name, state_code, "verification_grace_days?", "est_households_per_notification?", "status?"], output: Jurisdiction, side_effects: ["active_registrant_count=0, active_travel_hold_count=0, status defaults ACTIVE"] }
  - { method: GET, path: "/sorna/jurisdictions/{id}", description: "Read a jurisdiction", roles: [RegistryAdmin, RegistrationOfficer, ComplianceReviewer], code: 200, input: [], output: Jurisdiction, side_effects: [] }
  - { method: POST, path: "/sorna/jurisdictions/{id}/exclusion-zones", description: "Create an exclusion zone in a jurisdiction", roles: [RegistryAdmin], code: 201, input: [name, zone_type, center_x, center_y, radius_meters, "buffer_meters?"], output: ExclusionZone, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/sorna/jurisdictions/{id}/exclusion-zones", description: "List exclusion zones of a jurisdiction (reverse-reachability for ExclusionZone.jurisdiction_id)", roles: [RegistryAdmin, RegistrationOfficer], code: 200, input: [], output: "ExclusionZone[]", side_effects: [] }
  - { method: GET, path: "/sorna/exclusion-zones/{id}", description: "Read an exclusion zone", roles: [RegistryAdmin, RegistrationOfficer], code: 200, input: [], output: ExclusionZone, side_effects: [] }
  - { method: GET, path: "/sorna/jurisdictions/{id}/registrants", description: "List registrants of a jurisdiction (reverse-reachability for Registrant.jurisdiction_id)", roles: [RegistrationOfficer, ComplianceReviewer], code: 200, input: ["status?"], output: "Registrant[]", side_effects: [] }
  - { method: GET, path: "/sorna/jurisdictions/{id}/inbound-travel-notices", description: "List inbound travel notices (reverse-reachability for TravelNotice.destination_jurisdiction_id)", roles: [RegistrationOfficer, ComplianceReviewer], code: 200, input: [], output: "TravelNotice[]", side_effects: [] }
  - { method: GET, path: "/sorna/jurisdictions/{id}/compliance-report", description: "Computed roster report: registrant counts by status", roles: [ComplianceReviewer, RegistrationOfficer], code: 200, input: [], output: "{ total_registrants: integer, active_count: integer, delinquent_count: integer, absconder_count: integer, deregistered_count: integer }", side_effects: [] }

  # ---- Registrant lifecycle ----
  - { method: POST, path: "/sorna/registrants", description: "Register a new subject (PENDING)", roles: [RegistrationOfficer], code: 201, input: [jurisdiction_id, full_name, date_of_birth], output: Registrant, side_effects: ["status=PENDING; tier/risk_score unset until activation"] }
  - { method: GET, path: "/sorna/registrants/{id}", description: "Read a registrant", roles: [RegistrationOfficer, ComplianceReviewer, Registrant], code: 200, input: [], output: Registrant, side_effects: [] }
  - { method: POST, path: "/sorna/registrants/{id}/offenses", description: "Add a qualifying offense; recompute tier", roles: [RegistrationOfficer], code: 201, input: [statute_code, offense_class, "is_aggravated?", "victim_minor?", conviction_date], output: Offense, side_effects: ["compute offense_points; recompute Registrant.tier/tier_score/verification_interval_days"] }
  - { method: GET, path: "/sorna/registrants/{id}/offenses", description: "List offenses (reverse-reachability for Offense.registrant_id)", roles: [RegistrationOfficer], code: 200, input: [], output: "Offense[]", side_effects: [] }
  - { method: POST, path: "/sorna/registrants/{id}/activate", description: "Activate a PENDING registrant; set schedule", roles: [RegistrationOfficer], code: 200, input: [], output: Registrant, side_effects: ["set initial_registration_date, next_verification_due; status PENDING->ACTIVE"] }
  - { method: POST, path: "/sorna/registrants/{id}/addresses", description: "Add/update an address; RESIDENCE supersedes prior; OCC on registrant version", roles: [RegistrationOfficer, Registrant], code: 201, input: [address_type, line1, city, state_code, postal_code, grid_x, grid_y, "effective_from?", "effective_to?", expected_registrant_version], output: Address, side_effects: ["exclusion-zone check; prior RESIDENCE -> HISTORICAL; set current_residence_address_id; increments Registrant.version by 1"] }
  - { method: GET, path: "/sorna/registrants/{id}/addresses", description: "List addresses (reverse-reachability for Address.registrant_id)", roles: [RegistrationOfficer, Registrant], code: 200, input: ["address_type?"], output: "Address[]", side_effects: [] }

  # ---- Verification ----
  - { method: POST, path: "/sorna/registrants/{id}/verifications", description: "Record an in-person/mail verification; resets schedule", roles: [RegistrationOfficer], code: 201, input: [verification_type, "method?", officer_ref], output: VerificationEvent, side_effects: ["set completed_date=clock, result=VERIFIED; set last_verified_date; reset next_verification_due"] }
  - { method: GET, path: "/sorna/registrants/{id}/verifications", description: "List verification events (reverse-reachability for VerificationEvent.registrant_id)", roles: [RegistrationOfficer], code: 200, input: [], output: "VerificationEvent[]", side_effects: [] }
  - { method: POST, path: "/sorna/registrants/{id}/verification-check", description: "Evaluate schedule/travel windows against the clock; may open LATE_VERIFICATION flag and advance travel notices", roles: [RegistrationOfficer], code: 200, input: [], output: Registrant, side_effects: ["if overdue -> open MAJOR LATE_VERIFICATION flag -> risk_score -> ACTIVE->DELINQUENT -> cascade PENDING petition -> DENIED; advance APPROVED->ACTIVE, ACTIVE->COMPLETED/OVERDUE per travel windows"] }

  # ---- Compliance flags ----
  - { method: POST, path: "/sorna/registrants/{id}/flags", description: "Open a compliance flag (manual)", roles: [RegistrationOfficer], code: 201, input: [flag_type, "note?"], output: ComplianceFlag, side_effects: ["compute severity/base_points; recompute risk_score; may drive ACTIVE->DELINQUENT (and cascade PENDING petition->DENIED) or ->ABSCONDER for ABSCONDED"] }
  - { method: GET, path: "/sorna/registrants/{id}/flags", description: "List compliance flags (reverse-reachability for ComplianceFlag.registrant_id)", roles: [RegistrationOfficer, ComplianceReviewer], code: 200, input: ["status?"], output: "ComplianceFlag[]", side_effects: [] }
  - { method: POST, path: "/sorna/compliance-flags/{id}/resolve", description: "Resolve an OPEN compliance flag (compensating)", roles: [RegistrationOfficer], code: 200, input: [], output: ComplianceFlag, side_effects: ["status OPEN->RESOLVED, resolved_date=clock; recompute risk_score; if no OPEN flags remain -> DELINQUENT/ABSCONDER->ACTIVE"] }

  # ---- Travel / inter-jurisdiction ----
  - { method: POST, path: "/sorna/registrants/{id}/travel-notices", description: "Submit a travel or relocation notice", roles: [RegistrationOfficer, Registrant], code: 201, input: [destination_jurisdiction_id, travel_type, departure_date, "return_date?"], output: TravelNotice, side_effects: ["overlap check (half-open window); status=SUBMITTED"] }
  - { method: GET, path: "/sorna/registrants/{id}/travel-notices", description: "List travel notices (reverse-reachability for TravelNotice.registrant_id)", roles: [RegistrationOfficer, Registrant], code: 200, input: ["status?"], output: "TravelNotice[]", side_effects: [] }
  - { method: POST, path: "/sorna/travel-notices/{id}/decision", description: "Approve or deny a submitted travel notice", roles: [RegistrationOfficer], code: 200, input: [decision, "decision_note?"], output: TravelNotice, side_effects: ["APPROVE: requires registrant ACTIVE + destination ACTIVE, increments destination active_travel_hold_count; DENY: terminal"] }
  - { method: POST, path: "/sorna/travel-notices/{id}/cancel", description: "Cancel an approved/active travel notice (compensating)", roles: [RegistrationOfficer, Registrant], code: 200, input: [], output: TravelNotice, side_effects: ["status->CANCELLED; decrement destination active_travel_hold_count when it was APPROVED/ACTIVE"] }

  # ---- Community notification ----
  - { method: POST, path: "/sorna/registrants/{id}/notifications", description: "Dispatch a community notification; computes radius and recipient counts", roles: [RegistrationOfficer], code: 201, input: [audience_scope], output: NotificationRecord, side_effects: ["compute radius_meters, estimated_recipients, actual_recipients; dispatched_date=clock"] }
  - { method: GET, path: "/sorna/registrants/{id}/notifications", description: "List notifications (reverse-reachability for NotificationRecord.registrant_id)", roles: [RegistrationOfficer, ComplianceReviewer], code: 200, input: [], output: "NotificationRecord[]", side_effects: [] }

  # ---- Petition to deregister ----
  - { method: POST, path: "/sorna/registrants/{id}/petitions", description: "File a petition to deregister or reduce tier", roles: [Registrant, RegistrationOfficer], code: 201, input: [petition_type], output: Petition, side_effects: ["compute adjudicated_risk_score, eligibility_met; status PENDING; rejects duplicate PENDING petition"] }
  - { method: GET, path: "/sorna/registrants/{id}/petitions", description: "List petitions (reverse-reachability for Petition.registrant_id)", roles: [RegistrationOfficer, ComplianceReviewer, Registrant], code: 200, input: [], output: "Petition[]", side_effects: [] }
  - { method: GET, path: "/sorna/petitions/{id}", description: "Read a petition", roles: [RegistrationOfficer, ComplianceReviewer, Registrant], code: 200, input: [], output: Petition, side_effects: [] }
  - { method: POST, path: "/sorna/petitions/{id}/decision", description: "Grant/deny/withdraw a petition (segregation of duties: ComplianceReviewer only)", roles: [ComplianceReviewer], code: 200, input: [decision, "reviewer_ref?"], output: Petition, side_effects: ["GRANT: re-check eligibility, cascade Registrant->DEREGISTERED->addresses HISTORICAL; DENY/WITHDRAW: terminal"] }

  # ---- Test-driving ----
  - { method: POST, path: "/sorna/_clock/set_current_utc", description: "Set the logical clock. Server startup default is 2026-05-01T00:00:00Z; before any set, the clock reads exactly this default and never falls back to wall-clock time.", roles: [RegistryAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["advances logical clock used by all schedule/window/eligibility rules"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unrecognized X-User-Role or X-User-ID" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted, or Registrant acting on a record other than its own" }
  - { id: ERR_VALIDATION, http: 422, condition: "Missing required field or malformed value" }
  - { id: ERR_INVALID_ENUM, http: 422, condition: "Enum field carries a value outside its declared set" }
  - { id: ERR_JURISDICTION_NOT_FOUND, http: 404, condition: "Jurisdiction id in path or body does not exist" }
  - { id: ERR_REGISTRANT_NOT_FOUND, http: 404, condition: "Registrant id does not exist" }
  - { id: ERR_ADDRESS_NOT_FOUND, http: 404, condition: "Address id does not exist" }
  - { id: ERR_EXCLUSION_ZONE_NOT_FOUND, http: 404, condition: "Exclusion zone id does not exist" }
  - { id: ERR_FLAG_NOT_FOUND, http: 404, condition: "Compliance flag id does not exist" }
  - { id: ERR_TRAVEL_NOTICE_NOT_FOUND, http: 404, condition: "Travel notice id does not exist" }
  - { id: ERR_PETITION_NOT_FOUND, http: 404, condition: "Petition id does not exist" }
  - { id: ERR_REGISTRANT_NOT_PENDING, http: 409, condition: "activate called on a registrant not in PENDING" }
  - { id: ERR_NO_OFFENSES, http: 409, condition: "activate called with zero offenses" }
  - { id: ERR_REGISTRANT_NOT_ACTIVE, http: 409, condition: "Travel/notification/petition action requires registrant ACTIVE" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not allowed from current state (resolve non-OPEN flag; decide non-PENDING petition; decide non-SUBMITTED travel; cancel terminal travel)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_registrant_version != Registrant.version on address create (OCC)" }
  - { id: ERR_EXCLUSION_ZONE_VIOLATION, http: 409, condition: "RESIDENCE address within radius+buffer of an ACTIVE exclusion zone" }
  - { id: ERR_INVALID_TRAVEL_DATES, http: 422, condition: "return_date <= departure_date, departure_date in the past, or effective_to <= effective_from" }
  - { id: ERR_MISSING_TRAVEL_RETURN, http: 422, condition: "TEMPORARY travel or TEMPORARY address without a return_date / effective_to" }
  - { id: ERR_TRAVEL_WINDOW_CONFLICT, http: 409, condition: "New travel window overlaps an existing non-terminal window (half-open)" }
  - { id: ERR_ADDRESS_PERIOD_CONFLICT, http: 409, condition: "New TEMPORARY address window overlaps an existing TEMPORARY window (closed; touching endpoints conflict)" }
  - { id: ERR_JURISDICTION_INACTIVE, http: 409, condition: "Travel approval targets a jurisdiction whose status is INACTIVE" }
  - { id: ERR_DUPLICATE_ACTIVE_PETITION, http: 409, condition: "A PENDING petition already exists for the registrant" }
  - { id: ERR_PETITION_NOT_ELIGIBLE, http: 409, condition: "GRANT decision when deregistration eligibility does not hold (duration/clean/tier)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: RegistryAdmin
    description: "Owns configuration: jurisdictions, exclusion zones, and the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /sorna/jurisdictions"
      - "POST /sorna/jurisdictions/{id}/exclusion-zones"
      - "POST /sorna/_clock/set_current_utc"
    shared_operations:
      - "GET /sorna/jurisdictions/{id}"
      - "GET /sorna/jurisdictions/{id}/exclusion-zones"
      - "GET /sorna/exclusion-zones/{id}"

  - name: RegistrationOfficer
    description: "Front-line officer: registration, offenses, activation, addresses, verifications, flags, travel decisions, notifications"
    identity: "opaque"
    exclusive_operations:
      - "POST /sorna/registrants"
      - "POST /sorna/registrants/{id}/offenses"
      - "POST /sorna/registrants/{id}/activate"
      - "POST /sorna/registrants/{id}/verifications"
      - "POST /sorna/registrants/{id}/verification-check"
      - "POST /sorna/registrants/{id}/flags"
      - "POST /sorna/compliance-flags/{id}/resolve"
      - "POST /sorna/travel-notices/{id}/decision"
      - "POST /sorna/registrants/{id}/notifications"
    shared_operations:
      - "POST /sorna/registrants/{id}/addresses"
      - "POST /sorna/registrants/{id}/travel-notices"
      - "POST /sorna/travel-notices/{id}/cancel"
      - "POST /sorna/registrants/{id}/petitions"
      - "GET (registrant-scoped reads)"

  - name: ComplianceReviewer
    description: "Adjudicates petitions and reads compliance reports; cannot open flags or record verifications (segregation of duties)"
    identity: "opaque"
    exclusive_operations:
      - "POST /sorna/petitions/{id}/decision"
    shared_operations:
      - "GET /sorna/jurisdictions/{id}/compliance-report"
      - "GET /sorna/registrants/{id}/flags"
      - "GET /sorna/registrants/{id}/petitions"
      - "GET /sorna/petitions/{id}"

  - name: Registrant
    description: "Self-service subject: reads own record, submits address updates, travel notices, and petitions on its own record only"
    identity: "entity_backed:Registrant"
    exclusive_operations: []
    shared_operations:
      - "GET /sorna/registrants/{id} (own)"
      - "POST /sorna/registrants/{id}/addresses (own)"
      - "GET /sorna/registrants/{id}/addresses (own)"
      - "POST /sorna/registrants/{id}/travel-notices (own)"
      - "GET /sorna/registrants/{id}/travel-notices (own)"
      - "POST /sorna/travel-notices/{id}/cancel (own)"
      - "POST /sorna/registrants/{id}/petitions (own)"
      - "GET /sorna/registrants/{id}/petitions (own)"
      - "GET /sorna/petitions/{id} (own)"
