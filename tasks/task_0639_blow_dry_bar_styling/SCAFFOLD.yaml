    roles: [FrontDesk, FinanceManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, current_minute: integer }"
    side_effects: ["logical clock advanced; drives no-show eligibility and any time-gated rule"]

  - method: GET
