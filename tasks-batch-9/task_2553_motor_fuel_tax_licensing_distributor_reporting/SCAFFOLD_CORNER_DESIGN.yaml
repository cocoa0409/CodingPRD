          assert:
            - "HTTP 422; data.error_id == ERR_COUNTERPARTY_TYPE_INVALID"
            - "the identical line to ${wi_id} under ${wi_cert} returns HTTP 201, and GET /mft/schedules/${sch_id} then reports line_count == 1"
            - "GET /mft/schedule-lines with payload { exemption_certificate_id: ${mn_cert} } returns total_count == 0"

      - name: supplier_return_without_a_delivery_schedule_returns_missing_required_schedule
        claim_type: violation_to_error
        grounds:
          - validations[priority=203]
          - errors[ERR_MISSING_REQUIRED_SCHEDULE]
        distinguishing_aspect: "The rule has two independent limbs and both must bite: a SUPPLIER return carrying only a SCH_1_RECEIVED_TAX_PAID schedule is refused for want of a SCH_5_DELIVERED_TAX_COLLECTED schedule, and an entirely empty return of any licence type is refused as well."
        test_recipe:
          setup:
            - "Two SUPPLIERs - a filer and a counterparty - and one DISTRIBUTOR; clock at 2026-09-05T00:00:00Z."
            - "The filer's DRAFT 2026-08 return carries a single SCH_1 GASOLINE 800.00 schedule with one line from the counterparty supplier."
            - "The distributor holds a DRAFT 2026-08 return with no schedules at all."
          setup_api_calls:
