scaffold_corner_design:
- section: entities
  instances:
  - name: member_defaults_and_logical_clock_computed_fields
    claim_type: defaults
    grounds:
    - entities.ServiceMember.fields.service_status
    - entities.ServiceMember.fields.tap_stage
    - entities.ServiceMember.fields.active_match_count
    - entities.ServiceMember.fields.days_until_separation
    distinguishing_aspect: A freshly registered member carries every documented default, created_at is stamped from the DEFAULT logical clock
      2026-09-01T00:00:00Z (no wall-clock fallback), and days_until_separation recomputes when the clock moves.
    test_recipe:
      setup:
      - Empty database; logical clock untouched (reads the fixed default 2026-09-01T00:00:00Z)
      setup_api_calls:
      - call: POST /skillbridge/installations
        payload:
          name: Fort Liberty
          command_code: ACC
          region_code: R1
          max_internship_duration_days: 120
          appeal_window_days: 14
          requires_tap_complete: false
        as: ProgramOffice
        captures:
          inst: $.data.id
      trigger:
      - call: POST /skillbridge/service-members
        payload:
          full_name: Alice Vega
          service_branch: ARMY
          pay_grade: E5
          separation_date: '2027-01-15'
          skills:
          - LOGISTICS
          home_installation_id: ${inst}
        as: TransitionCounselor
        captures:
          m: $.data.id
          st: $.data.service_status
          tap: $.data.tap_stage
          amc: $.data.active_match_count
          ver: $.data.version
          dus: $.data.days_until_separation
          cat: $.data.created_at
      - call: POST /skillbridge/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-16T00:00:00Z'
        as: ProgramOffice
      - call: GET /skillbridge/service-members/${m}
        as: ProgramOffice
        captures:
          dus2: $.data.days_until_separation
      assert:
      - 'creation response: service_status == ACTIVE_DUTY, tap_stage == TAP_NOT_STARTED, active_match_count == 0, version == 1'
      - 'creation response: days_until_separation == 136 (2027-01-15 minus default clock 2026-09-01) and created_at == 2026-09-01T00:00:00Z'
      - 'after clock moves to 2026-09-16: days_until_separation == 121 (recomputed from the logical clock)'
  - name: invalid_enum_and_missing_required_fields_rejected
    claim_type: type_constraints
    grounds:
    - entities.ServiceMember.fields.service_branch
    - entities.EmployerOpening.fields.capacity
    - entities.EmployerOpening.fields.region_code
    - validations[priority=1.5]
    distinguishing_aspect: 'Schema gate fires before any business rule: an out-of-enum service_branch, a missing required capacity, and a missing
      conditionally-required region_code (ON_SITE) all return ERR_VALIDATION 400.'
    test_recipe:
      setup:
      - Installation inst exists; employer emp is AUTHORIZED
      setup_api_calls:
      - call: POST /skillbridge/installations
        payload:
          name: Fort Liberty
          command_code: ACC
          region_code: R1
          max_internship_duration_days: 120
          appeal_window_days: 14
          requires_tap_complete: false
        as: ProgramOffice
        captures:
          inst: $.data.id
      - call: POST /skillbridge/employers
        payload:
          legal_name: Acme Logistics LLC
          industry_code: LOG
        as: ProgramOffice
        captures:
          emp: $.data.id
      - call: POST /skillbridge/employers/${emp}/authorize
        payload: {}
        as: ProgramOffice
      trigger:
      - call: POST /skillbridge/service-members
        payload:
          full_name: Bad Branch
          service_branch: SPACE_MARINES
          pay_grade: E5
          separation_date: '2027-01-15'
          skills:
          - LOGISTICS
          home_installation_id: ${inst}
        as: TransitionCounselor
      - call: POST /skillbridge/employer-openings
        payload:
          employer_id: ${emp}
          title: No Capacity
          required_skills:
          - LOGISTICS
          location_type: REMOTE
        as: EmployerRep
        as_user_id: ${emp}
      - call: POST /skillbridge/employer-openings
        payload:
          employer_id: ${emp}
          title: Onsite No Region
          required_skills:
          - LOGISTICS
          location_type: ON_SITE
          capacity: 1
        as: EmployerRep
        as_user_id: ${emp}
      assert:
      - 'service_branch SPACE_MARINES: ERR_VALIDATION (400) — enum constraint'
      - 'opening without capacity: ERR_VALIDATION (400) — required field missing'
      - 'ON_SITE opening without region_code: ERR_VALIDATION (400) — conditional requirement'
  - name: event_entities_immutable_no_version
    claim_type: immutability
    grounds:
    - entities.SupervisionReport
    distinguishing_aspect: 'SupervisionReport is a common_fields:false event entity: its creation response carries id and created_at but no version
      or updated_at, and no update endpoint exists in §1.5.'
    test_recipe:
      setup:
      - ACTIVE match mt on opening op for member m (separation 2027-01-15), window [2026-10-01, 2026-10-31), plan approved, clock at 2026-10-01
      setup_api_calls:
      - call: POST /skillbridge/installations
        payload:
          name: Fort Liberty
          command_code: ACC
          region_code: R1
          max_internship_duration_days: 120
          appeal_window_days: 14
          requires_tap_complete: false
        as: ProgramOffice
        captures:
          inst: $.data.id
      - call: POST /skillbridge/service-members
        payload:
          full_name: Alice Vega
          service_branch: ARMY
          pay_grade: E5
          separation_date: '2027-01-15'
          skills:
          - LOGISTICS
          home_installation_id: ${inst}
        as: TransitionCounselor
        captures:
          m: $.data.id
      - call: POST /skillbridge/internship-applications
        payload:
          service_member_id: ${m}
        as: ServiceMember
        as_user_id: ${m}
        captures:
          app: $.data.id
      - call: POST /skillbridge/internship-applications/${app}/commander-decision
        payload:
          decision: APPROVE
        as: UnitCommander
        as_user_id: cmd-1
      - call: POST /skillbridge/employers
        payload:
          legal_name: Acme Logistics LLC
          industry_code: LOG
        as: ProgramOffice
        captures:
          emp: $.data.id
      - call: POST /skillbridge/employers/${emp}/authorize
        payload: {}
        as: ProgramOffice
      - call: POST /skillbridge/employer-openings
        payload:
          employer_id: ${emp}
          title: Warehouse Operations Intern
          required_skills:
          - LOGISTICS
          location_type: REMOTE
          capacity: 1
        as: EmployerRep
        as_user_id: ${emp}
        captures:
          op: $.data.id
          op_v: $.data.version
      - call: POST /skillbridge/internship-matches
        payload:
          internship_application_id: ${app}
          employer_opening_id: ${op}
          start_date: '2026-10-01'
          end_date: '2026-10-31'
          expected_employer_opening_version: ${op_v}
        as: EmployerRep
        as_user_id: ${emp}
        captures:
          mt: $.data.id
      - call: POST /skillbridge/internship-matches/${mt}/submit-plan
        payload:
          learning_objectives:
          - objective_code: O1
            description: Safety basics
            weight_hours: 10
          supervisor_name: S. Supervisor
          weekly_hours: 40
        as: EmployerRep
        as_user_id: ${emp}
      - call: POST /skillbridge/internship-matches/${mt}/review-plan
        payload:
          outcome: APPROVE
        as: InstallationAuthority
        as_user_id: auth-1
      - call: POST /skillbridge/internship-matches/${mt}/installation-decision
        payload:
          decision: APPROVE
        as: InstallationAuthority
        as_user_id: auth-1
      - call: POST /skillbridge/_clock/set_current_utc
        payload:
          to_iso8601: '2026-10-01T00:00:00Z'
        as: ProgramOffice
      trigger:
      - call: POST /skillbridge/supervision-reports
        payload:
          internship_match_id: ${mt}
          week_start_date: '2026-10-01'
          hours_supervised: 8
          supervisor_name: S. Supervisor
          attestation_text: week 1 ok
        as: EmployerRep
        as_user_id: ${emp}
        captures:
          rep: $.data.id
          rep_cat: $.data.created_at
      assert:
      - SupervisionReport response contains id and created_at == 2026-10-01T00:00:00Z
      - SupervisionReport response does NOT contain version or updated_at (immutable event entity)
  - name: opening_filled_count_computed
    claim_type: computed_fields
    grounds:
    - entities.EmployerOpening.fields.filled_count
    excluded_because:
      difficulty_instance: opening_slot_ledger_roundtrip
      rationale: filled_count is asserted at 0, 1, and back to 0 across the create/terminate round-trip in that difficulty instance.
- section: state_machines
  instances:
  - name: application_initial_state
    claim_type: initial_state
    grounds:
    - state_machines.InternshipApplication
    - entities.InternshipApplication.fields.appeal_deadline
    distinguishing_aspect: A submitted application starts SUBMITTED with appeal_count 0, null decision fields, null appeal_deadline, installation_id
      copied from the member, and the submission-time day count snapshotted.
    test_recipe:
      setup:
      - Installation inst; member m with separation 2027-01-15 (136 days out at the default clock)
      setup_api_calls:
      - call: POST /skillbridge/installations
        payload:
          name: Fort Liberty
          command_code: ACC
          region_code: R1
          max_internship_duration_days: 120
          appeal_window_days: 14
          requires_tap_complete: false
        as: ProgramOffice
        captures:
          inst: $.data.id
      - call: POST /skillbridge/service-members
        payload:
          full_name: Alice Vega
          service_branch: ARMY
          pay_grade: E5
          separation_date: '2027-01-15'
          skills:
          - LOGISTICS
          home_installation_id: ${inst}
        as: TransitionCounselor
        captures:
          m: $.data.id
      trigger:
      - call: POST /skillbridge/internship-applications
        payload:
          service_member_id: ${m}
        as: ServiceMember
        as_user_id: ${m}
        captures:
          app: $.data.id
          st: $.data.status
          ac: $.data.appeal_count
          dl: $.data.appeal_deadline
          snap: $.data.days_until_separation_at_submission
          ii: $.data.installation_id
          sa: $.data.submitted_at
      assert:
      - status == SUBMITTED, appeal_count == 0, appeal_deadline is null, decided_by_user_id is null
      - days_until_separation_at_submission == 136 (snapshot at the default clock)
      - installation_id == ${inst} (copied from member.home_installation_id) and submitted_at == 2026-09-01T00:00:00Z
  - name: commander_decision_on_decided_application_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.InternshipApplication.SUBMITTED_to_APPROVED
    distinguishing_aspect: commander-decision is only legal from SUBMITTED; a second decision on an APPROVED application is rejected and the recorded
      decision is untouched.
    test_recipe:
      setup:
      - Application app APPROVED by commander cmd-1
      setup_api_calls:
      - call: POST /skillbridge/installations
        payload:
          name: Fort Liberty
          command_code: ACC
          region_code: R1
          max_internship_duration_days: 120
          appeal_window_days: 14
          requires_tap_complete: false
        as: ProgramOffice
        captures:
          inst: $.data.id
      - call: POST /skillbridge/service-members
        payload:
          full_name: Alice Vega
          service_branch: ARMY
          pay_grade: E5
          separation_date: '2027-01-15'
          skills:
          - LOGISTICS
          home_installation_id: ${inst}
        as: TransitionCounselor
        captures:
          m: $.data.id
      - call: POST /skillbridge/internship-applications
        payload:
          service_member_id: ${m}
        as: ServiceMember
        as_user_id: ${m}
        captures:
          app: $.data.id
      - call: POST /skillbridge/internship-applications/${app}/commander-decision
        payload:
          decision: APPROVE
        as: UnitCommander
        as_user_id: cmd-1
      trigger:
      - call: POST /skillbridge/internship-applications/${app}/commander-decision
        payload:
          decision: DENY
          reason: second thoughts
        as: UnitCommander
        as_user_id: cmd-2
      - call: GET /skillbridge/internship-applications/${app}
        as: ProgramOffice
        captures:
          st: $.data.status
          by: $.data.decided_by_user_id
      assert:
      - second decision rejected ERR_APPLICATION_NOT_SUBMITTED (409)
      - application remains APPROVED with decided_by_user_id == cmd-1 (no overwrite)
  - name: tap_stage_skip_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.ServiceMember
    - validations[priority=15]
    distinguishing_aspect: 'TAP sequencing is strictly one step at a time: jumping from TAP_NOT_STARTED to CORE_CURRICULUM_DONE fails, while the
      exact next stage succeeds.'
    test_recipe:
      setup:
      - Member m registered (tap_stage TAP_NOT_STARTED)
      setup_api_calls:
      - call: POST /skillbridge/installations
        payload:
          name: Fort Liberty
          command_code: ACC
          region_code: R1
          max_internship_duration_days: 120
          appeal_window_days: 14
          requires_tap_complete: false
        as: ProgramOffice
        captures:
          inst: $.data.id
      - call: POST /skillbridge/service-members
        payload:
          full_name: Alice Vega
          service_branch: ARMY
          pay_grade: E5
          separation_date: '2027-01-15'
          skills:
          - LOGISTICS
          home_installation_id: ${inst}
        as: TransitionCounselor
        captures:
          m: $.data.id
      trigger:
      - call: POST /skillbridge/service-members/${m}/tap-advance
        payload:
          target_stage: CORE_CURRICULUM_DONE
        as: TransitionCounselor
      - call: POST /skillbridge/service-members/${m}/tap-advance
        payload:
          target_stage: PRESEPARATION_COUNSELING_DONE
        as: TransitionCounselor
        captures:
          tap: $.data.tap_stage
      assert:
      - skip attempt rejected ERR_TAP_SEQUENCE_VIOLATION (409)
      - 'ordered advance succeeds: tap_stage == PRESEPARATION_COUNSELING_DONE'
