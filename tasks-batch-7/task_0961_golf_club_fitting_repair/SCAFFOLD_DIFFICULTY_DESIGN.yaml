# §1.8 Scaffold Difficulty Design — Test Targeting Index
# 9 rules x >=2 instances (combinatorial_formula carries 3, one per mode) = 19 instances.
scaffold_difficulty_design:

  # ---------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: build_price_provisional_msrp_vs_final_unitcost
        grounds:
          - calculations.build_provisional_quote
          - calculations.build_final_price
          - state_machines.ClubBuildSpec.DRAFT_to_QUOTED
          - state_machines.ClubBuildSpec.QUOTED_to_ORDERED
          - entities.ClubBuildSpec.fields.provisional_quote_cents
          - entities.ClubBuildSpec.fields.final_price_cents
        distinguishing_aspect: |
          Entity domain ClubBuildSpec: the provisional variant prices components at
          msrp_cents with no rebate (89500), while the final variant prices the SAME
          spec at unit_cost_cents and subtracts the fitting-fee rebate (60300);
          identical spec inputs, two valid algorithms, different totals.
        test_recipe:
          setup:
            - "Customer C (0 completed builds), specialist FS, bay B AVAILABLE"
            - "A COMPLETED fitting session for C on bay B with specialist FS"
            - "ComponentItems: HEAD unit 40000 msrp 55000 stock 5; SHAFT unit 12000 msrp 18000 stock 5; GRIP unit 800 msrp 1500 stock 20"
            - "ClubBuildSpec in DRAFT (version 1) with labor_cents 15000"
          setup_api_calls:
            - call: "POST /golf-shop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: ShopAdmin
            - call: "POST /golf-shop/customers"
              payload: { full_name: "Ann Arbor", email: "ann@example.com" }
              as: ShopAdmin
              captures: { c_id: $.data.id }
            - call: "POST /golf-shop/staff"
              payload: { full_name: "Fred Fitter", staff_role: "FITTING_SPECIALIST" }
              as: ShopAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /golf-shop/launch-monitor-bays"
              payload: { bay_name: "Bay 1", cleanup_buffer_minutes: 15 }
              as: ShopAdmin
              captures: { bay_id: $.data.id }
            - call: "POST /golf-shop/fitting-sessions"
              payload: { customer_id: "${c_id}", bay_id: "${bay_id}", specialist_id: "${fs_id}", starts_at: "2026-05-10T10:00:00Z", ends_at: "2026-05-10T11:00:00Z" }
              as: FittingSpecialist
              as_user_id: "${fs_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /golf-shop/fitting-sessions/${sess_id}/check-in"
              as: FittingSpecialist
              as_user_id: "${fs_id}"
            - call: "POST /golf-shop/fitting-sessions/${sess_id}/complete"
              as: FittingSpecialist
              as_user_id: "${fs_id}"
            - call: "POST /golf-shop/component-items"
              payload: { sku: "HD-1", component_type: "HEAD", unit_cost_cents: 40000, msrp_cents: 55000, initial_stock: 5 }
              as: ShopAdmin
              captures: { head_id: $.data.id }
            - call: "POST /golf-shop/component-items"
              payload: { sku: "SH-1", component_type: "SHAFT", unit_cost_cents: 12000, msrp_cents: 18000, initial_stock: 5 }
              as: ShopAdmin
              captures: { shaft_id: $.data.id }
            - call: "POST /golf-shop/component-items"
              payload: { sku: "GR-1", component_type: "GRIP", unit_cost_cents: 800, msrp_cents: 1500, initial_stock: 20 }
              as: ShopAdmin
              captures: { grip_id: $.data.id }
            - call: "POST /golf-shop/build-specs"
              payload: { customer_id: "${c_id}", fitting_session_id: "${sess_id}", head_item_id: "${head_id}", shaft_item_id: "${shaft_id}", grip_item_id: "${grip_id}", length_inches: 45.5, loft_deg: 10.5, lie_deg: 58, labor_cents: 15000 }
              as: FittingSpecialist
              as_user_id: "${fs_id}"
              captures: { spec_id: $.data.id, spec_v: $.data.version }
            - call: "POST /golf-shop/build-specs/${spec_id}/quote"
              payload: { expected_build_spec_version: "${spec_v}" }
              as: FittingSpecialist
              as_user_id: "${fs_id}"
          trigger:
            - call: "POST /golf-shop/build-specs/${spec_id}/approve"
              payload: { payment_method: "EXTERNAL" }
              as: Customer
              as_user_id: "${c_id}"
          assert:
            - "ClubBuildSpec.${spec_id}.provisional_quote_cents == 89500 (74500 msrp sum + 15000 labor, no tier, no rebate)"
            - "ClubBuildSpec.${spec_id}.final_price_cents == 60300 (52800 unit-cost sum + 15000 labor - 7500 fitting rebate)"
            - "ClubBuildSpec.${spec_id}.provisional_quote_cents != ClubBuildSpec.${spec_id}.final_price_cents"
            - "ClubBuildSpec.${spec_id}.status == IN_BUILD (order fully allocated at approve, auto-advanced ORDERED -> IN_BUILD)"

      - name: tradein_offer_grade_matrix_vs_market_comp
        grounds:
          - calculations.tradein_offer_value
          - state_machines.TradeInAppraisal.SUBMITTED_to_OFFERED
          - state_machines.TradeInAppraisal.OFFERED_to_OFFERED
          - entities.TradeInAppraisal.fields.offered_value_cents
        distinguishing_aspect: |
          Entity domain TradeInAppraisal (distinct from ClubBuildSpec pricing):
          the SAME two clubs are valued 20699 under GRADE_MATRIX (book x grade
          multiplier) and 23200 under MARKET_COMP (staff comparables x 0.8);
          two valid algorithms over one entity domain different from instance
          build_price_provisional_msrp_vs_final_unitcost.
        test_recipe:
          setup:
            - "Customer C; specialist FS; appraisal in SUBMITTED (version 1) with clubs [{DRIVER, A}, {WEDGE, C}]"
          setup_api_calls:
            - call: "POST /golf-shop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: ShopAdmin
            - call: "POST /golf-shop/customers"
              payload: { full_name: "Bob Bay", email: "bob@example.com" }
              as: ShopAdmin
              captures: { c_id: $.data.id }
            - call: "POST /golf-shop/staff"
              payload: { full_name: "Fred Fitter", staff_role: "FITTING_SPECIALIST" }
              as: ShopAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /golf-shop/trade-in-appraisals"
              payload: { customer_id: "${c_id}", clubs: [ { club_type: "DRIVER", condition_grade: "A" }, { club_type: "WEDGE", condition_grade: "C" } ] }
              as: Customer
              as_user_id: "${c_id}"
              captures: { appr_id: $.data.id, appr_v: $.data.version }
          trigger:
            - call: "POST /golf-shop/trade-in-appraisals/${appr_id}/offers"
              payload: { basis: "GRADE_MATRIX", expected_appraisal_version: "${appr_v}" }
              as: FittingSpecialist
              as_user_id: "${fs_id}"
              captures: { offer1_value: $.data.offered_value_cents, appr_v2: $.data.version }
            - call: "POST /golf-shop/trade-in-appraisals/${appr_id}/offers"
              payload: { basis: "MARKET_COMP", market_comps_cents: [25000, 4000], expected_appraisal_version: "${appr_v2}" }
              as: FittingSpecialist
              as_user_id: "${fs_id}"
          assert:
            - "first offer TradeInAppraisal.${appr_id}.offered_value_cents == 20699 (round(29999*0.60)=17999 + round(8999*0.30)=2700)"
            - "second offer TradeInAppraisal.${appr_id}.offered_value_cents == 23200 (round(25000*0.8)=20000 + round(4000*0.8)=3200)"
            - "TradeInAppraisal.${appr_id}.status == OFFERED after both offers (second offer superseded the first)"
            - "TradeInAppraisal.${appr_id}.offer_basis == MARKET_COMP after the second offer"

  # ---------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: tradein_per_line_rounding_pinned
        grounds:
          - calculations.tradein_offer_value
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins round-per-line-then-sum;
          with clubs [{DRIVER,B},{WEDGE,D}] per-line rounding yields 14850
          (13500 + 1350) while the forbidden sum-then-round order yields 14849
          (14849.40) — the orders differ by a cent.
        test_recipe:
          setup:
            - "Customer C; specialist FS; appraisal SUBMITTED (version 1) with clubs [{DRIVER, B}, {WEDGE, D}]"
          setup_api_calls:
            - call: "POST /golf-shop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: ShopAdmin
            - call: "POST /golf-shop/customers"
              payload: { full_name: "Cora Creek", email: "cora@example.com" }
              as: ShopAdmin
              captures: { c_id: $.data.id }
            - call: "POST /golf-shop/staff"
              payload: { full_name: "Fred Fitter", staff_role: "FITTING_SPECIALIST" }
              as: ShopAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /golf-shop/trade-in-appraisals"
              payload: { customer_id: "${c_id}", clubs: [ { club_type: "DRIVER", condition_grade: "B" }, { club_type: "WEDGE", condition_grade: "D" } ] }
              as: Customer
              as_user_id: "${c_id}"
              captures: { appr_id: $.data.id, appr_v: $.data.version }
          trigger:
            - call: "POST /golf-shop/trade-in-appraisals/${appr_id}/offers"
              payload: { basis: "GRADE_MATRIX", expected_appraisal_version: "${appr_v}" }
              as: FittingSpecialist
              as_user_id: "${fs_id}"
          assert:
            - "TradeInAppraisal.${appr_id}.offered_value_cents == 14850 (round(29999*0.45)=13500 + round(8999*0.15)=1350)"
            - "14850 != 14849 (the sum-then-round result round(14849.40) must NOT be produced)"

      - name: repair_quote_rush_minfee_vs_rate_branch
        grounds:
          - calculations.repair_quote
          - entities.RepairTicket.fields.quoted_total_cents
          - entities.RepairTicket.fields.deposit_cents
        distinguishing_aspect: |
          Mode (a) non-linear >=3-input formula: rush_fee = max(RUSH_MIN_FEE,
          round(base*0.35)) selects the min-fee branch for REGRIP (fee 1500,
          total 3300) and the rate branch for RESHAFT (fee 2275, total 8775);
          inputs service_type x rush x base interact through a nested max and a
          conditional on the rush flag.
        test_recipe:
          setup:
            - "Customer C; technician T; SHAFT ComponentItem in stock for the reshaft ticket"
          setup_api_calls:
            - call: "POST /golf-shop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: ShopAdmin
            - call: "POST /golf-shop/customers"
              payload: { full_name: "Dan Dunes", email: "dan@example.com" }
              as: ShopAdmin
              captures: { c_id: $.data.id }
            - call: "POST /golf-shop/staff"
              payload: { full_name: "Tina Tech", staff_role: "REPAIR_TECHNICIAN" }
              as: ShopAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /golf-shop/component-items"
              payload: { sku: "SH-9", component_type: "SHAFT", unit_cost_cents: 9000, msrp_cents: 12000, initial_stock: 3 }
              as: ShopAdmin
              captures: { shaft_id: $.data.id }
          trigger:
            - call: "POST /golf-shop/repair-tickets"
              payload: { customer_id: "${c_id}", club_description: "7-iron", service_type: "REGRIP", rush: true }
              as: Customer
              as_user_id: "${c_id}"
              captures: { t1_id: $.data.id }
            - call: "POST /golf-shop/repair-tickets"
              payload: { customer_id: "${c_id}", club_description: "driver", service_type: "RESHAFT", rush: true, shaft_item_id: "${shaft_id}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { t2_id: $.data.id }
          assert:
            - "RepairTicket.${t1_id}.quoted_total_cents == 3300 (1800 + max(1500, 630))"
            - "RepairTicket.${t1_id}.promised_at == created_at + 24h"
            - "RepairTicket.${t2_id}.quoted_total_cents == 8775 (6500 + max(1500, 2275))"
            - "RepairTicket.${t2_id}.deposit_cents == 4388 (round_half_up(8775*0.5)) and balance payment would be 4387"
            - "both tickets born with work_status == QUOTED and payment_status == UNPAID"

      - name: build_final_price_rebate_tier_evaluation_order
        grounds:
          - calculations.build_final_price
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: the fitting-fee rebate (7500)
          could shrink the base below the 200000 tier threshold, but the
          scaffold pins tier selection on the PRE-rebate component_cost_sum
          (202000 -> 5% discount, then rebate) yielding 199400; applying the
          rebate before tier selection would yield 209500.
        test_recipe:
          setup:
            - "Customer C (0 completed builds); specialist FS; COMPLETED session"
            - "ComponentItems: HEAD unit 160000 msrp 180000 stock 2; SHAFT unit 41000 msrp 46000 stock 2; GRIP unit 1000 msrp 1500 stock 5"
            - "Spec in DRAFT (version 1), labor_cents 15000"
          setup_api_calls:
            - call: "POST /golf-shop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: ShopAdmin
            - call: "POST /golf-shop/customers"
              payload: { full_name: "Eli Elm", email: "eli@example.com" }
              as: ShopAdmin
              captures: { c_id: $.data.id }
            - call: "POST /golf-shop/staff"
              payload: { full_name: "Fred Fitter", staff_role: "FITTING_SPECIALIST" }
              as: ShopAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /golf-shop/launch-monitor-bays"
              payload: { bay_name: "Bay 1" }
              as: ShopAdmin
              captures: { bay_id: $.data.id }
            - call: "POST /golf-shop/fitting-sessions"
              payload: { customer_id: "${c_id}", bay_id: "${bay_id}", specialist_id: "${fs_id}", starts_at: "2026-05-10T10:00:00Z", ends_at: "2026-05-10T11:00:00Z" }
              as: FittingSpecialist
              as_user_id: "${fs_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /golf-shop/fitting-sessions/${sess_id}/check-in"
              as: FittingSpecialist
              as_user_id: "${fs_id}"
            - call: "POST /golf-shop/fitting-sessions/${sess_id}/complete"
              as: FittingSpecialist
              as_user_id: "${fs_id}"
            - call: "POST /golf-shop/component-items"
              payload: { sku: "HD-2", component_type: "HEAD", unit_cost_cents: 160000, msrp_cents: 180000, initial_stock: 2 }
              as: ShopAdmin
              captures: { head_id: $.data.id }
            - call: "POST /golf-shop/component-items"
              payload: { sku: "SH-2", component_type: "SHAFT", unit_cost_cents: 41000, msrp_cents: 46000, initial_stock: 2 }
              as: ShopAdmin
              captures: { shaft_id: $.data.id }
            - call: "POST /golf-shop/component-items"
              payload: { sku: "GR-2", component_type: "GRIP", unit_cost_cents: 1000, msrp_cents: 1500, initial_stock: 5 }
              as: ShopAdmin
              captures: { grip_id: $.data.id }
            - call: "POST /golf-shop/build-specs"
              payload: { customer_id: "${c_id}", fitting_session_id: "${sess_id}", head_item_id: "${head_id}", shaft_item_id: "${shaft_id}", grip_item_id: "${grip_id}", length_inches: 45.5, loft_deg: 10.5, lie_deg: 58, labor_cents: 15000 }
              as: FittingSpecialist
              as_user_id: "${fs_id}"
              captures: { spec_id: $.data.id, spec_v: $.data.version }
            - call: "POST /golf-shop/build-specs/${spec_id}/quote"
              payload: { expected_build_spec_version: "${spec_v}" }
              as: FittingSpecialist
              as_user_id: "${fs_id}"
          trigger:
            - call: "POST /golf-shop/build-specs/${spec_id}/approve"
              payload: { payment_method: "EXTERNAL" }
              as: Customer
              as_user_id: "${c_id}"
          assert:
            - "ClubBuildSpec.${spec_id}.final_price_cents == 199400 (202000 - round(202000*0.05)=10100 + 15000 - 7500)"
            - "199400 != 209500 (the wrong rebate-before-tier result)"
            - "ClubBuildSpec.${spec_id}.status == IN_BUILD"

  # ---------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: repair_ticket_qc_rework_cycle
        grounds:
          - state_machines.RepairTicket.IN_PROGRESS_to_IN_PROGRESS
          - state_machines.RepairTicket.IN_PROGRESS_to_READY
          - entities.RepairTicket.fields.rework_count
        distinguishing_aspect: |
          Entity RepairTicket: cyclic self-loop IN_PROGRESS -> IN_PROGRESS on
          failed QC (rework_count increments per loop) before a later pass moves
          to READY — a cycle, not a linear pipeline.
        test_recipe:
          setup:
            - "REGRIP standard ticket (quoted 1800, deposit 900) APPROVED with deposit paid, currently IN_PROGRESS"
          setup_api_calls:
            - call: "POST /golf-shop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: ShopAdmin
            - call: "POST /golf-shop/customers"
              payload: { full_name: "Fay Fern", email: "fay@example.com" }
              as: ShopAdmin
              captures: { c_id: $.data.id }
            - call: "POST /golf-shop/staff"
              payload: { full_name: "Tina Tech", staff_role: "REPAIR_TECHNICIAN" }
              as: ShopAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /golf-shop/repair-tickets"
              payload: { customer_id: "${c_id}", club_description: "wedge", service_type: "REGRIP", rush: false }
              as: Customer
              as_user_id: "${c_id}"
              captures: { t_id: $.data.id }
            - call: "POST /golf-shop/repair-tickets/${t_id}/approve"
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /golf-shop/repair-tickets/${t_id}/payments"
              payload: { kind: "DEPOSIT", method: "EXTERNAL" }
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /golf-shop/repair-tickets/${t_id}/start-work"
              as: RepairTechnician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /golf-shop/repair-tickets/${t_id}/submit-qc"
              payload: { passed: false }
              as: RepairTechnician
              as_user_id: "${tech_id}"
            - call: "POST /golf-shop/repair-tickets/${t_id}/submit-qc"
              payload: { passed: false }
              as: RepairTechnician
              as_user_id: "${tech_id}"
            - call: "POST /golf-shop/repair-tickets/${t_id}/submit-qc"
              payload: { passed: true }
              as: RepairTechnician
              as_user_id: "${tech_id}"
          assert:
            - "after first failed QC: work_status == IN_PROGRESS and rework_count == 1"
            - "after second failed QC: work_status == IN_PROGRESS and rework_count == 2"
            - "after passing QC: work_status == READY and rework_count == 2 (counter never resets)"

      - name: appraisal_decline_reoffer_cycle
        grounds:
          - state_machines.TradeInAppraisal.DECLINED_to_OFFERED
          - state_machines.TradeInAppraisal.OFFERED_to_DECLINED
          - concurrency_rules[appraisal-offer-supersede-stale]
        distinguishing_aspect: |
          Entity TradeInAppraisal (different entity than RepairTicket): the
          negotiation cycle OFFERED -> DECLINED -> OFFERED is legal and each
          re-offer supersedes under OCC — a customer-driven revision loop.
        test_recipe:
          setup:
            - "Appraisal SUBMITTED (version 1) for clubs [{PUTTER, B}]"
          setup_api_calls:
            - call: "POST /golf-shop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: ShopAdmin
            - call: "POST /golf-shop/customers"
              payload: { full_name: "Gus Glen", email: "gus@example.com" }
              as: ShopAdmin
              captures: { c_id: $.data.id }
            - call: "POST /golf-shop/staff"
              payload: { full_name: "Fred Fitter", staff_role: "FITTING_SPECIALIST" }
              as: ShopAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /golf-shop/trade-in-appraisals"
              payload: { customer_id: "${c_id}", clubs: [ { club_type: "PUTTER", condition_grade: "B" } ] }
              as: Customer
              as_user_id: "${c_id}"
              captures: { appr_id: $.data.id, appr_v: $.data.version }
            - call: "POST /golf-shop/trade-in-appraisals/${appr_id}/offers"
              payload: { basis: "GRADE_MATRIX", expected_appraisal_version: "${appr_v}" }
              as: FittingSpecialist
              as_user_id: "${fs_id}"
              captures: { appr_v2: $.data.version }
            - call: "POST /golf-shop/trade-in-appraisals/${appr_id}/decline"
              as: Customer
              as_user_id: "${c_id}"
              captures: { appr_v3: $.data.version }
          trigger:
            - call: "POST /golf-shop/trade-in-appraisals/${appr_id}/offers"
              payload: { basis: "MARKET_COMP", market_comps_cents: [12000], expected_appraisal_version: "${appr_v3}" }
              as: FittingSpecialist
              as_user_id: "${fs_id}"
          assert:
            - "TradeInAppraisal.${appr_id}.status == OFFERED after the re-offer (cycle DECLINED -> OFFERED succeeded)"
            - "TradeInAppraisal.${appr_id}.offered_value_cents == 9600 (round(12000*0.8))"
            - "TradeInAppraisal.${appr_id}.version == ${appr_v3} + 1"

  # ---------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: stock_receipt_cascades_order_to_spec
        grounds:
          - calculations.allocation_sweep
          - state_machines.ComponentOrder.BACKORDERED_to_ALLOCATED
          - state_machines.ClubBuildSpec.ORDERED_to_IN_BUILD
        distinguishing_aspect: |
          Depth-3 chain triggered by POST /component-items/{id}/receive:
          receipt mutates ComponentItem.stock_on_hand (link 1), that mutation
          runs the allocation sweep which flips the BACKORDERED ComponentOrder
          to ALLOCATED (link 2), and that flip auto-advances the parent
          ClubBuildSpec ORDERED -> IN_BUILD (link 3).
        test_recipe:
          setup:
            - "Spec approved (EXTERNAL) with all three component items at initial_stock 0; its ComponentOrder is BACKORDERED with all allocated_qty == 0; spec stuck in ORDERED"
          setup_api_calls:
            - call: "POST /golf-shop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: ShopAdmin
            - call: "POST /golf-shop/customers"
              payload: { full_name: "Hal Heath", email: "hal@example.com" }
              as: ShopAdmin
              captures: { c_id: $.data.id }
            - call: "POST /golf-shop/staff"
              payload: { full_name: "Fred Fitter", staff_role: "FITTING_SPECIALIST" }
              as: ShopAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /golf-shop/launch-monitor-bays"
              payload: { bay_name: "Bay 1" }
              as: ShopAdmin
              captures: { bay_id: $.data.id }
            - call: "POST /golf-shop/fitting-sessions"
              payload: { customer_id: "${c_id}", bay_id: "${bay_id}", specialist_id: "${fs_id}", starts_at: "2026-05-10T10:00:00Z", ends_at: "2026-05-10T11:00:00Z" }
              as: FittingSpecialist
              as_user_id: "${fs_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /golf-shop/fitting-sessions/${sess_id}/check-in"
              as: FittingSpecialist
              as_user_id: "${fs_id}"
            - call: "POST /golf-shop/fitting-sessions/${sess_id}/complete"
              as: FittingSpecialist
              as_user_id: "${fs_id}"
