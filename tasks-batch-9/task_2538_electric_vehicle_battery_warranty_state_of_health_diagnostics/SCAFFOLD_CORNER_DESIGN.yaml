        distinguishing_aspect: |
          One create fires three side effects that must all be observable: every earlier assessment
          on the vehicle flips superseded to true, the Vehicle's version increments by exactly one
          (so the stale expected_vehicle_version of the first call can never be reused), and a claim
          filed against the superseded assessment is refused with ERR_ASSESSMENT_SUPERSEDED.
