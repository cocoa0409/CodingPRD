  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_precondition_beats_fiscal_overpayment
        grounds:
          - validations[priority=6]
          - validations[priority=17]
        distinguishing_aspect: "Pair state-vs-business_fiscal: a PAYMENT on a DISMISSED complaint violates both the state gate (not DECIDED) and the fiscal bound (999999 > outstanding 0); the state error ERR_COMPLAINT_NOT_DECIDED (priority 6) wins over ERR_PAYMENT_EXCEEDS_OUTSTANDING (priority 17)."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Carrier OKTX exists. Complaint filed with challenged 17999 / alleged cost 10000 (ratio 1.7999) then determined market-dominance ABSENT -> DISMISSED; award fields all 0."
          setup_api_calls:
            - call: "POST /stb/carriers"
              payload: { carrier_code: "OKTX", legal_name: "Oklahoma & Texas Railway", carrier_class: "I", base_route_miles: 1000 }
              as: PlatformAdmin
              captures: { c_oktx: $.data.id }
            - call: "POST /stb/rate-complaints"
              payload: { shipper_id: "shp-ada", carrier_id: "${c_oktx}", commodity: "GRAIN", challenged_rate_cents_per_ton: 17999, alleged_variable_cost_cents_per_ton: 10000, annual_tons: 1000, relief_sought_cents: 50000000, contested_fiscal_year: 2025 }
              as: Shipper
              as_user_id: "shp-ada"
              captures: { rc1: $.data.id }
            - call: "POST /stb/rate-complaints/${rc1}/determine-market-dominance"
              payload: { product_competition_exists: false, geographic_competition_exists: false }
              as: BoardAdjudicator
          trigger:
            - call: "POST /stb/rate-complaints/${rc1}/reparation-events"
              payload: { event_type: "PAYMENT", amount_cents: 999999 }
              as: CarrierOperator
              as_user_id: "${c_oktx}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_COMPLAINT_NOT_DECIDED and http status 409 (state priority 6)"
            - "NOT ERR_PAYMENT_EXCEEDS_OUTSTANDING (fiscal priority 17), even though 999999 > award_outstanding_cents == 0"
            - "RateComplaint.${rc1}.status == DISMISSED and award_status == NONE (no side effects fired)"
      - name: referential_mismatch_beats_temporal_staleness
        grounds:
          - validations[priority=13]
          - validations[priority=14]
        distinguishing_aspect: "Pair business_referential-vs-business_temporal: the petition's evidence complaint belongs to a different carrier AND is 91 days stale; the referential error ERR_SERVICE_COMPLAINT_CARRIER_MISMATCH (priority 13) wins over ERR_SERVICE_FAILURE_WINDOW_EXPIRED (priority 14)."
        test_recipe:
          setup:
            - "Carrier CSXT and carrier BNRZ exist. At 2026-09-01T00:00:00Z service complaint SC filed against BNRZ. At 2026-12-01T00:00:00Z (91 days later) shipper files a petition against incumbent CSXT citing SC as evidence."
          setup_api_calls:
            - call: "POST /stb/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stb/carriers"
              payload: { carrier_code: "CSXT", legal_name: "Crescent South Extension Transport", carrier_class: "I", base_route_miles: 2100 }
              as: PlatformAdmin
              captures: { c_csxt: $.data.id }
            - call: "POST /stb/carriers"
              payload: { carrier_code: "BNRZ", legal_name: "Big Northern Railroad", carrier_class: "I", base_route_miles: 800 }
              as: PlatformAdmin
              captures: { c_bnrz: $.data.id }
            - call: "POST /stb/service-complaints"
              payload: { shipper_id: "shp-gal", carrier_id: "${c_bnrz}", issue_type: "DELAY", territory_code: "LAKES" }
              as: Shipper
              as_user_id: "shp-gal"
              captures: { sc1: $.data.id }
            - call: "POST /stb/_clock/set_current_utc"
              payload: { current_utc: "2026-12-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stb/reciprocal-switching-petitions"
              payload: { shipper_id: "shp-gal", incumbent_carrier_id: "${c_csxt}", interchange_code: "IX-KC", facility_distance_miles: 12, evidence_service_complaint_id: "${sc1}", service_start_date: "2027-01-01", service_end_date: "2027-03-01" }
              as: Shipper
              as_user_id: "shp-gal"
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /stb/reciprocal-switching-petitions/${p1}/decide"
              payload: { outcome: "GRANTED" }
              as: BoardAdjudicator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_SERVICE_COMPLAINT_CARRIER_MISMATCH and http status 422 (referential priority 13)"
            - "NOT ERR_SERVICE_FAILURE_WINDOW_EXPIRED (temporal priority 14), even though 91 > 84 days"
            - "ReciprocalSwitchingPetition.${p1}.status == FILED (unchanged)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: rvc_threshold_exactly_18000_dominates
        grounds:
          - calculations.alleged_rvc_ratio
          - state_machines.RateComplaint.FILED_to_EVIDENTIARY_PHASE
        distinguishing_aspect: "Boundary on the ratio metric at the determine-market-dominance endpoint: alleged ratio exactly 1.8000 (challenged 18000 / cost 10000) satisfies >= and proceeds to EVIDENTIARY_PHASE; 1.7999 (challenged 17999) is dismissed — one cent of rate flips jurisdiction."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Carrier OKTX exists. Two complaints: RC1 challenged 18000 / cost 10000; RC2 challenged 17999 / cost 10000. Both FILED."
          setup_api_calls:
            - call: "POST /stb/carriers"
              payload: { carrier_code: "OKTX", legal_name: "Oklahoma & Texas Railway", carrier_class: "I", base_route_miles: 1000 }
              as: PlatformAdmin
              captures: { c_oktx: $.data.id }
            - call: "POST /stb/rate-complaints"
              payload: { shipper_id: "shp-ada", carrier_id: "${c_oktx}", commodity: "GRAIN", challenged_rate_cents_per_ton: 18000, alleged_variable_cost_cents_per_ton: 10000, annual_tons: 500, relief_sought_cents: 50000000, contested_fiscal_year: 2025 }
              as: Shipper
              as_user_id: "shp-ada"
              captures: { rc1: $.data.id }
            - call: "POST /stb/rate-complaints"
              payload: { shipper_id: "shp-ada", carrier_id: "${c_oktx}", commodity: "CORN", challenged_rate_cents_per_ton: 17999, alleged_variable_cost_cents_per_ton: 10000, annual_tons: 500, relief_sought_cents: 50000000, contested_fiscal_year: 2025 }
              as: Shipper
              as_user_id: "shp-ada"
              captures: { rc2: $.data.id }
          trigger:
            - call: "POST /stb/rate-complaints/${rc1}/determine-market-dominance"
              payload: { product_competition_exists: false, geographic_competition_exists: false }
              as: BoardAdjudicator
            - call: "POST /stb/rate-complaints/${rc2}/determine-market-dominance"
              payload: { product_competition_exists: false, geographic_competition_exists: false }
              as: BoardAdjudicator
          assert:
            - "RateComplaint.${rc1}.alleged_rvc_ratio == 1.8000 and status == EVIDENTIARY_PHASE and market_dominance == PRESENT"
            - "RateComplaint.${rc2}.alleged_rvc_ratio == 1.7999 and status == DISMISSED and market_dominance == ABSENT"
      - name: relief_cap_boundary_selects_track
        grounds:
          - entities.RateComplaint.fields.track
          - calculations.prescribed_rate_and_relief
        distinguishing_aspect: "Boundary on the money metric at complaint creation: relief_sought_cents 100000000 -> THREE_BENCHMARK but 100000001 -> SIMPLIFIED_SAC; 400000000 -> SIMPLIFIED_SAC but 400000001 -> FULL_SAC — exact cap values land on the lower track (<=)."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Carrier OKTX exists."
          setup_api_calls:
            - call: "POST /stb/carriers"
