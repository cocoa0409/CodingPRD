            - { call: "POST /farm/labor-shifts", payload: { shift_date: "2026-08-05", role_type: "PACK_CREW", start_at: "2026-08-05T07:00:00Z", end_at: "2026-08-05T15:00:00Z", headcount_required: 1, planned_hourly_rate_cents: 2200 }, as: LaborPlanner, captures: { sh3: "$.data.id" } }
            - { call: "POST /farm/labor-shifts", payload: { shift_date: "2026-08-06", role_type: "PACK_CREW", start_at: "2026-08-06T07:00:00Z", end_at: "2026-08-06T15:00:00Z", headcount_required: 1, planned_hourly_rate_cents: 2200 }, as: LaborPlanner, captures: { sh4: "$.data.id" } }
            - { call: "POST /farm/labor-shifts", payload: { shift_date: "2026-08-07", role_type: "PACK_CREW", start_at: "2026-08-07T07:00:00Z", end_at: "2026-08-07T15:00:00Z", headcount_required: 1, planned_hourly_rate_cents: 2200 }, as: LaborPlanner, captures: { sh5: "$.data.id" } }
            - { call: "POST /farm/labor-shifts", payload: { shift_date: "2026-08-08", role_type: "PACK_CREW", start_at: "2026-08-08T07:00:00Z", end_at: "2026-08-08T15:00:00Z", headcount_required: 1, planned_hourly_rate_cents: 2200 }, as: LaborPlanner, captures: { sh6: "$.data.id" } }
            - { call: "POST /farm/labor-shifts", payload: { shift_date: "2026-08-09", role_type: "PACK_CREW", start_at: "2026-08-09T07:00:00Z", end_at: "2026-08-09T09:00:00Z", headcount_required: 1, planned_hourly_rate_cents: 2200 }, as: LaborPlanner, captures: { sh7: "$.data.id" } }
            - { call: "POST /farm/labor-shifts/${sh1}/publish", as: LaborPlanner, captures: { v1: "$.data.version" } }
            - { call: "POST /farm/labor-shifts/${sh2}/publish", as: LaborPlanner, captures: { v2: "$.data.version" } }
            - { call: "POST /farm/labor-shifts/${sh3}/publish", as: LaborPlanner, captures: { v3: "$.data.version" } }
            - { call: "POST /farm/labor-shifts/${sh4}/publish", as: LaborPlanner, captures: { v4: "$.data.version" } }
            - { call: "POST /farm/labor-shifts/${sh5}/publish", as: LaborPlanner, captures: { v5: "$.data.version" } }
            - { call: "POST /farm/labor-shifts/${sh6}/publish", as: LaborPlanner, captures: { v6: "$.data.version" } }
            - { call: "POST /farm/labor-shifts/${sh7}/publish", as: LaborPlanner, captures: { v7: "$.data.version" } }
          trigger:
            - { call: "POST /farm/labor-shifts/${sh1}/assignments", payload: { worker_id: "${w1}", expected_labor_shift_version: "${v1}" }, as: LaborPlanner }
            - { call: "POST /farm/labor-shifts/${sh2}/assignments", payload: { worker_id: "${w1}", expected_labor_shift_version: "${v2}" }, as: LaborPlanner }
            - { call: "POST /farm/labor-shifts/${sh3}/assignments", payload: { worker_id: "${w1}", expected_labor_shift_version: "${v3}" }, as: LaborPlanner }
            - { call: "POST /farm/labor-shifts/${sh4}/assignments", payload: { worker_id: "${w1}", expected_labor_shift_version: "${v4}" }, as: LaborPlanner }
