      - name: booking_invalid_date_range_rejected
        claim_type: violation_to_error
        grounds: ['validations[priority=8]', errors.ERR_INVALID_DATE_RANGE]
        distinguishing_aspect: "With referential rules satisfied, a booking whose end_at equals start_at fails ERR_INVALID_DATE_RANGE — temporal validation stands on its own."
        test_recipe:
          setup:
            - "Hospital H with care space CS; family F holds a VERIFIED referral at H."
          setup_api_calls:
            - call: "POST /api/hospitals"
              payload: { name: "County Children's", city: "Springfield" }
              as: ProgramAdmin
              captures: { hosp_id: $.data.id }
