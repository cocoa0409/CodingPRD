              as: ProductEngineer
              captures: { m_id: $.data.id }
            - call: "POST /valve-mfg/valve-models/${m_id}/actions"
              payload: { action: "SUBMIT_REVIEW" }
              as: ProductEngineer
            - call: "POST /valve-mfg/valve-models/${m_id}/actions"
              payload: { action: "RELEASE" }
              as: QualityManager
            - call: "POST /valve-mfg/engineered-orders"
              payload: { order_code: "ETO-DOC", model_id: "${m_id}", ordered_qty: 1, unit_price_cents: 1000000, customer_credit_limit_cents: 5000000, datasheet_break_torque_nm: 420.0, datasheet_torque_source: "VENDOR_MEASURED" }
              as: ProductEngineer
              captures: { o_id: $.data.id }
            - call: "POST /valve-mfg/engineered-orders/${o_id}/review-actions"
              payload: { action: "SUBMIT_REVIEW" }
              as: ProductEngineer
            - call: "POST /valve-mfg/engineered-orders/${o_id}/review-actions"
              payload: { action: "APPROVE" }
              as: QualityManager
            - call: "POST /valve-mfg/engineered-orders/${o_id}/lifecycle-actions"
              payload: { action: "RELEASE_TO_PRODUCTION" }
              as: ProductEngineer
            - call: "POST /valve-mfg/engineered-orders/${o_id}/documents"
              payload: { doc_type: "MATERIAL_TEST_REPORT", doc_ref: "D-C-MTR" }
              as: QualityManager
            - call: "POST /valve-mfg/engineered-orders/${o_id}/documents"
