          - validations[priority=25]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "A client that reads ProgramSession.version, creates one enrollment (which bumps the session version) and then reuses the original value on a second create is rejected with 412 ERR_STALE_VERSION; re-reading the version makes the identical request succeed."
        test_recipe:
          setup: ["Two ACTIVE INDEPENDENT participants and one OPEN session with slot_capacity 3; the client has captured the session version before any enrollment exists."]
          setup_api_calls:
            - call: "POST /recreation/fee-scale-bands"
