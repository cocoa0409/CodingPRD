  - rule_id: transitive_cascade
    instances:
      - name: indicator_supersede_escalates_designation_and_flips_standard_to_enhanced
        grounds:
          - state_machines.ScreeningArea.UNDESIGNATED_to_OVERBURDENED
          - state_machines.PermitApplication.STANDARD_REVIEW_to_ENHANCED_REVIEW
          - calculations.ej_screen_score
          - calculations.designation
          - calculations.applicability_determination
          - calculations.required_comment_days
          - entities.BurdenIndicator.fields.superseded_indicator_id
          - concurrency_rules[indicator-create-stale-area]
        distinguishing_aspect: |
          Depth-4 chain triggered by POST /ej/burden-indicators: superseding indicator
          (link 1: prior PM25 row -> SUPERSEDED) causes the rescored area to cross 65.00
          (link 2: designation UNDESIGNATED -> OVERBURDENED at 72.68), which causes the
          STANDARD_REVIEW application to gain a DESIGNATION-triggered determination and
          move to ENHANCED_REVIEW (link 3), which causes a new PLANNED ParticipationPlan
          with required_comment_days 45 (link 4); each link is caused only by the one before it.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z."
            - "ScreeningArea AREA_D (BG-06-404, Tulare, population 2100, limited_english_pct 3.0, required_translation_languages [], baseline_load_tpy 200.00)."
