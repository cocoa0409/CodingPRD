            - "QualityMeasureResult.${qm2_id}.rate_pct == 33.3 and inclusion_status == INCLUDED and meets_benchmark == false"
            - "QualityMeasureResult.${qm3_id}.rate_pct == null and inclusion_status == EXCLUDED_ZERO_DENOMINATOR and meets_benchmark == null"
            - "UDSReport.${uds_id}.included_measure_count == 2"
            - "${uds_composite} == 55.6"
            - "${uds_composite} != 66.7  # the pooled numerator/denominator order is NOT this system's composite"
            - "UDSReport.${uds_id}.total_patient_count == 1"
            - "UDSReport.${uds_id}.patients_at_or_below_100_count == 1"
            - "UDSReport.${uds_id}.unverified_patient_count == 0"
            - "UDSReport.${uds_id}.computed_at == 2026-08-01T00:00:00Z"

      - name: wraparound_pinned_evaluation_order_with_granted_waiver_mode_c
        grounds:
          - calculations.wraparound_due_cents
          - calculations.patient_charge_cents
          - calculations.discount_tier_assignment
          - state_machines.InabilityToPayWaiver.REQUESTED_to_GRANTED
          - entities.Encounter.fields.wraparound_status
          - entities.Encounter.fields.wraparound_due_cents
          - entities.HealthCenter.fields.wraparound_receivable_cents
        distinguishing_aspect: |
          MODE (c): the dependency graph looks circular — the waiver is only legal because
          patient_charge_cents equals the nominal fee, which depends on the tier, which depends on
          fpg_percent, while wraparound_due_cents depends on the waiver outcome. The scaffold pins
          E1..E6 and forbids re-entry above E5, so granting the waiver moves wraparound_due_cents
          1500 -> 4000 while pinned_discount_tier_id and patient_charge_cents stay frozen at
          ${t3_id} / 2500 instead of being re-derived.
        test_recipe:
          setup:
            - "BOOT_FS as above"
            - "Patient 'Eli Mora' (household_size 1) is VERIFIED with declared_annual_income_cents 2430000 -> fpg_percent 150.00 -> tier PARTIAL_B (60 % discount)"
            - "A MEDICAID_MCO Encounter dated 2026-03-01 with gross_charge_cents 30000 has patient_charge_cents 2500 (S7 clamps the 12000 tier result to the nominal fee) and pps_encounter_rate_cents 18000"
            - "The claim is BILLED, then PAID with mco_paid_cents 14000, so wraparound_due_cents is 1500 and wraparound_status is CLAIMED"
            - "A REQUESTED InabilityToPayWaiver with waiver_reason NO_INCOME exists, requested by psr-2"
          setup_api_calls:
            - *s_pg25
            - *s_pg26
            - *s_hc
            - *s_site
            - *s_svc
            - *s_chair
            - *s_fs
            - *s_t1
            - *s_t2
            - *s_t3
            - *s_t4
            - *s_t5
            - *s_hcv
            - *s_adopt
            - call: "POST /patients"
              payload: { mrn: "MRN-004", full_name: "Eli Mora", household_size: 1 }
              as: PatientServicesRep
              as_user_id: "psr-2"
              captures: { p4_id: $.data.id, p4_v: $.data.version }
            - call: "POST /patients/${p4_id}/income-verifications"
              payload: { declared_annual_income_cents: 2430000, household_size: 1, documentation_type: "W2", effective_date: "2026-02-01T00:00:00Z", expected_patient_version: "${p4_v}" }
              as: PatientServicesRep
              as_user_id: "psr-2"
              captures: { iv4_id: $.data.id }
            - call: "POST /income-verifications/${iv4_id}/verify"
              payload: { decision: "VERIFY" }
              as: EligibilityVerifier
              as_user_id: "ev-1"
            - call: "POST /encounters"
              payload: { patient_id: "${p4_id}", service_site_id: "${site_id}", service_definition_id: "${svc_id}", encounter_date: "2026-03-01T00:00:00Z", payer_type: "MEDICAID_MCO", gross_charge_cents: 30000 }
              as: BillingSpecialist
              as_user_id: "bs-1"
              captures: { enc4_id: $.data.id, enc4_charge: $.data.patient_charge_cents, enc4_rate: $.data.pps_encounter_rate_cents }
            - call: "POST /encounters/${enc4_id}/bill"
              payload: { claim_reference: "CLM-4001" }
              as: BillingSpecialist
              as_user_id: "bs-1"
            - call: "POST /encounters/${enc4_id}/record-payment"
              payload: { mco_paid_cents: 14000 }
              as: BillingSpecialist
              as_user_id: "bs-1"
              captures: { enc4_wrap_before: $.data.wraparound_due_cents }
            - call: "POST /encounters/${enc4_id}/claim-wraparound"
              payload: {}
              as: BillingSpecialist
              as_user_id: "bs-1"
            - call: "POST /encounters/${enc4_id}/waivers"
              payload: { waiver_reason: "NO_INCOME" }
              as: PatientServicesRep
              as_user_id: "psr-2"
              captures: { wv4_id: $.data.id }
          trigger:
            - call: "POST /waivers/${wv4_id}/decide"
              payload: { decision: "GRANT", decision_note: "no income documented" }
              as: ComplianceOfficer
              as_user_id: "co-2"
          assert:
            - "${enc4_charge} == 2500 and ${enc4_rate} == 18000"
            - "${enc4_wrap_before} == 1500  # max(0, 18000 - 14000 - 2500)"
            - "InabilityToPayWaiver.${wv4_id}.status == GRANTED and waived_amount_cents == 2500"
            - "Encounter.${enc4_id}.waived_amount_cents == 2500"
            - "Encounter.${enc4_id}.patient_charge_cents == 2500  # E3 frozen, never re-derived"
            - "Encounter.${enc4_id}.pinned_discount_tier_id == ${t3_id}  # E2 frozen"
            - "Encounter.${enc4_id}.wraparound_due_cents == 4000  # max(0, 18000 - 14000 - 0)"
            - "Encounter.${enc4_id}.wraparound_status == REBILL_REQUIRED"
            - "Encounter.${enc4_id}.pps_claim_status == PAID"
            - "Patient.${p4_id}.patient_balance_cents == 0"
            - "HealthCenter.${hc_id}.wraparound_receivable_cents == 4000"

      - name: pps_rate_single_rounding_of_multiplier_product_mode_b
        grounds:
          - calculations.pps_encounter_rate_cents
          - entities.HealthCenter.fields.pps_base_rate_cents
          - entities.ServiceDefinition.fields.service_category
          - entities.ServiceSite.fields.site_type
          - entities.Encounter.fields.pps_encounter_rate_cents
        distinguishing_aspect: |
          MODE (b) on a different metric: the ADDITIONAL-service factor 0.85 and the INTERMITTENT-site
          factor 0.90 must multiply FIRST and the single product be rounded ONCE. With
          pps_base_rate_cents 10003 the pinned order gives 10003*0.85*0.90 = 7652.295 -> 7652, while
          rounding after each factor gives round(8502.55)=8503 -> 7652.7 -> 7653. The two orders
          differ by exactly one cent, which no amount of formula-reading can paper over.
        test_recipe:
          setup:
            - "Guidelines 2025 and 2026 are published"
            - "Grantee 'Rounding Ridge Health' has pps_base_rate_cents 10003, medicare_upper_limit_cents 15000, nominal_fee_cap_cents 2500"
            - "Its Notice-of-Award baseline lists one IN_SCOPE INTERMITTENT site and one IN_SCOPE ADDITIONAL service"
            - "One NON_PATIENT board seat is SEATED and a two-band FeeSchedule (fpg_year 2026, [2026-01-01, 2027-01-01), nominal_fee_cents 2500) is ADOPTED"
            - "Patient 'Fay Lund' (household_size 1) has no IncomeVerification"
