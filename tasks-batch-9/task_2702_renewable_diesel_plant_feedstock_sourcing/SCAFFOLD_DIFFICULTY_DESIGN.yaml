      - name: second_adjusted_verification_suspends_pathway_and_blocks_sibling_block
        grounds:
          - state_machines.CreditBlock.SUBMITTED_FOR_VERIFICATION_to_ADJUSTED
          - state_machines.PathwayRegistration.REGISTERED_to_SUSPENDED
          - state_machines.CreditBlock.DRAFT_to_BLOCKED
          - calculations.lcfs_credit_quantity
          - calculations.pathway_credits_outstanding
          - endpoints["POST /credit-blocks/{id}/verification-decisions"]
        distinguishing_aspect: |
          The cascade is triggered by arithmetic rather than by a requested state: the verifier asks only for
          VERIFY, the 19.8% divergence between verified and provisional credits derives ADJUSTED, that verdict
          increments the pathway's variance_strikes to the PATHWAY_SUSPENSION_STRIKES threshold, the pathway
          falls REGISTERED -> SUSPENDED, and a third block that was never submitted to anyone moves DRAFT ->
          BLOCKED. Four levels away from the decision, and the identical call on the first block (same verified
          CI, same tolerance) leaves the pathway REGISTERED because one strike is not two.
