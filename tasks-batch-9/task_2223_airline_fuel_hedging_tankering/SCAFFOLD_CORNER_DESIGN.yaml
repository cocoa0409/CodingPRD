            - call: "POST /fuel/hedge-programs"
              payload: { policy_id: "${policy_id}", program_code: "HP-CORNER", period_start_month: "2027-01", period_end_month: "2027-03", route_groups: ["DOMESTIC_SHORT"], target_coverage_pct: 30.00 }
              as: FuelAnalyst
              captures: { prog_id: $.data.id }
            - call: "POST /fuel/hedge-programs/${prog_id}/size"
              payload: {}
              as: FuelAnalyst
              captures: { prog_v: $.data.version }
            - call: "POST /fuel/hedge-programs/${prog_id}/instruments"
