              payload: { decision: "UPHOLD", adjudication_note: "Lease unsigned at close" }
              as: PostCloseAuditor
          assert:
            - "hop 1 - AuditFinding.${af_ca_id}.status == UPHELD and rebuttal_round == 1"
            - "hop 2 - PostCloseAudit.${aud_ca_id}.status == MATERIAL_DEFECT, defect_score == 6, grade == C_MATERIAL, open_finding_count == 0"
            - "hop 3 - LoanFile.${lf_ca_id}.status == AUDIT_DEFECT, repurchase_flag == true, pool_id == null, securitization_eligible == false"
            - "hop 4 - SecuritizationPool.${pool_ca_id}.status == REBALANCING, aggregate_scheduled_balance_cents == 0, weighted_avg_coupon_pct == 0.0000, member_loan_count == 0"
            - "pre-trigger baseline for contrast: SecuritizationPool.${pool_ca_id}.aggregate_scheduled_balance_cents == 60000000, weighted_avg_coupon_pct == 8.7500, member_loan_count == 1, and LoanFile.${lf_ca_id}.status == CLOSED with repurchase_flag == false"
            - "the loan's own compliance fields are untouched by the cascade: pitia_monthly_cents == 517500, dscr_ratio == 1.2367, ltv_pct == 75.00, points_and_fees_test_result == PASS"

      - name: second_valuation_acceptance_cascade_to_exception_void
        grounds:
          - calculations.appraisal_reconciliation
          - calculations.ltv_recompute
          - calculations.overlay_breach_evaluation
          - state_machines.ExceptionRequest.APPROVED_to_VOIDED
          - state_machines.LoanFile.UNDERWRITING_to_SUSPENDED
          - endpoints.POST_valuation_orders_id_decision
        distinguishing_aspect: |
          Cascade depth 5 from a completely different trigger (a valuation decision, not an
          audit adjudication) and through a different chain: accepting the second appraisal
          reconciles the value down, which re-bases LTV, which re-breaches an overlay whose
          approved exception was pinned to the OLD metric value, which voids that exception,
          which suspends the loan. The middle hops are arithmetic (12.24 percent variance,
          72.73 -> 81.63 LTV); only the last two are state transitions.
