            - call: "POST /ats/applications"
              payload: { candidate_id: "${cand_id}", requisition_id: "${req_id}" }
              as: Recruiter
              as_user_id: "user_x"
              captures: { app_id: $.data.id }
            - call: "POST /ats/applications/${app_id}/screen"
              payload: {}
              as: Recruiter
              as_user_id: "user_x"
            - call: "POST /ats/offers"
              payload: { application_id: "${app_id}", base_salary_cents: 12000000, signing_bonus_cents: 0 }
              as: Recruiter
              as_user_id: "user_x"
              captures: { offer_id: $.data.id, offer_v1: $.data.version }
            - call: "POST /ats/offers/${offer_id}/approve"
              payload: { expected_offer_version: "${offer_v1}" }
              as: CompApprover
              as_user_id: "comp_carol"
              captures: { offer_v2: $.data.version }
            - call: "POST /ats/offers/${offer_id}/approve"
              payload: { expected_offer_version: "${offer_v2}" }
              as: VP
              as_user_id: "vp_dave"
            - call: "POST /ats/offers/${offer_id}/extend"
              payload: {}
              as: Recruiter
              as_user_id: "user_x"
            - call: "POST /ats/offers/${offer_id}/accept"
              payload: {}
              as: Candidate
              as_user_id: "${cand_id}"
            - call: "GET /ats/background-checks"
              payload: { offer_id: "${offer_id}" }
              as: ComplianceOfficer
              as_user_id: "co_other"
              captures: { bgc_id: "$.data[0].id" }
            - call: "POST /ats/background-checks/${bgc_id}/start"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_other"
          trigger:
            - call: "POST /ats/background-checks/${bgc_id}/resolve"
              payload: { outcome: "PASSED" }
              as: ComplianceOfficer
