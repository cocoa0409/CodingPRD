scenario: |
  1234. Homeowners Association Architectural Review (HOA architectural review committee): application submittal with drawings & material samples, guideline interpretation & committee review timeline, approval with conditions vs denial & appeal to board, statutory response deadline & deemed approval risk, construction window & contractor rules enforcement, inspection at completion & non-compliance remediation, variance precedent tracking, fine/lien escalation for unapproved work

domain_name: hoa-architectural-review
api_prefix: /arc

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: hierarchical
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Association
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Association legal name" }
      - { name: statutory_response_days, type: integer, source: input, description: "Statutory committee response deadline in countable days", constraints: ">= 1" }
      - { name: counting_mode, type: enum, source: input, description: "CALENDAR | BUSINESS — how statutory days are counted" }
      - { name: fine_mode, type: enum, source: input, description: "SIMPLE_DAILY | TIERED_ESCALATION — fine accrual variant selector" }
      - { name: base_fine_cents, type: integer, source: input, description: "Fine amount assessed at violation creation", constraints: ">= 0" }
      - { name: daily_fine_cents, type: integer, source: input, description: "Per-day accrual rate before escalation", constraints: ">= 0" }
      - { name: grace_days, type: integer, source: input, default: 0, description: "Days at base daily rate before tier escalation (day_index > grace_days escalates)", constraints: ">= 0" }
      - { name: escalation_multiplier_bp, type: integer, source: input, default: 10000, description: "Escalated-tier multiplier in basis points (20000 = 2.0x)", constraints: ">= 10000" }
      - { name: lien_threshold_cents, type: integer, source: input, description: "Property outstanding balance at-or-above which a lien auto-files", constraints: ">= 1" }
      - { name: lien_min_age_days, type: integer, source: input, default: 0, description: "Minimum age of oldest unpaid fine before lien may file", constraints: ">= 0" }
      - { name: committee_size, type: integer, source: input, description: "Total committee seats", constraints: ">= 1" }
      - { name: quorum_min, type: integer, source: input, description: "Minimum ballots cast for a valid decision", constraints: ">= 1 and <= committee_size" }
      - { name: supermajority_required, type: boolean, source: input, default: true, description: "true: approval needs approve/(approve+deny) >= 2/3; false: approval needs approve_count > deny_count" }
      - { name: max_window_days, type: integer, source: input, description: "Maximum construction window length in days", constraints: ">= 1" }
      - { name: default_window_days, type: integer, source: input, default: 90, description: "Reserved default window length (informational)" }
      - { name: remediation_days, type: integer, source: input, default: 7, description: "Days from violation creation to remediation deadline", constraints: ">= 0" }
      - { name: appeal_window_days, type: integer, source: input, default: 30, description: "Days after denial during which an appeal may be filed", constraints: ">= 1" }

  - name: Owner
    parent: Association
    common_fields: true
    fields:
      - { name: association_id, type: string, source: system, description: "FK -> Association.id; owning association" }
      - { name: full_name, type: string, source: input, description: "Owner full legal name" }
      - { name: email, type: string, source: input, description: "Contact email" }

  - name: Property
    parent: Association
    common_fields: true
    fields:
      - { name: association_id, type: string, source: system, description: "FK -> Association.id; owning association" }
      - { name: primary_owner_id, type: string, source: input, description: "FK -> Owner.id; owner responsible for the lot" }
      - { name: lot_number, type: string, source: input, description: "Lot identifier" }
      - { name: address, type: string, source: input, description: "Street address" }
      - { name: outstanding_fine_balance_cents, type: integer, source: computed, default: 0, description: "Sum of Fine.outstanding_cents over all fines of violations of this property (per property_outstanding_balance)" }
      - { name: open_permit_count, type: integer, source: computed, default: 0, description: "Count of ConstructionPermit rows in ACTIVE status linked via applications of this property" }
      - { name: compliance_posture, type: enum, source: computed, default: "CLEAR", description: "CLEAR | FINES_OUTSTANDING | LIENED — derived: LIENED if any Lien FILED; else FINES_OUTSTANDING if outstanding_fine_balance_cents > 0; else CLEAR" }

  - name: Application
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: system, description: "FK -> Property.id; subject property" }
      - { name: owner_id, type: string, source: input, description: "FK -> Owner.id; applicant (must equal X-User-ID for Homeowner role)" }
      - { name: project_type, type: enum, source: input, description: "ADDITION | FENCE | PAINT | ROOF | SOLAR | OTHER" }
      - { name: guideline_section, type: string, source: input, description: "Design guideline section the project falls under (e.g. SEC-4.2)" }
      - { name: description, type: string, source: input, description: "Project narrative" }
      - { name: requested_window_start, type: string, source: input, description: "Requested construction window start, ISO date YYYY-MM-DD; half-open interval start" }
      - { name: requested_window_end, type: string, source: input, description: "Requested construction window end, ISO date YYYY-MM-DD; half-open interval end (exclusive)" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | SUBMITTED | UNDER_REVIEW | REVISION_REQUESTED | APPROVED_WITH_CONDITIONS | DENIED | DEEMED_APPROVED | UNDER_APPEAL | APPEAL_DENIED" }
      - { name: submitted_at, type: datetime, source: system, description: "Stamped once on first DRAFT -> SUBMITTED; never restamped on resubmit" }
      - { name: review_started_at, type: datetime, source: system, description: "Stamped on SUBMITTED -> UNDER_REVIEW" }
      - { name: applicant_hold_days, type: integer, source: system, default: 0, description: "Whole days spent in REVISION_REQUESTED; excluded from the statutory review clock" }
      - { name: decision_outcome, type: enum, source: system, default: "NONE", description: "NONE | APPROVED | DENIED" }
      - { name: decision_reason, type: string, source: system, default: "", description: "Committee rationale for denial" }
      - { name: conditions, type: array, source: system, default: [], description: "Approval conditions (list of strings); amendable via conditions endpoint" }
      - { name: decided_at, type: datetime, source: system, description: "Stamped when a decision (committee/deemed/appeal) is applied" }

  - name: Attachment
    parent: Application
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> Application.id; parent application" }
      - { name: kind, type: enum, source: input, description: "DRAWING | MATERIAL_SAMPLE" }
      - { name: label, type: string, source: input, description: "Human label (e.g. 'north elevation')" }
      - { name: uri, type: string, source: input, description: "Storage URI of the uploaded artifact" }

  - name: CommitteeVote
    parent: Application
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> Application.id; application under review" }
      - { name: voter_owner_id, type: string, source: system, description: "FK -> Owner.id; taken from X-User-ID of the acting CommitteeMember" }
      - { name: ballot, type: enum, source: input, description: "APPROVE | DENY | ABSTAIN" }
      - { name: cast_at, type: datetime, source: system, description: "First cast timestamp" }
      - { name: recast_count, type: integer, source: system, default: 0, description: "Number of times this ballot was recast while UNDER_REVIEW" }

  - name: Appeal
    parent: Application
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> Application.id; denied application being appealed" }
      - { name: grounds, type: string, source: input, description: "Appeal grounds text" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | UPHELD | OVERRULED" }
      - { name: board_note, type: string, source: system, default: "", description: "Board rationale recorded at decision" }
      - { name: decided_by_owner_id, type: string, source: system, description: "Owner id (X-User-ID) of the BoardMember who decided" }
      - { name: filed_at, type: datetime, source: system, description: "Appeal filing timestamp" }
      - { name: decided_at, type: datetime, source: system, description: "Board decision timestamp" }

  - name: ConstructionPermit
    parent: Application
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> Application.id; approved application (1:1 — at most one permit per application)" }
      - { name: window_start, type: string, source: system, description: "Half-open window start (inclusive), copied from application.requested_window_start at issuance" }
      - { name: window_end, type: string, source: system, description: "Half-open window end (exclusive), copied from application.requested_window_end at issuance; mutable via extensions" }
      - { name: contractor_name, type: string, source: system, default: "", description: "Licensed contractor name; set via contractor-change" }
      - { name: contractor_license, type: string, source: system, default: "", description: "Contractor license number; set via contractor-change" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | COMPLETED | EXPIRED" }
      - { name: completed_at, type: datetime, source: system, description: "Stamped when an inspection PASSED completes the permit" }

  - name: BlackoutPeriod
    parent: Association
    common_fields: true
    fields:
      - { name: association_id, type: string, source: system, description: "FK -> Association.id; owning association" }
      - { name: start_date, type: string, source: input, description: "Closed-interval start date (inclusive), ISO date" }
      - { name: end_date, type: string, source: input, description: "Closed-interval end date (inclusive), ISO date", constraints: ">= start_date" }
      - { name: reason, type: string, source: input, description: "Blackout reason (e.g. holiday moratorium)" }

  - name: Inspection
    parent: ConstructionPermit
    common_fields: true
    fields:
      - { name: permit_id, type: string, source: system, description: "FK -> ConstructionPermit.id; inspected permit" }
      - { name: attempt_no, type: integer, source: system, default: 1, description: "1-based inspection attempt counter for the permit" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | PASSED | FAILED_REMEDIATION" }
      - { name: result_notes, type: string, source: system, default: "", description: "Inspector notes recorded with the result" }
      - { name: scheduled_at, type: datetime, source: system, description: "When this inspection was scheduled" }
      - { name: recorded_at, type: datetime, source: system, description: "When the result was recorded" }

  - name: Violation
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: system, description: "FK -> Property.id; subject property" }
      - { name: application_id, type: string, source: system, description: "FK -> Application.id; related application, empty string when none (unapproved work)" , default: "" }
      - { name: source_inspection_id, type: string, source: system, default: "", description: "FK -> Inspection.id; failed inspection that created this violation, empty when manager-reported" }
      - { name: source_permit_id, type: string, source: system, default: "", description: "FK -> ConstructionPermit.id; permit whose failure/expiry created this violation, empty when none" }
      - { name: kind, type: enum, source: input, description: "UNAPPROVED_WORK | CONDITION_BREACH | INCOMPLETE_CONSTRUCTION" }
      - { name: description, type: string, source: input, description: "Violation narrative" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | ESCALATED | REMEDIATED" }
      - { name: remediation_deadline, type: string, source: system, description: "ISO date = creation date + association.remediation_days; sweep escalates unresolved violations after this date" }
      - { name: escalated_at, type: datetime, source: system, description: "Stamped on OPEN -> ESCALATED" }
      - { name: remediated_at, type: datetime, source: system, description: "Stamped on transition to REMEDIATED" }

  - name: Fine
    parent: Violation
    common_fields: true
    fields:
      - { name: violation_id, type: string, source: system, description: "FK -> Violation.id; parent violation (1:1 — exactly one fine per violation)" }
      - { name: mode_snapshot, type: enum, source: system, description: "SIMPLE_DAILY | TIERED_ESCALATION — copied from association.fine_mode at creation" }
      - { name: base_cents, type: integer, source: system, description: "Snapshot of association.base_fine_cents at creation; accrued_cents starts at this value" }
      - { name: daily_rate_cents, type: integer, source: system, description: "Snapshot of association.daily_fine_cents at creation" }
      - { name: grace_days_snapshot, type: integer, source: system, description: "Snapshot of association.grace_days at creation" }
      - { name: escalation_multiplier_bp_snapshot, type: integer, source: system, description: "Snapshot of association.escalation_multiplier_bp at creation" }
      - { name: accrued_cents, type: integer, source: computed, description: "base_cents plus sum of per-day rounded increments through accrued_through_date (see fine_accrual)" }
      - { name: accrued_through_date, type: string, source: system, description: "ISO date through which accrual has been applied (inclusive); equal to creation date at creation" }
      - { name: settled_cents, type: integer, source: system, default: 0, description: "Total settled via settle (all-or-nothing full payment)" }
      - { name: waived_cents, type: integer, source: system, default: 0, description: "Total waived via waive (partial allowed)" }
      - { name: outstanding_cents, type: integer, source: computed, default: 0, description: "= accrued_cents - settled_cents - waived_cents; invariant accrued == settled + waived + outstanding" }
      - { name: status, type: enum, source: system, default: "ACCRUING", description: "ACCRUING | STOPPED | SETTLED" }
      - { name: started_at, type: datetime, source: system, description: "Creation timestamp (accrual day 0)" }
      - { name: stopped_at, type: datetime, source: system, description: "Stamped when accrual halts on remediation" }
      - { name: settled_at, type: datetime, source: system, description: "Stamped on full settlement" }

  - name: Lien
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: system, description: "FK -> Property.id; encumbered property" }
      - { name: amount_at_filing_cents, type: integer, source: system, description: "Property outstanding balance captured at filing" }
      - { name: filed_at, type: datetime, source: system, description: "Filing timestamp (set by sweep)" }
      - { name: status, type: enum, source: system, default: "FILED", description: "FILED | SATISFIED" }
      - { name: satisfied_at, type: datetime, source: system, description: "Stamped on satisfy" }

  - name: Variance
    parent: Association
    common_fields: true
    fields:
      - { name: association_id, type: string, source: system, description: "FK -> Association.id; owning association" }
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; approved application that establishes the precedent" }
      - { name: guideline_section, type: string, source: input, description: "Guideline section the variance deviates from" }
      - { name: deviation_description, type: string, source: input, description: "Description of the granted deviation" }
      - { name: recorded_at, type: datetime, source: system, description: "Recording timestamp" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Application
    initial_state: DRAFT
    terminal_states: [APPROVED_WITH_CONDITIONS, DEEMED_APPROVED, APPEAL_DENIED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /arc/applications/{id}/submit"
        actor: Homeowner
        preconditions:
          - "Property.compliance_posture != LIENED (posture gate)"
          - "Application has >= 1 Attachment with kind DRAWING and >= 1 with kind MATERIAL_SAMPLE"
        side_effects:
          - "stamps submitted_at (first submit only)"
          - "increments Application.version by 1"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /arc/applications/{id}/start-review"
        actor: Manager
        preconditions: []
        side_effects:
          - "stamps review_started_at"
          - "increments Application.version by 1"
      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /arc/applications/{id}/request-revision"
        actor: CommitteeMember
        preconditions: []
        side_effects:
          - "records revision request timestamp (hold window opens)"
          - "increments Application.version by 1"
      - from: REVISION_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /arc/applications/{id}/resubmit"
        actor: Homeowner
        preconditions:
          - "Application.owner_id == X-User-ID"
        side_effects:
          - "applicant_hold_days += whole days in (revision_requested_at, now]"
          - "increments Application.version by 1"
        note: "cyclic revision loop; may repeat without bound while statutory clock allows"
      - from: UNDER_REVIEW
        to: APPROVED_WITH_CONDITIONS
        trigger: "POST /arc/applications/{id}/decide (tally approves)"
        actor: Manager
        preconditions:
          - "ballots cast >= association.quorum_min"
          - "tally approves per quorum_decision_tally"
          - "requested window passes window_conflict_detection (no ERR_WINDOW_OVERLAP, no ERR_BLACKOUT_CONFLICT)"
        side_effects:
          - "sets decision_outcome=APPROVED, conditions from payload, stamps decided_at"
          - "creates ConstructionPermit ACTIVE with window = requested window (cascade link 1)"
          - "permit creation recomputes Property.open_permit_count (cascade link 2)"
          - "increments Application.version by 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /arc/applications/{id}/decide (tally denies)"
        actor: Manager
        preconditions:
          - "ballots cast >= association.quorum_min"
          - "tally denies per quorum_decision_tally"
        side_effects:
          - "sets decision_outcome=DENIED, decision_reason from payload, stamps decided_at"
          - "increments Application.version by 1"
      - from: SUBMITTED
        to: DEEMED_APPROVED
        trigger: "system (POST /arc/_sweeps/daily when statutory_deadline_check fires)"
        actor: system
        preconditions:
          - "review-clock elapsed days >= association.statutory_response_days"
        side_effects:
          - "sets decision_outcome=APPROVED, stamps decided_at"
          - "creates ConstructionPermit ACTIVE with window = requested window (cascade link 1, no window validation — statutory)"
          - "permit creation recomputes Property.open_permit_count (cascade link 2)"
          - "increments Application.version by 1"
      - from: UNDER_REVIEW
        to: DEEMED_APPROVED
        trigger: "system (POST /arc/_sweeps/daily when statutory_deadline_check fires)"
        actor: system
        preconditions:
          - "review-clock elapsed days >= association.statutory_response_days"
        side_effects:
          - "sets decision_outcome=APPROVED, stamps decided_at"
          - "creates ConstructionPermit ACTIVE with window = requested window (cascade link 1, no window validation — statutory)"
          - "permit creation recomputes Property.open_permit_count (cascade link 2)"
          - "increments Application.version by 1"
      - from: DENIED
        to: UNDER_APPEAL
        trigger: "POST /arc/applications/{id}/appeals"
        actor: Homeowner
        preconditions:
          - "Application.owner_id == X-User-ID"
          - "whole days in (decided_at, now] <= association.appeal_window_days"
        side_effects:
          - "creates Appeal PENDING with grounds"
          - "increments Application.version by 1"
      - from: UNDER_APPEAL
        to: APPROVED_WITH_CONDITIONS
        trigger: "POST /arc/appeals/{id}/decide with outcome UPHELD"
        actor: BoardMember
        preconditions:
          - "Appeal.status == PENDING"
          - "requested window passes window_conflict_detection"
        side_effects:
          - "Appeal -> UPHELD; Application decision_outcome=APPROVED, stamps decided_at"
          - "creates ConstructionPermit ACTIVE with requested window (cascade link 1)"
          - "permit creation recomputes Property.open_permit_count (cascade link 2)"
          - "increments Application.version by 1"
      - from: UNDER_APPEAL
        to: APPEAL_DENIED
        trigger: "POST /arc/appeals/{id}/decide with outcome OVERRULED"
        actor: BoardMember
        preconditions:
          - "Appeal.status == PENDING"
        side_effects:
          - "Appeal -> OVERRULED"
          - "increments Application.version by 1"

  - entity: Appeal
    initial_state: PENDING
    terminal_states: [UPHELD, OVERRULED]
    transitions:
      - from: PENDING
        to: UPHELD
        trigger: "POST /arc/appeals/{id}/decide outcome=UPHELD"
        actor: BoardMember
        preconditions:
          - "X-User-ID != Application.owner_id (segregation of duties)"
          - "X-User-ID has no CommitteeVote on this application (segregation of duties)"
        side_effects:
          - "stamps decided_at, decided_by_owner_id, board_note"
          - "drives Application UNDER_APPEAL -> APPROVED_WITH_CONDITIONS (see Application machine)"
      - from: PENDING
        to: OVERRULED
        trigger: "POST /arc/appeals/{id}/decide outcome=OVERRULED"
        actor: BoardMember
        preconditions:
          - "X-User-ID != Application.owner_id (segregation of duties)"
          - "X-User-ID has no CommitteeVote on this application (segregation of duties)"
        side_effects:
          - "stamps decided_at, decided_by_owner_id, board_note"
          - "drives Application UNDER_APPEAL -> APPEAL_DENIED"

  - entity: ConstructionPermit
    initial_state: ACTIVE
    terminal_states: [COMPLETED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /arc/permits/{id}/extensions"
        actor: Manager
        preconditions:
          - "new_window_end > current window_end"
          - "whole days in [window_start, new_window_end) <= association.max_window_days"
          - "extended window passes window_conflict_detection vs other ACTIVE permits and blackouts"
        side_effects:
          - "window_end := new_window_end"
          - "increments ConstructionPermit.version by 1"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /arc/inspections/{id}/record with result PASS on a SCHEDULED inspection of this permit"
        actor: Inspector
        preconditions: []
        side_effects:
          - "stamps completed_at"
          - "Property.open_permit_count recomputed (bubble-up)"
      - from: EXPIRED
        to: COMPLETED
        trigger: "POST /arc/inspections/{id}/record with result PASS on a SCHEDULED inspection of this permit (late completion)"
        actor: Inspector
        preconditions: []
        side_effects:
          - "stamps completed_at"
          - "violations with source_permit_id == this permit and status IN {OPEN, ESCALATED} -> REMEDIATED; their fines ACCRUING -> STOPPED"
          - "Property.outstanding_fine_balance_cents and compliance_posture recomputed"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (POST /arc/_sweeps/daily when current date > window_end and no PASSED inspection exists)"
        actor: system
        preconditions: []
        side_effects:
          - "creates Violation OPEN kind=INCOMPLETE_CONSTRUCTION with source_permit_id (cascade link 1)"
          - "violation creation creates Fine ACCRUING (cascade link 2)"
          - "fine creation recomputes Property balance and posture (cascade link 3)"

  - entity: Inspection
    initial_state: SCHEDULED
    terminal_states: [PASSED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /arc/inspections/{id}/record result=PASS"
        actor: Inspector
        preconditions: []
        side_effects:
          - "stamps recorded_at, stores result_notes"
          - "permit -> COMPLETED (see ConstructionPermit machine)"
      - from: SCHEDULED
        to: FAILED_REMEDIATION
        trigger: "POST /arc/inspections/{id}/record result=FAIL"
        actor: Inspector
        preconditions: []
        side_effects:
          - "stamps recorded_at, stores result_notes"
          - "creates Violation OPEN kind=CONDITION_BREACH with source_inspection_id and source_permit_id (cascade link 1)"
          - "violation creation creates Fine ACCRUING (cascade link 2)"
          - "fine creation recomputes Property balance and posture (cascade link 3)"
      - from: FAILED_REMEDIATION
        to: SCHEDULED
        trigger: "POST /arc/inspections/{id}/reschedule"
        actor: Manager
        preconditions:
          - "the Violation with source_inspection_id == this inspection has status REMEDIATED (cross-entity gate)"
        side_effects:
          - "attempt_no += 1"
          - "stamps scheduled_at; clears recorded_at"
          - "increments Inspection.version by 1"
        note: "cyclic re-inspection loop"

  - entity: Violation
    initial_state: OPEN
    terminal_states: [REMEDIATED]
    transitions:
      - from: OPEN
        to: ESCALATED
        trigger: "system (POST /arc/_sweeps/daily when current date > remediation_deadline)"
        actor: system
        preconditions: []
        side_effects:
          - "stamps escalated_at"
      - from: OPEN
        to: REMEDIATED
        trigger: "POST /arc/violations/{id}/remediate"
        actor: Homeowner
        preconditions:
          - "Property.primary_owner_id == X-User-ID"
        side_effects:
          - "stamps remediated_at"
          - "Fine of this violation: ACCRUING -> STOPPED (accrual halts at remediation date)"
          - "Property.outstanding_fine_balance_cents and compliance_posture recomputed"
      - from: ESCALATED
        to: REMEDIATED
        trigger: "POST /arc/violations/{id}/remediate"
        actor: Homeowner
        preconditions:
          - "Property.primary_owner_id == X-User-ID"
        side_effects:
          - "stamps remediated_at"
          - "Fine of this violation: ACCRUING -> STOPPED"
          - "Property.outstanding_fine_balance_cents and compliance_posture recomputed"

  - entity: Fine
    initial_state: ACCRUING
    terminal_states: [SETTLED]
    transitions:
      - from: ACCRUING
        to: ACCRUING
        trigger: "system (POST /arc/_sweeps/daily accrual step) or POST /arc/fines/{id}/waive"
        actor: system
        preconditions: []
        side_effects:
          - "sweep: accrued_cents += per-day rounded increments for each day in (accrued_through_date, current date]; accrued_through_date := current date; if property balance crosses lien_threshold_cents, lien auto-file cascade fires (see sweep)"
          - "waive: waived_cents += amount_cents (compensating action); outstanding_cents recomputed; Property balance/posture recomputed"
          - "increments Fine.version by 1"
      - from: ACCRUING
        to: STOPPED
        trigger: "system (violation remediated) — see Violation machine"
        actor: system
        preconditions: []
        side_effects:
          - "stamps stopped_at; accrual halts"
      - from: ACCRUING
        to: SETTLED
        trigger: "POST /arc/fines/{id}/settle with amount_cents == outstanding_cents"
        actor: Homeowner
        preconditions:
          - "amount_cents == outstanding_cents exactly"
        side_effects:
          - "settled_cents := amount_cents; outstanding_cents := 0; stamps settled_at"
          - "Property.outstanding_fine_balance_cents and compliance_posture recomputed"
      - from: STOPPED
        to: SETTLED
        trigger: "POST /arc/fines/{id}/settle with amount_cents == outstanding_cents"
        actor: Homeowner
        preconditions:
          - "amount_cents == outstanding_cents exactly"
        side_effects:
          - "settled_cents := amount_cents; outstanding_cents := 0; stamps settled_at"
          - "Property.outstanding_fine_balance_cents and compliance_posture recomputed"
      - from: STOPPED
        to: STOPPED
        trigger: "POST /arc/fines/{id}/waive"
        actor: Manager
        preconditions:
          - "amount_cents <= outstanding_cents"
        side_effects:
          - "waived_cents += amount_cents; outstanding_cents recomputed; Property balance/posture recomputed"

  - entity: Lien
    initial_state: FILED
    terminal_states: [SATISFIED]
    transitions:
      - from: FILED
        to: SATISFIED
        trigger: "POST /arc/liens/{id}/satisfy"
        actor: Manager
        preconditions:
          - "Property.outstanding_fine_balance_cents == 0"
        side_effects:
          - "stamps satisfied_at"
          - "Property.compliance_posture recomputed (LIENED -> CLEAR when balance is 0)"

  - entity: Property
    initial_state: CLEAR
    terminal_states: []
    transitions:
      - from: CLEAR
        to: FINES_OUTSTANDING
        trigger: "system (posture recompute: outstanding_fine_balance_cents becomes > 0 with no FILED lien)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FINES_OUTSTANDING
        to: LIENED
        trigger: "system (posture recompute: a Lien in FILED status exists)"
        actor: system
        preconditions: []
        side_effects:
          - "new Application submissions on this property are rejected with ERR_PROPERTY_LIENED (posture gate)"
      - from: FINES_OUTSTANDING
        to: CLEAR
        trigger: "system (posture recompute: balance returns to 0 and no FILED lien)"
        actor: system
        preconditions: []
        side_effects: []
      - from: LIENED
        to: CLEAR
        trigger: "system (posture recompute after lien SATISFIED with balance 0)"
        actor: system
        preconditions: []
        side_effects: []
    note: "compound/posture-driven machine: posture = f(liens, fines); gates Application submission"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: amend-conditions-stale-application
    parent_entity: Application
    write_endpoint: "POST /arc/applications/{id}/conditions"
    occ_field: "expected_application_version"
    description: |
      Amending the conditions of an Application whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just amended conditions (or another mutation
      has legitimately advanced the application) and the current writer's
      view of the application is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: contractor-change-stale-permit
    parent_entity: ConstructionPermit
    write_endpoint: "POST /arc/permits/{id}/contractor-change"
    occ_field: "expected_permit_version"
    description: |
      Changing the contractor on a ConstructionPermit whose version has
      advanced since the client last observed it is rejected. This captures
      the case where another writer has just changed the contractor (or
      extended the window) and the current writer's view of the permit is
      therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: statutory_deadline_check
    trigger: "POST /arc/_sweeps/daily (for every Application in SUBMITTED or UNDER_REVIEW)"
    algorithm: threshold
    formula: |
      elapsed = countable_days(submitted_at.date, current_date, association.counting_mode)
                - application.applicant_hold_days
      where countable_days(a, b, CALENDAR) = number of days d with a < d <= b
            countable_days(a, b, BUSINESS) = number of days d with a < d <= b and d is Mon-Fri
      deemed_approval_fires IFF elapsed >= association.statutory_response_days
    input_set: "Applications with status IN {SUBMITTED, UNDER_REVIEW}; REVISION_REQUESTED applications hold (their clock is frozen by applicant_hold_days accumulation on resubmit)"
    constants:
      BOUNDARY: "elapsed >= statutory_response_days (fires AT exactly statutory_response_days)"
    precision: "whole days; applicant_hold_days computed as whole days in (revision_requested_at.date, resubmit date]"
    variants:
      - name: calendar_counting
        when: "association.counting_mode == CALENDAR"
        difference: "every day counts; deadline lands earlier"
      - name: business_counting
        when: "association.counting_mode == BUSINESS"
        difference: "Sat/Sun skipped; for an identical submitted_at the deemed-approval date lands strictly later whenever a weekend intervenes"

  - name: quorum_decision_tally
    trigger: "POST /arc/applications/{id}/decide"
    algorithm: weighted_scoring
    formula: |
      let A = count of CommitteeVote rows with ballot=APPROVE
      let D = count with ballot=DENY
      let X = count with ballot=ABSTAIN
      quorum_ok = (A + D + X) >= association.quorum_min
      if not quorum_ok: reject ERR_QUORUM_NOT_MET
      if association.supermajority_required:
          approved = (A + D > 0) and (A / (A + D) >= 2/3)     # ABSTAIN excluded from ratio
      else:
          approved = (A > D)                                  # strict plurality; tie denies
      # exact-ratio boundary: A/(A+D) >= 2/3 approves at exactly 2/3 (e.g. A=2,D=1)
    input_set: "CommitteeVote rows of the application (one per distinct voter; recasts replace, never add)"
    constants:
      SUPERMAJORITY_RATIO: "2/3"
    precision: "rational comparison; compare 3*A >= 2*(A+D) to avoid float error"
    variants:
      - name: supermajority_on
        when: "association.supermajority_required == true"
        difference: "approval requires 3*A >= 2*(A+D)"
      - name: supermajority_off
        when: "association.supermajority_required == false"
        difference: "approval requires A > D; identical ballots (e.g. A=3,D=2) flip the outcome vs the supermajority variant (3/5 < 2/3 denies)"

  - name: fine_accrual
    trigger: "POST /arc/_sweeps/daily for each Fine in ACCRUING; also evaluated at stop/settle time"
    algorithm: chronological
    formula: |
      day_index k counts whole days after started_at.date: day k = started_at.date + k (1-based)
      for each Fine with mode_snapshot == SIMPLE_DAILY:
          increment(k) = daily_rate_cents
      for mode_snapshot == TIERED_ESCALATION:
          increment(k) = daily_rate_cents                                        if k <= grace_days_snapshot
          increment(k) = round_half_up(daily_rate_cents * escalation_multiplier_bp_snapshot / 10000)   if k > grace_days_snapshot
      on sweep at current_date:
          for k in (accrued_through_date - started_at.date) + 1 .. (current_date - started_at.date):
              accrued_cents += increment(k)          # per-day rounding THEN accumulate (pinned order)
          accrued_through_date = current_date
    input_set: "Fines with status == ACCRUING only; STOPPED and SETTLED fines never accrue"
    constants:
      TIER_BOUNDARY: "day_index > grace_days escalates (day_index == grace_days still base rate)"
      ROUNDING_ORDER: "round_half_up each per-day increment, then sum (never sum raw then round)"
    precision: "integer cents; round_half_up at 0.5 cent"
    variants:
      - name: simple_daily
        when: "association.fine_mode == SIMPLE_DAILY at fine creation (mode_snapshot)"
        difference: "flat rate every day; identical duration/rate yields a strictly lower total than tiered whenever days > grace_days and multiplier > 1"
      - name: tiered_escalation
        when: "association.fine_mode == TIERED_ESCALATION at fine creation"
        difference: "rate jumps to the escalated tier after grace_days; e.g. base 10000, daily 1000, grace 3, 2.0x, 5 days -> 17000 vs 15000 simple"

  - name: property_outstanding_balance
    trigger: "on any Fine mutation (create, accrue sweep, waive, settle) and on Violation remediation"
    algorithm: aggregation
    formula: |
      property.outstanding_fine_balance_cents =
          sum over Violation v where v.property_id == property.id
          of (Fine f of v).outstanding_cents
      where outstanding_cents = accrued_cents - settled_cents - waived_cents
      # pinned rounding order: each fine's accrued_cents is already an integer of
      # per-day rounded increments (see fine_accrual); the balance sums those
      # integers directly — summing unrounded raw amounts then rounding is FORBIDDEN.
      property.compliance_posture =
          LIENED            if any Lien of property has status FILED
          FINES_OUTSTANDING else if outstanding_fine_balance_cents > 0
          CLEAR             otherwise
    input_set: "All Violations of the property in any status; their single Fine each; Lien rows of the property with status FILED"
    constants:
      INVARIANT: "for every Fine: accrued_cents == settled_cents + waived_cents + outstanding_cents"
    precision: "integer cents"
    variants: []

  - name: window_conflict_detection
    trigger: "POST /arc/applications/{id}/decide (approval branch), POST /arc/appeals/{id}/decide (UPHELD), POST /arc/permits/{id}/extensions"
    algorithm: interval_merge
    formula: |
      Permit windows are HALF-OPEN [window_start, window_end): two windows on the
      same property conflict IFF start_a < end_b AND start_b < end_a.
      Adjacency is allowed: end_a == start_b does NOT conflict.
      BlackoutPeriods are CLOSED [start_date, end_date]: a permit window [s, e)
      conflicts with blackout [bs, be] IFF s <= be AND e > bs.
      Because the blackout end is INCLUSIVE, a window with window_start == be
      conflicts (the day be is inside both); contrast with permit-permit
      adjacency where touching endpoints do not conflict.
    input_set: "Permits: other ConstructionPermit rows in ACTIVE status whose application's property_id == this property. Blackouts: all BlackoutPeriod rows of the association."
    constants:
      PERMIT_SEMANTICS: "half-open [start, end)"
      BLACKOUT_SEMANTICS: "closed [start_date, end_date]"
    precision: "whole ISO dates"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority — evaluated top to bottom;
#     the FIRST failing rule produces the response error)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Acting role is in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path template ids resolve to existing resources, validated left-to-right"
    error_id: ERR_ASSOCIATION_NOT_FOUND
    http_status: 404
    applies_to: "all (specific ids map to ERR_OWNER_NOT_FOUND, ERR_PROPERTY_NOT_FOUND, ERR_APPLICATION_NOT_FOUND, ERR_PERMIT_NOT_FOUND, ERR_INSPECTION_NOT_FOUND, ERR_VIOLATION_NOT_FOUND, ERR_FINE_NOT_FOUND, ERR_LIEN_NOT_FOUND, ERR_APPEAL_NOT_FOUND, ERR_VARIANCE_NOT_FOUND)"
  - priority: 4
    category: existence
    check: "Request body shape: required fields present; enum fields hold declared members; unknown fields rejected"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all (enum violations use ERR_INVALID_ENUM)"
  - priority: 5
    category: auth
    check: "Context authorization: Homeowner owns the acted-on resource (application.owner_id == X-User-ID, or property.primary_owner_id == X-User-ID); CommitteeMember/BoardMember is not the applicant and (for BoardMember) cast no committee vote on the application"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "ownership: ERR_UNAUTHORIZED; segregation-of-duties violations: ERR_SEGREGATION_OF_DUTIES (403)"
  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 7
    category: business_safety
    check: "Posture gate: Property.compliance_posture != LIENED for application submission"
    error_id: ERR_PROPERTY_LIENED
    http_status: 409
    applies_to: ["POST /arc/applications/{id}/submit"]
  - priority: 8
    category: business_temporal
    check: "Window conflicts, evaluated in this sub-order: (8a) ERR_WINDOW_OVERLAP vs other ACTIVE permits on the same property (half-open); (8b) ERR_BLACKOUT_CONFLICT vs association blackout calendar (closed); (8c) ERR_APPEAL_WINDOW_EXPIRED when days in (decided_at, now] > appeal_window_days"
    error_id: ERR_WINDOW_OVERLAP
    http_status: 409
    applies_to: ["POST /arc/applications/{id}/decide", "POST /arc/appeals/{id}/decide", "POST /arc/permits/{id}/extensions", "POST /arc/applications/{id}/appeals"]
  - priority: 9
    category: business_constraint
    check: "Constraint satisfaction, sub-order: (9a) ERR_INCOMPLETE_SUBMISSION (missing DRAWING or MATERIAL_SAMPLE attachment); (9b) ERR_WINDOW_TOO_LONG (requested/extended window longer than max_window_days); (9c) ERR_QUORUM_NOT_MET (ballots cast < quorum_min)"
    error_id: ERR_INCOMPLETE_SUBMISSION
    http_status: 422
    applies_to: ["POST /arc/applications/{id}/submit", "POST /arc/properties/{id}/applications", "POST /arc/permits/{id}/extensions", "POST /arc/applications/{id}/decide"]
  - priority: 10
    category: business_referential
    check: "Variance precedent must reference an application with status IN {APPROVED_WITH_CONDITIONS, DEEMED_APPROVED}"
    error_id: ERR_PRECEDENT_NOT_APPROVED
    http_status: 422
    applies_to: ["POST /arc/associations/{id}/variances"]
  - priority: 11
    category: business_fiscal
    check: "Fiscal checks, sub-order: (11a) settle amount must equal outstanding_cents exactly (ERR_SETTLEMENT_AMOUNT_MISMATCH); (11b) waive amount <= outstanding_cents (ERR_WAIVER_EXCEEDS_OUTSTANDING); (11c) lien satisfy requires property balance == 0 (ERR_LIEN_BALANCE_OUTSTANDING)"
    error_id: ERR_SETTLEMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: ["POST /arc/fines/{id}/settle", "POST /arc/fines/{id}/waive", "POST /arc/liens/{id}/satisfy"]
  - priority: 12
    category: business_constraint
    check: "OCC: expected_<parent>_version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["POST /arc/applications/{id}/conditions", "POST /arc/permits/{id}/contractor-change"]

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Association & configuration ---
  - method: POST
    path: "/arc/associations"
    description: "Create an association with its review/fine/lien configuration"
    roles: [Manager]
    code: 201
    input: [name, statutory_response_days, counting_mode, fine_mode, base_fine_cents, daily_fine_cents, 'grace_days?', 'escalation_multiplier_bp?', lien_threshold_cents, 'lien_min_age_days?', committee_size, quorum_min, 'supermajority_required?', max_window_days, 'default_window_days?', 'remediation_days?', 'appeal_window_days?']
    output: Association
    side_effects: []
  - method: GET
    path: "/arc/associations/{id}"
    description: "Read an association"
    roles: [Manager, Homeowner, CommitteeMember, BoardMember, Inspector]
    code: 200
    input: []
    output: Association
    side_effects: []
  - method: POST
    path: "/arc/associations/{id}/owners"
    description: "Register an owner/member"
    roles: [Manager]
    code: 201
    input: [full_name, email]
    output: Owner
    side_effects: []
  - method: GET
    path: "/arc/associations/{id}/owners"
    description: "List owners of an association (paginated)"
    roles: [Manager, Homeowner, CommitteeMember, BoardMember, Inspector]
    code: 200
    input: ['limit?', 'offset?']
    output: "Owner[]"
    side_effects: []
  - method: GET
    path: "/arc/owners/{id}"
    description: "Read an owner"
    roles: [Manager, Homeowner, CommitteeMember, BoardMember, Inspector]
    code: 200
    input: []
    output: Owner
    side_effects: []
  - method: POST
    path: "/arc/associations/{id}/properties"
    description: "Register a property/lot"
    roles: [Manager]
    code: 201
    input: [lot_number, address, primary_owner_id]
    output: Property
    side_effects: ["initial compliance_posture CLEAR, balances 0"]
  - method: GET
    path: "/arc/associations/{id}/properties"
    description: "List properties of an association (paginated)"
    roles: [Manager, Homeowner, CommitteeMember, BoardMember, Inspector]
    code: 200
    input: ['limit?', 'offset?']
    output: "Property[]"
    side_effects: []
  - method: GET
    path: "/arc/properties/{id}"
    description: "Read a property incl. computed balance/posture/open_permit_count"
    roles: [Manager, Homeowner, CommitteeMember, BoardMember, Inspector]
    code: 200
    input: []
    output: Property
    side_effects: []
  - method: GET
    path: "/arc/owners/{id}/properties"
    description: "List properties whose primary_owner_id == owner id"
    roles: [Manager, Homeowner, CommitteeMember, BoardMember, Inspector]
    code: 200
    input: ['limit?', 'offset?']
    output: "Property[]"
    side_effects: []
  # --- Blackout calendar ---
  - method: POST
    path: "/arc/associations/{id}/blackouts"
    description: "Declare a closed-interval construction blackout period"
    roles: [Manager]
    code: 201
    input: [start_date, end_date, 'reason?']
    output: BlackoutPeriod
    side_effects: []
  - method: GET
    path: "/arc/associations/{id}/blackouts"
    description: "List blackout periods"
    roles: [Manager, Homeowner, CommitteeMember, BoardMember, Inspector]
    code: 200
    input: ['limit?', 'offset?']
    output: "BlackoutPeriod[]"
    side_effects: []
  # --- Variance precedent registry ---
  - method: POST
    path: "/arc/associations/{id}/variances"
    description: "Record an approved variance precedent"
    roles: [Manager]
    code: 201
    input: [application_id, guideline_section, deviation_description]
    output: Variance
    side_effects: ["stamps recorded_at"]
  - method: GET
    path: "/arc/associations/{id}/variances"
    description: "Search variance precedents, optionally filtered by guideline_section"
    roles: [Manager, Homeowner, CommitteeMember, BoardMember, Inspector]
    code: 200
    input: ['limit?', 'offset?', 'guideline_section?']
    output: "Variance[]"
    side_effects: []
  # --- Applications ---
  - method: POST
    path: "/arc/properties/{id}/applications"
    description: "Create a DRAFT architectural review application"
    roles: [Homeowner]
    code: 201
    input: [owner_id, project_type, guideline_section, description, requested_window_start, requested_window_end]
    output: Application
    side_effects: ["window length validated against max_window_days (ERR_WINDOW_TOO_LONG)"]
  - method: GET
    path: "/arc/applications/{id}"
    description: "Read an application"
    roles: [Manager, Homeowner, CommitteeMember, BoardMember, Inspector]
    code: 200
    input: []
    output: Application
    side_effects: []
  - method: GET
    path: "/arc/properties/{id}/applications"
    description: "List applications of a property"
    roles: [Manager, Homeowner, CommitteeMember, BoardMember, Inspector]
    code: 200
    input: ['limit?', 'offset?', 'status?']
    output: "Application[]"
    side_effects: []
  - method: GET
    path: "/arc/owners/{id}/applications"
    description: "List applications filed by an owner"
    roles: [Manager, Homeowner, CommitteeMember, BoardMember, Inspector]
    code: 200
    input: ['limit?', 'offset?']
    output: "Application[]"
    side_effects: []
  - method: POST
    path: "/arc/applications/{id}/attachments"
    description: "Attach a drawing or material sample to a DRAFT or REVISION_REQUESTED application"
    roles: [Homeowner]
    code: 201
    input: [kind, label, uri]
    output: Attachment
    side_effects: []
  - method: GET
    path: "/arc/applications/{id}/attachments"
    description: "List attachments of an application"
    roles: [Manager, Homeowner, CommitteeMember, BoardMember, Inspector]
    code: 200
    input: ['limit?', 'offset?', 'kind?']
    output: "Attachment[]"
    side_effects: []
  - method: POST
    path: "/arc/applications/{id}/submit"
    description: "Submit a DRAFT application (posture gate + completeness)"
    roles: [Homeowner]
    code: 200
    input: []
    output: Application
    side_effects: ["Application DRAFT -> SUBMITTED; stamps submitted_at; increments Application.version by 1"]
  - method: POST
    path: "/arc/applications/{id}/start-review"
    description: "Manager opens committee review"
    roles: [Manager]
    code: 200
    input: []
    output: Application
    side_effects: ["Application SUBMITTED -> UNDER_REVIEW; stamps review_started_at; increments Application.version by 1"]
  - method: POST
    path: "/arc/applications/{id}/request-revision"
    description: "Committee requests applicant revisions (opens applicant hold)"
    roles: [CommitteeMember]
    code: 200
    input: [revision_notes]
    output: Application
    side_effects: ["Application UNDER_REVIEW -> REVISION_REQUESTED; increments Application.version by 1"]
  - method: POST
    path: "/arc/applications/{id}/resubmit"
    description: "Applicant resubmits after revisions (closes hold, cycles back to UNDER_REVIEW)"
    roles: [Homeowner]
    code: 200
    input: []
    output: Application
    side_effects: ["Application REVISION_REQUESTED -> UNDER_REVIEW; applicant_hold_days accumulated; increments Application.version by 1"]
  - method: POST
    path: "/arc/applications/{id}/votes"
    description: "Cast or recast a committee ballot (one row per voter; recast replaces ballot); requires application UNDER_REVIEW (else ERR_INVALID_STATE)"
    roles: [CommitteeMember]
    code: 201
    input: [ballot]
    output: CommitteeVote
    side_effects: ["creates CommitteeVote or updates ballot + recast_count on recast; invariant: approve+deny+abstain == distinct voter count"]
  - method: GET
    path: "/arc/applications/{id}/votes"
    description: "List ballots of an application"
    roles: [Manager, Homeowner, CommitteeMember, BoardMember, Inspector]
    code: 200
    input: ['limit?', 'offset?']
    output: "CommitteeVote[]"
    side_effects: []
  - method: GET
    path: "/arc/owners/{id}/votes"
    description: "List ballots cast by an owner"
    roles: [Manager, Homeowner, CommitteeMember, BoardMember, Inspector]
    code: 200
    input: ['limit?', 'offset?']
    output: "CommitteeVote[]"
    side_effects: []
  - method: POST
    path: "/arc/applications/{id}/decide"
    description: "Tally ballots and apply the committee decision; approval branch validates requested window then cascades permit creation"
    roles: [Manager]
    code: 200
    input: ['conditions?', 'denial_reason?']
    output: Application
    side_effects: ["quorum_decision_tally; APPROVED: -> APPROVED_WITH_CONDITIONS + creates ConstructionPermit ACTIVE + recomputes Property.open_permit_count; DENIED: -> DENIED with decision_reason; increments Application.version by 1"]
  - method: POST
    path: "/arc/applications/{id}/conditions"
    description: "Amend approval conditions (OCC-guarded); requires application status APPROVED_WITH_CONDITIONS (else ERR_INVALID_STATE)"
    roles: [CommitteeMember]
    code: 200
    input: [conditions, expected_application_version]
    output: Application
    side_effects: ["conditions := payload; increments Application.version by 1"]
  - method: POST
    path: "/arc/applications/{id}/appeals"
    description: "Appeal a DENIED application to the board"
    roles: [Homeowner]
    code: 201
    input: [grounds]
    output: Appeal
    side_effects: ["Application DENIED -> UNDER_APPEAL; creates Appeal PENDING; increments Application.version by 1"]
  - method: GET
    path: "/arc/applications/{id}/appeals"
    description: "List appeals of an application"
    roles: [Manager, Homeowner, CommitteeMember, BoardMember, Inspector]
    code: 200
    input: ['limit?', 'offset?']
    output: "Appeal[]"
    side_effects: []
  - method: POST
    path: "/arc/appeals/{id}/decide"
    description: "Board decides an appeal (segregation of duties enforced)"
    roles: [BoardMember]
    code: 200
    input: [outcome, 'board_note?']
    output: Appeal
    side_effects: ["UPHELD: Application -> APPROVED_WITH_CONDITIONS + permit cascade; OVERRULED: Application -> APPEAL_DENIED; stamps decided_at/decided_by_owner_id"]
  # --- Permits & inspections ---
  - method: GET
    path: "/arc/permits/{id}"
    description: "Read a construction permit"
    roles: [Manager, Homeowner, CommitteeMember, BoardMember, Inspector]
    code: 200
    input: []
    output: ConstructionPermit
    side_effects: []
  - method: GET
    path: "/arc/applications/{id}/permits"
    description: "List permits of an application (0 or 1 entries)"
    roles: [Manager, Homeowner, CommitteeMember, BoardMember, Inspector]
    code: 200
    input: ['limit?', 'offset?']
    output: "ConstructionPermit[]"
    side_effects: []
  - method: POST
    path: "/arc/permits/{id}/contractor-change"
    description: "Set/replace contractor details on an ACTIVE permit (OCC-guarded)"
    roles: [Manager]
    code: 200
    input: [contractor_name, contractor_license, expected_permit_version]
    output: ConstructionPermit
    side_effects: ["increments ConstructionPermit.version by 1"]
  - method: POST
    path: "/arc/permits/{id}/extensions"
    description: "Extend the construction window of an ACTIVE permit"
    roles: [Manager, Homeowner]
    code: 200
    input: [new_window_end]
    output: ConstructionPermit
    side_effects: ["window_end := new_window_end after window_conflict_detection; increments ConstructionPermit.version by 1"]
  - method: POST
    path: "/arc/permits/{id}/request-inspection"
    description: "Schedule a completion inspection; requires permit ACTIVE (else ERR_INVALID_STATE) and caller owns the parent application (application.owner_id == X-User-ID)"
    roles: [Homeowner]
    code: 201
    input: []
    output: Inspection
    side_effects: ["creates Inspection SCHEDULED with attempt_no = existing inspections of permit + 1"]
  - method: GET
    path: "/arc/permits/{id}/inspections"
    description: "List inspections of a permit"
    roles: [Manager, Homeowner, CommitteeMember, BoardMember, Inspector]
    code: 200
    input: ['limit?', 'offset?']
    output: "Inspection[]"
    side_effects: []
  - method: GET
    path: "/arc/inspections/{id}"
    description: "Read an inspection"
    roles: [Manager, Homeowner, CommitteeMember, BoardMember, Inspector]
    code: 200
    input: []
    output: Inspection
    side_effects: []
  - method: POST
    path: "/arc/inspections/{id}/record"
    description: "Inspector records PASS/FAIL on a SCHEDULED inspection; FAIL cascades violation + fine"
    roles: [Inspector]
    code: 200
    input: [result, 'result_notes?']
    output: Inspection
    side_effects: ["PASS: permit -> COMPLETED (+ late-completion remediation cascade when permit EXPIRED); FAIL: creates Violation OPEN (CONDITION_BREACH) -> creates Fine ACCRUING -> recomputes Property balance/posture"]
  - method: POST
    path: "/arc/inspections/{id}/reschedule"
    description: "Reschedule a FAILED_REMEDIATION inspection after its violation is REMEDIATED"
    roles: [Manager]
    code: 200
    input: []
    output: Inspection
    side_effects: ["Inspection FAILED_REMEDIATION -> SCHEDULED; attempt_no += 1; increments Inspection.version by 1"]
  # --- Violations, fines, liens ---
  - method: POST
    path: "/arc/properties/{id}/violations"
    description: "Manager reports a violation (e.g. unapproved work)"
    roles: [Manager]
    code: 201
    input: [kind, description, 'application_id?']
    output: Violation
    side_effects: ["creates Fine ACCRUING with config snapshots (cascade link 1); recomputes Property balance/posture (cascade link 2); sets remediation_deadline = creation date + remediation_days"]
  - method: GET
    path: "/arc/violations/{id}"
    description: "Read a violation"
    roles: [Manager, Homeowner, CommitteeMember, BoardMember, Inspector]
    code: 200
    input: []
    output: Violation
    side_effects: []
  - method: GET
    path: "/arc/properties/{id}/violations"
    description: "List violations of a property"
    roles: [Manager, Homeowner, CommitteeMember, BoardMember, Inspector]
    code: 200
    input: ['limit?', 'offset?', 'status?']
    output: "Violation[]"
    side_effects: []
  - method: GET
    path: "/arc/applications/{id}/violations"
    description: "List violations linked to an application"
    roles: [Manager, Homeowner, CommitteeMember, BoardMember, Inspector]
    code: 200
    input: ['limit?', 'offset?']
    output: "Violation[]"
    side_effects: []
  - method: GET
    path: "/arc/applications/{id}/variances"
    description: "List variance precedents that reference an application"
    roles: [Manager, Homeowner, CommitteeMember, BoardMember, Inspector]
    code: 200
    input: ['limit?', 'offset?']
    output: "Variance[]"
    side_effects: []
  - method: GET
    path: "/arc/permits/{id}/violations"
    description: "List violations linked to a permit (inspection-fail or expiry sourced)"
    roles: [Manager, Homeowner, CommitteeMember, BoardMember, Inspector]
    code: 200
    input: ['limit?', 'offset?']
    output: "Violation[]"
    side_effects: []
  - method: GET
    path: "/arc/inspections/{id}/violations"
    description: "List violations created by a failed inspection (0 or 1 entries)"
    roles: [Manager, Homeowner, CommitteeMember, BoardMember, Inspector]
    code: 200
    input: ['limit?', 'offset?']
    output: "Violation[]"
    side_effects: []
  - method: POST
    path: "/arc/violations/{id}/remediate"
    description: "Owner marks a violation remediated; stops fine accrual"
    roles: [Homeowner]
    code: 200
    input: ['remediation_note?']
    output: Violation
    side_effects: ["Violation OPEN|ESCALATED -> REMEDIATED; Fine ACCRUING -> STOPPED; recomputes Property balance/posture"]
  - method: GET
    path: "/arc/violations/{id}/fines"
    description: "List fines of a violation (exactly 1 entry)"
    roles: [Manager, Homeowner, CommitteeMember, BoardMember, Inspector]
    code: 200
    input: ['limit?', 'offset?']
    output: "Fine[]"
    side_effects: []
  - method: POST
    path: "/arc/fines/{id}/settle"
    description: "Settle a fine in full (amount must equal outstanding_cents exactly)"
    roles: [Homeowner]
    code: 200
    input: [amount_cents]
    output: Fine
    side_effects: ["Fine ACCRUING|STOPPED -> SETTLED; settled_cents := amount_cents; recomputes Property balance/posture"]
  - method: POST
    path: "/arc/fines/{id}/waive"
    description: "Manager waives part of a fine (compensating action conserving the fine identity)"
    roles: [Manager]
    code: 200
    input: [amount_cents, reason]
    output: Fine
    side_effects: ["waived_cents += amount_cents; recomputes Property balance/posture; increments Fine.version by 1"]
  - method: GET
    path: "/arc/properties/{id}/liens"
    description: "List liens of a property"
    roles: [Manager, Homeowner, CommitteeMember, BoardMember, Inspector]
    code: 200
    input: ['limit?', 'offset?']
    output: "Lien[]"
    side_effects: []
  - method: POST
    path: "/arc/liens/{id}/satisfy"
    description: "Satisfy a filed lien once the property balance is zero"
    roles: [Manager]
    code: 200
    input: []
    output: Lien
    side_effects: ["Lien FILED -> SATISFIED; recomputes Property posture"]
  # --- Test-driving system endpoints ---
  - method: POST
    path: "/arc/_clock/set_current_utc"
    description: "Set the logical clock. Startup default before any call is exactly 2026-05-01T00:00:00Z; the server never falls back to wall-clock time."
    roles: [Manager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock := to_iso8601"]
  - method: POST
    path: "/arc/_sweeps/daily"
    description: "Ops checkpoint at the current logical date, in fixed order: (1) deemed approvals for SUBMITTED/UNDER_REVIEW applications at statutory deadline; (2) fine accrual for ACCRUING fines (per-day rounded increments); (3) violation escalation past remediation_deadline; (4) lien auto-file when balance >= lien_threshold_cents and oldest unpaid fine age >= lien_min_age_days and no FILED lien exists; (5) permit expiry past window_end. Idempotent per date (accrued_through_date tracking)."
    roles: [Manager]
    code: 200
    input: []
    output: { applications_deemed_approved: integer, fines_accrued: integer, violations_escalated: integer, liens_filed: integer, permits_expired: integer }
    side_effects: ["drives Application/ConstructionPermit/Violation/Fine/Lien system transitions and Property recomputes in the declared order"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown role or user headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted on endpoint, or Homeowner acting on a resource it does not own" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Committee/Board actor is the applicant, or BoardMember cast a committee vote on the appealed application" }
  - { id: ERR_ASSOCIATION_NOT_FOUND, http: 404, condition: "Association id does not exist" }
  - { id: ERR_OWNER_NOT_FOUND, http: 404, condition: "Owner id does not exist" }
  - { id: ERR_PROPERTY_NOT_FOUND, http: 404, condition: "Property id does not exist" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "Application id does not exist" }
  - { id: ERR_PERMIT_NOT_FOUND, http: 404, condition: "ConstructionPermit id does not exist" }
  - { id: ERR_INSPECTION_NOT_FOUND, http: 404, condition: "Inspection id does not exist" }
  - { id: ERR_VIOLATION_NOT_FOUND, http: 404, condition: "Violation id does not exist" }
  - { id: ERR_FINE_NOT_FOUND, http: 404, condition: "Fine id does not exist" }
  - { id: ERR_LIEN_NOT_FOUND, http: 404, condition: "Lien id does not exist" }
  - { id: ERR_APPEAL_NOT_FOUND, http: 404, condition: "Appeal id does not exist" }
  - { id: ERR_VARIANCE_NOT_FOUND, http: 404, condition: "Variance id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field or unknown body field" }
  - { id: ERR_INVALID_ENUM, http: 400, condition: "Enum field holds an undeclared member" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not defined from the resource's current state (incl. terminal lockdown and cross-entity state gates)" }
  - { id: ERR_PROPERTY_LIENED, http: 409, condition: "Submission blocked: property posture is LIENED" }
  - { id: ERR_INCOMPLETE_SUBMISSION, http: 422, condition: "Application lacks >= 1 DRAWING and >= 1 MATERIAL_SAMPLE attachment" }
  - { id: ERR_QUORUM_NOT_MET, http: 422, condition: "Ballots cast < association.quorum_min at decide time" }
  - { id: ERR_WINDOW_OVERLAP, http: 409, condition: "Requested/extended half-open window overlaps another ACTIVE permit on the same property" }
  - { id: ERR_BLACKOUT_CONFLICT, http: 422, condition: "Requested/extended window intersects a closed-interval blackout period" }
  - { id: ERR_WINDOW_TOO_LONG, http: 422, condition: "Window length exceeds association.max_window_days" }
  - { id: ERR_APPEAL_WINDOW_EXPIRED, http: 422, condition: "Appeal filed more than appeal_window_days after denial" }
  - { id: ERR_PRECEDENT_NOT_APPROVED, http: 422, condition: "Variance references an application not in APPROVED_WITH_CONDITIONS or DEEMED_APPROVED" }
  - { id: ERR_SETTLEMENT_AMOUNT_MISMATCH, http: 422, condition: "settle amount_cents != fine.outstanding_cents" }
  - { id: ERR_WAIVER_EXCEEDS_OUTSTANDING, http: 422, condition: "waive amount_cents > fine.outstanding_cents" }
  - { id: ERR_LIEN_BALANCE_OUTSTANDING, http: 409, condition: "satisfy attempted while property outstanding balance > 0" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent entity's current version (OCC)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Manager
    description: "HOA manager / administrator operating the review pipeline, enforcement, and system checkpoints"
    identity: opaque
    exclusive_operations: [create_association, create_owner, create_property, create_blackout, create_variance, create_violation, start_review, decide_application, reschedule_inspection, waive_fine, satisfy_lien, contractor_change, set_clock, run_sweep]
    shared_operations: [extend_permit_window, read_any_resource]
  - name: Homeowner
    description: "Property owner filing applications, attaching documents, appealing, remediating, and paying fines"
    identity: entity_backed:Owner
    exclusive_operations: [create_application, add_attachment, submit_application, resubmit_application, file_appeal, remediate_violation, settle_fine, request_inspection]
    shared_operations: [extend_permit_window, read_any_resource]
  - name: CommitteeMember
    description: "Architectural review committee member voting and requesting revisions; barred from acting on own applications"
    identity: entity_backed:Owner
    exclusive_operations: [cast_vote, request_revision, amend_conditions]
    shared_operations: [read_any_resource]
  - name: BoardMember
    description: "Board member deciding appeals; barred when applicant or prior committee voter on the same application"
    identity: entity_backed:Owner
    exclusive_operations: [decide_appeal]
    shared_operations: [read_any_resource]
  - name: Inspector
    description: "Completion inspector recording pass/fail results"
    identity: opaque
    exclusive_operations: [record_inspection]
    shared_operations: [read_any_resource]
