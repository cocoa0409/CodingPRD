          setup:
            - "Clock at 2026-08-10; one course with a LOW_ELEMENT element; a PARTNER client; a DRAFT booking for 2026-09-15 whose icebreaker block runs 09:00–09:45 and whose low-element block occupies the element 09:45–10:30."
