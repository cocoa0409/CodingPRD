          trigger:
            - call: "POST /coop/usage-reports/${rpt_id}/submission"
              payload: { action: "SUBMIT" }
              as: SupplierRepresentative
              as_user_id: "${sup_a_id}"
          assert:
            - "UsageReport.${rpt_id}.status == SUBMITTED"
            - "UsageReport.${rpt_id}.swept_usage_count == 1"
            - "UsageReport.${rpt_id}.reported_chargeable_cents == 9015"
            - "UsageReport.${rpt_id}.reported_usage_cents == 9195"
            - "UsageReport.${rpt_id}.reported_fee_cents == 180"
            - "UsageReport.${rpt_id}.fee_status == NOT_DUE"
            - "UsageReport.${rpt_id}.audited_fee_cents == null"
            - "ContractUsage.${use_f1_id}.usage_report_id == ${rpt_id}"
            - "ContractUsage.${use_f2_id}.usage_report_id == null"
            - "ContractUsage.${use_f2_id}.status == RECORDED"
            - "ContractUsage.${use_f3_id}.usage_report_id == null"
            - "ContractUsage.${use_f3_id}.status == RETRACTED"
            - "MemberAgency.${mem_rv_id}.committed_spend_cents == 18390"
            - "MasterContract.${mc_id}.usage_chargeable_cents_total == 18030"
            - "MasterContract.${mc_id}.fee_assessed_cents_total == 0, because acceptance has not happened"
      - name: calculation_precision_of_the_admin_fee_variants
        claim_type: Precision
        grounds:
          - calculations.admin_fee_assessment
          - entities.UsageReport.fields.fee_true_up_cents
        excluded_because:
          difficulty_instance: dual_variant_calc / admin_fee_reported_versus_audited_rounding_only_divergence
          rationale: >-
            That SS1.8 instance isolates the rounding behaviour of the two fee variants on identical inputs (541 versus 540 with a true-up of -1), which is exactly the Precision claim for this calculation.
      - name: calculation_tiered_pricing_threshold_geometry
        claim_type: tiered_pricing
        grounds:
          - calculations.net_unit_price
          - entities.MasterContract.fields.discount_tiers
        excluded_because:
          difficulty_instance: boundary_precision_check / discount_tier_threshold_is_inclusive_at_exactly_one_cent_of_spend
          rationale: >-
            That SS1.8 instance pins the tier selection one cent below and exactly on the 5000000-cent threshold, which is the tiered_pricing algorithm claim.
      - name: calculation_waterfall_allocation_of_add_on_charges
        claim_type: waterfall_allocation
        grounds:
          - calculations.add_on_charges
          - entities.MasterContract.fields.permitted_add_ons
        excluded_because:
          difficulty_instance: combinatorial_formula / add_on_charges_per_code_caps_versus_aggregate_cap_with_pinned_order
          rationale: >-
            That SS1.8 instance walks the per-code caps and then the aggregate cap in the pinned order and asserts every intermediate figure, which is the waterfall_allocation claim.
      - name: calculation_variant_divergence_of_the_admin_fee
        claim_type: Variant Divergence
        grounds:
          - calculations.admin_fee_assessment.variants.REPORTED
          - calculations.admin_fee_assessment.variants.AUDITED
        excluded_because:
          difficulty_instance: dual_variant_calc / admin_fee_reported_versus_audited_tier_rebate_divergence
          rationale: >-
            That SS1.8 instance drives the two fee variants apart on the tier rebate rather than on rounding and asserts both results plus the resulting true-up, which is the Variant Divergence claim.
      - name: calculation_variant_selection_of_the_piggyback_doctrine
        claim_type: Variant Selection
        grounds:
          - calculations.piggyback_authority.variants.STATUTORY_STRICT
          - calculations.piggyback_authority.variants.RECIPROCITY_LIBERAL
          - entities.PiggybackAnalysis.fields.doctrine_applied
        excluded_because:
          difficulty_instance: dual_variant_calc / piggyback_authority_strict_versus_liberal_determination_band_divergence
          rationale: >-
            That SS1.8 instance selects the doctrine variant from the member state and asserts that identical member and contract facts land in different determination bands, which is the Variant Selection claim.
      - name: calculation_reconciliation_between_reported_and_audited_fees
        claim_type: Reconciliation
        grounds:
          - calculations.admin_fee_assessment
          - entities.UsageReport.fields.variance_pct
          - entities.MasterContract.fields.fee_outstanding_cents
        excluded_because:
          difficulty_instance: compensating_invariant / retraction_restores_the_ledger_exactly_without_repricing_the_frozen_usage
          rationale: >-
            That SS1.8 instance asserts the ledger identity that reconciles assessed against remitted fees after a compensating retraction, which is the Reconciliation claim for this calculation pair.
      - name: calculation_aggregation_of_the_fee_ledger_across_reports
        claim_type: aggregation
        grounds:
          - calculations.admin_fee_assessment
          - entities.MasterContract.fields.fee_assessed_cents_total
        excluded_because:
          difficulty_instance: compensating_invariant / remitting_every_delinquent_fee_restores_posture_and_points_but_not_the_suspension
          rationale: >-
            That SS1.8 instance sums assessed, remitted and outstanding fees across several accepted reports of one contract and asserts each aggregate after every remittance, which is the aggregation claim for this calculation.
      - name: calculation_weighted_scoring_of_the_composite_evaluation
        claim_type: weighted_scoring
        grounds:
          - calculations.composite_score
        excluded_because:
          difficulty_instance: combinatorial_formula / composite_score_rounds_each_weighted_component_before_summing
          rationale: >-
            That SS1.8 instance pins the rounding order of the weighted technical and price components and the ranking that follows, which is the weighted_scoring claim.
      - name: calculation_threshold_banding_of_the_piggyback_authority_score
        claim_type: threshold
        grounds:
          - calculations.piggyback_authority
        excluded_because:
          difficulty_instance: boundary_precision_check / authority_bands_are_inclusive_at_exactly_eighty_five_and_sixty
          rationale: >-
            That SS1.8 instance lands the authority score exactly on both band edges and asserts the determination on each, which is the threshold claim.
      - name: calculation_constraint_propagation_into_the_member_spend_ceiling
        claim_type: constraint_propagation
        grounds:
          - calculations.member_usage_total
          - entities.MemberAgency.fields.committed_spend_cents
        excluded_because:
          difficulty_instance: boundary_precision_check / member_ceiling_admits_the_exact_limit_and_refuses_it_by_one_cent
          rationale: >-
            That SS1.8 instance drives committed_spend_cents to the ceiling one order at a time and asserts the propagated total at the exact limit and one cent past it, which is the constraint_propagation claim.
      - name: calculation_interval_merge_of_the_renewed_contract_term
        claim_type: interval_merge
        grounds:
          - calculations.renewal_term_extension
        excluded_because:
          difficulty_instance: resource_temporal_overlap / renewal_terms_are_half_open_so_adjacency_is_legal_but_a_thirteenth_month_is_not
          rationale: >-
            That SS1.8 instance merges the renewal interval onto the current term and asserts the extension months on the adjacency boundary, which is the interval_merge claim.
      - name: calculation_chronological_window_of_the_report_period_sweep
        claim_type: chronological
        grounds:
          - calculations.report_period_sweep
        excluded_because:
          difficulty_instance: resource_temporal_overlap / report_periods_are_closed_intervals_so_a_touching_endpoint_is_an_overlap
          rationale: >-
            That SS1.8 instance pins the closed-interval geometry of the sweep window on the shared endpoint instant, which is the chronological claim for this calculation.

  # =====================================================================================
  # SECTION VALIDATIONS
  # =====================================================================================
  - section: Validations
    instances:
      - name: member_eligibility_evidence_is_checked_per_category_then_against_state_law
        claim_type: Violation -> Error
        grounds:
          - validations.priority_27
          - errors.ERR_GOVERNING_RESOLUTION_MISSING
          - errors.ERR_NONPROFIT_EVIDENCE_MISSING
          - validations.priority_28
          - errors.ERR_NONPROFIT_NOT_PERMITTED
          - state_machines.MemberAgency.registration_status.PENDING_VERIFICATION_to_ACTIVE
        distinguishing_aspect: >-
          Four verifications separate the evidence rung from the state-law rung: a government category with no governing-body resolution fails priority 27 with ERR_GOVERNING_RESOLUTION_MISSING, a nonprofit with no IRS letter fails the SAME rung with a DIFFERENT error id, a fully documented nonprofit in NV - whose StateLawRule sets allows_nonprofit_participation false - clears priority 27 and only then fails priority 28, and the identical nonprofit in TX verifies.
        test_recipe:
          setup:
            - "StateLawRule rows exist for TX (allows_nonprofit_participation true) and NV (false)."
            - "Four members are PENDING_VERIFICATION: Lakeside School District (TX, K12_DISTRICT, no resolution), Austin Community Trust (TX, NONPROFIT_501C3, no IRS letter), Silver State Community Fund (NV, NONPROFIT_501C3, IRS letter present) and Hill Country Food Bank (TX, NONPROFIT_501C3, IRS letter present)."
            - "The logical clock reads 2026-06-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CoopAdministrator
            - call: "POST /coop/state-law-rules"
              payload: { state_code: "TX", piggyback_doctrine: "STATUTORY_STRICT", min_notice_days: 14, requires_lead_agency_in_state: false, allows_nonprofit_participation: true, max_contract_term_months: 60, requires_local_solicitation_waiver: false, reciprocity_state_codes: [] }
              as: CoopAdministrator
            - call: "POST /coop/state-law-rules"
              payload: { state_code: "NV", piggyback_doctrine: "RECIPROCITY_LIBERAL", min_notice_days: 30, requires_lead_agency_in_state: false, allows_nonprofit_participation: false, max_contract_term_months: 60, requires_local_solicitation_waiver: true, reciprocity_state_codes: ["CA"] }
              as: CoopAdministrator
            - call: "POST /coop/member-agencies"
              payload: { legal_name: "Lakeside School District", state_code: "TX", member_category: "K12_DISTRICT", annual_spend_ceiling_cents: 10000000 }
              as: CoopAdministrator
              as_user_id: "adm-intake-01"
              captures: { mem_k12_id: $.data.id, mem_k12_v1: $.data.version }
            - call: "POST /coop/member-agencies"
              payload: { legal_name: "Austin Community Trust", state_code: "TX", member_category: "NONPROFIT_501C3", annual_spend_ceiling_cents: 2000000 }
              as: CoopAdministrator
              as_user_id: "adm-intake-01"
              captures: { mem_np1_id: $.data.id, mem_np1_v1: $.data.version }
            - call: "POST /coop/member-agencies"
              payload: { legal_name: "Silver State Community Fund", state_code: "NV", member_category: "NONPROFIT_501C3", annual_spend_ceiling_cents: 2000000, irs_determination_letter_number: "IRS-NV-4477" }
              as: CoopAdministrator
              as_user_id: "adm-intake-01"
              captures: { mem_np2_id: $.data.id, mem_np2_v1: $.data.version }
            - call: "POST /coop/member-agencies"
              payload: { legal_name: "Hill Country Food Bank", state_code: "TX", member_category: "NONPROFIT_501C3", annual_spend_ceiling_cents: 2000000, irs_determination_letter_number: "IRS-TX-9120" }
              as: CoopAdministrator
              as_user_id: "adm-intake-01"
              captures: { mem_np3_id: $.data.id, mem_np3_v1: $.data.version }
          trigger:
            - call: "POST /coop/member-agencies/${mem_k12_id}/registration"
              payload: { action: "VERIFY" }
              as: CoopAdministrator
              as_user_id: "adm-review-02"
              captures: { e_res: $.data.error_id }
            - call: "POST /coop/member-agencies/${mem_np1_id}/registration"
              payload: { action: "VERIFY" }
              as: CoopAdministrator
              as_user_id: "adm-review-02"
              captures: { e_irs: $.data.error_id }
