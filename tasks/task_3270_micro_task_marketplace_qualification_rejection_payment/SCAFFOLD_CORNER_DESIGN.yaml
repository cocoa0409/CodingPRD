              as: Worker
              as_user_id: "${w1}"
            - call: "POST /mkt/assignments/${a1}/reject"
              payload: { reason: "incomplete" }
              as: Requester
              as_user_id: "${rid}"
            - call: "POST /mkt/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:50:00Z" }
              as: PlatformAdmin
            - call: "POST /mkt/assignments/${a1}/dispute"
