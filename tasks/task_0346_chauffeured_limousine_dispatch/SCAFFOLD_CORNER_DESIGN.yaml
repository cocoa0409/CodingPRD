      - name: rbac_affiliatepartner_cannot_accept_others_offer_returns_403
        claim_type: peer_roles
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "AffiliatePartner whose X-User-ID is affiliate B accepting a farm-out addressed to affiliate A -> ERR_FORBIDDEN (403); entity_backed ownership enforced."
        test_recipe:
          setup: ["OFFERED farm-out to affiliate A; a second affiliate B exists."]
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { company_name: "Acme", billing_email: "ap@acme.com" }
              as: DispatchAdmin
              captures: { acct: $.data.id }
