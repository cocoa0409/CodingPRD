        excluded_because:
          difficulty_instance: compensating_invariant / wage_classification_identity_restored_on_void
          rationale: "That instance asserts the gross == taxable + non_taxable identity before a void and the return of all three YTD accumulators to zero after it."
  - section: validations
    instances:
      - name: second_component_of_the_same_type_or_sequence_is_a_duplicate
        claim_type: violation_to_error
        grounds:
          - validations[priority=35]
          - errors[ERR_DUPLICATE_COMPONENT]
          - endpoints[POST /driver-pay/pay-packages/{id}/components]
          - entities.PayComponent.fields.sequence
        distinguishing_aspect: |
          Priority 35 enforces two uniqueness facts at once: at most one component per component_type, and a
          unique sequence within the package. A second PER_MILE at sequence 3 violates the first; an ACTIVITY at
          the already-used sequence 2 violates the second. Both are 409 and neither may be stored, so
          component_count stays 2.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "package PKG_DUP holding a PER_MILE 58 component at sequence 1 and a REVENUE_PERCENT 2500 at sequence 2"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages"
              payload: { name: "Leased Duplicate Component", driver_type: "LEASED_OPERATOR", mileage_guide: "PRACTICAL", per_diem_method: "NONE", escrow_required: false }
              as: PayrollAdmin
              captures: { pkg_dup: $.data.id }
            - call: "POST /driver-pay/pay-packages/${pkg_dup}/components"
              payload: { component_type: "PER_MILE", unit: "MILE", rate_value: 58, sequence: 1 }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages/${pkg_dup}/components"
              payload: { component_type: "REVENUE_PERCENT", unit: "PERCENT_BPS", rate_value: 2500, sequence: 2 }
              as: PayrollAdmin
          trigger:
            - call: "POST /driver-pay/pay-packages/${pkg_dup}/components"
              payload: { component_type: "PER_MILE", unit: "MILE", rate_value: 71, sequence: 3 }
              as: PayrollAdmin
              captures: { err_dup_type: $.data.error_id }
            - call: "POST /driver-pay/pay-packages/${pkg_dup}/components"
              payload: { component_type: "ACTIVITY", unit: "LOAD", rate_value: 5000, sequence: 2 }
              as: PayrollAdmin
              captures: { err_dup_seq: $.data.error_id }
          assert:
            - "the duplicate component_type attempt returns HTTP 409 with error_id ERR_DUPLICATE_COMPONENT"
            - "the duplicate sequence attempt returns HTTP 409 with error_id ERR_DUPLICATE_COMPONENT"
            - "PayPackage.${pkg_dup}.component_count == 2 and the components listing still returns exactly 2 rows"
            - "the sequence 1 component still has rate_value 58 and not 71"
      - name: activation_requires_a_linehaul_component_and_passes_once_one_exists
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=37]
          - errors[ERR_PACKAGE_HAS_NO_LINEHAUL_COMPONENT]
          - state_machines.PayPackage.DRAFT_to_ACTIVE
          - endpoints[POST /driver-pay/pay-packages/{id}/activate]
        distinguishing_aspect: |
          A package holding only an ACTIVITY component cannot pay linehaul, so activation fails at priority 37
          with HTTP 422 and the package stays DRAFT with activated_at null. Adding a PER_MILE component and
          re-activating then returns 200, which shows the check is a satisfiable precondition and not a
          permanent rejection of the row.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "DRAFT package PKG_LIN holding only an ACTIVITY 5000 component at sequence 1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages"
              payload: { name: "Leased No Linehaul", driver_type: "LEASED_OPERATOR", mileage_guide: "PRACTICAL", per_diem_method: "NONE", escrow_required: false }
              as: PayrollAdmin
              captures: { pkg_lin: $.data.id }
            - call: "POST /driver-pay/pay-packages/${pkg_lin}/components"
              payload: { component_type: "ACTIVITY", unit: "LOAD", rate_value: 5000, sequence: 1 }
              as: PayrollAdmin
          trigger:
            - call: "POST /driver-pay/pay-packages/${pkg_lin}/activate"
              payload: {}
              as: PayrollAdmin
              captures: { err_lin: $.data.error_id }
            - call: "POST /driver-pay/pay-packages/${pkg_lin}/components"
              payload: { component_type: "PER_MILE", unit: "MILE", rate_value: 58, sequence: 2 }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages/${pkg_lin}/activate"
              payload: {}
              as: PayrollAdmin
          assert:
            - "the first activate returns HTTP 422 with error_id ERR_PACKAGE_HAS_NO_LINEHAUL_COMPONENT"
            - "immediately after it PayPackage.${pkg_lin}.status == DRAFT and activated_at == null"
            - "the second activate returns HTTP 200 and PayPackage.${pkg_lin}.status == ACTIVE"
            - "PayPackage.${pkg_lin}.activated_at == 2026-08-01T00:00:00.000Z and component_count == 2"
      - name: missing_required_field_outranks_invalid_field_value_in_one_body
        claim_type: priority_ordering
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_MISSING_REQUIRED_FIELD]
          - errors[ERR_INVALID_FIELD_VALUE]
        distinguishing_aspect: |
          One body violates both checks at once: driver_type is absent and mileage_guide is the undeclared value
          MOON. Priority 4 runs first, so the response must be ERR_MISSING_REQUIRED_FIELD and never
          ERR_INVALID_FIELD_VALUE. Supplying driver_type while keeping MOON then yields ERR_INVALID_FIELD_VALUE,
          which proves the second check was reachable and was merely outranked.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "no PayPackage rows exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PayrollAdmin
          trigger:
            - call: "POST /driver-pay/pay-packages"
              payload: { name: "Both Wrong", mileage_guide: "MOON", per_diem_method: "NONE", escrow_required: false }
              as: PayrollAdmin
              captures: { err_ord_a: $.data.error_id }
            - call: "POST /driver-pay/pay-packages"
              payload: { name: "One Wrong", driver_type: "LEASED_OPERATOR", mileage_guide: "MOON", per_diem_method: "NONE", escrow_required: false }
              as: PayrollAdmin
              captures: { err_ord_b: $.data.error_id }
          assert:
            - "the first attempt returns HTTP 422 with error_id ERR_MISSING_REQUIRED_FIELD"
            - "the first attempt does not return ERR_INVALID_FIELD_VALUE even though mileage_guide is MOON"
            - "the second attempt returns HTTP 422 with error_id ERR_INVALID_FIELD_VALUE"
            - "no PayPackage row exists after either attempt"
      - name: delivering_under_a_retired_package_is_blocked_until_a_live_one_is_assigned
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=52]
          - errors[ERR_DRIVER_HAS_NO_PAY_PACKAGE]
          - state_machines.PayPackage.ACTIVE_to_RETIRED
          - state_machines.Load.IN_TRANSIT_to_DELIVERED
        distinguishing_aspect: |
          Priority 52 reaches across three entities: the Load being delivered, its Driver, and the Driver
          package. Retiring PKG_RET while LOAD_RET is IN_TRANSIT leaves the driver pointing at a RETIRED package,
          so deliver fails with HTTP 409 and the load stays IN_TRANSIT with paid_miles null. Assigning the ACTIVE
          PKG_RE2 clears the block, and the delivery still pays 46080 off the PKG_RET snapshot.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "driver DRV_RET ACTIVE on PKG_RET with PER_MILE 58 and REVENUE_PERCENT 2500 bps"
            - "load LOAD_RET dispatched 2026-08-03T08:00Z, so pay_package_id_snapshot is PKG_RET"
            - "PKG_RET retired, so the driver pointer names a RETIRED package"
            - "a second ACTIVE package PKG_RE2 with the same PER_MILE 58 and REVENUE_PERCENT 2500 bps exists"
