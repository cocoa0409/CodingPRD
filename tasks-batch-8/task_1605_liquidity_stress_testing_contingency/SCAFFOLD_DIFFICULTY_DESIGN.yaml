# =============================================================================
# Section 1.8: Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x >=2 instances = 19 instances. Every setup_api_calls chain drives
# empty-DB -> precondition state using only SCAFFOLD.yaml section 1.5 endpoints.
# All formula-derived assert values were computed by hand-executing the pinned
# formulas in SCAFFOLD.yaml section 1.3.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: hqla_baseline_vs_stress_haircut_divergence
        grounds:
          - calculations.hqla_adjusted_value
          - entities.LiquidAsset.fields.encumbrance_status
        distinguishing_aspect: |
          Asset-valuation domain: identical UNENCUMBERED inventory yields two
          different totals because STRESS adds the scenario's level2_addon_bps to
          LEVEL_2 haircuts while BASELINE does not. Domain differs from the
          projection instance below (cash-flow domain).
        test_recipe:
          setup:
            - "BASELINE scenario (addon 0) and SEVERE scenario (addon 1000 bps) both ACTIVE"
            - "Inventory: two LEVEL_2B assets at market 1000002 cents each, one LEVEL_1 asset at 500000 cents, all UNENCUMBERED"
          setup_api_calls:
            - call: "POST /liquidity/stress-scenarios"
              payload: { name: "Base", tier: "BASELINE", deposit_runoff_pct: 5, wholesale_renewal_pct: 80, level2_addon_bps: 0, horizon_days: 30 }
              as: RiskOfficer
            - call: "POST /liquidity/stress-scenarios"
              payload: { name: "Severe", tier: "SEVERE", deposit_runoff_pct: 25, wholesale_renewal_pct: 0, level2_addon_bps: 1000, horizon_days: 30 }
              as: RiskOfficer
              captures: { sev_sc_id: $.data.id }
            - call: "POST /liquidity/liquid-assets"
              payload: { asset_class: "LEVEL_2B", reference: "B1", market_value_cents: 1000002 }
              as: TreasuryOps
            - call: "POST /liquidity/liquid-assets"
              payload: { asset_class: "LEVEL_2B", reference: "B2", market_value_cents: 1000002 }
              as: TreasuryOps
            - call: "POST /liquidity/liquid-assets"
              payload: { asset_class: "LEVEL_1", reference: "C1", market_value_cents: 500000 }
              as: TreasuryOps
          trigger:
            - call: "GET /liquidity/hqla-summary"
              payload: { scenario_id: "${sev_sc_id}" }
              as: RiskOfficer
              captures: { base_total: $.data.baseline_total_cents, stress_total: $.data.stress_total_cents, hqla_count: $.data.asset_count }
          assert:
            - "base_total == 2000002  (per-asset floor: floor(1000002*0.75)=750001 twice + 500000 LEVEL_1)"
            - "stress_total == 1800002  (SEVERE addon: floor(1000002*0.65)=650001 twice + 500000)"
            - "hqla_count == 3"
            - "base_total != stress_total — identical inventory, divergent variants"

      - name: projection_contractual_vs_behavioral_divergence
        grounds:
          - calculations.projection_cash_flow
          - entities.ProjectionRun.fields.model_variant
        distinguishing_aspect: |
          Cash-flow-projection domain (distinct from the HQLA asset domain):
          identical funding and asset data produce different totals because
          CONTRACTUAL charges full maturities while BEHAVIORAL applies
          wholesale renewal and linear retail runoff.
        test_recipe:
          setup:
            - "MODERATE scenario ACTIVE: deposit_runoff_pct 10, wholesale_renewal_pct 50, level2_addon_bps 500, horizon_days 10"
            - "Funding: retail 1000000000 (non-maturity); wholesale_unsecured 600000000 maturing day 5; wholesale_secured 400000000 maturing day 12 (outside horizon)"
            - "One UNENCUMBERED LEVEL_1 asset at 500000000 cents"
          setup_api_calls:
            - call: "POST /liquidity/stress-scenarios"
              payload: { name: "Mod", tier: "MODERATE", deposit_runoff_pct: 10, wholesale_renewal_pct: 50, level2_addon_bps: 500, horizon_days: 10 }
              as: RiskOfficer
              captures: { sc_id: $.data.id, sc_v: $.data.version }
            - call: "POST /liquidity/funding-sources"
              payload: { counterparty_name: "RetailPool", channel: "RETAIL_DEPOSIT", balance_cents: 1000000000 }
              as: TreasuryAnalyst
            - call: "POST /liquidity/funding-sources"
              payload: { counterparty_name: "W1", channel: "WHOLESALE_UNSECURED", balance_cents: 600000000, matures_in_days: 5 }
              as: TreasuryAnalyst
            - call: "POST /liquidity/funding-sources"
              payload: { counterparty_name: "W2", channel: "WHOLESALE_SECURED", balance_cents: 400000000, matures_in_days: 12 }
              as: TreasuryAnalyst
            - call: "POST /liquidity/liquid-assets"
              payload: { asset_class: "LEVEL_1", reference: "BUF", market_value_cents: 500000000 }
              as: TreasuryOps
          trigger:
            - call: "POST /liquidity/stress-scenarios/${sc_id}/projection-runs"
              payload: { model_variant: "CONTRACTUAL", as_of_date: "2026-08-01", expected_scenario_version: "${sc_v}" }
              as: TreasuryAnalyst
              captures: { run_c_id: $.data.id }
            - call: "POST /liquidity/projection-runs/${run_c_id}/finalize"
              as: TreasuryAnalyst
              captures: { rc_out: $.data.total_outflows_cents, rc_gap: $.data.net_cumulative_gap_cents, rc_hqla: $.data.hqla_available_cents, rc_surv: $.data.survival_days }
            - call: "GET /liquidity/stress-scenarios/${sc_id}"
              as: TreasuryAnalyst
              captures: { sc_v2: $.data.version }
            - call: "POST /liquidity/stress-scenarios/${sc_id}/projection-runs"
              payload: { model_variant: "BEHAVIORAL", as_of_date: "2026-08-01", expected_scenario_version: "${sc_v2}" }
              as: TreasuryAnalyst
              captures: { run_b_id: $.data.id }
            - call: "POST /liquidity/projection-runs/${run_b_id}/finalize"
              as: TreasuryAnalyst
              captures: { rb_out: $.data.total_outflows_cents, rb_gap: $.data.net_cumulative_gap_cents, rb_surv: $.data.survival_days }
          assert:
            - "rc_out == 600000000  (only W1 matures within horizon; full contractual amount)"
            - "rc_gap == -600000000"
            - "rc_hqla == 500000000  (LEVEL_1: no addon applies; STRESS variant under MODERATE scenario)"
            - "rc_surv == 5  (day-5 cumulative -600000000 + 500000000 < 0)"
            - "rb_out == 400000000  (W1 renewed at 50%: 300000000 at day 5; retail runoff floor(1000000000*10/100/10)=10000000/day x 10 = 100000000)"
            - "rb_gap == -400000000"
            - "rb_surv == 10  (cumulative never breaches the 500000000 buffer; horizon fallback)"
            - "rc_out != rb_out — identical inputs, divergent variants"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: hqla_per_asset_floor_then_sum_rounding_order
        grounds:
          - calculations.hqla_adjusted_value
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins floor-per-asset-then-sum;
          sum-then-floor would give 2000003 for this inventory, the pinned order
          gives 2000002 — the rounding ORDER is what is under test.
        test_recipe:
          setup:
            - "BASELINE scenario ACTIVE (addon 0)"
            - "Two LEVEL_2B assets at exactly 1000002 cents each (odd cent count chosen so per-asset floors lose 0.5 each), one LEVEL_1 at 500000"
          setup_api_calls:
            - call: "POST /liquidity/stress-scenarios"
              payload: { name: "Base", tier: "BASELINE", deposit_runoff_pct: 5, wholesale_renewal_pct: 80, level2_addon_bps: 0, horizon_days: 30 }
              as: RiskOfficer
              captures: { base_sc_id: $.data.id }
            - call: "POST /liquidity/liquid-assets"
              payload: { asset_class: "LEVEL_2B", reference: "B1", market_value_cents: 1000002 }
              as: TreasuryOps
            - call: "POST /liquidity/liquid-assets"
              payload: { asset_class: "LEVEL_2B", reference: "B2", market_value_cents: 1000002 }
              as: TreasuryOps
            - call: "POST /liquidity/liquid-assets"
              payload: { asset_class: "LEVEL_1", reference: "C1", market_value_cents: 500000 }
              as: TreasuryOps
          trigger:
            - call: "GET /liquidity/hqla-summary"
              payload: { scenario_id: "${base_sc_id}" }
              as: TreasuryAnalyst
              captures: { base_total: $.data.baseline_total_cents, stress_total: $.data.stress_total_cents }
          assert:
            - "base_total == 2000002  (750001 + 750001 + 500000; per-asset floor BEFORE sum)"
            - "base_total != 2000003  (sum-then-floor is the rejected order)"
            - "stress_total == 2000002  (BASELINE scenario addon is 0, so variants coincide here)"

      - name: posture_multi_input_branch_with_hysteresis
        grounds:
          - calculations.posture_evaluation
          - entities.PostureSnapshot.fields.level
        distinguishing_aspect: |
          Mode (a): >=3 inputs (red_count, amber_count, open_breach_count,
          current_level) with non-linear interaction — red branch dominates
          ambers, and de-escalation is capped at one ordinal step (hysteresis),
          so SEVERE with clean inputs lands on HEIGHTENED, never NORMAL.
        test_recipe:
          setup:
            - "Metrics M1/M2/M3 (ABOVE_BREACHES, amber 1000, red 5000, cadence 0)"
            - "M1 RED (6000 > 5000) -> READING_AUTO snapshot SEVERE; M2/M3 AMBER (1500)"
          setup_api_calls:
            - call: "POST /liquidity/ewi-metrics"
              payload: { code: "M1", name: "m1", unit: "PCT_BPS", direction: "ABOVE_BREACHES", amber_threshold: 1000, red_threshold: 5000, min_reading_interval_hours: 0 }
              as: RiskOfficer
              captures: { m1: $.data.id }
            - call: "POST /liquidity/ewi-metrics"
              payload: { code: "M2", name: "m2", unit: "PCT_BPS", direction: "ABOVE_BREACHES", amber_threshold: 1000, red_threshold: 5000, min_reading_interval_hours: 0 }
              as: RiskOfficer
              captures: { m2: $.data.id }
            - call: "POST /liquidity/ewi-metrics"
              payload: { code: "M3", name: "m3", unit: "PCT_BPS", direction: "ABOVE_BREACHES", amber_threshold: 1000, red_threshold: 5000, min_reading_interval_hours: 0 }
              as: RiskOfficer
              captures: { m3: $.data.id }
            - call: "POST /liquidity/ewi-metrics/${m1}/readings"
              payload: { observed_at: "2026-08-01T00:00:00Z", value: 6000 }
              as: TreasuryAnalyst
            - call: "POST /liquidity/ewi-metrics/${m2}/readings"
              payload: { observed_at: "2026-08-01T00:00:00Z", value: 1500 }
              as: TreasuryAnalyst
            - call: "POST /liquidity/ewi-metrics/${m3}/readings"
              payload: { observed_at: "2026-08-01T00:00:00Z", value: 1500 }
              as: TreasuryAnalyst
          trigger:
            - call: "POST /liquidity/posture-evaluations"
              as: RiskOfficer
              captures: { s1_level: $.data.level, s1_red: $.data.red_count, s1_amber: $.data.amber_count, s1_prior: $.data.prior_level }
            - call: "POST /liquidity/ewi-metrics/${m1}/readings"
              payload: { observed_at: "2026-08-02T00:00:00Z", value: 500 }
              as: TreasuryAnalyst
            - call: "POST /liquidity/posture-evaluations"
              as: LiquidityCommittee
              captures: { s2_level: $.data.level, s2_prior: $.data.prior_level }
          assert:
            - "s1_level == SEVERE  (red_count 1 branch dominates amber_count 2 < 3)"
            - "s1_red == 1 and s1_amber == 2"
            - "s1_prior == SEVERE  (READING_AUTO snapshot already escalated)"
            - "s2_level == HEIGHTENED and s2_prior == SEVERE  (de-escalation capped at one step despite raw NORMAL)"

      - name: borrowing_power_pinned_evaluation_order
        grounds:
          - calculations.borrowing_power
        distinguishing_aspect: |
          Mode (c) circular-looking dependency resolved by pinned evaluation
          order: pledged sum first, then collateral cap (floor), then
          min(total_capacity, cap), then subtract drawn, then floor at 0.
        test_recipe:
          setup:
            - "Line: total_capacity 80000000, advance_rate 5000 bps"
            - "LEVEL_2A asset market 100000000 pledged (pinned value floor(100000000*0.85) = 85000000)"
          setup_api_calls:
            - call: "POST /liquidity/borrowing-lines"
              payload: { provider_name: "FHLB", line_type: "FHLB", total_capacity_cents: 80000000, advance_rate_bps: 5000 }
              as: TreasuryOps
              captures: { ln: $.data.id }
            - call: "POST /liquidity/liquid-assets"
              payload: { asset_class: "LEVEL_2A", reference: "A1", market_value_cents: 100000000 }
              as: TreasuryOps
              captures: { a1: $.data.id }
            - call: "POST /liquidity/collateral-pledges"
              payload: { asset_id: "${a1}", line_id: "${ln}" }
              as: TreasuryOps
              captures: { pl_val: $.data.pledged_value_cents }
          trigger:
            - call: "GET /liquidity/borrowing-lines/${ln}"
              as: TreasuryOps
              captures: { pw1: $.data.borrowing_power_cents, pv1: $.data.pledged_value_cents }
            - call: "POST /liquidity/borrowing-lines/${ln}/draw"
              payload: { amount_cents: 42500000 }
              as: TreasuryOps
              captures: { pw2: $.data.borrowing_power_cents, dr2: $.data.drawn_cents }
          assert:
            - "pl_val == 85000000"
            - "pv1 == 85000000 and pw1 == 42500000  (min(80000000, floor(85000000*0.5)) - 0)"
            - "dr2 == 42500000 and pw2 == 0  (draw at exactly power is allowed; power floored at 0)"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: playbook_stood_down_revision_cycle
        grounds:
          - state_machines.ContingencyPlaybook.ACTIVATED_to_STOOD_DOWN
          - state_machines.ContingencyPlaybook.STOOD_DOWN_to_DRAFT
        distinguishing_aspect: |
          Cyclic machine on ContingencyPlaybook: DRAFT->TESTED->APPROVED->
          ACTIVATED->STOOD_DOWN->DRAFT; revise clears tested_at and
          approved_by_user_id and re-arms SKIPPED actions to PENDING, so the
          loop is observable on entity fields. Distinct entity from the breach
          instance below.
        test_recipe:
          setup:
            - "BASELINE scenario; line capacity 100000000 advance 10000 bps; LEVEL_1 asset 200000000 pledged (power 100000000); second LEVEL_1 asset 50000000 UNENCUMBERED"
            - "Playbook (creator ta_1): min_activation_posture NORMAL, target 90000000; action1 LINE_DRAWDOWN est 60000000 on line; action2 ASSET_SALE est 40000000 on second asset"
            - "capacity-test PASSED; approved by ro_2; activated by committee -> ACTIVATED, both actions READY"
          setup_api_calls:
            - call: "POST /liquidity/stress-scenarios"
              payload: { name: "Base", tier: "BASELINE", deposit_runoff_pct: 5, wholesale_renewal_pct: 80, level2_addon_bps: 0, horizon_days: 30 }
              as: RiskOfficer
              captures: { sc: $.data.id }
            - call: "POST /liquidity/borrowing-lines"
              payload: { provider_name: "Fed", line_type: "FED_DISCOUNT_WINDOW", total_capacity_cents: 100000000, advance_rate_bps: 10000 }
              as: TreasuryOps
              captures: { ln: $.data.id }
            - call: "POST /liquidity/liquid-assets"
              payload: { asset_class: "LEVEL_1", reference: "P1", market_value_cents: 200000000 }
              as: TreasuryOps
              captures: { ap: $.data.id }
            - call: "POST /liquidity/collateral-pledges"
              payload: { asset_id: "${ap}", line_id: "${ln}" }
              as: TreasuryOps
            - call: "POST /liquidity/liquid-assets"
              payload: { asset_class: "LEVEL_1", reference: "S1", market_value_cents: 50000000 }
              as: TreasuryOps
              captures: { as1: $.data.id }
            - call: "POST /liquidity/contingency-playbooks"
              payload: { name: "PB", scenario_id: "${sc}", min_activation_posture: "NORMAL", target_capacity_cents: 90000000 }
              as: TreasuryAnalyst
              as_user_id: ta_1
              captures: { pb: $.data.id }
            - call: "POST /liquidity/contingency-playbooks/${pb}/actions"
              payload: { kind: "LINE_DRAWDOWN", sequence_no: 1, estimated_proceeds_cents: 60000000, settlement_lag_days: 0, line_id: "${ln}" }
              as: TreasuryAnalyst
              captures: { act1: $.data.id }
            - call: "POST /liquidity/contingency-playbooks/${pb}/actions"
              payload: { kind: "ASSET_SALE", sequence_no: 2, estimated_proceeds_cents: 40000000, settlement_lag_days: 0, asset_id: "${as1}" }
              as: TreasuryAnalyst
              captures: { act2: $.data.id }
            - call: "POST /liquidity/contingency-playbooks/${pb}/capacity-test"
              as: RiskOfficer
              captures: { ct_result: $.data.result }
            - call: "POST /liquidity/contingency-playbooks/${pb}/approve"
              as: RiskOfficer
              as_user_id: ro_2
            - call: "POST /liquidity/contingency-playbooks/${pb}/activate"
              as: LiquidityCommittee
          trigger:
            - call: "POST /liquidity/contingency-playbooks/${pb}/stand-down"
              as: LiquidityCommittee
              captures: { st_down: $.data.status }
            - call: "POST /liquidity/contingency-playbooks/${pb}/revise"
              as: TreasuryAnalyst
              captures: { st_rev: $.data.status, rev_tested: $.data.tested_at, rev_appr: $.data.approved_by_user_id }
            - call: "GET /liquidity/playbook-actions/${act1}"
              as: TreasuryAnalyst
              captures: { act1_st: $.data.status }
          assert:
            - "ct_result == PASSED  (caps: 100000000 >= 60000000 line, 50000000 >= 40000000 asset; total 100000000 >= target 90000000)"
            - "st_down == STOOD_DOWN"
            - "st_rev == DRAFT  (cycle closed)"
            - "rev_tested == null and rev_appr == null  (revision clears test/approval evidence)"
            - "act1_st == PENDING  (SKIPPED actions re-armed on revise)"

      - name: breach_acknowledge_fork_remediate_vs_escalate
        grounds:
          - state_machines.LimitBreach.ACKNOWLEDGED_to_REMEDIATED
          - state_machines.LimitBreach.ACKNOWLEDGED_to_ESCALATED
          - state_machines.LimitBreach.ESCALATED_to_REMEDIATED
        distinguishing_aspect: |
          Branching machine on LimitBreach (distinct entity from the playbook
          cycle): from ACKNOWLEDGED the fork {REMEDIATED, ESCALATED} carries
          divergent rules — direct remediation is open to RiskOfficer, while
          the ESCALATED branch remediates only via LiquidityCommittee.
        test_recipe:
          setup:
            - "Limits: WHOLESALE_RELIANCE_PCT ABOVE 4000 (BOARD); TOP_COUNTERPARTY_PCT ABOVE 5000 (REGULATORY)"
            - "Funding: RetailA 6000000000 retail; W1 4000000000 wholesale_unsecured; W2 1000000000 brokered"
            - "Evaluation breaches both limits (wholesale 4545 > 4000; top counterparty 5454 > 5000): breaches B1, B2, both ACKNOWLEDGED by ro_1; B2 ESCALATED by committee"
            - "RetailB 4000000000 retail added afterwards (dilutes wholesale to 3333 bps and top counterparty to 4000 bps)"
          setup_api_calls:
            - call: "POST /liquidity/board-limits"
              payload: { subject: "WHOLESALE_RELIANCE_PCT", direction: "ABOVE_BREACHES", limit_value: 4000, severity: "BOARD" }
              as: RiskOfficer
              captures: { l1: $.data.id }
            - call: "POST /liquidity/board-limits"
              payload: { subject: "TOP_COUNTERPARTY_PCT", direction: "ABOVE_BREACHES", limit_value: 5000, severity: "REGULATORY" }
              as: RiskOfficer
              captures: { l2: $.data.id }
            - call: "POST /liquidity/funding-sources"
              payload: { counterparty_name: "RetailA", channel: "RETAIL_DEPOSIT", balance_cents: 6000000000 }
              as: TreasuryAnalyst
            - call: "POST /liquidity/funding-sources"
              payload: { counterparty_name: "W1", channel: "WHOLESALE_UNSECURED", balance_cents: 4000000000, matures_in_days: 20 }
              as: TreasuryAnalyst
            - call: "POST /liquidity/funding-sources"
              payload: { counterparty_name: "W2", channel: "BROKERED", balance_cents: 1000000000, matures_in_days: 15 }
              as: TreasuryAnalyst
            - call: "POST /liquidity/funding-evaluations"
              as: RiskOfficer
              captures: { ev_bc: $.data.breaches_created }
            - call: "GET /liquidity/board-limits/${l1}/breaches"
              as: RiskOfficer
              captures: { b1: "$.data[0].id" }
            - call: "GET /liquidity/board-limits/${l2}/breaches"
              as: RiskOfficer
              captures: { b2: "$.data[0].id" }
            - call: "POST /liquidity/breaches/${b1}/acknowledge"
              as: RiskOfficer
              as_user_id: ro_1
            - call: "POST /liquidity/breaches/${b2}/acknowledge"
              as: RiskOfficer
              as_user_id: ro_1
            - call: "POST /liquidity/breaches/${b2}/escalate"
              as: LiquidityCommittee
              as_user_id: lc_9
            - call: "POST /liquidity/funding-sources"
              payload: { counterparty_name: "RetailB", channel: "RETAIL_DEPOSIT", balance_cents: 4000000000 }
              as: TreasuryAnalyst
          trigger:
            - call: "POST /liquidity/breaches/${b1}/remediate"
              payload: { remediation_note: "diluted wholesale share" }
              as: RiskOfficer
              as_user_id: ro_2
              captures: { b1_st: $.data.status }
            - call: "POST /liquidity/breaches/${b2}/remediate"
              payload: { remediation_note: "officer attempt on escalated" }
              as: RiskOfficer
              as_user_id: ro_3
              captures: { b2_err: $.data.error_id }
            - call: "POST /liquidity/breaches/${b2}/remediate"
              payload: { remediation_note: "committee sign-off" }
              as: LiquidityCommittee
              as_user_id: lc_1
              captures: { b2_st: $.data.status }
          assert:
            - "ev_bc == 2"
            - "b1_st == REMEDIATED  (ACKNOWLEDGED branch: RiskOfficer ro_2 != acknowledger ro_1; current value 3333 <= 4000)"
            - "b2_err == ERR_FORBIDDEN  (ESCALATED branch is Committee-only)"
            - "b2_st == REMEDIATED  (Committee lc_1 != acknowledger ro_1; current value 4000 <= 5000)"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: pledge_release_cascades_to_line_suspension_and_action_block
        grounds:
          - state_machines.CollateralPledge.ACTIVE_to_RELEASED
          - state_machines.BorrowingLine.ACTIVE_to_SUSPENDED
          - state_machines.PlaybookAction.READY_to_BLOCKED
          - calculations.borrowing_power
        distinguishing_aspect: |
          Depth-4 chain triggered by pledge release: pledge RELEASED (1) ->
          line pledged/power recompute (2) -> drawn exceeds collateral cap so
          line auto-SUSPENDED (3) -> READY LINE_DRAWDOWN action referencing
          the line becomes BLOCKED (4). Each link is caused by the previous
          link, not by the original request.
        test_recipe:
          setup:
            - "BASELINE scenario; line capacity 50000000 advance 10000; LEVEL_1 asset 60000000 pledged (power 50000000)"
            - "Playbook (target 5000000, min NORMAL) with one LINE_DRAWDOWN action est 5000000 on the line: TESTED -> APPROVED -> ACTIVATED, action READY"
            - "TreasuryOps draws 40000000 on the line (drawn 40000000, power 10000000)"
          setup_api_calls:
            - call: "POST /liquidity/stress-scenarios"
              payload: { name: "Base", tier: "BASELINE", deposit_runoff_pct: 5, wholesale_renewal_pct: 80, level2_addon_bps: 0, horizon_days: 30 }
              as: RiskOfficer
              captures: { sc: $.data.id }
            - call: "POST /liquidity/borrowing-lines"
              payload: { provider_name: "Fed", line_type: "FED_DISCOUNT_WINDOW", total_capacity_cents: 50000000, advance_rate_bps: 10000 }
              as: TreasuryOps
              captures: { ln: $.data.id }
            - call: "POST /liquidity/liquid-assets"
              payload: { asset_class: "LEVEL_1", reference: "P1", market_value_cents: 60000000 }
              as: TreasuryOps
              captures: { ap: $.data.id }
            - call: "POST /liquidity/collateral-pledges"
              payload: { asset_id: "${ap}", line_id: "${ln}" }
              as: TreasuryOps
              captures: { plg: $.data.id }
            - call: "POST /liquidity/contingency-playbooks"
              payload: { name: "PB", scenario_id: "${sc}", min_activation_posture: "NORMAL", target_capacity_cents: 5000000 }
              as: TreasuryAnalyst
              as_user_id: ta_1
              captures: { pb: $.data.id }
            - call: "POST /liquidity/contingency-playbooks/${pb}/actions"
              payload: { kind: "LINE_DRAWDOWN", sequence_no: 1, estimated_proceeds_cents: 5000000, settlement_lag_days: 0, line_id: "${ln}" }
              as: TreasuryAnalyst
              captures: { act1: $.data.id }
            - call: "POST /liquidity/contingency-playbooks/${pb}/capacity-test"
              as: RiskOfficer
            - call: "POST /liquidity/contingency-playbooks/${pb}/approve"
              as: RiskOfficer
              as_user_id: ro_2
            - call: "POST /liquidity/contingency-playbooks/${pb}/activate"
              as: LiquidityCommittee
            - call: "POST /liquidity/borrowing-lines/${ln}/draw"
              payload: { amount_cents: 40000000 }
              as: TreasuryOps
          trigger:
            - call: "POST /liquidity/collateral-pledges/${plg}/release"
              as: TreasuryOps
              captures: { pl_st: $.data.status }
            - call: "GET /liquidity/borrowing-lines/${ln}"
              as: TreasuryOps
              captures: { ln_st: $.data.status, ln_pw: $.data.borrowing_power_cents, ln_pv: $.data.pledged_value_cents }
            - call: "GET /liquidity/playbook-actions/${act1}"
              as: TreasuryOps
              captures: { act1_st: $.data.status }
            - call: "GET /liquidity/liquid-assets"
              payload: { encumbrance_status: "UNENCUMBERED" }
              as: TreasuryOps
              captures: { asset_enc: "$.data[0].encumbrance_status" }
          assert:
            - "pl_st == RELEASED"
            - "ln_pv == 0 and ln_pw == 0"
            - "ln_st == SUSPENDED  (drawn 40000000 > min(50000000, 0) = 0 after recompute)"
            - "act1_st == BLOCKED  (cascade reached the READY LINE_DRAWDOWN action)"
            - "asset_enc == UNENCUMBERED"

      - name: red_reading_cascades_to_posture_escalation_and_breach_escalation
        grounds:
          - state_machines.LimitBreach.OPEN_to_ESCALATED
          - calculations.posture_evaluation
          - state_machines.PostureSnapshot.NORMAL_to_SEVERE
        distinguishing_aspect: |
          Depth-4 chain with a different trigger (metric reading post, not
          pledge release): reading appended (1) -> metric band becomes RED (2)
          -> READING_AUTO posture evaluation appends SEVERE snapshot (3) ->
          entering SEVERE auto-escalates the freshly created OPEN breach (4).
        test_recipe:
          setup:
            - "Metric M (ABOVE_BREACHES, amber 1000, red 5000, cadence 0)"
            - "BoardLimit on M: subject EWI_METRIC, ABOVE_BREACHES, limit_value 4000"
          setup_api_calls:
            - call: "POST /liquidity/ewi-metrics"
              payload: { code: "M", name: "m", unit: "PCT_BPS", direction: "ABOVE_BREACHES", amber_threshold: 1000, red_threshold: 5000, min_reading_interval_hours: 0 }
              as: RiskOfficer
              captures: { m: $.data.id }
            - call: "POST /liquidity/board-limits"
              payload: { subject: "EWI_METRIC", direction: "ABOVE_BREACHES", limit_value: 4000, severity: "BOARD", ewi_metric_id: "${m}" }
              as: RiskOfficer
              captures: { lim: $.data.id }
          trigger:
            - call: "POST /liquidity/ewi-metrics/${m}/readings"
              payload: { observed_at: "2026-08-01T00:00:00Z", value: 6000 }
              as: TreasuryAnalyst
              captures: { rd_band: $.data.band }
            - call: "GET /liquidity/ewi-dashboard"
              as: RiskOfficer
              captures: { dash_lvl: $.data.posture_level, dash_red: $.data.red_count }
            - call: "GET /liquidity/board-limits/${lim}/breaches"
              as: RiskOfficer
              captures: { br_st: "$.data[0].status", br_val: "$.data[0].detected_value" }
          assert:
            - "rd_band == RED  (6000 > 5000)"
            - "dash_lvl == SEVERE and dash_red == 1  (READING_AUTO snapshot appended)"
            - "br_st == ESCALATED  (breach created OPEN by detection, then auto-escalated by the SEVERE entry in the same request)"
            - "br_val == 6000"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: activate_draft_playbook_state_beats_posture_gate
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - state_machines.ContingencyPlaybook.APPROVED_to_ACTIVATED
        distinguishing_aspect: |
          Error-category pair (state vs business_safety): the playbook is DRAFT
          (ERR_INVALID_STATE, priority 6) AND the NORMAL posture is below the
          playbook's SEVERE minimum (ERR_POSTURE_INSUFFICIENT, priority 7);
          the state error must win.
        test_recipe:
          setup:
            - "BASELINE scenario ACTIVE; playbook min_activation_posture SEVERE, target 1000, still DRAFT (no actions added, never tested)"
            - "No PostureSnapshots exist, so current posture is NORMAL — below the SEVERE gate"
          setup_api_calls:
            - call: "POST /liquidity/stress-scenarios"
              payload: { name: "Base", tier: "BASELINE", deposit_runoff_pct: 5, wholesale_renewal_pct: 80, level2_addon_bps: 0, horizon_days: 30 }
              as: RiskOfficer
              captures: { sc: $.data.id }
            - call: "POST /liquidity/contingency-playbooks"
              payload: { name: "PB", scenario_id: "${sc}", min_activation_posture: "SEVERE", target_capacity_cents: 1000 }
              as: TreasuryAnalyst
              as_user_id: ta_1
              captures: { pb: $.data.id }
          trigger:
            - call: "POST /liquidity/contingency-playbooks/${pb}/activate"
              as: LiquidityCommittee
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE  (state priority 6 beats business_safety priority 7 even though the posture gate also fails)"

      - name: draw_suspended_line_safety_beats_power_fiscal
        grounds:
          - validations[priority=7]
          - validations[priority=10]
          - calculations.borrowing_power
        distinguishing_aspect: |
          Error-category pair (business_safety vs business_fiscal) — distinct
          from the state-vs-safety pair above: the line is SUSPENDED
          (ERR_LINE_SUSPENDED, priority 7) AND the 5000000 draw exceeds the
          zero borrowing power (ERR_INSUFFICIENT_BORROWING_POWER, priority
          10); the safety error must win.
        test_recipe:
          setup:
            - "Line capacity 10000000, advance 10000 bps, no pledges (borrowing_power 0)"
            - "Line manually suspended by RiskOfficer"
          setup_api_calls:
            - call: "POST /liquidity/borrowing-lines"
              payload: { provider_name: "RepoCo", line_type: "REPO", total_capacity_cents: 10000000, advance_rate_bps: 10000 }
              as: TreasuryOps
              captures: { ln: $.data.id }
            - call: "POST /liquidity/borrowing-lines/${ln}/suspend"
              as: RiskOfficer
          trigger:
            - call: "POST /liquidity/borrowing-lines/${ln}/draw"
              payload: { amount_cents: 5000000 }
              as: TreasuryOps
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_LINE_SUSPENDED  (business_safety priority 7 beats business_fiscal priority 10 even though the draw also exceeds power 0)"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: posture_amber_count_exactly_three_crosses_heightened
        grounds:
          - calculations.posture_evaluation
        distinguishing_aspect: |
          Metric amber_count at the >= 3 breakpoint, exercised via POST
          /liquidity/posture-evaluations: exactly 2 AMBER metrics leave the
          posture NORMAL; the third AMBER metric crosses to HEIGHTENED.
        test_recipe:
          setup:
            - "Metrics M1/M2/M3 (ABOVE_BREACHES, amber 1000, red 5000, cadence 0); M1 and M2 hold AMBER readings (1500)"
          setup_api_calls:
            - call: "POST /liquidity/ewi-metrics"
              payload: { code: "M1", name: "m1", unit: "PCT_BPS", direction: "ABOVE_BREACHES", amber_threshold: 1000, red_threshold: 5000, min_reading_interval_hours: 0 }
              as: RiskOfficer
              captures: { m1: $.data.id }
            - call: "POST /liquidity/ewi-metrics"
              payload: { code: "M2", name: "m2", unit: "PCT_BPS", direction: "ABOVE_BREACHES", amber_threshold: 1000, red_threshold: 5000, min_reading_interval_hours: 0 }
              as: RiskOfficer
              captures: { m2: $.data.id }
            - call: "POST /liquidity/ewi-metrics"
              payload: { code: "M3", name: "m3", unit: "PCT_BPS", direction: "ABOVE_BREACHES", amber_threshold: 1000, red_threshold: 5000, min_reading_interval_hours: 0 }
              as: RiskOfficer
              captures: { m3: $.data.id }
            - call: "POST /liquidity/ewi-metrics/${m1}/readings"
              payload: { observed_at: "2026-08-01T00:00:00Z", value: 1500 }
              as: TreasuryAnalyst
            - call: "POST /liquidity/ewi-metrics/${m2}/readings"
              payload: { observed_at: "2026-08-01T00:00:00Z", value: 1500 }
              as: TreasuryAnalyst
          trigger:
            - call: "POST /liquidity/posture-evaluations"
              as: RiskOfficer
              captures: { e1_lvl: $.data.level, e1_amber: $.data.amber_count }
            - call: "POST /liquidity/ewi-metrics/${m3}/readings"
              payload: { observed_at: "2026-08-01T00:00:00Z", value: 1500 }
              as: TreasuryAnalyst
            - call: "POST /liquidity/posture-evaluations"
              as: RiskOfficer
              captures: { e2_lvl: $.data.level, e2_amber: $.data.amber_count }
          assert:
            - "e1_lvl == NORMAL and e1_amber == 2  (2 < 3: no crossing)"
            - "e2_lvl == HEIGHTENED and e2_amber == 3  (>= 3 crosses; >= vs > pinned)"

      - name: funding_limit_value_equal_does_not_breach
        grounds:
          - calculations.breach_detection
          - calculations.funding_concentration
        distinguishing_aspect: |
          Metric wholesale_reliance_bps at the strict-> breakpoint, exercised
          via POST /liquidity/funding-evaluations (distinct metric and
          endpoint from the amber-count boundary): a value exactly equal to
          the limit (4000) creates no breach; 4545 does.
        test_recipe:
          setup:
            - "Limit WHOLESALE_RELIANCE_PCT ABOVE_BREACHES limit_value 4000"
            - "Funding: RetailA 6000000000 retail + W1 4000000000 wholesale_unsecured -> wholesale share exactly 4000 bps"
          setup_api_calls:
            - call: "POST /liquidity/board-limits"
              payload: { subject: "WHOLESALE_RELIANCE_PCT", direction: "ABOVE_BREACHES", limit_value: 4000, severity: "BOARD" }
              as: RiskOfficer
            - call: "POST /liquidity/funding-sources"
              payload: { counterparty_name: "RetailA", channel: "RETAIL_DEPOSIT", balance_cents: 6000000000 }
              as: TreasuryAnalyst
            - call: "POST /liquidity/funding-sources"
              payload: { counterparty_name: "W1", channel: "WHOLESALE_UNSECURED", balance_cents: 4000000000, matures_in_days: 20 }
              as: TreasuryAnalyst
          trigger:
            - call: "POST /liquidity/funding-evaluations"
              as: RiskOfficer
              captures: { ev1_bc: $.data.breaches_created, ev1_wr: $.data.wholesale_reliance_bps }
            - call: "POST /liquidity/funding-sources"
              payload: { counterparty_name: "W2", channel: "WHOLESALE_SECURED", balance_cents: 1000000000, matures_in_days: 8 }
              as: TreasuryAnalyst
            - call: "POST /liquidity/funding-evaluations"
              as: RiskOfficer
              captures: { ev2_bc: $.data.breaches_created, ev2_wr: $.data.wholesale_reliance_bps }
          assert:
            - "ev1_wr == 4000 and ev1_bc == 0  (value == limit does NOT breach; strict >)"
            - "ev2_wr == 4545 and ev2_bc == 1  (floor(5000000000*10000/11000000000) = 4545 > 4000 breaches)"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: playbook_activation_gated_by_current_posture
        grounds:
          - state_machines.ContingencyPlaybook.APPROVED_to_ACTIVATED
          - entities.PostureSnapshot.fields.level
        distinguishing_aspect: |
          Entity pair ContingencyPlaybook x PostureSnapshot: activation is
          rejected while the latest posture snapshot is below the playbook's
          minimum and succeeds once a RED reading escalates posture to SEVERE.
        test_recipe:
          setup:
            - "BASELINE scenario; line 100000000/10000 with LEVEL_1 asset 200000000 pledged (power 100000000)"
            - "Playbook min_activation_posture SEVERE, target 60000000, one LINE_DRAWDOWN action est 60000000; TESTED -> APPROVED"
            - "Metric M (amber 1000, red 5000, cadence 0) configured; posture still NORMAL (no snapshots)"
          setup_api_calls:
            - call: "POST /liquidity/stress-scenarios"
              payload: { name: "Base", tier: "BASELINE", deposit_runoff_pct: 5, wholesale_renewal_pct: 80, level2_addon_bps: 0, horizon_days: 30 }
              as: RiskOfficer
              captures: { sc: $.data.id }
            - call: "POST /liquidity/borrowing-lines"
              payload: { provider_name: "Fed", line_type: "FED_DISCOUNT_WINDOW", total_capacity_cents: 100000000, advance_rate_bps: 10000 }
              as: TreasuryOps
              captures: { ln: $.data.id }
            - call: "POST /liquidity/liquid-assets"
              payload: { asset_class: "LEVEL_1", reference: "P1", market_value_cents: 200000000 }
              as: TreasuryOps
              captures: { ap: $.data.id }
            - call: "POST /liquidity/collateral-pledges"
              payload: { asset_id: "${ap}", line_id: "${ln}" }
              as: TreasuryOps
            - call: "POST /liquidity/contingency-playbooks"
              payload: { name: "PB", scenario_id: "${sc}", min_activation_posture: "SEVERE", target_capacity_cents: 60000000 }
              as: TreasuryAnalyst
              as_user_id: ta_1
              captures: { pb: $.data.id }
            - call: "POST /liquidity/contingency-playbooks/${pb}/actions"
              payload: { kind: "LINE_DRAWDOWN", sequence_no: 1, estimated_proceeds_cents: 60000000, settlement_lag_days: 0, line_id: "${ln}" }
              as: TreasuryAnalyst
            - call: "POST /liquidity/contingency-playbooks/${pb}/capacity-test"
              as: RiskOfficer
            - call: "POST /liquidity/contingency-playbooks/${pb}/approve"
              as: RiskOfficer
              as_user_id: ro_2
            - call: "POST /liquidity/ewi-metrics"
              payload: { code: "M", name: "m", unit: "PCT_BPS", direction: "ABOVE_BREACHES", amber_threshold: 1000, red_threshold: 5000, min_reading_interval_hours: 0 }
              as: RiskOfficer
              captures: { m: $.data.id }
          trigger:
            - call: "POST /liquidity/contingency-playbooks/${pb}/activate"
              as: LiquidityCommittee
              captures: { err1: $.data.error_id }
            - call: "POST /liquidity/ewi-metrics/${m}/readings"
              payload: { observed_at: "2026-08-01T00:00:00Z", value: 6000 }
              as: TreasuryAnalyst
            - call: "POST /liquidity/contingency-playbooks/${pb}/activate"
              as: LiquidityCommittee
              captures: { pb_st: $.data.status }
          assert:
            - "err1 == ERR_POSTURE_INSUFFICIENT  (NORMAL ordinal 0 < SEVERE ordinal 2)"
            - "pb_st == ACTIVATED  (after the RED reading escalated posture to SEVERE via READING_AUTO)"

      - name: pledge_creation_gated_by_asset_encumbrance
        grounds:
          - state_machines.LiquidAsset.UNENCUMBERED_to_PLEDGED
          - validations[priority=7]
        distinguishing_aspect: |
          Entity pair CollateralPledge x LiquidAsset (distinct from the
          playbook x posture pair): a second pledge against an asset whose
          encumbrance_status flipped to PLEDGED is rejected.
        test_recipe:
          setup:
            - "Two ACTIVE lines L1 (30000000/10000) and L2 (30000000/10000); one LEVEL_1 asset market 30000000, UNENCUMBERED"
          setup_api_calls:
            - call: "POST /liquidity/borrowing-lines"
              payload: { provider_name: "Fed", line_type: "FED_DISCOUNT_WINDOW", total_capacity_cents: 30000000, advance_rate_bps: 10000 }
              as: TreasuryOps
              captures: { l1: $.data.id }
            - call: "POST /liquidity/borrowing-lines"
              payload: { provider_name: "FHLB", line_type: "FHLB", total_capacity_cents: 30000000, advance_rate_bps: 10000 }
              as: TreasuryOps
              captures: { l2: $.data.id }
            - call: "POST /liquidity/liquid-assets"
              payload: { asset_class: "LEVEL_1", reference: "A1", market_value_cents: 30000000 }
              as: TreasuryOps
              captures: { a1: $.data.id }
          trigger:
            - call: "POST /liquidity/collateral-pledges"
              payload: { asset_id: "${a1}", line_id: "${l1}" }
              as: TreasuryOps
              captures: { pl1_st: $.data.status, pl1_val: $.data.pledged_value_cents }
            - call: "POST /liquidity/collateral-pledges"
              payload: { asset_id: "${a1}", line_id: "${l2}" }
              as: TreasuryOps
              captures: { err: $.data.error_id }
          assert:
            - "pl1_st == ACTIVE and pl1_val == 30000000  (LEVEL_1 haircut 0)"
            - "err == ERR_ASSET_NOT_PLEDGEABLE  (asset PLEDGED after the first pledge)"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: single_active_playbook_mutual_exclusion
        grounds:
          - state_machines.ContingencyPlaybook.APPROVED_to_ACTIVATED
          - validations[priority=9]
        distinguishing_aspect: |
          Interval semantics: open-ended mutual exclusion on the single
          active-playbook slot — while PB1 occupies [activated, stood_down),
          PB2's activation collides. Differs from the cadence-buffer semantics
          below and sits on a different resource (playbook slot vs metric
          reading stream).
        test_recipe:
          setup:
            - "BASELINE scenario; line 100000000/10000 with LEVEL_1 asset 200000000 pledged (power 100000000)"
            - "PB1 target 60000000 with LINE_DRAWDOWN est 60000000; PB2 target 30000000 with LINE_DRAWDOWN est 30000000; both TESTED and APPROVED; min NORMAL"
          setup_api_calls:
            - call: "POST /liquidity/stress-scenarios"
              payload: { name: "Base", tier: "BASELINE", deposit_runoff_pct: 5, wholesale_renewal_pct: 80, level2_addon_bps: 0, horizon_days: 30 }
              as: RiskOfficer
              captures: { sc: $.data.id }
            - call: "POST /liquidity/borrowing-lines"
              payload: { provider_name: "Fed", line_type: "FED_DISCOUNT_WINDOW", total_capacity_cents: 100000000, advance_rate_bps: 10000 }
              as: TreasuryOps
              captures: { ln: $.data.id }
            - call: "POST /liquidity/liquid-assets"
              payload: { asset_class: "LEVEL_1", reference: "P1", market_value_cents: 200000000 }
              as: TreasuryOps
              captures: { ap: $.data.id }
            - call: "POST /liquidity/collateral-pledges"
              payload: { asset_id: "${ap}", line_id: "${ln}" }
              as: TreasuryOps
            - call: "POST /liquidity/contingency-playbooks"
              payload: { name: "PB1", scenario_id: "${sc}", min_activation_posture: "NORMAL", target_capacity_cents: 60000000 }
              as: TreasuryAnalyst
              as_user_id: ta_1
              captures: { pb1: $.data.id }
            - call: "POST /liquidity/contingency-playbooks/${pb1}/actions"
              payload: { kind: "LINE_DRAWDOWN", sequence_no: 1, estimated_proceeds_cents: 60000000, settlement_lag_days: 0, line_id: "${ln}" }
              as: TreasuryAnalyst
            - call: "POST /liquidity/contingency-playbooks/${pb1}/capacity-test"
              as: RiskOfficer
            - call: "POST /liquidity/contingency-playbooks/${pb1}/approve"
              as: RiskOfficer
              as_user_id: ro_2
            - call: "POST /liquidity/contingency-playbooks"
              payload: { name: "PB2", scenario_id: "${sc}", min_activation_posture: "NORMAL", target_capacity_cents: 30000000 }
              as: TreasuryAnalyst
              as_user_id: ta_1
              captures: { pb2: $.data.id }
            - call: "POST /liquidity/contingency-playbooks/${pb2}/actions"
              payload: { kind: "LINE_DRAWDOWN", sequence_no: 1, estimated_proceeds_cents: 30000000, settlement_lag_days: 0, line_id: "${ln}" }
              as: TreasuryAnalyst
            - call: "POST /liquidity/contingency-playbooks/${pb2}/capacity-test"
              as: RiskOfficer
            - call: "POST /liquidity/contingency-playbooks/${pb2}/approve"
              as: RiskOfficer
              as_user_id: ro_2
          trigger:
            - call: "POST /liquidity/contingency-playbooks/${pb1}/activate"
              as: LiquidityCommittee
              captures: { st1: $.data.status }
            - call: "POST /liquidity/contingency-playbooks/${pb2}/activate"
              as: LiquidityCommittee
              captures: { err: $.data.error_id }
          assert:
            - "st1 == ACTIVATED"
            - "err == ERR_PLAYBOOK_ALREADY_ACTIVE  (PB1's open-ended active interval excludes PB2)"

      - name: metric_reading_minimum_cadence_buffer
        grounds:
          - validations[priority=8]
          - entities.EwiMetric.fields.min_reading_interval_hours
        distinguishing_aspect: |
          Interval semantics: minimum-gap buffer — a reading is rejected when
          observed_at < last_reading_at + min_reading_interval_hours and
          accepted at exactly the boundary (>= allowed). Different geometric
          treatment (gap buffer vs open-ended exclusion) and different
          resource (metric reading stream vs playbook slot).
        test_recipe:
          setup:
            - "Metric M (ABOVE_BREACHES, amber 1000, red 5000, min_reading_interval_hours 24)"
          setup_api_calls:
            - call: "POST /liquidity/ewi-metrics"
              payload: { code: "M", name: "m", unit: "PCT_BPS", direction: "ABOVE_BREACHES", amber_threshold: 1000, red_threshold: 5000, min_reading_interval_hours: 24 }
              as: RiskOfficer
              captures: { m: $.data.id }
          trigger:
            - call: "POST /liquidity/ewi-metrics/${m}/readings"
              payload: { observed_at: "2026-08-01T00:00:00Z", value: 100 }
              as: TreasuryAnalyst
              captures: { r1_band: $.data.band }
            - call: "POST /liquidity/ewi-metrics/${m}/readings"
              payload: { observed_at: "2026-08-01T12:00:00Z", value: 200 }
              as: TreasuryAnalyst
              captures: { err: $.data.error_id }
            - call: "POST /liquidity/ewi-metrics/${m}/readings"
              payload: { observed_at: "2026-08-02T00:00:00Z", value: 200 }
              as: TreasuryAnalyst
              captures: { r3_band: $.data.band }
          assert:
            - "r1_band == GREEN"
            - "err == ERR_READING_TOO_FREQUENT  (12h < 24h buffer)"
            - "r3_band == GREEN  (exactly +24h satisfies >= and is accepted; the rejected reading did not move last_reading_at)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: pledge_release_roundtrip_conserves_line_capacity_fields
        grounds:
          - calculations.borrowing_power
          - state_machines.CollateralPledge.ACTIVE_to_RELEASED
          - state_machines.LiquidAsset.PLEDGED_to_UNENCUMBERED
        distinguishing_aspect: |
          Conserved quantity: collateral-attributed line capacity. Forward
          pledge then compensating release leaves pledged_value_cents,
          drawn_cents and borrowing_power_cents bit-identical to pre-pledge
          values; the asset returns to UNENCUMBERED. Distinct quantity from
          the drawn-balance invariant below.
        test_recipe:
          setup:
            - "Line capacity 80000000, advance 5000 bps; LEVEL_2A asset market 100000000 UNENCUMBERED"
          setup_api_calls:
            - call: "POST /liquidity/borrowing-lines"
              payload: { provider_name: "FHLB", line_type: "FHLB", total_capacity_cents: 80000000, advance_rate_bps: 5000 }
              as: TreasuryOps
              captures: { ln: $.data.id }
            - call: "POST /liquidity/liquid-assets"
              payload: { asset_class: "LEVEL_2A", reference: "A1", market_value_cents: 100000000 }
              as: TreasuryOps
              captures: { a1: $.data.id }
            - call: "GET /liquidity/borrowing-lines/${ln}"
              as: TreasuryOps
              captures: { pv0: $.data.pledged_value_cents, pw0: $.data.borrowing_power_cents, dr0: $.data.drawn_cents }
          trigger:
            - call: "POST /liquidity/collateral-pledges"
              payload: { asset_id: "${a1}", line_id: "${ln}" }
              as: TreasuryOps
              captures: { plg: $.data.id, pl_val: $.data.pledged_value_cents }
            - call: "GET /liquidity/borrowing-lines/${ln}"
              as: TreasuryOps
              captures: { pw1: $.data.borrowing_power_cents }
            - call: "POST /liquidity/collateral-pledges/${plg}/release"
              as: TreasuryOps
            - call: "GET /liquidity/borrowing-lines/${ln}"
              as: TreasuryOps
              captures: { pv2: $.data.pledged_value_cents, pw2: $.data.borrowing_power_cents, dr2: $.data.drawn_cents }
            - call: "GET /liquidity/liquid-assets"
              payload: { asset_class: "LEVEL_2A" }
              as: TreasuryOps
              captures: { enc2: "$.data[0].encumbrance_status" }
            - call: "GET /liquidity/collateral-pledges/${plg}"
              as: TreasuryOps
              captures: { pl_st2: $.data.status }
          assert:
            - "pv0 == 0 and pw0 == 0 and dr0 == 0"
            - "pl_val == 85000000 and pw1 == 42500000  (forward action booked)"
            - "pv2 == 0 and pw2 == 0 and dr2 == 0  (round-trip leaves capacity fields unchanged: pv2 == pv0, pw2 == pw0, dr2 == dr0)"
            - "enc2 == UNENCUMBERED"
            - "pl_st2 == RELEASED"

      - name: draw_repay_roundtrip_conserves_drawn_balance
        grounds:
          - calculations.borrowing_power
          - state_machines.BorrowingLine
        distinguishing_aspect: |
          Conserved quantity: outstanding drawn balance (a debt quantity, not
          collateral capacity). A draw of 30000000 followed by a compensating
          repayment of 30000000 leaves drawn_cents and borrowing_power_cents
          identical to their pre-draw values.
        test_recipe:
          setup:
            - "Line capacity 80000000, advance 5000 bps; LEVEL_2A asset 100000000 pledged (power 42500000, drawn 0)"
          setup_api_calls:
            - call: "POST /liquidity/borrowing-lines"
              payload: { provider_name: "FHLB", line_type: "FHLB", total_capacity_cents: 80000000, advance_rate_bps: 5000 }
              as: TreasuryOps
              captures: { ln: $.data.id }
            - call: "POST /liquidity/liquid-assets"
              payload: { asset_class: "LEVEL_2A", reference: "A1", market_value_cents: 100000000 }
              as: TreasuryOps
              captures: { a1: $.data.id }
            - call: "POST /liquidity/collateral-pledges"
              payload: { asset_id: "${a1}", line_id: "${ln}" }
              as: TreasuryOps
          trigger:
            - call: "POST /liquidity/borrowing-lines/${ln}/draw"
              payload: { amount_cents: 30000000 }
              as: TreasuryOps
              captures: { dr1: $.data.drawn_cents, pw1: $.data.borrowing_power_cents }
            - call: "POST /liquidity/borrowing-lines/${ln}/repay"
              payload: { amount_cents: 30000000 }
              as: TreasuryOps
              captures: { dr2: $.data.drawn_cents, pw2: $.data.borrowing_power_cents }
          assert:
            - "dr1 == 30000000 and pw1 == 12500000  (42500000 - 30000000)"
            - "dr2 == 0 and pw2 == 42500000  (draw+repay round-trip leaves drawn balance and headroom unchanged)"
