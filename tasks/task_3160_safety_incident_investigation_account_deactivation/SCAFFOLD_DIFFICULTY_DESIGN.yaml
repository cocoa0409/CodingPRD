        grounds:
          - state_machines.SafetyIncident.transitions.OPEN_to_INVESTIGATING
          - state_machines.SafetyIncident.transitions.INVESTIGATING_to_OPEN
          - calculations.risk_contagion_propagation
          - entities.Account.fields.risk_score
