      - name: committee_assignment_closed_term_overlap_then_seat_capacity_exhaustion
        grounds:
          - validations.priority_62.ERR_ASSIGNMENT_TERM_OVERLAP
          - validations.priority_65.ERR_COMMITTEE_SEATS_EXHAUSTED
          - calculations.committee_seat_ledger
          - concurrency_rules.committee-assignment-create-stale-committee
          - entities.CommitteeAssignment.fields.term_start_on
        distinguishing_aspect: |
          Committee terms are CLOSED intervals, the opposite convention from the interviewer calendar in the
          sibling instance: a new term starting exactly on the day a prior term ends overlaps and must be
          rejected, while starting one day later is admitted. The admitted row then proves the second, distinct
          overlap dimension - the committee's finite seat count - by failing activation with
          ERR_COMMITTEE_SEATS_EXHAUSTED even though its term does not overlap anything.
        test_recipe:
          setup:
            - "ACTIVE GovernancePolicy for cycle 2026."
            - "Two SEATED directors d1 and d2, both is_independent true."
            - "A RISK committee with authorized_seats 2 and min_seats 1."
            - "Assignment a1: director d1, seat_role CHAIR, term 2026-01-01 to 2026-06-30, activated."
            - "Assignment a2: director d2, seat_role MEMBER, term 2026-01-01 to 2026-12-31, activated, so filled_seats is 2 and the posture is AT_STRENGTH."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { policy_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Dinah One", email: "dinah@issuer.example", birth_date: "1968-01-01", appointed_on: "2021-01-01", initial_service_status: "SEATED", is_independent: true }
              as: CorporateSecretary
              captures: { d1_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Devon Two", email: "devon@issuer.example", birth_date: "1969-02-02", appointed_on: "2021-02-01", initial_service_status: "SEATED", is_independent: true }
              as: CorporateSecretary
              captures: { d2_id: $.data.id }
            - call: "POST /governance/committees"
              payload: { code: "RISK", name: "Risk Oversight Committee", authorized_seats: 2, min_seats: 1 }
              as: CorporateSecretary
              captures: { comm_id: $.data.id, comm_v1: $.data.version }
            - call: "POST /governance/committees/${comm_id}/assignments"
              payload: { director_id: "${d1_id}", term_start_on: "2026-01-01", term_end_on: "2026-06-30", expected_committee_version: "${comm_v1}", seat_role: "CHAIR" }
              as: CorporateSecretary
              captures: { a1_id: $.data.id }
            - call: "POST /governance/assignments/${a1_id}/activate"
              payload: {}
              as: CorporateSecretary
            - call: "GET /governance/committees/${comm_id}"
              payload: {}
              as: CorporateSecretary
              captures: { comm_v2: $.data.version }
            - call: "POST /governance/committees/${comm_id}/assignments"
              payload: { director_id: "${d2_id}", term_start_on: "2026-01-01", term_end_on: "2026-12-31", expected_committee_version: "${comm_v2}", seat_role: "MEMBER" }
              as: CorporateSecretary
              captures: { a2_id: $.data.id }
            - call: "POST /governance/assignments/${a2_id}/activate"
              payload: {}
              as: CorporateSecretary
            - call: "GET /governance/committees/${comm_id}"
              payload: {}
              as: CorporateSecretary
              captures: { comm_v3: $.data.version }
          trigger:
            - call: "POST /governance/committees/${comm_id}/assignments"
              payload: { director_id: "${d1_id}", term_start_on: "2026-06-30", term_end_on: "2026-12-31", expected_committee_version: "${comm_v3}", seat_role: "MEMBER" }
              as: CorporateSecretary
              captures: { overlap_error_id: $.data.error_id }
            - call: "POST /governance/committees/${comm_id}/assignments"
              payload: { director_id: "${d1_id}", term_start_on: "2026-07-01", term_end_on: "2026-12-31", expected_committee_version: "${comm_v3}", seat_role: "MEMBER" }
              as: CorporateSecretary
              captures: { a3_id: $.data.id }
            - call: "POST /governance/assignments/${a3_id}/activate"
              payload: {}
              as: CorporateSecretary
              captures: { capacity_error_id: $.data.error_id }
          assert:
            - "Before the trigger: Committee.${comm_id}.filled_seats == 2 and status == \"AT_STRENGTH\" (min_seats 1 met and an ACTIVE CHAIR exists)"
            - "The first trigger call returns HTTP 409 with error_id == \"ERR_ASSIGNMENT_TERM_OVERLAP\": 2026-06-30 is shared with a1's closed term end"
            - "After that rejected call Committee.${comm_id}.version is still ${comm_v3}, which is why the same value is reused by the next call"
            - "The second trigger call returns HTTP 201 with CommitteeAssignment.${a3_id}.status == \"PROPOSED\" and activated_at null; 2026-07-01 is one day clear of a1's term end"
            - "The third trigger call returns HTTP 422 with error_id == \"ERR_COMMITTEE_SEATS_EXHAUSTED\": activation would make filled_seats 3 against authorized_seats 2"
            - "CommitteeAssignment.${a3_id}.status is still \"PROPOSED\" and Committee.${comm_id}.filled_seats == 2 with status \"AT_STRENGTH\""
            - "GET /governance/assignments?committee_id=${comm_id}&status=ACTIVE returns exactly 2 rows (a1 and a2)"

  - rule_id: compensating_invariant
    instances:
      - name: committee_seat_ledger_returns_to_its_pre_activation_value_after_revocations
        grounds:
          - calculations.committee_seat_ledger
          - state_machines.CommitteeAssignment.ACTIVE_to_REVOKED
          - state_machines.Committee.AT_STRENGTH_to_UNDER_STRENGTH
          - entities.Committee.fields.filled_seats
          - entities.CommitteeAssignment.fields.ended_reason_code
        distinguishing_aspect: |
          filled_seats is a conserved quantity that must always equal the count of ACTIVE assignment rows.
          Each revocation is the exact compensation of an activation, so the ledger must walk 0 -> 1 -> 2 ->
          1 -> 0 with the derived posture re-derived from the same count each time and no residue: an
          implementation that decrements a counter instead of recounting, or that leaves the posture at
          AT_STRENGTH after the chair seat is released, drifts.
        test_recipe:
          setup:
            - "ACTIVE GovernancePolicy for cycle 2026."
            - "Two SEATED independent directors d1 and d2."
            - "A COMPENSATION committee with authorized_seats 3 and min_seats 2 (so the posture depends on both the count and the presence of a chair)."
            - "Assignment a1 for d1 with seat_role CHAIR and assignment a2 for d2 with seat_role MEMBER, both created and both activated."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { policy_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Cora Chairseat", email: "cora@issuer.example", birth_date: "1968-01-01", appointed_on: "2021-01-01", initial_service_status: "SEATED", is_independent: true }
              as: CorporateSecretary
              captures: { d1_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Milo Memberseat", email: "milo@issuer.example", birth_date: "1969-02-02", appointed_on: "2021-02-01", initial_service_status: "SEATED", is_independent: true }
              as: CorporateSecretary
              captures: { d2_id: $.data.id }
            - call: "POST /governance/committees"
              payload: { code: "COMPENSATION", name: "Compensation Committee", authorized_seats: 3, min_seats: 2 }
              as: CorporateSecretary
              captures: { comm_id: $.data.id, comm_v1: $.data.version }
            - call: "POST /governance/committees/${comm_id}/assignments"
              payload: { director_id: "${d1_id}", term_start_on: "2026-01-01", term_end_on: "2026-12-31", expected_committee_version: "${comm_v1}", seat_role: "CHAIR" }
              as: CorporateSecretary
              captures: { a1_id: $.data.id }
            - call: "GET /governance/committees/${comm_id}"
              payload: {}
              as: CorporateSecretary
              captures: { comm_v2: $.data.version }
            - call: "POST /governance/committees/${comm_id}/assignments"
              payload: { director_id: "${d2_id}", term_start_on: "2026-01-01", term_end_on: "2026-12-31", expected_committee_version: "${comm_v2}", seat_role: "MEMBER" }
              as: CorporateSecretary
              captures: { a2_id: $.data.id }
            - call: "POST /governance/assignments/${a1_id}/activate"
              payload: {}
              as: CorporateSecretary
            - call: "POST /governance/assignments/${a2_id}/activate"
              payload: {}
              as: CorporateSecretary
          trigger:
            - call: "POST /governance/assignments/${a2_id}/revoke"
              payload: {}
              as: CorporateSecretary
            - call: "POST /governance/assignments/${a1_id}/revoke"
              payload: {}
              as: CorporateSecretary
            - call: "GET /governance/assignments"
              payload: { committee_id: "${comm_id}", status: "ACTIVE" }
              as: CorporateSecretary
          assert:
            - "Before the trigger: Committee.${comm_id}.filled_seats == 2 and status == \"AT_STRENGTH\" (2 >= min_seats 2 with an ACTIVE CHAIR)"
            - "After revoking a2: Committee.${comm_id}.filled_seats == 1 and status == \"UNDER_STRENGTH\" (1 < min_seats 2)"
            - "CommitteeAssignment.${a2_id}.status == \"REVOKED\", ended_reason_code == \"REVOCATION\", ended_at is not null"
            - "After revoking a1: Committee.${comm_id}.filled_seats == 0 and status == \"UNDER_STRENGTH\""
            - "CommitteeAssignment.${a1_id}.status == \"REVOKED\", ended_reason_code == \"REVOCATION\", ended_at is not null"
            - "The final GET returns 0 rows, and filled_seats == that row count exactly, back to its pre-activation value"
            - "Both revoked rows keep their activated_at timestamps, so the compensation is recorded rather than erased"

      - name: search_fee_ledger_releases_exactly_what_each_nominee_committed_and_re_tiers_survivors
        grounds:
          - calculations.search_firm_placement_fee
          - state_machines.SlateNominee.PROPOSED_to_VOIDED
          - entities.SearchFirm.fields.committed_fee_cents
          - entities.SearchFirm.fields.net_payable_cents
          - entities.NominationSlate.fields.committed_search_fee_cents
        distinguishing_aspect: |
          Voiding nominees must both release the exact cents each one committed and re-tier the survivors,
          because the tier depends on ordinal position: after the ordinal-1 nominee is voided the former TIER2
          nominee moves into TIER1 and its own fee rises from 6300005 to 7700006, so the ledger is not a simple
          subtraction. The invariant committed_fee_cents == sum of the surviving rounded fees must hold at
          every step, ending at exactly 0 with the retainer credit released too.
