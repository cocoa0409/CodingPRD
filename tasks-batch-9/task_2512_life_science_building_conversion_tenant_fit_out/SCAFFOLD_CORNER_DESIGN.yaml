          rationale: "That §1.8 instance already walks LOI -> NEGOTIATING -> COUNTER_PENDING -> NEGOTIATING with round_number 3 and asserts the cyclic shape, the turn-taking guard and the TTL stamp; a second corner instance would replay the identical transitions."

