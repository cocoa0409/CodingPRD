              as: BillingOps
              captures: { e2: $.data.error_id }
            - call: "POST /invoices/${inv}/issue"
              payload: {}
              as: CarrierAdmin
              captures: { e3: $.data.error_id }
            - call: "POST /billing-adjustments"
              payload: { invoice_line_id: "${line}", reason: "MANUAL", delta_cents: -100, expected_invoice_version: "${inv_v}" }
              as: RevenueAuditor
              as_user_id: "auditor.one"
              captures: { e4: $.data.error_id }
            - call: "POST /disputes"
              payload: { invoice_line_id: "${line}", claim_type: "WEIGHT", claimed_reason: "operations filing on the shipper's behalf" }
              as: CarrierOps
