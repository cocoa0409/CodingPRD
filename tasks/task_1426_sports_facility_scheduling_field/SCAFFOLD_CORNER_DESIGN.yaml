        grounds:
          - "validations[priority=1]"
          - "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"
        distinguishing_aspect: "A call with a role header absent (Anonymous) fails priority-1 with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before any role check."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /organizations/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER; http 400"
      - name: cross_org_withdraw_forbidden
        claim_type: violation_to_error
        grounds:
          - "validations[priority=4]"
