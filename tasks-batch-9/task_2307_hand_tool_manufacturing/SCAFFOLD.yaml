scenario: "2307. Hand Tool Manufacturing (hand tool manufacturer): forging, heat treatment and machining for wrenches, sockets and pliers with hardness and torque testing, plating and finishing with corrosion resistance testing to salt spray standards, assembly of multi-component tools with mechanism testing and cycle durability, product testing against industry performance standards with proof torque and dimensional requirements, lifetime warranty program administration with claim intake, replacement and fraud controls, branded, private label and professional channel product differentiation, packaging design for retail display, security and multipack configurations, counterfeit detection and brand protection in secondary channels"
domain_name: "hand-tool-manufacturing"
api_prefix: "/toolworks"

complexity_profile:
  difficulty_level: expert_plus          # above §0.4 Expert band: 13 entities / 55 endpoints / 48 errors / 9 calculations / 6 state machines
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - rate_threshold_triggers
    - derived_field_reconciliation

  entity_topology: graph
  # graph: ToolSku is self-referential (supersedes_sku_id lineage DAG with cycle + depth
  # constraints); PackConfiguration <-> ToolSku is many-to-many through PackMember;
  # ProductionLot/TestRun/FurnaceCampaign form a hierarchy that cross-references the
  # HeatTreatFurnace and SaltSprayChamber resource peers.

  state_machine_shape: parallel
  # ProductionLot carries two independent state dimensions (process_status x cert_status)
  # with a revision cycle in the cert dimension (REJECTED -> DRAFT -> IN_TEST) that also
  # regresses the process dimension. WarrantyClaim is branching + cyclic
  # (SUBMITTED -> FRAUD_HOLD -> SUBMITTED) with divergent side-effect sets per branch.

  relationship_patterns:
    - one_to_many          # ToolSku -> ProductionLot -> TestRun; WarrantyClaim -> ClaimLine
    - many_to_many         # PackConfiguration <-> ToolSku via PackMember
    - self_referential     # ToolSku.supersedes_sku_id -> ToolSku.id (lineage DAG)
    - cross_aggregate      # FurnaceCampaign spans ProductionLot and HeatTreatFurnace aggregates;
                           # WarrantyClaim spans Claimant, ToolSku and WarrantyProgram aggregates

  role_model: segregation_of_duties
  # The WarrantyAdministrator who placed a claim on FRAUD_HOLD may not be the one who
  # later approves it (X-User-ID tracked on WarrantyClaim.held_by_user_id). Layered on
  # top of peer ownership: ChannelManager owns catalogue/packaging, ProductionPlanner
  # owns lots/furnaces, QualityEngineer owns tests/certification.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: ToolSku
    parent: null
    common_fields: true
    fields:
      - name: sku_code
        type: string
        source: input
        description: "Catalogue code for the finished tool"
        constraints: "unique across ToolSku; 1-32 chars"
      - name: tool_family
        type: enum
        source: input
        description: "Product family driving the mandatory test battery"
        constraints: "WRENCH | SOCKET | PLIER"
      - name: channel
        type: enum
        source: input
        description: "Commercial channel the SKU is differentiated for"
        constraints: "BRANDED | PRIVATE_LABEL | PROFESSIONAL"
      - name: nominal_size_mm
        type: integer
        source: input
        description: "Nominal across-flats / jaw size in whole millimetres"
        constraints: ">= 1 and <= 80"
      - name: alloy_grade
        type: enum
        source: input
        description: "Steel grade fixing the minimum through-hardness"
        constraints: "CR_V | CR_MO | S2"
      - name: list_price_cents
        type: integer
        source: input
        description: "Catalogue list price in integer cents"
        constraints: ">= 1"
      - name: warranty_tier
        type: enum
        source: input
        description: "Warranty coverage class offered on this SKU"
        constraints: "LIFETIME | LIMITED_5Y | NONE"
      - name: supersedes_sku_id
        type: string
        source: input
        description: "FK -> ToolSku.id; nullable; lineage parent this SKU derives from (private-label / professional respin of a catalogue SKU)"
        default: null
        constraints: "must reference an existing ToolSku with the same tool_family; the lineage chain must stay acyclic and at most LINEAGE_MAX_DEPTH hops deep"
      - name: lineage_depth
        type: integer
        source: computed
        description: "Number of supersedes_sku_id hops from this SKU to a SKU whose supersedes_sku_id is null"
        default: 0
      - name: proof_torque_required_nm
        type: number
        source: computed
        description: "Industry proof-torque requirement for this SKU per calculations.proof_torque_requirement"
      - name: brand_risk_score
        type: integer
        source: computed
        description: "Sum of risk_points over this SKU's CONFIRMED CounterfeitReport rows, capped at 100"
        default: 0
        constraints: "0..100"
      - name: warranty_posture
        type: enum
        source: computed
        description: "Brand-protection posture derived from brand_risk_score; gates warranty approval and pack approval"
        default: OPEN
        constraints: "OPEN | RESTRICTED | SUSPENDED"
      - name: confirmed_counterfeit_count
        type: integer
        source: computed
        description: "Count of this SKU's CounterfeitReport rows with status == CONFIRMED"
        default: 0
      - name: units_received_total
        type: integer
        source: system
        description: "Cumulative finished units ever booked into inventory for this SKU (lot releases plus stock receipts); never decreases"
        default: 0
      - name: units_on_hand
        type: integer
        source: computed
        description: "Units physically available for warranty replacement"
        default: 0
      - name: units_reserved
        type: integer
        source: computed
        description: "Units committed to APPROVED warranty claims but not yet shipped"
        default: 0
      - name: units_shipped
        type: integer
        source: computed
        description: "Units shipped against FULFILLED warranty claims"
        default: 0

  - name: ProductionLot
    parent: ToolSku
    common_fields: true
    fields:
      - name: sku_id
        type: string
        source: input
        description: "FK -> ToolSku.id; the SKU this lot manufactures"
      - name: lot_code
        type: string
        source: input
        description: "Traveller / lot identifier stamped on the work order"
        constraints: "unique across ProductionLot"
      - name: unit_count
        type: integer
        source: input
        description: "Finished units in the lot, booked to inventory on release"
        constraints: ">= 1"
      - name: specimen_pool_total
        type: integer
        source: input
        description: "Destructive-test specimens drawn from the lot and available to test runs"
        constraints: ">= 1; immutable after creation"
      - name: specimens_available
        type: integer
        source: computed
        description: "Specimens neither committed to an open test run nor consumed; see calculations.specimen_ledger"
      - name: specimens_committed
        type: integer
        source: computed
        description: "Specimens held by TestRun rows in status SCHEDULED"
      - name: specimens_consumed
        type: integer
        source: computed
        description: "Specimens destroyed by TestRun rows in status PASSED or FAILED"
      - name: process_status
        type: enum
        source: system
        description: "Manufacturing routing dimension (independent of cert_status)"
        default: FORGED
        constraints: "FORGED | HEAT_TREATED | MACHINED | PLATED | ASSEMBLED"
      - name: cert_status
        type: enum
        source: system
        description: "Certification dossier dimension (independent of process_status)"
        default: DRAFT
        constraints: "DRAFT | IN_TEST | CERTIFIED | REJECTED"
      - name: disposition
        type: enum
        source: system
        description: "Material disposition of the lot"
        default: IN_PROCESS
        constraints: "IN_PROCESS | RELEASED | QUARANTINED"
      - name: hardness_index_sample
        type: number
        source: computed
        description: "SAMPLE_MEAN variant of calculations.lot_hardness_index (unweighted mean of rounded per-run means)"
        default: null
      - name: hardness_index_pooled
        type: number
        source: computed
        description: "POOLED variant of calculations.lot_hardness_index (specimen-weighted mean of raw readings)"
        default: null
      - name: proof_torque_required_nm
        type: number
        source: computed
        description: "Proof-torque requirement pinned from the SKU at lot creation; later ToolSku edits do not retro-change it"
      - name: rework_cycle_count
        type: integer
        source: system
        description: "Number of completed REJECTED -> DRAFT rework cycles"
        default: 0
      - name: certified_at
        type: datetime
        source: system
        description: "Logical-clock instant at which cert_status became CERTIFIED"
        default: null

  - name: HeatTreatFurnace
    parent: null
    common_fields: true
    fields:
      - name: furnace_code
        type: string
        source: input
        description: "Furnace asset code"
        constraints: "unique across HeatTreatFurnace"
      - name: max_charge_kg
        type: integer
        source: input
        description: "Maximum basket charge the furnace may hold"
        constraints: ">= 1"
      - name: alloy_grades_supported
        type: array
        source: input
        description: "Alloy grades this furnace is qualified to austenitise"
        constraints: "non-empty array of CR_V | CR_MO | S2"
      - name: status
        type: enum
        source: system
        description: "Availability of the furnace for new campaigns"
        default: AVAILABLE
        constraints: "AVAILABLE | MAINTENANCE"

  - name: FurnaceCampaign
    parent: ProductionLot
    common_fields: true
    fields:
      - name: lot_id
        type: string
        source: input
        description: "FK -> ProductionLot.id; the lot charged into the furnace"
      - name: furnace_id
        type: string
        source: input
        description: "FK -> HeatTreatFurnace.id; the furnace occupied by this campaign"
      - name: window_start
        type: datetime
        source: input
        description: "Inclusive start of the furnace occupation interval"
      - name: window_end
        type: datetime
        source: input
        description: "Exclusive end of the furnace occupation interval"
        constraints: "must be strictly after window_start"
      - name: charge_kg
        type: integer
        source: input
        description: "Basket charge weight for this campaign"
        constraints: ">= 1"
      - name: buffered_end
        type: datetime
        source: computed
        description: "window_end plus RAMP_BUFFER_MINUTES; the instant the furnace becomes bookable again"
      - name: soak_minutes
        type: integer
        source: system
        description: "Soak time recorded at completion"
        default: null
      - name: status
        type: enum
        source: system
        description: "Campaign lifecycle state"
        default: SCHEDULED
        constraints: "SCHEDULED | COMPLETED | RELEASED"

  - name: SaltSprayChamber
    parent: null
    common_fields: true
    fields:
      - name: chamber_code
        type: string
        source: input
        description: "Salt-spray cabinet asset code"
        constraints: "unique across SaltSprayChamber"
      - name: coupon_capacity
        type: integer
        source: input
        description: "Number of corrosion coupons the cabinet can expose at one instant"
        constraints: ">= 1"

  - name: TestRun
    parent: ProductionLot
    common_fields: true
    fields:
      - name: lot_id
        type: string
        source: input
        description: "FK -> ProductionLot.id; the lot whose specimens are tested"
      - name: chamber_id
        type: string
        source: input
        description: "FK -> SaltSprayChamber.id; nullable; required when test_type == SALT_SPRAY and forbidden for every other test_type"
        default: null
      - name: test_type
        type: enum
        source: input
        description: "Industry test performed"
        constraints: "HARDNESS | PROOF_TORQUE | DIMENSIONAL | SALT_SPRAY | MECHANISM_CYCLE"
      - name: specimen_count
        type: integer
        source: input
        description: "Specimens committed from the lot pool; equals the required length of readings"
        constraints: ">= 1"
      - name: window_start
        type: datetime
        source: input
        description: "Inclusive start of the test occupation interval"
      - name: window_end
        type: datetime
        source: input
        description: "Exclusive end of the test occupation interval"
        constraints: "must be strictly after window_start"
      - name: mandatory
        type: boolean
        source: computed
        description: "True when test_type is in MANDATORY_TESTS for the lot's SKU tool_family"
      - name: readings
        type: array
        source: input
        description: "Per-specimen measurements supplied when the result is recorded"
        default: null
      - name: mean_reading
        type: number
        source: computed
        description: "Arithmetic mean of readings rounded to 1 decimal, round_half_up"
        default: null
      - name: governing_statistic
        type: number
        source: computed
        description: "The single statistic compared against requirement_value per calculations.test_run_outcome"
        default: null
      - name: requirement_value
        type: number
        source: computed
        description: "The industry-standard threshold this run was judged against"
        default: null
      - name: result_margin_pct
        type: number
        source: computed
        description: "Signed percentage margin of governing_statistic over requirement_value, 2 decimals"
        default: null
      - name: status
        type: enum
        source: system
        description: "Test run lifecycle state"
        default: SCHEDULED
        constraints: "SCHEDULED | PASSED | FAILED | VOID"
      - name: void_reason
        type: string
        source: system
        description: "Why the run was voided (operator text, or CASCADE_LOT_REJECTED when voided by the lot-rejection cascade)"
        default: null

  - name: PackConfiguration
    parent: null
    common_fields: true
    fields:
      - name: pack_code
        type: string
        source: input
        description: "Packaging artwork / configuration code"
        constraints: "unique across PackConfiguration"
      - name: pack_type
        type: enum
        source: input
        description: "Retail presentation format"
        constraints: "RETAIL_DISPLAY | SECURITY | MULTIPACK"
      - name: primary_sku_id
        type: string
        source: input
        description: "FK -> ToolSku.id; the hero SKU whose channel every member must share"
      - name: member_subtotal_cents
        type: integer
        source: computed
        description: "Sum of per-member extended amounts per calculations.pack_pricing"
        default: 0
      - name: security_surcharge_cents
        type: integer
        source: computed
        description: "Anti-theft packaging surcharge, tiered on member_subtotal_cents (pre-surcharge)"
        default: 0
      - name: pack_total_cents
        type: integer
        source: computed
        description: "member_subtotal_cents + security_surcharge_cents"
        default: 0
      - name: distinct_member_count
        type: integer
        source: computed
        description: "Count of PackMember rows on this pack"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Packaging release state"
        default: DRAFT
        constraints: "DRAFT | APPROVED | WITHDRAWN"

  - name: PackMember
    parent: PackConfiguration
    common_fields: false
    fields:
      - name: pack_id
        type: string
        source: input
        description: "FK -> PackConfiguration.id; the pack this line belongs to"
      - name: sku_id
        type: string
        source: input
        description: "FK -> ToolSku.id; the SKU packed"
      - name: quantity
        type: integer
        source: input
        description: "Units of the SKU in one pack"
        constraints: ">= 1"
      - name: line_extended_cents
        type: integer
        source: computed
        description: "round_half_up(sku.list_price_cents * quantity * PACK_TYPE_DISCOUNT[pack.pack_type]) in integer cents"

  - name: WarrantyProgram
    parent: null
    common_fields: true
    fields:
      - name: program_code
        type: string
        source: input
        description: "Warranty programme code"
        constraints: "unique across WarrantyProgram"
      - name: reserve_funded_cents
        type: integer
        source: input
        description: "Total money funded into the replacement reserve; the conserved quantity of calculations.reserve_ledger"
        constraints: ">= 0; immutable after creation"
      - name: fraud_score_threshold
        type: integer
        source: input
        description: "Adjudication fraud score at or above which a claim is auto-held / cannot be approved"
        constraints: "1..100"
      - name: reserve_balance_cents
        type: integer
        source: computed
        description: "reserve_funded_cents minus the reserve charged to claims in status APPROVED or FULFILLED"
      - name: open_hold_count
        type: integer
        source: computed
        description: "Count of this programme's WarrantyClaim rows with status == FRAUD_HOLD"
        default: 0

  - name: Claimant
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Claimant contact address"
        constraints: "unique across Claimant"
      - name: claimant_type
        type: enum
        source: input
        description: "Consumer vs professional trade account; sets the fraud-score claim allowance"
        constraints: "CONSUMER | PRO_ACCOUNT"
      - name: status
        type: enum
        source: system
        description: "Whether the claimant may file new claims"
        default: ACTIVE
        constraints: "ACTIVE | BLOCKED"
      - name: fraud_risk_score_intake
        type: integer
        source: computed
        description: "INTAKE variant of calculations.claimant_fraud_score, refreshed on every claim intake"
        default: 0
      - name: fraud_risk_score_adjudication
        type: integer
        source: computed
        description: "ADJUDICATION variant of calculations.claimant_fraud_score, refreshed on hold / clear-hold / approve / cascade hold"
        default: 0
      - name: lifetime_claim_count
        type: integer
        source: computed
        description: "Count of this claimant's WarrantyClaim rows in any status"
        default: 0

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - name: claimant_id
        type: string
        source: input
        description: "FK -> Claimant.id; must equal X-User-ID when the caller acts as Claimant"
      - name: sku_id
        type: string
        source: input
        description: "FK -> ToolSku.id; the failed tool, also the source of replacement units"
      - name: program_id
        type: string
        source: input
        description: "FK -> WarrantyProgram.id; the reserve that funds the replacement"
      - name: serial_code
        type: string
        source: input
        description: "Serial stamped on the returned tool; repeats across a claimant's claims raise the fraud score"
      - name: claim_reason
        type: enum
        source: input
        description: "Failure mode declared at intake"
        constraints: "BREAKAGE | MECHANISM_FAILURE | CORROSION"
      - name: status
        type: enum
        source: system
        description: "Claim adjudication state"
        default: SUBMITTED
        constraints: "SUBMITTED | FRAUD_HOLD | APPROVED | FULFILLED | DENIED | DENIED_FRAUD | REVOKED"
      - name: fraud_score_at_intake
        type: integer
        source: computed
        description: "INTAKE-variant fraud score frozen on this claim at creation"
      - name: reserve_charge_cents
        type: integer
        source: computed
        description: "Sum of per-line rounded reserve amounts per calculations.claim_reserve_charge; frozen at approval"
        default: 0
      - name: replacement_unit_count
        type: integer
        source: computed
        description: "Sum of ClaimLine.quantity; the physical units reserved from ToolSku on approval"
        default: 0
      - name: line_count
        type: integer
        source: computed
        description: "Count of ClaimLine rows on this claim"
        default: 0
      - name: hold_reason
        type: string
        source: system
        description: "Reason recorded when the claim entered FRAUD_HOLD; COUNTERFEIT_POSTURE when placed by the brand-protection cascade"
        default: null
      - name: held_by_user_id
        type: string
        source: system
        description: "X-User-ID of the WarrantyAdministrator who placed the hold; null when the hold was placed by the system cascade. Retained after clear-hold to enforce segregation of duties at approval."
        default: null
      - name: fraud_cleared
        type: boolean
        source: system
        description: "Set true by clear-hold; waives the fraud-score gate at approval but not the SKU posture gate"
        default: false
      - name: denial_code
        type: string
        source: system
        description: "Denial reason code recorded at deny"
        default: null
      - name: shipment_ref
        type: string
        source: system
        description: "Carrier reference recorded at fulfilment"
        default: null
      - name: revocation_reason
        type: string
        source: system
        description: "Reason recorded when a settled claim was revoked"
        default: null

  - name: ClaimLine
    parent: WarrantyClaim
    common_fields: false
    fields:
      - name: claim_id
        type: string
        source: input
        description: "FK -> WarrantyClaim.id; the claim this replacement line belongs to"
      - name: component_code
        type: string
        source: input
        description: "Replacement component or tool code requested on this line"
      - name: component_list_price_cents
        type: integer
        source: input
        description: "List price of the replacement component in integer cents"
        constraints: ">= 1"
      - name: quantity
        type: integer
        source: input
        description: "Units of the component requested"
        constraints: ">= 1"
      - name: line_reserve_cents
        type: integer
        source: computed
        description: "round_half_up(component_list_price_cents * quantity * CHANNEL_RESERVE_PCT * WARRANTY_TIER_FACTOR) in integer cents"

  - name: CounterfeitReport
    parent: ToolSku
    common_fields: true
    fields:
      - name: sku_id
        type: string
        source: input
        description: "FK -> ToolSku.id; the genuine SKU being counterfeited"
      - name: channel_name
        type: string
        source: input
        description: "Secondary marketplace where the listing was found"
      - name: seller_handle
        type: string
        source: input
        description: "Seller identifier on the secondary channel"
      - name: evidence_grade
        type: enum
        source: input
        description: "Strength of the counterfeit evidence collected"
        constraints: "WEAK | MODERATE | STRONG"
      - name: unit_estimate
        type: integer
        source: input
        description: "Estimated counterfeit units in circulation from this listing"
        constraints: ">= 0"
      - name: risk_points
        type: integer
        source: computed
        description: "Brand-risk points contributed once CONFIRMED; frozen at creation from the SKU's channel exposure"
      - name: status
        type: enum
        source: system
        description: "Investigation state"
        default: OPEN
        constraints: "OPEN | CONFIRMED | DISMISSED"
      - name: confirmation_note
        type: string
        source: system
        description: "Analyst note recorded at confirmation"
        default: null
      - name: dismissal_note
        type: string
        source: system
        description: "Analyst note recorded at dismissal"
        default: null

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---- ProductionLot: PARALLEL dimensions (process_status x cert_status) ----
  - entity: ProductionLot
    dimension: process_status
    initial_state: FORGED
    terminal_states: []
    note: |
      Routing dimension. Evolves independently of cert_status except that the
      cert-dimension rework transition regresses this dimension to MACHINED.
    transitions:
      - from: FORGED
        to: HEAT_TREATED
        trigger: "POST /toolworks/production-lots/{id}/advance with to_process_status=HEAT_TREATED"
        actor: ProductionPlanner
        preconditions:
          - "lot.process_status == FORGED"
          - "lot.disposition == IN_PROCESS (a QUARANTINED lot cannot advance) else ERR_LOT_QUARANTINED"
          - "at least one FurnaceCampaign with lot_id == lot.id has status == COMPLETED, else ERR_HEAT_TREAT_NOT_COMPLETED"
        side_effects:
          - "lot.process_status = HEAT_TREATED"
          - "lot.updated_at refreshed; lot.version += 1"
      - from: HEAT_TREATED
        to: MACHINED
        trigger: "POST /toolworks/production-lots/{id}/advance with to_process_status=MACHINED"
        actor: ProductionPlanner
        preconditions:
          - "lot.process_status == HEAT_TREATED"
          - "lot.disposition == IN_PROCESS"
        side_effects:
          - "lot.process_status = MACHINED"
          - "lot.version += 1"
      - from: MACHINED
        to: PLATED
        trigger: "POST /toolworks/production-lots/{id}/advance with to_process_status=PLATED"
        actor: ProductionPlanner
        preconditions:
          - "lot.process_status == MACHINED"
          - "lot.disposition == IN_PROCESS"
        side_effects:
          - "lot.process_status = PLATED"
          - "lot.version += 1"
      - from: PLATED
        to: ASSEMBLED
        trigger: "POST /toolworks/production-lots/{id}/advance with to_process_status=ASSEMBLED"
        actor: ProductionPlanner
        preconditions:
          - "lot.process_status == PLATED"
          - "lot.disposition == IN_PROCESS"
        side_effects:
          - "lot.process_status = ASSEMBLED"
          - "lot.version += 1"
      - from: PLATED
        to: MACHINED
        trigger: "POST /toolworks/production-lots/{id}/rework (cert-dimension rework regresses the routing dimension)"
        actor: QualityEngineer
        preconditions:
          - "lot.cert_status == REJECTED"
          - "lot.rework_cycle_count < REWORK_LIMIT else ERR_REWORK_LIMIT_EXCEEDED"
        side_effects:
          - "lot.process_status = MACHINED (re-machine and re-plate the lot)"
        note: "Cycle: MACHINED -> PLATED -> MACHINED. Applies when process_status is PLATED at rework time."
      - from: ASSEMBLED
        to: MACHINED
        trigger: "POST /toolworks/production-lots/{id}/rework (cert-dimension rework regresses the routing dimension)"
        actor: QualityEngineer
        preconditions:
          - "lot.cert_status == REJECTED"
          - "lot.rework_cycle_count < REWORK_LIMIT else ERR_REWORK_LIMIT_EXCEEDED"
        side_effects:
          - "lot.process_status = MACHINED (tear down the assembly, re-machine and re-plate)"
        note: "Cycle: MACHINED -> ... -> ASSEMBLED -> MACHINED. Applies when process_status is ASSEMBLED at rework time."

  - entity: ProductionLot
    dimension: cert_status
    initial_state: DRAFT
    terminal_states: [CERTIFIED]
    note: |
      Certification dossier dimension with a revision cycle
      DRAFT -> IN_TEST -> REJECTED -> DRAFT. Independent of process_status:
      a lot may be ASSEMBLED while still DRAFT, or IN_TEST while only PLATED.
    transitions:
      - from: DRAFT
        to: IN_TEST
        trigger: "system, on the first successful POST /toolworks/test-runs for this lot while cert_status == DRAFT"
        actor: system
        preconditions:
          - "lot.cert_status == DRAFT"
        side_effects:
          - "lot.cert_status = IN_TEST"
          - "lot.version += 1"
        note: "Auto-transition; scheduling a test opens the dossier."
      - from: IN_TEST
        to: CERTIFIED
        trigger: "POST /toolworks/production-lots/{id}/certify"
        actor: QualityEngineer
        preconditions:
          - "lot.cert_status == IN_TEST else ERR_LOT_CERT_STATE_INVALID"
          - "lot.process_status == ASSEMBLED else ERR_LOT_PROCESS_STATE_INVALID"
          - "no TestRun with lot_id == lot.id has status == FAILED, else ERR_FAILED_TEST_PRESENT"
          - "for every test_type in MANDATORY_TESTS[sku.tool_family] there is at least one TestRun with lot_id == lot.id and status == PASSED, else ERR_MANDATORY_TEST_MISSING"
          - "lot.hardness_index_pooled >= HARDNESS_MIN_HRC[sku.alloy_grade] + CHANNEL_HARDNESS_MARGIN[sku.channel], else ERR_HARDNESS_MARGIN_NOT_MET"
        side_effects:
          - "lot.cert_status = CERTIFIED"
          - "lot.certified_at = logical clock now"
          - "lot.hardness_index_pooled and lot.hardness_index_sample recomputed and frozen per calculations.lot_hardness_index"
          - "lot.version += 1"
      - from: IN_TEST
        to: REJECTED
        trigger: "system, on POST /toolworks/test-runs/{id}/results that resolves a mandatory run to FAILED (cascade link 2 of transitive_cascade/mandatory_test_failure)"
        actor: system
        preconditions:
          - "the resolved TestRun.mandatory == true and its status became FAILED"
          - "lot.cert_status == IN_TEST"
        side_effects:
          - "lot.cert_status = REJECTED"
          - "lot.disposition = QUARANTINED"
          - "cascade link 3a: every FurnaceCampaign with lot_id == lot.id and status == SCHEDULED becomes RELEASED (its furnace window is freed), processed in created_at ASC order"
          - "cascade link 3b: every other TestRun with lot_id == lot.id and status == SCHEDULED becomes VOID with void_reason = 'CASCADE_LOT_REJECTED', returning its specimens to lot.specimens_available, processed in created_at ASC order"
          - "lot.version += 1"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /toolworks/production-lots/{id}/rework"
        actor: QualityEngineer
        preconditions:
          - "lot.cert_status == REJECTED else ERR_LOT_CERT_STATE_INVALID"
          - "lot.rework_cycle_count < REWORK_LIMIT else ERR_REWORK_LIMIT_EXCEEDED"
        side_effects:
          - "lot.cert_status = DRAFT"
          - "lot.disposition = IN_PROCESS (quarantine lifted)"
          - "lot.rework_cycle_count += 1"
          - "lot.process_status regresses to MACHINED (see the process_status dimension)"
          - "lot.hardness_index_sample = null and lot.hardness_index_pooled = null (dossier reset)"
          - "lot.version += 1"
        note: "Revision cycle: the lot re-enters IN_TEST when a new TestRun is scheduled."

  - entity: ProductionLot
    dimension: disposition
    initial_state: IN_PROCESS
    terminal_states: []
    transitions:
      - from: IN_PROCESS
        to: RELEASED
        trigger: "POST /toolworks/production-lots/{id}/release"
        actor: ProductionPlanner
        preconditions:
          - "lot.disposition != QUARANTINED else ERR_LOT_QUARANTINED (validations priority 402)"
          - "lot.disposition == IN_PROCESS else ERR_LOT_ALREADY_DISPOSITIONED (validations priority 403)"
          - "request expected_sku_version == sku.version else ERR_STALE_SKU_VERSION (validations priority 450, see concurrency_rules.lot-release-stale-sku)"
          - "lot.cert_status == CERTIFIED else ERR_LOT_NOT_CERTIFIED (validations priority 514)"
        side_effects:
          - "lot.disposition = RELEASED"
          - "sku.units_received_total += lot.unit_count"
          - "sku.units_on_hand += lot.unit_count"
          - "increments ToolSku.version by 1"
          - "lot.version += 1"
      - from: IN_PROCESS
        to: QUARANTINED
        trigger: "system, cascade from the cert dimension IN_TEST -> REJECTED transition"
        actor: system
        preconditions:
          - "lot.cert_status transitioned to REJECTED"
        side_effects:
          - "lot.disposition = QUARANTINED"
      - from: QUARANTINED
        to: IN_PROCESS
        trigger: "POST /toolworks/production-lots/{id}/rework"
        actor: QualityEngineer
        preconditions:
          - "lot.cert_status == REJECTED"
          - "lot.rework_cycle_count < REWORK_LIMIT"
        side_effects:
          - "lot.disposition = IN_PROCESS"

  # ---- HeatTreatFurnace ----
  - entity: HeatTreatFurnace
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: MAINTENANCE
        trigger: "POST /toolworks/heat-treat-furnaces/{id}/status with status=MAINTENANCE"
        actor: ProductionPlanner
        preconditions:
          - "furnace.status == AVAILABLE else ERR_FURNACE_STATUS_UNCHANGED"
        side_effects:
          - "furnace.status = MAINTENANCE (no new FurnaceCampaign may be booked)"
          - "furnace.version += 1"
      - from: MAINTENANCE
        to: AVAILABLE
        trigger: "POST /toolworks/heat-treat-furnaces/{id}/status with status=AVAILABLE"
        actor: ProductionPlanner
        preconditions:
          - "furnace.status == MAINTENANCE else ERR_FURNACE_STATUS_UNCHANGED"
        side_effects:
          - "furnace.status = AVAILABLE"
          - "furnace.version += 1"

  # ---- FurnaceCampaign ----
  - entity: FurnaceCampaign
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, RELEASED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /toolworks/furnace-campaigns/{id}/complete"
        actor: ProductionPlanner
        preconditions:
          - "campaign.status == SCHEDULED else ERR_CAMPAIGN_STATE_INVALID"
          - "soak_minutes >= MIN_SOAK_MINUTES else ERR_SOAK_TIME_TOO_SHORT"
        side_effects:
          - "campaign.status = COMPLETED"
          - "campaign.soak_minutes = request soak_minutes"
          - "campaign.version += 1"
        note: "The furnace window remains occupied after completion; COMPLETED campaigns still block overlapping bookings."
      - from: SCHEDULED
        to: RELEASED
        trigger: "system, cascade from ProductionLot cert_status IN_TEST -> REJECTED"
        actor: system
        preconditions:
          - "campaign.status == SCHEDULED"
          - "campaign.lot_id references a lot whose disposition just became QUARANTINED"
        side_effects:
          - "campaign.status = RELEASED (the interval no longer blocks overlapping bookings)"
          - "campaign.version += 1"

  # ---- TestRun ----
  - entity: TestRun
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED, VOID]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /toolworks/test-runs/{id}/results where calculations.test_run_outcome yields PASS"
        actor: QualityEngineer
        preconditions:
          - "run.status == SCHEDULED else ERR_TEST_RUN_STATE_INVALID"
          - "len(readings) == run.specimen_count else ERR_READING_COUNT_MISMATCH"
        side_effects:
          - "run.status = PASSED; run.readings, mean_reading, governing_statistic, requirement_value, result_margin_pct stored"
          - "lot.specimens_committed -= run.specimen_count; lot.specimens_consumed += run.specimen_count"
          - "when run.test_type == HARDNESS: recompute lot.hardness_index_sample and lot.hardness_index_pooled per calculations.lot_hardness_index"
          - "run.version += 1; lot.version += 1"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /toolworks/test-runs/{id}/results where calculations.test_run_outcome yields FAIL"
        actor: QualityEngineer
        preconditions:
          - "run.status == SCHEDULED else ERR_TEST_RUN_STATE_INVALID"
          - "len(readings) == run.specimen_count else ERR_READING_COUNT_MISMATCH"
        side_effects:
          - "run.status = FAILED; readings and derived statistics stored"
          - "lot.specimens_committed -= run.specimen_count; lot.specimens_consumed += run.specimen_count"
          - "cascade link 2: when run.mandatory == true and lot.cert_status == IN_TEST, the lot's cert dimension transitions IN_TEST -> REJECTED (which itself cascades to FurnaceCampaign and sibling TestRun rows)"
          - "run.version += 1; lot.version += 1"
        note: "Divergent side-effect set versus the PASSED branch: FAILED never recomputes the hardness indices and additionally triggers the lot-rejection cascade."
      - from: SCHEDULED
        to: VOID
        trigger: "POST /toolworks/test-runs/{id}/void, or system cascade from ProductionLot cert_status IN_TEST -> REJECTED"
        actor: QualityEngineer | system
        preconditions:
          - "run.status == SCHEDULED else ERR_TEST_RUN_STATE_INVALID"
        side_effects:
          - "run.status = VOID; run.void_reason = operator text, or 'CASCADE_LOT_REJECTED' when placed by the cascade"
          - "lot.specimens_committed -= run.specimen_count; lot.specimens_available += run.specimen_count (compensating action of scheduling)"
          - "the run stops occupying its chamber interval for calculations.chamber_capacity_occupancy"
          - "run.version += 1; lot.version += 1"

  # ---- PackConfiguration ----
  - entity: PackConfiguration
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /toolworks/pack-configurations/{id}/approve"
        actor: ChannelManager
        preconditions:
          - "pack.status == DRAFT else ERR_PACK_STATE_INVALID (validations priority 406)"
          - "every member SKU has at least one ProductionLot with cert_status == CERTIFIED and disposition == RELEASED, else ERR_MEMBER_SKU_NOT_CERTIFIED (validations priority 473; vacuously satisfied when the pack has no members)"
          - "every member SKU has warranty_posture == OPEN else ERR_MEMBER_SKU_RESTRICTED (validations priority 474)"
          - "the pack satisfies PACK_SHAPE_RULES[pack.pack_type] else ERR_PACK_CONFIG_INVALID (validations priority 922)"
        side_effects:
          - "pack.member_subtotal_cents, security_surcharge_cents, pack_total_cents computed per calculations.pack_pricing"
          - "pack.status = APPROVED"
          - "pack.version += 1"
      - from: APPROVED
        to: WITHDRAWN
        trigger: "POST /toolworks/pack-configurations/{id}/withdraw"
        actor: ChannelManager
        preconditions:
          - "pack.status == APPROVED else ERR_PACK_STATE_INVALID"
        side_effects:
          - "pack.status = WITHDRAWN"
          - "pack.version += 1"
      - from: APPROVED
        to: WITHDRAWN
        trigger: "system, cascade when a member SKU's warranty_posture becomes SUSPENDED"
        actor: system
        preconditions:
          - "pack.status == APPROVED"
          - "pack has a PackMember whose sku_id is the SKU whose warranty_posture just became SUSPENDED"
        side_effects:
          - "pack.status = WITHDRAWN"
          - "pack.version += 1"
        note: "Processed in created_at ASC order across the affected packs."

  # ---- WarrantyClaim: BRANCHING with a FRAUD_HOLD cycle ----
  - entity: WarrantyClaim
    initial_state: SUBMITTED
    terminal_states: [FULFILLED, DENIED, DENIED_FRAUD, REVOKED]
    transitions:
      - from: SUBMITTED
        to: FRAUD_HOLD
        trigger: "POST /toolworks/warranty-claims/{id}/hold"
        actor: WarrantyAdministrator
        preconditions:
          - "claim.status == SUBMITTED else ERR_CLAIM_STATE_INVALID"
        side_effects:
          - "claim.status = FRAUD_HOLD; claim.hold_reason = request hold_reason; claim.held_by_user_id = X-User-ID"
          - "program.open_hold_count recomputed (+1); program.version += 1"
          - "claimant.fraud_risk_score_adjudication recomputed per calculations.claimant_fraud_score variant ADJUDICATION"
          - "claim.version += 1"
      - from: SUBMITTED
        to: FRAUD_HOLD
        trigger: "system, cascade link 4 from ToolSku.warranty_posture leaving OPEN"
        actor: system
        preconditions:
          - "claim.status == SUBMITTED"
          - "claim.sku_id is the SKU whose warranty_posture just changed from OPEN to RESTRICTED or SUSPENDED"
        side_effects:
          - "claim.status = FRAUD_HOLD; claim.hold_reason = 'COUNTERFEIT_POSTURE'; claim.held_by_user_id = null"
          - "program.open_hold_count recomputed; program.version += 1"
          - "cascade link 5: claimant.fraud_risk_score_adjudication recomputed, now including COUNTERFEIT_LINK_PENALTY for this claim"
          - "claim.version += 1"
        note: "Processed in created_at ASC order across the affected claims."
      - from: FRAUD_HOLD
        to: SUBMITTED
        trigger: "POST /toolworks/warranty-claims/{id}/clear-hold"
        actor: WarrantyAdministrator
        preconditions:
          - "claim.status == FRAUD_HOLD else ERR_CLAIM_STATE_INVALID"
        side_effects:
          - "claim.status = SUBMITTED; claim.fraud_cleared = true; claim.hold_reason = null"
          - "claim.held_by_user_id is RETAINED (segregation of duties at approval depends on it)"
          - "program.open_hold_count recomputed (-1); program.version += 1"
          - "claimant.fraud_risk_score_adjudication recomputed"
          - "claim.version += 1"
        note: "Cycle: SUBMITTED -> FRAUD_HOLD -> SUBMITTED, repeatable."
      - from: FRAUD_HOLD
        to: DENIED_FRAUD
        trigger: "POST /toolworks/warranty-claims/{id}/deny-fraud"
        actor: WarrantyAdministrator
        preconditions:
          - "claim.status == FRAUD_HOLD else ERR_CLAIM_STATE_INVALID (validations priority 407)"
        side_effects:
          - "claim.status = DENIED_FRAUD; claim.denial_code = request denial_code"
          - "program.open_hold_count recomputed (-1); program.version += 1"
          - "claimant.fraud_risk_score_adjudication recomputed"
          - "claim.version += 1"
        note: "Divergent branch: /deny-fraud out of FRAUD_HOLD lands in DENIED_FRAUD and decrements open_hold_count; /deny out of SUBMITTED lands in DENIED and does not. The two verbs are not interchangeable: /deny on a FRAUD_HOLD claim and /deny-fraud on a SUBMITTED claim both return ERR_CLAIM_STATE_INVALID."
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /toolworks/warranty-claims/{id}/deny"
        actor: WarrantyAdministrator
        preconditions:
          - "claim.status == SUBMITTED"
        side_effects:
          - "claim.status = DENIED; claim.denial_code = request denial_code"
          - "claimant.fraud_risk_score_adjudication recomputed"
          - "claim.version += 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /toolworks/warranty-claims/{id}/approve"
        actor: WarrantyAdministrator
        preconditions:
          - "claim.status == SUBMITTED else ERR_CLAIM_STATE_INVALID (validations priority 407)"
          - "request expected_program_version == program.version else ERR_STALE_PROGRAM_VERSION (validations priority 451, see concurrency_rules.claim-approve-stale-program)"
          - "sku.warranty_posture == OPEN else ERR_SKU_WARRANTY_RESTRICTED (validations priority 471)"
          - "sku.units_on_hand >= claim.replacement_unit_count else ERR_REPLACEMENT_STOCK_INSUFFICIENT (validations priority 710)"
          - "program.reserve_balance_cents >= claim.reserve_charge_cents else ERR_RESERVE_INSUFFICIENT (validations priority 800)"
          - "claimant.fraud_risk_score_adjudication < program.fraud_score_threshold OR claim.fraud_cleared == true, else ERR_FRAUD_SCORE_TOO_HIGH (validations priority 810)"
          - "claim.line_count >= 1 else ERR_CLAIM_HAS_NO_LINES (validations priority 900)"
          - "X-User-ID != claim.held_by_user_id when held_by_user_id is not null, else ERR_SEGREGATION_OF_DUTIES (validations priority 902)"
        side_effects:
          - "claim.reserve_charge_cents and claim.replacement_unit_count frozen per calculations.claim_reserve_charge"
          - "claim.status = APPROVED"
          - "sku.units_on_hand -= claim.replacement_unit_count; sku.units_reserved += claim.replacement_unit_count; sku.version += 1"
          - "program.reserve_balance_cents recomputed per calculations.reserve_ledger; increments WarrantyProgram.version by 1"
          - "claimant.fraud_risk_score_adjudication recomputed"
          - "claim.version += 1"
      - from: APPROVED
        to: FULFILLED
        trigger: "POST /toolworks/warranty-claims/{id}/fulfill"
        actor: WarrantyAdministrator
        preconditions:
          - "claim.status == APPROVED else ERR_CLAIM_STATE_INVALID"
        side_effects:
          - "claim.status = FULFILLED; claim.shipment_ref = request shipment_ref"
          - "sku.units_reserved -= claim.replacement_unit_count; sku.units_shipped += claim.replacement_unit_count; sku.version += 1"
          - "program.reserve_balance_cents unchanged (the charge stays counted while status is FULFILLED)"
          - "claim.version += 1"
      - from: APPROVED
        to: REVOKED
        trigger: "POST /toolworks/warranty-claims/{id}/revoke"
        actor: WarrantyAdministrator
        preconditions:
          - "claim.status == APPROVED else ERR_CLAIM_STATE_INVALID"
        side_effects:
          - "claim.status = REVOKED; claim.revocation_reason = request revocation_reason"
          - "compensation: sku.units_reserved -= claim.replacement_unit_count; sku.units_on_hand += claim.replacement_unit_count; sku.version += 1"
          - "compensation: program.reserve_balance_cents recomputed (the charge leaves the counted set); program.version += 1"
          - "claim.reserve_charge_cents and replacement_unit_count are NOT zeroed (audit trail)"
          - "claimant.fraud_risk_score_adjudication recomputed (REVOKED claims leave the ADJUDICATION input set)"
          - "claim.version += 1"
      - from: FULFILLED
        to: REVOKED
        trigger: "POST /toolworks/warranty-claims/{id}/revoke"
        actor: WarrantyAdministrator
        preconditions:
          - "claim.status == FULFILLED else ERR_CLAIM_STATE_INVALID"
        side_effects:
          - "claim.status = REVOKED; claim.revocation_reason = request revocation_reason"
          - "compensation: sku.units_shipped -= claim.replacement_unit_count; sku.units_on_hand += claim.replacement_unit_count; sku.version += 1"
          - "compensation: program.reserve_balance_cents recomputed; program.version += 1"
          - "claimant.fraud_risk_score_adjudication recomputed"
          - "claim.version += 1"
        note: "Compensating branch differs from the APPROVED -> REVOKED branch by which unit bucket is debited (units_shipped vs units_reserved)."

  # ---- Claimant ----
  - entity: Claimant
    initial_state: ACTIVE
    terminal_states: [BLOCKED]
    transitions:
      - from: ACTIVE
        to: BLOCKED
        trigger: "POST /toolworks/claimants/{id}/block"
        actor: PlatformAdmin
        preconditions:
          - "claimant.status == ACTIVE else ERR_CLAIMANT_STATE_INVALID"
        side_effects:
          - "claimant.status = BLOCKED (no new claim intake)"
          - "claimant.version += 1"

  # ---- CounterfeitReport ----
  - entity: CounterfeitReport
    initial_state: OPEN
    terminal_states: [CONFIRMED, DISMISSED]
    transitions:
      - from: OPEN
        to: CONFIRMED
        trigger: "POST /toolworks/counterfeit-reports/{id}/confirm"
        actor: BrandProtectionAnalyst
        preconditions:
          - "report.status == OPEN else ERR_REPORT_STATE_INVALID"
        side_effects:
          - "cascade link 1: report.status = CONFIRMED; report.confirmation_note stored; report.version += 1"
          - "cascade link 2: because the report became CONFIRMED, sku.brand_risk_score and sku.confirmed_counterfeit_count are recomputed per calculations.brand_risk_rollup; sku.version += 1"
          - "cascade link 3: because brand_risk_score crossed a POSTURE_THRESHOLD, sku.warranty_posture is re-derived (OPEN -> RESTRICTED at >= 40, -> SUSPENDED at >= 85)"
          - "cascade link 4: because warranty_posture left OPEN, every WarrantyClaim with sku_id == sku.id and status == SUBMITTED transitions to FRAUD_HOLD with hold_reason 'COUNTERFEIT_POSTURE' and held_by_user_id null, in created_at ASC order; each affected programme's open_hold_count and version update"
          - "cascade link 5: because those claims entered FRAUD_HOLD, each affected Claimant.fraud_risk_score_adjudication is recomputed and now carries COUNTERFEIT_LINK_PENALTY per claim on a non-OPEN SKU"
          - "additionally, when warranty_posture became SUSPENDED, every PackConfiguration with status == APPROVED holding this SKU as a member transitions to WITHDRAWN"
      - from: OPEN
        to: DISMISSED
        trigger: "POST /toolworks/counterfeit-reports/{id}/dismiss"
        actor: BrandProtectionAnalyst
        preconditions:
          - "report.status == OPEN else ERR_REPORT_STATE_INVALID"
        side_effects:
          - "report.status = DISMISSED; report.dismissal_note stored"
          - "sku.brand_risk_score unchanged (DISMISSED reports never enter the rollup)"
          - "report.version += 1"
        note: "Divergent branch: DISMISSED fires no rollup, no posture change and no claim cascade."

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent entity's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: lot-release-stale-sku
    parent_entity: ToolSku
    write_endpoint: "POST /toolworks/production-lots/{id}/release"
    occ_field: "expected_sku_version"
    description: |
      Releasing a certified lot into a SKU's finished-goods inventory is rejected
      when the request carries an expected_sku_version that no longer equals the
      SKU's current version. Releasing a second, different lot is legitimate
      product behaviour (inventory simply accumulates), so the operation is not
      excluded by any state precondition; the stale-version check is what makes
      the writer confirm it observed the inventory totals it is adding to.
    error_id: ERR_STALE_SKU_VERSION
    http_status: 412

  - rule_id: claim-approve-stale-program
    parent_entity: WarrantyProgram
    write_endpoint: "POST /toolworks/warranty-claims/{id}/approve"
    occ_field: "expected_program_version"
    description: |
      Approving a claim against a warranty programme is rejected when the request
      carries an expected_program_version that no longer equals the programme's
      current version. Approving a second, different claim against the same
      programme is legitimate product behaviour, so no state precondition covers
      it; the stale-version check forces the administrator to have observed the
      reserve balance that the approval draws down.
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: proof_torque_requirement
    trigger: "on POST /toolworks/tool-skus and on PATCH /toolworks/tool-skus/{id}; the value is additionally pinned onto ProductionLot.proof_torque_required_nm at POST /toolworks/production-lots"
    algorithm: threshold
    formula: |
      raw_nm = BASE_TORQUE_PER_MM[sku.tool_family] * sku.nominal_size_mm * ALLOY_FACTOR[sku.alloy_grade]
      size_tier_add = 0.0  if sku.nominal_size_mm <= 10
                      1.5  if 10 <  sku.nominal_size_mm <= 19
                      3.0  if sku.nominal_size_mm >  19
      adjusted_nm = raw_nm * CHANNEL_FACTOR[sku.channel] + size_tier_add * sku.nominal_size_mm
      proof_torque_required_nm = round_half_up(min(CEIL_NM, max(FLOOR_NM, adjusted_nm)), 1)
      # Evaluation order is pinned: raw -> channel scaling -> additive size-tier term
      # -> floor/ceiling clamp -> rounding. Applying the clamp before the additive
      # term, or rounding before the clamp, yields a different number.
    input_set: "Only the SKU's own tool_family, nominal_size_mm, alloy_grade and channel. No lot or test data participates."
    constants:
      BASE_TORQUE_PER_MM: { WRENCH: 4.2, SOCKET: 6.5, PLIER: 2.8 }
      ALLOY_FACTOR: { CR_V: 1.00, CR_MO: 1.15, S2: 1.30 }
      CHANNEL_FACTOR: { BRANDED: 1.10, PRIVATE_LABEL: 1.00, PROFESSIONAL: 1.25 }
      SIZE_TIER_BREAKS: { small_max_mm: 10, mid_max_mm: 19 }
      SIZE_TIER_ADD: { small: 0.0, mid: 1.5, large: 3.0 }
      FLOOR_NM: 12.0
      CEIL_NM: 900.0
    precision: "1 decimal place, round_half_up"
    variants: []
    note: |
      Combinatorial mode (a): four inputs interacting non-linearly through a
      tiered additive term plus a min/max clamp. Worked values used by the design
      files: WRENCH/17/CR_MO/BRANDED = 115.8; WRENCH/17/CR_MO/PROFESSIONAL = 128.1;
      SOCKET/19/CR_V/BRANDED = 164.4; SOCKET/20/CR_V/BRANDED = 203.0.

  - name: lot_hardness_index
    trigger: "on POST /toolworks/test-runs/{id}/results for a HARDNESS run that resolves to PASSED, and again (frozen) on POST /toolworks/production-lots/{id}/certify"
    algorithm: weighted_scoring
    formula: |
      qualifying_runs = TestRun rows where lot_id == lot.id
                        AND test_type == 'HARDNESS'
                        AND status == 'PASSED'
                        ordered by created_at ASC
      # VARIANT SAMPLE_MEAN (per-run rounding, unweighted):
      run_mean[i]              = round_half_up(mean(qualifying_runs[i].readings), 1)
      hardness_index_sample    = round_half_up(mean(run_mean over all i), 2)
      # VARIANT POOLED (no per-run rounding, specimen-weighted):
      pooled_readings          = concatenation of qualifying_runs[i].readings in created_at ASC order
      hardness_index_pooled    = round_half_up(mean(pooled_readings), 2)
      # Both variants are stored on every recompute. The certification gate at
      # §1.2 uses POOLED only.
    input_set: "HARDNESS TestRun rows on the lot with status == PASSED. Rows in SCHEDULED, FAILED or VOID are excluded from BOTH variants. Both variants are reset to null by the rework transition."
    constants:
      HARDNESS_MIN_HRC: { CR_V: 47.0, CR_MO: 50.0, S2: 55.0 }
      CHANNEL_HARDNESS_MARGIN: { BRANDED: 1.0, PRIVATE_LABEL: 0.0, PROFESSIONAL: 2.5 }
    precision: "run_mean to 1 decimal, both indices to 2 decimals, round_half_up throughout"
    variants:
      - name: SAMPLE_MEAN
        when: "Provisional in-process reading; stored on ProductionLot.hardness_index_sample and shown while cert_status is IN_TEST"
        difference: "Rounds each run's mean to 1 decimal FIRST, then averages the run means with equal weight regardless of specimen_count. A 1-specimen run counts as much as a 9-specimen run."
      - name: POOLED
        when: "Final certification reading; stored on ProductionLot.hardness_index_pooled and used by the certify gate"
        difference: "Pools every raw reading across runs and takes one unrounded mean, so each run's influence is proportional to its specimen_count. For runs [50.0] and nine readings of 53.0 the variants give 51.50 vs 52.70."
    note: "Rule 1 dual-variant instance on the ProductionLot domain."

  - name: test_run_outcome
    trigger: "on POST /toolworks/test-runs/{id}/results"
    algorithm: threshold
    formula: |
      readings = request readings (length MUST equal run.specimen_count)
      mean_reading = round_half_up(mean(readings), 1)
      switch run.test_type:
        HARDNESS:        governing = mean_reading                     ; requirement = HARDNESS_MIN_HRC[sku.alloy_grade]  ; comparison = AT_LEAST
        PROOF_TORQUE:    governing = min(readings)                    ; requirement = lot.proof_torque_required_nm       ; comparison = AT_LEAST
        SALT_SPRAY:      governing = min(readings)                    ; requirement = SALT_SPRAY_MIN_HOURS[sku.channel]  ; comparison = AT_LEAST
        MECHANISM_CYCLE: governing = min(readings)                    ; requirement = MECHANISM_MIN_CYCLES               ; comparison = AT_LEAST
        DIMENSIONAL:     governing = max(abs(r) for r in readings)    ; requirement = DIM_TOLERANCE_MM                   ; comparison = AT_MOST
      outcome = PASS if (comparison == AT_LEAST and governing >= requirement)
                       or (comparison == AT_MOST and governing <= requirement)
                else FAIL
      result_margin_pct = round_half_up(
          ((governing - requirement) / requirement * 100) if comparison == AT_LEAST
          else ((requirement - governing) / requirement * 100), 2)
    input_set: "Only the readings supplied on this request plus the requirement constants for the run's test_type, the lot's pinned proof_torque_required_nm and the SKU's alloy_grade / channel."
    constants:
      HARDNESS_MIN_HRC: { CR_V: 47.0, CR_MO: 50.0, S2: 55.0 }
      SALT_SPRAY_MIN_HOURS: { BRANDED: 96, PRIVATE_LABEL: 48, PROFESSIONAL: 168 }
      MECHANISM_MIN_CYCLES: 5000
      DIM_TOLERANCE_MM: 0.15
      MANDATORY_TESTS:
        WRENCH: [HARDNESS, PROOF_TORQUE, DIMENSIONAL, SALT_SPRAY]
        SOCKET: [HARDNESS, PROOF_TORQUE, DIMENSIONAL, SALT_SPRAY]
        PLIER: [HARDNESS, DIMENSIONAL, SALT_SPRAY, MECHANISM_CYCLE]
    precision: "mean_reading 1 decimal; result_margin_pct 2 decimals; round_half_up"
    variants: []
    note: |
      Boundary semantics are AT_LEAST (>=) for four test types and AT_MOST (<=)
      for DIMENSIONAL. A HARDNESS mean of exactly HARDNESS_MIN_HRC passes with
      result_margin_pct == 0.00. TestRun.mandatory == (test_type in
      MANDATORY_TESTS[sku.tool_family]).

  - name: specimen_ledger
    trigger: "on POST /toolworks/test-runs (commit), POST /toolworks/test-runs/{id}/results (consume), POST /toolworks/test-runs/{id}/void and the lot-rejection cascade (release)"
    algorithm: aggregation
    formula: |
      specimens_committed = sum(run.specimen_count for TestRun where lot_id == lot.id and status == 'SCHEDULED')
      specimens_consumed  = sum(run.specimen_count for TestRun where lot_id == lot.id and status in {'PASSED','FAILED'})
      specimens_available = lot.specimen_pool_total - specimens_committed - specimens_consumed
      # CONSERVED QUANTITY (specimen count, physical destructive-test material):
      #   lot.specimen_pool_total == specimens_available + specimens_committed + specimens_consumed
      # holds after every mutation, including the cascade that voids sibling runs.
      # VOID runs contribute to none of the three buckets, which is what makes
      # scheduling/voiding an exact forward/compensating pair.
    input_set: "TestRun rows on the lot, partitioned by status. VOID rows are excluded from every bucket."
    constants: {}
    precision: "integer counts"
    variants: []

  - name: furnace_window_occupancy
    trigger: "on POST /toolworks/furnace-campaigns"
    algorithm: interval_merge
    formula: |
      RAMP = RAMP_BUFFER_MINUTES minutes
      blocking = FurnaceCampaign rows where furnace_id == request.furnace_id
                 AND status in {'SCHEDULED','COMPLETED'}          # RELEASED rows never block
      conflict = EXISTS x in blocking such that
                   request.window_start < (x.window_end + RAMP)
                   AND x.window_start  < (request.window_end + RAMP)
      # Interval semantics: EXCLUSIVE occupancy (capacity 1) over half-open
      # [window_start, window_end) intervals, each expanded by a TRAILING ramp
      # buffer. Strict `<` on both sides means a new campaign starting exactly at
      # x.window_end + RAMP is accepted, while one starting a single minute
      # earlier is rejected.
      # buffered_end = window_end + RAMP is stored on the row for observability.
    input_set: "FurnaceCampaign rows on the same furnace whose status is SCHEDULED or COMPLETED. RELEASED rows are excluded, which is what makes the lot-rejection cascade free the window."
    constants:
      RAMP_BUFFER_MINUTES: 45
      MIN_SOAK_MINUTES: 60
    precision: "whole minutes, UTC"
    variants: []
    note: "Rule 8 instance on HeatTreatFurnace: exclusive occupancy with a trailing buffer."

  - name: chamber_capacity_occupancy
    trigger: "on POST /toolworks/test-runs where test_type == SALT_SPRAY"
    algorithm: interval_merge
    formula: |
      blocking = TestRun rows where chamber_id == request.chamber_id
                 AND status in {'SCHEDULED','PASSED','FAILED'}     # VOID rows never occupy
                 AND x.window_start < request.window_end
                 AND request.window_start < x.window_end           # half-open, touching endpoints do NOT overlap
      probe_instants = { request.window_start }
                       UNION { x.window_start for x in blocking if x.window_start > request.window_start }
      for each t in probe_instants:
        occupancy(t) = request.specimen_count
                       + sum(x.specimen_count for x in blocking if x.window_start <= t < x.window_end)
      conflict = max(occupancy(t) for t in probe_instants) > chamber.coupon_capacity
      # Interval semantics: AGGREGATE ADDITIVE capacity. Overlap is permitted up
      # to coupon_capacity coupons at every instant, there is NO buffer, and a run
      # starting exactly when another ends is always accepted. Comparison is
      # strict `>` so occupancy exactly equal to coupon_capacity is accepted.
    input_set: "TestRun rows in the same chamber with status SCHEDULED, PASSED or FAILED whose half-open interval intersects the requested interval. VOID rows are excluded."
    constants: {}
    precision: "integer coupon counts; instants compared at whole-minute UTC resolution"
    variants: []
    note: "Rule 8 instance on SaltSprayChamber: additive aggregate capacity, no buffer — geometrically different from furnace_window_occupancy."

  - name: brand_risk_rollup
    trigger: "risk_points on POST /toolworks/counterfeit-reports; brand_risk_score / warranty_posture / confirmed_counterfeit_count on POST /toolworks/counterfeit-reports/{id}/confirm"
    algorithm: threshold
    formula: |
      # frozen at report creation from the SKU's channel exposure at that moment
      report.risk_points = round_half_up(
          (EVIDENCE_POINTS[report.evidence_grade] + unit_scale_points) * CHANNEL_EXPOSURE[sku.channel])
      where unit_scale_points = 0  if report.unit_estimate <= 50
                                8  if 50 <  report.unit_estimate <= 500
                                20 if report.unit_estimate >  500
      confirmed = CounterfeitReport rows where sku_id == sku.id AND status == 'CONFIRMED'
      sku.confirmed_counterfeit_count = count(confirmed)
      sku.brand_risk_score = min(100, sum(r.risk_points for r in confirmed))
      sku.warranty_posture = SUSPENDED  if sku.brand_risk_score >= POSTURE_SUSPEND_AT
                             RESTRICTED if sku.brand_risk_score >= POSTURE_RESTRICT_AT
                             OPEN       otherwise
    input_set: "CounterfeitReport rows on the SKU with status == CONFIRMED. OPEN and DISMISSED rows contribute nothing."
    constants:
      EVIDENCE_POINTS: { WEAK: 5, MODERATE: 15, STRONG: 30 }
      UNIT_SCALE_BREAKS: { low_max: 50, mid_max: 500 }
      UNIT_SCALE_POINTS: { low: 0, mid: 8, high: 20 }
      CHANNEL_EXPOSURE: { BRANDED: 1.0, PRIVATE_LABEL: 0.6, PROFESSIONAL: 0.8 }
      POSTURE_RESTRICT_AT: 40
      POSTURE_SUSPEND_AT: 85
    precision: "integer points, round_half_up on the per-report product"
    variants: []
    note: "Boundary is inclusive (>=). A PROFESSIONAL SKU whose confirmed reports total exactly 40 is RESTRICTED; 39 is OPEN."

  - name: claimant_fraud_score
    trigger: "INTAKE variant on POST /toolworks/warranty-claims; ADJUDICATION variant on POST /toolworks/warranty-claims/{id}/hold, /clear-hold, /deny, /approve, /revoke and on the counterfeit-posture cascade hold"
    algorithm: weighted_scoring
    formula: |
      # ---- VARIANT INTAKE (rolling window, no counterfeit term) ----
      intake_set = WarrantyClaim rows where claimant_id == claimant.id
                   AND created_at >= (clock_now - CLAIM_WINDOW_DAYS days)
                   AND status in {SUBMITTED, FRAUD_HOLD, APPROVED, FULFILLED, DENIED, DENIED_FRAUD}
                   UNION { the claim being created }
      # ---- VARIANT ADJUDICATION (lifetime window, counterfeit term) ----
      adjudication_set = WarrantyClaim rows where claimant_id == claimant.id
                   AND status != 'REVOKED'          # revoked claims leave the set entirely
                   # no time window at all
      # ---- shared scoring core, applied to whichever set the variant selects ----
      allowance = PRO_ACCOUNT_ALLOWANCE if claimant.claimant_type == 'PRO_ACCOUNT' else 0
      dup_serials = sum over each distinct serial_code group g in the set of (count(g) - 1)
      restricted_links = count(c in the set where the ToolSku referenced by c.sku_id
                               has warranty_posture != 'OPEN')      # ADJUDICATION only; 0 for INTAKE
      score = min(100, max(0,
                  (count(set) - allowance) * BASE_POINTS_PER_CLAIM
                  + dup_serials * SERIAL_REPEAT_PENALTY
                  + restricted_links * COUNTERFEIT_LINK_PENALTY))
      # INTAKE result is written to Claimant.fraud_risk_score_intake and frozen on
      # the new claim as fraud_score_at_intake.
      # ADJUDICATION result is written to Claimant.fraud_risk_score_adjudication.
      # Auto-transition: when fraud_score_at_intake >= program.fraud_score_threshold
      # the newly created claim is persisted directly in FRAUD_HOLD with
      # hold_reason = 'INTAKE_FRAUD_SCORE' and held_by_user_id = null.
    input_set: "INTAKE: the claimant's claims created within the last CLAIM_WINDOW_DAYS days in any non-REVOKED status, plus the claim being created; the counterfeit term is NOT applied. ADJUDICATION: all of the claimant's claims in any status except REVOKED, with no time window, plus the counterfeit term."
    constants:
      CLAIM_WINDOW_DAYS: 365
      BASE_POINTS_PER_CLAIM: 9
      PRO_ACCOUNT_ALLOWANCE: 2
      SERIAL_REPEAT_PENALTY: 18
      COUNTERFEIT_LINK_PENALTY: 25
    precision: "integer score clamped to 0..100"
    variants:
      - name: INTAKE
        when: "Claim creation; gates the auto-hold at intake"
        difference: "Rolling 365-day window from the logical clock, and the COUNTERFEIT_LINK_PENALTY term is omitted entirely."
      - name: ADJUDICATION
        when: "Any adjudication action on a claim; gates ERR_FRAUD_SCORE_TOO_HIGH at approval"
        difference: "No time window (lifetime), REVOKED claims removed from the set, and COUNTERFEIT_LINK_PENALTY added for every claim whose SKU is not OPEN. For a CONSUMER with claims dated 2025-06-01, 2026-03-01 and 2026-08-01 on OPEN SKUs the variants give 18 vs 27."
    note: "Rule 1 dual-variant instance on the Claimant domain — a different entity domain from lot_hardness_index."

  - name: claim_reserve_charge
    trigger: "on POST /toolworks/warranty-claims/{id}/lines (recompute) and frozen on POST /toolworks/warranty-claims/{id}/approve"
    algorithm: aggregation
    formula: |
      lines = ClaimLine rows where claim_id == claim.id, ordered by created_at ASC
      # ROUNDING ORDER IS PINNED: round EACH line to whole cents, THEN sum.
      line_reserve_cents[i] = round_half_up(
          lines[i].component_list_price_cents * lines[i].quantity
          * CHANNEL_RESERVE_PCT[sku.channel] * WARRANTY_TIER_FACTOR[sku.warranty_tier])
      claim.reserve_charge_cents    = sum(line_reserve_cents[i] for all i)
      claim.replacement_unit_count  = sum(lines[i].quantity for all i)
      claim.line_count              = count(lines)
      # The FORBIDDEN alternative is
      #   round_half_up(sum(price*qty) * pct * factor)
      # which for lines (1099 x1), (2599 x1), (755 x3) on a BRANDED/LIFETIME SKU
      # yields 3697 instead of the correct 3696.
    input_set: "Every ClaimLine row on the claim, in created_at ASC order. Percentages come from the SKU referenced by claim.sku_id, read at each recompute."
    constants:
      CHANNEL_RESERVE_PCT: { BRANDED: 0.62, PRIVATE_LABEL: 0.45, PROFESSIONAL: 0.78 }
      WARRANTY_TIER_FACTOR: { LIFETIME: 1.00, LIMITED_5Y: 0.70, NONE: 0.00 }
    precision: "integer cents, round_half_up per line then exact integer summation"
    variants: []
    note: "Combinatorial mode (b): nested rounding where per-line-then-sum and sum-then-round differ by one cent."

  - name: pack_pricing
    trigger: "on POST /toolworks/pack-configurations/{id}/members (line_extended_cents) and on POST /toolworks/pack-configurations/{id}/approve (all three pack totals)"
    algorithm: tiered_pricing
    formula: |
      members = PackMember rows where pack_id == pack.id, ordered by created_at ASC
      member.line_extended_cents = round_half_up(
          sku.list_price_cents * member.quantity * PACK_TYPE_DISCOUNT[pack.pack_type])
      pack.member_subtotal_cents = sum(member.line_extended_cents for all members)
      pack.distinct_member_count = count(members)
      # EVALUATION ORDER IS PINNED to break the apparent circularity between the
      # surcharge and the total:
      #   step 1  member_subtotal_cents            (independent of the surcharge)
      #   step 2  surcharge tier keyed on member_subtotal_cents, i.e. the
      #           PRE-SURCHARGE subtotal — NOT on pack_total_cents
      #   step 3  pack_total_cents = member_subtotal_cents + security_surcharge_cents
      security_surcharge_cents =
          0                                            if pack.pack_type != 'SECURITY'
          SURCHARGE_FLAT_LOW                           if member_subtotal_cents <= SURCHARGE_BREAK_LOW
          SURCHARGE_FLAT_MID                           if member_subtotal_cents <= SURCHARGE_BREAK_MID
          round_half_up(member_subtotal_cents * SURCHARGE_HIGH_PCT)   otherwise
      pack_total_cents = member_subtotal_cents + security_surcharge_cents
      # Worked divergence: a SECURITY pack with one member (list 3300, qty 6)
      # has member_subtotal_cents 19800, which is in the MID tier -> surcharge 700
      # -> pack_total_cents 20500. Keying the tier on pack_total_cents instead
      # would push 20500 past SURCHARGE_BREAK_MID into the 4% band and yield
      # 19800 + 820 = 20620.
    input_set: "Every PackMember row on the pack in created_at ASC order, each priced from the current list_price_cents of the ToolSku it references."
    constants:
      PACK_TYPE_DISCOUNT: { RETAIL_DISPLAY: 1.00, SECURITY: 1.00, MULTIPACK: 0.88 }
      SURCHARGE_BREAK_LOW: 5000
      SURCHARGE_BREAK_MID: 20000
      SURCHARGE_FLAT_LOW: 350
      SURCHARGE_FLAT_MID: 700
      SURCHARGE_HIGH_PCT: 0.04
      PACK_SHAPE_RULES:
        RETAIL_DISPLAY: "1 <= distinct_member_count <= 12"
        SECURITY: "1 <= distinct_member_count <= 3 AND primary_sku_id appears among the members"
        MULTIPACK: "distinct_member_count >= 2 AND sum(quantity) >= 3"
    precision: "integer cents, round_half_up per member line then exact integer summation"
    variants: []
    note: "Combinatorial mode (c): circular-looking surcharge/total dependency resolved by a pinned evaluation order."

  - name: reserve_ledger
    trigger: "on POST /toolworks/warranty-claims/{id}/approve and POST /toolworks/warranty-claims/{id}/revoke"
    algorithm: aggregation
    formula: |
      charged = WarrantyClaim rows where program_id == program.id
                AND status in {'APPROVED','FULFILLED'}
      program.reserve_balance_cents = program.reserve_funded_cents
                                      - sum(c.reserve_charge_cents for c in charged)
      program.open_hold_count = count(WarrantyClaim where program_id == program.id and status == 'FRAUD_HOLD')
      # CONSERVED QUANTITY (money, integer cents):
      #   program.reserve_funded_cents
      #     == program.reserve_balance_cents
      #        + sum(c.reserve_charge_cents for c in {APPROVED, FULFILLED})
      # Approval is the forward action, revoke the compensating action. Because
      # reserve_charge_cents is retained (not zeroed) on REVOKED claims while the
      # status leaves the charged set, an approve/revoke pair returns the balance
      # to exactly its pre-approval value with zero drift.
    input_set: "Claims on the programme in status APPROVED or FULFILLED. SUBMITTED, FRAUD_HOLD, DENIED, DENIED_FRAUD and REVOKED claims are excluded."
    constants: {}
    precision: "integer cents"
    variants: []
    note: "Rule 9 conserved quantity #1 — money."

  - name: replacement_unit_ledger
    trigger: "on POST /toolworks/tool-skus/{id}/stock-receipts, POST /toolworks/production-lots/{id}/release, and POST /toolworks/warranty-claims/{id}/approve, /fulfill, /revoke"
    algorithm: aggregation
    formula: |
      sku.units_reserved = sum(c.replacement_unit_count for WarrantyClaim c
                               where c.sku_id == sku.id and c.status == 'APPROVED')
      sku.units_shipped  = sum(c.replacement_unit_count for WarrantyClaim c
                               where c.sku_id == sku.id and c.status == 'FULFILLED')
      sku.units_on_hand  = sku.units_received_total - sku.units_reserved - sku.units_shipped
      # units_received_total is monotonically increasing: += lot.unit_count on lot
      # release, += request units_received on a stock receipt.
      # CONSERVED QUANTITY (physical finished units):
      #   sku.units_received_total == units_on_hand + units_reserved + units_shipped
      # holds after approve (on_hand -> reserved), fulfill (reserved -> shipped)
      # and revoke (reserved -> on_hand from APPROVED, shipped -> on_hand from
      # FULFILLED), so any forward/compensating pair leaves the total untouched.
    input_set: "WarrantyClaim rows on the SKU partitioned by status; only APPROVED and FULFILLED occupy units."
    constants: {}
    precision: "integer unit counts"
    variants: []
    note: "Rule 9 conserved quantity #2 — physical units, a different type of conserved quantity from reserve_ledger's money."

  - name: sku_lineage_depth
    trigger: "on POST /toolworks/tool-skus and PATCH /toolworks/tool-skus/{id} whenever supersedes_sku_id is supplied"
    algorithm: topological
    formula: |
      walk = [sku]; cursor = candidate supersedes_sku_id (the value in the request)
      hops = 0
      while cursor is not null:
        if cursor is already in walk  -> CYCLE (reject with ERR_SKU_LINEAGE_CYCLE)
        walk.append(cursor); hops += 1
        if hops > LINEAGE_MAX_DEPTH   -> reject with ERR_LINEAGE_DEPTH_EXCEEDED
        cursor = ToolSku[cursor].supersedes_sku_id
      sku.lineage_depth = hops
      # The cycle check runs BEFORE the depth check so a self-reference
      # (supersedes_sku_id == own id) is reported as a cycle, not as depth.
    input_set: "The chain of ToolSku rows reachable by following supersedes_sku_id from the candidate value."
    constants:
      LINEAGE_MAX_DEPTH: 3
    precision: "integer hop count"
    variants: []

# =============================================================================
# §1.4 Ordered Validation Rules
# =============================================================================
# Global ladder. Lower `priority` is evaluated first and its error is the one
# returned when several rules are violated by the same request.
#   100-199  authentication / authorization
#   200-299  path and body existence (404s)
#   300-399  request shape, enums, ranges, window sanity
#   400-449  state preconditions on the target entity
#   450-469  optimistic concurrency (immediately after state, before business)
#   470-499  cross-entity state dependencies
#   500-599  business_safety   (metallurgical / qualification gates)
#   600-699  business_temporal (windows, buffers, ordering)
#   700-799  business_capacity (pools, charges, coupon counts, stock)
#   800-899  business_fiscal   (reserve money)
#   900-999  business_integrity (ledgers, uniqueness, lineage, SoD)
# =============================================================================
validations:

  - priority: 100
    category: auth
    rule: "Every endpoint except POST /toolworks/_clock/set_current_utc requires an X-User-Role header naming a role declared in §1.7."
    error_id: ERR_UNAUTHENTICATED
    applies_to: "all endpoints"

  - priority: 110
    category: auth
    rule: "The X-User-Role value must appear in the endpoint's roles list."
    error_id: ERR_ROLE_NOT_PERMITTED
    applies_to: "all endpoints"

  - priority: 120
    category: auth
    rule: "For a caller whose role is Claimant, X-User-ID must equal the id of a Claimant row, and any WarrantyClaim addressed by the request must have claimant_id equal to that row."
    error_id: ERR_CLAIMANT_MISMATCH
    applies_to: "POST /toolworks/warranty-claims, POST /toolworks/warranty-claims/{id}/lines, GET /toolworks/warranty-claims/{id}"

  - priority: 200
    category: existence
    rule: "The {id} path parameter must resolve to a row of the addressed entity. The specific code is the entity's member of the NOT_FOUND family: ERR_TOOL_SKU_NOT_FOUND, ERR_PRODUCTION_LOT_NOT_FOUND, ERR_FURNACE_NOT_FOUND, ERR_CAMPAIGN_NOT_FOUND, ERR_CHAMBER_NOT_FOUND, ERR_TEST_RUN_NOT_FOUND, ERR_PACK_CONFIG_NOT_FOUND, ERR_WARRANTY_PROGRAM_NOT_FOUND, ERR_CLAIMANT_NOT_FOUND, ERR_CLAIM_NOT_FOUND or ERR_REPORT_NOT_FOUND."
    error_id: ERR_TOOL_SKU_NOT_FOUND
    applies_to: "every endpoint carrying {id}; the code varies by addressed entity as listed in the rule"

  - priority: 210
    category: existence
    rule: "sku_id in the body must resolve to a ToolSku."
    error_id: ERR_TOOL_SKU_NOT_FOUND
    applies_to: "POST /toolworks/production-lots, POST /toolworks/pack-configurations, POST /toolworks/pack-configurations/{id}/members, POST /toolworks/warranty-claims, POST /toolworks/counterfeit-reports"

  - priority: 211
    category: existence
    rule: "furnace_id must resolve to a HeatTreatFurnace."
    error_id: ERR_FURNACE_NOT_FOUND
    applies_to: "POST /toolworks/furnace-campaigns"

  - priority: 212
    category: existence
    rule: "chamber_id, when supplied, must resolve to a SaltSprayChamber."
    error_id: ERR_CHAMBER_NOT_FOUND
    applies_to: "POST /toolworks/test-runs"

  - priority: 213
    category: existence
    rule: "lot_id must resolve to a ProductionLot."
    error_id: ERR_PRODUCTION_LOT_NOT_FOUND
    applies_to: "POST /toolworks/furnace-campaigns, POST /toolworks/test-runs"

  - priority: 214
    category: existence
    rule: "claimant_id and program_id must resolve to a Claimant and a WarrantyProgram respectively."
    error_id: ERR_CLAIMANT_NOT_FOUND
    applies_to: "POST /toolworks/warranty-claims"

  - priority: 215
    category: existence
    rule: "program_id must resolve to a WarrantyProgram."
    error_id: ERR_WARRANTY_PROGRAM_NOT_FOUND
    applies_to: "POST /toolworks/warranty-claims"

  - priority: 216
    category: existence
    rule: "supersedes_sku_id, when supplied and non-null, must resolve to a ToolSku."
    error_id: ERR_TOOL_SKU_NOT_FOUND
    applies_to: "POST /toolworks/tool-skus, PATCH /toolworks/tool-skus/{id}"

  - priority: 300
    category: request_shape
    rule: "Every field declared source: input without a default must be present and of the declared type; enum fields must carry a declared member; integer fields must respect their declared range."
    error_id: ERR_INVALID_REQUEST
    applies_to: "all POST and PATCH endpoints"

  - priority: 310
    category: request_shape
    rule: "limit must be an integer in 1..100 and offset an integer >= 0."
    error_id: ERR_INVALID_PAGINATION
    applies_to: "all list endpoints"

  - priority: 320
    category: request_shape
    rule: "window_start must be strictly before window_end and both must be whole-minute UTC instants."
    error_id: ERR_INVALID_WINDOW
    applies_to: "POST /toolworks/furnace-campaigns, POST /toolworks/test-runs"

  - priority: 330
    category: request_shape
    rule: "readings must be a non-empty array of numbers whose length equals the TestRun's specimen_count."
    error_id: ERR_READING_COUNT_MISMATCH
    applies_to: "POST /toolworks/test-runs/{id}/results"

  - priority: 340
    category: request_shape
    rule: "For test_type == SALT_SPRAY chamber_id is required."
    error_id: ERR_CHAMBER_REQUIRED
    applies_to: "POST /toolworks/test-runs"

  - priority: 341
    category: request_shape
    rule: "For every test_type other than SALT_SPRAY chamber_id must be absent or null."
    error_id: ERR_CHAMBER_NOT_APPLICABLE
    applies_to: "POST /toolworks/test-runs"

  - priority: 400
    category: state
    rule: "The ProductionLot's cert_status must be in the transition's from_state set (advance and schedule actions require DRAFT or IN_TEST; certify requires IN_TEST; rework requires REJECTED)."
    error_id: ERR_LOT_CERT_STATE_INVALID
    applies_to: "POST /toolworks/production-lots/{id}/advance, /certify, /rework, POST /toolworks/test-runs, POST /toolworks/furnace-campaigns"

  - priority: 401
    category: state
    rule: "On advance, the ProductionLot's process_status must be the immediate predecessor of the requested target stage; on certify it must be ASSEMBLED."
    error_id: ERR_LOT_PROCESS_STATE_INVALID
    applies_to: "POST /toolworks/production-lots/{id}/advance, POST /toolworks/production-lots/{id}/certify"

  - priority: 402
    category: state
    rule: "A ProductionLot whose disposition is QUARANTINED accepts no further test scheduling, advancing, certification or release."
    error_id: ERR_LOT_QUARANTINED
    applies_to: "POST /toolworks/production-lots/{id}/advance, /certify, /release, POST /toolworks/test-runs, POST /toolworks/furnace-campaigns"

  - priority: 403
    category: state
    rule: "Release requires disposition == IN_PROCESS; a lot already RELEASED cannot be released again."
    error_id: ERR_LOT_ALREADY_DISPOSITIONED
    applies_to: "POST /toolworks/production-lots/{id}/release"

  - priority: 404
    category: state
    rule: "The TestRun's status must be SCHEDULED for results submission and for voiding."
    error_id: ERR_TEST_RUN_STATE_INVALID
    applies_to: "POST /toolworks/test-runs/{id}/results, POST /toolworks/test-runs/{id}/void"

  - priority: 405
    category: state
    rule: "The FurnaceCampaign's status must be SCHEDULED to be completed."
    error_id: ERR_CAMPAIGN_STATE_INVALID
    applies_to: "POST /toolworks/furnace-campaigns/{id}/complete"

  - priority: 406
    category: state
    rule: "The PackConfiguration's status must be DRAFT to accept members or approval, and APPROVED to be withdrawn."
    error_id: ERR_PACK_STATE_INVALID
    applies_to: "POST /toolworks/pack-configurations/{id}/members, /approve, /withdraw"

  - priority: 407
    category: state
    rule: "The WarrantyClaim's status must be in the addressed transition's from_state set: SUBMITTED for hold/deny/approve, FRAUD_HOLD for clear-hold and deny-fraud, APPROVED for fulfill, APPROVED or FULFILLED for revoke, SUBMITTED or FRAUD_HOLD for line addition."
    error_id: ERR_CLAIM_STATE_INVALID
    applies_to: "POST /toolworks/warranty-claims/{id}/hold, /clear-hold, /approve, /deny, /deny-fraud, /fulfill, /revoke, /lines"

  - priority: 408
    category: state
    rule: "The CounterfeitReport's status must be OPEN to be confirmed or dismissed."
    error_id: ERR_REPORT_STATE_INVALID
    applies_to: "POST /toolworks/counterfeit-reports/{id}/confirm, /dismiss"

  - priority: 409
    category: state
    rule: "The Claimant's status must be ACTIVE to be blocked, and a BLOCKED claimant cannot file a claim."
    error_id: ERR_CLAIMANT_STATE_INVALID
    applies_to: "POST /toolworks/claimants/{id}/block"

  - priority: 410
    category: state
    rule: "A BLOCKED Claimant cannot be the subject of a new WarrantyClaim."
    error_id: ERR_CLAIMANT_BLOCKED
    applies_to: "POST /toolworks/warranty-claims"

  - priority: 411
    category: state
    rule: "The requested HeatTreatFurnace status must differ from the current status."
    error_id: ERR_FURNACE_STATUS_UNCHANGED
    applies_to: "POST /toolworks/heat-treat-furnaces/{id}/status"

  - priority: 450
    category: concurrency
    rule: "expected_sku_version must equal the current ToolSku.version of the lot's parent SKU. Evaluated after the lot's own state preconditions (400-403) and before every business rule."
    error_id: ERR_STALE_SKU_VERSION
    applies_to: "POST /toolworks/production-lots/{id}/release"

  - priority: 451
    category: concurrency
    rule: "expected_program_version must equal the current WarrantyProgram.version of the claim's programme. Evaluated after the claim's state precondition (407) and before the fraud, stock and reserve rules."
    error_id: ERR_STALE_PROGRAM_VERSION
    applies_to: "POST /toolworks/warranty-claims/{id}/approve"

  - priority: 470
    category: cross_entity_state
    rule: "Advancing a lot to HEAT_TREATED requires at least one FurnaceCampaign on that lot with status == COMPLETED. A SCHEDULED or RELEASED campaign does not satisfy the gate."
    error_id: ERR_HEAT_TREAT_NOT_COMPLETED
    applies_to: "POST /toolworks/production-lots/{id}/advance"

  - priority: 471
    category: cross_entity_state
    rule: "Approving a WarrantyClaim requires the referenced ToolSku.warranty_posture to be OPEN. RESTRICTED and SUSPENDED both block."
    error_id: ERR_SKU_WARRANTY_RESTRICTED
    applies_to: "POST /toolworks/warranty-claims/{id}/approve"

  - priority: 472
    category: cross_entity_state
    rule: "A FurnaceCampaign may only be scheduled on a furnace whose status is AVAILABLE."
    error_id: ERR_FURNACE_UNAVAILABLE
    applies_to: "POST /toolworks/furnace-campaigns"

  - priority: 473
    category: cross_entity_state
    rule: "Every PackMember's ToolSku must belong to a ProductionLot with cert_status == CERTIFIED (at least one such lot)."
    error_id: ERR_MEMBER_SKU_NOT_CERTIFIED
    applies_to: "POST /toolworks/pack-configurations/{id}/approve"

  - priority: 474
    category: cross_entity_state
    rule: "No PackMember's ToolSku may have warranty_posture == SUSPENDED at approval time."
    error_id: ERR_MEMBER_SKU_RESTRICTED
    applies_to: "POST /toolworks/pack-configurations/{id}/approve"

  - priority: 500
    category: business_safety
    rule: "A FurnaceCampaign's furnace must list the lot's SKU alloy_grade in alloy_grades_supported. Evaluated BEFORE any window or charge check, so an unsupported alloy is reported even when the requested window also collides."
    error_id: ERR_ALLOY_NOT_SUPPORTED
    applies_to: "POST /toolworks/furnace-campaigns"

  - priority: 510
    category: business_safety
    rule: "A DIMENSIONAL, PROOF_TORQUE, SALT_SPRAY or MECHANISM_CYCLE TestRun may only be scheduled once the lot's process_status has reached MACHINED (SALT_SPRAY and MECHANISM_CYCLE additionally require PLATED and ASSEMBLED respectively)."
    error_id: ERR_TEST_STAGE_TOO_EARLY
    applies_to: "POST /toolworks/test-runs"

  - priority: 511
    category: business_safety
    rule: "Certification requires at least one PASSED TestRun for every test_type in MANDATORY_TESTS[sku.tool_family]."
    error_id: ERR_MANDATORY_TEST_MISSING
    applies_to: "POST /toolworks/production-lots/{id}/certify"

  - priority: 512
    category: business_safety
    rule: "Certification is refused while any TestRun on the lot has status == FAILED."
    error_id: ERR_FAILED_TEST_PRESENT
    applies_to: "POST /toolworks/production-lots/{id}/certify"

  - priority: 513
    category: business_safety
    rule: "Certification requires hardness_index_pooled >= HARDNESS_MIN_HRC[alloy_grade] + CHANNEL_HARDNESS_MARGIN[channel]. Inclusive comparison: exact equality certifies."
    error_id: ERR_HARDNESS_MARGIN_NOT_MET
    applies_to: "POST /toolworks/production-lots/{id}/certify"

  - priority: 514
    category: business_safety
    rule: "Release requires cert_status == CERTIFIED."
    error_id: ERR_LOT_NOT_CERTIFIED
    applies_to: "POST /toolworks/production-lots/{id}/release"

  - priority: 515
    category: business_safety
    rule: "A ToolSku whose warranty_tier is NONE cannot be the subject of a WarrantyClaim."
    error_id: ERR_WARRANTY_TIER_NOT_COVERED
    applies_to: "POST /toolworks/warranty-claims"

  - priority: 520
    category: business_safety
    rule: "Rework is refused once rework_cycle_count has reached REWORK_LIMIT."
    error_id: ERR_REWORK_LIMIT_EXCEEDED
    applies_to: "POST /toolworks/production-lots/{id}/rework"

  - priority: 521
    category: business_safety
    rule: "Completing a FurnaceCampaign requires soak_minutes >= MIN_SOAK_MINUTES."
    error_id: ERR_SOAK_TIME_TOO_SHORT
    applies_to: "POST /toolworks/furnace-campaigns/{id}/complete"

  - priority: 600
    category: business_temporal
    rule: "The requested furnace window, expanded by RAMP_BUFFER_MINUTES on the trailing edge, must not intersect the buffered window of any SCHEDULED or COMPLETED campaign on the same furnace. Strict inequality: a start exactly at a prior buffered_end is accepted."
    error_id: ERR_FURNACE_WINDOW_CONFLICT
    applies_to: "POST /toolworks/furnace-campaigns"

  - priority: 601
    category: business_temporal
    rule: "A TestRun's window must not start before the lot's earliest COMPLETED FurnaceCampaign window_end for test types that require heat treatment."
    error_id: ERR_TEST_WINDOW_BEFORE_HEAT_TREAT
    applies_to: "POST /toolworks/test-runs"

  - priority: 700
    category: business_capacity
    rule: "charge_kg must be <= the furnace's max_charge_kg."
    error_id: ERR_FURNACE_CHARGE_EXCEEDED
    applies_to: "POST /toolworks/furnace-campaigns"

  - priority: 701
    category: business_capacity
    rule: "specimen_count must be <= the lot's specimens_available. Exact equality is accepted and drives specimens_available to zero."
    error_id: ERR_SPECIMENS_EXHAUSTED
    applies_to: "POST /toolworks/test-runs"

  - priority: 702
    category: business_capacity
    rule: "For SALT_SPRAY runs, peak additive coupon occupancy in the chamber across the requested interval must not exceed coupon_capacity. Occupancy exactly equal to coupon_capacity is accepted."
    error_id: ERR_CHAMBER_CAPACITY_EXCEEDED
    applies_to: "POST /toolworks/test-runs"

  - priority: 710
    category: business_capacity
    rule: "Approving a WarrantyClaim requires sku.units_on_hand >= claim.replacement_unit_count."
    error_id: ERR_REPLACEMENT_STOCK_INSUFFICIENT
    applies_to: "POST /toolworks/warranty-claims/{id}/approve"

  - priority: 800
    category: business_fiscal
    rule: "Approving a WarrantyClaim requires program.reserve_balance_cents >= claim.reserve_charge_cents. This rule sits BELOW the claim state precondition at priority 407, so a FRAUD_HOLD claim whose charge also exceeds the balance returns ERR_CLAIM_STATE_INVALID."
    error_id: ERR_RESERVE_INSUFFICIENT
    applies_to: "POST /toolworks/warranty-claims/{id}/approve"

  - priority: 810
    category: business_fiscal
    rule: "Approving a WarrantyClaim requires Claimant.fraud_risk_score_adjudication < program.fraud_score_threshold."
    error_id: ERR_FRAUD_SCORE_TOO_HIGH
    applies_to: "POST /toolworks/warranty-claims/{id}/approve"

  - priority: 900
    category: business_integrity
    rule: "Approving a WarrantyClaim requires line_count >= 1."
    error_id: ERR_CLAIM_HAS_NO_LINES
    applies_to: "POST /toolworks/warranty-claims/{id}/approve"

  - priority: 901
    category: business_integrity
    rule: "A Claimant may not hold two claims in status SUBMITTED, FRAUD_HOLD or APPROVED on the same (sku_id, serial_code) pair."
    error_id: ERR_DUPLICATE_OPEN_CLAIM
    applies_to: "POST /toolworks/warranty-claims"

  - priority: 902
    category: business_integrity
    rule: "The user in X-User-ID who placed a claim into FRAUD_HOLD (recorded in held_by_user_id) may neither clear that hold nor approve the claim afterwards. Evaluated only when held_by_user_id is not null; a system cascade hold leaves it null and therefore constrains nobody."
    error_id: ERR_SEGREGATION_OF_DUTIES
    applies_to: "POST /toolworks/warranty-claims/{id}/clear-hold, POST /toolworks/warranty-claims/{id}/approve"

  - priority: 910
    category: business_integrity
    rule: "supersedes_sku_id must not create a cycle through the supersedes chain, including a direct self-reference. Checked before the depth limit."
    error_id: ERR_SKU_LINEAGE_CYCLE
    applies_to: "POST /toolworks/tool-skus, PATCH /toolworks/tool-skus/{id}"

  - priority: 911
    category: business_integrity
    rule: "A superseding ToolSku must share the tool_family of the SKU it supersedes."
    error_id: ERR_LINEAGE_FAMILY_MISMATCH
    applies_to: "POST /toolworks/tool-skus, PATCH /toolworks/tool-skus/{id}"

  - priority: 912
    category: business_integrity
    rule: "lineage_depth must not exceed LINEAGE_MAX_DEPTH."
    error_id: ERR_LINEAGE_DEPTH_EXCEEDED
    applies_to: "POST /toolworks/tool-skus, PATCH /toolworks/tool-skus/{id}"

  - priority: 920
    category: business_integrity
    rule: "A ToolSku may appear at most once among a PackConfiguration's members."
    error_id: ERR_DUPLICATE_PACK_MEMBER
    applies_to: "POST /toolworks/pack-configurations/{id}/members"

  - priority: 921
    category: business_integrity
    rule: "All members of a PackConfiguration must share one channel; a PROFESSIONAL SKU may not be packed with a BRANDED or PRIVATE_LABEL SKU."
    error_id: ERR_CHANNEL_MIX_FORBIDDEN
    applies_to: "POST /toolworks/pack-configurations/{id}/members"

  - priority: 922
    category: business_integrity
    rule: "Approval enforces PACK_SHAPE_RULES for the pack_type: RETAIL_DISPLAY 1..12 members; SECURITY 1..3 members and primary_sku_id present among them; MULTIPACK >= 2 members and total quantity >= 3."
    error_id: ERR_PACK_CONFIG_INVALID
    applies_to: "POST /toolworks/pack-configurations/{id}/approve"

  - priority: 930
    category: business_integrity
    rule: "sku_code, lot_code, furnace_code, chamber_code, pack_code, program_code and Claimant.email are each globally unique."
    error_id: ERR_DUPLICATE_CODE
    applies_to: "POST /toolworks/tool-skus, /production-lots, /heat-treat-furnaces, /salt-spray-chambers, /pack-configurations, /warranty-programs, /claimants"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
# Every path lives under the api_prefix /toolworks and every single-resource
# path parameter is literally {id}.
# =============================================================================
endpoints:

  # ---------------------------------------------------------------- ToolSku ---
  - method: POST
    path: "/toolworks/tool-skus"
    description: "Register a hand-tool SKU for one channel. Computes proof_torque_required_nm and, when supersedes_sku_id is supplied, lineage_depth."
    roles: [ChannelManager, PlatformAdmin]
    code: 201
    input: [sku_code, tool_family, channel, nominal_size_mm, alloy_grade, list_price_cents, warranty_tier, "supersedes_sku_id?"]
    output: ToolSku
    side_effects:
      - "calculation proof_torque_requirement computes proof_torque_required_nm"
      - "calculation sku_lineage_depth computes lineage_depth and rejects cycles / over-deep chains"
      - "warranty_posture initialised to OPEN, brand_risk_score and confirmed_counterfeit_count to 0"
      - "units_received_total, units_on_hand, units_reserved, units_shipped initialised to 0"

  - method: GET
    path: "/toolworks/tool-skus"
    description: "List SKUs with pagination. Filter by channel, tool_family, warranty_posture or supersedes_sku_id (the last one lists the successors of a given SKU)."
    roles: [ChannelManager, ProductionPlanner, QualityEngineer, WarrantyAdministrator, BrandProtectionAnalyst, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "channel?", "tool_family?", "warranty_posture?", "supersedes_sku_id?"]
    output: ToolSku[]
    side_effects: []

  - method: GET
    path: "/toolworks/tool-skus/{id}"
    description: "Fetch one SKU including its current version, brand_risk_score, warranty_posture and unit ledger."
    roles: [ChannelManager, ProductionPlanner, QualityEngineer, WarrantyAdministrator, BrandProtectionAnalyst, PlatformAdmin]
    code: 200
    input: []
    output: ToolSku
    side_effects: []

  - method: PATCH
    path: "/toolworks/tool-skus/{id}"
    description: "Amend commercial attributes of a SKU. Re-runs the proof-torque and lineage calculations."
    roles: [ChannelManager, PlatformAdmin]
    code: 200
    input: ["list_price_cents?", "warranty_tier?", "nominal_size_mm?", "alloy_grade?", "supersedes_sku_id?"]
    output: ToolSku
    side_effects:
      - "calculation proof_torque_requirement recomputes proof_torque_required_nm"
      - "calculation sku_lineage_depth recomputes lineage_depth"
      - "version increments"

  - method: POST
    path: "/toolworks/tool-skus/{id}/stock-receipts"
    description: "Book finished units into the SKU's replacement stock from an outside source (returns, transfer-in, contract packer)."
    roles: [ChannelManager, PlatformAdmin]
    code: 200
    input: [units_received, "expected_sku_version?"]
    output: ToolSku
    side_effects:
      - "units_received_total increases by units_received"
      - "calculation replacement_unit_ledger recomputes units_on_hand"
      - "version increments"

  - method: GET
    path: "/toolworks/tool-skus/{id}/production-lots"
    description: "List every ProductionLot manufactured against this SKU."
    roles: [ProductionPlanner, QualityEngineer, ChannelManager, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: ProductionLot[]
    side_effects: []

  - method: GET
    path: "/toolworks/tool-skus/{id}/counterfeit-reports"
    description: "List every CounterfeitReport filed against this SKU, in any status."
    roles: [BrandProtectionAnalyst, ChannelManager, WarrantyAdministrator, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: CounterfeitReport[]
    side_effects: []

  - method: GET
    path: "/toolworks/tool-skus/{id}/pack-memberships"
    description: "List every PackMember line that packs this SKU, across all pack configurations."
    roles: [ChannelManager, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: PackMember[]
    side_effects: []

  # --------------------------------------------------------- HeatTreatFurnace -
  - method: POST
    path: "/toolworks/heat-treat-furnaces"
    description: "Register a heat-treat furnace with its charge limit and the alloy grades it is qualified for."
    roles: [ProductionPlanner, PlatformAdmin]
    code: 201
    input: [furnace_code, max_charge_kg, alloy_grades_supported]
    output: HeatTreatFurnace
    side_effects: ["status initialised to AVAILABLE"]

  - method: GET
    path: "/toolworks/heat-treat-furnaces"
    description: "List heat-treat furnaces with pagination."
    roles: [ProductionPlanner, QualityEngineer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: HeatTreatFurnace[]
    side_effects: []

  - method: GET
    path: "/toolworks/heat-treat-furnaces/{id}"
    description: "Fetch one furnace."
    roles: [ProductionPlanner, QualityEngineer, PlatformAdmin]
    code: 200
    input: []
    output: HeatTreatFurnace
    side_effects: []

  - method: POST
    path: "/toolworks/heat-treat-furnaces/{id}/status"
    description: "Move a furnace between AVAILABLE and MAINTENANCE. A MAINTENANCE furnace accepts no new campaigns."
    roles: [ProductionPlanner, PlatformAdmin]
    code: 200
    input: [status]
    output: HeatTreatFurnace
    side_effects: ["already-SCHEDULED campaigns are untouched", "version increments"]

  # -------------------------------------------------------- SaltSprayChamber --
  - method: POST
    path: "/toolworks/salt-spray-chambers"
    description: "Register a salt-spray corrosion chamber and its simultaneous coupon capacity."
    roles: [QualityEngineer, PlatformAdmin]
    code: 201
    input: [chamber_code, coupon_capacity]
    output: SaltSprayChamber
    side_effects: []

  - method: GET
    path: "/toolworks/salt-spray-chambers"
    description: "List salt-spray chambers with pagination."
    roles: [QualityEngineer, ProductionPlanner, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: SaltSprayChamber[]
    side_effects: []

  - method: GET
    path: "/toolworks/salt-spray-chambers/{id}"
    description: "Fetch one salt-spray chamber including its coupon_capacity."
    roles: [QualityEngineer, ProductionPlanner, PlatformAdmin]
    code: 200
    input: []
    output: SaltSprayChamber
    side_effects: []

  # ----------------------------------------------------------- ProductionLot --
  - method: POST
    path: "/toolworks/production-lots"
    description: "Open a production lot against a SKU. Pins proof_torque_required_nm from the SKU at creation so later SKU amendments do not move the acceptance bar for this lot."
    roles: [ProductionPlanner, PlatformAdmin]
    code: 201
    input: [sku_id, lot_code, unit_count, specimen_pool_total]
    output: ProductionLot
    side_effects:
      - "process_status FORGED, cert_status DRAFT, disposition IN_PROCESS"
      - "proof_torque_required_nm copied from the parent SKU"
      - "specimens_available set to specimen_pool_total; committed and consumed set to 0"
      - "rework_cycle_count set to 0; hardness indices null"

  - method: GET
    path: "/toolworks/production-lots"
    description: "List production lots with pagination and status filters."
    roles: [ProductionPlanner, QualityEngineer, ChannelManager, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "process_status?", "cert_status?", "disposition?"]
    output: ProductionLot[]
    side_effects: []

  - method: GET
    path: "/toolworks/production-lots/{id}"
    description: "Fetch one production lot with all three status dimensions, both hardness indices and the specimen ledger."
    roles: [ProductionPlanner, QualityEngineer, ChannelManager, PlatformAdmin]
    code: 200
    input: []
    output: ProductionLot
    side_effects: []

  - method: POST
    path: "/toolworks/production-lots/{id}/advance"
    description: "Advance the lot one manufacturing stage: FORGED -> HEAT_TREATED -> MACHINED -> PLATED -> ASSEMBLED. The HEAT_TREATED step is gated on a COMPLETED FurnaceCampaign."
    roles: [ProductionPlanner, PlatformAdmin]
    code: 200
    input: [target_process_status]
    output: ProductionLot
    side_effects:
      - "process_status moves to target_process_status"
      - "cert_status moves DRAFT -> IN_TEST on the first advance out of FORGED"
      - "version increments"

  - method: POST
    path: "/toolworks/production-lots/{id}/certify"
    description: "Certify the lot against industry performance standards. Requires every mandatory test PASSED, no FAILED test, and the pooled hardness index at or above the channel-adjusted alloy minimum."
    roles: [QualityEngineer, PlatformAdmin]
    code: 200
    input: []
    output: ProductionLot
    side_effects:
      - "calculation lot_hardness_index recomputed and frozen (both variants)"
      - "cert_status -> CERTIFIED, certified_at stamped from the logical clock"
      - "version increments"

  - method: POST
    path: "/toolworks/production-lots/{id}/rework"
    description: "Send a REJECTED lot back for rework. Regresses process_status to MACHINED, clears the hardness indices and lifts the quarantine."
    roles: [ProductionPlanner, PlatformAdmin]
    code: 200
    input: [rework_note]
    output: ProductionLot
    side_effects:
      - "cert_status REJECTED -> DRAFT, disposition QUARANTINED -> IN_PROCESS, process_status -> MACHINED"
      - "rework_cycle_count increments; refused once it has reached REWORK_LIMIT"
      - "hardness_index_sample and hardness_index_pooled reset to null"
      - "version increments"

  - method: POST
    path: "/toolworks/production-lots/{id}/release"
    description: "Release a CERTIFIED lot into finished stock, crediting the SKU's replacement unit pool. Guarded by expected_sku_version against a stale read of the parent SKU."
    roles: [ProductionPlanner, PlatformAdmin]
    code: 200
    input: [expected_sku_version]
    output: ProductionLot
    side_effects:
      - "disposition -> RELEASED"
      - "parent ToolSku.units_received_total increases by lot.unit_count"
      - "calculation replacement_unit_ledger recomputes units_on_hand on the SKU"
      - "ToolSku.version increments; ProductionLot.version increments"

  - method: GET
    path: "/toolworks/production-lots/{id}/test-runs"
    description: "List every TestRun scheduled against this lot, in any status."
    roles: [QualityEngineer, ProductionPlanner, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "test_type?", "status?"]
    output: TestRun[]
    side_effects: []

  # ---------------------------------------------------------- FurnaceCampaign -
  - method: POST
    path: "/toolworks/furnace-campaigns"
    description: "Schedule a heat-treat campaign for a lot on a furnace. The furnace is occupied exclusively for the window plus a trailing RAMP_BUFFER_MINUTES cool-down."
    roles: [ProductionPlanner, PlatformAdmin]
    code: 201
    input: [lot_id, furnace_id, window_start, window_end, charge_kg]
    output: FurnaceCampaign
    side_effects:
      - "calculation furnace_window_occupancy rejects a buffered-window collision"
      - "buffered_end computed as window_end + RAMP_BUFFER_MINUTES"
      - "status initialised to SCHEDULED; soak_minutes null until completion"

  - method: GET
    path: "/toolworks/furnace-campaigns"
    description: "List heat-treat campaigns. Filter by lot_id to see a lot's campaigns or by furnace_id to see a furnace's schedule."
    roles: [ProductionPlanner, QualityEngineer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "lot_id?", "furnace_id?", "status?"]
    output: FurnaceCampaign[]
    side_effects: []

  - method: GET
    path: "/toolworks/furnace-campaigns/{id}"
    description: "Fetch one heat-treat campaign including its computed buffered_end."
    roles: [ProductionPlanner, QualityEngineer, PlatformAdmin]
    code: 200
    input: []
    output: FurnaceCampaign
    side_effects: []

  - method: POST
    path: "/toolworks/furnace-campaigns/{id}/complete"
    description: "Record completion of a heat-treat campaign with its achieved soak time. Only a COMPLETED campaign satisfies the lot's HEAT_TREATED gate."
    roles: [ProductionPlanner, PlatformAdmin]
    code: 200
    input: [soak_minutes]
    output: FurnaceCampaign
    side_effects:
      - "status SCHEDULED -> COMPLETED"
      - "the furnace window remains blocked (COMPLETED still occupies)"
      - "version increments"

  # ----------------------------------------------------------------- TestRun --
  - method: POST
    path: "/toolworks/test-runs"
    description: "Schedule a qualification test on a lot, committing specimens from its finite pool. SALT_SPRAY runs additionally occupy coupon capacity in a chamber."
    roles: [QualityEngineer, PlatformAdmin]
    code: 201
    input: [lot_id, test_type, specimen_count, window_start, window_end, "chamber_id?"]
    output: TestRun
    side_effects:
      - "calculation specimen_ledger moves specimen_count from available to committed"
      - "calculation chamber_capacity_occupancy rejects a coupon-capacity breach for SALT_SPRAY"
      - "mandatory derived from MANDATORY_TESTS[sku.tool_family]"
      - "requirement_value pinned from the run's test_type, the lot and the SKU"
      - "status initialised to SCHEDULED; ProductionLot.version increments"

  - method: GET
    path: "/toolworks/test-runs"
    description: "List test runs. Filter by chamber_id to see one salt-spray chamber's occupancy, or by status / test_type."
    roles: [QualityEngineer, ProductionPlanner, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "chamber_id?", "test_type?", "status?", "mandatory?"]
    output: TestRun[]
    side_effects: []

  - method: GET
    path: "/toolworks/test-runs/{id}"
    description: "Fetch one test run with its readings, governing_statistic, requirement_value and result_margin_pct."
    roles: [QualityEngineer, ProductionPlanner, PlatformAdmin]
    code: 200
    input: []
    output: TestRun
    side_effects: []

  - method: POST
    path: "/toolworks/test-runs/{id}/results"
    description: "Submit readings for a scheduled run. The governing statistic depends on test_type (mean for hardness, minimum for torque/salt-spray/cycles, worst absolute deviation for dimensional). A FAIL on a mandatory run rejects and quarantines the whole lot."
    roles: [QualityEngineer, PlatformAdmin]
    code: 200
    input: [readings]
    output: TestRun
    side_effects:
      - "calculation test_run_outcome sets mean_reading, governing_statistic, result_margin_pct and status PASSED or FAILED"
      - "calculation specimen_ledger moves specimen_count from committed to consumed"
      - "on PASS of a HARDNESS run: calculation lot_hardness_index recomputes both variants on the lot"
      - "on FAIL of a mandatory run (cascade B link 2): lot cert_status -> REJECTED, disposition -> QUARANTINED"
      - "cascade B link 3a: every SCHEDULED FurnaceCampaign on the lot -> RELEASED, freeing its furnace window"
      - "cascade B link 3b: every other SCHEDULED TestRun on the lot -> VOID with void_reason CASCADE_LOT_REJECTED, returning its specimens to available"
      - "ProductionLot.version increments"

  - method: POST
    path: "/toolworks/test-runs/{id}/void"
    description: "Void a scheduled test run that will not be executed, returning its committed specimens to the lot's available pool and releasing any chamber coupons."
    roles: [QualityEngineer, PlatformAdmin]
    code: 200
    input: [void_reason]
    output: TestRun
    side_effects:
      - "status SCHEDULED -> VOID"
      - "calculation specimen_ledger returns specimen_count to specimens_available"
      - "the run no longer occupies chamber coupon capacity"
      - "ProductionLot.version increments"

  # ------------------------------------------------------ PackConfiguration ---
  - method: POST
    path: "/toolworks/pack-configurations"
    description: "Open a retail packaging configuration (display carton, security pack or multipack) around a hero SKU."
    roles: [ChannelManager, PlatformAdmin]
    code: 201
    input: [pack_code, pack_type, primary_sku_id]
    output: PackConfiguration
    side_effects:
      - "status initialised to DRAFT"
      - "member_subtotal_cents, security_surcharge_cents, pack_total_cents and distinct_member_count initialised to 0"

  - method: GET
    path: "/toolworks/pack-configurations"
    description: "List packaging configurations. Filter by primary_sku_id to see the packs built around one hero SKU."
    roles: [ChannelManager, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "primary_sku_id?", "pack_type?", "status?"]
    output: PackConfiguration[]
    side_effects: []

  - method: GET
    path: "/toolworks/pack-configurations/{id}"
    description: "Fetch one packaging configuration with its priced totals."
    roles: [ChannelManager, PlatformAdmin]
    code: 200
    input: []
    output: PackConfiguration
    side_effects: []

  - method: POST
    path: "/toolworks/pack-configurations/{id}/members"
    description: "Add a SKU line to a DRAFT pack. All members must share one channel and no SKU may repeat."
    roles: [ChannelManager, PlatformAdmin]
    code: 201
    input: [sku_id, quantity]
    output: PackMember
    side_effects:
      - "calculation pack_pricing computes line_extended_cents for the new member and refreshes member_subtotal_cents and distinct_member_count"
      - "PackConfiguration.version increments"

  - method: GET
    path: "/toolworks/pack-configurations/{id}/members"
    description: "List the SKU lines of a packaging configuration in creation order."
    roles: [ChannelManager, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: PackMember[]
    side_effects: []

  - method: POST
    path: "/toolworks/pack-configurations/{id}/approve"
    description: "Approve a pack for retail release. Enforces the pack-type shape rules, requires every member SKU to have a CERTIFIED lot, and prices the security surcharge off the pre-surcharge subtotal."
    roles: [ChannelManager, PlatformAdmin]
    code: 200
    input: []
    output: PackConfiguration
    side_effects:
      - "calculation pack_pricing recomputes member_subtotal_cents, security_surcharge_cents and pack_total_cents"
      - "status DRAFT -> APPROVED"
      - "version increments"

  - method: POST
    path: "/toolworks/pack-configurations/{id}/withdraw"
    description: "Withdraw an approved pack from retail, e.g. after a member SKU's brand posture degrades."
    roles: [ChannelManager, BrandProtectionAnalyst, PlatformAdmin]
    code: 200
    input: [withdrawal_reason]
    output: PackConfiguration
    side_effects: ["status APPROVED -> WITHDRAWN", "version increments"]

  # -------------------------------------------------------- WarrantyProgram ---
  - method: POST
    path: "/toolworks/warranty-programs"
    description: "Stand up a lifetime-warranty programme with a funded replacement reserve and an intake fraud-score threshold."
    roles: [WarrantyAdministrator, PlatformAdmin]
    code: 201
    input: [program_code, reserve_funded_cents, fraud_score_threshold]
    output: WarrantyProgram
    side_effects: ["reserve_balance_cents initialised to reserve_funded_cents", "open_hold_count initialised to 0"]

  - method: GET
    path: "/toolworks/warranty-programs"
    description: "List warranty programmes with pagination."
    roles: [WarrantyAdministrator, ChannelManager, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: WarrantyProgram[]
    side_effects: []

  - method: GET
    path: "/toolworks/warranty-programs/{id}"
    description: "Fetch one warranty programme with its current reserve_balance_cents, open_hold_count and version. Read this immediately before an approve to obtain a fresh expected_program_version."
    roles: [WarrantyAdministrator, ChannelManager, PlatformAdmin]
    code: 200
    input: []
    output: WarrantyProgram
    side_effects: []

  # ---------------------------------------------------------------- Claimant --
  - method: POST
    path: "/toolworks/claimants"
    description: "Register a warranty claimant, either a consumer or a professional trade account."
    roles: [WarrantyAdministrator, PlatformAdmin]
    code: 201
    input: [email, claimant_type]
    output: Claimant
    side_effects: ["status initialised to ACTIVE", "both fraud scores initialised to 0", "lifetime_claim_count initialised to 0"]

  - method: GET
    path: "/toolworks/claimants"
    description: "List claimants with pagination."
    roles: [WarrantyAdministrator, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "status?", "claimant_type?"]
    output: Claimant[]
    side_effects: []

  - method: GET
    path: "/toolworks/claimants/{id}"
    description: "Fetch one claimant with both fraud-score variants side by side."
    roles: [WarrantyAdministrator, Claimant, PlatformAdmin]
    code: 200
    input: []
    output: Claimant
    side_effects: []

  - method: POST
    path: "/toolworks/claimants/{id}/block"
    description: "Block a claimant from filing further warranty claims after confirmed abuse."
    roles: [WarrantyAdministrator, PlatformAdmin]
    code: 200
    input: [block_reason]
    output: Claimant
    side_effects: ["status ACTIVE -> BLOCKED", "existing claims are left in place", "version increments"]

  # ------------------------------------------------------------ WarrantyClaim -
  - method: POST
    path: "/toolworks/warranty-claims"
    description: "Intake a lifetime-warranty claim. Scores the claimant with the INTAKE fraud variant and auto-holds the claim when the score reaches the programme threshold."
    roles: [Claimant, WarrantyAdministrator, PlatformAdmin]
    code: 201
    input: [claimant_id, sku_id, program_id, serial_code, claim_reason]
    output: WarrantyClaim
    side_effects:
      - "calculation claimant_fraud_score variant INTAKE updates Claimant.fraud_risk_score_intake and freezes fraud_score_at_intake on the claim"
      - "Claimant.lifetime_claim_count increments"
      - "status SUBMITTED, or FRAUD_HOLD with hold_reason INTAKE_FRAUD_SCORE and held_by_user_id null when fraud_score_at_intake >= program.fraud_score_threshold"
      - "when auto-held, WarrantyProgram.open_hold_count increments and its version increments"
      - "line_count, replacement_unit_count and reserve_charge_cents initialised to 0"

  - method: GET
    path: "/toolworks/warranty-claims"
    description: "List warranty claims. Filter by claimant_id, sku_id or program_id to reach a claim from any of its three parents."
    roles: [WarrantyAdministrator, BrandProtectionAnalyst, ChannelManager, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "claimant_id?", "sku_id?", "program_id?", "status?"]
    output: WarrantyClaim[]
    side_effects: []

  - method: GET
    path: "/toolworks/warranty-claims/{id}"
    description: "Fetch one warranty claim with its frozen intake fraud score, reserve charge and hold metadata."
    roles: [WarrantyAdministrator, Claimant, BrandProtectionAnalyst, PlatformAdmin]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []

  - method: POST
    path: "/toolworks/warranty-claims/{id}/lines"
    description: "Add a replacement component line to an open claim. Each line's reserve share is rounded to whole cents before the claim total is summed."
    roles: [Claimant, WarrantyAdministrator, PlatformAdmin]
    code: 201
    input: [component_code, component_list_price_cents, quantity]
    output: ClaimLine
    side_effects:
      - "calculation claim_reserve_charge recomputes reserve_charge_cents, replacement_unit_count and line_count on the claim"
      - "WarrantyClaim.version increments"

  - method: GET
    path: "/toolworks/warranty-claims/{id}/lines"
    description: "List a claim's replacement component lines in creation order with their per-line reserve shares."
    roles: [WarrantyAdministrator, Claimant, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: ClaimLine[]
    side_effects: []

  - method: POST
    path: "/toolworks/warranty-claims/{id}/hold"
    description: "Place a submitted claim on fraud hold for manual review, recording the acting administrator for segregation of duties."
    roles: [WarrantyAdministrator, BrandProtectionAnalyst, PlatformAdmin]
    code: 200
    input: [hold_reason]
    output: WarrantyClaim
    side_effects:
      - "status SUBMITTED -> FRAUD_HOLD; held_by_user_id set from X-User-ID"
      - "calculation claimant_fraud_score variant ADJUDICATION recomputed"
      - "WarrantyProgram.open_hold_count increments; programme version increments"

  - method: POST
    path: "/toolworks/warranty-claims/{id}/clear-hold"
    description: "Clear a fraud hold and return the claim to SUBMITTED. The administrator who placed the hold may not clear it."
    roles: [WarrantyAdministrator, PlatformAdmin]
    code: 200
    input: [clearance_note]
    output: WarrantyClaim
    side_effects:
      - "status FRAUD_HOLD -> SUBMITTED; fraud_cleared set true; hold_reason and held_by_user_id cleared to null"
      - "calculation claimant_fraud_score variant ADJUDICATION recomputed"
      - "WarrantyProgram.open_hold_count decrements; programme version increments"

  - method: POST
    path: "/toolworks/warranty-claims/{id}/approve"
    description: "Approve a submitted claim, reserving replacement units and charging the programme reserve. Guarded by expected_program_version against a stale read of the reserve balance."
    roles: [WarrantyAdministrator, PlatformAdmin]
    code: 200
    input: [expected_program_version]
    output: WarrantyClaim
    side_effects:
      - "calculation claim_reserve_charge freezes reserve_charge_cents"
      - "calculation claimant_fraud_score variant ADJUDICATION recomputed and gated against the programme threshold"
      - "status SUBMITTED -> APPROVED"
      - "calculation reserve_ledger debits WarrantyProgram.reserve_balance_cents; programme version increments"
      - "calculation replacement_unit_ledger moves units from units_on_hand to units_reserved on the SKU; SKU version increments"

  - method: POST
    path: "/toolworks/warranty-claims/{id}/deny"
    description: "Deny a submitted claim on ordinary merits (out of scope, misuse, not our product)."
    roles: [WarrantyAdministrator, PlatformAdmin]
    code: 200
    input: [denial_code]
    output: WarrantyClaim
    side_effects:
      - "status SUBMITTED -> DENIED; no reserve or unit movement"
      - "calculation claimant_fraud_score variant ADJUDICATION recomputed"

  - method: POST
    path: "/toolworks/warranty-claims/{id}/deny-fraud"
    description: "Deny a held claim as fraudulent. A distinct terminal state from DENIED so fraud denials are separately auditable."
    roles: [WarrantyAdministrator, BrandProtectionAnalyst, PlatformAdmin]
    code: 200
    input: [denial_code]
    output: WarrantyClaim
    side_effects:
      - "status FRAUD_HOLD -> DENIED_FRAUD"
      - "WarrantyProgram.open_hold_count decrements; programme version increments"
      - "calculation claimant_fraud_score variant ADJUDICATION recomputed"

  - method: POST
    path: "/toolworks/warranty-claims/{id}/fulfill"
    description: "Ship the approved replacement, converting reserved units into shipped units."
    roles: [WarrantyAdministrator, PlatformAdmin]
    code: 200
    input: [shipment_ref]
    output: WarrantyClaim
    side_effects:
      - "status APPROVED -> FULFILLED"
      - "calculation replacement_unit_ledger moves units from units_reserved to units_shipped; SKU version increments"
      - "the reserve charge stays booked (FULFILLED remains in the charged set)"

  - method: POST
    path: "/toolworks/warranty-claims/{id}/revoke"
    description: "Revoke an approved or fulfilled claim discovered to be fraudulent, compensating every side effect of the approval with no drift in either ledger."
    roles: [WarrantyAdministrator, BrandProtectionAnalyst, PlatformAdmin]
    code: 200
    input: [revocation_reason]
    output: WarrantyClaim
    side_effects:
      - "status APPROVED or FULFILLED -> REVOKED; reserve_charge_cents retained on the row for audit"
      - "calculation reserve_ledger credits the reserve back to its pre-approval value; programme version increments"
      - "calculation replacement_unit_ledger returns the units to units_on_hand; SKU version increments"
      - "calculation claimant_fraud_score variant ADJUDICATION recomputed with the claim removed from the set"

  # ------------------------------------------------------- CounterfeitReport --
  - method: POST
    path: "/toolworks/counterfeit-reports"
    description: "File a suspected-counterfeit sighting in a secondary channel against a genuine SKU. Freezes the report's risk_points from its evidence grade, unit estimate and the SKU's channel exposure."
    roles: [BrandProtectionAnalyst, ChannelManager, PlatformAdmin]
    code: 201
    input: [sku_id, channel_name, seller_handle, evidence_grade, unit_estimate]
    output: CounterfeitReport
    side_effects:
      - "calculation brand_risk_rollup freezes risk_points on the report"
      - "status initialised to OPEN; the SKU's brand_risk_score is NOT yet affected"

  - method: GET
    path: "/toolworks/counterfeit-reports"
    description: "List counterfeit reports with pagination and status filtering."
    roles: [BrandProtectionAnalyst, ChannelManager, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "status?", "evidence_grade?"]
    output: CounterfeitReport[]
    side_effects: []

  - method: GET
    path: "/toolworks/counterfeit-reports/{id}"
    description: "Fetch one counterfeit report with its frozen risk_points."
    roles: [BrandProtectionAnalyst, ChannelManager, PlatformAdmin]
    code: 200
    input: []
    output: CounterfeitReport
    side_effects: []

  - method: POST
    path: "/toolworks/counterfeit-reports/{id}/confirm"
    description: "Confirm a counterfeit sighting. Rolls the report's risk points into the SKU's brand risk score, re-derives its warranty posture, and cascades a fraud hold onto every submitted claim on that SKU."
    roles: [BrandProtectionAnalyst, PlatformAdmin]
    code: 200
    input: [confirmation_note]
    output: CounterfeitReport
    side_effects:
      - "cascade A link 1: status OPEN -> CONFIRMED"
      - "cascade A link 2: calculation brand_risk_rollup recomputes ToolSku.brand_risk_score and confirmed_counterfeit_count"
      - "cascade A link 3: ToolSku.warranty_posture re-derived (>= 40 RESTRICTED, >= 85 SUSPENDED); SKU version increments"
      - "cascade A link 4: when the posture leaves OPEN, every SUBMITTED WarrantyClaim on that SKU -> FRAUD_HOLD with hold_reason COUNTERFEIT_POSTURE and held_by_user_id null; WarrantyProgram.open_hold_count and version updated"
      - "cascade A link 5: calculation claimant_fraud_score variant ADJUDICATION recomputed for every affected Claimant, adding COUNTERFEIT_LINK_PENALTY"
      - "when the posture becomes SUSPENDED, every APPROVED PackConfiguration containing that SKU -> WITHDRAWN"

  - method: POST
    path: "/toolworks/counterfeit-reports/{id}/dismiss"
    description: "Dismiss an unfounded counterfeit sighting. A DISMISSED report never contributes to the SKU's brand risk score."
    roles: [BrandProtectionAnalyst, PlatformAdmin]
    code: 200
    input: [dismissal_note]
    output: CounterfeitReport
    side_effects: ["status OPEN -> DISMISSED", "no change to ToolSku.brand_risk_score or warranty_posture"]

  # --------------------------------------------------- test-driving endpoint --
  - method: POST
    path: "/toolworks/_clock/set_current_utc"
    description: "Set the server's logical UTC clock, used by the INTAKE fraud-score rolling window and by certified_at stamping. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["subsequent CLAIM_WINDOW_DAYS evaluations and certified_at stamps use the new instant"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # ---- authentication / authorization ----
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role header absent or not a role declared in §1.7"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The calling role is not listed in the endpoint's roles"
  - id: ERR_CLAIMANT_MISMATCH
    http: 403
    condition: "A caller acting as Claimant addresses a WarrantyClaim whose claimant_id differs from X-User-ID, or files a claim for another claimant_id"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The X-User-ID clearing a fraud hold equals the claim's held_by_user_id"

  # ---- not found ----
  - id: ERR_TOOL_SKU_NOT_FOUND
    http: 404
    condition: "No ToolSku with the given id (path {id}, body sku_id, primary_sku_id or supersedes_sku_id)"
  - id: ERR_PRODUCTION_LOT_NOT_FOUND
    http: 404
    condition: "No ProductionLot with the given id (path {id} or body lot_id)"
  - id: ERR_FURNACE_NOT_FOUND
    http: 404
    condition: "No HeatTreatFurnace with the given id (path {id} or body furnace_id)"
  - id: ERR_CAMPAIGN_NOT_FOUND
    http: 404
    condition: "No FurnaceCampaign with the given id"
  - id: ERR_CHAMBER_NOT_FOUND
    http: 404
    condition: "No SaltSprayChamber with the given id (path {id} or body chamber_id)"
  - id: ERR_TEST_RUN_NOT_FOUND
    http: 404
    condition: "No TestRun with the given id"
  - id: ERR_PACK_CONFIG_NOT_FOUND
    http: 404
    condition: "No PackConfiguration with the given id"
  - id: ERR_WARRANTY_PROGRAM_NOT_FOUND
    http: 404
    condition: "No WarrantyProgram with the given id (path {id} or body program_id)"
  - id: ERR_CLAIMANT_NOT_FOUND
    http: 404
    condition: "No Claimant with the given id (path {id} or body claimant_id)"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "No WarrantyClaim with the given id"
  - id: ERR_REPORT_NOT_FOUND
    http: 404
    condition: "No CounterfeitReport with the given id"

  # ---- request shape ----
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "A required input field is missing, of the wrong type, outside its declared numeric range, or carries an undeclared enum member"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside 1..100 or offset negative"
  - id: ERR_INVALID_WINDOW
    http: 400
    condition: "window_start is not strictly before window_end, or either instant is not a whole-minute UTC timestamp"
  - id: ERR_READING_COUNT_MISMATCH
    http: 422
    condition: "The readings array length does not equal the TestRun's specimen_count"
  - id: ERR_CHAMBER_REQUIRED
    http: 422
    condition: "A SALT_SPRAY TestRun is scheduled without chamber_id"
  - id: ERR_CHAMBER_NOT_APPLICABLE
    http: 422
    condition: "chamber_id supplied for a test_type other than SALT_SPRAY"

  # ---- state preconditions ----
  - id: ERR_LOT_CERT_STATE_INVALID
    http: 409
    condition: "The lot's cert_status is not in the requested transition's from_state set"
  - id: ERR_LOT_PROCESS_STATE_INVALID
    http: 409
    condition: "target_process_status is not the immediate successor of the lot's current process_status"
  - id: ERR_LOT_QUARANTINED
    http: 409
    condition: "The lot's disposition is QUARANTINED, which blocks scheduling, advancing, certification and release until rework"
  - id: ERR_LOT_ALREADY_DISPOSITIONED
    http: 409
    condition: "Release attempted on a lot whose disposition is already RELEASED"
  - id: ERR_TEST_RUN_STATE_INVALID
    http: 409
    condition: "Results or void requested on a TestRun whose status is not SCHEDULED"
  - id: ERR_CAMPAIGN_STATE_INVALID
    http: 409
    condition: "Completion requested on a FurnaceCampaign whose status is not SCHEDULED"
  - id: ERR_PACK_STATE_INVALID
    http: 409
    condition: "Member addition or approval on a non-DRAFT pack, or withdrawal of a non-APPROVED pack"
  - id: ERR_CLAIM_STATE_INVALID
    http: 409
    condition: "The claim's status is not in the requested transition's from_state set"
  - id: ERR_REPORT_STATE_INVALID
    http: 409
    condition: "Confirm or dismiss requested on a CounterfeitReport whose status is not OPEN"
  - id: ERR_CLAIMANT_STATE_INVALID
    http: 409
    condition: "Block requested on a Claimant whose status is not ACTIVE"
  - id: ERR_CLAIMANT_BLOCKED
    http: 409
    condition: "A BLOCKED Claimant is named on a new warranty claim"
  - id: ERR_FURNACE_STATUS_UNCHANGED
    http: 409
    condition: "The requested furnace status equals its current status"

  # ---- optimistic concurrency ----
  - id: ERR_STALE_SKU_VERSION
    http: 412
    condition: "expected_sku_version does not equal the current ToolSku.version"
  - id: ERR_STALE_PROGRAM_VERSION
    http: 412
    condition: "expected_program_version does not equal the current WarrantyProgram.version"

  # ---- cross-entity state dependencies ----
  - id: ERR_HEAT_TREAT_NOT_COMPLETED
    http: 409
    condition: "Advance to HEAT_TREATED with no COMPLETED FurnaceCampaign on the lot"
  - id: ERR_SKU_WARRANTY_RESTRICTED
    http: 409
    condition: "Claim approval on a SKU whose warranty_posture is RESTRICTED or SUSPENDED"
  - id: ERR_FURNACE_UNAVAILABLE
    http: 409
    condition: "Campaign scheduled on a furnace whose status is MAINTENANCE"
  - id: ERR_MEMBER_SKU_NOT_CERTIFIED
    http: 409
    condition: "Pack approval while some member SKU has no CERTIFIED production lot"
  - id: ERR_MEMBER_SKU_RESTRICTED
    http: 409
    condition: "Pack approval while some member SKU has warranty_posture SUSPENDED"

  # ---- business safety / qualification ----
  - id: ERR_ALLOY_NOT_SUPPORTED
    http: 422
    condition: "The furnace is not qualified for the lot SKU's alloy_grade"
  - id: ERR_TEST_STAGE_TOO_EARLY
    http: 409
    condition: "A test type is scheduled before the lot's process_status has reached the stage that test requires"
  - id: ERR_MANDATORY_TEST_MISSING
    http: 422
    condition: "Certification attempted without a PASSED run for every mandatory test type of the tool family"
  - id: ERR_FAILED_TEST_PRESENT
    http: 409
    condition: "Certification attempted while a TestRun on the lot is FAILED"
  - id: ERR_HARDNESS_MARGIN_NOT_MET
    http: 422
    condition: "hardness_index_pooled is below the alloy minimum plus the channel hardness margin"
  - id: ERR_LOT_NOT_CERTIFIED
    http: 409
    condition: "Release attempted on a lot whose cert_status is not CERTIFIED"
  - id: ERR_WARRANTY_TIER_NOT_COVERED
    http: 422
    condition: "A claim is filed against a SKU whose warranty_tier is NONE"
  - id: ERR_REWORK_LIMIT_EXCEEDED
    http: 409
    condition: "Rework attempted when rework_cycle_count has already reached REWORK_LIMIT"
  - id: ERR_SOAK_TIME_TOO_SHORT
    http: 422
    condition: "Campaign completion reports soak_minutes below MIN_SOAK_MINUTES"

  # ---- business temporal ----
  - id: ERR_FURNACE_WINDOW_CONFLICT
    http: 409
    condition: "The requested furnace window, expanded by the trailing ramp buffer, intersects a SCHEDULED or COMPLETED campaign's buffered window on the same furnace"
  - id: ERR_TEST_WINDOW_BEFORE_HEAT_TREAT
    http: 422
    condition: "A heat-treat-dependent test window starts before the lot's earliest COMPLETED campaign window_end"

  # ---- business capacity ----
  - id: ERR_FURNACE_CHARGE_EXCEEDED
    http: 422
    condition: "charge_kg exceeds the furnace's max_charge_kg"
  - id: ERR_SPECIMENS_EXHAUSTED
    http: 409
    condition: "specimen_count exceeds the lot's specimens_available"
  - id: ERR_CHAMBER_CAPACITY_EXCEEDED
    http: 409
    condition: "Peak additive coupon occupancy in the salt-spray chamber would exceed coupon_capacity at some instant of the requested interval"
  - id: ERR_REPLACEMENT_STOCK_INSUFFICIENT
    http: 409
    condition: "The SKU's units_on_hand is below the claim's replacement_unit_count"

  # ---- business fiscal ----
  - id: ERR_RESERVE_INSUFFICIENT
    http: 402
    condition: "The programme's reserve_balance_cents is below the claim's reserve_charge_cents"
  - id: ERR_FRAUD_SCORE_TOO_HIGH
    http: 409
    condition: "The claimant's ADJUDICATION fraud score is at or above the programme's fraud_score_threshold at approval time"

  # ---- business integrity ----
  - id: ERR_CLAIM_HAS_NO_LINES
    http: 422
    condition: "Approval attempted on a claim with line_count 0"
  - id: ERR_DUPLICATE_OPEN_CLAIM
    http: 409
    condition: "The claimant already holds a SUBMITTED, FRAUD_HOLD or APPROVED claim on the same sku_id and serial_code"
  - id: ERR_SKU_LINEAGE_CYCLE
    http: 422
    condition: "supersedes_sku_id would close a cycle in the supersedes chain, including a direct self-reference"
  - id: ERR_LINEAGE_FAMILY_MISMATCH
    http: 422
    condition: "A superseding SKU's tool_family differs from that of the SKU it supersedes"
  - id: ERR_LINEAGE_DEPTH_EXCEEDED
    http: 422
    condition: "The supersedes chain would exceed LINEAGE_MAX_DEPTH hops"
  - id: ERR_DUPLICATE_PACK_MEMBER
    http: 409
    condition: "The SKU already appears among the pack's members"
  - id: ERR_CHANNEL_MIX_FORBIDDEN
    http: 422
    condition: "A pack member's channel differs from the channel already established for the pack"
  - id: ERR_PACK_CONFIG_INVALID
    http: 422
    condition: "The pack's member composition violates the shape rules for its pack_type"
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "A globally unique business code (sku_code, lot_code, furnace_code, chamber_code, pack_code, program_code) or claimant email is reused"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
# Role model: segregation_of_duties. Manufacturing, quality, commercial, warranty
# and brand protection are separate offices; no operational role can reach into
# another's exclusive surface. PlatformAdmin is the only role listed on every
# endpoint and exists so that fixtures can compose an end-to-end chain, but it
# is NOT a hierarchical override for the two duty separations that matter:
#   (1) the fraud-hold placer may not clear the same hold (ERR_SEGREGATION_OF_DUTIES,
#       enforced on X-User-ID regardless of role, including PlatformAdmin);
#   (2) certification (QualityEngineer) is separated from release (ProductionPlanner).
# =============================================================================
roles:

  - name: ChannelManager
    description: "Owns the commercial product surface: SKU definition across branded, private-label and professional channels, list pricing, warranty tier assignment, supersession lineage, and retail pack configuration."
    identity: "opaque"
    exclusive_operations:
      - "POST /toolworks/tool-skus"
      - "PATCH /toolworks/tool-skus/{id}"
      - "POST /toolworks/tool-skus/{id}/stock-receipts"
      - "POST /toolworks/pack-configurations"
      - "POST /toolworks/pack-configurations/{id}/members"
      - "POST /toolworks/pack-configurations/{id}/approve"
    shared_operations:
      - "POST /toolworks/pack-configurations/{id}/withdraw (with BrandProtectionAnalyst)"
      - "POST /toolworks/counterfeit-reports (with BrandProtectionAnalyst)"
      - "GET on tool-skus, pack-configurations, counterfeit-reports, production-lots, warranty-programs and warranty-claims lists"

  - name: ProductionPlanner
    description: "Owns the shop floor: lot opening, stage advancement, furnace registration and status, heat-treat campaign scheduling and completion, rework, and release of certified lots into finished stock."
    identity: "opaque"
    exclusive_operations:
      - "POST /toolworks/production-lots"
      - "POST /toolworks/production-lots/{id}/advance"
      - "POST /toolworks/production-lots/{id}/rework"
      - "POST /toolworks/production-lots/{id}/release"
      - "POST /toolworks/heat-treat-furnaces"
      - "POST /toolworks/heat-treat-furnaces/{id}/status"
      - "POST /toolworks/furnace-campaigns"
      - "POST /toolworks/furnace-campaigns/{id}/complete"
    shared_operations:
      - "GET on production-lots, test-runs, furnace-campaigns, heat-treat-furnaces, salt-spray-chambers and tool-skus"
    note: "Cannot certify a lot; certification is QualityEngineer's exclusive act. This is the second duty separation."

  - name: QualityEngineer
    description: "Owns qualification testing: salt-spray chamber registration, test scheduling and specimen commitment, results adjudication against industry performance standards, run voiding, and lot certification."
    identity: "opaque"
    exclusive_operations:
      - "POST /toolworks/salt-spray-chambers"
      - "POST /toolworks/test-runs"
      - "POST /toolworks/test-runs/{id}/results"
      - "POST /toolworks/test-runs/{id}/void"
      - "POST /toolworks/production-lots/{id}/certify"
    shared_operations:
      - "GET on test-runs, production-lots, furnace-campaigns, heat-treat-furnaces, salt-spray-chambers and tool-skus"
    note: "Cannot advance, rework or release a lot; those are ProductionPlanner's exclusive acts."

  - name: WarrantyAdministrator
    description: "Owns lifetime-warranty administration: programme funding, claimant registration and blocking, claim adjudication, reserve charging, replacement fulfilment and revocation."
    identity: "opaque"
    exclusive_operations:
      - "POST /toolworks/warranty-programs"
      - "POST /toolworks/claimants"
      - "POST /toolworks/claimants/{id}/block"
      - "POST /toolworks/warranty-claims/{id}/clear-hold"
      - "POST /toolworks/warranty-claims/{id}/approve"
      - "POST /toolworks/warranty-claims/{id}/deny"
      - "POST /toolworks/warranty-claims/{id}/fulfill"
    shared_operations:
      - "POST /toolworks/warranty-claims (with Claimant)"
      - "POST /toolworks/warranty-claims/{id}/lines (with Claimant)"
      - "POST /toolworks/warranty-claims/{id}/hold (with BrandProtectionAnalyst)"
      - "POST /toolworks/warranty-claims/{id}/deny-fraud (with BrandProtectionAnalyst)"
      - "POST /toolworks/warranty-claims/{id}/revoke (with BrandProtectionAnalyst)"
      - "GET on warranty-programs, claimants, warranty-claims and tool-skus"

  - name: BrandProtectionAnalyst
    description: "Owns counterfeit detection and brand protection in secondary channels: sighting intake, confirmation or dismissal, and the fraud-side interventions on warranty claims that a confirmed counterfeit implies."
    identity: "opaque"
    exclusive_operations:
      - "POST /toolworks/counterfeit-reports/{id}/confirm"
      - "POST /toolworks/counterfeit-reports/{id}/dismiss"
    shared_operations:
      - "POST /toolworks/counterfeit-reports (with ChannelManager)"
      - "POST /toolworks/warranty-claims/{id}/hold (with WarrantyAdministrator)"
      - "POST /toolworks/warranty-claims/{id}/deny-fraud (with WarrantyAdministrator)"
      - "POST /toolworks/warranty-claims/{id}/revoke (with WarrantyAdministrator)"
      - "POST /toolworks/pack-configurations/{id}/withdraw (with ChannelManager)"
      - "GET on counterfeit-reports, tool-skus and warranty-claims"
    note: "May place a fraud hold but MUST NOT clear one — clear-hold is exclusive to WarrantyAdministrator, and even a WarrantyAdministrator cannot clear a hold they themselves placed."

  - name: Claimant
    description: "The end consumer or professional trade account filing a lifetime-warranty claim on a tool they own. Sees and touches only their own claims."
    identity: "entity_backed:Claimant"
    exclusive_operations: []
    shared_operations:
      - "POST /toolworks/warranty-claims (own claimant_id only, with WarrantyAdministrator)"
      - "POST /toolworks/warranty-claims/{id}/lines (own claims only, with WarrantyAdministrator)"
      - "GET /toolworks/warranty-claims/{id} (own claims only)"
      - "GET /toolworks/warranty-claims/{id}/lines"
      - "GET /toolworks/claimants/{id}"
    note: "X-User-ID must equal the id of a Claimant row; any claim addressed must have claimant_id equal to it, else ERR_CLAIMANT_MISMATCH."

  - name: PlatformAdmin
    description: "Operator role listed on every endpoint so an end-to-end fixture chain can be composed by one caller. Also the only role permitted to move the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /toolworks/_clock/set_current_utc"
    shared_operations:
      - "every other endpoint in §1.5, shared with the role that owns it"
    note: "Not a segregation-of-duties escape hatch: the held_by_user_id check on clear-hold compares X-User-ID and applies to PlatformAdmin identically."
