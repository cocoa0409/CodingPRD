# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
#      Task 2970 — Public Land Grazing Permit Administration
#      Nine §0.5 rule_ids, 21 instances. Every numeric literal in `assert:` was
#      computed by executing the referenced §1.3 formula with its constants.
#      Logical clock starts at 2026-08-01T00:00:00Z (see §1.5
#      POST /_clock/set_current_utc) and only ever moves forward.
# =============================================================================

scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: preliminary_vs_final_use_bill_divergence
        grounds:
          - calculations.use_bill_amount
          - calculations.actual_use_aggregation
          - state_machines.AnnualOperatingInstruction.DRAFT_to_ISSUED
          - state_machines.AnnualOperatingInstruction.USE_REPORTED_to_BILLED
          - entities.GrazingBill.fields.bill_type
          - entities.GrazingBill.fields.superseded_bill_id
        distinguishing_aspect: |
          The money domain (GrazingBill cents raised against an AnnualOperatingInstruction)
          runs use_bill_amount twice over the SAME AOI: the PRELIMINARY variant bills the
          integer authorized_aums (300 -> 54100 cents, admin tier 2 applies) while the FINAL
          variant bills the 2-decimal actual_aums_total (153.34 -> 26374 cents, admin tier 1
          applies), so the two variants differ by -27726 cents and even land in different
          administrative-fee tiers.
        test_recipe:
          setup:
            - "One allotment with 1200 permitted AUMs, a year-round season and two pastures of 300 AUM capacity each"
            - "One permittee in good standing (outstanding_balance_cents 0) holding a LAND base property qualifying 400 AUMs"
            - "One ISSUED permit for 300 AUMs, and a 2026 AOI authorized at 300 AUMs with two scheduled pasture windows (103.33 + 100.00 planned AUMs)"
            - "Logical clock left at its 2026-08-01T00:00:00Z default"
          setup_api_calls:
            - call: "POST /allotments"
              payload: { name: "Sage Creek Allotment", admin_unit_code: "NV-042", acres: 40000, total_permitted_aums: 1200, season_start: "01-01", season_end: "12-31", required_pasture_rotation_count: 2 }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { a1_id: "$.data.id" }
            - call: "POST /allotments/${a1_id}/pastures"
              payload: { name: "North Pasture", pasture_aum_capacity: 300, sequence_order: 1, rest_required: false }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { p1_id: "$.data.id" }
            - call: "POST /allotments/${a1_id}/pastures"
              payload: { name: "South Pasture", pasture_aum_capacity: 300, sequence_order: 2, rest_required: false }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { p2_id: "$.data.id" }
            - call: "POST /permittees"
              payload: { name: "Bar-7 Ranch", contact_email: "bar7@example.com" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { m1_id: "$.data.id" }
            - call: "POST /permittees/${m1_id}/base-properties"
              payload: { base_property_type: "LAND", legal_description: "T21N R48E Sec 14 SW", carrying_capacity_aums: 400, controlled_since_date: "2015-03-01" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { bp1_id: "$.data.id" }
            - call: "POST /grazing-permits"
              payload: { allotment_id: "${a1_id}", permittee_id: "${m1_id}", base_property_id: "${bp1_id}", requested_aums: 300, term_start_date: "2026-01-01", term_end_date: "2030-12-31", livestock_kind: "CATTLE" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { g1_id: "$.data.id" }
            - call: "POST /grazing-permits/${g1_id}/issue"
              payload: {}
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
            - call: "POST /annual-operating-instructions"
              payload: { permit_id: "${g1_id}", grazing_year: 2026, authorized_aums: 300, season_start_date: "2026-01-01", season_end_date: "2026-12-31" }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
              captures: { aoi1_id: "$.data.id" }
            - call: "POST /annual-operating-instructions/${aoi1_id}/use-records"
              payload: { pasture_id: "${p1_id}", planned_entry_date: "2026-04-01", planned_exit_date: "2026-05-02", planned_head_count: 100, livestock_kind: "CATTLE" }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
              captures: { ur1_id: "$.data.id" }
            - call: "POST /annual-operating-instructions/${aoi1_id}/use-records"
              payload: { pasture_id: "${p2_id}", planned_entry_date: "2026-05-02", planned_exit_date: "2026-06-01", planned_head_count: 100, livestock_kind: "CATTLE" }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
              captures: { ur2_id: "$.data.id" }
          trigger:
            - call: "POST /annual-operating-instructions/${aoi1_id}/issue"
              payload: {}
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
            - call: "GET /grazing-bills"
              payload: { aoi_id: "${aoi1_id}", bill_type: "PRELIMINARY_USE" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { prelim_bill_id: "$.data.items[0].id" }
            - call: "POST /pasture-use-records/${ur1_id}/report-actual-use"
              payload: { actual_entry_date: "2026-04-01", actual_exit_date: "2026-04-24", actual_head_count: 100 }
              as: Permittee
              as_user_id: "${m1_id}"
            - call: "POST /pasture-use-records/${ur2_id}/report-actual-use"
              payload: { actual_entry_date: "2026-05-02", actual_exit_date: "2026-05-25", actual_head_count: 100 }
              as: Permittee
              as_user_id: "${m1_id}"
            - call: "POST /annual-operating-instructions/${aoi1_id}/accept-use-report"
              payload: {}
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
            - call: "GET /grazing-bills"
              payload: { aoi_id: "${aoi1_id}", bill_type: "FINAL_USE" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { final_bill_id: "$.data.items[0].id" }
          assert:
            - "GrazingBill.${prelim_bill_id}.billed_aums == 300"
            - "GrazingBill.${prelim_bill_id}.base_amount_cents == 51600"
            - "GrazingBill.${prelim_bill_id}.admin_fee_cents == 2500"
            - "GrazingBill.${prelim_bill_id}.total_amount_cents == 54100"
            - "GrazingBill.${prelim_bill_id}.due_date == 2026-08-31"
            - "AnnualOperatingInstruction.${aoi1_id}.actual_aums_total == 153.34"
            - "GrazingBill.${final_bill_id}.billed_aums == 153.34"
            - "GrazingBill.${final_bill_id}.base_amount_cents == 26374"
            - "GrazingBill.${final_bill_id}.admin_fee_cents == 0"
            - "GrazingBill.${final_bill_id}.total_amount_cents == 26374"
            - "GrazingBill.${final_bill_id}.superseded_bill_id == ${prelim_bill_id}"
            - "GrazingBill.${prelim_bill_id}.bill_status == VOIDED"
            - "GrazingBill.${final_bill_id}.total_amount_cents - GrazingBill.${prelim_bill_id}.total_amount_cents == -27726"
            - "Permittee.${m1_id}.outstanding_balance_cents == 26374"
            - "AnnualOperatingInstruction.${aoi1_id}.aoi_status == BILLED"

      - name: stocking_recommendation_variant_divergence
        grounds:
          - calculations.stocking_adjustment_recommendation
          - calculations.rangeland_health_determination
          - state_machines.RangelandHealthAssessment.FIELD_REVIEW_to_FINALIZED
          - entities.RangelandHealthAssessment.fields.monitoring_method
          - entities.RangelandHealthAssessment.fields.recommended_reduction_pct
        distinguishing_aspect: |
          This dual variant lives in a different entity domain from the billing variant — it is
          resource scoring on a RangelandHealthAssessment, not cost accounting on a
          GrazingBill/AOI — and the selector is monitoring_method: two assessments carrying
          byte-identical sub-scores, standards_not_met and causal_factor_is_livestock produce
          recommended_reduction_pct 0.2000 under PROPORTIONAL_STANDARDS (which ignores
          observed_utilization_pct) and 0.3590 under UTILIZATION_BASED (which ignores
          standards_not_met and causal_factor_is_livestock).
        test_recipe:
          setup:
            - "Two allotments, each with no prior assessment (the one-FINALIZED-assessment-per-allotment-year rule forces separate allotments)"
            - "Two DRAFT assessments for grazing year 2026 with identical scores (upland 62, riparian 44, water quality 51), identical standards_not_met [UPLAND_HEALTH], identical causal_factor_is_livestock true and identical observed_utilization_pct 78, differing ONLY in monitoring_method"
            - "Both assessments submitted to FIELD_REVIEW by their author"
          setup_api_calls:
            - call: "POST /allotments"
              payload: { name: "Indicator Unit", admin_unit_code: "NV-051", acres: 30000, total_permitted_aums: 900, season_start: "01-01", season_end: "12-31", required_pasture_rotation_count: 1 }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { ax_id: "$.data.id" }
            - call: "POST /allotments"
              payload: { name: "Utilization Unit", admin_unit_code: "NV-052", acres: 30000, total_permitted_aums: 900, season_start: "01-01", season_end: "12-31", required_pasture_rotation_count: 1 }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { ay_id: "$.data.id" }
            - call: "POST /rangeland-health-assessments"
              payload: { allotment_id: "${ax_id}", assessment_year: 2026, monitoring_method: "INDICATOR_ASSESSMENT", upland_score: 62, riparian_score: 44, water_quality_score: 51, observed_utilization_pct: 78, standards_not_met: ["UPLAND_HEALTH"], causal_factor_is_livestock: true }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
              captures: { as_x_id: "$.data.id" }
            - call: "POST /rangeland-health-assessments"
              payload: { allotment_id: "${ay_id}", assessment_year: 2026, monitoring_method: "UTILIZATION_MAPPING", upland_score: 62, riparian_score: 44, water_quality_score: 51, observed_utilization_pct: 78, standards_not_met: ["UPLAND_HEALTH"], causal_factor_is_livestock: true }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
              captures: { as_y_id: "$.data.id" }
            - call: "POST /rangeland-health-assessments/${as_x_id}/submit"
              payload: {}
              as: RangeSpecialist
              as_user_id: "u_spec_1"
            - call: "POST /rangeland-health-assessments/${as_y_id}/submit"
              payload: {}
              as: RangeSpecialist
              as_user_id: "u_spec_1"
          trigger:
            - call: "POST /rangeland-health-assessments/${as_x_id}/review"
              payload: { review_outcome: "CONCUR", review_notes: "Upland standard not met; livestock is the causal factor." }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
            - call: "POST /rangeland-health-assessments/${as_y_id}/review"
              payload: { review_outcome: "CONCUR", review_notes: "Mapped utilization is 78 percent against a 50 percent target." }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
          assert:
            - "RangelandHealthAssessment.${as_x_id}.composite_score == 52.95"
            - "RangelandHealthAssessment.${as_y_id}.composite_score == 52.95"
            - "RangelandHealthAssessment.${as_x_id}.determination == MEETING_WITH_PROBLEMS"
            - "RangelandHealthAssessment.${as_y_id}.determination == MEETING_WITH_PROBLEMS"
            - "RangelandHealthAssessment.${as_x_id}.recommended_reduction_pct == 0.2000"
            - "RangelandHealthAssessment.${as_y_id}.recommended_reduction_pct == 0.3590"
            - "RangelandHealthAssessment.${as_x_id}.recommended_reduction_pct != RangelandHealthAssessment.${as_y_id}.recommended_reduction_pct"
            - "RangelandHealthAssessment.${as_x_id}.assessment_status == FINALIZED"
            - "Allotment.${ax_id}.health_determination == MEETING_WITH_PROBLEMS"
            - "Allotment.${ay_id}.health_determination == MEETING_WITH_PROBLEMS"

  - rule_id: combinatorial_formula
    instances:
      - name: trespass_penalty_three_factor_composition
        grounds:
          - calculations.unauthorized_use_charge
          - state_machines.TrespassIncident.DETECTED_to_BILLED
          - entities.TrespassIncident.fields.prior_billed_incident_count
          - entities.TrespassIncident.fields.willfulness
          - entities.GrazingBill.fields.penalty_amount_cents
        distinguishing_aspect: |
          Mode (a): three independent inputs interact non-linearly — a CEILING on the 2-decimal
          forage quantity (17.23 -> 18 AUMs), a willfulness multiplier applied as (multiplier -
          1.0) so NON_WILLFUL yields exactly zero penalty, and a repeat factor
          min(1 + 0.25 * prior, 2.0) that multiplies the PENALTY rather than the base; with 47
          head for 11 days, REPEATED_WILLFUL and one prior billed incident the result is base
          42120 + penalty 105300 = 147420 cents.
        test_recipe:
          setup:
            - "One allotment and one permittee"
            - "One earlier NON_WILLFUL trespass incident (10 head, 10 days) already billed, so Permittee.billed_trespass_incident_count == 1"
            - "A second incident detected for 47 head over 11 days of CATTLE use, willfulness REPEATED_WILLFUL, snapshotting prior_billed_incident_count 1"
          setup_api_calls:
            - call: "POST /allotments"
              payload: { name: "Trespass Flat", admin_unit_code: "NV-060", acres: 20000, total_permitted_aums: 600, season_start: "01-01", season_end: "12-31", required_pasture_rotation_count: 1 }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { at_id: "$.data.id" }
            - call: "POST /permittees"
              payload: { name: "Rimrock Cattle Co", contact_email: "rimrock@example.com" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { mt_id: "$.data.id" }
            - call: "POST /trespass-incidents"
              payload: { allotment_id: "${at_id}", permittee_id: "${mt_id}", detected_at: "2026-06-15T14:00:00Z", head_count: 10, livestock_kind: "CATTLE", unauthorized_days: 10, willfulness: "NON_WILLFUL" }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
              captures: { ti0_id: "$.data.id" }
            - call: "POST /trespass-incidents/${ti0_id}/bill"
              payload: {}
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
            - call: "POST /trespass-incidents"
              payload: { allotment_id: "${at_id}", permittee_id: "${mt_id}", detected_at: "2026-07-20T09:00:00Z", head_count: 47, livestock_kind: "CATTLE", unauthorized_days: 11, willfulness: "REPEATED_WILLFUL" }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
              captures: { ti1_id: "$.data.id" }
          trigger:
            - call: "POST /trespass-incidents/${ti1_id}/bill"
              payload: {}
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
            - call: "GET /grazing-bills"
              payload: { trespass_incident_id: "${ti1_id}" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { tres_bill_id: "$.data.items[0].id" }
          assert:
            - "TrespassIncident.${ti1_id}.prior_billed_incident_count == 1"
            - "TrespassIncident.${ti1_id}.unauthorized_aums == 17.23"
            - "TrespassIncident.${ti1_id}.billed_aums == 18"
            - "GrazingBill.${tres_bill_id}.bill_type == UNAUTHORIZED_USE"
            - "GrazingBill.${tres_bill_id}.base_amount_cents == 42120"
            - "GrazingBill.${tres_bill_id}.penalty_amount_cents == 105300"
            - "GrazingBill.${tres_bill_id}.admin_fee_cents == 0"
            - "GrazingBill.${tres_bill_id}.total_amount_cents == 147420"
            - "TrespassIncident.${ti0_id}.billed_aums == 4"
            - "Permittee.${mt_id}.billed_trespass_incident_count == 2"
            - "Permittee.${mt_id}.outstanding_balance_cents == 156780"
            - "TrespassIncident.${ti1_id}.incident_status == BILLED"

      - name: actual_use_per_record_rounding_order
        grounds:
          - calculations.actual_use_aggregation
          - calculations.use_record_aums
          - calculations.use_bill_amount
          - state_machines.PastureUseRecord.SCHEDULED_to_ACTUAL_REPORTED
          - entities.AnnualOperatingInstruction.fields.actual_aums_total
        distinguishing_aspect: |
          Mode (b): two use records each grazing 100 head for 23 days give the raw quotient
          76.6666..., and the scaffold pins "round each record to 2dp, THEN sum" — 76.67 +
          76.67 = 153.34 and a FINAL bill base of 26374 cents. Summing raw first
          (153.3333... * 172) yields 26373, so the one-cent difference falsifies any
          implementation that defers the rounding to the aggregate.
        test_recipe:
          setup:
            - "An allotment with 1200 permitted AUMs and two 300-AUM pastures, a permittee in good standing with a 400-AUM LAND base property"
            - "An ISSUED 300-AUM permit and an ISSUED 2026 AOI with two scheduled windows on separate pastures"
            - "Both windows reported as 23 actual grazing days with 100 head"
          setup_api_calls:
            - call: "POST /allotments"
              payload: { name: "Rounding Draw Allotment", admin_unit_code: "NV-043", acres: 40000, total_permitted_aums: 1200, season_start: "01-01", season_end: "12-31", required_pasture_rotation_count: 2 }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { a2_id: "$.data.id" }
            - call: "POST /allotments/${a2_id}/pastures"
              payload: { name: "West Pasture", pasture_aum_capacity: 300, sequence_order: 1, rest_required: false }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { p3_id: "$.data.id" }
            - call: "POST /allotments/${a2_id}/pastures"
              payload: { name: "East Pasture", pasture_aum_capacity: 300, sequence_order: 2, rest_required: false }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { p4_id: "$.data.id" }
            - call: "POST /permittees"
              payload: { name: "Willow Springs LLC", contact_email: "willow@example.com" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { m2_id: "$.data.id" }
            - call: "POST /permittees/${m2_id}/base-properties"
              payload: { base_property_type: "LAND", legal_description: "T19N R46E Sec 08 NE", carrying_capacity_aums: 400, controlled_since_date: "2018-05-01" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { bp2_id: "$.data.id" }
            - call: "POST /grazing-permits"
              payload: { allotment_id: "${a2_id}", permittee_id: "${m2_id}", base_property_id: "${bp2_id}", requested_aums: 300, term_start_date: "2026-01-01", term_end_date: "2030-12-31", livestock_kind: "CATTLE" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { g2_id: "$.data.id" }
            - call: "POST /grazing-permits/${g2_id}/issue"
              payload: {}
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
            - call: "POST /annual-operating-instructions"
              payload: { permit_id: "${g2_id}", grazing_year: 2026, authorized_aums: 300, season_start_date: "2026-01-01", season_end_date: "2026-12-31" }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
              captures: { aoi2_id: "$.data.id" }
            - call: "POST /annual-operating-instructions/${aoi2_id}/use-records"
              payload: { pasture_id: "${p3_id}", planned_entry_date: "2026-04-01", planned_exit_date: "2026-05-02", planned_head_count: 100, livestock_kind: "CATTLE" }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
              captures: { ur3_id: "$.data.id" }
            - call: "POST /annual-operating-instructions/${aoi2_id}/use-records"
              payload: { pasture_id: "${p4_id}", planned_entry_date: "2026-05-02", planned_exit_date: "2026-06-01", planned_head_count: 100, livestock_kind: "CATTLE" }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
              captures: { ur4_id: "$.data.id" }
            - call: "POST /annual-operating-instructions/${aoi2_id}/issue"
              payload: {}
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
          trigger:
            - call: "POST /pasture-use-records/${ur3_id}/report-actual-use"
              payload: { actual_entry_date: "2026-04-01", actual_exit_date: "2026-04-24", actual_head_count: 100 }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
            - call: "POST /pasture-use-records/${ur4_id}/report-actual-use"
              payload: { actual_entry_date: "2026-05-02", actual_exit_date: "2026-05-25", actual_head_count: 100 }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
            - call: "POST /annual-operating-instructions/${aoi2_id}/accept-use-report"
              payload: {}
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
            - call: "GET /grazing-bills"
              payload: { aoi_id: "${aoi2_id}", bill_type: "FINAL_USE" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { final2_bill_id: "$.data.items[0].id" }
          assert:
            - "PastureUseRecord.${ur3_id}.actual_aums == 76.67"
            - "PastureUseRecord.${ur4_id}.actual_aums == 76.67"
            - "AnnualOperatingInstruction.${aoi2_id}.actual_aums_total == 153.34"
            - "GrazingBill.${final2_bill_id}.base_amount_cents == 26374"
            - "GrazingBill.${final2_bill_id}.base_amount_cents != 26373"
            - "GrazingBill.${final2_bill_id}.total_amount_cents == 26374"
            - "PastureUseRecord.${ur3_id}.record_status == ACCEPTED"
            - "PastureUseRecord.${ur4_id}.record_status == ACCEPTED"

      - name: admin_fee_tier_keyed_on_base_not_total
        grounds:
          - calculations.use_bill_amount
          - entities.GrazingBill.fields.admin_fee_cents
          - entities.GrazingBill.fields.base_amount_cents
          - entities.GrazingBill.fields.total_amount_cents
          - state_machines.AnnualOperatingInstruction.DRAFT_to_ISSUED
        distinguishing_aspect: |
          Mode (c): total_amount_cents = base_amount_cents + admin_fee_cents while the fee tier
          is selected FROM base_amount_cents, a circular-looking dependency the scaffold breaks
          by pinning the evaluation order. At 290 authorized AUMs base is 49880 cents, just
          under the 50000-cent tier boundary, so admin_fee_cents is 0 and the total is 49880;
          an implementation that keys the tier on the total (49880 + 2500 >= 50000) returns
          52380 instead.
        test_recipe:
          setup:
            - "An allotment with 1200 permitted AUMs, a single pasture and required_pasture_rotation_count 1"
            - "A permittee in good standing with a 400-AUM LAND base property and an ISSUED 300-AUM permit"
