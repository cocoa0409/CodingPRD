          - state_machines.Production.transitions.CLEARANCE_to_LOCKED
        distinguishing_aspect: "The two posture errors are not interchangeable: at BLOCKED a chart pin is refused with ERR_PRODUCTION_POSTURE_BLOCKED (priority 14), and at RESTRICTED the very same pin SUCCEEDS while the LOCKED transition is refused with ERR_PRODUCTION_POSTURE_RESTRICTED (priority 15) before its E&O precondition is even consulted."
