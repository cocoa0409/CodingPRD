        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - state_machines.Claim.ACTIVE_to_DISPUTED
        distinguishing_aspect: "A dispute filed outside the 30-day window on a FROZEN channel violates both the business_safety posture rule (priority 5) and the business_temporal window rule (priority 6); the response must be ERR_POSTURE_FROZEN with 409, not ERR_DISPUTE_WINDOW_CLOSED."
        test_recipe:
          setup:
            - "Logical clock advanced to 2026-10-15T00:00:00Z (past the 30-day window opened at 2026-09-01) on a channel carrying a third strike so its posture is FROZEN."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels"
              payload: { channel_name: "Conflict US", country_code: "US", lifetime_watch_hours: 8000, subscriber_count: 1500, tax_tin_status: "TIN_PROVIDED", payment_threshold_cents: 100 }
