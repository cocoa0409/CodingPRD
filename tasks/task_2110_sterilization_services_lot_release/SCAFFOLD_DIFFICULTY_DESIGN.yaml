      - name: qualification_conditional_loop_revokes_on_second_consecutive_conditional
        grounds:
          - state_machines.ProductQualification.PENDING_to_CONDITIONAL
          - state_machines.ProductQualification.CONDITIONAL_to_REVOKED
          - calculations.vdmax_audit_verdict
          - entities.ProductQualification.fields.consecutive_conditional_count
        distinguishing_aspect: |
          ProductQualification is the third non-linear machine and it is cyclic in
          a different way from Cycle: CONDITIONAL is re-entrant through the audit
          loop, and the loop is bounded by a counter rather than by a state - the
          second consecutive CONDITIONAL_PASS leaves the loop into terminal
          REVOKED instead of re-entering CONDITIONAL.
        test_recipe:
          setup:
            - "A GAMMA recipe RG is approved and a ProductQualification for P1 against RG is PENDING."
            - "One VDmax audit with exactly one positive out of 100 has already been recorded on 2026-08-20T00:00:00Z, moving the qualification to CONDITIONAL with consecutive_conditional_count 1 and next_audit_due_at 2026-09-19T00:00:00Z."
          setup_api_calls:
            - call: "POST /sterilization/_clock/set_current_utc"
