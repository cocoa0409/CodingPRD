# =============================================================================
# §1.9 Scaffold Corner Design — poultry hatchery & breeder flock management
# Breadth probe: every testable claim the §1.1-§1.7 surface declares that the
# §1.8 depth probe does not already cover. Sections and claim_type values come
# from references/claim-extraction-guide.md; nothing else is invented.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: create_flock_program_returns_full_representation
        claim_type: creation
        grounds:
          - entities.FlockProgram
          - endpoints.POST_/flock-programs
          - response_envelope.success
        distinguishing_aspect: "A 201 must echo every input field verbatim (including the nested step tables), set retired to false, and wrap the body in the §1.0 envelope with response_type object and a meta.api_request_id."
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned to 2026-08-01T12:00:00Z."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T12:00:00Z"}, as: HatcheryManager}
          trigger:
            - {call: "POST /flock-programs", payload: {code: "P1", breed: "ROSS_308", stimulation_week: 21, lighting_steps: [{age_weeks: 21, photoperiod_hours: 12.0}, {age_weeks: 24, photoperiod_hours: 14.0}, {age_weeks: 30, photoperiod_hours: 16.0}], feed_steps: [{age_weeks: 21, feed_grams_per_hen_day: 150.0}, {age_weeks: 26, feed_grams_per_hen_day: 168.0}]}, as: HatcheryManager, captures: {p1: "$.data.id"}}
          assert:
            - "HTTP 201 and response_type == object with meta.api_request_id and meta.api_request_timestamp present"
            - "data.code == P1, data.breed == ROSS_308, data.stimulation_week == 21"
            - "data.lighting_steps has 3 entries in the submitted order and data.feed_steps has 2"
            - "data.retired == false"
            - "data.id is a server-generated identifier, data.version == 1, data.created_at == 2026-08-01T12:00:00Z, data.updated_at == 2026-08-01T12:00:00Z"

      - name: get_breeder_flock_returns_stored_representation
        claim_type: retrieval
        grounds:
          - endpoints.GET_/breeder-flocks/{id}
          - entities.BreederFlock
        distinguishing_aspect: "GET /breeder-flocks/{id} must return exactly what the POST stored, including the computed block, without mutating anything: version stays 1 across repeated reads."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T12:00:00Z with program P1 created and flock F1 placed but not yet in lay."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T12:00:00Z"}, as: HatcheryManager}
            - {call: "POST /flock-programs", payload: {code: "P1", breed: "ROSS_308", stimulation_week: 21, lighting_steps: [{age_weeks: 21, photoperiod_hours: 12.0}, {age_weeks: 24, photoperiod_hours: 14.0}, {age_weeks: 30, photoperiod_hours: 16.0}], feed_steps: [{age_weeks: 21, feed_grams_per_hen_day: 150.0}, {age_weeks: 26, feed_grams_per_hen_day: 168.0}]}, as: HatcheryManager, captures: {p1: "$.data.id"}}
            - {call: "POST /breeder-flocks", payload: {code: "F1", program_id: "${p1}", breed: "ROSS_308", house_code: "H1", hatch_date: "2026-01-05T00:00:00Z", placed_at: "2026-05-01T00:00:00Z", hen_count: 9000}, as: FlockManager, captures: {f1: "$.data.id"}}
          trigger:
            - {call: "GET /breeder-flocks/${f1}", payload: {}, as: FlockManager}
            - {call: "GET /breeder-flocks/${f1}", payload: {}, as: HatcheryManager}
          assert:
            - "HTTP 200 both times with identical bodies"
            - "data.code == F1, data.program_id == ${p1}, data.hen_count == 9000, data.house_code == H1"
            - "data.status == PLACED and data.age_weeks == 29 (208 days since 2026-01-05, floored)"
            - "data.settable_forecast == 0 because a PLACED flock produces nothing"
            - "data.version == 1 after both reads: GET is side-effect free"

      - name: list_egg_lots_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET_/egg-lots
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "The list envelope must report total_count 3 independent of the page size, has_more true only while unread rows remain, and the flock_id filter must scope the count - a naive len(page) implementation returns 2."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T12:00:00Z; flock F1 is IN_LAY with three collected lots."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T12:00:00Z"}, as: HatcheryManager}
            - {call: "POST /flock-programs", payload: {code: "P1", breed: "ROSS_308", stimulation_week: 21, lighting_steps: [{age_weeks: 21, photoperiod_hours: 12.0}, {age_weeks: 24, photoperiod_hours: 14.0}, {age_weeks: 30, photoperiod_hours: 16.0}], feed_steps: [{age_weeks: 21, feed_grams_per_hen_day: 150.0}, {age_weeks: 26, feed_grams_per_hen_day: 168.0}]}, as: HatcheryManager, captures: {p1: "$.data.id"}}
            - {call: "POST /breeder-flocks", payload: {code: "F1", program_id: "${p1}", breed: "ROSS_308", house_code: "H1", hatch_date: "2026-01-05T00:00:00Z", placed_at: "2026-05-01T00:00:00Z", hen_count: 9000}, as: FlockManager, captures: {f1: "$.data.id"}}
            - {call: "POST /lab-tests", payload: {subject_type: "BREEDER_FLOCK", subject_id: "${f1}", test_code: "SALMONELLA_PULLORUM", collected_at: "2026-07-20T00:00:00Z"}, as: Veterinarian, captures: {t1: "$.data.id"}}
            - {call: "POST /lab-tests/${t1}/release", payload: {result: "NEGATIVE"}, as: Veterinarian}
            - {call: "POST /breeder-flocks/${f1}/start-lay", payload: {}, as: FlockManager}
            - {call: "POST /egg-lots", payload: {flock_id: "${f1}", collected_at: "2026-07-29T00:00:00Z", collected_count: 6000}, as: FlockManager}
            - {call: "POST /egg-lots", payload: {flock_id: "${f1}", collected_at: "2026-07-30T00:00:00Z", collected_count: 6100}, as: FlockManager}
            - {call: "POST /egg-lots", payload: {flock_id: "${f1}", collected_at: "2026-07-31T00:00:00Z", collected_count: 6200}, as: FlockManager}
          trigger:
            - {call: "GET /egg-lots", payload: {flock_id: "${f1}", limit: 2, offset: 0}, as: FlockManager}
            - {call: "GET /egg-lots", payload: {flock_id: "${f1}", limit: 2, offset: 2}, as: FlockManager}
            - {call: "GET /egg-lots", payload: {flock_id: "${f1}", status: "COLLECTED"}, as: FlockManager}
          assert:
            - "First page: HTTP 200, response_type == array, 2 rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "Second page: 1 row, total_count == 3, has_more == false, offset == 2"
            - "Third call with no limit: 3 rows returned under the default limit of 10, total_count == 3, has_more == false"
            - "All three responses contain only lots whose flock_id == ${f1}"

      - name: get_setter_load_unknown_id_not_found
        claim_type: not_found
        grounds:
          - errors.ERR_SETTER_LOAD_NOT_FOUND
          - endpoints.GET_/setter-loads/{id}
        distinguishing_aspect: "A well-formed but unknown identifier must produce 404 ERR_SETTER_LOAD_NOT_FOUND in the error envelope, not 200 with a null body and not 400."
        test_recipe:
          setup:
            - "Empty database with the clock set; no setter load has ever been created."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T12:00:00Z"}, as: HatcheryManager}
          trigger:
            - {call: "GET /setter-loads/00000000-0000-0000-0000-000000000000", payload: {}, as: IncubationOperator, captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 404 with response_type == error and data.error_id == ERR_SETTER_LOAD_NOT_FOUND"
            - "data.message is a non-empty string and meta.api_request_id is present"

      - name: create_breeder_flock_missing_required_field_rejected
        claim_type: required_fields
        grounds:
          - entities.BreederFlock.fields.hen_count
          - errors.ERR_INVALID_REQUEST
          - validations.priority_6.ERR_INVALID_REQUEST
        distinguishing_aspect: "hen_count has source input with no default, so omitting it is a 400 ERR_INVALID_REQUEST at priority 6 - it must not be silently defaulted to 0, which would make settable_forecast 0 and hide the bug."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T12:00:00Z with program P1 available."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T12:00:00Z"}, as: HatcheryManager}
            - {call: "POST /flock-programs", payload: {code: "P1", breed: "ROSS_308", stimulation_week: 21, lighting_steps: [{age_weeks: 21, photoperiod_hours: 12.0}, {age_weeks: 24, photoperiod_hours: 14.0}, {age_weeks: 30, photoperiod_hours: 16.0}], feed_steps: [{age_weeks: 21, feed_grams_per_hen_day: 150.0}, {age_weeks: 26, feed_grams_per_hen_day: 168.0}]}, as: HatcheryManager, captures: {p1: "$.data.id"}}
          trigger:
            - {call: "POST /breeder-flocks", payload: {code: "F1", program_id: "${p1}", breed: "ROSS_308", house_code: "H1", hatch_date: "2026-01-05T00:00:00Z", placed_at: "2026-05-01T00:00:00Z"}, as: FlockManager, captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /breeder-flocks returns total_count 0: nothing was persisted"

      - name: system_defaults_applied_on_create
        claim_type: defaults
        grounds:
          - entities.IncubationUnit.fields.sanitation_status
          - entities.IncubationUnit.fields.occupancy_status
          - entities.GrowerFarm.fields.biosecurity_status
          - entities.GrowerPlacementOrder.fields.allocated_chicks
        distinguishing_aspect: "Three different aggregates must come into existence in their declared default states - a unit DIRTY and FREE (never SANITIZED), a farm PENDING (never CLEARED), an order REQUESTED with allocated_chicks 0 - so that later gates have something to reject."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T12:00:00Z; nothing else exists."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T12:00:00Z"}, as: HatcheryManager}
          trigger:
            - {call: "POST /incubation-units", payload: {code: "U1", unit_type: "SETTER", capacity_eggs: 20000}, as: HatcheryManager, captures: {u1: "$.data.id"}}
            - {call: "POST /grower-farms", payload: {code: "FM1", operator_user_id: "u_grower_1", capacity_chicks: 20000}, as: HatcheryManager, captures: {fm1: "$.data.id"}}
            - {call: "POST /placement-orders", payload: {farm_id: "${fm1}", requested_breed: "ROSS_308", requested_placement_date: "2026-08-22T00:00:00Z", requested_chicks: 5000}, as: HatcheryManager, captures: {o1: "$.data.id"}}
          assert:
            - "IncubationUnit.${u1}.sanitation_status == DIRTY, occupancy_status == FREE, sanitized_at == null"
            - "GrowerFarm.${fm1}.biosecurity_status == PENDING and cleared_at == null"
            - "GrowerPlacementOrder.${o1}.status == REQUESTED, allocated_chicks == 0, remaining_need == 5000"
            - "All three carry version == 1"

      - name: flock_computed_fields_derived_on_create_and_start_lay
        claim_type: computed_fields
        grounds:
          - entities.BreederFlock.fields.age_weeks
          - entities.BreederFlock.fields.photoperiod_hours
          - entities.BreederFlock.fields.feed_grams_per_hen_day
          - calculations.flock_settable_forecast
        distinguishing_aspect: "Every computed field must come from the program's step tables and the clock, never from the request: at 29 weeks the applicable lighting step is the 24-week one (14.0 h, not the 30-week 16.0 h) and the applicable feed step is the 26-week one (168.0 g)."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T12:00:00Z; program P1 with lighting steps at 21/24/30 weeks and feed steps at 21/26 weeks; flock F1 hatched 2026-01-05 is 29 weeks old with 9000 hens and a NEGATIVE clearance."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T12:00:00Z"}, as: HatcheryManager}
            - {call: "POST /flock-programs", payload: {code: "P1", breed: "ROSS_308", stimulation_week: 21, lighting_steps: [{age_weeks: 21, photoperiod_hours: 12.0}, {age_weeks: 24, photoperiod_hours: 14.0}, {age_weeks: 30, photoperiod_hours: 16.0}], feed_steps: [{age_weeks: 21, feed_grams_per_hen_day: 150.0}, {age_weeks: 26, feed_grams_per_hen_day: 168.0}]}, as: HatcheryManager, captures: {p1: "$.data.id"}}
            - {call: "POST /breeder-flocks", payload: {code: "F1", program_id: "${p1}", breed: "ROSS_308", house_code: "H1", hatch_date: "2026-01-05T00:00:00Z", placed_at: "2026-05-01T00:00:00Z", hen_count: 9000}, as: FlockManager, captures: {f1: "$.data.id"}}
            - {call: "POST /lab-tests", payload: {subject_type: "BREEDER_FLOCK", subject_id: "${f1}", test_code: "SALMONELLA_PULLORUM", collected_at: "2026-07-20T00:00:00Z"}, as: Veterinarian, captures: {t1: "$.data.id"}}
            - {call: "POST /lab-tests/${t1}/release", payload: {result: "NEGATIVE"}, as: Veterinarian}
          trigger:
            - {call: "POST /breeder-flocks/${f1}/start-lay", payload: {}, as: FlockManager}
          assert:
            - "BreederFlock.${f1}.age_weeks == 29 and status == IN_LAY"
            - "photoperiod_hours == 14.0 (last step whose age_weeks <= 29) and feed_grams_per_hen_day == 168.0"
            - "production_rate_pct == 82.0 for the 25-30 week tier"
            - "lighting_factor == 0.7900 and nutrition_factor == 1.0500"
            - "settable_forecast == 5754"
            - "corrective_action_count == 0 so no CORRECTIVE_DERATE is applied"

      - name: system_fields_generated_and_version_increments
        claim_type: system_fields
        grounds:
          - entities.BreederFlock
          - endpoints.POST_/breeder-flocks/{id}/recompute-forecast
          - response_envelope.success
        distinguishing_aspect: "id, created_at, updated_at and version are server-owned: created_at must stay frozen at the creation clock while updated_at moves to the new clock and version goes 1 -> 2 on the first write."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T12:00:00Z; program P1 and flock F1 (hatched 2026-01-05, 9000 hens) exist."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T12:00:00Z"}, as: HatcheryManager}
            - {call: "POST /flock-programs", payload: {code: "P1", breed: "ROSS_308", stimulation_week: 21, lighting_steps: [{age_weeks: 21, photoperiod_hours: 12.0}, {age_weeks: 24, photoperiod_hours: 14.0}, {age_weeks: 30, photoperiod_hours: 16.0}], feed_steps: [{age_weeks: 21, feed_grams_per_hen_day: 150.0}, {age_weeks: 26, feed_grams_per_hen_day: 168.0}]}, as: HatcheryManager, captures: {p1: "$.data.id"}}
            - {call: "POST /breeder-flocks", payload: {code: "F1", program_id: "${p1}", breed: "ROSS_308", house_code: "H1", hatch_date: "2026-01-05T00:00:00Z", placed_at: "2026-05-01T00:00:00Z", hen_count: 9000}, as: FlockManager, captures: {f1: "$.data.id", v1: "$.data.version"}}
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-15T09:00:00Z"}, as: HatcheryManager}
          trigger:
            - {call: "POST /breeder-flocks/${f1}/recompute-forecast", payload: {}, as: FlockManager}
          assert:
            - "The captured creation version ${v1} == 1"
            - "After the write: version == 2, created_at == 2026-08-01T12:00:00Z (unchanged), updated_at == 2026-08-15T09:00:00Z"
            - "data.id is unchanged by the write"
            - "age_weeks == 31 at the new clock and production_rate_pct == 74.0 for the 31-45 week tier"

      - name: create_incubation_unit_invalid_enum_and_non_positive_capacity_rejected
        claim_type: type_constraints
        grounds:
          - entities.IncubationUnit.fields.unit_type
          - errors.ERR_INVALID_REQUEST
          - errors.ERR_NON_POSITIVE_COUNT
          - validations.priority_8.ERR_NON_POSITIVE_COUNT
        distinguishing_aspect: "An out-of-enum unit_type is a shape error at priority 6 (400 ERR_INVALID_REQUEST) while a non-positive capacity is the distinct count rule at priority 8 (400 ERR_NON_POSITIVE_COUNT); collapsing both into one code loses the distinction."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T12:00:00Z; no units exist."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T12:00:00Z"}, as: HatcheryManager}
          trigger:
            - {call: "POST /incubation-units", payload: {code: "U1", unit_type: "FREEZER", capacity_eggs: 20000}, as: HatcheryManager, captures: {e1: "$.data.error_id"}}
            - {call: "POST /incubation-units", payload: {code: "U1", unit_type: "SETTER", capacity_eggs: 0}, as: HatcheryManager, captures: {e2: "$.data.error_id"}}
          assert:
            - "First call: HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "Second call: HTTP 400 with data.error_id == ERR_NON_POSITIVE_COUNT"
            - "GET /incubation-units/{id} for either attempted code is impossible: nothing was created"

      - name: environment_reading_is_append_only_and_immutable
        claim_type: immutability
        grounds:
          - entities.EnvironmentReading
          - endpoints.GET_/setter-loads/{id}/environment-readings
          - validations.priority_25.ERR_TIMESTAMP_OUT_OF_RANGE
        distinguishing_aspect: "EnvironmentReading declares common_fields false: it carries only id and created_at, has no version and no update or delete endpoint anywhere in §1.5, and out-of-order arrivals are rejected rather than reordered - so the ledger can never be rewritten."
        test_recipe:
          setup:
            - "Standard fixture: 10000 eggs drawn into setter load S1 in sanitized unit U1, started at 2026-08-01T18:00:00Z with the clock at 2026-08-02T06:00:00Z."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T12:00:00Z"}, as: HatcheryManager}
            - {call: "POST /flock-programs", payload: {code: "P1", breed: "ROSS_308", stimulation_week: 21, lighting_steps: [{age_weeks: 21, photoperiod_hours: 12.0}, {age_weeks: 24, photoperiod_hours: 14.0}, {age_weeks: 30, photoperiod_hours: 16.0}], feed_steps: [{age_weeks: 21, feed_grams_per_hen_day: 150.0}, {age_weeks: 26, feed_grams_per_hen_day: 168.0}]}, as: HatcheryManager, captures: {p1: "$.data.id"}}
            - {call: "POST /breeder-flocks", payload: {code: "F1", program_id: "${p1}", breed: "ROSS_308", house_code: "H1", hatch_date: "2026-01-05T00:00:00Z", placed_at: "2026-05-01T00:00:00Z", hen_count: 9000}, as: FlockManager, captures: {f1: "$.data.id"}}
            - {call: "POST /lab-tests", payload: {subject_type: "BREEDER_FLOCK", subject_id: "${f1}", test_code: "SALMONELLA_PULLORUM", collected_at: "2026-07-20T00:00:00Z"}, as: Veterinarian, captures: {t1: "$.data.id"}}
            - {call: "POST /lab-tests/${t1}/release", payload: {result: "NEGATIVE"}, as: Veterinarian}
            - {call: "POST /breeder-flocks/${f1}/start-lay", payload: {}, as: FlockManager}
            - {call: "POST /egg-lots", payload: {flock_id: "${f1}", collected_at: "2026-07-30T00:00:00Z", collected_count: 10500}, as: FlockManager, captures: {la: "$.data.id"}}
            - {call: "POST /egg-lots/${la}/grade", payload: {grade_a_count: 10000, cracked_count: 300, dirty_count: 150, small_count: 50}, as: FlockManager}
            - {call: "POST /egg-lots/${la}/store", payload: {storage_temp_c: 15.0}, as: IncubationOperator, captures: {lav: "$.data.version"}}
            - {call: "POST /incubation-units", payload: {code: "U1", unit_type: "SETTER", capacity_eggs: 20000}, as: HatcheryManager, captures: {u1: "$.data.id"}}
            - {call: "POST /incubation-units/${u1}/sanitize", payload: {}, as: IncubationOperator}
            - {call: "POST /incubation-profiles", payload: {code: "PR1", breed: "ROSS_308", transfer_hours: 456, total_hours: 504, stages: [{from_hour: 0, to_hour: 240, temp_c: 37.8, humidity_pct: 55.0}, {from_hour: 240, to_hour: 456, temp_c: 37.5, humidity_pct: 52.0}, {from_hour: 456, to_hour: 504, temp_c: 36.9, humidity_pct: 65.0}]}, as: HatcheryManager, captures: {pr1: "$.data.id"}}
            - {call: "POST /setter-loads", payload: {unit_id: "${u1}", profile_id: "${pr1}", planned_set_at: "2026-08-01T18:00:00Z"}, as: IncubationOperator, captures: {s1: "$.data.id"}}
            - {call: "POST /setter-loads/${s1}/items", payload: {egg_lot_id: "${la}", eggs_taken: 10000, expected_egg_lot_version: "${lav}"}, as: IncubationOperator}
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T18:00:00Z"}, as: HatcheryManager}
            - {call: "POST /setter-loads/${s1}/start", payload: {}, as: IncubationOperator}
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-02T06:00:00Z"}, as: HatcheryManager}
          trigger:
            - {call: "POST /setter-loads/${s1}/environment-readings", payload: {recorded_at: "2026-08-01T18:00:00Z", temp_c: 37.9, humidity_pct: 55.0}, as: IncubationOperator, captures: {r1: "$.data.id"}}
            - {call: "POST /setter-loads/${s1}/environment-readings", payload: {recorded_at: "2026-08-01T21:00:00Z", temp_c: 37.7, humidity_pct: 54.0}, as: IncubationOperator, captures: {r2: "$.data.id"}}
            - {call: "POST /setter-loads/${s1}/environment-readings", payload: {recorded_at: "2026-08-01T20:00:00Z", temp_c: 37.8, humidity_pct: 55.0}, as: IncubationOperator}
            - {call: "GET /setter-loads/${s1}/environment-readings", payload: {}, as: IncubationOperator}
          assert:
            - "Reading ${r1}: HTTP 201 with only id, created_at, setter_load_id, recorded_at, temp_c, humidity_pct, elapsed_hours, target_temp_c, abs_deviation_c, segment_degree_hours - no version and no updated_at field"
            - "Reading ${r1}: elapsed_hours == 0.0, target_temp_c == 37.8, abs_deviation_c == 0.10, segment_degree_hours == 0.000"
            - "Reading ${r2}: elapsed_hours == 3.0, abs_deviation_c == 0.10, segment_degree_hours == 0.000 (0.10 is inside TEMP_TOLERANCE_C 0.30)"
            - "Third call: HTTP 422 with data.error_id == ERR_TIMESTAMP_OUT_OF_RANGE - a reading before the latest recorded_at cannot be back-inserted"
            - "GET list returns exactly 2 rows ordered by recorded_at ASC, total_count == 2"
            - "SetterLoad.${s1}.deviation_degree_hours == 0.000 and environment_status == NOMINAL"

      - name: create_egg_lot_unknown_flock_not_found
        claim_type: parent_relationships
        grounds:
          - entities.EggLot.fields.flock_id
          - errors.ERR_BREEDER_FLOCK_NOT_FOUND
          - validations.priority_5.ERR_BREEDER_FLOCK_NOT_FOUND
        distinguishing_aspect: "A body-borne FK must be resolved before any business rule: an unknown flock_id is 404 ERR_BREEDER_FLOCK_NOT_FOUND, not a 422 about egg counts."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T12:00:00Z; no flocks exist."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T12:00:00Z"}, as: HatcheryManager}
          trigger:
            - {call: "POST /egg-lots", payload: {flock_id: "00000000-0000-0000-0000-000000000000", collected_at: "2026-07-30T00:00:00Z", collected_count: 6000}, as: FlockManager, captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 404 with data.error_id == ERR_BREEDER_FLOCK_NOT_FOUND"
            - "GET /egg-lots returns total_count 0"

      - name: self_referential_source_flock_filter
        claim_type: parent_relationships
        grounds:
          - entities.BreederFlock.fields.source_flock_id
          - endpoints.GET_/breeder-flocks
          - complexity_profile.relationship_patterns.self_referential
        distinguishing_aspect: "source_flock_id is a self-referential optional FK: a daughter flock must resolve it against the same table and be findable via GET /breeder-flocks?source_flock_id, while the parent flock itself must not appear in that filtered result."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T12:00:00Z; program P1 exists; parent flock F0 is created first."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T12:00:00Z"}, as: HatcheryManager}
            - {call: "POST /flock-programs", payload: {code: "P1", breed: "ROSS_308", stimulation_week: 21, lighting_steps: [{age_weeks: 21, photoperiod_hours: 12.0}, {age_weeks: 24, photoperiod_hours: 14.0}, {age_weeks: 30, photoperiod_hours: 16.0}], feed_steps: [{age_weeks: 21, feed_grams_per_hen_day: 150.0}, {age_weeks: 26, feed_grams_per_hen_day: 168.0}]}, as: HatcheryManager, captures: {p1: "$.data.id"}}
            - {call: "POST /breeder-flocks", payload: {code: "F0", program_id: "${p1}", breed: "ROSS_308", house_code: "H0", hatch_date: "2025-06-01T00:00:00Z", placed_at: "2025-10-01T00:00:00Z", hen_count: 9500}, as: FlockManager, captures: {f0: "$.data.id"}}
          trigger:
            - {call: "POST /breeder-flocks", payload: {code: "F1", program_id: "${p1}", breed: "ROSS_308", house_code: "H1", hatch_date: "2026-01-05T00:00:00Z", placed_at: "2026-05-01T00:00:00Z", hen_count: 9000, source_flock_id: "${f0}"}, as: FlockManager, captures: {f1: "$.data.id"}}
            - {call: "GET /breeder-flocks", payload: {source_flock_id: "${f0}"}, as: FlockManager}
            - {call: "GET /breeder-flocks", payload: {program_id: "${p1}"}, as: FlockManager}
          assert:
            - "HTTP 201 with BreederFlock.${f1}.source_flock_id == ${f0}"
            - "GET /breeder-flocks?source_flock_id=${f0} returns exactly 1 row (${f1}), total_count == 1; F0 is not included"
            - "GET /breeder-flocks?program_id=${p1} returns 2 rows, total_count == 2"
            - "BreederFlock.${f0}.source_flock_id == null"

      - name: setter_load_item_junction_links_lot_to_two_loads
        claim_type: creation
        grounds:
          - entities.SetterLoadItem
          - endpoints.GET_/egg-lots/{id}/setter-load-items
          - endpoints.GET_/setter-loads/{id}/items
          - complexity_profile.entity_topology
        distinguishing_aspect: "SetterLoadItem is the many-to-many junction of the graph topology: one lot split across two loads must be reachable from both sides, and the lot's ALLOCATED -> ALLOCATED self-loop must decrement eggs_remaining twice without a state error."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T12:00:00Z; flock F1 IN_LAY; lot L1 grades to 6200 settable and is stored at 15.0 C."
            - "Two setters U1 and U2 each hold a PLANNED load, S1 at 2026-08-01T18:00:00Z and S2 at 2026-08-02T18:00:00Z."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T12:00:00Z"}, as: HatcheryManager}
            - {call: "POST /flock-programs", payload: {code: "P1", breed: "ROSS_308", stimulation_week: 21, lighting_steps: [{age_weeks: 21, photoperiod_hours: 12.0}, {age_weeks: 24, photoperiod_hours: 14.0}, {age_weeks: 30, photoperiod_hours: 16.0}], feed_steps: [{age_weeks: 21, feed_grams_per_hen_day: 150.0}, {age_weeks: 26, feed_grams_per_hen_day: 168.0}]}, as: HatcheryManager, captures: {p1: "$.data.id"}}
            - {call: "POST /breeder-flocks", payload: {code: "F1", program_id: "${p1}", breed: "ROSS_308", house_code: "H1", hatch_date: "2026-01-05T00:00:00Z", placed_at: "2026-05-01T00:00:00Z", hen_count: 9000}, as: FlockManager, captures: {f1: "$.data.id"}}
            - {call: "POST /lab-tests", payload: {subject_type: "BREEDER_FLOCK", subject_id: "${f1}", test_code: "SALMONELLA_PULLORUM", collected_at: "2026-07-20T00:00:00Z"}, as: Veterinarian, captures: {t1: "$.data.id"}}
            - {call: "POST /lab-tests/${t1}/release", payload: {result: "NEGATIVE"}, as: Veterinarian}
            - {call: "POST /breeder-flocks/${f1}/start-lay", payload: {}, as: FlockManager}
            - {call: "POST /egg-lots", payload: {flock_id: "${f1}", collected_at: "2026-07-30T00:00:00Z", collected_count: 6500}, as: FlockManager, captures: {l1: "$.data.id"}}
            - {call: "POST /egg-lots/${l1}/grade", payload: {grade_a_count: 6200, cracked_count: 150, dirty_count: 100, small_count: 50}, as: FlockManager}
            - {call: "POST /egg-lots/${l1}/store", payload: {storage_temp_c: 15.0}, as: IncubationOperator, captures: {l1v: "$.data.version"}}
            - {call: "POST /incubation-units", payload: {code: "U1", unit_type: "SETTER", capacity_eggs: 20000}, as: HatcheryManager, captures: {u1: "$.data.id"}}
            - {call: "POST /incubation-units", payload: {code: "U2", unit_type: "SETTER", capacity_eggs: 20000}, as: HatcheryManager, captures: {u2: "$.data.id"}}
            - {call: "POST /incubation-profiles", payload: {code: "PR1", breed: "ROSS_308", transfer_hours: 456, total_hours: 504, stages: [{from_hour: 0, to_hour: 240, temp_c: 37.8, humidity_pct: 55.0}, {from_hour: 240, to_hour: 456, temp_c: 37.5, humidity_pct: 52.0}, {from_hour: 456, to_hour: 504, temp_c: 36.9, humidity_pct: 65.0}]}, as: HatcheryManager, captures: {pr1: "$.data.id"}}
            - {call: "POST /setter-loads", payload: {unit_id: "${u1}", profile_id: "${pr1}", planned_set_at: "2026-08-01T18:00:00Z"}, as: IncubationOperator, captures: {s1: "$.data.id"}}
            - {call: "POST /setter-loads", payload: {unit_id: "${u2}", profile_id: "${pr1}", planned_set_at: "2026-08-02T18:00:00Z"}, as: IncubationOperator, captures: {s2: "$.data.id"}}
          trigger:
            - {call: "POST /setter-loads/${s1}/items", payload: {egg_lot_id: "${l1}", eggs_taken: 3000, expected_egg_lot_version: "${l1v}"}, as: IncubationOperator, captures: {i1: "$.data.id"}}
            - {call: "GET /egg-lots/${l1}", payload: {}, as: IncubationOperator, captures: {l1v2: "$.data.version"}}
            - {call: "POST /setter-loads/${s2}/items", payload: {egg_lot_id: "${l1}", eggs_taken: 3000, expected_egg_lot_version: "${l1v2}"}, as: IncubationOperator, captures: {i2: "$.data.id"}}
            - {call: "GET /egg-lots/${l1}/setter-load-items", payload: {}, as: IncubationOperator}
            - {call: "GET /setter-loads/${s1}/items", payload: {}, as: IncubationOperator}
          assert:
            - "SetterLoadItem.${i1}.setter_load_id == ${s1}, egg_lot_id == ${l1}, eggs_taken == 3000, item_status == ACTIVE, effective_age_days_at_set == 2.00"
            - "After the first draw EggLot.${l1}.status == ALLOCATED and eggs_remaining == 3200"
            - "Second draw: HTTP 201, EggLot.${l1}.status stays ALLOCATED (self-loop) and eggs_remaining == 200"
            - "GET /egg-lots/${l1}/setter-load-items returns both ${i1} and ${i2}, total_count == 2"
            - "GET /setter-loads/${s1}/items returns only ${i1}, total_count == 1"
            - "SetterLoad.${s1}.total_eggs_set == 3000 and SetterLoad.${s2}.total_eggs_set == 3000"

  - section: state_machines
    instances:
      - name: setter_load_starts_in_planned_and_nominal
        claim_type: initial_state
        grounds:
          - state_machines.SetterLoad.initial_state
          - state_machines.SetterLoad.environment_status.initial_state
          - entities.SetterLoad
        distinguishing_aspect: "A freshly created load must sit in PLANNED on the status dimension AND NOMINAL on the independent environment dimension simultaneously, with every computed field still empty (total_eggs_set 0, deviation_degree_hours 0.000, set_at null)."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T12:00:00Z; setter U1 and profile PR1 exist; no eggs are drawn yet."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T12:00:00Z"}, as: HatcheryManager}
            - {call: "POST /incubation-units", payload: {code: "U1", unit_type: "SETTER", capacity_eggs: 20000}, as: HatcheryManager, captures: {u1: "$.data.id"}}
            - {call: "POST /incubation-profiles", payload: {code: "PR1", breed: "ROSS_308", transfer_hours: 456, total_hours: 504, stages: [{from_hour: 0, to_hour: 240, temp_c: 37.8, humidity_pct: 55.0}, {from_hour: 240, to_hour: 456, temp_c: 37.5, humidity_pct: 52.0}, {from_hour: 456, to_hour: 504, temp_c: 36.9, humidity_pct: 65.0}]}, as: HatcheryManager, captures: {pr1: "$.data.id"}}
          trigger:
            - {call: "POST /setter-loads", payload: {unit_id: "${u1}", profile_id: "${pr1}", planned_set_at: "2026-08-01T18:00:00Z"}, as: IncubationOperator, captures: {s1: "$.data.id"}}
          assert:
            - "HTTP 201 with SetterLoad.${s1}.status == PLANNED and environment_status == NOMINAL"
            - "total_eggs_set == 0, weighted_age_days == null, storage_delay_hours == null, set_at == null"
            - "deviation_degree_hours == 0.000, deviation_opened_at == null, fertile_count == null, abort_reason == null"
            - "IncubationUnit.${u1}.occupancy_status is still FREE: planning a load does not occupy the machine"
            - "version == 1"

      - name: transfer_side_effects_copy_window_and_move_units_and_lots
        claim_type: side_effect_execution
        grounds:
          - state_machines.SetterLoad.CANDLED_to_TRANSFERRED
          - entities.HatcherLoad
          - state_machines.EggLot.SET_to_CONSUMED
        distinguishing_aspect: "One transfer must apply five side effects at once: create the HatcherLoad with frozen copies of the pull window and inherited_degree_hours, free the setter, occupy and dirty the hatcher, and move every contributing lot SET -> CONSUMED with eggs_remaining 0. A partial implementation typically forgets the lot leg or the frozen copies."
        test_recipe:
          setup:
            - "Standard fixture: lot L1 (10000 settable) drawn into load S1 in sanitized setter U1, started at 2026-08-01T18:00:00Z, candled at fertile_count 9600, no environment readings so deviation_degree_hours is 0.000."
            - "A sanitized HATCHER unit U2 is ready and the clock is at 2026-08-02T02:00:00Z."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T12:00:00Z"}, as: HatcheryManager}
            - {call: "POST /flock-programs", payload: {code: "P1", breed: "ROSS_308", stimulation_week: 21, lighting_steps: [{age_weeks: 21, photoperiod_hours: 12.0}, {age_weeks: 24, photoperiod_hours: 14.0}, {age_weeks: 30, photoperiod_hours: 16.0}], feed_steps: [{age_weeks: 21, feed_grams_per_hen_day: 150.0}, {age_weeks: 26, feed_grams_per_hen_day: 168.0}]}, as: HatcheryManager, captures: {p1: "$.data.id"}}
            - {call: "POST /breeder-flocks", payload: {code: "F1", program_id: "${p1}", breed: "ROSS_308", house_code: "H1", hatch_date: "2026-01-05T00:00:00Z", placed_at: "2026-05-01T00:00:00Z", hen_count: 9000}, as: FlockManager, captures: {f1: "$.data.id"}}
            - {call: "POST /lab-tests", payload: {subject_type: "BREEDER_FLOCK", subject_id: "${f1}", test_code: "SALMONELLA_PULLORUM", collected_at: "2026-07-20T00:00:00Z"}, as: Veterinarian, captures: {t1: "$.data.id"}}
            - {call: "POST /lab-tests/${t1}/release", payload: {result: "NEGATIVE"}, as: Veterinarian}
            - {call: "POST /breeder-flocks/${f1}/start-lay", payload: {}, as: FlockManager}
            - {call: "POST /egg-lots", payload: {flock_id: "${f1}", collected_at: "2026-07-30T00:00:00Z", collected_count: 10500}, as: FlockManager, captures: {la: "$.data.id"}}
            - {call: "POST /egg-lots/${la}/grade", payload: {grade_a_count: 10000, cracked_count: 300, dirty_count: 150, small_count: 50}, as: FlockManager}
            - {call: "POST /egg-lots/${la}/store", payload: {storage_temp_c: 15.0}, as: IncubationOperator, captures: {lav: "$.data.version"}}
            - {call: "POST /incubation-units", payload: {code: "U1", unit_type: "SETTER", capacity_eggs: 20000}, as: HatcheryManager, captures: {u1: "$.data.id"}}
            - {call: "POST /incubation-units/${u1}/sanitize", payload: {}, as: IncubationOperator}
            - {call: "POST /incubation-profiles", payload: {code: "PR1", breed: "ROSS_308", transfer_hours: 456, total_hours: 504, stages: [{from_hour: 0, to_hour: 240, temp_c: 37.8, humidity_pct: 55.0}, {from_hour: 240, to_hour: 456, temp_c: 37.5, humidity_pct: 52.0}, {from_hour: 456, to_hour: 504, temp_c: 36.9, humidity_pct: 65.0}]}, as: HatcheryManager, captures: {pr1: "$.data.id"}}
            - {call: "POST /setter-loads", payload: {unit_id: "${u1}", profile_id: "${pr1}", planned_set_at: "2026-08-01T18:00:00Z"}, as: IncubationOperator, captures: {s1: "$.data.id"}}
            - {call: "POST /setter-loads/${s1}/items", payload: {egg_lot_id: "${la}", eggs_taken: 10000, expected_egg_lot_version: "${lav}"}, as: IncubationOperator}
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T18:00:00Z"}, as: HatcheryManager}
            - {call: "POST /setter-loads/${s1}/start", payload: {}, as: IncubationOperator}
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-02T02:00:00Z"}, as: HatcheryManager}
            - {call: "POST /setter-loads/${s1}/candle", payload: {fertile_count: 9600}, as: IncubationOperator}
            - {call: "POST /incubation-units", payload: {code: "U2", unit_type: "HATCHER", capacity_eggs: 20000}, as: HatcheryManager, captures: {u2: "$.data.id"}}
            - {call: "POST /incubation-units/${u2}/sanitize", payload: {}, as: IncubationOperator}
          trigger:
            - {call: "POST /setter-loads/${s1}/transfer", payload: {hatcher_unit_id: "${u2}"}, as: IncubationOperator, captures: {h1: "$.data.id"}}
          assert:
            - "HTTP 201 with HatcherLoad.${h1}.setter_load_id == ${s1}, unit_id == ${u2}, status == HATCHING, transferred_at == 2026-08-02T02:00:00Z"
            - "HatcherLoad.${h1}.eggs_transferred == 10000, planned_pull_at == 2026-08-22T18:00:00Z, pull_window_start_at == 2026-08-22T12:00:00Z, pull_window_end_at == 2026-08-23T00:00:00Z"
            - "HatcherLoad.${h1}.inherited_degree_hours == 0.000, quality_flag == NONE, actual_pull_at == null, hold_release_at == null"
            - "SetterLoad.${s1}.status == TRANSFERRED and fertility_pct == 96.00"
            - "IncubationUnit.${u1}.occupancy_status == FREE (setter released) and sanitation_status == DIRTY"
            - "IncubationUnit.${u2}.occupancy_status == OCCUPIED and sanitation_status == DIRTY"
            - "EggLot.${la}.status == CONSUMED with eggs_remaining == 0 and settable_count still 10000"

      - name: flock_cannot_start_lay_twice_or_after_deplete
        claim_type: invalid_transition
        grounds:
          - state_machines.BreederFlock.PLACED_to_IN_LAY
          - validations.priority_11.ERR_FLOCK_INVALID_STATE
          - state_machines.BreederFlock.terminal_states
        distinguishing_aspect: "start-lay is only defined from PLACED: a second call against an IN_LAY flock and any call against the terminal DEPLETED flock must both be 409 ERR_FLOCK_INVALID_STATE, and neither may re-run the forecast side effects."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T12:00:00Z; flock F1 is 29 weeks old, cleared and already IN_LAY with settable_forecast 5754."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T12:00:00Z"}, as: HatcheryManager}
            - {call: "POST /flock-programs", payload: {code: "P1", breed: "ROSS_308", stimulation_week: 21, lighting_steps: [{age_weeks: 21, photoperiod_hours: 12.0}, {age_weeks: 24, photoperiod_hours: 14.0}, {age_weeks: 30, photoperiod_hours: 16.0}], feed_steps: [{age_weeks: 21, feed_grams_per_hen_day: 150.0}, {age_weeks: 26, feed_grams_per_hen_day: 168.0}]}, as: HatcheryManager, captures: {p1: "$.data.id"}}
            - {call: "POST /breeder-flocks", payload: {code: "F1", program_id: "${p1}", breed: "ROSS_308", house_code: "H1", hatch_date: "2026-01-05T00:00:00Z", placed_at: "2026-05-01T00:00:00Z", hen_count: 9000}, as: FlockManager, captures: {f1: "$.data.id"}}
            - {call: "POST /lab-tests", payload: {subject_type: "BREEDER_FLOCK", subject_id: "${f1}", test_code: "SALMONELLA_PULLORUM", collected_at: "2026-07-20T00:00:00Z"}, as: Veterinarian, captures: {t1: "$.data.id"}}
            - {call: "POST /lab-tests/${t1}/release", payload: {result: "NEGATIVE"}, as: Veterinarian}
            - {call: "POST /breeder-flocks/${f1}/start-lay", payload: {}, as: FlockManager}
          trigger:
            - {call: "POST /breeder-flocks/${f1}/start-lay", payload: {}, as: FlockManager, captures: {e1: "$.data.error_id"}}
            - {call: "POST /breeder-flocks/${f1}/deplete", payload: {}, as: FlockManager}
            - {call: "POST /breeder-flocks/${f1}/start-lay", payload: {}, as: FlockManager, captures: {e2: "$.data.error_id"}}
            - {call: "POST /breeder-flocks/${f1}/deplete", payload: {}, as: FlockManager, captures: {e3: "$.data.error_id"}}
          assert:
            - "First call: HTTP 409 with data.error_id == ERR_FLOCK_INVALID_STATE; BreederFlock.${f1}.status stays IN_LAY and settable_forecast stays 5754"
            - "Second call: HTTP 200, status == DEPLETED, settable_forecast == 0, production_rate_pct == 0"
            - "Third call: HTTP 409 ERR_FLOCK_INVALID_STATE - DEPLETED is terminal and cannot go back to IN_LAY"
            - "Fourth call: HTTP 409 ERR_FLOCK_INVALID_STATE - deplete is not idempotent from the terminal state"
            - "BreederFlock.${f1}.settable_forecast is still 0 after all four calls"

      - name: released_lab_test_cannot_be_released_again
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.LabTest.terminal_states
          - validations.priority_18.ERR_LAB_TEST_ALREADY_RELEASED
          - errors.ERR_LAB_TEST_ALREADY_RELEASED
        distinguishing_aspect: "NEGATIVE, POSITIVE and INVALID are all terminal: re-releasing with the same result must fail with 409 ERR_LAB_TEST_ALREADY_RELEASED just as flipping the result would, so a POSITIVE cascade can never be replayed."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T12:00:00Z; flock F1 exists and a SALMONELLA_PULLORUM sample has been released NEGATIVE."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T12:00:00Z"}, as: HatcheryManager}
            - {call: "POST /flock-programs", payload: {code: "P1", breed: "ROSS_308", stimulation_week: 21, lighting_steps: [{age_weeks: 21, photoperiod_hours: 12.0}, {age_weeks: 24, photoperiod_hours: 14.0}, {age_weeks: 30, photoperiod_hours: 16.0}], feed_steps: [{age_weeks: 21, feed_grams_per_hen_day: 150.0}, {age_weeks: 26, feed_grams_per_hen_day: 168.0}]}, as: HatcheryManager, captures: {p1: "$.data.id"}}
            - {call: "POST /breeder-flocks", payload: {code: "F1", program_id: "${p1}", breed: "ROSS_308", house_code: "H1", hatch_date: "2026-01-05T00:00:00Z", placed_at: "2026-05-01T00:00:00Z", hen_count: 9000}, as: FlockManager, captures: {f1: "$.data.id"}}
            - {call: "POST /lab-tests", payload: {subject_type: "BREEDER_FLOCK", subject_id: "${f1}", test_code: "SALMONELLA_PULLORUM", collected_at: "2026-07-20T00:00:00Z"}, as: Veterinarian, captures: {t1: "$.data.id"}}
            - {call: "POST /lab-tests/${t1}/release", payload: {result: "NEGATIVE"}, as: Veterinarian}
          trigger:
            - {call: "POST /lab-tests/${t1}/release", payload: {result: "NEGATIVE"}, as: Veterinarian, captures: {e1: "$.data.error_id"}}
            - {call: "POST /lab-tests/${t1}/release", payload: {result: "POSITIVE"}, as: Veterinarian, captures: {e2: "$.data.error_id"}}
          assert:
            - "Both calls: HTTP 409 with data.error_id == ERR_LAB_TEST_ALREADY_RELEASED"
            - "LabTest.${t1}.status == NEGATIVE, result == NEGATIVE, released_at == 2026-08-01T12:00:00Z, version unchanged by the two rejections"
            - "BreederFlock.${f1}.status == PLACED and egg_hold_opened_at == null: the POSITIVE cascade never ran"

      - name: chick_flow_cannot_skip_or_repeat_steps
        claim_type: idempotency
        grounds:
          - state_machines.ChickBatch
          - validations.priority_15.ERR_CHICK_FLOW_INVALID_STATE
          - validations.priority_14.ERR_INCUBATION_INVALID_STATE
        distinguishing_aspect: "The chick flow is strictly PULLED -> SEXED -> VACCINATED -> BOXED: boxing a SEXED batch, re-sexing a SEXED batch and pulling an already-pulled hatcher load must each be a 409, and none of them may recompute the yield block."
        test_recipe:
          setup:
            - "Standard fixture through transfer, clock at 2026-08-22T18:00:00Z, hatcher load H1 pulled at hatched_count 9400 producing batch CB1, then sexed 4600/4700/0/100."
