# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Yoga & Pilates Studio — breadth probe over §1.1-§1.7
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_member_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Member.fields.email, entities.Member.fields.is_new_student]
        distinguishing_aspect: "POST /members with email/full_name/home_studio_state -> 201; is_new_student=true, account_status=ACTIVE, no_show_strike_count=0 server-defaulted."
        test_recipe:
          setup: ["Empty DB; clock at startup default."]
          setup_api_calls: []
          trigger:
            - call: "POST /members"
              payload: { email: "new@x.com", full_name: "Nora", home_studio_state: "CA" }
              as: StudioManager
              captures: { m_id: $.data.id, ns: $.data.is_new_student }
          assert:
            - "HTTP status == 201"
            - "Member.${m_id}.is_new_student == true"
            - "Member.${m_id}.account_status == ACTIVE"
            - "Member.${m_id}.no_show_strike_count == 0"

      - name: create_room_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Room.fields.room_type]
        distinguishing_aspect: "POST /rooms omitting room_type -> ERR_INVALID_REQUEST (422); required input with no default."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /rooms"
              payload: { name: "Roomless", station_capacity: 4 }
              as: StudioManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 422"

      - name: create_room_invalid_enum_room_type
        claim_type: Type Constraints
        grounds: [entities.Room.fields.room_type]
        distinguishing_aspect: "room_type='POOL' is not REFORMER|MAT -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /rooms"
              payload: { name: "Pool", room_type: "POOL", station_capacity: 4 }
              as: StudioManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 422"

      - name: get_member_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Member]
        distinguishing_aspect: "GET /members/{random-uuid} -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /members/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StudioManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: fee_charge_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.FeeCharge]
        distinguishing_aspect: "FeeCharge is common_fields:false — it has id and created_at but no version field; only status mutates via settle."
        test_recipe:
          setup: ["A member with a settled NO_SHOW FeeCharge exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: StudioManager
            - call: "POST /rooms"
              payload: { name: "Mat A", room_type: "MAT", station_capacity: 10 }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /teachers"
              payload: { full_name: "Tia", certifications: ["VINYASA"] }
              as: StudioManager
              captures: { teacher_id: $.data.id }
            - call: "POST /members"
              payload: { email: "im@x.com", full_name: "Im", home_studio_state: "CA" }
              as: StudioManager
              captures: { m_id: $.data.id }
            - call: "POST /entitlements"
              payload: { member_id: "${m_id}", kind: "MEMBERSHIP", price_cents: 10000, credits_total: -1, cycle_start_utc: "2026-02-01T00:00:00Z" }
              as: StudioManager
              captures: { ent_id: $.data.id }
            - call: "POST /entitlements/${ent_id}/activate"
              payload: {}
              as: StudioManager
            # Establish member first (attend one) so the no-show fee is non-zero.
            - call: "POST /class-sessions"
              payload: { room_id: "${room_id}", teacher_id: "${teacher_id}", discipline: "VINYASA", start_utc: "2026-02-01T06:00:00Z", end_utc: "2026-02-01T07:00:00Z", published_capacity: 10 }
              as: StudioManager
              captures: { pa_id: $.data.id }
            - call: "POST /class-sessions/${pa_id}/publish"
              payload: {}
              as: StudioManager
              captures: { pa_v: $.data.version }
            - call: "POST /reservations"
              payload: { member_id: "${m_id}", class_session_id: "${pa_id}", entitlement_id: "${ent_id}", expected_class_session_version: "${pa_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { pa_r: $.data.id }
            - call: "POST /class-sessions/${pa_id}/start"
              payload: {}
              as: StudioManager
            - call: "POST /reservations/${pa_r}/check-in"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /class-sessions/${pa_id}/complete"
              payload: {}
              as: StudioManager
            # No-show on a second session to mint a FeeCharge.
            - call: "POST /class-sessions"
              payload: { room_id: "${room_id}", teacher_id: "${teacher_id}", discipline: "VINYASA", start_utc: "2026-02-02T06:00:00Z", end_utc: "2026-02-02T07:00:00Z", published_capacity: 10 }
              as: StudioManager
              captures: { ns_id: $.data.id }
            - call: "POST /class-sessions/${ns_id}/publish"
              payload: {}
              as: StudioManager
              captures: { ns_v: $.data.version }
            - call: "POST /reservations"
              payload: { member_id: "${m_id}", class_session_id: "${ns_id}", entitlement_id: "${ent_id}", expected_class_session_version: "${ns_v}" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-02T06:00:00Z" }
              as: StudioManager
            - call: "POST /class-sessions/${ns_id}/start"
              payload: {}
              as: StudioManager
            - call: "POST /class-sessions/${ns_id}/complete"
              payload: {}
              as: StudioManager
          trigger:
            - call: "GET /members/${m_id}/fee-charges"
              payload: {}
              as: StudioManager
              captures: { fc_id: "$.data[0].id" }
          assert:
            - "FeeCharge ${fc_id} exposes id and created_at but no version field"
            - "FeeCharge ${fc_id}.fee_type == NO_SHOW and status == UNPAID"

      - name: computed_credits_remaining_after_booking
        claim_type: Computed Fields
        grounds: [entities.Entitlement.fields.credits_remaining]
        distinguishing_aspect: "credits_remaining is computed: 5-credit pack after one booking shows credits_remaining==4 regardless of any input value."
        test_recipe:
          setup: ["Member with ACTIVE 5-credit CLASS_PACK; one BOOKED reservation."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: StudioManager
            - call: "POST /rooms"
              payload: { name: "Mat A", room_type: "MAT", station_capacity: 10 }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /teachers"
              payload: { full_name: "Tia", certifications: ["VINYASA"] }
              as: StudioManager
              captures: { teacher_id: $.data.id }
            - call: "POST /members"
              payload: { email: "cr@x.com", full_name: "Cr", home_studio_state: "CA" }
              as: StudioManager
              captures: { m_id: $.data.id }
            - call: "POST /entitlements"
              payload: { member_id: "${m_id}", kind: "CLASS_PACK", price_cents: 5000, credits_total: 5, cycle_start_utc: "2026-02-01T00:00:00Z" }
              as: StudioManager
              captures: { ent_id: $.data.id }
            - call: "POST /entitlements/${ent_id}/activate"
              payload: {}
              as: StudioManager
            - call: "POST /class-sessions"
              payload: { room_id: "${room_id}", teacher_id: "${teacher_id}", discipline: "VINYASA", start_utc: "2026-02-20T10:00:00Z", end_utc: "2026-02-20T11:00:00Z", published_capacity: 10 }
              as: StudioManager
              captures: { s_id: $.data.id }
            - call: "POST /class-sessions/${s_id}/publish"
              payload: {}
              as: StudioManager
              captures: { s_v: $.data.version }
            - call: "POST /reservations"
              payload: { member_id: "${m_id}", class_session_id: "${s_id}", entitlement_id: "${ent_id}", expected_class_session_version: "${s_v}" }
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "GET /entitlements/${ent_id}"
              payload: {}
              as: StudioManager
              captures: { rem: $.data.credits_remaining }
          assert:
            - "Entitlement.${ent_id}.credits_used == 1"
            - "Entitlement.${ent_id}.credits_remaining == 4"

      - name: list_members_pagination_envelope
        claim_type: Listing
        grounds: [entities.Member]
        distinguishing_aspect: "GET /members returns array envelope with total_count and has_more pagination fields."
        test_recipe:
          setup: ["Two members exist."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "a@x.com", full_name: "A", home_studio_state: "CA" }
              as: StudioManager
            - call: "POST /members"
              payload: { email: "b@x.com", full_name: "B", home_studio_state: "CA" }
              as: StudioManager
          trigger:
            - call: "GET /members"
              payload: { limit: 1, offset: 0 }
              as: StudioManager
          assert:
            - "response_type == array; meta.total_count == 2; has_more == true; returned data length == 1"

      - name: create_intro_offer_returns_201_active
        claim_type: Creation
        grounds: [entities.IntroOffer.fields.window_days, entities.IntroOffer.fields.status]
        distinguishing_aspect: "POST /intro-offers -> 201 with status=ACTIVE; window_days/credits_total stored as input."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /intro-offers"
              payload: { name: "Two Weeks Unlimited", price_cents: 3000, credits_total: -1, window_days: 14 }
              as: StudioManager
              captures: { io_id: $.data.id, io_status: $.data.status }
          assert:
            - "HTTP status == 201"
            - "IntroOffer.${io_id}.status == ACTIVE"
            - "IntroOffer.${io_id}.window_days == 14"

      - name: new_student_redeems_intro_offer_succeeds
        claim_type: Creation
        grounds: [entities.Entitlement.fields.intro_offer_id, "validations[priority=9]"]
        distinguishing_aspect: "A new-student member purchasing an INTRO entitlement that references an ACTIVE IntroOffer -> 201; intro_offer_id stored."
        test_recipe:
          setup: ["Clock 2026-02-01. An ACTIVE IntroOffer exists; a brand-new member M (is_new_student=true)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: StudioManager
            - call: "POST /intro-offers"
              payload: { name: "Two Weeks Unlimited", price_cents: 3000, credits_total: -1, window_days: 14 }
              as: StudioManager
              captures: { io_id: $.data.id }
            - call: "POST /members"
              payload: { email: "nr@x.com", full_name: "Nr", home_studio_state: "CA" }
              as: StudioManager
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /entitlements"
              payload: { member_id: "${m_id}", kind: "INTRO", price_cents: 3000, credits_total: -1, cycle_start_utc: "2026-02-01T00:00:00Z", intro_offer_id: "${io_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { ent_id: $.data.id, ent_lc: $.data.lifecycle_status }
          assert:
            - "HTTP status == 201"
            - "Entitlement.${ent_id}.intro_offer_id == ${io_id}"
            - "Entitlement.${ent_id}.kind == INTRO and lifecycle_status == PENDING"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: cancel_reservation_from_attended_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Reservation]
        distinguishing_aspect: "An ATTENDED (terminal) reservation cannot be cancelled -> ERR_INVALID_STATE (409); no side effects."
        test_recipe:
          setup: ["Member attended a completed session; reservation R is ATTENDED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: StudioManager
            - call: "POST /rooms"
              payload: { name: "Mat A", room_type: "MAT", station_capacity: 10 }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /teachers"
              payload: { full_name: "Tia", certifications: ["VINYASA"] }
              as: StudioManager
              captures: { teacher_id: $.data.id }
            - call: "POST /members"
              payload: { email: "at@x.com", full_name: "At", home_studio_state: "CA" }
              as: StudioManager
              captures: { m_id: $.data.id }
            - call: "POST /entitlements"
              payload: { member_id: "${m_id}", kind: "MEMBERSHIP", price_cents: 10000, credits_total: -1, cycle_start_utc: "2026-02-01T00:00:00Z" }
              as: StudioManager
              captures: { ent_id: $.data.id }
            - call: "POST /entitlements/${ent_id}/activate"
              payload: {}
              as: StudioManager
            - call: "POST /class-sessions"
              payload: { room_id: "${room_id}", teacher_id: "${teacher_id}", discipline: "VINYASA", start_utc: "2026-02-05T10:00:00Z", end_utc: "2026-02-05T11:00:00Z", published_capacity: 10 }
              as: StudioManager
              captures: { s_id: $.data.id }
            - call: "POST /class-sessions/${s_id}/publish"
              payload: {}
              as: StudioManager
              captures: { s_v: $.data.version }
            - call: "POST /reservations"
              payload: { member_id: "${m_id}", class_session_id: "${s_id}", entitlement_id: "${ent_id}", expected_class_session_version: "${s_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { r_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-05T10:00:00Z" }
              as: StudioManager
            - call: "POST /class-sessions/${s_id}/start"
              payload: {}
              as: StudioManager
            - call: "POST /reservations/${r_id}/check-in"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /class-sessions/${s_id}/complete"
              payload: {}
              as: StudioManager
          trigger:
            - call: "POST /reservations/${r_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: start_session_before_start_utc_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.ClassSession.OPEN_to_IN_PROGRESS]
        distinguishing_aspect: "Starting an OPEN session while clock < start_utc violates the precondition -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Published OPEN session S start 2026-02-20T10:00Z; clock still 2026-02-01."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: StudioManager
            - call: "POST /rooms"
              payload: { name: "Mat A", room_type: "MAT", station_capacity: 10 }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /teachers"
              payload: { full_name: "Tia", certifications: ["VINYASA"] }
              as: StudioManager
              captures: { teacher_id: $.data.id }
            - call: "POST /class-sessions"
              payload: { room_id: "${room_id}", teacher_id: "${teacher_id}", discipline: "VINYASA", start_utc: "2026-02-20T10:00:00Z", end_utc: "2026-02-20T11:00:00Z", published_capacity: 10 }
              as: StudioManager
              captures: { s_id: $.data.id }
            - call: "POST /class-sessions/${s_id}/publish"
              payload: {}
              as: StudioManager
          trigger:
            - call: "POST /class-sessions/${s_id}/start"
              payload: {}
              as: StudioManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: newly_created_session_initial_state_scheduled
        claim_type: Initial State
        grounds: [state_machines.ClassSession]
        distinguishing_aspect: "A freshly created ClassSession starts in SCHEDULED with booked_count=0, waitlisted_count=0."
        test_recipe:
          setup: ["Room and teacher exist."]
          setup_api_calls:
            - call: "POST /rooms"
              payload: { name: "Mat A", room_type: "MAT", station_capacity: 10 }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /teachers"
              payload: { full_name: "Tia", certifications: ["VINYASA"] }
              as: StudioManager
              captures: { teacher_id: $.data.id }
          trigger:
            - call: "POST /class-sessions"
              payload: { room_id: "${room_id}", teacher_id: "${teacher_id}", discipline: "VINYASA", start_utc: "2026-03-01T10:00:00Z", end_utc: "2026-03-01T11:00:00Z", published_capacity: 10 }
              as: StudioManager
              captures: { s_id: $.data.id, st: $.data.status }
          assert:
            - "ClassSession.${s_id}.status == SCHEDULED"
            - "ClassSession.${s_id}.booked_count == 0 and waitlisted_count == 0"

      - name: cancelled_workshop_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Workshop]
        distinguishing_aspect: "A CANCELLED workshop is terminal: re-publishing it -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Workshop W in DRAFT, then CANCELLED."]
          setup_api_calls:
            - call: "POST /rooms"
              payload: { name: "Mat A", room_type: "MAT", station_capacity: 10 }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /teachers"
              payload: { full_name: "Tia", certifications: ["VINYASA"] }
              as: StudioManager
              captures: { teacher_id: $.data.id }
            - call: "POST /workshops"
              payload: { room_id: "${room_id}", lead_teacher_id: "${teacher_id}", title: "W", kind: "WORKSHOP", start_utc: "2026-03-01T09:00:00Z", end_utc: "2026-03-01T12:00:00Z", seat_capacity: 8, deposit_cents: 2000, price_cents: 8000 }
              as: StudioManager
              captures: { w_id: $.data.id }
            - call: "POST /workshops/${w_id}/cancel"
              payload: {}
              as: StudioManager
          trigger:
            - call: "POST /workshops/${w_id}/publish"
              payload: {}
              as: StudioManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: waitlist_promote_repacks_positions
        claim_type: Side Effect Execution
        grounds: [state_machines.Reservation.WAITLISTED_to_BOOKED, entities.Reservation.fields.waitlist_position]
        distinguishing_aspect: "When the head WAITLISTED res promotes, every remaining WAITLISTED res decrements waitlist_position by 1 (queue re-pack)."
        test_recipe:
          setup: ["REFORMER Room cap 1, session S cap 1. M1 BOOKED, M2 WAITLISTED pos 1, M3 WAITLISTED pos 2."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: StudioManager
            - call: "POST /rooms"
              payload: { name: "Reformer A", room_type: "REFORMER", station_capacity: 1 }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /teachers"
              payload: { full_name: "Tara", certifications: ["REFORMER"] }
              as: StudioManager
              captures: { teacher_id: $.data.id }
            - call: "POST /members"
              payload: { email: "k1@x.com", full_name: "K1", home_studio_state: "CA" }
              as: StudioManager
              captures: { m1_id: $.data.id }
            - call: "POST /members"
              payload: { email: "k2@x.com", full_name: "K2", home_studio_state: "CA" }
              as: StudioManager
              captures: { m2_id: $.data.id }
            - call: "POST /members"
              payload: { email: "k3@x.com", full_name: "K3", home_studio_state: "CA" }
              as: StudioManager
              captures: { m3_id: $.data.id }
            - call: "POST /entitlements"
              payload: { member_id: "${m1_id}", kind: "MEMBERSHIP", price_cents: 10000, credits_total: -1, cycle_start_utc: "2026-02-01T00:00:00Z" }
              as: StudioManager
              captures: { e1_id: $.data.id }
            - call: "POST /entitlements/${e1_id}/activate"
              payload: {}
              as: StudioManager
            - call: "POST /entitlements"
              payload: { member_id: "${m2_id}", kind: "MEMBERSHIP", price_cents: 10000, credits_total: -1, cycle_start_utc: "2026-02-01T00:00:00Z" }
              as: StudioManager
              captures: { e2_id: $.data.id }
            - call: "POST /entitlements/${e2_id}/activate"
              payload: {}
              as: StudioManager
            - call: "POST /entitlements"
              payload: { member_id: "${m3_id}", kind: "MEMBERSHIP", price_cents: 10000, credits_total: -1, cycle_start_utc: "2026-02-01T00:00:00Z" }
              as: StudioManager
              captures: { e3_id: $.data.id }
            - call: "POST /entitlements/${e3_id}/activate"
              payload: {}
              as: StudioManager
            - call: "POST /class-sessions"
              payload: { room_id: "${room_id}", teacher_id: "${teacher_id}", discipline: "REFORMER", start_utc: "2026-02-26T10:00:00Z", end_utc: "2026-02-26T11:00:00Z", published_capacity: 1, waitlist_capacity: 5 }
              as: StudioManager
              captures: { s_id: $.data.id }
            - call: "POST /class-sessions/${s_id}/publish"
              payload: {}
              as: StudioManager
              captures: { s_v0: $.data.version }
            - call: "POST /reservations"
              payload: { member_id: "${m1_id}", class_session_id: "${s_id}", entitlement_id: "${e1_id}", expected_class_session_version: "${s_v0}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { r1_id: $.data.id }
            - call: "GET /class-sessions/${s_id}"
              payload: {}
              as: StudioManager
              captures: { s_vA: $.data.version }
            - call: "POST /reservations"
              payload: { member_id: "${m2_id}", class_session_id: "${s_id}", entitlement_id: "${e2_id}", expected_class_session_version: "${s_vA}" }
              as: Member
              as_user_id: "${m2_id}"
              captures: { r2_id: $.data.id }
            - call: "GET /class-sessions/${s_id}"
