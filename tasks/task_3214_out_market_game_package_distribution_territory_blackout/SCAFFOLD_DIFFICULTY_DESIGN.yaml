# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3214_out_market_game_package_distribution_territory_blackout
#
# Nine Difficulty Rules x 2 instances each = 18 instances. Every grounds ref
# resolves into SCAFFOLD.yaml §1.1–§1.7; every setup_api_calls chain replays
# cleanly against §1.2 / §1.4 / §1.5 from empty-DB.
#
# Shared fixture spine (re-declared per instance, never referenced across
# instances): logical clock 2026-09-01T00:00:00Z (week 4 of the season);
# grant "StreamMax" (cap 2000); season S26 18 weeks, 2026-08-05 → 2026-12-09,
# grace_days 7, student_discount_pct 50; markets NYC (100,101,102 / [NYC]),
# DAL (750,751 / [DAL]), LA (900 / [LAC]); week-4 slate with games
# KC@DAL (DAL), BUF@NYC (NYC), LAC@DEN (LA).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: charged_price_discount_before_proration_ordering
        grounds:
          - calculations.charged_price
          - calculations.proration_factor
          - entities.Subscription.fields.price_charged_cents
        distinguishing_aspect: |
          Money-side dual variant on Subscription: the pinned evaluation order
          (student discount on full-season base BEFORE week proration) yields
          6882 cents, while the plausible reversed order (prorate then discount)
          yields 6881 for the same inputs — the scaffold pins step 1 → step 2.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (week 4 of the season)."
            - "Season with regular_season_weeks 17 (2026-08-05 → 2026-12-02), student_discount_pct 10."
            - "STUDENT offer base_price_cents 9999, valid 2026-08-01 → 2026-12-31."
            - "Residential account with a VERIFIED student verification valid through 2027-06-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rights-grants"
              payload: { distributor_name: "StreamMax", scope: "OUT_OF_MARKET", exclusivity: "EXCLUSIVE", effective_from: "2026-01-01T00:00:00Z", effective_until: "2027-06-01T00:00:00Z", max_commercial_occupancy_cap: 2000 }
              as: PlatformAdmin
              captures: { rg_id: $.data.id }
            - call: "POST /seasons"
              payload: { rights_grant_id: "${rg_id}", label: "2026-Regular", regular_season_weeks: 17, season_start_date: "2026-08-05T00:00:00Z", season_end_date: "2026-12-02T00:00:00Z", grace_days: 7, student_discount_pct: 10 }
              as: LeagueOps
              captures: { season_id: $.data.id }
            - call: "POST /offers"
              payload: { season_id: "${season_id}", plan_tier: "STUDENT", base_price_cents: 9999, includes_multiview: false, includes_companion: false, valid_from: "2026-08-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { offer_id: $.data.id }
            - call: "POST /accounts/register"
              payload: { email: "stu@x.com", full_name: "Stu Dent", account_kind: "RESIDENTIAL", billing_zip: "10001" }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "POST /student-verifications"
              payload: { account_id: "${acct_id}", institution_name: "State U", verification_method: "SHEERID", valid_through: "2027-06-01T00:00:00Z" }
              as: ComplianceAuditor
          trigger:
            - call: "POST /subscriptions"
              payload: { account_id: "${acct_id}", offer_id: "${offer_id}" }
              as: Subscriber
              as_user_id: "${acct_id}"
              captures: { sub_id: $.data.id, charged: $.data.price_charged_cents }
          assert:
            - "Subscription.${sub_id}.price_charged_cents == 6882 (round_half_up(9999*90/100)=8999, then round_half_up(8999*13/17)=6882)"
            - "Subscription.${sub_id}.price_charged_cents != 6881 (the prorate-then-discount reversed order)"
            - "Subscription.${sub_id}.purchase_week_index == 4"
            - "Subscription.${sub_id}.status == PENDING_PAYMENT"

      - name: effective_market_device_vs_billing_authoritative
        grounds:
          - calculations.effective_market
          - calculations.territory_determination
          - entities.TerritoryCheck.fields.effective_market_code
        distinguishing_aspect: |
          Territory-side dual variant on Account/TerritoryCheck (different
          entity domain from Subscription pricing): the same check inputs
          resolve to device market DAL when the account is ACTIVE
          (device_preferred) but to billing market NYC once the account is
          SUSPENDED (billing_authoritative), flipping the KC@DAL verdict
          from BLACKED_OUT back to AVAILABLE.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; season 18 weeks (2026-08-05 → 2026-12-09)."
            - "Markets NYC (prefix 100), DAL (prefix 750), LA (prefix 900)."
            - "Week-4 slate with games KC@DAL (home_market DAL), BUF@NYC (NYC), LAC@DEN (LA)."
            - "Account billed in NYC (billing_zip 10001) holding an ACTIVE BASE subscription."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rights-grants"
              payload: { distributor_name: "StreamMax", scope: "OUT_OF_MARKET", exclusivity: "EXCLUSIVE", effective_from: "2026-01-01T00:00:00Z", effective_until: "2027-06-01T00:00:00Z", max_commercial_occupancy_cap: 2000 }
              as: PlatformAdmin
              captures: { rg_id: $.data.id }
            - call: "POST /seasons"
              payload: { rights_grant_id: "${rg_id}", label: "2026-Regular", regular_season_weeks: 18, season_start_date: "2026-08-05T00:00:00Z", season_end_date: "2026-12-09T00:00:00Z" }
              as: LeagueOps
              captures: { season_id: $.data.id }
            - call: "POST /markets"
              payload: { code: "NYC", name: "New York", zip_prefixes: ["100"], home_team_codes: ["NYC"] }
              as: LeagueOps
            - call: "POST /markets"
              payload: { code: "DAL", name: "Dallas", zip_prefixes: ["750"], home_team_codes: ["DAL"] }
              as: LeagueOps
            - call: "POST /markets"
              payload: { code: "LA", name: "Los Angeles", zip_prefixes: ["900"], home_team_codes: ["LAC"] }
              as: LeagueOps
            - call: "POST /week-slates"
              payload: { season_id: "${season_id}", week_index: 4 }
              as: LeagueOps
              captures: { slate_id: $.data.id }
            - call: "POST /games"
              payload: { season_id: "${season_id}", week_index: 4, away_team_code: "KC", home_team_code: "DAL", kickoff_at: "2026-08-30T17:00:00Z", home_market_code: "DAL" }
              as: LeagueOps
              captures: { game_dal: $.data.id }
            - call: "POST /games"
              payload: { season_id: "${season_id}", week_index: 4, away_team_code: "BUF", home_team_code: "NYC", kickoff_at: "2026-08-30T17:00:00Z", home_market_code: "NYC" }
              as: LeagueOps
            - call: "POST /games"
              payload: { season_id: "${season_id}", week_index: 4, away_team_code: "LAC", home_team_code: "DEN", kickoff_at: "2026-08-30T20:00:00Z", home_market_code: "LA" }
              as: LeagueOps
            - call: "POST /offers"
              payload: { season_id: "${season_id}", plan_tier: "BASE", base_price_cents: 20000, includes_multiview: false, includes_companion: false, valid_from: "2026-08-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { offer_id: $.data.id }
            - call: "POST /accounts/register"
              payload: { email: "res@x.com", full_name: "Res Ident", account_kind: "RESIDENTIAL", billing_zip: "10001" }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${acct_id}", offer_id: "${offer_id}" }
              as: Subscriber
              as_user_id: "${acct_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /_payments/simulate"
              payload: { subscription_id: "${sub_id}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
          trigger:
            - call: "POST /territory-checks"
              payload: { account_id: "${acct_id}", subscription_id: "${sub_id}", game_id: "${game_dal}", device_zip: "75001" }
              as: Subscriber
              as_user_id: "${acct_id}"
              captures: { verdict_active: $.data.verdict, market_active: $.data.effective_market_code }
            - call: "POST /accounts/${acct_id}/flag-commercial-misuse"
              payload: { reason: "suspected bar streaming" }
              as: ComplianceAuditor
            - call: "POST /territory-checks"
              payload: { account_id: "${acct_id}", subscription_id: "${sub_id}", game_id: "${game_dal}", device_zip: "75001" }
              as: SupportAgent
              as_user_id: "sa-jane"
              captures: { verdict_susp: $.data.verdict, market_susp: $.data.effective_market_code }
          assert:
            - "first check (ACTIVE account, device in DAL): effective_market_code == \"DAL\" and verdict == BLACKED_OUT (device_preferred variant)"
            - "after flag-commercial-misuse, second check with the identical device_zip: effective_market_code == \"NYC\" and verdict == AVAILABLE (billing_authoritative variant)"
            - "Account.${acct_id}.status == SUSPENDED and Subscription.${sub_id}.entitlement_state == SUSPENDED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: charged_price_circular_evaluation_order_pinned
        grounds:
          - calculations.charged_price
          - entities.Offer.fields.base_price_cents
          - entities.Season.fields.student_discount_pct
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency: price depends on purchase
          week, purchase week derives from the clock at purchase, and the
          discount tier is keyed on the offer; the scaffold pins the
          left-to-right order (tier_base → proration → final cents) so the
          PREMIUM price bought in week 4 of an 18-week season is exactly
          25000 with no ambiguity about which anchor applies.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (week 4); season 18 weeks; PREMIUM offer 30000 cents."
            - "Residential account, no student verification."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rights-grants"
              payload: { distributor_name: "StreamMax", scope: "OUT_OF_MARKET", exclusivity: "EXCLUSIVE", effective_from: "2026-01-01T00:00:00Z", effective_until: "2027-06-01T00:00:00Z", max_commercial_occupancy_cap: 2000 }
              as: PlatformAdmin
              captures: { rg_id: $.data.id }
            - call: "POST /seasons"
              payload: { rights_grant_id: "${rg_id}", label: "2026-Regular", regular_season_weeks: 18, season_start_date: "2026-08-05T00:00:00Z", season_end_date: "2026-12-09T00:00:00Z" }
              as: LeagueOps
              captures: { season_id: $.data.id }
            - call: "POST /offers"
              payload: { season_id: "${season_id}", plan_tier: "PREMIUM", base_price_cents: 30000, includes_multiview: true, includes_companion: true, valid_from: "2026-08-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { offer_id: $.data.id }
            - call: "POST /accounts/register"
              payload: { email: "prem@x.com", full_name: "Prem Ium", account_kind: "RESIDENTIAL", billing_zip: "10001" }
              as: Anonymous
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /subscriptions"
              payload: { account_id: "${acct_id}", offer_id: "${offer_id}" }
              as: Subscriber
              as_user_id: "${acct_id}"
              captures: { sub_id: $.data.id }
          assert:
            - "Subscription.${sub_id}.price_charged_cents == 25000 (round_half_up(30000 * 15 / 18))"
            - "Subscription.${sub_id}.purchase_week_index == 4"
            - "Subscription.${sub_id}.plan_tier == PREMIUM (snapshot survives a later offer withdrawal)"

      - name: game_availability_set_difference_across_postures
        grounds:
          - calculations.game_availability
          - entities.WeekSlate.fields.national_game_ids
          - entities.WeekSlate.fields.finalized_game_ids
          - entities.WeekSlate.fields.package_game_count
        distinguishing_aspect: |
          Mode (a) — ≥3 inputs with non-linear interaction: package_game_count
          = f(week game total, national selection set, slate_status) where the
          slate_status branch selects between a live set difference
          (PRELIMINARY) and a frozen snapshot (FINALIZED/LOCKED); the same
          three games + one selection yield count 2 live, then 2 frozen, and
          a post-finalize add drops the frozen count to 1 while reopening
          restores the live count to 1 (selection retained) — the branch
          structure, not a single formula, drives the result.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; season 18 weeks; week-4 slate with three games."
            - "One national selection (KC@DAL) added while PRELIMINARY."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rights-grants"
              payload: { distributor_name: "StreamMax", scope: "OUT_OF_MARKET", exclusivity: "EXCLUSIVE", effective_from: "2026-01-01T00:00:00Z", effective_until: "2027-06-01T00:00:00Z", max_commercial_occupancy_cap: 2000 }
              as: PlatformAdmin
              captures: { rg_id: $.data.id }
            - call: "POST /seasons"
              payload: { rights_grant_id: "${rg_id}", label: "2026-Regular", regular_season_weeks: 18, season_start_date: "2026-08-05T00:00:00Z", season_end_date: "2026-12-09T00:00:00Z" }
              as: LeagueOps
              captures: { season_id: $.data.id }
            - call: "POST /markets"
              payload: { code: "NYC", name: "New York", zip_prefixes: ["100"], home_team_codes: ["NYC"] }
              as: LeagueOps
            - call: "POST /markets"
              payload: { code: "DAL", name: "Dallas", zip_prefixes: ["750"], home_team_codes: ["DAL"] }
              as: LeagueOps
            - call: "POST /markets"
              payload: { code: "LA", name: "Los Angeles", zip_prefixes: ["900"], home_team_codes: ["LAC"] }
              as: LeagueOps
            - call: "POST /week-slates"
              payload: { season_id: "${season_id}", week_index: 4 }
              as: LeagueOps
              captures: { slate_id: $.data.id, slate_v0: $.data.version }
            - call: "POST /games"
              payload: { season_id: "${season_id}", week_index: 4, away_team_code: "KC", home_team_code: "DAL", kickoff_at: "2026-08-30T17:00:00Z", home_market_code: "DAL" }
              as: LeagueOps
              captures: { game_dal: $.data.id }
            - call: "POST /games"
              payload: { season_id: "${season_id}", week_index: 4, away_team_code: "BUF", home_team_code: "NYC", kickoff_at: "2026-08-30T17:00:00Z", home_market_code: "NYC" }
              as: LeagueOps
              captures: { game_nyc: $.data.id }
            - call: "POST /games"
              payload: { season_id: "${season_id}", week_index: 4, away_team_code: "LAC", home_team_code: "DEN", kickoff_at: "2026-08-30T20:00:00Z", home_market_code: "LA" }
              as: LeagueOps
              captures: { game_la: $.data.id }
            - call: "POST /week-slates/${slate_id}/selections"
              payload: { game_id: "${game_dal}", action: "ADD", expected_slate_version: "${slate_v0}" }
              as: LeagueOps
              captures: { slate_v1: $.data.version, count_prelim: $.data.package_game_count }
          trigger:
            - call: "POST /week-slates/${slate_id}/finalize"
              payload: { expected_slate_version: "${slate_v1}" }
              as: LeagueOps
              captures: { slate_v2: $.data.version, finalized_ids: $.data.finalized_game_ids }
            - call: "POST /week-slates/${slate_id}/selections"
              payload: { game_id: "${game_nyc}", action: "ADD", expected_slate_version: "${slate_v2}" }
              as: LeagueOps
              captures: { slate_v3: $.data.version, count_final: $.data.package_game_count }
            - call: "POST /week-slates/${slate_id}/reopen"
              payload: {}
              as: LeagueOps
              captures: { count_reopen: $.data.package_game_count }
          assert:
            - "after ADD in PRELIMINARY: package_game_count == 2 and finalized_game_ids == []"
            - "after finalize: finalized_game_ids == [${game_nyc}, ${game_la}] (week games minus national selection)"
            - "late ADD while FINALIZED: package_game_count == 1 and finalized_game_ids == [${game_la}]"
            - "after reopen: finalized_game_ids == [] and package_game_count == 1 (live count retains both selections)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: week_slate_finalize_reopen_correction_loop
        grounds:
          - state_machines.WeekSlate.PRELIMINARY_to_FINALIZED
          - state_machines.WeekSlate.FINALIZED_to_PRELIMINARY
          - state_machines.WeekSlate.FINALIZED_to_LOCKED
        distinguishing_aspect: |
          WeekSlate exhibits a true cycle PRELIMINARY → FINALIZED →
          PRELIMINARY → FINALIZED (correction loop), and the loop is only
          closable by LOCKED once the week's first kickoff has passed —
          reopened slates clear finalized_game_ids while retaining the
          national selection set.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; season 18 weeks; week-4 slate with two games, no selections."
            - "Slate finalized once (version advances), then reopened, then re-finalized."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rights-grants"
              payload: { distributor_name: "StreamMax", scope: "OUT_OF_MARKET", exclusivity: "EXCLUSIVE", effective_from: "2026-01-01T00:00:00Z", effective_until: "2027-06-01T00:00:00Z", max_commercial_occupancy_cap: 2000 }
              as: PlatformAdmin
              captures: { rg_id: $.data.id }
            - call: "POST /seasons"
              payload: { rights_grant_id: "${rg_id}", label: "2026-Regular", regular_season_weeks: 18, season_start_date: "2026-08-05T00:00:00Z", season_end_date: "2026-12-09T00:00:00Z" }
              as: LeagueOps
              captures: { season_id: $.data.id }
            - call: "POST /markets"
              payload: { code: "DAL", name: "Dallas", zip_prefixes: ["750"], home_team_codes: ["DAL"] }
              as: LeagueOps
            - call: "POST /markets"
              payload: { code: "NYC", name: "New York", zip_prefixes: ["100"], home_team_codes: ["NYC"] }
              as: LeagueOps
            - call: "POST /week-slates"
              payload: { season_id: "${season_id}", week_index: 4 }
              as: LeagueOps
              captures: { slate_id: $.data.id, slate_v0: $.data.version }
            - call: "POST /games"
              payload: { season_id: "${season_id}", week_index: 4, away_team_code: "KC", home_team_code: "DAL", kickoff_at: "2026-08-30T17:00:00Z", home_market_code: "DAL" }
              as: LeagueOps
              captures: { game_dal: $.data.id }
            - call: "POST /games"
              payload: { season_id: "${season_id}", week_index: 4, away_team_code: "BUF", home_team_code: "NYC", kickoff_at: "2026-08-30T20:00:00Z", home_market_code: "NYC" }
              as: LeagueOps
              captures: { game_nyc: $.data.id }
            - call: "POST /week-slates/${slate_id}/finalize"
              payload: { expected_slate_version: "${slate_v0}" }
              as: LeagueOps
              captures: { slate_v1: $.data.version }
            - call: "POST /week-slates/${slate_id}/reopen"
              payload: {}
              as: LeagueOps
              captures: { slate_v2: $.data.version }
          trigger:
            - call: "POST /week-slates/${slate_id}/finalize"
              payload: { expected_slate_version: "${slate_v2}" }
              as: LeagueOps
              captures: { slate_v3: $.data.version, status_final: $.data.slate_status }
          assert:
            - "WeekSlate.${slate_id} completed the loop PRELIMINARY → FINALIZED → PRELIMINARY → FINALIZED without error"
            - "final slate_status == FINALIZED and finalized_game_ids == [${game_dal}, ${game_nyc}] (no selections)"
            - "WeekSlate.version advanced by exactly 1 per transition (v3 = v0 + 3)"

      - name: subscription_parallel_status_and_entitlement_dimensions
        grounds:
          - state_machines.Subscription.ACTIVE_to_ACTIVE
          - entities.Subscription.fields.status
          - entities.Subscription.fields.entitlement_state
        distinguishing_aspect: |
          Subscription carries two independent state dimensions on one row:
          suspending the entitlement (ENABLED → SUSPENDED → ENABLED) leaves
          the lifecycle dimension at ACTIVE and paid_amount_cents untouched,
          while a later cancel drives status ACTIVE → CANCELLED independently —
          the parallel machine, not a linear pipeline, decides verdicts.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (week 4); season 18 weeks; BASE offer 20000."
            - "Account with an ACTIVE paid subscription (price_charged 16667, paid 16667)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rights-grants"
              payload: { distributor_name: "StreamMax", scope: "OUT_OF_MARKET", exclusivity: "EXCLUSIVE", effective_from: "2026-01-01T00:00:00Z", effective_until: "2027-06-01T00:00:00Z", max_commercial_occupancy_cap: 2000 }
              as: PlatformAdmin
              captures: { rg_id: $.data.id }
            - call: "POST /seasons"
              payload: { rights_grant_id: "${rg_id}", label: "2026-Regular", regular_season_weeks: 18, season_start_date: "2026-08-05T00:00:00Z", season_end_date: "2026-12-09T00:00:00Z" }
              as: LeagueOps
              captures: { season_id: $.data.id }
            - call: "POST /offers"
              payload: { season_id: "${season_id}", plan_tier: "BASE", base_price_cents: 20000, includes_multiview: false, includes_companion: false, valid_from: "2026-08-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { offer_id: $.data.id }
            - call: "POST /accounts/register"
              payload: { email: "par@x.com", full_name: "Par Allel", account_kind: "RESIDENTIAL", billing_zip: "10001" }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${acct_id}", offer_id: "${offer_id}" }
              as: Subscriber
              as_user_id: "${acct_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /_payments/simulate"
              payload: { subscription_id: "${sub_id}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
          trigger:
            - call: "POST /subscriptions/${sub_id}/suspend-entitlement"
              payload: {}
              as: PlatformAdmin
              captures: { st_after_suspend: $.data.status, es_after_suspend: $.data.entitlement_state }
            - call: "POST /subscriptions/${sub_id}/restore-entitlement"
              payload: {}
              as: PlatformAdmin
              captures: { st_after_restore: $.data.status, es_after_restore: $.data.entitlement_state, paid_after: $.data.paid_amount_cents }
            - call: "POST /subscriptions/${sub_id}/cancel"
              payload: {}
              as: Subscriber
              as_user_id: "${acct_id}"
