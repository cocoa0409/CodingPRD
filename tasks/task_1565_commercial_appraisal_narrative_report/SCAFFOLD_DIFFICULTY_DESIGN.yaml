  # ===================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: report_create_blocked_by_engagement_hold
        grounds:
          - state_machines.Report.(creation)_to_DRAFTING
          - state_machines.Engagement.IN_PROGRESS_to_LITIGATION_HOLD
        distinguishing_aspect: |
          Pair = Report x Engagement. Report creation is gated on
          engagement.status == IN_PROGRESS; after the engagement enters
          LITIGATION_HOLD, the same valid report-creation request is rejected
          with ERR_INVALID_STATE_TRANSITION, and succeeds again after release.
        test_recipe:
          setup:
            - "Engagement IN_PROGRESS, then placed into LITIGATION_HOLD"
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Apex Bank", client_type: "LENDER" }
              as: EngagementManager
              captures: { cl_id: $.data.id }
            - call: "POST /appraisers"
              payload: { full_name: "Ann Author", designation: "CERTIFIED_GENERAL" }
              as: EngagementManager
              captures: { aa_id: $.data.id }
            - call: "POST /appraisers"
              payload: { full_name: "Rob Reviewer", designation: "CERTIFIED_GENERAL" }
              as: EngagementManager
              captures: { rr_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${cl_id}", author_appraiser_id: "${aa_id}", reviewer_appraiser_id: "${rr_id}", property_address: "100 Main St", property_type: "OFFICE", building_sf: 30000, intended_use: "FINANCING", intended_users: ["Apex Bank"], requested_turnaround_days: 30, planned_approach_count: 1, fee_schedule: "TIERED", is_contingent_fee: false }
              as: EngagementManager
