                rn_page1_first: "$.data[0].full_name"
                rn_page1_second: "$.data[1].full_name"
            - call: GET /obstetric-units/${unit_id}/staff-members
              payload: { staff_role: "RN_LABOR_DELIVERY", limit: 2, offset: 2 }
              as: ChargeNurse
              as_user_id: "charge-nurse-observer"
              captures:
                rn_page2_first: "$.data[0].full_name"
            - call: GET /obstetric-units/${unit_id}/staff-members
              payload: { limit: 10, offset: 0 }
              as: ChargeNurse
              as_user_id: "charge-nurse-observer"
              captures:
                all_first: "$.data[0].full_name"
            - call: GET /obstetric-units/${unit_id}/staff-members
              payload: { limit: 101, offset: 0 }
