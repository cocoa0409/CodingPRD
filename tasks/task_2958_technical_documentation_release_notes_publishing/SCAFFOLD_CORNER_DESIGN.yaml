# =============================================================================
# §1.9 Scaffold Corner Design (Breadth Probe)
# Task 2958 — Technical Documentation & Release Notes Publishing
#
# Taxonomy: the nine sections and per-section claim_type rows of
# references/claim-extraction-guide.md, walked against SCAFFOLD.yaml §1.1–§1.7.
# Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8) are emitted
# as `excluded_because:` stubs naming the covering instance.
#
# Conventions used by every test_recipe below:
#   * The logical clock is parked at 2026-08-01T00:00:00Z by the first call of
#     each chain; every date literal is derived from that instant.
#   * product_key is always "ATLAS" (2-12 chars, uppercase A-Z and digits only).
#   * A "base approved chain" means: release train -> writer -> plan item ->
#     assign -> topic -> revision -> submit-review -> two reviewers -> two
#     sign-offs -> both APPROVED, which leaves the topic FULLY_APPROVED.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # 1. From Table 1 (Entities)
  # ===========================================================================
  - section: entities
    instances:
      - name: release_train_create_returns_every_declared_field
        claim_type: creation
        grounds: ["entities.ReleaseTrain", "endpoints.POST /release-trains", "calculations.release_train_doc_readiness"]
        distinguishing_aspect: "A freshly created train returns 201 with status PLANNED, version 1, approved_topic_ratio 1.00 (the empty-set convention) and doc_readiness_posture OPEN — no field is omitted from the response body."
        test_recipe:
          setup: ["Empty database with the logical clock at 2026-08-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DocsLead
          trigger:
            - call: "POST /release-trains"
              payload: { product_key: "ATLAS", version_label: "12.0", doc_freeze_date: "2026-08-20", ga_date: "2026-09-01", support_end_date: "2027-09-01", localization_budget_cap_cents: 5000000 }
              as: DocsLead
              captures: { rt_id: "$.data.id" }
          assert:
            - "HTTP 201 and the envelope is { meta, response_type: 'object', data: {...} }"
            - "ReleaseTrain.${rt_id}.product_key == ATLAS and version_label == 12.0"
            - "ReleaseTrain.${rt_id}.doc_freeze_date == 2026-08-20, ga_date == 2026-09-01, support_end_date == 2027-09-01"
            - "ReleaseTrain.${rt_id}.localization_budget_cap_cents == 5000000"
            - "ReleaseTrain.${rt_id}.status == PLANNED and version == 1"
            - "ReleaseTrain.${rt_id}.plan_item_count == 0 and approved_plan_item_count == 0"
            - "ReleaseTrain.${rt_id}.approved_topic_ratio == 1.00 and doc_readiness_posture == OPEN"
            - "ReleaseTrain.${rt_id}.localization_committed_cents == 0 and eol_notice_posted == false"
            - "ReleaseTrain.${rt_id}.created_at == 2026-08-01T00:00:00Z"

      - name: writer_retrieval_returns_stored_and_computed_fields
        claim_type: retrieval
        grounds: ["entities.Writer", "endpoints.GET /writers/{id}"]
        distinguishing_aspect: "GET /writers/{id} echoes the stored input fields and the two computed ledger fields at their zero values (committed_load_points 0.00, assignment_count 0) before any assignment exists."
        test_recipe:
          setup: ["One writer, no plan items."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DocsLead
            - call: "POST /writers"
              payload: { person_key: "w-anna", full_name: "Anna Reyes", seniority_tier: "SENIOR", capacity_points: 40.0 }
              as: DocsLead
              captures: { w_id: "$.data.id" }
          trigger:
            - call: "GET /writers/${w_id}"
              payload: {}
              as: DocsLead
          assert:
            - "HTTP 200"
            - "Writer.${w_id}.person_key == w-anna and full_name == Anna Reyes"
            - "Writer.${w_id}.seniority_tier == SENIOR and capacity_points == 40.0"
            - "Writer.${w_id}.status == ACTIVE"
            - "Writer.${w_id}.committed_load_points == 0.00 and assignment_count == 0"
            - "Writer.${w_id}.version == 1"

      - name: plan_item_listing_reports_total_count_and_has_more
        claim_type: listing
        grounds: ["entities.DocPlanItem", "endpoints.GET /plan-items", "response_envelope.pagination_fields"]
        distinguishing_aspect: "Three plan items on one train read back with limit 2 return exactly 2 rows, total_count 3 and has_more true; the same query at offset 2 returns 1 row and has_more false."
        test_recipe:
          setup: ["One release train carrying three DRAFTED plan items."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DocsLead
            - call: "POST /release-trains"
              payload: { product_key: "ATLAS", version_label: "12.0", doc_freeze_date: "2026-08-20", ga_date: "2026-09-01", support_end_date: "2027-09-01", localization_budget_cap_cents: 5000000 }
              as: DocsLead
              captures: { rt_id: "$.data.id" }
            - call: "POST /plan-items"
              payload: { release_train_id: "${rt_id}", feature_key: "feature-a", ia_placement: "NEW_TOPIC", audience_tier: "STANDARD", planned_page_count: 6, complexity_points: 10 }
              as: DocsLead
              captures: { pi_a: "$.data.id" }
            - call: "POST /plan-items"
              payload: { release_train_id: "${rt_id}", feature_key: "feature-b", ia_placement: "EXISTING_TOPIC_UPDATE", audience_tier: "INTERNAL", planned_page_count: 2, complexity_points: 4 }
              as: DocsLead
              captures: { pi_b: "$.data.id" }
            - call: "POST /plan-items"
              payload: { release_train_id: "${rt_id}", feature_key: "feature-c", ia_placement: "CONCEPT_HUB", audience_tier: "CRITICAL", planned_page_count: 4, complexity_points: 25 }
              as: DocsLead
              captures: { pi_c: "$.data.id" }
          trigger:
            - call: "GET /plan-items"
              payload: { release_train_id: "${rt_id}", limit: 2, offset: 0 }
              as: DocsLead
            - call: "GET /plan-items"
              payload: { release_train_id: "${rt_id}", limit: 2, offset: 2 }
              as: DocsLead
          assert:
            - "first read: HTTP 200 with response_type 'array', 2 rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "second read: 1 row, total_count == 3, has_more == false, offset == 2"
            - "the union of the two pages is exactly {${pi_a}, ${pi_b}, ${pi_c}} with no row repeated"
            - "ReleaseTrain.${rt_id}.plan_item_count == 3"

      - name: topic_get_with_unknown_id_not_found
        claim_type: not_found
        grounds: ["errors[ERR_TOPIC_NOT_FOUND]", "validations[priority=6]", "endpoints.GET /topics/{id}"]
        distinguishing_aspect: "A syntactically valid UUID that names no topic yields ERR_TOPIC_NOT_FOUND with HTTP 404, not an empty 200 body."
        test_recipe:
          setup: ["Empty database apart from the clock."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DocsLead
          trigger:
            - call: "GET /topics/3f1c9d4e-0b2a-4c6d-8e7f-1a2b3c4d5e6f"
              payload: {}
              as: DocsLead
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_TOPIC_NOT_FOUND with HTTP 404"
            - "the envelope is { meta, response_type: 'error', data: { error_id, message } }"

      - name: plan_item_create_missing_required_feature_key_rejected
        claim_type: required_fields
        grounds: ["entities.DocPlanItem.feature_key", "validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting the required input field feature_key from POST /plan-items returns ERR_INVALID_REQUEST 400 and creates no row, even though every other required field is present and the FK resolves."
        test_recipe:
          setup: ["One release train."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DocsLead
            - call: "POST /release-trains"
              payload: { product_key: "ATLAS", version_label: "12.0", doc_freeze_date: "2026-08-20", ga_date: "2026-09-01", support_end_date: "2027-09-01", localization_budget_cap_cents: 5000000 }
              as: DocsLead
              captures: { rt_id: "$.data.id" }
          trigger:
            - call: "POST /plan-items"
              payload: { release_train_id: "${rt_id}", ia_placement: "NEW_TOPIC", audience_tier: "STANDARD", planned_page_count: 6, complexity_points: 10 }
              as: DocsLead
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_INVALID_REQUEST with HTTP 400"
            - "GET /plan-items with release_train_id ${rt_id} returns total_count 0"
            - "ReleaseTrain.${rt_id}.plan_item_count == 0"

      - name: writer_status_defaults_to_active_when_omitted
        claim_type: defaults
        grounds: ["entities.Writer.status", "endpoints.POST /writers"]
        distinguishing_aspect: "POST /writers without the optional status input stores ACTIVE, so the writer is immediately assignable; the field is not left null."
        test_recipe:
          setup: ["Empty database apart from the clock."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DocsLead
          trigger:
            - call: "POST /writers"
              payload: { person_key: "w-anna", full_name: "Anna Reyes", seniority_tier: "SENIOR", capacity_points: 40.0 }
              as: DocsLead
              captures: { w_id: "$.data.id" }
          assert:
            - "HTTP 201 and Writer.${w_id}.status == ACTIVE"
            - "GET /writers with status ACTIVE returns total_count 1 including ${w_id}"
            - "GET /writers with status ON_LEAVE returns total_count 0"

      - name: writer_committed_load_points_input_ignored
        claim_type: computed_fields
        grounds: ["entities.Writer.committed_load_points", "entities.Writer.assignment_count", "calculations.writer_committed_load_points"]
        distinguishing_aspect: "committed_load_points and assignment_count are source: computed — sending them in the create payload leaves both at 0.00 / 0 rather than honouring the supplied 99.0 / 5."
        test_recipe:
          setup: ["Empty database apart from the clock."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DocsLead
          trigger:
            - call: "POST /writers"
              payload: { person_key: "w-anna", full_name: "Anna Reyes", seniority_tier: "SENIOR", capacity_points: 40.0, committed_load_points: 99.0, assignment_count: 5 }
              as: DocsLead
              captures: { w_id: "$.data.id" }
          assert:
            - "Writer.${w_id}.committed_load_points == 0.00 (NOT 99.0)"
            - "Writer.${w_id}.assignment_count == 0 (NOT 5)"
            - "Writer.${w_id}.capacity_points == 40.0 — the declared input field IS honoured"

      - name: topic_system_fields_are_server_generated
        claim_type: system_fields
        grounds: ["entities.Topic.current_revision_number", "entities.Topic.review_state", "entities.Topic.publication_state", "entities.Topic.ia_depth"]
        distinguishing_aspect: "A new topic is stamped id / created_at / updated_at / version 1 by the server and starts at current_revision_number 0, ia_depth 0, review_state NOT_SUBMITTED, publication_state UNPUBLISHED with every timestamp field null."
        test_recipe:
          setup: ["A train with one plan item assigned to writer w-anna, who then authors a root topic."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DocsLead
            - call: "POST /release-trains"
              payload: { product_key: "ATLAS", version_label: "12.0", doc_freeze_date: "2026-08-20", ga_date: "2026-09-01", support_end_date: "2027-09-01", localization_budget_cap_cents: 5000000 }
              as: DocsLead
              captures: { rt_id: "$.data.id" }
            - call: "POST /writers"
              payload: { person_key: "w-anna", full_name: "Anna Reyes", seniority_tier: "SENIOR", capacity_points: 40.0 }
              as: DocsLead
              captures: { w_id: "$.data.id" }
            - call: "POST /plan-items"
              payload: { release_train_id: "${rt_id}", feature_key: "feature-a", ia_placement: "NEW_TOPIC", audience_tier: "STANDARD", planned_page_count: 6, complexity_points: 10 }
              as: DocsLead
              captures: { pi_id: "$.data.id" }
            - call: "POST /plan-items/${pi_id}/assign"
              payload: { writer_id: "${w_id}", window_start_date: "2026-08-03", window_end_date: "2026-08-17" }
              as: DocsLead
          trigger:
            - call: "POST /topics"
              payload: { plan_item_id: "${pi_id}", slug: "atlas-feature-a", title: "Feature A guide" }
              as: Writer
              as_user_id: "${w_id}"
              captures: { t_id: "$.data.id" }
          assert:
            - "HTTP 201 with a server-minted Topic.${t_id}.id and version == 1"
            - "Topic.${t_id}.created_at == 2026-08-01T00:00:00Z and updated_at == 2026-08-01T00:00:00Z"
            - "Topic.${t_id}.ia_depth == 0 and parent_topic_id == null"
            - "Topic.${t_id}.current_revision_number == 0 and last_submitted_revision_number == 0"
            - "Topic.${t_id}.review_state == NOT_SUBMITTED and publication_state == UNPUBLISHED"
            - "Topic.${t_id}.submitted_at, approved_at, published_at, published_in_doc_set_version_id, signoff_latency_days and health_score are all null"
            - "DocPlanItem.${pi_id}.status == IN_AUTHORING (first topic under the item)"

      - name: plan_item_create_with_invalid_audience_tier_enum_rejected
        claim_type: type_constraints
        grounds: ["entities.DocPlanItem.audience_tier", "validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "audience_tier accepts only {CRITICAL, STANDARD, INTERNAL}; the value EXECUTIVE is rejected with ERR_INVALID_REQUEST 400 before any load calculation runs."
        test_recipe:
          setup: ["One release train."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DocsLead
            - call: "POST /release-trains"
              payload: { product_key: "ATLAS", version_label: "12.0", doc_freeze_date: "2026-08-20", ga_date: "2026-09-01", support_end_date: "2027-09-01", localization_budget_cap_cents: 5000000 }
              as: DocsLead
              captures: { rt_id: "$.data.id" }
          trigger:
            - call: "POST /plan-items"
              payload: { release_train_id: "${rt_id}", feature_key: "feature-a", ia_placement: "NEW_TOPIC", audience_tier: "EXECUTIVE", planned_page_count: 6, complexity_points: 10 }
              as: DocsLead
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_INVALID_REQUEST with HTTP 400"
            - "ReleaseTrain.${rt_id}.plan_item_count == 0"

      - name: source_revision_is_immutable_with_no_version_field
        claim_type: immutability
        grounds: ["entities.SourceRevision", "endpoints.POST /topics/{id}/revisions", "endpoints.GET /topics/{id}/revisions"]
        distinguishing_aspect: "SourceRevision declares common_fields: false — its create response carries no version and no updated_at, §1.5 exposes no update or delete endpoint for it, and a second revision is a new row (revision_number 2) rather than an edit of the first."
        test_recipe:
          setup: ["A train with one plan item assigned to w-anna and one topic authored by her."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DocsLead
            - call: "POST /release-trains"
              payload: { product_key: "ATLAS", version_label: "12.0", doc_freeze_date: "2026-08-20", ga_date: "2026-09-01", support_end_date: "2027-09-01", localization_budget_cap_cents: 5000000 }
              as: DocsLead
              captures: { rt_id: "$.data.id" }
            - call: "POST /writers"
              payload: { person_key: "w-anna", full_name: "Anna Reyes", seniority_tier: "SENIOR", capacity_points: 40.0 }
              as: DocsLead
              captures: { w_id: "$.data.id" }
            - call: "POST /plan-items"
              payload: { release_train_id: "${rt_id}", feature_key: "feature-a", ia_placement: "NEW_TOPIC", audience_tier: "STANDARD", planned_page_count: 6, complexity_points: 10 }
              as: DocsLead
              captures: { pi_id: "$.data.id" }
            - call: "POST /plan-items/${pi_id}/assign"
              payload: { writer_id: "${w_id}", window_start_date: "2026-08-03", window_end_date: "2026-08-17" }
              as: DocsLead
            - call: "POST /topics"
              payload: { plan_item_id: "${pi_id}", slug: "atlas-feature-a", title: "Feature A guide" }
              as: Writer
              as_user_id: "${w_id}"
              captures: { t_id: "$.data.id" }
          trigger:
            - call: "POST /topics/${t_id}/revisions"
              payload: { body_word_count: 1200, used_terms: ["dashboard"], summary: "First draft of the feature A guide" }
              as: Writer
              as_user_id: "${w_id}"
              captures: { rev1_id: "$.data.id" }
            - call: "POST /topics/${t_id}/revisions"
              payload: { body_word_count: 1350, used_terms: ["dashboard"], summary: "Second draft after a self review" }
              as: Writer
              as_user_id: "${w_id}"
              captures: { rev2_id: "$.data.id" }
            - call: "GET /topics/${t_id}/revisions"
              payload: { limit: 10, offset: 0 }
              as: DocsLead
          assert:
            - "both create responses omit version and updated_at (common_fields: false)"
            - "SourceRevision.${rev1_id}.revision_number == 1 with body_word_count 1200; SourceRevision.${rev2_id}.revision_number == 2 with body_word_count 1350"
            - "${rev1_id} != ${rev2_id} — the second write is a new immutable row, not an edit"
            - "GET /topics/${t_id}/revisions returns total_count 2 and SourceRevision.${rev1_id}.body_word_count is still 1200"
            - "Topic.${t_id}.current_revision_number == 2 and latest_body_word_count == 1350"
            - "§1.5 declares no PUT, PATCH or DELETE for SourceRevision"

      - name: topic_create_with_unknown_plan_item_not_found
        claim_type: parent_relationships
        grounds: ["entities.Topic.plan_item_id", "validations[priority=7]", "errors[ERR_PLAN_ITEM_NOT_FOUND]"]
        distinguishing_aspect: "A body FK that names nothing is rejected with ERR_PLAN_ITEM_NOT_FOUND 404 at priority 7, before the priority-8 assigned-writer check the same call would otherwise fail."
        test_recipe:
          setup: ["One writer exists so the Writer role identity resolves; no plan item with the requested id exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DocsLead
            - call: "POST /writers"
              payload: { person_key: "w-anna", full_name: "Anna Reyes", seniority_tier: "SENIOR", capacity_points: 40.0 }
              as: DocsLead
              captures: { w_id: "$.data.id" }
          trigger:
            - call: "POST /topics"
              payload: { plan_item_id: "3f1c9d4e-0b2a-4c6d-8e7f-1a2b3c4d5e6f", slug: "atlas-orphan-topic", title: "Orphan topic" }
              as: Writer
              as_user_id: "${w_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_PLAN_ITEM_NOT_FOUND with HTTP 404"
            - "the response is NOT ERR_NOT_ASSIGNED_WRITER — existence (priority 7) precedes the assignment check (priority 8)"
            - "GET /topics returns total_count 0"

      - name: topic_parent_under_a_different_plan_item_rejected
        claim_type: graph
        grounds: ["entities.Topic.parent_topic_id", "validations[priority=40]", "errors[ERR_PARENT_TOPIC_MISMATCH]", "complexity_profile.entity_topology"]
        distinguishing_aspect: "The self-referential IA edge is scoped to one plan item: a parent_topic_id resolving to a topic under another plan item of the same train is rejected with ERR_PARENT_TOPIC_MISMATCH 409, even though both topics share a writer and a release train."
        test_recipe:
          setup: ["One train, one writer holding two plan items on non-overlapping windows (26.00 + 6.75 = 32.75 of 40.0 capacity), and one topic under the first item."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DocsLead
            - call: "POST /release-trains"
              payload: { product_key: "ATLAS", version_label: "12.0", doc_freeze_date: "2026-08-20", ga_date: "2026-09-01", support_end_date: "2027-09-01", localization_budget_cap_cents: 5000000 }
              as: DocsLead
              captures: { rt_id: "$.data.id" }
            - call: "POST /writers"
              payload: { person_key: "w-anna", full_name: "Anna Reyes", seniority_tier: "SENIOR", capacity_points: 40.0 }
              as: DocsLead
              captures: { w_id: "$.data.id" }
            - call: "POST /plan-items"
              payload: { release_train_id: "${rt_id}", feature_key: "feature-a", ia_placement: "NEW_TOPIC", audience_tier: "STANDARD", planned_page_count: 6, complexity_points: 10 }
              as: DocsLead
              captures: { pi_a: "$.data.id" }
            - call: "POST /plan-items"
              payload: { release_train_id: "${rt_id}", feature_key: "feature-b", ia_placement: "EXISTING_TOPIC_UPDATE", audience_tier: "INTERNAL", planned_page_count: 2, complexity_points: 4 }
              as: DocsLead
              captures: { pi_b: "$.data.id" }
            - call: "POST /plan-items/${pi_a}/assign"
              payload: { writer_id: "${w_id}", window_start_date: "2026-08-03", window_end_date: "2026-08-17" }
              as: DocsLead
            - call: "POST /plan-items/${pi_b}/assign"
              payload: { writer_id: "${w_id}", window_start_date: "2026-08-20", window_end_date: "2026-09-05" }
              as: DocsLead
            - call: "POST /topics"
              payload: { plan_item_id: "${pi_a}", slug: "atlas-feature-a", title: "Feature A guide" }
              as: Writer
              as_user_id: "${w_id}"
              captures: { t_a: "$.data.id" }
          trigger:
            - call: "POST /topics"
              payload: { plan_item_id: "${pi_b}", slug: "atlas-feature-b", title: "Feature B update", parent_topic_id: "${t_a}" }
              as: Writer
              as_user_id: "${w_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_PARENT_TOPIC_MISMATCH with HTTP 409"
            - "the response is NOT ERR_PARENT_TOPIC_NOT_FOUND — the parent exists, it is simply under ${pi_a}"
            - "GET /topics with plan_item_id ${pi_b} returns total_count 0"
            - "DocPlanItem.${pi_b}.status is still ASSIGNED and Writer.${w_id}.committed_load_points == 32.75"

  # ===========================================================================
  # 2. From Table 2 (State Machines)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: plan_item_initial_state_is_drafted
        claim_type: initial_state
        grounds: ["state_machines.DocPlanItem.initial_state", "entities.DocPlanItem.status"]
        distinguishing_aspect: "A newly created plan item is DRAFTED with assigned_writer_id, window dates and load_points all null and rework_count 0 — assignment data appears only after the assign transition."
        test_recipe:
          setup: ["One release train."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
