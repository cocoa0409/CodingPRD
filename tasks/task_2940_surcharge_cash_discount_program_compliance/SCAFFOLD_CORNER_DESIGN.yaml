              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { refund_id: $.data.id }
          assert:
            - "The first refund attempt returns HTTP 409 with data.error_id == ERR_INVALID_COMPLAINT_STATE"
            - "The ACCEPT_PLAN returns HTTP 200 with data.remediation_state == PLAN_ACCEPTED"
            - "The second, identical refund attempt returns HTTP 201 with data.state == PENDING and data.refund_amount_cents == 219"
