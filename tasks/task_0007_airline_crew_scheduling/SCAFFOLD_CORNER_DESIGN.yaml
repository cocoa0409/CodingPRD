# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Breadth probe: every testable claim §1.1–§1.7 surface declares that
# §1.8 does not already cover.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # entities — required-field validation, defaults, computed/system fields,
  # type constraints, parent/FK existence
  # ===========================================================================
  - section: entities
    instances:
      - name: create_crew_member_missing_employee_code_returns_invalid_request
        claim_type: required_field
        grounds:
          - entities.CrewMember.fields.employee_code
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=17]
        distinguishing_aspect: "Omitting employee_code on POST /crew-members returns 400 ERR_INVALID_REQUEST; record is not persisted."
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z; no crew members exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SchedulingPlanner
              as_user_id: "p1"
          trigger:
            - call: "POST /crew-members"
              payload: { full_name: "X", rank: "CAPTAIN", base_airport: "LAX", seniority_number: 1, line_type: "LINEHOLDER" }
              as: SchedulingPlanner
              as_user_id: "p1"
          assert:
            - "Response HTTP status == 400"
            - "Response data.error_id == 'ERR_INVALID_REQUEST'"

      - name: create_crew_member_invalid_rank_enum_returns_invalid_request
        claim_type: type_constraint
        grounds:
          - entities.CrewMember.fields.rank
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "rank='PILOT' (not in enum {CAPTAIN, FIRST_OFFICER, PURSER, FLIGHT_ATTENDANT}) returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SchedulingPlanner
              as_user_id: "p1"
          trigger:
            - call: "POST /crew-members"
              payload: { employee_code: "AB0001", full_name: "X", rank: "PILOT", base_airport: "LAX", seniority_number: 1, line_type: "LINEHOLDER" }
              as: SchedulingPlanner
              as_user_id: "p1"
          assert:
            - "Response HTTP status == 400"
            - "Response data.error_id == 'ERR_INVALID_REQUEST'"

      - name: create_pairing_invalid_time_window_close_after_start
        claim_type: type_constraint
        grounds:
          - entities.Pairing.fields.bidding_close_utc
          - errors[ERR_INVALID_TIME_WINDOW]
          - validations[priority=11]
        distinguishing_aspect: "bidding_close_utc >= scheduled_start_utc returns 422 ERR_INVALID_TIME_WINDOW."
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SchedulingPlanner
              as_user_id: "p1"
          trigger:
            - call: "POST /pairings"
              payload: { pairing_code: "P-2026-200", origin_base: "LAX", scheduled_start_utc: "2026-06-02T00:00:00Z", scheduled_end_utc: "2026-06-02T10:00:00Z", required_captains: 1, required_first_officers: 0, required_cabin_crew: 0, bidding_close_utc: "2026-06-02T01:00:00Z" }
              as: SchedulingPlanner
              as_user_id: "p1"
          assert:
            - "Response HTTP status == 422"
            - "Response data.error_id == 'ERR_INVALID_TIME_WINDOW'"

      - name: create_crew_member_system_fields_minted_by_server
        claim_type: system_field
        grounds:
          - entities.CrewMember.fields.id
          - entities.CrewMember.fields.created_at
        distinguishing_aspect: "On POST /crew-members success, the response data.id is a server-minted UUID (not echoed from input) and data.created_at is a server-stamped ISO 8601 UTC string; data.version == 1 on first write."
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SchedulingPlanner
              as_user_id: "p1"
          trigger:
            - call: "POST /crew-members"
              payload: { employee_code: "AB0002", full_name: "X", rank: "CAPTAIN", base_airport: "LAX", seniority_number: 2, line_type: "LINEHOLDER" }
              as: SchedulingPlanner
              as_user_id: "p1"
              captures: { cm_id: "$.data.id", cm_v: "$.data.version", cm_created: "$.data.created_at" }
          assert:
            - "Response HTTP status == 201"
            - "${cm_id} matches /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/ (server-minted UUID, no type prefix)"
            - "${cm_v} == 1"
            - "${cm_created} matches /^2026-06-01T00:00:00(\\.\\d{1,3})?Z$/ (server-stamped at clock value)"

      - name: get_crew_member_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "GET /crew-members/{id} with a UUID not in the database returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup:
            - "No crew members in DB"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SchedulingPlanner
              as_user_id: "p1"
          trigger:
            - call: "GET /crew-members/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: SchedulingPlanner
              as_user_id: "p1"
          assert:
            - "Response HTTP status == 404"
            - "Response data.error_id == 'ERR_NOT_FOUND'"

  # ===========================================================================
  # state_machines — invalid transition, terminal lockdown, idempotency
  # ===========================================================================
  - section: state_machines
    instances:
      - name: open_bidding_on_already_bid_open_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Pairing.transitions.DRAFT_to_BID_OPEN
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /pairings/{id}/open-bidding on a Pairing already in BID_OPEN returns 409 ERR_INVALID_STATE; no side effects."
        test_recipe:
          setup:
            - "A Pairing P exists in BID_OPEN with a REVENUE FlightLeg"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SchedulingPlanner
              as_user_id: "p1"
            - call: "POST /pairings"
              payload: { pairing_code: "P-2026-210", origin_base: "LAX", scheduled_start_utc: "2026-06-02T00:00:00Z", scheduled_end_utc: "2026-06-02T10:00:00Z", required_captains: 1, required_first_officers: 0, required_cabin_crew: 0, bidding_close_utc: "2026-06-01T12:00:00Z" }
              as: SchedulingPlanner
              as_user_id: "p1"
              captures: { p_id: "$.data.id" }
            - call: "POST /pairings/${p_id}/flight-legs"
              payload: { leg_sequence: 1, departure_airport: "LAX", arrival_airport: "JFK", scheduled_departure_utc: "2026-06-02T01:00:00Z", scheduled_arrival_utc: "2026-06-02T07:00:00Z", leg_type: "REVENUE" }
              as: SchedulingPlanner
              as_user_id: "p1"
            - call: "POST /pairings/${p_id}/open-bidding"
              payload: {}
              as: SchedulingPlanner
              as_user_id: "p1"
          trigger:
            - call: "POST /pairings/${p_id}/open-bidding"
              payload: {}
              as: SchedulingPlanner
              as_user_id: "p1"
          assert:
            - "Response HTTP status == 409"
            - "Response data.error_id == 'ERR_INVALID_STATE'"

      - name: cancel_pairing_from_completed_terminal_lockdown
        claim_type: terminal_lockdown
        grounds:
          - state_machines.Pairing.terminal_states
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /pairings/{id}/cancel on a Pairing in COMPLETED returns 409 ERR_INVALID_STATE; COMPLETED is terminal."
        test_recipe:
          setup:
            - "Pairing P transitioned through full lifecycle to COMPLETED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SchedulingPlanner
              as_user_id: "p1"
            - call: "POST /crew-members"
              payload: { employee_code: "AB0210", full_name: "C", rank: "CAPTAIN", base_airport: "LAX", seniority_number: 210, line_type: "LINEHOLDER" }
              as: SchedulingPlanner
              as_user_id: "p1"
              captures: { cm_id: "$.data.id" }
            - call: "POST /pairings"
              payload: { pairing_code: "P-2026-220", origin_base: "LAX", scheduled_start_utc: "2026-06-02T00:00:00Z", scheduled_end_utc: "2026-06-02T10:00:00Z", required_captains: 1, required_first_officers: 0, required_cabin_crew: 0, bidding_close_utc: "2026-06-01T12:00:00Z" }
              as: SchedulingPlanner
              as_user_id: "p1"
              captures: { p_id: "$.data.id" }
            - call: "POST /pairings/${p_id}/flight-legs"
              payload: { leg_sequence: 1, departure_airport: "LAX", arrival_airport: "JFK", scheduled_departure_utc: "2026-06-02T01:00:00Z", scheduled_arrival_utc: "2026-06-02T07:00:00Z", leg_type: "REVENUE" }
              as: SchedulingPlanner
              as_user_id: "p1"
            - call: "POST /pairings/${p_id}/open-bidding"
              payload: {}
              as: SchedulingPlanner
              as_user_id: "p1"
            - call: "POST /bids"
              payload: { pairing_id: "${p_id}", crew_member_id: "${cm_id}", requested_seat: "CAPTAIN" }
              as: CrewMember
              as_user_id: "${cm_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:01Z" }
              as: SchedulingPlanner
              as_user_id: "p1"
            - call: "GET /pairings/${p_id}"
              payload: {}
              as: SchedulingPlanner
              as_user_id: "p1"
              captures: { p_v: "$.data.version" }
            - call: "POST /pairings/${p_id}/award"
              payload: { expected_pairing_version: "${p_v}" }
              as: SchedulingPlanner
              as_user_id: "p1"
            - call: "GET /assignments"
              payload: { pairing_id: "${p_id}", crew_member_id: "${cm_id}" }
              as: SchedulingPlanner
              as_user_id: "p1"
              captures: { a_id: "$.data[0].id" }
            - call: "POST /assignments/${a_id}/confirm"
              payload: {}
              as: CrewMember
              as_user_id: "${cm_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T10:00:00Z" }
              as: OperationsController
              as_user_id: "ops-1"
            - call: "POST /pairings/${p_id}/complete"
              payload: {}
              as: OperationsController
              as_user_id: "ops-1"
          trigger:
            - call: "POST /pairings/${p_id}/cancel"
              payload: {}
              as: SchedulingPlanner
              as_user_id: "p1"
          assert:
            - "Response HTTP status == 409"
            - "Response data.error_id == 'ERR_INVALID_STATE'"

      - name: confirm_assignment_twice_idempotency_returns_invalid_state
        claim_type: idempotency
        grounds:
          - state_machines.Assignment.transitions.SCHEDULED_to_CONFIRMED
          - errors[ERR_INVALID_STATE]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_vs_business_safety_on_confirm
          rationale: "Second confirm on already CONFIRMED Assignment returning ERR_INVALID_STATE is exactly the priority-5-wins assertion in the named §1.8 instance."

      - name: trip_trade_reject_from_countersigned_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.TripTrade.transitions
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /trip-trades/{id}/reject is only defined from PROPOSED; from COUNTERSIGNED it returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "TripTrade T in COUNTERSIGNED with both crew members holding CONFIRMED assignments"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SchedulingPlanner
              as_user_id: "p1"
            - call: "POST /crew-members"
              payload: { employee_code: "AB0220", full_name: "A", rank: "CAPTAIN", base_airport: "LAX", seniority_number: 220, line_type: "LINEHOLDER" }
              as: SchedulingPlanner
              as_user_id: "p1"
              captures: { cm_a_id: "$.data.id" }
            - call: "POST /crew-members"
              payload: { employee_code: "AB0221", full_name: "B", rank: "CAPTAIN", base_airport: "LAX", seniority_number: 221, line_type: "LINEHOLDER" }
              as: SchedulingPlanner
              as_user_id: "p1"
              captures: { cm_b_id: "$.data.id" }
            - call: "POST /pairings"
              payload: { pairing_code: "P-2026-230", origin_base: "LAX", scheduled_start_utc: "2026-06-02T00:00:00Z", scheduled_end_utc: "2026-06-02T10:00:00Z", required_captains: 1, required_first_officers: 0, required_cabin_crew: 0, bidding_close_utc: "2026-06-01T12:00:00Z" }
              as: SchedulingPlanner
              as_user_id: "p1"
              captures: { p_a_id: "$.data.id" }
            - call: "POST /pairings/${p_a_id}/flight-legs"
              payload: { leg_sequence: 1, departure_airport: "LAX", arrival_airport: "JFK", scheduled_departure_utc: "2026-06-02T01:00:00Z", scheduled_arrival_utc: "2026-06-02T07:00:00Z", leg_type: "REVENUE" }
              as: SchedulingPlanner
              as_user_id: "p1"
            - call: "POST /pairings"
              payload: { pairing_code: "P-2026-231", origin_base: "LAX", scheduled_start_utc: "2026-06-03T00:00:00Z", scheduled_end_utc: "2026-06-03T10:00:00Z", required_captains: 1, required_first_officers: 0, required_cabin_crew: 0, bidding_close_utc: "2026-06-01T12:00:00Z" }
              as: SchedulingPlanner
              as_user_id: "p1"
              captures: { p_b_id: "$.data.id" }
            - call: "POST /pairings/${p_b_id}/flight-legs"
              payload: { leg_sequence: 1, departure_airport: "LAX", arrival_airport: "MIA", scheduled_departure_utc: "2026-06-03T01:00:00Z", scheduled_arrival_utc: "2026-06-03T07:00:00Z", leg_type: "REVENUE" }
              as: SchedulingPlanner
              as_user_id: "p1"
            - call: "POST /pairings/${p_a_id}/open-bidding"
              payload: {}
              as: SchedulingPlanner
              as_user_id: "p1"
            - call: "POST /pairings/${p_b_id}/open-bidding"
              payload: {}
              as: SchedulingPlanner
              as_user_id: "p1"
            - call: "POST /bids"
              payload: { pairing_id: "${p_a_id}", crew_member_id: "${cm_a_id}", requested_seat: "CAPTAIN" }
              as: CrewMember
              as_user_id: "${cm_a_id}"
            - call: "POST /bids"
              payload: { pairing_id: "${p_b_id}", crew_member_id: "${cm_b_id}", requested_seat: "CAPTAIN" }
              as: CrewMember
              as_user_id: "${cm_b_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:01Z" }
              as: SchedulingPlanner
              as_user_id: "p1"
            - call: "GET /pairings/${p_b_id}"
              payload: {}
              as: SchedulingPlanner
              as_user_id: "p1"
              captures: { p_a_v: "$.data.version" }
            - call: "POST /pairings/${p_a_id}/award"
              payload: { expected_pairing_version: "${p_a_v}" }
              as: SchedulingPlanner
              as_user_id: "p1"
            - call: "GET /pairings/${p_b_id}"
              payload: {}
              as: SchedulingPlanner
              as_user_id: "p1"
              captures: { p_b_v: "$.data.version" }
            - call: "POST /pairings/${p_b_id}/award"
              payload: { expected_pairing_version: "${p_b_v}" }
              as: SchedulingPlanner
              as_user_id: "p1"
            - call: "GET /assignments"
              payload: { pairing_id: "${p_a_id}", crew_member_id: "${cm_a_id}" }
              as: SchedulingPlanner
              as_user_id: "p1"
              captures: { a_a_id: "$.data[0].id" }
            - call: "GET /assignments"
              payload: { pairing_id: "${p_b_id}", crew_member_id: "${cm_b_id}" }
              as: SchedulingPlanner
              as_user_id: "p1"
              captures: { a_b_id: "$.data[0].id" }
            - call: "POST /assignments/${a_a_id}/confirm"
              payload: {}
              as: CrewMember
              as_user_id: "${cm_a_id}"
            - call: "POST /assignments/${a_b_id}/confirm"
              payload: {}
              as: CrewMember
              as_user_id: "${cm_b_id}"
            - call: "POST /trip-trades"
              payload: { initiator_assignment_id: "${a_a_id}", counterparty_assignment_id: "${a_b_id}" }
              as: CrewMember
              as_user_id: "${cm_a_id}"
              captures: { trade_id: "$.data.id" }
            - call: "POST /trip-trades/${trade_id}/countersign"
              payload: {}
              as: CrewMember
              as_user_id: "${cm_b_id}"
          trigger:
            - call: "POST /trip-trades/${trade_id}/reject"
              payload: { reason: "changed mind" }
              as: CrewMember
              as_user_id: "${cm_b_id}"
          assert:
            - "Response HTTP status == 409"
            - "Response data.error_id == 'ERR_INVALID_STATE'"

  # ===========================================================================
  # calculations — boundaries, constants, precision
  # ===========================================================================
  - section: calculations
    instances:
      - name: faa_flight_cap_exact_boundary_passes
        claim_type: boundary_correctness
        grounds:
          - calculations.rolling_duty_window
          - validations[priority=8]
          - errors[ERR_FAA_FLIGHT_CAP_EXCEEDED]
        excluded_because:
          difficulty_instance: boundary_precision_check / faa_duty_cap_at_exact_boundary_passes_on_confirm
          rationale: "Same threshold-boundary class on the rolling_duty_window flight variant; mirrors the duty variant covered in §1.8 dual-variant calc."

      - name: crew_rest_interval_just_below_threshold_fails
        claim_type: boundary_correctness
        grounds:
          - calculations.crew_rest_interval
          - validations[priority=9]
          - errors[ERR_CREW_REST_VIOLATION]
        distinguishing_aspect: "When candidate_pairing.scheduled_start_utc - CrewMember.last_off_duty_utc == MIN_REST_MINUTES - 1 (599 min < 600 min), confirm returns 422 ERR_CREW_REST_VIOLATION."
        test_recipe:
          setup:
            - "CM with last_off_duty_utc=2026-06-02T00:01:00Z after a prior completed pairing"
            - "Candidate Pairing scheduled_start_utc=2026-06-02T10:00:00Z; rest_minutes = 599 < 600"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-25T00:00:00Z" }
              as: SchedulingPlanner
              as_user_id: "p1"
            - call: "POST /crew-members"
              payload: { employee_code: "AB0300", full_name: "C", rank: "CAPTAIN", base_airport: "LAX", seniority_number: 300, line_type: "LINEHOLDER" }
              as: SchedulingPlanner
              as_user_id: "p1"
              captures: { cm_id: "$.data.id" }
            - call: "POST /pairings"
              payload: { pairing_code: "P-2026-300", origin_base: "LAX", scheduled_start_utc: "2026-06-01T23:00:00Z", scheduled_end_utc: "2026-06-02T00:01:00Z", required_captains: 1, required_first_officers: 0, required_cabin_crew: 0, bidding_close_utc: "2026-06-01T12:00:00Z" }
              as: SchedulingPlanner
              as_user_id: "p1"
              captures: { p_prior_id: "$.data.id" }
            - call: "POST /pairings/${p_prior_id}/flight-legs"
              payload: { leg_sequence: 1, departure_airport: "LAX", arrival_airport: "JFK", scheduled_departure_utc: "2026-06-01T23:30:00Z", scheduled_arrival_utc: "2026-06-02T00:01:00Z", leg_type: "REVENUE" }
              as: SchedulingPlanner
              as_user_id: "p1"
            - call: "POST /pairings/${p_prior_id}/open-bidding"
              payload: {}
              as: SchedulingPlanner
              as_user_id: "p1"
            - call: "POST /bids"
              payload: { pairing_id: "${p_prior_id}", crew_member_id: "${cm_id}", requested_seat: "CAPTAIN" }
              as: CrewMember
              as_user_id: "${cm_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:01Z" }
              as: SchedulingPlanner
              as_user_id: "p1"
            - call: "GET /pairings/${p_prior_id}"
              payload: {}
              as: SchedulingPlanner
              as_user_id: "p1"
              captures: { p_prior_v: "$.data.version" }
            - call: "POST /pairings/${p_prior_id}/award"
              payload: { expected_pairing_version: "${p_prior_v}" }
              as: SchedulingPlanner
              as_user_id: "p1"
            - call: "GET /assignments"
              payload: { pairing_id: "${p_prior_id}", crew_member_id: "${cm_id}" }
              as: SchedulingPlanner
              as_user_id: "p1"
              captures: { a_prior_id: "$.data[0].id" }
            - call: "POST /assignments/${a_prior_id}/confirm"
              payload: {}
              as: CrewMember
              as_user_id: "${cm_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T00:01:00Z" }
              as: OperationsController
              as_user_id: "ops-1"
            - call: "POST /pairings/${p_prior_id}/complete"
              payload: {}
              as: OperationsController
              as_user_id: "ops-1"
            - call: "POST /pairings"
              payload: { pairing_code: "P-2026-301", origin_base: "LAX", scheduled_start_utc: "2026-06-02T10:00:00Z", scheduled_end_utc: "2026-06-02T18:00:00Z", required_captains: 1, required_first_officers: 0, required_cabin_crew: 0, bidding_close_utc: "2026-06-02T05:00:00Z" }
              as: SchedulingPlanner
              as_user_id: "p1"
              captures: { p_new_id: "$.data.id" }
            - call: "POST /pairings/${p_new_id}/flight-legs"
              payload: { leg_sequence: 1, departure_airport: "LAX", arrival_airport: "MIA", scheduled_departure_utc: "2026-06-02T11:00:00Z", scheduled_arrival_utc: "2026-06-02T17:00:00Z", leg_type: "REVENUE" }
              as: SchedulingPlanner
