    roles: [FinanceClerk]
    code: 201
    input: [kind, amount]
    output: Payment
    side_effects: ["append Payment", "adjust Booking.amount_paid or amount_refunded", "recompute Booking.balance_due", "advance Booking.payment_status", "increments Booking.version by 1"]

  - method: GET
    path: "/bookings/{id}/payments"
    description: "List a booking's payments (FK reverse-reachability for Payment.booking_id)"
    roles: [FinanceClerk, OperationsManager, PlatformAdmin]
    code: 200
    input: []
    output: Payment[]
    side_effects: []

  - method: POST
    path: "/bookings/{id}/confirm"
