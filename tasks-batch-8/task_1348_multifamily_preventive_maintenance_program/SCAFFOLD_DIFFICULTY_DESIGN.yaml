            - call: "POST /properties/${p_id}/batches/${bat_id}/visits"
              payload: { unit_id: "${u2_id}", template_id: "${t1_id}", asset_id: "${a2_id}", plan_id: "${pl_id}", scheduled_start: "2026-08-10T18:00:00Z", technician_id: "tech-1" }
              as: PropertyManager
              captures: { vb_id: $.data.id, bat_v_after: $.data.version }
          trigger:
            - call: "GET /properties/${p_id}/batches/${bat_id}"
              payload: {}
              as: PropertyManager
              captures: { bat_v_now: $.data.version }
            - call: "POST /properties/${p_id}/batches/${bat_id}/publish"
              payload: { expected_batch_version: "${bat_v_now}" }
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "Visit at exactly window_start 08:00 was accepted at creation (window containment lower bound inclusive)"
            - "Publish rejects with error_id == ERR_VISIT_OUTSIDE_WINDOW because visit B sits at exactly window_end 18:00 (upper bound exclusive)"

  # ===========================================================================
  # Rule 9: Compensating-action invariants over DIFFERENT conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: budget_commit_settle_pair_conserves_committed
        grounds:
          - calculations.budget_burn
          - entities.BudgetLedgerEntry
        distinguishing_aspect: |
          Conserved quantity = plan.committed_cents minus outstanding
          obligations: a visit's VISIT_COMMIT(+est) followed by completion's
          settle pair (-est, +actual) leaves the visit's net committed
          contribution at exactly 0 and its net spent contribution at exactly
          actual_cost — no ledger drift across the commit/settle pair.
        test_recipe:
          setup:
            - "Property rate 6000/h; template est 30 min (est cost 3000); adopted plan budget 1000000; published batch with one visit completed with actual_minutes=40 (actual cost 4000)"
          setup_api_calls:
            - call: "POST /properties"
              payload: { property_code: "CI-P1", display_name: "CI P1", notice_lead_hours: 24, default_labor_rate_cents_per_hour: 6000 }
              as: PropertyManager
              captures: { p_id: $.data.id }
            - call: "POST /properties/${p_id}/buildings"
              payload: { building_label: "A", floors: 1 }
              as: PropertyManager
              captures: { b_id: $.data.id }
            - call: "POST /properties/${p_id}/buildings/${b_id}/units"
              payload: { unit_number: "101", occupancy_status: "VACANT" }
              as: PropertyManager
              captures: { u_id: $.data.id }
            - call: "POST /properties/${p_id}/units/${u_id}/assets"
              payload: { component_type: "HVAC", installed_on: "2024-01-01T00:00:00Z", warranty_months: 24, expected_life_months: 120, replacement_cost_cents: 400000 }
              as: PropertyManager
              captures: { a_id: $.data.id }
            - call: "POST /properties/${p_id}/pm-task-templates"
              payload: { component_type: "HVAC", task_name: "HVAC svc", frequency_days: 90, estimated_labor_minutes: 30, requires_evidence: false, effective_from: "2026-01-01T00:00:00Z" }
              as: PropertyManager
              captures: { t_id: $.data.id }
            - call: "POST /properties/${p_id}/plans"
              payload: { plan_year: 2026, budget_cents: 1000000 }
              as: PropertyManager
              captures: { pl_id: $.data.id }
            - call: "POST /properties/${p_id}/plans/${pl_id}/adopt"
              payload: {}
              as: PropertyManager
            - call: "POST /properties/${p_id}/batches"
              payload: { batch_label: "b1", window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T18:00:00Z" }
              as: PropertyManager
              captures: { bat_id: $.data.id, bat_v: $.data.version }
            - call: "POST /properties/${p_id}/batches/${bat_id}/visits"
              payload: { unit_id: "${u_id}", template_id: "${t_id}", asset_id: "${a_id}", plan_id: "${pl_id}", scheduled_start: "2026-08-02T09:00:00Z", technician_id: "tech-1" }
              as: PropertyManager
              captures: { v_id: $.data.id }
            - call: "POST /properties/${p_id}/batches/${bat_id}/publish"
              payload: { expected_batch_version: "${bat_v} + 1" }
              as: PropertyManager
            - call: "GET /properties/${p_id}/plans/${pl_id}"
              payload: {}
              as: PropertyManager
              captures: { committed_mid: $.data.committed_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T09:00:00Z" }
              as: PropertyManager
            - call: "POST /properties/${p_id}/batches/${bat_id}/visits/${v_id}/start"
              payload: {}
              as: Technician
              as_user_id: "tech-1"
          trigger:
            - call: "POST /properties/${p_id}/batches/${bat_id}/visits/${v_id}/complete"
              payload: { actual_minutes: 40, condition_score_recorded: 4 }
              as: Technician
              as_user_id: "tech-1"
            - call: "GET /properties/${p_id}/plans/${pl_id}"
              payload: {}
              as: PropertyManager
              captures: { committed_end: $.data.committed_cents, spent_end: $.data.spent_cents }
          assert:
            - "After publish: committed_cents == 3000 (30-min estimate at 6000/h)"
            - "After completion: committed_cents == 0 (estimate fully settled)"
            - "After completion: spent_cents == 4000 (40 actual minutes at 6000/h) — conserved: committed drift == 0 across the pair"

      - name: wo_fail_verification_clawback_conserves_spend
        grounds:
          - calculations.budget_burn
          - state_machines.CorrectiveWorkOrder.COMPLETED_to_IN_PROGRESS
        distinguishing_aspect: |
          Conserved quantity = plan.spent_cents (different quantity than
          instance 1's committed_cents): a WO completion settles +actual into
          spent, and the compensating fail-verification releases exactly
          -actual, returning spent_cents to its pre-completion value — a
          clawback pair that conserves total recognized spend.
        test_recipe:
          setup:
