              payload: { fee_program_id: "${prog_id}", code: "PARKS", name: "Neighborhood Parks", demand_unit_label: "resident", existing_los_per_demand_unit: 0.0030, planned_los_per_demand_unit: 0.0040, unit_cost_cents: 45000000 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { cat_parks_id: $.data.id }
          trigger:
            - call: "POST /development-applications/00000000-0000-0000-0000-0000000009ff/credit-claims"
              payload: { facility_category_code: "PARKS", credit_type: "DEVELOPER_IMPROVEMENT", valuation_method: "MARKET", improvement_value_cents: -5 }
              as: Developer
              as_user_id: "dev-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "the call returns 404 with error_id ERR_DEVELOPMENT_APPLICATION_NOT_FOUND"
            - "${err_id} != ERR_INVALID_REQUEST"
            - "no CreditClaim row was created"
            - "the response envelope carries data: null per the 1.0 error shape"

