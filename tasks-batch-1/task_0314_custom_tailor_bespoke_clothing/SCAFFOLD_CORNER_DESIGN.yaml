# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Breadth probe across the claim-extraction-guide taxonomy. Sections/claim_types
# are taken verbatim from references/claim-extraction-guide.md.
# Full recipes for corners NOT covered by §1.8; excluded_because stubs otherwise.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_customer_returns_201_with_system_fields
        claim_type: Creation
        grounds:
          - entities.Customer
          - endpoints
        distinguishing_aspect: "POST /customers with full_name+email -> 201, response has id/created_at/version=1, store_credit_cents=0, remake_risk_band=STANDARD."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { full_name: "Ann Tailor", email: "ann.cr@x.com" }
              as: SalesAssociate
              captures: { c_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Customer.${c_id}.store_credit_cents == 0"
            - "Customer.${c_id}.remake_count == 0"
            - "Customer.${c_id}.completed_order_count == 0"
            - "Customer.${c_id}.remake_risk_band == STANDARD"
            - "Customer.${c_id}.version == 1"

      - name: get_order_nonexistent_returns_order_not_found
        claim_type: Not Found
        grounds:
          - entities.GarmentOrder
          - "errors[ERR_ORDER_NOT_FOUND]"
        distinguishing_aspect: "GET /orders/{random-uuid} -> 404 ERR_ORDER_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_ORDER_NOT_FOUND"

      - name: create_order_missing_required_field_rejected
        claim_type: Required Fields
        grounds:
          - entities.GarmentOrder
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /orders omitting required base_labor_cents -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Customer + profile exist."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Req Field", email: "req.rf@x.com" }
              as: SalesAssociate
              captures: { c_id: $.data.id }
            - call: "POST /measurement-profiles"
              payload: { customer_id: "${c_id}", chest_cm: 100, waist_cm: 84, hip_cm: 100, inseam_cm: 80, source: "MANUAL" }
              as: SalesAssociate
              captures: { mp_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${c_id}", measurement_profile_id: "${mp_id}", garment_type: "SHIRT", fabric_meters_required: 3.0, promised_date: "2026-08-01T00:00:00.000Z" }
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_order_default_is_rush_false_applied
        claim_type: Defaults
        grounds:
          - entities.GarmentOrder.fields.is_rush
        distinguishing_aspect: "Omitting is_rush on POST /orders defaults it to false."
        test_recipe:
          setup: ["Customer + profile exist."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Def Rush", email: "def.dr@x.com" }
              as: SalesAssociate
              captures: { c_id: $.data.id }
            - call: "POST /measurement-profiles"
              payload: { customer_id: "${c_id}", chest_cm: 100, waist_cm: 84, hip_cm: 100, inseam_cm: 80, source: "MANUAL" }
              as: SalesAssociate
              captures: { mp_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${c_id}", measurement_profile_id: "${mp_id}", garment_type: "SHIRT", base_labor_cents: 20000, fabric_meters_required: 3.0, promised_date: "2026-08-01T00:00:00.000Z" }
              as: SalesAssociate
              captures: { o_id: $.data.id }
          assert:
            - "GarmentOrder.${o_id}.is_rush == false"
            - "GarmentOrder.${o_id}.status == DRAFT"

      - name: create_order_system_fields_input_ignored
        claim_type: System Fields
        grounds:
          - entities.GarmentOrder.fields.status
        distinguishing_aspect: "Client-supplied status/quoted_total on POST /orders is ignored; server forces status=DRAFT, quoted_total_cents=0."
        test_recipe:
          setup: ["Customer + profile exist."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Sys Ign", email: "sys.si@x.com" }
              as: SalesAssociate
              captures: { c_id: $.data.id }
            - call: "POST /measurement-profiles"
              payload: { customer_id: "${c_id}", chest_cm: 100, waist_cm: 84, hip_cm: 100, inseam_cm: 80, source: "MANUAL" }
              as: SalesAssociate
              captures: { mp_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${c_id}", measurement_profile_id: "${mp_id}", garment_type: "SHIRT", base_labor_cents: 20000, fabric_meters_required: 3.0, promised_date: "2026-08-01T00:00:00.000Z" }
              as: SalesAssociate
              captures: { o_id: $.data.id }
          assert:
            - "GarmentOrder.${o_id}.status == DRAFT"
            - "GarmentOrder.${o_id}.quoted_total_cents == 0"

      - name: create_profile_invalid_source_enum_rejected
        claim_type: Type Constraints
        grounds:
          - entities.MeasurementProfile.fields.source
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /measurement-profiles with source='LASER' (not in MANUAL|BODY_SCAN) -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Customer exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Enum Bad", email: "enum.eb@x.com" }
              as: SalesAssociate
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /measurement-profiles"
              payload: { customer_id: "${c_id}", chest_cm: 100, waist_cm: 84, hip_cm: 100, inseam_cm: 80, source: "LASER" }
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_order_parent_customer_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.GarmentOrder.fields.customer_id
          - "errors[ERR_CUSTOMER_NOT_FOUND]"
        distinguishing_aspect: "POST /orders with a non-existent customer_id -> 404 ERR_CUSTOMER_NOT_FOUND."
        test_recipe:
          setup: ["A valid profile exists for a real customer, but order cites a fake customer_id."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Real Cust", email: "real.rc@x.com" }
              as: SalesAssociate
              captures: { c_id: $.data.id }
            - call: "POST /measurement-profiles"
              payload: { customer_id: "${c_id}", chest_cm: 100, waist_cm: 84, hip_cm: 100, inseam_cm: 80, source: "MANUAL" }
              as: SalesAssociate
              captures: { mp_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "11111111-1111-4111-8111-111111111111", measurement_profile_id: "${mp_id}", garment_type: "SHIRT", base_labor_cents: 20000, fabric_meters_required: 3.0, promised_date: "2026-08-01T00:00:00.000Z" }
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_CUSTOMER_NOT_FOUND"

      - name: list_customers_pagination_envelope
        claim_type: Listing
        grounds:
          - entities.Customer
          - endpoints
        distinguishing_aspect: "GET /customers returns array envelope with total_count and has_more pagination fields."
        test_recipe:
          setup: ["Two customers created."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Pag One", email: "pag1.pg@x.com" }
              as: SalesAssociate
            - call: "POST /customers"
              payload: { full_name: "Pag Two", email: "pag2.pg@x.com" }
              as: SalesAssociate
          trigger:
            - call: "GET /customers"
              payload: {}
              as: SalesAssociate
          assert:
            - "response.status == 200"
            - "response.response_type == array"
            - "response.meta.total_count >= 2"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: confirm_already_confirmed_order_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.GarmentOrder.DRAFT_to_CONFIRMED
          - "errors[ERR_ORDER_INVALID_STATE]"
        distinguishing_aspect: "Confirming an order already CONFIRMED -> 409 ERR_ORDER_INVALID_STATE; not a valid from-state."
        test_recipe:
          setup: ["CONFIRMED order O with one option line."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Inv Conf", email: "inv.ic@x.com" }
              as: SalesAssociate
              captures: { c_id: $.data.id }
            - call: "POST /measurement-profiles"
              payload: { customer_id: "${c_id}", chest_cm: 100, waist_cm: 84, hip_cm: 100, inseam_cm: 80, source: "MANUAL" }
              as: SalesAssociate
              captures: { mp_id: $.data.id }
            - call: "POST /fabrics"
              payload: { name: "Wool IC", price_per_meter_cents: 8000, bolt_meters_initial: 50 }
              as: ShopManager
              captures: { f_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c_id}", measurement_profile_id: "${mp_id}", garment_type: "SUIT", base_labor_cents: 40000, fabric_meters_required: 7.0, promised_date: "2026-08-01T00:00:00.000Z" }
              as: SalesAssociate
              captures: { o_id: $.data.id }
            - call: "POST /orders/${o_id}/option-lines"
              payload: { fabric_id: "${f_id}", option_code: "MONOGRAM" }
              as: SalesAssociate
            - call: "POST /orders/${o_id}/confirm"
              payload: {}
              as: SalesAssociate
          trigger:
            - call: "POST /orders/${o_id}/confirm"
              payload: {}
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_ORDER_INVALID_STATE"

      - name: cancel_picked_up_order_rejected_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.GarmentOrder.READY_to_PICKED_UP
          - "errors[ERR_ALREADY_PICKED_UP]"
        distinguishing_aspect: "Cancelling a PICKED_UP (terminal) order -> 409 ERR_ALREADY_PICKED_UP; no transitions from terminal."
        test_recipe:
          setup: ["Order O fully completed to PICKED_UP (deposit+balance paid, FINAL passed, pickup recorded)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Term LD", email: "term.tl@x.com" }
              as: SalesAssociate
              captures: { c_id: $.data.id }
            - call: "POST /measurement-profiles"
              payload: { customer_id: "${c_id}", chest_cm: 100, waist_cm: 84, hip_cm: 100, inseam_cm: 80, source: "MANUAL" }
              as: SalesAssociate
              captures: { mp_id: $.data.id }
            - call: "POST /fabrics"
              payload: { name: "Wool TL", price_per_meter_cents: 8000, bolt_meters_initial: 50 }
              as: ShopManager
              captures: { f_id: $.data.id }
            - call: "POST /tailors"
              payload: { display_name: "Master TL", skill_tier: "MASTER" }
              as: ShopManager
              captures: { tm_id: $.data.id }
            - call: "POST /fitting-rooms"
              payload: { room_name: "R TL", cleanup_buffer_minutes: 0 }
              as: ShopManager
              captures: { ro_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c_id}", measurement_profile_id: "${mp_id}", garment_type: "SUIT", base_labor_cents: 40000, fabric_meters_required: 7.0, promised_date: "2026-08-01T00:00:00.000Z" }
              as: SalesAssociate
              captures: { o_id: $.data.id }
            - call: "POST /orders/${o_id}/option-lines"
              payload: { fabric_id: "${f_id}", option_code: "MONOGRAM" }
              as: SalesAssociate
            - call: "POST /orders/${o_id}/option-lines"
              payload: { fabric_id: "${f_id}", option_code: "CONTRAST_LINING" }
              as: SalesAssociate
            - call: "POST /orders/${o_id}/confirm"
              payload: {}
              as: SalesAssociate
              captures: { o_v_conf: $.data.version }
            - call: "POST /orders/${o_id}/payments"
              payload: { kind: "DEPOSIT", amount_cents: 48750 }
              as: SalesAssociate
            - call: "POST /orders/${o_id}/fittings"
              payload: { tailor_id: "${tm_id}", room_id: "${ro_id}", milestone: "BASTED", start_at: "2026-07-12T09:00:00.000Z", end_at: "2026-07-12T10:00:00.000Z", expected_order_version: "${o_v_conf}" }
              as: FittingSpecialist
              captures: { fb: $.data.id, o_v_b: $.data.version }
            - call: "POST /orders/${o_id}/fittings/${fb}/record-outcome"
              payload: { result: "PASS" }
              as: FittingSpecialist
            - call: "POST /orders/${o_id}/fittings"
              payload: { tailor_id: "${tm_id}", room_id: "${ro_id}", milestone: "FORWARD", start_at: "2026-07-13T09:00:00.000Z", end_at: "2026-07-13T10:00:00.000Z", expected_order_version: "${o_v_b}" }
              as: FittingSpecialist
              captures: { ff: $.data.id, o_v_f: $.data.version }
            - call: "POST /orders/${o_id}/fittings/${ff}/record-outcome"
              payload: { result: "PASS" }
              as: FittingSpecialist
            - call: "POST /orders/${o_id}/fittings"
              payload: { tailor_id: "${tm_id}", room_id: "${ro_id}", milestone: "FINAL", start_at: "2026-07-14T09:00:00.000Z", end_at: "2026-07-14T10:00:00.000Z", expected_order_version: "${o_v_f}" }
              as: FittingSpecialist
              captures: { fn: $.data.id }
            - call: "POST /orders/${o_id}/fittings/${fn}/record-outcome"
              payload: { result: "PASS" }
              as: FittingSpecialist
            - call: "POST /orders/${o_id}/payments"
              payload: { kind: "BALANCE", amount_cents: 48750 }
              as: SalesAssociate
            - call: "POST /orders/${o_id}/pickup"
              payload: { released_to_name: "Term LD" }
              as: SalesAssociate
          trigger:
            - call: "POST /orders/${o_id}/cancel"
              payload: {}
              as: ShopManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_ALREADY_PICKED_UP"
            - "GarmentOrder.${o_id}.status == PICKED_UP"

      - name: alteration_complete_on_voided_ticket_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.AlterationTicket.OPEN_to_VOIDED
          - "errors[ERR_ALTERATION_INVALID_STATE]"
        distinguishing_aspect: "Completing an alteration ticket already VOIDED -> 409 ERR_ALTERATION_INVALID_STATE."
        test_recipe:
          setup: ["READY order O with an alteration ticket that was VOIDED."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Alt Inv", email: "alt.ai@x.com" }
              as: SalesAssociate
              captures: { c_id: $.data.id }
            - call: "POST /measurement-profiles"
