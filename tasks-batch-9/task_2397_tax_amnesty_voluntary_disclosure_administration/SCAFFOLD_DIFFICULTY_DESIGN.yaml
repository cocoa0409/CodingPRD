            - "DisclosureReturn.${ret_id}.payable_interest_cents == 50000"
            - "DisclosureReturn.${ret_id}.balance_due_cents == 1050000"
            - "the waiver ledger identity holds again: gross_penalty_cents + gross_interest_cents == 350000 == waived_amount_cents 300000 + payable_penalty_cents 0 + payable_interest_cents 50000"
            - "PaymentPlan.${plan_id}.status == \"ACTIVE\""
