            - "After finalize: true-up creation succeeds, TrueUpRun.${run}.status == \"COMPUTED\""
            - "TrueUpRun.${run}.adjustments == [ { agreement_id: ${agr}, variance_cents: 0 } ] (recognized 43650 == recomputed 43650; 9.70*4500)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: cpt_rate_window_half_open_overlap
        grounds:
          - validations[priority=16]
          - entities.CptRate.fields.effective_from
          - entities.CptRate.fields.effective_to
          - errors[ERR_RATE_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Interval semantics = half-open [from, to) on the CptRate resource: an interior-overlapping
          window for the same (plan, cpt_code) is rejected, while a perfectly adjacent window
          (prior.effective_to == next.effective_from) is accepted. Companion instance uses aggregate
          capacity semantics on SupervisionAssignment instead of pure geometry.
        test_recipe:
          setup:
            - "Plan in DRAFT with one rate row 99213 [2026-01-01, 2027-01-01)"
          setup_api_calls:
            - { call: "POST /comp/_clock/set_current_utc", payload: { to_iso8601: "2026-01-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /comp/comp-plans", payload: { name: "Win Plan", fiscal_year_start: "2026-01-01", fiscal_year_end: "2026-12-31", credit_attribution_mode: SERVICE_DATE, quality_model: ALL_OR_NOTHING, quality_pool_cents: 100000, fmv_cap_cents: 90000000, tiers: [ { tier_code: T1, threshold_wrvu: 0, conversion_factor_cents: 4500, tier_bonus_cents: 0 } ] }, as: CompAnalyst, as_user_id: an_1, captures: { plan: $.data.id } }
            - { call: "POST /comp/comp-plans/${plan}/cpt-rates", payload: { cpt_code: "99213", wrvu_value: 0.97, effective_from: "2026-01-01", effective_to: "2027-01-01" }, as: CompAnalyst, as_user_id: an_1, captures: { rate1: $.data.id } }
          trigger:
            - { call: "POST /comp/comp-plans/${plan}/cpt-rates", payload: { cpt_code: "99213", wrvu_value: 1.05, effective_from: "2026-06-01", effective_to: "2027-06-01" }, as: CompAnalyst, as_user_id: an_1, captures: { err: $.data.error_id } }
            - { call: "POST /comp/comp-plans/${plan}/cpt-rates", payload: { cpt_code: "99213", wrvu_value: 1.05, effective_from: "2027-01-01", effective_to: "2028-01-01" }, as: CompAnalyst, as_user_id: an_1, captures: { rate2: $.data.id } }
            - { call: "POST /comp/comp-plans/${plan}/cpt-rates", payload: { cpt_code: "99215", wrvu_value: 1.50, effective_from: "2026-06-01", effective_to: "2027-06-01" }, as: CompAnalyst, as_user_id: an_1, captures: { rate3: $.data.id } }
          assert:
            - "Overlapping same-code window: 422 ERR_RATE_WINDOW_OVERLAP ([2026-06-01,2027-06-01) intersects [2026-01-01,2027-01-01))"
            - "Adjacent window [2027-01-01, 2028-01-01) succeeds: 201 (half-open: effective_to of the existing row == effective_from of the new row is NOT overlap)"
            - "Different cpt_code overlapping in time succeeds: 201 (overlap rule is scoped to (plan, cpt_code))"
            - "GET /comp/comp-plans/${plan}/cpt-rates?cpt_code=99213 returns exactly 2 rows (the original and the adjacent one)"

      - name: supervision_aggregate_capacity_overlap
        grounds:
          - validations[priority=20]
          - entities.SupervisionAssignment.fields.supervised_fte
          - errors[ERR_SUPERVISION_WINDOW_INVALID]
        distinguishing_aspect: |
          Interval semantics = aggregate capacity over overlapping closed windows (different
          geometry than the half-open rate windows): pairwise windows may overlap freely as long
          as the supervisor's summed supervised_fte never exceeds 4.0 on any day — 2.0 + 2.0
          overlapping is accepted, a further 0.5 overlapping both is rejected even though it
          overlaps each existing window only partially.
