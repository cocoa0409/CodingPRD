            - "Episode.${ep_x}.status is still ESCALATED and Episode.${ep_x}.returned_at is null"
            - "InpatientUnit.${unit_x}.held_bed_count == 0 and InpatientUnit.${unit_x}.available_bed_count == 2"

  # =========================================================================
  # RULE 8 — resource temporal-overlap conflicts, different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: staff_visit_turnaround_buffer_is_inclusive_at_exactly_15_minutes
        grounds:
          - "validations[priority=22]"
          - entities.Visit.fields.staff_user_id
          - entities.Visit.fields.scheduled_start_at
          - "errors[ERR_VISIT_OVERLAP]"
        distinguishing_aspect: |
          Interval semantics A — pairwise half-open [start, end) intervals on a single clinician
          resource (Visit.staff_user_id) with the existing interval's trailing edge padded by a
          15-minute turnaround buffer: a start 14 minutes after the prior end collides, a start
          exactly 15 minutes after it does not.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T08:00:00Z."
            - "One ACTIVE CMS_WAIVER episode."
            - "Staff rn-1 already owns a SCHEDULED visit occupying 2026-06-01T09:00:00Z to 2026-06-01T09:45:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /patients"
              payload: { mrn: "MRN-O1", full_name: "Owen Overlap", home_distance_km: 9.0, primary_diagnosis_code: "CAP_PNEUMONIA", diet_restriction: "NONE", broadband_verified: true, caregiver_present: true }
              as: AdmittingPhysician
              captures: { pat_o: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_o}", origin: "ED", qualifying_condition_code: "CAP_PNEUMONIA", acuity: "STANDARD", referring_physician_user_id: "phys-1" }
              as: AdmittingPhysician
              captures: { ref_o: $.data.id }
            - call: "POST /eligibility-assessments"
              payload: { referral_id: "${ref_o}", in_person_eval_at: "2026-06-01T06:00:00Z", home_safety_outcome: "PASS", broadband_check: "PASS", caregiver_present_confirmed: true, consent_signed: true, assessor_user_id: "phys-1" }
              as: AdmittingPhysician
            - call: "POST /referrals/${ref_o}/mark-eligible"
              payload: {}
              as: AdmittingPhysician
            - call: "POST /episodes"
              payload: { patient_id: "${pat_o}", referral_id: "${ref_o}", program_track: "CMS_WAIVER" }
              as: AdmittingPhysician
              captures: { ep_o: $.data.id }
            - call: "POST /visits"
              payload: { episode_id: "${ep_o}", visit_type: "RN_IN_PERSON", staff_user_id: "rn-1", service_date: "2026-06-01", scheduled_start_at: "2026-06-01T09:00:00Z", scheduled_end_at: "2026-06-01T09:45:00Z", distance_km: 9.0 }
              as: FieldNurse
              captures: { v_o1: $.data.id }
          trigger:
            - call: "POST /visits"
              payload: { episode_id: "${ep_o}", visit_type: "RN_IN_PERSON", staff_user_id: "rn-1", service_date: "2026-06-01", scheduled_start_at: "2026-06-01T09:59:00Z", scheduled_end_at: "2026-06-01T10:44:00Z", distance_km: 9.0 }
              as: FieldNurse
              captures: { err_overlap: $.data.error_id }
            - call: "POST /visits"
              payload: { episode_id: "${ep_o}", visit_type: "RN_IN_PERSON", staff_user_id: "rn-1", service_date: "2026-06-01", scheduled_start_at: "2026-06-01T10:00:00Z", scheduled_end_at: "2026-06-01T10:45:00Z", distance_km: 9.0 }
              as: FieldNurse
              captures: { v_o2: $.data.id }
          assert:
            - "the 09:59 request returns error_id ERR_VISIT_OVERLAP with HTTP 409 (only 14 minutes after the 09:45 end)"
            - "the 10:00 request succeeds with HTTP 201 and Visit.${v_o2}.scheduling_status == SCHEDULED"
            - "Visit.${v_o2}.scheduled_start_at == 2026-06-01T10:00:00.000Z"
            - "GET /episodes/${ep_o}/visits returns exactly 2 visits (total_count == 2)"

      - name: inpatient_bed_capacity_is_aggregate_and_released_by_hold_expiry
        grounds:
          - "validations[priority=24]"
          - state_machines.BedReservation.HELD_to_EXPIRED
          - entities.InpatientUnit.fields.available_bed_count
          - conservation_invariants.bed-census
          - "errors[ERR_NO_BEDS_AVAILABLE]"
        distinguishing_aspect: |
          Interval semantics B — aggregate capacity over a fixed-length [held_at, hold_expires_at]
          hold window on a different resource entity (InpatientUnit, capacity total_beds = 1),
          where occupancy is released by lazy expiry rather than by any pairwise adjacency or
          buffer rule: the second reservation is rejected while the first hold is live and
          succeeds one minute after that hold expires.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-02T09:32:00Z."
            - "Two ACTIVE CMS_WAIVER episodes P and Q."
            - "A single-bed InpatientUnit with one HELD BedReservation for episode P, held at 2026-06-02T09:32:00Z and expiring at 2026-06-02T11:32:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T09:32:00Z" }
              as: ProgramAdmin
            - call: "POST /patients"
              payload: { mrn: "MRN-P2", full_name: "Pam Peak", home_distance_km: 5.0, primary_diagnosis_code: "CHF_EXAC", diet_restriction: "NONE", broadband_verified: true, caregiver_present: true }
              as: AdmittingPhysician
              captures: { pat_p2: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-Q2", full_name: "Quinn Queue", home_distance_km: 5.0, primary_diagnosis_code: "CHF_EXAC", diet_restriction: "NONE", broadband_verified: true, caregiver_present: true }
              as: AdmittingPhysician
              captures: { pat_q2: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_p2}", origin: "ED", qualifying_condition_code: "CHF_EXAC", acuity: "STANDARD", referring_physician_user_id: "phys-1" }
              as: AdmittingPhysician
              captures: { ref_p2: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_q2}", origin: "ED", qualifying_condition_code: "CHF_EXAC", acuity: "STANDARD", referring_physician_user_id: "phys-1" }
              as: AdmittingPhysician
              captures: { ref_q2: $.data.id }
            - call: "POST /eligibility-assessments"
              payload: { referral_id: "${ref_p2}", in_person_eval_at: "2026-06-02T08:00:00Z", home_safety_outcome: "PASS", broadband_check: "PASS", caregiver_present_confirmed: true, consent_signed: true, assessor_user_id: "phys-1" }
              as: AdmittingPhysician
            - call: "POST /eligibility-assessments"
              payload: { referral_id: "${ref_q2}", in_person_eval_at: "2026-06-02T08:00:00Z", home_safety_outcome: "PASS", broadband_check: "PASS", caregiver_present_confirmed: true, consent_signed: true, assessor_user_id: "phys-1" }
              as: AdmittingPhysician
            - call: "POST /referrals/${ref_p2}/mark-eligible"
              payload: {}
              as: AdmittingPhysician
            - call: "POST /referrals/${ref_q2}/mark-eligible"
              payload: {}
              as: AdmittingPhysician
            - call: "POST /episodes"
              payload: { patient_id: "${pat_p2}", referral_id: "${ref_p2}", program_track: "CMS_WAIVER" }
              as: AdmittingPhysician
              captures: { ep_p2: $.data.id }
            - call: "POST /episodes"
              payload: { patient_id: "${pat_q2}", referral_id: "${ref_q2}", program_track: "CMS_WAIVER" }
              as: AdmittingPhysician
              captures: { ep_q2: $.data.id }
            - call: "POST /inpatient-units"
              payload: { unit_code: "UNIT-ONE", total_beds: 1 }
              as: ProgramAdmin
              captures: { unit_1: $.data.id, unit_1_v0: $.data.version }
            - call: "POST /bed-reservations"
              payload: { unit_id: "${unit_1}", episode_id: "${ep_p2}", expected_unit_version: "${unit_1_v0}" }
              as: AdmittingPhysician
              captures: { bed_p2: $.data.id }
            - call: "GET /inpatient-units/${unit_1}"
              payload: {}
              as: ProgramAdmin
              captures: { unit_1_v1: $.data.version }
          trigger:
            - call: "POST /bed-reservations"
              payload: { unit_id: "${unit_1}", episode_id: "${ep_q2}", expected_unit_version: "${unit_1_v1}" }
              as: AdmittingPhysician
              captures: { err_beds: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T11:33:00Z" }
              as: ProgramAdmin
            - call: "GET /inpatient-units/${unit_1}"
              payload: {}
              as: ProgramAdmin
              captures: { unit_1_v2: $.data.version }
            - call: "POST /bed-reservations"
              payload: { unit_id: "${unit_1}", episode_id: "${ep_q2}", expected_unit_version: "${unit_1_v2}" }
              as: AdmittingPhysician
              captures: { bed_q2: $.data.id }
          assert:
            - "while the first hold is live InpatientUnit.${unit_1}.held_bed_count == 1, occupied_bed_count == 0, available_bed_count == 0"
            - "the first reservation attempt for episode ${ep_q2} returns error_id ERR_NO_BEDS_AVAILABLE with HTTP 409"
            - "BedReservation.${bed_p2}.hold_expires_at == 2026-06-02T11:32:00.000Z"
            - "after the clock reaches 2026-06-02T11:33:00Z the read of the unit lazily expires the hold: BedReservation.${bed_p2}.status == EXPIRED"
            - "the retried reservation succeeds with HTTP 201 and BedReservation.${bed_q2}.status == HELD"
            - "the bed-census conservation invariant holds throughout: InpatientUnit.${unit_1}.total_beds (1) == available_bed_count + held_bed_count + occupied_bed_count at every observation"

  # =========================================================================
  # RULE 9 — compensating-action invariants over different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: episode_day_ledger_conserved_across_finalize_then_amendment_reopen
        grounds:
          - conservation_invariants.episode-day-ledger
          - calculations.episode_day_ledger
          - state_machines.DailyComplianceRecord.COMPLIANT_to_PENDING
          - state_machines.Visit.ATTESTED_to_AMENDED
        distinguishing_aspect: |
          Conserved quantity 1 — the Episode day ledger. Finalizing two service days and then
          compensating one of them with a visit amendment moves a unit from billable_day_count to
          pending_day_count without changing service_day_count, so
          service_day_count == billable_day_count + carved_out_day_count + pending_day_count holds
          both before (2 == 2 + 0 + 0) and after (2 == 1 + 0 + 1).
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T08:00:00Z, later advanced to 2026-06-02T08:00:00Z."
            - "One ACTIVE FEE_FOR_SERVICE episode with one COMPLETED and ATTESTED RN_IN_PERSON visit on 2026-06-01 and another on 2026-06-02."
            - "Both compliance days are finalized to COMPLIANT, giving service_day_count 2 and billable_day_count 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /patients"
              payload: { mrn: "MRN-L1", full_name: "Lea Ledger", home_distance_km: 3.0, primary_diagnosis_code: "UTI_COMPLICATED", diet_restriction: "NONE", broadband_verified: true, caregiver_present: true }
              as: AdmittingPhysician
              captures: { pat_l: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_l}", origin: "ED", qualifying_condition_code: "UTI_COMPLICATED", acuity: "STANDARD", referring_physician_user_id: "phys-1" }
              as: AdmittingPhysician
              captures: { ref_l: $.data.id }
            - call: "POST /eligibility-assessments"
              payload: { referral_id: "${ref_l}", in_person_eval_at: "2026-06-01T06:00:00Z", home_safety_outcome: "PASS", broadband_check: "PASS", caregiver_present_confirmed: true, consent_signed: true, assessor_user_id: "phys-1" }
              as: AdmittingPhysician
            - call: "POST /referrals/${ref_l}/mark-eligible"
              payload: {}
              as: AdmittingPhysician
            - call: "POST /episodes"
              payload: { patient_id: "${pat_l}", referral_id: "${ref_l}", program_track: "FEE_FOR_SERVICE" }
              as: AdmittingPhysician
              captures: { ep_l: $.data.id }
            - call: "POST /visits"
              payload: { episode_id: "${ep_l}", visit_type: "RN_IN_PERSON", staff_user_id: "rn-1", service_date: "2026-06-01", scheduled_start_at: "2026-06-01T09:00:00Z", scheduled_end_at: "2026-06-01T09:45:00Z", distance_km: 3.0 }
              as: FieldNurse
              captures: { v_l1: $.data.id }
            - call: "POST /visits/${v_l1}/depart"
              payload: {}
              as: FieldNurse
            - call: "POST /visits/${v_l1}/complete"
              payload: {}
              as: FieldNurse
            - call: "POST /visits/${v_l1}/attest"
              payload: {}
              as: FieldNurse
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /visits"
              payload: { episode_id: "${ep_l}", visit_type: "RN_IN_PERSON", staff_user_id: "rn-1", service_date: "2026-06-02", scheduled_start_at: "2026-06-02T09:00:00Z", scheduled_end_at: "2026-06-02T09:45:00Z", distance_km: 3.0 }
              as: FieldNurse
              captures: { v_l2: $.data.id }
            - call: "POST /visits/${v_l2}/depart"
              payload: {}
              as: FieldNurse
            - call: "POST /visits/${v_l2}/complete"
              payload: {}
              as: FieldNurse
            - call: "POST /visits/${v_l2}/attest"
              payload: {}
              as: FieldNurse
            - call: "GET /episodes/${ep_l}/compliance-days"
              payload: { service_date: "2026-06-01" }
              as: ProgramAdmin
              captures: { cd_l1: "$.data[0].id" }
            - call: "GET /episodes/${ep_l}/compliance-days"
              payload: { service_date: "2026-06-02" }
              as: ProgramAdmin
              captures: { cd_l2: "$.data[0].id" }
            - call: "POST /compliance-days/${cd_l1}/finalize"
              payload: {}
              as: ProgramAdmin
            - call: "POST /compliance-days/${cd_l2}/finalize"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /visits/${v_l1}/attest"
              payload: {}
              as: FieldNurse
          assert:
            - "before the trigger Episode.${ep_l}.service_day_count == 2, billable_day_count == 2, carved_out_day_count == 0, pending_day_count == 0"
            - "after the trigger Visit.${v_l1}.attestation_status == AMENDED and DailyComplianceRecord.${cd_l1}.status == PENDING"
            - "after the trigger Episode.${ep_l}.service_day_count == 2, billable_day_count == 1, carved_out_day_count == 0, pending_day_count == 1"
            - "the episode-day-ledger invariant holds after the compensating reopen: 2 == 1 + 0 + 1"
            - "DailyComplianceRecord.${cd_l2}.status is still COMPLIANT"

      - name: device_kit_census_conserved_across_deploy_refurbish_return_cycle
        grounds:
          - conservation_invariants.kit-census
          - calculations.device_kit_census
          - state_machines.DeviceKit.AVAILABLE_to_DEPLOYED
          - state_machines.DeviceKit.DEPLOYED_to_IN_REFURB
          - state_machines.DeviceKit.IN_REFURB_to_AVAILABLE
        distinguishing_aspect: |
          Conserved quantity 2 — the program-wide DeviceKit inventory census, a different kind of
          conserved quantity from the Episode day ledger. Deploying a kit, releasing it into
          refurbishment and reconciling its last component moves one unit between the four buckets
          while total_kits stays 3 and
          total_kits == available_count + deployed_count + in_refurb_count + retired_count holds
          at every observation.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T08:00:00Z."
            - "Three DeviceKits exist; the first carries exactly one component."
            - "One ACTIVE CMS_WAIVER episode has that first kit DEPLOYED, then begin-discharge releases it into IN_REFURB and leaves its single component PENDING_RECONCILIATION."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /patients"
              payload: { mrn: "MRN-V1", full_name: "Vic Vault", home_distance_km: 3.0, primary_diagnosis_code: "COPD_EXAC", diet_restriction: "NONE", broadband_verified: true, caregiver_present: true }
              as: AdmittingPhysician
              captures: { pat_v: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_v}", origin: "ED", qualifying_condition_code: "COPD_EXAC", acuity: "STANDARD", referring_physician_user_id: "phys-1" }
              as: AdmittingPhysician
              captures: { ref_v: $.data.id }
            - call: "POST /eligibility-assessments"
              payload: { referral_id: "${ref_v}", in_person_eval_at: "2026-06-01T06:00:00Z", home_safety_outcome: "PASS", broadband_check: "PASS", caregiver_present_confirmed: true, consent_signed: true, assessor_user_id: "phys-1" }
              as: AdmittingPhysician
            - call: "POST /referrals/${ref_v}/mark-eligible"
              payload: {}
              as: AdmittingPhysician
            - call: "POST /episodes"
              payload: { patient_id: "${pat_v}", referral_id: "${ref_v}", program_track: "CMS_WAIVER" }
              as: AdmittingPhysician
              captures: { ep_v: $.data.id }
            - call: "POST /device-kits"
              payload: { asset_tag: "KIT-V1" }
              as: ProgramAdmin
              captures: { kit_v1: $.data.id, kit_v1_v0: $.data.version }
            - call: "POST /device-kits"
              payload: { asset_tag: "KIT-V2" }
              as: ProgramAdmin
              captures: { kit_v2: $.data.id }
            - call: "POST /device-kits"
              payload: { asset_tag: "KIT-V3" }
              as: ProgramAdmin
              captures: { kit_v3: $.data.id }
            - call: "POST /device-kits/${kit_v1}/components"
              payload: { component_type: "GATEWAY", serial_number: "SN-V1", replacement_cost_usd: 210.00 }
              as: ProgramAdmin
              captures: { comp_v: $.data.id }
            - call: "POST /device-kits/${kit_v1}/deploy"
              payload: { episode_id: "${ep_v}", expected_kit_version: "${kit_v1_v0}" }
              as: FieldNurse
            - call: "POST /episodes/${ep_v}/begin-discharge"
              payload: {}
              as: AdmittingPhysician
          trigger:
            - call: "GET /device-kit-census"
              payload: {}
              as: ProgramAdmin
            - call: "POST /device-components/${comp_v}/reconcile"
              payload: { outcome: "RETURNED" }
              as: FieldNurse
            - call: "GET /device-kit-census"
              payload: {}
              as: ProgramAdmin
          assert:
            - "the first census returns total_kits == 3, available_count == 2, deployed_count == 0, in_refurb_count == 1, retired_count == 0 and satisfies 3 == 2 + 0 + 1 + 0"
            - "DeviceComponent.${comp_v}.reconciliation_status is PENDING_RECONCILIATION before the reconcile call"
            - "after the reconcile call DeviceKit.${kit_v1}.status == AVAILABLE and DeviceKit.${kit_v1}.refurb_cycle_count == 1"
            - "the second census returns total_kits == 3, available_count == 3, deployed_count == 0, in_refurb_count == 0, retired_count == 0 and satisfies 3 == 3 + 0 + 0 + 0"
            - "DeviceKit.${kit_v1}.assigned_episode_id is null and DeviceKit.${kit_v1}.unreconciled_component_count == 0"
