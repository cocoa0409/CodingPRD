            - { call: "POST /tea-ops/leaf-lots/${lot}/grade-assessments", payload: { aroma_score: 90, briskness_score: 88, appearance_score: 92 }, as: SensoryGrader, as_user_id: "gr-1" }
            - { call: "POST /tea-ops/leaf-lots/${lot}/residue-tests", payload: { lab_name: "LabA", measured_residue_ppm: 0.30, test_method: "GCMS" }, as: QALabAnalyst, as_user_id: "an-1" }
            - { call: "POST /tea-ops/recipes", payload: { name: "R13", certification_target: "CONVENTIONAL", pack_format: "TEA_BAG", components: [{ leaf_type: "BLACK", min_grade: "B", pct: 100.0 }] }, as: BlendMaster, as_user_id: "bm-1", captures: { r13: $.data.id } }
            - { call: "POST /tea-ops/recipes/${r13}/activate", payload: {}, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches", payload: { recipe_id: "${r13}", target_weight_kg: 10.0 }, as: BlendMaster, as_user_id: "bm-1", captures: { b: $.data.id } }
            - { call: "POST /tea-ops/batches/${b}/lock-recipe", payload: {}, as: BlendMaster, as_user_id: "bm-1", captures: { bv: $.data.version } }
          trigger:
            - { call: "POST /tea-ops/batches/${b}/allocations", payload: { lot_id: "${lot}", allocated_kg: 10.0, expected_batch_version: "${bv}" }, as: BlendMaster, as_user_id: "bm-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_LOT_NOT_RELEASED"
            - "lot remains allocated to nothing: GET /tea-ops/batches/${b}/allocations total_count == 0"

  # ------------------------------------------------------------- Rule 8 ----
  - rule_id: resource_temporal_overlap
    instances:
      - name: line_window_half_open_adjacency
        grounds:
          - state_machines.ProductionRun
          - validations[priority=9]
          - errors[ERR_LINE_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Resource = PackagingLine, interval semantics = half-open [start,
          end): a run starting exactly when the previous one ends (10:00 ==
          10:00) is ACCEPTED, while a truly overlapping window is rejected
          with ERR_LINE_WINDOW_CONFLICT.
        test_recipe:
          setup:
            - "RELEASED unflavored CONVENTIONAL LOOSE_PACK batch (allergen-free, so no changeover buffer engages); LOOSE_PACK line"
          setup_api_calls:
