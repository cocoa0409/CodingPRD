          - state_machines.UnderwritingCase.NEGOTIATING_to_QUOTED
        distinguishing_aspect: |
          Conserved quantity = quote-case state pairing plus quoted rate: the forward action
          (broker counter) and its compensating action (underwriter respond) must leave
          Quote.pepm_rate_cents (5338), Quote.annual_premium_cents (25622400), and the
