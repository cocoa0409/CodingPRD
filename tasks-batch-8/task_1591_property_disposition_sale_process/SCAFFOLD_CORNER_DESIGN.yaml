        grounds: ["roles[InvestmentCommittee]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "analyses.decide is exclusive to InvestmentCommittee; AssetAnalyst (the author role) calling it gets 403 ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup: ["Gamma asset; analysis SUBMITTED"]
          setup_api_calls:
            - { call: "POST /disposition/assets", payload: { name: "Gamma", market: "Denver", asset_type: MULTIFAMILY, noi_cents: 100000000, noi_growth_bps: 200, book_value_cents: 1500000000, guidance_price_cents: 2000000000, loan_balance_cents: 0, loan_rate_bps: 0, loan_maturity_date: null, monthly_debt_service_cents: 0, remaining_term_months: 0, prepayment_type: NONE, defeasance_allowed: false }, as: DispositionManager, captures: { g_id: $.data.id, g_v: $.data.version } }
