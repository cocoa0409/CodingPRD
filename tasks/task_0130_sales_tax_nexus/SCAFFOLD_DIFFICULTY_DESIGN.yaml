            - call: "POST /transactions"
              payload: { seller_id: "${s_id}", jurisdiction_id: "${ny_id}", customer_ref: "b1", customer_exempt_requested: false }
              as: Seller
              as_user_id: "${s_id}"
              captures: { t1_id: $.data.id }
            - call: "POST /line-items"
              payload: { transaction_id: "${t1_id}", category_code: "TANGIBLE", quantity: 1, unit_price: 10.00 }
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /transactions/${t1_id}/settle"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /transactions"
              payload: { seller_id: "${s_id}", jurisdiction_id: "${ny_id}", customer_ref: "b2", customer_exempt_requested: false }
              as: Seller
              as_user_id: "${s_id}"
              captures: { t2_id: $.data.id }
            - call: "POST /line-items"
              payload: { transaction_id: "${t2_id}", category_code: "TANGIBLE", quantity: 1, unit_price: 10.00 }
