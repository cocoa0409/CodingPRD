  - method: POST
    path: "/stairlift-ops/quotes/{id}/revise"
    description: "Return ISSUED Quote to DRAFT for revision (cyclic)"
    roles: [SalesRep]
    code: 200
    input: []
    output: Quote
    side_effects: ["revision_number += 1", "issued_total_cents := 0"]

  - method: POST
    path: "/stairlift-ops/quotes/{id}/accept"
    description: "Customer accepts a Quote -> creates Agreement, reserves EquipmentUnit"
    roles: [Customer, PlatformAdmin]
    code: 201
    input: [equipment_unit_id, expected_customer_version, "committed_rental_months?", "liability_waiver_signed?"]
    output: Agreement
    side_effects: ["OCC on Customer.version (increments Customer.version by 1)", "Quote.status := ACCEPTED", "EquipmentUnit.status := RESERVED", "Agreement created in PENDING_FUNDING with liability_waiver_signed from payload (default false)", "Customer.lifetime_outstanding_cents recomputed"]

  # --- FundingApplication ---
  - method: POST
    path: "/stairlift-ops/quotes/{id}/funding-applications"
