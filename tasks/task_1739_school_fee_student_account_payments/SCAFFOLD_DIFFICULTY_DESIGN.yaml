  - rule_id: transitive_cascade
    instances:
      - name: student_withdraw_cascade_to_department_ledger
        grounds:
          - state_machines.Student.ENROLLED_to_WITHDRAWN
          - state_machines.Enrollment.ACTIVE_to_WITHDRAWN
          - state_machines.Refund.PENDING_to_EXECUTED
