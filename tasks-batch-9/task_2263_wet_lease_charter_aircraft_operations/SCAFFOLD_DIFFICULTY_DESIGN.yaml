          Two independently sufficient rejections on the same request: the period is already
          SETTLED (priority 40, category state, 409) and re-invoicing it would push the lessee
          from 2,400,048 to 4,800,096 against a 3,000,000-cent credit limit (priority 72,
          category business_fiscal, 402). The declared ordering demands the 409
          ERR_PERIOD_NOT_READY_FOR_SETTLEMENT. The version supplied is deliberately the current
          one so the even higher-priority ERR_STALE_PERIOD_VERSION (priority 30, 412) does not
          mask the pair being tested.
