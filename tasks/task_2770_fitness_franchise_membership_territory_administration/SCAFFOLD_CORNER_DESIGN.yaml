          - errors[ERR_INVALID_RELOCATION_STATE]
        distinguishing_aspect: "withdraw is declared only from DRAFT and CHANGES_REQUESTED; from SUBMITTED - where the brand already owns the decision - it is refused with 409 ERR_INVALID_RELOCATION_STATE and the request stays SUBMITTED with its submitted_by_user_id intact."
