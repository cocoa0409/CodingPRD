            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-08T16:30:00Z" }
              as: PlatformAdmin
            - call: "POST /orders/${o1_id}/advance"
              payload: { to_status: "IN_PRODUCTION" }
              as: Cook
              as_user_id: "${cook_id}"
            - call: "POST /orders/${o1_id}/advance"
              payload: { to_status: "HANDED_OFF" }
              as: Cook
              as_user_id: "${cook_id}"
            - call: "POST /orders/${o2_id}/advance"
              payload: { to_status: "IN_PRODUCTION" }
              as: Cook
              as_user_id: "${cook_id}"
            - call: "POST /orders/${o2_id}/advance"
              payload: { to_status: "HANDED_OFF" }
              as: Cook
              as_user_id: "${cook_id}"
            - call: "GET /production-windows/${pw_id}"
              payload: {}
