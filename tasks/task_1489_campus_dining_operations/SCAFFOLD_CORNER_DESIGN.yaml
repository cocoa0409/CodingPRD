scaffold_corner_design:
  # ===========================================================================
  # Section: entities — creation, defaults, computed/system fields, enums,
  # not-found, pagination, FK integrity
  # ===========================================================================
  - section: entities
    instances:
      - name: dining_hall_creation_defaults_and_client_id_input_ignored
        claim_type: defaults
        grounds: [entities.DiningHall.fields.status, entities.DiningHall.fields.name]
        distinguishing_aspect: "A hall is born ACTIVE; a client-supplied id field is ignored in favor of the server-minted UUID."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /dining-halls", payload: { name: "Default Hall", service_model: "HYBRID", dining_capacity: 500, catering_kitchen_capacity: 200, id: "00000000-0000-0000-0000-000000000000" }, as: DiningAdmin, captures: { h: $.data.id, hs: $.data.status, hv: $.data.version } }
          assert:
            - "Response status == ACTIVE and version == 1"
            - "Response id != '00000000-0000-0000-0000-000000000000' (server-minted UUID; client id input ignored)"
            - "created_at/updated_at present in ISO8601 with three fractional digits"

      - name: recipe_creation_default_allergen_reviewed_false
        claim_type: defaults
        grounds: [entities.Recipe.fields.allergen_reviewed]
        distinguishing_aspect: "Omitting allergen_reviewed at creation yields false, which silently blocks cycle publish until a relabel."
        test_recipe:
          setup: ["Hall exists"]
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall D", service_model: "BOARD", dining_capacity: 500, catering_kitchen_capacity: 200 }, as: DiningAdmin, captures: { h: $.data.id } }
          trigger:
            - { call: "POST /recipes", payload: { dining_hall_id: "${h}", name: "Untested Stew", station: "GLOBAL", allergen_tags: ["SOY"], dietary_flags: [], popularity_share: 0.4, unit_cost_cents: 450 }, as: KitchenLead, captures: { r: $.data.id, rv: $.data.allergen_reviewed } }
          assert:
            - "allergen_reviewed == false (default applied)"
            - "status == ACTIVE (initial state)"

      - name: department_computed_fields_input_ignored
        claim_type: computed_fields
        grounds: [entities.Department.fields.available_cents, calculations.department_budget_ledger]
        distinguishing_aspect: "Client-supplied values for the computed budget buckets are discarded; the ledger is server-computed from day one."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /departments", payload: { name: "Math", department_code: "MATH", semester_budget_cents: 250000, reserved_cents: 999, available_cents: 5 }, as: DiningAdmin, captures: { d: $.data.id, av: $.data.available_cents, rs: $.data.reserved_cents } }
          assert:
            - "reserved_cents == 0, committed_cents == 0, spent_cents == 0 (inputs ignored)"
            - "available_cents == 250000 (== semester_budget_cents)"

      - name: dining_hall_field_validation_rejections
        claim_type: required_fields
        grounds: ["validations[priority=10]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Missing required name and out-of-range service_model are both ERR_VALIDATION 400, reported only after auth/role pass."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /dining-halls", payload: { service_model: "BOARD", dining_capacity: 500, catering_kitchen_capacity: 200 }, as: DiningAdmin, captures: { err1: $.data.error_id } }
            - { call: "POST /dining-halls", payload: { name: "X", service_model: "BUFFET", dining_capacity: 500, catering_kitchen_capacity: 200 }, as: DiningAdmin, captures: { err2: $.data.error_id } }
          assert:
            - "First trigger: error_id == ERR_VALIDATION (missing name)"
            - "Second trigger: error_id == ERR_VALIDATION (service_model BUFFET not in enum)"

      - name: meal_period_not_found_returns_404
        claim_type: not_found
        grounds: ["validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Reading a nonexistent meal period id with a permitted role yields ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /meal-periods/00000000-0000-0000-0000-000000000000", payload: {}, as: DiningAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND with HTTP 404; error envelope carries meta.api_request_id"

      - name: catering_orders_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, endpoints]
        distinguishing_aspect: "Filtered list honors limit/offset with total_count and has_more; response_type is 'array'."
        test_recipe:
          setup: ["Hall, recipe, and department with 3 DRAFT catering orders"]
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall PG", service_model: "RETAIL", dining_capacity: 500, catering_kitchen_capacity: 10000 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /recipes", payload: { dining_hall_id: "${h}", name: "R", station: "GRILL", allergen_tags: [], dietary_flags: [], popularity_share: 0.5, unit_cost_cents: 800, allergen_reviewed: true }, as: KitchenLead, captures: { r: $.data.id } }
            - { call: "POST /departments", payload: { name: "Hist", department_code: "HIST", semester_budget_cents: 1000000 }, as: DiningAdmin, captures: { d: $.data.id } }
            - { call: "POST /catering-orders", payload: { dining_hall_id: "${h}", department_id: "${d}", event_date: "2026-09-20", time_slot: "LUNCH", guaranteed_covers: 10, menu_lines: [ { recipe_id: "${r}", portions: 5 } ] }, as: DepartmentUser, as_user_id: "${d}" }
            - { call: "POST /catering-orders", payload: { dining_hall_id: "${h}", department_id: "${d}", event_date: "2026-09-21", time_slot: "LUNCH", guaranteed_covers: 10, menu_lines: [ { recipe_id: "${r}", portions: 5 } ] }, as: DepartmentUser, as_user_id: "${d}" }
            - { call: "POST /catering-orders", payload: { dining_hall_id: "${h}", department_id: "${d}", event_date: "2026-09-22", time_slot: "LUNCH", guaranteed_covers: 10, menu_lines: [ { recipe_id: "${r}", portions: 5 } ] }, as: DepartmentUser, as_user_id: "${d}" }
          trigger:
            - { call: "GET /catering-orders", payload: { department_id: "${d}", limit: 2, offset: 0 }, as: HallManager }
            - { call: "GET /catering-orders", payload: { department_id: "${d}", limit: 2, offset: 2 }, as: HallManager }
          assert:
            - "Page 1: exactly 2 items, total_count == 3, has_more == true, response_type == 'array'"
            - "Page 2 (offset 2): exactly 1 item, total_count == 3, has_more == false"

      - name: catering_order_revised_from_fk_integrity
        claim_type: parent_relationships
        grounds: [entities.CateringOrder.fields.revised_from_id, "validations[priority=3]"]
        distinguishing_aspect: "The self-referential FK must resolve: a bogus revised_from_id is 404, a valid REJECTED predecessor links and is reverse-queryable."
        test_recipe:
          setup: ["Hall, recipe, department; order A submitted then rejected (approval_status REJECTED)"]
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall FK", service_model: "RETAIL", dining_capacity: 500, catering_kitchen_capacity: 10000 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /recipes", payload: { dining_hall_id: "${h}", name: "R", station: "GRILL", allergen_tags: [], dietary_flags: [], popularity_share: 0.5, unit_cost_cents: 800, allergen_reviewed: true }, as: KitchenLead, captures: { r: $.data.id } }
            - { call: "POST /departments", payload: { name: "Geo", department_code: "GEO", semester_budget_cents: 1000000 }, as: DiningAdmin, captures: { d: $.data.id } }
            - { call: "POST /catering-orders", payload: { dining_hall_id: "${h}", department_id: "${d}", event_date: "2026-09-25", time_slot: "DINNER", guaranteed_covers: 10, menu_lines: [ { recipe_id: "${r}", portions: 5 } ] }, as: DepartmentUser, as_user_id: "${d}", captures: { oa: $.data.id } }
            - { call: "POST /catering-orders/${oa}/submit", payload: {}, as: DepartmentUser, as_user_id: "${d}" }
            - { call: "POST /catering-orders/${oa}/reject", payload: {}, as: HallManager }
          trigger:
            - { call: "POST /catering-orders", payload: { dining_hall_id: "${h}", department_id: "${d}", event_date: "2026-09-26", time_slot: "DINNER", guaranteed_covers: 10, menu_lines: [ { recipe_id: "${r}", portions: 5 } ], revised_from_id: "00000000-0000-0000-0000-000000000000" }, as: DepartmentUser, as_user_id: "${d}", captures: { err1: $.data.error_id } }
            - { call: "POST /catering-orders", payload: { dining_hall_id: "${h}", department_id: "${d}", event_date: "2026-09-26", time_slot: "DINNER", guaranteed_covers: 10, menu_lines: [ { recipe_id: "${r}", portions: 5 } ], revised_from_id: "${oa}" }, as: DepartmentUser, as_user_id: "${d}", captures: { ob: $.data.id } }
            - { call: "GET /catering-orders", payload: { revised_from_id: "${oa}" }, as: HallManager }
          assert:
            - "First trigger: error_id == ERR_NOT_FOUND with HTTP 404 (body FK validated after path ids)"
            - "Second trigger: 201; B.revised_from_id == ${oa}"
            - "Reverse query returns exactly 1 row (B) for revised_from_id == ${oa}"

  # ===========================================================================
  # Section: state_machines — invalid-from rejections, terminal lockdowns,
  # guarded transitions, resubmit cycle, initial states
  # ===========================================================================
  - section: state_machines
    instances:
      - name: meal_period_open_before_lock_rejected
        claim_type: invalid_transition
        grounds: [state_machines.MealPeriodService.FORECAST_LOCKED_to_IN_SERVICE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "open-service from SCHEDULED (skipping FORECAST_LOCKED) is ERR_INVALID_STATE; the pipeline cannot skip the forecast gate."
        test_recipe:
          setup: ["Hall, recipe, published cycle, period 2026-08-24 LUNCH in SCHEDULED (no forecasts)"]
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall SM1", service_model: "BOARD", dining_capacity: 500, catering_kitchen_capacity: 200 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /menu-cycles", payload: { dining_hall_id: "${h}", name: "Cyc", cycle_length_weeks: 4, start_date: "2026-07-01", end_date: "2026-10-01" }, as: DiningAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /menu-cycles/${cyc}/publish", payload: {}, as: DiningAdmin }
            - { call: "POST /meal-periods", payload: { dining_hall_id: "${h}", menu_cycle_id: "${cyc}", service_date: "2026-08-24", meal_period: "LUNCH" }, as: HallManager, captures: { p: $.data.id } }
          trigger:
            - { call: "POST /meal-periods/${p}/open-service", payload: {}, as: HallManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE with HTTP 409; period remains SCHEDULED"

      - name: waste_post_before_verify_rejected
        claim_type: invalid_transition
        grounds: [state_machines.WasteLog.VERIFIED_to_POSTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A RECORDED log cannot be posted directly — the VERIFIED intermediate state is mandatory."
        test_recipe:
          setup: ["Period 2026-08-25 LUNCH in RECONCILED; one RECORDED waste log"]
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall SM2", service_model: "BOARD", dining_capacity: 500, catering_kitchen_capacity: 200 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /recipes", payload: { dining_hall_id: "${h}", name: "R", station: "DELI", allergen_tags: [], dietary_flags: [], popularity_share: 0.5, unit_cost_cents: 300, allergen_reviewed: true }, as: KitchenLead, captures: { r: $.data.id } }
            - { call: "POST /menu-cycles", payload: { dining_hall_id: "${h}", name: "Cyc", cycle_length_weeks: 4, start_date: "2026-07-01", end_date: "2026-10-01" }, as: DiningAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /menu-cycles/${cyc}/publish", payload: {}, as: DiningAdmin }
            - { call: "POST /meal-periods", payload: { dining_hall_id: "${h}", menu_cycle_id: "${cyc}", service_date: "2026-08-25", meal_period: "LUNCH" }, as: HallManager, captures: { p: $.data.id, pv: $.data.version } }
            - { call: "POST /meal-periods/${p}/forecasts", payload: { recipe_id: "${r}", variant: "BASE", expected_meal_period_version: "${pv}" }, as: KitchenLead, captures: { f: $.data.id } }
            - { call: "POST /production-forecasts/${f}/lock", payload: {}, as: KitchenLead }
            - { call: "POST /meal-periods/${p}/lock-forecast", payload: {}, as: HallManager }
            - { call: "POST /meal-periods/${p}/open-service", payload: {}, as: HallManager }
            - { call: "POST /meal-periods/${p}/swipes", payload: { events: [ { entry_type: "BOARD_SWIPE", amount_cents: 0, count: 20 } ] }, as: HallManager }
            - { call: "POST /meal-periods/${p}/reconcile", payload: {}, as: HallManager }
            - { call: "POST /meal-periods/${p}/waste-logs", payload: { category: "SPOILAGE", disposition: "COMPOST", weight_kg: 3.0 }, as: KitchenLead, as_user_id: "kl-2", captures: { wl: $.data.id } }
          trigger:
            - { call: "POST /waste-logs/${wl}/post", payload: {}, as: HallManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE with HTTP 409; log remains RECORDED; period.posted_waste_kg still 0"

      - name: catering_pay_before_invoice_rejected
        claim_type: invalid_transition
        grounds: [state_machines.CateringOrder, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "pay from FULFILLED (skipping INVOICED) is rejected — the fulfillment dimension cannot skip states."
        test_recipe:
          setup: ["Order APPROVED and fulfillment == FULFILLED (quoted 100000)"]
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall SM3", service_model: "RETAIL", dining_capacity: 500, catering_kitchen_capacity: 10000 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /recipes", payload: { dining_hall_id: "${h}", name: "R", station: "GRILL", allergen_tags: [], dietary_flags: [], popularity_share: 0.5, unit_cost_cents: 800, allergen_reviewed: true }, as: KitchenLead, captures: { r: $.data.id } }
            - { call: "POST /departments", payload: { name: "Anthro", department_code: "ANTH", semester_budget_cents: 1000000 }, as: DiningAdmin, captures: { d: $.data.id } }
            - { call: "POST /catering-orders", payload: { dining_hall_id: "${h}", department_id: "${d}", event_date: "2026-09-08", time_slot: "DINNER", guaranteed_covers: 100, menu_lines: [ { recipe_id: "${r}", portions: 90 } ], dietary_plates: 0 }, as: DepartmentUser, as_user_id: "${d}", captures: { o: $.data.id } }
            - { call: "POST /catering-orders/${o}/submit", payload: {}, as: DepartmentUser, as_user_id: "${d}" }
            - { call: "GET /departments/${d}", payload: {}, as: DiningAdmin, captures: { dv: $.data.version } }
            - { call: "POST /catering-orders/${o}/approve", payload: { expected_department_version: "${dv}" }, as: HallManager }
            - { call: "POST /catering-orders/${o}/schedule", payload: {}, as: HallManager }
            - { call: "POST /catering-orders/${o}/fulfill", payload: {}, as: KitchenLead }
          trigger:
            - { call: "POST /catering-orders/${o}/pay", payload: {}, as: DiningAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE with HTTP 409; fulfillment_status remains FULFILLED; final_total_cents still null"

      - name: forecast_lock_twice_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ProductionForecast.DRAFT_to_LOCKED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Locking an already-LOCKED forecast is ERR_INVALID_STATE (no idempotent re-lock)."
        test_recipe:
          setup: ["Period SCHEDULED with one LOCKED forecast"]
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall SM4", service_model: "BOARD", dining_capacity: 500, catering_kitchen_capacity: 200 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /recipes", payload: { dining_hall_id: "${h}", name: "R", station: "GRILL", allergen_tags: [], dietary_flags: [], popularity_share: 0.5, unit_cost_cents: 500, allergen_reviewed: true }, as: KitchenLead, captures: { r: $.data.id } }
            - { call: "POST /menu-cycles", payload: { dining_hall_id: "${h}", name: "Cyc", cycle_length_weeks: 4, start_date: "2026-07-01", end_date: "2026-10-01" }, as: DiningAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /menu-cycles/${cyc}/publish", payload: {}, as: DiningAdmin }
            - { call: "POST /meal-periods", payload: { dining_hall_id: "${h}", menu_cycle_id: "${cyc}", service_date: "2026-08-26", meal_period: "LUNCH" }, as: HallManager, captures: { p: $.data.id, pv: $.data.version } }
            - { call: "POST /meal-periods/${p}/forecasts", payload: { recipe_id: "${r}", variant: "BASE", expected_meal_period_version: "${pv}" }, as: KitchenLead, captures: { f: $.data.id } }
            - { call: "POST /production-forecasts/${f}/lock", payload: {}, as: KitchenLead }
          trigger:
            - { call: "POST /production-forecasts/${f}/lock", payload: {}, as: KitchenLead, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE with HTTP 409; forecast remains LOCKED with version incremented only once"

      - name: commission_finalize_twice_rejected
        claim_type: invalid_transition
        grounds: [state_machines.CommissionStatement.PROVISIONAL_to_FINALIZED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "FINALIZED is not a from-state for finalize; the second finalize is ERR_INVALID_STATE."
        test_recipe:
          setup: ["ACTIVE contract with a FINALIZED statement for 2026-08"]
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall SM5", service_model: "RETAIL", dining_capacity: 500, catering_kitchen_capacity: 200 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /vendor-contracts", payload: { dining_hall_id: "${h}", vendor_name: "V2", board_rate_per_cover_cents: 500, retail_commission_bps: 1000, catering_commission_bps: 800, minimum_monthly_guarantee_cents: 0, effective_start_date: "2026-08-01", effective_end_date: "2026-12-01" }, as: DiningAdmin, captures: { vc: $.data.id } }
            - { call: "POST /vendor-contracts/${vc}/activate", payload: {}, as: ContractManager }
            - { call: "POST /vendor-contracts/${vc}/commission-statements", payload: { period_month: "2026-08" }, as: DiningAdmin, captures: { st: $.data.id } }
            - { call: "POST /commission-statements/${st}/finalize", payload: {}, as: ContractManager }
          trigger:
            - { call: "POST /commission-statements/${st}/finalize", payload: {}, as: ContractManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE with HTTP 409; statement remains FINALIZED; finalized_at unchanged"

      - name: menu_cycle_archive_twice_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.MenuCycle.PUBLISHED_to_ARCHIVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "ARCHIVED is terminal; a second archive is ERR_INVALID_STATE."
        test_recipe:
          setup: ["Hall with cycle C already ARCHIVED"]
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall SM6", service_model: "BOARD", dining_capacity: 500, catering_kitchen_capacity: 200 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /menu-cycles", payload: { dining_hall_id: "${h}", name: "C", cycle_length_weeks: 2, start_date: "2026-09-01", end_date: "2026-10-01" }, as: DiningAdmin, captures: { c: $.data.id } }
            - { call: "POST /menu-cycles/${c}/publish", payload: {}, as: DiningAdmin }
            - { call: "POST /menu-cycles/${c}/archive", payload: {}, as: DiningAdmin }
          trigger:
            - { call: "POST /menu-cycles/${c}/archive", payload: {}, as: DiningAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE with HTTP 409; cycle remains ARCHIVED"

      - name: labor_shift_no_show_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.LaborShift.CONFIRMED_to_NO_SHOW, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "NO_SHOW is terminal: completing a no-show shift is ERR_INVALID_STATE and records no pay."
        test_recipe:
          setup: ["Shift ASSIGNED -> CONFIRMED -> NO_SHOW"]
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall SM7", service_model: "BOARD", dining_capacity: 500, catering_kitchen_capacity: 200 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /labor-shifts", payload: { dining_hall_id: "${h}", staff_ref: "S7", role: "CASHIER", shift_date: "2026-08-12", start_minute: 600, end_minute: 900, hourly_rate_cents: 1800 }, as: HallManager, captures: { s: $.data.id } }
            - { call: "POST /labor-shifts/${s}/confirm", payload: {}, as: HallManager }
            - { call: "POST /labor-shifts/${s}/mark-no-show", payload: {}, as: HallManager }
          trigger:
            - { call: "POST /labor-shifts/${s}/complete", payload: { worked_minutes: 300 }, as: HallManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE with HTTP 409; status remains NO_SHOW; regular_minutes/overtime_minutes stay 0"

      - name: period_close_with_pending_waste_blocked
        claim_type: precondition_enforcement
        grounds: [state_machines.MealPeriodService.RECONCILED_to_CLOSED, "errors[ERR_PENDING_WASTE_LOGS]"]
        distinguishing_aspect: "Aggregate state gate: a RECONCILED period with any RECORDED/VERIFIED waste log cannot close."
        test_recipe:
          setup: ["Period 2026-08-27 LUNCH RECONCILED; one waste log still RECORDED"]
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall SM8", service_model: "BOARD", dining_capacity: 500, catering_kitchen_capacity: 200 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /recipes", payload: { dining_hall_id: "${h}", name: "R", station: "GRILL", allergen_tags: [], dietary_flags: [], popularity_share: 0.5, unit_cost_cents: 300, allergen_reviewed: true }, as: KitchenLead, captures: { r: $.data.id } }
            - { call: "POST /menu-cycles", payload: { dining_hall_id: "${h}", name: "Cyc", cycle_length_weeks: 4, start_date: "2026-07-01", end_date: "2026-10-01" }, as: DiningAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /menu-cycles/${cyc}/publish", payload: {}, as: DiningAdmin }
            - { call: "POST /meal-periods", payload: { dining_hall_id: "${h}", menu_cycle_id: "${cyc}", service_date: "2026-08-27", meal_period: "LUNCH" }, as: HallManager, captures: { p: $.data.id, pv: $.data.version } }
            - { call: "POST /meal-periods/${p}/forecasts", payload: { recipe_id: "${r}", variant: "BASE", expected_meal_period_version: "${pv}" }, as: KitchenLead, captures: { f: $.data.id } }
            - { call: "POST /production-forecasts/${f}/lock", payload: {}, as: KitchenLead }
            - { call: "POST /meal-periods/${p}/lock-forecast", payload: {}, as: HallManager }
            - { call: "POST /meal-periods/${p}/open-service", payload: {}, as: HallManager }
            - { call: "POST /meal-periods/${p}/swipes", payload: { events: [ { entry_type: "BOARD_SWIPE", amount_cents: 0, count: 5 } ] }, as: HallManager }
            - { call: "POST /meal-periods/${p}/reconcile", payload: {}, as: HallManager }
            - { call: "POST /meal-periods/${p}/waste-logs", payload: { category: "PRE_CONSUMER", disposition: "LANDFILL", weight_kg: 1.0 }, as: KitchenLead, as_user_id: "kl-3" }
          trigger:
            - { call: "POST /meal-periods/${p}/close", payload: {}, as: DiningAdmin, captures: { err: $.data.error_id } }
          assert:
