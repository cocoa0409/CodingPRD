              as: Caseworker
              as_user_id: "cw-1"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/determine"
              payload: {}
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /applications/${app_id}/approve"
              payload: { certification_start_month: "2026-08" }
              as: EligibilitySupervisor
              as_user_id: "sup-1"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/issuances"
              payload: { benefit_month: "2026-08" }
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /cases/${case_id}/work-assignments"
              payload: { activity_category: "COMMUNITY_SERVICE", scheduled_weekly_hours: 20, start_date: "2026-08-01", end_date: "2026-12-01" }
              as: WorkProgramSpecialist
              as_user_id: "wps-1"
              captures: { wa_id: $.data.id }
            - call: "POST /work-assignments/${wa_id}/activate"
              payload: {}
              as: WorkProgramSpecialist
              as_user_id: "wps-1"
            - call: "POST /work-assignments/${wa_id}/participation-reports"
              payload: { report_month: "2026-08", reported_hours: 40, verification_source: "TIMESHEET" }
              as: WorkProgramSpecialist
              as_user_id: "wps-1"
              captures: { rep_id: $.data.id }
          trigger:
            - call: "POST /work-assignments/${wa_id}/participation-reports"
              payload: { report_month: "2026-08", reported_hours: 60, verification_source: "EMPLOYER_ATTESTATION" }
              as: Caseworker
              as_user_id: "cw-1"
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_DUPLICATE_REPORT_MONTH"
            - "GET /work-assignments/${wa_id}/participation-reports returns total_count 1"
            - "ParticipationReport.${rep_id}.reported_hours == 40"
            - "ParticipationReport.${rep_id}.status == SUBMITTED"

