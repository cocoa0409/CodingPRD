              payload: { title: "Officers 2026", nomination_open_at: "2026-09-01T00:00:00Z", nomination_close_at: "2026-09-15T00:00:00Z", eligibility_cutoff_at: "2026-09-20T00:00:00Z" }
              as: LocalAdmin
              captures: { el: "$.data.id" }
          trigger:
            - call: "POST /api/elections/${el}/open-nominations"
              payload: {}
              as: LocalAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_ELECTION_STATE_FORBIDDEN (409) — clock 2026-08-01 < nomination_open_at 2026-09-01"

      - name: transfer_complete_before_effective_period_rejected
        claim_type: temporal_validation
        grounds: [state_machines.MemberTransfer.ACCEPTED_BY_TARGET_to_COMPLETED, "errors[ERR_TRANSFER_NOT_READY]"]
        distinguishing_aspect: "Completion is blocked while the current clock period (2026-08) precedes effective_period (2026-09), even from the correct ACCEPTED_BY_TARGET state."
        test_recipe:
          setup: ["FLAT locals L1, L2; member M; transfer certified and ACCEPTED_BY_TARGET with effective_period 2026-09; clock 2026-08-01"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParentBodyAdmin }
            - call: "POST /api/locals"
              payload: { name: "Local 200", dues_method: "FLAT_RATE", default_dues_percent_bp: 200, default_flat_dues_cents: 5000, per_capita_rate_cents: 1500, delinquency_threshold_cents: 10000, grace_periods: 2, notice_cure_days: 10, reinstatement_base_fee_cents: 2500, max_suspensions: 3, expel_after_months: 12 }
              as: ParentBodyAdmin
              captures: { l1: "$.data.id" }
            - call: "POST /api/locals"
              payload: { name: "Local 400", dues_method: "FLAT_RATE", default_dues_percent_bp: 200, default_flat_dues_cents: 1000, per_capita_rate_cents: 1500, delinquency_threshold_cents: 10000, grace_periods: 2, notice_cure_days: 10, reinstatement_base_fee_cents: 2500, max_suspensions: 3, expel_after_months: 12 }
              as: ParentBodyAdmin
              captures: { l2: "$.data.id" }
            - call: "POST /api/locals/${l1}/classifications"
              payload: { code: "JOURNEYMAN", min_monthly_dues_cents: 0 }
              as: LocalAdmin
              captures: { cls: "$.data.id" }
            - call: "POST /api/members"
              payload: { local_id: "${l1}", classification_id: "${cls}", full_name: "Early Erin", member_number: "M-001", joined_at: "2026-01-15" }
              as: OfficeClerk
              captures: { mem: "$.data.id", m_v: "$.data.version" }
            - call: "POST /api/members/${mem}/transfers"
              payload: { to_local_id: "${l2}", effective_period: "2026-09", expected_member_version: "${m_v}" }
              as: Member
              as_user_id: "${mem}"
              captures: { tr: "$.data.id" }
            - { call: "POST /api/transfers/${tr}/certify", payload: {}, as: OfficeClerk }
            - { call: "POST /api/transfers/${tr}/accept", payload: {}, as: OfficeClerk }
          trigger:
            - call: "POST /api/transfers/${tr}/complete"
              payload: {}
              as: SecretaryTreasurer
              as_user_id: st_1
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_TRANSFER_NOT_READY (409)"

      - name: stale_percapita_rate_blocks_approve
        claim_type: conditional_validation
        grounds: [state_machines.PerCapitaReport.DRAFT_to_APPROVED, "errors[ERR_STALE_PER_CAPITA_RATE]", entities.PerCapitaReport.fields.rate_cents]
        distinguishing_aspect: "The DRAFT pins rate 1500; after the parent body raises the local rate to 2000, approval of the stale DRAFT is rejected — version-pinning on approval."
        test_recipe:
          setup: ["PCT local (percap 1500); DRAFT report for 2026-08 pinned at 1500; local rate then PATCHed to 2000"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParentBodyAdmin }
            - call: "POST /api/locals"
              payload: { name: "Local 100", dues_method: "PERCENTAGE_OF_GROSS", default_dues_percent_bp: 200, default_flat_dues_cents: 5000, per_capita_rate_cents: 1500, delinquency_threshold_cents: 10000, grace_periods: 2, notice_cure_days: 30, reinstatement_base_fee_cents: 2500, max_suspensions: 3, expel_after_months: 12 }
              as: ParentBodyAdmin
              captures: { loc: "$.data.id", loc_v: "$.data.version" }
            - call: "POST /api/locals/${loc}/per-capita-reports"
              payload: { period: "2026-08", expected_local_version: "${loc_v}" }
              as: SecretaryTreasurer
              as_user_id: st_1
              captures: { rep: "$.data.id", pinned: "$.data.rate_cents" }
            - call: "PATCH /api/locals/${loc}"
              payload: { per_capita_rate_cents: 2000 }
              as: ParentBodyAdmin
          trigger:
            - call: "POST /api/per-capita-reports/${rep}/approve"
              payload: {}
              as: LocalAdmin
              as_user_id: admin_1
              captures: { err: "$.data.error_id" }
          assert:
            - "report pinned ${pinned} == 1500 while local now charges 2000"
            - "${err} == ERR_STALE_PER_CAPITA_RATE (409) — the DRAFT must be superseded, not approved"

      - name: reconcile_unbalanced_header_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_REMITTANCE_UNBALANCED]", calculations.remittance_reconciliation]
        distinguishing_aspect: "Single-failure fiscal check: all lines on-roster, but remitted_cents 999999 != sum of lines 1000."
