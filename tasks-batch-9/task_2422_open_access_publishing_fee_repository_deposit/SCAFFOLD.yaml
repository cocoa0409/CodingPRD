scenario: |
  Generate task harder than expert level!

  2422. Open Access Publishing Fee & Repository Deposit (university library scholarly communications office): transformative agreement eligibility check by corresponding author affiliation and journal, article processing charge fund allocation with per-author caps and priority rules, publisher invoice validation and discount application, funder open access mandate compliance tracking with embargo requirements, accepted manuscript deposit into the institutional repository with version control, persistent identifier assignment and author profile linkage, predatory publisher screening and author guidance, annual spend reporting and negotiation analytics
domain_name: open-access-publishing-fee-repository-deposit
api_prefix: "/"   # flat topology: every entity collection is a top-level path segment

complexity_profile:
  primary_archetype: quota_allocation          # finite APC funds + finite transformative-agreement article quota
  secondary_archetype: compliance_audit        # funder OA mandate, embargo, predatory screening, segregation of duties
  complexity_layers:
    - optimistic_concurrency                   # OCC on Publisher.version and Article.version
    - cascading_side_effects                   # invoice payment and publication cascades span 4 entities
    - dual_variant_calculation                 # PROVISIONAL vs FINAL coverage; ENCUMBRANCE vs CASH utilisation
    - rate_threshold_triggers                  # fund freeze at 98%, volume-discount tiers, screening score bands

  entity_topology: graph
  # graph: AgreementCoverage is a junction between TransformativeAgreement and Journal (many-to-many);
  # Article, FundRequest, PublisherInvoice and RepositoryDeposit reference across aggregate boundaries by FK.
  # No URL nesting is used for ownership — every collection is top-level, sub-resource GETs are read views only.

  state_machine_shape: parallel
  # parallel: Article carries two independent dimensions (funding_status x compliance_status).
  # Also present: cyclic (FundRequest revision loop, TransformativeAgreement EXHAUSTED<->ACTIVE,
  # RepositoryDeposit SUBMITTED->DRAFT return loop), branching (PublisherInvoice validation fork,
  # curation-decision fork), compound (Grant.mandate_status derived from its articles).

  relationship_patterns:
    - one_to_many        # Publisher->Journal, Article->RepositoryDeposit, FundRequest->FundAllocation
    - many_to_many       # TransformativeAgreement <-> Journal via AgreementCoverage
    - cross_aggregate    # PublisherInvoice->Article, FundAllocation->APCFund, Article->Grant

  role_model: segregation_of_duties
  # The FundManager who grants payment approval on an invoice may not be the FundManager who pays it.
  # Review (ScholCommLibrarian) and funding decision (FundManager) are held by different roles by construction.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Publisher
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: publisher legal name
        constraints: "1..200 chars"
      - name: publisher_code
        type: string
        source: input
        description: short code used in DOI prefixes and negotiation reports
        constraints: "unique across Publisher; 2..16 chars, uppercase alphanumeric"
      - name: country_code
        type: string
        source: input
        description: ISO 3166-1 alpha-2 country of incorporation
        constraints: "exactly 2 uppercase letters"
      - name: screening_status
        type: enum
        source: computed
        description: predatory-publisher screening verdict, recomputed by every screening run
        default: UNSCREENED
        constraints: "UNSCREENED | CLEARED | WATCHLIST | PREDATORY_FLAGGED | BLOCKED"
      - name: predatory_score
        type: integer
        source: computed
        description: latest predatory_screening_score result, 0..100
        default: null
      - name: doaj_indexed
        type: boolean
        source: system
        description: signal snapshot recorded by the latest screening run
        default: null
      - name: cope_member
        type: boolean
        source: system
        description: signal snapshot recorded by the latest screening run
        default: null
      - name: editorial_board_verified
        type: boolean
        source: system
        description: signal snapshot recorded by the latest screening run
        default: null
      - name: retraction_rate_per_1000
        type: number
        source: system
        description: signal snapshot recorded by the latest screening run
        default: null
      - name: peer_review_days_median
        type: integer
        source: system
        description: signal snapshot recorded by the latest screening run
        default: null
      - name: apc_transparency_score
        type: integer
        source: system
        description: signal snapshot recorded by the latest screening run, 0..100
        default: null
      - name: author_guidance
        type: string
        source: computed
        description: pinned guidance string the office shows authors, derived from screening_status
        default: null
      - name: last_screened_at
        type: datetime
        source: computed
        description: logical-clock timestamp of the latest screening run
        default: null
      - name: active_agreement_count
        type: integer
        source: computed
        description: "count of TransformativeAgreement rows with publisher_id == this.id AND status == ACTIVE"
        default: 0

  - name: Journal
    parent: null
    common_fields: true
    fields:
      - name: publisher_id
        type: string
        source: input
        description: "FK -> Publisher.id; owning publisher of this journal"
      - name: issn
        type: string
        source: input
        description: print/electronic ISSN
        constraints: "unique across Journal; pattern NNNN-NNNX"
      - name: title
        type: string
        source: input
        description: journal title
      - name: oa_model
        type: enum
        source: input
        description: open-access business model of the journal
        constraints: "FULLY_OA | HYBRID | SUBSCRIPTION"
      - name: list_apc_cents
        type: integer
        source: input
        description: publisher list article processing charge in USD cents
        constraints: ">= 0"
      - name: required_embargo_months
        type: integer
        source: input
        description: publisher-imposed embargo on the accepted manuscript, in whole months
        default: 12
        constraints: "0..48"

  - name: TransformativeAgreement
    parent: null
    common_fields: true
    fields:
      - name: publisher_id
        type: string
        source: input
        description: "FK -> Publisher.id; counterparty of the read-and-publish agreement"
      - name: agreement_code
        type: string
        source: input
        description: negotiated agreement identifier
        constraints: "unique across TransformativeAgreement"
      - name: effective_from
        type: string
        source: input
        description: first date the agreement covers (inclusive), ISO date
      - name: effective_until
        type: string
        source: input
        description: exclusive end date of the agreement window, ISO date
        constraints: "must be strictly after effective_from"
      - name: article_quota
        type: integer
        source: input
        description: number of articles the agreement covers over its window
        constraints: ">= 1"
      - name: articles_used
        type: integer
        source: computed
        description: "count of Articles whose effective EligibilityDetermination has agreement_id == this.id AND route IN {TA_FULL, TA_CAPPED}"
        default: 0
      - name: discount_pct
        type: number
        source: input
        description: fractional APC discount granted by the agreement
        constraints: "0 <= discount_pct <= 0.95, at most 4 decimals"
      - name: covered_oa_models
        type: array
        source: input
        description: journal oa_model values the agreement may cover
        constraints: "non-empty subset of {FULLY_OA, HYBRID}"
      - name: status
        type: enum
        source: computed
        description: agreement lifecycle state
        default: DRAFT
        constraints: "DRAFT | ACTIVE | EXHAUSTED | EXPIRED"
      - name: activated_at
        type: datetime
        source: computed
        description: logical-clock timestamp of activation
        default: null

  - name: AgreementCoverage
    parent: null
    common_fields: false
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> TransformativeAgreement.id; agreement this coverage line belongs to"
      - name: journal_id
        type: string
        source: input
        description: "FK -> Journal.id; journal brought into scope by this coverage line"
      - name: coverage_type
        type: enum
        source: input
        description: what the agreement pays for this journal
        constraints: "FULL_APC | CAPPED_APC | READ_ONLY"
      - name: capped_amount_cents
        type: integer
        source: input
        description: ceiling the agreement pays per article when coverage_type == CAPPED_APC
        default: null
        constraints: "required and > 0 when coverage_type == CAPPED_APC; must be null otherwise"
      - name: covered_from
        type: string
        source: input
        description: first date this journal is covered (inclusive), ISO date
      - name: covered_until
        type: string
        source: input
        description: last date this journal is covered (inclusive), ISO date
        constraints: "must be >= covered_from; must lie inside [agreement.effective_from, agreement.effective_until)"

  - name: Author
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: corresponding author name
      - name: email
        type: string
        source: input
        description: institutional email
      - name: orcid
        type: string
        source: input
        description: ORCID iD used for author profile linkage at repository ingest
        default: null
        constraints: "unique across Author when non-null; pattern NNNN-NNNN-NNNN-NNNX"
      - name: department_code
        type: string
        source: input
        description: recharge department code
      - name: affiliation_status
        type: enum
        source: input
        description: institutional affiliation class used for fund eligibility
        constraints: "ELIGIBLE_FACULTY | ELIGIBLE_POSTDOC | ELIGIBLE_GRAD | VISITING | EMERITUS | UNAFFILIATED"
      - name: appointment_from
        type: string
        source: input
        description: first date of the current appointment (inclusive), ISO date
      - name: appointment_until
        type: string
        source: input
        description: last date of the current appointment (inclusive), ISO date
      - name: annual_cap_cents
        type: integer
        source: input
        description: per-author annual APC subsidy ceiling in USD cents
        default: 500000
        constraints: ">= 0"
      - name: apc_committed_cents
        type: integer
        source: computed
        description: "ENCUMBRANCE_INCLUSIVE variant of fund_utilisation_by_basis scoped to this author, current fiscal year"
        default: 0
      - name: apc_disbursed_cents
        type: integer
        source: computed
        description: "CASH_BASIS variant of fund_utilisation_by_basis scoped to this author, current fiscal year"
        default: 0
      - name: linked_output_count
        type: integer
        source: computed
        description: "count of RepositoryDeposit rows with status == INGESTED whose article.corresponding_author_id == this.id"
        default: 0

  - name: Funder
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: research funder name
      - name: funder_code
        type: string
        source: input
        description: funder short code
        constraints: "unique across Funder"
      - name: mandate_type
        type: enum
        source: input
        description: open-access mandate imposed on funded outputs
        constraints: "NONE | GREEN_OA | GOLD_OA | IMMEDIATE_CC_BY"
      - name: max_embargo_months
        type: integer
        source: input
        description: longest embargo the funder tolerates on the deposited manuscript
        constraints: "0..24"
      - name: deposit_deadline_days
        type: integer
        source: input
        description: days after acceptance within which the manuscript must be ingested
        constraints: "1..365"
      - name: license_required
        type: enum
        source: input
        description: license the deposited manuscript must carry
        constraints: "ANY | CC_BY | CC_BY_OR_NC"
      - name: apc_allowable
        type: boolean
        source: input
        description: whether the funder permits grant/institutional funds to pay a gold APC

  - name: Grant
    parent: null
    common_fields: true
    fields:
      - name: funder_id
        type: string
        source: input
        description: "FK -> Funder.id; funder awarding this grant"
      - name: pi_author_id
        type: string
        source: input
        description: "FK -> Author.id; principal investigator"
      - name: grant_number
        type: string
        source: input
        description: award number
        constraints: "unique across Grant"
      - name: award_from
        type: string
        source: input
        description: award start date (inclusive), ISO date
      - name: award_until
        type: string
        source: input
        description: award end date (inclusive), ISO date
      - name: apc_budget_cents
        type: integer
        source: input
        description: APC allowance recorded on the award, reporting only
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        description: award lifecycle state, closed by the compliance sweep once award_until has passed
        default: ACTIVE
        constraints: "ACTIVE | CLOSED"
      - name: output_count
        type: integer
        source: computed
        description: "count of Articles with grant_id == this.id"
        default: 0
      - name: compliant_output_count
        type: integer
        source: computed
        description: "count of Articles with grant_id == this.id AND compliance_status IN {COMPLIANT, EXEMPT}"
        default: 0
      - name: mandate_status
        type: enum
        source: computed
        description: compound mandate verdict derived from the grant's articles
        default: IN_PROGRESS
        constraints: "IN_PROGRESS | SATISFIED | BREACHED"

  - name: Article
    parent: null
    common_fields: true
    fields:
      - name: journal_id
        type: string
        source: input
        description: "FK -> Journal.id; venue that accepted the manuscript"
      - name: corresponding_author_id
        type: string
        source: input
        description: "FK -> Author.id; corresponding author, owner of this article for RBAC purposes"
      - name: grant_id
        type: string
        source: input
        description: "FK -> Grant.id; primary funding award, null for unfunded work"
        default: null
      - name: manuscript_title
        type: string
        source: input
        description: manuscript title
      - name: accepted_on
        type: string
        source: input
        description: acceptance date (inclusive), ISO date; drives PROVISIONAL coverage and the deposit deadline
      - name: publication_date
        type: string
        source: computed
        description: version-of-record publication date, set by the publication endpoint
        default: null
      - name: apc_list_cents
        type: integer
        source: input
        description: publisher-quoted list APC for this article; overrides journal.list_apc_cents under FINAL basis only
        default: null
      - name: doi
        type: string
        source: computed
        description: DOI minted at publication, "10.5555/{publisher_code}.{publication_sequence}"
        default: null
      - name: funding_status
        type: enum
        source: computed
        description: funding dimension of the article state machine
        default: DRAFT
        constraints: "DRAFT | ELIGIBILITY_CHECKED | FUNDING_REQUESTED | FUNDED | PARTIALLY_FUNDED | SELF_FUNDED | DECLINED"
      - name: compliance_status
        type: enum
        source: computed
        description: funder-mandate dimension of the article state machine, independent of funding_status
        default: PENDING_DEPOSIT
        constraints: "PENDING_DEPOSIT | EMBARGOED | COMPLIANT | NON_COMPLIANT | EXEMPT"
      - name: eligibility_route
        type: enum
        source: computed
        description: route recorded by the effective EligibilityDetermination
        default: null
        constraints: "TA_FULL | TA_CAPPED | FUND_APC | AUTHOR_PAYS"
      - name: covered_amount_cents
        type: integer
        source: computed
        description: covered_amount_cents of the effective EligibilityDetermination
        default: 0
      - name: author_share_cents
        type: integer
        source: computed
        description: author_share_cents of the effective EligibilityDetermination
        default: 0
      - name: determination_count
        type: integer
        source: computed
        description: number of EligibilityDetermination rows written for this article; equals the highest sequence_no
        default: 0
      - name: deposit_deadline_on
        type: string
        source: computed
        description: "accepted_on + funder.deposit_deadline_days when a grant with mandate_type != NONE exists, else null"
        default: null
      - name: embargo_until
        type: string
        source: computed
        description: first date the ingested manuscript may become public, per mandate_compliance_and_embargo
        default: null
      - name: latest_deposit_ordinal
        type: integer
        source: computed
        description: highest version_ordinal among this article's RepositoryDeposit rows
        default: 0

  - name: EligibilityDetermination
    parent: null
    common_fields: false
    fields:
      - name: article_id
        type: string
        source: input
        description: "FK -> Article.id; article this determination was computed for"
      - name: sequence_no
        type: integer
        source: computed
        description: per-article 1-based index; the row with the highest sequence_no is the effective determination
      - name: basis
        type: enum
        source: input
        description: which variant of apc_coverage_determination produced this row
        default: PROVISIONAL
        constraints: "PROVISIONAL | FINAL"
      - name: reference_date
        type: string
        source: computed
        description: date used for agreement and coverage window tests, ISO date
      - name: route
        type: enum
        source: computed
        description: funding route selected for the article
        constraints: "TA_FULL | TA_CAPPED | FUND_APC | AUTHOR_PAYS"
      - name: agreement_id
        type: string
        source: computed
        description: "FK -> TransformativeAgreement.id; selected agreement, null for FUND_APC and AUTHOR_PAYS"
        default: null
      - name: coverage_id
        type: string
        source: computed
        description: "FK -> AgreementCoverage.id; matched coverage line, null when no agreement was selected"
        default: null
      - name: list_base_cents
        type: integer
        source: computed
        description: base APC the determination priced against
      - name: discount_pct_applied
        type: number
        source: computed
        description: agreement discount actually applied, 0 when no agreement was selected
      - name: covered_amount_cents
        type: integer
        source: computed
        description: cents the agreement pays
      - name: author_share_cents
        type: integer
        source: computed
        description: cents left with the author or institutional funds after agreement coverage
      - name: eligible_request_cents
        type: integer
        source: computed
        description: ceiling the author may request from APC funds under this determination
      - name: determination_reason
        type: string
        source: computed
        description: pinned reason code explaining the route choice
        constraints: "TA_FULL_COVERAGE | TA_CAPPED_COVERAGE | NO_COVERAGE_FUND_ELIGIBLE | NO_COVERAGE_AUTHOR_PAYS | PREDATORY_FLAGGED_NO_INSTITUTIONAL_FUNDS"
      - name: quota_position
        type: integer
        source: computed
        description: agreement token index this determination occupies, 1-based, null when route has no agreement
        default: null

  - name: APCFund
    parent: null
    common_fields: true
    fields:
      - name: fund_code
        type: string
        source: input
        description: fund short code
        constraints: "unique across APCFund"
      - name: fiscal_year
        type: integer
        source: input
        description: institutional fiscal year label; FY N runs (N-1)-07-01 .. N-06-30
        constraints: "2020..2100"
      - name: period_from
        type: string
        source: input
        description: fund period start (inclusive), ISO date
      - name: period_to
        type: string
        source: input
        description: fund period end (inclusive), ISO date
      - name: total_budget_cents
        type: integer
        source: input
        description: authorised budget in USD cents
        constraints: "> 0"
      - name: committed_cents
        type: integer
        source: computed
        description: "sum of FundAllocation.amount_cents on this fund with status == ENCUMBERED"
        default: 0
      - name: spent_cents
        type: integer
        source: computed
        description: "sum of FundAllocation.amount_cents on this fund with status == DISBURSED"
        default: 0
      - name: available_cents
        type: integer
        source: computed
        description: "total_budget_cents - committed_cents - spent_cents"
        default: 0
      - name: priority_rank
        type: integer
        source: input
        description: waterfall order; lower rank is drawn first
        constraints: ">= 1; unique per fiscal_year"
      - name: eligible_affiliation_statuses
        type: array
        source: input
        description: Author.affiliation_status values this fund may pay for
        constraints: "non-empty subset of Author.affiliation_status enum"
      - name: per_article_cap_cents
        type: integer
        source: input
        description: most this fund contributes to a single article
        constraints: "> 0"
      - name: status
        type: enum
        source: computed
        description: fund lifecycle state; FROZEN is terminal
        default: OPEN
        constraints: "OPEN | FROZEN"
      - name: freeze_reason
        type: string
        source: computed
        description: reason recorded when the fund froze, either the manual reason or AUTO_THRESHOLD
        default: null

  - name: FundRequest
    parent: null
    common_fields: true
    fields:
      - name: article_id
        type: string
        source: input
        description: "FK -> Article.id; article the subsidy is requested for"
      - name: requested_cents
        type: integer
        source: input
        description: amount the author asks the funds to cover
        constraints: "> 0"
      - name: justification
        type: string
        source: input
        description: author justification text
      - name: status
        type: enum
        source: computed
        description: request lifecycle state
        default: SUBMITTED
        constraints: "SUBMITTED | UNDER_REVIEW | INFO_REQUESTED | APPROVED | REJECTED | WITHDRAWN | PAID"
      - name: revision_round
        type: integer
        source: computed
        description: number of completed resubmission cycles
        default: 0
      - name: info_needed
        type: string
        source: computed
        description: latest reviewer information request
        default: null
      - name: response_note
        type: string
        source: computed
        description: latest author response supplied on resubmission
        default: null
      - name: reviewed_by_user_id
        type: string
        source: computed
        description: X-User-ID of the ScholCommLibrarian who started the review
        default: null
      - name: decided_by_user_id
        type: string
        source: computed
        description: X-User-ID of the FundManager who approved or rejected
        default: null
      - name: decision_reason
        type: string
        source: computed
        description: reason text supplied with the decision
        default: null
      - name: approved_cents
        type: integer
        source: computed
        description: "sum of FundAllocation.amount_cents on this request with status IN {ENCUMBERED, DISBURSED}"
        default: 0
      - name: author_share_cents
        type: integer
        source: computed
        description: "requested_cents - approved_cents at decision time"
        default: 0
      - name: fully_funded
        type: boolean
        source: computed
        description: "approved_cents == requested_cents"
        default: false

  - name: FundAllocation
    parent: null
    common_fields: true
    fields:
      - name: fund_request_id
        type: string
        source: input
        description: "FK -> FundRequest.id; request this allocation line belongs to"
      - name: fund_id
        type: string
        source: input
        description: "FK -> APCFund.id; fund the money is drawn from"
      - name: amount_cents
        type: integer
        source: computed
        description: cents drawn from this fund by apc_fund_waterfall_allocation
        constraints: "> 0"
      - name: sequence_index
        type: integer
        source: computed
        description: 1-based waterfall position this line was filled in
      - name: status
        type: enum
        source: computed
        description: allocation ledger state
        default: ENCUMBERED
        constraints: "ENCUMBERED | DISBURSED | RELEASED"
      - name: released_reason
        type: string
        source: computed
        description: reason recorded when an encumbrance was released
        default: null

  - name: PublisherInvoice
    parent: null
    common_fields: true
    fields:
      - name: publisher_id
        type: string
        source: input
        description: "FK -> Publisher.id; invoice issuer"
      - name: article_id
        type: string
        source: input
        description: "FK -> Article.id; article the charge relates to"
      - name: invoice_number
        type: string
        source: input
        description: publisher invoice number
        constraints: "unique per publisher_id"
      - name: invoice_amount_cents
        type: integer
        source: input
        description: gross amount the publisher billed, in cents
        constraints: ">= 0"
      - name: currency
        type: enum
        source: input
        description: invoice currency
        constraints: "USD only; any other value is rejected"
      - name: claimed_discount_pct
        type: number
        source: input
        description: discount the publisher claims to have applied
        constraints: "0 <= claimed_discount_pct <= 0.95"
      - name: vat_pct
        type: number
        source: input
        description: VAT / sales tax fraction applied on the net amount
        constraints: "0 <= vat_pct <= 0.30"
      - name: invoice_date
        type: string
        source: input
        description: invoice issue date, ISO date; picks the fiscal year for tiering and reporting
      - name: entitled_discount_pct
        type: number
        source: computed
        description: discount the institution is entitled to, from the agreement or publisher_volume_discount_tier
      - name: net_cents
        type: integer
        source: computed
        description: step 1 of invoice_expected_amount_validation
      - name: vat_cents
        type: integer
        source: computed
        description: step 2 of invoice_expected_amount_validation
      - name: expected_amount_cents
        type: integer
        source: computed
        description: "net_cents + vat_cents"
      - name: variance_cents
        type: integer
        source: computed
        description: "invoice_amount_cents - expected_amount_cents"
      - name: validation_outcome
        type: enum
        source: computed
        description: verdict of invoice_expected_amount_validation
        constraints: "MATCH | WITHIN_TOLERANCE | DISCOUNT_SHORTFALL | AMOUNT_VARIANCE"
      - name: status
        type: enum
        source: computed
        description: invoice lifecycle state
        default: RECEIVED
        constraints: "RECEIVED | VALIDATED | DISPUTED | APPROVED_FOR_PAYMENT | PAID"
      - name: dispute_reason
        type: string
        source: computed
        description: reason recorded when validation branched to DISPUTED
        default: null
      - name: payment_approved_by_user_id
        type: string
        source: computed
        description: X-User-ID of the FundManager who approved payment; the payer must differ
        default: null
      - name: payment_reference
        type: string
        source: input
        description: bank payment reference supplied at payment time
        default: null

  - name: RepositoryDeposit
    parent: null
    common_fields: true
    fields:
      - name: article_id
        type: string
        source: input
        description: "FK -> Article.id; article whose manuscript version is deposited"
      - name: version_label
        type: enum
        source: input
        description: which manuscript version this deposit carries
        constraints: "ACCEPTED_MANUSCRIPT | VERSION_OF_RECORD"
      - name: version_ordinal
        type: integer
        source: computed
        description: "article.latest_deposit_ordinal + 1 at creation time; monotonic per article"
      - name: file_checksum
        type: string
        source: input
        description: SHA-256 hex digest of the deposited file
        constraints: "64 lowercase hex chars"
      - name: license
        type: enum
        source: input
        description: license attached to the deposited file
        constraints: "CC_BY | CC_BY_NC | CC_BY_NC_ND | ALL_RIGHTS_RESERVED"
      - name: status
        type: enum
        source: computed
        description: deposit lifecycle state
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | INGESTED | SUPERSEDED"
      - name: persistent_identifier
        type: string
        source: computed
        description: handle minted at ingest, "hdl:2027/ir.NNNNNN" from the institutional ingest counter
        default: null
      - name: returned_count
        type: integer
        source: computed
        description: number of times curation returned this deposit to DRAFT
        default: 0
      - name: curation_note
        type: string
        source: computed
        description: latest curator note
        default: null
      - name: submitted_at
        type: datetime
        source: computed
        description: logical-clock timestamp of the latest submission
        default: null
      - name: ingested_at
        type: datetime
        source: computed
        description: logical-clock timestamp of ingest
        default: null
      - name: embargo_until
        type: string
        source: computed
        description: embargo end date copied from the article at ingest, ISO date
        default: null

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------- Article
  # PARALLEL DIMENSIONS: funding_status and compliance_status evolve independently
  # on the same row. No transition in one dimension reads or writes the other.
  - entity: Article
    initial_state: "funding_status=DRAFT (dimension 1); compliance_status=PENDING_DEPOSIT or EXEMPT (dimension 2, set at creation)"
    terminal_states: [DECLINED, COMPLIANT, NON_COMPLIANT, EXEMPT]
    transitions:
      # --- dimension 1: funding_status ---
      - from: DRAFT
        to: FUNDED
        trigger: "POST /articles/{id}/eligibility-checks yielding route TA_FULL"
        actor: ScholCommLibrarian
        preconditions:
          - "publisher.screening_status != BLOCKED"
          - "a candidate TransformativeAgreement with status IN {ACTIVE, EXHAUSTED} passes its basis-specific quota gate and a FULL_APC AgreementCoverage matches the journal on reference_date"
        side_effects:
          - "insert EligibilityDetermination with sequence_no = article.determination_count + 1; article.determination_count += 1"
          - "recompute article.eligibility_route, covered_amount_cents, author_share_cents from the effective determination"
          - "recompute TransformativeAgreement.articles_used for the selected agreement; when articles_used >= article_quota the agreement auto-transitions ACTIVE -> EXHAUSTED"
          - "recompute Publisher.active_agreement_count and increment Publisher.version by 1 when the agreement's status changed"
        note: "funding dimension only; compliance_status is untouched"
      - from: DRAFT
        to: ELIGIBILITY_CHECKED
        trigger: "POST /articles/{id}/eligibility-checks yielding route FUND_APC or TA_CAPPED with eligible_request_cents > 0"
        actor: ScholCommLibrarian | CorrespondingAuthor
        preconditions:
          - "publisher.screening_status != BLOCKED"
          - "grant, when present, has status == ACTIVE"
        side_effects:
          - "insert EligibilityDetermination as above; article.determination_count += 1"
          - "recompute article.eligibility_route, covered_amount_cents, author_share_cents"
      - from: DRAFT
        to: SELF_FUNDED
        trigger: "POST /articles/{id}/eligibility-checks yielding route AUTHOR_PAYS, or TA_CAPPED with eligible_request_cents == 0"
        actor: ScholCommLibrarian | CorrespondingAuthor
        preconditions:
          - "publisher.screening_status != BLOCKED"
        side_effects:
          - "insert EligibilityDetermination as above; article.determination_count += 1"
          - "recompute article.eligibility_route, covered_amount_cents, author_share_cents"
        note: "PREDATORY_FLAGGED publishers always land here with determination_reason PREDATORY_FLAGGED_NO_INSTITUTIONAL_FUNDS"
      - from: ELIGIBILITY_CHECKED
        to: ELIGIBILITY_CHECKED
        trigger: "POST /articles/{id}/eligibility-checks re-run (cycle on the same state)"
        actor: ScholCommLibrarian | CorrespondingAuthor
        preconditions:
          - "no FundRequest for this article has status IN {APPROVED, PAID}"
        side_effects:
          - "insert a further EligibilityDetermination; the previous row stops being effective"
          - "recompute articles_used on both the previously selected and newly selected agreements"
      - from: SELF_FUNDED
        to: FUNDED
        trigger: "POST /articles/{id}/eligibility-checks re-run that now yields route TA_FULL"
        actor: ScholCommLibrarian | CorrespondingAuthor
        preconditions:
          - "no FundRequest for this article has status IN {APPROVED, PAID}"
        side_effects:
          - "insert a further EligibilityDetermination; the previous row stops being effective"
          - "recompute articles_used on the newly selected agreement; may drive ACTIVE -> EXHAUSTED and Publisher.active_agreement_count / version"
        note: "the agreement became selectable between the two runs (for example it moved DRAFT -> ACTIVE)"
      - from: SELF_FUNDED
        to: ELIGIBILITY_CHECKED
        trigger: "POST /articles/{id}/eligibility-checks re-run that now yields route FUND_APC, or TA_CAPPED with eligible_request_cents > 0"
        actor: ScholCommLibrarian | CorrespondingAuthor
        preconditions:
          - "no FundRequest for this article has status IN {APPROVED, PAID}"
        side_effects:
          - "insert a further EligibilityDetermination; the previous row stops being effective"
      - from: ELIGIBILITY_CHECKED
        to: SELF_FUNDED
        trigger: "POST /articles/{id}/eligibility-checks re-run that now yields route AUTHOR_PAYS"
        actor: ScholCommLibrarian | CorrespondingAuthor
        preconditions:
          - "no FundRequest for this article has status IN {APPROVED, PAID}"
        side_effects:
          - "insert a further EligibilityDetermination; the previous row stops being effective"
          - "recompute articles_used on the previously selected agreement"
      - from: ELIGIBILITY_CHECKED
        to: FUNDING_REQUESTED
        trigger: "POST /fund-requests"
        actor: CorrespondingAuthor
        preconditions:
          - "effective EligibilityDetermination exists with eligible_request_cents > 0"
          - "requested_cents <= effective determination eligible_request_cents"
        side_effects:
          - "create FundRequest with status SUBMITTED and revision_round 0"
      - from: FUNDING_REQUESTED
        to: FUNDED
        trigger: "POST /fund-requests/{id}/decision with decision=APPROVE and full coverage"
        actor: FundManager
        preconditions:
          - "FundRequest.status == UNDER_REVIEW"
          - "apc_fund_waterfall_allocation covers requested_cents in full"
        side_effects:
          - "create FundAllocation rows with status ENCUMBERED"
          - "recompute each touched APCFund.committed_cents and available_cents; auto-freeze fund when committed_cents + spent_cents >= round_half_up(total_budget_cents * FUND_FREEZE_THRESHOLD_PCT)"
          - "recompute Author.apc_committed_cents"
      - from: FUNDING_REQUESTED
        to: PARTIALLY_FUNDED
        trigger: "POST /fund-requests/{id}/decision with decision=APPROVE and partial coverage"
        actor: FundManager
        preconditions:
          - "FundRequest.status == UNDER_REVIEW"
          - "apc_fund_waterfall_allocation yields 0 < approved_cents < requested_cents"
        side_effects:
          - "same allocation and ledger side effects as the FUNDED branch"
          - "FundRequest.author_share_cents = requested_cents - approved_cents"
      - from: FUNDING_REQUESTED
        to: DECLINED
        trigger: "POST /fund-requests/{id}/decision with decision=REJECT"
        actor: FundManager
        preconditions:
          - "FundRequest.status == UNDER_REVIEW"
        side_effects:
          - "FundRequest.status = REJECTED; decision_reason recorded"
          - "no FundAllocation rows are created; no fund ledger changes"
        note: "DECLINED is terminal for the funding dimension: later determinations leave funding_status unchanged"
      - from: FUNDING_REQUESTED
        to: ELIGIBILITY_CHECKED
        trigger: "POST /fund-requests/{id}/withdrawal from SUBMITTED or INFO_REQUESTED"
        actor: CorrespondingAuthor
        preconditions:
          - "FundRequest.status IN {SUBMITTED, INFO_REQUESTED}"
        side_effects:
          - "FundRequest.status = WITHDRAWN"
      - from: FUNDED
        to: ELIGIBILITY_CHECKED
        trigger: "POST /articles/{id}/publication whose automatic FINAL determination changes route away from TA_FULL/TA_CAPPED to FUND_APC"
        actor: ScholCommLibrarian
        preconditions:
          - "article.publication_date is null"
          - "no FundRequest for this article has status IN {APPROVED, PAID}"
        side_effects:
          - "set publication_date; mint doi"
          - "insert FINAL EligibilityDetermination; article.determination_count += 1"
          - "recompute articles_used on the previously selected agreement, releasing its quota token"
          - "agreement auto-transitions EXHAUSTED -> ACTIVE when articles_used < article_quota"
          - "recompute Publisher.active_agreement_count and increment Publisher.version by 1"
      - from: FUNDED
        to: SELF_FUNDED
        trigger: "POST /articles/{id}/publication whose automatic FINAL determination changes route to AUTHOR_PAYS"
        actor: ScholCommLibrarian
        preconditions:
          - "article.publication_date is null"
          - "no FundRequest for this article has status IN {APPROVED, PAID}"
        side_effects:
          - "same publication and quota-release side effects as the FUNDED -> ELIGIBILITY_CHECKED transition"
      # --- dimension 2: compliance_status ---
      - from: PENDING_DEPOSIT
        to: EMBARGOED
        trigger: "POST /repository-deposits/{id}/curation-decision with decision=INGEST while embargo_until > clock date"
        actor: RepositoryCurator
        preconditions:
          - "deposit.status == SUBMITTED"
          - "ingest date <= article.deposit_deadline_on"
        side_effects:
          - "article.embargo_until recomputed by mandate_compliance_and_embargo"
          - "recompute Grant.compliant_output_count and Grant.mandate_status"
      - from: PENDING_DEPOSIT
        to: COMPLIANT
        trigger: "POST /repository-deposits/{id}/curation-decision with decision=INGEST while embargo_until <= clock date"
        actor: RepositoryCurator
        preconditions:
          - "deposit.status == SUBMITTED"
          - "ingest date <= article.deposit_deadline_on"
        side_effects:
          - "recompute Grant.compliant_output_count and Grant.mandate_status; mandate_status becomes SATISFIED when every article of the grant is COMPLIANT or EXEMPT"
      - from: PENDING_DEPOSIT
        to: NON_COMPLIANT
        trigger: "POST /repository-deposits/{id}/curation-decision with decision=INGEST after the deadline, or POST /compliance-sweeps phase 3"
        actor: RepositoryCurator | ScholCommLibrarian
        preconditions:
          - "clock date > article.deposit_deadline_on"
        side_effects:
          - "recompute Grant.mandate_status; BREACHED dominates SATISFIED"
      - from: EMBARGOED
        to: COMPLIANT
        trigger: "POST /compliance-sweeps phase 4 once clock date >= article.embargo_until"
        actor: ScholCommLibrarian
        preconditions:
          - "clock date >= article.embargo_until"
        side_effects:
          - "recompute Grant.compliant_output_count and Grant.mandate_status"

  # ------------------------------------------------- TransformativeAgreement
  - entity: TransformativeAgreement
    initial_state: DRAFT
    terminal_states: [EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /transformative-agreements/{id}/activation"
        actor: AgreementAdmin
        preconditions:
          - "status == DRAFT"
          - "at least one AgreementCoverage row exists for this agreement"
        side_effects:
          - "activated_at stamped from the logical clock"
          - "Publisher.active_agreement_count += 1; Publisher.version += 1"
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system: articles_used recomputed >= article_quota after an EligibilityDetermination insert"
        actor: system
        preconditions:
          - "articles_used >= article_quota"
        side_effects:
          - "Publisher.active_agreement_count -= 1; Publisher.version += 1"
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "system: articles_used recomputed < article_quota after a determination stopped being effective (quota token released)"
        actor: system
        preconditions:
          - "articles_used < article_quota"
          - "clock date < effective_until"
        side_effects:
          - "Publisher.active_agreement_count += 1; Publisher.version += 1"
        note: "cycle ACTIVE -> EXHAUSTED -> ACTIVE; the only compensating path for agreement quota tokens"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /compliance-sweeps phase 1 once clock date >= effective_until"
        actor: ScholCommLibrarian
        preconditions:
          - "clock date >= effective_until"
        side_effects:
          - "Publisher.active_agreement_count -= 1; Publisher.version += 1"
      - from: EXHAUSTED
        to: EXPIRED
        trigger: "POST /compliance-sweeps phase 1 once clock date >= effective_until"
        actor: ScholCommLibrarian
        preconditions:
          - "clock date >= effective_until"
        side_effects:
          - "no active_agreement_count change (EXHAUSTED was not counted)"
      - from: DRAFT
        to: EXPIRED
        trigger: "POST /compliance-sweeps phase 1 once clock date >= effective_until"
        actor: ScholCommLibrarian
        preconditions:
          - "clock date >= effective_until"
        side_effects:
          - "no active_agreement_count change"

  # ------------------------------------------------------------- FundRequest
  - entity: FundRequest
    initial_state: SUBMITTED
    terminal_states: [REJECTED, WITHDRAWN, PAID]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /fund-requests/{id}/start-review"
        actor: ScholCommLibrarian
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "reviewed_by_user_id = X-User-ID"
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /fund-requests/{id}/info-requests"
        actor: ScholCommLibrarian
        preconditions:
          - "status == UNDER_REVIEW"
        side_effects:
          - "info_needed recorded"
      - from: INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /fund-requests/{id}/resubmissions"
        actor: CorrespondingAuthor
        preconditions:
          - "status == INFO_REQUESTED"
          - "requested_cents <= effective EligibilityDetermination eligible_request_cents"
        side_effects:
          - "revision_round += 1; requested_cents replaced; response_note recorded"
        note: "cycle SUBMITTED -> UNDER_REVIEW -> INFO_REQUESTED -> SUBMITTED, unbounded rounds"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /fund-requests/{id}/decision with decision=APPROVE"
        actor: FundManager
        preconditions:
          - "status == UNDER_REVIEW"
          - "author remaining cap under ENCUMBRANCE_INCLUSIVE basis > 0"
          - "apc_fund_waterfall_allocation yields approved_cents > 0"
        side_effects:
          - "create FundAllocation rows (ENCUMBERED) in waterfall order"
          - "APCFund.committed_cents / available_cents recomputed; auto-freeze at threshold"
          - "Author.apc_committed_cents recomputed"
          - "Article.funding_status = FUNDED or PARTIALLY_FUNDED"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /fund-requests/{id}/decision with decision=REJECT"
        actor: FundManager
        preconditions:
          - "status == UNDER_REVIEW"
        side_effects:
          - "decision_reason recorded; Article.funding_status = DECLINED"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /fund-requests/{id}/withdrawal"
        actor: CorrespondingAuthor
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "Article.funding_status = ELIGIBILITY_CHECKED"
      - from: INFO_REQUESTED
        to: WITHDRAWN
        trigger: "POST /fund-requests/{id}/withdrawal"
        actor: CorrespondingAuthor
        preconditions:
          - "status == INFO_REQUESTED"
        side_effects:
          - "Article.funding_status = ELIGIBILITY_CHECKED"
      - from: APPROVED
        to: WITHDRAWN
        trigger: "POST /fund-requests/{id}/withdrawal after approval"
        actor: CorrespondingAuthor
        preconditions:
          - "status == APPROVED"
          - "no PublisherInvoice for this article has status == PAID"
        side_effects:
          - "every FundAllocation of this request with status == ENCUMBERED becomes RELEASED with released_reason REQUEST_WITHDRAWN"
          - "each affected APCFund.committed_cents / available_cents recomputed (compensating: encumbered total returns to its pre-approval value)"
          - "Author.apc_committed_cents recomputed"
          - "Article.funding_status = ELIGIBILITY_CHECKED"
      - from: APPROVED
        to: PAID
        trigger: "system: the article's PublisherInvoice reached PAID"
        actor: system
        preconditions:
          - "status == APPROVED"
        side_effects:
          - "every FundAllocation with status == ENCUMBERED becomes DISBURSED"
          - "each allocation's APCFund moves the amount from committed_cents to spent_cents"
          - "Author.apc_committed_cents and Author.apc_disbursed_cents recomputed"

  # --------------------------------------------------------- PublisherInvoice
  - entity: PublisherInvoice
    initial_state: RECEIVED
    terminal_states: [DISPUTED, PAID]
    transitions:
      - from: RECEIVED
        to: VALIDATED
        trigger: "POST /publisher-invoices/{id}/validation when validation_outcome IN {MATCH, WITHIN_TOLERANCE}"
        actor: ScholCommLibrarian
        preconditions:
          - "status == RECEIVED"
        side_effects:
          - "invoice_expected_amount_validation recomputed; net_cents, vat_cents, expected_amount_cents, variance_cents, entitled_discount_pct refreshed"
        note: "branch A of the validation fork"
      - from: RECEIVED
        to: DISPUTED
        trigger: "POST /publisher-invoices/{id}/validation when validation_outcome IN {DISCOUNT_SHORTFALL, AMOUNT_VARIANCE}"
        actor: ScholCommLibrarian
        preconditions:
          - "status == RECEIVED"
        side_effects:
          - "dispute_reason set to the validation_outcome value"
          - "no payment path exists from DISPUTED; the publisher must issue a fresh invoice number"
        note: "branch B of the validation fork; divergent side-effect set from branch A"
      - from: VALIDATED
        to: APPROVED_FOR_PAYMENT
        trigger: "POST /publisher-invoices/{id}/payment-approval"
        actor: FundManager
        preconditions:
          - "status == VALIDATED"
          - "article.funding_status IN {FUNDED, PARTIALLY_FUNDED, SELF_FUNDED}"
        side_effects:
          - "payment_approved_by_user_id = X-User-ID"
      - from: APPROVED_FOR_PAYMENT
        to: PAID
        trigger: "POST /publisher-invoices/{id}/payment"
        actor: FundManager
        preconditions:
          - "status == APPROVED_FOR_PAYMENT"
          - "X-User-ID != payment_approved_by_user_id"
        side_effects:
          - "payment_reference recorded"
          - "the article's FundRequest with status == APPROVED transitions to PAID (cascade hop 1)"
          - "that request's ENCUMBERED FundAllocation rows become DISBURSED (cascade hop 2)"
          - "each allocation's APCFund moves amount_cents from committed_cents to spent_cents (cascade hop 3)"
          - "Author.apc_committed_cents and Author.apc_disbursed_cents recomputed"
        note: "when the article has no APPROVED FundRequest (SELF_FUNDED route) hops 1-3 do not fire"

  # -------------------------------------------------------- RepositoryDeposit
  - entity: RepositoryDeposit
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /repository-deposits/{id}/submission"
        actor: CorrespondingAuthor
        preconditions:
          - "status == DRAFT"
        side_effects:
          - "submitted_at stamped from the logical clock"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /repository-deposits/{id}/curation-decision with decision=RETURN"
        actor: RepositoryCurator
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "returned_count += 1; curation_note recorded"
        note: "cycle DRAFT -> SUBMITTED -> DRAFT, unbounded"
      - from: SUBMITTED
        to: INGESTED
        trigger: "POST /repository-deposits/{id}/curation-decision with decision=INGEST"
        actor: RepositoryCurator
        preconditions:
          - "status == SUBMITTED"
          - "article.corresponding_author.orcid is non-null (author profile linkage)"
        side_effects:
          - "persistent_identifier minted as hdl:2027/ir.NNNNNN from the institutional ingest counter; ingested_at stamped"
          - "any other RepositoryDeposit of the same article with status == INGESTED becomes SUPERSEDED (cascade hop 1)"
          - "article.latest_deposit_ordinal, embargo_until and compliance_status recomputed by mandate_compliance_and_embargo (cascade hop 2)"
          - "Grant.compliant_output_count and Grant.mandate_status recomputed (cascade hop 3)"
          - "Author.linked_output_count recomputed"
      - from: INGESTED
        to: SUPERSEDED
        trigger: "system: a later version_ordinal deposit of the same article was ingested"
        actor: system
        preconditions:
          - "status == INGESTED"
          - "another deposit of the same article with a higher version_ordinal reached INGESTED"
        side_effects:
          - "persistent_identifier is retained on the superseded row for citation stability"

  # -------------------------------------------------------------------- Grant
  - entity: Grant
    initial_state: "status=ACTIVE (dimension 1); mandate_status=IN_PROGRESS (dimension 2)"
    terminal_states: [CLOSED, BREACHED]
    transitions:
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /compliance-sweeps phase 2 once clock date > award_until"
        actor: ScholCommLibrarian
        preconditions:
          - "clock date > award_until"
        side_effects:
          - "articles referencing this grant can no longer pass the FUND_APC eligibility test"
      - from: IN_PROGRESS
        to: SATISFIED
        trigger: "system: recompute after an article of this grant reached COMPLIANT or EXEMPT"
        actor: system
        preconditions:
          - "output_count > 0"
          - "every article of the grant has compliance_status IN {COMPLIANT, EXEMPT}"
        side_effects: []
      - from: IN_PROGRESS
        to: BREACHED
        trigger: "system: recompute after an article of this grant reached NON_COMPLIANT"
        actor: system
        preconditions:
          - "at least one article of the grant has compliance_status == NON_COMPLIANT"
        side_effects: []
      - from: SATISFIED
        to: BREACHED
        trigger: "system: recompute after a further article of this grant reached NON_COMPLIANT"
        actor: system
        preconditions:
          - "at least one article of the grant has compliance_status == NON_COMPLIANT"
        side_effects: []
        note: "BREACHED dominates SATISFIED and is terminal for the mandate dimension"

  # ----------------------------------------------------------------- APCFund
  - entity: APCFund
    initial_state: OPEN
    terminal_states: [FROZEN]
    transitions:
      - from: OPEN
        to: FROZEN
        trigger: "POST /apc-funds/{id}/freeze"
        actor: FundManager
        preconditions:
          - "status == OPEN"
        side_effects:
          - "freeze_reason = supplied reason; the fund leaves the waterfall candidate set"
      - from: OPEN
        to: FROZEN
        trigger: "system: committed_cents + spent_cents >= round_half_up(total_budget_cents * FUND_FREEZE_THRESHOLD_PCT) after an allocation was encumbered or disbursed"
        actor: system
        preconditions:
          - "committed_cents + spent_cents >= round_half_up(total_budget_cents * 0.98)"
        side_effects:
          - "freeze_reason = AUTO_THRESHOLD"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on the parent's version — the only sanctioned mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: agreement-create-stale-publisher
    parent_entity: Publisher
    write_endpoint: "POST /transformative-agreements"
    occ_field: "expected_publisher_version"
    description: |
      Creating a TransformativeAgreement against a Publisher whose version has
      advanced since the client last read it is rejected with a stale-version
      error. A new agreement legitimately extends or supersedes the publisher's
      negotiated position, so a second create against unchanged state would
      itself succeed; the guard exists because the publisher's screening verdict
      or agreement portfolio may have moved under the negotiator's feet.
    error_id: ERR_STALE_PARENT_VERSION
    http_status: 412
  - rule_id: deposit-create-stale-article
    parent_entity: Article
    write_endpoint: "POST /repository-deposits"
    occ_field: "expected_article_version"
    description: |
      Creating a RepositoryDeposit against an Article whose version has advanced
      since the client last read it is rejected with a stale-version error. A new
      deposit legitimately supersedes the article's previously ingested version,
      so the create is not blocked by any state precondition once the prior
      deposit reached INGESTED; the guard exists because the depositing client's
      view of the article's version lineage is stale.
    error_id: ERR_STALE_PARENT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: apc_coverage_determination
    trigger: "POST /articles/{id}/eligibility-checks (basis from the request, default PROVISIONAL); automatically with basis=FINAL inside POST /articles/{id}/publication"
    algorithm: forward_looking | chronological (variant-selected)
    formula: |
      # ---- inputs -------------------------------------------------------
      J = article.journal; P = J.publisher; G = article.grant (may be null)
      reference_date = (basis == PROVISIONAL) ? article.accepted_on
                                             : (article.publication_date ?? clock_date())
      list_base_cents = (basis == FINAL and article.apc_list_cents != null)
                        ? article.apc_list_cents : J.list_apc_cents
      # ---- screening gate ----------------------------------------------
      # P.screening_status == BLOCKED is rejected earlier by validation priority 12
      if P.screening_status == PREDATORY_FLAGGED:
          route = AUTHOR_PAYS; agreement = null; coverage = null
          discount_pct_applied = 0
          covered_amount_cents = 0
          author_share_cents = list_base_cents
          eligible_request_cents = 0
          determination_reason = "PREDATORY_FLAGGED_NO_INSTITUTIONAL_FUNDS"
          quota_position = null
          RETURN
      # ---- candidate agreements (eligibility filter) --------------------
      candidates = [T in TransformativeAgreement where
            T.publisher_id == P.id
        and T.status IN {ACTIVE, EXHAUSTED}                        # EXPIRED and DRAFT excluded
        and T.effective_from <= reference_date < T.effective_until  # half-open window
        and J.oa_model IN T.covered_oa_models
        and quota_ok(T, basis)
        and exists C in AgreementCoverage where
                 C.agreement_id == T.id and C.journal_id == J.id
             and C.coverage_type IN {FULL_APC, CAPPED_APC}          # READ_ONLY never funds
             and C.covered_from <= reference_date <= C.covered_until # closed window
      ]
      quota_ok(T, PROVISIONAL) = count(Articles whose effective determination has
                                       agreement_id == T.id and route IN {TA_FULL, TA_CAPPED})
                                 < T.article_quota                  # forward-looking: provisional holds count
      quota_ok(T, FINAL)       = count(Articles whose effective determination has
                                       agreement_id == T.id and route IN {TA_FULL, TA_CAPPED}
                                       and basis == FINAL)
                                 < T.article_quota                  # chronological: only committed tokens count
      # ranking (candidate set is at most 1 because validation priority 20 forbids
      # overlapping agreement windows per publisher; pinned anyway for determinism):
      #   discount_pct DESC, then effective_until ASC, then created_at ASC
      # tie-break of last resort: created_at ASC (never id)
      # fallback when candidates is empty: fall through to the fund/author branch below
      # ---- routing ------------------------------------------------------
      if candidates non-empty:
          T = first(candidates ranked as above)
          C = the single matching coverage row of T for J on reference_date
          discount_pct_applied = T.discount_pct
          price_after_discount = round_half_up(list_base_cents * (1 - T.discount_pct))
          quota_position = (count of tokens already held on T) + 1
          if C.coverage_type == FULL_APC:
              route = TA_FULL
              covered_amount_cents = price_after_discount
              author_share_cents = 0
              eligible_request_cents = 0
              determination_reason = "TA_FULL_COVERAGE"
          else:                                   # CAPPED_APC
              route = TA_CAPPED
              covered_amount_cents = min(C.capped_amount_cents, price_after_discount)
              author_share_cents = price_after_discount - covered_amount_cents
              eligible_request_cents = fund_route_eligible ? author_share_cents : 0
              determination_reason = "TA_CAPPED_COVERAGE"
      else:
          discount_pct_applied = 0
          quota_position = null
          if fund_route_eligible:
              route = FUND_APC
              covered_amount_cents = 0
              author_share_cents = list_base_cents
              eligible_request_cents = list_base_cents
              determination_reason = "NO_COVERAGE_FUND_ELIGIBLE"
          else:
              route = AUTHOR_PAYS
              covered_amount_cents = 0
              author_share_cents = list_base_cents
              eligible_request_cents = 0
              determination_reason = "NO_COVERAGE_AUTHOR_PAYS"
      fund_route_eligible = G != null and G.status == ACTIVE
                            and G.funder.mandate_type IN {GOLD_OA, IMMEDIATE_CC_BY}
                            and G.funder.apc_allowable == true
                            and J.oa_model == FULLY_OA
      # ---- persistence --------------------------------------------------
      insert EligibilityDetermination(sequence_no = article.determination_count + 1, ...)
      article.determination_count += 1
      article.eligibility_route / covered_amount_cents / author_share_cents := this row
      funding_status := TA_FULL -> FUNDED
                        TA_CAPPED -> (eligible_request_cents > 0 ? ELIGIBILITY_CHECKED : SELF_FUNDED)
                        FUND_APC  -> ELIGIBILITY_CHECKED
                        AUTHOR_PAYS -> SELF_FUNDED
      # funding_status is left untouched when it is DECLINED, or when a FundRequest
      # of this article has status IN {APPROVED, PAID}
      recompute TransformativeAgreement.articles_used on the previously selected and
      newly selected agreements (this is what releases and consumes quota tokens)
    input_set: |
      Agreements with status IN {ACTIVE, EXHAUSTED} whose half-open window contains reference_date;
      coverage rows with coverage_type IN {FULL_APC, CAPPED_APC} whose closed window contains
      reference_date. DRAFT and EXPIRED agreements, READ_ONLY coverage rows, and coverage rows of
      other journals are excluded. The effective determination of an article is the row with the
      highest sequence_no.
    constants:
      ROUNDING: round_half_up
    precision: "integer cents; round_half_up applied once, to list_base_cents * (1 - discount_pct)"
    variants:
      - name: PROVISIONAL
        when: "eligibility check at or after acceptance, before the version of record exists"
        difference: "reference_date = accepted_on; list_base_cents always journal.list_apc_cents; quota gate counts every effective TA-route determination, including provisional holds (forward-looking)"
      - name: FINAL
        when: "eligibility check with basis=FINAL, and the automatic re-determination inside publication"
        difference: "reference_date = publication_date ?? clock date; list_base_cents prefers article.apc_list_cents; quota gate counts only effective determinations with basis == FINAL (chronological), so an agreement whose tokens are held by provisional determinations can still cover a FINAL determination"

  - name: apc_fund_waterfall_allocation
    trigger: "POST /fund-requests/{id}/decision with decision=APPROVE (side effect: create FundAllocation rows and refresh APCFund.committed_cents / available_cents)"
    algorithm: waterfall_allocation
    formula: |
      A = request.article; AU = A.corresponding_author; D = effective EligibilityDetermination of A
      # ---- ceilings (non-linear interaction of three independent inputs) ----
      author_remaining_cap = max(0, AU.annual_cap_cents
                                    - fund_utilisation_by_basis(AU, ENCUMBRANCE_INCLUSIVE, fiscal_year))
      if author_remaining_cap == 0: reject ERR_AUTHOR_CAP_EXHAUSTED
      request_ceiling = min(request.requested_cents, D.eligible_request_cents, author_remaining_cap)
      remaining = request_ceiling
      # ---- candidate funds ---------------------------------------------
      candidates = [F in APCFund where
            F.status == OPEN                                  # FROZEN funds are excluded
        and F.fiscal_year == fiscal_year_of(clock_date())
        and F.period_from <= clock_date() <= F.period_to
        and AU.affiliation_status IN F.eligible_affiliation_statuses ]
      # order: priority_rank ASC; ties impossible because (fiscal_year, priority_rank)
      # is unique (validation priority 23); last-resort tie-break created_at ASC, never id
      # ---- waterfall ----------------------------------------------------
      seq = 0
      for F in candidates ordered by priority_rank ASC:
          if remaining == 0: break
          fund_available = F.total_budget_cents - F.committed_cents - F.spent_cents
          take = min(remaining, fund_available, F.per_article_cap_cents)
          if take <= 0: continue                              # skip, do not abort
          seq += 1
          insert FundAllocation(fund_request_id, fund_id = F.id, amount_cents = take,
                                sequence_index = seq, status = ENCUMBERED)
          F.committed_cents += take; F.available_cents = F.total_budget_cents - F.committed_cents - F.spent_cents
          if F.committed_cents + F.spent_cents >= round_half_up(F.total_budget_cents * FUND_FREEZE_THRESHOLD_PCT):
              F.status = FROZEN; F.freeze_reason = "AUTO_THRESHOLD"
          remaining -= take
      approved_cents = request_ceiling - remaining
      if approved_cents == 0: reject ERR_NO_FUND_CAPACITY
      request.approved_cents = approved_cents
      request.author_share_cents = request.requested_cents - approved_cents
      request.fully_funded = (approved_cents == request.requested_cents)
      A.funding_status = request.fully_funded ? FUNDED : PARTIALLY_FUNDED
    input_set: "APCFund rows with status == OPEN, fiscal_year equal to the fiscal year of the current clock date, period containing the clock date, and the author's affiliation_status listed in eligible_affiliation_statuses. FROZEN funds, other fiscal years and non-matching affiliations are excluded."
    constants:
      FUND_FREEZE_THRESHOLD_PCT: 0.98
      FISCAL_YEAR_START_MONTH_DAY: "07-01"
    precision: "integer cents throughout; no fractional allocation, no remainder redistribution"

  - name: fund_utilisation_by_basis
    trigger: "author cap ceiling inside apc_fund_waterfall_allocation; Author.apc_committed_cents / apc_disbursed_cents recomputation; GET /analytics/annual-spend"
    algorithm: aggregation
    formula: |
      # scope S is either one author (cap check) or the whole institution (analytics)
      rows = [L in FundAllocation where
                L.fund.fiscal_year == fiscal_year
            and (scope == INSTITUTION or L.fund_request.article.corresponding_author_id == author.id)]
      ENCUMBRANCE_INCLUSIVE: used = sum(L.amount_cents for L in rows where L.status IN {ENCUMBERED, DISBURSED})
      CASH_BASIS:            used = sum(L.amount_cents for L in rows where L.status == DISBURSED)
      remaining_cap = max(0, author.annual_cap_cents - used)      # author scope only
      # RELEASED lines never count under either basis.
    input_set: "FundAllocation rows whose fund has the requested fiscal_year; status filter differs per variant; RELEASED rows are excluded from both."
    constants:
      FISCAL_YEAR_START_MONTH_DAY: "07-01"
    precision: "integer cents; sums are order-insensitive"
    variants:
      - name: ENCUMBRANCE_INCLUSIVE
        when: "author cap enforcement at approval time, Author.apc_committed_cents, GET /analytics/annual-spend?basis=ENCUMBRANCE (default)"
        difference: "counts ENCUMBERED and DISBURSED lines, so money promised but not yet paid consumes the author's cap"
      - name: CASH_BASIS
        when: "Author.apc_disbursed_cents, GET /analytics/annual-spend?basis=CASH, year-end spend reporting"
        difference: "counts DISBURSED lines only, so the same ledger reports a strictly smaller (often zero) utilisation for the identical data set"

  - name: invoice_expected_amount_validation
    trigger: "POST /publisher-invoices (computed at creation) and POST /publisher-invoices/{id}/validation (recomputed, then the RECEIVED -> VALIDATED / DISPUTED branch is taken)"
    algorithm: threshold
    formula: |
      D = effective EligibilityDetermination of invoice.article   # required, see validation priority 16
      base_cents = D.list_base_cents
      entitled_discount_pct = (D.route IN {TA_FULL, TA_CAPPED})
                              ? D.discount_pct_applied
                              : publisher_volume_discount_tier(invoice)
      # ---- PINNED ROUNDING ORDER: round each component to whole cents, THEN sum.
      # "sum then round" is explicitly NOT the rule and differs by up to 1 cent.
      net_cents      = round_half_up(base_cents * (1 - entitled_discount_pct))     # step 1
      vat_cents      = round_half_up(net_cents * invoice.vat_pct)                  # step 2, on the ROUNDED net
      expected_amount_cents = net_cents + vat_cents                                # step 3, no further rounding
      variance_cents = invoice.invoice_amount_cents - expected_amount_cents
      # ---- outcome, evaluated in this order ----------------------------
      if invoice.claimed_discount_pct < entitled_discount_pct - DISCOUNT_EPSILON:
          validation_outcome = DISCOUNT_SHORTFALL          # publisher under-applied the negotiated discount
      elif variance_cents == 0:
          validation_outcome = MATCH
      elif abs(variance_cents) <= VARIANCE_TOLERANCE_CENTS:
          validation_outcome = WITHIN_TOLERANCE
      else:
          validation_outcome = AMOUNT_VARIANCE
      # validation endpoint: MATCH / WITHIN_TOLERANCE -> VALIDATED
      #                      DISCOUNT_SHORTFALL / AMOUNT_VARIANCE -> DISPUTED (dispute_reason = outcome)
    input_set: "The effective EligibilityDetermination of the invoiced article supplies base_cents and, for TA routes, the entitled discount; for non-TA routes the tier comes from publisher_volume_discount_tier over that publisher's PAID invoices only."
    constants:
      VARIANCE_TOLERANCE_CENTS: 100
      DISCOUNT_EPSILON: 0.0001
      ROUNDING: round_half_up
    precision: "integer cents; round_half_up applied twice — once to net_cents, once to vat_cents — and never to the sum"

  - name: publisher_volume_discount_tier
    trigger: "inside invoice_expected_amount_validation whenever the article's effective determination route is FUND_APC or AUTHOR_PAYS"
    algorithm: tiered_pricing
    formula: |
      # CIRCULAR-LOOKING DEPENDENCY, RESOLVED BY PINNED EVALUATION ORDER:
      # the tier depends on cumulative net spend with the publisher, and this invoice's
      # net_cents depends on the tier. The order is pinned as:
      #   (1) prior_paid_net_cents is computed from OTHER invoices only, and only those
      #       with status == PAID — the invoice being priced is excluded, and so are
      #       RECEIVED / VALIDATED / APPROVED_FOR_PAYMENT / DISPUTED invoices;
      #   (2) the tier is selected from prior_paid_net_cents;
      #   (3) net_cents for this invoice is then computed from that tier and never
      #       re-entered into step (1).
      fy = fiscal_year_of(invoice.invoice_date)          # FY N = (N-1)-07-01 .. N-06-30
      prior_paid_net_cents = sum(I.net_cents for I in PublisherInvoice where
                                    I.publisher_id == invoice.publisher_id
                                and I.id != invoice.id
                                and I.status == PAID
                                and fiscal_year_of(I.invoice_date) == fy)
      tier_pct = 0.20 if prior_paid_net_cents >= TIER3_MIN_CENTS
            else 0.15 if prior_paid_net_cents >= TIER2_MIN_CENTS
            else 0.10 if prior_paid_net_cents >= TIER1_MIN_CENTS
            else 0.00
    input_set: "PublisherInvoice rows of the same publisher with status == PAID and invoice_date inside the same institutional fiscal year, excluding the invoice being priced."
    constants:
      TIER1_MIN_CENTS: 500000
      TIER2_MIN_CENTS: 2000000
      TIER3_MIN_CENTS: 5000000
    precision: "tier boundaries are inclusive (>=); integer cents"

  - name: predatory_screening_score
    trigger: "POST /publishers/{id}/screening-runs"
    algorithm: weighted_scoring
    formula: |
      score = 0
      score += W_NO_DOAJ            if doaj_indexed == false
      score += W_NO_COPE            if cope_member == false
      score += W_NO_BOARD           if editorial_board_verified == false
      score += min(W_RETRACTION_CAP, round_half_up(retraction_rate_per_1000 * RETRACTION_MULTIPLIER))
      score += W_FAST_REVIEW        if peer_review_days_median < PEER_REVIEW_MIN_DAYS
      score -= round_half_up(apc_transparency_score * TRANSPARENCY_CREDIT)
      predatory_score = clamp(score, 0, 100)
      screening_status = BLOCKED            if predatory_score >= BLOCK_MIN
                    else PREDATORY_FLAGGED  if predatory_score >= FLAG_MIN
                    else WATCHLIST          if predatory_score >= WATCH_MIN
                    else CLEARED
      author_guidance = pinned string per status:
        CLEARED            -> "Venue cleared: institutional APC funds and agreement coverage may be used."
        WATCHLIST          -> "Venue on watchlist: confirm indexing and peer-review claims before submitting."
        PREDATORY_FLAGGED  -> "Venue flagged as predatory: no institutional funds; deposit the accepted manuscript instead."
        BLOCKED            -> "Venue blocked: eligibility checks are refused; contact the scholarly communications office."
      last_screened_at = clock timestamp; signal snapshot fields are overwritten; version += 1
    input_set: "Only the six signals supplied by the current screening run; earlier runs are not averaged in."
    constants:
      W_NO_DOAJ: 25
      W_NO_COPE: 15
      W_NO_BOARD: 20
      W_RETRACTION_CAP: 25
      RETRACTION_MULTIPLIER: 5
      W_FAST_REVIEW: 15
      PEER_REVIEW_MIN_DAYS: 14
      TRANSPARENCY_CREDIT: 0.1
      BLOCK_MIN: 85
      FLAG_MIN: 60
      WATCH_MIN: 35
    precision: "integer score, round_half_up on each weighted component before summing; clamped to [0, 100]"

  - name: mandate_compliance_and_embargo
    trigger: "POST /articles (initial compliance_status and deposit_deadline_on); POST /articles/{id}/publication (embargo_until refresh); POST /repository-deposits/{id}/curation-decision with decision=INGEST; POST /compliance-sweeps phases 3 and 4"
    algorithm: threshold
    formula: |
      G = article.grant; F = G?.funder
      if G == null or F.mandate_type == NONE:
          compliance_status = EXEMPT; deposit_deadline_on = null; embargo_until = null; RETURN
      deposit_deadline_on = article.accepted_on + F.deposit_deadline_days   # calendar days
      embargo_months = (F.mandate_type == IMMEDIATE_CC_BY) ? 0
                       : min(F.max_embargo_months, article.journal.required_embargo_months)
      embargo_base = article.publication_date ?? article.accepted_on
      embargo_until = add_months(embargo_base, embargo_months)
      # add_months keeps the day-of-month, clamping to the last day of the target month
      # ---- evaluated at ingest ----------------------------------------
      ingest_date = clock_date()
      if ingest_date > deposit_deadline_on:  compliance_status = NON_COMPLIANT   # strict >
      elif clock_date() >= embargo_until:    compliance_status = COMPLIANT       # inclusive >=
      else:                                  compliance_status = EMBARGOED
      # ---- sweep phase 3 (no ingested deposit yet) --------------------
      if compliance_status == PENDING_DEPOSIT and clock_date() > deposit_deadline_on:
          compliance_status = NON_COMPLIANT
      # ---- sweep phase 4 ----------------------------------------------
      if compliance_status == EMBARGOED and clock_date() >= embargo_until:
          compliance_status = COMPLIANT
      # ---- grant roll-up (compound state) -----------------------------
      G.output_count = count(Articles with grant_id == G.id)
      G.compliant_output_count = count(those with compliance_status IN {COMPLIANT, EXEMPT})
      G.mandate_status = BREACHED  if any article of G has compliance_status == NON_COMPLIANT
                    else SATISFIED if G.output_count > 0 and G.compliant_output_count == G.output_count
                    else IN_PROGRESS
    input_set: "The article's grant and funder, the journal's required_embargo_months, and the logical clock date. Articles without a grant, or whose funder mandate_type is NONE, are EXEMPT and never enter the sweep."
    constants:
      DEADLINE_COMPARISON: "ingest_date > deposit_deadline_on is late (deposit exactly on the deadline is on time)"
      EMBARGO_COMPARISON: "clock_date >= embargo_until releases the embargo"
    precision: "whole calendar days and whole months; no partial-day arithmetic"

  - name: annual_spend_and_negotiation_analytics
    trigger: "GET /analytics/annual-spend"
    algorithm: aggregation
    formula: |
      fy_from = date(fiscal_year - 1, 07, 01); fy_to = date(fiscal_year, 06, 30)
      allocations = FundAllocation rows whose fund.fiscal_year == fiscal_year
      total_committed_cents = sum(amount_cents where status == ENCUMBERED)
      total_disbursed_cents = sum(amount_cents where status == DISBURSED)
      total_allocated_cents = (basis == ENCUMBRANCE) ? total_committed_cents + total_disbursed_cents
                                                     : total_disbursed_cents
      paid = PublisherInvoice rows with status == PAID and fy_from <= invoice_date <= fy_to
             (further filtered to publisher_id when the query supplies one)
      paid_invoice_count = count(paid)
      avg_paid_net_cents = (paid_invoice_count == 0) ? 0
                           : round_half_up(sum(paid.net_cents) / paid_invoice_count)
      dets = effective EligibilityDetermination rows whose article.accepted_on in [fy_from, fy_to]
      ta_articles_covered = count(dets where route IN {TA_FULL, TA_CAPPED})
      ta_savings_cents = sum(d.list_base_cents - d.covered_amount_cents - d.author_share_cents
                             for d in dets where route IN {TA_FULL, TA_CAPPED})
      hybrid_article_count   = count(dets where article.journal.oa_model == HYBRID)
      fully_oa_article_count = count(dets where article.journal.oa_model == FULLY_OA)
      # selector: publisher with the largest paid net spend; eligibility filter = publishers
      # appearing in `paid`; ranking = sum(net_cents) DESC; tie-break = publisher_code ASC;
      # empty-pool fallback = null
      top_publisher_code = ranked_first or null
      negotiation_leverage_ratio = round_half_up_4dp(ta_savings_cents / max(1, total_disbursed_cents))
    input_set: "FundAllocation rows of funds in the requested fiscal_year (RELEASED excluded from both totals); PublisherInvoice rows with status == PAID whose invoice_date falls in the fiscal-year window; effective EligibilityDetermination rows of articles accepted inside that window."
    constants:
      FISCAL_YEAR_START_MONTH_DAY: "07-01"
      EMPTY_SET_AVERAGE: 0
      LEVERAGE_DENOMINATOR_FLOOR: 1
    precision: "integer cents; averages round_half_up to whole cents; negotiation_leverage_ratio rounded to 4 decimals"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "path ids resolve left to right, then body foreign keys resolve in the order the endpoint's input list declares them"
    error_id: "ERR_PUBLISHER_NOT_FOUND | ERR_JOURNAL_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_COVERAGE_NOT_FOUND | ERR_AUTHOR_NOT_FOUND | ERR_FUNDER_NOT_FOUND | ERR_GRANT_NOT_FOUND | ERR_FUND_NOT_FOUND | ERR_ARTICLE_NOT_FOUND | ERR_DETERMINATION_NOT_FOUND | ERR_FUND_REQUEST_NOT_FOUND | ERR_INVOICE_NOT_FOUND | ERR_DEPOSIT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints carrying path ids or FK body fields"
  - priority: 4
    category: auth
    check: "when X-User-Role is CorrespondingAuthor, X-User-ID equals the target article's corresponding_author_id (directly, or through fund_request.article / deposit.article), and equals corresponding_author_id on POST /articles"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /articles, POST /articles/{id}/eligibility-checks, POST /fund-requests, POST /fund-requests/{id}/resubmissions, POST /fund-requests/{id}/withdrawal, POST /repository-deposits, POST /repository-deposits/{id}/submission"
  - priority: 5
    category: business_constraint
    check: "request body shape: required fields present, enum members valid, integers >= 0, discount/vat fractions inside their declared ranges, currency == USD, capped_amount_cents present only for CAPPED_APC coverage, pagination limit in 1..100 and offset >= 0, effective_until > effective_from, covered_until >= covered_from"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 6
    category: state
    check: "expected_publisher_version equals Publisher.version (POST /transformative-agreements); expected_article_version equals Article.version (POST /repository-deposits)"
    error_id: ERR_STALE_PARENT_VERSION
    http_status: 412
    applies_to: "POST /transformative-agreements, POST /repository-deposits"
  - priority: 7
    category: state
    check: "agreement activation requires status == DRAFT and at least one AgreementCoverage row"
    error_id: ERR_AGREEMENT_NOT_ACTIVATABLE
    http_status: 409
    applies_to: "POST /transformative-agreements/{id}/activation"
  - priority: 8
    category: state
    check: "start-review requires status == SUBMITTED; info-requests and decision require status == UNDER_REVIEW; withdrawal requires status IN {SUBMITTED, INFO_REQUESTED, APPROVED}"
    error_id: ERR_REQUEST_NOT_REVIEWABLE
    http_status: 409
    applies_to: "POST /fund-requests/{id}/start-review, POST /fund-requests/{id}/info-requests, POST /fund-requests/{id}/decision, POST /fund-requests/{id}/withdrawal"
  - priority: 9
    category: state
    check: "resubmission requires status == INFO_REQUESTED"
    error_id: ERR_REQUEST_NOT_RESUBMITTABLE
    http_status: 409
    applies_to: "POST /fund-requests/{id}/resubmissions"
  - priority: 10
    category: state
    check: "submission requires deposit status == DRAFT; curation-decision requires deposit status == SUBMITTED"
    error_id: ERR_DEPOSIT_INVALID_STATE
    http_status: 409
    applies_to: "POST /repository-deposits/{id}/submission, POST /repository-deposits/{id}/curation-decision"
  - priority: 11
    category: state
    check: "validation requires invoice status == RECEIVED; payment-approval requires VALIDATED; payment requires APPROVED_FOR_PAYMENT"
    error_id: ERR_INVOICE_INVALID_STATE
    http_status: 409
    applies_to: "POST /publisher-invoices/{id}/validation, POST /publisher-invoices/{id}/payment-approval, POST /publisher-invoices/{id}/payment"
  - priority: 12
    category: state
    check: "publication requires article.publication_date == null"
    error_id: ERR_ARTICLE_ALREADY_PUBLISHED
    http_status: 409
    applies_to: "POST /articles/{id}/publication"
  - priority: 13
    category: state
    check: "manual freeze requires fund status == OPEN"
    error_id: ERR_FUND_FROZEN
    http_status: 409
    applies_to: "POST /apc-funds/{id}/freeze"
  - priority: 14
    category: auth
    check: "the paying FundManager's X-User-ID differs from invoice.payment_approved_by_user_id (segregation of duties)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /publisher-invoices/{id}/payment"
  - priority: 15
    category: business_safety
    check: "the journal's publisher has screening_status != BLOCKED"
    error_id: ERR_PUBLISHER_BLOCKED
    http_status: 422
    applies_to: "POST /articles/{id}/eligibility-checks, POST /fund-requests"
  - priority: 16
    category: business_safety
    check: "deposit license satisfies the funder's license_required (CC_BY requires CC_BY; CC_BY_OR_NC requires CC_BY or CC_BY_NC; ANY accepts all)"
    error_id: ERR_LICENSE_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /repository-deposits"
  - priority: 17
    category: business_safety
    check: "ingest requires the article's corresponding author to have a non-null orcid (author profile linkage)"
    error_id: ERR_ORCID_REQUIRED
    http_status: 422
    applies_to: "POST /repository-deposits/{id}/curation-decision with decision=INGEST"
  - priority: 18
    category: business_referential
    check: "when the article references a grant, that grant has status == ACTIVE; on POST /articles the accepted_on date must also fall inside [award_from, award_until]"
    error_id: ERR_GRANT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /articles, POST /articles/{id}/eligibility-checks, POST /fund-requests"
  - priority: 19
    category: business_referential
    check: "an effective EligibilityDetermination exists for the article (both endpoints); additionally, on POST /fund-requests, its eligible_request_cents > 0 — an invoice may be raised for an AUTHOR_PAYS article whose eligible_request_cents is 0"
    error_id: ERR_ELIGIBILITY_NOT_DETERMINED
    http_status: 409
    applies_to: "POST /fund-requests, POST /publisher-invoices"
  - priority: 20
    category: business_referential
    check: "the coverage line's journal belongs to the agreement's publisher"
    error_id: ERR_COVERAGE_JOURNAL_PUBLISHER_MISMATCH
    http_status: 422
    applies_to: "POST /transformative-agreements/{id}/coverages"
  - priority: 21
    category: business_referential
    check: "payment approval requires article.funding_status IN {FUNDED, PARTIALLY_FUNDED, SELF_FUNDED}"
    error_id: ERR_ARTICLE_NOT_FUNDED
    http_status: 409
    applies_to: "POST /publisher-invoices/{id}/payment-approval"
  - priority: 22
    category: business_temporal
    check: "accepted_on falls inside the corresponding author's [appointment_from, appointment_until] closed window"
    error_id: ERR_APPOINTMENT_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /articles"
  - priority: 23
    category: business_temporal
    check: "no other TransformativeAgreement of the same publisher with status IN {DRAFT, ACTIVE, EXHAUSTED} has a half-open window [effective_from, effective_until) intersecting the new one; touching windows (new.effective_from == other.effective_until) are permitted"
    error_id: ERR_AGREEMENT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /transformative-agreements"
  - priority: 24
    category: business_temporal
    check: "no other AgreementCoverage for the same journal_id has a closed window within COVERAGE_GAP_DAYS of the new closed window: reject when new.covered_from <= other.covered_until + 1 day AND new.covered_until >= other.covered_from - 1 day"
    error_id: ERR_COVERAGE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /transformative-agreements/{id}/coverages"
  - priority: 25
    category: business_constraint
    check: "at most one RepositoryDeposit per article with status IN {DRAFT, SUBMITTED}; version_ordinal is strictly increasing"
    error_id: ERR_DEPOSIT_VERSION_CONFLICT
    http_status: 409
    applies_to: "POST /repository-deposits"
  - priority: 26
    category: business_constraint
    check: "Journal.issn is unique"
    error_id: ERR_DUPLICATE_ISSN
    http_status: 409
    applies_to: "POST /journals"
  - priority: 27
    category: business_constraint
    check: "TransformativeAgreement.agreement_code is unique"
    error_id: ERR_DUPLICATE_AGREEMENT_CODE
    http_status: 409
    applies_to: "POST /transformative-agreements"
  - priority: 28
    category: business_constraint
    check: "Author.orcid is unique among non-null values"
    error_id: ERR_DUPLICATE_ORCID
    http_status: 409
    applies_to: "POST /authors"
  - priority: 29
    category: business_constraint
    check: "PublisherInvoice.invoice_number is unique per publisher_id"
    error_id: ERR_DUPLICATE_INVOICE_NUMBER
    http_status: 409
    applies_to: "POST /publisher-invoices"
  - priority: 30
    category: business_constraint
    check: "(fiscal_year, priority_rank) is unique across APCFund"
    error_id: ERR_DUPLICATE_FUND_PRIORITY
    http_status: 409
    applies_to: "POST /apc-funds"
  - priority: 31
    category: business_constraint
    check: "Publisher.publisher_code, Funder.funder_code, APCFund.fund_code and Grant.grant_number are unique within their entity"
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /publishers, POST /funders, POST /apc-funds, POST /grants"
  - priority: 32
    category: business_fiscal
    check: "requested_cents <= effective determination eligible_request_cents (checked on creation and on resubmission)"
    error_id: ERR_REQUEST_EXCEEDS_ELIGIBLE
    http_status: 422
    applies_to: "POST /fund-requests, POST /fund-requests/{id}/resubmissions"
  - priority: 33
    category: business_fiscal
    check: "the author's remaining annual cap under the ENCUMBRANCE_INCLUSIVE basis is greater than zero at decision time"
    error_id: ERR_AUTHOR_CAP_EXHAUSTED
    http_status: 422
    applies_to: "POST /fund-requests/{id}/decision with decision=APPROVE"
  - priority: 34
    category: business_fiscal
    check: "the waterfall yields approved_cents > 0 across eligible OPEN funds"
    error_id: ERR_NO_FUND_CAPACITY
    http_status: 409
    applies_to: "POST /fund-requests/{id}/decision with decision=APPROVE"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ------------------------------------------------------------- Publishers
  - method: POST
    path: "/publishers"
    description: "register a publisher"
    roles: [AgreementAdmin]
    code: 201
    input: [name, publisher_code, country_code]
    output: Publisher
    side_effects: ["screening_status defaults to UNSCREENED", "active_agreement_count = 0"]
  - method: GET
    path: "/publishers/{id}"
    description: "read a publisher including its screening verdict and author guidance"
    roles: [AgreementAdmin, ScholCommLibrarian, FundManager, RepositoryCurator, CorrespondingAuthor]
    code: 200
    input: []
    output: Publisher
    side_effects: []
  - method: POST
    path: "/publishers/{id}/screening-runs"
    description: "record predatory-screening signals and recompute the verdict and author guidance"
    roles: [ScholCommLibrarian]
    code: 200
    input: [doaj_indexed, cope_member, editorial_board_verified, retraction_rate_per_1000, peer_review_days_median, apc_transparency_score]
    output: Publisher
    side_effects:
      - "runs predatory_screening_score; sets predatory_score, screening_status, author_guidance, last_screened_at"
      - "overwrites the six signal snapshot fields"
      - "increments Publisher.version by 1"
  - method: GET
    path: "/publishers/{id}/journals"
    description: "list the publisher's journals"
    roles: [AgreementAdmin, ScholCommLibrarian, FundManager, RepositoryCurator, CorrespondingAuthor]
    code: 200
    input: ["publisher_id?", "oa_model?", "limit?", "offset?"]
    output: Journal[]
    side_effects: []
  - method: GET
    path: "/publishers/{id}/transformative-agreements"
    description: "list the publisher's agreements"
    roles: [AgreementAdmin, ScholCommLibrarian, FundManager]
    code: 200
    input: ["publisher_id?", "status?", "limit?", "offset?"]
    output: TransformativeAgreement[]
    side_effects: []
  # ---------------------------------------------------------------- Journals
  - method: POST
    path: "/journals"
    description: "register a journal under a publisher"
    roles: [AgreementAdmin]
    code: 201
    input: [publisher_id, issn, title, oa_model, list_apc_cents, "required_embargo_months?"]
    output: Journal
    side_effects: []
  - method: GET
    path: "/journals/{id}"
    description: "read a journal"
    roles: [AgreementAdmin, ScholCommLibrarian, FundManager, RepositoryCurator, CorrespondingAuthor]
    code: 200
    input: []
    output: Journal
    side_effects: []
  - method: GET
    path: "/journals/{id}/coverages"
    description: "list every agreement coverage line touching this journal, across agreements"
    roles: [AgreementAdmin, ScholCommLibrarian, FundManager]
    code: 200
    input: ["journal_id?", "limit?", "offset?"]
    output: AgreementCoverage[]
    side_effects: []
  # ------------------------------------------------ Transformative agreements
  - method: POST
    path: "/transformative-agreements"
    description: "draft a read-and-publish agreement; OCC-guarded on the publisher's version"
    roles: [AgreementAdmin]
    code: 201
    input: [publisher_id, agreement_code, effective_from, effective_until, article_quota, discount_pct, covered_oa_models, expected_publisher_version]
    output: TransformativeAgreement
    side_effects:
      - "rejects a window overlapping another DRAFT/ACTIVE/EXHAUSTED agreement of the same publisher (half-open, adjacency allowed)"
      - "increments Publisher.version by 1"
      - "status = DRAFT; articles_used = 0"
  - method: GET
    path: "/transformative-agreements/{id}"
    description: "read an agreement including quota consumption"
    roles: [AgreementAdmin, ScholCommLibrarian, FundManager]
    code: 200
    input: []
    output: TransformativeAgreement
    side_effects: []
  - method: POST
    path: "/transformative-agreements/{id}/activation"
    description: "activate a drafted agreement"
    roles: [AgreementAdmin]
    code: 200
    input: []
    output: TransformativeAgreement
    side_effects: ["status DRAFT -> ACTIVE; activated_at stamped", "Publisher.active_agreement_count += 1; Publisher.version += 1"]
  - method: POST
    path: "/transformative-agreements/{id}/coverages"
    description: "add a journal coverage line to an agreement"
    roles: [AgreementAdmin]
    code: 201
    input: [journal_id, coverage_type, "capped_amount_cents?", covered_from, covered_until]
    output: AgreementCoverage
    side_effects: ["rejects a closed window within COVERAGE_GAP_DAYS of another coverage line on the same journal"]
  - method: GET
    path: "/transformative-agreements/{id}/coverages"
    description: "list an agreement's coverage lines"
    roles: [AgreementAdmin, ScholCommLibrarian, FundManager]
    code: 200
    input: ["agreement_id?", "limit?", "offset?"]
    output: AgreementCoverage[]
    side_effects: []
  # ----------------------------------------------------------------- Authors
  - method: POST
    path: "/authors"
    description: "register a corresponding author with appointment window and annual cap"
    roles: [AgreementAdmin]
    code: 201
    input: [full_name, email, "orcid?", department_code, affiliation_status, appointment_from, appointment_until, "annual_cap_cents?"]
    output: Author
    side_effects: ["annual_cap_cents defaults to 500000 when omitted"]
  - method: GET
    path: "/authors/{id}"
    description: "read an author including cap utilisation on both bases"
    roles: [AgreementAdmin, ScholCommLibrarian, FundManager, RepositoryCurator, CorrespondingAuthor]
    code: 200
    input: []
    output: Author
    side_effects: []
  - method: GET
    path: "/authors/{id}/grants"
    description: "list grants where this author is PI"
    roles: [AgreementAdmin, ScholCommLibrarian, FundManager, CorrespondingAuthor]
    code: 200
    input: ["pi_author_id?", "status?", "limit?", "offset?"]
    output: Grant[]
    side_effects: []
  # ----------------------------------------------------------------- Funders
  - method: POST
    path: "/funders"
    description: "register a funder and its OA mandate parameters"
    roles: [AgreementAdmin]
    code: 201
    input: [name, funder_code, mandate_type, max_embargo_months, deposit_deadline_days, license_required, apc_allowable]
    output: Funder
    side_effects: []
  - method: GET
    path: "/funders/{id}"
    description: "read a funder"
    roles: [AgreementAdmin, ScholCommLibrarian, FundManager, RepositoryCurator, CorrespondingAuthor]
    code: 200
    input: []
    output: Funder
    side_effects: []
  - method: GET
    path: "/funders/{id}/grants"
    description: "list the funder's grants"
    roles: [AgreementAdmin, ScholCommLibrarian, FundManager]
    code: 200
    input: ["funder_id?", "status?", "limit?", "offset?"]
    output: Grant[]
    side_effects: []
  - method: POST
    path: "/grants"
    description: "record an award"
    roles: [AgreementAdmin]
    code: 201
    input: [funder_id, pi_author_id, grant_number, award_from, award_until, apc_budget_cents]
    output: Grant
    side_effects: ["status = ACTIVE; mandate_status = IN_PROGRESS"]
  - method: GET
    path: "/grants/{id}"
    description: "read a grant including its compound mandate verdict"
    roles: [AgreementAdmin, ScholCommLibrarian, FundManager, CorrespondingAuthor]
    code: 200
    input: []
    output: Grant
    side_effects: []
  # --------------------------------------------------------------- APC funds
  - method: POST
    path: "/apc-funds"
    description: "open an APC fund for a fiscal year with a waterfall priority rank"
    roles: [FundManager]
    code: 201
    input: [fund_code, fiscal_year, period_from, period_to, total_budget_cents, priority_rank, eligible_affiliation_statuses, per_article_cap_cents]
    output: APCFund
    side_effects: ["status = OPEN; committed_cents = spent_cents = 0; available_cents = total_budget_cents"]
  - method: GET
    path: "/apc-funds/{id}"
    description: "read a fund ledger"
    roles: [FundManager, ScholCommLibrarian]
    code: 200
    input: []
    output: APCFund
    side_effects: []
  - method: POST
    path: "/apc-funds/{id}/freeze"
    description: "manually freeze a fund, removing it from the waterfall"
    roles: [FundManager]
    code: 200
    input: [reason]
    output: APCFund
    side_effects: ["status OPEN -> FROZEN; freeze_reason = reason"]
  - method: GET
    path: "/apc-funds/{id}/allocations"
    description: "list allocation lines drawn on this fund"
    roles: [FundManager, ScholCommLibrarian]
    code: 200
    input: ["fund_id?", "status?", "limit?", "offset?"]
    output: FundAllocation[]
    side_effects: []
  # ---------------------------------------------------------------- Articles
  - method: POST
    path: "/articles"
    description: "record an accepted manuscript"
    roles: [CorrespondingAuthor, ScholCommLibrarian]
    code: 201
    input: [journal_id, corresponding_author_id, "grant_id?", manuscript_title, accepted_on, "apc_list_cents?"]
    output: Article
    side_effects:
      - "funding_status = DRAFT"
      - "mandate_compliance_and_embargo sets compliance_status (PENDING_DEPOSIT or EXEMPT), deposit_deadline_on and embargo_until"
      - "Grant.output_count and Grant.mandate_status recomputed when grant_id is supplied"
  - method: GET
    path: "/articles"
    description: "list articles with filters on journal, author, grant and both state dimensions"
    roles: [AgreementAdmin, ScholCommLibrarian, FundManager, RepositoryCurator, CorrespondingAuthor]
    code: 200
    input: ["journal_id?", "corresponding_author_id?", "grant_id?", "funding_status?", "compliance_status?", "limit?", "offset?"]
    output: Article[]
    side_effects: []
  - method: GET
    path: "/articles/{id}"
    description: "read an article including both state dimensions and coverage amounts"
    roles: [AgreementAdmin, ScholCommLibrarian, FundManager, RepositoryCurator, CorrespondingAuthor]
    code: 200
    input: []
    output: Article
    side_effects: []
  - method: POST
    path: "/articles/{id}/eligibility-checks"
    description: "run apc_coverage_determination and append an EligibilityDetermination"
    roles: [ScholCommLibrarian, CorrespondingAuthor]
    code: 201
    input: ["basis?"]
    output: EligibilityDetermination
    side_effects:
      - "appends a determination with sequence_no = article.determination_count + 1"
      - "refreshes article.eligibility_route / covered_amount_cents / author_share_cents / funding_status"
      - "recomputes articles_used on the previously and newly selected agreements; drives the ACTIVE <-> EXHAUSTED cycle and Publisher.active_agreement_count / version"
  - method: POST
    path: "/articles/{id}/publication"
    description: "publish the version of record, mint the DOI and re-determine coverage on the FINAL basis"
    roles: [ScholCommLibrarian]
    code: 200
    input: [publication_date]
    output: Article
    side_effects:
      - "sets publication_date and doi"
      - "appends a FINAL EligibilityDetermination (basis=FINAL)"
      - "recomputes embargo_until"
      - "releases or consumes agreement quota tokens; may drive EXHAUSTED -> ACTIVE and Publisher.version"
  - method: GET
    path: "/eligibility-determinations"
    description: "list determinations, newest sequence last"
    roles: [AgreementAdmin, ScholCommLibrarian, FundManager, CorrespondingAuthor]
    code: 200
    input: ["article_id?", "agreement_id?", "coverage_id?", "basis?", "limit?", "offset?"]
    output: EligibilityDetermination[]
    side_effects: []
  - method: GET
    path: "/eligibility-determinations/{id}"
    description: "read one determination"
    roles: [AgreementAdmin, ScholCommLibrarian, FundManager, CorrespondingAuthor]
    code: 200
    input: []
    output: EligibilityDetermination
    side_effects: []
  # ----------------------------------------------------------- Fund requests
  - method: POST
    path: "/fund-requests"
    description: "request institutional APC funds for an article"
    roles: [CorrespondingAuthor]
    code: 201
    input: [article_id, requested_cents, justification]
    output: FundRequest
    side_effects: ["status = SUBMITTED; revision_round = 0", "Article.funding_status = FUNDING_REQUESTED"]
  - method: GET
    path: "/articles/{id}/fund-requests"
    description: "list the article's fund requests"
    roles: [ScholCommLibrarian, FundManager, CorrespondingAuthor]
    code: 200
    input: ["article_id?", "status?", "limit?", "offset?"]
    output: FundRequest[]
    side_effects: []
  - method: GET
    path: "/fund-requests/{id}"
    description: "read a fund request including approved amount and revision round"
    roles: [ScholCommLibrarian, FundManager, CorrespondingAuthor]
    code: 200
    input: []
    output: FundRequest
    side_effects: []
  - method: POST
    path: "/fund-requests/{id}/start-review"
    description: "take a submitted request into review"
    roles: [ScholCommLibrarian]
    code: 200
    input: []
    output: FundRequest
    side_effects: ["status SUBMITTED -> UNDER_REVIEW; reviewed_by_user_id = X-User-ID"]
  - method: POST
    path: "/fund-requests/{id}/info-requests"
    description: "ask the author for more information"
    roles: [ScholCommLibrarian]
    code: 200
    input: [info_needed]
    output: FundRequest
    side_effects: ["status UNDER_REVIEW -> INFO_REQUESTED; info_needed recorded"]
  - method: POST
    path: "/fund-requests/{id}/resubmissions"
    description: "answer an information request and resubmit, closing one revision cycle"
    roles: [CorrespondingAuthor]
    code: 200
    input: [requested_cents, response_note]
    output: FundRequest
    side_effects: ["status INFO_REQUESTED -> SUBMITTED; revision_round += 1; requested_cents replaced"]
  - method: POST
    path: "/fund-requests/{id}/decision"
    description: "approve (running the waterfall) or reject a reviewed request"
    roles: [FundManager]
    code: 200
    input: [decision, "reason?"]
    output: FundRequest
    side_effects:
      - "decision=APPROVE: apc_fund_waterfall_allocation creates ENCUMBERED FundAllocation rows, refreshes APCFund ledgers, may auto-freeze funds at the threshold, sets Article.funding_status to FUNDED or PARTIALLY_FUNDED, recomputes Author.apc_committed_cents"
      - "decision=REJECT: status -> REJECTED, Article.funding_status = DECLINED, no allocations created"
      - "decided_by_user_id = X-User-ID"
  - method: POST
    path: "/fund-requests/{id}/withdrawal"
    description: "withdraw a request, releasing any encumbrances"
    roles: [CorrespondingAuthor]
    code: 200
    input: [reason]
    output: FundRequest
    side_effects:
      - "status -> WITHDRAWN; Article.funding_status = ELIGIBILITY_CHECKED"
      - "ENCUMBERED allocations -> RELEASED with released_reason REQUEST_WITHDRAWN; APCFund.committed_cents / available_cents restored; Author.apc_committed_cents recomputed"
  - method: GET
    path: "/fund-requests/{id}/allocations"
    description: "list the request's allocation lines in waterfall order"
    roles: [ScholCommLibrarian, FundManager, CorrespondingAuthor]
    code: 200
    input: ["fund_request_id?", "status?", "limit?", "offset?"]
    output: FundAllocation[]
    side_effects: []
  # ------------------------------------------------------ Publisher invoices
  - method: POST
    path: "/publisher-invoices"
    description: "receive a publisher invoice and price the expected amount"
    roles: [ScholCommLibrarian]
    code: 201
    input: [publisher_id, article_id, invoice_number, invoice_amount_cents, currency, claimed_discount_pct, vat_pct, invoice_date]
    output: PublisherInvoice
    side_effects: ["status = RECEIVED", "invoice_expected_amount_validation computes entitled_discount_pct, net_cents, vat_cents, expected_amount_cents, variance_cents, validation_outcome"]
  - method: GET
    path: "/publisher-invoices"
    description: "list invoices with publisher, article and status filters"
    roles: [ScholCommLibrarian, FundManager]
    code: 200
    input: ["publisher_id?", "article_id?", "status?", "limit?", "offset?"]
    output: PublisherInvoice[]
    side_effects: []
  - method: GET
    path: "/publisher-invoices/{id}"
    description: "read an invoice including the validation verdict"
    roles: [ScholCommLibrarian, FundManager]
    code: 200
    input: []
    output: PublisherInvoice
    side_effects: []
  - method: POST
    path: "/publisher-invoices/{id}/validation"
    description: "validate the invoice against the entitled discount, branching to VALIDATED or DISPUTED"
    roles: [ScholCommLibrarian]
    code: 200
    input: []
    output: PublisherInvoice
    side_effects: ["recomputes invoice_expected_amount_validation", "MATCH/WITHIN_TOLERANCE -> VALIDATED; DISCOUNT_SHORTFALL/AMOUNT_VARIANCE -> DISPUTED with dispute_reason"]
  - method: POST
    path: "/publisher-invoices/{id}/payment-approval"
    description: "approve a validated invoice for payment"
    roles: [FundManager]
    code: 200
    input: []
    output: PublisherInvoice
    side_effects: ["status VALIDATED -> APPROVED_FOR_PAYMENT; payment_approved_by_user_id = X-User-ID"]
  - method: POST
    path: "/publisher-invoices/{id}/payment"
    description: "pay an approved invoice; the payer must differ from the approver"
    roles: [FundManager]
    code: 200
    input: [payment_reference]
    output: PublisherInvoice
    side_effects:
      - "status APPROVED_FOR_PAYMENT -> PAID; payment_reference recorded"
      - "cascade: the article's APPROVED FundRequest -> PAID; its ENCUMBERED allocations -> DISBURSED; each APCFund moves the amount from committed_cents to spent_cents; Author.apc_committed_cents and apc_disbursed_cents recomputed"
  # ---------------------------------------------------- Repository deposits
  - method: POST
    path: "/repository-deposits"
    description: "create a manuscript deposit for an article; OCC-guarded on the article's version"
    roles: [CorrespondingAuthor]
    code: 201
    input: [article_id, version_label, file_checksum, license, expected_article_version]
    output: RepositoryDeposit
    side_effects:
      - "version_ordinal = article.latest_deposit_ordinal + 1; status = DRAFT"
      - "increments Article.version by 1 and updates Article.latest_deposit_ordinal"
  - method: GET
    path: "/articles/{id}/deposits"
    description: "list the article's deposit versions"
    roles: [ScholCommLibrarian, RepositoryCurator, CorrespondingAuthor, FundManager]
    code: 200
    input: ["article_id?", "status?", "limit?", "offset?"]
    output: RepositoryDeposit[]
    side_effects: []
  - method: GET
    path: "/repository-deposits/{id}"
    description: "read a deposit including its persistent identifier"
    roles: [ScholCommLibrarian, RepositoryCurator, CorrespondingAuthor, FundManager]
    code: 200
    input: []
    output: RepositoryDeposit
    side_effects: []
  - method: POST
    path: "/repository-deposits/{id}/submission"
    description: "submit a draft deposit for curation"
    roles: [CorrespondingAuthor]
    code: 200
    input: []
    output: RepositoryDeposit
    side_effects: ["status DRAFT -> SUBMITTED; submitted_at stamped"]
  - method: POST
    path: "/repository-deposits/{id}/curation-decision"
    description: "curator branch: ingest the deposit (minting a handle) or return it to the author"
    roles: [RepositoryCurator]
    code: 200
    input: [decision, "curation_note?"]
    output: RepositoryDeposit
    side_effects:
      - "decision=INGEST: status -> INGESTED, persistent_identifier minted, ingested_at stamped; earlier INGESTED deposit of the article -> SUPERSEDED; article compliance_status / embargo_until / latest_deposit_ordinal recomputed; Grant.compliant_output_count and mandate_status recomputed; Author.linked_output_count recomputed"
      - "decision=RETURN: status -> DRAFT, returned_count += 1, curation_note recorded, no compliance side effects"
  # ------------------------------------------------------- Ops and analytics
  - method: POST
    path: "/compliance-sweeps"
    description: "ops-run checkpoint: expire agreements, close grants, flag missed deposit deadlines, release elapsed embargoes — phases run in this fixed order, each phase processing rows in created_at ASC order"
    roles: [ScholCommLibrarian]
    code: 200
    input: []
    output: { swept_at_utc: datetime, agreements_expired_count: integer, grants_closed_count: integer, articles_marked_non_compliant_count: integer, articles_promoted_compliant_count: integer }
    side_effects:
      - "phase 1: TransformativeAgreement with clock date >= effective_until -> EXPIRED; Publisher.active_agreement_count / version updated"
      - "phase 2: Grant with clock date > award_until -> CLOSED"
      - "phase 3: Article with compliance_status == PENDING_DEPOSIT and clock date > deposit_deadline_on -> NON_COMPLIANT; Grant.mandate_status -> BREACHED"
      - "phase 4: Article with compliance_status == EMBARGOED and clock date >= embargo_until -> COMPLIANT; Grant.compliant_output_count / mandate_status recomputed"
  - method: GET
    path: "/analytics/annual-spend"
    description: "annual spend report and negotiation analytics for a fiscal year, on the encumbrance or cash basis"
    roles: [FundManager, ScholCommLibrarian]
    code: 200
    input: [fiscal_year, "basis?", "publisher_id?"]
    output: { fiscal_year: integer, basis: string, total_allocated_cents: integer, total_committed_cents: integer, total_disbursed_cents: integer, paid_invoice_count: integer, avg_paid_net_cents: integer, ta_articles_covered: integer, ta_savings_cents: integer, hybrid_article_count: integer, fully_oa_article_count: integer, top_publisher_code: string, negotiation_leverage_ratio: number }
    side_effects: []
  - method: POST
    path: "/_clock/set_current_utc"
    description: "test-driving endpoint: move the server's logical clock. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time; every date comparison, created_at, updated_at and *_at stamp is taken from this clock."
    roles: [AgreementAdmin, ScholCommLibrarian, FundManager, RepositoryCurator, CorrespondingAuthor]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["no entity is mutated; subsequent requests observe the new logical clock"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the five declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "acting role is not listed in the endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "CorrespondingAuthor acts on an article, fund request or deposit whose corresponding_author_id differs from X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the FundManager paying an invoice is the same X-User-ID that approved it for payment"
  - id: ERR_PUBLISHER_NOT_FOUND
    http: 404
    condition: "publisher id in path or body does not exist"
  - id: ERR_JOURNAL_NOT_FOUND
    http: 404
    condition: "journal id in path or body does not exist"
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "transformative agreement id in path or filter does not exist"
  - id: ERR_COVERAGE_NOT_FOUND
    http: 404
    condition: "agreement coverage id referenced in a filter does not exist"
  - id: ERR_AUTHOR_NOT_FOUND
    http: 404
    condition: "author id in path or body does not exist"
  - id: ERR_FUNDER_NOT_FOUND
    http: 404
    condition: "funder id in path or body does not exist"
  - id: ERR_GRANT_NOT_FOUND
    http: 404
    condition: "grant id in path or body does not exist"
  - id: ERR_FUND_NOT_FOUND
    http: 404
    condition: "APC fund id in path does not exist"
  - id: ERR_ARTICLE_NOT_FOUND
    http: 404
    condition: "article id in path or body does not exist"
  - id: ERR_DETERMINATION_NOT_FOUND
    http: 404
    condition: "eligibility determination id in path does not exist"
  - id: ERR_FUND_REQUEST_NOT_FOUND
    http: 404
    condition: "fund request id in path does not exist"
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "publisher invoice id in path does not exist"
  - id: ERR_DEPOSIT_NOT_FOUND
    http: 404
    condition: "repository deposit id in path does not exist"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, unknown enum member, negative amount, out-of-range fraction, currency other than USD, capped_amount_cents supplied for non-CAPPED coverage or missing for CAPPED, pagination limit outside 1..100, effective_until <= effective_from, covered_until < covered_from"
  - id: ERR_STALE_PARENT_VERSION
    http: 412
    condition: "expected_publisher_version or expected_article_version does not match the parent's current version"
  - id: ERR_AGREEMENT_NOT_ACTIVATABLE
    http: 409
    condition: "activation attempted on an agreement whose status is not DRAFT, or which has no coverage lines"
  - id: ERR_REQUEST_NOT_REVIEWABLE
    http: 409
    condition: "review, info-request, decision or withdrawal attempted from a fund request status that does not permit it"
  - id: ERR_REQUEST_NOT_RESUBMITTABLE
    http: 409
    condition: "resubmission attempted on a fund request whose status is not INFO_REQUESTED"
  - id: ERR_DEPOSIT_INVALID_STATE
    http: 409
    condition: "submission attempted on a non-DRAFT deposit, or curation decision attempted on a non-SUBMITTED deposit"
  - id: ERR_INVOICE_INVALID_STATE
    http: 409
    condition: "validation, payment approval or payment attempted from the wrong invoice status, including any payment path out of DISPUTED"
  - id: ERR_ARTICLE_ALREADY_PUBLISHED
    http: 409
    condition: "publication attempted on an article that already has a publication_date"
  - id: ERR_FUND_FROZEN
    http: 409
    condition: "manual freeze attempted on a fund that is already FROZEN"
  - id: ERR_PUBLISHER_BLOCKED
    http: 422
    condition: "eligibility check or fund request for a journal whose publisher has screening_status == BLOCKED"
  - id: ERR_LICENSE_NOT_PERMITTED
    http: 422
    condition: "deposit license does not satisfy the funder's license_required"
  - id: ERR_ORCID_REQUIRED
    http: 422
    condition: "ingest attempted while the article's corresponding author has no orcid for profile linkage"
  - id: ERR_GRANT_NOT_ACTIVE
    http: 409
    condition: "the referenced grant is CLOSED, or accepted_on falls outside [award_from, award_until] at article creation"
  - id: ERR_ELIGIBILITY_NOT_DETERMINED
    http: 409
    condition: "fund request or invoice created for an article with no effective eligibility determination, or with eligible_request_cents == 0 on a fund request"
  - id: ERR_COVERAGE_JOURNAL_PUBLISHER_MISMATCH
    http: 422
    condition: "coverage line names a journal whose publisher differs from the agreement's publisher"
  - id: ERR_ARTICLE_NOT_FUNDED
    http: 409
    condition: "payment approval attempted while the article's funding_status is not FUNDED, PARTIALLY_FUNDED or SELF_FUNDED"
  - id: ERR_APPOINTMENT_WINDOW_EXPIRED
    http: 422
    condition: "accepted_on lies outside the corresponding author's appointment window"
  - id: ERR_AGREEMENT_WINDOW_OVERLAP
    http: 409
    condition: "new agreement's half-open window intersects another DRAFT/ACTIVE/EXHAUSTED agreement of the same publisher"
  - id: ERR_COVERAGE_WINDOW_CONFLICT
    http: 409
    condition: "new coverage line's closed window is within COVERAGE_GAP_DAYS of another coverage line on the same journal"
  - id: ERR_DEPOSIT_VERSION_CONFLICT
    http: 409
    condition: "another deposit of the same article is still DRAFT or SUBMITTED"
  - id: ERR_DUPLICATE_ISSN
    http: 409
    condition: "journal ISSN already registered"
  - id: ERR_DUPLICATE_AGREEMENT_CODE
    http: 409
    condition: "agreement_code already registered"
  - id: ERR_DUPLICATE_ORCID
    http: 409
    condition: "orcid already registered on another author"
  - id: ERR_DUPLICATE_INVOICE_NUMBER
    http: 409
    condition: "invoice_number already used by the same publisher"
  - id: ERR_DUPLICATE_FUND_PRIORITY
    http: 409
    condition: "another fund in the same fiscal_year already holds this priority_rank"
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "publisher_code, funder_code, fund_code or grant_number already registered"
  - id: ERR_REQUEST_EXCEEDS_ELIGIBLE
    http: 422
    condition: "requested_cents exceeds the effective determination's eligible_request_cents"
  - id: ERR_AUTHOR_CAP_EXHAUSTED
    http: 422
    condition: "the author's remaining annual cap on the ENCUMBRANCE_INCLUSIVE basis is zero at approval time"
  - id: ERR_NO_FUND_CAPACITY
    http: 409
    condition: "no eligible OPEN fund can contribute any cents to the request"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: AgreementAdmin
    description: "negotiator in the scholarly communications office who maintains publishers, journals, agreements, coverage lines, authors, funders and grants"
    identity: opaque
    exclusive_operations:
      - "POST /publishers"
      - "POST /journals"
      - "POST /transformative-agreements"
      - "POST /transformative-agreements/{id}/activation"
      - "POST /transformative-agreements/{id}/coverages"
      - "POST /authors"
      - "POST /funders"
      - "POST /grants"
    shared_operations:
      - "GET reads of publishers, journals, agreements, coverages, authors, funders, grants, articles and determinations"
      - "POST /_clock/set_current_utc"
  - name: ScholCommLibrarian
    description: "librarian who screens publishers, records acceptances and invoices, reviews fund requests and runs the compliance sweep"
    identity: opaque
    exclusive_operations:
      - "POST /publishers/{id}/screening-runs"
      - "POST /articles/{id}/publication"
      - "POST /fund-requests/{id}/start-review"
      - "POST /fund-requests/{id}/info-requests"
      - "POST /publisher-invoices"
      - "POST /publisher-invoices/{id}/validation"
      - "POST /compliance-sweeps"
    shared_operations:
      - "POST /articles (with CorrespondingAuthor)"
      - "POST /articles/{id}/eligibility-checks (with CorrespondingAuthor)"
      - "GET /analytics/annual-spend (with FundManager)"
      - "GET reads across the surface"
      - "POST /_clock/set_current_utc"
  - name: FundManager
    description: "budget officer who opens and freezes APC funds, decides fund requests and moves money to publishers; payment approval and payment must be performed by different FundManager user ids"
    identity: opaque
    exclusive_operations:
      - "POST /apc-funds"
      - "POST /apc-funds/{id}/freeze"
      - "POST /fund-requests/{id}/decision"
      - "POST /publisher-invoices/{id}/payment-approval"
      - "POST /publisher-invoices/{id}/payment"
    shared_operations:
      - "GET /analytics/annual-spend (with ScholCommLibrarian)"
      - "GET reads of funds, allocations, invoices, articles, requests"
      - "POST /_clock/set_current_utc"
  - name: RepositoryCurator
    description: "institutional repository curator who ingests or returns submitted deposits and mints persistent identifiers"
    identity: opaque
    exclusive_operations:
      - "POST /repository-deposits/{id}/curation-decision"
    shared_operations:
      - "GET reads of articles, deposits, publishers, authors"
      - "POST /_clock/set_current_utc"
  - name: CorrespondingAuthor
    description: "corresponding author acting on their own articles: records acceptances, requests funds, deposits manuscripts"
    identity: "entity_backed:Author"
    exclusive_operations:
      - "POST /fund-requests"
      - "POST /fund-requests/{id}/resubmissions"
      - "POST /fund-requests/{id}/withdrawal"
      - "POST /repository-deposits"
      - "POST /repository-deposits/{id}/submission"
    shared_operations:
      - "POST /articles (with ScholCommLibrarian)"
      - "POST /articles/{id}/eligibility-checks (with ScholCommLibrarian)"
      - "GET reads of articles, determinations, requests, allocations, deposits"
      - "POST /_clock/set_current_utc"
