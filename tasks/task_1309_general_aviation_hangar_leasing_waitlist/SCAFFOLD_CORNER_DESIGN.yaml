              payload: { expected_hangar_version: "${h_oc_v}", aeronautical_use_attested: true, sublease_allowed: false, insurance_policy_number: "POL-OC", insurance_insurer_name: "Avemco", insurance_liability_coverage_cents: 100000000, insurance_effective_from: "2026-08-01T00:00:00Z", insurance_effective_to: "2030-01-01T00:00:00Z", aircraft_n_number: "N410OC", aircraft_make_model: "Cessna 172" }
              as: Applicant
              as_user_id: "${app_oc}"
              captures: { err_oc: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION"
            - "HangarOffer.${off_oc}.status == OPEN"
            - "Hangar.${h_oc}.version == ${h_oc_v} + 1"

      - name: occ_stale_lease_version_on_eviction_execute
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[eviction-execute-stale-lease]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Eviction execute carrying expected_lease_version one behind current (a payment bumped Lease.version after the case was filed) returns 412 ERR_STALE_VERSION; case stays FILED and lease stays EVICTION_PENDING."
        test_recipe:
          setup:
            - "Airport ACTIVE; lease DELINQUENT past grace with days_delinquent >= DELINQUENCY_EVICTION_THRESHOLD_DAYS; manager files delinquency eviction (case FILED, lease EVICTION_PENDING)"
            - "Capture lease.version after filing; tenant pays (lease.version + 1, status DELINQUENT retained via partial payment); execute with stale version"
          setup_api_calls:
            - call: "POST /airports"
              payload: { airport_code: "KOCL", name: "OCC Lease Field", escalation_pct: 0.0, escalation_policy: "ANNIVERSARY_SIMPLE", offer_acceptance_window_hours: 72, cure_window_days: 30, late_fee_grace_days: 5 }
              as: AirportManager
              captures: { ap_ol: $.data.id }
            - call: "POST /rate-schedules"
              payload: { airport_id: "${ap_ol}", size_class: "T_HANGAR", monthly_rate_cents: 100000, effective_from: "2026-07-01T00:00:00Z", effective_to: "OPEN"  }
              as: AirportManager
            - call: "POST /hangars"
              payload: { airport_id: "${ap_ol}", hangar_code: "T-240", size_class: "T_HANGAR", door_type: "SLIDING"  }
              as: AirportManager
              captures: { h_ol: $.data.id, h_ol_v: $.data.version }
            - call: "POST /applications"
              payload: { airport_id: "${ap_ol}", applicant_name: "Olly Stale", applicant_contact: "olly@x.com", size_class_requested: "T_HANGAR", aircraft_n_number: "N420OL", is_based_tenant_transfer: false  }
              as: Applicant
              captures: { app_ol: $.data.id }
            - call: "POST /offers"
              payload: { airport_id: "${ap_ol}", hangar_id: "${h_ol}", application_id: "${app_ol}"  }
              as: AirportManager
              captures: { off_ol: $.data.id }
            - call: "POST /offers/${off_ol}/accept"
              payload: { expected_hangar_version: "${h_ol_v}", aeronautical_use_attested: true, sublease_allowed: false, insurance_policy_number: "POL-OL", insurance_insurer_name: "Avemco", insurance_liability_coverage_cents: 100000000, insurance_effective_from: "2026-08-01T00:00:00Z", insurance_effective_to: "2030-01-01T00:00:00Z", aircraft_n_number: "N420OL", aircraft_make_model: "Cessna 172" }
              as: Applicant
              as_user_id: "${app_ol}"
              captures: { lease_ol: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: AirportManager
            - call: "POST /leases/${lease_ol}/eviction-cases"
              payload: { reason: "DELINQUENCY" }
              as: AirportManager
              captures: { case_ol: $.data.id }
            - call: "GET /leases/${lease_ol}"
              as: AirportManager
              captures: { lease_ol_v_stale: $.data.version }
            - call: "POST /leases/${lease_ol}/payments"
              payload: { amount_cents: 1000 }
              as: Tenant
              as_user_id: "${lease_ol}"
          trigger:
            - call: "POST /eviction-cases/${case_ol}/execute"
              payload: { expected_lease_version: "${lease_ol_v_stale}" }
              as: AirportManager
              captures: { err_ol: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION"
            - "EvictionCase.${case_ol}.status == FILED"
            - "Lease.${lease_ol}.status == EVICTION_PENDING"

      - name: clock_default_and_monotonic_sweep_side_effects
        claim_type: scheduled_actions
        grounds:
          - endpoints[POST /_clock/set_current_utc]
          - calculations.offer_window_expiry
        distinguishing_aspect: "Before any set_current_utc call the logical clock is exactly 2026-08-01T00:00:00Z: an offer created immediately has acceptance_deadline 72h later (2026-08-04T00:00:00Z) computed from the default clock, not wall-clock."
        test_recipe:
          setup: ["Empty DB; no set_current_utc call before offer creation"]
          setup_api_calls:
            - call: "POST /airports"
              payload: { airport_code: "KCLK", name: "Clock Field", escalation_pct: 0.0, escalation_policy: "ANNIVERSARY_SIMPLE", offer_acceptance_window_hours: 72, cure_window_days: 30, late_fee_grace_days: 5 }
              as: AirportManager
              captures: { ap_ck: $.data.id }
            - call: "POST /rate-schedules"
              payload: { airport_id: "${ap_ck}", size_class: "T_HANGAR", monthly_rate_cents: 90000, effective_from: "2026-07-01T00:00:00Z", effective_to: "OPEN"  }
              as: AirportManager
            - call: "POST /hangars"
              payload: { airport_id: "${ap_ck}", hangar_code: "T-250", size_class: "T_HANGAR", door_type: "SLIDING"  }
              as: AirportManager
              captures: { h_ck: $.data.id }
            - call: "POST /applications"
              payload: { airport_id: "${ap_ck}", applicant_name: "Cl Ock", applicant_contact: "clock@x.com", size_class_requested: "T_HANGAR", aircraft_n_number: "N430CK", is_based_tenant_transfer: false  }
              as: Applicant
              captures: { app_ck: $.data.id }
          trigger:
            - call: "POST /offers"
              payload: { airport_id: "${ap_ck}", hangar_id: "${h_ck}", application_id: "${app_ck}"  }
              as: AirportManager
              captures: { off_ck_deadline: $.data.acceptance_deadline, off_ck_sent: $.data.offer_sent_at }
          assert:
            - "HangarOffer.offer_sent_at == 2026-08-01T00:00:00.000Z (default logical clock)"
            - "HangarOffer.acceptance_deadline == 2026-08-04T00:00:00.000Z"

  # =====================================================================
  # Section: consistency_model
  # =====================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_lease_graph_visible_in_same_request
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /airports/{airportId}/offers/{offerId}/accept]
        distinguishing_aspect: "Accept response returns the fully-formed Lease (base_monthly_rate_cents, current_monthly_rate_cents, status ACTIVE) and a follow-up GET of the hangar shows posture LEASED with version incremented — all effects visible without delay."
        test_recipe:
          setup: ["Airport ACTIVE; hangar AVAILABLE; application QUEUED; offer OPEN"]
          setup_api_calls:
            - call: "POST /airports"
              payload: { airport_code: "KIMM", name: "Immediate Field", escalation_pct: 0.0, escalation_policy: "ANNIVERSARY_SIMPLE", offer_acceptance_window_hours: 72, cure_window_days: 30, late_fee_grace_days: 5 }
              as: AirportManager
              captures: { ap_im: $.data.id }
            - call: "POST /rate-schedules"
              payload: { airport_id: "${ap_im}", size_class: "T_HANGAR", monthly_rate_cents: 90000, effective_from: "2026-07-01T00:00:00Z", effective_to: "OPEN"  }
              as: AirportManager
            - call: "POST /hangars"
              payload: { airport_id: "${ap_im}", hangar_code: "T-260", size_class: "T_HANGAR", door_type: "SLIDING"  }
              as: AirportManager
              captures: { h_im: $.data.id, h_im_v: $.data.version }
            - call: "POST /applications"
              payload: { airport_id: "${ap_im}", applicant_name: "Im Mediate", applicant_contact: "im@x.com", size_class_requested: "T_HANGAR", aircraft_n_number: "N440IM", is_based_tenant_transfer: false  }
              as: Applicant
              captures: { app_im: $.data.id }
            - call: "POST /offers"
              payload: { airport_id: "${ap_im}", hangar_id: "${h_im}", application_id: "${app_im}"  }
              as: AirportManager
              captures: { off_im: $.data.id }
          trigger:
            - call: "POST /offers/${off_im}/accept"
              payload: { expected_hangar_version: "${h_im_v}", aeronautical_use_attested: true, sublease_allowed: false, insurance_policy_number: "POL-IM", insurance_insurer_name: "Avemco", insurance_liability_coverage_cents: 100000000, insurance_effective_from: "2026-08-01T00:00:00Z", insurance_effective_to: "2030-01-01T00:00:00Z", aircraft_n_number: "N440IM", aircraft_make_model: "Cessna 172" }
              as: Applicant
              as_user_id: "${app_im}"
              captures: { lease_im: $.data.id, lease_im_base: $.data.base_monthly_rate_cents, lease_im_cur: $.data.current_monthly_rate_cents, lease_im_status: $.data.status }
            - call: "GET /hangars/${h_im}"
              as: AirportManager
              captures: { h_im_posture: $.data.posture, h_im_v_after: $.data.version }
          assert:
            - "Lease.base_monthly_rate_cents == 90000 in accept response"
            - "Lease.current_monthly_rate_cents == 90000 in accept response"
            - "Lease.status == ACTIVE in accept response"
            - "Hangar.posture == LEASED immediately after"
            - "Hangar.version == ${h_im_v} + 1"
