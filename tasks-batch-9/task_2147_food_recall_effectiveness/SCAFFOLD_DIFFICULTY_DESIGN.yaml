            - "${overdue_after} == 1"
            - "${flag_after} == ESCALATED"
            - "${cadence_after} == 3"
            - "GET /recalls/${r_id}/status-reports -> the row with period_index == 1 has due_at == 2026-09-08T00:00:00.000Z and status == OVERDUE"
            - "GET /recalls/${r_id}/hazard-evaluations -> HazardEvaluation.${he1_id}.status == SUPERSEDED"
            - "Recall.${r_id}.effectiveness_check_level == A and Recall.${r_id}.sample_tier_scope == 3"

