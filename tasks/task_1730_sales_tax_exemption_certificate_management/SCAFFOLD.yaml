# =============================================================================
# Task 1730: Sales Tax Exemption Certificate Management
# Expert-band scaffold — compliance/audit archetype, posture-driven gating
# =============================================================================

scenario: |
  Sales Tax Exemption Certificate Management (tax exemption certificate desk): certificate
  collection at customer onboarding & order block for missing certificates, validity rules
  by state, form type & expiration tracking, drop-ship & multi-state resale documentation,
  certificate audit sampling & gap remediation, exemption reason mapping to tax engine,
  customer outreach campaign for renewals, audit defense packet assembly

domain_name: sales-tax-exemption-certificates
api_prefix: /tenants

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - scheduled_deferred_actions
    - optimistic_concurrency
    - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: branching_and_cyclic_with_parallel_dimensions
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1.0: Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Tenant
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Tenant legal entity name" }
      - { name: home_state_code, type: string, source: input, description: "Two-letter state code of nexus domicile (e.g. CA)" }
      - { name: audit_clock_day_index, type: integer, source: system, default: 0, description: "Logical day counter advanced by advance_day; default logical clock starts 2026-08-01T00:00:00Z" }
      - { name: audit_posture, type: enum, source: computed, description: "CLEAR | UNDER_SAMPLING | IN_REMEDIATION | DEFENSE_ASSEMBLY" }
      - { name: open_exposure_cents, type: integer, source: computed, description: "Sum of uncovered exempt amount across all non-terminal orders, derived" }

  - name: JurisdictionRule
    parent: Tenant
    common_fields: true
    fields:
      - { name: tenant_id, type: string, source: system, description: "owning tenant" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state code this rule governs" }
      - { name: accepted_form_types, type: array, source: input, description: "List of form types this state accepts: [RESALE, EXEMPT_ORG, AGRICULTURAL, MANUFACTURING, DIRECT_PAY, MULTI_JURISDICTION]" }
      - { name: validity_window_days, type: integer, source: input, description: "Days from anchor date to expiration; 0 means never expires" }
      - { name: anchor_rule, type: enum, source: input, description: "EFFECTIVE_DATE | SIGNED_DATE — which certificate date anchors the validity window (dual-variant driver)" }
      - { name: allows_drop_ship_resale, type: boolean, source: input, description: "Whether this state accepts out-of-state resale certs in drop-ship scenarios" }
      - { name: requires_state_registration_number, type: boolean, source: input, description: "Whether the certificate must carry a state-issued registration number" }
      - { name: blanket_cert_allowed, type: boolean, source: input, description: "Whether a blanket cert can cover multiple ship-to states" }

  - name: Customer
    parent: Tenant
    common_fields: true
    fields:
      - { name: tenant_id, type: string, source: system, description: "owning tenant" }
      - { name: external_ref, type: string, source: input, description: "Tenant-supplied unique reference" }
      - { name: legal_name, type: string, source: input, description: "Customer legal entity name" }
      - { name: primary_ship_to_state, type: string, source: input, description: "Default ship-to state used when order line omits one" }
      - { name: exemption_reason_code, type: string, source: input, description: "default exemption reason for orders when cert silent" }
      - { name: cert_standing, type: enum, source: computed, description: "MISSING | PARTIAL | COMPLIANT — derived from per-state cert coverage; parallel dimension 1" }
      - { name: audit_standing, type: enum, source: computed, description: "NOT_UNDER_AUDIT | SAMPLED | FAILED_SAMPLING | REMEDIATED — parallel dimension 2" }
      - { name: collection_standing, type: enum, source: computed, description: "CURRENT | RENEWAL_DUE | LAPSED — parallel dimension 3, driven by cert expiration distance" }
      - { name: onboarding_completed_at, type: datetime, source: system, description: "ISO8601 timestamp when onboarding finished (null until then)" }
      - { name: blocked_exposure_cents, type: integer, source: computed, description: "Sum of uncovered exempt amount over HELD_FOR_CERT orders; threshold input" }

  - name: ExemptionReason
    parent: Tenant
    common_fields: true
    fields:
      - { name: tenant_id, type: string, source: system, description: "owning tenant" }
      - { name: code, type: string, source: input, description: "Tenant-unique short code (e.g. RESALE, GOVT, AGR)" }
      - { name: description, type: string, source: input, description: "Human-readable reason" }
      - { name: tax_engine_code, type: string, source: input, description: "Code sent to downstream tax engine (e.g. Avalara 'R', 'G', 'A')" }
      - { name: requires_certificate, type: boolean, source: input, description: "If true, orders claiming this reason MUST be backed by a valid cert; if false, reason alone suffices" }
      - { name: allowed_form_types, type: array, source: input, description: "Subset of form types that may substantiate this reason" }

  - name: ExemptionCertificate
    parent: Customer
    common_fields: true
    fields:
      - { name: tenant_id, type: string, source: system, description: "owning tenant" }
      - { name: customer_id, type: string, source: system, description: "certificate holder" }
      - { name: ship_to_state, type: string, source: input, description: "State this certificate exempts shipments into" }
      - { name: form_type, type: enum, source: input, description: "RESALE | EXEMPT_ORG | AGRICULTURAL | MANUFACTURING | DIRECT_PAY | MULTI_JURISDICTION" }
      - { name: exemption_reason_code, type: string, source: input, description: "references ExemptionReason.code" }
      - { name: state_registration_number, type: string, source: input, description: "State-issued registration number; required if JurisdictionRule.requires_state_registration_number" }
      - { name: signed_date, type: string, source: input, description: "ISO date the buyer signed the cert" }
      - { name: effective_date, type: string, source: input, description: "ISO date the cert takes effect" }
      - { name: expiration_date, type: string, source: computed, description: "anchor_date + validity_window_days; null when window=0" }
      - { name: current_version_id, type: string, source: system, description: "pointer to live version" }
      - { name: superseded_by_certificate_id, type: string, source: system, description: "set when replaced by renewal (self-referential)" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | UNDER_REVIEW | APPROVED | REJECTED | SUSPENDED | EXPIRED | SUPERSEDED | REVOKED" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of the reviewer; segregation-of-duties check uses this" }
      - { name: review_decision_at, type: datetime, source: system, description: "ISO8601 timestamp of last review decision" }

  - name: CertificateVersion
    parent: ExemptionCertificate
    common_fields: true
    fields:
      - { name: certificate_id, type: string, source: system, description: "references ExemptionCertificate.id" }
      - { name: tenant_id, type: string, source: system, description: "references Tenant.id" }
      - { name: version_index, type: integer, source: system, description: "1-based monotonic per certificate" }
      - { name: file_uri, type: string, source: input, description: "URI of the uploaded cert document" }
      - { name: form_type, type: enum, source: input, description: "Same enum as ExemptionCertificate.form_type; per-version so corrections are tracked" }
      - { name: signed_date, type: string, source: input, description: "Per-version signed date" }
      - { name: effective_date, type: string, source: input, description: "Per-version effective date" }
      - { name: uploaded_by_user_id, type: string, source: system, description: "X-User-ID of uploader; SoD: uploader != reviewer" }

  - name: Order
    parent: Customer
    common_fields: true
    fields:
      - { name: tenant_id, type: string, source: system, description: "references Tenant.id" }
      - { name: customer_id, type: string, source: system, description: "references Customer.id" }
      - { name: order_ref, type: string, source: input, description: "Tenant-unique order reference" }
      - { name: ship_to_state, type: string, source: input, description: "Destination state driving cert lookup" }
      - { name: exemption_reason_code, type: string, source: input, description: "references ExemptionReason.code claimed for this order" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of line extended_cents; computed from OrderLine" }
      - { name: exempt_amount_cents, type: integer, source: computed, description: "Portion claimed exempt — depends on variant calc (full vs line-level)" }
      - { name: covered_amount_cents, type: integer, source: computed, description: "Portion of exempt_amount_cents backed by valid cert" }
      - { name: uncovered_amount_cents, type: integer, source: computed, description: "exempt_amount_cents - covered_amount_cents; exposure feeding block threshold" }
      - { name: applied_tax_engine_code, type: string, source: computed, description: "ExemptionReason.tax_engine_code sent downstream; null if no valid reason resolved" }
      - { name: drop_ship_link_id, type: string, source: input, description: "present for drop-ship orders" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | HELD_FOR_CERT | READY_TO_SHIP | SHIPPED | INVOICED | CANCELLED" }

  - name: OrderLine
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "references Order.id" }
      - { name: tenant_id, type: string, source: system, description: "references Tenant.id" }
      - { name: sku, type: string, source: input, description: "SKU" }
      - { name: quantity, type: integer, source: input, description: "Units ordered" }
      - { name: unit_price_cents, type: integer, source: input, description: "Per-unit price" }
      - { name: extended_cents, type: integer, source: computed, description: "quantity * unit_price_cents" }
      - { name: is_exempt_claimed, type: boolean, source: input, description: "Line-level exemption claim toggle; false line is always taxable" }

  - name: DropShipLink
    parent: Tenant
    common_fields: true
    fields:
      - { name: tenant_id, type: string, source: system, description: "references Tenant.id" }
      - { name: retailer_customer_id, type: string, source: input, description: "retailer who sold to end consumer" }
      - { name: ship_to_state, type: string, source: input, description: "End-consumer state" }
      - { name: resale_certificate_id, type: string, source: input, description: "the resale cert the retailer provided to the supplier" }
      - { name: is_out_of_state_resale_accepted, type: boolean, source: computed, description: "Derived from JurisdictionRule.allows_drop_ship_resale for ship_to_state" }
      - { name: status, type: enum, source: system, description: "PENDING_VERIFICATION | VERIFIED | REJECTED" }

  - name: AuditCampaign
    parent: Tenant
    common_fields: true
    fields:
      - { name: tenant_id, type: string, source: system, description: "references Tenant.id" }
      - { name: name, type: string, source: input, description: "Campaign display name" }
      - { name: population_state_filter, type: array, source: input, description: "Optional list of state codes; empty means all states" }
      - { name: sampling_method, type: enum, source: input, description: "STATISTICAL | FIXED_FLOOR — dual-variant driver for sample-size calculation" }
      - { name: target_confidence_pct, type: integer, source: input, description: "Statistical only: 90, 95, or 99" }
      - { name: floor_sample_size, type: integer, source: input, description: "Fixed-floor only: minimum N samples" }
      - { name: planned_sample_size, type: integer, source: computed, description: "Result of audit_sample_size calculation" }
      - { name: opened_by_user_id, type: string, source: system, description: "Auditor user id who opened campaign" }
      - { name: closed_by_user_id, type: string, source: system, description: "Auditor user id who closed campaign; SoD: cannot equal opened_by_user_id" }
      - { name: status, type: enum, source: system, description: "DRAFT | SAMPLING | FIELDWORK | REMEDIATION | DEFENSE_ASSEMBLY | CLOSED | CANCELLED" }

  - name: AuditSample
    parent: AuditCampaign
    common_fields: true
    fields:
      - { name: tenant_id, type: string, source: system, description: "references Tenant.id" }
      - { name: campaign_id, type: string, source: system, description: "references AuditCampaign.id" }
      - { name: certificate_id, type: string, source: system, description: "references ExemptionCertificate.id" }
      - { name: customer_id, type: string, source: system, description: "references Customer.id denormalized for selection" }
      - { name: sampled_at_day_index, type: integer, source: system, description: "Tenant.audit_clock_day_index at sampling time" }
      - { name: doc_due_day_index, type: integer, source: computed, description: "sampled_at_day_index + DOC_RESPONSE_WINDOW_DAYS (10)" }
      - { name: outcome, type: enum, source: system, description: "PENDING | DOC_REQUESTED | DOC_RECEIVED | PASSED | FAILED | WAIVED | EXPIRED_NO_RESPONSE" }
      - { name: failure_reason, type: string, source: system, description: "Free-text reason on FAILED" }

  - name: RemediationAction
    parent: AuditSample
    common_fields: true
    fields:
      - { name: tenant_id, type: string, source: system, description: "references Tenant.id" }
      - { name: sample_id, type: string, source: system, description: "references AuditSample.id" }
      - { name: customer_id, type: string, source: system, description: "references Customer.id (denormalized via sample)" }
      - { name: action_type, type: enum, source: input, description: "COLLECT_NEW_CERT | OBTAIN_LETTER | ASSESS_TAX | WAIVE_SAMPLE" }
      - { name: assigned_to_user_id, type: string, source: input, description: "ComplianceOfficer user id who owns the action" }
      - { name: resolved_by_user_id, type: string, source: system, description: "User id who marked resolved; SoD vs assigned_to_user_id for ASSESS_TAX only" }
      - { name: assessment_amount_cents, type: integer, source: input, description: "For ASSESS_TAX: dollars assessed" }
      - { name: status, type: enum, source: system, description: "OPEN | IN_PROGRESS | RESOLVED | ESCALATED" }

  - name: OutreachCampaign
    parent: Tenant
    common_fields: true
    fields:
      - { name: tenant_id, type: string, source: system, description: "references Tenant.id" }
      - { name: name, type: string, source: input, description: "Campaign name" }
      - { name: target_state_filter, type: array, source: input, description: "Optional state filter; empty = all states" }
      - { name: days_before_expiration, type: integer, source: input, description: "Send notices to certs expiring within this many days" }
      - { name: scheduled_send_day_index, type: integer, source: input, description: "audit_clock_day_index at which the sends execute; must be >= current day index" }
      - { name: sent_count, type: integer, source: computed, description: "Number of notices emitted when SEND executes" }
      - { name: status, type: enum, source: system, description: "DRAFT | SCHEDULED | SENDING | DONE | CANCELLED" }

  - name: OutreachNotice
    parent: OutreachCampaign
    common_fields: false
    fields:
      - { name: campaign_id, type: string, source: system, description: "references OutreachCampaign.id" }
      - { name: tenant_id, type: string, source: system, description: "references Tenant.id" }
      - { name: customer_id, type: string, source: system, description: "references Customer.id" }
      - { name: certificate_id, type: string, source: system, description: "references ExemptionCertificate.id" }
      - { name: scheduled_send_day_index, type: integer, source: system, description: "Copied from campaign at SENDING time" }
      - { name: sent_at_day_index, type: integer, source: system, description: "audit_clock_day_index when notice was emitted" }

  - name: AuditDefensePacket
    parent: AuditCampaign
    common_fields: true
    fields:
      - { name: tenant_id, type: string, source: system, description: "references Tenant.id" }
      - { name: campaign_id, type: string, source: system, description: "references AuditCampaign.id" }
      - { name: included_certificate_ids, type: array, source: system, description: "Computed: certificates referenced by PASSED/WAIVED samples" }
      - { name: missing_certificate_ids, type: array, source: system, description: "Computed: certificates referenced by FAILED samples lacking remediation" }
      - { name: completeness_score_pct, type: integer, source: computed, description: "100 * len(included) / max(1, len(included) + len(missing)) — integer arithmetic, round-half-up" }
      - { name: assembled_by_user_id, type: string, source: system, description: "Auditor who assembled" }
      - { name: status, type: enum, source: system, description: "DRAFT | ASSEMBLED | DELIVERED" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: Customer
    initial_state: "cert_standing=MISSING, audit_standing=NOT_UNDER_AUDIT, collection_standing=CURRENT"
    terminal_states: []
    note: "Three parallel state dimensions; transitions on one dimension do not preclude others."
    transitions:
      - from: "cert_standing=MISSING"
        to: "cert_standing=PARTIAL"
        trigger: "system: first ExemptionCertificate for this customer transitions to APPROVED"
        actor: system
        preconditions: ["customer has at least one APPROVED certificate", "at least one state the customer ships into lacks APPROVED cert"]
        side_effects: ["recompute blocked_exposure_cents", "recompute tenant.open_exposure_cents"]
      - from: "cert_standing=PARTIAL"
        to: "cert_standing=COMPLIANT"
        trigger: "system: every state in customer's shipping footprint has at least one APPROVED, unexpired cert"
        actor: system
        preconditions: ["for every state s in customer shipping footprint, exists cert with ship_to_state=s and status=APPROVED"]
        side_effects: ["recompute blocked_exposure_cents"]
      - from: "cert_standing=PARTIAL"
        to: "cert_standing=MISSING"
        trigger: "system: last APPROVED cert transitions to EXPIRED/REVOKED/SUPERSEDED"
        actor: system
        preconditions: ["customer has zero APPROVED certs"]
        side_effects: ["recompute blocked_exposure_cents"]
      - from: "cert_standing=COMPLIANT"
        to: "cert_standing=PARTIAL"
        trigger: "system: any previously-covered state loses cert coverage (revocation, expiration, supersede)"
        actor: system
        preconditions: ["some previously-covered state now lacks APPROVED cert"]
        side_effects: ["recompute blocked_exposure_cents"]
      - from: "audit_standing=NOT_UNDER_AUDIT"
        to: "audit_standing=SAMPLED"
        trigger: "system: an AuditSample row for this customer is created during campaign sampling"
        actor: system
        preconditions: []
        side_effects: []
      - from: "audit_standing=SAMPLED"
        to: "audit_standing=FAILED_SAMPLING"
        trigger: "system: any AuditSample for this customer transitions to FAILED or EXPIRED_NO_RESPONSE"
        actor: system
        preconditions: []
        side_effects: ["tenant.audit_posture recomputed"]
      - from: "audit_standing=FAILED_SAMPLING"
        to: "audit_standing=REMEDIATED"
        trigger: "system: every FAILED AuditSample for this customer has at least one RESOLVED RemediationAction"
        actor: system
        preconditions: ["all FAILED samples have a RESOLVED remediation"]
        side_effects: ["tenant.audit_posture recomputed"]
      - from: "collection_standing=CURRENT"
        to: "collection_standing=RENEWAL_DUE"
        trigger: "system: any APPROVED cert for this customer has expiration_date - current_day <= RENEWAL_WINDOW_DAYS (45)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "collection_standing=RENEWAL_DUE"
        to: "collection_standing=LAPSED"
        trigger: "system: any previously-APPROVED cert for this customer transitions to EXPIRED without a superseding APPROVED cert in place"
        actor: system
        preconditions: []
        side_effects: []
      - from: "collection_standing=RENEWAL_DUE"
        to: "collection_standing=CURRENT"
        trigger: "system: renewal cert APPROVED before old cert's expiration_date"
        actor: system
        preconditions: []
        side_effects: []
      - from: "collection_standing=LAPSED"
        to: "collection_standing=CURRENT"
        trigger: "system: new APPROVED cert restores coverage for the lapsed state"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ExemptionCertificate
    initial_state: DRAFT
    terminal_states: [REVOKED, SUPERSEDED]
    note: "Branching + cyclic: APPROVED<->SUSPENDED cycle; SUBMITTED->UNDER_REVIEW->{APPROVED,REJECTED}; REJECTED->DRAFT re-upload loop."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /tenants/{tid}/certificates/{id}/submit"
        actor: ComplianceOfficer
        preconditions:
          - "current_version_id is set (at least one CertificateVersion uploaded)"
          - "form_type is in JurisdictionRule.accepted_form_types for ship_to_state (ERR_FORM_NOT_ACCEPTED_IN_STATE)"
          - "if JurisdictionRule.requires_state_registration_number then state_registration_number is non-empty (ERR_MISSING_STATE_REGISTRATION)"
        side_effects: ["tenant.updated_at bumped"]
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /tenants/{tid}/certificates/{id}/begin_review"
        actor: ComplianceOfficer
        preconditions:
          - "actor's X-User-ID != CertificateVersion.uploaded_by_user_id of current_version (segregation of duties) (ERR_SOD_REVIEWER_IS_UPLOADER)"
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /tenants/{tid}/certificates/{id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "actor X-User-ID != uploader of current_version"
          - "current_version's form_type matches certificate's declared form_type"
          - "current_version.effective_date <= today (today = tenant default logical clock 2026-08-01T00:00:00Z + audit_clock_day_index days)"
        side_effects:
          - "reviewed_by_user_id = actor, review_decision_at = now"
          - "compute expiration_date per cert_validity_window calculation"
          - "recompute customer cert_standing / collection_standing"
          - "for every HELD_FOR_CERT order of this customer where ship_to_state matches: recompute covered_amount_cents; if uncovered_amount_cents becomes 0, transition order HELD_FOR_CERT -> READY_TO_SHIP"
          - "recompute tenant.open_exposure_cents"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /tenants/{tid}/certificates/{id}/reject"
        actor: ComplianceOfficer
        preconditions: ["actor X-User-ID != uploader of current_version"]
        side_effects: ["reviewed_by_user_id = actor"]
      - from: REJECTED
        to: DRAFT
        trigger: "POST /tenants/{tid}/certificates/{id}/versions (new version upload re-opens DRAFT)"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["current_version_id updated to the new version"]
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /tenants/{tid}/certificates/{id}/suspend"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "customer cert_standing recomputed (may drop COMPLIANT->PARTIAL)"
          - "orders of this customer in READY_TO_SHIP that depended on this cert: covered_amount_cents recomputed; if uncovered>0, transition READY_TO_SHIP -> HELD_FOR_CERT"
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /tenants/{tid}/certificates/{id}/reinstate"
        actor: ComplianceOfficer
        preconditions: ["today <= expiration_date (else ERR_CERT_EXPIRED)"]
        side_effects: ["symmetric with APPROVED side-effects"]
      - from: APPROVED
        to: EXPIRED
        trigger: "system: when tenant.audit_clock_day_index advances past expiration_date"
        actor: system
        preconditions: ["current_day > expiration_date"]
        side_effects:
          - "customer collection_standing -> LAPSED (if not superseded)"
          - "customer cert_standing recomputed"
          - "dependent orders READY_TO_SHIP -> HELD_FOR_CERT when uncovered>0"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "POST /tenants/{tid}/certificates (creation of renewal cert with supersedes_certificate_id = this)"
        actor: ComplianceOfficer
        preconditions: ["renewal cert's ship_to_state == this ship_to_state", "renewal cert transitions to APPROVED in same flow"]
        side_effects: ["superseded_by_certificate_id = new cert id"]
      - from: APPROVED
        to: REVOKED
        trigger: "POST /tenants/{tid}/certificates/{id}/revoke"
        actor: ComplianceOfficer
        preconditions: ["no AuditSample references this cert in a non-terminal outcome"]
        side_effects: ["customer cert_standing recomputed", "dependent orders recompute"]

  - entity: Order
    initial_state: DRAFT
    terminal_states: [CANCELLED, INVOICED]
    note: "Branching with cross-entity gating: HELD_FOR_CERT depends on customer cert coverage."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /tenants/{tid}/orders/{id}/submit"
        actor: OrderClerk
        preconditions:
          - "at least one OrderLine (ERR_ORDER_EMPTY)"
          - "customer.onboarding_completed_at is not null (ERR_ONBOARDING_INCOMPLETE)"
          - "ExemptionReason.requires_certificate == true OR exempt_amount_cents == 0"
        side_effects: ["compute subtotal_cents, exempt_amount_cents, covered_amount_cents via exemption_coverage_amount calc"]
      - from: SUBMITTED
        to: HELD_FOR_CERT
        trigger: "system: covered_amount_cents < exempt_amount_cents at submit time"
        actor: system
        preconditions: []
        side_effects: ["customer.blocked_exposure_cents += uncovered_amount_cents", "tenant.open_exposure_cents += uncovered_amount_cents"]
      - from: SUBMITTED
        to: READY_TO_SHIP
        trigger: "system: covered_amount_cents == exempt_amount_cents at submit time"
        actor: system
        preconditions: []
        side_effects: []
      - from: HELD_FOR_CERT
        to: READY_TO_SHIP
        trigger: "system: a certificate approval raises covered_amount_cents to exempt_amount_cents"
        actor: system
        preconditions: []
        side_effects: ["customer.blocked_exposure_cents -= uncovered_amount_cents (now zero)", "tenant.open_exposure_cents -= uncovered_amount_cents"]
      - from: READY_TO_SHIP
        to: HELD_FOR_CERT
        trigger: "system: cert suspension/expiration/revocation lowers covered_amount_cents below exempt_amount_cents"
        actor: system
        preconditions: []
        side_effects: ["customer.blocked_exposure_cents += uncovered_amount_cents", "tenant.open_exposure_cents += uncovered_amount_cents"]
      - from: READY_TO_SHIP
        to: SHIPPED
        trigger: "POST /tenants/{tid}/orders/{id}/ship"
        actor: FulfillmentClerk
        preconditions:
          - "covered_amount_cents == exempt_amount_cents"
          - "customer.blocked_exposure_cents < BLOCK_THRESHOLD_CENTS (100_000_00 = $100k) — rate-threshold check"
        side_effects: []
      - from: SHIPPED
        to: INVOICED
        trigger: "POST /tenants/{tid}/orders/{id}/invoice"
        actor: BillingClerk
        preconditions: []
        side_effects: ["applied_tax_engine_code resolved from ExemptionReason.tax_engine_code"]
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /tenants/{tid}/orders/{id}/cancel"
        actor: OrderClerk
        preconditions: []
        side_effects: []
      - from: HELD_FOR_CERT
        to: CANCELLED
        trigger: "POST /tenants/{tid}/orders/{id}/cancel"
        actor: OrderClerk
        preconditions: []
        side_effects: ["release blocked_exposure_cents", "release open_exposure_cents"]

  - entity: AuditCampaign
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    note: "Branching with revert: SAMPLING->FIELDWORK->REMEDIATION->DEFENSE_ASSEMBLY->CLOSED; REMEDIATION->FIELDWORK loop on re-sample."
    transitions:
      - from: DRAFT
        to: SAMPLING
        trigger: "POST /tenants/{tid}/audit_campaigns/{id}/open"
        actor: Auditor
        preconditions: ["sampling_method in {STATISTICAL, FIXED_FLOOR}", "if STATISTICAL: target_confidence_pct in {90,95,99}", "if FIXED_FLOOR: floor_sample_size >= 1"]
        side_effects: ["opened_by_user_id = actor", "tenant.audit_posture -> UNDER_SAMPLING", "compute planned_sample_size via audit_sample_size calc"]
      - from: SAMPLING
        to: FIELDWORK
        trigger: "POST /tenants/{tid}/audit_campaigns/{id}/sample"
        actor: Auditor
        preconditions: []
        side_effects: ["system creates planned_sample_size AuditSample rows (PENDING)", "for each created sample: customer.audit_standing -> SAMPLED"]
      - from: FIELDWORK
        to: REMEDIATION
        trigger: "system: all AuditSamples reach outcome in {PASSED, FAILED, WAIVED, EXPIRED_NO_RESPONSE}"
        actor: system
        preconditions: []
        side_effects: ["tenant.audit_posture -> IN_REMEDIATION"]
      - from: REMEDIATION
        to: FIELDWORK
        trigger: "POST /tenants/{tid}/audit_campaigns/{id}/resample"
        actor: Auditor
        preconditions: ["at least one RemediationAction is RESOLVED"]
        side_effects: ["system creates new AuditSample rows for previously-failed certificates"]
      - from: REMEDIATION
        to: DEFENSE_ASSEMBLY
        trigger: "POST /tenants/{tid}/audit_campaigns/{id}/begin_defense_assembly"
        actor: Auditor
        preconditions: ["every FAILED sample has at least one RemediationAction in RESOLVED status (ERR_UNREMEDIATED_FAILURES)"]
        side_effects: ["tenant.audit_posture -> DEFENSE_ASSEMBLY", "create AuditDefensePacket in DRAFT"]
      - from: DEFENSE_ASSEMBLY
        to: CLOSED
        trigger: "POST /tenants/{tid}/audit_campaigns/{id}/close"
        actor: Auditor
        preconditions:
          - "AuditDefensePacket.status == DELIVERED"
          - "actor X-User-ID != opened_by_user_id (segregation of duties) (ERR_SOD_CLOSER_IS_OPENER)"
        side_effects: ["closed_by_user_id = actor", "tenant.audit_posture -> CLEAR"]
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /tenants/{tid}/audit_campaigns/{id}/cancel"
        actor: Auditor
        preconditions: []
        side_effects: []
      - from: SAMPLING
        to: CANCELLED
        trigger: "POST /tenants/{tid}/audit_campaigns/{id}/cancel"
        actor: Auditor
        preconditions: []
        side_effects: ["tenant.audit_posture -> CLEAR"]

  - entity: AuditSample
    initial_state: PENDING
    terminal_states: [PASSED, FAILED, WAIVED, EXPIRED_NO_RESPONSE]
    note: "Cyclic DOC_REQUESTED->DOC_RECEIVED->DOC_REQUESTED allowed on rework."
    transitions:
      - from: PENDING
        to: DOC_REQUESTED
        trigger: "POST /tenants/{tid}/audit_samples/{id}/request_docs"
        actor: Auditor
        preconditions: []
        side_effects: ["doc_due_day_index = current_day + 10"]
      - from: DOC_REQUESTED
        to: DOC_RECEIVED
        trigger: "POST /tenants/{tid}/audit_samples/{id}/receive_docs"
        actor: ComplianceOfficer
        preconditions: ["current_day <= doc_due_day_index (else transition is to EXPIRED_NO_RESPONSE)"]
        side_effects: []
      - from: DOC_REQUESTED
        to: EXPIRED_NO_RESPONSE
        trigger: "system: when current_day > doc_due_day_index during advance_day"
        actor: system
        preconditions: []
        side_effects: ["customer.audit_standing -> FAILED_SAMPLING"]
      - from: DOC_RECEIVED
        to: DOC_REQUESTED
        trigger: "POST /tenants/{tid}/audit_samples/{id}/request_rework"
        actor: Auditor
        preconditions: []
        side_effects: ["doc_due_day_index = current_day + 10 (re-extended)"]
      - from: DOC_RECEIVED
        to: PASSED
        trigger: "POST /tenants/{tid}/audit_samples/{id}/pass"
        actor: Auditor
        preconditions: []
        side_effects: []
      - from: DOC_RECEIVED
        to: FAILED
        trigger: "POST /tenants/{tid}/audit_samples/{id}/fail"
        actor: Auditor
        preconditions: ["failure_reason provided"]
        side_effects: ["customer.audit_standing -> FAILED_SAMPLING", "auto-create RemediationAction(OPEN, action_type=COLLECT_NEW_CERT)"]
      - from: DOC_REQUESTED
        to: WAIVED
        trigger: "POST /tenants/{tid}/audit_samples/{id}/waive"
        actor: Auditor
        preconditions: []
        side_effects: []
      - from: DOC_RECEIVED
        to: WAIVED
        trigger: "POST /tenants/{tid}/audit_samples/{id}/waive"
        actor: Auditor
        preconditions: []
        side_effects: []

  - entity: RemediationAction
    initial_state: OPEN
    terminal_states: [RESOLVED]
    note: "OPEN->IN_PROGRESS->RESOLVED with ESCALATED branch and ESCALATED->IN_PROGRESS revert — cyclic."
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: "POST /tenants/{tid}/remediation_actions/{id}/begin"
        actor: ComplianceOfficer
        preconditions: ["actor X-User-ID == assigned_to_user_id"]
        side_effects: []
      - from: IN_PROGRESS
        to: ESCALATED
        trigger: "POST /tenants/{tid}/remediation_actions/{id}/escalate"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: ESCALATED
        to: IN_PROGRESS
        trigger: "POST /tenants/{tid}/remediation_actions/{id}/begin"
        actor: ComplianceOfficer
        preconditions: ["actor X-User-ID == assigned_to_user_id"]
        side_effects: []
      - from: IN_PROGRESS
        to: RESOLVED
        trigger: "POST /tenants/{tid}/remediation_actions/{id}/resolve"
        actor: ComplianceOfficer
        preconditions:
          - "if action_type == ASSESS_TAX: assessment_amount_cents > 0 AND actor != assigned_to_user_id (SoD: assessor != resolver) (ERR_SOD_ASSESSOR_IS_RESOLVER)"
          - "if action_type == COLLECT_NEW_CERT: a new ExemptionCertificate for this customer+state reached APPROVED"
        side_effects:
          - "resolved_by_user_id = actor"
          - "if all FAILED samples for this customer have RESOLVED actions: customer.audit_standing -> REMEDIATED"

  - entity: OutreachCampaign
    initial_state: DRAFT
    terminal_states: [DONE, CANCELLED]
    note: "Scheduled/deferred actions: SCHEDULED -> SENDING executes when audit_clock_day_index reaches scheduled_send_day_index."
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /tenants/{tid}/outreach_campaigns/{id}/schedule"
        actor: ComplianceOfficer
        preconditions:
          - "scheduled_send_day_index >= current audit_clock_day_index (ERR_SCHEDULE_IN_PAST)"
          - "days_before_expiration >= 1"
        side_effects: []
      - from: SCHEDULED
        to: SENDING
        trigger: "system: when advance_day brings audit_clock_day_index to scheduled_send_day_index"
        actor: system
        preconditions: []
        side_effects:
          - "select candidate certs: status=APPROVED, expiration_date not null, (expiration_date - current_day) <= days_before_expiration, ship_to_state IN target_state_filter (or any if filter empty)"
          - "order candidates by customer.created_at ASC, then certificate.created_at ASC (deterministic; no id-based tie-break)"
          - "for each candidate: create OutreachNotice, sent_count += 1"
          - "customer.collection_standing -> RENEWAL_DUE for each notified customer"
      - from: SENDING
        to: DONE
        trigger: "system: after all notices for this campaign are created (same advance_day call)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /tenants/{tid}/outreach_campaigns/{id}/cancel"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /tenants/{tid}/outreach_campaigns/{id}/cancel"
        actor: ComplianceOfficer
        preconditions: ["current_day < scheduled_send_day_index"]
        side_effects: []

  - entity: AuditDefensePacket
    initial_state: DRAFT
    terminal_states: [DELIVERED]
    transitions:
      - from: DRAFT
        to: ASSEMBLED
        trigger: "POST /tenants/{tid}/audit_defense_packets/{id}/assemble"
        actor: Auditor
        preconditions: ["campaign.status == DEFENSE_ASSEMBLY"]
        side_effects:
          - "compute included_certificate_ids = certs of PASSED/WAIVED samples, sorted by certificate.created_at ASC"
          - "compute missing_certificate_ids = certs of FAILED samples lacking RESOLVED remediation"
          - "compute completeness_score_pct via defense_packet_completeness calculation"
          - "assembled_by_user_id = actor"
      - from: ASSEMBLED
        to: DELIVERED
        trigger: "POST /tenants/{tid}/audit_defense_packets/{id}/deliver"
        actor: Auditor
        preconditions: ["completeness_score_pct == 100 (ERR_PACKET_INCOMPLETE)"]
        side_effects: []

  - entity: DropShipLink
    initial_state: PENDING_VERIFICATION
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: PENDING_VERIFICATION
        to: VERIFIED
        trigger: "POST /tenants/{tid}/drop_ship_links/{id}/verify"
        actor: ComplianceOfficer
        preconditions:
          - "resale_certificate_id points to an APPROVED cert (ERR_RESALE_CERT_NOT_APPROVED)"
          - "if JurisdictionRule(ship_to_state).allows_drop_ship_resale == false: the resale cert's ship_to_state MUST equal link's ship_to_state (ERR_DROP_SHIP_STATE_MISMATCH)"
          - "if allows_drop_ship_resale == true: out-of-state resale cert accepted"
        side_effects: ["is_out_of_state_resale_accepted computed"]
      - from: PENDING_VERIFICATION
        to: REJECTED
        trigger: "POST /tenants/{tid}/drop_ship_links/{id}/reject"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []

# =============================================================================
# 1.2.1: Concurrency Rules (OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: cert-approve-stale-customer
    parent_entity: Customer
    write_endpoint: "POST /tenants/{tid}/certificates/{id}/approve"
    occ_field: "expected_customer_version"
    description: |
      Approving a certificate against a Customer whose version has advanced since
      the client last observed it is rejected. This captures the case where
      another writer has just approved a different cert for the same customer
      (which legitimately updates cert_standing) and the current writer's view
      of the customer's standing is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: remediation-resolve-stale-campaign
    parent_entity: AuditCampaign
    write_endpoint: "POST /tenants/{tid}/remediation_actions/{id}/resolve"
    occ_field: "expected_campaign_version"
    description: |
      Resolving a remediation action against an AuditCampaign whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another auditor has just initiated resampling (which legitimately
      mutates the campaign) and the current writer's view of the campaign is
      therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: cert_validity_window
    trigger: "certificate APPROVED; JurisdictionRule create/update"
    algorithm: chronological
    formula: |
      anchor = (JurisdictionRule.anchor_rule == EFFECTIVE_DATE)
               ? cert.effective_date
               : cert.signed_date
      if JurisdictionRule.validity_window_days == 0:
        expiration_date = null
      else:
        expiration_date = anchor + validity_window_days days
    input_set: "current CertificateVersion of the cert + JurisdictionRule for ship_to_state"
    precision: "ISO8601 date arithmetic; no rounding"
    variants:
      - name: effective_anchor
        when: "JurisdictionRule.anchor_rule == EFFECTIVE_DATE"
        difference: "anchor = effective_date; may be later than signed_date"
      - name: signed_anchor
        when: "JurisdictionRule.anchor_rule == SIGNED_DATE"
        difference: "anchor = signed_date; two valid prose interpretations of 'validity start' yield different expiration_dates"

  - name: exemption_coverage_amount
    trigger: "order submit; certificate approve/suspend/expire/revoke"
    algorithm: aggregation
    formula: |
      # Variant selection is pinned by tenant-configured coverage_mode; this calc
      # computes both interpretations and the order stores the one matching its mode.
      exempt_amount_cents = sum(line.extended_cents for line in order.lines if line.is_exempt_claimed)
      cert = lookup_approved_cert(order.customer_id, order.ship_to_state, order.exemption_reason_code)
      # Variant FULL_CERT (per-cert coverage):
      covered_full = exempt_amount_cents if cert is not null else 0
      # Variant LINE_LEVEL_PROPORTIONAL (proportional coverage):
      # cover only lines whose SKU prefix matches cert's coverage list; fall back to
      # 50% of exempt_amount_cents when cert exists but line-level list is empty.
      # pinned evaluation order: compute per-line, sum, then round half-up at end.
      if cert is null: covered_prop = 0
      else:
        matching = sum(line.extended_cents for line in order.lines
                       if line.is_exempt_claimed and line.sku.startswith('EX'))
        covered_prop = matching if matching > 0 else (exempt_amount_cents + 1) // 2
      covered_amount_cents = covered_full if mode == FULL_CERT else covered_prop
      uncovered_amount_cents = exempt_amount_cents - covered_amount_cents
    input_set: "Order + OrderLine list + APPROVED certs for (customer, ship_to_state)"
    constants:
      DEFAULT_PROPORTION_NUM: 1
      DEFAULT_PROPORTION_DEN: 2
    precision: "integer cents; intermediate values floored per-line, final sum rounded half-up"
    variants:
      - name: full_cert
        when: "tenant coverage_mode == FULL_CERT"
        difference: "binary: cert exists -> cover full exempt_amount_cents"
      - name: line_level_proportional
        when: "tenant coverage_mode == LINE_LEVEL_PROPORTIONAL"
        difference: "covers only EX-prefixed SKUs, else 50% rounded up; produces different covered_amount_cents for identical inputs"

  - name: audit_sample_size
    trigger: "audit campaign open"
    algorithm: threshold
    formula: |
      population = count of APPROVED certs for tenant (optionally filtered by population_state_filter)
      # Variant STATISTICAL: N = ceil(population * confidence_multiplier)
      # confidence_multiplier: 90%->0.10, 95%->0.15, 99%->0.25
      # Variant FIXED_FLOOR: N = max(floor_sample_size, min(population, 5))
      # boundary precision: STATISTICAL returns ceil so population=7, 90% -> ceil(0.7)=1 (>=1);
      # FIXED_FLOOR returns max(floor, min(pop,5)) so pop=3,floor=10 -> max(10,3)=10 (floor wins even when exceeds pop)
      if sampling_method == STATISTICAL:
        planned = ceil(population * confidence_multiplier[target_confidence_pct])
        planned = max(planned, 1)
      else:
        planned = max(floor_sample_size, min(population, 5))
    input_set: "APPROVED certs for tenant, optional state filter"
    constants:
      CONFIDENCE_MULTIPLIER_90: 0.10
      CONFIDENCE_MULTIPLIER_95: 0.15
      CONFIDENCE_MULTIPLIER_99: 0.25
      FIXED_FLOOR_MIN: 5
    precision: "integer, ceiling for STATISTICAL, no rounding for FIXED_FLOOR"
    variants:
      - name: statistical
        when: "campaign.sampling_method == STATISTICAL"
        difference: "proportional to population"
      - name: fixed_floor
        when: "campaign.sampling_method == FIXED_FLOOR"
        difference: "constant floor; two valid interpretations of 'sample size' yield different N"

  - name: order_block_threshold
    trigger: "order ship attempt"
    algorithm: threshold
    formula: |
      # Block ship when customer.blocked_exposure_cents >= BLOCK_THRESHOLD_CENTS.
      # Boundary precision: >=, NOT >. A customer at exactly $100,000.00 blocked
      # exposure cannot ship; $99,999.99 can.
      if customer.blocked_exposure_cents >= BLOCK_THRESHOLD_CENTS:
        reject with ERR_BLOCKED_EXPOSURE_AT_LIMIT
    input_set: "Customer.blocked_exposure_cents at the moment of ship attempt"
    constants:
      BLOCK_THRESHOLD_CENTS: 10000000  # $100,000.00
    precision: "integer cents; >= comparison"

  - name: defense_packet_completeness
    trigger: "packet assemble"
    algorithm: aggregation
    formula: |
      included = sorted(certs of samples with outcome in {PASSED, WAIVED}, by created_at ASC)
      missing = sorted(certs of samples with outcome = FAILED lacking RESOLVED remediation, by created_at ASC)
      total = len(included) + len(missing)
      if total == 0:
        completeness_score_pct = 0
      else:
        completeness_score_pct = round_half_up(100 * len(included) / total)
    input_set: "all AuditSamples of the parent campaign"
    precision: "integer percent, round_half_up"

  - name: outreach_send_schedule
    trigger: "outreach campaign reaches SCHEDULED; advance_day executes SENDING"
    algorithm: chronological
    formula: |
      candidates = [cert for cert in tenant's APPROVED certs
                    if cert.expiration_date is not null
                    and (cert.expiration_date - current_day) <= campaign.days_before_expiration
                    and (campaign.target_state_filter empty OR cert.ship_to_state in filter)]
      sort candidates by (customer.created_at ASC, certificate.created_at ASC)
      # boundary precision: <= days_before_expiration, NOT <; a cert expiring
      # exactly days_before_expiration days from today IS included.
      for cert in candidates: emit OutreachNotice
    input_set: "APPROVED certs with non-null expiration_date"
    precision: "day-granularity arithmetic"

# =============================================================================
# Table 1.4: Validation Rules Table (Ordered by Priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role authorized for this endpoint"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every id in path resolves to a live record inside the tenant scope"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: existence
    check: "Tenant scope: every FK in body (customer_id, certificate_id, exemption_reason_code, drop_ship_link_id) resolves to a record of the same tenant"
    error_id: ERR_CROSS_TENANT_REFERENCE
    http_status: 404
    applies_to: "POST endpoints with FK fields"

  - priority: 5
    category: state
    check: "Target resource in correct state for requested transition"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all state transition endpoints"

  - priority: 6
    category: state
    check: "Concurrency (OCC): expected_<parent>_version matches current parent version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "endpoints with expected_*_version input"

  - priority: 7
    category: business_safety
    check: "Segregation of duties: reviewer != uploader; campaign closer != opener; ASSESS_TAX resolver != assignee"
    error_id: ERR_SOD_REVIEWER_IS_UPLOADER
    http_status: 409
    applies_to: "certificate begin_review / approve / reject"

  - priority: 8
    category: business_safety
    check: "SoD: audit campaign closer != opener"
    error_id: ERR_SOD_CLOSER_IS_OPENER
    http_status: 409
    applies_to: "audit_campaigns close"

  - priority: 9
    category: business_safety
    check: "SoD: ASSESS_TAX remediation resolver != assignee"
    error_id: ERR_SOD_ASSESSOR_IS_RESOLVER
    http_status: 409
    applies_to: "remediation_actions resolve"

  - priority: 10
    category: business_constraint
    check: "Certificate form_type accepted by JurisdictionRule.accepted_form_types for ship_to_state"
    error_id: ERR_FORM_NOT_ACCEPTED_IN_STATE
    http_status: 422
    applies_to: "certificates submit"

  - priority: 11
    category: business_constraint
    check: "State registration number present when JurisdictionRule.requires_state_registration_number"
    error_id: ERR_MISSING_STATE_REGISTRATION
    http_status: 422
    applies_to: "certificates submit"

  - priority: 12
    category: business_constraint
    check: "Effective date not in the future at approve time"
    error_id: ERR_EFFECTIVE_DATE_IN_FUTURE
    http_status: 422
    applies_to: "certificates approve"

  - priority: 13
    category: business_temporal
    check: "Cannot reinstate an expired certificate"
    error_id: ERR_CERT_EXPIRED
    http_status: 409
    applies_to: "certificates reinstate"

  - priority: 14
    category: business_temporal
    check: "Outreach schedule: scheduled_send_day_index must be >= current audit_clock_day_index"
    error_id: ERR_SCHEDULE_IN_PAST
    http_status: 422
    applies_to: "outreach_campaigns schedule"

  - priority: 15
    category: business_referential
    check: "Order must have at least one line"
    error_id: ERR_ORDER_EMPTY
    http_status: 422
    applies_to: "orders submit"

  - priority: 16
    category: business_referential
    check: "Customer onboarding must be complete before order submit"
    error_id: ERR_ONBOARDING_INCOMPLETE
    http_status: 409
    applies_to: "orders submit"

  - priority: 17
    category: business_referential
    check: "Drop-ship resale cert must be APPROVED"
    error_id: ERR_RESALE_CERT_NOT_APPROVED
    http_status: 409
    applies_to: "drop_ship_links verify"

  - priority: 18
    category: business_referential
    check: "Drop-ship state mismatch when JurisdictionRule disallows out-of-state resale"
    error_id: ERR_DROP_SHIP_STATE_MISMATCH
    http_status: 422
    applies_to: "drop_ship_links verify"

  - priority: 19
    category: business_fiscal
    check: "Customer blocked_exposure below BLOCK_THRESHOLD_CENTS at ship time"
    error_id: ERR_BLOCKED_EXPOSURE_AT_LIMIT
    http_status: 409
    applies_to: "orders ship"

  - priority: 20
    category: business_constraint
    check: "Audit campaign cannot enter DEFENSE_ASSEMBLY with unremediated FAILED samples"
    error_id: ERR_UNREMEDIATED_FAILURES
    http_status: 409
    applies_to: "audit_campaigns begin_defense_assembly"

  - priority: 21
    category: business_constraint
    check: "Defense packet cannot deliver with completeness < 100"
    error_id: ERR_PACKET_INCOMPLETE
    http_status: 409
    applies_to: "audit_defense_packets deliver"

  - priority: 22
    category: business_referential
    check: "Revoking cert referenced by non-terminal AuditSample"
    error_id: ERR_CERT_UNDER_AUDIT
    http_status: 409
    applies_to: "certificates revoke"

  - priority: 23
    category: business_constraint
    check: "Cannot cancel outreach campaign already in SENDING/DONE"
    error_id: ERR_CAMPAIGN_ALREADY_SENDING
    http_status: 409
    applies_to: "outreach_campaigns cancel"

  - priority: 24
    category: business_temporal
    check: "Audit sample DOC request window: receive_docs after doc_due_day_index rejected"
    error_id: ERR_DOC_WINDOW_EXPIRED
    http_status: 409
    applies_to: "audit_samples receive_docs"

  - priority: 25
    category: business_constraint
    check: "Cannot submit a certificate with no CertificateVersion uploaded"
    error_id: ERR_NO_CERT_VERSION
    http_status: 422
    applies_to: "certificates submit"

  - priority: 26
    category: business_constraint
    check: "Duplicate ExemptionReason.code within tenant"
    error_id: ERR_DUPLICATE_REASON_CODE
    http_status: 409
    applies_to: "exemption_reasons create"

  - priority: 27
    category: business_constraint
    check: "Duplicate JurisdictionRule.state_code within tenant"
    error_id: ERR_DUPLICATE_JURISDICTION
    http_status: 409
    applies_to: "jurisdiction_rules create"

  - priority: 28
    category: business_fiscal
    check: "Remediation ASSESS_TAX requires assessment_amount_cents > 0"
    error_id: ERR_ASSESSMENT_AMOUNT_INVALID
    http_status: 422
    applies_to: "remediation_actions resolve"

# =============================================================================
# Table 1.5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock / test-driving ---
  - method: POST
    path: "/tenants/{tid}/_clock/advance_day"
    description: "Advance tenant.audit_clock_day_index by N days (default logical clock starts at 2026-08-01T00:00:00Z before any advance)"
    roles: [TenantAdmin]
    code: 200
    input: [days]
    output: Tenant
    side_effects:
      - "tenant.audit_clock_day_index += days"
      - "system: cert expirations fire (APPROVED -> EXPIRED when current_day > expiration_date)"
      - "system: DOC_REQUESTED samples with doc_due_day_index < current_day -> EXPIRED_NO_RESPONSE"
      - "system: SCHEDULED outreach campaigns with scheduled_send_day_index <= current_day -> SENDING -> DONE"

  # --- Tenant ---
  - method: POST
    path: "/tenants"
    description: "Create a Tenant"
    roles: [TenantAdmin]
    code: 201
    input: [legal_name, home_state_code]
    output: Tenant
    side_effects: ["audit_clock_day_index=0, audit_posture=CLEAR, open_exposure_cents=0"]

  - method: GET
    path: "/tenants/{tid}"
    description: "Get a Tenant"
    roles: [TenantAdmin, ComplianceOfficer, Auditor, OrderClerk, FulfillmentClerk, BillingClerk]
    code: 200
    input: []
    output: Tenant
    side_effects: []

  # --- JurisdictionRule ---
  - method: POST
    path: "/tenants/{tid}/jurisdiction_rules"
    description: "Create a JurisdictionRule"
    roles: [TenantAdmin]
    code: 201
    input: [state_code, accepted_form_types, validity_window_days, anchor_rule, allows_drop_ship_resale, requires_state_registration_number, blanket_cert_allowed]
    output: JurisdictionRule
    side_effects: ["ERR_DUPLICATE_JURISDICTION if state_code already present for tenant"]

  - method: GET
    path: "/tenants/{tid}/jurisdiction_rules"
    description: "List JurisdictionRules"
    roles: [TenantAdmin, ComplianceOfficer, Auditor]
    code: 200
    input: ["state_code?"]
    output: "JurisdictionRule[]"
    side_effects: []

  - method: GET
    path: "/tenants/{tid}/jurisdiction_rules/{id}"
    description: "Get one JurisdictionRule"
    roles: [TenantAdmin, ComplianceOfficer, Auditor]
    code: 200
    input: []
    output: JurisdictionRule
    side_effects: []

  # --- ExemptionReason ---
  - method: POST
    path: "/tenants/{tid}/exemption_reasons"
    description: "Create an ExemptionReason"
    roles: [TenantAdmin]
    code: 201
    input: [code, description, tax_engine_code, requires_certificate, allowed_form_types]
    output: ExemptionReason
    side_effects: ["ERR_DUPLICATE_REASON_CODE on duplicate code"]

  - method: GET
    path: "/tenants/{tid}/exemption_reasons"
    description: "List ExemptionReasons"
    roles: [TenantAdmin, ComplianceOfficer, Auditor, OrderClerk]
    code: 200
    input: ["code?"]
    output: "ExemptionReason[]"
    side_effects: []

  # --- Customer ---
  - method: POST
    path: "/tenants/{tid}/customers"
    description: "Create a Customer (begins onboarding)"
    roles: [TenantAdmin, ComplianceOfficer]
    code: 201
    input: [external_ref, legal_name, primary_ship_to_state, exemption_reason_code]
    output: Customer
    side_effects: ["cert_standing=MISSING, audit_standing=NOT_UNDER_AUDIT, collection_standing=CURRENT, onboarding_completed_at=null"]

  - method: GET
    path: "/tenants/{tid}/customers"
    description: "List Customers"
    roles: [TenantAdmin, ComplianceOfficer, Auditor, OrderClerk]
    code: 200
    input: ["cert_standing?", "collection_standing?", "audit_standing?"]
    output: "Customer[]"
    side_effects: []

  - method: GET
    path: "/tenants/{tid}/customers/{id}"
    description: "Get a Customer"
    roles: [TenantAdmin, ComplianceOfficer, Auditor, OrderClerk, FulfillmentClerk, BillingClerk]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: POST
    path: "/tenants/{tid}/customers/{id}/complete_onboarding"
    description: "Mark customer onboarding complete (required before orders can be submitted)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Customer
    side_effects: ["onboarding_completed_at = now", "increments Customer.version by 1"]

  # --- ExemptionCertificate ---
  - method: POST
    path: "/tenants/{tid}/customers/{cid}/certificates"
    description: "Create an ExemptionCertificate (DRAFT). Optional supersedes_certificate_id to renew an existing cert."
    roles: [ComplianceOfficer]
    code: 201
    input: [ship_to_state, form_type, exemption_reason_code, state_registration_number, signed_date, effective_date, "supersedes_certificate_id?"]
    output: ExemptionCertificate
    side_effects: ["status=DRAFT", "if supersedes_certificate_id given, mark referenced cert SUPERSEDED once this one is APPROVED"]

  - method: GET
    path: "/tenants/{tid}/customers/{cid}/certificates"
    description: "List certificates for a customer"
    roles: [TenantAdmin, ComplianceOfficer, Auditor]
    code: 200
    input: ["status?", "ship_to_state?"]
    output: "ExemptionCertificate[]"
    side_effects: []

  - method: GET
    path: "/tenants/{tid}/certificates/{id}"
    description: "Get a certificate"
    roles: [TenantAdmin, ComplianceOfficer, Auditor]
    code: 200
    input: []
    output: ExemptionCertificate
    side_effects: []

  - method: POST
    path: "/tenants/{tid}/certificates/{id}/versions"
    description: "Upload a new CertificateVersion (sets current_version_id; on REJECTED cert re-opens DRAFT)"
    roles: [ComplianceOfficer]
    code: 201
    input: [file_uri, form_type, signed_date, effective_date]
    output: CertificateVersion
    side_effects: ["certificate.current_version_id = new version", "version_index = prior+1", "increments ExemptionCertificate.version by 1", "if certificate.status == REJECTED: certificate.status -> DRAFT"]

  - method: GET
    path: "/tenants/{tid}/certificates/{id}/versions"
    description: "List versions of a certificate"
    roles: [TenantAdmin, ComplianceOfficer, Auditor]
    code: 200
    input: []
    output: "CertificateVersion[]"
    side_effects: []

  - method: POST
    path: "/tenants/{tid}/certificates/{id}/submit"
    description: "Submit certificate for review"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ExemptionCertificate
    side_effects: ["status DRAFT -> SUBMITTED", "increments ExemptionCertificate.version by 1"]

  - method: POST
    path: "/tenants/{tid}/certificates/{id}/begin_review"
    description: "Move certificate to UNDER_REVIEW (SoD check)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ExemptionCertificate
    side_effects: ["status SUBMITTED -> UNDER_REVIEW", "increments ExemptionCertificate.version by 1"]

  - method: POST
    path: "/tenants/{tid}/certificates/{id}/approve"
    description: "Approve certificate. OCC on parent Customer."
    roles: [ComplianceOfficer]
    code: 200
    input: [expected_customer_version]
    output: ExemptionCertificate
    side_effects:
      - "status UNDER_REVIEW -> APPROVED"
      - "compute expiration_date per cert_validity_window"
      - "reviewed_by_user_id = actor, review_decision_at = now"
      - "recompute customer cert_standing / collection_standing; increments Customer.version by 1"
      - "for each HELD_FOR_CERT order of this customer with matching ship_to_state: recompute covered_amount_cents; if uncovered_amount_cents==0, transition to READY_TO_SHIP; increments Order.version by 1"
      - "recompute tenant.open_exposure_cents; increments Tenant.version by 1"

  - method: POST
    path: "/tenants/{tid}/certificates/{id}/reject"
    description: "Reject certificate (SoD check)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ExemptionCertificate
    side_effects: ["status UNDER_REVIEW -> REJECTED", "increments ExemptionCertificate.version by 1"]

  - method: POST
    path: "/tenants/{tid}/certificates/{id}/suspend"
    description: "Suspend an APPROVED certificate"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ExemptionCertificate
    side_effects: ["status APPROVED -> SUSPENDED", "cascade to orders", "increments ExemptionCertificate.version by 1"]

  - method: POST
    path: "/tenants/{tid}/certificates/{id}/reinstate"
    description: "Reinstate a SUSPENDED certificate"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ExemptionCertificate
    side_effects: ["status SUSPENDED -> APPROVED if not expired", "increments ExemptionCertificate.version by 1"]

  - method: POST
    path: "/tenants/{tid}/certificates/{id}/revoke"
    description: "Revoke an APPROVED certificate (terminal)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ExemptionCertificate
    side_effects: ["status APPROVED -> REVOKED", "increments ExemptionCertificate.version by 1"]

  # --- Order ---
  - method: POST
    path: "/tenants/{tid}/customers/{cid}/orders"
    description: "Create an Order (DRAFT)"
    roles: [OrderClerk]
    code: 201
    input: [order_ref, ship_to_state, exemption_reason_code, "drop_ship_link_id?"]
    output: Order
    side_effects: ["status=DRAFT, subtotal_cents=0"]

  - method: GET
    path: "/tenants/{tid}/orders/{id}"
    description: "Get an Order"
    roles: [TenantAdmin, ComplianceOfficer, Auditor, OrderClerk, FulfillmentClerk, BillingClerk]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: GET
    path: "/tenants/{tid}/orders"
    description: "List Orders"
    roles: [TenantAdmin, ComplianceOfficer, Auditor, OrderClerk]
    code: 200
    input: ["customer_id?", "status?"]
    output: "Order[]"
    side_effects: []

  - method: POST
    path: "/tenants/{tid}/orders/{id}/lines"
    description: "Add an OrderLine"
    roles: [OrderClerk]
    code: 201
    input: [sku, quantity, unit_price_cents, is_exempt_claimed]
    output: OrderLine
    side_effects: ["recompute order.subtotal_cents", "increments Order.version by 1"]

  - method: GET
    path: "/tenants/{tid}/orders/{id}/lines"
    description: "List lines for an order"
    roles: [TenantAdmin, ComplianceOfficer, Auditor, OrderClerk, FulfillmentClerk, BillingClerk]
    code: 200
    input: []
    output: "OrderLine[]"
    side_effects: []

  - method: POST
    path: "/tenants/{tid}/orders/{id}/submit"
    description: "Submit an Order (system determines HELD_FOR_CERT vs READY_TO_SHIP)"
    roles: [OrderClerk]
    code: 200
    input: []
    output: Order
    side_effects: ["status DRAFT -> SUBMITTED -> (HELD_FOR_CERT | READY_TO_SHIP)", "compute exempt/covered/uncovered via exemption_coverage_amount", "increments Order.version by 1"]

  - method: POST
    path: "/tenants/{tid}/orders/{id}/ship"
    description: "Ship a READY_TO_SHIP order (block threshold enforced)"
    roles: [FulfillmentClerk]
    code: 200
    input: []
    output: Order
    side_effects: ["status READY_TO_SHIP -> SHIPPED", "increments Order.version by 1"]

  - method: POST
    path: "/tenants/{tid}/orders/{id}/invoice"
    description: "Invoice a SHIPPED order"
    roles: [BillingClerk]
    code: 200
    input: []
    output: Order
    side_effects: ["status SHIPPED -> INVOICED", "resolve applied_tax_engine_code", "increments Order.version by 1"]

  - method: POST
    path: "/tenants/{tid}/orders/{id}/cancel"
    description: "Cancel a DRAFT or HELD_FOR_CERT order"
    roles: [OrderClerk]
    code: 200
    input: []
    output: Order
    side_effects: ["status -> CANCELLED", "release blocked/open exposure", "increments Order.version by 1"]

  # --- DropShipLink ---
  - method: POST
    path: "/tenants/{tid}/drop_ship_links"
    description: "Create a DropShipLink"
    roles: [ComplianceOfficer]
    code: 201
    input: [retailer_customer_id, ship_to_state, resale_certificate_id]
    output: DropShipLink
    side_effects: ["status=PENDING_VERIFICATION"]

  - method: GET
    path: "/tenants/{tid}/drop_ship_links/{id}"
    description: "Get a DropShipLink"
    roles: [TenantAdmin, ComplianceOfficer, Auditor]
    code: 200
    input: []
    output: DropShipLink
    side_effects: []

  - method: POST
    path: "/tenants/{tid}/drop_ship_links/{id}/verify"
    description: "Verify a DropShipLink"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: DropShipLink
    side_effects: ["status PENDING_VERIFICATION -> VERIFIED", "compute is_out_of_state_resale_accepted"]

  - method: POST
    path: "/tenants/{tid}/drop_ship_links/{id}/reject"
    description: "Reject a DropShipLink"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: DropShipLink
    side_effects: ["status PENDING_VERIFICATION -> REJECTED"]

  # --- AuditCampaign ---
  - method: POST
    path: "/tenants/{tid}/audit_campaigns"
    description: "Create an AuditCampaign (DRAFT)"
    roles: [Auditor]
    code: 201
    input: [name, population_state_filter, sampling_method, "target_confidence_pct?", "floor_sample_size?"]
    output: AuditCampaign
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/tenants/{tid}/audit_campaigns/{id}"
    description: "Get an AuditCampaign"
    roles: [TenantAdmin, ComplianceOfficer, Auditor]
    code: 200
    input: []
    output: AuditCampaign
    side_effects: []

  - method: POST
    path: "/tenants/{tid}/audit_campaigns/{id}/open"
    description: "Open a campaign (computes planned_sample_size)"
    roles: [Auditor]
    code: 200
    input: []
    output: AuditCampaign
    side_effects: ["status DRAFT -> SAMPLING", "compute planned_sample_size", "opened_by_user_id = actor", "tenant.audit_posture = UNDER_SAMPLING", "increments AuditCampaign.version by 1", "increments Tenant.version by 1"]

  - method: POST
    path: "/tenants/{tid}/audit_campaigns/{id}/sample"
    description: "Generate AuditSample rows"
    roles: [Auditor]
    code: 200
    input: []
    output: AuditCampaign
    side_effects: ["status SAMPLING -> FIELDWORK", "create planned_sample_size AuditSample rows in PENDING", "for each sampled customer: audit_standing -> SAMPLED", "increments AuditCampaign.version by 1"]

  - method: GET
    path: "/tenants/{tid}/audit_campaigns/{id}/samples"
    description: "List samples of a campaign"
    roles: [TenantAdmin, ComplianceOfficer, Auditor]
    code: 200
    input: ["outcome?"]
    output: "AuditSample[]"
    side_effects: []

  - method: POST
    path: "/tenants/{tid}/audit_campaigns/{id}/resample"
    description: "REMEDIATION -> FIELDWORK: resample failed certs"
    roles: [Auditor]
    code: 200
    input: []
    output: AuditCampaign
    side_effects: ["status REMEDIATION -> FIELDWORK", "new AuditSample rows for previously-FAILED certificates", "increments AuditCampaign.version by 1"]

  - method: POST
    path: "/tenants/{tid}/audit_campaigns/{id}/begin_defense_assembly"
    description: "Move campaign REMEDIATION -> DEFENSE_ASSEMBLY"
    roles: [Auditor]
    code: 200
    input: []
    output: AuditCampaign
    side_effects: ["status -> DEFENSE_ASSEMBLY", "create AuditDefensePacket in DRAFT", "increments AuditCampaign.version by 1"]

  - method: POST
    path: "/tenants/{tid}/audit_campaigns/{id}/close"
    description: "Close a campaign (SoD: closer != opener)"
    roles: [Auditor]
    code: 200
    input: []
    output: AuditCampaign
    side_effects: ["status -> CLOSED", "closed_by_user_id = actor", "tenant.audit_posture = CLEAR", "increments AuditCampaign.version by 1"]

  - method: POST
    path: "/tenants/{tid}/audit_campaigns/{id}/cancel"
    description: "Cancel a DRAFT or SAMPLING campaign"
    roles: [Auditor]
    code: 200
    input: []
    output: AuditCampaign
    side_effects: ["status -> CANCELLED"]

  # --- AuditSample ---
  - method: GET
    path: "/tenants/{tid}/audit_samples/{id}"
    description: "Get an AuditSample"
    roles: [TenantAdmin, ComplianceOfficer, Auditor]
    code: 200
    input: []
    output: AuditSample
    side_effects: []

  - method: POST
    path: "/tenants/{tid}/audit_samples/{id}/request_docs"
    description: "PENDING -> DOC_REQUESTED"
    roles: [Auditor]
    code: 200
    input: []
    output: AuditSample
    side_effects: ["doc_due_day_index = current_day + 10", "increments AuditSample.version by 1"]

  - method: POST
    path: "/tenants/{tid}/audit_samples/{id}/receive_docs"
    description: "DOC_REQUESTED -> DOC_RECEIVED (within window)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: AuditSample
    side_effects: ["increments AuditSample.version by 1"]

  - method: POST
    path: "/tenants/{tid}/audit_samples/{id}/request_rework"
    description: "DOC_RECEIVED -> DOC_REQUESTED (re-extend window)"
    roles: [Auditor]
    code: 200
    input: []
    output: AuditSample
    side_effects: ["doc_due_day_index = current_day + 10", "increments AuditSample.version by 1"]

  - method: POST
    path: "/tenants/{tid}/audit_samples/{id}/pass"
    description: "DOC_RECEIVED -> PASSED"
    roles: [Auditor]
    code: 200
    input: []
    output: AuditSample
    side_effects: ["increments AuditSample.version by 1"]

  - method: POST
    path: "/tenants/{tid}/audit_samples/{id}/fail"
    description: "DOC_RECEIVED -> FAILED; auto-create RemediationAction(OPEN)"
    roles: [Auditor]
    code: 200
    input: [failure_reason]
    output: AuditSample
    side_effects: ["customer.audit_standing -> FAILED_SAMPLING", "create RemediationAction(OPEN, action_type=COLLECT_NEW_CERT, assigned_to_user_id=customer's primary ComplianceOfficer)", "increments AuditSample.version by 1", "increments Customer.version by 1"]

  - method: POST
    path: "/tenants/{tid}/audit_samples/{id}/waive"
    description: "DOC_REQUESTED|DOC_RECEIVED -> WAIVED"
    roles: [Auditor]
    code: 200
    input: []
    output: AuditSample
    side_effects: ["increments AuditSample.version by 1"]

  # --- RemediationAction ---
  - method: GET
    path: "/tenants/{tid}/remediation_actions/{id}"
    description: "Get a RemediationAction"
    roles: [TenantAdmin, ComplianceOfficer, Auditor]
    code: 200
    input: []
    output: RemediationAction
    side_effects: []

  - method: GET
    path: "/tenants/{tid}/audit_samples/{sid}/remediation_actions"
    description: "List remediation actions for a sample"
    roles: [TenantAdmin, ComplianceOfficer, Auditor]
    code: 200
    input: []
    output: "RemediationAction[]"
    side_effects: []

  - method: POST
    path: "/tenants/{tid}/audit_samples/{sid}/remediation_actions"
    description: "Create a RemediationAction manually (ASSESS_TAX, OBTAIN_LETTER, WAIVE_SAMPLE)"
    roles: [Auditor]
    code: 201
    input: [action_type, assigned_to_user_id, "assessment_amount_cents?"]
    output: RemediationAction
    side_effects: ["status=OPEN"]

  - method: POST
    path: "/tenants/{tid}/remediation_actions/{id}/begin"
    description: "OPEN|ESCALATED -> IN_PROGRESS"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: RemediationAction
    side_effects: ["increments RemediationAction.version by 1"]

  - method: POST
    path: "/tenants/{tid}/remediation_actions/{id}/escalate"
    description: "IN_PROGRESS -> ESCALATED"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: RemediationAction
    side_effects: ["increments RemediationAction.version by 1"]

  - method: POST
    path: "/tenants/{tid}/remediation_actions/{id}/resolve"
    description: "IN_PROGRESS -> RESOLVED. OCC on parent AuditCampaign."
    roles: [ComplianceOfficer]
    code: 200
    input: [expected_campaign_version]
    output: RemediationAction
    side_effects:
      - "resolved_by_user_id = actor"
      - "if action_type == ASSESS_TAX: actor != assigned_to_user_id"
      - "if action_type == COLLECT_NEW_CERT: requires new APPROVED cert for customer+state"
      - "if all FAILED samples for this customer have RESOLVED actions: customer.audit_standing -> REMEDIATED"
      - "increments RemediationAction.version by 1"
      - "increments AuditCampaign.version by 1"

  # --- OutreachCampaign ---
  - method: POST
    path: "/tenants/{tid}/outreach_campaigns"
    description: "Create an OutreachCampaign (DRAFT)"
    roles: [ComplianceOfficer]
    code: 201
    input: [name, target_state_filter, days_before_expiration, scheduled_send_day_index]
    output: OutreachCampaign
    side_effects: ["status=DRAFT, sent_count=0"]

  - method: GET
    path: "/tenants/{tid}/outreach_campaigns/{id}"
    description: "Get an OutreachCampaign"
    roles: [TenantAdmin, ComplianceOfficer, Auditor]
    code: 200
    input: []
    output: OutreachCampaign
    side_effects: []

  - method: POST
    path: "/tenants/{tid}/outreach_campaigns/{id}/schedule"
    description: "DRAFT -> SCHEDULED"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: OutreachCampaign
    side_effects: ["increments OutreachCampaign.version by 1"]

  - method: POST
    path: "/tenants/{tid}/outreach_campaigns/{id}/cancel"
    description: "DRAFT|SCHEDULED -> CANCELLED"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: OutreachCampaign
    side_effects: ["status -> CANCELLED"]

  - method: GET
    path: "/tenants/{tid}/outreach_campaigns/{id}/notices"
    description: "List OutreachNotices emitted by campaign"
    roles: [TenantAdmin, ComplianceOfficer, Auditor]
    code: 200
    input: []
    output: "OutreachNotice[]"
    side_effects: []

  # --- AuditDefensePacket ---
  - method: GET
    path: "/tenants/{tid}/audit_campaigns/{cid}/defense_packet"
    description: "Get the defense packet for a campaign (1:1, returns array of 0 or 1)"
    roles: [TenantAdmin, ComplianceOfficer, Auditor]
    code: 200
    input: []
    output: "AuditDefensePacket[]"
    side_effects: []

  - method: POST
    path: "/tenants/{tid}/audit_defense_packets/{id}/assemble"
    description: "DRAFT -> ASSEMBLED (compute included/missing/score)"
    roles: [Auditor]
    code: 200
    input: []
    output: AuditDefensePacket
    side_effects: ["compute included_certificate_ids, missing_certificate_ids, completeness_score_pct", "assembled_by_user_id = actor", "increments AuditDefensePacket.version by 1"]

  - method: POST
    path: "/tenants/{tid}/audit_defense_packets/{id}/deliver"
    description: "ASSEMBLED -> DELIVERED (requires completeness == 100)"
    roles: [Auditor]
    code: 200
    input: []
    output: AuditDefensePacket
    side_effects: ["increments AuditDefensePacket.version by 1"]

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/malformed" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Role not allowed on this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Resource id does not exist within tenant scope" }
  - { id: ERR_CROSS_TENANT_REFERENCE, http: 404, condition: "FK in body points to a different tenant" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Target resource not in a state permitting this transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match current parent version (OCC)" }
  - { id: ERR_SOD_REVIEWER_IS_UPLOADER, http: 409, condition: "Reviewer X-User-ID equals uploader X-User-ID of current cert version" }
  - { id: ERR_SOD_CLOSER_IS_OPENER, http: 409, condition: "Audit campaign closer X-User-ID equals opener X-User-ID" }
  - { id: ERR_SOD_ASSESSOR_IS_RESOLVER, http: 409, condition: "ASSESS_TAX remediation resolver equals assignee" }
  - { id: ERR_FORM_NOT_ACCEPTED_IN_STATE, http: 422, condition: "Certificate form_type not in JurisdictionRule.accepted_form_types" }
  - { id: ERR_MISSING_STATE_REGISTRATION, http: 422, condition: "JurisdictionRule requires state_registration_number but cert lacks it" }
  - { id: ERR_EFFECTIVE_DATE_IN_FUTURE, http: 422, condition: "Certificate effective_date > today at approve time" }
  - { id: ERR_CERT_EXPIRED, http: 409, condition: "Reinstate attempted on expired certificate" }
  - { id: ERR_SCHEDULE_IN_PAST, http: 422, condition: "Outreach scheduled_send_day_index < current audit_clock_day_index" }
  - { id: ERR_ORDER_EMPTY, http: 422, condition: "Order submit with zero lines" }
  - { id: ERR_ONBOARDING_INCOMPLETE, http: 409, condition: "Order submit before customer complete_onboarding" }
  - { id: ERR_RESALE_CERT_NOT_APPROVED, http: 409, condition: "Drop-ship verify references non-APPROVED resale cert" }
  - { id: ERR_DROP_SHIP_STATE_MISMATCH, http: 422, condition: "Drop-ship ship_to_state mismatch when jurisdiction disallows out-of-state resale" }
  - { id: ERR_BLOCKED_EXPOSURE_AT_LIMIT, http: 409, condition: "Customer blocked_exposure_cents >= BLOCK_THRESHOLD_CENTS at ship time" }
  - { id: ERR_UNREMEDIATED_FAILURES, http: 409, condition: "begin_defense_assembly with FAILED samples lacking RESOLVED remediation" }
  - { id: ERR_PACKET_INCOMPLETE, http: 409, condition: "deliver with completeness_score_pct < 100" }
  - { id: ERR_CERT_UNDER_AUDIT, http: 409, condition: "revoke a certificate referenced by non-terminal AuditSample" }
  - { id: ERR_CAMPAIGN_ALREADY_SENDING, http: 409, condition: "cancel outreach campaign in SENDING/DONE" }
  - { id: ERR_DOC_WINDOW_EXPIRED, http: 409, condition: "receive_docs after doc_due_day_index" }
  - { id: ERR_NO_CERT_VERSION, http: 422, condition: "submit a certificate with zero versions" }
  - { id: ERR_DUPLICATE_REASON_CODE, http: 409, condition: "ExemptionReason.code already exists for tenant" }
  - { id: ERR_DUPLICATE_JURISDICTION, http: 409, condition: "JurisdictionRule.state_code already exists for tenant" }
  - { id: ERR_ASSESSMENT_AMOUNT_INVALID, http: 422, condition: "ASSESS_TAX resolve with assessment_amount_cents <= 0" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: TenantAdmin
    description: "Tenant superuser; manages configuration, clock, and can read everything"
    identity: opaque
    exclusive_operations:
      - "POST /tenants — Create tenant"
      - "POST /tenants/{tid}/_clock/advance_day — Advance logical clock"
      - "POST /tenants/{tid}/jurisdiction_rules — Create jurisdiction rule"
      - "POST /tenants/{tid}/exemption_reasons — Create exemption reason"
    shared_operations:
      - "GET endpoints across all resources"

  - name: ComplianceOfficer
    description: "Certificate desk operator; uploads, submits, reviews, approves/rejects certificates; manages drop-ship links; owns remediation work"
    identity: opaque
    exclusive_operations:
      - "POST /tenants/{tid}/customers/{cid}/certificates — Create certificate"
      - "POST /tenants/{tid}/certificates/{id}/versions — Upload version"
      - "POST /tenants/{tid}/certificates/{id}/submit — Submit cert"
      - "POST /tenants/{tid}/certificates/{id}/begin_review — Begin review"
      - "POST /tenants/{tid}/certificates/{id}/approve — Approve cert"
      - "POST /tenants/{tid}/certificates/{id}/reject — Reject cert"
      - "POST /tenants/{tid}/certificates/{id}/suspend — Suspend"
      - "POST /tenants/{tid}/certificates/{id}/reinstate — Reinstate"
      - "POST /tenants/{tid}/certificates/{id}/revoke — Revoke"
      - "POST /tenants/{tid}/customers/{id}/complete_onboarding — Complete onboarding"
      - "POST /tenants/{tid}/drop_ship_links — Create drop-ship link"
      - "POST /tenants/{tid}/drop_ship_links/{id}/verify — Verify drop-ship"
      - "POST /tenants/{tid}/drop_ship_links/{id}/reject — Reject drop-ship"
      - "POST /tenants/{tid}/audit_samples/{id}/receive_docs — Receive docs"
      - "POST /tenants/{tid}/remediation_actions/{id}/begin — Begin remediation"
      - "POST /tenants/{tid}/remediation_actions/{id}/escalate — Escalate remediation"
      - "POST /tenants/{tid}/remediation_actions/{id}/resolve — Resolve remediation"
      - "POST /tenants/{tid}/outreach_campaigns — Create outreach campaign"
      - "POST /tenants/{tid}/outreach_campaigns/{id}/schedule — Schedule"
      - "POST /tenants/{tid}/outreach_campaigns/{id}/cancel — Cancel"
    shared_operations:
      - "GET endpoints across all resources"

  - name: Auditor
    description: "Independent audit role; drives campaigns, samples, passes/fails, assembles defense packets. Segregated from ComplianceOfficer for review duties."
    identity: opaque
    exclusive_operations:
      - "POST /tenants/{tid}/audit_campaigns — Create campaign"
      - "POST /tenants/{tid}/audit_campaigns/{id}/open — Open campaign"
      - "POST /tenants/{tid}/audit_campaigns/{id}/sample — Sample"
      - "POST /tenants/{tid}/audit_campaigns/{id}/resample — Resample"
      - "POST /tenants/{tid}/audit_campaigns/{id}/begin_defense_assembly — Begin defense"
      - "POST /tenants/{tid}/audit_campaigns/{id}/close — Close campaign"
      - "POST /tenants/{tid}/audit_campaigns/{id}/cancel — Cancel campaign"
      - "POST /tenants/{tid}/audit_samples/{id}/request_docs — Request docs"
      - "POST /tenants/{tid}/audit_samples/{id}/request_rework — Request rework"
      - "POST /tenants/{tid}/audit_samples/{id}/pass — Pass sample"
      - "POST /tenants/{tid}/audit_samples/{id}/fail — Fail sample"
      - "POST /tenants/{tid}/audit_samples/{id}/waive — Waive sample"
      - "POST /tenants/{tid}/audit_samples/{sid}/remediation_actions — Create remediation"
      - "POST /tenants/{tid}/audit_defense_packets/{id}/assemble — Assemble packet"
      - "POST /tenants/{tid}/audit_defense_packets/{id}/deliver — Deliver packet"
    shared_operations:
      - "GET endpoints across all resources"

  - name: OrderClerk
    description: "Order intake role"
    identity: opaque
    exclusive_operations:
      - "POST /tenants/{tid}/customers/{cid}/orders — Create order"
      - "POST /tenants/{tid}/orders/{id}/lines — Add line"
      - "POST /tenants/{tid}/orders/{id}/submit — Submit order"
      - "POST /tenants/{tid}/orders/{id}/cancel — Cancel order"
    shared_operations:
      - "GET endpoints across all resources"

  - name: FulfillmentClerk
    description: "Shipping role"
    identity: opaque
    exclusive_operations:
      - "POST /tenants/{tid}/orders/{id}/ship — Ship order"
    shared_operations:
      - "GET endpoints across all resources"

  - name: BillingClerk
    description: "Invoicing role"
    identity: opaque
    exclusive_operations:
      - "POST /tenants/{tid}/orders/{id}/invoice — Invoice order"
    shared_operations:
      - "GET endpoints across all resources"
