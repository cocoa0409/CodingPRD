          assert:
            - "${ea} == FINAL_EA and ${fs} == UNDER_REVIEW before the trigger"
            - "${admin} == 6393.33 and ${burden} == 467931.80 and ${ratio_bad} == 18.57 and ${posture_bad} == RESTRICTED"
            - "${err} == ERR_PROJECT_POSTURE_RESTRICTED with HTTP 409 and no LicenseOrder was created"
            - "the rejected issuance left LicenseApplication.${app}.filing_status == UNDER_REVIEW and RelicensingProject.${proj}.stage == UNDER_ENVIRONMENTAL_REVIEW"
            - "${ratio_ok} == 4.46 and ${posture_ok} == OPEN after generation is restored"
            - "${o_state} == EFFECTIVE, ${articles} == 2 (one obligation per INCLUDED measure, no dam) and RelicensingProject.${proj}.stage == LICENSED"
            - "the obligations of LicenseOrder.${order} are due 2027-02-01 for ${wm} and 2028-08-01 for ${m_big}"

      - name: settlement_round_loop_terminates_at_round_three
        claim_type: cyclic
        grounds:
          - state_machines.Settlement.CIRCULATED_to_FAILED
        excluded_because:
          difficulty_instance: non_linear_state_machine / settlement_negotiation_rounds_exhaust_into_failed_and_supersede_measures
          rationale: "The named §1.8 instance drives all three rounds and asserts the FAILED terminus with the measure supersede cascade."

      - name: study_fieldwork_and_review_dimensions_move_independently
        claim_type: parallel
        grounds:
          - state_machines.ResourceStudy
        excluded_because:
          difficulty_instance: non_linear_state_machine / resource_study_additional_round_writes_across_parallel_dimensions
          rationale: "The named §1.8 instance asserts one trigger writing both the fieldwork and review dimensions plus the additional-round cap."

      - name: settlement_withdrawal_reverses_execution_side_effects
        claim_type: compensation
        grounds:
          - state_machines.Settlement.EXECUTED_to_WITHDRAWN
        excluded_because:
          difficulty_instance: compensating_invariant / settlement_withdrawal_restores_the_burden_ledger_exactly
          rationale: "The named §1.8 instance asserts every ledger field before, during and after the withdrawal with no drift."

      - name: measure_inclusion_syncs_project_ledger
        claim_type: ledger_sync
        grounds:
          - state_machines.PmeMeasure.PROPOSED_to_INCLUDED
        excluded_because:
          difficulty_instance: transitive_cascade / wqc_condition_issuance_cascades_into_restricted_posture
          rationale: "The named §1.8 instance asserts the measure-to-ledger-to-posture sync end to end from a certification decision."

  # ===========================================================================
  - section: calculations
    instances:
      - name: ledger_excludes_proposed_measures_from_every_ledger_field
        claim_type: input_set_filtering
        grounds:
          - calculations.project_burden_ledger
          - endpoints["POST /relicensing/pme-measures"]
        distinguishing_aspect: "A SETTLEMENT-sourced measure is created PROPOSED and therefore contributes to none of the six ledger fields even though its own six computed fields are populated; the AGENCY_PRESCRIPTION measure created right after it is INCLUDED and is the only contributor."
