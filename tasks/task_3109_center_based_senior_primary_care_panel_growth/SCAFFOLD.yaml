    input: ["panel_cap?", "physician_count?", "chw_count?", "behavioral_count?"]
    output: CareTeam
    side_effects: ["staffing_score recomputed; increments CareTeam.version by 1; if panel_cap raised on a SATURATED center, re-evaluate Center OPEN/SATURATED and run waitlist promotion"]

  - method: POST
    path: "/senior-care/centers/{centerId}/rooms"
    description: "Create a room"
    roles: [NetworkOperator]
    code: 201
    input: [room_label, "supports_behavioral?"]
    output: CenterRoom
    side_effects: []

  - method: POST
    path: "/senior-care/centers/{centerId}/vehicles"
    description: "Create a vehicle"
    roles: [NetworkOperator]
    code: 201
    input: [plate, seat_capacity, "wheelchair_capable?"]
    output: Vehicle
    side_effects: []

  - method: POST
    path: "/senior-care/centers/{centerId}/outreach-events"
    description: "Create an outreach event"
    roles: [EnrollmentCoordinator]
    code: 201
    input: [event_label, scheduled_on, expected_attendance]
    output: OutreachEvent
    side_effects: []

  - method: POST
    path: "/senior-care/patients"
    description: "Register a patient"
    roles: [EnrollmentCoordinator]
    code: 201
    input: [full_name, date_of_birth, zip_code, risk_score, "transport_dependent?"]
    output: Patient
    side_effects: ["no_show_strikes = 0"]

  - method: GET
    path: "/senior-care/patients/{patientId}"
    description: "Get one patient"
    roles: [EnrollmentCoordinator, CareTeamLead, FrontDesk, TriageNurse, TransportDispatcher, ClaimsAdjudicator]
    code: 200
    input: []
    output: Patient
    side_effects: []

  - method: GET
    path: "/senior-care/patients/{patientId}/attributions"
    description: "List attributions of a patient (FK reverse-reachability for PatientAttribution.patient_id)"
    roles: [EnrollmentCoordinator, FinanceAnalyst]
    code: 200
    input: []
    output: "PatientAttribution[]"
    side_effects: []

  - method: GET
    path: "/senior-care/patients/{patientId}/triage-cases"
    description: "List triage cases of a patient (FK reverse-reachability for TriageCase.patient_id)"
    roles: [TriageNurse, CareTeamLead]
    code: 200
    input: []
    output: "TriageCase[]"
    side_effects: []

  - method: POST
    path: "/senior-care/health-plans"
    description: "Create a health plan contract"
    roles: [FinanceController]
    code: 201
    input: [plan_name, contract_type, base_pmpm_cents, risk_adjust_factor, revenue_share_pct]
    output: HealthPlan
    side_effects: []

  - method: GET
    path: "/senior-care/health-plans/{planId}/quote"
    description: "Quote a risk-adjusted PMPM for a patient at a center"
    roles: [FinanceAnalyst, FinanceController, EnrollmentCoordinator]
    code: 200
    input: [risk_score, center_id]
    output: { quote_cents: integer, tier_applied: string }
    side_effects: []

  - method: POST
    path: "/senior-care/patient-attributions"
    description: "Create an attribution in PENDING (MA plan assignment / PCP selection change); patient must hold no other PENDING or ACTIVE attribution"
    roles: [EnrollmentCoordinator]
    code: 201
    input: [patient_id, health_plan_id, care_team_id, effective_month, "outreach_event_id?"]
    output: PatientAttribution
    side_effects: ["status = PENDING; if outreach_event_id given, OutreachEvent.attributed_signups += 1"]

  - method: GET
    path: "/senior-care/patient-attributions/{attrId}"
    description: "Get one attribution"
    roles: [EnrollmentCoordinator, FinanceAnalyst]
    code: 200
    input: []
    output: PatientAttribution
    side_effects: []

  - method: GET
    path: "/senior-care/care-teams/{teamId}/attributions"
    description: "List attributions of a care team (FK reverse-reachability for PatientAttribution.care_team_id)"
    roles: [EnrollmentCoordinator, CareTeamLead]
    code: 200
    input: ["status?"]
    output: "PatientAttribution[]"
    side_effects: []

  - method: POST
    path: "/senior-care/patient-attributions/{attrId}/activate"
    description: "Activate a PENDING attribution (OCC on CareTeam.version)"
    roles: [EnrollmentCoordinator]
    code: 200
    input: [expected_care_team_version]
    output: PatientAttribution
    side_effects: ["PENDING -> ACTIVE; CareTeam.active_panel_count += 1; increments CareTeam.version by 1; may trigger Center SATURATED cascade"]

  - method: POST
    path: "/senior-care/patient-attributions/{attrId}/disenroll"
    description: "Disenroll an ACTIVE attribution"
    roles: [EnrollmentCoordinator]
    code: 200
    input: []
    output: PatientAttribution
    side_effects: ["ACTIVE -> DISENROLLED; CareTeam.active_panel_count -= 1; increments CareTeam.version by 1; may trigger Center SATURATED -> OPEN and waitlist promotion"]

  - method: POST
    path: "/senior-care/patient-attributions/{attrId}/reattribute"
    description: "Link a DISENROLLED attribution to a new PENDING one"
    roles: [EnrollmentCoordinator]
    code: 200
    input: [new_attribution_id]
    output: PatientAttribution
    side_effects: ["DISENROLLED -> REATTRIBUTED"]

  - method: POST
    path: "/senior-care/appointments"
    description: "Schedule an appointment with room reservation; patient must hold an ACTIVE attribution at the team's center"
    roles: [FrontDesk, CareTeamLead]
    code: 201
    input: [care_team_id, patient_id, room_id, start_utc, duration_minutes, kind]
    output: Appointment
    side_effects: ["status = SCHEDULED; room half-open overlap enforced; BEHAVIORAL kind requires room.supports_behavioral == true"]

  - method: GET
    path: "/senior-care/appointments/{apptId}"
    description: "Get one appointment"
    roles: [FrontDesk, CareTeamLead, TransportDispatcher, TriageNurse]
    code: 200
    input: []
    output: Appointment
    side_effects: []

  - method: GET
    path: "/senior-care/care-teams/{teamId}/appointments"
    description: "List appointments of a care team (FK reverse-reachability for Appointment.care_team_id)"
    roles: [FrontDesk, CareTeamLead]
    code: 200
    input: ["status?"]
    output: "Appointment[]"
    side_effects: []

  - method: GET
    path: "/senior-care/appointments/{apptId}/ride-requests"
    description: "List ride requests for an appointment (FK reverse-reachability for RideRequest.appointment_id)"
    roles: [TransportDispatcher, FrontDesk]
    code: 200
    input: []
    output: "RideRequest[]"
    side_effects: []

  - method: POST
    path: "/senior-care/appointments/{apptId}/check-in"
    description: "Check in a scheduled appointment"
    roles: [FrontDesk]
    code: 200
    input: []
    output: Appointment
    side_effects: ["SCHEDULED -> CHECKED_IN"]

  - method: POST
    path: "/senior-care/appointments/{apptId}/complete"
    description: "Complete a checked-in appointment"
    roles: [CareTeamLead]
    code: 200
    input: []
    output: Appointment
    side_effects: ["CHECKED_IN -> COMPLETED; cost_of_care_booking; linked ride -> DELIVERED"]

  - method: POST
    path: "/senior-care/appointments/{apptId}/cancel"
    description: "Cancel a scheduled appointment"
    roles: [FrontDesk]
    code: 200
    input: []
    output: Appointment
    side_effects: ["SCHEDULED -> CANCELLED; linked REQUESTED/DISPATCHED ride -> CANCELLED"]

  - method: POST
    path: "/senior-care/appointments/{apptId}/ride-requests"
    description: "Create a ride request for an appointment"
    roles: [TransportDispatcher, FrontDesk]
    code: 201
    input: []
    output: RideRequest
    side_effects: ["status = REQUESTED; pickup window computed; rejected if patient strikes >= 3"]

  - method: POST
    path: "/senior-care/ride-requests/{rideId}/dispatch"
    description: "Dispatch a ride to a vehicle"
    roles: [TransportDispatcher]
    code: 200
    input: [vehicle_id]
    output: RideRequest
    side_effects: ["REQUESTED -> DISPATCHED; vehicle capacity-overlap enforced"]

  - method: POST
    path: "/senior-care/ride-requests/{rideId}/start-pickup"
    description: "Mark dispatched ride en route"
    roles: [TransportDispatcher]
    code: 200
    input: []
    output: RideRequest
    side_effects: ["DISPATCHED -> EN_ROUTE"]

  - method: POST
    path: "/senior-care/ride-requests/{rideId}/mark-no-show"
    description: "Mark en-route ride as passenger no-show"
    roles: [TransportDispatcher]
    code: 200
    input: []
    output: RideRequest
    side_effects: ["EN_ROUTE -> FAILED_NO_SHOW; TRANSPORT cost booked; failure_count += 1"]

  - method: POST
    path: "/senior-care/ride-requests/{rideId}/recover"
    description: "Recover a failed ride (returns it to REQUESTED)"
    roles: [TransportDispatcher]
    code: 200
    input: []
    output: RideRequest
    side_effects: ["FAILED_NO_SHOW -> RECOVERED (transient) -> resting state REQUESTED"]

  - method: POST
    path: "/senior-care/triage-cases"
    description: "Open a triage case"
    roles: [TriageNurse]
    code: 201
    input: [patient_id, channel, severity]
    output: TriageCase
    side_effects: ["status = OPEN"]

  - method: POST
    path: "/senior-care/triage-cases/{caseId}/divert"
    description: "Divert a triage case to an urgent-care appointment"
    roles: [TriageNurse]
    code: 200
    input: [urgent_appointment_id]
    output: TriageCase
    side_effects: ["OPEN -> RESOLVED_DIVERTED"]

  - method: POST
    path: "/senior-care/triage-cases/{caseId}/refer-ed"
    description: "Refer a triage case to the ED"
    roles: [TriageNurse]
    code: 200
    input: []
    output: TriageCase
    side_effects: ["OPEN -> RESOLVED_ED; monthly ED-referral counter += 1"]

  - method: POST
    path: "/senior-care/triage-cases/{caseId}/advise-self-care"
    description: "Resolve a LOW-severity case with self-care advice"
    roles: [TriageNurse]
    code: 200
    input: []
    output: TriageCase
    side_effects: ["OPEN -> RESOLVED_SELF_CARE"]

  - method: POST
    path: "/senior-care/cost-claims"
    description: "Submit a cost-of-care claim"
    roles: [ClaimsAdjudicator, FinanceAnalyst]
    code: 201
    input: [center_id, patient_id, service_month, category, amount_cents]
    output: CostOfCareClaim
    side_effects: ["status = SUBMITTED; rejected if the period settlement is FINALIZED"]

  - method: GET
    path: "/senior-care/cost-claims"
    description: "List cost claims with filters (FK reverse-reachability for CostOfCareClaim.center_id and patient_id)"
    roles: [ClaimsAdjudicator, FinanceAnalyst, FinanceController]
    code: 200
    input: ["center_id?", "patient_id?", "status?", "service_month?"]
    output: "CostOfCareClaim[]"
    side_effects: []

  - method: POST
    path: "/senior-care/cost-claims/{claimId}/adjudicate"
    description: "Adjudicate a submitted claim"
    roles: [ClaimsAdjudicator]
    code: 200
    input: [adjudicated_amount_cents]
    output: CostOfCareClaim
    side_effects: ["SUBMITTED -> ADJUDICATED; settlement total_cost_of_care recomputed"]

  - method: POST
    path: "/senior-care/cost-claims/{claimId}/reject"
    description: "Reject a submitted claim"
    roles: [ClaimsAdjudicator]
    code: 200
    input: []
    output: CostOfCareClaim
    side_effects: ["SUBMITTED -> REJECTED"]

  - method: POST
    path: "/senior-care/monthly-settlements"
    description: "Open a monthly settlement for a center+period"
    roles: [FinanceAnalyst]
    code: 201
    input: [center_id, period_month]
    output: MonthlySettlement
    side_effects: ["status = OPEN; unique (center_id, period_month) enforced"]

  - method: GET
    path: "/senior-care/monthly-settlements"
    description: "List settlements with filters (FK reverse-reachability for MonthlySettlement.center_id)"
    roles: [FinanceAnalyst, FinanceController]
    code: 200
    input: ["center_id?", "status?"]
    output: "MonthlySettlement[]"
    side_effects: []

  - method: GET
    path: "/senior-care/monthly-settlements/{settlementId}"
    description: "Get one settlement"
    roles: [FinanceAnalyst, FinanceController]
    code: 200
    input: []
    output: MonthlySettlement
    side_effects: []

  - method: POST
    path: "/senior-care/monthly-settlements/{settlementId}/close-provisional"
    description: "Provisionally close a settlement (OCC on Center.version)"
    roles: [FinanceAnalyst]
    code: 200
    input: [expected_center_version]
    output: MonthlySettlement
    side_effects: ["OPEN -> CLOSED_PROVISIONAL; chronological accrual variant; contribution posted to Center.cumulative_contribution_cents; increments Center.version by 1"]

  - method: POST
    path: "/senior-care/monthly-settlements/{settlementId}/finalize"
    description: "Finalize a provisional settlement"
    roles: [FinanceController]
    code: 200
    input: []
    output: MonthlySettlement
    side_effects: ["CLOSED_PROVISIONAL -> FINALIZED; forward-looking accrual variant with delta posting; claims -> SETTLED; center tier recomputed; increments Center.version by 1"]

  - method: POST
    path: "/senior-care/monthly-settlements/{settlementId}/void"
    description: "Void an open settlement"
    roles: [FinanceController]
    code: 200
    input: []
    output: MonthlySettlement
    side_effects: ["OPEN -> VOIDED"]

errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role undeclared" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, illegal enum value, or numeric range violation" }
  - { id: ERR_TEMPORAL_VIOLATION, http: 422, condition: "Date/month input violates temporal legality (past event, future-effective backdate, off-boundary start)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state precondition failure for the attempted transition" }
  - { id: ERR_CROSS_REFERENCE_MISMATCH, http: 422, condition: "Referenced entities inconsistent (patient not attributed to team center, slot from another center)" }
  - { id: ERR_SCHEDULE_CONFLICT, http: 409, condition: "Room half-open overlap or vehicle capacity-overlap conflict" }
  - { id: ERR_SAFETY_GATE_VIOLATION, http: 422, condition: "Clinical safety gate violated (HIGH severity diverted, self-care on non-LOW, non-wheelchair vehicle)" }
  - { id: ERR_QUOTA_EXCEEDED, http: 409, condition: "Panel cap reached, team not accepting, or transport privilege suspended" }
  - { id: ERR_FISCAL_GATE_VIOLATION, http: 409, condition: "Settlement finalized for period, or non-FULL_RISK settlement operation attempted" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version" }
  - { id: ERR_CENTER_NOT_PRE_OPEN, http: 409, condition: "Center must be PRE_OPEN to open" }
  - { id: ERR_CENTER_HAS_NO_TEAMS, http: 409, condition: "Center has no care teams at open" }
  - { id: ERR_CENTER_HAS_NO_ROOMS, http: 409, condition: "Center has no rooms at open" }
  - { id: ERR_CENTER_HAS_ACTIVE_PANEL, http: 409, condition: "Center still has PENDING/ACTIVE/WAITLISTED attributions at close" }
  - { id: ERR_CENTER_HAS_OPEN_SETTLEMENT, http: 409, condition: "Center has an OPEN or CLOSED_PROVISIONAL settlement at close" }
  - { id: ERR_ATTRIBUTION_NOT_PENDING, http: 409, condition: "Attribution must be PENDING to activate" }
  - { id: ERR_ATTRIBUTION_NOT_YET_EFFECTIVE, http: 409, condition: "effective_month is after the current logical month" }
  - { id: ERR_TEAM_NOT_ACCEPTING, http: 409, condition: "Target care team accepting flag is false" }
  - { id: ERR_PANEL_CAP_REACHED, http: 409, condition: "CareTeam.active_panel_count >= panel_cap at activation" }
  - { id: ERR_PATIENT_ALREADY_ATTRIBUTED, http: 409, condition: "Patient already holds an ACTIVE or PENDING attribution" }
  - { id: ERR_ATTRIBUTION_NOT_ACTIVE, http: 409, condition: "Attribution must be ACTIVE to disenroll" }
  - { id: ERR_ATTRIBUTION_NOT_DISENROLLED, http: 409, condition: "Attribution must be DISENROLLED to reattribute" }
  - { id: ERR_NEW_ATTRIBUTION_NOT_PENDING, http: 409, condition: "reattribute payload new_attribution_id must reference a PENDING attribution" }
  - { id: ERR_REATTRIBUTION_MONTH_NOT_AFTER_DISENROLL, http: 422, condition: "New attribution effective_month must be after the old row's disenrolled_month" }
  - { id: ERR_APPOINTMENT_NOT_SCHEDULED, http: 409, condition: "Appointment must be SCHEDULED for this operation" }
  - { id: ERR_CHECKIN_WINDOW_MISSED, http: 409, condition: "Logical clock outside the check-in window" }
  - { id: ERR_APPOINTMENT_NOT_CHECKED_IN, http: 409, condition: "Appointment must be CHECKED_IN to complete" }
  - { id: ERR_CANCEL_TOO_LATE, http: 409, condition: "Cannot cancel at or after start_utc" }
  - { id: ERR_RIDE_NOT_REQUESTED, http: 409, condition: "Ride must be REQUESTED to dispatch" }
  - { id: ERR_VEHICLE_INELIGIBLE, http: 422, condition: "Vehicle missing, wrong center, or lacks wheelchair capability required by patient" }
  - { id: ERR_VEHICLE_CAPACITY_EXCEEDED, http: 409, condition: "Vehicle seat capacity exceeded over the overlapping pickup windows" }
  - { id: ERR_TRANSPORT_PRIVILEGE_SUSPENDED, http: 409, condition: "Patient has >= 3 no-show strikes; ride creation/dispatch rejected" }
  - { id: ERR_RIDE_NOT_DISPATCHED, http: 409, condition: "Ride must be DISPATCHED to start pickup" }
  - { id: ERR_PICKUP_WINDOW_MISSED, http: 409, condition: "Logical clock outside the pickup window" }
  - { id: ERR_RIDE_NOT_EN_ROUTE, http: 409, condition: "Ride must be EN_ROUTE to mark no-show" }
  - { id: ERR_RIDE_NOT_FAILED, http: 409, condition: "Ride must be FAILED_NO_SHOW to recover" }
  - { id: ERR_RECOVERY_WINDOW_MISSED, http: 409, condition: "Recovery attempted after the appointment end time" }
  - { id: ERR_TRIAGE_NOT_OPEN, http: 409, condition: "Triage case must be OPEN for this operation" }
  - { id: ERR_SEVERITY_REQUIRES_ED, http: 422, condition: "HIGH severity cannot be diverted to urgent care" }
  - { id: ERR_URGENT_SLOT_INVALID, http: 422, condition: "urgent_appointment_id missing, not SCHEDULED, wrong kind, or more than 24h out" }
  - { id: ERR_SEVERITY_TOO_HIGH_FOR_SELF_CARE, http: 422, condition: "Self-care advice allowed only for LOW severity" }
  - { id: ERR_CLAIM_NOT_SUBMITTED, http: 409, condition: "Claim must be SUBMITTED for this operation" }
  - { id: ERR_ADJUDICATED_AMOUNT_INVALID, http: 400, condition: "adjudicated_amount_cents outside 0..amount_cents" }
  - { id: ERR_SETTLEMENT_FINALIZED, http: 409, condition: "The period settlement is FINALIZED; claims are read-only" }
  - { id: ERR_SETTLEMENT_NOT_OPEN, http: 409, condition: "Settlement must be OPEN for this operation" }
  - { id: ERR_PERIOD_STILL_OPEN, http: 409, condition: "Cannot close-provisional while the logical clock is still inside period_month" }
  - { id: ERR_SETTLEMENT_NOT_PROVISIONAL, http: 409, condition: "Settlement must be CLOSED_PROVISIONAL to finalize" }
  - { id: ERR_CLAIMS_STILL_PENDING, http: 409, condition: "SUBMITTED claims remain for the period at finalize" }
  - { id: ERR_CLAIMS_ALREADY_ADJUDICATED, http: 409, condition: "ADJUDICATED claims exist for the period at void" }
  - { id: ERR_DUPLICATE_SETTLEMENT, http: 409, condition: "A settlement already exists for (center_id, period_month)" }

roles:
  - name: NetworkOperator
    description: "Network operations; opens/closes centers, staffs teams, manages rooms/vehicles, drives the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /senior-care/centers, /open, /close"
      - "POST /senior-care/centers/{id}/care-teams, /rooms, /vehicles"
      - "PATCH /senior-care/care-teams/{id}"
      - "POST /_clock/set_current_utc"
    shared_operations: ["GET center and team reads"]
  - name: EnrollmentCoordinator
    description: "Patient acquisition and attribution lifecycle; runs outreach events"
    identity: "opaque"
    exclusive_operations:
      - "POST /senior-care/patients"
      - "POST /senior-care/patient-attributions and /activate /disenroll /reattribute"
      - "POST /senior-care/centers/{id}/outreach-events"
    shared_operations: ["GET centers, attributions, quotes"]
  - name: CareTeamLead
    description: "Clinical lead of a care team; completes visits; acts with X-User-ID equal to the CareTeam.id they lead"
    identity: "entity_backed:CareTeam"
    exclusive_operations:
      - "POST /senior-care/appointments/{id}/complete"
    shared_operations: ["schedule appointments, read patients/teams/appointments"]
  - name: FrontDesk
    description: "Center front desk; check-in, cancel, schedule"
    identity: "opaque"
    exclusive_operations:
      - "POST /senior-care/appointments/{id}/check-in"
      - "POST /senior-care/appointments/{id}/cancel"
    shared_operations: ["schedule appointments, create ride requests"]
  - name: TransportDispatcher
    description: "Transportation routing and no-show recovery"
    identity: "opaque"
    exclusive_operations:
      - "POST /senior-care/ride-requests/{id}/dispatch, /start-pickup, /mark-no-show, /recover"
    shared_operations: ["create ride requests, read appointments/vehicles"]
  - name: TriageNurse
    description: "After-hours and urgent triage"
    identity: "opaque"
    exclusive_operations:
      - "POST /senior-care/triage-cases and /divert /refer-ed /advise-self-care"
    shared_operations: ["read patients, appointments"]
  - name: ClaimsAdjudicator
    description: "Adjudicates cost-of-care claims; segregated from settlement finalize"
    identity: "opaque"
    exclusive_operations:
      - "POST /senior-care/cost-claims/{id}/adjudicate, /reject"
    shared_operations: ["submit cost claims, read claims"]
  - name: FinanceAnalyst
    description: "Opens and provisionally closes settlements; segregated from finalize"
    identity: "opaque"
    exclusive_operations:
      - "POST /senior-care/monthly-settlements"
      - "POST /senior-care/monthly-settlements/{id}/close-provisional"
    shared_operations: ["read centers, claims, settlements, quotes"]
  - name: FinanceController
    description: "Finalizes/voids settlements and owns plan contracts; segregated from provisional close"
    identity: "opaque"
    exclusive_operations:
      - "POST /senior-care/monthly-settlements/{id}/finalize, /void"
      - "POST /senior-care/health-plans"
    shared_operations: ["read centers, claims, settlements, quotes"]
