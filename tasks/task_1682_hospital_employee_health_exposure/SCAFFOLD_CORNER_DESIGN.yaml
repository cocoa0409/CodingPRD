        distinguishing_aspect: "Pre-computed schedule literals for exposure 2026-07-30T10:00:00Z: WEEK_6 2026-09-10T10:00:00Z (open 2026-09-03T10:00:00Z, close 2026-10-08T10:00:00Z), WEEK_12 2026-10-22T10:00:00Z, MONTH_6 2027-01-28T10:00:00Z; BASELINE open equals exposure_datetime."
        test_recipe:
          setup: ["Employee; MEDIUM case at 2026-07-30T10:00:00Z; PEP STARTED 2026-08-01T12:00:00Z"]
          setup_api_calls:
            - call: "POST /employee-health/employees"
              payload: { employee_ref: "E-CL3", full_name: "Sched Ule", job_category: "NURSE", department: "ED", hire_date: "2025-01-05T00:00:00Z", requires_respirator: false }
              as: EmployeeHealthNurse
              captures: { emp_id: $.data.id }
            - call: "POST /employee-health/employees/${emp_id}/exposure-cases"
              payload: { exposure_type: "PERCUTANEOUS", exposure_datetime: "2026-07-30T10:00:00Z", source_known: false, body_fluid: "BLOOD" }
              as: EmployeeHealthNurse
              captures: { case_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T12:00:00Z" }
              as: ComplianceOfficer
            - call: "GET /employee-health/pep-regimens"
              payload: { exposure_case_id: "${case_id}" }
              as: EmployeeHealthPhysician
              captures: { pep_id: "$.data[0].id" }
            - call: "POST /employee-health/pep-regimens/${pep_id}/transition"
              payload: { to_state: "STARTED", started_at: "2026-08-01T12:00:00Z" }
              as: EmployeeHealthPhysician
          trigger:
            - call: "GET /employee-health/serology-follow-ups"
              payload: { exposure_case_id: "${case_id}" }
              as: EmployeeHealthNurse
          assert:
            - "4 rows exist: BASELINE, WEEK_6, WEEK_12, MONTH_6"
            - "WEEK_6: scheduled_date == 2026-09-10T10:00:00Z, window_open == 2026-09-03T10:00:00Z, window_close == 2026-10-08T10:00:00Z, status SCHEDULED"
            - "WEEK_12: scheduled_date == 2026-10-22T10:00:00Z; MONTH_6: scheduled_date == 2027-01-28T10:00:00Z"
            - "BASELINE: scheduled_date == 2026-07-30T10:00:00Z, window_open == 2026-07-30T10:00:00Z, status DUE (now >= window_open after clock set)"

      - name: event_window_constants_applied
        claim_type: constants_applied
        grounds: ["calculations.contact_monitoring_window"]
        distinguishing_aspect: "PERTUSSIS constants: infectious_start == onset - 7 days; monitoring_window_days == 21; a contact's monitoring_end == contact_date + 21 days."
        test_recipe:
          setup: ["Index and contact employees; PERTUSSIS event onset 2026-08-10T00:00:00Z; contact_date 2026-08-06T00:00:00Z; clock 2026-08-10T00:00:00Z"]
