            - { call: "POST /v1/work-orders/${wo}/assign", payload: { technician_id: "${t1}" }, as: MaintenanceSupervisor, as_user_id: "${sup1}", captures: { st0: $.data.status } }
            - { call: "POST /v1/relocation-cases", payload: { unit_id: "${u}", call_ticket_id: "${tk}", start_date: "2026-08-03T00:00:00Z", end_date: "2026-08-05T00:00:00Z", nightly_rate_cents: 10000 }, as: OnCallTechnician, as_user_id: "${t1}", captures: { rc: $.data.id } }
