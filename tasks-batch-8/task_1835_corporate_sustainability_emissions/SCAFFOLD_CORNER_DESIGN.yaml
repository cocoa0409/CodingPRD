        grounds: [calculations.inventory_aggregation]
        distinguishing_aspect: "inventory_aggregation's input set filters on APPROVED only: SUBMITTED (999 therm) and REJECTED (999 therm) records contribute 0, so scope1 reflects only the approved 10 therm."
        test_recipe:
          setup: ["cycle FY2026 in DATA_COLLECTION; factor 1.0 tCO2e/therm; r1 APPROVED (10 therm), r2 SUBMITTED (999 therm), r3 REJECTED (999 therm)"]
