              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "POST /haulers"
              payload: { state_program_id: "00000000-0000-4000-8000-0000000000c1", company_name: "Orphan Hauling", service_regions: ["NORTH"], per_unit_rate_cents: 450, per_km_rate_cents: 180, max_route_payment_cents: 200000 }
