        excluded_because:
          difficulty_instance: dual_variant_calc / hra_claim_provisional_versus_final_eligible_amount
          rationale: "That instance asserts the PROVISIONAL variant at creation and the FINAL variant at approval on the same claim."

      - name: claim_variant_switch_reconciles_the_hra_ledger
        claim_type: Reconciliation
        grounds:
