# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Cryotherapy & Recovery Lounge — Expert
# Breadth probe across claim-extraction-guide sections. Stubs cite §1.8 names.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_location_returns_201_with_system_fields
        claim_type: Creation
        grounds:
          - entities.Location
          - endpoints["POST /locations"]
        distinguishing_aspect: "POST /locations with name/state_code/timezone returns 201, status=OPEN, open_booking_count=0, server-minted id, version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /locations"
              payload: { name: "Dallas", state_code: "TX", timezone: "America/Chicago" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id, st: $.data.status, oc: $.data.open_booking_count, v: $.data.version }
          assert:
            - "response code == 201"
            - "Location.${loc_id}.status == OPEN"
            - "Location.${loc_id}.open_booking_count == 0"
            - "Location.${loc_id}.version == 1"

      - name: create_member_missing_required_field_rejected
        claim_type: Required Fields
        grounds:
          - entities.Member.fields.email
          - validations[priority=6]
          - errors[ERR_INVALID_REQUEST]
          - endpoints["POST /members"]
        distinguishing_aspect: "POST /members omitting required email returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A location exists."]
          setup_api_calls:
            - call: "POST /locations"
              payload: { name: "L", state_code: "TX", timezone: "America/Chicago" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
          trigger:
            - call: "POST /members"
              payload: { home_location_id: "${loc_id}", full_name: "No Email", state_code: "TX" }
              as: LocationManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"

      - name: service_type_default_active_true_applied
        claim_type: Defaults
        grounds:
          - entities.ServiceType.fields.active
          - endpoints["POST /service-types"]
        distinguishing_aspect: "Omitting active on POST /service-types defaults active=true; omitting requires_medical_clearance defaults false."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /service-types"
              payload: { code: "RED_LIGHT", name: "Red Light", duration_minutes: 20, buffer_minutes: 5, credit_cost: 1 }
              as: PlatformAdmin
              captures: { svc_id: $.data.id, active: $.data.active, rmc: $.data.requires_medical_clearance }
          assert:
            - "ServiceType.${svc_id}.active == true"
            - "ServiceType.${svc_id}.requires_medical_clearance == false"

      - name: member_credit_balance_computed_ignores_client_input
        claim_type: Computed Fields
        grounds:
          - entities.Member.fields.credit_balance
          - calculations.member_credit_balance
          - endpoints["POST /members"]
        distinguishing_aspect: "credit_balance is computed; a fresh member with no sub or packs has credit_balance==0 regardless of any client-supplied value."
        test_recipe:
          setup: ["A location exists."]
          setup_api_calls:
            - call: "POST /locations"
              payload: { name: "L", state_code: "TX", timezone: "America/Chicago" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
          trigger:
            - call: "POST /members"
              payload: { home_location_id: "${loc_id}", email: "cb@x.com", full_name: "CB", state_code: "TX" }
              as: LocationManager
              captures: { m_id: $.data.id, bal: $.data.credit_balance }
          assert:
            - "Member.${m_id}.credit_balance == 0"

      - name: get_member_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=3]
          - errors[ERR_NOT_FOUND]
          - endpoints["GET /members/{member_id}"]
        distinguishing_aspect: "GET /members/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /members/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"

      - name: invoice_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.Invoice
          - endpoints["GET /invoices"]
        distinguishing_aspect: "Invoice has common_fields:false (id, created_at only); it is append-only with no update endpoint and no version field."
        test_recipe:
          setup: ["PLUS plan; member subscribes (a SIGNUP invoice is appended); clock 2026-06-01."]
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "PLUS", monthly_fee_cents: 16900, monthly_credit_grant: 8, rollover_cap: 4 }
              as: PlatformAdmin
              captures: { plus_plan_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "L", state_code: "TX", timezone: "America/Chicago" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { home_location_id: "${loc_id}", email: "inv@x.com", full_name: "Inv", state_code: "TX" }
              as: LocationManager
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/subscription"
              payload: { plan_id: "${plus_plan_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { sub_id: $.data.id }
          trigger:
            - call: "GET /invoices"
              payload: { subscription_id: "${sub_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { inv0_kind: "$.data[0].kind" }
          assert:
            - "GET /invoices?subscription_id returns exactly one SIGNUP invoice with amount_cents == 16900 and status == PAID"

  # ===========================================================================
  - section: endpoints
    instances:
      - name: list_locations_pagination_envelope
        claim_type: Listing
        grounds:
          - endpoints["GET /locations"]
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /locations returns response_type=array with pagination meta total_count and has_more honoring limit/offset."
        test_recipe:
          setup: ["Two locations created."]
          setup_api_calls:
            - call: "POST /locations"
              payload: { name: "L1", state_code: "TX", timezone: "America/Chicago" }
              as: PlatformAdmin
            - call: "POST /locations"
              payload: { name: "L2", state_code: "CA", timezone: "America/Los_Angeles" }
              as: PlatformAdmin
          trigger:
            - call: "GET /locations"
              payload: { limit: 1, offset: 0 }
              as: PlatformAdmin
          assert:
            - "response_type == array; data length == 1; meta.total_count == 2; meta.has_more == true"

      - name: list_pagination_limit_out_of_bounds_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=5]
          - errors[ERR_VALIDATION_PAGINATION]
          - endpoints["GET /locations"]
        distinguishing_aspect: "limit=101 (above max 100) on a list endpoint returns ERR_VALIDATION_PAGINATION (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /locations"
              payload: { limit: 101 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION_PAGINATION"

      - name: reverse_reachability_credit_packs_filtered_by_member
        claim_type: Cross-reference link
        grounds:
          - entities.CreditPack.fields.member_id
          - endpoints["GET /credit-packs"]
        distinguishing_aspect: "GET /credit-packs?member_id={id} returns the member's CreditPack[] (FK reverse-reachability for CreditPack.member_id)."
        test_recipe:
          setup: ["Member buys one STD pack of 5 credits; clock 2026-06-01."]
          setup_api_calls:
            - call: "POST /locations"
              payload: { name: "L", state_code: "TX", timezone: "America/Chicago" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { home_location_id: "${loc_id}", email: "rr@x.com", full_name: "RR", state_code: "TX" }
              as: LocationManager
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/credit-packs"
              payload: { total_credits: 5, is_intro: false }
              as: Member
              as_user_id: "${m_id}"
              captures: { pack_id: $.data.id }
          trigger:
            - call: "GET /credit-packs"
              payload: { member_id: "${m_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { first_id: "$.data[0].id" }
          assert:
            - "GET /credit-packs?member_id returns exactly 1 pack whose id == ${pack_id} and remaining_credits == 5"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: cancel_already_cancelled_booking_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Booking.transitions.BOOKED_to_CANCELLED
          - validations[priority=9]
          - errors[ERR_INVALID_STATE]
          - endpoints["POST /bookings/{booking_id}/cancel"]
        distinguishing_aspect: "A second cancel on an already-CANCELLED booking returns ERR_INVALID_STATE; no fee or refund re-applied."
        test_recipe:
          setup: ["BASE sub member books COMPRESSION far in future; cancels once (free); clock 2026-06-15."]
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "BASE", monthly_fee_cents: 9900, monthly_credit_grant: 4, rollover_cap: 0 }
              as: PlatformAdmin
              captures: { base_plan_id: $.data.id }
            - call: "POST /service-types"
              payload: { code: "COMPRESSION", name: "Compression", duration_minutes: 30, buffer_minutes: 0, credit_cost: 1, requires_medical_clearance: false }
              as: PlatformAdmin
              captures: { svc_comp_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "L", state_code: "TX", timezone: "America/Chicago" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /locations/${loc_id}/rooms"
              payload: { service_type_id: "${svc_comp_id}", name: "C1" }
              as: LocationManager
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /locations/${loc_id}/technicians"
              payload: { full_name: "T" }
              as: LocationManager
              captures: { tech_id: $.data.id }
            - call: "POST /technicians/${tech_id}/shifts"
              payload: { location_id: "${loc_id}", starts_at: "2026-06-16T08:00:00Z", ends_at: "2026-06-16T18:00:00Z" }
              as: LocationManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { home_location_id: "${loc_id}", email: "cc@x.com", full_name: "CC", state_code: "TX" }
              as: LocationManager
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/waivers"
              payload: { screening_answers: { heart: false }, has_contraindication: false }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /members/${m_id}/subscription"
              payload: { plan_id: "${base_plan_id}" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /bookings"
              payload: { member_id: "${m_id}", location_id: "${loc_id}", room_id: "${room_id}", starts_at: "2026-06-16T10:00:00Z", expected_room_version: "${room_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /bookings/${booking_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Member.${m_id}.credit_balance == 4 (no double refund)"

      - name: terminal_cancelled_subscription_cannot_freeze
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Subscription.transitions.ACTIVE_to_CANCELLED
          - validations[priority=9]
          - errors[ERR_INVALID_STATE]
          - endpoints["POST /subscriptions/{subscription_id}/freeze"]
        distinguishing_aspect: "A CANCELLED subscription (terminal) rejects freeze with ERR_INVALID_STATE."
        test_recipe:
          setup: ["PLUS member subscribes then cancels; clock 2026-06-01."]
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "PLUS", monthly_fee_cents: 16900, monthly_credit_grant: 8, rollover_cap: 4 }
              as: PlatformAdmin
              captures: { plus_plan_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "L", state_code: "TX", timezone: "America/Chicago" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { home_location_id: "${loc_id}", email: "tc@x.com", full_name: "TC", state_code: "TX" }
              as: LocationManager
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/subscription"
              payload: { plan_id: "${plus_plan_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /subscriptions/${sub_id}/freeze"
              payload: { freeze_cycles: 1 }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Subscription.${sub_id}.status == CANCELLED (unchanged)"

      - name: signing_new_waiver_supersedes_prior_active
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Waiver.transitions.ACTIVE_to_SUPERSEDED
          - entities.Waiver.fields.status
          - endpoints["POST /members/{member_id}/waivers"]
        distinguishing_aspect: "Signing a second waiver flips the prior ACTIVE waiver to SUPERSEDED and recomputes contraindication_flag from the new one."
        test_recipe:
          setup: ["Member with one ACTIVE waiver (has_contraindication=false); clock 2026-06-01."]
          setup_api_calls:
            - call: "POST /locations"
              payload: { name: "L", state_code: "TX", timezone: "America/Chicago" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { home_location_id: "${loc_id}", email: "sw@x.com", full_name: "SW", state_code: "TX" }
              as: LocationManager
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/waivers"
              payload: { screening_answers: { heart: false }, has_contraindication: false }
              as: Member
              as_user_id: "${m_id}"
              captures: { w1_id: $.data.id }
          trigger:
            - call: "POST /members/${m_id}/waivers"
              payload: { screening_answers: { heart: true }, has_contraindication: true }
              as: Member
              as_user_id: "${m_id}"
              captures: { w2_id: $.data.id, w2_status: $.data.status }
          assert:
            - "Waiver.${w1_id}.status == SUPERSEDED"
            - "Waiver.${w2_id}.status == ACTIVE"
            - "Member.${m_id}.contraindication_flag == true"

      - name: location_reopen_clears_closed_block
        claim_type: cyclic
        grounds:
          - state_machines.Location.transitions.CLOSED_to_OPEN
          - entities.Location.fields.status
          - endpoints["POST /locations/{location_id}/open"]
        distinguishing_aspect: "A CLOSED location re-opens via POST /locations/{id}/open returning status==OPEN (OPEN<->CLOSED cycle)."
        test_recipe:
          setup: ["Location created then closed."]
          setup_api_calls:
            - call: "POST /locations"
              payload: { name: "L", state_code: "TX", timezone: "America/Chicago" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /locations/${loc_id}/close"
              payload: {}
              as: LocationManager
          trigger:
            - call: "POST /locations/${loc_id}/open"
              payload: {}
              as: LocationManager
              captures: { st: $.data.status }
          assert:
            - "Location.${loc_id}.status == OPEN"

      - name: complete_booking_before_start_time_invalid_state
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Booking.transitions.BOOKED_to_COMPLETED
          - validations[priority=9]
          - errors[ERR_INVALID_STATE]
          - endpoints["POST /bookings/{booking_id}/complete"]
        distinguishing_aspect: "complete is rejected ERR_INVALID_STATE when clock < booking.starts_at (the precondition clock >= starts_at fails)."
        test_recipe:
          setup: ["BASE member books COMPRESSION at 2026-06-15T10:00:00Z; clock stays at 2026-06-15T09:00:00Z (before start); covering shift exists."]
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "BASE", monthly_fee_cents: 9900, monthly_credit_grant: 4, rollover_cap: 0 }
              as: PlatformAdmin
              captures: { base_plan_id: $.data.id }
            - call: "POST /service-types"
              payload: { code: "COMPRESSION", name: "Compression", duration_minutes: 30, buffer_minutes: 0, credit_cost: 1, requires_medical_clearance: false }
              as: PlatformAdmin
              captures: { svc_comp_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "L", state_code: "TX", timezone: "America/Chicago" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /locations/${loc_id}/rooms"
              payload: { service_type_id: "${svc_comp_id}", name: "C1" }
              as: LocationManager
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /locations/${loc_id}/technicians"
              payload: { full_name: "T" }
              as: LocationManager
              captures: { tech_id: $.data.id }
            - call: "POST /technicians/${tech_id}/shifts"
              payload: { location_id: "${loc_id}", starts_at: "2026-06-15T08:00:00Z", ends_at: "2026-06-15T18:00:00Z" }
              as: LocationManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { home_location_id: "${loc_id}", email: "cb2@x.com", full_name: "CB2", state_code: "TX" }
              as: LocationManager
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/waivers"
              payload: { screening_answers: { heart: false }, has_contraindication: false }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /members/${m_id}/subscription"
              payload: { plan_id: "${base_plan_id}" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /bookings"
              payload: { member_id: "${m_id}", location_id: "${loc_id}", room_id: "${room_id}", starts_at: "2026-06-15T10:00:00Z", expected_room_version: "${room_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { booking_id: $.data.id }
          trigger:
            - call: "POST /bookings/${booking_id}/complete"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Booking.${booking_id}.status == BOOKED (unchanged)"

  # ===========================================================================
  - section: validations
    instances:
      - name: error_reference_not_found_bad_plan_on_subscribe
        claim_type: violation_to_error
        grounds:
          - validations[priority=4]
          - errors[ERR_REFERENCE_NOT_FOUND]
          - endpoints["POST /members/{member_id}/subscription"]
        distinguishing_aspect: "Subscribing with a non-existent plan_id returns ERR_REFERENCE_NOT_FOUND (404)."
        test_recipe:
          setup: ["A member exists, no plans created."]
          setup_api_calls:
            - call: "POST /locations"
              payload: { name: "L", state_code: "TX", timezone: "America/Chicago" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /members"
              payload: { home_location_id: "${loc_id}", email: "rnf@x.com", full_name: "RNF", state_code: "TX" }
              as: LocationManager
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /members/${m_id}/subscription"
              payload: { plan_id: "00000000-0000-4000-8000-000000000000" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_REFERENCE_NOT_FOUND"

      - name: error_intro_already_used_second_intro_pack
        claim_type: violation_to_error
        grounds:
          - validations[priority=18]
          - errors[ERR_INTRO_ALREADY_USED]
          - entities.Member.fields.intro_offer_used
          - endpoints["POST /members/{member_id}/credit-packs"]
        distinguishing_aspect: "A second is_intro=true purchase returns ERR_INTRO_ALREADY_USED after the first set intro_offer_used=true."
        test_recipe:
          setup: ["Member buys one intro pack; clock 2026-06-01."]
          setup_api_calls:
            - call: "POST /locations"
              payload: { name: "L", state_code: "TX", timezone: "America/Chicago" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { home_location_id: "${loc_id}", email: "ia@x.com", full_name: "IA", state_code: "TX" }
              as: LocationManager
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/credit-packs"
              payload: { total_credits: 4, is_intro: true }
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /members/${m_id}/credit-packs"
              payload: { total_credits: 4, is_intro: true }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INTRO_ALREADY_USED"

      - name: error_not_an_upgrade_to_lower_fee_plan
        claim_type: violation_to_error
        grounds:
          - validations[priority=19]
          - errors[ERR_NOT_AN_UPGRADE]
          - endpoints["POST /subscriptions/{subscription_id}/upgrade"]
        distinguishing_aspect: "Upgrading from PLUS to BASE (lower fee) returns ERR_NOT_AN_UPGRADE."
        test_recipe:
          setup: ["BASE and PLUS plans; member on PLUS; clock 2026-06-01."]
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "BASE", monthly_fee_cents: 9900, monthly_credit_grant: 4, rollover_cap: 0 }
              as: PlatformAdmin
              captures: { base_plan_id: $.data.id }
