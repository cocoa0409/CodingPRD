      - name: same_report_settles_to_different_dollars_under_the_two_apportionment_variants
        claim_type: Variant Divergence
        grounds:
          - calculations.stepdown_allocation
          - entities.StepdownRun.fields.method
        excluded_because:
          difficulty_instance: dual_variant_calc / stepdown_single_vs_double_apportionment_divergence
          rationale: "That instance runs both variants over identical inputs and asserts the 380953-cent divergence in total_allowable_cost_cents plus the per-center deltas."

      - name: switching_the_apportionment_variant_reconciles_the_cost_center_ledger
        claim_type: Reconciliation
        grounds:
          - calculations.stepdown_allocation
          - entities.CostCenter.fields.allocated_total_cost_cents
        excluded_because:
          difficulty_instance: dual_variant_calc / stepdown_single_vs_double_apportionment_divergence
          rationale: "The same instance asserts the post-switch per-center ledger (05000 165047620, 09000 20952380) and that the three receivers still sum to 470000000, i.e. the delta reconciles."

      - name: occupational_mix_weights_renormalize_without_rounding_drift
        claim_type: weighted_scoring
        grounds:
          - calculations.average_hourly_wage
          - entities.WageIndexSubmission.fields.occ_mix_adjusted_ahw_cents
        excluded_because:
          difficulty_instance: dual_variant_calc / wage_index_unadjusted_vs_occ_mix_adjusted_hourly_wage
          rationale: "Weight renormalization over the staffed categories, the pinned drift rule and the resulting occ_mix_adjusted_ahw_cents are asserted there."

      - name: dsh_eligibility_at_the_fifteen_percent_threshold
        claim_type: threshold
        grounds:
          - calculations.dsh_and_ucc_compilation
          - entities.UccDataSet.fields.dsh_eligible
        excluded_because:
          difficulty_instance: boundary_precision_check / dsh_patient_percentage_exactly_at_eligibility_threshold
          rationale: "That instance pins dsh_patient_percentage to exactly 0.1500 and contrasts the round-then-sum result with the sum-then-round trap value 0.1499."

      - name: stepdown_remainder_cents_are_spread_by_the_pinned_order
        claim_type: waterfall_allocation
        grounds:
          - calculations.stepdown_allocation
          - entities.StepdownRun.fields.allocation_lines
        excluded_because:
          difficulty_instance: combinatorial_formula / stepdown_floor_then_remainder_rounding_order_with_created_at_tie_break
          rationale: "Floor-per-receiver, the 1-cent remainder spread by fractional part DESC and the created_at ASC tie-break are all asserted there."

      - name: rotation_reversal_restores_the_running_fte_day_total
        claim_type: aggregation
        grounds:
          - calculations.gme_fte_rolling_average
          - entities.CostReport.fields.unweighted_fte_days_total
        excluded_because:
          difficulty_instance: compensating_invariant / rotation_void_conserves_resident_fte_days
          rationale: "Running total after add and after reversal, with no 0.0001 drift, is that instance's assertion set."

      - name: interim_rate_projection_reaches_a_fixed_point_through_the_cap_chain
        claim_type: constraint_propagation
        grounds:
          - calculations.interim_rate_projection
          - entities.InterimRateRequest.fields.variance_ratio
        excluded_because:
          difficulty_instance: combinatorial_formula / interim_rate_variance_measured_before_cap_is_applied
          rationale: "The normative step order (project, measure variance pre-cap, gate, cap, price) and its propagation into approved_rate_cents and adjustment_amount_cents are asserted there."

