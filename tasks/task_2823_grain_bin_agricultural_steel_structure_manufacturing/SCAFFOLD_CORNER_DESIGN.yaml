      - name: the_four_hop_recall_chain_is_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
        excluded_because:
          difficulty_instance: "transitive_cascade / structural_underdesign_determination_cascades_design_recall_to_order_hold_to_load_detach_to_load_cancel"
          rationale: "That §1.8 instance drives the longest chain in the API - determination to design RECALLED to order HOLD_ENGINEERING to load detach to load CANCELLED - and asserts each hop's fields plus the ordering sensitivity, which is the whole of this layer's claim set."

      - name: the_same_bin_yields_two_stiffener_counts_under_the_two_design_methods
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
        excluded_because:
          difficulty_instance: "dual_variant_calc / asd_vs_lrfd_stiffener_count_diverges_on_identical_bin_design"
          rationale: "That §1.8 instance runs both variants on one geometry, asserts the allowable 90.0 versus 101.25 and the resulting count and utilization delta, and confirms the switch is driven by design_method alone - both variants plus the delta on switch."

      - name: the_surcharge_and_credit_thresholds_are_probed_at_their_boundaries
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers.rate_threshold_triggers
        excluded_because:
          difficulty_instance: "combinatorial_formula / order_freight_surcharge_tier_keyed_on_net_subtotal_not_on_total"
          rationale: "That §1.8 instance sits one cent either side of the 6000000 surcharge tier edge on net_subtotal_cents while the total crosses it in the other direction, which is the instantaneous-threshold claim; the cumulative-threshold claim is carried by the credit ledger instances that straddle credit_available_cents 0."

  - section: consistency_model
    instances:
      - name: every_cascade_hop_is_already_settled_in_the_response_that_caused_it
        claim_type: immediate_visibility
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST /dealers/{id}/credit-limit
          - endpoints.POST /dealer-orders/{id}/cancel
          - calculations.dealer_credit_ledger
        distinguishing_aspect: "The declared consistency model is immediate, so there is no denormalization lag anywhere: the response body of the request that triggers a cascade must ALREADY carry the cascaded values. This instance pins that down on the deepest multi-entity recomputation in the API - the credit ledger - in both directions. The POST /dealers/{id}/credit-limit response itself reports status CREDIT_HOLD and credit_available_cents -1 (not the pre-request ACTIVE / 896000532), and the order read taken immediately afterwards with no intervening write already reports HOLD_CREDIT. Symmetrically the POST /dealer-orders/{id}/cancel response already reports CANCELLED / VOIDED with credit_hold_cents 0, and the dealer read taken immediately afterwards already reports the recomputed committed 1999734, available 1999733 and status ACTIVE, with the surviving order already back at QUEUED. Each of those reads is then repeated verbatim and must return byte-identical field values - an eventual-consistency implementation that settles denormalized fields on a later read, or that returns the stale entity from the mutating call and only fixes it on re-read, is caught by the first assert of each pair rather than the second."
        test_recipe:
          setup:
            - "Jurisdiction NE-WEST (seal_required false, permit_review_days 0), GrainProfile CORN, CoatingSpec G115, engineer PE-1001."
            - "Dealer Alpha with credit_limit_cents 900000000, program_tier BASE."
            - "BinDesign D1 12.0 m x 9.6 m ASD, analysed under ASD and submitted for review so it sits in UNDER_REVIEW."
            - "Two orders O1 and O2 on D1, each OFFSEASON / BASE / NONE / GRAVITY, each with its 499933 deposit posted and each confirmed, so both are QUEUED holding 1999734 apiece."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "NE-WEST", name: "Nebraska West", seal_required: false, min_design_wind_speed_mph: 95, seismic_design_category: "A", permit_review_days: 0 }
              as: PlantAdmin
              captures: { j_ne_id: $.data.id }
            - call: "POST /grain-profiles"
              payload: { grain_code: "CORN", bulk_density_kg_per_m3: 721, janssen_k_ratio: 0.42, max_safe_moisture_pct: 15.0, aeration_cfm_per_m3_base: 2.5, drying_multiplier: 4.0 }
              as: PlantAdmin
              captures: { gp_corn_id: $.data.id }
            - call: "POST /coating-specs"
              payload: { coating_code: "G115", zinc_mass_g_per_m2: 350, coating_cost_per_kg_cents: 42, changeover_minutes: 120, max_ambient_moisture_pct: 18.0 }
              as: PlantAdmin
              captures: { cs_g115_id: $.data.id }
            - call: "POST /engineers"
              payload: { name: "Dana Author", license_number: "PE-1001", licensed_jurisdiction_codes: ["IA-CENTRAL", "NE-WEST", "CA-VALLEY"] }
              as: PlantAdmin
              captures: { eng_a_id: $.data.id }
            - call: "POST /dealers"
              payload: { name: "Alpha Grain Systems", region_code: "NE-01", jurisdiction_id: "${j_ne_id}", credit_limit_cents: 900000000, program_tier: "BASE", staging_slots: 2, high_cube_access: true }
              as: PlantAdmin
              captures: { dlr_a_id: $.data.id }
            - call: "POST /bin-designs"
              payload: { dealer_id: "${dlr_a_id}", jurisdiction_id: "${j_ne_id}", grain_profile_id: "${gp_corn_id}", coating_spec_id: "${cs_g115_id}", diameter_m: 12.0, eave_height_m: 9.6, roof_pitch_deg: 30, design_wind_speed_mph: 105, moisture_pct: 14.0, design_method: "ASD" }
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              captures: { d1_id: $.data.id, d1_ver: $.data.version }
            - call: "POST /bin-designs/${d1_id}/analyses"
              payload: { design_method: "ASD", expected_bin_design_version: "${d1_ver}" }
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              captures: { an1_verdict: $.data.verdict }
            - call: "POST /bin-designs/${d1_id}/submit-review"
              payload: {}
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              captures: { d1_status: $.data.status }
            - call: "POST /dealer-orders"
              payload: { dealer_id: "${dlr_a_id}", bin_design_id: "${d1_id}", order_season: "OFFSEASON", aeration_package: "NONE", unload_system: "GRAVITY" }
              as: DealerPrincipal
              as_user_id: "${dlr_a_id}"
              captures: { o1_id: $.data.id, o1_dep: $.data.required_deposit_cents, o1_hold: $.data.credit_hold_cents }
            - call: "POST /dealer-orders/${o1_id}/payments"
              payload: { amount_cents: 499933 }
              as: DealerPrincipal
              as_user_id: "${dlr_a_id}"
              captures: { o1_fin: $.data.financial_status }
            - call: "POST /dealer-orders/${o1_id}/confirm"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${dlr_a_id}"
              captures: { o1_prod: $.data.production_status }
            - call: "POST /dealer-orders"
              payload: { dealer_id: "${dlr_a_id}", bin_design_id: "${d1_id}", order_season: "OFFSEASON", aeration_package: "NONE", unload_system: "GRAVITY" }
              as: DealerPrincipal
              as_user_id: "${dlr_a_id}"
              captures: { o2_id: $.data.id }
            - call: "POST /dealer-orders/${o2_id}/payments"
              payload: { amount_cents: 499933 }
              as: DealerPrincipal
              as_user_id: "${dlr_a_id}"
              captures: { o2_fin: $.data.financial_status }
            - call: "POST /dealer-orders/${o2_id}/confirm"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${dlr_a_id}"
              captures: { o2_prod: $.data.production_status, o2_hold: $.data.credit_hold_cents }
            - call: "GET /dealers/${dlr_a_id}"
              payload: {}
              as: PlantAdmin
              captures: { pre_status: $.data.status, pre_comm: $.data.credit_committed_cents, pre_avail: $.data.credit_available_cents }
          trigger:
            - call: "POST /dealers/${dlr_a_id}/credit-limit"
              payload: { credit_limit_cents: 3999467 }
              as: PlantAdmin
              captures: { cut_status: $.data.status, cut_comm: $.data.credit_committed_cents, cut_avail: $.data.credit_available_cents, cut_limit: $.data.credit_limit_cents }
            - call: "GET /dealer-orders/${o1_id}"
              payload: {}
              as: PlantAdmin
              captures: { o1_after_cut: $.data.production_status, o1_hold_cut: $.data.credit_hold_cents }
            - call: "GET /dealer-orders/${o1_id}"
              payload: {}
              as: PlantAdmin
              captures: { o1_after_cut2: $.data.production_status, o1_hold_cut2: $.data.credit_hold_cents }
            - call: "GET /dealer-orders/${o2_id}"
              payload: {}
              as: PlantAdmin
              captures: { o2_after_cut: $.data.production_status }
            - call: "GET /dealers/${dlr_a_id}"
              payload: {}
              as: PlantAdmin
              captures: { re_status: $.data.status, re_comm: $.data.credit_committed_cents, re_avail: $.data.credit_available_cents }
            - call: "POST /dealer-orders/${o1_id}/cancel"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${dlr_a_id}"
              captures: { c_prod: $.data.production_status, c_fin: $.data.financial_status, c_hold: $.data.credit_hold_cents }
            - call: "GET /dealers/${dlr_a_id}"
              payload: {}
              as: PlantAdmin
              captures: { post_status: $.data.status, post_comm: $.data.credit_committed_cents, post_avail: $.data.credit_available_cents }
            - call: "GET /dealers/${dlr_a_id}"
              payload: {}
              as: PlantAdmin
              captures: { post_status2: $.data.status, post_comm2: $.data.credit_committed_cents, post_avail2: $.data.credit_available_cents }
            - call: "GET /dealer-orders/${o2_id}"
              payload: {}
              as: PlantAdmin
              captures: { o2_final: $.data.production_status }
            - call: "GET /dealer-orders/${o1_id}"
              payload: {}
              as: PlantAdmin
              captures: { o1_final: $.data.production_status, o1_final_fin: $.data.financial_status, o1_final_hold: $.data.credit_hold_cents }
          assert:
            - "before the cut the dealer reads status ACTIVE, credit_committed_cents 3999468 == 2 * 1999734 and credit_available_cents 896000532, and both orders are QUEUED"
            - "the POST /dealers/{id}/credit-limit response ITSELF reports credit_limit_cents 3999467, credit_committed_cents 3999468, credit_available_cents -1 and status CREDIT_HOLD - the mutating call does not return the pre-request ACTIVE / 896000532 snapshot"
            - "the very next read of O1, with no intervening write, already reports production_status HOLD_CREDIT, and its credit_hold_cents is unchanged at 1999734 because a credit hold does not release the order's own hold amount"
            - "repeating that same read returns identical values - HOLD_CREDIT and 1999734 - so nothing settled between the two reads"
            - "O2 is likewise already HOLD_CREDIT, and re-reading the dealer returns exactly the ledger the mutating response reported: CREDIT_HOLD, 3999468, -1"
            - "the POST /dealer-orders/{id}/cancel response ITSELF reports production_status CANCELLED, financial_status VOIDED and credit_hold_cents 0"
            - "the dealer read taken immediately after that cancel already reports the recomputed ledger credit_committed_cents 1999734, credit_available_cents 1999733 == 3999467 - 1999734 and status ACTIVE, and repeating it returns identical values"
            - "O2 has already been requeued to QUEUED by the release cascade, and O1 stays terminal at CANCELLED / VOIDED with credit_hold_cents 0 on every later read"
