      - name: meeting_spacing_buffer_24h
        grounds:
          - validations[priority=74]
          - entities.Meeting.fields.scheduled_date
        distinguishing_aspect: "Board resource, closed +/-24h buffer around a point instant: a second meeting 12h from the first is rejected with ERR_MEETING_TOO_CLOSE (buffer arithmetic, distinct from the seat's half-open range semantics)."
