  - section: calculations
    instances:

      - name: self_attested_missing_metrics_each_score_one_point
        claim_type: Input Set Filtering
        grounds:
          - calculations.health_risk_score
          - entities.HealthAssessment.fields.source_type
        distinguishing_aspect: "On the SELF_ATTESTED branch only bmi and self_reported_tobacco are required; the absent blood-pressure pair, a1c and ldl each add 1 point, giving raw 4 which the 1.25 multiplier lifts to exactly 5."
        test_recipe:
          setup: ["One ACTIVE participant; no visit is needed because SELF_ATTESTED rows carry no visit_id."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /employers"
              payload: { legal_name: "Attest Co", employer_code: "ATS", annual_total_cost_of_coverage_cents: 1200000, wellness_budget_cents: 250000 }
              as: ProgramAdmin
              captures: { emp_id: $.data.id }
