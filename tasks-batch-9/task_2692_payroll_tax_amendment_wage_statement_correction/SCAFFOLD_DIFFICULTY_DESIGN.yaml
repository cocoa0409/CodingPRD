            - call: "POST /amended-returns/${ar1_id}/void"
              payload: { void_reason: "Prepared against a stale rate table; withdrawing the figures." }
              as: TaxOfficer
              as_user_id: "u_off_bree"
            - call: "GET /correction-cases/${case_id}"
              payload: {}
              as: TaxPreparer
              captures: { case_ver2: "$.data.version" }
