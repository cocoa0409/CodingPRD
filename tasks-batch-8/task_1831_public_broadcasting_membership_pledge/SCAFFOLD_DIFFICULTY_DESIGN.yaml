              as: StationAdmin
            - call: "POST /station/donors"
              payload: { email: "d14@x.com", full_name: "Donor Fourteen", postal_code: "97214" }
              as: MembershipCoordinator
              captures: { donor14_id: $.data.id }
            - call: "POST /station/memberships"
