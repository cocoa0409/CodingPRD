      - name: criteria_revision_spares_draft_and_other_jurisdiction_configurations
        claim_type: conditional_cascade
        grounds:
          - state_machines.BuildingConfiguration.transitions[LOCKED->CRITERIA_STALE].preconditions
          - endpoints[POST /jurisdictions/{id}/loading-criteria]
        distinguishing_aspect: "The staleness cascade is doubly conditional: it fires only on configurations whose status is LOCKED and whose jurisdiction_id is the revised one. A DRAFT configuration in the same jurisdiction and a LOCKED configuration in a different jurisdiction are both left untouched, including their versions."
        test_recipe:
          setup:
            - "Clock 2026-08-05T00:00:00Z; two jurisdictions TX-HARRIS (j1) and TX-BEXAR (j2) in the same territory TX-GULF; one AUTHORIZED builder b1."
            - "cfg_locked is LOCKED against j1; cfg_draft stays DRAFT against j1; cfg_other is LOCKED against j2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "TX-HARRIS", name: "Harris County TX", state_code: "TX", territory_code: "TX-GULF", freight_zone: 3, exposure_category: "C", design_wind_speed_mph: 140, ground_snow_load_psf: 5, seismic_design_category: "A", max_authorized_builders: 2 }
              as: PlatformAdmin
              captures: { j1_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { code: "TX-BEXAR", name: "Bexar County TX", state_code: "TX", territory_code: "TX-GULF", freight_zone: 3, exposure_category: "C", design_wind_speed_mph: 140, ground_snow_load_psf: 5, seismic_design_category: "A", max_authorized_builders: 2 }
              as: PlatformAdmin
              captures: { j2_id: $.data.id }
            - call: "POST /builders"
              payload: { jurisdiction_id: "${j1_id}", name: "Gulf Steel Builders", tier: "SILVER", credit_limit_cents: 200000000 }
              as: PlatformAdmin
              captures: { b1_id: $.data.id }
            - call: "POST /builders/${b1_id}/authorize"
              payload: {}
              as: PlatformAdmin
            - call: "POST /building-configurations"
              payload: { builder_id: "${b1_id}", jurisdiction_id: "${j1_id}", clear_span_ft: 100, bay_spacing_ft: 25, bay_count: 4, eave_height_ft: 24, roof_pitch_rise_per_12: 1, panel_profile: "PBR", panel_color: "POLAR_WHITE", insulation_r_value: 19 }
              as: SalesEngineer
              captures: { cfg_locked_id: $.data.id }
            - call: "POST /building-configurations/${cfg_locked_id}/lock"
              payload: {}
              as: SalesEngineer
              captures: { cfg_locked_v: $.data.version }
            - call: "POST /building-configurations"
              payload: { builder_id: "${b1_id}", jurisdiction_id: "${j1_id}", clear_span_ft: 80, bay_spacing_ft: 25, bay_count: 4, eave_height_ft: 20, roof_pitch_rise_per_12: 1, panel_profile: "PBR", panel_color: "POLAR_WHITE", insulation_r_value: 13 }
              as: SalesEngineer
              captures: { cfg_draft_id: $.data.id }
            - call: "POST /building-configurations"
              payload: { builder_id: "${b1_id}", jurisdiction_id: "${j2_id}", clear_span_ft: 100, bay_spacing_ft: 25, bay_count: 4, eave_height_ft: 24, roof_pitch_rise_per_12: 1, panel_profile: "PBR", panel_color: "POLAR_WHITE", insulation_r_value: 19 }
              as: SalesEngineer
              captures: { cfg_other_id: $.data.id }
            - call: "POST /building-configurations/${cfg_other_id}/lock"
              payload: {}
              as: SalesEngineer
              captures: { cfg_other_v: $.data.version }
          trigger:
