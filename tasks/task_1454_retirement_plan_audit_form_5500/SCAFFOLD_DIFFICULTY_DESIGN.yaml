        grounds:
          - calculations.late_deposit_business_days
          - entities.LateContributionAssessment.fields.business_days_late
        distinguishing_aspect: |
          Metric = business-day interval, endpoint = late-deposit-scan: a
          deposit exactly 7 business days after payroll is ON_TIME (the
