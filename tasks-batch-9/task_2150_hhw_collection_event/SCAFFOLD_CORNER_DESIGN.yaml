        claim_type: role_denied_ops
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_CONTEXT_HEADER]"]
        distinguishing_aspect: "With no X-User-Role / X-User-ID headers at all, POST /hhw/programs returns ERR_MISSING_CONTEXT_HEADER (400) before any body validation runs."
        test_recipe:
