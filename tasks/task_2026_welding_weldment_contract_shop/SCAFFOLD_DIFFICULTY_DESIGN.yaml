            - call: "POST /weld-shop/shops/${shop_id}/joints/${joint_id}/weld-out"
              payload: {}
              as: WeldLead
            # Record VT PASS — joint moves to VT_PASSED
            - call: "POST /weld-shop/shops/${shop_id}/joints/${joint_id}/inspections"
              payload: { method: "VT", scheduled_start_utc: "2026-08-02T09:00:00Z", scheduled_end_utc: "2026-08-02T09:30:00Z", result: "PASS", result_code: "OK" }
              as: CWI
              captures: { vt_id: $.data.id }
            # Schedule first UT at [09:00, 10:00)
            - call: "POST /weld-shop/shops/${shop_id}/joints/${joint_id}/inspections"
              payload: { method: "UT", scheduled_start_utc: "2026-08-03T09:00:00Z", scheduled_end_utc: "2026-08-03T10:00:00Z", vendor_id: "${vendor_id}" }
              as: CWI
              captures: { ut1_id: $.data.id }
          trigger:
            # Adjacent (non-overlapping) — should succeed
            - call: "POST /weld-shop/shops/${shop_id}/joints/${joint_id}/inspections"
              payload: { method: "UT", scheduled_start_utc: "2026-08-03T10:00:00Z", scheduled_end_utc: "2026-08-03T11:00:00Z", vendor_id: "${vendor_id}" }
              as: CWI
              captures: { ut2_id: $.data.id }
            # Overlapping — should fail with vendor capacity 1
            - call: "POST /weld-shop/shops/${shop_id}/joints/${joint_id}/inspections"
              payload: { method: "UT", scheduled_start_utc: "2026-08-03T09:30:00Z", scheduled_end_utc: "2026-08-03T10:30:00Z", vendor_id: "${vendor_id}" }
              as: CWI
              captures: { ut_overlap_err: $.data.error_id }
          assert:
            - "UT [10:00, 11:00) scheduling succeeds (adjacent, half-open boundary not treated as conflict)"
            - "ut_overlap_err == 'ERR_NDT_VENDOR_SLOT_CONFLICT' (overlapping [09:30,10:30) with capacity 1 is rejected)"

