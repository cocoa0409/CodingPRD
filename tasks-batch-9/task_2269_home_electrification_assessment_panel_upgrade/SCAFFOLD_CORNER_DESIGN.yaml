      - name: each_role_is_locked_out_of_the_other_roles_exclusive_operations
        claim_type: exclusive_operations
        grounds:
          - roles.Applicant.exclusive_operations
          - roles.Contractor.exclusive_operations
          - roles.FieldInspector.exclusive_operations
          - roles.ProgramReviewer.exclusive_operations
          - roles.ProgramAdmin.exclusive_operations
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: |
          The lock-out is symmetric and includes the privileged roles: an
          Applicant cannot verify income, a Contractor cannot review a project,
          a FieldInspector cannot schedule an inspection, a ProgramReviewer
          cannot record an inspection result and — the case that catches
          "admin can do anything" implementations — a ProgramAdmin cannot
          review a project or verify an income verification either.
        test_recipe:
          setup:
            - "One OPEN program with the BASE MEASURE catalog item, a household with a SUBMITTED IncomeVerification, an ENROLLED_ACTIVE contractor, an inspector, and an approved project reported INSTALLED with a SCHEDULED POST_INSTALL inspection."
