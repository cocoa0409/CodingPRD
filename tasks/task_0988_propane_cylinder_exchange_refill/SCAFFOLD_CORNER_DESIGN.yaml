              payload: { site_id: "${s_id}", expected_site_version: "${s_v}", swap_price_cents: 2499, core_deposit_cents: 3500, tax_rate_bps: 825, refill_tier1_cents_per_lb: 349, refill_tier1_max_lbs: 15.00, refill_tier2_cents_per_lb: 299, effective_from: "2026-05-01" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "SN-NEW", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2021-03-10", initial_fill: FULL, current_site_id: "${s_id}" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "SN-OLD", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2019-06-01", initial_fill: FULL, current_site_id: "${s_id}" }
              as: PlatformAdmin
              captures: { c_old: $.data.id }
          trigger:
            - call: "POST /exchange-orders"
              payload: { site_id: "${s_id}" }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { o_id: $.data.id }
            - call: "POST /exchange-orders/${o_id}/complete"
              payload: { payment_cash_cents: 6494 }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { o_issued: $.data.issued_cylinder_id }
          assert:
            - "issued_cylinder_id == ${c_old} (oldest certified_on first, even though NEWER was registered first)"

      - name: selector_empty_pool_returns_no_stock
        claim_type: correct_result
        grounds:
          - calculations.cylinder_issue_selector
          - errors[ERR_NO_STOCK]
        distinguishing_aspect: "full_on_hand is 1 but the only full cylinder is RECERT_DUE (excluded by the selector): completion fails with ERR_NO_STOCK — derived count and sellable pool disagree."
        test_recipe:
          setup: ["site S with policy; 1 FULL fleet cylinder manufacture 2014-06-01; clock advanced to 2026-06-02 (cylinder RECERT_DUE); DRAFT order"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "S", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /pricing-policies"
              payload: { site_id: "${s_id}", expected_site_version: "${s_v}", swap_price_cents: 2499, core_deposit_cents: 3500, tax_rate_bps: 825, refill_tier1_cents_per_lb: 349, refill_tier1_max_lbs: 15.00, refill_tier2_cents_per_lb: 299, effective_from: "2026-05-01" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "SN-NS", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2014-06-01", initial_fill: FULL, current_site_id: "${s_id}" }
              as: PlatformAdmin
            - call: "POST /exchange-orders"
              payload: { site_id: "${s_id}" }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { o_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /exchange-orders/${o_id}/complete"
              payload: { payment_cash_cents: 6494 }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NO_STOCK; http status 409"

  # ================================================== Validations
  - section: validations
    instances:
      - name: exchange_create_missing_auth_returns_401
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request without X-User-Role/X-User-ID headers is rejected 401 before any other check (the unit test strips the headers entirely; as: below only documents the intended role)."
        test_recipe:
          setup: ["site S with policy (unused — auth fails first)"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "S", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000 }
              as: PlatformAdmin
          trigger:
            - call: "POST /exchange-orders"
              payload: { site_id: "00000000-0000-0000-0000-000000000000" }
              as: SiteClerk
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED; http status 401 (auth outranks even existence)"

      - name: exchange_create_bogus_return_reference
        claim_type: violation_to_error
        grounds:
          - validations[priority=4]
          - errors[ERR_REFERENCE_NOT_FOUND]
        distinguishing_aspect: "A returned_cylinder_id that does not exist fails with 422 ERR_REFERENCE_NOT_FOUND."
        test_recipe:
          setup: ["site S with policy"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "S", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /pricing-policies"
              payload: { site_id: "${s_id}", expected_site_version: "${s_v}", swap_price_cents: 2499, core_deposit_cents: 3500, tax_rate_bps: 825, refill_tier1_cents_per_lb: 349, refill_tier1_max_lbs: 15.00, refill_tier2_cents_per_lb: 299, effective_from: "2026-05-01" }
              as: PlatformAdmin
          trigger:
            - call: "POST /exchange-orders"
              payload: { site_id: "${s_id}", returned_cylinder_id: "00000000-0000-0000-0000-000000000000" }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_REFERENCE_NOT_FOUND; http status 422"

      - name: duplicate_session_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - errors[ERR_SESSION_EXISTS]
        distinguishing_aspect: "One reconciliation session per (site, business_date): the second create for the same pair fails with ERR_SESSION_EXISTS."
        test_recipe:
          setup: ["site S; session for 2026-05-01 already created"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "S", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /reconciliation-sessions"
              payload: { site_id: "${s_id}", business_date: "2026-05-01" }
              as: SiteClerk
              as_user_id: "clerk-1"
          trigger:
            - call: "POST /reconciliation-sessions"
              payload: { site_id: "${s_id}", business_date: "2026-05-01" }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SESSION_EXISTS; http status 409"

      - name: second_open_leak_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - errors[ERR_LEAK_ALREADY_OPEN]
        distinguishing_aspect: "A site may have at most one REPORTED or CONFIRMED leak; the second report fails with ERR_LEAK_ALREADY_OPEN."
        test_recipe:
          setup: ["site S with a REPORTED leak"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "S", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /leak-reports"
              payload: { site_id: "${s_id}", severity: MINOR }
              as: SiteClerk
              as_user_id: "clerk-1"
          trigger:
            - call: "POST /leak-reports"
              payload: { site_id: "${s_id}", severity: MAJOR }
              as: SiteClerk
              as_user_id: "clerk-2"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_LEAK_ALREADY_OPEN; http status 409"

      - name: refill_fleet_cylinder_not_refillable
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - errors[ERR_NOT_REFILLABLE]
        distinguishing_aspect: "Refill tickets accept only CUSTOMER cylinders; a FLEET cylinder fails with ERR_NOT_REFILLABLE."
        test_recipe:
          setup: ["site S with policy; 1 EMPTY FLEET cylinder at site"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "S", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /pricing-policies"
              payload: { site_id: "${s_id}", expected_site_version: "${s_v}", swap_price_cents: 2499, core_deposit_cents: 3500, tax_rate_bps: 825, refill_tier1_cents_per_lb: 349, refill_tier1_max_lbs: 15.00, refill_tier2_cents_per_lb: 299, effective_from: "2026-05-01" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "SN-NR", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: EMPTY, current_site_id: "${s_id}" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /refill-tickets"
              payload: { site_id: "${s_id}", cylinder_id: "${c_id}", pre_weight_lbs: 17.50 }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_REFILLABLE; http status 409"

      - name: tare_mismatch_beyond_tolerance
        claim_type: violation_to_error
        grounds:
          - calculations.refill_charge
          - errors[ERR_TARE_MISMATCH]
        distinguishing_aspect: "Tare tolerance is inclusive: measured 17.10 vs stamped 17.00 passes (0.10 <= 0.10); 17.11 fails with ERR_TARE_MISMATCH."
        test_recipe:
          setup: ["site S with policy; 1 EMPTY CUSTOMER cylinder (TW 17.00); two OPEN tickets A and B"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "S", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /pricing-policies"
              payload: { site_id: "${s_id}", expected_site_version: "${s_v}", swap_price_cents: 2499, core_deposit_cents: 3500, tax_rate_bps: 825, refill_tier1_cents_per_lb: 349, refill_tier1_max_lbs: 15.00, refill_tier2_cents_per_lb: 299, effective_from: "2026-05-01" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "SN-TM", owner_kind: CUSTOMER, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: EMPTY }
              as: SiteClerk
              captures: { c_id: $.data.id }
            - call: "POST /refill-tickets"
              payload: { site_id: "${s_id}", cylinder_id: "${c_id}", pre_weight_lbs: 17.50 }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { ta_id: $.data.id }
            - call: "POST /refill-tickets"
              payload: { site_id: "${s_id}", cylinder_id: "${c_id}", pre_weight_lbs: 17.50 }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { tb_id: $.data.id }
          trigger:
            - call: "POST /refill-tickets/${ta_id}/weigh"
              payload: { measured_tare_lbs: 17.10 }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { ta_st: $.data.status }
            - call: "POST /refill-tickets/${tb_id}/weigh"
              payload: { measured_tare_lbs: 17.11 }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { err: $.data.error_id }
          assert:
            - "ticket A: status == WEIGHED (0.10 deviation allowed)"
            - "ticket B: error_id == ERR_TARE_MISMATCH; http status 422 (0.11 deviation rejected)"

      - name: insufficient_payment_at_refill_close
        claim_type: violation_to_error
        grounds:
          - validations[priority=13]
          - errors[ERR_INSUFFICIENT_PAYMENT]
        distinguishing_aspect: "Closing a FILLED ticket with payment one cent below total (6281 < 6282) fails with 402 ERR_INSUFFICIENT_PAYMENT; the ticket stays FILLED."
        test_recipe:
          setup: ["site S (no hazmat) with policy; EMPTY CUSTOMER cylinder; ticket FILLED at 18.50 lbs (total 6282)"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "S", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /pricing-policies"
              payload: { site_id: "${s_id}", expected_site_version: "${s_v}", swap_price_cents: 2499, core_deposit_cents: 3500, tax_rate_bps: 825, refill_tier1_cents_per_lb: 349, refill_tier1_max_lbs: 15.00, refill_tier2_cents_per_lb: 299, effective_from: "2026-05-01" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "SN-IP", owner_kind: CUSTOMER, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: EMPTY }
              as: SiteClerk
              captures: { c_id: $.data.id }
            - call: "POST /refill-tickets"
              payload: { site_id: "${s_id}", cylinder_id: "${c_id}", pre_weight_lbs: 17.00 }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { t_id: $.data.id }
            - call: "POST /refill-tickets/${t_id}/weigh"
              payload: { measured_tare_lbs: 17.00 }
              as: SiteClerk
              as_user_id: "clerk-1"
            - call: "POST /refill-tickets/${t_id}/fill"
              payload: { post_weight_lbs: 35.50 }
              as: SiteClerk
              as_user_id: "clerk-1"
          trigger:
            - call: "POST /refill-tickets/${t_id}/close"
              payload: { payment_cash_cents: 6281 }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { err: $.data.error_id }
            - call: "GET /refill-tickets/${t_id}"
              as: PlatformAdmin
              captures: { t_st: $.data.status }
          assert:
            - "error_id == ERR_INSUFFICIENT_PAYMENT; http status 402; ticket status remains FILLED"

      - name: period_not_closed_finalize_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_PERIOD_NOT_CLOSED]
        distinguishing_aspect: "Finalize requires period_end strictly before the current date; finalizing on the period's last day fails with ERR_PERIOD_NOT_CLOSED."
        test_recipe:
          setup: ["site S; statement period 2026-05-01..2026-05-01; clock still at 2026-05-01"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "S", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /commission-statements"
              payload: { site_id: "${s_id}", period_start: "2026-05-01", period_end: "2026-05-01" }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
          trigger:
            - call: "POST /commission-statements/${st_id}/finalize"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PERIOD_NOT_CLOSED; http status 422"

      - name: resolve_leak_without_reinspection_rejected
        claim_type: violation_to_error
        grounds:
          - state_machines.LeakReport.CONFIRMED_to_RESOLVED
          - errors[ERR_REINSPECTION_REQUIRED]
        distinguishing_aspect: "Resolving a quarantining leak without any post-confirmation PASS certification on a site fleet cylinder fails with ERR_REINSPECTION_REQUIRED."
        test_recipe:
          setup: ["site S with 1 FULL fleet cylinder; MAJOR leak REPORTED and CONFIRMED"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "S", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /cylinders"
              payload: { serial_number: "SN-RI", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL, current_site_id: "${s_id}" }
              as: PlatformAdmin
            - call: "POST /leak-reports"
              payload: { site_id: "${s_id}", severity: MAJOR }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { lr_id: $.data.id }
            - call: "POST /leak-reports/${lr_id}/confirm"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /leak-reports/${lr_id}/resolve"
              payload: { resolution_note: "looks fine" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_REINSPECTION_REQUIRED; http status 409"

      - name: refund_after_session_balanced_rejected
        claim_type: violation_to_error
        grounds:
          - state_machines.ExchangeOrder.COMPLETED_to_REFUNDED
          - errors[ERR_REFUND_WINDOW_CLOSED]
        distinguishing_aspect: "Once the day's session reaches BALANCED, same-day refunds are closed: refund fails with ERR_REFUND_WINDOW_CLOSED."
        test_recipe:
          setup: ["site S with policy, 1 FULL fleet, 1 EMPTY customer; order completed (2705); session counted BALANCED (cash 22705, full 0, empty 1)"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "S", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /pricing-policies"
              payload: { site_id: "${s_id}", expected_site_version: "${s_v}", swap_price_cents: 2499, core_deposit_cents: 3500, tax_rate_bps: 825, refill_tier1_cents_per_lb: 349, refill_tier1_max_lbs: 15.00, refill_tier2_cents_per_lb: 299, effective_from: "2026-05-01" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "SN-RW", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL, current_site_id: "${s_id}" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "SN-RC2", owner_kind: CUSTOMER, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: EMPTY }
              as: SiteClerk
              captures: { cc_id: $.data.id }
            - call: "POST /exchange-orders"
              payload: { site_id: "${s_id}", returned_cylinder_id: "${cc_id}" }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { o_id: $.data.id }
            - call: "POST /exchange-orders/${o_id}/complete"
              payload: { payment_cash_cents: 2705 }
              as: SiteClerk
              as_user_id: "clerk-1"
            - call: "POST /reconciliation-sessions"
              payload: { site_id: "${s_id}", business_date: "2026-05-01" }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { rs_id: $.data.id }
            - call: "POST /reconciliation-sessions/${rs_id}/count"
              payload: { counted_cash_cents: 22705, counted_full_cylinders: 0, counted_empty_cylinders: 1 }
              as: SiteClerk
              as_user_id: "clerk-1"
          trigger:
            - call: "POST /exchange-orders/${o_id}/refund"
              payload: {}
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_REFUND_WINDOW_CLOSED; http status 409"

      - name: sales_at_suspended_site_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=6]
          - errors[ERR_SITE_NOT_ACTIVE]
          - state_machines.HostSite.ACTIVE_to_SUSPENDED
        distinguishing_aspect: "A SUSPENDED site rejects new sales with ERR_SITE_NOT_ACTIVE even though pricing and stock exist."
        test_recipe:
          setup: ["site S with policy and 1 FULL fleet cylinder; site suspended via PATCH"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "S", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /pricing-policies"
              payload: { site_id: "${s_id}", expected_site_version: "${s_v}", swap_price_cents: 2499, core_deposit_cents: 3500, tax_rate_bps: 825, refill_tier1_cents_per_lb: 349, refill_tier1_max_lbs: 15.00, refill_tier2_cents_per_lb: 299, effective_from: "2026-05-01" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "SN-SS", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL, current_site_id: "${s_id}" }
              as: PlatformAdmin
            - call: "GET /sites/${s_id}"
              as: PlatformAdmin
              captures: { s_v2: $.data.version }
            - call: "PATCH /sites/${s_id}"
              payload: { expected_site_version: "${s_v2}", status: "SUSPENDED" }
              as: PlatformAdmin
          trigger:
            - call: "POST /exchange-orders"
              payload: { site_id: "${s_id}" }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SITE_NOT_ACTIVE; http status 409"

      - name: decommission_with_stock_rejected
        claim_type: violation_to_error
        grounds:
          - state_machines.HostSite.SUSPENDED_to_DECOMMISSIONED
          - errors[ERR_SITE_NOT_EMPTY]
        distinguishing_aspect: "Decommission requires zero on-hand cylinders; with 1 FULL in the cage it fails with ERR_SITE_NOT_EMPTY."
        test_recipe:
          setup: ["site S (SUSPENDED) with 1 FULL fleet cylinder"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "S", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /cylinders"
              payload: { serial_number: "SN-DX", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL, current_site_id: "${s_id}" }
              as: PlatformAdmin
            - call: "PATCH /sites/${s_id}"
              payload: { expected_site_version: "${s_v}", status: "SUSPENDED" }
              as: PlatformAdmin
              captures: { s_v2: $.data.version }
          trigger:
            - call: "PATCH /sites/${s_id}"
              payload: { expected_site_version: "${s_v2}", status: "DECOMMISSIONED" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SITE_NOT_EMPTY; http status 409"

      - name: exchange_without_policy_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=12]
          - errors[ERR_NO_ACTIVE_POLICY]
        distinguishing_aspect: "A site with no current pricing policy rejects order creation with ERR_NO_ACTIVE_POLICY."
        test_recipe:
          setup: ["site S with 1 FULL fleet cylinder and NO pricing policy"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "S", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /cylinders"
              payload: { serial_number: "SN-NP", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL, current_site_id: "${s_id}" }
              as: PlatformAdmin
          trigger:
            - call: "POST /exchange-orders"
              payload: { site_id: "${s_id}" }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NO_ACTIVE_POLICY; http status 409"

      - name: fill_quarantined_cylinder_rejected
        claim_type: violation_to_error
        grounds:
          - state_machines.RefillTicket.WEIGHED_to_FILLED
          - errors[ERR_CYLINDER_QUARANTINED]
        distinguishing_aspect: "A WEIGHED ticket cannot be filled while its cylinder is QUARANTINED: ERR_CYLINDER_QUARANTINED."
        test_recipe:
          setup: ["site S with policy; CUSTOMER cylinder WEIGHED ticket; ComplianceOfficer quarantines the cylinder"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "S", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /pricing-policies"
              payload: { site_id: "${s_id}", expected_site_version: "${s_v}", swap_price_cents: 2499, core_deposit_cents: 3500, tax_rate_bps: 825, refill_tier1_cents_per_lb: 349, refill_tier1_max_lbs: 15.00, refill_tier2_cents_per_lb: 299, effective_from: "2026-05-01" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "SN-QF", owner_kind: CUSTOMER, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: EMPTY }
              as: SiteClerk
              captures: { c_id: $.data.id }
            - call: "POST /refill-tickets"
              payload: { site_id: "${s_id}", cylinder_id: "${c_id}", pre_weight_lbs: 17.50 }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { t_id: $.data.id }
            - call: "POST /refill-tickets/${t_id}/weigh"
              payload: { measured_tare_lbs: 17.00 }
              as: SiteClerk
              as_user_id: "clerk-1"
            - call: "POST /cylinders/${c_id}/quarantine"
              payload: { note: "smell" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /refill-tickets/${t_id}/fill"
              payload: { post_weight_lbs: 30.00 }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CYLINDER_QUARANTINED; http status 409"

      - name: statement_period_over_62_days_rejected
        claim_type: violation_to_error
        grounds:
          - entities.CommissionStatement.fields.period_end
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "A statement period longer than MAX_STATEMENT_PERIOD_DAYS (62) fails at creation with ERR_VALIDATION."
        test_recipe:
          setup: ["site S"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "S", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /commission-statements"
              payload: { site_id: "${s_id}", period_start: "2026-05-01", period_end: "2026-08-01" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION (2026-05-01..2026-08-01 is 92 days > 62); http status 400"

  # ================================================== Endpoints
  - section: endpoints
    instances:
      - name: list_sites_pagination_defaults
        claim_type: listing
        grounds:
          - response_envelope
          - endpoints
        distinguishing_aspect: "GET /sites returns the envelope pagination fields; with 3 sites and limit=2 the first page reports total_count 3 and has_more true, and the offset page carries the remainder."
        test_recipe:
          setup: ["three sites exist"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "S1", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000 }
              as: PlatformAdmin
            - call: "POST /sites"
              payload: { name: "S2", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000 }
              as: PlatformAdmin
            - call: "POST /sites"
              payload: { name: "S3", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000 }
              as: PlatformAdmin
          trigger:
            - call: "GET /sites?limit=2&offset=0"
              as: PlatformAdmin
            - call: "GET /sites?limit=2&offset=2"
              as: PlatformAdmin
          assert:
            - "page 1: response_type == array, 2 items, total_count == 3, has_more == true"
            - "page 2 (offset 2): 1 item, total_count == 3, has_more == false"

      - name: filtered_cylinder_list
        claim_type: listing
        grounds:
          - endpoints
          - entities.Cylinder.fields.current_site_id
        distinguishing_aspect: "GET /cylinders with current_site_id + fill_status filters returns only cylinders matching both predicates."
        test_recipe:
          setup: ["site S with 1 FULL and 1 EMPTY fleet cylinder; one depot FULL cylinder"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "S", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /cylinders"
              payload: { serial_number: "SN-F1", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL, current_site_id: "${s_id}" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "SN-F2", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: EMPTY, current_site_id: "${s_id}" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "SN-F3", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL }
              as: PlatformAdmin
          trigger:
            - call: "GET /cylinders?current_site_id=${s_id}&fill_status=FULL"
              as: PlatformAdmin
          assert:
            - "exactly 1 row (SN-F1); total_count == 1; depot FULL and site EMPTY excluded"

      - name: complete_response_immediately_consistent
        claim_type: computed_read
        grounds:
          - endpoints
          - state_machines.ExchangeOrder.DRAFT_to_COMPLETED
        distinguishing_aspect: "Immediate consistency: the complete response itself carries issued_cylinder_id, change_due_cents, business_date, sale_seq; a follow-up GET /sites shows the decremented stock with no delay."
        test_recipe:
          setup: ["site S with policy and 1 FULL fleet cylinder"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "S", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /pricing-policies"
              payload: { site_id: "${s_id}", expected_site_version: "${s_v}", swap_price_cents: 2499, core_deposit_cents: 3500, tax_rate_bps: 825, refill_tier1_cents_per_lb: 349, refill_tier1_max_lbs: 15.00, refill_tier2_cents_per_lb: 299, effective_from: "2026-05-01" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "SN-IC", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL, current_site_id: "${s_id}" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /exchange-orders"
              payload: { site_id: "${s_id}" }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /exchange-orders/${o_id}/complete"
              payload: { payment_cash_cents: 7000 }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { o_issued: $.data.issued_cylinder_id, o_chg: $.data.change_due_cents, o_bd: $.data.business_date, o_seq: $.data.sale_seq, o_st: $.data.status }
            - call: "GET /sites/${s_id}"
              as: PlatformAdmin
              captures: { s_full: $.data.full_on_hand }
          assert:
            - "status == COMPLETED; issued_cylinder_id == ${c_id}; change_due_cents == 506 (7000 - 6494); business_date == 2026-05-01; sale_seq == 1"
            - "GET site immediately after: full_on_hand == 0"

