            - "response.http_status == 422"
            - "Notice.${notice_id}.status == PROOF_APPROVED"

  # =========================================================================
  # RULE 7 — cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: schedule_gated_by_newspaper_qualified_state
        grounds:
          - state_machines.Notice.PROOF_APPROVED_to_SCHEDULED
          - entities.Newspaper.fields.circulation_qualified
          - validations[priority=5]
          - errors[ERR_NEWSPAPER_NOT_QUALIFIED]
        distinguishing_aspect: |
          Entity pair NOTICE -> NEWSPAPER: a Notice's PROOF_APPROVED->SCHEDULED transition is gated by
          the NEWSPAPER's circulation_qualified field. With circulation_qualified=false the schedule
          is rejected ERR_NEWSPAPER_NOT_QUALIFIED even though the notice itself is in the right state.
        test_recipe:
          setup:
            - "UNQUALIFIED newspaper (circulation_qualified=false) in SPRINGFIELD"
            - "PROBATE requirement min_insertions=2"
            - "A PROBATE notice in PROOF_APPROVED (submitted and proof approved)"
          setup_api_calls:
            - call: "POST /newspapers"
              payload: { name: "Pennysaver", county: "SPRINGFIELD", circulation_qualified: false, pricing_basis: "PER_LINE", chars_per_line: 40, line_rate_first_cents: 500, line_rate_subsequent_cents: 300, word_rate_cents: 50, affidavit_fee_cents: 2500, edition_line_capacity: 100, publication_weekday: 6 }
              as: PlatformAdmin
              captures: { np_id: "$.data.id"}
            - call: "POST /accounts"
              payload: { name: "Acme Law", account_type: "LAW_FIRM", credit_limit_cents: 1000000 }
              as: PlatformAdmin
