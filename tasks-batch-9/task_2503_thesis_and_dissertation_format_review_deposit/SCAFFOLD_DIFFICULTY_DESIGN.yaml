  - rule_id: transitive_cascade
    instances:
      - name: seat_added_to_approved_committee_cancels_defense_and_releases_room_minutes
        grounds:
          - state_machines.Committee.APPROVED_to_SUBMITTED
          - state_machines.Thesis.DEFENSE_ANNOUNCED_to_COMMITTEE_PENDING
          - state_machines.DefenseEvent.ANNOUNCED_to_CANCELLED
          - calculations.room_booked_minutes_total
          - calculations.committee_composition_counts
          - entities.DefenseEvent.fields.cancellation_reason
        distinguishing_aspect: |
          A single seat insert propagates four hops through four different entities —
          CommitteeMember create -> Committee APPROVED->SUBMITTED (approved_by_user_id cleared) ->
          Thesis DEFENSE_ANNOUNCED->COMMITTEE_PENDING -> DefenseEvent ANNOUNCED->CANCELLED with
          cancellation_reason COMMITTEE_COMPOSITION_CHANGED -> DefenseRoom.booked_minutes_total
          recomputed to 0 — and the chain is driven by a composition change, not by any scheduling
          or integrity event.
