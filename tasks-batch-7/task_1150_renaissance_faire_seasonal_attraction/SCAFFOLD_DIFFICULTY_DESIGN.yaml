  - rule_id: boundary_precision_check
    instances:
      - name: group_min_size_exact_threshold
        grounds:
          - calculations.ticket_order_total
          - errors[ERR_GROUP_SIZE_BELOW_MINIMUM]
        distinguishing_aspect: |
          Metric: ticket count; endpoint: POST /ticket-orders. GROUP quantity exactly ==
          group_min_size (10) qualifies for the 10% tier (>= semantics); quantity 9 is rejected.
          Distinct metric and endpoint from the rain-check date boundary instance.
