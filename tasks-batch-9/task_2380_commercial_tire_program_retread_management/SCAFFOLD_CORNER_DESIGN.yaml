# =====================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task 2380 — Commercial Tire Program & Retread Management
#
# Breadth walk of the claim-extraction guide's nine sections against this
# scaffold's §1.1–§1.7 surface. Corners already asserted by a §1.8 instance
# carry an excluded_because stub instead of a duplicate recipe.
#
# Every instance name is unique across SCAFFOLD_DIFFICULTY_DESIGN.yaml and
# this file.
# =====================================================================
scaffold_corner_design:

  # -------------------------------------------------------------------
  - section: entities
    instances:

      - name: service_location_creation_returns_declared_fields
        claim_type: creation
        grounds:
          - entities.ServiceLocation
          - endpoints.POST_/service-locations
        distinguishing_aspect: "A create call returns 201 with every declared field populated: the input echo, the system defaults (is_retread_plant false when omitted), the computed casings_in_holding_count at 0, and version at 1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /service-locations"
              payload: { name: "Corner Commercial", location_code: "CRN", state_code: "OH", road_service_response_minutes_committed: 90, scrap_permit_number: "OH-SCRAP-4001", scrap_permit_expires_on: "2027-06-30" }
              as: DealerAdmin
              captures: { loc_id: $.data.id }
          assert:
            - "status 201 and response_type == \"object\""
            - "data.name == \"Corner Commercial\", data.location_code == \"CRN\", data.state_code == \"OH\", data.road_service_response_minutes_committed == 90"
            - "data.scrap_permit_number == \"OH-SCRAP-4001\" and data.scrap_permit_expires_on == \"2027-06-30\""
            - "data.is_retread_plant == false (declared default applied for the omitted field)"
            - "data.casings_in_holding_count == 0 and data.version == 1"
            - "data.id is a bare UUID with no type prefix, and data.created_at is ISO 8601 UTC"

      - name: retread_line_retrieval_returns_stored_row
        claim_type: retrieval
        grounds:
          - entities.RetreadLine
          - endpoints.GET_/retread-lines/{line_id}
        distinguishing_aspect: "A read-back of a created line returns the same id and the same field values, including the computed booked_minutes, without mutating version."
        test_recipe:
          setup: ["one plant with one retread line created at cure_cooldown_minutes 45"]
          setup_api_calls:
            - call: "POST /service-locations"
              payload: { name: "Readback Plant", location_code: "RBP2", state_code: "OH", road_service_response_minutes_committed: 120, scrap_permit_number: "OH-SCRAP-4002", scrap_permit_expires_on: "2027-06-30", is_retread_plant: true }
              as: DealerAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /service-locations/${loc_id}/retread-lines"
              payload: { line_code: "LR", cure_cooldown_minutes: 45 }
              as: DealerAdmin
              captures: { line_id: $.data.id, line_v: $.data.version }
          trigger:
            - call: "GET /retread-lines/${line_id}"
              payload: {}
              as: DealerAdmin
          assert:
            - "status 200, data.id == ${line_id}, data.service_location_id == ${loc_id}"
            - "data.line_code == \"LR\", data.cure_cooldown_minutes == 45, data.status == \"AVAILABLE\", data.booked_minutes == 0"
            - "data.version == ${line_v} — a GET is not a mutation"

      - name: casing_listing_pagination_limit_offset_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET_/casings
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three casings and limit 2, the first page returns 2 rows with total_count 3 and has_more true; offset 2 returns the single remaining row with has_more false. total_count counts the filtered set, not the page."
        test_recipe:
          setup: ["one fleet with exactly three casings, all in the initial ON_WHEEL state"]
          setup_api_calls:
            - call: "POST /service-locations"
              payload: { name: "Paging Commercial", location_code: "PGC", state_code: "OH", road_service_response_minutes_committed: 120, scrap_permit_number: "OH-SCRAP-4003", scrap_permit_expires_on: "2027-06-30" }
              as: DealerAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { name: "Pager Freight", account_type: "SINGLE_LOCATION", home_location_id: "${loc_id}", billing_mode: "DIRECT" }
              as: DealerAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /casings"
              payload: { fleet_account_id: "${fleet_id}", casing_serial: "CS-4001", brand: "Bridgestone", casing_spec_code: "ANY", intended_position: "DRIVE", scrap_weight_lbs: 120 }
              as: DealerAdmin
            - call: "POST /casings"
              payload: { fleet_account_id: "${fleet_id}", casing_serial: "CS-4002", brand: "Bridgestone", casing_spec_code: "ANY", intended_position: "DRIVE", scrap_weight_lbs: 121 }
              as: DealerAdmin
            - call: "POST /casings"
              payload: { fleet_account_id: "${fleet_id}", casing_serial: "CS-4003", brand: "Bridgestone", casing_spec_code: "ANY", intended_position: "TRAILER", scrap_weight_lbs: 122 }
              as: DealerAdmin
          trigger:
            - call: "GET /casings"
              payload: { fleet_account_id: "${fleet_id}", limit: 2, offset: 0 }
              as: DealerAdmin
            - call: "GET /casings"
              payload: { fleet_account_id: "${fleet_id}", limit: 2, offset: 2 }
              as: DealerAdmin
            - call: "GET /casings"
              payload: { fleet_account_id: "${fleet_id}", intended_position: "TRAILER" }
              as: DealerAdmin
          assert:
            - "first page: response_type == \"array\", 2 rows, total_count == 3, limit == 2, offset == 0, has_more == true"
            - "second page: 1 row, total_count == 3, offset == 2, has_more == false"
            - "the TRAILER filter returns exactly 1 row (casing_serial CS-4003) with total_count == 1, so total_count reflects the filtered set"

      - name: get_casing_with_unknown_id_not_found
        claim_type: not_found
        grounds:
          - validations.priority_3_existence
          - errors.ERR_CASING_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unassigned UUID in the path returns 404 ERR_CASING_NOT_FOUND in the standard error envelope, not an empty 200."
        test_recipe:
          setup: ["empty database; the id below is never created"]
          setup_api_calls: []
          trigger:
            - call: "GET /casings/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: DealerAdmin
              captures: { err: $.data.error_id }
          assert:
            - "status 404, response_type == \"error\", data.error_id == \"ERR_CASING_NOT_FOUND\" and data.message is a non-empty string"

      - name: create_casing_missing_required_casing_serial_rejected
        claim_type: required_fields
        grounds:
          - entities.Casing.fields.casing_serial
          - validations.priority_6_business_constraint
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "casing_serial has source input and no default, so omitting it is a 400 ERR_INVALID_REQUEST — it is not silently defaulted or server-minted."
        test_recipe:
          setup: ["one fleet account"]
          setup_api_calls:
            - call: "POST /service-locations"
              payload: { name: "Required Commercial", location_code: "RQC", state_code: "OH", road_service_response_minutes_committed: 120, scrap_permit_number: "OH-SCRAP-4004", scrap_permit_expires_on: "2027-06-30" }
              as: DealerAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { name: "Req Freight", account_type: "SINGLE_LOCATION", home_location_id: "${loc_id}", billing_mode: "DIRECT" }
              as: DealerAdmin
              captures: { fleet_id: $.data.id }
          trigger:
            - call: "POST /casings"
              payload: { fleet_account_id: "${fleet_id}", brand: "Bridgestone", casing_spec_code: "ANY", intended_position: "DRIVE", scrap_weight_lbs: 125 }
              as: DealerAdmin
              captures: { err: $.data.error_id }
          assert:
            - "status 400 with data.error_id == \"ERR_INVALID_REQUEST\""
            - "no Casing row was created: GET /casings?fleet_account_id=${fleet_id} returns total_count == 0"

      - name: retread_line_and_casing_defaults_applied_when_omitted
        claim_type: defaults
        grounds:
          - entities.RetreadLine.fields.cure_cooldown_minutes
          - entities.Casing.fields.retread_count
          - entities.TirePolicy.fields.casing_spec_code
        distinguishing_aspect: "Three declared defaults are applied when their inputs are omitted: cure_cooldown_minutes 30, Casing.retread_count 0 and TirePolicy.casing_spec_code \"ANY\" — and the 30-minute default is not merely stored, it lengthens the line's booked_minutes."
        test_recipe:
          setup: ["one plant, one fleet"]
          setup_api_calls:
            - call: "POST /service-locations"
              payload: { name: "Default Plant", location_code: "DFP", state_code: "OH", road_service_response_minutes_committed: 120, scrap_permit_number: "OH-SCRAP-4005", scrap_permit_expires_on: "2027-06-30", is_retread_plant: true }
              as: DealerAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { name: "Default Freight", account_type: "SINGLE_LOCATION", home_location_id: "${loc_id}", billing_mode: "DIRECT" }
              as: DealerAdmin
              captures: { fleet_id: $.data.id }
          trigger:
            - call: "POST /service-locations/${loc_id}/retread-lines"
              payload: { line_code: "LD" }
              as: DealerAdmin
              captures: { line_id: $.data.id }
            - call: "POST /casings"
              payload: { fleet_account_id: "${fleet_id}", casing_serial: "CS-4005", brand: "Bridgestone", casing_spec_code: "ANY", intended_position: "DRIVE", scrap_weight_lbs: 125 }
              as: DealerAdmin
              captures: { casing_id: $.data.id }
            - call: "POST /fleet-accounts/${fleet_id}/tire-policies"
              payload: { position: "DRIVE", target_pressure_psi: 100, pressure_tolerance_pct: 0.10, min_tread_depth_32nds: 4, pull_point_32nds: 6, max_retread_count: 3, approved_brands: ["Bridgestone"], new_tire_tread_depth_32nds: 24 }
              as: DealerAdmin
              captures: { policy_id: $.data.id }
          assert:
            - "RetreadLine.${line_id}.cure_cooldown_minutes == 30 and status == \"AVAILABLE\" and booked_minutes == 0"
            - "Casing.${casing_id}.retread_count == 0 and status == \"ON_WHEEL\""
            - "TirePolicy.${policy_id}.casing_spec_code == \"ANY\", the wildcard, so no spec check can fail for this fleet position"

      - name: casing_system_fields_minted_by_server
        claim_type: system_fields
        grounds:
          - entities.Casing.fields.status
          - entities.Casing.fields.provisional_credit_cents
          - entities.Casing.fields.inspection_grade
        distinguishing_aspect: "status, inspection_grade, inspected_by_user_id, collected_at_location_id, scrap_manifest_id and provisional_credit_cents are all server-owned on Casing: none of them appear in the create endpoint's input list, so a client cannot seed a casing straight into COLLECTED or pre-credited."
        test_recipe:
          setup: ["one fleet"]
          setup_api_calls:
            - call: "POST /service-locations"
              payload: { name: "Systemfield Commercial", location_code: "SFC", state_code: "OH", road_service_response_minutes_committed: 120, scrap_permit_number: "OH-SCRAP-4006", scrap_permit_expires_on: "2027-06-30" }
              as: DealerAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { name: "Sysfield Freight", account_type: "SINGLE_LOCATION", home_location_id: "${loc_id}", billing_mode: "DIRECT" }
              as: DealerAdmin
              captures: { fleet_id: $.data.id }
          trigger:
            - call: "POST /casings"
              payload: { fleet_account_id: "${fleet_id}", casing_serial: "CS-4006", brand: "Michelin", casing_spec_code: "R22.5", intended_position: "STEER", scrap_weight_lbs: 118, retread_count: 2 }
              as: DealerAdmin
              captures: { casing_id: $.data.id }
          assert:
            - "data.status == \"ON_WHEEL\" (the declared initial_state), data.inspection_grade == null, data.inspected_by_user_id == null"
            - "data.collected_at_location_id == null, data.scrap_manifest_id == null, data.provisional_credit_cents == 0"
            - "data.retread_count == 2 — this one IS an input field, so the supplied value is honoured"
            - "data.version == 1 and data.created_at is server-generated"

      - name: create_vehicle_with_invalid_enum_vehicle_type_rejected
        claim_type: type_constraints
        grounds:
          - entities.Vehicle.fields.vehicle_type
          - validations.priority_6_business_constraint
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "vehicle_type is a closed enum; a plausible but undeclared member (\"SEMI\") is rejected with 400 rather than stored as free text, which matters because cost-per-mile groups by vehicle_type."
        test_recipe:
          setup: ["one fleet"]
          setup_api_calls:
            - call: "POST /service-locations"
              payload: { name: "Enum Commercial", location_code: "ENC", state_code: "OH", road_service_response_minutes_committed: 120, scrap_permit_number: "OH-SCRAP-4007", scrap_permit_expires_on: "2027-06-30" }
              as: DealerAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { name: "Enum Freight", account_type: "SINGLE_LOCATION", home_location_id: "${loc_id}", billing_mode: "DIRECT" }
              as: DealerAdmin
              captures: { fleet_id: $.data.id }
          trigger:
            - call: "POST /fleet-accounts/${fleet_id}/vehicles"
              payload: { unit_number: "T-99", vehicle_type: "SEMI", current_odometer_miles: 1000 }
              as: DealerAdmin
              captures: { err: $.data.error_id }
          assert:
            - "status 400 with data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /vehicles?fleet_account_id=${fleet_id} returns total_count == 0"

      - name: tire_survey_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds:
          - entities.TireSurvey
          - endpoints.GET_/tire-surveys/{survey_id}
        distinguishing_aspect: "TireSurvey declares common_fields: false — it is an append-only observation. Its representation carries id and created_at but NO version and NO updated_at, and §1.5 exposes no update or delete endpoint for it; corrections are made by appending a later survey."
        test_recipe:
          setup:
            - "one fleet with a DRIVE policy, one TRACTOR unit, one mounted asset"
            - "two surveys appended to the same asset, the later one at a lower tread depth"
          setup_api_calls:
            - call: "POST /service-locations"
              payload: { name: "Append Commercial", location_code: "APC", state_code: "OH", road_service_response_minutes_committed: 120, scrap_permit_number: "OH-SCRAP-4008", scrap_permit_expires_on: "2027-06-30" }
              as: DealerAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { name: "Append Freight", account_type: "SINGLE_LOCATION", home_location_id: "${loc_id}", billing_mode: "DIRECT" }
              as: DealerAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /fleet-accounts/${fleet_id}/tire-policies"
              payload: { position: "DRIVE", target_pressure_psi: 100, pressure_tolerance_pct: 0.10, min_tread_depth_32nds: 4, pull_point_32nds: 6, max_retread_count: 3, approved_brands: ["Bridgestone"], new_tire_tread_depth_32nds: 24, casing_spec_code: "ANY" }
              as: DealerAdmin
            - call: "POST /fleet-accounts/${fleet_id}/vehicles"
              payload: { unit_number: "T-101", vehicle_type: "TRACTOR", current_odometer_miles: 200000 }
              as: DealerAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /casings"
              payload: { fleet_account_id: "${fleet_id}", casing_serial: "CS-4008", brand: "Bridgestone", casing_spec_code: "ANY", intended_position: "DRIVE", scrap_weight_lbs: 125 }
              as: DealerAdmin
              captures: { casing_id: $.data.id }
            - call: "POST /tire-assets"
              payload: { fleet_account_id: "${fleet_id}", casing_id: "${casing_id}", brand: "Bridgestone", cost_basis_cents: 50000 }
              as: DealerAdmin
              captures: { asset_id: $.data.id }
            - call: "POST /tire-assets/${asset_id}/mount"
              payload: { vehicle_id: "${veh_id}", position: "DRIVE", mounted_at: "2026-08-02T09:00:00Z", odometer_at_mount: 200000, tread_depth_at_mount_32nds: 24 }
              as: TireTechnician
          trigger:
            - call: "POST /tire-assets/${asset_id}/surveys"
              payload: { surveyed_at: "2026-08-10T09:00:00Z", pressure_psi: 100, tread_depth_32nds: 20, odometer_miles: 230000 }
              as: TireTechnician
              captures: { survey1_id: $.data.id }
            - call: "POST /tire-assets/${asset_id}/surveys"
              payload: { surveyed_at: "2026-08-20T09:00:00Z", pressure_psi: 100, tread_depth_32nds: 18, odometer_miles: 260000 }
              as: TireTechnician
              captures: { survey2_id: $.data.id }
            - call: "GET /tire-surveys/${survey1_id}"
              payload: {}
              as: DealerAdmin
          assert:
            - "the read-back of survey 1 still reports tread_depth_32nds == 20 and odometer_miles == 230000 — appending survey 2 did not rewrite it"
            - "the survey representation carries id and created_at but no version and no updated_at field"
            - "§1.5 declares no PATCH or DELETE for /tire-surveys/{survey_id}; correction is by appending, which is why cost_per_mile reads the LATEST survey by surveyed_at"
            - "GET /tire-surveys?tire_asset_id=${asset_id} returns total_count == 2"

      - name: create_tire_policy_under_unknown_fleet_path_not_found
        claim_type: parent_relationships
        grounds:
          - validations.priority_3_existence
          - errors.ERR_FLEET_ACCOUNT_NOT_FOUND
          - endpoints.POST_/fleet-accounts/{fleet_account_id}/tire-policies
        distinguishing_aspect: "The nested creation path resolves its parent before doing anything else: an unassigned fleet id in the path yields 404 ERR_FLEET_ACCOUNT_NOT_FOUND even though the body is perfectly well formed."
        test_recipe:
          setup: ["empty database; the fleet id below is never created"]
          setup_api_calls: []
          trigger:
            - call: "POST /fleet-accounts/00000000-0000-0000-0000-0000000000aa/tire-policies"
              payload: { position: "DRIVE", target_pressure_psi: 100, pressure_tolerance_pct: 0.10, min_tread_depth_32nds: 4, pull_point_32nds: 6, max_retread_count: 3, approved_brands: ["Bridgestone"], new_tire_tread_depth_32nds: 24, casing_spec_code: "ANY" }
              as: DealerAdmin
              captures: { err: $.data.error_id }
          assert:
            - "status 404 with data.error_id == \"ERR_FLEET_ACCOUNT_NOT_FOUND\""
            - "no TirePolicy row exists anywhere: GET /tire-policies returns total_count == 0"

      - name: casing_body_foreign_key_integrity_rejected
        claim_type: flat
        grounds:
          - entities.Casing.fields.fleet_account_id
          - validations.priority_7_existence
          - errors.ERR_FLEET_ACCOUNT_NOT_FOUND
        distinguishing_aspect: "Flat topology means references travel in the body, so body FKs are validated too — and at priority 7, strictly after the 400-level shape check, which is why a body with BOTH a bad enum and a dangling FK reports ERR_INVALID_REQUEST first."
        test_recipe:
          setup: ["one location so the shape-valid request has somewhere to point; the fleet id below is never created"]
          setup_api_calls:
            - call: "POST /service-locations"
              payload: { name: "Integrity Commercial", location_code: "ITC", state_code: "OH", road_service_response_minutes_committed: 120, scrap_permit_number: "OH-SCRAP-4009", scrap_permit_expires_on: "2027-06-30" }
              as: DealerAdmin
              captures: { loc_id: $.data.id }
          trigger:
            - call: "POST /casings"
              payload: { fleet_account_id: "00000000-0000-0000-0000-0000000000bb", casing_serial: "CS-4009", brand: "Bridgestone", casing_spec_code: "ANY", intended_position: "DRIVE", scrap_weight_lbs: 125 }
              as: DealerAdmin
              captures: { err: $.data.error_id }
            - call: "POST /casings"
              payload: { fleet_account_id: "00000000-0000-0000-0000-0000000000bb", casing_serial: "CS-4010", brand: "Bridgestone", casing_spec_code: "ANY", intended_position: "AXLE", scrap_weight_lbs: 125 }
              as: DealerAdmin
              captures: { err2: $.data.error_id }
          assert:
            - "the first request returns 404 with data.error_id == \"ERR_FLEET_ACCOUNT_NOT_FOUND\""
            - "the second request, which adds an invalid intended_position enum on top of the same dangling FK, returns 400 ERR_INVALID_REQUEST — priority 6 precedes priority 7"
            - "GET /casings returns total_count == 0 after both rejections"

      - name: service_location_casings_in_holding_count_is_computed
        claim_type: computed_fields
        grounds:
          - entities.ServiceLocation.fields.casings_in_holding_count
        excluded_because:
          difficulty_instance: transitive_cascade / road_service_replacement_collection_cascade_depth_three
          rationale: "That instance asserts casings_in_holding_count moving 0 -> 1 purely as a consequence of a cascaded collection, with no client ever supplying the value."

  # -------------------------------------------------------------------
  - section: state_machines
    instances:

      - name: casing_initial_state_is_on_wheel
        claim_type: initial_state
        grounds:
          - state_machines.Casing.initial_state
        distinguishing_aspect: "A freshly created casing is ON_WHEEL, which is also the state the retread cycle returns to — so creation and cycle completion are indistinguishable by status alone and must be told apart by retread_count."
        test_recipe:
          setup: ["one fleet"]
          setup_api_calls:
            - call: "POST /service-locations"
              payload: { name: "Initial Commercial", location_code: "INC", state_code: "OH", road_service_response_minutes_committed: 120, scrap_permit_number: "OH-SCRAP-4010", scrap_permit_expires_on: "2027-06-30" }
              as: DealerAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { name: "Initial Freight", account_type: "SINGLE_LOCATION", home_location_id: "${loc_id}", billing_mode: "DIRECT" }
              as: DealerAdmin
              captures: { fleet_id: $.data.id }
          trigger:
            - call: "POST /casings"
              payload: { fleet_account_id: "${fleet_id}", casing_serial: "CS-4011", brand: "Bridgestone", casing_spec_code: "ANY", intended_position: "DRIVE", scrap_weight_lbs: 125 }
              as: DealerAdmin
              captures: { casing_id: $.data.id }
          assert:
            - "Casing.${casing_id}.status == \"ON_WHEEL\" and retread_count == 0"
            - "FleetAccount.${fleet_id}.status == \"ACTIVE\" — the fleet's own initial_state"

      - name: casing_collect_from_collected_returns_invalid_state
        claim_type: invalid_transitions
        grounds:
          - state_machines.Casing.ON_WHEEL_to_COLLECTED
          - validations.priority_9_state
          - errors.ERR_CASING_INVALID_STATE
        distinguishing_aspect: "collect is declared only from ON_WHEEL. A second collect on an already-COLLECTED casing is 409 ERR_CASING_INVALID_STATE and must not re-stamp collected_at_location_id to the new location or double-count the holding total."
        test_recipe:
          setup: ["two locations; one casing already collected at location A"]
          setup_api_calls:
            - call: "POST /service-locations"
              payload: { name: "Statecheck A", location_code: "SCA", state_code: "OH", road_service_response_minutes_committed: 120, scrap_permit_number: "OH-SCRAP-4011", scrap_permit_expires_on: "2027-06-30" }
              as: DealerAdmin
              captures: { locA_id: $.data.id }
            - call: "POST /service-locations"
              payload: { name: "Statecheck B", location_code: "SCB", state_code: "IN", road_service_response_minutes_committed: 120, scrap_permit_number: "IN-SCRAP-4011", scrap_permit_expires_on: "2027-06-30" }
              as: DealerAdmin
              captures: { locB_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { name: "Statecheck Freight", account_type: "SINGLE_LOCATION", home_location_id: "${locA_id}", billing_mode: "DIRECT" }
              as: DealerAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /casings"
