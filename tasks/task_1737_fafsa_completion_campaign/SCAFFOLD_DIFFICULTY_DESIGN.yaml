# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# 9 rules x 2-3 instances = 24 instances. Every grounds ref resolves into
# SCAFFOLD.yaml §1.1–§1.7. Clock default 2026-08-01T00:00:00Z unless set.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: completion_rate_submission_vs_processed_variants
        grounds:
          - calculations.completion_rate
          - entities.CompletionReport.fields.variant
          - entities.CompletionReport.fields.overall_rate
        distinguishing_aspect: |
          Dual-variant on the REPORTING domain (senior-population aggregation):
          identical fixture data yields completed_count 3 / overall_rate 100.0 under
          SUBMISSION_BASED but completed_count 1 / overall_rate 33.3 under
          PROCESSED_BASED. Paired with event_staffing_coverage_committed_vs_pipeline_variants,
          which lives in the EVENT-STAFFING domain — different entity domain as required.
        test_recipe:
          setup:
            - "Campaign (min_subgroup_size=1) OPEN; school ENROLLED"
            - "3 seniors, each matched (score 1.00 -> AUTO_CONFIRMED) to an aid record and holding GRANTED consent with DATA_SHARE"
            - "fafsa statuses: sr1 COMPLETE, sr2 VERIFICATION_SELECTED, sr3 SUBMITTED"
          setup_api_calls:
            - { call: "POST /fafsa/campaigns", as: CampaignAdmin, payload: { name: "C27", academic_year: "2027-2028", state_grant_deadline: "2027-04-15T00:00:00Z", federal_deadline: "2028-06-30T00:00:00Z", total_budget_cents: 100000, min_subgroup_size: 1 }, captures: { camp: $.data.id } }
            - { call: "POST /fafsa/campaigns/${camp}/activate", as: CampaignAdmin }
            - { call: "POST /fafsa/schools", as: CampaignAdmin, payload: { campaign_id: "${camp}", name: "North HS", district_code: "D01", school_code: "SC01" }, captures: { sch: $.data.id } }
            - { call: "POST /fafsa/schools/${sch}/enroll", as: CampaignAdmin }
            - { call: "POST /fafsa/senior-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", student_ref: "S1", full_name: "Ana Lee", dob: "2009-03-04", home_language: "en" }, captures: { sr1: $.data.id, sr1_v: $.data.version } }
            - { call: "POST /fafsa/aid-records", as: DataImporter, payload: { campaign_id: "${camp}", external_ref: "EXT1", full_name: "Ana Lee", dob: "2009-03-04", school_code: "SC01", district_code: "D01", initial_status: "COMPLETE", effective_date: "2027-02-01" }, captures: { ar1: $.data.id } }
            - { call: "POST /fafsa/match-links", as: MatchReviewer, payload: { senior_record_id: "${sr1}", aid_record_id: "${ar1}", expected_senior_record_version: "${sr1_v}" } }
            - { call: "POST /fafsa/consent-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { senior_record_id: "${sr1}", scopes: ["STATUS_DETAIL", "OUTREACH", "DATA_SHARE"], granted_by: "PARENT" } }
            - { call: "POST /fafsa/senior-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", student_ref: "S2", full_name: "Bob Kim", dob: "2009-05-06", home_language: "es" }, captures: { sr2: $.data.id, sr2_v: $.data.version } }
            - { call: "POST /fafsa/aid-records", as: DataImporter, payload: { campaign_id: "${camp}", external_ref: "EXT2", full_name: "Bob Kim", dob: "2009-05-06", school_code: "SC01", district_code: "D01", initial_status: "VERIFICATION_SELECTED", effective_date: "2027-02-02" }, captures: { ar2: $.data.id } }
            - { call: "POST /fafsa/match-links", as: MatchReviewer, payload: { senior_record_id: "${sr2}", aid_record_id: "${ar2}", expected_senior_record_version: "${sr2_v}" } }
            - { call: "POST /fafsa/consent-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { senior_record_id: "${sr2}", scopes: ["STATUS_DETAIL", "DATA_SHARE"], granted_by: "ADULT_STUDENT" } }
            - { call: "POST /fafsa/senior-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", student_ref: "S3", full_name: "Cat Diaz", dob: "2009-07-08", home_language: "es" }, captures: { sr3: $.data.id, sr3_v: $.data.version } }
            - { call: "POST /fafsa/aid-records", as: DataImporter, payload: { campaign_id: "${camp}", external_ref: "EXT3", full_name: "Cat Diaz", dob: "2009-07-08", school_code: "SC01", district_code: "D01", initial_status: "SUBMITTED", effective_date: "2027-02-03" }, captures: { ar3: $.data.id } }
            - { call: "POST /fafsa/match-links", as: MatchReviewer, payload: { senior_record_id: "${sr3}", aid_record_id: "${ar3}", expected_senior_record_version: "${sr3_v}" } }
            - { call: "POST /fafsa/consent-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { senior_record_id: "${sr3}", scopes: ["DATA_SHARE"], granted_by: "PARENT" } }
          trigger:
            - { call: "POST /fafsa/completion-reports", as: CampaignAdmin, payload: { campaign_id: "${camp}", variant: "SUBMISSION_BASED" }, captures: { rep_sub: $.data.id, rep_sub_completed: $.data.completed_count, rep_sub_rate: $.data.overall_rate, rep_sub_eligible: $.data.eligible_count } }
            - { call: "POST /fafsa/completion-reports", as: CampaignAdmin, payload: { campaign_id: "${camp}", variant: "PROCESSED_BASED" }, captures: { rep_proc: $.data.id, rep_proc_completed: $.data.completed_count, rep_proc_rate: $.data.overall_rate } }
          assert:
            - "Report.${rep_sub}.eligible_count == 3 and Report.${rep_sub}.completed_count == 3 and Report.${rep_sub}.overall_rate == 100.0"
            - "Report.${rep_proc}.eligible_count == 3 and Report.${rep_proc}.completed_count == 1 and Report.${rep_proc}.overall_rate == 33.3"
            - "Same fixture, two variants: completed_count 3 != 1 and overall_rate 100.0 != 33.3"

      - name: event_staffing_coverage_committed_vs_pipeline_variants
        grounds:
          - calculations.event_staffing_coverage
          - entities.CompletionEvent.fields.staffing_coverage
        distinguishing_aspect: |
          Dual-variant on the EVENT-STAFFING domain: the same assignment set
          (one EXPERT assignment in ACCEPTED, none CONFIRMED) yields
          committed.expert_ratio 0.0 / language_complete false but
          pipeline.expert_ratio 1.0 / language_complete true. Entity domain
          (CompletionEvent staffing) differs from completion_rate's
          senior-population reporting domain.
        test_recipe:
          setup:
            - "Campaign OPEN; school ENROLLED; event (required_expert_count=1, supported_languages=[es]) in DRAFT, window 2026-09-10T15:00:00Z..18:00:00Z"
            - "Staff with capabilities [EVENT_STAFF, AID_EXPERT], languages [es], background CLEARED"
            - "One EXPERT assignment accepted (ACCEPTED), never confirmed"
          setup_api_calls:
            - { call: "POST /fafsa/campaigns", as: CampaignAdmin, payload: { name: "C27", academic_year: "2027-2028", state_grant_deadline: "2027-04-15T00:00:00Z", federal_deadline: "2028-06-30T00:00:00Z", total_budget_cents: 100000 }, captures: { camp: $.data.id } }
            - { call: "POST /fafsa/campaigns/${camp}/activate", as: CampaignAdmin }
            - { call: "POST /fafsa/schools", as: CampaignAdmin, payload: { campaign_id: "${camp}", name: "North HS", district_code: "D01", school_code: "SC01" }, captures: { sch: $.data.id } }
            - { call: "POST /fafsa/schools/${sch}/enroll", as: CampaignAdmin }
            - { call: "POST /fafsa/events", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", title: "FAFSA Night", start_time: "2026-09-10T15:00:00Z", end_time: "2026-09-10T18:00:00Z", capacity: 40, cost_estimate_cents: 5000, required_expert_count: 1, supported_languages: ["es"] }, captures: { ev: $.data.id } }
            - { call: "POST /fafsa/staff-profiles", as: CampaignAdmin, payload: { campaign_id: "${camp}", full_name: "Expert Eve", capabilities: ["EVENT_STAFF", "AID_EXPERT"], languages: ["es"] }, captures: { st: $.data.id } }
            - { call: "POST /fafsa/staff-profiles/${st}/background-check", as: CampaignAdmin, payload: { result: "CLEARED" } }
            - { call: "POST /fafsa/staff-assignments", as: SchoolCoordinator, as_user_id: "${sch}", payload: { event_id: "${ev}", staff_profile_id: "${st}", assigned_role: "EXPERT" }, captures: { asg: $.data.id } }
            - { call: "POST /fafsa/staff-assignments/${asg}/accept", as: StaffMember, as_user_id: "${st}" }
          trigger:
            - { call: "GET /fafsa/events/${ev}", as: CampaignAdmin }
          assert:
            - "CompletionEvent.${ev}.staffing_coverage.committed.expert_ratio == 0.0 and committed.staff_count == 0 and committed.language_complete == false"
            - "CompletionEvent.${ev}.staffing_coverage.pipeline.expert_ratio == 1.0 and pipeline.staff_count == 1 and pipeline.language_complete == true"
            - "Identical assignment data, two variants diverge: 0.0 != 1.0"

  - rule_id: combinatorial_formula
    instances:
      - name: match_score_weighted_band_assignment
        grounds:
          - calculations.match_score
          - entities.MatchLink.fields.match_score
          - entities.MatchLink.fields.score_components
        distinguishing_aspect: |
          Mode (a): a 4-input weighted formula with conditional band branches on
          campaign-configured thresholds — 1.00 -> AUTO_CONFIRMED, 0.85 -> SUGGESTED,
          0.55 -> AUTO_REJECTED, with the branch decided by nested threshold
          comparison, not by a linear map.
        test_recipe:
          setup:
            - "Campaign OPEN with default thresholds (auto_confirm 0.90, review_floor 0.60); school ENROLLED (school_code SC01, district_code D01)"
            - "Three seniors with no existing links"
          setup_api_calls:
            - { call: "POST /fafsa/campaigns", as: CampaignAdmin, payload: { name: "C27", academic_year: "2027-2028", state_grant_deadline: "2027-04-15T00:00:00Z", federal_deadline: "2028-06-30T00:00:00Z", total_budget_cents: 100000 }, captures: { camp: $.data.id } }
            - { call: "POST /fafsa/campaigns/${camp}/activate", as: CampaignAdmin }
            - { call: "POST /fafsa/schools", as: CampaignAdmin, payload: { campaign_id: "${camp}", name: "North HS", district_code: "D01", school_code: "SC01" }, captures: { sch: $.data.id } }
            - { call: "POST /fafsa/schools/${sch}/enroll", as: CampaignAdmin }
            - { call: "POST /fafsa/senior-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", student_ref: "A1", full_name: "Ana Lee", dob: "2009-03-04", home_language: "en" }, captures: { srA: $.data.id, srA_v: $.data.version } }
            - { call: "POST /fafsa/aid-records", as: DataImporter, payload: { campaign_id: "${camp}", external_ref: "EXA", full_name: "ana lee", dob: "2009-03-04", school_code: "SC01", district_code: "D01", initial_status: "SUBMITTED", effective_date: "2027-01-10" }, captures: { arA: $.data.id } }
            - { call: "POST /fafsa/senior-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", student_ref: "B1", full_name: "Bob Kim", dob: "2009-05-06", home_language: "en" }, captures: { srB: $.data.id, srB_v: $.data.version } }
            - { call: "POST /fafsa/aid-records", as: DataImporter, payload: { campaign_id: "${camp}", external_ref: "EXB", full_name: "Bob Kim", dob: "2009-05-06", school_code: "SC99", district_code: "D01", initial_status: "SUBMITTED", effective_date: "2027-01-10" }, captures: { arB: $.data.id } }
            - { call: "POST /fafsa/senior-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", student_ref: "C1", full_name: "Cat Diaz", dob: "2009-07-08", home_language: "es" }, captures: { srC: $.data.id, srC_v: $.data.version } }
            - { call: "POST /fafsa/aid-records", as: DataImporter, payload: { campaign_id: "${camp}", external_ref: "EXC", full_name: "Catalina Diaz", dob: "2009-07-08", school_code: "SC01", district_code: "D99", initial_status: "SUBMITTED", effective_date: "2027-01-10" }, captures: { arC: $.data.id } }
          trigger:
            - { call: "POST /fafsa/match-links", as: MatchReviewer, payload: { senior_record_id: "${srA}", aid_record_id: "${arA}", expected_senior_record_version: "${srA_v}" }, captures: { lkA: $.data.id, lkA_score: $.data.match_score, lkA_status: $.data.status } }
            - { call: "POST /fafsa/match-links", as: MatchReviewer, payload: { senior_record_id: "${srB}", aid_record_id: "${arB}", expected_senior_record_version: "${srB_v}" }, captures: { lkB: $.data.id, lkB_score: $.data.match_score, lkB_status: $.data.status } }
            - { call: "POST /fafsa/match-links", as: MatchReviewer, payload: { senior_record_id: "${srC}", aid_record_id: "${arC}", expected_senior_record_version: "${srC_v}" }, captures: { lkC: $.data.id, lkC_score: $.data.match_score, lkC_status: $.data.status } }
          assert:
            - "MatchLink.${lkA}.match_score == 1.0 (0.40+0.35+0.15+0.10; name match is case-insensitive) and status == AUTO_CONFIRMED"
            - "MatchLink.${lkB}.match_score == 0.85 (dob+name+district) and status == SUGGESTED"
            - "MatchLink.${lkC}.match_score == 0.55 (dob+school only) and status == AUTO_REJECTED"

      - name: report_rate_rounding_order_totals_not_row_average
        grounds:
          - calculations.completion_rate
          - entities.CompletionReport.fields.rows
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins 'overall from UNSUPPRESSED
          totals'. Fixture yields rounded row rates 20.0 and 16.7 whose rounded
          average is 18.4, while the pinned totals-first order yields 18.2 —
          the two rounding orders produce different tenths for identical data.
        test_recipe:
          setup:
            - "Campaign (min_subgroup_size=1) OPEN; school ENROLLED"
            - "LANGUAGE/en group: 5 eligible seniors, 1 completed (SUBMITTED), 4 not (STARTED)"
            - "LANGUAGE/es group: 6 eligible seniors, 1 completed (SUBMITTED), 5 not (STARTED)"
            - "All seniors matched (score 1.00) with GRANTED DATA_SHARE consent"
          setup_api_calls:
            - { call: "POST /fafsa/campaigns", as: CampaignAdmin, payload: { name: "C27", academic_year: "2027-2028", state_grant_deadline: "2027-04-15T00:00:00Z", federal_deadline: "2028-06-30T00:00:00Z", total_budget_cents: 100000, min_subgroup_size: 1 }, captures: { camp: $.data.id } }
            - { call: "POST /fafsa/campaigns/${camp}/activate", as: CampaignAdmin }
            - { call: "POST /fafsa/schools", as: CampaignAdmin, payload: { campaign_id: "${camp}", name: "North HS", district_code: "D01", school_code: "SC01" }, captures: { sch: $.data.id } }
            - { call: "POST /fafsa/schools/${sch}/enroll", as: CampaignAdmin }
            - { call: "POST /fafsa/senior-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", student_ref: "EN1", full_name: "En One", dob: "2009-01-01", home_language: "en" }, captures: { s_en1: $.data.id, s_en1_v: $.data.version } }
            - { call: "POST /fafsa/aid-records", as: DataImporter, payload: { campaign_id: "${camp}", external_ref: "AREN1", full_name: "En One", dob: "2009-01-01", school_code: "SC01", district_code: "D01", initial_status: "SUBMITTED", effective_date: "2027-01-10" }, captures: { a_en1: $.data.id } }
            - { call: "POST /fafsa/match-links", as: MatchReviewer, payload: { senior_record_id: "${s_en1}", aid_record_id: "${a_en1}", expected_senior_record_version: "${s_en1_v}" } }
