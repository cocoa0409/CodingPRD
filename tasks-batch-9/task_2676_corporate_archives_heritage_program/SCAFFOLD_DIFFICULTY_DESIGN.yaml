              as: Archivist
              captures: { fa_id: $.data.id }
            - call: "POST /requesters"
              payload: { display_name: "Nora Kell", requester_class: "MEDIA", affiliation: "Business Weekly", nda_on_file: false }
              as: AccessServicesOfficer
              as_user_id: "officer-a"
              captures: { req_user_id: $.data.id }
            - call: "POST /access-requests"
              payload: { requester_id: "${req_user_id}", record_series_id: "${series_id}", purpose: "Feature on the 1970s expansion", requested_item_ids: ["${item_id}"], finding_aid_id: "${fa_id}" }
              as: Requester
