            - call: "POST /bureau/presort-batches/${es_batch_id}/seal"
              payload: { expected_client_version: "${es_client_v_fresh}" }
              as: PostageController
              as_user_id: "postage-1"
              captures: { es_err_low: "$.data.error_id" }
          assert:
            - "Both priorities are genuinely violated on the first call: the request carries a stale expected_client_version AND Client.${es_client_id}.postage_escrow_available_cents == 0 while the batch's estimated_postage_cents would be 112 (2 pieces * 56 cents FIRST_CLASS THREE_DIGIT, no sheet surcharge at 1 sheet)"
            - "First call returns HTTP 412 with ${es_err_high} == ERR_STALE_CLIENT_VERSION — priority 41 beats priority 80, and the error is the Client OCC error, not the CompositionJob one"
            - "Second call, with the fresh version, returns HTTP 402 and ${es_err_low} == ERR_POSTAGE_ESCROW_INSUFFICIENT, proving the escrow rule was live and merely outranked"
            - "After both rejections PresortBatch.${es_batch_id}.status == OPEN, estimated_postage_cents is null and sealed_by_user_id is null"
            - "After both rejections Client.${es_client_id}.postage_committed_cents == 0 and postage_escrow_available_cents == 0: neither rejection moved money"
            - "Client.${es_client_id}.version == ${es_client_v_fresh} (unchanged by the failed seals) and ${es_client_v_fresh} != ${es_client_v_stale}"

