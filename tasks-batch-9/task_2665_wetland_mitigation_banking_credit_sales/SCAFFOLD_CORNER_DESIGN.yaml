      - name: unknown_actor_or_unknown_role_is_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Identity resolution precedes every other check (priority 1): a syntactically valid request that names a nonexistent actor id, or a role string that is not one of the five declared roles, returns 401 ERR_UNAUTHENTICATED rather than 403 ERR_ROLE_NOT_PERMITTED or 404 ERR_BANK_NOT_FOUND - even when the path id is itself unknown."
