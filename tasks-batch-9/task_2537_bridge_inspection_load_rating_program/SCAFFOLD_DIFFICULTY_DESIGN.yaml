# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2537 - Bridge Inspection & Load Rating Program
#
# Nine rule_ids from §0.5, two instances each (18 total). Every instance grounds
# only in elements declared in SCAFFOLD.yaml §1.1-§1.7. Every numeric assert
# below was computed by executing the referenced §1.3 formula against the pinned
# setup literals.
#
# Shared fixture literals used across instances (all pinned, never derived):
#   logical clock start        2026-09-01T00:00:00Z (set explicitly; server default
#                              is 2026-08-01T00:00:00Z per §1.5)
#   Ivy Inspector   team_leader_certified, refresher 2027-06-30
#   Quinn Qa        team_leader_certified, refresher 2027-06-30
#   Rita Rating     team_leader_certified + licensed PE-11021, refresher 2027-06-30
#   Dana District   team_leader_certified + licensed PE-20044, refresher 2027-06-30
#   Cedar Creek Bridge  STR-000001, deck_area 1000 sqm, built 1972, adt 12000,
#                       detour 8.5 km, spans_water, no fracture-critical members
#   Baseline ROUTINE inspection element set (window 2026-09-02T08:00Z..16:00Z):
#     DECK      DECK_GROUP     SQM 1000 = 600/200/150/50 -> EHI 82.00
#     GIRDER    SUPERSTRUCTURE M    300 =   0/100/100/100 -> EHI 40.00
#     BEARING   SUPERSTRUCTURE EA      4 =   0/  2/  1/  1 -> EHI 50.00
#     ABUTMENT  SUBSTRUCTURE   EA      4 =   3/  1/  0/  0 -> EHI 95.00
#   => group indices 82.00 / 42.86 / 95.00 -> NBI 7 / 3 / 8 -> min_nbi_rating 3
#   => bridge_health_index 65.47, inventoried_quantity_total 1308,
#      deficient_quantity_total 402, deficiency_pct 30.73
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: load_rating_operating_vs_inventory_diverge
        grounds:
          - calculations.load_rating_factor
          - calculations.condition_factor_phi_c
          - entities.LoadRating.fields.rating_factor_operating
          - entities.LoadRating.fields.rating_factor_inventory
          - entities.LoadRating.fields.posted_limit_tons
          - state_machines.LoadRating.null_to_DRAFT
        distinguishing_aspect: |
          The two variants differ ONLY in the live-load factor gamma_LL (1.35 operating vs 1.75
          inventory) applied to identical structural data on the same LoadRating row, so the same
          numerator 555 yields rating_factor_operating 0.618 and rating_factor_inventory 0.477 -
          and only the inventory variant feeds posted_limit_tons 17.0.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Four qualified staff registered: Ivy Inspector, Quinn Qa, Rita Rating (licensed PE), Dana District (licensed PE)."
            - "Cedar Creek Bridge in inventory at version 1, service_posture OPEN, no load ratings."
            - "One ROUTINE inspection accepted with the baseline element set, so its worst SUPERSTRUCTURE state is CS4 (GIRDER cs4_qty 100) and condition_factor_phi_c will be 0.85."
            - "No ProgramCycle exists, so the acceptance cascade creates no candidate."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /personnel"
              payload: { full_name: "Ivy Inspector", agency: "STATE_DOT", nbis_refresher_expiry_date: "2027-06-30", team_leader_certified: true }
              as: ProgramAdmin
              captures: { insp_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "Quinn Qa", agency: "STATE_DOT", nbis_refresher_expiry_date: "2027-06-30", team_leader_certified: true }
              as: ProgramAdmin
              captures: { qa_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "Rita Rating", agency: "STATE_DOT", nbis_refresher_expiry_date: "2027-06-30", team_leader_certified: true, load_rating_engineer_licensed: true, pe_license_number: "PE-11021" }
              as: ProgramAdmin
              captures: { eng_id: $.data.id }
            - call: "POST /bridges"
              payload: { nbi_structure_number: "STR-000001", name: "Cedar Creek Bridge", owner_agency: "STATE_DOT", structure_type: "STEEL_GIRDER", deck_area_sqm: 1000, year_built: 1972, adt: 12000, detour_length_km: 8.5, spans_water: true, underwater_elements: false, fracture_critical: false }
              as: ProgramAdmin
              captures: { br_id: $.data.id }
            - call: "POST /bridges/${br_id}/inspections"
              payload: { inspection_type: "ROUTINE", team_leader_id: "${insp_id}", field_window_start: "2026-09-02T08:00:00Z", field_window_end: "2026-09-02T16:00:00Z" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
              captures: { ins_id: $.data.id }
            - call: "POST /inspections/${ins_id}/element-conditions"
              payload: { element_key: "DECK", element_group: "DECK_GROUP", unit: "SQM", total_quantity: 1000, cs1_qty: 600, cs2_qty: 200, cs3_qty: 150, cs4_qty: 50, photo_count: 6, defect_notes: "Spalling and delamination in bay 3" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
              captures: { ec_deck_id: $.data.id }
            - call: "POST /inspections/${ins_id}/element-conditions"
              payload: { element_key: "GIRDER", element_group: "SUPERSTRUCTURE", unit: "M", total_quantity: 300, cs1_qty: 0, cs2_qty: 100, cs3_qty: 100, cs4_qty: 100, photo_count: 8, defect_notes: "Section loss at girder 2 web" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
              captures: { ec_girder_id: $.data.id }
            - call: "POST /inspections/${ins_id}/element-conditions"
              payload: { element_key: "BEARING", element_group: "SUPERSTRUCTURE", unit: "EA", total_quantity: 4, cs1_qty: 0, cs2_qty: 2, cs3_qty: 1, cs4_qty: 1, photo_count: 4, defect_notes: "Frozen bearing at pier 1" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins_id}/element-conditions"
              payload: { element_key: "ABUTMENT", element_group: "SUBSTRUCTURE", unit: "EA", total_quantity: 4, cs1_qty: 3, cs2_qty: 1, cs3_qty: 0, cs4_qty: 0, photo_count: 1, defect_notes: "Minor map cracking" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T12:00:00Z" }
              as: ProgramAdmin
            - call: "POST /inspections/${ins_id}/submit"
              payload: { inspection_date: "2026-09-02T10:00:00Z" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins_id}/qa-claim"
              payload: {}
              as: QaReviewer
              as_user_id: "${qa_id}"
            - call: "POST /inspections/${ins_id}/qa-decision"
              payload: { decision: "ACCEPT" }
              as: QaReviewer
              as_user_id: "${qa_id}"
            - call: "GET /bridges/${br_id}"
              payload: {}
              as: RatingEngineer
              as_user_id: "${eng_id}"
              captures: { br_v: $.data.version }
          trigger:
            - call: "POST /bridges/${br_id}/load-ratings"
              payload: { expected_bridge_version: "${br_v}", source_inspection_id: "${ins_id}", method: "LRFR", rating_vehicle: "HL93", capacity_c_kn_m: 2000, dead_load_dc_kn_m: 600, dead_load_dw_kn_m: 150, live_load_ll_kn_m: 500, impact_im_factor: 1.33, system_factor_phi_s: 1.00, resistance_factor_phi: 0.90, rating_effective_date: "2026-09-03" }
              as: RatingEngineer
              as_user_id: "${eng_id}"
              captures: { lr_id: $.data.id }
          assert:
            - "LoadRating.${lr_id}.condition_factor_phi_c == 0.85"
            - "LoadRating.${lr_id}.rating_factor_operating == 0.618"
            - "LoadRating.${lr_id}.rating_factor_inventory == 0.477"
            - "LoadRating.${lr_id}.rating_factor_operating != LoadRating.${lr_id}.rating_factor_inventory"
            - "LoadRating.${lr_id}.operating_rating_tons == 22.2"
            - "LoadRating.${lr_id}.inventory_rating_tons == 17.2"
            - "LoadRating.${lr_id}.posting_required == true"
            - "LoadRating.${lr_id}.posted_limit_tons == 17.0"
            - "LoadRating.${lr_id}.rating_status == DRAFT"
            - "Bridge.${br_id}.governing_load_rating_id == null (a DRAFT rating never governs)"

      - name: candidate_priority_condition_vs_risk_policy_diverge
        grounds:
          - calculations.candidate_priority_score
          - entities.ProgramCycle.fields.ranking_policy
          - entities.ProjectCandidate.fields.priority_score
          - entities.ProjectCandidate.fields.ranking_policy_applied
          - concurrency_rules[candidate-create-stale-cycle]
        distinguishing_aspect: |
          The two variants consume DIFFERENT INPUT SETS of the same bridge - CONDITION_BASED weighs
          only health index, NBI gap and deficiency percentage (43.41), while RISK_BASED replaces the
          latter two with scour points, traffic/detour exposure and posting points (36.21) - so the
          identical bridge scores 7.20 points apart depending solely on the owning cycle's policy.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; staff and Cedar Creek Bridge as in the baseline fixture."
            - "TWO ProgramCycles exist in PLANNING before the inspection is accepted - FY2027 CONDITION_BASED and FY2028 RISK_BASED - so the acceptance cascade's HOP 4 is skipped (it fires only when exactly one cycle is PLANNING) and both candidates are created explicitly."
            - "A FINAL scour evaluation with scour_code 5 has set Bridge.scour_status to LOW_RISK, so the risk variant scores 40 scour points rather than the 70 of an unevaluated structure."
            - "Cedar Creek Bridge after acceptance: bridge_health_index 65.47, min_nbi_rating 3, deficiency_pct 30.73, adt 12000, detour_length_km 8.5, service_posture OPEN (exposure points 56.50, posting points 0)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /personnel"
              payload: { full_name: "Ivy Inspector", agency: "STATE_DOT", nbis_refresher_expiry_date: "2027-06-30", team_leader_certified: true }
              as: ProgramAdmin
              captures: { insp_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "Quinn Qa", agency: "STATE_DOT", nbis_refresher_expiry_date: "2027-06-30", team_leader_certified: true }
              as: ProgramAdmin
              captures: { qa_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "Dana District", agency: "STATE_DOT", nbis_refresher_expiry_date: "2027-06-30", team_leader_certified: true, load_rating_engineer_licensed: true, pe_license_number: "PE-20044" }
              as: ProgramAdmin
              captures: { dist_id: $.data.id }
            - call: "POST /bridges"
              payload: { nbi_structure_number: "STR-000001", name: "Cedar Creek Bridge", owner_agency: "STATE_DOT", structure_type: "STEEL_GIRDER", deck_area_sqm: 1000, year_built: 1972, adt: 12000, detour_length_km: 8.5, spans_water: true, underwater_elements: false, fracture_critical: false }
              as: ProgramAdmin
              captures: { br_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "Rita Rating", agency: "STATE_DOT", nbis_refresher_expiry_date: "2027-06-30", team_leader_certified: true, load_rating_engineer_licensed: true, pe_license_number: "PE-11021" }
              as: ProgramAdmin
              captures: { eng_id: $.data.id }
            - call: "POST /bridges/${br_id}/scour-evaluations"
              payload: { evaluated_by_id: "${eng_id}", evaluation_method: "HEC18_SCREENING", scour_code: 5, foundation_type: "SPREAD_FOOTING_ON_ROCK", observed_scour_depth_m: 0.4 }
              as: RatingEngineer
              as_user_id: "${eng_id}"
              captures: { se_id: $.data.id }
            - call: "POST /scour-evaluations/${se_id}/finalize"
              payload: {}
              as: RatingEngineer
              as_user_id: "${eng_id}"
            - call: "POST /program-cycles"
              payload: { fiscal_year: 2027, authorized_budget_cents: 10000000000, ranking_policy: "CONDITION_BASED", reserve_pct: 0.05 }
              as: ProgramAdmin
              captures: { pc_cond_id: $.data.id }
            - call: "POST /program-cycles"
              payload: { fiscal_year: 2028, authorized_budget_cents: 10000000000, ranking_policy: "RISK_BASED", reserve_pct: 0.05 }
              as: ProgramAdmin
              captures: { pc_risk_id: $.data.id }
            - call: "POST /bridges/${br_id}/inspections"
              payload: { inspection_type: "ROUTINE", team_leader_id: "${insp_id}", field_window_start: "2026-09-02T08:00:00Z", field_window_end: "2026-09-02T16:00:00Z" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
              captures: { ins_id: $.data.id }
            - call: "POST /inspections/${ins_id}/element-conditions"
              payload: { element_key: "DECK", element_group: "DECK_GROUP", unit: "SQM", total_quantity: 1000, cs1_qty: 600, cs2_qty: 200, cs3_qty: 150, cs4_qty: 50, photo_count: 6, defect_notes: "Spalling and delamination in bay 3" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins_id}/element-conditions"
              payload: { element_key: "GIRDER", element_group: "SUPERSTRUCTURE", unit: "M", total_quantity: 300, cs1_qty: 0, cs2_qty: 100, cs3_qty: 100, cs4_qty: 100, photo_count: 8, defect_notes: "Section loss at girder 2 web" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins_id}/element-conditions"
              payload: { element_key: "BEARING", element_group: "SUPERSTRUCTURE", unit: "EA", total_quantity: 4, cs1_qty: 0, cs2_qty: 2, cs3_qty: 1, cs4_qty: 1, photo_count: 4, defect_notes: "Frozen bearing at pier 1" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins_id}/element-conditions"
              payload: { element_key: "ABUTMENT", element_group: "SUBSTRUCTURE", unit: "EA", total_quantity: 4, cs1_qty: 3, cs2_qty: 1, cs3_qty: 0, cs4_qty: 0, photo_count: 1, defect_notes: "Minor map cracking" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T12:00:00Z" }
              as: ProgramAdmin
            - call: "POST /inspections/${ins_id}/submit"
              payload: { inspection_date: "2026-09-02T10:00:00Z" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins_id}/qa-claim"
              payload: {}
              as: QaReviewer
              as_user_id: "${qa_id}"
            - call: "POST /inspections/${ins_id}/qa-decision"
              payload: { decision: "ACCEPT" }
              as: QaReviewer
              as_user_id: "${qa_id}"
            - call: "GET /program-cycles/${pc_cond_id}"
              payload: {}
              as: DistrictEngineer
              as_user_id: "${dist_id}"
              captures: { pc_cond_v: $.data.version }
          trigger:
            - call: "POST /program-cycles/${pc_cond_id}/candidates"
              payload: { expected_program_cycle_version: "${pc_cond_v}", bridge_id: "${br_id}", source_inspection_id: "${ins_id}", justification: "Condition-ranked cycle" }
              as: DistrictEngineer
              as_user_id: "${dist_id}"
              captures: { cand_cond_id: $.data.id }
            - call: "GET /program-cycles/${pc_risk_id}"
              payload: {}
              as: DistrictEngineer
              as_user_id: "${dist_id}"
              captures: { pc_risk_v: $.data.version }
            - call: "POST /program-cycles/${pc_risk_id}/candidates"
              payload: { expected_program_cycle_version: "${pc_risk_v}", bridge_id: "${br_id}", source_inspection_id: "${ins_id}", justification: "Risk-ranked cycle" }
              as: DistrictEngineer
              as_user_id: "${dist_id}"
              captures: { cand_risk_id: $.data.id }
          assert:
            - "ProjectCandidate.${cand_cond_id}.ranking_policy_applied == CONDITION_BASED"
            - "ProjectCandidate.${cand_cond_id}.priority_score == 43.41"
            - "ProjectCandidate.${cand_risk_id}.ranking_policy_applied == RISK_BASED"
            - "ProjectCandidate.${cand_risk_id}.priority_score == 36.21"
            - "ProjectCandidate.${cand_cond_id}.priority_score - ProjectCandidate.${cand_risk_id}.priority_score == 7.20"
            - "ProjectCandidate.${cand_cond_id}.work_type == REPLACEMENT and ProjectCandidate.${cand_risk_id}.work_type == REPLACEMENT"
            - "ProjectCandidate.${cand_cond_id}.estimated_cost_cents == 26588000 and ProjectCandidate.${cand_risk_id}.estimated_cost_cents == 26588000"
            - "ProjectCandidate.${cand_cond_id}.origin == MANUAL (HOP 4 of the acceptance cascade did not fire because two cycles were PLANNING)"
            - "Bridge.${br_id}.scour_status == LOW_RISK (scour_code 5) and Bridge.${br_id}.poa_compliant == true"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: inspection_interval_nested_min_max_fracture_critical_extended
        grounds:
          - calculations.inspection_interval_months
          - calculations.next_inspection_due_date
          - entities.Bridge.fields.inspection_interval_months
          - entities.Bridge.fields.next_inspection_due_date
          - endpoints[PATCH /bridges/{id}]
        distinguishing_aspect: |
          This is the NESTED MIN/MAX mode: the 48-month extended tier is granted only when three
          independent conditions hold together (min_nbi_rating >= 7 AND year_built >= 1990 AND
          adt <= 5000), and the fracture-critical floor then clamps it with min(48, 12) = 12 - so
          flipping one boolean moves the answer from 12 to 48 and raising adt by one unit from 48
          to 24, which no single-threshold formula can reproduce.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Ridge Viaduct created with initial component ratings 8/8/8 (min_nbi_rating 8), year_built 2005, adt 4000, fracture_critical true, so at creation the extended tier 48 is earned and then clamped to 12 by the fracture-critical floor."
            - "No inspection has been accepted, so next_inspection_due_date is measured from the bridge's creation date 2026-09-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /bridges"
              payload: { nbi_structure_number: "STR-000002", name: "Ridge Viaduct", owner_agency: "STATE_DOT", structure_type: "STEEL_TIED_ARCH", deck_area_sqm: 2400, year_built: 2005, adt: 4000, detour_length_km: 22.0, spans_water: false, underwater_elements: false, fracture_critical: true, initial_deck_rating: 8, initial_superstructure_rating: 8, initial_substructure_rating: 8 }
              as: ProgramAdmin
              captures: { br2_id: $.data.id }
          trigger:
            - call: "PATCH /bridges/${br2_id}"
              payload: { fracture_critical: false }
              as: ProgramAdmin
            - call: "PATCH /bridges/${br2_id}"
              payload: { adt: 5001 }
              as: ProgramAdmin
          assert:
            - "Immediately after creation Bridge.${br2_id}.inspection_interval_months == 12 (48 earned, then min(48,12) by the fracture-critical floor)"
            - "Immediately after creation Bridge.${br2_id}.next_inspection_due_date == 2027-09-01"
            - "After the first PATCH Bridge.${br2_id}.inspection_interval_months == 48"
            - "After the first PATCH Bridge.${br2_id}.next_inspection_due_date == 2030-09-01"
            - "After the second PATCH Bridge.${br2_id}.inspection_interval_months == 24 (adt 5001 fails the exposure leg alone, so the extended tier is lost entirely)"
            - "After the second PATCH Bridge.${br2_id}.next_inspection_due_date == 2028-09-01"
            - "Bridge.${br2_id}.underwater_interval_months == null and next_underwater_due_date == null throughout"
            - "Bridge.${br2_id}.version == 3 (creation at 1, one increment per PATCH)"

      - name: permit_gross_weight_per_axle_rounding_order
        grounds:
          - calculations.permit_gross_weight_tons
          - entities.PermitApplication.fields.gross_weight_tons
          - entities.PermitApplication.fields.axle_count
          - state_machines.PermitApplication.null_to_RECEIVED
        distinguishing_aspect: |
          This is the ROUNDING-ORDER mode: axle_loads_tons [8.25, 8.25, 8.25, 8.25, 6.4] gives
          gross_weight_tons 39.6 when each axle is rounded to 1 dp first and the rounded axles are
          summed, but 39.4 when the raw axles are summed and the total rounded - a forced 0.2-ton
          divergence that pins the order of operations, not the arithmetic.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One structure, Cedar Creek Bridge, exists so the permit route references a valid bridge id."
            - "No load rating exists yet; the application only needs to reach status RECEIVED for the weight computation to be observable."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /bridges"
              payload: { nbi_structure_number: "STR-000001", name: "Cedar Creek Bridge", owner_agency: "STATE_DOT", structure_type: "STEEL_GIRDER", deck_area_sqm: 1000, year_built: 1972, adt: 12000, detour_length_km: 8.5, spans_water: true, underwater_elements: false, fracture_critical: false }
              as: ProgramAdmin
              captures: { br_id: $.data.id }
          trigger:
            - call: "POST /permit-applications"
              payload: { permit_number: "OW-2026-0001", carrier_name: "Granite Heavy Haul", axle_loads_tons: [8.25, 8.25, 8.25, 8.25, 6.4], route_bridge_ids: ["${br_id}"], speed_category: "NORMAL" }
              as: PermitOfficer
              captures: { pa_id: $.data.id }
          assert:
            - "PermitApplication.${pa_id}.axle_count == 5"
            - "PermitApplication.${pa_id}.gross_weight_tons == 39.6"
            - "PermitApplication.${pa_id}.gross_weight_tons != 39.4 (the sum-then-round order is wrong)"
            - "PermitApplication.${pa_id}.status == RECEIVED"
            - "PermitApplication.${pa_id}.recommended_decision == PENDING"
            - "PermitApplication.${pa_id}.governing_analysis_min_rf == null before analysis"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: inspection_qa_return_revision_cycle_second_pass
        grounds:
          - state_machines.Inspection.IN_QA_to_DRAFT
          - state_machines.Inspection.DRAFT_to_SUBMITTED
          - state_machines.Inspection.IN_QA_to_ACCEPTED
          - entities.Inspection.fields.returned_count
          - entities.Inspection.fields.qa_escalation_required
        distinguishing_aspect: |
          The report traverses DRAFT -> SUBMITTED -> IN_QA -> DRAFT twice before acceptance, so the
          same entity re-enters DRAFT and SUBMITTED three times each; returned_count reaches 2 and
          qa_escalation_required flips true, proving the loop counter survives the cycle rather than
          resetting on re-entry.
        test_recipe:
          setup:
            - "Logical clock advanced to 2026-09-02T12:00:00Z before the first submit so inspection_date 2026-09-02T10:00:00Z sits inside the field window and at or before the clock."
            - "Baseline staff and Cedar Creek Bridge; one ROUTINE inspection with the full baseline element set in DRAFT."
            - "No ProgramCycle exists, so acceptance creates no candidate."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /personnel"
              payload: { full_name: "Ivy Inspector", agency: "STATE_DOT", nbis_refresher_expiry_date: "2027-06-30", team_leader_certified: true }
              as: ProgramAdmin
