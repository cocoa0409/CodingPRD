  - rule_id: compensating_invariant
    instances:

      - name: pull_submit_then_cancel_conserves_warehouse_on_hand
        grounds:
          - conservation_invariants.warehouse_on_hand_conservation
          - state_machines.InventoryItem.AVAILABLE_to_RESERVED
          - state_machines.InventoryItem.RESERVED_to_AVAILABLE
          - state_machines.InventoryPull.DRAFT_to_CANCELLED
        distinguishing_aspect: |
          CONSERVED QUANTITY 1 — OWNED UNIT COUNT. The forward action (pull submit) moves
          three units AVAILABLE -> RESERVED and its compensating action (pull cancel) moves
          them back, leaving on_hand_total at 3 and available back at 3 with zero drift in
          any of the five buckets.
        test_recipe:
          setup:
            - "Three AVAILABLE owned units (SOFA, BED, TABLE) and a VACANT project at PULL_OPEN with three OWNED lines."
          setup_api_calls:
            - call: "POST /staging/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
