            - "the second place is 200 with fulfillment_status PLACED, covered_base_cents == 1787 and employer_covered_cents == 1787"
            - "the second place still accepts ${per_v1} because the failed attempt did not bump BenefitPeriod.${per_id}.version"

      - name: a_future_dated_rule_cannot_be_activated_and_a_ruleless_group_cannot_open_a_period
        claim_type: violation_to_error
        grounds:
          - validations[priority=25]
          - errors.ERR_RULE_NOT_EFFECTIVE
          - errors.ERR_NO_ACTIVE_BUDGET_RULE
          - state_machines.BudgetRule.DRAFT_to_ACTIVE
        distinguishing_aspect: "Activation requires effective_from at or before the clock, so a 2026-09-01 rule activated on 2026-08-01 is 409 ERR_RULE_NOT_EFFECTIVE; because no rule is ACTIVE the period open is 409 ERR_NO_ACTIVE_BUDGET_RULE, and advancing the clock to 2026-09-01 makes both calls succeed."
        test_recipe:
          setup:
            - "Acme Corp program with a Contractors group whose only budget rule is DRAFT with effective_from 2026-09-01T00:00:00Z, and one employee Eve in that group. The clock is 2026-08-01T00:00:00Z."
