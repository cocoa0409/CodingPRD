scenario: "Private-Dining & Supper-Club Experience: event/seat inventory & ticketed seating, menu/wine pairing & dietary, deposit & per-seat pricing, chef & venue scheduling, BYOB & corkage, communal vs private table, cancellation/waitlist, recurring series。以 Expert 难度进行设计。"
domain_name: private-dining-supper-club
api_prefix: ""

complexity_profile:
  primary_archetype: quota_allocation          # finite seat inventory reserved/committed/released per event
  secondary_archetype: temporal_windowing      # chef & venue scheduling with overlap/buffer semantics
  complexity_layers:
    - optimistic_concurrency                    # OCC on Event.version for reprice (CREATE/UPDATE-with-supersede)
    - cascading_side_effects                    # event-cancel and booking-cancel cascades across 3+ entities
    - dual_variant_calculation                  # deposit(provisional) vs total(final); projected vs realized revenue
    - rate_threshold_triggers                   # cancellation refund tiers by days-before-event

  entity_topology: hybrid                       # series->event->seat tree + cross-cutting venue/chef/guest FK references
  state_machine_shape: parallel                 # Booking evolves booking_status x payment_status independently; Event has a suspend/resume cycle
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential_none
  role_model: peer_roles                        # VenueManager owns event ops, Chef owns menu, Guest owns bookings; PlatformAdmin superset
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: SupperClubSeries
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Series display name" }
      - { name: cadence, type: enum, source: input, description: "Recurrence cadence", constraints: "one of WEEKLY, BIWEEKLY, MONTHLY" }
      - { name: theme, type: string, source: input, description: "Culinary theme of the series" }
      - { name: communal_table, type: boolean, source: input, default: true, description: "Default seating style for events spawned from this series: communal (true) vs private (false)" }
      - { name: default_seat_capacity, type: integer, source: input, description: "Default seat count seeded onto child events", constraints: ">= 1" }
      - { name: base_seat_price_cents, type: integer, source: input, description: "Default per-seat list price in cents", constraints: ">= 0" }
      - { name: default_deposit_pct, type: number, source: input, description: "Default deposit fraction 0..1 applied per seat", constraints: "0 <= x <= 1" }
      - { name: byob_allowed, type: boolean, source: input, default: false, description: "Whether BYOB is permitted by default" }
      - { name: corkage_fee_cents, type: integer, source: input, default: 0, description: "Default per-bottle corkage fee in cents", constraints: ">= 0" }

  - name: Venue
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Venue name" }
      - { name: address, type: string, source: input, description: "Street address" }
      - { name: max_capacity, type: integer, source: input, description: "Physical seat ceiling of the room", constraints: ">= 1" }
      - { name: corkage_policy, type: enum, source: input, description: "Whether the venue permits outside bottles", constraints: "one of ALLOWED, NOT_ALLOWED" }

  - name: Chef
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Chef name" }
      - { name: specialty, type: string, source: input, description: "Cuisine specialty" }
      - { name: status, type: enum, source: system, default: AVAILABLE, description: "Availability posture", constraints: "one of AVAILABLE, ON_LEAVE" }

  - name: Guest
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Guest full name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: phone, type: string, source: input, description: "Contact phone (optional)" }

  - name: Event
    parent: null
    common_fields: true
    fields:
      - { name: series_id, type: string, source: input, description: "FK -> SupperClubSeries.id" }
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id" }
      - { name: chef_id, type: string, source: input, description: "FK -> Chef.id" }
      - { name: title, type: string, source: input, description: "Event title" }
      - { name: event_start, type: datetime, source: input, description: "Seating start (ISO8601 UTC)" }
      - { name: event_end, type: datetime, source: input, description: "Seating end (ISO8601 UTC)", constraints: "event_end > event_start" }
      - { name: booking_deadline, type: datetime, source: input, description: "No new bookings after this instant (ISO8601 UTC)", constraints: "booking_deadline <= event_start" }
      - { name: table_mode, type: enum, source: input, description: "Communal shared table vs private buyout", constraints: "one of COMMUNAL, PRIVATE" }
      - { name: seat_capacity, type: integer, source: input, description: "Number of Seat rows generated at schedule time", constraints: ">= 1" }
      - { name: seat_price_cents, type: integer, source: input, description: "Per-seat list price in cents (mutable via reprice)", constraints: ">= 0" }
      - { name: deposit_pct, type: number, source: input, description: "Deposit fraction 0..1 applied per seat", constraints: "0 <= x <= 1" }
      - { name: byob_allowed, type: boolean, source: input, default: false, description: "Whether BYOB is permitted for this event" }
      - { name: corkage_fee_cents, type: integer, source: input, default: 0, description: "Per-bottle corkage fee in cents", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Lifecycle state", constraints: "one of DRAFT, SCHEDULED, OPEN, SUSPENDED, COMPLETED, CANCELLED" }
      - { name: confirmed_seat_count, type: integer, source: computed, description: "Derived-on-read: count of child Seat rows whose status == BOOKED" }
      - { name: available_seat_count, type: integer, source: computed, description: "Derived-on-read: count of child Seat rows whose status == AVAILABLE" }
      - { name: gross_deposit_held_cents, type: integer, source: computed, description: "Derived-on-read: sum over child Bookings of (deposit_paid_cents - refund_cents)" }
      - { name: projected_revenue_cents, type: integer, source: computed, description: "Derived-on-read forward-looking: sum of total_price_cents over Bookings with booking_status IN {PENDING_DEPOSIT, CONFIRMED}" }
      - { name: realized_revenue_cents, type: integer, source: computed, description: "Derived-on-read chronological: sum of total_price_cents over Bookings with booking_status == ATTENDED plus sum of deposit_paid_cents over Bookings with booking_status == NO_SHOW" }

  - name: Seat
    parent: Event
    common_fields: true
    fields:
      - { name: event_id, type: string, source: system, description: "FK -> Event.id; set when generated by the schedule transition" }
      - { name: seat_label, type: string, source: system, description: "Deterministic label S1..SN in ascending generation order" }
      - { name: seat_type, type: enum, source: system, description: "Seat category assigned at generation", constraints: "one of STANDARD, ACCESSIBLE, HEAD_TABLE" }
      - { name: status, type: enum, source: system, default: AVAILABLE, description: "Inventory state", constraints: "one of AVAILABLE, HELD, BOOKED, BLOCKED" }
      - { name: price_override_cents, type: integer, source: system, default: null, description: "Optional per-seat price override in cents; null means fall back to Event.seat_price_cents", constraints: ">= 0 or null" }
      - { name: current_booking_id, type: string, source: system, default: null, description: "FK -> Booking.id; the Booking currently holding this seat, else null" }

  - name: MenuCourse
    parent: Event
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> Event.id" }
      - { name: course_number, type: integer, source: input, description: "Ordering index within the menu", constraints: ">= 1" }
      - { name: name, type: string, source: input, description: "Course name" }
      - { name: description, type: string, source: input, description: "Course description (optional)" }
      - { name: paired_wine_name, type: string, source: input, description: "Paired wine label (optional)" }
      - { name: wine_varietal, type: string, source: input, description: "Grape varietal of the pairing (optional)" }
      - { name: wine_supplement_cents, type: integer, source: input, default: 0, description: "Optional per-guest wine pairing supplement in cents", constraints: ">= 0" }
      - { name: contains_allergens, type: array, source: input, default: [], description: "Allergen tags present in the course", constraints: "subset of {NUTS, DAIRY, GLUTEN, SHELLFISH, SOY}" }

  - name: Booking
    parent: Event
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> Event.id" }
      - { name: guest_id, type: string, source: input, description: "FK -> Guest.id" }
      - { name: party_size, type: integer, source: input, description: "Number of covers; MUST equal len(seat_ids)", constraints: ">= 1" }
      - { name: seat_ids, type: array, source: input, description: "Seat ids requested; each must belong to this event and be AVAILABLE" }
      - { name: table_preference, type: enum, source: input, description: "Requested seating style (optional)", constraints: "one of COMMUNAL, PRIVATE" }
      - { name: dietary_restrictions, type: array, source: input, default: [], description: "Per-booking dietary flags", constraints: "subset of {VEGAN, VEGETARIAN, GLUTEN_FREE, NUT_ALLERGY, DAIRY_FREE, PESCATARIAN}" }
      - { name: allergy_notes, type: string, source: input, description: "Free-text allergy notes (optional)" }
      - { name: byob_bottles, type: integer, source: input, default: 0, description: "Number of outside bottles brought", constraints: ">= 0" }
      - { name: booking_status, type: enum, source: system, default: PENDING_DEPOSIT, description: "Reservation lifecycle dimension", constraints: "one of PENDING_DEPOSIT, CONFIRMED, ATTENDED, CANCELLED, NO_SHOW" }
      - { name: payment_status, type: enum, source: system, default: UNPAID, description: "Money lifecycle dimension (independent of booking_status)", constraints: "one of UNPAID, DEPOSIT_PAID, REFUNDED, PARTIALLY_REFUNDED, FORFEITED" }
      - { name: deposit_due_cents, type: integer, source: computed, description: "Provisional variant: round_half_up(base_seat_price*deposit_pct) per seat, then summed" }
      - { name: deposit_paid_cents, type: integer, source: system, default: 0, description: "Sum of DEPOSIT-kind Payment charges recorded against this booking" }
      - { name: total_price_cents, type: integer, source: computed, description: "Final variant: subtotal - group_discount + corkage (full-price settlement)" }
      - { name: corkage_due_cents, type: integer, source: computed, description: "byob_bottles * Event.corkage_fee_cents when Event.byob_allowed, else 0" }
      - { name: refund_cents, type: integer, source: system, default: 0, description: "Sum of REFUND-kind Payment amounts recorded against this booking" }

  - name: WaitlistEntry
    parent: Event
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> Event.id" }
      - { name: guest_id, type: string, source: input, description: "FK -> Guest.id" }
      - { name: booking_id, type: string, source: system, default: null, description: "FK -> Booking.id; set to the auto-created Booking when this entry is promoted, else null" }
      - { name: party_size, type: integer, source: input, description: "Covers requested by the waitlisted guest", constraints: ">= 1" }
      - { name: position, type: integer, source: computed, description: "Derived-on-read: 1-based rank among WAITING entries of the same event ordered by created_at ASC" }
      - { name: status, type: enum, source: system, default: WAITING, description: "Waitlist lifecycle", constraints: "one of WAITING, PROMOTED, WITHDRAWN, EXPIRED" }

  - name: Payment
    parent: Booking
    common_fields: false
    fields:
      - { name: booking_id, type: string, source: system, description: "FK -> Booking.id" }
      - { name: kind, type: enum, source: system, description: "Ledger entry kind", constraints: "one of DEPOSIT, REFUND" }
      - { name: direction, type: enum, source: system, description: "Money direction", constraints: "one of CHARGE, REFUND" }
      - { name: amount_cents, type: integer, source: system, description: "Absolute amount in cents", constraints: ">= 0" }
      - { name: reason, type: string, source: system, description: "Human-readable reason (optional)" }

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: Event
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /events/{id}/schedule"
        actor: VenueManager
        preconditions:
          - "Chef referenced by chef_id has status == AVAILABLE"
          - "No active Event (status IN {SCHEDULED, OPEN, SUSPENDED}) at the same venue_id whose [event_start, event_end + VENUE_TURNOVER_MINUTES) half-open interval intersects this event's [event_start, event_end)"
          - "No active Event (status IN {SCHEDULED, OPEN, SUSPENDED}) with the same chef_id whose [event_start - CHEF_PREP_MINUTES, event_end) half-open interval intersects this event's [event_start - CHEF_PREP_MINUTES, event_end)"
        side_effects:
          - "Generate seat_capacity Seat rows labelled S1..SN in ascending order, all status=AVAILABLE; the first head_table_count seats get seat_type=HEAD_TABLE, the remainder STANDARD"
          - "increments Event.version by 1"
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /events/{id}/open"
        actor: VenueManager
        preconditions:
          - "At least one MenuCourse exists for this event (ERR_MENU_REQUIRED otherwise)"
        side_effects:
          - "increments Event.version by 1"
      - from: OPEN
        to: SUSPENDED
        trigger: "POST /events/{id}/suspend"
        actor: VenueManager
        preconditions: []
        side_effects:
          - "Bookings are frozen: new POST /bookings against this event are rejected with ERR_EVENT_NOT_OPEN while SUSPENDED"
          - "increments Event.version by 1"
      - from: SUSPENDED
        to: OPEN
        trigger: "POST /events/{id}/resume"
        actor: VenueManager
        preconditions: []
        note: "Cycle edge OPEN->SUSPENDED->OPEN (non-linear)"
        side_effects:
          - "increments Event.version by 1"
      - from: OPEN
        to: COMPLETED
        trigger: "POST /events/{id}/complete"
        actor: VenueManager
        preconditions:
          - "logical clock now >= event_end (ERR_EVENT_NOT_ENDED otherwise)"
        side_effects:
          - "Each Booking with booking_status == CONFIRMED transitions to NO_SHOW; its deposit is forfeited (payment_status=FORFEITED); deposit_paid_cents is retained (no refund)"
          - "Each Booking with booking_status == PENDING_DEPOSIT transitions to CANCELLED with refund_cents=0 (no deposit was paid)"
          - "Each WaitlistEntry with status == WAITING transitions to EXPIRED"
          - "increments Event.version by 1"
      - from: SUSPENDED
        to: COMPLETED
        trigger: "POST /events/{id}/complete"
        actor: VenueManager
        preconditions:
          - "logical clock now >= event_end (ERR_EVENT_NOT_ENDED otherwise)"
        side_effects:
          - "Same completion cascade as OPEN->COMPLETED"
          - "increments Event.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /events/{id}/cancel"
        actor: VenueManager
        preconditions: []
        side_effects:
          - "increments Event.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /events/{id}/cancel"
        actor: VenueManager
        preconditions: []
        side_effects:
          - "CASCADE hop1: each Booking with booking_status IN {PENDING_DEPOSIT, CONFIRMED} transitions to CANCELLED"
          - "CASCADE hop2 (caused by hop1): each such Booking's cancel side-effects fire -> full refund_cents = deposit_paid_cents, a REFUND Payment is appended, payment_status=REFUNDED (or UNPAID stays if nothing paid)"
          - "CASCADE hop3 (caused by hop2): each seat held by a cancelled Booking transitions BOOKED/HELD -> AVAILABLE and current_booking_id cleared"
          - "Any Seat still AVAILABLE or HELD-by-nothing after the booking cascade transitions to BLOCKED"
          - "Each WaitlistEntry with status == WAITING transitions to EXPIRED"
          - "increments Event.version by 1"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /events/{id}/cancel"
        actor: VenueManager
        preconditions: []
        side_effects:
          - "Same three-hop cascade as SCHEDULED->CANCELLED (Booking -> refund/Payment -> Seat freed), then remaining unsold seats BLOCKED, WAITING entries EXPIRED"
          - "increments Event.version by 1"
      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /events/{id}/cancel"
        actor: VenueManager
        preconditions: []
        side_effects:
          - "Same three-hop cascade as OPEN->CANCELLED"
          - "increments Event.version by 1"
      - from: DRAFT
        to: DRAFT
        trigger: "POST /events/{id}/reprice"
        actor: VenueManager
        preconditions:
          - "expected_event_version == Event.version (ERR_STALE_EVENT_VERSION / 412 otherwise)"
        side_effects:
          - "Event.seat_price_cents (and deposit_pct if provided) updated; existing Bookings keep their already-computed prices"
          - "increments Event.version by 1"
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /events/{id}/reprice"
        actor: VenueManager
        preconditions:
          - "expected_event_version == Event.version (ERR_STALE_EVENT_VERSION / 412 otherwise)"
        side_effects:
          - "Event.seat_price_cents (and deposit_pct if provided) updated"
          - "increments Event.version by 1"

  - entity: Booking
    initial_state: PENDING_DEPOSIT
    terminal_states: [ATTENDED, CANCELLED, NO_SHOW]
    transitions:
      - from: PENDING_DEPOSIT
        to: PENDING_DEPOSIT
        trigger: "POST /bookings (creation)"
        actor: Guest
        preconditions:
          - "Event.status == OPEN"
          - "logical clock now <= Event.booking_deadline"
          - "party_size == len(seat_ids)"
          - "every seat in seat_ids has event_id == this event and status == AVAILABLE"
          - "if byob_bottles > 0 then Event.byob_allowed == true"
          - "no dietary_restrictions entry NUT_ALLERGY while any MenuCourse.contains_allergens includes NUTS"
        side_effects:
          - "Booking created PENDING_DEPOSIT/UNPAID; deposit_due_cents, total_price_cents, corkage_due_cents computed"
          - "each requested Seat -> HELD, current_booking_id = booking.id (parallel payment_status dimension starts UNPAID)"
      - from: PENDING_DEPOSIT
        to: CONFIRMED
        trigger: "POST /bookings/{id}/pay-deposit"
        actor: Guest
        preconditions:
          - "Booking.booking_status == PENDING_DEPOSIT (ERR_INVALID_BOOKING_STATE otherwise)"
          - "amount_cents == Booking.deposit_due_cents (ERR_DEPOSIT_AMOUNT_MISMATCH otherwise)"
        side_effects:
          - "payment_status dimension advances UNPAID -> DEPOSIT_PAID; deposit_paid_cents += amount_cents"
          - "append Payment{kind:DEPOSIT, direction:CHARGE, amount_cents}"
          - "each held Seat -> BOOKED"
      - from: CONFIRMED
        to: ATTENDED
        trigger: "POST /bookings/{id}/check-in"
        actor: VenueManager
        preconditions:
          - "Event.status IN {OPEN, SUSPENDED}"
          - "Booking.booking_status == CONFIRMED"
        side_effects:
          - "booking_status -> ATTENDED (terminal)"
      - from: PENDING_DEPOSIT
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel"
        actor: Guest
        preconditions:
          - "Booking.booking_status NOT IN {ATTENDED, CANCELLED, NO_SHOW} (ERR_BOOKING_ALREADY_TERMINAL otherwise)"
        side_effects:
          - "CASCADE hop1: each held Seat -> AVAILABLE, current_booking_id cleared"
          - "CASCADE hop2 (caused by hop1 freeing a seat): the front WAITING WaitlistEntry of this event whose party_size <= freed-seat count is PROMOTED and an auto Booking is created for its guest (PENDING_DEPOSIT/UNPAID) holding the freed seat(s)"
          - "refund_cents = round_half_up(deposit_paid_cents * refund_rate(days_before)); nothing was paid here so refund_cents stays 0"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel"
        actor: Guest
        preconditions:
          - "Booking.booking_status NOT IN {ATTENDED, CANCELLED, NO_SHOW} (ERR_BOOKING_ALREADY_TERMINAL otherwise)"
        side_effects:
          - "compute cancellation_refund: refund_cents = round_half_up(deposit_paid_cents * refund_rate(days_before_event)); append Payment{kind:REFUND, direction:REFUND, amount_cents:refund_cents}"
          - "payment_status -> REFUNDED if refund_cents == deposit_paid_cents else PARTIALLY_REFUNDED"
          - "CASCADE hop1: each BOOKED Seat -> AVAILABLE, current_booking_id cleared"
          - "CASCADE hop2 (caused by hop1): front eligible WAITING WaitlistEntry PROMOTED, auto Booking created holding the freed seat(s)"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "system: Event completion cascade"
        actor: system
        preconditions:
          - "Booking.booking_status == CONFIRMED at the moment its Event completes"
        side_effects:
          - "deposit forfeited: payment_status -> FORFEITED, deposit_paid_cents retained, refund_cents stays 0"

  - entity: WaitlistEntry
    initial_state: WAITING
    terminal_states: [PROMOTED, WITHDRAWN, EXPIRED]
    transitions:
      - from: WAITING
        to: WAITING
        trigger: "POST /events/{id}/waitlist (creation)"
        actor: Guest
        preconditions:
          - "Event.status == OPEN"
          - "Event.available_seat_count == 0 (ERR_SEATS_AVAILABLE otherwise)"
        side_effects:
          - "WaitlistEntry created WAITING; position derived from created_at ASC among WAITING entries"
      - from: WAITING
        to: PROMOTED
        trigger: "system: a booking cancellation frees enough seats"
        actor: system
        preconditions:
          - "This entry is the front WAITING entry (lowest position by created_at ASC) whose party_size <= freed-seat count"
        side_effects:
          - "auto-create a Booking for this guest holding the freed seat(s); set booking_id to that Booking.id; status -> PROMOTED"
      - from: WAITING
        to: WITHDRAWN
        trigger: "POST /waitlist/{id}/withdraw"
        actor: Guest
        preconditions:
          - "WaitlistEntry.status == WAITING (ERR_WAITLIST_ENTRY_NOT_WAITING otherwise)"
        side_effects:
          - "status -> WITHDRAWN"
      - from: WAITING
        to: EXPIRED
        trigger: "system: Event cancel or complete cascade"
        actor: system
        preconditions:
          - "Owning Event transitions to CANCELLED or COMPLETED"
        side_effects:
          - "status -> EXPIRED"

  - entity: Seat
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: HELD
        trigger: "POST /bookings (creation) reserves this seat"
        actor: Guest
        preconditions:
          - "Seat.status == AVAILABLE"
        side_effects:
          - "current_booking_id = new booking.id"
      - from: HELD
        to: BOOKED
        trigger: "POST /bookings/{id}/pay-deposit"
        actor: Guest
        preconditions:
          - "owning Booking transitions PENDING_DEPOSIT -> CONFIRMED"
        side_effects: []
      - from: HELD
        to: AVAILABLE
        trigger: "POST /bookings/{id}/cancel on a PENDING_DEPOSIT booking"
        actor: Guest
        preconditions: []
        side_effects:
          - "current_booking_id cleared"
      - from: BOOKED
        to: AVAILABLE
        trigger: "POST /bookings/{id}/cancel on a CONFIRMED booking"
        actor: Guest
        preconditions: []
        side_effects:
          - "current_booking_id cleared; may trigger waitlist promotion"
      - from: AVAILABLE
        to: BLOCKED
        trigger: "system: Event cancel cascade blocks unsold seats"
        actor: system
        preconditions: []
        side_effects: []
      - from: HELD
        to: BLOCKED
        trigger: "system: Event cancel cascade (seat not sold)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Chef
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: ON_LEAVE
        trigger: "POST /chefs/{id}/set-availability {status: ON_LEAVE}"
        actor: Chef
        preconditions: []
        side_effects: []
      - from: ON_LEAVE
        to: AVAILABLE
        trigger: "POST /chefs/{id}/set-availability {status: AVAILABLE}"
        actor: Chef
        preconditions: []
        side_effects: []

# =====================================================================
# §1.2.1 Concurrency Rules
# =====================================================================
concurrency_rules:
  - rule_id: reprice-stale-event
    parent_entity: Event
    write_endpoint: "POST /events/{id}/reprice"
    occ_field: "expected_event_version"
    description: |
      Repricing an Event whose version has advanced since the client last
      observed it is rejected. Repricing is not state-gated (an Event can be
      repriced repeatedly while DRAFT/SCHEDULED), so a second sequential
      reprice would itself legitimately succeed; the stale expected_event_version
      is the only signal that another writer already superseded the price the
      client based its request on. Resolved purely as a stale-version check.
    error_id: ERR_STALE_EVENT_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: booking_deposit_due
    trigger: "POST /bookings (creation); provisional deposit owed"
    algorithm: aggregation
    formula: |
      base_seat_price(seat) = (seat.price_override_cents if seat.price_override_cents is not null
                               else Event.seat_price_cents)
                              + (HEAD_TABLE_SUPPLEMENT_CENTS if seat.seat_type == HEAD_TABLE else 0)
      # ROUNDING ORDER PINNED: round each seat's deposit to whole cents, THEN sum.
      per_seat_deposit(seat) = round_half_up(base_seat_price(seat) * Event.deposit_pct)
      deposit_due_cents = sum(per_seat_deposit(seat) for seat in seat_ids)
    input_set: "the seats named in Booking.seat_ids at creation time"
    constants:
      HEAD_TABLE_SUPPLEMENT_CENTS: 2000
    precision: "integer cents, round_half_up; round per-seat then sum (NOT sum-then-round)"
    variants:
      - name: provisional_deposit
        when: "at booking creation"
        difference: "applies deposit_pct fraction per seat; ignores group discount and corkage"

  - name: booking_total_price
    trigger: "POST /bookings (creation) and re-derived on read; final full-price settlement"
    algorithm: tiered_pricing
    formula: |
      # EVALUATION ORDER PINNED: subtotal -> tier(party_size) -> discount(min cap) -> corkage -> total
      subtotal = sum(base_seat_price(seat) for seat in seat_ids)
      if Event.table_mode == PRIVATE and party_size >= GROUP_DISCOUNT_MIN_PARTY:
          rate = GROUP_RATE_LARGE if party_size >= GROUP_LARGE_PARTY else GROUP_RATE_SMALL
          group_discount = min(round_half_up(subtotal * rate), MAX_DISCOUNT_CENTS)
      else:
          group_discount = 0
      corkage = (byob_bottles * Event.corkage_fee_cents) if Event.byob_allowed else 0
      total_price_cents = subtotal - group_discount + corkage
    input_set: "the seats named in Booking.seat_ids; party_size; byob_bottles"
    constants:
      HEAD_TABLE_SUPPLEMENT_CENTS: 2000
      GROUP_DISCOUNT_MIN_PARTY: 6
      GROUP_LARGE_PARTY: 10
      GROUP_RATE_SMALL: 0.10
      GROUP_RATE_LARGE: 0.15
      MAX_DISCOUNT_CENTS: 15000
    precision: "integer cents, round_half_up on the discount multiplication"
    variants:
      - name: final_settlement
        when: "full-price computation at booking creation and on read"
        difference: "full seat prices minus group discount plus corkage; NOT the deposit fraction"

  - name: event_revenue
    trigger: "GET /events/{id} (derived on read)"
    algorithm: forward_looking
    formula: |
      projected_revenue_cents = sum(b.total_price_cents for b in event.bookings
                                    if b.booking_status in {PENDING_DEPOSIT, CONFIRMED})
      realized_revenue_cents  = sum(b.total_price_cents for b in event.bookings if b.booking_status == ATTENDED)
                              + sum(b.deposit_paid_cents for b in event.bookings if b.booking_status == NO_SHOW)
    input_set: "all Bookings of the event, partitioned by booking_status"
    constants: {}
    precision: "integer cents"
    variants:
      - name: projected
        when: "forward-looking, counts not-yet-attended reservations at full price"
        difference: "includes PENDING_DEPOSIT and CONFIRMED full totals"
      - name: realized
        when: "chronological, counts only settled outcomes"
        difference: "attended full totals plus forfeited deposits from no-shows; excludes still-pending reservations"

  - name: cancellation_refund
    trigger: "POST /bookings/{id}/cancel on a CONFIRMED booking"
    algorithm: threshold
    formula: |
      days_before = floor((Event.event_start - now) / 86400)   # whole days, floor
      if   days_before >= FULL_REFUND_DAYS:    refund_rate = 1.00
      elif days_before >= HALF_REFUND_DAYS:    refund_rate = 0.50
      elif days_before >= QUARTER_REFUND_DAYS: refund_rate = 0.25
      else:                                    refund_rate = 0.00
      refund_cents = round_half_up(deposit_paid_cents * refund_rate)
    input_set: "the single booking being cancelled and its Event.event_start vs the logical clock"
    constants:
      FULL_REFUND_DAYS: 14
      HALF_REFUND_DAYS: 7
      QUARTER_REFUND_DAYS: 2
    precision: "integer cents, round_half_up"
    variants:
      - name: event_cancel_full_refund
        when: "refund driven by an Event cancellation cascade rather than a guest cancel"
        difference: "always 100% of deposit_paid_cents regardless of days_before"

  - name: seat_inventory_counts
    trigger: "GET /events/{id} (derived on read)"
    algorithm: aggregation
    formula: |
      confirmed_seat_count     = count(seat for seat in event.seats if seat.status == BOOKED)
      available_seat_count     = count(seat for seat in event.seats if seat.status == AVAILABLE)
      gross_deposit_held_cents = sum((b.deposit_paid_cents - b.refund_cents) for b in event.bookings)
    input_set: "all Seat and Booking children of the event"
    constants: {}
    precision: "integer counts and cents"

  - name: waitlist_position
    trigger: "GET /events/{id}/waitlist and promotion selection"
    algorithm: chronological
    formula: |
      waiting = [w for w in event.waitlist_entries if w.status == WAITING] sorted by created_at ASC
      position(w) = 1-based index of w in `waiting`
      promotion selects waiting[0] whose party_size <= freed_seat_count (tie-break: created_at ASC; id is NEVER used)
    input_set: "WAITING entries of the event"
    constants: {}
    precision: "integer position"

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and recognized", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: all }
  - { priority: 2, category: auth, check: "acting role is permitted for this operation per §1.7 (including ownership: Guest acts only on own bookings/waitlist, VenueManager on own venue's events, Chef on own events' menu)", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: all }
  - { priority: 3, category: existence, check: "every path/body id resolves, validated left-to-right", error_id: "ERR_<RESOURCE>_NOT_FOUND", http_status: 404, applies_to: all }
  - { priority: 4, category: business_constraint, check: "request body well-formed: required fields present, enum values legal, types correct", error_id: ERR_VALIDATION, http_status: 422, applies_to: all }
  - { priority: 4, category: business_constraint, check: "party_size == len(seat_ids)", error_id: ERR_SEAT_COUNT_MISMATCH, http_status: 422, applies_to: "POST /bookings" }
  - { priority: 5, category: state, check: "Event.status == OPEN for booking / waitlist creation", error_id: ERR_EVENT_NOT_OPEN, http_status: 409, applies_to: "POST /bookings, POST /events/{id}/waitlist" }
  - { priority: 5, category: state, check: "Event transition legal from current status", error_id: ERR_INVALID_EVENT_STATE, http_status: 409, applies_to: "POST /events/{id}/schedule|open|suspend|resume|complete|reprice" }
  - { priority: 5, category: state, check: "logical clock now >= event_end before complete", error_id: ERR_EVENT_NOT_ENDED, http_status: 409, applies_to: "POST /events/{id}/complete" }
  - { priority: 5, category: state, check: "Booking transition legal from current booking_status", error_id: ERR_INVALID_BOOKING_STATE, http_status: 409, applies_to: "POST /bookings/{id}/pay-deposit, POST /bookings/{id}/check-in" }
  - { priority: 5, category: state, check: "Booking not already ATTENDED/CANCELLED/NO_SHOW before cancel", error_id: ERR_BOOKING_ALREADY_TERMINAL, http_status: 409, applies_to: "POST /bookings/{id}/cancel" }
  - { priority: 5, category: state, check: "WaitlistEntry.status == WAITING before withdraw", error_id: ERR_WAITLIST_ENTRY_NOT_WAITING, http_status: 409, applies_to: "POST /waitlist/{id}/withdraw" }
  - { priority: 5, category: state, check: "expected_event_version == Event.version (OCC)", error_id: ERR_STALE_EVENT_VERSION, http_status: 412, applies_to: "POST /events/{id}/reprice" }
  - { priority: 6, category: business_safety, check: "no dietary_restrictions NUT_ALLERGY while any MenuCourse.contains_allergens includes NUTS", error_id: ERR_ALLERGEN_CONFLICT, http_status: 409, applies_to: "POST /bookings" }
  - { priority: 6, category: business_constraint, check: "Chef status == AVAILABLE at schedule (cross-entity)", error_id: ERR_CHEF_UNAVAILABLE, http_status: 409, applies_to: "POST /events/{id}/schedule" }
  - { priority: 6, category: business_constraint, check: "at least one MenuCourse exists before open", error_id: ERR_MENU_REQUIRED, http_status: 409, applies_to: "POST /events/{id}/open" }
  - { priority: 7, category: business_temporal, check: "no venue interval overlap under [start, end + turnover) semantics", error_id: ERR_VENUE_TIME_CONFLICT, http_status: 409, applies_to: "POST /events/{id}/schedule" }
  - { priority: 7, category: business_temporal, check: "no chef interval overlap under [start - prep, end) semantics", error_id: ERR_CHEF_TIME_CONFLICT, http_status: 409, applies_to: "POST /events/{id}/schedule" }
  - { priority: 7, category: business_temporal, check: "logical clock now <= Event.booking_deadline", error_id: ERR_PAST_BOOKING_DEADLINE, http_status: 409, applies_to: "POST /bookings" }
  - { priority: 8, category: business_referential, check: "every seat in seat_ids has event_id == the target event", error_id: ERR_SEAT_NOT_IN_EVENT, http_status: 422, applies_to: "POST /bookings" }
  - { priority: 9, category: business_constraint, check: "every seat in seat_ids has status == AVAILABLE", error_id: ERR_SEAT_UNAVAILABLE, http_status: 409, applies_to: "POST /bookings" }
  - { priority: 9, category: business_constraint, check: "Event.available_seat_count == 0 required to join waitlist", error_id: ERR_SEATS_AVAILABLE, http_status: 409, applies_to: "POST /events/{id}/waitlist" }
  - { priority: 9, category: business_constraint, check: "byob_bottles > 0 requires Event.byob_allowed == true", error_id: ERR_BYOB_NOT_ALLOWED, http_status: 422, applies_to: "POST /bookings" }
  - { priority: 10, category: business_fiscal, check: "amount_cents == Booking.deposit_due_cents", error_id: ERR_DEPOSIT_AMOUNT_MISMATCH, http_status: 422, applies_to: "POST /bookings/{id}/pay-deposit" }

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # --- SupperClubSeries ---
  - { method: POST, path: "/series", description: "Create a recurring supper-club series", roles: [PlatformAdmin], code: 201, input: [name, cadence, theme, "communal_table?", default_seat_capacity, base_seat_price_cents, default_deposit_pct, "byob_allowed?", "corkage_fee_cents?"], output: SupperClubSeries, side_effects: [] }
  - { method: GET, path: "/series/{id}", description: "Fetch a series", roles: [PlatformAdmin, VenueManager, Chef, Guest, CustomerService], code: 200, input: [], output: SupperClubSeries, side_effects: [] }

  # --- Venue ---
  - { method: POST, path: "/venues", description: "Create a venue", roles: [PlatformAdmin], code: 201, input: [name, address, max_capacity, corkage_policy], output: Venue, side_effects: [] }
  - { method: GET, path: "/venues/{id}", description: "Fetch a venue", roles: [PlatformAdmin, VenueManager, Chef, Guest, CustomerService], code: 200, input: [], output: Venue, side_effects: [] }

  # --- Chef ---
  - { method: POST, path: "/chefs", description: "Create a chef", roles: [PlatformAdmin], code: 201, input: [name, specialty], output: Chef, side_effects: [] }
  - { method: GET, path: "/chefs/{id}", description: "Fetch a chef", roles: [PlatformAdmin, VenueManager, Chef, Guest, CustomerService], code: 200, input: [], output: Chef, side_effects: [] }
  - { method: POST, path: "/chefs/{id}/set-availability", description: "Set chef AVAILABLE/ON_LEAVE", roles: [Chef, PlatformAdmin], code: 200, input: [status], output: Chef, side_effects: ["Chef.status transition"] }

  # --- Guest ---
  - { method: POST, path: "/guests", description: "Register a guest", roles: [PlatformAdmin], code: 201, input: [name, email, "phone?"], output: Guest, side_effects: [] }
  - { method: GET, path: "/guests/{id}", description: "Fetch a guest", roles: [PlatformAdmin, VenueManager, Chef, Guest, CustomerService], code: 200, input: [], output: Guest, side_effects: [] }

  # --- Event ---
  - { method: POST, path: "/events", description: "Create an event in DRAFT referencing a series/venue/chef", roles: [VenueManager, PlatformAdmin], code: 201, input: [series_id, venue_id, chef_id, title, event_start, event_end, booking_deadline, table_mode, seat_capacity, seat_price_cents, deposit_pct, "byob_allowed?", "corkage_fee_cents?"], output: Event, side_effects: [] }
  - { method: GET, path: "/events/{id}", description: "Fetch an event with derived counts and revenue", roles: [PlatformAdmin, VenueManager, Chef, Guest, CustomerService], code: 200, input: [], output: Event, side_effects: ["derive seat_inventory_counts, event_revenue"] }
  - { method: GET, path: "/events", description: "List/filter events", roles: [PlatformAdmin, VenueManager, Chef, Guest, CustomerService], code: 200, input: ["series_id?", "venue_id?", "chef_id?", "status?", "limit?", "offset?"], output: "Event[]", side_effects: [] }
  - { method: POST, path: "/events/{id}/schedule", description: "DRAFT->SCHEDULED; validate chef availability + venue/chef overlap; generate seats", roles: [VenueManager, PlatformAdmin], code: 200, input: ["head_table_count?"], output: Event, side_effects: ["generate Seat rows", "increments Event.version by 1"] }
  - { method: POST, path: "/events/{id}/open", description: "SCHEDULED->OPEN (requires a menu)", roles: [VenueManager, PlatformAdmin], code: 200, input: [], output: Event, side_effects: ["increments Event.version by 1"] }
  - { method: POST, path: "/events/{id}/suspend", description: "OPEN->SUSPENDED (freeze bookings)", roles: [VenueManager, PlatformAdmin], code: 200, input: [], output: Event, side_effects: ["increments Event.version by 1"] }
  - { method: POST, path: "/events/{id}/resume", description: "SUSPENDED->OPEN (cycle)", roles: [VenueManager, PlatformAdmin], code: 200, input: [], output: Event, side_effects: ["increments Event.version by 1"] }
  - { method: POST, path: "/events/{id}/complete", description: "OPEN/SUSPENDED->COMPLETED after event_end; no-show + expiry cascade", roles: [VenueManager, PlatformAdmin], code: 200, input: [], output: Event, side_effects: ["CONFIRMED->NO_SHOW forfeits deposit", "PENDING_DEPOSIT->CANCELLED", "WAITING->EXPIRED", "increments Event.version by 1"] }
  - { method: POST, path: "/events/{id}/cancel", description: "Cancel event; three-hop booking/refund/seat cascade", roles: [VenueManager, PlatformAdmin], code: 200, input: ["reason?"], output: Event, side_effects: ["Bookings CANCELLED + full refund + Payment", "seats freed then unsold BLOCKED", "WAITING->EXPIRED", "increments Event.version by 1"] }
  - { method: POST, path: "/events/{id}/reprice", description: "Update pricing under OCC on Event.version", roles: [VenueManager, PlatformAdmin], code: 200, input: [new_seat_price_cents, "new_deposit_pct?", expected_event_version], output: Event, side_effects: ["update seat_price_cents/deposit_pct", "increments Event.version by 1"] }
  - { method: GET, path: "/events/{id}/seats", description: "List seats of an event (reverse-reachability for Seat.event_id)", roles: [PlatformAdmin, VenueManager, Chef, Guest, CustomerService], code: 200, input: ["status?"], output: "Seat[]", side_effects: [] }
  - { method: GET, path: "/events/{id}/menu", description: "List menu courses of an event (reverse-reachability for MenuCourse.event_id)", roles: [PlatformAdmin, VenueManager, Chef, Guest, CustomerService], code: 200, input: [], output: "MenuCourse[]", side_effects: [] }
  - { method: GET, path: "/events/{id}/waitlist", description: "List waitlist entries of an event (reverse-reachability for WaitlistEntry.event_id)", roles: [PlatformAdmin, VenueManager, Chef, Guest, CustomerService], code: 200, input: ["status?"], output: "WaitlistEntry[]", side_effects: [] }
  - { method: POST, path: "/events/{id}/menu-courses", description: "Add a menu course + wine pairing to an event", roles: [Chef, PlatformAdmin], code: 201, input: [course_number, name, "description?", "paired_wine_name?", "wine_varietal?", "wine_supplement_cents?", "contains_allergens?"], output: MenuCourse, side_effects: [] }
  - { method: POST, path: "/events/{id}/waitlist", description: "Join the waitlist of a full event", roles: [Guest], code: 201, input: [guest_id, party_size], output: WaitlistEntry, side_effects: ["create WAITING entry"] }

  # --- Waitlist ---
  - { method: GET, path: "/waitlist/{id}", description: "Fetch a waitlist entry", roles: [PlatformAdmin, VenueManager, Chef, Guest, CustomerService], code: 200, input: [], output: WaitlistEntry, side_effects: [] }
  - { method: GET, path: "/waitlist", description: "List/filter waitlist entries (reverse-reachability for WaitlistEntry.guest_id/booking_id)", roles: [PlatformAdmin, VenueManager, Chef, Guest, CustomerService], code: 200, input: ["guest_id?", "booking_id?", "event_id?", "status?", "limit?", "offset?"], output: "WaitlistEntry[]", side_effects: [] }
  - { method: POST, path: "/waitlist/{id}/withdraw", description: "Withdraw a WAITING entry", roles: [Guest, CustomerService], code: 200, input: [], output: WaitlistEntry, side_effects: ["status -> WITHDRAWN"] }

  # --- Booking ---
  - { method: POST, path: "/bookings", description: "Create a booking, hold seats, compute deposit/total/corkage", roles: [Guest], code: 201, input: [event_id, guest_id, party_size, seat_ids, "table_preference?", "dietary_restrictions?", "allergy_notes?", "byob_bottles?"], output: Booking, side_effects: ["seats AVAILABLE->HELD", "compute deposit_due_cents/total_price_cents/corkage_due_cents"] }
  - { method: GET, path: "/bookings/{id}", description: "Fetch a booking", roles: [PlatformAdmin, VenueManager, Chef, Guest, CustomerService], code: 200, input: [], output: Booking, side_effects: [] }
  - { method: GET, path: "/bookings", description: "List/filter bookings (reverse-reachability for Booking.event_id/guest_id)", roles: [PlatformAdmin, VenueManager, Chef, Guest, CustomerService], code: 200, input: ["event_id?", "guest_id?", "booking_status?", "limit?", "offset?"], output: "Booking[]", side_effects: [] }
  - { method: POST, path: "/bookings/{id}/pay-deposit", description: "Pay the exact deposit; PENDING_DEPOSIT->CONFIRMED, seats HELD->BOOKED", roles: [Guest], code: 200, input: [amount_cents], output: Booking, side_effects: ["append Payment DEPOSIT", "payment_status UNPAID->DEPOSIT_PAID", "seats HELD->BOOKED"] }
  - { method: POST, path: "/bookings/{id}/check-in", description: "CONFIRMED->ATTENDED at the door", roles: [VenueManager, PlatformAdmin], code: 200, input: [], output: Booking, side_effects: ["booking_status -> ATTENDED"] }
  - { method: POST, path: "/bookings/{id}/cancel", description: "Cancel a booking; refund per tier; free seats; promote waitlist", roles: [Guest, CustomerService], code: 200, input: ["reason?"], output: Booking, side_effects: ["cancellation_refund + Payment REFUND", "seats freed", "waitlist promotion"] }
  - { method: GET, path: "/bookings/{id}/seats", description: "List seats held by a booking (reverse-reachability for Seat.current_booking_id)", roles: [PlatformAdmin, VenueManager, Chef, Guest, CustomerService], code: 200, input: [], output: "Seat[]", side_effects: [] }
  - { method: GET, path: "/bookings/{id}/payments", description: "List payment ledger of a booking (reverse-reachability for Payment.booking_id)", roles: [PlatformAdmin, VenueManager, Chef, Guest, CustomerService], code: 200, input: [], output: "Payment[]", side_effects: [] }

  # --- Test-driving ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock. Server startup default is 2026-03-01T00:00:00Z; before any call here the clock reads exactly that default and never falls back to wall-clock time.", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: "{ now: string }", side_effects: ["advance logical clock"] }

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing/unrecognized auth headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "role not permitted or ownership check failed" }
  - { id: ERR_SERIES_NOT_FOUND, http: 404, condition: "series_id does not resolve" }
  - { id: ERR_VENUE_NOT_FOUND, http: 404, condition: "venue_id does not resolve" }
  - { id: ERR_CHEF_NOT_FOUND, http: 404, condition: "chef_id does not resolve" }
  - { id: ERR_GUEST_NOT_FOUND, http: 404, condition: "guest_id does not resolve" }
  - { id: ERR_EVENT_NOT_FOUND, http: 404, condition: "event id does not resolve" }
  - { id: ERR_SEAT_NOT_FOUND, http: 404, condition: "a seat id does not resolve" }
  - { id: ERR_BOOKING_NOT_FOUND, http: 404, condition: "booking id does not resolve" }
  - { id: ERR_MENU_COURSE_NOT_FOUND, http: 404, condition: "menu course id does not resolve" }
  - { id: ERR_WAITLIST_ENTRY_NOT_FOUND, http: 404, condition: "waitlist entry id does not resolve" }
  - { id: ERR_VALIDATION, http: 422, condition: "missing required field, illegal enum, or wrong type" }
  - { id: ERR_SEAT_COUNT_MISMATCH, http: 422, condition: "party_size != len(seat_ids)" }
  - { id: ERR_EVENT_NOT_OPEN, http: 409, condition: "booking/waitlist creation while Event.status != OPEN" }
  - { id: ERR_INVALID_EVENT_STATE, http: 409, condition: "illegal Event lifecycle transition from current status" }
  - { id: ERR_EVENT_NOT_ENDED, http: 409, condition: "complete requested before now >= event_end" }
  - { id: ERR_INVALID_BOOKING_STATE, http: 409, condition: "illegal Booking transition (e.g., pay-deposit on non PENDING_DEPOSIT)" }
  - { id: ERR_BOOKING_ALREADY_TERMINAL, http: 409, condition: "cancel on an ATTENDED/CANCELLED/NO_SHOW booking" }
  - { id: ERR_WAITLIST_ENTRY_NOT_WAITING, http: 409, condition: "withdraw on a non-WAITING entry" }
  - { id: ERR_STALE_EVENT_VERSION, http: 412, condition: "reprice expected_event_version != Event.version" }
  - { id: ERR_ALLERGEN_CONFLICT, http: 409, condition: "NUT_ALLERGY booking against a menu whose course contains NUTS" }
  - { id: ERR_CHEF_UNAVAILABLE, http: 409, condition: "schedule while referenced Chef.status == ON_LEAVE" }
  - { id: ERR_MENU_REQUIRED, http: 409, condition: "open an event that has no MenuCourse" }
  - { id: ERR_VENUE_TIME_CONFLICT, http: 409, condition: "venue interval overlap under [start, end + turnover) semantics" }
  - { id: ERR_CHEF_TIME_CONFLICT, http: 409, condition: "chef interval overlap under [start - prep, end) semantics" }
  - { id: ERR_PAST_BOOKING_DEADLINE, http: 409, condition: "booking after Event.booking_deadline" }
  - { id: ERR_SEAT_NOT_IN_EVENT, http: 422, condition: "a requested seat belongs to a different event" }
  - { id: ERR_SEAT_UNAVAILABLE, http: 409, condition: "a requested seat is not AVAILABLE" }
  - { id: ERR_SEATS_AVAILABLE, http: 409, condition: "join waitlist while available_seat_count > 0" }
  - { id: ERR_BYOB_NOT_ALLOWED, http: 422, condition: "byob_bottles > 0 on a non-BYOB event" }
  - { id: ERR_DEPOSIT_AMOUNT_MISMATCH, http: 422, condition: "pay-deposit amount != deposit_due_cents" }

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: PlatformAdmin
    description: "Operator superset: seeds series/venues/chefs/guests, sets the logical clock, and may perform any event or booking operation"
    identity: opaque
    exclusive_operations:
      - "POST /series"
      - "POST /venues"
      - "POST /chefs"
      - "POST /guests"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all event lifecycle endpoints (create/schedule/open/suspend/resume/complete/cancel/reprice)"
      - "POST /events/{id}/menu-courses"
      - "POST /chefs/{id}/set-availability"
      - "POST /bookings/{id}/check-in"
      - "all GET reads"

  - name: VenueManager
    description: "Runs event operations for their own venue"
    identity: "entity_backed:Venue"
    exclusive_operations:
      - "POST /events/{id}/schedule|open|suspend|resume|complete|reprice (own venue)"
    shared_operations:
      - "POST /events (own venue)"
      - "POST /events/{id}/cancel (own venue)"
      - "POST /bookings/{id}/check-in (own venue)"
      - "all GET reads"

  - name: Chef
    description: "Owns the menu and availability for events assigned to them"
    identity: "entity_backed:Chef"
    exclusive_operations:
      - "POST /events/{id}/menu-courses (own events)"
    shared_operations:
      - "POST /chefs/{id}/set-availability (self)"
      - "all GET reads"

  - name: Guest
    description: "Books and pays for seats, joins/withdraws waitlist"
    identity: "entity_backed:Guest"
    exclusive_operations:
      - "POST /bookings (self)"
      - "POST /bookings/{id}/pay-deposit (own booking)"
      - "POST /events/{id}/waitlist (self)"
    shared_operations:
      - "POST /bookings/{id}/cancel (own booking)"
      - "POST /waitlist/{id}/withdraw (own entry)"
      - "all GET reads"

  - name: CustomerService
    description: "Operational support: cancels bookings and withdraws waitlist entries on a guest's behalf"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /bookings/{id}/cancel (on behalf)"
      - "POST /waitlist/{id}/withdraw (on behalf)"
      - "all GET reads"
