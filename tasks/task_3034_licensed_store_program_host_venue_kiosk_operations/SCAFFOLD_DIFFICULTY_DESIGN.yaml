            - { call: "POST /licensing/license-agreements/${agr_id}/submit", payload: {}, as: BrandProgramAdmin }
            - { call: "POST /licensing/license-agreements/${agr_id}/accept", payload: {}, as: HostVenueManager, as_user_id: "${ven_id}" }
            - { call: "POST /licensing/license-agreements/${agr_id}/stores", payload: { store_code: "ST1", equipment_footprint_units: 40 }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { store_id: $.data.id } }
            - { call: "POST /licensing/licensees/${lic_id}/employees", payload: { full_name: "E1", role_tag: "BARISTA" }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { emp1: $.data.id } }
            - { call: "POST /licensing/licensees/${lic_id}/employees", payload: { full_name: "E2", role_tag: "BARISTA" }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { emp2: $.data.id } }
