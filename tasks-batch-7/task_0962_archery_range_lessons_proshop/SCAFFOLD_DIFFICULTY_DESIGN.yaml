  - rule_id: cross_entity_state_dependency
    instances:
      - name: checkin_gated_by_participant_waiver_state
        grounds:
          - state_machines.RangeSession.BOOKED_to_CHECKED_IN
          - entities.Waiver.fields.status
          - errors[ERR_WAIVER_EXPIRED]
        distinguishing_aspect: |
          RangeSession's BOOKED -> CHECKED_IN transition is gated by the state of a different entity
          (every ACTIVE participant's Waiver must be ACTIVE); the waiver expired between booking and
          check-in via the clock sweep, so check-in fails with ERR_WAIVER_EXPIRED.
        test_recipe:
          setup:
            - "member signed waiver at clock 2025-05-01 (valid_until 2026-05-01); lane; RESERVED session 2026-05-02T10:00-11:00Z with self WALLET participant booked while waiver ACTIVE"
            - "clock advanced to 2026-05-02T10:00:00Z: waiver swept to EXPIRED; session inside check-in window"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2025-05-01T00:00:00Z" }, as: Admin }
            - call: "POST /members"
              payload: { email: "gate@x.com", full_name: "Gate Archer", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - { call: "POST /members/${m_id}/waivers", payload: {}, as: Member, as_user_id: "${m_id}" }
            - { call: "POST /members/${m_id}/wallet/adjustments", payload: { amount_cents: 10000 }, as: Admin }
            - call: "POST /lanes"
              payload: { name: "GL", lane_type: "INDOOR", max_archers: 4 }
              as: Admin
              captures: { lane_id: $.data.id }
            - call: "POST /range-sessions"
              payload: { lane_id: "${lane_id}", booking_type: "RESERVATION", start_at: "2026-05-02T10:00:00Z", end_at: "2026-05-02T11:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { s_id: $.data.id }
            - { call: "POST /range-sessions/${s_id}/participants", payload: { member_id: "${m_id}", payment_method: "WALLET" }, as: Member, as_user_id: "${m_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T10:00:00Z" }, as: Admin }
          trigger:
            - call: "POST /range-sessions/${s_id}/check-in"
              payload: {}
              as: RangeOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_WAIVER_EXPIRED (422)"
            - "RangeSession.${s_id}.session_status remains BOOKED"
            - "Member.${m_id}.wallet_balance_cents == 7840 (quoted debit stands; no refund on failed check-in)"
      - name: lesson_confirm_gated_by_coach_state
        grounds:
          - state_machines.Lesson.REQUESTED_to_CONFIRMED
          - entities.Coach.fields.status
          - errors[ERR_COACH_INACTIVE]
        distinguishing_aspect: |
          Lesson's REQUESTED -> CONFIRMED transition is gated by a different entity pair than the session/
          waiver instance: Coach.status must be ACTIVE. Deactivating the coach between request and confirm
          blocks the transition with ERR_COACH_INACTIVE.
        test_recipe:
          setup:
            - "ACTIVE coach RECURVE; member wallet 10000 waiver; lesson REQUESTED at 2026-05-02T10:00Z"
            - "Admin deactivated the coach after the request"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: Admin }
            - call: "POST /coaches"
              payload: { full_name: "Coach Lo", disciplines: ["RECURVE", "COMPOUND"] }
              as: Admin
              captures: { c_id: $.data.id }
            - call: "POST /members"
              payload: { email: "lg@x.com", full_name: "Lesson Gate", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - { call: "POST /members/${m_id}/wallet/adjustments", payload: { amount_cents: 10000 }, as: Admin }
            - { call: "POST /members/${m_id}/waivers", payload: {}, as: Member, as_user_id: "${m_id}" }
            - call: "POST /lessons"
              payload: { coach_id: "${c_id}", discipline: "RECURVE", proposed_start_at: "2026-05-02T10:00:00Z", duration_minutes: 60 }
              as: Member
              as_user_id: "${m_id}"
              captures: { l_id: $.data.id }
            - { call: "POST /coaches/${c_id}/deactivate", payload: {}, as: Admin }
          trigger:
            - call: "POST /lessons/${l_id}/confirm"
              payload: {}
              as: Coach
              as_user_id: "${c_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_COACH_INACTIVE (409)"
            - "Lesson.${l_id}.status remains REQUESTED"
            - "Member.${m_id}.wallet_balance_cents == 10000 (no fee debited)"
  - rule_id: resource_temporal_overlap
    instances:
      - name: lane_half_open_interval_adjacency
        grounds:
          - errors[ERR_LANE_OVERLAP]
          - validations[priority=7]
          - entities.RangeSession.fields.end_at
        distinguishing_aspect: |
          Half-open interval semantics on Lane: [10:00,11:00) and [11:00,12:00) touch but do not overlap,
          so the adjacent booking succeeds; [10:30,11:30) strictly overlaps and is rejected ERR_LANE_OVERLAP.
        test_recipe:
          setup:
            - "member with waiver; lane L; existing BOOKED session 2026-05-02T10:00-11:00Z on L (created at clock 2026-05-01T08:00Z)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: Admin }
            - call: "POST /members"
              payload: { email: "ov@x.com", full_name: "Overlap Tester", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - { call: "POST /members/${m_id}/waivers", payload: {}, as: Member, as_user_id: "${m_id}" }
            - call: "POST /lanes"
              payload: { name: "OL", lane_type: "OUTDOOR", max_archers: 4 }
              as: Admin
              captures: { lane_id: $.data.id }
            - call: "POST /range-sessions"
              payload: { lane_id: "${lane_id}", booking_type: "RESERVATION", start_at: "2026-05-02T10:00:00Z", end_at: "2026-05-02T11:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /range-sessions"
              payload: { lane_id: "${lane_id}", booking_type: "RESERVATION", start_at: "2026-05-02T11:00:00Z", end_at: "2026-05-02T12:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { s2: $.data.id }
            - call: "POST /range-sessions"
              payload: { lane_id: "${lane_id}", booking_type: "RESERVATION", start_at: "2026-05-02T10:30:00Z", end_at: "2026-05-02T11:30:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "adjacent [11:00,12:00) booking succeeds with its own id ${s2} (end_at == start_at is NOT overlap under half-open semantics)"
            - "overlapping [10:30,11:30) booking rejected error_id == ERR_LANE_OVERLAP (409)"
      - name: coach_buffered_interval_exact_gap
        grounds:
          - errors[ERR_COACH_OVERLAP]
          - state_machines.Lesson.REQUESTED_to_CONFIRMED
          - validations[priority=7]
        distinguishing_aspect: |
          Different resource and different interval semantics from the lane instance: a coach's CONFIRMED
          lessons require a >= 15-minute buffer (closed-interval + guard band). A lesson starting exactly
          15 minutes after the prior end confirms; one starting at 14 minutes is rejected ERR_COACH_OVERLAP.
        test_recipe:
          setup:
            - "ACTIVE coach RECURVE; member wallet 20000 waiver"
            - "lesson A CONFIRMED 2026-05-02T10:00-11:00Z (60 min); lesson B REQUESTED 11:15; lesson C REQUESTED 11:14"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: Admin }
            - call: "POST /coaches"
              payload: { full_name: "Coach Bo", disciplines: ["RECURVE"] }
              as: Admin
              captures: { c_id: $.data.id }
            - call: "POST /members"
              payload: { email: "buf@x.com", full_name: "Buffer Tester", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - { call: "POST /members/${m_id}/wallet/adjustments", payload: { amount_cents: 20000 }, as: Admin }
            - { call: "POST /members/${m_id}/waivers", payload: {}, as: Member, as_user_id: "${m_id}" }
            - call: "POST /lessons"
              payload: { coach_id: "${c_id}", discipline: "RECURVE", proposed_start_at: "2026-05-02T10:00:00Z", duration_minutes: 60 }
              as: Member
              as_user_id: "${m_id}"
              captures: { la: $.data.id }
            - { call: "POST /lessons/${la}/confirm", payload: {}, as: Coach, as_user_id: "${c_id}" }
            - call: "POST /lessons"
              payload: { coach_id: "${c_id}", discipline: "RECURVE", proposed_start_at: "2026-05-02T11:15:00Z", duration_minutes: 60 }
              as: Member
              as_user_id: "${m_id}"
              captures: { lb: $.data.id }
            - call: "POST /lessons"
              payload: { coach_id: "${c_id}", discipline: "RECURVE", proposed_start_at: "2026-05-02T11:14:00Z", duration_minutes: 60 }
              as: Member
              as_user_id: "${m_id}"
              captures: { lc: $.data.id }
          trigger:
            - call: "POST /lessons/${lb}/confirm"
              payload: {}
              as: Coach
              as_user_id: "${c_id}"
              captures: { st_b: $.data.status }
            - call: "POST /lessons/${lc}/confirm"
              payload: {}
              as: Coach
              as_user_id: "${c_id}"
              captures: { err: $.data.error_id }
          assert:
            - "lesson B (11:15 start, exactly 15-minute gap) confirms: status == CONFIRMED"
            - "lesson C (11:14 start, 14-minute gap) rejected error_id == ERR_COACH_OVERLAP (409), stays REQUESTED"
            - "Member.${m_id}.wallet_balance_cents == 8000 (only A and B debited 6000 each)"
  - rule_id: compensating_invariant
    instances:
      - name: punch_consume_and_cancel_restore_invariant
        grounds:
          - state_machines.PunchCard.ACTIVE_to_EXHAUSTED
          - state_machines.RangeSession.BOOKED_to_CANCELLED
          - entities.PunchCard.fields.punches_used
        distinguishing_aspect: |
          Conserved quantity: punch count. The forward action (participant add) consumes a punch and its
          compensating action (voluntary cancel with notice >= 4h) restores it, so
          punches_used + punches_remaining == punches_total (5) holds before, during, and after the pair.
        test_recipe:
          setup:
            - "owner BASIC wallet 10000 waiver; 5-punch card purchased (wallet 5000); guest member with waiver"
            - "lane; owner RESERVED session 2026-05-03T10:00-11:00Z; guest added PUNCH_CARD (punches_used 1)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: Admin }
            - call: "POST /members"
              payload: { email: "host2@x.com", full_name: "Host Two", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { o_id: $.data.id }
            - { call: "POST /members/${o_id}/wallet/adjustments", payload: { amount_cents: 10000 }, as: Admin }
            - { call: "POST /members/${o_id}/waivers", payload: {}, as: Member, as_user_id: "${o_id}" }
            - call: "POST /members/${o_id}/punch-cards"
              payload: { punches_total: 5 }
              as: Member
              as_user_id: "${o_id}"
              captures: { pc_id: $.data.id }
            - call: "POST /members"
              payload: { email: "gst@x.com", full_name: "Guest Archer", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { g_id: $.data.id }
            - { call: "POST /members/${g_id}/waivers", payload: {}, as: Member, as_user_id: "${g_id}" }
            - call: "POST /lanes"
              payload: { name: "IL", lane_type: "INDOOR", max_archers: 4 }
              as: Admin
              captures: { lane_id: $.data.id }
            - call: "POST /range-sessions"
              payload: { lane_id: "${lane_id}", booking_type: "RESERVATION", start_at: "2026-05-03T10:00:00Z", end_at: "2026-05-03T11:00:00Z" }
              as: Member
              as_user_id: "${o_id}"
              captures: { s_id: $.data.id }
            - { call: "POST /range-sessions/${s_id}/participants", payload: { member_id: "${g_id}", payment_method: "PUNCH_CARD", punch_card_id: "${pc_id}" }, as: Member, as_user_id: "${o_id}" }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: Admin }
            - call: "POST /range-sessions/${s_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${o_id}"
            - call: "GET /punch-cards/${pc_id}"
              payload: {}
              as: RangeOfficer
              captures: { used: $.data.punches_used, rem: $.data.punches_remaining, pst: $.data.status }
          assert:
            - "PunchCard.${pc_id}.punches_used == 0 after consume+cancel pair (punch restored, notice > 24h)"
            - "PunchCard.${pc_id}.status == ACTIVE and punches_used + punches_remaining == 5 (invariant, no drift)"
            - "RangeSession.${s_id}.payment_status == REFUNDED"
      - name: wallet_charge_and_full_refund_invariant
        grounds:
          - calculations.cancellation_refund
          - entities.Member.fields.wallet_balance_cents
          - state_machines.RangeSession.BOOKED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: wallet cents (different quantity type from the punch-count instance).
          Participant-add charge (2160) paired with a full-refund cancel (notice >= 24h) returns
          wallet_balance_cents to its exact pre-pair value 10000 — the pair leaves the wallet unchanged.
        test_recipe:
          setup:
            - "PLUS member wallet 10000 waiver; lane; RESERVED session 2026-05-03T10:00-11:00Z; self WALLET participant quoted 2160 (wallet 7840)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: Admin }
            - call: "POST /members"
              payload: { email: "inv@x.com", full_name: "Invariant Tester", date_of_birth: "1990-01-01", tier: "PLUS" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - { call: "POST /members/${m_id}/wallet/adjustments", payload: { amount_cents: 10000 }, as: Admin }
            - { call: "POST /members/${m_id}/waivers", payload: {}, as: Member, as_user_id: "${m_id}" }
            - call: "POST /lanes"
              payload: { name: "WL", lane_type: "INDOOR", max_archers: 4 }
              as: Admin
              captures: { lane_id: $.data.id }
            - call: "POST /range-sessions"
              payload: { lane_id: "${lane_id}", booking_type: "RESERVATION", start_at: "2026-05-03T10:00:00Z", end_at: "2026-05-03T11:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { s_id: $.data.id }
            - { call: "POST /range-sessions/${s_id}/participants", payload: { member_id: "${m_id}", payment_method: "WALLET" }, as: Member, as_user_id: "${m_id}" }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: Admin }
            - call: "POST /range-sessions/${s_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { refund: $.data.cancellation_refund_cents }
            - call: "GET /members/${m_id}"
              payload: {}
              as: Admin
              captures: { wallet_after: $.data.wallet_balance_cents }
          assert:
            - "RangeSession.${s_id}.cancellation_refund_cents == 2160 (full refund at notice > 24h)"
            - "Member.${m_id}.wallet_balance_cents == 10000 — identical to the pre-pair balance (charge + full-refund compensation leaves zero drift)"
            - "RangeSession.${s_id}.payment_status == REFUNDED"
