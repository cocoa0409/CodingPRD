scaffold_corner_design:

  # =========================================================================
  # Section: entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_product_returns_201_with_all_fields
        claim_type: Creation
        grounds: [entities.Product, endpoints]
        distinguishing_aspect: "POST /products with all required fields returns 201 and a Product whose sku/unit_price_cents/tax_rate_bps/return_window_days echo the input and id/created_at/version are system-minted."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { sku: "PX", title: "PX", unit_price_cents: 1999, tax_rate_bps: 700, return_window_days: 14 }
              as: StoreAdmin
              captures: { pid: $.data.id, ver: $.data.version }
          assert:
            - "HTTP 201"
            - "Product.${pid}.unit_price_cents == 1999 and tax_rate_bps == 700 and return_window_days == 14"
            - "Product.${pid}.version == 1 and restocking_fee_bps == 0 (default) and final_sale == false (default)"

      - name: get_product_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Product, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /products/{nonexistent-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /products/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: StoreAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_product_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Product, "validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /products omitting required unit_price_cents returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { sku: "PNO", title: "PNO", tax_rate_bps: 700, return_window_days: 14 }
              as: StoreAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_warehouse_accepts_returns_default_true
        claim_type: Defaults
        grounds: [entities.Warehouse.fields.accepts_returns]
        distinguishing_aspect: "POST /warehouses omitting accepts_returns yields accepts_returns == true (declared default)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /warehouses"
              payload: { code: "WD", name: "Def", fulfillment_priority: 1 }
              as: StoreAdmin
              captures: { wid: $.data.id }
          assert:
            - "Warehouse.${wid}.accepts_returns == true"

      - name: order_line_price_snapshot_immune_to_later_catalog_edit
        claim_type: Computed Fields
        grounds: [entities.OrderLine.fields.unit_price_cents_snapshot]
        distinguishing_aspect: "After adding a line at unit 1000, even though no price-edit endpoint exists, the line carries unit_price_cents_snapshot == 1000 as a computed copy (input value cannot override the snapshot)."
        test_recipe:
          setup: ["a product at unit 1000 and a CART order"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "snap@x.com", full_name: "Snap" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SNAP", title: "SNAP", unit_price_cents: 1000, tax_rate_bps: 0, return_window_days: 30 }
              as: StoreAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /orders/${ord_id}/lines"
              payload: { product_id: "${prod_id}", qty: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ol_id: $.data.id, snap: $.data.unit_price_cents_snapshot }
          assert:
            - "OrderLine.${ol_id}.unit_price_cents_snapshot == 1000"

      - name: customer_id_system_generated_input_ignored
        claim_type: System Fields
        grounds: [entities.Customer]
        distinguishing_aspect: "POST /customers — server mints id/created_at/version; client cannot supply id (extra unknown field rejected as ERR_INVALID_REQUEST)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { email: "sys@x.com", full_name: "Sys", id: "client-supplied" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "response.data.error_id == ERR_INVALID_REQUEST  # `id` is not a declared input field"

      - name: create_order_line_invalid_qty_zero_returns_validation
        claim_type: Type Constraints
        grounds: [entities.OrderLine.fields.qty, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /orders/{id}/lines with qty 0 violates the qty >= 1 constraint → ERR_VALIDATION (422)."
        test_recipe:
          setup: ["a product and a CART order"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "q0@x.com", full_name: "Q0" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "Q0P", title: "Q0P", unit_price_cents: 1000, tax_rate_bps: 0, return_window_days: 30 }
              as: StoreAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /orders/${ord_id}/lines"
              payload: { product_id: "${prod_id}", qty: 0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422"
            - "response.data.error_id == ERR_VALIDATION"

      - name: order_line_requires_valid_parent_order
        claim_type: Parent Relationships
        grounds: [entities.OrderLine.fields.order_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /orders/{nonexistent}/lines → ERR_NOT_FOUND because the parent Order id does not resolve."
        test_recipe:
          setup: ["a product but no such order"]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "PPAR", title: "PPAR", unit_price_cents: 1000, tax_rate_bps: 0, return_window_days: 30 }
              as: StoreAdmin
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /orders/00000000-0000-0000-0000-000000000000/lines"
              payload: { product_id: "${prod_id}", qty: 1 }
              as: StoreAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: list_orders_pagination_envelope
        claim_type: Listing
        grounds: [entities.Order, endpoints]
        distinguishing_aspect: "GET /customers/{id}/orders returns an array envelope carrying total_count and has_more pagination fields."
        test_recipe:
          setup: ["a customer with one cart order"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "pg@x.com", full_name: "Pg" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "GET /customers/${cust_id}/orders"
              payload: { limit: 10, offset: 0 }
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "response_type == array; meta.total_count == 1; meta.has_more == false"

      - name: credit_ledger_entry_is_immutable_no_version
        claim_type: Immutability
        grounds: [entities.CreditLedgerEntry]
        distinguishing_aspect: "CreditLedgerEntry has common_fields:false → it carries id and created_at but no version field and no update endpoint exists."
        test_recipe:
          setup: ["a customer with an admin credit adjustment"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "imm@x.com", full_name: "Imm" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/credit-adjustments"
              payload: { amount_cents: 500, kind: "ADMIN_ADJUSTMENT" }
              as: StoreAdmin
          trigger:
            - call: "GET /customers/${cust_id}/credit-entries"
              payload: {}
              as: StoreAdmin
          assert:
            - "the single CreditLedgerEntry has no `version` key; only id/created_at common fields and amount_cents/kind"

  # =========================================================================
  # Section: state_machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: checkout_from_already_authorized_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.ReturnAuthorization, "validations[priority=6]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Calling checkout a second time on an already-AUTHORIZED order is not a defined transition → ERR_INVALID_STATE (409); no totals recompute."
        test_recipe:
          setup: ["an AUTHORIZED order (checked out once)"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "ck2@x.com", full_name: "Ck2" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /warehouses"
              payload: { code: "WCK", name: "Main", fulfillment_priority: 1 }
              as: StoreAdmin
              captures: { wh_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "CK2", title: "CK2", unit_price_cents: 1000, tax_rate_bps: 0, return_window_days: 30 }
              as: StoreAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /inventory"
              payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", on_hand_qty: 10 }
              as: StoreAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/lines"
              payload: { product_id: "${prod_id}", qty: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /orders/${ord_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_v: $.data.version }
            - call: "POST /orders/${ord_id}/checkout"
              payload: { expected_order_version: "${ord_v}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /orders/${ord_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_v2: $.data.version }
          trigger:
            - call: "POST /orders/${ord_id}/checkout"
              payload: { expected_order_version: "${ord_v2}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: deliver_pending_shipment_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Shipment, "validations[priority=6]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /shipments/{id}/deliver on a PENDING (never shipped) shipment is undefined → ERR_INVALID_STATE; deliver requires SHIPPED."
        test_recipe:
          setup: ["a captured order with a PENDING shipment (not shipped)"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "dl@x.com", full_name: "Dl" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /warehouses"
              payload: { code: "WDL", name: "Main", fulfillment_priority: 1 }
              as: StoreAdmin
              captures: { wh_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "DLP", title: "DLP", unit_price_cents: 1000, tax_rate_bps: 0, return_window_days: 30 }
              as: StoreAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /inventory"
              payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", on_hand_qty: 10 }
              as: StoreAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/lines"
              payload: { product_id: "${prod_id}", qty: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ol_id: $.data.id }
            - call: "GET /orders/${ord_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_v: $.data.version }
            - call: "POST /orders/${ord_id}/checkout"
              payload: { expected_order_version: "${ord_v}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${ord_id}/capture-payment"
              payload: {}
              as: StoreAdmin
            - call: "GET /order-lines/${ol_id}/reservations"
              payload: {}
              as: StoreAdmin
              captures: { res_id: "$.data[0].id" }
            - call: "POST /orders/${ord_id}/shipments"
              payload: { warehouse_id: "${wh_id}", lines: [{ reservation_id: "${res_id}", qty: 1 }] }
              as: WarehouseOperator
              captures: { ship_id: $.data.id }
          trigger:
            - call: "POST /shipments/${ship_id}/deliver"
              payload: {}
              as: WarehouseOperator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: settle_rejected_rma_returns_invalid_state_terminal
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ReturnAuthorization, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A REJECTED RMA is terminal; POST /returns/{id}/settle on it returns ERR_INVALID_STATE — no transition leaves a terminal state."
        test_recipe:
          setup: ["a REQUESTED RMA then REJECTED"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: StoreAdmin
            - call: "POST /customers"
              payload: { email: "rj@x.com", full_name: "Rj" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /warehouses"
              payload: { code: "WRJ", name: "Main", fulfillment_priority: 1 }
              as: StoreAdmin
              captures: { wh_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "RJP", title: "RJP", unit_price_cents: 1000, tax_rate_bps: 0, return_window_days: 30 }
              as: StoreAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /inventory"
              payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", on_hand_qty: 10 }
              as: StoreAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/lines"
              payload: { product_id: "${prod_id}", qty: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ol_id: $.data.id }
            - call: "GET /orders/${ord_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_v: $.data.version }
            - call: "POST /orders/${ord_id}/checkout"
              payload: { expected_order_version: "${ord_v}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${ord_id}/capture-payment"
              payload: {}
              as: StoreAdmin
            - call: "GET /order-lines/${ol_id}/reservations"
              payload: {}
              as: StoreAdmin
              captures: { res_id: "$.data[0].id" }
            - call: "POST /orders/${ord_id}/shipments"
              payload: { warehouse_id: "${wh_id}", lines: [{ reservation_id: "${res_id}", qty: 1 }] }
              as: WarehouseOperator
              captures: { ship_id: $.data.id }
            - call: "POST /shipments/${ship_id}/ship"
              payload: {}
              as: WarehouseOperator
            - call: "POST /shipments/${ship_id}/deliver"
              payload: {}
              as: WarehouseOperator
            - call: "POST /orders/${ord_id}/returns"
              payload: { reason: "NO_LONGER_WANTED", resolution: "REFUND", lines: [{ order_line_id: "${ol_id}", return_qty: 1 }] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rma_id: $.data.id }
            - call: "POST /returns/${rma_id}/reject"
              payload: {}
              as: StoreAdmin
          trigger:
            - call: "POST /returns/${rma_id}/settle"
              payload: {}
              as: StoreAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: new_order_initial_state_cart_unfulfilled
        claim_type: initial_state
        grounds: [state_machines.Order, entities.Order.fields.payment_status]
        distinguishing_aspect: "A freshly created order has payment_status CART and fulfillment_status UNFULFILLED and version 1."
        test_recipe:
          setup: ["a customer"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "init@x.com", full_name: "Init" }
              as: Anonymous
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
          assert:
            - "Order.${ord_id}.payment_status == CART and fulfillment_status == UNFULFILLED and version == 1"

      - name: checkout_empty_cart_returns_invalid_state
        claim_type: precondition_enforcement
        grounds: [state_machines.Order, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Checkout of a CART with zero OrderLines violates the 'order has >= 1 OrderLine' precondition → ERR_INVALID_STATE."
        test_recipe:
          setup: ["an empty CART order"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "ec@x.com", full_name: "Ec" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "GET /orders/${ord_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_v: $.data.version }
          trigger:
            - call: "POST /orders/${ord_id}/checkout"
              payload: { expected_order_version: "${ord_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: void_after_ship_blocked_invalid_state
        claim_type: guarded_transition
        grounds: [state_machines.Order, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Void requires no SHIPPED/DELIVERED shipment; voiding an order that already has a SHIPPED shipment is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["a captured order with one SHIPPED shipment"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "vs@x.com", full_name: "Vs" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /warehouses"
              payload: { code: "WVS", name: "Main", fulfillment_priority: 1 }
              as: StoreAdmin
              captures: { wh_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "VSP", title: "VSP", unit_price_cents: 1000, tax_rate_bps: 0, return_window_days: 30 }
              as: StoreAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /inventory"
              payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", on_hand_qty: 10 }
              as: StoreAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/lines"
              payload: { product_id: "${prod_id}", qty: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ol_id: $.data.id }
            - call: "GET /orders/${ord_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_v: $.data.version }
            - call: "POST /orders/${ord_id}/checkout"
              payload: { expected_order_version: "${ord_v}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${ord_id}/capture-payment"
              payload: {}
              as: StoreAdmin
            - call: "GET /order-lines/${ol_id}/reservations"
              payload: {}
              as: StoreAdmin
              captures: { res_id: "$.data[0].id" }
            - call: "POST /orders/${ord_id}/shipments"
              payload: { warehouse_id: "${wh_id}", lines: [{ reservation_id: "${res_id}", qty: 1 }] }
              as: WarehouseOperator
              captures: { ship_id: $.data.id }
            - call: "POST /shipments/${ship_id}/ship"
              payload: {}
              as: WarehouseOperator
          trigger:
            - call: "POST /orders/${ord_id}/void"
              payload: {}
              as: StoreAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "response.data.error_id == ERR_INVALID_STATE  # void forbidden once a shipment is SHIPPED"

      - name: partial_shipment_sets_partially_shipped_bubble_up
        claim_type: side_effect_execution
        grounds: [state_machines.Shipment, entities.Order.fields.fulfillment_status, entities.OrderLine.fields.shipped_qty]
        distinguishing_aspect: "Shipping one of two reservations on a split line drives Order.fulfillment_status to PARTIALLY_SHIPPED and OrderLine.shipped_qty to the shipped portion (bubble-up re-derive)."
        test_recipe:
          setup: ["captured order, one line qty 8 split across W1(5)+W2(3); ship only the W1 reservation (qty5)"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "ps@x.com", full_name: "Ps" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /warehouses"
              payload: { code: "PW1", name: "W1", fulfillment_priority: 1 }
              as: StoreAdmin
              captures: { w1_id: $.data.id }
            - call: "POST /warehouses"
              payload: { code: "PW2", name: "W2", fulfillment_priority: 2 }
              as: StoreAdmin
              captures: { w2_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "PSP", title: "PSP", unit_price_cents: 1000, tax_rate_bps: 0, return_window_days: 30 }
              as: StoreAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /inventory"
              payload: { product_id: "${prod_id}", warehouse_id: "${w1_id}", on_hand_qty: 5 }
              as: StoreAdmin
            - call: "POST /inventory"
              payload: { product_id: "${prod_id}", warehouse_id: "${w2_id}", on_hand_qty: 10 }
              as: StoreAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/lines"
              payload: { product_id: "${prod_id}", qty: 8 }
              as: Customer
              as_user_id: "${cust_id}"
