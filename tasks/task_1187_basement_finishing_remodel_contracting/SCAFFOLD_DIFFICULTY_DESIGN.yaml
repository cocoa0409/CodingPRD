          - state_machines.MoistureAssessment.DRAFT_to_REJECTED
        distinguishing_aspect: |
          Slab emission metric boundary at exactly 5.0 lbs: 5.0 scores 25
          (3.0 < x <= 5.0) -> MODERATE -> ACCEPTED, while 5.01 scores 50 -> HIGH
          -> REJECTED; reached via the assessment submit endpoint. Sibling boundary
          is an integer-count metric on a different endpoint.
