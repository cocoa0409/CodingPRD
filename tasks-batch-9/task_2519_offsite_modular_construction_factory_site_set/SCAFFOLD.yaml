    code: 200
    input: [reject_reason]
    output: DrawRequest
    side_effects: ["status -> REJECTED with reject_reason stored", "when the draw was CERTIFIED, project.wip_certified_cents -= certified_cents (compensating reversal, no drift)", "certified_cents / retainage_held_cents / net_funded_cents reset to 0", "increments DrawRequest.version and Project.version by 1"]

  # ---- test-driving endpoint ------------------------------------------------
  - method: POST
    path: "/modular/_clock/set_current_utc"
    description: "set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z (the mandatory startup default) and never falls back to real wall-clock time. Advancing the clock ages weather exposure on set modules, expires transport and building permits, and re-derives every affected project's permit_posture."
    roles: [ProgramAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["every APPROVED PermitRecord whose expires_at <= the new instant transitions to EXPIRED and its project's permit_posture is re-derived", "recomputes calculations.module_exposure_hours for every module with site_status == SET and connected_at == null", "the clock never moves backwards"]

# -----------------------------------------------------------------------------
# §1.6 Error Catalog
# -----------------------------------------------------------------------------
errors:
  # -- auth -------------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID missing, or X-User-Role is not one of the ten declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the caller's role is not listed in the endpoint's roles"
  - id: ERR_ACTOR_NOT_OWNER
    http: 403
    condition: "an entity_backed caller acts on an aggregate its X-User-ID does not own"
  - id: ERR_PERMIT_TRACK_ROLE_MISMATCH
    http: 403
    condition: "StateProgramOfficer decides a LOCAL_AHJ permit, or AuthorityHavingJurisdiction decides a STATE_MODULAR_PROGRAM permit"
  - id: ERR_SAME_ACTOR_REVIEW
    http: 403
    condition: "the engineer recording a design review-decision is the same X-User-ID that submitted the package"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body, missing required field, unknown enum member, or a numeric constraint from §1.1 violated"

  # -- existence --------------------------------------------------------------
  - id: ERR_FACTORY_NOT_FOUND
    http: 404
    condition: "no Factory with the given id"
  - id: ERR_AGENCY_NOT_FOUND
    http: 404
    condition: "no InspectionAgency with the given id"
  - id: ERR_PROJECT_NOT_FOUND
    http: 404
    condition: "no Project with the given id"
  - id: ERR_DESIGN_PACKAGE_NOT_FOUND
    http: 404
    condition: "no DesignPackage with the given id (path id, design_package_id or supersedes_package_id)"
  - id: ERR_MODULE_NOT_FOUND
    http: 404
    condition: "no ModuleUnit with the given id"
  - id: ERR_PERMIT_NOT_FOUND
    http: 404
    condition: "no PermitRecord with the given id"
  - id: ERR_INSPECTION_NOT_FOUND
    http: 404
    condition: "no InspectionRecord with the given id"
  - id: ERR_SHIPMENT_NOT_FOUND
    http: 404
    condition: "no Shipment with the given id"
  - id: ERR_DEFECT_CLAIM_NOT_FOUND
    http: 404
    condition: "no DefectClaim with the given id"
  - id: ERR_DRAW_NOT_FOUND
    http: 404
    condition: "no DrawRequest with the given id"

  # -- optimistic concurrency -------------------------------------------------
  - id: ERR_STALE_PROJECT_VERSION
    http: 412
    condition: "expected_project_version does not equal the Project's current version on design-package creation"
  - id: ERR_STALE_SHIPMENT_VERSION
    http: 412
    condition: "expected_shipment_version does not equal the Shipment's current version on load-module"

  # -- state ------------------------------------------------------------------
  - id: ERR_DESIGN_REVIEW_IN_FLIGHT
    http: 409
    condition: "another DesignPackage of the same project is already IN_REVIEW"
  - id: ERR_DESIGN_NOT_SUBMITTABLE
    http: 409
    condition: "submit attempted on a package that is not DRAFT or REVISION_REQUIRED"
  - id: ERR_DESIGN_NOT_IN_REVIEW
    http: 409
    condition: "review-decision attempted on a package that is not IN_REVIEW"
  - id: ERR_DRAW_NOT_DRAFT
    http: 409
    condition: "certify attempted on a draw that is not in status DRAFT"
  - id: ERR_DRAW_NOT_CERTIFIED
    http: 409
    condition: "fund attempted on a draw that is not CERTIFIED, or reject attempted on a draw that is neither DRAFT nor CERTIFIED"
  - id: ERR_MODULE_NOT_PLANNED
    http: 409
    condition: "schedule-line-slot attempted on a module whose production_status is not PLANNED"
  - id: ERR_MODULE_NOT_SLOTTED
    http: 409
    condition: "release-line-slot attempted on a module whose production_status is not SLOTTED"
  - id: ERR_MODULE_NOT_ON_LINE
    http: 409
    condition: "advance-station attempted on a module that is neither SLOTTED nor IN_LINE"
  - id: ERR_MODULE_NOT_READY_TO_SET
    http: 409
    condition: "execute-set attempted on a module whose site_status is not DELIVERED, or schedule-pick attempted on an already CONNECTED module"
  - id: ERR_MODULE_NOT_SET
    http: 409
    condition: "close-connections attempted on a module whose site_status is not SET"
  - id: ERR_FIELD_SCOPE_NOT_SIGNED_OFF
    http: 422
    condition: "close-connections attempted with field_scope_signed_off == false"
  - id: ERR_SHIPMENT_NOT_LOADABLE
    http: 409
    condition: "load-module attempted on a shipment past SURVEY_REQUIRED, or with a module that is not AT_FACTORY and LINE_COMPLETE"
  - id: ERR_SURVEY_NOT_PENDING
    http: 409
    condition: "route-survey attempted on an empty load, on an already COMPLETED survey, or on a dispatched load"
  - id: ERR_SHIPMENT_NOT_PERMITTED
    http: 409
    condition: "dispatch attempted on a shipment that is not PERMITTED or carries no modules"
  - id: ERR_SHIPMENT_NOT_DISPATCHED
    http: 409
    condition: "deliver attempted on a shipment that is not DISPATCHED"
  - id: ERR_SHIPMENT_TERMINAL
    http: 409
    condition: "cancel attempted on a DELIVERED, DISPATCHED or already CANCELLED shipment"
  - id: ERR_PERMIT_ALREADY_DECIDED
    http: 409
    condition: "decide attempted on a DENIED or EXPIRED permit, or a decision incompatible with the permit's current status"
  - id: ERR_INSPECTION_NOT_PENDING
    http: 409
    condition: "record-result attempted on a record whose result is no longer PENDING"
  - id: ERR_HOLD_NOT_ACTIVE
    http: 409
    condition: "clear-hold attempted on a record with no active AGENCY_HOLD"
  - id: ERR_CLAIM_NOT_ADJUDICABLE
    http: 409
    condition: "adjudicate attempted on a claim that is neither OPEN nor DISPUTED"
  - id: ERR_CLAIM_NOT_ADJUDICATED
    http: 409
    condition: "dispute attempted on a claim that is not ADJUDICATED"
  - id: ERR_DISPUTE_ROUND_LIMIT
    http: 409
    condition: "dispute attempted on a claim whose adjudication_round has already reached 2"

  # -- safety / regulatory ----------------------------------------------------
  - id: ERR_FACTORY_LINE_NOT_RUNNING
    http: 409
    condition: "the plant's line_state is PAUSED or SHUTDOWN"
  - id: ERR_PICK_RADIUS_OFF_CHART
    http: 422
    condition: "no crane chart entry covers the requested pick radius"
  - id: ERR_CRANE_CAPACITY_EXCEEDED
    http: 422
    condition: "rigged pick weight exceeds 85% of the (wind-derated) chart capacity at the pick radius"
  - id: ERR_WEATHER_EXPOSURE_LIMIT
    http: 409
    condition: "an already-set, unconnected module has been exposed longer than the project's weather_exposure_limit_hours"
  - id: ERR_SET_NOT_PERMITTED
    http: 409
    condition: "the project's permit_posture is not SET_CLEARED or OCCUPANCY_CLEARED — one of the two permitting tracks is still open"
  - id: ERR_QC_HOLD_BLOCKS_OPERATION
    http: 409
    condition: "the module is under a third-party agency hold"
  - id: ERR_QC_NOT_RELEASED
    http: 409
    condition: "the module has not been released or conditionally released by the inspection agency"

  # -- constraint satisfaction -----------------------------------------------
  - id: ERR_SET_SEQUENCE_VIOLATION
    http: 409
    condition: "the module's set_sequence_index or pair role violates the project's set_sequence_policy"
  - id: ERR_LINE_CAPACITY_EXCEEDED
    http: 409
    condition: "the requested line slot would exceed the plant's parallel_station_capacity at its start instant"
  - id: ERR_CRANE_WINDOW_CONFLICT
    http: 409
    condition: "the buffered crane window overlaps another module's buffered window on the same project"
  - id: ERR_MODULE_ALREADY_LOADED
    http: 409
    condition: "the module is already assigned to a shipment"
  - id: ERR_ENVELOPE_EXCEEDS_ROUTE_LIMIT
    http: 422
    condition: "a SUPERLOAD load is routed through more than two states"
  - id: ERR_QC_STAGE_OUT_OF_ORDER
    http: 409
    condition: "a FINAL_FACTORY inspection is opened before the IN_PLANT stage passed, or a second record is opened while one is still PENDING"
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "Factory.code or InspectionAgency.agency_code already exists"
  - id: ERR_DUPLICATE_MODULE_CODE
    http: 409
    condition: "module_code or set_sequence_index already used within the project"
  - id: ERR_ESCORT_NOT_CONFIRMED
    http: 422
    condition: "route-survey submitted without escort confirmation on a load that requires escorts"

  # -- temporal ---------------------------------------------------------------
  - id: ERR_LINE_SLOT_IN_PAST
    http: 422
    condition: "the requested line_slot_start is before the current logical clock instant"
  - id: ERR_LINE_SLOT_OUTSIDE_SHIFT
    http: 422
    condition: "the requested line_slot_start falls outside the plant's daily shift window"
  - id: ERR_PICK_WINDOW_INVALID
    http: 422
    condition: "pick_window_end is not after pick_window_start, or the window starts in the past"
  - id: ERR_TRANSPORT_PERMIT_EXPIRED
    http: 409
    condition: "the transport permit expiry is not in the future at survey time, or has elapsed at dispatch time"
  - id: ERR_CLOCK_NOT_MONOTONIC
    http: 422
    condition: "an attempt to move the logical clock backwards"

  # -- referential / compliance ----------------------------------------------
  - id: ERR_AGENCY_NOT_ACCREDITED
    http: 422
    condition: "the inspection agency is SUSPENDED, or is only on PROBATION while certifying a draw"
  - id: ERR_AGENCY_JURISDICTION_MISMATCH
    http: 422
    condition: "the agency is not accredited in the project's state_code"
  - id: ERR_PLAN_REVIEW_PREREQUISITE
    http: 409
    condition: "no live STATE_MODULAR_PROGRAM / PLAN_REVIEW approval exists for the project"
  - id: ERR_NO_FROZEN_PACKAGE
    http: 409
    condition: "a plan review approval was attempted without exactly one FROZEN design package to pin"
  - id: ERR_PINNED_PACKAGE_MISMATCH
    http: 409
    condition: "the module was built to a design revision other than the one pinned by the live state approval"
  - id: ERR_INVALID_SUPERSESSION
    http: 422
    condition: "supersedes_package_id points at another project, at a package that is not FROZEN, or at a revision_index not below the new package's"
  - id: ERR_FACTORY_COMPATIBILITY_TOO_LOW
    http: 422
    condition: "a freeze was attempted with factory_compatibility_score below 70, connection detailing not started, or a module split that disagrees with planned_module_count"
  - id: ERR_CROSS_AGGREGATE_MISMATCH
    http: 422
    condition: "a referenced design package belongs to a different project, or a referenced inspection belongs to a different module"
  - id: ERR_SHIPMENT_PROJECT_MISMATCH
    http: 409
    condition: "the module and the shipment belong to different projects"

  # -- fiscal -----------------------------------------------------------------
  - id: ERR_CONTRACT_BALANCE_EXCEEDED
    http: 422
    condition: "certifying this draw would push cumulative certified value past the contract price net of retainage"
  - id: ERR_NO_CERTIFIABLE_WIP
    http: 422
    condition: "the draw's recomputed basis is zero — no qualifying module work exists"
  - id: ERR_DRAW_SEQUENCE_GAP
    http: 409
    condition: "draw_index is not exactly one greater than the project's highest existing draw_index"

# -----------------------------------------------------------------------------
# §1.7 RBAC Matrix — segregation of duties across design, factory, third-party
# inspection, transport, both permitting authorities, site, warranty and lender.
# -----------------------------------------------------------------------------
roles:
  - name: ProgramAdmin
    description: "manufacturer's program office — registers plants, agencies and projects, files permit applications on both tracks, and drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /modular/factories"
      - "POST /modular/agencies"
      - "POST /modular/projects"
      - "POST /modular/permits"
      - "POST /modular/_clock/set_current_utc"
    shared_operations:
      - "PATCH /modular/factories/{factoryId}/line-state (with FactoryProductionManager)"
      - "PATCH /modular/agencies/{agencyId}/accreditation (with StateProgramOfficer)"
      - "POST /modular/projects/{projectId}/weather-observations (with SiteSuperintendent)"
      - "all GET reads"

  - name: DesignEngineer
    description: "detailing engineer — creates design revisions with module splits and connection details, submits them for freeze, and reviews a peer's submission"
    identity: opaque
    exclusive_operations:
      - "POST /modular/design-packages"
      - "POST /modular/design-packages/{packageId}/submit"
      - "POST /modular/design-packages/{packageId}/review-decision"
    shared_operations:
      - "GET /modular/design-packages, GET /modular/design-packages/{packageId}, GET /modular/permits"
    note: "segregation of duties is enforced on X-User-ID: the engineer who submitted a package may not record its review-decision"

  - name: FactoryProductionManager
    description: "plant manager — creates modules, schedules and releases takt slots, advances stations, and disputes warranty allocations charged to the factory"
    identity: "entity_backed:Factory"
    exclusive_operations:
      - "POST /modular/modules"
      - "POST /modular/modules/{moduleId}/schedule-line-slot"
      - "POST /modular/modules/{moduleId}/release-line-slot"
      - "POST /modular/modules/{moduleId}/advance-station"
    shared_operations:
      - "PATCH /modular/factories/{factoryId}/line-state (with ProgramAdmin)"
      - "POST /modular/defect-claims (with SiteSuperintendent)"
      - "POST /modular/defect-claims/{claimId}/dispute (with SiteSuperintendent)"
    note: "X-User-ID is the Factory id; every module operation requires project.factory_id == X-User-ID"

  - name: ThirdPartyInspector
    description: "accredited third-party inspection agency — opens in-plant and final-factory inspections, records results, places and clears agency holds"
    identity: "entity_backed:InspectionAgency"
    exclusive_operations:
      - "POST /modular/inspections"
      - "POST /modular/inspections/{inspectionId}/record-result"
      - "POST /modular/inspections/{inspectionId}/clear-hold"
    shared_operations:
      - "GET /modular/inspections, GET /modular/modules"
    note: "X-User-ID is the InspectionAgency id and must equal the agency_id recorded on the inspection"

  - name: TransportCoordinator
    description: "logistics coordinator — builds loads, runs route surveys and transport permits, dispatches, delivers and cancels shipments"
    identity: opaque
    exclusive_operations:
      - "POST /modular/shipments"
      - "POST /modular/shipments/{shipmentId}/load-module"
      - "POST /modular/shipments/{shipmentId}/route-survey"
      - "POST /modular/shipments/{shipmentId}/dispatch"
      - "POST /modular/shipments/{shipmentId}/cancel"
    shared_operations:
      - "POST /modular/shipments/{shipmentId}/deliver (with SiteSuperintendent)"
      - "GET /modular/shipments, GET /modular/modules"

  - name: SiteSuperintendent
    description: "field superintendent — records site weather, plans crane picks, sets modules, closes connections and raises field defect claims"
    identity: "entity_backed:Project"
    exclusive_operations:
      - "POST /modular/modules/{moduleId}/schedule-pick"
      - "POST /modular/modules/{moduleId}/execute-set"
      - "POST /modular/modules/{moduleId}/close-connections"
    shared_operations:
      - "POST /modular/projects/{projectId}/weather-observations (with ProgramAdmin)"
      - "POST /modular/shipments/{shipmentId}/deliver (with TransportCoordinator)"
      - "POST /modular/defect-claims (with FactoryProductionManager)"
      - "POST /modular/defect-claims/{claimId}/dispute (with FactoryProductionManager)"
    note: "X-User-ID is the Project id; every site operation requires module.project_id == X-User-ID"

  - name: StateProgramOfficer
    description: "state modular program authority — decides plan review and insignia permits on the STATE_MODULAR_PROGRAM track and adjusts agency accreditation"
    identity: opaque
    exclusive_operations:
      - "POST /modular/permits/{permitId}/decide on track == STATE_MODULAR_PROGRAM"
    shared_operations:
      - "PATCH /modular/agencies/{agencyId}/accreditation (with ProgramAdmin)"
      - "GET /modular/permits, GET /modular/design-packages, GET /modular/inspections"

  - name: AuthorityHavingJurisdiction
    description: "local building department — decides foundation, set and occupancy permits on the LOCAL_AHJ track"
    identity: opaque
    exclusive_operations:
      - "POST /modular/permits/{permitId}/decide on track == LOCAL_AHJ"
    shared_operations:
      - "GET /modular/permits, GET /modular/projects/{projectId}/set-readiness"

  - name: WarrantyAdjudicator
    description: "independent adjudicator — allocates factory versus field responsibility and warranty buckets on defect claims"
    identity: opaque
    exclusive_operations:
      - "POST /modular/defect-claims/{claimId}/adjudicate"
    shared_operations:
      - "GET /modular/defect-claims, GET /modular/inspections, GET /modular/modules"

  - name: LenderDrawAdministrator
    description: "construction lender's draw administrator — opens, certifies, funds and rejects draws against factory work in progress or delivered milestones"
    identity: opaque
    exclusive_operations:
      - "POST /modular/draw-requests"
      - "POST /modular/draw-requests/{drawId}/certify"
      - "POST /modular/draw-requests/{drawId}/fund"
      - "POST /modular/draw-requests/{drawId}/reject"
    shared_operations:
      - "GET /modular/draw-requests, GET /modular/projects, GET /modular/factories"
