      - name: state_suspension_suppresses_only_active_listings_and_spares_removed_ones
        claim_type: conditional_cascade
        grounds:
          - "state_machines.Listing.transitions.ACTIVE_to_SUPPRESSED"
          - "state_machines.Seller.enforcement_state.transitions.to_SUSPENDED.side_effects"
          - "state_machines.Seller.disbursement_state.transitions.to_FULL_HOLD.side_effects"
          - "calculations.enforcement_ladder_rung"
        distinguishing_aspect: |
          The suspension cascade is CONDITIONAL on each child's state: the ACTIVE listing becomes
          SUPPRESSED with suppressed_by_suspension true, while the listing already REMOVED under a
          previous LISTING_REMOVAL action is left exactly as it was — same state, same
          removal_policy_category, suppressed_by_suspension still false — so a later reinstatement
          can tell suppression apart from removal. The same request also proves the override path
          (WARNING computed, ACCOUNT_SUSPENSION applied) and the FULL_HOLD sweep of 100000 cents.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "PolicyRule LA-SCOPE-L (LISTING_ACCURACY, base 1.00, removal_scope LISTING, requires_poa false) and PolicyRule LA-SCOPE-A (LISTING_ACCURACY, base 2.00, removal_scope ACCOUNT, requires_poa false)."
            - "No SHIPPING_PERFORMANCE / ACCOUNT rule exists, so nothing can auto-mint a violation."
            - "One seller credited 100000 cents (available_balance_cents 100000)."
            - "Listings L1 (HT-PRY-18) and L2 (HT-CLAMP-6), both ACTIVE."
            - "Action 1 cites a violation against L1 under LA-SCOPE-L with action_type_override LISTING_REMOVAL (strictly more severe than the computed WARNING): severity_points_applied = round2(1.00 x 1.00) = 1.00, post_balance 1.00, L1 -> REMOVED with removal_policy_category LISTING_ACCURACY."
            - "Action 2 cites a second violation under LA-SCOPE-A: prior_same_category 1 -> repeat_factor 1.25, raw 2.00 x 1.25 = 2.50, severity 2.50; prior_balance 1.00 -> post_balance 3.50 -> rung WARNING; action_type_override ACCOUNT_SUSPENSION is strictly more severe and is accepted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
