scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: session_fee_quoted_at_scheduling_vs_billed_at_completion
        grounds:
          - calculations.session_fee_cents
          - entities.Session.fields.quoted_fee_cents
          - entities.Charge.fields.amount_cents
          - state_machines.Session.CONFIRMED_to_COMPLETED
        distinguishing_aspect: |
          This instance lives in the MONEY domain on Session/Charge: identical stored data
          yields quoted_fee_cents 9000 (duration_minutes 60) and Charge.amount_cents 6750
          (mounted_minutes 45) for one and the same session.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-01T00:00:00Z."
            - "One CLEAR condition policy, one MASTER instructor, one 1100 lb horse with 30 lb tack."
            - "Rider Rae is ACTIVE, LEVEL_4 (balance 9 + trunk 9 = 18), release signed 2026-04-01, band BAND_D, payer 0."
            - "One 60-minute THERAPEUTIC_RIDING session on 2026-05-11T10:00:00Z, CONFIRMED with an empty crew."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /condition-policies"
              payload: { condition_code: "CP_MILD_ASD", activity_type: "THERAPEUTIC_RIDING", tier: "CLEAR", min_instructor_tier: "REGISTERED" }
              as: ProgramAdmin
            - call: "POST /horses"
              payload: { name: "Comet", body_weight_lb: 1100, tack_weight_lb: 30 }
              as: ProgramAdmin
              captures: { h1_id: "$.data.id" }
            - call: "POST /instructors"
              payload: { full_name: "Ada Reins", certification_level: "MASTER", certification_expires_at: "2028-04-30T00:00:00Z" }
              as: ProgramAdmin
              captures: { i1_id: "$.data.id" }
            - call: "POST /riders"
              payload: { full_name: "Rae Rider", date_of_birth: "2012-03-04", weight_lb: 150, household_income_band: "BAND_D", demographic_group: "ADULT", program_code: "THERAPEUTIC_RIDING", condition_codes: ["CP_MILD_ASD"], funding_mode: "PRIVATE_PAY_ALLOWED", payer_rate_cents: 0 }
              as: IntakeCoordinator
              captures: { r1_id: "$.data.id", r1_v1: "$.data.version" }
            - call: "POST /riders/${r1_id}/medical-releases"
              payload: { signed_on: "2026-04-01", physician_name: "Dr Oak", cleared_condition_codes: [], expected_rider_version: "${r1_v1}" }
              as: IntakeCoordinator
            - call: "GET /riders/${r1_id}"
              payload: {}
              as: IntakeCoordinator
              captures: { r1_v2: "$.data.version" }
            - call: "POST /riders/${r1_id}/assessments"
              payload: { assessment_type: "INTAKE", performed_on: "2026-04-01", balance_score: 9, trunk_control_score: 9, rider_weight_lb: 150, backriding_required: false, expected_rider_version: "${r1_v2}" }
              as: Instructor
              as_user_id: "${i1_id}"
            - call: "POST /riders/${r1_id}/activate"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /sessions"
              payload: { rider_id: "${r1_id}", horse_id: "${h1_id}", instructor_id: "${i1_id}", activity_type: "THERAPEUTIC_RIDING", scheduled_start: "2026-05-11T10:00:00Z", duration_minutes: 60 }
              as: Instructor
              as_user_id: "${i1_id}"
              captures: { s1_id: "$.data.id", s1_quoted: "$.data.quoted_fee_cents" }
            - call: "POST /sessions/${s1_id}/confirm"
              payload: {}
              as: Instructor
              as_user_id: "${i1_id}"
          trigger:
            - call: "POST /sessions/${s1_id}/complete"
              payload: { mounted_minutes: 45 }
              as: Instructor
              as_user_id: "${i1_id}"
            - call: "GET /charges"
              payload: { session_id: "${s1_id}" }
              as: BillingClerk
              captures: { c1_id: "$.data[0].id", c1_amount: "$.data[0].amount_cents" }
          assert:
            - "Session.${s1_id}.quoted_fee_cents == 9000"
            - "Charge.${c1_id}.amount_cents == 6750"
            - "Charge.${c1_id}.charge_type == SESSION_FEE"
            - "Session.${s1_id}.service_hours == 0.75"
            - "Session.${s1_id}.quoted_fee_cents != Charge.${c1_id}.amount_cents"

      - name: volunteer_service_hours_scheduled_vs_delivered_diverge
        grounds:
          - calculations.volunteer_service_hours
          - entities.CrewAssignment.fields.status
          - entities.Session.fields.mounted_minutes
        distinguishing_aspect: |
          This instance lives in the VOLUNTEER LABOUR domain, not the money domain: the same
          volunteer's crew record yields service_hours 2.0 under the scheduled variant and
          0.75 under the delivered variant for the identical period 2026-05-01..2026-05-31.
        test_recipe:
          setup:
            - "Clock at 2026-05-01T00:00:00Z; MASTER instructor; 1100 lb horse; LEVEL_3 rider needing 1 sidewalker and a leader."
            - "Volunteer Sam holds a QUALIFIED SIDEWALKER qualification signed 2026-04-01."
            - "Session A on 2026-05-11T10:00:00Z for 60 minutes is COMPLETED with mounted_minutes 45."
            - "Session B on 2026-05-12T10:00:00Z for 60 minutes stays CONFIRMED."
            - "Sam is ASSIGNED as sidewalker on both sessions."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /condition-policies"
              payload: { condition_code: "CP_MILD_ASD", activity_type: "THERAPEUTIC_RIDING", tier: "CLEAR", min_instructor_tier: "REGISTERED" }
              as: ProgramAdmin
            - call: "POST /horses"
              payload: { name: "Comet", body_weight_lb: 1100, tack_weight_lb: 30 }
              as: ProgramAdmin
              captures: { h1_id: "$.data.id" }
            - call: "POST /instructors"
              payload: { full_name: "Ada Reins", certification_level: "MASTER", certification_expires_at: "2028-04-30T00:00:00Z" }
              as: ProgramAdmin
              captures: { i1_id: "$.data.id" }
            - call: "POST /riders"
              payload: { full_name: "Rae Rider", date_of_birth: "2012-03-04", weight_lb: 150, household_income_band: "BAND_D", demographic_group: "ADULT", program_code: "THERAPEUTIC_RIDING", condition_codes: ["CP_MILD_ASD"], funding_mode: "PRIVATE_PAY_ALLOWED", payer_rate_cents: 0 }
              as: IntakeCoordinator
              captures: { r1_id: "$.data.id", r1_v1: "$.data.version" }
            - call: "POST /riders/${r1_id}/medical-releases"
              payload: { signed_on: "2026-04-01", physician_name: "Dr Oak", cleared_condition_codes: [], expected_rider_version: "${r1_v1}" }
              as: IntakeCoordinator
            - call: "GET /riders/${r1_id}"
              payload: {}
              as: IntakeCoordinator
              captures: { r1_v2: "$.data.version" }
            - call: "POST /riders/${r1_id}/assessments"
              payload: { assessment_type: "INTAKE", performed_on: "2026-04-01", balance_score: 6, trunk_control_score: 6, rider_weight_lb: 150, backriding_required: false, expected_rider_version: "${r1_v2}" }
              as: Instructor
              as_user_id: "${i1_id}"
            - call: "POST /riders/${r1_id}/activate"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /volunteers"
              payload: { full_name: "Lee Leader", date_of_birth: "2000-01-01", last_retraining_on: "2026-04-01" }
              as: VolunteerCoordinator
              captures: { v_lead_id: "$.data.id" }
            - call: "POST /volunteers/${v_lead_id}/qualifications"
              payload: { crew_role: "LEADER", training_hours: 12 }
              as: VolunteerCoordinator
              captures: { q_lead_id: "$.data.id" }
            - call: "POST /volunteer-qualifications/${q_lead_id}/sign-off"
              payload: { signed_off_on: "2026-04-01" }
              as: VolunteerCoordinator
            - call: "POST /volunteers"
              payload: { full_name: "Sam Sidewalker", date_of_birth: "2000-02-02", last_retraining_on: "2026-04-01" }
              as: VolunteerCoordinator
              captures: { v_side_id: "$.data.id" }
            - call: "POST /volunteers/${v_side_id}/qualifications"
              payload: { crew_role: "SIDEWALKER", training_hours: 6 }
              as: VolunteerCoordinator
              captures: { q_side_id: "$.data.id" }
            - call: "POST /volunteer-qualifications/${q_side_id}/sign-off"
              payload: { signed_off_on: "2026-04-01" }
              as: VolunteerCoordinator
            - call: "POST /sessions"
              payload: { rider_id: "${r1_id}", horse_id: "${h1_id}", instructor_id: "${i1_id}", activity_type: "THERAPEUTIC_RIDING", scheduled_start: "2026-05-11T10:00:00Z", duration_minutes: 60 }
              as: Instructor
              as_user_id: "${i1_id}"
              captures: { sa_id: "$.data.id", sa_v1: "$.data.version" }
            - call: "POST /sessions/${sa_id}/crew-assignments"
              payload: { volunteer_id: "${v_lead_id}", crew_role: "LEADER", expected_session_version: "${sa_v1}" }
              as: VolunteerCoordinator
            - call: "GET /sessions/${sa_id}"
              payload: {}
              as: Instructor
              as_user_id: "${i1_id}"
              captures: { sa_v2: "$.data.version" }
            - call: "POST /sessions/${sa_id}/crew-assignments"
              payload: { volunteer_id: "${v_side_id}", crew_role: "SIDEWALKER", hold_type: "ARM_OVER_THIGH", expected_session_version: "${sa_v2}" }
              as: VolunteerCoordinator
            - call: "POST /sessions/${sa_id}/confirm"
              payload: {}
              as: Instructor
              as_user_id: "${i1_id}"
            - call: "POST /sessions/${sa_id}/complete"
              payload: { mounted_minutes: 45 }
              as: Instructor
              as_user_id: "${i1_id}"
            - call: "POST /sessions"
              payload: { rider_id: "${r1_id}", horse_id: "${h1_id}", instructor_id: "${i1_id}", activity_type: "THERAPEUTIC_RIDING", scheduled_start: "2026-05-12T10:00:00Z", duration_minutes: 60 }
              as: Instructor
              as_user_id: "${i1_id}"
              captures: { sb_id: "$.data.id", sb_v1: "$.data.version" }
            - call: "POST /sessions/${sb_id}/crew-assignments"
              payload: { volunteer_id: "${v_lead_id}", crew_role: "LEADER", expected_session_version: "${sb_v1}" }
              as: VolunteerCoordinator
            - call: "GET /sessions/${sb_id}"
              payload: {}
              as: Instructor
              as_user_id: "${i1_id}"
              captures: { sb_v2: "$.data.version" }
            - call: "POST /sessions/${sb_id}/crew-assignments"
              payload: { volunteer_id: "${v_side_id}", crew_role: "SIDEWALKER", hold_type: "ARM_OVER_THIGH", expected_session_version: "${sb_v2}" }
              as: VolunteerCoordinator
            - call: "POST /sessions/${sb_id}/confirm"
              payload: {}
              as: Instructor
              as_user_id: "${i1_id}"
          trigger:
            - call: "GET /volunteers/${v_side_id}/service-hours"
              payload: { period_start: "2026-05-01", period_end: "2026-05-31", variant: "scheduled" }
              as: VolunteerCoordinator
              captures: { hours_sched: "$.data.service_hours" }
            - call: "GET /volunteers/${v_side_id}/service-hours"
              payload: { period_start: "2026-05-01", period_end: "2026-05-31", variant: "delivered" }
              as: VolunteerCoordinator
              captures: { hours_deliv: "$.data.service_hours" }
          assert:
            - "${hours_sched} == 2.0"
            - "${hours_deliv} == 0.75"
            - "the scheduled response's session_count == 2 and the delivered response's session_count == 1"

  - rule_id: combinatorial_formula
    instances:
      - name: waterfall_scholarship_pct_of_gross_then_sliding_pct_of_remaining
        grounds:
          - calculations.funding_waterfall_allocation
          - calculations.grant_candidate_selection
          - entities.FundingAllocation.fields.amount_cents
          - entities.Charge.fields.balance_due_cents
        distinguishing_aspect: |
          MODE (a) plus MODE (c): the scholarship line is a nested min over THREE inputs
          (pct of the GROSS amount, remaining period room, remaining balance) while the
          sliding-scale line is a pct of the REMAINING - a circular-looking dependency
          whose evaluation order the scaffold pins, producing 3000 / 3375 / 150 / 225.
        test_recipe:
          setup:
            - "Clock 2026-05-01T00:00:00Z; MASTER instructor; 1100 lb horse; LEVEL_4 rider Rae in band BAND_B with payer_rate_cents 0."
            - "One unrestricted Grant of 3000 cents for 2026-01-01..2026-12-31."
            - "One ScholarshipAward for Rae with cap_pct 0.5 and period_cap_cents 5000 for 2026-01-01..2026-12-31."
            - "A 60-minute THERAPEUTIC_RIDING session CONFIRMED on 2026-05-11T10:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /condition-policies"
              payload: { condition_code: "CP_MILD_ASD", activity_type: "THERAPEUTIC_RIDING", tier: "CLEAR", min_instructor_tier: "REGISTERED" }
              as: ProgramAdmin
            - call: "POST /horses"
              payload: { name: "Comet", body_weight_lb: 1100, tack_weight_lb: 30 }
              as: ProgramAdmin
              captures: { h1_id: "$.data.id" }
            - call: "POST /instructors"
              payload: { full_name: "Ada Reins", certification_level: "MASTER", certification_expires_at: "2028-04-30T00:00:00Z" }
              as: ProgramAdmin
              captures: { i1_id: "$.data.id" }
            - call: "POST /grants"
              payload: { grant_name: "Hooves Fund", funder_name: "County", awarded_amount_cents: 3000, period_start: "2026-01-01", period_end: "2026-12-31" }
              as: ProgramAdmin
              captures: { g1_id: "$.data.id" }
            - call: "POST /riders"
              payload: { full_name: "Rae Rider", date_of_birth: "2012-03-04", weight_lb: 150, household_income_band: "BAND_B", demographic_group: "ADULT", program_code: "THERAPEUTIC_RIDING", condition_codes: ["CP_MILD_ASD"], funding_mode: "PRIVATE_PAY_ALLOWED", payer_rate_cents: 0 }
              as: IntakeCoordinator
              captures: { r1_id: "$.data.id", r1_v1: "$.data.version" }
            - call: "POST /riders/${r1_id}/medical-releases"
              payload: { signed_on: "2026-04-01", physician_name: "Dr Oak", cleared_condition_codes: [], expected_rider_version: "${r1_v1}" }
              as: IntakeCoordinator
            - call: "GET /riders/${r1_id}"
              payload: {}
              as: IntakeCoordinator
              captures: { r1_v2: "$.data.version" }
            - call: "POST /riders/${r1_id}/assessments"
              payload: { assessment_type: "INTAKE", performed_on: "2026-04-01", balance_score: 9, trunk_control_score: 9, rider_weight_lb: 150, backriding_required: false, expected_rider_version: "${r1_v2}" }
              as: Instructor
              as_user_id: "${i1_id}"
            - call: "POST /riders/${r1_id}/activate"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /riders/${r1_id}/scholarship-awards"
              payload: { cap_pct: 0.5, period_cap_cents: 5000, period_start: "2026-01-01", period_end: "2026-12-31" }
              as: IntakeCoordinator
              captures: { aw1_id: "$.data.id" }
            - call: "POST /sessions"
              payload: { rider_id: "${r1_id}", horse_id: "${h1_id}", instructor_id: "${i1_id}", activity_type: "THERAPEUTIC_RIDING", scheduled_start: "2026-05-11T10:00:00Z", duration_minutes: 60 }
              as: Instructor
              as_user_id: "${i1_id}"
              captures: { s1_id: "$.data.id" }
            - call: "POST /sessions/${s1_id}/confirm"
              payload: {}
              as: Instructor
              as_user_id: "${i1_id}"
          trigger:
            - call: "POST /sessions/${s1_id}/complete"
              payload: { mounted_minutes: 45 }
              as: Instructor
              as_user_id: "${i1_id}"
            - call: "GET /charges"
              payload: { session_id: "${s1_id}" }
              as: BillingClerk
              captures: { c1_id: "$.data[0].id" }
          assert:
            - "Charge.${c1_id}.amount_cents == 6750"
            - "The GRANT FundingAllocation for charge ${c1_id} has amount_cents == 3000 and sequence_index == 1"
            - "The SCHOLARSHIP FundingAllocation for charge ${c1_id} has amount_cents == 3375 and sequence_index == 2"
            - "The SLIDING_SCALE FundingAllocation for charge ${c1_id} has amount_cents == 150 and sequence_index == 3"
            - "No PAYER FundingAllocation exists for charge ${c1_id}"
            - "The PRIVATE_PAY FundingAllocation for charge ${c1_id} has amount_cents == 225 and sequence_index == 5"
            - "Charge.${c1_id}.balance_due_cents == 225"
            - "Charge.${c1_id}.allocated_cents == 6750"
            - "Charge.${c1_id}.status == PENDING"
            - "Session.${s1_id}.billing_status == CHARGED"
            - "Grant.${g1_id}.remaining_amount_cents == 0 and Grant.${g1_id}.status == EXHAUSTED"
            - "ScholarshipAward.${aw1_id}.period_used_cents == 3375 and status == ACTIVE"

      - name: period_report_service_hours_round_each_session_then_sum
        grounds:
          - calculations.period_report_aggregation
          - calculations.session_service_hours
          - entities.PeriodReport.fields.total_service_hours
        distinguishing_aspect: |
          MODE (b): three 50-minute rides give 0.83 + 0.83 + 0.83 = 2.49 under the pinned
          per-session round-then-sum order, whereas sum-then-convert would give 150/60 = 2.5;
          the report must report 2.49.
        test_recipe:
