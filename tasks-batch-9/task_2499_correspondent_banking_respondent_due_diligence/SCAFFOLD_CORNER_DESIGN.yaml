  # ---------------------------------------------------------------------------
  # errors - one triggering instance per error_id in the catalogue that no
  # earlier section already reaches. The nine child *_NOT_FOUND codes are swept
  # in a single instance because they are the same rule (validation priority 4)
  # applied to nine path parameters.
  #
  # Deliberate omission: ERR_OWNERSHIP_CYCLE_DETECTED has NO instance. The
  # scaffold's own effective_ownership_pct formula states that a cycle in the
  # ownership parent chain "is impossible by construction" - creation is the
  # only endpoint that writes parent_owner_id, and the node being created has no
  # id yet, so it can never appear in its parent's ancestor set. The code is
  # therefore reserved rather than reachable, and an instance for it would be
  # untestable. Its two ladder siblings (ERR_OWNERSHIP_DEPTH_EXCEEDED and
  # ERR_OWNERSHIP_PCT_EXCEEDS_100) are both covered below. ERR_SEGREGATION_OF_DUTIES
  # is covered in the rbac section, where all four incompatible-duty pairs live.
  # ---------------------------------------------------------------------------
  - section: errors
    instances:

      - name: every_child_path_id_has_its_own_not_found_code
        claim_type: error_triggerable
        grounds:
          - validations[priority=4]
          - errors[ERR_QUESTIONNAIRE_NOT_FOUND]
          - errors[ERR_CONTROL_ASSESSMENT_NOT_FOUND]
          - errors[ERR_ACTIVITY_OBSERVATION_NOT_FOUND]
          - errors[ERR_MONITORING_ALERT_NOT_FOUND]
          - errors[ERR_INFORMATION_REQUEST_NOT_FOUND]
          - errors[ERR_ADVERSE_MEDIA_EVENT_NOT_FOUND]
          - errors[ERR_PERIODIC_REFRESH_NOT_FOUND]
          - errors[ERR_PAYMENT_INSTRUCTION_NOT_FOUND]
          - errors[ERR_CLOSURE_PLAN_NOT_FOUND]
        distinguishing_aspect: "Nine sibling child resources each own a distinct 404 code, and the code is chosen by which path parameter failed to resolve - not a single generic not-found code shared by all of them. An empty database plus one unknown id per family proves each code is wired to its own path parameter."
        test_recipe:
          setup: ["Empty database with the logical clock pinned; no child resource of any family exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /correspondent-banking/questionnaires/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "u-analyst-1"
            - call: "GET /correspondent-banking/control-assessments/00000000-0000-4000-8000-000000000000"
              payload: {}
