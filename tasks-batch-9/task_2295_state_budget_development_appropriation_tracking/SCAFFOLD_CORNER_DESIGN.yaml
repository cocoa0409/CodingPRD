      - name: four_quarter_release_chain_reaches_fully_released_then_transfer_exceeds_available
        claim_type: Violation → Error
        grounds:
          - validations[priority=35]
          - errors[ERR_TRANSFER_EXCEEDS_AVAILABLE]
          - calculations.allotment_release_ceiling
          - calculations.appropriation_available_balance
          - entities.Appropriation.fields.cash_status
        distinguishing_aspect: |
          The only route to cash_status FULLY_RELEASED and to a source with zero remaining
          authority: the four GENERAL quarter caps 0.22 + 0.26 + 0.26 + 0.26 sum to exactly
          1.00, so releasing and spending each quarter cap in turn drains a 1000000000
          appropriation to available_authority 0. A one-cent transfer then clears the
          10 percent authority cap of 100000000 and fails on priority 35 instead — which
          proves the cap check and the availability check are two distinct rules.
        setup_note: >-
