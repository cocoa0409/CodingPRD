          Interval semantics #1, resource = Nest: CLOSED intervals with a 5-minute pre-buffer and a
          10-minute post-hold, resolved against AGGREGATE capacity (reject only when the count of
          overlapping holds reaches pad_count). On a 1-pad nest, a second dispatch whose hold
          [09:25, 09:40] merely TOUCHES the first hold [09:10, 09:25] at a single endpoint is still
          rejected, while moving the clock one minute later makes the holds disjoint and it succeeds.
