  - rule_id: cross_entity_state_dependency
    instances:
      - name: assignment_activation_blocked_by_case_benefit_status_pending_issuance
        grounds:
          - validations[priority=25]
          - errors.ERR_CASE_NOT_ACTIVE
          - state_machines.WorkAssignment.status
          - state_machines.AssistanceCase.benefit_status
        distinguishing_aspect: |
          The rejected transition is legal on the WorkAssignment itself
          (PROPOSED -> ACTIVE), and the blocking state lives on a different
          entity: AssistanceCase.benefit_status is PENDING_ISSUANCE. The very same
          call succeeds unchanged once the first issuance flips the case to ACTIVE,
          proving the guard reads the parent, not the assignment.
        test_recipe:
          setup:
            - "A SINGLE_PARENT case of household size 3 was just approved and has no TimeLimitMonth rows, so benefit_status is PENDING_ISSUANCE."
            - "The case has one PROPOSED COMMUNITY_SERVICE assignment of 20 scheduled weekly hours for 2026-08-01..2026-12-01."
