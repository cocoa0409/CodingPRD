        grounds:
          - state_machines.SystemDescription.DRAFT_to_IN_REVIEW
          - state_machines.SystemDescription.IN_REVIEW_to_DRAFT
          - state_machines.SystemDescription.IN_REVIEW_to_APPROVED
          - entities.SystemDescription.fields.review_round
        distinguishing_aspect: |
          CYCLE on SystemDescription: DRAFT -> IN_REVIEW -> DRAFT traversed twice leaves the row back
          in DRAFT with review_round == 2, and a third SUBMIT_REVIEW followed by APPROVE lands in
          APPROVED with review_round frozen at 2 — a linear pipeline could not return to DRAFT at all.
        test_recipe:
          setup:
            - "Engagement 'Northwind' in status SCOPING."
            - "One SystemDescription v1 in status DRAFT with one IN_SCOPE boundary component and review_round 0."
          setup_api_calls:
            - call: "POST /soc/engagements"
              payload: { client_name: "Northwind", report_type: "SOC_2_TYPE_2", observation_period_start: "2026-09-01T00:00:00.000Z", observation_period_end: "2026-11-30T00:00:00.000Z", required_criteria_categories: ["SECURITY"], max_distribution_recipients: 5 }
