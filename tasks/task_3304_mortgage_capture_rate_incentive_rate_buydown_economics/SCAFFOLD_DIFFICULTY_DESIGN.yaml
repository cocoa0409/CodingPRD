  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_business_safety_on_approve_and_qualify
        grounds:
          - validations[priority=4]
          - validations[priority=8]
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_QUALIFICATION_SCORE_BELOW_FLOOR]
          - state_machines.HomeSaleContract.PENDING_to_LOCKED
          - state_machines.LoanApplication.SUBMITTED_to_QUALIFYING
        distinguishing_aspect: |
          The state pair {state, business_safety}: when a request violates both the state
          precondition at priority 4 and the business_safety rules at priorities 6 and 8,
          the priority-4 error ERR_INVALID_STATE (409) is returned and neither safety error
          is surfaced, so the fingerprint is 409 / ERR_INVALID_STATE and not 422 or 403.
        test_recipe:
          setup:
            - "contract ct1 sits in PENDING and carries a RATE_BUYDOWN allocation while its buyer holds no acknowledged disclosure"
            - "application la2 sits at application_status DENIED with a failing qualification score"
          setup_api_calls:
