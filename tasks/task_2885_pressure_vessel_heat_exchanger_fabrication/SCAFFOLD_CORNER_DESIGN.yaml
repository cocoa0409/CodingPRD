              payload: { closed_on: "2026-07-15", findings: [{ finding_code: "M-1", severity: "MINOR", clause_reference: "QCM-3.1" }, { finding_code: "M-2", severity: "MINOR", clause_reference: "QCM-3.2" }, { finding_code: "M-3", severity: "MINOR", clause_reference: "QCM-3.3" }, { finding_code: "M-4", severity: "MINOR", clause_reference: "QCM-3.4" }, { finding_code: "M-5", severity: "MINOR", clause_reference: "QCM-3.5" }] }
