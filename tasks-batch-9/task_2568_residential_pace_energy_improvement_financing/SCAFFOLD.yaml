  - id: ERR_LIEN_NOT_NOTIFIED
    http_status: 422
    condition: "A consent response is posted for a lien whose consent_application_id is null (never notified)"
    applies_to: ["POST /pace/mortgage-liens/{id}/consent-response"]
  - id: ERR_CONTRACTOR_MISMATCH
    http_status: 422
    condition: "contractor_id does not equal the application's contractor_id"
    applies_to: ["POST /pace/disbursements", "POST /pace/complaints"]
  - id: ERR_APPLICATION_STATE_INVALID
    http_status: 409
    condition: "The application's status does not permit the operation, including every repeat of a once-only transition (second submit, second underwrite, second approve, second assessment)"
    applies_to: ["POST /pace/applications/{id}/measures", "POST /pace/applications/{id}/submit", "POST /pace/applications/{id}/underwrite", "POST /pace/applications/{id}/cure", "POST /pace/applications/{id}/approve", "POST /pace/financing-agreements", "POST /pace/completion-certificates", "POST /pace/completion-certificates/{id}/verify", "POST /pace/disbursements", "POST /pace/complaints", "POST /pace/assessments"]
  - id: ERR_AGREEMENT_STATE_INVALID
    http_status: 409
    condition: "The agreement is not in the status the operation demands (sign needs ISSUED, rescind needs SIGNED, release needs SIGNED or EFFECTIVE); includes a VOID agreement superseded by a re-issue"
    applies_to: ["POST /pace/financing-agreements/{id}/sign", "POST /pace/financing-agreements/{id}/oral-confirmation", "POST /pace/financing-agreements/{id}/rescind", "POST /pace/disbursements/{id}/release"]
  - id: ERR_CERTIFICATE_STATE_INVALID
    http_status: 409
    condition: "The certificate is not in the status the operation demands (sign needs CONTRACTOR_ATTESTED, verify needs HOMEOWNER_SIGNED, a disbursement needs VERIFIED)"
    applies_to: ["POST /pace/completion-certificates/{id}/sign", "POST /pace/completion-certificates/{id}/verify", "POST /pace/disbursements"]
  - id: ERR_DISBURSEMENT_STATE_INVALID
    http_status: 409
    condition: "release attempted on a HELD/RELEASED/REVERSED row, or reverse attempted on a row that is not RELEASED"
    applies_to: ["POST /pace/disbursements/{id}/release", "POST /pace/disbursements/{id}/reverse"]
  - id: ERR_COMPLAINT_STATE_INVALID
    http_status: 409
    condition: "The decision does not fit the complaint's status (UPHOLD_REMEDY/DENY need OPEN, REMEDY_VERIFIED/RECOURSE need REMEDY_ORDERED, terminal states accept nothing)"
    applies_to: ["POST /pace/complaints/{id}/adjudicate"]
  - id: ERR_CONTRACTOR_STATE_INVALID
    http_status: 409
    condition: "enroll on a row that is not PENDING_REVIEW, or reinstate on a row that is not PROBATION/SUSPENDED (including TERMINATED)"
    applies_to: ["POST /pace/contractors/{id}/enroll", "POST /pace/contractors/{id}/reinstate"]
  - id: ERR_ASSESSMENT_STATE_INVALID
    http_status: 409
    condition: "billing_status is not ON_ROLL or lien_status is not SENIOR_RECORDED where the operation demands it (payoff quote, prepayment, installment payment)"
    applies_to: ["POST /pace/assessment-transfers", "POST /pace/assessments/{id}/prepayments", "POST /pace/assessments/{id}/installments/{installmentId}/payments"]
  - id: ERR_INSTALLMENT_STATE_INVALID
    http_status: 409
    condition: "Payment posted against an installment that is SCHEDULED, PAID or CANCELLED"
    applies_to: ["POST /pace/assessments/{id}/installments/{installmentId}/payments"]
  - id: ERR_TRANSFER_STATE_INVALID
    http_status: 409
    condition: "record attempted on a transfer that is not QUOTED (already recorded, VOID_STALE or EXPIRED)"
    applies_to: ["POST /pace/assessment-transfers/{id}/record"]
  - id: ERR_RESCISSION_PERIOD_ACTIVE
    http_status: 422
    condition: "Release attempted while now < FinancingAgreement.rescission_expires_at; outranks every fiscal check on the same call"
    applies_to: ["POST /pace/disbursements/{id}/release"]
  - id: ERR_ORAL_CONFIRMATION_REQUIRED
    http_status: 422
    condition: "Release attempted on an agreement with oral_confirmation_required == true and oral_confirmation_completed_at == null"
    applies_to: ["POST /pace/disbursements/{id}/release"]
  - id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    condition: "X-User-ID equals Application.underwriter_user_id at approve, or equals CompletionCertificate.verified_by_user_id at release"
    applies_to: ["POST /pace/applications/{id}/approve", "POST /pace/disbursements/{id}/release"]
  - id: ERR_LENDER_CONSENT_PENDING
    http_status: 422
    condition: "Approve attempted while an ACTIVE lien of the application is still PENDING (deadline not reached, or reached in a county that does not permit deemed consent)"
    applies_to: ["POST /pace/applications/{id}/approve"]
  - id: ERR_LENDER_CONSENT_DECLINED
    http_status: 422
    condition: "Approve attempted while an ACTIVE lien of the application has consent_response == DECLINED"
    applies_to: ["POST /pace/applications/{id}/approve"]
  - id: ERR_SIGNATURE_NAME_MISMATCH
    http_status: 422
    condition: "signature_name / homeowner_signature_name differs from Property.owner_full_name (case-sensitive after trimming)"
    applies_to: ["POST /pace/financing-agreements/{id}/sign", "POST /pace/completion-certificates/{id}/sign"]
  - id: ERR_FUNDS_ALREADY_RELEASED
    http_status: 409
    condition: "Rescission attempted while a Disbursement of the application is RELEASED"
    applies_to: ["POST /pace/financing-agreements/{id}/rescind"]
  - id: ERR_NO_RECOURSE_BASIS
    http_status: 422
    condition: "Reversal attempted with no WorkmanshipComplaint of the application in status ESCALATED_RECOURSE"
    applies_to: ["POST /pace/disbursements/{id}/reverse"]
  - id: ERR_PROPERTY_IN_BANKRUPTCY
    http_status: 422
    condition: "Property.in_bankruptcy == true"
    applies_to: ["POST /pace/applications", "POST /pace/applications/{id}/submit", "POST /pace/applications/{id}/underwrite"]
  - id: ERR_TAX_DELINQUENCY_HISTORY
    http_status: 422
    condition: "Property.tax_delinquency_count_36m > 1"
    applies_to: ["POST /pace/applications/{id}/submit", "POST /pace/applications/{id}/underwrite"]
  - id: ERR_QUOTE_EXPIRED
    http_status: 409
    condition: "record attempted when the current logical date >= good_through_date; the transfer is moved to EXPIRED in the same request"
    applies_to: ["POST /pace/assessment-transfers/{id}/record"]
  - id: ERR_CLOSING_DATE_IN_PAST
    http_status: 422
    condition: "closing_date is before the current logical date"
    applies_to: ["POST /pace/assessment-transfers"]
  - id: ERR_ASSESSMENT_YEAR_OVERLAP
    http_status: 409
    condition: "[first_tax_year, final_tax_year] overlaps an existing assessment on the same parcel; adjacency (previous final_tax_year + 1) is allowed"
    applies_to: ["POST /pace/assessments"]
  - id: ERR_QUOTE_WINDOW_OVERLAP
    http_status: 409
    condition: "A QUOTED transfer on the same assessment has a window [quoted_at, good_through_date + 5 days) that covers now"
    applies_to: ["POST /pace/assessment-transfers"]
  - id: ERR_WORKMANSHIP_GATE_NOT_MET
    http_status: 422
    condition: "Reinstatement attempted while trailing_24m workmanship_score < 9000 or lifetime_workmanship_score < 8000"
    applies_to: ["POST /pace/contractors/{id}/reinstate"]
  - id: ERR_OPEN_REMEDY_OUTSTANDING
    http_status: 422
    condition: "Reinstatement attempted while upheld_open_remedy_count > 0"
    applies_to: ["POST /pace/contractors/{id}/reinstate"]
  - id: ERR_REMEDY_DEADLINE_PASSED
    http_status: 422
