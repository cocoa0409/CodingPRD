            - "Presentation.${p1_id}.drawn_amount_cents == 2000000"
            - "${avail_t1} == 8000000"
            - "Presentation.${p2_id}.drawn_amount_cents == 3000000"
            - "${avail_t2} == 5000000"
            - "DocumentaryCredit.${credit_id}.reserved_cents == 0"
            - "DocumentaryCredit.${credit_id}.drawn_settled_cents == 0"
            - "${avail_t3} == 7000000"
