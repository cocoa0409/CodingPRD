  - rule_id: priority_pair_validation_conflict
    instances:
      - name: approve_draft_request_state_beats_sod
        grounds:
          - validations[priority=10]
          - validations[priority=16]
          - errors[ERR_REQUEST_INVALID_STATE]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: |
          Pair state (priority 10) vs business_safety (priority 16): approving a
          request still in DRAFT by the very user who created it violates both the
          state precondition and segregation of duties; the state error
          ERR_REQUEST_INVALID_STATE must win.
