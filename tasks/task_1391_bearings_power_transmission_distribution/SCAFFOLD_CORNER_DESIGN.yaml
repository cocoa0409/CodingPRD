              as: CounterSalesRep
              captures: { err: $.data.error_id }
          assert:
            - "st1 == FACTORY_ORDERED (13:59 < 14 cutoff)"
            - "err == ERR_FACTORY_ORDER_CUTOFF_PASSED at exactly 14:00 (>= semantics)"

      - name: factory_receipt_respects_tier_adjusted_lead_time
        claim_type: temporal_validation
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_FACTORY_LEAD_TIME_UNMET]"
          - "state_machines.OrderLine.FACTORY_ORDERED_to_FACTORY_RECEIVED"
        distinguishing_aspect: "Effective lead time is tier-adjusted: EMERGENCY receives immediately, RUSH halves (4 -> 2 days), NONE needs the full 4 days — a NONE receipt at +3d fails while RUSH at +2d succeeds."
        test_recipe:
          setup: ["order (before cutoff) with three lines: l1 EMERGENCY, l2 RUSH, l3 NONE; all FACTORY_ORDERED at 2026-08-03T09:00Z; branch stock lead 4 days"]
          setup_api_calls:
            - call: "POST /motion/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SystemAdmin
