  - method: POST
    path: "/backline/shipment-lines/{id}/cancel"
    description: "BOOKED -> CANCELLED"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: ShipmentLine
    side_effects: ["recomputes shipment.booked_weight_kg", "increments ShipmentLine.version"]
  - method: POST
    path: "/backline/shipments/{id}/depart"
    description: "LOADING -> IN_TRANSIT"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: Shipment
    side_effects: ["units OUT_ON_RENTAL -> IN_TRANSIT", "cases ASSIGNED -> IN_TRANSIT", "increments Shipment.version"]
  - method: POST
    path: "/backline/shipments/{id}/mark-delivered"
    description: "IN_TRANSIT -> DELIVERED"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: Shipment
    side_effects: ["lines -> DELIVERED", "units IN_TRANSIT -> OUT_ON_RENTAL", "cases IN_TRANSIT -> AVAILABLE at destination", "increments Shipment.version"]
  - method: POST
    path: "/backline/shipments/{id}/close"
    description: "DELIVERED -> CLOSED"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: Shipment
    side_effects: ["increments Shipment.version"]
  - method: POST
    path: "/backline/shipments/{id}/cancel"
    description: "PLANNED/LOADING -> CANCELLED with line cascade"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: Shipment
    side_effects: ["lines BOOKED -> CANCELLED", "cases released", "increments Shipment.version"]

