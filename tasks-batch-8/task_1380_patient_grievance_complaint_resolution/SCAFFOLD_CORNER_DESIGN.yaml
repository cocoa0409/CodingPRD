            - { call: "POST /api/staff-members", payload: { full_name: "Ivy B", capabilities: ["INVESTIGATOR"] }, as: SystemAdmin, captures: { invb: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Ivy C", capabilities: ["INVESTIGATOR"], max_concurrent_assignments: 5 }, as: SystemAdmin, captures: { invc: $.data.id } }
            - { call: "PATCH /api/staff-members/${invc}", payload: { on_leave: true }, as: SystemAdmin }
            - { call: "POST /api/staff-members", payload: { full_name: "Dana Director", capabilities: ["DIRECTOR"] }, as: SystemAdmin, captures: { dir: $.data.id } }
            - { call: "POST /api/patient-cases", payload: { patient_ref: "P-0324", unit_id: "${u1}", received_at: "2026-08-03T09:00:00Z", channel: "PHONE", description: "Case one", grievance_category: "OTHER" }, as: IntakeCoordinator, captures: { ca: $.data.id, cav: $.data.version } }
            - { call: "POST /api/patient-cases/${ca}/classification-decisions", payload: { decision: "GRIEVANCE", rationale_code: "INITIAL_INTAKE", expected_case_version: "${cav}" }, as: IntakeCoordinator }
            - { call: "GET /api/patient-cases/${ca}", as: PatientRelationsDirector, as_user_id: "${dir}", captures: { cav2: $.data.version } }
            - { call: "POST /api/patient-cases", payload: { patient_ref: "P-0325", unit_id: "${u1}", received_at: "2026-08-03T09:00:00Z", channel: "EMAIL", description: "Case two", grievance_category: "OTHER" }, as: IntakeCoordinator, captures: { cb: $.data.id, cbv: $.data.version } }
            - { call: "POST /api/patient-cases/${cb}/classification-decisions", payload: { decision: "GRIEVANCE", rationale_code: "INITIAL_INTAKE", expected_case_version: "${cbv}" }, as: IntakeCoordinator }
            - { call: "GET /api/patient-cases/${cb}", as: PatientRelationsDirector, as_user_id: "${dir}", captures: { cbv2: $.data.version } }
          trigger:
            - { call: "POST /api/patient-cases/${ca}/assignments", payload: { expected_case_version: "${cav2}" }, as: PatientRelationsDirector, as_user_id: "${dir}", captures: { pick1: $.data.investigator_id } }
            - { call: "POST /api/patient-cases/${cb}/assignments", payload: { expected_case_version: "${cbv2}" }, as: PatientRelationsDirector, as_user_id: "${dir}", captures: { pick2: $.data.investigator_id } }
          assert:
            - "pick1 == ${inva} (tie at 0 open -> earliest created_at wins; never id-based)"
            - "pick2 == ${invb} (0 open < 1 open; on_leave invC excluded from the pool)"

