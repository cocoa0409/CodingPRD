# =============================================================================
# Scaffold Difficulty Design — Test Targeting Index for task_0056_shared_bicycle
# Cross-references every Difficulty Rule (§0.5 of the scaffold-generator skill)
# against declared elements of SCAFFOLD.yaml §1.1–§1.7.
# =============================================================================

scaffold_difficulty_design:

  # -------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: ride_fare_per_minute_vs_daily_cap
        grounds:
          - calculations.ride_fare_settlement
          - calculations.ride_fare_settlement.variants.PER_MINUTE
          - calculations.ride_fare_settlement.variants.DAILY_CAP
          - entities.Ride.fields.settlement_variant
          - entities.Ride.fields.final_fare_cents
        distinguishing_aspect: |
          Two valid billing readings of the same ride duration produce different
          fares: PER_MINUTE adds segment math literally, DAILY_CAP clamps at
          1500 cents (STANDARD) or 3000 cents (E_BIKE) — different numbers from
          identical (duration, model, free, pass, location) inputs once duration
          crosses the cap boundary. The two variants live on the same entity
          (Ride) and are the only `variants:` of this calculation; the entity
          domain stressed here is the Ride/billing domain.
        test_recipe:
          setup:
            - "Region R with low_density_threshold=0, high_density_threshold=999, in_zone_return_reward_cents=0, out_of_zone_penalty_cents=0, deployment_quota=10, clock_minutes=0"
            - "Bike B model=STANDARD on-shelf in R, status=AVAILABLE"
            - "Rider U with wallet_balance_cents=10000, free_minutes_remaining=0, no monthly pass"
            - "Geofence G kind=ALLOWED_PARKING active, but rider will end OUTSIDE polygon so end_fence_kind=NONE"
          trigger:
            - "POST /rides {rider_id:U.id, bike_id:B.id}  → Ride R1 start_minute=0"
            - "POST /_clock/advance {minutes:20}"
            - "POST /rides/{R1.id}/end with end_lat/lng outside any fence  → expect PER_MINUTE"
            - "Reset: top up wallet so a second 60-minute ride is affordable; start Ride R2 with another fresh Bike+Rider pair"
            - "POST /_clock/advance {minutes:60}"
            - "POST /rides/{R2.id}/end outside any fence  → expect DAILY_CAP"
          assert:
            - "Ride R1.settlement_variant == 'PER_MINUTE'"
            - "Ride R1.final_fare_cents == 600   # 20 * 30"
            - "Ride R2.settlement_variant == 'DAILY_CAP'"
            - "Ride R2.final_fare_cents == 1500  # min(30*30 + 30*50, 1500)"

      - name: region_loss_rate_provisional_vs_attributed
        grounds:
          - calculations.region_loss_rate
          - calculations.region_loss_rate.variants.provisional
          - calculations.region_loss_rate.variants.attributed
          - entities.LossRecord.fields.responsibility
        distinguishing_aspect: |
          Two readings of the same loss data produce different ratios:
          provisional counts every LossRecord (including responsibility=UNKNOWN);
          attributed counts only LossRecord rows with responsibility != UNKNOWN.
          The entity domain here is Region/loss accounting — a different entity
          domain from the Ride/billing dual variant above (Rule 1 differentiation
          clause).
        test_recipe:
          setup:
            - "Region R2 with deployment_quota=50; deploy 40 bikes on shelf, status=AVAILABLE"
            - "Create 4 LossRecord rows on bikes from R2: 1 responsibility=UNKNOWN cause=ABANDONED, 2 responsibility=RIDER cause=DAMAGE, 1 responsibility=OPERATOR cause=DAMAGE; each financial_impact_cents=5000"
          trigger:
            - "GET /regions/{R2.id}/loss-rate"
          assert:
            - "response.provisional_loss_rate == 0.1   # 4/40"
            - "response.attributed_loss_rate == 0.075  # 3/40"
            - "response.loss_count == 4"
            - "response.deployed_lifetime == 40"

  # -------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: ride_fare_pinned_evaluation_order
        grounds:
          - calculations.ride_fare_settlement
          - calculations.ride_fare_settlement.formula
          - entities.Ride.fields.chargeable_minutes
          - entities.Ride.fields.base_fare_cents
          - entities.Ride.fields.final_fare_cents
          - entities.Rider.fields.free_minutes_remaining
          - entities.Rider.fields.monthly_pass_expires_minute
          - entities.Bike.fields.model
        distinguishing_aspect: |
          Mode (c): a circular-looking dependency where evaluation order must be
          explicit. The fare depends on (free coverage → pass coverage →
          chargeable minutes → segment pricing → daily-cap clamp → penalty add)
          all stacked; pass coverage is gated on bike model so a naive
          "subtract pass from duration first" yields different numbers. The
          scaffold pins free-then-pass-then-segment-then-cap-then-penalty as
          the only legal order, so the answer is well-defined.
        test_recipe:
          setup:
            - "Region R3 with in_zone_return_reward_cents=0, out_of_zone_penalty_cents=200, deployment_quota=10, low_density_threshold=0, high_density_threshold=999"
            - "Bike B3a model=STANDARD on-shelf in R3"
            - "Bike B3b model=E_BIKE on-shelf in R3, battery_pct=80"
            - "Rider U3 wallet=20000, free_minutes_remaining=10, monthly_pass active (purchase via POST /riders/{U3.id}/monthly-pass; assume wallet covers MONTHLY_PASS_PRICE_CENTS)"
            - "Geofence RESTRICTED active in R3 covering the end_lat/lng used for the STANDARD ride"
          trigger:
            - "Ride R3a on B3a: clock_minutes=0 → unlock → advance 40 minutes → end inside RESTRICTED fence"
            - "Ride R3b on B3b (fresh state, no penalty zone): clock_minutes (advanced further), unlock e-bike → advance 25 minutes → end at NONE"
          assert:
            - "Ride R3a.applied_free_minutes == 10           # min(10, 40)"
            - "Ride R3a.pass_covered_minutes == 30           # 40-10 = 30 covered by pass (STANDARD)"
            - "Ride R3a.chargeable_minutes == 0"
            - "Ride R3a.base_fare_cents == 0"
            - "Ride R3a.penalty_cents == 200"
            - "Ride R3a.final_fare_cents == 200              # cap clamp would be a no-op; penalty added AFTER cap"
            - "Ride R3a.settlement_variant == 'PER_MINUTE'   # 0 < 1500"
            - "Ride R3b.pass_covered_minutes == 0            # pass does NOT cover E_BIKE"
            - "Ride R3b.chargeable_minutes == 25             # free already exhausted by R3a"
            - "Ride R3b.base_fare_cents == 1500              # 25 * 60 (under SEGMENT_BREAK_MIN=30)"
            - "Ride R3b.final_fare_cents == 1500"

      - name: density_posture_inclusive_thresholds
        grounds:
          - calculations.density_posture
          - calculations.density_posture.formula
          - entities.Region.fields.density_posture
          - entities.Region.fields.low_density_threshold
          - entities.Region.fields.high_density_threshold
          - entities.Region.fields.available_count
        distinguishing_aspect: |
          Mode (a): formula with three inputs (available_count,
          low_density_threshold, high_density_threshold) and non-linear branch
          interaction — `<=` for LOW and `>=` for HIGH are BOTH inclusive,
          so a region whose available_count equals BOTH thresholds (when
          low==high — degenerate but legal) resolves to LOW first (LOW branch
          evaluated before HIGH). The scaffold pins this branch order. This is
          a DIFFERENT mode from `ride_fare_pinned_evaluation_order` (mode c),
          satisfying the cross-mode differentiation clause.
        test_recipe:
          setup:
            - "Region R4 deployment_quota=20, low_density_threshold=3, high_density_threshold=10"
            - "Deploy 4 bikes ON_SHELF AVAILABLE (so available_count=4 → NORMAL)"
          trigger:
            - "GET /regions/{R4.id}      # observe NORMAL"
            - "Remove one bike via POST /regions/{R4.id}/bikes/{bike_id}/shelf action=OFF (now available_count=3 → LOW boundary)"
            - "GET /regions/{R4.id}      # observe LOW (inclusive <=)"
            - "Deploy 7 more bikes (total available_count=10 → HIGH boundary)"
            - "GET /regions/{R4.id}      # observe HIGH (inclusive >=)"
          assert:
            - "After first GET: response.density_posture == 'NORMAL'"
            - "After second GET: response.density_posture == 'LOW'   # 3 <= 3 inclusive"
            - "After third GET: response.density_posture == 'HIGH'   # 10 >= 10 inclusive"

  # -------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: bike_status_parallel_dimensions
        grounds:
          - state_machines.Bike.shelf_state
          - state_machines.Bike.status
          - entities.Bike.fields.shelf_state
          - entities.Bike.fields.status
        distinguishing_aspect: |
          Bike carries TWO independent state dimensions on the same row
          (`shelf_state` ∈ {OFF_SHELF, ON_SHELF, SCRAPPED} × `status` ∈
          {AVAILABLE, IN_USE, FAULT, RECALL}). Each axis transitions on
          different triggers — shelf via the on/off-shelf endpoint, status
          via ride/fault/recall — so the combined valid-combination set is a
          product, not a chain. This is the "parallel state dimensions on one
          entity" non-linear shape.
        test_recipe:
          setup:
            - "Region R5 quota=10, low=0, high=999; Bike B5 OFF_SHELF (initial)"
            - "Rider U5 with wallet=5000"
          trigger:
            - "POST /regions/{R5.id}/bikes/{B5.id}/shelf action=ON   # shelf_state OFF_SHELF→ON_SHELF, status defaults AVAILABLE"
            - "POST /rides {rider_id:U5.id, bike_id:B5.id}            # status AVAILABLE→IN_USE; shelf_state UNCHANGED"
            - "POST /_clock/advance {minutes:5}"
            - "POST /rides/{ride_id}/end {end_lat:.., end_lng:..}     # status IN_USE→AVAILABLE; shelf_state still ON_SHELF"
            - "POST /bikes/{B5.id}/recall                              # status AVAILABLE→RECALL; shelf_state still ON_SHELF"
          assert:
            - "After shelf ON: Bike.shelf_state=='ON_SHELF' AND Bike.status=='AVAILABLE'"
            - "After unlock: Bike.shelf_state=='ON_SHELF' AND Bike.status=='IN_USE'"
            - "After end: Bike.shelf_state=='ON_SHELF' AND Bike.status=='AVAILABLE'"
            - "After recall: Bike.shelf_state=='ON_SHELF' AND Bike.status=='RECALL'   # axes moved independently"

      - name: ride_branching_settle_or_void_with_dispute_revert
        grounds:
          - state_machines.Ride.status
          - state_machines.Ride.status.transitions
          - entities.Ride.fields.status
        distinguishing_aspect: |
          Ride exhibits BOTH branching (ACTIVE → {SETTLED, VOIDED}) AND a
          revisit/back-edge (SETTLED → DISPUTED → SETTLED). The entity is
          Ride — a DIFFERENT entity from Bike (Rule 3 differentiation), so the
          two non-linear machines belong to different entities.
        test_recipe:
          setup:
            - "Provision Region R6, Bike B6 ON_SHELF AVAILABLE, Rider U6 wallet=10000"
          trigger:
            - "Path A: POST /rides → POST /_clock/advance 10 → POST /rides/{id}/end at NONE fence → POST /rides/{id}/dispute → POST /rides/{id}/adjust new_final_fare_cents=100  # ACTIVE→SETTLED→DISPUTED→SETTLED"
            - "Path B (fresh ride): POST /rides → POST /rides/{id}/void as Admin   # ACTIVE→VOIDED"
          assert:
            - "Path A ride.status final == 'SETTLED' AND ride.final_fare_cents == 100"
            - "Path B ride.status == 'VOIDED' AND ride.final_fare_cents == 0"
            - "Path B bike.status == 'AVAILABLE' AND rider.wallet_balance_cents unchanged from pre-unlock"

  # -------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: transfer_completion_three_hop_cascade
        grounds:
          - state_machines.TransferOrder.status.transitions
          - calculations.density_posture
          - entities.Region.fields.available_count
          - entities.Region.fields.density_posture
          - entities.TransferOrder.fields.status
          - entities.TransferOrder.fields.kind
        distinguishing_aspect: |
          Depth-3 cascade originating from POST /transfers/{id}/complete:
            hop 1 — bikes flipped from IN_TRANSIT to ON_SHELF in to_region
                    (mutation on Bike caused by the COMPLETE trigger);
            hop 2 — to_region.available_count and density_posture
                    recomputed because the Bike mutations in hop 1 changed
                    the available bike set (mutation on Region caused by hop 1,
                    NOT by the original trigger directly);
            hop 3 — every other PLANNED REPLENISH TransferOrder targeting
                    to_region is automatically CANCELLED because hop 2 flipped
                    posture out of LOW (mutation on TransferOrder caused by
                    hop 2, NOT by the trigger).
          Each hop is caused by the previous link, not by the original action.
        test_recipe:
          setup:
            - "Region R_LOW deployment_quota=20, low=4, high=10, initial available_count=2 (deploy 2 bikes ON_SHELF AVAILABLE so density_posture=LOW)"
            - "Region R_SRC deployment_quota=20, low=0, high=5, with 6 bikes AVAILABLE (so density_posture=HIGH)"
            - "TransferOrder T1 from R_SRC to R_LOW with bike_ids=[5 bikes from R_SRC]; kind=REPLENISH"
            - "TransferOrder T2 from R_SRC to R_LOW with bike_ids=[1 different bike]; kind=REPLENISH; status=PLANNED"
            - "Dispatch T1: POST /transfers/{T1.id}/dispatch  # T1 → IN_TRANSIT, 5 bikes leave R_SRC (already exercises hop equivalent on source)"
          trigger:
            - "POST /transfers/{T1.id}/complete"
          assert:
            - "Hop 1: every bike in T1.bike_ids has region_id == R_LOW.id AND shelf_state == 'ON_SHELF' AND status == 'AVAILABLE'"
            - "Hop 2: Region(R_LOW).available_count == 7  AND  Region(R_LOW).density_posture == 'NORMAL'  # was LOW=2, +5 -> 7, 4<7<10"
            - "Hop 3: TransferOrder T2.status == 'CANCELLED'  # auto-cancelled because to_region left LOW"
            - "T1.status == 'COMPLETED'"

      - name: bike_fault_isolation_two_hop_cascade
        grounds:
          - state_machines.Bike.status.transitions
          - state_machines.WorkOrder.status.transitions
          - calculations.density_posture
          - entities.Bike.fields.status
          - entities.Region.fields.density_posture
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (POST /bikes/{id}/fault-report):
            hop 1 — Bike.status flips AVAILABLE→FAULT (and a WorkOrder is opened)
                    caused directly by the trigger;
            hop 2 — Region.available_count and density_posture are recomputed
                    BECAUSE hop 1 reduced the set of AVAILABLE bikes — this hop
                    is caused by the bike mutation, not directly by the
                    fault-report request. The trigger differs from the
                    transfer-completion cascade above (Rule 4 differentiation).
        test_recipe:
          setup:
            - "Region R_F deployment_quota=20, low=4, high=10; deploy exactly 5 bikes ON_SHELF AVAILABLE (NORMAL)"
            - "Confirm Region(R_F).density_posture == 'NORMAL' AND available_count == 5"
          trigger:
            - "POST /bikes/{any_bike_in_R_F.id}/fault-report {category:'FLAT_TIRE'}"
          assert:
            - "Hop 1: target Bike.status == 'FAULT' AND a new WorkOrder exists with status='OPEN' and bike_id==target_bike.id"
            - "Hop 2: Region(R_F).available_count == 4  AND  Region(R_F).density_posture == 'LOW'  # 4 <= 4 inclusive boundary"

  # -------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_fiscal_dual_failure_at_unlock
        grounds:
          - validations[priority=5]   # state: target in correct state
          - validations[priority=15]  # business_fiscal: insufficient balance at unlock
          - errors.ERR_BIKE_NOT_AVAILABLE
          - errors.ERR_INSUFFICIENT_BALANCE
        distinguishing_aspect: |
          When a rider POSTs /rides on a bike whose status is not AVAILABLE
          AND the rider's wallet is also too low to unlock, BOTH a state
          error (ERR_BIKE_NOT_AVAILABLE) and a fiscal error
          (ERR_INSUFFICIENT_BALANCE) could fire. The scaffold pins state
          (priority 5) BEFORE business_fiscal (priority 15), so the test
          asserts ERR_BIKE_NOT_AVAILABLE wins. Category pair = state vs
          business_fiscal.
        test_recipe:
          setup:
            - "Region R7 quota=10; Bike B7 ON_SHELF status=IN_USE (mid-ride by some other Rider)"
            - "Rider U7 with wallet_balance_cents=0, no monthly pass"
          trigger:
            - "POST /rides {rider_id:U7.id, bike_id:B7.id}"
          assert:
            - "response.status == 409"
            - "response.error_id == 'ERR_BIKE_NOT_AVAILABLE'   # state beats fiscal"
            - "Both conditions are simultaneously true: Bike.status != AVAILABLE AND wallet < MIN_UNLOCK_BALANCE_CENTS"

      - name: safety_vs_referential_dual_failure_on_transfer_dispatch
        grounds:
          - validations[priority=4]   # business_referential
          - validations[priority=9]   # business_constraint: kind mismatch (safety-adjacent: it protects regional density)
          - errors.ERR_REFERENCE_NOT_FOUND
          - errors.ERR_TRANSFER_KIND_MISMATCH
        distinguishing_aspect: |
          When POST /transfers references a from_region that does not exist
          (referential, priority 4) AND the kind would also mismatch (priority
          9), the scaffold pins referential before constraint, so
          ERR_REFERENCE_NOT_FOUND wins. Category pair = business_referential
          vs business_constraint — a DIFFERENT pair from the
          state-vs-fiscal pair above (Rule 5 differentiation clause).
        test_recipe:
          setup:
            - "Region R_REAL quota=20, low=0, high=999; 4 bikes ON_SHELF AVAILABLE"
            - "Use a fabricated from_region_id like '00000000-0000-0000-0000-000000000000' that does not exist"
          trigger:
            - "POST /transfers {from_region_id:fabricated, to_region_id:R_REAL.id, bike_ids:[<one valid Bike id>]}"
          assert:
            - "response.status == 404"
            - "response.error_id == 'ERR_REFERENCE_NOT_FOUND'   # referential beats kind-mismatch"

  # -------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: daily_cap_inclusive_boundary_on_ride_end
        grounds:
          - calculations.ride_fare_settlement
          - calculations.ride_fare_settlement.variants.DAILY_CAP
          - entities.Ride.fields.settlement_variant
          - endpoints["POST /rides/{ride_id}/end"]
        distinguishing_aspect: |
          DAILY_CAP variant activates with `base_fare_cents >= daily_cap` —
          inclusive `>=` is the load-bearing precision. At exactly base=1500
          (chargeable=42 minutes on STANDARD: 30*30 + 12*50 = 1500) variant
          must be DAILY_CAP, not PER_MINUTE. Boundary lives on the metric
          base_fare_cents at the /rides/{id}/end endpoint.
        test_recipe:
          setup:
            - "Region R8 reward=0 penalty=0 quota=10 low=0 high=999"
            - "Bike B8 STANDARD ON_SHELF AVAILABLE"
            - "Rider U8 wallet=10000, no free, no pass"
          trigger:
            - "POST /rides {rider_id:U8.id, bike_id:B8.id}  # start_minute=0"
            - "POST /_clock/advance {minutes:42}"
            - "POST /rides/{id}/end at NONE fence"
          assert:
            - "Ride.base_fare_cents == 1500"
            - "Ride.settlement_variant == 'DAILY_CAP'"
            - "Ride.final_fare_cents == 1500"

      - name: loss_rate_zero_deployment_empty_set
        grounds:
          - calculations.region_loss_rate
          - calculations.region_loss_rate.formula
          - endpoints["GET /regions/{region_id}/loss-rate"]
          - entities.Region.fields.deployed_count
        distinguishing_aspect: |
          Empty-set edge: a region whose deployed_lifetime == 0 must return
          loss_rate == 0.0 (not divide-by-zero, not null). This metric
          (deployed_lifetime) and endpoint (GET /regions/{region_id}/loss-rate)
          are BOTH distinct from the daily-cap boundary's metric and endpoint,
          satisfying Rule 6's "different metrics, different endpoints"
          differentiation clause.
        test_recipe:
          setup:
            - "Region R9 quota=10 low=0 high=999; no bikes deployed; no loss records"
          trigger:
            - "GET /regions/{R9.id}/loss-rate"
          assert:
            - "response.provisional_loss_rate == 0.0"
            - "response.attributed_loss_rate == 0.0"
            - "response.loss_count == 0"
            - "response.deployed_lifetime == 0"
            - "response.anomaly == false"

  # -------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: bike_on_shelf_requires_no_open_workorder
        grounds:
          - state_machines.Bike.shelf_state.transitions
          - state_machines.WorkOrder.status
          - validations[priority=6]
          - errors.ERR_BIKE_HAS_OPEN_WORKORDER
        distinguishing_aspect: |
          A Bike's OFF_SHELF→ON_SHELF transition depends on the state of a
          DIFFERENT entity (WorkOrder.status ∉ {OPEN, ASSIGNED}). Cross-entity
          pair: Bike→WorkOrder.
        test_recipe:
          setup:
            - "Region Rx quota=10 low=0 high=999"
            - "Bike Bx OFF_SHELF (no region yet, just registered)"
            - "Create a WorkOrder W on Bx via POST /workorders {bike_id, cause:RECALL, category:OTHER, sla_minutes:60}  # status=OPEN; Bike.status flips to FAULT"
            - "POST /regions/{Rx.id}/bikes/{Bx.id}/shelf action=OFF first (no-op if already OFF) to ensure OFF_SHELF state"
          trigger:
            - "POST /regions/{Rx.id}/bikes/{Bx.id}/shelf action=ON"
          assert:
            - "response.status == 409"
            - "response.error_id == 'ERR_BIKE_HAS_OPEN_WORKORDER'"
            - "Bike.shelf_state remains 'OFF_SHELF'"

      - name: transfer_dispatch_depends_on_region_density_posture
        grounds:
          - state_machines.TransferOrder.status.transitions
          - calculations.density_posture
          - validations[priority=9]
          - errors.ERR_TRANSFER_KIND_MISMATCH
          - entities.TransferOrder.fields.kind
        distinguishing_aspect: |
          A TransferOrder's PLANNED→IN_TRANSIT transition depends on the state
          (`density_posture`) of a DIFFERENT entity (Region) — a REPLENISH
          transfer can dispatch only if to_region.density_posture == LOW at
          dispatch time. Cross-entity pair: TransferOrder→Region — different
          from the Bike→WorkOrder pair above (Rule 7 differentiation clause).
        test_recipe:
          setup:
            - "Region R_FROM with 6 AVAILABLE bikes, low=0 high=5 → posture=HIGH"
            - "Region R_TO with 3 AVAILABLE bikes, low=2 high=10 → posture=NORMAL (3 is in (2,10))"
            - "Create TransferOrder Tx from R_FROM to R_TO with 2 bikes from R_FROM → kind inferred = CLEARANCE (from_region is HIGH at plan time)"
            - "Top up R_TO with 1 more bike so available_count goes from 3 to 4 (still NORMAL)"
          trigger:
            - "POST /transfers/{Tx.id}/dispatch"
          assert:
            - "Tx.kind == 'CLEARANCE'"
            - "If at dispatch time from_region density_posture has dropped to NORMAL (e.g., due to other ops moving bikes), response.error_id == 'ERR_TRANSFER_KIND_MISMATCH'"
            - "Else (HIGH preserved): Tx.status == 'IN_TRANSIT'  # confirms the dependency on Region.density_posture controls the transition"

  # -------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: rider_at_most_one_active_ride
        grounds:
          - validations[priority=13]
          - errors.ERR_RIDER_HAS_ACTIVE_RIDE
          - state_machines.Ride.status
          - entities.Ride.fields.status
        distinguishing_aspect: |
          Interval semantics: a Rider's ACTIVE Ride occupies the half-open
          interval [start_minute, end_minute) — at most one ACTIVE Ride per
          Rider, with adjacency exclusive on the open end (a new ride can
          start in the SAME minute that a previous ride ended, because the
          previous Ride.status flipped to SETTLED at end_minute). Resource:
          Rider. Aggregate capacity: 1.
        test_recipe:
          setup:
            - "Region R_R quota=10 low=0 high=999; two bikes Ba, Bb ON_SHELF AVAILABLE"
            - "Rider U_R wallet=10000"
          trigger:
            - "POST /rides {rider_id:U_R.id, bike_id:Ba.id}   # start ride 1 at clock_minutes=0"
            - "POST /rides {rider_id:U_R.id, bike_id:Bb.id}   # attempt second concurrent ride"
          assert:
            - "Second call response.status == 409"
            - "Second call response.error_id == 'ERR_RIDER_HAS_ACTIVE_RIDE'"
            - "After POST /rides/{ride1.id}/end then POST /rides {rider_id:U_R.id, bike_id:Bb.id}: succeeds (adjacency allowed on the open end)"

      - name: bike_single_concurrent_rider_with_buffer_of_zero
        grounds:
          - concurrency_rules["Two riders POST /rides simultaneously targeting the same AVAILABLE bike"]
          - validations[priority=5]
          - errors.ERR_BIKE_NOT_AVAILABLE
          - entities.Bike.fields.status
        distinguishing_aspect: |
          Interval semantics: a Bike is occupied by exactly one Ride during
          [start_minute, end_minute), buffer=0 (no cooldown between rides);
          aggregate capacity = 1. Different resource (Bike) from the Rider
          rule above, AND different interval semantics — Bike has no
          half-open adjacency rule beyond the trivial "next start can be the
          same minute as previous end" because the gating is on
          Bike.status==AVAILABLE not on time. The two overlap rules sit on
          different resources (Rule 8 differentiation).
        test_recipe:
          setup:
            - "Region R_B quota=10 low=0 high=999; one Bike Bsingle ON_SHELF AVAILABLE"
            - "Two Riders Ua and Ub, both wallets=10000"
          trigger:
            - "Ua: POST /rides {rider_id:Ua.id, bike_id:Bsingle.id}   # succeeds"
            - "Ub: POST /rides {rider_id:Ub.id, bike_id:Bsingle.id}   # races, must lose"
          assert:
            - "First-writer-wins: exactly one ride created"
            - "Loser response.status == 409 AND response.error_id == 'ERR_BIKE_NOT_AVAILABLE'"
            - "Bike.status == 'IN_USE' AND Bike.current_ride_id == winner_ride.id"

  # -------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: wallet_invariant_under_dispute_and_adjust
        grounds:
          - state_machines.Ride.status.transitions  # SETTLED→DISPUTED→SETTLED
          - calculations.ride_fare_settlement
          - entities.Rider.fields.wallet_balance_cents
          - entities.Ride.fields.final_fare_cents
        distinguishing_aspect: |
          Conserved quantity: `Rider.wallet_balance_cents +
          sum(Ride.final_fare_cents for SETTLED rides by this rider) -
          sum(Ride.reward_cents for SETTLED rides by this rider) - admin_grants
          - top_ups = initial_wallet`. After end-of-ride (debit) then
          dispute-and-adjust to the SAME final_fare_cents (compensating loop
          with zero net change), wallet_balance_cents MUST equal its
          immediately-post-end value; no money was lost. Conserved quantity:
          monetary cents.
        test_recipe:
          setup:
            - "Region R_M reward=0 penalty=0 quota=10 low=0 high=999"
            - "Bike Bm STANDARD ON_SHELF AVAILABLE"
            - "Rider Um wallet_balance_cents=10000"
          trigger:
            - "Snapshot wallet0 = 10000"
            - "POST /rides → POST /_clock/advance 20 → POST /rides/{id}/end at NONE  # debit 600"
            - "Snapshot walletA = Rider.wallet_balance_cents"
            - "POST /rides/{id}/dispute"
            - "POST /rides/{id}/adjust new_final_fare_cents=600   # adjust to same number → refund 0"
          assert:
            - "walletA == 10000 - 600 == 9400"
            - "After adjust: Rider.wallet_balance_cents == 9400   # invariant: identity adjustment leaves wallet unchanged"
            - "Ride.final_fare_cents == 600   # final unchanged"

      - name: deployed_count_invariant_under_transfer_cancel_in_transit
        grounds:
          - state_machines.TransferOrder.status.transitions  # IN_TRANSIT→CANCELLED restoration branch
          - entities.Region.fields.deployed_count
          - entities.Bike.fields.region_id
          - entities.Bike.fields.shelf_state
        distinguishing_aspect: |
          Conserved quantity: `sum over all regions of Region.deployed_count +
          number of bikes in transit + number of SCRAPPED bikes = total
          ever-deployed bikes`. Dispatch then in-transit-cancel pair MUST
          restore each region's deployed_count to its pre-dispatch value.
          Conserved quantity here is BIKE COUNT (a non-monetary count) —
          a different type of conserved quantity from the wallet-cents
          invariant above, satisfying Rule 9 differentiation.
        test_recipe:
          setup:
            - "Region R_S quota=20 low=0 high=5 with 6 AVAILABLE bikes (HIGH)"
            - "Region R_D quota=20 low=4 high=10 with 2 AVAILABLE bikes (LOW)"
            - "Snapshot: R_S.deployed_count==6, R_D.deployed_count==2"
            - "TransferOrder Tinv from R_S to R_D bike_ids=[3 bikes]; kind=CLEARANCE"
          trigger:
            - "POST /transfers/{Tinv.id}/dispatch         # R_S.deployed_count→3, bikes in transit"
            - "POST /transfers/{Tinv.id}/cancel           # restore branch"
          assert:
            - "After cancel: Region(R_S).deployed_count == 6   # exactly the pre-dispatch value"
            - "After cancel: Region(R_D).deployed_count == 2   # unchanged"
            - "Each transferred Bike: region_id == R_S.id AND shelf_state == 'ON_SHELF' AND status == 'AVAILABLE'"
            - "Tinv.status == 'CANCELLED'"
