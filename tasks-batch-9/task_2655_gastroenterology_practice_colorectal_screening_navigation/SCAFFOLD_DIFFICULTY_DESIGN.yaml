              captures: { booked3: $.data.booked_minutes, rem3: $.data.remaining_minutes }
          assert:
            - "${cap} == 480 and ${rem0} == 480"
            - "${booked1} == 120 and ${rem1} == 360 and ${claim_a_allowed} == 170750 (FACILITY 120750 + PROFESSIONAL 41500 = base 162250, TIER_2 addon 8500; no ANESTHESIA line on a MODERATE_SEDATION block)"
            - "${bk_a_status} == CANCELLED and ${bk_a_released} == 60 (duration_minutes 45 + turnover_minutes 15)"
            - "${booked2} == 60 and ${rem2} == 420 - booked_minutes + remaining_minutes == 480 still holds"
            - "BillingClaim.${claim_a}.status == VOIDED with allowed_amount_cents 0, patient_responsibility_cents 0, plan_paid_cents 0 and line_items []"
            - "ScreeningEpisode.${ep_a}.clinical_status == OPEN"
            - "the third trigger call returns 201 - the cancelled row is excluded from the overlap sweep, so 13:00Z is bookable again"
            - "${booked3} == 120 and ${rem3} == 360"
            - "ScreeningEpisode.${ep_c}.clinical_status == PROCEDURE_SCHEDULED and ScreeningEpisode.${ep_b}.clinical_status == PROCEDURE_SCHEDULED"
