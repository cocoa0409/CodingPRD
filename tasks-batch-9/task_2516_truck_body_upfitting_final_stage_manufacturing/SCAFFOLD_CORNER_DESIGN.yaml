            - call: "POST /upfit/upfit-orders"
              payload: { order_number: "UO-5028", order_type: "POOL_STOCK", customer_id: null, build_configuration_id: "${cfg}", body_mount_offset_from_front_axle_in: 120 }
              as: ProductionScheduler
              as_user_id: "ps-1"
