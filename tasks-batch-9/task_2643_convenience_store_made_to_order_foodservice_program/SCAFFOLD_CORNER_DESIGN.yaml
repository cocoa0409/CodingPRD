            - "Order.${order_id}.settlement_status == AUTHORIZED"
            - "Order.${order_id}.subtotal_gross_cents == 1148"
            - "GET /orders/${order_id}/kitchen-tickets -> total_count == 2"

      - name: verifying_a_corrective_action_restores_the_unit_and_unblocks_bake
        claim_type: cross_entity
        grounds:
          - state_machines.CorrectiveAction.OPEN_to_VERIFIED
          - state_machines.HoldingUnit.IMPAIRED_to_OPERATIONAL
          - state_machines.ProductionBatch.PLANNED_to_BAKING
          - errors[ERR_HOLDING_UNIT_NOT_OPERATIONAL]
          - validations[priority=16]
        distinguishing_aspect: |
          One write on CorrectiveAction changes state on TWO other entities' behaviour: the unit returns to
          OPERATIONAL with consecutive_out_of_range_count reset from 1 to 0, and a bake that was refused
          with ERR_HOLDING_UNIT_NOT_OPERATIONAL immediately before now succeeds. The batch stayed PLANNED
          throughout, so it was never touched by the impairment sweep.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T06:00:00Z; store WAWA-0101 with unit BC-1 banded 135..185 F"
            - "one PLANNED pretzel batch in slot 1 - PLANNED batches are outside the impairment sweep"
            - "associate assoc-1 logged a 120 F reading, so the unit is IMPAIRED with one strike"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:00:00Z" }
              as: ChainAdmin
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: true }
              as: ChainAdmin
              captures: { store_id: $.data.id }
            - call: "POST /stores/${store_id}/holding-units"
              payload: { unit_code: "BC-1", unit_type: "BAKERY_CASE", min_temp_f: 135, max_temp_f: 185, slot_count: 3 }
              as: StoreManager
              captures: { unit_id: $.data.id }
            - call: "POST /menu-items"
              payload: { sku: "PRETZEL-SOFT", name: "Soft Pretzel", station: "BAKERY", fulfillment_mode: "PAR_BAKED_CASE", base_price_cents: 199, unit_food_cost_cents: 40, bake_minutes: 25, hold_minutes: 240, valid_dayparts: ["BREAKFAST", "LUNCH"], is_catering_eligible: true }
              as: ChainAdmin
              captures: { pretzel_id: $.data.id }
            - call: "POST /production-batches"
              payload: { store_id: "${store_id}", menu_item_id: "${pretzel_id}", holding_unit_id: "${unit_id}", slot_index: 1, planned_qty: 40, bake_start_at: "2026-08-01T06:00:00Z" }
              as: KitchenAssociate
              captures: { batch_id: $.data.id }
            - call: "POST /holding-units/${unit_id}/temperature-logs"
              payload: { reading_f: 120 }
              as: KitchenAssociate
              as_user_id: "assoc-1"
              captures: { log_id: $.data.id, in_range: $.data.in_range }
          trigger:
            - call: "POST /production-batches/${batch_id}/bake"
              payload: {}
              as: KitchenAssociate
              captures: { err_id: $.data.error_id }
            - call: "POST /corrective-actions"
              payload: { temperature_log_id: "${log_id}", action_taken: "REPLACED_CASE_THERMOSTAT" }
              as: ShiftLead
              as_user_id: "lead-1"
              captures: { ca_id: $.data.id, ca_status: $.data.status }
            - call: "POST /corrective-actions/${ca_id}/verify"
              payload: {}
              as: ShiftLead
              as_user_id: "lead-1"
              captures: { ca_after: $.data.status, verifier: $.data.verified_by_user_id }
            - call: "POST /production-batches/${batch_id}/bake"
              payload: {}
              as: KitchenAssociate
              captures: { batch_after: $.data.status }
          assert:
            - "${in_range} == false"
            - "${err_id} == ERR_HOLDING_UNIT_NOT_OPERATIONAL"
            - "first trigger HTTP status == 409"
            - "${ca_status} == OPEN"
            - "${ca_after} == VERIFIED"
            - "${verifier} == lead-1"
            - "CorrectiveAction.${ca_id}.verified_at == 2026-08-01T06:00:00Z"
            - "HoldingUnit.${unit_id}.status == OPERATIONAL"
            - "HoldingUnit.${unit_id}.consecutive_out_of_range_count == 0"
            - "${batch_after} == BAKING"
            - "Store.${store_id}.hot_case_slots_used == 1"
            - "Store.${store_id}.waste_cost_cents_mtd == 0"

      - name: partial_discard_syncs_the_store_waste_ledger_and_keeps_the_slot
        claim_type: ledger_sync
        grounds:
          - state_machines.ProductionBatch.HOLDING_to_HOLDING
          - calculations.waste_valuation
          - entities.Store.fields.waste_cost_cents_mtd
          - entities.WasteLog
        distinguishing_aspect: |
          A partial write-off is a self-loop, not an exit: discarding 10 of 40 leaves the batch HOLDING with
          remaining 30 / discarded 10, appends one WasteLog valued 400 food-cost and 1990 retail, adds only
          the FOOD-COST 400 to Store.waste_cost_cents_mtd, and leaves hot_case_slots_used at 1 because the
          batch still occupies its slot. An implementation that posts the retail value to the store ledger
          reports 1990, and one that frees the slot on any discard reports 0.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T06:00:00Z; one pretzel batch of 40 baked and pulled, HOLDING in slot 1"
            - "batch version is 3 after create/bake/pull"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:00:00Z" }
              as: ChainAdmin
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: true }
              as: ChainAdmin
              captures: { store_id: $.data.id }
            - call: "POST /stores/${store_id}/holding-units"
              payload: { unit_code: "BC-1", unit_type: "BAKERY_CASE", min_temp_f: 135, max_temp_f: 185, slot_count: 3 }
              as: StoreManager
              captures: { unit_id: $.data.id }
            - call: "POST /menu-items"
              payload: { sku: "PRETZEL-SOFT", name: "Soft Pretzel", station: "BAKERY", fulfillment_mode: "PAR_BAKED_CASE", base_price_cents: 199, unit_food_cost_cents: 40, bake_minutes: 25, hold_minutes: 240, valid_dayparts: ["BREAKFAST", "LUNCH"], is_catering_eligible: true }
              as: ChainAdmin
              captures: { pretzel_id: $.data.id }
            - call: "POST /production-batches"
              payload: { store_id: "${store_id}", menu_item_id: "${pretzel_id}", holding_unit_id: "${unit_id}", slot_index: 1, planned_qty: 40, bake_start_at: "2026-08-01T06:00:00Z" }
              as: KitchenAssociate
              captures: { batch_id: $.data.id }
            - call: "POST /production-batches/${batch_id}/bake"
              payload: {}
              as: KitchenAssociate
            - call: "POST /production-batches/${batch_id}/pull"
              payload: {}
              as: KitchenAssociate
              captures: { b_v: $.data.version }
          trigger:
            - call: "POST /production-batches/${batch_id}/discard"
              payload: { qty: 10, reason: "HOLD_EXPIRED", expected_batch_version: "${b_v}" }
              as: KitchenAssociate
              as_user_id: "assoc-1"
              captures: { s: $.data.status, rem: $.data.remaining_qty, disc: $.data.discarded_qty }
          assert:
            - "HTTP status == 200"
            - "${s} == HOLDING"
            - "${rem} == 30"
            - "${disc} == 10"
            - "ProductionBatch.${batch_id}.baked_qty == 40"
            - "ProductionBatch.${batch_id}.reserved_qty == 0"
            - "GET /production-batches/${batch_id}/waste-logs -> total_count == 1"
            - "GET /production-batches/${batch_id}/waste-logs -> data[0].qty == 10"
            - "GET /production-batches/${batch_id}/waste-logs -> data[0].reason == HOLD_EXPIRED"
            - "GET /production-batches/${batch_id}/waste-logs -> data[0].food_cost_cents == 400"
            - "GET /production-batches/${batch_id}/waste-logs -> data[0].retail_value_cents == 1990"
            - "GET /production-batches/${batch_id}/waste-logs -> data[0].daypart_epoch == 0"
            - "Store.${store_id}.waste_cost_cents_mtd == 400"
            - "Store.${store_id}.hot_case_slots_used == 1"
            - "GET /stores/${store_id}/readiness -> retail_waste_exposure_cents == 1990"

      - name: daypart_sweep_spares_a_holding_batch_that_still_has_reserved_units
        claim_type: conditional_cascade
        grounds:
          - state_machines.ProductionBatch.HOLDING_to_DISCARDED
          - endpoints[POST /stores/{id}/daypart-transitions]
          - entities.ProductionBatch.fields.reserved_qty
        distinguishing_aspect: |
          The sweep is conditional on reserved_qty == 0. This batch satisfies BOTH sweep triggers - its hold
          expired at 10:00 and the pretzel is BREAKFAST-only so the LUNCH menu excludes it - yet 12 units are
          reserved to a PLACED order, so it must survive as HOLDING with remaining 28 / discarded 0, no
          WasteLog, and Store.hot_case_slots_used still 1. An unconditional sweep would strand a placed order.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T06:00:00Z, store in BREAKFAST with a PUBLISHED BREAKFAST plan for 2026-08-01"
            - "the pretzel item is BREAKFAST-only; one batch of 40 pulled at 06:00 with hold_expires_at 10:00"
            - "one anonymous TOUCHSCREEN order with a 12-unit pretzel line plus a coffee line is PLACED, reserving 12 units"
            - "the clock is then advanced to 2026-08-01T11:00:00Z so the LUNCH transition is due"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:00:00Z" }
              as: ChainAdmin
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: true }
              as: ChainAdmin
              captures: { store_id: $.data.id, st_v: $.data.version }
            - call: "POST /stores/${store_id}/staffing-plans"
              payload: { service_date: "2026-08-01", daypart: "BREAKFAST", forecast_txn_count: 300, mto_share_bp: 5000, expected_store_version: "${st_v}" }
              as: StoreManager
              captures: { plan_id: $.data.id }
            - call: "POST /staffing-plans/${plan_id}/publish"
              payload: {}
              as: StoreManager
            - call: "POST /stores/${store_id}/holding-units"
              payload: { unit_code: "BC-1", unit_type: "BAKERY_CASE", min_temp_f: 135, max_temp_f: 185, slot_count: 3 }
              as: StoreManager
              captures: { unit_id: $.data.id }
            - call: "POST /menu-items"
              payload: { sku: "PRETZEL-SOFT", name: "Soft Pretzel", station: "BAKERY", fulfillment_mode: "PAR_BAKED_CASE", base_price_cents: 199, unit_food_cost_cents: 40, bake_minutes: 25, hold_minutes: 240, valid_dayparts: ["BREAKFAST"], is_catering_eligible: true }
              as: ChainAdmin
              captures: { pretzel_id: $.data.id }
            - call: "POST /menu-items"
              payload: { sku: "COFFEE-LG", name: "Large Coffee", station: "BEVERAGE", fulfillment_mode: "MADE_TO_ORDER", base_price_cents: 249, unit_food_cost_cents: 40, prep_seconds: 45, valid_dayparts: ["BREAKFAST", "LUNCH", "DINNER", "OVERNIGHT"], included_premium_count: 0, is_catering_eligible: true }
              as: ChainAdmin
              captures: { coffee_id: $.data.id }
            - call: "POST /production-batches"
              payload: { store_id: "${store_id}", menu_item_id: "${pretzel_id}", holding_unit_id: "${unit_id}", slot_index: 1, planned_qty: 40, bake_start_at: "2026-08-01T06:00:00Z" }
              as: KitchenAssociate
              captures: { batch_id: $.data.id }
            - call: "POST /production-batches/${batch_id}/bake"
              payload: {}
              as: KitchenAssociate
            - call: "POST /production-batches/${batch_id}/pull"
              payload: {}
              as: KitchenAssociate
            - call: "POST /orders"
              payload: { store_id: "${store_id}", channel: "TOUCHSCREEN" }
              as: StoreTerminal
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { menu_item_id: "${pretzel_id}", qty: 12 }
              as: StoreTerminal
              captures: { pretzel_line: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { menu_item_id: "${coffee_id}", qty: 1 }
              as: StoreTerminal
            - call: "POST /orders/${order_id}/place"
              payload: {}
              as: StoreTerminal
              captures: { ps: $.data.production_status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:00:00Z" }
              as: ChainAdmin
          trigger:
            - call: "POST /stores/${store_id}/daypart-transitions"
              payload: { to_daypart: "LUNCH" }
              as: StoreManager
              captures: { dp: $.data.current_daypart, epoch: $.data.daypart_epoch, waste: $.data.waste_cost_cents_mtd, slots: $.data.hot_case_slots_used }
          assert:
            - "${ps} == PLACED"
            - "${dp} == LUNCH"
            - "${epoch} == 1"
            - "${waste} == 0"
            - "${slots} == 1"
            - "ProductionBatch.${batch_id}.status == HOLDING"
            - "ProductionBatch.${batch_id}.remaining_qty == 28"
            - "ProductionBatch.${batch_id}.reserved_qty == 12"
            - "ProductionBatch.${batch_id}.discarded_qty == 0"
            - "OrderLine.${pretzel_line}.reserved_qty == 12"
            - "OrderLine.${pretzel_line}.fulfillment_batch_id == ${batch_id}"
            - "GET /production-batches/${batch_id}/waste-logs -> total_count == 0"

      - name: order_two_axes_move_independently_corner
        claim_type: parallel
        grounds:
          - state_machines.Order.production_status
          - state_machines.Order.settlement_status
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: "non_linear_state_machine / order_production_and_settlement_axes_advance_independently"
          rationale: "The named SS1.8 instance already drives both axes on one row and asserts the combined state after each step."

      - name: kitchen_ticket_and_batch_cycles_reenter_earlier_states_corner
        claim_type: cyclic
        grounds:
          - state_machines.KitchenTicket.DONE_to_IN_PROGRESS
          - state_machines.ProductionBatch.HOLDING_to_BAKING
        excluded_because:
          difficulty_instance: "non_linear_state_machine / kitchen_ticket_done_reopens_and_pulls_order_back_from_assembled"
          rationale: "Ticket rework and the batch top-off cycle are both asserted there and in production_batch_top_off_bake_cycles_holding_back_to_baking."

      - name: impairment_cascades_down_to_every_holding_batch_corner
        claim_type: cascade_down
        grounds:
          - state_machines.HoldingUnit.OPERATIONAL_to_IMPAIRED
          - state_machines.ProductionBatch.HOLDING_to_DISCARDED
        excluded_because:
          difficulty_instance: "transitive_cascade / out_of_range_temperature_log_cascades_five_levels_to_store_ledger"
          rationale: "The named SS1.8 instance sweeps two sibling batches from one temperature log and reconciles the store ledger at the far end."

      - name: void_reverses_all_placement_side_effects_corner
        claim_type: compensation
        grounds:
          - state_machines.Order.PLACED_to_VOIDED
        excluded_because:
          difficulty_instance: "compensating_invariant / voiding_a_placed_order_restores_the_batch_quantity_ledger_exactly"
          rationale: "Column-by-column reversal of the reservation ledger and the ticket sweep are asserted there."

      - name: ticket_start_guarded_by_parent_order_state_corner
        claim_type: guarded transitions
        grounds:
          - state_machines.KitchenTicket.QUEUED_to_IN_PROGRESS
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / ticket_start_is_gated_on_the_owning_orders_settlement_axis"
          rationale: "The cross-entity guard is the whole subject of the named SS1.8 instance."

  # =========================================================================
  - section: calculations
    instances:

      - name: line_gross_pricing_with_three_premium_units_computes_2818
        claim_type: correct_result
        grounds:
          - calculations.line_gross_pricing
          - entities.OrderLine.fields.line_gross_cents
          - entities.MenuItem.fields.included_premium_count
        distinguishing_aspect: |
          Every term of the formula is exercised at once and the surcharge is PER UNIT, not per line:
          unit_price 899 + 60 + 2*150 = 1259; premium_units 3 minus included 1 gives 2 chargeable premiums
          so premium_surcharge_cents = 75*2 = 150; line_gross = (1259 + 150) * qty 2 = 2818. Charging the
          surcharge once per line yields 2668, and forgetting included_premium_count yields 2968.
        test_recipe:
          setup:
            - "store WAWA-0101 on the default clock 2026-08-01T00:00:00Z, current_daypart BREAKFAST"
            - "hoagie 899c with included_premium_count 1, plus premium modifiers EXTRA-PROV 60c (max 1) and EXTRA-BACON 150c (max 2)"
            - "one DRAFT anonymous TOUCHSCREEN order"
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: true }
              as: ChainAdmin
              captures: { store_id: $.data.id }
            - call: "POST /menu-items"
              payload: { sku: "HOAGIE-ITAL", name: "Italian Hoagie", station: "SANDWICH", fulfillment_mode: "MADE_TO_ORDER", base_price_cents: 899, unit_food_cost_cents: 300, prep_seconds: 180, valid_dayparts: ["BREAKFAST", "LUNCH", "DINNER", "OVERNIGHT"], included_premium_count: 1, is_catering_eligible: true }
              as: ChainAdmin
              captures: { hoagie_id: $.data.id }
            - call: "POST /menu-items/${hoagie_id}/modifier-options"
              payload: { code: "EXTRA-PROV", modifier_class: "CHEESE", price_delta_cents: 60, is_premium: true, max_qty: 1 }
              as: ChainAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /menu-items/${hoagie_id}/modifier-options"
              payload: { code: "EXTRA-BACON", modifier_class: "PROTEIN", price_delta_cents: 150, is_premium: true, max_qty: 2 }
              as: ChainAdmin
              captures: { bacon_id: $.data.id }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", channel: "TOUCHSCREEN" }
              as: StoreTerminal
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /orders/${order_id}/lines"
              payload: { menu_item_id: "${hoagie_id}", qty: 2, modifiers: [{ modifier_option_id: "${prov_id}", qty: 1 }, { modifier_option_id: "${bacon_id}", qty: 2 }] }
              as: StoreTerminal
              captures: { line_id: $.data.id, unit: $.data.unit_price_cents, surch: $.data.premium_surcharge_cents, gross: $.data.line_gross_cents, stn: $.data.station }
          assert:
            - "HTTP status == 201"
            - "${unit} == 1259"
            - "${surch} == 150"
            - "${gross} == 2818"
            - "${stn} == SANDWICH"
            - "OrderLine.${line_id}.line_discount_cents == 0"
            - "OrderLine.${line_id}.line_net_cents == 0"
            - "Order.${order_id}.subtotal_gross_cents == 2818"
            - "Order.${order_id}.promo_discount_cents == 0"
            - "Order.${order_id}.total_cents == 0"

      - name: promotion_selection_ignores_a_suspended_rule
        claim_type: input_set_filtering
        grounds:
          - calculations.promotion_selection
          - entities.PromotionRule.fields.status
          - endpoints[POST /promotion-rules/{id}/suspend]
        distinguishing_aspect: |
          Only ACTIVE rules enter the candidate set. The 900-cent bundle would have won on discount size,
          but it is SUSPENDED, so the 200-cent bundle must be applied instead - promo_discount_cents 200 and
          applied_promotion_id pointing at the small rule. Selecting on discount size without filtering
          status yields 900 and the wrong rule id.
        test_recipe:
          setup:
            - "logical clock 2026-08-01T11:00:00Z; store transitioned to LUNCH with a PUBLISHED LUNCH plan for 2026-08-01"
            - "two LUNCH DAYPART_BUNDLE rules: BIG-BUNDLE 900c off (then suspended) and SMALL-BUNDLE 200c off (left ACTIVE)"
            - "one DRAFT anonymous TOUCHSCREEN order with a single hoagie line, subtotal 899"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:00:00Z" }
              as: ChainAdmin
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: true }
              as: ChainAdmin
              captures: { store_id: $.data.id }
            - call: "POST /stores/${store_id}/daypart-transitions"
              payload: { to_daypart: "LUNCH" }
              as: StoreManager
            - call: "GET /stores/${store_id}"
              payload: {}
              as: StoreManager
