      - name: incentive_expiry_and_cancel_recompute_stacks
        claim_type: scheduled_state_derivation
        grounds: [state_machines.Incentive, entities.Incentive.fields.status]
        distinguishing_aspect: "Incentive status is clock-derived: SCHEDULED before window_start, ACTIVE inside, EXPIRED after window_end; home net price follows each derivation, and manual cancel on an ACTIVE incentive removes it immediately."
        test_recipe:
          setup: ["home H1; incentive window 2026-09-10..2026-09-20; clock moved through the window"]
          setup_api_calls:
            - { call: "POST /land-parcels", payload: {name: "Parcel A", market_code: "DFW", acres: 100.0}, as: LAND_MANAGER, captures: {p1: $.data.id} }
