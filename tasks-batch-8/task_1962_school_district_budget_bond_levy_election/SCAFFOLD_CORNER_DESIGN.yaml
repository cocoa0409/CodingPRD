            - call: "POST /district/budget-versions/${bv1}/staffing-allocations"
              payload: { grade_band: "ELEMENTARY", enrollment_projection_id: "${ep}", allocated_fte: 3.0 }
              as: BudgetAnalyst
              captures: { sa: $.data.id }
            - call: "POST /district/staffing-allocations/${sa}/positions"
              payload: { title: "Teacher 1", fte: 1.0, base_salary: 64000 }
              as: BudgetAnalyst
              captures: { p: $.data.id }
            - call: "POST /district/budget-versions/${bv1}/propose"
              as: BoardClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: BoardClerk
            - call: "POST /district/budget-versions/${bv1}/hearings"
              payload: { venue: "BOARD_ROOM", hearing_date: "2027-03-20" }
              as: BoardClerk
              captures: { h1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-20T09:00:00Z" }
              as: BoardClerk
            - call: "POST /district/public-hearings/${h1}/hold"
              as: BoardClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-27T09:00:00Z" }
              as: BoardClerk
            - call: "POST /district/budget-versions/${bv1}/adopt"
              as: BoardClerk
            - call: "GET /district/fiscal-years/${fy}"
              as: BudgetAnalyst
              captures: { fy_v2: $.data.version }
          trigger:
            - call: "POST /district/fiscal-years/${fy}/budget-versions"
              payload: { expected_fiscal_year_version: "${fy_v2}" }
              as: BudgetAnalyst
              captures: { bv2: $.data.id, lbl2: $.data.version_label }
            - call: "GET /district/budget-versions/${bv1}"
              as: Auditor
              captures: { bv1_st: $.data.status }
            - call: "GET /district/staffing-allocations/${sa}"
              as: Auditor
              captures: { sa_st: $.data.status }
            - call: "GET /district/staffing-allocations/${sa}/positions"
              as: Auditor
              captures: { p_st: "$.data[0].status" }
            - call: "GET /district/fiscal-years/${fy}"
              as: Auditor
              captures: { fte_total: $.data.authorized_fte_total, open_count: $.data.open_position_count }
          assert:
            - "New version created as ${bv2} with version_label == v2"
            - "Cascade link 1: BudgetVersion.${bv1} status == SUPERSEDED"
            - "Cascade link 2: StaffingAllocation.${sa} status == SUPERSEDED (caused by the supersede)"
            - "Cascade link 3: Position.${p} status == ELIMINATED (caused by the allocation supersede)"
            - "FiscalYear.authorized_fte_total == 0 and open_position_count == 0 after recomputation"

      - name: adoption_cascade_full_chain
        claim_type: side_effect_execution
        grounds: [state_machines.BudgetVersion.HEARING_HELD_to_ADOPTED]
        excluded_because:
          difficulty_instance: adoption_cascade_version_to_allocation_to_position_to_fiscal_year
          rationale: "The adopt-triggered allocation-authorization and position-opening cascade is asserted hop-by-hop in the named §1.8 instance."

      - name: return_to_draft_cancels_pending_hearings
        claim_type: side_effect_execution
        grounds: [state_machines.PublicHearing.NOTICE_PUBLISHED_to_CANCELLED]
        excluded_because:
          difficulty_instance: budget_version_propose_return_revision_loop
          rationale: "Hearing cancellation on return-to-draft is asserted in the named §1.8 instance (h3 becomes CANCELLED)."

      - name: hearing_hold_moves_budget_version_to_hearing_held
        claim_type: guarded_transition
        grounds: [state_machines.PublicHearing.NOTICE_PUBLISHED_to_HELD, state_machines.BudgetVersion.PROPOSED_to_HEARING_HELD]
        excluded_because:
          difficulty_instance: budget_adoption_gated_by_hearing_held
          rationale: "The cross-entity hold -> HEARING_HELD side effect is asserted in the named §1.8 instance."

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: weighted_pupils_round_half_up_at_fractional_boundary
        claim_type: precision
        grounds: [calculations.weighted_pupil_projection]
        distinguishing_aspect: "HIGH band weight 1.15 on 1001 pupils gives 1151.15 -> round_half_up to integer yields 1151 (fractional .15 rounds down); rounding is half-up at the first decimal."
        test_recipe:
          setup: ["FY2028 OPEN"]
          setup_api_calls:
            - call: "POST /district/fiscal-years"
              payload: { label: "FY2028", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000, fte_ceiling: 200 }
              as: BusinessManager
              captures: { fy: $.data.id }
            - call: "POST /district/fiscal-years/${fy}/open"
              as: BusinessManager
          trigger:
            - call: "POST /district/fiscal-years/${fy}/enrollment-projections"
              payload: { grade_band: "HIGH", projected_pupils: 1001 }
              as: BudgetAnalyst
              captures: { ep: $.data.id, w: $.data.weighted_pupils_projected }
          assert:
            - "weighted_pupils_projected == 1151 (1001 * 1.15 = 1151.15, round_half_up to integer)"

      - name: state_aid_zero_floor
        claim_type: correct_result
        grounds: [calculations.state_aid_estimate]
        excluded_because:
          difficulty_instance: tax_rate_per_fund_rounding_then_sum
          rationale: "The zero floor max(0, 7600*100 - 0.023*480M) == 0.00 is asserted in the named §1.8 instance."

      - name: position_headroom_exact_boundary_allowed_over_rejected
        claim_type: correct_result
        grounds: [calculations.position_headroom, "errors[ERR_POSITION_FTE_EXCEEDED]"]
        distinguishing_aspect: "Position control is an inclusive ceiling: with allocated_fte 1.0, a 1.0-FTE position consumes the headroom exactly (allowed); a further 0.5-FTE position exceeds it by 0.5 and is rejected."
        test_recipe:
          setup: ["FY2028 OPEN; ELEMENTARY projection 1200; budget version with ELEMENTARY allocation allocated_fte 1.0"]
          setup_api_calls:
            - call: "POST /district/fiscal-years"
              payload: { label: "FY2028", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000, fte_ceiling: 200 }
              as: BusinessManager
              captures: { fy: $.data.id }
            - call: "POST /district/fiscal-years/${fy}/open"
              as: BusinessManager
              captures: { fy_v: $.data.version }
            - call: "POST /district/fiscal-years/${fy}/enrollment-projections"
              payload: { grade_band: "ELEMENTARY", projected_pupils: 1200 }
              as: BudgetAnalyst
              captures: { ep: $.data.id }
            - call: "POST /district/fiscal-years/${fy}/budget-versions"
              payload: { expected_fiscal_year_version: "${fy_v}" }
              as: BudgetAnalyst
              captures: { bv: $.data.id }
            - call: "POST /district/budget-versions/${bv}/staffing-allocations"
              payload: { grade_band: "ELEMENTARY", enrollment_projection_id: "${ep}", allocated_fte: 1.0 }
              as: BudgetAnalyst
              captures: { sa: $.data.id }
          trigger:
            - call: "POST /district/staffing-allocations/${sa}/positions"
              payload: { title: "Teacher 1", fte: 1.0, base_salary: 64000 }
              as: BudgetAnalyst
              captures: { p1: $.data.id }
            - call: "POST /district/staffing-allocations/${sa}/positions"
              payload: { title: "Aide 1", fte: 0.5, base_salary: 32000 }
              as: BudgetAnalyst
              captures: { err: $.data.error_id }
            - call: "GET /district/staffing-allocations/${sa}"
              as: Auditor
              captures: { used: $.data.positions_fte_total }
          assert:
            - "First position (fte 1.0 == headroom 1.0) is ALLOWED (inclusive boundary)"
            - "Second position rejected: ${err} == ERR_POSITION_FTE_EXCEEDED (0.5 > remaining 0.0)"
            - "StaffingAllocation.${sa}.positions_fte_total == 1.0 after the rejected attempt (no partial mutation)"

      - name: fte_ceiling_aggregate_boundary_across_allocations
        claim_type: constants_applied
        grounds: [calculations.position_control_ceiling, "errors[ERR_FTE_CEILING_EXCEEDED]"]
        distinguishing_aspect: "The position-control ceiling is an aggregate over the whole budget version: allocations 60.0 + 36.5 = 96.5 fit a ceiling of 130, but adding 40.0 (total 136.5 > 130) is rejected; on a second fiscal year with ceiling 136.5 the identical set is allowed exactly at the boundary."
        test_recipe:
          setup: ["FY-C (label FY2028, fte_ceiling 130) and FY-D (label FY2029, fte_ceiling 136.5), both OPEN, each with projections 1200/800/1000 and one budget version"]
          setup_api_calls:
            - call: "POST /district/fiscal-years"
              payload: { label: "FY2028", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000, fte_ceiling: 130 }
              as: BusinessManager
              captures: { fyc: $.data.id }
            - call: "POST /district/fiscal-years/${fyc}/open"
              as: BusinessManager
              captures: { fyc_v: $.data.version }
            - call: "POST /district/fiscal-years/${fyc}/enrollment-projections"
              payload: { grade_band: "ELEMENTARY", projected_pupils: 1200 }
              as: BudgetAnalyst
              captures: { epc_e: $.data.id }
            - call: "POST /district/fiscal-years/${fyc}/enrollment-projections"
              payload: { grade_band: "MIDDLE", projected_pupils: 800 }
              as: BudgetAnalyst
              captures: { epc_m: $.data.id }
            - call: "POST /district/fiscal-years/${fyc}/enrollment-projections"
              payload: { grade_band: "HIGH", projected_pupils: 1000 }
              as: BudgetAnalyst
              captures: { epc_h: $.data.id }
            - call: "POST /district/fiscal-years/${fyc}/budget-versions"
              payload: { expected_fiscal_year_version: "${fyc_v}" }
              as: BudgetAnalyst
              captures: { bvc: $.data.id }
            - call: "POST /district/fiscal-years"
              payload: { label: "FY2029", start_date: "2028-07-01", end_date: "2029-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000, fte_ceiling: 136.5 }
              as: BusinessManager
              captures: { fyd: $.data.id }
            - call: "POST /district/fiscal-years/${fyd}/open"
              as: BusinessManager
              captures: { fyd_v: $.data.version }
            - call: "POST /district/fiscal-years/${fyd}/enrollment-projections"
              payload: { grade_band: "ELEMENTARY", projected_pupils: 1200 }
              as: BudgetAnalyst
              captures: { epd_e: $.data.id }
            - call: "POST /district/fiscal-years/${fyd}/enrollment-projections"
              payload: { grade_band: "MIDDLE", projected_pupils: 800 }
              as: BudgetAnalyst
              captures: { epd_m: $.data.id }
            - call: "POST /district/fiscal-years/${fyd}/enrollment-projections"
              payload: { grade_band: "HIGH", projected_pupils: 1000 }
              as: BudgetAnalyst
              captures: { epd_h: $.data.id }
            - call: "POST /district/fiscal-years/${fyd}/budget-versions"
              payload: { expected_fiscal_year_version: "${fyd_v}" }
              as: BudgetAnalyst
              captures: { bvd: $.data.id }
          trigger:
            - call: "POST /district/budget-versions/${bvc}/staffing-allocations"
              payload: { grade_band: "ELEMENTARY", enrollment_projection_id: "${epc_e}", allocated_fte: 60.0 }
              as: BudgetAnalyst
            - call: "POST /district/budget-versions/${bvc}/staffing-allocations"
              payload: { grade_band: "MIDDLE", enrollment_projection_id: "${epc_m}", allocated_fte: 36.5 }
              as: BudgetAnalyst
            - call: "POST /district/budget-versions/${bvc}/staffing-allocations"
              payload: { grade_band: "HIGH", enrollment_projection_id: "${epc_h}", allocated_fte: 40.0 }
              as: BudgetAnalyst
              captures: { err_c: $.data.error_id }
            - call: "POST /district/budget-versions/${bvd}/staffing-allocations"
              payload: { grade_band: "ELEMENTARY", enrollment_projection_id: "${epd_e}", allocated_fte: 60.0 }
              as: BudgetAnalyst
            - call: "POST /district/budget-versions/${bvd}/staffing-allocations"
              payload: { grade_band: "MIDDLE", enrollment_projection_id: "${epd_m}", allocated_fte: 36.5 }
              as: BudgetAnalyst
            - call: "POST /district/budget-versions/${bvd}/staffing-allocations"
              payload: { grade_band: "HIGH", enrollment_projection_id: "${epd_h}", allocated_fte: 40.0 }
              as: BudgetAnalyst
              captures: { sa_d: $.data.id }
          assert:
            - "FY-C (ceiling 130): the HIGH allocation is rejected — ${err_c} == ERR_FTE_CEILING_EXCEEDED (60.0 + 36.5 + 40.0 = 136.5 > 130)"
            - "FY-D (ceiling 136.5): the identical three allocations succeed — sum 136.5 == ceiling is ALLOWED (strictly-greater check)"
            - "Individual allocations never exceeded their formula required_fte; only the aggregate ceiling discriminates"

      - name: ptell_cpi_capped_at_five_percent
        claim_type: constants_applied
        grounds: [calculations.ptell_capped_levy]
        distinguishing_aspect: "PTELL uses min(cpi_rate, 0.05): with cpi_rate 0.07 the cap is prior_extension 8,000,000 x 1.05 = 8,400,000 (not x 1.07), so a request of 8,500,000 is capped to 8,400,000."
        test_recipe:
          setup: ["FY2028 OPEN with prior_year_extension 8,000,000; one ELEMENTARY projection 100; budget version"]
          setup_api_calls:
            - call: "POST /district/fiscal-years"
              payload: { label: "FY2028", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 8000000, outstanding_debt_principal: 4500000, fte_ceiling: 200 }
              as: BusinessManager
              captures: { fy: $.data.id }
            - call: "POST /district/fiscal-years/${fy}/open"
              as: BusinessManager
              captures: { fy_v: $.data.version }
            - call: "POST /district/fiscal-years/${fy}/enrollment-projections"
              payload: { grade_band: "ELEMENTARY", projected_pupils: 100 }
              as: BudgetAnalyst
            - call: "POST /district/fiscal-years/${fy}/budget-versions"
              payload: { expected_fiscal_year_version: "${fy_v}" }
              as: BudgetAnalyst
              captures: { bv: $.data.id }
          trigger:
            - call: "POST /district/budget-versions/${bv}/revenue-estimates"
              payload: { operating_levy_request: 8500000, debt_service_levy: 0, other_revenue: 0, cpi_rate: 0.07 }
              as: BusinessManager
              captures: { re: $.data.id, capped: $.data.capped_operating_levy }
          assert:
            - "capped_operating_levy == 8400000.00 (8,000,000 x 1.05 — the CPI is clamped at PTELL_CPI_MAX 0.05 before compounding)"
            - "operating_rate == 1.7500 (8,400,000 / 480,000,000 x 100)"

      - name: operating_rate_cap_exact_boundary
        claim_type: precision
        grounds: [calculations.ptell_capped_levy, "errors[ERR_TAX_RATE_CAP_EXCEEDED]"]
        distinguishing_aspect: "The 1.8400 operating rate cap is evaluated on the ROUNDED per-fund rate with an inclusive boundary: levy 8,832,000 on eav_prior 480,000,000 yields exactly 1.8400 and is allowed; levy 9,000,000 yields 1.8750 and is rejected."
        test_recipe:
          setup: ["FY2028 OPEN (prior_year_extension 9,000,000 so PTELL cap 9,306,000 does not interfere); one ELEMENTARY projection 100; two budget versions v1 and v2"]
          setup_api_calls:
            - call: "POST /district/fiscal-years"
              payload: { label: "FY2028", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000, fte_ceiling: 200 }
              as: BusinessManager
              captures: { fy: $.data.id }
            - call: "POST /district/fiscal-years/${fy}/open"
              as: BusinessManager
              captures: { fy_v: $.data.version }
            - call: "POST /district/fiscal-years/${fy}/enrollment-projections"
              payload: { grade_band: "ELEMENTARY", projected_pupils: 100 }
              as: BudgetAnalyst
            - call: "POST /district/fiscal-years/${fy}/budget-versions"
              payload: { expected_fiscal_year_version: "${fy_v}" }
              as: BudgetAnalyst
              captures: { bv1: $.data.id }
            - call: "GET /district/fiscal-years/${fy}"
              as: BudgetAnalyst
              captures: { fy_v2: $.data.version }
            - call: "POST /district/fiscal-years/${fy}/budget-versions"
              payload: { expected_fiscal_year_version: "${fy_v2}" }
              as: BudgetAnalyst
              captures: { bv2: $.data.id }
          trigger:
            - call: "POST /district/budget-versions/${bv1}/revenue-estimates"
              payload: { operating_levy_request: 8832000, debt_service_levy: 0, other_revenue: 0, cpi_rate: 0.034 }
              as: BusinessManager
              captures: { re1: $.data.id, r1: $.data.operating_rate }
            - call: "POST /district/budget-versions/${bv2}/revenue-estimates"
              payload: { operating_levy_request: 9000000, debt_service_levy: 0, other_revenue: 0, cpi_rate: 0.034 }
              as: BusinessManager
              captures: { err: $.data.error_id }
          assert:
            - "Levy 8,832,000 -> operating_rate == 1.8400 exactly and the estimate is created (inclusive cap boundary)"
            - "Levy 9,000,000 -> ${err} == ERR_TAX_RATE_CAP_EXCEEDED (rounded rate 1.8750 > 1.8400)"
            - "No revenue estimate is persisted for v2 (rejection is atomic)"

      - name: canvass_tie_votes_fail_the_measure
        claim_type: correct_result
        grounds: [calculations.canvass_result_determination]
        distinguishing_aspect: "Passage requires a STRICT majority: yes_votes == no_votes (5000/5000) fails the measure and the proposal, proving the > (not >=) comparison."
        test_recipe:
          setup: ["FY2028 OPEN; proposal 1,000,000 with one project, certified measure on the 2027-11-02 election; clock at 2027-11-03"]
          setup_api_calls:
            - call: "POST /district/fiscal-years"
              payload: { label: "FY2028", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000, fte_ceiling: 200 }
              as: BusinessManager
              captures: { fy: $.data.id }
            - call: "POST /district/fiscal-years/${fy}/open"
              as: BusinessManager
            - call: "POST /district/fiscal-years/${fy}/bond-proposals"
              payload: { question_title: "Bond Question A", purpose: "Roof", total_amount: 1000000 }
              as: BoardClerk
              captures: { bp: $.data.id }
            - call: "POST /district/bond-proposals/${bp}/projects"
              payload: { name: "Roof", site_code: "HS-01", estimated_cost: 1000000, construction_start: "2028-06-01", construction_end: "2028-08-15", priority_rank: 1 }
              as: BoardClerk
            - call: "POST /district/bond-proposals/${bp}/approve-board"
              as: BoardClerk
            - call: "POST /district/elections"
              payload: { election_date: "2027-11-02", election_type: "REGULAR" }
              as: BoardClerk
              captures: { el: $.data.id }
            - call: "POST /district/elections/${el}/ballot-measures"
              payload: { bond_proposal_id: "${bp}", ballot_language: "Shall the District issue bonds for roof repairs" }
              as: BoardClerk
              as_user_id: "clerk-drafter-1"
              captures: { bm: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-08-15T00:00:00Z" }
              as: BoardClerk
            - call: "POST /district/ballot-measures/${bm}/certify"
              as: BoardClerk
              as_user_id: "clerk-certifier-2"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-11-03T00:00:00Z" }
              as: BoardClerk
          trigger:
            - call: "POST /district/elections/${el}/canvass"
              payload: { results: [ { ballot_measure_id: "${bm}", yes_votes: 5000, no_votes: 5000 } ] }
              as: BoardClerk
            - call: "GET /district/ballot-measures/${bm}"
              as: Auditor
              captures: { bm_st: $.data.status }
            - call: "GET /district/bond-proposals/${bp}"
              as: Auditor
              captures: { bp_st: $.data.status }
          assert:
            - "BallotMeasure.${bm} status == FAILED (5000 > 5000 is false — ties fail)"
            - "BondProposal.${bp} status == FAILED and passed_at == null"
            - "The proposal's project remains PLANNED with authorized_amount == 0 (no cascade on failure)"

      - name: sale_remaining_authorization_exact_boundary
        claim_type: precision
        grounds: [calculations.bond_sale_proceeds, "errors[ERR_SALE_EXCEEDS_REMAINING_AUTHORIZATION]"]
        distinguishing_aspect: "Remaining authorization is an inclusive ceiling consumed by PLANNED and CLOSED sales alike: after a 10,000,000 planned sale against an 18,000,000 proposal, a second sale at exactly 8,000,000 is allowed; a further 0.01 is rejected."
        test_recipe:
          setup: ["FY2028 OPEN; proposal 18,000,000 PASSED at the 2027-11-02 election; sale 2027-A PLANNED with par 10,000,000"]
          setup_api_calls:
            - call: "POST /district/fiscal-years"
              payload: { label: "FY2028", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000, fte_ceiling: 200 }
              as: BusinessManager
              captures: { fy: $.data.id }
            - call: "POST /district/fiscal-years/${fy}/open"
              as: BusinessManager
            - call: "POST /district/fiscal-years/${fy}/bond-proposals"
              payload: { question_title: "Bond Question A", purpose: "Capital improvements", total_amount: 18000000 }
              as: BoardClerk
              captures: { bp: $.data.id }
            - call: "POST /district/bond-proposals/${bp}/projects"
              payload: { name: "Roof Replacement", site_code: "HS-01", estimated_cost: 6000000, construction_start: "2028-06-01", construction_end: "2028-08-15", priority_rank: 1 }
              as: BoardClerk
            - call: "POST /district/bond-proposals/${bp}/approve-board"
              as: BoardClerk
            - call: "POST /district/elections"
              payload: { election_date: "2027-11-02", election_type: "REGULAR" }
              as: BoardClerk
              captures: { el: $.data.id }
            - call: "POST /district/elections/${el}/ballot-measures"
              payload: { bond_proposal_id: "${bp}", ballot_language: "Shall the District issue bonds for capital improvements" }
              as: BoardClerk
              as_user_id: "clerk-drafter-1"
              captures: { bm: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-08-15T00:00:00Z" }
              as: BoardClerk
            - call: "POST /district/ballot-measures/${bm}/certify"
              as: BoardClerk
              as_user_id: "clerk-certifier-2"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-11-03T00:00:00Z" }
              as: BoardClerk
            - call: "POST /district/elections/${el}/canvass"
              payload: { results: [ { ballot_measure_id: "${bm}", yes_votes: 5200, no_votes: 4800 } ] }
              as: BoardClerk
            - call: "GET /district/bond-proposals/${bp}"
              as: DistrictTreasurer
              captures: { bp_v: $.data.version }
