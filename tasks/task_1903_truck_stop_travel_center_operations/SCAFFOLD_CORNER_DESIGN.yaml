      - name: validation_suspended_member_redeem_rejected
        claim_type: conditional_validation
        grounds:
          - "validations[priority=14]"
          - "errors[ERR_MEMBER_NOT_ACTIVE]"
          - "state_machines.LoyaltyMember.ACTIVE_to_SUSPENDED"
        distinguishing_aspect: "Member status gates redemption: after suspension, a fuel authorize requesting 100 points fails ERR_MEMBER_NOT_ACTIVE even though the member's 9000-point balance is intact; after reactivation the same request succeeds."
        test_recipe:
          setup: ["Site with diesel price 385, pump, register, OPEN shift; member 9000 pts (no network); clock 2026-08-12T10:00:00Z"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site V15", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id", site_v: "$.data.version" } }
