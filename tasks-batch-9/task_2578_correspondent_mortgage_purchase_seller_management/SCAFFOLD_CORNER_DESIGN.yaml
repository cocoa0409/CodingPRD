            - "Commitment.${c2}.status == PAIRED_OFF with paired_off_amount_cents == 1500000000, available_amount_cents == 0 and Seller.${s1}.fee_receivable_cents == 25000"
            - "Seller.${s1}.open_mandatory_exposure_cents == 1500000000 after the pair-off"
            - "the retried lock ${c3} returns HTTP 201 and the exposure becomes 1600000000"

