  - section: consistency_model
    instances:
      - name: immediate_escrow_visible_same_request
        claim_type: immediate
        grounds: [calculations.escrow_balance, entities.Order.fields.escrow_balance_cents]
        distinguishing_aspect: "Posting a deposit immediately reflects escrow_balance_cents in the very next GET (immediate consistency, no lag)."
        test_recipe:
          setup: ["An order with a RECEIVED deposit 250000."]
          setup_api_calls:
            - call: "POST /title/agencies"
              payload: { name: "Acme Title", remit_split_pct: 0.82 }
              as: Underwriter
              captures: { ag_id: $.data.id }
            - call: "POST /title/orders"
              payload: { agency_id: "${ag_id}", parcel_id: "APN-C41", county: "King", transaction_type: "PURCHASE", sales_price_cents: 25000000, loan_amount_cents: 0 }
              as: Agency
              as_user_id: "${ag_id}"
              captures: { o_id: $.data.id }
            - call: "POST /title/orders/${o_id}/deposits"
              payload: { amount_cents: 250000, source_ref: "WIRE-IN-11" }
              as: Agency
              as_user_id: "${ag_id}"
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /title/deposits/${d_id}/transitions"
