# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Dairy Herd Management (DHIA) — Expert tier
# 9 rules x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: milk_check_advance_vs_final_settlement_diverge
        grounds:
          - calculations.milk_check_settlement
          - state_machines.MilkCheck.PROVISIONAL_to_FINALIZED
          - entities.MilkCheck.fields.advance_paid
          - entities.MilkCheck.fields.gross_settlement
        distinguishing_aspect: |
          On the MilkCheck entity domain, the provisional_advance variant (milk-weight-only,
          advance_paid == 160.00) and the final_settlement variant (full component+SCC+PPD,
          gross_settlement == 251.55) produce different dollar figures for the identical pooled record.
        test_recipe:
          setup:
            - "Herd with one milk_eligible cow (calved 2026-02-01, OPEN lactation) and one test-day record (1000 lbs, 3.8% fat, 3.1% protein, 180k SCC) dated 2026-06-10."
            - "CoopPriceSheet for 2026-06 with fat 2.805, protein 3.515, ops 0.405, ppd 1.205, advance 16.00, hauling 0.85."
            - "A PROVISIONAL MilkCheck opened on that price sheet (advance already paid)."
          setup_api_calls:
            - call: "POST /herds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds"
              payload: { name: "Dual Variant Dairy", federal_order_number: "30" }
              as: HerdManager
              captures: { h_id: $.data.id }
            - call: "POST /herds/animals"
              payload: { herd_id: "${h_id}", ear_tag: "DV-001", birth_date: "2023-01-01" }
              as: HerdManager
              captures: { a_id: $.data.id }
            - call: "POST /herds/breeding-events"
              payload: { animal_id: "${a_id}", service_date: "2026-01-10", sire_code: "S-77" }
              as: Veterinarian
              captures: { be_id: $.data.id }
            - call: "POST /herds/breeding-events/${be_id}/confirm"
              payload: {}
              as: Veterinarian
            - call: "POST /herds/calving-events"
              payload: { animal_id: "${a_id}", breeding_event_id: "${be_id}", calving_date: "2026-02-01" }
              as: HerdManager
              captures: { lact_id: $.data.opened_lactation_id }
            - call: "POST /herds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds/test-day-records"
              payload: { lactation_id: "${lact_id}", test_date: "2026-06-10", milk_weight_lbs: 1000, fat_pct: 3.8, protein_pct: 3.1, scc_thousands: 180 }
              as: ParlorTech
            - call: "POST /herds/coop-price-sheets"
              payload: { herd_id: "${h_id}", settlement_month: "2026-06", fat_price_per_lb: 2.805, protein_price_per_lb: 3.515, other_solids_price_per_lb: 0.405, ppd_per_cwt: 1.205, advance_rate_per_cwt: 16.00, hauling_rate_per_cwt: 0.85 }
              as: CoopSettlementAgent
              captures: { ps_id: $.data.id }
            - call: "POST /herds/milk-checks"
              payload: { herd_id: "${h_id}", price_sheet_id: "${ps_id}" }
              as: CoopSettlementAgent
              captures: { mc_id: $.data.id, mc_v: $.data.version }
          trigger:
            - call: "POST /herds/milk-checks/${mc_id}/finalize"
              payload: { expected_milk_check_version: "${mc_v}" }
              as: CoopSettlementAgent
          assert:
            - "MilkCheck.${mc_id}.advance_paid == 160.00"
            - "MilkCheck.${mc_id}.gross_settlement == 251.55"
            - "MilkCheck.${mc_id}.net_payable == 83.05"
            - "MilkCheck.${mc_id}.advance_paid != MilkCheck.${mc_id}.gross_settlement"

      - name: lactation_actual_vs_projected305_diverge
        grounds:
          - calculations.lactation_cumulative_milk
          - calculations.lactation_projected_305d
          - entities.Lactation.fields.cumulative_milk_lbs
          - entities.Lactation.fields.projected_305d_milk_lbs
        distinguishing_aspect: |
          On the Lactation entity domain (a different domain from MilkCheck), actual_to_date
          (cumulative_milk_lbs == 8605.0) and projected_305d (projected_305d_milk_lbs == 24595.0)
          differ because projection extrapolates the last daily yield to day 305.
        test_recipe:
          setup:
            - "Cow calved 2026-02-01, OPEN lactation, three test-days: 2026-03-13 (dim 40, 85.0 lbs), 2026-04-12 (dim 70, 92.0 lbs), 2026-05-12 (dim 100, 78.0 lbs)."
          setup_api_calls:
            - call: "POST /herds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds"
              payload: { name: "Lactation Dairy", federal_order_number: "30" }
              as: HerdManager
              captures: { h_id: $.data.id }
            - call: "POST /herds/animals"
              payload: { herd_id: "${h_id}", ear_tag: "LA-001", birth_date: "2023-01-01" }
              as: HerdManager
              captures: { a_id: $.data.id }
            - call: "POST /herds/breeding-events"
              payload: { animal_id: "${a_id}", service_date: "2026-01-10", sire_code: "S-77" }
              as: Veterinarian
              captures: { be_id: $.data.id }
            - call: "POST /herds/breeding-events/${be_id}/confirm"
              payload: {}
              as: Veterinarian
            - call: "POST /herds/calving-events"
              payload: { animal_id: "${a_id}", breeding_event_id: "${be_id}", calving_date: "2026-02-01" }
              as: HerdManager
              captures: { lact_id: $.data.opened_lactation_id }
            - call: "POST /herds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-12T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds/test-day-records"
              payload: { lactation_id: "${lact_id}", test_date: "2026-03-13", milk_weight_lbs: 85.0, fat_pct: 3.8, protein_pct: 3.1, scc_thousands: 150 }
              as: ParlorTech
            - call: "POST /herds/test-day-records"
              payload: { lactation_id: "${lact_id}", test_date: "2026-04-12", milk_weight_lbs: 92.0, fat_pct: 3.9, protein_pct: 3.0, scc_thousands: 160 }
              as: ParlorTech
            - call: "POST /herds/test-day-records"
              payload: { lactation_id: "${lact_id}", test_date: "2026-05-12", milk_weight_lbs: 78.0, fat_pct: 4.1, protein_pct: 3.2, scc_thousands: 170 }
              as: ParlorTech
          trigger:
            - call: "GET /herds/lactations/${lact_id}"
              payload: {}
              as: HerdManager
          assert:
            - "Lactation.${lact_id}.cumulative_milk_lbs == 8605.0"
            - "Lactation.${lact_id}.projected_305d_milk_lbs == 24595.0"
            - "Lactation.${lact_id}.projected_305d_milk_lbs != Lactation.${lact_id}.cumulative_milk_lbs"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: milk_check_multi_component_nonlinear_settlement
        grounds:
          - calculations.milk_check_settlement
          - entities.MilkCheck.fields.gross_settlement
          - entities.MilkCheck.fields.weighted_scc_thousands
        distinguishing_aspect: |
          Mode (a): gross_settlement combines >=3 inputs (fat, protein, other-solids lbs, weighted SCC, cwt)
          with a non-linear conditional SCC term whose sign flips around SCC_BASE_THOUSANDS=350; for the
          pinned single record gross_settlement == 251.55 with a positive scc_adj of 0.85.
        test_recipe:
          setup:
            - "Same pooled-record + price-sheet setup as milk_check_advance_vs_final_settlement_diverge: one record (1000,3.8,3.1,180) in 2026-06, a PROVISIONAL MilkCheck."
          setup_api_calls:
            - call: "POST /herds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds"
              payload: { name: "Combo Dairy", federal_order_number: "30" }
              as: HerdManager
              captures: { h_id: $.data.id }
            - call: "POST /herds/animals"
              payload: { herd_id: "${h_id}", ear_tag: "CB-001", birth_date: "2023-01-01" }
              as: HerdManager
              captures: { a_id: $.data.id }
            - call: "POST /herds/breeding-events"
              payload: { animal_id: "${a_id}", service_date: "2026-01-10", sire_code: "S-77" }
              as: Veterinarian
              captures: { be_id: $.data.id }
            - call: "POST /herds/breeding-events/${be_id}/confirm"
              payload: {}
              as: Veterinarian
            - call: "POST /herds/calving-events"
              payload: { animal_id: "${a_id}", breeding_event_id: "${be_id}", calving_date: "2026-02-01" }
              as: HerdManager
              captures: { lact_id: $.data.opened_lactation_id }
            - call: "POST /herds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds/test-day-records"
              payload: { lactation_id: "${lact_id}", test_date: "2026-06-10", milk_weight_lbs: 1000, fat_pct: 3.8, protein_pct: 3.1, scc_thousands: 180 }
              as: ParlorTech
            - call: "POST /herds/coop-price-sheets"
              payload: { herd_id: "${h_id}", settlement_month: "2026-06", fat_price_per_lb: 2.805, protein_price_per_lb: 3.515, other_solids_price_per_lb: 0.405, ppd_per_cwt: 1.205, advance_rate_per_cwt: 16.00, hauling_rate_per_cwt: 0.85 }
              as: CoopSettlementAgent
              captures: { ps_id: $.data.id }
            - call: "POST /herds/milk-checks"
              payload: { herd_id: "${h_id}", price_sheet_id: "${ps_id}" }
              as: CoopSettlementAgent
              captures: { mc_id: $.data.id, mc_v: $.data.version }
          trigger:
            - call: "POST /herds/milk-checks/${mc_id}/finalize"
              payload: { expected_milk_check_version: "${mc_v}" }
              as: CoopSettlementAgent
          assert:
            - "MilkCheck.${mc_id}.pooled_fat_lbs == 38.00"
            - "MilkCheck.${mc_id}.pooled_protein_lbs == 31.00"
            - "MilkCheck.${mc_id}.pooled_other_solids_lbs == 57.00"
            - "MilkCheck.${mc_id}.weighted_scc_thousands == 180.00"
            - "MilkCheck.${mc_id}.gross_settlement == 251.55"

      - name: ration_feed_cost_round_per_line_then_sum
        grounds:
          - calculations.daily_feed_cost
          - entities.Ration.fields.daily_feed_cost_per_cow
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — round each ingredient line to the cent THEN sum
          gives daily_feed_cost_per_cow == 9.96, whereas sum-raw-then-round-once gives 9.95; the scaffold
          pins per-line-then-sum.
        test_recipe:
          setup:
            - "A ration with four ingredients: (55 lbs @ 0.045), (18 @ 0.125), (21 @ 0.075), (9 @ 0.405)."
          setup_api_calls:
            - call: "POST /herds"
              payload: { name: "Feed Cost Dairy", federal_order_number: "30" }
              as: HerdManager
              captures: { h_id: $.data.id }
            - call: "POST /herds/rations"
              payload: { herd_id: "${h_id}", name: "High Group TMR", ingredients: [ { ingredient_name: "corn silage", lbs_as_fed: 55, price_per_lb: 0.045 }, { ingredient_name: "alfalfa", lbs_as_fed: 18, price_per_lb: 0.125 }, { ingredient_name: "corn grain", lbs_as_fed: 21, price_per_lb: 0.075 }, { ingredient_name: "protein mix", lbs_as_fed: 9, price_per_lb: 0.405 } ] }
              as: HerdManager
              captures: { r_id: $.data.id }
          trigger:
            - call: "GET /herds/rations/${r_id}"
              payload: {}
              as: HerdManager
          assert:
            - "Ration.${r_id}.daily_feed_cost_per_cow == 9.96"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: breeding_event_bred_open_retry_cycle
        grounds:
          - state_machines.BreedingEvent.BRED_to_OPEN
          - state_machines.BreedingEvent.BRED_to_CONFIRMED_PREGNANT
          - entities.BreedingEvent.fields.status
        distinguishing_aspect: |
          BreedingEvent is cyclic: BRED -> OPEN (failed service) returns the animal to breedable so a NEW
          BreedingEvent can be logged and confirmed; the second event reaches CONFIRMED_PREGNANT, proving
          the A->B->A loop on the BreedingEvent entity.
        test_recipe:
          setup:
            - "Cow with a first BRED service on 2026-02-01, marked OPEN; a second service on 2026-03-05 then confirmed."
          setup_api_calls:
            - call: "POST /herds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds"
              payload: { name: "Repro Dairy", federal_order_number: "30" }
              as: HerdManager
              captures: { h_id: $.data.id }
            - call: "POST /herds/animals"
              payload: { herd_id: "${h_id}", ear_tag: "RP-001", birth_date: "2023-01-01" }
              as: HerdManager
              captures: { a_id: $.data.id }
            - call: "POST /herds/breeding-events"
              payload: { animal_id: "${a_id}", service_date: "2026-02-01", sire_code: "S-1" }
              as: Veterinarian
              captures: { be1_id: $.data.id }
            - call: "POST /herds/breeding-events/${be1_id}/mark-open"
              payload: {}
              as: Veterinarian
            - call: "POST /herds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds/breeding-events"
              payload: { animal_id: "${a_id}", service_date: "2026-03-05", sire_code: "S-2" }
              as: Veterinarian
              captures: { be2_id: $.data.id }
          trigger:
            - call: "POST /herds/breeding-events/${be2_id}/confirm"
              payload: {}
              as: Veterinarian
          assert:
            - "BreedingEvent.${be1_id}.status == OPEN"
            - "BreedingEvent.${be2_id}.status == CONFIRMED_PREGNANT"

      - name: animal_active_dry_active_cycle
        grounds:
          - state_machines.Animal.ACTIVE_to_DRY
          - state_machines.Animal.DRY_to_ACTIVE
          - entities.Animal.fields.parity
        distinguishing_aspect: |
          Animal is cyclic on a DIFFERENT entity than BreedingEvent: ACTIVE -> DRY -> ACTIVE across two
          parities; after the second calving parity == 2 and status returns to ACTIVE, proving the
          ACTIVE<->DRY loop.
        test_recipe:
          setup:
            - "Cow calves (parity 1, ACTIVE), is dried off (DRY), then calves again (parity 2, ACTIVE)."
          setup_api_calls:
            - call: "POST /herds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds"
              payload: { name: "Cycle Dairy", federal_order_number: "30" }
              as: HerdManager
              captures: { h_id: $.data.id }
            - call: "POST /herds/animals"
              payload: { herd_id: "${h_id}", ear_tag: "CY-001", birth_date: "2022-01-01" }
              as: HerdManager
              captures: { a_id: $.data.id }
            - call: "POST /herds/breeding-events"
              payload: { animal_id: "${a_id}", service_date: "2025-12-20", sire_code: "S-1" }
              as: Veterinarian
              captures: { be1_id: $.data.id }
            - call: "POST /herds/breeding-events/${be1_id}/confirm"
              payload: {}
              as: Veterinarian
            - call: "POST /herds/calving-events"
              payload: { animal_id: "${a_id}", breeding_event_id: "${be1_id}", calving_date: "2026-01-15" }
              as: HerdManager
            - call: "POST /herds/animals/${a_id}/dry-off"
              payload: {}
              as: HerdManager
            - call: "POST /herds/breeding-events"
              payload: { animal_id: "${a_id}", service_date: "2026-02-20", sire_code: "S-2" }
              as: Veterinarian
              captures: { be2_id: $.data.id }
            - call: "POST /herds/breeding-events/${be2_id}/confirm"
              payload: {}
              as: Veterinarian
          trigger:
            - call: "POST /herds/calving-events"
              payload: { animal_id: "${a_id}", breeding_event_id: "${be2_id}", calving_date: "2026-12-01" }
              as: HerdManager
          assert:
            - "Animal.${a_id}.status == ACTIVE"
            - "Animal.${a_id}.parity == 2"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: calving_cascade_close_open_lactation_status_count_depth3
        grounds:
          - state_machines.Animal.DRY_to_ACTIVE
          - state_machines.Lactation.DRY_to_CLOSED
          - state_machines.Lactation.OPEN_to_CLOSED
          - entities.Herd.fields.active_animal_count
        distinguishing_aspect: |
          Depth-3 transitive chain triggered by POST /herds/calving-events on a DRY cow: (1) the calving
          flips Animal DRY->ACTIVE and parity++, (2) because a new lactation supersedes the prior, the prior
          DRY Lactation -> CLOSED and a new Lactation opens OPEN, (3) because the animal re-entered the
          milking string the Herd.active_animal_count is recomputed — each hop caused by the prior.
        test_recipe:
          setup:
            - "Cow at parity 1, DRY, with a prior DRY lactation; a confirmed second service ready to calve. Herd active_animal_count includes this one DRY cow (1)."
          setup_api_calls:
            - call: "POST /herds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds"
              payload: { name: "Cascade Dairy", federal_order_number: "30" }
              as: HerdManager
              captures: { h_id: $.data.id }
            - call: "POST /herds/animals"
              payload: { herd_id: "${h_id}", ear_tag: "CS-001", birth_date: "2022-01-01" }
              as: HerdManager
              captures: { a_id: $.data.id }
            - call: "POST /herds/breeding-events"
              payload: { animal_id: "${a_id}", service_date: "2025-12-20", sire_code: "S-1" }
              as: Veterinarian
              captures: { be1_id: $.data.id }
            - call: "POST /herds/breeding-events/${be1_id}/confirm"
              payload: {}
              as: Veterinarian
            - call: "POST /herds/calving-events"
              payload: { animal_id: "${a_id}", breeding_event_id: "${be1_id}", calving_date: "2026-01-15" }
              as: HerdManager
              captures: { lact1_id: $.data.opened_lactation_id }
            - call: "POST /herds/animals/${a_id}/dry-off"
              payload: {}
              as: HerdManager
            - call: "POST /herds/breeding-events"
              payload: { animal_id: "${a_id}", service_date: "2026-02-20", sire_code: "S-2" }
              as: Veterinarian
              captures: { be2_id: $.data.id }
            - call: "POST /herds/breeding-events/${be2_id}/confirm"
              payload: {}
              as: Veterinarian
          trigger:
            - call: "POST /herds/calving-events"
              payload: { animal_id: "${a_id}", breeding_event_id: "${be2_id}", calving_date: "2026-12-01" }
              as: HerdManager
              captures: { lact2_id: $.data.opened_lactation_id, closed_lact: $.data.closed_lactation_id }
          assert:
            - "Lactation.${lact1_id}.status == CLOSED"
            - "Lactation.${lact2_id}.status == OPEN"
            - "Animal.${a_id}.status == ACTIVE"
            - "Herd.${h_id}.active_animal_count == 1"

      - name: milk_check_finalize_cascade_stamp_then_quality_depth2
        grounds:
          - state_machines.MilkCheck.PROVISIONAL_to_FINALIZED
          - entities.TestDayRecord.fields.included_in_milk_check_id
          - calculations.herd_milk_quality_status
          - entities.Herd.fields.milk_quality_status
        distinguishing_aspect: |
          Depth-2 transitive chain from a DIFFERENT trigger (POST /herds/milk-checks/{id}/finalize):
          (1) finalize stamps each pooled TestDayRecord.included_in_milk_check_id, (2) because the check now
          carries a computed weighted_scc_thousands, Herd.milk_quality_status is recomputed to GOOD.
        test_recipe:
          setup:
            - "Same one-record pool + price sheet as the dual-variant milk-check setup; a PROVISIONAL MilkCheck (SCC 180k => GOOD)."
          setup_api_calls:
            - call: "POST /herds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds"
              payload: { name: "Quality Dairy", federal_order_number: "30" }
              as: HerdManager
              captures: { h_id: $.data.id }
            - call: "POST /herds/animals"
              payload: { herd_id: "${h_id}", ear_tag: "QL-001", birth_date: "2023-01-01" }
              as: HerdManager
              captures: { a_id: $.data.id }
            - call: "POST /herds/breeding-events"
              payload: { animal_id: "${a_id}", service_date: "2026-01-10", sire_code: "S-77" }
              as: Veterinarian
              captures: { be_id: $.data.id }
            - call: "POST /herds/breeding-events/${be_id}/confirm"
              payload: {}
              as: Veterinarian
            - call: "POST /herds/calving-events"
              payload: { animal_id: "${a_id}", breeding_event_id: "${be_id}", calving_date: "2026-02-01" }
              as: HerdManager
              captures: { lact_id: $.data.opened_lactation_id }
            - call: "POST /herds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds/test-day-records"
              payload: { lactation_id: "${lact_id}", test_date: "2026-06-10", milk_weight_lbs: 1000, fat_pct: 3.8, protein_pct: 3.1, scc_thousands: 180 }
              as: ParlorTech
              captures: { tdr_id: $.data.id }
            - call: "POST /herds/coop-price-sheets"
              payload: { herd_id: "${h_id}", settlement_month: "2026-06", fat_price_per_lb: 2.805, protein_price_per_lb: 3.515, other_solids_price_per_lb: 0.405, ppd_per_cwt: 1.205, advance_rate_per_cwt: 16.00, hauling_rate_per_cwt: 0.85 }
              as: CoopSettlementAgent
              captures: { ps_id: $.data.id }
            - call: "POST /herds/milk-checks"
              payload: { herd_id: "${h_id}", price_sheet_id: "${ps_id}" }
              as: CoopSettlementAgent
              captures: { mc_id: $.data.id, mc_v: $.data.version }
          trigger:
            - call: "POST /herds/milk-checks/${mc_id}/finalize"
              payload: { expected_milk_check_version: "${mc_v}" }
              as: CoopSettlementAgent
          assert:
            - "TestDayRecord.${tdr_id}.included_in_milk_check_id == ${mc_id}"
            - "Herd.${h_id}.milk_quality_status == GOOD"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: testday_closed_lactation_beats_test_date_temporal
        grounds:
          - validations[priority=5]
          - validations[priority=9]
          - errors[ERR_LACTATION_CLOSED]
          - errors[ERR_TEST_DATE_NOT_AFTER_PRIOR]
        distinguishing_aspect: |
          Category pair state(priority 5, ERR_LACTATION_CLOSED) vs business_temporal(priority 9,
          ERR_TEST_DATE_NOT_AFTER_PRIOR): a test-day add to a CLOSED lactation whose test_date is also not
          after the prior test returns the state error ERR_LACTATION_CLOSED, not the temporal error.
        test_recipe:
          setup:
            - "A lactation with one test (dim 40, 2026-03-13) that has been CLOSED by a subsequent calving; new test_date 2026-03-01 (also before the prior test)."
          setup_api_calls:
            - call: "POST /herds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds"
              payload: { name: "Conflict Dairy A", federal_order_number: "30" }
              as: HerdManager
              captures: { h_id: $.data.id }
            - call: "POST /herds/animals"
              payload: { herd_id: "${h_id}", ear_tag: "CA-001", birth_date: "2022-01-01" }
              as: HerdManager
              captures: { a_id: $.data.id }
            - call: "POST /herds/breeding-events"
              payload: { animal_id: "${a_id}", service_date: "2026-01-10", sire_code: "S-1" }
              as: Veterinarian
              captures: { be1_id: $.data.id }
            - call: "POST /herds/breeding-events/${be1_id}/confirm"
              payload: {}
              as: Veterinarian
            - call: "POST /herds/calving-events"
              payload: { animal_id: "${a_id}", breeding_event_id: "${be1_id}", calving_date: "2026-02-01" }
              as: HerdManager
              captures: { lact1_id: $.data.opened_lactation_id }
            - call: "POST /herds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-13T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds/test-day-records"
              payload: { lactation_id: "${lact1_id}", test_date: "2026-03-13", milk_weight_lbs: 85.0, fat_pct: 3.8, protein_pct: 3.1, scc_thousands: 150 }
              as: ParlorTech
            - call: "POST /herds/animals/${a_id}/dry-off"
              payload: {}
              as: HerdManager
            - call: "POST /herds/breeding-events"
              payload: { animal_id: "${a_id}", service_date: "2026-04-20", sire_code: "S-2" }
              as: Veterinarian
              captures: { be2_id: $.data.id }
            - call: "POST /herds/breeding-events/${be2_id}/confirm"
              payload: {}
              as: Veterinarian
            - call: "POST /herds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds/calving-events"
              payload: { animal_id: "${a_id}", breeding_event_id: "${be2_id}", calving_date: "2026-12-01" }
              as: HerdManager
          trigger:
            - call: "POST /herds/test-day-records"
              payload: { lactation_id: "${lact1_id}", test_date: "2026-03-01", milk_weight_lbs: 70.0, fat_pct: 3.8, protein_pct: 3.1, scc_thousands: 150 }
              as: ParlorTech
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_LACTATION_CLOSED"

      - name: cull_cross_herd_replacement_beats_meat_withdrawal
        grounds:
          - validations[priority=8]
          - validations[priority=12]
          - errors[ERR_CROSS_HERD_REFERENCE]
          - errors[ERR_MEAT_WITHDRAWAL_ACTIVE]
        distinguishing_aspect: |
          Category pair business_referential(priority 8, ERR_CROSS_HERD_REFERENCE) vs business_safety
          (priority 12, ERR_MEAT_WITHDRAWAL_ACTIVE): a SLAUGHTER cull whose replacement_animal_id belongs
          to a different herd AND whose animal is under active meat withdrawal returns the referential
          error (priority 8 wins over priority 12).
        test_recipe:
          setup:
            - "Active cow in herd A under an active meat withdrawal (treatment administered 2026-03-01T08:00Z, 240h, clock 2026-03-05). A HEIFER in a SEPARATE herd B used as replacement_animal_id."
          setup_api_calls:
