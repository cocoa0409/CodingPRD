scenario: "937. Livestock Auction & Sale Barn: consignment & lot/pen, weigh-in & drovers, buyer registration & credit, ring/sale & price-per-cwt, commission & yardage/feed, brand/health inspection & CVI, check-out & settlement, trucking"
domain_name: "livestock-auction-sale-barn"
api_prefix: "/sale-barn"

complexity_profile:
  primary_archetype: "Pricing engine"
  secondary_archetype: "Posture-driven gating"
  complexity_layers:
    - "Optimistic concurrency"
    - "Cascading side effects"
    - "Dual-variant calculation"
    - "Derived field reconciliation"
  entity_topology: graph
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# Declared constants. EVERY named constant referenced anywhere in this scaffold
# has a numeric or string value here. No constant is referenced by name only.
# ---------------------------------------------------------------------------
global_constants:
  DEFAULT_CLOCK_UTC: "2026-05-01T00:00:00Z"
  MONEY_PRECISION: 2
  MONEY_ROUNDING: "round_half_up"
  WEIGHT_PRECISION: 0
  WEIGHT_ROUNDING: "round_half_up"

  PENCIL_SHRINK_DEFAULT_PCT: 0.03
  PENCIL_SHRINK_MAX_PCT: 0.06
  STAND_TIME_MINUTES: 240
  MAX_REWEIGH_COUNT: 2

  WEIGHT_CLASS_MEDIUM_MIN_LB: 500.0
  WEIGHT_CLASS_HEAVY_MIN_LB: 800.0

  RING_ORDER_STEP: 10
  MAX_RERING_COUNT: 2
  MAX_RETEST_COUNT: 1

  BID_INCREMENT_TIER1_MAX: 100.00
  BID_INCREMENT_TIER1: 0.25
  BID_INCREMENT_TIER2_MAX: 500.00
  BID_INCREMENT_TIER2: 1.00
  BID_INCREMENT_TIER3: 5.00

  COMMISSION_TIER1_MAX: 1000.00
  COMMISSION_TIER1_PCT: 0.05
  COMMISSION_TIER2_MAX: 5000.00
  COMMISSION_TIER2_PCT: 0.04
  COMMISSION_TIER3_PCT: 0.03
  MIN_COMMISSION_PER_HEAD: 4.00
  MAX_COMMISSION_PER_LOT: 450.00
  COMMISSION_FLAT_PER_HEAD: 18.00

  YARDAGE_RATE_PER_HEAD_DAY: 1.75
  YARDAGE_FLAT_PER_HEAD: 5.00
  YARDAGE_MIN_DAYS: 1

  FEED_RATE_STARTER: 0.955
  FEED_RATE_GROWER: 1.405
  FEED_RATE_HAY: 0.605

  CHECKOFF_PER_HEAD: 1.00
  CHECKOFF_STATE_SHARE: 0.50
  CHECKOFF_NATIONAL_SHARE: 0.50
  BRAND_FEE_PER_HEAD: 1.20
  INDEMNITY_PCT: 0.0015
  INDEMNITY_MIN: 0.50
  INDEMNITY_MAX: 25.00

  BOND_PROCESSING_PCT: 0.0025
  BOND_FEE_CAP: 150.00
  CASH_HANDLING_PER_HEAD: 0.75
  CASH_HANDLING_MIN: 5.00

  BONDED_LIMIT_MULTIPLIER: 1.5
  UNSECURED_LIMIT_MULTIPLIER: 1.0
  CASH_ONLY_LIMIT_MULTIPLIER: 0.0

  HAUL_RATE_PER_LOADED_MILE: 4.85
  MIN_HAUL_CHARGE: 250.00
  HAUL_RATE_PER_HEAD: 12.00

  MOVE_DURATION_MINUTES: 30
  MOVE_BUFFER_MINUTES: 15

  CVI_VALIDITY_DAYS: 30
  BRAND_INSPECTION_VALIDITY_DAYS: 10
  TRICH_TEST_VALIDITY_DAYS: 60
  BRUCELLOSIS_TEST_VALIDITY_DAYS: 365

# ---------------------------------------------------------------------------
# Ordered write gates. A gate listed earlier PRE-EMPTS every gate listed after
# it: when two gates are both violated by one request, the earlier gate's
# error_id is returned. This block is the authoritative total order; §1.4
# rung numbers mirror it.
# ---------------------------------------------------------------------------
gate_precedence:
  total_order:
    - gate: G1_SALE_DAY_CANCELLED
      validation_priority: 11
      error_id: ERR_SALE_DAY_CANCELLED
      scope: "Every write whose target resolves (directly or through an FK chain) to a SaleDay with status == CANCELLED."
      exempt_endpoints: []
      preempts: [G2_LOT_QUARANTINED, G3_SALE_DAY_FROZEN, G4_PARTY_SUSPENDED, G5_SETTLEMENT_RELEASED]
    - gate: G2_LOT_QUARANTINED
      validation_priority: 12
      error_id: ERR_LOT_QUARANTINED
      scope: "Every write touching a Lot whose quarantine_hold == true."
      exempt_endpoints:
        - "POST /sale-barn/lots/{id}/quarantine"
        - "POST /sale-barn/inspection-records"
        - "POST /sale-barn/inspection-records/{id}/result"
        - "POST /sale-barn/sale-days/{id}/advance"
      preempts: [G3_SALE_DAY_FROZEN, G4_PARTY_SUSPENDED, G5_SETTLEMENT_RELEASED]
      note: "The exemption for POST /lots/{id}/quarantine is what keeps the release path reachable; without it the gate would make its own lifting transition unreachable."
    - gate: G3_SALE_DAY_FROZEN
      validation_priority: 13
      error_id: ERR_SALE_DAY_FROZEN
      scope: "Bidding, hammer-down, weigh-ticket capture, pen assignment, pen moves and lot creation are refused once SaleDay.status IN {BIDDING_CLOSED, SETTLED}."
      exempt_endpoints:
        - "POST /sale-barn/sale-days/{id}/advance"
        - "POST /sale-barn/sale-days/{id}/close"
        - "POST /sale-barn/settlements/{id}/release"
        - "POST /sale-barn/settlements/{id}/adjust"
        - "POST /sale-barn/buyer-invoices/{id}/credit-memo"
        - "POST /sale-barn/buyer-registrations/{id}/payments"
        - "POST /sale-barn/lots/{id}/release"
        - "POST /sale-barn/load-manifests/{id}/lines"
        - "POST /sale-barn/load-manifests/{id}/dispatch"
        - "POST /sale-barn/load-manifests/{id}/deliver"
        - "POST /sale-barn/load-manifests/{id}/close"
        - "POST /sale-barn/purchases/{id}/void"
      preempts: [G4_PARTY_SUSPENDED, G5_SETTLEMENT_RELEASED]
    - gate: G4_PARTY_SUSPENDED
      validation_priority: 14
      error_id: ERR_PARTY_SUSPENDED
      scope: "Any write whose owning Party (consignor, buyer, or carrier) has status == SUSPENDED."
      exempt_endpoints:
        - "POST /sale-barn/parties/{id}/status"
      preempts: [G5_SETTLEMENT_RELEASED]
    - gate: G5_SETTLEMENT_RELEASED
      validation_priority: 15
      error_id: ERR_SETTLEMENT_RELEASED
      scope: "A Settlement with status == RELEASED accepts no further mutation except POST /settlements/{id}/adjust, which produces a credit-memo style adjustment."
      exempt_endpoints:
        - "POST /sale-barn/settlements/{id}/adjust"
      preempts: []

# ---------------------------------------------------------------------------
# Named conservation invariants. Each is an explicit formula over declared
# entity fields, exposed as a computed boolean so a test can observe it.
# ---------------------------------------------------------------------------
conservation_invariants:
  - name: INV_CONSIGNMENT_HEAD
    conserved_quantity: "head of livestock belonging to one Consignment"
    surfaced_as: "Consignment.head_balance_ok"
    formula: |
      head_in_lots  = SUM(Lot.head_count) for Lot.consignment_id == C.id
                      AND Lot.sale_status IN {DRAFT, PENNED, READY, IN_RING, SOLD, NO_SALE}
      C.head_received == head_in_lots
                       + C.head_unassigned
                       + C.head_dead
                       + C.head_condemned
                       + C.head_withdrawn
    note: "head_unassigned is a STORED counter (source: system), not a residual; the invariant is therefore falsifiable."
  - name: INV_SALE_DAY_HEAD
    conserved_quantity: "head of livestock passing through one SaleDay"
    surfaced_as: "SaleDay.head_reconciliation_ok"
    formula: |
      SaleDay.head_received_total == SaleDay.head_sold_total
                                   + SaleDay.head_no_sale_total
                                   + SaleDay.head_withdrawn_total
                                   + SaleDay.head_dead_total
                                   + SaleDay.head_in_process_total
                                   + SaleDay.head_unassigned_total
  - name: INV_GROSS_MATCH
    conserved_quantity: "gross sale value, seen from the buyer side and the seller side"
    surfaced_as: "SaleDay.gross_match_ok"
    formula: |
      SUM(BuyerInvoice.subtotal) for BuyerInvoice.sale_day_id == D.id
        == SUM(Settlement.gross_amount) for Settlement.consignment_id IN consignments of D
  - name: INV_SALE_DAY_MONEY_BALANCE
    conserved_quantity: "money moving through one SaleDay"
    surfaced_as: "SaleDay.money_reconciliation_ok"
    formula: |
      SUM(BuyerInvoice.total_due)
        == SUM(Settlement.net_amount)
         + SUM(ChargeLine.amount)              # all charge lines of the sale day, both sides,
                                               # EXCLUDING charge_type == DOA_CREDIT, which is
                                               # already represented by credit_memo_total below
         + SUM(Settlement.advances_amount)
         + SUM(Settlement.offset_applied)
         - SUM(BuyerInvoice.credit_memo_total)
  - name: INV_SETTLEMENT_BALANCE
    conserved_quantity: "one consignor settlement's own arithmetic"
    surfaced_as: "Settlement.balance_ok"
    formula: |
      Settlement.gross_amount
        == Settlement.net_amount
         + Settlement.commission_amount
         + Settlement.yardage_amount
         + Settlement.feed_amount
         + Settlement.statutory_amount
         + Settlement.brand_fee_amount
         + Settlement.indemnity_fee_amount
         + Settlement.advances_amount
         + Settlement.offset_applied
         - Settlement.adjustment_total
  - name: INV_PEN_OCCUPANCY
    conserved_quantity: "head standing in one Pen"
    surfaced_as: "Pen.current_head"
    formula: |
      Pen.current_head == SUM(Lot.head_count) for Lot.pen_id == P.id
                          AND Lot.sale_status IN {PENNED, READY, IN_RING, SOLD, NO_SALE}
                          AND Lot.custody_status IN {BARN, BUYER_PEN}
      AND Pen.current_head <= Pen.head_capacity

# ---------------------------------------------------------------------------
# ChargeLine classification. Every ChargeLine the system appends takes its
# side and revenue_class from this table; no other combination is produced.
# This is what makes every ChargeLine.side and ChargeLine.revenue_class enum
# member reachable, and it is what SaleDay.total_barn_revenue and
# SaleDay.total_statutory_collected filter on.
# ---------------------------------------------------------------------------
charge_line_classification:
  - charge_type: COMMISSION
    side: SELLER
    revenue_class: BARN_REVENUE
    produced_by: "CASCADE hop 5 of POST /sale-barn/sale-days/{id}/close"
  - charge_type: YARDAGE
    side: SELLER
    revenue_class: BARN_REVENUE
    produced_by: "CASCADE hop 5 of POST /sale-barn/sale-days/{id}/close"
  - charge_type: FEED
    side: SELLER
    revenue_class: BARN_REVENUE
    produced_by: "CASCADE hop 5 of POST /sale-barn/sale-days/{id}/close"
  - charge_type: CHECKOFF_STATE
    side: SELLER
    revenue_class: STATUTORY_REMITTANCE
    produced_by: "CASCADE hop 5 of POST /sale-barn/sale-days/{id}/close"
  - charge_type: CHECKOFF_NATIONAL
    side: SELLER
    revenue_class: STATUTORY_REMITTANCE
    produced_by: "CASCADE hop 5 of POST /sale-barn/sale-days/{id}/close"
  - charge_type: BRAND_FEE
    side: SELLER
    revenue_class: PASS_THROUGH
    produced_by: "CASCADE hop 5 of POST /sale-barn/sale-days/{id}/close"
    note: "Collected from the consignor and forwarded to the state brand board, so it is not barn revenue."
  - charge_type: INDEMNITY_FEE
    side: SELLER
    revenue_class: BARN_REVENUE
    produced_by: "CASCADE hop 5 of POST /sale-barn/sale-days/{id}/close"
  - charge_type: BUYER_FEE
    side: BUYER
    revenue_class: BARN_REVENUE
    produced_by: "BuyerInvoice DRAFT -> ISSUED during POST /sale-barn/sale-days/{id}/close"
  - charge_type: HAUL
    side: BUYER
    revenue_class: PASS_THROUGH
    produced_by: "POST /sale-barn/load-manifests/{id}/dispatch"
    note: "Collected from the buyer and forwarded to the carrier."
  - charge_type: DOA_CREDIT
    side: BUYER
    revenue_class: BARN_REVENUE
    produced_by: "POST /sale-barn/buyer-invoices/{id}/credit-memo with a purchase_id and doa_head"
    note: "The only line whose amount is negative."

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Party
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Legal name of the consignor / buyer / carrier."
      - name: party_type
        type: enum
        source: input
        description: "What kind of counterparty this is."
        constraints: "one of INDIVIDUAL, FARM, DEALER, PACKER, CARRIER"
      - name: origin_state_code
        type: string
        source: input
        description: "Two-letter state code the party's livestock originates from."
      - name: origin_county
        type: string
        source: input
        description: "County of origin, used by brand-inspection rules."
      - name: tax_id
        type: string
        source: input
        description: "Tax identifier printed on settlements and invoices."
      - name: status
        type: enum
        source: system
        description: "Trading standing of the party."
        default: "ACTIVE"
        constraints: "one of ACTIVE, SUSPENDED"

  - name: SaleDay
    parent: null
    common_fields: true
    fields:
      - name: sale_date
        type: string
        source: input
        description: "Calendar date of the auction, ISO 8601 date (YYYY-MM-DD)."
      - name: barn_code
        type: string
        source: input
        description: "Identifier of the physical sale barn running this sale."
      - name: barn_state_code
        type: string
        source: input
        description: "Two-letter state code the barn sits in; drives the CVI requirement on check-out."
      - name: status
        type: enum
        source: system
        description: "Sale-day posture; gates writes on every child entity."
        default: "SCHEDULED"
        constraints: "one of SCHEDULED, CHECK_IN_OPEN, RINGING, BIDDING_CLOSED, SETTLED, CANCELLED"
      - name: next_ring_order
        type: integer
        source: system
        description: "Next ring-order slot to hand out; advances by RING_ORDER_STEP."
        default: 10
      - name: reopen_count
        type: integer
        source: system
        description: "How many times bidding has been reopened from BIDDING_CLOSED back to RINGING."
        default: 0
      - name: head_received_total
        type: integer
        source: computed
        description: "Sum of Consignment.head_received over consignments of this sale day."
      - name: head_sold_total
        type: integer
        source: computed
        description: "Sum of Lot.head_count over lots of this sale day with sale_status == SOLD."
      - name: head_no_sale_total
        type: integer
        source: computed
        description: "Sum of Lot.head_count over lots of this sale day with sale_status == NO_SALE."
      - name: head_withdrawn_total
        type: integer
        source: computed
        description: "Sum of Consignment.head_withdrawn over consignments of this sale day."
      - name: head_dead_total
        type: integer
        source: computed
        description: "Sum of Consignment.head_dead + Consignment.head_condemned over consignments of this sale day."
      - name: head_in_process_total
        type: integer
        source: computed
        description: "Sum of Lot.head_count over lots with sale_status IN {DRAFT, PENNED, READY, IN_RING}."
      - name: head_unassigned_total
        type: integer
        source: computed
        description: "Sum of Consignment.head_unassigned over consignments of this sale day."
      - name: total_gross_sale_value
        type: number
        source: computed
        description: "Sum of Lot.extended_amount over lots of this sale day with sale_status == SOLD."
      - name: total_buyer_invoiced
        type: number
        source: computed
        description: "Sum of BuyerInvoice.total_due over invoices of this sale day with status != VOIDED."
      - name: total_seller_net
        type: number
        source: computed
        description: "Sum of Settlement.net_amount over settlements of this sale day."
      - name: total_barn_revenue
        type: number
        source: computed
        description: "Sum of ChargeLine.amount where revenue_class == BARN_REVENUE for this sale day."
      - name: total_statutory_collected
        type: number
        source: computed
        description: "Sum of ChargeLine.amount where revenue_class == STATUTORY_REMITTANCE for this sale day."
      - name: gross_match_ok
        type: boolean
        source: computed
        description: "INV_GROSS_MATCH holds for this sale day."
      - name: money_reconciliation_ok
        type: boolean
        source: computed
        description: "INV_SALE_DAY_MONEY_BALANCE holds for this sale day."
      - name: head_reconciliation_ok
        type: boolean
        source: computed
        description: "INV_SALE_DAY_HEAD holds for this sale day."

  - name: Pen
    parent: null
    common_fields: true
    fields:
      - name: pen_code
        type: string
        source: input
        description: "Painted pen number in the yard."
      - name: species_class
        type: enum
        source: input
        description: "Species the pen is rigged for; a lot of another species cannot be assigned."
        constraints: "one of CATTLE, SWINE, SHEEP_GOAT, HORSE"
      - name: head_capacity
        type: integer
        source: input
        description: "Maximum head that may stand in the pen at one time."
        constraints: "integer >= 1"
      - name: pen_type
        type: enum
        source: input
        description: "Functional role of the pen in the yard."
        constraints: "one of RECEIVING, HOLDING, BUYER_PEN, SICK_BAY"
      - name: status
        type: enum
        source: system
        description: "Pen availability."
        default: "AVAILABLE"
        constraints: "one of AVAILABLE, OCCUPIED, OUT_OF_SERVICE"
      - name: current_head
        type: integer
        source: computed
        description: "Head standing in the pen right now, per INV_PEN_OCCUPANCY."
        default: 0

  - name: Scale
    parent: null
    common_fields: true
    fields:
      - name: scale_code
        type: string
        source: input
        description: "Certified scale identifier stamped on weigh tickets."
      - name: certified_from
        type: string
        source: input
        description: "First date (YYYY-MM-DD) the certification is valid, inclusive."
      - name: certification_expires_on
        type: string
        source: input
        description: "Last date (YYYY-MM-DD) the certification is valid, INCLUSIVE."
      - name: max_draft_lb
        type: number
        source: input
        description: "Largest gross draft weight the scale is rated for."
      - name: status
        type: enum
        source: computed
        description: "CERTIFIED when certified_from <= clock_date <= certification_expires_on, otherwise EXPIRED."
        constraints: "one of CERTIFIED, EXPIRED"

  - name: DroverCrew
    parent: null
    common_fields: true
    fields:
      - name: crew_code
        type: string
        source: input
        description: "Crew identifier used on pen-move orders."
      - name: member_count
        type: integer
        source: input
        description: "Number of drovers on the crew."
        constraints: "integer >= 1"
      - name: duty_status
        type: enum
        source: system
        description: "Whether the crew can be dispatched right now."
        default: "OFF_DUTY"
        constraints: "one of OFF_DUTY, ON_DUTY, ON_BREAK"
      - name: last_move_completed_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of the crew's most recent COMPLETED pen move; null when it has none."

  - name: Consignment
    parent: null
    common_fields: true
    fields:
      - name: sale_day_id
        type: string
        source: input
        description: "FK -> SaleDay.id; the sale this consignment is delivered for."
      - name: consignor_party_id
        type: string
        source: input
        description: "FK -> Party.id; the seller."
      - name: species_class
        type: enum
        source: input
        description: "Species delivered; every lot drawn from this consignment inherits it."
        constraints: "one of CATTLE, SWINE, SHEEP_GOAT, HORSE"
      - name: head_received
        type: integer
        source: input
        description: "Head physically delivered by the consignor."
        constraints: "integer >= 1"
      - name: weigh_basis
        type: enum
        source: input
        description: "Selects the settle-weight variant: PENCIL_SHRINK deducts a contractual percentage, STAND_ACTUAL re-weighs after a stand."
        constraints: "one of PENCIL_SHRINK, STAND_ACTUAL"
      - name: pencil_shrink_pct
        type: number
        source: input
        description: "Contractual shrink fraction applied when weigh_basis == PENCIL_SHRINK."
        default: 0.03
        constraints: "0 <= pencil_shrink_pct <= PENCIL_SHRINK_MAX_PCT (0.06)"
      - name: yardage_basis
        type: enum
        source: input
        description: "Selects the yardage variant."
        default: "PER_HEAD_DAY"
        constraints: "one of PER_HEAD_DAY, FLAT_PER_HEAD"
      - name: commission_basis
        type: enum
        source: input
        description: "Selects the seller-commission variant."
        default: "TIERED_VALUE"
        constraints: "one of TIERED_VALUE, FLAT_PER_HEAD"
      - name: ration_type
        type: enum
        source: input
        description: "Ration fed while on the yard; NONE means no feed charge."
        default: "NONE"
        constraints: "one of NONE, STARTER, GROWER, HAY"
      - name: days_on_feed
        type: integer
        source: input
        description: "Whole days the consignment was fed the declared ration."
        default: 0
        constraints: "integer >= 0"
      - name: advances_amount
        type: number
        source: input
        description: "Cash advanced to the consignor before settlement; deducted from net proceeds."
        default: 0
        constraints: "number >= 0"
      - name: hold_until_funds
        type: boolean
        source: input
        description: "When true the settlement is created HELD and cannot be released until every buyer invoice covering this consignment's lots is PAID."
        default: false
      - name: status
        type: enum
        source: system
        description: "Consignment lifecycle."
        default: "INTAKE"
        constraints: "one of INTAKE, CHECKED_IN, SORTED, RECONCILED, SETTLED, WITHDRAWN"
      - name: checked_in_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of check-in; the start of the yardage day count."
      - name: head_unassigned
        type: integer
        source: system
        description: "STORED counter of head not yet placed in a lot and not yet removed; initialised to head_received."
      - name: head_in_lots
        type: integer
        source: computed
        description: "Sum of Lot.head_count for this consignment's lots whose sale_status != WITHDRAWN."
      - name: head_dead
        type: integer
        source: system
        description: "Head removed as death loss."
        default: 0
      - name: head_condemned
        type: integer
        source: system
        description: "Head removed as condemned."
        default: 0
      - name: head_withdrawn
        type: integer
        source: system
        description: "Head hauled back home by the consignor without ever being lotted. Withdrawing a LOT does NOT land here: those head return to head_unassigned because they are still standing on the yard."
        default: 0
      - name: head_sold
        type: integer
        source: computed
        description: "Sum of Lot.head_count for this consignment's lots with sale_status == SOLD."
      - name: head_no_saled
        type: integer
        source: computed
        description: "Sum of Lot.head_count for this consignment's lots with sale_status == NO_SALE."
      - name: head_balance_ok
        type: boolean
        source: computed
        description: "INV_CONSIGNMENT_HEAD holds for this consignment."
  - name: Lot
    parent: Consignment
    common_fields: true
    fields:
      - name: consignment_id
        type: string
        source: input
        description: "FK -> Consignment.id; a lot draws head from exactly one consignment (commingled lots are NOT permitted in this design)."
      - name: sale_day_id
        type: string
        source: computed
        description: "FK -> SaleDay.id; copied from the parent consignment at creation."
      - name: pen_id
        type: string
        source: system
        description: "FK -> Pen.id; null while the lot is in the alley, set by pen assignment and by a completed pen move."
      - name: head_count
        type: integer
        source: input
        description: "Head sorted into this lot."
        constraints: "integer >= 1"
      - name: livestock_class
        type: enum
        source: input
        description: "Sale class of the lot; drives the class-specific health-test requirement."
        constraints: "one of FEEDER_STEER, FEEDER_HEIFER, BREEDING_BULL, BREEDING_FEMALE, CULL_COW, CALF"
      - name: bid_basis
        type: enum
        source: input
        description: "Selects the extension variant: PER_CWT multiplies by hundredweight, PER_HEAD multiplies by head."
        constraints: "one of PER_CWT, PER_HEAD"
      - name: opening_bid
        type: number
        source: input
        description: "Lowest acceptable first bid, expressed in the lot's bid_basis unit."
        constraints: "number > 0"
      - name: reserve_price
        type: number
        source: input
        description: "Consignor floor, expressed in the lot's bid_basis unit; a hammer below it is refused unless buy_back is elected."
        constraints: "number >= 0"
      - name: destination_state_code
        type: string
        source: system
        description: "Two-letter state the buyer is hauling to; set at hammer-down from the buyer party's origin_state_code, null until then."
      - name: ring_order
        type: integer
        source: system
        description: "Position in the sale order, handed out at mark-ready from SaleDay.next_ring_order."
      - name: sale_status
        type: enum
        source: system
        description: "Sale axis. Evolves independently of custody_status on the same row (parallel state dimensions)."
        default: "DRAFT"
        constraints: "one of DRAFT, PENNED, READY, IN_RING, SOLD, NO_SALE, WITHDRAWN"
      - name: custody_status
        type: enum
        source: system
        description: "Custody axis. Evolves independently of sale_status on the same row (parallel state dimensions)."
        default: "BARN"
        constraints: "one of BARN, BUYER_PEN, LOADED, RELEASED"
      - name: quarantine_hold
        type: boolean
        source: system
        description: "Global write gate G2 on this lot."
        default: false
      - name: rering_count
        type: integer
        source: system
        description: "How many times this lot has gone NO_SALE -> READY; capped by MAX_RERING_COUNT."
        default: 0
      - name: gross_weight_lb
        type: number
        source: computed
        description: "gross_weight_lb of the governing CAPTURED weigh ticket."
      - name: tare_weight_lb
        type: number
        source: computed
        description: "tare_weight_lb of the governing CAPTURED weigh ticket."
      - name: net_weight_lb
        type: number
        source: computed
        description: "net_weight_lb of the governing CAPTURED weigh ticket."
      - name: settle_weight_lb
        type: number
        source: computed
        description: "Weight the sale settles on; produced by calculation settle_weight (dual-variant)."
      - name: avg_weight_lb
        type: number
        source: computed
        description: "settle_weight_lb / head_count, one decimal place."
      - name: weight_class
        type: enum
        source: computed
        description: "Bucket derived from avg_weight_lb; NONE while settle_weight_lb is null."
        constraints: "one of NONE, LIGHT, MEDIUM, HEAVY"
      - name: hammer_price
        type: number
        source: system
        description: "Winning unit price in the lot's bid_basis unit; null until hammer-down."
      - name: extended_amount
        type: number
        source: computed
        description: "Gross sale value of the lot; produced by calculation lot_extension (dual-variant)."
      - name: buy_back
        type: boolean
        source: system
        description: "True when the hammer went to a BuyerRegistration whose party_id equals the consignment's consignor_party_id."
        default: false
      - name: penned_at
        type: datetime
        source: system
        description: "Logical-clock timestamp the lot entered its current pen; start of its pen-occupancy interval."
      - name: released_at
        type: datetime
        source: system
        description: "Logical-clock timestamp the lot left the yard; end of its pen-occupancy interval and of its yardage day count."

  - name: WeighTicket
    parent: Lot
    common_fields: true
    fields:
      - name: lot_id
        type: string
        source: input
        description: "FK -> Lot.id; the draft weighed."
      - name: scale_id
        type: string
        source: input
        description: "FK -> Scale.id; the certified scale used."
      - name: head_on_draft
        type: integer
        source: input
        description: "Head standing on the scale for this draft."
        constraints: "integer >= 1"
      - name: gross_weight_lb
        type: number
        source: input
        description: "Gross weight of the draft including the alley crate."
        constraints: "number > 0"
      - name: tare_weight_lb
        type: number
        source: input
        description: "Tare of the alley crate."
        constraints: "number >= 0"
      - name: net_weight_lb
        type: number
        source: computed
        description: "gross_weight_lb - tare_weight_lb, rounded to WEIGHT_PRECISION."
      - name: ticket_seq
        type: integer
        source: system
        description: "1 for the first ticket on the lot, then 2, 3, ...; ticket_seq - 1 is the reweigh count."
      - name: status
        type: enum
        source: system
        description: "Ticket lifecycle."
        default: "OPEN"
        constraints: "one of OPEN, CAPTURED, VOIDED, SUPERSEDED"
      - name: opened_at
        type: datetime
        source: system
        description: "Logical-clock timestamp the ticket was opened; the stand clock starts here."
      - name: captured_at
        type: datetime
        source: system
        description: "Logical-clock timestamp the ticket was captured; null while OPEN."

  - name: PenMove
    parent: null
    common_fields: true
    fields:
      - name: lot_id
        type: string
        source: input
        description: "FK -> Lot.id; the lot being driven."
      - name: from_pen_id
        type: string
        source: computed
        description: "FK -> Pen.id; copied from Lot.pen_id at creation."
      - name: to_pen_id
        type: string
        source: input
        description: "FK -> Pen.id; the destination pen."
      - name: crew_id
        type: string
        source: input
        description: "FK -> DroverCrew.id; the crew ordered to make the move."
      - name: head_moved
        type: integer
        source: computed
        description: "Copied from Lot.head_count at creation."
      - name: scheduled_start_at
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the crew is booked from."
      - name: scheduled_end_at
        type: datetime
        source: computed
        description: "scheduled_start_at + MOVE_DURATION_MINUTES."
      - name: status
        type: enum
        source: system
        description: "Move lifecycle."
        default: "REQUESTED"
        constraints: "one of REQUESTED, IN_PROGRESS, COMPLETED, ABORTED"
      - name: completed_at
        type: datetime
        source: system
        description: "Logical-clock timestamp the move completed; null otherwise."

  - name: BuyerRegistration
    parent: null
    common_fields: true
    fields:
      - name: party_id
        type: string
        source: input
        description: "FK -> Party.id; the party bidding."
      - name: sale_day_id
        type: string
        source: input
        description: "FK -> SaleDay.id; registrations are per sale day."
      - name: buyer_number
        type: integer
        source: input
        description: "Bidder number called in the ring; unique within a sale day."
        constraints: "integer >= 1"
      - name: bond_type
        type: enum
        source: input
        description: "Selects the credit multiplier AND the buyer-side fee variant."
        constraints: "one of BONDED, UNSECURED, CASH_ONLY"
      - name: credit_limit
        type: number
        source: input
        description: "Face credit line granted at registration."
        constraints: "number >= 0"
      - name: cash_deposit_amount
        type: number
        source: input
        description: "Cash posted at the window; the whole line for CASH_ONLY buyers."
        default: 0
        constraints: "number >= 0"
      - name: override_limit
        type: number
        source: system
        description: "Extra headroom granted by a credit override; replaced (not accumulated) by each override."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Bidding standing."
        default: "PENDING"
        constraints: "one of PENDING, APPROVED, CREDIT_HOLD, REVOKED"
      - name: payments_applied
        type: number
        source: system
        description: "Cash received from this buyer during the sale day."
        default: 0
      - name: effective_limit
        type: number
        source: computed
        description: "Produced by calculation buyer_effective_limit."
      - name: open_purchase_amount
        type: number
        source: computed
        description: "Sum of Purchase.extended_amount for this registration with status IN {CONFIRMED, INVOICED, ADJUSTED}."
      - name: winning_bid_amount
        type: number
        source: computed
        description: "Sum of Bid.projected_extension for this registration with status == WINNING."
      - name: exposure
        type: number
        source: computed
        description: "Produced by calculation buyer_exposure."
      - name: available_credit
        type: number
        source: computed
        description: "effective_limit - exposure, rounded to MONEY_PRECISION."

  - name: Bid
    parent: Lot
    common_fields: true
    fields:
      - name: lot_id
        type: string
        source: input
        description: "FK -> Lot.id; the lot in the ring."
      - name: buyer_registration_id
        type: string
        source: input
        description: "FK -> BuyerRegistration.id; who bid."
      - name: unit_price
        type: number
        source: input
        description: "Bid in the lot's bid_basis unit ($/cwt or $/head)."
        constraints: "number > 0"
      - name: bid_seq
        type: integer
        source: system
        description: "1 for the first bid on the lot, then 2, 3, ..."
      - name: projected_extension
        type: number
        source: computed
        description: "What this bid would extend to if hammered; produced by calculation lot_extension using unit_price."
      - name: status
        type: enum
        source: system
        description: "Bid standing. A newly recorded bid is WINNING immediately; the prior high goes OUTBID."
        default: "WINNING"
        constraints: "one of WINNING, OUTBID, HAMMERED, VOIDED"
  - name: Purchase
    parent: null
    common_fields: true
    fields:
      - name: lot_id
        type: string
        source: computed
        description: "FK -> Lot.id; the lot bought."
      - name: buyer_registration_id
        type: string
        source: computed
        description: "FK -> BuyerRegistration.id; the buyer."
      - name: winning_bid_id
        type: string
        source: computed
        description: "FK -> Bid.id; the bid that took the hammer."
      - name: buyer_invoice_id
        type: string
        source: system
        description: "FK -> BuyerInvoice.id; null until the buyer's invoice row exists."
      - name: bid_basis
        type: enum
        source: computed
        description: "Copied from Lot.bid_basis at hammer-down."
        constraints: "one of PER_CWT, PER_HEAD"
      - name: unit_price
        type: number
        source: computed
        description: "Copied from the winning Bid.unit_price."
      - name: head_count
        type: integer
        source: computed
        description: "Copied from Lot.head_count."
      - name: total_weight_lb
        type: number
        source: computed
        description: "Copied from Lot.settle_weight_lb."
      - name: extended_amount
        type: number
        source: computed
        description: "Produced by calculation lot_extension."
      - name: doa_head
        type: integer
        source: system
        description: "Head declared dead-on-arrival / downer by the buyer."
        default: 0
      - name: doa_credit_amount
        type: number
        source: computed
        description: "Produced by calculation doa_credit."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Purchase lifecycle. INVOICED -> ADJUSTED -> INVOICED is a loop driven by DOA credits."
        default: "CONFIRMED"
        constraints: "one of CONFIRMED, INVOICED, ADJUSTED, PAID, VOIDED"

  - name: BuyerInvoice
    parent: null
    common_fields: true
    fields:
      - name: buyer_registration_id
        type: string
        source: computed
        description: "FK -> BuyerRegistration.id; who owes."
