# =============================================================================
# PRD Benchmark Seed Tables — Hot Air Balloon Ride Operations (task 2007)
# =============================================================================

scenario: |
  2007. Hot Air Balloon Ride Operations (Albuquerque balloon ride operator): launch
  site selection by wind & landowner permission, weather go/no-go at dawn window,
  passenger weight & basket capacity, chase crew coordination & landing retrieval,
  reschedule/refund policy on cancellation, pilot currency & aircraft inspection,
  group/charter vs shared-basket pricing, post-flight ceremony & photo package

domain_name: hot-air-balloon-ride-operations
api_prefix: /v1

complexity_profile:
  primary_archetype: compliance_audit        # pilot currency, aircraft inspection, weather go/no-go
  secondary_archetype: temporal_windowing    # dawn launch window, inspection/permission expiry
  complexity_layers:
    - cascading_side_effects                 # NO_GO / GROUNDED cascades across Flight → Reservation → Refund → Customer
    - dual_variant_calculation               # provisional vs final fare; FAA vs operator pilot currency
    - optimistic_concurrency                 # OCC on Flight.version (site select) and Balloon.version (inspection)
    - selector_policy                        # launch-site candidacy ranked by wind margin
  entity_topology: flat                      # peer entities cross-linked by FKs; sub-resource reads only
  state_machine_shape: branching             # Flight forks at WEATHER_REVIEW; Reservation runs parallel payment dimension
  relationship_patterns:
    - one_to_many                            # Flight → Reservation → Passenger / Refund / PhotoPackageRecord
    - cross_aggregate                        # Flight references LaunchSite, Balloon, Pilot
  role_model: peer_roles                     # OperationsManager / Pilot / Customer / ChaseCrewLead own distinct surfaces
  consistency_model: immediate               # all side effects visible in the same request/response

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: LaunchSite
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Launch site display name" }
      - { name: surface_wind_limit_kts, type: integer, source: input, description: "Max surface wind (kts) the site tolerates" }
      - { name: aloft_wind_limit_kts, type: integer, source: input, description: "Max winds-aloft (kts) the site tolerates" }
      - { name: per_use_fee_cents, type: integer, source: input, description: "Landowner fee charged per published flight, in cents" }
      - { name: permission_status, type: enum, source: system, description: "PENDING | GRANTED | REVOKED — landowner permission lifecycle", default: PENDING }
      - { name: permission_granted_at, type: datetime, source: system, description: "Clock timestamp when permission last entered GRANTED; null until first grant" }
      - { name: permission_expires_on, type: string, source: input, description: "ISO date (YYYY-MM-DD) after which permission is no longer valid" }

  - name: Balloon
    parent: null
    common_fields: true
    fields:
      - { name: registration, type: string, source: input, description: "FAA tail number" }
      - { name: basket_capacity_passengers, type: integer, source: input, description: "Maximum passenger seats in the basket" }
      - { name: max_gross_weight_lbs, type: integer, source: input, description: "Certified max gross weight (envelope + basket + fuel + passengers)" }
      - { name: empty_weight_lbs, type: integer, source: input, description: "Aircraft empty weight in lbs" }
      - { name: status, type: enum, source: system, description: "ACTIVE | GROUNDED", default: ACTIVE }
      - { name: last_inspection_on, type: string, source: system, description: "ISO date of most recent RECORD_INSPECTION event; null until inspected" }
      - { name: inspection_due_on, type: string, source: computed, description: "last_inspection_on + 365 days; null until first inspection" }

  - name: Pilot
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Pilot full name" }
      - { name: certificate_number, type: string, source: input, description: "FAA certificate number" }
      - { name: medical_expires_on, type: string, source: input, description: "ISO date the medical certificate expires" }
      - { name: external_pic_hours_180d, type: number, source: input, description: "Pilot-in-command hours flown elsewhere in trailing 180 days", default: 0 }
      - { name: external_takeoffs_landings_90d, type: integer, source: input, description: "Takeoffs/landings flown elsewhere in trailing 90 days", default: 0 }
      - { name: internal_pic_hours_180d, type: number, source: computed, description: "PIC hours from this operator's CLOSED flights with scheduled_date in trailing 180 days (duration_hours summed)" }
      - { name: internal_takeoffs_landings_90d, type: integer, source: computed, description: "Count of this operator's CLOSED flights for this pilot with scheduled_date in trailing 90 days" }
      - { name: pic_hours_180d_total, type: number, source: computed, description: "external_pic_hours_180d + internal_pic_hours_180d" }
      - { name: takeoffs_landings_90d_total, type: integer, source: computed, description: "external_takeoffs_landings_90d + internal_takeoffs_landings_90d" }
      - { name: faa_currency_met, type: boolean, source: computed, description: "true iff takeoffs_landings_90d_total >= 3" }
      - { name: operator_currency_met, type: boolean, source: computed, description: "true iff pic_hours_180d_total >= 12.0" }
      - { name: currency_status, type: enum, source: computed, description: "CURRENT iff faa_currency_met AND operator_currency_met, else EXPIRED" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Customer full name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: wallet_credit_cents, type: integer, source: system, description: "Operator-held credit balance; increased by fare overpayment settle-down, goodwill credits, and refunds paid via WALLET_CREDIT", default: 0 }

  - name: Flight
    parent: null
    common_fields: true
    fields:
      - { name: scheduled_date, type: string, source: input, description: "ISO date (YYYY-MM-DD) of the launch" }
      - { name: dawn_window_start, type: datetime, source: input, description: "ISO8601 UTC launch-window open; date portion must equal scheduled_date" }
      - { name: dawn_window_end, type: datetime, source: input, description: "ISO8601 UTC launch-window close; must be exactly 90 minutes after dawn_window_start" }
      - { name: launch_site_id, type: string, source: input, description: "FK -> LaunchSite.id; selected at create, changeable via select-launch-site" }
      - { name: balloon_id, type: string, source: input, description: "FK -> Balloon.id" }
      - { name: pilot_id, type: string, source: input, description: "FK -> Pilot.id" }
      - { name: kind, type: enum, source: input, description: "SHARED | CHARTER — shared-basket per-seat sales vs whole-basket charter" }
      - { name: fuel_lbs, type: integer, source: input, description: "Fuel weight carried, in lbs", default: 200 }
      - { name: status, type: enum, source: system, description: "DRAFT | SCHEDULED | WEATHER_REVIEW | CLEARED_FOR_LAUNCH | AIRBORNE | LANDED | CLOSED | NO_GO | CANCELLED", default: DRAFT }
      - { name: season_tier, type: enum, source: computed, description: "PEAK if scheduled_date falls in Oct 1–14 (Balloon Fiesta), else REGULAR" }
      - { name: seats_sold, type: integer, source: computed, description: "Sum of party_size over reservations with booking_status in {PENDING, CONFIRMED, CHECKED_IN, FLOWN, COMPLETED}" }
      - { name: seats_available, type: integer, source: computed, description: "balloon.basket_capacity_passengers - seats_sold" }
      - { name: payload_used_lbs, type: integer, source: computed, description: "balloon.empty_weight_lbs + fuel_lbs + sum of passenger weights over CHECKED_IN / FLOWN / COMPLETED reservations" }
      - { name: weather_decision, type: enum, source: system, description: "NONE | GO | NO_GO", default: NONE }
      - { name: weather_decision_at, type: datetime, source: system, description: "Clock timestamp of the go/no-go decision; null until decided" }
      - { name: cancel_reason, type: enum, source: system, description: "WEATHER | AIRCRAFT | OPERATOR — set when flight is CANCELLED", default: null }
      - { name: duration_hours, type: number, source: input, description: "Actual flight hours, recorded at LAND; feeds pilot internal currency", default: null }

  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - { name: flight_id, type: string, source: system, description: "FK -> Flight.id; taken from the create path" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; must equal the acting Customer's X-User-ID" }
      - { name: party_size, type: integer, source: input, description: "Number of passengers in the party" }
      - { name: declared_weight_lbs, type: integer, source: input, description: "Total party weight declared at booking; drives the provisional fare quote" }
      - { name: photo_package_tier, type: enum, source: input, description: "NONE | STANDARD | DELUXE", default: NONE }
      - { name: booking_status, type: enum, source: system, description: "PENDING | CONFIRMED | CHECKED_IN | FLOWN | COMPLETED | CANCELLED", default: PENDING }
      - { name: payment_status, type: enum, source: system, description: "UNPAID | PAID | PARTIALLY_REFUNDED | REFUNDED — evolves independently of booking_status", default: UNPAID }
      - { name: quoted_fare_cents, type: integer, source: computed, description: "Provisional fare at creation, computed from declared_weight_lbs" }
      - { name: final_fare_cents, type: integer, source: computed, description: "Final fare at CHECK_IN, computed from actual Passenger weights; null until check-in" }
      - { name: paid_cents, type: integer, source: system, description: "Cash actually collected; set at CONFIRM, adjusted by check-in settle delta", default: 0 }
      - { name: refunded_cents, type: integer, source: system, description: "Total refunded across PAID refunds", default: 0 }
      - { name: goodwill_credit_cents, type: integer, source: system, description: "Operator goodwill credited on OPERATOR_CANCEL (10% of paid)", default: 0 }
      - { name: retained_revenue_cents, type: integer, source: computed, description: "paid_cents - refunded_cents" }
      - { name: cancel_reason, type: enum, source: system, description: "WEATHER_CANCEL | OPERATOR_CANCEL | CUSTOMER_CANCEL_EARLY | CUSTOMER_CANCEL_LATE — set on cancel", default: null }

  - name: Passenger
    parent: null
    common_fields: false   # id, created_at only — manifest entries are immutable
    fields:
      - { name: reservation_id, type: string, source: system, description: "FK -> Reservation.id; taken from the create path" }
      - { name: name, type: string, source: input, description: "Passenger full name" }
      - { name: weight_lbs, type: integer, source: input, description: "Actual passenger weight in lbs" }
      - { name: is_minor, type: boolean, source: input, description: "Whether the passenger is under 18", default: false }

  - name: WeatherBriefing
    parent: null
    common_fields: false   # append-only observation log
    fields:
      - { name: flight_id, type: string, source: system, description: "FK -> Flight.id; taken from the create path" }
      - { name: observed_at, type: datetime, source: system, description: "Clock timestamp when the briefing was recorded" }
      - { name: surface_wind_kts, type: integer, source: input, description: "Observed surface wind in knots" }
      - { name: aloft_wind_kts, type: integer, source: input, description: "Observed winds aloft in knots" }
      - { name: visibility_mi, type: number, source: input, description: "Observed visibility in statute miles" }
      - { name: precipitation, type: boolean, source: input, description: "Whether precipitation is occurring" }
      - { name: decision, type: enum, source: computed, description: "GO iff surface_wind_kts <= site.surface_wind_limit_kts AND aloft_wind_kts <= site.aloft_wind_limit_kts AND visibility_mi >= 3.0 AND precipitation == false; else NO_GO" }
      - { name: status, type: enum, source: system, description: "RECORDED | SUPERSEDED — newer briefing on same flight supersedes older ones", default: RECORDED }

  - name: ChaseAssignment
    parent: null
    common_fields: true
    fields:
      - { name: flight_id, type: string, source: system, description: "FK -> Flight.id; taken from the create path" }
      - { name: crew_lead_name, type: string, source: input, description: "Chase crew lead name" }
      - { name: vehicle_id, type: string, source: input, description: "Chase vehicle identifier" }
      - { name: crew_size, type: integer, source: input, description: "Number of chase crew members" }
      - { name: status, type: enum, source: system, description: "ASSIGNED | EN_ROUTE | AT_LANDING | RECOVERED | DEBRIEFED", default: ASSIGNED }
      - { name: landing_lat, type: number, source: input, description: "Landing latitude recorded at ARRIVE_AT_LANDING", default: null }
      - { name: landing_lon, type: number, source: input, description: "Landing longitude recorded at ARRIVE_AT_LANDING", default: null }

  - name: Refund
    parent: null
    common_fields: true
    fields:
      - { name: reservation_id, type: string, source: system, description: "FK -> Reservation.id; set by the cascade that creates the refund" }
      - { name: reason, type: enum, source: system, description: "WEATHER_CANCEL | OPERATOR_CANCEL | CUSTOMER_CANCEL_EARLY | CUSTOMER_CANCEL_LATE" }
      - { name: requested_amount_cents, type: integer, source: computed, description: "Policy-computed amount from refund_amount calculation at creation" }
      - { name: approved_amount_cents, type: integer, source: input, description: "Amount approved by OperationsManager; must be <= requested_amount_cents", default: null }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | PAID | DENIED", default: REQUESTED }
      - { name: paid_via, type: enum, source: input, description: "ORIGINAL_PAYMENT | WALLET_CREDIT — set at PAY", default: null }
      - { name: paid_at, type: datetime, source: system, description: "Clock timestamp when paid; null until PAID", default: null }

  - name: PhotoPackageRecord
    parent: null
    common_fields: false   # created by cascade, delivered by cascade
    fields:
      - { name: reservation_id, type: string, source: system, description: "FK -> Reservation.id" }
      - { name: tier, type: enum, source: system, description: "STANDARD | DELUXE — copied from reservation.photo_package_tier at creation" }
      - { name: photo_count, type: integer, source: system, description: "Photos delivered; copied from COMPLETE event payload", default: 0 }
      - { name: status, type: enum, source: system, description: "PENDING | DELIVERED", default: PENDING }
      - { name: delivered_at, type: datetime, source: system, description: "Clock timestamp of delivery; null until DELIVERED", default: null }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Flight
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /v1/flights/{flight_id}/events (PUBLISH)"
        actor: OperationsManager
        preconditions:
          - "launch_site.permission_status == GRANTED"
          - "launch_site.permission_expires_on >= scheduled_date"
          - "balloon.status == ACTIVE"
          - "balloon.inspection_due_on is not null and balloon.inspection_due_on >= scheduled_date"
          - "pilot.currency_status == CURRENT"
          - "no other Flight with same balloon_id and status in {SCHEDULED, WEATHER_REVIEW, CLEARED_FOR_LAUNCH, AIRBORNE} has overlapping [dawn_window_start, dawn_window_end) — half-open"
          - "no other Flight with same pilot_id and status in {SCHEDULED, WEATHER_REVIEW, CLEARED_FOR_LAUNCH, AIRBORNE} has the same scheduled_date"
        side_effects:
          - "Flight.version increments"

      - from: SCHEDULED
        to: WEATHER_REVIEW
        trigger: "POST /v1/flights/{flight_id}/events (ENTER_WEATHER_REVIEW)"
        actor: Pilot
        preconditions:
          - "acting pilot's X-User-ID == flight.pilot_id"
          - "dawn_window_start <= now <= dawn_window_end (inclusive both ends)"
        side_effects: []

      - from: WEATHER_REVIEW
        to: CLEARED_FOR_LAUNCH
        trigger: "POST /v1/flights/{flight_id}/events (RECORD_GO)"
        actor: Pilot
        preconditions:
          - "acting pilot's X-User-ID == flight.pilot_id"
          - "now <= dawn_window_end"
          - "latest WeatherBriefing (by observed_at) for this flight has status == RECORDED and decision == GO"
        side_effects:
          - "weather_decision = GO, weather_decision_at = now"

      - from: WEATHER_REVIEW
        to: NO_GO
        trigger: "POST /v1/flights/{flight_id}/events (RECORD_NO_GO)"
        actor: Pilot
        preconditions:
          - "acting pilot's X-User-ID == flight.pilot_id"
        side_effects:
          - "weather_decision = NO_GO, weather_decision_at = now"
          - "Reservations with booking_status in {PENDING, CONFIRMED} stay attached (they ride along on RESCHEDULE or refund on CANCEL)"

      - from: NO_GO
        to: SCHEDULED
        trigger: "POST /v1/flights/{flight_id}/events (RESCHEDULE with new scheduled_date and dawn window)"
        actor: OperationsManager
        preconditions:
          - "new dawn_window_end - new dawn_window_start == 90 minutes"
          - "balloon and pilot free under the same overlap rules as PUBLISH"
        side_effects:
          - "scheduled_date, dawn_window_start, dawn_window_end replaced"
          - "season_tier recomputed from new scheduled_date"
          - "weather_decision reset to NONE, weather_decision_at reset to null"
          - "attached reservations keep booking_status and paid_cents (no automatic refund on reschedule)"

      - from: NO_GO
        to: CANCELLED
        trigger: "POST /v1/flights/{flight_id}/events (CANCEL)"
        actor: OperationsManager
        preconditions: []
        side_effects:
          - "cancel_reason = WEATHER"
          - "cascade: every Reservation with booking_status in {PENDING, CONFIRMED, CHECKED_IN} → CANCELLED with cancel_reason = WEATHER_CANCEL"
          - "cascade: for each such reservation with payment_status == PAID, a Refund is created (REQUESTED, reason WEATHER_CANCEL, requested_amount_cents = paid_cents)"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /v1/flights/{flight_id}/events (CANCEL)"
        actor: OperationsManager
        preconditions: []
        side_effects:
          - "cancel_reason = OPERATOR"
          - "cascade: every Reservation with booking_status in {PENDING, CONFIRMED, CHECKED_IN} → CANCELLED with cancel_reason = OPERATOR_CANCEL"
          - "cascade: for each such reservation with payment_status == PAID, a Refund is created (REQUESTED, reason OPERATOR_CANCEL, requested_amount_cents = paid_cents) and reservation.goodwill_credit_cents = round_half_up(paid_cents * 0.10)"

      - from: CLEARED_FOR_LAUNCH
        to: AIRBORNE
        trigger: "POST /v1/flights/{flight_id}/events (LAUNCH)"
        actor: Pilot
        preconditions:
          - "acting pilot's X-User-ID == flight.pilot_id"
          - "now <= dawn_window_end"
          - "at least one ChaseAssignment for this flight with status in {ASSIGNED, EN_ROUTE}"
          - "payload_used_lbs <= balloon.max_gross_weight_lbs"
        side_effects: []

      - from: AIRBORNE
        to: LANDED
        trigger: "POST /v1/flights/{flight_id}/events (LAND with duration_hours)"
        actor: Pilot
        preconditions:
          - "acting pilot's X-User-ID == flight.pilot_id"
        side_effects:
          - "duration_hours recorded on the flight"

      - from: LANDED
        to: CLOSED
        trigger: "POST /v1/flights/{flight_id}/events (CLOSE)"
        actor: OperationsManager
        preconditions:
          - "every ChaseAssignment for this flight has status in {RECOVERED, DEBRIEFED}"
          - "every Reservation with booking_status == CHECKED_IN has been advanced to FLOWN (or CANCELLED)"
        side_effects:
          - "pilot.internal_pic_hours_180d and internal_takeoffs_landings_90d recomputed (this flight now contributes)"
          - "pilot currency fields recomputed"

  - entity: Reservation
    initial_state: PENDING
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /v1/reservations/{reservation_id}/events (CONFIRM with paid_cents)"
        actor: Customer
        preconditions:
          - "acting customer's X-User-ID == reservation.customer_id"
          - "paid_cents == quoted_fare_cents"
          - "flight.status == SCHEDULED"
        side_effects:
          - "payment_status: UNPAID → PAID"
          - "paid_cents recorded"

      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /v1/reservations/{reservation_id}/events (CHECK_IN with additional_paid_cents)"
        actor: OperationsManager
        preconditions:
          - "flight.status in {WEATHER_REVIEW, CLEARED_FOR_LAUNCH}"
          - "Passenger count for this reservation == party_size"
          - "prospective payload = flight.payload_used_lbs + sum(this reservation's passenger weights) <= balloon.max_gross_weight_lbs"
        side_effects:
          - "final_fare_cents computed from actual passenger weights (fare_quote final variant)"
          - "settle delta = final_fare_cents - paid_cents; if delta > 0, additional_paid_cents must equal delta and paid_cents increases; if delta < 0, customer.wallet_credit_cents increases by -delta and paid_cents decreases"
          - "flight.payload_used_lbs recomputed"

      - from: CHECKED_IN
        to: FLOWN
        trigger: "POST /v1/reservations/{reservation_id}/events (MARK_FLOWN)"
        actor: OperationsManager
        preconditions:
          - "flight.status == LANDED"
        side_effects: []

      - from: FLOWN
        to: COMPLETED
        trigger: "POST /v1/reservations/{reservation_id}/events (COMPLETE with photo_count)"
        actor: OperationsManager
        preconditions:
          - "flight.status == LANDED"
        side_effects:
          - "post-flight ceremony recorded"
          - "if a PhotoPackageRecord exists for this reservation in PENDING, it → DELIVERED with photo_count from the event payload and delivered_at = now"

      - from: PENDING
        to: CANCELLED
        trigger: "POST /v1/reservations/{reservation_id}/events (CANCEL)"
        actor: Customer
        preconditions:
          - "acting customer's X-User-ID == reservation.customer_id"
        side_effects:
          - "no refund created (nothing paid)"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /v1/reservations/{reservation_id}/events (CANCEL)"
        actor: Customer
        preconditions:
          - "acting customer's X-User-ID == reservation.customer_id"
        side_effects:
          - "cancel_reason = CUSTOMER_CANCEL_EARLY if now < flight.dawn_window_start - 24h, else CUSTOMER_CANCEL_LATE"
          - "CUSTOMER_CANCEL_EARLY: Refund created (REQUESTED, requested_amount_cents per refund_amount 80% per-passenger-first rule)"
          - "CUSTOMER_CANCEL_LATE: no Refund created; payment_status stays PAID (fare forfeited)"
          - "flight.payload_used_lbs and seats recomputed"

      - from: "CONFIRMED or CHECKED_IN"
        to: CANCELLED
        trigger: "system (flight CANCEL cascade: weather or operator)"
        actor: system
        preconditions: []
        side_effects:
          - "cancel_reason copied from cascade (WEATHER_CANCEL or OPERATOR_CANCEL)"
          - "Refund auto-created for PAID reservations per flight-cancel side effects"

  - entity: ReservationPayment
    note: "Parallel state dimension on Reservation (payment_status), evolving independently of booking_status"
    initial_state: UNPAID
    terminal_states: [REFUNDED]
    transitions:
      - from: UNPAID
        to: PAID
        trigger: "Reservation CONFIRM event"
        actor: Customer
        preconditions: ["paid_cents == quoted_fare_cents"]
        side_effects: []
      - from: PAID
        to: PARTIALLY_REFUNDED
        trigger: "system (Refund PAY where approved_amount_cents < paid_cents)"
        actor: system
        preconditions: []
        side_effects: ["reservation.refunded_cents += approved_amount_cents"]
      - from: PAID
        to: REFUNDED
        trigger: "system (Refund PAY where approved_amount_cents == paid_cents)"
        actor: system
        preconditions: []
        side_effects: ["reservation.refunded_cents += approved_amount_cents"]
      - from: PARTIALLY_REFUNDED
        to: REFUNDED
        trigger: "system (subsequent Refund PAY bringing cumulative refunded_cents == paid_cents)"
        actor: system
        preconditions: []
        side_effects: ["reservation.refunded_cents += approved_amount_cents"]

  - entity: Balloon
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: GROUNDED
        trigger: "POST /v1/balloons/{balloon_id}/events (GROUND)"
        actor: OperationsManager
        preconditions: []
        side_effects:
          - "cascade: every Flight with this balloon_id and status == SCHEDULED → CANCELLED with cancel_reason = AIRCRAFT"
          - "cascade continues: those flights' Reservations in {PENDING, CONFIRMED, CHECKED_IN} → CANCELLED with cancel_reason = OPERATOR_CANCEL"
          - "cascade continues: Refunds auto-created (REQUESTED, OPERATOR_CANCEL) for PAID reservations, goodwill_credit_cents = round_half_up(paid_cents * 0.10)"

      - from: GROUNDED
        to: ACTIVE
        trigger: "POST /v1/balloons/{balloon_id}/events (RETURN_TO_SERVICE)"
        actor: OperationsManager
        preconditions:
          - "balloon.last_inspection_on is not null"
          - "balloon.inspection_due_on >= current date"
        side_effects: []

  - entity: LaunchSite
    field: permission_status
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: GRANTED
        trigger: "POST /v1/launch-sites/{site_id}/events (GRANT_PERMISSION)"
        actor: OperationsManager
        preconditions: []
        side_effects: ["permission_granted_at = now"]
      - from: GRANTED
        to: REVOKED
        trigger: "POST /v1/launch-sites/{site_id}/events (REVOKE_PERMISSION)"
        actor: OperationsManager
        preconditions: []
        side_effects: []
      - from: REVOKED
        to: GRANTED
        trigger: "POST /v1/launch-sites/{site_id}/events (GRANT_PERMISSION)"
        actor: OperationsManager
        preconditions: []
        side_effects: ["permission_granted_at = now"]

  - entity: WeatherBriefing
    initial_state: RECORDED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: RECORDED
        to: SUPERSEDED
        trigger: "system (a newer WeatherBriefing is created for the same flight)"
        actor: system
        preconditions: []
        side_effects: ["prior RECORDED briefing → SUPERSEDED; only one RECORDED briefing per flight at a time"]

  - entity: ChaseAssignment
    initial_state: ASSIGNED
    terminal_states: [DEBRIEFED]
    transitions:
      - from: ASSIGNED
        to: EN_ROUTE
        trigger: "POST /v1/chase-assignments/{assignment_id}/events (DISPATCH)"
        actor: ChaseCrewLead
        preconditions: []
        side_effects: []
      - from: EN_ROUTE
        to: AT_LANDING
        trigger: "POST /v1/chase-assignments/{assignment_id}/events (ARRIVE_AT_LANDING with landing_lat, landing_lon)"
        actor: ChaseCrewLead
        preconditions:
          - "flight.status in {AIRBORNE, LANDED}"
        side_effects: ["landing_lat / landing_lon recorded"]
      - from: AT_LANDING
        to: RECOVERED
        trigger: "POST /v1/chase-assignments/{assignment_id}/events (RECOVER)"
        actor: ChaseCrewLead
        preconditions: []
        side_effects: []
      - from: RECOVERED
        to: DEBRIEFED
        trigger: "POST /v1/chase-assignments/{assignment_id}/events (DEBRIEF)"
        actor: ChaseCrewLead
        preconditions: []
        side_effects: []

  - entity: Refund
    initial_state: REQUESTED
    terminal_states: [PAID, DENIED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /v1/refunds/{refund_id}/events (APPROVE with approved_amount_cents)"
        actor: OperationsManager
        preconditions:
          - "approved_amount_cents <= requested_amount_cents"
        side_effects: []
      - from: APPROVED
        to: PAID
        trigger: "POST /v1/refunds/{refund_id}/events (PAY with paid_via)"
        actor: OperationsManager
        preconditions: []
        side_effects:
          - "paid_at = now"
          - "reservation.refunded_cents += approved_amount_cents; payment_status → PARTIALLY_REFUNDED or REFUNDED"
          - "if paid_via == WALLET_CREDIT: customer.wallet_credit_cents += approved_amount_cents"
          - "if reason == OPERATOR_CANCEL: customer.wallet_credit_cents += reservation.goodwill_credit_cents (regardless of paid_via)"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /v1/refunds/{refund_id}/events (DENY)"
        actor: OperationsManager
        preconditions: []
        side_effects: []

  - entity: PhotoPackageRecord
    initial_state: PENDING
    terminal_states: [DELIVERED]
    transitions:
      - from: PENDING
        to: DELIVERED
        trigger: "system (Reservation COMPLETE event)"
        actor: system
        preconditions: []
        side_effects: ["photo_count set from COMPLETE payload", "delivered_at = now"]

# =============================================================================
# Concurrency Rules (OCC — true races only; see §1.2.1 filter)
# =============================================================================
concurrency_rules:
  - rule_id: flight-site-select-stale-version
    parent_entity: Flight
    write_endpoint: "POST /v1/flights/{flight_id}/select-launch-site"
    occ_field: expected_flight_version
    description: |
      Selecting a launch site against a Flight whose version has advanced since
      the client last observed it is rejected. Both an earlier site selection
      and a fresh read are legitimate product operations, so the stale write
      cannot be detected from state alone — only from the version check.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: balloon-inspection-stale-version
    parent_entity: Balloon
    write_endpoint: "POST /v1/balloons/{balloon_id}/events (RECORD_INSPECTION)"
    occ_field: expected_balloon_version
    description: |
      Recording an inspection against a Balloon whose version has advanced since
      the client last observed it is rejected. Recording a second inspection is
      itself a legitimate operation, so the stale write can only be detected by
      the version check, not by any state field.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: fare_quote
    trigger: "reservation creation (provisional variant → quoted_fare_cents) and CHECK_IN (final variant → final_fare_cents)"
    algorithm: tiered_pricing
    formula: |
      season_tier = flight.season_tier   # PEAK if scheduled_date in Oct 1..14, else REGULAR
      if flight.kind == SHARED:
          base_per_person = 39900 if season_tier == PEAK else 29900
          avg_weight = total_party_weight_lbs / party_size   # see variants for which weight
          weight_surcharge_per_person = 2500 if avg_weight > 200 else 0
          photo_add_on = 0 if tier NONE, 4900 if STANDARD, 9900 if DELUXE
          fare = party_size * (base_per_person + weight_surcharge_per_person) + photo_add_on
      if flight.kind == CHARTER:
          cap = balloon.basket_capacity_passengers
          flat = 120000 if cap <= 4; 180000 if cap <= 8; else 250000
          fare = round_half_up(flat * 1.25) if season_tier == PEAK else flat
          fare = fare + photo_add_on
    input_set: "the reservation, its flight (season_tier, kind), and the flight's balloon (capacity); party weight source varies by variant"
    constants:
      BASE_FARE_PEAK_PER_PERSON_CENTS: 39900
      BASE_FARE_REGULAR_PER_PERSON_CENTS: 29900
      WEIGHT_SURCHARGE_THRESHOLD_LBS: 200
      WEIGHT_SURCHARGE_PER_PERSON_CENTS: 2500
      CHARTER_FLAT_SMALL_CENTS: 120000
      CHARTER_FLAT_MEDIUM_CENTS: 180000
      CHARTER_FLAT_LARGE_CENTS: 250000
      CHARTER_PEAK_MULTIPLIER: 1.25
      PHOTO_STANDARD_CENTS: 4900
      PHOTO_DELUXE_CENTS: 9900
    precision: "integer cents, round_half_up wherever division or multiplication produces a fraction"
    variants:
      - name: provisional
        when: "reservation creation"
        difference: "total_party_weight_lbs = reservation.declared_weight_lbs (declared at booking)"
      - name: final
        when: "CHECK_IN"
        difference: "total_party_weight_lbs = sum of Passenger.weight_lbs for the reservation (actual weighed passengers)"

  - name: refund_amount
    trigger: "refund auto-creation (cancel cascades and customer cancels)"
    algorithm: aggregation
    formula: |
      policy_pct: WEATHER_CANCEL = 100, OPERATOR_CANCEL = 100,
                  CUSTOMER_CANCEL_EARLY = 80, CUSTOMER_CANCEL_LATE = 0
      if policy_pct == 0: no Refund record is created (fare forfeited)
      if flight.kind == CHARTER:
          requested_amount_cents = round_half_up(paid_cents * policy_pct / 100)
      else (SHARED):
          if policy_pct == 100:
              requested_amount_cents = paid_cents            # full-fare carve-out
          else:
              per_passenger_paid = round_half_up(paid_cents / party_size)
              per_passenger_refund = round_half_up(per_passenger_paid * policy_pct / 100)
              requested_amount_cents = per_passenger_refund * party_size
      # rounding order is pinned: round per passenger FIRST, then multiply.
      # total-then-round is a different answer and is NOT the spec.
    input_set: "the cancelled reservation (paid_cents, party_size, flight.kind) and the cancel reason"
    constants:
      REFUND_WEATHER_PCT: 100
      REFUND_OPERATOR_PCT: 100
      REFUND_CUSTOMER_EARLY_PCT: 80
      REFUND_CUSTOMER_LATE_PCT: 0
      GOODWILL_OPERATOR_PCT: 10
      CUSTOMER_CANCEL_LATE_HOURS: 24
    precision: "integer cents, round_half_up, per-passenger before multiply"

  - name: pilot_currency
    trigger: "pilot read, flight PUBLISH precondition, and flight CLOSE (after internal hours change)"
    algorithm: threshold
    formula: |
      pic_hours_180d_total = external_pic_hours_180d + internal_pic_hours_180d
      takeoffs_landings_90d_total = external_takeoffs_landings_90d + internal_takeoffs_landings_90d
      faa_currency_met      = (takeoffs_landings_90d_total >= 3)     # FAA-style recency
      operator_currency_met = (pic_hours_180d_total >= 12.0)         # operator rolling-hours method
      currency_status = CURRENT iff faa_currency_met AND operator_currency_met else EXPIRED
    input_set: "pilot external experience inputs plus CLOSED flights for this pilot with scheduled_date inside the trailing 180-day (hours) or 90-day (takeoffs/landings) windows relative to current clock date"
    constants:
      FAA_MIN_TAKEOFFS_LANDINGS_90D: 3
      OPERATOR_MIN_PIC_HOURS_180D: 12.0
    precision: "hours to 1 decimal place; counts are integers"
    variants:
      - name: faa_strict
        when: "faa_currency_met"
        difference: "currency keyed on takeoffs/landings count only; ignores hours"
      - name: operator_rolling
        when: "operator_currency_met"
        difference: "currency keyed on rolling PIC hours only; ignores takeoffs/landings count — the two methods diverge on the same pilot record"

  - name: payload_used
    trigger: "CHECK_IN (prospective check), LAUNCH precondition, passenger add/remove"
    algorithm: aggregation
    formula: |
      payload_used_lbs = balloon.empty_weight_lbs + flight.fuel_lbs
                         + sum(Passenger.weight_lbs for passengers whose reservation
                               belongs to this flight and has booking_status in
                               {CHECKED_IN, FLOWN, COMPLETED})
      prospective check at CHECK_IN: payload_used_lbs + sum(this reservation's
      passenger weights) <= balloon.max_gross_weight_lbs   # <= is inclusive: exactly at max is allowed
    input_set: "flight's balloon, flight.fuel_lbs, passengers of reservations in {CHECKED_IN, FLOWN, COMPLETED}"
    constants: {}
    precision: "integer lbs"

  - name: site_candidacy
    trigger: "GET /v1/flights/{flight_id}/site-candidates and select-launch-site when launch_site_id omitted"
    algorithm: weighted_scoring
    formula: |
      eligibility filter:
        site.permission_status == GRANTED
        AND site.permission_expires_on >= flight.scheduled_date
        AND (no RECORDED briefing exists for the flight
             OR (site.surface_wind_limit_kts >= briefing.surface_wind_kts
                 AND site.aloft_wind_limit_kts >= briefing.aloft_wind_kts))
      ranking (when a RECORDED briefing exists):
        wind_margin_kts = min(site.surface_wind_limit_kts - briefing.surface_wind_kts,
                              site.aloft_wind_limit_kts - briefing.aloft_wind_kts)
        sort by wind_margin_kts DESC
      tie-break: permission_granted_at ASC (earliest grant wins); created_at ASC as final fallback
      empty-pool fallback: ERR_NO_SUITABLE_SITE
    input_set: "all LaunchSites, the flight, and the flight's latest RECORDED WeatherBriefing if any"
    constants: {}
    precision: "integer knots"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "acting role is in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "path resource ids exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 4
    category: existence
    check: "request body is valid JSON with all required fields of the right types; enum fields take declared values; dawn_window_end - dawn_window_start == 90 minutes; dawn_window_start date == scheduled_date"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a body"

  - priority: 5
    category: existence
    check: "OCC expected_*_version matches the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /v1/flights/{flight_id}/select-launch-site, POST /v1/balloons/{balloon_id}/events (RECORD_INSPECTION)"

  - priority: 6
    category: state
    check: "entity-backed actor owns the target: Customer acting on a Reservation must match reservation.customer_id (ERR_RESERVATION_NOT_OWNED); Pilot acting on a Flight must match flight.pilot_id (ERR_FLIGHT_NOT_ASSIGNED)"
    error_id: ERR_RESERVATION_NOT_OWNED
    http_status: 403
    applies_to: "Customer-scoped reservation endpoints; Pilot-scoped flight endpoints"

  - priority: 7
    category: state
    check: "target resource is in a valid from-state for the requested transition (event not applicable to current status)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all event endpoints"

  - priority: 8
    category: business_safety
    check: "pilot.currency_status == CURRENT for flight PUBLISH"
    error_id: ERR_PILOT_NOT_CURRENT
    http_status: 409
    applies_to: "POST /v1/flights/{flight_id}/events (PUBLISH)"

  - priority: 9
    category: business_safety
    check: "balloon.status == ACTIVE and balloon.inspection_due_on >= scheduled_date for flight PUBLISH; balloon.last_inspection_on present and inspection_due_on >= today for RETURN_TO_SERVICE"
    error_id: ERR_BALLOON_GROUNDED
    http_status: 409
    applies_to: "POST /v1/flights/{flight_id}/events (PUBLISH), POST /v1/balloons/{balloon_id}/events (RETURN_TO_SERVICE)"

  - priority: 10
    category: business_safety
    check: "launch_site.permission_status == GRANTED and permission_expires_on >= scheduled_date for flight PUBLISH and select-launch-site"
    error_id: ERR_SITE_PERMISSION_NOT_GRANTED
    http_status: 409
    applies_to: "POST /v1/flights/{flight_id}/events (PUBLISH), POST /v1/flights/{flight_id}/select-launch-site"

  - priority: 11
    category: business_safety
    check: "payload: prospective payload_used_lbs <= balloon.max_gross_weight_lbs at CHECK_IN; declared_weight_lbs + empty + fuel <= max_gross at booking"
    error_id: ERR_PAYLOAD_EXCEEDED
    http_status: 422
    applies_to: "POST /v1/flights/{flight_id}/reservations, POST /v1/reservations/{reservation_id}/events (CHECK_IN)"

  - priority: 12
    category: business_safety
    check: "latest RECORDED WeatherBriefing has decision == GO before RECORD_GO; wind readings within site limits"
    error_id: ERR_WEATHER_LIMITS_EXCEEDED
    http_status: 422
    applies_to: "POST /v1/flights/{flight_id}/events (RECORD_GO)"

  - priority: 13
    category: business_safety
    check: "at least one ChaseAssignment with status in {ASSIGNED, EN_ROUTE} exists before LAUNCH"
    error_id: ERR_CHASE_NOT_READY
    http_status: 409
    applies_to: "POST /v1/flights/{flight_id}/events (LAUNCH)"

  - priority: 14
    category: business_temporal
    check: "dawn window: dawn_window_start <= now <= dawn_window_end (inclusive) for ENTER_WEATHER_REVIEW; now <= dawn_window_end for RECORD_GO and LAUNCH"
    error_id: ERR_DAWN_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /v1/flights/{flight_id}/events (ENTER_WEATHER_REVIEW, RECORD_GO, LAUNCH)"

  - priority: 15
    category: business_constraint
    check: "no overlapping flight for the same balloon (half-open [dawn_window_start, dawn_window_end) overlap) among flights in {SCHEDULED, WEATHER_REVIEW, CLEARED_FOR_LAUNCH, AIRBORNE}"
    error_id: ERR_BALLOON_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /v1/flights/{flight_id}/events (PUBLISH, RESCHEDULE)"

  - priority: 16
    category: business_constraint
    check: "no other flight for the same pilot with the same scheduled_date among flights in {SCHEDULED, WEATHER_REVIEW, CLEARED_FOR_LAUNCH, AIRBORNE}"
    error_id: ERR_PILOT_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /v1/flights/{flight_id}/events (PUBLISH, RESCHEDULE)"

  - priority: 17
    category: business_constraint
    check: "seat capacity: SHARED flight — seats_sold + party_size <= balloon.basket_capacity_passengers; CHARTER flight — at most one non-cancelled reservation and party_size <= basket_capacity (second booking → ERR_CHARTER_EXCLUSIVE)"
    error_id: ERR_BASKET_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /v1/flights/{flight_id}/reservations"

  - priority: 18
    category: business_constraint
    check: "manifest completeness: Passenger count == party_size before CHECK_IN"
    error_id: ERR_MANIFEST_INCOMPLETE
    http_status: 422
    applies_to: "POST /v1/reservations/{reservation_id}/events (CHECK_IN)"

  - priority: 19
    category: business_fiscal
    check: "payment exactness: CONFIRM paid_cents == quoted_fare_cents; CHECK_IN additional_paid_cents == max(0, final_fare_cents - paid_cents)"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 402
    applies_to: "POST /v1/reservations/{reservation_id}/events (CONFIRM, CHECK_IN)"

  - priority: 20
    category: business_fiscal
    check: "refund cap: APPROVE approved_amount_cents <= requested_amount_cents"
    error_id: ERR_REFUND_POLICY_VIOLATION
    http_status: 422
    applies_to: "POST /v1/refunds/{refund_id}/events (APPROVE)"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- LaunchSite ---
  - method: POST
    path: "/v1/launch-sites"
    description: "Create a launch site (permission starts PENDING)"
    roles: [OperationsManager]
    code: 201
    input: [name, surface_wind_limit_kts, aloft_wind_limit_kts, per_use_fee_cents, permission_expires_on]
    output: LaunchSite
    side_effects: ["permission_status = PENDING"]

  - method: GET
    path: "/v1/launch-sites/{site_id}"
    description: "Read a launch site"
    roles: [OperationsManager, Pilot, Customer, ChaseCrewLead]
    code: 200
    input: []
    output: LaunchSite
    side_effects: []

  - method: POST
    path: "/v1/launch-sites/{site_id}/events"
    description: "Landowner permission lifecycle: GRANT_PERMISSION, REVOKE_PERMISSION"
    roles: [OperationsManager]
    code: 200
    input: [event_type]
    output: LaunchSite
    side_effects: ["GRANT_PERMISSION: permission_status → GRANTED, permission_granted_at = now", "REVOKE_PERMISSION: → REVOKED"]

  # --- Balloon ---
  - method: POST
    path: "/v1/balloons"
    description: "Register a balloon"
    roles: [OperationsManager]
    code: 201
    input: [registration, basket_capacity_passengers, max_gross_weight_lbs, empty_weight_lbs]
    output: Balloon
    side_effects: ["status = ACTIVE"]

  - method: GET
    path: "/v1/balloons/{balloon_id}"
    description: "Read a balloon"
    roles: [OperationsManager, Pilot, Customer, ChaseCrewLead]
    code: 200
    input: []
    output: Balloon
    side_effects: []

  - method: POST
    path: "/v1/balloons/{balloon_id}/events"
    description: "Balloon lifecycle: RECORD_INSPECTION (with inspected_on date + expected_balloon_version OCC), GROUND, RETURN_TO_SERVICE"
    roles: [OperationsManager]
    code: 200
    input: [event_type, "inspected_on?", "expected_balloon_version?"]
    output: Balloon
    side_effects:
      - "RECORD_INSPECTION: requires expected_balloon_version match; sets last_inspection_on = inspected_on, recomputes inspection_due_on; increments version"
      - "GROUND: status → GROUNDED; cascades SCHEDULED flights → CANCELLED(AIRCRAFT) → reservations CANCELLED(OPERATOR_CANCEL) + refunds"
      - "RETURN_TO_SERVICE: status → ACTIVE (requires current inspection)"

  # --- Pilot ---
  - method: POST
    path: "/v1/pilots"
    description: "Register a pilot with externally-logged experience"
    roles: [OperationsManager]
    code: 201
    input: [name, certificate_number, medical_expires_on, "external_pic_hours_180d?", "external_takeoffs_landings_90d?"]
    output: Pilot
    side_effects: ["currency fields computed"]

  - method: GET
    path: "/v1/pilots/{pilot_id}"
    description: "Read a pilot (including computed currency fields)"
    roles: [OperationsManager, Pilot, Customer, ChaseCrewLead]
    code: 200
    input: []
    output: Pilot
    side_effects: []

  # --- Customer ---
  - method: POST
    path: "/v1/customers"
    description: "Self-register a customer"
    roles: [Anonymous]
    code: 201
    input: [name, email]
    output: Customer
    side_effects: ["wallet_credit_cents = 0"]

  - method: GET
    path: "/v1/customers/{customer_id}"
    description: "Read a customer (wallet balance)"
    roles: [OperationsManager, Pilot, Customer, ChaseCrewLead]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # --- Flight ---
  - method: POST
    path: "/v1/flights"
    description: "Create a flight in DRAFT (dawn window must be exactly 90 minutes, on scheduled_date)"
    roles: [OperationsManager]
    code: 201
    input: [scheduled_date, dawn_window_start, dawn_window_end, launch_site_id, balloon_id, pilot_id, kind, "fuel_lbs?"]
    output: Flight
    side_effects: ["status = DRAFT", "season_tier computed"]

  - method: GET
    path: "/v1/flights"
    description: "List flights; supports filtered reverse-lookup by launch_site_id / balloon_id / pilot_id"
    roles: [OperationsManager, Pilot, Customer, ChaseCrewLead]
    code: 200
    input: ["launch_site_id?", "balloon_id?", "pilot_id?", "status?"]
    output: "Flight[]"
    side_effects: []

  - method: GET
    path: "/v1/flights/{flight_id}"
    description: "Read a flight"
    roles: [OperationsManager, Pilot, Customer, ChaseCrewLead]
    code: 200
    input: []
    output: Flight
    side_effects: []

  - method: POST
    path: "/v1/flights/{flight_id}/events"
    description: "Flight lifecycle events. OperationsManager: PUBLISH, RESCHEDULE (new_scheduled_date, new_dawn_window_start, new_dawn_window_end), CANCEL, CLOSE. Assigned Pilot: ENTER_WEATHER_REVIEW, RECORD_GO, RECORD_NO_GO, LAUNCH, LAND (duration_hours)."
    roles: [OperationsManager, Pilot]
    code: 200
    input: [event_type, "new_scheduled_date?", "new_dawn_window_start?", "new_dawn_window_end?", "duration_hours?"]
    output: Flight
    side_effects:
      - "PUBLISH: DRAFT → SCHEDULED (full precondition battery)"
      - "ENTER_WEATHER_REVIEW: SCHEDULED → WEATHER_REVIEW (dawn-window inclusive)"
      - "RECORD_GO / RECORD_NO_GO: WEATHER_REVIEW → CLEARED_FOR_LAUNCH / NO_GO"
      - "LAUNCH / LAND / CLOSE: CLEARED_FOR_LAUNCH → AIRBORNE → LANDED → CLOSED"
      - "RESCHEDULE: NO_GO → SCHEDULED with new date/window"
      - "CANCEL: {SCHEDULED, NO_GO} → CANCELLED with reservation + refund cascade"

  - method: POST
    path: "/v1/flights/{flight_id}/select-launch-site"
    description: "Change the launch site while SCHEDULED or WEATHER_REVIEW. launch_site_id optional — if omitted, the site_candidacy selector picks the best eligible site. OCC-guarded by expected_flight_version."
    roles: [OperationsManager]
    code: 200
    input: [expected_flight_version, "launch_site_id?"]
    output: Flight
    side_effects: ["launch_site_id updated (explicit or selector-chosen)", "increments Flight.version by 1"]

  - method: GET
    path: "/v1/flights/{flight_id}/site-candidates"
    description: "Ranked eligible launch sites for this flight per the site_candidacy calculation"
    roles: [OperationsManager, Pilot]
    code: 200
    input: []
    output: "{ site_id: string, wind_margin_kts: integer, permission_granted_at: datetime }[]"
    side_effects: []

  # --- Reservation ---
  - method: POST
    path: "/v1/flights/{flight_id}/reservations"
    description: "Book a reservation on a SCHEDULED flight; computes quoted_fare_cents (provisional variant)"
    roles: [Customer]
    code: 201
    input: [customer_id, party_size, declared_weight_lbs, "photo_package_tier?"]
    output: Reservation
    side_effects:
      - "booking_status = PENDING, payment_status = UNPAID"
      - "if photo_package_tier != NONE: a PhotoPackageRecord is cascade-created (PENDING)"
      - "flight seats recomputed"

  - method: GET
    path: "/v1/reservations"
    description: "List reservations; supports filtered reverse-lookup by flight_id / customer_id"
    roles: [OperationsManager, Pilot, Customer, ChaseCrewLead]
    code: 200
    input: ["flight_id?", "customer_id?", "booking_status?"]
    output: "Reservation[]"
    side_effects: []

  - method: GET
    path: "/v1/reservations/{reservation_id}"
    description: "Read a reservation"
    roles: [OperationsManager, Pilot, Customer, ChaseCrewLead]
    code: 200
    input: []
    output: Reservation
    side_effects: []

  - method: POST
    path: "/v1/reservations/{reservation_id}/events"
    description: "Reservation lifecycle. Customer (own): CONFIRM, CANCEL. OperationsManager: CHECK_IN, MARK_FLOWN, COMPLETE."
    roles: [Customer, OperationsManager]
    code: 200
    input: [event_type, "paid_cents?", "additional_paid_cents?", "photo_count?"]
    output: Reservation
    side_effects:
      - "CONFIRM: PENDING → CONFIRMED, payment UNPAID → PAID"
      - "CHECK_IN: CONFIRMED → CHECKED_IN; final fare computed; settle delta collected or wallet-credited"
      - "MARK_FLOWN / COMPLETE: CHECKED_IN → FLOWN → COMPLETED; COMPLETE delivers photo package"
      - "CANCEL: → CANCELLED; early/late customer policy; early creates Refund(REQUESTED)"

  # --- Passenger ---
  - method: POST
    path: "/v1/reservations/{reservation_id}/passengers"
    description: "Add a passenger manifest entry (only while reservation is PENDING or CONFIRMED)"
    roles: [Customer]
    code: 201
    input: [name, weight_lbs, "is_minor?"]
    output: Passenger
    side_effects: []

  - method: GET
    path: "/v1/reservations/{id}/passengers"
    description: "List a reservation's passenger manifest"
    roles: [OperationsManager, Pilot, Customer, ChaseCrewLead]
    code: 200
    input: []
    output: "Passenger[]"
    side_effects: []

  # --- WeatherBriefing ---
  - method: POST
    path: "/v1/flights/{flight_id}/weather-briefings"
    description: "Record a dawn weather observation (assigned pilot only, flight in WEATHER_REVIEW); supersedes any prior RECORDED briefing; decision is computed"
    roles: [Pilot]
    code: 201
    input: [surface_wind_kts, aloft_wind_kts, visibility_mi, precipitation]
    output: WeatherBriefing
    side_effects: ["prior RECORDED briefing → SUPERSEDED"]

  - method: GET
    path: "/v1/flights/{id}/weather-briefings"
    description: "List weather briefings for a flight"
    roles: [OperationsManager, Pilot, Customer, ChaseCrewLead]
    code: 200
    input: []
    output: "WeatherBriefing[]"
    side_effects: []

  # --- ChaseAssignment ---
  - method: POST
    path: "/v1/flights/{flight_id}/chase-assignments"
    description: "Assign a chase crew to a flight"
    roles: [OperationsManager]
    code: 201
    input: [crew_lead_name, vehicle_id, crew_size]
    output: ChaseAssignment
    side_effects: ["status = ASSIGNED"]

  - method: GET
    path: "/v1/flights/{id}/chase-assignments"
    description: "List chase assignments for a flight"
    roles: [OperationsManager, Pilot, Customer, ChaseCrewLead]
    code: 200
    input: []
    output: "ChaseAssignment[]"
    side_effects: []

  - method: POST
    path: "/v1/chase-assignments/{assignment_id}/events"
    description: "Chase crew progress: DISPATCH, ARRIVE_AT_LANDING (landing_lat, landing_lon), RECOVER, DEBRIEF"
    roles: [ChaseCrewLead]
    code: 200
    input: [event_type, "landing_lat?", "landing_lon?"]
    output: ChaseAssignment
    side_effects: []

  # --- Refund ---
  - method: GET
    path: "/v1/reservations/{id}/refunds"
    description: "List refunds for a reservation (refunds are cascade-created by cancels)"
    roles: [OperationsManager, Pilot, Customer, ChaseCrewLead]
    code: 200
    input: []
    output: "Refund[]"
    side_effects: []

  - method: POST
    path: "/v1/refunds/{refund_id}/events"
    description: "Refund processing: APPROVE (approved_amount_cents), PAY (paid_via), DENY"
    roles: [OperationsManager]
    code: 200
    input: [event_type, "approved_amount_cents?", "paid_via?"]
    output: Refund
    side_effects:
      - "APPROVE: REQUESTED → APPROVED (cap: approved <= requested)"
      - "PAY: APPROVED → PAID; reservation.refunded_cents and payment_status updated; wallet credit when WALLET_CREDIT; goodwill credit on OPERATOR_CANCEL"
      - "DENY: REQUESTED → DENIED"

  # --- PhotoPackageRecord ---
  - method: GET
    path: "/v1/reservations/{id}/photo-packages"
    description: "List photo package records for a reservation (cascade-created at booking, delivered at COMPLETE)"
    roles: [OperationsManager, Pilot, Customer, ChaseCrewLead]
    code: 200
    input: []
    output: "PhotoPackageRecord[]"
    side_effects: []

  # --- Test-driving clock ---
  - method: POST
    path: "/v1/_clock/set_current_utc"
    description: "Set the server's logical clock (test-driving). Startup default is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock."
    roles: [OperationsManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["logical clock advanced"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role is not in the endpoint's roles list, or the event_type belongs to a different role" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path id does not resolve to an existing resource" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, bad enum value, or dawn window not exactly 90 minutes / not on scheduled_date" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version" }
  - { id: ERR_RESERVATION_NOT_OWNED, http: 403, condition: "Customer X-User-ID does not match reservation.customer_id" }
  - { id: ERR_FLIGHT_NOT_ASSIGNED, http: 403, condition: "Pilot X-User-ID does not match flight.pilot_id" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource is not in a valid from-state for the requested event" }
  - { id: ERR_PILOT_NOT_CURRENT, http: 409, condition: "pilot.currency_status == EXPIRED at flight PUBLISH" }
  - { id: ERR_BALLOON_GROUNDED, http: 409, condition: "Balloon not ACTIVE, or inspection not current, where required" }
  - { id: ERR_SITE_PERMISSION_NOT_GRANTED, http: 409, condition: "Launch site permission not GRANTED or expired for the scheduled date" }
  - { id: ERR_PAYLOAD_EXCEEDED, http: 422, condition: "Prospective payload exceeds balloon.max_gross_weight_lbs (declared at booking, actual at check-in)" }
  - { id: ERR_WEATHER_LIMITS_EXCEEDED, http: 422, condition: "RECORD_GO attempted while the latest RECORDED briefing's computed decision is NO_GO" }
  - { id: ERR_CHASE_NOT_READY, http: 409, condition: "LAUNCH without any chase assignment in {ASSIGNED, EN_ROUTE}" }
  - { id: ERR_DAWN_WINDOW_EXPIRED, http: 409, condition: "Weather review / GO decision / launch attempted outside the dawn window" }
  - { id: ERR_BALLOON_SCHEDULE_CONFLICT, http: 409, condition: "Balloon already committed to a flight whose half-open dawn window overlaps" }
  - { id: ERR_PILOT_SCHEDULE_CONFLICT, http: 409, condition: "Pilot already committed to a flight on the same scheduled_date" }
  - { id: ERR_BASKET_CAPACITY_EXCEEDED, http: 422, condition: "Party size exceeds remaining basket seats on a SHARED flight" }
  - { id: ERR_CHARTER_EXCLUSIVE, http: 409, condition: "Second non-cancelled reservation attempted on a CHARTER flight, or charter party_size exceeds basket capacity" }
  - { id: ERR_MANIFEST_INCOMPLETE, http: 422, condition: "CHECK_IN with fewer Passenger records than party_size" }
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 402, condition: "paid_cents != quoted_fare_cents at CONFIRM, or additional_paid_cents != required settle delta at CHECK_IN" }
  - { id: ERR_REFUND_POLICY_VIOLATION, http: 422, condition: "APPROVE with approved_amount_cents > requested_amount_cents" }
  - { id: ERR_NO_SUITABLE_SITE, http: 422, condition: "site_candidacy selector pool is empty (no GRANTED, unexpired, wind-compatible site)" }

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: OperationsManager
    description: "Balloon operator's ops desk — manages sites, balloons, pilots, flights, check-in, refunds, chase assignments"
    identity: opaque
    exclusive_operations:
      - "POST /v1/launch-sites, POST /v1/launch-sites/{id}/events"
      - "POST /v1/balloons, POST /v1/balloons/{id}/events"
      - "POST /v1/pilots"
      - "POST /v1/flights, POST /v1/flights/{id}/select-launch-site"
      - "POST /v1/flights/{id}/events (PUBLISH, RESCHEDULE, CANCEL, CLOSE)"
      - "POST /v1/reservations/{id}/events (CHECK_IN, MARK_FLOWN, COMPLETE)"
      - "POST /v1/flights/{id}/chase-assignments"
      - "POST /v1/refunds/{id}/events"
      - "POST /v1/_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"

  - name: Pilot
    description: "Certified balloon pilot assigned to flights; records weather and flies the aircraft"
    identity: "entity_backed:Pilot"
    exclusive_operations:
      - "POST /v1/flights/{id}/events (ENTER_WEATHER_REVIEW, RECORD_GO, RECORD_NO_GO, LAUNCH, LAND) — only when flight.pilot_id == X-User-ID"
      - "POST /v1/flights/{id}/weather-briefings — only when flight.pilot_id == X-User-ID"
    shared_operations:
      - "All GET endpoints"

  - name: Customer
    description: "Paying passenger who books and manages their own reservations"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /v1/flights/{id}/reservations — customer_id must equal X-User-ID"
      - "POST /v1/reservations/{id}/events (CONFIRM, CANCEL) — only own reservations"
      - "POST /v1/reservations/{id}/passengers — only own reservations"
    shared_operations:
      - "All GET endpoints"

  - name: ChaseCrewLead
    description: "Chase crew lead tracking and recovering the balloon after landing"
    identity: opaque
    exclusive_operations:
      - "POST /v1/chase-assignments/{id}/events"
    shared_operations:
      - "All GET endpoints"

  - name: Anonymous
    description: "Unauthenticated visitor; may only self-register as a customer"
    identity: opaque
    exclusive_operations:
      - "POST /v1/customers"
    shared_operations: []
