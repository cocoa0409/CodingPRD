              as: Dispatcher
            - call: "POST /work-orders/${wint_id}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wint_id}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wint_id}/complete"
              payload: { actual_labor_cents: 5000, actual_parts_cents: 1000 }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders"
              payload: { system_id: "${sys_id}", job_type: "STARTUP", estimated_minutes: 30, estimated_cost_cents: 6000 }
              as: Dispatcher
              captures: { start_id: $.data.id }
            - call: "GET /routes/${route_id}"
              payload: {}
              as: Dispatcher
              captures: { rv1: $.data.version }
            - call: "POST /route-stops"
              payload: { route_id: "${route_id}", work_order_id: "${start_id}", arrival_start_sec: 32400, window_minutes: 60, expected_route_version: "${rv1}" }
              as: Dispatcher
            - call: "POST /work-orders/${start_id}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${start_id}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${start_id}/complete"
              payload: { actual_labor_cents: 4000, actual_parts_cents: 0 }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /controller-programs"
              payload: { system_id: "${sys_id}", slots: [ { zone_id: "${z1}", start_sec: 21600, run_minutes: 20 }, { zone_id: "${z2}", start_sec: 22800, run_minutes: 20 } ] }
              as: Dispatcher
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /controller-programs/${prog_id}/activate"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_PROGRAM_SLOT_OVERLAP"
            - "response http status == 409"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: committed_cost_conserved_on_cancel
        grounds:
          - state_machines.WorkOrder.completion_status=PENDING_to_completion_status=CANCELLED
          - entities.IrrigationSystem.fields.committed_cost_cents
          - calculations.quote_total
        distinguishing_aspect: |
          Conserved quantity = money (IrrigationSystem.committed_cost_cents). Creating a WorkOrder
          debits committed_cost_cents by estimated_cost_cents; cancelling it credits exactly that
          back, returning committed_cost_cents to its pre-create value of 0 (invariant:
          committed_cost_cents == sum of estimated_cost_cents over non-terminal WorkOrders).
        test_recipe:
          setup:
            - "A system with one PENDING WorkOrder estimated_cost_cents=3000 → committed_cost_cents=3000."
          setup_api_calls:
            - call: "POST /customers"
              payload: { company_name: "Inv1 Co", contact_email: "i1@x.com", billing_zip: "94016" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", site_address: "19 Inv1 St", lat: 37.7, lng: -122.4 }
              as: Dispatcher
              captures: { prop_id: $.data.id }
            - call: "POST /irrigation-systems"
              payload: { property_id: "${prop_id}", controller_model: "Hunter", static_psi: 60 }
              as: Dispatcher
              captures: { sys_id: $.data.id }
            - call: "POST /work-orders"
              payload: { system_id: "${sys_id}", job_type: "HEAD_REPAIR", estimated_minutes: 20, estimated_cost_cents: 3000 }
              as: Dispatcher
              captures: { wo_id: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo_id}/cancel"
              payload: {}
              as: Dispatcher
          assert:
            - "IrrigationSystem.${sys_id}.committed_cost_cents == 0"
            - "WorkOrder.${wo_id}.completion_status == CANCELLED"

      - name: route_slot_count_conserved_on_stop_removal
        grounds:
          - state_machines.WorkOrder.completion_status=PENDING_to_completion_status=CANCELLED
          - entities.Route.fields.stops_used
          - entities.RouteStop.fields.stop_state
        distinguishing_aspect: |
          Conserved quantity = slot count (Route.stops_used), a different conserved type from money.
          Scheduling a stop increments stops_used to 1; cancelling its work order removes the stop and
          returns stops_used to 0 (invariant: stops_used == count of SCHEDULED RouteStops).
        test_recipe:
          setup:
            - "A route with one SCHEDULED stop (stops_used=1) referencing a PENDING-then-scheduled work order."
          setup_api_calls:
            - call: "POST /customers"
              payload: { company_name: "Inv2 Co", contact_email: "i2@x.com", billing_zip: "94016" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", site_address: "20 Inv2 St", lat: 37.7, lng: -122.4 }
              as: Dispatcher
              captures: { prop_id: $.data.id }
            - call: "POST /irrigation-systems"
              payload: { property_id: "${prop_id}", controller_model: "Hunter", static_psi: 60 }
              as: Dispatcher
              captures: { sys_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Inv2 Tech", shift_start_sec: 28800, shift_end_sec: 64800 }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /work-orders"
              payload: { system_id: "${sys_id}", job_type: "HEAD_REPAIR", estimated_minutes: 20, estimated_cost_cents: 3000 }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /routes"
              payload: { technician_id: "${tech_id}", route_date: "2026-05-05" }
              as: Dispatcher
              captures: { route_id: $.data.id, route_v: $.data.version }
            - call: "POST /route-stops"
              payload: { route_id: "${route_id}", work_order_id: "${wo_id}", arrival_start_sec: 28800, window_minutes: 60, expected_route_version: "${route_v}" }
              as: Dispatcher
          trigger:
            - call: "POST /work-orders/${wo_id}/cancel"
              payload: {}
              as: Dispatcher
          assert:
            - "Route.${route_id}.stops_used == 0"
            - "WorkOrder.${wo_id}.completion_status == CANCELLED"
