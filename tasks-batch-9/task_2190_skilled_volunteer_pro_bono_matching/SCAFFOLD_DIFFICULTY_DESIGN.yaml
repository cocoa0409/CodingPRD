      - name: creep_band_floors_inclusive_ladder
        grounds:
          - calculations.scope_creep_pct
          - calculations.scope_creep_pct.constants.WATCH_FLOOR
          - calculations.scope_creep_pct.constants.ESCALATED_FLOOR
          - calculations.scope_creep_pct.constants.BREACH_FLOOR
          - validations.priority_56
        distinguishing_aspect: |
          Three INCLUSIVE (>=) floors on ONE monotonically rising quantity, walked in a single
          engagement so that each floor is crossed twice: once one cent of an hour short and
          once exactly on it. Unlike instance 1 the boundary quantity is directly steerable
          (approved TimeLog hours), and unlike instances 3-5 the crossing has a cascading
          consequence at the top floor (BREACH terminates the engagement from inside a
          successful 200 hold), so the interesting failure is an off-by-one band that silently
          skips or forces a termination.

          Baseline = Engagement.committed_hours = round(40.00 * 1.00, 2) = 40.00, and pending
          = 0.00 for every rung except rung D (no ScopeChangeRequest is open), so
          scope_creep_pct = round((approved - 40.00) / 40.00, 4):
            rung A1  approved 45.99 -> round(5.99  / 40.00, 4) = round(0.1497500, 4) = 0.1498 -> NONE      (0.1498 < 0.1500)
            rung A2  approved 46.00 -> round(6.00  / 40.00, 4) = 0.1500                      -> WATCH     (0.1500 >= 0.1500, inclusive)
            rung B1  approved 51.99 -> round(11.99 / 40.00, 4) = round(0.2997500, 4) = 0.2998 -> WATCH
            rung B2  approved 52.00 -> round(12.00 / 40.00, 4) = 0.3000                      -> ESCALATED (inclusive)
            rung C1  approved 59.99 -> round(19.99 / 40.00, 4) = round(0.4997500, 4) = 0.4998 -> ESCALATED
            rung C2  approved 60.00 -> round(20.00 / 40.00, 4) = 0.5000                      -> BREACH    (inclusive)
          Every just-below rung also exercises round_half_up itself: with a 40.00 baseline the
          creep lattice is 0.01/40.00 = 0.00025-grained, so 5.99/40.00 is exactly 0.14975 and
          the 4-decimal rounding is a true halfway case (0.1498, not the truncated 0.1497).
          The rounded value is what the band test consumes, and at this baseline no reachable
          hour total lands in [0.14995, 0.1500), so a band flip can only come from the
          inclusive floors, never from rounding - which is exactly what an implementation
          that rounds to 2 decimals or compares the raw ratio gets wrong.

          Consequence asymmetry that pins the top floor: escalation_raised on the hold is true
          only for {ESCALATED, BREACH}, so rung B2 is the first hold that raises it while rung
          A2 (WATCH) must not. Rung C2 additionally drives work_status IN_PROGRESS ->
          TERMINATED with termination_reason SCOPE_BREACH and ProjectRequest IN_DELIVERY ->
          RESCOPING inside a 200 response; the following POST /engagements/{id}/time-logs then
          answers priority 23 ERR_INVALID_WORK_STATE (409), NOT priority 56
          ERR_SCOPE_BREACH_THRESHOLD, because the terminal work_status is checked first.
          Rung D is therefore the only reachable way to see priority 56: a PENDING
          ScopeChangeRequest of 10.00 additional_hours on top of approved 46.00 gives
          projected_creep_pct = round((46.00 + 0.00 + 10.00 - 40.00) / 40.00, 4) = 0.4000,
          which is >= MANAGER_FLOOR 0.1500 and < RESCOPE_FLOOR 0.5000 -> MANAGER_REVIEW ->
          status PENDING, and scope_creep_pct becomes round(16.00 / 40.00, 4) = 0.4000
          (ESCALATED). The clause that bites is "no child ScopeChangeRequest IN {PENDING,
          ESCALATED}". Note the reachability argument: creep can never sit at BREACH through
          the pending term alone, because any change request whose projection reaches 0.5000
          is tiered RESCOPE_REQUIRED and VOIDED at creation, contributing 0.00 to pending.
