  - rule_id: priority_pair_validation_conflict
    instances:
      - name: pos_grant_state_gate_beats_fiscal_cap
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors[ERR_ACCOUNT_NOT_ACTIVE]
          - errors[ERR_POS_VALUE_CAP_EXCEEDED]
        distinguishing_aspect: "Category pair state-vs-business_fiscal: the request violates both the account-state gate (priority 6) and the TX annual cap (priority 10), and the response must carry ERR_ACCOUNT_NOT_ACTIVE — never the fiscal error."
        test_recipe:
          setup:
            - "Logical clock at startup default 2026-09-01T00:00:00Z (granted_year 2026 for all grants)."
            - "TX account AP served by an appointed wholesaler; three ISSUED grants of 9900 cents each bring chargeable YTD to 29700 (TX cap 30000)."
            - "A CRITICAL_FAIL audit then suspends AP (one 121-day keg), so the account is SERVICE_SUSPENDED with YTD still 29700."
          setup_api_calls:
            - call: "POST /territories"
              payload: { name: "Prio Territory", state_code: "TX" }
              as: BrewerAdmin
              captures: { tp_id: $.data.id }
            - call: "POST /wholesalers"
              payload: { legal_name: "Prio Distributing", home_state: "TX", license_number: "TX-W-6001", tier: "SILVER", financial_capacity_score: 75, warehouse_capacity_score: 75, market_coverage_score: 75 }
