      - name: corner_stub_four_hop_closure_cascade
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: staffing_cancel_closes_clinic_defers_queue_and_zeroes_wait
          rationale: "The full N-level chain — on_duty decrement, posture re-derivation, WAITING to DEFERRED_CLOSURE, waiting_count and posted_wait_minutes recomputation — is verified end-to-end with its ordering in that §1.8 instance."

      - name: corner_stub_charge_void_compensation_chain
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: charge_void_restores_patient_outstanding_balance_to_zero
          rationale: "The compensation direction of the cascade (VOIDED billing status feeding the aggregate back to zero with no drift) is asserted there."

      - name: corner_stub_quote_versus_final_variant_pair
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: visit_quote_insured_estimate_vs_self_pay_transparent
          rationale: "Both variants of visit_price_quote are computed on the same data with the delta asserted in that §1.8 instance, which is exactly the dual-variant claim."

      - name: corner_stub_posted_versus_realized_wait_variant_pair
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: wait_time_posted_projection_vs_realized_actual
          rationale: "The PROJECTED and REALIZED_ACTUAL variants of wait_time_estimate and the switch between them are the subject of that §1.8 instance."

  - section: consistency_model
    instances:
      - name: corner_checkout_response_already_carries_every_derived_amount
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /visits/{visitId}/checkout]
          - calculations.visit_price_final
          - calculations.patient_outstanding_balance
        distinguishing_aspect: "Nothing lags behind the writing request: the checkout RESPONSE itself already carries final_price_cents, patient_responsibility_cents and payer_responsibility_cents together with the CLOSED/INVOICED pair, and the independently-read Patient aggregate and the freshly created VisitSummary agree on the first read — no second request is needed to settle a denormalised field."
        test_recipe:
          setup:
            - "A CA StateRule and a SORE_THROAT protocol (base_price_cents 9900, requires_cosign false); an OPEN CA clinic with one ACTIVE clinician."
            - "An insured adult patient with consent on file and an electronic-capable PCP address is carried to a TREATED visit; the eligibility check records copay 1500 and coinsurance 7.5."
          setup_api_calls:
            - call: "POST /state-rules"
              payload: { state_code: "CA", chart_review_sample_pct: 40, review_deadline_hours: 72, collaborating_physician_required: true, min_independent_practice_age_months: 24, controlled_rx_allowed: false, max_supervised_clinicians_per_physician: 3 }
              as: ClinicAdmin
            - call: "POST /protocols"
              payload: { complaint_code: "SORE_THROAT", min_age_months: 12, max_age_months: 1200, base_price_cents: 9900, acuity_tier: 2, red_flag_codes: ["STRIDOR"], max_temp_c: 39.5, max_heart_rate_bpm: 120, min_spo2_pct: 92, requires_cosign: false, allowed_state_codes: ["CA"] }
              as: ClinicAdmin
            - call: "POST /clinics"
              payload: { name: "CA Store 82", state_code: "CA", min_clinicians_required: 1, appointment_slots_per_hour: 2, walk_in_queue_capacity: 5 }
              as: ClinicAdmin
              captures: { c82_id: $.data.id }
            - call: "POST /physicians"
              payload: { full_name: "Dr Willow", licensed_state_codes: ["CA"], max_supervised_clinicians: 3 }
              as: ClinicAdmin
              captures: { p82_id: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "NP Willow", credential: "NP", license_state_code: "CA", home_clinic_id: "${c82_id}", supervising_physician_id: "${p82_id}" }
              as: ClinicAdmin
              captures: { cl82_id: $.data.id }
            - call: "POST /staffing-assignments"
              payload: { clinic_id: "${c82_id}", clinician_id: "${cl82_id}", role_kind: "PRIMARY", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-01T23:00:00Z", pinned_supervising_physician_id: "${p82_id}" }
              as: ClinicAdmin
            - call: "POST /patients"
              payload: { full_name: "Cleo Consent", date_of_birth: "1968-08-28", payer_name: "BlueCo", member_id: "M-8282", pcp_name: "Dr Primary", pcp_direct_address: "cleo.pcp@direct.example.org", pcp_accepts_electronic_summary: true, pcp_consent_on_file: true }
              as: FrontDeskAgent
              captures: { cleo_id: $.data.id, cleo_balance_before: $.data.outstanding_balance_cents }
            - call: "POST /queue-entries"
              payload: { clinic_id: "${c82_id}", patient_id: "${cleo_id}", kind: "WALK_IN", complaint_code: "SORE_THROAT" }
              as: FrontDeskAgent
              captures: { q82_id: $.data.id }
            - call: "POST /clinics/${c82_id}/call-next"
              payload: {}
              as: Clinician
              as_user_id: "${cl82_id}"
            - call: "POST /visits"
              payload: { queue_entry_id: "${q82_id}" }
              as: Clinician
              as_user_id: "${cl82_id}"
              captures: { v82_id: $.data.id }
            - call: "POST /assessments"
              payload: { visit_id: "${v82_id}", temp_c: 37.3, heart_rate_bpm: 84, spo2_pct: 98, red_flag_codes: [] }
              as: Clinician
              as_user_id: "${cl82_id}"
              captures: { a82_id: $.data.id }
            - call: "POST /assessments/${a82_id}/submit"
              payload: {}
              as: Clinician
              as_user_id: "${cl82_id}"
            - call: "POST /visits/${v82_id}/eligibility-check"
              payload: { coverage_status: "ACTIVE", copay_cents: 1500, coinsurance_pct: 7.5 }
              as: FrontDeskAgent
              captures: { v82_quoted: $.data.quoted_price_cents, v82_selfpay: $.data.self_pay }
          trigger:
            - call: "POST /visits/${v82_id}/checkout"
              payload: { services_rendered: ["INJECTION_ADMIN", "EKG"] }
              as: Clinician
              as_user_id: "${cl82_id}"
              captures: { v82_final: $.data.final_price_cents, v82_patient_resp: $.data.patient_responsibility_cents, v82_payer_resp: $.data.payer_responsibility_cents, v82_clinical: $.data.clinical_status, v82_billing: $.data.billing_status, v82_quoted_after: $.data.quoted_price_cents }
            - call: "GET /visits/${v82_id}"
              payload: {}
              as: ClinicAdmin
              captures: { reread_final: $.data.final_price_cents, reread_patient_resp: $.data.patient_responsibility_cents, reread_payer_resp: $.data.payer_responsibility_cents, reread_quoted: $.data.quoted_price_cents }
            - call: "GET /patients/${cleo_id}"
              payload: {}
              as: ClinicAdmin
              captures: { cleo_balance_after: $.data.outstanding_balance_cents }
            - call: "GET /visit-summaries"
              payload: { visit_id: "${v82_id}" }
              as: ClinicAdmin
              captures: { vs82_id: "$.data[0].id", vs82_kind: "$.data[0].destination_kind", vs82_status: "$.data[0].status", vs82_attempts: "$.data[0].attempt_count", vs82_total: $.meta.total_count }
          assert:
            - "${v82_selfpay} == false and ${cleo_balance_before} == 0"
            - "${v82_final} == 20600   # 9900 base + 4200 INJECTION_ADMIN + 6500 EKG"
            - "${v82_patient_resp} == 3046   # per-line 7.5% shares [743, 315, 488] sum 1546, plus copay 1500; below the 20600 cap"
            - "${v82_payer_resp} == 17554 and ${v82_patient_resp} + ${v82_payer_resp} == ${v82_final}"
            - "${v82_clinical} == CLOSED and ${v82_billing} == INVOICED in the SAME response, not after a re-read"
            - "${reread_final} == ${v82_final} and ${reread_patient_resp} == ${v82_patient_resp} and ${reread_payer_resp} == ${v82_payer_resp}"
            - "${cleo_balance_after} == 3046   # the Patient aggregate is settled by the first read after checkout"
            - "${v82_quoted_after} == ${v82_quoted} and ${reread_quoted} == ${v82_quoted}   # the up-front quote is preserved, not overwritten by the final price"
            - "${vs82_total} == 1 and ${vs82_kind} == DIRECT_MESSAGE and ${vs82_status} == QUEUED and ${vs82_attempts} == 0   # the summary exists on the first read too"

      - name: corner_clock_response_names_every_row_the_advance_touched
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /_clock/set_current_utc]
          - state_machines.QueueEntry.WAITING_to_ABANDONED
        distinguishing_aspect: "A single clock advance completes one assignment, activates another and abandons a 125-minute-old walk-in, and its response must already enumerate all three id lists plus the affected clinic — and because activation and completion are both applied before the posture is re-derived, on-duty never dips to zero, so the entry is ABANDONED rather than DEFERRED_CLOSURE."
        test_recipe:
          setup:
            - "A CA StateRule and a SORE_THROAT protocol; a CA clinic (min_clinicians_required 1) with an ACTIVE assignment [00:00, 01:00) for clinician A and a SCHEDULED assignment [02:00, 04:00) for clinician B."
            - "One adult walk-in is queued at clock 00:00 while the clinic is OPEN, so it sits WAITING with arrived_at 00:00."
          setup_api_calls:
            - call: "POST /state-rules"
              payload: { state_code: "CA", chart_review_sample_pct: 40, review_deadline_hours: 72, collaborating_physician_required: true, min_independent_practice_age_months: 24, controlled_rx_allowed: false, max_supervised_clinicians_per_physician: 3 }
              as: ClinicAdmin
            - call: "POST /protocols"
              payload: { complaint_code: "SORE_THROAT", min_age_months: 12, max_age_months: 1200, base_price_cents: 9900, acuity_tier: 2, red_flag_codes: ["STRIDOR"], max_temp_c: 39.5, max_heart_rate_bpm: 120, min_spo2_pct: 92, requires_cosign: false, allowed_state_codes: ["CA"] }
              as: ClinicAdmin
            - call: "POST /clinics"
              payload: { name: "CA Store 83", state_code: "CA", min_clinicians_required: 1, appointment_slots_per_hour: 2, walk_in_queue_capacity: 5 }
              as: ClinicAdmin
              captures: { c83_id: $.data.id }
            - call: "POST /physicians"
              payload: { full_name: "Dr Yarrow", licensed_state_codes: ["CA"], max_supervised_clinicians: 3 }
              as: ClinicAdmin
              captures: { p83_id: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "NP Yarrow A", credential: "NP", license_state_code: "CA", home_clinic_id: "${c83_id}", supervising_physician_id: "${p83_id}" }
              as: ClinicAdmin
              captures: { cl83_a_id: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "NP Yarrow B", credential: "PA", license_state_code: "CA", home_clinic_id: "${c83_id}", supervising_physician_id: "${p83_id}" }
              as: ClinicAdmin
              captures: { cl83_b_id: $.data.id }
            - call: "POST /staffing-assignments"
              payload: { clinic_id: "${c83_id}", clinician_id: "${cl83_a_id}", role_kind: "PRIMARY", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-01T01:00:00Z", pinned_supervising_physician_id: "${p83_id}" }
              as: ClinicAdmin
              captures: { sa83_a_id: $.data.id, sa83_a_status: $.data.status }
            - call: "POST /staffing-assignments"
              payload: { clinic_id: "${c83_id}", clinician_id: "${cl83_b_id}", role_kind: "PRIMARY", starts_at: "2026-08-01T02:00:00Z", ends_at: "2026-08-01T04:00:00Z", pinned_supervising_physician_id: "${p83_id}" }
              as: ClinicAdmin
              captures: { sa83_b_id: $.data.id, sa83_b_status: $.data.status }
            - call: "POST /patients"
              payload: { full_name: "Ned Neglected", date_of_birth: "1967-07-27", payer_name: "BlueCo", member_id: "M-8383" }
              as: FrontDeskAgent
              captures: { ned_id: $.data.id }
            - call: "POST /queue-entries"
              payload: { clinic_id: "${c83_id}", patient_id: "${ned_id}", kind: "WALK_IN", complaint_code: "SORE_THROAT" }
              as: FrontDeskAgent
              captures: { q83_id: $.data.id, q83_arrived: $.data.arrived_at }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T02:05:00Z" }
              as: ClinicAdmin
              captures: { clock_now: $.data.current_utc, activated_ids: $.data.activated_assignment_ids, completed_ids: $.data.completed_assignment_ids, abandoned_ids: $.data.abandoned_queue_entry_ids, affected_clinics: $.data.affected_clinic_ids }
            - call: "GET /staffing-assignments/${sa83_a_id}"
              payload: {}
              as: ClinicAdmin
              captures: { sa83_a_status_after: $.data.status }
            - call: "GET /staffing-assignments/${sa83_b_id}"
              payload: {}
              as: ClinicAdmin
              captures: { sa83_b_status_after: $.data.status }
            - call: "GET /queue-entries/${q83_id}"
              payload: {}
              as: ClinicAdmin
              captures: { q83_status_after: $.data.status }
            - call: "GET /clinics/${c83_id}"
              payload: {}
              as: ClinicAdmin
              captures: { c83_on_duty: $.data.on_duty_clinician_count, c83_posture: $.data.open_status, c83_waiting: $.data.waiting_count, c83_posted: $.data.posted_wait_minutes }
          assert:
            - "${sa83_a_status} == ACTIVE and ${sa83_b_status} == SCHEDULED and ${q83_arrived} == 2026-08-01T00:00:00Z"
            - "${clock_now} == 2026-08-01T02:05:00Z"
            - "${completed_ids} contains exactly [${sa83_a_id}] and ${activated_ids} contains exactly [${sa83_b_id}]"
            - "${abandoned_ids} contains exactly [${q83_id}]   # waiting 125 minutes >= the 120-minute abandonment threshold"
            - "${affected_clinics} contains exactly [${c83_id}]"
            - "${sa83_a_status_after} == COMPLETED and ${sa83_b_status_after} == ACTIVE and ${q83_status_after} == ABANDONED   # not DEFERRED_CLOSURE"
            - "${c83_on_duty} == 1 and ${c83_posture} == OPEN   # activation and completion are applied before the posture is re-derived"
            - "${c83_waiting} == 0 and ${c83_posted} == 0   # the abandonment fed straight through to the posted wait"
