          assert:
            - "setup: standing == SUSPENDED, quality_score_bps == 2400 (0.6*4000 + 0.4*0), is_accepting == false"
            - "the requested window [2026-06-15, 2026-06-20) also half-open-overlaps ACTIVE W1 [2026-05-01, 2027-01-01), so the temporal check would fail too"
            - "trigger returns error_id == ERR_MEMBERSHIP_SUSPENDED (safety, priority 5) — never ERR_AVAILABILITY_WINDOW_OVERLAP (temporal, priority 7)"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: sla_on_time_at_exact_deadline_inclusive
        grounds:
          - calculations.sla_due_at
          - entities.ConsultResponse.fields.on_time
        distinguishing_aspect: |
          Metric = response timeliness vs sla_due_at, reached via POST
          /consult-requests/{id}/responses. The comparison is <= (inclusive): a
          response whose created_at equals sla_due_at exactly (2026-06-03T00:00:00Z
          for a 48h ROUTINE target from 2026-06-01T00:00:00Z) is on_time == true
          with sla_breached == false.
        test_recipe:
          setup:
            - "Track CARDIOLOGY routine target 48h; consult created at 2026-06-01T00:00:00Z -> sla_due_at 2026-06-03T00:00:00Z"
            - "Clock advanced to exactly 2026-06-03T00:00:00Z"
          setup_api_calls:
            - { call: "POST /econsult/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /econsult/specialty-tracks", payload: { specialty_code: CARDIOLOGY, response_time_target_hours: 48, urgent_target_hours: 12, base_response_fee_cents: 10000, conversion_response_fee_cents: 8000, clarification_fee_cents: 2500, late_penalty_cents: 3000, monthly_billing_cap_cents: 1000000 }, as: ProgramCoordinator, captures: { track_id: $.data.id } }
            - { call: "POST /econsult/referring-providers", payload: { full_name: "Dr. Priya Primary", npi: "1000000101" }, as: ProgramCoordinator, captures: { prov_id: $.data.id } }
            - { call: "POST /econsult/specialists", payload: { full_name: "Dr. Sam Specialist", npi: "2000000101" }, as: ProgramCoordinator, captures: { spec_id: $.data.id } }
            - { call: "POST /econsult/panel-memberships", payload: { specialist_id: "${spec_id}", specialty_track_id: "${track_id}" }, as: ProgramCoordinator, captures: { memb_id: $.data.id } }
            - { call: "POST /econsult/specialist-availability-windows", payload: { membership_id: "${memb_id}", window_start: "2026-05-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z" }, as: Specialist, as_user_id: "${spec_id}" }
            - { call: "POST /econsult/consult-requests", payload: { patient_ref: "PAT-BP1", specialty_track_id: "${track_id}", question_text: "Borderline QT prolongation on screening ECG before starting antiemetic; cardiology input requested.", icd10_primary: "R94", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${prov_id}", captures: { cons_id: $.data.id, cons_sla: $.data.sla_due_at } }
            - { call: "POST /econsult/_clock/set_current_utc", payload: { to_iso8601: "2026-06-03T00:00:00Z" }, as: ProgramCoordinator }
          trigger:
            - { call: "POST /econsult/consult-requests/${cons_id}/responses", payload: { disposition: "MANAGE_IN_PRIMARY_CARE", recommendation_text: "QTc 470ms borderline; prefer ondansetron alternative metoclopramide and repeat ECG in 48h." }, as: Specialist, as_user_id: "${spec_id}", captures: { r_on_time: $.data.on_time, r_review_req: $.data.review_required } }
            - { call: "GET /econsult/consult-requests/${cons_id}", as: ProgramCoordinator, captures: { c_breach: $.data.sla_breached } }
          assert:
            - "ConsultRequest.${cons_id}.sla_due_at == 2026-06-03T00:00:00Z"
            - "response created_at equals sla_due_at exactly: on_time == true (boundary is inclusive, <=)"
            - "ConsultRequest.${cons_id}.sla_breached == false"
            - "review_required == false (on time, GOOD_STANDING, non-conversion disposition)"

      - name: standing_demotion_boundary_at_7000_bps
        grounds:
          - calculations.panel_quality_score_bps
          - entities.PanelMembership.fields.standing
        distinguishing_aspect: |
          Metric = quality_score_bps against the 7000 demotion threshold, reached
          via POST /quality-reviews/{id}/complete (different metric and endpoint
          than the SLA sibling). Demotion is strict <: a blend landing exactly on
          7000 bps (review component 5000, timeliness 10000) keeps the membership
          GOOD_STANDING; only 6999 or less demotes.
        test_recipe:
          setup:
            - "Track CARDIOLOGY standard; consult answered on time (timeliness component 10000)"
          setup_api_calls:
            - { call: "POST /econsult/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /econsult/specialty-tracks", payload: { specialty_code: CARDIOLOGY, response_time_target_hours: 48, urgent_target_hours: 12, base_response_fee_cents: 10000, conversion_response_fee_cents: 8000, clarification_fee_cents: 2500, late_penalty_cents: 3000, monthly_billing_cap_cents: 1000000 }, as: ProgramCoordinator, captures: { track_id: $.data.id } }
            - { call: "POST /econsult/referring-providers", payload: { full_name: "Dr. Priya Primary", npi: "1000000111" }, as: ProgramCoordinator, captures: { prov_id: $.data.id } }
            - { call: "POST /econsult/specialists", payload: { full_name: "Dr. Sam Specialist", npi: "2000000111" }, as: ProgramCoordinator, captures: { spec_id: $.data.id } }
            - { call: "POST /econsult/specialists", payload: { full_name: "Dr. Quinn Reviewer", npi: "2000000112" }, as: ProgramCoordinator, captures: { rev_id: $.data.id } }
            - { call: "POST /econsult/panel-memberships", payload: { specialist_id: "${spec_id}", specialty_track_id: "${track_id}" }, as: ProgramCoordinator, captures: { memb_id: $.data.id } }
            - { call: "POST /econsult/specialist-availability-windows", payload: { membership_id: "${memb_id}", window_start: "2026-05-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z" }, as: Specialist, as_user_id: "${spec_id}" }
            - { call: "POST /econsult/consult-requests", payload: { patient_ref: "PAT-BP2", specialty_track_id: "${track_id}", question_text: "Asymptomatic bradycardia 48bpm on routine exam, athlete; asks if any workup is warranted.", icd10_primary: "R00", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${prov_id}", captures: { cons_id: $.data.id } }
            - { call: "POST /econsult/consult-requests/${cons_id}/responses", payload: { disposition: "MANAGE_IN_PRIMARY_CARE", recommendation_text: "Physiologic bradycardia likely; check TSH and electrolytes, no holter unless symptomatic." }, as: Specialist, as_user_id: "${spec_id}", captures: { resp_id: $.data.id } }
            - { call: "POST /econsult/quality-reviews", payload: { response_id: "${resp_id}" }, as: QualityReviewer, as_user_id: "${rev_id}", captures: { rev_1: $.data.id } }
          trigger:
            - { call: "POST /econsult/quality-reviews/${rev_1}/complete", payload: { timeliness_score: 2, appropriateness_score: 2, clarity_score: 4, verdict: "REBUKE" }, as: QualityReviewer, as_user_id: "${rev_id}", captures: { rev_comp: $.data.composite_score_bps } }
            - { call: "GET /econsult/panel-memberships/${memb_id}", as: ProgramCoordinator, captures: { m_standing: $.data.standing, m_score: $.data.quality_score_bps, m_rebukes: $.data.rebuke_count } }
          assert:
            - "composite == 5000 bps ((2*50 + 2*25 + 4*25)/5 = 50 -> 5000), verdict REBUKE consistent (< 6000)"
            - "quality_score_bps == 7000 exactly (0.6*5000 + 0.4*10000)"
            - "standing == GOOD_STANDING — demotion requires score < 7000, and 7000 is not < 7000"
            - "rebuke_count == 1 (below the PROBATION->SUSPENDED rebuke threshold of 2, and standing never left GOOD_STANDING)"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: consult_close_gated_by_response_finalized
        grounds:
          - state_machines.ConsultRequest.ANSWERED_to_CLOSED
          - state_machines.ConsultResponse.SUBMITTED_to_FINALIZED
        distinguishing_aspect: |
          Entity pair ConsultRequest -> ConsultResponse: the close transition
          reads the OTHER entity's state machine and is rejected with
          ERR_RESPONSE_NOT_FINALIZED while the response is merely SUBMITTED;
          once documentation + finalize move the response to FINALIZED, the same
          close succeeds — a pure cross-entity state gate.
        test_recipe:
          setup:
            - "Track CARDIOLOGY standard; consult answered on time; response SUBMITTED but not finalized"
          setup_api_calls:
            - { call: "POST /econsult/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /econsult/specialty-tracks", payload: { specialty_code: CARDIOLOGY, response_time_target_hours: 48, urgent_target_hours: 12, base_response_fee_cents: 10000, conversion_response_fee_cents: 8000, clarification_fee_cents: 2500, late_penalty_cents: 3000, monthly_billing_cap_cents: 1000000 }, as: ProgramCoordinator, captures: { track_id: $.data.id } }
            - { call: "POST /econsult/referring-providers", payload: { full_name: "Dr. Priya Primary", npi: "1000000121" }, as: ProgramCoordinator, captures: { prov_id: $.data.id } }
            - { call: "POST /econsult/specialists", payload: { full_name: "Dr. Sam Specialist", npi: "2000000121" }, as: ProgramCoordinator, captures: { spec_id: $.data.id } }
            - { call: "POST /econsult/panel-memberships", payload: { specialist_id: "${spec_id}", specialty_track_id: "${track_id}" }, as: ProgramCoordinator, captures: { memb_id: $.data.id } }
            - { call: "POST /econsult/specialist-availability-windows", payload: { membership_id: "${memb_id}", window_start: "2026-05-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z" }, as: Specialist, as_user_id: "${spec_id}" }
            - { call: "POST /econsult/consult-requests", payload: { patient_ref: "PAT-CE1", specialty_track_id: "${track_id}", question_text: "Wants to discontinue amiodarone due to thyroid concerns; asks for alternative antiarrhythmic strategy.", icd10_primary: "I48", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${prov_id}", captures: { cons_id: $.data.id } }
            - { call: "POST /econsult/consult-requests/${cons_id}/responses", payload: { disposition: "MANAGE_WITH_PLAN", recommendation_text: "Switch to dofetilide with inpatient loading; stop amiodarone after washout, recheck TSH." }, as: Specialist, as_user_id: "${spec_id}", captures: { resp_id: $.data.id } }
          trigger:
            - { call: "POST /econsult/consult-requests/${cons_id}/close", as: ReferringProvider, as_user_id: "${prov_id}", captures: { err_close: $.data.error_id } }
            - { call: "POST /econsult/consult-responses/${resp_id}/documentation", payload: { record_type: "PCP_NOTE" }, as: ReferringProvider, as_user_id: "${prov_id}" }
            - { call: "POST /econsult/consult-responses/${resp_id}/documentation", payload: { record_type: "SPECIALIST_NOTE" }, as: Specialist, as_user_id: "${spec_id}" }
            - { call: "POST /econsult/consult-responses/${resp_id}/finalize", as: Specialist, as_user_id: "${spec_id}" }
            - { call: "POST /econsult/consult-requests/${cons_id}/close", as: ReferringProvider, as_user_id: "${prov_id}", captures: { st_end: $.data.status } }
          assert:
            - "first close: error_id == ERR_RESPONSE_NOT_FINALIZED (409) — response still SUBMITTED"
            - "after documentation and finalize: response.status == FINALIZED"
            - "second close succeeds: consult.status == CLOSED"

      - name: conversion_create_gated_by_consult_answered
        grounds:
          - state_machines.InPersonConversion
          - state_machines.ConsultRequest.ASSIGNED_to_ANSWERED
          - validations[priority=4]
        distinguishing_aspect: |
          Entity pair InPersonConversion -> ConsultRequest (different from the
          ConsultRequest -> ConsultResponse pair of the sibling): creating a
          conversion while the consult is still ASSIGNED (no response) MUST fail
          with ERR_CONSULT_NOT_ANSWERED, and no InPersonConversion row may exist
          afterwards.
        test_recipe:
          setup:
            - "Track CARDIOLOGY standard; consult ASSIGNED, no response yet"
          setup_api_calls:
            - { call: "POST /econsult/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /econsult/specialty-tracks", payload: { specialty_code: CARDIOLOGY, response_time_target_hours: 48, urgent_target_hours: 12, base_response_fee_cents: 10000, conversion_response_fee_cents: 8000, clarification_fee_cents: 2500, late_penalty_cents: 3000, monthly_billing_cap_cents: 1000000 }, as: ProgramCoordinator, captures: { track_id: $.data.id } }
            - { call: "POST /econsult/referring-providers", payload: { full_name: "Dr. Priya Primary", npi: "1000000131" }, as: ProgramCoordinator, captures: { prov_id: $.data.id } }
            - { call: "POST /econsult/specialists", payload: { full_name: "Dr. Sam Specialist", npi: "2000000131" }, as: ProgramCoordinator, captures: { spec_id: $.data.id } }
            - { call: "POST /econsult/panel-memberships", payload: { specialist_id: "${spec_id}", specialty_track_id: "${track_id}" }, as: ProgramCoordinator, captures: { memb_id: $.data.id } }
            - { call: "POST /econsult/specialist-availability-windows", payload: { membership_id: "${memb_id}", window_start: "2026-05-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z" }, as: Specialist, as_user_id: "${spec_id}" }
            - { call: "POST /econsult/consult-requests", payload: { patient_ref: "PAT-CE2", specialty_track_id: "${track_id}", question_text: "Syncope with exertion in 62-year-old; likely needs in-person structural workup, confirm conversion.", icd10_primary: "R55", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${prov_id}", captures: { cons_id: $.data.id, cons_st: $.data.status } }
          trigger:
            - { call: "POST /econsult/consult-requests/${cons_id}/conversions", payload: { appointment_start: "2026-06-10T10:00:00Z", appointment_end: "2026-06-10T10:30:00Z" }, as: Specialist, as_user_id: "${spec_id}", captures: { err_id: $.data.error_id } }
            - { call: "GET /econsult/in-person-conversions", payload: { consult_id: "${cons_id}" }, as: ProgramCoordinator, captures: { conv_list: $.data } }
          assert:
            - "consult status == ASSIGNED at trigger time (no response submitted)"
            - "conversion create returns error_id == ERR_CONSULT_NOT_ANSWERED (409)"
            - "GET /econsult/in-person-conversions?consult_id returns an empty array (no row persisted)"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: availability_windows_half_open_adjacency
        grounds:
          - calculations.availability_overlap_check
          - entities.SpecialistAvailabilityWindow.fields.window_end
        distinguishing_aspect: |
          Resource = PanelMembership availability, HALF-OPEN interval semantics
          [start, end): a new window strictly inside an ACTIVE window's span
          conflicts, but a new window whose start EQUALS the existing window's
          end (adjacency, zero gap) is accepted — the end boundary is excluded.
        test_recipe:
          setup:
            - "Membership M with no windows yet"
          setup_api_calls:
            - { call: "POST /econsult/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /econsult/specialty-tracks", payload: { specialty_code: CARDIOLOGY, response_time_target_hours: 48, urgent_target_hours: 12, base_response_fee_cents: 10000, conversion_response_fee_cents: 8000, clarification_fee_cents: 2500, late_penalty_cents: 3000, monthly_billing_cap_cents: 1000000 }, as: ProgramCoordinator, captures: { track_id: $.data.id } }
            - { call: "POST /econsult/specialists", payload: { full_name: "Dr. Sam Specialist", npi: "2000000141" }, as: ProgramCoordinator, captures: { spec_id: $.data.id } }
            - { call: "POST /econsult/panel-memberships", payload: { specialist_id: "${spec_id}", specialty_track_id: "${track_id}" }, as: ProgramCoordinator, captures: { memb_id: $.data.id } }
            - { call: "POST /econsult/specialist-availability-windows", payload: { membership_id: "${memb_id}", window_start: "2026-06-10T10:00:00Z", window_end: "2026-06-10T12:00:00Z" }, as: Specialist, as_user_id: "${spec_id}", captures: { w1_id: $.data.id } }
          trigger:
            - { call: "POST /econsult/specialist-availability-windows", payload: { membership_id: "${memb_id}", window_start: "2026-06-10T11:00:00Z", window_end: "2026-06-10T13:00:00Z" }, as: Specialist, as_user_id: "${spec_id}", captures: { err_overlap: $.data.error_id } }
            - { call: "POST /econsult/specialist-availability-windows", payload: { membership_id: "${memb_id}", window_start: "2026-06-10T12:00:00Z", window_end: "2026-06-10T14:00:00Z" }, as: Specialist, as_user_id: "${spec_id}", captures: { w3_id: $.data.id, w3_status: $.data.status } }
            - { call: "GET /econsult/panel-memberships/${memb_id}/availability-windows", payload: { status: "ACTIVE" }, as: ProgramCoordinator, captures: { win_count: $.data } }
          assert:
            - "W2 [11:00,13:00) overlapping W1 [10:00,12:00): error_id == ERR_AVAILABILITY_WINDOW_OVERLAP (409)"
            - "W3 [12:00,14:00) with start == W1.end: created with status ACTIVE (adjacency allowed under half-open semantics)"
            - "membership has exactly 2 ACTIVE windows afterwards"

      - name: conversion_appointments_buffered_thirty_minutes
        grounds:
          - calculations.conversion_overlap_check
          - entities.InPersonConversion.fields.appointment_start
        distinguishing_aspect: |
          Resource = the specialist's appointment book (different resource than
          the membership availability sibling), CLOSED-WITH-BUFFER semantics: a
          30-minute buffer inflates each SCHEDULED appointment on both sides, so
          a successor starting exactly 30 minutes after the previous end is
          accepted (strict < excludes the boundary) while 29 minutes is rejected
          — a different geometric treatment than the half-open availability rule.
        test_recipe:
          setup:
            - "Three consults answered CONVERT_TO_VISIT by the same specialist"
            - "Conversion C1 SCHEDULED [2026-06-10T10:00, 2026-06-10T11:00)"
          setup_api_calls:
            - { call: "POST /econsult/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /econsult/specialty-tracks", payload: { specialty_code: CARDIOLOGY, response_time_target_hours: 48, urgent_target_hours: 12, base_response_fee_cents: 10000, conversion_response_fee_cents: 8000, clarification_fee_cents: 2500, late_penalty_cents: 3000, monthly_billing_cap_cents: 1000000 }, as: ProgramCoordinator, captures: { track_id: $.data.id } }
            - { call: "POST /econsult/referring-providers", payload: { full_name: "Dr. Priya Primary", npi: "1000000151" }, as: ProgramCoordinator, captures: { prov_id: $.data.id } }
            - { call: "POST /econsult/specialists", payload: { full_name: "Dr. Sam Specialist", npi: "2000000151" }, as: ProgramCoordinator, captures: { spec_id: $.data.id } }
            - { call: "POST /econsult/panel-memberships", payload: { specialist_id: "${spec_id}", specialty_track_id: "${track_id}" }, as: ProgramCoordinator, captures: { memb_id: $.data.id } }
            - { call: "POST /econsult/specialist-availability-windows", payload: { membership_id: "${memb_id}", window_start: "2026-05-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z" }, as: Specialist, as_user_id: "${spec_id}" }
            - { call: "POST /econsult/consult-requests", payload: { patient_ref: "PAT-TO1", specialty_track_id: "${track_id}", question_text: "Exertional dyspnea with EF 35 percent on echo; convert to heart-failure clinic visit please.", icd10_primary: "I50", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${prov_id}", captures: { c1: $.data.id } }
            - { call: "POST /econsult/consult-requests/${c1}/responses", payload: { disposition: "CONVERT_TO_VISIT", recommendation_text: "New HFrEF needs in-person titration visit and device evaluation; converting to clinic." }, as: Specialist, as_user_id: "${spec_id}" }
            - { call: "POST /econsult/consult-requests", payload: { patient_ref: "PAT-TO2", specialty_track_id: "${track_id}", question_text: "Recurrent presyncope with family history of sudden death; needs in-person evaluation and testing.", icd10_primary: "R42", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${prov_id}", captures: { c2: $.data.id } }
            - { call: "POST /econsult/consult-requests/${c2}/responses", payload: { disposition: "CONVERT_TO_VISIT", recommendation_text: "High-risk syncope phenotype; convert for exam, ECG, echo and possible loop recorder." }, as: Specialist, as_user_id: "${spec_id}" }
            - { call: "POST /econsult/consult-requests", payload: { patient_ref: "PAT-TO3", specialty_track_id: "${track_id}", question_text: "Complex congenital history with new symptoms; clearly needs face-to-face congenital clinic visit.", icd10_primary: "Q24", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${prov_id}", captures: { c3: $.data.id } }
            - { call: "POST /econsult/consult-requests/${c3}/responses", payload: { disposition: "CONVERT_TO_VISIT", recommendation_text: "ACHD anatomy requires in-person assessment and imaging review; converting to clinic." }, as: Specialist, as_user_id: "${spec_id}" }
            - { call: "POST /econsult/consult-requests/${c1}/conversions", payload: { appointment_start: "2026-06-10T10:00:00Z", appointment_end: "2026-06-10T11:00:00Z" }, as: Specialist, as_user_id: "${spec_id}", captures: { conv1_id: $.data.id } }
          trigger:
            - { call: "POST /econsult/consult-requests/${c2}/conversions", payload: { appointment_start: "2026-06-10T11:30:00Z", appointment_end: "2026-06-10T12:00:00Z" }, as: Specialist, as_user_id: "${spec_id}", captures: { conv2_id: $.data.id, conv2_status: $.data.status } }
            - { call: "POST /econsult/consult-requests/${c3}/conversions", payload: { appointment_start: "2026-06-10T11:29:00Z", appointment_end: "2026-06-10T12:00:00Z" }, as: Specialist, as_user_id: "${spec_id}", captures: { err_id: $.data.error_id } }
          assert:
            - "C2 starting exactly 30 minutes after C1.end: created SCHEDULED (11:30 < 11:00+30min is false — boundary excluded)"
            - "C3 starting 29 minutes after C1.end: error_id == ERR_APPOINTMENT_WINDOW_OVERLAP (409)"
            - "the exact-30-minute gap rule and the buffer inflation distinguish this from the half-open availability semantics"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: provisional_cents_conserved_across_submit_and_rebuke
        grounds:
          - entities.PanelMembership.fields.provisional_balance_cents
          - state_machines.ConsultResponse.SUBMITTED_to_REBUKED
          - calculations.provisional_response_fee
        distinguishing_aspect: |
          Conserved quantity = money in cents. Invariant: provisional_balance_cents
          == sum of PROVISIONAL entry amounts; the forward action (response submit,
          +10000) paired with its compensating action (REBUKE review reversing the
          entry, -10000) MUST return the balance to its exact pre-submit value 0 —
          a cascade that leaves drift would fail this.
        test_recipe:
          setup:
            - "Track CARDIOLOGY standard; membership with zero balances; consult assigned"
          setup_api_calls:
            - { call: "POST /econsult/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /econsult/specialty-tracks", payload: { specialty_code: CARDIOLOGY, response_time_target_hours: 48, urgent_target_hours: 12, base_response_fee_cents: 10000, conversion_response_fee_cents: 8000, clarification_fee_cents: 2500, late_penalty_cents: 3000, monthly_billing_cap_cents: 1000000 }, as: ProgramCoordinator, captures: { track_id: $.data.id } }
            - { call: "POST /econsult/referring-providers", payload: { full_name: "Dr. Priya Primary", npi: "1000000161" }, as: ProgramCoordinator, captures: { prov_id: $.data.id } }
            - { call: "POST /econsult/specialists", payload: { full_name: "Dr. Sam Specialist", npi: "2000000161" }, as: ProgramCoordinator, captures: { spec_id: $.data.id } }
            - { call: "POST /econsult/specialists", payload: { full_name: "Dr. Quinn Reviewer", npi: "2000000162" }, as: ProgramCoordinator, captures: { rev_id: $.data.id } }
            - { call: "POST /econsult/panel-memberships", payload: { specialist_id: "${spec_id}", specialty_track_id: "${track_id}" }, as: ProgramCoordinator, captures: { memb_id: $.data.id } }
            - { call: "POST /econsult/specialist-availability-windows", payload: { membership_id: "${memb_id}", window_start: "2026-05-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z" }, as: Specialist, as_user_id: "${spec_id}" }
            - { call: "GET /econsult/panel-memberships/${memb_id}/compensation-summary", as: ProgramCoordinator, captures: { prov_t0: $.data.provisional_balance_cents } }
            - { call: "POST /econsult/consult-requests", payload: { patient_ref: "PAT-CI1", specialty_track_id: "${track_id}", question_text: "Wolff-Parkinson-White pattern on ECG, asymptomatic; asks about activity restrictions pending ablation.", icd10_primary: "I45", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${prov_id}", captures: { cons_id: $.data.id } }
            - { call: "POST /econsult/consult-requests/${cons_id}/responses", payload: { disposition: "MANAGE_WITH_PLAN", recommendation_text: "Avoid high-intensity sport until EP study; refer for ablation evaluation within 1 month." }, as: Specialist, as_user_id: "${spec_id}", captures: { resp_id: $.data.id } }
            - { call: "GET /econsult/panel-memberships/${memb_id}/compensation-summary", as: ProgramCoordinator, captures: { prov_t1: $.data.provisional_balance_cents } }
            - { call: "POST /econsult/quality-reviews", payload: { response_id: "${resp_id}" }, as: QualityReviewer, as_user_id: "${rev_id}", captures: { rev_1: $.data.id } }
          trigger:
            - { call: "POST /econsult/quality-reviews/${rev_1}/complete", payload: { timeliness_score: 2, appropriateness_score: 1, clarity_score: 4, verdict: "REBUKE" }, as: QualityReviewer, as_user_id: "${rev_id}" }
            - { call: "GET /econsult/panel-memberships/${memb_id}/compensation-summary", as: ProgramCoordinator, captures: { prov_t2: $.data.provisional_balance_cents } }
          assert:
            - "t0 (before response): provisional_balance_cents == 0"
            - "t1 (after response): provisional_balance_cents == 10000 (forward action)"
            - "t2 (after REBUKE reversal): provisional_balance_cents == 0 == t0 (compensating action restores the conserved quantity exactly)"

      - name: open_consult_count_conserved_across_assign_and_cancel
        grounds:
          - entities.PanelMembership.fields.open_consult_count
          - state_machines.ConsultRequest.ASSIGNED_to_CANCELLED
          - state_machines.ConsultRequest.SUBMITTED_to_ASSIGNED
        distinguishing_aspect: |
          Conserved quantity = a count of open consults (different type than the
          cents invariant of the sibling). Invariant: open_consult_count ==
          number of this membership's consults in ASSIGNED or
          CLARIFICATION_REQUESTED; assign (+1) paired with cancel (-1) MUST
          return the counter to its exact prior value 0.
        test_recipe:
          setup:
            - "Track CARDIOLOGY standard; membership with covering window and zero open consults"
          setup_api_calls:
            - { call: "POST /econsult/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /econsult/specialty-tracks", payload: { specialty_code: CARDIOLOGY, response_time_target_hours: 48, urgent_target_hours: 12, base_response_fee_cents: 10000, conversion_response_fee_cents: 8000, clarification_fee_cents: 2500, late_penalty_cents: 3000, monthly_billing_cap_cents: 1000000 }, as: ProgramCoordinator, captures: { track_id: $.data.id } }
            - { call: "POST /econsult/referring-providers", payload: { full_name: "Dr. Priya Primary", npi: "1000000171" }, as: ProgramCoordinator, captures: { prov_id: $.data.id } }
            - { call: "POST /econsult/specialists", payload: { full_name: "Dr. Sam Specialist", npi: "2000000171" }, as: ProgramCoordinator, captures: { spec_id: $.data.id } }
            - { call: "POST /econsult/panel-memberships", payload: { specialist_id: "${spec_id}", specialty_track_id: "${track_id}" }, as: ProgramCoordinator, captures: { memb_id: $.data.id } }
            - { call: "POST /econsult/specialist-availability-windows", payload: { membership_id: "${memb_id}", window_start: "2026-05-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z" }, as: Specialist, as_user_id: "${spec_id}" }
            - { call: "GET /econsult/panel-memberships/${memb_id}", as: ProgramCoordinator, captures: { open_t0: $.data.open_consult_count } }
            - { call: "POST /econsult/consult-requests", payload: { patient_ref: "PAT-CI2", specialty_track_id: "${track_id}", question_text: "Asks whether home INR monitoring is appropriate for stable mechanical valve patient.", icd10_primary: "Z95", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${prov_id}", captures: { cons_id: $.data.id } }
            - { call: "GET /econsult/panel-memberships/${memb_id}", as: ProgramCoordinator, captures: { open_t1: $.data.open_consult_count } }
          trigger:
            - { call: "POST /econsult/consult-requests/${cons_id}/cancel", as: ReferringProvider, as_user_id: "${prov_id}" }
            - { call: "GET /econsult/panel-memberships/${memb_id}", as: ProgramCoordinator, captures: { open_t2: $.data.open_consult_count } }
          assert:
            - "t0: open_consult_count == 0"
            - "t1 (after assignment): open_consult_count == 1"
            - "t2 (after cancel): open_consult_count == 0 == t0"
            - "cancelled consult status == CANCELLED and billing_status == VOID"
