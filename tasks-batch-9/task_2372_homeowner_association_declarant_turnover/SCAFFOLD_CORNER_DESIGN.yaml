              as: Declarant
              as_user_id: "declarant-1"
              captures: { comp_id: $.data.id }
            - call: "POST /hoa/vendor-contracts"
              payload: { association_id: "${assoc_id}", component_id: "${comp_id}", vendor_name: "Declarant Road Services", developer_affiliated: true, annual_cost_cents: 80000, service_window_start: "2026-01-01T00:00:00Z", service_window_end: "2026-12-01T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { contract_id: $.data.id }
            - call: "POST /hoa/audit-engagements"
              payload: { association_id: "${assoc_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: Auditor
              as_user_id: "auditor-9"
              captures: { eng_id: $.data.id }
            - call: "POST /hoa/audit-engagements/${eng_id}/issue"
              payload: {}
              as: Auditor
              as_user_id: "auditor-9"
            - call: "POST /hoa/turnover-cases/${case_id}/certify-trigger"
              payload: { trigger_basis: "FIXED_DATE" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "POST /hoa/directors"
              payload: { turnover_case_id: "${case_id}", full_name: "Bex Ferrand", seat_type: "OWNER_ELECTED" }
              as: ElectionInspector
              as_user_id: "inspector-1"
            - call: "POST /hoa/directors"
              payload: { turnover_case_id: "${case_id}", full_name: "Cai Mwangi", seat_type: "OWNER_ELECTED" }
