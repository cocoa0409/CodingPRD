            - { call: "POST /glass/usage-reports/${ur1_id}/dispute", payload: { reason: "channel mapping wrong" }, as: FinanceController }
            - { call: "POST /glass/usage-reports", payload: { license_id: "${lic_id}", period_start: "2027-02-01T00:00:00Z", period_end: "2027-04-30T00:00:00Z", lines: [{ channel: "DOMESTIC", units: 50, net_revenue_cents: 25000 }] }, as: DeviceMaker, as_user_id: "${m_id}", captures: { ur2_id: $.data.id } }
