  - rule_id: non_linear_state_machine
    instances:

      - name: fill_cycle_insurance_and_packaging_dimensions_move_independently
        grounds:
          - state_machines.FillCycle
          - state_machines.FillCycle.REJECTED_TOO_SOON_to_CLEARED
          - entities.FillCycle.fields.insurance_status
          - entities.FillCycle.fields.packaging_status
          - entities.FillCycle.fields.approved_vacation_extra_days
          - validations.priority_10
        distinguishing_aspect: |
          Entity FillCycle, shape PARALLEL: the cycle carries two independent state
          dimensions. The insurance dimension walks NOT_ADJUDICATED -> REJECTED_TOO_SOON
          -> CLEARED (a backward-then-forward move driven by a payer override) while the
          packaging dimension is explicitly NOT touched, and afterwards packaging advances
          on its own with the insurance dimension frozen at CLEARED.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "plan with refill_too_soon_threshold_pct 75, allows_payer_vacation_override true, vacation_overrides_per_year 1"
            - "one patient synchronized BRIDGE_TO_START on anchor day 15, no controlled prescriptions"
            - "rx1 Metformin ER [MORNING,BEDTIME] last dispensed 2026-07-25 / 28 days -> refill_pct_used 75, clears"
            - "rx6 Amlodipine [MORNING] last dispensed 2026-08-04 / 30 days -> refill_pct_used floor(100*11/30) = 36, too soon"
            - "an approved PAYER_OVERRIDE vacation exception for 7 extra days"
          setup_api_calls:
            - call: "POST /pharmacy/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pharmacy/insurance-plans"
              payload: { payer_name: "Northwind PBM", bin_number: "610502", generic_copay_cents_per_day: 34, brand_copay_cents_per_day: 74, specialty_copay_cents_per_day: 44, refill_too_soon_threshold_pct: 75, max_day_supply_days: 90, vacation_overrides_per_year: 1, coinsurance_pct: 20, allows_payer_vacation_override: true }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Omar Haddad", date_of_birth: "1952-01-19", email: "omar.haddad@example.com", state_code: "WA", insurance_plan_id: "${plan_id}" }
              as: PharmacyOperations
              captures: { pt_id: $.data.id }
            - call: "POST /pharmacy/prescriptions"
              payload: { patient_id: "${pt_id}", prescriber_npi: "1487654321", drug_name: "Metformin ER", ndc: "00093-1049-01", strength: "500mg", form: "TABLET", copay_tier: "GENERIC", dose_times: ["MORNING", "BEDTIME"], quantity_per_dose: 1, days_supply_written: 30, refills_authorized: 3, written_date: "2026-05-01", expiration_date: "2027-05-01", last_dispensed_date: "2026-07-25", last_dispensed_days_supply: 28 }
              as: Prescriber
              captures: { rx1: $.data.id }
            - call: "POST /pharmacy/prescriptions"
              payload: { patient_id: "${pt_id}", prescriber_npi: "1487654321", drug_name: "Amlodipine", ndc: "00093-0817-01", strength: "5mg", form: "TABLET", copay_tier: "GENERIC", dose_times: ["MORNING"], quantity_per_dose: 1, days_supply_written: 30, refills_authorized: 3, written_date: "2026-05-01", expiration_date: "2027-05-01", last_dispensed_date: "2026-08-04", last_dispensed_days_supply: 30 }
              as: Prescriber
              captures: { rx6: $.data.id }
            - call: "POST /pharmacy/patients/${pt_id}/synchronize"
              payload: { anchor_fill_day: 15, sync_mode: "BRIDGE_TO_START" }
              as: PharmacyOperations
            - call: "POST /pharmacy/fill-cycles"
              payload: { patient_id: "${pt_id}", cycle_start_date: "2026-08-15", day_supply_days: 28 }
              as: PharmacyOperations
              captures: { c1: $.data.id }
            - call: "POST /pharmacy/vacation-exceptions"
              payload: { patient_id: "${pt_id}", travel_start_date: "2026-09-01", travel_end_date: "2026-09-14", requested_extra_days: 7 }
              as: PharmacyOperations
              captures: { vac: $.data.id }
