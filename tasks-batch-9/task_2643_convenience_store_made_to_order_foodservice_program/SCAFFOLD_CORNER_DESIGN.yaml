          assert:
            - "${e_mto} == ERR_ITEM_NOT_PAR_BAKED"
            - "${e_slot} == ERR_SLOT_INDEX_OUT_OF_RANGE"
            - "${e_supply} == ERR_INSUFFICIENT_BATCH_QTY"
            - "${expires} == 2026-08-01T10:00:00Z"
            - "${e_qty} == ERR_DISCARD_QTY_EXCEEDS_REMAINING"
            - "${e_sensor} == ERR_TEMP_READING_OUT_OF_SENSOR_RANGE"
            - "${e_expired} == ERR_BATCH_HOLD_EXPIRED"
            - "${e_expired} != ERR_INSUFFICIENT_BATCH_QTY"
            - "Order.${order_1}.production_status == DRAFT"
            - "Order.${order_2}.production_status == DRAFT"
            - "ProductionBatch.${batch_id}.status == HOLDING"
            - "ProductionBatch.${batch_id}.remaining_qty == 40"
            - "ProductionBatch.${batch_id}.reserved_qty == 0"
            - "HoldingUnit.${unit_id}.status == OPERATIONAL"
            - "HoldingUnit.${unit_id}.consecutive_out_of_range_count == 0"
            - "GET /holding-units/${unit_id}/temperature-logs -> total_count == 0"
            - "GET /production-batches?store_id=${store_id} -> total_count == 1"

      - name: order_intake_rejections_cover_the_window_and_catering_error_ids
