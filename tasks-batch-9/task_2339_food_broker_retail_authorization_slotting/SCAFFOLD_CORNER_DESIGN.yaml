            - call: "POST /deductions"
              payload: { retailer_id: "${ret}", principal_id: "${p2}", reason_code: "SHORTAGE", amount_cents: 60000, deduction_date: "2026-08-01" }
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { d2: $.data.id }
          trigger:
            - call: "GET /principals/${p1}"
              payload: {}
              as: PrincipalPortalUser
              as_user_id: "${p1}"
              captures: { own: $.data.code }
            - call: "GET /principals/${p2}"
              payload: {}
              as: PrincipalPortalUser
              as_user_id: "${p1}"
              captures: { e1: $.data.error_id }
            - call: "GET /items/${i2}"
              payload: {}
              as: PrincipalPortalUser
              as_user_id: "${p1}"
              captures: { e2: $.data.error_id }
            - call: "GET /items/${i1}"
              payload: {}
              as: PrincipalPortalUser
              as_user_id: "${p1}"
              captures: { u1: $.data.upc }
            - call: "GET /deductions/${d2}"
              payload: {}
              as: PrincipalPortalUser
              as_user_id: "${p1}"
              captures: { e3: $.data.error_id }
            - call: "GET /principals/${p2}/commission-statement"
              payload: { retailer_id: "${ret}", category_code: "FROZEN_SNACKS" }
