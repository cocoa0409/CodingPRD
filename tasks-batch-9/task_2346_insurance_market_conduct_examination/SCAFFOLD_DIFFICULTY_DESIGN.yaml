      - name: data_call_acceptance_at_exact_effective_completeness_boundary
        grounds:
          - calculations.data_call_completeness
          - validations[priority 67 ERR_RESPONSE_INCOMPLETE]
          - endpoints[POST /market-conduct/_clock/set_current_utc]
          - state_machines.DataCall
        distinguishing_aspect: |
          The boundary is crossed by ONE DAY of lateness rather than by any change in the production
          itself: both carriers deliver 4000 of 4000 records (completeness_pct 100.00), but responding
          10 days late gives effective_completeness_pct exactly 95.00 (accepted, >= not >) while 11 days
          late gives 94.50 and is refused. The penalty is applied to the already-rounded completeness,
          so the arithmetic order is pinned too.
        test_recipe:
          setup:
            - "AURORA carrier; ON_SITE examination 2026-09-01 .. 2026-11-30, scope locked with CLAIMS (population 4000, sample 10) and UNDERWRITING (population 4000, sample 10)."
            - "One data call per area, each requesting 4000 records with response_due_date 2026-09-15, both issued while the logical clock is still at its 2026-08-01T00:00:00Z default."
            - "Neither call has been responded to."
          setup_api_calls:
            - call: "POST /market-conduct/insurers"
              payload: { name: "Aurora Mutual Insurance Company", naic_code: "10001", annual_premium_written_cents: 1200000000, policy_count_in_force: 40000, confirmed_complaints_12mo: 120, financial_stress_score: 60, consumer_trend_score: 50 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { aurora_id: "$.data.id" }
            - call: "POST /market-conduct/examinations"
              payload: { insurer_id: "${aurora_id}", exam_type: "MARKET_CONDUCT_EXAM", mode: "ON_SITE", lead_state_code: "NV", fieldwork_start_date: "2026-09-01", fieldwork_end_date: "2026-11-30" }
              as: SupervisingExaminer
              as_user_id: "11111111-1111-1111-1111-111111111111"
              captures: { exam_id: "$.data.id" }
            - call: "POST /market-conduct/examinations/${exam_id}/scope-areas"
              payload: { area: "CLAIMS", population_size: 4000, sample_size: 10 }
              as: ExaminerInCharge
              as_user_id: "33333333-3333-3333-3333-333333333333"
              captures: { clm_area_id: "$.data.id" }
            - call: "POST /market-conduct/examinations/${exam_id}/scope-areas"
              payload: { area: "UNDERWRITING", population_size: 4000, sample_size: 10 }
              as: ExaminerInCharge
              as_user_id: "33333333-3333-3333-3333-333333333333"
              captures: { uw_area_id: "$.data.id" }
            - call: "POST /market-conduct/examinations/${exam_id}/lock-scope"
              as: SupervisingExaminer
              as_user_id: "11111111-1111-1111-1111-111111111111"
            - call: "POST /market-conduct/scope-areas/${clm_area_id}/data-calls"
              payload: { records_requested: 4000, response_due_date: "2026-09-15" }
              as: ExaminerInCharge
              as_user_id: "33333333-3333-3333-3333-333333333333"
              captures: { clm_dc_id: "$.data.id" }
            - call: "POST /market-conduct/scope-areas/${uw_area_id}/data-calls"
              payload: { records_requested: 4000, response_due_date: "2026-09-15" }
              as: ExaminerInCharge
              as_user_id: "33333333-3333-3333-3333-333333333333"
              captures: { uw_dc_id: "$.data.id" }
          trigger:
            - call: "POST /market-conduct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-25T09:00:00Z" }
              as: ExaminerInCharge
              as_user_id: "33333333-3333-3333-3333-333333333333"
              captures: { clock1: "$.data.current_utc", flagged1: "$.data.data_calls_flagged_overdue" }
            - call: "POST /market-conduct/data-calls/${clm_dc_id}/respond"
              payload: { records_received: 4000, submitted_by_contact: "D. Reyes, Compliance Director" }
              as: InsurerRespondent
              as_user_id: "${aurora_id}"
              captures: { clm_days_late: "$.data.days_late", clm_completeness: "$.data.completeness_pct", clm_effective: "$.data.effective_completeness_pct" }
            - call: "POST /market-conduct/data-calls/${clm_dc_id}/disposition"
              payload: { disposition: "ACCEPTED", disposition_reason: "Late but complete; effective completeness meets the statutory floor." }
              as: ExaminerInCharge
              as_user_id: "33333333-3333-3333-3333-333333333333"
              captures: { clm_status: "$.data.status", clm_drawn: "$.data.samples_drawn_count" }
            - call: "POST /market-conduct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-26T09:00:00Z" }
              as: ExaminerInCharge
              as_user_id: "33333333-3333-3333-3333-333333333333"
              captures: { clock2: "$.data.current_utc", flagged2: "$.data.data_calls_flagged_overdue" }
            - call: "POST /market-conduct/data-calls/${uw_dc_id}/respond"
              payload: { records_received: 4000, submitted_by_contact: "D. Reyes, Compliance Director" }
              as: InsurerRespondent
              as_user_id: "${aurora_id}"
              captures: { uw_days_late: "$.data.days_late", uw_effective: "$.data.effective_completeness_pct" }
            - call: "POST /market-conduct/data-calls/${uw_dc_id}/disposition"
              payload: { disposition: "ACCEPTED", disposition_reason: "Attempted acceptance of a production one day later." }
              as: ExaminerInCharge
              as_user_id: "33333333-3333-3333-3333-333333333333"
          assert:
            - "The first clock advance reports data_calls_flagged_overdue == 2 and both data calls move ISSUED -> OVERDUE"
            - "The second clock advance reports data_calls_flagged_overdue == 0 (already flagged calls are not re-flagged)"
            - "DataCall.${clm_dc_id}: is_late == true, days_late == 10, completeness_pct == 100.00, effective_completeness_pct == 95.00"
            - "The CLAIMS disposition ACCEPTED succeeds (95.00 >= ACCEPTANCE_COMPLETENESS_PCT 95.00), status == ACCEPTED, sample_draw_interval == 400, samples_drawn_count == 10"
            - "DataCall.${uw_dc_id}: days_late == 11, completeness_pct == 100.00, effective_completeness_pct == 94.50"
            - "The UNDERWRITING disposition ACCEPTED returns 409 ERR_RESPONSE_INCOMPLETE"
            - "DataCall.${uw_dc_id}.status is still RESPONDED with samples_drawn_count == 0 and GET /market-conduct/data-calls/${uw_dc_id}/file-samples total_count == 0"
            - "ExamScopeArea.${uw_area_id}.status is still PLANNED while ExamScopeArea.${clm_area_id}.status == FIELDWORK"
            - "Examination.${exam_id}.status == FIELDWORK (the first acceptance moved it) and rejected_data_call_count == 0"

      - name: zero_policy_count_yields_unrated_tier_and_zero_complaint_ratio
        grounds:
          - calculations.complaint_ratio_per_1k
          - calculations.composite_analysis_score
          - entities.Insurer.fields.risk_tier
          - entities.AnalysisScore.fields.complaint_ratio_at_scoring
        distinguishing_aspect: |
          The degenerate denominator: an insurer with 0 policies in force and 7 confirmed complaints must
          yield complaint_ratio_per_1k 0.00 and risk_tier UNRATED instead of a division error or an
          infinite ratio, and must still be scorable - the composite comes out at 14.00 from the
          remaining components. This is the empty-input boundary, not a threshold boundary.
        test_recipe:
          setup:
            - "Insurer ZERO: policy_count_in_force 0, confirmed_complaints_12mo 7, financial_stress_score 20, consumer_trend_score 10, annual_premium_written_cents 100000000, license_status LICENSED (a newly licensed carrier that has written no policies yet)."
            - "Insurer CEDAR: 30000 policies, 60 complaints (ratio 2.00 -> MODERATE), financial_stress_score 40, consumer_trend_score 30, annual_premium_written_cents 800000000 -> composite 34.00."
            - "One DRAFT analysis cycle with target_slot_capacity 2."
          setup_api_calls:
            - call: "POST /market-conduct/insurers"
              payload: { name: "Zero Point Assurance Company", naic_code: "10009", annual_premium_written_cents: 100000000, policy_count_in_force: 0, confirmed_complaints_12mo: 7, financial_stress_score: 20, consumer_trend_score: 10 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { zero_id: "$.data.id", zero_ratio: "$.data.complaint_ratio_per_1k", zero_tier: "$.data.risk_tier" }
            - call: "POST /market-conduct/insurers"
              payload: { name: "Cedar Ridge Mutual Insurance Company", naic_code: "10003", annual_premium_written_cents: 800000000, policy_count_in_force: 30000, confirmed_complaints_12mo: 60, financial_stress_score: 40, consumer_trend_score: 30 }
