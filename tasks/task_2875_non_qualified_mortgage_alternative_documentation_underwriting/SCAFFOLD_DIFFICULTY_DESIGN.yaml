              as: LoanOfficer
              captures: { bor_to_id: "$.data.id" }
            - call: "POST /loan-files"
              payload: { borrower_id: "${bor_to_id}", program_id: "${prog_to_id}", investor_code: "INV-ATLAS", loan_amount_cents: 60000000, property_value_cents: 75000000, occupancy: "PRIMARY", purpose: "RATE_TERM_REFI", lien_position: "FIRST", note_rate_pct: 8.750, apor_pct: 6.100, term_months: 360, amortization_type: "FULLY_AMORTIZING", monthly_taxes_cents: 78000, monthly_insurance_cents: 22000, monthly_hoa_cents: 0 }
