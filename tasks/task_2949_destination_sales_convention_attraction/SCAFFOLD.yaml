    side_effects: ["committed_amount, disbursed_amount and lodging_tax_receipts_total initialized to 0.00", "uncommitted_amount initialized to budget_amount and posture initialized to OPEN"]

  - method: GET
    path: "/incentive-funds/{id}"
    description: "Reads one fund including its live posture and uncommitted balance."
    roles: [BureauAdmin, IncentiveApprover, SalesManager, BoardAnalyst]
    code: 200
    input: []
    output: IncentiveFund
    side_effects: []

  - method: GET
    path: "/incentive-funds"
    description: "Lists funds with optional fiscal-year / posture filters and offset pagination."
    roles: [BureauAdmin, IncentiveApprover, BoardAnalyst]
    code: 200
    input: ["fiscal_year?", "posture?", "limit?", "offset?"]
    output: IncentiveFund[]
    side_effects: []

  - method: POST
