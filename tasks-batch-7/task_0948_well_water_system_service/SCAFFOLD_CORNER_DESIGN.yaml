        distinguishing_aspect: |
          The two UPPER markup bands invert exactly the way the lower one does: a
          25000-cent part prices at round_half_up(25000*1.40) = 35000 while a
          25001-cent part prices at round_half_up(25001*1.28) = 32001, and a
          100000-cent part prices at round_half_up(100000*1.28) = 128000 while a
          100001-cent part prices at round_half_up(100001*1.18) = 118001. An
          implementation that applies the markup marginally instead of flat, or that
          treats the band bound as exclusive, returns a monotone series instead.
