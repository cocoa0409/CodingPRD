          - entities.Contractor.fields.line_types_certified
        distinguishing_aspect: |
          A DIFFERENT priority pair on a different endpoint with the same HTTP status on both sides:
          both candidate errors are 422, so a naive implementation cannot fall back on status ordering -
          only the declared priority (40 business_safety before 50 business_referential) picks the winner.
