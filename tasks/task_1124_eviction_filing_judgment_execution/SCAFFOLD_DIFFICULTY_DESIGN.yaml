            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T08:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/cases/${c}/notices", payload: { notice_type: "PAY_OR_QUIT", served_on: "2026-05-02", claimed_rent_owed_cents: 100000, expected_case_version: "${cv}" }, as: Landlord, as_user_id: "${ll}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-06T00:00:01Z" }, as: PlatformAdmin }
            - { call: "POST /api/ops/runs", payload: {}, as: CourtClerk }
            - { call: "POST /api/cases/${c}/filing-packages", payload: { claimed_amount_cents: 100000, defendant_names: ["Dee A"], jury_demanded: false, efiled: false }, as: Landlord, as_user_id: "${ll}", captures: { p: $.data.id } }
            - { call: "POST /api/filing-packages/${p}/fee-payments", payload: { amount_cents: 27250 }, as: Landlord, as_user_id: "${ll}" }
            - { call: "POST /api/filing-packages/${p}/review", payload: { decision: "ACCEPT" }, as: CourtClerk, as_user_id: "clerk-a" }
          trigger:
            - { call: "POST /api/cases/${c}/hearings", payload: { courtroom: "CR-1", start_at: "2026-05-08T10:00:00Z", end_at: "2026-05-08T10:30:00Z" }, as: CourtClerk, as_user_id: "clerk-a", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE (priority 7 state gate beats priority 25 temporal lead-time, even though both are violated)"

      - name: writ_request_safety_beats_fee
        grounds:
          - validations[priority=10]
          - validations[priority=37]
        distinguishing_aspect: |
          Pair: business_safety (p10 appeal window) vs business_fiscal (p37 writ fee). The
          judgment is still ENTERED (appeal window open) AND the paid fee is wrong; the
          safety error must win. Different category pair than the sibling (state vs temporal).
        test_recipe:
