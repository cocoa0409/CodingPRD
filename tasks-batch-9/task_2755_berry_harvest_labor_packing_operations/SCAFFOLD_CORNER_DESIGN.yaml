# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — task 2755 Berry Harvest Labor & Packing Ops
#
# §1.9 breadth index. The nine sections below are the nine sections of
# references/claim-extraction-guide.md, walked row-by-row against SCAFFOLD.yaml
# §1.1-§1.7. Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear
# as excluded_because stubs and carry no test_recipe.
#
# Logical clock: the server starts at exactly 2026-08-01T00:00:00Z. Chains that
# depend on the clock pin it explicitly with
# POST /berry-ops/_clock/set_current_utc.
#
# Opaque operator ids used throughout: hm-1 (HarvestManager), fso-1 / fso-2
# (FoodSafetyOfficer), sup-1 / sup-2 (CrewSupervisor, always equal to the
# owning Crew.supervisor_user_id), clerk-1 / clerk-2 (PayrollClerk, distinct for
# segregation of duties), pack-1 (PackhouseOperator), sales-1 (SalesManager).
# Picker-role callers use the server-minted Picker id (roles.Picker is
# identity: entity_backed:Picker).
#
# Every numeric literal in an assert was produced by executing the referenced
# calculations[].formula against its constants.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # 1. From Table 1 (Entities)
  # ===========================================================================
  - section: entities
    instances:

      - name: block_create_returns_every_declared_field_and_starts_restricted
        claim_type: creation
        grounds:
          - entities.Block
          - endpoints["POST /berry-ops/blocks"]
          - response_envelope
        distinguishing_aspect: |
          A block created with the five declared input fields answers 201 with
          the full Block projection in the fixed envelope, and its derived food
          safety fields start at the declared cold-start values —
          water_sample_count 0, water_geomean_mpn null, water_status NO_SAMPLES,
          food_safety_posture RESTRICTED — so a brand-new block is not
          pickable.
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned at the 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /berry-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: HarvestManager
              as_user_id: "hm-1"
          trigger:
            - call: "POST /berry-ops/blocks"
              payload: { name: "BLK-E1", variety: "STRAWBERRY", acres: 12.50, planting_year: 2023, irrigation_source_code: "WELL-E1" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { blk: $.data.id }
          assert:
            - "HTTP status is 201"
            - "response_type == object and meta.api_request_id is present and meta.api_request_timestamp is present"
            - "Block.${blk}.name == BLK-E1 and Block.${blk}.variety == STRAWBERRY and Block.${blk}.acres == 12.50"
            - "Block.${blk}.planting_year == 2023 and Block.${blk}.irrigation_source_code == WELL-E1"
            - "Block.${blk}.water_sample_count == 0 and Block.${blk}.water_geomean_mpn == null and Block.${blk}.last_sample_date == null"
            - "Block.${blk}.water_status == NO_SAMPLES and Block.${blk}.food_safety_posture == RESTRICTED"
            - "Block.${blk}.manual_quarantine_active == false and Block.${blk}.quarantined_by_user_id == null and Block.${blk}.quarantine_reason_code == null"
            - "Block.${blk}.version == 1 and Block.${blk}.id is present and Block.${blk}.created_at is present and Block.${blk}.updated_at is present"

      - name: block_get_returns_the_stored_row_with_its_recomputed_water_fields
        claim_type: retrieval
        grounds:
          - endpoints["GET /berry-ops/blocks/{block_id}"]
          - calculations.water_quality_status
          - entities.Block.fields.water_geomean_mpn
        distinguishing_aspect: |
          The single-resource read returns the same derived figures the water
          sample wrote — water_sample_count 1, water_geomean_mpn 40.0,
          water_status PROVISIONAL, food_safety_posture CLEARED, version 2 —
          rather than the create-time cold-start values.
        test_recipe:
          setup:
            - "One STRAWBERRY block carrying exactly one water sample of 40 MPN drawn 2026-07-20."
          setup_api_calls:
            - call: "POST /berry-ops/blocks"
              payload: { name: "BLK-E2", variety: "STRAWBERRY", acres: 9.00, planting_year: 2021, irrigation_source_code: "WELL-E2" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { blk: $.data.id }
            - call: "POST /berry-ops/water-tests"
              payload: { block_id: "${blk}", sample_date: "2026-07-20", generic_ecoli_mpn: 40 }
              as: FoodSafetyOfficer
              as_user_id: "fso-1"
          trigger:
            - call: "GET /berry-ops/blocks/${blk}"
              payload: {}
              as: PackhouseOperator
              as_user_id: "pack-1"
          assert:
            - "HTTP status is 200 and response_type == object"
            - "Block.${blk}.name == BLK-E2 and Block.${blk}.variety == STRAWBERRY"
            - "Block.${blk}.water_sample_count == 1 and Block.${blk}.water_geomean_mpn == 40.0 and Block.${blk}.last_sample_date == 2026-07-20"
            - "Block.${blk}.water_status == PROVISIONAL and Block.${blk}.food_safety_posture == CLEARED"
            - "Block.${blk}.version == 2"

      - name: blocks_list_filters_by_variety_and_reports_pagination_fields
        claim_type: listing
        grounds:
          - endpoints["GET /berry-ops/blocks"]
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          With two STRAWBERRY blocks and one BLUEBERRY block on file, the
          variety-filtered list answers response_type array with total_count 2,
          has_more false, limit 10 and offset 0, and the BLUEBERRY block is
          absent from data.
        test_recipe:
          setup:
            - "Three blocks: BLK-E3A and BLK-E3B are STRAWBERRY, BLK-E3C is BLUEBERRY."
          setup_api_calls:
            - call: "POST /berry-ops/blocks"
              payload: { name: "BLK-E3A", variety: "STRAWBERRY", acres: 4.00, planting_year: 2020, irrigation_source_code: "WELL-E3" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { blk_a: $.data.id }
            - call: "POST /berry-ops/blocks"
              payload: { name: "BLK-E3B", variety: "STRAWBERRY", acres: 5.00, planting_year: 2021, irrigation_source_code: "WELL-E3" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { blk_b: $.data.id }
            - call: "POST /berry-ops/blocks"
              payload: { name: "BLK-E3C", variety: "BLUEBERRY", acres: 6.00, planting_year: 2022, irrigation_source_code: "WELL-E3" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { blk_c: $.data.id }
          trigger:
            - call: "GET /berry-ops/blocks"
              payload: { variety: "STRAWBERRY" }
              as: SalesManager
              as_user_id: "sales-1"
          assert:
            - "HTTP status is 200 and response_type == array"
            - "total_count == 2 and has_more == false and limit == 10 and offset == 0"
            - "data contains Block.${blk_a} and Block.${blk_b}"
            - "data does not contain Block.${blk_c}"

      - name: crew_create_missing_supervisor_user_id_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Crew.fields.supervisor_user_id
          - validations[priority=10]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          supervisor_user_id has source input and no default, so a crew create
          that omits it is rejected with ERR_INVALID_REQUEST (400) by validation
          priority 10 and no Crew row is created.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /berry-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: HarvestManager
              as_user_id: "hm-1"
          trigger:
            - call: "POST /berry-ops/crews"
              payload: { name: "CREW-E4", labor_program: "DOMESTIC", planned_head_count: 4, contract_start_date: "2026-07-01", contract_end_date: "2026-09-30" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 400 and response_type == error"
            - "${err} == ERR_INVALID_REQUEST"
            - "GET /berry-ops/crews returns total_count == 0"

      - name: picker_create_omitting_hygiene_training_on_applies_null_default
        claim_type: defaults
        grounds:
          - entities.Picker.fields.hygiene_training_on
          - entities.Picker.fields.hygiene_training_expires_on
          - entities.Picker.fields.labor_program
          - state_machines.Crew.RECRUITING_to_STAFFED
        distinguishing_aspect: |
          hygiene_training_on is the only optional input on the picker create, so
          omitting it stores null and leaves hygiene_training_expires_on null,
          while labor_program is still copied as H2A from the crew and
          avg_lbs_per_hour is exactly 0.00; the crew nevertheless moves
          RECRUITING -> STAFFED on this first picker.
        test_recipe:
          setup:
            - "One H2A crew CREW-E5 with planned_head_count 2 and no pickers."
          setup_api_calls:
            - call: "POST /berry-ops/crews"
              payload: { name: "CREW-E5", labor_program: "H2A", supervisor_user_id: "sup-1", planned_head_count: 2, contract_start_date: "2026-07-01", contract_end_date: "2026-09-30" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { crew: $.data.id }
          trigger:
            - call: "POST /berry-ops/pickers"
              payload: { crew_id: "${crew}", full_name: "Untrained Worker" }
              as: CrewSupervisor
              as_user_id: "sup-1"
              captures: { pk: $.data.id }
          assert:
            - "HTTP status is 201"
            - "Picker.${pk}.hygiene_training_on == null and Picker.${pk}.hygiene_training_expires_on == null"
            - "Picker.${pk}.labor_program == H2A"
            - "Picker.${pk}.total_clamshells_lifetime == 0 and Picker.${pk}.total_hours_lifetime == 0.00 and Picker.${pk}.avg_lbs_per_hour == 0.00"
            - "Crew.${crew}.picker_count == 1 and Crew.${crew}.status == STAFFED"
            - "Crew.${crew}.support_plan_complete == false and Crew.${crew}.housing_unit_code == null and Crew.${crew}.beds_confirmed == 0"

      - name: fruit_lot_computed_fields_derive_net_packed_lbs_and_traceability_code
        claim_type: computed_fields
        grounds:
          - calculations.lot_pack_mass_balance
          - entities.FruitLot.fields.net_packed_lbs
          - entities.FruitLot.fields.traceability_code
          - entities.FruitLot.fields.variety
        distinguishing_aspect: |
          47 clamshells at 0.75 lb produce net_packed_lbs 35.25 and
          available_lbs 35.25, the variety is copied from the block rather than
          trusted from the body, and the traceability label is the composed
          literal BLK-CF1-20260803-B-001 — never a random id.
        test_recipe:
          setup:
            - "One STRAWBERRY block named BLK-CF1 and one PLANNED harvest window spanning 2026-08-03."
            - "No other lot shares (block, 2026-08-03, grade B), so the traceability sequence is 001."
          setup_api_calls:
            - call: "POST /berry-ops/blocks"
              payload: { name: "BLK-CF1", variety: "STRAWBERRY", acres: 7.00, planting_year: 2022, irrigation_source_code: "WELL-CF1" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { blk: $.data.id }
            - call: "POST /berry-ops/crews"
              payload: { name: "CREW-CF1", labor_program: "DOMESTIC", supervisor_user_id: "sup-1", planned_head_count: 1, contract_start_date: "2026-07-01", contract_end_date: "2026-09-30" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { crew: $.data.id }
            - call: "POST /berry-ops/harvest-windows"
              payload: { block_id: "${blk}", crew_id: "${crew}", start_at: "2026-08-03T06:00:00Z", end_at: "2026-08-03T18:00:00Z", forecast_brix: 8.5, planned_volume_lbs: 150.00, piece_rate_cents_per_clamshell: 45, clamshell_net_weight_lbs: 0.75 }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { win: $.data.id }
          trigger:
            - call: "POST /berry-ops/fruit-lots"
              payload: { harvest_window_id: "${win}", block_id: "${blk}", pick_date: "2026-08-03", variety: "STRAWBERRY", grade: "B", clamshell_count: 47, clamshell_net_weight_lbs: 0.75, pack_completed_at: "2026-08-03T09:00:00Z", field_pulp_temp_f: 66.0 }
              as: PackhouseOperator
              as_user_id: "pack-1"
              captures: { lot: $.data.id }
          assert:
            - "HTTP status is 201"
            - "FruitLot.${lot}.net_packed_lbs == 35.25 and FruitLot.${lot}.available_lbs == 35.25 and FruitLot.${lot}.allocated_lbs == 0.00"
            - "FruitLot.${lot}.traceability_code == BLK-CF1-20260803-B-001"
            - "FruitLot.${lot}.variety == STRAWBERRY"
            - "FruitLot.${lot}.cold_chain_status == PACKED and FruitLot.${lot}.disposition_status == UNCOMMITTED"
            - "FruitLot.${lot}.source_lot_id == null and FruitLot.${lot}.cooling_tunnel_id == null and FruitLot.${lot}.food_safety_hold == false"
            - "FruitLot.${lot}.repack_out_lbs == 0.00 and FruitLot.${lot}.cull_lbs == 0.00 and FruitLot.${lot}.optical_reject_lbs == 0.00"
            - "FruitLot.${lot}.forecast_shelf_life_days == null and FruitLot.${lot}.verified_shelf_life_days == null and FruitLot.${lot}.shelf_life_expires_on == null"
            - "HarvestWindow.${win}.packed_lbs == 35.25"

      - name: block_create_with_client_supplied_posture_and_counters_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Block.fields.manual_quarantine_active
          - entities.Block.fields.food_safety_posture
          - entities.Block.fields.water_status
        distinguishing_aspect: |
          id, version, water_status, food_safety_posture and
          manual_quarantine_active are system- or computed-sourced, so a create
          body that supplies CLEARED / COMPLIANT / true / version 99 / a client
          id is ignored field-for-field: the stored row is RESTRICTED,
          NO_SAMPLES, false, version 1 with a server-minted id.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /berry-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: HarvestManager
              as_user_id: "hm-1"
          trigger:
            - call: "POST /berry-ops/blocks"
              payload: { name: "BLK-E7", variety: "STRAWBERRY", acres: 3.00, planting_year: 2024, irrigation_source_code: "WELL-E7", food_safety_posture: "CLEARED", water_status: "COMPLIANT", manual_quarantine_active: true, water_sample_count: 9, version: 99, id: "client-supplied-id" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { blk: $.data.id }
          assert:
            - "HTTP status is 201"
            - "Block.${blk}.food_safety_posture == RESTRICTED and Block.${blk}.water_status == NO_SAMPLES"
            - "Block.${blk}.manual_quarantine_active == false and Block.${blk}.water_sample_count == 0"
            - "Block.${blk}.version == 1"
            - "${blk} != client-supplied-id"

      - name: block_create_with_undeclared_variety_returns_invalid_enum
        claim_type: type_constraints
        grounds:
          - entities.Block.fields.variety
          - validations[priority=11]
          - errors[ERR_INVALID_ENUM]
        distinguishing_aspect: |
          variety is closed over {STRAWBERRY, BLUEBERRY, RASPBERRY, BLACKBERRY};
          GOOSEBERRY is rejected with ERR_INVALID_ENUM (400) by validation
          priority 11, which outranks the numeric range check at priority 12.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /berry-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: HarvestManager
              as_user_id: "hm-1"
          trigger:
            - call: "POST /berry-ops/blocks"
              payload: { name: "BLK-E8", variety: "GOOSEBERRY", acres: 3.00, planting_year: 2024, irrigation_source_code: "WELL-E8" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 400 and response_type == error"
            - "${err} == ERR_INVALID_ENUM"
            - "GET /berry-ops/blocks returns total_count == 0"

      - name: water_test_create_with_zero_mpn_returns_value_out_of_range
        claim_type: type_constraints
        grounds:
          - entities.WaterTest.fields.generic_ecoli_mpn
          - validations[priority=12]
          - errors[ERR_VALUE_OUT_OF_RANGE]
        distinguishing_aspect: |
          generic_ecoli_mpn is constrained to >= 1 because the geometric mean
          multiplies the window; 0 is rejected with ERR_VALUE_OUT_OF_RANGE (400)
          and the block's water_status stays NO_SAMPLES.
        test_recipe:
          setup:
            - "One STRAWBERRY block with no samples on file."
          setup_api_calls:
            - call: "POST /berry-ops/blocks"
              payload: { name: "BLK-E9", variety: "STRAWBERRY", acres: 3.00, planting_year: 2024, irrigation_source_code: "WELL-E9" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { blk: $.data.id }
          trigger:
            - call: "POST /berry-ops/water-tests"
              payload: { block_id: "${blk}", sample_date: "2026-07-25", generic_ecoli_mpn: 0 }
              as: FoodSafetyOfficer
              as_user_id: "fso-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 400 and response_type == error"
            - "${err} == ERR_VALUE_OUT_OF_RANGE"
            - "Block.${blk}.water_sample_count == 0 and Block.${blk}.water_status == NO_SAMPLES and Block.${blk}.version == 1"

      - name: harvest_window_create_with_end_before_start_returns_invalid_date_range
        claim_type: type_constraints
        grounds:
          - entities.HarvestWindow.fields.end_at
          - validations[priority=14]
          - errors[ERR_INVALID_DATE_RANGE]
        distinguishing_aspect: |
          end_at must be strictly after start_at; a window body with end_at
          2026-08-03T06:00:00Z against start_at 2026-08-03T18:00:00Z is rejected
          with ERR_INVALID_DATE_RANGE (400) before any block re-entry arithmetic
          runs.
        test_recipe:
          setup:
            - "One STRAWBERRY block and one crew, no windows yet."
          setup_api_calls:
            - call: "POST /berry-ops/blocks"
              payload: { name: "BLK-E10", variety: "STRAWBERRY", acres: 3.00, planting_year: 2024, irrigation_source_code: "WELL-E10" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { blk: $.data.id }
            - call: "POST /berry-ops/crews"
              payload: { name: "CREW-E10", labor_program: "DOMESTIC", supervisor_user_id: "sup-1", planned_head_count: 1, contract_start_date: "2026-07-01", contract_end_date: "2026-09-30" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { crew: $.data.id }
          trigger:
            - call: "POST /berry-ops/harvest-windows"
              payload: { block_id: "${blk}", crew_id: "${crew}", start_at: "2026-08-03T18:00:00Z", end_at: "2026-08-03T06:00:00Z", forecast_brix: 8.5, planned_volume_lbs: 150.00, piece_rate_cents_per_clamshell: 45, clamshell_net_weight_lbs: 1.00 }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 400 and response_type == error"
            - "${err} == ERR_INVALID_DATE_RANGE"
            - "GET /berry-ops/harvest-windows with block_id ${blk} returns total_count == 0"

      - name: water_test_is_append_only_and_carries_no_version_field
        claim_type: immutability
        grounds:
          - entities.WaterTest
          - endpoints["GET /berry-ops/water-tests/{water_test_id}"]
        distinguishing_aspect: |
          WaterTest is the scaffold's only common_fields false entity: the read
          projection carries id and created_at but no version and no updated_at,
          and §1.5 declares no PUT, PATCH or DELETE on /berry-ops/water-tests,
          so a recorded sample can never be edited out of the geometric-mean
          window.
        test_recipe:
          setup:
            - "One block with a single 40 MPN sample recorded 2026-07-20."
          setup_api_calls:
            - call: "POST /berry-ops/blocks"
              payload: { name: "BLK-E11", variety: "BLUEBERRY", acres: 3.00, planting_year: 2024, irrigation_source_code: "WELL-E11" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { blk: $.data.id }
            - call: "POST /berry-ops/water-tests"
              payload: { block_id: "${blk}", sample_date: "2026-07-20", generic_ecoli_mpn: 40 }
              as: FoodSafetyOfficer
              as_user_id: "fso-1"
              captures: { wt: $.data.id }
          trigger:
            - call: "GET /berry-ops/water-tests/${wt}"
              payload: {}
              as: HarvestManager
              as_user_id: "hm-1"
          assert:
            - "HTTP status is 200 and response_type == object"
            - "WaterTest.${wt}.id is present and WaterTest.${wt}.created_at is present"
            - "WaterTest.${wt} has no version field and no updated_at field"
            - "WaterTest.${wt}.block_id == ${blk} and WaterTest.${wt}.generic_ecoli_mpn == 40"
            - "WaterTest.${wt}.single_sample_exceedance == false and WaterTest.${wt}.resulting_water_status == PROVISIONAL"
            - "WaterTest.${wt}.recorded_by_user_id == fso-1"

      - name: water_test_create_with_unknown_block_id_returns_not_found
        claim_type: parent_relationships
        grounds:
          - entities.WaterTest.fields.block_id
          - validations[priority=16]
          - errors[ERR_BLOCK_NOT_FOUND]
        distinguishing_aspect: |
          The body foreign key block_id must resolve; a sample posted against
          blk-does-not-exist answers ERR_BLOCK_NOT_FOUND (404) from validation
          priority 16 and leaves the water-test collection empty.
        test_recipe:
          setup:
            - "One unrelated block exists so the collection is non-empty, but the posted block_id names no row."
          setup_api_calls:
            - call: "POST /berry-ops/blocks"
              payload: { name: "BLK-E12", variety: "RASPBERRY", acres: 3.00, planting_year: 2024, irrigation_source_code: "WELL-E12" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { blk: $.data.id }
          trigger:
            - call: "POST /berry-ops/water-tests"
              payload: { block_id: "blk-does-not-exist", sample_date: "2026-07-25", generic_ecoli_mpn: 40 }
              as: FoodSafetyOfficer
              as_user_id: "fso-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 404 and response_type == error"
            - "${err} == ERR_BLOCK_NOT_FOUND"
            - "GET /berry-ops/water-tests with block_id ${blk} returns total_count == 0"

      - name: fruit_lot_foreign_keys_must_agree_across_window_and_block
        claim_type: foreign_key_integrity
        grounds:
          - validations[priority=52]
          - entities.FruitLot.fields.block_id
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / lot_block_mismatch_referential_error_precedes_pick_date_temporal_error
          rationale: "The flat-topology cross-reference integrity claim (a lot's block_id must equal its window's block_id) is asserted as the primary failure path of the named §1.8 instance, which additionally pins its precedence over the pick_date temporal rule."

  # ===========================================================================
  # 2. From Table 2 (State Machines)
  # ===========================================================================
  - section: state_machines
    instances:

      - name: crew_first_picker_moves_recruiting_to_staffed
        claim_type: valid_transition
        grounds:
          - state_machines.Crew.RECRUITING_to_STAFFED
          - entities.Crew.fields.picker_count
          - entities.Picker.fields.hygiene_training_expires_on
        distinguishing_aspect: |
          Registering the first picker is a system-actor transition: crew.status
          flips RECRUITING -> STAFFED, picker_count becomes 1 and crew.version
          becomes 2, while the picker's hygiene_training_expires_on is stamped
          2027-06-01 from a 2026-06-01 training date.
        test_recipe:
          setup:
            - "One DOMESTIC crew CREW-SM1 with planned_head_count 1, status RECRUITING, picker_count 0, version 1."
          setup_api_calls:
            - call: "POST /berry-ops/crews"
              payload: { name: "CREW-SM1", labor_program: "DOMESTIC", supervisor_user_id: "sup-1", planned_head_count: 1, contract_start_date: "2026-07-01", contract_end_date: "2026-09-30" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { crew: $.data.id }
          trigger:
            - call: "POST /berry-ops/pickers"
              payload: { crew_id: "${crew}", full_name: "First Picker", hygiene_training_on: "2026-06-01" }
              as: CrewSupervisor
              as_user_id: "sup-1"
              captures: { pk: $.data.id }
          assert:
            - "HTTP status is 201"
            - "Crew.${crew}.status == STAFFED and Crew.${crew}.picker_count == 1 and Crew.${crew}.version == 2"
            - "Picker.${pk}.labor_program == DOMESTIC and Picker.${pk}.hygiene_training_expires_on == 2027-06-01"
            - "Picker.${pk}.version == 1"

      - name: crew_certify_without_transport_seats_returns_support_plan_incomplete
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Crew.STAFFED_to_CERTIFIED
          - validations[priority=44]
          - errors[ERR_SUPPORT_PLAN_INCOMPLETE]
          - entities.Crew.fields.support_plan_complete
        distinguishing_aspect: |
          planned_head_count is 2 but the support plan secured only 1 vehicle
          seat, so support_plan_complete stays false and certify answers
          ERR_SUPPORT_PLAN_INCOMPLETE (409) even though both pickers' hygiene
          training is valid; the crew stays STAFFED.
        test_recipe:
          setup:
            - "One H2A crew CREW-SM2 with planned_head_count 2 and two trained pickers, so status is STAFFED."
            - "Support plan recorded with housing_unit_code H-SM2 / beds_confirmed 2 but transport_route_code R-SM2 / vehicle_seats 1."
          setup_api_calls:
            - call: "POST /berry-ops/crews"
              payload: { name: "CREW-SM2", labor_program: "H2A", supervisor_user_id: "sup-1", planned_head_count: 2, contract_start_date: "2026-07-01", contract_end_date: "2026-09-30" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { crew: $.data.id }
            - call: "POST /berry-ops/pickers"
              payload: { crew_id: "${crew}", full_name: "Picker SM2 A", hygiene_training_on: "2026-06-01" }
              as: CrewSupervisor
              as_user_id: "sup-1"
              captures: { pk1: $.data.id }
            - call: "POST /berry-ops/pickers"
              payload: { crew_id: "${crew}", full_name: "Picker SM2 B", hygiene_training_on: "2026-06-01" }
              as: CrewSupervisor
              as_user_id: "sup-1"
              captures: { pk2: $.data.id }
            - call: "POST /berry-ops/crews/${crew}/support-plan"
              payload: { housing_unit_code: "H-SM2", beds_confirmed: 2, transport_route_code: "R-SM2", vehicle_seats: 1 }
              as: HarvestManager
              as_user_id: "hm-1"
          trigger:
            - call: "POST /berry-ops/crews/${crew}/certify"
              payload: {}
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409 and response_type == error"
            - "${err} == ERR_SUPPORT_PLAN_INCOMPLETE"
            - "Crew.${crew}.status == STAFFED and Crew.${crew}.support_plan_complete == false"
            - "Crew.${crew}.vehicle_seats == 1 and Crew.${crew}.beds_confirmed == 2"

      - name: window_open_flips_crew_from_certified_to_active
        claim_type: side_effect_execution
        grounds:
          - state_machines.HarvestWindow.CONFIRMED_to_OPEN
          - state_machines.Crew.CERTIFIED_to_ACTIVE
          - calculations.window_crew_requirement
        distinguishing_aspect: |
          Opening the crew's first window has a cross-entity side effect: the
          window becomes OPEN and the same request flips the crew CERTIFIED ->
          ACTIVE, taking crew.version to 5 after create, picker, support-plan and
          certify each incremented it.
        test_recipe:
          setup:
            - "One STRAWBERRY block BLK-SM3 with one 40 MPN sample, so food_safety_posture is CLEARED."
            - "One DOMESTIC crew with one trained picker, support plan complete, status CERTIFIED, version 4."
            - "One CONFIRMED window 2026-08-03T06:00:00Z -> 2026-08-03T14:00:00Z with required_picker_count 1."
          setup_api_calls:
            - call: "POST /berry-ops/blocks"
              payload: { name: "BLK-SM3", variety: "STRAWBERRY", acres: 10.00, planting_year: 2022, irrigation_source_code: "WELL-SM3" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { blk: $.data.id }
            - call: "POST /berry-ops/water-tests"
              payload: { block_id: "${blk}", sample_date: "2026-07-20", generic_ecoli_mpn: 40 }
              as: FoodSafetyOfficer
              as_user_id: "fso-1"
            - call: "POST /berry-ops/crews"
              payload: { name: "CREW-SM3", labor_program: "DOMESTIC", supervisor_user_id: "sup-1", planned_head_count: 1, contract_start_date: "2026-07-01", contract_end_date: "2026-09-30" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { crew: $.data.id }
            - call: "POST /berry-ops/pickers"
              payload: { crew_id: "${crew}", full_name: "Picker SM3", hygiene_training_on: "2026-06-01" }
              as: CrewSupervisor
              as_user_id: "sup-1"
              captures: { pk: $.data.id }
            - call: "POST /berry-ops/crews/${crew}/support-plan"
              payload: { housing_unit_code: "H-SM3", beds_confirmed: 1, transport_route_code: "R-SM3", vehicle_seats: 1 }
              as: HarvestManager
              as_user_id: "hm-1"
            - call: "POST /berry-ops/crews/${crew}/certify"
              payload: {}
              as: HarvestManager
              as_user_id: "hm-1"
            - call: "POST /berry-ops/harvest-windows"
              payload: { block_id: "${blk}", crew_id: "${crew}", start_at: "2026-08-03T06:00:00Z", end_at: "2026-08-03T14:00:00Z", forecast_brix: 8.5, planned_volume_lbs: 150.00, piece_rate_cents_per_clamshell: 45, clamshell_net_weight_lbs: 1.00 }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { win: $.data.id }
            - call: "POST /berry-ops/harvest-windows/${win}/confirm"
              payload: {}
              as: HarvestManager
              as_user_id: "hm-1"
          trigger:
            - call: "POST /berry-ops/harvest-windows/${win}/open"
              payload: {}
              as: HarvestManager
              as_user_id: "hm-1"
          assert:
            - "HTTP status is 200"
            - "HarvestWindow.${win}.status == OPEN and HarvestWindow.${win}.version == 3"
            - "HarvestWindow.${win}.window_hours == 8.00 and HarvestWindow.${win}.effective_pick_rate_lbs_per_hour == 22.00 and HarvestWindow.${win}.required_picker_count == 1"
            - "Crew.${crew}.status == ACTIVE and Crew.${crew}.version == 5"

      - name: window_close_from_planned_returns_invalid_window_state
        claim_type: invalid_transitions
        grounds:
          - state_machines.HarvestWindow.OPEN_to_CLOSED
          - validations[priority=28]
          - errors[ERR_INVALID_WINDOW_STATE]
        distinguishing_aspect: |
          close is declared only from OPEN; invoked on a PLANNED window it
          answers ERR_INVALID_WINDOW_STATE (409) and the window keeps status
          PLANNED with version 1 and packed_lbs 0.00.
        test_recipe:
          setup:
            - "One block, one crew and one PLANNED window that was never confirmed."
          setup_api_calls:
            - call: "POST /berry-ops/blocks"
              payload: { name: "BLK-SM4", variety: "STRAWBERRY", acres: 5.00, planting_year: 2022, irrigation_source_code: "WELL-SM4" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { blk: $.data.id }
            - call: "POST /berry-ops/crews"
              payload: { name: "CREW-SM4", labor_program: "DOMESTIC", supervisor_user_id: "sup-1", planned_head_count: 1, contract_start_date: "2026-07-01", contract_end_date: "2026-09-30" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { crew: $.data.id }
            - call: "POST /berry-ops/harvest-windows"
              payload: { block_id: "${blk}", crew_id: "${crew}", start_at: "2026-08-03T06:00:00Z", end_at: "2026-08-03T14:00:00Z", forecast_brix: 8.5, planned_volume_lbs: 150.00, piece_rate_cents_per_clamshell: 45, clamshell_net_weight_lbs: 1.00 }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { win: $.data.id }
          trigger:
            - call: "POST /berry-ops/harvest-windows/${win}/close"
              payload: {}
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409 and response_type == error"
            - "${err} == ERR_INVALID_WINDOW_STATE"
            - "HarvestWindow.${win}.status == PLANNED and HarvestWindow.${win}.version == 1 and HarvestWindow.${win}.packed_lbs == 0.00"

      - name: harvest_window_starts_planned_with_null_staffing_projections
        claim_type: initial_state
        grounds:
          - state_machines.HarvestWindow.initial_state
          - entities.HarvestWindow.fields.required_picker_count
          - entities.HarvestWindow.fields.window_hours
        distinguishing_aspect: |
          A freshly planned window carries status PLANNED, window_hours 8.00 from
          its own instants, and BOTH staffing projections null —
          effective_pick_rate_lbs_per_hour and required_picker_count are only
          minted at confirm.
        test_recipe:
          setup:
            - "One block and one crew, no windows yet."
          setup_api_calls:
            - call: "POST /berry-ops/blocks"
              payload: { name: "BLK-SM5", variety: "BLACKBERRY", acres: 5.00, planting_year: 2022, irrigation_source_code: "WELL-SM5" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { blk: $.data.id }
            - call: "POST /berry-ops/crews"
              payload: { name: "CREW-SM5", labor_program: "DOMESTIC", supervisor_user_id: "sup-1", planned_head_count: 1, contract_start_date: "2026-07-01", contract_end_date: "2026-09-30" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { crew: $.data.id }
          trigger:
            - call: "POST /berry-ops/harvest-windows"
              payload: { block_id: "${blk}", crew_id: "${crew}", start_at: "2026-08-03T06:00:00Z", end_at: "2026-08-03T14:00:00Z", forecast_brix: 9.0, planned_volume_lbs: 200.00, piece_rate_cents_per_clamshell: 60, clamshell_net_weight_lbs: 1.00 }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { win: $.data.id }
          assert:
            - "HTTP status is 201"
            - "HarvestWindow.${win}.status == PLANNED and HarvestWindow.${win}.version == 1"
            - "HarvestWindow.${win}.window_hours == 8.00"
            - "HarvestWindow.${win}.effective_pick_rate_lbs_per_hour == null and HarvestWindow.${win}.required_picker_count == null"
            - "HarvestWindow.${win}.harvested_clamshells == 0 and HarvestWindow.${win}.packed_lbs == 0.00"
            - "HarvestWindow.${win}.suspended_reason_code == null and HarvestWindow.${win}.cancel_reason_code == null"

      - name: window_cancel_from_closed_is_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.HarvestWindow.terminal_states
          - validations[priority=28]
          - errors[ERR_INVALID_WINDOW_STATE]
        distinguishing_aspect: |
          CLOSED is terminal: cancel is declared only from PLANNED, CONFIRMED or
          SUSPENDED, so cancelling a CLOSED window answers
          ERR_INVALID_WINDOW_STATE (409) and cancel_reason_code stays null.
        test_recipe:
          setup:
            - "One CLEARED block, one CERTIFIED crew with one picker, and one window driven PLANNED -> CONFIRMED -> OPEN -> CLOSED with no sessions and no lots."
          setup_api_calls:
            - call: "POST /berry-ops/blocks"
              payload: { name: "BLK-SM6", variety: "STRAWBERRY", acres: 5.00, planting_year: 2022, irrigation_source_code: "WELL-SM6" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { blk: $.data.id }
            - call: "POST /berry-ops/water-tests"
              payload: { block_id: "${blk}", sample_date: "2026-07-20", generic_ecoli_mpn: 40 }
              as: FoodSafetyOfficer
              as_user_id: "fso-1"
            - call: "POST /berry-ops/crews"
              payload: { name: "CREW-SM6", labor_program: "DOMESTIC", supervisor_user_id: "sup-1", planned_head_count: 1, contract_start_date: "2026-07-01", contract_end_date: "2026-09-30" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { crew: $.data.id }
            - call: "POST /berry-ops/pickers"
              payload: { crew_id: "${crew}", full_name: "Picker SM6", hygiene_training_on: "2026-06-01" }
              as: CrewSupervisor
              as_user_id: "sup-1"
              captures: { pk: $.data.id }
            - call: "POST /berry-ops/crews/${crew}/support-plan"
              payload: { housing_unit_code: "H-SM6", beds_confirmed: 1, transport_route_code: "R-SM6", vehicle_seats: 1 }
              as: HarvestManager
              as_user_id: "hm-1"
            - call: "POST /berry-ops/crews/${crew}/certify"
              payload: {}
              as: HarvestManager
              as_user_id: "hm-1"
            - call: "POST /berry-ops/harvest-windows"
              payload: { block_id: "${blk}", crew_id: "${crew}", start_at: "2026-08-03T06:00:00Z", end_at: "2026-08-03T14:00:00Z", forecast_brix: 8.5, planned_volume_lbs: 150.00, piece_rate_cents_per_clamshell: 45, clamshell_net_weight_lbs: 1.00 }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { win: $.data.id }
            - call: "POST /berry-ops/harvest-windows/${win}/confirm"
              payload: {}
              as: HarvestManager
              as_user_id: "hm-1"
            - call: "POST /berry-ops/harvest-windows/${win}/open"
              payload: {}
              as: HarvestManager
              as_user_id: "hm-1"
            - call: "POST /berry-ops/harvest-windows/${win}/close"
              payload: {}
              as: HarvestManager
              as_user_id: "hm-1"
          trigger:
            - call: "POST /berry-ops/harvest-windows/${win}/cancel"
              payload: { cancel_reason_code: "LATE_CANCEL" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409 and response_type == error"
            - "${err} == ERR_INVALID_WINDOW_STATE"
            - "HarvestWindow.${win}.status == CLOSED and HarvestWindow.${win}.cancel_reason_code == null"
            - "HarvestWindow.${win}.version == 4"

      - name: second_quarantine_on_a_held_block_returns_invalid_block_state
        claim_type: idempotency
        grounds:
          - state_machines.Block.CLEARED_to_QUARANTINED
          - validations[priority=25]
          - errors[ERR_INVALID_BLOCK_STATE]
        distinguishing_aspect: |
          The manual hold is not re-entrant: a second quarantine call by a
          different officer answers ERR_INVALID_BLOCK_STATE (409), and
          quarantined_by_user_id stays fso-1 with quarantine_reason_code
          WATER_INCIDENT from the first call, so the segregation-of-duties
          record cannot be overwritten by a repeat.
        test_recipe:
          setup:
            - "One block with one 40 MPN sample, quarantined by fso-1 with reason WATER_INCIDENT (posture QUARANTINED, version 3)."
          setup_api_calls:
            - call: "POST /berry-ops/blocks"
              payload: { name: "BLK-SM7", variety: "STRAWBERRY", acres: 5.00, planting_year: 2022, irrigation_source_code: "WELL-SM7" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { blk: $.data.id }
            - call: "POST /berry-ops/water-tests"
              payload: { block_id: "${blk}", sample_date: "2026-07-20", generic_ecoli_mpn: 40 }
              as: FoodSafetyOfficer
              as_user_id: "fso-1"
            - call: "POST /berry-ops/blocks/${blk}/quarantine"
              payload: { quarantine_reason_code: "WATER_INCIDENT" }
              as: FoodSafetyOfficer
              as_user_id: "fso-1"
          trigger:
            - call: "POST /berry-ops/blocks/${blk}/quarantine"
              payload: { quarantine_reason_code: "SECOND_ATTEMPT" }
              as: FoodSafetyOfficer
              as_user_id: "fso-2"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409 and response_type == error"
            - "${err} == ERR_INVALID_BLOCK_STATE"
            - "Block.${blk}.manual_quarantine_active == true and Block.${blk}.food_safety_posture == QUARANTINED"
            - "Block.${blk}.quarantined_by_user_id == fso-1 and Block.${blk}.quarantine_reason_code == WATER_INCIDENT"
            - "Block.${blk}.version == 3"

      - name: lot_reject_while_cooling_leaves_the_cold_chain_dimension_untouched
        claim_type: parallel_dimensions
        grounds:
          - state_machines.FruitLot.UNCOMMITTED_to_REJECTED
          - entities.FruitLot.fields.cold_chain_status
          - entities.FruitLot.fields.disposition_status
          - calculations.tunnel_occupancy
        distinguishing_aspect: |
          The two dimensions are independent: rejecting a lot that is mid-tunnel
          moves disposition_status UNCOMMITTED -> REJECTED and zeroes
          available_lbs while cold_chain_status stays COOLING and the tunnel's
          committed_slots stays 1 — the rejection does not evacuate the tunnel.
        test_recipe:
          setup:
            - "One block, crew and PLANNED window spanning 2026-08-03; one tunnel TUN-SM8 with slot_capacity 4."
            - "One grade-A lot of 100 clamshells at 1.00 lb, pushed into the tunnel and still COOLING on 1 pallet slot."
          setup_api_calls:
            - call: "POST /berry-ops/blocks"
              payload: { name: "BLK-SM8", variety: "STRAWBERRY", acres: 5.00, planting_year: 2022, irrigation_source_code: "WELL-SM8" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { blk: $.data.id }
            - call: "POST /berry-ops/crews"
              payload: { name: "CREW-SM8", labor_program: "DOMESTIC", supervisor_user_id: "sup-1", planned_head_count: 1, contract_start_date: "2026-07-01", contract_end_date: "2026-09-30" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { crew: $.data.id }
            - call: "POST /berry-ops/harvest-windows"
              payload: { block_id: "${blk}", crew_id: "${crew}", start_at: "2026-08-03T06:00:00Z", end_at: "2026-08-03T18:00:00Z", forecast_brix: 8.5, planned_volume_lbs: 150.00, piece_rate_cents_per_clamshell: 45, clamshell_net_weight_lbs: 1.00 }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { win: $.data.id }
            - call: "POST /berry-ops/cooling-tunnels"
              payload: { name: "TUN-SM8", slot_capacity: 4, target_pulp_temp_f: 34.0 }
              as: PackhouseOperator
              as_user_id: "pack-1"
              captures: { tun: $.data.id, tun_v: $.data.version }
            - call: "POST /berry-ops/fruit-lots"
              payload: { harvest_window_id: "${win}", block_id: "${blk}", pick_date: "2026-08-03", variety: "STRAWBERRY", grade: "A", clamshell_count: 100, clamshell_net_weight_lbs: 1.00, pack_completed_at: "2026-08-03T06:00:00Z", field_pulp_temp_f: 70.0 }
              as: PackhouseOperator
              as_user_id: "pack-1"
              captures: { lot: $.data.id }
            - call: "POST /berry-ops/fruit-lots/${lot}/start-cooling"
              payload: { cooling_tunnel_id: "${tun}", cool_start_at: "2026-08-03T07:00:00Z", planned_cool_end_at: "2026-08-03T11:00:00Z", entry_pulp_temp_f: 62.0, pallet_slots: 1, expected_cooling_tunnel_version: "${tun_v}" }
              as: PackhouseOperator
              as_user_id: "pack-1"
          trigger:
            - call: "POST /berry-ops/fruit-lots/${lot}/reject"
              payload: { reject_reason_code: "SOFT_FRUIT" }
              as: PackhouseOperator
              as_user_id: "pack-1"
          assert:
            - "HTTP status is 200"
            - "FruitLot.${lot}.disposition_status == REJECTED and FruitLot.${lot}.reject_reason_code == SOFT_FRUIT"
            - "FruitLot.${lot}.cold_chain_status == COOLING"
            - "FruitLot.${lot}.food_safety_hold == true and FruitLot.${lot}.available_lbs == 0.00 and FruitLot.${lot}.net_packed_lbs == 100.00"
            - "CoolingTunnel.${tun}.committed_slots == 1"
            - "HarvestWindow.${win}.packed_lbs == 0.00"

      - name: block_clear_lifts_food_safety_hold_but_leaves_windows_suspended
        claim_type: cross_entity
        grounds:
          - state_machines.Block.QUARANTINED_to_CLEARED
          - state_machines.HarvestWindow.CONFIRMED_to_SUSPENDED
          - entities.FruitLot.fields.food_safety_hold
        distinguishing_aspect: |
          Clearing the hold is deliberately asymmetric with imposing it: the
          block's UNCOMMITTED lot has food_safety_hold set back to false, but the
          window suspended by the cascade stays SUSPENDED with
          suspended_reason_code BLOCK_QUARANTINE — only an explicit resume
          revives it.
        test_recipe:
          setup:
            - "One CLEARED block with a CONFIRMED window and one UNCOMMITTED lot."
            - "fso-1 quarantines the block, which suspends the window and holds the lot; a second passing sample (50 MPN) then returns water_status to PROVISIONAL while the manual hold is still open."
          setup_api_calls:
            - call: "POST /berry-ops/blocks"
              payload: { name: "BLK-SM9", variety: "STRAWBERRY", acres: 5.00, planting_year: 2022, irrigation_source_code: "WELL-SM9" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { blk: $.data.id }
            - call: "POST /berry-ops/water-tests"
              payload: { block_id: "${blk}", sample_date: "2026-07-20", generic_ecoli_mpn: 40 }
              as: FoodSafetyOfficer
