              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_ARTWORK_NOT_AVAILABLE"
            - "response.http_status == 409"

      - name: loan_activate_requires_active_policy
        grounds:
          - state_machines.LoanAgreement.APPROVED_to_ACTIVE
          - state_machines.InsurancePolicy.ACTIVE_to_CANCELLED
          - validations[priority=15]
        distinguishing_aspect: |
          LoanAgreement APPROVED->ACTIVE depends on InsurancePolicy state (pair
          LoanAgreement->InsurancePolicy): cancelling the policy after approval makes activation
          fail with ERR_POLICY_NOT_ACTIVE — a different entity pair than TransportJob->Artwork.
