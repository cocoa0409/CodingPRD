scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains: Valuation vs Claim)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: agreed_value_guide_vs_appraisal_divergence
        grounds:
          - calculations.guide_tool_value
          - calculations.appraisal_value
        distinguishing_aspect: |
          Two valid valuation methods on the SAME vehicle produce different agreed
          values: GUIDE_TOOL yields 3000000 cents (guide base x condition 1.00)
          while CERTIFIED_APPRAISAL yields 3500000 cents — a 500000-cent delta on
          the Valuation entity domain.
        test_recipe:
          setup:
            - "Guide G PUBLISHED with entry CLASSIC/Ford/1965-1972 base 3000000"
            - "Member M ACTIVE; Vehicle V (1970 Ford Mustang, CLASSIC, GOOD, ENCLOSED_GARAGE, PLEASURE)"
            - "Appraisal A on V CERTIFIED at 3500000"
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Ann", email: "ann@x.com", has_daily_driver: true, driving_record_status: CLEAN }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "VIN001", year: 1970, make: "Ford", model: "Mustang", vehicle_class: CLASSIC, condition_grade: GOOD, storage_type: ENCLOSED_GARAGE, primary_use: PLEASURE }
              as: Member
              as_user_id: "${m_id}"
              captures: { v_id: $.data.id, v_ver: $.data.version }
            - call: "POST /valuation-guides"
              payload: { edition: "2026-Q3", effective_date: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "POST /valuation-guides/${g_id}/entries"
              payload: { vehicle_class: CLASSIC, make: "Ford", year_min: 1965, year_max: 1972, base_value_cents: 3000000 }
              as: PlatformAdmin
            - call: "POST /valuation-guides/${g_id}/publish"
              payload: {}
              as: PlatformAdmin
            - call: "POST /vehicles/${v_id}/appraisals"
              payload: { appraised_value_cents: 3500000, appraised_at: "2026-09-10T00:00:00Z" }
              as: Appraiser
              as_user_id: "appraiser-1"
              captures: { ap_id: $.data.id }
            - call: "POST /appraisals/${ap_id}/certify"
              payload: { decision: CERTIFY }
              as: Underwriter
              as_user_id: "uw-1"
          trigger:
            - call: "POST /vehicles/${v_id}/valuations"
              payload: { method: GUIDE_TOOL, proposed_agreed_value_cents: 3000000, expected_vehicle_version: "${v_ver}" }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { val_guide: $.data.computed_value_cents }
            - call: "GET /vehicles/${v_id}"
              payload: {}
              as: Underwriter
              captures: { v_ver2: $.data.version }
            - call: "POST /vehicles/${v_id}/valuations"
              payload: { method: CERTIFIED_APPRAISAL, appraisal_id: "${ap_id}", proposed_agreed_value_cents: 3500000, expected_vehicle_version: "${v_ver2}" }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { val_appr: $.data.computed_value_cents }
          assert:
            - "first valuation computed_value_cents == 3000000"
            - "second valuation computed_value_cents == 3500000"
            - "3000000 != 3500000 — identical vehicle, method-dependent values"
      - name: claim_payout_repair_vs_total_loss_divergence
        grounds:
          - calculations.claim_payout
          - state_machines.Claim.UNDER_INVESTIGATION_to_TOTAL_LOSS_DECLARED
        distinguishing_aspect: |
          Two settlement variants on the SAME claim produce different payouts:
          REPAIR pays min(estimate, coverage) = 120000 cents while TOTAL_LOSS pays
          agreed value minus retained salvage = 3000000 cents — a 2880000-cent
          delta on the Claim entity domain (distinct from the Valuation domain of
          the sibling instance).
        test_recipe:
          setup:
            - "Full stack: member, eligible+documented 1970 Ford Mustang, GUIDE_TOOL valuation APPROVED at 3000000, policy ACTIVE (REGULAR, allowance 3000, period 2026-09-01..2027-09-01), certified shop, claim UNDER_INVESTIGATION with estimate 120000"
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Bob", email: "bob@x.com", has_daily_driver: true, driving_record_status: CLEAN }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "VIN002", year: 1970, make: "Ford", model: "Mustang", vehicle_class: CLASSIC, condition_grade: GOOD, storage_type: ENCLOSED_GARAGE, primary_use: PLEASURE }
              as: Member
              as_user_id: "${m_id}"
              captures: { v_id: $.data.id }
            - call: "POST /vehicles/${v_id}/photos"
              payload: { photo_type: FRONT, image_ref: "img://f", captured_at: "2026-09-01T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { ph_front: $.data.id }
            - call: "POST /vehicles/${v_id}/photos"
              payload: { photo_type: REAR, image_ref: "img://r", captured_at: "2026-09-01T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { ph_rear: $.data.id }
            - call: "POST /vehicles/${v_id}/photos"
              payload: { photo_type: DRIVER_SIDE, image_ref: "img://ds", captured_at: "2026-09-01T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { ph_ds: $.data.id }
            - call: "POST /vehicles/${v_id}/photos"
              payload: { photo_type: PASSENGER_SIDE, image_ref: "img://ps", captured_at: "2026-09-01T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { ph_ps: $.data.id }
            - call: "POST /vehicles/${v_id}/photos"
              payload: { photo_type: INTERIOR, image_ref: "img://in", captured_at: "2026-09-01T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { ph_in: $.data.id }
            - call: "POST /vehicles/${v_id}/photos"
              payload: { photo_type: ENGINE, image_ref: "img://en", captured_at: "2026-09-01T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { ph_en: $.data.id }
            - call: "POST /vehicles/${v_id}/photos"
              payload: { photo_type: ODOMETER, image_ref: "img://od", captured_at: "2026-09-01T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { ph_od: $.data.id }
            - call: "POST /vehicles/${v_id}/photos"
              payload: { photo_type: VIN_PLATE, image_ref: "img://vp", captured_at: "2026-09-01T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { ph_vp: $.data.id }
            - call: "POST /vehicles/${v_id}/photos/${ph_front}/review"
              payload: { decision: ACCEPT }
              as: Underwriter
            - call: "POST /vehicles/${v_id}/photos/${ph_rear}/review"
              payload: { decision: ACCEPT }
              as: Underwriter
            - call: "POST /vehicles/${v_id}/photos/${ph_ds}/review"
              payload: { decision: ACCEPT }
              as: Underwriter
            - call: "POST /vehicles/${v_id}/photos/${ph_ps}/review"
              payload: { decision: ACCEPT }
              as: Underwriter
            - call: "POST /vehicles/${v_id}/photos/${ph_in}/review"
              payload: { decision: ACCEPT }
              as: Underwriter
            - call: "POST /vehicles/${v_id}/photos/${ph_en}/review"
              payload: { decision: ACCEPT }
              as: Underwriter
            - call: "POST /vehicles/${v_id}/photos/${ph_od}/review"
              payload: { decision: ACCEPT }
              as: Underwriter
            - call: "POST /vehicles/${v_id}/photos/${ph_vp}/review"
              payload: { decision: ACCEPT }
              as: Underwriter
            - call: "POST /vehicles/${v_id}/evaluate-eligibility"
              payload: {}
              as: Underwriter
              captures: { v_ver: $.data.version }
            - call: "POST /valuation-guides"
              payload: { edition: "2026-Q3", effective_date: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "POST /valuation-guides/${g_id}/entries"
              payload: { vehicle_class: CLASSIC, make: "Ford", year_min: 1965, year_max: 1972, base_value_cents: 3000000 }
              as: PlatformAdmin
            - call: "POST /valuation-guides/${g_id}/publish"
              payload: {}
              as: PlatformAdmin
            - call: "POST /vehicles/${v_id}/valuations"
              payload: { method: GUIDE_TOOL, proposed_agreed_value_cents: 3000000, expected_vehicle_version: "${v_ver}" }
              as: Underwriter
              captures: { val_id: $.data.id }
            - call: "POST /valuations/${val_id}/propose"
              payload: {}
              as: Underwriter
            - call: "POST /valuations/${val_id}/approve"
              payload: {}
              as: Underwriter
            - call: "POST /policies"
              payload: { member_id: "${m_id}", vehicle_id: "${v_id}", valuation_id: "${val_id}", usage_tier: REGULAR, period_start: "2026-09-01T00:00:00Z", period_end: "2027-09-01T00:00:00Z" }
              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/drivers"
              payload: { full_name: "Bob", license_number: "D100", years_licensed: 10, violations_last_3y: 0, is_primary: true }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /policies/${pol_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /repair-shops"
              payload: { name: "Classic Works", specialty: "Ford", hourly_rate_cents: 9500 }
              as: PlatformAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /repair-shops/${shop_id}/certify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /policies/${pol_id}/claims"
              payload: { incident_date: "2026-10-01T00:00:00Z", loss_type: COLLISION, description: "rear-ended at show" }
              as: Member
              as_user_id: "${m_id}"
              captures: { cl_id: $.data.id }
            - call: "POST /claims/${cl_id}/assign-shop"
              payload: { repair_shop_id: "${shop_id}" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - call: "POST /claims/${cl_id}/submit-estimate"
              payload: { estimate_cents: 120000 }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
          trigger:
            - call: "POST /claims/${cl_id}/authorize-repair"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - call: "POST /claims/${cl_id}/settle"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-1"
              captures: { pay_repair: $.data.payout_cents }
            - call: "POST /claims/${cl_id}/reopen"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /claims/${cl_id}/declare-total-loss"
              payload: { salvage_retained: false }
              as: ClaimsAdjuster
              as_user_id: "adj-2"
            - call: "POST /claims/${cl_id}/settle"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-3"
              captures: { pay_total: $.data.payout_cents }
          assert:
            - "REPAIR settlement payout_cents == 120000 (min(estimate 120000, coverage 3000000))"
            - "TOTAL_LOSS settlement payout_cents == 3000000 (agreed value, no salvage retained)"
            - "120000 != 3000000 — identical claim data, variant-dependent payout"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes: (a) tiered+multipliers,
  # (b) per-event rounding order, (c) pinned evaluation order)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: premium_tiered_multipliers_mode_a
        grounds:
          - calculations.premium_quote
        distinguishing_aspect: |
          Mode (a): premium combines a 3-bracket tiered rate with usage, storage,
          and club multipliers plus a conditional endorsement fee; with agreed
          value 4000000, REGULAR/ENCLOSED_GARAGE/no club and no endorsement the
          exact result is 34200 cents.
        test_recipe:
          setup:
            - "Member, eligible+documented vehicle, GUIDE_TOOL valuation APPROVED at 4000000 (guide base 3200000 x EXCELLENT 1.25)"
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Cara", email: "cara@x.com", has_daily_driver: true, driving_record_status: CLEAN }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "VIN003", year: 1970, make: "Ford", model: "Mustang", vehicle_class: CLASSIC, condition_grade: EXCELLENT, storage_type: ENCLOSED_GARAGE, primary_use: PLEASURE }
              as: Member
              as_user_id: "${m_id}"
              captures: { v_id: $.data.id, v_ver: $.data.version }
            - call: "POST /valuation-guides"
              payload: { edition: "2026-Q3", effective_date: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "POST /valuation-guides/${g_id}/entries"
              payload: { vehicle_class: CLASSIC, make: "Ford", year_min: 1965, year_max: 1972, base_value_cents: 3200000 }
              as: PlatformAdmin
            - call: "POST /valuation-guides/${g_id}/publish"
              payload: {}
              as: PlatformAdmin
            - call: "POST /vehicles/${v_id}/valuations"
              payload: { method: GUIDE_TOOL, proposed_agreed_value_cents: 4000000, expected_vehicle_version: "${v_ver}" }
              as: Underwriter
              captures: { val_id: $.data.id }
            - call: "POST /valuations/${val_id}/propose"
              payload: {}
              as: Underwriter
            - call: "POST /valuations/${val_id}/approve"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /policies"
              payload: { member_id: "${m_id}", vehicle_id: "${v_id}", valuation_id: "${val_id}", usage_tier: REGULAR, period_start: "2026-09-01T00:00:00Z", period_end: "2027-09-01T00:00:00Z" }
              as: Underwriter
              captures: { prem: $.data.premium_cents, cov: $.data.coverage_limit_cents }
          assert:
            - "tier1 = round(4000000 * 0.009) = 36000; core = round(36000 * 1.00 * 0.95 * 1.00) = 34200"
            - "Policy.premium_cents == 34200"
            - "Policy.coverage_limit_cents == 4000000 (no endorsement)"
      - name: mileage_overage_per_event_rounding_mode_b
        grounds:
          - calculations.mileage_ledger
        distinguishing_aspect: |
          Mode (b): the 12.5 cents/mile overage rate makes rounding order
          observable — round-per-event-then-sum yields 25 cents (13 + 12) while
          sum-then-round yields 24 cents (round(1.9 * 12.5) = 24) for two 1-mile
          overage events; the scaffold pins per-event rounding.
        test_recipe:
          setup:
            - "ACTIVE policy with annual_mileage_allowance 1 (agreed value 3000000, REGULAR)"
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Dan", email: "dan@x.com", has_daily_driver: true, driving_record_status: CLEAN }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "VIN004", year: 1970, make: "Ford", model: "Mustang", vehicle_class: CLASSIC, condition_grade: GOOD, storage_type: ENCLOSED_GARAGE, primary_use: PLEASURE }
              as: Member
              as_user_id: "${m_id}"
              captures: { v_id: $.data.id, v_ver: $.data.version }
            - call: "POST /valuation-guides"
              payload: { edition: "2026-Q3", effective_date: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "POST /valuation-guides/${g_id}/entries"
              payload: { vehicle_class: CLASSIC, make: "Ford", year_min: 1965, year_max: 1972, base_value_cents: 3000000 }
              as: PlatformAdmin
            - call: "POST /valuation-guides/${g_id}/publish"
              payload: {}
              as: PlatformAdmin
            - call: "POST /vehicles/${v_id}/valuations"
              payload: { method: GUIDE_TOOL, proposed_agreed_value_cents: 3000000, expected_vehicle_version: "${v_ver}" }
              as: Underwriter
              captures: { val_id: $.data.id }
            - call: "POST /valuations/${val_id}/propose"
              payload: {}
              as: Underwriter
            - call: "POST /valuations/${val_id}/approve"
              payload: {}
              as: Underwriter
            - call: "POST /policies"
              payload: { member_id: "${m_id}", vehicle_id: "${v_id}", valuation_id: "${val_id}", usage_tier: REGULAR, annual_mileage_allowance: 1, period_start: "2026-09-01T00:00:00Z", period_end: "2027-09-01T00:00:00Z" }
              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/drivers"
              payload: { full_name: "Dan", license_number: "D101", years_licensed: 12, violations_last_3y: 0, is_primary: true }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /policies/${pol_id}/activate"
              payload: {}
              as: Underwriter
              captures: { pol_ver: $.data.version }
          trigger:
            - call: "POST /policies/${pol_id}/usage-events"
              payload: { reported_miles: 1, event_date: "2026-10-01T00:00:00Z", event_kind: ORDINARY, expected_policy_version: "${pol_ver}" }
              as: Member
              as_user_id: "${m_id}"
            - call: "GET /policies/${pol_id}"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { pol_ver2: $.data.version }
            - call: "POST /policies/${pol_id}/usage-events"
              payload: { reported_miles: 1, event_date: "2026-10-02T00:00:00Z", event_kind: ORDINARY, expected_policy_version: "${pol_ver2}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { ev2_charge: $.data.overage_charge_cents }
            - call: "GET /policies/${pol_id}"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { pol_ver3: $.data.version }
            - call: "POST /policies/${pol_id}/usage-events"
              payload: { reported_miles: 1, event_date: "2026-10-03T00:00:00Z", event_kind: ORDINARY, expected_policy_version: "${pol_ver3}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { ev3_charge: $.data.overage_charge_cents }
            - call: "GET /policies/${pol_id}"
              payload: {}
              as: Underwriter
              captures: { pol_over: $.data.overage_charge_cents, pol_bill: $.data.billable_miles_used }
          assert:
            - "event 2 overage: round(1 * 12.5) = 13 cents (round_half_up)"
            - "event 3 overage: round(1 * 12.5) = 13 cents"
            - "Policy.overage_charge_cents == 26 (13 + 13), NOT round(1.9 * 12.5) = 24 — per-event rounding order pinned"
            - "Policy.billable_miles_used == 3"
      - name: restoration_endorsement_pinned_order_mode_c
        grounds:
          - calculations.restoration_endorsement
          - state_machines.RestorationProject.ACTIVE_to_ACTIVE
        distinguishing_aspect: |
          Mode (c): endorsement_limit depends on stage cap which depends on
          agreed value, and coverage/premium depend on the endorsement — the
          circular-looking chain is pinned to a 6-step evaluation order; with
          agreed 4000000, receipts 600000, stage BODYWORK (cap 25%) the exact
          endorsement is 600000, coverage 4600000, premium 45330.
        test_recipe:
          setup:
            - "ACTIVE policy (agreed 4000000, REGULAR, ENCLOSED_GARAGE, no club); vehicle INSURED; RestorationProject at DISASSEMBLY with 600000 cents of receipts"
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Eli", email: "eli@x.com", has_daily_driver: true, driving_record_status: CLEAN }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "VIN005", year: 1970, make: "Ford", model: "Mustang", vehicle_class: CLASSIC, condition_grade: EXCELLENT, storage_type: ENCLOSED_GARAGE, primary_use: RESTORATION }
              as: Member
              as_user_id: "${m_id}"
              captures: { v_id: $.data.id, v_ver: $.data.version }
            - call: "POST /valuation-guides"
              payload: { edition: "2026-Q3", effective_date: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "POST /valuation-guides/${g_id}/entries"
              payload: { vehicle_class: CLASSIC, make: "Ford", year_min: 1965, year_max: 1972, base_value_cents: 3200000 }
              as: PlatformAdmin
            - call: "POST /valuation-guides/${g_id}/publish"
              payload: {}
              as: PlatformAdmin
            - call: "POST /vehicles/${v_id}/valuations"
              payload: { method: GUIDE_TOOL, proposed_agreed_value_cents: 4000000, expected_vehicle_version: "${v_ver}" }
              as: Underwriter
              captures: { val_id: $.data.id }
            - call: "POST /valuations/${val_id}/propose"
              payload: {}
              as: Underwriter
            - call: "POST /valuations/${val_id}/approve"
              payload: {}
              as: Underwriter
            - call: "POST /policies"
              payload: { member_id: "${m_id}", vehicle_id: "${v_id}", valuation_id: "${val_id}", usage_tier: REGULAR, period_start: "2026-09-01T00:00:00Z", period_end: "2027-09-01T00:00:00Z" }
              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/drivers"
              payload: { full_name: "Eli", license_number: "D102", years_licensed: 8, violations_last_3y: 0, is_primary: true }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /policies/${pol_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /vehicles/${v_id}/restoration-projects"
              payload: { policy_id: "${pol_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { rp_id: $.data.id }
            - call: "POST /restoration-projects/${rp_id}/receipts"
              payload: { amount_cents: 600000, receipt_ref: "rcpt-1" }
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /restoration-projects/${rp_id}/advance-stage"
              payload: {}
              as: Underwriter
              captures: { rp_stage: $.data.stage, rp_end: $.data.endorsement_limit_cents }
            - call: "GET /policies/${pol_id}"
              payload: {}
              as: Underwriter
              captures: { pol_cov: $.data.coverage_limit_cents, pol_prem: $.data.premium_cents }
          assert:
            - "stage advanced DISASSEMBLY -> BODYWORK"
            - "endorsement_limit_cents == min(600000, floor(4000000 * 0.25) = 1000000) == 600000"
            - "Policy.coverage_limit_cents == 4600000"
            - "Policy.premium_cents == round(41400 * 1.00 * 0.95 * 1.00) + round(600000 * 0.01) == 39330 + 6000 == 45330"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities: Claim vs Policy)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: claim_reopen_cycle_loop
        grounds:
          - state_machines.Claim.PAID_to_UNDER_INVESTIGATION
          - state_machines.Claim.UNDER_INVESTIGATION_to_REPAIR_AUTHORIZED
        distinguishing_aspect: |
          The Claim machine is cyclic: a PAID repair settlement can be REOPENED
