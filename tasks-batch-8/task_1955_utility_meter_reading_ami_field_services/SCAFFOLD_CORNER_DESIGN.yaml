            - "RouteStop.${stop_id}.stop_status == CANCELLED"

      - name: composite_initial_states_on_creation
        claim_type: initial_state
        grounds: [state_machines.WorkOrder, state_machines.ReplacementCampaign, state_machines.OpsSnapshot, state_machines.BillingCyclePeriod]
        distinguishing_aspect: "Fresh entities land in their declared initial states: WorkOrder OPEN, campaign DRAFT, snapshot DRAFT, period SCHEDULED."
        test_recipe:
          setup: ["account with installed meter"]
          setup_api_calls:
