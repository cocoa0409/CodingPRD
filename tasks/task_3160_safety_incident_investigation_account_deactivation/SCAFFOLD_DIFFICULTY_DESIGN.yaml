              payload: {}
              as: SafetyInvestigator
              captures: { score_exact: $.data.evidence_score, cap_used: $.data.applied_evidence_cap, distinct_n: $.data.distinct_evidence_source_count }
            - call: "POST /safety/incidents/${inc_id}/decision"
              payload: { decision_category: "DEACTIVATED", decision_basis: "Four independently recorded trip-data items clamp the evidence score to the deactivation floor.", expected_incident_version: "${inc_v_ready}" }
              as: SafetyInvestigator
              captures: { decided_status: $.data.incident_status, decided_cat: $.data.decision_category }
          assert:
            - "Evidence.${inc_id}.decision_evidence_score == 4.00 exactly: four DISPOSITIVE TRIP_DATA items give an unclamped 5.72, so the four-item type cap of 4.00 binds and the value sits exactly on the constant"
            - "the applied_evidence_cap == 4.00 = 1.00 + 1.00 + 1.00 + 1.00, the four per-item TRIP_DATA caps summed"
            - "the distinct_evidence_source_count == 1, so the provisional override's distinct-source condition is NOT satisfied and only the >= 4.00 branch can have fired"
            - "the decision is accepted and the incident reaches incident_status == \"DECIDED\" with decision_category == \"DEACTIVATED\" at exactly 4.00, proving the comparison is >= and not >"
            - "the SAFETY_VIOLATION category floor would have been NO_ACTION, so the DEACTIVATED outcome is attributable solely to the boundary crossing"

      - name: boundary_rollup_window_closed_open_at_the_exact_day
        grounds:
          - calculations.regulator_report_rollup_threshold
          - calculations.regulator_report_rollup_threshold.constants.DEFAULT_ROLLUP_THRESHOLD
          - state_machines.RegulatorReport.transitions.BACKLOG_to_FILED
          - endpoints.POST_/safety/regulator-reports/rollup-sweep
        distinguishing_aspect: |
          A boundary-inclusion check rather than a numeric threshold: each account carries a
          qualifying count of exactly 3 because the incident created at exactly window_start
          is counted while the one created at exactly window_end is excluded, so raising the
          configured threshold to 4 stops the very next sweep from filing.
        test_recipe:
          setup:
            - "Logical clock stepped across four instants. R1 policy with rollup_window_days 30 and rollup_threshold 3."
            - "Two driver accounts in R1, acct-x and acct-y, each carrying three prior S3 incidents created at 2026-09-01T00:00:00Z, 2026-09-15T00:00:00Z and 2026-09-20T00:00:00Z."
            - "acct-x has a fourth S3 incident created at 2026-10-01T00:00:00Z; acct-y has the same, created at the same instant."
            - "The first sweep on acct-x's incident files its report; the region threshold is then raised to 4 and the second sweep on acct-y's incident is expected to file nothing."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety/platform-policies"
              payload: { region_code: "R1", sd_floor_severity: "S4", rollup_window_days: 30, rollup_threshold: 3 }
