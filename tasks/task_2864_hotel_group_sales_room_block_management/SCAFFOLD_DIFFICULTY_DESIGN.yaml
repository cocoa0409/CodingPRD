# =============================================================================
# §1.8 Scaffold Difficulty Design — Hotel Group Sales & Room Block Management
#
# Nine §0.5 difficulty rules x >= 2 differentiated instances each.
# Every `grounds:` ref resolves into SCAFFOLD.yaml §1.1-§1.7.
# Every numeric assert below was computed by executing the §1.3 formulas.
#
# Shared fixture conventions (all instances start from an empty DB):
#   logical clock default            2026-08-01T00:00:00Z
#   program dates                    arrival 2026-11-09, departure 2026-11-12 (3 nights)
#   InventoryDay 2026-11-09..11      total_rooms 400, group_ceiling_rooms 250,
#                                    transient_demand_rooms 398, transient_adr_cents 21000,
#                                    historical_pickup_rooms 390, historical_adr_cents 19500
#   package P1 "Corporate Standard"  discount 0.0725, comp_room_ratio 40, rebate 750,
#                                    banquet 0.10, av 0.15, parking 0.05,
#                                    min_peak 4, min_rn 12, max_stack 0.45  (stack 0.3725)
#   package P2 "Small Meetings"      discount 0.05, comp_room_ratio 5, rebate 500,
#                                    banquet 0.05, av 0.10, parking 0.02,
#                                    min_peak 1, min_rn 1, max_stack 0.30   (stack 0.22)
#   X-User-IDs                       sm-001 (SalesManager), rm-001/rm-002 (RevenueManager),
#                                    ca-001 (ContractAdmin), ra-001 (ReservationsAgent),
#                                    ac-001/ac-002 (AccountingClerk), op-001 (SystemOperator),
#                                    GroupContact always acts as ${acct_id}
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: displacement_forecast_series_versus_historical_series
        grounds:
          - calculations.displacement_cost
          - entities.DisplacementAnalysis.fields.analysis_variant
          - entities.InventoryDay.fields.transient_demand_rooms
          - entities.InventoryDay.fields.historical_pickup_rooms
          - state_machines.Lead.QUALIFIED_to_DISPLACEMENT_REVIEW
        distinguishing_aspect: |
          The two variants read two different inventory series off the SAME InventoryDay rows for the
          same lead: FORECAST_BASED displaces 6 room nights worth 126000 cents while HISTORICAL_BASED
          displaces 0 room nights worth 0 cents, so net_benefit_cents differs by exactly 126000.
        test_recipe:
          setup:
            - "logical clock at the 2026-08-01T00:00:00Z default"
            - "one CORPORATE GroupAccount, three seeded InventoryDay rows (2026-11-09..11) whose forecast series (398 rooms) is above the historical series (390 rooms)"
            - "one Lead for 2026-11-09..2026-11-12, peak_rooms 4, total_requested_room_nights 12, meeting_space_sqft_needed 100, already QUALIFIED with qualification_score 35 and estimated_room_night_value_cents 206640"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "op-001"
            - call: "POST /group-sales/accounts"
              payload: { name: "Northwind Manufacturing", market_segment: "CORPORATE", billing_contact_email: "ap@northwind.example" }
              as: SalesManager
              as_user_id: "sm-001"
              captures: { acct_id: "$.data.id" }
            - call: "POST /group-sales/inventory-days"
              payload: { stay_date: "2026-11-09", total_rooms: 400, group_ceiling_rooms: 250, transient_demand_rooms: 398, transient_adr_cents: 21000, historical_pickup_rooms: 390, historical_adr_cents: 19500 }
              as: RevenueManager
              as_user_id: "rm-001"
            - call: "POST /group-sales/inventory-days"
              payload: { stay_date: "2026-11-10", total_rooms: 400, group_ceiling_rooms: 250, transient_demand_rooms: 398, transient_adr_cents: 21000, historical_pickup_rooms: 390, historical_adr_cents: 19500 }
              as: RevenueManager
              as_user_id: "rm-001"
            - call: "POST /group-sales/inventory-days"
              payload: { stay_date: "2026-11-11", total_rooms: 400, group_ceiling_rooms: 250, transient_demand_rooms: 398, transient_adr_cents: 21000, historical_pickup_rooms: 390, historical_adr_cents: 19500 }
              as: RevenueManager
              as_user_id: "rm-001"
            - call: "POST /group-sales/leads"
              payload: { account_id: "${acct_id}", program_name: "Northwind Sales Kickoff", arrival_date: "2026-11-09", departure_date: "2026-11-12", peak_rooms: 4, total_requested_room_nights: 12, meeting_space_sqft_needed: 100, decision_deadline_at: "2026-09-15T00:00:00Z" }
              as: SalesManager
              as_user_id: "sm-001"
              captures: { lead_id: "$.data.id" }
            - call: "POST /group-sales/leads/${lead_id}/qualify"
              payload: {}
              as: SalesManager
              as_user_id: "sm-001"
          trigger:
            - call: "POST /group-sales/displacement-analyses"
              payload: { lead_id: "${lead_id}", analysis_variant: "FORECAST_BASED" }
              as: RevenueManager
              as_user_id: "rm-001"
              captures: { an_fc_id: "$.data.id" }
            - call: "POST /group-sales/displacement-analyses"
              payload: { lead_id: "${lead_id}", analysis_variant: "HISTORICAL_BASED" }
              as: RevenueManager
              as_user_id: "rm-001"
              captures: { an_hist_id: "$.data.id" }
          assert:
            - "Lead.${lead_id}.qualification_score == 35"
            - "Lead.${lead_id}.estimated_room_night_value_cents == 206640"
            - "DisplacementAnalysis.${an_fc_id}.displaced_room_nights == 6"
            - "DisplacementAnalysis.${an_fc_id}.displaced_revenue_cents == 126000"
            - "DisplacementAnalysis.${an_fc_id}.ancillary_projection_cents == 54000"
            - "DisplacementAnalysis.${an_fc_id}.net_benefit_cents == 134640"
            - "DisplacementAnalysis.${an_fc_id}.verdict == ACCEPT"
            - "DisplacementAnalysis.${an_hist_id}.displaced_room_nights == 0"
            - "DisplacementAnalysis.${an_hist_id}.displaced_revenue_cents == 0"
            - "DisplacementAnalysis.${an_hist_id}.net_benefit_cents == 260640"
            - "DisplacementAnalysis.${an_hist_id}.net_benefit_cents - DisplacementAnalysis.${an_fc_id}.net_benefit_cents == 126000"
            - "both analyses are status PENDING and Lead.${lead_id}.status == DISPLACEMENT_REVIEW"

      - name: attrition_basis_room_nights_versus_peak_night
        grounds:
          - calculations.attrition_liability
          - entities.GroupContract.fields.attrition_basis
          - entities.RoomBlock.fields.peak_night_rooms
          - endpoints["GET /group-sales/room-blocks/{id}/pickup-summary"]
        distinguishing_aspect: |
          On one identical pickup pattern (5 actualized room nights spread 2/2/1 across the three
          nights) the ROOM_NIGHTS basis yields a 4-room-night shortfall worth 70992 cents while the
          PEAK_NIGHT basis yields a 1-room peak miss = 3 room nights worth 53244 cents; the projection
          endpoint returns both so the 17748-cent divergence is observable in a single response.
        test_recipe:
          setup:
            - "contract signed off package P1 with attrition_threshold_pct 0.75, attrition_basis ROOM_NIGHTS, contracted_room_nights 12, contracted_peak_rooms 4, contracted_rate_cents 20880"
            - "master block OPEN with BlockNight rows of 4 rooms on 2026-11-09, 10 and 11"
            - "three CONFIRMED reservations: 2026-11-09..12 (3 room nights), 2026-11-09..10 (1), 2026-11-10..11 (1) — 5 actualized room nights, peak night rooms 2"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "op-001"
            - call: "POST /group-sales/accounts"
              payload: { name: "Northwind Manufacturing", market_segment: "CORPORATE", billing_contact_email: "ap@northwind.example" }
              as: SalesManager
              as_user_id: "sm-001"
              captures: { acct_id: "$.data.id" }
            - call: "POST /group-sales/inventory-days"
              payload: { stay_date: "2026-11-09", total_rooms: 400, group_ceiling_rooms: 250, transient_demand_rooms: 398, transient_adr_cents: 21000, historical_pickup_rooms: 390, historical_adr_cents: 19500 }
              as: RevenueManager
              as_user_id: "rm-001"
            - call: "POST /group-sales/inventory-days"
              payload: { stay_date: "2026-11-10", total_rooms: 400, group_ceiling_rooms: 250, transient_demand_rooms: 398, transient_adr_cents: 21000, historical_pickup_rooms: 390, historical_adr_cents: 19500 }
              as: RevenueManager
              as_user_id: "rm-001"
            - call: "POST /group-sales/inventory-days"
              payload: { stay_date: "2026-11-11", total_rooms: 400, group_ceiling_rooms: 250, transient_demand_rooms: 398, transient_adr_cents: 21000, historical_pickup_rooms: 390, historical_adr_cents: 19500 }
              as: RevenueManager
              as_user_id: "rm-001"
            - call: "POST /group-sales/concession-packages"
              payload: { name: "Corporate Standard", room_rate_discount_pct: 0.0725, comp_room_ratio: 40, rebate_per_room_night_cents: 750, banquet_discount_pct: 0.10, av_discount_pct: 0.15, parking_discount_pct: 0.05, min_peak_rooms: 4, min_total_room_nights: 12, max_discount_stack_pct: 0.45 }
              as: RevenueManager
              as_user_id: "rm-001"
              captures: { pkg_id: "$.data.id" }
            - call: "POST /group-sales/leads"
              payload: { account_id: "${acct_id}", program_name: "Northwind Sales Kickoff", arrival_date: "2026-11-09", departure_date: "2026-11-12", peak_rooms: 4, total_requested_room_nights: 12, meeting_space_sqft_needed: 100, decision_deadline_at: "2026-09-15T00:00:00Z" }
              as: SalesManager
              as_user_id: "sm-001"
              captures: { lead_id: "$.data.id" }
            - call: "POST /group-sales/leads/${lead_id}/qualify"
              payload: {}
              as: SalesManager
              as_user_id: "sm-001"
            - call: "POST /group-sales/displacement-analyses"
              payload: { lead_id: "${lead_id}", analysis_variant: "FORECAST_BASED" }
              as: RevenueManager
              as_user_id: "rm-001"
              captures: { an_id: "$.data.id" }
            - call: "GET /group-sales/leads/${lead_id}"
              payload: {}
              as: SalesManager
              as_user_id: "sm-001"
              captures: { lead_v1: "$.data.version" }
            - call: "POST /group-sales/displacement-analyses/${an_id}/decide"
              payload: { decision: "APPROVE", expected_lead_version: "${lead_v1}" }
              as: RevenueManager
              as_user_id: "rm-002"
            - call: "GET /group-sales/leads/${lead_id}"
              payload: {}
              as: SalesManager
              as_user_id: "sm-001"
              captures: { lead_v2: "$.data.version" }
            - call: "POST /group-sales/rate-quotes"
              payload: { lead_id: "${lead_id}", concession_package_id: "${pkg_id}", base_rate_cents: 23950, quoted_peak_rooms: 4, quoted_room_nights: 12, expires_at: "2026-10-01T00:00:00Z", expected_lead_version: "${lead_v2}" }
              as: SalesManager
              as_user_id: "sm-001"
              captures: { quote_id: "$.data.id" }
            - call: "POST /group-sales/rate-quotes/${quote_id}/propose"
              payload: {}
              as: SalesManager
              as_user_id: "sm-001"
            - call: "POST /group-sales/rate-quotes/${quote_id}/accept"
              payload: {}
              as: GroupContact
              as_user_id: "${acct_id}"
            - call: "POST /group-sales/contracts"
              payload: { quote_id: "${quote_id}", attrition_threshold_pct: 0.75, attrition_basis: "ROOM_NIGHTS", force_majeure_clause: "STANDARD", cutoff_days_before_arrival: 21, contracted_room_nights: 12, contracted_peak_rooms: 4, nightly_allotments: [{ stay_date: "2026-11-09", rooms: 4 }, { stay_date: "2026-11-10", rooms: 4 }, { stay_date: "2026-11-11", rooms: 4 }] }
              as: ContractAdmin
              as_user_id: "ca-001"
              captures: { contract_id: "$.data.id" }
            - call: "POST /group-sales/contracts/${contract_id}/send"
              payload: {}
              as: ContractAdmin
              as_user_id: "ca-001"
            - call: "POST /group-sales/contracts/${contract_id}/sign"
              payload: { signature_name: "R. Buyer" }
              as: ContractAdmin
              as_user_id: "ca-001"
            - call: "GET /group-sales/room-blocks"
              payload: { contract_id: "${contract_id}", is_master: true }
              as: ContractAdmin
              as_user_id: "ca-001"
              captures: { master_block_id: "$.data[0].id" }
            - call: "POST /group-sales/room-blocks/${master_block_id}/open"
              payload: {}
              as: ReservationsAgent
              as_user_id: "ra-001"
            - call: "POST /group-sales/reservations"
              payload: { block_id: "${master_block_id}", guest_name: "Ada Lovelace", arrival_date: "2026-11-09", departure_date: "2026-11-12", source: "ROOMING_LIST" }
              as: ReservationsAgent
              as_user_id: "ra-001"
              captures: { res_a_id: "$.data.id" }
            - call: "POST /group-sales/reservations"
              payload: { block_id: "${master_block_id}", guest_name: "Grace Hopper", arrival_date: "2026-11-09", departure_date: "2026-11-10", source: "ROOMING_LIST" }
              as: ReservationsAgent
              as_user_id: "ra-001"
              captures: { res_b_id: "$.data.id" }
            - call: "POST /group-sales/reservations"
              payload: { block_id: "${master_block_id}", guest_name: "Alan Turing", arrival_date: "2026-11-10", departure_date: "2026-11-11", source: "ROOMING_LIST" }
              as: ReservationsAgent
              as_user_id: "ra-001"
              captures: { res_c_id: "$.data.id" }
            - call: "POST /group-sales/reservations/${res_a_id}/advance"
              payload: { to_status: "CONFIRMED" }
              as: ReservationsAgent
              as_user_id: "ra-001"
            - call: "POST /group-sales/reservations/${res_b_id}/advance"
              payload: { to_status: "CONFIRMED" }
              as: ReservationsAgent
              as_user_id: "ra-001"
            - call: "POST /group-sales/reservations/${res_c_id}/advance"
              payload: { to_status: "CONFIRMED" }
              as: ReservationsAgent
              as_user_id: "ra-001"
          trigger:
            - call: "GET /group-sales/room-blocks/${master_block_id}/pickup-summary"
              payload: {}
              as: RevenueManager
              as_user_id: "rm-001"
          assert:
            - "RateQuote.${quote_id}.effective_net_rate_cents == 20880"
            - "GroupContract.${contract_id}.contracted_rate_cents == 20880"
            - "pickup_summary.allotted_room_nights == 12"
            - "pickup_summary.picked_up_room_nights == 5"
            - "pickup_summary.peak_night_rooms == 2"
            - "pickup_summary.commitment_base_room_nights == 12"
            - "pickup_summary.room_nights_basis_shortfall == 4"
            - "pickup_summary.room_nights_basis_damages_cents == 70992"
            - "pickup_summary.peak_night_basis_shortfall == 3"
            - "pickup_summary.peak_night_basis_damages_cents == 53244"
            - "pickup_summary.room_nights_basis_damages_cents - pickup_summary.peak_night_basis_damages_cents == 17748"

  - rule_id: combinatorial_formula
    instances:

      - name: effective_net_rate_component_rounding_order
        grounds:
          - calculations.effective_net_rate
          - entities.RateQuote.fields.effective_net_rate_cents
          - entities.RateQuote.fields.total_quote_value_cents
          - entities.ConcessionPackage.fields.comp_room_ratio
        distinguishing_aspect: |
          base_rate_cents 23950 with room_rate_discount_pct 0.0725 and comp_room_ratio 40 is the
          pinned-order witness: 23950*0.0725 = 1736.375 -> 1736 and 23950/41 = 584.146 -> 584, so
          ROUND_EACH_COMPONENT_THEN_SUBTRACT yields 20880 while rounding once at the end yields 20879.
          total_quote_value_cents amplifies the one-cent divergence to 250560 vs 250548 over 12 nights.
        test_recipe:
          setup:
            - "clock 2026-08-01T00:00:00Z, three InventoryDay rows for 2026-11-09..11"
            - "package P1 with room_rate_discount_pct 0.0725, comp_room_ratio 40, rebate_per_room_night_cents 750, max_discount_stack_pct 0.45"
            - "lead CLEARED after an APPROVED FORECAST_BASED displacement analysis"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "op-001"
            - call: "POST /group-sales/accounts"
              payload: { name: "Northwind Manufacturing", market_segment: "CORPORATE", billing_contact_email: "ap@northwind.example" }
              as: SalesManager
              as_user_id: "sm-001"
              captures: { acct_id: "$.data.id" }
            - call: "POST /group-sales/inventory-days"
              payload: { stay_date: "2026-11-09", total_rooms: 400, group_ceiling_rooms: 250, transient_demand_rooms: 398, transient_adr_cents: 21000, historical_pickup_rooms: 390, historical_adr_cents: 19500 }
              as: RevenueManager
              as_user_id: "rm-001"
            - call: "POST /group-sales/inventory-days"
              payload: { stay_date: "2026-11-10", total_rooms: 400, group_ceiling_rooms: 250, transient_demand_rooms: 398, transient_adr_cents: 21000, historical_pickup_rooms: 390, historical_adr_cents: 19500 }
              as: RevenueManager
              as_user_id: "rm-001"
            - call: "POST /group-sales/inventory-days"
              payload: { stay_date: "2026-11-11", total_rooms: 400, group_ceiling_rooms: 250, transient_demand_rooms: 398, transient_adr_cents: 21000, historical_pickup_rooms: 390, historical_adr_cents: 19500 }
              as: RevenueManager
              as_user_id: "rm-001"
            - call: "POST /group-sales/concession-packages"
              payload: { name: "Corporate Standard", room_rate_discount_pct: 0.0725, comp_room_ratio: 40, rebate_per_room_night_cents: 750, banquet_discount_pct: 0.10, av_discount_pct: 0.15, parking_discount_pct: 0.05, min_peak_rooms: 4, min_total_room_nights: 12, max_discount_stack_pct: 0.45 }
              as: RevenueManager
              as_user_id: "rm-001"
              captures: { pkg_id: "$.data.id", stack_pct: "$.data.discount_stack_pct" }
            - call: "POST /group-sales/leads"
              payload: { account_id: "${acct_id}", program_name: "Northwind Sales Kickoff", arrival_date: "2026-11-09", departure_date: "2026-11-12", peak_rooms: 4, total_requested_room_nights: 12, meeting_space_sqft_needed: 100, decision_deadline_at: "2026-09-15T00:00:00Z" }
              as: SalesManager
              as_user_id: "sm-001"
              captures: { lead_id: "$.data.id" }
            - call: "POST /group-sales/leads/${lead_id}/qualify"
              payload: {}
              as: SalesManager
              as_user_id: "sm-001"
            - call: "POST /group-sales/displacement-analyses"
              payload: { lead_id: "${lead_id}", analysis_variant: "FORECAST_BASED" }
              as: RevenueManager
              as_user_id: "rm-001"
              captures: { an_id: "$.data.id" }
            - call: "GET /group-sales/leads/${lead_id}"
              payload: {}
              as: SalesManager
              as_user_id: "sm-001"
              captures: { lead_v1: "$.data.version" }
            - call: "POST /group-sales/displacement-analyses/${an_id}/decide"
              payload: { decision: "APPROVE", expected_lead_version: "${lead_v1}" }
              as: RevenueManager
              as_user_id: "rm-002"
            - call: "GET /group-sales/leads/${lead_id}"
              payload: {}
              as: SalesManager
              as_user_id: "sm-001"
              captures: { lead_v2: "$.data.version" }
          trigger:
            - call: "POST /group-sales/rate-quotes"
              payload: { lead_id: "${lead_id}", concession_package_id: "${pkg_id}", base_rate_cents: 23950, quoted_peak_rooms: 4, quoted_room_nights: 12, expires_at: "2026-10-01T00:00:00Z", expected_lead_version: "${lead_v2}" }
              as: SalesManager
              as_user_id: "sm-001"
              captures: { quote_id: "$.data.id" }
          assert:
            - "ConcessionPackage.${pkg_id}.discount_stack_pct == 0.3725"
            - "RateQuote.${quote_id}.comp_room_ratio == 40"
            - "RateQuote.${quote_id}.rebate_per_room_night_cents == 750"
            - "RateQuote.${quote_id}.effective_net_rate_cents == 20880"
            - "RateQuote.${quote_id}.effective_net_rate_cents != 20879"
            - "RateQuote.${quote_id}.total_quote_value_cents == 250560"
            - "RateQuote.${quote_id}.status == DRAFT and negotiation_round == 0 and hold_placed == false"

      - name: settlement_waterfall_six_step_order_with_incentive_keyed_on_step_three
        grounds:
          - calculations.settlement_waterfall
          - calculations.attrition_liability
          - calculations.ancillary_net
          - calculations.account_rebooking_tier
          - entities.Reconciliation.fields.net_before_incentive_cents
          - entities.Reconciliation.fields.incentive_rate_snapshot
        distinguishing_aspect: |
          The six steps must run in the pinned order and the incentive rate must be keyed on step 3's
          net_before_incentive_cents, never on total_settlement_cents: damages 70992 + posted ancillary
          450000 = gross 520992, cap 130248 does not bind the 3750 earned rebate, net_before 517242,
          rate 0.01 (no size bonus below 2000000), incentive 5172, total 512070. Keying the rate on the
          total, or netting the rebate after the incentive, both produce a different total.
        test_recipe:
          setup:
            - "signed P1 contract (ROOM_NIGHTS basis, threshold 0.75, contracted_room_nights 12, contracted_rate_cents 20880) with an OPEN master block of 4/4/4"
            - "5 CONFIRMED actualized room nights (2026-11-09..12, 2026-11-09..10, 2026-11-10..11)"
            - "one BANQUET charge of 500000 gross POSTED (net 450000) and one AUDIOVISUAL charge of 200000 gross left QUOTED (net 170000, must be excluded)"
            - "brand-new account, so rebooking_incentive_pct is the 0.01 base tier"
            - "clock advanced to 2026-11-12T10:00:00Z and the master block CUT_OFF"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "op-001"
            - call: "POST /group-sales/accounts"
              payload: { name: "Northwind Manufacturing", market_segment: "CORPORATE", billing_contact_email: "ap@northwind.example" }
              as: SalesManager
              as_user_id: "sm-001"
              captures: { acct_id: "$.data.id" }
            - call: "POST /group-sales/inventory-days"
              payload: { stay_date: "2026-11-09", total_rooms: 400, group_ceiling_rooms: 250, transient_demand_rooms: 398, transient_adr_cents: 21000, historical_pickup_rooms: 390, historical_adr_cents: 19500 }
              as: RevenueManager
              as_user_id: "rm-001"
            - call: "POST /group-sales/inventory-days"
              payload: { stay_date: "2026-11-10", total_rooms: 400, group_ceiling_rooms: 250, transient_demand_rooms: 398, transient_adr_cents: 21000, historical_pickup_rooms: 390, historical_adr_cents: 19500 }
              as: RevenueManager
              as_user_id: "rm-001"
            - call: "POST /group-sales/inventory-days"
              payload: { stay_date: "2026-11-11", total_rooms: 400, group_ceiling_rooms: 250, transient_demand_rooms: 398, transient_adr_cents: 21000, historical_pickup_rooms: 390, historical_adr_cents: 19500 }
              as: RevenueManager
              as_user_id: "rm-001"
            - call: "POST /group-sales/concession-packages"
