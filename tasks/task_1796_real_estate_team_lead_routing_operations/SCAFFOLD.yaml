    side_effects: ["status -> ACTIVE", "previous ACTIVE policy -> SUPERSEDED", "increments Team.version by 1", "ERR_STALE_VERSION (412) when expected_team_version != Team.version"]

  # --- LeadSource ---
  - method: POST
    path: "/crm/lead-sources"
    description: "Create a lead source (ACTIVE)"
