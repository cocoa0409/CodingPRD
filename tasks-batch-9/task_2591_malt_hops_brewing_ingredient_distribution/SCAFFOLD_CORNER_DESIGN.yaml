          trigger:
            - call: "POST /sales-orders/${nr_o_id}/pick"
              payload: {}
              as: WarehouseOperator
              captures: { nr_err_pick: $.data.error_id }
            - call: "POST /yeast-propagation-jobs/${nr_job_id}/start"
              payload: {}
              as: WarehouseOperator
              captures: { nr_job_state2: $.data.status }
            - call: "POST /sales-orders/${nr_o_id}/pick"
              payload: {}
              as: WarehouseOperator
              captures: { nr_err_pick_propagating: $.data.error_id }
            - call: "POST /yeast-propagation-jobs/${nr_job_id}/complete"
              payload: { outcome: "READY" }
              as: WarehouseOperator
              captures: { nr_job_state3: $.data.status }
            - call: "POST /sales-orders/${nr_o_id}/pick"
              payload: {}
              as: WarehouseOperator
              captures: { nr_pick_state: $.data.fulfillment_status }
          assert:
            - "setup: ${nr_job_state} == REQUESTED, ${nr_line_ext} == 72000, ${nr_line_cold} == true (YeastStrain.cold_storage_required defaults true) and ${nr_line_pb} == false (yeast has no pallet quantity)"
            - "setup: ${nr_chargeable} == 0 because the only line is in L, so ${nr_freight} == 43000 (the 25000 TIER_1 minimum plus the 18000 reefer surcharge) and ${nr_sos} == 7500"
            - "setup: ${nr_total} == 122500 and ${nr_credit} == APPROVED — the confirm never consults job readiness"
            - "pick with a REQUESTED job: HTTP 409 with ${nr_err_pick} == ERR_YEAST_NOT_READY"
            - "pick with a PROPAGATING job: HTTP 409 with ${nr_err_pick_propagating} == ERR_YEAST_NOT_READY — only READY satisfies the gate, and ${nr_job_state2} == PROPAGATING"
            - "SalesOrder.${nr_o_id}.fulfillment_status is still CONFIRMED after both refusals"
            - "after complete READY: ${nr_job_state3} == READY and the third pick returns HTTP 200 with ${nr_pick_state} == PICKED"

      - name: shipping_a_flagged_reefer_load_is_refused
        claim_type: violation_to_error
        grounds:
          - errors[ERR_COLD_CHAIN_EXCURSION]
          - validations[priority=24]
        excluded_because:
          difficulty_instance: transitive_cascade / temperature_excursion_fails_yeast_quarantines_hops_and_mints_replacement_job
          rationale: "The named §1.8 instance drives a real excursion through the reading series and then asserts HTTP 409 with ERR_COLD_CHAIN_EXCURSION on the subsequent ship attempt."

      - name: an_empty_substitute_candidate_set_is_reported
        claim_type: violation_to_error
        grounds:
          - errors[ERR_NO_SUBSTITUTE_AVAILABLE]
          - validations[priority=38]
        excluded_because:
          difficulty_instance: boundary_precision_check / substitute_candidate_admitted_at_exactly_offered_pounds
          rationale: "The named §1.8 instance asserts ERR_NO_SUBSTITUTE_AVAILABLE one pound below the admission boundary, which is the only way the candidate set can be empty."

      - name: a_clashing_propagation_slot_is_reported
        claim_type: violation_to_error
        grounds:
          - errors[ERR_PROPAGATION_SLOT_CONFLICT]
          - validations[priority=29]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / propagation_slot_gap_measured_in_whole_days_inclusive_at_lead_time
          rationale: "The named §1.8 instance asserts ERR_PROPAGATION_SLOT_CONFLICT at exactly one day inside the vessel turnover gap, and the accepted case exactly at the gap."

  # ===========================================================================
  # From Table 7 (RBAC) — five peer desks under segregation of duties
  # ===========================================================================
  - section: rbac
    instances:

      - name: every_desk_can_run_its_own_exclusive_operation
        claim_type: exclusive_operations
        grounds:
          - roles.PlatformAdmin
          - roles.CreditManager
          - roles.AllocationManager
          - roles.WarehouseOperator
          - roles.Brewer
          - complexity_profile.role_model
        distinguishing_aspect: "One reachable happy call for each of the five desks' exclusive operations in a single chain, proving the permission matrix is not accidentally collapsed onto one super-role: the clock is admin-only, malt receiving is warehouse-only, contracting is hop-desk-only, confirming is brewer-only and repricing credit is credit-desk-only."
        test_recipe:
          setup:
            - "Empty database; the logical clock starts at 2026-08-01T00:00:00Z."
            - "Reference data seeded by whichever desk owns it: one brewer, one hop variety, one crop-year program, one malt product."
          setup_api_calls:
            - call: "POST /brewers"
              payload: { name: "Five Desks Brewing", brewery_license_no: "BR-1053", credit_terms_days: 30, credit_limit_cents: 5000000, cold_chain_certified: false, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { fdk_b_id: $.data.id }
            - call: "POST /hop-varieties"
              payload: { variety_code: "CITRA", name: "Citra", substitution_group: "AROMA_HIGH_ALPHA", alpha_acid_target_pct: 12.50, spot_price_cents_per_lb: 51.00, available_spot_lbs: 20000, cold_storage_required: true, pallet_quantity_lbs: 880, min_order_lbs: 44 }
              as: AllocationManager
              captures: { fdk_citra_id: $.data.id }
            - call: "POST /crop-year-programs"
              payload: { crop_year: 2026, contract_open_date: "2026-01-15T00:00:00Z", harvest_report_due_date: "2026-10-01T00:00:00Z" }
              as: AllocationManager
              captures: { fdk_prog_id: $.data.id }
            - call: "POST /malt-products"
              payload: { sku: "PALE-ALE", name: "Pale Ale Malt", malt_class: "BASE", list_price_cents_per_lb: 68.50, max_moisture_pct: 5.0, min_diastatic_power: 60.0, pallet_quantity_lbs: 2200, min_order_lbs: 55 }
              as: WarehouseOperator
              captures: { fdk_prod_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { fdk_clock: $.data.current_utc }
            - call: "POST /malt-lots"
              payload: { malt_product_id: "${fdk_prod_id}", lot_code: "LOT-FD-1", quantity_lbs: 5000 }
              as: WarehouseOperator
              captures: { fdk_lot_id: $.data.id, fdk_lot_state: $.data.status }
            - call: "POST /hop-contracts"
              payload: { brewer_id: "${fdk_b_id}", variety_id: "${fdk_citra_id}", crop_year_program_id: "${fdk_prog_id}", contract_type: "FIXED_CROP_YEAR", contracted_lbs: 5000, price_per_lb_cents: 250.00, delivery_window_start: "2026-09-01T00:00:00Z", delivery_window_end: "2026-12-31T00:00:00Z" }
              as: AllocationManager
              captures: { fdk_c_id: $.data.id, fdk_c_state: $.data.status }
            - call: "POST /sales-orders"
              payload: { brewer_id: "${fdk_b_id}", requested_ship_date: "2026-09-05T00:00:00Z" }
              as: Brewer
              as_user_id: "${fdk_b_id}"
              captures: { fdk_o_id: $.data.id }
            - call: "POST /sales-orders/${fdk_o_id}/lines"
              payload: { item_type: "MALT", quantity: 1000, uom: "LB", malt_lot_id: "${fdk_lot_id}" }
              as: Brewer
              as_user_id: "${fdk_b_id}"
              captures: { fdk_line_id: $.data.id }
            - call: "POST /sales-orders/${fdk_o_id}/confirm"
              payload: {}
              as: Brewer
              as_user_id: "${fdk_b_id}"
              captures: { fdk_o_state: $.data.fulfillment_status, fdk_o_total: $.data.total_cents }
            - call: "GET /brewers/${fdk_b_id}"
              payload: {}
              as: CreditManager
              captures: { fdk_b_v: $.data.version }
            - call: "PUT /brewers/${fdk_b_id}/credit-profile"
              payload: { expected_brewer_version: "${fdk_b_v}", credit_terms_days: 45 }
              as: CreditManager
              captures: { fdk_terms: $.data.credit_terms_days, fdk_b_v2: $.data.version }
          assert:
            - "PlatformAdmin: HTTP 200 with ${fdk_clock} == 2026-08-01T00:00:00Z"
            - "WarehouseOperator: HTTP 201 with ${fdk_lot_state} == RECEIVED"
            - "AllocationManager: HTTP 201 with ${fdk_c_state} == ACTIVE and HopContract.${fdk_c_id}.remaining_lbs == 5000"
            - "Brewer: HTTP 200 with ${fdk_o_state} == CONFIRMED and ${fdk_o_total} == 105500 (68500 subtotal, 25000 freight minimum with no reefer surcharge on an ambient malt line, 4500 pallet break, 7500 small-order surcharge)"
            - "CreditManager: HTTP 200 with ${fdk_terms} == 45 and ${fdk_b_v2} == ${fdk_b_v} + 1"
            - "no call in the chain returned 403 — every desk reached exactly the endpoint its own role owns"

      - name: no_desk_can_reach_another_desks_exclusive_operation
        claim_type: other_roles_exclusive_operations
        grounds:
          - errors[ERR_ROLE_NOT_PERMITTED]
          - validations[priority=3]
          - roles.Brewer
          - roles.AllocationManager
          - roles.CreditManager
          - roles.WarehouseOperator
          - roles.PlatformAdmin
        distinguishing_aspect: "Six denials that each cross a different pair of desks, including PlatformAdmin, which owns the clock but is deliberately barred from every business decision — so an implementation that treats the admin as a superuser fails here even though it passes the five happy paths."
