            - "Broker.${brk_id}.diligence_status == APPROVED and Broker.${brk_id}.approved_agreement_count == 2"

  - rule_id: transitive_cascade
    instances:
      - name: exception_revoke_four_hop_to_contingency_activation
        grounds:
          - state_machines.PrimaryPurposeException.ACKNOWLEDGED_to_REVOKED
          - state_machines.DepositProgram.OPEN_FOR_PLACEMENT_to_RECLASSIFICATION_PENDING
          - state_machines.LiquidityContingencyPlan.APPROVED_to_ACTIVATED
          - calculations.wholesale_balance_rollup
          - calculations.concentration_posture
          - calculations.contingency_stage_selection
          - calculations.required_liquidity_buffer
        distinguishing_aspect: |
          Depth-4 chain triggered by the PrimaryPurposeException REVOKE transition:
          hop 1 revokes the exception, which causes hop 2 (the reliant program drops to
          RECLASSIFICATION_PENDING), which causes hop 3 (its ACTIVE placement is FLAGGED
          and re-bucketed from listing to brokered, moving Institution balances), which
          causes hop 4 (posture turns FROZEN and the APPROVED contingency plan
          auto-ACTIVATES with activation_stage STAGE_1_MONITOR). No hop is a direct
          effect of the REVOKE call itself.
