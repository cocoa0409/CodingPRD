scaffold_corner_design:
  - section: entities
    instances:
      - name: corner_create_review_office_returns_every_declared_field
        claim_type: creation
        grounds: [entities.ReviewOffice, endpoints.POST_review_offices]
        distinguishing_aspect: "A ReviewOffice created with only office_code and name returns 201 and echoes all declared policy fields plus the four common fields; binding_obligation_cents starts at 0."
        test_recipe:
          setup: ["Empty database. The logical clock is at its startup default 2026-08-01T00:00:00Z."]
          setup_api_calls: []
          trigger:
            - &k_office
              call: "POST /review-offices"
              payload: { office_code: "ERO-1", name: "Region 1 Environmental Review Office" }
              as: PolicyAdmin
              captures: { off_id: $.data.id }
          assert:
            - "HTTP status is 201 and response_type == object"
            - "data.office_code == ERO-1 and data.name == Region 1 Environmental Review Office"
            - "data.binding_obligation_cents == 0"
            - "data.id, data.created_at, data.updated_at are present and data.version == 1"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: corner_create_review_office_omitted_fields_apply_declared_defaults
        claim_type: defaults
        grounds:
          - entities.ReviewOffice.fields.ce_threshold_disturbance_hectares
          - entities.ReviewOffice.fields.significance_threshold
          - entities.ReviewOffice.fields.max_binding_obligation_cents
          - entities.ReviewOffice.fields.extraordinary_circumstance_codes
        distinguishing_aspect: "Every optional ReviewOffice policy field falls back to its §1.1 default when omitted; the defaults are the literals the rest of the design depends on."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /review-offices"
              payload: { office_code: "ERO-2", name: "Region 2 Environmental Review Office" }
              as: PolicyAdmin
              captures: { off2_id: $.data.id }
          assert:
            - "data.ce_threshold_disturbance_hectares == 5.0 and data.ea_threshold_disturbance_hectares == 100.0"
            - "data.min_scoping_days == 30, data.min_ea_comment_days == 30, data.min_eis_comment_days == 45"
            - "data.objection_window_days == 45 and data.cumulative_radius_km == 25.0"
            - "data.significance_threshold == 60.0, data.intensity_weight == 0.6, data.context_weight == 0.4"
            - "data.max_mitigated_reduction_points == 18.0 and data.cost_per_reduction_point_cents == 250000"
            - "data.monitoring_escalation_factor == 1.035 and data.max_binding_obligation_cents == 900000000"
            - "data.extraordinary_circumstance_codes == [EC_HISTORIC, EC_ENDANGERED_SPECIES, EC_WETLAND] and data.ec_severity_trigger_threshold == 3"
            - "data.min_screened_in_alternatives_ea == 1, data.min_screened_in_alternatives_eis == 2, data.min_alternative_feasibility == 60.0"

      - name: corner_create_proposed_action_missing_required_field_is_rejected
        claim_type: required_fields
        grounds: [entities.ProposedAction.fields.disturbance_hectares, validations.priority_3_request_shape]
        distinguishing_aspect: "disturbance_hectares has source input with no default, so omitting it must yield ERR_INVALID_REQUEST (400) and create nothing."
        test_recipe:
          setup: ["ReviewOffice ERO-1 exists."]
          setup_api_calls:
            - *k_office
          trigger:
            - call: "POST /proposed-actions"
              payload: { office_id: "${off_id}", title: "Ridgeline Fuels Treatment", reference_cost_cents: 10000000 }
              as: NepaCoordinator
          assert:
            - "HTTP status is 400 and data.error_id == ERR_INVALID_REQUEST"
            - "response_type == error"
            - "GET /proposed-actions returns total_count == 0"

      - name: corner_create_agency_with_unknown_body_key_is_rejected
        claim_type: type_constraints
        grounds: [validations.priority_3_request_shape, endpoints.POST_agencies]
        distinguishing_aspect: "A body key that is not in the endpoint's declared input list is a shape violation at priority 3, so ERR_INVALID_REQUEST (400) is returned even though every declared field is well formed."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /agencies"
              payload: { agency_code: "USFWS", name: "US Fish and Wildlife Service", agency_role: "CONSULTING", active_consultation_count: 4 }
              as: PolicyAdmin
          assert:
            - "HTTP status is 400 and data.error_id == ERR_INVALID_REQUEST"
            - "No Agency row is created: GET /agencies returns total_count == 0"

      - name: corner_create_cumulative_action_with_invalid_enum_is_rejected
        claim_type: type_constraints
        grounds: [entities.CumulativeAction.fields.temporal_scope, validations.priority_3_request_shape]
        distinguishing_aspect: "temporal_scope is constrained to PAST | PRESENT | REASONABLY_FORESEEABLE; any other token is a 400 shape error, not a 409 business error."
        test_recipe:
          setup: ["The ERO-1 Ridgeline action is CLASSIFIED as ENVIRONMENTAL_ASSESSMENT."]
          setup_api_calls:
            - *k_office
            - &k_action
              call: "POST /proposed-actions"
              payload: { office_id: "${off_id}", title: "Ridgeline Fuels Treatment", disturbance_hectares: 40.0, reference_cost_cents: 10000000, in_critical_habitat: true, affects_historic_property: false, tribal_interest: false, floodplain_or_wetland: false }
              as: NepaCoordinator
              captures: { act_id: $.data.id }
            - &k_screen1
              call: "POST /proposed-actions/${act_id}/ec-screens"
              payload:
                findings:
                  - { code: "EC_HISTORIC", present: false, severity: 0, narrative: "No historic properties" }
                  - { code: "EC_ENDANGERED_SPECIES", present: true, severity: 2, narrative: "Transit habitat only" }
                  - { code: "EC_WETLAND", present: false, severity: 0, narrative: "No wetlands mapped" }
              as: NepaCoordinator
              captures: { scr1_id: $.data.id }
            - &k_adj_cleared
              call: "POST /ec-screens/${scr1_id}/adjudicate"
              payload: { disposition: "CLEARED", adjudicator_note: "No extraordinary circumstance triggered" }
              as: ReviewingOfficial
            - &k_classify
              call: "POST /proposed-actions/${act_id}/classify"
              payload: {}
              as: NepaCoordinator
          trigger:
            - call: "POST /proposed-actions/${act_id}/cumulative-actions"
              payload: { resource_area: "BIOLOGICAL", label: "Legacy grazing allotment", intensity_contribution: 20.0, footprint_hectares: 100.0, distance_km: 10.0, temporal_scope: "HISTORICAL" }
              as: ResourceSpecialist
          assert:
            - "HTTP status is 400 and data.error_id == ERR_INVALID_REQUEST"
            - "GET /proposed-actions/${act_id}/cumulative-actions returns total_count == 0"

      - name: corner_get_proposed_action_returns_stored_and_derived_fields
        claim_type: retrieval
        grounds: [endpoints.GET_proposed_actions_id, entities.ProposedAction]
        distinguishing_aspect: "A freshly classified action reads back with its stored inputs untouched and every rollup at its empty-set value: significant_issue_count 0, finalized_analysis_count 0, cumulative_intensity_index 0.00, record_entry_count 2."
        test_recipe:
          setup: ["The ERO-1 Ridgeline action has been screened CLEARED and classified."]
          setup_api_calls:
            - *k_office
            - *k_action
            - *k_screen1
            - *k_adj_cleared
            - *k_classify
          trigger:
            - call: "GET /proposed-actions/${act_id}"
              payload: {}
              as: NepaCoordinator
          assert:
            - "HTTP status is 200 and data.id == ${act_id}"
            - "data.disturbance_hectares == 40.0 and data.reference_cost_cents == 10000000 and data.in_critical_habitat == true"
            - "data.classification == ENVIRONMENTAL_ASSESSMENT and data.review_stage == CLASSIFIED"
            - "data.ec_screen_outcome == CLEARED and data.extraordinary_circumstance_flag == false"
            - "data.significant_issue_count == 0, data.unaddressed_issue_count == 0, data.alternatives_screened_in_count == 0"
            - "data.finalized_analysis_count == 0, data.max_unmitigated_score == 0.00, data.cumulative_intensity_index == 0.00"
            - "data.record_entry_count == 2 and data.record_certified_at == null"

      - name: corner_list_proposed_actions_filters_and_paginates
        claim_type: listing
        grounds: [endpoints.GET_proposed_actions, response_envelope.pagination_fields]
        distinguishing_aspect: "Two classified actions exist, one ENVIRONMENTAL_ASSESSMENT and one CATEGORICAL_EXCLUSION; the classification filter plus limit 1 must report total_count 1 and has_more false for the filtered set, not 2 and true for the whole table."
        test_recipe:
          setup: ["ReviewOffice ERO-1 has one CLASSIFIED ENVIRONMENTAL_ASSESSMENT action and one CLASSIFIED CATEGORICAL_EXCLUSION action."]
          setup_api_calls:
            - *k_office
            - *k_action
            - *k_screen1
            - *k_adj_cleared
            - *k_classify
            - &k_action_ce
              call: "POST /proposed-actions"
              payload: { office_id: "${off_id}", title: "Trailhead Vault Toilet Replacement", disturbance_hectares: 2.0, reference_cost_cents: 400000, in_critical_habitat: false, affects_historic_property: false, tribal_interest: false, floodplain_or_wetland: false }
              as: NepaCoordinator
              captures: { act_ce_id: $.data.id }
            - &k_screen_ce
              call: "POST /proposed-actions/${act_ce_id}/ec-screens"
              payload:
                findings:
                  - { code: "EC_HISTORIC", present: false, severity: 0, narrative: "None" }
                  - { code: "EC_ENDANGERED_SPECIES", present: false, severity: 0, narrative: "None" }
                  - { code: "EC_WETLAND", present: false, severity: 0, narrative: "None" }
              as: NepaCoordinator
              captures: { scr_ce_id: $.data.id }
            - &k_adj_ce
              call: "POST /ec-screens/${scr_ce_id}/adjudicate"
              payload: { disposition: "CLEARED", adjudicator_note: "Desktop review accepted" }
              as: ReviewingOfficial
            - &k_classify_ce
              call: "POST /proposed-actions/${act_ce_id}/classify"
              payload: {}
              as: NepaCoordinator
          trigger:
            - call: "GET /proposed-actions"
              payload: { classification: "ENVIRONMENTAL_ASSESSMENT", limit: 1, offset: 0 }
              as: NepaCoordinator
            - call: "GET /proposed-actions"
              payload: { office_id: "${off_id}", limit: 1, offset: 0 }
              as: NepaCoordinator
          assert:
            - "The filtered read returns response_type == array with exactly 1 element whose id == ${act_id}"
            - "The filtered read reports total_count == 1 and has_more == false"
            - "The office-scoped read reports total_count == 2 and has_more == true with 1 element returned"
            - "GET /proposed-actions/${act_ce_id} shows classification == CATEGORICAL_EXCLUSION"

      - name: corner_get_proposed_action_unknown_id_returns_not_found
        claim_type: not_found
        grounds: [validations.priority_4_path_existence, errors.ERR_NOT_FOUND]
        distinguishing_aspect: "A well-formed but unknown path id resolves at priority 4 to ERR_NOT_FOUND (404), ahead of any body-level reference check."
        test_recipe:
          setup: ["ReviewOffice ERO-1 exists; no ProposedAction exists."]
          setup_api_calls:
            - *k_office
          trigger:
            - call: "GET /proposed-actions/{id}"
              payload: {}
              as: NepaCoordinator
          assert:
            - "With a syntactically valid but unknown UUID in the path, HTTP status is 404 and data.error_id == ERR_NOT_FOUND"
            - "response_type == error and meta.api_request_id is present"

      - name: corner_create_alternative_with_unknown_action_id_returns_reference_not_found
        claim_type: parent_relationships
        grounds: [validations.priority_5_body_reference, errors.ERR_REFERENCE_NOT_FOUND]
        distinguishing_aspect: "A missing body foreign key is priority 5, a distinct error from the path-level miss: POST /alternatives with an unknown action_id must return ERR_REFERENCE_NOT_FOUND (404), not ERR_NOT_FOUND."
        test_recipe:
          setup: ["ReviewOffice ERO-1 exists; no ProposedAction exists."]
          setup_api_calls:
            - *k_office
          trigger:
            - call: "POST /alternatives"
              payload: { action_id: "${off_id}", label: "A - No Action", alternative_kind: "NO_ACTION", estimated_cost_cents: 0 }
              as: NepaCoordinator
          assert:
            - "HTTP status is 404 and data.error_id == ERR_REFERENCE_NOT_FOUND"
            - "The office id used as an action_id is not silently accepted; no Alternative row is created"

      - name: corner_admin_record_entry_is_immutable_and_versionless
        claim_type: immutability
        grounds: [entities.AdminRecordEntry, calculations.admin_record_sequence, endpoints.GET_proposed_actions_id_record_entries]
        distinguishing_aspect: "AdminRecordEntry declares common_fields false: rows carry only id and created_at, expose no version or updated_at, have no mutating endpoint, and their sequence_no values are contiguous from 1 in append order."
        test_recipe:
          setup: ["The ERO-1 Ridgeline action has been screened CLEARED and classified, producing two record entries."]
          setup_api_calls:
            - *k_office
            - *k_action
            - *k_screen1
            - *k_adj_cleared
            - *k_classify
          trigger:
            - call: "GET /proposed-actions/${act_id}/record-entries"
              payload: {}
              as: ReviewingOfficial
          assert:
            - "response_type == array with total_count == 2"
            - "data[0].sequence_no == 1 and data[0].entry_code == EC_SCREEN_ADJUDICATED"
            - "data[1].sequence_no == 2 and data[1].entry_code == CLASSIFICATION_ASSIGNED"
            - "Each element exposes id, created_at, occurred_at, actor_role, actor_user_id, summary, related_entity_type, related_entity_ref and no version or updated_at field"
            - "No endpoint in the §1.5 surface updates or deletes an AdminRecordEntry"

      - name: corner_resource_analysis_computed_scores_are_null_until_finalized
        claim_type: computed_fields
        grounds:
          - entities.ResourceAnalysis.fields.significance_score
          - entities.ResourceAnalysis.fields.variant_applied
          - endpoints.POST_proposed_actions_id_resource_analyses
        distinguishing_aspect: "On creation a ResourceAnalysis is DRAFT with significance_score, significance_determination and variant_applied all null; the client cannot seed them because they are not in the endpoint's input list."
        test_recipe:
          setup: ["The ERO-1 Ridgeline action is at review_stage ANALYSIS with an ADOPTED purpose and need statement and a CLOSED scoping period."]
          setup_api_calls:
            - *k_office
            - *k_action
            - *k_screen1
            - *k_adj_cleared
            - *k_classify
            - &k_pn1
              call: "POST /proposed-actions/${act_id}/purpose-need-statements"
              payload: { purpose_text: "Reduce hazardous fuel loading on the Ridgeline unit", need_text: "Modelled fire behaviour exceeds the wildland-urban interface standard", goal_codes: ["ACCESS", "SAFETY", "HABITAT", "COST"], constraint_codes: ["NO_NEW_ROADS"] }
              as: NepaCoordinator
              captures: { pn1_id: $.data.id }
            - &k_scope1
              call: "POST /proposed-actions/${act_id}/scoping-periods"
              payload: { scoping_kind: "PUBLIC", start_at: "2026-08-03T00:00:00Z", end_at: "2026-09-02T00:00:00Z" }
              as: NepaCoordinator
              captures: { sp1_id: $.data.id }
            - &k_get_act_v
              call: "GET /proposed-actions/${act_id}"
              payload: {}
              as: NepaCoordinator
              captures: { act_v: $.data.version }
            - &k_adopt
              call: "POST /purpose-need-statements/${pn1_id}/adopt"
              payload: { expected_action_version: "${act_v}" }
              as: ReviewingOfficial
            - &k_close_scope
              call: "POST /scoping-periods/${sp1_id}/close"
              payload: {}
              as: NepaCoordinator
          trigger:
            - &k_ra_bio
              call: "POST /proposed-actions/${act_id}/resource-analyses"
              payload: { resource_area: "BIOLOGICAL", intensity_score: 72.0, context_sensitivity_score: 55.0, affected_area_hectares: 4.0, mitigation_reduction_points: 12.0 }
              as: ResourceSpecialist
              captures: { ra_bio_id: $.data.id }
          assert:
            - "HTTP status is 201 and data.status == DRAFT"
            - "data.significance_score == null, data.significance_determination == null, data.variant_applied == null"
            - "data.intensity_score == 72.0, data.context_sensitivity_score == 55.0, data.mitigation_reduction_points == 12.0"
            - "data.version == 1 and ProposedAction.${act_id}.finalized_analysis_count == 0"

  - section: state_machines
    instances:
      - name: corner_adopting_second_purpose_need_supersedes_first_and_stales_alternatives
        claim_type: side_effect_execution
        grounds:
          - state_machines.PurposeNeedStatement.DRAFT_to_ADOPTED
          - state_machines.PurposeNeedStatement.ADOPTED_to_SUPERSEDED
          - state_machines.Alternative.SCREENED_IN_to_STALE
          - state_machines.Alternative.PROPOSED_to_STALE
        distinguishing_aspect: "Adopting a second statement must fire three side effects at once: the first statement becomes SUPERSEDED, every Alternative pinned to it becomes STALE, and alternatives_screened_in_count drops from 2 to 0 — the alternatives range is genuinely re-constrained, not merely re-labelled."
        test_recipe:
          setup:
            - "The ERO-1 Ridgeline action is CLASSIFIED as ENVIRONMENTAL_ASSESSMENT with statement v1 ADOPTED."
            - "Alternative A (NO_ACTION) and Alternative B (PROPOSED_ACTION, feasibility 76.75) are both SCREENED_IN against statement v1, so alternatives_screened_in_count is 2."
          setup_api_calls:
            - *k_office
            - *k_action
            - *k_screen1
            - *k_adj_cleared
            - *k_classify
            - *k_pn1
            - *k_scope1
            - *k_get_act_v
            - *k_adopt
            - &k_alt_a
              call: "POST /alternatives"
              payload: { action_id: "${act_id}", label: "A - No Action", alternative_kind: "NO_ACTION", goal_alignment_codes: [], estimated_cost_cents: 0 }
              as: NepaCoordinator
              captures: { altA_id: $.data.id }
            - &k_alt_b
              call: "POST /alternatives"
              payload: { action_id: "${act_id}", label: "B - Proposed Treatment", alternative_kind: "PROPOSED_ACTION", goal_alignment_codes: ["ACCESS", "SAFETY", "HABITAT"], estimated_cost_cents: 12000000 }
              as: NepaCoordinator
              captures: { altB_id: $.data.id }
            - &k_screen_alt_a
              call: "POST /alternatives/${altA_id}/screen"
              payload: { decision: "SCREENED_IN" }
              as: ReviewingOfficial
            - &k_screen_alt_b
              call: "POST /alternatives/${altB_id}/screen"
              payload: { decision: "SCREENED_IN" }
              as: ReviewingOfficial
            - call: "POST /proposed-actions/${act_id}/purpose-need-statements"
              payload: { purpose_text: "Reduce hazardous fuel loading and restore aspen on the Ridgeline unit", need_text: "Fire behaviour and aspen decline both exceed thresholds", goal_codes: ["ACCESS", "SAFETY", "HABITAT", "COST", "ASPEN"] }
              as: NepaCoordinator
              captures: { pn2_id: $.data.id }
            - call: "GET /proposed-actions/${act_id}"
              payload: {}
              as: NepaCoordinator
              captures: { act_v2: $.data.version }
          trigger:
            - call: "POST /purpose-need-statements/${pn2_id}/adopt"
              payload: { expected_action_version: "${act_v2}" }
              as: ReviewingOfficial
          assert:
            - "PurposeNeedStatement.${pn2_id}.status == ADOPTED and version_no == 2"
            - "PurposeNeedStatement.${pn1_id}.status == SUPERSEDED"
            - "Alternative.${altA_id}.screening_status == STALE and Alternative.${altB_id}.screening_status == STALE"
            - "ProposedAction.${act_id}.alternatives_screened_in_count == 0"
            - "Alternative.${altB_id}.feasibility_score is still 76.75 — the score is pinned at creation and is not recomputed against the new goal_codes"
            - "GET /proposed-actions/${act_id}/record-entries includes a PN_ADOPTED entry for each adoption"

      - name: corner_close_scoping_period_without_adopted_purpose_need_is_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ProposedAction.SCOPING_to_ANALYSIS
          - errors.ERR_NO_ADOPTED_PURPOSE_NEED
        distinguishing_aspect: "The scoping period itself satisfies every one of its own preconditions (OPEN, 30 days long) yet the close is refused with ERR_NO_ADOPTED_PURPOSE_NEED because the action has only a DRAFT statement."
        test_recipe:
          setup:
            - "The ERO-1 Ridgeline action is CLASSIFIED with a DRAFT purpose and need statement that was never adopted."
            - "A PUBLIC ScopingPeriod covers [2026-08-03, 2026-09-02) with duration_days 30 and status OPEN."
          setup_api_calls:
            - *k_office
            - *k_action
            - *k_screen1
            - *k_adj_cleared
            - *k_classify
            - *k_pn1
            - *k_scope1
          trigger:
            - call: "POST /scoping-periods/${sp1_id}/close"
              payload: {}
              as: NepaCoordinator
          assert:
            - "HTTP status is 409 and data.error_id == ERR_NO_ADOPTED_PURPOSE_NEED"
            - "ScopingPeriod.${sp1_id}.status == OPEN and duration_days == 30"
            - "ProposedAction.${act_id}.review_stage == SCOPING and record_entry_count == 2"

      - name: corner_close_public_scoping_period_shorter_than_minimum_is_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ScopingPeriod.OPEN_to_CLOSED
          - calculations.interval_duration_days
          - errors.ERR_SCOPING_PERIOD_TOO_SHORT
        distinguishing_aspect: "A PUBLIC period of 29 whole days is one day under min_scoping_days 30 and must be refused with ERR_SCOPING_PERIOD_TOO_SHORT, while an AGENCY period of the same length is exempt and closes."
        test_recipe:
          setup:
            - "The ERO-1 Ridgeline action is CLASSIFIED with an ADOPTED purpose and need statement."
            - "A PUBLIC ScopingPeriod covers [2026-08-03, 2026-09-01) (29 days) and an AGENCY ScopingPeriod covers [2026-09-05, 2026-10-04) (29 days)."
          setup_api_calls:
            - *k_office
            - *k_action
            - *k_screen1
            - *k_adj_cleared
            - *k_classify
            - *k_pn1
            - call: "POST /proposed-actions/${act_id}/scoping-periods"
              payload: { scoping_kind: "PUBLIC", start_at: "2026-08-03T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }
              as: NepaCoordinator
              captures: { sp_short_id: $.data.id }
            - call: "POST /proposed-actions/${act_id}/scoping-periods"
              payload: { scoping_kind: "AGENCY", start_at: "2026-09-05T00:00:00Z", end_at: "2026-10-04T00:00:00Z" }
              as: NepaCoordinator
              captures: { sp_agency_id: $.data.id }
            - *k_get_act_v
            - *k_adopt
          trigger:
            - call: "POST /scoping-periods/${sp_short_id}/close"
              payload: {}
              as: NepaCoordinator
            - call: "POST /scoping-periods/${sp_agency_id}/close"
              payload: {}
              as: NepaCoordinator
          assert:
            - "ScopingPeriod.${sp_short_id}.duration_days == 29 and its close returns 409 with data.error_id == ERR_SCOPING_PERIOD_TOO_SHORT"
            - "ScopingPeriod.${sp_short_id}.status is still OPEN"
            - "ScopingPeriod.${sp_agency_id}.duration_days == 29 and its close returns 200 with status == CLOSED (AGENCY periods are exempt)"
            - "ProposedAction.${act_id}.review_stage is still SCOPING because a PUBLIC period remains OPEN"

      - name: corner_new_document_starts_draft_with_comment_axis_not_open
        claim_type: initial_state
        grounds:
          - state_machines.NepaDocument
          - entities.NepaDocument.fields.publication_status
          - entities.NepaDocument.fields.comment_status
        distinguishing_aspect: "A newly drafted NepaDocument occupies the product initial state DRAFT x NOT_OPEN with every comment counter at its empty value and no comment window fields set."
        test_recipe:
          setup:
            - "The ERO-1 Ridgeline action is at review_stage ANALYSIS: statement ADOPTED, scoping CLOSED, Alternatives A and B SCREENED_IN, and the required ESA_SECTION_7 consultation CONCURRED."
          setup_api_calls:
            - *k_office
            - *k_action
            - *k_screen1
            - *k_adj_cleared
            - *k_classify
            - *k_pn1
            - *k_scope1
            - *k_get_act_v
            - *k_adopt
            - *k_alt_a
            - *k_alt_b
            - *k_screen_alt_a
            - *k_screen_alt_b
            - &k_agency_fws
              call: "POST /agencies"
