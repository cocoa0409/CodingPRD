        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[cert-create-stale-case]
          - concurrency_rules[extension-request-create-stale-case]
          - concurrency_rules[transition-plan-create-stale-case]
          - errors[ERR_STALE_CASE_VERSION]
        distinguishing_aspect: |
          Every declared concurrency rule is exercised on its own write endpoint with the same
          occ_field: a version captured before an intervening write gives ERR_STALE_CASE_VERSION 412
          on POST /hhi/certifications, POST /hhi/extension-requests and POST /hhi/transition-plans,
          the re-read version then succeeds, and the case version increments by exactly one on every
          successful write in the chain.
