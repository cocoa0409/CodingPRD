              as: ChainAdmin
              captures: { cod_id: $.data.id }
            - call: "POST /seafood-ops/species"
              payload: { market_name: "Pacific Cod", scientific_name: "Gadus macrocephalus", acceptable_market_names: ["Pacific Cod", "True Cod"], simp_covered: false, high_risk_substitution: false, sustainability_program_eligible: false }
              as: ChainAdmin
              captures: { pacific_id: $.data.id }
            - call: "POST /seafood-ops/lots"
              payload: { counter_id: "${counter_id}", supplier_id: "${supplier_id}", species_id: "${cod_id}", lot_code: "COD-0801-S", harvest_method: "WILD_LONGLINE", production_method: "WILD", origin_country_code: "US", previously_frozen: false, fresh_claim: true, received_weight_kg: 10.000, unit_cost_cents_per_kg: 1600, retail_price_cents_per_kg: 2300, cooked_retail_price_cents_per_kg: 2600 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { lot_id: $.data.id }
            - call: "POST /seafood-ops/lots/${lot_id}/case"
              payload: { case_slot: 1 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
            - call: "POST /seafood-ops/verification-samples"
              payload: { lot_id: "${lot_id}", sampled_weight_g: 150 }
              as: ComplianceOfficer
              as_user_id: "officer-sampling-1"
              captures: { sample_id: $.data.id }
            - call: "POST /seafood-ops/verification-samples/${sample_id}/send-to-lab"
              payload: { lab_reference: "LAB-2026-0801-2" }
              as: ComplianceOfficer
              as_user_id: "officer-sampling-1"
            - call: "POST /seafood-ops/verification-samples/${sample_id}/result"
              payload: { observed_species_id: "${pacific_id}" }
              as: ComplianceOfficer
              as_user_id: "officer-sampling-1"
          trigger:
            - call: "POST /seafood-ops/lots/${lot_id}/settle-chargeback"
              payload: { payment_amount_cents: 40000 }
              as: SupplierRep
              as_user_id: "${supplier_id}"
              captures: { e_amount: $.data.error_id }
            - call: "POST /seafood-ops/lots/${lot_id}/settle-chargeback"
              payload: { payment_amount_cents: 47840 }
              as: SupplierRep
              as_user_id: "${supplier_id}"
          assert:
            - "SupplierLot.${lot_id}.chargeback_assessed_cents == 47840"
            - "trigger call 1 returns HTTP 422 with ${e_amount} == ERR_SETTLEMENT_AMOUNT_MISMATCH"
            - "after trigger call 1: SupplierLot.${lot_id}.chargeback_status == ASSESSED and Supplier.${supplier_id}.chargeback_outstanding_cents == 47840 and chargeback_settled_cents == 0"
            - "trigger call 2 returns HTTP 200 with SupplierLot.${lot_id}.chargeback_status == SETTLED"
            - "Supplier.${supplier_id}.chargeback_assessed_total_cents == 47840 and chargeback_settled_cents == 47840 and chargeback_outstanding_cents == 0 and chargeback_reversed_cents == 0"

      - name: lot_receipt_blocked_while_the_supplier_is_on_credit_hold
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=55]
          - errors.ERR_SUPPLIER_CREDIT_HOLD
          - entities.Supplier.fields.chargeback_outstanding_cents
          - state_machines.SupplierLot.chargeback_status.ASSESSED_to_REVERSED
        distinguishing_aspect: |
          The gate reads a SIBLING aggregate on the Supplier, not anything about the incoming
          lot, and it answers 402 rather than 409 or 422. It is tested at a second counter
          because the counter that raised the substitution violation is itself RESTRICTED, and
          ERR_COUNTER_RESTRICTED at priority 35 would mask the fiscal rule at priority 55.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T08:00:00Z"
            - "Counter A (store 4120) and Counter B (store 4130), both served by the same Supplier"
            - "Atlantic Cod SupplierLot of 40.000 kg at retail 3000 cents/kg cased at Counter A"
            - "one MISMATCH VerificationSample, so 25000 + 120000 + 4000 = 149000 pre-credit lands in tier 3 at rate 0.00 and the chargeback is 149000, well over the 75000 hold threshold"
          setup_api_calls:
            - call: "POST /seafood-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:00:00Z" }
              as: ChainAdmin
            - call: "POST /seafood-ops/counters"
              payload: { store_number: "4120", department_name: "Seafood Service Counter", case_slot_count: 6 }
              as: ChainAdmin
              captures: { counter_a: $.data.id }
            - call: "POST /seafood-ops/counters"
              payload: { store_number: "4130", department_name: "Seafood Service Counter", case_slot_count: 4 }
              as: ChainAdmin
              captures: { counter_b: $.data.id }
            - call: "POST /seafood-ops/suppliers"
              payload: { name: "Gulf Bay Dealers", permit_number: "PERMIT-8801" }
              as: ChainAdmin
              captures: { supplier_id: $.data.id }
            - call: "POST /seafood-ops/species"
              payload: { market_name: "Atlantic Cod", scientific_name: "Gadus morhua", acceptable_market_names: ["Atlantic Cod", "Cod"], simp_covered: false, high_risk_substitution: false, sustainability_program_eligible: true }
              as: ChainAdmin
              captures: { cod_id: $.data.id }
            - call: "POST /seafood-ops/species"
              payload: { market_name: "Pacific Cod", scientific_name: "Gadus macrocephalus", acceptable_market_names: ["Pacific Cod", "True Cod"], simp_covered: false, high_risk_substitution: false, sustainability_program_eligible: false }
              as: ChainAdmin
              captures: { pacific_id: $.data.id }
            - call: "POST /seafood-ops/lots"
              payload: { counter_id: "${counter_a}", supplier_id: "${supplier_id}", species_id: "${cod_id}", lot_code: "COD-0801-H", harvest_method: "WILD_LONGLINE", production_method: "WILD", origin_country_code: "US", previously_frozen: false, fresh_claim: true, received_weight_kg: 40.000, unit_cost_cents_per_kg: 2000, retail_price_cents_per_kg: 3000, cooked_retail_price_cents_per_kg: 3400 }
              as: SeafoodManager
              as_user_id: "${counter_a}"
              captures: { lot_id: $.data.id }
            - call: "POST /seafood-ops/lots/${lot_id}/case"
              payload: { case_slot: 1 }
              as: SeafoodManager
              as_user_id: "${counter_a}"
            - call: "POST /seafood-ops/verification-samples"
              payload: { lot_id: "${lot_id}", sampled_weight_g: 150 }
              as: ComplianceOfficer
              as_user_id: "officer-sampling-1"
              captures: { sample_id: $.data.id }
            - call: "POST /seafood-ops/verification-samples/${sample_id}/send-to-lab"
              payload: { lab_reference: "LAB-2026-0801-3" }
              as: ComplianceOfficer
              as_user_id: "officer-sampling-1"
            - call: "POST /seafood-ops/verification-samples/${sample_id}/result"
              payload: { observed_species_id: "${pacific_id}" }
              as: ComplianceOfficer
              as_user_id: "officer-sampling-1"
          trigger:
            - call: "POST /seafood-ops/lots"
              payload: { counter_id: "${counter_b}", supplier_id: "${supplier_id}", species_id: "${cod_id}", lot_code: "COD-0801-J", harvest_method: "WILD_LONGLINE", production_method: "WILD", origin_country_code: "US", previously_frozen: false, fresh_claim: true, received_weight_kg: 8.000, unit_cost_cents_per_kg: 2000, retail_price_cents_per_kg: 3000, cooked_retail_price_cents_per_kg: 3400 }
              as: SeafoodManager
              as_user_id: "${counter_b}"
              captures: { e_hold: $.data.error_id }
            - call: "POST /seafood-ops/lots/${lot_id}/reverse-chargeback"
              payload: { reversal_note: "lab retest cleared the supplier" }
              as: ComplianceOfficer
              as_user_id: "officer-ledger-4"
            - call: "POST /seafood-ops/lots"
              payload: { counter_id: "${counter_b}", supplier_id: "${supplier_id}", species_id: "${cod_id}", lot_code: "COD-0801-J", harvest_method: "WILD_LONGLINE", production_method: "WILD", origin_country_code: "US", previously_frozen: false, fresh_claim: true, received_weight_kg: 8.000, unit_cost_cents_per_kg: 2000, retail_price_cents_per_kg: 3000, cooked_retail_price_cents_per_kg: 3400 }
              as: SeafoodManager
              as_user_id: "${counter_b}"
              captures: { ok_lot: $.data.id }
          assert:
            - "SupplierLot.${lot_id}.chargeback_assessed_cents == 149000 and Supplier.${supplier_id}.chargeback_outstanding_cents == 149000"
            - "trigger call 1 returns HTTP 402 with ${e_hold} == ERR_SUPPLIER_CREDIT_HOLD"
            - "Counter.${counter_b}.posture == OPEN, so the refusal is fiscal and not postural"
            - "trigger call 2 returns HTTP 200 with SupplierLot.${lot_id}.chargeback_status == REVERSED"
            - "Supplier.${supplier_id}.chargeback_outstanding_cents == 0 and chargeback_reversed_cents == 149000 and chargeback_assessed_total_cents == 149000"
            - "trigger call 3 returns HTTP 201 with SupplierLot.${ok_lot}.counter_id == ${counter_b} and intake_status == RECEIVED"

      - name: settlement_state_check_outranks_the_amount_check
        claim_type: priority_ordering
        grounds:
          - validations[priority=24]
          - validations[priority=54]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / settle_chargeback_state_beats_fiscal_amount_mismatch
          rationale: "The named §1.8 instance violates both rules in one call and asserts that ERR_CHARGEBACK_STATE_INVALID is returned rather than ERR_SETTLEMENT_AMOUNT_MISMATCH."

      - name: open_excursion_safety_check_outranks_the_certification_check
        claim_type: priority_ordering
        grounds:
          - validations[priority=36]
