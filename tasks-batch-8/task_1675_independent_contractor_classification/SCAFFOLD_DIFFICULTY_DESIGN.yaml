          setup:
            - "HIGH-tier engagement (US-CA ABC, CONTROL_METHOD=YES => EMPLOYEE_RISK) fully approved by 3 distinct approvers behind an ACTIVE ExceptionGrant; contractor VERIFIED; contract EXECUTED; one PROPOSED amendment referencing the exception"
