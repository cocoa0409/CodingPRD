  # =======================================================================
  # Rule 6 — boundary-precision checks on different metrics / endpoints
  # =======================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: weight_exactly_on_band_boundary_resolves_upward
        grounds:
          - calculations.stage_from_weight
          - entities.Child.fields.weight_grams
          - entities.Child.fields.stage
        distinguishing_aspect: |
          METRIC 1 — a weight threshold reached through POST /children/{id}/weight-measurements:
          6399 g stays in S1 while 6400 g — exactly the S2 lower bound — resolves to S2, proving
          the band is [min inclusive, max exclusive).
        test_recipe:
          setup:
            - "One verified ACTIVE account with a child created at 5000 g, which places the child in S1 (band [4500, 6400))."
            - "The child has an ACTIVE subscription so AUTO resize events have a subscription to attach to."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Plan", default_pack_count: 2, promo_discount_pct: 0, allows_hypoallergenic: true }
              as: OpsAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /skus"
              payload: { code: "S1-STD-60", name: "Stage 1 Standard 60", stage: "S1", line: "STANDARD", pack_price_cents: 1200, pack_size_units: 60, allergen_tags: [], stock_packs: 50 }
              as: OpsAdmin
              captures: { sku_s1: $.data.id }
            - call: "POST /accounts"
              payload: { email: "band@example.com", full_name: "Band Household", payment_method_on_file: true }
              as: Anonymous
              captures: { acct_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /accounts/${acct_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "POST /children"
              payload: { account_id: "${acct_id}", name: "Rin", birth_date: "2026-01-01", weight_grams: 5000 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { child_id: $.data.id, stage_at_create: $.data.stage }
            - call: "POST /subscriptions"
              payload: { account_id: "${acct_id}", plan_id: "${plan_id}", child_id: "${child_id}", consumption_rate_per_day: 6, pack_count: 2 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: AccountHolder
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /children/${child_id}/weight-measurements"
              payload: { weight_grams: 6399 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { stage_below: $.data.stage }
            - call: "POST /children/${child_id}/weight-measurements"
              payload: { weight_grams: 6400 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { stage_at: $.data.stage }
          assert:
            - "${stage_at_create} == S1"
            - "${stage_below} == S1"
            - "${stage_at} == S2"
            - "Child.${child_id}.weight_grams == 6400"
            - "exactly 1 ResizeEvent row exists with subscription_id == ${sub_id} and origin == AUTO"

