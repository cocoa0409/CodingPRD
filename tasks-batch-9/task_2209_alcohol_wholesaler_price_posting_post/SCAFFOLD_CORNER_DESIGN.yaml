          trigger:
            - call: "POST /error-corrections/${corr1}/approve"
              as: ComplianceOfficer
          assert:
            - "HTTP status is 200 with data.status == \"APPROVED\" and data.approved_at == \"2026-08-05T00:00:00.000Z\"."
            - "GET /price-schedule-items/${itemA} shows case_price_cents == 114000, unit_price_cents == 10500, certified_case_price_cents == 120000 (the certified snapshot is untouched) and correction_count == 1."
            - "GET /price-schedules/${schedA} shows correction_count == 1."
            - "GET /quantity-discount-tiers/${tier1} shows status == \"ACTIVE\" and discounted_case_price_cents == 102600 (round_half_up(114000 * 0.90)), recomputed from the corrected price rather than left at 108000."
            - "GET /wholesalers/${whA} shows correction_penalty_accrued_cents == 0 and penalty_exposure_cents == 0 — the 100000 repeat-correction penalty is not due until the schedule's correction_count reaches 2."

      - name: dual_variant_penalty_exposure_diverges_between_assessed_and_provisional
