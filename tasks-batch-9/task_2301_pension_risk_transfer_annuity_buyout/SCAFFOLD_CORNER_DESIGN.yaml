            - "a plan authorized LUMP_SUM_ONLY at clock 2026-08-01T00:00:00Z with three CLEAN DEFERRED_VESTED participants: A stated 20000 (FAME 100000, 160 months), B stated 24000 (FAME 100000, 192 months), C stated 10000 (FAME 100000, 80 months)"
