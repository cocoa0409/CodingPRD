              as: PlatformAdmin
              captures: { branch_a_id: $.data.id }
            - call: "POST /parts"
              payload: { part_number: "W10-PUMP", oem_code: "WHIRLPOOL", description: "Drain pump assembly", category: "MECHANICAL", list_price_cents: 12999, weight_grams: 5200 }
              as: PricingAdmin
              captures: { part_p1_id: $.data.id }
            - call: "POST /servicer-accounts"
              payload: { business_name: "Tight Credit Repairs", oem_authorizations: ["WHIRLPOOL"], pricing_tier_id: "${tier_gold_id}", credit_terms: "NET_30", credit_limit_cents: 22000, core_liability_limit_cents: 5000000 }
              as: CreditManager
              captures: { acct_t_id: $.data.id }
            - call: "POST /inventory-records"
              payload: { branch_id: "${branch_a_id}", part_id: "${part_p1_id}", on_hand_units: 10, reorder_point: 2 }
              as: PlatformAdmin
              captures: { inv_a_p1_id: $.data.id }
            - call: "POST /part-orders"
              payload: { servicer_account_id: "${acct_t_id}", fulfillment_mode: "WILL_CALL", pickup_branch_id: "${branch_a_id}", purchase_order_ref: "PO-O1" }
              as: Servicer
              as_user_id: "${acct_t_id}"
