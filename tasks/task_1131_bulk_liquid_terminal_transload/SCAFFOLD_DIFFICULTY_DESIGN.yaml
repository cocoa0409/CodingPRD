            - { call: "POST /movements/${m_id}/gauge-tickets", payload: { ticket_type: "CLOSING", observed_volume_bbl: 100, observed_temp_f: 60, observed_at: "2026-05-11T07:30:00Z" }, as: Gauger, as_user_id: "gauger-1" }
