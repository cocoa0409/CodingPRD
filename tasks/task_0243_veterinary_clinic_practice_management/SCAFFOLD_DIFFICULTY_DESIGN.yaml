              as: Receptionist
              captures: { p1: $.data.id }
            - call: "POST /clinic/patients"
              payload: { household_id: "${hh}", name: "Q2", species: "DOG", weight_kg: 10 }
              as: Receptionist
              captures: { p2: $.data.id }
            - call: "POST /clinic/patients"
              payload: { household_id: "${hh}", name: "Q3", species: "DOG", weight_kg: 10 }
              as: Receptionist
              captures: { p3: $.data.id }
            - call: "POST /clinic/boarding-stays"
              payload: { patient_id: "${p1}", kennel_id: "${ken}", check_in_date: "2026-07-11T00:00:00Z", check_out_date: "2026-07-13T00:00:00Z", nightly_rate_cents: 5000 }
              as: Receptionist
              captures: { bs1: $.data.id }
            - call: "POST /clinic/boarding-stays"
              payload: { patient_id: "${p2}", kennel_id: "${ken}", check_in_date: "2026-07-12T00:00:00Z", check_out_date: "2026-07-14T00:00:00Z", nightly_rate_cents: 5000 }
              as: Receptionist
              captures: { bs2: $.data.id }
          trigger:
            - call: "POST /clinic/boarding-stays"
              payload: { patient_id: "${p3}", kennel_id: "${ken}", check_in_date: "2026-07-12T00:00:00Z", check_out_date: "2026-07-12T00:00:00Z", nightly_rate_cents: 5000 }
              as: Receptionist
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_KENNEL_AT_CAPACITY"
            - "http_status == 409"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: deposit_refund_conserves_household_credit
        grounds:
          - state_machines.Surgery.BOOKED_to_CANCELLED
          - entities.Household.fields.account_credit_cents
          - entities.Surgery.fields.deposit_consumed_cents
        distinguishing_aspect: |
          Conserved quantity = MONETARY credit. Invariant: Household.account_credit_cents AFTER
          (deposit post 30000 -> surgery booking commits 26000, credit 4000 -> surgery cancel
          refunds 26000) equals the credit as if the surgery had never been booked: 30000.
          Forward action (book = debit 26000) paired with compensating action (cancel = refund
          26000) nets to zero drift on account_credit_cents.
        test_recipe:
          setup:
            - "Household credit 30000 (posted deposit); a BOOKED surgery 10kg/60min total 26000 (deposit committed at booking, deposit_consumed 26000, credit 4000); then the BOOKED surgery is cancelled."
          setup_api_calls:
            - call: "POST /clinic/operatories"
              payload: { name: "OR-6", cleanup_buffer_minutes: 30 }
              as: PracticeManager
              captures: { or6: $.data.id }
            - call: "POST /clinic/households"
              payload: { account_name: "Knox" }
              as: Receptionist
              captures: { hh: $.data.id, hh_v0: $.data.version }
            - call: "POST /clinic/patients"
              payload: { household_id: "${hh}", name: "Tess", species: "DOG", weight_kg: 10 }
              as: Receptionist
              captures: { pat: $.data.id }
            - call: "POST /clinic/estimates"
              payload: { patient_id: "${pat}", line_items: [ { service_code: "SURG", qty: 1, unit_price_cents: 26000, eligible_for_plan_discount: false } ], deposit_required_cents: 30000 }
              as: Veterinarian
              captures: { est: $.data.id }
            - call: "POST /clinic/deposits"
              payload: { household_id: "${hh}", amount_cents: 30000, estimate_id: "${est}", expected_household_version: "${hh_v0}" }
              as: Receptionist
              captures: { hh_v1: $.data.version }
            - call: "POST /clinic/estimates/${est}/transition"
              payload: { action: "present" }
              as: Veterinarian
            - call: "POST /clinic/estimates/${est}/transition"
              payload: { action: "approve" }
              as: Receptionist
            - call: "POST /clinic/appointments"
              payload: { patient_id: "${pat}", scheduled_start: "2026-07-09T09:00:00Z", scheduled_end: "2026-07-09T11:00:00Z", visit_reason: "Surgery" }
              as: Receptionist
              captures: { appt: $.data.id }
            - call: "POST /clinic/appointments/${appt}/transition"
              payload: { action: "check-in" }
              as: Receptionist
            - call: "POST /clinic/appointments/${appt}/transition"
              payload: { action: "begin-exam" }
              as: Veterinarian
            - call: "POST /clinic/surgeries"
              payload: { appointment_id: "${appt}", operatory_id: "${or6}", estimate_id: "${est}", procedure_name: "Neuter", window_start: "2026-07-09T09:00:00Z", window_end: "2026-07-09T10:00:00Z" }
              as: Veterinarian
              captures: { sg: $.data.id }
          trigger:
            - call: "POST /clinic/surgeries/${sg}/transition"
              payload: { action: "cancel" }
              as: Veterinarian
              captures: { st: $.data.status }
          assert:
            - "Surgery.${sg}.status == CANCELLED"
            - "Household.${hh}.account_credit_cents == 30000"
            - "Surgery.${sg}.deposit_consumed_cents == 0"

      - name: refill_void_conserves_authorized_refill_count
        grounds:
          - state_machines.Patient.ACTIVE_to_DECEASED
          - entities.Prescription.fields.refills_used
          - entities.Prescription.fields.refills_authorized
        distinguishing_aspect: |
          Conserved quantity = DISCRETE refill count (a non-monetary type, distinct from the
          monetary invariant above). Invariant: after dispensing 2 of 3 refills then voiding
          the prescription via patient-deceased cascade, refills_used returns to 0 and
          refills_remaining == refills_authorized (3), so the authorized-count budget is
          conserved with zero drift.
        test_recipe:
          setup:
            - "A controlled prescription with refills_authorized 3, 2 refills already dispensed (refills_used 2)."
          setup_api_calls:
            - call: "POST /clinic/households"
              payload: { account_name: "Lowe" }
              as: Receptionist
              captures: { hh: $.data.id }
            - call: "POST /clinic/patients"
              payload: { household_id: "${hh}", name: "Max", species: "DOG", weight_kg: 25 }
              as: Receptionist
              captures: { pat: $.data.id }
            - call: "POST /clinic/prescriptions"
              payload: { patient_id: "${pat}", drug_name: "Tramadol", refills_authorized: 3, is_controlled: false }
              as: Veterinarian
              captures: { rx: $.data.id }
            - call: "POST /clinic/prescriptions/${rx}/refill"
              payload: {}
              as: Veterinarian
            - call: "POST /clinic/prescriptions/${rx}/refill"
              payload: {}
              as: Veterinarian
          trigger:
            - call: "POST /clinic/patients/${pat}/mark-deceased"
              payload: {}
              as: Veterinarian
              captures: { st: $.data.status }
          assert:
            - "Prescription.${rx}.status == VOIDED"
            - "Prescription.${rx}.refills_used == 0"
            - "Prescription.${rx}.refills_authorized == 3"
