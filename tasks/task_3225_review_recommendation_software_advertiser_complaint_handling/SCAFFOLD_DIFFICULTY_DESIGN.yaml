  - rule_id: resource_temporal_overlap
    instances:
      - name: consumer_alert_cooldown_overlap
        grounds:
          - entities.ConsumerAlert.fields.review_cooldown_until
          - validations[priority=8]
          - state_machines.SolicitationCase.INVESTIGATING_to_CONFIRMED
        distinguishing_aspect: |
          Interval semantics (a): point-in-interval membership with an open right
          edge — a page under an ACTIVE alert rejects every new review whose
          submission time is strictly before review_cooldown_until (now <
          cooldown_until), while a submission exactly at or after
          cooldown_until is admitted; the resource is the page's review intake
          and the interval is [placed_at, placed_at + 30d).
        test_recipe:
          setup:
            - "Clock 2026-09-01; page P1 ACTIVE; author UA review R1 FILTERED; reporter UR case SC1 CONFIRMED -> auto alert with cooldown_until = 2026-10-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /platform/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /platform/users"
              payload: { email: "ca@x.com", display_name: "Cool Author", home_region: "US-CA" }
