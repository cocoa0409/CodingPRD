      - name: late_filing_fee_crosses_from_tier_one_into_tier_two
        claim_type: tiered_pricing
        grounds:
          - calculations.transaction_filing_late_fee
          - "state_machines.TransactionReport[PENDING -> FILED]"
        distinguishing_aspect: "A report filed six days past its deadline is priced across two tiers — 5000 * 2 + 15000 * 4 == 70000 — while a second report filed on the day it is created is priced at 0, proving the marginal (not flat) tier structure and the is_late flag boundary."
        test_recipe:
          setup:
            - "The logical clock starts at 2026-04-01T00:00:00Z."
            - "A HIGH_A affiliate with an ACTIVE agreement (minimum_active_players 0) and two cleared players."
            - "Assignment 1 has effective_date 2026-04-01, so its report's filing_deadline is 2026-04-03 (FILING_WINDOW_DAYS 2). Filing at clock 2026-04-09 gives days_late 6."
            - "Author-computed: 5000 * min(6, 2) + 15000 * clamp(6 - 2, 0, 5) + 30000 * max(0, 6 - 7) = 10000 + 60000 + 0 = 70000."
            - "Assignment 2 is created at clock 2026-04-09 with effective_date 2026-04-09, deadline 2026-04-11, filed immediately: days_late 0, fee 0."
