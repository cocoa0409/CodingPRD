            - { call: "POST /api/label-versions/${lv}/submit-review", as: LabelAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /api/label-versions/${lv}/claims", payload: { claim_type: "LOW_FAT" }, as: LabelAnalyst, as_user_id: "analyst-1" }
          trigger:
