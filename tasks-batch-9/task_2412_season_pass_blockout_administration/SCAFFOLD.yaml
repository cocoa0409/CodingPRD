  - { error_id: ERR_TIER_NOT_PUBLISHED,            http_status: 409, category: state,       message: "Pass tier is not in a publishable/published state for this operation" }
  - { error_id: ERR_PASS_ALREADY_PROCESSED,        http_status: 409, category: state,       message: "Season pass has already been processed" }
  - { error_id: ERR_PASS_NOT_ACTIVE,               http_status: 409, category: state,       message: "Season pass is not active" }
  - { error_id: ERR_PASS_NOT_SUSPENDED,            http_status: 409, category: state,       message: "Season pass is not suspended" }
  - { error_id: ERR_PASS_BILLING_NOT_CURRENT,      http_status: 409, category: state,       message: "Season pass billing is delinquent or defaulted" }
