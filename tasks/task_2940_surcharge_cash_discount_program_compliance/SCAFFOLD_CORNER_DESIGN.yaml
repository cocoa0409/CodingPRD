          rationale: "The §1.8 instance files an over-cap rate rule on a WITHDRAWN program and asserts ERR_INVALID_PROGRAM_STATE at 409, then repairs each violation in turn to expose ERR_SURCHARGE_CAP_EXCEEDED."
      - name: debit_surcharge_check_precedes_the_terminal_program_mismatch_check
        claim_type: priority_ordering
        grounds:
          - validations[priority=82]
          - validations[priority=86]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / transaction_debit_safety_beats_terminal_program_mismatch
          rationale: "The §1.8 instance books a DEBIT sale against the wrong program from an enforcing terminal and asserts ERR_DEBIT_SURCHARGE_FORBIDDEN wins over ERR_TERMINAL_PROGRAM_MISMATCH."
      - name: terminal_enforcement_depends_on_the_owning_program_state
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=99]
          - state_machines.Terminal.CONFIGURED_to_ENFORCING
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / terminal_enforcement_gated_on_owning_program_not_being_suspended
          rationale: "The §1.8 instance drives the program ACTIVE -> SUSPENDED -> ACTIVE and asserts ENFORCE is refused while suspended and accepted once resumed."
      - name: prohibition_cascade_applies_only_to_surcharge_programs
        claim_type: conditional_validation
        grounds:
          - validations[priority=80]
          - state_machines.SurchargeProgram.to_DISABLED
        excluded_because:
          difficulty_instance: transitive_cascade / law_change_prohibition_cascade_program_terminals_census
          rationale: "The §1.8 instance asserts the SURCHARGE program is DISABLED with its terminals quarantined while the CASH_DISCOUNT program in the same jurisdiction is untouched."

  - section: endpoints
    instances:
      - name: terminal_listing_composes_the_state_filter_with_pagination
        claim_type: standard_crud
        grounds:
          - endpoints[GET /terminals]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Three PROVISIONED terminals of one merchant read back through limit 2 give total_count 3 with has_more true on offset 0 and has_more false with a single row on offset 2, so total_count counts the filtered set rather than the page."
        test_recipe:
          setup:
            - "One AZ merchant with three terminals created but never configured; clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
