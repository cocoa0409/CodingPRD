# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over every testable claim SCAFFOLD.yaml sections 1.1-1.7 declare
# that SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Sections and
# claim_type values come from references/claim-extraction-guide.md.
# Opaque X-User-IDs follow the same vocabulary as the difficulty design.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: ward_creation_applies_declared_defaults_and_common_fields
        claim_type: defaults
        grounds:
          - entities.Ward.fields.temperature_probe_required
          - entities.Ward.fields.status
          - entities.Ward.fields.active_patient_census
          - endpoints[POST /nutrition/wards]
        distinguishing_aspect: "Creating a ward without temperature_probe_required yields true, status ACTIVE, active_patient_census 0, version 1 and a bare UUID id with no type prefix."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /nutrition/wards"
              payload: { name: "Ward 5 East", code: "W5E", tray_line_capacity_per_window: 20, delivery_lead_minutes: 20 }
              as: NutritionManager
              as_user_id: "u-mgr-1"
              captures: { w_id: $.data.id }
          assert:
            - "the response status is 201"
            - "Ward.${w_id}.temperature_probe_required == true"
            - "Ward.${w_id}.status == ACTIVE"
            - "Ward.${w_id}.active_patient_census == 0"
            - "Ward.${w_id}.version == 1"
            - "Ward.${w_id}.id matches the bare UUID form with no type prefix"
            - "the envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == \"object\""

      - name: ward_retrieval_by_id_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - endpoints[GET /nutrition/wards/{id}]
          - entities.Ward.fields.code
        distinguishing_aspect: "GET /nutrition/wards/{id} returns exactly the field values supplied at creation, including code W5E and tray_line_capacity_per_window 20."
        test_recipe:
          setup: ["One ward W5E exists."]
          setup_api_calls:
            - call: "POST /nutrition/wards"
              payload: { name: "Ward 5 East", code: "W5E", tray_line_capacity_per_window: 20, delivery_lead_minutes: 20 }
              as: NutritionManager
              as_user_id: "u-mgr-1"
              captures: { w_id: $.data.id }
          trigger:
            - call: "GET /nutrition/wards/${w_id}"
              payload: {}
              as: DietClerk
              as_user_id: "u-clerk-1"
          assert:
            - "the response status is 200 and response_type == \"object\""
            - "Ward.${w_id}.code == \"W5E\""
            - "Ward.${w_id}.tray_line_capacity_per_window == 20"
            - "Ward.${w_id}.delivery_lead_minutes == 20"

      - name: wards_listing_honours_limit_offset_and_reports_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /nutrition/wards]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With two wards stored, GET /nutrition/wards?limit=1&offset=0 returns one row, total_count 2 and has_more true; offset 1 returns one row with has_more false."
        test_recipe:
          setup: ["Two wards W5E and W6N exist."]
          setup_api_calls:
            - call: "POST /nutrition/wards"
              payload: { name: "Ward 5 East", code: "W5E", tray_line_capacity_per_window: 20, delivery_lead_minutes: 20 }
              as: NutritionManager
              as_user_id: "u-mgr-1"
            - call: "POST /nutrition/wards"
              payload: { name: "Ward 6 North", code: "W6N", tray_line_capacity_per_window: 16, delivery_lead_minutes: 25 }
              as: NutritionManager
              as_user_id: "u-mgr-1"
          trigger:
            - call: "GET /nutrition/wards"
              payload: { limit: 1, offset: 0 }
              as: NutritionManager
              as_user_id: "u-mgr-1"
            - call: "GET /nutrition/wards"
              payload: { limit: 1, offset: 1 }
              as: NutritionManager
              as_user_id: "u-mgr-1"
          assert:
            - "the first call returns response_type == \"array\" with exactly 1 element, total_count == 2 and has_more == true"
            - "the second call returns exactly 1 element, total_count == 2 and has_more == false"

      - name: ward_get_with_unknown_uuid_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_WARD_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "GET /nutrition/wards/{id} with a well-formed but unknown UUID answers 404 ERR_WARD_NOT_FOUND, not 400."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /nutrition/wards/11111111-2222-3333-4444-555555555555"
              payload: {}
              as: NutritionManager
              as_user_id: "u-mgr-1"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and data.error_id == \"ERR_WARD_NOT_FOUND\""

      - name: patient_creation_missing_required_mrn_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /nutrition/patients]
        distinguishing_aspect: "Omitting the required mrn field on POST /nutrition/patients answers 400 ERR_INVALID_REQUEST and persists no Patient."
        test_recipe:
          setup: ["One ward exists."]
          setup_api_calls:
            - call: "POST /nutrition/wards"
              payload: { name: "Ward 5 East", code: "W5E", tray_line_capacity_per_window: 20, delivery_lead_minutes: 20 }
              as: NutritionManager
              as_user_id: "u-mgr-1"
              captures: { w_id: $.data.id }
          trigger:
            - call: "POST /nutrition/patients"
              payload: { ward_id: "${w_id}", full_name: "Ada Kern", age_years: 71 }
              as: DietClerk
              as_user_id: "u-clerk-1"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /nutrition/patients?ward_id=${w_id} returns total_count == 0"

      - name: patient_creation_applies_texture_and_liquid_defaults
        claim_type: defaults
        grounds:
          - entities.Patient.fields.texture_level
          - entities.Patient.fields.liquid_level
          - entities.Patient.fields.npo_status
        distinguishing_aspect: "Omitting texture_level and liquid_level yields REGULAR and THIN, allergen_codes defaults to the empty list, status is ADMITTED and npo_status is NONE."
        test_recipe:
          setup: ["One ward exists."]
          setup_api_calls:
            - call: "POST /nutrition/wards"
              payload: { name: "Ward 5 East", code: "W5E", tray_line_capacity_per_window: 20, delivery_lead_minutes: 20 }
              as: NutritionManager
              as_user_id: "u-mgr-1"
              captures: { w_id: $.data.id }
          trigger:
            - call: "POST /nutrition/patients"
              payload: { ward_id: "${w_id}", mrn: "MRN-L001", full_name: "Lena Ruiz", age_years: 45 }
              as: DietClerk
              as_user_id: "u-clerk-1"
              captures: { p_id: $.data.id }
          assert:
            - "Patient.${p_id}.texture_level == REGULAR"
            - "Patient.${p_id}.liquid_level == THIN"
            - "Patient.${p_id}.allergen_codes == []"
            - "Patient.${p_id}.status == ADMITTED"
            - "Patient.${p_id}.npo_status == NONE"
            - "Patient.${p_id}.missed_meal_count == 0 and Patient.${p_id}.protein_deficit_g == 0 and Patient.${p_id}.daily_supplement_cost_cents == 0"
            - "Patient.${p_id}.satisfaction_score_avg == null and Patient.${p_id}.survey_count == 0"
            - "Ward.${w_id}.active_patient_census == 1"

      - name: menu_item_creation_with_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - validations[priority=4]
          - entities.MenuItem.fields.service_temp_class
        distinguishing_aspect: "service_temp_class LUKEWARM is not a declared enum member, so POST /nutrition/menu-items answers 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /nutrition/menu-items"
              payload: { item_code: "BAD-ONE", display_name: "Mystery Item", sodium_mg: 10, potassium_mg: 10, carb_g: 1.0, protein_g: 1.0, unit_cost_cents: 100, texture_level: "REGULAR", service_temp_class: "LUKEWARM" }
              as: NutritionManager
              as_user_id: "u-mgr-1"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /nutrition/menu-items returns total_count == 0"

      - name: ward_creation_with_duplicate_code_returns_conflict
        claim_type: type_constraints
        grounds:
          - validations[priority=36]
          - errors[ERR_DUPLICATE_WARD_CODE]
        distinguishing_aspect: "A second ward carrying code W5E answers 409 ERR_DUPLICATE_WARD_CODE and leaves exactly one ward stored."
        test_recipe:
          setup: ["Ward W5E already exists."]
          setup_api_calls:
            - call: "POST /nutrition/wards"
              payload: { name: "Ward 5 East", code: "W5E", tray_line_capacity_per_window: 20, delivery_lead_minutes: 20 }
              as: NutritionManager
              as_user_id: "u-mgr-1"
          trigger:
            - call: "POST /nutrition/wards"
              payload: { name: "Ward 5 East Annex", code: "W5E", tray_line_capacity_per_window: 8, delivery_lead_minutes: 15 }
              as: NutritionManager
              as_user_id: "u-mgr-1"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and data.error_id == \"ERR_DUPLICATE_WARD_CODE\""
            - "GET /nutrition/wards returns total_count == 1"

      - name: patient_creation_with_duplicate_mrn_returns_conflict
        claim_type: type_constraints
        grounds:
          - validations[priority=33]
          - errors[ERR_DUPLICATE_MRN]
        distinguishing_aspect: "MRN uniqueness is global, not ward-scoped: the same mrn on a second ward still answers 409 ERR_DUPLICATE_MRN."
        test_recipe:
          setup: ["Two wards exist and one patient with mrn MRN-M001 is admitted to the first."]
          setup_api_calls:
            - call: "POST /nutrition/wards"
              payload: { name: "Ward 5 East", code: "W5E", tray_line_capacity_per_window: 20, delivery_lead_minutes: 20 }
              as: NutritionManager
              as_user_id: "u-mgr-1"
              captures: { w1_id: $.data.id }
            - call: "POST /nutrition/wards"
              payload: { name: "Ward 6 North", code: "W6N", tray_line_capacity_per_window: 16, delivery_lead_minutes: 25 }
              as: NutritionManager
              as_user_id: "u-mgr-1"
              captures: { w2_id: $.data.id }
            - call: "POST /nutrition/patients"
              payload: { ward_id: "${w1_id}", mrn: "MRN-M001", full_name: "Mo Ali", age_years: 50 }
              as: DietClerk
              as_user_id: "u-clerk-1"
          trigger:
            - call: "POST /nutrition/patients"
              payload: { ward_id: "${w2_id}", mrn: "MRN-M001", full_name: "Mo Ali Duplicate", age_years: 50 }
              as: DietClerk
              as_user_id: "u-clerk-1"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and data.error_id == \"ERR_DUPLICATE_MRN\""
            - "GET /nutrition/patients?ward_id=${w2_id} returns total_count == 0"

      - name: patient_creation_with_unknown_ward_returns_ward_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=5]
          - errors[ERR_WARD_NOT_FOUND]
        distinguishing_aspect: "A body-supplied ward_id that resolves to nothing answers 404 ERR_WARD_NOT_FOUND, proving body-level FK existence is checked at priority 5."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /nutrition/patients"
              payload: { ward_id: "11111111-2222-3333-4444-555555555555", mrn: "MRN-N001", full_name: "Nia Blum", age_years: 33 }
              as: DietClerk
              as_user_id: "u-clerk-1"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and data.error_id == \"ERR_WARD_NOT_FOUND\""

      - name: patients_list_filtered_by_ward_id_excludes_other_wards
        claim_type: listing
        grounds:
          - endpoints[GET /nutrition/patients]
          - entities.Patient.fields.ward_id
        distinguishing_aspect: "GET /nutrition/patients?ward_id=<W6N> returns only the single W6N patient even though two patients exist overall."
        test_recipe:
          setup: ["Two wards each hold one admitted patient."]
          setup_api_calls:
            - call: "POST /nutrition/wards"
              payload: { name: "Ward 5 East", code: "W5E", tray_line_capacity_per_window: 20, delivery_lead_minutes: 20 }
              as: NutritionManager
              as_user_id: "u-mgr-1"
              captures: { w1_id: $.data.id }
            - call: "POST /nutrition/wards"
              payload: { name: "Ward 6 North", code: "W6N", tray_line_capacity_per_window: 16, delivery_lead_minutes: 25 }
              as: NutritionManager
              as_user_id: "u-mgr-1"
              captures: { w2_id: $.data.id }
            - call: "POST /nutrition/patients"
              payload: { ward_id: "${w1_id}", mrn: "MRN-O001", full_name: "Ola Berg", age_years: 61 }
              as: DietClerk
              as_user_id: "u-clerk-1"
            - call: "POST /nutrition/patients"
              payload: { ward_id: "${w2_id}", mrn: "MRN-O002", full_name: "Pia Nord", age_years: 39 }
              as: DietClerk
              as_user_id: "u-clerk-1"
              captures: { p2_id: $.data.id }
          trigger:
            - call: "GET /nutrition/patients"
              payload: { ward_id: "${w2_id}" }
              as: DietClerk
              as_user_id: "u-clerk-1"
          assert:
            - "the response returns total_count == 1 and the single element id equals ${p2_id}"
            - "Ward.${w1_id}.active_patient_census == 1 and Ward.${w2_id}.active_patient_census == 1"

      - name: meal_order_line_from_another_tray_returns_line_not_found
        claim_type: parent_relationships
        grounds:
          - errors[ERR_MEAL_ORDER_LINE_NOT_FOUND]
          - endpoints[POST /nutrition/meal-orders/{id}/lines/{line_id}/substitute]
        distinguishing_aspect: "Substituting with a line_id that belongs to a different MealOrder answers 404 ERR_MEAL_ORDER_LINE_NOT_FOUND rather than mutating the wrong tray."
        test_recipe:
          setup:
            - "Two admitted patients each own a PENDING_VALIDATION tray of 1 x SID-RIC in the same PLANNED LUNCH period."
            - "The clock reads 2026-08-02T09:00:00Z."
          setup_api_calls:
            - call: "POST /nutrition/wards"
              payload: { name: "Ward 5 East", code: "W5E", tray_line_capacity_per_window: 20, delivery_lead_minutes: 20 }
              as: NutritionManager
              as_user_id: "u-mgr-1"
              captures: { w_id: $.data.id }
            - call: "POST /nutrition/diet-rules"
              payload: { diet_code: "REGULAR_STD", display_name: "Regular", precedence_rank: 90, requires_dietitian_cosign: true }
              as: Dietitian
              as_user_id: "u-rd-1"
              captures: { r_std_id: $.data.id }
            - call: "POST /nutrition/menu-items"
              payload: { item_code: "SID-RIC", display_name: "Steamed Rice", sodium_mg: 5, potassium_mg: 55, carb_g: 28.0, protein_g: 2.5, unit_cost_cents: 65, texture_level: "REGULAR", service_temp_class: "HOT" }
              as: NutritionManager
              as_user_id: "u-mgr-1"
              captures: { mi_ric_id: $.data.id }
            - call: "POST /nutrition/menu-items"
              payload: { item_code: "ENT-CHK", display_name: "Roast Chicken", sodium_mg: 480, potassium_mg: 320, carb_g: 12.0, protein_g: 28.0, unit_cost_cents: 340, texture_level: "REGULAR", service_temp_class: "HOT" }
              as: NutritionManager
              as_user_id: "u-mgr-1"
              captures: { mi_chk_id: $.data.id }
            - call: "POST /nutrition/patients"
              payload: { ward_id: "${w_id}", mrn: "MRN-Q001", full_name: "Quin Roe", age_years: 52 }
              as: DietClerk
              as_user_id: "u-clerk-1"
              captures: { p1_id: $.data.id }
            - call: "POST /nutrition/patients"
              payload: { ward_id: "${w_id}", mrn: "MRN-Q002", full_name: "Rae Lund", age_years: 48 }
              as: DietClerk
              as_user_id: "u-clerk-1"
              captures: { p2_id: $.data.id }
            - call: "POST /nutrition/diet-orders"
              payload: { patient_id: "${p1_id}", primary_diet_rule_id: "${r_std_id}" }
              as: Physician
              as_user_id: "u-phys-1"
              captures: { do1_id: $.data.id }
            - call: "POST /nutrition/diet-orders/${do1_id}/submit"
              payload: {}
              as: Physician
              as_user_id: "u-phys-1"
            - call: "POST /nutrition/diet-orders/${do1_id}/cosign"
              payload: {}
              as: Dietitian
              as_user_id: "u-rd-1"
              captures: { do1_v: $.data.version }
            - call: "POST /nutrition/diet-orders"
              payload: { patient_id: "${p2_id}", primary_diet_rule_id: "${r_std_id}" }
              as: Physician
              as_user_id: "u-phys-1"
              captures: { do2_id: $.data.id }
            - call: "POST /nutrition/diet-orders/${do2_id}/submit"
              payload: {}
              as: Physician
              as_user_id: "u-phys-1"
            - call: "POST /nutrition/diet-orders/${do2_id}/cosign"
              payload: {}
              as: Dietitian
              as_user_id: "u-rd-1"
              captures: { do2_v: $.data.version }
            - call: "POST /nutrition/meal-periods"
              payload: { ward_id: "${w_id}", period_code: "LUNCH", service_date: "2026-08-02", order_cutoff_at: "2026-08-02T10:30:00Z", window_start_at: "2026-08-02T11:30:00Z", window_end_at: "2026-08-02T13:00:00Z", production_capacity_trays: 20 }
              as: NutritionManager
              as_user_id: "u-mgr-1"
              captures: { mp_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T09:00:00Z" }
              as: NutritionManager
              as_user_id: "u-mgr-1"
            - call: "POST /nutrition/meal-orders"
              payload: { patient_id: "${p1_id}", meal_period_id: "${mp_id}", diet_order_id: "${do1_id}", expected_diet_order_version: "${do1_v}", lines: [ { menu_item_id: "${mi_ric_id}", quantity: 1 } ] }
              as: DietClerk
              as_user_id: "u-clerk-1"
              captures: { mo1_id: $.data.id }
            - call: "POST /nutrition/meal-orders"
              payload: { patient_id: "${p2_id}", meal_period_id: "${mp_id}", diet_order_id: "${do2_id}", expected_diet_order_version: "${do2_v}", lines: [ { menu_item_id: "${mi_ric_id}", quantity: 1 } ] }
              as: DietClerk
              as_user_id: "u-clerk-1"
              captures: { mo2_id: $.data.id }
            - call: "GET /nutrition/meal-order-lines"
              payload: { meal_order_id: "${mo2_id}" }
              as: DietClerk
              as_user_id: "u-clerk-1"
              captures: { line2_id: "$.data[0].id" }
          trigger:
            - call: "POST /nutrition/meal-orders/${mo1_id}/lines/${line2_id}/substitute"
              payload: { substitute_menu_item_id: "${mi_chk_id}" }
              as: DietClerk
              as_user_id: "u-clerk-1"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and data.error_id == \"ERR_MEAL_ORDER_LINE_NOT_FOUND\""
            - "GET /nutrition/meal-order-lines?meal_order_id=${mo2_id} still reports line_status REQUESTED with menu_item_id ${mi_ric_id}"
            - "MealOrder.${mo1_id}.food_cost_cents == 70"

  - section: state_machines
    instances:
      - name: meal_period_starts_in_planned_with_null_forecast_fields
        claim_type: initial_state
        grounds:
          - state_machines.MealPeriod.initial_state
          - entities.MealPeriod.fields.forecast_variant
        distinguishing_aspect: "A freshly created MealPeriod is PLANNED with forecast_variant, forecast_tray_count, forecast_cost_cents, forecast_variance_pct and locked_at all null and every committed counter at 0."
        test_recipe:
          setup: ["One ACTIVE ward exists."]
          setup_api_calls:
            - call: "POST /nutrition/wards"
              payload: { name: "Ward 5 East", code: "W5E", tray_line_capacity_per_window: 20, delivery_lead_minutes: 20 }
              as: NutritionManager
              as_user_id: "u-mgr-1"
              captures: { w_id: $.data.id }
          trigger:
            - call: "POST /nutrition/meal-periods"
              payload: { ward_id: "${w_id}", period_code: "LUNCH", service_date: "2026-08-02", order_cutoff_at: "2026-08-02T10:30:00Z", window_start_at: "2026-08-02T11:30:00Z", window_end_at: "2026-08-02T13:00:00Z", production_capacity_trays: 20 }
              as: NutritionManager
              as_user_id: "u-mgr-1"
              captures: { mp_id: $.data.id }
          assert:
            - "MealPeriod.${mp_id}.status == PLANNED"
            - "MealPeriod.${mp_id}.forecast_variant == null and MealPeriod.${mp_id}.forecast_tray_count == null and MealPeriod.${mp_id}.locked_at == null"
            - "MealPeriod.${mp_id}.committed_tray_count == 0 and MealPeriod.${mp_id}.committed_food_cost_cents == 0 and MealPeriod.${mp_id}.delivered_tray_count == 0"
            - "MealPeriod.${mp_id}.period_total_cost_cents == 0"
            - "MealPeriod.${mp_id}.cost_ceiling_cents == null"

      - name: meal_period_open_service_from_planned_returns_invalid_state
        claim_type: invalid_transitions
        grounds:
          - state_machines.MealPeriod.FORECAST_LOCKED_to_IN_SERVICE
          - validations[priority=10]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "open-service declares FORECAST_LOCKED as its only from-state, so calling it on a PLANNED period answers 409 ERR_INVALID_STATE and leaves the period PLANNED."
        test_recipe:
          setup: ["A PLANNED LUNCH period exists on an ACTIVE ward and no forecast has been locked."]
          setup_api_calls:
            - call: "POST /nutrition/wards"
              payload: { name: "Ward 5 East", code: "W5E", tray_line_capacity_per_window: 20, delivery_lead_minutes: 20 }
              as: NutritionManager
              as_user_id: "u-mgr-1"
              captures: { w_id: $.data.id }
            - call: "POST /nutrition/meal-periods"
              payload: { ward_id: "${w_id}", period_code: "LUNCH", service_date: "2026-08-02", order_cutoff_at: "2026-08-02T10:30:00Z", window_start_at: "2026-08-02T11:30:00Z", window_end_at: "2026-08-02T13:00:00Z", production_capacity_trays: 20 }
              as: NutritionManager
              as_user_id: "u-mgr-1"
              captures: { mp_id: $.data.id }
          trigger:
            - call: "POST /nutrition/meal-periods/${mp_id}/open-service"
              payload: {}
              as: NutritionManager
              as_user_id: "u-mgr-1"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and data.error_id == \"ERR_INVALID_STATE\""
            - "MealPeriod.${mp_id}.status == PLANNED"

      - name: meal_period_close_twice_returns_invalid_state_from_terminal
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.MealPeriod.terminal_states
          - errors[ERR_INVALID_STATE]
