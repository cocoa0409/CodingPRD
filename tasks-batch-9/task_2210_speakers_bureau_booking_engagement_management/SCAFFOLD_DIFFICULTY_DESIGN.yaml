      - name: cross_entity_speaker_probation_blocks_only_the_speaker_signature_leg
        grounds:
          - state_machines.Contract.SENT_to_PARTIALLY_SIGNED
          - entities.Speaker.fields.roster_status
          - validations[priority=13]
          - endpoints[PATCH /speakers/{speakerId}]
        distinguishing_aspect: |
          Contract depends on Speaker: the speaker signature leg is gated on Speaker.roster_status
          while the client leg is gated on Client.credit_status, so pausing the roster blocks one
          leg and leaves the other fully available. The blocking entity is neither the contract's
          parent engagement nor the acting party's own row.
