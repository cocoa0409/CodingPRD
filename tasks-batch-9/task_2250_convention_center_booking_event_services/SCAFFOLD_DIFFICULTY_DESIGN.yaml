      - name: settlement_finalize_cascades_client_standing_into_sibling_booking_order_lock
        grounds:
          - state_machines.EventSettlement.ISSUED_to_FINAL
          - state_machines.EventBooking.CLOSED_to_SETTLED
          - calculations.client_booking_standing
          - calculations.facility_service_fee
          - entities.EventBooking.fields.order_posture
        distinguishing_aspect: |
          A depth-4 chain that leaves the aggregate it started in: EventSettlement
          ISSUED -> FINAL (1) settles its own EventBooking (2), which recomputes
          Client.outstanding_balance_cents to 20286000 and flips booking_standing to
          HOLD_RESTRICTED (3), which drives an unrelated sibling EventBooking of the same
          client to order_posture LOCKED (4). The cascade crosses from settlement to client
          to a second booking, so no per-aggregate handler can produce it.
        test_recipe:
          setup:
            - "Hall A has daily_base_rate_cents 4800000; Ballroom B has daily_base_rate_cents 1200000"
            - "National Widget Association has paid 8000000 of deposits"
            - "its CITYWIDE_CONVENTION booking on Hall A runs 2028-05-10 through 2028-05-19, so contracted_rental_cents is 25200000 and deposit_required_cents is 6300000"
            - "a sibling CITYWIDE_CONVENTION booking on Ballroom B running 2028-09-05 through 2028-09-12 is TENTATIVE with order_posture OPEN"
            - "the Hall A booking has been carried to CLOSED and its CONTRACTED settlement, carrying one RENTAL line of 25200000, was issued by analyst-1 at 2028-05-20T09:00:00Z"
            - "the logical clock is 2028-05-30T10:00:00Z, past the 240-hour dispute deadline"
