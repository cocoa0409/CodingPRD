            - "CaptionTrack.${t_a}.track_status == QC_PASSED; CaptionTrack.${t_b}.track_status == QC_FAILED with last_accuracy_pct == 98.99"

      - name: capacity_boundary_exact_300
        grounds:
          - calculations.stenographer_committed_minutes
          - entities.Stenographer.fields.max_daily_live_minutes
        distinguishing_aspect: |
          Committed-minutes metric boundary on POST assignments accept (different
          metric and endpoint from the accuracy boundary): the cap comparison is
          inclusive — committed exactly 300 books, 301 rejects with
          ERR_CAPACITY_EXCEEDED; booked_minutes includes prep/wrap, so the boundary
          is invisible from raw event durations alone.
        test_recipe:
          setup:
            - "Clock at 2026-08-10T08:00:00Z"
            - "Client; stenographer S1 ACTIVE CERT_CBC with default cap 300"
            - "Event A 2026-08-10 09:00-13:20 (260 min) prep 15 wrap 5 -> booked 280, ACCEPTED"
            - "Event B 2026-08-10 14:00-14:20 (20 min) prep 0 wrap 0 -> booked 20, OFFERED to S1"
            - "Event C 2026-08-10 15:00-15:01 (1 min) prep 0 wrap 0 -> booked 1, OFFERED to S1"
          setup_api_calls:
            - call: "POST /caption-ad/_clock/set_current_utc"
