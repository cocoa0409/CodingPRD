            - call: "POST /bills"
              payload: { account_id: "${acct_id}", period_id: "${p2_id}", meter_id: "${master_id}", read_type: "ESTIMATED" }
              as: BillingSupervisor
              captures: { bill_est_id: $.data.id }
          assert:
            - "ACTUAL BILL: Bill.${bill_actual_id}.estimated_flag == false, consumption_gallons == 41000, submeter_credit_gallons == 8000 == min(9000, submeter_sewer_credit_cap_gallons 8000)"
            - "ACTUAL BILL: sewer_billable_gallons == 4000 == max(0, min(41000, 12000) - 8000), sewer_charge_cents == 2440, water_charge_cents == 37619 and total_charge_cents == 40059"
            - "ESTIMATED BILL: Bill.${bill_est_id}.estimated_flag == true, consumption_gallons == 41000, submeter_credit_gallons == 0 despite the same 9000 gallons of submeter volume"
            - "ESTIMATED BILL: sewer_billable_gallons == 12000, sewer_charge_cents == 7320, water_charge_cents == 37619 and total_charge_cents == 44939"
            - "The two bills differ by exactly 4880 cents == 8000 * 610 / 1000, all of it on the sewer line; the water line is identical"
            - "The submeter itself is never billed: GET /bills?meter_id=${sub_id} returns total_count 0"

      - name: corner_validation_cross_entity_bill_meter_must_belong_to_the_billed_account
        claim_type: cross_entity_validation
        grounds:
          - validations[ERR_BILL_METER_ACCOUNT_MISMATCH]
        distinguishing_aspect: |
          Both foreign keys resolve and every earlier rule passes — the meter is a billable
          POTABLE_MASTER with complete reads and no bill yet exists for it in this period — so the
          only violation is the relationship between them: meter.account_id must equal the
          account_id being billed. Pairing each meter with its own account then succeeds with
          identical charges, which shows the refusal is about the cross-reference and not about
          either row.
        test_recipe:
          setup:
            - "RS-STD-2026 and BillingPeriod 2025-06 (SUMMER) exist; the clock is 2026-08-01T00:00:00Z."
            - "Two accounts exist: ACC-4006A with master meter MTR-6A (reads 100000 / 104000) and ACC-4006B with master meter MTR-6B (reads 200000 / 204000)."
            - "Both meters therefore have complete bounding reads for the period and neither has been billed yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /rate-schedules"
              payload: { code: "RS-STD-2026", base_charge_cents: 1200, tier1_limit_gallons: 3000, tier1_rate_cents_per_kgal: 350, tier2_limit_gallons: 10000, tier2_rate_cents_per_kgal: 520, tier3_rate_cents_per_kgal: 890, summer_surcharge_bp: 1500, sewer_rate_cents_per_kgal: 610, sewer_cap_gallons: 12000, submeter_sewer_credit_cap_gallons: 8000, admin_fee_cents: 1500, admin_fee_waiver_threshold_cents: 10000 }
              as: SystemAdmin
              captures: { rs_id: $.data.id }
            - call: "POST /billing-periods"
              payload: { period_code: "2025-06", start_date: "2025-06-01", end_date: "2025-06-30", season: "SUMMER", rebilling_deadline_date: "2026-12-31" }
              as: SystemAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /service-accounts"
              payload: { account_number: "ACC-4006A", customer_name: "Ravi Chandra", service_address: "3 Elm Row", rate_schedule_id: "${rs_id}" }
              as: CustomerServiceRep
              captures: { acct_a_id: $.data.id }
            - call: "POST /service-accounts"
              payload: { account_number: "ACC-4006B", customer_name: "Lena Kovac", service_address: "4 Elm Row", rate_schedule_id: "${rs_id}" }
              as: CustomerServiceRep
              captures: { acct_b_id: $.data.id }
            - call: "POST /meters"
              payload: { account_id: "${acct_a_id}", meter_serial: "MTR-6A", meter_type: "POTABLE_MASTER", size_inches: 1.0, initial_register_value: 100000 }
              as: MeterTechnician
              captures: { meter_a_id: $.data.id }
            - call: "POST /meters"
              payload: { account_id: "${acct_b_id}", meter_serial: "MTR-6B", meter_type: "POTABLE_MASTER", size_inches: 1.0, initial_register_value: 200000 }
              as: MeterTechnician
              captures: { meter_b_id: $.data.id }
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_a_id}", read_date: "2025-05-31", read_type: "ACTUAL", reading_value: 100000 }
              as: MeterTechnician
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_a_id}", read_date: "2025-06-30", read_type: "ACTUAL", reading_value: 104000 }
              as: MeterTechnician
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_b_id}", read_date: "2025-05-31", read_type: "ACTUAL", reading_value: 200000 }
              as: MeterTechnician
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_b_id}", read_date: "2025-06-30", read_type: "ACTUAL", reading_value: 204000 }
              as: MeterTechnician
          trigger:
            - call: "POST /bills"
              payload: { account_id: "${acct_a_id}", period_id: "${p1_id}", meter_id: "${meter_b_id}", read_type: "ACTUAL" }
              as: BillingSupervisor
            - call: "POST /bills"
              payload: { account_id: "${acct_a_id}", period_id: "${p1_id}", meter_id: "${meter_a_id}", read_type: "ACTUAL" }
              as: BillingSupervisor
              captures: { bill_a_id: $.data.id }
            - call: "POST /bills"
              payload: { account_id: "${acct_b_id}", period_id: "${p1_id}", meter_id: "${meter_b_id}", read_type: "ACTUAL" }
              as: BillingSupervisor
              captures: { bill_b_id: $.data.id }
          assert:
            - "CROSSED PAIR: HTTP 422 with error_id ERR_BILL_METER_ACCOUNT_MISMATCH — both ids resolved, so this is neither a 404 nor an ERR_METER_NOT_BILLABLE"
            - "No Bill row was created by the refused call: GET /bills?account_id=${acct_a_id} returns total_count 0 immediately afterwards"
            - "CORRECT PAIR A: HTTP 200 with consumption_gallons 4000 and total_charge_cents 5210"
            - "CORRECT PAIR B: HTTP 200 with consumption_gallons 4000 and total_charge_cents 5210 — the meter that was rejected a moment ago bills cleanly against its own account"
            - "ServiceAccount.${acct_a_id}.balance_cents == 0 and ServiceAccount.${acct_b_id}.balance_cents == 0 — both bills are still DRAFT"

      - name: corner_validation_cascading_existence_is_resolved_before_customer_ownership
        claim_type: cascading_validation
        grounds:
          - validations[ERR_BILL_NOT_FOUND]
          - validations[ERR_ACCOUNT_OWNERSHIP_MISMATCH]
        distinguishing_aspect: |
          The ownership check cannot run until the referenced row has been resolved, so the two checks
          must fire in a fixed order and produce different statuses for the same caller: a Customer
          probing an id that does not exist gets 404, while the same Customer probing a real bill on
          somebody else's account gets 403. This holds for both a path id (priority 4) and a body FK
          (priority 5). An implementation that short-circuits on ownership first would answer 403 to
          both and leak the fact that the unknown id is simply unknown.
        test_recipe:
          setup:
            - "RS-STD-2026 and BillingPeriod 2025-06 (SUMMER) exist; the clock is 2026-08-01T00:00:00Z."
            - "ServiceAccount ACC-4007A belongs to the calling customer, whose X-User-ID equals that account's id."
            - "ServiceAccount ACC-4007B belongs to somebody else and has a master meter with reads 200000 / 204000 and one DRAFT bill."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /rate-schedules"
              payload: { code: "RS-STD-2026", base_charge_cents: 1200, tier1_limit_gallons: 3000, tier1_rate_cents_per_kgal: 350, tier2_limit_gallons: 10000, tier2_rate_cents_per_kgal: 520, tier3_rate_cents_per_kgal: 890, summer_surcharge_bp: 1500, sewer_rate_cents_per_kgal: 610, sewer_cap_gallons: 12000, submeter_sewer_credit_cap_gallons: 8000, admin_fee_cents: 1500, admin_fee_waiver_threshold_cents: 10000 }
              as: SystemAdmin
              captures: { rs_id: $.data.id }
            - call: "POST /billing-periods"
              payload: { period_code: "2025-06", start_date: "2025-06-01", end_date: "2025-06-30", season: "SUMMER", rebilling_deadline_date: "2026-12-31" }
              as: SystemAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /service-accounts"
              payload: { account_number: "ACC-4007A", customer_name: "Nora Halvorsen", service_address: "11 Spruce Mews", rate_schedule_id: "${rs_id}" }
              as: CustomerServiceRep
              captures: { acct_a_id: $.data.id }
            - call: "POST /service-accounts"
              payload: { account_number: "ACC-4007B", customer_name: "Ilias Papas", service_address: "12 Spruce Mews", rate_schedule_id: "${rs_id}" }
              as: CustomerServiceRep
              captures: { acct_b_id: $.data.id }
            - call: "POST /meters"
              payload: { account_id: "${acct_b_id}", meter_serial: "MTR-7B", meter_type: "POTABLE_MASTER", size_inches: 1.0, initial_register_value: 200000 }
              as: MeterTechnician
              captures: { meter_b_id: $.data.id }
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_b_id}", read_date: "2025-05-31", read_type: "ACTUAL", reading_value: 200000 }
              as: MeterTechnician
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_b_id}", read_date: "2025-06-30", read_type: "ACTUAL", reading_value: 204000 }
              as: MeterTechnician
            - call: "POST /bills"
              payload: { account_id: "${acct_b_id}", period_id: "${p1_id}", meter_id: "${meter_b_id}", read_type: "ACTUAL" }
              as: BillingSupervisor
              captures: { bill_b_id: $.data.id }
          trigger:
            - call: "GET /bills/00000000-0000-0000-0000-000000000000"
              as: Customer
              as_user_id: "${acct_a_id}"
            - call: "GET /bills/${bill_b_id}"
              as: Customer
              as_user_id: "${acct_a_id}"
            - call: "POST /investigations"
              payload: { bill_id: "00000000-0000-0000-0000-000000000000", reported_cause: "probing an id that does not exist" }
              as: Customer
              as_user_id: "${acct_a_id}"
            - call: "POST /investigations"
              payload: { bill_id: "${bill_b_id}", reported_cause: "probing a neighbour's bill" }
              as: Customer
              as_user_id: "${acct_a_id}"
          assert:
            - "PATH ID UNKNOWN: HTTP 404 with error_id ERR_BILL_NOT_FOUND — priority 4 resolves before the priority 6 ownership scope"
            - "PATH ID FOREIGN: HTTP 403 with error_id ERR_ACCOUNT_OWNERSHIP_MISMATCH, proving the row was resolved first and only then rejected"
            - "BODY FK UNKNOWN: HTTP 404 with error_id ERR_BILL_NOT_FOUND — priority 5 resolves before priority 6"
            - "BODY FK FOREIGN: HTTP 403 with error_id ERR_ACCOUNT_OWNERSHIP_MISMATCH, NOT the priority-8 ERR_INVESTIGATION_ALREADY_OPEN that the DRAFT status would otherwise trigger and NOT the priority-11 ERR_INSUFFICIENT_BASELINE_HISTORY that the missing baseline would otherwise trigger"
            - "GET /investigations?bill_id=${bill_b_id} returns total_count 0 — none of the four probes created anything"

      - name: corner_validation_priority_ordering_two_rules_violated_at_once
        claim_type: priority_ordering
        grounds:
          - validations
        excluded_because:
          difficulty_instance: priority_pair_business_constraint_p11_beats_business_referential_p12_on_bill_create
          rationale: |
            That difficulty instance constructs a single POST /bills body that violates a priority-11
            constraint and a priority-12 referential rule within one request body and asserts the
            priority-11 code, which is the two-rules-violated claim for this ladder.

      - name: corner_validation_priority_conflict_across_distant_bands
        claim_type: priority_conflict
        grounds:
          - validations
        excluded_because:
          difficulty_instance: priority_pair_concurrency_p7_beats_state_p8_stale_investigation_version
          rationale: |
            That difficulty instance violates the priority-7 concurrency guard and the priority-8 state
            guard in one request and asserts the priority-7 code, and the companion instance
            priority_pair_business_safety_p9_beats_business_temporal_p10_on_approve does the same for
            bands 9 and 10, together covering the distant-band conflict claim.

  # ===========================================================================
  # Guide section 5 — Endpoints
  # (the Bulk action row is omitted: this API declares no bulk endpoint, so the
  #  partial-success / rollback-or-skip claim has nothing to attach to)
  # ===========================================================================
  - section: endpoints
    instances:

      - name: corner_endpoint_standard_crud_rate_schedule_create_read_and_filtered_list
        claim_type: standard_crud
        grounds:
          - endpoints[POST /rate-schedules]
          - endpoints[GET /rate-schedules/{id}]
          - endpoints[GET /rate-schedules]
        distinguishing_aspect: |
          The full readable surface of a rate schedule round-trips: the create echoes all thirteen
          tariff fields, the single read returns byte-identical values, and the list filters by code
          and paginates with total_count and has_more. There is deliberately no update and no delete
          endpoint for RateSchedule — a published tariff is immutable — so an implementation that
          exposes PATCH or DELETE here is adding surface the scaffold does not declare.
        test_recipe:
          setup:
            - "The clock is 2026-08-01T00:00:00Z and no rate schedules exist yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /rate-schedules"
              payload: { code: "RS-STD-2026", base_charge_cents: 1200, tier1_limit_gallons: 3000, tier1_rate_cents_per_kgal: 350, tier2_limit_gallons: 10000, tier2_rate_cents_per_kgal: 520, tier3_rate_cents_per_kgal: 890, summer_surcharge_bp: 1500, sewer_rate_cents_per_kgal: 610, sewer_cap_gallons: 12000, submeter_sewer_credit_cap_gallons: 8000, admin_fee_cents: 1500, admin_fee_waiver_threshold_cents: 10000 }
              as: SystemAdmin
              captures: { rs_std_id: $.data.id }
            - call: "POST /rate-schedules"
              payload: { code: "RS-LIFELINE-2026", base_charge_cents: 600, tier1_limit_gallons: 4000, tier1_rate_cents_per_kgal: 240, tier2_limit_gallons: 11000, tier2_rate_cents_per_kgal: 400, tier3_rate_cents_per_kgal: 700, summer_surcharge_bp: 0, sewer_rate_cents_per_kgal: 500, sewer_cap_gallons: 10000, submeter_sewer_credit_cap_gallons: 6000, admin_fee_cents: 0, admin_fee_waiver_threshold_cents: 0 }
              as: SystemAdmin
              captures: { rs_life_id: $.data.id }
            - call: "GET /rate-schedules/${rs_std_id}"
              as: SystemAdmin
            - call: "GET /rate-schedules?code=RS-LIFELINE-2026"
              as: BillingSupervisor
            - call: "GET /rate-schedules?limit=1&offset=0"
              as: BillingSupervisor
          assert:
            - "CREATE: HTTP 200 with every supplied field echoed back unchanged, plus server-assigned id, created_at, updated_at and version 1"
            - "READ: GET /rate-schedules/${rs_std_id} returns base_charge_cents 1200, tier1_limit_gallons 3000, tier1_rate_cents_per_kgal 350, tier2_limit_gallons 10000, tier2_rate_cents_per_kgal 520, tier3_rate_cents_per_kgal 890, summer_surcharge_bp 1500, sewer_rate_cents_per_kgal 610, sewer_cap_gallons 12000, submeter_sewer_credit_cap_gallons 8000, admin_fee_cents 1500 and admin_fee_waiver_threshold_cents 10000"
            - "FILTERED LIST: total_count 1 and the single row is ${rs_life_id} with summer_surcharge_bp 0 and admin_fee_cents 0"
            - "PAGINATED LIST: limit 1 offset 0 returns exactly one row with total_count 2 and has_more true"
            - "There is no PATCH, PUT or DELETE endpoint declared for /rate-schedules/{id}"

      - name: corner_endpoint_action_endpoint_account_payment_posts_a_credit_and_guards_its_amount
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /service-accounts/{id}/payments]
          - validations[ERR_PAYMENT_AMOUNT_INVALID]
          - calculations.account_credit_status
        distinguishing_aspect: |
          The action both performs its side effect and enforces its own precondition: a 3000-cent
          payment writes one CUSTOMER_PAYMENT entry of -3000 with bill_id null, drops the balance from
          5210 to 2210 and pulls credit_status back from PAST_DUE to CURRENT, while a zero-amount
          payment is refused with ERR_PAYMENT_AMOUNT_INVALID and leaves the ledger untouched. The
          strict positivity test is what distinguishes it: 0 must fail even though it is not negative.
        test_recipe:
          setup:
            - "RS-STD-2026 and BillingPeriod 2025-06 (SUMMER) exist; the clock is 2026-08-01T00:00:00Z."
            - "ServiceAccount ACC-5002 has a master meter with reads 100000 / 104000 and its 4000-gallon bill is ISSUED for 5210 cents, so balance_cents is 5210 and credit_status is PAST_DUE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /rate-schedules"
              payload: { code: "RS-STD-2026", base_charge_cents: 1200, tier1_limit_gallons: 3000, tier1_rate_cents_per_kgal: 350, tier2_limit_gallons: 10000, tier2_rate_cents_per_kgal: 520, tier3_rate_cents_per_kgal: 890, summer_surcharge_bp: 1500, sewer_rate_cents_per_kgal: 610, sewer_cap_gallons: 12000, submeter_sewer_credit_cap_gallons: 8000, admin_fee_cents: 1500, admin_fee_waiver_threshold_cents: 10000 }
              as: SystemAdmin
              captures: { rs_id: $.data.id }
            - call: "POST /billing-periods"
              payload: { period_code: "2025-06", start_date: "2025-06-01", end_date: "2025-06-30", season: "SUMMER", rebilling_deadline_date: "2026-12-31" }
              as: SystemAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /service-accounts"
              payload: { account_number: "ACC-5002", customer_name: "Ada Whitfield", service_address: "2 Linden Walk", rate_schedule_id: "${rs_id}" }
              as: CustomerServiceRep
              captures: { acct_id: $.data.id }
            - call: "POST /meters"
              payload: { account_id: "${acct_id}", meter_serial: "MTR-5B-1", meter_type: "POTABLE_MASTER", size_inches: 1.0, initial_register_value: 100000 }
              as: MeterTechnician
              captures: { meter_id: $.data.id }
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_id}", read_date: "2025-05-31", read_type: "ACTUAL", reading_value: 100000 }
              as: MeterTechnician
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_id}", read_date: "2025-06-30", read_type: "ACTUAL", reading_value: 104000 }
              as: MeterTechnician
            - call: "POST /bills"
              payload: { account_id: "${acct_id}", period_id: "${p1_id}", meter_id: "${meter_id}", read_type: "ACTUAL" }
              as: BillingSupervisor
              captures: { bill_id: $.data.id }
            - call: "POST /bills/${bill_id}/issue"
              as: BillingSupervisor
          trigger:
            - call: "POST /service-accounts/${acct_id}/payments"
              payload: { amount_cents: 0, memo: "zero-value probe" }
              as: Customer
              as_user_id: "${acct_id}"
            - call: "POST /service-accounts/${acct_id}/payments"
              payload: { amount_cents: 3000, memo: "partial payment on account" }
              as: Customer
              as_user_id: "${acct_id}"
          assert:
            - "ZERO PAYMENT: HTTP 422 with error_id ERR_PAYMENT_AMOUNT_INVALID, because the rule requires amount_cents strictly greater than 0"
            - "After the refusal the ledger still holds exactly one row and balance_cents is still 5210"
            - "VALID PAYMENT: HTTP 200 and a new AccountLedgerEntry with entry_type PAYMENT, source_kind CUSTOMER_PAYMENT, amount_cents -3000, bill_id null, source_id null and effective_at 2026-08-01T00:00:00Z"
            - "ServiceAccount.${acct_id}.balance_cents == 2210 == 5210 - 3000"
            - "ServiceAccount.${acct_id}.credit_status == CURRENT because 2210 is not greater than 5000, and service_status is still ACTIVE"
            - "GET /service-accounts/${acct_id}/ledger-entries?entry_type=PAYMENT returns total_count 1"

      - name: corner_endpoint_computed_read_bill_scoped_ledger_view_reconciles_the_rebill
        claim_type: computed_read
        grounds:
          - endpoints[GET /bills/{id}/ledger-entries]
          - endpoints[GET /service-accounts/{id}/ledger-entries]
          - state_machines.Bill
        distinguishing_aspect: |
          The bill-scoped ledger view is a derived read that must partition the account ledger exactly:
          after a rebill the superseded bill's view shows BILL_CHARGE +5210 and REBILL_REVERSAL -5210,
          netting to zero, while the replacement bill's view shows only REBILL_CHARGE +4080, and the
          account-level view returns all three rows summing to the reported balance of 4080. A
          source_kind filter must narrow the same view without changing the arithmetic.
        test_recipe:
          setup:
            - "RS-STD-2026 and BillingPeriod 2025-06 (SUMMER, rebilling_deadline_date 2026-12-31) exist; the clock is 2026-08-01T00:00:00Z."
            - "ServiceAccount ACC-5003 has a master meter with reads 100000 / 104000, its 4000-gallon bill is ISSUED for 5210 cents, and a CORRECTED read of 103000 has pushed it into REBILL_PENDING at 3000 gallons."
            - "The bill has then been rebilled, creating and auto-issuing a 4080-cent replacement."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /rate-schedules"
              payload: { code: "RS-STD-2026", base_charge_cents: 1200, tier1_limit_gallons: 3000, tier1_rate_cents_per_kgal: 350, tier2_limit_gallons: 10000, tier2_rate_cents_per_kgal: 520, tier3_rate_cents_per_kgal: 890, summer_surcharge_bp: 1500, sewer_rate_cents_per_kgal: 610, sewer_cap_gallons: 12000, submeter_sewer_credit_cap_gallons: 8000, admin_fee_cents: 1500, admin_fee_waiver_threshold_cents: 10000 }
              as: SystemAdmin
              captures: { rs_id: $.data.id }
            - call: "POST /billing-periods"
              payload: { period_code: "2025-06", start_date: "2025-06-01", end_date: "2025-06-30", season: "SUMMER", rebilling_deadline_date: "2026-12-31" }
              as: SystemAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /service-accounts"
              payload: { account_number: "ACC-5003", customer_name: "Femi Adeyemi", service_address: "8 Cypress Gate", rate_schedule_id: "${rs_id}" }
              as: CustomerServiceRep
              captures: { acct_id: $.data.id }
            - call: "POST /meters"
              payload: { account_id: "${acct_id}", meter_serial: "MTR-5C-1", meter_type: "POTABLE_MASTER", size_inches: 1.0, initial_register_value: 100000 }
              as: MeterTechnician
              captures: { meter_id: $.data.id }
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_id}", read_date: "2025-05-31", read_type: "ACTUAL", reading_value: 100000 }
              as: MeterTechnician
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_id}", read_date: "2025-06-30", read_type: "ACTUAL", reading_value: 104000 }
              as: MeterTechnician
              captures: { read_end_id: $.data.id }
            - call: "POST /bills"
              payload: { account_id: "${acct_id}", period_id: "${p1_id}", meter_id: "${meter_id}", read_type: "ACTUAL" }
              as: BillingSupervisor
              captures: { bill_id: $.data.id }
            - call: "POST /bills/${bill_id}/issue"
              as: BillingSupervisor
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_id}", read_date: "2025-06-30", read_type: "CORRECTED", reading_value: 103000, corrects_reading_id: "${read_end_id}" }
              as: MeterTechnician
            - call: "POST /bills/${bill_id}/rebill"
              as: BillingSupervisor
          trigger:
            - call: "GET /bills/${bill_id}/ledger-entries"
              as: BillingSupervisor
            - call: "GET /bills/${bill_id}/ledger-entries?source_kind=REBILL_REVERSAL"
              as: BillingSupervisor
            - call: "GET /service-accounts/${acct_id}/ledger-entries"
              as: BillingSupervisor
          assert:
            - "SUPERSEDED BILL VIEW: total_count 2 with source_kind BILL_CHARGE amount_cents +5210 and source_kind REBILL_REVERSAL amount_cents -5210, summing to 0"
            - "FILTERED VIEW: total_count 1 holding only the REBILL_REVERSAL row of -5210"
            - "ACCOUNT VIEW: total_count 3, and the three amount_cents values sum to 4080, which equals ServiceAccount.${acct_id}.balance_cents"
            - "The third row is the replacement bill's REBILL_CHARGE of +4080, and GET /bills?rebill_of_bill_id=${bill_id} returns that bill with total_charge_cents 4080 and billing_status ISSUED"
            - "GET /bills/${bill_id}/ledger-entries is scoped to one bill: it does not include the replacement bill's REBILL_CHARGE row"
            - "GET /meter-readings?meter_id=${meter_id}&live_only=true returns total_count 2 — the superseded 104000 read is excluded, and its superseded_by_reading_id is set"

      - name: corner_endpoint_conditional_action_execute_shutoff_waits_for_the_notice_period
        claim_type: conditional_action
        grounds:
          - endpoints[POST /service-accounts/{id}/execute-shutoff]
          - validations[ERR_SHUTOFF_NOTICE_NOT_ELAPSED]
          - state_machines.ServiceAccount
        distinguishing_aspect: |
          The action is gated on the logical clock reaching shutoff_scheduled_for, which the schedule
          step anchored at 2026-08-11 (2026-08-01 plus SHUTOFF_NOTICE_DAYS 10). At 2026-08-10 the call
          is refused with ERR_SHUTOFF_NOTICE_NOT_ELAPSED; at 2026-08-11 exactly the same call succeeds,
          so the comparison is inclusive at the anchor instant rather than strictly after it.
        test_recipe:
          setup:
            - "RS-STD-2026 and BillingPeriod 2025-06 (SUMMER) exist; the clock starts at 2026-08-01T00:00:00Z."
            - "ServiceAccount ACC-5004 has a master meter with reads 100000 / 104000 and its 4000-gallon bill is ISSUED for 5210 cents, so credit_status is PAST_DUE."
            - "A shutoff has been scheduled at 2026-08-01, setting service_status SHUTOFF_SCHEDULED and shutoff_scheduled_for 2026-08-11T00:00:00Z; both hold counters are 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /rate-schedules"
              payload: { code: "RS-STD-2026", base_charge_cents: 1200, tier1_limit_gallons: 3000, tier1_rate_cents_per_kgal: 350, tier2_limit_gallons: 10000, tier2_rate_cents_per_kgal: 520, tier3_rate_cents_per_kgal: 890, summer_surcharge_bp: 1500, sewer_rate_cents_per_kgal: 610, sewer_cap_gallons: 12000, submeter_sewer_credit_cap_gallons: 8000, admin_fee_cents: 1500, admin_fee_waiver_threshold_cents: 10000 }
              as: SystemAdmin
              captures: { rs_id: $.data.id }
            - call: "POST /billing-periods"
              payload: { period_code: "2025-06", start_date: "2025-06-01", end_date: "2025-06-30", season: "SUMMER", rebilling_deadline_date: "2026-12-31" }
              as: SystemAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /service-accounts"
              payload: { account_number: "ACC-5004", customer_name: "Priya Raghavan", service_address: "19 Sequoia Path", rate_schedule_id: "${rs_id}" }
              as: CustomerServiceRep
              captures: { acct_id: $.data.id }
            - call: "POST /meters"
              payload: { account_id: "${acct_id}", meter_serial: "MTR-5D-1", meter_type: "POTABLE_MASTER", size_inches: 1.0, initial_register_value: 100000 }
              as: MeterTechnician
              captures: { meter_id: $.data.id }
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_id}", read_date: "2025-05-31", read_type: "ACTUAL", reading_value: 100000 }
              as: MeterTechnician
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_id}", read_date: "2025-06-30", read_type: "ACTUAL", reading_value: 104000 }
              as: MeterTechnician
            - call: "POST /bills"
              payload: { account_id: "${acct_id}", period_id: "${p1_id}", meter_id: "${meter_id}", read_type: "ACTUAL" }
              as: BillingSupervisor
              captures: { bill_id: $.data.id }
            - call: "POST /bills/${bill_id}/issue"
              as: BillingSupervisor
            - call: "POST /service-accounts/${acct_id}/schedule-shutoff"
