  - rule_id: resource_temporal_overlap
    instances:
      - name: report_periods_are_closed_intervals_so_a_touching_endpoint_is_an_overlap
        grounds:
          - validations.priority_44
          - errors.ERR_REPORT_PERIOD_OVERLAP
          - calculations.report_period_sweep
          - state_machines.UsageReport.status.DRAFT_to_SUBMITTED
          - entities.UsageReport.fields.period_start
          - entities.UsageReport.fields.period_end
        distinguishing_aspect: |
          The September report occupies the CLOSED interval [2026-09-01T00:00:00Z, 2026-09-30T23:59:59Z].
          A new period that merely TOUCHES it at either endpoint therefore overlaps and must be refused,
          while the period starting one second later at 2026-10-01T00:00:00Z is disjoint and must be
          accepted. The accepted report then sweeps ONLY the usage ordered inside its own closed window,
          leaving the September usage bound to the September report - so the interval semantics are
          observable twice, once as an error and once as a sweep partition.
