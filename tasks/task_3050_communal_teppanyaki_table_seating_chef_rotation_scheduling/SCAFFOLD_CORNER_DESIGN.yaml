          - entities.Reservation.fields.seat_surcharge_cents
          - validations[priority=7]
        distinguishing_aspect: "SURCHARGE_ROUNDING_INCREMENT_CENTS is applied once to the reservation's whole quotient: a four-guest T6 booking yields ceil(1920/25)*25 == 1925, not four guests each ceiled to 500 for a total of 2000."
        test_recipe:
