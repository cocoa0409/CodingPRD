              captures: { car_id: $.data.id }
            - call: "POST /api/delivery-units/${unit_id}/routes"
              payload: { route_code: "C360", assigned_carrier_id: "${car_id}", route_type: "CITY" }
              as: RouteSupervisor
              captures: { route_id: $.data.id, route_v: $.data.version }
            - call: "POST /api/delivery-units/${unit_id}/routes/${route_id}/evaluations"
              payload: { evaluation_kind: "FULL_COUNT", count_week_start: "2026-09-15", expected_route_version: "${route_v}" }
              as: RouteSupervisor
              captures: { eval_id: $.data.id }
          trigger:
            - call: "POST /api/delivery-units/${unit_id}/routes/${route_id}/evaluations/${eval_id}/begin-count"
              payload: {}
              as: RouteSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "begin-count with count_week_start 2026-09-15 (a Tuesday) fails 422 with error_id == ERR_TEMPORAL_WINDOW"
