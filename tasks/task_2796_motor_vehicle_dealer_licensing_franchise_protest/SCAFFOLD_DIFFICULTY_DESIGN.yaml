  - rule_id: transitive_cascade
    instances:
      - name: complaint_sanction_to_dealer_suspension_to_salesperson_to_count
        grounds:
          - state_machines.ConsumerComplaint.UNDER_INVESTIGATION_to_SANCTIONED
          - state_machines.Dealer.LICENSED_to_SUSPENDED
          - state_machines.Salesperson.LICENSED_to_SUSPENDED_BY_SPONSOR
          - entities.Dealer.fields.licensed_salesperson_count
          - calculations.dealer_disciplinary_points
        distinguishing_aspect: |
          Four-link chain from one complaint resolution: (1) the sanction recomputes
          Dealer.disciplinary_points to 15, (2) crossing 12 moves the licence dimension
          LICENSED -> SUSPENDED with suspension_reason DISCIPLINARY_POINTS, (3) that suspension
          moves BOTH sponsored salespersons LICENSED -> SUSPENDED_BY_SPONSOR, (4) those
          suspensions drive licensed_salesperson_count from 2 to 0. Trigger is a complaint
          resolution; nothing in the request body names a salesperson or a licence.
