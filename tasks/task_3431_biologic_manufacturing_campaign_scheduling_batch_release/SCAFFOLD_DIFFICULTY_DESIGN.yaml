              as: SupplyPlanner
              as_user_id: "sp-1"
            - call: "POST /batches/${batch_s}/shipments"
              payload: { destination_region: "US-SEA", market_type: "COMMERCIAL", quantity_units: 100 }
              as: SupplyPlanner
              as_user_id: "sp-1"
              captures: { s3: $.data.id }
          assert:
            - "s2 creation succeeded with the site at exactly 500 of 500 units occupied (boundary allowed)"
            - "the 1-unit shipment is rejected 409 with ${err} == ERR_COLD_STORAGE_CAPACITY_EXCEEDED (501 > 500 in aggregate)"
            - "after SHIP on ${s1} (which frees 300 units of occupancy), a 100-unit shipment succeeds: Shipment.${s3} created with status PLANNED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: allocate_deallocate_roundtrip_conserves_capacity_hours
        grounds:
          - calculations.firm_capacity_waterfall
          - state_machines.Campaign.ALLOCATED_to_PROPOSED
          - errors.ERR_CAPACITY_EXCEEDED
        distinguishing_aspect: "Conserved quantity: firm capacity-hours per site-month. The forward action (allocate C1, consuming 72) paired with its compensating action (deallocate C1) leaves firm consumption unchanged, proven because C2 (also 72 hours) fails allocation against the remaining 28 yet succeeds immediately after the deallocation — no hours leak or double-release."
        test_recipe:
          setup:
            - "Site monthly_capacity_hours 100; trains TR-A and TR-B; campaign C1 (72 h) on TR-A for 2026-10-01..10-10; campaign C2 (72 h) on TR-B for 2026-10-05..10-15. Both October, same site."
          setup_api_calls:
            - *d_clock0
            - &d_site_cap
              call: "POST /sites"
              payload: { name: "Breda Pilot Plant", region: "NL-BRE", monthly_capacity_hours: 100, cold_storage_capacity_units: 10000000, licensed_authorities: ["EMA"] }
              as: PlatformAdmin
              captures: { site_cap: $.data.id }
            - *d_product
            - call: "POST /sites/${site_cap}/trains"
              payload: { train_code: "TR-A", capacity_liters: 2000, supported_molecule_types: ["MONOCLONAL_ANTIBODY"] }
              as: PlatformAdmin
              captures: { train_a: $.data.id }
            - call: "POST /sites/${site_cap}/trains"
              payload: { train_code: "TR-B", capacity_liters: 2000, supported_molecule_types: ["MONOCLONAL_ANTIBODY"] }
              as: PlatformAdmin
              captures: { train_b: $.data.id }
            - call: "POST /trains/${train_a}/campaigns"
              payload: { product_id: "${prod_id}", demand_type: "COMMERCIAL", planned_start_utc: "2026-10-01T00:00:00Z", planned_end_utc: "2026-10-10T00:00:00Z", upstream_hours: 20, downstream_hours: 30 }
              as: ProcessEngineer
              captures: { camp_c1: $.data.id }
            - call: "POST /trains/${train_b}/campaigns"
              payload: { product_id: "${prod_id}", demand_type: "COMMERCIAL", planned_start_utc: "2026-10-05T00:00:00Z", planned_end_utc: "2026-10-15T00:00:00Z", upstream_hours: 20, downstream_hours: 30 }
              as: ProcessEngineer
              captures: { camp_c2: $.data.id }
            - call: "POST /campaigns/${camp_c1}/advance"
              payload: { to_status: "ALLOCATED" }
              as: ProcessEngineer
          trigger:
            - call: "POST /campaigns/${camp_c2}/advance"
              payload: { to_status: "ALLOCATED" }
              as: ProcessEngineer
              captures: { err: $.data.error_id }
            - call: "POST /campaigns/${camp_c1}/advance"
              payload: { to_status: "PROPOSED" }
              as: ProcessEngineer
            - call: "POST /campaigns/${camp_c2}/advance"
              payload: { to_status: "ALLOCATED" }
              as: ProcessEngineer
          assert:
            - "C2's first allocation is rejected 409 with ${err} == ERR_CAPACITY_EXCEEDED (only 28 of 100 firm hours remain)"
            - "after deallocating C1, C2's allocation returns 200 with status ALLOCATED — the freed 72 hours are exactly and fully reusable"
            - "GET /campaigns/${camp_c1} shows status PROPOSED with allocated_hours still 72 (deallocation does not rewrite the stored charge)"
            - "GET /campaigns?site_id=${site_cap}&status=ALLOCATED returns exactly 1 row: ${camp_c2}"

      - name: shipment_create_cancel_roundtrip_conserves_sellable_units
        grounds:
          - entities.BatchLot.fields.available_to_ship_units
          - state_machines.Shipment.PLANNED_to_CANCELLED
          - calculations.cold_storage_occupancy
        distinguishing_aspect: "Conserved quantity: batch sellable units (different conserved quantity than capacity-hours). Creating shipments s1 (300) and s2 (200) draws available_to_ship_units from 625 to 125; cancelling s2 restores it to exactly 325, and a subsequent 200-unit s3 fits storage exactly (300 + 200 == 500 capacity) proving no unit drift in either the batch ledger or the storage aggregate."
        test_recipe:
          setup:
            - "Site with cold storage 500; released small-train batch with final yield 625; s1 (300) and s2 (200) PLANNED."
          setup_api_calls:
            - *d_clock0
            - *d_site_ss
            - *d_product
            - *d_train_s
            - *d_campaign_s
            - *d_alloc_s
            - *d_seed_s
            - call: "POST /campaigns/${camp_s}/advance"
              payload: { to_status: "SEED_IN_PROGRESS" }
              as: ProcessEngineer
            - call: "POST /seed-stages/${ss1s}/advance"
              payload: { to_status: "RUNNING" }
              as: ProcessEngineer
            - *d_clock10
            - call: "POST /seed-stages/${ss1s}/advance"
              payload: { to_status: "COMPLETED" }
              as: ProcessEngineer
            - call: "POST /campaigns/${camp_s}/advance"
              payload: { to_status: "PRODUCTION_IN_PROGRESS" }
              as: ProcessEngineer
            - *d_batch_s
            - call: "POST /batches/${batch_s}/tests"
              payload: { test_type: "CELL_VIABILITY", phase: "UPSTREAM", measured_value: 88.0, unit: "PCT", spec_min: 80.0, spec_max: 100.0, expected_batch_version: "${bat_vs}" }
              as: ManufacturingOperator
              as_user_id: "op-1"
              captures: { t_ups: $.data.id }
            - call: "POST /tests/${t_ups}/verify"
              payload: {}
              as: QualityControlAnalyst
              as_user_id: "qc-1"
            - call: "POST /batches/${batch_s}/advance"
              payload: { to_status: "DOWNSTREAM" }
              as: ManufacturingOperator
              as_user_id: "op-1"
            - call: "GET /batches/${batch_s}"
              payload: {}
              as: Any
              captures: { bat_vs2: $.data.version }
            - call: "POST /batches/${batch_s}/tests"
              payload: { test_type: "TITER", phase: "DOWNSTREAM", measured_value: 2.5, unit: "G/L", spec_min: 2.0, spec_max: 4.0, expected_batch_version: "${bat_vs2}" }
              as: ManufacturingOperator
              as_user_id: "op-1"
              captures: { t_ts: $.data.id }
            - call: "POST /tests/${t_ts}/verify"
              payload: {}
              as: QualityControlAnalyst
              as_user_id: "qc-1"
            - call: "POST /batches/${batch_s}/advance"
              payload: { to_status: "PROCESS_COMPLETE" }
              as: ManufacturingOperator
              as_user_id: "op-1"
            - *d_submit_s
            - *d_release_s
            - call: "POST /batches/${batch_s}/shipments"
              payload: { destination_region: "IE-DUB", market_type: "COMMERCIAL", quantity_units: 300 }
              as: SupplyPlanner
              as_user_id: "sp-1"
              captures: { s1: $.data.id }
            - call: "POST /batches/${batch_s}/shipments"
              payload: { destination_region: "US-BOS", market_type: "COMMERCIAL", quantity_units: 200 }
              as: SupplyPlanner
              as_user_id: "sp-1"
              captures: { s2: $.data.id }
            - call: "GET /batches/${batch_s}"
              payload: {}
              as: Any
              captures: { avail_after_two: $.data.available_to_ship_units }
          trigger:
            - call: "POST /shipments/${s2}/action"
              payload: { action: "CANCEL" }
              as: SupplyPlanner
              as_user_id: "sp-1"
            - call: "GET /batches/${batch_s}"
              payload: {}
              as: Any
              captures: { avail_after_cancel: $.data.available_to_ship_units }
            - call: "POST /batches/${batch_s}/shipments"
              payload: { destination_region: "US-SEA", market_type: "COMMERCIAL", quantity_units: 200 }
              as: SupplyPlanner
              as_user_id: "sp-1"
              captures: { s3: $.data.id }
          assert:
            - "${avail_after_two} == 125 (625 - 300 - 200)"
            - "${avail_after_cancel} == 325 (cancel restores exactly s2's 200 units; no drift)"
            - "Shipment.${s2}.status == CANCELLED"
            - "Shipment.${s3} created 201 with status PLANNED (storage exactly 300 + 200 == 500, boundary allowed; availability 325 >= 200)"
            - "after s3, GET /batches/${batch_s} shows available_to_ship_units == 125 (625 - 300 - 200)"
