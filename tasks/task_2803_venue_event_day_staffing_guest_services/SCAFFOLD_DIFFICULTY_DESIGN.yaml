      - name: plan_cost_round_per_slot_then_sum
        grounds:
          - calculations.staffing_plan_projected_labor_cost
          - calculations.position_slot_required_headcount
          - entities.PositionSlot.fields.slot_labor_cost_cents
          - entities.StaffingPlan.fields.base_labor_cost_cents
          - entities.StaffingPlan.fields.projected_labor_cost_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where the pinned order changes the cents. Two TICKET_TAKER slots
          of 245 and 125 minutes at 5 heads x 2000 cents/h cost exactly 40833.3333 and 20833.3333
          cents; rounding per slot first and then summing gives base_labor_cost_cents 61666, whereas
          summing the exact products (61666.6667) and rounding once would give 61667. The scaffold
          pins round-then-sum, so 61666 is the only correct answer and the off-by-one cent is the
          observable.
        test_recipe:
          setup:
            - "Clock at 2026-09-02T09:00:00Z."
            - "Event with expected_attendance 6000, so the plan basis is TIER_1 (multiplier 1.00)."
            - "TICKET_TAKER PositionType: 2000 cents/h, ratio 0.8, min_headcount 3, no certification, so required_headcount = ceil(6.0 * 0.8 * 1.00) = 5."
            - "One DRAFT FORECAST_BASED plan already carrying the 245-minute slot."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T09:00:00Z" }
              as: StaffingCoordinator
            - call: "POST /events"
              payload: { name: "Precision Fixture", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T16:00:00Z", doors_close_at: "2026-09-12T23:00:00Z", expected_attendance: 6000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id }
            - call: "POST /position-types"
              payload: { code: "TICKET_TAKER", display_name: "Ticket Taker", base_hourly_rate_cents: 2000, attendance_ratio_per_1000: 0.8, min_headcount: 3, required_certifications: [] }
              as: StaffingCoordinator
              captures: { pt_tt_id: $.data.id }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_tt_id}", zone_code: "Z120", shift_start: "2026-09-12T16:00:00Z", shift_end: "2026-09-12T20:05:00Z" }
              as: StaffingCoordinator
              captures: { slot_p: $.data.id }
          trigger:
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_tt_id}", zone_code: "Z121", shift_start: "2026-09-12T20:35:00Z", shift_end: "2026-09-12T22:40:00Z" }
              as: StaffingCoordinator
              captures: { slot_q: $.data.id }
          assert:
            - "StaffingPlan.${plan_id}.basis_attendance == 6000 and basis_attendance_tier == TIER_1"
            - "PositionSlot.${slot_p}.shift_minutes == 245 and PositionSlot.${slot_p}.required_headcount == 5"
            - "PositionSlot.${slot_q}.shift_minutes == 125 and PositionSlot.${slot_q}.required_headcount == 5"
            - "PositionSlot.${slot_p}.slot_labor_cost_cents == 40833 (exact 40833.3333 rounded HALF_UP per slot)"
            - "PositionSlot.${slot_q}.slot_labor_cost_cents == 20833 (exact 20833.3333 rounded HALF_UP per slot)"
            - "StaffingPlan.${plan_id}.base_labor_cost_cents == 61666, NOT 61667 (sum of already-rounded slot costs, never the rounded sum of exact products)"
            - "StaffingPlan.${plan_id}.total_required_headcount == 10 and accessibility_surcharge_cents == 0 (10 < 60, so SURCHARGE_TIER_0_BP applies)"
            - "StaffingPlan.${plan_id}.projected_labor_cost_cents == 61666"

      - name: plan_surcharge_tier_evaluation_order
        grounds:
          - calculations.staffing_plan_projected_labor_cost
          - calculations.position_slot_required_headcount
          - calculations.event_attendance_tier
          - entities.StaffingPlan.fields.total_required_headcount
          - entities.StaffingPlan.fields.accessibility_surcharge_cents
        distinguishing_aspect: |
          Mode (c): a circular-looking dependency resolved by a pinned evaluation order -
          projected_labor_cost_cents = base + surcharge, but the surcharge basis-point tier is keyed
          on the PLAN-LEVEL total_required_headcount and is applied to the already-rounded base, and
          the resulting surcharge never re-enters the base or the headcount total. Adding a fourth
          slot moves total_required_headcount 146 -> 167, which flips the tier 350 bp -> 600 bp and
          the surcharge 65120 -> 129778; choosing the tier per slot instead of per plan would give
          40194, and feeding the surcharge back into the base would give a third, larger number.
        test_recipe:
          setup:
            - "Clock at 2026-09-03T09:00:00Z."
            - "Event with expected_attendance 40000, so the FORECAST_BASED basis is TIER_4 (x1.45)."
            - "Four PositionTypes: USHER 2200/1.5/min 4, TICKET_TAKER 2000/0.8/min 3, ELEVATOR_OPERATOR 2600/0.2/min 2, GUEST_SERVICES_REP 2400/0.35/min 2."
            - "One DRAFT plan already carrying three slots: USHER 360 min (87 heads), TICKET_TAKER 355 min (47 heads), ELEVATOR_OPERATOR 300 min (12 heads) - total 146 heads, 350 bp tier."
          setup_api_calls:
