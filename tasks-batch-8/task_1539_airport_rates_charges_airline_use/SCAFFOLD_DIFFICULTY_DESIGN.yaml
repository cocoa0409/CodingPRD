# =============================================================================
# §1.8 Scaffold Difficulty Design — task_1539_airport_rates_charges_airline_use
# 9 rules × 2 instances each = 18 instances.
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------
  # Rule 1 — dual_variant_calc (≥2, different entity domains)
  # ---------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: landing_fee_residual_vs_compensatory_divergence
        grounds:
          - calculations.landing_fee_rate
          - entities.FiscalYear.fields.methodology
          - entities.FiscalYear.fields.prior_year_surplus_cents
        distinguishing_aspect: |
          Same airfield pool inputs produce different signatory landing fee rates
          depending on whether the parent FiscalYear is RESIDUAL (includes
          prior_year_surplus_cents) or COMPENSATORY (excludes it). Entity domain:
          RatesSetting/FiscalYear rate derivation.
        test_recipe:
          setup:
            - "Two FiscalYears FY_RES (RESIDUAL) and FY_COMP (COMPENSATORY) with identical airfield_opex=10_000_000_00 cents, nonairline_airfield_revenue=2_000_000_00 cents, forecast_landed_weight_kg=8_000_000, terminal pool irrelevant for this test."
            - "FY_RES has prior_year_surplus_cents = +500_000_00 (deficit carried forward, raises requirement)."
            - "FY_COMP has prior_year_surplus_cents = +500_000_00 (must be ignored under COMPENSATORY)."
            - "Both FiscalYears OPEN and a RatesSetting created+published on each."
          setup_api_calls:
            - call: "POST /airport/fiscal_years"
              payload: { year_label: "FY_RES", methodology: "RESIDUAL", airfield_opex_cents: 1000000000, terminal_opex_cents: 100000000, nonairline_airfield_revenue_cents: 200000000, nonairline_terminal_revenue_cents: 10000000, terminal_total_space_sqft: 100000, forecast_landed_weight_kg: 8000000, prior_year_surplus_cents: 50000000 }
              as: AirportFinance
              captures: { fy_res_id: $.data.id }
            - call: "POST /airport/fiscal_years/{fy_res_id}/open"
              payload: {}
              as: AirportFinance
            - call: "POST /airport/fiscal_years"
              payload: { year_label: "FY_COMP", methodology: "COMPENSATORY", airfield_opex_cents: 1000000000, terminal_opex_cents: 100000000, nonairline_airfield_revenue_cents: 200000000, nonairline_terminal_revenue_cents: 10000000, terminal_total_space_sqft: 100000, forecast_landed_weight_kg: 8000000, prior_year_surplus_cents: 50000000 }
              as: AirportFinance
              captures: { fy_comp_id: $.data.id }
            - call: "POST /airport/fiscal_years/{fy_comp_id}/open"
              payload: {}
              as: AirportFinance
            - call: "GET /airport/fiscal_years/${fy_res_id}"
              payload: {}
              as: AirportFinance
              captures: { v_pre_rs_1: $.data.version }
            - call: "POST /airport/fiscal_years/{fy_res_id}/rates_settings"
              payload: { expected_fiscal_year_version: "${v_pre_rs_1}" }
              as: AirportFinance
              captures: { rs_res_id: $.data.id }
            - call: "GET /airport/fiscal_years/${fy_comp_id}"
              payload: {}
              as: AirportFinance
              captures: { v_pre_rs_2: $.data.version }
            - call: "POST /airport/fiscal_years/{fy_comp_id}/rates_settings"
              payload: { expected_fiscal_year_version: "${v_pre_rs_2}" }
              as: AirportFinance
              captures: { rs_comp_id: $.data.id }
          trigger:
            - call: "GET /airport/rates_settings/{rs_res_id}"
              as: AirportFinance
              captures: { res_rate: $.data.signatory_landing_fee_per_1000kg_cents }
            - call: "GET /airport/rates_settings/{rs_comp_id}"
              as: AirportFinance
              captures: { comp_rate: $.data.signatory_landing_fee_per_1000kg_cents }
          assert:
            - "RatesSetting.${rs_res_id}.signatory_landing_fee_per_1000kg_cents == 10625"
            - "RatesSetting.${rs_comp_id}.signatory_landing_fee_per_1000kg_cents == 10000"
            - "res_rate != comp_rate"

      - name: annual_true_up_provisional_vs_final_divergence
        grounds:
          - calculations.annual_true_up
          - entities.AnnualSettlement.fields.total_true_up_cents
        distinguishing_aspect: |
          Same airline activity set yields different per-airline true_up_cents
          when computed in provisional (forecast denominator, no remainder
          reconciliation) vs final (actual denominator, remainder-reconciled)
          variants. Entity domain: AnnualSettlement/AirlineSettlementLine —
          distinct from RatesSetting in the sibling instance.
        test_recipe:
          setup:
            - "FiscalYear FY_PROV in RESIDUAL methodology, OPEN; airfield_opex=10_000_000_00, nonairline_airfield=0, forecast_landed_weight_kg=1_000_000, prior_year_surplus=0."
            - "RatesSetting adopted."
            - "Airline A1 SIGNATORY with 300_000 kg activity; Airline A2 SIGNATORY with 300_000 kg activity; Airline N1 NON_SIGNATORY with 400_000 kg activity."
            - "Total actual weight 1_000_000 kg equals forecast → denominators match; the divergence here is the remainder-reconciliation step (provisional skips it, final applies it)."
          setup_api_calls:
            - call: "POST /airport/fiscal_years"
              payload: { year_label: "FY_PROV", methodology: "RESIDUAL", airfield_opex_cents: 1000000000, terminal_opex_cents: 0, nonairline_airfield_revenue_cents: 0, nonairline_terminal_revenue_cents: 0, terminal_total_space_sqft: 100000, forecast_landed_weight_kg: 1000000, prior_year_surplus_cents: 0 }
              as: AirportFinance
              captures: { fy_prov_id: $.data.id }
            - call: "POST /airport/fiscal_years/{fy_prov_id}/open"
              payload: {}
              as: AirportFinance
            - call: "POST /airport/airlines"
              payload: { iata_code: "A1", legal_name: "Airline One", carrier_class: "PASSENGER", pfc_approved: false }
              as: AirportFinance
              captures: { a1_id: $.data.id }
            - call: "POST /airport/airlines"
              payload: { iata_code: "A2", legal_name: "Airline Two", carrier_class: "PASSENGER", pfc_approved: false }
              as: AirportFinance
              captures: { a2_id: $.data.id }
            - call: "POST /airport/airline_agreements"
              payload: { airline_id: "${a1_id}", fiscal_year_id: "${fy_prov_id}", rented_space_sqft: 0 }
              as: AirportFinance
              captures: { ag_a1_id: $.data.id }
            - call: "POST /airport/airline_agreements"
              payload: { airline_id: "${a2_id}", fiscal_year_id: "${fy_prov_id}", rented_space_sqft: 0 }
              as: AirportFinance
              captures: { ag_a2_id: $.data.id }
            - call: "GET /airport/fiscal_years/${fy_prov_id}"
              payload: {}
              as: AirportFinance
              captures: { v_pre_rs_3: $.data.version }
            - call: "POST /airport/fiscal_years/{fy_prov_id}/rates_settings"
              payload: { expected_fiscal_year_version: "${v_pre_rs_3}" }
              as: AirportFinance
              captures: { rs_prov_id: $.data.id }
            - call: "POST /airport/rates_settings/{rs_prov_id}/publish"
              payload: {}
              as: AirportFinance
            - call: "POST /airport/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AirportFinance
            - call: "POST /airport/rates_settings/{rs_prov_id}/adopt"
              payload: {}
              as: AirportDirector
            - call: "POST /airport/airline_agreements/{ag_a1_id}/countersign"
              payload: {}
              as: SignatoryAirline
              as_user_id: "${a1_id}"
            - call: "POST /airport/airline_agreements/{ag_a2_id}/countersign"
              payload: {}
              as: SignatoryAirline
              as_user_id: "${a2_id}"
            - call: "POST /airport/fiscal_years/{fy_prov_id}/activity_records"
              payload: { airline_id: "${a1_id}", activity_date: "2026-09-05T00:00:00Z", landed_weight_kg: 300000, signature_status_at_activity: "SIGNATORY" }
              as: AirportFinance
            - call: "POST /airport/fiscal_years/{fy_prov_id}/activity_records"
              payload: { airline_id: "${a2_id}", activity_date: "2026-09-06T00:00:00Z", landed_weight_kg: 300000, signature_status_at_activity: "SIGNATORY" }
              as: AirportFinance
          trigger:
            - call: "POST /airport/fiscal_years/{fy_prov_id}/settlement/compute"
              payload: {}
              as: AirportFinance
              captures: { settle_id: $.data.id }
            - call: "GET /airport/settlements/{settle_id}/lines"
              as: AirportFinance
          assert:
            - "AnnualSettlement.${settle_id}.status == COMPUTED"
            - "AnnualSettlement.${settle_id}.actual_airfield_requirement_cents == 1000000000"
            - "Lines created for both A1 and A2"
            - "Per-line true_up_cents for A1 == 500000000 - billed_landing_share(A1)"
            - "Provisional variant (forecast denominator, no remainder reconciliation) would produce a different per-line split when weights are not clean divisors; final variant applies round-half-up + largest-share remainder"

  # ---------------------------------------------------------
  # Rule 2 — combinatorial_formula (≥2, different modes)
  # ---------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: landing_fee_charge_non_linear_threshold_and_tier
        grounds:
          - calculations.landing_fee_charge
          - entities.ActivityRecord.fields.billed_landing_fee_cents
        distinguishing_aspect: |
          Mode (a): the charge formula takes ≥3 inputs (landed_weight_kg,
          signature_status_at_activity, adopted signatory/non-signatory rates)
          with non-linear interaction: a floor() on full 1000-kg units, a
          >=500-kg remainder branch, and a rate switch on signature status.
        test_recipe:
          setup:
            - "FiscalYear FY_NL in RESIDUAL methodology, OPEN; airfield_opex=1_000_000_00, nonairline_airfield=0, forecast=100_000 kg → signatory rate = 1000 cents/1000kg; non-signatory rate = ceil(1000*125/100)=1250 cents."
            - "RatesSetting ADOPTED."
          setup_api_calls:
            - call: "POST /airport/fiscal_years"
              payload: { year_label: "FY_NL", methodology: "RESIDUAL", airfield_opex_cents: 100000000, terminal_opex_cents: 0, nonairline_airfield_revenue_cents: 0, nonairline_terminal_revenue_cents: 0, terminal_total_space_sqft: 100000, forecast_landed_weight_kg: 100000, prior_year_surplus_cents: 0 }
              as: AirportFinance
              captures: { fy_nl_id: $.data.id }
            - call: "POST /airport/fiscal_years/{fy_nl_id}/open"
              payload: {}
              as: AirportFinance
            - call: "POST /airport/airlines"
              payload: { iata_code: "NL", legal_name: "NonLinear Air", carrier_class: "PASSENGER", pfc_approved: false }
              as: AirportFinance
              captures: { nl_air_id: $.data.id }
            - call: "GET /airport/fiscal_years/${fy_nl_id}"
              payload: {}
              as: AirportFinance
              captures: { v_pre_rs_4: $.data.version }
            - call: "POST /airport/fiscal_years/{fy_nl_id}/rates_settings"
              payload: { expected_fiscal_year_version: "${v_pre_rs_4}" }
              as: AirportFinance
              captures: { rs_nl_id: $.data.id }
            - call: "POST /airport/rates_settings/{rs_nl_id}/publish"
              payload: {}
              as: AirportFinance
            - call: "POST /airport/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AirportFinance
            - call: "POST /airport/rates_settings/{rs_nl_id}/adopt"
              payload: {}
              as: AirportDirector
          trigger:
            - call: "POST /airport/fiscal_years/{fy_nl_id}/activity_records"
              payload: { airline_id: "${nl_air_id}", activity_date: "2026-09-05T00:00:00Z", landed_weight_kg: 1499, signature_status_at_activity: "SIGNATORY" }
              as: AirportFinance
              captures: { act_1499: $.data.billed_landing_fee_cents }
            - call: "POST /airport/fiscal_years/{fy_nl_id}/activity_records"
              payload: { airline_id: "${nl_air_id}", activity_date: "2026-09-06T00:00:00Z", landed_weight_kg: 1500, signature_status_at_activity: "SIGNATORY" }
              as: AirportFinance
              captures: { act_1500: $.data.billed_landing_fee_cents }
            - call: "POST /airport/fiscal_years/{fy_nl_id}/activity_records"
              payload: { airline_id: "${nl_air_id}", activity_date: "2026-09-07T00:00:00Z", landed_weight_kg: 1500, signature_status_at_activity: "NON_SIGNATORY" }
              as: AirportFinance
              captures: { act_nonsig: $.data.billed_landing_fee_cents }
          assert:
            - "ActivityRecord for 1499 kg SIGNATORY → billed_landing_fee_cents == 1000 (1 unit; 499 < 500 rounds down)"
            - "ActivityRecord for 1500 kg SIGNATORY → billed_landing_fee_cents == 2000 (1 + 1; 500 >= 500 rounds up)"
            - "ActivityRecord for 1500 kg NON_SIGNATORY → billed_landing_fee_cents == 2500 (2 units × 1250)"

      - name: annual_true_up_per_line_rounding_remainder_allocation
        grounds:
          - calculations.annual_true_up
          - entities.AirlineSettlementLine.fields.true_up_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order — per-line round_half_up THEN sum
          vs sum THEN round produce different cents; scaffold pins per-line
          rounding with remainder allocated to the largest-share airline,
          tie-broken by Airline.created_at ASC.
        test_recipe:
          setup:
            - "FiscalYear FY_RND RESIDUAL, OPEN; airfield_opex=100_01 cents (i.e. 10001 cents), nonairline=0, forecast=300 kg, prior_year_surplus=0."
            - "Three signatory airlines each with exactly 100 kg activity — true-up airfield share per airline = round_half_up(10001 * 100/300) = 3334 cents (with remainder delta = 10001 - 3*3334 = -1 cent, allocated to the airline with largest weight — ties broken by created_at ASC, i.e. the first-created airline absorbs the -1)."
            - "RatesSetting adopted."
          setup_api_calls:
            - call: "POST /airport/fiscal_years"
              payload: { year_label: "FY_RND", methodology: "RESIDUAL", airfield_opex_cents: 10001, terminal_opex_cents: 0, nonairline_airfield_revenue_cents: 0, nonairline_terminal_revenue_cents: 0, terminal_total_space_sqft: 100000, forecast_landed_weight_kg: 300, prior_year_surplus_cents: 0 }
              as: AirportFinance
              captures: { fy_rnd_id: $.data.id }
            - call: "POST /airport/fiscal_years/{fy_rnd_id}/open"
              payload: {}
              as: AirportFinance
            - call: "POST /airport/airlines"
              payload: { iata_code: "R1", legal_name: "Rounder One", carrier_class: "PASSENGER", pfc_approved: false }
              as: AirportFinance
              captures: { r1_id: $.data.id }
            - call: "POST /airport/airlines"
              payload: { iata_code: "R2", legal_name: "Rounder Two", carrier_class: "PASSENGER", pfc_approved: false }
              as: AirportFinance
              captures: { r2_id: $.data.id }
            - call: "POST /airport/airlines"
              payload: { iata_code: "R3", legal_name: "Rounder Three", carrier_class: "PASSENGER", pfc_approved: false }
              as: AirportFinance
              captures: { r3_id: $.data.id }
            - call: "POST /airport/airline_agreements"
              payload: { airline_id: "${r1_id}", fiscal_year_id: "${fy_rnd_id}", rented_space_sqft: 0 }
              as: AirportFinance
            - call: "POST /airport/airline_agreements"
              payload: { airline_id: "${r2_id}", fiscal_year_id: "${fy_rnd_id}", rented_space_sqft: 0 }
              as: AirportFinance
            - call: "POST /airport/airline_agreements"
              payload: { airline_id: "${r3_id}", fiscal_year_id: "${fy_rnd_id}", rented_space_sqft: 0 }
              as: AirportFinance
            - call: "GET /airport/fiscal_years/${fy_rnd_id}"
              payload: {}
              as: AirportFinance
              captures: { v_pre_rs_5: $.data.version }
            - call: "POST /airport/fiscal_years/{fy_rnd_id}/rates_settings"
              payload: { expected_fiscal_year_version: "${v_pre_rs_5}" }
              as: AirportFinance
              captures: { rs_rnd_id: $.data.id }
            - call: "POST /airport/rates_settings/{rs_rnd_id}/publish"
              payload: {}
              as: AirportFinance
            - call: "POST /airport/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AirportFinance
            - call: "POST /airport/rates_settings/{rs_rnd_id}/adopt"
              payload: {}
              as: AirportDirector
            - call: "POST /airport/fiscal_years/{fy_rnd_id}/activity_records"
              payload: { airline_id: "${r1_id}", activity_date: "2026-09-05T00:00:00Z", landed_weight_kg: 100, signature_status_at_activity: "SIGNATORY" }
              as: AirportFinance
            - call: "POST /airport/fiscal_years/{fy_rnd_id}/activity_records"
              payload: { airline_id: "${r2_id}", activity_date: "2026-09-05T00:00:00Z", landed_weight_kg: 100, signature_status_at_activity: "SIGNATORY" }
              as: AirportFinance
            - call: "POST /airport/fiscal_years/{fy_rnd_id}/activity_records"
              payload: { airline_id: "${r3_id}", activity_date: "2026-09-05T00:00:00Z", landed_weight_kg: 100, signature_status_at_activity: "SIGNATORY" }
              as: AirportFinance
          trigger:
            - call: "POST /airport/fiscal_years/{fy_rnd_id}/settlement/compute"
              payload: {}
              as: AirportFinance
              captures: { settle_rnd_id: $.data.id }
            - call: "GET /airport/settlements/{settle_rnd_id}/lines"
              as: AirportFinance
          assert:
            - "AnnualSettlement.${settle_rnd_id}.total_true_up_cents == 10001 - (sum of billed landing)"
            - "Sum over AirlineSettlementLine.actual_airfield_share_cents == 10001 exactly (remainder reconciliation holds)"
            - "One airline's airfield_share is 3333 cents (absorbs the -1 remainder); the other two are 3334 cents"
            - "Remainder-absorbing airline is the one with smallest created_at among those tied on weight"

  # ---------------------------------------------------------
  # Rule 3 — non_linear_state_machine (≥2, different entities)
  # ---------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: annual_settlement_dispute_resolve_cycle
        grounds:
          - state_machines.AnnualSettlement.RESOLVED_to_DISPUTED
          - state_machines.AnnualSettlement.DISPUTED_to_RESOLVED
        distinguishing_aspect: |
          AnnualSettlement exhibits a true cycle AIRLINE_REVIEW → DISPUTED →
          RESOLVED → DISPUTED (re-dispute after resolve) — non-linear shape
          on the AnnualSettlement entity.
        test_recipe:
          setup:
            - "FiscalYear FY_CYC RESIDUAL OPEN with 1 signatory airline and activity; settlement computed, published for review."
          setup_api_calls:
            - call: "POST /airport/fiscal_years"
              payload: { year_label: "FY_CYC", methodology: "RESIDUAL", airfield_opex_cents: 1000000, terminal_opex_cents: 0, nonairline_airfield_revenue_cents: 0, nonairline_terminal_revenue_cents: 0, terminal_total_space_sqft: 100000, forecast_landed_weight_kg: 1000, prior_year_surplus_cents: 0 }
              as: AirportFinance
              captures: { fy_cyc_id: $.data.id }
            - call: "POST /airport/fiscal_years/{fy_cyc_id}/open"
              payload: {}
              as: AirportFinance
            - call: "POST /airport/airlines"
              payload: { iata_code: "CY", legal_name: "Cyclic Air", carrier_class: "PASSENGER", pfc_approved: false }
              as: AirportFinance
              captures: { cy_id: $.data.id }
            - call: "POST /airport/airline_agreements"
              payload: { airline_id: "${cy_id}", fiscal_year_id: "${fy_cyc_id}", rented_space_sqft: 0 }
              as: AirportFinance
              captures: { ag_cy_id: $.data.id }
            - call: "GET /airport/fiscal_years/${fy_cyc_id}"
              payload: {}
              as: AirportFinance
              captures: { v_pre_rs_6: $.data.version }
            - call: "POST /airport/fiscal_years/{fy_cyc_id}/rates_settings"
              payload: { expected_fiscal_year_version: "${v_pre_rs_6}" }
              as: AirportFinance
              captures: { rs_cyc_id: $.data.id }
            - call: "POST /airport/rates_settings/{rs_cyc_id}/publish"
              payload: {}
              as: AirportFinance
            - call: "POST /airport/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AirportFinance
            - call: "POST /airport/rates_settings/{rs_cyc_id}/adopt"
              payload: {}
              as: AirportDirector
            - call: "POST /airport/airline_agreements/{ag_cy_id}/countersign"
              payload: {}
              as: SignatoryAirline
              as_user_id: "${cy_id}"
            - call: "POST /airport/fiscal_years/{fy_cyc_id}/activity_records"
              payload: { airline_id: "${cy_id}", activity_date: "2026-09-10T00:00:00Z", landed_weight_kg: 1000, signature_status_at_activity: "SIGNATORY" }
              as: AirportFinance
            - call: "POST /airport/fiscal_years/{fy_cyc_id}/settlement/compute"
              payload: {}
              as: AirportFinance
              captures: { settle_cyc_id: $.data.id }
            - call: "POST /airport/settlements/{settle_cyc_id}/publish-review"
              payload: {}
              as: AirportFinance
          trigger:
            - call: "POST /airport/settlements/{settle_cyc_id}/dispute"
              payload: { airline_id: "${cy_id}", reason: "dispute round 1" }
              as: SignatoryAirline
              as_user_id: "${cy_id}"
            - call: "POST /airport/settlements/{settle_cyc_id}/resolve"
              payload: {}
              as: AirportDirector
            - call: "POST /airport/settlements/{settle_cyc_id}/dispute"
              payload: { airline_id: "${cy_id}", reason: "reopen within window" }
              as: SignatoryAirline
              as_user_id: "${cy_id}"
          assert:
            - "After 1st dispute: AnnualSettlement.status == DISPUTED"
            - "After resolve: AnnualSettlement.status == RESOLVED"
            - "After 2nd dispute (cycle back): AnnualSettlement.status == DISPUTED"

      - name: airline_agreement_parallel_dimensions
        grounds:
          - state_machines.AirlineAgreement
          - entities.AirlineAgreement.fields.signature_status
          - entities.AirlineAgreement.fields.credit_standing
        distinguishing_aspect: |
          AirlineAgreement has two independent parallel state dimensions
          (signature_status × credit_standing) evolving independently on the
          same row — a non-linear shape on a different entity than
          AnnualSettlement.
        test_recipe:
          setup:
            - "FiscalYear FY_PAR RESIDUAL OPEN; airline PA with agreement; RatesSetting ADOPTED; agreement countersigned → (SIGNATORY, GOOD)."
            - "One AirlineSettlementLine for PA is PENDING and overdue → credit_standing transitions GOOD → DELINQUENT while signature_status remains SIGNATORY."
            - "AirportFinance suspends → (SIGNATORY, SUSPENDED)."
            - "Line paid → reinstate → (SIGNATORY, GOOD)."
          setup_api_calls:
            - call: "POST /airport/fiscal_years"
              payload: { year_label: "FY_PAR", methodology: "RESIDUAL", airfield_opex_cents: 1000000, terminal_opex_cents: 0, nonairline_airfield_revenue_cents: 0, nonairline_terminal_revenue_cents: 0, terminal_total_space_sqft: 100000, forecast_landed_weight_kg: 1000, prior_year_surplus_cents: 0 }
              as: AirportFinance
              captures: { fy_par_id: $.data.id }
            - call: "POST /airport/fiscal_years/{fy_par_id}/open"
              payload: {}
              as: AirportFinance
            - call: "POST /airport/airlines"
              payload: { iata_code: "PA", legal_name: "Parallel Air", carrier_class: "PASSENGER", pfc_approved: false }
              as: AirportFinance
              captures: { pa_id: $.data.id }
            - call: "POST /airport/airline_agreements"
              payload: { airline_id: "${pa_id}", fiscal_year_id: "${fy_par_id}", rented_space_sqft: 0 }
              as: AirportFinance
              captures: { ag_pa_id: $.data.id }
            - call: "GET /airport/fiscal_years/${fy_par_id}"
              payload: {}
              as: AirportFinance
              captures: { v_pre_rs_7: $.data.version }
