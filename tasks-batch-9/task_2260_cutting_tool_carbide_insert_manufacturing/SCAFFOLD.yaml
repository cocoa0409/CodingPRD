    input: ["status?", "target_workpiece_group?", "limit?", "offset?"]
    output: CarbideGrade[]
    side_effects: []

  - method: POST
    path: "/tooling/carbide-grades/{gradeId}/start-pilot"
    description: "Move a DRAFT grade into PILOT once the current recipe revision has produced a QC-passed sinter batch. The grade only reaches QUALIFIED later, as a side effect of approving a qualification dossier on a product built from it."
    roles: [MetallurgyEngineer]
    code: 200
    output: CarbideGrade
    side_effects: ["status=PILOT", "version bumped"]

  - method: POST
    path: "/tooling/carbide-grades/{gradeId}/revise"
    description: "Revise the blend recipe of a QUALIFIED grade; drops the grade back to PILOT and starts the four-hop restriction cascade."
    roles: [MetallurgyEngineer]
    code: 200
    input: [co_binder_pct, wc_grain_um, hardness_hv, trs_mpa, revision_note]
    output: CarbideGrade
    side_effects: ["revision incremented", "status=QUALIFIED -> PILOT", "CASCADE HOP 1->2: every RELEASED ToolProduct on this grade becomes release_status=RESTRICTED", "CASCADE HOP 2->3: those products' supply_status becomes MAKE_TO_ORDER and engineering_lead_time_days is recomputed", "CASCADE HOP 3->4: their CONFIRMED ToolOrders move to ENGINEERING_REVIEW with requires_reconfirmation=true", "version bumped"]

  - method: POST
    path: "/tooling/carbide-grades/{gradeId}/retire"
    description: "Retire a grade permanently; rejected while open demand exists."
    roles: [MetallurgyEngineer]
    code: 200
    input: ["retire_note?"]
    output: CarbideGrade
    side_effects: ["status=RETIRED (terminal)", "every ToolProduct on this grade becomes release_status=WITHDRAWN and supply_status=UNAVAILABLE", "version bumped"]

  # ---------------------------------------------------------------- PowderBlendBatch
