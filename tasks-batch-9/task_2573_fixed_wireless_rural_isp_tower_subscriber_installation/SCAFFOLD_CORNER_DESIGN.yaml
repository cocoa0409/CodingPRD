          One error code covers two structurally different mismatches: the plan on the body must equal
          the plan the request was qualified against (pricing and capacity were reserved for that plan),
          and the equipment_mode must be permitted by that plan's equipment_policy. Both hit after the
          priority-8 status and hold checks pass, so the request is genuinely consumable and only the
          referential rule stops it.
