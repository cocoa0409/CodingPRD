  - rule_id: cross_entity_state_dependency
    instances:

      - name: pickup_cannot_complete_while_an_assessment_is_not_final
        grounds:
          - state_machines.Pickup.IN_PROGRESS_to_COMPLETED
          - state_machines.DamageAssessment.DRAFT_to_ASSESSED
          - validations[priority=29]
          - errors[ERR_ASSESSMENT_INVALID_STATE]
        distinguishing_aspect: |
          ENTITY PAIR (Pickup, DamageAssessment): the Pickup's own state is a perfectly
          legal IN_PROGRESS, yet the transition is refused because a CHILD DamageAssessment
          sits in ASSESSED rather than FINAL. Finalizing the child unblocks the same call.
        test_recipe:
          setup:
            - "The canonical VACANT project with its pickup IN_PROGRESS and one ASSESSED, not-yet-final SOFA assessment."
          setup_api_calls: *v_staged
          trigger:
            - call: "POST /staging/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-08T09:00:00Z" }
