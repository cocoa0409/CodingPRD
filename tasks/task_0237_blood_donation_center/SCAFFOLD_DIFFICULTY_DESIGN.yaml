# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Blood Donation Center — Expert tier
# 9 Difficulty Rules (§0.5) × >= 2 instances each = 18 instances.
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1-§1.7.
# Every setup_api_calls / trigger chain is executable from empty-DB using only
# §1.5 endpoints; placeholders trace back to an earlier captures: line.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: donor_interval_final_vs_provisional_eligibility_date
        grounds:
          - calculations.inter_donation_next_eligible_at
          - entities.Donor.fields.last_qualifying_donation_id
          - entities.Donor.fields.pending_donation_type
          - state_machines.Appointment.SCHEDULED_to_CHECKED_IN
        distinguishing_aspect: >
          The FINAL variant (gates check-in) reads only the donor's actual last
          qualifying COLLECTED donation, while the PROVISIONAL variant folds in
          the donor's OPEN appointment's implied date via max(); the two diverge
          on the SAME Donor entity, a different domain than the unit_expiry dual.
        test_recipe:
          setup:
            - "Center clock at 2025-01-01. Donor with no prior donation has an open WHOLE appointment (pending_donation_type=WHOLE)."
            - "FINAL next_eligible is epoch(0) (no qualifying donation) so check-in succeeds; PROVISIONAL would be later because of the open appointment."
          setup_api_calls:
            - call: "POST /blood-bank/centers"
              payload: { name: "Metro Blood", region_code: "US-CA" }
              as: CenterAdmin
              captures: { center_id: $.data.id }
            - call: "POST /blood-bank/centers/${center_id}/clock/advance"
              payload: { to_iso8601: "2025-01-01T00:00:00.000Z" }
              as: CenterAdmin
            - call: "POST /blood-bank/donors"
              payload: { center_id: "${center_id}", full_name: "Dana Donor", date_of_birth: "1990-05-01", weight_kg: 60, blood_type: "O_POS" }
              as: IntakeNurse
              captures: { donor_id: $.data.id }
            - call: "POST /blood-bank/slots"
              payload: { center_id: "${center_id}", donation_type: "WHOLE", starts_at: "2025-01-02T09:00:00.000Z", ends_at: "2025-01-02T17:00:00.000Z", capacity: 5 }
              as: CenterAdmin
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /blood-bank/appointments"
              payload: { donor_id: "${donor_id}", slot_id: "${slot_id}", expected_slot_version: "${slot_v}" }
              as: Donor
              as_user_id: "${donor_id}"
              captures: { appt_id: $.data.id }
          trigger:
            - call: "GET /blood-bank/donors/${donor_id}"
              payload: {}
              as: IntakeNurse
              captures: { pending_type: $.data.pending_donation_type, last_qual: $.data.last_qualifying_donation_id }
            - call: "POST /blood-bank/appointments/${appt_id}/check-in"
              payload: {}
              as: IntakeNurse
              captures: { appt_status: $.data.status }
          assert:
            - "Donor.${donor_id}.pending_donation_type == WHOLE (PROVISIONAL input present)"
            - "Donor.${donor_id}.last_qualifying_donation_id == null (FINAL input absent)"
            - "Appointment.${appt_id}.status == CHECKED_IN (FINAL gate passes despite PROVISIONAL being later)"

      - name: unit_expiry_collection_anchored_vs_release_anchored
        grounds:
          - calculations.unit_expiry
          - entities.BloodUnit.fields.expires_at
          - entities.BloodUnit.fields.collected_at
          - entities.BloodUnit.fields.released_at
          - state_machines.BloodUnit.QUARANTINED_to_AVAILABLE
        distinguishing_aspect: >
          An RBC unit's expires_at is collected_at+42d fixed at labeling, while a
          PLATELET unit's expires_at is released_at+5d computed only at release;
          the two variants live on the BloodUnit entity, a different domain than
          the Donor interval dual.
        test_recipe:
          setup:
            - "Two donations collected at 2025-01-01: one labeled RBC (collection-anchored), one PLATELET donation labeled PLATELET (release-anchored)."
            - "Clock advanced to 2025-01-02 before releasing the platelet so released_at=2025-01-02, giving expires_at 2025-01-07; RBC expires_at stays 2025-02-12 regardless of release time."
          setup_api_calls:
            - call: "POST /blood-bank/centers"
              payload: { name: "Metro Blood", region_code: "US-CA" }
              as: CenterAdmin
              captures: { center_id: $.data.id }
            - call: "POST /blood-bank/centers/${center_id}/clock/advance"
              payload: { to_iso8601: "2025-01-01T00:00:00.000Z" }
              as: CenterAdmin
            - call: "POST /blood-bank/donors"
              payload: { center_id: "${center_id}", full_name: "Rita RBC", date_of_birth: "1985-03-03", weight_kg: 70, blood_type: "A_POS" }
              as: IntakeNurse
              captures: { donor_id: $.data.id }
            - call: "POST /blood-bank/slots"
              payload: { center_id: "${center_id}", donation_type: "WHOLE", starts_at: "2025-01-01T08:00:00.000Z", ends_at: "2025-01-01T18:00:00.000Z", capacity: 5 }
              as: CenterAdmin
              captures: { slot_w_id: $.data.id, slot_w_v: $.data.version }
            - call: "POST /blood-bank/appointments"
              payload: { donor_id: "${donor_id}", slot_id: "${slot_w_id}", expected_slot_version: "${slot_w_v}" }
              as: IntakeNurse
              captures: { appt_w_id: $.data.id }
            - call: "POST /blood-bank/appointments/${appt_w_id}/check-in"
              payload: {}
              as: IntakeNurse
            - call: "POST /blood-bank/health-screenings"
              payload: { appointment_id: "${appt_w_id}", hemoglobin_g_dl: 13.0, systolic_bp: 120, pulse_bpm: 70, weight_kg: 70, recent_travel_risk: false, disqualifying_medication: false }
              as: IntakeNurse
            - call: "POST /blood-bank/appointments/${appt_w_id}/donations"
              payload: { volume_ml: 450 }
              as: IntakeNurse
              captures: { don_rbc_id: $.data.id }
            - call: "POST /blood-bank/blood-units"
              payload: { donation_id: "${don_rbc_id}", component: "RBC", din: "DIN-RBC-001" }
              as: LabTechnician
              captures: { unit_rbc_id: $.data.id, rbc_expires: $.data.expires_at }
            - call: "POST /blood-bank/slots"
              payload: { center_id: "${center_id}", donation_type: "PLATELET", starts_at: "2025-01-01T08:00:00.000Z", ends_at: "2025-01-01T18:00:00.000Z", capacity: 5 }
              as: CenterAdmin
              captures: { slot_p_id: $.data.id, slot_p_v: $.data.version }
            - call: "POST /blood-bank/donors"
              payload: { center_id: "${center_id}", full_name: "Pat Platelet", date_of_birth: "1988-04-04", weight_kg: 80, blood_type: "O_NEG" }
              as: IntakeNurse
              captures: { donor_p_id: $.data.id }
            - call: "POST /blood-bank/appointments"
              payload: { donor_id: "${donor_p_id}", slot_id: "${slot_p_id}", expected_slot_version: "${slot_p_v}" }
              as: IntakeNurse
              captures: { appt_p_id: $.data.id }
            - call: "POST /blood-bank/appointments/${appt_p_id}/check-in"
              payload: {}
              as: IntakeNurse
            - call: "POST /blood-bank/health-screenings"
              payload: { appointment_id: "${appt_p_id}", hemoglobin_g_dl: 14.0, systolic_bp: 118, pulse_bpm: 66, weight_kg: 80, recent_travel_risk: false, disqualifying_medication: false }
              as: IntakeNurse
            - call: "POST /blood-bank/appointments/${appt_p_id}/donations"
              payload: { volume_ml: 300 }
              as: IntakeNurse
              captures: { don_plt_id: $.data.id }
            - call: "POST /blood-bank/blood-units"
              payload: { donation_id: "${don_plt_id}", component: "PLATELET", din: "DIN-PLT-001" }
              as: LabTechnician
              captures: { unit_plt_id: $.data.id }
            - call: "POST /blood-bank/centers/${center_id}/clock/advance"
              payload: { to_iso8601: "2025-01-02T00:00:00.000Z" }
              as: CenterAdmin
          trigger:
            - call: "POST /blood-bank/donations/${don_plt_id}/test-results"
              payload: { panel_outcome: "NEGATIVE" }
              as: LabTechnician
            - call: "GET /blood-bank/blood-units/${unit_plt_id}"
              payload: {}
              as: LabTechnician
              captures: { plt_expires: $.data.expires_at, plt_released: $.data.released_at }
          assert:
            - "BloodUnit.${unit_rbc_id}.expires_at == 2025-02-12T00:00:00.000Z (collected_at 2025-01-01 + 42d, collection-anchored, fixed at labeling)"
            - "BloodUnit.${unit_plt_id}.released_at == 2025-01-02T00:00:00.000Z"
            - "BloodUnit.${unit_plt_id}.expires_at == 2025-01-07T00:00:00.000Z (released_at 2025-01-02 + 5d, release-anchored)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: screening_outcome_ordered_multibranch_first_failure
        grounds:
          - calculations.screening_outcome
          - entities.HealthScreening.fields.outcome
          - entities.HealthScreening.fields.failure_reason
        distinguishing_aspect: >
          Mode (a): a >=3-input non-linear formula with five conditional checks
          evaluated in a fixed order where the FIRST failing check wins — a
          screening failing both hemoglobin and vitals reports HEMOGLOBIN_LOW
          (earlier branch), not VITALS_OUT_OF_RANGE.
        test_recipe:
          setup:
            - "A CHECKED_IN appointment exists. Screening submitted with hemoglobin 12.4 (below 12.5) AND systolic_bp 200 (out of range)."
            - "Order pins hemoglobin first, so failure_reason=HEMOGLOBIN_LOW even though vitals also fail."
          setup_api_calls:
            - call: "POST /blood-bank/centers"
              payload: { name: "Metro Blood", region_code: "US-CA" }
              as: CenterAdmin
              captures: { center_id: $.data.id }
            - call: "POST /blood-bank/centers/${center_id}/clock/advance"
              payload: { to_iso8601: "2025-01-01T00:00:00.000Z" }
              as: CenterAdmin
            - call: "POST /blood-bank/donors"
              payload: { center_id: "${center_id}", full_name: "Hank Hgb", date_of_birth: "1991-01-01", weight_kg: 65, blood_type: "B_POS" }
              as: IntakeNurse
              captures: { donor_id: $.data.id }
            - call: "POST /blood-bank/slots"
              payload: { center_id: "${center_id}", donation_type: "WHOLE", starts_at: "2025-01-01T08:00:00.000Z", ends_at: "2025-01-01T18:00:00.000Z", capacity: 5 }
              as: CenterAdmin
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /blood-bank/appointments"
              payload: { donor_id: "${donor_id}", slot_id: "${slot_id}", expected_slot_version: "${slot_v}" }
              as: IntakeNurse
              captures: { appt_id: $.data.id }
            - call: "POST /blood-bank/appointments/${appt_id}/check-in"
              payload: {}
              as: IntakeNurse
          trigger:
            - call: "POST /blood-bank/health-screenings"
              payload: { appointment_id: "${appt_id}", hemoglobin_g_dl: 12.4, systolic_bp: 200, pulse_bpm: 70, weight_kg: 65, recent_travel_risk: false, disqualifying_medication: false }
              as: IntakeNurse
              captures: { outcome: $.data.outcome, reason: $.data.failure_reason }
          assert:
            - "HealthScreening.outcome == FAIL"
            - "HealthScreening.failure_reason == HEMOGLOBIN_LOW (first failing check wins over the later VITALS_OUT_OF_RANGE)"

      - name: plasma_annual_cap_round_per_collection_then_sum
        grounds:
          - calculations.plasma_volume_cap
          - validations[priority=8.6]
          - errors[ERR_ANNUAL_PLASMA_CAP_EXCEEDED]
        distinguishing_aspect: >
          Mode (b): nested-rounding where order matters — three 666 mL plasma
          collections give round-then-sum 2.01 L (rejected) vs sum-then-round
          2.00 L (would pass); the scaffold pins round-then-sum, a different
          combinatorial axis than screening_outcome's ordered branching (mode a).
        test_recipe:
          setup:
            - "Donor with weight 60 (per-collection cap 690) has two prior PLASMA donations of 666 mL each in the 365-day window (annual rounded = 0.67+0.67 = 1.34 L)."
            - "Third PLASMA collection of 666 mL: round-then-sum 0.67*3 = 2.01 > 2.00 cap -> rejected."
          setup_api_calls:
            - call: "POST /blood-bank/centers"
              payload: { name: "Plasma Center", region_code: "US-TX" }
              as: CenterAdmin
              captures: { center_id: $.data.id }
            - call: "POST /blood-bank/centers/${center_id}/clock/advance"
              payload: { to_iso8601: "2025-01-01T00:00:00.000Z" }
              as: CenterAdmin
            - call: "POST /blood-bank/donors"
              payload: { center_id: "${center_id}", full_name: "Paula Plasma", date_of_birth: "1990-02-02", weight_kg: 60, blood_type: "A_NEG" }
              as: IntakeNurse
              captures: { donor_id: $.data.id }
            - call: "POST /blood-bank/slots"
              payload: { center_id: "${center_id}", donation_type: "PLASMA", starts_at: "2025-01-01T08:00:00.000Z", ends_at: "2025-01-01T18:00:00.000Z", capacity: 9 }
              as: CenterAdmin
              captures: { slot1_id: $.data.id, slot1_v: $.data.version }
            - call: "POST /blood-bank/appointments"
              payload: { donor_id: "${donor_id}", slot_id: "${slot1_id}", expected_slot_version: "${slot1_v}" }
              as: IntakeNurse
              captures: { appt1_id: $.data.id }
            - call: "POST /blood-bank/appointments/${appt1_id}/check-in"
              payload: {}
              as: IntakeNurse
            - call: "POST /blood-bank/health-screenings"
              payload: { appointment_id: "${appt1_id}", hemoglobin_g_dl: 13.5, systolic_bp: 120, pulse_bpm: 70, weight_kg: 60, recent_travel_risk: false, disqualifying_medication: false }
              as: IntakeNurse
            - call: "POST /blood-bank/appointments/${appt1_id}/donations"
              payload: { volume_ml: 666 }
              as: IntakeNurse
            - call: "POST /blood-bank/centers/${center_id}/clock/advance"
              payload: { to_iso8601: "2025-02-01T00:00:00.000Z" }
              as: CenterAdmin
            - call: "POST /blood-bank/slots"
              payload: { center_id: "${center_id}", donation_type: "PLASMA", starts_at: "2025-02-01T08:00:00.000Z", ends_at: "2025-02-01T18:00:00.000Z", capacity: 9 }
              as: CenterAdmin
              captures: { slot2_id: $.data.id, slot2_v: $.data.version }
            - call: "POST /blood-bank/appointments"
              payload: { donor_id: "${donor_id}", slot_id: "${slot2_id}", expected_slot_version: "${slot2_v}" }
              as: IntakeNurse
              captures: { appt2_id: $.data.id }
            - call: "POST /blood-bank/appointments/${appt2_id}/check-in"
              payload: {}
              as: IntakeNurse
            - call: "POST /blood-bank/health-screenings"
              payload: { appointment_id: "${appt2_id}", hemoglobin_g_dl: 13.5, systolic_bp: 120, pulse_bpm: 70, weight_kg: 60, recent_travel_risk: false, disqualifying_medication: false }
              as: IntakeNurse
            - call: "POST /blood-bank/appointments/${appt2_id}/donations"
              payload: { volume_ml: 666 }
              as: IntakeNurse
            - call: "POST /blood-bank/centers/${center_id}/clock/advance"
              payload: { to_iso8601: "2025-03-01T00:00:00.000Z" }
              as: CenterAdmin
            - call: "POST /blood-bank/slots"
              payload: { center_id: "${center_id}", donation_type: "PLASMA", starts_at: "2025-03-01T08:00:00.000Z", ends_at: "2025-03-01T18:00:00.000Z", capacity: 9 }
              as: CenterAdmin
              captures: { slot3_id: $.data.id, slot3_v: $.data.version }
            - call: "POST /blood-bank/appointments"
              payload: { donor_id: "${donor_id}", slot_id: "${slot3_id}", expected_slot_version: "${slot3_v}" }
              as: IntakeNurse
              captures: { appt3_id: $.data.id }
            - call: "POST /blood-bank/appointments/${appt3_id}/check-in"
              payload: {}
              as: IntakeNurse
            - call: "POST /blood-bank/health-screenings"
              payload: { appointment_id: "${appt3_id}", hemoglobin_g_dl: 13.5, systolic_bp: 120, pulse_bpm: 70, weight_kg: 60, recent_travel_risk: false, disqualifying_medication: false }
              as: IntakeNurse
          trigger:
            - call: "POST /blood-bank/appointments/${appt3_id}/donations"
              payload: { volume_ml: 666 }
              as: IntakeNurse
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ANNUAL_PLASMA_CAP_EXCEEDED"
            - "HTTP status == 422 (round-then-sum 2.01 L > 2.00 L cap; sum-then-round 2.00 would have passed)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: blood_unit_reserve_unreserve_cycle
        grounds:
          - state_machines.BloodUnit.AVAILABLE_to_RESERVED
          - state_machines.BloodUnit.RESERVED_to_AVAILABLE
          - entities.BloodUnit.fields.status
        distinguishing_aspect: >
          BloodUnit has a true cycle AVAILABLE->RESERVED->AVAILABLE (reserve then
          unreserve returns to the same state), a non-linear shape on the
          BloodUnit entity, distinct from the Donation branching fork instance.
        test_recipe:
          setup:
            - "A unit is AVAILABLE (donation tested NEGATIVE, released). Reserve it, then unreserve it; status returns to AVAILABLE and the bucket counts reconcile."
          setup_api_calls:
            - call: "POST /blood-bank/centers"
              payload: { name: "Metro Blood", region_code: "US-CA" }
              as: CenterAdmin
              captures: { center_id: $.data.id }
            - call: "POST /blood-bank/centers/${center_id}/clock/advance"
              payload: { to_iso8601: "2025-01-01T00:00:00.000Z" }
              as: CenterAdmin
            - call: "POST /blood-bank/donors"
              payload: { center_id: "${center_id}", full_name: "Andy Avail", date_of_birth: "1980-06-06", weight_kg: 75, blood_type: "O_POS" }
              as: IntakeNurse
              captures: { donor_id: $.data.id }
            - call: "POST /blood-bank/slots"
              payload: { center_id: "${center_id}", donation_type: "WHOLE", starts_at: "2025-01-01T08:00:00.000Z", ends_at: "2025-01-01T18:00:00.000Z", capacity: 5 }
              as: CenterAdmin
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /blood-bank/appointments"
              payload: { donor_id: "${donor_id}", slot_id: "${slot_id}", expected_slot_version: "${slot_v}" }
              as: IntakeNurse
              captures: { appt_id: $.data.id }
            - call: "POST /blood-bank/appointments/${appt_id}/check-in"
              payload: {}
              as: IntakeNurse
            - call: "POST /blood-bank/health-screenings"
              payload: { appointment_id: "${appt_id}", hemoglobin_g_dl: 14.0, systolic_bp: 120, pulse_bpm: 70, weight_kg: 75, recent_travel_risk: false, disqualifying_medication: false }
              as: IntakeNurse
            - call: "POST /blood-bank/appointments/${appt_id}/donations"
              payload: { volume_ml: 450 }
              as: IntakeNurse
              captures: { don_id: $.data.id }
            - call: "POST /blood-bank/blood-units"
              payload: { donation_id: "${don_id}", component: "RBC", din: "DIN-CYC-001" }
              as: LabTechnician
              captures: { unit_id: $.data.id }
            - call: "POST /blood-bank/donations/${don_id}/test-results"
              payload: { panel_outcome: "NEGATIVE" }
              as: LabTechnician
            - call: "POST /blood-bank/blood-units/${unit_id}/reserve"
              payload: {}
              as: InventoryManager
              captures: { reserved_status: $.data.status }
          trigger:
            - call: "POST /blood-bank/blood-units/${unit_id}/unreserve"
              payload: {}
              as: InventoryManager
              captures: { final_status: $.data.status }
          assert:
            - "BloodUnit.${unit_id}.status was RESERVED after reserve, then == AVAILABLE after unreserve (cycle closed)"

      - name: donation_collected_branch_fork_releasable_vs_discarded
        grounds:
          - state_machines.Donation.COLLECTED_to_RELEASABLE
          - state_machines.Donation.COLLECTED_to_DISCARDED
          - entities.Donation.fields.status
        distinguishing_aspect: >
          Donation forks from COLLECTED to RELEASABLE (NEGATIVE test, units go
          AVAILABLE) or DISCARDED (POSITIVE test, units DISCARDED + permanent
          deferral) with divergent side-effect sets per branch — a branching
          fork on the Donation entity, distinct from the BloodUnit cycle.
        test_recipe:
          setup:
            - "A COLLECTED donation with a labeled QUARANTINED unit; record a POSITIVE panel so the donation forks to DISCARDED."
          setup_api_calls:
            - call: "POST /blood-bank/centers"
              payload: { name: "Metro Blood", region_code: "US-CA" }
              as: CenterAdmin
              captures: { center_id: $.data.id }
            - call: "POST /blood-bank/centers/${center_id}/clock/advance"
              payload: { to_iso8601: "2025-01-01T00:00:00.000Z" }
              as: CenterAdmin
            - call: "POST /blood-bank/donors"
              payload: { center_id: "${center_id}", full_name: "Polly Positive", date_of_birth: "1979-07-07", weight_kg: 72, blood_type: "AB_POS" }
              as: IntakeNurse
              captures: { donor_id: $.data.id }
            - call: "POST /blood-bank/slots"
              payload: { center_id: "${center_id}", donation_type: "WHOLE", starts_at: "2025-01-01T08:00:00.000Z", ends_at: "2025-01-01T18:00:00.000Z", capacity: 5 }
              as: CenterAdmin
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /blood-bank/appointments"
              payload: { donor_id: "${donor_id}", slot_id: "${slot_id}", expected_slot_version: "${slot_v}" }
              as: IntakeNurse
              captures: { appt_id: $.data.id }
            - call: "POST /blood-bank/appointments/${appt_id}/check-in"
              payload: {}
              as: IntakeNurse
            - call: "POST /blood-bank/health-screenings"
              payload: { appointment_id: "${appt_id}", hemoglobin_g_dl: 14.0, systolic_bp: 120, pulse_bpm: 70, weight_kg: 72, recent_travel_risk: false, disqualifying_medication: false }
              as: IntakeNurse
            - call: "POST /blood-bank/appointments/${appt_id}/donations"
              payload: { volume_ml: 450 }
              as: IntakeNurse
              captures: { don_id: $.data.id }
            - call: "POST /blood-bank/blood-units"
              payload: { donation_id: "${don_id}", component: "RBC", din: "DIN-POS-001" }
              as: LabTechnician
              captures: { unit_id: $.data.id }
          trigger:
            - call: "POST /blood-bank/donations/${don_id}/test-results"
              payload: { panel_outcome: "POSITIVE" }
              as: LabTechnician
            - call: "GET /blood-bank/donations/${don_id}"
              payload: {}
              as: LabTechnician
              captures: { don_status: $.data.status }
            - call: "GET /blood-bank/blood-units/${unit_id}"
              payload: {}
              as: LabTechnician
              captures: { unit_status: $.data.status }
          assert:
            - "Donation.${don_id}.status == DISCARDED (POSITIVE branch, not RELEASABLE)"
            - "BloodUnit.${unit_id}.status == DISCARDED (branch side-effect, never AVAILABLE)"
            - "Donor.${donor_id}.eligibility_status == PERM_DEFERRED (POSITIVE-branch-only side effect)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: recall_cascade_donation_unit_inventory_deferral_depth4
        grounds:
          - state_machines.RecallEvent.OPEN_to_CLOSED
          - state_machines.Donation.COLLECTED_to_DISCARDED
          - state_machines.BloodUnit.AVAILABLE_to_RECALLED
          - calculations.lookback_scope
          - calculations.inventory_recount
          - entities.RecallEvent.fields.units_recalled_count
        distinguishing_aspect: >
          Depth-4 chain triggered by recall creation: recall -> Donation DISCARDED
          (hop1) -> that donation's AVAILABLE unit RECALLED (hop2, caused by hop1)
          -> InventoryBucket.available_count decremented (hop3, caused by hop2) ->
          PERMANENT deferral on POSITIVE_RETEST (hop4); each link caused by the
          prior link. Originates from the recall-events trigger.
        test_recipe:
          setup:
            - "A donor has one AVAILABLE unit (NEGATIVE-tested, released) of type O_POS/RBC counted in its inventory bucket (available_count=1)."
            - "Clock at 2025-01-31; donation collected 2025-01-01 falls in a 60-day lookback. Open a POSITIVE_RETEST recall."
          setup_api_calls:
            - call: "POST /blood-bank/centers"
              payload: { name: "Metro Blood", region_code: "US-CA" }
              as: CenterAdmin
              captures: { center_id: $.data.id }
            - call: "POST /blood-bank/centers/${center_id}/clock/advance"
              payload: { to_iso8601: "2025-01-01T00:00:00.000Z" }
              as: CenterAdmin
            - call: "POST /blood-bank/donors"
              payload: { center_id: "${center_id}", full_name: "Ricky Recall", date_of_birth: "1983-08-08", weight_kg: 78, blood_type: "O_POS" }
              as: IntakeNurse
              captures: { donor_id: $.data.id }
            - call: "POST /blood-bank/slots"
              payload: { center_id: "${center_id}", donation_type: "WHOLE", starts_at: "2025-01-01T08:00:00.000Z", ends_at: "2025-01-01T18:00:00.000Z", capacity: 5 }
              as: CenterAdmin
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /blood-bank/appointments"
              payload: { donor_id: "${donor_id}", slot_id: "${slot_id}", expected_slot_version: "${slot_v}" }
              as: IntakeNurse
              captures: { appt_id: $.data.id }
            - call: "POST /blood-bank/appointments/${appt_id}/check-in"
              payload: {}
              as: IntakeNurse
            - call: "POST /blood-bank/health-screenings"
              payload: { appointment_id: "${appt_id}", hemoglobin_g_dl: 14.0, systolic_bp: 120, pulse_bpm: 70, weight_kg: 78, recent_travel_risk: false, disqualifying_medication: false }
              as: IntakeNurse
            - call: "POST /blood-bank/appointments/${appt_id}/donations"
              payload: { volume_ml: 450 }
              as: IntakeNurse
              captures: { don_id: $.data.id }
            - call: "POST /blood-bank/blood-units"
              payload: { donation_id: "${don_id}", component: "RBC", din: "DIN-REC-001" }
              as: LabTechnician
              captures: { unit_id: $.data.id }
            - call: "POST /blood-bank/donations/${don_id}/test-results"
              payload: { panel_outcome: "NEGATIVE" }
              as: LabTechnician
            - call: "POST /blood-bank/inventory-buckets"
              payload: { center_id: "${center_id}", blood_type: "O_POS", component: "RBC" }
              as: InventoryManager
              captures: { bucket_id: $.data.id, avail_before: $.data.available_count }
            - call: "POST /blood-bank/centers/${center_id}/clock/advance"
              payload: { to_iso8601: "2025-01-31T00:00:00.000Z" }
              as: CenterAdmin
          trigger:
            - call: "POST /blood-bank/recall-events"
              payload: { center_id: "${center_id}", donor_id: "${donor_id}", reason: "POSITIVE_RETEST", lookback_days: 60 }
              as: InventoryManager
              captures: { recall_id: $.data.id, scope_count: $.data.donations_in_scope_count, recalled_count: $.data.units_recalled_count }
            - call: "GET /blood-bank/donations/${don_id}"
              payload: {}
              as: InventoryManager
              captures: { don_status: $.data.status }
            - call: "GET /blood-bank/blood-units/${unit_id}"
              payload: {}
              as: InventoryManager
              captures: { unit_status: $.data.status }
            - call: "GET /blood-bank/inventory-buckets/${bucket_id}"
              payload: {}
              as: InventoryManager
              captures: { avail_after: $.data.available_count }
            - call: "GET /blood-bank/donors/${donor_id}"
              payload: {}
              as: InventoryManager
              captures: { elig: $.data.eligibility_status }
          assert:
            - "RecallEvent.${recall_id}.donations_in_scope_count == 1"
            - "RecallEvent.${recall_id}.units_recalled_count == 1"
            - "Donation.${don_id}.status == DISCARDED (hop1)"
            - "BloodUnit.${unit_id}.status == RECALLED (hop2)"
            - "InventoryBucket.${bucket_id}.available_count == 0 (hop3: was 1 before recall)"
            - "Donor.${donor_id}.eligibility_status == PERM_DEFERRED (hop4, POSITIVE_RETEST)"

      - name: test_positive_cascade_donation_unit_deferral_depth3
        grounds:
          - state_machines.Donation.COLLECTED_to_DISCARDED
          - state_machines.BloodUnit.QUARANTINED_to_DISCARDED
          - entities.Donor.fields.eligibility_status
          - entities.Deferral.fields.category
        distinguishing_aspect: >
          Depth-3 chain triggered by recording a POSITIVE test result: test ->
          Donation DISCARDED (hop1) -> QUARANTINED unit DISCARDED (hop2, caused by
          hop1) -> PERMANENT INFECTIOUS_RISK deferral auto-raised, donor
          PERM_DEFERRED (hop3, caused by hop1). Different trigger (test-results)
          than the recall cascade.
        test_recipe:
          setup:
            - "A COLLECTED donation with a QUARANTINED unit; record a POSITIVE panel."
          setup_api_calls:
