  # ===========================================================================
  - section: validations
    instances:
      - name: role_check_beats_shape_on_referral_create
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=4]", "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "A ReferralCoordinator calling POST /referrals with a malformed body (missing urgency) gets ERR_UNAUTHORIZED_ROLE (priority 2) before shape validation (priority 4) runs."
        test_recipe:
          setup: ["plan + patient exist"]
          setup_api_calls:
            - { call: "POST /insurance-plans", payload: { plan_code: "PPO-1", payer_name: "PayerOne", payer_mix_factor: 1.0 }, as: NetworkAdmin, captures: { plan1: $.data.id } }
            - { call: "POST /patients", payload: { mrn: "M001", full_name: "Pat One", date_of_birth: "1980-01-01", region: "NORTH", insurance_plan_id: "${plan1}" }, as: NetworkAdmin, captures: { pt1: $.data.id } }
          trigger:
            - call: "POST /referrals"
              payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I10" }
              as: ReferralCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE, HTTP 403 (not ERR_INVALID_REQUEST)"

      - name: shape_beats_existence_on_referral_create
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Invalid urgency enum AND nonexistent patient_id in one request -> ERR_INVALID_REQUEST (priority 4) beats the not-found error (priority 5). Distinct pair from the two §1.8 priority instances."
        test_recipe:
          setup: ["provider exists"]
          setup_api_calls:
            - { call: "POST /referring-providers", payload: { name: "Dr A", npi: "2000000001", specialty: "INTERNAL_MEDICINE" }, as: NetworkAdmin, captures: { pa: $.data.id } }
          trigger:
            - call: "POST /referrals"
              payload: { patient_id: "00000000-0000-0000-0000-000000000000", specialty: "CARDIOLOGY", diagnosis_code: "I10", urgency: "STATT" }
              as: ReferringProvider
              as_user_id: "${pa}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, HTTP 400 (not ERR_PATIENT_NOT_FOUND)"

      - name: suspended_provider_cannot_create_referral
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_PROVIDER_SUSPENDED]"]
        distinguishing_aspect: "business_safety: a SUSPENDED referring provider's referral creation is rejected with ERR_PROVIDER_SUSPENDED (403); after reactivate it succeeds (satisfaction probe)."
        test_recipe:
          setup: ["plan; provider PA suspended; patient"]
          setup_api_calls:
            - { call: "POST /insurance-plans", payload: { plan_code: "PPO-1", payer_name: "PayerOne", payer_mix_factor: 1.0 }, as: NetworkAdmin, captures: { plan1: $.data.id } }
            - { call: "POST /referring-providers", payload: { name: "Dr A", npi: "2000000001", specialty: "INTERNAL_MEDICINE" }, as: NetworkAdmin, captures: { pa: $.data.id } }
            - { call: "POST /referring-providers/${pa}/suspend", as: NetworkAdmin }
            - { call: "POST /patients", payload: { mrn: "M001", full_name: "Pat One", date_of_birth: "1980-01-01", region: "NORTH", insurance_plan_id: "${plan1}" }, as: NetworkAdmin, captures: { pt1: $.data.id } }
          trigger:
            - call: "POST /referrals"
              payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I10", urgency: "ROUTINE" }
              as: ReferringProvider
              as_user_id: "${pa}"
              captures: { err: $.data.error_id }
            - { call: "POST /referring-providers/${pa}/reactivate", as: NetworkAdmin }
            - call: "POST /referrals"
              payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I10", urgency: "ROUTINE" }
              as: ReferringProvider
              as_user_id: "${pa}"
          assert:
            - "while suspended: error_id == ERR_PROVIDER_SUSPENDED, HTTP 403"
            - "after reactivate: creation succeeds with 201 and status PENDING_TRIAGE"

      - name: retired_plan_blocks_new_participation
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_PLAN_RETIRED]", state_machines.InsurancePlan.ACTIVE_to_RETIRED]
        distinguishing_aspect: "After retire, new participation rows on the plan fail with ERR_PLAN_RETIRED (409); existing rows are unaffected (conditional validation on plan status)."
        test_recipe:
          setup: ["plan retired; specialist exists"]
          setup_api_calls:
            - { call: "POST /insurance-plans", payload: { plan_code: "PPO-1", payer_name: "PayerOne", payer_mix_factor: 1.0 }, as: NetworkAdmin, captures: { plan1: $.data.id } }
            - { call: "POST /specialty-providers", payload: { name: "S1", npi: "1000000001", specialty: "CARDIOLOGY", base_region: "NORTH", weekly_capacity: 10 }, as: NetworkAdmin, captures: { s1: $.data.id } }
            - { call: "POST /network-participations", payload: { specialist_id: "${s1}", insurance_plan_id: "${plan1}", tier: "PREFERRED", effective_from: "2026-01-01", effective_to: "2026-06-30" }, as: NetworkAdmin, captures: { np1: $.data.id } }
            - { call: "POST /insurance-plans/${plan1}/retire", as: NetworkAdmin }
          trigger:
            - call: "POST /network-participations"
              payload: { specialist_id: "${s1}", insurance_plan_id: "${plan1}", tier: "STANDARD", effective_from: "2026-07-01", effective_to: "2026-12-31" }
              as: NetworkAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PLAN_RETIRED, HTTP 409"
            - "pre-existing participation ${np1} remains ACTIVE (GET /network-participations/${np1})"

      - name: duplicate_identity_uniqueness_matrix
        claim_type: violation_to_error
        grounds: ["errors[ERR_DUPLICATE_MRN]", "errors[ERR_DUPLICATE_NPI]", "errors[ERR_DUPLICATE_PLAN_CODE]", "errors[ERR_DUPLICATE_AUTH_RULE]"]
        distinguishing_aspect: "Uniqueness constraints: duplicate patient mrn, npi reused across provider TYPES (specialist vs referring), duplicate plan_code, and duplicate ACTIVE (specialty, plan) auth rule each return their domain error."
        test_recipe:
          setup: ["one plan, one referring provider (npi 2000000001), one patient (mrn M001), one ACTIVE CARDIOLOGY auth rule all exist"]
          setup_api_calls:
            - { call: "POST /insurance-plans", payload: { plan_code: "PPO-1", payer_name: "PayerOne", payer_mix_factor: 1.0 }, as: NetworkAdmin, captures: { plan1: $.data.id } }
            - { call: "POST /referring-providers", payload: { name: "Dr A", npi: "2000000001", specialty: "INTERNAL_MEDICINE" }, as: NetworkAdmin, captures: { pa: $.data.id } }
            - { call: "POST /patients", payload: { mrn: "M001", full_name: "Pat One", date_of_birth: "1980-01-01", region: "NORTH", insurance_plan_id: "${plan1}" }, as: NetworkAdmin }
            - { call: "POST /prior-auth-rules", payload: { specialty: "CARDIOLOGY", insurance_plan_id: "${plan1}", requires_auth: true, auth_validity_days: 10 }, as: NetworkAdmin }
          trigger:
            - call: "POST /patients"
              payload: { mrn: "M001", full_name: "Pat Two", date_of_birth: "1990-01-01", region: "SOUTH", insurance_plan_id: "${plan1}" }
              as: NetworkAdmin
              captures: { e1: $.data.error_id }
            - call: "POST /specialty-providers"
              payload: { name: "S1", npi: "2000000001", specialty: "CARDIOLOGY", base_region: "NORTH", weekly_capacity: 10 }
              as: NetworkAdmin
              captures: { e2: $.data.error_id }
            - call: "POST /insurance-plans"
              payload: { plan_code: "PPO-1", payer_name: "PayerTwo", payer_mix_factor: 0.9 }
              as: NetworkAdmin
              captures: { e3: $.data.error_id }
            - call: "POST /prior-auth-rules"
              payload: { specialty: "CARDIOLOGY", insurance_plan_id: "${plan1}", requires_auth: false, auth_validity_days: 5 }
              as: NetworkAdmin
              captures: { e4: $.data.error_id }
          assert:
            - "e1 == ERR_DUPLICATE_MRN; e2 == ERR_DUPLICATE_NPI (cross-type uniqueness); e3 == ERR_DUPLICATE_PLAN_CODE; e4 == ERR_DUPLICATE_AUTH_RULE (all HTTP 409)"

      - name: window_shape_validation_matrix
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_WINDOW]"]
        distinguishing_aspect: "Window-shape errors: scheduled_end <= scheduled_start, scheduled_start in the past, and effective_to < effective_from all fail with ERR_INVALID_WINDOW (400) before any overlap logic runs."
        test_recipe:
          setup: ["clock 2026-08-01T00:00:00Z; full bootstrap with accepted+assigned referral"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /insurance-plans", payload: { plan_code: "PPO-1", payer_name: "PayerOne", payer_mix_factor: 1.0 }, as: NetworkAdmin, captures: { plan1: $.data.id } }
