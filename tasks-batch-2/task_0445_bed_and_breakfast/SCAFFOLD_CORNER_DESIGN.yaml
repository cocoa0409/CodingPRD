          assert:
            - "Booking.${bk_id}.package_charge_cents == 11000"   # 5000 + 2000*3
            - "Booking.${bk_id}.total_cents == 41000"           # room 30000 + pkg 11000 + tax 0

      - name: lodging_tax_excludes_nontaxable_package
        claim_type: Input Set Filtering
        grounds: [calculations.lodging_tax, entities.Package.fields.is_taxable, entities.Booking.fields.taxable_base_cents]
        distinguishing_aspect: "With a non-taxable package, taxable_base_cents equals room_charge only; package add-on is excluded from tax."
        test_recipe:
          setup: ["Inn tax 1450; Room base 30000 taxable; Package flat 10000 is_taxable false; 3-night booking."]
          setup_api_calls:
            - call: "POST /inns"
