          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "ACTIVE agreement AGR-A (ON_IMPLANT, UNIT_MATCH); one released lot with one consigned unit SN-0001 at 462500."
            - "The unit reserved to a SCHEDULED case, then that case started and the unit implanted and VERIFIED."
