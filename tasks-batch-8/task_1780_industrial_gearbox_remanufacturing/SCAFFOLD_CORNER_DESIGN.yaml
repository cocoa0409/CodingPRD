        claim_type: correct_result
        grounds: ["calculations.freight_charge"]
        distinguishing_aspect: "Boundary: exactly 2000kg is still the flat 120000 tier (139000 with 2 rigging hours); 2001kg enters the overweight tier (157000). The <= boundary is inclusive."
        test_recipe:
