          setup:
            - "Clock at 2026-05-01T16:00:00Z; one navigator, three HIGH-tier episodes for three patients."
            - "Episode A already holds a SCHEDULED visit for that navigator from 2026-05-05T15:00:00Z to 2026-05-05T16:00:00Z."
