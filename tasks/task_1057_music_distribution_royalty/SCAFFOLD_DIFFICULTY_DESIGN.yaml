            - call: "POST /api/releases"
              payload: { artist_id: "${artist_id}", title: "Pod", release_date: "2026-09-01T00:00:00Z", primary_genre: "Ambient", label_name: "Orca Rec", upc: "112345678953" }
              as: Artist
