          assert:
            - "${tp1_author} == eng-1 and ${cfg_proposer} == eng-1 — the two comparands are recorded from X-User-ID at authoring time, not supplied by the client"
            - "${pc1_result} == FAIL with ${pc1_reason} == PED_CLEAR_SHORT and ${pc1_req_clear} == 17.8, which is what makes the check waivable at all"
            - "${e_sod_early_certify} == ERR_SEGREGATION_OF_DUTIES with HTTP 403 — the plan is still COORDINATED, so priority 15 pre-empts the priority-40 ERR_PLAN_NOT_SUBMITTED that a role-clean caller would have seen"
            - "${e_sod_waive} == ERR_SEGREGATION_OF_DUTIES with HTTP 403, while the identical call one line later as cert-1 succeeds: ${pc1_result2} == WAIVED with ${pc1_waived_by} == cert-1 — the discriminator is X-User-ID alone"
            - "${tp1_status} == SUBMITTED with ${tp1_ped_state} == WAIVED"
            - "${e_sod_certify} == ERR_SEGREGATION_OF_DUTIES with HTTP 403, then ${tp1_status2} == CERTIFIED with ${tp1_certifier} == cert-1"
            - "${e_sod_approve} == ERR_SEGREGATION_OF_DUTIES with HTTP 403 keyed on PriorityConfig.proposed_by_user_id, then ${cfg_appr} == APPROVED with ${cfg_approver} == cert-1"
            - "each refusal writes nothing: the plan is still certifiable and the config still approvable on the immediately following call"

      - name: public_requester_is_scoped_to_their_own_row_while_the_liaison_is_not
        claim_type: ownership_scoping
        grounds:
          - roles.PublicRequester.identity
          - validations[priority 16 ERR_NOT_RESOURCE_OWNER]
          - roles.CitizenLiaison.shared_operations
        distinguishing_aspect: "PublicRequester's identity is entity_backed:Requester, so X-User-ID IS a Requester.id and the ownership gate is a comparison against persisted data rather than a claim in the header. The gate is one-sided: it constrains PublicRequester on exactly the three endpoints in its applies_to list and leaves CitizenLiaison — who shares all three — completely unscoped. It also sits at priority 16, above existence at 20, so a PublicRequester naming a requester_id that does not exist gets 403 rather than 404: they are not permitted to learn whether that row exists."
        test_recipe:
          setup:
            - "Clock at its startup default 2026-08-01T00:00:00Z."
            - "One corridor to complain about, and two registered requesters r1 and r2."
            - "FAKE := 11111111-1111-4111-8111-111111111111, a syntactically valid UUID that names no Requester."
          setup_api_calls:
            - call: "POST /signal-ops/corridors"
              payload: { name: "Main St 1st-3rd", jurisdiction_class: "ARTERIAL", annual_volume_change_pct: 20.0 }
              as: SignalOpsAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /signal-ops/requesters"
              payload: { display_name: "Dana Reyes", email: "dana@example.org" }
              as: CitizenLiaison
              as_user_id: "liaison-1"
              captures: { r1_id: $.data.id }
            - call: "POST /signal-ops/requesters"
              payload: { display_name: "Sam Okafor", email: "sam@example.org" }
              as: CitizenLiaison
              as_user_id: "liaison-1"
              captures: { r2_id: $.data.id }
          trigger:
            - call: "GET /signal-ops/requesters/${r1_id}"
              payload: {}
              as: PublicRequester
              as_user_id: "${r1_id}"
              captures: { own_row_name: $.data.display_name, own_open0: $.data.open_complaint_count }
            - call: "GET /signal-ops/requesters/${r2_id}"
              payload: {}
              as: PublicRequester
              as_user_id: "${r1_id}"
              captures: { e_foreign_row: $.data.error_id }
            - call: "GET /signal-ops/requesters/${r2_id}/complaints"
              payload: {}
              as: PublicRequester
              as_user_id: "${r1_id}"
              captures: { e_foreign_list: $.data.error_id }
            - call: "GET /signal-ops/requesters/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: PublicRequester
              as_user_id: "${r1_id}"
              captures: { e_absent_row: $.data.error_id }
            - call: "POST /signal-ops/complaints"
              payload: { requester_id: "${r2_id}", corridor_id: "${c1_id}", category: "SIGNAL_TIMING", narrative: "Filed on somebody else's behalf." }
              as: PublicRequester
              as_user_id: "${r1_id}"
              captures: { e_foreign_file: $.data.error_id }
            - call: "POST /signal-ops/complaints"
              payload: { requester_id: "${r1_id}", corridor_id: "${c1_id}", category: "SIGNAL_TIMING", narrative: "Northbound queue never clears in the morning." }
              as: PublicRequester
              as_user_id: "${r1_id}"
              captures: { cmp1_id: $.data.id, cmp1_requester: $.data.requester_id, cmp1_status: $.data.status }
            - call: "GET /signal-ops/requesters/${r1_id}/complaints"
              payload: {}
              as: PublicRequester
              as_user_id: "${r1_id}"
              captures: { own_list_total: $.total_count, own_list_first: "$.data[0].id" }
            - call: "GET /signal-ops/requesters/${r1_id}"
              payload: {}
              as: PublicRequester
              as_user_id: "${r1_id}"
              captures: { own_open1: $.data.open_complaint_count }
            - call: "POST /signal-ops/complaints"
              payload: { requester_id: "${r2_id}", corridor_id: "${c1_id}", category: "PEDESTRIAN", narrative: "Walk interval is too short at 1st Ave." }
              as: CitizenLiaison
              as_user_id: "liaison-1"
              captures: { cmp2_id: $.data.id, cmp2_requester: $.data.requester_id }
            - call: "GET /signal-ops/requesters/${r2_id}"
              payload: {}
              as: CitizenLiaison
              as_user_id: "liaison-1"
              captures: { liaison_foreign_open: $.data.open_complaint_count }
            - call: "GET /signal-ops/requesters/${r1_id}/complaints"
              payload: {}
              as: CitizenLiaison
              as_user_id: "liaison-1"
              captures: { liaison_r1_total: $.total_count }
            - call: "POST /signal-ops/complaints/${cmp2_id}/triage"
              payload: { disposition: "TRIAGE" }
              as: PublicRequester
              as_user_id: "${r2_id}"
              captures: { e_public_triage: $.data.error_id }
          assert:
            - "${own_row_name} == Dana Reyes and ${own_open0} == 0 — reading one's own row is permitted"
            - "${e_foreign_row} == ERR_NOT_RESOURCE_OWNER with HTTP 403 and ${e_foreign_list} == ERR_NOT_RESOURCE_OWNER with HTTP 403"
            - "${e_absent_row} == ERR_NOT_RESOURCE_OWNER with HTTP 403, NOT ERR_REQUESTER_NOT_FOUND — priority 16 pre-empts the priority-20 existence gate, so a non-owner cannot probe for existence"
            - "${e_foreign_file} == ERR_NOT_RESOURCE_OWNER with HTTP 403 — the body's requester_id is the comparand on POST /signal-ops/complaints"
            - "${cmp1_requester} == ${r1_id} and ${cmp1_status} == OPEN when the requester_id matches X-User-ID"
            - "${own_list_total} == 1 with ${own_list_first} == ${cmp1_id}, and ${own_open1} == 1 — the denormalised counter moved on the accepted filing only"
            - "${cmp2_requester} == ${r2_id}: CitizenLiaison may file for ANY requester, so the identical body that was refused for the public user is accepted here — the gate keys on the role's identity model, not on the payload"
            - "${liaison_foreign_open} == 1 and ${liaison_r1_total} == 1 — the liaison reads both requesters' rows and lists without restriction"
            - "${e_public_triage} == ERR_ROLE_NOT_PERMITTED with HTTP 403 — triage is CitizenLiaison-exclusive, so even the complaint's OWN requester is stopped at priority 10 before ownership is ever considered"

