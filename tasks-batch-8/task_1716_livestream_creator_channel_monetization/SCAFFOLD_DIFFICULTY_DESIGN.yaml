              as: Creator
              as_user_id: "${ch_id}"
              captures: { d_id: $.data.id }
            - call: "POST /api/deals/${d_id}/transition"
              payload: { action: "PROPOSE" }
              as: Creator
              as_user_id: "${ch_id}"
            - call: "POST /api/deals/${d_id}/transition"
