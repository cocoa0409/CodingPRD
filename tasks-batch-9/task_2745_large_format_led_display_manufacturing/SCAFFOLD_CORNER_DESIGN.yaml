      - name: request_shape_outranks_reference_existence
        claim_type: priority_ordering
        grounds:
          - validations[priority=3]
          - validations[priority=4]
          - errors.ERR_VALIDATION_FAILED
          - errors.ERR_REFERENCE_NOT_FOUND
        distinguishing_aspect: |
          A request that is both malformed AND points at a missing display model has
          to fail on shape (400), not on existence (404). This is the boundary
          between the generic body check and the first database read, and it is easy
          to invert: an implementation that resolves display_model_id up front in
          order to validate min_viewing_distance_m against the model's recommendation
          returns 404 for a request that never had a legal install_environment.
        test_recipe:
          setup:
            - "No display model with the id 00000000-0000-0000-0000-0000000000ff exists; a real FP10-IN model ${dm} does."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
