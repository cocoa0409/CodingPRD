            - { call: "POST /rate-card-entries", payload: { station_id: "${st}", daypart: "MORNING_DRIVE", weekday_set: ["MON"], base_rate_cents: 1200, min_rate_cents: 100, effective_from: "2026-07-01", effective_to: "2026-12-31" }, as: SalesManager, captures: { rc3: $.data.id } }
          assert:
