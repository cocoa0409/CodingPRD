          - entities.TreatmentStage.fields.stage_index
        distinguishing_aspect: |
          Two objectives map to two roles through OBJECTIVE_ROLE_MAP, and STAGE_ORDER pins the
          train as FILTRATION then DISINFECTION regardless of the order the objectives were
          declared: stage_index 1 has upstream_stage_id null while stage_index 2 points back at
          stage 1, and each stage is costed on its own 6.000 mgd peak flow (371400000 and
          119304000).
