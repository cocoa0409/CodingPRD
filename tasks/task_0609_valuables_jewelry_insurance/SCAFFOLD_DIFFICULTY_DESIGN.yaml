# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# valuables-jewelry-insurance — Expert band
# 9 Difficulty Rules x 2 instances = 18 instances
# All asserts use literals pre-computed against §1.3 formulas + constants.
# =============================================================================
scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      # --- Instance 1: settlement on Claim domain (AGREED_VALUE vs REPLACEMENT_COST) ---
      - name: settlement_agreed_vs_replacement_total_loss
        grounds:
          - calculations.claim_settlement
          - state_machines.Claim.UNDER_REVIEW_to_APPROVED
          - entities.Policy.fields.valuation_basis
          - entities.Claim.fields.settlement_cents
        distinguishing_aspect: |
          For an identical RING (scheduled 1,000,000, current 1,100,000 after 2 SIMPLE epochs,
          deductible STANDARD=50,000) a TOTAL_LOSS claim settles 1,050,000 under AGREED_VALUE but
          850,000 under REPLACEMENT_COST — divergence lives on the Claim entity domain.
        test_recipe:
          setup:
            - "RiskZone prefix 100 rate_per_thousand 300 exists."
            - "Two policyholders each with a RING (scheduled 1,000,000, loc 100xx), one policy AGREED_VALUE the other REPLACEMENT_COST, both inflation_guard SIMPLE 0.05, STANDARD deductible, ALL_RISK, bound+paid+ACTIVE at 2026-02-01, clock advanced 24 months so revaluation_epoch==2 and current_value_cents==1,100,000."
            - "On each, a TOTAL_LOSS THEFT claim is filed, reviewed, and approved."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Underwriter
            - call: "POST /risk-zones"
              payload: { zip_prefix: "100", risk_band: "MODERATE", rate_per_thousand_cents: 300 }
              as: Underwriter
            - call: "POST /policyholders"
              payload: { email: "ag@x.com", full_name: "Ag Holder", residence_zip: "10001" }
              as: Underwriter
              captures: { ph_ag: $.data.id }
            - call: "POST /policyholders"
              payload: { email: "rc@x.com", full_name: "Rc Holder", residence_zip: "10001" }
              as: Underwriter
              captures: { ph_rc: $.data.id }
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_ag}", coverage_type: "ALL_RISK", valuation_basis: "AGREED_VALUE", deductible_option: "STANDARD", inflation_guard_mode: "SIMPLE", inflation_guard_pct: 0.05 }
              as: Underwriter
              captures: { pol_ag: $.data.id }
            - call: "POST /policies/${pol_ag}/scheduled-items"
              payload: { description: "Solitaire ring", category: "RING", location_zip: "10001", scheduled_value_cents: 1000000 }
              as: Underwriter
              captures: { it_ag: $.data.id }
            - call: "POST /policies/${pol_ag}/bind"
              payload: {}
              as: Underwriter
              captures: { pol_ag_v: $.data.version }
            - call: "POST /policies/${pol_ag}/payments"
              payload: { amount_cents: 5000000 }
              as: Policyholder
              as_user_id: "${ph_ag}"
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_rc}", coverage_type: "ALL_RISK", valuation_basis: "REPLACEMENT_COST", deductible_option: "STANDARD", inflation_guard_mode: "SIMPLE", inflation_guard_pct: 0.05 }
              as: Underwriter
              captures: { pol_rc: $.data.id }
            - call: "POST /policies/${pol_rc}/scheduled-items"
              payload: { description: "Solitaire ring", category: "RING", location_zip: "10001", scheduled_value_cents: 1000000 }
              as: Underwriter
              captures: { it_rc: $.data.id }
            - call: "POST /policies/${pol_rc}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${pol_rc}/payments"
              payload: { amount_cents: 5000000 }
              as: Policyholder
              as_user_id: "${ph_rc}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-02-01T00:00:00Z" }
              as: Underwriter
            # Both policies stay ACTIVE+PAID across the advance (a PAID policy never lapses on a
            # clock advance), so claims can be filed directly against current_value_cents == 1,100,000.
            - call: "POST /policies/${pol_ag}/claims"
              payload: { scheduled_item_id: "${it_ag}", peril: "THEFT", loss_type: "TOTAL_LOSS", claimed_amount_cents: 1100000 }
              as: ClaimsAdjuster
              captures: { cl_ag: $.data.id }
            - call: "POST /policies/${pol_ag}/claims/${cl_ag}/start_review"
              payload: {}
              as: ClaimsAdjuster
              captures: { cl_ag_v: $.data.version }
            - call: "POST /policies/${pol_rc}/claims"
              payload: { scheduled_item_id: "${it_rc}", peril: "THEFT", loss_type: "TOTAL_LOSS", claimed_amount_cents: 1100000 }
              as: ClaimsAdjuster
              captures: { cl_rc: $.data.id }
            - call: "POST /policies/${pol_rc}/claims/${cl_rc}/start_review"
              payload: {}
              as: ClaimsAdjuster
              captures: { cl_rc_v: $.data.version }
          trigger:
            - call: "POST /policies/${pol_ag}/claims/${cl_ag}/approve"
              payload: { expected_claim_version: "${cl_ag_v}" }
              as: ClaimsAdjuster
            - call: "POST /policies/${pol_rc}/claims/${cl_rc}/approve"
              payload: { expected_claim_version: "${cl_rc_v}" }
              as: ClaimsAdjuster
          assert:
            - "Claim.${cl_ag}.settlement_cents == 1050000"
            - "Claim.${cl_rc}.settlement_cents == 850000"
            - "Claim.${cl_ag}.deductible_applied_cents == 50000"

      # --- Instance 2: revaluation on ScheduledItem domain (SIMPLE vs COMPOUND) ---
      - name: revaluation_simple_vs_compound_guard
        grounds:
          - calculations.item_revaluation
          - entities.Policy.fields.inflation_guard_mode
          - entities.ScheduledItem.fields.current_value_cents
          - entities.ScheduledItem.fields.revaluation_epoch
        distinguishing_aspect: |
          Same item (scheduled 1,000,000, pct 0.05, 3 epochs) revalues to 1,150,000 under SIMPLE
          but 1,157,625 under COMPOUND — the dual variant lives on the ScheduledItem domain, a
          different entity than claim_settlement's Claim domain.
        test_recipe:
          setup:
            - "RiskZone prefix 100 rate 300 exists."
            - "Two ACTIVE policies, one inflation SIMPLE 0.05, one COMPOUND 0.05, each with a RING scheduled 1,000,000, bound+paid at 2026-02-01, clock advanced 36 months (3 epochs)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Underwriter
            - call: "POST /risk-zones"
              payload: { zip_prefix: "100", risk_band: "MODERATE", rate_per_thousand_cents: 300 }
              as: Underwriter
            - call: "POST /policyholders"
              payload: { email: "s@x.com", full_name: "S H", residence_zip: "10001" }
              as: Underwriter
              captures: { ph_s: $.data.id }
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_s}", coverage_type: "ALL_RISK", valuation_basis: "AGREED_VALUE", deductible_option: "STANDARD", inflation_guard_mode: "SIMPLE", inflation_guard_pct: 0.05 }
              as: Underwriter
              captures: { pol_s: $.data.id }
            - call: "POST /policies/${pol_s}/scheduled-items"
              payload: { description: "Ring", category: "RING", location_zip: "10001", scheduled_value_cents: 1000000 }
              as: Underwriter
              captures: { it_s: $.data.id }
            - call: "POST /policies/${pol_s}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${pol_s}/payments"
              payload: { amount_cents: 5000000 }
              as: Policyholder
              as_user_id: "${ph_s}"
            - call: "POST /policyholders"
              payload: { email: "c@x.com", full_name: "C H", residence_zip: "10001" }
              as: Underwriter
              captures: { ph_c: $.data.id }
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_c}", coverage_type: "ALL_RISK", valuation_basis: "AGREED_VALUE", deductible_option: "STANDARD", inflation_guard_mode: "COMPOUND", inflation_guard_pct: 0.05 }
              as: Underwriter
              captures: { pol_c: $.data.id }
            - call: "POST /policies/${pol_c}/scheduled-items"
              payload: { description: "Ring", category: "RING", location_zip: "10001", scheduled_value_cents: 1000000 }
              as: Underwriter
              captures: { it_c: $.data.id }
            - call: "POST /policies/${pol_c}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${pol_c}/payments"
              payload: { amount_cents: 5000000 }
              as: Policyholder
              as_user_id: "${ph_c}"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2029-02-01T00:00:00Z" }
              as: Underwriter
          assert:
            - "ScheduledItem.${it_s}.current_value_cents == 1150000"
            - "ScheduledItem.${it_c}.current_value_cents == 1157625"
            - "ScheduledItem.${it_s}.revaluation_epoch == 3"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      # --- Mode (a): non-linear multi-input tiered premium ---
      - name: premium_tiered_multifactor_single_item
        grounds:
          - calculations.item_annual_premium
          - state_machines.Policy.QUOTED_to_BOUND
          - entities.Policy.fields.annual_premium_cents
          - entities.RiskZone.fields.rate_per_thousand_cents
        distinguishing_aspect: |
          A WATCH worth 3,000,000 in a catastrophe-loaded zone (rate 200) under ALL_RISK + STANDARD
          deductible binds to item premium 12,264: base 6000 x category 1.20 x coverage 1.30 x tier
          1.25 x deductible-credit 0.92 -> round_half_up 10,764, then +1,500 flat catastrophe surcharge.
          This is mode (a): >=3 inputs with nested tier-selection and a multiplicative-then-additive chain.
        test_recipe:
          setup:
            - "RiskZone prefix 200 rate 200 catastrophe_loaded true exists."
            - "Policy ALL_RISK / AGREED_VALUE / STANDARD with one WATCH scheduled 3,000,000 in loc 200xx, plus a backing VALID appraisal (value > 1,000,000 threshold)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Underwriter
            - call: "POST /risk-zones"
              payload: { zip_prefix: "200", risk_band: "HIGH", rate_per_thousand_cents: 200, catastrophe_loaded: true }
              as: Underwriter
            - call: "POST /policyholders"
              payload: { email: "w@x.com", full_name: "W H", residence_zip: "20001" }
              as: Underwriter
              captures: { ph_w: $.data.id }
            - call: "POST /appraisals"
              payload: { policyholder_id: "${ph_w}", appraised_value_cents: 3000000, effective_date_iso: "2026-01-15T00:00:00Z" }
              as: Appraiser
              captures: { ap_w: $.data.id }
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_w}", coverage_type: "ALL_RISK", valuation_basis: "AGREED_VALUE", deductible_option: "STANDARD" }
              as: Underwriter
              captures: { pol_w: $.data.id }
            - call: "POST /policies/${pol_w}/scheduled-items"
              payload: { description: "Lux watch", category: "WATCH", location_zip: "20001", scheduled_value_cents: 3000000, appraisal_id: "${ap_w}" }
              as: Underwriter
              captures: { it_w: $.data.id }
          trigger:
            - call: "POST /policies/${pol_w}/bind"
              payload: {}
              as: Underwriter
          assert:
            - "Policy.${pol_w}.annual_premium_cents == 12264"
            - "Policy.${pol_w}.total_insured_value_cents == 3000000"
            - "ScheduledItem.${it_w}.current_value_cents == 3000000"

      # --- Mode (b): rounding-order pin (round-per-item then sum) ---
      - name: premium_round_per_item_then_sum
        grounds:
          - calculations.policy_annual_premium
          - calculations.item_annual_premium
          - entities.Policy.fields.annual_premium_cents
        distinguishing_aspect: |
          Two WATCH items whose raw premiums are 2968.68 (cv 1,000,000, rate 173) and 2951.69
          (cv 1,030,000, rate 167) bind to 2969 + 2952 = 5921 cents under the pinned round-per-item-
          then-sum order; sum-then-round would yield 5920. The 1-cent gap proves the pinned order. This
          is mode (b), distinct from the mode-(a) tiered formula above.
        test_recipe:
          setup:
            - "RiskZone prefix 300 rate 173 and prefix 301 rate 167 exist (both non-catastrophe)."
            - "Policy ALL_RISK / AGREED_VALUE / LOW with two WATCH items: cv 1,000,000 in loc 300xx and cv 1,030,000 in loc 301xx."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Underwriter
            - call: "POST /risk-zones"
              payload: { zip_prefix: "300", risk_band: "MODERATE", rate_per_thousand_cents: 173 }
              as: Underwriter
            - call: "POST /risk-zones"
              payload: { zip_prefix: "301", risk_band: "MODERATE", rate_per_thousand_cents: 167 }
              as: Underwriter
            - call: "POST /policyholders"
              payload: { email: "r@x.com", full_name: "R H", residence_zip: "30001" }
              as: Underwriter
              captures: { ph_r: $.data.id }
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_r}", coverage_type: "ALL_RISK", valuation_basis: "AGREED_VALUE", deductible_option: "LOW" }
              as: Underwriter
              captures: { pol_r: $.data.id }
            - call: "POST /policies/${pol_r}/scheduled-items"
              payload: { description: "Watch A", category: "WATCH", location_zip: "30001", scheduled_value_cents: 1000000 }
              as: Underwriter
              captures: { it_ra: $.data.id }
            - call: "POST /policies/${pol_r}/scheduled-items"
              payload: { description: "Watch B", category: "WATCH", location_zip: "30101", scheduled_value_cents: 1030000 }
              as: Underwriter
              captures: { it_rb: $.data.id }
          trigger:
            - call: "POST /policies/${pol_r}/bind"
              payload: {}
              as: Underwriter
          assert:
            - "Policy.${pol_r}.annual_premium_cents == 5921"
            - "Policy.${pol_r}.total_insured_value_cents == 2030000"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      # --- Cyclic: Claim review loop ---
      - name: claim_cyclic_review_loop_bounded
        grounds:
          - state_machines.Claim.UNDER_REVIEW_to_INFO_REQUESTED
          - state_machines.Claim.INFO_REQUESTED_to_UNDER_REVIEW
          - entities.Claim.fields.info_request_count
        distinguishing_aspect: |
          Claim cycles UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW twice (info_request_count reaches 2);
          a 3rd request_info is rejected with ERR_INFO_REQUEST_LIMIT — a genuine cycle on the Claim entity,
          distinct from RepairOrder's branching shape.
        test_recipe:
          setup:
            - "ACTIVE policy with a RING; a TOTAL_LOSS claim filed and in UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Underwriter
            - call: "POST /risk-zones"
              payload: { zip_prefix: "100", risk_band: "MODERATE", rate_per_thousand_cents: 300 }
              as: Underwriter
            - call: "POST /policyholders"
              payload: { email: "cy@x.com", full_name: "Cy H", residence_zip: "10001" }
              as: Underwriter
              captures: { ph_cy: $.data.id }
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_cy}", coverage_type: "ALL_RISK", valuation_basis: "AGREED_VALUE", deductible_option: "STANDARD" }
              as: Underwriter
              captures: { pol_cy: $.data.id }
            - call: "POST /policies/${pol_cy}/scheduled-items"
              payload: { description: "Ring", category: "RING", location_zip: "10001", scheduled_value_cents: 1000000 }
              as: Underwriter
              captures: { it_cy: $.data.id }
            - call: "POST /policies/${pol_cy}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${pol_cy}/payments"
              payload: { amount_cents: 5000000 }
              as: Policyholder
              as_user_id: "${ph_cy}"
            - call: "POST /policies/${pol_cy}/claims"
              payload: { scheduled_item_id: "${it_cy}", peril: "THEFT", loss_type: "TOTAL_LOSS", claimed_amount_cents: 1000000 }
              as: ClaimsAdjuster
              captures: { cl_cy: $.data.id }
            - call: "POST /policies/${pol_cy}/claims/${cl_cy}/start_review"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /policies/${pol_cy}/claims/${cl_cy}/request_info"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /policies/${pol_cy}/claims/${cl_cy}/provide_info"
              payload: {}
              as: Policyholder
              as_user_id: "${ph_cy}"
            - call: "POST /policies/${pol_cy}/claims/${cl_cy}/request_info"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /policies/${pol_cy}/claims/${cl_cy}/provide_info"
              payload: {}
              as: Policyholder
              as_user_id: "${ph_cy}"
          trigger:
            - call: "POST /policies/${pol_cy}/claims/${cl_cy}/request_info"
              payload: {}
              as: ClaimsAdjuster
              captures: { err: $.data.error_id }
          assert:
            - "Claim.${cl_cy}.info_request_count == 2"
            - "trigger response data.error_id == ERR_INFO_REQUEST_LIMIT"
            - "trigger response status == 409"

      # --- Parallel dimensions: Policy coverage_status x billing_status ---
      - name: policy_parallel_coverage_billing_dimensions
        grounds:
          - state_machines.Policy.BOUND_to_ACTIVE
          - state_machines.Policy.PAID_to_PAST_DUE
          - entities.Policy.fields.coverage_status
          - entities.Policy.fields.billing_status
        distinguishing_aspect: |
          After bind+pay the policy is (coverage_status ACTIVE, billing_status PAID); reversing the
          payment flips billing_status to PAST_DUE while coverage_status stays ACTIVE — two state axes
          evolve independently on the same Policy row, a parallel-dimensions machine distinct from the
          Claim cycle.
        test_recipe:
          setup:
            - "ACTIVE+PAID policy with one RING and a received premium payment."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Underwriter
            - call: "POST /risk-zones"
              payload: { zip_prefix: "100", risk_band: "MODERATE", rate_per_thousand_cents: 300 }
              as: Underwriter
            - call: "POST /policyholders"
              payload: { email: "pp@x.com", full_name: "Pp H", residence_zip: "10001" }
              as: Underwriter
              captures: { ph_pp: $.data.id }
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_pp}", coverage_type: "ALL_RISK", valuation_basis: "AGREED_VALUE", deductible_option: "STANDARD" }
              as: Underwriter
              captures: { pol_pp: $.data.id }
            - call: "POST /policies/${pol_pp}/scheduled-items"
              payload: { description: "Ring", category: "RING", location_zip: "10001", scheduled_value_cents: 1000000 }
              as: Underwriter
            - call: "POST /policies/${pol_pp}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${pol_pp}/payments"
              payload: { amount_cents: 5000000 }
              as: Policyholder
              as_user_id: "${ph_pp}"
              captures: { pay_pp: $.data.id }
          trigger:
            - call: "POST /policies/${pol_pp}/payments/${pay_pp}/reverse"
              payload: {}
              as: Underwriter
          assert:
            - "Policy.${pol_pp}.coverage_status == ACTIVE"
            - "Policy.${pol_pp}.billing_status == PAST_DUE"
            - "PremiumPayment.${pay_pp}.status == REVERSED"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      # --- Depth >= 3: deem_total_loss -> claim TOTAL_LOSS -> item REMOVED -> policy premium recompute ---
      - name: deem_total_loss_cascade_depth3
        grounds:
          - state_machines.RepairOrder.DEEMED_TOTAL_LOSS_to_CLOSED
          - state_machines.Claim.APPROVED_to_SETTLED
          - state_machines.ScheduledItem.SUSPENDED_to_REMOVED
          - calculations.policy_annual_premium
        distinguishing_aspect: |
          A single deem_total_loss on the RepairOrder (link1) reclassifies the Claim to TOTAL_LOSS and
          SETTLES it (link2), which removes the ScheduledItem (link3), which forces Policy
          total_insured_value_cents/annual_premium_cents recompute (link4) — each link caused by the prior,
          depth >= 3, originating from the RepairOrder DEEMED_TOTAL_LOSS transition.
        test_recipe:
          setup:
            - "RiskZone prefix 100 rate 300 + prefix 200 rate 200 cat. ACTIVE policy with RING (cv 1,000,000) AND WATCH (cv 3,000,000 cat); a PARTIAL_DAMAGE claim on the RING approved (settlement 275,000 in-network) with an assigned+accepted RepairOrder at an in-network shop."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Underwriter
            - call: "POST /risk-zones"
              payload: { zip_prefix: "100", risk_band: "MODERATE", rate_per_thousand_cents: 300 }
              as: Underwriter
            - call: "POST /risk-zones"
              payload: { zip_prefix: "200", risk_band: "HIGH", rate_per_thousand_cents: 200, catastrophe_loaded: true }
              as: Underwriter
            - call: "POST /repair-shops"
              payload: { name: "InNet Jeweler", service_zip: "10005", in_network: true }
              as: Underwriter
              captures: { shop_in: $.data.id }
            - call: "POST /policyholders"
              payload: { email: "dc@x.com", full_name: "Dc H", residence_zip: "10001" }
              as: Underwriter
              captures: { ph_dc: $.data.id }
            - call: "POST /appraisals"
              payload: { policyholder_id: "${ph_dc}", appraised_value_cents: 3000000, effective_date_iso: "2026-01-10T00:00:00Z" }
              as: Appraiser
              captures: { ap_dc: $.data.id }
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_dc}", coverage_type: "ALL_RISK", valuation_basis: "AGREED_VALUE", deductible_option: "STANDARD" }
              as: Underwriter
              captures: { pol_dc: $.data.id }
            - call: "POST /policies/${pol_dc}/scheduled-items"
              payload: { description: "Ring", category: "RING", location_zip: "10001", scheduled_value_cents: 1000000 }
              as: Underwriter
              captures: { it_ring: $.data.id }
            - call: "POST /policies/${pol_dc}/scheduled-items"
              payload: { description: "Watch", category: "WATCH", location_zip: "20001", scheduled_value_cents: 3000000, appraisal_id: "${ap_dc}" }
              as: Underwriter
              captures: { it_watch: $.data.id }
            - call: "POST /policies/${pol_dc}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${pol_dc}/payments"
              payload: { amount_cents: 5000000 }
              as: Policyholder
              as_user_id: "${ph_dc}"
            - call: "POST /policies/${pol_dc}/claims"
              payload: { scheduled_item_id: "${it_ring}", peril: "ACCIDENTAL_DAMAGE", loss_type: "PARTIAL_DAMAGE", claimed_amount_cents: 300000 }
              as: ClaimsAdjuster
              captures: { cl_dc: $.data.id }
            - call: "POST /policies/${pol_dc}/claims/${cl_dc}/start_review"
              payload: {}
              as: ClaimsAdjuster
              captures: { cl_dc_v: $.data.version }
            - call: "POST /policies/${pol_dc}/claims/${cl_dc}/approve"
              payload: { expected_claim_version: "${cl_dc_v}" }
              as: ClaimsAdjuster
            - call: "POST /policies/${pol_dc}/claims/${cl_dc}/repair-order"
              payload: { repair_shop_id: "${shop_in}" }
              as: ClaimsAdjuster
