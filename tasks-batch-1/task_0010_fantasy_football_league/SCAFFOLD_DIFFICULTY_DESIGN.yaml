  # =========================================================================
  # Rule 3 — Non-linear state machines on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: trade_branch_revert_proposed_rejected_terminal
        grounds:
          - state_machines.Trade.PROPOSED_to_REJECTED
          - state_machines.Trade.PROPOSED_to_ACCEPTED
          - state_machines.Trade.PROPOSED_to_WITHDRAWN
        distinguishing_aspect: |
          Branching fork: Trade.PROPOSED branches to three divergent terminals (ACCEPTED→…→EXECUTED,
          REJECTED, WITHDRAWN) with distinct side-effect sets per branch. REJECT path leaves
          rosters and FAAB untouched; ACCEPT path bumps versions and locks accepted_at; WITHDRAW
          path is symmetric to REJECT but by the OTHER party. Different entity from Player cycle.
        test_recipe:
          setup:
            - "League IN_SEASON; two teams; a PROPOSED Trade exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
