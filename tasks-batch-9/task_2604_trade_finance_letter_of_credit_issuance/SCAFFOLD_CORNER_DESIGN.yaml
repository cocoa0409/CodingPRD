      - name: credit_allocation_reconciles_provisional_draft_against_committed_issuance
        claim_type: reconciliation
        grounds:
          - calculations.credit_allocation_exposure.variants.provisional_draft
          - calculations.credit_allocation_exposure.variants.committed_issuance
          - calculations.facility_exposure_ledger
          - endpoints.POST_/credits
          - endpoints.POST_/credits/{id}/issue
        distinguishing_aspect: |
          The SAME credit is measured twice. As a DRAFT the provisional variant
          forces tolerance_eff 0 and tenor_eff 0, so provisional_allocation_cents
          is exactly the face amount 20000000 and the facility's allocated_cents
          stays 0 - a draft occupies nothing. At issuance the committed variant
          admits the 5 percent tolerance (max_drawable 21000000) and the 2-month
          tenor add-on (105000), giving 21105000, and the reconciling delta is
          1105000. This is the delta-on-switch claim, distinct from a
          single-variant correctness claim: an implementation that reuses one
          formula for both reports either 20000000 at issuance or 21105000 while
          still in draft.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z."
            - "One applicant with a USD facility of limit_cents 50000000 and collateral_required_pct 0."
