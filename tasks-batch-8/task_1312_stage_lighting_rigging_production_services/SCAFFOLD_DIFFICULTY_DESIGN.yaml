  - rule_id: resource_temporal_overlap
    instances:
      - name: dock_window_half_open_adjacency
        grounds:
          - validations[priority=18]
          - errors[ERR_DOCK_WINDOW_CONFLICT]
          - entities.LoadSchedule.fields.window_start
        distinguishing_aspect: |
          Half-open interval semantics on the venue-dock-door resource via the load-schedule
          CONFIRMED transition: a window ending at 12:00 and another starting at 12:00 on the
          same door do NOT conflict (adjacency allowed), while [11:00,13:00) overlapping an
          existing [08:00,12:00) is rejected with ERR_DOCK_WINDOW_CONFLICT.
        test_recipe:
          setup:
            - "IATSE venue V1 (dock_doors 2); production P1 PLANNING; trucks T1, T2; schedule LS1 (door 0, 2026-09-01T08:00:00Z..12:00:00Z) already CONFIRMED"
          setup_api_calls:
            - { call: "POST /api/venues", payload: { name: "Arena IATSE", union_ruleset: IATSE, max_point_capacity_kg: 500, bay_aggregate_limit_kg: 2000, house_power_amps_per_phase: 200, dock_doors: 2, min_call_hours: 4, ot1_threshold_hours: 8, ot2_threshold_hours: 12, turnaround_min_hours: 8, crew_call_publish_lead_hours: 48, engineering_submission_lead_hours: 72 }, as: ProductionManager, captures: { v1: $.data.id } }
            - { call: "POST /api/productions", payload: { venue_id: "${v1}", name: "P1", load_in_at: "2026-09-01T08:00:00Z", show_at: "2026-09-02T19:00:00Z", load_out_at: "2026-09-03T23:00:00Z" }, as: ProductionManager, captures: { p1: $.data.id } }
            - { call: "POST /api/productions/${p1}/transition", payload: { to: PLANNING }, as: ProductionManager }
            - { call: "POST /api/trucks", payload: { plate_no: "T-1", capacity_kg: 10000 }, as: WarehouseChief, captures: { tr1: $.data.id } }
            - { call: "POST /api/trucks", payload: { plate_no: "T-2", capacity_kg: 10000 }, as: WarehouseChief, captures: { tr2: $.data.id } }
            - { call: "POST /api/productions/${p1}/load-schedules", payload: { truck_id: "${tr1}", direction: LOAD_IN, dock_door_index: 0, window_start: "2026-09-01T08:00:00Z", window_end: "2026-09-01T12:00:00Z" }, as: ProductionManager, captures: { ls1: $.data.id } }
            - { call: "POST /api/load-schedules/${ls1}/transition", payload: { to: CONFIRMED }, as: ProductionManager }
          trigger:
            - { call: "POST /api/productions/${p1}/load-schedules", payload: { truck_id: "${tr2}", direction: LOAD_IN, dock_door_index: 0, window_start: "2026-09-01T12:00:00Z", window_end: "2026-09-01T16:00:00Z" }, as: ProductionManager, captures: { ls2: $.data.id } }
            - { call: "POST /api/load-schedules/${ls2}/transition", payload: { to: CONFIRMED }, as: ProductionManager, captures: { ls2_status: $.data.status } }
            - { call: "POST /api/productions/${p1}/load-schedules", payload: { truck_id: "${tr1}", direction: LOAD_IN, dock_door_index: 0, window_start: "2026-09-01T11:00:00Z", window_end: "2026-09-01T13:00:00Z" }, as: ProductionManager, captures: { ls3: $.data.id } }
            - { call: "POST /api/load-schedules/${ls3}/transition", payload: { to: CONFIRMED }, as: ProductionManager, captures: { ls3_err: $.data.error_id } }
          assert:
            - "adjacent LS2 confirms: status == CONFIRMED (half-open [start, end) — touching endpoints allowed)"
            - "overlapping LS3 confirm returns error_id ERR_DOCK_WINDOW_CONFLICT (HTTP 409); LS3 stays PLANNED"

      - name: technician_turnaround_buffer
        grounds:
          - validations[priority=20]
          - errors[ERR_TECHNICIAN_TURNAROUND]
          - entities.Venue.fields.turnaround_min_hours
        distinguishing_aspect: |
          Buffer-gap interval semantics on the Technician resource via the assignment-creation
          endpoint (different semantics than dock half-openness): two call windows touching or
          merely adjacent are NOT enough — a gap strictly >= turnaround_min_hours (8) is
          required, so a 4-hour gap is rejected while a gap of exactly 8 hours is accepted.
        test_recipe:
          setup:
            - "IATSE venue V1 (turnaround_min_hours 8); production P1 PLANNING; technician T1 (LIGHTING_TECH)"
            - "Call C1 LIGHTING 2026-09-01T08:00..16:00 PUBLISHED with T1 already assigned"
            - "Calls C2 (2026-09-01T20:00..2026-09-02T04:00) and C3 (2026-09-02T00:00..2026-09-02T08:00) PUBLISHED"
          setup_api_calls:
            - { call: "POST /api/venues", payload: { name: "Arena IATSE", union_ruleset: IATSE, max_point_capacity_kg: 500, bay_aggregate_limit_kg: 2000, house_power_amps_per_phase: 200, dock_doors: 2, min_call_hours: 4, ot1_threshold_hours: 8, ot2_threshold_hours: 12, turnaround_min_hours: 8, crew_call_publish_lead_hours: 48, engineering_submission_lead_hours: 72 }, as: ProductionManager, captures: { v1: $.data.id } }
            - { call: "POST /api/productions", payload: { venue_id: "${v1}", name: "P1", load_in_at: "2026-09-01T08:00:00Z", show_at: "2026-09-02T19:00:00Z", load_out_at: "2026-09-03T23:00:00Z" }, as: ProductionManager, captures: { p1: $.data.id } }
            - { call: "POST /api/productions/${p1}/transition", payload: { to: PLANNING }, as: ProductionManager }
            - { call: "POST /api/technicians", payload: { full_name: "Lt One", union_card_no: "U-1001", classification: LIGHTING_TECH, hourly_rate_cents: 10000 }, as: ProductionManager, captures: { t1: $.data.id } }
            - { call: "POST /api/productions/${p1}/crew-calls", payload: { department: LIGHTING, call_start: "2026-09-01T08:00:00Z", call_end: "2026-09-01T16:00:00Z", required_headcount: 1 }, as: ProductionManager, captures: { c1: $.data.id } }
            - { call: "POST /api/crew-calls/${c1}/transition", payload: { to: PUBLISHED }, as: ProductionManager }
            - { call: "POST /api/crew-calls/${c1}/assignments", payload: { technician_id: "${t1}" }, as: ProductionManager, captures: { a1: $.data.id } }
            - { call: "POST /api/productions/${p1}/crew-calls", payload: { department: LIGHTING, call_start: "2026-09-01T20:00:00Z", call_end: "2026-09-02T04:00:00Z", required_headcount: 1 }, as: ProductionManager, captures: { c2: $.data.id } }
            - { call: "POST /api/crew-calls/${c2}/transition", payload: { to: PUBLISHED }, as: ProductionManager }
            - { call: "POST /api/productions/${p1}/crew-calls", payload: { department: LIGHTING, call_start: "2026-09-02T00:00:00Z", call_end: "2026-09-02T08:00:00Z", required_headcount: 1 }, as: ProductionManager, captures: { c3: $.data.id } }
            - { call: "POST /api/crew-calls/${c3}/transition", payload: { to: PUBLISHED }, as: ProductionManager }
          trigger:
            - { call: "POST /api/crew-calls/${c2}/assignments", payload: { technician_id: "${t1}" }, as: ProductionManager, captures: { a2_err: $.data.error_id } }
            - { call: "POST /api/crew-calls/${c3}/assignments", payload: { technician_id: "${t1}" }, as: ProductionManager, captures: { a3: $.data.id, a3_status: $.data.status } }
          assert:
            - "assigning T1 to C2 (gap 4h after C1 ends 16:00) returns error_id ERR_TECHNICIAN_TURNAROUND (HTTP 409)"
            - "assigning T1 to C3 (gap exactly 8h after C1) succeeds with status ASSIGNED — equality meets the >= rule"

      - name: venue_occupancy_closed_interval
        grounds:
          - validations[priority=17]
          - errors[ERR_VENUE_DOUBLE_BOOKED]
          - entities.Production.fields.load_in_at
        distinguishing_aspect: |
          Closed-interval semantics on the Venue resource via production creation (a third
          semantics, unlike dock half-open and technician buffer): occupancy windows include
          both endpoints, so a second production whose load_in_at equals the first's
          load_out_at (2026-09-03T23:00:00Z) CONFLICTS, while starting one minute later succeeds.
        test_recipe:
          setup:
            - "IATSE venue V1; production P1 occupying [2026-09-01T08:00:00Z, 2026-09-03T23:00:00Z] (any non-CANCELLED status)"
          setup_api_calls:
            - { call: "POST /api/venues", payload: { name: "Arena IATSE", union_ruleset: IATSE, max_point_capacity_kg: 500, bay_aggregate_limit_kg: 2000, house_power_amps_per_phase: 200, dock_doors: 2, min_call_hours: 4, ot1_threshold_hours: 8, ot2_threshold_hours: 12, turnaround_min_hours: 8, crew_call_publish_lead_hours: 48, engineering_submission_lead_hours: 72 }, as: ProductionManager, captures: { v1: $.data.id } }
            - { call: "POST /api/productions", payload: { venue_id: "${v1}", name: "P1", load_in_at: "2026-09-01T08:00:00Z", show_at: "2026-09-02T19:00:00Z", load_out_at: "2026-09-03T23:00:00Z" }, as: ProductionManager, captures: { p1: $.data.id } }
          trigger:
            - { call: "POST /api/productions", payload: { venue_id: "${v1}", name: "P2-touching", load_in_at: "2026-09-03T23:00:00Z", show_at: "2026-09-04T19:00:00Z", load_out_at: "2026-09-05T23:00:00Z" }, as: ProductionManager, captures: { p2_err: $.data.error_id } }
            - { call: "POST /api/productions", payload: { venue_id: "${v1}", name: "P3-after", load_in_at: "2026-09-03T23:01:00Z", show_at: "2026-09-04T19:00:00Z", load_out_at: "2026-09-05T23:00:00Z" }, as: ProductionManager, captures: { p3: $.data.id, p3_status: $.data.status } }
          assert:
            - "touching production returns error_id ERR_VENUE_DOUBLE_BOOKED (HTTP 409) — closed intervals share the endpoint instant"
            - "production starting one minute later is created with status DRAFT"

  - rule_id: compensating_invariant
    instances:
      - name: asset_reservation_conservation
        grounds:
          - state_machines.PullListEntry.REQUESTED_to_RESERVED
          - state_machines.PullListEntry.RESERVED_to_CANCELLED
          - state_machines.EquipmentAsset.AVAILABLE_to_RESERVED
          - state_machines.EquipmentAsset.RESERVED_to_AVAILABLE
        distinguishing_aspect: |
          Conserved quantity: the count of non-terminal pull-list engagements on an asset
          (entries in RESERVED/PREPPED/OUT). The forward action (reserve: 0 -> 1, asset
          AVAILABLE -> RESERVED) paired with its compensating action (cancel: 1 -> 0, asset
          RESERVED -> AVAILABLE) leaves the count and the asset status exactly as before — with
          no waitlisted entries pending, no promotion interferes.
        test_recipe:
          setup:
            - "IATSE venue V1; production P1 PLANNING; asset A1 AVAILABLE with zero pull list entries"
          setup_api_calls:
            - { call: "POST /api/venues", payload: { name: "Arena IATSE", union_ruleset: IATSE, max_point_capacity_kg: 500, bay_aggregate_limit_kg: 2000, house_power_amps_per_phase: 200, dock_doors: 2, min_call_hours: 4, ot1_threshold_hours: 8, ot2_threshold_hours: 12, turnaround_min_hours: 8, crew_call_publish_lead_hours: 48, engineering_submission_lead_hours: 72 }, as: ProductionManager, captures: { v1: $.data.id } }
            - { call: "POST /api/productions", payload: { venue_id: "${v1}", name: "P1", load_in_at: "2026-09-01T08:00:00Z", show_at: "2026-09-02T19:00:00Z", load_out_at: "2026-09-03T23:00:00Z" }, as: ProductionManager, captures: { p1: $.data.id } }
            - { call: "POST /api/productions/${p1}/transition", payload: { to: PLANNING }, as: ProductionManager }
            - { call: "POST /api/assets", payload: { asset_tag: "ML-001", asset_class: MOVING_LIGHT, weight_kg: 25, daily_rate_cents: 5000, replacement_cost_cents: 100000, acquired_at: "2024-08-01T00:00:00Z" }, as: WarehouseChief, captures: { a1: $.data.id, a1_status0: $.data.status } }
            - { call: "POST /api/productions/${p1}/pull-list-entries", payload: { asset_id: "${a1}" }, as: WarehouseChief, captures: { e1: $.data.id } }
          trigger:
            - { call: "POST /api/pull-list-entries/${e1}/transition", payload: { to: RESERVED }, as: WarehouseChief, captures: { e1_res: $.data.status } }
            - { call: "GET /api/assets/${a1}", as: WarehouseChief, captures: { a1_mid: $.data.status } }
            - { call: "POST /api/pull-list-entries/${e1}/transition", payload: { to: CANCELLED }, as: WarehouseChief, captures: { e1_cx: $.data.status } }
            - { call: "GET /api/assets/${a1}", as: WarehouseChief, captures: { a1_end: $.data.status } }
          assert:
            - "asset status sequence: AVAILABLE -> (reserve) RESERVED -> (cancel) AVAILABLE"
            - "entry status sequence: RESERVED then CANCELLED"
            - "invariant holds: active engagement count on A1 is 0 before and after the forward/compensating pair"

      - name: settlement_damage_total_conservation
        grounds:
          - state_machines.DamageReport.ASSESSED_to_CHARGED
          - state_machines.DamageReport.CHARGED_to_WAIVED
          - calculations.settlement_totals
          - entities.SettlementStatement.fields.damage_total_cents
        distinguishing_aspect: |
          Conserved quantity: settlement money. Charging then waiving the same ASSESSED report
          (80000 cents) debits and credits damage_total_cents, leaving damage_total_cents == 0
          and grand_total_cents == 105000 exactly as before the pair — a cascade that ran
          end-to-end but drifted would fail this assertion.
        test_recipe:
          setup:
            - "Production P1 at IATSE venue carried to CLOSED (identical end-to-end chain as the settlement dual-variant instance: labor 100000 from a COMPLETED call, entry E1 billed 5000 at damage assessment, report R1 ASSESSED at 80000)"
            - "Settlement ST1 created in DRAFT (damage_total_cents 0, grand_total_cents 105000)"
