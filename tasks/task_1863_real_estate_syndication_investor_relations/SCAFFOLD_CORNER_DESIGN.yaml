  - section: calculations
    instances:

      - name: quarterly_distributable_cash_formula
        claim_type: correct_result
        grounds: [calculations.quarterly_distributable_cash]
        distinguishing_aspect: "distributable_cash_cents = max(0, noi - 10% reserve - 30% debt service); noi=10,000,000 -> 10,000,000 - 1,000,000 - 3,000,000 = 6,000,000"
        test_recipe:
          setup: ["One OPEN offering; one DRAFT QuarterlyReport with noi_cents=10000000"]
          setup_api_calls:
            - call: "POST /syndications"
              payload: { syndication_name: "CalcSyn", sponsor_legal_entity: "Calc LLC", preferred_return_pct_annual: 0.08, carried_interest_pct: 0.20 }
              as: SponsorOperator
              captures: { syn_id: "$.data.id" }
            - call: "POST /syndications/${syn_id}/activate"
              payload: {}
              as: SponsorOperator
            - call: "POST /properties"
              payload: { property_legal_name: "Calc Prop", street_address: "8 C St", acquisition_price_cents: 1000000 }
              as: SponsorOperator
              captures: { prop_id: "$.data.id" }
            - call: "POST /syndications/${syn_id}/offerings"
              payload: { property_id: "${prop_id}", offering_name: "Calc Off", target_raise_cents: 1000000, min_subscription_cents: 10000, max_non_accredited_count: 35 }
              as: SponsorOperator
              captures: { off_id: "$.data.id" }
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/open"
              payload: {}
              as: SponsorOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-15T00:00:00Z" }
              as: SponsorOperator
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/quarterly-reports"
              payload: { report_year: 2026, report_quarter: 1, noi_cents: 10000000, occupancy_pct: 0.95 }
              as: SponsorOperator
              captures: { qr_id: "$.data.id" }
          trigger:
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/quarterly-reports/${qr_id}/publish"
              payload: {}
              as: SponsorOperator
          assert:
            - "QuarterlyReport.${qr_id}.distributable_cash_cents == 6000000"
            - "QuarterlyReport.${qr_id}.status == PUBLISHED"

      - name: capital_event_net_distributable_subtraction
        claim_type: correct_result
        grounds: [calculations.capital_event_net_distributable]
        distinguishing_aspect: "net_distributable = gross - debt_payoff; gross=8,500,000 debt=2,300,000 -> net=6,200,000"
        test_recipe:
          setup: ["One property OWNED; one ANNOUNCED capital event"]
          setup_api_calls:
            - call: "POST /syndications"
              payload: { syndication_name: "NdSyn", sponsor_legal_entity: "Nd LLC", preferred_return_pct_annual: 0.08, carried_interest_pct: 0.20 }
              as: SponsorOperator
              captures: { syn_id: "$.data.id" }
