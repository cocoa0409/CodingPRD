            - "GrantCycle.${cyc3}.formula_committed_cents == 100000 (pool fully allocated, rounding remainder pinned to waterfall order)"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: certification_lapse_reinstate_cycle
        grounds:
          - state_machines.Certification.CERTIFIED_to_LAPSED
          - state_machines.Certification.LAPSED_to_CERTIFIED
          - entities.Counselor.fields.ce_credits_accumulated
        distinguishing_aspect: |
          Certification entity: a cyclic machine CERTIFIED -> LAPSED ->
          CERTIFIED — the loop re-enters CERTIFIED with a reset certified_at
          and lapse_deadline, distinguishable from a fresh certification only
          by version and history.
        test_recipe:
          setup:
            - "Counselor c1 of CHARTERED member m1 holds Certification cert1 CERTIFIED in HOMEOWNERSHIP, certified at 2026-09-10; ce_credits_accumulated = 0"
