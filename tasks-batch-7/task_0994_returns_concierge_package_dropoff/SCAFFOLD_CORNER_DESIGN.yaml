            - { call: "POST /v1/shoppers", payload: { email: "srw@x.com", full_name: "S RW", postal_code: "30028" }, as: Shopper, captures: { sh_id: $.data.id } }
            - { call: "POST /v1/dropoff-locations", payload: { name: "L-RW", kind: COUNTER, postal_code: "30029" }, as: PlatformAdmin, captures: { loc_id: $.data.id } }
            - { call: "POST /v1/dropoff-locations/${loc_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/carrier-routes", payload: { origin_location_id: "${loc_id}", destination_facility: "FAC-15", weight_capacity_grams: 2000 }, as: CarrierDispatcher, captures: { route_id: $.data.id } }
            - { call: "POST /v1/consolidation-totes", payload: { route_id: "${route_id}", location_id: "${loc_id}" }, as: LocationOperator, as_user_id: "${loc_id}", captures: { tote_id: $.data.id, tote_v: $.data.version } }
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: COUNTER_DROP, items: [ { sku: "RW", quantity: 1, unit_price_cents: 100, declared_condition: NEW, longest_side_cm: 20, weight_grams: 2500 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { ro1: $.data.id, ro1_v: $.data.version } }
