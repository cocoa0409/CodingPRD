  - rule_id: resource_temporal_overlap
    instances:
      - name: jib_billing_periods_are_closed_intervals_so_touching_endpoints_collide
        resource_entity: JibStatement
        interval_semantics: "CLOSED [billing_period_start, billing_period_end] - both endpoints belong to the period, so two periods that share a single endpoint date DO collide"
        scope: "one Well; every non-VOID JibStatement of that well competes for calendar coverage"
        grounds:
          - validations[priority=70, error_id=ERR_STATEMENT_PERIOD_OVERLAP]
          - state_machines.JibStatement.DRAFT_to_VOID
          - endpoints.POST_/land-admin/wells/{well_id}/jib-statements
          - endpoints.POST_/land-admin/jib-statements/{statement_id}/void
        distinguishing_aspect: |
          Closed-interval collision: the period 2026-05-01..2026-06-30 and the period
          2026-06-30..2026-07-31 share exactly one day and must be refused, because a cost incurred
          on 2026-06-30 would otherwise be billed twice. Moving the second period one day later
          (2026-07-01) makes it legal. The instance also pins the exclusion set - VOIDing the first
          statement frees its calendar entirely, so the identical period can be re-opened.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-15T00:00:00Z"
            - "Leases L-001 (640.00 gross acres, royalty 0.187500, primary term ending 2026-09-30) and L-002 (320.00 gross acres, royalty 0.250000, primary term ending 2027-12-31)"
            - "Well Sandstone 1H, OIL, 9500 ft, with 480.00 acres committed from L-001 and 160.00 from L-002 (allocation factors 0.750000 / 0.250000), well_status PRODUCING, pooling_status POOLED_EFFECTIVE"
            - "Four interest owners: OP (operator, WI 0.500000, NRI 0.412500, preferential_right true, bond 50000000), OA (WI 0.300000, NRI 0.240000, preferential_right true, bond 10000000), OB (WI 0.200000, NRI 0.150000, preferential_right false, bond 0), OC (Gamma Operating LP, bond 20000000, holds no interest in this well)"
            - "Three operating costs: 200000 incurred 2026-05-10, 300000 incurred 2026-06-15, 400000 incurred 2026-07-20, all paid the following day"
            - "A DRAFT statement JIB-A over the closed period 2026-05-01..2026-06-30"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
