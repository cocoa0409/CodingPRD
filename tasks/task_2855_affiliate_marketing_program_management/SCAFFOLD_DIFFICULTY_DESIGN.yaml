            - call: "POST /payout-batches/${batch_id}/void"
              payload: { reason: "network statement retracted" }
              as: FinanceController
              as_user_id: "fc-001"
            - call: "GET /commission-ledger-entries"
              payload: { affiliate_id: "${aff_id}", limit: 20, offset: 0 }
              as: FinanceController
              as_user_id: "fc-001"
          assert:
            - "before the trigger: Affiliate.${aff_id}.accrued_balance_cents == 4000, reserved_balance_cents == 0, and the single ledger entry sums to 4000, so accrued + reserved == 4000"
            - "after approve: PayoutBatch.${batch_id}.state == \"APPROVED\", approved_by_user_id == \"fc-001\""
            - "after approve: Affiliate.${aff_id}.accrued_balance_cents == 0 and reserved_balance_cents == 4000, so accrued + reserved == 4000 still"
            - "after void: PayoutBatch.${batch_id}.state == \"VOIDED\" and the PayoutLine state == \"VOIDED\""
            - "after void: Affiliate.${aff_id}.accrued_balance_cents == 4000 and reserved_balance_cents == 0, so accrued + reserved == 4000 again"
            - "after void: GET /commission-ledger-entries?affiliate_id=${aff_id} still has total_count == 1 — no compensating row was written and none was deleted"
            - "after void: that single entry has entry_type == \"ACCRUAL\", amount_cents == 4000 and payout_batch_id == null"
            - "after void: Affiliate.${aff_id}.lifetime_paid_cents == 0"
            - "after void: Conversion.${conv_id}.validation_status == \"VALIDATED\" and payable_commission_cents == 4000 — voiding a batch does not touch the conversion"

      - name: attribute_then_full_cancellation_conserves_conversion_ledger_sum_and_counters
        grounds:
          - state_machines.Conversion.AFFILIATE_ATTRIBUTED_to_DETACHED
          - calculations.clawback_allocation
          - calculations.affiliate_incrementality_score
          - entities.Affiliate.fields.attributed_conversion_count
          - entities.CommissionLedgerEntry.fields.entry_type
        distinguishing_aspect: >-
          Conserved count-and-sum quantity: the full cancellation inside the
          unvalidated window must return every derived counter to its pre-attribution
          value — attributed_conversion_count, new_customer_attributed_count and
          coupon_assisted_conversion_count all back to 0 and
          incrementality_score_bps back from 5500 to 4500 — while the ledger GROWS to
          two rows whose signed sum is exactly 0, so the compensation is additive in
          rows and subtractive in money.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-12T12:00:00Z; the conversion is never validated, so the whole test stays inside the 30-day hold."
            - "One Network with fee_bps 0 and flat_fee_cents 0."
            - "One freshly activated CONTENT partner: counters 0/0/0, incrementality_score_bps 4500, tier MEDIUM."
            - "One ACTIVE APPAREL/CONTENT CommissionPolicy with new_customer_rate_bps 900."
            - "One ACTIVE TrackingLink with one ORGANIC_CLICK, and one UNATTRIBUTED Conversion of 100000 cents for a NEW customer redeeming coupon SAVE10."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T12:00:00Z" }
              as: ProgramAdmin
              as_user_id: "adm-001"
            - call: "POST /networks"
              payload: { name: "Alpha Network", fee_model: "PERCENT_OF_COMMISSION", fee_bps: 0, flat_fee_cents: 0, statement_currency: "USD" }
              as: ProgramAdmin
              as_user_id: "adm-001"
              captures: { net_id: $.data.id }
            - call: "POST /commission-policies"
              payload: { policy_code: "APPAREL-CONTENT-2026", product_category: "APPAREL", partner_type_scope: ["CONTENT"], new_customer_rate_bps: 900, returning_customer_rate_bps: 400, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "adm-001"
              captures: { pol_id: $.data.id, pol_v1: $.data.version }
            - call: "POST /commission-policies/${pol_id}/activate"
              payload: { expected_policy_version: "${pol_v1}" }
              as: ProgramAdmin
              as_user_id: "adm-001"
            - call: "POST /affiliates"
              payload: { legal_name: "Cancel Barn Ltd", contact_email: "can@example.com", partner_type: "CONTENT", network_id: "${net_id}", payout_currency: "USD" }
              as: Anonymous
              captures: { aff_id: $.data.id, aff_v1: $.data.version }
            - call: "POST /affiliates/${aff_id}/applications"
              payload: { site_url: "https://cancelbarn.example", primary_traffic_source: "CONTENT_NEWSLETTER", monthly_traffic_estimate: 90000, declared_promo_methods: ["EDITORIAL_CONTENT"], product_categories: ["APPAREL"] }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { app_id: $.data.id }
            - call: "POST /affiliate-applications/${app_id}/screen"
              payload: { domain_authority: 80, content_originality_pct: 92, broken_link_ratio_bps: 200, brand_safety_flag_count: 0, restricted_vertical_overlap_bps: 0 }
              as: ComplianceAnalyst
              as_user_id: "cmp-001"
            - call: "POST /affiliate-applications/${app_id}/decide"
              payload: { decision: "APPROVE", decision_notes: "ok", expected_affiliate_version: "${aff_v1}" }
              as: PartnerManager
              as_user_id: "pm-001"
            - call: "POST /affiliates/${aff_id}/tracking-links"
              payload: { landing_url: "https://retail.example/apparel", sub_id: "cb-1", cookie_window_days: 30, device_graph_enabled: false }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { link_id: $.data.id }
            - call: "POST /tracking-links/${link_id}/clicks"
              payload: { occurred_at: "2026-08-10T10:00:00.000Z", device_id: "D1", click_type: "ORGANIC_CLICK" }
              as: TrackingIngestor
              as_user_id: "ing-001"
            - call: "POST /conversions"
              payload: { order_ref: "ORD-CAN-1", order_total_cents: 100000, product_category: "APPAREL", customer_ref: "CUST-CN", is_new_customer: true, placed_at: "2026-08-12T09:00:00.000Z", device_id: "D1", coupon_code_used: "SAVE10", other_channel_touch: "NONE" }
              as: TrackingIngestor
              as_user_id: "ing-001"
              captures: { conv_id: $.data.id, conv_v1: $.data.version }
          trigger:
            - call: "POST /conversions/${conv_id}/attribute"
              payload: { expected_conversion_version: "${conv_v1}" }
              as: TrackingIngestor
              as_user_id: "ing-001"
            - call: "GET /affiliates/${aff_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "adm-001"
            - call: "POST /conversions/${conv_id}/order-adjustment"
              payload: { adjustment_type: "FULL_CANCELLATION", returned_amount_cents: 100000, occurred_at: "2026-08-13T09:00:00.000Z" }
              as: TrackingIngestor
              as_user_id: "ing-001"
            - call: "GET /commission-ledger-entries"
              payload: { conversion_id: "${conv_id}", limit: 20, offset: 0 }
              as: FinanceAnalyst
              as_user_id: "fa-001"
          assert:
            - "after attribute: Conversion.${conv_id}.attribution_status == \"AFFILIATE_ATTRIBUTED\", gross_commission_cents == 9000 and payable_commission_cents == 9000 — the pre-state tier MEDIUM selected LAST_CLICK_RAW"
            - "after attribute: Affiliate.${aff_id}.attributed_conversion_count == 1, new_customer_attributed_count == 1, coupon_assisted_conversion_count == 1"
            - "after attribute: Affiliate.${aff_id}.incrementality_score_bps == 5500, incrementality_tier == \"MEDIUM\" and accrued_balance_cents == 9000"
            - "after the FULL_CANCELLATION: Conversion.${conv_id}.attribution_status == \"DETACHED\", validation_status == \"REVERSED\" and attributed_affiliate_id is null"
            - "after the FULL_CANCELLATION: Conversion.${conv_id}.clawed_back_cents == 9000 and returned_amount_cents == 100000"
            - "after the FULL_CANCELLATION: Affiliate.${aff_id}.attributed_conversion_count == 0, new_customer_attributed_count == 0 and coupon_assisted_conversion_count == 0"
            - "after the FULL_CANCELLATION: Affiliate.${aff_id}.incrementality_score_bps == 4500 and incrementality_tier == \"MEDIUM\" — back to the pre-attribution value"
            - "after the FULL_CANCELLATION: Affiliate.${aff_id}.accrued_balance_cents == 0 and reserved_balance_cents == 0"
            - "GET /commission-ledger-entries?conversion_id=${conv_id} has total_count == 2 with entry types [\"ACCRUAL\", \"REVERSAL\"] and amount_cents 9000 and -9000, so the signed sum is exactly 0"
