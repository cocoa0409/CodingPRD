  - rule_id: cross_entity_state_dependency
    instances:
      - name: reservation_confirm_requires_confirmed_production
        grounds:
          - state_machines.Reservation.HELD_to_CONFIRMED
          - state_machines.Production.DRAFT_to_CONFIRMED
        distinguishing_aspect: |
          Pair Reservation->Production: a HELD reservation on a DRAFT production cannot confirm
          (ERR_INVALID_STATE); the same confirm succeeds once the PRODUCTION (a different
          entity) reaches CONFIRMED — the reservation's own fields are unchanged.
        test_recipe:
          setup:
            - "RC published; item with 1 unit; renter ACTIVE; production P still DRAFT; reservation R1 qty 1 Sep 1-10 HELD (quote 8000)"
          setup_api_calls:
            - { call: "POST /rental-house/rate-cards", payload: { name: "RC-2026", long_run_threshold_weeks: 8, long_run_discount_pct: 0.20, deep_run_threshold_weeks: 16, deep_run_discount_pct: 0.30, late_fee_daily_pct: 0.10 }, as: HouseAdmin }
            - { call: "POST /rental-house/items", payload: { name: "Tailcoat", period: VICTORIAN, category: COSTUME, size_class: M, alteration_policy: TAILORING_ALLOWED, replacement_value_cents: 100000, base_daily_rate_cents: 1000, base_weekly_rate_cents: 5000 }, as: HouseAdmin, captures: { item_id: $.data.id } }
            - { call: "POST /rental-house/items/${item_id}/units", payload: { barcode: "BC-1501", condition_grade: B, acquisition_date: "2025-01-15", acquisition_cost_cents: 40000 }, as: HouseAdmin }
            - { call: "POST /rental-house/renters", payload: { name: "Renter R", renter_type: THEATRE, credit_limit_cents: 10000000 }, as: HouseAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /rental-house/renters/${r_id}/insurance-certificates", payload: { insurer_name: "InsCo", policy_number: "PR-15", coverage_cents: 600000, effective_date: "2026-01-01", expiry_date: "2027-06-30" }, as: HouseAdmin, captures: { cert_r: $.data.id } }
            - { call: "POST /rental-house/insurance-certificates/${cert_r}/decide", payload: { decision: VERIFIED }, as: HouseAdmin }
            - { call: "POST /rental-house/productions", payload: { renter_id: "${r_id}", title: "P", rehearsal_start_date: "2026-08-10", performance_start_date: "2026-09-01", closing_date: "2026-10-26" }, as: RenterContact, as_user_id: "${r_id}", captures: { p_id: $.data.id, p_v: $.data.version } }
            - { call: "POST /rental-house/reservations", payload: { production_id: "${p_id}", item_id: "${item_id}", quantity: 1, window_start_date: "2026-09-01", window_end_date: "2026-09-10", expected_production_version: "${p_v}" }, as: RenterContact, as_user_id: "${r_id}", captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /rental-house/reservations/${r1}/confirm", payload: {}, as: RenterContact, as_user_id: "${r_id}", captures: { err: $.data.error_id } }
            - { call: "POST /rental-house/productions/${p_id}/confirm", payload: {}, as: RenterContact, as_user_id: "${r_id}" }
            - { call: "POST /rental-house/reservations/${r1}/confirm", payload: {}, as: RenterContact, as_user_id: "${r_id}", captures: { ok_status: $.data.status } }
          assert:
            - "First confirm (production DRAFT): error_id == ERR_INVALID_STATE (409)"
            - "After production confirm: identical reservation confirm succeeds -> status CONFIRMED"

      - name: dispatch_requires_active_insured_renter
        grounds:
          - state_machines.PullList.PICKING_to_DISPATCHED
          - state_machines.Renter.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Pair PullList->Renter (different entities than instance 1): dispatch of a fully PICKED
          pull list fails with ERR_RENTER_SUSPENDED the moment the RENTER (different entity) is
