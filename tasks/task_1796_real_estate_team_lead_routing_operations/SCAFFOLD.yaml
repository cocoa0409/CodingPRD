  - method: GET
    path: "/crm/lead-sources/{sourceId}"
    description: "Get a lead source"
    roles: [TeamAdmin, TeamLeader, Agent, ReferralPartner]
    code: 200
    input: []
    output: LeadSource
    side_effects: []
  - method: GET
    path: "/crm/lead-sources"
    description: "List lead sources"
    roles: [TeamAdmin, TeamLeader, Agent, ReferralPartner]
    code: 200
    input: ["team_id?", "status?", "type?"]
    output: LeadSource[]
    side_effects: []
  - method: POST
    path: "/crm/lead-sources/{sourceId}/pause"
    description: "Pause a source; intake from it is rejected while PAUSED"
    roles: [TeamAdmin]
    code: 200
    input: []
    output: LeadSource
    side_effects: ["status -> PAUSED"]
  - method: POST
    path: "/crm/lead-sources/{sourceId}/resume"
    description: "Resume a PAUSED source"
    roles: [TeamAdmin]
    code: 200
    input: []
    output: LeadSource
    side_effects: ["status -> ACTIVE"]
  - method: GET
    path: "/crm/lead-sources/{sourceId}/roi"
    description: "Source ROI computed read (source_roi calculation); basis REALIZED (default) or PROJECTED; roi_bps null when spend is zero"
    roles: [TeamAdmin, TeamLeader, Agent, ReferralPartner]
    code: 200
    input: ["basis?", "window_days?"]
    output: { source_id: string, window_days: integer, basis: string, leads_count: integer, conversions_count: integer, spend_cents: integer, attributed_commission_cents: integer, roi_bps: integer }
    side_effects: []

  # --- Lead ---
  - method: POST
    path: "/crm/leads"
    description: "Lead intake. Validates source state then budget; on success creates the lead in NEW and, when source.auto_route is true and an ACTIVE policy exists and the eligibility pool is non-empty, immediately routes it (creates the first OFFERED Assignment and flips the lead to OFFERED). ReferralPartner callers must pass referral_partner_id equal to their own id and use a REFERRAL_PARTNER source."
    roles: [TeamAdmin, TeamLeader, ReferralPartner]
    code: 201
    input: [team_id, source_id, contact_name, contact_phone, contact_email, expected_close_price_cents, "referral_partner_id?"]
    output: Lead
    side_effects: ["status=NEW then possibly OFFERED via auto-route", "source leads/spend monthly counters recomputed", "on auto-route: Assignment created, agent capacity/last_assigned_at updated"]
  - method: GET
    path: "/crm/leads/{leadId}"
    description: "Get a lead"
    roles: [TeamAdmin, TeamLeader, Agent, ReferralPartner]
    code: 200
    input: []
    output: Lead
    side_effects: []
  - method: GET
    path: "/crm/leads"
    description: "List leads with filters and pagination"
    roles: [TeamAdmin, TeamLeader, Agent, ReferralPartner]
    code: 200
    input: ["team_id?", "source_id?", "assigned_agent_id?", "referral_partner_id?", "status?", "temperature?", "limit?", "offset?"]
    output: Lead[]
    side_effects: []
  - method: POST
    path: "/crm/leads/{leadId}/route"
    description: "Manually route a NEW lead through the ACTIVE policy selector"
    roles: [TeamAdmin, TeamLeader]
    code: 201
    input: []
    output: Assignment
    side_effects: ["Lead NEW -> OFFERED", "Assignment created with policy snapshot and deadlines", "agent capacity/last_assigned_at updated"]
  - method: POST
    path: "/crm/leads/{leadId}/claim"
    description: "Offered agent claims the lead at-or-before claim_deadline_at"
    roles: [Agent]
    code: 200
    input: []
    output: Lead
    side_effects: ["Lead OFFERED -> CLAIMED", "Assignment -> CLAIMED", "claimant consecutive_missed_claims = 0"]
  - method: POST
    path: "/crm/leads/{leadId}/release"
    description: "Release a CLAIMED/WORKING lead back to the NEW pool"
    roles: [Agent, TeamLeader, TeamAdmin]
    code: 200
    input: ["reason?"]
    output: Lead
    side_effects: ["Assignment -> RELEASED", "assigned_agent_id/current_assignment_id cleared", "agent active_lead_count -= 1"]
  - method: POST
    path: "/crm/leads/{leadId}/log-response"
    description: "Record the assigned agent's first response at the current logical time; computes within_speed_sla; CLAIMED -> WORKING"
    roles: [Agent]
    code: 200
    input: []
    output: Lead
    side_effects: ["first_response_at = now", "within_speed_sla computed", "Assignment.responded_at set", "agent avg_first_response_seconds recomputed and tier re-evaluated"]
  - method: POST
    path: "/crm/leads/{leadId}/engagement-events"
    description: "Append an engagement event; recomputes engagement_score and temperature; temperature shifts auto-exit mismatched nurture enrollments"
    roles: [Agent, TeamAdmin]
    code: 201
    input: [type, occurred_at]
    output: EngagementEvent
    side_effects: ["Lead.engagement_score/temperature recomputed", "mismatched NurtureEnrollments -> EXITED (TEMPERATURE_SHIFT)"]
  - method: GET
    path: "/crm/leads/{id}/engagement-events"
    description: "List a lead's engagement events"
    roles: [TeamAdmin, TeamLeader, Agent, ReferralPartner]
    code: 200
    input: []
    output: EngagementEvent[]
    side_effects: []
  - method: POST
    path: "/crm/leads/{leadId}/close-lost"
    description: "Close a CLAIMED/WORKING lead as lost; frees agent capacity"
    roles: [Agent, TeamLeader, TeamAdmin]
    code: 200
    input: [reason]
    output: Lead
    side_effects: ["status -> CLOSED_LOST", "agent active_lead_count -= 1"]
  - method: POST
    path: "/crm/leads/{leadId}/recycle"
    description: "Recycle a CLOSED_LOST lead back to NEW (engagement history and temperature preserved)"
    roles: [TeamLeader, TeamAdmin]
    code: 200
    input: []
    output: Lead
    side_effects: ["status CLOSED_LOST -> NEW"]

  # --- Assignment ---
  - method: GET
    path: "/crm/assignments/{assignmentId}"
    description: "Get an assignment"
    roles: [TeamAdmin, TeamLeader, Agent, ReferralPartner]
    code: 200
    input: []
    output: Assignment
    side_effects: []
  - method: GET
    path: "/crm/assignments"
    description: "List assignments with filters (including supersedes_assignment_id for chain traversal)"
    roles: [TeamAdmin, TeamLeader, Agent, ReferralPartner]
    code: 200
    input: ["lead_id?", "agent_id?", "policy_id?", "supersedes_assignment_id?", "status?", "limit?", "offset?"]
