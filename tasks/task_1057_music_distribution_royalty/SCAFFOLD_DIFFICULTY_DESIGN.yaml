  # =====================================================================
  # Rule 4 — transitive cascade chains from different triggers
  # =====================================================================
  - rule_id: transitive_cascade
    instances:

      - name: confirm_takedown_depth_four_cascade_to_subscription_slots
        grounds:
          - state_machines.Delivery.TAKEDOWN_REQUESTED_to_TAKEN_DOWN
          - state_machines.Release.TAKEDOWN_PENDING_to_TAKEN_DOWN
          - state_machines.Release.LIVE_to_TAKEN_DOWN
          - calculations.release_slot_usage
          - entities.Track.fields.status
          - entities.Artist.fields.live_track_count
          - entities.Subscription.fields.releases_used
        distinguishing_aspect: |
          A depth-4 chain fired by POST /api/deliveries/{id}/confirm-takedown, where each hop is
          caused by the previous one: delivery -> TAKEN_DOWN causes Release.delivery_status ->
          TAKEN_DOWN, which causes Release.status -> TAKEN_DOWN, which causes every ACTIVE Track ->
          INACTIVE, which causes Artist.live_track_count and Subscription.releases_used to fall to 0.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T00:00:00Z, past the release_date 2026-09-01."
            - "Artist ANTARES on an ACTIVE PRO subscription (5 slots)."
            - "Release SCORPIO is LIVE with delivery_status DELIVERED, its single track ACTIVE, Artist.live_track_count == 1 and Subscription.releases_used == 1."
            - "The release's only Delivery is in TAKEDOWN_REQUESTED after a takedown request."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
