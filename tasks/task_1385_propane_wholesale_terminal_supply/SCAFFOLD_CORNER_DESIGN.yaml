        claim_type: violation_to_error
        grounds: [state_machines.AllocationRun.OPEN_to_COMPUTED, "errors[ERR_TERMINAL_NOT_CURTAILED]"]
        distinguishing_aspect: "Allocation compute is gated on terminal posture CURTAILED: on a NORMAL terminal the run exists but compute fails ERR_TERMINAL_NOT_CURTAILED."
        test_recipe:
          setup: ["terminal NORMAL; allocation run created (OCC satisfied)"]
          setup_api_calls:
            - call: "POST /terminals"
              payload: { name: "T-R1", region_code: "NE", storage_capacity_gal: 1000000, reserve_floor_gal: 50000, winter_reserve_floor_gal: 150000, rack_bay_count: 2 }
              as: SupplyAdmin
