              captures: { reach_id: "$.data.id" }
            - call: "POST /dams"
              payload: { owner_id: "${owner_id}", river_reach_id: "${reach_id}", name: "Cedar Notch Dam", nid_code: "ST00131", height_ft: 88, gross_storage_acre_ft: 5000, crest_elevation_ft: 1310.0, normal_pool_elevation_ft: 1305.0, year_completed: 1962, registered_at: "2019-04-15T00:00:00Z" }
              as: ProgramAdmin
              captures: { dam_id: "$.data.id" }
            - call: "POST /consequence-assessments"
              payload: { dam_id: "${dam_id}", population_at_risk: 3, habitable_structures: 2, critical_facilities: 0, breach_peak_outflow_cfs: 14000, breach_travel_time_minutes: 200, inundation_area_acres: 50, inundation_map_ref: "IM-2019-D" }
              as: Engineer
              as_user_id: "${eng_a_id}"
              captures: { a1_id: "$.data.id" }
            - call: "POST /consequence-assessments/${a1_id}/certify"
              payload: {}
              as: Engineer
              as_user_id: "${eng_a_id}"
            - call: "POST /high-water-events"
