  # ------------------------------------------------------------------
  # Rule 5: priority_pair_validation_conflict — different error-category pairs
  # ------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: booking_stale_version_beats_overlap
        grounds:
          - validations[priority=5]
          - validations[priority=8]
          - concurrency_rules[booking-create-stale-bay]
        distinguishing_aspect: |
          state (priority 5, ERR_STALE_VERSION) vs business_temporal
          (priority 8, ERR_BOOKING_OVERLAP): a booking request carrying a stale
          expected_bay_version AND an overlapping hour interval must be rejected
          with ERR_STALE_VERSION, not ERR_BOOKING_OVERLAP — priority 5 wins.
        test_recipe:
          setup:
            - "Project P ACTIVE; EditBay B AVAILABLE with version V0"
            - "Existing Booking B1 on bay B, session_date 2026-08-05, hours 10-12 (RESERVED)"
            - "Bay version has advanced beyond V0 because of B1's create"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FacilityAdmin
            - call: "POST /post-production/projects"
              payload: { title: "PB", client_code: "CL009", fps: 24, resolution_width: 1920, resolution_height: 1080, storage_quota_gb: 100, security_tier: "STANDARD" }
              as: PostSupervisor
              captures: { proj_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/watermark-profiles"
              payload: { profile_name: "wm", opacity_pct: 80, position: "CENTER", includes_recipient_email: true, forensic_enabled: true }
              as: PostSupervisor
              captures: { wm_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/watermark-profiles/${wm_id}/activate"
              payload: {}
              as: PostSupervisor
            - call: "POST /post-production/projects/${proj_id}/bays"
              payload: { bay_name: "BAY-01", bay_type: "OFFLINE", capacity_hours_per_day: 8 }
              as: PostSupervisor
              captures: { bay_id: $.data.id, bay_v0: $.data.version }
            - call: "POST /post-production/projects/${proj_id}/activate"
              payload: {}
              as: PostSupervisor
            - call: "POST /post-production/projects/${proj_id}/bookings"
              payload: { bay_id: "${bay_id}", artist_email: "a@x.com", session_date: "2026-08-05", start_hour: 10, end_hour: 12, version_tag: "v001", expected_bay_version: "${bay_v0}" }
              as: PostSupervisor
              captures: { booking1_id: $.data.id }
          trigger:
            - call: "POST /post-production/projects/${proj_id}/bookings"
              payload: { bay_id: "${bay_id}", artist_email: "b@x.com", session_date: "2026-08-05", start_hour: 11, end_hour: 13, version_tag: "v002", expected_bay_version: "${bay_v0}" }
              as: PostSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_VERSION   # priority 5 beats priority 8 (overlap)"
            - "err != ERR_BOOKING_OVERLAP"

      - name: asset_duplicate_beats_quota
        grounds:
          - validations[priority=11]
          - validations[priority=14]
        distinguishing_aspect: |
          business_safety (priority 11, ERR_DUPLICATE_ASSET) vs business_fiscal
          (priority 14, ERR_STORAGE_QUOTA_EXCEEDED): an asset create that both
          duplicates (reel_name, clip_name) and would exceed project quota must
          return ERR_DUPLICATE_ASSET — safety wins over fiscal.
