            - { call: "POST /work-orders", payload: { property_id: "${p12}", description: "over threshold", cost_cents: 50001, billable_to: "OWNER" }, as: PropertyManager, captures: { wb: "$.data.id", rb: "$.data.requires_owner_approval" } }
