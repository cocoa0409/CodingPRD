            - call: "GET /business-lines/${bl_id}"
              payload: {}
              as: IntakeSpecialist
              captures: { bl_v2: $.data.version }
            - call: "POST /participants"
              payload: { referral_id: "${ref2_id}", business_line_id: "${bl_id}", wage_cents_per_hour: 1725, expected_business_line_version: "${bl_v2}" }
              as: IntakeSpecialist
              captures: { p2_id: $.data.id }
            - call: "POST /work-shifts"
              payload: { business_line_id: "${bl_id}", starts_at: "2026-09-07T08:00:00Z", ends_at: "2026-09-07T12:00:00Z", trainee_capacity: 2, supervisor_user_id: "sup-1" }
              as: ProgramDirector
              captures: { ws_x_id: $.data.id }
            - call: "POST /work-shifts"
              payload: { business_line_id: "${bl_id}", starts_at: "2026-09-07T10:00:00Z", ends_at: "2026-09-07T14:00:00Z", trainee_capacity: 2, supervisor_user_id: "sup-2" }
              as: ProgramDirector
              captures: { ws_y_id: $.data.id }
            - call: "POST /work-shifts"
              payload: { business_line_id: "${bl_id}", starts_at: "2026-09-07T12:00:00Z", ends_at: "2026-09-07T16:00:00Z", trainee_capacity: 2, supervisor_user_id: "sup-2" }
              as: ProgramDirector
