            - *k_clock
            - *k_alt_hub
            - *k_hub
            - *k_lane_p1
            - *k_lane_s1
            - *k_bank
            - *k_ac1
            - *k_ac2
            - *k_shift
            - *k_clock1400
            - *k_ac1_depart
            - *k_ac1_land
            - *k_bank_unload
            - *k_ac1_begun
            - *k_ac1_done
            - call: "POST /airhub/moves"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac2_id}", weight_limit_grams: 400000 }
