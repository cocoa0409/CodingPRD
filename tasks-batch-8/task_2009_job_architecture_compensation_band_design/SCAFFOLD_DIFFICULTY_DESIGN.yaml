            - { call: "POST /comp/pay-bands", payload: { comp_program_id: "${prog}", job_family_id: "${fam}", job_level_id: "${lv2}", geo_zone_id: "${nat}", target_percentile: "P50", spread_pct: 0.3000 }, as: CompAnalyst, captures: { band2: $.data.id, band2_v: $.data.version } }
