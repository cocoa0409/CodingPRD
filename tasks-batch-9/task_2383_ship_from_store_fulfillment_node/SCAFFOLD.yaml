# =============================================================================
# PRD Benchmark Seed Tables — Ship-from-Store Fulfillment Node Management
# Difficulty band: beyond Expert (§0.4) — 13 entities, 50 endpoints, 6 state
# machines (2 cyclic, 1 branching, 1 parallel-dimension pair), 13 calculation
# rules with 3 dual-variant families, 3 OCC races, 38 error codes.
# =============================================================================

scenario: |
  2383. Ship-from-Store Fulfillment Node Management (omnichannel retailer store fulfillment): store eligibility scoring on capacity, labor and historical fulfillment performance, order routing optimization across cost, split minimization, inventory health and delivery speed, safety stock buffers preventing store fulfillment from breaking floor presentation, pick, pack and ship workflows in store with labor standards and cutoff times, rejection and cancellation handling with rerouting and customer communication, carrier pickup scheduling and packaging supply management by store, node performance measurement on fill rate, cycle time and cancellation rate with node deactivation rules, cost per order comparison to distribution center fulfillment

domain_name: ship-from-store-fulfillment
api_prefix: /fulfillment-network

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - selector_policy              # router picks nodes from a candidate pool (§1.3 routing_node_selection_waterfall)
    - cascading_side_effects       # reject / deactivate chains span Assignment -> Order -> RoutingRun -> Store
    - dual_variant_calculation     # provisional vs final cost; routing-trailing vs governance-blended node score
    - ops_run_checkpoint           # POST /performance-windows/close advances the epoch and re-postures nodes
    - optimistic_concurrency       # OCC on CustomerOrder.version, CarrierPickup.version, StoreInventory.version

  entity_topology: flat
  # Every entity is a top-level collection joined by explicit FK fields; no
  # entity is nested inside another's URL path. Reverse navigation is always a
  # filtered list (`GET /<children>?<fk>=`), which keeps 3-hop joins
  # (Order -> Assignment -> AssignmentLine -> OrderLine) explicit rather than
  # hidden in a URL hierarchy.

  state_machine_shape: branching
  # FulfillmentAssignment forks at pick time (PICKED vs SHORT_PICKED) with
  # divergent side-effect sets; CustomerOrder carries two independent
  # dimensions (routing_status x fulfillment_status) and its routing dimension
  # is cyclic (ROUTED -> ROUTING -> ROUTED); Store.node_status is cyclic
  # (ELIGIBLE -> PROBATION -> DEACTIVATED -> ELIGIBLE).

  relationship_patterns:
    - one_to_many        # Store -> StoreInventory / PackagingSupply / CarrierPickup / NodePerformanceWindow
    - many_to_many       # AssignmentLine joins FulfillmentAssignment x OrderLine
    - cross_aggregate    # FulfillmentAssignment references Store, CustomerOrder, RoutingRun and CarrierPickup
    - polymorphic        # CustomerNotification.assignment_id is nullable: order-level or assignment-level events

  role_model: peer_roles
  # NetworkPlanner owns network configuration and the ops-run; StoreAssociate
  # owns in-store execution for its own store only; CarrierCoordinator owns
  # pickup lifecycle after scheduling; CustomerCare owns order intake and
  # customer-driven cancellation. No role is a superset of another.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Store
    parent: null
    common_fields: true
    fields:
      - name: store_code
        type: string
        source: input
        description: human-readable node code
        constraints: "unique across all Store rows; 1-16 chars"
      - name: region_code
        type: string
        source: input
        description: reporting region label
      - name: origin_zone
        type: integer
        source: input
        description: carrier origin zone of the node, used for zone_delta transit math
        constraints: "1..8"
      - name: daily_unit_capacity
        type: integer
        source: input
        description: units the node may commit inside one performance epoch
        constraints: ">= 1"
      - name: units_committed_epoch
        type: integer
        source: computed
        description: "sum of assigned_units over FulfillmentAssignment rows with this store_id, epoch == the store's OPEN NodePerformanceWindow.epoch, and status NOT IN {REJECTED, CANCELLED}; reset to 0 at window close (step 4 of the ops-run)"
        default: 0
      - name: staffed_labor_minutes
        type: integer
        source: input
        description: fulfillment labor minutes staffed for the epoch
        constraints: ">= 1"
      - name: reserved_labor_minutes
        type: number
        source: computed
        description: "sum of labor_minutes_reserved over FulfillmentAssignment rows with this store_id and status IN {ASSIGNED, ACCEPTED, PICKED, SHORT_PICKED, PACKED}"
        default: 0
      - name: labor_standard_minutes_per_order
        type: number
        source: input
        description: fixed labor-standard minutes charged once per assignment
        constraints: "> 0"
      - name: pick_labor_minutes_per_unit
        type: number
        source: input
        description: labor-standard minutes charged per picked unit
        constraints: "> 0"
      - name: labor_rate_cents_per_minute
        type: integer
        source: input
        description: fully loaded store labor cost per minute in cents
        constraints: ">= 1"
      - name: cutoff_utc_minutes
        type: integer
        source: input
        description: "same-day cutoff expressed as minutes after 00:00 UTC; accept / pick / pack / ship require floor(clock minutes-of-day) <= this value"
        constraints: "0..1439"
      - name: hazmat_certified
        type: boolean
        source: input
        description: node may fulfill SKUs whose hazmat_flag is true
        default: false
      - name: node_status
        type: enum
        source: computed
        description: "node posture gating all fulfillment work"
        default: ELIGIBLE
        constraints: "ELIGIBLE | PROBATION | DEACTIVATED"
      - name: eligibility_score
        type: number
        source: computed
        description: "routing-time node score (calculations.store_eligibility_score, variant routing_trailing / cold_start); recomputed on every reservation change and at ops-run step 7"
        default: 0
      - name: eligibility_score_basis
        type: enum
        source: computed
        description: "which performance input fed eligibility_score"
        default: COLD_START
        constraints: "COLD_START | TRAILING_WINDOW"
      - name: review_score
        type: number
        source: computed
        description: "governance node score (calculations.store_eligibility_score, variant governance_blended); written only at ops-run step 3"
        default: 0
      - name: consecutive_breach_windows
        type: integer
        source: computed
        description: count of consecutive non-empty breached windows; reset by a clean non-empty window or by reactivation
        default: 0
      - name: deactivated_at_epoch
        type: integer
        source: computed
        description: epoch whose close deactivated the node; null while not DEACTIVATED
        default: null
      - name: reactivation_count
        type: integer
        source: computed
        description: number of successful reactivations
        default: 0

  - name: Sku
    parent: null
    common_fields: true
    fields:
      - name: sku_code
        type: string
        source: input
        description: merchandising code
        constraints: "unique across all Sku rows"
      - name: unit_weight_grams
        type: integer
        source: input
        description: shipping weight of one unit
        constraints: ">= 1"
      - name: unit_price_cents
        type: integer
        source: input
        description: list price per unit
        constraints: ">= 0"
      - name: package_class
        type: enum
        source: input
        description: smallest package family that can hold this SKU
        constraints: "SMALL | MEDIUM | LARGE"
      - name: hazmat_flag
        type: boolean
        source: input
        description: requires a hazmat_certified node
        default: false

  - name: StoreInventory
    parent: null
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; owning node"
      - name: sku_id
        type: string
        source: input
        description: "FK -> Sku.id; stocked SKU"
      - name: on_hand_units
        type: integer
        source: input
        description: physical units in the building; decremented only when an assignment ships
        constraints: ">= 0"
      - name: reserved_units
        type: integer
        source: computed
        description: "see calculations.reserved_units_reconciliation; units held by non-terminal assignments"
        default: 0
      - name: safety_stock_units
        type: integer
        source: input
        description: floor-presentation buffer withheld from ship-from-store
        constraints: ">= 0 and <= on_hand_units at creation"
      - name: available_to_promise_units
        type: integer
        source: computed
        description: "max(0, on_hand_units - reserved_units - safety_stock_units) (calculations.store_available_to_promise)"
        default: 0
      - name: last_adjustment_reason
        type: enum
        source: computed
        description: reason of the most recent adjustment; null before the first adjustment
        default: null
        constraints: "CYCLE_COUNT | SHRINK | RECEIPT | MARKDOWN_PULL"

  - name: PackagingSupply
    parent: null
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; owning node"
      - name: package_type
        type: enum
        source: input
        description: packaging SKU held at the node
        constraints: "POLY_MAILER | SMALL_BOX | MEDIUM_BOX | LARGE_BOX; unique per (store_id, package_type)"
      - name: on_hand_units
        type: integer
        source: input
        description: packages on hand; one is consumed per pack event
        constraints: ">= 0"
      - name: reorder_point_units
        type: integer
        source: input
        description: threshold at or below which reorder_flag turns true
        constraints: ">= 0"
      - name: reorder_flag
        type: boolean
        source: computed
        description: "true when on_hand_units <= reorder_point_units"
        default: false
      - name: lifetime_consumed_units
        type: integer
        source: computed
        description: packages consumed by pack events over the node's lifetime
        default: 0

  - name: CarrierPickup
    parent: null
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; node the carrier calls at"
      - name: carrier_code
        type: string
        source: input
        description: carrier identifier
      - name: window_start_utc
        type: datetime
        source: input
        description: inclusive start of the pickup window
      - name: window_end_utc
        type: datetime
        source: input
        description: exclusive end of the pickup window
        constraints: "> window_start_utc"
      - name: parcel_capacity
        type: integer
        source: input
        description: parcels the carrier will accept in this window
        constraints: ">= 1"
      - name: reserved_parcels
        type: integer
        source: computed
        description: "count of FulfillmentAssignment rows with this carrier_pickup_id and status == SHIPPED"
        default: 0
      - name: status
        type: enum
        source: computed
        description: pickup lifecycle
        default: SCHEDULED
        constraints: "SCHEDULED | CLOSED | DEPARTED | CANCELLED"

  - name: CustomerOrder
    parent: null
    common_fields: true
    fields:
      - name: order_code
        type: string
        source: input
        description: external order number
        constraints: "unique across all CustomerOrder rows"
      - name: customer_ref
        type: string
        source: input
        description: opaque customer handle used on notifications
      - name: destination_zone
        type: integer
        source: input
        description: carrier destination zone of the ship-to address
        constraints: "1..8"
      - name: service_level
        type: enum
        source: input
        description: purchased service level
        constraints: "GROUND | EXPEDITED"
      - name: promised_ship_by_utc
        type: datetime
        source: input
        description: customer-promised ship-by instant, echoed on notifications
      - name: routing_status
        type: enum
        source: computed
        description: routing dimension (see state_machines.CustomerOrder dimension routing_status)
        default: UNROUTED
        constraints: "UNROUTED | ROUTING | ROUTED | PARTIALLY_ROUTED | UNROUTABLE"
      - name: fulfillment_status
        type: enum
        source: computed
        description: execution dimension (see state_machines.CustomerOrder dimension fulfillment_status)
        default: PENDING
        constraints: "PENDING | PARTIALLY_SHIPPED | SHIPPED | CANCELLED"
      - name: total_units
        type: integer
        source: computed
        description: sum of OrderLine.quantity
        default: 0
      - name: shipped_units
        type: integer
        source: computed
        description: sum of OrderLine.shipped_units
        default: 0
      - name: unassigned_units
        type: integer
        source: computed
        description: sum of OrderLine.open_units
        default: 0
      - name: dc_fallback_units
        type: integer
        source: computed
        description: sum of OrderLine.dc_fallback_units
        default: 0
      - name: split_count
        type: integer
        source: computed
        description: "count of FulfillmentAssignment rows for this order with status NOT IN {REJECTED, CANCELLED}"
        default: 0
      - name: reroute_attempt_count
        type: integer
        source: computed
        description: "count of RoutingRun rows for this order with initiated_by IN {SYSTEM_REROUTE, SYSTEM_DEACTIVATION}"
        default: 0
      - name: provisional_cost_cents
        type: integer
        source: computed
        description: "calculations.order_cost_per_order_comparison, variant provisional"
        default: 0
      - name: final_cost_cents
        type: integer
        source: computed
        description: "calculations.order_cost_per_order_comparison, variant final; null until fulfillment_status == SHIPPED"
        default: null
      - name: cost_variance_cents
        type: integer
        source: computed
        description: "final_cost_cents - provisional_cost_cents; null until final_cost_cents is set"
        default: null
      - name: dc_baseline_cost_cents
        type: integer
        source: computed
        description: "DC_BASE_CENTS_BY_ZONE[destination_zone] + DC_HANDLING_CENTS_PER_UNIT * total_units"
        default: 0
      - name: cost_index_bps
        type: integer
        source: computed
        description: "store cost as basis points of dc_baseline_cost_cents; uses final_cost_cents when set, else provisional_cost_cents"
        default: 0

  - name: OrderLine
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> CustomerOrder.id; owning order"
      - name: sku_id
        type: string
        source: input
        description: "FK -> Sku.id; ordered SKU"
      - name: quantity
        type: integer
        source: input
        description: ordered units
        constraints: ">= 1"
      - name: unit_price_cents
        type: integer
        source: input
        description: sold price per unit
        constraints: ">= 0"
      - name: assigned_units
        type: integer
        source: computed
        description: units held by non-terminal assignments
        default: 0
      - name: shipped_units
        type: integer
        source: computed
        description: units shipped from stores
        default: 0
      - name: cancelled_units
        type: integer
        source: computed
        description: units cancelled to the customer without reroute
        default: 0
      - name: dc_fallback_units
        type: integer
        source: computed
        description: units handed to the distribution center when a COMMIT run exits with unfulfillable units because len(selected) reached MAX_SPLITS_PER_ORDER; a run that exits on an empty candidate pool leaves those units in open_units instead
        default: 0
      - name: open_units
        type: integer
        source: computed
        description: "quantity - assigned_units - shipped_units - cancelled_units - dc_fallback_units (calculations.order_demand_units_reconciliation)"
        default: 0
      - name: line_status
        type: enum
        source: computed
        description: derived line posture
        default: OPEN
        constraints: "OPEN | PARTIALLY_ASSIGNED | FULLY_ASSIGNED | SHIPPED | DC_FALLBACK | CANCELLED"

  - name: RoutingRun
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> CustomerOrder.id; order being routed"
      - name: mode
        type: enum
        source: input
        description: "PROVISIONAL evaluates and persists candidates without creating assignments; COMMIT also creates assignments"
        constraints: "PROVISIONAL | COMMIT"
      - name: initiated_by
        type: enum
        source: computed
        description: "PLANNER for POST /orders/{id}/routing-runs; SYSTEM_REROUTE for reject / short-pick / cancel-with-reroute / pick-SLA expiry; SYSTEM_DEACTIVATION for node deactivation cascades"
        default: PLANNER
        constraints: "PLANNER | SYSTEM_REROUTE | SYSTEM_DEACTIVATION"
      - name: excluded_store_ids
        type: array
        source: computed
        description: store ids barred from this run because they already rejected, short-picked, cancelled or were deactivated for this order
        default: []
      - name: candidate_count
        type: integer
        source: computed
        description: RoutingCandidate rows persisted by this run across all iterations
        default: 0
      - name: selected_store_count
        type: integer
        source: computed
        description: distinct stores selected by the waterfall
        default: 0
      - name: planned_split_count
        type: integer
        source: computed
        description: parcels the run plans (equals selected_store_count)
        default: 0
      - name: projected_cost_cents
        type: integer
        source: computed
        description: order-level store cost projected by this run (provisional variant, including split penalty, reroute overhead and network overhead fee)
        default: 0
      - name: projected_dc_cost_cents
        type: integer
        source: computed
        description: DC baseline for the same order at run time
        default: 0
      - name: projected_cost_index_bps
        type: integer
        source: computed
        description: "round_half_up(projected_cost_cents * 10000 / projected_dc_cost_cents); 0 when the DC baseline is 0"
        default: 0
      - name: unfulfillable_units
        type: integer
        source: computed
        description: open units the run could not cover
        default: 0
      - name: guardrail_overridden
        type: boolean
        source: computed
        description: true when the caller passed override_cost_guardrail and the run exceeded MAX_COST_INDEX_BPS
        default: false
      - name: status
        type: enum
        source: computed
        description: run outcome
        default: EVALUATED
        constraints: "EVALUATED | COMMITTED | NO_ELIGIBLE_NODE"

  - name: RoutingCandidate
    parent: null
    common_fields: false
    fields:
      - name: routing_run_id
        type: string
        source: computed
        description: "FK -> RoutingRun.id; run that evaluated this candidate"
      - name: store_id
        type: string
        source: computed
        description: "FK -> Store.id; evaluated node"
      - name: iteration
        type: integer
        source: computed
        description: waterfall iteration in which this evaluation happened (1-based)
      - name: eligible
        type: boolean
        source: computed
        description: candidate passed every eligibility filter clause
      - name: ineligible_reason
        type: enum
        source: computed
        description: first failing filter clause in the pinned order; null when eligible
        default: null
        constraints: "NODE_NOT_ELIGIBLE | CUTOFF_PASSED | CAPACITY_EXHAUSTED | LABOR_EXHAUSTED | NO_ATP | HAZMAT_NOT_CERTIFIED | EXCLUDED_BY_PRIOR_FAILURE"
      - name: coverage_units
        type: integer
        source: computed
        description: units this node could cover of the iteration's open units
        default: 0
      - name: coverage_ratio
        type: number
        source: computed
        description: "round_half_up(coverage_units / open_units_at_iteration, 4)"
        default: 0
      - name: cost_estimate_cents
        type: integer
        source: computed
        description: provisional assignment cost of the covered allocation at this node
        default: 0
      - name: delivery_days
        type: integer
        source: computed
        description: transit days from this node to the order's destination zone
        default: 0
      - name: routing_score
        type: number
        source: computed
        description: "calculations.routing_candidate_evaluation output; null when eligible == false"
        default: null
      - name: rank
        type: integer
        source: computed
        description: 1-based rank inside the iteration after tie-breaks; null when eligible == false
        default: null
      - name: selected
        type: boolean
        source: computed
        description: true when the waterfall picked this candidate in this iteration
        default: false
      - name: assigned_units
        type: integer
        source: computed
        description: units actually allocated to this node by the waterfall
        default: 0

  - name: FulfillmentAssignment
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: computed
        description: "FK -> CustomerOrder.id; order being fulfilled"
      - name: store_id
        type: string
        source: computed
        description: "FK -> Store.id; fulfilling node"
      - name: routing_run_id
        type: string
        source: computed
        description: "FK -> RoutingRun.id; run that created this assignment"
      - name: carrier_pickup_id
        type: string
        source: computed
        description: "FK -> CarrierPickup.id; pickup the parcel was tendered to; null until SHIPPED"
        default: null
      - name: superseded_by_routing_run_id
        type: string
        source: computed
        description: "FK -> RoutingRun.id; COMMIT run that superseded this still-unaccepted assignment; null otherwise"
        default: null
      - name: epoch
        type: integer
        source: computed
        description: epoch of the store's OPEN NodePerformanceWindow when this assignment was created
      - name: status
        type: enum
        source: computed
        description: in-store execution state
        default: ASSIGNED
        constraints: "ASSIGNED | ACCEPTED | PICKED | SHORT_PICKED | PACKED | SHIPPED | REJECTED | CANCELLED"
      - name: assigned_units
        type: integer
        source: computed
        description: units allocated at creation; immutable afterwards
      - name: picked_units
        type: integer
        source: computed
        description: units actually picked; 0 until a pick event
        default: 0
      - name: shortfall_units
        type: integer
        source: computed
        description: "assigned_units - picked_units after a short pick; 0 otherwise"
        default: 0
      - name: labor_minutes_reserved
        type: number
        source: computed
        description: "store.labor_standard_minutes_per_order + store.pick_labor_minutes_per_unit * assigned_units"
      - name: labor_minutes_actual
        type: number
        source: computed
        description: "floor((packed_at - accepted_at) / 60 seconds); null before PACKED"
        default: null
      - name: package_type
        type: enum
        source: computed
        description: package actually used at pack time; null before PACKED
        default: null
        constraints: "POLY_MAILER | SMALL_BOX | MEDIUM_BOX | LARGE_BOX"
      - name: derived_package_type
        type: enum
        source: computed
        description: package the provisional cost assumed, from the heaviest package_class in the allocation
        constraints: "SMALL_BOX | MEDIUM_BOX | LARGE_BOX"
      - name: billable_weight_grams
        type: integer
        source: computed
        description: sum over assignment lines of sku.unit_weight_grams * units (assigned units before pick, picked units after)
        default: 0
      - name: provisional_cost_cents
        type: integer
        source: computed
        description: "calculations.assignment_fulfillment_cost, variant provisional"
        default: 0
      - name: final_cost_cents
        type: integer
        source: computed
        description: "calculations.assignment_fulfillment_cost, variant final; null before SHIPPED"
        default: null
      - name: pick_deadline_utc
        type: datetime
        source: computed
        description: "min(created_at + PICK_SLA_MINUTES, the store's cutoff instant on the creation date) (calculations.assignment_pick_deadline)"
      - name: accepted_at
        type: datetime
        source: computed
        description: clock instant of accept
        default: null
      - name: picked_at
        type: datetime
        source: computed
        description: clock instant of pick
        default: null
      - name: packed_at
        type: datetime
        source: computed
        description: clock instant of pack
        default: null
      - name: shipped_at
        type: datetime
        source: computed
        description: clock instant of ship
        default: null
      - name: cycle_time_minutes
        type: integer
        source: computed
        description: "floor((shipped_at - created_at) / 60 seconds); null before SHIPPED"
        default: null
      - name: reroute_generation
        type: integer
        source: computed
        description: 0 for assignments from a PLANNER run, +1 per system reroute that produced this assignment
        default: 0
      - name: reject_reason_code
        type: enum
        source: computed
        description: reason supplied on reject
        default: null
        constraints: "NO_STOCK_ON_FLOOR | LABOR_UNAVAILABLE | DAMAGED_UNITS | STORE_CLOSED"
      - name: cancel_reason_code
        type: enum
        source: computed
        description: reason supplied or synthesized on cancel
        default: null
        constraints: "CUSTOMER_REQUEST | STORE_SHORTAGE | SLA_RISK | SHORT_PICK_SHORTFALL | PICK_SLA_EXPIRED | NODE_DEACTIVATED | SUPERSEDED"

  - name: AssignmentLine
    parent: null
    common_fields: false
    fields:
      - name: assignment_id
        type: string
        source: computed
        description: "FK -> FulfillmentAssignment.id; owning assignment"
      - name: order_line_id
        type: string
        source: computed
        description: "FK -> OrderLine.id; demand line served"
      - name: units_assigned
        type: integer
        source: computed
        description: units allocated from this line; immutable after creation
      - name: units_picked
        type: integer
        source: computed
        description: units picked from this line
        default: 0
      - name: units_cancelled
        type: integer
        source: computed
        description: units released back to the line by reject / cancel / short-pick shortfall
        default: 0

  - name: NodePerformanceWindow
    parent: null
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: computed
        description: "FK -> Store.id; measured node"
      - name: epoch
        type: integer
        source: computed
        description: measurement epoch; advances network-wide at every ops-run close
      - name: status
        type: enum
        source: computed
        description: window lifecycle
        default: OPEN
        constraints: "OPEN | CLOSED"
      - name: opened_at_utc
        type: datetime
        source: computed
        description: clock instant the window opened
      - name: closed_at_utc
        type: datetime
        source: computed
        description: clock instant the window closed; null while OPEN
        default: null
      - name: assignments_created
        type: integer
        source: computed
        description: assignments with this store_id and epoch
        default: 0
      - name: assignments_shipped
        type: integer
        source: computed
        description: those with status == SHIPPED
        default: 0
      - name: assignments_rejected
        type: integer
        source: computed
        description: those with status == REJECTED
        default: 0
      - name: assignments_cancelled
        type: integer
        source: computed
        description: those with status == CANCELLED
        default: 0
      - name: units_promised
        type: integer
        source: computed
        description: sum of assigned_units over the window's assignments
        default: 0
      - name: units_shipped
        type: integer
        source: computed
        description: sum of picked_units over the window's SHIPPED assignments
        default: 0
      - name: fill_rate
        type: number
        source: computed
        description: "1.0000 when units_promised == 0, else round_half_up(units_shipped / units_promised, 4)"
        default: 0
      - name: avg_cycle_time_minutes
        type: number
        source: computed
        description: "0.00 when assignments_shipped == 0, else round_half_up(mean cycle_time_minutes over SHIPPED, 2)"
        default: 0
      - name: cancellation_rate
        type: number
        source: computed
        description: "0.0000 when assignments_created == 0, else round_half_up((assignments_rejected + assignments_cancelled) / assignments_created, 4)"
        default: 0
      - name: breach_flags
        type: array
        source: computed
        description: "subset of [FILL_RATE, CYCLE_TIME, CANCELLATION_RATE] in that fixed order"
        default: []
      - name: breached
        type: boolean
        source: computed
        description: "true when breach_flags is non-empty"
        default: false
      - name: store_cost_per_order_cents
        type: integer
        source: computed
        description: "0 when assignments_shipped == 0, else round_half_up(sum(final_cost_cents over SHIPPED) / assignments_shipped)"
        default: 0
      - name: dc_cost_per_order_cents
        type: integer
        source: computed
        description: "0 when assignments_shipped == 0, else round_half_up(sum(DC_BASE_CENTS_BY_ZONE[order.destination_zone] + DC_HANDLING_CENTS_PER_UNIT * picked_units over SHIPPED) / assignments_shipped)"
        default: 0
      - name: cost_index_bps
        type: integer
        source: computed
        description: "0 when dc_cost_per_order_cents == 0, else round_half_up(store_cost_per_order_cents * 10000 / dc_cost_per_order_cents)"
        default: 0
      - name: cost_disadvantaged
        type: boolean
        source: computed
        description: "true when cost_index_bps > COST_DISADVANTAGE_BPS"
        default: false
      - name: node_action
        type: enum
        source: computed
        description: posture action the close applied to the node
        default: NONE
        constraints: "NONE | PROBATION | DEACTIVATION | RECOVERY"

  - name: CustomerNotification
    parent: null
    common_fields: false
    fields:
      - name: order_id
        type: string
        source: computed
        description: "FK -> CustomerOrder.id; notified order"
      - name: assignment_id
        type: string
        source: computed
        description: "FK -> FulfillmentAssignment.id; triggering assignment; null for order-level events"
        default: null
      - name: notification_type
        type: enum
        source: computed
        description: customer-facing event
        constraints: "REJECTION_REROUTED | SHORT_PICK_REROUTED | CANCELLATION_PARTIAL | CANCELLATION_FULL | DC_FALLBACK | UNROUTABLE | NODE_DEACTIVATED_REROUTED"
      - name: channel
        type: enum
        source: computed
        description: delivery channel
        default: EMAIL
        constraints: "EMAIL | SMS"
      - name: units_affected
        type: integer
        source: computed
        description: units the event moved or removed
        default: 0
      - name: body_summary
        type: string
        source: computed
        description: "templated one-line summary containing order_code, notification_type and units_affected"
      - name: sent_at_utc
        type: datetime
        source: computed
        description: clock instant the notification was emitted

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------- Assignment
  - entity: FulfillmentAssignment
    initial_state: ASSIGNED
    terminal_states: [SHIPPED, REJECTED, CANCELLED]
    note: |
      Branching fork-join. The pick step forks on picked_units (PICKED when
      picked_units == assigned_units, SHORT_PICKED when 0 < picked_units <
      assigned_units) with divergent side-effect sets, and the two branches
      re-join at PACKED where the final-cost variant is computed identically
      from picked_units.
    transitions:
      - from: ASSIGNED
        to: ACCEPTED
        trigger: "POST /fulfillment-network/assignments/{assignment_id}/accept"
        actor: StoreAssociate
        preconditions:
          - "assignment.status == ASSIGNED"
          - "X-User-ID == assignment.store_id"
          - "store.node_status IN {ELIGIBLE, PROBATION}"
          - "the store has a NodePerformanceWindow with status == OPEN"
          - "clock_minute_of_day(now) <= store.cutoff_utc_minutes"
          - "now < assignment.pick_deadline_utc"
          - "sum of labor_minutes_reserved over the store's assignments with status IN {ACCEPTED, PICKED, SHORT_PICKED} whose [accepted_at, pick_deadline_utc) interval overlaps [now, assignment.pick_deadline_utc), plus this assignment's labor_minutes_reserved, <= floor(store.staffed_labor_minutes * CONCURRENT_PICK_LABOR_RATIO)"
          - "order.fulfillment_status != CANCELLED"
        side_effects:
          - "assignment.accepted_at = now"
          - "increments FulfillmentAssignment.version by 1"
      - from: ASSIGNED
        to: REJECTED
        trigger: "POST /fulfillment-network/assignments/{assignment_id}/reject"
        actor: StoreAssociate
        preconditions:
          - "assignment.status IN {ASSIGNED, ACCEPTED}"
          - "X-User-ID == assignment.store_id"
          - "reject_reason_code is one of NO_STOCK_ON_FLOOR | LABOR_UNAVAILABLE | DAMAGED_UNITS | STORE_CLOSED"
        side_effects:
          - "assignment.status = REJECTED, reject_reason_code stored"
          - "each AssignmentLine.units_cancelled = units_assigned"
          - "cascade hop 1: for every AssignmentLine, OrderLine.assigned_units -= units_assigned, so OrderLine.open_units increases (calculations.order_demand_units_reconciliation)"
          - "cascade hop 2: because the store's reservations dropped, StoreInventory.reserved_units decreases and available_to_promise_units is recomputed, and Store.units_committed_epoch / Store.reserved_labor_minutes decrease, which recomputes Store.eligibility_score (variant routing_trailing / cold_start)"
          - "cascade hop 3: because OrderLine.open_units > 0, a RoutingRun with mode COMMIT and initiated_by SYSTEM_REROUTE is created for the order with excluded_store_ids += assignment.store_id"
          - "cascade hop 4: that run's waterfall creates a replacement FulfillmentAssignment (reroute_generation = assignment.reroute_generation + 1) at the winning node, which reserves that node's StoreInventory.reserved_units and increments its Store.units_committed_epoch / Store.reserved_labor_minutes"
          - "cascade hop 5: the winning node's Store.eligibility_score is recomputed from its new reservation levels"
          - "a CustomerNotification with notification_type REJECTION_REROUTED (or DC_FALLBACK / UNROUTABLE when the reroute cannot cover) is emitted"
          - "CustomerOrder.routing_status is re-derived; CustomerOrder.provisional_cost_cents and cost_index_bps are recomputed"
          - "increments FulfillmentAssignment.version by 1"
      - from: ACCEPTED
        to: REJECTED
        trigger: "POST /fulfillment-network/assignments/{assignment_id}/reject"
        actor: StoreAssociate
        preconditions:
          - "assignment.status IN {ASSIGNED, ACCEPTED}"
          - "X-User-ID == assignment.store_id"
        side_effects:
          - "identical cascade to the ASSIGNED -> REJECTED transition"
      - from: ACCEPTED
        to: PICKED
        trigger: "POST /fulfillment-network/assignments/{assignment_id}/pick with picked_units == assigned_units"
        actor: StoreAssociate
        preconditions:
          - "assignment.status == ACCEPTED"
          - "X-User-ID == assignment.store_id"
          - "clock_minute_of_day(now) <= store.cutoff_utc_minutes"
          - "picked_units >= 1 and picked_units <= assignment.assigned_units"
          - "line_picks covers every AssignmentLine of the assignment exactly once and sum(line_picks[].units_picked) == picked_units"
        side_effects:
          - "assignment.picked_at = now, picked_units set, shortfall_units = 0"
          - "each AssignmentLine.units_picked set from line_picks"
          - "assignment.billable_weight_grams recomputed from picked units"
      - from: ACCEPTED
        to: SHORT_PICKED
        trigger: "POST /fulfillment-network/assignments/{assignment_id}/pick with 0 < picked_units < assigned_units"
        actor: StoreAssociate
        preconditions:
          - "assignment.status == ACCEPTED"
          - "X-User-ID == assignment.store_id"
          - "clock_minute_of_day(now) <= store.cutoff_utc_minutes"
          - "picked_units >= 1 (a zero pick is rejected with ERR_ZERO_PICK_NOT_ALLOWED; the associate must reject instead)"
        side_effects:
          - "assignment.picked_at = now, picked_units set, shortfall_units = assigned_units - picked_units"
          - "each AssignmentLine.units_picked set from line_picks; units_cancelled = units_assigned - units_picked"
          - "cascade hop 1: the shortfall releases OrderLine.assigned_units, raising OrderLine.open_units"
          - "cascade hop 2: StoreInventory.reserved_units for the shortfall SKUs decreases and available_to_promise_units is recomputed; Store.units_committed_epoch decreases by shortfall_units"
          - "cascade hop 3: a RoutingRun with mode COMMIT and initiated_by SYSTEM_REROUTE covering only the shortfall units is created, excluding this store"
          - "a CustomerNotification is emitted whose notification_type comes from the pinned selection in calculations.order_routing_status_derivation: SHORT_PICK_REROUTED when the reroute run created at least one replacement assignment, DC_FALLBACK when the shortfall became OrderLine.dc_fallback_units, else UNROUTABLE"
          - "assignment.labor_minutes_reserved is NOT rewritten (the labor standard was already committed); only the final-cost variant reflects picked_units"
      - from: PICKED
        to: PACKED
        trigger: "POST /fulfillment-network/assignments/{assignment_id}/pack"
        actor: StoreAssociate
        preconditions:
          - "assignment.status IN {PICKED, SHORT_PICKED}"
          - "X-User-ID == assignment.store_id"
          - "clock_minute_of_day(now) <= store.cutoff_utc_minutes"
          - "a PackagingSupply row exists for (store_id, package_type) with on_hand_units >= 1"
          - "PACKAGE_RANK[package_type] >= PACKAGE_RANK[assignment.derived_package_type]"
        side_effects:
          - "assignment.packed_at = now, package_type stored, labor_minutes_actual = floor((packed_at - accepted_at) / 60s)"
          - "PackagingSupply.on_hand_units -= 1, lifetime_consumed_units += 1, reorder_flag re-derived"
          - "assignment.final_cost_cents is NOT yet written (final variant is sealed at ship)"
      - from: SHORT_PICKED
        to: PACKED
        trigger: "POST /fulfillment-network/assignments/{assignment_id}/pack"
        actor: StoreAssociate
        preconditions:
          - "assignment.status IN {PICKED, SHORT_PICKED}"
          - "X-User-ID == assignment.store_id"
        side_effects:
          - "join point: identical side effects to PICKED -> PACKED; the final-cost variant consumes picked_units regardless of which branch arrived"
      - from: PACKED
        to: SHIPPED
        trigger: "POST /fulfillment-network/assignments/{assignment_id}/ship"
        actor: StoreAssociate
        preconditions:
          - "assignment.status == PACKED"
          - "X-User-ID == assignment.store_id"
          - "expected_pickup_version matches CarrierPickup.version (see concurrency_rules.pickup-slot-claim-stale-pickup)"
          - "pickup.store_id == assignment.store_id"
          - "pickup.status == SCHEDULED"
          - "pickup.window_start_utc <= now < pickup.window_end_utc"
          - "pickup.reserved_parcels < pickup.parcel_capacity"
          - "clock_minute_of_day(now) <= store.cutoff_utc_minutes"
        side_effects:
          - "assignment.status = SHIPPED, shipped_at = now, carrier_pickup_id set, cycle_time_minutes = floor((shipped_at - created_at) / 60s)"
          - "assignment.final_cost_cents = calculations.assignment_fulfillment_cost variant final"
          - "CarrierPickup.reserved_parcels += 1; increments CarrierPickup.version by 1"
          - "StoreInventory.on_hand_units -= units_picked and reserved_units -= units_assigned for each line's SKU; available_to_promise_units recomputed"
          - "Store.reserved_labor_minutes -= labor_minutes_reserved; Store.eligibility_score recomputed"
          - "OrderLine.shipped_units += units_picked, assigned_units -= units_assigned"
          - "CustomerOrder.shipped_units recomputed, fulfillment_status re-derived, final_cost_cents / cost_variance_cents / cost_index_bps recomputed when every unit is resolved"
          - "the store's OPEN NodePerformanceWindow counters (assignments_shipped, units_shipped, avg_cycle_time_minutes, cost aggregates) are recomputed"
          - "increments FulfillmentAssignment.version by 1"
      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /fulfillment-network/assignments/{assignment_id}/cancel, or system cancellation at POST /fulfillment-network/performance-windows/close (pick-SLA expiry, node deactivation) or supersede by a COMMIT RoutingRun"
        actor: CustomerCare | system
        preconditions:
          - "assignment.status IN {ASSIGNED, ACCEPTED, PICKED, SHORT_PICKED}"
          - "cancel_reason_code is one of CUSTOMER_REQUEST | STORE_SHORTAGE | SLA_RISK when the actor is CustomerCare"
        side_effects:
          - "assignment.status = CANCELLED, cancel_reason_code stored"
          - "cascade hop 1: AssignmentLine.units_cancelled = units_assigned - units_picked releases OrderLine.assigned_units"
          - "cascade hop 2: StoreInventory.reserved_units and Store.units_committed_epoch / reserved_labor_minutes decrease, Store.eligibility_score recomputed"
          - "cascade hop 3: when reroute is true a RoutingRun with initiated_by SYSTEM_REROUTE (or SYSTEM_DEACTIVATION for a deactivation cascade) is created excluding this store; when reroute is false the released units become OrderLine.cancelled_units"
          - "a CustomerNotification with notification_type CANCELLATION_PARTIAL, CANCELLATION_FULL or NODE_DEACTIVATED_REROUTED is emitted"
          - "CustomerOrder.routing_status and fulfillment_status are re-derived"
      - from: ACCEPTED
        to: CANCELLED
        trigger: "POST /fulfillment-network/assignments/{assignment_id}/cancel or system cancellation"
        actor: CustomerCare | system
        preconditions:
          - "assignment.status IN {ASSIGNED, ACCEPTED, PICKED, SHORT_PICKED}"
        side_effects:
          - "identical cascade to ASSIGNED -> CANCELLED"
      - from: PICKED
        to: CANCELLED
        trigger: "POST /fulfillment-network/assignments/{assignment_id}/cancel"
        actor: CustomerCare
        preconditions:
          - "assignment.status IN {ASSIGNED, ACCEPTED, PICKED, SHORT_PICKED}"
        side_effects:
          - "identical cascade to ASSIGNED -> CANCELLED; already-picked units are returned to StoreInventory reservations and released"
      - from: SHORT_PICKED
        to: CANCELLED
        trigger: "POST /fulfillment-network/assignments/{assignment_id}/cancel"
        actor: CustomerCare
        preconditions:
          - "assignment.status IN {ASSIGNED, ACCEPTED, PICKED, SHORT_PICKED}"
        side_effects:
          - "identical cascade to ASSIGNED -> CANCELLED"
        note: "PACKED and the three terminal states reject cancel with ERR_ASSIGNMENT_STATE_INVALID (packaging has already been consumed)."

  # -------------------------------------------- Order, routing dimension
  - entity: CustomerOrder
    dimension: routing_status
    initial_state: UNROUTED
    terminal_states: []
    note: |
      Parallel dimension 1 of 2 on CustomerOrder (routing_status evolves
      independently of fulfillment_status), and cyclic: ROUTED -> ROUTING ->
      ROUTED whenever a node fails an assignment and the reroute re-covers the
      units. The value is always the output of this pinned derivation,
      evaluated after every RoutingRun and after every FulfillmentAssignment
      status change (calculations.order_routing_status_derivation).
    transitions:
      - from: UNROUTED
        to: ROUTED
        trigger: "POST /fulfillment-network/orders/{order_id}/routing-runs with mode COMMIT that covers every open unit"
        actor: NetworkPlanner
        preconditions:
          - "order.fulfillment_status == PENDING"
          - "order has at least one OrderLine with open_units >= 1"
          - "expected_order_version matches CustomerOrder.version (see concurrency_rules.routing-run-create-stale-order)"
        side_effects:
          - "RoutingCandidate rows persisted per iteration; FulfillmentAssignment rows created per selected node"
          - "StoreInventory.reserved_units, Store.units_committed_epoch, Store.reserved_labor_minutes increase; Store.eligibility_score recomputed for every selected node"
          - "CustomerOrder.split_count, provisional_cost_cents, dc_baseline_cost_cents, cost_index_bps recomputed"
          - "increments CustomerOrder.version by 1"
      - from: UNROUTED
        to: PARTIALLY_ROUTED
        trigger: "POST /fulfillment-network/orders/{order_id}/routing-runs with mode COMMIT that covers some but not all open units"
        actor: NetworkPlanner
        preconditions:
          - "same as UNROUTED -> ROUTED"
        side_effects:
          - "uncovered units remain OrderLine.open_units when the run was PLANNER-initiated; RoutingRun.unfulfillable_units records them"
          - "a CustomerNotification with notification_type DC_FALLBACK is emitted only when the units were converted to OrderLine.dc_fallback_units by MAX_SPLITS_PER_ORDER exhaustion"
      - from: UNROUTED
        to: UNROUTABLE
        trigger: "POST /fulfillment-network/orders/{order_id}/routing-runs with mode COMMIT whose candidate pool is empty at iteration 1"
        actor: NetworkPlanner
        preconditions:
          - "same as UNROUTED -> ROUTED"
        side_effects:
          - "RoutingRun.status = NO_ELIGIBLE_NODE, selected_store_count = 0, unfulfillable_units = order.unassigned_units"
          - "a CustomerNotification with notification_type UNROUTABLE is emitted"
          - "no FulfillmentAssignment is created and no reservation changes"
      - from: ROUTED
        to: ROUTING
        trigger: "system: a FulfillmentAssignment for this order reaches REJECTED, SHORT_PICKED or CANCELLED and the immediate SYSTEM_REROUTE run finds no eligible node while order.reroute_attempt_count < MAX_REROUTE_ATTEMPTS"
        actor: system
        preconditions:
          - "OrderLine.open_units > 0 after the release"
          - "the most recent RoutingRun has initiated_by IN {SYSTEM_REROUTE, SYSTEM_DEACTIVATION} and status == NO_ELIGIBLE_NODE"
        side_effects:
          - "the order is queued for retry at ops-run step 6 of the next POST /fulfillment-network/performance-windows/close"
      - from: ROUTING
        to: ROUTED
        trigger: "system: ops-run step 6 retry (or a planner COMMIT run) covers every open unit"
        actor: system | NetworkPlanner
        preconditions:
          - "a candidate node is eligible for the open units"
        side_effects:
          - "replacement FulfillmentAssignment rows created; reroute_attempt_count increases; cost fields recomputed"
      - from: ROUTING
        to: PARTIALLY_ROUTED
        trigger: "system: ops-run step 6 retry covers part of the open units"
        actor: system
        preconditions:
          - "at least one but not every open unit is coverable"
        side_effects:
          - "covered units assigned; remaining units stay open or become dc_fallback_units when reroute_attempt_count == MAX_REROUTE_ATTEMPTS"
      - from: ROUTING
        to: UNROUTABLE
        trigger: "system: ops-run step 6 retry finds no eligible node and order.reroute_attempt_count reaches MAX_REROUTE_ATTEMPTS"
        actor: system
        preconditions:
          - "no candidate node is eligible and no store-covered unit remains on the order"
        side_effects:
          - "remaining open units become OrderLine.dc_fallback_units; a CustomerNotification with notification_type DC_FALLBACK is emitted"
      - from: UNROUTABLE
        to: ROUTED
        trigger: "POST /fulfillment-network/orders/{order_id}/routing-runs with mode COMMIT after inventory or node posture changed"
        actor: NetworkPlanner
        preconditions:
          - "order.fulfillment_status == PENDING"
          - "at least one OrderLine has open_units >= 1"
        side_effects:
          - "same as UNROUTED -> ROUTED; closes the cycle so an UNROUTABLE order is never permanently stuck"
      - from: PARTIALLY_ROUTED
        to: ROUTED
        trigger: "POST /fulfillment-network/orders/{order_id}/routing-runs with mode COMMIT that covers the remaining open units"
        actor: NetworkPlanner
        preconditions:
          - "at least one OrderLine has open_units >= 1"
        side_effects:
          - "same as UNROUTED -> ROUTED"

  # ---------------------------------------- Order, fulfillment dimension
  - entity: CustomerOrder
    dimension: fulfillment_status
    initial_state: PENDING
    terminal_states: [SHIPPED, CANCELLED]
    note: |
      Parallel dimension 2 of 2 on CustomerOrder. It advances only on ship and
      cancel events and never reads routing_status: an order can be
      PARTIALLY_SHIPPED while routing_status is ROUTING, and SHIPPED while
      routing_status is PARTIALLY_ROUTED (DC fallback units).
    transitions:
      - from: PENDING
        to: PARTIALLY_SHIPPED
        trigger: "POST /fulfillment-network/assignments/{assignment_id}/ship leaving unresolved units"
        actor: StoreAssociate
        preconditions:
          - "order.shipped_units > 0 after the ship"
          - "order.shipped_units + sum(OrderLine.cancelled_units) + order.dc_fallback_units < order.total_units"
        side_effects:
          - "order.shipped_units recomputed; provisional cost fields refreshed"
      - from: PENDING
        to: SHIPPED
        trigger: "POST /fulfillment-network/assignments/{assignment_id}/ship resolving the last unit"
        actor: StoreAssociate
        preconditions:
          - "order.shipped_units > 0 and shipped_units + cancelled_units + dc_fallback_units == order.total_units"
        side_effects:
          - "order.final_cost_cents = calculations.order_cost_per_order_comparison variant final"
          - "order.cost_variance_cents = final_cost_cents - provisional_cost_cents; cost_index_bps recomputed against final_cost_cents"
      - from: PARTIALLY_SHIPPED
        to: SHIPPED
        trigger: "POST /fulfillment-network/assignments/{assignment_id}/ship resolving the last unit, or an ops-run step-6 DC fallback that resolves the order's last unresolved unit while shipped_units > 0"
        actor: StoreAssociate
        preconditions:
          - "order.shipped_units > 0 and shipped_units + cancelled_units + dc_fallback_units == order.total_units"
        side_effects:
          - "same as PENDING -> SHIPPED"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /fulfillment-network/orders/{order_id}/cancel"
        actor: CustomerCare
        preconditions:
          - "order.fulfillment_status == PENDING"
          - "order.shipped_units == 0"
        side_effects:
          - "every non-terminal FulfillmentAssignment of the order is CANCELLED with cancel_reason_code CUSTOMER_REQUEST and no reroute"
          - "all released units become OrderLine.cancelled_units; open_units becomes 0; line_status = CANCELLED"
          - "a single CustomerNotification with notification_type CANCELLATION_FULL is emitted"
          - "order.final_cost_cents remains null; cost_index_bps recomputed from provisional_cost_cents"
      - from: PARTIALLY_SHIPPED
        to: CANCELLED
        trigger: "not permitted"
        actor: CustomerCare
        preconditions:
          - "unreachable: once shipped_units > 0 a full cancel resolves the order to SHIPPED instead (ERR_ORDER_ALREADY_SHIPPED_UNITS)"
        side_effects: []

  # ------------------------------------------------------------- Pickup
  - entity: CarrierPickup
    initial_state: SCHEDULED
    terminal_states: [DEPARTED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CLOSED
        trigger: "POST /fulfillment-network/carrier-pickups/{pickup_id}/close"
        actor: CarrierCoordinator
        preconditions:
          - "pickup.status == SCHEDULED"
        side_effects:
          - "no further parcels can be tendered to this pickup (ship then fails with ERR_PICKUP_STATE_INVALID)"
          - "increments CarrierPickup.version by 1"
      - from: CLOSED
        to: DEPARTED
        trigger: "POST /fulfillment-network/carrier-pickups/{pickup_id}/depart"
        actor: CarrierCoordinator
        preconditions:
          - "pickup.status == CLOSED"
        side_effects:
          - "pickup is sealed; reserved_parcels is frozen"
          - "increments CarrierPickup.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /fulfillment-network/carrier-pickups/{pickup_id}/cancel"
        actor: CarrierCoordinator
        preconditions:
          - "pickup.status == SCHEDULED"
          - "pickup.reserved_parcels == 0 (else ERR_PICKUP_HAS_PARCELS)"
        side_effects:
          - "the window is released so a new overlapping CarrierPickup may be scheduled for the store"
          - "increments CarrierPickup.version by 1"

  # -------------------------------------------------------- Store posture
  - entity: Store
    dimension: node_status
    initial_state: ELIGIBLE
    terminal_states: []
    note: |
      Cyclic: ELIGIBLE -> PROBATION -> DEACTIVATED -> ELIGIBLE, and
      PROBATION -> ELIGIBLE on recovery. Every transition except reactivation
      is produced by the ops-run at POST /performance-windows/close.
    transitions:
      - from: ELIGIBLE
        to: PROBATION
        trigger: "POST /fulfillment-network/performance-windows/close (ops-run step 3) when the store's window is breached"
        actor: system
        preconditions:
          - "window.assignments_created >= 1"
          - "window.breach_flags is non-empty"
          - "store.consecutive_breach_windows becomes 1"
        side_effects:
          - "window.node_action = PROBATION; store.consecutive_breach_windows = 1"
          - "store.review_score written (variant governance_blended)"
          - "the node keeps routing eligibility but its routing_score carries the PROBATION_SCORE_PENALTY"
      - from: PROBATION
        to: DEACTIVATED
        trigger: "POST /fulfillment-network/performance-windows/close (ops-run step 3) on a second consecutive breached window"
        actor: system
        preconditions:
          - "window.assignments_created >= 1"
          - "window.breach_flags is non-empty"
          - "store.consecutive_breach_windows reaches MAX_CONSECUTIVE_BREACH_WINDOWS"
        side_effects:
          - "window.node_action = DEACTIVATION; store.node_status = DEACTIVATED; store.deactivated_at_epoch = window.epoch"
          - "cascade hop 1: every FulfillmentAssignment of this store with status IN {ASSIGNED, ACCEPTED, PICKED, SHORT_PICKED, PACKED} is CANCELLED with cancel_reason_code NODE_DEACTIVATED, in ascending assignment.created_at order"
          - "cascade hop 2: each cancellation releases OrderLine.assigned_units and this store's StoreInventory.reserved_units, and re-derives CustomerOrder.routing_status to ROUTING (the reroute is deferred to ops-run step 6, so the replacement assignment is stamped with the NEW epoch)"
          - "cascade hop 3: at step 6 a RoutingRun with mode COMMIT and initiated_by SYSTEM_DEACTIVATION is created per affected order, excluding this store"
          - "cascade hop 4: each such run creates a replacement FulfillmentAssignment at the winning node, raising that node's StoreInventory.reserved_units and Store.units_committed_epoch"
          - "cascade hop 5: the winning node's Store.eligibility_score is recomputed (step 7)"
          - "a CustomerNotification is emitted per affected order by the step-6 run (notification_type per the selection rule on calculations.order_routing_status_derivation)"
          - "no epoch+1 NodePerformanceWindow is opened for a DEACTIVATED store (ops-run step 5)"
      - from: PROBATION
        to: ELIGIBLE
        trigger: "POST /fulfillment-network/performance-windows/close (ops-run step 3) on a clean non-empty window"
        actor: system
        preconditions:
          - "window.assignments_created >= 1"
          - "window.breach_flags is empty"
        side_effects:
          - "window.node_action = RECOVERY; store.consecutive_breach_windows = 0; store.node_status = ELIGIBLE"
      - from: DEACTIVATED
        to: ELIGIBLE
        trigger: "POST /fulfillment-network/stores/{store_id}/reactivate"
        actor: NetworkPlanner
        preconditions:
          - "store.node_status == DEACTIVATED"
        side_effects:
          - "store.node_status = ELIGIBLE, consecutive_breach_windows = 0, deactivated_at_epoch = null, reactivation_count += 1"
          - "when the store has no OPEN window, one is created at epoch = max(network current epoch, this store's highest existing epoch + 1) — epochs are unique per store, so a reactivated node never re-uses a closed epoch"
          - "store.eligibility_score recomputed with eligibility_score_basis = TRAILING_WINDOW when the store has at least one CLOSED window, else COLD_START"
        note: "An empty (assignments_created == 0) window never changes posture and never resets consecutive_breach_windows — node_action stays NONE."

  # ------------------------------------------------- Performance window
  - entity: NodePerformanceWindow
    initial_state: OPEN
    terminal_states: [CLOSED]
    note: "Compound: every metric field is derived from the window's child FulfillmentAssignment rows (same store_id and epoch) at close time."
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /fulfillment-network/performance-windows/close (network-wide ops-run)"
        actor: NetworkPlanner
        preconditions:
          - "at least one NodePerformanceWindow has status == OPEN (else ERR_NO_OPEN_WINDOW)"
        side_effects:
          - "step 1: every FulfillmentAssignment with status IN {ASSIGNED, ACCEPTED} and pick_deadline_utc <= now is CANCELLED with cancel_reason_code PICK_SLA_EXPIRED, processed in ascending assignment.created_at order; the released units stay open and the order's routing_status re-derives to ROUTING (the reroute is deferred to step 6, never performed inside step 1)"
          - "step 2: for every store with an OPEN window, in ascending store.created_at order, all metric fields are computed (calculations.node_performance_metrics)"
          - "step 3: breach_flags / node_action are applied, store.review_score is written from the pre-reset counters, and any DEACTIVATION cascade runs"
          - "step 4: window.status = CLOSED, closed_at_utc = now, and store.units_committed_epoch = 0"
          - "step 5: a new OPEN NodePerformanceWindow with epoch + 1 is created for every store with node_status IN {ELIGIBLE, PROBATION}"
          - "step 6: every CustomerOrder with routing_status == ROUTING is retried with a COMMIT RoutingRun, in ascending order.created_at order; the retry run carries excluded_store_ids = [] (a fresh network-wide attempt — per-event exclusion applies only to the immediate reroute run), and initiated_by = SYSTEM_DEACTIVATION when step 3 released this order's units, else SYSTEM_REROUTE"
          - "step 7: store.eligibility_score is recomputed for every store with node_status IN {ELIGIBLE, PROBATION} using the just-closed window (eligibility_score_basis = TRAILING_WINDOW)"

# =============================================================================
# §1.2.1 Concurrency Rules  (OCC on the parent's version — the only mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: routing-run-create-stale-order
    parent_entity: CustomerOrder
    write_endpoint: "POST /fulfillment-network/orders/{order_id}/routing-runs"
    occ_field: "expected_order_version"
    description: |
      Creating a COMMIT RoutingRun for a CustomerOrder whose version has
      advanced since the client last read it is rejected. A COMMIT run
      legitimately supersedes the order's still-unaccepted assignments (each
      gets superseded_by_routing_run_id and status CANCELLED with
      cancel_reason_code SUPERSEDED), so a writer holding a stale view of the
      order would supersede allocations it never saw.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

  - rule_id: pickup-slot-claim-stale-pickup
    parent_entity: CarrierPickup
    write_endpoint: "POST /fulfillment-network/assignments/{assignment_id}/ship"
    occ_field: "expected_pickup_version"
    description: |
      Tendering a parcel to a CarrierPickup whose version has advanced since
      the client last read it is rejected. Each successful tender consumes one
      of the window's parcel slots and bumps the pickup's version, so a
      stale-version tender is claiming a slot count the client never observed.
    error_id: ERR_STALE_PICKUP_VERSION
    http_status: 412

  - rule_id: inventory-adjustment-stale-inventory
    parent_entity: StoreInventory
    write_endpoint: "POST /fulfillment-network/store-inventories/{inventory_id}/adjustments"
    occ_field: "expected_inventory_version"
    description: |
      Posting a cycle-count or shrink adjustment against a StoreInventory row
      whose version has advanced since the client last read it is rejected.
      Adjustments legitimately overwrite on_hand_units with a counted value,
      so an adjustment computed from a stale on-hand figure would silently
      erase an intervening receipt or ship decrement.
    error_id: ERR_STALE_INVENTORY_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # ------------------------------------------------------------------ 1
  - name: store_eligibility_score
    trigger: |
      Recomputed whenever a Store's reservation levels change (routing-run
      commit, accept, reject, cancel, pick shortfall, ship), on
      POST /stores/{store_id}/reactivate, and at ops-run step 7 of
      POST /performance-windows/close. The governance_blended variant is
      written to Store.review_score only at ops-run step 3.
    algorithm: weighted_scoring
    formula: |
      capacity_headroom = max(0, store.daily_unit_capacity - store.units_committed_epoch)
      capacity_component = round_half_up(WEIGHT_CAPACITY * min(1, capacity_headroom / CAPACITY_REFERENCE_UNITS), 4)

      labor_headroom = max(0, store.staffed_labor_minutes - store.reserved_labor_minutes)
      labor_component = round_half_up(WEIGHT_LABOR * min(1, labor_headroom / LABOR_REFERENCE_MINUTES), 4)

      # performance_ratio depends on the variant (see variants below)
      cycle_time_factor(window) = round_half_up(
          max(0, min(1, (CYCLE_TIME_CEILING_MINUTES - window.avg_cycle_time_minutes)
                        / (CYCLE_TIME_CEILING_MINUTES - CYCLE_TIME_FLOOR_MINUTES))), 4)
      performance_ratio(window) = 0.5 * window.fill_rate
                                + 0.3 * (1 - window.cancellation_rate)
                                + 0.2 * cycle_time_factor(window)

      performance_component = round_half_up(WEIGHT_PERFORMANCE * performance_ratio, 4)
      score = round_half_up(capacity_component + labor_component + performance_component, 2)
    input_set: |
      capacity_headroom and labor_headroom read the Store row's own computed
      counters (which aggregate FulfillmentAssignment rows with status NOT IN
      {REJECTED, CANCELLED} for the epoch, and status IN {ASSIGNED, ACCEPTED,
      PICKED, SHORT_PICKED, PACKED} for labor). performance_ratio reads only
      NodePerformanceWindow rows with status == CLOSED for this store, ordered
      by epoch DESC (latest = highest epoch; epochs are unique per store, so no
      tie-break is needed).
    constants:
      WEIGHT_CAPACITY: 40
      WEIGHT_LABOR: 30
      WEIGHT_PERFORMANCE: 30
      CAPACITY_REFERENCE_UNITS: 200
      LABOR_REFERENCE_MINUTES: 480
      CYCLE_TIME_FLOOR_MINUTES: 60
      CYCLE_TIME_CEILING_MINUTES: 300
      COLD_START_PERFORMANCE_RATIO: 0.60
      BLEND_WEIGHT_LATEST: 0.7
      BLEND_WEIGHT_PRIOR: 0.3
    precision: "components at 4 decimal places, final score at 2 decimal places, round_half_up throughout"
    variants:
      - name: cold_start
        when: "the store has zero CLOSED NodePerformanceWindow rows"
        difference: "performance_ratio = COLD_START_PERFORMANCE_RATIO (0.60) flat; eligibility_score_basis = COLD_START"
      - name: routing_trailing
        when: "written to Store.eligibility_score whenever the store has at least one CLOSED window"
        difference: "performance_ratio = performance_ratio(latest CLOSED window) only — a single window, no blending; eligibility_score_basis = TRAILING_WINDOW"
      - name: governance_blended
        when: "written to Store.review_score at ops-run step 3, computed BEFORE step 4 resets units_committed_epoch"
        difference: |
          performance_ratio = BLEND_WEIGHT_LATEST * performance_ratio(window being closed)
                            + BLEND_WEIGHT_PRIOR * performance_ratio(previous CLOSED window)
          when a previous CLOSED window exists, else performance_ratio(window being closed) alone.
          Because it runs before the reset, capacity_component still sees the epoch's
          committed units, so review_score and eligibility_score diverge for the same store
          in the same close.

  # ------------------------------------------------------------------ 2
  - name: store_available_to_promise
    trigger: "On StoreInventory create, on POST /store-inventories/{inventory_id}/adjustments, and on every reservation change (routing-run commit, reject, cancel, short-pick shortfall, ship)."
    algorithm: aggregation
    formula: |
      reserved_units = sum of (AssignmentLine.units_assigned - AssignmentLine.units_cancelled)
                       over AssignmentLines whose assignment.store_id == this store,
                       whose OrderLine.sku_id == this sku, and whose
                       assignment.status IN {ASSIGNED, ACCEPTED, PICKED, SHORT_PICKED, PACKED}
      available_to_promise_units = max(0, on_hand_units - reserved_units - safety_stock_units)
    input_set: "Only assignments in the five non-terminal statuses hold reservations. SHIPPED decrements on_hand_units and drops the reservation in one step; REJECTED and CANCELLED drop the reservation only."
    constants: {}
    precision: "integer units, no rounding"
    variants: []

  # ------------------------------------------------------------------ 3
  - name: assignment_fulfillment_cost
    trigger: "provisional variant at RoutingCandidate evaluation and at FulfillmentAssignment creation; final variant at POST /assignments/{assignment_id}/ship."
    algorithm: tiered_pricing
    formula: |
      zone_delta = abs(order.destination_zone - store.origin_zone)

      # --- ship cost: ROUND PER LINE, THEN SUM (pinned order) ---
      # lines are walked in ascending OrderLine.created_at
      for each line in the allocation:
        line_weight_grams = sku.unit_weight_grams * units_on_line
        line_ship_cents = round_half_up(
            (ZONE_BASE_CENTS[zone_delta] + WEIGHT_STEP_CENTS * ceil(line_weight_grams / WEIGHT_STEP_GRAMS))
            * SERVICE_MULTIPLIER[order.service_level])
      ship_cost_cents = SUM(line_ship_cents)      # NOT round_half_up(SUM(raw_line_cost) * multiplier)

      labor_cost_cents   = ceil(labor_minutes_charged * store.labor_rate_cents_per_minute)
      package_cost_cents = PACKAGE_BASE_CENTS[package_type_charged] + DUNNAGE_CENTS_PER_UNIT * units_charged

      cost_cents = labor_cost_cents + package_cost_cents + ship_cost_cents
    input_set: |
      The allocation is the set of AssignmentLine rows of the assignment (or the
      candidate's planned allocation during a routing run). Cancelled units are
      excluded from the final variant; they were included in the provisional one.
    constants:
      ZONE_BASE_CENTS: { 0: 320, 1: 380, 2: 445, 3: 520, 4: 610, 5: 700, 6: 800, 7: 900 }
      WEIGHT_STEP_GRAMS: 500
      WEIGHT_STEP_CENTS: 25
      SERVICE_MULTIPLIER: { GROUND: 1.00, EXPEDITED: 1.35 }
      PACKAGE_BASE_CENTS: { POLY_MAILER: 45, SMALL_BOX: 85, MEDIUM_BOX: 130, LARGE_BOX: 190 }
      DUNNAGE_CENTS_PER_UNIT: 15
      MIN_BILLABLE_LABOR_MINUTES: 10
      PACKAGE_CLASS_TO_TYPE: { SMALL: SMALL_BOX, MEDIUM: MEDIUM_BOX, LARGE: LARGE_BOX }
      PACKAGE_RANK: { POLY_MAILER: 1, SMALL_BOX: 2, MEDIUM_BOX: 3, LARGE_BOX: 4 }
    precision: "each line rounded to whole cents with round_half_up BEFORE summation; labor uses ceil; all money is integer cents"
    variants:
      - name: provisional
        when: "candidate evaluation and assignment creation (FulfillmentAssignment.provisional_cost_cents)"
        difference: |
          labor_minutes_charged = store.labor_standard_minutes_per_order
                                + store.pick_labor_minutes_per_unit * assigned_units  (the labor STANDARD);
          units_charged = assigned_units;
          package_type_charged = derived_package_type
            = PACKAGE_CLASS_TO_TYPE[the highest PACKAGE_RANK package_class among the allocation's SKUs].
      - name: final
        when: "ship (FulfillmentAssignment.final_cost_cents)"
        difference: |
          labor_minutes_charged = max(labor_minutes_actual, MIN_BILLABLE_LABOR_MINUTES) where
          labor_minutes_actual = floor((packed_at - accepted_at) / 60 seconds)  (ACTUAL clocked labor);
          units_charged = picked_units;
          package_type_charged = the package_type the associate recorded at pack.
          The two variants therefore diverge for identical allocations whenever actual
          labor differs from the standard, a bigger box was used, or units were short-picked.

  # ------------------------------------------------------------------ 4
  - name: routing_candidate_evaluation
    trigger: "Once per Store per waterfall iteration inside POST /orders/{order_id}/routing-runs (both modes) and inside every system reroute run."
    algorithm: weighted_scoring
    formula: |
      coverage_factor = candidate.coverage_ratio                                     # already 4dp
      cost_factor  = round_half_up(max(0, min(1,
          (COST_CEILING_CENTS - candidate.cost_estimate_cents)
          / (COST_CEILING_CENTS - COST_FLOOR_CENTS))), 4)
      speed_factor = round_half_up(max(0, min(1,
          (MAX_TRANSIT_DAYS - candidate.delivery_days)
          / (MAX_TRANSIT_DAYS - MIN_TRANSIT_DAYS))), 4)
      health_factor = round_half_up(store.eligibility_score / 100, 4)

      raw = WEIGHT_COVERAGE * coverage_factor + WEIGHT_COST * cost_factor
          + WEIGHT_SPEED * speed_factor + WEIGHT_HEALTH * health_factor
      routing_score = round_half_up(raw - (PROBATION_SCORE_PENALTY if store.node_status == PROBATION else 0), 2)

      delivery_days = TRANSIT_DAYS_BY_ZONE_DELTA[abs(order.destination_zone - store.origin_zone)]
      if order.service_level == EXPEDITED: delivery_days = max(MIN_TRANSIT_DAYS, delivery_days - 1)
    input_set: "Every Store row is evaluated and persisted as a RoutingCandidate (eligible or not); routing_score and rank are null for ineligible candidates."
    constants:
      WEIGHT_COVERAGE: 45
      WEIGHT_COST: 25
      WEIGHT_SPEED: 20
      WEIGHT_HEALTH: 10
      COST_FLOOR_CENTS: 400
      COST_CEILING_CENTS: 2000
      TRANSIT_DAYS_BY_ZONE_DELTA: { 0: 1, 1: 2, 2: 2, 3: 3, 4: 4, 5: 5, 6: 5, 7: 6 }
      MIN_TRANSIT_DAYS: 1
      MAX_TRANSIT_DAYS: 6
      PROBATION_SCORE_PENALTY: 8
    precision: "factors at 4 decimal places, routing_score at 2 decimal places, round_half_up"
    variants: []

  # ------------------------------------------------------------------ 5
  - name: routing_node_selection_waterfall
    trigger: "POST /orders/{order_id}/routing-runs (PROVISIONAL evaluates only, COMMIT also creates assignments) and every system reroute run."
    algorithm: waterfall_allocation
    formula: |
      # supersede step (COMMIT only, before iteration 1):
      #   every FulfillmentAssignment of this order with status == ASSIGNED is CANCELLED with
      #   cancel_reason_code SUPERSEDED and superseded_by_routing_run_id = this run, releasing its units.
      remaining[sku] = sum of OrderLine.open_units per sku (lines ascending OrderLine.created_at)
      selected = []
      iteration = 1
      while sum(remaining) > 0 and len(selected) < MAX_SPLITS_PER_ORDER:
        # evaluate EVERY store, in ascending store.created_at, persisting a RoutingCandidate
        eligibility filter clauses, evaluated in this pinned order (first failure wins
        and is recorded in ineligible_reason):
          1. store.id NOT IN run.excluded_store_ids and store NOT IN selected  -> EXCLUDED_BY_PRIOR_FAILURE
          2. store.node_status IN {ELIGIBLE, PROBATION}                        -> NODE_NOT_ELIGIBLE
          3. store has a NodePerformanceWindow with status == OPEN             -> NODE_NOT_ELIGIBLE
          4. clock_minute_of_day(now) <= store.cutoff_utc_minutes              -> CUTOFF_PASSED
          5. capacity_units_left = store.daily_unit_capacity - store.units_committed_epoch >= 1
                                                                              -> CAPACITY_EXHAUSTED
          6. labor_units_left = floor((store.staffed_labor_minutes - store.reserved_labor_minutes
               - store.labor_standard_minutes_per_order) / store.pick_labor_minutes_per_unit) >= 1
                                                                              -> LABOR_EXHAUSTED
          7. every sku in remaining with hazmat_flag == true has store.hazmat_certified == true
                                                                              -> HAZMAT_NOT_CERTIFIED
          8. atp_units = sum over sku in remaining of
               min(remaining[sku], StoreInventory(store, sku).available_to_promise_units or 0) >= 1
                                                                              -> NO_ATP
        coverage_units = min(atp_units, capacity_units_left, labor_units_left, sum(remaining))
          allocated per line by walking the order's lines in ascending OrderLine.created_at and
          taking min(line open units still unallocated, that sku's remaining ATP at this store)
          until coverage_units is exhausted
        coverage_ratio = round_half_up(coverage_units / sum(remaining), 4)
        cost_estimate_cents = assignment_fulfillment_cost(variant provisional) for that allocation
        routing_score = routing_candidate_evaluation(...)

        rank eligible candidates by:
          routing_score DESC, then cost_estimate_cents ASC, then coverage_units DESC,
          then store.created_at ASC          # never store.id
        SPLIT MINIMIZATION RESTRICTION: if any eligible candidate has
          coverage_units == sum(remaining), the selectable set is restricted to those
          full-coverage candidates and the winner is the best-ranked among them — even when a
          partial-coverage candidate has a strictly higher routing_score.
        else the winner is rank 1 overall.
        if there is no eligible candidate: break
        winner.selected = true; winner.assigned_units = winner.coverage_units
        if mode == COMMIT: create FulfillmentAssignment + AssignmentLine rows for the allocation
        remaining -= winner allocation; selected += winner; iteration += 1

      unfulfillable_units = sum(remaining)
      planned_split_count = selected_store_count = len(selected)
      # DC handoff: when the loop exited because len(selected) == MAX_SPLITS_PER_ORDER while
      # unfulfillable_units > 0, those units become OrderLine.dc_fallback_units and a
      # DC_FALLBACK CustomerNotification is emitted. When the loop exited on an empty candidate
      # pool the units stay open and CustomerOrder.routing_status is re-derived.
      # Empty pool at iteration 1 -> RoutingRun.status = NO_ELIGIBLE_NODE and an UNROUTABLE
      # CustomerNotification.
    input_set: "Candidate pool = all Store rows (each persisted as a RoutingCandidate); demand set = OrderLine rows of this order with open_units >= 1."
    constants:
      MAX_SPLITS_PER_ORDER: 3
      MAX_REROUTE_ATTEMPTS: 2
    precision: "integer units; coverage_ratio 4 decimal places, round_half_up"
    variants:
      - name: evaluate_only
        when: "mode == PROVISIONAL"
        difference: "RoutingCandidate rows and RoutingRun projections are persisted with status EVALUATED; no FulfillmentAssignment is created, no reservation moves, no notification is emitted, and the cost guardrail is reported but never blocks."
      - name: commit
        when: "mode == COMMIT"
        difference: "runs the supersede step first, creates assignments and reservations, emits notifications, and is blocked by the cost guardrail unless override_cost_guardrail is true; status COMMITTED, or NO_ELIGIBLE_NODE when selected_store_count == 0."

  # ------------------------------------------------------------------ 6
  - name: order_cost_per_order_comparison
    trigger: "After every RoutingRun (projected fields), after every FulfillmentAssignment status change (provisional variant), and at the PENDING/PARTIALLY_SHIPPED -> SHIPPED transition of CustomerOrder.fulfillment_status (final variant). Also read by GET /orders/{order_id}/cost-comparison."
    algorithm: tiered_pricing
    formula: |
      component_sum_cents = sum of the included assignments' cost (variant-dependent)
      parcel_count        = number of included assignments
      pre_fee_subtotal_cents = component_sum_cents
                             + SPLIT_PENALTY_CENTS * max(0, parcel_count - 1)
                             + REROUTE_OVERHEAD_CENTS * order.reroute_attempt_count

      # EVALUATION ORDER IS PINNED: the overhead tier is keyed on pre_fee_subtotal_cents.
      # It is NOT re-keyed on store_cost_cents after the fee is added, and the fee never
      # re-tiers itself.
      rate = NETWORK_FEE_RATE_TIERS: 0.060 if pre_fee_subtotal_cents < TIER_1_CEILING_CENTS
             else 0.045 if pre_fee_subtotal_cents < TIER_2_CEILING_CENTS
             else 0.030
      network_fee_cents = round_half_up(pre_fee_subtotal_cents * rate)
      store_cost_cents  = pre_fee_subtotal_cents + network_fee_cents

      dc_baseline_cost_cents = DC_BASE_CENTS_BY_ZONE[order.destination_zone]
                             + DC_HANDLING_CENTS_PER_UNIT * order.total_units
      cost_index_bps = 0 if dc_baseline_cost_cents == 0
                       else round_half_up(store_cost_cents * 10000 / dc_baseline_cost_cents)
      savings_vs_dc_cents = dc_baseline_cost_cents - store_cost_cents
    input_set: |
      provisional variant: FulfillmentAssignment rows of the order with status NOT IN
      {REJECTED, CANCELLED}, using provisional_cost_cents.
      final variant: FulfillmentAssignment rows with status == SHIPPED, using final_cost_cents.
      Both count reroute overhead from CustomerOrder.reroute_attempt_count.
    constants:
      SPLIT_PENALTY_CENTS: 175
      REROUTE_OVERHEAD_CENTS: 90
      TIER_1_CEILING_CENTS: 2000
      TIER_2_CEILING_CENTS: 5000
      TIER_1_RATE: 0.060
      TIER_2_RATE: 0.045
      TIER_3_RATE: 0.030
      DC_BASE_CENTS_BY_ZONE: { 1: 1450, 2: 1560, 3: 1700, 4: 1850, 5: 2010, 6: 2180, 7: 2360, 8: 2550 }
      DC_HANDLING_CENTS_PER_UNIT: 120
      MAX_COST_INDEX_BPS: 15000
      COST_DISADVANTAGE_BPS: 11000
    precision: "integer cents, round_half_up on the fee and on cost_index_bps"
    variants:
      - name: provisional
        when: "written to CustomerOrder.provisional_cost_cents on every routing / assignment change"
        difference: "consumes FulfillmentAssignment.provisional_cost_cents over the five non-terminal statuses plus SHIPPED"
      - name: final
        when: "written to CustomerOrder.final_cost_cents when fulfillment_status becomes SHIPPED"
        difference: "consumes FulfillmentAssignment.final_cost_cents over SHIPPED assignments only; the tier can therefore land in a different band than the provisional pass, and cost_variance_cents = final_cost_cents - provisional_cost_cents"

  # ------------------------------------------------------------------ 7
  - name: node_performance_metrics
    trigger: "Continuously on the store's OPEN NodePerformanceWindow as its assignments change status, and authoritatively at ops-run step 2 of POST /performance-windows/close."
    algorithm: aggregation
    formula: |
      W = FulfillmentAssignment rows with this store_id and epoch == window.epoch
      assignments_created   = count(W)
      assignments_shipped   = count(W where status == SHIPPED)
      assignments_rejected  = count(W where status == REJECTED)
      assignments_cancelled = count(W where status == CANCELLED)
      units_promised = sum(assigned_units over W)
      units_shipped  = sum(picked_units over W where status == SHIPPED)

      fill_rate = 1.0000 if units_promised == 0
                  else round_half_up(units_shipped / units_promised, 4)
      avg_cycle_time_minutes = 0.00 if assignments_shipped == 0
                  else round_half_up(sum(cycle_time_minutes over shipped) / assignments_shipped, 2)
      cancellation_rate = 0.0000 if assignments_created == 0
                  else round_half_up((assignments_rejected + assignments_cancelled) / assignments_created, 4)

      breach_flags = [] , appended in this fixed order:
        FILL_RATE          if assignments_shipped >= 1 and fill_rate < FILL_RATE_FLOOR
        CYCLE_TIME         if assignments_shipped >= 1 and avg_cycle_time_minutes > CYCLE_TIME_BREACH_MINUTES
        CANCELLATION_RATE  if assignments_created >= 1 and cancellation_rate > CANCELLATION_RATE_CEILING
      breached = len(breach_flags) > 0

      store_cost_per_order_cents = 0 if assignments_shipped == 0 else
        round_half_up(sum(final_cost_cents over shipped) / assignments_shipped)
      dc_cost_per_order_cents = 0 if assignments_shipped == 0 else round_half_up(
        sum(DC_BASE_CENTS_BY_ZONE[order.destination_zone]
            + DC_HANDLING_CENTS_PER_UNIT * picked_units over shipped) / assignments_shipped)
      cost_index_bps = 0 if dc_cost_per_order_cents == 0 else
        round_half_up(store_cost_per_order_cents * 10000 / dc_cost_per_order_cents)
      cost_disadvantaged = cost_index_bps > COST_DISADVANTAGE_BPS

      node_action:
        NONE        if assignments_created == 0                       # empty window is inert
        PROBATION   if breached and store.node_status == ELIGIBLE and consecutive_breach_windows + 1 < MAX_CONSECUTIVE_BREACH_WINDOWS
        DEACTIVATION if breached and consecutive_breach_windows + 1 >= MAX_CONSECUTIVE_BREACH_WINDOWS
        RECOVERY    if not breached and store.node_status == PROBATION
        NONE        otherwise
      consecutive_breach_windows = 0 if (assignments_created >= 1 and not breached)
                                   else consecutive_breach_windows + 1 if (assignments_created >= 1 and breached)
                                   else consecutive_breach_windows           # empty window: unchanged
    input_set: "Assignments are matched by (store_id, epoch) — the epoch stamped at assignment creation, NOT the store's current epoch. An empty window (assignments_created == 0) yields fill_rate 1.0000, cancellation_rate 0.0000, avg_cycle_time_minutes 0.00, empty breach_flags and node_action NONE."
    constants:
      FILL_RATE_FLOOR: 0.9000
      CYCLE_TIME_BREACH_MINUTES: 240.00
      CANCELLATION_RATE_CEILING: 0.0500
      MAX_CONSECUTIVE_BREACH_WINDOWS: 2
      COST_DISADVANTAGE_BPS: 11000
      DC_BASE_CENTS_BY_ZONE: { 1: 1450, 2: 1560, 3: 1700, 4: 1850, 5: 2010, 6: 2180, 7: 2360, 8: 2550 }
      DC_HANDLING_CENTS_PER_UNIT: 120
    precision: "rates at 4 decimal places, cycle time at 2 decimal places, money in integer cents, round_half_up"
    variants: []

  # ------------------------------------------------------------------ 8
  - name: order_routing_status_derivation
    trigger: "After every RoutingRun and after every FulfillmentAssignment status change."
    algorithm: projection
    formula: |
      covered_units   = sum of AssignmentLine.units_assigned over assignments with status IN
                        {ASSIGNED, ACCEPTED, PICKED, SHORT_PICKED, PACKED}
                      + sum of OrderLine.shipped_units
      open_units      = sum of OrderLine.open_units
      cancelled_units = sum of OrderLine.cancelled_units
      dcf_units       = sum of OrderLine.dc_fallback_units
      # pending_reroute means: this order lost coverage because a node failed, and the
      # network still owes it a retry. It is a pure predicate over persisted rows.
      pending_reroute = open_units > 0
                        and order.reroute_attempt_count < MAX_REROUTE_ATTEMPTS
                        and at least one FulfillmentAssignment of this order has
                            status IN {REJECTED, CANCELLED, SHORT_PICKED}

      routing_status, evaluated in this pinned order (first match wins):
        UNROUTED          if no RoutingRun exists for this order
        ROUTING           if open_units > 0 and pending_reroute
        UNROUTABLE        if covered_units == 0
        ROUTED            if covered_units + cancelled_units == order.total_units
        PARTIALLY_ROUTED  otherwise

      # ---- pinned CustomerNotification.notification_type selection ----
      # Exactly one notification per release event (reject / short pick / cancel /
      # node deactivation) or per system retry run, chosen by the first match:
        CANCELLATION_FULL        if the event is a customer order cancel and
                                    cancelled_units == order.total_units
        CANCELLATION_PARTIAL     if the event is a customer order cancel or an
                                    assignment cancel with reroute == false
        DC_FALLBACK              if the event raised OrderLine.dc_fallback_units
        REJECTION_REROUTED       if the event is a reject whose reroute run created at
                                    least one replacement FulfillmentAssignment
        SHORT_PICK_REROUTED      if the event is a short pick whose reroute run created at
                                    least one replacement FulfillmentAssignment
        NODE_DEACTIVATED_REROUTED if the event is a step-6 SYSTEM_DEACTIVATION run that
                                    created at least one replacement FulfillmentAssignment
        UNROUTABLE               otherwise (the released units are still open)
    input_set: "All RoutingRun and FulfillmentAssignment rows of the order; no time window."
    constants:
      MAX_REROUTE_ATTEMPTS: 2
    precision: "integer units"
    variants: []

  # ------------------------------------------------------------------ 9
  - name: assignment_pick_deadline
    trigger: "At FulfillmentAssignment creation (routing-run commit and every system reroute)."
    algorithm: threshold
    formula: |
      sla_instant    = assignment.created_at + PICK_SLA_MINUTES minutes
      cutoff_instant = the instant on assignment.created_at's UTC calendar date at
                       store.cutoff_utc_minutes minutes after 00:00:00Z
      pick_deadline_utc = min(sla_instant, cutoff_instant)
      # When the store's cutoff has already passed on the creation date the store is
      # ineligible (filter clause 4), so pick_deadline_utc is always > created_at.
    input_set: "The creating assignment and its store only."
    constants:
      PICK_SLA_MINUTES: 240
    precision: "whole seconds, ISO 8601 UTC with three fractional digits"
    variants: []

  # ----------------------------------------------------------------- 10
  - name: concurrent_pick_labor_load
    trigger: "POST /assignments/{assignment_id}/accept."
    algorithm: interval_merge
    formula: |
      candidate_interval = [now, assignment.pick_deadline_utc)
      in_progress = assignments of this store with status IN {ACCEPTED, PICKED, SHORT_PICKED}
      overlapping = { a in in_progress :
                        a.accepted_at < candidate_interval.end
                        and candidate_interval.start < a.pick_deadline_utc }   # half-open, zero buffer
      concurrent_load_minutes = sum(a.labor_minutes_reserved for a in overlapping)
                              + assignment.labor_minutes_reserved
      concurrent_cap_minutes  = floor(store.staffed_labor_minutes * CONCURRENT_PICK_LABOR_RATIO)
      accept is rejected with ERR_LABOR_WINDOW_OVERSUBSCRIBED when
        concurrent_load_minutes > concurrent_cap_minutes
    input_set: "Only the accepting store's ACCEPTED / PICKED / SHORT_PICKED assignments; PACKED work has left the pick floor and is excluded."
    constants:
      CONCURRENT_PICK_LABOR_RATIO: 0.5
    precision: "minutes at 2 decimal places; the cap uses floor"
    variants: []

  # ----------------------------------------------------------------- 11
  - name: carrier_pickup_window_conflict
    trigger: "POST /stores/{store_id}/carrier-pickups."
    algorithm: interval_merge
    formula: |
      # PAIRWISE geometry with a symmetric dead-band buffer — no aggregation.
      # A new window conflicts with an existing one when the gap between them is
      # strictly smaller than PICKUP_BUFFER_MINUTES on either side:
      conflict(new, existing) =
            new.window_start_utc < existing.window_end_utc + PICKUP_BUFFER_MINUTES
        and existing.window_start_utc < new.window_end_utc + PICKUP_BUFFER_MINUTES
      existing set = CarrierPickup rows of this store with status IN {SCHEDULED, CLOSED}
      # Exactly PICKUP_BUFFER_MINUTES of gap is allowed (>= buffer passes; < buffer fails).
      # Rejected with ERR_PICKUP_WINDOW_OVERLAP.
    input_set: "CarrierPickup rows of the same store with status IN {SCHEDULED, CLOSED}; CANCELLED and DEPARTED windows are ignored."
    constants:
      PICKUP_BUFFER_MINUTES: 30
    precision: "whole minutes"
    variants: []

  # ----------------------------------------------------------------- 12
  - name: reserved_units_reconciliation
    trigger: "Invariant checked after every reservation-moving operation (routing-run commit, reject, cancel, short pick, ship, inventory adjustment, ops-run close)."
    algorithm: aggregation
    formula: |
      # CONSERVED QUANTITY 1: promise-able units at a node.
      for every (store, sku):
        StoreInventory.on_hand_units
          == StoreInventory.available_to_promise_units
           + StoreInventory.reserved_units
           + StoreInventory.safety_stock_units
          whenever on_hand_units - reserved_units - safety_stock_units >= 0
      # A forward action (routing commit) and its compensating action (reject / cancel /
      # supersede) MUST return available_to_promise_units to the exact pre-action value.
    input_set: "One StoreInventory row and the AssignmentLines that reference its sku at its store."
    constants: {}
    precision: "integer units"
    variants: []

  # ----------------------------------------------------------------- 13
  - name: reserved_labor_minutes_reconciliation
    trigger: "Invariant checked after every assignment status change and at ops-run close."
    algorithm: aggregation
    formula: |
      # CONSERVED QUANTITY 2: node labor minutes.
      Store.reserved_labor_minutes
        == sum of FulfillmentAssignment.labor_minutes_reserved over assignments of this store
           with status IN {ASSIGNED, ACCEPTED, PICKED, SHORT_PICKED, PACKED}
      # SHIPPED, REJECTED and CANCELLED release the full labor standard, so a
      # create-then-release round trip leaves Store.reserved_labor_minutes unchanged even
      # when the assignment was short-picked (the shortfall never re-prices the standard).
    input_set: "One Store row and all of its assignments."
    constants: {}
    precision: "minutes at 2 decimal places"
    variants: []

  # ----------------------------------------------------------------- 14
  - name: order_demand_units_reconciliation
    trigger: "Invariant checked after every routing run, assignment status change and order cancellation."
    algorithm: aggregation
    formula: |
      # CONSERVED QUANTITY 3: customer demand units.
      for every OrderLine:
        quantity == assigned_units + shipped_units + cancelled_units
                  + dc_fallback_units + open_units
      and CustomerOrder.total_units == sum of OrderLine.quantity
      and CustomerOrder.unassigned_units == sum of OrderLine.open_units
    input_set: "One OrderLine and the AssignmentLines that reference it."
    constants: {}
    precision: "integer units"
    variants: []

  # ----------------------------------------------------------------- 15
  - name: pickup_parcel_slot_reconciliation
    trigger: "Invariant checked after every ship and after pickup close / depart / cancel."
    algorithm: aggregation
    formula: |
      # CONSERVED QUANTITY 4: carrier parcel slots.
      CarrierPickup.reserved_parcels
        == count of FulfillmentAssignment rows with this carrier_pickup_id and status == SHIPPED
      and CarrierPickup.reserved_parcels <= CarrierPickup.parcel_capacity
    input_set: "One CarrierPickup row and the assignments tendered to it."
    constants: {}
    precision: "integer parcels"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lowest number wins)
# =============================================================================
# Domain ordering rationale: identity first, then request shape, then existence,
# then store-scope ownership, then optimistic-concurrency, then state, then
# floor-presentation safety (safety stock is what protects the retail floor),
# then temporal gates (cutoffs and carrier windows), then capacity/constraint
# checks, then referential coupling, and finally the fiscal guardrail — a node
# must never be blocked on cost while a safety or temporal rule is also broken.
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: business_constraint
    check: "request body / query shape: required fields present, types correct, enums within their declared sets, integers within their declared ranges, limit in 1..100, offset >= 0, quantity >= 1, picked_units >= 0, parcel_capacity >= 1, origin_zone and destination_zone in 1..8"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 4
    category: existence
    check: "every path id resolves, validated left-to-right"
    error_id: "ERR_STORE_NOT_FOUND | ERR_SKU_NOT_FOUND | ERR_INVENTORY_NOT_FOUND | ERR_PACKAGING_NOT_FOUND | ERR_PICKUP_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_ORDER_LINE_NOT_FOUND | ERR_ROUTING_RUN_NOT_FOUND | ERR_CANDIDATE_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_ASSIGNMENT_LINE_NOT_FOUND | ERR_WINDOW_NOT_FOUND | ERR_NOTIFICATION_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 5
    category: existence
    check: "every foreign key supplied in a request body resolves (store_id, sku_id, carrier_pickup_id, assignment_line_id)"
    error_id: "ERR_STORE_NOT_FOUND | ERR_SKU_NOT_FOUND | ERR_PICKUP_NOT_FOUND | ERR_ASSIGNMENT_LINE_NOT_FOUND"
    http_status: 404
    applies_to: "POST /store-inventories, POST /packaging-supplies, POST /orders/{order_id}/lines, POST /assignments/{assignment_id}/pick, POST /assignments/{assignment_id}/ship"

  - priority: 6
    category: auth
    check: "when the acting role is StoreAssociate, X-User-ID equals the store_id of the targeted assignment, inventory row, packaging row or store"
    error_id: ERR_STORE_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /assignments/{assignment_id}/accept, /reject, /pick, /pack, /ship, POST /store-inventories/{inventory_id}/adjustments, POST /packaging-supplies/{supply_id}/restock"

  - priority: 7
    category: state
    check: "expected_<parent>_version equals the parent's current version (§1.2.1)"
    error_id: "ERR_STALE_ORDER_VERSION | ERR_STALE_PICKUP_VERSION | ERR_STALE_INVENTORY_VERSION"
    http_status: 412
    applies_to: "POST /orders/{order_id}/routing-runs, POST /assignments/{assignment_id}/ship, POST /store-inventories/{inventory_id}/adjustments"

  - priority: 10
    category: state
    check: "the assignment's status permits the requested transition (accept: ASSIGNED; reject: ASSIGNED|ACCEPTED; pick: ACCEPTED; pack: PICKED|SHORT_PICKED; ship: PACKED; cancel: ASSIGNED|ACCEPTED|PICKED|SHORT_PICKED)"
    error_id: ERR_ASSIGNMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /assignments/{assignment_id}/accept, /reject, /pick, /pack, /ship, /cancel"

  - priority: 11
    category: state
    check: "order.fulfillment_status == PENDING (a CANCELLED or fully SHIPPED order cannot be routed)"
    error_id: ERR_ORDER_NOT_ROUTABLE
    http_status: 409
    applies_to: "POST /orders/{order_id}/routing-runs"

  - priority: 12
    category: state
    check: "order.routing_status == UNROUTED (lines are frozen once any RoutingRun exists)"
    error_id: ERR_ORDER_LINES_LOCKED
    http_status: 409
    applies_to: "POST /orders/{order_id}/lines"

  - priority: 13
    category: state
    check: "the order has at least one OrderLine with open_units >= 1"
    error_id: ERR_NO_ROUTABLE_LINES
    http_status: 409
    applies_to: "POST /orders/{order_id}/routing-runs"

  - priority: 14
    category: state
    check: "order.fulfillment_status == PENDING and order.shipped_units == 0"
    error_id: ERR_ORDER_ALREADY_SHIPPED_UNITS
    http_status: 409
    applies_to: "POST /orders/{order_id}/cancel"

  - priority: 15
    category: state
    check: "pickup.status permits the operation (ship / close / cancel: SCHEDULED; depart: CLOSED)"
    error_id: ERR_PICKUP_STATE_INVALID
    http_status: 409
    applies_to: "POST /assignments/{assignment_id}/ship, POST /carrier-pickups/{pickup_id}/close, /depart, /cancel"

  - priority: 16
    category: state
    check: "store.node_status IN {ELIGIBLE, PROBATION}"
    error_id: ERR_STORE_NODE_DEACTIVATED
    http_status: 409
    applies_to: "POST /assignments/{assignment_id}/accept, /pick, /pack, /ship, POST /stores/{store_id}/carrier-pickups"

  - priority: 17
    category: state
    check: "store.node_status == DEACTIVATED"
    error_id: ERR_STORE_NOT_DEACTIVATED
    http_status: 409
    applies_to: "POST /stores/{store_id}/reactivate"

  - priority: 18
    category: state
    check: "the acting store has a NodePerformanceWindow with status == OPEN (accept); at least one NodePerformanceWindow network-wide has status == OPEN (close)"
    error_id: ERR_NO_OPEN_WINDOW
    http_status: 409
    applies_to: "POST /assignments/{assignment_id}/accept, POST /performance-windows/close"

  - priority: 20
    category: business_safety
    check: "safety_stock_units <= on_hand_units (floor presentation can never be promised away)"
    error_id: ERR_SAFETY_STOCK_EXCEEDS_ON_HAND
    http_status: 422
    applies_to: "POST /store-inventories, POST /store-inventories/{inventory_id}/adjustments"

  - priority: 21
    category: business_safety
    check: "counted_on_hand_units >= StoreInventory.reserved_units (an adjustment may not strand units already promised to customers)"
    error_id: ERR_INVENTORY_BELOW_RESERVED
    http_status: 422
    applies_to: "POST /store-inventories/{inventory_id}/adjustments"

  - priority: 30
    category: business_temporal
    check: "clock_minute_of_day(now) <= store.cutoff_utc_minutes (minute-inclusive: exactly at the cutoff minute is allowed)"
    error_id: ERR_STORE_CUTOFF_PASSED
    http_status: 422
    applies_to: "POST /assignments/{assignment_id}/accept, /pick, /pack, /ship"

  - priority: 31
    category: business_temporal
    check: "now < assignment.pick_deadline_utc"
    error_id: ERR_PICK_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /assignments/{assignment_id}/accept"

  - priority: 32
    category: business_temporal
    check: "pickup.window_start_utc <= now < pickup.window_end_utc (half-open)"
    error_id: ERR_PICKUP_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /assignments/{assignment_id}/ship"

  - priority: 33
    category: business_temporal
    check: "window_end_utc > window_start_utc"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /stores/{store_id}/carrier-pickups"

  - priority: 34
    category: business_temporal
    check: "the requested window does not conflict with an existing SCHEDULED or CLOSED pickup of the same store under the 30-minute buffered pairwise geometry (calculations.carrier_pickup_window_conflict)"
    error_id: ERR_PICKUP_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /stores/{store_id}/carrier-pickups"

  - priority: 35
    category: business_temporal
    check: "to_iso8601 >= the logical clock's current value (the clock never moves backwards)"
    error_id: ERR_CLOCK_NOT_MONOTONIC
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"

  - priority: 40
    category: business_constraint
    check: "concurrent in-progress pick labour over overlapping [accepted_at, pick_deadline_utc) intervals stays within floor(store.staffed_labor_minutes * 0.5) (calculations.concurrent_pick_labor_load)"
    error_id: ERR_LABOR_WINDOW_OVERSUBSCRIBED
    http_status: 422
    applies_to: "POST /assignments/{assignment_id}/accept"

  - priority: 41
    category: business_constraint
    check: "pickup.reserved_parcels < pickup.parcel_capacity"
    error_id: ERR_PICKUP_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /assignments/{assignment_id}/ship"

  - priority: 42
    category: business_constraint
    check: "a PackagingSupply row for (store_id, package_type) exists with on_hand_units >= 1"
    error_id: ERR_PACKAGING_DEPLETED
    http_status: 422
    applies_to: "POST /assignments/{assignment_id}/pack"

  - priority: 43
    category: business_constraint
    check: "PACKAGE_RANK[package_type] >= PACKAGE_RANK[assignment.derived_package_type]"
    error_id: ERR_PACKAGE_TYPE_TOO_SMALL
    http_status: 422
    applies_to: "POST /assignments/{assignment_id}/pack"

  - priority: 44
    category: business_constraint
    check: "picked_units <= assignment.assigned_units, line_picks covers each AssignmentLine of the assignment at most once with units_picked <= units_assigned, and sum(line_picks[].units_picked) == picked_units"
    error_id: ERR_PICK_UNITS_INVALID
    http_status: 422
    applies_to: "POST /assignments/{assignment_id}/pick"

  - priority: 45
    category: business_constraint
    check: "picked_units >= 1 (a zero pick must be expressed as a reject, so the node owns the failure)"
    error_id: ERR_ZERO_PICK_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /assignments/{assignment_id}/pick"

  - priority: 46
    category: business_constraint
    check: "uniqueness: Store.store_code, Sku.sku_code, CustomerOrder.order_code globally; StoreInventory per (store_id, sku_id); PackagingSupply per (store_id, package_type)"
    error_id: "ERR_DUPLICATE_STORE_CODE | ERR_DUPLICATE_SKU_CODE | ERR_DUPLICATE_ORDER_CODE | ERR_DUPLICATE_INVENTORY_ROW | ERR_DUPLICATE_PACKAGING_ROW"
    http_status: 409
    applies_to: "POST /stores, POST /skus, POST /orders, POST /store-inventories, POST /packaging-supplies"

  - priority: 47
    category: business_referential
    check: "carrier_pickup_id belongs to the assignment's store"
    error_id: ERR_PICKUP_STORE_MISMATCH
    http_status: 409
    applies_to: "POST /assignments/{assignment_id}/ship"

  - priority: 48
    category: business_referential
    check: "every line_picks[].assignment_line_id belongs to the assignment in the path"
    error_id: ERR_ASSIGNMENT_LINE_MISMATCH
    http_status: 409
    applies_to: "POST /assignments/{assignment_id}/pick"

  - priority: 49
    category: business_referential
    check: "pickup.reserved_parcels == 0"
    error_id: ERR_PICKUP_HAS_PARCELS
    http_status: 409
    applies_to: "POST /carrier-pickups/{pickup_id}/cancel"

  - priority: 50
    category: business_fiscal
    check: "a COMMIT RoutingRun whose projected_cost_index_bps > MAX_COST_INDEX_BPS (15000) is refused unless override_cost_guardrail is true; PROVISIONAL runs and system reroute runs are never blocked"
    error_id: ERR_COST_INDEX_GUARDRAIL
    http_status: 422
    applies_to: "POST /orders/{order_id}/routing-runs"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ------------------------------------------------------------- Stores
  - method: POST
    path: "/fulfillment-network/stores"
    description: "Register a fulfillment node."
    roles: [NetworkPlanner]
    code: 201
    input: [store_code, region_code, origin_zone, daily_unit_capacity, staffed_labor_minutes, labor_standard_minutes_per_order, pick_labor_minutes_per_unit, labor_rate_cents_per_minute, cutoff_utc_minutes, "hazmat_certified?"]
    output: Store
    side_effects:
      - "node_status = ELIGIBLE, units_committed_epoch = 0, reserved_labor_minutes = 0, consecutive_breach_windows = 0"
      - "creates a NodePerformanceWindow with status OPEN at the network's current epoch (max epoch over all windows, or 1 when none exists)"
      - "computes eligibility_score via calculations.store_eligibility_score variant cold_start; eligibility_score_basis = COLD_START"

  - method: GET
    path: "/fulfillment-network/stores"
    description: "List nodes."
    roles: [NetworkPlanner, StoreAssociate, CarrierCoordinator, CustomerCare]
    code: 200
    input: ["node_status?", "region_code?", "limit?", "offset?"]
    output: Store[]
    side_effects: []

  - method: GET
    path: "/fulfillment-network/stores/{store_id}"
    description: "Read one node."
    roles: [NetworkPlanner, StoreAssociate, CarrierCoordinator, CustomerCare]
    code: 200
    input: []
    output: Store
    side_effects: []

  - method: PATCH
    path: "/fulfillment-network/stores/{store_id}"
    description: "Adjust a node's capacity, labour posture or cutoff."
    roles: [NetworkPlanner]
    code: 200
    input: ["daily_unit_capacity?", "staffed_labor_minutes?", "labor_standard_minutes_per_order?", "pick_labor_minutes_per_unit?", "labor_rate_cents_per_minute?", "cutoff_utc_minutes?", "hazmat_certified?"]
    output: Store
    side_effects:
      - "recomputes eligibility_score with the store's current basis"
      - "increments Store.version by 1"

  - method: POST
    path: "/fulfillment-network/stores/{store_id}/reactivate"
    description: "Return a DEACTIVATED node to ELIGIBLE."
    roles: [NetworkPlanner]
    code: 200
    input: []
    output: Store
    side_effects:
      - "node_status = ELIGIBLE, consecutive_breach_windows = 0, deactivated_at_epoch = null, reactivation_count += 1"
      - "creates an OPEN NodePerformanceWindow at epoch = max(network current epoch, this store's highest existing epoch + 1) when the store has no OPEN window"
      - "recomputes eligibility_score"

