              payload: { ride_id: "${ride_v1c}", route_stop_id: "${stop_v1}", expected_route_stop_version: "${sv_v1c}" }
              as: LotBoss
              captures: { alloc_v1c: $.data.id }
          trigger:
            - call: "POST /route-stops/${stop_v1}/cancel"
              payload: {}
