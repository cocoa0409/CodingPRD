            - { call: "POST /uro/joint-trench-slots", payload: { project_id: "${p1}", segment_code: "SEG-A", trench_open_start: "2027-04-01T00:00:00Z", trench_open_end: "2027-05-01T00:00:00Z", max_occupants: 2 }, as: ConstructionEngineer, captures: { js1: "$.data.id" } }
            - { call: "GET /uro/conflicts/${c1}", payload: {}, as: UtilityCoordinator, captures: { c1v: "$.data.version" } }
