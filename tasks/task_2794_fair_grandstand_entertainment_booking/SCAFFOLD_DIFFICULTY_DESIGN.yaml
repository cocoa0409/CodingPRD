            - "Candidate offer: artist 2, also COUNTRY, on 2026-08-23 with load window 14:00 -> 23:00 - one calendar day after the existing COUNTRY hold, and clear of the 120-minute buffer since 2026-08-22T23:00 + 120 min == 2026-08-23T01:00 <= 14:00."
            - "That candidate asks 5000000, so the recomputed commitment 14000000 exceeds the 10000000 cap."
            - "Control offer: artist 3 (JAZZ), identical date, window and guarantee, so only the fiscal rule remains violated."
