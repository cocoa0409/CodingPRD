        grounds:
          - calculations.hold_credit_computation
          - validations[priority=51]
          - errors[ERR_HOLD_BUFFER_VIOLATION]
        distinguishing_aspect: |
          Resource = Subscription, geometry = CLOSED intervals widened by
          HOLD_BUFFER_DAYS 2: a candidate starting 2026-09-15 collides with a hold
          ending 2026-09-13 even though the raw intervals are disjoint, while a
          candidate starting 2026-09-16 is admitted - back-to-back is illegal here.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
