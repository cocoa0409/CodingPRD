      - name: forecast_supersede_marks_prior
        claim_type: correct_result
        grounds: [state_machines.NewItemForecast.PUBLISHED_to_SUPERSEDED, calculations.new_item_forecast]
        distinguishing_aspect: "Creating a second forecast for the same product_ref supersedes the first; the contract's forecast list holds exactly one PUBLISHED and one SUPERSEDED row."
        test_recipe:
          setup:
            - "Account with ACTIVE contract (modeled_derivation_allowed true)"
          setup_api_calls:
            - call: "POST /shopper-insights/supplier-accounts"
              payload: { account_name: "Beta Butter", region: "NW" }
              as: RetailerAdmin
              captures: { acct: $.data.id }
            - call: "POST /shopper-insights/supplier-accounts/${acct}/subscription-contracts"
              payload: { tier: "TIER_BRAND", report_credit_allowance: 10, activation_budget_cents: 100000, redistribution_allowed: true, modeled_derivation_allowed: true }
              as: RetailerAdmin
              captures: { contract: $.data.id }
          trigger:
            - call: "POST /shopper-insights/new-item-forecasts"
              payload:
                contract_id: "${contract}"
                product_ref: "NEW-9"
                analogs: [{ analog_ref: "A1", similarity_score: 1.0, observed_week4_units: 50 }]
                variant: "SIMPLE_AVERAGE"
              as: InsightsScientist
              captures: { f1: $.data.id, f1_st: $.data.status }
            - call: "POST /shopper-insights/new-item-forecasts"
              payload:
                contract_id: "${contract}"
                product_ref: "NEW-9"
                analogs: [{ analog_ref: "A2", similarity_score: 1.0, observed_week4_units: 70 }]
                variant: "SIMPLE_AVERAGE"
              as: InsightsScientist
              captures: { f2: $.data.id }
            - call: "GET /shopper-insights/subscription-contracts/${contract}/new-item-forecasts"
              as: InsightsScientist
          assert:
            - "first create returns status PUBLISHED, forecast_selected_units == 50"
            - "second create returns forecast_selected_units == 70"
            - "forecast list for the contract: total_count == 2, exactly one PUBLISHED (the second) and one SUPERSEDED (the first)"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: missing_auth_header_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request without X-User-Role fails priority-1 auth validation before any other check, even when the payload is valid."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /shopper-insights/supplier-accounts"
              payload: { account_name: "No Header", region: "NW" }
              as: RetailerAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) when the X-User-Role header is omitted at HTTP level"

      - name: analyst_cannot_create_cycle
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", roles]
        distinguishing_aspect: "SupplierAnalyst invoking a CategoryManager-exclusive endpoint fails ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /shopper-insights/line-review-cycles"
              payload: { category_code: "SNACKS", window_start: "2026-10-01", window_end: "2026-10-15" }
              as: SupplierAnalyst
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN_ROLE (403)"

      - name: analyst_cannot_use_foreign_contract
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "roles[SupplierAnalyst]"]
        distinguishing_aspect: "SupplierAnalyst whose X-User-ID is account A may not create a report against account B's contract (entity_backed ownership)."
        test_recipe:
          setup:
            - "Accounts A and B, each with an ACTIVE contract"
          setup_api_calls:
            - call: "POST /shopper-insights/supplier-accounts"
              payload: { account_name: "Owner A", region: "NW" }
              as: RetailerAdmin
              captures: { acctA: $.data.id }
            - call: "POST /shopper-insights/supplier-accounts/${acctA}/subscription-contracts"
              payload: { tier: "TIER_CATEGORY", report_credit_allowance: 10, activation_budget_cents: 100000, redistribution_allowed: true, modeled_derivation_allowed: true }
              as: RetailerAdmin
            - call: "POST /shopper-insights/supplier-accounts"
              payload: { account_name: "Owner B", region: "SE" }
              as: RetailerAdmin
              captures: { acctB: $.data.id }
            - call: "POST /shopper-insights/supplier-accounts/${acctB}/subscription-contracts"
              payload: { tier: "TIER_CATEGORY", report_credit_allowance: 10, activation_budget_cents: 100000, redistribution_allowed: true, modeled_derivation_allowed: true }
              as: RetailerAdmin
              captures: { contractB: $.data.id }
          trigger:
            - call: "POST /shopper-insights/insight-reports"
              payload: { contract_id: "${contractB}", report_type: "CATEGORY", category_code: "SNACKS", period_start: "2026-08-01", period_end: "2026-08-31" }
              as: SupplierAnalyst
              as_user_id: "${acctA}"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN_ROLE (403): analyst of account A cannot spend account B's credits"

      - name: tier_insufficient_for_brand_report
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_TIER_INSUFFICIENT]"]
        distinguishing_aspect: "TIER_CATEGORY contract requesting an in-scope BRAND_OWN report fails ERR_TIER_INSUFFICIENT (tier gates report type even when category is in scope)."
        test_recipe:
          setup:
            - "Account with ACTIVE TIER_CATEGORY contract, scope SNACKS"
          setup_api_calls:
            - call: "POST /shopper-insights/supplier-accounts"
              payload: { account_name: "Tier Ltd", region: "NW" }
              as: RetailerAdmin
              captures: { acct: $.data.id }
            - call: "POST /shopper-insights/supplier-accounts/${acct}/subscription-contracts"
              payload: { tier: "TIER_CATEGORY", report_credit_allowance: 10, activation_budget_cents: 100000, redistribution_allowed: true, modeled_derivation_allowed: true }
              as: RetailerAdmin
              captures: { contract: $.data.id }
            - call: "POST /shopper-insights/subscription-contracts/${contract}/category-scopes"
              payload: { category_code: "SNACKS", brand_codes: ["ACME"] }
              as: RetailerAdmin
          trigger:
            - call: "POST /shopper-insights/insight-reports"
              payload: { contract_id: "${contract}", report_type: "BRAND_OWN", category_code: "SNACKS", period_start: "2026-08-01", period_end: "2026-08-31" }
              as: SupplierAnalyst
              as_user_id: "${acct}"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_TIER_INSUFFICIENT (422)"

      - name: scope_checked_before_tier
        claim_type: priority_ordering
        grounds: ["validations[priority=7]"]
        distinguishing_aspect: "Intra-priority ordering is pinned: a report that is both out-of-scope AND above tier fails with ERR_CATEGORY_OUT_OF_SCOPE, not ERR_TIER_INSUFFICIENT."
        test_recipe:
          setup:
            - "Account with ACTIVE TIER_CATEGORY contract, scope SNACKS only"
          setup_api_calls:
            - call: "POST /shopper-insights/supplier-accounts"
              payload: { account_name: "Order Ltd", region: "NW" }
              as: RetailerAdmin
              captures: { acct: $.data.id }
            - call: "POST /shopper-insights/supplier-accounts/${acct}/subscription-contracts"
              payload: { tier: "TIER_CATEGORY", report_credit_allowance: 10, activation_budget_cents: 100000, redistribution_allowed: true, modeled_derivation_allowed: true }
              as: RetailerAdmin
              captures: { contract: $.data.id }
            - call: "POST /shopper-insights/subscription-contracts/${contract}/category-scopes"
              payload: { category_code: "SNACKS", brand_codes: ["ACME"] }
              as: RetailerAdmin
          trigger:
            - call: "POST /shopper-insights/insight-reports"
              payload: { contract_id: "${contract}", report_type: "COMPETITOR_BLIND", category_code: "DAIRY", period_start: "2026-08-01", period_end: "2026-08-31" }
              as: SupplierAnalyst
              as_user_id: "${acct}"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_CATEGORY_OUT_OF_SCOPE (422) — scope precedes tier within priority 7"

      - name: second_active_contract_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_ACCOUNT_HAS_ACTIVE_CONTRACT]"]
        distinguishing_aspect: "An account may hold at most one ACTIVE contract; the second create fails ERR_ACCOUNT_HAS_ACTIVE_CONTRACT."
        test_recipe:
          setup:
            - "Account with one ACTIVE contract"
          setup_api_calls:
            - call: "POST /shopper-insights/supplier-accounts"
              payload: { account_name: "One Contract Co", region: "NW" }
              as: RetailerAdmin
              captures: { acct: $.data.id }
            - call: "POST /shopper-insights/supplier-accounts/${acct}/subscription-contracts"
              payload: { tier: "TIER_CATEGORY", report_credit_allowance: 10, activation_budget_cents: 100000, redistribution_allowed: true, modeled_derivation_allowed: true }
              as: RetailerAdmin
          trigger:
            - call: "POST /shopper-insights/supplier-accounts/${acct}/subscription-contracts"
              payload: { tier: "TIER_PORTFOLIO", report_credit_allowance: 20, activation_budget_cents: 200000, redistribution_allowed: true, modeled_derivation_allowed: true }
              as: RetailerAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_ACCOUNT_HAS_ACTIVE_CONTRACT (422)"

      - name: self_approval_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_SELF_APPROVAL_FORBIDDEN]"]
        distinguishing_aspect: "Segregation of duties: a DataSteward whose X-User-ID equals the requesting analyst's account id cannot approve that grant."
        test_recipe:
          setup:
            - "Account with ACTIVE contract; REQUESTED grant"
          setup_api_calls:
            - call: "POST /shopper-insights/supplier-accounts"
              payload: { account_name: "SoD Co", region: "NW" }
              as: RetailerAdmin
              captures: { acct: $.data.id }
            - call: "POST /shopper-insights/supplier-accounts/${acct}/subscription-contracts"
              payload: { tier: "TIER_CATEGORY", report_credit_allowance: 10, activation_budget_cents: 100000, redistribution_allowed: true, modeled_derivation_allowed: true }
              as: RetailerAdmin
            - call: "POST /shopper-insights/clean-room-grants"
              payload: { supplier_account_id: "${acct}", valid_from: "2026-09-01T00:00:00Z", valid_until: "2026-12-01T00:00:00Z", query_budget_total: 100 }
              as: SupplierAnalyst
              as_user_id: "${acct}"
              captures: { grant: $.data.id }
          trigger:
            - call: "POST /shopper-insights/clean-room-grants/${grant}/approve"
              as: DataSteward
              as_user_id: "${acct}"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_SELF_APPROVAL_FORBIDDEN (403)"
            - "grant remains REQUESTED"

      - name: insufficient_report_credits_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_INSUFFICIENT_REPORT_CREDITS]"]
