- section: endpoints
  instances:
  - name: control_implementations_support_the_full_create_read_list_update_cycle
    claim_type: standard_crud
    grounds:
    - endpoints.POST /control-implementations
    - endpoints.GET /control-implementations/{id}
    - endpoints.GET /control-implementations
    - endpoints.PATCH /control-implementations/{id}
    distinguishing_aspect: 'The one entity with a PATCH exercises all four verbs in order: the create returns the row, the
      single read returns the same row to a role that cannot write it, the list narrows by family_code and crm_documented,
      and the PATCH mutates only the named fields while bumping version 1 -> 2 and leaving created_at untouched. There is
      no DELETE anywhere in §1.5, so the row survives.'
    test_recipe:
      setup:
      - Clock 2026-02-01T00:00:00Z; offering CATEGORIZED and owned by csp-lead-1, no control implementations yet.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
