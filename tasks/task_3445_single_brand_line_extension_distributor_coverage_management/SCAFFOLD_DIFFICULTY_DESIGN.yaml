# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3445_single_brand_line_extension_distributor_coverage_management
# Depth probe: 9 Difficulty Rules x >=2 instances. Every instance grounds in
# SCAFFOLD.yaml §1.1-§1.7 and is executable from empty-DB via §1.5 endpoints.
# Logical-clock default (no set_current_utc call needed): 2026-09-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: attainment_actual_vs_projected_diverge
        grounds:
          - calculations.coverage_attainment
          - entities.Distributor.fields.attainment_actual_bps
          - entities.Distributor.fields.attainment_projected_bps
        distinguishing_aspect: "Dual-variant on the DISTRIBUTOR domain: the same three-month report window yields attainment_actual_bps 4000 (sum-based, conservative) and attainment_projected_bps 9000 (best-month-annualized, optimistic) — two valid algorithms over identical inputs producing different results."
        test_recipe:
          setup:
            - "Logical clock at the startup default 2026-09-01T00:00:00Z; trailing-3-month window is {2026-06, 2026-07, 2026-08}."
            - "Brand with a LAUNCHED core line (COMPARTMENTALIZED formulation, IN_PRODUCTION pack)."
            - "Distributor APPROVED with an ACTIVE exclusive assignment, annual_quota_units 1200, window 2026-08-01..2027-07-31."
            - "Reports filed: 2026-06 net 30, 2026-08 net 90; no report for 2026-07 (counts 0)."
          setup_api_calls:
            - &c_brand
              call: "POST /brand-ops/brands"
              payload: { name: "Multi-Use Brand", legal_entity_name: "Multi-Use Products Co" }
              as: BrandManager
              captures: { brand_id: $.data.id }
            - &c_market
              call: "POST /brand-ops/markets"
              payload: { country_code: "US", name: "United States", registration_required: false, voc_regime: "STANDARD", allowed_channels: ["HARDWARE", "AUTOMOTIVE", "INDUSTRIAL", "MASS"] }
              as: RegulatoryAffairs
              captures: { market_id: $.data.id }
            - &c_mfr1
              call: "POST /brand-ops/contract-manufacturers"
              payload: { legal_name: "Alpha Blending Co", site_country: "US", capabilities: ["BLENDING"] }
              as: TradeSecretOfficer
              as_user_id: "tso-1"
              captures: { mfr1_id: $.data.id }
            - &c_mfr1q
              call: "POST /brand-ops/contract-manufacturers/${mfr1_id}/qualify"
              payload: {}
              as: TradeSecretOfficer
              as_user_id: "tso-1"
            - &c_mfr2
              call: "POST /brand-ops/contract-manufacturers"
              payload: { legal_name: "Beta Filling Inc", site_country: "US", capabilities: ["AEROSOL_FILL"] }
              as: TradeSecretOfficer
              as_user_id: "tso-1"
              captures: { mfr2_id: $.data.id }
            - &c_mfr2q
              call: "POST /brand-ops/contract-manufacturers/${mfr2_id}/qualify"
              payload: {}
              as: TradeSecretOfficer
              as_user_id: "tso-1"
            - &c_line_core
              call: "POST /brand-ops/brands/${brand_id}/product-lines"
              payload: { line_code: "CORE", name: "Core Multi-Use", is_core: true, target_channels: ["HARDWARE"] }
              as: BrandManager
              captures: { line_id: $.data.id }
            - &c_form
              call: "POST /brand-ops/product-lines/${line_id}/formulations"
              payload: { version_label: "v1", component_codes: ["C1", "C2", "C3", "C4"], voc_class: "STANDARD" }
              as: TradeSecretOfficer
              as_user_id: "tso-1"
              captures: { form_id: $.data.id }
            - &c_seal
              call: "POST /brand-ops/formulations/${form_id}/seal"
              payload: {}
              as: TradeSecretOfficer
              as_user_id: "tso-1"
            - &c_g1
              call: "POST /brand-ops/confidentiality-grants"
              payload: { manufacturer_id: "${mfr1_id}", formulation_id: "${form_id}", component_scope: ["C1", "C2"], expires_on: "2027-12-31T00:00:00Z", grant_reason: "PRODUCTION" }
              as: TradeSecretOfficer
              as_user_id: "tso-1"
              captures: { g1_id: $.data.id }
            - &c_g1g
              call: "POST /brand-ops/confidentiality-grants/${g1_id}/grant"
              payload: {}
              as: TradeSecretOfficer
              as_user_id: "tso-1"
            - &c_g1a
              call: "POST /brand-ops/confidentiality-grants/${g1_id}/activate"
              payload: {}
              as: TradeSecretOfficer
              as_user_id: "tso-1"
            - &c_g2
              call: "POST /brand-ops/confidentiality-grants"
              payload: { manufacturer_id: "${mfr2_id}", formulation_id: "${form_id}", component_scope: ["C3", "C4"], expires_on: "2027-12-31T00:00:00Z", grant_reason: "PRODUCTION" }
              as: TradeSecretOfficer
              as_user_id: "tso-1"
              captures: { g2_id: $.data.id }
            - &c_g2g
              call: "POST /brand-ops/confidentiality-grants/${g2_id}/grant"
              payload: {}
              as: TradeSecretOfficer
              as_user_id: "tso-1"
            - &c_g2a
              call: "POST /brand-ops/confidentiality-grants/${g2_id}/activate"
              payload: {}
              as: TradeSecretOfficer
              as_user_id: "tso-1"
            - &c_review
              call: "POST /brand-ops/product-lines/${line_id}/brand-review"
              payload: { decision: "APPROVE" }
              as: BrandManager
            - &c_pack
              call: "POST /brand-ops/product-lines/${line_id}/pack-formats"
              payload: { size_ml: 311, delivery_system: "AEROSOL", channel_restrictions: ["HARDWARE"], case_pack_qty: 12 }
              as: SupplyPlanner
              captures: { pack_id: $.data.id, pack_v1: $.data.version }
            - &c_tool
              call: "POST /brand-ops/pack-formats/${pack_id}/tool"
              payload: {}
              as: SupplyPlanner
              captures: { pack_v2: $.data.version }
            - &c_price
              call: "POST /brand-ops/pack-formats/${pack_id}/price-lists"
              payload: { channel: "HARDWARE", list_price_cents: 499, map_price_cents: 300, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z", expected_pack_format_version: "${pack_v2}" }
              as: PricingAnalyst
              captures: { pl1_id: $.data.id }
            - &c_enterprod
              call: "POST /brand-ops/pack-formats/${pack_id}/enter-production"
              payload: {}
              as: SupplyPlanner
            - &c_launch
              call: "POST /brand-ops/product-lines/${line_id}/launch"
              payload: {}
              as: BrandManager
            - &c_dist
              call: "POST /brand-ops/distributors"
              payload: { legal_name: "Ace Distribution", home_market_id: "${market_id}", channels_served: ["HARDWARE"], credit_limit_cents: 1000000 }
              as: ChannelManager
              captures: { dist_id: $.data.id, dist_v1: $.data.version }
            - &c_dist_app
              call: "POST /brand-ops/distributors/${dist_id}/approve"
              payload: {}
              as: ChannelManager
              captures: { dist_v2: $.data.version }
            - &c_asg
              call: "POST /brand-ops/distributors/${dist_id}/coverage-assignments"
              payload: { market_id: "${market_id}", product_line_id: "${line_id}", channel: "HARDWARE", exclusive: true, starts_on: "2026-08-01", ends_on: "2027-07-31", annual_quota_units: 1200, expected_distributor_version: "${dist_v2}" }
              as: ChannelManager
              captures: { asg_id: $.data.id }
            - &c_asg_act
              call: "POST /brand-ops/coverage-assignments/${asg_id}/activate"
              payload: {}
              as: ChannelManager
            - &c_rep_jun
              call: "POST /brand-ops/distributors/${dist_id}/sell-through-reports"
              payload: { coverage_assignment_id: "${asg_id}", period_month: "2026-06", units_sold: 30 }
              as: DistributorContact
              as_user_id: "${dist_id}"
            - &c_rep_aug
              call: "POST /brand-ops/distributors/${dist_id}/sell-through-reports"
              payload: { coverage_assignment_id: "${asg_id}", period_month: "2026-08", units_sold: 90 }
              as: DistributorContact
              as_user_id: "${dist_id}"
          trigger:
            - call: "GET /brand-ops/distributors/${dist_id}/rebate-preview"
              payload: { reference_unit_price_cents: 499 }
              as: ChannelManager
              captures: { actual_bps: $.data.attainment_actual_bps, projected_bps: $.data.attainment_projected_bps }
          assert:
            - "Distributor.${dist_id}.attainment_actual_bps == 4000 (round_half_up(10000 * 120 / floor(1200/4)=300))"
            - "Distributor.${dist_id}.attainment_projected_bps == 9000 (round_half_up(10000 * 90 * 12 / 1200); best month 2026-08 net 90)"
            - "the two variants diverge: 4000 != 9000 over identical report data"
            - "rebate-preview returns attainment_actual_bps 4000 and attainment_projected_bps 9000, consistent with the entity read"
            - "Distributor.${dist_id}.quota_compliance_tier == SANCTION and status == SUSPENDED (the first report already flipped the tier below 9000 and cascaded)"

      - name: promo_funding_provisional_vs_actual_diverge
        grounds:
          - calculations.promo_funding
          - entities.Promotion.fields.unit_funding_provisional_cents
          - calculations.price_resolution
        distinguishing_aspect: "Dual-variant on the PROMOTION FINANCE domain: provisional unit funding frozen at approve from the starts_on-covering list (499 -> 75) diverges from the actual redemption funding priced from the list EFFECTIVE at redemption time (599 -> 90) after a mid-window price change."
        test_recipe:
          setup:
            - "Logical clock at the startup default 2026-09-01T00:00:00Z."
            - "Brand with LAUNCHED extension line EXT-1; pack 311ml AEROSOL case 12; price list L1 499/300 effective 2026-08-01..2026-12-31."
            - "Promotion 15.00% for 2026-10-01..2026-10-31 approved (status APPROVED, provisional funding frozen)."
          setup_api_calls:
            - *c_brand
            - *c_mfr1
            - *c_mfr1q
            - *c_mfr2
            - *c_mfr2q
            - call: "POST /brand-ops/brands/${brand_id}/product-lines"
              payload: { line_code: "EXT-1", name: "Smart Straw Extension", is_core: false, target_channels: ["HARDWARE"] }
              as: BrandManager
              captures: { line_id: $.data.id }
            - *c_form
            - *c_seal
            - *c_g1
            - *c_g1g
            - *c_g1a
            - *c_g2
            - *c_g2g
            - *c_g2a
            - *c_review
            - *c_pack
            - *c_tool
            - call: "POST /brand-ops/pack-formats/${pack_id}/price-lists"
              payload: { channel: "HARDWARE", list_price_cents: 499, map_price_cents: 300, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", expected_pack_format_version: "${pack_v2}" }
              as: PricingAnalyst
              captures: { pl1_id: $.data.id }
            - *c_enterprod
            - *c_launch
            - call: "POST /brand-ops/promotions"
              payload: { product_line_id: "${line_id}", channel: "HARDWARE", discount_pct: 15.00, starts_on: "2026-10-01", ends_on: "2026-10-31", funding_budget_cents: 100000 }
              as: PricingAnalyst
              as_user_id: "pa-1"
              captures: { promo_id: $.data.id }
            - call: "POST /brand-ops/promotions/${promo_id}/submit"
              payload: {}
              as: PricingAnalyst
              as_user_id: "pa-1"
            - call: "POST /brand-ops/promotions/${promo_id}/approve"
              payload: {}
              as: MarketingManager
              as_user_id: "mm-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /brand-ops/pack-formats/${pack_id}"
              payload: {}
              as: PricingAnalyst
              captures: { pack_v_now: $.data.version }
            - call: "POST /brand-ops/pack-formats/${pack_id}/price-lists"
              payload: { channel: "HARDWARE", list_price_cents: 599, map_price_cents: 300, effective_from: "2026-10-15T00:00:00Z", effective_to: "2027-03-01T00:00:00Z", expected_pack_format_version: "${pack_v_now}" }
              as: PricingAnalyst
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-20T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /brand-ops/promotions/${promo_id}/redemptions"
              payload: { pack_format_id: "${pack_id}", units: 1 }
              as: ChannelManager
              captures: { unit_funding: $.data.unit_funding_cents, accrued: $.data.accrued_funding_cents }
          assert:
            - "Promotion.${promo_id}.unit_funding_provisional_cents == 75 (round_half_up(499 * 15.00 / 100) frozen at approve)"
            - "redemption unit_funding_cents == 90 (round_half_up(599 * 15.00 / 100) from the list EFFECTIVE at 2026-10-20)"
            - "the variants diverge: 75 != 90"
            - "redemption accrued_funding_cents == 90 and remaining_budget_cents == 99910"
            - "Promotion.${promo_id}.status == APPROVED right after approve (starts_on 2026-10-01 was in the future) and == LIVE at redemption time (the 2026-10-10 clock sweep opened the window)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: promo_case_price_rounds_per_unit_before_case_multiply
        grounds:
          - calculations.promo_case_price
          - calculations.promo_funding
          - entities.PackFormat.fields.case_pack_qty
        distinguishing_aspect: "Mode (b) nested rounding: the scaffold pins round-per-unit-then-multiply — list 499 at 15.00% yields unit funding 75, unit price 424, case price 5088 for case_pack_qty 12; the alternative case-level rounding order yields 5090 and is non-conformant."
        test_recipe:
          setup:
            - "Logical clock at the startup default 2026-09-01T00:00:00Z."
            - "Brand with LAUNCHED line EXT-1; pack 311ml AEROSOL, case_pack_qty 12; price list 499/300 EFFECTIVE (window 2026-08-01..2027-08-01)."
            - "Promotion 15.00% for 2026-08-01..2027-07-31 with budget 100000, approved and immediately LIVE (window covers today)."
          setup_api_calls:
            - *c_brand
            - *c_mfr1
            - *c_mfr1q
            - *c_mfr2
            - *c_mfr2q
            - call: "POST /brand-ops/brands/${brand_id}/product-lines"
              payload: { line_code: "EXT-1", name: "Smart Straw Extension", is_core: false, target_channels: ["HARDWARE"] }
              as: BrandManager
              captures: { line_id: $.data.id }
            - *c_form
            - *c_seal
            - *c_g1
            - *c_g1g
            - *c_g1a
            - *c_g2
            - *c_g2g
            - *c_g2a
            - *c_review
            - *c_pack
            - *c_tool
            - *c_price
            - *c_enterprod
            - *c_launch
            - call: "POST /brand-ops/promotions"
              payload: { product_line_id: "${line_id}", channel: "HARDWARE", discount_pct: 15.00, starts_on: "2026-08-01", ends_on: "2027-07-31", funding_budget_cents: 100000 }
              as: PricingAnalyst
              as_user_id: "pa-1"
              captures: { promo_id: $.data.id }
            - call: "POST /brand-ops/promotions/${promo_id}/submit"
              payload: {}
              as: PricingAnalyst
              as_user_id: "pa-1"
            - call: "POST /brand-ops/promotions/${promo_id}/approve"
              payload: {}
              as: MarketingManager
              as_user_id: "mm-1"
          trigger:
            - call: "POST /brand-ops/promotions/${promo_id}/redemptions"
              payload: { pack_format_id: "${pack_id}", units: 12 }
              as: ChannelManager
              captures: { case_price: $.data.promo_case_price_cents, unit_price: $.data.promo_unit_price_cents }
          assert:
            - "redemption unit_funding_cents == 75 (round_half_up(499 * 15.00 / 100) = round_half_up(74.85))"
            - "redemption promo_unit_price_cents == 424 (499 - 75)"
            - "redemption promo_case_price_cents == 5088 (424 * 12); the case-level rounding order would give 5090 and is wrong"
            - "redemption total_funding_cents == 900 (75 * 12), accrued_funding_cents == 900, remaining_budget_cents == 99100"

      - name: distributor_rebate_tiered_selection_with_mass_bonus_and_cap
        grounds:
          - calculations.distributor_rebate
          - calculations.coverage_attainment
          - entities.Distributor.fields.quota_compliance_tier
        distinguishing_aspect: "Mode (a) tiered selection with non-linear interaction: rebate_bps = min(tier_base(attainment) + mass_channel_bonus, 350) — GOLD at exactly 12000 bps attainment plus the MASS bonus yields 325, and the estimate rounds half-up to 4865 cents over 300 net units at reference price 499."
        test_recipe:
          setup:
            - "Logical clock at the startup default 2026-09-01T00:00:00Z; window {2026-06, 2026-07, 2026-08}."
            - "Brand with LAUNCHED core line; distributor with channels_served [HARDWARE, MASS]; ACTIVE assignment quota 1000."
            - "Reports: 2026-06 net 100, 2026-07 net 100, 2026-08 net 100 (total 300 vs 3-month quota floor(1000/4)=250)."
          setup_api_calls:
            - *c_brand
            - *c_market
            - *c_mfr1
            - *c_mfr1q
            - *c_mfr2
            - *c_mfr2q
            - *c_line_core
            - *c_form
            - *c_seal
            - *c_g1
            - *c_g1g
            - *c_g1a
            - *c_g2
            - *c_g2g
            - *c_g2a
            - *c_review
            - *c_pack
            - *c_tool
            - *c_price
            - *c_enterprod
            - *c_launch
            - call: "POST /brand-ops/distributors"
              payload: { legal_name: "Massive Reach Co", home_market_id: "${market_id}", channels_served: ["HARDWARE", "MASS"], credit_limit_cents: 1000000 }
              as: ChannelManager
              captures: { dist_id: $.data.id }
            - call: "POST /brand-ops/distributors/${dist_id}/approve"
              payload: {}
              as: ChannelManager
              captures: { dist_v2: $.data.version }
            - call: "POST /brand-ops/distributors/${dist_id}/coverage-assignments"
              payload: { market_id: "${market_id}", product_line_id: "${line_id}", channel: "HARDWARE", exclusive: false, starts_on: "2026-08-01", ends_on: "2027-07-31", annual_quota_units: 1000, expected_distributor_version: "${dist_v2}" }
              as: ChannelManager
              captures: { asg_id: $.data.id }
            - *c_asg_act
            - call: "POST /brand-ops/distributors/${dist_id}/sell-through-reports"
              payload: { coverage_assignment_id: "${asg_id}", period_month: "2026-06", units_sold: 100 }
              as: DistributorContact
              as_user_id: "${dist_id}"
            - call: "POST /brand-ops/distributors/${dist_id}/sell-through-reports"
              payload: { coverage_assignment_id: "${asg_id}", period_month: "2026-07", units_sold: 100 }
              as: DistributorContact
              as_user_id: "${dist_id}"
            - call: "POST /brand-ops/distributors/${dist_id}/sell-through-reports"
              payload: { coverage_assignment_id: "${asg_id}", period_month: "2026-08", units_sold: 100 }
              as: DistributorContact
              as_user_id: "${dist_id}"
          trigger:
            - call: "GET /brand-ops/distributors/${dist_id}/rebate-preview"
              payload: { reference_unit_price_cents: 499 }
              as: ChannelManager
              captures: { rebate_bps: $.data.rebate_bps, estimate: $.data.rebate_estimate_cents, tier: $.data.quota_compliance_tier }
          assert:
            - "Distributor.${dist_id}.attainment_actual_bps == 12000 (round_half_up(10000 * 300 / 250)) — exactly the GOLD boundary, inclusive"
            - "Distributor.${dist_id}.attainment_projected_bps == 12000 (best month 100 annualized)"
            - "quota_compliance_tier == GOLD"
            - "rebate_bps == 325 (min(300 GOLD base + 25 MASS bonus, 350 cap))"
            - "window_net_units == 300"
            - "rebate_estimate_cents == 4865 (round_half_up(300 * 499 * 325 / 10000) = round_half_up(4865.25))"
            - "Distributor.${dist_id}.status == SUSPENDED: the June report alone (attainment 4000) already cascaded a SANCTION suspension, and later recovery to GOLD does not auto-reinstate"

      - name: dilution_gate_evaluation_order_novelty_baseline_excludes_candidate
        grounds:
          - calculations.line_dilution_cost
          - calculations.brand_equity_consumption
          - entities.ProductLine.fields.dilution_cost_bps
        distinguishing_aspect: "Mode (c) pinned evaluation order: the novelty baseline is the set of OTHER lines already LAUNCHED at evaluation time — line EXT-D (PUMP pack) launches at 750 bps while identical-spec line EXT-E launched afterwards costs 550 bps, because D's launch changed E's baseline."
        test_recipe:
          setup:
            - "Logical clock at the startup default 2026-09-01T00:00:00Z."
            - "Brand with CORE line LAUNCHED (AEROSOL pack, cost 0 because is_core)."
            - "EXT-D: 2 channels, PUMP pack, launched first. EXT-E: identical spec, launched second."
          setup_api_calls:
            - *c_brand
            - *c_mfr1
            - *c_mfr1q
            - *c_mfr2
            - *c_mfr2q
            - *c_line_core
            - *c_form
            - *c_seal
            - *c_g1
            - *c_g1g
            - *c_g1a
            - *c_g2
            - *c_g2g
            - *c_g2a
            - *c_review
            - *c_pack
            - *c_tool
            - *c_price
            - *c_enterprod
            - *c_launch
            - call: "POST /brand-ops/brands/${brand_id}/product-lines"
              payload: { line_code: "EXT-D", name: "Pump Extension D", is_core: false, target_channels: ["HARDWARE", "AUTOMOTIVE"] }
              as: BrandManager
              captures: { line_d_id: $.data.id }
            - call: "POST /brand-ops/product-lines/${line_d_id}/formulations"
              payload: { version_label: "v1", component_codes: ["C1", "C2", "C3", "C4"], voc_class: "STANDARD" }
              as: TradeSecretOfficer
              as_user_id: "tso-1"
              captures: { form_id: $.data.id }
            - *c_seal
            - call: "POST /brand-ops/product-lines/${line_d_id}/pack-formats"
              payload: { size_ml: 200, delivery_system: "PUMP", channel_restrictions: ["HARDWARE"], case_pack_qty: 6 }
              as: SupplyPlanner
              captures: { pack_id: $.data.id, pack_v1: $.data.version }
            - call: "POST /brand-ops/product-lines/${line_d_id}/brand-review"
              payload: { decision: "APPROVE" }
              as: BrandManager
            - *c_g1
            - *c_g1g
            - *c_g1a
            - *c_g2
            - *c_g2g
            - *c_g2a
            - *c_tool
            - *c_price
            - *c_enterprod
            - call: "POST /brand-ops/product-lines/${line_d_id}/launch"
              payload: {}
              as: BrandManager
              captures: { line_d_cost: $.data.dilution_cost_bps }
            - call: "POST /brand-ops/brands/${brand_id}/product-lines"
              payload: { line_code: "EXT-E", name: "Pump Extension E", is_core: false, target_channels: ["HARDWARE", "AUTOMOTIVE"] }
              as: BrandManager
              captures: { line_e_id: $.data.id }
            - call: "POST /brand-ops/product-lines/${line_e_id}/formulations"
              payload: { version_label: "v1", component_codes: ["C1", "C2", "C3", "C4"], voc_class: "STANDARD" }
              as: TradeSecretOfficer
              as_user_id: "tso-1"
              captures: { form_id: $.data.id }
            - *c_seal
