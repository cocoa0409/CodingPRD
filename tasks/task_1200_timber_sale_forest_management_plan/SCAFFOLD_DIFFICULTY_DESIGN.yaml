            - { call: "POST /forestry/sales", payload: { tract_id: "${tr_id}", stand_id: "${st_id}", prescription_id: "${pr2_id}", sale_type: "LUMP_SUM", scaling_rule: "DOYLE", advertised_minimum_cents: 8000000, bid_open_at: "2026-05-10T00:00:00Z", bid_close_at: "2026-05-20T00:00:00Z", harvest_window_start: "2026-10-01", harvest_window_end: "2027-03-01" }, as: Forester, as_user_id: "${f_id}", captures: { sa2_id: "$.data.id" } }
            - { call: "POST /forestry/sales/${sa2_id}/offer", payload: {}, as: Forester, as_user_id: "${f_id}" }
