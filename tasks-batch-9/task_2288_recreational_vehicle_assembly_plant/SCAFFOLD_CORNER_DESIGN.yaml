      - name: commissioning_a_line_moves_every_dealer_entitlement
        claim_type: cross_entity
        grounds:
          - calculations.dealer_slot_entitlement.formula
          - endpoints["POST /production-lines"].side_effects
          - endpoints["GET /dealers/{id}"].side_effects
        distinguishing_aspect: "Writing a ProductionLine row changes a derived field on an entity it has no foreign key to: with LINE-T alone the dealer's entitlement_hours is 720.00, and commissioning a second 240.00 h line doubles it to 1440.00 without touching the Dealer row itself."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "One dealer D-TOW with allocation_share_bp 1500 and exactly one RUNNING line LINE-T of 240.00 h/day; no orders and no slots anywhere."
          setup_api_calls:
            - call: "POST /dealers"
              payload: { dealer_code: "D-TOW", region: "CENTRAL", allocation_share_bp: 1500, floor_plan_credit_limit_cents: 100000000, goodwill_budget_cents: 500000 }
              as: PlantAdmin
              captures: { dlr_id: $.data.id }
            - call: "POST /production-lines"
              payload: { line_code: "LINE-T", chassis_class_supported: "TOWABLE", daily_station_hour_capacity: 240.00, max_units_per_day: 4 }
              as: PlantAdmin
              captures: { line_t_id: $.data.id }
          trigger:
            - call: "GET /dealers/${dlr_id}"
              payload: {}
              as: PlantAdmin
              captures: { ent_1: $.data.entitlement_hours, dlr_v1: $.data.version }
            - call: "POST /production-lines"
              payload: { line_code: "LINE-T2", chassis_class_supported: "TOWABLE", daily_station_hour_capacity: 240.00, max_units_per_day: 4 }
              as: PlantAdmin
              captures: { line_t2_id: $.data.id }
            - call: "GET /dealers/${dlr_id}"
              payload: {}
              as: PlantAdmin
              captures: { ent_2: $.data.entitlement_hours, dlr_v2: $.data.version }
            - call: "POST /production-lines/${line_t2_id}/status"
              payload: { status: "PAUSED" }
              as: ProductionScheduler
              captures: { line_status: $.data.status }
            - call: "GET /dealers/${dlr_id}"
              payload: {}
              as: PlantAdmin
              captures: { ent_3: $.data.entitlement_hours }
          assert:
            - "ent_1 == 720.00 (plant_month_hours 240.00 * 20 = 4800.00, times 1500 bp)"
            - "ent_2 == 1440.00 (plant_month_hours 9600.00 after the second line)"
            - "dlr_v1 == 1 and dlr_v2 == 1 — entitlement_hours is derived on read, so the Dealer row's version never moves"
            - "line_status == PAUSED"
            - "ent_3 == 1440.00 — a PAUSED line still contributes to plant_month_hours, because the calculation admits status IN {RUNNING, PAUSED}"
            - "Dealer.${dlr_id}.allocation_hours_consumed == 0.00 and allocation_slots_reserved == 0 throughout"

      - name: financing_and_production_dimensions_advance_independently
        claim_type: parallel
        grounds:
          - state_machines.UnitOrder.financing_status
          - state_machines.UnitOrder.status
        excluded_because:
          difficulty_instance: unit_order_production_status_and_financing_status_advance_independently
          rationale: "The named §1.8 instance walks both dimensions of the same UnitOrder row across a full order-to-ship pipeline and asserts each dimension's value after every trigger on the other."

      - name: campaign_open_cascade_reaches_lots_installations_builds_and_orders
        claim_type: cascade_down
        grounds:
          - state_machines.RecallCampaign.transitions.DRAFT_to_OPEN.side_effects
          - state_machines.ComponentLot.transitions.AVAILABLE_to_QUARANTINED
          - state_machines.ComponentInstallation.transitions.INSTALLED_to_RECALL_AFFECTED
        excluded_because:
          difficulty_instance: recall_open_quarantines_lot_holds_build_and_order
          rationale: "The named §1.8 instance asserts all four hops of the open cascade, including the supplier rescore, in one probe."

      - name: build_advance_precondition_on_a_paused_line
        claim_type: precondition_enforcement
        grounds:
          - state_machines.UnitBuild.transitions.CHASSIS_PREP_to_SIDEWALL_LAM.preconditions
          - errors.ERR_LINE_NOT_RUNNING
        excluded_because:
          difficulty_instance: build_advance_depends_on_production_line_status
          rationale: "The named §1.8 instance pauses the line under a live build, asserts ERR_LINE_NOT_RUNNING on advance, resumes it and asserts the same advance then succeeds."

      - name: release_to_line_precondition_on_a_suspended_dealer
        claim_type: precondition_enforcement
        grounds:
          - state_machines.UnitOrder.status.transitions.SLOTTED_to_IN_PRODUCTION.preconditions
          - errors.ERR_DEALER_SUSPENDED
        excluded_because:
          difficulty_instance: release_to_line_depends_on_dealer_status_not_on_order_state
          rationale: "The named §1.8 instance holds the order in SLOTTED and flips only Dealer.status, asserting ERR_DEALER_SUSPENDED and then success after reinstatement."

  # ===========================================================================
  # From Table 3 (Calculations)
  # ===========================================================================
  - section: calculations
    instances:

      - name: canonical_class_a_configuration_totals_are_computed_at_submit
        claim_type: aggregation
        grounds:
          - calculations.unit_order_configuration_totals.formula
          - calculations.unit_order_configuration_totals.worked_example
          - entities.UnitOrder.fields.payload_remaining_lbs
        distinguishing_aspect: "The canonical CLASS_A five-option configuration rolls up to exactly required_station_hours 71.24, config_weight_lbs 22920, payload_remaining_lbs 3080, option_price_total_cents 1535500, total_amp_draw 28 and total_water_demand_gal 0 — the 1.05 complexity factor and the 1.15 class factor multiply into a single ROUND_HALF_UP at the end."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "CANON kit: FloorPlan FP-3410 (CLASS_A, 34 ft, msrp 18500000, base hours 46.00, dry 22400, gvwr 26000, wheelbase 242, 50 A, 90 gal); options OPT-AC2, OPT-BATT, OPT-INV, OPT-SOLAR, OPT-WASH; dealer D-WEST in region WEST; one DRAFT STOCK order on all five options."
          setup_api_calls:
            - call: "POST /floor-plans"
              payload: { model_code: "FP-3410", chassis_class: "CLASS_A", length_ft: 34, base_msrp_cents: 18500000, base_station_hours: 46.00, base_dry_weight_lbs: 22400, gvwr_lbs: 26000, required_wheelbase_in: 242, electrical_service_amps: 50, fresh_water_capacity_gal: 90 }
              as: PlantAdmin
              captures: { fp_id: $.data.id }
            - call: "POST /option-items"
              payload: { option_code: "OPT-AC2", category: "ELECTRICAL", install_station: "ROOF_SET", price_cents: 385000, weight_lbs: 95, added_station_hours: 2.50, amp_draw: 16, water_demand_gal: 0 }
              as: PlantAdmin
              captures: { opt_ac2_id: $.data.id }
            - call: "POST /option-items"
              payload: { option_code: "OPT-BATT", category: "ELECTRICAL", install_station: "ROUGH_IN", price_cents: 415000, weight_lbs: 130, added_station_hours: 2.00, amp_draw: 0, water_demand_gal: 0 }
              as: PlantAdmin
              captures: { opt_batt_id: $.data.id }
            - call: "POST /option-items"
              payload: { option_code: "OPT-INV", category: "ELECTRICAL", install_station: "ROUGH_IN", price_cents: 165000, weight_lbs: 45, added_station_hours: 1.50, amp_draw: 0, water_demand_gal: 0 }
              as: PlantAdmin
              captures: { opt_inv_id: $.data.id }
            - call: "POST /option-items"
              payload: { option_code: "OPT-SOLAR", category: "ELECTRICAL", install_station: "ROOF_SET", price_cents: 325000, weight_lbs: 70, added_station_hours: 4.00, amp_draw: 0, water_demand_gal: 0 }
              as: PlantAdmin
              captures: { opt_solar_id: $.data.id }
            - call: "POST /option-items"
              payload: { option_code: "OPT-WASH", category: "APPLIANCE", install_station: "APPLIANCE_INSTALL", price_cents: 245500, weight_lbs: 180, added_station_hours: 3.00, amp_draw: 12, water_demand_gal: 0 }
              as: PlantAdmin
              captures: { opt_wash_id: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "D-WEST", region: "WEST", allocation_share_bp: 1500, floor_plan_credit_limit_cents: 100000000, goodwill_budget_cents: 500000 }
              as: PlantAdmin
              captures: { dlr_id: $.data.id }
            - call: "POST /unit-orders"
              payload: { dealer_id: "${dlr_id}", floor_plan_id: "${fp_id}", order_type: "STOCK", selected_option_ids: ["${opt_ac2_id}", "${opt_batt_id}", "${opt_inv_id}", "${opt_solar_id}", "${opt_wash_id}"], requested_delivery_date: "2026-10-01T00:00:00Z" }
              as: DealerPrincipal
              as_user_id: "${dlr_id}"
              captures: { ord_id: $.data.id, hours_at_create: $.data.required_station_hours }
          trigger:
            - call: "POST /unit-orders/${ord_id}/submit"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${dlr_id}"
              captures: { hours: $.data.required_station_hours, wt: $.data.config_weight_lbs, pay: $.data.payload_remaining_lbs, opt_total: $.data.option_price_total_cents, amps: $.data.total_amp_draw, water: $.data.total_water_demand_gal, prov: $.data.provisional_invoice_cents }
          assert:
            - "hours_at_create == 71.24 — the totals are already derived at create, before any validation gate"
            - "hours == 71.24 (raw 59.00 * 1.05 * 1.15 = 71.2425, one ROUND_HALF_UP at the end)"
            - "wt == 22920 (22400 + 95 + 130 + 45 + 70 + 180) and pay == 3080"
            - "opt_total == 1535500 and amps == 28 and water == 0"
            - "prov == 16122725 (discounted subtotal 15704925 + freight 417800 for 34 ft in region WEST)"
            - "UnitOrder.${ord_id}.status == CONFIG_VALIDATED with five entries in locked_option_versions"

      - name: amp_surcharge_constant_applies_only_above_forty_amps
        claim_type: constants_applied
        grounds:
          - calculations.unit_order_configuration_totals.constants.ELECTRICAL_SURCHARGE_AMP_THRESHOLD
