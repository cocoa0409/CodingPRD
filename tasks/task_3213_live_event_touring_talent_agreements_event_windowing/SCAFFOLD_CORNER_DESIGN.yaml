# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3213_live_event_touring_talent_agreements_event_windowing
#
# Breadth probe: every claim the §1.1-§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners §1.8
# already covers appear as `excluded_because:` stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ==============================================================
  - section: entities
    instances:
      - name: talent_creation_applies_system_defaults
        claim_type: defaults
        grounds: [entities.Talent.fields.roster_tier, entities.Talent.fields.availability_status]
        distinguishing_aspect: "A created talent starts DEVELOPMENTAL / ACTIVE with wellness_score 50.00, booking_mode LIMITED, likeness_granted false — inputs cannot override system/computed fields."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /touring/talents"
              payload: { ring_name: "Default Dan", legal_name: "Dan Legal", contractor_status: "INDEPENDENT_CONTRACTOR" }
              as: TalentRelations
              captures: { t_id: $.data.id }
          trigger:
            - call: "GET /touring/talents/${t_id}"
              as: TalentRelations
          assert:
            - "Talent.${t_id}.roster_tier == DEVELOPMENTAL"
            - "Talent.${t_id}.availability_status == ACTIVE"
            - "Talent.${t_id}.wellness_score == 50.00"
            - "Talent.${t_id}.booking_mode == LIMITED"
            - "Talent.${t_id}.likeness_granted == false"

      - name: talent_creation_invalid_contractor_status_rejected
        claim_type: type_constraint
        grounds: [entities.Talent.fields.contractor_status, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "contractor_status accepts only INDEPENDENT_CONTRACTOR; any other enum value is rejected at priority 24."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /touring/talents"
              payload: { ring_name: "Emp Ed", legal_name: "Ed Legal", contractor_status: "EMPLOYEE" }
              as: TalentRelations
              captures: { err: $.data.error_id }
          assert:
            - "response $.data.error_id == ERR_INVALID_REQUEST with HTTP 400"

      - name: talent_get_nonexistent_id_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but absent UUID hits the priority-3 existence check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /touring/talents/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: TalentRelations
              captures: { err: $.data.error_id }
          assert:
            - "response $.data.error_id == ERR_NOT_FOUND with HTTP 404"

      - name: talents_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "List endpoint honors limit/offset with total_count and has_more in the fixed envelope."
        test_recipe:
          setup: ["two talents exist"]
          setup_api_calls:
            - call: "POST /touring/talents"
              payload: { ring_name: "Page One", legal_name: "One Legal", contractor_status: "INDEPENDENT_CONTRACTOR" }
              as: TalentRelations
            - call: "POST /touring/talents"
              payload: { ring_name: "Page Two", legal_name: "Two Legal", contractor_status: "INDEPENDENT_CONTRACTOR" }
              as: TalentRelations
          trigger:
            - call: "GET /touring/talents"
              payload: { limit: 1, offset: 0 }
              as: TourPlanner
          assert:
            - "response meta contains api_request_id and api_request_timestamp"
            - "response_type == array; data has exactly 1 item"
            - "pagination block reports total_count == 2 and has_more == true"

      - name: merch_sale_immutable_no_update_endpoint
        claim_type: immutability
        grounds: [entities.MerchSale]
        distinguishing_aspect: "MerchSale has common_fields:false and no PATCH/PUT endpoint — a PUT against it is not routed (404/405) and the resource exposes no version field."
        test_recipe:
          setup: ["one merch sale recorded on a SCHEDULED event for a likeness-granted BOOKABLE talent"]
          setup_api_calls:
            - call: "POST /touring/talents"
              payload: { ring_name: "Imm Irv", legal_name: "Irv Legal", contractor_status: "INDEPENDENT_CONTRACTOR" }
              as: TalentRelations
              captures: { t_id: $.data.id }
            - call: "POST /touring/agreements"
              payload: { talent_id: "${t_id}", start_date: "2026-01-01", end_date: "2027-01-01", downside_guarantee_cents: 100000, royalty_rate_bp: 2000, likeness_rights_granted: true, min_appearances_per_quarter: 0 }
              as: ContractAdmin
              captures: { ag_id: $.data.id, ag_v: $.data.version }
            - call: "POST /touring/agreements/${ag_id}/activate"
              payload: { expected_agreement_version: "${ag_v}" }
              as: ContractAdmin
            - call: "POST /touring/arenas"
              payload: { name: "Imm Arena", city: "Orlando", country_code: "US", capacity: 1000, merch_booths: 1, timezone: "America/New_York" }
              as: TourPlanner
              captures: { ar_id: $.data.id }
            - call: "POST /touring/events"
              payload: { name: "IME", event_type: "HOUSE_SHOW", arena_id: "${ar_id}", event_date: "2026-09-05", start_time: "19:00", end_time: "21:00", tour_country_code: "US", roster_min_main: 0, roster_min_total: 0 }
              as: TourPlanner
              captures: { ev_id: $.data.id }
            - call: "POST /touring/merch-sales"
              payload: { event_id: "${ev_id}", talent_id: "${t_id}", quantity: 1, unit_price_cents: 2500, sold_at: "2026-09-05T20:00:00Z" }
              as: MerchOps
              captures: { ms_id: $.data.id }
          trigger:
            - call: "GET /touring/merch-sales"
              payload: { event_id: "${ev_id}" }
              as: MerchOps
          assert:
            - "the returned MerchSale.${ms_id} object exposes no version and no updated_at field (common_fields:false)"
            - "MerchSale.${ms_id}.royalty_cents == 475 (day gross 2500 < 100000 -> tier0 rate 1900bp; round_half_up(2500*1900/10000) = 475)"

  # ==============================================================
  - section: state_machines
    instances:
      - name: agreement_terminal_expired_rejects_activate
        claim_type: terminal_state_lockdown
        grounds: [state_machines.TalentAgreement, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "An EXPIRED agreement (terminal) rejects activation attempts with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Agreement A1 [2026-01-01,2026-09-01) activated, then logical clock advanced to 2026-09-01 -> auto-EXPIRED"]
          setup_api_calls:
            - call: "POST /touring/talents"
              payload: { ring_name: "Old Otto", legal_name: "Otto Legal", contractor_status: "INDEPENDENT_CONTRACTOR" }
              as: TalentRelations
              captures: { t_id: $.data.id }
            - call: "POST /touring/agreements"
              payload: { talent_id: "${t_id}", start_date: "2026-01-01", end_date: "2026-09-01", downside_guarantee_cents: 100000, royalty_rate_bp: 2000, likeness_rights_granted: true, min_appearances_per_quarter: 0 }
              as: ContractAdmin
              captures: { ag_id: $.data.id, ag_v: $.data.version }
            - call: "POST /touring/agreements/${ag_id}/activate"
              payload: { expected_agreement_version: "${ag_v}" }
              as: ContractAdmin
            - call: "POST /touring/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ContractAdmin
            - call: "GET /touring/agreements/${ag_id}"
              as: ContractAdmin
              captures: { ag_v2: $.data.version }
          trigger:
            - call: "POST /touring/agreements/${ag_id}/activate"
              payload: { expected_agreement_version: "${ag_v2}" }
              as: ContractAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response $.data.error_id == ERR_INVALID_STATE (EXPIRED is terminal)"

      - name: agreement_expiry_clears_likeness_granted
        claim_type: valid_transition
        grounds: [state_machines.TalentAgreement.ACTIVE_to_EXPIRED, entities.Talent.fields.likeness_granted]
        distinguishing_aspect: "The clock-driven ACTIVE->EXPIRED sweep recomputes Talent.likeness_granted to false when the only likeness-granting agreement expires."
        test_recipe:
          setup: ["same as terminal-lockdown setup: one ACTIVE likeness agreement expiring at 2026-09-01"]
          setup_api_calls:
            - call: "POST /touring/talents"
              payload: { ring_name: "Lapse Lou", legal_name: "Lou Legal", contractor_status: "INDEPENDENT_CONTRACTOR" }
              as: TalentRelations
              captures: { t_id: $.data.id }
            - call: "POST /touring/agreements"
              payload: { talent_id: "${t_id}", start_date: "2026-01-01", end_date: "2026-09-01", downside_guarantee_cents: 100000, royalty_rate_bp: 2000, likeness_rights_granted: true, min_appearances_per_quarter: 0 }
              as: ContractAdmin
              captures: { ag_id: $.data.id, ag_v: $.data.version }
            - call: "POST /touring/agreements/${ag_id}/activate"
              payload: { expected_agreement_version: "${ag_v}" }
              as: ContractAdmin
          trigger:
            - call: "POST /touring/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: ContractAdmin
          assert:
            - "TalentAgreement.${ag_id}.status == EXPIRED"
            - "Talent.${t_id}.likeness_granted == false"

      - name: visa_terminal_states_reject_further_transitions
        claim_type: terminal_state_lockdown
        grounds: [state_machines.VisaCase, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A GRANTED visa cannot be denied and a DENIED visa cannot be granted — both are terminal."
        test_recipe:
          setup: ["VisaCase V1 DRAFT->SUBMITTED->GRANTED for talent T country JP"]
          setup_api_calls:
            - call: "POST /touring/talents"
              payload: { ring_name: "Jet Jess", legal_name: "Jess Legal", contractor_status: "INDEPENDENT_CONTRACTOR" }
              as: TalentRelations
              captures: { t_id: $.data.id }
            - call: "POST /touring/visa-cases"
              payload: { talent_id: "${t_id}", country_code: "JP", required_by_date: "2026-12-01" }
              as: LogisticsCoordinator
              captures: { v_id: $.data.id }
            - call: "POST /touring/visa-cases/${v_id}/submit"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /touring/visa-cases/${v_id}/grant"
              payload: {}
              as: LogisticsCoordinator
          trigger:
            - call: "POST /touring/visa-cases/${v_id}/deny"
              payload: {}
              as: LogisticsCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response $.data.error_id == ERR_INVALID_STATE (GRANTED is terminal)"

      - name: event_completed_rejects_cancel_and_booking
        claim_type: invalid_transition
        grounds: [state_machines.Event, "errors[ERR_INVALID_STATE]", "errors[ERR_EVENT_NOT_MUTABLE]"]
        distinguishing_aspect: "COMPLETED (terminal) rejects cancel; LOCKED (non-SCHEDULED) rejects new bookings with the event-mutability error — two distinct guards on the same machine."
        test_recipe:
          setup: ["Event E1 LOCKED (mins 0) then COMPLETED; event E2 LOCKED (mins 0), still locked; a BOOKABLE talent T exists (fresh 50.00 LIMITED suffices for HOUSE_SHOW)"]
          setup_api_calls:
            - call: "POST /touring/talents"
              payload: { ring_name: "Lock Larry", legal_name: "Larry Legal", contractor_status: "INDEPENDENT_CONTRACTOR" }
              as: TalentRelations
              captures: { t_id: $.data.id }
            - call: "POST /touring/arenas"
              payload: { name: "Term Arena", city: "Orlando", country_code: "US", capacity: 1000, merch_booths: 0, timezone: "America/New_York" }
              as: TourPlanner
              captures: { ar_id: $.data.id }
            - call: "POST /touring/events"
              payload: { name: "E1", event_type: "HOUSE_SHOW", arena_id: "${ar_id}", event_date: "2026-09-05", start_time: "19:00", end_time: "21:00", tour_country_code: "US", roster_min_main: 0, roster_min_total: 0 }
              as: TourPlanner
              captures: { e1_id: $.data.id, e1_v: $.data.version }
            - call: "POST /touring/events/${e1_id}/lock"
              payload: { expected_event_version: "${e1_v}" }
              as: TourPlanner
            - call: "POST /touring/events/${e1_id}/complete"
              payload: {}
              as: TourPlanner
            - call: "POST /touring/events"
              payload: { name: "E2", event_type: "HOUSE_SHOW", arena_id: "${ar_id}", event_date: "2026-09-06", start_time: "19:00", end_time: "21:00", tour_country_code: "US", roster_min_main: 0, roster_min_total: 0 }
              as: TourPlanner
              captures: { e2_id: $.data.id, e2_v: $.data.version }
            - call: "POST /touring/events/${e2_id}/lock"
              payload: { expected_event_version: "${e2_v}" }
              as: TourPlanner
          trigger:
            - call: "POST /touring/events/${e1_id}/cancel"
              payload: {}
              as: TourPlanner
              captures: { err1: $.data.error_id }
            - call: "POST /touring/bookings"
              payload: { event_id: "${e2_id}", talent_id: "${t_id}", segment_label: "MATCH_1" }
              as: TourPlanner
              captures: { err2: $.data.error_id }
          assert:
            - "cancel on COMPLETED returns $.data.error_id == ERR_INVALID_STATE"
            - "booking on LOCKED returns $.data.error_id == ERR_EVENT_NOT_MUTABLE"

      - name: storyline_conclude_requires_all_chapters_terminal
        claim_type: precondition_enforcement
        grounds: [state_machines.Storyline.ACTIVE_to_CONCLUDED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Conclude is rejected while any chapter is still PLANNED; after the last chapter's event is cancelled (chapter MISSED), conclude succeeds."
        test_recipe:
          setup: ["ACTIVE storyline S with one PLANNED chapter on SCHEDULED event EC"]
          setup_api_calls:
            - call: "POST /touring/storylines"
              payload: { title: "Conclude Feud" }
              as: StorylineEditor
              captures: { s_id: $.data.id }
            - call: "POST /touring/arenas"
              payload: { name: "Con Arena", city: "Orlando", country_code: "US", capacity: 1000, merch_booths: 0, timezone: "America/New_York" }
              as: TourPlanner
              captures: { ar_id: $.data.id }
            - call: "POST /touring/events"
              payload: { name: "EC", event_type: "HOUSE_SHOW", arena_id: "${ar_id}", event_date: "2026-09-05", start_time: "19:00", end_time: "21:00", tour_country_code: "US", roster_min_main: 0, roster_min_total: 0 }
              as: TourPlanner
              captures: { ec_id: $.data.id }
            - call: "POST /touring/chapters"
              payload: { storyline_id: "${s_id}", event_id: "${ec_id}" }
              as: StorylineEditor
            - call: "POST /touring/storylines/${s_id}/activate"
              payload: {}
              as: StorylineEditor
          trigger:
            - call: "POST /touring/storylines/${s_id}/conclude"
              payload: {}
              as: StorylineEditor
              captures: { err: $.data.error_id }
            - call: "POST /touring/events/${ec_id}/cancel"
              payload: {}
              as: TourPlanner
            - call: "POST /touring/storylines/${s_id}/conclude"
              payload: {}
              as: StorylineEditor
          assert:
            - "first conclude response $.data.error_id == ERR_INVALID_STATE (chapter still PLANNED)"
            - "after event cancellation flips the chapter to MISSED, second conclude succeeds: Storyline.${s_id}.status == CONCLUDED"

      - name: statement_finalize_requires_final_basis
        claim_type: precondition_enforcement
        grounds: [state_machines.RoyaltyStatement.OPEN_to_FINALIZED, "errors[ERR_STATEMENT_NOT_FINALIZABLE]"]
        distinguishing_aspect: "A PROVISIONAL-basis statement cannot be finalized; a FINAL-basis statement finalizes and then rejects recompute."
        test_recipe:
          setup: ["talent T with agreement; one OPEN statement SP basis PROVISIONAL and one OPEN statement SF basis FINAL (empty periods are fine — totals 0)"]
          setup_api_calls:
            - call: "POST /touring/talents"
              payload: { ring_name: "Stmt Sue", legal_name: "Sue Legal", contractor_status: "INDEPENDENT_CONTRACTOR" }
              as: TalentRelations
              captures: { t_id: $.data.id }
            - call: "POST /touring/agreements"
              payload: { talent_id: "${t_id}", start_date: "2026-01-01", end_date: "2027-01-01", downside_guarantee_cents: 100000, royalty_rate_bp: 2000, likeness_rights_granted: false, min_appearances_per_quarter: 0 }
              as: ContractAdmin
              captures: { ag_id: $.data.id, ag_v: $.data.version }
            - call: "POST /touring/agreements/${ag_id}/activate"
              payload: { expected_agreement_version: "${ag_v}" }
              as: ContractAdmin
            - call: "POST /touring/royalty-statements"
              payload: { talent_id: "${t_id}", period_start_date: "2026-09-01", period_end_date: "2026-10-01", basis_mode: "PROVISIONAL" }
              as: ContractAdmin
              captures: { sp_id: $.data.id }
            - call: "POST /touring/royalty-statements"
              payload: { talent_id: "${t_id}", period_start_date: "2026-09-01", period_end_date: "2026-10-01", basis_mode: "FINAL" }
              as: ContractAdmin
              captures: { sf_id: $.data.id }
          trigger:
            - call: "POST /touring/royalty-statements/${sp_id}/finalize"
              payload: {}
              as: ContractAdmin
              captures: { err: $.data.error_id }
            - call: "POST /touring/royalty-statements/${sf_id}/finalize"
              payload: {}
              as: ContractAdmin
            - call: "POST /touring/royalty-statements/${sf_id}/recompute"
              payload: {}
              as: ContractAdmin
              captures: { err2: $.data.error_id }
          assert:
            - "PROVISIONAL finalize response $.data.error_id == ERR_STATEMENT_NOT_FINALIZABLE"
            - "FINAL finalize succeeds: RoyaltyStatement.${sf_id}.status == FINALIZED"
            - "recompute on FINALIZED returns $.data.error_id == ERR_INVALID_STATE"

      - name: storyline_activation_requires_planned_chapter
        claim_type: precondition_enforcement
        grounds: [state_machines.Storyline.PLANNED_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A storyline with zero PLANNED chapters cannot be activated."
        test_recipe:
          setup: ["storyline S created, no chapters"]
          setup_api_calls:
            - call: "POST /touring/storylines"
              payload: { title: "Empty Feud" }
              as: StorylineEditor
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /touring/storylines/${s_id}/activate"
              payload: {}
              as: StorylineEditor
              captures: { err: $.data.error_id }
          assert:
            - "response $.data.error_id == ERR_INVALID_STATE"

      - name: storyline_conclude_terminal_rejects_revive
        claim_type: invalid_transition
        grounds: [state_machines.Storyline]
        distinguishing_aspect: "CONCLUDED is terminal: revive is only declared from SHELVED, so reviving a CONCLUDED storyline fails."
        test_recipe:
          setup: ["storyline S ACTIVE with a single chapter whose event completed, then concluded"]
          setup_api_calls:
            - call: "POST /touring/storylines"
              payload: { title: "Done Feud" }
              as: StorylineEditor
              captures: { s_id: $.data.id }
            - call: "POST /touring/arenas"
              payload: { name: "Done Arena", city: "Orlando", country_code: "US", capacity: 1000, merch_booths: 0, timezone: "America/New_York" }
              as: TourPlanner
              captures: { ar_id: $.data.id }
            - call: "POST /touring/events"
              payload: { name: "DE", event_type: "HOUSE_SHOW", arena_id: "${ar_id}", event_date: "2026-09-05", start_time: "19:00", end_time: "21:00", tour_country_code: "US", roster_min_main: 0, roster_min_total: 0 }
              as: TourPlanner
              captures: { de_id: $.data.id, de_v: $.data.version }
            - call: "POST /touring/chapters"
              payload: { storyline_id: "${s_id}", event_id: "${de_id}" }
              as: StorylineEditor
            - call: "POST /touring/storylines/${s_id}/activate"
              payload: {}
              as: StorylineEditor
            - call: "POST /touring/events/${de_id}/lock"
              payload: { expected_event_version: "${de_v}" }
              as: TourPlanner
            - call: "POST /touring/events/${de_id}/complete"
              payload: {}
              as: TourPlanner
            - call: "POST /touring/storylines/${s_id}/conclude"
              payload: {}
              as: StorylineEditor
          trigger:
            - call: "POST /touring/storylines/${s_id}/revive"
              payload: {}
              as: StorylineEditor
              captures: { err: $.data.error_id }
          assert:
            - "response $.data.error_id == ERR_INVALID_STATE (CONCLUDED is terminal; revive only from SHELVED)"

      - name: shelving_misses_remaining_planned_chapters_without_extra_gaps
        claim_type: side_effect_execution
        grounds: [state_machines.Storyline.ACTIVE_to_SHELVED]
        distinguishing_aspect: "The 3rd gap shelves the storyline AND flips its remaining PLANNED chapters to MISSED without further gap_count increments (gap_count stays 3)."
        test_recipe:
          setup: ["ACTIVE storyline S with chapters on E1..E4 (2026-09-05..08); E1, E2, E3 cancelled (gap_count == 3, S SHELVED); E4 still SCHEDULED with its chapter"]
          setup_api_calls:
            - call: "POST /touring/storylines"
              payload: { title: "Shelf Feud" }
              as: StorylineEditor
              captures: { s_id: $.data.id }
            - call: "POST /touring/arenas"
              payload: { name: "Shelf Arena", city: "Orlando", country_code: "US", capacity: 1000, merch_booths: 0, timezone: "America/New_York" }
              as: TourPlanner
              captures: { ar_id: $.data.id }
            - call: "POST /touring/events"
              payload: { name: "S1", event_type: "HOUSE_SHOW", arena_id: "${ar_id}", event_date: "2026-09-05", start_time: "19:00", end_time: "21:00", tour_country_code: "US", roster_min_main: 0, roster_min_total: 0 }
              as: TourPlanner
              captures: { s1_id: $.data.id }
            - call: "POST /touring/events"
              payload: { name: "S2", event_type: "HOUSE_SHOW", arena_id: "${ar_id}", event_date: "2026-09-06", start_time: "19:00", end_time: "21:00", tour_country_code: "US", roster_min_main: 0, roster_min_total: 0 }
              as: TourPlanner
              captures: { s2_id: $.data.id }
            - call: "POST /touring/events"
              payload: { name: "S3", event_type: "HOUSE_SHOW", arena_id: "${ar_id}", event_date: "2026-09-07", start_time: "19:00", end_time: "21:00", tour_country_code: "US", roster_min_main: 0, roster_min_total: 0 }
              as: TourPlanner
              captures: { s3_id: $.data.id }
            - call: "POST /touring/events"
              payload: { name: "S4", event_type: "HOUSE_SHOW", arena_id: "${ar_id}", event_date: "2026-09-08", start_time: "19:00", end_time: "21:00", tour_country_code: "US", roster_min_main: 0, roster_min_total: 0 }
              as: TourPlanner
              captures: { s4_id: $.data.id }
            - call: "POST /touring/chapters"
              payload: { storyline_id: "${s_id}", event_id: "${s1_id}" }
              as: StorylineEditor
            - call: "POST /touring/chapters"
              payload: { storyline_id: "${s_id}", event_id: "${s2_id}" }
              as: StorylineEditor
            - call: "POST /touring/chapters"
              payload: { storyline_id: "${s_id}", event_id: "${s3_id}" }
              as: StorylineEditor
            - call: "POST /touring/chapters"
              payload: { storyline_id: "${s_id}", event_id: "${s4_id}" }
              as: StorylineEditor
              captures: { ch4_id: $.data.id }
