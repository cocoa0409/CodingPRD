          - entities.Park.fields.long_stay_nights_threshold
        distinguishing_aspect: "A 28-night reservation has stay_class=LONG_TERM (>= threshold 28); cancelling it in the full-refund window still yields refund_cents=0 because LONG_TERM deposits are non-refundable."
        test_recipe:
          setup: ["RV Reservation R 28 nights, deposit paid, CONFIRMED; clock >=14 days before check-in."]
          setup_api_calls:
            - call: "POST /_clock/set"
