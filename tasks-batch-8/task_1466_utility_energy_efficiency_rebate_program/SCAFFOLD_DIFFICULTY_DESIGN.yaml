  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: application_submit_requires_program_year_open
        grounds:
          - state_machines.RebateApplication.DRAFT_to_SUBMITTED
          - entities.ProgramYear.fields.status
        distinguishing_aspect: |
          Entity pair: RebateApplication → ProgramYear. Submitting an
          application requires ProgramYear.status == OPEN; if the program year
          has been transitioned to CLOSED, the submit is rejected with
          ERR_PROGRAM_NOT_OPEN regardless of the application's own state.
        test_recipe:
          setup:
            - "ProgramYear OPEN; one application APPROVED (so close succeeds)"
            - "A second application already created as DRAFT (before close)"
            - "Then the program is CLOSED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-13T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /program-years"
              payload: { program_code: "RES-HVAC-2026", program_year_label: "PY2026", budget_cap_cents: 20000000, savings_goal_kwh: 500000 }
              as: ProgramAdministrator
              captures: { py_id: $.data.id }
            - call: "POST /measures"
              payload: { program_year_id: "${py_id}", measure_code: "M1", measure_name: "M1", base_rate_cents: 10000, deemed_kwh_per_unit: 100 }
