              as_user_id: "u_pol_1"
              captures: { prof_id: $.data.id }
            - call: "POST /ca/certificate-profiles/${prof_id}/activate"
              payload: {}
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
            - call: "POST /ca/subscribers"
              payload: { legal_name: "Papa Sp z o o", jurisdiction_code: "PL", registry_id: "PL-5252556677", contact_email: "ops@papa.example", callback_phone: "+48225550199", credit_limit_cents: 1000000 }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
              captures: { sub_id: $.data.id }
            - call: "POST /ca/hsm-partitions"
              payload: { label: "part-a", serial: "HSM-0001" }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
              captures: { part_id: $.data.id }
            - call: "POST /ca/hsm-partitions/${part_id}/key-ceremonies"
              payload: { window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T00:30:00Z", attestation_valid_days: 60 }
              as: ISSUANCE_OPERATOR
              as_user_id: "u_iss_1"
              captures: { cer_id: $.data.id }
            - call: "POST /ca/key-ceremonies/${cer_id}/witness"
              payload: {}
              as: ISSUANCE_OPERATOR
              as_user_id: "u_iss_1"
            - call: "POST /ca/key-ceremonies/${cer_id}/witness"
              payload: {}
              as: ISSUANCE_OPERATOR
              as_user_id: "u_iss_2"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:30:00Z" }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
            - call: "POST /ca/key-ceremonies/${cer_id}/attest"
              payload: {}
              as: COMPLIANCE_AUDITOR
              as_user_id: "u_aud_1"
            - call: "POST /ca/domain-authorizations"
              payload: { subscriber_id: "${sub_id}", profile_id: "${prof_id}", domain_name: "d1.example.org", method: "DNS_TXT" }
              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
              captures: { auth_id: $.data.id, tok: $.data.challenge_token }
            - call: "POST /ca/domain-authorizations/${auth_id}/validate"
              payload: { challenge_token: "${tok}" }
              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
            - call: "POST /ca/certificate-requests"
              payload: { subscriber_id: "${sub_id}", profile_id: "${prof_id}", requested_domains: ["d1.example.org"], requested_validity_days: 90, csr_key_bits: 2048, expedited: false }
              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
              captures: { req_id: $.data.id }
            - call: "POST /ca/certificate-requests/${req_id}/submit"
              payload: {}
              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
            - call: "POST /ca/certificate-requests/${req_id}/clear-validation"
              payload: {}
              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
            - call: "POST /ca/certificate-requests/${req_id}/issue"
              payload: { ceremony_id: "${cer_id}" }
              as: ISSUANCE_OPERATOR
              as_user_id: "u_iss_9"
              captures: { cert_id: $.data.id, cert_v: $.data.version }
            - call: "POST /ca/revocation-requests"
              payload: { certificate_id: "${cert_id}", reason_code: "SUPERSEDED", expected_certificate_version: "${cert_v}", evidence_ref: "replacement-order-7781" }
              as: REVOCATION_OFFICER
