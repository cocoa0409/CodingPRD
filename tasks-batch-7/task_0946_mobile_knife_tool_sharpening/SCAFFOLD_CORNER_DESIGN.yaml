              captures: { acct: $.data.id }
            - call: "POST /sharpening/service-requests"
              payload: { account_id: "${acct}", channel: "LOCKER", requested_date: "2026-05-01", locker_site_code: "SITE-A" }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { sr: $.data.id }
            - call: "POST /sharpening/service-requests/${sr}/items"
              payload: { item_class_spec_id: "${spec_chef}", item_class: "CHEF_KNIFE", declared_damage_tier: "ROUTINE_HONE" }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { item: $.data.id }
            - call: "POST /sharpening/service-requests/${sr}/submit"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct}"
            - call: "POST /sharpening/service-requests/${sr}/locker-assign"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { code: $.data.access_code, hold_end: $.data.hold_expires_at }
            - call: "POST /sharpening/locker-compartments/${comp}/deposit"
              payload: { access_code: "${code}" }
              as: AccountOwner
              as_user_id: "${acct}"
          trigger:
            - call: "POST /sharpening/locker-compartments/${comp}/expire-hold"
              payload: {}
              as: PlatformAdmin
              captures: { early_err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sharpening/locker-compartments/${comp}/expire-hold"
              payload: {}
              as: PlatformAdmin
              captures: { st: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sharpening/locker-compartments/${comp}/abandon"
              payload: {}
              as: PlatformAdmin
              captures: { st2: $.data.status }
          assert:
            - "first expire-hold HTTP status == 409 with error_id ERR_INVALID_STATE"
            - "second expire-hold leaves LockerCompartment.${comp}.status == HOLD_EXPIRED"
            - "LockerCompartment.${comp}.status == AVAILABLE"
            - "LockerCompartment.${comp}.current_service_request_id == null"
            - "LockerCompartment.${comp}.last_released_at == 2026-05-11T00:00:00.000Z"
            - "RequestItem.${item}.custody_location == ABANDONED"
            - "RequestItem.${item}.service_status == ABANDONED"

      - name: subscription_skip_advances_next_service_date_by_one_interval
        claim_type: valid_transition
        grounds:
          - state_machines.Subscription.ACTIVE_to_ACTIVE
          - calculations.next_service_date
          - entities.Subscription.fields.skip_count_this_cycle
        distinguishing_aspect: "A MONTHLY subscription anchored 2026-06-01 has next_service_date 2026-06-01; a skip taken on 2026-05-01 pushes it exactly CADENCE_INTERVAL_DAYS[MONTHLY] = 28 days out to 2026-06-29 and raises skip_count_this_cycle to 1."
        test_recipe:
          setup:
            - "One ACTIVE MONTHLY Subscription anchored 2026-06-01, clock at the 2026-05-01T00:00:00Z default so the skip window is wide open."
          setup_api_calls:
            - call: "POST /sharpening/plan-tiers"
              payload: { code: "BLADE_BASIC", monthly_fee_cents: 12000, included_items_per_cycle: 2, overage_discount_pct: 0.15, allowed_cadences: ["WEEKLY", "BIWEEKLY", "MONTHLY"] }
              as: PlatformAdmin
              captures: { tier: $.data.id }
            - call: "POST /sharpening/accounts"
              payload: { name: "Blue Fork Kitchen", account_type: "RESTAURANT", zone_code: "ZONE_N", contact_email: "ops@bluefork.test" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /sharpening/subscriptions"
              payload: { account_id: "${acct}", plan_tier_id: "${tier}", cadence: "MONTHLY", anchor_date: "2026-06-01" }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { sub: $.data.id, nsd0: $.data.next_service_date }
          trigger:
            - call: "POST /sharpening/subscriptions/${sub}/skip"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { nsd1: $.data.next_service_date }
          assert:
            - "Subscription.${sub}.next_service_date == 2026-06-29"
            - "Subscription.${sub}.skip_count_this_cycle == 1"
            - "Subscription.${sub}.status == ACTIVE"
            - "Subscription.${sub}.cycle_index == 1"

      - name: advance_cycle_expires_unused_allowance_and_regrants_it
        claim_type: ledger_sync
        grounds:
          - state_machines.Subscription.ACTIVE_to_ACTIVE
          - entities.AllowanceLedgerEntry.fields.kind
          - calculations.next_service_date
        distinguishing_aspect: "Because ALLOWANCE_ROLLOVER_ENABLED is false, advancing the cycle on 2026-05-31 writes an EXPIRED entry of 2 followed by a GRANTED entry of 2, leaves allowance_remaining at 2, moves cycle_index to 2 and re-derives next_service_date to 2026-06-26."
        test_recipe:
          setup:
            - "One ACTIVE MONTHLY Subscription anchored 2026-05-01 with included_items_this_cycle 2 and allowance_remaining 2."
            - "Logical clock moved to 2026-05-31T00:00:00Z, which is exactly cycle_end_date."
          setup_api_calls:
            - call: "POST /sharpening/plan-tiers"
              payload: { code: "BLADE_BASIC", monthly_fee_cents: 12000, included_items_per_cycle: 2, overage_discount_pct: 0.15, allowed_cadences: ["WEEKLY", "BIWEEKLY", "MONTHLY"] }
              as: PlatformAdmin
              captures: { tier: $.data.id }
            - call: "POST /sharpening/accounts"
              payload: { name: "Blue Fork Kitchen", account_type: "RESTAURANT", zone_code: "ZONE_N", contact_email: "ops@bluefork.test" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /sharpening/subscriptions"
              payload: { account_id: "${acct}", plan_tier_id: "${tier}", cadence: "MONTHLY", anchor_date: "2026-05-01" }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { sub: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-31T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /sharpening/subscriptions/${sub}/advance-cycle"
              payload: {}
              as: PlatformAdmin
              captures: { ci: $.data.cycle_index }
          assert:
            - "Subscription.${sub}.cycle_index == 2"
            - "Subscription.${sub}.cycle_start_date == 2026-05-31"
            - "Subscription.${sub}.cycle_end_date == 2026-06-30"
            - "Subscription.${sub}.allowance_remaining == 2"
            - "Subscription.${sub}.skip_count_this_cycle == 0"
            - "Subscription.${sub}.next_service_date == 2026-06-26"
            - "GET /sharpening/allowance-entries?subscription_id=${sub} returns total_count == 3 with kinds GRANTED, EXPIRED and GRANTED"

      - name: suspended_account_blocks_item_add_and_reinstatement_restores_it
        claim_type: guarded_transitions
        grounds:
          - state_machines.Account.ACTIVE_to_SUSPENDED
          - state_machines.Account.SUSPENDED_to_ACTIVE
          - validations[priority=9]
          - errors[ERR_ACCOUNT_SUSPENDED]
        distinguishing_aspect: "The rung-9 account gate is symmetric: adding an item to a DRAFT request on a SUSPENDED account answers 409 ERR_ACCOUNT_SUSPENDED, and the identical call succeeds with 201 after reinstatement."
