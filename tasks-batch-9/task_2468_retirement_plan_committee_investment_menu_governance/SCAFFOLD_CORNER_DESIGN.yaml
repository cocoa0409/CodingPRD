            - "Two engagements are registered and benchmarked into ACTIVE: a RECORDKEEPER for 2026-01-01 .. 2027-12-31 and an ADVISOR for the same window. Both benchmarks are legal because Plan.total_plan_assets_cents is non-zero after the fund registrations and neither engagement has been benchmarked in quarter 0 before."
