  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: form8609_issuance_requires_project_set_aside_met
        grounds:
          - state_machines.Building.PRE_ALLOCATION_to_PROVISIONAL_8609
          - state_machines.Project.DRAFT_to_SET_ASIDE_MET
          - validations[priority=11]
          - entities.Project.fields.status
        distinguishing_aspect: |
          Entity pair Building<->Project: Building.PRE_ALLOCATION->PROVISIONAL_8609 is rejected with
          ERR_SET_ASIDE_NOT_MET while the owning Project.status is DRAFT, and succeeds once the Project
          is SET_ASIDE_MET. Building's transition depends on Project's state.
        test_recipe:
          setup:
            - "Project P in DRAFT; Building B (2 total units, 1 AMI_50 designated unit -> FORTY_SIXTY satisfiable) in PRE_ALLOCATION (no set-aside certification yet)."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P", area_median_income_cents: 9600000, minimum_set_aside: "FORTY_SIXTY", placed_in_service_date: "2026-01-01T00:00:00Z" }
              as: OwnerAgent
              captures: { p_id: $.data.id }
            - call: "POST /buildings"
              payload: { project_id: "${p_id}", bin: "B-001", eligible_basis_cents: 100000000, credit_type: "NINE_PERCENT", total_residential_units: 2, total_residential_sqft: 2000 }
              as: OwnerAgent
              captures: { b_id: $.data.id }
            - call: "POST /units"
              payload: { building_id: "${b_id}", unit_number: "U1", bedroom_count: 1, sqft: 1000, utility_allowance_cents: 9000, ami_designation: "AMI_50" }
              as: OwnerAgent
          trigger:
            - call: "POST /buildings/${b_id}/form8609"
              payload: { issuance_type: "PROVISIONAL" }
              as: StateHFA
              captures: { err: $.data.error_id }
            - call: "POST /projects/${p_id}/certify-set-aside"
              payload: {}
              as: StateHFA
            - call: "POST /buildings/${b_id}/form8609"
              payload: { issuance_type: "PROVISIONAL" }
              as: StateHFA
              captures: { ok_status: $.data.status }
          assert:
            - "First form8609 (project DRAFT) returns 409 ERR_SET_ASIDE_NOT_MET"
            - "After certify-set-aside, second form8609 returns 201 and Building.${b_id}.credit_status == PROVISIONAL_8609"

      - name: inspection_close_requires_no_open_findings
        grounds:
          - state_machines.Inspection.CONDUCTED_to_CLOSED
