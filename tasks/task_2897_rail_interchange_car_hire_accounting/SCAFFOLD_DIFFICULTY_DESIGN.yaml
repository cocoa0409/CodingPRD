            - "L4: ReclaimClaim.${claim_id}.status == DISALLOWED, disallow_reason == 'SUPPORTING_EVENT_VOIDED', credit_cents == 0"
            - "L5: SettlementCycle.${cycle_id}.status == REOPENED, reopen_count == 1, gross_hire_cents == 11464, reclaim_credit_cents == 0, pre_fee_net_cents == 11464, clearinghouse_fee_cents == 57, net_settlement_cents == 11407"
            - "L5: a CORRECTION_ADJUSTMENT HireLedgerEntry of +2843 exists for movement ${mv_id} in cycle ${cycle_id}, and the SETTLEMENT_PAYMENT of -8578 has been reversed by a CORRECTION_ADJUSTMENT of +8578"
            - "L5: GET /car-hire/railroads/${bn_id}/exposure returns exposure_cents == 11464 and open_movement_count == 0"

      - name: wrong_junction_empty_return_cascades_to_obligation_penalty_and_reclaim_lock
        grounds:
          - state_machines.Car.routing_status
          - calculations.reverse_route_penalty
          - calculations.hire_time_component
          - global_constants.REVERSE_ROUTE_PENALTY_PCT
          - entities.CarHireMovement.fields.reverse_route_penalty_cents
          - entities.CarHireMovement.fields.reclaim_locked
          - entities.Car.fields.prescribed_return_junction_id
        distinguishing_aspect: |
          A single POST /car-hire/interchange-events — an EMPTY return at JCT-STL when
          the standing obligation prescribed JCT-CHI — cascades four levels: L1 the
          movement closes at 50.00 chargeable hours / 3 days / 7800, L2 the car's
          routing_status flips OBLIGATION_ACTIVE -> OBLIGATION_VIOLATED, L3 a
          reverse_route_penalty_cents of 1950 (= round_half_up(7800 * 0.25)) is added so
          net_hire_cents becomes 9750, and L4 the movement is marked
          reclaim_locked = true so no reclaim can shrink the penalised segment. The
          identical trip returned at JCT-CHI instead yields OBLIGATION_MET, penalty 0,
          net 7800 and reclaim_locked false — the falsifiable contrast. Note the penalty
          is 25% of the TIME component only, not of gross_hire_cents, and the movement is
          EMPTY so no mileage is charged.
