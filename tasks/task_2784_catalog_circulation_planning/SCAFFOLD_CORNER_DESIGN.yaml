          assert:
            - "CirculationLine.${line_a}: status ALLOCATED, mailable_quantity 20000, forecast_demand_cents 22940000 (floor(20000 * 620 / 10000) == 1240 orders at 18500), gross_margin_cents 9634800, circulation_cost_cents 4720000, contribution_cents 4914800"
            - "CirculationLine.${line_b}.status == VOIDED with contribution_cents 0 and CirculationLine.${line_c}.status == PROPOSED with contribution_cents 0"
            - "${p_status} == COSTED and ${p_costed_by} == u-planner-1"
            - "${p_cost} == 4720000, ${p_demand} == 22940000 and ${p_contrib} == 4914800  # the VOIDED line and the PROPOSED line on drop 2 are both excluded"
            - "${p_contrib} == 4914800 is the sum of the already-rounded per-line contributions, not a contribution recomputed from ${p_demand}"
            - "${r_cost} == ${p_cost}, ${r_demand} == ${p_demand} and ${r_contrib} == ${p_contrib}  # the computed read agrees with the stored roll-up"
