            - "The conference is DECISIONS_RELEASED. A1..A5 are CONFIRMED; A6 is deliberately left ACCEPTED."
            - "Session S1: chair Cho, theme_code oncology, format ORAL, room R1, 2026-09-01T09:00:00Z .. 2026-09-01T11:00:00Z, capacity_slots 2, cme_designated false, status PLANNED."
