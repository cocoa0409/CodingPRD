              as: Merchant
              as_user_id: "${merchant_id}"
              captures: { reserved_after_verify: $.data.inventory_reserved, redeemed_after_verify: $.data.inventory_redeemed, sold_out_after_verify: $.data.sold_out }
            - call: "POST /perks/redemptions"
              payload: { offer_id: "${offer_id}", membership_id: "${membership_id}", intended_gross_amount_cents: 5000 }
              as: Employee
              as_user_id: "${membership_id}"
              captures: { r4_id: $.data.id }
            - call: "GET /perks/offers/${offer_id}"
              payload: {}
              as: Merchant
              as_user_id: "${merchant_id}"
              captures: { reserved_final: $.data.inventory_reserved, redeemed_final: $.data.inventory_redeemed, sold_out_final: $.data.sold_out }
          assert:
            - "${reserved_full} == 3, ${redeemed_full} == 0 and ${sold_out_full} == true"
            - "${sold_out_error} == ERR_OFFER_SOLD_OUT with HTTP 409"
            - "${r1_status} == VOID and ${r1_void_reason} == MEMBER_CANCELLED"
            - "${reserved_after_void} == 2, ${redeemed_after_void} == 0 and ${sold_out_after_void} == false: exactly one unit came back"
            - "${r2_status} == VERIFIED"
            - "${reserved_after_verify} == 1, ${redeemed_after_verify} == 1 and ${sold_out_after_verify} == false: verification moved a unit between counters and left the sum at 2"
            - "${reserved_final} == 2, ${redeemed_final} == 1 and ${sold_out_final} == true: the freed unit was re-issued and the pool is exactly full again"
            - "Redemption.${r4_id}.verification_status == PENDING"
            - "Redemption.${r3_id}.verification_status == PENDING, never touched by the void or the verification"
