          Conserved quantity: education-credit points. Submit (posts PROVISIONAL +60
          and REDEMPTION -600) followed by cancel (posts REVERSAL +600 and REVERSAL
          -60) returns SalonAccount.education_credit_points to exactly the pre-order
          value 1000, and the signed ledger sum always equals the stored balance.
