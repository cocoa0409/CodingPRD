          setup: ["Locality; ACTIVE crossing; OPEN program pool 100000; project cost 600000 nominated to ELIGIBLE"]
          setup_api_calls:
            - call: "POST /localities"
              payload: { locality_name: "Broke City", state_code: "KS", contact_email: "pw@broke.gov" }
