          - state_machines.Homesite.occupancy.IN_TURN_to_AVAILABLE
          - entities.Homesite.fields.turn_cycle_count
          - entities.Homesite.fields.last_turn_ready_at
          - calculations.turn_cost_allocation
        distinguishing_aspect: |
          The homesite occupancy dimension re-enters AVAILABLE after a five-state loop
          (AVAILABLE -> LEASED -> NOTICE_GIVEN -> IN_TURN -> AVAILABLE) and the loop's iteration is
          observable only through turn_cycle_count, which reaches 1 while status returns to the exact
