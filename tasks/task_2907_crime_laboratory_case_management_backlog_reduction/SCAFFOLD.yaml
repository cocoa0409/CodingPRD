    roles: [LabDirector]
    code: 200
    input: [status, "suspension_reason?"]
    output: Vendor
    side_effects: ["status toggled between ACTIVE and SUSPENDED", "existing AWARDED and AT_VENDOR engagements are untouched and keep occupying both capacity and encumbrance", "increments Vendor.version by 1"]

  # ---------------------------------------------------------------- cases
  - method: POST
    path: "/lab/cases"
    description: "Submit a case for laboratory examination; the priority score and queue class are computed at intake"
    roles: [EvidenceTechnician]
    code: 201
    input: [agency_case_number, submitting_agency, offense_category, "suspect_in_custody?", "statutory_deadline_utc?", "court_date_utc?"]
    output: Case
    side_effects: ["received_at_utc stamped from the logical clock", "violent_crime_flag, priority_score and priority_class computed per calculations.case_priority_scoring", "workflow_status SUBMITTED and discovery_status NONE"]
  - method: POST
    path: "/lab/cases/{case_id}/accept"
    description: "Accept a submitted case into the laboratory's workload once its evidence is logged and every seal is intact"
    roles: [EvidenceTechnician]
    code: 200
    input: ["acceptance_note?"]
    output: Case
    side_effects: ["workflow_status SUBMITTED -> ACCEPTED, accepted_at_utc stamped", "requires at least one EvidenceItem on the case and seal_intact true on every one of them", "increments Case.version by 1"]
  - method: POST
    path: "/lab/cases/{case_id}/reject"
    description: "Refuse a submitted case at intake and return its evidence"
    roles: [EvidenceTechnician]
    code: 200
    input: [rejection_reason]
    output: Case
    side_effects: ["workflow_status SUBMITTED -> REJECTED (terminal)", "cascade: every EvidenceItem of the case still IN_VAULT -> RETURNED", "no ExaminationRequest may ever be created for the case", "increments Case.version by 1"]
  - method: POST
    path: "/lab/cases/{case_id}/priority-overrides"
    description: "Record a director override of the derived queue class; each override supersedes the previous one. Carries the optimistic-concurrency check on the case."
    roles: [LabDirector]
    code: 200
    input: [priority_override_class, priority_override_reason, expected_case_version]
    output: Case
    side_effects: ["priority_override_class and priority_override_reason replaced", "priority_class re-derived per calculations.case_priority_scoring with the override winning", "priority_score is NOT recomputed", "the case's open requests are re-weighted in the backlog index on the next read", "increments Case.version by 1"]
  - method: POST
    path: "/lab/cases/{case_id}/report"
    description: "Release the case report once every examination request is terminal and at least one was released; computes both turnaround variants"
    roles: [CaseManager]
    code: 200
    input: ["report_note?"]
    output: Case
    side_effects: ["workflow_status IN_PROGRESS -> REPORTED (terminal), reported_at_utc stamped", "gross_turnaround_days and net_turnaround_days computed per calculations.case_turnaround_variants", "requires open_examination_request_count == 0 and released_examination_request_count >= 1", "increments Case.version by 1"]
  - method: POST
    path: "/lab/cases/{case_id}/discovery-request"
    description: "Log a discovery request served on the laboratory; the discovery axis moves independently of the casework axis"
    roles: [CaseManager]
    code: 200
    input: [discovery_requesting_party]
    output: Case
    side_effects: ["discovery_status NONE -> RECEIVED, discovery_requested_at_utc stamped", "discovery_due_utc set to discovery_requested_at_utc + DISCOVERY_RESPONSE_DAYS days", "workflow_status is unchanged", "increments Case.version by 1"]
  - method: POST
    path: "/lab/cases/{case_id}/discovery-response"
    description: "Fulfil or deny a received discovery request"
    roles: [CaseManager]
    code: 200
    input: [decision, "response_note?"]
    output: Case
    side_effects: ["discovery_status RECEIVED -> FULFILLED when decision is FULFILL, or RECEIVED -> DENIED when decision is DENY (which requires a non-empty response_note)", "a DEADLINE_MISS Nonconformance of severity MAJOR is opened when the response is recorded after discovery_due_utc", "workflow_status is unchanged", "increments Case.version by 1"]

  # ---------------------------------------------------------------- evidence
  - method: POST
    path: "/lab/evidence-items"
    description: "Log a physical item into the vault under a submitted case"
    roles: [EvidenceTechnician]
    code: 201
    input: [case_id, item_number, item_description, item_type, seal_intact]
    output: EvidenceItem
    side_effects: ["custody_status initialised to IN_VAULT, checkout_count to 0, logged_at_utc stamped", "requires case.workflow_status == SUBMITTED"]
  - method: POST
    path: "/lab/evidence-items/{evidence_item_id}/return"
    description: "Release an item from the vault back to the submitting agency once its case is closed out"
    roles: [EvidenceTechnician]
    code: 200
    input: ["return_note?"]
    output: EvidenceItem
    side_effects: ["custody_status IN_VAULT -> RETURNED (terminal)", "requires case.workflow_status IN {REPORTED, REJECTED}", "increments EvidenceItem.version by 1"]

  # ---------------------------------------------------------------- casework
  - method: POST
    path: "/lab/examination-requests"
    description: "Raise an examination request for one evidence item under one validated method; the request enters that discipline's queue"
    roles: [CaseManager]
    code: 201
    input: [case_id, evidence_item_id, method_id, item_count]
    output: ExaminationRequest
    side_effects: ["discipline copied from the method, estimated_hours computed per calculations.exam_request_hour_estimate", "status QUEUED, revision_round 0, requested_at_utc stamped", "CASE_RECOMPUTE(case): ACCEPTED -> AWAITING_ASSIGNMENT on the first request, open_examination_request_count refreshed"]
  - method: POST
    path: "/lab/examination-requests/{examination_request_id}/assignments"
    description: "Assign or reassign a named examiner to a queued or already-assigned request. Carries the optimistic-concurrency check on the request."
    roles: [CaseManager]
    code: 201
    input: [analyst_id, expected_examination_request_version, "assignment_reason?"]
    output: Assignment
    side_effects: ["request QUEUED -> ASSIGNED, or ASSIGNED -> ASSIGNED on reassignment", "on reassignment the incumbent ACTIVE Assignment -> SUPERSEDED with superseded_by_assignment_id set to the new row and the outgoing analyst's assigned_casework_hours decremented by exactly the snapshotted estimated_hours", "the incoming holder's assigned_casework_hours incremented by request.estimated_hours", "assigned_analyst_id set to the incoming analyst", "CASE_RECOMPUTE(case)", "increments ExaminationRequest.version by 1"]
  - method: POST
    path: "/lab/examination-requests/{examination_request_id}/auto-assign"
    description: "Let the workload balancer choose the least-utilised eligible examiner for a queued request per calculations.analyst_selection_ranking"
    roles: [CaseManager]
    code: 201
    input: []
    output: Assignment
    side_effects: ["a new Assignment with assignment_reason AUTO_BALANCED and status ACTIVE", "request QUEUED -> ASSIGNED and assigned_analyst_id set", "the selected analyst's assigned_casework_hours incremented by request.estimated_hours", "CASE_RECOMPUTE(case)", "an empty candidate pool creates nothing, leaves the request QUEUED and returns ERR_NO_ELIGIBLE_ANALYST", "increments ExaminationRequest.version by 1"]
  - method: POST
    path: "/lab/examination-requests/{examination_request_id}/start-analysis"
    description: "The holding examiner begins bench work; the evidence item is checked out of the vault"
    roles: [Analyst]
    code: 200
    input: []
    output: ExaminationRequest
    side_effects: ["status ASSIGNED -> IN_ANALYSIS", "requires X-User-ID == assigned_analyst_id, the method VALIDATED with validation_expires_at_utc strictly after the logical clock, and the evidence item IN_VAULT with seal_intact true", "cascade: evidence item IN_VAULT -> IN_ANALYSIS with checkout_count incremented", "increments ExaminationRequest.version by 1"]
  - method: POST
    path: "/lab/examination-requests/{examination_request_id}/complete-analysis"
    description: "The holding examiner reports hours, dispositions the evidence and submits the work for technical review"
    roles: [Analyst]
    code: 200
    input: [actual_hours, "evidence_consumed?"]
    output: ExaminationRequest
    side_effects: ["status IN_ANALYSIS -> TECH_REVIEW, actual_hours_logged recorded (changing the REALIZED_LOGGED workload variant only)", "the ACTIVE Assignment -> COMPLETED and the holder's assigned_casework_hours decremented by exactly the snapshotted estimated_hours - the request leaves ER_HOLD_SET so the committed-hours invariant still balances", "cascade: evidence item IN_ANALYSIS -> IN_VAULT, or -> CONSUMED when evidence_consumed is true and the method is consumptive", "increments ExaminationRequest.version by 1"]
  - method: POST
    path: "/lab/examination-requests/{examination_request_id}/technical-review"
    description: "A second qualified examiner concurs with or disputes the technical conclusions; writes an immutable ReviewRecord"
    roles: [Analyst]
    code: 201
    input: [decision, rationale]
    output: ReviewRecord
    side_effects: ["a ReviewRecord with review_type TECHNICAL, reviewer_analyst_id from X-User-ID and revision_round_snapshot copied from the request", "request TECH_REVIEW -> ADMIN_REVIEW when decision is AGREE", "request TECH_REVIEW -> DISAGREEMENT when decision is DISAGREE, which opens a TECHNICAL_DISAGREEMENT Nonconformance of severity MAJOR against the assigned analyst, moves that analyst QUALIFIED -> PROBATION and runs PROBATION_RELEASE on their P1/P2 casework", "requires X-User-ID != assigned_analyst_id", "increments ExaminationRequest.version by 1"]
  - method: POST
    path: "/lab/examination-requests/{examination_request_id}/disagreement-resolution"
    description: "Quality resolves a technical disagreement in favour of the examiner or the reviewer; writes an immutable ReviewRecord"
    roles: [QualityManager]
    code: 201
    input: [decision, rationale]
    output: ReviewRecord
    side_effects: ["a ReviewRecord with review_type DISAGREEMENT_RESOLUTION and reviewer_operator_id from X-User-ID", "decision UPHOLD_ANALYST: request DISAGREEMENT -> ADMIN_REVIEW, the TECHNICAL_DISAGREEMENT finding -> VOIDED and the implicated analyst PROBATION -> QUALIFIED when no other finding remains open", "decision UPHOLD_REVIEWER: revision_round incremented and REOPEN_HOLD decides between DISAGREEMENT -> IN_ANALYSIS (holder still eligible, hours re-encumbered) and DISAGREEMENT -> QUEUED (holder no longer eligible)", "increments ExaminationRequest.version by 1"]
  - method: POST
    path: "/lab/examination-requests/{examination_request_id}/administrative-review"
    description: "Administrative review either releases the report or returns the file for revision; writes an immutable ReviewRecord"
    roles: [CaseManager]
    code: 201
    input: [decision, rationale]
    output: ReviewRecord
    side_effects: ["a ReviewRecord with review_type ADMINISTRATIVE and reviewer_operator_id from X-User-ID", "decision APPROVE: request ADMIN_REVIEW -> RELEASED, released_at_utc stamped, CASE_RECOMPUTE refreshes open_examination_request_count and released_examination_request_count", "decision RETURN: revision_round incremented and REOPEN_HOLD decides between ADMIN_REVIEW -> IN_ANALYSIS and ADMIN_REVIEW -> QUEUED", "requires X-User-ID to differ from the technical reviewer of the same revision_round", "increments ExaminationRequest.version by 1"]

  # ---------------------------------------------------------------- outsourcing
  - method: POST
    path: "/lab/examination-requests/{examination_request_id}/vendor-engagements"
