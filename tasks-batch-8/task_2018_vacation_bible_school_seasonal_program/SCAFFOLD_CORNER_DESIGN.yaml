            - { call: "POST /vbs/attendance/check-in", payload: { child_id: "${k1}", program_day_id: "${day1}" }, as: CheckInStaff, as_user_id: "desk-1", captures: { tag1: $.data.tag_code } }
            - { call: "POST /vbs/attendance/check-in", payload: { child_id: "${k2}", program_day_id: "${day1}" }, as: CheckInStaff, as_user_id: "desk-1", captures: { tag2: $.data.tag_code } }
          trigger:
            - { call: "POST /vbs/_clock/set_current_utc", payload: { to_iso8601: "2026-08-17T12:00:00Z" }, as: ProgramDirector }
            - { call: "POST /vbs/attendance/check-out", payload: { child_id: "${k1}", program_day_id: "${day1}", tag_code: "${tag1}", pickup_person: "Maria Alvarez" }, as: CheckInStaff, as_user_id: "desk-1", captures: { late1: $.data.late_pickup } }
            - { call: "POST /vbs/_clock/set_current_utc", payload: { to_iso8601: "2026-08-17T12:00:01Z" }, as: ProgramDirector }
            - { call: "POST /vbs/attendance/check-out", payload: { child_id: "${k2}", program_day_id: "${day1}", tag_code: "${tag2}", pickup_person: "Maria Alvarez" }, as: CheckInStaff, as_user_id: "desk-1", captures: { late2: $.data.late_pickup } }
          assert:
            - "${late1} == false  (exactly AT the 12:00 cutoff: strict > means not late)"
            - "${late2} == true   (one second past the cutoff is late)"

  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: request_with_undeclared_role_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "An X-User-Role value that is not a declared role fails P1 authentication with 401 ERR_UNAUTHENTICATED before any authorization or existence check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /vbs/programs", payload: {}, as: SuperUser, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_UNAUTHENTICATED and http status == 401"
      - name: parent_create_classroom_returns_forbidden
        claim_type: violation_to_error
        grounds:
          - validations[priority=2]
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "Parent is not in the roles list for POST /vbs/classrooms; the request dies at P2 with 403 ERR_FORBIDDEN even though the payload is otherwise well-formed."
        test_recipe:
          setup: ["Program Alpha DRAFT; family F ACTIVE"]
          setup_api_calls:
            - { call: "POST /vbs/programs", payload: { name: "VBS Alpha", program_year: 2026, start_date: "2026-08-17", end_date: "2026-08-21", registration_opens_at: "2026-07-15T00:00:00Z", registration_closes_at: "2026-08-15T23:59:59Z", supply_budget_cents: 100000 }, as: ProgramDirector, captures: { prog_id: $.data.id } }
            - { call: "POST /vbs/families", payload: { household_name: "Alvarez", primary_contact_name: "Maria Alvarez", email: "alvarez@example.com", phone: "555-0101" }, as: Anonymous, captures: { fam_id: $.data.id } }
          trigger:
            - { call: "POST /vbs/classrooms", payload: { program_id: "${prog_id}", name: "Koalas", age_min: 4, age_max: 6, capacity: 10 }, as: Parent, as_user_id: "${fam_id}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FORBIDDEN and http status == 403"
      - name: message_classroom_audience_missing_required_classroom_id
        claim_type: violation_to_error
        grounds:
          - validations[priority=0]
          - entities.FamilyMessage.fields.classroom_id
        distinguishing_aspect: "Conditional required field: audience == CLASSROOM without classroom_id fails P0 with ERR_INVALID_REQUEST at creation time."
        test_recipe:
          setup: ["Program Alpha DRAFT"]
          setup_api_calls:
            - { call: "POST /vbs/programs", payload: { name: "VBS Alpha", program_year: 2026, start_date: "2026-08-17", end_date: "2026-08-21", registration_opens_at: "2026-07-15T00:00:00Z", registration_closes_at: "2026-08-15T23:59:59Z", supply_budget_cents: 100000 }, as: ProgramDirector, captures: { prog_id: $.data.id } }
          trigger:
            - { call: "POST /vbs/messages", payload: { program_id: "${prog_id}", subject: "Koalas update", body: "Bring smocks", audience: "CLASSROOM" }, as: ProgramDirector, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
      - name: duplicate_registration_same_program_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - errors[ERR_DUPLICATE_REGISTRATION]
        distinguishing_aspect: "One active registration per child per program: the child already ENROLLED in Koalas cannot also register into Bears (same program), even though his age fits both bands."
        test_recipe:
          setup: ["Program Alpha REGISTRATION_OPEN; Koalas and Bears (both ages 4-6, cap 10); child k1 ENROLLED in Koalas"]
          setup_api_calls:
            - { call: "POST /vbs/programs", payload: { name: "VBS Alpha", program_year: 2026, start_date: "2026-08-17", end_date: "2026-08-21", registration_opens_at: "2026-07-15T00:00:00Z", registration_closes_at: "2026-08-15T23:59:59Z", supply_budget_cents: 100000, child_staff_ratio: 4 }, as: ProgramDirector, captures: { prog_id: $.data.id } }
            - { call: "POST /vbs/classrooms", payload: { program_id: "${prog_id}", name: "Koalas", age_min: 4, age_max: 6, capacity: 10 }, as: RegistrationCoordinator, captures: { cls_k: $.data.id } }
            - { call: "POST /vbs/classrooms", payload: { program_id: "${prog_id}", name: "Bears", age_min: 4, age_max: 6, capacity: 10 }, as: RegistrationCoordinator, captures: { cls_b: $.data.id } }
            - { call: "POST /vbs/programs/${prog_id}/open-registration", payload: {}, as: ProgramDirector }
            - { call: "POST /vbs/families", payload: { household_name: "Alvarez", primary_contact_name: "Maria Alvarez", email: "alvarez@example.com", phone: "555-0101" }, as: Anonymous, captures: { fam_id: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kid", last_name: "A", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN" }, as: Parent, as_user_id: "${fam_id}", captures: { k1: $.data.id } }
            - { call: "POST /vbs/registrations", payload: { child_id: "${k1}", classroom_id: "${cls_k}" }, as: Parent, as_user_id: "${fam_id}" }
          trigger:
            - { call: "POST /vbs/registrations", payload: { child_id: "${k1}", classroom_id: "${cls_b}" }, as: Parent, as_user_id: "${fam_id}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_DUPLICATE_REGISTRATION"
      - name: duplicate_family_email_rejected
        claim_type: violation_to_error
        grounds:
          - entities.Family.fields.email
          - errors[ERR_DUPLICATE_EMAIL]
        distinguishing_aspect: "Family email is globally unique (including archived families); the second create with the same address fails with ERR_DUPLICATE_EMAIL (409)."
        test_recipe:
          setup: ["Family F1 ACTIVE with email alvarez@example.com"]
          setup_api_calls:
            - { call: "POST /vbs/families", payload: { household_name: "Alvarez", primary_contact_name: "Maria Alvarez", email: "alvarez@example.com", phone: "555-0101" }, as: Anonymous }
          trigger:
            - { call: "POST /vbs/families", payload: { household_name: "Alvarez Two", primary_contact_name: "Jo Alvarez", email: "alvarez@example.com", phone: "555-0199" }, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_DUPLICATE_EMAIL"
      - name: duplicate_active_check_type_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DUPLICATE_CHECK]
        distinguishing_aspect: "A volunteer may hold only one active (SUBMITTED/INFO_REQUESTED/CLEARED) check per type; a second BACKGROUND while the first is SUBMITTED fails with ERR_DUPLICATE_CHECK."
        test_recipe:
          setup: ["Program Alpha DRAFT; volunteer v1 with a SUBMITTED BACKGROUND check"]
          setup_api_calls:
            - { call: "POST /vbs/programs", payload: { name: "VBS Alpha", program_year: 2026, start_date: "2026-08-17", end_date: "2026-08-21", registration_opens_at: "2026-07-15T00:00:00Z", registration_closes_at: "2026-08-15T23:59:59Z", supply_budget_cents: 100000 }, as: ProgramDirector, captures: { prog_id: $.data.id } }
            - { call: "POST /vbs/volunteers", payload: { program_id: "${prog_id}", full_name: "Vera One", email: "vera1@example.com", phone: "555-0201", birth_date: "1990-05-20" }, as: Anonymous, captures: { v1: $.data.id } }
            - { call: "POST /vbs/screening-checks", payload: { volunteer_id: "${v1}", check_type: "BACKGROUND" }, as: Volunteer, as_user_id: "${v1}" }
          trigger:
            - { call: "POST /vbs/screening-checks", payload: { volunteer_id: "${v1}", check_type: "BACKGROUND" }, as: Volunteer, as_user_id: "${v1}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_DUPLICATE_CHECK"
      - name: cross_program_distribution_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - errors[ERR_CROSS_PROGRAM_REFERENCE]
        distinguishing_aspect: "A distribution whose item belongs to program A but whose classroom and day belong to program B is rejected with ERR_CROSS_PROGRAM_REFERENCE (single-program consistency of the three FKs)."
        test_recipe:
          setup:
            - "Program A (2026-08-17..21) with SupplyItem item_a; Program B (2026-08-24..28, non-overlapping) with classroom cls_b and day day_b (2026-08-24)"
          setup_api_calls:
            - { call: "POST /vbs/programs", payload: { name: "VBS Alpha", program_year: 2026, start_date: "2026-08-17", end_date: "2026-08-21", registration_opens_at: "2026-07-15T00:00:00Z", registration_closes_at: "2026-08-15T23:59:59Z", supply_budget_cents: 100000 }, as: ProgramDirector, captures: { prog_a: $.data.id } }
            - { call: "POST /vbs/supply-items", payload: { program_id: "${prog_a}", name: "Glue Packs", category: "CRAFT", unit: "pack", quantity_on_hand: 5 }, as: ProgramDirector, captures: { item_a: $.data.id } }
            - { call: "POST /vbs/programs", payload: { name: "VBS Beta", program_year: 2026, start_date: "2026-08-24", end_date: "2026-08-28", registration_opens_at: "2026-07-15T00:00:00Z", registration_closes_at: "2026-08-15T23:59:59Z", supply_budget_cents: 50000 }, as: ProgramDirector, captures: { prog_b: $.data.id } }
            - { call: "POST /vbs/classrooms", payload: { program_id: "${prog_b}", name: "Bears", age_min: 7, age_max: 9, capacity: 10 }, as: RegistrationCoordinator, captures: { cls_b: $.data.id } }
            - { call: "POST /vbs/days", payload: { program_id: "${prog_b}", date: "2026-08-24" }, as: ProgramDirector, captures: { day_b: $.data.id } }
          trigger:
            - { call: "POST /vbs/supply-distributions", payload: { supply_item_id: "${item_a}", classroom_id: "${cls_b}", program_day_id: "${day_b}", quantity: 1 }, as: ProgramDirector, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_CROSS_PROGRAM_REFERENCE"
      - name: insufficient_stock_at_zero_available
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_INSUFFICIENT_STOCK]
          - entities.SupplyItem.fields.available_quantity
        distinguishing_aspect: "available_quantity == quantity_on_hand - reserved_quantity; with on_hand 3 fully reserved, a further quantity-1 distribution fails with ERR_INSUFFICIENT_STOCK (boundary: quantity 3 would still pass, 4 fails)."
        test_recipe:
          setup: ["Program Alpha DRAFT; Koalas; day 2026-08-17; item on_hand 3 with a PLANNED distribution of 3 (available 0)"]
          setup_api_calls:
            - { call: "POST /vbs/programs", payload: { name: "VBS Alpha", program_year: 2026, start_date: "2026-08-17", end_date: "2026-08-21", registration_opens_at: "2026-07-15T00:00:00Z", registration_closes_at: "2026-08-15T23:59:59Z", supply_budget_cents: 100000 }, as: ProgramDirector, captures: { prog_id: $.data.id } }
            - { call: "POST /vbs/classrooms", payload: { program_id: "${prog_id}", name: "Koalas", age_min: 4, age_max: 6, capacity: 10 }, as: RegistrationCoordinator, captures: { cls_k: $.data.id } }
            - { call: "POST /vbs/days", payload: { program_id: "${prog_id}", date: "2026-08-17" }, as: ProgramDirector, captures: { day1: $.data.id } }
            - { call: "POST /vbs/supply-items", payload: { program_id: "${prog_id}", name: "Glue Packs", category: "CRAFT", unit: "pack", quantity_on_hand: 3 }, as: ProgramDirector, captures: { item: $.data.id } }
            - { call: "POST /vbs/supply-distributions", payload: { supply_item_id: "${item}", classroom_id: "${cls_k}", program_day_id: "${day1}", quantity: 3 }, as: ProgramDirector }
          trigger:
            - { call: "POST /vbs/supply-distributions", payload: { supply_item_id: "${item}", classroom_id: "${cls_k}", program_day_id: "${day1}", quantity: 1 }, as: ProgramDirector, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INSUFFICIENT_STOCK"
            - "SupplyItem.${item}.quantity_on_hand == 3 and reserved_quantity == 3 (failed reservation changed nothing)"
      - name: allergen_conflict_rejected_and_clean_item_passes
        claim_type: violation_to_error
        grounds:
          - calculations.allergen_safety_check
          - errors[ERR_ALLERGEN_CONFLICT]
        distinguishing_aspect: "A SNACK item tagged PEANUT cannot be distributed to a classroom where an ENROLLED child holds an APPROVED FOOD_ALLERGY plan listing PEANUT; a disjoint tag (GLUTEN) on the same day and classroom passes."
        test_recipe:
          setup:
            - "Program Alpha REGISTRATION_OPEN; Koalas (cap 10) with child k1 ENROLLED; k1 holds an APPROVED FOOD_ALLERGY plan with allergens [PEANUT]; day 2026-08-17 SCHEDULED"
          setup_api_calls:
            - { call: "POST /vbs/programs", payload: { name: "VBS Alpha", program_year: 2026, start_date: "2026-08-17", end_date: "2026-08-21", registration_opens_at: "2026-07-15T00:00:00Z", registration_closes_at: "2026-08-15T23:59:59Z", supply_budget_cents: 100000, child_staff_ratio: 4 }, as: ProgramDirector, captures: { prog_id: $.data.id } }
            - { call: "POST /vbs/classrooms", payload: { program_id: "${prog_id}", name: "Koalas", age_min: 4, age_max: 6, capacity: 10 }, as: RegistrationCoordinator, captures: { cls_k: $.data.id } }
            - { call: "POST /vbs/days", payload: { program_id: "${prog_id}", date: "2026-08-17" }, as: ProgramDirector, captures: { day1: $.data.id } }
            - { call: "POST /vbs/programs/${prog_id}/open-registration", payload: {}, as: ProgramDirector }
            - { call: "POST /vbs/families", payload: { household_name: "Alvarez", primary_contact_name: "Maria Alvarez", email: "alvarez@example.com", phone: "555-0101" }, as: Anonymous, captures: { fam_id: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kid", last_name: "A", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN", has_special_needs: true }, as: Parent, as_user_id: "${fam_id}", captures: { k1: $.data.id, k1_v: $.data.version } }
            - { call: "POST /vbs/registrations", payload: { child_id: "${k1}", classroom_id: "${cls_k}" }, as: Parent, as_user_id: "${fam_id}" }
            - { call: "POST /vbs/accommodation-plans", payload: { child_id: "${k1}", severity: "FOOD_ALLERGY", allergens: ["PEANUT"], instructions: "No peanut snacks" }, as: Parent, as_user_id: "${fam_id}", captures: { plan1: $.data.id } }
            - { call: "POST /vbs/accommodation-plans/${plan1}/submit", payload: {}, as: Parent, as_user_id: "${fam_id}" }
            - { call: "POST /vbs/accommodation-plans/${plan1}/approve", payload: { expected_child_version: "${k1_v}" }, as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /vbs/supply-items", payload: { program_id: "${prog_id}", name: "Peanut Crackers", category: "SNACK", unit: "box", quantity_on_hand: 5, allergen_tags: ["PEANUT"] }, as: ProgramDirector, captures: { item_p: $.data.id } }
            - { call: "POST /vbs/supply-items", payload: { program_id: "${prog_id}", name: "Rice Cakes", category: "SNACK", unit: "box", quantity_on_hand: 5, allergen_tags: ["GLUTEN"] }, as: ProgramDirector, captures: { item_g: $.data.id } }
          trigger:
            - { call: "POST /vbs/supply-distributions", payload: { supply_item_id: "${item_p}", classroom_id: "${cls_k}", program_day_id: "${day1}", quantity: 1 }, as: ProgramDirector, captures: { err: $.data.error_id } }
            - { call: "POST /vbs/supply-distributions", payload: { supply_item_id: "${item_g}", classroom_id: "${cls_k}", program_day_id: "${day1}", quantity: 1 }, as: ProgramDirector, captures: { ok_status: $.data.status } }
          assert:
            - "${err} == ERR_ALLERGEN_CONFLICT  (intersection {PEANUT} with the classroom's blocked set is non-empty)"
            - "${ok_status} == PLANNED  (disjoint allergen sets pass the safety check)"
      - name: classroom_close_with_enrolled_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CLASSROOM_NOT_EMPTY]
          - state_machines.Classroom.ACCEPTING_to_CLOSED
        distinguishing_aspect: "Close is blocked while enrolled_count > 0: with one enrollee the close fails with ERR_CLASSROOM_NOT_EMPTY and the classroom stays ACCEPTING."
        test_recipe:
          setup: ["Program Alpha REGISTRATION_OPEN; Koalas (cap 2) with 1 ENROLLED child"]
          setup_api_calls:
            - { call: "POST /vbs/programs", payload: { name: "VBS Alpha", program_year: 2026, start_date: "2026-08-17", end_date: "2026-08-21", registration_opens_at: "2026-07-15T00:00:00Z", registration_closes_at: "2026-08-15T23:59:59Z", supply_budget_cents: 100000, child_staff_ratio: 4 }, as: ProgramDirector, captures: { prog_id: $.data.id } }
            - { call: "POST /vbs/classrooms", payload: { program_id: "${prog_id}", name: "Koalas", age_min: 4, age_max: 6, capacity: 2 }, as: RegistrationCoordinator, captures: { cls_k: $.data.id } }
            - { call: "POST /vbs/programs/${prog_id}/open-registration", payload: {}, as: ProgramDirector }
            - { call: "POST /vbs/families", payload: { household_name: "Alvarez", primary_contact_name: "Maria Alvarez", email: "alvarez@example.com", phone: "555-0101" }, as: Anonymous, captures: { fam_id: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kid", last_name: "A", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN" }, as: Parent, as_user_id: "${fam_id}", captures: { ka: $.data.id } }
            - { call: "POST /vbs/registrations", payload: { child_id: "${ka}", classroom_id: "${cls_k}" }, as: Parent, as_user_id: "${fam_id}" }
          trigger:
            - { call: "POST /vbs/classrooms/${cls_k}/close", payload: {}, as: RegistrationCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_CLASSROOM_NOT_EMPTY"
            - "Classroom.${cls_k}.status == ACCEPTING"
      - name: patch_capacity_below_enrolled_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CAPACITY_BELOW_ENROLLED]
          - concurrency_rules[classroom-config-stale-update]
        distinguishing_aspect: "With a CURRENT expected_classroom_version (OCC passes), shrinking capacity from 2 to 1 while enrolled_count == 2 fails with ERR_CAPACITY_BELOW_ENROLLED — a business rule, not a stale-version error."
        test_recipe:
          setup: ["Program Alpha REGISTRATION_OPEN; Koalas (cap 2) FULL with 2 ENROLLED children"]
          setup_api_calls:
            - { call: "POST /vbs/programs", payload: { name: "VBS Alpha", program_year: 2026, start_date: "2026-08-17", end_date: "2026-08-21", registration_opens_at: "2026-07-15T00:00:00Z", registration_closes_at: "2026-08-15T23:59:59Z", supply_budget_cents: 100000, child_staff_ratio: 4 }, as: ProgramDirector, captures: { prog_id: $.data.id } }
            - { call: "POST /vbs/classrooms", payload: { program_id: "${prog_id}", name: "Koalas", age_min: 4, age_max: 6, capacity: 2 }, as: RegistrationCoordinator, captures: { cls_k: $.data.id } }
            - { call: "POST /vbs/programs/${prog_id}/open-registration", payload: {}, as: ProgramDirector }
            - { call: "POST /vbs/families", payload: { household_name: "Alvarez", primary_contact_name: "Maria Alvarez", email: "alvarez@example.com", phone: "555-0101" }, as: Anonymous, captures: { fam_id: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kid", last_name: "A", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN" }, as: Parent, as_user_id: "${fam_id}", captures: { ka: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kid", last_name: "B", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN" }, as: Parent, as_user_id: "${fam_id}", captures: { kb: $.data.id } }
            - { call: "POST /vbs/registrations", payload: { child_id: "${ka}", classroom_id: "${cls_k}" }, as: Parent, as_user_id: "${fam_id}" }
            - { call: "POST /vbs/registrations", payload: { child_id: "${kb}", classroom_id: "${cls_k}" }, as: Parent, as_user_id: "${fam_id}" }
          trigger:
            - { call: "GET /vbs/classrooms/${cls_k}", payload: {}, as: RegistrationCoordinator, captures: { cls_v: $.data.version } }
            - { call: "PATCH /vbs/classrooms/${cls_k}", payload: { capacity: 1, expected_classroom_version: "${cls_v}" }, as: RegistrationCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_CAPACITY_BELOW_ENROLLED  (OCC passed; the business floor rejected the shrink)"
            - "Classroom.${cls_k}.capacity == 2"
      - name: registration_after_window_close_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_REGISTRATION_WINDOW_CLOSED]
        distinguishing_aspect: "The logical clock past registration_closes_at (2026-08-15T23:59:59Z) rejects new registrations with ERR_REGISTRATION_WINDOW_CLOSED even though the program status is still REGISTRATION_OPEN."
        test_recipe:
          setup: ["Program Alpha REGISTRATION_OPEN; Koalas ACCEPTING; logical clock advanced to 2026-08-16T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /vbs/programs", payload: { name: "VBS Alpha", program_year: 2026, start_date: "2026-08-17", end_date: "2026-08-21", registration_opens_at: "2026-07-15T00:00:00Z", registration_closes_at: "2026-08-15T23:59:59Z", supply_budget_cents: 100000, child_staff_ratio: 4 }, as: ProgramDirector, captures: { prog_id: $.data.id } }
