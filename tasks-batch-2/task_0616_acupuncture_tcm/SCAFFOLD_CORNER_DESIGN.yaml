              as: Practitioner
              as_user_id: "${prac}"
              captures: { pl: $.data.id, plv0: $.data.version }
            - call: "POST /dispenses"
              payload: { patient_id: "${pid}", treatment_plan_id: "${pl}", herbal_formula_id: "${f}", doses: 1, expected_treatment_plan_version: "${plv0}" }
