# =============================================================================
# §1.9 Scaffold Corner Design — task_2268
# Breadth walk of references/claim-extraction-guide.md against SCAFFOLD.yaml's
# §1.1–§1.7. Names are unique across this file and SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# Logical clock default: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: create_provider_starts_forfeited_with_zero_score
        claim_type: creation
        grounds:
          - entities.ServiceProviderProfile
          - endpoints.POST_/dmca/providers
        distinguishing_aspect: "A brand-new provider is created with 201 and starts FORFEITED with safe_harbor_score 0 and all three documentation gates false — the client cannot seed a better posture."
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /dmca/providers"
              payload: { legal_name: "Northstar Hosting LLC", service_domain: "northstar.example" }
              as: ComplianceOfficer
              captures: { prov_id: "$.data.id" }
          assert:
            - "response status == 201 and response_type == \"object\""
            - "ServiceProviderProfile.${prov_id}.legal_name == \"Northstar Hosting LLC\""
            - "ServiceProviderProfile.${prov_id}.service_domain == \"northstar.example\""
            - "ServiceProviderProfile.${prov_id}.safe_harbor_status == FORFEITED"
            - "ServiceProviderProfile.${prov_id}.safe_harbor_score == 0"
            - "ServiceProviderProfile.${prov_id}.designated_agent_registered == false"
            - "ServiceProviderProfile.${prov_id}.repeat_infringer_policy_published == false"
            - "ServiceProviderProfile.${prov_id}.public_contact_url == null"
            - "ServiceProviderProfile.${prov_id}.public_contact_published_at == null"
            - "ServiceProviderProfile.${prov_id}.last_audit_at == null"
            - "ServiceProviderProfile.${prov_id}.version == 1"
            - "ServiceProviderProfile.${prov_id}.created_at == \"2026-08-01T00:00:00.000Z\""

      - name: get_rights_holder_returns_stored_quotas_and_counters
        claim_type: retrieval
        grounds:
          - entities.RightsHolder
          - endpoints.GET_/dmca/rights-holders/{id}
        distinguishing_aspect: "The single-resource GET echoes the stored quotas supplied at creation and the untouched program counters, proving no field is recomputed on read."
        test_recipe:
          setup:
            - "One RightsHolder created with explicit reference_file_quota 3 and daily_item_quota 750."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /dmca/rights-holders"
              payload: { legal_name: "Orbit Records LLC", contact_email: "legal@orbit.example", reference_file_quota: 3, daily_item_quota: 750 }
              as: ComplianceOfficer
              captures: { rh_id: "$.data.id" }
          trigger:
            - call: "GET /dmca/rights-holders/${rh_id}"
              payload: {}
              as: TakedownAgent
          assert:
            - "response status == 200"
            - "RightsHolder.${rh_id}.legal_name == \"Orbit Records LLC\""
            - "RightsHolder.${rh_id}.contact_email == \"legal@orbit.example\""
            - "RightsHolder.${rh_id}.reference_file_quota == 3"
            - "RightsHolder.${rh_id}.daily_item_quota == 750"
            - "RightsHolder.${rh_id}.enrollment_status == PROSPECT"
            - "RightsHolder.${rh_id}.program_tier == STANDARD"
            - "RightsHolder.${rh_id}.notices_processed == 0"
            - "RightsHolder.${rh_id}.withdrawn_count == 0"
            - "RightsHolder.${rh_id}.rejected_count == 0"
            - "RightsHolder.${rh_id}.misrepresentation_count == 0"
            - "RightsHolder.${rh_id}.abuse_score == 0.00"

      - name: list_notices_paginates_oldest_first_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET_/dmca/notices
          - response_envelope.pagination_fields
        distinguishing_aspect: "Three notices created in order are returned oldest-first: limit 2 offset 0 yields the first two with total_count 3 and has_more true, and offset 2 yields the third with has_more false."
        test_recipe:
          setup:
            - "Provider with published contact and a REGISTERED agent (not needed for intake, but the chain is the standard one)."
            - "One RightsHolder and three notices created in the order /v/1, /v/2, /v/3, all in RECEIVED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /dmca/providers"
              payload: { legal_name: "Northstar Hosting LLC", service_domain: "northstar.example" }
              as: ComplianceOfficer
              captures: { prov_id: "$.data.id" }
            - call: "POST /dmca/rights-holders"
              payload: { legal_name: "Orbit Records LLC", contact_email: "legal@orbit.example" }
              as: ComplianceOfficer
              captures: { rh_id: "$.data.id" }
            - call: "POST /dmca/notices"
              payload: { rights_holder_id: "${rh_id}", submission_channel: "WEB_FORM", claimed_urls: ["https://northstar.example/v/1"], signature_present: true, work_identification: "Work 1", material_identification: "At /v/1", contact_email: "legal@orbit.example", good_faith_statement: true, accuracy_statement: true, authority_statement: true, sworn_under_penalty: true }
              as: TakedownAgent
              captures: { n1_id: "$.data.id" }
            - call: "POST /dmca/notices"
              payload: { rights_holder_id: "${rh_id}", submission_channel: "WEB_FORM", claimed_urls: ["https://northstar.example/v/2"], signature_present: true, work_identification: "Work 2", material_identification: "At /v/2", contact_email: "legal@orbit.example", good_faith_statement: true, accuracy_statement: true, authority_statement: true, sworn_under_penalty: true }
              as: TakedownAgent
              captures: { n2_id: "$.data.id" }
            - call: "POST /dmca/notices"
              payload: { rights_holder_id: "${rh_id}", submission_channel: "EMAIL", claimed_urls: ["https://northstar.example/v/3"], signature_present: true, work_identification: "Work 3", material_identification: "At /v/3", contact_email: "legal@orbit.example", good_faith_statement: true, accuracy_statement: true, authority_statement: true, sworn_under_penalty: true }
              as: TakedownAgent
              captures: { n3_id: "$.data.id" }
          trigger:
            - call: "GET /dmca/notices?rights_holder_id=${rh_id}&limit=2&offset=0"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /dmca/notices?rights_holder_id=${rh_id}&limit=2&offset=2"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "the first list returns response_type == \"array\", total_count == 3, has_more == true, limit == 2, offset == 0 and exactly 2 entries"
            - "$.data[0].id == ${n1_id} and $.data[1].id == ${n2_id} (created_at ASC)"
            - "the second list returns total_count == 3, has_more == false and exactly 1 entry with $.data[0].id == ${n3_id}"
            - "every entry has status == RECEIVED and completeness_score == 0"
            - "ServiceProviderProfile.${prov_id}.version == 1 (listing mutates nothing)"

      - name: get_claim_with_unknown_id_returns_claim_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_CLAIM_NOT_FOUND]
          - validations.priority_4_existence
        distinguishing_aspect: "A syntactically valid but unknown UUID on the claim read must produce 404 ERR_CLAIM_NOT_FOUND, never an empty 200 body."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "GET /dmca/claims/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: TakedownAgent
          assert:
            - "response status == 404 with error_id == ERR_CLAIM_NOT_FOUND"
            - "response_type == \"error\" and data.message is a non-empty string"

      - name: create_content_item_without_fingerprint_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.ContentItem.fields.fingerprint_hash
          - validations.priority_3_ERR_INVALID_REQUEST
        distinguishing_aspect: "fingerprint_hash is a required input with no default, so omitting it yields 400 ERR_INVALID_REQUEST and creates no ContentItem and no counter movement."
        test_recipe:
          setup:
            - "Provider and one Account; available_content_count is 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /dmca/providers"
              payload: { legal_name: "Northstar Hosting LLC", service_domain: "northstar.example" }
              as: ComplianceOfficer
              captures: { prov_id: "$.data.id" }
            - call: "POST /dmca/accounts"
              payload: { provider_id: "${prov_id}", handle: "ada_lovelace", email: "ada@subscriber.example" }
              as: ComplianceOfficer
              captures: { acct_id: "$.data.id" }
          trigger:
            - call: "POST /dmca/content-items"
              payload: { account_id: "${acct_id}", content_url: "https://northstar.example/v/1", title: "Clip One" }
              as: Subscriber
              as_user_id: "${acct_id}"
          assert:
            - "response status == 400 with error_id == ERR_INVALID_REQUEST"
            - "GET /dmca/accounts/${acct_id}/content-items returns total_count == 0"
            - "Account.${acct_id}.available_content_count == 0"

      - name: repeat_infringer_policy_threshold_defaults_applied_when_omitted
        claim_type: defaults
        grounds:
          - entities.RepeatInfringerPolicy.fields.strike_expiry_days
          - entities.RepeatInfringerPolicy.fields.decay_step_days
          - entities.RepeatInfringerPolicy.fields.limitation_threshold_points
          - entities.RepeatInfringerPolicy.fields.termination_threshold_points
          - entities.RepeatInfringerPolicy.fields.appeal_window_days
        distinguishing_aspect: "Creating a policy with only provider_id and policy_text applies every documented default (365 / 90 / 20 / 40 / 14 / 30 / 30) and leaves status DRAFT with published_at null."
        test_recipe:
          setup:
            - "One provider; no policy revision yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /dmca/providers"
              payload: { legal_name: "Northstar Hosting LLC", service_domain: "northstar.example" }
              as: ComplianceOfficer
              captures: { prov_id: "$.data.id" }
          trigger:
            - call: "POST /dmca/repeat-infringer-policies"
              payload: { provider_id: "${prov_id}", policy_text: "Repeat infringers lose their accounts." }
              as: ComplianceOfficer
              captures: { policy_id: "$.data.id" }
          assert:
            - "response status == 201"
            - "RepeatInfringerPolicy.${policy_id}.strike_expiry_days == 365"
            - "RepeatInfringerPolicy.${policy_id}.decay_step_days == 90"
            - "RepeatInfringerPolicy.${policy_id}.limitation_threshold_points == 20"
            - "RepeatInfringerPolicy.${policy_id}.termination_threshold_points == 40"
            - "RepeatInfringerPolicy.${policy_id}.appeal_window_days == 14"
            - "RepeatInfringerPolicy.${policy_id}.counter_notice_window_days == 30"
            - "RepeatInfringerPolicy.${policy_id}.dispute_window_days == 30"
            - "RepeatInfringerPolicy.${policy_id}.status == DRAFT"
            - "RepeatInfringerPolicy.${policy_id}.published_at == null"
            - "ServiceProviderProfile.${prov_id}.repeat_infringer_policy_published == false"

      - name: claim_match_confidence_computed_from_active_reference_file_prefix
        claim_type: computed_fields
        grounds:
          - calculations.reference_match_confidence
          - entities.NoticeClaim.fields.match_confidence
          - entities.NoticeClaim.fields.reference_file_id
        distinguishing_aspect: "A registered ACTIVE reference file sharing a 30-of-32 fingerprint prefix scores exactly 0.9500, which clears VERIFIED_MIN_CONFIDENCE 0.95, so the claim stores that file and confidence — the value is computed, never supplied."
        test_recipe:
          setup:
            - "Provider fully documented with a PUBLISHED policy; clock at 2026-08-01T00:00:00Z."
            - "Account with one ContentItem whose fingerprint is 0123456789abcdef0123456789abcdef."
            - "RightsHolder ENROLLED and promoted to VERIFIED, with one ACTIVE registered ReferenceFile whose fingerprint 0123456789abcdef0123456789abcd00 shares the first 30 characters."
            - "One VALIDATED notice claiming that URL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /dmca/providers"
              payload: { legal_name: "Northstar Hosting LLC", service_domain: "northstar.example" }
              as: ComplianceOfficer
              captures: { prov_id: "$.data.id" }
            - call: "POST /dmca/providers/${prov_id}/publish-contact"
              payload: { public_contact_url: "https://northstar.example/legal/dmca-agent" }
              as: ComplianceOfficer
              captures: { prov_v1: "$.data.version" }
            - call: "POST /dmca/designated-agents"
              payload: { provider_id: "${prov_id}", agent_name: "Dana Reyes", agent_email: "dmca@northstar.example", agent_phone: "+1-555-0100", mailing_address: "1 Harbor Way, Springfield, IL 62701" }
              as: ComplianceOfficer
              captures: { agent_id: "$.data.id" }
            - call: "POST /dmca/designated-agents/${agent_id}/submit"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /dmca/designated-agents/${agent_id}/register"
              payload: { expected_provider_version: "${prov_v1}" }
              as: ComplianceOfficer
            - call: "GET /dmca/providers/${prov_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { prov_v2: "$.data.version" }
            - call: "POST /dmca/repeat-infringer-policies"
              payload: { provider_id: "${prov_id}", policy_text: "Standard repeat infringer policy." }
              as: ComplianceOfficer
              captures: { policy_id: "$.data.id" }
            - call: "POST /dmca/repeat-infringer-policies/${policy_id}/publish"
              payload: { expected_provider_version: "${prov_v2}" }
              as: ComplianceOfficer
            - call: "POST /dmca/accounts"
              payload: { provider_id: "${prov_id}", handle: "ada_lovelace", email: "ada@subscriber.example" }
              as: ComplianceOfficer
              captures: { acct_id: "$.data.id" }
            - call: "POST /dmca/content-items"
              payload: { account_id: "${acct_id}", content_url: "https://northstar.example/v/1", title: "Clip One", fingerprint_hash: "0123456789abcdef0123456789abcdef" }
              as: Subscriber
              as_user_id: "${acct_id}"
              captures: { item1_id: "$.data.id" }
            - call: "POST /dmca/rights-holders"
              payload: { legal_name: "Orbit Records LLC", contact_email: "legal@orbit.example" }
              as: ComplianceOfficer
              captures: { rh_id: "$.data.id" }
            - call: "POST /dmca/rights-holders/${rh_id}/enroll"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /dmca/rights-holders/${rh_id}/promote-tier"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /dmca/reference-files"
              payload: { rights_holder_id: "${rh_id}", work_title: "Orbit Vol. 1, track 3", fingerprint_hash: "0123456789abcdef0123456789abcd00", registration_number: "SR0000991122" }
              as: ComplianceOfficer
              captures: { ref_id: "$.data.id" }
            - call: "POST /dmca/reference-files/${ref_id}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /dmca/notices"
              payload: { rights_holder_id: "${rh_id}", submission_channel: "WEB_FORM", claimed_urls: ["https://northstar.example/v/1"], signature_present: true, work_identification: "Sound recording: Orbit Vol. 1, track 3", material_identification: "Track 3 posted at /v/1", contact_email: "legal@orbit.example", good_faith_statement: true, accuracy_statement: true, authority_statement: true, sworn_under_penalty: true }
              as: TakedownAgent
              captures: { n1_id: "$.data.id" }
            - call: "POST /dmca/notices/${n1_id}/validate"
              payload: {}
              as: TakedownAgent
          trigger:
            - call: "POST /dmca/notices/${n1_id}/process"
              payload: {}
              as: TakedownAgent
          assert:
            - "GET /dmca/claims?notice_id=${n1_id} returns total_count == 1 with $.data[0].match_confidence == 0.9500 and $.data[0].reference_file_id == ${ref_id}"
            - "$.data[0].matched_url == \"https://northstar.example/v/1\" and $.data[0].content_item_id == ${item1_id}"
            - "$.data[0].dispute_window_days == 30 and $.data[0].counter_notice_window_days == 30"
            - "ReferenceFile.${ref_id}.match_count == 1"
            - "Account.${acct_id}.strike_points == 15.00 (VERIFIED weight 1.5)"
            - "GET /dmca/claims?reference_file_id=${ref_id} returns total_count == 1"

      - name: content_item_system_fields_are_server_minted
        claim_type: system_fields
        grounds:
          - entities.ContentItem
          - endpoints.POST_/dmca/content-items
        distinguishing_aspect: "id, created_at, updated_at and version are minted by the server: version starts at 1 and both timestamps equal the logical clock, with id a bare UUID carrying no prefix."
        test_recipe:
          setup:
            - "Provider and one Account; clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /dmca/providers"
              payload: { legal_name: "Northstar Hosting LLC", service_domain: "northstar.example" }
              as: ComplianceOfficer
              captures: { prov_id: "$.data.id" }
            - call: "POST /dmca/accounts"
              payload: { provider_id: "${prov_id}", handle: "ada_lovelace", email: "ada@subscriber.example" }
              as: ComplianceOfficer
              captures: { acct_id: "$.data.id" }
          trigger:
            - call: "POST /dmca/content-items"
              payload: { account_id: "${acct_id}", content_url: "https://northstar.example/v/1", title: "Clip One", fingerprint_hash: "0123456789abcdef0123456789abcdef" }
              as: Subscriber
              as_user_id: "${acct_id}"
              captures: { item1_id: "$.data.id" }
          assert:
            - "ContentItem.${item1_id}.id is a bare UUID with no type prefix"
            - "ContentItem.${item1_id}.created_at == \"2026-08-01T00:00:00.000Z\""
            - "ContentItem.${item1_id}.updated_at == \"2026-08-01T00:00:00.000Z\""
            - "ContentItem.${item1_id}.version == 1"
            - "ContentItem.${item1_id}.availability_status == AVAILABLE"
            - "ContentItem.${item1_id}.dispute_status == NONE"
            - "ContentItem.${item1_id}.disabled_at == null and ContentItem.${item1_id}.restored_at == null"
            - "Account.${acct_id}.available_content_count == 1"

      - name: malformed_fingerprint_and_out_of_range_enum_are_rejected
        claim_type: type_constraints
        grounds:
          - entities.ContentItem.fields.fingerprint_hash
          - entities.TakedownNotice.fields.submission_channel
          - validations.priority_3_ERR_INVALID_REQUEST
        distinguishing_aspect: "Two shape violations both surface as 400 ERR_INVALID_REQUEST: a 31-character fingerprint fails the /^[0-9a-f]{32}$/ constraint and submission_channel FAX is outside the declared enum."
        test_recipe:
          setup:
            - "Provider, Account and one RightsHolder; clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /dmca/providers"
              payload: { legal_name: "Northstar Hosting LLC", service_domain: "northstar.example" }
              as: ComplianceOfficer
              captures: { prov_id: "$.data.id" }
            - call: "POST /dmca/accounts"
              payload: { provider_id: "${prov_id}", handle: "ada_lovelace", email: "ada@subscriber.example" }
              as: ComplianceOfficer
              captures: { acct_id: "$.data.id" }
            - call: "POST /dmca/rights-holders"
              payload: { legal_name: "Orbit Records LLC", contact_email: "legal@orbit.example" }
              as: ComplianceOfficer
              captures: { rh_id: "$.data.id" }
          trigger:
            - call: "POST /dmca/content-items"
              payload: { account_id: "${acct_id}", content_url: "https://northstar.example/v/1", title: "Clip One", fingerprint_hash: "0123456789abcdef0123456789abcde" }
              as: Subscriber
              as_user_id: "${acct_id}"
            - call: "POST /dmca/notices"
              payload: { rights_holder_id: "${rh_id}", submission_channel: "FAX", claimed_urls: ["https://northstar.example/v/1"], signature_present: true, work_identification: "Work 1", material_identification: "At /v/1", contact_email: "legal@orbit.example", good_faith_statement: true, accuracy_statement: true, authority_statement: true, sworn_under_penalty: true }
              as: TakedownAgent
          assert:
            - "the content-item call returns 400 with error_id == ERR_INVALID_REQUEST"
            - "the notice call returns 400 with error_id == ERR_INVALID_REQUEST"
            - "GET /dmca/accounts/${acct_id}/content-items returns total_count == 0"
            - "GET /dmca/notices?rights_holder_id=${rh_id} returns total_count == 0"

      - name: safe_harbor_audit_is_append_only_with_no_version_field
        claim_type: immutability
        grounds:
          - entities.SafeHarborAudit
          - endpoints.GET_/dmca/providers/{id}/safe-harbor-audits
        distinguishing_aspect: "SafeHarborAudit declares common_fields false: each audit carries only id and created_at (no version, no updated_at), §1.5 exposes no update or delete endpoint for it, and a second audit appends a new record instead of mutating the first."
        test_recipe:
          setup:
            - "Provider with published contact, a REGISTERED agent and a PUBLISHED policy, so the posture is ELIGIBLE with score 100."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /dmca/providers"
              payload: { legal_name: "Northstar Hosting LLC", service_domain: "northstar.example" }
              as: ComplianceOfficer
              captures: { prov_id: "$.data.id" }
            - call: "POST /dmca/providers/${prov_id}/publish-contact"
              payload: { public_contact_url: "https://northstar.example/legal/dmca-agent" }
              as: ComplianceOfficer
              captures: { prov_v1: "$.data.version" }
            - call: "POST /dmca/designated-agents"
              payload: { provider_id: "${prov_id}", agent_name: "Dana Reyes", agent_email: "dmca@northstar.example", agent_phone: "+1-555-0100", mailing_address: "1 Harbor Way, Springfield, IL 62701" }
              as: ComplianceOfficer
              captures: { agent_id: "$.data.id" }
            - call: "POST /dmca/designated-agents/${agent_id}/submit"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /dmca/designated-agents/${agent_id}/register"
              payload: { expected_provider_version: "${prov_v1}" }
              as: ComplianceOfficer
            - call: "GET /dmca/providers/${prov_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { prov_v2: "$.data.version" }
            - call: "POST /dmca/repeat-infringer-policies"
              payload: { provider_id: "${prov_id}", policy_text: "Standard repeat infringer policy." }
              as: ComplianceOfficer
              captures: { policy_id: "$.data.id" }
            - call: "POST /dmca/repeat-infringer-policies/${policy_id}/publish"
              payload: { expected_provider_version: "${prov_v2}" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /dmca/safe-harbor-audits"
              payload: { provider_id: "${prov_id}" }
              as: ComplianceOfficer
              captures: { audit1_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
