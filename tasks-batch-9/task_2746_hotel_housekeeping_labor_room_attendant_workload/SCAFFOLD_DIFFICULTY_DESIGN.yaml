scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: forecast_projected_inventory_mix_versus_actual_reconciled_credits
        grounds:
          - calculations.forecast_required_credits
          - calculations.forecast_credit_variance
          - entities.ForecastDay.fields.projected_required_credits
          - entities.ForecastDay.fields.actual_reconciled_credits
          - entities.ForecastDay.fields.credit_variance_pct
          - state_machines.ForecastDay.PUBLISHED_to_CLOSED
        distinguishing_aspect: |
          The same ForecastDay row carries two credit figures computed by two different variants of
          one calculation over disjoint input sets - PROJECTED_INVENTORY_MIX reads only the
          occupancy/arrival/departure counters spread over the room-type inventory share (6.76) while
          ACTUAL_RECONCILED reads only the performed RoomAssignment ledger (4.00) - so the two fields
          are unequal on identical data and credit_variance_pct is exactly -40.83.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T07:00:00.000Z."
            - "One property under ordinance_profile SQFT_CAP_2200 with credit_minute_value 30, max_daily_credits 16.00, max_daily_square_feet 2200, inspection_sample_rate 0.20, reclean_threshold_score 85.0."
            - "Two room types: KING (420 sqft, credits 1.00/0.50/2.00, 2 linen sets) and SUITE (780 sqft, credits 2.00/1.00/3.50, 3 linen sets)."
            - "Four rooms: KING 101 DUE_OUT, KING 102 DUE_OUT, KING 103 VACANT, SUITE 201 VACANT, so total_rooms is 4 and the KING inventory share is 0.75."
            - "One SHEET_SET linen line with 20 owned sets, giving coverage 2.2222 and shortage_status OK."
            - "Two attendants: room attendant E-101 at 3000 cents/hour and inspecting supervisor E-900."
            - "ForecastDay 2026-08-03 with occupied 4, arrivals 1, departures 2, planned deep cleans 1, PUBLISHED."
            - "One CLOCKED_IN roster for E-101 carrying two KING checkouts (1.00 each) and one KING deep clean (2.00), all COMPLETED on non-overlapping windows at least 10 minutes apart, with one PASS inspection recorded."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T07:00:00.000Z" }
              as: HousekeepingDirector
            - call: "POST /housekeeping/properties"
              payload: { name: "Harborview Hotel", ordinance_profile: "SQFT_CAP_2200", credit_minute_value: 30, standard_shift_minutes: 480, pre_post_shift_minutes: 45, min_daily_paid_minutes: 240, max_daily_credits: 16.00, max_daily_square_feet: 2200, laundry_sla_minutes: 240, laundry_capacity_sets: 300, reclean_threshold_score: 85.0, inspection_sample_rate: 0.20, probation_sample_rate: 0.50, rest_buffer_minutes: 10 }
              as: HousekeepingDirector
              captures: { prop_id: $.data.id }
            - call: "POST /housekeeping/room-types"
              payload: { property_id: "${prop_id}", code: "KING", square_feet: 420, checkout_credits: 1.00, stayover_credits: 0.50, deep_clean_credits: 2.00, linen_sets_per_room: 2 }
              as: HousekeepingDirector
              captures: { rt_king_id: $.data.id }
            - call: "POST /housekeeping/room-types"
              payload: { property_id: "${prop_id}", code: "SUITE", square_feet: 780, checkout_credits: 2.00, stayover_credits: 1.00, deep_clean_credits: 3.50, linen_sets_per_room: 3 }
              as: HousekeepingDirector
              captures: { rt_suite_id: $.data.id }
            - call: "POST /housekeeping/rooms"
              payload: { property_id: "${prop_id}", room_type_id: "${rt_king_id}", room_number: "101", floor: 1, occupancy_state: "DUE_OUT" }
              as: HousekeepingDirector
              captures: { room101_id: $.data.id }
            - call: "POST /housekeeping/rooms"
              payload: { property_id: "${prop_id}", room_type_id: "${rt_king_id}", room_number: "102", floor: 1, occupancy_state: "DUE_OUT" }
              as: HousekeepingDirector
              captures: { room102_id: $.data.id }
            - call: "POST /housekeeping/rooms"
              payload: { property_id: "${prop_id}", room_type_id: "${rt_king_id}", room_number: "103", floor: 1, occupancy_state: "VACANT" }
              as: HousekeepingDirector
              captures: { room103_id: $.data.id }
            - call: "POST /housekeeping/rooms"
              payload: { property_id: "${prop_id}", room_type_id: "${rt_suite_id}", room_number: "201", floor: 2, occupancy_state: "VACANT" }
              as: HousekeepingDirector
              captures: { room201_id: $.data.id }
            - call: "POST /housekeeping/linen-items"
              payload: { property_id: "${prop_id}", linen_type: "SHEET_SET", total_owned_sets: 20 }
              as: HousekeepingDirector
              captures: { linen_id: $.data.id }
            - call: "POST /housekeeping/attendants"
              payload: { property_id: "${prop_id}", employee_code: "E-101", full_name: "Rosa Diaz", seniority_date: "2019-04-01", hourly_rate_cents: 3000 }
              as: HousekeepingDirector
              captures: { ra1_id: $.data.id }
            - call: "POST /housekeeping/attendants"
              payload: { property_id: "${prop_id}", employee_code: "E-900", full_name: "Ivan Petrov", seniority_date: "2014-02-01", hourly_rate_cents: 4200, can_inspect: true }
              as: HousekeepingDirector
              captures: { sup_id: $.data.id }
            - call: "POST /housekeeping/forecast-days"
              payload: { property_id: "${prop_id}", business_date: "2026-08-03", forecast_occupied_rooms: 4, forecast_arrivals: 1, forecast_departures: 2, planned_deep_clean_rooms: 1 }
              as: HousekeepingDirector
              captures: { fd_id: $.data.id }
            - call: "POST /housekeeping/forecast-days/${fd_id}/publish"
              payload: {}
              as: HousekeepingDirector
            - call: "POST /housekeeping/shift-rosters"
              payload: { forecast_day_id: "${fd_id}", attendant_id: "${ra1_id}", planned_start_at: "2026-08-03T08:00:00.000Z" }
              as: HousekeepingDirector
              captures: { roster_id: $.data.id }
            - call: "POST /housekeeping/shift-rosters/${roster_id}/clock-in"
              payload: {}
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { r_v1: $.data.version }
            - call: "POST /housekeeping/room-assignments"
              payload: { roster_id: "${roster_id}", room_id: "${room101_id}", service_type: "CHECKOUT", expected_roster_version: "${r_v1}" }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { a1_id: $.data.id, r_v2: $.data.roster_version_after }
            - call: "POST /housekeeping/room-assignments"
              payload: { roster_id: "${roster_id}", room_id: "${room102_id}", service_type: "CHECKOUT", expected_roster_version: "${r_v2}" }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { a2_id: $.data.id, r_v3: $.data.roster_version_after }
            - call: "POST /housekeeping/room-assignments"
              payload: { roster_id: "${roster_id}", room_id: "${room103_id}", service_type: "DEEP_CLEAN", expected_roster_version: "${r_v3}" }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { a3_id: $.data.id }
            - call: "POST /housekeeping/room-assignments/${a1_id}/start"
              payload: { started_at: "2026-08-03T09:00:00.000Z" }
              as: Supervisor
              as_user_id: "${sup_id}"
            - call: "POST /housekeeping/room-assignments/${a1_id}/complete"
              payload: { completed_at: "2026-08-03T09:30:00.000Z" }
              as: Supervisor
              as_user_id: "${sup_id}"
            - call: "POST /housekeeping/room-assignments/${a2_id}/start"
              payload: { started_at: "2026-08-03T09:40:00.000Z" }
              as: Supervisor
              as_user_id: "${sup_id}"
            - call: "POST /housekeeping/room-assignments/${a2_id}/complete"
              payload: { completed_at: "2026-08-03T10:10:00.000Z" }
              as: Supervisor
              as_user_id: "${sup_id}"
            - call: "POST /housekeeping/room-assignments/${a3_id}/start"
              payload: { started_at: "2026-08-03T10:20:00.000Z" }
              as: Supervisor
              as_user_id: "${sup_id}"
            - call: "POST /housekeeping/room-assignments/${a3_id}/complete"
              payload: { completed_at: "2026-08-03T11:00:00.000Z" }
              as: Supervisor
              as_user_id: "${sup_id}"
            - call: "POST /housekeeping/inspections"
              payload: { assignment_id: "${a1_id}", bathroom_points: 9, linen_points: 8, dust_points: 8, amenity_points: 8, floor_points: 10 }
              as: Supervisor
              as_user_id: "${sup_id}"
          trigger:
            - call: "POST /housekeeping/shift-rosters/${roster_id}/close"
              payload: { worked_minutes: 400, break_minutes: 20 }
              as: HousekeepingDirector
            - call: "POST /housekeeping/forecast-days/${fd_id}/close"
              payload: {}
              as: HousekeepingDirector
              captures: { closed_variance: $.data.credit_variance_pct }
          assert:
            - "ForecastDay.${fd_id}.projected_required_credits == 6.76"
            - "ForecastDay.${fd_id}.actual_reconciled_credits == 4.00"
            - "ForecastDay.${fd_id}.projected_required_credits != ForecastDay.${fd_id}.actual_reconciled_credits"
            - "ForecastDay.${fd_id}.credit_variance_pct == -40.83"
            - "ForecastDay.${fd_id}.required_attendants == 1"
            - "ForecastDay.${fd_id}.status == CLOSED"
            - "RoomAssignment.${a1_id}.status == INSPECTED_PASS and its 1.00 credits still enter actual_reconciled_credits"

      - name: minutes_per_room_gross_physical_versus_net_credited_after_reclean
        grounds:
          - calculations.minutes_per_room
          - calculations.shift_settlement
          - entities.ShiftRoster.fields.minutes_per_room_gross
          - entities.ShiftRoster.fields.minutes_per_room_net
          - entities.ShiftRoster.fields.productivity_flag
          - state_machines.RoomAssignment.COMPLETED_to_RECLEAN_REQUIRED
        distinguishing_aspect: |
          One re-cleaned room makes rooms_completed_gross (2) differ from rooms_credited_net (1) on the
          same roster, so the GROSS_PHYSICAL variant reports 135.00 minutes per room while the
          NET_CREDITED_ROOMS variant reports exactly double, 270.00, and only the net figure feeds the
          productivity_flag - which the quality guardrail then overrides to QUALITY_HOLD.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T07:00:00.000Z."
            - "Property with credit_minute_value 30, min_daily_paid_minutes 240, standard_shift_minutes 480, reclean_threshold_score 85.0, probation_sample_rate 0.50."
            - "One KING room 101 in DUE_OUT, one SHEET_SET linen line with 20 sets."
            - "Room attendant E-101 at 3000 cents/hour, inspecting supervisor E-900."
            - "PUBLISHED ForecastDay 2026-08-03, CLOCKED_IN roster for E-101."
            - "Room 101 cleaned once (window 10:00-10:30), inspected with bathroom_points 5 producing a critical FAIL, and the system-generated generation-1 re-clean then cleaned as well (window 11:00-11:40)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T07:00:00.000Z" }
              as: HousekeepingDirector
            - call: "POST /housekeeping/properties"
              payload: { name: "Harborview Hotel", ordinance_profile: "SQFT_CAP_2200", credit_minute_value: 30, standard_shift_minutes: 480, pre_post_shift_minutes: 45, min_daily_paid_minutes: 240, max_daily_credits: 16.00, max_daily_square_feet: 2200, laundry_sla_minutes: 240, laundry_capacity_sets: 300, reclean_threshold_score: 85.0, inspection_sample_rate: 0.20, probation_sample_rate: 0.50, rest_buffer_minutes: 10 }
              as: HousekeepingDirector
              captures: { prop_id: $.data.id }
            - call: "POST /housekeeping/room-types"
              payload: { property_id: "${prop_id}", code: "KING", square_feet: 420, checkout_credits: 1.00, stayover_credits: 0.50, deep_clean_credits: 2.00, linen_sets_per_room: 2 }
              as: HousekeepingDirector
              captures: { rt_king_id: $.data.id }
            - call: "POST /housekeeping/rooms"
              payload: { property_id: "${prop_id}", room_type_id: "${rt_king_id}", room_number: "101", floor: 1, occupancy_state: "DUE_OUT" }
              as: HousekeepingDirector
              captures: { room101_id: $.data.id }
            - call: "POST /housekeeping/linen-items"
              payload: { property_id: "${prop_id}", linen_type: "SHEET_SET", total_owned_sets: 20 }
              as: HousekeepingDirector
              captures: { linen_id: $.data.id }
            - call: "POST /housekeeping/attendants"
              payload: { property_id: "${prop_id}", employee_code: "E-101", full_name: "Rosa Diaz", seniority_date: "2019-04-01", hourly_rate_cents: 3000 }
              as: HousekeepingDirector
              captures: { ra1_id: $.data.id }
            - call: "POST /housekeeping/attendants"
              payload: { property_id: "${prop_id}", employee_code: "E-900", full_name: "Ivan Petrov", seniority_date: "2014-02-01", hourly_rate_cents: 4200, can_inspect: true }
              as: HousekeepingDirector
              captures: { sup_id: $.data.id }
            - call: "POST /housekeeping/forecast-days"
              payload: { property_id: "${prop_id}", business_date: "2026-08-03", forecast_occupied_rooms: 1, forecast_arrivals: 0, forecast_departures: 1, planned_deep_clean_rooms: 0 }
              as: HousekeepingDirector
              captures: { fd_id: $.data.id }
            - call: "POST /housekeeping/forecast-days/${fd_id}/publish"
              payload: {}
              as: HousekeepingDirector
            - call: "POST /housekeeping/shift-rosters"
              payload: { forecast_day_id: "${fd_id}", attendant_id: "${ra1_id}", planned_start_at: "2026-08-03T08:00:00.000Z" }
              as: HousekeepingDirector
              captures: { roster_id: $.data.id }
            - call: "POST /housekeeping/shift-rosters/${roster_id}/clock-in"
              payload: {}
              as: RoomAttendant
              as_user_id: "${ra1_id}"
              captures: { r_v1: $.data.version }
            - call: "POST /housekeeping/room-assignments"
              payload: { roster_id: "${roster_id}", room_id: "${room101_id}", service_type: "CHECKOUT", expected_roster_version: "${r_v1}" }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { a1_id: $.data.id }
            - call: "POST /housekeeping/room-assignments/${a1_id}/start"
              payload: { started_at: "2026-08-03T10:00:00.000Z" }
              as: RoomAttendant
              as_user_id: "${ra1_id}"
            - call: "POST /housekeeping/room-assignments/${a1_id}/complete"
              payload: { completed_at: "2026-08-03T10:30:00.000Z" }
              as: RoomAttendant
              as_user_id: "${ra1_id}"
            - call: "POST /housekeeping/inspections"
              payload: { assignment_id: "${a1_id}", bathroom_points: 5, linen_points: 9, dust_points: 9, amenity_points: 9, floor_points: 9 }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { insp1_id: $.data.id, reclean_id: $.data.generated_reclean_assignment_id }
            - call: "POST /housekeeping/room-assignments/${reclean_id}/start"
              payload: { started_at: "2026-08-03T11:00:00.000Z" }
              as: RoomAttendant
              as_user_id: "${ra1_id}"
            - call: "POST /housekeeping/room-assignments/${reclean_id}/complete"
              payload: { completed_at: "2026-08-03T11:40:00.000Z" }
              as: RoomAttendant
              as_user_id: "${ra1_id}"
          trigger:
            - call: "POST /housekeeping/shift-rosters/${roster_id}/close"
              payload: { worked_minutes: 300, break_minutes: 30 }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { closed_gross: $.data.minutes_per_room_gross, closed_net: $.data.minutes_per_room_net }
          assert:
            - "ShiftRoster.${roster_id}.rooms_completed_gross == 2"
            - "ShiftRoster.${roster_id}.rooms_credited_net == 1"
            - "ShiftRoster.${roster_id}.minutes_per_room_gross == 135.00"
            - "ShiftRoster.${roster_id}.minutes_per_room_net == 270.00"
            - "ShiftRoster.${roster_id}.target_minutes_per_room == 45.00"
            - "ShiftRoster.${roster_id}.assigned_credits == 1.50"
            - "ShiftRoster.${roster_id}.paid_minutes == 300 and overtime_minutes == 0"
            - "ShiftRoster.${roster_id}.productivity_flag == QUALITY_HOLD"

  - rule_id: combinatorial_formula
    instances:
      - name: suite_deep_clean_credits_snap_to_quarter_then_clamp_to_ceiling
        grounds:
          - calculations.assignment_credit_value
          - entities.RoomAssignment.fields.credits
          - entities.RoomType.fields.deep_clean_credits
          - entities.ShiftRoster.fields.assigned_credits
        distinguishing_aspect: |
          This instance pins the ARGUMENT-CLAMPING order inside one formula: the raw 3.50 SUITE
          deep-clean value is first snapped to the quarter-credit grid and only then clamped by
          min(3.00, max(0.25, .)), so the stored credits are exactly 3.00 - clamping before snapping,
          or omitting the ceiling entirely, both yield 3.50.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T07:00:00.000Z."
            - "Property under ordinance_profile SQFT_CAP_2200 with max_daily_credits 16.00 and max_daily_square_feet 2200."
            - "SUITE room type at 780 sqft with deep_clean_credits 3.50; one SUITE room 201 in VACANT."
            - "One SHEET_SET linen line with 20 owned sets so shortage_status is OK and deep cleans are permitted."
            - "PUBLISHED ForecastDay 2026-08-03 and a CLOCKED_IN roster for a non-restricted attendant."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T07:00:00.000Z" }
              as: HousekeepingDirector
            - call: "POST /housekeeping/properties"
              payload: { name: "Harborview Hotel", ordinance_profile: "SQFT_CAP_2200", credit_minute_value: 30, standard_shift_minutes: 480, pre_post_shift_minutes: 45, min_daily_paid_minutes: 240, max_daily_credits: 16.00, max_daily_square_feet: 2200, laundry_sla_minutes: 240, laundry_capacity_sets: 300, reclean_threshold_score: 85.0, inspection_sample_rate: 0.20, probation_sample_rate: 0.50, rest_buffer_minutes: 10 }
              as: HousekeepingDirector
              captures: { prop_id: $.data.id }
            - call: "POST /housekeeping/room-types"
              payload: { property_id: "${prop_id}", code: "SUITE", square_feet: 780, checkout_credits: 2.00, stayover_credits: 1.00, deep_clean_credits: 3.50, linen_sets_per_room: 3 }
              as: HousekeepingDirector
              captures: { rt_suite_id: $.data.id }
            - call: "POST /housekeeping/rooms"
              payload: { property_id: "${prop_id}", room_type_id: "${rt_suite_id}", room_number: "201", floor: 2, occupancy_state: "VACANT" }
              as: HousekeepingDirector
              captures: { room201_id: $.data.id }
            - call: "POST /housekeeping/linen-items"
              payload: { property_id: "${prop_id}", linen_type: "SHEET_SET", total_owned_sets: 20 }
              as: HousekeepingDirector
              captures: { linen_id: $.data.id }
            - call: "POST /housekeeping/attendants"
              payload: { property_id: "${prop_id}", employee_code: "E-101", full_name: "Rosa Diaz", seniority_date: "2019-04-01", hourly_rate_cents: 3000 }
              as: HousekeepingDirector
              captures: { ra1_id: $.data.id }
            - call: "POST /housekeeping/forecast-days"
              payload: { property_id: "${prop_id}", business_date: "2026-08-03", forecast_occupied_rooms: 0, forecast_arrivals: 0, forecast_departures: 0, planned_deep_clean_rooms: 1 }
              as: HousekeepingDirector
              captures: { fd_id: $.data.id }
            - call: "POST /housekeeping/forecast-days/${fd_id}/publish"
              payload: {}
              as: HousekeepingDirector
            - call: "POST /housekeeping/shift-rosters"
              payload: { forecast_day_id: "${fd_id}", attendant_id: "${ra1_id}", planned_start_at: "2026-08-03T08:00:00.000Z" }
              as: HousekeepingDirector
              captures: { roster_id: $.data.id }
            - call: "POST /housekeeping/shift-rosters/${roster_id}/clock-in"
              payload: {}
              as: RoomAttendant
              as_user_id: "${ra1_id}"
              captures: { r_v1: $.data.version }
          trigger:
            - call: "POST /housekeeping/room-assignments"
              payload: { roster_id: "${roster_id}", room_id: "${room201_id}", service_type: "DEEP_CLEAN", expected_roster_version: "${r_v1}" }
              as: HousekeepingDirector
              captures: { a_suite_id: $.data.id }
          assert:
            - "RoomAssignment.${a_suite_id}.credits == 3.00"
            - "RoomAssignment.${a_suite_id}.credits != 3.50"
            - "RoomAssignment.${a_suite_id}.square_feet_snapshot == 780"
            - "ShiftRoster.${roster_id}.assigned_credits == 3.00"
            - "ShiftRoster.${roster_id}.compliance_state == COMPLIANT"

      - name: forecast_credits_round_per_room_type_before_summing
        grounds:
          - calculations.forecast_required_credits
          - entities.ForecastDay.fields.projected_required_credits
          - entities.RoomType.fields.room_count
          - entities.Property.fields.total_rooms
        distinguishing_aspect: |
          This instance pins the ROUNDING ORDER across a multi-term sum: KING contributes 4.125 and
          SUITE 2.625, so rounding each room type to 2 decimals first (4.13 + 2.63) yields 6.76 while
          summing the raw terms and rounding once yields 6.75 - a one-cent divergence that only the
          per-type-first order produces.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T07:00:00.000Z."
            - "One property, two room types KING (checkout 1.00, stayover 0.50, deep 2.00) and SUITE (checkout 2.00, stayover 1.00, deep 3.50)."
            - "Three KING rooms and one SUITE room, so total_rooms is 4, KING room_count 3 (share 0.75) and SUITE room_count 1 (share 0.25)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T07:00:00.000Z" }
              as: HousekeepingDirector
            - call: "POST /housekeeping/properties"
              payload: { name: "Harborview Hotel", ordinance_profile: "SQFT_CAP_2200", credit_minute_value: 30, standard_shift_minutes: 480, pre_post_shift_minutes: 45, min_daily_paid_minutes: 240, max_daily_credits: 16.00, max_daily_square_feet: 2200, laundry_sla_minutes: 240, laundry_capacity_sets: 300, reclean_threshold_score: 85.0, inspection_sample_rate: 0.20, probation_sample_rate: 0.50, rest_buffer_minutes: 10 }
              as: HousekeepingDirector
              captures: { prop_id: $.data.id }
            - call: "POST /housekeeping/room-types"
              payload: { property_id: "${prop_id}", code: "KING", square_feet: 420, checkout_credits: 1.00, stayover_credits: 0.50, deep_clean_credits: 2.00, linen_sets_per_room: 2 }
              as: HousekeepingDirector
              captures: { rt_king_id: $.data.id }
            - call: "POST /housekeeping/room-types"
              payload: { property_id: "${prop_id}", code: "SUITE", square_feet: 780, checkout_credits: 2.00, stayover_credits: 1.00, deep_clean_credits: 3.50, linen_sets_per_room: 3 }
              as: HousekeepingDirector
              captures: { rt_suite_id: $.data.id }
            - call: "POST /housekeeping/rooms"
              payload: { property_id: "${prop_id}", room_type_id: "${rt_king_id}", room_number: "101", floor: 1, occupancy_state: "DUE_OUT" }
              as: HousekeepingDirector
              captures: { room101_id: $.data.id }
            - call: "POST /housekeeping/rooms"
              payload: { property_id: "${prop_id}", room_type_id: "${rt_king_id}", room_number: "102", floor: 1, occupancy_state: "DUE_OUT" }
              as: HousekeepingDirector
              captures: { room102_id: $.data.id }
            - call: "POST /housekeeping/rooms"
              payload: { property_id: "${prop_id}", room_type_id: "${rt_king_id}", room_number: "103", floor: 1, occupancy_state: "VACANT" }
