              as_user_id: "qe-1"
            - call: "POST /api/steel-coils/${coil_id}/release-hold"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
          assert:
            - "SteelCoil.${coil_id}.remaining_weight_kg == 415.000 (500 - 85.000) after the hold/release pair — the compensating pair leaves the conserved quantity unchanged"
            - "SteelCoil.${coil_id}.status == APPROVED"
            - "invariant: remaining_weight_kg (415.000) + sum(steel_consumed_kg of COMPLETED runs) (85.000) == received_weight_kg (500)"
      - name: die_shot_lifetime_conservation_under_repair_cycle
        grounds:
          - state_machines.Die.IN_REPAIR_to_AVAILABLE
          - state_machines.ProductionRun.RUNNING_to_COMPLETED
          - entities.Die.fields.total_shots_lifetime
        distinguishing_aspect: |
          Conserved quantity: cumulative die shots. Invariant: total_shots_lifetime
          never decreases, while send-to-repair + complete-repair (forward +
          compensating pair) resets only shots_since_repair; total_shots_lifetime
          after the pair equals total before the pair. Different conserved quantity
          (shot count, not kilograms) than the coil-weight invariant.
        test_recipe:
          setup:
            - "Die with repair_threshold_shots=100; one run completes with 120 shots (shots_since_repair=120 >= 100); send to repair and complete repair"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /api/customers"
              payload: { name: "Rho Auto", customer_code: "RHO", steel_index_basis: "CRU_HRC", base_index_value: 900, pass_through_pct: 0.5 }
              as: PlantAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /api/parts"
              payload: { customer_id: "${cust_id}", part_number: "P-1700", material_spec: "HSLA340", thickness_mm: 1.2, net_weight_kg: 0.62, base_piece_price_cents: 1800, ppap_required_level: 1 }
              as: ProcessEngineer
              captures: { part_id: $.data.id, part_ver: $.data.version }
            - call: "POST /api/dies"
              payload: { die_code: "D-17", die_type: "PROGRESSIVE", total_stations: 6, rated_tonnage: 300, min_bed_width_mm: 1800, repair_threshold_shots: 100 }
              as: ToolroomManager
              captures: { die_id: $.data.id }
            - call: "POST /api/part-die-assignments"
              payload: { part_id: "${part_id}", die_id: "${die_id}" }
              as: ProcessEngineer
            - call: "POST /api/strip-layouts"
              payload: { part_id: "${part_id}", revision: "A", strip_width_mm: 250, pitch_mm: 120, parts_per_strip_segment: 1, gross_weight_per_part_kg: 0.85 }
              as: ProcessEngineer
              captures: { layout_id: $.data.id }
            - call: "POST /api/strip-layouts/${layout_id}/approve"
              payload: { expected_part_version: "${part_ver}" }
              as: ProcessEngineer
            - call: "POST /api/ppap-submissions"
              payload: { part_id: "${part_id}", level: 1, control_plan_attached: false }
              as: ProcessEngineer
              captures: { ppap_id: $.data.id }
            - call: "POST /api/ppap-submissions/${ppap_id}/begin-review"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /api/ppap-submissions/${ppap_id}/approve"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-2"
            - call: "POST /api/production-orders"
              payload: { part_id: "${part_id}", quantity_ordered: 500, due_date: "2026-08-20T00:00:00Z" }
              as: ProductionPlanner
              captures: { order_id: $.data.id, order_ver: $.data.version }
            - call: "POST /api/production-orders/${order_id}/release"
              payload: { expected_order_version: "${order_ver}" }
              as: ProductionPlanner
            - call: "POST /api/presses"
              payload: { press_code: "PR-17", tonnage: 500, bed_width_mm: 2500, strokes_per_min: 45 }
              as: PlantAdmin
              captures: { press_id: $.data.id }
            - call: "POST /api/die-change-events"
              payload: { press_id: "${press_id}", to_die_id: "${die_id}", planned_start: "2026-08-01T06:00:00Z", planned_end: "2026-08-01T07:00:00Z", smed_target_minutes: 40 }
              as: SetupLead
              captures: { dce_id: $.data.id }
            - call: "POST /api/die-change-events/${dce_id}/start"
              payload: {}
              as: SetupLead
            - call: "POST /api/die-change-events/${dce_id}/complete"
              payload: {}
              as: SetupLead
            - call: "POST /api/steel-coils"
              payload: { coil_number: "C-R1", heat_lot_number: "HL-R", material_spec: "HSLA340", thickness_mm: 1.2, received_weight_kg: 1000 }
              as: ShippingClerk
              captures: { coil_id: $.data.id }
            - call: "POST /api/steel-coils/${coil_id}/approve"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /api/production-runs"
              payload: { production_order_id: "${order_id}", press_id: "${press_id}", die_id: "${die_id}", coil_id: "${coil_id}", scheduled_start: "2026-08-01T08:00:00Z", scheduled_end: "2026-08-01T09:00:00Z" }
              as: ProductionPlanner
              captures: { run_id: $.data.id }
            - call: "POST /api/production-runs/${run_id}/start"
              payload: {}
              as: PressOperator
            - call: "GET /api/steel-coils/${coil_id}"
              as: PressOperator
              captures: { coil_id_v10: "$.data.version" }
            - call: "POST /api/production-runs/${run_id}/complete"
              payload: { shots_recorded: 120, expected_coil_version: "${coil_id_v10}" }
              as: PressOperator
          trigger:
            - call: "POST /api/dies/${die_id}/send-to-repair"
              payload: {}
              as: ToolroomManager
            - call: "POST /api/dies/${die_id}/complete-repair"
              payload: {}
              as: ToolroomManager
            - call: "GET /api/dies/${die_id}"
              as: ToolroomManager
          assert:
            - "Die.${die_id}.total_shots_lifetime == 120 after the repair cycle — the conserved lifetime counter is NOT reset by the compensating pair"
            - "Die.${die_id}.shots_since_repair == 0 (only the per-repair counter resets)"
            - "Die.${die_id}.status == AVAILABLE"
