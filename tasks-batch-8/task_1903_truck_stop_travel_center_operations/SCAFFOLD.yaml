      - { name: parking_paid_capacity, type: integer, source: input, description: "Maximum count of overlapping status CONFIRMED/ACTIVE paid reservations allowed at any instant; must be <= parking_total_spaces" }
      - { name: shower_units_count, type: integer, source: input, description: "Number of shower stalls (SHOWER active capacity)" }
      - { name: laundry_machines_count, type: integer, source: input, description: "Number of laundry machines (LAUNDRY active capacity)" }
      - { name: diesel_retail_cents_per_gallon, type: integer, source: computed, description: "Mirror of the currently effective ACTIVE FuelPrice.retail_cents_per_gallon for DIESEL; null when none" }
      - { name: gas_regular_retail_cents_per_gallon, type: integer, source: computed, description: "Mirror for GAS_REGULAR; null when none" }
      - { name: def_retail_cents_per_gallon, type: integer, source: computed, description: "Mirror for DEF; null when none" }
      - { name: water_usage_gallons, type: number, source: computed, description: "Cumulative shower + laundry water usage in gallons (2 decimal places)" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts 1, +1 on every mutation including price-supersede side effects" }

