            - "PreventionPlan is IN_REVIEW, submitted by Sofia Ortiz, with one SCREENING HazardAssessment on the only WorkArea authored by Sofia Ortiz, so hazard_coverage_pct is 100.00 and training_compliance_pct is vacuously 100.00."
