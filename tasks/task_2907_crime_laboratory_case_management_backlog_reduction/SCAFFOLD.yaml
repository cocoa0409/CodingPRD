  - method: GET
    path: "/lab/court-events/{court_event_id}"
    description: "Read one testimony block including notice_days and status"
    roles: [LabDirector, QualityManager, CaseManager, Analyst]
    code: 200
    input: []
    output: CourtEvent
    side_effects: []

  # ---------------------------------------------------------------- reads: filtered lists
  - method: GET
    path: "/lab/cases"
    description: "List cases, optionally narrowed by agency, offence, queue class or either state dimension, ordered by priority_score DESC then received_at_utc ASC"
    roles: [LabDirector, QualityManager, CaseManager, EvidenceTechnician]
    code: 200
    input: ["submitting_agency?", "offense_category?", "priority_class?", "workflow_status?", "discovery_status?", "limit?", "offset?"]
    output: Case[]
    side_effects: []
  - method: GET
    path: "/lab/evidence-items"
    description: "List evidence items, optionally narrowed by case or custody position"
    roles: [LabDirector, QualityManager, CaseManager, EvidenceTechnician, Analyst]
    code: 200
    input: ["case_id?", "custody_status?", "item_type?", "limit?", "offset?"]
    output: EvidenceItem[]
    side_effects: []
  - method: GET
    path: "/lab/examination-requests"
    description: "List examination requests - the discipline queue view - optionally narrowed by case, evidence item, method, holder, discipline or status, ordered by case.priority_score DESC then requested_at_utc ASC"
    roles: [LabDirector, QualityManager, CaseManager, Analyst]
    code: 200
    input: ["case_id?", "evidence_item_id?", "method_id?", "assigned_analyst_id?", "discipline?", "status?", "limit?", "offset?"]
    output: ExaminationRequest[]
    side_effects: []
  - method: GET
    path: "/lab/assignments"
    description: "List assignments, optionally narrowed by request, holder, supersede pointer or status"
    roles: [LabDirector, QualityManager, CaseManager, Analyst]
    code: 200
    input: ["examination_request_id?", "analyst_id?", "superseded_by_assignment_id?", "status?", "limit?", "offset?"]
    output: Assignment[]
    side_effects: []
  - method: GET
    path: "/lab/review-records"
    description: "List immutable review records, optionally narrowed by request, reviewing examiner or review type, ordered by recorded_at_utc ASC"
    roles: [LabDirector, QualityManager, CaseManager, Analyst]
    code: 200
    input: ["examination_request_id?", "reviewer_analyst_id?", "review_type?", "limit?", "offset?"]
    output: ReviewRecord[]
    side_effects: []
  - method: GET
    path: "/lab/proficiency-tests"
    description: "List proficiency tests, optionally narrowed by examiner, method, cycle, status or graded result"
    roles: [LabDirector, QualityManager, Analyst]
    code: 200
    input: ["analyst_id?", "method_id?", "test_cycle?", "status?", "result?", "limit?", "offset?"]
    output: ProficiencyTest[]
    side_effects: []
  - method: GET
    path: "/lab/vendor-engagements"
    description: "List vendor engagements, optionally narrowed by request, vendor or status - the view used to reconcile encumbrance against the vendor ledger"
    roles: [LabDirector, QualityManager, CaseManager]
    code: 200
    input: ["examination_request_id?", "vendor_id?", "status?", "limit?", "offset?"]
    output: VendorEngagement[]
    side_effects: []
  - method: GET
    path: "/lab/nonconformances"
    description: "List nonconformances, optionally narrowed by request, implicated examiner, origin, severity or status"
    roles: [LabDirector, QualityManager, CaseManager, Analyst]
    code: 200
    input: ["examination_request_id?", "analyst_id?", "source?", "severity?", "status?", "limit?", "offset?"]
    output: Nonconformance[]
    side_effects: []
  - method: GET
    path: "/lab/court-events"
    description: "List testimony blocks, optionally narrowed by request, examiner or status, ordered by start_utc ASC"
    roles: [LabDirector, QualityManager, CaseManager, Analyst]
    code: 200
    input: ["examination_request_id?", "analyst_id?", "status?", "limit?", "offset?"]
    output: CourtEvent[]
    side_effects: []

  # ---------------------------------------------------------------- reads: computed
  - method: GET
    path: "/lab/analysts/{analyst_id}/workload"
    description: "Computed read exposing both variants of calculations.analyst_workload_variants side by side, plus the casework-versus-training ratio"
    roles: [LabDirector, QualityManager, CaseManager, Analyst]
    code: 200
    input: []
    output: "{ analyst_id: string, available_hours: number, projected_load_hours: number, projected_utilization_pct: number, realized_load_hours: number, realized_utilization_pct: number, casework_training_ratio: number, active_assignment_count: integer, assigned_casework_hours: number }"
    side_effects: []
  - method: GET
    path: "/lab/backlog-report"
    description: "Computed read exposing calculations.backlog_aging_index - the weighted aging index, the half-open age buckets and the outsourcing recommendation - optionally narrowed to one discipline and evaluated at an arbitrary instant"
    roles: [LabDirector, QualityManager, CaseManager]
    code: 200
    input: ["discipline?", "as_of_utc?"]
    output: "{ as_of_utc: datetime, open_request_count: integer, backlog_index: number, bucket_0_29_count: integer, bucket_30_59_count: integer, bucket_60_89_count: integer, bucket_90_plus_count: integer, p1_open_count: integer, outsourcing_recommended: boolean }"
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # ---- auth ----
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-Role or X-User-ID header absent or supplied as an empty string"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The X-Role value is unrecognised, or the role is not listed in the endpoint's roles per the §1.7 matrix"
  - id: ERR_ANALYST_IDENTITY_MISMATCH
    http: 403
    condition: "An Analyst caller's X-User-ID differs from the analyst the operation acts as (assigned_analyst_id on start-analysis and complete-analysis, analyst_id on proficiency-test submit)"

  # ---- schema ----
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Unparseable body, missing required field, unknown field, wrong type, value outside a declared enum domain or numeric range, or a malformed ISO-8601 instant"
  - id: ERR_INVALID_INTERVAL
    http: 422
    condition: "An interval endpoint pair is not strictly increasing: window_end_utc <= window_start_utc on a vendor engagement, or end_utc <= start_utc on a court event"

  # ---- existence ----
  - id: ERR_ANALYST_NOT_FOUND
    http: 404
    condition: "An analyst_id in a path segment or request body resolves to no Analyst row"
  - id: ERR_METHOD_NOT_FOUND
    http: 404
    condition: "A method_id in a path segment or request body resolves to no Method row"
  - id: ERR_CASE_NOT_FOUND
    http: 404
    condition: "A case_id in a path segment or request body resolves to no Case row"
  - id: ERR_EVIDENCE_ITEM_NOT_FOUND
    http: 404
    condition: "An evidence_item_id in a path segment or request body resolves to no EvidenceItem row"
  - id: ERR_EXAM_REQUEST_NOT_FOUND
    http: 404
    condition: "An examination_request_id in a path segment or request body resolves to no ExaminationRequest row"
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "An assignment_id path segment resolves to no Assignment row"
  - id: ERR_REVIEW_RECORD_NOT_FOUND
    http: 404
    condition: "A review_record_id path segment resolves to no ReviewRecord row"
  - id: ERR_PROFICIENCY_TEST_NOT_FOUND
    http: 404
    condition: "A proficiency_test_id path segment resolves to no ProficiencyTest row"
  - id: ERR_VENDOR_NOT_FOUND
    http: 404
    condition: "A vendor_id in a path segment or request body resolves to no Vendor row"
  - id: ERR_VENDOR_ENGAGEMENT_NOT_FOUND
    http: 404
    condition: "A vendor_engagement_id path segment resolves to no VendorEngagement row"
  - id: ERR_NONCONFORMANCE_NOT_FOUND
    http: 404
    condition: "A nonconformance_id path segment resolves to no Nonconformance row"
  - id: ERR_COURT_EVENT_NOT_FOUND
    http: 404
    condition: "A court_event_id path segment resolves to no CourtEvent row"

  # ---- uniqueness ----
  - id: ERR_DUPLICATE_RESOURCE
    http: 409
    condition: "A scoped uniqueness key is already taken: (submitting_agency, agency_case_number), (case_id, item_number), (evidence_item_id, method_id) among non-CANCELLED requests, (analyst_id, method_id, test_cycle), or (docket_number, analyst_id) among non-CANCELLED court events"

  # ---- state ----
  - id: ERR_CASE_INVALID_STATE
    http: 409
    condition: "The case's workflow_status or discovery_status admits no transition for the requested trigger"
  - id: ERR_EVIDENCE_CUSTODY_INVALID_STATE
    http: 409
    condition: "The evidence item's custody_status admits no transition for the requested trigger - checkout of an item not IN_VAULT, check-in of an item not IN_ANALYSIS, or any movement of a CONSUMED or RETURNED item"
  - id: ERR_EXAM_REQUEST_INVALID_STATE
    http: 409
    condition: "The examination request's status admits no transition for the requested trigger"
  - id: ERR_METHOD_INVALID_STATE
    http: 409
    condition: "Validating a method that is not DRAFT, or retiring a method that is not VALIDATED"
  - id: ERR_PT_INVALID_STATE
    http: 409
    condition: "Submitting a proficiency test that is not ASSIGNED, or scoring one that is not SUBMITTED"
  - id: ERR_VENDOR_ENGAGEMENT_INVALID_STATE
    http: 409
    condition: "Confirming shipment on an engagement that is not AWARDED, recording a return on one that is not AT_VENDOR, or cancelling one already RETURNED or CANCELLED"
  - id: ERR_NONCONFORMANCE_INVALID_STATE
    http: 409
    condition: "Submitting a root cause on a finding that is not OPEN, deciding CAPA on one that is not ROOT_CAUSE_SUBMITTED, or verify-closing one that is not CAPA_APPROVED"
  - id: ERR_COURT_EVENT_INVALID_STATE
    http: 409
    condition: "Confirming a block that is not SCHEDULED, completing one that is not CONFIRMED, or cancelling one already TESTIFIED or CANCELLED"
  - id: ERR_ANALYST_INVALID_QUALIFICATION_STATE
    http: 409
    condition: "Reinstating an analyst whose qualification_state is not SUSPENDED"
  - id: ERR_CASE_HAS_NO_EVIDENCE
    http: 409
    condition: "Accepting a case that has no EvidenceItem row"
  - id: ERR_CASE_HAS_OPEN_REQUESTS
    http: 409
    condition: "Reporting a case whose open_examination_request_count is greater than 0"
  - id: ERR_CASE_HAS_NO_RELEASED_REQUEST
    http: 409
    condition: "Reporting a case whose released_examination_request_count is 0, or fulfilling discovery on a case with no RELEASED examination request"
  - id: ERR_DISCOVERY_ALREADY_RECEIVED
    http: 409
    condition: "Logging a discovery request on a case whose discovery_status is not NONE"
  - id: ERR_DISCOVERY_NOT_PENDING
    http: 409
    condition: "Responding to discovery on a case whose discovery_status is not RECEIVED"
  - id: ERR_COURT_EVENT_NOT_ELAPSED
    http: 409
    condition: "Completing a testimony block while the logical clock is strictly before end_utc"

  # ---- concurrency ----
  - id: ERR_STALE_EXAM_REQUEST_VERSION
    http: 412
    condition: "expected_examination_request_version does not equal the ExaminationRequest's current version on the assignment-create endpoint"
  - id: ERR_STALE_CASE_VERSION
    http: 412
    condition: "expected_case_version does not equal the Case's current version on the priority-override endpoint"

  # ---- referential and safety ----
  - id: ERR_REFERENTIAL_MISMATCH
    http: 409
    condition: "Named rows exist but do not belong together: evidence_item.case_id != case_id, the method's discipline is inadmissible for the item's item_type per METHOD_ITEM_TYPE_MATRIX, or a court event's analyst_id is not the request's assigned_analyst_id"
  - id: ERR_EVIDENCE_SEAL_BROKEN
    http: 409
    condition: "A case being accepted has an EvidenceItem with seal_intact false, or an item with a broken seal is checked out of the vault"
  - id: ERR_METHOD_NOT_VALIDATED
    http: 409
    condition: "The named method's validation_status is DRAFT or RETIRED when a request is raised or analysis is started"
  - id: ERR_METHOD_VALIDATION_EXPIRED
    http: 409
    condition: "The named method is VALIDATED but validation_expires_at_utc is at or before the logical clock when analysis is started"
  - id: ERR_METHOD_VALIDATION_INSUFFICIENT
    http: 422
    condition: "A validation study reports validation_study_item_count below MIN_VALIDATION_STUDY_ITEMS or precision_cv_pct above MAX_VALIDATION_CV_PCT"
  - id: ERR_METHOD_NOT_CONSUMPTIVE
    http: 409
    condition: "complete-analysis sets evidence_consumed true on a method whose is_consumptive is false"

  # ---- analyst standing and eligibility ----
  - id: ERR_ANALYST_NOT_ACTIVE
    http: 409
    condition: "The subject analyst's employment_status is not ACTIVE"
  - id: ERR_ANALYST_DECERTIFIED
    http: 409
    condition: "The subject analyst's qualification_state is DECERTIFIED - the absorbing state permits no assignment, review or reinstatement"
  - id: ERR_ANALYST_NOT_QUALIFIED
    http: 409
    condition: "The subject analyst's qualification_state is SUSPENDED, or is PROBATION where the operation demands QUALIFIED (technical review, or any bench work outside the P3_ROUTINE remediation window)"
  - id: ERR_PROBATION_PRIORITY_RESTRICTED
    http: 409
    condition: "A PROBATION analyst is offered an assignment on a case whose effective priority_class is P1_STATUTORY or P2_VIOLENT"
  - id: ERR_TRAINING_MINIMUM_NOT_MET
    http: 409
    condition: "A PROBATION analyst whose training_hours_per_week is below REMEDIATION_TRAINING_MIN_HOURS is offered any assignment"
  - id: ERR_ANALYST_DISCIPLINE_MISMATCH
    http: 409
    condition: "The subject analyst's disciplines array does not contain the method's discipline"
  - id: ERR_ANALYST_COMPETENCY_INSUFFICIENT
    http: 409
    condition: "The subject analyst's competency_level is below the method's min_competency_level on the ordered integer scale 1 < 2 < 3 < 4 < 5"
  - id: ERR_ANALYST_ALREADY_ASSIGNED
    http: 409
    condition: "A reassignment names the analyst who already holds the request's ACTIVE Assignment"
  - id: ERR_ANALYST_CAPACITY_EXCEEDED
    http: 409
    condition: "The subject analyst's post-assignment projected utilization would exceed UTILIZATION_CEILING_PCT of available_hours; exactly 100.00 percent is admitted"
  - id: ERR_NO_ELIGIBLE_ANALYST
    http: 409
    condition: "auto-assign finds an empty candidate pool after applying the eligibility filter of calculations.analyst_selection_ranking"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "The acting reviewer is the same person as a party they may not review: technical reviewer equal to assigned_analyst_id, or administrative reviewer equal to the technical reviewer of the same revision_round"
  - id: ERR_OPEN_NONCONFORMANCE_BLOCKS_REINSTATEMENT
    http: 409
    condition: "Reinstating a SUSPENDED analyst who still has a Nonconformance with status OPEN, ROOT_CAUSE_SUBMITTED or CAPA_APPROVED"
  - id: ERR_REINSTATEMENT_PT_REQUIRED
    http: 409
    condition: "Reinstating a SUSPENDED analyst with no SCORED ProficiencyTest whose result is PASS and whose scored_at_utc is after suspended_at_utc"

  # ---- constraints, capacity and money ----
  - id: ERR_ITEM_COUNT_EXCEEDS_METHOD_LIMIT
    http: 422
    condition: "An examination request's item_count exceeds the named method's max_items_per_request"
  - id: ERR_VENDOR_NOT_ACCREDITED
    http: 409
    condition: "The named vendor's accredited_disciplines does not contain the request's discipline, or accreditation_expires_at_utc is at or before the engagement's window_end_utc"
  - id: ERR_VENDOR_SUSPENDED
    http: 409
    condition: "The named vendor's status is SUSPENDED when a new award is attempted"
  - id: ERR_VENDOR_CAPACITY_EXCEEDED
    http: 409
    condition: "The count of the vendor's AWARDED or AT_VENDOR engagements whose closed windows intersect the requested closed window, plus one, exceeds concurrent_case_capacity; windows that merely touch at an endpoint DO intersect"
  - id: ERR_VENDOR_CEILING_EXCEEDED
    http: 402
    condition: "encumbered_cents + spent_cents + the computed award_amount_cents would exceed the vendor's contract_ceiling_cents"
  - id: ERR_TESTIMONY_SCHEDULE_CONFLICT
    http: 409
    condition: "A testimony block, padded by TRAVEL_BUFFER_MINUTES on both ends, intersects another SCHEDULED or CONFIRMED block of the same analyst; a gap of exactly TRAVEL_BUFFER_MINUTES is admitted"
  - id: ERR_INSUFFICIENT_TESTIMONY_NOTICE
    http: 422
    condition: "notice_days is below MIN_TESTIMONY_NOTICE_DAYS and subpoena_received is not true"

# =============================================================================
# 1.7 RBAC Matrix (segregation of duties)
# =============================================================================
roles:
  - name: EvidenceTechnician
    description: "Front-counter custody staff: submits cases, logs and releases physical evidence, and decides intake acceptance or rejection"
    identity: "opaque"
    exclusive_operations:
      - "POST /lab/cases"
      - "POST /lab/cases/{case_id}/accept"
      - "POST /lab/cases/{case_id}/reject"
      - "POST /lab/evidence-items"
      - "POST /lab/evidence-items/{evidence_item_id}/return"
    shared_operations:
      - "GET /lab/cases"
      - "GET /lab/cases/{case_id}"
      - "GET /lab/evidence-items"
      - "GET /lab/evidence-items/{evidence_item_id}"
  - name: CaseManager
    description: "Casework coordinator: raises and routes examination requests, assigns and reassigns examiners, awards and administers vendor engagements, performs administrative review, reports cases, handles discovery, owns corrective-action plans and manages the testimony calendar"
    identity: "opaque"
    exclusive_operations:
      - "POST /lab/examination-requests"
      - "POST /lab/examination-requests/{examination_request_id}/assignments"
      - "POST /lab/examination-requests/{examination_request_id}/auto-assign"
      - "POST /lab/examination-requests/{examination_request_id}/administrative-review"
      - "POST /lab/examination-requests/{examination_request_id}/vendor-engagements"
      - "POST /lab/vendor-engagements/{vendor_engagement_id}/confirm-shipment"
      - "POST /lab/vendor-engagements/{vendor_engagement_id}/record-return"
      - "POST /lab/vendor-engagements/{vendor_engagement_id}/cancel"
      - "POST /lab/cases/{case_id}/report"
      - "POST /lab/cases/{case_id}/discovery-request"
      - "POST /lab/cases/{case_id}/discovery-response"
      - "POST /lab/nonconformances/{nonconformance_id}/root-cause"
      - "POST /lab/court-events"
