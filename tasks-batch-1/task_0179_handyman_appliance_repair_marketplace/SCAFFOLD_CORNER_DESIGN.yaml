scaffold_corner_design:

  # =====================================================================
  # Entities
  # =====================================================================
  - section: entities
    instances:
      - name: create_service_category_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.ServiceCategory, endpoints]
        distinguishing_aspect: "POST /service-categories with all required fields returns 201 and echoes code, name, pricing_model; id and created_at are system-minted."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /service-categories"
              payload: { code: "CAT_CREATE", name: "Create Cat", pricing_model: "HOURLY", hourly_rate_cents: 9000 }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
          assert:
            - "response status == 201"
            - "ServiceCategory(${cat_id}).code == CAT_CREATE"
            - "ServiceCategory(${cat_id}).pricing_model == HOURLY"
            - "ServiceCategory(${cat_id}).id is a non-prefixed UUID"

      - name: get_job_not_found_returns_404
        claim_type: Not Found
        grounds: ["entities.Job", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /jobs/{id} with a random non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /jobs/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "error_id == ERR_NOT_FOUND"

      - name: create_job_missing_required_category_id_returns_invalid_request
        claim_type: Required Fields
        grounds: ["entities.Job.fields.category_id", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /jobs omitting category_id returns ERR_INVALID_REQUEST (400); category_id is source=input with no default."
        test_recipe:
          setup: ["a registered customer"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "cf1@x.com", full_name: "CF One", zip_code: "30301" }
              as: Anonymous
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /jobs"
              payload: { customer_id: "${cust_id}", address_zip_code: "30301" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: service_category_default_requires_license_false_applied
        claim_type: Defaults
        grounds: [entities.ServiceCategory.fields.requires_license]
        distinguishing_aspect: "Omitting requires_license on POST /service-categories yields the default false."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /service-categories"
              payload: { code: "CAT_DEF", name: "Default Cat", pricing_model: "FLAT", flat_task_fee_cents: 9000 }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
          assert:
            - "ServiceCategory(${cat_id}).requires_license == false"
            - "ServiceCategory(${cat_id}).instant_quote_eligible == false"
            - "ServiceCategory(${cat_id}).callback_warranty_days == 30"

      - name: pro_default_truck_markup_pct_applied
        claim_type: Defaults
        grounds: [entities.Pro.fields.truck_stock_markup_pct]
        distinguishing_aspect: "Registering a pro without truck_stock_markup_pct yields the default 0.25."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /pros"
              payload: { email: "pdef@x.com", full_name: "P Def", home_zip_code: "30301" }
              as: Anonymous
              captures: { pro_id: $.data.id }
          assert:
            - "Pro(${pro_id}).truck_stock_markup_pct == 0.25"
            - "Pro(${pro_id}).background_check_status == PENDING"
            - "Pro(${pro_id}).license_status == NONE"
            - "Pro(${pro_id}).callback_rate == 0"

      - name: service_category_invalid_pricing_model_enum_rejected
        claim_type: Type Constraints
        grounds: ["entities.ServiceCategory.fields.pricing_model", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /service-categories with pricing_model not in {HOURLY,FLAT} returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /service-categories"
              payload: { code: "CAT_BAD", name: "Bad Cat", pricing_model: "SUBSCRIPTION" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: service_category_flat_without_fee_semantic_invalid
        claim_type: Type Constraints
        grounds: ["entities.ServiceCategory.fields.flat_task_fee_cents", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "A FLAT category with flat_task_fee_cents omitted/null passes shape but fails semantic validation -> ERR_VALIDATION (422)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /service-categories"
              payload: { code: "CAT_FLATNULL", name: "Flat Null", pricing_model: "FLAT" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "error_id == ERR_VALIDATION"

      - name: service_category_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.ServiceCategory]
        distinguishing_aspect: "ServiceCategory has common_fields=false; its GET response exposes id and created_at but no version or updated_at."
        test_recipe:
          setup: ["one created category"]
          setup_api_calls:
            - call: "POST /service-categories"
              payload: { code: "CAT_IMMUT", name: "Immut Cat", pricing_model: "HOURLY", hourly_rate_cents: 9000 }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
          trigger:
            - call: "GET /service-categories/${cat_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "ServiceCategory(${cat_id}).created_at is present"
            - "ServiceCategory(${cat_id}) response has no version field"

  # =====================================================================
  # State Machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: instant_quote_on_eligible_category_succeeds
        claim_type: valid_transition
        grounds: [state_machines.Job.REQUESTED_to_INSTANT_QUOTED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / job_branches_instant_vs_estimate_from_requested
          rationale: "The valid REQUESTED->INSTANT_QUOTED transition is asserted by the named §1.8 branching instance."

      - name: cancel_already_cancelled_job_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.Job.REQUESTED_to_CANCELLED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A second cancel on a CANCELLED job fails with ERR_INVALID_STATE (409); CANCELLED is terminal so no transition is defined."
        test_recipe:
          setup: ["a REQUESTED job that has been cancelled"]
          setup_api_calls:
            - call: "POST /service-categories"
              payload: { code: "SM_CANC", name: "SM Cancel", pricing_model: "HOURLY", hourly_rate_cents: 9000 }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "csm1@x.com", full_name: "C SM1", zip_code: "30301" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /jobs"
              payload: { customer_id: "${cust_id}", category_id: "${cat_id}", address_zip_code: "30301" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_id: $.data.id }
            - call: "POST /jobs/${job_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /jobs/${job_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_INVALID_STATE"
            - "Job(${job_id}).status == CANCELLED"

      - name: new_job_starts_in_requested_initial_state
        claim_type: initial_state
        grounds: ["entities.Job.fields.status", "entities.Job.fields.pro_id", "entities.Job.fields.quote_path"]
        distinguishing_aspect: "A newly created Job has status REQUESTED, pro_id null, quote_path null."
        test_recipe:
          setup: ["a customer and an instant-eligible category"]
          setup_api_calls:
            - call: "POST /service-categories"
              payload: { code: "SM_INIT", name: "SM Init", pricing_model: "HOURLY", hourly_rate_cents: 9000 }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "csm2@x.com", full_name: "C SM2", zip_code: "30301" }
              as: Anonymous
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /jobs"
              payload: { customer_id: "${cust_id}", category_id: "${cat_id}", address_zip_code: "30301" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_id: $.data.id }
          assert:
            - "Job(${job_id}).status == REQUESTED"
            - "Job(${job_id}).pro_id == null"
            - "Job(${job_id}).quote_path == null"

      - name: instant_quote_supersedes_then_estimate_quote_marks_old_superseded
        claim_type: side_effect_execution
        grounds: [state_machines.Job.ESTIMATE_REQUESTED_to_ESTIMATED, entities.Quote.fields.superseded]
        distinguishing_aspect: "Submitting a second IN_HOME quote on a job with a prior non-accepted quote sets the prior Quote.superseded=true while the new quote is not superseded."
        test_recipe:
          setup: ["an ESTIMATE_REQUESTED job with one IN_HOME quote from a CLEARED pro"]
          setup_api_calls:
            - call: "POST /service-categories"
              payload: { code: "SM_SUP", name: "SM Sup", pricing_model: "HOURLY", hourly_rate_cents: 9000, skill_tags: ["hvac"] }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "csm3@x.com", full_name: "C SM3", zip_code: "30301" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /pros"
              payload: { email: "psm3@x.com", full_name: "P SM3", home_zip_code: "30301", skill_tags: ["hvac"] }
              as: Anonymous
              captures: { pro_id: $.data.id }
            - call: "POST /pros/${pro_id}/background-checks"
              payload: { check_type: "CRIMINAL" }
              as: PlatformAdmin
              captures: { bc1: $.data.id }
            - call: "POST /background-checks/${bc1}/decide"
              payload: { decision: "PASS" }
              as: PlatformAdmin
            - call: "POST /pros/${pro_id}/background-checks"
              payload: { check_type: "IDENTITY" }
              as: PlatformAdmin
              captures: { bc2: $.data.id }
            - call: "POST /background-checks/${bc2}/decide"
              payload: { decision: "PASS" }
              as: PlatformAdmin
            - call: "POST /jobs"
              payload: { customer_id: "${cust_id}", category_id: "${cat_id}", address_zip_code: "30301" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_id: $.data.id }
            - call: "POST /jobs/${job_id}/request-estimate"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /jobs/${job_id}/quotes"
              payload: { estimated_labor_hours: 2.0 }
              as: Pro
              as_user_id: "${pro_id}"
              captures: { q_old: $.data.id }
          trigger:
            - call: "POST /jobs/${job_id}/quotes"
              payload: { estimated_labor_hours: 3.0 }
              as: Pro
              as_user_id: "${pro_id}"
              captures: { q_new: $.data.id }
          assert:
            - "Quote(${q_old}).superseded == true"
            - "Quote(${q_new}).superseded == false"
            - "Job(${job_id}).status == ESTIMATED"

      - name: terminal_refunded_invoice_cannot_be_paid_again
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Invoice.PAID_to_REFUNDED", "errors[ERR_INVALID_STATE]"]
        excluded_because:
          difficulty_instance: compensating_invariant / refund_to_wallet_conserves_money_cents
          rationale: "REFUNDED is reached and asserted terminal within the named §1.8 conservation instance; a follow-on pay would be ERR_INVALID_STATE off that same terminal state."

      - name: dispute_resolve_from_open_without_review_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.Dispute.UNDER_REVIEW_to_APPROVED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Resolving a Dispute still in OPEN (never reviewed) fails with ERR_INVALID_STATE; APPROVE is only defined from UNDER_REVIEW."
        test_recipe:
          setup: ["a paid invoice with an OPEN (un-reviewed) dispute"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /service-categories"
              payload: { code: "SM_DISP", name: "SM Disp", pricing_model: "FLAT", flat_task_fee_cents: 12000, instant_quote_eligible: true, instant_quote_flat_cents: 15000, skill_tags: ["plumb"] }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "csm4@x.com", full_name: "C SM4", zip_code: "30301" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /pros"
              payload: { email: "psm4@x.com", full_name: "P SM4", home_zip_code: "30301", skill_tags: ["plumb"] }
              as: Anonymous
              captures: { pro_id: $.data.id }
            - call: "POST /pros/${pro_id}/background-checks"
              payload: { check_type: "CRIMINAL" }
              as: PlatformAdmin
              captures: { bc1: $.data.id }
            - call: "POST /background-checks/${bc1}/decide"
              payload: { decision: "PASS" }
              as: PlatformAdmin
            - call: "POST /pros/${pro_id}/background-checks"
              payload: { check_type: "IDENTITY" }
              as: PlatformAdmin
              captures: { bc2: $.data.id }
            - call: "POST /background-checks/${bc2}/decide"
              payload: { decision: "PASS" }
              as: PlatformAdmin
            - call: "POST /dispatch-windows"
              payload: { pro_id: "${pro_id}", window_start: "2026-06-01T10:00:00.000Z", window_end: "2026-06-01T12:00:00.000Z", service_zip_code: "30301" }
              as: Pro
              as_user_id: "${pro_id}"
              captures: { win_id: $.data.id, win_v: $.data.version }
            - call: "POST /jobs"
              payload: { customer_id: "${cust_id}", category_id: "${cat_id}", address_zip_code: "30301" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_id: $.data.id }
            - call: "POST /jobs/${job_id}/instant-quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { q_id: $.data.id }
            - call: "POST /jobs/${job_id}/accept-quote"
              payload: { quote_id: "${q_id}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /dispatch-windows/${win_id}/book"
              payload: { job_id: "${job_id}", expected_dispatchwindow_version: "${win_v}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /jobs/${job_id}/visits"
              payload: { dispatch_window_id: "${win_id}", arrived_at: "2026-06-01T10:30:00.000Z" }
              as: Pro
              as_user_id: "${pro_id}"
            - call: "POST /jobs/${job_id}/invoices"
              payload: {}
              as: Pro
              as_user_id: "${pro_id}"
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/issue"
              payload: {}
              as: Pro
              as_user_id: "${pro_id}"
            - call: "POST /jobs/${job_id}/complete"
              payload: {}
              as: Pro
              as_user_id: "${pro_id}"
            - call: "POST /invoices/${inv_id}/pay"
              payload: { amount_cents: 14500 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /disputes"
              payload: { job_id: "${job_id}", invoice_id: "${inv_id}", reason: "OVERCHARGED", requested_refund_cents: 5000 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { disp_id: $.data.id }
          trigger:
            - call: "POST /disputes/${disp_id}/resolve"
              payload: { decision: "APPROVE", approved_refund_cents: 5000 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_INVALID_STATE"
            - "Dispute(${disp_id}).status == OPEN"

      - name: partial_refund_keeps_invoice_paid_not_refunded
        claim_type: side_effect_execution
        grounds: [state_machines.Dispute.UNDER_REVIEW_to_APPROVED, calculations.invoice_reconciliation, entities.Invoice.fields.balance_due_cents]
        distinguishing_aspect: "An APPROVED dispute with approved_refund_cents (5000) < amount_paid (14500) leaves Invoice.status PAID, refunded_cents=5000, balance_due_cents=5000."
        test_recipe:
          setup: ["a paid invoice (14500) with a dispute in UNDER_REVIEW"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /service-categories"
              payload: { code: "SM_PART", name: "SM Part", pricing_model: "FLAT", flat_task_fee_cents: 12000, instant_quote_eligible: true, instant_quote_flat_cents: 15000, skill_tags: ["plumb"] }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "csm5@x.com", full_name: "C SM5", zip_code: "30301" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /pros"
              payload: { email: "psm5@x.com", full_name: "P SM5", home_zip_code: "30301", skill_tags: ["plumb"] }
              as: Anonymous
              captures: { pro_id: $.data.id }
            - call: "POST /pros/${pro_id}/background-checks"
              payload: { check_type: "CRIMINAL" }
              as: PlatformAdmin
              captures: { bc1: $.data.id }
            - call: "POST /background-checks/${bc1}/decide"
              payload: { decision: "PASS" }
              as: PlatformAdmin
            - call: "POST /pros/${pro_id}/background-checks"
              payload: { check_type: "IDENTITY" }
              as: PlatformAdmin
              captures: { bc2: $.data.id }
            - call: "POST /background-checks/${bc2}/decide"
              payload: { decision: "PASS" }
              as: PlatformAdmin
            - call: "POST /dispatch-windows"
              payload: { pro_id: "${pro_id}", window_start: "2026-06-01T10:00:00.000Z", window_end: "2026-06-01T12:00:00.000Z", service_zip_code: "30301" }
              as: Pro
              as_user_id: "${pro_id}"
              captures: { win_id: $.data.id, win_v: $.data.version }
            - call: "POST /jobs"
              payload: { customer_id: "${cust_id}", category_id: "${cat_id}", address_zip_code: "30301" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_id: $.data.id }
            - call: "POST /jobs/${job_id}/instant-quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { q_id: $.data.id }
            - call: "POST /jobs/${job_id}/accept-quote"
              payload: { quote_id: "${q_id}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /dispatch-windows/${win_id}/book"
              payload: { job_id: "${job_id}", expected_dispatchwindow_version: "${win_v}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /jobs/${job_id}/visits"
              payload: { dispatch_window_id: "${win_id}", arrived_at: "2026-06-01T10:30:00.000Z" }
              as: Pro
              as_user_id: "${pro_id}"
            - call: "POST /jobs/${job_id}/invoices"
              payload: {}
              as: Pro
              as_user_id: "${pro_id}"
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/issue"
              payload: {}
              as: Pro
              as_user_id: "${pro_id}"
            - call: "POST /jobs/${job_id}/complete"
              payload: {}
              as: Pro
              as_user_id: "${pro_id}"
            - call: "POST /invoices/${inv_id}/pay"
              payload: { amount_cents: 14500 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /disputes"
              payload: { job_id: "${job_id}", invoice_id: "${inv_id}", reason: "OVERCHARGED", requested_refund_cents: 5000, refund_destination: "ORIGINAL" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { disp_id: $.data.id }
            - call: "POST /disputes/${disp_id}/review"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /disputes/${disp_id}/resolve"
              payload: { decision: "APPROVE", approved_refund_cents: 5000 }
              as: PlatformAdmin
          assert:
            - "Invoice(${inv_id}).refunded_cents == 5000"
            - "Invoice(${inv_id}).status == PAID"
            - "Invoice(${inv_id}).balance_due_cents == 5000"

  # =====================================================================
  # Calculations
  # =====================================================================
  - section: calculations
    instances:
      - name: part_line_truck_stock_markup_normal_band
        claim_type: correct_result
        grounds: [calculations.part_line_pricing, entities.PartLine.fields.line_total_cents]
        distinguishing_aspect: "Truck-stock part unit_cost 4000 x qty 2 = base 8000, markup round(8000*0.35)=2800 (within cap/floor) -> line_total 10800."
        test_recipe:
          setup: ["an IN_PROGRESS job with assigned pro markup 0.35"]
          setup_api_calls:
            - call: "POST /service-categories"
              payload: { code: "CALC_TRK", name: "Calc Truck", pricing_model: "HOURLY", hourly_rate_cents: 9000, instant_quote_eligible: true, instant_quote_flat_cents: 15000, skill_tags: ["appliance"] }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "ccalc1@x.com", full_name: "C Calc1", zip_code: "30301" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /pros"
              payload: { email: "pcalc1@x.com", full_name: "P Calc1", home_zip_code: "30301", skill_tags: ["appliance"], truck_stock_markup_pct: 0.35 }
              as: Anonymous
              captures: { pro_id: $.data.id }
            - call: "POST /pros/${pro_id}/background-checks"
              payload: { check_type: "CRIMINAL" }
              as: PlatformAdmin
              captures: { bc1: $.data.id }
            - call: "POST /background-checks/${bc1}/decide"
              payload: { decision: "PASS" }
              as: PlatformAdmin
            - call: "POST /pros/${pro_id}/background-checks"
              payload: { check_type: "IDENTITY" }
              as: PlatformAdmin
              captures: { bc2: $.data.id }
            - call: "POST /background-checks/${bc2}/decide"
              payload: { decision: "PASS" }
              as: PlatformAdmin
            - call: "POST /dispatch-windows"
              payload: { pro_id: "${pro_id}", window_start: "2026-06-12T10:00:00.000Z", window_end: "2026-06-12T12:00:00.000Z", service_zip_code: "30301" }
