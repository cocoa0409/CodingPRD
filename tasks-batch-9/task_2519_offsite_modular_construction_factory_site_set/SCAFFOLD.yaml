# =============================================================================
# PRD-Bench Scaffold — task_2519_offsite_modular_construction_factory_site_set
# Sections §1.0 – §1.7. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2519. Offsite Modular Construction Factory & Site Set (volumetric modular manufacturer):
  design freeze and factory-compatible detailing with module splits and connection design,
  permitting bifurcation between state modular program approval and local site permits,
  factory production line takt time, module sequencing and quality inspections by a
  third-party agency, shipping envelope constraints, transport permits and route surveys,
  crane pick planning, site set sequencing and weather exposure protection, module-to-module
  connection and site-built scope coordination, factory versus field defect responsibility
  and warranty allocation, financing draw structure with deposits on factory work in progress

domain_name: offsite-modular-construction-factory-site-set
api_prefix: /modular

# -----------------------------------------------------------------------------
# Step 0: Complexity Profile
# -----------------------------------------------------------------------------
complexity_profile:
  difficulty_level: expert_plus          # §0.4 Expert band, pushed on coupling density
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects
    - version_pinning_on_approval
    - optimistic_concurrency
    - dual_variant_calculation

  entity_topology: graph
  # graph: DesignPackage.supersedes_package_id is self-referential (revision chain);
  # ModuleUnit points at Project + DesignPackage + Shipment; DefectClaim points at
  # ModuleUnit + InspectionRecord; PermitRecord pins a DesignPackage. No URL nesting —
  # every resource is addressed flat under /modular/<collection>/{id} and joined by FK.

  state_machine_shape: parallel
  # ModuleUnit carries three independent state dimensions on one row
  # (production_status × qc_status × site_status) with cross-dimension guards.
  # DesignPackage.freeze_state is cyclic (IN_REVIEW → REVISION_REQUIRED → IN_REVIEW),
  # PermitRecord.status is branching (UNDER_REVIEW → {APPROVED, DENIED, CONDITIONS_ISSUED}),
  # DefectClaim.status is cyclic (ADJUDICATED → DISPUTED → ADJUDICATED),
  # Project.phase is compound (derived from children).

  relationship_patterns:
    - one_to_many          # Project → ModuleUnit / PermitRecord / Shipment / DrawRequest
    - self_referential     # DesignPackage.supersedes_package_id → DesignPackage.id
    - cross_aggregate      # DefectClaim → InspectionRecord; DrawRequest → InspectionAgency
    - polymorphic_discriminator  # PermitRecord.track bifurcates state vs local jurisdiction

  role_model: segregation_of_duties
  # A DesignEngineer may not review the freeze package they submitted; the agency that
  # certified factory WIP for a draw may not be the agency of record for the QC
  # inspections in that draw's basis; state-track permits are decided only by the
  # StateProgramOfficer and local-track permits only by the AuthorityHavingJurisdiction.

  consistency_model: immediate

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# -----------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# -----------------------------------------------------------------------------
entities:

  - name: Factory
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: plant display name
      - name: code
        type: string
        source: input
        description: short plant code, globally unique
        constraints: "unique across Factory"
      - name: takt_minutes
        type: integer
        source: input
        description: base takt — minutes a module occupies one line station
        constraints: ">= 1"
      - name: station_count
        type: integer
        source: input
        description: number of sequential stations on the production line
        constraints: ">= 1"
      - name: parallel_station_capacity
        type: integer
        source: input
        description: how many modules may occupy the line concurrently (aggregate interval capacity)
        constraints: ">= 1"
      - name: wip_unit_value_cents
        type: integer
        source: input
        description: value of one module at 100% factory completion, in cents
        constraints: ">= 0"
      - name: shift_start_minute_of_day
        type: integer
        source: input
        description: first minute of the production shift (UTC minutes past midnight)
        default: 360
        constraints: "0..1439"
      - name: shift_minutes_per_day
        type: integer
        source: input
        description: productive minutes available per calendar day — the shift window a
          slot must *start* inside is [shift_start_minute_of_day, shift_start_minute_of_day + shift_minutes_per_day)
        default: 1080
        constraints: "1..1440"
      - name: line_state
        type: enum
        source: input
        description: line posture gating slot scheduling and station advance
        default: RUNNING
        constraints: "RUNNING | PAUSED | SHUTDOWN"
      - name: committed_line_minutes
        type: integer
        source: computed
        description: >-
          conserved capacity ledger — sum of (line_slot_end - line_slot_start) in whole
          minutes over every ModuleUnit whose project.factory_id == this Factory and whose
          production_status IN {SLOTTED, IN_LINE}
        default: 0

  - name: InspectionAgency
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: third-party inspection agency name
      - name: agency_code
        type: string
        source: input
        description: agency short code, globally unique
        constraints: "unique across InspectionAgency"
      - name: accreditation_state
        type: enum
        source: input
        description: accreditation posture; SUSPENDED agencies cannot record results or certify draws
        default: ACCREDITED
        constraints: "ACCREDITED | PROBATION | SUSPENDED"
      - name: accredited_state_codes
        type: array
        source: input
        description: array of 2-letter state codes this agency is accredited in
        constraints: "non-empty array of 2-character uppercase strings"
      - name: per_inspection_fee_cents
        type: integer
        source: input
        description: agency fee per recorded inspection, in cents
        constraints: ">= 0"
      - name: hold_authority
        type: boolean
        source: input
        description: whether this agency may place an AGENCY_HOLD on a module
        default: true

  - name: Project
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: project display name
      - name: factory_id
        type: string
        source: input
        description: FK -> Factory.id; plant that manufactures this project's modules
      - name: state_code
        type: string
        source: input
        description: 2-letter state whose modular program approves the design
        constraints: "2-character uppercase"
      - name: ahj_code
        type: string
        source: input
        description: local authority-having-jurisdiction code for site permits
      - name: planned_module_count
        type: integer
        source: input
        description: number of modules the building is split into
        constraints: ">= 1"
      - name: contract_price_cents
        type: integer
        source: input
        description: total contract value in cents
        constraints: ">= 0"
      - name: deposit_pct
        type: number
        source: input
        description: fraction of factory work-in-progress value financeable as a deposit draw
        default: 0.20
        constraints: "0 < deposit_pct <= 1"
      - name: retainage_pct
        type: number
        source: input
        description: fraction of each certified draw withheld as retainage
        default: 0.05
        constraints: "0 <= retainage_pct < 1"
      - name: crane_capacity_chart
        type: array
        source: input
        description: >-
          ordered array of objects { radius_ft: integer, capacity_lb: integer } forming the
          crane's derated capacity chart; radius_ft values are strictly ascending and
          capacity_lb values are strictly descending
        constraints: "non-empty; radius_ft strictly ascending"
      - name: crane_rigging_buffer_minutes
        type: integer
        source: input
        description: rig-up/rig-down buffer applied to both ends of every crane pick window
        default: 45
        constraints: ">= 0"
      - name: set_sequence_policy
        type: enum
        source: input
        description: ordering discipline enforced when modules are set on the foundation
        default: STRICT_ASCENDING
        constraints: "STRICT_ASCENDING | PAIRED_FIRST"
      - name: weather_exposure_limit_hours
        type: number
        source: input
        description: maximum hours a set module may stay open before protection is deemed breached
        default: 8.0
        constraints: "> 0"
      - name: forecast_precip_probability_pct
        type: number
        source: system
        description: latest observed precipitation probability for the site, 0..100
        default: 0
      - name: forecast_wind_gust_mph
        type: number
        source: system
        description: latest observed wind gust for the site; derates crane capacity at >= 20
        default: 0
      - name: last_weather_observed_at
        type: datetime
        source: system
        description: observed_at of the most recent weather observation; null before the first
        default: null
      - name: permit_posture
        type: enum
        source: computed
        description: derived bifurcation posture over this project's PermitRecords (see calculations.permit_posture_derivation)
        default: DUAL_BLOCKED
        constraints: "DUAL_BLOCKED | STATE_CLEARED_ONLY | SITE_CLEARED_ONLY | SET_CLEARED | OCCUPANCY_CLEARED"
      - name: phase
        type: enum
        source: computed
        description: derived project phase over children (see calculations.project_phase_derivation)
        default: PRECONSTRUCTION
        constraints: "PRECONSTRUCTION | DESIGN_FROZEN | IN_PRODUCTION | SHIPPING | SETTING | CLOSEOUT"
      - name: wip_certified_cents
        type: integer
        source: computed
        description: >-
          conserved money ledger — equals SUM(DrawRequest.certified_cents) over DrawRequests
          of this project whose status IN {CERTIFIED, FUNDED}
        default: 0
      - name: funded_to_date_cents
        type: integer
        source: computed
        description: sum of net_funded_cents over this project's DrawRequests with status == FUNDED
        default: 0
      - name: modules_set_count
        type: integer
        source: computed
        description: count of this project's ModuleUnits with site_status IN {SET, CONNECTED}
        default: 0
      - name: modules_connected_count
        type: integer
        source: computed
        description: count of this project's ModuleUnits with site_status == CONNECTED
        default: 0

  - name: DesignPackage
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK -> Project.id; project this design revision belongs to
      - name: revision_index
        type: integer
        source: input
        description: >-
          1-based revision number chosen by the detailing engineer; must be strictly greater than the
          revision_index of any package it supersedes
        constraints: ">= 1"
      - name: supersedes_package_id
        type: string
        source: input
        description: FK -> DesignPackage.id; predecessor revision this package replaces; null on revision 1
        default: null
      - name: freeze_state
        type: enum
        source: system
        description: design-freeze lifecycle state
        default: DRAFT
        constraints: "DRAFT | IN_REVIEW | REVISION_REQUIRED | FROZEN | SUPERSEDED"
      - name: revision_round
        type: integer
        source: system
        description: >-
          number of times this package has entered IN_REVIEW; incremented by every accepted submit
          (0 while the package has never been submitted), so the two visits to IN_REVIEW in the
          revision cycle are distinguishable
        default: 0
      - name: module_split_count
        type: integer
        source: input
        description: number of volumetric modules the building is split into by this revision
        constraints: ">= 1"
      - name: connection_detail_state
        type: enum
        source: input
        description: maturity of module-to-module connection detailing in this revision
        default: NOT_STARTED
        constraints: "NOT_STARTED | FACTORY_DETAILED | FIELD_COORDINATED | COMPLETE"
      - name: open_connection_conflicts
        type: integer
        source: input
        description: count of unresolved module-to-module connection clashes in this revision
        default: 0
        constraints: ">= 0"
      - name: field_scope_items_open
        type: integer
        source: input
        description: count of site-built scope items not yet coordinated with the factory scope
        default: 0
        constraints: ">= 0"
      - name: factory_compatibility_score
        type: number
        source: computed
        description: 0..100 detailing-readiness score (see calculations.design_factory_compatibility_score)
        default: 0
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the DesignEngineer who submitted the package for review; null while DRAFT
        default: null
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the DesignEngineer who issued the most recent review decision
        default: null
      - name: review_note
        type: string
        source: input
        description: free-text note captured with the most recent review decision
        default: null

  - name: ModuleUnit
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK -> Project.id; project this module belongs to
      - name: design_package_id
        type: string
        source: input
        description: FK -> DesignPackage.id; the revision this module was detailed against
      - name: shipment_id
        type: string
        source: system
        description: FK -> Shipment.id; shipment currently carrying this module; null when at factory
        default: null
      - name: module_code
        type: string
        source: input
        description: shop code for the module
        constraints: "unique per project_id"
      - name: pair_role
        type: enum
        source: input
        description: role in a paired module split (mated pair sharing a corridor wall)
        default: SINGLE
        constraints: "SINGLE | PAIR_A | PAIR_B"
      - name: pair_group_code
        type: string
        source: input
        description: shared code linking PAIR_A to PAIR_B; null when pair_role == SINGLE
        default: null
      - name: set_sequence_index
        type: integer
        source: input
        description: 1-based crane set order position
        constraints: ">= 1; unique per project_id"
      - name: width_in
        type: integer
        source: input
        description: shipping width in inches
        constraints: ">= 1"
      - name: length_in
        type: integer
        source: input
        description: shipping length in inches
        constraints: ">= 1"
      - name: height_in
        type: integer
        source: input
        description: shipping height in inches, measured on the carrier
        constraints: ">= 1"
      - name: gross_weight_lb
        type: integer
        source: input
        description: gross module weight in pounds
        constraints: ">= 1"
      - name: envelope_class
        type: enum
        source: computed
        description: shipping envelope classification (see calculations.module_envelope_class)
        constraints: "STANDARD | OVERWIDTH | SUPERLOAD"
      - name: production_status
        type: enum
        source: system
        description: factory production dimension
        default: PLANNED
        constraints: "PLANNED | SLOTTED | IN_LINE | LINE_COMPLETE"
      - name: qc_status
        type: enum
        source: system
        description: third-party quality dimension
        default: PENDING
        constraints: "PENDING | IN_PROGRESS | HOLD | CONDITIONAL_RELEASE | RELEASED"
      - name: site_status
        type: enum
        source: system
        description: logistics and site dimension
        default: AT_FACTORY
        constraints: "AT_FACTORY | LOADED | IN_TRANSIT | DELIVERED | SET | CONNECTED"
      - name: station_index
        type: integer
        source: system
        description: number of line stations completed, 0..factory.station_count
        default: 0
      - name: line_slot_start
        type: datetime
        source: system
        description: start of this module's half-open factory line occupancy [start, end)
        default: null
      - name: line_slot_end
        type: datetime
        source: system
        description: exclusive end of this module's factory line occupancy
        default: null
      - name: line_slot_minutes
        type: integer
        source: computed
        description: whole minutes of line occupancy held by this module (see calculations.line_slot_schedule)
        default: 0
      - name: pick_window_start
        type: datetime
        source: system
        description: start of the closed crane pick window [start, end]
        default: null
      - name: pick_window_end
        type: datetime
        source: system
        description: inclusive end of the closed crane pick window
        default: null
      - name: pick_radius_ft
        type: integer
        source: input
        description: crane working radius selected for this pick, in feet
        default: null
      - name: rigging_weight_lb
        type: integer
        source: input
        description: spreader/rigging weight added to gross_weight_lb for the crane check
        default: null
      - name: crane_utilization_pct
        type: number
        source: computed
        description: display-only crane utilization for the scheduled pick, 2 decimals (see calculations.crane_pick_feasibility)
        default: null
      - name: connection_scope_owner
        type: enum
        source: input
        description: who owns the module-to-module connection scope at this module's interface
        default: FIELD
        constraints: "FACTORY | FIELD | SHARED"
      - name: set_at
        type: datetime
        source: system
        description: clock time the module was landed on the foundation
        default: null
      - name: connected_at
        type: datetime
        source: system
        description: clock time module-to-module connections were signed off
        default: null
      - name: exposure_open_hours
        type: number
        source: computed
        description: hours the set module stayed open to weather (see calculations.module_exposure_hours)
        default: 0
      - name: wip_earned_cents
        type: integer
        source: computed
        description: station-progress earned value of factory work in progress (see calculations.module_wip_earned_cents)
        default: 0
      - name: defect_count_factory
        type: integer
        source: computed
        description: count of DefectClaims on this module with discovered_phase IN {FACTORY, TRANSIT}
        default: 0
      - name: defect_count_field
        type: integer
        source: computed
        description: count of DefectClaims on this module with discovered_phase IN {SITE_SET, POST_SET}
        default: 0

  - name: PermitRecord
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK -> Project.id; project this application belongs to
      - name: track
        type: enum
        source: input
        description: bifurcation discriminator — state modular program vs local jurisdiction
        constraints: "STATE_MODULAR_PROGRAM | LOCAL_AHJ"
      - name: scope
        type: enum
        source: input
        description: >-
          what the application covers; PLAN_REVIEW and INSIGNIA are valid only on track
          STATE_MODULAR_PROGRAM, FOUNDATION / SET / OCCUPANCY only on track LOCAL_AHJ
        constraints: "PLAN_REVIEW | INSIGNIA | FOUNDATION | SET | OCCUPANCY"
      - name: status
        type: enum
        source: system
        description: application lifecycle state
        default: SUBMITTED
        constraints: "SUBMITTED | UNDER_REVIEW | CONDITIONS_ISSUED | APPROVED | DENIED | EXPIRED"
      - name: pinned_package_id
        type: string
        source: system
        description: >-
          FK -> DesignPackage.id; the DesignPackage revision pinned when a
          STATE_MODULAR_PROGRAM / PLAN_REVIEW application was approved; null otherwise
        default: null
      - name: conditions_count
        type: integer
        source: system
        description: number of condition sets issued against this application over its life
        default: 0
      - name: insignia_count_issued
        type: integer
        source: system
        description: insignia labels released; set to project.planned_module_count when an INSIGNIA scope is approved
        default: 0
      - name: decided_at
        type: datetime
        source: system
        description: clock time of the most recent decision
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the officer or AHJ who issued the most recent decision
        default: null
      - name: expires_at
        type: datetime
        source: input
        description: expiry instant of an approval; null means the approval never expires
        default: null

  - name: InspectionRecord
    parent: ModuleUnit
    common_fields: true
    fields:
      - name: module_id
        type: string
        source: input
        description: FK -> ModuleUnit.id; module under inspection
      - name: agency_id
        type: string
        source: input
        description: FK -> InspectionAgency.id; third-party agency performing the inspection
      - name: stage
        type: enum
        source: input
        description: inspection stage; IN_PLANT has stage_index 1, FINAL_FACTORY has stage_index 2
        constraints: "IN_PLANT | FINAL_FACTORY"
      - name: result
        type: enum
        source: system
        description: recorded outcome
        default: PENDING
        constraints: "PENDING | PASS | CONDITIONAL | FAIL"
      - name: defect_count
        type: integer
        source: input
        description: number of nonconformances observed; supplied when the result is recorded
        default: 0
        constraints: ">= 0"
      - name: severity_max
        type: integer
        source: input
        description: worst nonconformance severity 0..5; supplied when the result is recorded
        default: 0
        constraints: "0..5"
      - name: hold_state
        type: enum
        source: system
        description: agency hold posture on this record
        default: NONE
        constraints: "NONE | AGENCY_HOLD | CLEARED"
      - name: corrective_note
        type: string
        source: input
        description: corrective-action narrative captured with a result or a hold clearance
        default: null
      - name: recorded_at
        type: datetime
        source: system
        description: clock time the result was recorded
        default: null
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the ThirdPartyInspector who recorded the result
        default: null

  - name: Shipment
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK -> Project.id; project whose modules this load carries
      - name: carrier_code
        type: string
        source: input
        description: trucking carrier code
      - name: route_state_codes
        type: array
        source: input
        description: ordered array of 2-letter state codes the route traverses, origin first
        constraints: "non-empty array of 2-character uppercase strings"
      - name: planned_departure_at
        type: datetime
        source: input
        description: planned gate-out instant from the factory
      - name: planned_arrival_at
        type: datetime
        source: input
        description: planned arrival instant at the site
        constraints: "must be strictly after planned_departure_at"
      - name: status
        type: enum
        source: system
        description: transport lifecycle dimension
        default: DRAFT
        constraints: "DRAFT | SURVEY_REQUIRED | PERMITTED | DISPATCHED | DELIVERED | CANCELLED"
      - name: route_survey_state
        type: enum
        source: system
        description: independent route-survey dimension, driven by the loaded envelope class
        default: NOT_REQUIRED
        constraints: "NOT_REQUIRED | REQUIRED | COMPLETED"
      - name: survey_completed_at
        type: datetime
        source: input
        description: instant the route survey was completed; null until submitted
        default: null
      - name: escort_required
        type: boolean
        source: computed
        description: true when max_envelope_class == SUPERLOAD (see calculations.shipment_permit_fee_and_escort)
        default: false
      - name: escort_confirmed
        type: boolean
        source: input
        description: whether escort vehicles were confirmed with the route survey
        default: false
      - name: permit_expires_at
        type: datetime
        source: input
        description: expiry of the transport permit issued off the route survey; null before survey
        default: null
      - name: permit_fee_cents
        type: integer
        source: computed
        description: transport permit fee across route states (see calculations.shipment_permit_fee_and_escort)
        default: 0
      - name: loaded_module_count
        type: integer
        source: computed
        description: count of ModuleUnits whose shipment_id == this Shipment
        default: 0
      - name: max_envelope_class
        type: enum
        source: computed
        description: worst envelope_class among loaded modules, STANDARD when none loaded
        default: STANDARD
        constraints: "STANDARD | OVERWIDTH | SUPERLOAD"
      - name: dispatched_at
        type: datetime
        source: system
        description: clock time of dispatch
        default: null
      - name: delivered_at
        type: datetime
        source: system
        description: clock time of delivery
        default: null
      - name: cancel_reason
        type: string
        source: input
        description: free-text reason captured on cancellation
        default: null

  - name: DefectClaim
    parent: ModuleUnit
    common_fields: true
    fields:
      - name: module_id
        type: string
        source: input
        description: FK -> ModuleUnit.id; module the defect was found on
      - name: inspection_id
        type: string
        source: input
        description: FK -> InspectionRecord.id; inspection that evidences the defect; null when none
        default: null
      - name: discovered_phase
        type: enum
        source: input
        description: phase in which the defect was discovered
        constraints: "FACTORY | TRANSIT | SITE_SET | POST_SET"
      - name: description
        type: string
        source: input
        description: defect narrative
      - name: repair_cost_cents
        type: integer
        source: input
        description: total repair cost to allocate, in cents
        constraints: ">= 0"
      - name: responsibility
        type: enum
        source: computed
        description: allocated responsibility bucket (see calculations.defect_responsibility_allocation)
        default: UNDETERMINED
        constraints: "UNDETERMINED | FACTORY | FIELD | SHARED"
      - name: factory_share_pct
        type: number
        source: computed
        description: percent of repair cost allocated to the factory, 2 decimals
        default: 0
      - name: field_share_pct
        type: number
        source: computed
        description: 100.00 - factory_share_pct, pinned as the exact complement
        default: 0
      - name: factory_charge_cents
        type: integer
        source: computed
        description: cents charged to the factory warranty account
        default: 0
      - name: field_charge_cents
        type: integer
        source: computed
        description: repair_cost_cents - factory_charge_cents, pinned as the exact complement
        default: 0
      - name: warranty_bucket
        type: enum
        source: computed
        description: warranty account the charge lands in
        default: SPLIT
        constraints: "FACTORY_WARRANTY | FIELD_WARRANTY | SPLIT"
      - name: status
        type: enum
        source: system
        description: adjudication lifecycle state
        default: OPEN
        constraints: "OPEN | ADJUDICATED | DISPUTED | CLOSED"
      - name: adjudication_round
        type: integer
        source: system
        description: number of adjudications performed; selects the allocation variant
        default: 0
      - name: adjudicated_by_user_id
        type: string
        source: system
        description: X-User-ID of the WarrantyAdjudicator who ran the most recent adjudication
        default: null
      - name: dispute_note
        type: string
        source: input
        description: narrative captured when a party disputes an adjudication
        default: null

  - name: DrawRequest
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK -> Project.id; project being financed
      - name: draw_index
        type: integer
        source: input
        description: >-
          1-based draw number supplied by the lender; must equal 1 + the project's highest existing draw_index
        constraints: ">= 1"
      - name: basis_mode
        type: enum
        source: input
        description: which earned-value variant computes this draw's basis
        constraints: "WIP_DEPOSIT | MILESTONE_SET"
      - name: certifying_agency_id
        type: string
        source: input
        description: FK -> InspectionAgency.id; independent agency that must certify the basis
      - name: basis_module_count
        type: integer
        source: computed
        description: count of ModuleUnits inside the basis at creation time
        default: 0
      - name: basis_earned_cents
        type: integer
        source: computed
        description: summed earned value of the basis at creation time, per-module rounding first
        default: 0
      - name: requested_cents
        type: integer
        source: computed
        description: amount requested at creation (see calculations.draw_certification_amount)
        default: 0
      - name: certified_basis_cents
        type: integer
        source: computed
        description: basis recomputed at certification time
        default: 0
      - name: certified_cents
        type: integer
        source: computed
        description: amount certified by the independent agency
        default: 0
      - name: retainage_held_cents
        type: integer
        source: computed
        description: retainage withheld from the certified amount
        default: 0
      - name: net_funded_cents
        type: integer
        source: computed
        description: certified_cents - retainage_held_cents, disbursed on funding
        default: 0
      - name: status
        type: enum
        source: system
        description: draw lifecycle state
        default: DRAFT
        constraints: "DRAFT | CERTIFIED | FUNDED | REJECTED"
      - name: certified_at
        type: datetime
        source: system
        description: clock time of certification
        default: null
      - name: funded_at
        type: datetime
        source: system
        description: clock time of funding
        default: null
      - name: reject_reason
        type: string
        source: input
        description: free-text reason captured on rejection
        default: null

# -----------------------------------------------------------------------------
# §1.2 State Machine Table
# -----------------------------------------------------------------------------
state_machines:

  # ---- DesignPackage: cyclic revision loop + supersession -------------------
  - entity: DesignPackage
    dimension: freeze_state
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /modular/design-packages/{packageId}/submit"
        actor: DesignEngineer
        preconditions:
          - "freeze_state == DRAFT"
          - "no other DesignPackage of the same project_id has freeze_state == IN_REVIEW"
        side_effects:
          - "recompute factory_compatibility_score per calculations.design_factory_compatibility_score"
          - "increment revision_round by 1"
          - "set submitted_by_user_id = X-User-ID of the caller"
          - "increment DesignPackage.version by 1"
      - from: IN_REVIEW
        to: FROZEN
        trigger: "POST /modular/design-packages/{packageId}/review-decision with decision == FREEZE"
        actor: DesignEngineer
        preconditions:
          - "freeze_state == IN_REVIEW"
          - "X-User-ID != submitted_by_user_id (segregation of duties)"
          - "factory_compatibility_score >= 70"
          - "module_split_count == project.planned_module_count"
        side_effects:
          - "set reviewed_by_user_id = X-User-ID, review_note = payload.review_note"
          - "CASCADE LINK 2 — when supersedes_package_id is not null, the predecessor DesignPackage transitions FROZEN -> SUPERSEDED"
          - "recompute project.phase per calculations.project_phase_derivation (PRECONSTRUCTION -> DESIGN_FROZEN when no module is IN_LINE yet)"
          - "increment DesignPackage.version and Project.version by 1"
      - from: IN_REVIEW
        to: REVISION_REQUIRED
        trigger: "POST /modular/design-packages/{packageId}/review-decision with decision == RETURN_FOR_REVISION"
        actor: DesignEngineer
        preconditions:
          - "freeze_state == IN_REVIEW"
          - "X-User-ID != submitted_by_user_id (segregation of duties)"
        side_effects:
          - "set reviewed_by_user_id = X-User-ID, review_note = payload.review_note"
          - "clear submitted_by_user_id back to null so the next submit records a fresh submitter"
          - "increment DesignPackage.version by 1"
        note: "divergent branch — no project.phase change and no supersession fire on this arm"
      - from: REVISION_REQUIRED
        to: IN_REVIEW
        trigger: "POST /modular/design-packages/{packageId}/submit (revision loop)"
        actor: DesignEngineer
        preconditions:
          - "freeze_state == REVISION_REQUIRED"
          - "no other DesignPackage of the same project_id has freeze_state == IN_REVIEW"
        side_effects:
          - "recompute factory_compatibility_score from the package's current detailing fields"
          - "increment revision_round by 1"
          - "set submitted_by_user_id = X-User-ID of the caller"
          - "increment DesignPackage.version by 1"
        note: "this arm closes the cycle IN_REVIEW -> REVISION_REQUIRED -> IN_REVIEW"
      - from: FROZEN
        to: SUPERSEDED
        trigger: "system — a successor DesignPackage whose supersedes_package_id == this id reaches FROZEN"
        actor: system
        preconditions:
          - "freeze_state == FROZEN"
          - "successor DesignPackage.freeze_state == FROZEN and successor.supersedes_package_id == this.id"
        side_effects:
          - "CASCADE LINK 3 — every PermitRecord whose pinned_package_id == this.id and status == APPROVED transitions APPROVED -> CONDITIONS_ISSUED with conditions_count += 1"
          - "increment DesignPackage.version by 1"

  # ---- ModuleUnit dimension 1: factory production ---------------------------
  - entity: ModuleUnit
    dimension: production_status
    initial_state: PLANNED
    terminal_states: [LINE_COMPLETE]
    transitions:
      - from: PLANNED
        to: SLOTTED
        trigger: "POST /modular/modules/{moduleId}/schedule-line-slot"
        actor: FactoryProductionManager
        preconditions:
          - "production_status == PLANNED"
          - "qc_status != HOLD"
          - "factory.line_state == RUNNING (cross-entity: Factory identified by project.factory_id)"
          - "a PermitRecord of the project with track == STATE_MODULAR_PROGRAM, scope == PLAN_REVIEW, status == APPROVED and (expires_at is null or expires_at > now) exists"
          - "payload.line_slot_start >= current clock instant"
          - "count of ModuleUnits of the same factory with production_status IN {SLOTTED, IN_LINE} whose [line_slot_start, line_slot_end) contains payload.line_slot_start is < factory.parallel_station_capacity"
        side_effects:
          - "compute line_slot_minutes and line_slot_end per calculations.line_slot_schedule; persist line_slot_start / line_slot_end"
          - "factory.committed_line_minutes += line_slot_minutes; increment Factory.version by 1"
          - "recompute wip_earned_cents per calculations.module_wip_earned_cents variant station_progress (station_index == 0 so the value is 0)"
          - "increment ModuleUnit.version by 1"
      - from: SLOTTED
        to: PLANNED
        trigger: "POST /modular/modules/{moduleId}/release-line-slot, or system release from the design-supersession cascade"
        actor: FactoryProductionManager | system
        preconditions:
          - "production_status == SLOTTED"
        side_effects:
          - "factory.committed_line_minutes -= line_slot_minutes (compensating action; the ledger returns to its pre-schedule value); increment Factory.version by 1"
          - "clear line_slot_start, line_slot_end; set line_slot_minutes = 0"
          - "recompute project.phase per calculations.project_phase_derivation"
          - "increment ModuleUnit.version and Project.version by 1"
      - from: SLOTTED
        to: IN_LINE
        trigger: "POST /modular/modules/{moduleId}/advance-station (first advance)"
        actor: FactoryProductionManager
        preconditions:
          - "production_status == SLOTTED"
          - "qc_status != HOLD"
          - "factory.line_state == RUNNING"
        side_effects:
          - "station_index += payload.stations_advanced (default 1), capped at factory.station_count"
          - "recompute wip_earned_cents per calculations.module_wip_earned_cents variant station_progress"
          - "recompute project.phase (DESIGN_FROZEN -> IN_PRODUCTION)"
          - "increment ModuleUnit.version and Project.version by 1"
      - from: IN_LINE
        to: IN_LINE
        trigger: "POST /modular/modules/{moduleId}/advance-station (intermediate advance leaving station_index < factory.station_count)"
        actor: FactoryProductionManager
        preconditions:
          - "production_status == IN_LINE"
          - "station_index + payload.stations_advanced < factory.station_count"
          - "qc_status != HOLD"
          - "factory.line_state == RUNNING"
        side_effects:
          - "station_index += payload.stations_advanced"
          - "recompute wip_earned_cents per calculations.module_wip_earned_cents variant station_progress"
          - "recompute basis_earned_cents / requested_cents of every DrawRequest of the project with status == DRAFT"
          - "increment ModuleUnit.version by 1"
      - from: IN_LINE
        to: LINE_COMPLETE
        trigger: "POST /modular/modules/{moduleId}/advance-station reaching station_index >= factory.station_count"
        actor: FactoryProductionManager
        preconditions:
          - "production_status IN {SLOTTED, IN_LINE}"
          - "station_index + payload.stations_advanced >= factory.station_count"
          - "qc_status != HOLD"
          - "factory.line_state == RUNNING"
        side_effects:
          - "station_index = factory.station_count"
          - "factory.committed_line_minutes -= line_slot_minutes (line released; the [start,end) interval stays on the module as history but no longer occupies capacity); increment Factory.version by 1"
          - "recompute wip_earned_cents (station_progress variant now yields the full factory.wip_unit_value_cents)"
          - "recompute basis_earned_cents / requested_cents of every DrawRequest of the project with status == DRAFT"
          - "increment ModuleUnit.version by 1"

  # ---- ModuleUnit dimension 2: third-party quality -------------------------
  - entity: ModuleUnit
    dimension: qc_status
    initial_state: PENDING
    terminal_states: [RELEASED]
    transitions:
      - from: PENDING
        to: IN_PROGRESS
        trigger: "POST /modular/inspections (first InspectionRecord created for this module)"
        actor: ThirdPartyInspector
        preconditions:
          - "qc_status == PENDING"
          - "production_status IN {IN_LINE, LINE_COMPLETE}"
        side_effects:
          - "increment ModuleUnit.version by 1"
      - from: IN_PROGRESS
        to: RELEASED
        trigger: "POST /modular/inspections/{inspectionId}/record-result with result == PASS on stage FINAL_FACTORY"
        actor: ThirdPartyInspector
        preconditions:
          - "qc_status == IN_PROGRESS"
          - "the IN_PLANT InspectionRecord of this module has result IN {PASS, CONDITIONAL}"
        side_effects:
          - "increment ModuleUnit.version by 1"
      - from: IN_PROGRESS
        to: CONDITIONAL_RELEASE
        trigger: "POST /modular/inspections/{inspectionId}/record-result with result == CONDITIONAL on stage FINAL_FACTORY"
        actor: ThirdPartyInspector
        preconditions:
          - "qc_status == IN_PROGRESS"
          - "the IN_PLANT InspectionRecord of this module has result IN {PASS, CONDITIONAL}"
        side_effects:
          - "increment ModuleUnit.version by 1"
        note: "CONDITIONAL_RELEASE is loadable but re-inspectable — the only state from which a second FINAL_FACTORY record may be opened"
      - from: IN_PROGRESS
        to: HOLD
        trigger: "POST /modular/inspections/{inspectionId}/record-result with result == FAIL"
        actor: ThirdPartyInspector
        preconditions:
          - "qc_status == IN_PROGRESS"
          - "agency.hold_authority == true"
        side_effects:
          - "InspectionRecord.hold_state = AGENCY_HOLD"
          - "increment ModuleUnit.version by 1"
      - from: CONDITIONAL_RELEASE
        to: HOLD
        trigger: "POST /modular/inspections/{inspectionId}/record-result with result == FAIL on a re-opened FINAL_FACTORY record"
        actor: ThirdPartyInspector
        preconditions:
          - "qc_status == CONDITIONAL_RELEASE"
          - "agency.hold_authority == true"
        side_effects:
          - "InspectionRecord.hold_state = AGENCY_HOLD"
          - "CASCADE LINK B2 — because qc_status became HOLD, if shipment_id is not null and that Shipment.status IN {DRAFT, SURVEY_REQUIRED, PERMITTED}, the module is unloaded: shipment_id = null, site_status LOADED -> AT_FACTORY, Shipment.loaded_module_count -= 1, Shipment.status -> DRAFT"
          - "CASCADE LINK B3 — because the Shipment's load changed, recompute max_envelope_class over the remaining loaded modules, then reset route_survey_state / escort_required / permit_expires_at / permit_fee_cents per calculations.shipment_permit_fee_and_escort"
          - "recompute basis_earned_cents / requested_cents of every DrawRequest of the project with status == DRAFT (HOLD modules leave the WIP_DEPOSIT basis)"
          - "increment ModuleUnit.version and (when unloaded) Shipment.version by 1"
      - from: HOLD
        to: IN_PROGRESS
        trigger: "POST /modular/inspections/{inspectionId}/clear-hold"
        actor: ThirdPartyInspector
        preconditions:
          - "qc_status == HOLD"
          - "InspectionRecord.hold_state == AGENCY_HOLD"
          - "agency.accreditation_state IN {ACCREDITED, PROBATION}"
        side_effects:
          - "InspectionRecord.hold_state = CLEARED, result = PENDING, defect_count = 0, severity_max = 0, corrective_note = payload.corrective_note"
          - "recompute basis_earned_cents / requested_cents of every DrawRequest of the project with status == DRAFT"
          - "increment ModuleUnit.version by 1"
        note: "closes the QC cycle IN_PROGRESS -> HOLD -> IN_PROGRESS"

  # ---- ModuleUnit dimension 3: logistics and site --------------------------
  - entity: ModuleUnit
    dimension: site_status
    initial_state: AT_FACTORY
    terminal_states: [CONNECTED]
    transitions:
      - from: AT_FACTORY
        to: LOADED
        trigger: "POST /modular/shipments/{shipmentId}/load-module"
        actor: TransportCoordinator
        preconditions:
          - "site_status == AT_FACTORY"
          - "production_status == LINE_COMPLETE"
          - "qc_status IN {RELEASED, CONDITIONAL_RELEASE}"
          - "Shipment.status IN {DRAFT, SURVEY_REQUIRED}"
          - "ModuleUnit.project_id == Shipment.project_id"
          - "payload.expected_shipment_version == Shipment.version"
        side_effects:
          - "shipment_id = Shipment.id; Shipment.loaded_module_count += 1"
          - "recompute Shipment.max_envelope_class, escort_required, permit_fee_cents and route_survey_state per calculations.shipment_permit_fee_and_escort; Shipment.status DRAFT -> SURVEY_REQUIRED when route_survey_state becomes REQUIRED"
          - "increment ModuleUnit.version and Shipment.version by 1"
      - from: LOADED
        to: AT_FACTORY
        trigger: "POST /modular/shipments/{shipmentId}/cancel, or system unload from the QC-hold cascade"
        actor: TransportCoordinator | system
        preconditions:
          - "site_status == LOADED"
          - "Shipment.status IN {DRAFT, SURVEY_REQUIRED, PERMITTED}"
        side_effects:
          - "shipment_id = null; Shipment.loaded_module_count -= 1 (the pair (loaded_module_count, set of ModuleUnit.shipment_id) is the conserved referential quantity)"
          - "recompute Shipment.max_envelope_class / escort_required / permit_fee_cents / route_survey_state"
          - "increment ModuleUnit.version and Shipment.version by 1"
      - from: LOADED
        to: IN_TRANSIT
        trigger: "POST /modular/shipments/{shipmentId}/dispatch"
        actor: TransportCoordinator
        preconditions:
          - "site_status == LOADED"
          - "Shipment.status == PERMITTED"
        side_effects:
          - "recompute project.phase (-> SHIPPING)"
          - "increment ModuleUnit.version and Project.version by 1"
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /modular/shipments/{shipmentId}/deliver"
        actor: TransportCoordinator
        preconditions:
          - "site_status == IN_TRANSIT"
          - "Shipment.status == DISPATCHED"
        side_effects:
          - "recompute basis_earned_cents / requested_cents of every DrawRequest of the project with status == DRAFT (delivered modules enter the MILESTONE_SET basis)"
          - "increment ModuleUnit.version by 1"
      - from: DELIVERED
        to: SET
        trigger: "POST /modular/modules/{moduleId}/execute-set"
        actor: SiteSuperintendent
        preconditions:
          - "site_status == DELIVERED"
          - "qc_status != HOLD"
          - "pick_window_start is not null"
          - "project.permit_posture IN {SET_CLEARED, OCCUPANCY_CLEARED}"
          - "design_package_id == pinned_package_id of the project's APPROVED STATE_MODULAR_PROGRAM / PLAN_REVIEW PermitRecord"
          - "crane feasibility re-checked against the current project.forecast_wind_gust_mph per calculations.crane_pick_feasibility"
          - "set-order discipline satisfied per project.set_sequence_policy"
        side_effects:
          - "set_at = current clock instant; exposure_open_hours = 0"
          - "project.modules_set_count += 1; recompute project.phase (-> SETTING)"
          - "increment ModuleUnit.version and Project.version by 1"
      - from: SET
        to: CONNECTED
        trigger: "POST /modular/modules/{moduleId}/close-connections"
        actor: SiteSuperintendent
        preconditions:
          - "site_status == SET"
          - "qc_status != HOLD"
          - "payload.field_scope_signed_off == true"
          - "exposure_open_hours recomputed at now is < project.weather_exposure_limit_hours OR project.forecast_precip_probability_pct < 40"
          - "every ModuleUnit of the same pair_group_code (when pair_role != SINGLE) has site_status IN {SET, CONNECTED}"
        side_effects:
          - "connected_at = current clock instant; exposure_open_hours recomputed per calculations.module_exposure_hours"
          - "project.modules_connected_count += 1; recompute project.permit_posture and project.phase"
          - "increment ModuleUnit.version and Project.version by 1"

  # ---- PermitRecord: branching, bifurcated by track ------------------------
  - entity: PermitRecord
    dimension: status
    initial_state: SUBMITTED
    terminal_states: [DENIED, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /modular/permits/{permitId}/decide with decision == START_REVIEW"
        actor: StateProgramOfficer | AuthorityHavingJurisdiction
        preconditions:
          - "status == SUBMITTED"
          - "caller role matches track (StateProgramOfficer <-> STATE_MODULAR_PROGRAM, AuthorityHavingJurisdiction <-> LOCAL_AHJ)"
        side_effects:
          - "decided_at = current clock instant; decided_by_user_id = X-User-ID"
          - "increment PermitRecord.version by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /modular/permits/{permitId}/decide with decision == APPROVE"
        actor: StateProgramOfficer | AuthorityHavingJurisdiction
        preconditions:
          - "status IN {SUBMITTED, UNDER_REVIEW, CONDITIONS_ISSUED}"
          - "caller role matches track"
          - "when scope == PLAN_REVIEW: exactly one DesignPackage of the project has freeze_state == FROZEN"
          - "when scope == INSIGNIA: a PermitRecord of the project with track == STATE_MODULAR_PROGRAM, scope == PLAN_REVIEW, status == APPROVED exists"
        side_effects:
          - "decided_at = current clock instant; decided_by_user_id = X-User-ID; expires_at = payload.expires_at when supplied"
          - "when scope == PLAN_REVIEW: pinned_package_id = id of the project's FROZEN DesignPackage (version pinning on approval)"
          - "when scope == INSIGNIA: insignia_count_issued = project.planned_module_count"
          - "recompute project.permit_posture per calculations.permit_posture_derivation"
          - "increment PermitRecord.version and Project.version by 1"
      - from: UNDER_REVIEW
        to: CONDITIONS_ISSUED
        trigger: "POST /modular/permits/{permitId}/decide with decision == ISSUE_CONDITIONS"
        actor: StateProgramOfficer | AuthorityHavingJurisdiction
        preconditions:
          - "status IN {SUBMITTED, UNDER_REVIEW}"
          - "caller role matches track"
        side_effects:
          - "conditions_count += max(1, payload.conditions_count); decided_at = now; decided_by_user_id = X-User-ID"
          - "recompute project.permit_posture"
          - "increment PermitRecord.version and Project.version by 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /modular/permits/{permitId}/decide with decision == DENY"
        actor: StateProgramOfficer | AuthorityHavingJurisdiction
        preconditions:
          - "status IN {SUBMITTED, UNDER_REVIEW, CONDITIONS_ISSUED}"
          - "caller role matches track"
        side_effects:
          - "decided_at = now; decided_by_user_id = X-User-ID; pinned_package_id cleared to null"
          - "recompute project.permit_posture"
          - "increment PermitRecord.version and Project.version by 1"
        note: "divergent branch — DENIED clears the pin, APPROVED sets it; CONDITIONS_ISSUED leaves it in place"
      - from: APPROVED
        to: CONDITIONS_ISSUED
        trigger: "system — the DesignPackage referenced by pinned_package_id transitions FROZEN -> SUPERSEDED"
        actor: system
        preconditions:
          - "status == APPROVED"
          - "pinned_package_id is not null and that DesignPackage.freeze_state == SUPERSEDED"
        side_effects:
          - "conditions_count += 1; decided_at = current clock instant"
          - "CASCADE LINK 4 — because a STATE_MODULAR_PROGRAM / PLAN_REVIEW approval left APPROVED, recompute project.permit_posture, and every ModuleUnit of the project with production_status == SLOTTED reverts SLOTTED -> PLANNED (releasing factory.committed_line_minutes)"
          - "increment PermitRecord.version and Project.version by 1"
      - from: APPROVED
        to: EXPIRED
        trigger: "system — POST /modular/_clock/set_current_utc advances the clock to an instant >= expires_at"
        actor: system
        preconditions:
          - "status == APPROVED"
          - "expires_at is not null and expires_at <= new clock instant"
        side_effects:
          - "recompute project.permit_posture for every affected project"
          - "increment PermitRecord.version and Project.version by 1"

  # ---- Shipment dimension 1: transport lifecycle ---------------------------
  - entity: Shipment
    dimension: status
    initial_state: DRAFT
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SURVEY_REQUIRED
        trigger: "system — POST /modular/shipments/{shipmentId}/load-module raises max_envelope_class above STANDARD"
        actor: system
        preconditions:
          - "status == DRAFT"
          - "recomputed max_envelope_class IN {OVERWIDTH, SUPERLOAD}"
        side_effects:
          - "route_survey_state NOT_REQUIRED -> REQUIRED; recompute permit_fee_cents and escort_required"
          - "increment Shipment.version by 1"
      - from: DRAFT
        to: PERMITTED
        trigger: "POST /modular/shipments/{shipmentId}/route-survey on a load whose max_envelope_class == STANDARD"
        actor: TransportCoordinator
        preconditions:
          - "status == DRAFT"
          - "loaded_module_count >= 1"
          - "route_survey_state == NOT_REQUIRED"
          - "payload.permit_expires_at > current clock instant"
        side_effects:
          - "route_survey_state NOT_REQUIRED -> COMPLETED; survey_completed_at, permit_expires_at, escort_confirmed persisted from payload"
          - "increment Shipment.version by 1"
      - from: SURVEY_REQUIRED
        to: PERMITTED
        trigger: "POST /modular/shipments/{shipmentId}/route-survey"
        actor: TransportCoordinator
        preconditions:
          - "status == SURVEY_REQUIRED"
          - "route_survey_state == REQUIRED"
          - "payload.escort_confirmed == true when escort_required == true"
          - "payload.permit_expires_at > current clock instant"
        side_effects:
          - "route_survey_state REQUIRED -> COMPLETED; survey_completed_at, permit_expires_at, escort_confirmed persisted"
          - "increment Shipment.version by 1"
      - from: PERMITTED
        to: DISPATCHED
        trigger: "POST /modular/shipments/{shipmentId}/dispatch"
        actor: TransportCoordinator
        preconditions:
          - "status == PERMITTED"
          - "loaded_module_count >= 1"
          - "current clock instant < permit_expires_at"
        side_effects:
          - "dispatched_at = current clock instant"
          - "every loaded ModuleUnit transitions site_status LOADED -> IN_TRANSIT"
          - "recompute project.phase (-> SHIPPING)"
          - "increment Shipment.version, each ModuleUnit.version and Project.version by 1"
      - from: DISPATCHED
        to: DELIVERED
        trigger: "POST /modular/shipments/{shipmentId}/deliver"
        actor: TransportCoordinator
        preconditions:
          - "status == DISPATCHED"
        side_effects:
          - "delivered_at = current clock instant"
          - "every carried ModuleUnit transitions site_status IN_TRANSIT -> DELIVERED"
          - "recompute basis_earned_cents / requested_cents of every DrawRequest of the project with status == DRAFT"
          - "increment Shipment.version and each ModuleUnit.version by 1"
      - from: PERMITTED
        to: CANCELLED
        trigger: "POST /modular/shipments/{shipmentId}/cancel"
        actor: TransportCoordinator
        preconditions:
          - "status IN {DRAFT, SURVEY_REQUIRED, PERMITTED}"
        side_effects:
          - "every loaded ModuleUnit is unloaded: shipment_id = null, site_status LOADED -> AT_FACTORY"
          - "loaded_module_count = 0; max_envelope_class = STANDARD; route_survey_state = NOT_REQUIRED; escort_required = false; permit_fee_cents = 0; permit_expires_at = null; cancel_reason = payload.reason"
          - "recompute project.phase"
          - "increment Shipment.version, each ModuleUnit.version and Project.version by 1"

  # ---- Shipment dimension 2: route survey (independent axis) ---------------
  - entity: Shipment
    dimension: route_survey_state
    initial_state: NOT_REQUIRED
    terminal_states: [COMPLETED]
    transitions:
      - from: NOT_REQUIRED
        to: REQUIRED
        trigger: "system — a loaded module raises max_envelope_class above STANDARD"
        actor: system
        preconditions:
          - "route_survey_state == NOT_REQUIRED"
          - "max_envelope_class IN {OVERWIDTH, SUPERLOAD}"
        side_effects:
          - "recompute permit_fee_cents and escort_required per calculations.shipment_permit_fee_and_escort"
      - from: REQUIRED
        to: NOT_REQUIRED
        trigger: "system — the last non-STANDARD module leaves the load (QC-hold cascade or cancel)"
        actor: system
        preconditions:
          - "route_survey_state == REQUIRED"
          - "recomputed max_envelope_class == STANDARD"
        side_effects:
          - "escort_required = false; permit_fee_cents = 0; permit_expires_at = null; survey_completed_at = null"
        note: "this arm makes the survey axis independent of the transport axis — the load can gain and lose survey obligation without the status axis moving forward"
      - from: REQUIRED
        to: COMPLETED
        trigger: "POST /modular/shipments/{shipmentId}/route-survey"
        actor: TransportCoordinator
        preconditions:
          - "route_survey_state == REQUIRED"
          - "payload.escort_confirmed == true when escort_required == true"
        side_effects:
          - "survey_completed_at = payload.survey_completed_at; permit_expires_at = payload.permit_expires_at"

  # ---- DefectClaim: cyclic adjudication ------------------------------------
  - entity: DefectClaim
    dimension: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: ADJUDICATED
        trigger: "POST /modular/defect-claims/{claimId}/adjudicate"
        actor: WarrantyAdjudicator
        preconditions:
          - "status == OPEN"
        side_effects:
          - "adjudication_round = 1; allocate per calculations.defect_responsibility_allocation variant phase_presumption"
          - "persist responsibility, factory_share_pct, field_share_pct, factory_charge_cents, field_charge_cents, warranty_bucket; adjudicated_by_user_id = X-User-ID"
          - "increment DefectClaim.version by 1"
      - from: ADJUDICATED
        to: DISPUTED
        trigger: "POST /modular/defect-claims/{claimId}/dispute"
        actor: FactoryProductionManager | SiteSuperintendent
        preconditions:
          - "status == ADJUDICATED"
          - "adjudication_round < 2"
        side_effects:
          - "dispute_note = payload.dispute_note"
          - "increment DefectClaim.version by 1"
      - from: DISPUTED
        to: ADJUDICATED
        trigger: "POST /modular/defect-claims/{claimId}/adjudicate (re-adjudication after dispute)"
        actor: WarrantyAdjudicator
        preconditions:
          - "status == DISPUTED"
        side_effects:
          - "adjudication_round = 2; re-allocate per calculations.defect_responsibility_allocation variant evidence_weighted"
          - "overwrite responsibility, factory_share_pct, field_share_pct, factory_charge_cents, field_charge_cents, warranty_bucket; adjudicated_by_user_id = X-User-ID"
          - "increment DefectClaim.version by 1"
        note: "closes the cycle ADJUDICATED -> DISPUTED -> ADJUDICATED; the second pass switches the allocation variant"
      - from: ADJUDICATED
        to: CLOSED
        trigger: "system — POST /modular/modules/{moduleId}/close-connections on the claim's module"
        actor: system
        preconditions:
          - "status == ADJUDICATED"
          - "module.site_status transitions SET -> CONNECTED"
        side_effects:
          - "warranty allocation is frozen; no further dispute is possible"
          - "increment DefectClaim.version by 1"

  # ---- Project: compound phase derived from children -----------------------
  - entity: Project
    dimension: phase
    initial_state: PRECONSTRUCTION
    terminal_states: [CLOSEOUT]
    transitions:
      - from: PRECONSTRUCTION
        to: DESIGN_FROZEN
        trigger: "system — a DesignPackage of the project reaches freeze_state == FROZEN"
        actor: system
        preconditions:
          - "phase == PRECONSTRUCTION"
          - "at least one DesignPackage of the project has freeze_state == FROZEN"
        side_effects:
          - "increment Project.version by 1"
      - from: DESIGN_FROZEN
        to: IN_PRODUCTION
        trigger: "system — a ModuleUnit of the project reaches production_status IN {IN_LINE, LINE_COMPLETE}"
        actor: system
        preconditions:
          - "phase == DESIGN_FROZEN"
        side_effects:
          - "increment Project.version by 1"
      - from: IN_PRODUCTION
        to: SHIPPING
        trigger: "system — a Shipment of the project reaches status IN {DISPATCHED, DELIVERED}"
        actor: system
        preconditions:
          - "phase == IN_PRODUCTION"
        side_effects:
          - "increment Project.version by 1"
      - from: SHIPPING
        to: SETTING
        trigger: "system — a ModuleUnit of the project reaches site_status IN {SET, CONNECTED}"
        actor: system
        preconditions:
          - "phase == SHIPPING"
        side_effects:
          - "increment Project.version by 1"
      - from: SETTING
        to: CLOSEOUT
        trigger: "system — modules_connected_count == planned_module_count"
        actor: system
        preconditions:
          - "phase == SETTING"
          - "project.modules_connected_count == project.planned_module_count"
        side_effects:
          - "recompute project.permit_posture (OCCUPANCY becomes eligible)"
          - "increment Project.version by 1"
      - from: SHIPPING
        to: IN_PRODUCTION
        trigger: "system — the last DISPATCHED/DELIVERED shipment of the project is cancelled or its modules are unloaded"
        actor: system
        preconditions:
          - "phase == SHIPPING"
          - "no Shipment of the project has status IN {DISPATCHED, DELIVERED} and no ModuleUnit has site_status IN {SET, CONNECTED}"
        side_effects:
          - "increment Project.version by 1"
        note: "phase is a pure derivation — it walks backwards whenever the underlying children regress"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent's version — the only mechanism)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: design-revision-create-stale-project
    parent_entity: Project
    write_endpoint: "POST /modular/design-packages"
    occ_field: "expected_project_version"
    description: |
      Creating a DesignPackage revision against a Project whose version has advanced since
      the client last read it is rejected with a stale-version error. A new revision
      legitimately supersedes the frozen predecessor and re-pins every approval that
      referenced it, so the writer must prove its view of the project (posture, phase,
      certified WIP ledger) is current before the supersession chain is allowed to fire.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

  - rule_id: shipment-load-stale-shipment
    parent_entity: Shipment
    write_endpoint: "POST /modular/shipments/{shipmentId}/load-module"
    occ_field: "expected_shipment_version"
    description: |
      Loading a module onto a Shipment whose version has advanced since the client last
      read it is rejected with a stale-version error. Every load recomputes the load's
      envelope class, escort obligation and permit fee, so a writer holding a stale view
      would be deciding transport permitting against an obsolete envelope.
    error_id: ERR_STALE_SHIPMENT_VERSION
    http_status: 412

# -----------------------------------------------------------------------------
# §1.3 Calculation Rules
# -----------------------------------------------------------------------------
calculations:
  - name: module_envelope_class
    trigger: "on POST /modular/modules (create) and whenever width_in / length_in / height_in / gross_weight_lb are supplied; re-read on every shipment load"
    algorithm: threshold
    formula: |
      # tiers are evaluated widest-first so that a single dimension breaching the
      # OVERWIDTH ceiling classifies the whole module as SUPERLOAD
      if width_in > OVERWIDTH_MAX_WIDTH_IN
         or height_in > OVERWIDTH_MAX_HEIGHT_IN
         or gross_weight_lb > OVERWIDTH_MAX_WEIGHT_LB:
          envelope_class = SUPERLOAD
      elif width_in > STANDARD_MAX_WIDTH_IN
           or height_in > STANDARD_MAX_HEIGHT_IN
           or gross_weight_lb > STANDARD_MAX_WEIGHT_LB:
          envelope_class = OVERWIDTH
      else:
          envelope_class = STANDARD
      # length_in never affects the class; it only feeds route-survey obligation
    input_set: "the single ModuleUnit being created or re-measured; no aggregation"
    constants:
      STANDARD_MAX_WIDTH_IN: 192
      STANDARD_MAX_HEIGHT_IN: 162
      STANDARD_MAX_WEIGHT_LB: 80000
      OVERWIDTH_MAX_WIDTH_IN: 216
      OVERWIDTH_MAX_HEIGHT_IN: 174
      OVERWIDTH_MAX_WEIGHT_LB: 120000
    precision: "integer inches and pounds; comparisons are strict > against the ceiling, so a value exactly equal to a ceiling stays in the lower class"

  - name: module_wip_earned_cents
    trigger: "on schedule-line-slot, advance-station, shipment deliver, execute-set, close-connections, and whenever a DrawRequest basis is computed"
    algorithm: aggregation
    formula: |
      # base (station_progress) — factory work in progress
      if production_status IN {SLOTTED, IN_LINE, LINE_COMPLETE} and qc_status != HOLD:
          earned = round_half_up(factory.wip_unit_value_cents * station_index / factory.station_count)
      else:
          earned = 0
    input_set: >-
      one ModuleUnit at a time; the factory is resolved through project.factory_id. ModuleUnit.wip_earned_cents
      always persists the station_progress variant; the milestone_delivered variant is materialised only inside
      draw_certification_amount and is never written to the module row.
    constants:
      HOLD_EARNS_NOTHING: true
    precision: "cents, integer, round_half_up applied per module BEFORE any summation"
    variants:
      - name: station_progress
        when: "DrawRequest.basis_mode == WIP_DEPOSIT — the lender advances a deposit against factory work in progress"
        difference: >-
          pro-rates the unit value by completed stations (station_index / station_count) and includes
          modules that have never left the plant; any module with qc_status == HOLD contributes 0 even
          though its station_index is non-zero
      - name: milestone_delivered
        when: "DrawRequest.basis_mode == MILESTONE_SET — the lender funds against delivery to the site"
        difference: >-
          ignores station_index entirely and pays 100% of factory.wip_unit_value_cents for every module
          whose site_status IN {DELIVERED, SET, CONNECTED}; a LINE_COMPLETE module still at the factory
          contributes 0 under this variant while contributing the full unit value under station_progress,
          and a DELIVERED module contributes the full value under both

  - name: line_slot_schedule
    trigger: "on POST /modular/modules/{moduleId}/schedule-line-slot"
    algorithm: interval_merge
    formula: |
      # mode c — the takt actually achieved degrades with how loaded the line already is
      concurrent_at_start = count of ModuleUnit rows m where
            m.id != this.id
        and m.project.factory_id == this.project.factory_id
        and m.production_status IN {SLOTTED, IN_LINE}
        and m.line_slot_start <= requested_start < m.line_slot_end     # half-open [start, end)
      effective_takt = factory.takt_minutes + TAKT_CONGESTION_PENALTY_MINUTES * concurrent_at_start
      line_slot_minutes = factory.station_count * effective_takt
      line_slot_start   = requested_start
      line_slot_end     = requested_start + line_slot_minutes minutes
      factory.committed_line_minutes += line_slot_minutes
    input_set: >-
      every already-persisted ModuleUnit of the same Factory in production_status SLOTTED or IN_LINE. The
      requesting module is excluded. Slots of modules that reached LINE_COMPLETE have left the line and are
      excluded even though their line_slot_start / line_slot_end remain on the row as history.
    constants:
      TAKT_CONGESTION_PENALTY_MINUTES: 5
    precision: "whole minutes; the interval is half-open [line_slot_start, line_slot_end), so a slot starting exactly at another slot's line_slot_end sees that slot as already finished"

  - name: crane_pick_feasibility
    trigger: "on POST /modular/modules/{moduleId}/schedule-pick and re-evaluated on POST /modular/modules/{moduleId}/execute-set against the project's current forecast"
    algorithm: threshold
    formula: |
      # mode a — chart lookup, then a conditional derate, then an integer cross-multiplication
      chart_entry = the entry of project.crane_capacity_chart with the SMALLEST radius_ft
                    such that radius_ft >= pick_radius_ft
      if no such entry: reject with ERR_PICK_RADIUS_OFF_CHART
      capacity_lb = chart_entry.capacity_lb
      if project.forecast_wind_gust_mph >= WIND_DERATE_GUST_MPH:
          capacity_lb = floor(capacity_lb * WIND_DERATE_FACTOR)
      total_lb = gross_weight_lb + rigging_weight_lb
      crane_utilization_pct = round_half_up(total_lb * 100 / capacity_lb, 2)
      # the gate is an exact integer comparison, NOT the 2-decimal display value
      infeasible = (total_lb * 100) > (MAX_UTILIZATION_PCT * capacity_lb)
    input_set: "the single ModuleUnit being picked plus its Project's crane_capacity_chart and current forecast fields"
    constants:
      MAX_UTILIZATION_PCT: 85
      WIND_DERATE_GUST_MPH: 20
      WIND_DERATE_FACTOR: 0.75
    precision: >-
      crane_utilization_pct is stored to 2 decimal places, round_half_up; the feasibility gate uses the
      integer cross-product so a load that displays exactly 85.00 after rounding can still be infeasible

  - name: draw_certification_amount
    trigger: "on POST /modular/draw-requests (provisional request amount) and again on POST /modular/draw-requests/{drawId}/certify (certified amount)"
    algorithm: waterfall_allocation
    formula: |
      # mode b — per-module rounding, THEN summation, THEN the deposit rate, THEN retainage.
      # The order is normative: rounding each module before summing is observably different
      # from summing the exact fractions and rounding once.
      basis_set = modules of the project selected by basis_mode (see input_set)
      per_module = [ module_wip_earned_cents(m, variant_for(basis_mode)) for m in basis_set
                     ordered by m.created_at ascending ]
      basis_module_count  = count(basis_set)
      basis_earned_cents  = sum(per_module)                       # every term already rounded
      if basis_mode == WIP_DEPOSIT:
          requested_cents = round_half_up(basis_earned_cents * project.deposit_pct)
      else:
          requested_cents = basis_earned_cents                    # milestone draws are funded in full

      # ---- certification (recomputed from live module state, never copied) ----
      certified_basis_cents = the same computation re-run at certification time
      certified_cents       = round_half_up(certified_basis_cents * project.deposit_pct)
                              if basis_mode == WIP_DEPOSIT else certified_basis_cents
      retainage_held_cents  = round_half_up(certified_cents * project.retainage_pct)
      net_funded_cents      = certified_cents - retainage_held_cents

      # ---- fiscal ceiling (validations, ERR_CONTRACT_BALANCE_EXCEEDED) ----
      committed = sum(certified_cents) over DrawRequests of the project
                  with id != this.id and status IN {CERTIFIED, FUNDED}
      ceiling   = round_half_up(project.contract_price_cents * (1 - project.retainage_pct))
      violation = (committed + certified_cents) > ceiling

      # ---- ledger sync ----
      on certify: project.wip_certified_cents += certified_cents
      on reject of a CERTIFIED draw: project.wip_certified_cents -= certified_cents
      on fund:    project.funded_to_date_cents += net_funded_cents
    input_set: >-
      basis_mode == WIP_DEPOSIT selects every ModuleUnit of the project with production_status IN
      {SLOTTED, IN_LINE, LINE_COMPLETE} and qc_status != HOLD. basis_mode == MILESTONE_SET selects every
      ModuleUnit of the project with site_status IN {DELIVERED, SET, CONNECTED}. Modules are enumerated in
      created_at ascending order so the rounding remainder is assigned deterministically; ordering by id is
      forbidden.
    constants:
      DEPOSIT_PCT_DEFAULT: 0.20
      RETAINAGE_PCT_DEFAULT: 0.05
    precision: >-
      all money is integer cents, round_half_up. Rounding happens three times in a fixed order — once per
      module, once when the deposit rate is applied to the summed basis, once when retainage is applied to
      the certified amount. Collapsing any two of the three changes the result.

  - name: defect_responsibility_allocation
    trigger: "on POST /modular/defect-claims/{claimId}/adjudicate — round 1 from OPEN, round 2 from DISPUTED"
    algorithm: weighted_scoring
    formula: |
      # ---- variant phase_presumption (round 1) ----
      factory_share_pct = PHASE_PRESUMPTION[discovered_phase]
      # ---- variant evidence_weighted (round 2) ----
      factory_score = 0
      field_score   = 0
      if inspection.result IN {FAIL, CONDITIONAL}:                     factory_score += 6
      if inspection.severity_max >= SEVERITY_EVIDENCE_THRESHOLD:       factory_score += 3
      if module.defect_count_factory > module.defect_count_field:      factory_score += 2
      if discovered_phase IN {SITE_SET, POST_SET}:                     field_score   += 4
      if module.site_status IN {SET, CONNECTED}
         and module.exposure_open_hours > project.weather_exposure_limit_hours:
                                                                       field_score   += 3
      if module.connection_scope_owner == FIELD:                       field_score   += 2
      if factory_score + field_score == 0:
          factory_share_pct = 50.00                                    # no evidence either way
      else:
          factory_share_pct = round_half_up(factory_score * 100 / (factory_score + field_score), 2)

      # ---- shared tail, identical for both variants ----
      field_share_pct      = 100.00 - factory_share_pct                # exact complement, never re-rounded
      factory_charge_cents = round_half_up(repair_cost_cents * factory_share_pct / 100)
      field_charge_cents   = repair_cost_cents - factory_charge_cents   # absorbs the rounding remainder
      responsibility  = FACTORY if factory_share_pct == 100.00
                        else FIELD if factory_share_pct == 0.00
                        else SHARED
      warranty_bucket = FACTORY_WARRANTY if responsibility == FACTORY
                        else FIELD_WARRANTY if responsibility == FIELD
                        else SPLIT
      # counters are updated AFTER the allocation is computed, so an adjudication never
      # feeds its own evidence back into itself
      if responsibility == FACTORY: module.defect_count_factory += 1
      if responsibility == FIELD:   module.defect_count_field   += 1
    input_set: >-
      the single DefectClaim, the InspectionRecord it references (may be null — then result and severity_max
      contribute nothing), its ModuleUnit and that module's Project. No aggregation across claims.
    constants:
      PHASE_PRESUMPTION: "{FACTORY: 100.00, TRANSIT: 50.00, SITE_SET: 25.00, POST_SET: 0.00}"
      SEVERITY_EVIDENCE_THRESHOLD: 3
    precision: "share percentages to 2 decimal places round_half_up; charges in integer cents with field_charge_cents taking the complement so factory_charge_cents + field_charge_cents == repair_cost_cents exactly"
    variants:
      - name: phase_presumption
        when: "the first adjudication of a claim (status OPEN, adjudication_round becomes 1)"
        difference: >-
          reads only discovered_phase against a fixed presumption table; inspection evidence, exposure
          history and connection scope ownership are all ignored
      - name: evidence_weighted
        when: "re-adjudication after a dispute (status DISPUTED, adjudication_round becomes 2)"
        difference: >-
          discards the presumption table and derives the split from an additive evidence score, so identical
          claim data can move from a 50/50 SPLIT to a 100/0 FACTORY_WARRANTY allocation

  - name: permit_posture_derivation
    trigger: "on every permit decide, on clock advance that expires a permit, on design supersession that unpins an approval, and whenever project.phase reaches CLOSEOUT"
    algorithm: constraint_propagation
    formula: |
      live(track, scope) = exists PermitRecord of the project with that track and scope,
                           status == APPROVED, and (expires_at is null or expires_at > now)
      state_ok    = live(STATE_MODULAR_PROGRAM, PLAN_REVIEW)
      insignia_ok = live(STATE_MODULAR_PROGRAM, INSIGNIA)
      foundation_ok = live(LOCAL_AHJ, FOUNDATION)
      set_ok      = live(LOCAL_AHJ, SET)
      occ_ok      = live(LOCAL_AHJ, OCCUPANCY)
      site_ok     = foundation_ok or set_ok

      if   occ_ok and set_ok and state_ok and insignia_ok:  permit_posture = OCCUPANCY_CLEARED
      elif set_ok and state_ok and insignia_ok:             permit_posture = SET_CLEARED
      elif state_ok and not site_ok:                        permit_posture = STATE_CLEARED_ONLY
      elif site_ok and not state_ok:                        permit_posture = SITE_CLEARED_ONLY
      elif state_ok and site_ok:                            permit_posture = STATE_CLEARED_ONLY
      else:                                                 permit_posture = DUAL_BLOCKED
      # the last elif is the bifurcation tie-break: when both tracks are partially cleared but the
      # local SET permit or the state insignia is still missing, the state track is the one reported,
      # because it is the track that releases factory production.
    input_set: "every PermitRecord of the project; DENIED, SUBMITTED, UNDER_REVIEW, CONDITIONS_ISSUED and EXPIRED records contribute nothing"
    constants:
      PRODUCTION_REQUIRES: "STATE_MODULAR_PROGRAM / PLAN_REVIEW approved"
      SET_REQUIRES: "SET_CLEARED or OCCUPANCY_CLEARED"
    precision: "exact enum; the branch order above is normative and the first matching branch wins"

  - name: project_phase_derivation
    trigger: "on design freeze, line-slot schedule/release, station advance, shipment dispatch/deliver/cancel, execute-set, close-connections"
    algorithm: projection
    formula: |
      if planned_module_count > 0 and modules_connected_count >= planned_module_count:
          phase = CLOSEOUT
      elif any ModuleUnit of the project has site_status IN {SET, CONNECTED}:
          phase = SETTING
      elif any Shipment of the project has status IN {DISPATCHED, DELIVERED}:
          phase = SHIPPING
      elif any ModuleUnit of the project has production_status IN {IN_LINE, LINE_COMPLETE}:
          phase = IN_PRODUCTION
      elif any DesignPackage of the project has freeze_state IN {FROZEN, SUPERSEDED}:
          phase = DESIGN_FROZEN
      else:
          phase = PRECONSTRUCTION
    input_set: "all DesignPackages, ModuleUnits and Shipments of the project; the derivation is a full re-scan, never an increment, so it walks backwards when children regress"
    constants:
      SUPERSEDED_STILL_COUNTS_AS_FROZEN: true
    precision: "exact enum; first matching branch wins"

  - name: shipment_permit_fee_and_escort
    trigger: "on POST /modular/shipments/{shipmentId}/load-module and on cancel, whenever max_envelope_class is recomputed"
    algorithm: tiered_pricing
    formula: |
      max_envelope_class = the widest envelope_class among the shipment's loaded modules
                           (STANDARD < OVERWIDTH < SUPERLOAD), or STANDARD when the load is empty
      multiplier = CLASS_MULTIPLIER[max_envelope_class]
      permit_fee_cents = BASE_STATE_PERMIT_FEE_CENTS * count(route_state_codes) * multiplier
      escort_required = (max_envelope_class == SUPERLOAD)
                        or (max_envelope_class == OVERWIDTH and count(route_state_codes) >= 2)
      if not escort_required: escort_confirmed = false
    input_set: "every ModuleUnit whose shipment_id == this shipment; route_state_codes is taken from the shipment as declared at creation"
    constants:
      BASE_STATE_PERMIT_FEE_CENTS: 25000
      CLASS_MULTIPLIER: "{STANDARD: 0, OVERWIDTH: 2, SUPERLOAD: 5}"
    precision: "integer cents; a STANDARD load is fee-free regardless of how many states the route crosses"

  - name: module_exposure_hours
    trigger: "on execute-set, on close-connections, on POST /modular/_clock/set_current_utc, and on any GET of the module or its project set-readiness view"
    algorithm: decay_function
    formula: |
      if site_status == SET and connected_at is null:
          exposure_open_hours = round_half_up((now - set_at) in whole minutes / 60, 2)
      elif site_status == CONNECTED:
          exposure_open_hours = round_half_up((connected_at - set_at) in whole minutes / 60, 2)
      else:
          exposure_open_hours = 0.00
    input_set: "the single ModuleUnit; `now` is the logical clock, so the value only moves when the clock is advanced"
    constants:
      EXPOSURE_LIMIT_HOURS_DEFAULT: 8.0
    precision: "hours to 2 decimal places, round_half_up, derived from a whole-minute difference; the weather gate compares with strict > so exactly 8.00 hours is still compliant"

  - name: design_factory_compatibility_score
    trigger: "on POST /modular/design-packages, on submit, and on review-decision"
    algorithm: weighted_scoring
    formula: |
      penalty = CONFLICT_WEIGHT * open_connection_conflicts
              + FIELD_SCOPE_WEIGHT * field_scope_items_open
              + DETAIL_STATE_PENALTY[connection_detail_state]
              + SPLIT_MISMATCH_WEIGHT * abs(module_split_count - project.planned_module_count)
      factory_compatibility_score = max(0, 100 - penalty)
      # a review-decision of FREEZE requires factory_compatibility_score >= FREEZE_MIN_SCORE
    input_set: "the single DesignPackage plus its Project's planned_module_count"
    constants:
      CONFLICT_WEIGHT: 8
      FIELD_SCOPE_WEIGHT: 5
      SPLIT_MISMATCH_WEIGHT: 10
      DETAIL_STATE_PENALTY: "{NOT_STARTED: 40, FACTORY_DETAILED: 15, FIELD_COORDINATED: 5, COMPLETE: 0}"
      FREEZE_MIN_SCORE: 70
    precision: "integer score clamped to 0..100; the freeze gate is >= so a score of exactly 70 may be frozen"

# -----------------------------------------------------------------------------
# §1.4 Validation Rules — evaluated in strict ascending priority order.
# The FIRST violated rule decides the response; no later rule may pre-empt it.
# Category ladder: auth -> existence -> ownership/segregation -> OCC -> state
#                  -> business_safety -> business_constraint -> business_temporal
#                  -> business_referential -> business_fiscal
# -----------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the ten declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the caller's X-User-Role appears in the endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "request body parses, every required input field is present, every enum value is a declared member, integers are integers, percentages are 0..100, and numeric constraints in §1.1 hold"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 4
    category: existence
    check: "every path-template id resolves to a stored row, validated left to right"
    error_id: ERR_FACTORY_NOT_FOUND | ERR_AGENCY_NOT_FOUND | ERR_PROJECT_NOT_FOUND | ERR_DESIGN_PACKAGE_NOT_FOUND | ERR_MODULE_NOT_FOUND | ERR_PERMIT_NOT_FOUND | ERR_INSPECTION_NOT_FOUND | ERR_SHIPMENT_NOT_FOUND | ERR_DEFECT_CLAIM_NOT_FOUND | ERR_DRAW_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint carrying a path id"

  - priority: 5
    category: existence
    check: "every foreign key in the request body resolves to a stored row (factory_id, project_id, design_package_id, supersedes_package_id, module_id, agency_id, certifying_agency_id, inspection_id, pinned_package_id)"
    error_id: ERR_FACTORY_NOT_FOUND | ERR_AGENCY_NOT_FOUND | ERR_PROJECT_NOT_FOUND | ERR_DESIGN_PACKAGE_NOT_FOUND | ERR_MODULE_NOT_FOUND | ERR_INSPECTION_NOT_FOUND
    http_status: 404
    applies_to: "POST /modular/projects, POST /modular/design-packages, POST /modular/modules, POST /modular/permits, POST /modular/inspections, POST /modular/shipments, POST /modular/shipments/{shipmentId}/load-module, POST /modular/defect-claims, POST /modular/draw-requests"

  - priority: 6
    category: auth
    check: >-
      an entity_backed caller acts only on its own aggregate — FactoryProductionManager's X-User-ID equals
      project.factory_id, SiteSuperintendent's X-User-ID equals the project id, ThirdPartyInspector's
      X-User-ID equals the agency_id it records under
    error_id: ERR_ACTOR_NOT_OWNER
    http_status: 403
    applies_to: "POST /modular/modules, POST /modular/modules/{moduleId}/schedule-line-slot, POST /modular/modules/{moduleId}/release-line-slot, POST /modular/modules/{moduleId}/advance-station, POST /modular/modules/{moduleId}/schedule-pick, POST /modular/modules/{moduleId}/execute-set, POST /modular/modules/{moduleId}/close-connections, POST /modular/projects/{projectId}/weather-observations, POST /modular/inspections, POST /modular/inspections/{inspectionId}/record-result, POST /modular/inspections/{inspectionId}/clear-hold"

  - priority: 7
    category: auth
    check: "the deciding role matches the permit's track — StateProgramOfficer decides only track == STATE_MODULAR_PROGRAM, AuthorityHavingJurisdiction only track == LOCAL_AHJ"
    error_id: ERR_PERMIT_TRACK_ROLE_MISMATCH
    http_status: 403
    applies_to: "POST /modular/permits/{permitId}/decide"

  - priority: 8
    category: auth
    check: "segregation of duties — the X-User-ID recording a review-decision differs from design_package.submitted_by_user_id"
    error_id: ERR_SAME_ACTOR_REVIEW
    http_status: 403
    applies_to: "POST /modular/design-packages/{packageId}/review-decision"

  - priority: 9
    category: state
    check: "payload.expected_project_version equals the referenced Project's current version"
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
    applies_to: "POST /modular/design-packages"

  - priority: 10
    category: state
    check: "payload.expected_shipment_version equals the path Shipment's current version"
    error_id: ERR_STALE_SHIPMENT_VERSION
    http_status: 412
    applies_to: "POST /modular/shipments/{shipmentId}/load-module"

  # ---- 38: link uniqueness, ahead of every state precondition -------------
  - priority: 38
    category: business_constraint
    check: >-
      the module is not already assigned to a shipment (shipment_id is null). This link-uniqueness
      check deliberately runs BEFORE the priority-49 loadability check, because a module that is
      already on a load also fails site_status == AT_FACTORY: the specific double-booking error must
      win over the generic state error.
    error_id: ERR_MODULE_ALREADY_LOADED
    http_status: 409
    applies_to: "POST /modular/shipments/{shipmentId}/load-module"

  # ---- 40s: state preconditions -------------------------------------------
  - priority: 39
    category: state
    check: "cross-entity state precondition — no other DesignPackage of the same project is already in freeze_state == IN_REVIEW"
    error_id: ERR_DESIGN_REVIEW_IN_FLIGHT
    http_status: 409
    applies_to: "POST /modular/design-packages/{packageId}/submit"

  - priority: 40
    category: state
    check: "submit requires freeze_state IN {DRAFT, REVISION_REQUIRED}"
    error_id: ERR_DESIGN_NOT_SUBMITTABLE
    http_status: 409
    applies_to: "POST /modular/design-packages/{packageId}/submit"

  - priority: 41
    category: state
    check: "review-decision requires freeze_state == IN_REVIEW"
    error_id: ERR_DESIGN_NOT_IN_REVIEW
    http_status: 409
    applies_to: "POST /modular/design-packages/{packageId}/review-decision"

  - priority: 42
    category: state
    check: "certify requires the DrawRequest to be in status DRAFT"
    error_id: ERR_DRAW_NOT_DRAFT
    http_status: 409
    applies_to: "POST /modular/draw-requests/{drawId}/certify"

  - priority: 43
    category: state
    check: "fund requires status == CERTIFIED; reject requires status IN {DRAFT, CERTIFIED}"
    error_id: ERR_DRAW_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /modular/draw-requests/{drawId}/fund, POST /modular/draw-requests/{drawId}/reject"

  - priority: 44
    category: state
    check: "schedule-line-slot requires production_status == PLANNED"
    error_id: ERR_MODULE_NOT_PLANNED
    http_status: 409
    applies_to: "POST /modular/modules/{moduleId}/schedule-line-slot"

  - priority: 45
    category: state
    check: "release-line-slot requires production_status == SLOTTED"
    error_id: ERR_MODULE_NOT_SLOTTED
    http_status: 409
    applies_to: "POST /modular/modules/{moduleId}/release-line-slot"

  - priority: 46
    category: state
    check: "advance-station requires production_status IN {SLOTTED, IN_LINE}"
    error_id: ERR_MODULE_NOT_ON_LINE
    http_status: 409
    applies_to: "POST /modular/modules/{moduleId}/advance-station"

  - priority: 47
    category: state
    check: "schedule-pick requires site_status IN {AT_FACTORY, LOADED, IN_TRANSIT, DELIVERED}; execute-set requires site_status == DELIVERED"
    error_id: ERR_MODULE_NOT_READY_TO_SET
    http_status: 409
    applies_to: "POST /modular/modules/{moduleId}/schedule-pick, POST /modular/modules/{moduleId}/execute-set"

  - priority: 48
    category: state
    check: "close-connections requires site_status == SET"
    error_id: ERR_MODULE_NOT_SET
    http_status: 409
    applies_to: "POST /modular/modules/{moduleId}/close-connections"

  - priority: 49
    category: state
    check: "load-module requires Shipment.status IN {DRAFT, SURVEY_REQUIRED} and the module's site_status == AT_FACTORY with production_status == LINE_COMPLETE"
    error_id: ERR_SHIPMENT_NOT_LOADABLE
    http_status: 409
    applies_to: "POST /modular/shipments/{shipmentId}/load-module"

  - priority: 50
    category: state
    check: "route-survey requires status IN {DRAFT, SURVEY_REQUIRED}, route_survey_state != COMPLETED and loaded_module_count >= 1"
    error_id: ERR_SURVEY_NOT_PENDING
    http_status: 409
    applies_to: "POST /modular/shipments/{shipmentId}/route-survey"

  - priority: 51
    category: state
    check: "dispatch requires status == PERMITTED and loaded_module_count >= 1"
    error_id: ERR_SHIPMENT_NOT_PERMITTED
    http_status: 409
    applies_to: "POST /modular/shipments/{shipmentId}/dispatch"

  - priority: 52
    category: state
    check: "deliver requires status == DISPATCHED"
    error_id: ERR_SHIPMENT_NOT_DISPATCHED
    http_status: 409
    applies_to: "POST /modular/shipments/{shipmentId}/deliver"

  - priority: 53
    category: state
    check: "cancel requires status IN {DRAFT, SURVEY_REQUIRED, PERMITTED}"
    error_id: ERR_SHIPMENT_TERMINAL
    http_status: 409
    applies_to: "POST /modular/shipments/{shipmentId}/cancel"

  - priority: 54
    category: state
    check: "decide requires status IN {SUBMITTED, UNDER_REVIEW, CONDITIONS_ISSUED}; START_REVIEW additionally requires status == SUBMITTED and ISSUE_CONDITIONS requires status IN {SUBMITTED, UNDER_REVIEW}"
    error_id: ERR_PERMIT_ALREADY_DECIDED
    http_status: 409
    applies_to: "POST /modular/permits/{permitId}/decide"

  - priority: 55
    category: state
    check: "record-result requires the InspectionRecord to be in result == PENDING and its module's qc_status IN {IN_PROGRESS, CONDITIONAL_RELEASE}"
    error_id: ERR_INSPECTION_NOT_PENDING
    http_status: 409
    applies_to: "POST /modular/inspections/{inspectionId}/record-result"

  - priority: 56
    category: state
    check: "clear-hold requires hold_state == AGENCY_HOLD and the module's qc_status == HOLD"
    error_id: ERR_HOLD_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /modular/inspections/{inspectionId}/clear-hold"

  - priority: 57
    category: state
    check: "adjudicate requires status IN {OPEN, DISPUTED}"
    error_id: ERR_CLAIM_NOT_ADJUDICABLE
    http_status: 409
    applies_to: "POST /modular/defect-claims/{claimId}/adjudicate"

  - priority: 58
    category: state
    check: "dispute requires status == ADJUDICATED"
    error_id: ERR_CLAIM_NOT_ADJUDICATED
    http_status: 409
    applies_to: "POST /modular/defect-claims/{claimId}/dispute"

  - priority: 59
    category: state
    check: "dispute requires adjudication_round < 2 — a claim re-adjudicated on evidence is final"
    error_id: ERR_DISPUTE_ROUND_LIMIT
    http_status: 409
    applies_to: "POST /modular/defect-claims/{claimId}/dispute"

  # ---- 60s: safety / regulatory ------------------------------------------
  - priority: 60
    category: business_safety
    check: "the project's Factory has line_state == RUNNING"
    error_id: ERR_FACTORY_LINE_NOT_RUNNING
    http_status: 409
    applies_to: "POST /modular/modules/{moduleId}/schedule-line-slot, POST /modular/modules/{moduleId}/advance-station"

  - priority: 61
    category: business_safety
    check: "project.crane_capacity_chart contains an entry whose radius_ft >= payload.pick_radius_ft (or, on execute-set, >= the stored pick_radius_ft)"
    error_id: ERR_PICK_RADIUS_OFF_CHART
    http_status: 422
    applies_to: "POST /modular/modules/{moduleId}/schedule-pick, POST /modular/modules/{moduleId}/execute-set"

  - priority: 62
    category: business_safety
    check: "(gross_weight_lb + rigging_weight_lb) * 100 <= 85 * derated chart capacity_lb per calculations.crane_pick_feasibility"
    error_id: ERR_CRANE_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /modular/modules/{moduleId}/schedule-pick, POST /modular/modules/{moduleId}/execute-set"

  - priority: 63
    category: business_safety
    check: "no already-SET, not-yet-connected ModuleUnit of the project has exposure_open_hours > project.weather_exposure_limit_hours — open modules must be closed in before another is set"
    error_id: ERR_WEATHER_EXPOSURE_LIMIT
    http_status: 409
    applies_to: "POST /modular/modules/{moduleId}/execute-set"

  - priority: 64
    category: business_safety
    check: "project.permit_posture IN {SET_CLEARED, OCCUPANCY_CLEARED} — both the state modular program track and the local AHJ set permit must be live"
    error_id: ERR_SET_NOT_PERMITTED
    http_status: 409
    applies_to: "POST /modular/modules/{moduleId}/execute-set"

  - priority: 65
    category: business_safety
    check: "the module's qc_status != HOLD — an agency hold blocks every downstream factory, transport and site operation"
    error_id: ERR_QC_HOLD_BLOCKS_OPERATION
    http_status: 409
    applies_to: "POST /modular/modules/{moduleId}/schedule-line-slot, POST /modular/modules/{moduleId}/advance-station, POST /modular/shipments/{shipmentId}/load-module, POST /modular/modules/{moduleId}/execute-set"

  - priority: 66
    category: business_safety
    check: "the module's qc_status IN {RELEASED, CONDITIONAL_RELEASE} before it may be loaded for transport"
    error_id: ERR_QC_NOT_RELEASED
    http_status: 409
    applies_to: "POST /modular/shipments/{shipmentId}/load-module"

  # ---- 67-75: constraint satisfaction -------------------------------------
  - priority: 67
    category: business_constraint
    check: >-
      set order respects project.set_sequence_policy — STRICT_ASCENDING requires
      set_sequence_index == project.modules_set_count + 1; PAIRED_FIRST additionally requires that a
      PAIR_B module is not set before its PAIR_A sibling of the same pair_group_code
    error_id: ERR_SET_SEQUENCE_VIOLATION
    http_status: 409
    applies_to: "POST /modular/modules/{moduleId}/execute-set"

  - priority: 68
    category: business_constraint
    check: >-
      aggregate line capacity — the count of other ModuleUnits of the same Factory in production_status
      IN {SLOTTED, IN_LINE} whose half-open [line_slot_start, line_slot_end) contains the requested
      line_slot_start is < factory.parallel_station_capacity
    error_id: ERR_LINE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /modular/modules/{moduleId}/schedule-line-slot"

  - priority: 69
    category: business_constraint
    check: >-
      crane window exclusivity — for every other ModuleUnit of the same Project with a pick window and
      site_status != CONNECTED, the closed interval
      [pick_window_start - crane_rigging_buffer_minutes, pick_window_end + crane_rigging_buffer_minutes]
      must not overlap the requested closed interval expanded the same way; touching endpoints count as overlap
    error_id: ERR_CRANE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /modular/modules/{moduleId}/schedule-pick"

  - priority: 71
    category: business_constraint
    check: "a load whose recomputed max_envelope_class == SUPERLOAD may not traverse more than 2 states — count(route_state_codes) <= 2"
    error_id: ERR_ENVELOPE_EXCEEDS_ROUTE_LIMIT
    http_status: 422
    applies_to: "POST /modular/shipments/{shipmentId}/load-module"

  - priority: 72
    category: business_constraint
    check: >-
      inspection staging — a FINAL_FACTORY record may be opened only when an IN_PLANT record of the same
      module has result IN {PASS, CONDITIONAL}, and no other record of the same module may be in result PENDING
    error_id: ERR_QC_STAGE_OUT_OF_ORDER
    http_status: 409
    applies_to: "POST /modular/inspections"

  - priority: 73
    category: business_constraint
    check: "Factory.code and InspectionAgency.agency_code are globally unique"
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /modular/factories, POST /modular/agencies"

  - priority: 74
    category: business_constraint
    check: "module_code is unique within the project and set_sequence_index is unique within the project"
    error_id: ERR_DUPLICATE_MODULE_CODE
    http_status: 409
    applies_to: "POST /modular/modules"

  - priority: 75
    category: business_constraint
    check: "payload.escort_confirmed == true whenever the shipment's escort_required == true"
    error_id: ERR_ESCORT_NOT_CONFIRMED
    http_status: 422
    applies_to: "POST /modular/shipments/{shipmentId}/route-survey"

  # ---- 76-80: temporal ----------------------------------------------------
  - priority: 76
    category: business_temporal
    check: "payload.line_slot_start >= the current logical clock instant"
    error_id: ERR_LINE_SLOT_IN_PAST
    http_status: 422
    applies_to: "POST /modular/modules/{moduleId}/schedule-line-slot"

  - priority: 77
    category: business_temporal
    check: "the minute-of-day of payload.line_slot_start lies in [factory.shift_start_minute_of_day, factory.shift_start_minute_of_day + factory.shift_minutes_per_day)"
    error_id: ERR_LINE_SLOT_OUTSIDE_SHIFT
    http_status: 422
    applies_to: "POST /modular/modules/{moduleId}/schedule-line-slot"

  - priority: 78
    category: business_temporal
    check: "payload.pick_window_end > payload.pick_window_start and payload.pick_window_start >= the current logical clock instant"
    error_id: ERR_PICK_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /modular/modules/{moduleId}/schedule-pick"

  - priority: 79
    category: business_temporal
    check: "on route-survey, payload.permit_expires_at > now; on dispatch, the current logical clock instant is strictly before permit_expires_at"
    error_id: ERR_TRANSPORT_PERMIT_EXPIRED
    http_status: 409
    applies_to: "POST /modular/shipments/{shipmentId}/route-survey, POST /modular/shipments/{shipmentId}/dispatch"

  - priority: 80
    category: business_temporal
    check: "payload.current_utc is greater than or equal to the clock's present value — the logical clock never moves backwards"
    error_id: ERR_CLOCK_NOT_MONOTONIC
    http_status: 422
    applies_to: "POST /modular/_clock/set_current_utc"

  # ---- 81-89: referential / compliance ------------------------------------
  - priority: 81
    category: business_referential
    check: "the InspectionAgency has accreditation_state IN {ACCREDITED, PROBATION} when recording inspections, and == ACCREDITED when certifying a draw"
    error_id: ERR_AGENCY_NOT_ACCREDITED
    http_status: 422
    applies_to: "POST /modular/inspections, POST /modular/draw-requests"

  - priority: 82
    category: business_referential
    check: "the InspectionAgency's accredited_state_codes contains the project's state_code"
    error_id: ERR_AGENCY_JURISDICTION_MISMATCH
    http_status: 422
    applies_to: "POST /modular/inspections, POST /modular/draw-requests"

  - priority: 83
    category: business_referential
    check: >-
      the state modular program plan review must be live — approving an INSIGNIA permit, and scheduling any
      line slot, requires a PermitRecord of the project with track == STATE_MODULAR_PROGRAM,
      scope == PLAN_REVIEW, status == APPROVED and no elapsed expires_at
    error_id: ERR_PLAN_REVIEW_PREREQUISITE
    http_status: 409
    applies_to: "POST /modular/permits/{permitId}/decide, POST /modular/modules/{moduleId}/schedule-line-slot"

  - priority: 84
    category: business_referential
    check: "approving a STATE_MODULAR_PROGRAM / PLAN_REVIEW permit requires exactly one DesignPackage of the project in freeze_state == FROZEN, which becomes the pinned_package_id"
    error_id: ERR_NO_FROZEN_PACKAGE
    http_status: 409
    applies_to: "POST /modular/permits/{permitId}/decide"

  - priority: 85
    category: business_referential
    check: "the module's design_package_id equals the pinned_package_id of the project's live STATE_MODULAR_PROGRAM / PLAN_REVIEW approval"
    error_id: ERR_PINNED_PACKAGE_MISMATCH
    http_status: 409
    applies_to: "POST /modular/modules/{moduleId}/execute-set"

  - priority: 86
    category: business_referential
    check: "supersedes_package_id, when supplied, references a DesignPackage of the same project in freeze_state == FROZEN whose revision_index is strictly less than the new package's revision_index"
    error_id: ERR_INVALID_SUPERSESSION
    http_status: 422
    applies_to: "POST /modular/design-packages"

  - priority: 87
    category: business_referential
    check: "a review-decision of FREEZE requires factory_compatibility_score >= 70, connection_detail_state != NOT_STARTED, and module_split_count == project.planned_module_count"
    error_id: ERR_FACTORY_COMPATIBILITY_TOO_LOW
    http_status: 422
    applies_to: "POST /modular/design-packages/{packageId}/review-decision"

  - priority: 88
    category: business_referential
    check: "the referenced DesignPackage's project_id equals payload.project_id, and the referenced InspectionRecord's module_id equals payload.module_id"
    error_id: ERR_CROSS_AGGREGATE_MISMATCH
    http_status: 422
    applies_to: "POST /modular/modules, POST /modular/defect-claims"

  - priority: 89
    category: business_referential
    check: "the module's project_id equals the shipment's project_id"
    error_id: ERR_SHIPMENT_PROJECT_MISMATCH
    http_status: 409
    applies_to: "POST /modular/shipments/{shipmentId}/load-module"

  # ---- 90+: fiscal (always last) ------------------------------------------
  - priority: 90
    category: business_fiscal
    check: >-
      certified_cents plus the certified_cents of every other DrawRequest of the project in status
      IN {CERTIFIED, FUNDED} must not exceed round_half_up(project.contract_price_cents * (1 - retainage_pct))
    error_id: ERR_CONTRACT_BALANCE_EXCEEDED
    http_status: 422
    applies_to: "POST /modular/draw-requests/{drawId}/certify"

  - priority: 91
    category: business_fiscal
    check: "certified_basis_cents > 0 — a draw with no qualifying module work cannot be certified"
    error_id: ERR_NO_CERTIFIABLE_WIP
    http_status: 422
    applies_to: "POST /modular/draw-requests/{drawId}/certify"

  - priority: 92
    category: business_fiscal
    check: "payload.draw_index equals (max draw_index over the project's existing DrawRequests) + 1, starting at 1"
    error_id: ERR_DRAW_SEQUENCE_GAP
    http_status: 409
    applies_to: "POST /modular/draw-requests"

  - priority: 93
    category: business_constraint
    check: "close-connections requires payload.field_scope_signed_off == true — the site-built scope adjoining the module must be signed off before the connections are closed"
    error_id: ERR_FIELD_SCOPE_NOT_SIGNED_OFF
    http_status: 422
    applies_to: "POST /modular/modules/{moduleId}/close-connections"

# -----------------------------------------------------------------------------
# §1.5 API Endpoints — every path is flat under the /modular namespace so that
# each entity has exactly one collection segment and one item segment. Fields
# suffixed with ? are optional; every other input field is required.
# -----------------------------------------------------------------------------
endpoints:
  # ---- Factory -------------------------------------------------------------
  - method: POST
    path: "/modular/factories"
    description: "register a volumetric modular plant with its takt, station count and parallel line capacity"
    roles: [ProgramAdmin]
    code: 201
    input: [name, code, takt_minutes, station_count, parallel_station_capacity, wip_unit_value_cents, "shift_start_minute_of_day?", "shift_minutes_per_day?", "line_state?"]
    output: Factory
    side_effects: ["committed_line_minutes initialised to 0", "version initialised to 1"]

  - method: GET
    path: "/modular/factories/{factoryId}"
    description: "read one plant including its live committed_line_minutes capacity ledger"
    roles: [ProgramAdmin, FactoryProductionManager, LenderDrawAdministrator, StateProgramOfficer]
    code: 200
    input: []
    output: Factory
    side_effects: []

  - method: GET
    path: "/modular/factories"
    description: "list plants, optionally filtered by code or line posture"
    roles: [ProgramAdmin, FactoryProductionManager, LenderDrawAdministrator]
    code: 200
    input: ["code?", "line_state?", "limit?", "offset?"]
    output: Factory[]
    side_effects: []

  - method: PATCH
    path: "/modular/factories/{factoryId}/line-state"
    description: "pause, shut down or restart the production line"
    roles: [ProgramAdmin, FactoryProductionManager]
    code: 200
    input: [line_state]
    output: Factory
    side_effects: ["increments Factory.version by 1", "a PAUSED or SHUTDOWN line blocks schedule-line-slot and advance-station"]

  # ---- InspectionAgency ----------------------------------------------------
  - method: POST
    path: "/modular/agencies"
