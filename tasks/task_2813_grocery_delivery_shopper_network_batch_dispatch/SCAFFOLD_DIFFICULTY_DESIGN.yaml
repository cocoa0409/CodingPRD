  - rule_id: compensating_invariant
    instances:
      - name: ebt_funds_conserved_on_post_checkout_abandonment
        grounds:
          - calculations.customer_derived_balances
          - calculations.checkout_split_tender_capture
          - state_machines.Batch.CHECKED_OUT_to_ABANDONED
          - state_machines.Order.payment_status.CAPTURED_to_REFUNDED
          - entities.Customer.fields.ebt_snap_balance_cents
          - entities.Customer.fields.ebt_captured_total_cents
        distinguishing_aspect: |
          Conserved quantity = SNAP money. The identity
          ebt_snap_balance_cents + ebt_captured_total_cents == 5000 must hold both before the
          capture and after the compensating post-checkout abandonment (5000 + 0, then
          2242 + 2758, then 5000 + 0 again), because the reversal restores the balance and zeroes
