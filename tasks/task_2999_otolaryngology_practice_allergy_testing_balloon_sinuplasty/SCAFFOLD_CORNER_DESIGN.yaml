              as: PracticeAdmin
            - call: "POST /procedure-bookings"
              payload: { patient_id: "${pat_id}", procedure_type: "TONSILLECTOMY", venue: "SURGERY_CENTER", start_at: "2026-08-06T09:00:00Z", end_at: "2026-08-06T10:00:00Z", physician_user_id: "u_ent_1", surgery_center_block_id: "${block_b}" }
