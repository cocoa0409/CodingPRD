  - rule_id: compensating_invariant
    instances:
      - name: payment_reversal_conserves_paid_to_date
        grounds:
          - entities.LoanAccount.fields.paid_to_date_cents
          - state_machines.RecoveryCase.COMPLAINT_REVIEW_to_RESTITUTION
          - entities.RecoveryLedgerEntry.fields.kind
        distinguishing_aspect: |
          Conserved quantity = net borrower-paid money: forward action record-payment
          (200,000c) raises LoanAccount.paid_to_date_cents to 200,000c; the
          compensating action (complaint UPHELD -> restitution REVERSAL) returns it to
          exactly 0 — invariant: paid_to_date_cents == sum(PAYMENT) - sum(REVERSAL)
          over the case ledger at every observable point.
        test_recipe:
          setup:
            - "Case at DEFICIENCY_NOTICED (deficiency 1,009,530c); borrower has recorded one 200,000c deficiency payment (notice still SENT); complaint filed (case COMPLAINT_REVIEW)"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "PI", state_code: "CA", email: "pi@x.com" }, as: RecoveryManager, captures: { b_id: $.data.id } }
            - { call: "POST /loan-accounts", payload: { borrower_id: "${b_id}", vin: "VIN00000000000036", governing_state_code: "CA", principal_balance_cents: 2000000, apr_bps: 1200, monthly_payment_cents: 45000, missed_installments: 3, accrued_interest_cents: 60000, late_fees_cents: 12000 }, as: RecoveryManager, captures: { l_id: $.data.id } }
            - { call: "POST /recovery-cases", payload: { loan_account_id: "${l_id}", default_reason: "delinquent" }, as: RecoveryManager, as_user_id: "rm_1", captures: { c_id: $.data.id, c_v: $.data.version } }
            - { call: "POST /recovery-cases/${c_id}/ledger-entries", payload: { kind: "COST_REPO_FEE", amount_cents: 35000 }, as: RecoveryManager }
            - { call: "POST /recovery-cases/${c_id}/ledger-entries", payload: { kind: "COST_STORAGE", amount_cents: 4500 }, as: RecoveryManager }
            - { call: "POST /recovery-cases/${c_id}/cure-notices", payload: { expected_recovery_case_version: "${c_v}" }, as: RecoveryManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-16T00:00:00Z" }, as: RecoveryManager }
            - { call: "POST /repo-agents", payload: { name: "Agent I", license_number: "LIC-I", licensed_state_codes: ["CA"], max_active_assignments: 5 }, as: RecoveryManager, captures: { ag_id: $.data.id } }
            - { call: "POST /recovery-cases/${c_id}/repo-assignments", payload: { agent_id: "${ag_id}", field_window_start: "2026-05-16T00:00:00Z", field_window_end: "2026-05-18T00:00:00Z" }, as: RecoveryManager, captures: { asg_id: $.data.id } }
            - { call: "POST /repo-assignments/${asg_id}/accept", payload: {}, as: RepoAgent, as_user_id: "${ag_id}" }
            - { call: "POST /repo-assignments/${asg_id}/report-secured", payload: { odometer: 65000, condition_grade: "GOOD", trade_in_value_cents: 1500000, auction_guide_low_cents: 900000 }, as: RepoAgent, as_user_id: "${ag_id}" }
            - { call: "GET /recovery-cases/${c_id}", payload: {}, as: RecoveryManager, captures: { c_v2: $.data.version } }
            - { call: "POST /recovery-cases/${c_id}/redemption-quotes", payload: { quote_type: "REDEMPTION", expected_recovery_case_version: "${c_v2}" }, as: RecoveryManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-27T00:00:00Z" }, as: RecoveryManager }
            - { call: "POST /auction-houses", payload: { name: "AH", fee_bps: 500, transport_fee_cents: 15000 }, as: RecoveryManager, captures: { ah_id: $.data.id } }
            - { call: "POST /recovery-cases/${c_id}/consignments", payload: { auction_house_id: "${ah_id}" }, as: RecoveryManager, captures: { cons_id: $.data.id } }
            - { call: "POST /consignments/${cons_id}/list", payload: { listing_start: "2026-05-28T00:00:00Z", listing_end: "2026-05-30T00:00:00Z" }, as: Auctioneer, as_user_id: "${ah_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-05T00:00:00Z" }, as: RecoveryManager }
            - { call: "POST /consignments/${cons_id}/report-sale", payload: { gross_sale_cents: 1200000 }, as: Auctioneer, as_user_id: "${ah_id}", captures: { sale_id: $.data.id } }
            - { call: "POST /sale-records/${sale_id}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "co_1" }
            - { call: "POST /recovery-cases/${c_id}/deficiency-notices", payload: {}, as: RecoveryManager, captures: { dn_id: $.data.id } }
            - { call: "POST /deficiency-notices/${dn_id}/send", payload: {}, as: RecoveryManager }
            - { call: "POST /deficiency-notices/${dn_id}/record-payment", payload: { amount_cents: 200000 }, as: Borrower, as_user_id: "${b_id}" }
            - { call: "GET /loan-accounts/${l_id}", payload: {}, as: ComplianceOfficer, captures: { paid_after_fwd: $.data.paid_to_date_cents } }
            - { call: "POST /recovery-cases/${c_id}/complaints", payload: { category: "WRONGFUL_REPOSSESSION", description: "wrong car" }, as: Borrower, as_user_id: "${b_id}", captures: { cmp_id: $.data.id } }
          trigger:
            - { call: "POST /complaints/${cmp_id}/resolve", payload: { outcome: "UPHELD" }, as: ComplianceOfficer, as_user_id: "co_1" }
            - { call: "GET /loan-accounts/${l_id}", payload: {}, as: ComplianceOfficer, captures: { paid_after_comp: $.data.paid_to_date_cents, l_st: $.data.status } }
          assert:
            - "paid_after_fwd == 200000        (forward action moved the conserved quantity)"
            - "paid_after_comp == 0            (compensating action restored it exactly — no drift)"
            - "l_st == CURRENT"
            - "Ledger: sum(PAYMENT) - sum(REVERSAL) == 0 for case ${c_id}"
      - name: claim_unclaim_conserves_property_custody
        grounds:
          - state_machines.PersonalPropertyItem.INVENTORIED_to_CLAIMED
          - state_machines.PersonalPropertyItem.CLAIMED_to_INVENTORIED
          - entities.RecoveryCase.fields.property_item_count
        distinguishing_aspect: |
          DIFFERENT conserved quantity than instance 1 (custody counts, not money):
          forward action claim moves one item INVENTORIED -> CLAIMED; the compensating
          unclaim moves it back. Invariant: property_item_count (3) ==
          count(INVENTORIED) + count(CLAIMED) + count(RETURNED) + count(DISPOSED), and
          in-custody (INVENTORIED + CLAIMED) == 3 and released (RETURNED + DISPOSED) == 0
          both before the pair and after it.
        test_recipe:
          setup:
            - "Case COLLATERAL_SECURED at 2026-05-16; the securing agent has inventoried exactly 3 personal property items"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "PP", state_code: "CA", email: "pp@x.com" }, as: RecoveryManager, captures: { b_id: $.data.id } }
            - { call: "POST /loan-accounts", payload: { borrower_id: "${b_id}", vin: "VIN00000000000037", governing_state_code: "CA", principal_balance_cents: 500000, apr_bps: 900, monthly_payment_cents: 20000, missed_installments: 2, accrued_interest_cents: 8000, late_fees_cents: 3000 }, as: RecoveryManager, captures: { l_id: $.data.id } }
            - { call: "POST /recovery-cases", payload: { loan_account_id: "${l_id}", default_reason: "delinquent" }, as: RecoveryManager, as_user_id: "rm_1", captures: { c_id: $.data.id, c_v: $.data.version } }
            - { call: "POST /recovery-cases/${c_id}/cure-notices", payload: { expected_recovery_case_version: "${c_v}" }, as: RecoveryManager }
            - { call: "POST /repo-agents", payload: { name: "Agent P", license_number: "LIC-P", licensed_state_codes: ["CA"], max_active_assignments: 5 }, as: RecoveryManager, captures: { ag: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-16T00:00:00Z" }, as: RecoveryManager }
            - { call: "POST /recovery-cases/${c_id}/repo-assignments", payload: { agent_id: "${ag}", field_window_start: "2026-05-16T00:00:00Z", field_window_end: "2026-05-18T00:00:00Z" }, as: RecoveryManager, captures: { asg: $.data.id } }
            - { call: "POST /repo-assignments/${asg}/accept", payload: {}, as: RepoAgent, as_user_id: "${ag}" }
            - { call: "POST /repo-assignments/${asg}/report-secured", payload: { odometer: 40000, condition_grade: "FAIR", trade_in_value_cents: 600000, auction_guide_low_cents: 450000 }, as: RepoAgent, as_user_id: "${ag}" }
            - { call: "POST /recovery-cases/${c_id}/personal-property-items", payload: { description: "laptop" }, as: RepoAgent, as_user_id: "${ag}", captures: { it1: $.data.id } }
            - { call: "POST /recovery-cases/${c_id}/personal-property-items", payload: { description: "jacket" }, as: RepoAgent, as_user_id: "${ag}" }
            - { call: "POST /recovery-cases/${c_id}/personal-property-items", payload: { description: "tools", estimated_value_cents: 15000 }, as: RepoAgent, as_user_id: "${ag}" }
          trigger:
            - { call: "POST /personal-property-items/${it1}/claim", payload: {}, as: Borrower, as_user_id: "${b_id}", captures: { st_claimed: $.data.status } }
            - { call: "POST /personal-property-items/${it1}/unclaim", payload: {}, as: Borrower, as_user_id: "${b_id}", captures: { st_back: $.data.status } }
            - { call: "GET /recovery-cases/${c_id}", payload: {}, as: RecoveryManager, captures: { item_count: $.data.property_item_count } }
          assert:
            - "st_claimed == CLAIMED and st_back == INVENTORIED  (forward + compensating pair)"
            - "item_count == 3  (unchanged by the pair)"
            - "GET /recovery-cases/${c_id}/personal-property-items shows INVENTORIED 3, CLAIMED 0, RETURNED 0, DISPOSED 0 — identical custody profile to before the pair"
