          - entities.ExternalSubmission.fields.allowance_pct
          - entities.ExternalSubmission.fields.tolerance_pct
        distinguishing_aspect: |
          1050 against the certified 1000 is raw_delta_pct exactly 5.00, which sits on the tier-3
          edge (not < 5.00) and so draws ALLOWANCE_TIER_3_PCT 1.00, leaving effective 4.00 above
          the RANKING tolerance 3.00 → VARIANCE_HOLD; the director's override, not a recomputation,
          is what makes it RECONCILED and transmittable.
        test_recipe:
          setup:
            - "ReportingCycle IPEDS-2027 is CENSUS_LOCKED with a CERTIFIED ENROLLMENT component whose TOTAL_HEADCOUNT is 1000 (prior 1000)."
            - "A DRAFT RANKING submission to 'National University Ranking' reports TOTAL_HEADCOUNT 1050; clock at 2026-11-01T00:00:00Z."
