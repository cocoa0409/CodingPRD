  - method: POST
    path: "/comics/issues/{id}/foc-lock"
    purpose: "Lock the final order cut-off: freeze every submitted order's earned incentive covers and roll the retailer unit ledgers forward."
    roles: [SalesDirector]
    input: []
    output: Issue
    side_effects:
      - "issue.commercial_status SOLICITED -> FOC_LOCKED"
      - "for every SUBMITTED order of the issue, ordered by created_at ASC: freezes earned_variant_allocations and total_units by variant_incentive_allocation, then order.status -> FOC_LOCKED"
      - "CASCADE (caused by the order locks): each affected Retailer.cumulative_units_ytd recomputed by order_units_rollup, then Retailer.discount_tier recomputed by retailer_discount_tier"
      - "issue.total_ordered_units recomputed by order_units_rollup"
      - "increments Issue.version and each locked RetailerOrder.version"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_ISSUE_NOT_FOUND, ERR_INVALID_STATE, ERR_FOC_NOT_REACHED, ERR_NO_QUALIFYING_ORDERS]
