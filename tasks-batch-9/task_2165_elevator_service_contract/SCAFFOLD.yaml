# =============================================================================
# PRD Benchmark Seed Tables — Elevator Service Contract Management
# Task: task_2165_elevator_service_contract
# =============================================================================

scenario: |
  desgin task harder than expert level.!!!!2165. Elevator Service Contract Management (building owner elevator program): contract scope (full maintenance vs oil-and-grease) & response times, monthly maintenance visit verification & task list, callback/entrapment response tracking & fire department coordination, state inspection & certificate posting, modernization planning & downtime scheduling, parts obsolescence & lead time, performance penalty & contract renegotiation, uptime reporting by car

domain_name: elevator-service-contract
api_prefix: /elevator-program

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  difficulty_level: expert_plus            # §0.4 Expert band, deliberately pushed above it per the scenario request
  primary_archetype: compliance_audit      # regulated inspection / certificate / penalty regime with an audit trail
  secondary_archetype: multi_party_negotiation   # renegotiation rounds between building owner and contractor
  complexity_layers:
    - optimistic_concurrency               # OCC on ServiceContract.version and ElevatorCar.version
    - cascading_side_effects               # inspection FAIL and obsolete-part substitution both fan out transitively
    - dual_variant_calculation             # uptime EXCLUSIVE vs INCLUSIVE; penalty SCHEDULE_A vs SCHEDULE_B
    - rate_threshold_triggers              # uptime target, penalty caps, performance-score renegotiation trigger

  entity_topology: flat
  # Every entity is a peer addressed at /elevator-program/<collection>/{id}; parentage is
  # expressed purely by FK fields carried in request bodies, never by nested URL paths.

  state_machine_shape: cyclic
  # ServiceContract ACTIVE -> UNDER_RENEGOTIATION -> ACTIVE and RenegotiationRound
  # OPEN -> COUNTERED -> (successor round) OPEN are true loops; ElevatorCar additionally
  # carries two independent state dimensions (availability_state x compliance_state).

  relationship_patterns:
    - one_to_many          # ServiceContract -> ElevatorCar; ElevatorCar -> Callback/MaintenanceVisit/StateInspection
    - self_referential     # SparePart.superseded_by_part_id -> SparePart.id (obsolescence chain)
    - cross_aggregate      # PartOrder references both ElevatorCar and DowntimeWindow; DowntimeWindow references ModernizationProject
    - polymorphic: false

  role_model: segregation_of_duties
  # The user who performs a visit may not verify it; the administrator who assessed a
  # penalty may not resolve it; the party who opened a renegotiation round may not accept it.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: ServiceContract
    parent: null
    common_fields: true
    fields:
      - { name: building_name, type: string, source: input, description: "Name of the building covered by this elevator program" }
      - { name: building_address, type: string, source: input, description: "Street address of the covered building" }
      - { name: jurisdiction_code, type: string, source: input, description: "State/city inspection authority code, e.g. NY-NYC" }
      - { name: fire_district_code, type: string, source: input, description: "Fire district used for entrapment dispatch coordination" }
      - { name: building_manager_user_id, type: string, source: input, description: "Opaque X-User-ID that a BuildingManager must present to act on this contract" }
      - { name: contractor_user_id, type: string, source: input, description: "Opaque X-User-ID that a ServiceContractor must present to act on this contract" }
      - { name: scope_type, type: enum, source: input, description: "FULL_MAINTENANCE | OIL_AND_GREASE — selects required visit task codes, part-order eligibility, and the uptime variant used for penalties", constraints: "FULL_MAINTENANCE | OIL_AND_GREASE" }
      - { name: penalty_schedule, type: enum, source: input, description: "SCHEDULE_A | SCHEDULE_B — selects the penalty_assessment_amount variant", constraints: "SCHEDULE_A | SCHEDULE_B" }
      - { name: monthly_base_fee_cents, type: integer, source: input, description: "Contracted monthly maintenance fee in cents", constraints: ">= 1" }
      - { name: callback_response_minutes, type: integer, source: input, description: "SLA minutes from Callback.reported_at to arrival for MALFUNCTION and NUISANCE callbacks", constraints: ">= 1" }
      - { name: entrapment_response_minutes, type: integer, source: input, description: "SLA minutes from Callback.reported_at to arrival for ENTRAPMENT callbacks", constraints: ">= 1" }
      - { name: term_start_date, type: string, source: input, description: "Contract term start, YYYY-MM-DD" }
      - { name: term_end_date, type: string, source: input, description: "Contract term end, YYYY-MM-DD; used to flag modernization projects AT_RISK" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ACTIVE | SERVICE_ALERT | UNDER_RENEGOTIATION | TERMINATED", constraints: "DRAFT | ACTIVE | SERVICE_ALERT | UNDER_RENEGOTIATION | TERMINATED" }
      - { name: cars_out_of_service_count, type: integer, source: computed, default: 0, description: "Count of ElevatorCar rows on this contract with availability_state == OUT_OF_SERVICE" }
      - { name: penalty_lifetime_assessed_cents, type: integer, source: computed, default: 0, description: "Running total of PenaltyAssessment.amount_cents for rows on this contract with status != SUPERSEDED" }
      - { name: penalty_lifetime_waived_cents, type: integer, source: computed, default: 0, description: "Running total of amount_cents for PenaltyAssessment rows resolved WAIVED" }
      - { name: penalty_lifetime_credited_cents, type: integer, source: computed, default: 0, description: "Running total of amount_cents for PenaltyAssessment rows resolved CREDITED" }
      - { name: penalty_balance_cents, type: integer, source: computed, default: 0, description: "= penalty_lifetime_assessed_cents - penalty_lifetime_waived_cents - penalty_lifetime_credited_cents (conserved-quantity invariant)" }
      - { name: performance_score, type: number, source: computed, default: null, description: "Latest contract_performance_score value stored when POST /renegotiations evaluates eligibility; null until first evaluation" }
      - { name: renegotiation_round_count, type: integer, source: computed, default: 0, description: "Count of RenegotiationRound rows on this contract, all statuses" }

  - name: ElevatorCar
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> ServiceContract.id; the program this car belongs to" }
      - { name: car_code, type: string, source: input, description: "Owner-assigned car label, unique within contract_id; the pinned ASC sort key for every per-car iteration" }
      - { name: car_type, type: enum, source: input, description: "TRACTION | HYDRAULIC", constraints: "TRACTION | HYDRAULIC" }
      - { name: capacity_lbs, type: integer, source: input, description: "Rated car capacity in pounds", constraints: ">= 1" }
      - { name: availability_state, type: enum, source: system, default: IN_SERVICE, description: "Availability dimension: IN_SERVICE | OUT_OF_SERVICE | UNDER_MODERNIZATION | DECOMMISSIONED", constraints: "IN_SERVICE | OUT_OF_SERVICE | UNDER_MODERNIZATION | DECOMMISSIONED" }
      - { name: compliance_state, type: enum, source: system, default: INSPECTION_DUE, description: "Compliance dimension, evolves independently of availability_state: CERTIFIED | INSPECTION_DUE | RED_TAGGED | CERTIFICATE_EXPIRED", constraints: "CERTIFIED | INSPECTION_DUE | RED_TAGGED | CERTIFICATE_EXPIRED" }
      - { name: scheduled_downtime_minutes, type: integer, source: computed, default: 0, description: "= sum over DowntimeWindow w with w.car_id == this car and w.status IN {SCHEDULED, COMPLETED} of minutes(w.window_end - w.window_start) (conserved-quantity invariant)" }
      - { name: open_part_order_count, type: integer, source: computed, default: 0, description: "Count of PartOrder rows on this car with status IN {ORDERED, SUBSTITUTED}" }
      - { name: unplanned_outage_open_since, type: datetime, source: system, default: null, description: "Logical-clock instant at which the car most recently entered OUT_OF_SERVICE; null while IN_SERVICE" }
      - { name: red_tag_issued_at, type: datetime, source: system, default: null, description: "Logical-clock instant a FAIL inspection result red-tagged the car" }
      - { name: red_tag_lifted_at, type: datetime, source: system, default: null, description: "Logical-clock instant a REINSPECTION PASS lifted the red tag" }
      - { name: current_certificate_number, type: string, source: computed, default: null, description: "certificate_number of the StateInspection on this car whose certificate_state == POSTED with the greatest certificate_expiry_date; ties broken by created_at ASC; null when none" }
      - { name: certificate_expiry_date, type: string, source: computed, default: null, description: "certificate_expiry_date of the same POSTED StateInspection selected for current_certificate_number; null when none" }

  - name: MaintenanceVisit
    parent: null
    common_fields: true
    fields:
      - { name: car_id, type: string, source: input, description: "FK -> ElevatorCar.id; the car this monthly visit covers" }
      - { name: period_month, type: string, source: input, description: "Billing month this visit satisfies, format YYYY-MM" }
      - { name: scheduled_date, type: string, source: input, description: "Planned visit date, YYYY-MM-DD; must fall inside period_month" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | PERFORMED | VERIFIED | DISPUTED | REJECTED | MISSED", constraints: "SCHEDULED | PERFORMED | VERIFIED | DISPUTED | REJECTED | MISSED" }
      - { name: task_items, type: array, source: input, description: "Array of { task_code: string, completed: boolean, note: string } supplied on POST /visits/{visitId}/perform; replaces any prior array" }
      - { name: completed_task_codes, type: array, source: computed, description: "task_code values from task_items whose completed == true, sorted ASC" }
      - { name: missing_task_codes, type: array, source: computed, description: "Required task codes for the contract's scope_type that are absent from completed_task_codes, sorted ASC" }
      - { name: performed_at, type: datetime, source: system, default: null, description: "Logical-clock instant of the most recent perform call" }
      - { name: performed_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the ServiceContractor that performed the visit" }
      - { name: verified_at, type: datetime, source: system, default: null, description: "Logical-clock instant of verification" }
      - { name: verified_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the BuildingManager that verified the visit" }
      - { name: dispute_reason, type: string, source: system, default: null, description: "Reason text from the most recent dispute call" }
      - { name: rework_count, type: integer, source: computed, default: 0, description: "Number of times this visit has been disputed and sent back for rework" }

  - name: Callback
    parent: null
    common_fields: true
    fields:
      - { name: car_id, type: string, source: input, description: "FK -> ElevatorCar.id; the car that generated the callback" }
      - { name: callback_type, type: enum, source: input, description: "ENTRAPMENT | MALFUNCTION | NUISANCE", constraints: "ENTRAPMENT | MALFUNCTION | NUISANCE" }
      - { name: passengers_trapped, type: integer, source: input, default: 0, description: "Number of passengers trapped; must be >= 1 when callback_type == ENTRAPMENT", constraints: ">= 0" }
      - { name: out_of_service, type: boolean, source: input, default: true, description: "Whether the car was taken out of service by this callback; when true the callback contributes an unplanned outage interval to uptime" }
      - { name: reported_at, type: datetime, source: system, description: "Logical-clock instant at creation; start of the response-time measurement and of any unplanned outage interval" }
      - { name: status, type: enum, source: system, default: REPORTED, description: "REPORTED | ESCALATED | ON_SITE | CLEARED | CANCELLED", constraints: "REPORTED | ESCALATED | ON_SITE | CLEARED | CANCELLED" }
      - { name: fire_dispatch_requested_at, type: datetime, source: system, default: null, description: "Logical-clock instant the FireDispatcher recorded the dispatch request" }
      - { name: fire_dispatch_incident_number, type: string, source: system, default: null, description: "Fire department incident number recorded on dispatch" }
      - { name: arrived_at, type: datetime, source: system, default: null, description: "Logical-clock instant the contractor arrived on site" }
      - { name: cleared_at, type: datetime, source: system, default: null, description: "Logical-clock instant the callback was cleared; end of any unplanned outage interval" }
      - { name: resolution_note, type: string, source: system, default: null, description: "Free-text note recorded on clear" }
      - { name: response_minutes, type: integer, source: computed, default: null, description: "= whole minutes between reported_at and arrived_at; null until arrival" }
      - { name: sla_minutes, type: integer, source: computed, default: null, description: "SLA that applied: contract.entrapment_response_minutes for ENTRAPMENT, otherwise contract.callback_response_minutes" }
      - { name: sla_breached, type: boolean, source: computed, default: false, description: "= response_minutes > sla_minutes, evaluated at arrival" }

  - name: StateInspection
    parent: null
    common_fields: true
    fields:
      - { name: car_id, type: string, source: input, description: "FK -> ElevatorCar.id; the car being inspected" }
      - { name: inspection_type, type: enum, source: input, description: "PERIODIC | FIVE_YEAR_FULL_LOAD | REINSPECTION", constraints: "PERIODIC | FIVE_YEAR_FULL_LOAD | REINSPECTION" }
      - { name: scheduled_date, type: string, source: input, description: "Planned inspection date, YYYY-MM-DD" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "Inspection dimension: SCHEDULED | COMPLETED | CANCELLED", constraints: "SCHEDULED | COMPLETED | CANCELLED" }
      - { name: result, type: enum, source: system, default: null, description: "PASS | PASS_WITH_DEFICIENCIES | FAIL; null until the result is recorded", constraints: "PASS | PASS_WITH_DEFICIENCIES | FAIL" }
      - { name: deficiency_codes, type: array, source: input, default: [], description: "Array of deficiency code strings supplied with the result" }
      - { name: result_recorded_at, type: datetime, source: system, default: null, description: "Logical-clock instant the StateInspector recorded the result" }
      - { name: certificate_state, type: enum, source: system, default: NONE, description: "Certificate dimension, independent of status: NONE | ISSUED | POSTED | EXPIRED | SUPERSEDED", constraints: "NONE | ISSUED | POSTED | EXPIRED | SUPERSEDED" }
      - { name: certificate_number, type: string, source: system, default: null, description: "Server-minted certificate number, format CERT-<jurisdiction_code>-<car_code>-<YYYYMMDD of certificate_issued_date>" }
      - { name: certificate_issued_date, type: string, source: system, default: null, description: "Date part of result_recorded_at, YYYY-MM-DD" }
      - { name: certificate_expiry_date, type: string, source: system, default: null, description: "= certificate_issued_date + CERTIFICATE_VALIDITY_DAYS days" }
      - { name: certificate_posted_at, type: datetime, source: system, default: null, description: "Logical-clock instant the BuildingManager posted the certificate in the car" }
      - { name: posted_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the BuildingManager that posted the certificate" }

  - name: ModernizationProject
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> ServiceContract.id; the program funding this modernization" }
      - { name: title, type: string, source: input, description: "Short project title" }
      - { name: budget_cents, type: integer, source: input, description: "Approved capital budget in cents", constraints: ">= 1" }
      - { name: target_completion_date, type: string, source: input, description: "Planned completion date, YYYY-MM-DD; recomputed by cascade to the latest window_end date once windows exist" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "PLANNED | APPROVED | IN_PROGRESS | AT_RISK | COMPLETE | CANCELLED", constraints: "PLANNED | APPROVED | IN_PROGRESS | AT_RISK | COMPLETE | CANCELLED" }
      - { name: approved_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the BuildingManager that approved the project" }
      - { name: window_count, type: integer, source: computed, default: 0, description: "Count of DowntimeWindow rows with project_id == this project and status IN {SCHEDULED, COMPLETED}" }

  - name: DowntimeWindow
    parent: null
    common_fields: true
    fields:
      - { name: car_id, type: string, source: input, description: "FK -> ElevatorCar.id; the car taken out of service during the window" }
      - { name: project_id, type: string, source: input, default: null, description: "FK -> ModernizationProject.id; null for INSPECTION and REPAIR windows" }
      - { name: window_type, type: enum, source: input, description: "MODERNIZATION | INSPECTION | REPAIR", constraints: "MODERNIZATION | INSPECTION | REPAIR" }
      - { name: window_start, type: datetime, source: input, description: "Inclusive start of the half-open occupation interval [window_start, window_end)" }
      - { name: window_end, type: datetime, source: input, description: "Exclusive end of the half-open occupation interval; must be strictly after window_start" }
      - { name: duration_minutes, type: integer, source: computed, description: "= whole minutes between window_start and window_end" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | COMPLETED | CANCELLED | RESCHEDULE_REQUIRED", constraints: "SCHEDULED | COMPLETED | CANCELLED | RESCHEDULE_REQUIRED" }
      - { name: reschedule_count, type: integer, source: computed, default: 0, description: "Number of times a part-lead-time cascade has shifted this window forward" }

  - name: SparePart
    parent: null
    common_fields: true
    fields:
      - { name: part_number, type: string, source: input, description: "Manufacturer part number, unique across the catalog" }
      - { name: description_text, type: string, source: input, description: "Human-readable part description" }
      - { name: part_class, type: enum, source: input, description: "LUBRICATION | WEAR_ITEM | COMPONENT | CONTROLLER_BOARD; OIL_AND_GREASE contracts may only order LUBRICATION parts", constraints: "LUBRICATION | WEAR_ITEM | COMPONENT | CONTROLLER_BOARD" }
      - { name: unit_price_cents, type: integer, source: input, description: "Catalog unit price in cents", constraints: ">= 1" }
      - { name: lead_time_days, type: integer, source: input, description: "Baseline manufacturer lead time in whole days", constraints: ">= 0" }
      - { name: lifecycle_state, type: enum, source: system, default: ACTIVE, description: "ACTIVE | OBSOLETE | DISCONTINUED; OBSOLETE carries a successor, DISCONTINUED does not", constraints: "ACTIVE | OBSOLETE | DISCONTINUED" }
      - { name: superseded_by_part_id, type: string, source: system, default: null, description: "FK -> SparePart.id; successor part set when this part is marked OBSOLETE with a replacement" }
      - { name: obsoleted_at, type: datetime, source: system, default: null, description: "Logical-clock instant the part left ACTIVE" }

  - name: PartOrder
    parent: null
    common_fields: true
    fields:
      - { name: car_id, type: string, source: input, description: "FK -> ElevatorCar.id; the car the part is destined for" }
      - { name: part_id, type: string, source: input, description: "FK -> SparePart.id; the catalog part as requested by the caller" }
      - { name: effective_part_id, type: string, source: computed, description: "FK -> SparePart.id; the part actually ordered after supersession resolution, equal to part_id when no substitution occurred" }
      - { name: window_id, type: string, source: input, default: null, description: "FK -> DowntimeWindow.id; the downtime window this part gates, shifted forward when promised_date lands after the window start" }
      - { name: quantity, type: integer, source: input, description: "Units ordered", constraints: ">= 1" }
      - { name: expedite, type: boolean, source: input, default: false, description: "Whether expedited freight was purchased" }
      - { name: subtotal_cents, type: integer, source: computed, description: "= effective part unit_price_cents * quantity" }
      - { name: expedite_surcharge_cents, type: integer, source: computed, default: 0, description: "Expedite surcharge, keyed on the subtotal tier only" }
      - { name: total_cost_cents, type: integer, source: computed, description: "= subtotal_cents + expedite_surcharge_cents" }
      - { name: lead_time_days_applied, type: integer, source: computed, description: "Effective lead time in days after expedite savings and substitution penalties" }
      - { name: promised_date, type: string, source: computed, description: "= current logical-clock date + lead_time_days_applied, YYYY-MM-DD" }
      - { name: substitution_hops, type: integer, source: computed, default: 0, description: "Number of superseded_by_part_id hops walked to reach effective_part_id" }
      - { name: status, type: enum, source: system, default: ORDERED, description: "ORDERED | SUBSTITUTED | RECEIVED | CANCELLED", constraints: "ORDERED | SUBSTITUTED | RECEIVED | CANCELLED" }

  - name: PenaltyAssessment
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> ServiceContract.id; the contract being assessed" }
      - { name: period_month, type: string, source: input, description: "Closed billing month being assessed, format YYYY-MM" }
      - { name: schedule_applied, type: enum, source: computed, description: "Copy of contract.penalty_schedule at assessment time: SCHEDULE_A | SCHEDULE_B", constraints: "SCHEDULE_A | SCHEDULE_B" }
      - { name: uptime_variant_applied, type: enum, source: computed, description: "EXCLUSIVE for FULL_MAINTENANCE contracts, INCLUSIVE for OIL_AND_GREASE contracts", constraints: "EXCLUSIVE | INCLUSIVE" }
      - { name: uptime_pct_applied, type: number, source: computed, description: "Contract-level uptime for the period under uptime_variant_applied, 2 decimals" }
      - { name: late_callback_count, type: integer, source: computed, description: "Callbacks in the period with callback_type != ENTRAPMENT, status == CLEARED and sla_breached == true" }
      - { name: entrapment_breach_count, type: integer, source: computed, description: "Callbacks in the period with callback_type == ENTRAPMENT, status == CLEARED and sla_breached == true" }
      - { name: missed_visit_count, type: integer, source: computed, description: "MaintenanceVisit rows with period_month == this period and status IN {MISSED, REJECTED}" }
      - { name: raw_amount_cents, type: integer, source: computed, description: "Penalty before the contract cap is applied" }
      - { name: cap_amount_cents, type: integer, source: computed, description: "Contract cap for the applied schedule" }
      - { name: amount_cents, type: integer, source: computed, description: "= min(raw_amount_cents, cap_amount_cents)" }
      - { name: service_credit_cents, type: integer, source: computed, description: "Round-per-car-then-sum service credit for the period (contract_monthly_credit_cents)" }
      - { name: status, type: enum, source: system, default: ISSUED, description: "ISSUED | DISPUTED | UPHELD | WAIVED | CREDITED | SUPERSEDED", constraints: "ISSUED | DISPUTED | UPHELD | WAIVED | CREDITED | SUPERSEDED" }
      - { name: assessed_by_user_id, type: string, source: system, description: "X-User-ID of the ProgramAdministrator that issued the assessment" }
      - { name: dispute_reason, type: string, source: system, default: null, description: "Reason text supplied by the BuildingManager on dispute" }
      - { name: resolved_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the ProgramAdministrator that resolved the dispute; must differ from assessed_by_user_id" }
      - { name: resolution_note, type: string, source: system, default: null, description: "Free-text note recorded at resolution" }

  - name: RenegotiationRound
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> ServiceContract.id; the contract under renegotiation" }
      - { name: round_number, type: integer, source: computed, description: "= contract.renegotiation_round_count after this round is appended; 1 for the first round" }
      - { name: proposed_monthly_fee_cents, type: integer, source: input, description: "Proposed replacement for contract.monthly_base_fee_cents", constraints: ">= 1" }
      - { name: proposed_callback_response_minutes, type: integer, source: input, description: "Proposed replacement for contract.callback_response_minutes", constraints: ">= 1" }
      - { name: proposed_scope_type, type: enum, source: input, description: "Proposed replacement for contract.scope_type", constraints: "FULL_MAINTENANCE | OIL_AND_GREASE" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | COUNTERED | ACCEPTED | REJECTED | WITHDRAWN", constraints: "OPEN | COUNTERED | ACCEPTED | REJECTED | WITHDRAWN" }
      - { name: opened_by_user_id, type: string, source: system, description: "X-User-ID that created this round (opener or counter-party)" }
      - { name: countered_by_user_id, type: string, source: system, default: null, description: "X-User-ID that countered this round" }
      - { name: accepted_by_user_id, type: string, source: system, default: null, description: "X-User-ID that accepted this round; must differ from opened_by_user_id" }
      - { name: trigger_performance_score, type: number, source: computed, default: null, description: "contract_performance_score evaluated when the first round of the negotiation was opened; copied onto successor rounds" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------- contract
  - entity: ServiceContract
    state_field: status
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /elevator-program/contracts/{contractId}/activate"
        actor: ProgramAdministrator
        preconditions:
          - "status == DRAFT"
          - "term_end_date > term_start_date"
        side_effects:
          - "increments ServiceContract.version by 1"

      - from: ACTIVE
        to: SERVICE_ALERT
        trigger: "system: cars_out_of_service_count reaches OUT_OF_SERVICE_ESCALATION_COUNT (2) after an ElevatorCar availability_state transition to OUT_OF_SERVICE"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "cars_out_of_service_count >= 2 after the triggering car transition"
        side_effects:
          - "sets ServiceContract.status = SERVICE_ALERT"
          - "increments ServiceContract.version by 1"
          - "blocks POST /elevator-program/downtime-windows for every car on this contract with error ERR_CONTRACT_NOT_ACTIVE"
        note: "Hop 4 of the inspection-FAIL cascade; caused by the car's availability change, not directly by the inspection call."

      - from: SERVICE_ALERT
        to: ACTIVE
        trigger: "system: cars_out_of_service_count falls below OUT_OF_SERVICE_ESCALATION_COUNT (2) after an ElevatorCar leaves OUT_OF_SERVICE"
        actor: system
        preconditions:
          - "status == SERVICE_ALERT"
          - "cars_out_of_service_count <= 1 after the triggering car transition"
        side_effects:
          - "sets ServiceContract.status = ACTIVE"
          - "increments ServiceContract.version by 1"

      - from: ACTIVE
        to: UNDER_RENEGOTIATION
        trigger: "POST /elevator-program/renegotiations"
        actor: BuildingManager
        preconditions:
          - "status == ACTIVE"
          - "contract_performance_score < RENEGOTIATION_TRIGGER_SCORE (75.00), strictly less"
          - "renegotiation_round_count < MAX_RENEGOTIATION_ROUNDS (4)"
        side_effects:
          - "creates RenegotiationRound with status OPEN and round_number = renegotiation_round_count + 1"
          - "sets ServiceContract.performance_score to the evaluated score"
          - "increments ServiceContract.renegotiation_round_count by 1"
          - "increments ServiceContract.version by 1"

      - from: UNDER_RENEGOTIATION
        to: ACTIVE
        trigger: "POST /elevator-program/renegotiations/{roundId}/accept"
        actor: BuildingManager | ServiceContractor
        preconditions:
          - "status == UNDER_RENEGOTIATION"
          - "the accepted RenegotiationRound.status == OPEN"
          - "X-User-ID != RenegotiationRound.opened_by_user_id"
        side_effects:
          - "sets ServiceContract.monthly_base_fee_cents = round.proposed_monthly_fee_cents"
          - "sets ServiceContract.callback_response_minutes = round.proposed_callback_response_minutes"
          - "sets ServiceContract.scope_type = round.proposed_scope_type"
          - "sets every other RenegotiationRound on this contract with status == OPEN to WITHDRAWN"
          - "sets ServiceContract.status = ACTIVE"
          - "increments ServiceContract.version by 1"

      - from: UNDER_RENEGOTIATION
        to: ACTIVE
        trigger: "POST /elevator-program/renegotiations/{roundId}/close"
        actor: BuildingManager | ServiceContractor
        preconditions:
          - "status == UNDER_RENEGOTIATION"
          - "no RenegotiationRound on this contract remains in status OPEN after the close"
        side_effects:
          - "sets ServiceContract.status = ACTIVE"
          - "increments ServiceContract.version by 1"

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /elevator-program/contracts/{contractId}/terminate"
        actor: ProgramAdministrator
        preconditions:
          - "status IN {ACTIVE, SERVICE_ALERT, UNDER_RENEGOTIATION}"
        side_effects:
          - "sets every RenegotiationRound on this contract with status IN {OPEN, COUNTERED} to WITHDRAWN"
          - "sets every ModernizationProject on this contract with status IN {PLANNED, APPROVED, IN_PROGRESS, AT_RISK} to CANCELLED"
          - "increments ServiceContract.version by 1"

      - from: SERVICE_ALERT
        to: TERMINATED
        trigger: "POST /elevator-program/contracts/{contractId}/terminate"
        actor: ProgramAdministrator
        preconditions: ["status == SERVICE_ALERT"]
        side_effects: ["same cascade as ACTIVE -> TERMINATED", "increments ServiceContract.version by 1"]

      - from: UNDER_RENEGOTIATION
        to: TERMINATED
        trigger: "POST /elevator-program/contracts/{contractId}/terminate"
        actor: ProgramAdministrator
        preconditions: ["status == UNDER_RENEGOTIATION"]
        side_effects: ["same cascade as ACTIVE -> TERMINATED", "increments ServiceContract.version by 1"]

  # ---------------------------------------------- car, availability dimension
  - entity: ElevatorCar
    state_field: availability_state
    initial_state: IN_SERVICE
    terminal_states: [DECOMMISSIONED]
    shape: parallel_dimension
    note: "Dimension 1 of 2 on ElevatorCar. Evolves independently of compliance_state except for the single guarded coupling RED_TAGGED -> OUT_OF_SERVICE."
    transitions:
      - from: IN_SERVICE
        to: OUT_OF_SERVICE
        trigger: "system: Callback created with out_of_service == true, OR compliance_state transitions to RED_TAGGED"
        actor: system
        preconditions: ["availability_state == IN_SERVICE"]
        side_effects:
          - "sets ElevatorCar.unplanned_outage_open_since to the current logical clock"
          - "increments ServiceContract.cars_out_of_service_count by 1"
          - "increments ElevatorCar.version by 1"
          - "may trigger ServiceContract ACTIVE -> SERVICE_ALERT"

      - from: OUT_OF_SERVICE
        to: IN_SERVICE
        trigger: "system: the last open Callback on the car reaches CLEARED and compliance_state != RED_TAGGED"
        actor: system
        preconditions:
          - "availability_state == OUT_OF_SERVICE"
          - "no Callback on this car with status IN {REPORTED, ESCALATED, ON_SITE} and out_of_service == true"
          - "compliance_state != RED_TAGGED"
        side_effects:
          - "clears ElevatorCar.unplanned_outage_open_since to null"
          - "decrements ServiceContract.cars_out_of_service_count by 1"
          - "increments ElevatorCar.version by 1"
          - "may trigger ServiceContract SERVICE_ALERT -> ACTIVE"

      - from: IN_SERVICE
        to: UNDER_MODERNIZATION
        trigger: "POST /elevator-program/_clock/set_current_utc advances the clock into [window_start, window_end) of a SCHEDULED MODERNIZATION DowntimeWindow on this car"
        actor: system
        preconditions: ["availability_state == IN_SERVICE"]
        side_effects:
          - "sets the owning ModernizationProject.status APPROVED -> IN_PROGRESS"
          - "increments ElevatorCar.version by 1"

      - from: UNDER_MODERNIZATION
        to: IN_SERVICE
        trigger: "POST /elevator-program/_clock/set_current_utc advances the clock to or past window_end of every SCHEDULED MODERNIZATION DowntimeWindow on this car"
        actor: system
        preconditions: ["availability_state == UNDER_MODERNIZATION"]
        side_effects:
          - "sets each elapsed DowntimeWindow.status SCHEDULED -> COMPLETED"
          - "increments ElevatorCar.version by 1"

      - from: IN_SERVICE
        to: DECOMMISSIONED
        trigger: "POST /elevator-program/cars/{carId}/decommission"
        actor: ProgramAdministrator
        preconditions: ["availability_state IN {IN_SERVICE, OUT_OF_SERVICE}"]
        side_effects:
          - "sets every PartOrder on this car with status IN {ORDERED, SUBSTITUTED} to CANCELLED"
          - "sets every DowntimeWindow on this car with status == SCHEDULED to CANCELLED and recomputes ElevatorCar.scheduled_downtime_minutes"
          - "sets every StateInspection on this car with status == SCHEDULED to CANCELLED"
          - "sets every Callback on this car with status IN {REPORTED, ESCALATED, ON_SITE} to CANCELLED"
          - "excludes the car from every uptime, credit and penalty aggregate from this instant onward"
          - "increments ElevatorCar.version by 1"

      - from: OUT_OF_SERVICE
        to: DECOMMISSIONED
        trigger: "POST /elevator-program/cars/{carId}/decommission"
        actor: ProgramAdministrator
        preconditions: ["availability_state == OUT_OF_SERVICE"]
        side_effects:
          - "same cascade as IN_SERVICE -> DECOMMISSIONED"
          - "decrements ServiceContract.cars_out_of_service_count by 1"
          - "increments ElevatorCar.version by 1"

  # ------------------------------------------------ car, compliance dimension
  - entity: ElevatorCar
    state_field: compliance_state
    initial_state: INSPECTION_DUE
    terminal_states: []
    shape: parallel_dimension
    note: "Dimension 2 of 2 on ElevatorCar. A car may be IN_SERVICE while CERTIFICATE_EXPIRED; only RED_TAGGED forces the availability dimension."
    transitions:
      - from: INSPECTION_DUE
        to: CERTIFIED
        trigger: "POST /elevator-program/inspections/{inspectionId}/post-certificate"
        actor: BuildingManager
        preconditions:
          - "the StateInspection.certificate_state == ISSUED"
          - "compliance_state IN {INSPECTION_DUE, CERTIFICATE_EXPIRED}"
        side_effects:
          - "sets StateInspection.certificate_state = POSTED"
          - "sets any other StateInspection on this car with certificate_state == POSTED to SUPERSEDED"
          - "recomputes ElevatorCar.current_certificate_number and ElevatorCar.certificate_expiry_date"
          - "increments ElevatorCar.version by 1"

      - from: CERTIFIED
        to: CERTIFICATE_EXPIRED
        trigger: "POST /elevator-program/_clock/set_current_utc advances the clock past ElevatorCar.certificate_expiry_date"
        actor: system
        preconditions: ["compliance_state == CERTIFIED"]
        side_effects:
          - "sets the POSTED StateInspection.certificate_state = EXPIRED"
          - "increments ElevatorCar.version by 1"

      - from: INSPECTION_DUE
        to: RED_TAGGED
        trigger: "POST /elevator-program/inspections/{inspectionId}/record-result with result == FAIL"
        actor: StateInspector
        preconditions: ["compliance_state != RED_TAGGED"]
        side_effects:
          - "sets ElevatorCar.red_tag_issued_at to the current logical clock"
          - "forces the availability dimension IN_SERVICE -> OUT_OF_SERVICE (hop 3 of the inspection-FAIL cascade)"
          - "increments ElevatorCar.version by 1"

      - from: CERTIFIED
        to: RED_TAGGED
        trigger: "POST /elevator-program/inspections/{inspectionId}/record-result with result == FAIL"
        actor: StateInspector
        preconditions: ["compliance_state == CERTIFIED"]
        side_effects:
          - "sets the POSTED StateInspection.certificate_state = SUPERSEDED"
          - "same availability cascade as INSPECTION_DUE -> RED_TAGGED"
          - "increments ElevatorCar.version by 1"

      - from: CERTIFICATE_EXPIRED
        to: RED_TAGGED
        trigger: "POST /elevator-program/inspections/{inspectionId}/record-result with result == FAIL"
        actor: StateInspector
        preconditions: ["compliance_state == CERTIFICATE_EXPIRED"]
        side_effects: ["same availability cascade as INSPECTION_DUE -> RED_TAGGED", "increments ElevatorCar.version by 1"]

      - from: RED_TAGGED
        to: INSPECTION_DUE
        trigger: "POST /elevator-program/inspections/{inspectionId}/record-result with inspection_type == REINSPECTION and result IN {PASS, PASS_WITH_DEFICIENCIES}"
        actor: StateInspector
        preconditions:
          - "compliance_state == RED_TAGGED"
          - "the inspection being recorded has inspection_type == REINSPECTION"
        side_effects:
          - "sets ElevatorCar.red_tag_lifted_at to the current logical clock"
          - "returns the availability dimension OUT_OF_SERVICE -> IN_SERVICE when no open out-of-service Callback remains"
          - "issues a certificate on the reinspection (certificate_state NONE -> ISSUED)"
          - "increments ElevatorCar.version by 1"

  # ----------------------------------------------------------------- visit
  - entity: MaintenanceVisit
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [VERIFIED, REJECTED, MISSED]
    shape: cyclic
    transitions:
      - from: SCHEDULED
        to: PERFORMED
        trigger: "POST /elevator-program/visits/{visitId}/perform"
        actor: ServiceContractor
        preconditions:
          - "status == SCHEDULED"
          - "ElevatorCar.availability_state != DECOMMISSIONED"
        side_effects:
          - "stores task_items, recomputes completed_task_codes and missing_task_codes against the contract scope_type task list"
          - "sets performed_at and performed_by_user_id"

      - from: PERFORMED
        to: VERIFIED
        trigger: "POST /elevator-program/visits/{visitId}/verify"
        actor: BuildingManager
        preconditions:
          - "status == PERFORMED"
          - "ServiceContract.status IN {ACTIVE, SERVICE_ALERT}"
          - "missing_task_codes is empty"
          - "X-User-ID != performed_by_user_id"
        side_effects:
          - "sets verified_at and verified_by_user_id"

      - from: PERFORMED
        to: DISPUTED
        trigger: "POST /elevator-program/visits/{visitId}/dispute"
        actor: BuildingManager
        preconditions:
          - "status == PERFORMED"
          - "rework_count < MAX_REWORK_COUNT (2)"
        side_effects:
          - "increments rework_count by 1"
          - "stores dispute_reason"

      - from: DISPUTED
        to: PERFORMED
        trigger: "POST /elevator-program/visits/{visitId}/perform"
        actor: ServiceContractor
        preconditions:
          - "status == DISPUTED"
          - "ElevatorCar.availability_state != DECOMMISSIONED"
        side_effects:
          - "replaces task_items and recomputes completed_task_codes / missing_task_codes"
          - "refreshes performed_at and performed_by_user_id"
        note: "Rework loop: PERFORMED -> DISPUTED -> PERFORMED, bounded by MAX_REWORK_COUNT."

      - from: SCHEDULED
        to: MISSED
        trigger: "POST /elevator-program/_clock/set_current_utc advances the clock to or past the first instant of the month after period_month"
        actor: system
        preconditions: ["status == SCHEDULED"]
        side_effects: ["counts toward PenaltyAssessment.missed_visit_count for period_month"]

      - from: DISPUTED
        to: REJECTED
        trigger: "POST /elevator-program/_clock/set_current_utc advances the clock to or past the first instant of the month after period_month"
        actor: system
        preconditions: ["status == DISPUTED"]
        side_effects: ["counts toward PenaltyAssessment.missed_visit_count for period_month"]

  # --------------------------------------------------------------- callback
  - entity: Callback
    state_field: status
    initial_state: REPORTED
    terminal_states: [CLEARED, CANCELLED]
    shape: branching
    transitions:
      - from: REPORTED
        to: ESCALATED
        trigger: "POST /elevator-program/callbacks/{callbackId}/fire-dispatch"
        actor: FireDispatcher
        preconditions:
          - "status == REPORTED"
          - "callback_type == ENTRAPMENT OR passengers_trapped >= 1"
        side_effects:
          - "sets fire_dispatch_requested_at and fire_dispatch_incident_number"
        note: "Fire-department branch. Divergent side-effect set: this branch stamps the fire fields and makes the callback eligible for the ENTRAPMENT SLA weighting in SCHEDULE_B severity."

      - from: REPORTED
        to: ON_SITE
        trigger: "POST /elevator-program/callbacks/{callbackId}/arrive"
        actor: ServiceContractor
        preconditions:
          - "status == REPORTED"
          - "callback_type != ENTRAPMENT (an ENTRAPMENT callback must be escalated to the fire department first)"
        side_effects:
          - "sets arrived_at, computes response_minutes, sla_minutes and sla_breached"

      - from: ESCALATED
        to: ON_SITE
        trigger: "POST /elevator-program/callbacks/{callbackId}/arrive"
        actor: ServiceContractor
        preconditions: ["status == ESCALATED"]
        side_effects:
          - "sets arrived_at, computes response_minutes, sla_minutes and sla_breached"
        note: "Join point: both branches converge on ON_SITE."

      - from: ON_SITE
        to: CLEARED
        trigger: "POST /elevator-program/callbacks/{callbackId}/clear"
        actor: ServiceContractor
        preconditions: ["status == ON_SITE"]
        side_effects:
          - "sets cleared_at and resolution_note"
          - "closes the unplanned outage interval [reported_at, cleared_at) used by car_uptime_percentage when out_of_service == true"
          - "returns ElevatorCar availability OUT_OF_SERVICE -> IN_SERVICE when no other open out-of-service callback remains and compliance_state != RED_TAGGED"

      - from: REPORTED
        to: CANCELLED
        trigger: "POST /elevator-program/cars/{carId}/decommission cascade"
        actor: system
        preconditions: ["status IN {REPORTED, ESCALATED, ON_SITE}"]
        side_effects: ["the callback contributes no outage interval to any uptime calculation"]

  # ------------------------------------------------------ state inspection
  - entity: StateInspection
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    shape: branching
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /elevator-program/inspections/{inspectionId}/record-result"
        actor: StateInspector
        preconditions:
          - "status == SCHEDULED"
          - "ElevatorCar.availability_state != DECOMMISSIONED"
        side_effects:
          - "sets result, deficiency_codes and result_recorded_at"
          - "on result IN {PASS, PASS_WITH_DEFICIENCIES}: certificate_state NONE -> ISSUED, mints certificate_number, certificate_issued_date and certificate_expiry_date"
          - "on result == FAIL: leaves certificate_state at NONE and drives ElevatorCar.compliance_state -> RED_TAGGED (hop 2 of the inspection-FAIL cascade)"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /elevator-program/cars/{carId}/decommission cascade"
        actor: system
        preconditions: ["status == SCHEDULED"]
        side_effects: ["no certificate is minted"]

  # --------------------------------------- state inspection, certificate dim
  - entity: StateInspection
    state_field: certificate_state
    initial_state: NONE
    terminal_states: [EXPIRED, SUPERSEDED]
    shape: parallel_dimension
    note: "Second dimension on StateInspection; the certificate can be POSTED long after the inspection dimension reached COMPLETED, and can expire while the inspection row is untouched."
    transitions:
      - from: NONE
        to: ISSUED
        trigger: "POST /elevator-program/inspections/{inspectionId}/record-result with result IN {PASS, PASS_WITH_DEFICIENCIES}"
        actor: StateInspector
        preconditions: ["certificate_state == NONE"]
        side_effects: ["mints certificate_number, certificate_issued_date, certificate_expiry_date"]

      - from: ISSUED
        to: POSTED
        trigger: "POST /elevator-program/inspections/{inspectionId}/post-certificate"
        actor: BuildingManager
        preconditions:
          - "certificate_state == ISSUED"
          - "the current logical-clock date <= certificate_expiry_date"
        side_effects:
          - "sets certificate_posted_at and posted_by_user_id"
          - "drives ElevatorCar.compliance_state -> CERTIFIED"

      - from: POSTED
        to: EXPIRED
        trigger: "POST /elevator-program/_clock/set_current_utc advances the clock past certificate_expiry_date"
        actor: system
        preconditions: ["certificate_state == POSTED"]
        side_effects: ["drives ElevatorCar.compliance_state CERTIFIED -> CERTIFICATE_EXPIRED"]

      - from: POSTED
        to: SUPERSEDED
        trigger: "POST /elevator-program/inspections/{otherInspectionId}/post-certificate on the same car"
        actor: BuildingManager
        preconditions: ["certificate_state == POSTED", "a newer certificate on the same car reaches POSTED"]
        side_effects: ["ElevatorCar.current_certificate_number switches to the newer certificate"]

  # ------------------------------------------------- modernization project
  - entity: ModernizationProject
    state_field: status
    initial_state: PLANNED
    terminal_states: [COMPLETE, CANCELLED]
    shape: branching
    transitions:
      - from: PLANNED
        to: APPROVED
        trigger: "POST /elevator-program/projects/{projectId}/approve"
        actor: BuildingManager
        preconditions:
          - "status == PLANNED"
          - "ServiceContract.status IN {ACTIVE, SERVICE_ALERT}"
        side_effects: ["sets approved_by_user_id"]

      - from: APPROVED
        to: IN_PROGRESS
        trigger: "POST /elevator-program/_clock/set_current_utc advances the clock into the first SCHEDULED MODERNIZATION window of this project"
        actor: system
        preconditions: ["status == APPROVED"]
        side_effects: ["drives the car's availability dimension IN_SERVICE -> UNDER_MODERNIZATION"]

      - from: APPROVED
        to: AT_RISK
        trigger: "system: a part-lead-time cascade shifts a project window so target_completion_date exceeds ServiceContract.term_end_date"
        actor: system
        preconditions: ["status IN {APPROVED, IN_PROGRESS}"]
        side_effects:
          - "sets target_completion_date = max(date(window_end)) over DowntimeWindow rows with project_id == this project and status IN {SCHEDULED, COMPLETED}"
        note: "Hop 3 of the obsolete-part cascade."

      - from: IN_PROGRESS
        to: AT_RISK
        trigger: "system: same as APPROVED -> AT_RISK"
        actor: system
        preconditions: ["status == IN_PROGRESS"]
        side_effects: ["same as APPROVED -> AT_RISK"]

      - from: APPROVED
        to: COMPLETE
        trigger: "POST /elevator-program/projects/{projectId}/complete"
        actor: ProgramAdministrator
        preconditions:
          - "status IN {APPROVED, IN_PROGRESS, AT_RISK}"
          - "no DowntimeWindow with project_id == this project remains in status SCHEDULED"
        side_effects: ["freezes window_count"]

      - from: IN_PROGRESS
        to: COMPLETE
        trigger: "POST /elevator-program/projects/{projectId}/complete"
        actor: ProgramAdministrator
        preconditions: ["status == IN_PROGRESS", "no SCHEDULED window remains"]
        side_effects: ["freezes window_count"]

      - from: AT_RISK
        to: COMPLETE
        trigger: "POST /elevator-program/projects/{projectId}/complete"
        actor: ProgramAdministrator
        preconditions: ["status == AT_RISK", "no SCHEDULED window remains"]
        side_effects: ["freezes window_count"]

      - from: PLANNED
        to: CANCELLED
        trigger: "POST /elevator-program/contracts/{contractId}/terminate cascade"
        actor: system
        preconditions: ["status IN {PLANNED, APPROVED, IN_PROGRESS, AT_RISK}"]
        side_effects: ["sets every SCHEDULED DowntimeWindow of this project to CANCELLED and recomputes each car's scheduled_downtime_minutes"]

  # ------------------------------------------------------- downtime window
  - entity: DowntimeWindow
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    shape: branching
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /elevator-program/downtime-windows/{windowId}/cancel"
        actor: ProgramAdministrator | ServiceContractor
        preconditions:
          - "status IN {SCHEDULED, RESCHEDULE_REQUIRED}"
          - "the current logical clock is strictly before window_start"
        side_effects:
          - "subtracts duration_minutes from ElevatorCar.scheduled_downtime_minutes, restoring the pre-creation value exactly"
          - "decrements ModernizationProject.window_count by 1 when project_id is not null"
          - "increments ElevatorCar.version by 1"

      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /elevator-program/_clock/set_current_utc advances the clock to or past window_end"
        actor: system
        preconditions: ["status == SCHEDULED"]
        side_effects: ["leaves ElevatorCar.scheduled_downtime_minutes unchanged (COMPLETED windows stay in the sum)"]

      - from: SCHEDULED
        to: RESCHEDULE_REQUIRED
        trigger: "system: a part-lead-time cascade would shift this window onto an existing SCHEDULED window on the same car"
        actor: system
        preconditions: ["status == SCHEDULED", "the shifted interval would collide under the overlap rule"]
        side_effects:
          - "leaves window_start and window_end unchanged"
          - "increments reschedule_count by 1"
          - "removes duration_minutes from ElevatorCar.scheduled_downtime_minutes, because RESCHEDULE_REQUIRED windows no longer occupy the resource"
          - "increments ElevatorCar.version by 1"
        note: "Conditional cascade: the shift is refused rather than creating an overlapping occupation."

      - from: RESCHEDULE_REQUIRED
        to: CANCELLED
        trigger: "POST /elevator-program/downtime-windows/{windowId}/cancel"
        actor: ProgramAdministrator | ServiceContractor
        preconditions: ["status == RESCHEDULE_REQUIRED"]
        side_effects: ["same as SCHEDULED -> CANCELLED"]

  # ------------------------------------------------------------ spare part
  - entity: SparePart
    state_field: lifecycle_state
    initial_state: ACTIVE
    terminal_states: [DISCONTINUED]
    shape: branching
    transitions:
      - from: ACTIVE
        to: OBSOLETE
        trigger: "POST /elevator-program/parts/{partId}/obsolete with replacement_part_id supplied"
        actor: ProgramAdministrator
        preconditions:
          - "lifecycle_state == ACTIVE"
          - "the replacement part exists and its lifecycle_state != DISCONTINUED"
          - "the replacement part is not this part"
        side_effects:
          - "sets superseded_by_part_id and obsoleted_at"
          - "every subsequent PartOrder naming this part resolves forward to the successor chain"

      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /elevator-program/parts/{partId}/obsolete with replacement_part_id omitted"
        actor: ProgramAdministrator
        preconditions: ["lifecycle_state == ACTIVE"]
        side_effects:
          - "sets obsoleted_at, leaves superseded_by_part_id null"
          - "every subsequent PartOrder naming this part is rejected with ERR_PART_DISCONTINUED"

      - from: OBSOLETE
        to: DISCONTINUED
        trigger: "POST /elevator-program/parts/{partId}/obsolete with replacement_part_id omitted"
        actor: ProgramAdministrator
        preconditions: ["lifecycle_state == OBSOLETE"]
        side_effects: ["clears superseded_by_part_id to null"]

  # ------------------------------------------------------------ part order
  - entity: PartOrder
    state_field: status
    initial_state: ORDERED
    terminal_states: [RECEIVED, CANCELLED]
    shape: branching
    transitions:
      - from: ORDERED
        to: SUBSTITUTED
        trigger: "POST /elevator-program/part-orders (creation-time branch when the requested SparePart.lifecycle_state == OBSOLETE)"
        actor: ServiceContractor
        preconditions: ["the requested part resolves to a different effective_part_id in at most SUPERSESSION_MAX_DEPTH (3) hops"]
        side_effects:
          - "sets effective_part_id, substitution_hops >= 1"
          - "adds OBSOLETE_SUBSTITUTION_PENALTY_DAYS * substitution_hops to lead_time_days_applied"
          - "shifts the linked DowntimeWindow forward (hop 2 of the obsolete-part cascade)"
        note: "Divergent branch: an order on an ACTIVE part is created directly in ORDERED with substitution_hops == 0 and no window shift."

      - from: ORDERED
        to: RECEIVED
        trigger: "POST /elevator-program/part-orders/{orderId}/receive"
        actor: ServiceContractor
        preconditions: ["status IN {ORDERED, SUBSTITUTED}"]
        side_effects:
          - "decrements ElevatorCar.open_part_order_count by 1"
          - "increments ElevatorCar.version by 1"

      - from: SUBSTITUTED
        to: RECEIVED
        trigger: "POST /elevator-program/part-orders/{orderId}/receive"
        actor: ServiceContractor
        preconditions: ["status == SUBSTITUTED"]
        side_effects: ["same as ORDERED -> RECEIVED"]

      - from: ORDERED
        to: CANCELLED
        trigger: "POST /elevator-program/cars/{carId}/decommission cascade"
        actor: system
        preconditions: ["status IN {ORDERED, SUBSTITUTED}"]
        side_effects: ["decrements ElevatorCar.open_part_order_count by 1"]

  # ---------------------------------------------------- penalty assessment
  - entity: PenaltyAssessment
    state_field: status
    initial_state: ISSUED
    terminal_states: [UPHELD, WAIVED, CREDITED, SUPERSEDED]
    shape: branching
    transitions:
      - from: ISSUED
        to: SUPERSEDED
        trigger: "POST /elevator-program/penalties (a later assessment for the same contract_id and period_month)"
        actor: ProgramAdministrator
        preconditions: ["status == ISSUED"]
        side_effects:
          - "subtracts amount_cents from ServiceContract.penalty_lifetime_assessed_cents and recomputes penalty_balance_cents"
          - "increments ServiceContract.version by 1"

      - from: ISSUED
        to: DISPUTED
        trigger: "POST /elevator-program/penalties/{penaltyId}/dispute"
        actor: BuildingManager
        preconditions: ["status == ISSUED"]
        side_effects: ["stores dispute_reason", "leaves ServiceContract.penalty_balance_cents unchanged"]

      - from: DISPUTED
        to: UPHELD
        trigger: "POST /elevator-program/penalties/{penaltyId}/resolve with resolution == UPHELD"
        actor: ProgramAdministrator
        preconditions: ["status == DISPUTED", "X-User-ID != assessed_by_user_id"]
        side_effects:
          - "leaves ServiceContract.penalty_balance_cents unchanged"
          - "sets resolved_by_user_id and resolution_note"
          - "increments ServiceContract.version by 1"

      - from: DISPUTED
        to: WAIVED
        trigger: "POST /elevator-program/penalties/{penaltyId}/resolve with resolution == WAIVED"
        actor: ProgramAdministrator
        preconditions: ["status == DISPUTED", "X-User-ID != assessed_by_user_id"]
        side_effects:
          - "adds amount_cents to ServiceContract.penalty_lifetime_waived_cents"
          - "recomputes ServiceContract.penalty_balance_cents = assessed - waived - credited, restoring the pre-assessment balance exactly"
          - "increments ServiceContract.version by 1"

      - from: DISPUTED
        to: CREDITED
        trigger: "POST /elevator-program/penalties/{penaltyId}/resolve with resolution == CREDITED"
        actor: ProgramAdministrator
        preconditions: ["status == DISPUTED", "X-User-ID != assessed_by_user_id"]
        side_effects:
          - "adds amount_cents to ServiceContract.penalty_lifetime_credited_cents"
          - "recomputes ServiceContract.penalty_balance_cents"
          - "increments ServiceContract.version by 1"

  # -------------------------------------------------- renegotiation round
  - entity: RenegotiationRound
    state_field: status
    initial_state: OPEN
    terminal_states: [ACCEPTED, REJECTED, WITHDRAWN]
    shape: cyclic
    transitions:
      - from: OPEN
        to: COUNTERED
        trigger: "POST /elevator-program/renegotiations/{roundId}/counter"
        actor: ServiceContractor | BuildingManager
        preconditions:
          - "status == OPEN"
          - "ServiceContract.status == UNDER_RENEGOTIATION"
          - "ServiceContract.renegotiation_round_count < MAX_RENEGOTIATION_ROUNDS (4)"
          - "X-User-ID != opened_by_user_id"
        side_effects:
          - "sets countered_by_user_id on this round"
          - "creates a successor RenegotiationRound with status OPEN, round_number = contract.renegotiation_round_count + 1, and trigger_performance_score copied from this round"
          - "increments ServiceContract.renegotiation_round_count by 1"
          - "increments ServiceContract.version by 1"
        note: "Cycle: OPEN -> COUNTERED spawns a fresh OPEN successor, so the negotiation loops until accept, close, or the round limit."

      - from: OPEN
        to: ACCEPTED
        trigger: "POST /elevator-program/renegotiations/{roundId}/accept"
        actor: BuildingManager | ServiceContractor
        preconditions:
          - "status == OPEN"
          - "ServiceContract.status == UNDER_RENEGOTIATION"
          - "X-User-ID != opened_by_user_id"
        side_effects:
          - "sets accepted_by_user_id"
          - "rewrites ServiceContract.monthly_base_fee_cents, callback_response_minutes and scope_type from the proposal"
          - "sets sibling OPEN rounds to WITHDRAWN and returns the contract to ACTIVE"

      - from: OPEN
        to: REJECTED
        trigger: "POST /elevator-program/renegotiations/{roundId}/close with outcome == REJECTED"
        actor: BuildingManager | ServiceContractor
        preconditions: ["status == OPEN", "X-User-ID != opened_by_user_id"]
        side_effects: ["returns ServiceContract to ACTIVE when no OPEN round remains"]

      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /elevator-program/renegotiations/{roundId}/close with outcome == WITHDRAWN"
        actor: BuildingManager | ServiceContractor
        preconditions: ["status == OPEN", "X-User-ID == opened_by_user_id"]
        side_effects: ["returns ServiceContract to ACTIVE when no OPEN round remains"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: penalty-assess-stale-contract
    parent_entity: ServiceContract
    write_endpoint: "POST /elevator-program/penalties"
    occ_field: "expected_contract_version"
    description: |
      Issuing a PenaltyAssessment against a ServiceContract whose version has
      advanced since the client last observed it is rejected. Re-assessment of a
      period is a legitimate operation — a new assessment supersedes the prior
      ISSUED one for the same contract_id and period_month and rewrites the
      contract's penalty ledger — so a writer holding a stale view of the ledger
      would otherwise overwrite a balance it never saw. The stale-version check
      makes that observable and deterministic.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

  - rule_id: part-order-stale-car
    parent_entity: ElevatorCar
    write_endpoint: "POST /elevator-program/part-orders"
    occ_field: "expected_car_version"
    description: |
      Creating a PartOrder against an ElevatorCar whose version has advanced
      since the client last observed it is rejected. Ordering the same part again
      for a car is legitimate — the newer order supersedes the earlier intent and
      re-derives promised_date from the current supersession chain — so a writer
      whose view of the car (open_part_order_count, availability_state, downtime
      windows) is stale must re-read before ordering.
    error_id: ERR_STALE_CAR_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: car_uptime_percentage
    trigger: "GET /elevator-program/cars/{carId}/uptime-report; and as an input to penalty_assessment_amount, contract_monthly_credit_cents and contract_performance_score during POST /elevator-program/penalties and POST /elevator-program/renegotiations"
    algorithm: interval_merge
    formula: |
      period_start   = first instant of period_month, 00:00:00.000 UTC   (inclusive)
      period_end     = first instant of the following month, 00:00:00.000 UTC (exclusive)
      period_minutes = whole minutes in the half-open interval [period_start, period_end)

      # --- unplanned occupation intervals on this car, each clipped to [period_start, period_end)
      U1 = for every Callback c with c.car_id == car.id, c.out_of_service == true and
           c.status == CLEARED:  [c.reported_at, c.cleared_at)
      U2 = for every Callback c with c.car_id == car.id, c.out_of_service == true and
           c.status IN {REPORTED, ESCALATED, ON_SITE}:  [c.reported_at, period_end)
      U3 = for every StateInspection i with i.car_id == car.id, i.status == COMPLETED and
           i.result == FAIL:  [i.result_recorded_at, coalesce(car.red_tag_lifted_at, period_end))
      unplanned_minutes = total length of the union-merge of U1 U U2 U U3 (overlaps counted once)

      # --- planned occupation intervals on this car, each clipped to [period_start, period_end)
      P1 = for every DowntimeWindow w with w.car_id == car.id and
           w.status IN {SCHEDULED, COMPLETED}:  [w.window_start, w.window_end)
      planned_minutes = total length of (union-merge of P1) minus its intersection with the
                        unplanned union — a minute is never counted as both planned and unplanned

      available_minutes = period_minutes - planned_minutes - unplanned_minutes
    input_set: |
      Callbacks with status IN {REPORTED, ESCALATED, ON_SITE, CLEARED} (CANCELLED callbacks are
      excluded entirely); StateInspection rows with status == COMPLETED and result == FAIL;
      DowntimeWindow rows with status IN {SCHEDULED, COMPLETED} (CANCELLED and
      RESCHEDULE_REQUIRED windows are excluded). Cars with availability_state == DECOMMISSIONED
      are excluded from every contract-level roll-up but still answer the per-car endpoint.
      Interval merge order is pinned to interval start ASC, then interval end ASC; ties are
      immaterial to the merged length and no identifier participates in the ordering.
    constants:
      MINUTES_PER_DAY: 1440
    precision: "uptime percentages: 2 decimal places, round_half_up; minute counts: whole minutes, truncated toward zero"
    variants:
      - name: EXCLUSIVE
        when: "Applied to penalties and credits when ServiceContract.scope_type == FULL_MAINTENANCE; always reported as uptime_pct_exclusive by GET /cars/{carId}/uptime-report"
        difference: "uptime_pct = available_minutes / (period_minutes - planned_minutes) * 100 — scheduled downtime is removed from the denominator, so planned modernization outages never reduce uptime."
      - name: INCLUSIVE
        when: "Applied to penalties and credits when ServiceContract.scope_type == OIL_AND_GREASE; always reported as uptime_pct_inclusive by GET /cars/{carId}/uptime-report"
        difference: "uptime_pct = available_minutes / period_minutes * 100 — scheduled downtime stays in the denominator, so planned outages depress uptime exactly like unplanned ones."

  - name: penalty_assessment_amount
    trigger: "POST /elevator-program/penalties — the transition that creates a PenaltyAssessment in status ISSUED"
    algorithm: tiered_pricing
    formula: |
      # step 1 — contract-level uptime for the period
      variant            = EXCLUSIVE if contract.scope_type == FULL_MAINTENANCE else INCLUSIVE
      car_set            = ElevatorCar rows with contract_id == contract.id and
                           availability_state != DECOMMISSIONED, iterated by car_code ASC
      uptime_pct_applied = 100.00 when car_set is empty is NOT reachable (see ERR_NO_CARS_IN_SCOPE);
                           otherwise round_half_up(
                             arithmetic mean of car_uptime_percentage(car, period_month, variant)
                             where each per-car value is already rounded to 2 decimals, 2)
      shortfall_pp       = max(0.00, UPTIME_TARGET_PCT - uptime_pct_applied)

      # step 2 — breach counters over the period (all three use explicit status filters)
      late_callback_count     = count(Callback c : c.car_id IN car_set, c.status == CLEARED,
                                      c.callback_type != ENTRAPMENT, c.sla_breached == true,
                                      c.reported_at in [period_start, period_end))
      entrapment_breach_count = same filter but c.callback_type == ENTRAPMENT
      missed_visit_count      = count(MaintenanceVisit v : v.car_id IN car_set,
                                      v.period_month == period_month,
                                      v.status IN {MISSED, REJECTED})

      # step 3 — schedule branch
      if contract.penalty_schedule == SCHEDULE_A:
        raw_amount_cents = LATE_CALLBACK_FEE_CENTS * late_callback_count
                         + ENTRAPMENT_FEE_CENTS   * entrapment_breach_count
                         + MISSED_VISIT_FEE_CENTS * missed_visit_count
                         + round_half_up(shortfall_pp * UPTIME_PENALTY_PER_PP_CENTS, 0)
        cap_amount_cents = round_half_up(contract.monthly_base_fee_cents * PENALTY_CAP_PCT_A, 0)
      else:  # SCHEDULE_B
        tier_pct        = 0.00 if uptime_pct_applied >= 98.50
                          else 0.05 if uptime_pct_applied >= 97.00
                          else 0.10 if uptime_pct_applied >= 95.00
                          else 0.20
        breach_pct      = SCHEDULE_B_BREACH_PCT * (late_callback_count
                                                   + 2 * entrapment_breach_count
                                                   + missed_visit_count)
        severity_weight = 3 if entrapment_breach_count > 0
                          else 2 if shortfall_pp >= SEVERE_SHORTFALL_PP
                          else 1
        raw_amount_cents = round_half_up(contract.monthly_base_fee_cents
                                         * (tier_pct + breach_pct) * severity_weight, 0)
        cap_amount_cents = round_half_up(contract.monthly_base_fee_cents * PENALTY_CAP_PCT_B, 0)

      amount_cents = min(raw_amount_cents, cap_amount_cents)
    input_set: "Only CLEARED callbacks whose reported_at falls in the half-open period window, only MISSED/REJECTED visits stamped with the exact period_month string, and only non-DECOMMISSIONED cars. ISSUED assessments for the same contract_id and period_month are superseded, not summed."
    constants:
      UPTIME_TARGET_PCT: 98.50
      SEVERE_SHORTFALL_PP: 2.00
      LATE_CALLBACK_FEE_CENTS: 25000
      ENTRAPMENT_FEE_CENTS: 100000
      MISSED_VISIT_FEE_CENTS: 75000
      UPTIME_PENALTY_PER_PP_CENTS: 40000
      PENALTY_CAP_PCT_A: 0.25
      SCHEDULE_B_BREACH_PCT: 0.02
      PENALTY_CAP_PCT_B: 0.30
    precision: "cents, integers, round_half_up applied once per bracketed product as written above"
    variants:
      - name: SCHEDULE_A
        when: "ServiceContract.penalty_schedule == SCHEDULE_A"
        difference: "Per-incident flat fees plus a linear uptime-shortfall charge, capped at 25% of the monthly base fee. Insensitive to how bad a single breach was; sensitive to how many there were."
      - name: SCHEDULE_B
        when: "ServiceContract.penalty_schedule == SCHEDULE_B"
        difference: "A percentage of the monthly base fee: a tiered uptime rate plus a per-breach percentage, multiplied by a severity weight of 1/2/3, capped at 30% of the fee. For identical incident data it produces a materially different number from SCHEDULE_A."

  - name: contract_monthly_credit_cents
    trigger: "POST /elevator-program/penalties — stored on the created PenaltyAssessment as service_credit_cents"
    algorithm: aggregation
    formula: |
      car_set = ElevatorCar rows with contract_id == contract.id and
                availability_state != DECOMMISSIONED, iterated by car_code ASC
      n       = count(car_set)                       # n >= 1 is guaranteed by ERR_NO_CARS_IN_SCOPE
      for each car in car_set (car_code ASC):
        u_car            = car_uptime_percentage(car, period_month, variant)   # already rounded to 2dp
        car_credit_raw   = contract.monthly_base_fee_cents * (1 / n) * (100 - u_car) / 100
                           # 1/n is kept as an exact rational; it is NOT pre-rounded
        car_credit_cents = round_half_up(car_credit_raw, 0)     # <-- ROUND PER CAR
      service_credit_cents = sum of car_credit_cents over car_set               # <-- THEN SUM
    input_set: "Same car_set, variant and period window as penalty_assessment_amount. Cars with availability_state == DECOMMISSIONED contribute nothing and are excluded from n."
    constants:
      CREDIT_ROUNDING_ORDER: "round_per_car_then_sum"
    precision: |
      Whole cents, round_half_up, applied ONCE PER CAR before summation. The scaffold pins this
      order: round-per-line-item then sum. The alternative order (sum the exact rationals, then
      round once) is explicitly NOT used and produces a different total — e.g. 3 cars, a
      500000-cent fee and 99.14% uptime each give 1433 + 1433 + 1433 = 4299 under the pinned
      order versus 4300 under sum-then-round.

  - name: part_order_cost_and_promise
    trigger: "POST /elevator-program/part-orders"
    algorithm: constraint_propagation
    formula: |
      # ---- supersession resolution (self-referential walk, bounded) ----
      hops = 0; p = requested SparePart
      while p.lifecycle_state == OBSOLETE and p.superseded_by_part_id is not null:
        p = SparePart(p.superseded_by_part_id); hops = hops + 1
        if hops > SUPERSESSION_MAX_DEPTH: reject with ERR_SUPERSESSION_CHAIN_TOO_DEEP
      if p.lifecycle_state == DISCONTINUED: reject with ERR_PART_DISCONTINUED
      effective_part_id = p.id ; substitution_hops = hops

      # ---- PINNED EVALUATION ORDER (the tier looks circular; it is not) ----
      step 1: subtotal_cents           = p.unit_price_cents * quantity
      step 2: tier                     = tier_of(subtotal_cents)      # keyed on the SUBTOTAL ONLY,
                                                                      # never on total_cost_cents
      step 3: expedite_surcharge_cents = round_half_up(subtotal_cents * EXPEDITE_PCT[tier], 0)
                                         if expedite == true else 0
      step 4: total_cost_cents         = subtotal_cents + expedite_surcharge_cents
      step 5: lead_time_days_applied   = max(MIN_LEAD_DAYS,
                                             p.lead_time_days
                                             - (EXPEDITE_DAYS_SAVED if expedite else 0)
                                             + OBSOLETE_SUBSTITUTION_PENALTY_DAYS * substitution_hops)
      step 6: promised_date            = date(current logical clock) + lead_time_days_applied days

      tier_of(s): TIER_SMALL  if s <  100000
                  TIER_MEDIUM if 100000 <= s < 500000
                  TIER_LARGE  if s >= 500000
    input_set: "The requested SparePart plus every SparePart reachable through superseded_by_part_id, up to SUPERSESSION_MAX_DEPTH hops. The current logical clock supplies the promise baseline; real wall-clock time is never read."
    constants:
      SUPERSESSION_MAX_DEPTH: 3
      OBSOLETE_SUBSTITUTION_PENALTY_DAYS: 10
      EXPEDITE_DAYS_SAVED: 7
      MIN_LEAD_DAYS: 3
      EXPEDITE_PCT_TIER_SMALL: 0.20
      EXPEDITE_PCT_TIER_MEDIUM: 0.15
      EXPEDITE_PCT_TIER_LARGE: 0.10
    precision: "cents, integers, round_half_up on the surcharge only; days are whole days"
    variants:
      - name: DIRECT
        when: "the requested part's lifecycle_state == ACTIVE"
        difference: "substitution_hops == 0, no OBSOLETE_SUBSTITUTION_PENALTY_DAYS term, order created in status ORDERED, and no downtime-window shift cascade fires."
      - name: SUBSTITUTED
        when: "the requested part's lifecycle_state == OBSOLETE with a successor"
        difference: "effective_part_id and its price/lead time replace the requested part's, substitution_hops >= 1 adds 10 days per hop, the order is created in status SUBSTITUTED, and the linked DowntimeWindow is shifted forward."

  - name: downtime_window_shift
    trigger: "system side effect of POST /elevator-program/part-orders when the created order has window_id != null"
    algorithm: chronological
    formula: |
      w = DowntimeWindow(order.window_id)
      if order.promised_date <= date(w.window_start): no shift; reschedule_count unchanged
      else:
        shift_days = order.promised_date - date(w.window_start)          # whole days, positive
        candidate  = [w.window_start + shift_days days, w.window_end + shift_days days)
        if candidate collides with any other DowntimeWindow on the same car under
           downtime_overlap_rule:  w.status = RESCHEDULE_REQUIRED,
                                   window_start/window_end unchanged,
                                   reschedule_count = reschedule_count + 1
        else:                      window_start/window_end = candidate,
                                   status stays SCHEDULED,
                                   reschedule_count = reschedule_count + 1
      then, when w.project_id is not null:
        project.target_completion_date = max(date(x.window_end)) over DowntimeWindow x with
                                         x.project_id == w.project_id and
                                         x.status IN {SCHEDULED, COMPLETED, RESCHEDULE_REQUIRED}
        if project.target_completion_date > contract.term_end_date and
           project.status IN {APPROVED, IN_PROGRESS}: project.status = AT_RISK
    input_set: "Only the single DowntimeWindow named by order.window_id; sibling windows on the same car with status IN {SCHEDULED, COMPLETED} are consulted for the collision test. ElevatorCar.scheduled_downtime_minutes is unchanged by a shift because duration_minutes is preserved."
    constants: {}
    precision: "whole days; window_start and window_end shift by the identical whole-day offset, preserving duration_minutes exactly"

  - name: contract_performance_score
    trigger: "POST /elevator-program/renegotiations — evaluated before the eligibility check and stored on ServiceContract.performance_score and RenegotiationRound.trigger_performance_score"
    algorithm: weighted_scoring
    formula: |
      score_period_month = the most recent calendar month that is fully in the past relative to
                           the current logical clock (i.e. the month before the clock's month)
      uptime_pct   = 100.00 if the contract has no non-DECOMMISSIONED cars, otherwise the same
                     contract-level uptime as penalty_assessment_amount step 1
      total_cb     = count(Callback c : c.car_id IN car_set, c.status == CLEARED,
                           c.reported_at in score_period_month)
      compliant_cb = count of those with c.sla_breached == false
      response_pct = 100.00 if total_cb == 0 else round_half_up(100 * compliant_cb / total_cb, 2)
      total_v      = count(MaintenanceVisit v : v.car_id IN car_set,
                           v.period_month == score_period_month,
                           v.status IN {VERIFIED, DISPUTED, REJECTED, MISSED, PERFORMED})
      verified_v   = count of those with v.status == VERIFIED
      visit_pct    = 100.00 if total_v == 0 else round_half_up(100 * verified_v / total_v, 2)
      drag_pts     = min(PENALTY_DRAG_CAP_PTS,
                         round_half_up(contract.penalty_balance_cents / DRAG_DIVISOR_CENTS, 2))
      raw          = W_UPTIME * uptime_pct + W_RESPONSE * response_pct + W_VISIT * visit_pct
                     - drag_pts
      performance_score = min(100.00, max(0.00, round_half_up(raw, 2)))
    input_set: "Exactly one month of history (score_period_month), restricted to the contract's non-DECOMMISSIONED cars. CANCELLED callbacks, SCHEDULED visits and CANCELLED inspections are excluded from both numerators and denominators."
    constants:
      W_UPTIME: 0.50
      W_RESPONSE: 0.25
      W_VISIT: 0.25
      DRAG_DIVISOR_CENTS: 100000
      PENALTY_DRAG_CAP_PTS: 15.00
      RENEGOTIATION_TRIGGER_SCORE: 75.00
    precision: "2 decimal places, round_half_up, applied once to raw after the weighted sum"

  - name: visit_task_compliance
    trigger: "POST /elevator-program/visits/{visitId}/perform (recompute) and POST /elevator-program/visits/{visitId}/verify (gate)"
    algorithm: aggregation
    formula: |
      required = FULL_MAINTENANCE_REQUIRED_TASK_CODES if contract.scope_type == FULL_MAINTENANCE
                 else OIL_AND_GREASE_REQUIRED_TASK_CODES
      completed_task_codes = sorted ASC set of t.task_code for t in task_items where t.completed == true
      missing_task_codes   = sorted ASC list of codes in `required` that are absent from completed_task_codes
      verify is permitted only when missing_task_codes is empty
    input_set: "Only the task_items array submitted on the most recent perform call; an earlier perform's array is discarded, not merged."
    constants:
      FULL_MAINTENANCE_REQUIRED_TASK_CODES: ["BRAKE", "CONTROLLER", "DOOR_OPERATOR", "FIRE_SERVICE_TEST", "GOVERNOR", "PIT_CLEAN", "ROPES"]
      OIL_AND_GREASE_REQUIRED_TASK_CODES: ["LUBRICATION", "PIT_CLEAN", "VISUAL_INSPECTION"]
      MAX_REWORK_COUNT: 2
    precision: "exact set comparison; task codes are compared case-sensitively"

  - name: downtime_overlap_rule
    trigger: "POST /elevator-program/downtime-windows and the downtime_window_shift cascade"
    algorithm: interval_merge
    formula: |
      # ---- RULE 1: per-car occupation, HALF-OPEN minute precision, type-dependent buffer ----
      candidate = [window_start, window_end)
      for each existing DowntimeWindow x on the same car with x.status IN {SCHEDULED, COMPLETED}:
        existing = [x.window_start, x.window_end)
        if candidate and existing intersect (strict half-open intersection, so
           candidate.start == existing.end or candidate.end == existing.start is NOT a collision):
             reject ERR_DOWNTIME_WINDOW_CONFLICT
        if x.window_type != candidate.window_type and
           gap_minutes(candidate, existing) < INTER_TYPE_BUFFER_MINUTES:
             reject ERR_DOWNTIME_WINDOW_CONFLICT
        # same-type windows may abut with a zero-minute gap; different-type windows may not
        # come within INTER_TYPE_BUFFER_MINUTES of each other

      # ---- RULE 2: contract-wide modernization capacity, CLOSED DATE precision ----
      if candidate.window_type == MODERNIZATION:
        cand_dates = every calendar date d with
                     date(window_start) <= d <= date(window_end - 1 minute)     # CLOSED on both ends
        for each other ElevatorCar y on the same contract with y.id != candidate.car_id:
          for each DowntimeWindow z on y with z.window_type == MODERNIZATION and
              z.status IN {SCHEDULED, COMPLETED}:
            z_dates = date(z.window_start) .. date(z.window_end - 1 minute)     # CLOSED on both ends
            if cand_dates and z_dates share any calendar date:
               concurrent_cars = 2 > MAX_CONCURRENT_MODERNIZATION_CARS
               reject ERR_CONTRACT_MODERNIZATION_CAPACITY
    input_set: "DowntimeWindow rows with status IN {SCHEDULED, COMPLETED} only; CANCELLED and RESCHEDULE_REQUIRED windows never occupy a resource."
    constants:
      INTER_TYPE_BUFFER_MINUTES: 120
      MAX_CONCURRENT_MODERNIZATION_CARS: 1
    precision: "Rule 1 compares instants at whole-minute precision on half-open intervals; Rule 2 compares calendar dates on closed inclusive ranges — the two rules deliberately disagree about what 'overlap' means."

  - name: certificate_issuance
    trigger: "POST /elevator-program/inspections/{inspectionId}/record-result with result IN {PASS, PASS_WITH_DEFICIENCIES}"
    algorithm: projection
    formula: |
      certificate_issued_date = date(result_recorded_at)
      certificate_expiry_date = certificate_issued_date + CERTIFICATE_VALIDITY_DAYS days
      certificate_number      = "CERT-" + contract.jurisdiction_code + "-" + car.car_code + "-"
                                + certificate_issued_date rendered as YYYYMMDD
    input_set: "The single inspection being recorded; no other inspection contributes."
    constants:
      CERTIFICATE_VALIDITY_DAYS: 365
    precision: "whole days; expiry is inclusive — the certificate is valid through certificate_expiry_date and expires once the clock passes it"

  - name: contract_escalation_counter
    trigger: "every ElevatorCar availability_state transition into or out of OUT_OF_SERVICE, and POST /elevator-program/cars/{carId}/decommission"
    algorithm: aggregation
    formula: |
      cars_out_of_service_count = count(ElevatorCar c : c.contract_id == contract.id
                                        and c.availability_state == OUT_OF_SERVICE)
      if contract.status == ACTIVE and cars_out_of_service_count >= OUT_OF_SERVICE_ESCALATION_COUNT:
        contract.status = SERVICE_ALERT
      if contract.status == SERVICE_ALERT and cars_out_of_service_count < OUT_OF_SERVICE_ESCALATION_COUNT:
        contract.status = ACTIVE
    input_set: "Only cars with availability_state == OUT_OF_SERVICE; DECOMMISSIONED and UNDER_MODERNIZATION cars are not counted."
    constants:
      OUT_OF_SERVICE_ESCALATION_COUNT: 2
    precision: "integer count; the threshold uses >= so exactly 2 cars escalates"

# =============================================================================
# §1.4 Validation Rules Table (evaluated strictly in ascending `priority` order;
#      the FIRST rule that fails determines the returned error_id and status)
# =============================================================================
validations:

  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the five roles declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 20
    category: auth
    check: "the presented X-User-Role appears in the endpoint's `roles:` list in §1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 30
    category: existence
    check: "every resource referenced by the path and then by the request body exists, validated left-to-right: path id first, then body FK fields in the order contract_id, car_id, part_id, window_id, project_id"
    error_id: "ERR_CONTRACT_NOT_FOUND | ERR_CAR_NOT_FOUND | ERR_PART_NOT_FOUND | ERR_RESOURCE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id or an FK body field"

  - priority: 40
    category: auth
    check: "for X-User-Role == BuildingManager, X-User-ID == the resolved ServiceContract.building_manager_user_id; for X-User-Role == ServiceContractor, X-User-ID == the resolved ServiceContract.contractor_user_id. The contract is resolved from the target resource by following contract_id, or car_id -> ElevatorCar.contract_id."
    error_id: ERR_NOT_CONTRACT_PARTY
    http_status: 403
    applies_to: "every POST endpoint whose target resolves to a ServiceContract (contracts, cars, visits, callbacks, inspections, projects, downtime-windows, part-orders, penalties, renegotiations)"

  - priority: 50
    category: business_constraint
    check: "request body schema: every required input field in §1.5 is present, enum fields carry a declared member, datetimes parse as ISO 8601 UTC, dates parse as YYYY-MM-DD, period_month matches ^\\d{4}-(0[1-9]|1[0-2])$, window_end > window_start, term_end_date > term_start_date, scheduled_date falls inside period_month, and passengers_trapped >= 1 when callback_type == ENTRAPMENT"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all POST endpoints"

  - priority: 55
    category: business_constraint
    check: "PartOrder.quantity >= 1 (a zero or negative quantity is rejected before any pricing or supersession work happens)"
    error_id: ERR_INVALID_QUANTITY
    http_status: 422
    applies_to: "POST /elevator-program/part-orders"

  - priority: 60
    category: state
    check: "the supplied expected_<parent>_version equals the current version of the OCC parent named in §1.2.1 (ServiceContract for penalties, ElevatorCar for part-orders)"
    error_id: "ERR_STALE_CONTRACT_VERSION | ERR_STALE_CAR_VERSION"
    http_status: 412
    applies_to: "POST /elevator-program/penalties, POST /elevator-program/part-orders"

  - priority: 70
    category: state
    check: "the target resource is in a `from:` state that §1.2 declares for the requested transition"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "every state-changing POST endpoint"

  - priority: 72
    category: state
    check: "the governing ServiceContract.status IS IN {ACTIVE, SERVICE_ALERT} for operational writes, and == ACTIVE for POST /renegotiations, and == UNDER_RENEGOTIATION for counter/accept/close"
    error_id: ERR_CONTRACT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /visits, /visits/{id}/perform, /visits/{id}/verify, /callbacks, /inspections, /projects, /projects/{id}/approve, /downtime-windows, /part-orders, /penalties, /renegotiations, /renegotiations/{id}/counter, /renegotiations/{id}/accept, /renegotiations/{id}/close"

  - priority: 75
    category: auth
    check: "segregation of duties: X-User-ID != MaintenanceVisit.performed_by_user_id on verify; X-User-ID != PenaltyAssessment.assessed_by_user_id on resolve; X-User-ID != RenegotiationRound.opened_by_user_id on counter and accept"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /visits/{visitId}/verify, POST /penalties/{penaltyId}/resolve, POST /renegotiations/{roundId}/counter, POST /renegotiations/{roundId}/accept"

  - priority: 80
    category: business_safety
    check: "the target ElevatorCar.availability_state != DECOMMISSIONED"
    error_id: ERR_CAR_DECOMMISSIONED
    http_status: 409
    applies_to: "POST /visits, /visits/{id}/perform, /callbacks, /inspections, /downtime-windows, /part-orders"

  - priority: 82
    category: business_safety
    check: "the target ElevatorCar.compliance_state != RED_TAGGED — a red-tagged car may not have new downtime scheduled or new maintenance visits opened until a REINSPECTION lifts the tag"
    error_id: ERR_CAR_RED_TAGGED
    http_status: 409
    applies_to: "POST /elevator-program/downtime-windows, POST /elevator-program/visits"

  - priority: 84
    category: business_safety
    check: "posting a certificate requires the inspection's certificate_state == ISSUED"
    error_id: ERR_CERTIFICATE_NOT_ISSUED
    http_status: 409
    applies_to: "POST /elevator-program/inspections/{inspectionId}/post-certificate"

  - priority: 86
    category: business_safety
    check: "posting a certificate requires the current logical-clock date <= certificate_expiry_date"
    error_id: ERR_CERTIFICATE_EXPIRED
    http_status: 409
    applies_to: "POST /elevator-program/inspections/{inspectionId}/post-certificate"

  - priority: 88
    category: business_safety
    check: "an ENTRAPMENT callback may not be marked ON_SITE until the fire department has been dispatched (status must be ESCALATED)"
    error_id: ERR_ENTRAPMENT_REQUIRES_FIRE_DISPATCH
    http_status: 422
    applies_to: "POST /elevator-program/callbacks/{callbackId}/arrive"

  - priority: 89
    category: business_safety
    check: "fire dispatch may only be recorded on a callback with callback_type == ENTRAPMENT or passengers_trapped >= 1"
    error_id: ERR_FIRE_DISPATCH_NOT_REQUIRED
    http_status: 422
    applies_to: "POST /elevator-program/callbacks/{callbackId}/fire-dispatch"

  - priority: 90
    category: business_constraint
    check: "an OIL_AND_GREASE contract covers lubrication only: a PartOrder whose effective part has part_class != LUBRICATION is outside contract scope"
    error_id: ERR_SCOPE_EXCLUDES_REPAIR
    http_status: 422
    applies_to: "POST /elevator-program/part-orders"

  - priority: 92
    category: business_referential
    check: "the requested SparePart resolves to an effective part whose lifecycle_state != DISCONTINUED"
    error_id: ERR_PART_DISCONTINUED
    http_status: 422
    applies_to: "POST /elevator-program/part-orders"

  - priority: 94
    category: business_referential
    check: "the supersession walk from the requested part terminates within SUPERSESSION_MAX_DEPTH (3) hops"
    error_id: ERR_SUPERSESSION_CHAIN_TOO_DEEP
    http_status: 422
    applies_to: "POST /elevator-program/part-orders"

  - priority: 96
    category: business_referential
    check: "no other MaintenanceVisit exists with the same car_id and period_month in status other than REJECTED"
    error_id: ERR_VISIT_MONTH_DUPLICATE
    http_status: 409
    applies_to: "POST /elevator-program/visits"

  - priority: 100
    category: business_temporal
    check: "downtime_overlap_rule RULE 1 — the candidate half-open interval [window_start, window_end) neither intersects an existing SCHEDULED/COMPLETED window on the same car nor comes within INTER_TYPE_BUFFER_MINUTES (120) of an existing window of a different window_type"
    error_id: ERR_DOWNTIME_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /elevator-program/downtime-windows"

  - priority: 102
    category: business_temporal
    check: "the assessed period is closed: the current logical clock is at or past the first instant of the month following period_month"
    error_id: ERR_PENALTY_PERIOD_NOT_CLOSED
    http_status: 422
    applies_to: "POST /elevator-program/penalties"

  - priority: 110
    category: business_constraint
    check: "downtime_overlap_rule RULE 2 — the candidate MODERNIZATION window's closed calendar-date range shares no date with a MODERNIZATION window on another car of the same contract (MAX_CONCURRENT_MODERNIZATION_CARS == 1)"
    error_id: ERR_CONTRACT_MODERNIZATION_CAPACITY
    http_status: 409
    applies_to: "POST /elevator-program/downtime-windows"

  - priority: 112
    category: business_constraint
    check: "ServiceContract.renegotiation_round_count < MAX_RENEGOTIATION_ROUNDS (4) before a new round is appended"
    error_id: ERR_RENEGOTIATION_ROUND_LIMIT
    http_status: 422
    applies_to: "POST /elevator-program/renegotiations, POST /elevator-program/renegotiations/{roundId}/counter"

  - priority: 114
    category: business_constraint
    check: "MaintenanceVisit.rework_count < MAX_REWORK_COUNT (2) — a visit already reworked twice cannot be disputed again"
    error_id: ERR_REWORK_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /elevator-program/visits/{visitId}/dispute"

  - priority: 120
    category: business_fiscal
    check: "the contract has at least one ElevatorCar with availability_state != DECOMMISSIONED, so uptime, credit and penalty aggregates are defined"
    error_id: ERR_NO_CARS_IN_SCOPE
    http_status: 422
    applies_to: "POST /elevator-program/penalties"

  - priority: 122
    category: business_fiscal
    check: "contract_performance_score < RENEGOTIATION_TRIGGER_SCORE (75.00), strictly less than"
    error_id: ERR_RENEGOTIATION_NOT_WARRANTED
    http_status: 422
    applies_to: "POST /elevator-program/renegotiations"

  - priority: 124
    category: business_fiscal
    check: "MaintenanceVisit.missing_task_codes is empty — every task code required by the contract's scope_type was completed"
    error_id: ERR_TASK_LIST_INCOMPLETE
    http_status: 422
    applies_to: "POST /elevator-program/visits/{visitId}/verify"

# =============================================================================
# §1.5 API Endpoint Table   (all paths sit under api_prefix /elevator-program)
# =============================================================================
endpoints:

  # ---------------------------------------------------------------- contracts
  - method: POST
    path: "/elevator-program/contracts"
    description: "Create a service contract in DRAFT for one building."
    roles: [ProgramAdministrator]
    code: 201
    input: ["building_name", "building_address", "jurisdiction_code", "fire_district_code", "building_manager_user_id", "contractor_user_id", "scope_type", "penalty_schedule", "monthly_base_fee_cents", "callback_response_minutes", "entrapment_response_minutes", "term_start_date", "term_end_date"]
    output: ServiceContract
    side_effects: ["creates ServiceContract with status DRAFT, version 1, all penalty ledger fields 0"]

  - method: GET
    path: "/elevator-program/contracts/{contractId}"
    description: "Read one contract including its penalty ledger, escalation counter and last stored performance_score."
    roles: [ProgramAdministrator, BuildingManager, ServiceContractor, StateInspector, FireDispatcher]
    code: 200
    input: []
    output: ServiceContract
    side_effects: []

  - method: GET
    path: "/elevator-program/contracts"
    description: "List contracts with pagination."
    roles: [ProgramAdministrator]
    code: 200
    input: ["status?", "scope_type?", "limit?", "offset?"]
    output: ServiceContract[]
    side_effects: []

  - method: POST
    path: "/elevator-program/contracts/{contractId}/activate"
    description: "Move a DRAFT contract to ACTIVE."
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: ServiceContract
    side_effects: ["ServiceContract DRAFT -> ACTIVE", "increments ServiceContract.version by 1"]

  - method: POST
    path: "/elevator-program/contracts/{contractId}/terminate"
    description: "Terminate a contract and cancel its open renegotiation rounds and modernization projects."
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: ServiceContract
    side_effects: ["ServiceContract -> TERMINATED", "open RenegotiationRound rows -> WITHDRAWN", "non-terminal ModernizationProject rows -> CANCELLED, their SCHEDULED windows -> CANCELLED and each car's scheduled_downtime_minutes recomputed", "increments ServiceContract.version by 1"]

  # --------------------------------------------------------------------- cars
  - method: POST
    path: "/elevator-program/cars"
    description: "Register an elevator car under a contract. Both state dimensions start at IN_SERVICE / INSPECTION_DUE."
    roles: [ProgramAdministrator]
    code: 201
    input: ["contract_id", "car_code", "car_type", "capacity_lbs"]
    output: ElevatorCar
    side_effects: ["creates ElevatorCar with availability_state IN_SERVICE, compliance_state INSPECTION_DUE, version 1", "does NOT mutate the ServiceContract row"]

  - method: GET
    path: "/elevator-program/cars/{carId}"
    description: "Read one car including both state dimensions, scheduled_downtime_minutes and its current posted certificate."
    roles: [ProgramAdministrator, BuildingManager, ServiceContractor, StateInspector, FireDispatcher]
    code: 200
    input: []
    output: ElevatorCar
    side_effects: []

  - method: GET
    path: "/elevator-program/cars"
    description: "List cars, filterable by contract_id and by either state dimension. Reverse-reachability channel for ElevatorCar.contract_id."
    roles: [ProgramAdministrator, BuildingManager, ServiceContractor, StateInspector, FireDispatcher]
    code: 200
    input: ["contract_id?", "availability_state?", "compliance_state?", "limit?", "offset?"]
    output: ElevatorCar[]
    side_effects: []

  - method: GET
    path: "/elevator-program/cars/{carId}/uptime-report"
    description: "Uptime report for one car for one period_month, returning BOTH car_uptime_percentage variants side by side."
    roles: [ProgramAdministrator, BuildingManager, ServiceContractor, StateInspector, FireDispatcher]
    code: 200
    input: ["period_month"]
    output: { car_id: string, period_month: string, period_minutes: integer, unplanned_outage_minutes: integer, planned_downtime_minutes: integer, available_minutes: integer, uptime_pct_exclusive: number, uptime_pct_inclusive: number, outage_interval_count: integer }
    side_effects: []

  - method: POST
    path: "/elevator-program/cars/{carId}/decommission"
    description: "Permanently remove a car from the program and cancel its open child records."
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: ElevatorCar
    side_effects: ["availability_state -> DECOMMISSIONED", "open PartOrder rows -> CANCELLED", "SCHEDULED DowntimeWindow rows -> CANCELLED and scheduled_downtime_minutes recomputed", "SCHEDULED StateInspection rows -> CANCELLED", "open Callback rows -> CANCELLED", "recomputes ServiceContract.cars_out_of_service_count", "increments ElevatorCar.version by 1"]

  # ------------------------------------------------------------------- visits
  - method: POST
    path: "/elevator-program/visits"
    description: "Schedule the monthly maintenance visit for one car and one billing month."
    roles: [ProgramAdministrator, ServiceContractor]
    code: 201
    input: ["car_id", "period_month", "scheduled_date"]
    output: MaintenanceVisit
    side_effects: ["creates MaintenanceVisit in status SCHEDULED with rework_count 0"]

  - method: GET
    path: "/elevator-program/visits/{visitId}"
    description: "Read one maintenance visit including its task list and rework counter."
    roles: [ProgramAdministrator, BuildingManager, ServiceContractor, StateInspector, FireDispatcher]
    code: 200
    input: []
    output: MaintenanceVisit
    side_effects: []

  - method: GET
    path: "/elevator-program/visits"
    description: "List maintenance visits. Reverse-reachability channel for MaintenanceVisit.car_id."
    roles: [ProgramAdministrator, BuildingManager, ServiceContractor, StateInspector, FireDispatcher]
    code: 200
    input: ["car_id?", "status?", "period_month?", "limit?", "offset?"]
    output: MaintenanceVisit[]
    side_effects: []

  - method: POST
    path: "/elevator-program/visits/{visitId}/perform"
    description: "Contractor records the performed task list for a SCHEDULED or DISPUTED visit."
    roles: [ServiceContractor]
    code: 200
    input: ["task_items"]
    output: MaintenanceVisit
    side_effects: ["status SCHEDULED|DISPUTED -> PERFORMED", "recomputes completed_task_codes and missing_task_codes via visit_task_compliance", "stamps performed_at and performed_by_user_id"]

  - method: POST
    path: "/elevator-program/visits/{visitId}/verify"
    description: "Building manager verifies a performed visit; requires a complete task list and a different user than the performer."
    roles: [BuildingManager]
    code: 200
    input: []
    output: MaintenanceVisit
    side_effects: ["status PERFORMED -> VERIFIED", "stamps verified_at and verified_by_user_id"]

  - method: POST
    path: "/elevator-program/visits/{visitId}/dispute"
    description: "Building manager sends a performed visit back for rework."
    roles: [BuildingManager]
    code: 200
    input: ["dispute_reason"]
    output: MaintenanceVisit
    side_effects: ["status PERFORMED -> DISPUTED", "increments rework_count by 1"]

  # ---------------------------------------------------------------- callbacks
  - method: POST
    path: "/elevator-program/callbacks"
    description: "Report a callback (entrapment, malfunction or nuisance) against a car. reported_at is stamped from the logical clock."
    roles: [BuildingManager, ProgramAdministrator]
    code: 201
    input: ["car_id", "callback_type", "passengers_trapped?", "out_of_service?"]
    output: Callback
    side_effects: ["creates Callback in status REPORTED", "when out_of_service == true drives ElevatorCar availability IN_SERVICE -> OUT_OF_SERVICE, which may drive ServiceContract ACTIVE -> SERVICE_ALERT", "increments ElevatorCar.version by 1 when the car changes state"]

  - method: GET
    path: "/elevator-program/callbacks/{callbackId}"
    description: "Read one callback including response_minutes, sla_minutes and sla_breached."
    roles: [ProgramAdministrator, BuildingManager, ServiceContractor, StateInspector, FireDispatcher]
    code: 200
    input: []
    output: Callback
    side_effects: []

  - method: GET
    path: "/elevator-program/callbacks"
    description: "List callbacks. Reverse-reachability channel for Callback.car_id."
    roles: [ProgramAdministrator, BuildingManager, ServiceContractor, StateInspector, FireDispatcher]
    code: 200
    input: ["car_id?", "status?", "callback_type?", "limit?", "offset?"]
    output: Callback[]
    side_effects: []

  - method: POST
    path: "/elevator-program/callbacks/{callbackId}/fire-dispatch"
    description: "Fire dispatcher records the department dispatch for an entrapment. Takes the callback down the ESCALATED branch."
    roles: [FireDispatcher]
    code: 200
    input: ["incident_number"]
    output: Callback
    side_effects: ["status REPORTED -> ESCALATED", "stamps fire_dispatch_requested_at and fire_dispatch_incident_number"]

  - method: POST
    path: "/elevator-program/callbacks/{callbackId}/arrive"
    description: "Contractor records arrival on site; freezes response_minutes, sla_minutes and sla_breached."
    roles: [ServiceContractor]
    code: 200
    input: []
    output: Callback
    side_effects: ["status REPORTED|ESCALATED -> ON_SITE", "computes response_minutes = minutes(arrived_at - reported_at), sla_minutes and sla_breached"]

  - method: POST
    path: "/elevator-program/callbacks/{callbackId}/clear"
    description: "Contractor clears the callback; closes the unplanned outage interval used by car_uptime_percentage."
    roles: [ServiceContractor]
    code: 200
    input: ["resolution_note?"]
    output: Callback
    side_effects: ["status ON_SITE -> CLEARED", "stamps cleared_at", "returns ElevatorCar availability OUT_OF_SERVICE -> IN_SERVICE when no other open out-of-service callback remains and compliance_state != RED_TAGGED, which may drive ServiceContract SERVICE_ALERT -> ACTIVE", "increments ElevatorCar.version by 1 when the car changes state"]

  # -------------------------------------------------------------- inspections
  - method: POST
    path: "/elevator-program/inspections"
    description: "Schedule a state inspection for a car."
    roles: [ProgramAdministrator]
    code: 201
    input: ["car_id", "inspection_type", "scheduled_date"]
    output: StateInspection
    side_effects: ["creates StateInspection with status SCHEDULED and certificate_state NONE"]

  - method: GET
    path: "/elevator-program/inspections/{inspectionId}"
    description: "Read one inspection including both dimensions and its certificate fields."
    roles: [ProgramAdministrator, BuildingManager, ServiceContractor, StateInspector, FireDispatcher]
    code: 200
    input: []
    output: StateInspection
    side_effects: []

  - method: GET
    path: "/elevator-program/inspections"
    description: "List inspections. Reverse-reachability channel for StateInspection.car_id."
    roles: [ProgramAdministrator, BuildingManager, ServiceContractor, StateInspector, FireDispatcher]
    code: 200
    input: ["car_id?", "status?", "certificate_state?", "limit?", "offset?"]
    output: StateInspection[]
    side_effects: []

  - method: POST
    path: "/elevator-program/inspections/{inspectionId}/record-result"
    description: "State inspector records PASS, PASS_WITH_DEFICIENCIES or FAIL. PASS mints a certificate; FAIL starts the four-hop red-tag cascade."
    roles: [StateInspector]
    code: 200
    input: ["result", "deficiency_codes?"]
    output: StateInspection
    side_effects: ["status SCHEDULED -> COMPLETED", "on PASS/PASS_WITH_DEFICIENCIES: certificate_state NONE -> ISSUED via certificate_issuance", "on FAIL: ElevatorCar.compliance_state -> RED_TAGGED, which forces availability IN_SERVICE -> OUT_OF_SERVICE, which increments ServiceContract.cars_out_of_service_count and may drive ACTIVE -> SERVICE_ALERT", "on REINSPECTION PASS: red tag lifted, availability returned to IN_SERVICE", "increments ElevatorCar.version by 1"]

  - method: POST
    path: "/elevator-program/inspections/{inspectionId}/post-certificate"
    description: "Building manager posts the issued certificate in the car, moving the compliance dimension to CERTIFIED."
    roles: [BuildingManager]
    code: 200
    input: []
    output: StateInspection
    side_effects: ["certificate_state ISSUED -> POSTED", "any previously POSTED certificate on the same car -> SUPERSEDED", "ElevatorCar.compliance_state -> CERTIFIED and current_certificate_number / certificate_expiry_date recomputed", "increments ElevatorCar.version by 1"]

  # ----------------------------------------------------------------- projects
  - method: POST
    path: "/elevator-program/projects"
    description: "Plan a modernization project against a contract."
    roles: [ProgramAdministrator]
    code: 201
    input: ["contract_id", "title", "budget_cents", "target_completion_date"]
    output: ModernizationProject
    side_effects: ["creates ModernizationProject in status PLANNED with window_count 0"]

  - method: GET
    path: "/elevator-program/projects/{projectId}"
    description: "Read one modernization project."
    roles: [ProgramAdministrator, BuildingManager, ServiceContractor, StateInspector, FireDispatcher]
    code: 200
    input: []
    output: ModernizationProject
    side_effects: []

  - method: GET
    path: "/elevator-program/projects"
    description: "List modernization projects. Reverse-reachability channel for ModernizationProject.contract_id."
    roles: [ProgramAdministrator, BuildingManager, ServiceContractor, StateInspector, FireDispatcher]
    code: 200
    input: ["contract_id?", "status?", "limit?", "offset?"]
    output: ModernizationProject[]
    side_effects: []

  - method: POST
    path: "/elevator-program/projects/{projectId}/approve"
    description: "Building manager approves a planned modernization project."
    roles: [BuildingManager]
    code: 200
    input: []
    output: ModernizationProject
    side_effects: ["status PLANNED -> APPROVED", "stamps approved_by_user_id"]

  - method: POST
    path: "/elevator-program/projects/{projectId}/complete"
    description: "Close out a modernization project once no SCHEDULED window remains."
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: ModernizationProject
    side_effects: ["status APPROVED|IN_PROGRESS|AT_RISK -> COMPLETE", "freezes window_count"]

  # --------------------------------------------------------- downtime windows
  - method: POST
    path: "/elevator-program/downtime-windows"
    description: "Reserve a downtime window on a car. Enforces both interval semantics of downtime_overlap_rule."
    roles: [ProgramAdministrator, ServiceContractor]
    code: 201
    input: ["car_id", "window_type", "window_start", "window_end", "project_id?"]
    output: DowntimeWindow
    side_effects: ["creates DowntimeWindow in status SCHEDULED", "adds duration_minutes to ElevatorCar.scheduled_downtime_minutes", "increments ModernizationProject.window_count when project_id is supplied", "increments ElevatorCar.version by 1"]

  - method: GET
    path: "/elevator-program/downtime-windows/{windowId}"
    description: "Read one downtime window including reschedule_count."
    roles: [ProgramAdministrator, BuildingManager, ServiceContractor, StateInspector, FireDispatcher]
    code: 200
    input: []
    output: DowntimeWindow
    side_effects: []

  - method: GET
    path: "/elevator-program/downtime-windows"
    description: "List downtime windows. Reverse-reachability channel for DowntimeWindow.car_id and DowntimeWindow.project_id."
    roles: [ProgramAdministrator, BuildingManager, ServiceContractor, StateInspector, FireDispatcher]
    code: 200
    input: ["car_id?", "project_id?", "status?", "window_type?", "limit?", "offset?"]
    output: DowntimeWindow[]
    side_effects: []

  - method: POST
    path: "/elevator-program/downtime-windows/{windowId}/cancel"
    description: "Cancel a future downtime window and give back the reserved minutes exactly."
    roles: [ProgramAdministrator, ServiceContractor]
    code: 200
    input: []
    output: DowntimeWindow
    side_effects: ["status SCHEDULED|RESCHEDULE_REQUIRED -> CANCELLED", "subtracts duration_minutes from ElevatorCar.scheduled_downtime_minutes", "decrements ModernizationProject.window_count when project_id is set", "increments ElevatorCar.version by 1"]

  # -------------------------------------------------------------------- parts
  - method: POST
    path: "/elevator-program/parts"
    description: "Add a spare part to the catalog in lifecycle_state ACTIVE."
    roles: [ProgramAdministrator]
    code: 201
    input: ["part_number", "description_text", "part_class", "unit_price_cents", "lead_time_days"]
    output: SparePart
    side_effects: ["creates SparePart with lifecycle_state ACTIVE and superseded_by_part_id null"]

  - method: GET
    path: "/elevator-program/parts/{partId}"
    description: "Read one catalog part including its successor pointer."
    roles: [ProgramAdministrator, BuildingManager, ServiceContractor, StateInspector, FireDispatcher]
    code: 200
    input: []
    output: SparePart
    side_effects: []

  - method: GET
    path: "/elevator-program/parts"
    description: "List catalog parts. Reverse-reachability channel for the self-referential SparePart.superseded_by_part_id."
    roles: [ProgramAdministrator, BuildingManager, ServiceContractor, StateInspector, FireDispatcher]
    code: 200
    input: ["superseded_by_part_id?", "lifecycle_state?", "part_class?", "limit?", "offset?"]
    output: SparePart[]
    side_effects: []

  - method: POST
    path: "/elevator-program/parts/{partId}/obsolete"
    description: "Mark a part OBSOLETE with a successor, or DISCONTINUED when replacement_part_id is omitted."
    roles: [ProgramAdministrator]
    code: 200
    input: ["replacement_part_id?"]
    output: SparePart
    side_effects: ["lifecycle_state ACTIVE -> OBSOLETE with superseded_by_part_id set, or ACTIVE|OBSOLETE -> DISCONTINUED with superseded_by_part_id cleared", "stamps obsoleted_at"]

  - method: POST
    path: "/elevator-program/part-orders"
    description: "Order a spare part for a car. Resolves the supersession chain, prices it under the pinned evaluation order, and may shift the linked downtime window."
    roles: [ServiceContractor]
    code: 201
    input: ["car_id", "part_id", "quantity", "expected_car_version", "expedite?", "window_id?"]
    output: PartOrder
    side_effects: ["creates PartOrder in status ORDERED (ACTIVE part) or SUBSTITUTED (OBSOLETE part)", "computes subtotal_cents, expedite_surcharge_cents, total_cost_cents, lead_time_days_applied, promised_date and substitution_hops via part_order_cost_and_promise", "when window_id is set, runs downtime_window_shift which may move the window or set it RESCHEDULE_REQUIRED, then recomputes ModernizationProject.target_completion_date and may set the project AT_RISK", "increments ElevatorCar.open_part_order_count by 1", "increments ElevatorCar.version by 1"]

  - method: GET
    path: "/elevator-program/part-orders/{orderId}"
    description: "Read one part order including its resolved effective part and promised date."
    roles: [ProgramAdministrator, BuildingManager, ServiceContractor, StateInspector, FireDispatcher]
    code: 200
    input: []
    output: PartOrder
    side_effects: []

  - method: GET
    path: "/elevator-program/part-orders"
    description: "List part orders. Reverse-reachability channel for PartOrder.car_id, PartOrder.part_id, PartOrder.effective_part_id and PartOrder.window_id."
    roles: [ProgramAdministrator, BuildingManager, ServiceContractor, StateInspector, FireDispatcher]
    code: 200
    input: ["car_id?", "part_id?", "effective_part_id?", "window_id?", "status?", "limit?", "offset?"]
    output: PartOrder[]
    side_effects: []

  - method: POST
    path: "/elevator-program/part-orders/{orderId}/receive"
    description: "Record receipt of an ordered or substituted part."
    roles: [ServiceContractor]
    code: 200
    input: []
    output: PartOrder
    side_effects: ["status ORDERED|SUBSTITUTED -> RECEIVED", "decrements ElevatorCar.open_part_order_count by 1", "increments ElevatorCar.version by 1"]

  # ---------------------------------------------------------------- penalties
  - method: POST
    path: "/elevator-program/penalties"
    description: "Assess the performance penalty and service credit for a closed billing month. A new assessment supersedes any ISSUED assessment for the same contract and period."
    roles: [ProgramAdministrator]
    code: 201
    input: ["contract_id", "period_month", "expected_contract_version"]
    output: PenaltyAssessment
    side_effects: ["creates PenaltyAssessment in status ISSUED", "computes amount_cents via penalty_assessment_amount and service_credit_cents via contract_monthly_credit_cents", "supersedes any prior ISSUED assessment for the same contract_id and period_month, backing its amount out of the ledger", "adds amount_cents to ServiceContract.penalty_lifetime_assessed_cents and recomputes penalty_balance_cents", "increments ServiceContract.version by 1"]

  - method: GET
    path: "/elevator-program/penalties/{penaltyId}"
    description: "Read one penalty assessment including every computed component."
    roles: [ProgramAdministrator, BuildingManager, ServiceContractor, StateInspector, FireDispatcher]
    code: 200
    input: []
    output: PenaltyAssessment
    side_effects: []

  - method: GET
    path: "/elevator-program/penalties"
    description: "List penalty assessments. Reverse-reachability channel for PenaltyAssessment.contract_id."
    roles: [ProgramAdministrator, BuildingManager, ServiceContractor, StateInspector, FireDispatcher]
    code: 200
    input: ["contract_id?", "status?", "period_month?", "limit?", "offset?"]
    output: PenaltyAssessment[]
    side_effects: []

  - method: POST
    path: "/elevator-program/penalties/{penaltyId}/dispute"
    description: "Building manager disputes an issued penalty. The ledger balance is untouched."
    roles: [BuildingManager]
    code: 200
    input: ["dispute_reason"]
    output: PenaltyAssessment
    side_effects: ["status ISSUED -> DISPUTED", "stores dispute_reason", "leaves ServiceContract.penalty_balance_cents unchanged"]

  - method: POST
    path: "/elevator-program/penalties/{penaltyId}/resolve"
    description: "A different program administrator resolves the dispute as UPHELD, WAIVED or CREDITED."
    roles: [ProgramAdministrator]
    code: 200
    input: ["resolution", "resolution_note?"]
    output: PenaltyAssessment
    side_effects: ["status DISPUTED -> UPHELD|WAIVED|CREDITED", "on WAIVED adds amount_cents to penalty_lifetime_waived_cents; on CREDITED adds it to penalty_lifetime_credited_cents; recomputes penalty_balance_cents = assessed - waived - credited", "stamps resolved_by_user_id", "increments ServiceContract.version by 1"]

  # ----------------------------------------------------------- renegotiations
  - method: POST
    path: "/elevator-program/renegotiations"
    description: "Building manager opens a renegotiation. Evaluates contract_performance_score and refuses unless it is strictly below RENEGOTIATION_TRIGGER_SCORE."
    roles: [BuildingManager]
    code: 201
    input: ["contract_id", "proposed_monthly_fee_cents", "proposed_callback_response_minutes", "proposed_scope_type"]
    output: RenegotiationRound
    side_effects: ["evaluates and stores ServiceContract.performance_score", "creates RenegotiationRound round_number 1 in status OPEN", "ServiceContract ACTIVE -> UNDER_RENEGOTIATION", "increments renegotiation_round_count", "increments ServiceContract.version by 1"]

  - method: GET
    path: "/elevator-program/renegotiations/{roundId}"
    description: "Read one renegotiation round."
    roles: [ProgramAdministrator, BuildingManager, ServiceContractor, StateInspector, FireDispatcher]
    code: 200
    input: []
    output: RenegotiationRound
    side_effects: []

  - method: GET
    path: "/elevator-program/renegotiations"
    description: "List renegotiation rounds. Reverse-reachability channel for RenegotiationRound.contract_id."
    roles: [ProgramAdministrator, BuildingManager, ServiceContractor, StateInspector, FireDispatcher]
    code: 200
    input: ["contract_id?", "status?", "limit?", "offset?"]
    output: RenegotiationRound[]
    side_effects: []

  - method: POST
    path: "/elevator-program/renegotiations/{roundId}/counter"
    description: "The counterparty counters an open round: the round becomes COUNTERED and a fresh OPEN successor round is created (the negotiation cycle)."
    roles: [ServiceContractor, BuildingManager]
    code: 201
    input: ["proposed_monthly_fee_cents", "proposed_callback_response_minutes", "proposed_scope_type"]
    output: RenegotiationRound
    side_effects: ["countered round OPEN -> COUNTERED and countered_by_user_id stamped", "creates the successor RenegotiationRound in status OPEN with round_number incremented", "increments ServiceContract.renegotiation_round_count and version by 1"]

  - method: POST
    path: "/elevator-program/renegotiations/{roundId}/accept"
    description: "The counterparty accepts an open round; the contract's commercial terms are rewritten and the contract returns to ACTIVE."
    roles: [BuildingManager, ServiceContractor]
    code: 200
    input: []
    output: RenegotiationRound
    side_effects: ["round OPEN -> ACCEPTED", "rewrites ServiceContract.monthly_base_fee_cents, callback_response_minutes and scope_type", "sibling OPEN rounds -> WITHDRAWN", "ServiceContract UNDER_RENEGOTIATION -> ACTIVE", "increments ServiceContract.version by 1"]

  - method: POST
    path: "/elevator-program/renegotiations/{roundId}/close"
    description: "Close an open round without agreement, as REJECTED (by the counterparty) or WITHDRAWN (by the opener)."
    roles: [BuildingManager, ServiceContractor]
    code: 200
    input: ["outcome"]
    output: RenegotiationRound
    side_effects: ["round OPEN -> REJECTED|WITHDRAWN", "ServiceContract UNDER_RENEGOTIATION -> ACTIVE when no OPEN round remains", "increments ServiceContract.version by 1"]

  # --------------------------------------------------------- test-driving API
  - method: POST
    path: "/elevator-program/_clock/set_current_utc"
    description: "Set the server's logical clock, which is the ONLY time source for reported_at, arrived_at, cleared_at, result_recorded_at, promised_date, certificate expiry and period-closed checks. The startup default is exactly 2026-08-01T00:00:00Z; before the first call the clock reads that value and never falls back to real wall-clock time. Advancing the clock also runs the epoch sweep: SCHEDULED visits whose period_month has closed become MISSED, DISPUTED visits whose period_month has closed become REJECTED, POSTED certificates past certificate_expiry_date become EXPIRED (car CERTIFIED -> CERTIFICATE_EXPIRED), SCHEDULED downtime windows the clock has entered move their car to UNDER_MODERNIZATION and their project APPROVED -> IN_PROGRESS, and windows the clock has passed become COMPLETED."
    roles: [ProgramAdministrator]
    code: 200
    input: ["to_iso8601"]
    output: { current_utc: string, missed_visits_marked: integer, rejected_visits_marked: integer, certificates_expired: integer, windows_completed: integer, cars_under_modernization: integer }
    side_effects: ["advances the logical clock", "runs the epoch sweep described above", "increments the version of every entity the sweep mutates"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the five declared roles" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "the presented role is not listed in the endpoint's roles" }
  - { id: ERR_NOT_CONTRACT_PARTY, http: 403, condition: "a BuildingManager or ServiceContractor acts on a contract whose building_manager_user_id / contractor_user_id does not equal the presented X-User-ID" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "the acting X-User-ID is the same user that performed the visit, assessed the penalty, or opened the renegotiation round being acted on" }
  - { id: ERR_VALIDATION, http: 400, condition: "missing required body field, undeclared enum member, unparseable date/datetime, window_end <= window_start, scheduled_date outside period_month, or passengers_trapped == 0 on an ENTRAPMENT callback" }
  - { id: ERR_CONTRACT_NOT_FOUND, http: 404, condition: "the contract id in the path or in contract_id does not exist" }
  - { id: ERR_CAR_NOT_FOUND, http: 404, condition: "the car id in the path or in car_id does not exist" }
  - { id: ERR_PART_NOT_FOUND, http: 404, condition: "the part id in the path, in part_id, or in replacement_part_id does not exist" }
  - { id: ERR_RESOURCE_NOT_FOUND, http: 404, condition: "a visit, callback, inspection, project, downtime window, part order, penalty or renegotiation round id does not exist" }
  - { id: ERR_STALE_CONTRACT_VERSION, http: 412, condition: "expected_contract_version does not equal the ServiceContract's current version on POST /elevator-program/penalties" }
  - { id: ERR_STALE_CAR_VERSION, http: 412, condition: "expected_car_version does not equal the ElevatorCar's current version on POST /elevator-program/part-orders" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "the target resource is not in a from-state that §1.2 declares for the requested transition" }
  - { id: ERR_CONTRACT_NOT_ACTIVE, http: 409, condition: "the governing ServiceContract.status does not permit this operation (not in {ACTIVE, SERVICE_ALERT} for operational writes, not ACTIVE for opening a renegotiation, not UNDER_RENEGOTIATION for counter/accept/close)" }
  - { id: ERR_CAR_DECOMMISSIONED, http: 409, condition: "the target ElevatorCar.availability_state == DECOMMISSIONED" }
  - { id: ERR_CAR_RED_TAGGED, http: 409, condition: "the target ElevatorCar.compliance_state == RED_TAGGED and the request would schedule downtime or open a new maintenance visit" }
  - { id: ERR_CERTIFICATE_NOT_ISSUED, http: 409, condition: "post-certificate called while the inspection's certificate_state != ISSUED" }
  - { id: ERR_CERTIFICATE_EXPIRED, http: 409, condition: "post-certificate called when the logical-clock date is past certificate_expiry_date" }
  - { id: ERR_VISIT_MONTH_DUPLICATE, http: 409, condition: "another MaintenanceVisit already exists for the same car_id and period_month in a status other than REJECTED" }
  - { id: ERR_DOWNTIME_WINDOW_CONFLICT, http: 409, condition: "downtime_overlap_rule RULE 1: the candidate half-open interval intersects an existing SCHEDULED/COMPLETED window on the same car, or sits within INTER_TYPE_BUFFER_MINUTES of one of a different window_type" }
  - { id: ERR_CONTRACT_MODERNIZATION_CAPACITY, http: 409, condition: "downtime_overlap_rule RULE 2: the candidate MODERNIZATION window's closed calendar-date range shares a date with a MODERNIZATION window on another car of the same contract" }
  - { id: ERR_TASK_LIST_INCOMPLETE, http: 422, condition: "verify called while missing_task_codes is non-empty for the contract's scope_type" }
  - { id: ERR_REWORK_LIMIT_EXCEEDED, http: 422, condition: "dispute called on a visit whose rework_count is already MAX_REWORK_COUNT (2)" }
  - { id: ERR_ENTRAPMENT_REQUIRES_FIRE_DISPATCH, http: 422, condition: "arrive called on an ENTRAPMENT callback still in status REPORTED — fire dispatch must be recorded first" }
  - { id: ERR_FIRE_DISPATCH_NOT_REQUIRED, http: 422, condition: "fire-dispatch called on a callback that is neither ENTRAPMENT nor has passengers_trapped >= 1" }
  - { id: ERR_SCOPE_EXCLUDES_REPAIR, http: 422, condition: "an OIL_AND_GREASE contract orders a part whose effective part_class != LUBRICATION" }
  - { id: ERR_PART_DISCONTINUED, http: 422, condition: "the requested part resolves to an effective part with lifecycle_state == DISCONTINUED" }
  - { id: ERR_SUPERSESSION_CHAIN_TOO_DEEP, http: 422, condition: "the superseded_by_part_id walk exceeds SUPERSESSION_MAX_DEPTH (3) hops" }
  - { id: ERR_INVALID_QUANTITY, http: 422, condition: "PartOrder.quantity < 1" }
  - { id: ERR_NO_CARS_IN_SCOPE, http: 422, condition: "a penalty is assessed on a contract with no ElevatorCar whose availability_state != DECOMMISSIONED" }
  - { id: ERR_PENALTY_PERIOD_NOT_CLOSED, http: 422, condition: "the logical clock has not reached the first instant of the month following period_month" }
  - { id: ERR_RENEGOTIATION_NOT_WARRANTED, http: 422, condition: "contract_performance_score >= RENEGOTIATION_TRIGGER_SCORE (75.00) when a renegotiation is opened" }
  - { id: ERR_RENEGOTIATION_ROUND_LIMIT, http: 422, condition: "ServiceContract.renegotiation_round_count has already reached MAX_RENEGOTIATION_ROUNDS (4)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdministrator
    description: "Building-owner-side program administrator: owns contracts, cars, catalog parts, inspections scheduling, penalties and the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /elevator-program/contracts"
      - "POST /elevator-program/contracts/{contractId}/activate"
      - "POST /elevator-program/contracts/{contractId}/terminate"
      - "POST /elevator-program/cars"
      - "POST /elevator-program/cars/{carId}/decommission"
      - "POST /elevator-program/inspections"
      - "POST /elevator-program/projects"
      - "POST /elevator-program/projects/{projectId}/complete"
      - "POST /elevator-program/parts"
      - "POST /elevator-program/parts/{partId}/obsolete"
      - "POST /elevator-program/penalties"
      - "POST /elevator-program/penalties/{penaltyId}/resolve"
      - "POST /elevator-program/_clock/set_current_utc"
      - "GET /elevator-program/contracts"
    shared_operations:
      - "POST /elevator-program/visits (with ServiceContractor)"
      - "POST /elevator-program/callbacks (with BuildingManager)"
      - "POST /elevator-program/downtime-windows (with ServiceContractor)"
      - "POST /elevator-program/downtime-windows/{windowId}/cancel (with ServiceContractor)"
      - "every GET read endpoint"

  - name: BuildingManager
    description: "Owner's representative for one building; X-User-ID must equal the contract's building_manager_user_id. Verifies work, posts certificates, approves modernization, disputes penalties and opens renegotiations."
    identity: opaque
    exclusive_operations:
      - "POST /elevator-program/visits/{visitId}/verify"
      - "POST /elevator-program/visits/{visitId}/dispute"
      - "POST /elevator-program/inspections/{inspectionId}/post-certificate"
      - "POST /elevator-program/projects/{projectId}/approve"
      - "POST /elevator-program/penalties/{penaltyId}/dispute"
      - "POST /elevator-program/renegotiations"
    shared_operations:
      - "POST /elevator-program/callbacks (with ProgramAdministrator)"
      - "POST /elevator-program/renegotiations/{roundId}/counter (with ServiceContractor)"
      - "POST /elevator-program/renegotiations/{roundId}/accept (with ServiceContractor)"
      - "POST /elevator-program/renegotiations/{roundId}/close (with ServiceContractor)"
      - "every GET read endpoint except GET /elevator-program/contracts"

  - name: ServiceContractor
    description: "Elevator maintenance contractor for one contract; X-User-ID must equal the contract's contractor_user_id. Performs visits, responds to callbacks, orders parts and books downtime."
    identity: opaque
    exclusive_operations:
      - "POST /elevator-program/visits/{visitId}/perform"
      - "POST /elevator-program/callbacks/{callbackId}/arrive"
      - "POST /elevator-program/callbacks/{callbackId}/clear"
      - "POST /elevator-program/part-orders"
      - "POST /elevator-program/part-orders/{orderId}/receive"
    shared_operations:
      - "POST /elevator-program/visits (with ProgramAdministrator)"
      - "POST /elevator-program/downtime-windows (with ProgramAdministrator)"
      - "POST /elevator-program/downtime-windows/{windowId}/cancel (with ProgramAdministrator)"
      - "POST /elevator-program/renegotiations/{roundId}/counter (with BuildingManager)"
      - "POST /elevator-program/renegotiations/{roundId}/accept (with BuildingManager)"
      - "POST /elevator-program/renegotiations/{roundId}/close (with BuildingManager)"
      - "every GET read endpoint except GET /elevator-program/contracts"

  - name: StateInspector
    description: "Jurisdictional elevator inspector. The only role that may record an inspection result; never a contract party, so no identity binding applies."
    identity: opaque
    exclusive_operations:
      - "POST /elevator-program/inspections/{inspectionId}/record-result"
    shared_operations:
      - "every GET read endpoint except GET /elevator-program/contracts"

  - name: FireDispatcher
    description: "Fire district dispatcher who records department coordination on entrapment callbacks."
    identity: opaque
    exclusive_operations:
      - "POST /elevator-program/callbacks/{callbackId}/fire-dispatch"
    shared_operations:
      - "every GET read endpoint except GET /elevator-program/contracts"
