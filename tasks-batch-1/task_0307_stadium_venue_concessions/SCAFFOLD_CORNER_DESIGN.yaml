              payload: {}
              as: StockRunner
          assert:
            - "response.data is an empty array (no entry for product ${p_id})"

      - name: pricing_off_peak_base_value
        claim_type: Correct Result
        grounds: [calculations.event_day_item_pricing, entities.MenuItem.fields.price_cents]
        distinguishing_aspect: "Off-peak HIGH-tier price with base 850, mult 120 is 1326 = round(850*1.20*1.30); the peak value 1428 is tested in §1.8, so this pins the no-bonus branch."
        test_recipe:
