            - "appeal on PAID: error_id == ERR_CLAIM_STATE"
            - "post-payment on PAID: error_id == ERR_CLAIM_STATE"

  # ==================================================================
  # Section: calculations
  # ==================================================================
  - section: calculations
    instances:
      - name: curtailment_payment_posts_entry_and_reduces_balance
        claim_type: correct_result
        grounds: [entities.FloorPlanEntry.fields.entry_type, calculations.aging_and_curtailment]
        distinguishing_aspect: "CURTAILMENT entries are produced only by POST /units/{id}/floor-plan-curtailments: at day 181 (due 1008500) a 500000-cent curtailment drops the balance by exactly 500000; over-paying the due (1008501) is rejected."
        test_recipe:
          setup:
            - "NEW unit received 2026-08-15 (invoice 10085000); clock advanced to 2027-02-12 (day 181) and swept once (interest posted: round_half_up(10085000*0.069/360*181) = 349865; balance 10434865)"
          setup_api_calls:
            - { call: "POST /dealership/factory-build-slots", payload: { build_month: "2026-08", vocation_group: "STANDARD", capacity: 5 }, as: SalesManager, captures: { slot_id: $.data.id } }
            - { call: "POST /dealership/factory-orders", payload: { factory_build_slot_id: "${slot_id}", chassis_model: "M2_106", engine_option: "DD13", axle_config: "A4X2" }, as: SalesConsultant, captures: { order_id: $.data.id } }
            - { call: "POST /dealership/factory-orders/${order_id}/commit", payload: {}, as: SalesConsultant }
            - { call: "POST /dealership/ops/run-daily-sweep", payload: {}, as: DealershipAdmin }
            - { call: "POST /dealership/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: DealershipAdmin }
            - { call: "POST /dealership/ops/run-daily-sweep", payload: {}, as: DealershipAdmin }
            - { call: "POST /dealership/factory-orders/${order_id}/receive", payload: { vin: "1FUJGBDV1CLW88338" }, as: SalesManager, captures: { unit_id: $.data.received_unit_id } }
            - { call: "POST /dealership/_clock/set_current_utc", payload: { to_iso8601: "2027-02-12T00:00:00Z" }, as: DealershipAdmin }
            - { call: "POST /dealership/ops/run-daily-sweep", payload: {}, as: DealershipAdmin }
          trigger:
            - { call: "POST /dealership/units/${unit_id}/floor-plan-curtailments", payload: { amount_cents: 1008501, note: "over" }, as: Controller, captures: { err: $.data.error_id } }
            - { call: "POST /dealership/units/${unit_id}/floor-plan-curtailments", payload: { amount_cents: 500000, note: "partial curtailment" }, as: Controller, captures: { bal: $.data.floorplan_balance_cents } }
            - { call: "GET /dealership/units/${unit_id}/floor-plan-entries", payload: {}, as: Controller }
          assert:
            - "1008501 > curtailment_due_cents 1008500 -> http 400 ERR_INVALID_REQUEST"
            - "500000 accepted: floorplan_balance_cents == 9934865 (10434865 - 500000)"
            - "last FloorPlanEntry is CURTAILMENT -500000 with resulting_balance_cents == 9934865"
      - name: curtailment_schedule_day_181_boundary
        claim_type: correct_result
        grounds: [calculations.aging_and_curtailment]
        distinguishing_aspect: "Curtailment schedule edge: day 180 -> 0; day 181 -> 10% of invoice (1008500); day 271 -> 25% (2521250). Exercised via sweep + GET unit."
        test_recipe:
