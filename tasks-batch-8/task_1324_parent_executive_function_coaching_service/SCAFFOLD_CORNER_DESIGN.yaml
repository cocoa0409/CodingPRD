# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Breadth walk over §1.1–§1.7 claims not already covered by §1.8.
# Clock default 2026-08-01T00:00:00Z unless a setup call moves it.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: family_creation_defaults_and_initial_state
        claim_type: creation
        grounds: [entities.Family]
        distinguishing_aspect: "A new Family starts in INTAKE with zeroed ledger counters, billing_status CURRENT, and version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /api/families", payload: { account_name: "Fam New", primary_email: "new@x.com" }, as: PracticeAdmin, captures: { fam_id: "$.data.id", fam_status: "$.data.status", fam_v: "$.data.version", fam_out: "$.data.outstanding_balance_cents", fam_bill: "$.data.billing_status" } }
          trigger: []
          assert:
            - "fam_status == INTAKE"
            - "fam_v == 1"
            - "fam_out == 0"
            - "fam_bill == CURRENT"
            - "fam_id is a server-minted UUID present in the response envelope"

      - name: family_get_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Family, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but nonexistent family id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/families/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: PracticeAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: client_create_missing_required_field_returns_400
        claim_type: required_fields
        grounds: [entities.Client.fields.track, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting required input field track on client creation yields ERR_VALIDATION (400)."
        test_recipe:
          setup: ["family exists"]
          setup_api_calls:
            - { call: "POST /api/families", payload: { account_name: "Fam RF", primary_email: "rf@x.com" }, as: PracticeAdmin, captures: { fam_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/families/${fam_id}/clients", payload: { full_name: "Kid RF", date_of_birth: "2014-01-01" }, as: PracticeAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_VALIDATION"

      - name: client_create_invalid_enum_track_returns_400
        claim_type: type_constraints
        grounds: [entities.Client.fields.track, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "track value outside {INDIVIDUAL, GROUP, HYBRID} yields ERR_VALIDATION."
        test_recipe:
          setup: ["family exists"]
          setup_api_calls:
            - { call: "POST /api/families", payload: { account_name: "Fam IE", primary_email: "ie@x.com" }, as: PracticeAdmin, captures: { fam_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/families/${fam_id}/clients", payload: { full_name: "Kid IE", date_of_birth: "2014-01-01", track: "DELUXE" }, as: PracticeAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_VALIDATION"

      - name: coach_caseload_cap_computed_from_credential
        claim_type: computed_fields
        grounds: [entities.Coach.fields.caseload_cap]
        distinguishing_aspect: "caseload_cap is computed from credential_level: ASSOCIATE 12, CERTIFIED 20, SUPERVISOR 28; the coach starts with active_caseload 0 and status AVAILABLE."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /api/coaches", payload: { full_name: "Coach A", credential_level: "ASSOCIATE" }, as: PracticeAdmin, captures: { cap_a: "$.data.caseload_cap", cl_a: "$.data.active_caseload", st_a: "$.data.status" } }
            - { call: "POST /api/coaches", payload: { full_name: "Coach S", credential_level: "SUPERVISOR" }, as: PracticeAdmin, captures: { cap_s: "$.data.caseload_cap" } }
          trigger: []
          assert:
            - "cap_a == 12"
            - "cap_s == 28"
            - "cl_a == 0"
            - "st_a == AVAILABLE"

      - name: package_expiry_computed_as_purchase_plus_180_days
        claim_type: computed_fields
        grounds: [entities.Package.fields.expires_at]
        distinguishing_aspect: "expires_at == purchased_at + 180 days; at the default clock 2026-08-01T00:00:00Z that is exactly 2027-01-28T00:00:00Z."
        test_recipe:
          setup: ["ACTIVE family with one client"]
          setup_api_calls:
            - { call: "POST /api/families", payload: { account_name: "Fam EX", primary_email: "ex@x.com" }, as: PracticeAdmin, captures: { fam_id: "$.data.id" } }
            - { call: "POST /api/families/${fam_id}/clients", payload: { full_name: "Kid EX", date_of_birth: "2014-01-01", track: "INDIVIDUAL" }, as: PracticeAdmin }
            - { call: "POST /api/families/${fam_id}/transition", payload: { to_state: "ACTIVE" }, as: PracticeAdmin }
          trigger:
            - { call: "POST /api/families/${fam_id}/packages", payload: { track: "INDIVIDUAL", credits_total: 2 }, as: PracticeAdmin, captures: { pk_purch: "$.data.purchased_at", pk_exp: "$.data.expires_at", pk_status: "$.data.status", pk_rem: "$.data.credits_remaining" } }
          assert:
            - "pk_purch == 2026-08-01T00:00:00Z (logical clock default)"
            - "pk_exp == 2027-01-28T00:00:00Z"
            - "pk_status == ACTIVE"
            - "pk_rem == 2"

      - name: progress_snapshot_null_indices_when_no_data
        claim_type: computed_fields
        grounds: [calculations.progress_index, entities.ProgressSnapshot]
        distinguishing_aspect: "With no terminal goals and no resolved check-ins, both index denominators are 0 and both variants are null (not 0)."
        test_recipe:
          setup: ["ACTIVE WEEKLY plan whose only goal is still SET (non-terminal)"]
          setup_api_calls:
            - { call: "POST /api/families", payload: { account_name: "Fam NI", primary_email: "ni@x.com" }, as: PracticeAdmin, captures: { fam_id: "$.data.id" } }
            - { call: "POST /api/families/${fam_id}/clients", payload: { full_name: "Kid NI", date_of_birth: "2014-02-01", track: "INDIVIDUAL" }, as: PracticeAdmin, captures: { cl_id: "$.data.id", cl_v: "$.data.version" } }
            - { call: "POST /api/families/${fam_id}/transition", payload: { to_state: "ACTIVE" }, as: PracticeAdmin }
            - { call: "POST /api/coaches", payload: { full_name: "Coach NI", credential_level: "CERTIFIED" }, as: PracticeAdmin, captures: { co_id: "$.data.id" } }
            - { call: "POST /api/clients/${cl_id}/intakes", payload: { presenting_concerns: "ni", baseline_score: 44 }, as: PracticeAdmin, captures: { in_id: "$.data.id" } }
            - { call: "POST /api/intakes/${in_id}/transition", payload: { to_state: "SUBMITTED" }, as: FamilyMember, as_user_id: "${fam_id}" }
            - { call: "POST /api/intakes/${in_id}/transition", payload: { to_state: "UNDER_REVIEW" }, as: Coach, as_user_id: "${co_id}" }
            - { call: "POST /api/intakes/${in_id}/transition", payload: { to_state: "APPROVED" }, as: Coach, as_user_id: "${co_id}" }
            - { call: "POST /api/clients/${cl_id}/plans", payload: { coach_id: "${co_id}", intake_id: "${in_id}", cadence: "WEEKLY", expected_client_version: "${cl_v}" }, as: Coach, as_user_id: "${co_id}", captures: { pl_id: "$.data.id" } }
            - { call: "POST /api/plans/${pl_id}/goals", payload: { title: "G", target_date: "2026-09-01" }, as: Coach, as_user_id: "${co_id}" }
            - { call: "POST /api/plans/${pl_id}/transition", payload: { to_state: "PROPOSED" }, as: Coach, as_user_id: "${co_id}" }
            - { call: "POST /api/plans/${pl_id}/transition", payload: { to_state: "ACTIVE" }, as: FamilyMember, as_user_id: "${fam_id}" }
          trigger:
            - { call: "POST /api/clients/${cl_id}/progress-snapshots", payload: {}, as: Coach, as_user_id: "${co_id}", captures: { sn_rolling: "$.data.rolling_index", sn_cum: "$.data.cumulative_index", sn_gc: "$.data.goals_considered" } }
          assert:
            - "sn_gc == 0"
            - "sn_rolling == null"
            - "sn_cum == null"

  - section: state_machines
    instances:
      - name: family_closed_terminal_lockdown_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Family, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CLOSED is terminal: any further transition attempt on a CLOSED family returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["family CLOSED (one client, no plans, no packages, no enrollments)"]
          setup_api_calls:
            - { call: "POST /api/families", payload: { account_name: "Fam TL", primary_email: "tl@x.com" }, as: PracticeAdmin, captures: { fam_id: "$.data.id" } }
            - { call: "POST /api/families/${fam_id}/clients", payload: { full_name: "Kid TL", date_of_birth: "2014-03-01", track: "INDIVIDUAL" }, as: PracticeAdmin }
            - { call: "POST /api/families/${fam_id}/transition", payload: { to_state: "ACTIVE" }, as: PracticeAdmin }
            - { call: "POST /api/families/${fam_id}/transition", payload: { to_state: "CLOSED" }, as: PracticeAdmin, captures: { fam_closed: "$.data.status" } }
          trigger:
            - { call: "POST /api/families/${fam_id}/transition", payload: { to_state: "ACTIVE" }, as: PracticeAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "fam_closed == CLOSED"
            - "err == ERR_INVALID_STATE"

      - name: package_refund_from_exhausted_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Package, "errors[ERR_PACKAGE_NOT_REFUNDABLE]"]
        distinguishing_aspect: "EXHAUSTED packages cannot be refunded (only ACTIVE or EXPIRED can): refund attempt returns ERR_PACKAGE_NOT_REFUNDABLE."
        test_recipe:
          setup: ["ACTIVE plan; 1-credit package whose only credit is consumed by a completed session => EXHAUSTED"]
          setup_api_calls:
            - { call: "POST /api/families", payload: { account_name: "Fam PR", primary_email: "pr@x.com" }, as: PracticeAdmin, captures: { fam_id: "$.data.id" } }
            - { call: "POST /api/families/${fam_id}/clients", payload: { full_name: "Kid PR", date_of_birth: "2014-04-01", track: "INDIVIDUAL" }, as: PracticeAdmin, captures: { cl_id: "$.data.id", cl_v: "$.data.version" } }
            - { call: "POST /api/families/${fam_id}/transition", payload: { to_state: "ACTIVE" }, as: PracticeAdmin }
            - { call: "POST /api/coaches", payload: { full_name: "Coach PR", credential_level: "CERTIFIED" }, as: PracticeAdmin, captures: { co_id: "$.data.id" } }
            - { call: "POST /api/clients/${cl_id}/intakes", payload: { presenting_concerns: "pr", baseline_score: 50 }, as: PracticeAdmin, captures: { in_id: "$.data.id" } }
            - { call: "POST /api/intakes/${in_id}/transition", payload: { to_state: "SUBMITTED" }, as: FamilyMember, as_user_id: "${fam_id}" }
            - { call: "POST /api/intakes/${in_id}/transition", payload: { to_state: "UNDER_REVIEW" }, as: Coach, as_user_id: "${co_id}" }
            - { call: "POST /api/intakes/${in_id}/transition", payload: { to_state: "APPROVED" }, as: Coach, as_user_id: "${co_id}" }
            - { call: "POST /api/families/${fam_id}/packages", payload: { track: "INDIVIDUAL", credits_total: 1 }, as: PracticeAdmin, captures: { pk_id: "$.data.id" } }
            - { call: "POST /api/clients/${cl_id}/plans", payload: { coach_id: "${co_id}", intake_id: "${in_id}", cadence: "WEEKLY", expected_client_version: "${cl_v}" }, as: Coach, as_user_id: "${co_id}", captures: { pl_id: "$.data.id" } }
            - { call: "POST /api/plans/${pl_id}/goals", payload: { title: "G", target_date: "2026-09-01" }, as: Coach, as_user_id: "${co_id}" }
            - { call: "POST /api/plans/${pl_id}/transition", payload: { to_state: "PROPOSED" }, as: Coach, as_user_id: "${co_id}" }
            - { call: "POST /api/plans/${pl_id}/transition", payload: { to_state: "ACTIVE" }, as: FamilyMember, as_user_id: "${fam_id}" }
            - { call: "POST /api/plans/${pl_id}/sessions", payload: { package_id: "${pk_id}", scheduled_start: "2026-08-03T15:00:00Z", scheduled_end: "2026-08-03T16:00:00Z" }, as: Coach, as_user_id: "${co_id}", captures: { s_id: "$.data.id" } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T15:30:00Z" }, as: PracticeAdmin }
            - { call: "POST /api/sessions/${s_id}/complete", payload: {}, as: Coach, as_user_id: "${co_id}" }
            - { call: "GET /api/packages/${pk_id}", as: PracticeAdmin, captures: { pk_status: "$.data.status" } }
          trigger:
            - { call: "POST /api/packages/${pk_id}/refund", payload: {}, as: PracticeAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "pk_status == EXHAUSTED"
            - "err == ERR_PACKAGE_NOT_REFUNDABLE"

      - name: checkin_acknowledge_twice_rejected
        claim_type: idempotency
        grounds: [state_machines.CheckIn, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "ACKNOWLEDGED is terminal: a second acknowledge returns ERR_INVALID_STATE; the first moves SUBMITTED_ON_TIME -> ACKNOWLEDGED."
        test_recipe:
          setup: ["ACTIVE plan; check-in due 2026-08-05 submitted on time"]
          setup_api_calls:
            - { call: "POST /api/families", payload: { account_name: "Fam CK", primary_email: "ck@x.com" }, as: PracticeAdmin, captures: { fam_id: "$.data.id" } }
            - { call: "POST /api/families/${fam_id}/clients", payload: { full_name: "Kid CK", date_of_birth: "2014-05-01", track: "INDIVIDUAL" }, as: PracticeAdmin, captures: { cl_id: "$.data.id", cl_v: "$.data.version" } }
            - { call: "POST /api/families/${fam_id}/transition", payload: { to_state: "ACTIVE" }, as: PracticeAdmin }
            - { call: "POST /api/coaches", payload: { full_name: "Coach CK", credential_level: "CERTIFIED" }, as: PracticeAdmin, captures: { co_id: "$.data.id" } }
            - { call: "POST /api/clients/${cl_id}/intakes", payload: { presenting_concerns: "ck", baseline_score: 50 }, as: PracticeAdmin, captures: { in_id: "$.data.id" } }
            - { call: "POST /api/intakes/${in_id}/transition", payload: { to_state: "SUBMITTED" }, as: FamilyMember, as_user_id: "${fam_id}" }
            - { call: "POST /api/intakes/${in_id}/transition", payload: { to_state: "UNDER_REVIEW" }, as: Coach, as_user_id: "${co_id}" }
            - { call: "POST /api/intakes/${in_id}/transition", payload: { to_state: "APPROVED" }, as: Coach, as_user_id: "${co_id}" }
            - { call: "POST /api/clients/${cl_id}/plans", payload: { coach_id: "${co_id}", intake_id: "${in_id}", cadence: "WEEKLY", expected_client_version: "${cl_v}" }, as: Coach, as_user_id: "${co_id}", captures: { pl_id: "$.data.id" } }
            - { call: "POST /api/plans/${pl_id}/goals", payload: { title: "G", target_date: "2026-09-01" }, as: Coach, as_user_id: "${co_id}" }
            - { call: "POST /api/plans/${pl_id}/transition", payload: { to_state: "PROPOSED" }, as: Coach, as_user_id: "${co_id}" }
            - { call: "POST /api/plans/${pl_id}/transition", payload: { to_state: "ACTIVE" }, as: FamilyMember, as_user_id: "${fam_id}" }
            - { call: "POST /api/plans/${pl_id}/checkins", payload: { due_at: "2026-08-05T00:00:00Z" }, as: Coach, as_user_id: "${co_id}", captures: { ci_id: "$.data.id" } }
            - { call: "POST /api/checkins/${ci_id}/submit", payload: {}, as: FamilyMember, as_user_id: "${fam_id}", captures: { ci_status: "$.data.status" } }
          trigger:
            - { call: "POST /api/checkins/${ci_id}/acknowledge", payload: {}, as: Coach, as_user_id: "${co_id}", captures: { ci_ack: "$.data.status" } }
            - { call: "POST /api/checkins/${ci_id}/acknowledge", payload: {}, as: Coach, as_user_id: "${co_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "ci_status == SUBMITTED_ON_TIME"
            - "ci_ack == ACKNOWLEDGED"
            - "err == ERR_INVALID_STATE"

      - name: workshop_enroll_when_locked_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Workshop, "errors[ERR_WORKSHOP_NOT_OPEN]"]
        distinguishing_aspect: "LOCKED freezes the roster: enrollment creation while LOCKED returns ERR_WORKSHOP_NOT_OPEN even though seats remain."
        test_recipe:
          setup: ["workshop capacity 5, OPEN then LOCKED; family with ACTIVE HYBRID client"]
          setup_api_calls:
            - { call: "POST /api/families", payload: { account_name: "Fam WL", primary_email: "wl@x.com" }, as: PracticeAdmin, captures: { fam_id: "$.data.id" } }
            - { call: "POST /api/families/${fam_id}/clients", payload: { full_name: "Kid WL", date_of_birth: "2014-06-01", track: "HYBRID" }, as: PracticeAdmin, captures: { cl_id: "$.data.id", cl_v: "$.data.version" } }
            - { call: "POST /api/families/${fam_id}/transition", payload: { to_state: "ACTIVE" }, as: PracticeAdmin }
            - { call: "POST /api/coaches", payload: { full_name: "Coach WL", credential_level: "CERTIFIED" }, as: PracticeAdmin, captures: { co_id: "$.data.id" } }
            - { call: "POST /api/clients/${cl_id}/intakes", payload: { presenting_concerns: "wl", baseline_score: 50 }, as: PracticeAdmin, captures: { in_id: "$.data.id" } }
            - { call: "POST /api/intakes/${in_id}/transition", payload: { to_state: "SUBMITTED" }, as: FamilyMember, as_user_id: "${fam_id}" }
            - { call: "POST /api/intakes/${in_id}/transition", payload: { to_state: "UNDER_REVIEW" }, as: Coach, as_user_id: "${co_id}" }
            - { call: "POST /api/intakes/${in_id}/transition", payload: { to_state: "APPROVED" }, as: Coach, as_user_id: "${co_id}" }
            - { call: "POST /api/clients/${cl_id}/plans", payload: { coach_id: "${co_id}", intake_id: "${in_id}", cadence: "WEEKLY", expected_client_version: "${cl_v}" }, as: Coach, as_user_id: "${co_id}", captures: { pl_id: "$.data.id" } }
            - { call: "POST /api/plans/${pl_id}/goals", payload: { title: "G", target_date: "2026-09-01" }, as: Coach, as_user_id: "${co_id}" }
            - { call: "POST /api/plans/${pl_id}/transition", payload: { to_state: "PROPOSED" }, as: Coach, as_user_id: "${co_id}" }
            - { call: "POST /api/plans/${pl_id}/transition", payload: { to_state: "ACTIVE" }, as: FamilyMember, as_user_id: "${fam_id}" }
            - { call: "POST /api/workshops", payload: { title: "Lock Lab", coach_id: "${co_id}", capacity: 5, window_start: "2026-09-05T17:00:00Z", window_end: "2026-09-05T20:00:00Z", price_cents: 15000 }, as: PracticeAdmin, captures: { ws_id: "$.data.id" } }
            - { call: "POST /api/workshops/${ws_id}/transition", payload: { to_state: "OPEN" }, as: PracticeAdmin }
            - { call: "POST /api/workshops/${ws_id}/transition", payload: { to_state: "LOCKED" }, as: PracticeAdmin }
          trigger:
            - { call: "POST /api/workshops/${ws_id}/enrollments", payload: { client_id: "${cl_id}" }, as: FamilyMember, as_user_id: "${fam_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_WORKSHOP_NOT_OPEN"

      - name: consent_sign_after_expiry_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.ConsentGrant, "errors[ERR_CONSENT_EXPIRED]"]
        distinguishing_aspect: "Signing a PENDING_SIGNATURE consent when now >= expires_at returns ERR_CONSENT_EXPIRED."
        test_recipe:
          setup: ["family with contact; consent expiring 2026-08-02T00:00:00Z; clock moved to 2026-08-03T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /api/families", payload: { account_name: "Fam CE", primary_email: "ce@x.com" }, as: PracticeAdmin, captures: { fam_id: "$.data.id" } }
            - { call: "POST /api/families/${fam_id}/contacts", payload: { name: "Dr E", organization: "Clinic", contact_type: "CLINICIAN", email: "e@clinic.com" }, as: FamilyMember, as_user_id: "${fam_id}", captures: { ct_id: "$.data.id" } }
            - { call: "GET /api/families/${fam_id}", as: PracticeAdmin, captures: { fam_v: "$.data.version" } }
            - { call: "POST /api/families/${fam_id}/consents", payload: { contact_id: "${ct_id}", scope: "FULL_PLAN", expires_at: "2026-08-02T00:00:00Z", expected_family_version: "${fam_v}" }, as: FamilyMember, as_user_id: "${fam_id}", captures: { cg_id: "$.data.id" } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: PracticeAdmin }
          trigger:
            - { call: "POST /api/consents/${cg_id}/transition", payload: { to_state: "ACTIVE" }, as: FamilyMember, as_user_id: "${fam_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_CONSENT_EXPIRED"

      - name: goal_carry_forward_on_plan_supersede
        claim_type: side_effect_execution
        grounds: [state_machines.CoachingPlan.ACTIVE_to_SUPERSEDED, state_machines.Goal.SET_to_CARRIED_FORWARD]
        distinguishing_aspect: "Accepting plan 2 supersedes ACTIVE plan 1; plan 1's non-terminal goals flip to CARRIED_FORWARD with carried_to_plan_id == plan 2, and plan 1's status becomes SUPERSEDED."
        test_recipe:
          setup: ["ACTIVE plan 1 with goals g1 SET and g2 SET; plan 2 drafted+proposed for the same client (fresh OCC version read)"]
          setup_api_calls:
            - { call: "POST /api/families", payload: { account_name: "Fam CF", primary_email: "cf@x.com" }, as: PracticeAdmin, captures: { fam_id: "$.data.id" } }
            - { call: "POST /api/families/${fam_id}/clients", payload: { full_name: "Kid CF", date_of_birth: "2014-07-01", track: "INDIVIDUAL" }, as: PracticeAdmin, captures: { cl_id: "$.data.id", cl_v: "$.data.version" } }
            - { call: "POST /api/families/${fam_id}/transition", payload: { to_state: "ACTIVE" }, as: PracticeAdmin }
            - { call: "POST /api/coaches", payload: { full_name: "Coach CF", credential_level: "CERTIFIED" }, as: PracticeAdmin, captures: { co_id: "$.data.id" } }
            - { call: "POST /api/clients/${cl_id}/intakes", payload: { presenting_concerns: "cf", baseline_score: 50 }, as: PracticeAdmin, captures: { in_id: "$.data.id" } }
            - { call: "POST /api/intakes/${in_id}/transition", payload: { to_state: "SUBMITTED" }, as: FamilyMember, as_user_id: "${fam_id}" }
            - { call: "POST /api/intakes/${in_id}/transition", payload: { to_state: "UNDER_REVIEW" }, as: Coach, as_user_id: "${co_id}" }
