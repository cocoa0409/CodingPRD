scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1: dual_variant_calc — two valid approaches produce different results,
  # on DIFFERENT entity domains.
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: pip_attainment_provisional_vs_final_diverge_on_admissibility
        grounds:
          - calculations.pip_attainment_ratio
          - entities.PerformanceImprovementPlan.fields.provisional_attainment_ratio
          - entities.PerformanceImprovementPlan.fields.final_attainment_ratio
        distinguishing_aspect: |
          Entity domain = PerformanceImprovementPlan attainment. PROVISIONAL
          counts only ADMISSIBLE evidence (inadmissible evidence contributes 0
          while its weight still divides the denominator); FINAL counts every
          submitted evidence value regardless of admissibility. With one
          ADMISSIBLE and one INADMISSIBLE evidence on the same PIP, the two
          variants produce different ratios for identical evidence data.
        test_recipe:
          setup:
            - "Org unit OU1; clock pinned at 2026-08-01T00:00:00Z then advanced to plan window"
            - "Manager M1 (ENGINEERING, level 5) manages subject employee E1 (ENGINEERING, level 5)"
            - "Two DOCUMENTED coaching entries on E1 by M1"
            - "Concern C1 on E1 raised by M1, SUBMITTED then ACCEPTED by HRBP H1"
            - "Template T1 PUBLISHED with duration_days=30, cadence=10, two blueprints each weight=50, targets 2 and 20"
            - "PIP P1 created for E1 from C1+T1 at start_date 2026-08-01, ISSUED by H1 (OCC expected_pip_version from creation response)"
            - "Check-in K1 scheduled_for=2026-08-11; two evidence items on K1: EV_A (defects=1, source=SYSTEM_REPORT) ADMITTED by H1, EV_B (story_points=20, source=SELF_REPORT) EXCLUDED by H1"
            - "K1 marked HELD (both attended, 20+ char notes)"
          setup_api_calls:
            - call: "POST /hr-org-units"
              payload: { name: "OU1" }
              as: HRSystemAdmin
              captures: { ou_id: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees"
              payload: { full_name: "Boss M1", email: "m1@x.com", job_family: "ENGINEERING", job_level: 6 }
              as: HRSystemAdmin
              captures: { mgr_id: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees"
              payload: { full_name: "HRBP H1", email: "h1@x.com", job_family: "OPERATIONS", job_level: 7 }
              as: HRSystemAdmin
              captures: { hrbp_id: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees"
              payload: { full_name: "E1 Subject", email: "e1@x.com", job_family: "ENGINEERING", job_level: 5, manager_id: "${mgr_id}" }
              as: HRSystemAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/coaching-log-entries"
              payload: { occurred_at: "2026-07-01T10:00:00Z", category: "QUALITY", severity: "DOCUMENTED", narrative: "Defect rate above team norm for two sprints; reviewed expectations and paired on RCA for the last three incidents." }
              as: Manager
              as_user_id: "${mgr_id}"
              captures: { cle1: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/coaching-log-entries"
              payload: { occurred_at: "2026-07-08T10:00:00Z", category: "VELOCITY", severity: "DOCUMENTED", narrative: "Story-point throughput below target for sprint 12; agreed on daily standup check-ins and scope trimming tactics." }
              as: Manager
              as_user_id: "${mgr_id}"
              captures: { cle2: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/performance-concerns"
              payload: { category: "QUALITY", summary: "Sustained quality & velocity gap vs level-5 bar", coaching_log_entry_ids: ["${cle1}", "${cle2}"] }
              as: Manager
              as_user_id: "${mgr_id}"
              captures: { concern_id: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/performance-concerns/${concern_id}/submit"
              payload: {}
              as: Manager
              as_user_id: "${mgr_id}"
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/performance-concerns/${concern_id}/accept"
              payload: {}
              as: HRBusinessPartner
              as_user_id: "${hrbp_id}"
            - call: "POST /hr-org-units/${ou_id}/pip-templates"
              payload:
                name: "Eng L5 quality PIP"
                category: "QUALITY"
                goal_blueprints:
                  - { metric_key: "defects_per_kloc", target_value: 2, unit: "count", weight: 50 }
                  - { metric_key: "story_points", target_value: 20, unit: "points", weight: 50 }
                duration_days: 30
                check_in_cadence_days: 10
              as: HRBusinessPartner
              as_user_id: "${hrbp_id}"
              captures: { tpl_id: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/pip-templates/${tpl_id}/publish"
              payload: {}
              as: HRBusinessPartner
              as_user_id: "${hrbp_id}"
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/pips"
              payload: { concern_id: "${concern_id}", template_id: "${tpl_id}", start_date: "2026-08-01T00:00:00Z" }
              as: HRBusinessPartner
              as_user_id: "${hrbp_id}"
              captures: { pip_id: $.data.id, pip_v_create: $.data.version }
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/pips/${pip_id}/issue"
              payload: { expected_pip_version: "${pip_v_create}" }
              as: HRBusinessPartner
              as_user_id: "${hrbp_id}"
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/pips/${pip_id}/check-ins"
              payload: { scheduled_for: "2026-08-11T00:00:00Z" }
              as: HRBusinessPartner
              as_user_id: "${hrbp_id}"
              captures: { ck_id: $.data.id }
            - call: "GET /hr-org-units/${ou_id}/employees/${emp_id}/pips/${pip_id}/goals"
              payload: {}
              as: HRBusinessPartner
              as_user_id: "${hrbp_id}"
              captures:
                goal_defects: "$.data[0].id"
                goal_sp: "$.data[1].id"
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/pips/${pip_id}/check-ins/${ck_id}/evidence"
              payload: { pip_goal_id: "${goal_defects}", observed_value: 1, source: "SYSTEM_REPORT" }
              as: HRBusinessPartner
              as_user_id: "${hrbp_id}"
              captures: { ev_a: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/pips/${pip_id}/check-ins/${ck_id}/evidence"
              payload: { pip_goal_id: "${goal_sp}", observed_value: 20, source: "SELF_REPORT" }
              as: HRBusinessPartner
              as_user_id: "${hrbp_id}"
              captures: { ev_b: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/pips/${pip_id}/check-ins/${ck_id}/evidence/${ev_a}/admit"
              payload: {}
              as: HRBusinessPartner
              as_user_id: "${hrbp_id}"
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/pips/${pip_id}/check-ins/${ck_id}/evidence/${ev_b}/exclude"
              payload: {}
              as: HRBusinessPartner
              as_user_id: "${hrbp_id}"
            - call: "POST /hr-org-units/${ou_id}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T10:00:00Z" }
              as: HRSystemAdmin
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/pips/${pip_id}/check-ins/${ck_id}/mark-held"
              payload: { manager_attended: true, hrbp_attended: true, notes: "Reviewed current trajectory against both goals in depth." }
              as: HRBusinessPartner
              as_user_id: "${hrbp_id}"
          trigger:
            - call: "GET /hr-org-units/${ou_id}/employees/${emp_id}/pips/${pip_id}"
              payload: {}
              as: HRBusinessPartner
              as_user_id: "${hrbp_id}"
              captures: { prov_ratio: $.data.provisional_attainment_ratio }
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/pips/${pip_id}/outcome-decisions"
              payload: { proposed_outcome: "SUCCESS", rationale: "Provisional attainment meets bar based on admitted evidence only." }
              as: HRBusinessPartner
              as_user_id: "${hrbp_id}"
              captures: { decision_id: $.data.id, final_ratio: $.data.final_attainment_ratio_at_decision }
          assert:
            - "PerformanceImprovementPlan.${pip_id}.provisional_attainment_ratio == 0.5"
            - "OutcomeDecision.${decision_id}.final_attainment_ratio_at_decision == 1.0"
            - "provisional_attainment_ratio != final_attainment_ratio_at_decision"

      - name: legal_risk_score_baseline_vs_documentation_gap_multiplier
        grounds:
          - calculations.legal_risk_score
          - entities.LegalReview.fields.risk_score
        distinguishing_aspect: |
          Entity domain = LegalReview risk scoring (distinct from PIP
          attainment). Two valid readings of the prose produce different
          scores: a baseline additive reading (sum of weights only) versus
          the pinned reading with DOCUMENTATION_GAP doubling and the
          WHISTLEBLOWER_HISTORY compound bonus. Same factor multiset,
          different totals — pins the multiplicative variant.
        test_recipe:
          setup:
            - "Org unit, manager M1, HRBP H1, LegalCounsel L1, employee E1"
            - "PIP P1 for E1 ACTIVE"
            - "Legal review LR1 requested for P1, claimed by L1"
