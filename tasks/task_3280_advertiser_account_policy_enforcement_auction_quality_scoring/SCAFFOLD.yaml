scenario: |
  Advertiser Account Policy Enforcement & Auction Quality Scoring (Google Ads): advertiser account verification including business identity and advertiser identity disclosure requirements, ad and landing page policy review with automated and human enforcement across restricted categories, auction mechanics where bid, expected click-through rate, ad relevance and landing page experience determine placement and price, quality signals affecting cost per click with advertiser-visible diagnostics, budget pacing across a day and month with overdelivery credit rules, keyword match types, negative keywords and search term reporting shaping targeting, account suspension for circumvention and policy violations with appeal, billing thresholds, invoicing and invalid click credits

domain_name: advertiser-policy-auction
api_prefix: /

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - scheduled_deferred_actions
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate
  difficulty_level: expert_plus
  entity_count: 12
  state_machine_count: 7
  calculation_count: 7
  endpoint_count: 39
  error_code_count: 27
  role_count: 5

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: AdvertiserAccount
    parent: null
    common_fields: true
    fields:
      - { name: business_name, type: string, source: input, description: "Advertiser business display name" }
      - { name: country_code, type: string, source: input, description: "ISO 3166-1 alpha-2 country of business", constraints: "exactly 2 uppercase letters" }
      - { name: status, type: enum, source: system, description: "PENDING_VERIFICATION | ACTIVE | SUSPENDED | APPEAL_PENDING | SUSPENDED_FINAL", default: PENDING_VERIFICATION }
      - { name: suspension_reason_code, type: enum, source: system, description: "POLICY_VIOLATION | CIRCUMVENTION | BILLING_DELINQUENCY; null unless suspended", default: null }
      - { name: suspended_at, type: datetime, source: system, description: "Logical-clock timestamp of most recent ACTIVE->SUSPENDED transition; null if never suspended", default: null }
      - { name: upheld_appeal_count, type: integer, source: system, description: "Number of appeals decided UPHELD against the current suspension episode", default: 0 }
      - { name: verified_business_name, type: string, source: computed, description: "Legal business name from the APPROVED IdentityVerification; null until approved", default: null }
      - { name: disclosure_text, type: string, source: computed, description: "Advertiser identity disclosure: 'Ads by <verified_business_name>'; null until verified", default: null }
      - { name: lifetime_valid_served_cents, type: integer, source: computed, description: "Sum of charged_cents over all clicks on this account's ads where is_invalid_click is currently false", default: 0 }
      - { name: lifetime_billed_cents, type: integer, source: computed, description: "Sum of current amount_cents over all Invoices of this account's BillingProfile", default: 0 }
      - { name: lifetime_overdelivery_credit_cents, type: integer, source: computed, description: "Sum of overdelivery credits issued at close-month across all campaigns", default: 0 }
      - { name: lifetime_invalid_click_credit_cents, type: integer, source: computed, description: "Sum of charged_cents over all clicks ever flagged invalid", default: 0 }

  - name: IdentityVerification
    parent: AdvertiserAccount
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> AdvertiserAccount.id; owning account" }
      - { name: legal_business_name, type: string, source: input, description: "Legal name on the registration document" }
      - { name: registration_number, type: string, source: input, description: "Government registration / tax id on the document" }
      - { name: document_type, type: enum, source: input, description: "BUSINESS_LICENSE | TAX_CERTIFICATE | GOVERNMENT_ID" }
      - { name: disclosure_consent, type: boolean, source: input, description: "Advertiser consents to public identity disclosure" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | REJECTED", default: SUBMITTED }
      - { name: rejection_reason, type: string, source: system, description: "Reviewer-supplied reason when REJECTED; null otherwise", default: null }
      - { name: supersedes_id, type: string, source: system, description: "id of the previous REJECTED IdentityVerification this record supersedes; null for the first", default: null }

  - name: Appeal
    parent: AdvertiserAccount
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> AdvertiserAccount.id; suspended account being appealed" }
      - { name: argument_text, type: string, source: input, description: "Advertiser's appeal argument" }
      - { name: challenges_suspended_at, type: datetime, source: system, description: "Copy of AdvertiserAccount.suspended_at this appeal challenges" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | UPHELD | OVERTURNED", default: SUBMITTED }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock timestamp of the decide call; null until decided", default: null }
      - { name: reviewer_note, type: string, source: system, description: "Reviewer note recorded at decide; null until decided", default: null }

  - name: BillingProfile
    parent: AdvertiserAccount
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> AdvertiserAccount.id; exactly one profile per account" }
      - { name: payment_method_type, type: enum, source: input, description: "CARD | INVOICING" }
      - { name: currency_code, type: string, source: input, description: "ISO 4217 currency; fixed semantics in USD cents", default: "USD" }
      - { name: billing_threshold_cents, type: integer, source: computed, description: "Current threshold ladder rung: 50000 -> 150000 -> 300000 -> 500000; escalates on full payment of a THRESHOLD invoice", default: 50000 }
      - { name: unbilled_cost_cents, type: integer, source: computed, description: "Valid served cost not yet covered by any invoice (gross, before pending credits)", default: 0 }
      - { name: pending_credit_cents, type: integer, source: computed, description: "Credits issued but not yet applied to an invoice (e.g. invalid-click credit against a fully PAID invoice)", default: 0 }
      - { name: outstanding_balance_cents, type: integer, source: computed, description: "Sum of (amount_cents - paid_cents) over all invoices", default: 0 }
      - { name: last_closed_month, type: string, source: system, description: "Most recent calendar month closed via close-month, YYYY-MM; null if none", default: null }

  - name: Campaign
    parent: AdvertiserAccount
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> AdvertiserAccount.id; owning account" }
      - { name: name, type: string, source: input, description: "Campaign name" }
      - { name: daily_budget_cents, type: integer, source: input, description: "Average daily budget in cents", constraints: ">= 100" }
      - { name: start_date, type: string, source: input, description: "Flight start date YYYY-MM-DD, inclusive" }
      - { name: end_date, type: string, source: input, description: "Flight end date YYYY-MM-DD, inclusive; must be >= start_date" }
      - { name: eligible_ad_count, type: integer, source: computed, description: "Count of ads in this campaign's ad groups with status ELIGIBLE; auto-pause fires only when the count drops via the DISAPPROVED path, not via voluntary edits", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | PAUSED | ENDED", default: DRAFT }
      - { name: pause_origin, type: enum, source: system, description: "NONE | ADVERTISER | SUSPENSION | NO_ELIGIBLE_ADS; why the campaign is PAUSED", default: NONE }
      - { name: served_lifetime_cents, type: integer, source: computed, description: "Sum of DailySpendRecord.served_cents across all days of this campaign", default: 0 }
      - { name: click_count_lifetime, type: integer, source: computed, description: "Sum of DailySpendRecord.click_count across all days", default: 0 }
      - { name: current_month_served_cents, type: integer, source: computed, description: "Served cents in the calendar month containing the current logical date", default: 0 }
      - { name: overdelivery_credit_cents, type: integer, source: computed, description: "Lifetime overdelivery credit issued for this campaign at month closes", default: 0 }
      - { name: eligible_ad_count, type: integer, source: computed, description: "Count of ads in this campaign's ad groups with status ELIGIBLE", default: 0 }
      - { name: monthly_cap_provisional_cents, type: integer, source: computed, description: "Forward-looking provisional cap: current daily_budget_cents * 304 // 10", default: 0 }
      - { name: last_closed_month_cap_cents, type: integer, source: computed, description: "Final chronological monthly cap computed at the most recent close-month; null before first close", default: null }
      - { name: last_closed_month_credit_cents, type: integer, source: computed, description: "Overdelivery credit issued at the most recent close-month; null before first close", default: null }

  - name: AdGroup
    parent: Campaign
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "FK -> Campaign.id; owning campaign" }
      - { name: name, type: string, source: input, description: "Ad group name" }

  - name: Ad
    parent: AdGroup
    common_fields: true
    fields:
      - { name: ad_group_id, type: string, source: input, description: "FK -> AdGroup.id; owning ad group" }
      - { name: headline, type: string, source: input, description: "Ad headline; unique per ad group (case-insensitive)" }
      - { name: final_url, type: string, source: input, description: "Landing page URL" }
      - { name: category, type: enum, source: input, description: "GENERAL | ALCOHOL | GAMBLING | HEALTHCARE | FINANCIAL" }
      - { name: restricted_category_certified, type: boolean, source: input, description: "Advertiser holds certification for restricted categories", default: false }
      - { name: quality_ectr_score, type: integer, source: input, description: "Expected click-through-rate component, 1..10", constraints: "1..10" }
      - { name: quality_relevance_score, type: integer, source: input, description: "Ad relevance component, 1..10", constraints: "1..10" }
      - { name: quality_lp_score, type: integer, source: input, description: "Landing page experience component, 1..10", constraints: "1..10" }
      - { name: quality_score_snapshot_centi, type: integer, source: computed, description: "Advertiser-visible diagnostic: quality_score_centi frozen at the most recent approval; null until first approval", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | UNDER_REVIEW | ELIGIBLE | DISAPPROVED", default: DRAFT }
      - { name: review_round, type: integer, source: system, description: "Number of times this ad entered UNDER_REVIEW", default: 0 }

  - name: Keyword
    parent: AdGroup
    common_fields: true
    fields:
      - { name: ad_group_id, type: string, source: input, description: "FK -> AdGroup.id; owning ad group" }
      - { name: text, type: string, source: input, description: "Raw keyword text as entered" }
      - { name: normalized_text, type: string, source: computed, description: "lowercase, trimmed, internal whitespace collapsed to single spaces" }
      - { name: match_type, type: enum, source: input, description: "EXACT | PHRASE | BROAD" }
      - { name: is_negative, type: boolean, source: input, description: "true = negative keyword (blocking)", default: false }
      - { name: max_cpc_cents, type: integer, source: input, description: "Bid ceiling; required and > 0 when is_negative=false; forbidden when is_negative=true", default: null }

  - name: PolicyReview
    parent: Ad
    common_fields: true
    fields:
      - { name: ad_id, type: string, source: system, description: "FK -> Ad.id; ad under review" }
      - { name: round, type: integer, source: system, description: "Review round, equals Ad.review_round at creation" }
      - { name: automated_verdict, type: enum, source: system, description: "CLEAN (category GENERAL) | FLAGGED_RESTRICTED (restricted category)" }
      - { name: outcome, type: enum, source: system, description: "PENDING_AUTO | AUTO_APPROVED | NEEDS_HUMAN | HUMAN_APPROVED | HUMAN_VIOLATION", default: PENDING_AUTO }
      - { name: reviewer_note, type: string, source: system, description: "Note supplied at human decide; null until then", default: null }

  - name: AuctionEvent
    parent: null
    common_fields: true
    fields:
      - { name: query_text, type: string, source: input, description: "Raw search query" }
      - { name: clicked, type: boolean, source: input, description: "Whether the winning ad receives a click", default: false }
      - { name: is_invalid_click, type: boolean, source: input, description: "Whether the click is invalid traffic at record time", default: false }
      - { name: occurred_date, type: string, source: system, description: "Logical-clock date YYYY-MM-DD of the auction" }
      - { name: winner_ad_id, type: string, source: system, description: "FK -> Ad.id; winning ad" }
      - { name: winner_campaign_id, type: string, source: system, description: "id of winner's campaign (informational snapshot, resolved via Ad.ad_group_id)" }
      - { name: winner_ad_rank, type: integer, source: system, description: "Winning ad rank (bid_cents * quality_score_centi)" }
      - { name: runner_up_ad_rank, type: integer, source: system, description: "Highest non-winning eligible ad rank; null if none", default: null }
      - { name: quality_score_final_centi, type: integer, source: system, description: "Live quality score of the winner at auction time" }
      - { name: charged_cents, type: integer, source: computed, description: "actual CPC charged: 0 unless clicked and currently valid", default: 0 }

  - name: DailySpendRecord
    parent: Campaign
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: system, description: "FK -> Campaign.id; owning campaign" }
      - { name: spend_date, type: string, source: system, description: "Calendar date YYYY-MM-DD (logical clock)" }
      - { name: served_cents, type: integer, source: computed, description: "Sum of charged_cents for valid clicks on this campaign-day", default: 0 }
      - { name: click_count, type: integer, source: computed, description: "Number of valid clicks on this campaign-day", default: 0 }

  - name: Invoice
    parent: BillingProfile
    common_fields: true
    fields:
      - { name: billing_profile_id, type: string, source: system, description: "FK -> BillingProfile.id; owning profile" }
      - { name: kind, type: enum, source: system, description: "THRESHOLD | MONTHLY" }
      - { name: period_start, type: datetime, source: system, description: "Exclusive lower bound: issue time of the previous invoice, or profile creation" }
      - { name: period_end, type: datetime, source: system, description: "Inclusive upper bound: issue time of this invoice" }
      - { name: amount_cents, type: integer, source: computed, description: "Served cost in period minus credits applied at issuance; may be reduced later by invalid-click credits while unpaid" }
      - { name: overdelivery_credit_cents, type: integer, source: computed, description: "Overdelivery credit applied to this invoice", default: 0 }
      - { name: invalid_click_credit_cents, type: integer, source: computed, description: "Invalid-click credit applied to this invoice", default: 0 }
      - { name: status, type: enum, source: system, description: "ISSUED | PARTIALLY_PAID | PAID | OVERDUE", default: ISSUED }
      - { name: due_date, type: string, source: system, description: "Issue date + 14 days, YYYY-MM-DD" }
      - { name: paid_cents, type: integer, source: computed, description: "Sum of payments applied", default: 0 }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: AdvertiserAccount
    field: status
    initial_state: PENDING_VERIFICATION
    terminal_states: [SUSPENDED_FINAL]
    transitions:
      - from: PENDING_VERIFICATION
        to: ACTIVE
        trigger: "POST /identity-verifications/{verification_id}/decide with outcome=APPROVED"
        actor: PlatformAdmin
        preconditions:
          - "IdentityVerification.status == SUBMITTED and belongs to this account"
        side_effects:
          - "verified_business_name := verification.legal_business_name"
          - "disclosure_text := 'Ads by ' + verified_business_name"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /advertiser-accounts/{account_id}/suspend"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "suspension_reason_code := request reason_code; suspended_at := logical clock; upheld_appeal_count := 0"
          - "cascade link 1: every Campaign of this account in ACTIVE -> PAUSED with pause_origin=SUSPENSION"
          - "cascade link 2 (caused by link 1): each paused campaign recomputes eligible_ad_count (unchanged values, ads keep status ELIGIBLE but are auction-ineligible while campaign PAUSED)"
      - from: SUSPENDED
        to: APPEAL_PENDING
        trigger: "POST /advertiser-accounts/{account_id}/appeals"
        actor: Advertiser
        preconditions:
          - "logical clock < suspended_at + 30 days (appeal window, half-open)"
          - "no Appeal of this account in SUBMITTED or UNDER_REVIEW"
          - "logical clock >= decided_at of the most recent UPHELD appeal + 14 days, when such an appeal exists (cooling-off buffer)"
        side_effects: []
      - from: APPEAL_PENDING
        to: ACTIVE
        trigger: "POST /appeals/{appeal_id}/decide with outcome=OVERTURNED"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "cascade link 1: suspension_reason_code := null, suspended_at retained for audit"
          - "cascade link 2 (caused by link 1): every Campaign with pause_origin=SUSPENSION -> ACTIVE, pause_origin=NONE"
          - "cascade link 3 (caused by link 2): each resumed campaign recomputes eligible_ad_count"
      - from: APPEAL_PENDING
        to: SUSPENDED
        trigger: "POST /appeals/{appeal_id}/decide with outcome=UPHELD"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "upheld_appeal_count += 1"
          - "if upheld_appeal_count reaches 2: status := SUSPENDED_FINAL instead of SUSPENDED"
      - from: SUSPENDED
        to: SUSPENDED_FINAL
        trigger: "system (lazy): logical clock >= suspended_at + 30 days with no open appeal"
        actor: system
        preconditions: []
        side_effects:
          - "evaluated lazily on any access of the account and on appeal creation attempts"

  - entity: IdentityVerification
    field: status
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /identity-verifications/{verification_id}/decide with outcome=APPROVED"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "AdvertiserAccount PENDING_VERIFICATION -> ACTIVE (see AdvertiserAccount machine)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /identity-verifications/{verification_id}/decide with outcome=REJECTED"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "rejection_reason := request rejection_reason (required for REJECTED)"
          - "account remains PENDING_VERIFICATION; a new IdentityVerification may be created (supersede, OCC-guarded on account version)"

  - entity: Appeal
    field: status
    initial_state: SUBMITTED
    terminal_states: [UPHELD, OVERTURNED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "system: automatic upon creation (intake)"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: UPHELD
        trigger: "POST /appeals/{appeal_id}/decide with outcome=UPHELD"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "decided_at := logical clock; reviewer_note := request note"
          - "AdvertiserAccount APPEAL_PENDING -> SUSPENDED (or SUSPENDED_FINAL at 2 upheld)"
      - from: UNDER_REVIEW
        to: OVERTURNED
        trigger: "POST /appeals/{appeal_id}/decide with outcome=OVERTURNED"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "decided_at := logical clock"
          - "AdvertiserAccount APPEAL_PENDING -> ACTIVE with campaign resume cascade"

  - entity: Campaign
    field: status
    initial_state: DRAFT
    terminal_states: [ENDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /campaigns/{campaign_id}/activate"
        actor: Advertiser
        preconditions:
          - "AdvertiserAccount.status == ACTIVE (ERR_VERIFICATION_REQUIRED when PENDING_VERIFICATION, ERR_ACCOUNT_SUSPENDED when SUSPENDED/APPEAL_PENDING/SUSPENDED_FINAL)"
          - "logical date within [start_date, end_date] (ERR_CAMPAIGN_OUTSIDE_FLIGHT_WINDOW)"
        side_effects:
          - "pause_origin := NONE"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /campaigns/{campaign_id}/activate (advertiser resume) or system (appeal OVERTURNED cascade for pause_origin=SUSPENSION)"
        actor: Advertiser
        preconditions:
          - "manual resume: AdvertiserAccount.status == ACTIVE and logical date within flight window"
          - "system resume: only when pause_origin == SUSPENSION"
        side_effects:
          - "pause_origin := NONE"
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /campaigns/{campaign_id}/pause, system (account suspension), or system (eligible_ad_count falls to 0)"
        actor: Advertiser
        preconditions: []
        side_effects:
          - "pause_origin := ADVERTISER | SUSPENSION | NO_ELIGIBLE_ADS per trigger"
      - from: [DRAFT, ACTIVE, PAUSED]
        to: ENDED
        trigger: "system (lazy): logical date > end_date"
        actor: system
        preconditions: []
        side_effects:
          - "evaluated lazily on any access of the campaign and on auction eligibility checks"

  - entity: Ad
    field: status
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /ads/{ad_id}/submit-review"
        actor: Advertiser
        preconditions: []
        side_effects:
          - "review_round += 1; creates PolicyReview(round=review_round, automated_verdict per category, outcome=AUTO_APPROVED for GENERAL else NEEDS_HUMAN)"
      - from: UNDER_REVIEW
        to: ELIGIBLE
        trigger: "system (PolicyReview outcome becomes AUTO_APPROVED or HUMAN_APPROVED)"
        actor: system
        preconditions:
          - "for HUMAN_APPROVED on a restricted category: restricted_category_certified == true (ERR_RESTRICTED_CATEGORY_UNCERTIFIED otherwise)"
        side_effects:
          - "quality_score_snapshot_centi := live quality_score_centi at approval"
          - "campaign.eligible_ad_count recomputed; if campaign PAUSED with pause_origin=NO_ELIGIBLE_ADS and account ACTIVE and count now > 0: campaign -> ACTIVE (bubble-up resume)"
      - from: UNDER_REVIEW
        to: DISAPPROVED
        trigger: "system (PolicyReview outcome becomes HUMAN_VIOLATION)"
        actor: system
        preconditions: []
        side_effects:
          - "cascade link 1: campaign.eligible_ad_count recomputed"
          - "cascade link 2 (caused by link 1): if eligible_ad_count falls to 0 and campaign ACTIVE: campaign -> PAUSED with pause_origin=NO_ELIGIBLE_ADS"
      - from: [DISAPPROVED, ELIGIBLE]
        to: DRAFT
        trigger: "PUT /ads/{ad_id} changing headline or final_url"
        actor: Advertiser
        preconditions: []
        side_effects:
          - "when leaving ELIGIBLE: campaign.eligible_ad_count recomputed (no auto-pause on voluntary edit; NO_ELIGIBLE_ADS auto-pause fires only on the DISAPPROVED path)"

  - entity: PolicyReview
    field: outcome
    initial_state: PENDING_AUTO
    terminal_states: [AUTO_APPROVED, HUMAN_APPROVED, HUMAN_VIOLATION]
    transitions:
      - from: PENDING_AUTO
        to: AUTO_APPROVED
        trigger: "system: automated_verdict == CLEAN (category GENERAL), applied at creation"
        actor: system
        preconditions: []
        side_effects:
          - "Ad UNDER_REVIEW -> ELIGIBLE"
      - from: PENDING_AUTO
        to: NEEDS_HUMAN
        trigger: "system: automated_verdict == FLAGGED_RESTRICTED, applied at creation"
        actor: system
        preconditions: []
        side_effects:
          - "Ad remains UNDER_REVIEW until human decide"
      - from: NEEDS_HUMAN
        to: HUMAN_APPROVED
        trigger: "POST /policy-reviews/{review_id}/decide with outcome=HUMAN_APPROVED"
        actor: PolicyReviewer
        preconditions:
          - "restricted category ad: restricted_category_certified == true (ERR_RESTRICTED_CATEGORY_UNCERTIFIED)"
        side_effects:
          - "reviewer_note := request note; Ad UNDER_REVIEW -> ELIGIBLE"
      - from: NEEDS_HUMAN
        to: HUMAN_VIOLATION
        trigger: "POST /policy-reviews/{review_id}/decide with outcome=HUMAN_VIOLATION"
        actor: PolicyReviewer
        preconditions: []
        side_effects:
          - "reviewer_note := request note; Ad UNDER_REVIEW -> DISAPPROVED with cascade"

  - entity: Invoice
    field: status
    initial_state: ISSUED
    terminal_states: [PAID]
    transitions:
      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "POST /invoices/{invoice_id}/payments with amount_cents < remaining"
        actor: BillingAdmin
        preconditions: []
        side_effects:
          - "paid_cents += amount"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /invoices/{invoice_id}/payments with amount_cents == remaining"
        actor: BillingAdmin
        preconditions: []
        side_effects:
          - "if kind == THRESHOLD: BillingProfile.billing_threshold_cents escalates one rung (50000->150000->300000->500000, cap at 500000)"
      - from: ISSUED
        to: PAID
        trigger: "POST /invoices/{invoice_id}/payments with amount_cents == amount_cents"
        actor: BillingAdmin
        preconditions: []
        side_effects:
          - "THRESHOLD escalation as above"
      - from: [ISSUED, PARTIALLY_PAID]
        to: OVERDUE
        trigger: "system (lazy): logical date > due_date"
        actor: system
        preconditions: []
        side_effects:
          - "evaluated lazily on any access of the invoice and on payment attempts; payments still accepted while OVERDUE"
      - from: OVERDUE
        to: [PARTIALLY_PAID, PAID]
        trigger: "POST /invoices/{invoice_id}/payments"
        actor: BillingAdmin
        preconditions: []
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC)
# =============================================================================
concurrency_rules:
  - rule_id: campaign-update-stale-version
    parent_entity: Campaign
    write_endpoint: "PUT /campaigns/{campaign_id}"
    occ_field: "expected_campaign_version"
    description: |
      Updating a Campaign whose version has advanced since the client last
      observed it is rejected. Budget and end_date writes are absolute sets
      that would each legitimately succeed under product semantics, so a
      stale view of the campaign must be refused rather than applied.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: verification-supersede-stale-version
    parent_entity: AdvertiserAccount
    write_endpoint: "POST /advertiser-accounts/{account_id}/identity-verifications"
    occ_field: "expected_account_version"
    description: |
      Creating an IdentityVerification (which supersedes the account's
      previous REJECTED verification) against an AdvertiserAccount whose
      version has advanced since the client last observed it is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: quality_score
    trigger: "computed live at auction time (final variant); snapshot written on Ad approval (provisional variant)"
    algorithm: weighted_scoring
    formula: |
      quality_score_centi = 50 * quality_ectr_score + 30 * quality_relevance_score + 20 * quality_lp_score
      Range: 100..1000 (exact integer; the /100 display form is derived).
    input_set: "The single Ad's three current component scores (1..10 each)."
    precision: "integer centi-score; no rounding"
    variants:
      - name: provisional_snapshot
        when: "Advertiser-visible diagnostic on GET /ads/{ad_id}"
        difference: "quality_score_snapshot_centi is frozen at the most recent ELIGIBLE transition and does NOT move when component scores are later edited"
      - name: final_live
        when: "auction ranking and actual CPC"
        difference: "recomputed from the Ad's current component scores at auction time"

  - name: ad_rank_and_placement
    trigger: "POST /auctions"
    algorithm: weighted_scoring
    formula: |
      normalized_query = lowercase(query_text), trim, collapse whitespace.
      Keyword match (non-negative, same ad group as candidate ad):
        EXACT: normalized_text == normalized_query
        PHRASE: normalized_text is a substring of normalized_query
        BROAD: every whitespace-token of normalized_text appears among query tokens
      Negative block: a negative keyword of the same ad group whose match rule
        holds against normalized_query excludes all ads of that ad group.
      Candidate ad eligibility: AdvertiserAccount.status == ACTIVE,
        Campaign.status == ACTIVE, logical date within [start_date, end_date],
        Ad.status == ELIGIBLE, and at least one matching non-negative keyword.
      Bid for ad = max_cpc_cents of its matching keyword with the highest
        max_cpc_cents; tie -> keyword created_at ASC.
      ad_rank = bid_cents * quality_score_centi(final_live)
      Eligibility gate: ad_rank >= AD_RANK_RESERVE (20000), else excluded.
      Winner = highest ad_rank among eligible ads; tie -> Ad.created_at ASC.
      runner_up = next highest eligible ad rank (null if none).
      If no eligible ad: ERR_NO_ELIGIBLE_AD.
    input_set: "All Ads across all accounts passing the eligibility gate and keyword match for the query."
    constants:
      AD_RANK_RESERVE: 20000
    precision: "integer arithmetic; no rounding"

  - name: actual_cpc
    trigger: "POST /auctions when clicked=true, and for AuctionEvent.charged_cents while click valid"
    algorithm: threshold
    formula: |
      If runner_up_ad_rank is not null:
        raw_cents = runner_up_ad_rank / quality_score_final_centi   (rational)
        PINNED ORDER: step 1 floor to integer cents: base = floor(raw_cents)
                      step 2 add exactly 1 cent: price = base + 1
                      step 3 cap at winner bid: actual_cpc = min(winner_bid_cents, price)
      Else (no runner-up):
        actual_cpc = min(winner_bid_cents, RESERVE_CPC_CENTS)
      charged_cents = actual_cpc when clicked and click valid; 0 otherwise.
    input_set: "The winning AuctionEvent's ranks and the winner's bid."
    constants:
      RESERVE_CPC_CENTS: 5
    precision: "integer cents; floor BEFORE the +1 increment; cap applied LAST"

  - name: daily_overdelivery_limit
    trigger: "POST /auctions with clicked=true and valid click"
    algorithm: threshold
    formula: |
      day = DailySpendRecord(campaign_id = winner campaign, spend_date = occurred_date), created lazily.
      new_served = day.served_cents + charged_cents
      Allowed iff new_served <= 2 * campaign.daily_budget_cents (INCLUSIVE boundary).
      Otherwise the entire click is rejected with ERR_DAILY_OVERDELIVERY_LIMIT;
      the AuctionEvent is still recorded with clicked=false semantics (no charge).
    input_set: "Single campaign-day accumulator."
    precision: "integer cents"

  - name: monthly_spend_cap_and_credit
    trigger: "provisional variant: on Campaign read; final variant: POST /billing-profiles/{id}/close-month"
    algorithm: forward_looking
    formula: |
      PROVISIONAL (forward-looking, at read time):
        monthly_cap_provisional_cents = daily_budget_cents * 304 // 10   (integer floor, current budget only)
      FINAL (chronological, at close-month for target month M with D days):
        B_d = daily_budget_cents in effect at END of day d (a PUT takes effect for the day it executes)
        cap_final = floor( (sum over d in M of B_d) * 304 / (10 * D) )   (single final floor)
        month_served = sum of DailySpendRecord.served_cents for dates in M
        overdelivery_credit = max(0, month_served - cap_final)
      Applying the credit: Campaign.overdelivery_credit_cents += credit;
        last_closed_month_cap_cents := cap_final; last_closed_month_credit_cents := credit;
        the credit enters the MONTHLY invoice computation.
    input_set: "Final: DailySpendRecords of the campaign with spend_date in M and each day's closing budget. Provisional: current budget field only."
    constants:
      DAYS_FACTOR_NUMERATOR: 304
      DAYS_FACTOR_DENOMINATOR: 10
    precision: "integer cents; single floor at the end of the final formula"
    variants:
      - name: provisional_forward_looking
        when: "advertiser budget diagnostics on GET /campaigns/{id}"
        difference: "uses only the CURRENT daily budget for the whole month; ignores mid-month budget history"
      - name: final_chronological
        when: "close-month settlement"
        difference: "sums per-day effective budgets chronologically; diverges from provisional whenever the budget changed during the month"

  - name: billing_threshold_charge
    trigger: "after each valid click is charged (chronological order), and at close-month"
    algorithm: threshold
    formula: |
      After charging a click: BillingProfile.unbilled_cost_cents += charged_cents.
      If unbilled_cost_cents >= billing_threshold_cents (INCLUSIVE boundary):
        issue Invoice(kind=THRESHOLD, amount_cents = unbilled_cost_cents - applied_credits,
        due_date = logical date + 14 days); unbilled_cost_cents := 0.
      Ladder on full payment of a THRESHOLD invoice:
        50000 -> 150000 -> 300000 -> 500000 (terminal rung repeats).
      applied_credits at any issuance: min(pending_credit_cents, unbilled amount);
        remainder of pending_credit_cents persists.
    input_set: "BillingProfile accumulators for one account."
    constants:
      THRESHOLD_LADDER: [50000, 150000, 300000, 500000]
    precision: "integer cents"

  - name: invalid_click_credit
    trigger: "POST /auction-events/{id}/flag-invalid, and at invoice issuance"
    algorithm: chronological
    formula: |
      On flag-invalid (requires clicked=true and is_invalid_click currently false):
        is_invalid_click := true; charged_cents recomputed to 0;
        DailySpendRecord.served_cents -= c and click_count -= 1 (chronological day of the click);
        Campaign.served_lifetime_cents -= c; click_count_lifetime -= 1;
        AdvertiserAccount.lifetime_valid_served_cents -= c;
        AdvertiserAccount.lifetime_invalid_click_credit_cents += c;
        BillingProfile.unbilled_cost_cents -= c when the click was not yet invoiced.
      When the click WAS already invoiced:
        credit c is applied to the OLDEST unpaid invoice of the profile
        (created_at ASC): that invoice.amount_cents -= c and its
        invalid_click_credit_cents += c (amount never below paid_cents);
        any remainder c - applied goes to BillingProfile.pending_credit_cents.
      At every invoice issuance (THRESHOLD or MONTHLY): pending credits apply first.
    input_set: "The flagged click, its campaign-day record, and the profile's invoices ordered by created_at ASC."
    precision: "integer cents"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all except POST /advertiser-accounts" }
  - { priority: 2, category: auth, check: "Role is permitted for this endpoint per RBAC; Advertiser X-User-ID must equal the owning AdvertiserAccount.id of the addressed resource", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Every path id resolves, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all id-addressed endpoints" }
  - { priority: 4, category: existence, check: "Request body shape: required fields present, types valid, enum values legal, integer ranges (quality scores 1..10, max_cpc_cents > 0), negative keyword must not carry max_cpc_cents", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all body-bearing endpoints" }
  - { priority: 5, category: state, check: "OCC: expected_campaign_version / expected_account_version equals the parent's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "PUT /campaigns/{campaign_id}, POST /advertiser-accounts/{account_id}/identity-verifications" }
  - { priority: 6, category: state, check: "Target entity in a valid from-state for the requested transition (e.g. pause on DRAFT campaign, decide on terminal review or appeal, pay on PAID invoice)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "state transition endpoints" }
  - { priority: 7, category: business_safety, check: "Restricted category ad (ALCOHOL|GAMBLING|HEALTHCARE|FINANCIAL) requires restricted_category_certified=true at creation and at human approval", error_id: ERR_RESTRICTED_CATEGORY_UNCERTIFIED, http_status: 422, applies_to: "POST /ad-groups/{ad_group_id}/ads, POST /policy-reviews/{review_id}/decide" }
  - { priority: 8, category: business_constraint, check: "Uniqueness/conflict rules: one BillingProfile per account, one pending IdentityVerification per account, one open Appeal per account, headline unique per ad group (case-insensitive), keyword unique per (ad_group, normalized_text, match_type, is_negative), no negative keyword may block a keyword's own canonical query in the same ad group", error_id: "ERR_BILLING_PROFILE_EXISTS | ERR_DUPLICATE_VERIFICATION_PENDING | ERR_APPEAL_ALREADY_OPEN | ERR_DUPLICATE_AD_HEADLINE | ERR_DUPLICATE_KEYWORD | ERR_NEGATIVE_KEYWORD_CONFLICT", http_status: 409, applies_to: "creation endpoints" }
  - { priority: 9, category: business_temporal, check: "Time-window rules: appeal within half-open [suspended_at, suspended_at+30d); new appeal only >= last UPHELD decided_at + 14d; campaign activation only when logical date in [start_date, end_date]; close-month only for a fully past month strictly after last_closed_month", error_id: "ERR_APPEAL_WINDOW_CLOSED | ERR_APPEAL_COOLDOWN | ERR_CAMPAIGN_OUTSIDE_FLIGHT_WINDOW | ERR_MONTH_NOT_CLOSABLE", http_status: 422, applies_to: "appeals, campaign activate, close-month" }
  - { priority: 10, category: business_referential, check: "Cross-entity state references: campaign activation requires AdvertiserAccount ACTIVE; ad belongs to ad group of campaign of same account", error_id: "ERR_VERIFICATION_REQUIRED | ERR_ACCOUNT_SUSPENDED", http_status: 422, applies_to: "POST /campaigns/{campaign_id}/activate" }
  - { priority: 11, category: business_fiscal, check: "Fiscal rules: daily_budget_cents >= 100; end_date >= start_date; click does not push campaign-day served above 2x daily budget; payment amount <= invoice remaining balance and > 0", error_id: "ERR_BUDGET_BELOW_MINIMUM | ERR_CAMPAIGN_DATE_RANGE_INVALID | ERR_DAILY_OVERDELIVERY_LIMIT | ERR_OVERPAYMENT", http_status: 422, applies_to: "campaign create/update, auctions, payments" }

# =============================================================================
# 1.5 API Endpoint Table (39 endpoints)
# =============================================================================
endpoints:
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock (test-driving). Before any call, the logical clock reads exactly 2026-09-01T00:00:00Z and never falls back to wall-clock.", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["lazy re-evaluation of ENDED campaigns, OVERDUE invoices, SUSPENDED_FINAL accounts on next access"] }

  - { method: POST, path: "/advertiser-accounts", description: "Register an advertiser account", roles: [Anonymous], code: 201, input: [business_name, country_code], output: AdvertiserAccount, side_effects: ["status=PENDING_VERIFICATION, counters 0"] }
  - { method: GET, path: "/advertiser-accounts/{account_id}", description: "Get account incl. disclosure_text and lifetime counters", roles: [Advertiser, PlatformAdmin, BillingAdmin, PolicyReviewer], code: 200, input: [], output: AdvertiserAccount, side_effects: ["lazy SUSPENDED_FINAL evaluation"] }
  - { method: POST, path: "/advertiser-accounts/{account_id}/suspend", description: "Suspend an account (policy violation or circumvention)", roles: [PlatformAdmin], code: 200, input: [reason_code], output: AdvertiserAccount, side_effects: ["ACTIVE->SUSPENDED cascade: ACTIVE campaigns -> PAUSED (pause_origin=SUSPENSION)", "increments AdvertiserAccount.version"] }
  - { method: POST, path: "/advertiser-accounts/{id}/identity-verifications", description: "Submit identity verification (supersedes a REJECTED one)", roles: [Advertiser], code: 201, input: [legal_business_name, registration_number, document_type, disclosure_consent, expected_account_version], output: IdentityVerification, side_effects: ["status=SUBMITTED", "supersedes_id set when a prior REJECTED record exists", "increments AdvertiserAccount.version by 1"] }
  - { method: GET, path: "/advertiser-accounts/{id}/identity-verifications", description: "List verifications of an account", roles: [Advertiser, PlatformAdmin], code: 200, input: ["limit?", "offset?"], output: "IdentityVerification[]", side_effects: [] }
  - { method: POST, path: "/identity-verifications/{verification_id}/decide", description: "Approve or reject a verification", roles: [PlatformAdmin], code: 200, input: [outcome, "rejection_reason?"], output: IdentityVerification, side_effects: ["APPROVED: account PENDING_VERIFICATION->ACTIVE, sets verified_business_name and disclosure_text", "REJECTED: sets rejection_reason (required)"] }
  - { method: POST, path: "/advertiser-accounts/{id}/appeals", description: "File an appeal against the current suspension", roles: [Advertiser], code: 201, input: [argument_text], output: Appeal, side_effects: ["account SUSPENDED->APPEAL_PENDING", "appeal auto-intakes to UNDER_REVIEW", "increments AdvertiserAccount.version"] }
  - { method: GET, path: "/advertiser-accounts/{id}/appeals", description: "List appeals of an account", roles: [Advertiser, PlatformAdmin], code: 200, input: ["limit?", "offset?"], output: "Appeal[]", side_effects: [] }
  - { method: POST, path: "/appeals/{appeal_id}/decide", description: "Decide an appeal (UPHELD | OVERTURNED)", roles: [PlatformAdmin], code: 200, input: [outcome, "reviewer_note?"], output: Appeal, side_effects: ["OVERTURNED: account -> ACTIVE and SUSPENSION-paused campaigns auto-resume cascade", "UPHELD: account -> SUSPENDED, second upheld -> SUSPENDED_FINAL"] }

  - { method: POST, path: "/advertiser-accounts/{id}/billing-profile", description: "Create the account's single billing profile", roles: [Advertiser], code: 201, input: [payment_method_type, "currency_code?"], output: BillingProfile, side_effects: ["billing_threshold_cents=50000"] }
  - { method: GET, path: "/advertiser-accounts/{id}/billing-profile", description: "Get the account's billing profile (array of 0..1)", roles: [Advertiser, BillingAdmin], code: 200, input: [], output: "BillingProfile[]", side_effects: [] }
  - { method: GET, path: "/billing-profiles/{billing_profile_id}", description: "Get billing profile incl. threshold, unbilled, pending credit, outstanding", roles: [Advertiser, BillingAdmin], code: 200, input: [], output: BillingProfile, side_effects: [] }
  - { method: POST, path: "/billing-profiles/{billing_profile_id}/close-month", description: "Close a fully past calendar month: final caps, overdelivery credits, MONTHLY invoice", roles: [BillingAdmin], code: 200, input: [month], output: { closed_month: string, invoice_id: string, total_overdelivery_credit_cents: integer }, side_effects: ["per campaign: cap_final and overdelivery credit computed and stored", "MONTHLY invoice issued when amount > 0 (pending credits applied)", "last_closed_month := month"] }
  - { method: GET, path: "/billing-profiles/{id}/invoices", description: "List invoices of a profile", roles: [Advertiser, BillingAdmin], code: 200, input: ["limit?", "offset?"], output: "Invoice[]", side_effects: ["lazy OVERDUE evaluation"] }
  - { method: POST, path: "/invoices/{invoice_id}/payments", description: "Apply a payment to an invoice", roles: [BillingAdmin], code: 200, input: [amount_cents], output: Invoice, side_effects: ["status transitions ISSUED/OVERDUE -> PARTIALLY_PAID -> PAID", "full payment of THRESHOLD invoice escalates billing_threshold_cents one rung"] }

  - { method: POST, path: "/campaigns", description: "Create a campaign (DRAFT)", roles: [Advertiser], code: 201, input: [account_id, name, daily_budget_cents, start_date, end_date], output: Campaign, side_effects: [] }
  - { method: GET, path: "/campaigns", description: "List campaigns with filters", roles: [Advertiser, PlatformAdmin], code: 200, input: ["account_id?", "status?", "limit?", "offset?"], output: "Campaign[]", side_effects: ["lazy ENDED evaluation"] }
  - { method: GET, path: "/campaigns/{campaign_id}", description: "Get campaign incl. served/credit diagnostics and monthly_cap_provisional_cents", roles: [Advertiser, PlatformAdmin], code: 200, input: [], output: Campaign, side_effects: ["lazy ENDED evaluation"] }
  - { method: PUT, path: "/campaigns/{campaign_id}", description: "Update budget and/or end_date (OCC-guarded)", roles: [Advertiser], code: 200, input: ["daily_budget_cents?", "end_date?", expected_campaign_version], output: Campaign, side_effects: ["increments Campaign.version by 1", "budget changes take effect for the current logical day"] }
  - { method: POST, path: "/campaigns/{campaign_id}/activate", description: "Activate or resume a campaign", roles: [Advertiser], code: 200, input: [], output: Campaign, side_effects: ["DRAFT|PAUSED -> ACTIVE, pause_origin=NONE"] }
  - { method: POST, path: "/campaigns/{campaign_id}/pause", description: "Pause an ACTIVE campaign", roles: [Advertiser], code: 200, input: [], output: Campaign, side_effects: ["ACTIVE -> PAUSED, pause_origin=ADVERTISER"] }
  - { method: GET, path: "/campaigns/{id}/daily-spend-records", description: "List daily spend records of a campaign", roles: [Advertiser, PlatformAdmin], code: 200, input: ["limit?", "offset?"], output: "DailySpendRecord[]", side_effects: [] }

  - { method: POST, path: "/campaigns/{id}/ad-groups", description: "Create an ad group", roles: [Advertiser], code: 201, input: [name], output: AdGroup, side_effects: [] }
  - { method: GET, path: "/campaigns/{id}/ad-groups", description: "List ad groups of a campaign", roles: [Advertiser, PlatformAdmin], code: 200, input: ["limit?", "offset?"], output: "AdGroup[]", side_effects: [] }
  - { method: GET, path: "/ad-groups/{ad_group_id}", description: "Get an ad group", roles: [Advertiser, PlatformAdmin], code: 200, input: [], output: AdGroup, side_effects: [] }

  - { method: POST, path: "/ad-groups/{id}/ads", description: "Create an ad (DRAFT)", roles: [Advertiser], code: 201, input: [headline, final_url, category, "restricted_category_certified?", quality_ectr_score, quality_relevance_score, quality_lp_score], output: Ad, side_effects: ["quality_score_snapshot_centi=null, review_round=0"] }
  - { method: GET, path: "/ad-groups/{id}/ads", description: "List ads of an ad group", roles: [Advertiser, PolicyReviewer, PlatformAdmin], code: 200, input: ["limit?", "offset?"], output: "Ad[]", side_effects: [] }
  - { method: GET, path: "/ads/{ad_id}", description: "Get an ad incl. advertiser-visible quality_score_snapshot_centi", roles: [Advertiser, PolicyReviewer, PlatformAdmin], code: 200, input: [], output: Ad, side_effects: [] }
  - { method: PUT, path: "/ads/{ad_id}", description: "Edit ad fields; headline/final_url changes reset eligibility and require re-review; quality score edits alone do not", roles: [Advertiser], code: 200, input: ["headline?", "final_url?", "quality_ectr_score?", "quality_relevance_score?", "quality_lp_score?"], output: Ad, side_effects: ["headline/final_url change on ELIGIBLE ad: status -> DRAFT semantics via required re-review (status set UNDER_REVIEW on next submit-review; eligible_ad_count recomputed immediately)", "increments Ad.version"] }
  - { method: POST, path: "/ads/{ad_id}/submit-review", description: "Submit ad for policy review", roles: [Advertiser], code: 200, input: [], output: PolicyReview, side_effects: ["Ad -> UNDER_REVIEW, review_round += 1", "creates PolicyReview: GENERAL -> AUTO_APPROVED -> ad ELIGIBLE; restricted -> NEEDS_HUMAN"] }
  - { method: GET, path: "/ads/{id}/policy-reviews", description: "List policy reviews of an ad", roles: [Advertiser, PolicyReviewer, PlatformAdmin], code: 200, input: ["limit?", "offset?"], output: "PolicyReview[]", side_effects: [] }
  - { method: GET, path: "/ads/{id}/auction-events", description: "List auction events won by this ad", roles: [Advertiser, PlatformAdmin], code: 200, input: ["limit?", "offset?"], output: "AuctionEvent[]", side_effects: [] }
  - { method: POST, path: "/policy-reviews/{review_id}/decide", description: "Human decision on a NEEDS_HUMAN review", roles: [PolicyReviewer], code: 200, input: [outcome, "reviewer_note?"], output: PolicyReview, side_effects: ["HUMAN_APPROVED -> ad ELIGIBLE (requires certification for restricted categories)", "HUMAN_VIOLATION -> ad DISAPPROVED with eligible_ad_count/NO_ELIGIBLE_ADS cascade"] }

  - { method: POST, path: "/ad-groups/{id}/keywords", description: "Create a keyword or negative keyword", roles: [Advertiser], code: 201, input: [text, match_type, "is_negative?", "max_cpc_cents?"], output: Keyword, side_effects: ["normalized_text computed"] }
  - { method: GET, path: "/ad-groups/{id}/keywords", description: "List keywords of an ad group", roles: [Advertiser, PlatformAdmin], code: 200, input: ["is_negative?", "limit?", "offset?"], output: "Keyword[]", side_effects: [] }

  - { method: POST, path: "/auctions", description: "Simulate an auction for a query: selects winner by ad rank, records impression and optional click", roles: [PlatformAdmin], code: 201, input: [query_text, "clicked?", "is_invalid_click?"], output: AuctionEvent, side_effects: ["winner selection per ad_rank_and_placement", "clicked valid: DailySpendRecord upsert, served/charged += actual_cpc, daily overdelivery check, billing threshold check may issue THRESHOLD invoice"] }
  - { method: GET, path: "/auction-events/{auction_event_id}", description: "Get an auction event incl. ranks and charge", roles: [PlatformAdmin, Advertiser], code: 200, input: [], output: AuctionEvent, side_effects: [] }
  - { method: POST, path: "/auction-events/{auction_event_id}/flag-invalid", description: "Retroactively flag the click as invalid traffic", roles: [BillingAdmin], code: 200, input: [], output: AuctionEvent, side_effects: ["charged_cents -> 0", "DailySpendRecord and campaign counters debited", "credit applied to oldest unpaid invoice or pending_credit_cents"] }

# =============================================================================
# 1.6 Error Code Catalog (27 errors)
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for endpoint, or Advertiser acting on another account's resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not resolve (validated left-to-right)" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, bad type, illegal enum value, score outside 1..10, max_cpc_cents on a negative keyword or missing on a positive one" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent's current version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a valid from-state for the requested transition" }
  - { id: ERR_VERIFICATION_REQUIRED, http: 422, condition: "Campaign activation attempted while account is PENDING_VERIFICATION" }
  - { id: ERR_ACCOUNT_SUSPENDED, http: 422, condition: "Operation requires ACTIVE account but account is SUSPENDED, APPEAL_PENDING, or SUSPENDED_FINAL" }
  - { id: ERR_DUPLICATE_VERIFICATION_PENDING, http: 409, condition: "A SUBMITTED IdentityVerification already exists for the account (pending-window occupation)" }
  - { id: ERR_BILLING_PROFILE_EXISTS, http: 409, condition: "Account already has a BillingProfile" }
  - { id: ERR_APPEAL_ALREADY_OPEN, http: 409, condition: "An appeal in SUBMITTED or UNDER_REVIEW already exists for the account" }
  - { id: ERR_APPEAL_WINDOW_CLOSED, http: 422, condition: "Appeal filed at or after suspended_at + 30 days" }
  - { id: ERR_APPEAL_COOLDOWN, http: 422, condition: "Appeal filed before last UPHELD decision + 14 days" }
  - { id: ERR_RESTRICTED_CATEGORY_UNCERTIFIED, http: 422, condition: "Restricted-category ad without certification, at creation or human approval" }
  - { id: ERR_DUPLICATE_AD_HEADLINE, http: 409, condition: "Another ad in the same ad group has the same headline (case-insensitive)" }
  - { id: ERR_DUPLICATE_KEYWORD, http: 409, condition: "Same ad group already has a keyword with identical (normalized_text, match_type, is_negative)" }
  - { id: ERR_NEGATIVE_KEYWORD_CONFLICT, http: 409, condition: "A negative keyword would block an existing/new keyword's own canonical query in the same ad group" }
  - { id: ERR_BUDGET_BELOW_MINIMUM, http: 422, condition: "daily_budget_cents < 100" }
  - { id: ERR_CAMPAIGN_DATE_RANGE_INVALID, http: 422, condition: "end_date < start_date on create/update" }
  - { id: ERR_CAMPAIGN_OUTSIDE_FLIGHT_WINDOW, http: 422, condition: "Activation attempted when logical date is outside [start_date, end_date]" }
  - { id: ERR_DAILY_OVERDELIVERY_LIMIT, http: 422, condition: "Click would push campaign-day served above 2x daily_budget_cents" }
  - { id: ERR_NO_ELIGIBLE_AD, http: 422, condition: "No ad passes auction eligibility and reserve gates for the query" }
  - { id: ERR_OVERPAYMENT, http: 422, condition: "Payment amount exceeds invoice remaining balance or is <= 0" }
  - { id: ERR_INVOICE_NOT_PAYABLE, http: 409, condition: "Payment attempted on a PAID invoice" }
  - { id: ERR_MONTH_NOT_CLOSABLE, http: 422, condition: "close-month target is not fully past or not strictly after last_closed_month" }
  - { id: ERR_AUCTION_NOT_CLICKED, http: 409, condition: "flag-invalid attempted on an auction event with clicked=false" }
  - { id: ERR_CLICK_ALREADY_INVALID, http: 409, condition: "flag-invalid attempted on an already-invalid click" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated registration caller"
    identity: opaque
    exclusive_operations:
      - "POST /advertiser-accounts"
    shared_operations: []
  - name: Advertiser
    description: "Owns and operates one advertiser account; X-User-ID equals the AdvertiserAccount.id"
    identity: "entity_backed:AdvertiserAccount"
    exclusive_operations:
      - "POST /campaigns, PUT /campaigns/{id}, activate/pause"
      - "POST ad-groups, ads, keywords; PUT /ads/{id}; submit-review"
      - "POST identity-verifications, appeals, billing-profile"
    shared_operations:
      - "GET own account, campaigns, ads, keywords, policy-reviews, auction-events, billing-profile, invoices, daily-spend-records, appeals, identity-verifications"
  - name: PolicyReviewer
    description: "Human policy enforcement operator"
    identity: opaque
    exclusive_operations:
      - "POST /policy-reviews/{review_id}/decide"
    shared_operations:
      - "GET /ads/{id}, GET /ad-groups/{id}/ads, GET /ads/{id}/policy-reviews, GET /advertiser-accounts/{id}"
  - name: BillingAdmin
    description: "Billing operations: month close, payments, invalid-click adjustments"
    identity: opaque
    exclusive_operations:
      - "POST /billing-profiles/{id}/close-month"
      - "POST /invoices/{id}/payments"
      - "POST /auction-events/{id}/flag-invalid"
    shared_operations:
      - "GET billing-profiles, invoices, advertiser-accounts"
  - name: PlatformAdmin
    description: "Platform operator: clock, suspension, verification and appeal decisions, auction simulation"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /advertiser-accounts/{id}/suspend"
      - "POST /identity-verifications/{id}/decide"
      - "POST /appeals/{id}/decide"
      - "POST /auctions"
    shared_operations:
      - "GET endpoints across all resources"


