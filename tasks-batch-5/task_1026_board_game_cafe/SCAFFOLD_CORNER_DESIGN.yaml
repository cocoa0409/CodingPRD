              as: Manager
          trigger:
            - call: "POST /memberships/${m}/redemptions"
              payload: { points_cost: 100, reward_description: "Big reward" }
              as: Member
              as_user_id: "${m}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INSUFFICIENT_POINTS and http_status == 409"

      - name: reverse_already_reversed_redemption_returns_error
        claim_type: Violation to Error
        grounds: ["errors[ERR_REDEMPTION_ALREADY_REVERSED]", entities.Membership.fields.last_redemption_status]
        distinguishing_aspect: "Reversing a redemption whose status is already REVERSED returns ERR_REDEMPTION_ALREADY_REVERSED."
        test_recipe:
          setup: ["Member granted 300, redeemed 100, and that redemption already reversed once."]
          setup_api_calls:
            - call: "POST /memberships"
              payload: { email: "rev@x.com", full_name: "Rev" }
              as: Staff
              captures: { m: $.data.id }
            - call: "POST /memberships/${m}/loyalty-adjustments"
              payload: { points_delta: 300, reason: "grant" }
              as: Manager
            - call: "POST /memberships/${m}/redemptions"
              payload: { points_cost: 100, reward_description: "Poster" }
              as: Member
              as_user_id: "${m}"
              captures: { rid: $.data.last_redemption_id }
            - call: "POST /memberships/${m}/redemptions/${rid}/reverse"
              payload: {}
              as: Staff
          trigger:
            - call: "POST /memberships/${m}/redemptions/${rid}/reverse"
              payload: {}
              as: Staff
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_REDEMPTION_ALREADY_REVERSED and http_status == 409"

