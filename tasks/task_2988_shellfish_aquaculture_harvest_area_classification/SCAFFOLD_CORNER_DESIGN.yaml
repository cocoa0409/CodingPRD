          - errors[ERR_OUTSIDE_AUTHORIZATION_WINDOW]
          - state_machines[HarvestAuthorization.status ISSUED -> ACTIVE]
        distinguishing_aspect: |
          Activation stamps harvest_start_at from the logical clock and requires it inside the
          half-open window [window_start, window_end); one second before window_start
          (2026-08-10T05:59:59Z against a 06:00:00Z start) the transition is refused and the
          authorization stays ISSUED with the unit still DEPLOYED.
