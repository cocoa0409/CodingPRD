  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: booking_halfopen_overlap_rejected_adjacent_allowed
        grounds:
          - validations[priority=9]
          - errors[ERR_DATES_UNAVAILABLE]
          - calculations.calendar_availability
        distinguishing_aspect: "On a Property, a booking over [2026-07-04, 2026-07-06) sharing only the check-out=check-in boundary with an existing [2026-07-01, 2026-07-04) booking succeeds (half-open, adjacency allowed), while [2026-07-03, 2026-07-05) is rejected ERR_DATES_UNAVAILABLE — no-buffer half-open interval semantics."
        test_recipe:
          setup:
            - "LISTED property with one existing HOLD booking over [2026-07-01, 2026-07-04)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /owners", payload: { legal_name: "O15", email: "o15@x.com", default_management_fee_pct: 20 }, as: PlatformAdmin, captures: { o15: "$.data.id" } }
            - { call: "POST /properties", payload: { owner_id: "${o15}", address: "15 O St", city: "Austin", state_code: "TX", jurisdiction_code: "TX-ATX", base_nightly_rate_cents: 20000, cleaning_fee_cents: 15000, max_occupancy: 6 }, as: PropertyManager, captures: { p15: "$.data.id" } }
            - { call: "POST /permits", payload: { property_id: "${p15}", permit_number: "PN15", jurisdiction_code: "TX-ATX", occupancy_tax_pct: 10, issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }, as: PropertyManager, captures: { perm15: "$.data.id" } }
