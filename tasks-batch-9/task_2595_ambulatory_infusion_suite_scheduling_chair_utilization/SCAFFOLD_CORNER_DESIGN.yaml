            - "Appointment.${ap1}.schedule_status == 'TENTATIVE'"
            - "Appointment.${ap1}.readiness_status == 'PENDING' — the gate drug has no qualifying lab yet"
            - "AuthorizationRequest.${az1}.status == 'DRAFT' and submission_count == 0"
            - "DrugPreparation.${dp1}.status == 'REQUESTED' and prepared_at is null and usable_until is null"
            - "DrugLot.${lot1}.status == 'AVAILABLE' with units_available == 9 after the 1-unit commitment"
            - "No creation endpoint in §1.5 accepts a status field, so none of these five states was client-chosen"

      - name: a_discharged_appointment_refuses_cancel_check_in_and_reschedule
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines[Appointment/schedule_status].terminal_states
          - validations[priority 41]
          - errors[ERR_APPOINTMENT_TERMINAL]
        distinguishing_aspect: |
          COMPLETED is absorbing: three different post-terminal triggers (cancel,
          check-in, reschedule) all return 409 ERR_APPOINTMENT_TERMINAL rather than the
          shape-specific ERR_INVALID_SCHEDULE_STATE, priority 41 outranks priority 40,
          and the reschedule attempt is refused even though it carries a correct
          expected_appointment_version — so no replacement row and no version bump.
        test_recipe:
          setup:
