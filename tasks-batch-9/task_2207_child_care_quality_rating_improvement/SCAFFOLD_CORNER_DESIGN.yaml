            - { call: "POST /staff-credentials/${credA}/registry-link", payload: { registry_status: "VERIFIED", verified_on: "2026-07-01T00:00:00Z", expires_on: "2026-08-01T00:00:00Z", credential_level: 4 }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "POST /providers/${pid}/staff-credentials", payload: { staff_registry_id: "REG-C", role_type: "ASSISTANT", credential_level: 1, fte: 1.00, employment_status: "ACTIVE" }, as: Provider, as_user_id: "${pid}", captures: { credC: $.data.id } }
            - { call: "POST /staff-credentials/${credC}/registry-link", payload: { registry_status: "VERIFIED", verified_on: "2026-07-01T00:00:00Z", expires_on: "2030-01-01T00:00:00Z", credential_level: 1 }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "GET /providers/${pid}", payload: {}, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: StateAdministrator, as_user_id: "admin_ops_1" }
          trigger:
            - { call: "POST /qris/expiry-runs", payload: {}, as: StateAdministrator, as_user_id: "admin_ops_1" }
