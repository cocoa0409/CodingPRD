          - entities.Publication.fields.payout_balance_cents
        distinguishing_aspect: "Requesting a 2250 payout moves balance→pending; a FAILED settle compensates it back. The conserved quantity payout_balance + pending_payout + lifetime_paid_out stays == lifetime_net_cents (2250) throughout. MONEY quantity."
        test_recipe:
          setup:
            - "Publication fee_bps 1000; ACTIVE PRO subscriber with initial invoice PAID (creator_net 2250 → payout_balance 2250)"
          setup_api_calls:
            - call: "POST /publications"
              payload: { name: "Pub", platform_fee_bps: 1000 }
              as: Creator
              as_user_id: "creator_1"
              captures: { pub_id: $.data.id }
            - call: "POST /publications/${pub_id}/tiers"
              payload: { name: "Pro", tier_rank: 2, monthly_price_cents: 2500, trial_days: 0 }
              as: Creator
              as_user_id: "creator_1"
              captures: { pro_tier_id: $.data.id }
            - call: "POST /publications/${pub_id}/members"
              payload: { email: "m@x.com", display_name: "M" }
              as: Anonymous
              captures: { m_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /members/${m_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "POST /members/${m_id}/subscriptions"
              payload: { tier_id: "${pro_tier_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { sub_id: $.data.id }
            - call: "GET /invoices?subscription_id=${sub_id}"
              payload: {}
              as: PlatformAdmin
              captures: { inv0: "$.data[0].id" }
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv0}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "GET /publications/${pub_id}"
              payload: {}
              as: Creator
              as_user_id: "creator_1"
              captures: { pub_v: $.data.version }
            - call: "POST /publications/${pub_id}/payouts"
              payload: { amount_cents: 2250, expected_publication_version: "${pub_v}" }
              as: Creator
              as_user_id: "creator_1"
              captures: { payout_id: $.data.id }
          trigger:
            - call: "POST /payouts/${payout_id}/settle"
              payload: { outcome: "FAILED" }
              as: PlatformAdmin
          assert:
            - "Publication.${pub_id}.payout_balance_cents == 2250"
            - "Publication.${pub_id}.pending_payout_cents == 0"
            - "Publication.${pub_id}.lifetime_paid_out_cents == 0"
            - "Publication.${pub_id}.lifetime_net_cents == 2250"

      - name: seat_invariant_register_then_cancel_conserves_capacity
        grounds:
          - calculations.event_seat_conservation
          - state_machines.EventRegistration.REGISTERED_to_CANCELED
          - entities.Event.fields.available_slots
        distinguishing_aspect: "Register (registered_count+1, available_slots-1) then cancel (registered_count-1, available_slots+1) both preserve registered_count + available_slots == capacity (3). SEATS quantity — a distinct conserved quantity from money."
        test_recipe:
          setup:
            - "Publication; PRO tier; Event capacity 3; member ACTIVE PRO sub"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /publications"
              payload: { name: "Pub", platform_fee_bps: 1000 }
              as: Creator
