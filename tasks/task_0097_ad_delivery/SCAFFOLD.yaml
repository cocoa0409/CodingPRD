# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Advertiser
    field: status
    initial_state: PENDING
    terminal_states: [CLOSED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "system (qualification_status -> VERIFIED AND balance_cents + credit_line_cents > 0)"
        actor: system
        preconditions:
          - "qualification_status == VERIFIED"
          - "balance_cents + credit_line_cents > 0"
        side_effects:
          - "Cascade-1 link: subsequent Campaign creation becomes permitted"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /advertisers/{advertiserId}/suspend OR system (qualification_status -> REJECTED on re-verification)"
        actor: "PlatformAdmin or system"
        preconditions: []
        side_effects:
          - "All RUNNING Campaigns -> PAUSED (cascade depth 1)"
          - "Each affected Campaign cascades each RUNNING AdGroup -> PAUSED (cascade depth 2)"
          - "AuditLog action=ACCOUNT_STATUS_CHANGE created"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /advertisers/{advertiserId}/reinstate"
        actor: PlatformAdmin
        preconditions:
          - "qualification_status == VERIFIED"
        side_effects:
          - "AuditLog action=ACCOUNT_STATUS_CHANGE created"
          - "Campaigns and AdGroups remain PAUSED (operator must explicitly resume)"
      - from: [ACTIVE, SUSPENDED]
        to: CLOSED
        trigger: "POST /advertisers/{advertiserId}/close"
        actor: PlatformAdmin
        preconditions:
          - "No Campaign in {ACTIVE, RUNNING}"
        side_effects:
          - "All Campaigns -> ENDED (cascade depth 1)"
          - "All AdGroups under those Campaigns -> ARCHIVED (cascade depth 2)"
          - "All Creatives under those AdGroups -> ARCHIVED (cascade depth 3)"
          - "AuditLog action=ACCOUNT_STATUS_CHANGE created"

  - entity: Advertiser
    field: balance_state
    initial_state: HEALTHY
    terminal_states: []
    note: "Parallel dimension to status. Recomputed on every WalletTransaction SETTLED and every BillingEvent FINALIZED."
    transitions:
      - from: HEALTHY
        to: LOW_BALANCE
        trigger: "system (effective_balance <= low_balance_threshold_cents AND effective_balance > 0)"
        actor: system
        preconditions: []
        side_effects:
          - "Emit low-balance alert (recorded via AuditLog with action=BALANCE_ADJUSTMENT note=low_balance_alert)"
      - from: [HEALTHY, LOW_BALANCE]
        to: ZERO_BALANCE
        trigger: "system (effective_balance <= 0)"
        actor: system
        preconditions: []
        side_effects:
          - "All RUNNING Campaigns -> PAUSED via pause-on-zero (cascade depth 1)"
          - "Each affected Campaign cascades each RUNNING AdGroup -> PAUSED (cascade depth 2)"
      - from: [LOW_BALANCE, ZERO_BALANCE]
        to: HEALTHY
        trigger: "system (effective_balance > low_balance_threshold_cents after RECHARGE/REFUND/ADJUSTMENT)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ZERO_BALANCE
        to: LOW_BALANCE
        trigger: "system (0 < effective_balance <= low_balance_threshold_cents after RECHARGE)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Campaign
    field: status
    initial_state: DRAFT
    terminal_states: [ENDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /advertisers/{advertiserId}/campaigns/{campaignId}/activate"
        actor: CampaignManager
        preconditions:
          - "Advertiser.status == ACTIVE"
          - "At least one AdGroup with approved_creative_count >= 1 under this campaign"
        side_effects: []
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /advertisers/{advertiserId}/campaigns/{campaignId}/pause OR cascade from Advertiser SUSPEND/CLOSE OR pause-on-zero balance"
        actor: "CampaignManager or system"
        preconditions: []
        side_effects:
          - "All RUNNING AdGroups under this campaign -> PAUSED"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /advertisers/{advertiserId}/campaigns/{campaignId}/activate"
        actor: CampaignManager
        preconditions:
          - "Advertiser.status == ACTIVE"
          - "Advertiser.balance_state in {HEALTHY, LOW_BALANCE}"
        side_effects: []
      - from: [ACTIVE, PAUSED]
        to: BUDGET_EXHAUSTED
        trigger: "system (lifetime_spent_cents >= lifetime_budget_cents OR today_spent_cents >= daily_budget_cents)"
        actor: system
        preconditions: []
        side_effects:
          - "All RUNNING AdGroups under this campaign -> BUDGET_EXHAUSTED"
      - from: BUDGET_EXHAUSTED
        to: ACTIVE
        trigger: "system (clock day rollover when today_spent_cents resets AND lifetime budget not breached)"
        actor: system
        preconditions:
          - "lifetime_budget_cents IS NULL OR lifetime_spent_cents < lifetime_budget_cents"
        side_effects:
          - "AdGroups previously BUDGET_EXHAUSTED via THIS campaign auto-resume to RUNNING if their own state was BUDGET_EXHAUSTED"
      - from: [DRAFT, ACTIVE, PAUSED, BUDGET_EXHAUSTED]
        to: ENDED
        trigger: "POST /advertisers/{advertiserId}/campaigns/{campaignId}/end OR cascade from Advertiser CLOSE OR system (current_time >= end_date)"
        actor: "CampaignManager or system"
        preconditions: []
        side_effects:
          - "All AdGroups -> ARCHIVED"
          - "All Creatives under those AdGroups -> ARCHIVED"

  - entity: AdGroup
    field: status
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: READY
        trigger: "system (approved_creative_count >= 1)"
        actor: system
        preconditions: []
        side_effects: []
      - from: READY
        to: RUNNING
        trigger: "POST /advertisers/{advertiserId}/campaigns/{campaignId}/ad-groups/{adGroupId}/activate"
        actor: CampaignManager
        preconditions:
          - "Campaign.status == ACTIVE"
          - "approved_creative_count >= 1"
        side_effects: []
      - from: RUNNING
        to: PAUSED
        trigger: "POST .../ad-groups/{adGroupId}/pause OR cascade from Campaign PAUSED/SUSPEND/CLOSE OR cascade from Advertiser SUSPEND/balance ZERO"
        actor: "CampaignManager or system"
        preconditions: []
        side_effects: []
      - from: PAUSED
        to: RUNNING
        trigger: "POST .../ad-groups/{adGroupId}/activate"
        actor: CampaignManager
        preconditions:
          - "Campaign.status == ACTIVE"
          - "Advertiser.status == ACTIVE"
          - "approved_creative_count >= 1"
        side_effects: []
      - from: [READY, RUNNING]
        to: DISAPPROVED
        trigger: "system (approved_creative_count drops to 0 because all Creatives rejected/archived)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DISAPPROVED
        to: READY
        trigger: "system (approved_creative_count >= 1 again)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RUNNING
        to: BUDGET_EXHAUSTED
        trigger: "system (parent Campaign BUDGET_EXHAUSTED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: BUDGET_EXHAUSTED
        to: RUNNING
        trigger: "system (parent Campaign returns to ACTIVE after day rollover)"
        actor: system
        preconditions: []
        side_effects: []
      - from: [DRAFT, READY, RUNNING, PAUSED, DISAPPROVED, BUDGET_EXHAUSTED]
        to: ARCHIVED
        trigger: "POST .../ad-groups/{adGroupId}/archive OR cascade from Campaign ENDED"
        actor: "CampaignManager or system"
        preconditions: []
        side_effects:
          - "All non-ARCHIVED Creatives under this ad-group -> ARCHIVED"

  - entity: Creative
    field: review_status
    initial_state: PENDING_PRESCREEN
    terminal_states: [APPROVED, REJECTED, ARCHIVED]
    note: "Branching: pre-screen fork -> human review fork -> appeal cycle. APPROVED is non-terminal only via ARCHIVE."
    transitions:
      - from: PENDING_PRESCREEN
        to: PRESCREEN_FAILED
        trigger: "POST .../creatives/{creativeId}/prescreen with outcome=FAIL OR system (pre_screen_score >= 0.8)"
        actor: system
        preconditions: []
        side_effects:
          - "ReviewDecision recorded (PRESCREEN, REJECT)"
      - from: PENDING_PRESCREEN
        to: PENDING_HUMAN_REVIEW
        trigger: "system (pre_screen_score < 0.5) OR POST .../creatives/{creativeId}/prescreen with outcome=PASS"
        actor: system
        preconditions: []
        side_effects:
          - "ReviewDecision recorded (PRESCREEN, APPROVE)"
      - from: PENDING_PRESCREEN
        to: PENDING_HUMAN_REVIEW
        trigger: "system (0.5 <= pre_screen_score < 0.8)"
        actor: system
        preconditions: []
        side_effects:
          - "ReviewDecision recorded (PRESCREEN, APPROVE) with notes='borderline'"
        note: "Borderline scores always escalate to human review."
      - from: PENDING_HUMAN_REVIEW
        to: APPROVED
        trigger: "POST .../creatives/{creativeId}/human-review with outcome=APPROVE"
        actor: CreativeReviewer
        preconditions:
          - "X-User-ID != Creative.advertiser_id's owner user ids (segregation_of_duties)"
        side_effects:
          - "ReviewDecision recorded"
          - "Parent AdGroup.approved_creative_count increments"
          - "AuditLog action=REVIEW_DECISION created"
      - from: PENDING_HUMAN_REVIEW
        to: REJECTED
        trigger: "POST .../creatives/{creativeId}/human-review with outcome=REJECT"
        actor: CreativeReviewer
        preconditions:
          - "rejection_codes non-empty"
        side_effects:
          - "ReviewDecision recorded with rejection_codes"
          - "AuditLog action=REVIEW_DECISION created"
      - from: [PRESCREEN_FAILED, REJECTED]
        to: APPEAL_FILED
        trigger: "POST .../creatives/{creativeId}/appeal"
        actor: CampaignManager
        preconditions:
          - "appeal_count == 0"
        side_effects: []
      - from: APPEAL_FILED
        to: UNDER_APPEAL_REVIEW
        trigger: "POST .../creatives/{creativeId}/appeal/start-review"
        actor: CreativeReviewer
        preconditions: []
        side_effects: []
      - from: UNDER_APPEAL_REVIEW
        to: APPROVED
        trigger: "POST .../creatives/{creativeId}/appeal/decide with outcome=APPROVE"
        actor: CreativeReviewer
        preconditions:
          - "X-User-ID != original rejection reviewer_user_id (segregation_of_duties: original rejecter cannot overturn)"
        side_effects:
          - "ReviewDecision recorded (APPEAL_DECISION, APPROVE)"
          - "Parent AdGroup.approved_creative_count increments"
          - "AuditLog action=REVIEW_DECISION created"
      - from: UNDER_APPEAL_REVIEW
        to: REJECTED
        trigger: "POST .../creatives/{creativeId}/appeal/decide with outcome=REJECT"
        actor: CreativeReviewer
        preconditions: []
        side_effects:
          - "ReviewDecision recorded (APPEAL_DECISION, REJECT)"
          - "AuditLog action=REVIEW_DECISION created"
      - from: APPROVED
        to: REJECTED
        trigger: "system (Advertiser.qualification_status -> REJECTED on re-verification)"
        actor: system
        preconditions: []
        side_effects:
          - "Parent AdGroup.approved_creative_count decrements"
      - from: [PENDING_PRESCREEN, PRESCREEN_FAILED, PENDING_HUMAN_REVIEW, APPROVED, REJECTED, APPEAL_FILED, UNDER_APPEAL_REVIEW]
        to: ARCHIVED
        trigger: "POST .../creatives/{creativeId}/archive OR cascade from AdGroup ARCHIVED"
        actor: "CampaignManager or system"
        preconditions: []
        side_effects:
          - "If previously APPROVED, parent AdGroup.approved_creative_count decrements"
          - "archived_at set"

  - entity: BillingEvent
    field: status
    initial_state: PENDING_IVT
    terminal_states: [FINALIZED, REVERSED, INVALID_TRAFFIC, DEDUPLICATED]
    transitions:
      - from: PENDING_IVT
        to: DEDUPLICATED
        trigger: "system (existing BillingEvent has same (event_type, auction_event_id, dedup_key))"
        actor: system
        preconditions: []
        side_effects: []
        note: "DEDUPLICATED is set instead of inserting a second row; the duplicate request returns 409 with reference to original."
      - from: PENDING_IVT
        to: INVALID_TRAFFIC
        trigger: "system (ivt_score > 0.7 at ingest)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING_IVT
        to: VALID
        trigger: "system (ivt_score <= 0.7 at ingest)"
        actor: system
        preconditions: []
        side_effects: []
      - from: VALID
        to: FINALIZED
        trigger: "system (immediately on transition to VALID — billing aggregation)"
        actor: system
        preconditions: []
        side_effects:
          - "WalletTransaction CONSUMPTION created with amount = -cost_cents"
          - "Advertiser.balance_cents decreases by cost_cents"
          - "Advertiser.consumed_cents increases by cost_cents"
          - "Campaign.lifetime_spent_cents and Campaign.today_spent_cents increase"
          - "Budget exhaustion checks re-evaluated"
          - "Advertiser.balance_state recomputed"
      - from: FINALIZED
        to: REVERSED
        trigger: "POST /billing-events/{eventId}/reverse (late-IVT classification)"
        actor: AntiFraudService
        preconditions:
          - "reversal_reason non-empty"
        side_effects:
          - "WalletTransaction REFUND created with amount = +cost_cents"
          - "Advertiser.balance_cents increases by cost_cents (invariant: net delta of FINALIZED+REVERSED pair == 0)"
          - "Advertiser.consumed_cents decreases by cost_cents"
          - "Campaign lifetime/today spend decrease"
          - "Budget posture re-evaluated"

  - entity: WalletTransaction
    field: status
    initial_state: PENDING
    terminal_states: [SETTLED, FAILED, REVERSED]
    transitions:
      - from: PENDING
        to: SETTLED
        trigger: "POST /advertisers/{advertiserId}/wallet/transactions/{txId}/settle (payment confirmed) OR system (auto-settle for CONSUMPTION & REFUND)"
        actor: "FinanceOfficer or system"
        preconditions: []
        side_effects:
          - "Advertiser.balance_cents adjusted by amount_cents"
          - "balance_state recomputed"
      - from: PENDING
        to: FAILED
        trigger: "POST /advertisers/{advertiserId}/wallet/transactions/{txId}/fail"
        actor: FinanceOfficer
        preconditions: []
        side_effects: []
      - from: SETTLED
        to: REVERSED
        trigger: "POST /advertisers/{advertiserId}/wallet/transactions/{txId}/reverse"
        actor: FinanceOfficer
        preconditions:
          - "Reversal would not breach credit floor (balance_cents - amount_cents >= -credit_line_cents)"
        side_effects:
          - "Advertiser.balance_cents adjusted by -amount_cents (invariant: forward + reverse pair leaves balance_cents unchanged)"
          - "balance_state recomputed"
          - "AuditLog action=BALANCE_ADJUSTMENT created"

  - entity: ConversionEvent
    field: attribution_status
    initial_state: PENDING
    terminal_states: [ATTRIBUTED, UNATTRIBUTED]
    transitions:
      - from: PENDING
        to: ATTRIBUTED
        trigger: "POST /conversions/{conversionId}/attribute OR system (auto-run on ingest)"
        actor: system
        preconditions:
          - "At least one eligible BillingEvent (status=FINALIZED, event_type IN {CLICK, IMPRESSION}) within attribution_window_days for user_id and advertiser_id"
        side_effects:
          - "attributed_touchpoints populated per attribution_model"
      - from: PENDING
        to: UNATTRIBUTED
        trigger: "system (no eligible touchpoint in window)"
        actor: system
        preconditions: []
        side_effects: []

# §1.2.1 Concurrency Rules
concurrency_rules:
  - scenario: "Two reviewers approve the same Creative in PENDING_HUMAN_REVIEW simultaneously"
    guarantee: "At most one approval is recorded; second reviewer rejected"
    error_id: ERR_REVIEW_ALREADY_DECIDED
    http_status: 409
    serialization: "First-writer-wins on review_status transition; loser sees current status != PENDING_HUMAN_REVIEW"

  - scenario: "Approve and archive happen simultaneously on a Creative in PENDING_HUMAN_REVIEW"
    guarantee: "Exactly one wins; loser gets ERR_INVALID_CREATIVE_STATE"
    error_id: ERR_INVALID_CREATIVE_STATE
    http_status: 409
    serialization: "First-writer-wins on review_status"

  - scenario: "Two simultaneous BillingEvent ingests with identical (event_type, auction_event_id, dedup_key)"
    guarantee: "Exactly one is persisted; duplicate returns dedup error"
    error_id: ERR_DUPLICATE_BILLING_EVENT
    http_status: 409
    serialization: "Unique constraint on (event_type, auction_event_id, dedup_key); first-writer-wins"

  - scenario: "Two recharges with the same idempotency_key on the same Advertiser"
    guarantee: "Second returns 409 with reference to existing transaction; balance is only credited once"
    error_id: ERR_IDEMPOTENCY_CONFLICT
    http_status: 409
    serialization: "Unique constraint on (advertiser_id, tx_type, idempotency_key)"

  - scenario: "Refund issued while balance reaches zero through concurrent CONSUMPTION"
    guarantee: "Exactly one ordering wins; if the refund would push balance below -credit_line, refund is rejected"
    error_id: ERR_REFUND_WOULD_BREACH_CREDIT_FLOOR
    http_status: 409
    serialization: "Serialize WalletTransaction.amount_cents application against current balance_cents"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: auction_ranking_score
    trigger: "POST /auctions on each candidate ad-group prior to pricing"
    algorithm: weighted_scoring
    formula: |
      For each candidate AdGroup g with effective_bid_cents:
        effective_bid_cents = g.bid_cents                                # for CPC/CPA/oCPX
        effective_bid_cents = g.bid_cents / 1000                         # for CPM (per-impression bid)
        ranking_score(g) = effective_bid_cents * g.quality_score * g.predicted_ctr
      Sort candidates by ranking_score descending.
      Tie-break: lower g.created_seq wins (older campaign first).
    constants:
      MIN_QUALITY_SCORE: 1.0
      MAX_QUALITY_SCORE: 10.0
    precision: "IEEE-754 double; integer cents for billing"

  - name: auction_clearing_price_gsp
    trigger: "Auction with pricing_rule=GSP"
    algorithm: pricing_engine
    formula: |
      Let W = highest-ranked eligible candidate (winner).
      Let R = second-highest eligible candidate (runner-up); null if no runner-up.
      If R is null:
        clearing_unit_price_cents = floor_price_cents
      Else:
        clearing_unit_price_cents = ceil( (R.ranking_score / (W.quality_score * W.predicted_ctr)) + 1 )
        clearing_unit_price_cents = max(clearing_unit_price_cents, floor_price_cents)
        clearing_unit_price_cents = min(clearing_unit_price_cents, W.effective_bid_cents)
      If EXTERNAL_RTB:
        clearing_unit_price_cents = floor(clearing_unit_price_cents * SHADING_FACTOR)
        AuctionEvent.bid_shaded = True
    constants:
      SHADING_FACTOR: 0.92
    precision: "Integer cents; ceiling on the bid-just-to-beat computation, floor on shading; ordering FIXED: GSP raw -> floor enforcement -> shading."

  - name: auction_clearing_price_vcg
    trigger: "Auction with pricing_rule=VCG"
    algorithm: pricing_engine
    formula: |
      For winner W in single-slot auction:
        externality = R.ranking_score / (W.quality_score * W.predicted_ctr)    # R = runner-up
        If R is null:
          clearing_unit_price_cents = floor_price_cents
        Else:
          clearing_unit_price_cents = max(ceil(externality), floor_price_cents)
          clearing_unit_price_cents = min(clearing_unit_price_cents, W.effective_bid_cents)
      No bid-shading on VCG.
    precision: "Integer cents."
    variants:
      - name: gsp
        when: "AuctionEvent.pricing_rule == GSP"
        difference: "Uses runner-up_ranking_score / winner's quality-CTR, then +1 cent; subject to shading on EXTERNAL_RTB."
      - name: vcg
        when: "AuctionEvent.pricing_rule == VCG"
        difference: "Uses raw externality (no +1 cent floor adjustment), never shaded. Same inputs can produce different clearing prices: e.g. winner_score=80, runner_up_score=60, winner_q*ctr=10 -> GSP = ceil(60/10)+1 = 7; VCG = ceil(60/10) = 6."

  - name: billing_event_cost
    trigger: "BillingEvent ingest after dedup + IVT passes"
    algorithm: tiered_pricing
    formula: |
      Let A = AuctionEvent referenced; let G = AdGroup; let P = clearing_unit_price_cents from A.
      Bill basis depends on G.bidding_strategy AND event_type:
        CPC: charge on event_type=CLICK   -> gross_cost_cents = P
        CPM: charge on event_type=IMPRESSION -> gross_cost_cents = P (P already per-impression after auction step)
        CPA: charge on event_type=CONVERSION -> gross_cost_cents = P
        OCPX: charge on event_type=CLICK if optimized for clicks; charge on event_type=CONVERSION if optimized for conversions (advertiser config field bidding_strategy=OCPX uses event_type to disambiguate at ingest)
      If event_type does not match the configured billable event for the strategy:
        gross_cost_cents = 0  (still logged but free; status -> FINALIZED with cost 0)
      tax_cents = floor(gross_cost_cents * advertiser.tax_rate_bps / 10000)
      cost_cents = gross_cost_cents + tax_cents
      ROUNDING ORDER (FIXED): compute tax on gross, then add. Do NOT apply tax to a running total.
    precision: "Integer cents, floor truncation for tax; rounding order PINNED above."

  - name: attribution_credit_distribution
    trigger: "ConversionEvent attribute"
    algorithm: weighted_scoring
    formula: |
      Window: include FINALIZED BillingEvents with event_type IN {CLICK, IMPRESSION}, status=FINALIZED,
              and created_at within [conversion.created_at - attribution_window_days*86400, conversion.created_at]
              for the same user_id (after identity stitching) and same advertiser_id.
      View-through eligibility: IMPRESSION events get credit only when no CLICK exists in window.
      If no eligible touchpoints: attribution_status = UNATTRIBUTED, attributed_touchpoints = [].
      Sort eligible touchpoints by created_at ascending; tie-break by BillingEvent.id ascending.
      LAST_CLICK: 100% credit to the most-recent CLICK if any exists; else 100% to most-recent IMPRESSION.
      POSITION_BASED: 40% to first touchpoint, 40% to last touchpoint, 20% distributed equally across middle touchpoints.
                      If only one touchpoint: 100%. If two: 50%/50%.
      DATA_DRIVEN: credit_i = floor( (1 / (N - i + 1)) / sum_j(1 / (N - j + 1)) * 10000 ) / 10000
                   where i is 1-based position from earliest, N is total touchpoint count.
                   Remainder cents from rounding go to the LAST touchpoint.
      ROUNDING ORDER (FIXED): allocate fractions first to 4 decimal places, then assign integer cents on conversion.value_cents,
                              with any rounding remainder credited to the LAST touchpoint.
    constants:
      POSITION_FIRST: 0.40
      POSITION_LAST: 0.40
      POSITION_MIDDLE_TOTAL: 0.20
    precision: "Fractions to 4 decimal places; final credit amounts in integer cents; PINNED rounding order above."
    variants:
      - name: last_click
        when: "attribution_model == LAST_CLICK"
        difference: "100% credit to the most-recent CLICK in window (or impression if no click), regardless of earlier touchpoints."
      - name: position_based
        when: "attribution_model == POSITION_BASED"
        difference: "40/40/20 split — same set of touchpoints yields different per-event credit than LAST_CLICK."
      - name: data_driven
        when: "attribution_model == DATA_DRIVEN"
        difference: "Inverse-recency weighting; produces a third distinct credit distribution from the same inputs."

  - name: campaign_budget_consumption
    trigger: "BillingEvent -> FINALIZED OR REVERSED"
    algorithm: aggregation
    formula: |
      Source: BillingEvent rows for this campaign with status=FINALIZED. REVERSED rows subtract their original cost_cents.
      Campaign.lifetime_spent_cents = SUM(cost_cents) over BillingEvents with campaign_id=this AND status=FINALIZED
      Campaign.today_spent_cents = SUM(cost_cents) over BillingEvents with campaign_id=this AND status=FINALIZED
                                   AND finalized_at >= start_of_current_utc_day
      Day boundary: a UTC day rollover (via /_clock/advance crossing midnight UTC) resets today_spent_cents (recomputed from BillingEvent timestamps).
      Aggregate selection precision (PINNED):
        (a) source = BillingEvent with status=FINALIZED
        (b) lifetime window = (-inf, now]; today window = [floor_to_utc_day(now), now] inclusive-start exclusive-end at next UTC midnight
        (c) tie-break = none (sums are commutative)
    precision: "Integer cents. Recomputed deterministically on every FINALIZED/REVERSED transition."

  - name: effective_balance
    trigger: "BillingEvent FINALIZED/REVERSED, WalletTransaction SETTLED/REVERSED"
    algorithm: aggregation
    formula: |
      effective_balance_cents = SUM(WalletTransaction.amount_cents WHERE status=SETTLED)
      Note: amount_cents is signed (RECHARGE/REFUND +, CONSUMPTION/ADJUSTMENT-when-debit -).
      Advertiser.balance_cents = effective_balance_cents
      Advertiser.consumed_cents = -SUM(amount_cents WHERE tx_type=CONSUMPTION AND status=SETTLED)
                               +  SUM(amount_cents WHERE tx_type=REFUND AND reference_event_id IS NOT NULL AND status=SETTLED) is excluded; consumed is gross.
      Decision threshold:
        balance_state = ZERO_BALANCE  if balance_cents <= 0
                     = LOW_BALANCE   if 0 < balance_cents <= low_balance_threshold_cents
                     = HEALTHY       otherwise
      Aggregate selection precision (PINNED):
        (a) source = WalletTransaction with status=SETTLED
        (b) window = (-inf, now]
        (c) tie-break = none
    precision: "Integer cents."

  - name: advertiser_risk_score
    trigger: "BillingEvent INVALID_TRAFFIC, BillingEvent REVERSED, Creative REJECTED, ReviewDecision REJECT"
    algorithm: weighted_scoring
    formula: |
      Window: last 30 days from now (UTC).
      invalid_traffic_rate = count(BillingEvent for advertiser_id with status IN {INVALID_TRAFFIC, REVERSED} in window)
                           / max(1, count(BillingEvent for advertiser_id in window))
      reject_rate = count(Creative for advertiser_id with review_status=REJECTED in window)
                  / max(1, count(Creative for advertiser_id created in window))
      raw = invalid_traffic_rate * 0.6 + reject_rate * 0.4
      risk_score = min(100, round(raw * 100))
      Aggregate selection precision (PINNED):
        (a) source A = BillingEvent rows with created_at in [now-30d, now]
            source B = Creative rows with created_at in [now-30d, now]
        (b) window = [now - 30*86400, now]
        (c) tie-break = none
      This is a different domain (Advertiser risk reputation) from the cost-accounting calc; both run on the same advertiser
      but answer different questions and use disjoint formulas.
    constants:
      INVALID_WEIGHT: 0.6
      REJECT_WEIGHT: 0.4
      MAX_SCORE: 100
    precision: "Integer 0-100; round_half_up."
    variants:
      - name: chronic
        when: "default — computes over 30-day rolling window"
        difference: "Rolling 30d gives a smoother, lagging signal."
      - name: acute
        when: "POST /advertisers/{advertiserId}/risk-score?mode=acute"
        difference: "Same formula but window = last 24h; same inputs over the same accounts produce different risk_score values from chronic."

  - name: frequency_cap_check
    trigger: "Auction candidate filter"
    algorithm: threshold
    formula: |
      For candidate AdGroup g and current AuctionEvent.user_id u:
        impressions_today = count(BillingEvent where ad_group_id = g.id AND event_type=IMPRESSION
                                  AND status IN {VALID, FINALIZED} AND auction.user_id = u
                                  AND finalized_at >= start_of_current_utc_day)
      If g.frequency_cap_per_user_per_day is not null AND impressions_today >= g.frequency_cap_per_user_per_day:
        g is filtered out; AuctionEvent.filtered_ad_group_ids appends g.id.
      Boundary semantics PINNED: '>=' triggers exclusion; impressions_today == cap excludes; impressions_today == cap-1 allows one more.
    precision: "Integer count; '>=' inclusive."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present"
    error_id: ERR_MISSING_USER_CONTEXT
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role must be a recognised role and authorised for this operation"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Resource ids in path must exist (advertiser, campaign, ad-group, creative resolved left-to-right)"
    error_id: "ERR_ADVERTISER_NOT_FOUND / ERR_CAMPAIGN_NOT_FOUND / ERR_AD_GROUP_NOT_FOUND / ERR_CREATIVE_NOT_FOUND"
    http_status: 404
    applies_to: all nested endpoints

  - priority: 4
    category: state
    check: "Advertiser.status must permit the operation (e.g., SUSPENDED/CLOSED blocks campaign mutation)"
    error_id: "ERR_ADVERTISER_SUSPENDED / ERR_ADVERTISER_CLOSED / ERR_ADVERTISER_NOT_ACTIVE"
    http_status: 409
    applies_to: campaign, ad-group, creative, wallet endpoints

  - priority: 5
    category: state
    check: "Resource own state must permit operation (e.g., creative review-status, billing-event status, campaign status)"
    error_id: "ERR_INVALID_CAMPAIGN_STATE / ERR_INVALID_AD_GROUP_STATE / ERR_INVALID_CREATIVE_STATE / ERR_INVALID_BILLING_EVENT_STATE"
    http_status: 409
    applies_to: state-transition endpoints

  - priority: 6
    category: business_safety
    check: "Industry compliance: MEDICAL/FINANCIAL/EDUCATION industry requires Advertiser.qualification_status == VERIFIED before any Creative may be submitted"
    error_id: ERR_QUALIFICATION_REQUIRED
    http_status: 422
    applies_to: creative submission

  - priority: 7
    category: business_safety
    check: "Industry compliance: required_disclaimer must be present and non-empty for industry_category IN {MEDICAL, FINANCIAL, EDUCATION}"
    error_id: ERR_DISCLAIMER_REQUIRED
    http_status: 422
    applies_to: creative submission, creative human-review approval

  - priority: 8
    category: business_safety
    check: "Segregation of duties: reviewer_user_id (X-User-ID) on human-review or appeal MUST NOT equal any AccountUser.external_user_id of the creative's owning advertiser"
    error_id: ERR_SEGREGATION_OF_DUTIES_VIOLATION
    http_status: 403
    applies_to: creative human-review, appeal decisions

  - priority: 9
    category: business_safety
    check: "Appeal segregation: appeal decider MUST NOT equal the original rejection's reviewer_user_id"
    error_id: ERR_APPEAL_SAME_REVIEWER
    http_status: 403
    applies_to: appeal decision

  - priority: 10
    category: business_referential
    check: "AdGroup targeting must reference existing audience id if remarketing_audience_id is set"
    error_id: ERR_AUDIENCE_NOT_FOUND
    http_status: 422
    applies_to: ad-group create/update

  - priority: 11
    category: business_constraint
    check: "Frequency cap: if frequency_cap_per_user_per_day set, value must be >= 1"
    error_id: ERR_INVALID_FREQUENCY_CAP
    http_status: 400
    applies_to: ad-group create/update

  - priority: 12
    category: business_constraint
    check: "Auction request must include at least one candidate_ad_group_id"
    error_id: ERR_EMPTY_AUCTION_POOL
    http_status: 400
    applies_to: POST /auctions

  - priority: 13
    category: business_constraint
    check: "BillingEvent dedup: (event_type, auction_event_id, dedup_key) must be unique"
    error_id: ERR_DUPLICATE_BILLING_EVENT
    http_status: 409
    applies_to: POST /billing-events

  - priority: 14
    category: business_temporal
    check: "Conversion event window: attribution_window_days must be in [1, 90]; conversion.created_at must be within window of at least one finalized billing event for credit; otherwise UNATTRIBUTED (not an error, just a status)"
    error_id: ERR_INVALID_ATTRIBUTION_WINDOW
    http_status: 400
    applies_to: POST /conversions and POST /conversions/{id}/attribute

  - priority: 15
    category: business_temporal
    check: "Campaign start_date must be <= end_date when end_date is non-null"
    error_id: ERR_INVALID_CAMPAIGN_DATES
    http_status: 400
    applies_to: campaign create/update

  - priority: 16
    category: business_fiscal
    check: "Budget: daily_budget_cents must be >= 100 and lifetime_budget_cents (if set) >= daily_budget_cents"
    error_id: ERR_INVALID_BUDGET
    http_status: 422
    applies_to: campaign create/update

  - priority: 17
    category: business_fiscal
    check: "Credit-line: POSTPAY required for credit_line_cents > 0; PREPAY accounts MUST have credit_line_cents = 0"
    error_id: ERR_INVALID_CREDIT_LINE
    http_status: 422
    applies_to: advertiser create/update

  - priority: 18
    category: business_fiscal
    check: "WalletTransaction refund/reversal must not push balance below -credit_line_cents"
    error_id: ERR_REFUND_WOULD_BREACH_CREDIT_FLOOR
    http_status: 409
    applies_to: wallet refund, wallet transaction reverse

  - priority: 19
    category: business_fiscal
    check: "Adjustment WalletTransaction with negative amount requires balance_cents + amount_cents >= -credit_line_cents"
    error_id: ERR_INSUFFICIENT_BALANCE
    http_status: 402
    applies_to: wallet adjustment

  - priority: 20
    category: business_fiscal
    check: "Campaign activate: Advertiser.balance_state must NOT be ZERO_BALANCE"
    error_id: ERR_ZERO_BALANCE
    http_status: 402
    applies_to: campaign activate, ad-group activate

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- System / Test Harness ---
  - method: POST
    path: "/_clock/advance"
    description: "Advance the deterministic test clock by N seconds; rolls over UTC days when crossing midnight"
    roles: [PlatformAdmin]
    code: 200
    input: [seconds]
    output: object
    side_effects: ["Triggers Campaign BUDGET_EXHAUSTED -> ACTIVE day-rollover transition where applicable; recomputes today_spent_cents"]

  # --- Advertisers ---
  - method: POST
    path: "/advertisers"
    description: "Create advertiser (MCC, sub-account, or independent)"
    roles: [PlatformAdmin]
    code: 201
    input: [account_type, legal_name, business_license_number, industry_category, billing_mode, "parent_account_id?", "credit_line_cents?", "low_balance_threshold_cents?", "tax_rate_bps?"]
    output: Advertiser
    side_effects: ["status=PENDING; qualification_status=UNVERIFIED"]

  - method: GET
    path: "/advertisers"
    description: "List advertisers"
    roles: [PlatformAdmin]
    code: 200
    input: ["account_type?", "parent_account_id?", "status?"]
    output: "Advertiser[]"
    side_effects: []

  - method: GET
    path: "/advertisers/{advertiserId}"
    description: "Get advertiser"
    roles: [PlatformAdmin, AccountOwner, CampaignManager, FinanceOfficer, CreativeReviewer]
    code: 200
    input: []
    output: Advertiser
    side_effects: []

  - method: PUT
    path: "/advertisers/{advertiserId}"
    description: "Update advertiser settings (credit line, low balance threshold, tax rate)"
    roles: [PlatformAdmin]
    code: 200
    input: ["credit_line_cents?", "low_balance_threshold_cents?", "tax_rate_bps?"]
    output: Advertiser
    side_effects: ["Validates credit-line vs billing_mode; AuditLog action=CREDIT_LINE_CHANGE if credit_line_cents changed"]

  - method: POST
    path: "/advertisers/{advertiserId}/suspend"
    description: "Suspend advertiser"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Advertiser
    side_effects: ["status -> SUSPENDED; cascade-pauses RUNNING Campaigns and their AdGroups; AuditLog created"]

  - method: POST
    path: "/advertisers/{advertiserId}/reinstate"
    description: "Reinstate suspended advertiser"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Advertiser
    side_effects: ["status -> ACTIVE; AuditLog created"]

  - method: POST
    path: "/advertisers/{advertiserId}/close"
    description: "Close advertiser permanently"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Advertiser
    side_effects: ["status -> CLOSED; cascades Campaigns -> ENDED -> AdGroups -> ARCHIVED -> Creatives -> ARCHIVED (depth 3)"]

  # --- Qualification ---
  - method: POST
    path: "/advertisers/{advertiserId}/qualifications"
    description: "Upload qualification document"
    roles: [AccountOwner, PlatformAdmin]
    code: 201
    input: [doc_type, doc_url, expiry_date]
    output: QualificationDoc
    side_effects: ["review_status=PENDING; Advertiser.qualification_status -> UNDER_REVIEW"]

  - method: POST
    path: "/advertisers/{advertiserId}/qualifications/{docId}/review"
    description: "Reviewer decides qualification document"
    roles: [PlatformAdmin]
    code: 200
    input: [outcome, "rejection_reason?"]
    output: QualificationDoc
    side_effects: ["review_status -> APPROVED or REJECTED; Advertiser.qualification_status recomputed; if all required APPROVED -> VERIFIED; if any REJECTED -> REJECTED; cascade: if REJECTED and was VERIFIED, all APPROVED Creatives -> REJECTED"]

  # --- Account Users ---
  - method: POST
    path: "/advertisers/{advertiserId}/users"
    description: "Add user with role to advertiser account"
    roles: [PlatformAdmin, AccountOwner]
    code: 201
    input: [external_user_id, account_role]
    output: AccountUser
    side_effects: []

  - method: GET
    path: "/advertisers/{advertiserId}/users"
    description: "List account users"
    roles: [PlatformAdmin, AccountOwner, CampaignManager, FinanceOfficer]
    code: 200
    input: []
    output: "AccountUser[]"
    side_effects: []

  - method: PATCH
    path: "/advertisers/{advertiserId}/users/{userId}"
    description: "Change role or disable user"
    roles: [PlatformAdmin, AccountOwner]
    code: 200
    input: ["account_role?", "status?"]
    output: AccountUser
    side_effects: []

  # --- Campaigns ---
  - method: POST
    path: "/advertisers/{advertiserId}/campaigns"
    description: "Create campaign"
    roles: [CampaignManager, AccountOwner]
    code: 201
    input: [name, daily_budget_cents, pacing_strategy, start_date, "lifetime_budget_cents?", "end_date?"]
    output: Campaign
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/advertisers/{advertiserId}/campaigns"
    description: "List campaigns"
    roles: [PlatformAdmin, AccountOwner, CampaignManager, FinanceOfficer]
    code: 200
    input: ["status?"]
    output: "Campaign[]"
    side_effects: []

  - method: PUT
    path: "/advertisers/{advertiserId}/campaigns/{campaignId}"
    description: "Update campaign"
    roles: [CampaignManager, AccountOwner]
    code: 200
    input: ["name?", "daily_budget_cents?", "lifetime_budget_cents?", "pacing_strategy?", "end_date?"]
    output: Campaign
    side_effects: ["Re-validates budget; if new daily_budget < today_spent -> BUDGET_EXHAUSTED"]

  - method: POST
    path: "/advertisers/{advertiserId}/campaigns/{campaignId}/activate"
    description: "Activate campaign (DRAFT -> ACTIVE or PAUSED -> ACTIVE)"
    roles: [CampaignManager, AccountOwner]
    code: 200
    input: []
    output: Campaign
    side_effects: ["status -> ACTIVE"]

  - method: POST
    path: "/advertisers/{advertiserId}/campaigns/{campaignId}/pause"
    description: "Pause campaign"
    roles: [CampaignManager, AccountOwner]
    code: 200
    input: []
    output: Campaign
    side_effects: ["status -> PAUSED; cascade-pauses RUNNING AdGroups"]

  - method: POST
    path: "/advertisers/{advertiserId}/campaigns/{campaignId}/end"
    description: "End campaign permanently"
    roles: [CampaignManager, AccountOwner]
    code: 200
    input: []
    output: Campaign
    side_effects: ["status -> ENDED; AdGroups -> ARCHIVED; Creatives -> ARCHIVED"]

  # --- Ad Groups ---
  - method: POST
    path: "/advertisers/{advertiserId}/campaigns/{campaignId}/ad-groups"
    description: "Create ad-group"
    roles: [CampaignManager, AccountOwner]
    code: 201
    input: [name, bidding_strategy, bid_cents, targeting_geo, "targeting_demographic?", "targeting_interest?", "targeting_behavior?", "targeting_device?", "targeting_dayparts?", "remarketing_audience_id?", "frequency_cap_per_user_per_day?"]
    output: AdGroup
    side_effects: ["status=DRAFT; quality_score initialised to 5.0; predicted_ctr initialised to 0.02"]

  - method: GET
    path: "/advertisers/{advertiserId}/campaigns/{campaignId}/ad-groups"
    description: "List ad-groups in campaign"
    roles: [PlatformAdmin, AccountOwner, CampaignManager]
    code: 200
    input: ["status?"]
    output: "AdGroup[]"
    side_effects: []

  - method: PUT
    path: "/advertisers/{advertiserId}/campaigns/{campaignId}/ad-groups/{adGroupId}"
    description: "Update ad-group"
    roles: [CampaignManager, AccountOwner]
    code: 200
    input: ["name?", "bid_cents?", "targeting_*?", "frequency_cap_per_user_per_day?", "quality_score?", "predicted_ctr?"]
    output: AdGroup
    side_effects: []

  - method: POST
    path: "/advertisers/{advertiserId}/campaigns/{campaignId}/ad-groups/{adGroupId}/activate"
    description: "Activate ad-group (READY/PAUSED -> RUNNING)"
    roles: [CampaignManager, AccountOwner]
    code: 200
    input: []
    output: AdGroup
    side_effects: ["status -> RUNNING"]

  - method: POST
    path: "/advertisers/{advertiserId}/campaigns/{campaignId}/ad-groups/{adGroupId}/pause"
    description: "Pause ad-group"
    roles: [CampaignManager, AccountOwner]
    code: 200
    input: []
    output: AdGroup
    side_effects: ["status -> PAUSED"]

  - method: POST
    path: "/advertisers/{advertiserId}/campaigns/{campaignId}/ad-groups/{adGroupId}/archive"
    description: "Archive ad-group"
    roles: [CampaignManager, AccountOwner]
    code: 200
    input: []
    output: AdGroup
    side_effects: ["status -> ARCHIVED; cascade archives Creatives"]

  # --- Creatives ---
  - method: POST
    path: "/advertisers/{advertiserId}/campaigns/{campaignId}/ad-groups/{adGroupId}/creatives"
    description: "Upload creative asset"
    roles: [CampaignManager, AccountOwner]
    code: 201
    input: [format, asset_url, headline, body_text, landing_url, "required_disclaimer?", "parent_version_id?"]
    output: Creative
    side_effects: ["review_status=PENDING_PRESCREEN; if parent_version_id provided, version_number = parent.version_number + 1"]

  - method: GET
    path: "/advertisers/{advertiserId}/campaigns/{campaignId}/ad-groups/{adGroupId}/creatives"
    description: "List creatives"
    roles: [PlatformAdmin, AccountOwner, CampaignManager, CreativeReviewer]
    code: 200
    input: ["review_status?"]
    output: "Creative[]"
    side_effects: []

  - method: POST
    path: "/creatives/{creativeId}/prescreen"
    description: "System pre-screen pipeline records pre_screen_score and transitions creative"
    roles: [PlatformAdmin]
    code: 200
    input: [pre_screen_score, "outcome?"]
    output: Creative
    side_effects: ["status -> PRESCREEN_FAILED if score >= 0.8 else PENDING_HUMAN_REVIEW"]

  - method: POST
    path: "/creatives/{creativeId}/human-review"
    description: "Human reviewer decision"
    roles: [CreativeReviewer]
    code: 200
    input: [outcome, "rejection_codes?", "notes?"]
    output: Creative
    side_effects: ["status -> APPROVED or REJECTED; AdGroup.approved_creative_count adjusted; AuditLog REVIEW_DECISION; cascade evaluates AdGroup status"]

  - method: POST
    path: "/creatives/{creativeId}/appeal"
    description: "Advertiser files appeal on rejected creative"
    roles: [CampaignManager, AccountOwner]
    code: 200
    input: ["notes?"]
    output: Creative
    side_effects: ["status -> APPEAL_FILED; appeal_count -> 1"]

  - method: POST
    path: "/creatives/{creativeId}/appeal/start-review"
    description: "Reviewer accepts appeal for review"
    roles: [CreativeReviewer]
    code: 200
    input: []
    output: Creative
    side_effects: ["status -> UNDER_APPEAL_REVIEW"]

  - method: POST
    path: "/creatives/{creativeId}/appeal/decide"
    description: "Reviewer decides appeal"
    roles: [CreativeReviewer]
    code: 200
    input: [outcome, "rejection_codes?", "notes?"]
    output: Creative
    side_effects: ["status -> APPROVED or REJECTED; AdGroup.approved_creative_count adjusted; AuditLog REVIEW_DECISION"]

  - method: POST
    path: "/creatives/{creativeId}/archive"
    description: "Archive creative"
    roles: [CampaignManager, AccountOwner]
    code: 200
    input: []
    output: Creative
    side_effects: ["status -> ARCHIVED; archived_at set; AdGroup.approved_creative_count adjusted if was APPROVED; cascade evaluates AdGroup status"]

  - method: GET
    path: "/creatives/{creativeId}/review-decisions"
    description: "List review decisions for a creative (audit trail)"
    roles: [PlatformAdmin, AccountOwner, CreativeReviewer]
    code: 200
    input: []
    output: "ReviewDecision[]"
    side_effects: []

  # --- Auctions ---
  - method: POST
    path: "/auctions"
    description: "Run an auction over a set of candidate ad-groups for a single impression opportunity"
    roles: [ExchangeService, PlatformAdmin]
    code: 201
    input: [exchange, pricing_rule, floor_price_cents, user_id, device, geo, candidate_ad_group_ids]
    output: AuctionEvent
    side_effects: ["Runs frequency-cap, brand-safety, budget filters; computes ranking_score; selects winner; applies GSP or VCG pricing; applies shading if EXTERNAL_RTB+GSP"]

  - method: GET
    path: "/auctions/{auctionId}"
    description: "Get auction event"
    roles: [PlatformAdmin, ExchangeService]
    code: 200
    input: []
    output: AuctionEvent
    side_effects: []

  # --- Billing Events ---
  - method: POST
    path: "/billing-events"
    description: "Ingest impression / click / conversion event for billing"
    roles: [ExchangeService, MeasurementPartner]
    code: 201
    input: [event_type, auction_event_id, ad_group_id, dedup_key, ivt_score]
    output: BillingEvent
    side_effects: ["Dedup check; IVT check; if VALID -> FINALIZED -> creates WalletTransaction CONSUMPTION; budget aggregation; balance_state recompute"]

  - method: POST
    path: "/billing-events/{eventId}/reverse"
    description: "Reverse a finalised billing event (late IVT)"
    roles: [AntiFraudService, PlatformAdmin]
    code: 200
    input: [reversal_reason]
    output: BillingEvent
    side_effects: ["status -> REVERSED; WalletTransaction REFUND created; balance and budget recomputed (invariant: forward+reverse leaves balance_cents unchanged)"]

  - method: GET
    path: "/billing-events"
    description: "List billing events"
    roles: [PlatformAdmin, AccountOwner, FinanceOfficer]
    code: 200
    input: ["advertiser_id?", "campaign_id?", "status?", "from?", "to?"]
    output: "BillingEvent[]"
    side_effects: []

  # --- Conversions / Attribution ---
  - method: POST
    path: "/conversions"
    description: "Ingest a conversion event"
    roles: [MeasurementPartner, ExchangeService]
    code: 201
    input: [source, user_id, advertiser_id, conversion_type, "value_cents?", "attribution_window_days?", "attribution_model?"]
    output: ConversionEvent
    side_effects: ["attribution_status=PENDING"]

  - method: POST
    path: "/conversions/{conversionId}/attribute"
    description: "Run attribution algorithm"
    roles: [MeasurementPartner, PlatformAdmin]
    code: 200
    input: []
    output: ConversionEvent
    side_effects: ["attribution_status -> ATTRIBUTED or UNATTRIBUTED; attributed_touchpoints populated"]

  - method: GET
    path: "/advertisers/{advertiserId}/reports/attribution"
    description: "Attribution report aggregated by campaign and model"
    roles: [PlatformAdmin, AccountOwner, CampaignManager]
    code: 200
    input: ["from?", "to?", "attribution_model?"]
    output: object
    side_effects: []

  # --- Wallet ---
  - method: POST
    path: "/advertisers/{advertiserId}/wallet/transactions"
    description: "Create wallet transaction (recharge, refund, adjustment, invoice settlement)"
    roles: [FinanceOfficer, PlatformAdmin]
    code: 201
    input: [tx_type, amount_cents, idempotency_key, "reference_event_id?", "note?"]
    output: WalletTransaction
    side_effects: ["For RECHARGE/REFUND auto-settles; for ADJUSTMENT auto-settles; balance and balance_state recomputed; AuditLog action=BALANCE_ADJUSTMENT for ADJUSTMENT/REFUND"]

  - method: GET
    path: "/advertisers/{advertiserId}/wallet/transactions"
    description: "List wallet transactions"
    roles: [PlatformAdmin, AccountOwner, FinanceOfficer]
    code: 200
    input: ["tx_type?", "status?"]
    output: "WalletTransaction[]"
    side_effects: []

  - method: POST
    path: "/advertisers/{advertiserId}/wallet/transactions/{txId}/reverse"
    description: "Reverse a settled wallet transaction (compensating action)"
    roles: [FinanceOfficer, PlatformAdmin]
    code: 200
    input: [note]
    output: WalletTransaction
    side_effects: ["status -> REVERSED; balance and balance_state recomputed (invariant: forward+reverse leaves balance unchanged); AuditLog created"]

  - method: GET
    path: "/advertisers/{advertiserId}/wallet/statement"
    description: "Issue consumption statement for a date range"
    roles: [PlatformAdmin, AccountOwner, FinanceOfficer]
    code: 200
    input: ["from?", "to?"]
    output: object
    side_effects: []

  # --- Risk / Audit / Reporting ---
  - method: GET
    path: "/advertisers/{advertiserId}/risk-score"
    description: "Get advertiser risk score (chronic by default; ?mode=acute for 24h window)"
    roles: [PlatformAdmin, AntiFraudService]
    code: 200
    input: ["mode?"]
    output: object
    side_effects: []

  - method: GET
    path: "/audit-logs"
    description: "List audit-log entries"
    roles: [PlatformAdmin]
    code: 200
    input: ["actor_user_id?", "action?", "target_entity_type?", "target_entity_id?", "from?", "to?"]
    output: "AuditLog[]"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # Authentication / authorization
  - { id: ERR_MISSING_USER_CONTEXT, http: 401, condition: "X-User-ID or X-User-Role header missing" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not authorised for the endpoint" }
  - { id: ERR_SEGREGATION_OF_DUTIES_VIOLATION, http: 403, condition: "Reviewer is an account user of the creative's owning advertiser" }
  - { id: ERR_APPEAL_SAME_REVIEWER, http: 403, condition: "Appeal decider equals the original rejection reviewer" }

  # Validation
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required fields, wrong types" }
  - { id: ERR_INVALID_FREQUENCY_CAP, http: 400, condition: "frequency_cap_per_user_per_day < 1" }
  - { id: ERR_EMPTY_AUCTION_POOL, http: 400, condition: "candidate_ad_group_ids empty" }
  - { id: ERR_INVALID_ATTRIBUTION_WINDOW, http: 400, condition: "attribution_window_days outside [1, 90]" }
  - { id: ERR_INVALID_CAMPAIGN_DATES, http: 400, condition: "start_date > end_date" }

  # Existence
  - { id: ERR_ADVERTISER_NOT_FOUND, http: 404, condition: "Advertiser id does not resolve" }
  - { id: ERR_CAMPAIGN_NOT_FOUND, http: 404, condition: "Campaign id does not resolve under advertiser" }
  - { id: ERR_AD_GROUP_NOT_FOUND, http: 404, condition: "AdGroup id does not resolve under campaign" }
  - { id: ERR_CREATIVE_NOT_FOUND, http: 404, condition: "Creative id does not resolve" }
  - { id: ERR_QUALIFICATION_DOC_NOT_FOUND, http: 404, condition: "Qualification doc not found under advertiser" }
  - { id: ERR_BILLING_EVENT_NOT_FOUND, http: 404, condition: "BillingEvent id not found" }
  - { id: ERR_CONVERSION_NOT_FOUND, http: 404, condition: "ConversionEvent id not found" }
  - { id: ERR_WALLET_TX_NOT_FOUND, http: 404, condition: "WalletTransaction id not found" }
  - { id: ERR_AUDIENCE_NOT_FOUND, http: 422, condition: "remarketing_audience_id references unknown audience" }

  # State
  - { id: ERR_ADVERTISER_SUSPENDED, http: 409, condition: "Advertiser is SUSPENDED" }
  - { id: ERR_ADVERTISER_CLOSED, http: 409, condition: "Advertiser is CLOSED" }
  - { id: ERR_ADVERTISER_NOT_ACTIVE, http: 409, condition: "Advertiser must be ACTIVE for this operation" }
  - { id: ERR_INVALID_CAMPAIGN_STATE, http: 409, condition: "Campaign not in a permitted state for this operation" }
  - { id: ERR_INVALID_AD_GROUP_STATE, http: 409, condition: "AdGroup not in a permitted state for this operation" }
  - { id: ERR_INVALID_CREATIVE_STATE, http: 409, condition: "Creative not in a permitted state for this operation" }
  - { id: ERR_REVIEW_ALREADY_DECIDED, http: 409, condition: "Creative is no longer in PENDING_HUMAN_REVIEW (another reviewer decided first)" }
  - { id: ERR_APPEAL_ALREADY_FILED, http: 409, condition: "Creative.appeal_count is already 1" }
  - { id: ERR_INVALID_BILLING_EVENT_STATE, http: 409, condition: "BillingEvent not in a state that permits the operation" }
  - { id: ERR_DUPLICATE_BILLING_EVENT, http: 409, condition: "Existing BillingEvent with same (event_type, auction_event_id, dedup_key)" }
  - { id: ERR_QUALIFICATION_REQUIRED, http: 422, condition: "Industry requires qualification_status=VERIFIED before creative submission" }
  - { id: ERR_DISCLAIMER_REQUIRED, http: 422, condition: "Industry creative missing required_disclaimer" }

  # Fiscal
  - { id: ERR_INVALID_BUDGET, http: 422, condition: "daily_budget_cents < 100 or lifetime_budget_cents < daily_budget_cents" }
  - { id: ERR_INVALID_CREDIT_LINE, http: 422, condition: "credit_line_cents incompatible with billing_mode" }
  - { id: ERR_ZERO_BALANCE, http: 402, condition: "balance_state is ZERO_BALANCE; campaign/ad-group cannot activate" }
  - { id: ERR_INSUFFICIENT_BALANCE, http: 402, condition: "Adjustment would push balance below -credit_line_cents" }
  - { id: ERR_REFUND_WOULD_BREACH_CREDIT_FLOOR, http: 409, condition: "Reversal would push balance below -credit_line_cents" }
  - { id: ERR_IDEMPOTENCY_CONFLICT, http: 409, condition: "WalletTransaction with same (advertiser_id, tx_type, idempotency_key) exists" }
  - { id: ERR_CANNOT_CLOSE_WITH_ACTIVE_CAMPAIGNS, http: 409, condition: "Advertiser cannot be CLOSED while a campaign is ACTIVE" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator; manages advertisers, qualification reviews, suspensions, audit logs"
    identity: opaque
    exclusive_operations:
      - "POST /advertisers — Create advertiser"
      - "PUT /advertisers/{id} — Update advertiser settings"
      - "POST /advertisers/{id}/suspend"
      - "POST /advertisers/{id}/reinstate"
      - "POST /advertisers/{id}/close"
      - "POST /advertisers/{id}/qualifications/{docId}/review"
      - "POST /creatives/{id}/prescreen"
      - "GET /audit-logs"
      - "POST /_clock/advance"
    shared_operations:
      - "GET /advertisers"
      - "GET /advertisers/{id}"
      - "GET /billing-events"
      - "GET /advertisers/{id}/wallet/*"
      - "GET /advertisers/{id}/risk-score"
      - "GET /advertisers/{id}/reports/attribution"

  - name: AccountOwner
    description: "Top user of an advertiser account; can manage users, campaigns, creatives, view finance"
    identity: "entity_backed:AccountUser"
    exclusive_operations:
      - "POST /advertisers/{id}/users"
      - "PATCH /advertisers/{id}/users/{userId}"
    shared_operations:
      - "POST /advertisers/{id}/qualifications"
      - "POST /advertisers/{id}/campaigns (with CampaignManager)"
      - "PUT/POST campaign and ad-group state changes (with CampaignManager)"
      - "POST creatives and appeals (with CampaignManager)"
      - "GET /advertisers/{id}/wallet/* (with FinanceOfficer)"

  - name: CampaignManager
    description: "Day-to-day campaign operations within an advertiser; no finance"
    identity: "entity_backed:AccountUser"
    exclusive_operations: []
    shared_operations:
      - "POST /advertisers/{id}/campaigns"
      - "PUT  /advertisers/{id}/campaigns/{campaignId}"
      - "POST /advertisers/{id}/campaigns/{campaignId}/activate|pause|end"
      - "POST /advertisers/{id}/campaigns/{campaignId}/ad-groups"
      - "PUT /advertisers/{id}/campaigns/{campaignId}/ad-groups/{adGroupId}"
      - "POST /advertisers/{id}/campaigns/{campaignId}/ad-groups/{adGroupId}/activate|pause|archive"
      - "POST /advertisers/{id}/campaigns/{campaignId}/ad-groups/{adGroupId}/creatives"
      - "POST /creatives/{id}/appeal"
      - "POST /creatives/{id}/archive"

  - name: FinanceOfficer
    description: "Manages wallet transactions; cannot edit campaigns/creatives — segregation of duties from CampaignManager"
    identity: "entity_backed:AccountUser"
    exclusive_operations:
      - "POST /advertisers/{id}/wallet/transactions"
      - "POST /advertisers/{id}/wallet/transactions/{txId}/reverse"
    shared_operations:
      - "GET /advertisers/{id}/wallet/transactions"
      - "GET /advertisers/{id}/wallet/statement"
      - "GET /billing-events"

  - name: CreativeReviewer
    description: "Independent reviewer; not affiliated with any advertiser. Segregation enforced: cannot review own advertiser, cannot decide own appeal."
    identity: opaque
    exclusive_operations:
      - "POST /creatives/{id}/human-review"
      - "POST /creatives/{id}/appeal/start-review"
      - "POST /creatives/{id}/appeal/decide"
      - "GET  /creatives/{id}/review-decisions"
    shared_operations: []

  - name: ExchangeService
    description: "External ad-exchange / internal inventory broker that submits auctions and billing events"
    identity: opaque
    exclusive_operations:
      - "POST /auctions"
    shared_operations:
      - "POST /billing-events"
      - "POST /conversions"
      - "GET  /auctions/{id}"

  - name: MeasurementPartner
    description: "MMP / third-party measurement partner; ingests conversions and (some) billing events"
    identity: opaque
    exclusive_operations:
      - "POST /conversions/{id}/attribute"
    shared_operations:
      - "POST /billing-events"
      - "POST /conversions"

  - name: AntiFraudService
    description: "Anti-fraud system that reverses billing events on late-IVT classification"
    identity: opaque
    exclusive_operations:
      - "POST /billing-events/{id}/reverse"
    shared_operations:
      - "GET /advertisers/{id}/risk-score"
