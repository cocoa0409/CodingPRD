            - "Outage.${o_id}.scope_locked_at == \"2026-08-20T06:00:00Z\" — the logical clock at request time, not the earlier create instant"
            - "${o_v_after} == ${o_v_before} + 1"
            - "Outage.${o_id}.approved_scope_cost_usd == 1000.00, scope_contingency_usd == 80.00 and total_scope_cost_usd == 1080.00 — the tier-1 rate 0.08 on a base below 5000000"
            - "WorkOrder.${wo_id}.status is still APPROVED — only SCOPED work orders are auto-deferred"

      - name: lock_scope_enforces_its_two_preconditions_in_declared_order
        claim_type: precondition_enforcement
        grounds: ["state_machines.Outage.transitions[PLANNING->SCOPE_LOCKED].preconditions", "errors[ERR_WORK_ORDER_STATE_INVALID]", "errors[ERR_CORE_LOAD_PATTERN_NOT_APPROVED]"]
        distinguishing_aspect: "Both lock-scope preconditions are violated and then satisfied one at a time in the order §1.2 declares them: with no APPROVED work order the answer is ERR_WORK_ORDER_STATE_INVALID even though the core load pattern is also unapproved; only once a work order is APPROVED does the pattern error surface."
