  # ===========================================================================
  # Rule 6 — boundary / precision checks on four distinct metrics + endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: effluent_ratio_exactly_one_and_flow_exactly_at_limit_stay_watch
        grounds:
          - calculations.effluent_rolling_compliance
          - calculations.effluent_rolling_compliance.variants.ratio_exactly_one
          - state_machines.EffluentPermit.compliance_posture
          - entities.EffluentPermit.fields.rolling_bod_kg_per_day
          - entities.EffluentPermit.fields.exceedance_day_count
        distinguishing_aspect: |
          Metric: the two ratio comparisons inside effluent_rolling_compliance, probed on
          POST /effluent-permits/{id}/readings. A bod_ratio of exactly 1.00 and a flow_m3 of
          exactly 5000.00 against a 5000.00 limit must both stay on the compliant side of their
          strict > tests (posture WATCH, exceedance_day_count 0), while a flow of 5000.01 does
          count, so the permit only tips to EXCEEDANCE once the inclusive
          EXCEEDANCE_DAY_TRIGGER of 2 is reached — a one-centimetre-cubed change in flow flips
          the mill from WATCH to EXCEEDANCE.
        test_recipe:
          setup:
            - "EffluentPermit MILL-NPDES-01 with bod_limit_kg_per_day 100.00, tss_limit_kg_per_day 200.00, flow_limit_m3_per_day 5000.00, rolling_window_days 7 and no readings, so it starts COMPLIANT."
            - "Readings are dated 2026-07-28 through 2026-07-31, all inside the 7-day inclusive window anchored on the newest date, so n equals the number of rows present."
          setup_api_calls:
            - { call: "POST /effluent-permits", payload: { permit_number: "MILL-NPDES-01", bod_limit_kg_per_day: 100.00, tss_limit_kg_per_day: 200.00, flow_limit_m3_per_day: 5000.00, rolling_window_days: 7 }, as: EnvironmentalOfficer, as_user_id: "eo_log", captures: { permit_id: "$.data.id" } }
            - { call: "POST /effluent-permits/${permit_id}/readings", payload: { reading_date: "2026-07-28", flow_m3: 4000.00, bod_kg: 90.00, tss_kg: 100.00 }, as: EnvironmentalOfficer, as_user_id: "eo_log" }
            - { call: "POST /effluent-permits/${permit_id}/readings", payload: { reading_date: "2026-07-29", flow_m3: 5000.00, bod_kg: 110.00, tss_kg: 120.00 }, as: EnvironmentalOfficer, as_user_id: "eo_log" }
            - { call: "POST /effluent-permits/${permit_id}/readings", payload: { reading_date: "2026-07-30", flow_m3: 5000.01, bod_kg: 90.00, tss_kg: 100.00 }, as: EnvironmentalOfficer, as_user_id: "eo_log" }
          trigger:
            - { call: "POST /effluent-permits/${permit_id}/readings", payload: { reading_date: "2026-07-31", flow_m3: 5000.01, bod_kg: 90.00, tss_kg: 100.00 }, as: EnvironmentalOfficer, as_user_id: "eo_log" }
          assert:
            - "after reading 2 (the exact-boundary state): EffluentPermit.${permit_id}.rolling_bod_kg_per_day == 100.000 AND rolling_tss_kg_per_day == 110.000 AND exceedance_day_count == 0 AND compliance_posture == WATCH"
            - "after reading 2 the posture is NOT EXCEEDANCE even though bod_ratio is exactly 1.00 and flow_m3 exactly equals flow_limit_m3_per_day"
            - "after reading 3: EffluentPermit.${permit_id}.rolling_bod_kg_per_day == 96.667 AND exceedance_day_count == 1 AND compliance_posture == WATCH"
            - "after the trigger: EffluentPermit.${permit_id}.rolling_bod_kg_per_day == 95.000 AND rolling_tss_kg_per_day == 105.000"
            - "after the trigger: EffluentPermit.${permit_id}.exceedance_day_count == 2 AND compliance_posture == EXCEEDANCE"
            - "the final posture is EXCEEDANCE purely on the day-count trigger, since bod_ratio 0.95 and tss_ratio 0.525 are both below 1.00"

      - name: purchase_order_closes_at_exactly_ninety_eight_percent_received
        grounds:
          - state_machines.FiberPurchaseOrder.PARTIALLY_RECEIVED_to_CLOSED
          - state_machines.FiberPurchaseOrder.CONFIRMED_to_PARTIALLY_RECEIVED
          - calculations.receipt_net_tons
          - entities.FiberPurchaseOrder.fields.received_net_tons
        distinguishing_aspect: |
          Metric: the received_net_tons versus contracted_tons * 0.98 close threshold, probed on
          POST /fiber-purchase-orders/{id}/receipts. On a 100.00-ton order the threshold is
          exactly 98.00; the first truck lands one cent short at 97.99 and must leave the order
          PARTIALLY_RECEIVED, and a second truck weighing net 0.01 tons takes the total to
          exactly 98.00, which CLOSES the order because the boundary is inclusive — an
          exclusive comparison leaves the order open forever on this fixture.
        test_recipe:
          setup:
            - "FiberGrade MIX_54 (max_contamination 6.00, max_moisture 14.00) declared."
            - "Supplier Riverbend with a CONFIRMED 100.00-ton MIX_54 purchase order, so the close threshold is exactly 98.00."
            - "Both trucks are weighed at moisture 10.00 and contamination 5.00, comfortably inside MIX_54, so both dispositions are ACCEPT and neither takes a strike."
          setup_api_calls:
            - { call: "POST /fiber-grades", payload: { grade_code: "MIX_54", index_symbol: "PPI_OCC", max_contamination_pct: 6.00, max_moisture_pct: 14.00, nominal_yield_pct: 78.00, deink_required: false, rank_order: 5 }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /market-index-quotes", payload: { index_symbol: "PPI_OCC", effective_month: "2026-07", published_price_per_ton: 190.00 }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /suppliers", payload: { name: "Riverbend Fiber", freight_per_ton: 22.00 }, as: FiberBuyer, as_user_id: "fb_1", captures: { sup_id: "$.data.id" } }
            - { call: "POST /fiber-purchase-orders", payload: { supplier_id: "${sup_id}", fiber_grade_code: "MIX_54", contracted_tons: 100.00, index_basis: "PRIOR_MONTH", priced_for_month: "2026-08", negotiated_delta_per_ton: 0.00 }, as: FiberBuyer, as_user_id: "fb_1", captures: { po_id: "$.data.id", po_v1: "$.data.version" } }
            - { call: "POST /fiber-purchase-orders/${po_id}/price", payload: { expected_purchase_order_version: "${po_v1}" }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /fiber-purchase-orders/${po_id}/confirm", payload: {}, as: Supplier, as_user_id: "${sup_id}" }
            - { call: "POST /fiber-purchase-orders/${po_id}/receipts", payload: { truck_reference: "TRK-B-001", sublots: [ { sublot_no: 1, gross_tons: 59.990, tare_tons: 2.000, moisture_pct: 10.00, contamination_pct: 5.00 }, { sublot_no: 2, gross_tons: 42.000, tare_tons: 2.000, moisture_pct: 10.00, contamination_pct: 5.00 } ] }, as: QualityLab, as_user_id: "ql_sample", captures: { rcpt_1: "$.data.id" } }
            - { call: "POST /fiber-receipts/${rcpt_1}/disposition", payload: { disposition: "ACCEPT" }, as: QualityLab, as_user_id: "ql_dispo" }
            - { call: "POST /fiber-purchase-orders/${po_id}/receipts", payload: { truck_reference: "TRK-B-002", sublots: [ { sublot_no: 1, gross_tons: 1.010, tare_tons: 1.000, moisture_pct: 10.00, contamination_pct: 5.00 } ] }, as: QualityLab, as_user_id: "ql_sample", captures: { rcpt_2: "$.data.id" } }
          trigger:
            - { call: "POST /fiber-receipts/${rcpt_2}/disposition", payload: { disposition: "ACCEPT" }, as: QualityLab, as_user_id: "ql_dispo" }
          assert:
            - "FiberReceipt.${rcpt_1}.net_tons == 97.99 AND FiberReceipt.${rcpt_2}.net_tons == 0.01"
            - "after the first disposition: FiberPurchaseOrder.${po_id}.received_net_tons == 97.99 AND status == PARTIALLY_RECEIVED"
            - "FiberPurchaseOrder.${po_id}.received_net_tons == 98.00"
            - "FiberPurchaseOrder.${po_id}.status == CLOSED"
            - "FiberPurchaseOrder.${po_id}.status != PARTIALLY_RECEIVED"
            - "GET /fiber-inventory-lots?grade_code=MIX_54 returns total_count == 2"

      - name: exact_lot_depletion_is_inclusive_at_pulper_charge
        grounds:
          - state_machines.PulpBatch.QUEUED_to_PULPING
          - validations.priority_66
          - errors.ERR_INSUFFICIENT_FIBER
          - calculations.pulp_yield_provisional
          - entities.FiberInventoryLot.fields.tons_available
        distinguishing_aspect: |
          Metric: the FiberInventoryLot.tons_available >= tons_charged furnish test, probed on
          POST /pulp-batches/{id}/start. Against a lot holding exactly 36.000 tons a charge of
          36.001 must raise ERR_INSUFFICIENT_FIBER while a charge of exactly 36.000 succeeds and
          drives the lot to DEPLETED with tons_available 0.000 — the pass/fail edge is one
          thousandth of a ton wide, and the successful branch also proves the DEPLETED flip
          keys on the recomputed availability reaching exactly zero rather than going negative.
        test_recipe:
          setup:
            - "FiberGrades MIX_54 and OCC_11 (max_contamination 3.00, nominal_yield 88.00) and PaperGradeSpec TL_140 declared."
            - "Supplier Riverbend with a CONFIRMED 200.00-ton OCC_11 order and one ACCEPTED two-sublot receipt whose net_tons is 36.00 and weighted_contamination_pct is 2.73, minting a single AVAILABLE lot of exactly 36.000 tons."
            - "Two QUEUED PulpBatches are created against that one lot: batch OVER charges 36.001 tons and batch EXACT charges 36.000 tons. Creation performs no availability test, so both exist before either is started."
