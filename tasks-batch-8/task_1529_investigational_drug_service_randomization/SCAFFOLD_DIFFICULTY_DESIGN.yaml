            - { call: "POST /api/studies/${study}/transition", payload: { to: "ACTIVE" }, as: SponsorAdmin }
            - { call: "POST /api/sites", payload: { study_id: "${study}", site_number: "S1", name: "Site One", principal_investigator: "Dr A" }, as: SponsorAdmin, captures: { site: $.data.id } }
            - { call: "POST /api/sites/${site}/transition", payload: { to: "ACTIVE" }, as: SponsorAdmin }
            - { call: "POST /api/staff", payload: { site_id: "${site}", full_name: "Pharm One", license_number: "L-CAS-1" }, as: SponsorAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/lots", payload: { study_id: "${study}", lot_number: "LOT-CAS-1", product_name: "DrugX", strength_mg: 50, dosage_form: "VIAL", expiry_date: "2027-06-01T00:00:00Z", storage_temp_min_celsius: 2, storage_temp_max_celsius: 8, stability_budget_minutes: 600 }, as: SponsorAdmin, captures: { lot: $.data.id } }
            - { call: "POST /api/shipments", payload: { lot_id: "${lot}", site_id: "${site}", kit_numbers: ["K-D1", "K-D2"], units_per_kit: 10 }, as: SponsorAdmin, captures: { k1: "$.data[0].id", k2: "$.data[1].id" } }
            - { call: "POST /api/kits/${k1}/receive", payload: { storage_temp_celsius: 5 }, as: Pharmacist, as_user_id: "${p1}" }
            - { call: "POST /api/kits/${k1}/release", as: Pharmacist, as_user_id: "${p1}" }
            - { call: "POST /api/kits/${k2}/receive", payload: { storage_temp_celsius: 5 }, as: Pharmacist, as_user_id: "${p1}" }
            - { call: "POST /api/kits/${k2}/release", as: Pharmacist, as_user_id: "${p1}" }
            - { call: "POST /api/temperature-logs", payload: { site_id: "${site}", celsius: 9.0, source: "DATALOGGER" }, as: Pharmacist, as_user_id: "${p1}", captures: { exc: $.data.excursion_id } }
