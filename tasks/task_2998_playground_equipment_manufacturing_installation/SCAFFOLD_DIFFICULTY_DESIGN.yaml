            - "DesignProject.${p1_id}.design_status == DESIGN_APPROVED and compliance_status == NOT_ASSESSED after the rejected certification (no partial write)"

      - name: job_start_blocked_when_installer_suspended
        grounds:
          - validations[priority=44]
          - errors.ERR_INSTALLER_NOT_ACTIVE
          - state_machines.CertifiedInstaller.ACTIVE_to_SUSPENDED
          - state_machines.CertifiedInstaller.SUSPENDED_to_ACTIVE
          - state_machines.InstallationJob.SCHEDULED_to_IN_PROGRESS
