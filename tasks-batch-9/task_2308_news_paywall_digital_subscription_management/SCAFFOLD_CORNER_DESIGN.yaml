            - call: "POST /paywall/invoices/${inv_tn}/payment-attempts"
              payload: { outcome: "SUCCEEDED", amount_cents: 500 }
              as: SubscriptionOpsAgent
              captures: { err_tn: "$.data.error_id" }
          assert:
            - "the response status is 422 and error_id == ERR_PAYMENT_AMOUNT_MISMATCH"
            - "PaymentAttempt rows on Invoice.${inv_tn} == 0"
            - "Invoice.${inv_tn}.status == OPEN"
            - "Subscription.${sub_tn}.lifecycle_status == PENDING_ACTIVATION"
            - "Reader.${rd_tn}.entitlement_source == NONE"

      - name: clock_moving_backwards_rejected
        claim_type: Violation to Error
        grounds:
          - validations[priority=58]
          - errors[ERR_CLOCK_NOT_MONOTONIC]
        distinguishing_aspect: "The logical clock is monotonic: after it reads 2026-09-10, setting it to 2026-09-09 must fail 422 and leave the clock at 2026-09-10."
        test_recipe:
          setup:
            - "Logical clock advanced to 2026-09-10T00:00:00Z."
          setup_api_calls:
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00Z" }
              as: SubscriptionOpsAgent
          trigger:
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-09-09T00:00:00Z" }
              as: SubscriptionOpsAgent
              captures: { err_ck: "$.data.error_id" }
          assert:
            - "the response status is 422 and error_id == ERR_CLOCK_NOT_MONOTONIC"
            - "a subsequent read of the clock still returns 2026-09-10T00:00:00Z"

      - name: price_notice_window_satisfied_and_violated
        claim_type: Violation to Error
        grounds:
          - validations[priority=34]
          - errors[ERR_PRICE_NOTICE_WINDOW_TOO_SHORT]
        excluded_because:
          difficulty_instance: boundary_precision_check / price_notice_window_boundary_thirty_days_exactly
          rationale: "That instance dispatches notices at exactly 30 days (accepted) and at 29 days (ERR_PRICE_NOTICE_WINDOW_TOO_SHORT) on the same plan."

      - name: compliant_hold_request_passes_every_check
        claim_type: Satisfaction to Pass
        grounds:
          - validations[priority=48]
          - validations[priority=51]
          - validations[priority=52]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / hold_closed_interval_plus_buffer_admits_and_rejects
          rationale: "The admitted hold in that instance is the satisfaction case for the whole hold validation family, asserted alongside the rejected one."

      - name: save_offer_limit_outranks_discount_cap
        claim_type: Priority Ordering
        grounds:
          - validations[priority=38]
          - validations[priority=39]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / save_offer_limit_outranks_discount_cap_rejected
          rationale: "Both rules are violated by one request there and the priority-38 error is asserted as the returned one."

      - name: seat_state_outranks_domain_check
        claim_type: Priority Ordering
        grounds:
          - validations[priority=32]
          - validations[priority=40]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / seat_state_check_outranks_domain_check_rejected
          rationale: "Same request violates both the seat-state and the domain rule; the lower-priority error is asserted absent."

      - name: hold_buffer_outranks_vacation_cap
        claim_type: Priority Ordering
        grounds:
          - validations[priority=51]
          - validations[priority=52]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / hold_buffer_conflict_outranks_vacation_cap_rejected
          rationale: "One hold request violates the buffered-conflict rule and the annual quota simultaneously; priority 51 wins there."

  - section: endpoints
    instances:
      - name: paywall_rules_created_then_listed_by_status_filter
        claim_type: Standard CRUD
        grounds:
          - endpoints[POST /paywall/paywall-rules]
          - endpoints[GET /paywall/paywall-rules]
        distinguishing_aspect: "The list endpoint must apply the status filter and the declared ordering (specificity_score DESC, priority ASC, created_at ASC) together: with two ACTIVE rules and one INACTIVE rule, a status=ACTIVE query returns exactly the two ACTIVE rules, most specific first."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z, empty rule catalogue."
          setup_api_calls:
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SubscriptionOpsAgent
          trigger:
            - call: "POST /paywall/paywall-rules"
              payload: { name: "Generic Meter", action: "METER", priority: 10, content_type_match: "ANY", section_match: "ANY", propensity_band_match: "ANY", meter_allowance_override: 6, status: "ACTIVE" }
              as: RevenueManager
              captures: { rule_l1: "$.data.id", rule_l1_spec: "$.data.specificity_score" }
            - call: "POST /paywall/paywall-rules"
              payload: { name: "Politics Opinion Wall", action: "REGISTRATION_WALL", priority: 20, content_type_match: "OPINION", section_match: "politics", propensity_band_match: "LOW", status: "ACTIVE" }
              as: RevenueManager
              captures: { rule_l2: "$.data.id", rule_l2_spec: "$.data.specificity_score" }
            - call: "POST /paywall/paywall-rules"
              payload: { name: "Retired Rule", action: "HARD_PAYWALL", priority: 30, content_type_match: "NEWS", section_match: "ANY", propensity_band_match: "ANY", status: "INACTIVE" }
              as: RevenueManager
              captures: { rule_l3: "$.data.id" }
            - call: "GET /paywall/paywall-rules"
              payload: { status: "ACTIVE", limit: 10, offset: 0 }
              as: RevenueManager
              captures: { first_listed: "$.data[0].id" }
          assert:
            - "each create returns 201"
            - "PaywallRule.${rule_l1}.specificity_score == 0 and PaywallRule.${rule_l1}.meter_allowance_override == 6"
            - "PaywallRule.${rule_l2}.specificity_score == 111"
            - "PaywallRule.${rule_l3}.status == INACTIVE"
            - "the filtered list returns total_count == 2 and has_more == false"
            - "the filtered list contains ${rule_l2} first and ${rule_l1} second, and never ${rule_l3}"

      - name: card_replacement_recomputes_status_and_resets_updater
        claim_type: Action endpoint
        grounds:
          - endpoints[POST /paywall/readers/{id}/card]
        distinguishing_aspect: "Replacing an expired card must recompute card_status EXPIRED -> CURRENT against the logical clock, reset card_updater_status to NOT_APPLICABLE, honour the new card_updater_registered flag and bump Reader.version by exactly 1."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z, one registered reader whose stored card expired 2026-07 and who is not enrolled with the card updater."
          setup_api_calls:
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/readers"
              payload: { email: "card@mail.test", is_registered: true, card_last4: "1111", card_exp_month: 7, card_exp_year: 2026, card_updater_registered: false }
              as: SubscriptionOpsAgent
              captures: { rd_cd: "$.data.id", rd_cd_status: "$.data.card_status", rd_cd_v: "$.data.version" }
          trigger:
            - call: "POST /paywall/readers/${rd_cd}/card"
              payload: { card_last4: "9876", card_exp_month: 5, card_exp_year: 2028, card_updater_registered: true }
              as: Reader
              as_user_id: "${rd_cd}"
              captures: { rd_cd_status2: "$.data.card_status", rd_cd_v2: "$.data.version" }
          assert:
            - "at creation Reader.${rd_cd}.card_status was EXPIRED with version 1"
            - "the response status is 200"
            - "Reader.${rd_cd}.card_last4 == 9876"
            - "Reader.${rd_cd}.card_exp_month == 5 and Reader.${rd_cd}.card_exp_year == 2028"
            - "Reader.${rd_cd}.card_status == CURRENT"
            - "Reader.${rd_cd}.card_updater_status == NOT_APPLICABLE"
            - "Reader.${rd_cd}.card_updater_registered == true"
            - "Reader.${rd_cd}.version == 2"

      - name: group_account_links_funding_plan_and_lists_by_plan_filter
        claim_type: Cross-reference link
        grounds:
          - endpoints[POST /paywall/group-accounts]
          - endpoints[GET /paywall/group-accounts]
        distinguishing_aspect: "Creating a group account associates it with an existing INSTITUTIONAL_SEAT plan and seeds the seat counters; the offer_plan_id filter on the list endpoint must then return exactly that account and exclude an account funded by a different plan."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z, two ACTIVE INSTITUTIONAL_SEAT plans."
          setup_api_calls:
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/offer-plans"
              payload: { name: "Seats A", bundle_type: "INSTITUTIONAL_SEAT", intro_price_cents: 5000, intro_cycles: 1, standard_price_cents: 5000, standard_from_cycle: 2, cycle_days: 30, per_seat_price_cents: 400 }
              as: RevenueManager
              captures: { plan_ga: "$.data.id" }
            - call: "POST /paywall/offer-plans/${plan_ga}/activate"
              payload: {}
              as: RevenueManager
            - call: "POST /paywall/offer-plans"
              payload: { name: "Seats B", bundle_type: "INSTITUTIONAL_SEAT", intro_price_cents: 7000, intro_cycles: 1, standard_price_cents: 7000, standard_from_cycle: 2, cycle_days: 30, per_seat_price_cents: 500 }
              as: RevenueManager
              captures: { plan_gb: "$.data.id" }
            - call: "POST /paywall/offer-plans/${plan_gb}/activate"
              payload: {}
              as: RevenueManager
            - call: "POST /paywall/group-accounts"
              payload: { name: "Library B", admin_email: "admin@libb.test", allowed_email_domain: "libb.test", seat_capacity: 4, offer_plan_id: "${plan_gb}" }
              as: SubscriptionOpsAgent
              captures: { grp_gb: "$.data.id" }
          trigger:
            - call: "POST /paywall/group-accounts"
              payload: { name: "Library A", admin_email: "admin@liba.test", allowed_email_domain: "liba.test", seat_capacity: 7, offer_plan_id: "${plan_ga}" }
              as: SubscriptionOpsAgent
              captures: { grp_ga: "$.data.id", grp_ga_cap: "$.data.seats_available_count" }
            - call: "GET /paywall/group-accounts"
              payload: { offer_plan_id: "${plan_ga}", limit: 10, offset: 0 }
              as: SubscriptionOpsAgent
              captures: { listed_grp: "$.data[0].id" }
          assert:
            - "the create returns 201 with status == ACTIVE, seats_assigned_count == 0 and seats_available_count == 7"
            - "GroupAccount.${grp_ga}.offer_plan_id == ${plan_ga}"
            - "GroupAccount.${grp_ga}.version == 1"
            - "the filtered list returns total_count == 1 and ${listed_grp} == ${grp_ga}"
            - "the filtered list never contains ${grp_gb}"

      - name: full_billing_run_returns_bulk_arrays_for_two_subscriptions
        claim_type: Bulk action
        grounds:
          - endpoints[POST /paywall/billing-runs]
        distinguishing_aspect: "One FULL run must bill both due subscriptions in the same call and report them as arrays: invoices_created carries 2 ids and readers_rescored carries the 2 readers, while the pinned pass order leaves nothing for the HOLDS, EXPIRY or DUNNING arrays to report."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z, one ACTIVE DIGITAL_ONLY plan and two readers each holding an ACTIVE subscription with the cycle-1 invoice of 499 paid on 2026-09-01, so both are due when the clock reaches 2026-10-01."
          setup_api_calls:
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/offer-plans"
              payload: { name: "Digital Bulk", bundle_type: "DIGITAL_ONLY", intro_price_cents: 499, intro_cycles: 1, standard_price_cents: 1499, standard_from_cycle: 2, cycle_days: 30 }
              as: RevenueManager
              captures: { plan_bk: "$.data.id" }
            - call: "POST /paywall/offer-plans/${plan_bk}/activate"
              payload: {}
              as: RevenueManager
              captures: { plan_bk_v1: "$.data.version" }
            - call: "POST /paywall/readers"
