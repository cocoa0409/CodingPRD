      - name: budget_plan_mismatch_at_create
        claim_type: cross_entity_validation
        grounds: ["validations[priority=22]", "errors[ERR_BUDGET_PLAN_MISMATCH]"]

        distinguishing_aspect: "Isolated referential failure (no safety issue on an OPERATING account): client A's account + client B's budget plan yields ERR_BUDGET_PLAN_MISMATCH."
        test_recipe:
          setup: ["Client A ACTIVE with OPERATING account; client B ACTIVE with DRAFT plan"]
          setup_api_calls:
