  # -----------------------------------------------------------------
  # Rule 5: priority_pair_validation_conflict — different category pairs
  # -----------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: deliver_state_error_precedes_fiscal_check
        grounds:
          - validations[priority=9]
          - validations[priority=18]
          - errors[ERR_TRANSITION_NOT_ALLOWED]
          - errors[ERR_DELIVERY_PAYMENT_MISMATCH]
        distinguishing_aspect: |
          Category pair (state, business_fiscal): a deliver request on a REGISTERED order with a wildly wrong
          collected amount violates both the state precondition (priority 9) and the 110%-cap fiscal check
          (priority 18); the state error ERR_TRANSITION_NOT_ALLOWED must win.
        test_recipe:
          setup:
            - "Order REGISTERED with a CONFIRMED destination assignment for the caller (ownership passes); never booked; estimate present but irrelevant"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: VanLineAdmin }
            - { call: "POST /agents", payload: { legal_name: "Booking Co", agent_code: "BK09", capabilities: ["BOOKING"], home_market: "Chicago", commission_tier: "STANDARD" }, as: VanLineAdmin, captures: { ag_b: $.data.id } }
            - { call: "POST /agents", payload: { legal_name: "Dest Co", agent_code: "DS09", capabilities: ["DESTINATION"], home_market: "Denver", commission_tier: "STANDARD" }, as: VanLineAdmin, captures: { ag_d: $.data.id } }
            - { call: "POST /customers", payload: { full_name: "Shipper Nine", email: "ship9@x.com", phone: "555-0009" }, as: VanLineAdmin, captures: { cust: $.data.id } }
            - { call: "POST /tariffs", payload: { tariff_code: "HHG-2026-I", effective_start: "2026-01-01T00:00:00Z", effective_end: "2027-01-01T00:00:00Z", base_rate_cents_per_cwt: 4500, mileage_bands: [{ min_miles: 0, max_miles: 999999, rate_multiplier: 1.0 }], fuel_surcharge_pct: 0.10, sit_daily_rate_cents_per_cwt: 250, hourly_labor_rate_cents: 4000 }, as: VanLineAdmin, captures: { tar: $.data.id } }
            - { call: "POST /tariffs/${tar}/publish", payload: {}, as: VanLineAdmin }
            - { call: "POST /orders", payload: { customer_id: "${cust}", tariff_id: "${tar}", pricing_mode: "NON_BINDING", origin_city: "Chicago", origin_state: "IL", destination_city: "Denver", destination_state: "CO", mileage: 1200, pickup_date: "2026-06-10T00:00:00Z" }, as: BookingAgent, as_user_id: "${ag_b}", captures: { ord: $.data.id } }
            - { call: "POST /orders/${ord}/agent-assignments", payload: { agent_id: "${ag_d}", role: "DESTINATION" }, as: BookingAgent, as_user_id: "${ag_b}", captures: { as_d: $.data.id } }
            - { call: "POST /order-agent-assignments/${as_d}/confirm", payload: {}, as: DestinationAgent, as_user_id: "${ag_d}" }
          trigger:
            - call: "POST /orders/${ord}/deliver"
              payload: { collected_at_delivery_cents: 999999 }
              as: DestinationAgent
              as_user_id: "${ag_d}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_TRANSITION_NOT_ALLOWED (state, priority 9) — never ERR_DELIVERY_PAYMENT_MISMATCH (fiscal, priority 18) even though 999999 would also fail the cap check"
            - "MoveOrder.${ord}.status remains REGISTERED"
      - name: register_existence_error_precedes_tariff_referential
        grounds:
          - validations[priority=4]
          - validations[priority=17]
          - errors[ERR_NOT_FOUND]
          - errors[ERR_TARIFF_NOT_PUBLISHED]
        distinguishing_aspect: |
          Category pair (existence, business_referential) — distinct from the (state, business_fiscal) pair of
          deliver_state_error_precedes_fiscal_check: order registration with a nonexistent customer_id AND a DRAFT
          tariff violates both; existence (priority 4) must win over the tariff referential check (priority 17).
        test_recipe:
          setup:
            - "Tariff HHG-2026-J exists but is DRAFT (never published)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: VanLineAdmin }
            - { call: "POST /agents", payload: { legal_name: "Booking Co", agent_code: "BK10", capabilities: ["BOOKING"], home_market: "Chicago", commission_tier: "STANDARD" }, as: VanLineAdmin, captures: { ag_b: $.data.id } }
            - { call: "POST /tariffs", payload: { tariff_code: "HHG-2026-J", effective_start: "2026-01-01T00:00:00Z", effective_end: "2027-01-01T00:00:00Z", base_rate_cents_per_cwt: 4500, mileage_bands: [{ min_miles: 0, max_miles: 999999, rate_multiplier: 1.0 }], fuel_surcharge_pct: 0.10, sit_daily_rate_cents_per_cwt: 250, hourly_labor_rate_cents: 4000 }, as: VanLineAdmin, captures: { tar: $.data.id } }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "00000000-0000-0000-0000-000000000000", tariff_id: "${tar}", pricing_mode: "BINDING", origin_city: "Chicago", origin_state: "IL", destination_city: "Denver", destination_state: "CO", mileage: 1200, pickup_date: "2026-06-10T00:00:00Z" }
              as: BookingAgent
              as_user_id: "${ag_b}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND (existence, priority 4) — never ERR_TARIFF_NOT_PUBLISHED (business_referential, priority 17) even though the DRAFT tariff would also fail"
            - "No MoveOrder is created (GET /orders?customer_id=<bogus> returns an empty list)"

