          - errors.ERR_COMMUNITY_NOT_FOUND
          - complexity_profile.entity_topology
        distinguishing_aspect: |
          In the flat topology the owning community is a body foreign key, so an
          unresolvable community_id is caught by the priority-25 body-FK row with 404
          ERR_COMMUNITY_NOT_FOUND even though the panel referenced in the same payload
          exists and is EFFECTIVE.
        test_recipe:
