              as_user_id: "tf-nina"
              captures: { ca_batch_id: $.data.id }
          trigger:
            - call: "POST /filing-batches/${ca_batch_id}/prepare"
              payload: {}
              as: TaxFiler
              as_user_id: "tf-nina"
              captures: { error_id: $.data.error_id }
          assert:
