            - call: "POST /network/merchants"
              payload: { participant_id: "${p1}", mcc: "5411", region: "NA", declared_monthly_volume_cents: 5000000 }
              as: SponsorshipManager
              captures: { mc1: $.data.id }
            - call: "POST /network/merchants"
              payload: { acquirer_member_id: "${m_a}", mcc: "5411", region: "NA", declared_monthly_volume_cents: 5000000 }
              as: SponsorshipManager
              captures: { mc2: $.data.id }
