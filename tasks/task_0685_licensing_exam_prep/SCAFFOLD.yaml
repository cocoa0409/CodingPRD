  - method: GET
    path: "/cohort-memberships"
    description: "List cohort memberships (filter by enrollment_id) — reverse-reachability for CohortMembership.enrollment_id"
    roles: [ContentAdmin, Learner, ExamProctor]
    code: 200
    input: ["enrollment_id?", "limit?", "offset?"]
    output: CohortMembership[]
    side_effects: []

  - method: DELETE
    path: "/cohorts/{id}/memberships/{membershipId}"
    description: "Drop a cohort membership"
    roles: [Learner]
    code: 200
    input: []
    output: CohortMembership
    side_effects: ["status=DROPPED; cohort.seats_taken decremented; FULL→OPEN if seats_taken < capacity; increments CohortMembership.version by 1"]

  # ---------- Test-driving: logical clock ----------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Server startup default is 2026-04-01T00:00:00Z; before any set call the clock reads exactly this default (never wall-clock). Drives completed_at stamps and cohort session windows deterministically."
    roles: [PlatformOps]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced to to_iso8601"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Acting role not permitted for this endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Learner acting on an enrollment/resource they do not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body: missing required field, bad enum, out-of-range number" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_STALE_ENROLLMENT_VERSION, http: 412, condition: "expected_enrollment_version does not match Enrollment.version on restructure-financing" }
  - { id: ERR_PROGRAM_NOT_PUBLISHED, http: 409, condition: "Enrollment activation requires LicenseProgram.status == PUBLISHED" }
  - { id: ERR_PLAN_ARCHIVED, http: 409, condition: "Enrollment activation requires SubscriptionPlan.status == ACTIVE" }
  - { id: ERR_DOWN_PAYMENT_UNPAID, http: 409, condition: "Financed enrollment cannot activate until installment 1 (down payment) is PAID" }
  - { id: ERR_BLUEPRINT_WEIGHTS_INVALID, http: 409, condition: "domain_weights empty or weights do not sum to 1.00 on publish" }
  - { id: ERR_PROGRAM_HAS_NO_ITEMS, http: 409, condition: "Publish requires at least one QuestionItem" }
  - { id: ERR_PROGRAM_HAS_ACTIVE_ENROLLMENTS, http: 409, condition: "Retire blocked while any referencing Enrollment is ACTIVE" }
  - { id: ERR_REFERENCE_INCOMPATIBLE, http: 409, condition: "Cross-entity reference mismatch (CE bundle/program, domain not in blueprint, cohort program mismatch, item domain not in blueprint)" }
  - { id: ERR_EXAM_ALREADY_CERTIFIED, http: 409, condition: "certify-exam or withdraw when exam_outcome != PENDING" }
  - { id: ERR_BALANCE_OUTSTANDING, http: 409, condition: "Cannot certify PASS while financing_balance_cents > 0" }
  - { id: ERR_GUARANTEE_NOT_ELIGIBLE, http: 409, condition: "Approve claim when enrollment.guarantee_eligible == false" }
  - { id: ERR_EMPTY_SESSION, http: 422, condition: "PracticeSession answered_count == 0" }
  - { id: ERR_COHORT_FULL, http: 409, condition: "Join when seats_taken >= capacity or cohort CLOSED" }
  - { id: ERR_SESSION_WINDOW_CONFLICT, http: 409, condition: "Cohort membership window overlaps an existing JOINED window for the same enrollment (half-open semantics)" }
  - { id: ERR_SESSION_BUFFER_CONFLICT, http: 409, condition: "New CohortSession is within the 30-minute buffer of another session of the same cohort (closed-interval + buffer semantics)" }
  - { id: ERR_CE_MODULE_REGRESSION, http: 409, condition: "CE award modules_completed not strictly increasing or exceeds modules_total" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Learner
    description: "End user. Owns their Learner record and Enrollment-scoped actions (study, practice, mocks, financing payments, cohort membership, filing claims)."
    identity: "entity_backed:Learner"
    exclusive_operations:
      - "POST /learners — register"
      - "POST /enrollments — create enrollment"
      - "POST /enrollments/{id}/activate"
      - "POST /enrollments/{id}/restructure-financing"
      - "POST /enrollments/{id}/withdraw"
      - "POST /enrollments/{id}/installments/{installmentId}/pay"
      - "POST /enrollments/{id}/practice-sessions"
      - "POST /enrollments/{id}/mock-exams"
      - "POST /enrollments/{id}/ce-awards"
      - "POST /pass-guarantee-claims — file claim"
      - "POST /cohorts/{id}/memberships — join"
      - "DELETE /cohorts/{id}/memberships/{membershipId} — drop"
    shared_operations:
      - "GET reads on programs, plans, ce-bundles, enrollments, installments, domains, sessions, mocks, ce-awards, cohorts, claims"

  - name: ContentAdmin
    description: "Catalog owner. Manages programs, items, plans, CE bundles, cohorts."
    identity: "opaque"
    exclusive_operations:
      - "POST /license-programs"
      - "POST /license-programs/{id}/items"
      - "POST /license-programs/{id}/publish"
      - "POST /license-programs/{id}/retire"
      - "POST /subscription-plans"
      - "POST /subscription-plans/{id}/archive"
      - "POST /ce-bundles"
      - "POST /cohorts"
      - "POST /cohorts/{id}/close"
      - "POST /cohorts/{id}/sessions"
    shared_operations:
      - "GET reads on catalog and enrollment resources"

  - name: ExamProctor
    description: "Certifies official exam outcomes and decides pass-guarantee claims."
    identity: "opaque"
    exclusive_operations:
      - "POST /enrollments/{id}/certify-exam"
      - "POST /pass-guarantee-claims/{id}/decide"
    shared_operations:
      - "GET reads on enrollments, claims, programs, sessions, mocks, domains"

  - name: PlatformOps
    description: "Operational role for the logical clock test-driving endpoint."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations: []
