    instances:
      - name: registry_rejection_cascades_six_hops_to_dram_shop_document_void
        grounds:
          - state_machines.RegistrySubmission.TRANSMITTED_to_REJECTED
          - state_machines.Certificate.ACTIVE_to_SUSPENDED
          - state_machines.AlcoholServer.GRACE_to_RESTRICTED
          - state_machines.ServerAssignment.ACTIVE_to_WORK_RESTRICTED
          - calculations.location_compliance_metrics
          - entities.EmployerAccount.fields.dram_shop_discount_status
          - entities.DramShopDocument.fields.void_reason
        distinguishing_aspect: |
          One synchronous StateRegulator acknowledgement propagates six hops in a single
          request — submission REJECTED, certificate registry_state RESUBMIT_REQUIRED and
          validity_state SUSPENDED, server RESTRICTED, assignment WORK_RESTRICTED with
          reason REGISTRY_SUSPENDED, location NON_COMPLIANT, account rate 0.00 and the
