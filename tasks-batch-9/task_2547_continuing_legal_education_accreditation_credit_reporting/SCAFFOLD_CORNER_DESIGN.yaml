              expect_error: ERR_INVALID_REQUEST
            - call: "POST /cle/attendance-reports"
              payload: { course_id: "${course_id}", session_date: "2026-04-01T09:00:00Z", entries: [ { bar_number: "V12-0001", attended_minutes: 120 } ] }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { rep_id: $.data.id }
          assert:
            - "Trigger call 1 returned HTTP 409 ERR_ROSTER_WINDOW_CLOSED at clock 2026-08-01 — 122 days after the session, past session_date + 90 days — and NOT ERR_EMPTY_ROSTER, although the same body is also empty"
            - "Trigger call 3, byte-identical to call 1 but at clock 2026-05-01, returned HTTP 409 ERR_EMPTY_ROSTER — the only thing that changed is the clock"
            - "Trigger call 4 returned HTTP 422 ERR_INVALID_REQUEST because entries was absent rather than empty"
            - "Trigger call 5 returned HTTP 201 with AttendanceReport.${rep_id}.entry_count == 1, accepted_entry_count == 1, rejected_entry_count == 0"
            - "AttendanceReport.${rep_id}.session_end == '2026-04-01T11:00:00Z' (session_date + 120 minutes), days_late == 0, status == 'ACCEPTED'"
            - "GET /cle/credit-records?attendance_report_id=${rep_id} returns exactly one VERIFIED row with verification_method == 'ROSTER' and effective_format == 'LIVE'"
            - "ComplianceCycle.${cyc_id}.earned_technology_minutes == 120 and Provider.${prov_id}.attendance_reports_total_count == 1 with attendance_reports_late_count == 0"
            - "GET /cle/courses/${course_id}/attendance-reports returns exactly one row — none of the three refusals persisted a report"

      - name: conditionally_required_reasons_are_invalid_request_when_the_action_demands_them
        claim_type: conditional_validation
        grounds:
          - validations[priority 45 -> ERR_INVALID_REQUEST]
          - errors[ERR_INVALID_REQUEST]
          - state_machines.CourseApplication
          - state_machines.Complaint.UNDER_REVIEW_to_DISMISSED
          - state_machines.FeeAssessment.ASSESSED_to_WAIVED
          - endpoints[POST /cle/course-applications/{id}/review-actions]
          - endpoints[POST /cle/complaints/{id}/disposition]
          - endpoints[POST /cle/fee-assessments/{id}/settlement]
        distinguishing_aspect: "Three optional-in-the-schema fields become mandatory only for one specific action value each — denial_reason for DENY, disposition_reason for DISMISS, waiver_reason for WAIVE — so the same endpoint accepts a body without them for other actions (OPEN_REVIEW, PAY) and rejects it with 422 for these; the demand comes from the transition, not from the input list."
        test_recipe:
          setup:
            - "One PROBATIONARY provider with one INDIVIDUAL_APPROVAL course and a submitted application, one complaint under review, and the provider's PROVIDER_ANNUAL fee assessment."
          setup_api_calls:
            - call: "POST /cle/providers"
              payload: { name: "Harbor Point Seminars", provider_type: "COMMERCIAL" }
              as: BoardAdmin
              as_user_id: "22222222-2222-4222-8222-222222222222"
              captures: { prov_id: $.data.id, prov_v1: $.data.version }
            - call: "POST /cle/providers/${prov_id}/accreditation-actions"
              payload: { action: "GRANT_PROBATIONARY", expected_provider_version: "${prov_v1}", probation_reason: "New sponsor." }
              as: BoardAdmin
              as_user_id: "22222222-2222-4222-8222-222222222222"
            - call: "POST /cle/courses"
              payload: { title: "Legal Writing Intensive", delivery_format: "LIVE_IN_PERSON", total_minutes: 180, presented_at: "2026-10-01T09:00:00Z", attendance_verification_method: "ROSTER", credit_allocations: [ { category: "GENERAL", minutes: 180 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { course_id: $.data.id }
            - call: "POST /cle/courses/${course_id}/applications"
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { app_id: $.data.id }
            - call: "POST /cle/complaints"
              payload: { subject_type: "PROVIDER", subject_id: "${prov_id}", allegation: "Registration fees were charged twice.", allegation_category: "FEE_DISPUTE" }
              as: BoardAdmin
              as_user_id: "11111111-1111-4111-8111-111111111111"
              captures: { comp_id: $.data.id }
            - call: "POST /cle/complaints/${comp_id}/disposition"
              payload: { action: "OPEN_REVIEW" }
              as: BoardAdmin
              as_user_id: "22222222-2222-4222-8222-222222222222"
            - call: "GET /cle/fee-assessments?provider_id=${prov_id}"
              as: BoardAdmin
              as_user_id: "22222222-2222-4222-8222-222222222222"
              captures: { fee_id: "$.data[0].id" }
          trigger:
            - call: "POST /cle/course-applications/${app_id}/review-actions"
              payload: { action: "DENY" }
              as: AccreditationReviewer
              as_user_id: "33333333-3333-4333-8333-333333333333"
              expect_error: ERR_INVALID_REQUEST
            - call: "POST /cle/complaints/${comp_id}/disposition"
              payload: { action: "DISMISS" }
              as: BoardAdmin
              as_user_id: "22222222-2222-4222-8222-222222222222"
              expect_error: ERR_INVALID_REQUEST
            - call: "POST /cle/fee-assessments/${fee_id}/settlement"
              payload: { action: "WAIVE" }
              as: BoardAdmin
              as_user_id: "22222222-2222-4222-8222-222222222222"
              expect_error: ERR_INVALID_REQUEST
            - call: "POST /cle/course-applications/${app_id}/review-actions"
              payload: { action: "DENY", denial_reason: "The agenda documents no substantive legal content." }
              as: AccreditationReviewer
              as_user_id: "33333333-3333-4333-8333-333333333333"
            - call: "POST /cle/complaints/${comp_id}/disposition"
              payload: { action: "DISMISS", disposition_reason: "The duplicate charge was refunded before the complaint was filed." }
              as: BoardAdmin
              as_user_id: "22222222-2222-4222-8222-222222222222"
            - call: "POST /cle/fee-assessments/${fee_id}/settlement"
              payload: { action: "WAIVE", waiver_reason: "Fee waived for a government co-sponsored term." }
              as: BoardAdmin
              as_user_id: "22222222-2222-4222-8222-222222222222"
          assert:
            - "Trigger calls 1, 2 and 3 each returned HTTP 422 ERR_INVALID_REQUEST — the missing reason is a priority-45 conditional-requirement failure, not a priority-55 state error, because each addressed row was in a state from which the requested action is declared"
            - "Trigger call 4 returned HTTP 200 with CourseApplication.${app_id}.status == 'DENIED' and the denial reason recorded"
            - "Course.${course_id}.status == 'DENIED' and denial_reason copied from the deciding application"
            - "Trigger call 5 returned HTTP 200 with Complaint.${comp_id}.status == 'DISMISSED'"
            - "Trigger call 6 returned HTTP 200 with FeeAssessment.${fee_id}.status == 'WAIVED', settled_at set and waiver_reason recorded"
            - "The setup OPEN_REVIEW call carried no disposition_reason and still returned 200 — the field is demanded by DISMISS and SUBSTANTIATE only"
            - "Provider.${prov_id}.accreditation_status == 'PROBATIONARY' — a dismissed complaint changes no standing and substantiated_complaint_count == 0"

      - name: certification_is_refused_until_a_final_compliance_affirmation_exists
        claim_type: violation_to_error
        grounds:
          - validations[priority 72 -> ERR_AFFIRMATION_REQUIRED]
          - errors[ERR_AFFIRMATION_REQUIRED]
          - state_machines.ComplianceCycle.OPEN_to_DEFICIENT
          - endpoints[POST /cle/compliance-cycles/{id}/certification]
          - endpoints[POST /cle/compliance-cycles/{id}/affirmations]
        distinguishing_aspect: "The affirmation gate is independent of credit sufficiency: a cycle with zero credits cannot be certified at all without a FINAL_COMPLIANCE_AFFIRMATION, and once that affirmation exists the very same certification succeeds and lands on DEFICIENT rather than being refused — the gate decides whether the filing happens, not whether it passes."
        test_recipe:
          setup:
            - "One attorney with a single 2026-01-01 -> 2028-01-01 cycle and no credit records; clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /cle/attorneys"
              payload: { bar_number: "V14-0001", full_name: "Helena Krogh", admission_date: "2003-03-03T00:00:00Z", compliance_group: "GROUP_1", principal_office_jurisdiction: "ST" }
              as: BoardAdmin
              captures: { att_id: $.data.id }
            - call: "POST /cle/attorneys/${att_id}/compliance-cycles"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2028-01-01T00:00:00Z" }
              as: BoardAdmin
              captures: { cyc_id: $.data.id }
          trigger:
            - call: "POST /cle/compliance-cycles/${cyc_id}/certification"
              payload: {}
              as: Attorney
              as_user_id: "${att_id}"
              expect_error: ERR_AFFIRMATION_REQUIRED
            - call: "POST /cle/compliance-cycles/${cyc_id}/affirmations"
              payload: { affirmation_type: "SELF_STUDY_AFFIRMATION", statement: "I affirm the self-study hours were completed as reported." }
              as: Attorney
              as_user_id: "${att_id}"
            - call: "POST /cle/compliance-cycles/${cyc_id}/certification"
              payload: {}
              as: Attorney
              as_user_id: "${att_id}"
              expect_error: ERR_AFFIRMATION_REQUIRED
            - call: "POST /cle/compliance-cycles/${cyc_id}/affirmations"
              payload: { affirmation_type: "FINAL_COMPLIANCE_AFFIRMATION", statement: "I affirm my compliance report for this period is complete and accurate." }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { aff_id: $.data.id }
            - call: "POST /cle/compliance-cycles/${cyc_id}/certification"
              payload: {}
              as: Attorney
              as_user_id: "${att_id}"
          assert:
            - "Trigger call 1 returned HTTP 409 ERR_AFFIRMATION_REQUIRED with no affirmation on file"
            - "Trigger call 3 returned HTTP 409 ERR_AFFIRMATION_REQUIRED even though an affirmation now exists — only affirmation_type FINAL_COMPLIANCE_AFFIRMATION satisfies the gate"
            - "Trigger call 5 returned HTTP 200 with ComplianceCycle.${cyc_id}.credit_status == 'DEFICIENT' and certified_at == '2026-08-01T00:00:00Z'"
            - "ComplianceCycle.${cyc_id}.carryover_out_general_minutes == 0 and carryover_out_ethics_minutes == 0 (a deficient cycle never carries forward)"
            - "Attorney.${att_id}.open_deficiency_count == 1"
            - "GET /cle/compliance-cycles/${cyc_id}/affirmations returns exactly two rows and Affirmation.${aff_id}.target_credit_record_id is null"

      - name: an_admin_suspended_cycle_refuses_credit_before_the_course_standing_check
        claim_type: priority_conflict
        grounds:
          - validations[priority 56 -> ERR_CYCLE_ADMIN_SUSPENDED]
          - validations[priority 62 -> ERR_COURSE_NOT_APPROVED]
        excluded_because:
          difficulty_instance: admin_suspended_cycle_state_check_outranks_course_standing_check_on_credit_filing
          rationale: "That §1.8 instance builds a filing that violates both rules at once and asserts the 56-before-62 verdict, then lifts the suspension to expose the second error; repeating it here would be the same two calls."

      - name: an_expired_course_window_outranks_the_duplicate_record_constraint
        claim_type: priority_conflict
        grounds:
          - validations[priority 68 -> ERR_COURSE_APPROVAL_EXPIRED]
          - validations[priority 72 -> ERR_DUPLICATE_CREDIT_RECORD]
        excluded_because:
          difficulty_instance: expired_course_window_check_outranks_duplicate_record_constraint_on_refiling
          rationale: "The refiling that is simultaneously a duplicate and past the course's expires_at is that §1.8 instance's whole subject, including the 68-before-72 ordering."

      - name: abutting_compliance_periods_are_legal_but_overlapping_ones_are_refused
        claim_type: temporal_validation
        grounds:
          - validations[priority 68 -> ERR_CYCLE_PERIOD_OVERLAP]
          - entities.ComplianceCycle.fields.period_end
        excluded_because:
          difficulty_instance: attorney_compliance_periods_are_half_open_so_exact_adjacency_is_legal
          rationale: "The half-open cycle window — exact adjacency accepted, one-second overlap refused — is asserted there in both directions for the same attorney."

      - name: abutting_audit_periods_collide_and_a_second_open_engagement_is_refused
        claim_type: temporal_validation
        grounds:
          - validations[priority 68 -> ERR_AUDIT_PERIOD_OVERLAP]
          - validations[priority 68 -> ERR_AUDIT_ENGAGEMENT_ACTIVE]
        excluded_because:
          difficulty_instance: provider_audit_windows_are_closed_so_abutting_periods_collide_and_one_engagement_is_the_limit
          rationale: "That §1.8 instance contrasts the closed audit interval with the half-open cycle interval and separates the overlap error from the single-engagement error on the same provider."

      - name: concurrent_live_sessions_are_counted_as_an_aggregate_not_pairwise
        claim_type: aggregate_validation
        grounds:
          - validations[priority 68 -> ERR_SESSION_WINDOW_CONFLICT]
          - domain_constants.PROVIDER_CONCURRENT_LIVE_CAPACITY
        excluded_because:
          difficulty_instance: concurrent_live_session_capacity_is_an_aggregate_closed_interval_count_not_a_pairwise_check
          rationale: "The aggregate overlap count at a single instant, including the third session that only collides when both earlier ones are counted together, is that §1.8 instance's claim."

  # ===========================================================================
  - section: endpoints
    instances:

      - name: the_cycle_summary_read_returns_both_variants_side_by_side_without_mutating_anything
        claim_type: computed_read
        grounds:
          - endpoints[GET /cle/compliance-cycles/{id}/summary]
          - calculations.cycle_credit_application
          - calculations.late_fee_assessment
          - entities.ComplianceCycle
        distinguishing_aspect: "One read returns the PROVISIONAL and the projected FINAL picture of the same stored rows in the same body — 660 provisional countable minutes against 300 projected-final, ethics satisfied provisionally and 180 short finally — plus a projected late fee derived from the FINAL numbers only; and running the read twice changes no version and no persisted field."
        test_recipe:
          setup:
            - "One ACCREDITED self-certifying provider; one attorney (GROUP_1, admitted 2003) with a 2026-01-01 -> 2028-01-01 cycle holding one VERIFIED live record (300 GENERAL) and one PENDING_VERIFICATION self-study record (180 ETHICS + 420 GENERAL)."
          setup_api_calls:
            - call: "POST /cle/providers"
              payload: { name: "Summit Bar Education", provider_type: "BAR_ASSOCIATION" }
              as: BoardAdmin
              captures: { prov_id: $.data.id, prov_v1: $.data.version }
            - call: "POST /cle/providers/${prov_id}/accreditation-actions"
              payload: { action: "GRANT_FULL", expected_provider_version: "${prov_v1}" }
              as: BoardAdmin
            - call: "POST /cle/courses"
              payload: { title: "Webcast Civil Procedure", delivery_format: "LIVE_WEBCAST", total_minutes: 300, presented_at: "2026-02-01T09:00:00Z", attendance_verification_method: "ATTENDANCE_CODE", credit_allocations: [ { category: "GENERAL", minutes: 300 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { course_a: $.data.id, code_a: $.data.attendance_code }
            - call: "POST /cle/courses"
              payload: { title: "Self Study Ethics Compendium", delivery_format: "SELF_STUDY", total_minutes: 600, presented_at: "2026-03-01T09:00:00Z", attendance_verification_method: "AFFIRMATION_ONLY", credit_allocations: [ { category: "ETHICS", minutes: 180 }, { category: "GENERAL", minutes: 420 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { course_b: $.data.id }
            - call: "POST /cle/attorneys"
              payload: { bar_number: "E1-1001", full_name: "Sofia Marchetti", admission_date: "2003-01-01T00:00:00Z", compliance_group: "GROUP_1", principal_office_jurisdiction: "ST" }
              as: BoardAdmin
              captures: { att_id: $.data.id }
            - call: "POST /cle/attorneys/${att_id}/compliance-cycles"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2028-01-01T00:00:00Z" }
              as: BoardAdmin
              captures: { cyc_id: $.data.id, cyc_v1: $.data.version }
            - call: "POST /cle/credit-records"
              payload: { attorney_id: "${att_id}", course_id: "${course_a}", verification_method: "ATTENDANCE_CODE", attendance_code: "${code_a}", attended_minutes: 300, completion_date: "2026-02-01T13:00:00Z" }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { rec_a: $.data.id }
            - call: "POST /cle/credit-records"
              payload: { attorney_id: "${att_id}", course_id: "${course_b}", verification_method: "AFFIRMATION", attended_minutes: 600, completion_date: "2026-04-01T00:00:00Z" }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { rec_b: $.data.id }
          trigger:
            - call: "GET /cle/compliance-cycles/${cyc_id}/summary"
              as: Attorney
              as_user_id: "${att_id}"
            - call: "GET /cle/compliance-cycles/${cyc_id}/summary"
              as: BoardAdmin
          assert:
            - "Both reads returned HTTP 200 with byte-identical bodies apart from meta"
            - "cycle_id == '${cyc_id}', credit_status == 'OPEN', administrative_status == 'GOOD_STANDING'"
            - "required_total_minutes == 1800, required_ethics_minutes == 180, required_technology_minutes == 60, required_bias_minutes == 120"
            - "provisional_total_minutes == 660 — the LIVE 300 plus the self-study record truncated to SELF_STUDY_CAP_MINUTES room of 360, because PROVISIONAL includes the PENDING_VERIFICATION record"
            - "provisional_ethics_minutes == 180 (the 240-minute cap shortfall came out of GENERAL first, so the ethics slice survived), provisional_technology_minutes == 0, provisional_bias_minutes == 0, provisional_live_minutes == 300"
            - "provisional_deficiency_total_minutes == 1140 and provisional_deficiency_ethics_minutes == 0"
            - "projected_final_total_minutes == 300, projected_final_ethics_minutes == 0, projected_final_technology_minutes == 0, projected_final_bias_minutes == 0, projected_final_live_minutes == 300 — the FINAL variant drops the pending record entirely"
            - "projected_final_deficiency_total_minutes == 1500, projected_final_deficiency_ethics_minutes == 180, projected_final_deficiency_technology_minutes == 60, projected_final_deficiency_bias_minutes == 120"
            - "self_study_used_minutes == 360, on_demand_used_minutes == 0, nonlive_used_minutes == 360, reciprocity_used_minutes == 0 — the usage figures report the persisted PROVISIONAL run"
            - "carryover_in_general_minutes == 0, carryover_in_ethics_minutes == 0, projected_carryover_out_general_minutes == 0, projected_carryover_out_ethics_minutes == 0 (a projected-deficient cycle carries nothing forward)"
            - "projected_late_fee_cents == 100000 — FINAL deficiencies 1500 + 180 + 60 + 120 = 1860 minutes, ceil(1860/60) = 31 hours, base 60000 for the 16_plus tier plus 2500 * min(31, 20) = 50000, capped at LATE_FEE_CAP_CENTS"
            - "records_counted == 2 and records_excluded == 0 — the PROVISIONAL input set holds both records and no REJECTED or VOIDED row exists"
            - "ComplianceCycle.${cyc_id}.version is still ${cyc_v1} and CreditRecord.${rec_b}.countable_minutes is still 360 after both reads — the summary computes but never writes"

      - name: a_partly_unusable_roster_is_accepted_whole_and_reports_its_skipped_rows
            
        claim_type: bulk_action
        grounds:
          - endpoints[POST /cle/attendance-reports]
          - entities.AttendanceReport.fields.rejected_entry_count
          - state_machines.CreditRecord.PENDING_VERIFICATION_to_VERIFIED
          - entities.AttendanceReport.fields.accepted_entry_count
        distinguishing_aspect: "Three of four roster rows are unusable for three different reasons — an unknown bar number, an attorney with no cycle covering the session, and a bar number repeated inside the same roster whose first occurrence already produced a record — and none of them fails the request: the report is created with accepted_entry_count 1 and rejected_entry_count 3, and exactly one CreditRecord exists."
        test_recipe:
          setup:
            - "One ACCREDITED self-certifying provider with one APPROVED LIVE_IN_PERSON / ROSTER course presented 2026-07-15T09:00:00Z; attorney A1 holds a covering cycle, attorney A2 holds none; clock at its 2026-08-01T00:00:00Z default (inside the 30-day due window)."
          setup_api_calls:
            - call: "POST /cle/providers"
              payload: { name: "Lakeside Trial Academy", provider_type: "LAW_SCHOOL" }
              as: BoardAdmin
              captures: { prov_id: $.data.id, prov_v1: $.data.version }
            - call: "POST /cle/providers/${prov_id}/accreditation-actions"
              payload: { action: "GRANT_FULL", expected_provider_version: "${prov_v1}" }
              as: BoardAdmin
            - call: "POST /cle/courses"
              payload: { title: "Trial Advocacy Workshop", delivery_format: "LIVE_IN_PERSON", total_minutes: 120, presented_at: "2026-07-15T09:00:00Z", attendance_verification_method: "ROSTER", credit_allocations: [ { category: "GENERAL", minutes: 120 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { course_id: $.data.id }
            - call: "POST /cle/attorneys"
              payload: { bar_number: "E2-1001", full_name: "Grace Odunlami", admission_date: "2010-10-10T00:00:00Z", compliance_group: "GROUP_1", principal_office_jurisdiction: "ST" }
              as: BoardAdmin
              captures: { a1: $.data.id }
            - call: "POST /cle/attorneys"
              payload: { bar_number: "E2-1002", full_name: "Hugo Petersen", admission_date: "2010-11-11T00:00:00Z", compliance_group: "GROUP_1", principal_office_jurisdiction: "ST" }
              as: BoardAdmin
              captures: { a2: $.data.id }
            - call: "POST /cle/attorneys/${a1}/compliance-cycles"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2028-01-01T00:00:00Z" }
              as: BoardAdmin
              captures: { cyc_1: $.data.id }
          trigger:
            - call: "POST /cle/attendance-reports"
              payload: { course_id: "${course_id}", session_date: "2026-07-15T09:00:00Z", entries: [ { bar_number: "E2-1001", attended_minutes: 120 }, { bar_number: "E2-9999", attended_minutes: 120 }, { bar_number: "E2-1002", attended_minutes: 120 }, { bar_number: "E2-1001", attended_minutes: 60 } ] }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { rep_id: $.data.id }
          assert:
            - "The call returned HTTP 201 — a roster with unusable rows is never refused as long as it is non-empty and inside its hard window"
            - "AttendanceReport.${rep_id}.entry_count == 4, accepted_entry_count == 1, rejected_entry_count == 3"
            - "AttendanceReport.${rep_id}.days_late == 0 and status == 'ACCEPTED' (submitted 17 days after the session, inside ROSTER_DUE_DAYS)"
            - "GET /cle/credit-records?attendance_report_id=${rep_id} returns exactly one row: attorney_id == '${a1}', status == 'VERIFIED', verification_method == 'ROSTER', attended_minutes == 120, credited_general_minutes == 120"
            - "Row 2 was skipped because bar number E2-9999 resolves to no Attorney; row 3 because attorney ${a2} has no ComplianceCycle covering 2026-07-15; row 4 because row 1 had already produced a record for the same (attorney, course, session_date), and the 60-minute figure of row 4 was therefore never applied"
            - "GET /cle/credit-records?attorney_id=${a2} returns 0 rows"
            - "ComplianceCycle.${cyc_1}.earned_countable_minutes == 120 and earned_live_minutes == 120"
            - "Provider.${prov_id}.attendance_reports_total_count == 1 and attendance_reports_late_count == 0"
            - "Course.${course_id}.verified_credit_record_count == 1"

      - name: the_clock_action_endpoint_moves_time_in_both_directions_and_returns_no_body
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /_clock/set_current_utc]
          - domain_constants.CLOCK_DEFAULT_UTC
          - domain_constants.ACCREDITATION_TERM_MONTHS
          - state_machines.Provider.APPLIED_to_ACCREDITED
        distinguishing_aspect: "The clock endpoint is the one write whose output is null rather than an entity, and it is not monotonic: the same test moves the logical clock 17 months forward and then 7 months back, and each grant stamps its term dates from wherever the clock stands at that moment."
        test_recipe:
          setup:
            - "Empty database, logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls: []
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /cle/providers"
              payload: { name: "Forward Time Institute", provider_type: "GOVERNMENT" }
              as: BoardAdmin
              captures: { p_fwd: $.data.id, p_fwd_v1: $.data.version }
            - call: "POST /cle/providers/${p_fwd}/accreditation-actions"
              payload: { action: "GRANT_FULL", expected_provider_version: "${p_fwd_v1}" }
              as: BoardAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /cle/providers"
              payload: { name: "Rewound Time Seminars", provider_type: "COMMERCIAL" }
              as: BoardAdmin
              captures: { p_back: $.data.id, p_back_v1: $.data.version }
            - call: "POST /cle/providers/${p_back}/accreditation-actions"
              payload: { action: "GRANT_PROBATIONARY", expected_provider_version: "${p_back_v1}", probation_reason: "Probationary term for a new commercial sponsor." }
              as: BoardAdmin
          assert:
            - "Both clock calls returned HTTP 200 with response_type 'object' and data null — the endpoint declares no output entity"
            - "Provider.${p_fwd}.accreditation_term_start == '2027-01-01T00:00:00Z' and accreditation_term_end == '2029-01-01T00:00:00Z' (ACCREDITATION_TERM_MONTHS == 24)"
            - "Provider.${p_back}.accreditation_term_start == '2026-06-01T00:00:00Z' and accreditation_term_end == '2028-06-01T00:00:00Z' — stamped from the rewound clock, seven months before the previous grant"
            - "Provider.${p_fwd}.self_certification_enabled == true and Provider.${p_back}.self_certification_enabled == false"
            - "GET /cle/fee-assessments?provider_id=${p_fwd} returns one ASSESSED PROVIDER_ANNUAL row with assessed_at == '2027-01-01T00:00:00Z'; GET /cle/fee-assessments?provider_id=${p_back} returns one with assessed_at == '2026-06-01T00:00:00Z' and amount_cents == 120000 (the DEFAULT_PROVIDER_ANNUAL_FEE_CENTS default)"

      - name: one_course_endpoint_produces_three_different_approval_outcomes
        claim_type: conditional_action
        grounds:
          - endpoints[POST /cle/courses]
          - entities.Course.fields.approval_pathway
          - entities.Course.fields.status
          - entities.Course.fields.attendance_code
          - entities.Provider.fields.self_certification_enabled
        distinguishing_aspect: "The same endpoint with the same shape of body returns three different persisted outcomes decided entirely by the sponsor: an ACCREDITED self-certifying provider yields APPROVED / PROVIDER_ACCREDITED, a PROBATIONARY provider yields PENDING_APPROVAL / INDIVIDUAL_APPROVAL, and an attorney filing with no provider_id at all yields PENDING_APPROVAL / INDIVIDUAL_APPROVAL with a null provider — and only the ATTENDANCE_CODE course gets a code."
        test_recipe:
          setup:
            - "One ACCREDITED self-certifying provider, one PROBATIONARY provider, one attorney."
          setup_api_calls:
            - call: "POST /cle/providers"
              payload: { name: "Fully Accredited Bar CLE", provider_type: "BAR_ASSOCIATION" }
              as: BoardAdmin
              captures: { p_full: $.data.id, p_full_v1: $.data.version }
            - call: "POST /cle/providers/${p_full}/accreditation-actions"
              payload: { action: "GRANT_FULL", expected_provider_version: "${p_full_v1}" }
              as: BoardAdmin
            - call: "POST /cle/providers"
              payload: { name: "Probationary Sponsor LLC", provider_type: "LAW_FIRM" }
              as: BoardAdmin
              captures: { p_prob: $.data.id, p_prob_v1: $.data.version }
            - call: "POST /cle/providers/${p_prob}/accreditation-actions"
              payload: { action: "GRANT_PROBATIONARY", expected_provider_version: "${p_prob_v1}", probation_reason: "Law-firm sponsor on initial probation." }
              as: BoardAdmin
            - call: "POST /cle/attorneys"
              payload: { bar_number: "E4-1001", full_name: "Lena Fitzgerald", admission_date: "2012-12-12T00:00:00Z", compliance_group: "GROUP_2", principal_office_jurisdiction: "ST" }
              as: BoardAdmin
              captures: { att_id: $.data.id }
          trigger:
            - call: "POST /cle/courses"
              payload: { title: "Self Certified Ethics Hour", delivery_format: "LIVE_WEBCAST", total_minutes: 60, presented_at: "2026-09-01T09:00:00Z", attendance_verification_method: "ATTENDANCE_CODE", credit_allocations: [ { category: "ETHICS", minutes: 60 } ], provider_id: "${p_full}" }
              as: ProviderAdmin
              as_user_id: "${p_full}"
              captures: { c_self: $.data.id }
            - call: "POST /cle/courses"
              payload: { title: "Probationary Sponsor Seminar", delivery_format: "LIVE_IN_PERSON", total_minutes: 120, presented_at: "2026-09-02T09:00:00Z", attendance_verification_method: "ROSTER", credit_allocations: [ { category: "GENERAL", minutes: 120 } ], provider_id: "${p_prob}" }
              as: ProviderAdmin
              as_user_id: "${p_prob}"
              captures: { c_prob: $.data.id }
            - call: "POST /cle/courses"
              payload: { title: "Out of State Bar Retreat Session", delivery_format: "ON_DEMAND", total_minutes: 90, presented_at: "2026-05-05T09:00:00Z", attendance_verification_method: "CERTIFICATE", credit_allocations: [ { category: "GENERAL", minutes: 90 } ] }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { c_indiv: $.data.id }
          assert:
            - "All three calls returned HTTP 201"
            - "Course.${c_self}.status == 'APPROVED', approval_pathway == 'PROVIDER_ACCREDITED', attendance_code is a non-null six-character string, expires_at == '2026-09-01T10:00:00Z' (presented_at + 60 minutes)"
            - "Course.${c_prob}.status == 'PENDING_APPROVAL', approval_pathway == 'INDIVIDUAL_APPROVAL', attendance_code is null, expires_at == '2026-09-02T11:00:00Z'"
            - "Course.${c_indiv}.status == 'PENDING_APPROVAL', approval_pathway == 'INDIVIDUAL_APPROVAL', provider_id is null, expires_at == '2029-05-05T09:00:00Z' (presented_at + APPROVAL_VALID_MONTHS)"
            - "Provider.${p_full}.courses_total_count == 1 and courses_self_certified_count == 1"
            - "Provider.${p_prob}.courses_total_count == 1 and courses_self_certified_count == 0"
            - "GET /cle/courses?approval_pathway=INDIVIDUAL_APPROVAL returns exactly two rows (${c_prob} and ${c_indiv}) and GET /cle/courses?status=APPROVED returns exactly one (${c_self})"
            - "GET /cle/courses?provider_id=${p_full} returns exactly one row — the attorney-filed course belongs to no provider and appears in neither provider's filtered list"

      - name: an_attorneys_reciprocity_claims_and_their_cascaded_records_are_reachable_both_ways
        claim_type: cross_reference_link
        grounds:
          - endpoints[GET /cle/attorneys/{id}/reciprocity-claims]
          - endpoints[GET /cle/credit-records]
          - entities.CreditRecord.fields.reciprocity_claim_id
          - calculations.reciprocity_credit_conversion
          - state_machines.ReciprocityClaim.SUBMITTED_to_APPROVED
        distinguishing_aspect: "Two link channels are exercised in one test: the sub-resource that finds an attorney's claims from the attorney id (and returns none for an attorney who filed none), and the filtered list that finds the cascade-created CreditRecord from the claim id — a record no client ever posted and whose reciprocity_claim_id is a system field."
        test_recipe:
          setup:
            - "Two attorneys with 2026-01-01 -> 2028-01-01 cycles; attorney A files two RECIPROCITY claims, attorney B files none."
          setup_api_calls:
            - call: "POST /cle/attorneys"
              payload: { bar_number: "E5-1001", full_name: "Amara Nwosu", admission_date: "2004-04-04T00:00:00Z", compliance_group: "GROUP_1", principal_office_jurisdiction: "ST" }
              as: BoardAdmin
              captures: { att_a: $.data.id, att_a_v1: $.data.version }
            - call: "POST /cle/attorneys"
              payload: { bar_number: "E5-1002", full_name: "Bruno Salgado", admission_date: "2004-05-05T00:00:00Z", compliance_group: "GROUP_1", principal_office_jurisdiction: "ST" }
              as: BoardAdmin
              captures: { att_b: $.data.id }
            - call: "POST /cle/attorneys/${att_a}/compliance-cycles"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2028-01-01T00:00:00Z" }
              as: BoardAdmin
              captures: { cyc_a: $.data.id }
            - call: "POST /cle/attorneys/${att_b}/compliance-cycles"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2028-01-01T00:00:00Z" }
              as: BoardAdmin
              captures: { cyc_b: $.data.id }
            - call: "POST /cle/reciprocity-claims"
              payload: { attorney_id: "${att_a}", basis: "RECIPROCITY", origin_jurisdiction: "NY", origin_course_title: "New York Civil Practice Update", origin_credit_hours: 2.0, origin_category: "GENERAL", completion_date: "2026-05-05T00:00:00Z", expected_attorney_version: "${att_a_v1}" }
              as: Attorney
              as_user_id: "${att_a}"
              captures: { claim_1: $.data.id }
            - call: "GET /cle/attorneys/${att_a}"
              as: Attorney
              as_user_id: "${att_a}"
              captures: { att_a_v2: $.data.version }
            - call: "POST /cle/reciprocity-claims"
              payload: { attorney_id: "${att_a}", basis: "RECIPROCITY", origin_jurisdiction: "CA", origin_course_title: "California Legal Technology Forum", origin_credit_hours: 1.5, origin_category: "TECHNOLOGY", completion_date: "2026-06-06T00:00:00Z", expected_attorney_version: "${att_a_v2}" }
              as: Attorney
              as_user_id: "${att_a}"
              captures: { claim_2: $.data.id }
          trigger:
            - call: "POST /cle/reciprocity-claims/${claim_1}/determination"
              payload: { action: "APPROVE" }
              as: BoardAdmin
            - call: "GET /cle/attorneys/${att_a}/reciprocity-claims"
              as: Attorney
              as_user_id: "${att_a}"
            - call: "GET /cle/attorneys/${att_b}/reciprocity-claims"
              as: BoardAdmin
            - call: "GET /cle/credit-records?reciprocity_claim_id=${claim_1}"
              as: BoardAdmin
          assert:
            - "The determination returned HTTP 200 with ReciprocityClaim.${claim_1}.status == 'APPROVED', converted_minutes == 90 (2.0 * 50 New York minutes = 100, floored to a 15-minute increment) and converted_category == 'GENERAL'"
            - "GET /cle/attorneys/${att_a}/reciprocity-claims returned HTTP 200 with exactly two rows, ${claim_1} APPROVED and ${claim_2} SUBMITTED"
            - "GET /cle/attorneys/${att_b}/reciprocity-claims returned HTTP 200 with 0 rows — the sub-resource is scoped to its parent, not global"
            - "GET /cle/credit-records?reciprocity_claim_id=${claim_1} returned exactly one row with status 'VERIFIED', source 'RECIPROCITY', effective_format 'LIVE', verification_method 'CERTIFICATE', credited_general_minutes == 90 and cycle_id == '${cyc_a}'"
            - "GET /cle/credit-records?reciprocity_claim_id=${claim_2} returns 0 rows — a SUBMITTED claim has cascaded nothing"
            - "ComplianceCycle.${cyc_a}.earned_countable_minutes == 90 and earned_live_minutes == 90; ComplianceCycle.${cyc_b}.earned_countable_minutes == 0"

      - name: every_declared_status_code_and_envelope_shape_matches_the_endpoint_table
        claim_type: standard_crud
        grounds:
          - response_envelope
          - endpoints[POST /cle/attorneys]
          - endpoints[GET /cle/attorneys/{id}]
          - endpoints[GET /cle/compliance-cycles]
          - endpoints[POST /cle/attorneys/{id}/status-changes]
          - errors[ERR_ATTORNEY_NOT_FOUND]
        distinguishing_aspect: "The contract of §1.0 and §1.5 is asserted directly: 201 with response_type object for a create, 200 for an action on an existing row, 200 with response_type array plus the four pagination fields for a list, the error envelope with data.error_id and data.message for a 404, the limit ceiling of 100, and bare-UUID ids with no type prefix anywhere."
        test_recipe:
          setup:
            - "One attorney with three adjacent historical cycles; clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /cle/attorneys"
              payload: { bar_number: "E6-1001", full_name: "Rafael Quintero", admission_date: "2001-01-01T00:00:00Z", compliance_group: "GROUP_3", principal_office_jurisdiction: "ST" }
              as: BoardAdmin
              captures: { att_id: $.data.id }
            - call: "POST /cle/attorneys/${att_id}/compliance-cycles"
              payload: { period_start: "2020-01-01T00:00:00Z", period_end: "2022-01-01T00:00:00Z" }
              as: BoardAdmin
              captures: { cyc_1: $.data.id }
            - call: "POST /cle/attorneys/${att_id}/compliance-cycles"
              payload: { period_start: "2022-01-01T00:00:00Z", period_end: "2024-01-01T00:00:00Z" }
              as: BoardAdmin
              captures: { cyc_2: $.data.id }
            - call: "POST /cle/attorneys/${att_id}/compliance-cycles"
              payload: { period_start: "2024-01-01T00:00:00Z", period_end: "2026-01-01T00:00:00Z" }
              as: BoardAdmin
              captures: { cyc_3: $.data.id }
          trigger:
            - call: "GET /cle/attorneys/${att_id}"
              as: Attorney
              as_user_id: "${att_id}"
            - call: "GET /cle/compliance-cycles?attorney_id=${att_id}&limit=2&offset=0"
              as: BoardAdmin
            - call: "GET /cle/compliance-cycles?attorney_id=${att_id}&limit=2&offset=2"
              as: BoardAdmin
            - call: "GET /cle/compliance-cycles?attorney_id=${att_id}&limit=101"
              as: BoardAdmin
              expect_error: ERR_INVALID_REQUEST
            - call: "GET /cle/attorneys/00000000-0000-4000-8000-00000000dead"
              as: BoardAdmin
              expect_error: ERR_ATTORNEY_NOT_FOUND
            - call: "POST /cle/attorneys/${att_id}/status-changes"
              payload: { status: "EXEMPT", reason: "Full-time judicial appointment." }
              as: BoardAdmin
          assert:
            - "The four setup creates each returned HTTP 201 with response_type 'object', a meta.api_request_id, a meta.api_request_timestamp and a data object carrying id, created_at, updated_at and version == 1"
            - "Every id returned anywhere in this test is a bare 36-character UUID with no type prefix"
            - "Trigger call 1 returned HTTP 200 with response_type 'object'"
            - "Trigger call 2 returned HTTP 200 with response_type 'array', exactly 2 rows, total_count == 3, limit == 2, offset == 0, has_more == true"
            - "Trigger call 3 returned exactly 1 row with total_count == 3, offset == 2 and has_more == false"
            - "Trigger call 4 returned HTTP 422 ERR_INVALID_REQUEST — limit 101 exceeds the declared maximum of 100"
            - "Trigger call 5 returned HTTP 404 with response_type 'error' and data == { error_id: 'ERR_ATTORNEY_NOT_FOUND', message: <non-empty string> } and no entity fields alongside it"
            - "Trigger call 6 returned HTTP 200 (an action endpoint answers 200, not 201) with Attorney.${att_id}.status == 'EXEMPT' and version == 2"
            - "GET /cle/compliance-cycles?attorney_id=${att_id} with no pagination arguments returns all three rows with limit == 10 and offset == 0, the declared defaults"

  # ===========================================================================
  - section: errors
    # Table 6 of the claim-extraction guide declares no pattern rows of its own —
    # its requirement is that every error id be triggerable by at least one test.
    # Each instance below therefore carries the Table 4 claim type
    # `violation_to_error`, and the error ids that §1.8 already triggers appear
    # here (or in the validations section above) as `excluded_because:` stubs.
    instances:

      - name: a_second_attorney_with_the_same_bar_number_is_refused
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DUPLICATE_BAR_NUMBER]
          - validations[priority 72 -> ERR_DUPLICATE_BAR_NUMBER]
          - entities.Attorney.fields.bar_number
          - endpoints[POST /cle/attorneys]
        distinguishing_aspect: "Uniqueness is on bar_number alone, not on the pair with full_name or admission_date: a second attorney with a different name, a different admission date, a different compliance group and a different jurisdiction is still refused, while a one-character change to the bar number is accepted."
        test_recipe:
          setup:
            - "Empty database, logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /cle/attorneys"
              payload: { bar_number: "DUP-7001", full_name: "Original Registrant", admission_date: "2000-01-01T00:00:00Z", compliance_group: "GROUP_1", principal_office_jurisdiction: "ST" }
              as: BoardAdmin
              captures: { att_1: $.data.id }
          trigger:
            - call: "POST /cle/attorneys"
              payload: { bar_number: "DUP-7001", full_name: "Different Person Entirely", admission_date: "2019-09-09T00:00:00Z", compliance_group: "GROUP_3", principal_office_jurisdiction: "NY" }
              as: BoardAdmin
              expect_error: ERR_DUPLICATE_BAR_NUMBER
            - call: "POST /cle/attorneys"
              payload: { bar_number: "DUP-7002", full_name: "Different Person Entirely", admission_date: "2019-09-09T00:00:00Z", compliance_group: "GROUP_3", principal_office_jurisdiction: "NY" }
              as: BoardAdmin
              captures: { att_2: $.data.id }
          assert:
            - "Trigger call 1 returned HTTP 409 ERR_DUPLICATE_BAR_NUMBER"
            - "Trigger call 2 returned HTTP 201 — every other field is identical to the refused body, so bar_number alone carries the constraint"
            - "Exactly two Attorney rows exist, ${att_1} with bar_number 'DUP-7001' and ${att_2} with 'DUP-7002'"
            - "Attorney.${att_1}.full_name is still 'Original Registrant' — the refused create overwrote nothing"

      - name: a_course_may_have_only_one_live_application_at_a_time
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DUPLICATE_APPLICATION]
          - validations[priority 72 -> ERR_DUPLICATE_APPLICATION]
          - endpoints[POST /cle/courses/{id}/applications]
          - state_machines.CourseApplication
        distinguishing_aspect: "The constraint counts only non-terminal applications of the one course, so a second application on the same course is refused while an application on the sponsor's other course is accepted in the same breath — the limit is per course, not per provider."
        test_recipe:
          setup:
            - "One PROBATIONARY provider with two PENDING_APPROVAL courses."
          setup_api_calls:
            - call: "POST /cle/providers"
              payload: { name: "Twin Course Sponsors", provider_type: "LAW_FIRM" }
              as: BoardAdmin
              captures: { prov_id: $.data.id, prov_v1: $.data.version }
            - call: "POST /cle/providers/${prov_id}/accreditation-actions"
              payload: { action: "GRANT_PROBATIONARY", expected_provider_version: "${prov_v1}", probation_reason: "Initial probationary term." }
              as: BoardAdmin
            - call: "POST /cle/courses"
              payload: { title: "First Pending Course", delivery_format: "ON_DEMAND", total_minutes: 180, presented_at: "2026-08-15T09:00:00Z", attendance_verification_method: "CERTIFICATE", credit_allocations: [ { category: "GENERAL", minutes: 180 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { c1: $.data.id }
            - call: "POST /cle/courses"
              payload: { title: "Second Pending Course", delivery_format: "ON_DEMAND", total_minutes: 180, presented_at: "2026-08-16T09:00:00Z", attendance_verification_method: "CERTIFICATE", credit_allocations: [ { category: "GENERAL", minutes: 180 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { c2: $.data.id }
            - call: "POST /cle/courses/${c1}/applications"
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { app_1: $.data.id }
          trigger:
            - call: "POST /cle/courses/${c1}/applications"
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              expect_error: ERR_DUPLICATE_APPLICATION
            - call: "POST /cle/courses/${c2}/applications"
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { app_2: $.data.id }
          assert:
            - "Trigger call 1 returned HTTP 409 ERR_DUPLICATE_APPLICATION — application ${app_1} is still non-terminal"
            - "Trigger call 2 returned HTTP 201 for the sponsor's other course"
            - "GET /cle/courses/${c1}/applications returns exactly one row (${app_1}) and GET /cle/courses/${c2}/applications returns exactly one row (${app_2})"
            - "Both courses are still PENDING_APPROVAL"

      - name: an_audit_with_no_eligible_course_in_its_window_cannot_draw_a_sample
        claim_type: violation_to_error
        grounds:
          - errors[ERR_NO_SAMPLE_POPULATION]
          - calculations.audit_sample_selection
          - state_machines.ProviderAudit.OPENED_to_SAMPLED
          - endpoints[POST /cle/provider-audits/{id}/audit-actions]
        distinguishing_aspect: "The provider does own a sampleable course — it simply falls outside the audit's closed window — so the empty pool is a property of the window, not of the provider; the refusal leaves the audit in OPENED with sample_size 0, sampled_course_ids empty and its version untouched, and repeating it is equally refused."
        test_recipe:
          setup:
            - "One ACCREDITED self-certifying provider whose only course is presented in 2027, and one audit whose closed window is calendar 2026."
          setup_api_calls:
            - call: "POST /cle/providers"
              payload: { name: "Off Window Academy", provider_type: "LAW_SCHOOL" }
              as: BoardAdmin
              captures: { prov_id: $.data.id, prov_v1: $.data.version }
            - call: "POST /cle/providers/${prov_id}/accreditation-actions"
              payload: { action: "GRANT_FULL", expected_provider_version: "${prov_v1}" }
              as: BoardAdmin
            - call: "POST /cle/courses"
              payload: { title: "Next Year Recorded Programme", delivery_format: "ON_DEMAND", total_minutes: 300, presented_at: "2027-05-01T09:00:00Z", attendance_verification_method: "CERTIFICATE", credit_allocations: [ { category: "GENERAL", minutes: 300 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { course_id: $.data.id }
            - call: "POST /cle/provider-audits"
              payload: { provider_id: "${prov_id}", audit_period_start: "2026-01-01T00:00:00Z", audit_period_end: "2026-12-31T00:00:00Z", trigger_type: "RANDOM" }
              as: BoardAdmin
              captures: { audit_id: $.data.id, audit_v1: $.data.version }
          trigger:
            - call: "POST /cle/provider-audits/${audit_id}/audit-actions"
              payload: { action: "DRAW_SAMPLE", expected_audit_version: "${audit_v1}" }
              as: BoardAdmin
              expect_error: ERR_NO_SAMPLE_POPULATION
            - call: "POST /cle/provider-audits/${audit_id}/audit-actions"
              payload: { action: "DRAW_SAMPLE", expected_audit_version: "${audit_v1}" }
              as: BoardAdmin
              expect_error: ERR_NO_SAMPLE_POPULATION
          assert:
            - "Both trigger calls returned HTTP 409 ERR_NO_SAMPLE_POPULATION"
            - "ProviderAudit.${audit_id}.status == 'OPENED', sample_size == 0, sampled_course_ids == [] and version is still ${audit_v1} — the second call succeeded in staying stale-free precisely because the first wrote nothing"
            - "ProviderAudit.${audit_id}.risk_score_at_open == 0.0 (frozen at creation for a provider with no history)"
            - "Provider.${prov_id}.courses_sampled_lifetime == 0"
            - "Course.${course_id}.status == 'APPROVED' — the course exists and is sampleable, just not inside 2026"

      - name: findings_cannot_exceed_the_sample_and_a_findings_heavy_audit_cannot_be_cleared
        claim_type: violation_to_error
        grounds:
          - errors[ERR_FINDINGS_EXCEED_SAMPLE]
          - errors[ERR_INVALID_STATE_TRANSITION]
          - validations[priority 72 -> ERR_FINDINGS_EXCEED_SAMPLE]
          - state_machines.ProviderAudit.SAMPLED_to_FINDINGS_ISSUED
          - state_machines.ProviderAudit.FINDINGS_ISSUED_to_CLEARED
          - domain_constants.AUDIT_CLEAR_MAX_FINDINGS
          - domain_constants.AUDIT_SANCTION_FEE_CENTS
        distinguishing_aspect: "Two different refusals bracket one audit: a findings_count above the drawn sample_size is the priority-72 constraint error, and CLOSE_CLEARED on an audit with 2 findings is ERR_INVALID_STATE_TRANSITION because that transition's only unmet condition is a data precondition with no dedicated error id — after which CLOSE_SANCTIONED succeeds and bills the sanction fee."
        test_recipe:
          setup:
            - "One ACCREDITED self-certifying provider with two APPROVED courses inside a 2026 audit window, and an open audit whose frozen risk score is 0.0 (low tier, target 2)."
          setup_api_calls:
            - call: "POST /cle/providers"
              payload: { name: "Two Course Sponsors", provider_type: "GOVERNMENT" }
              as: BoardAdmin
              captures: { prov_id: $.data.id, prov_v1: $.data.version }
            - call: "POST /cle/providers/${prov_id}/accreditation-actions"
              payload: { action: "GRANT_FULL", expected_provider_version: "${prov_v1}" }
              as: BoardAdmin
            - call: "POST /cle/courses"
              payload: { title: "Spring Recorded Seminar", delivery_format: "ON_DEMAND", total_minutes: 300, presented_at: "2026-03-01T09:00:00Z", attendance_verification_method: "CERTIFICATE", credit_allocations: [ { category: "GENERAL", minutes: 300 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
