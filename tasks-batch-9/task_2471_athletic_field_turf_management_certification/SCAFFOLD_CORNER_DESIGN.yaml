              payload: { field_id: "${f_sy}", requested_by_staff_member_id: "${s_coord}", activity_type: "PRACTICE", window_start_utc: "2026-08-02T10:00:00Z", window_end_utc: "2026-08-02T12:00:00Z", expected_participant_count: 30 }
