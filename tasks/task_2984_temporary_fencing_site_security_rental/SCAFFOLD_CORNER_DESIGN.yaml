          The first §1.2.1 rule is exercised on its own declared write endpoint:
          quoting a jobsite bumps Jobsite.version, so replaying the version that
          was valid one call ago gives 412 ERR_STALE_VERSION, re-reading the
          jobsite and sending the fresh version succeeds, and the counter
          advances on every accepted write rather than on every request. The
          second §1.2.1 rule, reset-order-create-stale-contract, is exercised by
          the endpoints-section instance
