      - name: theoretical_usage_per_line_floor_then_sum
        grounds:
          - calculations.theoretical_usage
          - entities.OrderLine.fields.theoretical_usage_cents
        distinguishing_aspect: |
          theoretical_usage uses nested rounding (mode b): each line applies
          floor(quantity * base_cost * yield_factor) BEFORE summing across lines.
          Summing first then flooring yields a different result when yield factors
          are fractional (0.85 for DOUGH). The scaffold pins the rounding order
          explicitly: floor per line, then sum.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Center ACTIVE. One product dough base_cost=334c."
            - "PO has 3 dough lines each quantity=1. Per-line floor: 283 each, sum = 849."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SupplyChainAdmin
            - call: "POST /supply-centers"
              payload: { center_code: "SC-01", display_name: "Midwest Center", base_weekly_capacity_units: 100000 }
              as: SupplyChainAdmin
              captures: { center_id: $.data.id, center_v: $.data.version }
            - call: "POST /supply-centers/${center_id}/activate"
              payload: {}
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/products"
              payload: { sku: "DOUGH-X", name: "Dough X", category: "DOUGH", base_cost_cents_per_unit: 334 }
              as: SupplyChainAdmin
              captures: { product_id: $.data.id, product_v: $.data.version }
            - call: "GET /supply-centers/${center_id}"
              payload: {}
              as: Any
              captures: { center_v_fresh: $.data.version }
            - call: "POST /supply-centers/${center_id}/price-books"
              payload: { product_id: "${product_id}", store_tier: "STANDARD", markup_pct: 0.15, min_quantity: 1, effective_from: "2026-01-01T00:00:00Z", effective_until: "2027-01-01T00:00:00Z", expected_center_version: "${center_v_fresh}" }
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/stores"
              payload: { store_number: "ST-T", operator_name: "T Corp", credit_limit_cents: 100000000 }
              as: SupplyChainAdmin
              captures: { store_id: $.data.id, store_v: $.data.version }
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/activate"
              payload: {}
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/purchase-orders"
              payload: { week_start_date: "2026-09-07T00:00:00Z" }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { po_id: $.data.id, po_v: $.data.version }
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/purchase-orders/${po_id}/lines"
              payload: { product_id: "${product_id}", quantity: 1 }
              as: StoreManager
              as_user_id: "${store_id}"
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/purchase-orders/${po_id}/lines"
              payload: { product_id: "${product_id}", quantity: 1 }
              as: StoreManager
              as_user_id: "${store_id}"
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/purchase-orders/${po_id}/lines"
              payload: { product_id: "${product_id}", quantity: 1 }
              as: StoreManager
              as_user_id: "${store_id}"
          trigger:
            - call: "GET /supply-centers/${center_id}/stores/${store_id}"
              payload: {}
              as: Any
              captures: { store_v_fresh: $.data.version }
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/purchase-orders/${po_id}/submit"
              payload: { expected_store_version: "${store_v_fresh}" }
              as: StoreManager
              as_user_id: "${store_id}"
          assert:
            - "PurchaseOrder.${po_id}.theoretical_usage_cents == 849"
            - "PurchaseOrder.${po_id}.theoretical_usage_cents != 851"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: store_suspension_cycle
        grounds:
          - state_machines.Store
          - entities.Store.fields.status
        distinguishing_aspect: |
          Store has a cyclic state machine: ACTIVE → SUSPENDED → ACTIVE → SUSPENDED
          with no fixed cycle limit. The cycle closes (SUSPENDED → ACTIVE) only when
          outstanding_balance drops below credit_limit, making cycle termination
          conditional on financial state, not on a counter. This is a true cycle
          (A→B→A), not a linear pipeline.
        test_recipe:
          setup:
            - "Center ACTIVE. One Store ACTIVE with credit_limit=50000c."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SupplyChainAdmin
            - call: "POST /supply-centers"
              payload: { center_code: "SC-01", display_name: "Center", base_weekly_capacity_units: 100000 }
              as: SupplyChainAdmin
              captures: { center_id: $.data.id, center_v: $.data.version }
            - call: "POST /supply-centers/${center_id}/activate"
              payload: {}
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/stores"
              payload: { store_number: "ST-CYC", operator_name: "Cyc", credit_limit_cents: 50000 }
              as: SupplyChainAdmin
              captures: { store_id: $.data.id, store_v: $.data.version }
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/activate"
              payload: {}
              as: SupplyChainAdmin
          trigger:
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/suspend"
              payload: { reason: "manual test" }
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/activate"
              payload: {}
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/suspend"
              payload: { reason: "cycle test" }
              as: SupplyChainAdmin
          assert:
            - "Store.${store_id}.status == SUSPENDED after third call"
            - "Store can cycle ACTIVE↔SUSPENDED multiple times — no cycle counter blocks re-entry"

      - name: purchase_order_branching_terminal_paths
        grounds:
          - state_machines.PurchaseOrder
          - entities.PurchaseOrder.fields.status
        distinguishing_aspect: |
          PurchaseOrder has a branching fork-join state machine: SUBMITTED forks
          into {CONFIRMED, REJECTED, CANCELLED} with divergent side-effect sets.
          CONFIRMED continues to LOADED/DELIVERED/SETTLED (rebate accrued, balance
          updated, variance computed) while REJECTED and CANCELLED terminate with
          NO financial side effects. The branch choice is observable in
          RebateLedger and Store.outstanding_balance_cents.
        test_recipe:
          setup:
            - "Center ACTIVE. Store ACTIVE. Three POs in SUBMITTED status with identical totals (100000c each)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SupplyChainAdmin
            - call: "POST /supply-centers"
              payload: { center_code: "SC-01", display_name: "Center", base_weekly_capacity_units: 100000 }
              as: SupplyChainAdmin
              captures: { center_id: $.data.id, center_v: $.data.version }
            - call: "POST /supply-centers/${center_id}/activate"
              payload: {}
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/products"
              payload: { sku: "P1", name: "P1", category: "DOUGH", base_cost_cents_per_unit: 1000 }
              as: SupplyChainAdmin
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - call: "GET /supply-centers/${center_id}"
              payload: {}
              as: Any
              captures: { center_v_fresh: $.data.version }
            - call: "POST /supply-centers/${center_id}/price-books"
              payload: { product_id: "${prod_id}", store_tier: "STANDARD", markup_pct: 0.0, min_quantity: 1, effective_from: "2026-01-01T00:00:00Z", effective_until: "2027-01-01T00:00:00Z", expected_center_version: "${center_v_fresh}" }
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/stores"
              payload: { store_number: "ST-B", operator_name: "B", credit_limit_cents: 100000000 }
              as: SupplyChainAdmin
              captures: { store_id: $.data.id, store_v: $.data.version }
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/activate"
              payload: {}
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/purchase-orders"
              payload: { week_start_date: "2026-09-07T00:00:00Z" }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { po1: $.data.id, po1_v: $.data.version }
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/purchase-orders/${po1}/lines"
              payload: { product_id: "${prod_id}", quantity: 100 }
              as: StoreManager
              as_user_id: "${store_id}"
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/purchase-orders"
              payload: { week_start_date: "2026-09-07T00:00:00Z" }
              as: StoreManager
