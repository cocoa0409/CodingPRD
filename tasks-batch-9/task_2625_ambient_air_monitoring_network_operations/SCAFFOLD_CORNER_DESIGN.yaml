      - name: network_adequacy_score_of_exactly_90_is_adequate
        claim_type: weighted_scoring
        grounds:
          - calculations.network_adequacy_score
          - calculations.network_adequacy_score.constants
          - entities.NetworkAssessment.fields.adequacy_tier
        distinguishing_aspect: "A 400000-population network with one OPERATING site of each required type reaches coverage_ratio 1.0 and, with exactly one QC_DELINQUENT monitor, scores 100 * 1.0 * 0.9 * 1.0 == 90.0, which lands in ADEQUATE because the band's lower bound is inclusive."
        test_recipe:
          setup:
            - "one network of metropolitan_population 400000 requiring 1 population-oriented site"
            - "three OPERATING sites - POPULATION_ORIENTED, SOURCE_ORIENTED at 300 m from the source, BACKGROUND at 150 m from the roadway - none with siting violations"
            - "one APPROVED monitor installed 2025-01-01 with no span check, so it is QC_DELINQUENT at the 2026-01-05 clock"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /pollutants"
