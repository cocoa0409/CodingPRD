              as: PlatformAdmin
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /subscriptions"
              payload: { subscriber_email: "kai@example.com", subscriber_birth_date: "1990-03-11T00:00:00.000Z", preferred_recipe_id: "${rec_id}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id is ERR_VALIDATION with HTTP 400"
            - "Subscription.${sub_id}.status == ACTIVE"
            - "GET /subscriptions with status=ACTIVE returns exactly 1 row"

      - name: ingredient_expiry_buffer_is_strict_on_the_boundary_day
        claim_type: Conditional validation
        grounds:
          - validations[priority=46]
          - constants.INGREDIENT_EXPIRY_BUFFER_DAYS
          - errors[ERR_INGREDIENT_EXPIRED]
        distinguishing_aspect: "At clock 2026-05-01 a lot expiring exactly on 2026-05-08 is refused because the expiry must be STRICTLY after clock + 7 days, while a lot expiring 2026-05-09 is accepted."
        test_recipe:
          setup: ["Clock at its 2026-05-01T00:00:00Z default; one batch in F1_ACTIVE; two TEA lots expiring 2026-05-08 and 2026-05-09."]
          setup_api_calls:
            - call: "POST /recipes"
              payload: { name: "House Ginger", style: "KOMBUCHA", target_ph_ceiling: 3.5, planned_f1_days: 6, planned_f2_days: 3, base_gravity_brix: 7.0, intended_abv_class: "NON_ALCOHOLIC" }
              as: ProductionOperator
              captures: { rec_id: $.data.id }
            - call: "POST /scoby-cultures"
              payload: { label: "Mother Z" }
              as: ProductionOperator
              captures: { sc_id: $.data.id }
            - call: "POST /vessels"
              payload: { code: "FV-28", capacity_liters: 500.0 }
              as: ProductionOperator
              captures: { v_id: $.data.id }
            - call: "POST /vessels/${v_id}/cip-start"
              payload: {}
              as: ProductionOperator
            - call: "POST /vessels/${v_id}/cip-complete"
              payload: {}
              as: ProductionOperator
            - call: "POST /batches"
              payload: { batch_code: "B-28001", recipe_id: "${rec_id}", scoby_culture_id: "${sc_id}", vessel_id: "${v_id}", pitched_liters: 400.0, planned_f2_days: 3 }
              as: ProductionOperator
              captures: { b_id: $.data.id }
            - call: "POST /ingredient-lots"
              payload: { ingredient_type: "TEA", supplier_lot_code: "TEA-EDGE", received_on_date: "2026-04-20T00:00:00.000Z", expiry_date: "2026-05-08T00:00:00.000Z", quantity_received: 20.0 }
              as: ProductionOperator
              captures: { il_edge: $.data.id }
            - call: "POST /ingredient-lots"
              payload: { ingredient_type: "TEA", supplier_lot_code: "TEA-OK", received_on_date: "2026-04-20T00:00:00.000Z", expiry_date: "2026-05-09T00:00:00.000Z", quantity_received: 20.0 }
              as: ProductionOperator
              captures: { il_ok: $.data.id }
          trigger:
            - call: "POST /batches/${b_id}/ingredient-uses"
              payload: { ingredient_lot_id: "${il_edge}", quantity_used: 5.0 }
              as: ProductionOperator
              captures: { err: $.data.error_id }
            - call: "POST /batches/${b_id}/ingredient-uses"
              payload: { ingredient_lot_id: "${il_ok}", quantity_used: 5.0 }
              as: ProductionOperator
              captures: { use_id: $.data.id }
          assert:
            - "the first trigger's error_id is ERR_INGREDIENT_EXPIRED with HTTP 422"
            - "the second trigger returns HTTP 201"
            - "IngredientLot.${il_edge}.quantity_consumed == 0"
            - "IngredientLot.${il_edge}.status == AVAILABLE"
            - "IngredientLot.${il_ok}.quantity_consumed == 5.0"
            - "IngredientLot.${il_ok}.quantity_available == 15.0"
            - "IngredientLot.${il_ok}.status == PARTIALLY_CONSUMED"
            - "BatchIngredientUse.${use_id}.voided == false"

      - name: a_pagination_limit_above_the_maximum_is_refused
        claim_type: Violation → Error
        grounds:
          - validations[priority=21]
          - response_envelope.pagination_defaults
        distinguishing_aspect: "limit=101 exceeds PAGINATION_MAX_LIMIT (100) and is refused with ERR_VALIDATION rather than silently clamped."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /finished-lots?limit=101"
              payload: {}
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id is ERR_VALIDATION with HTTP 400"

