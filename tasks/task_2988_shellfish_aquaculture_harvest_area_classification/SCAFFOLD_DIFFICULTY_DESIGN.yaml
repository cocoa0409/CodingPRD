  - rule_id: priority_pair_validation_conflict
    instances:

      - name: reopen_prohibited_area_before_window_returns_safety_over_temporal
        grounds:
          - validations[priority=41]
          - validations[priority=51]
          - validations[priority=61]
          - state_machines.GrowingArea.APPROVED_to_PROHIBITED
          - calculations.area_reopen_eligibility
        distinguishing_aspect: |
          The conflicting pair spans business_safety (priority 41, ERR_AREA_PROHIBITED) against
          business_temporal (priority 51, ERR_REOPEN_TOO_EARLY) with a third business_constraint rule
          (priority 61, ERR_INSUFFICIENT_CLEAN_SAMPLES) also violated; all three carry HTTP 409, so only
          the priority number can decide, and the response must be ERR_AREA_PROHIBITED.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z."
            - "GrowingArea GA-114 with rainfall_closure_hours 96, reopen_sample_count_required 3, clean_sample_mpn_limit 14.0."
            - "Five ACCEPTED WaterSamples of fecal_coliform_mpn 200 collected 2026-07-01..2026-07-05; on the fifth the sample sweep fires (geometric_mean_mpn 200.0 > 14.0, eligible_classification PROHIBITED)."
