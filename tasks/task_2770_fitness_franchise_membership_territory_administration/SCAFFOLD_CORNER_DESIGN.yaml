          rationale: "The named §1.8 instance triggers ERR_TERRITORY_ENCROACHMENT on a relocation approval at a slack of -0.425 km."

      - name: corner_error_relocation_revision_limit_is_reachable
        claim_type: violation_to_error
        grounds:
          - errors.ERR_RELOCATION_REVISION_LIMIT
        excluded_because:
          difficulty_instance: non_linear_state_machine / relocation_request_cycles_through_changes_requested_until_revision_limit
          rationale: "The named §1.8 instance drives revision_count to the RELOCATION_REVISION_LIMIT of 2 and asserts ERR_RELOCATION_REVISION_LIMIT on the next resubmission."

