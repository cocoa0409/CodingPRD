              captures: { g_id: $.data.id }
            - call: "POST /campers"
              payload: { full_name: "Kid", age: 10, gender: "BOY" }
              as: Guardian
              as_user_id: "${g_id}"
              captures: { c_id: $.data.id }
            - call: "POST /health-forms"
              payload: { camper_id: "${c_id}" }
              as: Guardian
              as_user_id: "${g_id}"
              captures: { hf_id: $.data.id }
            - call: "POST /health-forms/${hf_id}/submit"
              payload: {}
              as: Guardian
              as_user_id: "${g_id}"
            - call: "POST /applications"
              payload: { camper_id: "${c_id}", session_id: "${sess_id}" }
              as: Guardian
              as_user_id: "${g_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Guardian
              as_user_id: "${g_id}"
          trigger:
            - call: "POST /applications/${app_id}/withdraw"
              payload: {}
              as: Guardian
              as_user_id: "${g_id}"
            - call: "GET /sessions/${sess_id}"
              payload: {}
              as: CampDirector
              captures: { cc: $.data.committed_count }
          assert:
            - "Session.${sess_id}.committed_count == 0"
            - "Session.${sess_id}.waitlist_length == 0"

      - name: cascade_deposit_paid_withdraw_reverses_payment_and_frees_bunk_excluded
        claim_type: cascading_side_effects
        grounds:
          - "state_machines.Application.ENROLLED_to_WITHDRAWN"
        excluded_because:
          difficulty_instance: transitive_cascade / withdraw_enrolled_cascades_occupancy_staffable_posture_depth3
          rationale: "The withdraw cascade over occupancy/staffable/posture is the depth-3 §1.8 cascade instance."

      - name: dual_variant_balance_divergence_excluded
        claim_type: dual_variant_calculation
        grounds:
          - "calculations.estimated_balance"
          - "calculations.settled_balance"
        excluded_because:
          difficulty_instance: dual_variant_calc / estimated_vs_settled_balance_with_pending_aid
          rationale: "Estimated-vs-settled divergence with pending aid is the §1.8 dual-variant instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_balances_visible_in_same_response
        claim_type: immediate
        grounds:
          - "calculations.settled_balance"
          - "entities.Application.fields.settled_balance_cents"
        distinguishing_aspect: "Immediate consistency: the pay-deposit response itself already reflects settled_balance_cents=345000 and deposit_paid_cents=25000 (no re-read needed) on a 370000 early-tier application."
        test_recipe:
          setup:
            - "Application OFFERED (list_tuition 370000, clock 2026-04-01 early tier)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: CampDirector
            - call: "POST /camps"
              payload: { name: "C", deposit_cents: 25000 }
              as: CampDirector
              captures: { camp_id: $.data.id }
            - call: "POST /camps/${camp_id}/sessions"
              payload: { name: "S", starts_on: "2026-07-01T00:00:00Z", ends_on: "2026-07-14T00:00:00Z", visiting_day_on: "2026-07-07T00:00:00Z", capacity: 10 }
              as: CampDirector
              captures: { sess_id: $.data.id, sess_v0: $.data.version }
            - call: "POST /sessions/${sess_id}/cabins"
              payload: { name: "Birch", gender_band: "BOYS", min_age: 8, max_age: 12, bunk_capacity: 6 }
              as: CampDirector
            - call: "POST /sessions/${sess_id}/open-enrollment"
              payload: { expected_session_version: "${sess_v0}" }
              as: CampDirector
            - call: "POST /guardians/register"
              payload: { email: "im@x.com", full_name: "IM", phone: "555-2800" }
              as: Anonymous
              captures: { g_id: $.data.id }
            - call: "POST /campers"
              payload: { full_name: "Kid", age: 10, gender: "BOY" }
              as: Guardian
              as_user_id: "${g_id}"
              captures: { c_id: $.data.id }
            - call: "POST /health-forms"
              payload: { camper_id: "${c_id}" }
              as: Guardian
              as_user_id: "${g_id}"
              captures: { hf_id: $.data.id }
            - call: "POST /health-forms/${hf_id}/submit"
              payload: {}
              as: Guardian
              as_user_id: "${g_id}"
            - call: "POST /applications"
              payload: { camper_id: "${c_id}", session_id: "${sess_id}" }
              as: Guardian
              as_user_id: "${g_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Guardian
              as_user_id: "${g_id}"
          trigger:
            - call: "POST /applications/${app_id}/pay-deposit"
              payload: { amount_cents: 25000 }
              as: Guardian
              as_user_id: "${g_id}"
              captures: { sb: $.data.settled_balance_cents, dp: $.data.deposit_paid_cents }
          assert:
            - "Application.${app_id}.settled_balance_cents == 345000"
            - "Application.${app_id}.deposit_paid_cents == 25000"
