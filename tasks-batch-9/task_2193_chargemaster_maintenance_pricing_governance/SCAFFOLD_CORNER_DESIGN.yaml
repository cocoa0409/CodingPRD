      - name: request_state_ladder_rejects_early_implement_early_resubmit_and_a_stale_pin
        claim_type: violation_to_error
        grounds:
          - errors[ERR_INVALID_REQUEST_STATE]
          - errors[ERR_INVALID_ITEM_PRICE_STATE]
          - errors[ERR_PINNED_VERSION_STALE]
          - validations[priority=13]
          - validations[priority=30]
          - state_machines.ChangeRequest
          - endpoints[POST /chargemaster/change-requests/{change_request_id}/resubmit]
          - endpoints[POST /chargemaster/change-requests/{change_request_id}/implement]
        distinguishing_aspect: "The priority-13 rank is split by target entity, so the SAME endpoint pair splits its state error two ways: /decisions and /resubmit report ERR_INVALID_REQUEST_STATE, while /implement reports ERR_INVALID_ITEM_PRICE_STATE — implementing a merely SUBMITTED request therefore fails on the ITEM's price_status (still PRICED_CURRENT), because only approval drives the item into REPRICE_PENDING. Once approved, a version bump that leaves price_status alone (DEACTIVATE) isolates priority 30: ERR_PINNED_VERSION_STALE fires, the pin is NOT refreshed, and the request stays APPROVED."
        test_recipe:
          setup:
