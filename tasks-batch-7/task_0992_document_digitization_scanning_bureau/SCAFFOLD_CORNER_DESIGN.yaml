            - { call: "POST /batches/${bid}/scan-sessions", payload: { scanner_id: "${sc2}" }, as: ScanOperator, as_user_id: "scan-1", captures: { ss2: $.data.id } }
          trigger:
            - { call: "POST /batches/${bid}/submit-qa", payload: {}, as: ScanOperator, as_user_id: "scan-1", captures: { err: $.data.error_id } }
            - { call: "POST /scan-sessions/${ss2}/void", payload: {}, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "POST /batches/${bid}/submit-qa", payload: {}, as: ScanOperator, as_user_id: "scan-1", captures: { bstat: $.data.status } }
          assert:
            - "with OPEN session: ${err} == ERR_OPEN_SCAN_SESSION_EXISTS"
            - "after void: submit-qa succeeds and ${bstat} == QA"

      - name: error_max_boxes_exceeded
        claim_type: violation_to_error
        grounds: ["errors[ERR_MAX_BOXES_EXCEEDED]"]
        distinguishing_aspect: "The agreement's max_boxes_per_batch (2) is a hard intake ceiling; the third box create is rejected."
        test_recipe:
          setup: ["client + agreement with max_boxes_per_batch 2; INTAKE batch with 2 boxes"]
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "BoxCap Co", hipaa_covered: false }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /clients/${cid}/service-agreements", payload: { price_tier: "STANDARD", rush_multiplier: 1.75, storage_free_days: 10, storage_daily_rate_cents: 55, retention_days: 30, max_boxes_per_batch: 2 }, as: PlatformAdmin }
            - { call: "POST /batches", payload: { client_id: "${cid}", priority: "STANDARD" }, as: IntakeClerk, as_user_id: "clerk-1", captures: { bid: $.data.id } }
            - { call: "POST /batches/${bid}/boxes", payload: { box_label: "BX-1", intake_weight_grams: 100 }, as: IntakeClerk, as_user_id: "clerk-1" }
