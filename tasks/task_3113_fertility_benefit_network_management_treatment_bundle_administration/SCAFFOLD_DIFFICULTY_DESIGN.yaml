            - "GET /treatment-cycles?treatment_plan_id=${p19} returns exactly 1 row after the refusal, so the refused cycle was never persisted"
            - "the second creation succeeds after the clock advances exactly one day, and TreatmentCycle.${cy19b}.cycle_index == 2"
            - "the boundary is spacing - 1 against spacing: at exactly 14 whole days the interval is admitted, at 13 it is refused"
            - "TreatmentPlan.${p19}.min_inter_cycle_days == 14 — the buffer is a plan-level field, not a global default"
            - "TreatmentCycle.${cy19a}.cycle_status == OUTCOME_RECORDED and TreatmentCycle.${cy19a}.consumption_marker == CONSUMED throughout"

      - name: surrender_route_overlap_adjacent_intervals_with_retention_extension
        grounds:
          - state_machines.SurrenderRoute.SUBMITTED_to_ROUTED
          - state_machines.SurrenderRoute.ROUTED_to_RETIRED
          - validations[priority=11]
          - errors[ERR_SURRENDER_ROUTE_CONFLICT]
          - entities.SurrenderRoute.fields.route_from
        distinguishing_aspect: "A different interval semantics on a different resource: surrender-route occupancy is CLOSED at the end and EXTENDED by a storage retention tail, so a route starting on the exact instant a prior route ends is refused — the opposite adjacency treatment from the cycle-spacing instance's half-open buffer, and the tail means the occupied interval is [route_from, route_to + STORAGE_RETENTION_DAYS) rather than [route_from, route_to)."
