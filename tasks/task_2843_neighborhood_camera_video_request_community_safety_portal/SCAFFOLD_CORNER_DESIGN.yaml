              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { rep_id: "$.data.id", rep_variant0: "$.data.variant", rep_prov: "$.data.provisional_share_rate_bps", rep_cert: "$.data.certified_share_rate_bps", rep_pub0: "$.data.published_share_rate_bps", rep_by: "$.data.compiled_by_user_id", rep_v0: "$.data.version" }
          trigger:
            - call: "POST /neighborhood-safety/transparency-reports/${rep_id}/certify"
              payload: { certification_note: "Figures reconciled against the dispatch log." }
              as: PlatformAdmin
              as_user_id: "admin-2"
              captures: { rep_variant1: "$.data.variant", rep_pub1: "$.data.published_share_rate_bps", rep_at: "$.data.certified_at", rep_cert_by: "$.data.certified_by_user_id", rep_v1: "$.data.version" }
            - call: "POST /neighborhood-safety/transparency-reports/${rep_id}/certify"
