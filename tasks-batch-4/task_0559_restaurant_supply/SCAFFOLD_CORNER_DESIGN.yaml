  - section: rbac
    instances:
      - name: buyer_cannot_create_product_forbidden
        claim_type: rbac_denial
        grounds:
          - roles.WarehouseOps
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
        distinguishing_aspect: "A Buyer calling POST /products (WarehouseOps-exclusive) is denied with ERR_INSUFFICIENT_PERMISSIONS."
        test_recipe:
          setup: ["An account (to act as a Buyer)."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { business_name: "RB Co", credit_terms: "NET_30", credit_limit_cents: 100000 }
