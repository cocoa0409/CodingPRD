            - "Container.${cont_id}.status == EMPTIED throughout the loop"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: container_create_category_flip_report_recompute
        grounds:
          - state_machines.Container.null_to_IN_CENTRAL_ACCUMULATION
          - calculations.monthly_generated_kg
          - calculations.generator_category
          - calculations.biennial_report_fee_cents
        distinguishing_aspect: |
          Depth-3 cascade from POST /hazwaste/containers: container creation adds
          to site.current_month_generated_kg (hop 1); the total crossing 1000.0 kg
          flips site.generator_category VSQG->LQG (hop 2); the flip recomputes
          category_snapshot and provisional_fee_cents on the DRAFT BiennialReport
          (hop 3). Trigger differs from the clock-sweep cascade.
        test_recipe:
          setup:
            - "Clock at 2027-01-05T00:00:00Z; site with ACTIVE stream and central area; zero containers"
            - "DRAFT BiennialReport 2027 already exists with provisional_fee_cents == 25000 (VSQG base, no manifests)"
          setup_api_calls:
            - { call: "POST /hazwaste/_clock/set_current_utc", payload: { to_iso8601: "2027-01-05T00:00:00Z" }, as: EHSManager }
            - { call: "POST /hazwaste/generator-sites", payload: { name: "Site A", epa_id_number: "EPA-SITE-A" }, as: EHSManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /hazwaste/waste-streams", payload: { site_id: "${site_id}", name: "spent solvent", waste_codes: ["D001"], physical_state: "LIQUID" }, as: WasteCoordinator, captures: { stream_id: "$.data.id", stream_v: "$.data.version" } }
            - { call: "POST /hazwaste/waste-streams/${stream_id}/characterize", payload: { is_hazardous: true, waste_codes: ["D001"], ldr_treatment_standard: "TLV-01", flash_point_c: 21.5, expected_waste_stream_version: "${stream_v}" }, as: WasteCoordinator }
            - { call: "POST /hazwaste/waste-streams/${stream_id}/activate", as: EHSManager }
            - { call: "POST /hazwaste/accumulation-areas", payload: { site_id: "${site_id}", name: "Central A", area_type: "CENTRAL_90DAY" }, as: WasteCoordinator, captures: { area_id: "$.data.id" } }
            - { call: "POST /hazwaste/biennial-reports", payload: { site_id: "${site_id}", report_year: 2027 }, as: EHSManager, captures: { rep_id: "$.data.id", fee0: "$.data.provisional_fee_cents" } }
          trigger:
            - { call: "POST /hazwaste/containers", payload: { waste_stream_id: "${stream_id}", accumulation_area_id: "${area_id}", quantity_gallons: 10, quantity_kg: 1000.0 }, as: WasteCoordinator, as_user_id: "wc-1", captures: { cont_id: "$.data.id" } }
            - { call: "GET /hazwaste/generator-sites/${site_id}", as: EHSManager }
            - { call: "GET /hazwaste/biennial-reports/${rep_id}", as: EHSManager }
          assert:
            - "Captured fee0 == 25000 (VSQG base before any container)"
            - "GeneratorSite.${site_id}.current_month_generated_kg == 1000.0 (hop 1)"
            - "GeneratorSite.${site_id}.generator_category == LQG (hop 2)"
            - "BiennialReport.${rep_id}.category_snapshot == LQG and provisional_fee_cents == 250000 (hop 3)"
            - "Container.${cont_id}.deadline_days == 90 (created after the flip, LQG allowance)"

      - name: clock_sweep_exception_blocks_new_manifest
        grounds:
          - state_machines.Manifest.IN_TRANSIT_to_EXCEPTION_REQUIRED
          - calculations.manifest_return_window
          - entities.GeneratorSite.fields.open_exception_count
          - validations[priority=24]
        distinguishing_aspect: |
          Depth-2 cascade from POST /hazwaste/_clock/set_current_utc: the sweep
          moves the overdue manifest IN_TRANSIT -> EXCEPTION_REQUIRED (hop 1);
          that transition increments site.open_exception_count (hop 2), which
          gates new manifest creation. Different triggering transition than the
          container-create cascade.
        test_recipe:
          setup:
            - "Default clock 2026-08-01T00:00:00Z; manifest shipped 2026-08-01, return_due_at 2026-09-15T00:00:00Z, still IN_TRANSIT"
            - "A second container is STAGED_FOR_SHIPMENT, ready for a follow-up manifest"
          setup_api_calls:
            - { call: "POST /hazwaste/generator-sites", payload: { name: "Site A", epa_id_number: "EPA-SITE-A" }, as: EHSManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /hazwaste/waste-streams", payload: { site_id: "${site_id}", name: "spent solvent", waste_codes: ["D001"], physical_state: "LIQUID" }, as: WasteCoordinator, captures: { stream_id: "$.data.id", stream_v: "$.data.version" } }
            - { call: "POST /hazwaste/waste-streams/${stream_id}/characterize", payload: { is_hazardous: true, waste_codes: ["D001"], ldr_treatment_standard: "TLV-01", flash_point_c: 21.5, expected_waste_stream_version: "${stream_v}" }, as: WasteCoordinator }
            - { call: "POST /hazwaste/waste-streams/${stream_id}/activate", as: EHSManager }
            - { call: "POST /hazwaste/accumulation-areas", payload: { site_id: "${site_id}", name: "Central A", area_type: "CENTRAL_90DAY" }, as: WasteCoordinator, captures: { area_id: "$.data.id" } }
            - { call: "POST /hazwaste/waste-partners", payload: { partner_type: "TRANSPORTER", name: "HaulCo", epa_id_number: "EPA-TR-1", permitted_waste_codes: ["D001"] }, as: ComplianceAuditor, as_user_id: "aud-1", captures: { transp_id: "$.data.id" } }
            - { call: "POST /hazwaste/waste-partners/${transp_id}/status", payload: { to_status: "APPROVED" }, as: ComplianceAuditor, as_user_id: "aud-2" }
            - { call: "POST /hazwaste/waste-partners/${transp_id}/audits", payload: { coverage_from: "2026-01-01T00:00:00Z", coverage_to: "2027-01-01T00:00:00Z", outcome: "PASS" }, as: ComplianceAuditor }
            - { call: "POST /hazwaste/waste-partners", payload: { partner_type: "TSDF", name: "DispCo", epa_id_number: "EPA-TS-1", permitted_waste_codes: ["D001"] }, as: ComplianceAuditor, as_user_id: "aud-1", captures: { tsdf_id: "$.data.id" } }
            - { call: "POST /hazwaste/waste-partners/${tsdf_id}/status", payload: { to_status: "APPROVED" }, as: ComplianceAuditor, as_user_id: "aud-2" }
            - { call: "POST /hazwaste/waste-partners/${tsdf_id}/audits", payload: { coverage_from: "2026-01-01T00:00:00Z", coverage_to: "2027-01-01T00:00:00Z", outcome: "PASS" }, as: ComplianceAuditor }
            - { call: "POST /hazwaste/containers", payload: { waste_stream_id: "${stream_id}", accumulation_area_id: "${area_id}", quantity_gallons: 10, quantity_kg: 100.0 }, as: WasteCoordinator, as_user_id: "wc-1", captures: { c1: "$.data.id" } }
            - { call: "POST /hazwaste/containers/${c1}/label", payload: { label_text: "Hazardous Waste — D001", label_accumulation_start_marked: "2026-08-01T00:00:00Z" }, as: WasteCoordinator, as_user_id: "wc-1" }
            - { call: "POST /hazwaste/containers/${c1}/inspections", payload: { result: "PASS" }, as: WasteCoordinator, as_user_id: "wc-2" }
            - { call: "POST /hazwaste/containers/${c1}/stage", as: WasteCoordinator, as_user_id: "wc-1" }
            - { call: "POST /hazwaste/manifests", payload: { site_id: "${site_id}", transporter_id: "${transp_id}", tsdf_id: "${tsdf_id}", manifest_tracking_number: "MT-500", line_items: [{ waste_stream_id: "${stream_id}", container_id: "${c1}", quantity_kg: 100.0 }] }, as: WasteCoordinator, as_user_id: "wc-1", captures: { man_id: "$.data.id" } }
            - { call: "POST /hazwaste/manifests/${man_id}/ldr-notifications", payload: { treatment_standard_codes: ["TLV-01"], certification_statement: "certified" }, as: EHSManager }
            - { call: "POST /hazwaste/manifests/${man_id}/sign-generator", as: EHSManager, as_user_id: "mgr-9" }
            - { call: "POST /hazwaste/manifests/${man_id}/sign-transporter", as: TransporterAgent, as_user_id: "${transp_id}" }
            - { call: "POST /hazwaste/containers", payload: { waste_stream_id: "${stream_id}", accumulation_area_id: "${area_id}", quantity_gallons: 5, quantity_kg: 50.0 }, as: WasteCoordinator, as_user_id: "wc-1", captures: { c2: "$.data.id" } }
            - { call: "POST /hazwaste/containers/${c2}/label", payload: { label_text: "Hazardous Waste — D001", label_accumulation_start_marked: "2026-08-01T00:00:00Z" }, as: WasteCoordinator, as_user_id: "wc-1" }
            - { call: "POST /hazwaste/containers/${c2}/inspections", payload: { result: "PASS" }, as: WasteCoordinator, as_user_id: "wc-2" }
            - { call: "POST /hazwaste/containers/${c2}/stage", as: WasteCoordinator, as_user_id: "wc-1" }
          trigger:
            - { call: "POST /hazwaste/_clock/set_current_utc", payload: { to_iso8601: "2026-09-16T00:00:00Z" }, as: EHSManager }
            - { call: "GET /hazwaste/manifests/${man_id}", as: EHSManager }
            - { call: "GET /hazwaste/generator-sites/${site_id}", as: EHSManager }
            - { call: "POST /hazwaste/manifests", payload: { site_id: "${site_id}", transporter_id: "${transp_id}", tsdf_id: "${tsdf_id}", manifest_tracking_number: "MT-501", line_items: [{ waste_stream_id: "${stream_id}", container_id: "${c2}", quantity_kg: 50.0 }] }, as: WasteCoordinator, as_user_id: "wc-1", captures: { blocked_err: "$.data.error_id" } }
          assert:
            - "Manifest.${man_id}.status == EXCEPTION_REQUIRED after the sweep (hop 1)"
            - "GeneratorSite.${site_id}.open_exception_count == 1 (hop 2)"
            - "blocked_err == ERR_OPEN_EXCEPTION_BLOCKS_MANIFEST — the counter set by hop 2 gates new manifests"
            - "Container.${c2}.status == STAGED_FOR_SHIPMENT (rejected create leaves containers untouched)"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: sign_generator_state_beats_sod
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_MANIFEST_NOT_DRAFT]
          - errors[ERR_SOD_MANIFEST_SELF_SIGN]
        distinguishing_aspect: |
          Category pair state x business_safety: the second sign attempt fails
          BOTH the DRAFT-state precondition (p7) and the segregation-of-duties
          check (p8, signer == creator); the p7 state error ERR_MANIFEST_NOT_DRAFT
          must win. Distinct pair from the referential x temporal instance.
        test_recipe:
          setup:
            - "Default clock; manifest fully drafted and generator-signed (creator wc-1, signer mgr-9): status GENERATOR_SIGNED"
          setup_api_calls:
            - { call: "POST /hazwaste/generator-sites", payload: { name: "Site A", epa_id_number: "EPA-SITE-A" }, as: EHSManager, captures: { site_id: "$.data.id" } }
