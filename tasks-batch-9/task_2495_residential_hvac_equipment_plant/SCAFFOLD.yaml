  - method: GET
    path: "/plant/refrigerant-programs"
    description: "Lists refrigerant programs."
    roles: [PlantAdmin, DesignEngineer, ReliabilityEngineer, CertificationEngineer, RegulatoryAuditor, SupplyPlanner, ProductionPlanner]
    code: 200
    input: ["status?", "flammability_class?", "limit?", "offset?"]
    output: RefrigerantProgram[]
    side_effects: []
  - method: GET
    path: "/plant/refrigerant-programs/{id}"
    description: "Reads one refrigerant program including its computed affected_platform_count."
    roles: [PlantAdmin, DesignEngineer, ReliabilityEngineer, CertificationEngineer, RegulatoryAuditor, SupplyPlanner, ProductionPlanner]
    code: 200
    input: []
    output: RefrigerantProgram
    side_effects: []
  - method: POST
    path: "/plant/refrigerant-programs/{id}/enter-sell-through"
    description: "Moves a program past its manufacture cutoff into the sell-through window, restricting every released platform on it."
    roles: [PlantAdmin]
    code: 200
    input: []
    output: RefrigerantProgram
    side_effects: ["state_machines.RefrigerantProgram.ACTIVE_to_SELL_THROUGH including the depth-4 cascade: platforms RELEASED -> RESTRICTED, their open build orders -> HOLD_REGULATORY, those lots' ACTIVE warehouse reservations -> RELEASED, and each touched Warehouse.pallets_reserved_current recomputed", "increments RefrigerantProgram.version by 1 and the version of every platform, build order, reservation, and warehouse it touches"]
  - method: POST
    path: "/plant/refrigerant-programs/{id}/expire"
