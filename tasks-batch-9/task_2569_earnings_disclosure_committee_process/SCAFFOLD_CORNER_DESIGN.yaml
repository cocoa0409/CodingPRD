              payload: { full_name: "Pia Finance", function: "FINANCE", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { q_fin1_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_q_id}/members"
              payload: { full_name: "Quin Finance", function: "FINANCE", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { q_fin2_id: $.data.id }
          trigger:
            - call: "POST /disclosure/charters/${charter_p_id}/transitions"
              payload: { action: "ADOPT" }
              as: DisclosureCommitteeChair
              as_user_id: "${p_fin1_id}"
              captures: { err_quorum: $.data.error_id }
            - call: "POST /disclosure/charters/${charter_q_id}/transitions"
              payload: { action: "ADOPT" }
              as: DisclosureCommitteeChair
              as_user_id: "${q_fin1_id}"
              captures: { err_coverage: $.data.error_id }
          assert:
            - "${err_quorum} == ERR_QUORUM_NOT_MET with HTTP 409"
            - "${err_coverage} == ERR_FUNCTION_COVERAGE_GAP with HTTP 409"
            - "DisclosureCommitteeCharter.${charter_p_id}.status == DRAFT and adopted_at_utc == null"
            - "DisclosureCommitteeCharter.${charter_p_id}.active_voting_member_count == 2"
            - "DisclosureCommitteeCharter.${charter_q_id}.status == DRAFT and adopted_at_utc == null"
            - "DisclosureCommitteeCharter.${charter_q_id}.active_voting_member_count == 2"
            - "DisclosureCommitteeCharter.${charter_q_id}.covered_functions == [\"FINANCE\"]"

      - name: open_certification_applies_every_declared_side_effect_of_the_transition
