          assert:
            - "the first trigger call returns 409 with data.error_id == ERR_INVALID_SEASON_STAGE and Season.${se_id}.status is still DRAFT"
            - "the second trigger call returns 409 with data.error_id == ERR_INVALID_MATCH_STATE and Match.${m_id}.play_status is still SCHEDULED"
            - "the third trigger call returns 409 with data.error_id == ERR_INVALID_DISPUTE_STATE and Match.${m_id}.dispute_status is still NONE"
            - "the fourth trigger call returns 409 with data.error_id == ERR_INVALID_APPROVAL_STATE and TitleApproval.${ta_id}.status is still PENDING with decided_at null"
            - "Season.${se_id}.version, Match.${m_id}.version and TitleApproval.${ta_id}.version are all still 1 — a refused transition never bumps version"

