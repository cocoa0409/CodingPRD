              as: ServiceTechnician
              as_user_id: "${tech_id}"
              captures: { verdict: $.data.calibration_verdict }
            - call: "POST /warewashing/service-visits/${visit_id}/submit"
              payload: { repair_confirmed: true }
              as: ServiceTechnician
              as_user_id: "${tech_id}"
            - call: "POST /warewashing/service-visits/${visit_id}/verify"
              payload: { decision: "ACCEPT" }
              as: QualityAuditor
              as_user_id: "auditor-1"
              captures: { visit_final: $.data.visit_status }
            - call: "GET /warewashing/machine-placements/${pl_id}"
              payload: {}
              as: AccountManager
              captures: { csc_c: $.data.cycles_since_calibration, health_c: $.data.operational_status, alerts_c: $.data.open_alert_count }
            - call: "POST /warewashing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T14:00:00Z" }
              as: PlatformAdmin
            - call: "POST /warewashing/machine-placements/${pl_id}/telemetry-readings"
              payload: { reading_at: "2026-08-01T14:00:00Z", cycle_count_total: 20001, wash_temp_f: 160, final_rinse_temp_f: 185, rinse_pressure_psi: 20, source: "DEVICE" }
              as: PlatformAdmin
            - call: "GET /warewashing/machine-placements/${pl_id}"
              payload: {}
              as: AccountManager
              captures: { csc_d: $.data.cycles_since_calibration, health_d: $.data.operational_status, alerts_d: $.data.open_alert_count, last_count: $.data.last_cycle_count }
          assert:
            - "${csc_1} == 19999, ${csc_a} == 19999, ${health_a} == UP and ${alerts_a} == 0 - one cycle short of the threshold"
            - "${csc_b} == 20000 with ${alerts_b} == 1, ${health_b} == DEGRADED, ${alert_total} == 1 and ${sev} == WARNING"
            - "${verdict} == PASS and ${visit_final} == VERIFIED"
            - "${csc_c} == 0, ${alerts_c} == 0 (repair_confirmed resolved the alert) and ${health_c} == UP"
            - "${csc_d} == 1, ${last_count} == 20001, ${alerts_d} == 0 and ${health_d} == UP - the lifetime counter is past 20000 but the since-calibration counter is not"

      - name: the_placement_create_occ_rule_uses_the_agreement_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[placement-create-stale-agreement]
          - errors[ERR_STALE_PARENT_VERSION]
        excluded_because:
          difficulty_instance: placement_agreement_state_error_outranks_credit_hold
          rationale: |
            That §1.8 instance drives POST /warewashing/machine-placements with a stale
            expected_agreement_version alongside two other violations and pins the ladder's answer, which
            covers the placement OCC rule; a_stale_site_version_rejects_the_delivery_without_pricing_it and
            a_stale_dispenser_version_rejects_the_second_calibration_record cover the other two
            concurrency_rules entries in isolation.

      - name: the_expiry_cascade_reaches_four_entities_from_one_write
        claim_type: cascading_side_effects
        grounds:
          - state_machines.ServiceAgreement.status.ACTIVE_to_EXPIRED
          - state_machines.MachinePlacement.placement_status.INSTALLED_to_RETRIEVAL_SCHEDULED
        excluded_because:
          difficulty_instance: cascade_alpha_clock_expiry_reaches_alert_suppression_four_links_deep
          rationale: |
            The §1.8 cascade instances already verify both four-link chains end to end - clock expiry
            through placements, dispensers and alert suppression, and a single CRITICAL reading through
            alert, ticket, placement and site posture - including which links are skipped when a child is
            in the wrong state.

      - name: the_two_consumption_bases_disagree_on_the_same_data
        claim_type: dual_variant_calculation
        grounds:
          - calculations.expected_chemical_consumption
          - calculations.sustainability_savings
        excluded_because:
          difficulty_instance: variance_basis_nameplate_vs_as_calibrated_diverges
          rationale: |
            Both dual-variant calculations are covered at §1.8 depth: NAMEPLATE versus AS_CALIBRATED on
            one variance window, and RATED versus TELEMETRY_MEASURED on one sustainability window, each
            asserting both variants' figures and the delta between them from identical stored state.

  - section: consistency_model
    instances:
      - name: one_ticket_write_exposes_its_whole_cascade_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.dispatch_priority_score
          - state_machines.MachinePlacement.operational_status.UP_to_DOWN
        distinguishing_aspect: |
          Nothing in this API is deferred: the MACHINE_DOWN ticket's own response already carries the
          score and the deadline computed from state that the same request is changing, and the immediately
          following reads show the machine DOWN and the site ELEVATED with no re-fetch loop, no background
          job and no second write. A queued or lazily recomputed derivation would leave the first read
          stale.
        test_recipe:
          setup:
            - "One INSTALLED DT-88 placement on a STANDARD site with the clock at 2026-08-01T12:00:00Z, minute 720, INSIDE the 600..1320 operating window."
          setup_api_calls:
