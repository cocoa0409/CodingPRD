          assert:
            - "HTTP 200 and Asset.${asset_b_id}.status == RETRACTED"
            - "PlaylistItem.${it2_id}.playout_status == CUED"
            - "PlaylistItem.${it2_id}.clearance_status == BLOCKED"
            - "PlaylistItem.${it1_id}.playout_status == SCHEDULED"
            - "PlaylistItem.${it1_id}.clearance_status == CLEARED"
