              payload: { language_pair_id: "${lp_id}" }
              as: PlatformAdmin
            - call: "POST /interpretation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /interpretation/requests"
              payload: { client_id: "${hosp_id}", language_pair_id: "${lp_id}", modality: "PHONE", required_tier: "MEDICAL", scheduling_mode: "ON_DEMAND" }
              as: ClientAccount
              as_user_id: "${hosp_id}"
              captures: { req_id: $.data.id, req_v1: $.data.version }
            - call: "GET /interpretation/requests/${req_id}"
              payload: {}
              as: CoordinatorOps
              captures: { req_v_live: $.data.version }
            - call: "POST /interpretation/requests/${req_id}/dispatch"
              payload: { expected_request_version: "${req_v_live}" }
              as: CoordinatorOps
              captures: { asg_id: $.data.id }
            - call: "POST /interpretation/assignments/${asg_id}/decline"
              payload: {}
              as: Interpreter
