  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: audit_scope_overlap_on_a_single_shared_endpoint_day
        grounds:
          - validations.priority_11
          - errors.ERR_AUDIT_SCOPE_OVERLAP
          - entities.Audit.fields.scope_period_start
          - state_machines.Audit
        distinguishing_aspect: |
          The first audit is driven all the way to CLOSED (its assessment FINAL), which
          releases open_audit_count but keeps its period in the overlap set. A second
          audit scoped 2026-06-30..2026-12-31 shares exactly one endpoint day with
          2026-01-01..2026-06-30 and must be refused with ERR_AUDIT_SCOPE_OVERLAP (409);
          scoping 2026-07-01..2026-12-31 instead is adjacent, not overlapping, and must
          succeed. Half-open comparison logic accepts the shared day.
        test_recipe:
          setup:
            - "The MINI fixture with the clock on 2026-06-30 and a 76192-cent CONSUMABLE purchase, issued 2026-06-30 (protest_deadline_date 2026-08-29)."
            - "The clock is then moved to 2026-08-30 and the assessment finalized, so the first Audit is CLOSED with scope 2026-01-01..2026-06-30 and Taxpayer.open_audit_count is back to 0."
            - "A second THRESHOLD project is run over the same taxpayer to obtain a fresh SELECTED lead, which is converted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-30T00:00:00Z" }
              as: AuditSupervisor
