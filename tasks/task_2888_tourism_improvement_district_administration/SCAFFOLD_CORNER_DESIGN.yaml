            - "the drive opened with assessable_count_snapshot == 2 and assessable_basis_snapshot_cents == 80000000, and a FORMATION drive snapshots required_weighted_pct 0.6000 with required_headcount_pct 0.0000"
            - "after the refusal PetitionDrive.${pool_drive_id}.status is still OPEN with tallied_at null and short_reason NONE, so a pool refusal is not the SHORT_OF_THRESHOLD branch"
            - "after the refusal District.${pd_district_id}.status is still PETITION_CIRCULATING and has not cascaded to FORMATION_FAILED"
            - "the third property is created 201 and District.${pd_district_id}.assessable_business_count == 3 with assessable_basis_cents == 100000000"
            - "the second tally returns 200 with PetitionDrive.${pool_drive_id}.status == QUALIFIED and short_reason NONE"
            - "PetitionDrive.${pool_drive_id}.weighted_support_pct == 0.8000, because the recomputation divides the unchanged 80000000 of signed basis by the live 100000000 pool rather than by the 80000000 snapshot"
            - "PetitionDrive.${pool_drive_id}.headcount_support_pct == 0.6667, because round_half_up(2 / 3, 4) == 0.6667"
            - "the canonical Harbor Bay district is untouched by any of this: the two districts keep separate pools"

      - name: an_exempt_property_holds_no_petition_standing_and_shrinks_the_support_denominator
        claim_type: violation_to_error
        grounds:
          - validations.p80_exempt_business_has_no_petition_standing
          - errors[ERR_BUSINESS_EXEMPT]
          - entities.LodgingBusiness.fields.exempt_status
          - calculations.petition_support.assessable_set
        distinguishing_aspect: |
          Exemption is two things at once: a bar on signing and a reduction of the denominator every
          support figure is measured against. Revising Cove Cottages to GOVERNMENT_OWNED drops the
          assessable pool from 100,000,000 to 95,000,000, so Harbor Grand's single unchanged 60,000,000
          signature climbs from 0.6000 to 0.6316 support — an implementation that keeps exempt properties
          in the denominator reports 0.6000 and one that keeps them in the signer set accepts the refused
          signature.
        test_recipe:
          setup:
            - "canonical district PROPOSED with the four-property roll, FORMATION drive OPEN, b1 has signed"
            - "Cove Cottages then revised to exempt_status GOVERNMENT_OWNED"
          setup_api_calls:
            - *c_clock_form
            - *c_district
            - *c_b1
            - *c_b2
            - *c_b3
            - *c_b4
            - *c_drive
            - *c_sign_b1
            - *c_exempt_b4
          trigger:
            - call: "POST /petition-drives/${pd_id}/signatures"
              payload: { lodging_business_id: "${b4_id}" }
              as: LodgingOperator
              as_user_id: "${b4_id}"
            - call: "POST /petition-drives/${pd_id}/tally"
              payload: {}
              as: DistrictAdministrator
              as_user_id: "admin-01"
          assert:
            - "the signature attempt returns 409 with data.error_id == ERR_BUSINESS_EXEMPT"
            - "the refusal is not ERR_BUSINESS_OUTSIDE_BOUNDARY: ZONE_PERIMETER is a member of District.included_zones, so only the exemption bars this signer"
            - "LodgingBusiness.${b4_id}.status == EXEMPT with exempt_status == GOVERNMENT_OWNED"
            - "District.${d_id}.assessable_business_count == 3 and District.${d_id}.assessable_basis_cents == 95000000"
            - "PetitionDrive.${pd_id}.valid_signature_count is still 1 and GET /petition-drives/${pd_id}/signatures returns exactly one row"
            - "the tally returns 200 with PetitionDrive.${pd_id}.status == QUALIFIED"
            - "PetitionDrive.${pd_id}.weighted_support_pct == 0.6316, because round_half_up(60000000 / 95000000, 4) == 0.6316 on the shrunken pool"
            - "PetitionDrive.${pd_id}.headcount_support_pct == 0.3333, because round_half_up(1 / 3, 4) == 0.3333, and the drive still qualifies since a FORMATION drive requires 0.0000 headcount"

      - name: a_remittance_may_be_reversed_once_and_the_second_reversal_is_refused
        claim_type: violation_to_error
        grounds:
          - validations.p80_remittance_reversed_at_most_once
          - errors[ERR_REMITTANCE_ALREADY_REVERSED]
          - state_machines.Remittance.APPLIED_to_REVERSED
          - state_machines.AssessmentStatement.payment_status.PARTIALLY_PAID_to_UNPAID
          - calculations.remittance_waterfall
        distinguishing_aspect: |
          Idempotence is not enough here: the second reversal must be an error rather than a no-op,
          because a silent second reversal in an implementation that recomputes rather than compensates
          would double-credit the payer. The assertion set pins the money on both sides of the refusal —
          the statement's principal bucket and District.collected_to_date_cents must read identically
          before and after the refused call.
        test_recipe:
          setup:
            - "canonical district ACTIVE, st1 filed 824,500 unpaid, st2 filed 340,000 with a single APPLIED 300,000 remittance"
          setup_api_calls:
            - *c_clock_form
            - *c_district
            - *c_b1
            - *c_b2
            - *c_b3
            - *c_b4
            - *c_drive
            - *c_sign_b1
            - *c_tally
            - *c_certify
            - *c_activate
            - *c_period_q1
            - *c_generate_q1
            - *c_find_st1
            - *c_file_st1
            - *c_find_st2
            - *c_file_st2
            - *c_remit_st2
          trigger:
            - call: "POST /assessment-statements/${st2_id}/remittance-reversals"
              payload: { remittance_id: "${rem_st2_id}", reversal_reason: "ACH returned unpaid by the operator's bank" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "POST /assessment-statements/${st2_id}/remittance-reversals"
              payload: { remittance_id: "${rem_st2_id}", reversal_reason: "second attempt at the same reversal" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
          assert:
            - "the first reversal returns 200 with Remittance.${rem_st2_id}.status == REVERSED"
            - "AssessmentStatement.${st2_id}.principal_paid_cents == 0, credit_balance_cents == 0, total_due_cents == 340000 and payment_status == UNPAID"
            - "District.${d_id}.collected_to_date_cents == 0, because st1 was never paid and st2's only payment has been reversed"
            - "the second reversal returns 409 with data.error_id == ERR_REMITTANCE_ALREADY_REVERSED"
            - "the refusal is not ERR_REMITTANCE_NOT_FOUND: the remittance exists and belongs to this statement, it is merely no longer APPLIED"
            - "after the refusal Remittance.${rem_st2_id}.status is still REVERSED and its version did not move a second time"
            - "after the refusal AssessmentStatement.${st2_id}.principal_paid_cents is still 0 and District.${d_id}.collected_to_date_cents is still 0, so nothing was credited twice"
            - "GET /assessment-statements/${st2_id}/remittances still returns exactly one row"

      - name: a_granted_adjustment_may_equal_but_not_exceed_the_effective_assessment
        claim_type: violation_to_error
        grounds:
          - validations.p90_adjustment_within_the_assessment
          - errors[ERR_ADJUSTMENT_EXCEEDS_ASSESSMENT]
          - calculations.payment_status_derivation
          - state_machines.AssessmentDispute.UNDER_REVIEW_to_RESOLVED_ADJUSTED
          - state_machines.AssessmentStatement.payment_status.UNPAID_to_PAID_IN_FULL
        distinguishing_aspect: |
          The ceiling applies to what the hearing officer GRANTS, never to what the operator CLAIMS: a
          claim of 340,001 on a 340,000-cent statement is filed happily and only the grant is refused. One
          cent over is an error, exactly equal is a full abatement, and because nothing was ever paid the
          fully abated statement lands on PAID_IN_FULL rather than REFUND_DUE — credit_balance_cents stays
          0, so the REFUND_DUE branch of the derivation ladder is not taken even though total_due_cents
          reaches 0 by write-off rather than by payment.
        test_recipe:
          setup:
            - "canonical district ACTIVE, st2 filed 340,000 and unpaid; no work plan exists, so no funding-ratio cascade can fire"
            - "a CALCULATION_ERROR dispute on st2 claiming 340,001 has been docketed UNDER_REVIEW"
          setup_api_calls:
            - *c_clock_form
            - *c_district
            - *c_b1
            - *c_b2
            - *c_b3
            - *c_b4
            - *c_drive
            - *c_sign_b1
            - *c_tally
            - *c_certify
            - *c_activate
            - *c_period_q1
            - *c_generate_q1
            - *c_find_st1
            - *c_file_st1
            - *c_find_st2
            - *c_file_st2
            - call: "POST /assessment-disputes"
              payload: { assessment_statement_id: "${st2_id}", dispute_type: "CALCULATION_ERROR", claimed_adjustment_cents: 340001, dispute_note: "the whole quarter was misclassified, plus a cent of rounding" }
              as: LodgingOperator
              as_user_id: "${b2_id}"
              captures: { dsp2_id: "$.data.id" }
            - call: "POST /assessment-disputes/${dsp2_id}/proceedings"
              payload: { action: "OPEN_REVIEW", note: "docketed for hearing" }
              as: HearingOfficer
              as_user_id: "hearing-01"
              captures: { dsp2_v_under_review: "$.data.version" }
          trigger:
            - call: "POST /assessment-disputes/${dsp2_id}/resolution"
              payload: { outcome: "ADJUSTED", granted_adjustment_cents: 340001, resolution_note: "one cent past a full abatement" }
              as: HearingOfficer
              as_user_id: "hearing-01"
            - call: "POST /assessment-disputes/${dsp2_id}/resolution"
              payload: { outcome: "ADJUSTED", granted_adjustment_cents: 340000, resolution_note: "the whole assessment is abated" }
              as: HearingOfficer
              as_user_id: "hearing-01"
          assert:
            - "the dispute itself was filed 201 with claimed_adjustment_cents == 340001, because nothing bounds what an operator may ask for"
            - "the 340,001 resolution returns 409 with data.error_id == ERR_ADJUSTMENT_EXCEEDS_ASSESSMENT"
            - "after that refusal AssessmentDispute.${dsp2_id}.status is still UNDER_REVIEW with version == ${dsp2_v_under_review} and resolved_by_user_id null"
            - "after that refusal AssessmentStatement.${st2_id}.granted_adjustment_cents == 0, effective_assessment_cents == 340000 and total_due_cents == 340000"
            - "the 340,000 resolution returns 200, because the comparison is <= and a full abatement is lawful"
            - "AssessmentDispute.${dsp2_id}.status == RESOLVED_ADJUSTED with resolved_by_user_id == \"hearing-01\""
            - "AssessmentStatement.${st2_id}.granted_adjustment_cents == 340000, effective_assessment_cents == 0 and total_due_cents == 0"
            - "AssessmentStatement.${st2_id}.payment_status == PAID_IN_FULL and not REFUND_DUE, because credit_balance_cents is still 0 and the REFUND_DUE branch needs a positive credit"
            - "AssessmentStatement.${st2_id}.principal_paid_cents == 0 and GET /assessment-statements/${st2_id}/remittances returns an empty list, so the statement was retired without a payment"
            - "LodgingBusiness.${b2_id}.status is still ASSESSABLE, because the granted dispute was CALCULATION_ERROR and only an EXEMPT_PROPERTY grant moves the property to EXEMPT"
            - "District.${d_id}.collected_to_date_cents == 0, so an abatement is not collection"

      - name: room_night_claims_are_bounded_by_room_count_times_nights_at_submission_and_at_verification
        claim_type: violation_to_error
        grounds:
          - validations.p85_claim_within_physical_capacity
          - errors[ERR_CLAIM_EXCEEDS_CAPACITY]
          - state_machines.RoomNightClaim.SUBMITTED_to_VERIFIED
          - entities.RoomNightClaim.fields.verified_room_nights
        distinguishing_aspect: |
          One rule guards two different endpoints with two different arithmetics. At submission the
          ceiling is physical — room_count multiplied by the whole nights of the half-open stay, 60 rooms
          times 2 nights equals 120 — and at verification the ceiling is the claim itself, so an auditor
          may allow fewer nights than were claimed but never more. Both ceilings are inclusive: 120 nights
          claimed is accepted and 120 nights allowed on a 120-night claim is accepted, while 121 is
          refused on each side. The refused verification must leave the claim SUBMITTED with
          verified_room_nights still null, so a program closure would still be blocked by it.
        test_recipe:
          setup:
            - "canonical district ACTIVE, plan FY2027 APPROVED, DMO agreement EXECUTED, program RUNNING with booking window [2026-09-01, 2026-12-01)"
            - "logical clock 2026-09-25T00:00:00Z; Lighthouse Boutique holds 60 rooms"
          setup_api_calls:
            - *c_clock_form
            - *c_district
            - *c_b1
            - *c_b2
            - *c_b3
            - *c_b4
            - *c_drive
            - *c_sign_b1
            - *c_tally
            - *c_certify
            - *c_activate
            - *c_period_q1
            - *c_generate_q1
            - *c_find_st1
            - *c_file_st1
            - *c_find_st2
            - *c_file_st2
            - *c_plan_fy2027
            - *c_sponsor
            - *c_approve
            - *c_dmo_executed
            - *c_program
            - *c_clock_launch
            - *c_launch
            - *c_clock_claims
          trigger:
            - call: "POST /marketing-programs/${mp_id}/room-night-claims"
              payload: { lodging_business_id: "${b3_id}", stay_start: "2026-09-10T00:00:00Z", stay_end: "2026-09-12T00:00:00Z", room_nights: 121, attribution_method: "DIRECT_PICKUP" }
              as: DmoLiaison
              as_user_id: "dmo-01"
            - call: "POST /marketing-programs/${mp_id}/room-night-claims"
              payload: { lodging_business_id: "${b3_id}", stay_start: "2026-09-10T00:00:00Z", stay_end: "2026-09-12T00:00:00Z", room_nights: 120, attribution_method: "DIRECT_PICKUP" }
              as: DmoLiaison
              as_user_id: "dmo-01"
              captures: { rnc_cap_id: "$.data.id" }
            - call: "POST /room-night-claims/${rnc_cap_id}/verification"
              payload: { decision: "ALLOW", verified_room_nights: 121 }
              as: DmoLiaison
              as_user_id: "dmo-01"
            - call: "POST /room-night-claims/${rnc_cap_id}/verification"
              payload: { decision: "ALLOW", verified_room_nights: 120 }
              as: DmoLiaison
              as_user_id: "dmo-01"
          assert:
            - "the 121-night submission returns 409 with data.error_id == ERR_CLAIM_EXCEEDS_CAPACITY, because 60 rooms times the 2 whole nights of [2026-09-10, 2026-09-12) is 120"
            - "that refusal is not ERR_CLAIM_OUTSIDE_BOOKING_WINDOW: the stay sits inside [2026-09-01, 2026-12-01)"
            - "GET /marketing-programs/${mp_id}/room-night-claims returns no row for the refused submission"
            - "the 120-night submission returns 201 with RoomNightClaim.${rnc_cap_id}.status == SUBMITTED and verified_room_nights null, because the physical ceiling is inclusive"
            - "the verification allowing 121 returns 409 with data.error_id == ERR_CLAIM_EXCEEDS_CAPACITY, because verified_room_nights may not exceed the claim's own 120"
            - "after that refusal RoomNightClaim.${rnc_cap_id}.status is still SUBMITTED with verified_room_nights null and verified_by_user_id null"
            - "the verification allowing 120 returns 200 with status == VERIFIED, verified_room_nights == 120 and verified_by_user_id == \"dmo-01\""
            - "MarketingProgram.${mp_id}.status is still RUNNING throughout, since verification never advances the program"

      - name: a_stay_outside_the_half_open_booking_window_is_refused_and_the_closing_edge_is_accepted
        claim_type: violation_to_error
        grounds:
          - validations.p75_claim_inside_the_booking_window
          - errors[ERR_CLAIM_OUTSIDE_BOOKING_WINDOW]
          - entities.MarketingProgram.fields.booking_window_end
        distinguishing_aspect: |
          The window is half-open, so a stay beginning exactly at booking_window_end is outside it while a
          stay ending exactly at booking_window_end is inside it. The two calls differ only in which end
          of the stay touches 2026-12-01T00:00:00Z, which is the smallest possible difference that
          separates a correct half-open containment test from an inclusive one. The window test reads the
          stay interval alone: the logical clock sits at 2026-09-25, before both stays, and is not part of
          the predicate.
        test_recipe:
          setup:
            - "canonical district ACTIVE, program RUNNING with booking window [2026-09-01, 2026-12-01), logical clock 2026-09-25T00:00:00Z"
          setup_api_calls:
            - *c_clock_form
            - *c_district
            - *c_b1
            - *c_b2
            - *c_b3
            - *c_b4
            - *c_drive
            - *c_sign_b1
            - *c_tally
            - *c_certify
            - *c_activate
            - *c_period_q1
            - *c_generate_q1
            - *c_find_st1
            - *c_file_st1
            - *c_find_st2
            - *c_file_st2
            - *c_plan_fy2027
            - *c_sponsor
            - *c_approve
            - *c_dmo_executed
            - *c_program
            - *c_clock_launch
            - *c_launch
            - *c_clock_claims
          trigger:
            - call: "POST /marketing-programs/${mp_id}/room-night-claims"
              payload: { lodging_business_id: "${b3_id}", stay_start: "2026-12-01T00:00:00Z", stay_end: "2026-12-03T00:00:00Z", room_nights: 50, attribution_method: "DIRECT_PICKUP" }
              as: DmoLiaison
              as_user_id: "dmo-01"
            - call: "POST /marketing-programs/${mp_id}/room-night-claims"
              payload: { lodging_business_id: "${b3_id}", stay_start: "2026-11-29T00:00:00Z", stay_end: "2026-12-01T00:00:00Z", room_nights: 50, attribution_method: "DIRECT_PICKUP" }
              as: DmoLiaison
              as_user_id: "dmo-01"
              captures: { rnc_edge_id: "$.data.id" }
          assert:
            - "the [2026-12-01, 2026-12-03) stay returns 409 with data.error_id == ERR_CLAIM_OUTSIDE_BOOKING_WINDOW, because stay_start equals the exclusive booking_window_end"
            - "that refusal is not ERR_CLAIM_EXCEEDS_CAPACITY: 50 <= 60 rooms times 2 nights"
            - "the [2026-11-29, 2026-12-01) stay returns 201 with RoomNightClaim.${rnc_edge_id}.status == SUBMITTED and room_nights == 50, because stay_end may land exactly on the exclusive bound"
            - "the two stays do not overlap each other, so neither call can return ERR_CLAIM_STAY_OVERLAP"
            - "GET /marketing-programs/${mp_id}/room-night-claims returns exactly one row, ${rnc_edge_id}"

      - name: the_renewal_window_opens_exactly_one_hundred_eighty_days_before_expiration_and_shuts_at_it
        claim_type: violation_to_error
        grounds:
          - validations.p75_renewal_window
          - validations.p70_transparency_gate
          - errors[ERR_RENEWAL_WINDOW_NOT_OPEN]
          - errors[ERR_TRANSPARENCY_REQUIREMENTS_UNMET]
          - endpoints.POST_/petition-drives
        distinguishing_aspect: |
          The canonical district is formed on 2026-08-01 with term_years 1, so expiration_date is
          2027-08-01 and the renewal window is [2027-02-02, 2027-08-01]. 2027-02-01 is 181 whole days
          out and refused, 2027-02-02 is exactly 180 and accepted, and 2027-08-02 is past expiration and
          refused again — one rule with a closed door on both sides. The RENEWAL drive also snapshots a
          different threshold pair from a FORMATION drive: 0.6500 weighted AND 0.7500 headcount, where
          formation snapshots 0.0000 headcount. The lifecycle call in the middle pins priority ordering:
          a transparency-deficient district outside its renewal window returns the priority-70
          transparency code, not the priority-75 window code.
        test_recipe:
          setup:
            - "canonical district ACTIVE, formed_on 2026-08-01 with term_years 1 -> expiration_date 2027-08-01"
            - "no TransparencyRecord of any kind exists, so the district cannot satisfy the renewal transparency gate"
          setup_api_calls:
            - *c_clock_form
            - *c_district
            - *c_b1
            - *c_b2
            - *c_b3
            - *c_b4
            - *c_drive
            - *c_sign_b1
            - *c_tally
            - *c_certify
            - *c_activate
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-02-01T00:00:00Z" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "POST /petition-drives"
              payload: { district_id: "${d_id}", drive_type: "RENEWAL", closes_at: "2027-04-01T00:00:00Z" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "POST /districts/${d_id}/lifecycle-advances"
              payload: { to_status: "RENEWAL_PENDING", reason: "renewal requested a day too early on a district with no published filings" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-02-02T00:00:00Z" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "POST /petition-drives"
              payload: { district_id: "${d_id}", drive_type: "RENEWAL", closes_at: "2027-04-01T00:00:00Z" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { pd_renew_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-08-02T00:00:00Z" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "POST /petition-drives"
              payload: { district_id: "${d_id}", drive_type: "RENEWAL", closes_at: "2027-09-01T00:00:00Z" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
          assert:
            - "at 2027-02-01 the RENEWAL drive returns 409 with data.error_id == ERR_RENEWAL_WINDOW_NOT_OPEN, because 2027-02-01 is 181 whole days before 2027-08-01 and RENEWAL_WINDOW_DAYS is 180"
            - "at 2027-02-01 the RENEWAL_PENDING lifecycle call returns 409 with data.error_id == ERR_TRANSPARENCY_REQUIREMENTS_UNMET and NOT ERR_RENEWAL_WINDOW_NOT_OPEN, because the transparency gate sits at priority 70 and the window at priority 75"
            - "District.${d_id}.status is still ACTIVE after that refusal"
            - "at 2027-02-02 the RENEWAL drive returns 201, because that instant is exactly 180 whole days before expiration_date and the bound is inclusive"
            - "PetitionDrive.${pd_renew_id}.drive_type == RENEWAL, status == OPEN, required_weighted_pct == 0.6500 and required_headcount_pct == 0.7500, snapshotted from renewal_threshold_pct and renewal_headcount_threshold_pct rather than from formation_threshold_pct"
            - "PetitionDrive.${pd_renew_id}.assessable_count_snapshot == 4 and assessable_basis_snapshot_cents == 100000000"
            - "District.${d_id}.status is still ACTIVE, because only a FORMATION drive moves a district into PETITION_CIRCULATING"
            - "at 2027-08-02 the RENEWAL drive returns 409 with data.error_id == ERR_RENEWAL_WINDOW_NOT_OPEN, because the window is closed once the clock is past expiration_date"
            - "GET /districts/${d_id}/petition-drives with drive_type RENEWAL returns exactly one row, ${pd_renew_id}"

      - name: a_program_closure_waits_for_every_submitted_claim_to_be_verified
        claim_type: violation_to_error
        grounds:
          - validations.p60_closure_requires_no_submitted_claim
          - errors[ERR_CLAIMS_PENDING_VERIFICATION]
          - state_machines.MarketingProgram.RUNNING_to_CLOSED
          - calculations.program_performance
        distinguishing_aspect: |
          Performance measurement reads VERIFIED nights only, so closing a program with an unverified
          claim outstanding would silently drop those nights out of the published index. The gate is
          therefore a refusal rather than a rounding decision, and the same closure call succeeds the
          moment the claim is verified — with the performance figures computed from the nights that were
          pending a call earlier. This is also the only place the gate can be observed: an implementation
          that ignores SUBMITTED claims publishes a program whose index silently changes if the claim is
          verified afterwards.
        test_recipe:
          setup:
            - "canonical district ACTIVE, program RUNNING with committed_cents 62,000 and booking window [2026-09-01, 2026-12-01)"
            - "one 100-night claim from Lighthouse Boutique sitting in SUBMITTED"
          setup_api_calls:
            - *c_clock_form
            - *c_district
            - *c_b1
            - *c_b2
            - *c_b3
            - *c_b4
            - *c_drive
            - *c_sign_b1
            - *c_tally
            - *c_certify
            - *c_activate
            - *c_period_q1
            - *c_generate_q1
            - *c_find_st1
            - *c_file_st1
            - *c_find_st2
            - *c_file_st2
            - *c_plan_fy2027
            - *c_sponsor
            - *c_approve
            - *c_dmo_executed
            - *c_program
            - *c_clock_launch
            - *c_launch
            - *c_clock_claims
            - *c_claim_b3
          trigger:
            - call: "POST /marketing-programs/${mp_id}/closure"
              payload: { closure_note: "closing while a claim is still pending" }
              as: DmoLiaison
              as_user_id: "dmo-01"
            - *c_verify_b3
            - call: "POST /marketing-programs/${mp_id}/closure"
              payload: { closure_note: "closing now that every claim is verified" }
              as: DmoLiaison
              as_user_id: "dmo-01"
          assert:
            - "the first closure returns 409 with data.error_id == ERR_CLAIMS_PENDING_VERIFICATION"
            - "after that refusal MarketingProgram.${mp_id}.status is still RUNNING with closed_at null, verified_room_nights null and performance_flag NOT_MEASURED"
            - "the verification returns 200 with RoomNightClaim.${rnc_b3_id}.status == VERIFIED and verified_room_nights == 100"
            - "the second closure returns 200 with MarketingProgram.${mp_id}.status == CLOSED and closed_at == 2026-09-25T00:00:00Z"
            - "MarketingProgram.${mp_id}.verified_room_nights == 100 and gross_cost_per_room_night_cents == 620, because round_half_up(62000 / 100) == 620"
            - "MarketingProgram.${mp_id}.efficiency_tier == TIER_EFFICIENT, because 620 <= 1500"
            - "MarketingProgram.${mp_id}.dmo_cost_share_cents == 24800 and net_district_cost_cents == 37200, because round_half_up(62000 * 0.40) == 24800"
            - "MarketingProgram.${mp_id}.net_cost_per_room_night_cents == 372 and performance_index == 6.7204, because round_half_up(2500 / 372, 4) == 6.7204"
            - "MarketingProgram.${mp_id}.performance_flag == MEETS_BENCHMARK, because the index is at or above 1.0000"
            - "had the closure been allowed while the claim was SUBMITTED the program would have published verified_room_nights 0 with efficiency_tier TIER_UNPRODUCTIVE, which is exactly what the gate prevents"

      - name: a_frozen_program_refuses_every_spend_while_its_plan_is_under_amendment
        claim_type: violation_to_error
        grounds:
          - validations.p60_program_spend_frozen
          - errors[ERR_PROGRAM_SPEND_FROZEN]
          - state_machines.AnnualWorkPlan.APPROVED_to_AMENDMENT_PENDING
        excluded_because:
          difficulty_instance: transitive_cascade / granted_dispute_cascades_through_funding_ratio_into_a_frozen_program
          rationale: "That §1.8 instance drives the freeze from a granted dispute three hops away, then asserts ERR_PROGRAM_SPEND_FROZEN on the RUNNING program and the release once the amendment restores the plan; a §1.9 instance could only repeat that walk with a shorter cause."

      - name: a_second_appeal_on_one_dispute_is_refused
        claim_type: violation_to_error
        grounds:
          - validations.p85_appeal_limit
          - errors[ERR_APPEAL_LIMIT_EXCEEDED]
          - state_machines.AssessmentDispute.RESOLVED_UPHELD_to_UNDER_REVIEW
        excluded_because:
          difficulty_instance: non_linear_state_machine / dispute_info_request_cycle_repeats_but_appeal_cycle_is_one_shot
          rationale: "That §1.8 instance exists precisely to contrast the unbounded INFO_REQUESTED cycle against the one-shot appeal, and it asserts ERR_APPEAL_LIMIT_EXCEEDED on the second APPEAL with appeal_count pinned at MAX_APPEALS."

      - name: a_second_period_overlapping_an_existing_one_is_refused
        claim_type: violation_to_error
        grounds:
          - validations.p80_period_windows_do_not_overlap
          - errors[ERR_PERIOD_OVERLAP]
          - endpoints.POST_/assessment-periods
        excluded_because:
          difficulty_instance: resource_temporal_overlap / assessment_period_windows_are_half_open_within_one_district
          rationale: "That §1.8 instance already walks the abutting, the overlapping and the other-district cases across one district's period calendar, asserting ERR_PERIOD_OVERLAP only for the true intersection."

      - name: two_public_meetings_closer_than_the_statutory_separation_are_refused
        claim_type: violation_to_error
        grounds:
          - validations.p85_public_meeting_separation
          - errors[ERR_MEETING_SEPARATION_VIOLATION]
          - entities.TransparencyRecord.fields.scheduled_for
        excluded_because:
          difficulty_instance: boundary_precision_check / public_meeting_separation_of_exactly_ten_days_is_accepted_and_nine_is_not
          rationale: "That §1.8 instance sits exactly on the separation boundary in both directions, which subsumes any coarser §1.9 trigger of the same code."

      - name: two_claims_of_one_property_may_not_overlap_within_one_program
        claim_type: violation_to_error
        grounds:
          - validations.p80_claim_stays_do_not_overlap
          - errors[ERR_CLAIM_STAY_OVERLAP]
          - entities.RoomNightClaim.fields.stay_start
        excluded_because:
          difficulty_instance: resource_temporal_overlap / room_night_claim_stays_are_half_open_per_program_and_property
          rationale: "That §1.8 instance walks the abutting stay, the overlapping stay, the same stay for a different property and the same stay in a different program, asserting ERR_CLAIM_STAY_OVERLAP only where the pair truly intersects."

