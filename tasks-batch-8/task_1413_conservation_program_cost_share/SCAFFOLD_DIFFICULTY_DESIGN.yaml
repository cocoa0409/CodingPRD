          assert:
            - "avail_pre == 10000 (pool would fail the fiscal check: 300000 > 10000)"
            - "err == ERR_CONTRACT_NOT_DRAFT (state, priority 5) and NOT ERR_POOL_INSUFFICIENT_FUNDS (fiscal, priority 11) — state wins the dual failure"

      - name: safety_vs_temporal_on_sampled_stale_disburse
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors[ERR_SPOT_CHECK_REQUIRED]
          - errors[ERR_CERTIFICATION_STALE]
        distinguishing_aspect: |
