    error_id: "ERR_DUPLICATE_STATE_LAW_RULE | ERR_DUPLICATE_SOLICITATION_NUMBER | ERR_DUPLICATE_CONTRACT_NUMBER | ERR_DUPLICATE_SUPPLIER_NAME | ERR_DUPLICATE_MEMBER_NAME"
    http_status: 409
    applies_to: "POST /coop/state-law-rules, POST /coop/solicitations, POST /coop/master-contracts, POST /coop/suppliers, POST /coop/member-agencies"
  - priority: 58
    category: business_constraint
    check: "an approved PRICE_ADJUSTMENT's new_unit_price_cents is <= price_ceiling_cents from calculations.price_adjustment_ceiling (inclusive) and >= the line item's price_floor_cents"
    error_id: "ERR_PRICE_ESCALATION_EXCEEDS_CAP | ERR_PRICE_BELOW_FLOOR"
    http_status: 422
    applies_to: "POST /coop/contract-amendments, POST /coop/contract-amendments/{id}/decision"
  - priority: 59
    category: business_constraint
    check: "EXECUTE requires at least one ContractLineItem with status == ACTIVE on the contract"
    error_id: ERR_NO_ACTIVE_LINE_ITEMS
    http_status: 409
    applies_to: "POST /coop/master-contracts/{id}/award-status"
  - priority: 60
    category: business_constraint
    check: "REMIT requires amount_cents == reported_fee_cents - remitted_cents (exact settlement only; partial and over-payment are rejected)"
    error_id: ERR_REMITTANCE_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /coop/usage-reports/{id}/fee-remittance"
  - priority: 61
    category: business_fiscal
    check: "member.committed_spend_cents + the new usage's total_cents <= member.annual_spend_ceiling_cents (inclusive: landing exactly on the ceiling is allowed)"
    error_id: ERR_MEMBER_CEILING_EXCEEDED
    http_status: 422
    applies_to: "POST /coop/contract-usages"
  - priority: 62
    category: business_fiscal
    check: "the fee ledger stays consistent: contract.fee_outstanding_cents == contract.fee_assessed_cents_total - contract.fee_remitted_cents_total after every fee mutation, and a remittance may never drive fee_outstanding_cents below zero"
    error_id: ERR_FEE_LEDGER_INCONSISTENT
    http_status: 409
    applies_to: "POST /coop/usage-reports/{id}/fee-remittance, POST /coop/usage-reports/{id}/review"

endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint that sets the server's logical clock. The clock's startup default is exactly 2026-08-01T00:00:00Z: before any call to this endpoint every deadline, expiry and window rule is evaluated against that fixed instant and the server MUST NOT fall back to real wall-clock time."
    roles: [CoopAdministrator]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["all subsequent logical-clock reads (posted_at, ordered_at, determined_at, fee_due_at comparisons, appeal windows, price-stability windows) use the new instant"]

  - method: POST
    path: "/coop/state-law-rules"
    description: "Register the procurement-law configuration for one state. state_code is the natural key every solicitation, supplier and member resolves against."
    roles: [CoopAdministrator]
    code: 201
    input: [state_code, piggyback_doctrine, min_notice_days, requires_lead_agency_in_state, allows_nonprofit_participation, max_contract_term_months, requires_local_solicitation_waiver, "reciprocity_state_codes?"]
    output: StateLawRule
    side_effects: ["none beyond row creation; the row is immutable (common_fields: false, no update endpoint, no version field)"]
  - method: GET
    path: "/coop/state-law-rules"
    description: "List state law rules with pagination."
    roles: [CoopAdministrator, LeadAgencyOfficer, SupplierRepresentative, MemberRepresentative, MemberAuditor]
    code: 200
    input: ["state_code?", "piggyback_doctrine?", "limit?", "offset?"]
    output: StateLawRule[]
    side_effects: []
  - method: GET
    path: "/coop/state-law-rules/{id}"
    description: "Read one state law rule."
    roles: [CoopAdministrator, LeadAgencyOfficer, SupplierRepresentative, MemberRepresentative, MemberAuditor]
    code: 200
    input: []
    output: StateLawRule
    side_effects: []

  - method: POST
    path: "/coop/solicitations"
    description: "Create a lead-agency solicitation in DRAFT with audit_package_status NOT_ASSEMBLED."
    roles: [LeadAgencyOfficer]
    code: 201
    input: [title, solicitation_number, lead_agency_name, lead_agency_state_code, response_due_at, technical_weight_pct, price_weight_pct, "specification_document_ref?", "method_justification_ref?"]
    output: Solicitation
    side_effects: ["status = DRAFT, audit_package_status = NOT_ASSEMBLED, addenda_count = 0, responsive_response_count = 0, version = 1"]
  - method: GET
    path: "/coop/solicitations/{id}"
    description: "Read one solicitation including both state dimensions and the audit-package figures."
    roles: [CoopAdministrator, LeadAgencyOfficer, SupplierRepresentative, MemberRepresentative, MemberAuditor]
    code: 200
    input: []
    output: Solicitation
    side_effects: []
  - method: GET
    path: "/coop/solicitations"
    description: "List solicitations, filterable by lead agency state and by either state dimension."
    roles: [CoopAdministrator, LeadAgencyOfficer, SupplierRepresentative, MemberRepresentative, MemberAuditor]
    code: 200
    input: ["lead_agency_state_code?", "status?", "audit_package_status?", "limit?", "offset?"]
    output: Solicitation[]
    side_effects: []
  - method: POST
    path: "/coop/solicitations/{id}/lifecycle"
    description: "Advance the competitive-process dimension. action is one of POST_NOTICE, OPEN_EVALUATION, RECOMMEND_AWARD, AWARD, FAIL, CANCEL."
    roles: [LeadAgencyOfficer]
    code: 200
    input: [action, "note?"]
    output: Solicitation
    side_effects:
      - "POST_NOTICE: sets posted_at and freezes notice_days"
      - "RECOMMEND_AWARD: runs calculations.composite_score over every RESPONSIVE response (price_score, composite_score, award_rank) and sets recommended_by_user_id"
      - "AWARD: sets awarded_by_user_id after the segregation-of-duties check"
      - "FAIL: sets every SUBMITTED/INFO_REQUESTED response to NON_RESPONSIVE"
      - "CANCEL: sets every SUBMITTED/INFO_REQUESTED response to WITHDRAWN"
      - "any successful action moves audit_package_status ASSEMBLED/CERTIFIED -> STALE"
      - "increments Solicitation.version by 1"
  - method: POST
    path: "/coop/solicitations/{id}/audit-package"
    description: "Assemble or certify the competitive-solicitation documentation package that member agencies file in their own audit records. action is ASSEMBLE or CERTIFY."
    roles: [LeadAgencyOfficer]
    code: 200
    input: [action, "amendment_log_document_ref?"]
    output: Solicitation
    side_effects:
      - "ASSEMBLE: stores amendment_log_document_ref when supplied, then runs calculations.audit_package_completeness writing audit_required_doc_codes, audit_present_doc_codes and audit_completeness_pct"
      - "CERTIFY: sets certified_at and certified_by_user_id"
      - "increments Solicitation.version by 1"
  - method: GET
    path: "/coop/solicitations/{id}/responses"
    description: "Reverse-reachability list of the responses filed against one solicitation, including cascade-created status changes."
    roles: [CoopAdministrator, LeadAgencyOfficer, MemberAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: SolicitationResponse[]
    side_effects: []

  - method: POST
    path: "/coop/suppliers"
    description: "Register a supplier in UNQUALIFIED standing with a pristine performance record."
    roles: [CoopAdministrator]
    code: 201
    input: [legal_name, home_state_code]
    output: Supplier
    side_effects: ["qualification_status = UNQUALIFIED, performance_score = 100.00, deduction_points_total = 0.00, performance_tier = PREFERRED, version = 1"]
  - method: GET
    path: "/coop/suppliers/{id}"
    description: "Read one supplier including performance score, tier and fee ledger totals."
    roles: [CoopAdministrator, LeadAgencyOfficer, SupplierRepresentative, MemberRepresentative, MemberAuditor]
    code: 200
    input: []
    output: Supplier
    side_effects: []
  - method: GET
    path: "/coop/suppliers"
    description: "List suppliers filterable by home state, qualification standing and performance tier."
    roles: [CoopAdministrator, LeadAgencyOfficer, MemberRepresentative, MemberAuditor]
    code: 200
    input: ["home_state_code?", "qualification_status?", "performance_tier?", "limit?", "offset?"]
    output: Supplier[]
    side_effects: []
  - method: POST
    path: "/coop/suppliers/{id}/qualification"
    description: "Move the supplier's cooperative standing. action is QUALIFY, SUSPEND, REINSTATE or DEBAR."
    roles: [CoopAdministrator]
    code: 200
    input: [action, "note?"]
    output: Supplier
    side_effects:
      - "SUSPEND: every ACTIVE MasterContract of this supplier becomes SUSPENDED, and each such suspension in turn voids that contract's DETERMINED PiggybackAnalysis rows"
      - "DEBAR: every PENDING_EXECUTION/ACTIVE/SUSPENDED MasterContract becomes TERMINATED, and each termination in turn voids that contract's DETERMINED analyses and withdraws its line items"
      - "increments Supplier.version by 1"

  - method: POST
    path: "/coop/solicitation-responses"
    description: "Submit a supplier response to a POSTED solicitation."
    roles: [SupplierRepresentative]
    code: 201
    input: [solicitation_id, supplier_id, proposed_annual_value_cents, "responsiveness_note?"]
    output: SolicitationResponse
    side_effects: ["status = SUBMITTED, info_request_rounds = 0, version = 1"]
  - method: GET
    path: "/coop/solicitation-responses/{id}"
    description: "Read one response including technical_score, price_score, composite_score and award_rank."
    roles: [CoopAdministrator, LeadAgencyOfficer, SupplierRepresentative, MemberAuditor]
    code: 200
    input: []
    output: SolicitationResponse
    side_effects: []
  - method: GET
    path: "/coop/solicitation-responses"
    description: "Reverse-reachability list of responses, filterable by solicitation_id and by supplier_id."
    roles: [CoopAdministrator, LeadAgencyOfficer, SupplierRepresentative, MemberAuditor]
    code: 200
    input: ["solicitation_id?", "supplier_id?", "status?", "limit?", "offset?"]
    output: SolicitationResponse[]
    side_effects: []
  - method: POST
    path: "/coop/solicitation-responses/{id}/review"
    description: "Evaluator action on a response. action is REQUEST_INFO, MARK_RESPONSIVE or MARK_NON_RESPONSIVE; technical_score is required for MARK_RESPONSIVE."
    roles: [LeadAgencyOfficer]
    code: 200
    input: [action, "technical_score?", "responsiveness_note?"]
    output: SolicitationResponse
    side_effects:
      - "MARK_RESPONSIVE: stores technical_score and increments the solicitation's responsive_response_count"
      - "MARK_NON_RESPONSIVE from RESPONSIVE: decrements responsive_response_count and clears technical_score, price_score, composite_score and award_rank"
      - "increments SolicitationResponse.version by 1"
  - method: POST
    path: "/coop/solicitation-responses/{id}/submission"
    description: "Supplier-side action on its own response. action is RESUBMIT (closing an INFO_REQUESTED cycle) or WITHDRAW."
    roles: [SupplierRepresentative]
    code: 200
    input: [action, "responsiveness_note?"]
    output: SolicitationResponse
    side_effects:
      - "RESUBMIT: status returns to SUBMITTED and info_request_rounds increments by 1"
      - "increments SolicitationResponse.version by 1"

  - method: POST
    path: "/coop/master-contracts"
    description: "Award a master contract with nationwide pricing to the rank-1 responsive supplier of an AWARDED solicitation. Created in PENDING_EXECUTION with compliance_posture COMPLIANT."
    roles: [LeadAgencyOfficer]
    code: 201
    input: [solicitation_id, supplier_id, contract_number, admin_fee_rate_bps, base_term_start, base_term_end, max_renewals, price_escalation_cap_pct, discount_tiers, permitted_add_ons, "nationwide_pricing_flag?"]
    output: MasterContract
    side_effects: ["status = PENDING_EXECUTION, compliance_posture = COMPLIANT, current_term_end = base_term_end, renewals_used = 0, all ledger totals = 0, version = 1"]
  - method: GET
    path: "/coop/master-contracts/{id}"
    description: "Read one master contract including both state dimensions, the discount ladder, the add-on catalogue and the fee ledger."
    roles: [CoopAdministrator, LeadAgencyOfficer, SupplierRepresentative, MemberRepresentative, MemberAuditor]
    code: 200
    input: []
    output: MasterContract
    side_effects: []
  - method: GET
    path: "/coop/master-contracts"
    description: "Reverse-reachability list of contracts, filterable by solicitation_id and by supplier_id."
    roles: [CoopAdministrator, LeadAgencyOfficer, SupplierRepresentative, MemberRepresentative, MemberAuditor]
    code: 200
    input: ["solicitation_id?", "supplier_id?", "status?", "compliance_posture?", "limit?", "offset?"]
    output: MasterContract[]
    side_effects: []
  - method: POST
    path: "/coop/master-contracts/{id}/award-status"
    description: "Move the contract's execution dimension. action is EXECUTE, SUSPEND, REINSTATE, EXPIRE or TERMINATE."
    roles: [CoopAdministrator]
    code: 200
    input: [action, "note?"]
    output: MasterContract
    side_effects:
      - "EXECUTE: sets price_effective_from = base_term_start on every ACTIVE line item"
      - "SUSPEND / EXPIRE / TERMINATE: voids this contract's DETERMINED PiggybackAnalysis rows with the matching voided_reason"
      - "TERMINATE: withdraws every ContractLineItem of the contract"
      - "increments MasterContract.version by 1"
  - method: POST
    path: "/coop/master-contracts/{id}/compliance-sweep"
    description: "Administrative delinquency sweep over this contract's DUE usage reports: every report whose fee_due_at is strictly before the logical clock becomes DELINQUENT, then the posture, contract status and supplier performance cascade run."
    roles: [CoopAdministrator]
    code: 200
    input: ["note?"]
    output: "{ contract_id: string, swept_report_count: integer, newly_delinquent_report_ids: string, delinquent_report_count: integer, compliance_posture: string, contract_status: string, supplier_performance_score: number, supplier_performance_tier: string }"
    side_effects:
      - "each DUE report past fee_due_at moves fee_status DUE -> DELINQUENT"
      - "hop: contract.delinquent_report_count and supplier.delinquent_report_count increment, which re-runs calculations.contract_compliance_posture"
      - "hop: a DELINQUENT posture reached on the count trigger drives contract.status ACTIVE -> SUSPENDED, which in turn voids the contract's DETERMINED analyses"
      - "adds DELINQUENCY_DEDUCTION_POINTS per newly delinquent report to supplier.deduction_points_total and re-runs calculations.supplier_performance_score"
      - "increments MasterContract.version by 1 when anything changed"
  - method: GET
    path: "/coop/master-contracts/{id}/line-items"
    description: "Reverse-reachability sub-resource list of the contract's price-sheet lines, including EXPANSION lines created by an approved amendment."
    roles: [CoopAdministrator, LeadAgencyOfficer, SupplierRepresentative, MemberRepresentative, MemberAuditor]
    code: 200
    input: ["status?", "origin?", "limit?", "offset?"]
    output: ContractLineItem[]
    side_effects: []
  - method: GET
    path: "/coop/master-contracts/{id}/usage-reports"
    description: "Reverse-reachability sub-resource list of the contract's period usage reports with both state dimensions and every fee figure."
    roles: [CoopAdministrator, LeadAgencyOfficer, SupplierRepresentative, MemberAuditor]
    code: 200
    input: ["status?", "fee_status?", "limit?", "offset?"]
    output: UsageReport[]
    side_effects: []
  - method: GET
    path: "/coop/master-contracts/{id}/price-quote"
    description: "Computed read that prices a hypothetical order without recording it: runs calculations.net_unit_price, calculations.add_on_charges and calculations.member_usage_total against the member's CURRENT committed_spend_cents snapshot."
    roles: [CoopAdministrator, MemberRepresentative, MemberAuditor]
    code: 200
    input: [line_item_id, member_agency_id, quantity, "add_on_codes?"]
    output: "{ line_item_id: string, member_agency_id: string, spend_basis_cents: integer, discount_tier_index: integer, total_discount_pct: number, net_unit_price_cents: integer, subtotal_cents: integer, add_on_charges_cents: integer, chargeable_base_cents: integer, effective_fee_rate_bps: integer, admin_fee_cents: integer, total_cents: integer, floor_binding: boolean, aggregate_add_on_cap_binding: boolean }"
    side_effects: ["none: no row is created and no counter moves"]
  - method: POST
    path: "/coop/master-contracts/{id}/line-items"
    description: "Add an awarded price-sheet line to the contract. contract_id is taken from the path."
    roles: [LeadAgencyOfficer]
    code: 201
    input: [sku, item_description, unit_of_measure, base_unit_price_cents, price_floor_cents]
    output: ContractLineItem
    side_effects: ["origin = AWARD, status = ACTIVE, price_change_count = 0, price_effective_from = contract.base_term_start, version = 1"]
  - method: GET
    path: "/coop/contract-line-items/{id}"
    description: "Read one price-sheet line including its current price and price-stability anchor."
    roles: [CoopAdministrator, LeadAgencyOfficer, SupplierRepresentative, MemberRepresentative, MemberAuditor]
    code: 200
    input: []
    output: ContractLineItem
    side_effects: []
  - method: GET
    path: "/coop/contract-line-items"
    description: "Reverse-reachability list of price-sheet lines, filterable by contract_id."
    roles: [CoopAdministrator, LeadAgencyOfficer, SupplierRepresentative, MemberRepresentative, MemberAuditor]
    code: 200
    input: ["contract_id?", "status?", "origin?", "limit?", "offset?"]
    output: ContractLineItem[]
    side_effects: []

  - method: POST
    path: "/coop/member-agencies"
    description: "Register a participating agency at the cooperative's membership desk. Created in PENDING_VERIFICATION."
    roles: [CoopAdministrator]
    code: 201
    input: [legal_name, state_code, member_category, annual_spend_ceiling_cents, "governing_body_resolution_number?", "irs_determination_letter_number?"]
    output: MemberAgency
    side_effects: ["registration_status = PENDING_VERIFICATION, committed_spend_cents = 0, docs_request_count = 0, version = 1"]
  - method: GET
    path: "/coop/member-agencies/{id}"
    description: "Read one member agency including registration_status, committed_spend_cents and version (the OCC anchor)."
    roles: [CoopAdministrator, LeadAgencyOfficer, MemberRepresentative, MemberAuditor]
    code: 200
    input: []
    output: MemberAgency
    side_effects: []
  - method: GET
    path: "/coop/member-agencies"
    description: "List member agencies filterable by state, category and registration status."
    roles: [CoopAdministrator, LeadAgencyOfficer, MemberAuditor]
    code: 200
    input: ["state_code?", "member_category?", "registration_status?", "limit?", "offset?"]
    output: MemberAgency[]
    side_effects: []
  - method: POST
    path: "/coop/member-agencies/{id}/registration"
    description: "Move the registration/eligibility dimension. action is REQUEST_DOCS, RESUBMIT_DOCS, VERIFY, SUSPEND, REINSTATE or TERMINATE."
    roles: [CoopAdministrator]
    code: 200
    input: [action, "governing_body_resolution_number?", "irs_determination_letter_number?", "note?"]
    output: MemberAgency
    side_effects:
      - "RESUBMIT_DOCS: stores any supplied evidence numbers and increments docs_request_count"
      - "VERIFY: sets verified_at and verified_by_user_id"
      - "SUSPEND / TERMINATE: voids this member's DETERMINED (and for TERMINATE also PENDING) PiggybackAnalysis rows"
      - "increments MemberAgency.version by 1"
  - method: GET
    path: "/coop/member-agencies/{id}/piggyback-analyses"
    description: "Reverse-reachability sub-resource list of the authority opinions written for one member, including rows voided by a cascade."
    roles: [CoopAdministrator, LeadAgencyOfficer, MemberRepresentative, MemberAuditor]
    code: 200
    input: ["status?", "determination?", "limit?", "offset?"]
    output: PiggybackAnalysis[]
    side_effects: []

  - method: POST
    path: "/coop/piggyback-analyses"
    description: "Open a piggyback authority analysis for one member/contract pair in PENDING. Requires expected_member_agency_version: the analysis freezes eligibility facts read off the member row, and a newer analysis for the same pair supersedes the prior one."
    roles: [CoopAdministrator, MemberRepresentative]
    code: 201
    input: [member_agency_id, contract_id, expected_member_agency_version, "waiver_reference?"]
    output: PiggybackAnalysis
    side_effects:
      - "any prior PiggybackAnalysis for the same (member_agency_id, contract_id) pair with status IN {PENDING, DETERMINED} becomes VOIDED with voided_reason = SUPERSEDED_BY_NEWER_ANALYSIS"
      - "increments MemberAgency.version by 1"
      - "status = PENDING, version = 1"
  - method: GET
    path: "/coop/piggyback-analyses/{id}"
    description: "Read one authority opinion including doctrine_applied, authority_score, deduction_detail, determination and the frozen expires_on."
    roles: [CoopAdministrator, LeadAgencyOfficer, MemberRepresentative, MemberAuditor]
    code: 200
    input: []
    output: PiggybackAnalysis
    side_effects: []
  - method: GET
    path: "/coop/piggyback-analyses"
    description: "Reverse-reachability list of authority opinions, filterable by member_agency_id and by contract_id."
    roles: [CoopAdministrator, LeadAgencyOfficer, MemberRepresentative, MemberAuditor]
    code: 200
    input: ["member_agency_id?", "contract_id?", "status?", "determination?", "limit?", "offset?"]
    output: PiggybackAnalysis[]
    side_effects: []
  - method: POST
    path: "/coop/piggyback-analyses/{id}/determination"
    description: "Determine or void an authority opinion. action is DETERMINE or VOID."
    roles: [CoopAdministrator]
    code: 200
    input: [action, "waiver_reference?", "void_reason?"]
    output: PiggybackAnalysis
    side_effects:
      - "DETERMINE: freezes doctrine_applied, runs calculations.piggyback_authority (authority_score, deduction_detail, determination, local_waiver_required) and sets determined_at plus the frozen expires_on"
      - "VOID: sets voided_reason = ADMIN_VOID"
      - "increments PiggybackAnalysis.version by 1"

  - method: POST
    path: "/coop/contract-usages"
    description: "Record a member purchase against a contract line, pricing it through the pinned net_unit_price -> add_on_charges -> member_usage_total chain."
    roles: [MemberRepresentative]
    code: 201
    input: [contract_id, member_agency_id, line_item_id, piggyback_analysis_id, quantity, "add_on_codes?"]
    output: ContractUsage
    side_effects:
      - "sets ordered_at from the logical clock and freezes discount_tier_index, net_unit_price_cents, subtotal_cents, add_on_detail, add_on_charges_cents, chargeable_base_cents, effective_fee_rate_bps, admin_fee_cents and total_cents"
      - "adds total_cents to MemberAgency.committed_spend_cents (AFTER the tier snapshot was read) and increments MemberAgency.version by 1"
      - "adds chargeable_base_cents to MasterContract.usage_chargeable_cents_total and increments MasterContract.version by 1"
      - "status = RECORDED, usage_report_id = null, version = 1"
  - method: GET
    path: "/coop/contract-usages/{id}"
    description: "Read one usage including every frozen price component and its sweeping report."
    roles: [CoopAdministrator, LeadAgencyOfficer, SupplierRepresentative, MemberRepresentative, MemberAuditor]
    code: 200
    input: []
    output: ContractUsage
    side_effects: []
  - method: GET
    path: "/coop/contract-usages"
    description: "Reverse-reachability list of usages, filterable by contract_id, member_agency_id, line_item_id, piggyback_analysis_id and usage_report_id."
    roles: [CoopAdministrator, LeadAgencyOfficer, SupplierRepresentative, MemberRepresentative, MemberAuditor]
    code: 200
    input: ["contract_id?", "member_agency_id?", "line_item_id?", "piggyback_analysis_id?", "usage_report_id?", "status?", "limit?", "offset?"]
    output: ContractUsage[]
    side_effects: []
  - method: POST
    path: "/coop/contract-usages/{id}/disposition"
    description: "Member disposition of its own order. action is CONFIRM (making the usage sweepable) or RETRACT (the compensating action)."
    roles: [MemberRepresentative]
    code: 200
    input: [action]
    output: ContractUsage
    side_effects:
      - "RETRACT hop 1: subtracts total_cents from MemberAgency.committed_spend_cents and chargeable_base_cents from MasterContract.usage_chargeable_cents_total, sets retracted_at"
      - "RETRACT hop 2: that reversal re-runs calculations.report_period_sweep on the report named by usage_report_id (when any), rewriting swept_usage_count, reported_chargeable_cents, reported_usage_cents and reported_fee_cents, and clears usage_report_id"
      - "RETRACT hop 3: the recomputed report figures re-run calculations.contract_compliance_posture"
      - "increments ContractUsage.version by 1"

  - method: POST
    path: "/coop/usage-reports"
    description: "Open a DRAFT period usage report for one contract. The closed period must not overlap an existing non-REJECTED report on the same contract."
    roles: [SupplierRepresentative]
    code: 201
    input: [contract_id, period_start, period_end]
    output: UsageReport
    side_effects: ["status = DRAFT, fee_status = NOT_DUE, all figures = 0, version = 1"]
  - method: GET
    path: "/coop/usage-reports/{id}"
    description: "Read one usage report including both variants of the administrative fee and the variance figures."
    roles: [CoopAdministrator, LeadAgencyOfficer, SupplierRepresentative, MemberAuditor]
    code: 200
    input: []
    output: UsageReport
    side_effects: []
  - method: GET
    path: "/coop/usage-reports"
    description: "Reverse-reachability list of usage reports, filterable by contract_id and by either state dimension."
    roles: [CoopAdministrator, LeadAgencyOfficer, SupplierRepresentative, MemberAuditor]
    code: 200
    input: ["contract_id?", "status?", "fee_status?", "limit?", "offset?"]
    output: UsageReport[]
    side_effects: []
  - method: POST
    path: "/coop/usage-reports/{id}/submission"
    description: "Supplier submits (or resubmits after rejection) the period report. action is SUBMIT."
    roles: [SupplierRepresentative]
    code: 200
    input: [action]
    output: UsageReport
    side_effects:
      - "runs calculations.report_period_sweep: sets swept_usage_count, reported_chargeable_cents, reported_usage_cents and stamps usage_report_id on each swept usage"
      - "runs the REPORTED variant of calculations.admin_fee_assessment: sets reported_fee_cents"
      - "increments UsageReport.version by 1"
  - method: POST
    path: "/coop/usage-reports/{id}/review"
    description: "Cooperative review of a submitted report. action is ACCEPT, REJECT or RECONCILE."
    roles: [CoopAdministrator]
    code: 200
    input: [action, "rejection_reason?"]
    output: UsageReport
    side_effects:
      - "ACCEPT: sets accepted_at and fee_due_at, moves fee_status NOT_DUE -> DUE, adds reported_fee_cents to the contract and supplier fee_assessed totals and recomputes fee_outstanding_cents"
      - "REJECT: clears usage_report_id on the swept usages and zeroes every reported figure"
      - "RECONCILE: runs the AUDITED variant (audited_fee_cents, fee_true_up_cents, fee_rebate_cents, variance_pct), applies the true-up to both fee ledgers, and when variance_pct > MAX_REPORT_VARIANCE_PCT sets variance_flagged and charges VARIANCE_DEDUCTION_POINTS, which re-runs the supplier performance cascade"
      - "increments UsageReport.version by 1"
  - method: POST
    path: "/coop/usage-reports/{id}/fee-remittance"
    description: "Supplier remits the administrative fee for one accepted report. action is REMIT and amount_cents must settle the report exactly."
    roles: [SupplierRepresentative]
    code: 200
    input: [action, amount_cents]
    output: UsageReport
    side_effects:
      - "adds amount_cents to remitted_cents, contract.fee_remitted_cents_total and supplier.fee_remitted_cents_total, then recomputes contract.fee_outstanding_cents"
      - "fee_status DUE -> PAID, or DELINQUENT -> PAID which also decrements the delinquent counters, re-runs calculations.contract_compliance_posture and returns DELINQUENCY_DEDUCTION_POINTS to the supplier"
      - "increments UsageReport.version by 1"

  - method: POST
    path: "/coop/contract-amendments"
    description: "Supplier proposes a RENEWAL, PRICE_ADJUSTMENT or PRODUCT_LINE_EXPANSION. Requires expected_contract_version because every ceiling is read off the contract row the client believed it was amending."
    roles: [SupplierRepresentative]
    code: 201
    input: [contract_id, amendment_type, expected_contract_version, "target_line_item_id?", "new_unit_price_cents?", "price_index?", "index_change_pct?", "requested_term_end?", "new_line_items?", "expansion_scope_overlap_pct?"]
    output: ContractAmendment
    side_effects:
      - "any prior ContractAmendment on the same contract with the same amendment_type and status == PROPOSED becomes WITHDRAWN"
      - "PRICE_ADJUSTMENT: stores price_ceiling_cents from calculations.price_adjustment_ceiling"
      - "increments MasterContract.version by 1"
      - "status = PROPOSED, proposed_by_user_id = X-User-ID, version = 1"
  - method: GET
    path: "/coop/contract-amendments/{id}"
    description: "Read one amendment including its computed price_ceiling_cents and effective_from."
    roles: [CoopAdministrator, LeadAgencyOfficer, SupplierRepresentative, MemberAuditor]
    code: 200
    input: []
    output: ContractAmendment
    side_effects: []
  - method: GET
    path: "/coop/contract-amendments"
    description: "Reverse-reachability list of amendments, filterable by contract_id and by target_line_item_id."
    roles: [CoopAdministrator, LeadAgencyOfficer, SupplierRepresentative, MemberAuditor]
    code: 200
    input: ["contract_id?", "target_line_item_id?", "amendment_type?", "status?", "limit?", "offset?"]
    output: ContractAmendment[]
    side_effects: []
  - method: POST
    path: "/coop/contract-amendments/{id}/decision"
    description: "Cooperative decision on a proposed amendment. action is APPROVE or REJECT."
    roles: [CoopAdministrator]
    code: 200
    input: [action, "decision_note?"]
    output: ContractAmendment
    side_effects:
      - "APPROVE RENEWAL: sets contract.current_term_end = requested_term_end and increments contract.renewals_used"
      - "APPROVE PRICE_ADJUSTMENT: rewrites the target line's base_unit_price_cents, price_effective_from, last_price_change_at and price_change_count"
      - "APPROVE PRODUCT_LINE_EXPANSION: creates one ContractLineItem per new_line_items entry with origin = EXPANSION"
      - "APPROVE any type: the solicitation's audit_package_status moves ASSEMBLED/CERTIFIED -> STALE and AMENDMENT_LOG joins its audit_required_doc_codes"
      - "increments ContractAmendment.version and MasterContract.version by 1"
  - method: POST
    path: "/coop/contract-amendments/{id}/withdrawal"
    description: "Supplier withdraws its own proposed amendment. action is WITHDRAW."
    roles: [SupplierRepresentative]
    code: 200
    input: [action]
    output: ContractAmendment
    side_effects: ["status = WITHDRAWN with no contract or line-item change; increments ContractAmendment.version by 1"]

  - method: POST
    path: "/coop/complaints"
    description: "Member files a complaint about a cooperative contract, optionally citing one of its own orders."
    roles: [MemberRepresentative]
    code: 201
    input: [contract_id, member_agency_id, severity, category, narrative, "related_usage_id?"]
    output: MemberComplaint
    side_effects: ["status = INTAKE, points_reversed = false, version = 1"]
  - method: GET
    path: "/coop/complaints/{id}"
    description: "Read one complaint including deduction_points, the appeal window and both duty-segregated user ids."
    roles: [CoopAdministrator, LeadAgencyOfficer, SupplierRepresentative, MemberRepresentative, MemberAuditor]
    code: 200
    input: []
    output: MemberComplaint
    side_effects: []
  - method: GET
    path: "/coop/complaints"
    description: "Reverse-reachability list of complaints, filterable by contract_id, member_agency_id and related_usage_id."
    roles: [CoopAdministrator, LeadAgencyOfficer, SupplierRepresentative, MemberRepresentative, MemberAuditor]
    code: 200
    input: ["contract_id?", "member_agency_id?", "related_usage_id?", "status?", "severity?", "limit?", "offset?"]
    output: MemberComplaint[]
    side_effects: []
  - method: POST
    path: "/coop/complaints/{id}/investigation"
    description: "Investigation stage. action is OPEN_INVESTIGATION (stamping investigator_user_id) or DISMISS (requiring a different adjudicator)."
    roles: [CoopAdministrator]
    code: 200
    input: [action, "note?"]
    output: MemberComplaint
    side_effects:
      - "OPEN_INVESTIGATION: sets investigator_user_id = X-User-ID"
      - "DISMISS: sets adjudicator_user_id and charges no performance points"
      - "increments MemberComplaint.version by 1"
  - method: POST
    path: "/coop/complaints/{id}/decision"
    description: "Adjudication stage. action is SUBSTANTIATE (charging supplier performance points through a five-hop cascade) or CLOSE (after the appeal window elapses)."
    roles: [CoopAdministrator]
    code: 200
    input: [action, "note?"]
    output: MemberComplaint
    side_effects:
      - "SUBSTANTIATE: sets adjudicator_user_id, substantiated_at, appeal_deadline_at and deduction_points"
      - "SUBSTANTIATE hop chain: supplier.deduction_points_total -> performance_score / performance_tier -> qualification_status QUALIFIED->SUSPENDED at PROBATION -> the supplier's ACTIVE contracts -> those contracts' DETERMINED analyses"
      - "increments MemberComplaint.version by 1"
  - method: POST
    path: "/coop/complaints/{id}/appeal"
    description: "Supplier appeals a substantiated complaint inside the APPEAL_WINDOW_DAYS window. action is FILE_APPEAL."
    roles: [SupplierRepresentative]
    code: 200
    input: [action, "note?"]
    output: MemberComplaint
    side_effects: ["sets appeal_filed_at; deduction points remain charged; increments MemberComplaint.version by 1"]
  - method: POST
    path: "/coop/complaints/{id}/appeal-decision"
    description: "Appeal outcome. action is OVERTURN (the compensating action that restores the exact points) or UPHOLD."
    roles: [CoopAdministrator]
    code: 200
    input: [action, "note?"]
    output: MemberComplaint
    side_effects:
      - "OVERTURN: subtracts deduction_points from supplier.deduction_points_total, sets points_reversed = true, decrements substantiated_complaint_count and re-runs calculations.supplier_performance_score, restoring performance_score and performance_tier exactly"
      - "OVERTURN does NOT reinstate qualification_status; an explicit REINSTATE is required"
      - "UPHOLD: no ledger change"
      - "increments MemberComplaint.version by 1"

errors:
  # --- auth / envelope (priority 1-3) ---
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-Role or X-User-ID absent, empty, or X-User-Role not one of the five declared role names"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting X-User-Role is not listed in the target endpoint's roles"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required input is absent, a value has the wrong type, an enum value is outside the declared set, a monetary/count field is negative, a percentage is outside 0.00-100.00, technical_weight_pct + price_weight_pct != 100, quantity < 1, admin_fee_rate_bps outside 0-1000, discount_tiers is not ascending by min_spend_cents, permitted_add_ons contains a duplicate code, or period_end <= period_start / base_term_end <= base_term_start"

  # --- path and body referential existence (priority 4-6) ---
  - id: ERR_SOLICITATION_NOT_FOUND
    http: 404
    condition: "the Solicitation named by the path {id} or by solicitation_id does not exist"
  - id: ERR_SUPPLIER_NOT_FOUND
    http: 404
    condition: "the Supplier named by the path {id} or by supplier_id does not exist"
  - id: ERR_RESPONSE_NOT_FOUND
    http: 404
    condition: "the SolicitationResponse named by the path {id} does not exist"
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "the MasterContract named by the path {id} or by contract_id does not exist"
  - id: ERR_LINE_ITEM_NOT_FOUND
    http: 404
    condition: "the ContractLineItem named by the path {id}, by line_item_id, or by target_line_item_id does not exist"
  - id: ERR_MEMBER_NOT_FOUND
    http: 404
    condition: "the MemberAgency named by the path {id} or by member_agency_id does not exist"
  - id: ERR_ANALYSIS_NOT_FOUND
    http: 404
    condition: "the PiggybackAnalysis named by the path {id} or by piggyback_analysis_id does not exist"
  - id: ERR_USAGE_NOT_FOUND
    http: 404
    condition: "the ContractUsage named by the path {id} or by related_usage_id does not exist"
  - id: ERR_REPORT_NOT_FOUND
    http: 404
    condition: "the UsageReport named by the path {id} does not exist"
  - id: ERR_AMENDMENT_NOT_FOUND
    http: 404
    condition: "the ContractAmendment named by the path {id} does not exist"
  - id: ERR_COMPLAINT_NOT_FOUND
    http: 404
    condition: "the MemberComplaint named by the path {id} does not exist"
  - id: ERR_STATE_LAW_RULE_NOT_FOUND
    http: 404
    condition: "no StateLawRule row exists for a state_code the operation must resolve (the member's state on a piggyback analysis, the lead agency's state on a solicitation posting, the supplier's home state on qualification)"

  # --- identity, duty segregation and concurrency (priority 7-9) ---
  - id: ERR_ACTOR_SCOPE_MISMATCH
    http: 403
    condition: "an entity_backed actor writes outside its own scope: for SupplierRepresentative X-User-ID does not equal the supplier_id reachable from the target resource, or for MemberRepresentative X-User-ID does not equal the member_agency_id reachable from the target resource"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the same X-User-ID would occupy two duty-segregated positions: recommending and awarding the same solicitation, investigating and adjudicating the same complaint, or adjudicating a complaint whose appeal it also decides"
  - id: ERR_STALE_MEMBER_AGENCY_VERSION
    http: 412
    condition: "expected_member_agency_version does not equal the current MemberAgency.version on POST /coop/piggyback-analyses"
  - id: ERR_STALE_CONTRACT_VERSION
    http: 412
    condition: "expected_contract_version does not equal the current MasterContract.version on POST /coop/contract-amendments"

  # --- state-machine gates (priority 10-24) ---
  - id: ERR_CONTRACT_NOT_ACTIVE
    http: 409
    condition: "an operation that requires a live cooperative contract (recording usage, opening a usage report, proposing an amendment, filing a complaint) targets a MasterContract whose status is not ACTIVE"
  - id: ERR_AMENDMENT_NOT_PROPOSED
    http: 409
    condition: "a decision or withdrawal targets a ContractAmendment whose status is not PROPOSED"
  - id: ERR_COMPLAINT_INVALID_STATE
    http: 409
    condition: "the requested complaint action is not a declared transition out of the complaint's current status"
  - id: ERR_SOLICITATION_INVALID_STATE
    http: 409
    condition: "the requested lifecycle or audit-package action is not a declared transition out of the solicitation's current status or audit_package_status"
  - id: ERR_RESPONSE_INVALID_STATE
    http: 409
    condition: "the requested review or submission action is not a declared transition out of the SolicitationResponse's current status"
  - id: ERR_REPORT_INVALID_STATE
    http: 409
    condition: "the requested submission or review action is not a declared transition out of the UsageReport's current status"
  - id: ERR_USAGE_INVALID_STATE
    http: 409
    condition: "the requested disposition action is not a declared transition out of the ContractUsage's current status"
  - id: ERR_USAGE_ALREADY_SETTLED
    http: 409
    condition: "a RETRACT targets a ContractUsage whose sweeping UsageReport has already been accepted (fee_status is DUE, DELINQUENT or PAID), so the fee ledger can no longer be unwound"
  - id: ERR_MEMBER_INVALID_STATE
    http: 409
    condition: "the requested registration action is not a declared transition out of the MemberAgency's current registration_status"
  - id: ERR_MEMBER_NOT_ACTIVE
    http: 409
    condition: "an operation that requires a verified member (opening a piggyback analysis, recording usage, filing a complaint) targets a MemberAgency whose registration_status is not ACTIVE"
  - id: ERR_ANALYSIS_INVALID_STATE
    http: 409
    condition: "the requested determination action is not a declared transition out of the PiggybackAnalysis's current status"
  - id: ERR_LINE_ITEM_NOT_ACTIVE
    http: 409
    condition: "usage or a price adjustment targets a ContractLineItem whose status is not ACTIVE"
  - id: ERR_FEE_STATUS_INVALID
    http: 409
    condition: "the requested fee action is not a declared transition out of the UsageReport's current fee_status (remitting against NOT_DUE or PAID, or accepting a report whose fee_status is not NOT_DUE)"
  - id: ERR_SOLICITATION_NOT_AWARDED
    http: 409
    condition: "a master contract is created against a Solicitation whose status is not AWARDED"
  - id: ERR_CONTRACT_INVALID_STATE
    http: 409
    condition: "the requested award-status action is not a declared transition out of the MasterContract's current status"
  - id: ERR_SUPPLIER_INVALID_STATE
    http: 409
    condition: "the requested qualification action is not a declared transition out of the Supplier's current qualification_status"

  # --- business safety (priority 25-33) ---
  - id: ERR_SUPPLIER_NOT_QUALIFIED
    http: 409
    condition: "a response, award or contract execution involves a Supplier whose qualification_status is not QUALIFIED"
  - id: ERR_SUPPLIER_DEBARRED
    http: 409
    condition: "any write that would extend cooperative business to a Supplier whose qualification_status is DEBARRED"
  - id: ERR_NONPROFIT_EVIDENCE_MISSING
    http: 422
    condition: "a MemberAgency in the NONPROFIT or HIGHER_ED_CONSORTIUM category is verified without irs_determination_letter_number"
  - id: ERR_GOVERNING_RESOLUTION_MISSING
    http: 422
    condition: "a MemberAgency in a government category (STATE_AGENCY, COUNTY, MUNICIPALITY, K12_DISTRICT, SPECIAL_DISTRICT) is verified without governing_body_resolution_number"
  - id: ERR_NONPROFIT_NOT_PERMITTED
    http: 422
    condition: "a MemberAgency in the NONPROFIT_501C3 category is verified while its StateLawRule has allows_nonprofit_participation == false"
  - id: ERR_LOCAL_WAIVER_REQUIRED
    http: 422
    condition: "the member's StateLawRule has requires_local_solicitation_waiver == true and no waiver_reference has been supplied by determination time"
  - id: ERR_PIGGYBACK_NOT_AUTHORIZED
    http: 409
    condition: "usage is recorded against a PiggybackAnalysis whose status is not DETERMINED, or whose determination is DENIED (determination IN {AUTHORIZED, CONDITIONAL} is required)"
  - id: ERR_PIGGYBACK_EXPIRED
    http: 409
    condition: "usage is recorded against a DETERMINED PiggybackAnalysis whose frozen expires_on is at or before the logical clock (the rule is expires_on > now, so an instant exactly equal to expires_on is already expired)"
  - id: ERR_CONTRACT_POSTURE_DELINQUENT
    http: 409
    condition: "usage is recorded against a contract whose compliance_posture is DELINQUENT while its status is still ACTIVE (the amount-triggered delinquency that does not suspend the contract)"
  - id: ERR_AUDIT_PACKAGE_INCOMPLETE
    http: 409
    condition: "a solicitation's audit package is certified while audit_completeness_pct < 100.00, i.e. at least one required doc code is absent from audit_present_doc_codes"
  - id: ERR_AUDIT_PACKAGE_NOT_ASSEMBLED
    http: 409
    condition: "CERTIFY is requested while audit_package_status is NOT_ASSEMBLED or STALE"

  # --- business referential coherence (priority 34-40) ---
  - id: ERR_LINE_ITEM_CONTRACT_MISMATCH
    http: 422
    condition: "line_item_id (or target_line_item_id) names a ContractLineItem whose contract_id differs from the contract_id of the request"
  - id: ERR_ANALYSIS_PAIR_MISMATCH
    http: 422
    condition: "piggyback_analysis_id names a PiggybackAnalysis whose (member_agency_id, contract_id) pair differs from the pair on the request"
  - id: ERR_USAGE_PAIR_MISMATCH
    http: 422
    condition: "related_usage_id names a ContractUsage whose contract_id or member_agency_id differs from the complaint's own"
  - id: ERR_AMENDMENT_PAYLOAD_MISMATCH
    http: 422
    condition: "the polymorphic amendment payload does not match amendment_type: RENEWAL without requested_term_end, PRICE_ADJUSTMENT without target_line_item_id / new_unit_price_cents / price_index / index_change_pct, PRODUCT_LINE_EXPANSION without new_line_items, or a field belonging to a different amendment_type is present"
  - id: ERR_ADD_ON_NOT_PERMITTED
    http: 422
    condition: "an add_on_codes entry is not present in the contract's permitted_add_ons catalogue, or the list repeats a code"
  - id: ERR_DUPLICATE_RESPONSE
    http: 409
    condition: "the supplier already has a SolicitationResponse on this solicitation with status not in {WITHDRAWN, NON_RESPONSIVE}"
  - id: ERR_AWARD_NOT_HIGHEST_RANKED
    http: 422
    condition: "a master contract is created for a supplier whose response on the awarded solicitation does not hold award_rank == 1"
  - id: ERR_NO_ACTIVE_LINE_ITEMS
    http: 409
    condition: "a contract is executed with no ACTIVE ContractLineItem on its price sheet"

  # --- business temporal (priority 41-49) ---
  - id: ERR_RESPONSE_DUE_IN_PAST
    http: 422
    condition: "a solicitation is posted with response_due_at at or before the logical clock, or with fewer than the StateLawRule's min_notice_days of notice"
  - id: ERR_SOLICITATION_CLOSED_FOR_RESPONSES
    http: 409
    condition: "a response is filed after response_due_at, or against a solicitation whose status is not POSTED"
  - id: ERR_RESPONSE_WINDOW_OPEN
    http: 409
    condition: "evaluation is opened before response_due_at has elapsed on the logical clock"
  - id: ERR_REPORT_PERIOD_NOT_ELAPSED
    http: 422
    condition: "a usage report is submitted before its period_end has elapsed on the logical clock"
  - id: ERR_REPORT_PERIOD_OVERLAP
    http: 409
    condition: "the requested CLOSED [period_start, period_end] interval shares at least one calendar day with an existing non-REJECTED UsageReport on the same contract (a period starting on the exact day a prior period ends is an overlap)"
  - id: ERR_PRICE_WINDOW_TOO_SOON
    http: 409
    condition: "a PRICE_ADJUSTMENT targets a line whose last_price_change_at is fewer than PRICE_STABILITY_BUFFER_DAYS before the logical clock (exactly PRICE_STABILITY_BUFFER_DAYS days later is permitted)"
  - id: ERR_RENEWAL_TERM_NOT_EXTENDING
    http: 422
    condition: "requested_term_end is not strictly after the contract's current_term_end (the HALF-OPEN term [start, end) means a requested end equal to current_term_end extends nothing)"
  - id: ERR_RENEWAL_TERM_TOO_LONG
    http: 422
    condition: "requested_term_end extends current_term_end by more than MAX_RENEWAL_MONTHS"
  - id: ERR_TOTAL_TERM_EXCEEDS_MAX
    http: 422
    condition: "the merged HALF-OPEN term [base_term_start, requested_term_end) exceeds MAX_TOTAL_TERM_MONTHS or the member state's max_contract_term_months"
  - id: ERR_OUTSIDE_CONTRACT_TERM
    http: 409
    condition: "usage is recorded with ordered_at outside the contract's HALF-OPEN term [base_term_start, current_term_end): the instant equal to base_term_start is inside, the instant equal to current_term_end is outside"
  - id: ERR_APPEAL_WINDOW_CLOSED
    http: 409
    condition: "an appeal is filed after appeal_deadline_at has passed on the logical clock (the instant exactly equal to appeal_deadline_at is still inside the window)"
  - id: ERR_APPEAL_WINDOW_OPEN
    http: 409
    condition: "a substantiated complaint is closed while appeal_deadline_at is still in the future and no appeal has been decided"

  # --- business constraint / boundary ---
  - id: ERR_INSUFFICIENT_RESPONSIVE_RESPONSES
    http: 422
    condition: "award recommendation is requested with fewer than MIN_RESPONSIVE_RESPONSES responses in RESPONSIVE status, so no competitive award can be documented"
  - id: ERR_TECHNICAL_SCORE_MISSING
    http: 422
    condition: "MARK_RESPONSIVE is requested without technical_score, or technical_score is outside 0.00-100.00"
  - id: ERR_INFO_REQUEST_ROUNDS_EXHAUSTED
    http: 409
    condition: "REQUEST_INFO is requested when info_request_rounds has already reached MAX_INFO_REQUEST_ROUNDS (2)"
  - id: ERR_DOCS_REQUEST_ROUNDS_EXHAUSTED
    http: 409
    condition: "REQUEST_DOCS is requested when docs_request_count has already reached MAX_DOCS_REQUEST_ROUNDS (3)"
  - id: ERR_PRICE_BELOW_FLOOR
    http: 422
    condition: "a price adjustment or an awarded line sets base_unit_price_cents below price_floor_cents, or price_floor_cents exceeds base_unit_price_cents at line creation"
  - id: ERR_PRICE_ESCALATION_EXCEEDS_CAP
    http: 422
    condition: "new_unit_price_cents is strictly above the price_ceiling_cents produced by calculations.price_adjustment_ceiling (a price exactly equal to the ceiling is permitted)"
  - id: ERR_RENEWAL_LIMIT_REACHED
    http: 409
    condition: "a RENEWAL is proposed or approved when renewals_used has already reached max_renewals"
  - id: ERR_EXPANSION_OUT_OF_SCOPE
    http: 422
    condition: "a PRODUCT_LINE_EXPANSION declares expansion_scope_overlap_pct below EXPANSION_SCOPE_MIN_PCT (0.8000), i.e. the new products fall outside the competitively solicited scope"
  - id: ERR_REMITTANCE_AMOUNT_MISMATCH
    http: 422
    condition: "amount_cents does not exactly equal the report's outstanding fee (audited_fee_cents when reconciled, otherwise reported_fee_cents, minus remitted_cents)"
  - id: ERR_MEMBER_CEILING_EXCEEDED
    http: 422
    condition: "committed_spend_cents + this usage's total_cents would exceed the member's annual_spend_ceiling_cents (landing exactly on the ceiling is permitted)"
  - id: ERR_FEE_LEDGER_INCONSISTENT
    http: 409
    condition: "the fee ledger would become internally inconsistent: a remittance that would drive fee_outstanding_cents below zero, or an acceptance whose fee figures do not reconcile with the swept usages' admin_fee_cents"

  # --- uniqueness ---
  - id: ERR_DUPLICATE_STATE_LAW_RULE
    http: 409
    condition: "a StateLawRule already exists for this state_code"
  - id: ERR_DUPLICATE_SOLICITATION_NUMBER
    http: 409
    condition: "solicitation_number is already used by another Solicitation"
  - id: ERR_DUPLICATE_SUPPLIER_NAME
    http: 409
    condition: "legal_name is already used by another Supplier"
  - id: ERR_DUPLICATE_CONTRACT_NUMBER
    http: 409
    condition: "contract_number is already used by another MasterContract"
  - id: ERR_DUPLICATE_SKU
    http: 409
    condition: "sku is already used by another non-WITHDRAWN ContractLineItem on the same contract"
  - id: ERR_DUPLICATE_MEMBER_NAME
    http: 409
    condition: "legal_name is already used by another MemberAgency in the same state_code"

roles:
  - name: CoopAdministrator
    description: "Cooperative purchasing organization staff: run the membership desk, determine piggyback authority, review usage reports and administrative fee remittances, decide amendments, and adjudicate member complaints. Duty segregation is enforced by X-User-ID inside this role, so distinct administrators must occupy the review/decide and investigate/adjudicate positions."
    identity: "opaque"
    exclusive_operations:
      - "register suppliers and member agencies (POST /coop/suppliers, POST /coop/member-agencies)"
      - "move supplier qualification standing (POST /coop/suppliers/{id}/qualification)"
      - "move member registration and eligibility (POST /coop/member-agencies/{id}/registration)"
      - "determine or void piggyback authority (POST /coop/piggyback-analyses/{id}/determination)"
      - "move contract execution status (POST /coop/master-contracts/{id}/award-status)"
      - "run the delinquency sweep (POST /coop/master-contracts/{id}/compliance-sweep)"
      - "review, reject or reconcile usage reports (POST /coop/usage-reports/{id}/review)"
      - "decide amendments (POST /coop/contract-amendments/{id}/decision)"
      - "investigate, adjudicate and decide complaint appeals (POST /coop/complaints/{id}/investigation, /decision, /appeal-decision)"
      - "register state law rules (POST /coop/state-law-rules)"
      - "set the logical clock (POST /_clock/set_current_utc)"
    shared_operations:
      - "open a piggyback analysis (POST /coop/piggyback-analyses) — shared with MemberRepresentative"
      - "all read endpoints"
  - name: LeadAgencyOfficer
    description: "Procurement officer of the lead agency that conducts the competitive solicitation on behalf of the cooperative's members. Runs the solicitation, evaluates responses, awards the master contract, publishes the price sheet, and assembles/certifies the documentation package members file in their audit records. Recommendation and award are duty-segregated within this role."
    identity: "opaque"
    exclusive_operations:
      - "create and drive solicitations (POST /coop/solicitations, POST /coop/solicitations/{id}/lifecycle)"
      - "assemble and certify the audit package (POST /coop/solicitations/{id}/audit-package)"
      - "evaluate responses (POST /coop/solicitation-responses/{id}/review)"
      - "award the master contract (POST /coop/master-contracts)"
      - "publish awarded price-sheet lines (POST /coop/master-contracts/{id}/line-items)"
    shared_operations:
      - "all read endpoints"
  - name: SupplierRepresentative
    description: "Awarded or bidding supplier acting for itself. Files and maintains its solicitation response, reports contract usage by period, remits the administrative fee, proposes renewals / price adjustments / product line expansions, and appeals substantiated complaints. Every write is scoped to its own supplier_id."
    identity: "entity_backed:Supplier"
    exclusive_operations:
      - "file and maintain a response (POST /coop/solicitation-responses, POST /coop/solicitation-responses/{id}/submission)"
      - "open and submit usage reports (POST /coop/usage-reports, POST /coop/usage-reports/{id}/submission)"
      - "remit the administrative fee (POST /coop/usage-reports/{id}/fee-remittance)"
      - "propose and withdraw amendments (POST /coop/contract-amendments, POST /coop/contract-amendments/{id}/withdrawal)"
      - "appeal a substantiated complaint (POST /coop/complaints/{id}/appeal)"
    shared_operations:
      - "read its own contracts, price sheet, usages, reports, amendments and complaints"
  - name: MemberRepresentative
    description: "Participating government or nonprofit agency acting for itself. Requests piggyback authority analysis, places and disposes of orders against the cooperative contract, prices hypothetical orders, and files complaints. Every write is scoped to its own member_agency_id."
    identity: "entity_backed:MemberAgency"
    exclusive_operations:
      - "record and dispose of usage (POST /coop/contract-usages, POST /coop/contract-usages/{id}/disposition)"
      - "file member complaints (POST /coop/complaints)"
    shared_operations:
      - "open a piggyback analysis (POST /coop/piggyback-analyses) — shared with CoopAdministrator"
      - "price a hypothetical order (GET /coop/master-contracts/{id}/price-quote) — shared with CoopAdministrator"
      - "read its own analyses, usages and complaints"
  - name: MemberAuditor
    description: "External or internal auditor of a member agency who reconstructs the competitive-solicitation documentation package and the fee remittance trail from the audit file. Strictly read-only: it holds no write operation anywhere in the API."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "every GET endpoint in the API, including GET /coop/solicitations/{id}/responses, GET /coop/master-contracts/{id}/usage-reports and GET /coop/master-contracts/{id}/price-quote"
