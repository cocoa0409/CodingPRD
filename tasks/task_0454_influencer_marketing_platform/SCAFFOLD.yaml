scenario: "Influencer Marketing Campaign Platform: creator discovery & audience metrics, campaign brief & deliverables, rate negotiation & contract, content approval & FTC disclosure (#ad), tracking link/promo-code attribution, performance (CPM/CPE/ROAS), payout & 1099, brand-safety/fraud detection"
domain_name: influencer-marketing-platform
api_prefix: ""

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation        # estimated vs actual performance; gross vs net payout
    - rate_threshold_triggers         # 1099 $600 threshold; brand-safety/fraud score breakpoints
    - cascading_side_effects          # contract signing fans out deliverables; reject cascades
    - optimistic_concurrency          # negotiation rounds + payout creation on a parent version
    - derived_field_reconciliation    # campaign committed/spent; creator YTD earnings

  entity_topology: graph
  # Peer entities linked by foreign keys (Brand, Creator, Campaign) plus
  # many-to-one junction-style entities (Offer references both Campaign and
  # Creator; Contract references Offer). No deep URL nesting — flat collections
  # with FK references and a few sub-resources.

  state_machine_shape: cyclic
  # Offer negotiation is a cycle: OFFERED -> COUNTERED -> OFFERED (re-offer)
  # bounded by a max-rounds counter. ContentSubmission has a branching
  # revision loop. Payout has a parallel/branching settlement path.

  relationship_patterns:
    - one_to_many        # Campaign -> Deliverable; Creator -> AudienceSnapshot
    - many_to_many       # Campaign <-> Creator via Offer/Contract
    - cross_aggregate    # ConversionEvent -> AttributionAsset -> Contract -> Campaign

  role_model: peer_roles
  # Brand owns campaigns/offers-from-brand-side; Creator owns content/counter-offers;
  # ComplianceOfficer owns FTC & brand-safety & 1099 gating; PlatformAdmin operates
  # discovery seeding, clock, and conversion ingestion.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Brand
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Brand legal/company name
        constraints: non-empty
      - name: contact_email
        type: string
        source: input
        description: Primary contact email for the brand
      - name: budget_cents
        type: integer
        source: input
        description: Total marketing budget across all campaigns, in integer cents
        constraints: ">= 0"
      - name: committed_cents
        type: integer
        source: computed
        description: Sum of contracted_rate_cents over all this brand's Contracts whose status IN {ACTIVE, FULFILLED, SETTLED}; recomputed on contract signing/cancellation
        default: 0
      - name: available_budget_cents
        type: integer
        source: computed
        description: budget_cents - committed_cents; gate for new contract signing
        default: 0

  - name: Creator
    parent: null
    common_fields: true
    fields:
      - name: handle
        type: string
        source: input
        description: Unique social handle (e.g. "@foodie")
        constraints: unique across Creator; non-empty
      - name: primary_platform
        type: enum
        source: input
        description: Primary social platform
        constraints: one of {INSTAGRAM, TIKTOK, YOUTUBE}
      - name: payout_method
        type: enum
        source: input
        description: How the creator is paid
        constraints: one of {ACH, PAYPAL}
        default: ACH
      - name: tax_id_on_file
        type: boolean
        source: input
        description: Whether a W-9 tax id is on file; required before payouts can be released
        default: false
      - name: discovery_status
        type: enum
        source: computed
        description: Discovery eligibility derived from latest AudienceSnapshot fraud_score; DISCOVERABLE if latest snapshot exists and fraud_score < FRAUD_BLOCK_THRESHOLD, otherwise SUPPRESSED; NEW when no snapshot exists
        default: NEW
        constraints: one of {NEW, DISCOVERABLE, SUPPRESSED}
      - name: brand_safety_status
        type: enum
        source: computed
        description: Aggregate brand-safety posture derived from open BrandSafetyFlag rows; CLEAR if no flag with status OPEN, FLAGGED if >=1 OPEN flag of severity LOW or MEDIUM, BLOCKED if >=1 OPEN flag of severity HIGH; recomputed on flag open/resolve
        default: CLEAR
        constraints: one of {CLEAR, FLAGGED, BLOCKED}
      - name: ytd_paid_cents
        type: integer
        source: computed
        description: Sum of net_amount_cents over this creator's Payouts with status SETTLED in the current tax year; drives 1099 generation
        default: 0

  - name: AudienceSnapshot
    parent: Creator
    common_fields: false
    fields:
      - name: creator_id
        type: string
        source: input
        description: FK -> Creator.id
      - name: follower_count
        type: integer
        source: input
        description: Total follower count at snapshot time
        constraints: ">= 0"
      - name: avg_engagement_rate
        type: number
        source: input
        description: Average engagement rate as a fraction (e.g. 0.045 = 4.5%)
        constraints: "0 <= value <= 1"
      - name: estimated_reach
        type: integer
        source: input
        description: Estimated per-post reach (unique accounts)
        constraints: ">= 0"
      - name: fake_follower_pct
        type: number
        source: input
        description: Estimated fraction of fake/bot followers (e.g. 0.12 = 12%)
        constraints: "0 <= value <= 1"
      - name: fraud_score
        type: number
        source: computed
        description: Composite fraud score 0..100 computed from fake_follower_pct and engagement anomaly; see calculations.fraud_score
        constraints: "0 <= value <= 100"
      - name: captured_at
        type: datetime
        source: system
        description: Logical-clock timestamp when snapshot was recorded (ISO 8601 UTC)

  - name: Campaign
    parent: Brand
    common_fields: true
    fields:
      - name: brand_id
        type: string
        source: input
        description: FK -> Brand.id
      - name: title
        type: string
        source: input
        description: Campaign brief title
        constraints: non-empty
      - name: campaign_budget_cents
        type: integer
        source: input
        description: Budget earmarked for this campaign, integer cents
        constraints: ">= 1"
      - name: requires_ftc_disclosure
        type: boolean
        source: input
        description: Whether sponsored content must carry an FTC #ad disclosure (true for paid partnerships)
        default: true
      - name: starts_at
        type: datetime
        source: input
        description: Campaign window start (ISO 8601 UTC, inclusive)
      - name: ends_at
        type: datetime
        source: input
        description: Campaign window end (ISO 8601 UTC, exclusive); must be after starts_at
      - name: status
        type: enum
        source: computed
        description: Lifecycle state; see state_machines.Campaign
        default: DRAFT
        constraints: one of {DRAFT, OPEN, ACTIVE, CLOSED, CANCELLED}
      - name: committed_cents
        type: integer
        source: computed
        description: Sum of contracted_rate_cents over this campaign's Contracts with status IN {ACTIVE, FULFILLED, SETTLED}; recomputed on contract signing/cancellation
        default: 0
      - name: actual_spend_cents
        type: integer
        source: computed
        description: Sum of net_amount_cents over this campaign's Payouts with status SETTLED; recomputed on payout settlement
        default: 0

  - name: Deliverable
    parent: Campaign
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: input
        description: FK -> Campaign.id
      - name: content_type
        type: enum
        source: input
        description: Required content format
        constraints: one of {FEED_POST, STORY, REEL, VIDEO}
      - name: quantity
        type: integer
        source: input
        description: Number of pieces of this content type required
        constraints: ">= 1"
      - name: due_at
        type: datetime
        source: input
        description: Deadline for content submission (ISO 8601 UTC, exclusive)
      - name: base_rate_cents
        type: integer
        source: input
        description: Brand's listed price per piece for this deliverable, integer cents
        constraints: ">= 0"

  - name: Offer
    parent: null
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: input
        description: FK -> Campaign.id
      - name: creator_id
        type: string
        source: input
        description: FK -> Creator.id
      - name: initiated_by
        type: enum
        source: system
        description: Which side opened the offer
        constraints: one of {BRAND, CREATOR}
      - name: current_amount_cents
        type: integer
        source: input
        description: Current proposed total fee on the table, integer cents
        constraints: ">= 1"
      - name: last_actor
        type: enum
        source: computed
        description: Which side made the most recent move; counter must come from the opposite side
        constraints: one of {BRAND, CREATOR}
      - name: round_count
        type: integer
        source: computed
        description: Number of counter rounds taken; capped at MAX_NEGOTIATION_ROUNDS (= 4)
        default: 0
      - name: exclusivity_days
        type: integer
        source: input
        description: Exclusivity window length in days requested for the resulting contract
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        description: Negotiation state; see state_machines.Offer
        default: OFFERED
        constraints: one of {OFFERED, COUNTERED, ACCEPTED, DECLINED, EXPIRED}

  - name: Contract
    parent: null
    common_fields: true
    fields:
      - name: offer_id
        type: string
        source: input
        description: FK -> Offer.id
      - name: campaign_id
        type: string
        source: computed
        description: FK -> Campaign.id; copied from the source Offer at signing
      - name: creator_id
        type: string
        source: computed
        description: FK -> Creator.id; copied from the source Offer at signing
      - name: contracted_rate_cents
        type: integer
        source: computed
        description: Frozen fee copied from Offer.current_amount_cents at signing (version-pinned)
        constraints: ">= 1"
      - name: pinned_offer_version
        type: integer
        source: computed
        description: Offer.version observed at signing; detects stale reference if the offer mutates afterward
      - name: exclusivity_start
        type: datetime
        source: computed
        description: Exclusivity window start (ISO 8601 UTC, inclusive) = signing clock time
      - name: exclusivity_end
        type: datetime
        source: computed
        description: Exclusivity window end (ISO 8601 UTC, exclusive) = exclusivity_start + Offer.exclusivity_days; equals exclusivity_start when exclusivity_days is 0 (empty window)
      - name: status
        type: enum
        source: computed
        description: Contract lifecycle; see state_machines.Contract
        default: ACTIVE
        constraints: one of {ACTIVE, FULFILLED, SETTLED, CANCELLED}

  - name: ContentSubmission
    parent: null
    common_fields: true
    fields:
      - name: deliverable_id
        type: string
        source: input
        description: FK -> Deliverable.id
      - name: contract_id
        type: string
        source: input
        description: FK -> Contract.id
      - name: media_url
        type: string
        source: input
        description: URL of the submitted content asset
        constraints: non-empty
      - name: caption
        type: string
        source: input
        description: Caption text accompanying the content; scanned for FTC disclosure
      - name: has_ftc_disclosure
        type: boolean
        source: computed
        description: True iff caption contains a recognized FTC disclosure token (#ad or #sponsored, case-insensitive); see calculations.ftc_disclosure_detect
        default: false
      - name: revision_count
        type: integer
        source: computed
        description: Number of times this submission has been sent back for revision; capped at MAX_REVISION_ROUNDS (= 2)
        default: 0
      - name: status
        type: enum
        source: computed
        description: Approval lifecycle; see state_machines.ContentSubmission
        default: SUBMITTED
        constraints: one of {SUBMITTED, IN_REVIEW, CHANGES_REQUESTED, APPROVED, REJECTED}

  - name: AttributionAsset
    parent: Contract
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: FK -> Contract.id
      - name: asset_type
        type: enum
        source: input
        description: Attribution mechanism
        constraints: one of {TRACKING_LINK, PROMO_CODE}
      - name: code_or_slug
        type: string
        source: input
        description: For PROMO_CODE the literal code; for TRACKING_LINK the URL slug; unique across all active AttributionAsset
        constraints: unique across AttributionAsset whose status = ENABLED; non-empty
      - name: status
        type: enum
        source: computed
        description: ENABLED while the contract is ACTIVE/FULFILLED; DISABLED when contract terminal-cancelled; see state_machines
        default: ENABLED
        constraints: one of {ENABLED, DISABLED}

  - name: ConversionEvent
    parent: AttributionAsset
    common_fields: false
    fields:
      - name: attribution_asset_id
        type: string
        source: input
        description: FK -> AttributionAsset.id
      - name: event_type
        type: enum
        source: input
        description: Kind of attributed event
        constraints: one of {IMPRESSION, ENGAGEMENT, SALE}
      - name: count
        type: integer
        source: input
        description: Number of events of this type in the batch
        constraints: ">= 1"
      - name: revenue_cents
        type: integer
        source: input
        description: Gross revenue attributed to this batch, integer cents; must be 0 unless event_type = SALE
        default: 0
        constraints: ">= 0"
      - name: occurred_at
        type: datetime
        source: system
        description: Logical-clock timestamp when the batch was ingested (ISO 8601 UTC)

  - name: Payout
    parent: Contract
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: FK -> Contract.id
      - name: gross_amount_cents
        type: integer
        source: computed
        description: Frozen = Contract.contracted_rate_cents at payout creation
        constraints: ">= 1"
      - name: platform_fee_cents
        type: integer
        source: computed
        description: Platform commission withheld; see calculations.payout_breakdown
        default: 0
      - name: tax_withholding_cents
        type: integer
        source: computed
        description: Backup withholding applied when creator.tax_id_on_file is false; see calculations.payout_breakdown
        default: 0
      - name: net_amount_cents
        type: integer
        source: computed
        description: gross_amount_cents - platform_fee_cents - tax_withholding_cents; see calculations.payout_breakdown
        constraints: ">= 0"
      - name: expected_contract_version
        type: integer
        source: input
        description: Caller's last-observed Contract.version for OCC on payout creation
      - name: status
        type: enum
        source: computed
        description: Payout lifecycle; see state_machines.Payout
        default: PENDING
        constraints: one of {PENDING, RELEASED, SETTLED, FAILED}

  - name: TaxForm1099
    parent: Creator
    common_fields: true
    fields:
      - name: creator_id
        type: string
        source: input
        description: FK -> Creator.id
      - name: tax_year
        type: integer
        source: input
        description: Calendar year the form covers (e.g. 2026)
      - name: total_reported_cents
        type: integer
        source: computed
        description: Sum of net_amount_cents over the creator's SETTLED Payouts whose settlement clock falls in tax_year; frozen at generation; see calculations.tax_1099_total
        constraints: ">= 60000"
      - name: status
        type: enum
        source: computed
        description: 1099 lifecycle; see state_machines.TaxForm1099
        default: GENERATED
        constraints: one of {GENERATED, FILED, VOIDED}

  - name: BrandSafetyFlag
    parent: Creator
    common_fields: true
    fields:
      - name: creator_id
        type: string
        source: input
        description: FK -> Creator.id
      - name: severity
        type: enum
        source: input
        description: Risk severity of the flag
        constraints: one of {LOW, MEDIUM, HIGH}
      - name: reason_code
        type: enum
        source: input
        description: Categorized reason for the flag
        constraints: one of {HATE_SPEECH, FRAUD_SIGNAL, NSFW, MISINFORMATION, OTHER}
      - name: note
        type: string
        source: input
        description: Free-text reviewer note
        default: ""
      - name: status
        type: enum
        source: computed
        description: Flag lifecycle; see state_machines.BrandSafetyFlag
        default: OPEN
        constraints: one of {OPEN, RESOLVED}

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: Campaign
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /campaigns/{id}/open"
        actor: Brand
        preconditions:
          - "campaign has >= 1 Deliverable"
          - "campaign.starts_at < campaign.ends_at"
          - "acting Brand owns this campaign (X-User-ID == campaign.brand_id)"
          - "no non-CANCELLED campaign of the same brand has a window within CAMPAIGN_BUFFER_DAYS (= 7) of this campaign's window (buffer-expanded overlap, adjacency rejected)"
        side_effects:
          - "campaign.status = OPEN"
          - "increments Campaign.version by 1"
        note: "Open campaigns are discoverable by creators and accept offers."
      - from: OPEN
        to: ACTIVE
        trigger: "system: first Contract signed against this campaign"
        actor: system
        preconditions:
          - "a Contract for this campaign was just signed"
        side_effects:
          - "campaign.status = ACTIVE"
          - "increments Campaign.version by 1"
        note: "Auto-transition fired as a side effect of contract signing (bubble-up)."
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /campaigns/{id}/close"
        actor: Brand
        preconditions:
          - "every Contract for this campaign is in status IN {SETTLED, CANCELLED}"
          - "acting Brand owns this campaign"
        side_effects:
          - "campaign.status = CLOSED"
          - "increments Campaign.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /campaigns/{id}/cancel"
        actor: Brand
        preconditions:
          - "acting Brand owns this campaign"
        side_effects:
          - "campaign.status = CANCELLED"
          - "increments Campaign.version by 1"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /campaigns/{id}/cancel"
        actor: Brand
        preconditions:
          - "no Contract for this campaign is in status IN {ACTIVE, FULFILLED, SETTLED}"
          - "acting Brand owns this campaign"
        side_effects:
          - "campaign.status = CANCELLED"
          - "every OPEN/COUNTERED Offer for this campaign transitions to EXPIRED"
          - "increments Campaign.version by 1"
        note: "Cascade down: cancelling an OPEN campaign expires its outstanding offers."

  - entity: Offer
    initial_state: OFFERED
    terminal_states: [ACCEPTED, DECLINED, EXPIRED]
    transitions:
      - from: OFFERED
        to: COUNTERED
        trigger: "POST /offers/{id}/counter"
        actor: Brand | Creator
        preconditions:
          - "counter must come from the side opposite Offer.last_actor"
          - "Offer.round_count < MAX_NEGOTIATION_ROUNDS"
          - "parent Campaign.status == OPEN"
          - "request carries expected_offer_version matching Offer.version (OCC)"
        side_effects:
          - "offer.current_amount_cents = counter_amount_cents"
          - "offer.last_actor = acting side"
          - "offer.round_count += 1"
          - "offer.status = COUNTERED"
          - "increments Offer.version by 1"
      - from: COUNTERED
        to: COUNTERED
        trigger: "POST /offers/{id}/counter"
        actor: Brand | Creator
        preconditions:
          - "counter must come from the side opposite Offer.last_actor"
          - "Offer.round_count < MAX_NEGOTIATION_ROUNDS"
          - "parent Campaign.status == OPEN"
          - "request carries expected_offer_version matching Offer.version (OCC)"
        side_effects:
          - "offer.current_amount_cents = counter_amount_cents"
          - "offer.last_actor = acting side"
          - "offer.round_count += 1"
          - "increments Offer.version by 1"
        note: "Cyclic self-loop: alternating counters until accept/decline or round cap."
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /offers/{id}/accept"
        actor: Brand | Creator
        preconditions:
          - "accept must come from the side opposite Offer.last_actor"
          - "parent Campaign.status == OPEN"
          - "request carries expected_offer_version matching Offer.version (OCC)"
        side_effects:
          - "offer.status = ACCEPTED"
          - "increments Offer.version by 1"
      - from: COUNTERED
        to: ACCEPTED
        trigger: "POST /offers/{id}/accept"
        actor: Brand | Creator
        preconditions:
          - "accept must come from the side opposite Offer.last_actor"
          - "parent Campaign.status == OPEN"
          - "request carries expected_offer_version matching Offer.version (OCC)"
        side_effects:
          - "offer.status = ACCEPTED"
          - "increments Offer.version by 1"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /offers/{id}/decline"
        actor: Brand | Creator
        preconditions:
          - "decline must come from the side opposite Offer.last_actor"
        side_effects:
          - "offer.status = DECLINED"
          - "increments Offer.version by 1"
      - from: COUNTERED
        to: DECLINED
        trigger: "POST /offers/{id}/decline"
        actor: Brand | Creator
        preconditions:
          - "decline must come from the side opposite Offer.last_actor"
        side_effects:
          - "offer.status = DECLINED"
          - "increments Offer.version by 1"

  - entity: Contract
    initial_state: ACTIVE
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: NEW
        to: ACTIVE
        trigger: "POST /contracts (sign accepted offer)"
        actor: Brand
        preconditions:
          - "source Offer.status == ACCEPTED"
          - "request carries expected_offer_version matching Offer.version (OCC on parent Offer)"
          - "creator.brand_safety_status != BLOCKED"
          - "brand.available_budget_cents >= Offer.current_amount_cents"
          - "no other ACTIVE/FULFILLED Contract exists for the same creator whose [exclusivity_start, exclusivity_end) overlaps this signing's window"
        side_effects:
          - "contract.contracted_rate_cents = Offer.current_amount_cents (frozen)"
          - "contract.pinned_offer_version = Offer.version"
          - "contract.exclusivity_start = current clock; contract.exclusivity_end = start + exclusivity_days"
          - "Offer is consumed (cannot be re-signed)"
          - "brand.committed_cents += contracted_rate_cents; brand.available_budget_cents recomputed"
          - "campaign.committed_cents += contracted_rate_cents"
          - "if parent Campaign.status == OPEN, Campaign auto-transitions OPEN -> ACTIVE"
          - "increments Offer.version by 1"
        note: "Cascade: sign -> debit brand/campaign committed -> bubble-up campaign ACTIVE."
      - from: ACTIVE
        to: FULFILLED
        trigger: "system: every Deliverable in the campaign has an APPROVED ContentSubmission tied to this contract"
        actor: system
        preconditions:
          - "for each Deliverable of contract.campaign_id, an APPROVED ContentSubmission with this contract_id exists"
        side_effects:
          - "contract.status = FULFILLED"
          - "increments Contract.version by 1"
        note: "Bubble-up: fired as a side effect of the last content approval."
      - from: FULFILLED
        to: SETTLED
        trigger: "system: associated Payout transitions to SETTLED"
        actor: system
        preconditions:
          - "a Payout for this contract reached status SETTLED"
        side_effects:
          - "contract.status = SETTLED"
          - "campaign.actual_spend_cents += payout.net_amount_cents"
          - "creator.ytd_paid_cents += payout.net_amount_cents"
          - "increments Contract.version by 1"
        note: "Cascade: payout settle -> contract SETTLED -> campaign spend + creator YTD reconcile."
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /contracts/{id}/cancel"
        actor: Brand
        preconditions:
          - "no Payout for this contract is in status IN {RELEASED, SETTLED}"
          - "acting Brand owns the campaign of this contract"
        side_effects:
          - "contract.status = CANCELLED"
          - "brand.committed_cents -= contracted_rate_cents; brand.available_budget_cents recomputed"
          - "campaign.committed_cents -= contracted_rate_cents"
          - "every AttributionAsset of this contract transitions ENABLED -> DISABLED"
          - "every non-terminal ContentSubmission of this contract transitions to REJECTED"
          - "increments Contract.version by 1"
        note: "Compensation + cascade: cancel reverses committed budget and disables/rejects children."

  - entity: ContentSubmission
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: IN_REVIEW
        trigger: "POST /content-submissions/{id}/start-review"
        actor: ComplianceOfficer
        preconditions:
          - "parent Contract.status == ACTIVE"
        side_effects:
          - "submission.status = IN_REVIEW"
          - "increments ContentSubmission.version by 1"
      - from: IN_REVIEW
        to: CHANGES_REQUESTED
        trigger: "POST /content-submissions/{id}/request-changes"
        actor: ComplianceOfficer
        preconditions:
          - "submission.revision_count < MAX_REVISION_ROUNDS"
        side_effects:
          - "submission.status = CHANGES_REQUESTED"
          - "submission.revision_count += 1"
          - "increments ContentSubmission.version by 1"
        note: "Revision loop branch."
      - from: CHANGES_REQUESTED
        to: SUBMITTED
        trigger: "POST /content-submissions/{id}/resubmit"
        actor: Creator
        preconditions:
          - "acting Creator owns the contract of this submission (X-User-ID == Contract.creator_id)"
          - "parent Contract.status == ACTIVE"
        side_effects:
          - "submission.media_url = new media_url; submission.caption = new caption"
          - "submission.has_ftc_disclosure recomputed from new caption"
          - "submission.status = SUBMITTED"
          - "increments ContentSubmission.version by 1"
        note: "Cyclic: resubmit returns to SUBMITTED for another review pass."
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /content-submissions/{id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "if parent Campaign.requires_ftc_disclosure then submission.has_ftc_disclosure == true"
          - "creator.brand_safety_status != BLOCKED"
        side_effects:
          - "submission.status = APPROVED"
          - "if every Deliverable of the campaign now has an APPROVED submission for this contract, parent Contract auto-transitions ACTIVE -> FULFILLED"
          - "increments ContentSubmission.version by 1"
        note: "Bubble-up: last approval may fulfill the contract."
      - from: CHANGES_REQUESTED
        to: REJECTED
        trigger: "POST /content-submissions/{id}/reject"
        actor: ComplianceOfficer
        preconditions:
          - "submission.revision_count >= MAX_REVISION_ROUNDS"
        side_effects:
          - "submission.status = REJECTED"
          - "increments ContentSubmission.version by 1"
        note: "Final rejection only after revision cap is hit."

  - entity: Payout
    initial_state: PENDING
    terminal_states: [SETTLED, FAILED]
    transitions:
      - from: NEW
        to: PENDING
        trigger: "POST /payouts (create against a FULFILLED contract)"
        actor: ComplianceOfficer
        preconditions:
          - "parent Contract.status == FULFILLED"
          - "request carries expected_contract_version matching Contract.version (OCC on parent Contract)"
          - "no existing Payout for this contract in status IN {PENDING, RELEASED, SETTLED}"
        side_effects:
          - "payout breakdown computed (gross/platform_fee/tax_withholding/net)"
          - "increments Contract.version by 1"
        note: "tax_withholding applied iff creator.tax_id_on_file == false."
      - from: PENDING
        to: RELEASED
        trigger: "POST /payouts/{id}/release"
        actor: ComplianceOfficer
        preconditions:
          - "creator.tax_id_on_file == true"
          - "creator.brand_safety_status != BLOCKED"
        side_effects:
          - "payout.status = RELEASED"
          - "increments Payout.version by 1"
        note: "Release blocked until W-9 on file (tax compliance gate)."
      - from: RELEASED
        to: SETTLED
        trigger: "POST /payouts/{id}/settle"
        actor: ComplianceOfficer
        preconditions:
          - "payout.status == RELEASED"
        side_effects:
          - "payout.status = SETTLED"
          - "parent Contract auto-transitions FULFILLED -> SETTLED"
          - "campaign.actual_spend_cents += net_amount_cents"
          - "creator.ytd_paid_cents += net_amount_cents"
          - "if creator.ytd_paid_cents (post-update) >= TAX_1099_THRESHOLD_CENTS and no TaxForm1099 exists for creator+current tax year, a TaxForm1099 is auto-generated (status GENERATED)"
          - "increments Payout.version by 1"
        note: "Cascade depth 3+: settle -> contract SETTLED -> campaign/creator reconcile -> 1099 auto-gen at threshold."
      - from: PENDING
        to: FAILED
        trigger: "POST /payouts/{id}/fail"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "payout.status = FAILED"
          - "increments Payout.version by 1"
        note: "Failed payout frees the contract to receive a new payout (no PENDING/RELEASED/SETTLED remains)."

  - entity: BrandSafetyFlag
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: NEW
        to: OPEN
        trigger: "POST /creators/{id}/brand-safety-flags"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "flag.status = OPEN"
          - "creator.brand_safety_status recomputed (CLEAR -> FLAGGED or BLOCKED per highest OPEN severity)"
      - from: OPEN
        to: RESOLVED
        trigger: "POST /brand-safety-flags/{id}/resolve"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "flag.status = RESOLVED"
          - "creator.brand_safety_status recomputed over remaining OPEN flags"
        note: "Compensation: resolving the last HIGH flag lifts a BLOCKED creator back to CLEAR/FLAGGED."

  - entity: TaxForm1099
    initial_state: GENERATED
    terminal_states: [FILED, VOIDED]
    transitions:
      - from: NEW
        to: GENERATED
        trigger: "system: payout settle pushes creator.ytd_paid_cents >= TAX_1099_THRESHOLD_CENTS"
        actor: system
        preconditions:
          - "creator has no existing TaxForm1099 for the current tax year"
        side_effects:
          - "total_reported_cents frozen = creator.ytd_paid_cents at generation"
      - from: GENERATED
        to: FILED
        trigger: "POST /tax-forms/{id}/file"
        actor: ComplianceOfficer
        preconditions:
          - "creator.tax_id_on_file == true"
        side_effects:
          - "form.status = FILED"
          - "increments TaxForm1099.version by 1"
      - from: GENERATED
        to: VOIDED
        trigger: "POST /tax-forms/{id}/void"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "form.status = VOIDED"
          - "increments TaxForm1099.version by 1"

# =====================================================================
# §1.2.1 Concurrency Rules (true races only — OCC on parent.version)
# =====================================================================
concurrency_rules:
  - rule_id: payout-create-stale-contract
    parent_entity: Contract
    write_endpoint: "POST /payouts"
    occ_field: "expected_contract_version"
    description: |
      Creating a Payout against a Contract whose version has advanced since the
      client last observed it is rejected. A FULFILLED contract that has just had
      a Payout created (which legitimately occupies the contract's single payout
      slot) leaves the caller's view of the contract stale; the stale-version
      create is rejected so the second create cannot open a duplicate payout.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

  - rule_id: offer-counter-stale-offer
    parent_entity: Offer
    write_endpoint: "POST /offers/{id}/counter"
    occ_field: "expected_offer_version"
    description: |
      Submitting a counter against an Offer whose version has advanced since the
      client last observed it is rejected. The opposite side may have already
      countered (advancing the offer and flipping last_actor); a counter carrying
      the pre-counter version is rejected as stale rather than silently appending
      a round on top of a board the actor never saw.
    error_id: ERR_STALE_OFFER_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: fraud_score
    trigger: "on POST /creators/{id}/audience-snapshots (snapshot creation)"
    algorithm: weighted_scoring
    formula: |
      raw = (fake_follower_pct * 100 * FAKE_WEIGHT)
          + (engagement_anomaly * 100 * ANOMALY_WEIGHT)
      where engagement_anomaly =
        max(0, (EXPECTED_ENGAGEMENT_CEILING - avg_engagement_rate)) / EXPECTED_ENGAGEMENT_CEILING
        clamped to [0, 1]
      fraud_score = round_half_up( min(100, max(0, raw)), 0 )   # integer 0..100
    input_set: "the single snapshot being created; no cross-snapshot aggregation"
    constants:
      FAKE_WEIGHT: 0.7
      ANOMALY_WEIGHT: 0.3
      EXPECTED_ENGAGEMENT_CEILING: 0.05
      FRAUD_BLOCK_THRESHOLD: 60     # latest snapshot fraud_score < 60 => DISCOVERABLE, >= 60 => SUPPRESSED
    precision: "0 decimal places (integer score), round_half_up"
    variants: []

  - name: ftc_disclosure_detect
    trigger: "on POST /content-submissions and POST /content-submissions/{id}/resubmit"
    algorithm: aggregation
    formula: |
      has_ftc_disclosure = caption is non-null AND
        (lowercase(caption) contains "#ad" OR lowercase(caption) contains "#sponsored")
    input_set: "the submission's caption text only"
    constants:
      FTC_TOKENS: ["#ad", "#sponsored"]
    precision: "boolean; case-insensitive substring match"
    variants: []

  - name: performance_metrics
    trigger: "on GET /contracts/{id}/performance (computed read)"
    algorithm: aggregation
    formula: |
      impressions = sum(count) over ConversionEvent of contract's AttributionAssets where event_type == IMPRESSION
      engagements = sum(count) over ConversionEvent where event_type == ENGAGEMENT
      sale_revenue_cents = sum(revenue_cents) over ConversionEvent where event_type == SALE
      cpm  = round_half_up( (cost_basis_cents / 100) / (impressions / 1000), 2 )   # cost per mille, dollars
      cpe  = round_half_up( (cost_basis_cents / 100) / engagements, 2 )            # cost per engagement, dollars
      roas = round_half_up( sale_revenue_cents / cost_basis_cents, 4 )             # ratio
    input_set: "ConversionEvents joined through AttributionAsset.contract_id == contract.id; no status filter on events (append-only)"
    constants: {}
    precision: "cpm/cpe 2 decimals round_half_up; roas 4 decimals round_half_up"
    variants:
      - name: estimated
        when: "Payout for the contract is not yet SETTLED"
        difference: "cost_basis_cents = Contract.contracted_rate_cents (the committed fee, before fees/withholding)"
      - name: actual
        when: "the contract's Payout has status SETTLED"
        difference: "cost_basis_cents = Payout.net_amount_cents (what the brand actually paid out); divergence from estimated equals platform_fee + tax_withholding scaled into the metric"

  - name: payout_breakdown
    trigger: "on POST /payouts (NEW -> PENDING)"
    algorithm: tiered_pricing
    formula: |
      gross = Contract.contracted_rate_cents
      # platform fee is tiered on gross, MARGINAL (per-tier) not flat:
      tier1 = min(gross, TIER1_CAP_CENTS) * TIER1_RATE
      tier2 = max(0, min(gross, TIER2_CAP_CENTS) - TIER1_CAP_CENTS) * TIER2_RATE
      tier3 = max(0, gross - TIER2_CAP_CENTS) * TIER3_RATE
      platform_fee = round_half_up(tier1 + tier2 + tier3, 0)     # cents
      # backup withholding only when no W-9:
      tax_withholding = (creator.tax_id_on_file == false)
                        ? round_half_up((gross - platform_fee) * BACKUP_WITHHOLDING_RATE, 0)
                        : 0
      net = gross - platform_fee - tax_withholding
    input_set: "single Contract + its Creator"
    constants:
      TIER1_CAP_CENTS: 100000      # first $1,000
      TIER2_CAP_CENTS: 500000      # next up to $5,000
      TIER1_RATE: 0.20
      TIER2_RATE: 0.15
      TIER3_RATE: 0.10
      BACKUP_WITHHOLDING_RATE: 0.24
    precision: "compute fee on the full gross by marginal tier, ROUND ONCE at the end of platform_fee sum (round-then-net, not per-tier rounding); tax_withholding rounded once; all values integer cents, round_half_up"
    variants:
      - name: with_w9
        when: "creator.tax_id_on_file == true"
        difference: "tax_withholding = 0; net = gross - platform_fee"
      - name: backup_withholding
        when: "creator.tax_id_on_file == false"
        difference: "tax_withholding = 24% of (gross - platform_fee); net reduced accordingly"

  - name: tax_1099_total
    trigger: "on Payout SETTLED side-effect, and frozen at TaxForm1099 generation"
    algorithm: threshold
    formula: |
      # ROUNDING ORDER (pinned): each Payout.net_amount_cents was already rounded
      # ONCE at payout creation (round-then-net per payout_breakdown). The YTD sum
      # adds those already-rounded integer nets — round-PER-PAYOUT-then-SUM. It MUST
      # NOT re-derive net from raw fee/withholding fractions and round the aggregate,
      # which would drift by accumulated sub-cent remainders.
      ytd = sum(net_amount_cents) over creator's Payouts with status == SETTLED
            whose settle clock-year == current tax year     # each net pre-rounded
      generate_1099 = (ytd >= TAX_1099_THRESHOLD_CENTS) AND (no TaxForm1099 for creator+year)
      total_reported_cents = ytd (frozen at the generating settle)
    input_set: "creator's SETTLED Payouts in the current tax year only; PENDING/RELEASED/FAILED excluded"
    constants:
      TAX_1099_THRESHOLD_CENTS: 60000     # $600.00 IRS reporting floor
    precision: "integer cents; sum of per-payout-rounded nets (round-then-sum, NOT sum-then-round); threshold uses >= (exactly $600.00 triggers)"
    variants: []

  - name: brand_available_budget
    trigger: "on Contract sign (ACTIVE) and Contract cancel; read on every sign precondition"
    algorithm: aggregation
    formula: |
      committed_cents = sum(contracted_rate_cents)
        over the brand's Contracts with status IN {ACTIVE, FULFILLED, SETTLED}
      available_budget_cents = budget_cents - committed_cents
      sign allowed iff available_budget_cents >= Offer.current_amount_cents (i.e. budget would not go negative)
    input_set: "brand's Contracts filtered to {ACTIVE, FULFILLED, SETTLED}; CANCELLED excluded"
    constants: {}
    precision: "integer cents; boundary uses >= (committing exactly to zero remaining is allowed)"
    variants: []

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "acting role is permitted for this operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "for entity_backed roles, X-User-ID owns the targeted resource (Brand owns campaign/offer-brand-side; Creator owns content/offer-creator-side)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "ownership-scoped endpoints"

  - priority: 4
    category: existence
    check: "all path/body referenced resources exist, validated left-to-right in the path"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: business_constraint
    check: "request body required fields present and typed correctly; enums in range; numeric constraints (>=0, >=1) honored"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all writes"

  - priority: 6
    category: business_constraint
    check: "Creator.handle is unique; AttributionAsset.code_or_slug unique among ENABLED assets"
    error_id: ERR_DUPLICATE_VALUE
    http_status: 409
    applies_to: "POST /creators, POST /attribution-assets"

  - priority: 7
    category: state
    check: "target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 8
    category: state
    check: "OCC: expected_<parent>_version matches the parent's current version"
    error_id: ERR_STALE_OFFER_VERSION
    http_status: 412
    applies_to: "POST /offers/{id}/counter, POST /offers/{id}/accept, POST /contracts"

  - priority: 8
    category: state
    check: "OCC: expected_contract_version matches Contract.version on payout creation"
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412
    applies_to: "POST /payouts"

  - priority: 9
    category: business_constraint
    check: "negotiation move comes from the side opposite Offer.last_actor (cannot counter/accept your own move)"
    error_id: ERR_WRONG_TURN
    http_status: 409
    applies_to: "POST /offers/{id}/counter, /accept, /decline"

  - priority: 10
    category: business_constraint
    check: "Offer.round_count < MAX_NEGOTIATION_ROUNDS (= 4) before another counter"
    error_id: ERR_NEGOTIATION_ROUND_CAP
    http_status: 409
    applies_to: "POST /offers/{id}/counter"

  - priority: 11
    category: business_safety
    check: "creator.brand_safety_status != BLOCKED when signing a contract, approving content, or releasing a payout"
    error_id: ERR_BRAND_SAFETY_BLOCKED
    http_status: 409
    applies_to: "POST /contracts, POST /content-submissions/{id}/approve, POST /payouts/{id}/release"

  - priority: 12
    category: business_safety
    check: "FTC disclosure present in content when parent Campaign.requires_ftc_disclosure is true, on approve"
    error_id: ERR_FTC_DISCLOSURE_MISSING
    http_status: 409
    applies_to: "POST /content-submissions/{id}/approve"

  - priority: 13
    category: business_temporal
    check: "signing a contract must not create an exclusivity-window overlap with another ACTIVE/FULFILLED contract for the SAME CREATOR. Intervals are half-open [start, end); two windows conflict iff aStart < bEnd AND bStart < aEnd. Adjacency (aEnd == bStart) is ALLOWED (no buffer). A zero-length window (exclusivity_days==0, start==end) never conflicts with anything."
    error_id: ERR_EXCLUSIVITY_CONFLICT
    http_status: 409
    applies_to: "POST /contracts"

  - priority: 14
    category: business_temporal
    check: "opening a campaign (DRAFT -> OPEN) must not place its [starts_at, ends_at) window within CAMPAIGN_BUFFER_DAYS (= 7) of another non-CANCELLED campaign of the SAME BRAND. Buffer semantics: expand each existing window by the buffer on BOTH ends, then reject if the new window intersects the expanded window; adjacency is REJECTED and a >= 7-day gap is required. This differs from exclusivity overlap (no buffer, adjacency allowed)."
    error_id: ERR_CAMPAIGN_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /campaigns/{id}/open"

  - priority: 15
    category: business_referential
    check: "ContentSubmission.deliverable_id and contract_id must belong to the same campaign (Deliverable.campaign_id == Contract.campaign_id)"
    error_id: ERR_DELIVERABLE_CONTRACT_MISMATCH
    http_status: 409
    applies_to: "POST /content-submissions"

  - priority: 16
    category: business_referential
    check: "ConversionEvent.revenue_cents must be 0 unless event_type == SALE"
    error_id: ERR_REVENUE_ON_NON_SALE
    http_status: 422
    applies_to: "POST /attribution-assets/{id}/conversions"

  - priority: 17
    category: business_constraint
    check: "Payout release requires creator.tax_id_on_file == true (W-9 on file)"
    error_id: ERR_W9_REQUIRED
    http_status: 409
    applies_to: "POST /payouts/{id}/release, POST /tax-forms/{id}/file"

  - priority: 18
    category: business_fiscal
    check: "signing a contract must not push brand committed over budget (available_budget_cents >= Offer.current_amount_cents)"
    error_id: ERR_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /contracts"

  - priority: 19
    category: business_constraint
    check: "only one active Payout (PENDING/RELEASED/SETTLED) may exist per contract"
    error_id: ERR_PAYOUT_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /payouts"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---- Brand ----
  - method: POST
    path: "/brands"
    description: "Register a brand/advertiser"
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, contact_email, budget_cents]
    output: Brand
    side_effects: ["committed_cents=0; available_budget_cents=budget_cents"]
  - method: GET
    path: "/brands/{id}"
    description: "Fetch a brand with computed budget fields"
    roles: [PlatformAdmin, Brand, ComplianceOfficer]
    code: 200
    input: []
    output: Brand
    side_effects: []
  - method: GET
    path: "/brands/{id}/campaigns"
    description: "List a brand's campaigns (FK reverse-reachability for Campaign.brand_id)"
    roles: [PlatformAdmin, Brand, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: Campaign[]
    side_effects: []

  # ---- Creator + discovery + audience ----
  - method: POST
    path: "/creators"
    description: "Register a creator"
    roles: [PlatformAdmin]
    code: 201
    input: [handle, primary_platform, "payout_method?", "tax_id_on_file?"]
    output: Creator
    side_effects: ["discovery_status=NEW; brand_safety_status=CLEAR; ytd_paid_cents=0"]
  - method: GET
    path: "/creators/{id}"
    description: "Fetch a creator with computed discovery/safety/ytd fields"
    roles: [PlatformAdmin, Brand, ComplianceOfficer, Creator]
    code: 200
    input: []
    output: Creator
    side_effects: []
  - method: PATCH
    path: "/creators/{id}"
    description: "Update creator mutable fields (tax_id_on_file W-9 status, payout_method)"
    roles: [PlatformAdmin, Creator]
    code: 200
    input: ["tax_id_on_file?", "payout_method?", expected_creator_version]
    output: Creator
    side_effects: ["increments Creator.version by 1"]
  - method: GET
    path: "/creators"
    description: "Discovery search; lists creators filterable by status, platform, and min followers"
    roles: [PlatformAdmin, Brand, ComplianceOfficer]
    code: 200
    input: ["discovery_status?", "primary_platform?", "min_follower_count?", "limit?", "offset?"]
    output: Creator[]
    side_effects: []
  - method: POST
    path: "/creators/{id}/audience-snapshots"
    description: "Record an audience-metrics snapshot; computes fraud_score and refreshes discovery_status"
    roles: [PlatformAdmin]
    code: 201
    input: [follower_count, avg_engagement_rate, estimated_reach, fake_follower_pct]
    output: AudienceSnapshot
    side_effects: ["fraud_score computed", "creator.discovery_status recomputed"]
  - method: GET
    path: "/creators/{id}/audience-snapshots"
    description: "List a creator's audience snapshots (FK reverse-reachability for AudienceSnapshot.creator_id)"
    roles: [PlatformAdmin, Brand, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: AudienceSnapshot[]
    side_effects: []

  # ---- Brand-safety ----
  - method: POST
    path: "/creators/{id}/brand-safety-flags"
    description: "Open a brand-safety flag on a creator; recomputes brand_safety_status"
    roles: [ComplianceOfficer]
    code: 201
    input: [severity, reason_code, "note?"]
    output: BrandSafetyFlag
    side_effects: ["creator.brand_safety_status recomputed"]
  - method: GET
    path: "/creators/{id}/brand-safety-flags"
    description: "List a creator's brand-safety flags (FK reverse-reachability for BrandSafetyFlag.creator_id)"
    roles: [PlatformAdmin, ComplianceOfficer, Brand]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: BrandSafetyFlag[]
    side_effects: []
  - method: POST
    path: "/brand-safety-flags/{id}/resolve"
    description: "Resolve an OPEN brand-safety flag; recomputes creator brand_safety_status"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: BrandSafetyFlag
    side_effects: ["flag.status=RESOLVED", "creator.brand_safety_status recomputed"]

  # ---- Campaign + deliverables ----
  - method: POST
    path: "/campaigns"
    description: "Create a campaign brief (DRAFT)"
    roles: [Brand]
    code: 201
    input: [brand_id, title, campaign_budget_cents, "requires_ftc_disclosure?", starts_at, ends_at]
    output: Campaign
    side_effects: ["status=DRAFT; committed_cents=0; actual_spend_cents=0"]
  - method: GET
    path: "/campaigns/{id}"
    description: "Fetch a campaign with computed committed/spend fields"
    roles: [PlatformAdmin, Brand, ComplianceOfficer, Creator]
    code: 200
    input: []
    output: Campaign
    side_effects: []
  - method: GET
    path: "/campaigns"
    description: "List/discover campaigns; filter by status and brand"
    roles: [PlatformAdmin, Brand, ComplianceOfficer, Creator]
    code: 200
    input: ["status?", "brand_id?", "limit?", "offset?"]
    output: Campaign[]
    side_effects: []
  - method: POST
    path: "/campaigns/{id}/deliverables"
    description: "Add a deliverable to a DRAFT campaign brief"
    roles: [Brand]
    code: 201
    input: [content_type, quantity, due_at, base_rate_cents]
    output: Deliverable
    side_effects: []
  - method: GET
    path: "/campaigns/{id}/deliverables"
    description: "List a campaign's deliverables (FK reverse-reachability for Deliverable.campaign_id)"
    roles: [PlatformAdmin, Brand, ComplianceOfficer, Creator]
    code: 200
    input: ["limit?", "offset?"]
    output: Deliverable[]
    side_effects: []
  - method: POST
    path: "/campaigns/{id}/open"
    description: "Publish a DRAFT campaign to OPEN (accepts offers)"
    roles: [Brand]
    code: 200
    input: [expected_campaign_version]
    output: Campaign
    side_effects: ["status=OPEN", "increments Campaign.version by 1"]
  - method: POST
    path: "/campaigns/{id}/close"
    description: "Close an ACTIVE campaign once all contracts terminal"
    roles: [Brand]
    code: 200
    input: [expected_campaign_version]
    output: Campaign
    side_effects: ["status=CLOSED", "increments Campaign.version by 1"]
  - method: POST
    path: "/campaigns/{id}/cancel"
    description: "Cancel a DRAFT/OPEN campaign; expires outstanding offers"
    roles: [Brand]
    code: 200
    input: [expected_campaign_version]
    output: Campaign
    side_effects: ["status=CANCELLED", "OPEN/COUNTERED offers -> EXPIRED", "increments Campaign.version by 1"]

  # ---- Offers (negotiation) ----
  - method: POST
    path: "/offers"
    description: "Open a rate negotiation on an OPEN campaign; initiated_by inferred from acting role"
    roles: [Brand, Creator]
    code: 201
    input: [campaign_id, creator_id, current_amount_cents, "exclusivity_days?"]
    output: Offer
    side_effects: ["status=OFFERED; last_actor=initiated_by; round_count=0"]
  - method: GET
    path: "/offers/{id}"
    description: "Fetch an offer with negotiation state"
    roles: [PlatformAdmin, Brand, Creator, ComplianceOfficer]
    code: 200
    input: []
    output: Offer
    side_effects: []
  - method: GET
    path: "/offers"
    description: "List offers; filter by campaign or creator (FK reverse-reachability for Offer.campaign_id and Offer.creator_id)"
    roles: [PlatformAdmin, Brand, Creator, ComplianceOfficer]
    code: 200
    input: ["campaign_id?", "creator_id?", "status?", "limit?", "offset?"]
    output: Offer[]
    side_effects: []
  - method: POST
    path: "/offers/{id}/counter"
    description: "Counter the current offer with a new amount (opposite side only)"
    roles: [Brand, Creator]
    code: 200
    input: [counter_amount_cents, expected_offer_version]
    output: Offer
    side_effects: ["current_amount_cents updated; last_actor flipped; round_count+=1; status=COUNTERED", "increments Offer.version by 1"]
  - method: POST
    path: "/offers/{id}/accept"
    description: "Accept the current offer amount (opposite side only)"
    roles: [Brand, Creator]
    code: 200
    input: [expected_offer_version]
    output: Offer
    side_effects: ["status=ACCEPTED", "increments Offer.version by 1"]
  - method: POST
    path: "/offers/{id}/decline"
    description: "Decline the negotiation (opposite side only)"
    roles: [Brand, Creator]
    code: 200
    input: []
    output: Offer
    side_effects: ["status=DECLINED", "increments Offer.version by 1"]

  # ---- Contracts ----
  - method: POST
    path: "/contracts"
    description: "Sign an ACCEPTED offer into a contract; freezes rate, debits committed budget, may activate campaign"
    roles: [Brand]
    code: 201
    input: [offer_id, expected_offer_version]
    output: Contract
    side_effects:
      - "contracted_rate_cents frozen from offer; pinned_offer_version set"
      - "exclusivity window stamped"
      - "brand.committed_cents/available_budget_cents recomputed; campaign.committed_cents recomputed"
      - "campaign OPEN -> ACTIVE if applicable"
      - "increments Offer.version by 1"
  - method: GET
    path: "/contracts/{id}"
    description: "Fetch a contract"
    roles: [PlatformAdmin, Brand, Creator, ComplianceOfficer]
    code: 200
    input: []
    output: Contract
    side_effects: []
  - method: GET
    path: "/contracts"
    description: "List contracts; filter by offer, campaign, or creator (FK reverse-reachability for Contract.offer_id, campaign_id, creator_id)"
    roles: [PlatformAdmin, Brand, Creator, ComplianceOfficer]
    code: 200
    input: ["offer_id?", "campaign_id?", "creator_id?", "status?", "limit?", "offset?"]
    output: Contract[]
    side_effects: []
  - method: POST
    path: "/contracts/{id}/cancel"
    description: "Cancel an ACTIVE contract; reverses committed budget, disables attribution, rejects open content"
    roles: [Brand]
    code: 200
    input: [expected_contract_version]
    output: Contract
    side_effects:
      - "committed budget reversed on brand+campaign"
      - "AttributionAssets ENABLED -> DISABLED"
      - "non-terminal ContentSubmissions -> REJECTED"
      - "increments Contract.version by 1"
  - method: GET
    path: "/contracts/{id}/performance"
    description: "Computed read: CPM/CPE/ROAS over attributed conversions (estimated or actual variant)"
    roles: [PlatformAdmin, Brand, ComplianceOfficer]
    code: 200
    input: []
    output: "{ variant: string, impressions: integer, engagements: integer, sale_revenue_cents: integer, cpm: number, cpe: number, roas: number, cost_basis_cents: integer }"
    side_effects: []

  # ---- Content submission & approval ----
  - method: POST
    path: "/content-submissions"
    description: "Creator submits content for a deliverable under a contract; FTC disclosure auto-detected"
    roles: [Creator]
    code: 201
    input: [deliverable_id, contract_id, media_url, "caption?"]
    output: ContentSubmission
    side_effects: ["has_ftc_disclosure computed; status=SUBMITTED; revision_count=0"]
  - method: GET
    path: "/content-submissions/{id}"
    description: "Fetch a content submission"
    roles: [PlatformAdmin, Brand, Creator, ComplianceOfficer]
    code: 200
    input: []
    output: ContentSubmission
    side_effects: []
  - method: GET
    path: "/content-submissions"
    description: "List content submissions; filter by deliverable or contract (FK reverse-reachability for ContentSubmission.deliverable_id, contract_id)"
    roles: [PlatformAdmin, Brand, Creator, ComplianceOfficer]
    code: 200
    input: ["deliverable_id?", "contract_id?", "status?", "limit?", "offset?"]
    output: ContentSubmission[]
    side_effects: []
  - method: POST
    path: "/content-submissions/{id}/start-review"
    description: "Begin compliance review of a submission"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ContentSubmission
    side_effects: ["status=IN_REVIEW", "increments ContentSubmission.version by 1"]
  - method: POST
    path: "/content-submissions/{id}/request-changes"
    description: "Send a submission back for revision (revision loop)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ContentSubmission
    side_effects: ["status=CHANGES_REQUESTED; revision_count+=1", "increments ContentSubmission.version by 1"]
  - method: POST
    path: "/content-submissions/{id}/resubmit"
    description: "Creator resubmits revised content"
    roles: [Creator]
    code: 200
    input: [media_url, "caption?"]
    output: ContentSubmission
    side_effects: ["media/caption updated; has_ftc_disclosure recomputed; status=SUBMITTED", "increments ContentSubmission.version by 1"]
  - method: POST
    path: "/content-submissions/{id}/approve"
    description: "Approve content; enforces FTC + brand-safety; may fulfill the contract"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ContentSubmission
    side_effects: ["status=APPROVED", "contract ACTIVE -> FULFILLED if all deliverables approved", "increments ContentSubmission.version by 1"]
  - method: POST
    path: "/content-submissions/{id}/reject"
    description: "Reject content after the revision cap"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ContentSubmission
    side_effects: ["status=REJECTED", "increments ContentSubmission.version by 1"]

  # ---- Attribution + conversions ----
  - method: POST
    path: "/attribution-assets"
    description: "Create a tracking link or promo code under an ACTIVE/FULFILLED contract"
    roles: [Brand, PlatformAdmin]
    code: 201
    input: [contract_id, asset_type, code_or_slug]
    output: AttributionAsset
    side_effects: ["status=ENABLED"]
  - method: GET
    path: "/attribution-assets/{id}"
    description: "Fetch an attribution asset"
    roles: [PlatformAdmin, Brand, ComplianceOfficer]
    code: 200
    input: []
    output: AttributionAsset
    side_effects: []
  - method: GET
    path: "/contracts/{id}/attribution-assets"
    description: "List a contract's attribution assets (FK reverse-reachability for AttributionAsset.contract_id)"
    roles: [PlatformAdmin, Brand, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: AttributionAsset[]
    side_effects: []
  - method: POST
    path: "/attribution-assets/{id}/conversions"
    description: "Ingest an attributed conversion batch (impression/engagement/sale)"
    roles: [PlatformAdmin]
    code: 201
    input: [event_type, count, "revenue_cents?"]
    output: ConversionEvent
    side_effects: ["occurred_at stamped from logical clock"]
  - method: GET
    path: "/attribution-assets/{id}/conversions"
    description: "List an asset's conversion events (FK reverse-reachability for ConversionEvent.attribution_asset_id)"
    roles: [PlatformAdmin, Brand, ComplianceOfficer]
    code: 200
    input: ["event_type?", "limit?", "offset?"]
    output: ConversionEvent[]
    side_effects: []

  # ---- Payouts ----
  - method: POST
    path: "/payouts"
    description: "Create a payout against a FULFILLED contract; computes gross/fee/withholding/net"
    roles: [ComplianceOfficer]
    code: 201
    input: [contract_id, expected_contract_version]
    output: Payout
    side_effects: ["breakdown computed", "increments Contract.version by 1"]
  - method: GET
    path: "/payouts/{id}"
    description: "Fetch a payout with breakdown"
    roles: [PlatformAdmin, Brand, Creator, ComplianceOfficer]
    code: 200
    input: []
    output: Payout
    side_effects: []
  - method: GET
    path: "/contracts/{id}/payouts"
    description: "List a contract's payouts (FK reverse-reachability for Payout.contract_id)"
    roles: [PlatformAdmin, Brand, Creator, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Payout[]
    side_effects: []
  - method: POST
    path: "/payouts/{id}/release"
    description: "Release a PENDING payout (requires W-9, brand-safety not BLOCKED)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Payout
    side_effects: ["status=RELEASED", "increments Payout.version by 1"]
  - method: POST
    path: "/payouts/{id}/settle"
    description: "Settle a RELEASED payout; cascades to contract SETTLED, campaign spend, creator YTD, 1099 auto-gen"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Payout
    side_effects:
      - "status=SETTLED; contract FULFILLED -> SETTLED"
      - "campaign.actual_spend_cents += net; creator.ytd_paid_cents += net"
      - "1099 auto-generated if YTD crosses threshold"
      - "increments Payout.version by 1"
  - method: POST
    path: "/payouts/{id}/fail"
    description: "Mark a PENDING payout FAILED (frees contract for a new payout)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Payout
    side_effects: ["status=FAILED", "increments Payout.version by 1"]

  # ---- Tax 1099 ----
  - method: GET
    path: "/tax-forms/{id}"
    description: "Fetch a 1099 form"
    roles: [PlatformAdmin, Creator, ComplianceOfficer]
    code: 200
    input: []
    output: TaxForm1099
    side_effects: []
  - method: GET
    path: "/creators/{id}/tax-forms"
    description: "List a creator's 1099 forms (FK reverse-reachability for TaxForm1099.creator_id)"
    roles: [PlatformAdmin, Creator, ComplianceOfficer]
    code: 200
    input: ["tax_year?", "status?", "limit?", "offset?"]
    output: TaxForm1099[]
    side_effects: []
  - method: POST
    path: "/tax-forms/{id}/file"
    description: "File a GENERATED 1099 (requires W-9 on file)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: TaxForm1099
    side_effects: ["status=FILED", "increments TaxForm1099.version by 1"]
  - method: POST
    path: "/tax-forms/{id}/void"
    description: "Void a GENERATED 1099"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: TaxForm1099
    side_effects: ["status=VOIDED", "increments TaxForm1099.version by 1"]

  # ---- Test-driving (logical clock) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock to an arbitrary ISO 8601 UTC instant. Server startup default is 2026-01-01T00:00:00Z; before any set call the logical clock reads exactly this default and never falls back to wall-clock time. All snapshot/conversion timestamps and exclusivity windows derive from this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["logical clock advanced/rewound to to_iso8601"]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/malformed X-User-Role or X-User-ID header"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "acting role not permitted for this operation"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "entity_backed actor does not own the targeted resource"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "a referenced resource does not exist"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "missing required field, bad type, enum out of range, or numeric constraint violated"
  - id: ERR_DUPLICATE_VALUE
    http: 409
    condition: "Creator.handle or ENABLED AttributionAsset.code_or_slug collision"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "requested transition not defined from the resource's current state"
  - id: ERR_STALE_OFFER_VERSION
    http: 412
    condition: "expected_offer_version does not match Offer.version (OCC)"
  - id: ERR_STALE_CONTRACT_VERSION
    http: 412
    condition: "expected_contract_version does not match Contract.version (OCC)"
  - id: ERR_WRONG_TURN
    http: 409
    condition: "negotiation move attempted by the same side as Offer.last_actor"
  - id: ERR_NEGOTIATION_ROUND_CAP
    http: 409
    condition: "counter attempted when Offer.round_count >= MAX_NEGOTIATION_ROUNDS"
  - id: ERR_BRAND_SAFETY_BLOCKED
    http: 409
    condition: "operation requires creator.brand_safety_status != BLOCKED but creator is BLOCKED"
  - id: ERR_FTC_DISCLOSURE_MISSING
    http: 409
    condition: "approve attempted with no FTC disclosure when campaign.requires_ftc_disclosure is true"
  - id: ERR_EXCLUSIVITY_CONFLICT
    http: 409
    condition: "signing would overlap an existing ACTIVE/FULFILLED contract's exclusivity window for the same creator (half-open, adjacency allowed)"
  - id: ERR_CAMPAIGN_WINDOW_CONFLICT
    http: 409
    condition: "opening a campaign whose window falls within CAMPAIGN_BUFFER_DAYS of another non-CANCELLED campaign of the same brand (buffer-expanded, adjacency rejected)"
  - id: ERR_DELIVERABLE_CONTRACT_MISMATCH
    http: 409
    condition: "submission's deliverable and contract belong to different campaigns"
  - id: ERR_REVENUE_ON_NON_SALE
    http: 422
    condition: "revenue_cents > 0 on a conversion whose event_type != SALE"
  - id: ERR_W9_REQUIRED
    http: 409
    condition: "payout release or 1099 filing attempted while creator.tax_id_on_file is false"
  - id: ERR_BUDGET_EXCEEDED
    http: 409
    condition: "signing would push brand committed over budget (available_budget_cents < offer amount)"
  - id: ERR_PAYOUT_ALREADY_EXISTS
    http: 409
    condition: "a Payout in PENDING/RELEASED/SETTLED already exists for the contract"
  - id: ERR_VALIDATION
    http: 422
    condition: "generic body validation failure not covered by a more specific code (e.g. starts_at >= ends_at)"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: Brand
    description: "Advertiser; owns campaigns, brand-side offers, contracts, attribution assets"
    identity: "entity_backed:Brand"
    exclusive_operations:
      - "POST /campaigns and deliverables; open/close/cancel campaign"
      - "POST /contracts (sign); cancel contract"
    shared_operations:
      - "POST /offers, /counter, /accept, /decline (with Creator)"
      - "POST /attribution-assets (with PlatformAdmin)"
      - "GET reads on own campaigns/offers/contracts/performance"

  - name: Creator
    description: "Influencer; owns content submissions and creator-side offer moves"
    identity: "entity_backed:Creator"
    exclusive_operations:
      - "POST /content-submissions, /resubmit"
    shared_operations:
      - "POST /offers, /counter, /accept, /decline (with Brand)"
      - "PATCH /creators/{id} (own W-9/payout method, also PlatformAdmin)"
      - "GET reads on own creator/offers/contracts/content/payouts/tax-forms"

  - name: ComplianceOfficer
    description: "Reviews content for FTC/brand-safety, manages payouts and 1099 lifecycle, manages brand-safety flags"
    identity: "opaque"
    exclusive_operations:
      - "content review transitions (start-review/request-changes/approve/reject)"
      - "brand-safety flag open/resolve"
      - "payout create/release/settle/fail"
      - "1099 file/void"
    shared_operations:
      - "GET reads across brands/creators/campaigns/contracts/payouts/tax-forms"

  - name: PlatformAdmin
    description: "Operator; seeds brands/creators, ingests audience snapshots & conversions, drives the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /brands, /creators"
      - "POST /creators/{id}/audience-snapshots"
      - "POST /attribution-assets/{id}/conversions"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /attribution-assets (with Brand)"
      - "PATCH /creators/{id} (with Creator)"
      - "GET reads across all collections"
