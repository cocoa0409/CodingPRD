scenario: |
  Sail Loft & Rigging Service (North Sails style loft): measurement & sail design specification, material selection & production scheduling, standing/running rigging inspection & replacement interval, mast unstepping & tuning service, warranty & repair vs replacement decision, off-season storage & wash/service program, racing-class certification & measurement, delivery & fit check

domain_name: sail-loft-rigging
api_prefix: /lofts

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Customer full name" }
      - { name: email, type: string, source: input, description: "Customer email address" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum outstanding balance allowed before new work orders are blocked" }
      - { name: outstanding_balance_cents, type: integer, source: computed, default: 0, description: "Running total of unpaid invoiced amounts in cents; debited at invoice issuance and credited by payment or warranty write-off" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | CLOSED" }

  - name: Boat
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; owning customer" }
      - { name: boat_name, type: string, source: input, description: "Display name" }
      - { name: hull_length_m, type: number, source: input, description: "Length overall in metres; used for storage fee tier" }
      - { name: racing_class, type: enum, source: input, description: "NONE | J70 | J105 | TP52 | ORC | PHRF" }
      - { name: mast_status, type: enum, source: system, default: "STEPPED", description: "STEPPED | UNSTEPPING_SCHEDULED | UNSTEPPED | TUNING_IN_PROGRESS" }
      - { name: standing_rigging_install_date, type: datetime, source: input, description: "ISO8601 UTC date current standing rigging was installed; replacement clock basis" }
      - { name: running_rigging_hours_accumulated, type: integer, source: input, default: 0, description: "Sail-hours on current running rigging" }
      - { name: status, type: enum, source: system, description: "ACTIVE | OUT_OF_SERVICE | RETIRED" }

  - name: MeasurementSheet
    parent: Boat
    common_fields: true
    fields:
      - { name: boat_id, type: string, source: system, description: "FK -> Boat.id; measured boat" }
      - { name: captured_by_measurer_id, type: string, source: system, description: "X-User-ID of the Measurer who captured this sheet" }
      - { name: i_height_m, type: number, source: input, description: "Foretriangle height (I) in metres" }
      - { name: j_base_m, type: number, source: input, description: "Foretriangle base (J) in metres" }
      - { name: p_main_m, type: number, source: input, description: "Mainsail luff length (P) in metres" }
      - { name: e_main_m, type: number, source: input, description: "Mainsail foot length (E) in metres" }
      - { name: measured_area_sqm, type: number, source: computed, description: "Computed sail plan reference area in square metres (see sail_area calc)" }
      - { name: sheet_status, type: enum, source: system, description: "DRAFT | FROZEN | SUPERSEDED" }
      - { name: frozen_at, type: datetime, source: system, description: "ISO8601 UTC timestamp when the sheet was frozen; null while DRAFT", default: null }

  - name: SailDesign
    parent: Boat
    common_fields: true
    fields:
      - { name: boat_id, type: string, source: system, description: "FK -> Boat.id; owning boat" }
      - { name: measurement_sheet_id, type: string, source: system, description: "FK -> MeasurementSheet.id; pinned measurement basis — must be FROZEN at design submission" }
      - { name: revision_number, type: integer, source: system, default: 1, description: "1-based revision counter; increments on every supersede" }
      - { name: supersedes_design_id, type: string, source: system, default: null, description: "FK -> SailDesign.id; prior revision this design supersedes, or null for the first revision" }
      - { name: cloth_tier, type: enum, source: input, description: "CRUISE | PERFORMANCE | RACE | GRAND_PRIX" }
      - { name: reinforcement_level, type: integer, source: input, default: 1, description: "Integer 1-5; drives surcharge when area crosses the HEAVY_DUTY threshold" }
      - { name: option_codes, type: array, source: input, default: [], description: "Zero or more of BATTENS | REEF_POINTS | UV_STRIP | NUMBERS | LOGO" }
      - { name: design_status, type: enum, source: system, description: "DRAFT | SUBMITTED | REVISION_REQUESTED | APPROVED | SUPERSEDED | ARCHIVED" }
      - { name: rejection_reason, type: string, source: system, default: null, description: "Populated when a customer requests revision" }

  - name: LoftWorkOrder
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; ordering customer" }
      - { name: boat_id, type: string, source: system, description: "FK -> Boat.id; subject boat" }
      - { name: sail_design_id, type: string, source: system, description: "FK -> SailDesign.id; the APPROVED design revision pinned to this work order at activation" }
      - { name: order_kind, type: enum, source: input, description: "NEW_SAIL | RIGGING_SERVICE | MAST_SERVICE | STORAGE_PROGRAM | REPAIR" }
      - { name: quoted_total_cents, type: integer, source: computed, default: 0, description: "Provisional quote at activation (forward-looking variant); recomputed as line items confirm" }
      - { name: invoiced_total_cents, type: integer, source: computed, default: 0, description: "Final invoice total at closure (chronological variant)" }
      - { name: warranty_flag, type: boolean, source: input, default: false, description: "True when the work order arises from a warranty claim" }
      - { name: order_status, type: enum, source: system, description: "OPEN | DESIGN_LOCKED | IN_PRODUCTION | READY_FOR_FIT_CHECK | DELIVERED | WARRANTY_REVIEW | WARRANTY_REPAIR | CLOSED | CANCELLED" }

  - name: ProductionJob
    parent: LoftWorkOrder
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: system, description: "FK -> LoftWorkOrder.id; parent work order" }
      - { name: bay_code, type: enum, source: input, description: "BAY_A | BAY_B | BAY_C — the loft floor cutting bay the job is scheduled into" }
      - { name: scheduled_start_date, type: string, source: input, description: "ISO8601 date (YYYY-MM-DD) the job occupies the bay from, inclusive" }
      - { name: scheduled_end_date, type: string, source: input, description: "ISO8601 date (YYYY-MM-DD) the job occupies the bay through, inclusive" }
      - { name: reserved_cloth_sqm, type: number, source: computed, default: 0, description: "Cloth square-metres reserved from the cloth ledger at scheduling" }
      - { name: qc_notes, type: string, source: system, default: null, description: "Sailmaker notes recorded on QC failure" }
      - { name: job_status, type: enum, source: system, description: "SCHEDULED | CUTTING | SEAMING | FINISHING | QC_PASSED | QC_FAILED | CANCELLED" }

  - name: ClothLedgerEntry
    parent: null
    common_fields: true
    fields:
      - { name: bolt_code, type: string, source: input, description: "Cloth bolt identifier" }
      - { name: cloth_tier, type: enum, source: input, description: "CRUISE | PERFORMANCE | RACE | GRAND_PRIX" }
      - { name: total_sqm, type: number, source: input, description: "Bolt length in square metres" }
      - { name: available_sqm, type: number, source: computed, description: "= total_sqm - sum(reserved_cloth_sqm on non-terminal ProductionJobs booked against this bolt)" }
      - { name: price_per_sqm_cents, type: integer, source: input, description: "Unit cloth price" }

  - name: RiggingInspection
    parent: Boat
    common_fields: true
    fields:
      - { name: boat_id, type: string, source: system, description: "FK -> Boat.id; inspected boat" }
      - { name: rigging_scope, type: enum, source: input, description: "STANDING | RUNNING | FULL" }
      - { name: inspected_at, type: datetime, source: system, description: "ISO8601 UTC timestamp of inspection completion (system-stamped at report submission)" }
      - { name: standing_months_at_inspection, type: integer, source: computed, description: "Whole months between boat.standing_rigging_install_date and inspected_at" }
      - { name: standing_replacement_due_date, type: datetime, source: computed, description: "Calendar-variant due date = install_date + 120 months" }
      - { name: running_replacement_due_hours, type: integer, source: computed, description: "Hours-variant threshold = 2000 sail-hours" }
      - { name: verdict, type: enum, source: input, description: "PASS | ADVISORY | FAIL" }
      - { name: inspection_status, type: enum, source: system, description: "SCHEDULED | REPORTED | CLOSED" }

  - name: MastServiceEvent
    parent: Boat
    common_fields: true
    fields:
      - { name: boat_id, type: string, source: system, description: "FK -> Boat.id; serviced boat" }
      - { name: service_kind, type: enum, source: input, description: "UNSTEP | STEP | TUNE" }
      - { name: slot_start_utc, type: datetime, source: input, description: "ISO8601 UTC start of the booked crane/rig dock slot; half-open interval start" }
      - { name: slot_end_utc, type: datetime, source: input, description: "ISO8601 UTC end of the booked slot; half-open interval end (exclusive)" }
      - { name: event_status, type: enum, source: system, description: "BOOKED | IN_PROGRESS | COMPLETED | RIGGING_HOLD | CANCELLED" }

  - name: StorageContract
    parent: Boat
    common_fields: true
    fields:
      - { name: boat_id, type: string, source: system, description: "FK -> Boat.id; stored boat" }
      - { name: season_code, type: string, source: input, description: "Season identifier e.g. WINTER_2026" }
      - { name: wash_item_codes, type: array, source: input, default: [], description: "Zero or more of MAIN_WASH | GENOA_WASH | SPINNAKER_WASH | RIG_WASH; each priced per item" }
      - { name: quoted_storage_fee_cents, type: integer, source: computed, default: 0, description: "Per-item-rounded season fee (see storage_fee calc)" }
      - { name: contract_status, type: enum, source: system, description: "ENROLLED | RECEIVED | WASHED | STORED | OUT_FOR_DELIVERY | RETURNED | CANCELLED" }

  - name: ClassCertificate
    parent: Boat
    common_fields: true
    fields:
      - { name: boat_id, type: string, source: system, description: "FK -> Boat.id; certified boat" }
      - { name: measurement_sheet_id, type: string, source: system, description: "FK -> MeasurementSheet.id; the FROZEN sheet this certificate attests" }
      - { name: racing_class, type: enum, source: input, description: "J70 | J105 | TP52 | ORC | PHRF — must equal the boat's racing_class at issuance" }
      - { name: issued_at, type: datetime, source: system, description: "ISO8601 UTC issuance timestamp" }
      - { name: cert_status, type: enum, source: system, description: "ACTIVE | REVOKED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Customer
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /lofts/customers/{customerId}/suspend"
        actor: LoftManager
        preconditions:
          - "outstanding_balance_cents > credit_limit_cents"
        side_effects:
          - "All OPEN LoftWorkOrders for this customer remain OPEN but cannot transition to DESIGN_LOCKED"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /lofts/customers/{customerId}/reinstate"
        actor: LoftManager
        preconditions:
          - "outstanding_balance_cents <= credit_limit_cents"
        side_effects: []

      - from: ACTIVE
        to: CLOSED
        trigger: "POST /lofts/customers/{customerId}/close"
        actor: LoftManager
        preconditions:
          - "outstanding_balance_cents == 0"
          - "No Boat in ACTIVE status owned by this customer"
        side_effects: []

  - entity: MeasurementSheet
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: FROZEN
        trigger: "POST /lofts/boats/{boatId}/measurement-sheets/{sheetId}/freeze"
        actor: Measurer
        preconditions:
          - "All of i_height_m, j_base_m, p_main_m, e_main_m are positive numbers"
        side_effects:
          - "measured_area_sqm computed via sail_area calculation"
          - "frozen_at stamped with current UTC"

      - from: FROZEN
        to: SUPERSEDED
        trigger: "system (automatic when a newer MeasurementSheet for the same boat is frozen)"
        actor: system
        preconditions: []
        side_effects:
          - "Any ClassCertificate referencing this sheet transitions to REVOKED"
          - "Any SailDesign in DRAFT or SUBMITTED or REVISION_REQUESTED referencing this sheet transitions to ARCHIVED"

  - entity: SailDesign
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /lofts/boats/{boatId}/sail-designs/{designId}/submit"
        actor: Sailmaker
        preconditions:
          - "referenced MeasurementSheet.sheet_status == FROZEN"
        side_effects: []

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /lofts/boats/{boatId}/sail-designs/{designId}/approve"
        actor: Customer
        preconditions:
          - "acting Customer must own the boat (X-User-ID == boat.customer_id)"
          - "Customer.status == ACTIVE"
          - "Customer.outstanding_balance_cents + projected quoted_total_cents <= Customer.credit_limit_cents"
        side_effects: []

      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /lofts/boats/{boatId}/sail-designs/{designId}/request-revision"
        actor: Customer
        preconditions:
          - "acting Customer must own the boat"
        side_effects:
          - "rejection_reason captured from payload"

      - from: REVISION_REQUESTED
        to: DRAFT
        trigger: "POST /lofts/boats/{boatId}/sail-designs/{designId}/redraft"
        actor: Sailmaker
        preconditions: []
        side_effects:
          - "revision_number unchanged; the SAME design row loops back to DRAFT for editing"
        note: "Cyclic revision loop — the same design row may cycle DRAFT→SUBMITTED→REVISION_REQUESTED→DRAFT multiple times"

      - from: APPROVED
        to: SUPERSEDED
        trigger: "POST /lofts/boats/{boatId}/sail-designs (create revision with expected_boat_version OCC)"
        actor: Sailmaker
        preconditions:
          - "new revision must reference the same boat"
        side_effects:
          - "new SailDesign row created in DRAFT with revision_number = prior.revision_number + 1 and supersedes_design_id = prior.id"
          - "If any LoftWorkOrder pins this design and is still in OPEN status, that work order transitions to CANCELLED"
        note: "Design supersede — OCC on Boat.version guards the create-revision endpoint"

      - from: DRAFT
        to: ARCHIVED
        trigger: "system (automatic when the pinned MeasurementSheet is superseded)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SUBMITTED
        to: ARCHIVED
        trigger: "system (automatic when the pinned MeasurementSheet is superseded)"
        actor: system
        preconditions: []
        side_effects: []

      - from: REVISION_REQUESTED
        to: ARCHIVED
        trigger: "system (automatic when the pinned MeasurementSheet is superseded)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: LoftWorkOrder
    initial_state: OPEN
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: OPEN
        to: DESIGN_LOCKED
        trigger: "POST /lofts/work-orders/{workOrderId}/lock-design"
        actor: LoftManager
        preconditions:
          - "order_kind == NEW_SAIL"
          - "pinned SailDesign.design_status == APPROVED"
          - "Customer.status == ACTIVE"
        side_effects:
          - "quoted_total_cents computed via sail_price calculation (provisional variant)"

      - from: DESIGN_LOCKED
        to: IN_PRODUCTION
        trigger: "system (automatic when the first ProductionJob under this work order enters CUTTING)"
        actor: system
        preconditions: []
        side_effects: []

      - from: IN_PRODUCTION
        to: READY_FOR_FIT_CHECK
        trigger: "system (automatic when all non-cancelled ProductionJobs under this work order reach QC_PASSED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: READY_FOR_FIT_CHECK
        to: DELIVERED
        trigger: "POST /lofts/work-orders/{workOrderId}/confirm-delivery"
        actor: Customer
        preconditions:
          - "acting Customer owns the boat"
        side_effects:
          - "invoiced_total_cents computed via final_invoice calculation (chronological variant)"
          - "Customer.outstanding_balance_cents += invoiced_total_cents"

      - from: DELIVERED
        to: WARRANTY_REVIEW
        trigger: "POST /lofts/work-orders/{workOrderId}/open-warranty-claim"
        actor: Customer
        preconditions:
          - "acting Customer owns the boat"
          - "claim filed within 730 days of delivery"
        side_effects: []

      - from: WARRANTY_REVIEW
        to: WARRANTY_REPAIR
        trigger: "POST /lofts/work-orders/{workOrderId}/rule-warranty"
        actor: LoftManager
        preconditions: []
        side_effects:
          - "warranty_flag = true"
          - "invoiced_total_cents credited back: Customer.outstanding_balance_cents -= invoiced_total_cents (floor 0)"
        note: "REPAIR branch — work continues at no charge"

      - from: WARRANTY_REVIEW
        to: CLOSED
        trigger: "POST /lofts/work-orders/{workOrderId}/rule-warranty"
        actor: LoftManager
        preconditions: []
        side_effects:
          - "replacement decision: new LoftWorkOrder spawned in OPEN with order_kind=NEW_SAIL and warranty_flag=true"
        note: "REPLACE branch — forks a replacement order; the branching decision is repair-vs-replace"

      - from: DELIVERED
        to: CLOSED
        trigger: "POST /lofts/work-orders/{workOrderId}/close"
        actor: LoftManager
        preconditions: []
        side_effects: []

      - from: WARRANTY_REPAIR
        to: CLOSED
        trigger: "POST /lofts/work-orders/{workOrderId}/close"
        actor: LoftManager
        preconditions: []
        side_effects: []

      - from: OPEN
        to: CANCELLED
        trigger: "POST /lofts/work-orders/{workOrderId}/cancel"
        actor: LoftManager
        preconditions: []
        side_effects:
          - "All ProductionJobs in SCHEDULED or CUTTING or SEAMING or FINISHING transition to CANCELLED (cascade hop 1)"
          - "Each such cancellation releases its reserved_cloth_sqm back to the ClothLedgerEntry (cascade hop 2: cloth_bolt.available_sqm recomputed)"
          - "If the pinned SailDesign has no other non-cancelled LoftWorkOrder referencing it, the design transitions to ARCHIVED (cascade hop 3)"

  - entity: ProductionJob
    initial_state: SCHEDULED
    terminal_states: [QC_PASSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CUTTING
        trigger: "POST /lofts/work-orders/{workOrderId}/production-jobs/{jobId}/start-cutting"
        actor: Sailmaker
        preconditions:
          - "parent LoftWorkOrder.order_status in {DESIGN_LOCKED, IN_PRODUCTION}"
          - "pinned SailDesign.design_status == APPROVED"
        side_effects:
          - "parent LoftWorkOrder transitions OPEN→n/a (already DESIGN_LOCKED) or DESIGN_LOCKED→IN_PRODUCTION"

      - from: CUTTING
        to: SEAMING
        trigger: "POST /lofts/work-orders/{workOrderId}/production-jobs/{jobId}/advance"
        actor: Sailmaker
        preconditions: []
        side_effects: []

      - from: SEAMING
        to: FINISHING
        trigger: "POST /lofts/work-orders/{workOrderId}/production-jobs/{jobId}/advance"
        actor: Sailmaker
        preconditions: []
        side_effects: []

      - from: FINISHING
        to: QC_PASSED
        trigger: "POST /lofts/work-orders/{workOrderId}/production-jobs/{jobId}/qc-pass"
        actor: Sailmaker
        preconditions: []
        side_effects:
          - "reserved_cloth_sqm released back to ClothLedgerEntry (available_sqm recomputed)"
          - "If all sibling non-cancelled ProductionJobs are QC_PASSED, parent LoftWorkOrder transitions IN_PRODUCTION→READY_FOR_FIT_CHECK"

      - from: FINISHING
        to: QC_FAILED
        trigger: "POST /lofts/work-orders/{workOrderId}/production-jobs/{jobId}/qc-fail"
        actor: Sailmaker
        preconditions: []
        side_effects:
          - "qc_notes captured from payload"

      - from: QC_FAILED
        to: SCHEDULED
        trigger: "POST /lofts/work-orders/{workOrderId}/production-jobs/{jobId}/reschedule"
        actor: Sailmaker
        preconditions:
          - "bay window must pass the bay-overlap check for the new dates"
        side_effects:
          - "reserved_cloth_sqm recomputed on the new window"
        note: "Cyclic QC loop — QC_FAILED → SCHEDULED allows rework"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (cascade from LoftWorkOrder cancel)"
        actor: system
        preconditions: []
        side_effects:
          - "reserved_cloth_sqm released back to ClothLedgerEntry"

      - from: CUTTING
        to: CANCELLED
        trigger: "system (cascade from LoftWorkOrder cancel)"
        actor: system
        preconditions: []
        side_effects:
          - "reserved_cloth_sqm released back to ClothLedgerEntry"

      - from: SEAMING
        to: CANCELLED
        trigger: "system (cascade from LoftWorkOrder cancel)"
        actor: system
        preconditions: []
        side_effects:
          - "reserved_cloth_sqm released back to ClothLedgerEntry"

      - from: FINISHING
        to: CANCELLED
        trigger: "system (cascade from LoftWorkOrder cancel)"
        actor: system
        preconditions: []
        side_effects:
          - "reserved_cloth_sqm released back to ClothLedgerEntry"

  - entity: RiggingInspection
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: REPORTED
        trigger: "POST /lofts/boats/{boatId}/rigging-inspections/{inspectionId}/report"
        actor: Rigger
        preconditions: []
        side_effects:
          - "inspected_at stamped"
          - "standing_months_at_inspection, standing_replacement_due_date, running_replacement_due_hours computed"
          - "If verdict == FAIL: boat.status transitions ACTIVE→OUT_OF_SERVICE (cross-entity cascade hop 1)"
          - "If verdict == FAIL: every MastServiceEvent for this boat in BOOKED status transitions to RIGGING_HOLD (cross-entity cascade hop 2, caused by the boat status change and the open FAIL inspection)"

      - from: REPORTED
        to: CLOSED
        trigger: "POST /lofts/boats/{boatId}/rigging-inspections/{inspectionId}/close"
        actor: Rigger
        preconditions:
          - "If verdict == FAIL: a replacement RiggingInspection with verdict != FAIL must exist in REPORTED status for the same boat and scope"
        side_effects:
          - "If verdict != FAIL and boat.status == OUT_OF_SERVICE due to this inspection chain being resolved, boat.status may return to ACTIVE"

  - entity: MastServiceEvent
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: BOOKED
        to: IN_PROGRESS
        trigger: "POST /lofts/boats/{boatId}/mast-service-events/{eventId}/start"
        actor: Rigger
        preconditions:
          - "No RiggingInspection for this boat in REPORTED status with verdict == FAIL"
          - "boat.status != OUT_OF_SERVICE"
        side_effects:
          - "boat.mast_status transitions per service_kind (UNSTEP→UNSTEPPED, STEP→STEPPED, TUNE→TUNING_IN_PROGRESS)"

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /lofts/boats/{boatId}/mast-service-events/{eventId}/complete"
        actor: Rigger
        preconditions: []
        side_effects:
          - "boat.mast_status transitions to STEPPED if service_kind == STEP, or to UNSTEPPED if service_kind == UNSTEP, or back to STEPPED if service_kind == TUNE"

      - from: BOOKED
        to: RIGGING_HOLD
        trigger: "system (cascade from RiggingInspection verdict == FAIL)"
        actor: system
        preconditions: []
        side_effects: []

      - from: RIGGING_HOLD
        to: BOOKED
        trigger: "system (automatic when the FAIL inspection is closed via a passing replacement)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Hold-release cycle — BOOKED→RIGGING_HOLD→BOOKED"

      - from: BOOKED
        to: CANCELLED
        trigger: "POST /lofts/boats/{boatId}/mast-service-events/{eventId}/cancel"
        actor: Rigger
        preconditions: []
        side_effects: []

  - entity: StorageContract
    initial_state: ENROLLED
    terminal_states: [RETURNED, CANCELLED]
    transitions:
      - from: ENROLLED
        to: RECEIVED
        trigger: "POST /lofts/boats/{boatId}/storage-contracts/{contractId}/receive"
        actor: LoftManager
        preconditions: []
        side_effects:
          - "quoted_storage_fee_cents computed via storage_fee calculation"

      - from: RECEIVED
        to: WASHED
        trigger: "POST /lofts/boats/{boatId}/storage-contracts/{contractId}/complete-wash"
        actor: LoftManager
        preconditions: []
        side_effects: []

      - from: WASHED
        to: STORED
        trigger: "POST /lofts/boats/{boatId}/storage-contracts/{contractId}/rack-store"
        actor: LoftManager
        preconditions: []
        side_effects: []

      - from: STORED
        to: OUT_FOR_DELIVERY
        trigger: "POST /lofts/boats/{boatId}/storage-contracts/{contractId}/stage-delivery"
        actor: LoftManager
        preconditions: []
        side_effects: []

      - from: OUT_FOR_DELIVERY
        to: RETURNED
        trigger: "POST /lofts/boats/{boatId}/storage-contracts/{contractId}/confirm-return"
        actor: Customer
        preconditions:
          - "acting Customer owns the boat"
        side_effects:
          - "Customer.outstanding_balance_cents += quoted_storage_fee_cents"

      - from: ENROLLED
        to: CANCELLED
        trigger: "POST /lofts/boats/{boatId}/storage-contracts/{contractId}/cancel"
        actor: LoftManager
        preconditions: []
        side_effects: []

  - entity: ClassCertificate
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "system (automatic when the referenced MeasurementSheet is superseded)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: design-revision-stale-boat
    parent_entity: Boat
    write_endpoint: "POST /lofts/boats/{boatId}/sail-designs"
    occ_field: expected_boat_version
    description: |
      Creating a new SailDesign revision against a Boat whose version has
      advanced since the client last observed it is rejected. This captures
      the case where another writer has just created a revision (which
      supersedes the prior design under the design-revision rule) and the
      current writer's view of the boat is therefore stale.
    error_id: ERR_STALE_BOAT_VERSION
    http_status: 412

  - rule_id: inspection-create-stale-boat
    parent_entity: Boat
    write_endpoint: "POST /lofts/boats/{boatId}/rigging-inspections"
    occ_field: expected_boat_version
    description: |
      Creating a new RiggingInspection against a Boat whose version has
      advanced since the client last observed it is rejected. A newer
      inspection legitimately supersedes the client's scheduling context,
      so the write must restart from a fresh read.
    error_id: ERR_STALE_BOAT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: sail_area
    trigger: "MeasurementSheet freeze"
    algorithm: aggregation
    formula: |
      mainsail_area = 0.5 * p_main_m * e_main_m
      foretriangle_area = 0.5 * i_height_m * j_base_m
      measured_area_sqm = mainsail_area + foretriangle_area
    input_set: "The MeasurementSheet being frozen (i_height_m, j_base_m, p_main_m, e_main_m all positive)"
    constants:
      MAINSAIL_FACTOR: 0.5
      FORETRIANGLE_FACTOR: 0.5
    precision: "2 decimal places, round_half_up"

  - name: sail_price
    trigger: "LoftWorkOrder lock-design (provisional quote)"
    algorithm: tiered_pricing
    formula: |
      base = pinned_design.measured_area_sqm * cloth_price_for_tier(pinned_design.cloth_tier)
      # HEAVY_DUTY surcharge: applies only when measured_area_sqm > HEAVY_DUTY_AREA_THRESHOLD (strict >)
      if pinned_design.measured_area_sqm > HEAVY_DUTY_AREA_THRESHOLD:
        base = base * (1 + HEAVY_DUTY_SURCHARGE_PCT * pinned_design.reinforcement_level)
      # Options: each option adds a flat fee
      options_total = sum(OPTION_PRICE[c] for c in pinned_design.option_codes)
      # Complexity multiplier keyed on racing_class of the boat
      complexity = CLASS_COMPLEXITY[boat.racing_class]
      quoted_total_cents = round_half_up( (base + options_total) * complexity )
    input_set: "The pinned APPROVED SailDesign row, its FROZEN MeasurementSheet.measured_area_sqm, and the Boat.racing_class"
    constants:
      HEAVY_DUTY_AREA_THRESHOLD: 150.00
      HEAVY_DUTY_SURCHARGE_PCT: 0.04
      OPTION_PRICE: { BATTENS: 18000, REEF_POINTS: 12000, UV_STRIP: 9000, NUMBERS: 4000, LOGO: 6000 }
      CLASS_COMPLEXITY: { NONE: 1.00, PHRF: 1.00, ORC: 1.05, J70: 1.05, J105: 1.08, TP52: 1.15 }
      CLOTH_PRICE_PER_SQM_CENTS: { CRUISE: 4200, PERFORMANCE: 6800, RACE: 9500, GRAND_PRIX: 14000 }
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "quoted at lock-design time"
        difference: "uses the design's option_codes and reinforcement_level as-is; may include options the customer later declines"
      - name: final
        when: "computed at confirm-delivery"
        difference: "recomputed against the DELIVERED line-item set (options actually fitted); excludes any option the customer declined at fit check"

  - name: final_invoice
    trigger: "LoftWorkOrder confirm-delivery"
    algorithm: chronological
    formula: |
      # Walk QC_PASSED ProductionJobs for the work order in scheduled_start_date ASC,
      # tie-break ProductionJob.created_at ASC; for each job, accumulate its share.
      # Job share = job.reserved_cloth_sqm * cloth_price_for_tier(design.cloth_tier)
      # invoiced_total_cents = round_half_up(sum(job shares) + fitted_options_total)
      jobs = [j for j in ProductionJob where j.work_order_id == order.id and j.job_status == QC_PASSED]
      sort jobs by (scheduled_start_date ASC, created_at ASC)
      subtotal = sum(j.reserved_cloth_sqm * CLOTH_PRICE_PER_SQM_CENTS[design.cloth_tier] for j in jobs)
      fitted_options_total = sum(OPTION_PRICE[c] for c in options actually fitted at fit check)
      invoiced_total_cents = round_half_up(subtotal + fitted_options_total)
    input_set: "QC_PASSED ProductionJobs of the work order + the fitted option set recorded at fit check"
    constants:
      CLOTH_PRICE_PER_SQM_CENTS: { CRUISE: 4200, PERFORMANCE: 6800, RACE: 9500, GRAND_PRIX: 14000 }
      OPTION_PRICE: { BATTENS: 18000, REEF_POINTS: 12000, UV_STRIP: 9000, NUMBERS: 4000, LOGO: 6000 }
    precision: "integer cents, round_half_up"
    note: "Chronological (only QC_PASSED jobs, in schedule order) vs provisional (forward-looking from the design spec) — the two variants may diverge when options are declined or jobs are QC-failed and cancelled"

  - name: standing_rigging_replacement_due
    trigger: "RiggingInspection report"
    algorithm: threshold
    formula: |
      standing_months_at_inspection = whole_months_between(boat.standing_rigging_install_date, inspected_at)
      standing_replacement_due_date = boat.standing_rigging_install_date + 120 months
      if standing_months_at_inspection >= MANDATORY_REPLACEMENT_MONTHS:
        verdict_floor = ADVISORY (inspector's PASS is overridden to ADVISORY when months >= 120)
    input_set: "Boat.standing_rigging_install_date and the inspection's inspected_at"
    constants:
      MANDATORY_REPLACEMENT_MONTHS: 120
    precision: "whole calendar months"
    variants:
      - name: calendar_months
        when: "standing rigging"
        difference: "driven purely by elapsed calendar months from install date"
      - name: advisory_only
        when: "months < 120"
        difference: "no verdict override; inspector's verdict stands"

  - name: running_rigging_replacement_due
    trigger: "RiggingInspection report"
    algorithm: threshold
    formula: |
      running_replacement_due_hours = RUNNING_REPLACEMENT_HOURS
      if boat.running_rigging_hours_accumulated >= RUNNING_REPLACEMENT_HOURS:
        verdict_floor = ADVISORY
    input_set: "Boat.running_rigging_hours_accumulated"
    constants:
      RUNNING_REPLACEMENT_HOURS: 2000
    precision: "whole sail-hours"
    note: "Hours-driven variant of the same replacement family — produces a different verdict floor than the calendar variant for identical boats at identical times (e.g., a 2-year-old boat with 2100 hours fails the hours test but passes the calendar test)"

  - name: storage_fee
    trigger: "StorageContract receive"
    algorithm: aggregation
    formula: |
      # PINNED ROUNDING ORDER: round each wash item fee to whole cents FIRST,
      # then sum the rounded items, then add the hull-length-tier season base.
      per_item_fees = [round_half_up(WASH_ITEM_PRICE[c]) for c in wash_item_codes]
      items_total = sum(per_item_fees)
      season_base = SEASON_BASE_TIER(boat.hull_length_m)   # tiered by hull length
      quoted_storage_fee_cents = season_base + items_total
    input_set: "The StorageContract.wash_item_codes array and Boat.hull_length_m"
    constants:
      WASH_ITEM_PRICE: { MAIN_WASH: 14550, GENOA_WASH: 12350, SPINNAKER_WASH: 9875, RIG_WASH: 21000 }
      SEASON_BASE_UNDER_10M: 180000
      SEASON_BASE_10M_TO_15M: 260000
      SEASON_BASE_OVER_15M: 390000
    precision: "integer cents, per-item round_half_up THEN sum (pinned order — sum-then-round is explicitly rejected)"
    note: "Mode (b) nested rounding: per-item-round-then-sum vs sum-then-round produce different cents when fractional wash pricing applies (e.g., seasonal discount variants); the scaffold pins per-item-round-then-sum"

  - name: bay_overlap_check
    trigger: "ProductionJob scheduling and rescheduling"
    algorithm: interval_merge
    formula: |
      # Closed-interval-with-buffer semantics on (bay_code, [scheduled_start_date, scheduled_end_date]):
      # two jobs J1, J2 on the same bay conflict when
      #   J1.scheduled_start_date <= J2.scheduled_end_date + 1 day
      #   AND J2.scheduled_start_date <= J1.scheduled_end_date + 1 day
      # i.e. a mandatory >= 1 calendar-day turnaround gap between jobs in the same bay.
      # Jobs in CANCELLED status are excluded from the conflict set.
    input_set: "All non-CANCELLED ProductionJobs with the same bay_code"
    constants:
      BAY_TURNAROUND_GAP_DAYS: 1

  - name: mast_slot_overlap_check
    trigger: "MastServiceEvent booking"
    algorithm: interval_merge
    formula: |
      # Half-open interval semantics on (boat, [slot_start_utc, slot_end_utc)):
      # two events E1, E2 on the same boat conflict when
      #   E1.slot_start_utc < E2.slot_end_utc AND E2.slot_start_utc < E1.slot_end_utc
      # Adjacent bookings (E1.slot_end_utc == E2.slot_start_utc) are ALLOWED.
      # Events in CANCELLED or COMPLETED status are excluded from the conflict set.
    input_set: "All MastServiceEvents for the same boat in BOOKED or IN_PROGRESS or RIGGING_HOLD status"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "The role in X-User-Role must be permitted for this endpoint per the RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path resource ids must exist, validated left-to-right (customer → boat → child)"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: state
    check: "Target resource must be in a valid source state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 5
    category: state
    check: "Design approval: pinned SailDesign must be SUBMITTED; lock-design: design must be APPROVED"
    error_id: ERR_DESIGN_NOT_IN_REQUIRED_STATE
    http_status: 409
    applies_to: "POST /lofts/boats/{boatId}/sail-designs/{designId}/approve, POST /lofts/work-orders/{workOrderId}/lock-design"

  - priority: 6
    category: business_safety
    check: "Mast service start: no RiggingInspection for this boat in REPORTED status with verdict == FAIL, and boat.status != OUT_OF_SERVICE"
    error_id: ERR_UNRESOLVED_RIGGING_FAIL
    http_status: 409
    applies_to: "POST /lofts/boats/{boatId}/mast-service-events/{eventId}/start"

  - priority: 7
    category: business_temporal
    check: "Mast service booking: slot must not overlap an existing non-terminal MastServiceEvent on the same boat (half-open interval rule)"
    error_id: ERR_MAST_SLOT_OVERLAP
    http_status: 409
    applies_to: "POST /lofts/boats/{boatId}/mast-service-events"

  - priority: 8
    category: business_temporal
    check: "Production job scheduling: bay window must respect the closed-interval + 1-day-turnaround rule against non-CANCELLED jobs in the same bay"
    error_id: ERR_BAY_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /lofts/work-orders/{workOrderId}/production-jobs, POST /lofts/work-orders/{workOrderId}/production-jobs/{jobId}/reschedule"

  - priority: 9
    category: business_referential
    check: "Sail design submission: referenced MeasurementSheet must exist and be FROZEN"
    error_id: ERR_MEASUREMENT_NOT_FROZEN
    http_status: 409
    applies_to: "POST /lofts/boats/{boatId}/sail-designs/{designId}/submit"

  - priority: 10
    category: business_constraint
    check: "Class certificate issuance: certificate racing_class must equal boat.racing_class, boat.racing_class != NONE, and referenced MeasurementSheet must be FROZEN"
    error_id: ERR_CLASS_MISMATCH
    http_status: 422
    applies_to: "POST /lofts/boats/{boatId}/class-certificates"

  - priority: 11
    category: business_constraint
    check: "Cloth reservation: ProductionJob.reserved_cloth_sqm (derived from design area) must be <= ClothLedgerEntry.available_sqm for the design's cloth_tier"
    error_id: ERR_CLOTH_SHORTAGE
    http_status: 409
    applies_to: "POST /lofts/work-orders/{workOrderId}/production-jobs"

  - priority: 12
    category: business_fiscal
    check: "Design approval: Customer.outstanding_balance_cents + projected quoted_total_cents must be <= Customer.credit_limit_cents"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /lofts/boats/{boatId}/sail-designs/{designId}/approve"

  - priority: 13
    category: business_constraint
    check: "Measurement freeze: i_height_m, j_base_m, p_main_m, e_main_m must all be positive numbers"
    error_id: ERR_INVALID_MEASUREMENT
    http_status: 422
    applies_to: "POST /lofts/boats/{boatId}/measurement-sheets/{sheetId}/freeze"

  - priority: 14
    category: business_constraint
    check: "Rigging inspection close on FAIL verdict: a passing replacement REPORTED inspection must exist for same boat and scope"
    error_id: ERR_FAIL_NOT_SUPERSEDED
    http_status: 409
    applies_to: "POST /lofts/boats/{boatId}/rigging-inspections/{inspectionId}/close"

  - priority: 15
    category: business_temporal
    check: "Warranty claim: claim must be filed within 730 days of delivery"
    error_id: ERR_WARRANTY_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /lofts/work-orders/{workOrderId}/open-warranty-claim"

  - priority: 16
    category: business_constraint
    check: "Customer suspension: outstanding_balance_cents must be strictly greater than credit_limit_cents; reinstate: balance must be <= limit; close: balance must be 0"
    error_id: ERR_ACCOUNT_RULE_VIOLATION
    http_status: 422
    applies_to: "POST /lofts/customers/{customerId}/suspend, POST /lofts/customers/{customerId}/reinstate, POST /lofts/customers/{customerId}/close"

  - priority: 17
    category: business_constraint
    check: "OCC: expected_boat_version on design-revision create and inspection create must equal the boat's current version"
    error_id: ERR_STALE_BOAT_VERSION
    http_status: 412
    applies_to: "POST /lofts/boats/{boatId}/sail-designs, POST /lofts/boats/{boatId}/rigging-inspections"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Customer ---
  - method: POST
    path: "/lofts/customers"
    description: "Register a new customer"
    roles: [LoftManager]
    code: 201
    input: [full_name, email, credit_limit_cents]
    output: Customer
    side_effects: ["outstanding_balance_cents initialized to 0", "status initialized to ACTIVE"]

  - method: GET
    path: "/lofts/customers"
    description: "List customers"
    roles: [LoftManager, Sailmaker, Measurer, Rigger]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Customer[]"
    side_effects: []

  - method: GET
    path: "/lofts/customers/{customerId}"
    description: "Get one customer"
    roles: [LoftManager, Sailmaker, Measurer, Rigger, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: POST
    path: "/lofts/customers/{customerId}/suspend"
    description: "Suspend a customer whose balance exceeds the credit limit"
    roles: [LoftManager]
    code: 200
    input: []
    output: Customer
    side_effects: ["Customer.status → SUSPENDED"]

  - method: POST
    path: "/lofts/customers/{customerId}/reinstate"
    description: "Reinstate a suspended customer whose balance is back within the limit"
    roles: [LoftManager]
    code: 200
    input: []
    output: Customer
    side_effects: ["Customer.status → ACTIVE"]

  - method: POST
    path: "/lofts/customers/{customerId}/close"
    description: "Close a customer account (balance zero, no active boats)"
    roles: [LoftManager]
    code: 200
    input: []
    output: Customer
    side_effects: ["Customer.status → CLOSED"]

  - method: POST
    path: "/lofts/customers/{customerId}/payments"
    description: "Record a payment against the customer's outstanding balance"
    roles: [LoftManager]
    code: 201
    input: [amount_cents]
    output: Customer
    side_effects: ["outstanding_balance_cents -= amount_cents (floor 0)"]

  # --- Boat ---
  - method: POST
    path: "/lofts/customers/{customerId}/boats"
    description: "Register a boat for a customer"
    roles: [LoftManager]
    code: 201
    input: [boat_name, hull_length_m, racing_class, standing_rigging_install_date, "running_rigging_hours_accumulated?"]
    output: Boat
    side_effects: ["mast_status initialized to STEPPED", "status initialized to ACTIVE"]

  - method: GET
    path: "/lofts/customers/{customerId}/boats"
    description: "List boats for a customer"
    roles: [LoftManager, Sailmaker, Measurer, Rigger, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Boat[]"
    side_effects: []

  - method: GET
    path: "/lofts/boats"
    description: "List boats across customers (filtered list form for FK reverse-reachability)"
    roles: [LoftManager, Sailmaker, Measurer, Rigger, Customer]
    code: 200
    input: ["limit?", "offset?", "customer_id?", "status?"]
    output: "Boat[]"
    side_effects: []

  - method: GET
    path: "/lofts/boats/{boatId}"
    description: "Get one boat"
    roles: [LoftManager, Sailmaker, Measurer, Rigger, Customer]
    code: 200
    input: []
    output: Boat
    side_effects: []

  # --- MeasurementSheet ---
  - method: POST
    path: "/lofts/boats/{boatId}/measurement-sheets"
    description: "Capture a draft measurement sheet for a boat"
    roles: [Measurer]
    code: 201
    input: [i_height_m, j_base_m, p_main_m, e_main_m]
    output: MeasurementSheet
    side_effects: ["sheet_status initialized to DRAFT"]

  - method: GET
    path: "/lofts/boats/{boatId}/measurement-sheets"
    description: "List measurement sheets for a boat"
    roles: [LoftManager, Sailmaker, Measurer, Rigger, Customer]
    code: 200
    input: ["limit?", "offset?", "sheet_status?"]
    output: "MeasurementSheet[]"
    side_effects: []

  - method: GET
    path: "/lofts/measurement-sheets"
    description: "List measurement sheets across boats (filtered list form)"
    roles: [LoftManager, Sailmaker, Measurer, Rigger, Customer]
    code: 200
    input: ["limit?", "offset?", "boat_id?", "sheet_status?"]
    output: "MeasurementSheet[]"
    side_effects: []

  - method: GET
    path: "/lofts/measurement-sheets/{sheetId}"
    description: "Get one measurement sheet"
    roles: [LoftManager, Sailmaker, Measurer, Rigger, Customer]
    code: 200
    input: []
    output: MeasurementSheet
    side_effects: []

  - method: POST
    path: "/lofts/boats/{boatId}/measurement-sheets/{sheetId}/freeze"
    description: "Freeze a draft sheet: compute area, stamp frozen_at, supersede prior FROZEN sheet for the boat"
    roles: [Measurer]
    code: 200
    input: []
    output: MeasurementSheet
    side_effects:
      - "sheet_status → FROZEN"
      - "measured_area_sqm computed via sail_area"
      - "frozen_at stamped"
      - "Any previously FROZEN sheet for this boat → SUPERSEDED, cascading ClassCertificate REVOKED and dependent SailDesign ARCHIVED"

  # --- SailDesign ---
  - method: POST
    path: "/lofts/boats/{boatId}/sail-designs"
    description: "Create a new design revision (first or superseding) pinned to a FROZEN sheet; OCC-guarded on Boat.version"
    roles: [Sailmaker]
    code: 201
    input: [measurement_sheet_id, cloth_tier, "reinforcement_level?", "option_codes?", expected_boat_version]
    output: SailDesign
    side_effects:
      - "design_status initialized to DRAFT"
      - "If a prior APPROVED design exists for this boat, it transitions to SUPERSEDED and revision_number increments"
      - "increments Boat.version by 1"

  - method: GET
    path: "/lofts/boats/{boatId}/sail-designs"
    description: "List sail designs for a boat"
    roles: [LoftManager, Sailmaker, Measurer, Rigger, Customer]
    code: 200
    input: ["limit?", "offset?", "design_status?"]
    output: "SailDesign[]"
    side_effects: []

  - method: GET
    path: "/lofts/sail-designs"
    description: "List sail designs across boats (filtered list form)"
    roles: [LoftManager, Sailmaker, Measurer, Rigger, Customer]
    code: 200
    input: ["limit?", "offset?", "boat_id?", "measurement_sheet_id?", "supersedes_design_id?", "design_status?"]
    output: "SailDesign[]"
    side_effects: []

  - method: GET
    path: "/lofts/sail-designs/{designId}"
    description: "Get one sail design"
    roles: [LoftManager, Sailmaker, Measurer, Rigger, Customer]
    code: 200
    input: []
    output: SailDesign
    side_effects: []

  - method: POST
    path: "/lofts/boats/{boatId}/sail-designs/{designId}/submit"
    description: "Submit a DRAFT design for customer approval"
    roles: [Sailmaker]
    code: 200
    input: []
    output: SailDesign
    side_effects: ["design_status → SUBMITTED"]

  - method: POST
    path: "/lofts/boats/{boatId}/sail-designs/{designId}/approve"
    description: "Customer approves a SUBMITTED design"
    roles: [Customer]
    code: 200
    input: []
    output: SailDesign
    side_effects: ["design_status → APPROVED"]

  - method: POST
    path: "/lofts/boats/{boatId}/sail-designs/{designId}/request-revision"
    description: "Customer requests revision on a SUBMITTED design"
    roles: [Customer]
    code: 200
    input: [rejection_reason]
    output: SailDesign
    side_effects: ["design_status → REVISION_REQUESTED", "rejection_reason stored"]

  - method: POST
    path: "/lofts/boats/{boatId}/sail-designs/{designId}/redraft"
    description: "Sailmaker returns a REVISION_REQUESTED design to DRAFT for editing"
    roles: [Sailmaker]
    code: 200
    input: []
    output: SailDesign
    side_effects: ["design_status → DRAFT"]

  # --- LoftWorkOrder ---
  - method: POST
    path: "/lofts/work-orders"
    description: "Open a work order for a customer+boat"
    roles: [LoftManager]
    code: 201
    input: [customer_id, boat_id, order_kind, "sail_design_id?", "warranty_flag?"]
    output: LoftWorkOrder
    side_effects: ["order_status initialized to OPEN"]

  - method: GET
    path: "/lofts/work-orders"
    description: "List work orders"
    roles: [LoftManager, Sailmaker, Measurer, Rigger, Customer]
    code: 200
    input: ["limit?", "offset?", "customer_id?", "boat_id?", "sail_design_id?", "order_status?"]
    output: "LoftWorkOrder[]"
    side_effects: []

  - method: GET
    path: "/lofts/work-orders/{workOrderId}"
    description: "Get one work order"
    roles: [LoftManager, Sailmaker, Measurer, Rigger, Customer]
    code: 200
    input: []
    output: LoftWorkOrder
    side_effects: []

  - method: POST
    path: "/lofts/work-orders/{workOrderId}/lock-design"
    description: "Lock the APPROVED design into the work order and compute the provisional quote"
    roles: [LoftManager]
    code: 200
    input: []
    output: LoftWorkOrder
    side_effects: ["order_status → DESIGN_LOCKED", "quoted_total_cents computed via sail_price (provisional)"]

  - method: POST
    path: "/lofts/work-orders/{workOrderId}/confirm-delivery"
    description: "Customer confirms delivery and fit check; final invoice is computed"
    roles: [Customer]
    code: 200
    input: ["fitted_option_codes?"]
    output: LoftWorkOrder
    side_effects:
      - "order_status → DELIVERED"
      - "invoiced_total_cents computed via final_invoice (chronological variant)"
      - "Customer.outstanding_balance_cents += invoiced_total_cents"

  - method: POST
    path: "/lofts/work-orders/{workOrderId}/open-warranty-claim"
    description: "Customer opens a warranty claim on a DELIVERED order"
    roles: [Customer]
    code: 200
    input: [claim_reason]
    output: LoftWorkOrder
    side_effects: ["order_status → WARRANTY_REVIEW"]

  - method: POST
    path: "/lofts/work-orders/{workOrderId}/rule-warranty"
    description: "LoftManager rules the claim: REPAIR credits the invoice and reworks; REPLACE spawns a replacement order"
    roles: [LoftManager]
    code: 200
    input: [ruling]
    output: LoftWorkOrder
    side_effects:
      - "REPAIR: order_status → WARRANTY_REPAIR, outstanding_balance_cents -= invoiced_total_cents (floor 0)"
      - "REPLACE: order_status → CLOSED, new LoftWorkOrder spawned OPEN with warranty_flag=true"

  - method: POST
    path: "/lofts/work-orders/{workOrderId}/close"
    description: "Close a DELIVERED or WARRANTY_REPAIR work order"
    roles: [LoftManager]
    code: 200
    input: []
    output: LoftWorkOrder
    side_effects: ["order_status → CLOSED"]

  - method: POST
    path: "/lofts/work-orders/{workOrderId}/cancel"
    description: "Cancel an OPEN work order, cascading to production jobs, cloth ledger, and orphaned design"
    roles: [LoftManager]
    code: 200
    input: []
    output: LoftWorkOrder
    side_effects:
      - "order_status → CANCELLED"
      - "Cascade: non-terminal ProductionJobs → CANCELLED; reserved cloth released; orphaned design → ARCHIVED"

  # --- ProductionJob ---
  - method: POST
    path: "/lofts/work-orders/{workOrderId}/production-jobs"
    description: "Schedule a production job into a bay window; reserves cloth"
    roles: [Sailmaker]
    code: 201
    input: [bay_code, scheduled_start_date, scheduled_end_date]
    output: ProductionJob
    side_effects:
      - "job_status initialized to SCHEDULED"
      - "reserved_cloth_sqm computed from the pinned design's measured_area_sqm"
      - "ClothLedgerEntry.available_sqm recomputed"

  - method: GET
    path: "/lofts/work-orders/{workOrderId}/production-jobs"
    description: "List production jobs for a work order"
    roles: [LoftManager, Sailmaker, Measurer, Rigger, Customer]
    code: 200
    input: ["limit?", "offset?", "job_status?"]
    output: "ProductionJob[]"
    side_effects: []

  - method: GET
    path: "/lofts/production-jobs"
    description: "List production jobs across work orders (filtered list form)"
    roles: [LoftManager, Sailmaker, Measurer, Rigger, Customer]
    code: 200
    input: ["limit?", "offset?", "work_order_id?", "job_status?", "bay_code?"]
    output: "ProductionJob[]"
    side_effects: []

  - method: GET
    path: "/lofts/production-jobs/{jobId}"
    description: "Get one production job"
    roles: [LoftManager, Sailmaker, Measurer, Rigger, Customer]
    code: 200
    input: []
    output: ProductionJob
    side_effects: []

  - method: POST
    path: "/lofts/work-orders/{workOrderId}/production-jobs/{jobId}/start-cutting"
    description: "Advance SCHEDULED → CUTTING; bubbles parent work order into IN_PRODUCTION"
    roles: [Sailmaker]
    code: 200
    input: []
    output: ProductionJob
    side_effects: ["job_status → CUTTING", "parent LoftWorkOrder DESIGN_LOCKED → IN_PRODUCTION"]

  - method: POST
    path: "/lofts/work-orders/{workOrderId}/production-jobs/{jobId}/advance"
    description: "Advance CUTTING → SEAMING → FINISHING"
    roles: [Sailmaker]
    code: 200
    input: []
    output: ProductionJob
    side_effects: ["job_status advances one stage"]

  - method: POST
    path: "/lofts/work-orders/{workOrderId}/production-jobs/{jobId}/qc-pass"
    description: "FINISHING → QC_PASSED; releases cloth reservation; may bubble parent to READY_FOR_FIT_CHECK"
    roles: [Sailmaker]
    code: 200
    input: []
    output: ProductionJob
    side_effects:
      - "job_status → QC_PASSED"
      - "reserved_cloth_sqm released to ClothLedgerEntry"
      - "parent LoftWorkOrder → READY_FOR_FIT_CHECK when all non-cancelled jobs QC_PASSED"

  - method: POST
    path: "/lofts/work-orders/{workOrderId}/production-jobs/{jobId}/qc-fail"
    description: "FINISHING → QC_FAILED with notes"
    roles: [Sailmaker]
    code: 200
    input: [qc_notes]
    output: ProductionJob
    side_effects: ["job_status → QC_FAILED", "qc_notes stored"]

  - method: POST
    path: "/lofts/work-orders/{workOrderId}/production-jobs/{jobId}/reschedule"
    description: "QC_FAILED → SCHEDULED into a new bay window"
    roles: [Sailmaker]
    code: 200
    input: [bay_code, scheduled_start_date, scheduled_end_date]
    output: ProductionJob
    side_effects: ["job_status → SCHEDULED", "bay overlap re-validated"]

  # --- ClothLedgerEntry ---
  - method: POST
    path: "/lofts/cloth-ledger"
    description: "Register a cloth bolt"
    roles: [LoftManager]
    code: 201
    input: [bolt_code, cloth_tier, total_sqm, price_per_sqm_cents]
    output: ClothLedgerEntry
    side_effects: ["available_sqm initialized to total_sqm"]

  - method: GET
    path: "/lofts/cloth-ledger"
    description: "List cloth bolts"
    roles: [LoftManager, Sailmaker]
    code: 200
    input: ["limit?", "offset?", "cloth_tier?"]
    output: "ClothLedgerEntry[]"
    side_effects: []

  - method: GET
    path: "/lofts/cloth-ledger/{boltId}"
    description: "Get one cloth bolt"
    roles: [LoftManager, Sailmaker]
    code: 200
    input: []
    output: ClothLedgerEntry
    side_effects: []

  # --- RiggingInspection ---
  - method: POST
    path: "/lofts/boats/{boatId}/rigging-inspections"
    description: "Schedule a rigging inspection; OCC-guarded on Boat.version"
    roles: [Rigger]
    code: 201
    input: [rigging_scope, expected_boat_version]
    output: RiggingInspection
    side_effects: ["inspection_status initialized to SCHEDULED", "increments Boat.version by 1"]

  - method: GET
    path: "/lofts/boats/{boatId}/rigging-inspections"
    description: "List rigging inspections for a boat"
    roles: [LoftManager, Sailmaker, Measurer, Rigger, Customer]
    code: 200
    input: ["limit?", "offset?", "inspection_status?"]
    output: "RiggingInspection[]"
    side_effects: []

  - method: GET
    path: "/lofts/rigging-inspections"
    description: "List rigging inspections across boats (filtered list form)"
    roles: [LoftManager, Sailmaker, Measurer, Rigger, Customer]
    code: 200
    input: ["limit?", "offset?", "boat_id?", "inspection_status?", "rigging_scope?"]
    output: "RiggingInspection[]"
    side_effects: []

  - method: GET
    path: "/lofts/rigging-inspections/{inspectionId}"
    description: "Get one rigging inspection"
    roles: [LoftManager, Sailmaker, Measurer, Rigger, Customer]
    code: 200
    input: []
    output: RiggingInspection
    side_effects: []

  - method: POST
    path: "/lofts/boats/{boatId}/rigging-inspections/{inspectionId}/report"
    description: "Submit the inspection verdict; computes replacement clocks; FAIL cascades boat OUT_OF_SERVICE and mast events to RIGGING_HOLD"
    roles: [Rigger]
    code: 200
    input: [verdict]
    output: RiggingInspection
    side_effects:
      - "inspection_status → REPORTED"
      - "inspected_at stamped; replacement clocks computed"
      - "verdict==FAIL → boat.status OUT_OF_SERVICE; boat's BOOKED MastServiceEvents → RIGGING_HOLD"

  - method: POST
    path: "/lofts/boats/{boatId}/rigging-inspections/{inspectionId}/close"
    description: "Close a REPORTED inspection; FAIL verdicts require a passing replacement first"
    roles: [Rigger]
    code: 200
    input: []
    output: RiggingInspection
    side_effects:
      - "inspection_status → CLOSED"
      - "If a FAIL is being superseded by a passing REPORTED inspection: boat.status may return to ACTIVE and held MastServiceEvents return to BOOKED"

  # --- MastServiceEvent ---
  - method: POST
    path: "/lofts/boats/{boatId}/mast-service-events"
    description: "Book a mast unstep/step/tune slot (half-open interval, adjacency allowed)"
    roles: [Rigger]
    code: 201
    input: [service_kind, slot_start_utc, slot_end_utc]
    output: MastServiceEvent
    side_effects:
      - "event_status initialized to BOOKED"
      - "boat.mast_status → UNSTEPPING_SCHEDULED when service_kind == UNSTEP"

  - method: GET
    path: "/lofts/boats/{boatId}/mast-service-events"
    description: "List mast service events for a boat"
    roles: [LoftManager, Sailmaker, Measurer, Rigger, Customer]
    code: 200
    input: ["limit?", "offset?", "event_status?"]
    output: "MastServiceEvent[]"
    side_effects: []

  - method: GET
    path: "/lofts/mast-service-events"
    description: "List mast service events across boats (filtered list form)"
    roles: [LoftManager, Sailmaker, Measurer, Rigger, Customer]
    code: 200
    input: ["limit?", "offset?", "boat_id?", "event_status?", "service_kind?"]
    output: "MastServiceEvent[]"
    side_effects: []

  - method: GET
    path: "/lofts/mast-service-events/{eventId}"
    description: "Get one mast service event"
    roles: [LoftManager, Sailmaker, Measurer, Rigger, Customer]
    code: 200
    input: []
    output: MastServiceEvent
    side_effects: []

  - method: POST
    path: "/lofts/boats/{boatId}/mast-service-events/{eventId}/start"
    description: "Start a BOOKED event; blocked while a FAIL inspection is unresolved"
    roles: [Rigger]
    code: 200
    input: []
    output: MastServiceEvent
    side_effects: ["event_status → IN_PROGRESS", "boat.mast_status updated per service_kind"]

  - method: POST
    path: "/lofts/boats/{boatId}/mast-service-events/{eventId}/complete"
    description: "Complete an IN_PROGRESS event"
    roles: [Rigger]
    code: 200
    input: []
    output: MastServiceEvent
    side_effects: ["event_status → COMPLETED", "boat.mast_status updated per service_kind"]

  - method: POST
    path: "/lofts/boats/{boatId}/mast-service-events/{eventId}/cancel"
    description: "Cancel a BOOKED event"
    roles: [Rigger]
    code: 200
    input: []
    output: MastServiceEvent
    side_effects: ["event_status → CANCELLED", "boat.mast_status returns to STEPPED if it was UNSTEPPING_SCHEDULED for this event"]

  # --- StorageContract ---
  - method: POST
    path: "/lofts/boats/{boatId}/storage-contracts"
    description: "Enrol a boat in the off-season storage & wash program"
    roles: [LoftManager]
    code: 201
    input: [season_code, "wash_item_codes?"]
    output: StorageContract
    side_effects: ["contract_status initialized to ENROLLED"]

  - method: GET
    path: "/lofts/boats/{boatId}/storage-contracts"
    description: "List storage contracts for a boat"
    roles: [LoftManager, Sailmaker, Measurer, Rigger, Customer]
    code: 200
    input: ["limit?", "offset?", "contract_status?"]
    output: "StorageContract[]"
    side_effects: []

  - method: GET
    path: "/lofts/storage-contracts"
    description: "List storage contracts across boats (filtered list form)"
    roles: [LoftManager, Sailmaker, Measurer, Rigger, Customer]
    code: 200
    input: ["limit?", "offset?", "boat_id?", "contract_status?", "season_code?"]
    output: "StorageContract[]"
    side_effects: []

  - method: GET
    path: "/lofts/storage-contracts/{contractId}"
    description: "Get one storage contract"
    roles: [LoftManager, Sailmaker, Measurer, Rigger, Customer]
    code: 200
    input: []
    output: StorageContract
    side_effects: []

  - method: POST
    path: "/lofts/boats/{boatId}/storage-contracts/{contractId}/receive"
    description: "Mark the boat received; compute the quoted storage fee"
    roles: [LoftManager]
    code: 200
    input: []
    output: StorageContract
    side_effects: ["contract_status → RECEIVED", "quoted_storage_fee_cents computed via storage_fee"]

  - method: POST
    path: "/lofts/boats/{boatId}/storage-contracts/{contractId}/complete-wash"
    description: "Mark wash service complete"
    roles: [LoftManager]
    code: 200
    input: []
    output: StorageContract
    side_effects: ["contract_status → WASHED"]

  - method: POST
    path: "/lofts/boats/{boatId}/storage-contracts/{contractId}/rack-store"
    description: "Move the boat into rack storage"
    roles: [LoftManager]
    code: 200
    input: []
    output: StorageContract
    side_effects: ["contract_status → STORED"]

  - method: POST
    path: "/lofts/boats/{boatId}/storage-contracts/{contractId}/stage-delivery"
    description: "Stage the boat for spring delivery"
    roles: [LoftManager]
    code: 200
    input: []
    output: StorageContract
    side_effects: ["contract_status → OUT_FOR_DELIVERY"]

  - method: POST
    path: "/lofts/boats/{boatId}/storage-contracts/{contractId}/confirm-return"
    description: "Customer confirms the boat is returned; storage fee is billed"
    roles: [Customer]
    code: 200
    input: []
    output: StorageContract
    side_effects: ["contract_status → RETURNED", "Customer.outstanding_balance_cents += quoted_storage_fee_cents"]

  - method: POST
    path: "/lofts/boats/{boatId}/storage-contracts/{contractId}/cancel"
    description: "Cancel an ENROLLED contract"
    roles: [LoftManager]
    code: 200
    input: []
    output: StorageContract
    side_effects: ["contract_status → CANCELLED"]

  # --- ClassCertificate ---
  - method: POST
    path: "/lofts/boats/{boatId}/class-certificates"
    description: "Issue a racing-class certificate against a FROZEN measurement sheet"
    roles: [Measurer]
    code: 201
    input: [measurement_sheet_id, racing_class]
    output: ClassCertificate
    side_effects: ["cert_status initialized to ACTIVE", "issued_at stamped"]

  - method: GET
    path: "/lofts/boats/{boatId}/class-certificates"
    description: "List class certificates for a boat"
    roles: [LoftManager, Sailmaker, Measurer, Rigger, Customer]
    code: 200
    input: ["limit?", "offset?", "cert_status?"]
    output: "ClassCertificate[]"
    side_effects: []

  - method: GET
    path: "/lofts/class-certificates"
    description: "List class certificates across boats (filtered list form)"
    roles: [LoftManager, Sailmaker, Measurer, Rigger, Customer]
    code: 200
    input: ["limit?", "offset?", "boat_id?", "measurement_sheet_id?", "cert_status?", "racing_class?"]
    output: "ClassCertificate[]"
    side_effects: []

  - method: GET
    path: "/lofts/class-certificates/{certId}"
    description: "Get one class certificate"
    roles: [LoftManager, Sailmaker, Measurer, Rigger, Customer]
    code: 200
    input: []
    output: ClassCertificate
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this endpoint per RBAC matrix" }
  - { id: ERR_RESOURCE_NOT_FOUND, http: 404, condition: "A path resource id does not exist (validated left-to-right)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is not in a valid source state for the requested transition" }
  - { id: ERR_DESIGN_NOT_IN_REQUIRED_STATE, http: 409, condition: "SailDesign must be SUBMITTED for approve, or APPROVED for lock-design" }
  - { id: ERR_UNRESOLVED_RIGGING_FAIL, http: 409, condition: "A REPORTED RiggingInspection with verdict FAIL exists for the boat, or boat is OUT_OF_SERVICE; mast service cannot start" }
  - { id: ERR_MAST_SLOT_OVERLAP, http: 409, condition: "Requested mast service slot overlaps an existing non-terminal MastServiceEvent on the same boat (half-open interval rule)" }
  - { id: ERR_BAY_WINDOW_CONFLICT, http: 409, condition: "Requested bay window violates the closed-interval + 1-day-turnaround rule against another non-CANCELLED ProductionJob in the same bay" }
  - { id: ERR_MEASUREMENT_NOT_FROZEN, http: 409, condition: "Referenced MeasurementSheet is missing or not in FROZEN status at design submission" }
  - { id: ERR_CLASS_MISMATCH, http: 422, condition: "Certificate racing_class differs from boat.racing_class, boat.racing_class is NONE, or referenced sheet is not FROZEN" }
  - { id: ERR_CLOTH_SHORTAGE, http: 409, condition: "reserved_cloth_sqm exceeds ClothLedgerEntry.available_sqm for the design's cloth_tier" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "Customer.outstanding_balance_cents + projected quoted_total_cents would exceed credit_limit_cents" }
  - { id: ERR_INVALID_MEASUREMENT, http: 422, condition: "One or more of i_height_m, j_base_m, p_main_m, e_main_m is not a positive number at freeze time" }
  - { id: ERR_FAIL_NOT_SUPERSEDED, http: 409, condition: "Closing a FAIL-verdict inspection requires a passing REPORTED replacement inspection for the same boat and scope" }
  - { id: ERR_WARRANTY_WINDOW_EXPIRED, http: 422, condition: "Warranty claim filed more than 730 days after delivery" }
  - { id: ERR_ACCOUNT_RULE_VIOLATION, http: 422, condition: "Suspend/reinstate/close preconditions on outstanding balance or active boats are violated" }
  - { id: ERR_STALE_BOAT_VERSION, http: 412, condition: "expected_boat_version does not match the boat's current version (OCC)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, or enum value outside the declared set" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "Boat owner; approves designs, confirms delivery/return, opens warranty claims — always scoped to boats they own"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /lofts/boats/{boatId}/sail-designs/{designId}/approve"
      - "POST /lofts/boats/{boatId}/sail-designs/{designId}/request-revision"
      - "POST /lofts/work-orders/{workOrderId}/confirm-delivery"
      - "POST /lofts/work-orders/{workOrderId}/open-warranty-claim"
      - "POST /lofts/boats/{boatId}/storage-contracts/{contractId}/confirm-return"
    shared_operations:
      - "GET read endpoints across the graph (own resources)"

  - name: Sailmaker
    description: "Designs sails and runs the production floor"
    identity: "opaque"
    exclusive_operations:
      - "POST /lofts/boats/{boatId}/sail-designs"
      - "POST /lofts/boats/{boatId}/sail-designs/{designId}/submit"
      - "POST /lofts/boats/{boatId}/sail-designs/{designId}/redraft"
      - "POST /lofts/work-orders/{workOrderId}/production-jobs"
      - "POST /lofts/work-orders/{workOrderId}/production-jobs/{jobId}/start-cutting"
      - "POST /lofts/work-orders/{workOrderId}/production-jobs/{jobId}/advance"
      - "POST /lofts/work-orders/{workOrderId}/production-jobs/{jobId}/qc-pass"
      - "POST /lofts/work-orders/{workOrderId}/production-jobs/{jobId}/qc-fail"
      - "POST /lofts/work-orders/{workOrderId}/production-jobs/{jobId}/reschedule"
    shared_operations:
      - "GET read endpoints across the graph"

  - name: Measurer
    description: "Captures measurement sheets and issues racing-class certificates"
    identity: "opaque"
    exclusive_operations:
      - "POST /lofts/boats/{boatId}/measurement-sheets"
      - "POST /lofts/boats/{boatId}/measurement-sheets/{sheetId}/freeze"
      - "POST /lofts/boats/{boatId}/class-certificates"
    shared_operations:
      - "GET read endpoints across the graph"

  - name: Rigger
    description: "Performs rigging inspections and mast services"
    identity: "opaque"
    exclusive_operations:
      - "POST /lofts/boats/{boatId}/rigging-inspections"
      - "POST /lofts/boats/{boatId}/rigging-inspections/{inspectionId}/report"
      - "POST /lofts/boats/{boatId}/rigging-inspections/{inspectionId}/close"
      - "POST /lofts/boats/{boatId}/mast-service-events"
      - "POST /lofts/boats/{boatId}/mast-service-events/{eventId}/start"
      - "POST /lofts/boats/{boatId}/mast-service-events/{eventId}/complete"
      - "POST /lofts/boats/{boatId}/mast-service-events/{eventId}/cancel"
    shared_operations:
      - "GET read endpoints across the graph"

  - name: LoftManager
    description: "Owns customers, boats, work orders, cloth ledger, and the storage program"
    identity: "opaque"
    exclusive_operations:
      - "POST /lofts/customers"
      - "POST /lofts/customers/{customerId}/suspend|reinstate|close"
      - "POST /lofts/customers/{customerId}/payments"
      - "POST /lofts/customers/{customerId}/boats"
      - "POST /lofts/work-orders"
      - "POST /lofts/work-orders/{workOrderId}/lock-design"
      - "POST /lofts/work-orders/{workOrderId}/rule-warranty"
      - "POST /lofts/work-orders/{workOrderId}/close"
      - "POST /lofts/work-orders/{workOrderId}/cancel"
      - "POST /lofts/cloth-ledger"
      - "POST /lofts/boats/{boatId}/storage-contracts and all contract lifecycle actions except confirm-return"
    shared_operations:
      - "GET read endpoints across the graph"
