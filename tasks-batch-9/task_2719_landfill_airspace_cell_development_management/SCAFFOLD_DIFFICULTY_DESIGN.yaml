            - "${l1_royalty} == 200.00 and ${l1_final} == 5700.00, both priced from HCA-2 at 50.00 and 5.00"
            - "${l1_bill} == 'FINALIZED'"

  - rule_id: resource_temporal_overlap
    instances:

      - name: survey_coverage_closed_intervals_plus_ninety_day_spacing_buffer
        grounds:
          - validations[priority=17]
          - validations[priority=18]
          - calculations.survey_coverage_overlap
          - state_machines.AerialSurvey.RECORDED_to_SUPERSEDED
          - state_machines.AerialSurvey.SUPERSEDED_to_RECORDED
        distinguishing_aspect: |
          The surveyed coverage period is a temporal resource under TWO different rules at once:
          a CLOSED-interval exclusion where a shared endpoint is already a conflict, and a
          90-day separation buffer measured on a DIFFERENT axis (flown_on, not coverage). A
          probe can satisfy one and violate the other, and a probe that violates both must
          report the overlap error because priority 17 precedes 18. The occupancy set is
          {RECORDED, SUPERSEDED}, so voiding a survey RELEASES its interval and its spacing
          claim, and the identical rejected-then-accepted payload proves it.
        test_recipe:
          setup:
            - "Landfill LF (annual_tonnage_forecast 300000, planned_density_tons_per_cy 0.90) with one QA_CERTIFIED cell C-1 of design_airspace_cy 1000000, so certified_airspace_cy is 1000000."
            - "Survey S1 flown_on 2026-08-01 covering the CLOSED interval [2026-05-01, 2026-07-31], measured_remaining_airspace_cy 700000, tons_placed_in_period 250000."
