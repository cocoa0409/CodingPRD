    output: Claim
    side_effects: ["credit enrollment.benefit_paid_cents back by approved_cents (non-wellness); recompute benefit_remaining_cents"]

  - method: POST
    path: "/benefits/claims/{claimId}/disburse"
    description: "Create a direct-deposit Disbursement for an APPROVED claim (APPROVED->PAID)"
    roles: [ClaimsAdjuster]
    code: 201
    input: []
    output: Disbursement
    side_effects: ["create Disbursement SETTLED; claim.status=PAID; claim.paid_cents=approved_cents"]

  - method: GET
    path: "/benefits/disbursements"
    description: "List disbursements, filterable by claim/account (reverse-reachability for Disbursement.claim_id and Disbursement.disbursement_account_id)"
    roles: [BenefitsAdmin, ClaimsAdjuster, Employee]
    code: 200
    input: ["claim_id?", "disbursement_account_id?", "status?", "limit?", "offset?"]
    output: Disbursement[]
    side_effects: []

  - method: GET
    path: "/benefits/disbursements/{disbursementId}"
    description: "Get a disbursement"
    roles: [BenefitsAdmin, ClaimsAdjuster, Employee]
    code: 200
    input: []
    output: Disbursement
    side_effects: []

  - method: POST
    path: "/benefits/disbursements/{disbursementId}/return"
    description: "Record an ACH return on a SETTLED disbursement (SETTLED->RETURNED); reverses the ledger and reverts the claim to APPROVED"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: Disbursement
    side_effects: ["credit enrollment.benefit_paid_cents back by amount_cents (non-wellness); claim.status=APPROVED; claim.paid_cents=0"]

# =============================================================================
# Table 6: Error Code Catalog (§1.6)
# =============================================================================
errors:
  - { id: ERR_MISSING_USER_CONTEXT, http: 401, condition: "X-User-ID / X-User-Role header absent or malformed" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A referenced resource id does not resolve" }
  - { id: ERR_REFERENCE_MISMATCH, http: 409, condition: "Cross-aggregate reference inconsistent (product/employer, account/employee, schedule/product mismatch)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_PRODUCT_NOT_OPEN, http: 409, condition: "Enrolling into / activating against a product whose status != OPEN" }
  - { id: ERR_SCHEDULE_EMPTY, http: 409, condition: "Opening a product with no BenefitScheduleItem" }
  - { id: ERR_EMPLOYEE_TERMINATED, http: 409, condition: "Activating an enrollment for a TERMINATED employee" }
  - { id: ERR_SECTION125_INACTIVE, http: 409, condition: "Pre-tax enrollment/activation while employer.section_125_plan_active == false" }
  - { id: ERR_EVENT_BEFORE_COVERAGE, http: 422, condition: "Claim event_date before enrollment.enrolled_at, or enrollment not ACTIVE at filing" }
  - { id: ERR_EVENT_NOT_COVERED, http: 422, condition: "Claim event_code has no matching BenefitScheduleItem on the enrolled product" }
  - { id: ERR_ACCOUNT_NOT_VERIFIED, http: 409, condition: "Disbursing to a DisbursementAccount whose verification_status != VERIFIED" }
  - { id: ERR_LIFETIME_MAX_REACHED, http: 409, condition: "Approving a claim whose event lifetime-occurrence count already equals lifetime_max_occurrences" }
  - { id: ERR_BENEFIT_EXHAUSTED, http: 409, condition: "Approving a non-wellness claim when annual benefit remaining is 0" }
  - { id: ERR_ENROLLMENT_NOT_FUNDED, http: 409, condition: "Approving a claim while enrollment.funding_status != CURRENT" }
  - { id: ERR_ENROLLMENT_NOT_ACTIVE, http: 409, condition: "Posting a payroll deduction against an enrollment whose lifecycle_status != ACTIVE" }
  - { id: ERR_ALREADY_PORTED, http: 409, condition: "Porting an enrollment that already has a CONVERTED PortabilityConversion or is not TERMINATED" }
  - { id: ERR_STALE_ENROLLMENT_VERSION, http: 412, condition: "expected_enrollment_version != current Enrollment.version on portability create (OCC)" }
  - { id: ERR_CLAIM_ALREADY_PAID, http: 409, condition: "Reopening/voiding a claim that has a SETTLED Disbursement" }
  - { id: ERR_DUPLICATE_ENROLLMENT, http: 409, condition: "Employee already holds a non-terminal (PENDING/ACTIVE) enrollment in the same product" }
  - { id: ERR_DUPLICATE_PAY_PERIOD, http: 409, condition: "A PayrollDeduction with the same pay_period_index already exists for this enrollment" }
  - { id: ERR_DUPLICATE_SCHEDULE_EVENT, http: 409, condition: "A BenefitScheduleItem with the same event_code already exists on the product" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Body field-level validation failed (missing required field, bad enum, negative amount, non-9-digit routing)" }
  - { id: ERR_VALIDATION_PAGINATION, http: 422, condition: "limit/offset outside allowed bounds" }

# =============================================================================
# Table 7: RBAC Matrix (§1.7)
# =============================================================================
roles:
  - name: BenefitsAdmin
    description: "Employer-side administrator: manages products, periods, employees, enrollment lifecycle, account verification"
    identity: "opaque"
    exclusive_operations:
      - "POST /employers — create employer"
      - "POST /benefits/plan-products — create product"
      - "POST /benefits/schedule-items — add schedule line"
      - "POST /benefits/plan-products/{planProductId}/open — open product"
      - "POST /benefits/plan-products/{planProductId}/close — close product"
      - "POST /benefits/enrollment-periods — create period"
      - "POST /benefits/enrollment-periods/{periodId}/open — open period"
      - "POST /benefits/enrollment-periods/{periodId}/close — close period"
      - "POST /benefits/employees — create employee"
      - "POST /benefits/employees/{employeeId}/terminate — terminate employee"
      - "POST /benefits/enrollments/{enrollmentId}/activate — activate enrollment"
      - "POST /benefits/enrollments/{enrollmentId}/terminate — terminate enrollment"
      - "POST /benefits/disbursement-accounts/{accountId}/verify — verify account"
    shared_operations:
      - "POST enrollments (with Employee)"
      - "POST disbursement-accounts (with Employee)"
      - "POST enrollments/{id}/decline (with Employee)"
      - "POST claims (with Employee)"

  - name: ClaimsAdjuster
    description: "Carrier-side adjuster: reviews, approves, denies, voids, reopens, disburses, and returns claims"
    identity: "opaque"
    exclusive_operations:
      - "POST /benefits/claims/{claimId}/start-review — begin review"
      - "POST /benefits/claims/{claimId}/approve — approve claim"
      - "POST /benefits/claims/{claimId}/deny — deny claim"
      - "POST /benefits/claims/{claimId}/reopen — reopen claim"
      - "POST /benefits/claims/{claimId}/void — void claim"
      - "POST /benefits/claims/{claimId}/disburse — disburse claim"
      - "POST /benefits/disbursements/{disbursementId}/return — record ACH return"
    shared_operations: []

  - name: Employee
    description: "Self-service member: enrolls, declines, adds disbursement accounts, files claims, ports terminated policies"
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /benefits/enrollments/{enrollmentId}/portability-conversions — port terminated policy"
    shared_operations:
      - "POST enrollments (with BenefitsAdmin)"
      - "POST disbursement-accounts (with BenefitsAdmin)"
      - "POST enrollments/{id}/decline (with BenefitsAdmin)"
      - "POST claims (with BenefitsAdmin)"

  - name: Payroll
    description: "Payroll processor: posts payroll-deduction outcomes that drive the funding dimension"
    identity: "opaque"
    exclusive_operations:
      - "POST /benefits/enrollments/{enrollmentId}/payroll-deductions — post deduction (shared with System)"
    shared_operations:
      - "POST payroll-deductions (with System)"

  - name: System
    description: "Automation role: logical clock control and automated payroll posting"
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc — set logical clock"
    shared_operations:
      - "POST payroll-deductions (with Payroll)"
