      - name: future_freeze_interval_not_yet_active_keeps_open
        claim_type: Correct Result
        grounds: [calculations.file_protection_state, entities.SecurityFreeze.fields.effective_at]
        distinguishing_aspect: "A FREEZE whose effective_at is in the future (clock < effective_at) does NOT yet make the file FROZEN; protection_state stays OPEN."
