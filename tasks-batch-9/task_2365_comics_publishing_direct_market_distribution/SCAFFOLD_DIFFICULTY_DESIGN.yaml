              payload: { name: "Nebula Knights", planned_issue_count: 6, royalty_pool_bps: 1200, cover_participation_bps: 1500 }
              as: EditorInChief
              captures: { t1: $.data.id }
            - call: "POST /comics/titles/${t1}/greenlight"
              payload: {}
              as: EditorInChief
              captures: { tv1: $.data.version }
            - call: "POST /comics/titles/${t1}/creative-assignments"
              payload: { creator_id: "${cr_w}", craft: "SCRIPT", page_rate_cents: 12000, royalty_share_bps: 4000, booking_start_date: "2026-08-01", booking_end_date: "2026-12-01", expected_title_version: "${tv1}" }
              as: EditorInChief
              captures: { a_w: $.data.id }
            - call: "POST /comics/creative-assignments/${a_w}/accept"
              payload: {}
              as: Creator
              as_user_id: "${cr_w}"
            - call: "POST /comics/titles/${t1}/issues"
