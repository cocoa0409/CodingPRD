scenario: "938. Farrier & Mobile Hoof-Care: client/horse profile & 6–8-week cycle, route & appointment, service (trim/shoe/corrective) & pricing, recurring auto-schedule & reminder, product/shoe inventory, lameness/vet coordination, per-visit billing, no-show"
domain_name: "farrier-mobile-hoof-care"
api_prefix: "/"

complexity_profile:
  primary_archetype: "Quota / allocation"
  secondary_archetype: "Pricing engine"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate
  notes: |
    A visit is decomposed per limb (LF/RF/LH/RH), so price, inventory draw and
    validation are all per-limb roll-ups rather than per-horse scalars. Route
    capacity is metered in TWO independent units (shoeing units and minutes),
    either of which alone can refuse a stop. Cycle length has two competing
    sources (routine horse profile vs a live therapeutic prescription). Trip fee
    attaches to a stop and is split across the horses billed at that stop with a
    deterministic remainder. Five ordered write gates (see gate_precedence)
    pre-empt one another before any business rule fires.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

list_ordering: |
  Every list endpoint returns its rows ordered by created_at ASC, then by the
  order the rows were minted inside a single request, unless the endpoint's own
  description says otherwise. `id` is NEVER a sort key.

# ---------------------------------------------------------------------------
# Declared constants — every named constant used anywhere in this scaffold has
# a value here. Nothing downstream may invent a value.
# ---------------------------------------------------------------------------
constants:
  # --- route capacity, two independent meters ---
  ROUTE_MAX_UNITS_PER_DAY: 44
  ROUTE_MAX_MINUTES_PER_DAY: 480
  MAX_STOPS_PER_ROUTE: 8
  ROUTE_DAY_START_MINUTE: 480

  # --- shoeing units, charged PER LIMB (service_type -> units) ---
  SERVICE_UNITS_TRIM: 1
  SERVICE_UNITS_RESET: 2
  SERVICE_UNITS_NEW_SHOES: 3
  SERVICE_UNITS_CORRECTIVE: 5
  SERVICE_UNITS_GLUE_ON: 4

  # --- chair minutes, charged PER LIMB (service_type -> minutes) ---
  SERVICE_MINUTES_TRIM: 8
  SERVICE_MINUTES_RESET: 14
  SERVICE_MINUTES_NEW_SHOES: 20
  SERVICE_MINUTES_CORRECTIVE: 32
  SERVICE_MINUTES_GLUE_ON: 26

  # --- per-horse handling overhead ---
  HORSE_HANDLING_MINUTES: 6
  SEDATION_EXTRA_MINUTES: 15
  SEDATION_HANDLING_MULTIPLIER_BP: 15000

  # --- per-stop travel overhead (barn.zone -> minutes) ---
  STOP_TRAVEL_MINUTES_ZONE_A: 15
  STOP_TRAVEL_MINUTES_ZONE_B: 30
  STOP_TRAVEL_MINUTES_ZONE_C: 50

  # --- cycle & auto-schedule ---
  MIN_ROUTINE_CYCLE_WEEKS: 6
  MAX_ROUTINE_CYCLE_WEEKS: 8
  MIN_PRESCRIBED_CYCLE_WEEKS: 2
  MAX_PRESCRIBED_CYCLE_WEEKS: 8
  DAYS_PER_WEEK: 7
  SNAP_FORWARD_LOOKAHEAD_DAYS: 3

  # --- lameness / vet ---
  LAMENESS_MIN_SEVERITY: 1
  LAMENESS_MAX_SEVERITY: 5
  LAMENESS_HOLD_SEVERITY_THRESHOLD: 3
  PRESCRIPTION_MAX_DURATION_DAYS: 180

  # --- reminders ---
  REMINDER_OFFSET_DAYS_PRIMARY: 7
  REMINDER_OFFSET_DAYS_SECONDARY: 2
  REMINDER_SUPPRESSION_WINDOW_DAYS: 3

  # --- cancellation tiers / no-show ---
  ADVANCE_CANCEL_MIN_LEAD_DAYS: 3
  LATE_CANCEL_FEE_CENTS: 3500
  ONSITE_CANCEL_FEE_CENTS: 5500
  NO_SHOW_FEE_CENTS: 6500
  NO_SHOW_ROLLING_WINDOW_DAYS: 180
  NO_SHOW_PREPAY_THRESHOLD: 3
  NO_SHOW_SUSPEND_THRESHOLD: 5
  PREPAY_DEPOSIT_MIN_CENTS: 10000

  # --- discounts & tax ---
  SEDATION_LABOR_SURCHARGE_BP: 1250
  MULTI_HORSE_DISCOUNT_MIN_HORSES: 3
  MULTI_HORSE_DISCOUNT_BP: 500
  LOYALTY_THRESHOLD_VISITS: 12
  LOYALTY_STANDARD_BP: 300
  LOYALTY_PREMIER_THRESHOLD_VISITS: 30
  LOYALTY_PREMIER_BP: 600
  PRODUCT_TAX_RATE_BP: 725
  LABOR_TAX_RATE_BP: 0
  TRIP_FEE_TAX_RATE_BP: 0
  FEE_TAX_RATE_BP: 0
  BASIS_POINT_DENOMINATOR: 10000

  # --- warranty revisit ---
  WARRANTY_WINDOW_DAYS: 21

  # --- inventory ---
  SHOES_PER_PAIR: 2
  REORDER_POINT_PAIRS: 2
  MAX_TRANSFER_PAIRS: 40
  MAX_CONSECUTIVE_RESETS: 1

  # --- misc / platform ---
  LIMB_COUNT_PER_HORSE: 4
  MINUTES_PER_DAY: 1440
  DEFAULT_PAGE_LIMIT: 10
  MIN_PAGE_LIMIT: 1
  MAX_PAGE_LIMIT: 100
  DEFAULT_CLOCK_UTC: "2026-05-01T00:00:00Z"

constant_mappings:
  limb_enum: ["LF", "RF", "LH", "RH"]
  weekday_enum: ["MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN"]
  weekday_of_date_rule: |
    The weekday token of an ISO date is derived from the proleptic Gregorian
    calendar. 2026-05-04 is MON. Weekday index MON=0 .. SUN=6.
  service_type_to_units:
    TRIM: SERVICE_UNITS_TRIM
    RESET: SERVICE_UNITS_RESET
    NEW_SHOES: SERVICE_UNITS_NEW_SHOES
    CORRECTIVE: SERVICE_UNITS_CORRECTIVE
    GLUE_ON: SERVICE_UNITS_GLUE_ON
  service_type_to_minutes:
    TRIM: SERVICE_MINUTES_TRIM
    RESET: SERVICE_MINUTES_RESET
    NEW_SHOES: SERVICE_MINUTES_NEW_SHOES
    CORRECTIVE: SERVICE_MINUTES_CORRECTIVE
    GLUE_ON: SERVICE_MINUTES_GLUE_ON
  service_type_to_rate_card_price_field:
    TRIM: "price_trim_cents"
    RESET: "price_reset_cents"
    NEW_SHOES: "price_new_shoes_cents"
    CORRECTIVE: "price_corrective_cents"
    GLUE_ON: "price_glue_on_cents"
  barn_zone_to_travel_minutes:
    A: STOP_TRAVEL_MINUTES_ZONE_A
    B: STOP_TRAVEL_MINUTES_ZONE_B
    C: STOP_TRAVEL_MINUTES_ZONE_C
  barn_zone_to_rate_card_trip_fee_field:
    A: "trip_fee_zone_a_cents"
    B: "trip_fee_zone_b_cents"
    C: "trip_fee_zone_c_cents"
  service_type_requires_sku:
    TRIM: false
    RESET: false
    NEW_SHOES: true
    CORRECTIVE: true
    GLUE_ON: true
  service_type_to_resulting_shoeing_state:
    TRIM: "BAREFOOT"
    RESET: "UNCHANGED"
    NEW_SHOES: "SHOD"
    CORRECTIVE: "SHOD"
    GLUE_ON: "GLUED"
  reset_keeps_the_current_state: |
    RESET reuses the shoe already on the limb, so its resulting shoeing_state is
    literally the limb's current shoeing_state — a self-loop on SHOD, on
    SHOD_WITH_PAD or on GLUED. RESET never changes shoeing_state and never
    changes current_sku_code; it only increments consecutive_reset_count.
  pad_overrides_resulting_state: |
    When ServiceLine.with_pad is true AND the row above resolves to SHOD, the
    resulting LimbState.shoeing_state is SHOD_WITH_PAD instead of SHOD. with_pad
    is therefore meaningful only for NEW_SHOES and CORRECTIVE, and is rejected
    (ERR_VALIDATION) for TRIM, for RESET and for GLUE_ON.
  certification_level_to_allowed_service_types:
    APPRENTICE: ["TRIM"]
    JOURNEYMAN: ["TRIM", "RESET", "NEW_SHOES", "GLUE_ON"]
    CERTIFIED_THERAPEUTIC: ["TRIM", "RESET", "NEW_SHOES", "GLUE_ON", "CORRECTIVE"]
  shoe_pairs_formula: |
    Shoes are drawn from stock in left/right PAIRS. For one appointment and one
    ShoeSku, pairs = ceil(shoe_count / SHOES_PER_PAIR) where shoe_count is the
    number of ServiceLine rows on that appointment whose sku_id is that SKU and
    whose service_type is one of NEW_SHOES / CORRECTIVE / GLUE_ON. An odd shoe
    count therefore draws a whole extra pair.
  rounding_rule: |
    All money is integer cents. Every rounding step named in calculations uses
    round_half_up on the exact rational value (i.e. floor(x + 1/2) for x >= 0).
  date_arithmetic_rule: |
    "cycle_weeks weeks after D" means D + cycle_weeks * DAYS_PER_WEEK calendar
    days. Lead-day differences are whole calendar-day differences between two
    ISO dates (date_b - date_a), never wall-clock hours.

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table  (19 entities)
# ---------------------------------------------------------------------------
entities:

  - name: Barn
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Display name of the barn / yard."
      - name: zone
        type: enum
        source: input
        description: "Travel zone of the barn; drives stop travel minutes and trip fee."
        constraints: "One of A, B, C"
      - name: served_weekdays
        type: array
        source: input
        description: "Weekday tokens on which this barn accepts a farrier visit."
        constraints: "Non-empty subset of MON,TUE,WED,THU,FRI,SAT,SUN; duplicates rejected"
      - name: access_open_minute
        type: integer
        source: input
        description: "Minute-of-day the barn gate opens."
        constraints: "0 <= access_open_minute < MINUTES_PER_DAY"
      - name: access_close_minute
        type: integer
        source: input
        description: "Minute-of-day the barn gate closes."
        constraints: "access_open_minute < access_close_minute <= MINUTES_PER_DAY"
      - name: blackout_dates
        type: array
        source: input
        description: "ISO dates on which the barn is closed regardless of served_weekdays."
        default: []

  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: display_name
        type: string
        source: input
        description: "Horse owner name."
      - name: home_barn_id
        type: string
        source: input
        description: "FK -> Barn.id; the barn this client's horses are normally kept at."
      - name: billing_standing
        type: enum
        source: computed
        description: "Derived standing gate — computed from the rolling no-show count and deposit balance by calculations.client_billing_standing."
        default: "ACTIVE"
        constraints: "One of ACTIVE, PREPAY_REQUIRED, SUSPENDED"
      - name: deposit_balance_cents
        type: integer
        source: computed
        description: "Refundable deposit held against future no-shows."
        default: 0
      - name: credit_balance_cents
        type: integer
        source: computed
        description: "Unapplied payment remainder left after the payment waterfall."
        default: 0
      - name: completed_visit_count
        type: integer
        source: computed
        description: "Count of this client's Appointment rows that ever reached status COMPLETED, plus the opening_completed_visit_count supplied when the client was migrated from the previous paper diary. Drives the loyalty tier."
        default: 0
      - name: no_show_count_rolling
        type: integer
        source: computed
        description: "Count of this client's NO_SHOW appointments whose completed_on falls inside the rolling window; see calculations.no_show_rolling_count."
        default: 0
      - name: tax_exempt
        type: boolean
        source: input
        description: "When true the PRODUCT_EXEMPT variant of calculations.invoice_tax applies."
        default: false

  - name: Horse
    parent: Client
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the paying owner."
      - name: barn_id
        type: string
        source: input
        description: "FK -> Barn.id; where the horse is physically kept."
      - name: name
        type: string
        source: input
        description: "Horse name."
      - name: routine_cycle_weeks
        type: integer
        source: input
        description: "Routine hoof-care cycle in weeks."
        constraints: "MIN_ROUTINE_CYCLE_WEEKS <= routine_cycle_weeks <= MAX_ROUTINE_CYCLE_WEEKS"
      - name: requires_sedation
        type: boolean
        source: input
        description: "Handling flag; selects the SEDATED variant of calculations.appointment_service_minutes and forces vet_present on the appointment."
        default: false
      - name: shoe_size_code
        type: string
        source: input
        description: "Nominal shoe size for this horse."
      - name: lifecycle_status
        type: enum
        source: system
        description: "Parallel axis 1 on Horse."
        default: "ACTIVE"
        constraints: "One of ACTIVE, RETIRED"
      - name: hold_status
        type: enum
        source: system
        description: "Parallel axis 2 on Horse — set to HOLD by a lameness case at or above LAMENESS_HOLD_SEVERITY_THRESHOLD."
        default: "CLEAR"
        constraints: "One of CLEAR, HOLD"
      - name: active_prescription_id
        type: string
        source: computed
        description: "FK -> VetPrescription.id; the single live prescription for this horse, or null. Maintained by calculations.prescription_liveness."
        default: null
      - name: next_due_on
        type: datetime
        source: computed
        description: "ISO date the next routine visit is due; written by calculations.next_due_on."
        default: null
      - name: last_completed_on
        type: datetime
        source: computed
        description: "ISO date of the most recent COMPLETED appointment for this horse."
        default: null

  - name: LimbState
    parent: Horse
    common_fields: true
    fields:
      - name: horse_id
        type: string
        source: input
        description: "FK -> Horse.id."
      - name: limb
        type: enum
        source: system
        description: "Which hoof this row tracks."
        constraints: "One of LF, RF, LH, RH"
      - name: shoeing_state
        type: enum
        source: system
        description: "Persistent per-limb shoeing state between visits."
        default: "BAREFOOT"
        constraints: "One of BAREFOOT, SHOD, SHOD_WITH_PAD, GLUED"
      - name: current_sku_code
        type: string
        source: computed
        description: "sku_code of the shoe currently on this limb; null when BAREFOOT."
        default: null
      - name: last_serviced_on
        type: datetime
        source: computed
        description: "ISO date this limb was last serviced by a PERFORMED service line."
        default: null
      - name: consecutive_reset_count
        type: integer
        source: computed
        description: "How many RESET services in a row this limb has had since the last NEW_SHOES / CORRECTIVE / GLUE_ON / TRIM."
        default: 0

  - name: Farrier
    parent: null
    common_fields: true
    fields:
      - name: display_name
        type: string
        source: input
        description: "Farrier name."
      - name: certification_level
        type: enum
        source: input
        description: "Gates which service types this farrier may perform; see constant_mappings.certification_level_to_allowed_service_types."
        constraints: "One of APPRENTICE, JOURNEYMAN, CERTIFIED_THERAPEUTIC"
      - name: cert_expires_on
        type: datetime
        source: input
        description: "ISO date the certification lapses; the farrier gate refuses work once current_date > cert_expires_on."
      - name: status
        type: enum
        source: system
        description: "Farrier availability."
        default: "ACTIVE"
        constraints: "One of ACTIVE, INACTIVE, DECERTIFIED"

  - name: ShoeSku
    parent: null
    common_fields: true
    fields:
      - name: sku_code
        type: string
        source: input
        description: "Stable product code; unique across ShoeSku rows."
        constraints: "Unique"
      - name: size_code
        type: string
        source: input
        description: "Shoe size this SKU fits."
      - name: material
        type: enum
        source: input
        description: "Shoe material."
        constraints: "One of STEEL, ALUMINUM, COMPOSITE"
      - name: price_cents_per_pair
        type: integer
        source: input
        description: "Retail price of one left/right pair, in cents."
        constraints: ">= 0"

  - name: InventoryBucket
    parent: null
    common_fields: true
    fields:
      - name: location_kind
        type: enum
        source: system
        description: "SHOP is the single central bucket per SKU; VAN is one bucket per farrier per SKU."
        constraints: "One of SHOP, VAN"
      - name: farrier_id
        type: string
        source: system
        description: "FK -> Farrier.id; null exactly when location_kind is SHOP."
        default: null
      - name: sku_id
        type: string
        source: system
        description: "FK -> ShoeSku.id."
      - name: on_hand_pairs
        type: integer
        source: computed
        description: "Physical pairs sitting in this bucket."
        default: 0
      - name: available_pairs
        type: integer
        source: computed
        description: "Pairs free to reserve."
        default: 0
      - name: reserved_pairs
        type: integer
        source: computed
        description: "Pairs held by RESERVED ShoeReservation rows."
        default: 0
      - name: replenishment_flag
        type: boolean
        source: computed
        description: "True while available_pairs <= REORDER_POINT_PAIRS; recomputed by calculations.bucket_replenishment_flag on every write INCLUDING creation, so a freshly minted bucket holding 0 pairs is already flagged."
        default: true

  - name: StockTransfer
    parent: null
    common_fields: true
    fields:
      - name: sku_id
        type: string
        source: input
        description: "FK -> ShoeSku.id."
      - name: from_bucket_id
        type: string
        source: input
        description: "FK -> InventoryBucket.id; must be the SHOP bucket for sku_id."
      - name: to_bucket_id
        type: string
        source: input
        description: "FK -> InventoryBucket.id; must be a VAN bucket for the same sku_id."
      - name: quantity_pairs
        type: integer
        source: input
        description: "Pairs moved."
        constraints: "1 <= quantity_pairs <= MAX_TRANSFER_PAIRS"
      - name: status
        type: enum
        source: system
        description: "Transfer lifecycle; IN_TRANSIT is the third inventory bucket."
        default: "REQUESTED"
        constraints: "One of REQUESTED, IN_TRANSIT, RECEIVED, CANCELLED, ABORTED"

  - name: ShoeReservation
    parent: Appointment
    common_fields: true
    fields:
      - name: appointment_id
        type: string
        source: system
        description: "FK -> Appointment.id."
      - name: sku_id
        type: string
        source: system
        description: "FK -> ShoeSku.id."
      - name: bucket_id
        type: string
        source: system
        description: "FK -> InventoryBucket.id; always the VAN bucket of the route's farrier for this SKU."
      - name: pairs
        type: integer
        source: computed
        description: "Pairs held; computed by calculations.shoe_pairs_required."
      - name: status
        type: enum
        source: system
        description: "Reserve / commit / release lifecycle."
        default: "RESERVED"
        constraints: "One of RESERVED, COMMITTED, RELEASED"

  - name: RateCard
    parent: null
    common_fields: true
    fields:
      - name: label
        type: string
        source: input
        description: "Human label for the card."
      - name: effective_from
        type: datetime
        source: input
        description: "ISO date from which this card prices work; selection is by SERVICE date, never invoice date."
      - name: supersedes_rate_card_id
        type: string
        source: input
        description: "FK -> RateCard.id; the card this one replaces, or null for the first card."
        default: null
      - name: price_trim_cents
        type: integer
        source: input
        description: "Labor price for one TRIM limb."
      - name: price_reset_cents
        type: integer
        source: input
        description: "Labor price for one RESET limb."
      - name: price_new_shoes_cents
        type: integer
        source: input
        description: "Labor price for one NEW_SHOES limb."
      - name: price_corrective_cents
        type: integer
        source: input
        description: "Labor price for one CORRECTIVE limb."
      - name: price_glue_on_cents
        type: integer
        source: input
        description: "Labor price for one GLUE_ON limb."
      - name: pad_price_cents
        type: integer
        source: input
        description: "Product price of one pad, charged per limb whose service line has with_pad true."
      - name: trip_fee_zone_a_cents
        type: integer
        source: input
        description: "Trip fee for one stop at a zone A barn."
      - name: trip_fee_zone_b_cents
        type: integer
        source: input
        description: "Trip fee for one stop at a zone B barn."
      - name: trip_fee_zone_c_cents
        type: integer
        source: input
        description: "Trip fee for one stop at a zone C barn."
      - name: status
        type: enum
        source: system
        description: "Card lifecycle; only ACTIVE and SUPERSEDED cards are eligible for pricing."
        default: "DRAFT"
        constraints: "One of DRAFT, ACTIVE, SUPERSEDED"

  - name: Route
    parent: Farrier
    common_fields: true
    fields:
      - name: farrier_id
        type: string
        source: input
        description: "FK -> Farrier.id; one farrier, one day."
      - name: route_date
        type: datetime
        source: input
        description: "ISO date the route runs."
      - name: status
        type: enum
        source: system
        description: "Route lifecycle; gate 2 refuses writes once DISPATCHED."
        default: "DRAFT"
        constraints: "One of DRAFT, PLANNED, DISPATCHED, CLOSED, CANCELLED"
      - name: committed_units
        type: integer
        source: computed
        description: "Sum of service_units over appointments attached to this route's stops."
        default: 0
      - name: committed_minutes
        type: integer
        source: computed
        description: "Sum of stop travel_minutes plus appointment service_minutes over this route."
        default: 0
      - name: stop_count
        type: integer
        source: computed
        description: "Number of RouteStop rows on this route whose status is not VOIDED."
        default: 0

  - name: RouteStop
    parent: Route
    common_fields: true
    fields:
      - name: route_id
        type: string
        source: input
        description: "FK -> Route.id."
      - name: barn_id
        type: string
        source: input
        description: "FK -> Barn.id; several horses at one barn form ONE stop."
      - name: sequence_index
        type: integer
        source: input
        description: "1-based contiguous ordering of stops within the route."
        constraints: "1 <= sequence_index <= route.stop_count + 1 at insert time"
      - name: planned_start_minute
        type: integer
        source: input
        description: "Minute-of-day the farrier plans to begin work at this stop."
        constraints: "0 <= planned_start_minute < MINUTES_PER_DAY"
      - name: status
        type: enum
        source: system
        description: "Stop lifecycle."
        default: "PENDING"
        constraints: "One of PENDING, ARRIVED, COMPLETED, VOIDED"
      - name: travel_minutes
        type: integer
        source: computed
        description: "Travel overhead of this stop, from constant_mappings.barn_zone_to_travel_minutes."
      - name: service_minutes
        type: integer
        source: computed
        description: "Sum of service_minutes over appointments attached to this stop."
        default: 0
      - name: end_minute
        type: integer
        source: computed
        description: "planned_start_minute + service_minutes."
      - name: trip_fee_cents
        type: integer
        source: computed
        description: "Trip fee for the stop, pinned from the effective rate card when the stop completes; 0 before that."
        default: 0
      - name: billable_horse_count
        type: integer
        source: computed
        description: "Number of appointments at this stop that bear a trip-fee share; see calculations.trip_fee_allocation."
        default: 0

  - name: Appointment
    parent: Horse
    common_fields: true
    fields:
      - name: horse_id
        type: string
        source: input
        description: "FK -> Horse.id."
      - name: route_stop_id
        type: string
        source: system
        description: "FK -> RouteStop.id; null while the appointment is UNROUTED or after a detach."
        default: null
      - name: origin_appointment_id
        type: string
        source: system
        description: "FK -> Appointment.id; the visit a WARRANTY_REVISIT follows up on, else null."
        default: null
      - name: rate_card_id
        type: string
        source: system
        description: "FK -> RateCard.id; the card selected by service date and pinned at completion / cancellation."
        default: null
      - name: scheduled_date
        type: datetime
        source: input
        description: "ISO date the visit is planned for."
      - name: visit_kind
        type: enum
        source: input
        description: "Discriminator for calculations.service_line_labor_amount."
        default: "ROUTINE"
        constraints: "One of ROUTINE, WARRANTY_REVISIT"
      - name: warranty_reason
        type: enum
        source: input
        description: "Why the warranty revisit was opened; null unless visit_kind is WARRANTY_REVISIT."
        default: null
        constraints: "One of SPRUNG_SHOE, LOST_SHOE, QUICK"
      - name: cycle_source
        type: enum
        source: computed
        description: "Which cycle derivation produced this appointment's date; null for manually created appointments."
        default: null
        constraints: "One of ROUTINE, THERAPEUTIC"
      - name: status
        type: enum
        source: system
        description: "Parallel axis 1 on Appointment — the visit lifecycle."
        default: "UNROUTED"
        constraints: "One of UNROUTED, SCHEDULED, CONFIRMED, BLOCKED, IN_PROGRESS, COMPLETED, CANCELLED_ADVANCE, CANCELLED_LATE, CANCELLED_ONSITE, NO_SHOW"
      - name: billing_status
        type: enum
        source: system
        description: "Parallel axis 2 on Appointment — evolves independently of status."
        default: "UNBILLED"
        constraints: "One of UNBILLED, INVOICED, SETTLED, VOIDED"
      - name: vet_present
        type: boolean
        source: input
        description: "Whether a vet will attend; required true when the horse requires sedation."
        default: false
      - name: service_units
        type: integer
        source: computed
        description: "Roll-up of per-limb shoeing units; see calculations.appointment_service_units."
        default: 0
      - name: service_minutes
        type: integer
        source: computed
        description: "Roll-up of per-limb minutes plus handling; see calculations.appointment_service_minutes."
        default: 0
      - name: estimated_total_cents
        type: integer
        source: computed
        description: "ESTIMATE variant of calculations.visit_price, refreshed on every service-line change."
        default: 0
      - name: cancellation_fee_cents
        type: integer
        source: computed
        description: "Fee levied by the cancellation tier or by no-show."
        default: 0
      - name: trip_fee_share_cents
        type: integer
        source: computed
        description: "This appointment's share of its stop's trip fee."
        default: 0
      - name: completed_on
        type: datetime
        source: computed
        description: "ISO date the visit reached COMPLETED, CANCELLED_* or NO_SHOW."
        default: null

  - name: ServiceLine
    parent: Appointment
    common_fields: true
    fields:
      - name: appointment_id
        type: string
        source: input
        description: "FK -> Appointment.id."
      - name: limb_state_id
        type: string
        source: input
        description: "FK -> LimbState.id; identifies both the horse and the exact limb."
      - name: prescription_id
        type: string
        source: input
        description: "FK -> VetPrescription.id; required for CORRECTIVE, must be null otherwise."
        default: null
      - name: sku_id
        type: string
        source: input
        description: "FK -> ShoeSku.id; required when constant_mappings.service_type_requires_sku is true for the service_type, must be null otherwise."
        default: null
      - name: limb
        type: enum
        source: computed
        description: "Copied from the referenced LimbState.limb."
        constraints: "One of LF, RF, LH, RH"
      - name: service_type
        type: enum
        source: input
        description: "The service performed on this limb."
        constraints: "One of TRIM, RESET, NEW_SHOES, CORRECTIVE, GLUE_ON"
      - name: with_pad
        type: boolean
        source: input
        description: "Whether a pad is fitted under the shoe on this limb. Only NEW_SHOES and CORRECTIVE accept true."
        default: false
      - name: status
        type: enum
        source: system
        description: "Line lifecycle."
        default: "PLANNED"
        constraints: "One of PLANNED, PERFORMED, OMITTED, REMOVED"
      - name: labor_cents
        type: integer
        source: computed
        description: "Rounded labor amount for this line; see calculations.service_line_labor_amount."
        default: 0

  - name: LamenessCase
    parent: Horse
    common_fields: true
    fields:
      - name: horse_id
        type: string
        source: input
        description: "FK -> Horse.id."
      - name: reported_on
        type: datetime
        source: input
        description: "ISO date the lameness was reported."
      - name: severity
        type: integer
        source: input
        description: "Reported severity."
        constraints: "LAMENESS_MIN_SEVERITY <= severity <= LAMENESS_MAX_SEVERITY"
      - name: status
        type: enum
        source: system
        description: "Case lifecycle; RESOLVED can be reopened."
        default: "OPEN"
        constraints: "One of OPEN, PRESCRIBED, RESOLVED"
      - name: hold_applied
        type: boolean
        source: computed
        description: "True when this case put the horse on HOLD, i.e. severity >= LAMENESS_HOLD_SEVERITY_THRESHOLD."
        default: false

  - name: VetPrescription
    parent: LamenessCase
    common_fields: true
    fields:
      - name: lameness_case_id
        type: string
        source: input
        description: "FK -> LamenessCase.id."
      - name: horse_id
        type: string
        source: system
        description: "FK -> Horse.id; copied from the case."
      - name: issued_on
        type: datetime
        source: input
        description: "ISO date the vet issued the prescription."
      - name: expires_on
        type: datetime
        source: input
        description: "ISO date the prescription stops being live, inclusive."
        constraints: "issued_on <= expires_on <= issued_on + PRESCRIPTION_MAX_DURATION_DAYS days"
      - name: limb_scope
        type: array
        source: input
        description: "Limbs this prescription authorises CORRECTIVE work on."
        constraints: "Non-empty subset of LF,RF,LH,RH; duplicates rejected"
      - name: prescribed_cycle_weeks
        type: integer
        source: input
        description: "Therapeutic cycle that overrides the horse's routine cycle while live."
        constraints: "MIN_PRESCRIBED_CYCLE_WEEKS <= prescribed_cycle_weeks <= MAX_PRESCRIBED_CYCLE_WEEKS"
      - name: status
        type: enum
        source: system
        description: "Prescription lifecycle."
        default: "DRAFT"
        constraints: "One of DRAFT, ACTIVE, EXPIRED, REVOKED, SUPERSEDED"

  - name: Invoice
    parent: Appointment
    common_fields: true
    fields:
      - name: appointment_id
        type: string
        source: system
        description: "FK -> Appointment.id; exactly one invoice per billed visit."
      - name: client_id
        type: string
        source: system
        description: "FK -> Client.id."
      - name: rate_card_id
        type: string
        source: system
        description: "FK -> RateCard.id; the card that priced this visit."
      - name: status
        type: enum
        source: system
        description: "Invoice lifecycle."
        default: "DRAFT"
        constraints: "One of DRAFT, ISSUED, PARTIALLY_PAID, PAID, VOID"
      - name: issued_on
        type: datetime
        source: computed
        description: "ISO date the invoice was issued; null while DRAFT."
        default: null
      - name: labor_subtotal_cents
        type: integer
        source: computed
        description: "Sum of per-line rounded labor amounts."
        default: 0
      - name: product_subtotal_cents
        type: integer
        source: computed
        description: "Sum of shoe-pair and pad product amounts."
        default: 0
      - name: multi_horse_discount_cents
        type: integer
        source: computed
        description: "Discount applied to labor only when the stop bills enough horses."
        default: 0
      - name: loyalty_discount_cents
        type: integer
        source: computed
        description: "Loyalty discount over the combined labor-after-multi-horse plus product base."
        default: 0
      - name: loyalty_discount_labor_cents
        type: integer
        source: computed
        description: "Labor portion of loyalty_discount_cents."
        default: 0
      - name: loyalty_discount_product_cents
        type: integer
        source: computed
        description: "Product portion of loyalty_discount_cents; reduces the taxable base."
        default: 0
      - name: labor_net_cents
        type: integer
        source: computed
        description: "Labor after both discounts."
        default: 0
      - name: trip_fee_share_cents
        type: integer
        source: computed
        description: "This visit's allocated share of its stop's trip fee; never discounted, never taxed."
        default: 0
      - name: fee_cents
        type: integer
        source: computed
        description: "Cancellation or no-show fee; never discounted, never taxed."
        default: 0
      - name: taxable_product_base_cents
        type: integer
        source: computed
        description: "product_subtotal_cents minus loyalty_discount_product_cents."
        default: 0
      - name: tax_cents
        type: integer
        source: computed
        description: "Tax on the taxable product base only."
        default: 0
      - name: total_cents
        type: integer
        source: computed
        description: "labor_net + product_subtotal - loyalty_discount_product + trip_fee_share + fee + tax."
        default: 0
      - name: paid_cents
        type: integer
        source: computed
        description: "Amount applied by the payment waterfall."
        default: 0
      - name: balance_cents
        type: integer
        source: computed
        description: "total_cents - paid_cents."
        default: 0

  - name: InvoiceLine
    parent: Invoice
    common_fields: false
    fields:
      - name: invoice_id
        type: string
        source: system
        description: "FK -> Invoice.id."
      - name: line_kind
        type: enum
        source: system
        description: "What this line represents."
        constraints: "One of LABOR, PRODUCT, PAD, TRIP_FEE, CANCELLATION_FEE, NO_SHOW_FEE, MULTI_HORSE_DISCOUNT, LOYALTY_DISCOUNT, TAX"
      - name: description
        type: string
        source: system
        description: "Human-readable line description."
      - name: limb
        type: enum
        source: system
        description: "Limb this line belongs to, or null for whole-visit lines."
        default: null
        constraints: "One of LF, RF, LH, RH"
      - name: service_type
        type: enum
        source: system
        description: "Service type for LABOR lines, else null."
        default: null
        constraints: "One of TRIM, RESET, NEW_SHOES, CORRECTIVE, GLUE_ON"
      - name: sku_code
        type: string
        source: system
        description: "Plain product code string for PRODUCT lines, else null. Not a foreign key."
        default: null
      - name: quantity
        type: integer
        source: system
        description: "Units on this line (limbs, pairs or pads)."
        default: 1
      - name: unit_amount_cents
        type: integer
        source: system
        description: "Per-unit amount before rounding of the line total."
        default: 0
      - name: amount_cents
        type: integer
        source: system
        description: "Signed line amount; discount lines are negative."
        default: 0
      - name: taxable
        type: boolean
        source: system
        description: "Whether this line enters the taxable base."
        default: false

  - name: Reminder
    parent: Appointment
    common_fields: true
    fields:
      - name: appointment_id
        type: string
        source: system
        description: "FK -> Appointment.id."
      - name: offset_days
        type: integer
        source: system
        description: "Days before scheduled_date this reminder is due."
      - name: due_on
        type: datetime
        source: computed
        description: "scheduled_date minus offset_days."
      - name: status
        type: enum
        source: system
        description: "Reminder lifecycle; FAILED can be retried back to PENDING."
        default: "PENDING"
        constraints: "One of PENDING, SENT, ACKNOWLEDGED, FAILED"
      - name: sent_on
        type: datetime
        source: computed
        description: "ISO date the reminder was actually sent; null while PENDING."
        default: null

# ---------------------------------------------------------------------------
# §1.2 State Machine Table — 18 axes over 15 entities.
# Horse and Appointment each carry TWO independent (parallel) axes.
# ---------------------------------------------------------------------------
state_machines:

  # ---- 1. Client.billing_standing (cyclic; derived-status drives a write gate)
  - entity: Client
    axis: billing_standing
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: PREPAY_REQUIRED
        trigger: "system: recomputed inside POST /appointments/{id}/no-show and POST /_clock/set_current_utc"
        actor: system
        preconditions:
          - "calculations.no_show_rolling_count >= NO_SHOW_PREPAY_THRESHOLD"
          - "calculations.no_show_rolling_count < NO_SHOW_SUSPEND_THRESHOLD"
          - "Client.deposit_balance_cents < PREPAY_DEPOSIT_MIN_CENTS"
        side_effects:
          - "Client.billing_standing = PREPAY_REQUIRED"
          - "increments Client.version by 1"
      - from: PREPAY_REQUIRED
        to: ACTIVE
        trigger: "POST /clients/{id}/deposits"
        actor: BillingClerk
        preconditions:
          - "Client.deposit_balance_cents + amount_cents >= PREPAY_DEPOSIT_MIN_CENTS"
          - "calculations.no_show_rolling_count < NO_SHOW_SUSPEND_THRESHOLD"
        side_effects:
          - "Client.deposit_balance_cents += amount_cents"
          - "Client.billing_standing = ACTIVE"
          - "increments Client.version by 1"
      - from: PREPAY_REQUIRED
        to: ACTIVE
        trigger: "POST /_clock/set_current_utc (no-show strikes age out of the rolling window)"
        actor: system
        preconditions:
          - "calculations.no_show_rolling_count < NO_SHOW_PREPAY_THRESHOLD"
        side_effects:
          - "Client.no_show_count_rolling recomputed"
          - "Client.billing_standing = ACTIVE"
          - "increments Client.version by 1"
        note: "This is the re-entry leg that makes the axis cyclic rather than a one-way ratchet."
      - from: PREPAY_REQUIRED
        to: SUSPENDED
        trigger: "system: recomputed inside POST /appointments/{id}/no-show"
        actor: system
        preconditions:
          - "calculations.no_show_rolling_count >= NO_SHOW_SUSPEND_THRESHOLD"
        side_effects:
          - "Client.billing_standing = SUSPENDED"
          - "increments Client.version by 1"
      - from: SUSPENDED
        to: PREPAY_REQUIRED
        trigger: "POST /_clock/set_current_utc (strikes age out below NO_SHOW_SUSPEND_THRESHOLD)"
        actor: system
        preconditions:
          - "NO_SHOW_PREPAY_THRESHOLD <= calculations.no_show_rolling_count < NO_SHOW_SUSPEND_THRESHOLD"
        side_effects:
          - "Client.billing_standing = PREPAY_REQUIRED"
          - "increments Client.version by 1"

  # ---- 2. Horse.lifecycle_status (parallel axis 1 on Horse; cyclic)
  - entity: Horse
    axis: lifecycle_status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /horses/{id}/retire"
        actor: ClientUser
        preconditions:
          - "Horse.lifecycle_status == ACTIVE"
          - "no Appointment for this horse has status in {SCHEDULED, CONFIRMED, IN_PROGRESS}"
        side_effects:
          - "Horse.next_due_on = null"
          - "every Appointment for this horse with status UNROUTED is cancelled to CANCELLED_ADVANCE with cancellation_fee_cents = 0"
          - "increments Horse.version by 1"
      - from: RETIRED
        to: ACTIVE
        trigger: "POST /horses/{id}/reinstate"
        actor: ClientUser
        preconditions:
          - "Horse.lifecycle_status == RETIRED"
        side_effects:
          - "Horse.next_due_on = null until the next completed visit recomputes it"
          - "increments Horse.version by 1"

  # ---- 3. Horse.hold_status (parallel axis 2 on Horse; cyclic; guards routine work)
  - entity: Horse
    axis: hold_status
    initial_state: CLEAR
    terminal_states: []
    transitions:
      - from: CLEAR
        to: HOLD
        trigger: "POST /lameness-cases"
        actor: ClientUser
        preconditions:
          - "LamenessCase.severity >= LAMENESS_HOLD_SEVERITY_THRESHOLD"
        side_effects:
          - "LamenessCase.hold_applied = true"
          - "Horse.hold_status = HOLD"
          - "CASCADE-A hop 3: every Appointment of this horse with status in {SCHEDULED, CONFIRMED} moves to BLOCKED and its route_stop_id is set to null"
          - "increments Horse.version by 1"
      - from: HOLD
        to: CLEAR
        trigger: "POST /lameness-cases/{id}/resolve"
        actor: Veterinarian
        preconditions:
          - "after this resolve, no LamenessCase for the horse has hold_applied true AND status in {OPEN, PRESCRIBED}"
        side_effects:
          - "Horse.hold_status = CLEAR"
          - "every Appointment of this horse with status BLOCKED moves to UNROUTED"
          - "increments Horse.version by 1"
      - from: CLEAR
        to: HOLD
        trigger: "POST /lameness-cases/{id}/reopen"
        actor: Veterinarian
        preconditions:
          - "LamenessCase.severity >= LAMENESS_HOLD_SEVERITY_THRESHOLD"
        side_effects:
          - "LamenessCase.status = OPEN"
          - "Horse.hold_status = HOLD"
          - "increments Horse.version by 1"

  # ---- 4. LimbState.shoeing_state (per-limb graph with self-loops)
  - entity: LimbState
    axis: shoeing_state
    initial_state: BAREFOOT
    terminal_states: []
    transitions:
      - from: BAREFOOT
        to: SHOD
        trigger: "POST /appointments/{id}/complete with a PERFORMED ServiceLine of service_type NEW_SHOES or CORRECTIVE and with_pad false on this limb"
        actor: Farrier
        preconditions:
          - "ServiceLine.status becomes PERFORMED"
        side_effects:
          - "LimbState.current_sku_code = the sku_code of ServiceLine.sku_id"
          - "LimbState.last_serviced_on = the logical clock date"
          - "LimbState.consecutive_reset_count = 0"
      - from: BAREFOOT
        to: SHOD_WITH_PAD
        trigger: "POST /appointments/{id}/complete with a PERFORMED ServiceLine of service_type NEW_SHOES or CORRECTIVE and with_pad true on this limb"
        actor: Farrier
        preconditions:
          - "ServiceLine.status becomes PERFORMED"
        side_effects:
          - "LimbState.current_sku_code = the sku_code of ServiceLine.sku_id"
          - "LimbState.consecutive_reset_count = 0"
      - from: BAREFOOT
        to: GLUED
        trigger: "POST /appointments/{id}/complete with a PERFORMED GLUE_ON ServiceLine on this limb"
        actor: Farrier
        preconditions:
          - "ServiceLine.status becomes PERFORMED"
        side_effects:
          - "LimbState.current_sku_code = the sku_code of ServiceLine.sku_id"
          - "LimbState.consecutive_reset_count = 0"
      - from: BAREFOOT
        to: BAREFOOT
        trigger: "POST /appointments/{id}/complete with a PERFORMED TRIM ServiceLine on this limb"
        actor: Farrier
        preconditions:
          - "ServiceLine.status becomes PERFORMED"
        side_effects:
          - "LimbState.last_serviced_on = the logical clock date"
          - "LimbState.current_sku_code stays null"
          - "LimbState.consecutive_reset_count = 0"
        note: "The ordinary barefoot trim — a self-loop, not a no-op."
      - from: SHOD_WITH_PAD
        to: SHOD_WITH_PAD
        trigger: "POST /appointments/{id}/complete with a PERFORMED RESET ServiceLine on this limb"
        actor: Farrier
        preconditions:
          - "LimbState.consecutive_reset_count < MAX_CONSECUTIVE_RESETS at the time the service line was added"
        side_effects:
          - "LimbState.consecutive_reset_count += 1"
      - from: GLUED
        to: GLUED
        trigger: "POST /appointments/{id}/complete with a PERFORMED RESET ServiceLine on this limb"
        actor: Farrier
        preconditions:
          - "LimbState.consecutive_reset_count < MAX_CONSECUTIVE_RESETS at the time the service line was added"
        side_effects:
          - "LimbState.consecutive_reset_count += 1"
      - from: SHOD
        to: SHOD_WITH_PAD
        trigger: "POST /appointments/{id}/complete with a PERFORMED NEW_SHOES or CORRECTIVE ServiceLine with with_pad true on this limb"
        actor: Farrier
        preconditions:
          - "ServiceLine.status becomes PERFORMED"
        side_effects:
          - "LimbState.current_sku_code = the sku_code of ServiceLine.sku_id"
          - "LimbState.consecutive_reset_count = 0"
      - from: GLUED
        to: SHOD_WITH_PAD
        trigger: "POST /appointments/{id}/complete with a PERFORMED NEW_SHOES or CORRECTIVE ServiceLine with with_pad true on this limb"
        actor: Farrier
        preconditions:
          - "ServiceLine.status becomes PERFORMED"
        side_effects:
          - "LimbState.current_sku_code = the sku_code of ServiceLine.sku_id"
          - "LimbState.consecutive_reset_count = 0"
      - from: SHOD
        to: SHOD
        trigger: "POST /appointments/{id}/complete with a PERFORMED RESET ServiceLine on this limb"
        actor: Farrier
        preconditions:
          - "LimbState.shoeing_state in {SHOD, SHOD_WITH_PAD, GLUED} at the time the service line was added"
          - "LimbState.consecutive_reset_count < MAX_CONSECUTIVE_RESETS at the time the service line was added"
        side_effects:
          - "LimbState.consecutive_reset_count += 1"
          - "LimbState.current_sku_code unchanged"
        note: "Self-loop with a termination counter — a limb cannot be reset forever."
      - from: SHOD
        to: BAREFOOT
        trigger: "POST /appointments/{id}/complete with a PERFORMED TRIM ServiceLine on this limb"
        actor: Farrier
        preconditions:
          - "ServiceLine.status becomes PERFORMED"
        side_effects:
          - "LimbState.current_sku_code = null"
          - "LimbState.consecutive_reset_count = 0"
      - from: SHOD_WITH_PAD
        to: BAREFOOT
        trigger: "POST /appointments/{id}/complete with a PERFORMED TRIM ServiceLine on this limb"
        actor: Farrier
        preconditions:
          - "ServiceLine.status becomes PERFORMED"
        side_effects:
          - "LimbState.current_sku_code = null"
          - "LimbState.consecutive_reset_count = 0"
      - from: GLUED
        to: BAREFOOT
        trigger: "POST /appointments/{id}/complete with a PERFORMED TRIM ServiceLine on this limb"
        actor: Farrier
        preconditions:
          - "ServiceLine.status becomes PERFORMED"
        side_effects:
          - "LimbState.current_sku_code = null"
          - "LimbState.consecutive_reset_count = 0"
      - from: SHOD
        to: GLUED
        trigger: "POST /appointments/{id}/complete with a PERFORMED GLUE_ON ServiceLine on this limb"
        actor: Farrier
        preconditions:
          - "ServiceLine.status becomes PERFORMED"
        side_effects:
          - "LimbState.current_sku_code = the sku_code of ServiceLine.sku_id"
          - "LimbState.consecutive_reset_count = 0"
      - from: SHOD_WITH_PAD
        to: SHOD
        trigger: "POST /appointments/{id}/complete with a PERFORMED NEW_SHOES or CORRECTIVE ServiceLine with with_pad false on this limb"
        actor: Farrier
        preconditions:
          - "ServiceLine.status becomes PERFORMED"
        side_effects:
          - "LimbState.current_sku_code = the sku_code of ServiceLine.sku_id"
          - "LimbState.consecutive_reset_count = 0"
        note: "Pull-and-replace: NEW_SHOES on an already shod limb is legal and drops the pad."
      - from: GLUED
        to: SHOD
        trigger: "POST /appointments/{id}/complete with a PERFORMED NEW_SHOES or CORRECTIVE ServiceLine with with_pad false on this limb"
        actor: Farrier
        preconditions:
          - "ServiceLine.status becomes PERFORMED"
        side_effects:
          - "LimbState.current_sku_code = the sku_code of ServiceLine.sku_id"
          - "LimbState.consecutive_reset_count = 0"

  # ---- 5. Farrier.status (branching with two distinct exits + two re-entries)
  - entity: Farrier
    axis: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /farriers/{id}/deactivate with reason VOLUNTARY"
        actor: PlatformAdmin
        preconditions:
          - "Farrier.status == ACTIVE"
        side_effects:
          - "every Route of this farrier with status in {DRAFT, PLANNED} moves to CANCELLED"
          - "increments Farrier.version by 1"
      - from: ACTIVE
        to: DECERTIFIED
        trigger: "POST /farriers/{id}/deactivate with reason CERT_EXPIRED"
        actor: PlatformAdmin
        preconditions:
          - "Farrier.status == ACTIVE"
        side_effects:
          - "every Route of this farrier with status in {DRAFT, PLANNED} moves to CANCELLED"
          - "increments Farrier.version by 1"
      - from: INACTIVE
        to: ACTIVE
        trigger: "POST /farriers/{id}/reactivate"
        actor: PlatformAdmin
        preconditions:
          - "Farrier.status == INACTIVE"
        side_effects:
          - "increments Farrier.version by 1"
      - from: DECERTIFIED
        to: ACTIVE
        trigger: "POST /farriers/{id}/recertify"
        actor: PlatformAdmin
        preconditions:
          - "Farrier.status == DECERTIFIED"
          - "the supplied cert_expires_on is on or after the logical clock date"
        side_effects:
          - "Farrier.cert_expires_on = the supplied date"
          - "Farrier.certification_level = the supplied level"
          - "increments Farrier.version by 1"
        note: "DECERTIFIED cannot be cleared by reactivate — only recertify supplies a fresh expiry."

  # ---- 6. Route.status (branching with a system revert PLANNED -> DRAFT)
  - entity: Route
    axis: status
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PLANNED
        trigger: "POST /routes/{id}/plan"
        actor: Dispatcher
        preconditions:
          - "Route.status == DRAFT"
          - "Route.stop_count >= 1"
        side_effects:
          - "increments Route.version by 1"
      - from: PLANNED
        to: DRAFT
        trigger: "system: CASCADE-A hop 7 when the last attached appointment leaves the route"
        actor: system
        preconditions:
          - "Route.committed_units == 0"
          - "Route.status == PLANNED"
        side_effects:
          - "Route.status = DRAFT"
          - "increments Route.version by 1"
      - from: PLANNED
        to: DISPATCHED
        trigger: "POST /routes/{id}/dispatch"
        actor: Dispatcher
        preconditions:
          - "Route.status == PLANNED"
          - "Route.committed_units >= 1"
        side_effects:
          - "route becomes immutable to stop insert / reorder / attach / detach (gate 2)"
          - "increments Route.version by 1"
      - from: DISPATCHED
        to: CLOSED
        trigger: "POST /routes/{id}/close"
        actor: Dispatcher
        preconditions:
          - "Route.status == DISPATCHED"
          - "no RouteStop on this route has status in {PENDING, ARRIVED}"
        side_effects:
          - "increments Route.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /routes/{id}/cancel"
        actor: Dispatcher
        preconditions:
          - "Route.status == DRAFT"
        side_effects:
          - "every RouteStop with status PENDING moves to VOIDED"
          - "every attached Appointment is detached and moves to UNROUTED"
          - "every RESERVED ShoeReservation of those appointments moves to RELEASED"
          - "increments Route.version by 1"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /routes/{id}/cancel"
        actor: Dispatcher
        preconditions:
          - "Route.status == PLANNED"
        side_effects:
          - "every RouteStop with status PENDING moves to VOIDED"
          - "every attached Appointment is detached and moves to UNROUTED"
          - "every RESERVED ShoeReservation of those appointments moves to RELEASED"
          - "increments Route.version by 1"

  # ---- 7. RouteStop.status (branching)
  - entity: RouteStop
    axis: status
    initial_state: PENDING
    terminal_states: [COMPLETED, VOIDED]
    transitions:
      - from: PENDING
        to: ARRIVED
        trigger: "POST /route-stops/{id}/arrive"
        actor: Farrier
        preconditions:
          - "Route.status == DISPATCHED"
          - "every RouteStop on the same route with a lower sequence_index has status in {COMPLETED, VOIDED}"
        side_effects:
          - "increments RouteStop.version by 1"
      - from: ARRIVED
        to: COMPLETED
        trigger: "POST /route-stops/{id}/complete"
        actor: Farrier
        preconditions:
          - "RouteStop.status == ARRIVED"
          - "no attached Appointment has status in {SCHEDULED, CONFIRMED, IN_PROGRESS}"
        side_effects:
          - "RouteStop.trip_fee_cents pinned from the effective rate card for Route.route_date and Barn.zone"
          - "RouteStop.billable_horse_count recomputed"
          - "calculations.trip_fee_allocation runs; each billable appointment's Invoice gets its trip_fee_share_cents and a TRIP_FEE InvoiceLine, and each affected Invoice is recomputed"
          - "increments RouteStop.version by 1"
      - from: PENDING
        to: VOIDED
        trigger: "system: CASCADE-A hop 6, or POST /routes/{id}/cancel"
        actor: system
        preconditions:
          - "RouteStop.status == PENDING"
          - "no Appointment remains attached to this stop"
        side_effects:
          - "Route.committed_minutes -= RouteStop.travel_minutes"
          - "Route.stop_count -= 1"
          - "increments RouteStop.version by 1"

  # ---- 8. Appointment.status (parallel axis 1; loops through BLOCKED and UNROUTED)
  - entity: Appointment
    axis: status
    initial_state: UNROUTED
    terminal_states: [COMPLETED, CANCELLED_ADVANCE, CANCELLED_LATE, CANCELLED_ONSITE, NO_SHOW]
    transitions:
      - from: UNROUTED
        to: SCHEDULED
        trigger: "POST /route-stops/{id}/appointments"
        actor: Dispatcher
        preconditions:
          - "gate_precedence 1..5 all pass"
          - "Appointment.status == UNROUTED"
          - "RouteStop.barn_id == Horse.barn_id"
          - "Route capacity holds in BOTH meters"
          - "van stock covers calculations.shoe_pairs_required for every SKU on the appointment"
        side_effects:
          - "Appointment.route_stop_id = the stop"
          - "one ShoeReservation per distinct sku_id is created RESERVED; the van bucket's available_pairs decrease and reserved_pairs increase"
          - "Route.committed_units and Route.committed_minutes increase"
          - "RouteStop.service_minutes and RouteStop.end_minute increase"
          - "two Reminder rows are minted PENDING at REMINDER_OFFSET_DAYS_PRIMARY and REMINDER_OFFSET_DAYS_SECONDARY"
          - "Appointment.estimated_total_cents refreshed by the ESTIMATE variant of calculations.visit_price"
          - "increments Route.version by 1"
          - "increments Appointment.version by 1"
      - from: SCHEDULED
        to: UNROUTED
        trigger: "DELETE /route-stops/{id}/appointments/{appointment_id}"
        actor: Dispatcher
        preconditions:
          - "gate_precedence 1 and 2 pass"
          - "Appointment.status in {SCHEDULED, CONFIRMED}"
        side_effects:
          - "Appointment.route_stop_id = null"
          - "every RESERVED ShoeReservation of the appointment moves to RELEASED"
          - "Route.committed_units and Route.committed_minutes decrease by exactly the amounts the attach added"
          - "increments Route.version by 1"
      - from: CONFIRMED
        to: UNROUTED
        trigger: "DELETE /route-stops/{id}/appointments/{appointment_id}"
        actor: Dispatcher
        preconditions:
          - "gate_precedence 1 and 2 pass"
        side_effects:
          - "same as the SCHEDULED detach leg"
      - from: SCHEDULED
        to: CONFIRMED
        trigger: "POST /reminders/{id}/acknowledge"
        actor: ClientUser
        preconditions:
          - "Reminder.status == SENT"
          - "Appointment.status == SCHEDULED"
        side_effects:
          - "Reminder.status = ACKNOWLEDGED"
          - "Appointment.status = CONFIRMED"
          - "increments Appointment.version by 1"
        note: "Cross-entity side effect: acknowledging a Reminder mutates its Appointment."
      - from: SCHEDULED
        to: BLOCKED
        trigger: "system: CASCADE-A hop 3 from a qualifying LamenessCase"
        actor: system
        preconditions:
          - "Horse.hold_status became HOLD"
        side_effects:
          - "Appointment.route_stop_id = null"
          - "every RESERVED ShoeReservation moves to RELEASED"
          - "Route totals decrease"
          - "increments Appointment.version by 1"
      - from: CONFIRMED
        to: BLOCKED
        trigger: "system: CASCADE-A hop 3 from a qualifying LamenessCase"
        actor: system
        preconditions:
          - "Horse.hold_status became HOLD"
        side_effects:
          - "same as the SCHEDULED leg"
      - from: BLOCKED
        to: UNROUTED
        trigger: "system: POST /lameness-cases/{id}/resolve clears the horse hold"
        actor: system
        preconditions:
          - "Horse.hold_status became CLEAR"
        side_effects:
          - "Appointment.status = UNROUTED"
          - "increments Appointment.version by 1"
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /appointments/{id}/start"
        actor: Farrier
        preconditions:
          - "gate_precedence 1..5 all pass"
          - "RouteStop.status == ARRIVED"
        side_effects:
          - "increments Appointment.version by 1"
      - from: CONFIRMED
        to: IN_PROGRESS
        trigger: "POST /appointments/{id}/start"
        actor: Farrier
        preconditions:
          - "gate_precedence 1..5 all pass"
          - "RouteStop.status == ARRIVED"
        side_effects:
          - "increments Appointment.version by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /appointments/{id}/complete"
        actor: Farrier
        preconditions:
          - "Appointment.status == IN_PROGRESS"
          - "every id in performed_service_line_ids belongs to this appointment and is PLANNED"
        side_effects:
          - "listed ServiceLine rows move to PERFORMED, the rest move to OMITTED"
          - "each PERFORMED line drives its LimbState transition"
          - "every RESERVED ShoeReservation moves to COMMITTED; the van bucket's on_hand_pairs and reserved_pairs both decrease"
          - "CASCADE-B hop 3: the bucket's replenishment_flag is recomputed"
          - "Appointment.completed_on = the logical clock date; Appointment.rate_card_id pinned by service date"
          - "an Invoice is minted DRAFT with its lines; Appointment.billing_status = INVOICED"
          - "Client.completed_visit_count += 1"
          - "Horse.last_completed_on updated and Horse.next_due_on recomputed by calculations.next_due_on"
          - "CASCADE-C: a successor Appointment is auto-minted by calculations.snap_forward_scheduled_date, and two Reminder rows are minted for it"
          - "increments Appointment.version by 1"
      - from: SCHEDULED
        to: CANCELLED_ADVANCE
        trigger: "POST /appointments/{id}/cancel"
        actor: ClientUser
        preconditions:
          - "calculations.cancellation_tier resolves to ADVANCE"
        side_effects:
          - "Appointment.cancellation_fee_cents = 0"
          - "detach from the stop, release reservations, decrease route totals"
          - "all PENDING and SENT Reminder rows for the appointment move to FAILED"
          - "increments Appointment.version by 1"
      - from: CONFIRMED
        to: CANCELLED_ADVANCE
        trigger: "POST /appointments/{id}/cancel"
        actor: ClientUser
        preconditions:
          - "calculations.cancellation_tier resolves to ADVANCE"
        side_effects:
          - "same as the SCHEDULED leg"
      - from: UNROUTED
        to: CANCELLED_ADVANCE
        trigger: "POST /appointments/{id}/cancel"
        actor: ClientUser
        preconditions:
          - "calculations.cancellation_tier resolves to ADVANCE"
        side_effects:
          - "Appointment.cancellation_fee_cents = 0; no invoice is minted"
          - "increments Appointment.version by 1"
      - from: SCHEDULED
        to: CANCELLED_LATE
        trigger: "POST /appointments/{id}/cancel"
        actor: ClientUser
        preconditions:
          - "calculations.cancellation_tier resolves to LATE"
        side_effects:
          - "Appointment.cancellation_fee_cents = LATE_CANCEL_FEE_CENTS"
          - "detach from the stop, release reservations, decrease route totals"
          - "an Invoice is minted DRAFT carrying only the CANCELLATION_FEE line; Appointment.billing_status = INVOICED"
          - "increments Appointment.version by 1"
      - from: CONFIRMED
        to: CANCELLED_LATE
        trigger: "POST /appointments/{id}/cancel"
        actor: ClientUser
        preconditions:
          - "calculations.cancellation_tier resolves to LATE"
        side_effects:
          - "same as the SCHEDULED leg"
      - from: SCHEDULED
        to: CANCELLED_ONSITE
        trigger: "POST /appointments/{id}/cancel"
        actor: ClientUser
        preconditions:
          - "calculations.cancellation_tier resolves to ONSITE"
          - "RouteStop.status == ARRIVED"
        side_effects:
          - "Appointment.cancellation_fee_cents = ONSITE_CANCEL_FEE_CENTS"
          - "the appointment STAYS attached to the stop so it still bears a trip-fee share"
          - "every RESERVED ShoeReservation moves to RELEASED"
          - "an Invoice is minted DRAFT with the CANCELLATION_FEE line; the TRIP_FEE line is added when the stop completes"
          - "increments Appointment.version by 1"
      - from: CONFIRMED
        to: CANCELLED_ONSITE
        trigger: "POST /appointments/{id}/cancel"
        actor: ClientUser
        preconditions:
          - "calculations.cancellation_tier resolves to ONSITE"
          - "RouteStop.status == ARRIVED"
        side_effects:
          - "same as the SCHEDULED leg"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /appointments/{id}/no-show"
        actor: Farrier
        preconditions:
          - "RouteStop.status == ARRIVED"
          - "Appointment.status in {SCHEDULED, CONFIRMED}"
        side_effects:
          - "Appointment.cancellation_fee_cents = NO_SHOW_FEE_CENTS"
          - "the appointment stays attached so it bears a trip-fee share"
          - "every RESERVED ShoeReservation moves to RELEASED"
          - "an Invoice is minted DRAFT with the NO_SHOW_FEE line"
          - "Client.no_show_count_rolling recomputed and Client.billing_standing re-derived"
          - "increments Appointment.version by 1"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /appointments/{id}/no-show"
        actor: Farrier
        preconditions:
          - "RouteStop.status == ARRIVED"
        side_effects:
          - "same as the SCHEDULED leg"

  # ---- 9. Appointment.billing_status (parallel axis 2 on the same row)
  - entity: Appointment
    axis: billing_status
    initial_state: UNBILLED
    terminal_states: [SETTLED, VOIDED]
    transitions:
      - from: UNBILLED
        to: INVOICED
        trigger: "system: an Invoice is minted on complete / late-cancel / onsite-cancel / no-show"
        actor: system
        preconditions:
          - "no Invoice exists yet for this appointment"
        side_effects:
          - "Invoice created in DRAFT"
          - "increments Appointment.version by 1"
      - from: INVOICED
        to: SETTLED
        trigger: "system: the appointment's Invoice reaches PAID inside POST /clients/{id}/payments"
        actor: system
        preconditions:
          - "Invoice.balance_cents == 0"
        side_effects:
          - "Appointment.billing_status = SETTLED"
          - "increments Appointment.version by 1"
      - from: INVOICED
        to: VOIDED
        trigger: "POST /invoices/{id}/void"
        actor: BillingClerk
        preconditions:
          - "Invoice.status in {DRAFT, ISSUED}"
        side_effects:
          - "Appointment.billing_status = VOIDED"
          - "increments Appointment.version by 1"

  # ---- 10. ServiceLine.status (branching)
  - entity: ServiceLine
    axis: status
    initial_state: PLANNED
    terminal_states: [PERFORMED, OMITTED, REMOVED]
    transitions:
      - from: PLANNED
        to: PERFORMED
        trigger: "POST /appointments/{id}/complete listing this line in performed_service_line_ids"
        actor: Farrier
        preconditions:
          - "ServiceLine.status == PLANNED"
        side_effects:
          - "ServiceLine.labor_cents computed by calculations.service_line_labor_amount"
          - "LimbState transition applied"
      - from: PLANNED
        to: OMITTED
        trigger: "POST /appointments/{id}/complete NOT listing this line"
        actor: Farrier
        preconditions:
          - "ServiceLine.status == PLANNED"
        side_effects:
          - "ServiceLine.labor_cents = 0"
          - "no LimbState transition"
      - from: PLANNED
        to: REMOVED
        trigger: "DELETE /service-lines/{id}"
        actor: Dispatcher
        preconditions:
          - "gate_precedence 5 passes with eligible set {UNROUTED, SCHEDULED, CONFIRMED}"
        side_effects:
          - "Appointment.service_units and Appointment.service_minutes recomputed"
          - "if attached, Route totals and RouteStop.service_minutes recomputed"
          - "ShoeReservation pairs recomputed for the affected sku; surplus pairs return to the bucket"
          - "increments Appointment.version by 1"

  # ---- 11. LamenessCase.status (cyclic through reopen)
  - entity: LamenessCase
    axis: status
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: PRESCRIBED
        trigger: "POST /vet-prescriptions/{id}/activate"
        actor: Veterinarian
        preconditions:
          - "VetPrescription.lameness_case_id == LamenessCase.id"
        side_effects:
          - "LamenessCase.status = PRESCRIBED"
          - "increments LamenessCase.version by 1"
      - from: OPEN
        to: RESOLVED
        trigger: "POST /lameness-cases/{id}/resolve"
        actor: Veterinarian
        preconditions:
          - "LamenessCase.status == OPEN"
        side_effects:
          - "Horse.hold_status recomputed"
          - "increments LamenessCase.version by 1"
      - from: PRESCRIBED
        to: RESOLVED
        trigger: "POST /lameness-cases/{id}/resolve"
        actor: Veterinarian
        preconditions:
          - "LamenessCase.status == PRESCRIBED"
        side_effects:
          - "every ACTIVE VetPrescription of this case moves to REVOKED"
          - "Horse.active_prescription_id = null and Horse.hold_status recomputed"
          - "increments LamenessCase.version by 1"
      - from: RESOLVED
        to: OPEN
        trigger: "POST /lameness-cases/{id}/reopen"
        actor: Veterinarian
        preconditions:
          - "LamenessCase.status == RESOLVED"
        side_effects:
          - "Horse.hold_status recomputed"
          - "increments LamenessCase.version by 1"

  # ---- 12. VetPrescription.status (branching, one system exit)
  - entity: VetPrescription
    axis: status
    initial_state: DRAFT
    terminal_states: [EXPIRED, REVOKED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /vet-prescriptions/{id}/activate"
        actor: Veterinarian
        preconditions:
          - "VetPrescription.status == DRAFT"
          - "VetPrescription.expires_on >= the logical clock date"
        side_effects:
          - "any other ACTIVE VetPrescription of the same lameness_case_id moves to SUPERSEDED"
          - "Horse.active_prescription_id = this prescription"
          - "Horse.next_due_on recomputed with the THERAPEUTIC variant when Horse.last_completed_on is set"
          - "LamenessCase.status = PRESCRIBED"
          - "increments VetPrescription.version by 1"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /vet-prescriptions/{id}/activate on a sibling prescription of the same case"
        actor: Veterinarian
        preconditions:
          - "VetPrescription.status == ACTIVE"
        side_effects:
          - "increments VetPrescription.version by 1"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /vet-prescriptions/{id}/revoke"
        actor: Veterinarian
        preconditions:
          - "VetPrescription.status == ACTIVE"
        side_effects:
          - "Horse.active_prescription_id = null"
          - "Horse.next_due_on recomputed with the ROUTINE variant"
          - "increments VetPrescription.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc advancing past expires_on"
        actor: system
        preconditions:
          - "VetPrescription.expires_on < the new logical clock date"
        side_effects:
          - "CASCADE-D hop 3: Horse.active_prescription_id = null and Horse.next_due_on reverts to the ROUTINE variant"
          - "CASCADE-D hop 4: every PLANNED CORRECTIVE ServiceLine on a non-terminal Appointment of that horse moves to REMOVED"
          - "CASCADE-D hop 5: the affected Appointment service_units / service_minutes and its Route totals are recomputed"
          - "increments VetPrescription.version by 1"

  # ---- 13. StockTransfer.status (branching; IN_TRANSIT is the third bucket)
  - entity: StockTransfer
    axis: status
    initial_state: REQUESTED
    terminal_states: [RECEIVED, CANCELLED, ABORTED]
    transitions:
      - from: REQUESTED
        to: IN_TRANSIT
        trigger: "POST /stock-transfers/{id}/dispatch"
        actor: PlatformAdmin
        preconditions:
          - "StockTransfer.status == REQUESTED"
          - "the SHOP bucket has available_pairs >= quantity_pairs"
        side_effects:
          - "SHOP bucket on_hand_pairs -= quantity_pairs and available_pairs -= quantity_pairs"
          - "increments StockTransfer.version by 1"
      - from: IN_TRANSIT
        to: RECEIVED
        trigger: "POST /stock-transfers/{id}/receive"
        actor: Farrier
        preconditions:
          - "StockTransfer.status == IN_TRANSIT"
        side_effects:
          - "VAN bucket on_hand_pairs += quantity_pairs and available_pairs += quantity_pairs"
          - "VAN bucket replenishment_flag recomputed"
          - "increments StockTransfer.version by 1"
      - from: IN_TRANSIT
        to: ABORTED
        trigger: "POST /stock-transfers/{id}/abort"
        actor: PlatformAdmin
        preconditions:
          - "StockTransfer.status == IN_TRANSIT"
        side_effects:
          - "SHOP bucket on_hand_pairs += quantity_pairs and available_pairs += quantity_pairs"
          - "increments StockTransfer.version by 1"
      - from: REQUESTED
        to: CANCELLED
        trigger: "system: CASCADE-A hop 6 when the destination bucket's replenishment_flag clears"
        actor: system
        preconditions:
          - "StockTransfer.status == REQUESTED"
          - "the destination bucket's replenishment_flag flipped true -> false in this request"
        side_effects:
          - "no stock moves"
          - "increments StockTransfer.version by 1"

  # ---- 14. ShoeReservation.status (cyclic: RELEASED can be re-RESERVED)
  - entity: ShoeReservation
    axis: status
    initial_state: RESERVED
    terminal_states: [COMMITTED]
    transitions:
      - from: RESERVED
        to: COMMITTED
        trigger: "POST /appointments/{id}/complete"
        actor: Farrier
        preconditions:
          - "ShoeReservation.status == RESERVED"
        side_effects:
          - "bucket.on_hand_pairs -= pairs and bucket.reserved_pairs -= pairs; available_pairs unchanged"
      - from: RESERVED
        to: RELEASED
        trigger: "detach, cancel, no-show, route cancel, or CASCADE-A hop 4"
        actor: system
        preconditions:
          - "ShoeReservation.status == RESERVED"
        side_effects:
          - "bucket.available_pairs += pairs and bucket.reserved_pairs -= pairs; on_hand_pairs unchanged"
          - "bucket.replenishment_flag recomputed"
      - from: RELEASED
        to: RESERVED
        trigger: "POST /route-stops/{id}/appointments re-attaching the same appointment"
        actor: Dispatcher
        preconditions:
          - "ShoeReservation.status == RELEASED"
          - "the van bucket of the new route's farrier has available_pairs >= pairs"
        side_effects:
          - "ShoeReservation.bucket_id updated to the new farrier's van bucket"
          - "bucket.available_pairs -= pairs and bucket.reserved_pairs += pairs"

  # ---- 15. RateCard.status (supersession chain)
  - entity: RateCard
    axis: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /rate-cards/{id}/activate"
        actor: PlatformAdmin
        preconditions:
          - "RateCard.status == DRAFT"
          - "if supersedes_rate_card_id is not null, that card has status ACTIVE"
        side_effects:
          - "the superseded card moves to SUPERSEDED"
          - "increments RateCard.version by 1"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /rate-cards/{id}/activate on the successor card"
        actor: PlatformAdmin
        preconditions:
          - "RateCard.status == ACTIVE"
        side_effects:
          - "increments RateCard.version by 1"
        note: "SUPERSEDED cards remain eligible for pricing service dates inside their own window."

  # ---- 16. Invoice.status (branching)
  - entity: Invoice
    axis: status
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /invoices/{id}/issue"
        actor: BillingClerk
        preconditions:
          - "Invoice.status == DRAFT"
          - "the appointment's RouteStop, if any, has status COMPLETED or the appointment is UNROUTED"
        side_effects:
          - "Invoice.issued_on = the logical clock date"
          - "increments Invoice.version by 1"
      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "POST /clients/{id}/payments"
        actor: BillingClerk
        preconditions:
          - "0 < applied amount < Invoice.balance_cents"
        side_effects:
          - "Invoice.paid_cents += applied; Invoice.balance_cents recomputed"
          - "increments Invoice.version by 1"
      - from: ISSUED
        to: PAID
        trigger: "POST /clients/{id}/payments"
        actor: BillingClerk
        preconditions:
          - "applied amount == Invoice.balance_cents"
        side_effects:
          - "Invoice.balance_cents = 0; Appointment.billing_status = SETTLED"
          - "increments Invoice.version by 1"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /clients/{id}/payments"
        actor: BillingClerk
        preconditions:
          - "applied amount == Invoice.balance_cents"
        side_effects:
          - "Invoice.balance_cents = 0; Appointment.billing_status = SETTLED"
          - "increments Invoice.version by 1"
      - from: DRAFT
        to: VOID
        trigger: "POST /invoices/{id}/void"
        actor: BillingClerk
        preconditions:
          - "Invoice.status == DRAFT"
        side_effects:
          - "Appointment.billing_status = VOIDED"
          - "increments Invoice.version by 1"
      - from: ISSUED
        to: VOID
        trigger: "POST /invoices/{id}/void"
        actor: BillingClerk
        preconditions:
          - "Invoice.status == ISSUED"
          - "Invoice.paid_cents == 0"
        side_effects:
          - "Appointment.billing_status = VOIDED"
          - "increments Invoice.version by 1"

  # ---- 17. Reminder.status (cyclic through FAILED retry)
  - entity: Reminder
    axis: status
    initial_state: PENDING
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: PENDING
        to: SENT
        trigger: "POST /reminders/{id}/send with delivery_outcome DELIVERED"
        actor: Dispatcher
        preconditions:
          - "Appointment.status in {SCHEDULED, CONFIRMED}"
          - "no sibling Reminder of the same appointment has status in {SENT, ACKNOWLEDGED} with sent_on within REMINDER_SUPPRESSION_WINDOW_DAYS of the logical clock date"
        side_effects:
          - "Reminder.sent_on = the logical clock date"
      - from: PENDING
        to: FAILED
        trigger: "POST /reminders/{id}/send with delivery_outcome FAILED"
        actor: Dispatcher
        preconditions:
          - "Appointment.status in {SCHEDULED, CONFIRMED}"
        side_effects:
          - "Reminder.sent_on stays null"
      - from: FAILED
        to: SENT
        trigger: "POST /reminders/{id}/send with delivery_outcome DELIVERED (retry)"
        actor: Dispatcher
        preconditions:
          - "Appointment.status in {SCHEDULED, CONFIRMED}"
          - "the suppression precondition above holds"
        side_effects:
          - "Reminder.sent_on = the logical clock date"
      - from: SENT
        to: ACKNOWLEDGED
        trigger: "POST /reminders/{id}/acknowledge"
        actor: ClientUser
        preconditions:
          - "Reminder.status == SENT"
        side_effects:
          - "Appointment moves SCHEDULED -> CONFIRMED when it is SCHEDULED"
      - from: SENT
        to: FAILED
        trigger: "POST /appointments/{id}/cancel with tier ADVANCE"
        actor: system
        preconditions:
          - "the appointment left the SCHEDULED / CONFIRMED set"
        side_effects:
          - "no further sends are possible because the appointment status precondition now fails"

  # ---- 18. InventoryBucket.replenishment_flag (cyclic boolean axis)
  - entity: InventoryBucket
    axis: replenishment_flag
    initial_state: REPLENISHMENT_FLAGGED
    terminal_states: []
    transitions:
      - from: REPLENISHMENT_CLEAR
        to: REPLENISHMENT_FLAGGED
        trigger: "any write that lowers available_pairs (attach reserve, POST /inventory-buckets/{id}/adjust, transfer dispatch out of SHOP)"
        actor: system
        preconditions:
          - "InventoryBucket.available_pairs <= REORDER_POINT_PAIRS"
        side_effects:
          - "InventoryBucket.replenishment_flag = true"
      - from: REPLENISHMENT_FLAGGED
        to: REPLENISHMENT_CLEAR
        trigger: "any write that raises available_pairs (reservation release, transfer receive, positive adjust)"
        actor: system
        preconditions:
          - "InventoryBucket.available_pairs > REORDER_POINT_PAIRS"
        side_effects:
          - "InventoryBucket.replenishment_flag = false"
          - "CASCADE-A hop 6: every StockTransfer with status REQUESTED whose to_bucket_id is this bucket moves to CANCELLED"

# ---------------------------------------------------------------------------
# §1.2.0 Ordered write gates. Gates are evaluated in this order and the FIRST
# failing gate decides the error. They sit between the OCC check and every
# domain business rule in the §1.4 ladder (priorities 30-34).
# ---------------------------------------------------------------------------
gate_precedence:
  - order: 1
    gate_id: GATE_FARRIER_ACTIVE
    condition: "The Farrier that owns the Route in scope has status ACTIVE and cert_expires_on >= the logical clock date."
    error_if_status_not_active: ERR_FARRIER_INACTIVE
    error_if_cert_lapsed: ERR_FARRIER_CERT_EXPIRED
    guards:
      - "POST /routes"
      - "POST /routes/{id}/plan"
      - "POST /routes/{id}/dispatch"
      - "POST /routes/{id}/stops"
      - "POST /route-stops/{id}/reorder"
      - "POST /route-stops/{id}/appointments"
      - "DELETE /route-stops/{id}/appointments/{appointment_id}"
      - "POST /route-stops/{id}/arrive"
      - "POST /route-stops/{id}/complete"
      - "POST /appointments/{id}/start"
      - "POST /appointments/{id}/complete"
      - "POST /appointments/{id}/no-show"
    note: "Checked first because an inactive or lapsed farrier may perform no route work at all, whatever the route or client state."
  - order: 2
    gate_id: GATE_ROUTE_OPEN
    condition: "Route.status is DRAFT or PLANNED."
    error: ERR_ROUTE_NOT_OPEN
    guards:
      - "POST /routes/{id}/stops"
      - "POST /route-stops/{id}/reorder"
      - "POST /route-stops/{id}/appointments"
      - "DELETE /route-stops/{id}/appointments/{appointment_id}"
    note: "Insert / reorder / attach / detach are refused once the route is DISPATCHED, CLOSED or CANCELLED. Sits AFTER the farrier gate so a decertified farrier's dispatched route still reports ERR_FARRIER_INACTIVE / ERR_FARRIER_CERT_EXPIRED."
  - order: 3
    gate_id: GATE_CLIENT_STANDING
    condition: "The Client that owns the horse in scope has billing_standing ACTIVE, or has billing_standing PREPAY_REQUIRED together with deposit_balance_cents >= PREPAY_DEPOSIT_MIN_CENTS."
    error: ERR_CLIENT_PREPAY_REQUIRED
    guards:
      - "POST /appointments"
      - "POST /route-stops/{id}/appointments"
      - "POST /appointments/{id}/warranty-revisit"
    note: "SUSPENDED never passes, whatever the deposit."
  - order: 4
    gate_id: GATE_HORSE_HOLD
    condition: "Horse.hold_status is CLEAR, OR every ServiceLine already on the appointment has service_type CORRECTIVE with a live prescription covering its limb."
    error: ERR_HORSE_ON_HOLD
    guards:
      - "POST /appointments"
      - "POST /route-stops/{id}/appointments"
      - "POST /appointments/{id}/service-lines"
      - "POST /appointments/{id}/start"
    note: "A horse on lameness HOLD may still receive corrective work under a live prescription; routine trims are refused."
  - order: 5
    gate_id: GATE_APPOINTMENT_ELIGIBLE
    condition: "Appointment.status is inside the eligible set declared by the endpoint."
    error: ERR_APPOINTMENT_NOT_ELIGIBLE
    guards:
      - "POST /appointments/{id}/service-lines"
      - "DELETE /service-lines/{id}"
      - "POST /route-stops/{id}/appointments"
      - "DELETE /route-stops/{id}/appointments/{appointment_id}"
      - "POST /appointments/{id}/start"
      - "POST /appointments/{id}/complete"
      - "POST /appointments/{id}/cancel"
      - "POST /appointments/{id}/no-show"
      - "POST /appointments/{id}/warranty-revisit"
      - "POST /reminders/{id}/send"
      - "POST /reminders/{id}/acknowledge"
    note: "Last of the five, so a BLOCKED appointment on a DISPATCHED route reports ERR_ROUTE_NOT_OPEN, not ERR_APPOINTMENT_NOT_ELIGIBLE."

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules — OCC on the parent's `version`, four true races.
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: attach-appointment-stale-route
    parent_entity: Route
    write_endpoint: "POST /route-stops/{id}/appointments"
    occ_field: "expected_route_version"
    description: |
      Attaching an appointment to a stop of a Route whose version has advanced
      since the dispatcher last read it is rejected. Both attaches are
      individually legitimate — the route has capacity for either horse — so
      the loser cannot be caught by any state precondition; only the stale
      version reveals that the capacity picture the caller reasoned about is
      out of date.
    error_id: ERR_STALE_ROUTE_VERSION
    http_status: 412
  - rule_id: add-service-line-stale-appointment
    parent_entity: Appointment
    write_endpoint: "POST /appointments/{id}/service-lines"
    occ_field: "expected_appointment_version"
    description: |
      Adding a per-limb service line to an Appointment whose version has moved
      on is rejected. Adding a second line for a different limb is legitimate
      on its own, so the appointment's status precondition cannot separate the
      two writers; the stale version does.
    error_id: ERR_STALE_APPOINTMENT_VERSION
    http_status: 412
  - rule_id: activate-prescription-stale-case
    parent_entity: LamenessCase
    write_endpoint: "POST /vet-prescriptions/{id}/activate"
    occ_field: "expected_lameness_case_version"
    description: |
      Activating a prescription legitimately supersedes any prescription
      already ACTIVE on the same LamenessCase, so a second activation is a
      valid product operation rather than an invalid-state error. The
      expected_lameness_case_version check rejects an activation raised
      against a case whose prescription picture the vet has not re-read.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
  - rule_id: apply-payment-stale-client
    parent_entity: Client
    write_endpoint: "POST /clients/{id}/payments"
    occ_field: "expected_client_version"
    description: |
      A payment is applied by a waterfall over the client's outstanding
      invoices. A second payment is a perfectly valid operation, so no state
      precondition rejects it; the expected_client_version check rejects a
      payment raised from a stale view of the client's outstanding balance.
    error_id: ERR_STALE_CLIENT_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# Named cascades (each hop caused by the previous hop, not by the trigger).
# ---------------------------------------------------------------------------
cascades:
  - cascade_id: CASCADE-A
    depth: 6
    trigger: "POST /lameness-cases with severity >= LAMENESS_HOLD_SEVERITY_THRESHOLD"
    chain:
      - "hop 1 — LamenessCase is created OPEN with hold_applied true"
      - "hop 2 — because hold_applied is true, Horse.hold_status becomes HOLD"
      - "hop 3 — because the horse went on HOLD, every Appointment of that horse in {SCHEDULED, CONFIRMED} becomes BLOCKED and is detached from its RouteStop"
      - "hop 4 — because those appointments were detached, each of their RESERVED ShoeReservation rows becomes RELEASED"
      - "hop 5 — because a reservation was released, its InventoryBucket gains available_pairs and loses reserved_pairs, and replenishment_flag is recomputed"
      - "hop 6 — because the bucket's replenishment_flag flipped true -> false, every StockTransfer still REQUESTED into that bucket becomes CANCELLED"
    parallel_branch:
      - "hop 3b — the emptied RouteStop becomes VOIDED"
      - "hop 4b — because the stop was voided, Route.committed_minutes and Route.stop_count drop, and a PLANNED route with committed_units 0 reverts to DRAFT"
  - cascade_id: CASCADE-B
    depth: 3
    trigger: "POST /appointments/{id}/complete"
    chain:
      - "hop 1 — Appointment becomes COMPLETED"
      - "hop 2 — because the visit completed, every RESERVED ShoeReservation becomes COMMITTED and the van bucket's on_hand_pairs and reserved_pairs both fall"
      - "hop 3 — because on_hand_pairs and available_pairs moved, the bucket's replenishment_flag is recomputed and may flip to true"
  - cascade_id: CASCADE-C
    depth: 4
    trigger: "POST /appointments/{id}/complete"
    chain:
      - "hop 1 — Horse.last_completed_on is set and Horse.next_due_on is recomputed by calculations.next_due_on"
      - "hop 2 — because next_due_on moved, a successor Appointment is minted at calculations.snap_forward_scheduled_date"
      - "hop 3 — because a successor appointment now exists, two Reminder rows are minted PENDING against it"
      - "hop 4 — because the successor appointment exists, the previous Appointment.rate_card_id is pinned and its Invoice is minted DRAFT with lines"
  - cascade_id: CASCADE-D
    depth: 5
    trigger: "POST /_clock/set_current_utc advancing past an ACTIVE prescription's expires_on"
    chain:
      - "hop 1 — the clock advances"
      - "hop 2 — because the new date is past expires_on, the VetPrescription becomes EXPIRED"
      - "hop 3 — because the prescription expired, Horse.active_prescription_id becomes null and Horse.next_due_on reverts to the ROUTINE variant"
      - "hop 4 — because no live prescription remains, every PLANNED CORRECTIVE ServiceLine on a non-terminal Appointment of that horse becomes REMOVED"
      - "hop 5 — because service lines were removed, the Appointment's service_units / service_minutes and its Route's committed totals are recomputed"

# ---------------------------------------------------------------------------
# Conservation invariants — each must hold after every request.
# ---------------------------------------------------------------------------
conservation_invariants:
  - invariant_id: INV_TRIP_FEE_SPLIT
    conserved_quantity: "cents of a stop's trip fee"
    formula: "SUM(Invoice.trip_fee_share_cents for invoices of appointments attached to stop S and status in {COMPLETED, NO_SHOW, CANCELLED_ONSITE}) == RouteStop.trip_fee_cents for S, whenever S.status == COMPLETED and S.billable_horse_count > 0"
    compensating_pair: "trip_fee_allocation on stop completion vs re-allocation after an appointment leaves the billable set"
  - invariant_id: INV_BUCKET_BALANCE
    conserved_quantity: "pairs inside one inventory bucket"
    formula: "InventoryBucket.on_hand_pairs == InventoryBucket.available_pairs + InventoryBucket.reserved_pairs, for every bucket, after every request"
    compensating_pair: "reserve on attach vs release on detach"
  - invariant_id: INV_SYSTEM_PAIRS
    conserved_quantity: "pairs in the whole system"
    formula: "SUM(InventoryBucket.on_hand_pairs over all buckets for one sku) + SUM(StockTransfer.quantity_pairs for that sku with status IN_TRANSIT) is unchanged by transfer dispatch, receive and abort"
    compensating_pair: "dispatch vs abort"
  - invariant_id: INV_RESERVE_RELEASE_ROUNDTRIP
    conserved_quantity: "pairs available in a van bucket"
    formula: "attach then detach of the same appointment leaves InventoryBucket.available_pairs and reserved_pairs at exactly their pre-attach values"
    compensating_pair: "POST /route-stops/{id}/appointments vs DELETE /route-stops/{id}/appointments/{appointment_id}"
  - invariant_id: INV_ROUTE_CAPACITY_ROUNDTRIP
    conserved_quantity: "shoeing units and minutes committed on a route"
    formula: "attach then detach of the same appointment leaves Route.committed_units and Route.committed_minutes at exactly their pre-attach values"
    compensating_pair: "attach vs detach"
  - invariant_id: INV_LOYALTY_SPLIT
    conserved_quantity: "cents of a loyalty discount"
    formula: "Invoice.loyalty_discount_labor_cents + Invoice.loyalty_discount_product_cents == Invoice.loyalty_discount_cents"
    compensating_pair: "allocation across the labor and product legs"
  - invariant_id: INV_INVOICE_TOTAL
    conserved_quantity: "cents on one invoice"
    formula: "Invoice.total_cents == Invoice.labor_net_cents + Invoice.taxable_product_base_cents + Invoice.trip_fee_share_cents + Invoice.fee_cents + Invoice.tax_cents AND Invoice.balance_cents == Invoice.total_cents - Invoice.paid_cents"
    compensating_pair: "payment application vs invoice void"

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table — 27 rules, 7 of them dual-variant.
# ---------------------------------------------------------------------------
calculations:

  - name: service_line_labor_amount
    trigger: "ServiceLine moves PLANNED -> PERFORMED inside POST /appointments/{id}/complete; also recomputed for the ESTIMATE variant of visit_price on every service-line add or delete"
    algorithm: tiered_pricing
    formula: |
      base = rate_card[ constant_mappings.service_type_to_rate_card_price_field[line.service_type] ]
      if horse.requires_sedation:
          surcharge = round_half_up(base * SEDATION_LABOR_SURCHARGE_BP / BASIS_POINT_DENOMINATOR)
      else:
          surcharge = 0
      labor_cents = base + surcharge
    input_set: "One ServiceLine row. rate_card is the card chosen by calculations.effective_rate_card_selection for the SERVICE date."
    constants:
      SEDATION_LABOR_SURCHARGE_BP: 1250
      BASIS_POINT_DENOMINATOR: 10000
    precision: "integer cents; round_half_up applied to the surcharge of EACH line separately, before any summation"
    variants:
      - name: ROUTINE
        when: "Appointment.visit_kind == ROUTINE"
        difference: "labor_cents is base + surcharge as above"
      - name: WARRANTY_REVISIT
        when: "Appointment.visit_kind == WARRANTY_REVISIT"
        difference: "labor_cents is forced to 0 for every line on the visit; product lines are still charged in full"

  - name: appointment_service_units
    trigger: "any change to the appointment's ServiceLine set; read by the route capacity check"
    algorithm: aggregation
    formula: |
      service_units = SUM( constant_mappings.service_type_to_units[line.service_type]
                           for line in appointment.service_lines
                           if line.status in {PLANNED, PERFORMED} )
    input_set: "ServiceLine rows of one appointment with status in {PLANNED, PERFORMED}; REMOVED and OMITTED rows are excluded."
    constants:
      SERVICE_UNITS_TRIM: 1
      SERVICE_UNITS_RESET: 2
      SERVICE_UNITS_NEW_SHOES: 3
      SERVICE_UNITS_CORRECTIVE: 5
      SERVICE_UNITS_GLUE_ON: 4
    precision: "integer"

  - name: appointment_service_minutes
    trigger: "any change to the appointment's ServiceLine set; read by the route capacity check and by RouteStop.end_minute"
    algorithm: aggregation
    formula: |
      limb_minutes = SUM( constant_mappings.service_type_to_minutes[line.service_type]
                          for line in appointment.service_lines
                          if line.status in {PLANNED, PERFORMED} )
      # STANDARD variant
      service_minutes = limb_minutes + HORSE_HANDLING_MINUTES
      # SEDATED variant
      service_minutes = limb_minutes
                        + round_half_up(HORSE_HANDLING_MINUTES * SEDATION_HANDLING_MULTIPLIER_BP / BASIS_POINT_DENOMINATOR)
                        + SEDATION_EXTRA_MINUTES
    input_set: "ServiceLine rows of one appointment with status in {PLANNED, PERFORMED}."
    constants:
      HORSE_HANDLING_MINUTES: 6
      SEDATION_EXTRA_MINUTES: 15
      SEDATION_HANDLING_MULTIPLIER_BP: 15000
      BASIS_POINT_DENOMINATOR: 10000
    precision: "integer minutes; round_half_up on the handling term"
    variants:
      - name: STANDARD
        when: "Horse.requires_sedation == false"
        difference: "handling is flat HORSE_HANDLING_MINUTES (6) and no sedation block is added"
      - name: SEDATED
        when: "Horse.requires_sedation == true"
        difference: "handling is multiplied by SEDATION_HANDLING_MULTIPLIER_BP (6 -> 9) and SEDATION_EXTRA_MINUTES (15) is added on top, i.e. +18 minutes versus STANDARD"

  - name: stop_travel_minutes
    trigger: "RouteStop creation"
    algorithm: aggregation
    formula: "travel_minutes = constant_mappings.barn_zone_to_travel_minutes[barn.zone]"
    input_set: "The Barn of the stop."
    constants:
      STOP_TRAVEL_MINUTES_ZONE_A: 15
      STOP_TRAVEL_MINUTES_ZONE_B: 30
      STOP_TRAVEL_MINUTES_ZONE_C: 50
    precision: "integer minutes"

  - name: route_committed_units
    trigger: "attach, detach, service-line add / delete, appointment cancel, CASCADE-A hop 3, CASCADE-D hop 5"
    algorithm: aggregation
    formula: |
      committed_units = SUM( appointment.service_units
                             for appointment attached to any RouteStop of the route
                             whose RouteStop.status != VOIDED
                             and appointment.status in {SCHEDULED, CONFIRMED, IN_PROGRESS, COMPLETED} )
    input_set: "Appointments attached to non-VOIDED stops of the route in the listed statuses; BLOCKED, UNROUTED, cancelled and NO_SHOW appointments are excluded."
    constants: {}
    precision: "integer"

  - name: route_committed_minutes
    trigger: "stop create, stop void, attach, detach, service-line add / delete"
    algorithm: aggregation
    formula: |
      committed_minutes = SUM( stop.travel_minutes for stop in route.stops if stop.status != VOIDED )
                        + SUM( appointment.service_minutes
                               for appointment attached to a non-VOIDED stop
                               and appointment.status in {SCHEDULED, CONFIRMED, IN_PROGRESS, COMPLETED} )
    input_set: "Non-VOIDED RouteStop rows of the route plus their attached appointments in the listed statuses."
    constants: {}
    precision: "integer minutes"

  - name: route_capacity_check
    trigger: "POST /routes/{id}/stops and POST /route-stops/{id}/appointments"
    algorithm: threshold
    formula: |
      projected_units   = route.committed_units   + delta_units
      projected_minutes = route.committed_minutes + delta_minutes
      # UNITS is checked first (ladder priority 42), MINUTES second (priority 43)
      if projected_units   > ROUTE_MAX_UNITS_PER_DAY:   reject ERR_ROUTE_UNIT_CAPACITY_EXCEEDED
      if projected_minutes > ROUTE_MAX_MINUTES_PER_DAY: reject ERR_ROUTE_MINUTE_CAPACITY_EXCEEDED
      # delta_units   = 0 for stop create, appointment.service_units for attach
      # delta_minutes = stop.travel_minutes for stop create, appointment.service_minutes for attach
    input_set: "The route's current committed totals plus the delta the request would add."
    constants:
      ROUTE_MAX_UNITS_PER_DAY: 44
      ROUTE_MAX_MINUTES_PER_DAY: 480
    precision: "integer; the comparison is strictly greater-than, so hitting the cap exactly is ACCEPTED"

  - name: shoe_pairs_required
    trigger: "POST /route-stops/{id}/appointments (reserve) and every service-line change on an attached appointment"
    algorithm: aggregation
    formula: |
      for each distinct sku_id referenced by the appointment's service lines
      whose status is PLANNED or PERFORMED and whose service_type is in
      {NEW_SHOES, CORRECTIVE, GLUE_ON}:
          shoe_count = number of such lines carrying that sku_id
          pairs = ceil(shoe_count / SHOES_PER_PAIR)
    input_set: "ServiceLine rows of one appointment with status in {PLANNED, PERFORMED} and a non-null sku_id."
    constants:
      SHOES_PER_PAIR: 2
    precision: "integer pairs, ceiling — three shoes of one SKU draw two pairs"

  - name: bucket_replenishment_flag
    trigger: "every write that changes InventoryBucket.available_pairs"
    algorithm: threshold
    formula: "replenishment_flag = (available_pairs <= REORDER_POINT_PAIRS)"
    input_set: "One InventoryBucket."
    constants:
      REORDER_POINT_PAIRS: 2
    precision: "boolean; the comparison is <=, so available_pairs == 2 IS flagged and 3 is not"

  - name: effective_rate_card_selection
    trigger: "pricing any visit; called with an explicit service date"
    algorithm: chronological
    formula: |
      candidates = [ rc for rc in RateCard
                     if rc.status in {ACTIVE, SUPERSEDED}
                     and rc.effective_from <= service_date ]
      if candidates is empty: reject ERR_NO_EFFECTIVE_RATE_CARD
      rank by effective_from DESC, then by created_at DESC
      selected = first
    input_set: "All RateCard rows with status in {ACTIVE, SUPERSEDED}; DRAFT cards are never eligible."
    constants: {}
    precision: "exact date comparison; a card whose effective_from equals the service date IS eligible"
    variants:
      - name: BY_SERVICE_DATE
        when: "always"
        difference: "service_date is Appointment.completed_on for a finalised visit and Appointment.scheduled_date for an estimate — NEVER the invoice issue date and never the logical clock date"

  - name: next_due_on
    trigger: "POST /appointments/{id}/complete; POST /vet-prescriptions/{id}/activate; POST /vet-prescriptions/{id}/revoke; CASCADE-D hop 3"
    algorithm: threshold
    formula: |
      if horse.active_prescription_id is not null
         and prescription.status == ACTIVE
         and prescription.expires_on >= base_date:
             cycle_weeks = prescription.prescribed_cycle_weeks
             cycle_source = THERAPEUTIC
      else:
             cycle_weeks = horse.routine_cycle_weeks
             cycle_source = ROUTINE
      next_due_on = base_date + cycle_weeks * DAYS_PER_WEEK days
    input_set: "base_date is Horse.last_completed_on. A live prescription overrides the routine cycle UNCONDITIONALLY — even when prescribed_cycle_weeks is not shorter than routine_cycle_weeks."
    constants:
      DAYS_PER_WEEK: 7
    precision: "calendar dates"
    variants:
      - name: ROUTINE
        when: "no live VetPrescription for the horse at base_date"
        difference: "cycle comes from Horse.routine_cycle_weeks (6-8 weeks)"
      - name: THERAPEUTIC
        when: "a VetPrescription with status ACTIVE and expires_on >= base_date exists for the horse"
        difference: "cycle comes from VetPrescription.prescribed_cycle_weeks (2-8 weeks) and reverts to ROUTINE the moment the prescription expires or is revoked"

  - name: snap_forward_scheduled_date
    trigger: "CASCADE-C hop 2 inside POST /appointments/{id}/complete"
    algorithm: interval_merge
    formula: |
      raw_due = next_due_on                       # already computed above
      for offset in 0, 1, ..., SNAP_FORWARD_LOOKAHEAD_DAYS:
          candidate = raw_due + offset days
          if weekday(candidate) in barn.served_weekdays
             and candidate not in barn.blackout_dates:
                 return (candidate, ROUTED_CANDIDATE)
      return (raw_due, UNROUTED_REQUIRES_MANUAL)
    input_set: "The Barn of the horse; served_weekdays and blackout_dates."
    constants:
      SNAP_FORWARD_LOOKAHEAD_DAYS: 3
    precision: "offset 0 is tested FIRST, so a raw_due that already lands on a served, non-blacked-out weekday is used unchanged"

  - name: cancellation_tier
    trigger: "POST /appointments/{id}/cancel"
    algorithm: threshold
    formula: |
      lead_days = appointment.scheduled_date - current_clock_date   # whole calendar days
      if lead_days >= ADVANCE_CANCEL_MIN_LEAD_DAYS:                 tier = ADVANCE
      elif lead_days >= 1:                                          tier = LATE
      elif appointment.route_stop_id is not null
           and route_stop.status == ARRIVED:                        tier = ONSITE
      else:                                                         tier = LATE
      fee = { ADVANCE: 0, LATE: LATE_CANCEL_FEE_CENTS, ONSITE: ONSITE_CANCEL_FEE_CENTS }[tier]
    input_set: "One appointment, the logical clock date and the appointment's stop."
    constants:
      ADVANCE_CANCEL_MIN_LEAD_DAYS: 3
      LATE_CANCEL_FEE_CENTS: 3500
      ONSITE_CANCEL_FEE_CENTS: 5500
    precision: "lead_days is a whole-day difference; exactly ADVANCE_CANCEL_MIN_LEAD_DAYS days of lead is ADVANCE (>=), two days is LATE"
    variants:
      - name: ADVANCE
        when: "lead_days >= 3"
        difference: "fee 0, reservations released, appointment detached, no invoice is minted"
      - name: LATE
        when: "1 <= lead_days < 3, or lead_days <= 0 while the stop has not been ARRIVED"
        difference: "fee LATE_CANCEL_FEE_CENTS, appointment detached, an invoice carrying only the fee line is minted"
      - name: ONSITE
        when: "lead_days <= 0 and the stop status is ARRIVED"
        difference: "fee ONSITE_CANCEL_FEE_CENTS AND the appointment stays attached so it still takes a trip-fee share when the stop completes"

  - name: no_show_rolling_count
    trigger: "POST /appointments/{id}/no-show and POST /_clock/set_current_utc"
    algorithm: aggregation
    formula: |
      window_start = current_clock_date - NO_SHOW_ROLLING_WINDOW_DAYS days
      count = number of Appointment rows a
              where horse.client_id == client.id
              and a.status == NO_SHOW
              and window_start <= a.completed_on <= current_clock_date
    input_set: "All NO_SHOW appointments of the client's horses; both window bounds are INCLUSIVE."
    constants:
      NO_SHOW_ROLLING_WINDOW_DAYS: 180
    precision: "a strike whose completed_on equals window_start is still counted; one day older is not"

  - name: client_billing_standing
    trigger: "POST /appointments/{id}/no-show, POST /clients/{id}/deposits, POST /_clock/set_current_utc"
    algorithm: threshold
    formula: |
      n = no_show_rolling_count
      if n >= NO_SHOW_SUSPEND_THRESHOLD:                                     standing = SUSPENDED
      elif n >= NO_SHOW_PREPAY_THRESHOLD
           and client.deposit_balance_cents < PREPAY_DEPOSIT_MIN_CENTS:      standing = PREPAY_REQUIRED
      else:                                                                  standing = ACTIVE
    input_set: "One client."
    constants:
      NO_SHOW_PREPAY_THRESHOLD: 3
      NO_SHOW_SUSPEND_THRESHOLD: 5
      PREPAY_DEPOSIT_MIN_CENTS: 10000
    precision: "both thresholds are >=, so the THIRD strike inside the window flips the client to PREPAY_REQUIRED"

  - name: trip_fee_allocation
    trigger: "POST /route-stops/{id}/complete"
    algorithm: waterfall_allocation
    formula: |
      stop_fee = rate_card[ constant_mappings.barn_zone_to_rate_card_trip_fee_field[barn.zone] ]
      billable = [ a for a in appointments attached to the stop
                   if a.status in {COMPLETED, NO_SHOW, CANCELLED_ONSITE} ]
      billable sorted by a.created_at ASC
      n = len(billable)
      if n == 0:
          stop.trip_fee_cents = 0 and every share is 0
      else:
          stop.trip_fee_cents = stop_fee
          base = floor(stop_fee / n)
          remainder = stop_fee - base * n
          the FIRST `remainder` appointments in the sorted order receive base + 1
          the remaining n - remainder appointments receive base
    input_set: "Appointments attached to one stop whose status is COMPLETED, NO_SHOW or CANCELLED_ONSITE. CANCELLED_ADVANCE and CANCELLED_LATE appointments are detached and therefore never billable."
    constants: {}
    precision: "integer cents; INV_TRIP_FEE_SPLIT requires the shares to sum to stop_fee exactly. Removing a horse from the billable set RAISES the surviving horses' shares."

  - name: invoice_labor_subtotal
    trigger: "invoice mint and every invoice recompute"
    algorithm: aggregation
    formula: |
      labor_subtotal_cents = SUM( line.labor_cents for line in appointment.service_lines
                                  if line.status == PERFORMED )
    input_set: "PERFORMED ServiceLine rows only. Each line's labor_cents was ALREADY rounded by calculations.service_line_labor_amount."
    constants: {}
    precision: |
      Rounding order is PINNED: round the sedation surcharge PER LINE first, then
      sum the rounded line amounts. Summing the base prices and rounding one
      combined surcharge is WRONG and produces a different subtotal.

  - name: invoice_product_subtotal
    trigger: "invoice mint and every invoice recompute"
    algorithm: aggregation
    formula: |
      pair_amount = SUM( reservation.pairs * sku.price_cents_per_pair
                         for reservation in appointment.reservations
                         if reservation.status == COMMITTED )
      pad_amount  = rate_card.pad_price_cents
                    * COUNT( line for line in appointment.service_lines
                             if line.status == PERFORMED and line.with_pad == true )
      product_subtotal_cents = pair_amount + pad_amount
    input_set: "COMMITTED ShoeReservation rows and PERFORMED padded ServiceLine rows of one appointment."
    constants: {}
    precision: "integer cents; product lines never carry a sedation surcharge"

  - name: multi_horse_discount
    trigger: "invoice mint and every invoice recompute"
    algorithm: threshold
    formula: |
      if stop is not null and stop.billable_horse_count >= MULTI_HORSE_DISCOUNT_MIN_HORSES:
          multi_horse_discount_cents = round_half_up(labor_subtotal_cents
                                                     * MULTI_HORSE_DISCOUNT_BP
                                                     / BASIS_POINT_DENOMINATOR)
      else:
          multi_horse_discount_cents = 0
    input_set: "RouteStop.billable_horse_count of the appointment's stop; an UNROUTED visit never qualifies."
    constants:
      MULTI_HORSE_DISCOUNT_MIN_HORSES: 3
      MULTI_HORSE_DISCOUNT_BP: 500
      BASIS_POINT_DENOMINATOR: 10000
    precision: "applies to LABOR only; the product subtotal and the trip-fee share are untouched"

  - name: loyalty_discount
    trigger: "invoice mint and every invoice recompute"
    algorithm: tiered_pricing
    formula: |
      labor_after_mh = labor_subtotal_cents - multi_horse_discount_cents
      loyalty_base   = labor_after_mh + product_subtotal_cents
      if client.completed_visit_count >= LOYALTY_PREMIER_THRESHOLD_VISITS: bp = LOYALTY_PREMIER_BP
      elif client.completed_visit_count >= LOYALTY_THRESHOLD_VISITS:       bp = LOYALTY_STANDARD_BP
      else:                                                                bp = 0
      loyalty_discount_cents = round_half_up(loyalty_base * bp / BASIS_POINT_DENOMINATOR)
    input_set: "Client.completed_visit_count as it stands AFTER this visit has been counted."
    constants:
      LOYALTY_THRESHOLD_VISITS: 12
      LOYALTY_STANDARD_BP: 300
      LOYALTY_PREMIER_THRESHOLD_VISITS: 30
      LOYALTY_PREMIER_BP: 600
      BASIS_POINT_DENOMINATOR: 10000
    precision: "both thresholds are >="
    variants:
      - name: STANDARD_TIER
        when: "LOYALTY_THRESHOLD_VISITS <= completed_visit_count < LOYALTY_PREMIER_THRESHOLD_VISITS"
        difference: "rate is LOYALTY_STANDARD_BP (3%)"
      - name: PREMIER_TIER
        when: "completed_visit_count >= LOYALTY_PREMIER_THRESHOLD_VISITS"
        difference: "rate is LOYALTY_PREMIER_BP (6%) applied to the same base, doubling the discount for identical work"

  - name: loyalty_allocation_split
    trigger: "immediately after loyalty_discount"
    algorithm: waterfall_allocation
    formula: |
      if loyalty_base == 0:
          loyalty_discount_product_cents = 0
      else:
          loyalty_discount_product_cents = round_half_up(loyalty_discount_cents
                                                          * product_subtotal_cents
                                                          / loyalty_base)
      loyalty_discount_labor_cents = loyalty_discount_cents - loyalty_discount_product_cents
    input_set: "The three amounts produced by loyalty_discount."
    constants: {}
    precision: "the PRODUCT leg is rounded and the LABOR leg absorbs the remainder, so INV_LOYALTY_SPLIT holds exactly"

  - name: invoice_tax
    trigger: "immediately after loyalty_allocation_split"
    algorithm: threshold
    formula: |
      taxable_product_base_cents = product_subtotal_cents - loyalty_discount_product_cents
      # PRODUCT_TAXABLE variant
      tax_cents = round_half_up(taxable_product_base_cents * PRODUCT_TAX_RATE_BP / BASIS_POINT_DENOMINATOR)
      # PRODUCT_EXEMPT variant
      tax_cents = 0
    input_set: "One invoice. Labor, the trip-fee share and cancellation / no-show fees are ALWAYS untaxed (LABOR_TAX_RATE_BP, TRIP_FEE_TAX_RATE_BP and FEE_TAX_RATE_BP are all 0)."
    constants:
      PRODUCT_TAX_RATE_BP: 725
      LABOR_TAX_RATE_BP: 0
      TRIP_FEE_TAX_RATE_BP: 0
      FEE_TAX_RATE_BP: 0
      BASIS_POINT_DENOMINATOR: 10000
    precision: "integer cents, round_half_up"
    variants:
      - name: PRODUCT_TAXABLE
        when: "Client.tax_exempt == false"
        difference: "tax is 7.25% of the product base AFTER the loyalty product allocation is deducted"
      - name: PRODUCT_EXEMPT
        when: "Client.tax_exempt == true"
        difference: "tax_cents is 0 while taxable_product_base_cents keeps its computed value, so the total falls by exactly the tax amount"

  - name: invoice_build
    trigger: "invoice mint (complete / late-cancel / onsite-cancel / no-show), stop completion, POST /invoices/{id}/void"
    algorithm: constraint_propagation
    formula: |
      # EVALUATION ORDER IS PINNED. Steps must run exactly in this sequence
      # because multi_horse_discount feeds loyalty_discount, loyalty_discount
      # feeds the taxable base, and the taxable base feeds tax which feeds total.
      1  labor_subtotal_cents        = invoice_labor_subtotal
      2  product_subtotal_cents      = invoice_product_subtotal
      3  multi_horse_discount_cents  = multi_horse_discount
      4  labor_after_mh              = labor_subtotal_cents - multi_horse_discount_cents
      5  loyalty_discount_cents      = loyalty_discount
      6  loyalty_discount_product_cents / loyalty_discount_labor_cents = loyalty_allocation_split
      7  labor_net_cents             = labor_after_mh - loyalty_discount_labor_cents
      8  taxable_product_base_cents  = product_subtotal_cents - loyalty_discount_product_cents
      9  tax_cents                   = invoice_tax
      10 trip_fee_share_cents        = trip_fee_allocation (0 until the stop completes)
      11 fee_cents                   = appointment.cancellation_fee_cents
      12 total_cents  = labor_net_cents + taxable_product_base_cents
                        + trip_fee_share_cents + fee_cents + tax_cents
      13 balance_cents = total_cents - paid_cents
    input_set: "One Invoice and its appointment."
    constants: {}
    precision: "integer cents throughout; no intermediate value is re-rounded"

  - name: visit_price
    trigger: "ESTIMATE on every service-line change of a SCHEDULED / CONFIRMED appointment; FINAL on POST /appointments/{id}/complete"
    algorithm: forward_looking
    formula: |
      # ESTIMATE
      rc = effective_rate_card_selection(service_date = appointment.scheduled_date)
      estimated_total_cents = SUM(service_line_labor_amount(line, rc) for PLANNED lines)
                              + SUM(pairs * sku.price_cents_per_pair for shoe_pairs_required)
                              + rc.pad_price_cents * COUNT(PLANNED lines with with_pad)
      # FINAL
      rc = effective_rate_card_selection(service_date = appointment.completed_on)
      total_cents = invoice_build(...)
    input_set: "ESTIMATE reads PLANNED lines and prices them off the scheduled date; FINAL reads PERFORMED lines and prices them off the completion date."
    constants: {}
    precision: "integer cents"
    variants:
      - name: ESTIMATE
        when: "the appointment has not yet completed"
        difference: "no trip-fee share, no discounts, no tax, no fees; priced off the SCHEDULED date's rate card"
      - name: FINAL
        when: "POST /appointments/{id}/complete"
        difference: "full invoice build priced off the COMPLETION date's rate card — a card that took effect between the two dates changes the answer"

  - name: payment_waterfall
    trigger: "POST /clients/{id}/payments"
    algorithm: waterfall_allocation
    formula: |
      remaining = amount_cents
      targets = [ inv for inv in client's invoices
                  if inv.status in {ISSUED, PARTIALLY_PAID} and inv.balance_cents > 0 ]
      targets sorted by issued_on ASC, then created_at ASC
      for inv in targets:
          applied = min(remaining, inv.balance_cents)
          inv.paid_cents += applied
          inv.balance_cents -= applied
          inv.status = PAID if inv.balance_cents == 0 else PARTIALLY_PAID
          remaining -= applied
          if remaining == 0: break
      client.credit_balance_cents += remaining
    input_set: "ISSUED and PARTIALLY_PAID invoices of one client with a positive balance. DRAFT and VOID invoices are never targets."
    constants: {}
    precision: "integer cents; oldest issued invoice is filled completely before the next is touched"

  - name: warranty_eligibility
    trigger: "POST /appointments/{id}/warranty-revisit"
    algorithm: threshold
    formula: |
      days_since = current_clock_date - origin_appointment.completed_on
      eligible = (origin_appointment.status == COMPLETED)
                 and (0 <= days_since <= WARRANTY_WINDOW_DAYS)
    input_set: "The originating COMPLETED appointment."
    constants:
      WARRANTY_WINDOW_DAYS: 21
    precision: "the boundary is inclusive — exactly WARRANTY_WINDOW_DAYS days after completion is still eligible, one day more is ERR_WARRANTY_WINDOW_EXPIRED"

  - name: prescription_liveness
    trigger: "GATE_HORSE_HOLD, CORRECTIVE service-line validation, next_due_on"
    algorithm: projection
    formula: |
      live(p, on_date) = p.status == ACTIVE
                         and p.issued_on <= on_date
                         and on_date <= p.expires_on
      covers(p, limb)  = limb in p.limb_scope
    input_set: "One VetPrescription and a date."
    constants: {}
    precision: "both date bounds are inclusive"

  - name: reminder_due_date
    trigger: "Reminder mint on attach and on CASCADE-C hop 3"
    algorithm: aggregation
    formula: "due_on = appointment.scheduled_date - offset_days days, for offset_days in {REMINDER_OFFSET_DAYS_PRIMARY, REMINDER_OFFSET_DAYS_SECONDARY}"
    input_set: "One appointment."
    constants:
      REMINDER_OFFSET_DAYS_PRIMARY: 7
      REMINDER_OFFSET_DAYS_SECONDARY: 2
    precision: "calendar dates"

  - name: reminder_suppression
    trigger: "POST /reminders/{id}/send"
    algorithm: interval_merge
    formula: |
      suppressed = EXISTS sibling s of the same appointment
                   where s.id != this.id
                   and s.status in {SENT, ACKNOWLEDGED}
                   and s.sent_on is not null
                   and abs(current_clock_date - s.sent_on) <= REMINDER_SUPPRESSION_WINDOW_DAYS
    input_set: "Sibling Reminder rows of the same appointment."
    constants:
      REMINDER_SUPPRESSION_WINDOW_DAYS: 3
    precision: "the window is a closed interval on BOTH sides of the sibling's sent_on; exactly 3 days apart is still suppressed, 4 days apart is not"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table — 52 ordered rungs.
# Priorities 29-34 are the five ordered write gates from gate_precedence.
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the six roles in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "The role is listed in the endpoint's roles set"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Ownership — a ClientUser may only act on a Client whose id equals X-User-ID or on a Horse / Appointment / Invoice belonging to it; a Farrier may only act on a Route, RouteStop or Appointment whose route's farrier_id equals X-User-ID"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all endpoints whose roles include ClientUser or Farrier"
  - priority: 4
    category: existence
    check: "Barn referenced in the path or body exists"
    error_id: ERR_BARN_NOT_FOUND
    http_status: 404
    applies_to: "GET /barns/{id}, POST /clients, POST /horses, POST /routes/{id}/stops"
  - priority: 5
    category: existence
    check: "Client referenced in the path or body exists"
    error_id: ERR_CLIENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /clients/{id}, POST /clients/{id}/deposits, POST /clients/{id}/payments, POST /horses"
  - priority: 6
    category: existence
    check: "Horse referenced in the path or body exists"
    error_id: ERR_HORSE_NOT_FOUND
    http_status: 404
    applies_to: "GET /horses/{id}, PATCH /horses/{id}, POST /horses/{id}/retire, POST /horses/{id}/reinstate, GET /horses/{id}/limb-states, POST /appointments, POST /lameness-cases"
  - priority: 7
    category: existence
    check: "Farrier referenced in the path or body exists"
    error_id: ERR_FARRIER_NOT_FOUND
    http_status: 404
    applies_to: "GET /farriers/{id}, POST /farriers/{id}/deactivate, POST /farriers/{id}/reactivate, POST /farriers/{id}/recertify, POST /routes"
  - priority: 8
    category: existence
    check: "ShoeSku referenced in the path or body exists"
    error_id: ERR_SKU_NOT_FOUND
    http_status: 404
    applies_to: "GET /shoe-skus/{id}, POST /appointments/{id}/service-lines, POST /stock-transfers"
  - priority: 9
    category: existence
    check: "InventoryBucket referenced in the path or body exists"
    error_id: ERR_BUCKET_NOT_FOUND
    http_status: 404
    applies_to: "GET /inventory-buckets/{id}, POST /inventory-buckets/{id}/adjust, POST /stock-transfers"
  - priority: 10
    category: existence
    check: "StockTransfer referenced in the path exists"
    error_id: ERR_TRANSFER_NOT_FOUND
    http_status: 404
    applies_to: "GET /stock-transfers/{id}, POST /stock-transfers/{id}/dispatch, POST /stock-transfers/{id}/receive, POST /stock-transfers/{id}/abort"
  - priority: 11
    category: existence
    check: "ShoeReservation referenced in the path exists"
    error_id: ERR_RESERVATION_NOT_FOUND
    http_status: 404
    applies_to: "GET /shoe-reservations/{id}"
  - priority: 12
    category: existence
    check: "RateCard referenced in the path or body exists"
    error_id: ERR_RATE_CARD_NOT_FOUND
    http_status: 404
    applies_to: "GET /rate-cards/{id}, POST /rate-cards/{id}/activate, POST /rate-cards"
  - priority: 13
    category: existence
    check: "Route referenced in the path exists"
    error_id: ERR_ROUTE_NOT_FOUND
    http_status: 404
    applies_to: "GET /routes/{id}, POST /routes/{id}/plan, POST /routes/{id}/dispatch, POST /routes/{id}/close, POST /routes/{id}/cancel, POST /routes/{id}/stops"
  - priority: 14
    category: existence
    check: "RouteStop referenced in the path exists"
    error_id: ERR_ROUTE_STOP_NOT_FOUND
    http_status: 404
    applies_to: "GET /route-stops/{id}, POST /route-stops/{id}/reorder, POST /route-stops/{id}/arrive, POST /route-stops/{id}/complete, POST /route-stops/{id}/appointments, DELETE /route-stops/{id}/appointments/{appointment_id}"
  - priority: 15
    category: existence
    check: "Appointment referenced in the path exists"
    error_id: ERR_APPOINTMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /appointments/{id}, POST /appointments/{id}/service-lines, POST /appointments/{id}/start, POST /appointments/{id}/complete, POST /appointments/{id}/cancel, POST /appointments/{id}/no-show, POST /appointments/{id}/warranty-revisit, POST /route-stops/{id}/appointments, DELETE /route-stops/{id}/appointments/{appointment_id}"
  - priority: 16
    category: existence
    check: "ServiceLine referenced in the path or body exists and belongs to the appointment in scope"
    error_id: ERR_SERVICE_LINE_NOT_FOUND
    http_status: 404
    applies_to: "GET /service-lines/{id}, DELETE /service-lines/{id}, POST /appointments/{id}/complete"
  - priority: 17
    category: existence
    check: "LamenessCase referenced in the path or body exists"
    error_id: ERR_LAMENESS_CASE_NOT_FOUND
    http_status: 404
    applies_to: "GET /lameness-cases/{id}, POST /lameness-cases/{id}/resolve, POST /lameness-cases/{id}/reopen, POST /vet-prescriptions"
  - priority: 18
    category: existence
    check: "VetPrescription referenced in the path or body exists"
    error_id: ERR_PRESCRIPTION_NOT_FOUND
    http_status: 404
    applies_to: "GET /vet-prescriptions/{id}, POST /vet-prescriptions/{id}/activate, POST /vet-prescriptions/{id}/revoke, POST /appointments/{id}/service-lines"
  - priority: 19
    category: existence
    check: "Invoice referenced in the path exists; on the /reminders paths the Reminder referenced in the path exists"
    error_id: ERR_INVOICE_NOT_FOUND
    http_status: 404
    applies_to: "GET /invoices/{id}, GET /invoices/{id}/lines, POST /invoices/{id}/issue, POST /invoices/{id}/void"
  - priority: 20
    category: existence
    check: "Reminder referenced in the path exists"
    error_id: ERR_REMINDER_NOT_FOUND
    http_status: 404
    applies_to: "GET /reminders/{id}, POST /reminders/{id}/send, POST /reminders/{id}/acknowledge"
  - priority: 21
    category: business_constraint
    check: "Every field the endpoint declares as required is present, correctly typed, the `lines` array on POST /appointments/{id}/service-lines is non-empty, and the declared field-combination rules hold — sku_id present exactly when constant_mappings.service_type_requires_sku is true for the service_type; prescription_id present exactly when service_type is CORRECTIVE; with_pad false for TRIM, RESET and GLUE_ON; limb_scope and served_weekdays non-empty and duplicate-free; warranty_reason present exactly when visit_kind is WARRANTY_REVISIT"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 22
    category: business_constraint
    check: "Every enum-valued field carries a declared member. This list is exhaustive and closed — Barn.zone, ServiceLine.service_type, Appointment.visit_kind, Appointment.warranty_reason, Farrier.certification_level, ShoeSku.material, LimbState.limb, VetPrescription.limb_scope members, Barn.served_weekdays members, the deactivate `reason` field, the send `delivery_outcome` field, and the reorder `direction` field route here. No other field routes to ERR_INVALID_ENUM"
    error_id: ERR_INVALID_ENUM
    http_status: 422
    applies_to: "all write endpoints"
  - priority: 23
    category: business_constraint
    check: "Numeric and date ranges hold — routine_cycle_weeks in [MIN_ROUTINE_CYCLE_WEEKS, MAX_ROUTINE_CYCLE_WEEKS]; prescribed_cycle_weeks in [MIN_PRESCRIBED_CYCLE_WEEKS, MAX_PRESCRIBED_CYCLE_WEEKS]; severity in [LAMENESS_MIN_SEVERITY, LAMENESS_MAX_SEVERITY]; quantity_pairs in [1, MAX_TRANSFER_PAIRS]; amount_cents > 0; access_open_minute < access_close_minute; planned_start_minute in [0, MINUTES_PER_DAY); sequence_index in [1, route.stop_count + 1]; route.stop_count < MAX_STOPS_PER_ROUTE; expires_on within PRESCRIPTION_MAX_DURATION_DAYS of issued_on; pagination limit in [MIN_PAGE_LIMIT, MAX_PAGE_LIMIT]"
    error_id: ERR_VALUE_OUT_OF_RANGE
    http_status: 422
    applies_to: "all write endpoints and every list endpoint's pagination parameters"
  - priority: 24
    category: state
    check: "expected_route_version equals Route.version"
    error_id: ERR_STALE_ROUTE_VERSION
    http_status: 412
    applies_to: "POST /route-stops/{id}/appointments"
  - priority: 25
    category: state
    check: "expected_appointment_version equals Appointment.version"
    error_id: ERR_STALE_APPOINTMENT_VERSION
    http_status: 412
    applies_to: "POST /appointments/{id}/service-lines"
  - priority: 26
    category: state
    check: "expected_lameness_case_version equals LamenessCase.version"
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
    applies_to: "POST /vet-prescriptions/{id}/activate"
  - priority: 27
    category: state
    check: "expected_client_version equals Client.version"
    error_id: ERR_STALE_CLIENT_VERSION
    http_status: 412
    applies_to: "POST /clients/{id}/payments"
  - priority: 28
    category: state
    check: "GATE 1a — the Farrier owning the Route in scope has status ACTIVE"
    error_id: ERR_FARRIER_INACTIVE
    http_status: 409
    applies_to: "every endpoint listed under gate_precedence order 1"
  - priority: 29
    category: state
    check: "GATE 1b — that Farrier's cert_expires_on is on or after the logical clock date"
    error_id: ERR_FARRIER_CERT_EXPIRED
    http_status: 409
    applies_to: "every endpoint listed under gate_precedence order 1"
  - priority: 30
    category: state
    check: "GATE 2 — Route.status is DRAFT or PLANNED"
    error_id: ERR_ROUTE_NOT_OPEN
    http_status: 409
    applies_to: "every endpoint listed under gate_precedence order 2"
  - priority: 31
    category: business_fiscal
    check: "GATE 3 — the Client is ACTIVE, or PREPAY_REQUIRED with deposit_balance_cents >= PREPAY_DEPOSIT_MIN_CENTS. SUSPENDED never passes"
    error_id: ERR_CLIENT_PREPAY_REQUIRED
    http_status: 402
    applies_to: "every endpoint listed under gate_precedence order 3"
  - priority: 32
    category: business_safety
    check: "GATE 4 — Horse.hold_status is CLEAR, or every service line on the appointment is CORRECTIVE under a live prescription covering its limb"
    error_id: ERR_HORSE_ON_HOLD
    http_status: 409
    applies_to: "every endpoint listed under gate_precedence order 4"
  - priority: 33
    category: state
    check: "GATE 5 — Appointment.status is inside the endpoint's declared eligible set"
    error_id: ERR_APPOINTMENT_NOT_ELIGIBLE
    http_status: 409
    applies_to: "every endpoint listed under gate_precedence order 5"
  - priority: 34
    category: state
    check: "The state precondition of the target transition holds for every entity that is NOT an Appointment and NOT a Route covered by gate 2 — Horse.lifecycle_status, LamenessCase.status, VetPrescription.status, StockTransfer.status, RateCard.status, Invoice.status, Reminder.status, RouteStop.status"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints on those entities"
  - priority: 35
    category: business_safety
    check: "The Farrier owning the route may perform this service type per constant_mappings.certification_level_to_allowed_service_types"
    error_id: ERR_CREDENTIAL_INSUFFICIENT
    http_status: 403
    applies_to: "POST /route-stops/{id}/appointments, POST /appointments/{id}/start, POST /appointments/{id}/complete"
  - priority: 36
    category: business_safety
    check: "A CORRECTIVE service line names a VetPrescription that is live on the appointment's scheduled_date per calculations.prescription_liveness"
    error_id: ERR_NO_LIVE_PRESCRIPTION
    http_status: 422
    applies_to: "POST /appointments/{id}/service-lines"
  - priority: 37
    category: business_safety
    check: "That prescription's limb_scope contains the exact limb of the referenced LimbState"
    error_id: ERR_LIMB_NOT_IN_PRESCRIPTION_SCOPE
    http_status: 422
    applies_to: "POST /appointments/{id}/service-lines"
  - priority: 38
    category: business_constraint
    check: "A RESET service line targets a LimbState whose shoeing_state is SHOD, SHOD_WITH_PAD or GLUED — a RESET on a BAREFOOT limb has no shoe to reuse"
    error_id: ERR_RESET_REQUIRES_SHOD_LIMB
    http_status: 422
    applies_to: "POST /appointments/{id}/service-lines"
  - priority: 39
    category: business_constraint
    check: "That LimbState's consecutive_reset_count is strictly below MAX_CONSECUTIVE_RESETS"
    error_id: ERR_RESET_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /appointments/{id}/service-lines"
  - priority: 40
    category: business_constraint
    check: "The appointment has no other PLANNED or PERFORMED ServiceLine for the same limb"
    error_id: ERR_DUPLICATE_LIMB_LINE
    http_status: 409
    applies_to: "POST /appointments/{id}/service-lines"
  - priority: 41
    category: business_temporal
    check: "A warranty revisit is opened within WARRANTY_WINDOW_DAYS of the origin visit's completed_on, inclusive"
    error_id: ERR_WARRANTY_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /appointments/{id}/warranty-revisit"
  - priority: 42
    category: business_referential
    check: "RouteStop.barn_id equals the Horse's barn_id"
    error_id: ERR_BARN_MISMATCH
    http_status: 422
    applies_to: "POST /route-stops/{id}/appointments"
  - priority: 43
    category: business_temporal
    check: "The weekday of the route's route_date is a member of the stop barn's served_weekdays"
    error_id: ERR_BARN_WEEKDAY_NOT_SERVED
    http_status: 422
    applies_to: "POST /routes/{id}/stops"
  - priority: 44
    category: business_temporal
    check: "The route's route_date is not a member of the stop barn's blackout_dates"
    error_id: ERR_BARN_BLACKOUT_DATE
    http_status: 422
    applies_to: "POST /routes/{id}/stops"
  - priority: 45
    category: business_temporal
    check: "Containment semantics — planned_start_minute >= barn.access_open_minute AND planned_start_minute + stop.service_minutes <= barn.access_close_minute. The end boundary is INCLUSIVE, so a stop finishing exactly at access_close_minute is accepted"
    error_id: ERR_OUTSIDE_ACCESS_WINDOW
    http_status: 422
    applies_to: "POST /routes/{id}/stops, POST /route-stops/{id}/appointments, POST /route-stops/{id}/reorder"
  - priority: 46
    category: business_temporal
    check: "Buffered-adjacency semantics — for consecutive stops i and j on the same route (sequence_index of j is i's plus one), stop_j.planned_start_minute >= stop_i.end_minute + stop_j.travel_minutes. Equality is ACCEPTED; anything inside the travel buffer is refused"
    error_id: ERR_STOP_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /routes/{id}/stops, POST /route-stops/{id}/reorder, POST /route-stops/{id}/appointments"
  - priority: 47
    category: business_safety
    check: "If Horse.requires_sedation is true the appointment must carry vet_present true"
    error_id: ERR_SEDATION_VET_REQUIRED
    http_status: 422
    applies_to: "POST /appointments, POST /route-stops/{id}/appointments"
  - priority: 48
    category: business_constraint
    check: "The reminder is not suppressed by calculations.reminder_suppression"
    error_id: ERR_REMINDER_SUPPRESSED
    http_status: 409
    applies_to: "POST /reminders/{id}/send"
  - priority: 49
    category: business_constraint
    check: "Route unit capacity — projected_units <= ROUTE_MAX_UNITS_PER_DAY. Checked BEFORE the minute meter"
    error_id: ERR_ROUTE_UNIT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /route-stops/{id}/appointments"
  - priority: 50
    category: business_constraint
    check: "Route minute capacity — projected_minutes <= ROUTE_MAX_MINUTES_PER_DAY"
    error_id: ERR_ROUTE_MINUTE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /routes/{id}/stops, POST /route-stops/{id}/appointments"
  - priority: 51
    category: business_constraint
    check: "The van bucket of the route's farrier has available_pairs >= calculations.shoe_pairs_required for every SKU on the appointment"
    error_id: ERR_VAN_STOCK_INSUFFICIENT
    http_status: 409
    applies_to: "POST /route-stops/{id}/appointments"
  - priority: 52
    category: business_constraint
    check: "The SHOP bucket has available_pairs >= quantity_pairs"
    error_id: ERR_SHOP_STOCK_INSUFFICIENT
    http_status: 409
    applies_to: "POST /stock-transfers/{id}/dispatch"
  - priority: 53
    category: business_fiscal
    check: "A RateCard with status in {ACTIVE, SUPERSEDED} and effective_from <= the service date exists, per calculations.effective_rate_card_selection. Fiscal checks run last"
    error_id: ERR_NO_EFFECTIVE_RATE_CARD
    http_status: 422
    applies_to: "POST /route-stops/{id}/appointments, POST /appointments/{id}/complete, POST /appointments/{id}/cancel, POST /appointments/{id}/no-show, POST /route-stops/{id}/complete"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table — 86 endpoints.
# Path convention: the PRIMARY resource id is always the literal segment {id};
# a second, nested id gets a descriptive name.
# ---------------------------------------------------------------------------
endpoints:

  # ----- Barn -----
  - method: POST
    path: "/barns"
    description: "Create a barn with its served weekdays, access window, zone and blackout dates."
    roles: [PlatformAdmin]
    code: 201
    input: [name, zone, served_weekdays, access_open_minute, access_close_minute, "blackout_dates?"]
    output: Barn
    side_effects: []
  - method: GET
    path: "/barns"
    description: "List barns."
    roles: [PlatformAdmin, Dispatcher, Farrier, ClientUser, Veterinarian, BillingClerk]
    code: 200
    input: ["zone?", "limit?", "offset?"]
    output: Barn[]
    side_effects: []
  - method: GET
    path: "/barns/{id}"
    description: "Read one barn."
    roles: [PlatformAdmin, Dispatcher, Farrier, ClientUser, Veterinarian, BillingClerk]
    code: 200
    input: []
    output: Barn
    side_effects: []

  # ----- Client -----
  - method: POST
    path: "/clients"
    description: "Create a horse owner."
    roles: [PlatformAdmin]
    code: 201
    input: [display_name, home_barn_id, "tax_exempt?", "opening_completed_visit_count?"]
    output: Client
    side_effects: []
  - method: GET
    path: "/clients"
    description: "List clients, optionally filtered by home barn."
    roles: [PlatformAdmin, Dispatcher, BillingClerk]
    code: 200
    input: ["home_barn_id?", "billing_standing?", "limit?", "offset?"]
    output: Client[]
    side_effects: []
  - method: GET
    path: "/clients/{id}"
    description: "Read one client including deposit, credit, loyalty and no-show counters."
    roles: [PlatformAdmin, Dispatcher, BillingClerk, ClientUser]
    code: 200
    input: []
    output: Client
    side_effects: []
  - method: POST
    path: "/clients/{id}/deposits"
    description: "Post a refundable deposit; re-derives billing_standing."
    roles: [BillingClerk]
    code: 200
    input: [amount_cents]
    output: Client
    side_effects:
      - "Client.deposit_balance_cents += amount_cents"
      - "calculations.client_billing_standing re-run"
      - "increments Client.version by 1"
  - method: POST
    path: "/clients/{id}/payments"
    description: "Apply a payment across the client's outstanding invoices by calculations.payment_waterfall."
    roles: [BillingClerk]
    code: 200
    input: [amount_cents, expected_client_version]
    output: Client
    side_effects:
      - "calculations.payment_waterfall runs over ISSUED and PARTIALLY_PAID invoices"
      - "each filled Invoice moves to PARTIALLY_PAID or PAID and its Appointment.billing_status may become SETTLED"
      - "Client.credit_balance_cents += leftover"
      - "increments Client.version by 1"

  # ----- Horse -----
  - method: POST
    path: "/horses"
    description: "Create a horse; four LimbState rows are minted BAREFOOT."
    roles: [PlatformAdmin, ClientUser]
    code: 201
    input: [client_id, barn_id, name, routine_cycle_weeks, shoe_size_code, "requires_sedation?"]
    output: Horse
    side_effects:
      - "LIMB_COUNT_PER_HORSE LimbState rows created in exactly the order LF, RF, LH, RH, each BAREFOOT"
  - method: GET
    path: "/horses"
    description: "List horses with foreign-key filters."
    roles: [PlatformAdmin, Dispatcher, Farrier, ClientUser, Veterinarian, BillingClerk]
    code: 200
    input: ["client_id?", "barn_id?", "active_prescription_id?", "hold_status?", "limit?", "offset?"]
    output: Horse[]
    side_effects: []
  - method: GET
    path: "/horses/{id}"
    description: "Read one horse including next_due_on and hold_status."
    roles: [PlatformAdmin, Dispatcher, Farrier, ClientUser, Veterinarian, BillingClerk]
    code: 200
    input: []
    output: Horse
    side_effects: []
  - method: PATCH
    path: "/horses/{id}"
    description: "Change the routine cycle, sedation flag or shoe size."
    roles: [PlatformAdmin, ClientUser]
    code: 200
    input: ["routine_cycle_weeks?", "requires_sedation?", "shoe_size_code?"]
    output: Horse
    side_effects:
      - "increments Horse.version by 1"
  - method: POST
    path: "/horses/{id}/retire"
    description: "Retire a horse."
    roles: [PlatformAdmin, ClientUser]
    code: 200
    input: []
    output: Horse
    side_effects:
      - "UNROUTED appointments of the horse move to CANCELLED_ADVANCE with fee 0"
      - "Horse.next_due_on = null"
      - "increments Horse.version by 1"
  - method: POST
    path: "/horses/{id}/reinstate"
    description: "Bring a retired horse back into service."
    roles: [PlatformAdmin, ClientUser]
    code: 200
    input: []
    output: Horse
    side_effects:
      - "increments Horse.version by 1"
  - method: GET
    path: "/horses/{id}/limb-states"
    description: "List the four per-limb states of one horse, always ordered LF, RF, LH, RH."
    roles: [PlatformAdmin, Dispatcher, Farrier, ClientUser, Veterinarian, BillingClerk]
    code: 200
    input: ["limb?", "limit?", "offset?"]
    output: LimbState[]
    side_effects: []

  # ----- Farrier -----
  - method: POST
    path: "/farriers"
    description: "Create a farrier; one VAN InventoryBucket per existing ShoeSku is minted at zero."
    roles: [PlatformAdmin]
    code: 201
    input: [display_name, certification_level, cert_expires_on]
    output: Farrier
    side_effects:
      - "one VAN InventoryBucket created per existing ShoeSku with all counters 0"
  - method: GET
    path: "/farriers"
    description: "List farriers."
    roles: [PlatformAdmin, Dispatcher, Farrier, BillingClerk]
    code: 200
    input: ["certification_level?", "status?", "limit?", "offset?"]
    output: Farrier[]
    side_effects: []
  - method: GET
    path: "/farriers/{id}"
    description: "Read one farrier."
    roles: [PlatformAdmin, Dispatcher, Farrier, BillingClerk]
    code: 200
    input: []
    output: Farrier
    side_effects: []
  - method: POST
    path: "/farriers/{id}/deactivate"
    description: "Stand a farrier down. reason VOLUNTARY yields INACTIVE; reason CERT_EXPIRED yields DECERTIFIED."
    roles: [PlatformAdmin]
    code: 200
    input: [reason]
    output: Farrier
    side_effects:
      - "every Route of this farrier with status DRAFT or PLANNED moves to CANCELLED, voiding its PENDING stops, detaching its appointments to UNROUTED and releasing their reservations"
      - "increments Farrier.version by 1"
  - method: POST
    path: "/farriers/{id}/reactivate"
    description: "Return an INACTIVE farrier to ACTIVE. Refused for DECERTIFIED."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Farrier
    side_effects:
      - "increments Farrier.version by 1"
  - method: POST
    path: "/farriers/{id}/recertify"
    description: "Issue a fresh certification, returning a DECERTIFIED farrier to ACTIVE."
    roles: [PlatformAdmin]
    code: 200
    input: [certification_level, cert_expires_on]
    output: Farrier
    side_effects:
      - "Farrier.status = ACTIVE"
      - "increments Farrier.version by 1"

  # ----- ShoeSku & inventory -----
  - method: POST
    path: "/shoe-skus"
    description: "Create a shoe SKU; one SHOP bucket plus one VAN bucket per ACTIVE farrier are minted at zero."
    roles: [PlatformAdmin]
    code: 201
    input: [sku_code, size_code, material, price_cents_per_pair]
    output: ShoeSku
    side_effects:
      - "one SHOP InventoryBucket created with all counters 0"
      - "one VAN InventoryBucket created per existing Farrier with all counters 0"
  - method: GET
    path: "/shoe-skus"
    description: "List shoe SKUs."
    roles: [PlatformAdmin, Dispatcher, Farrier, BillingClerk]
    code: 200
    input: ["material?", "size_code?", "limit?", "offset?"]
    output: ShoeSku[]
    side_effects: []
  - method: GET
    path: "/shoe-skus/{id}"
    description: "Read one shoe SKU."
    roles: [PlatformAdmin, Dispatcher, Farrier, BillingClerk]
    code: 200
    input: []
    output: ShoeSku
    side_effects: []
  - method: GET
    path: "/inventory-buckets"
    description: "List inventory buckets, filtered by farrier and/or SKU."
    roles: [PlatformAdmin, Dispatcher, Farrier]
    code: 200
    input: ["farrier_id?", "sku_id?", "location_kind?", "limit?", "offset?"]
    output: InventoryBucket[]
    side_effects: []
  - method: GET
    path: "/inventory-buckets/{id}"
    description: "Read one inventory bucket."
    roles: [PlatformAdmin, Dispatcher, Farrier]
    code: 200
    input: []
    output: InventoryBucket
    side_effects: []
  - method: POST
    path: "/inventory-buckets/{id}/adjust"
    description: "Stock-take adjustment; moves on_hand and available by the same signed delta."
    roles: [PlatformAdmin]
    code: 200
    input: [delta_pairs]
    output: InventoryBucket
    side_effects:
      - "on_hand_pairs += delta_pairs and available_pairs += delta_pairs"
      - "calculations.bucket_replenishment_flag re-run"
      - "increments InventoryBucket.version by 1"
  - method: POST
    path: "/stock-transfers"
    description: "Request a shop-to-van transfer of shoe pairs."
    roles: [PlatformAdmin, Dispatcher]
    code: 201
    input: [sku_id, from_bucket_id, to_bucket_id, quantity_pairs]
    output: StockTransfer
    side_effects: []
  - method: GET
    path: "/stock-transfers"
    description: "List transfers with foreign-key filters."
    roles: [PlatformAdmin, Dispatcher, Farrier]
    code: 200
    input: ["sku_id?", "from_bucket_id?", "to_bucket_id?", "status?", "limit?", "offset?"]
    output: StockTransfer[]
    side_effects: []
  - method: GET
    path: "/stock-transfers/{id}"
    description: "Read one transfer."
    roles: [PlatformAdmin, Dispatcher, Farrier]
    code: 200
    input: []
    output: StockTransfer
    side_effects: []
  - method: POST
    path: "/stock-transfers/{id}/dispatch"
    description: "Move the pairs out of the shop bucket into the in-transit bucket."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: StockTransfer
    side_effects:
      - "SHOP bucket on_hand_pairs and available_pairs both fall by quantity_pairs"
      - "calculations.bucket_replenishment_flag re-run on the shop bucket"
      - "increments StockTransfer.version by 1"
  - method: POST
    path: "/stock-transfers/{id}/receive"
    description: "Receive the pairs into the van bucket."
    roles: [Farrier, PlatformAdmin]
    code: 200
    input: []
    output: StockTransfer
    side_effects:
      - "VAN bucket on_hand_pairs and available_pairs both rise by quantity_pairs"
      - "calculations.bucket_replenishment_flag re-run on the van bucket"
      - "increments StockTransfer.version by 1"
  - method: POST
    path: "/stock-transfers/{id}/abort"
    description: "Return in-transit pairs to the shop bucket."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: StockTransfer
    side_effects:
      - "SHOP bucket on_hand_pairs and available_pairs both rise by quantity_pairs"
      - "increments StockTransfer.version by 1"
  - method: GET
    path: "/shoe-reservations"
    description: "List shoe reservations with foreign-key filters."
    roles: [PlatformAdmin, Dispatcher, Farrier]
    code: 200
    input: ["appointment_id?", "sku_id?", "bucket_id?", "status?", "limit?", "offset?"]
    output: ShoeReservation[]
    side_effects: []
  - method: GET
    path: "/shoe-reservations/{id}"
    description: "Read one shoe reservation."
    roles: [PlatformAdmin, Dispatcher, Farrier]
    code: 200
    input: []
    output: ShoeReservation
    side_effects: []

  # ----- RateCard -----
  - method: POST
    path: "/rate-cards"
    description: "Create a DRAFT rate card, optionally naming the card it will supersede."
    roles: [PlatformAdmin]
    code: 201
    input: [label, effective_from, price_trim_cents, price_reset_cents, price_new_shoes_cents, price_corrective_cents, price_glue_on_cents, pad_price_cents, trip_fee_zone_a_cents, trip_fee_zone_b_cents, trip_fee_zone_c_cents, "supersedes_rate_card_id?"]
    output: RateCard
    side_effects: []
  - method: GET
    path: "/rate-cards"
    description: "List rate cards, optionally by the card they supersede."
    roles: [PlatformAdmin, Dispatcher, BillingClerk]
    code: 200
    input: ["supersedes_rate_card_id?", "status?", "limit?", "offset?"]
    output: RateCard[]
    side_effects: []
  - method: GET
    path: "/rate-cards/{id}"
    description: "Read one rate card."
    roles: [PlatformAdmin, Dispatcher, BillingClerk]
    code: 200
    input: []
    output: RateCard
    side_effects: []
  - method: POST
    path: "/rate-cards/{id}/activate"
    description: "Activate a DRAFT card and supersede its predecessor."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: RateCard
    side_effects:
      - "the card named by supersedes_rate_card_id moves ACTIVE -> SUPERSEDED"
      - "increments RateCard.version by 1"

  # ----- Route -----
  - method: POST
    path: "/routes"
    description: "Open a DRAFT route for one farrier on one date."
    roles: [Dispatcher]
    code: 201
    input: [farrier_id, route_date]
    output: Route
    side_effects: []
  - method: GET
    path: "/routes"
    description: "List routes, optionally by farrier."
    roles: [PlatformAdmin, Dispatcher, Farrier]
    code: 200
    input: ["farrier_id?", "status?", "route_date?", "limit?", "offset?"]
    output: Route[]
    side_effects: []
  - method: GET
    path: "/routes/{id}"
    description: "Read one route including both committed capacity meters."
    roles: [PlatformAdmin, Dispatcher, Farrier]
    code: 200
    input: []
    output: Route
    side_effects: []
  - method: POST
    path: "/routes/{id}/plan"
    description: "Move a DRAFT route to PLANNED."
    roles: [Dispatcher]
    code: 200
    input: []
    output: Route
    side_effects:
      - "increments Route.version by 1"
  - method: POST
    path: "/routes/{id}/dispatch"
    description: "Send the route out; stop insert, reorder, attach and detach are refused from here on."
    roles: [Dispatcher]
    code: 200
    input: []
    output: Route
    side_effects:
      - "increments Route.version by 1"
  - method: POST
    path: "/routes/{id}/close"
    description: "Close a dispatched route once every stop is COMPLETED or VOIDED."
    roles: [Dispatcher]
    code: 200
    input: []
    output: Route
    side_effects:
      - "increments Route.version by 1"
  - method: POST
    path: "/routes/{id}/cancel"
    description: "Cancel a DRAFT or PLANNED route, voiding its stops and freeing every attachment."
    roles: [Dispatcher]
    code: 200
    input: []
    output: Route
    side_effects:
      - "PENDING stops move to VOIDED"
      - "attached appointments detach to UNROUTED and their RESERVED reservations move to RELEASED"
      - "increments Route.version by 1"

  # ----- RouteStop -----
  - method: POST
    path: "/routes/{id}/stops"
    description: "Add a stop at a barn with a contiguous sequence index and a planned start minute."
    roles: [Dispatcher]
    code: 201
    input: [barn_id, sequence_index, planned_start_minute]
    output: RouteStop
    side_effects:
      - "RouteStop.travel_minutes set by calculations.stop_travel_minutes"
      - "Route.committed_minutes += travel_minutes; Route.stop_count += 1"
      - "increments Route.version by 1"
  - method: GET
    path: "/route-stops"
    description: "List stops with foreign-key filters."
    roles: [PlatformAdmin, Dispatcher, Farrier]
    code: 200
    input: ["route_id?", "barn_id?", "status?", "limit?", "offset?"]
    output: RouteStop[]
    side_effects: []
  - method: GET
    path: "/route-stops/{id}"
    description: "Read one stop including its trip fee and billable horse count."
    roles: [PlatformAdmin, Dispatcher, Farrier]
    code: 200
    input: []
    output: RouteStop
    side_effects: []
  - method: POST
    path: "/route-stops/{id}/reorder"
    description: "Move a stop one place earlier or later and re-plan its start minute."
    roles: [Dispatcher]
    code: 200
    input: [direction, planned_start_minute]
    output: RouteStop
    side_effects:
      - "the swapped sibling's sequence_index is exchanged with this stop's"
      - "increments Route.version by 1"
  - method: POST
    path: "/route-stops/{id}/arrive"
    description: "Farrier arrives at the stop."
    roles: [Farrier]
    code: 200
    input: []
    output: RouteStop
    side_effects:
      - "increments RouteStop.version by 1"
  - method: POST
    path: "/route-stops/{id}/complete"
    description: "Close out the stop; pins the trip fee and allocates it across the billable horses."
    roles: [Farrier]
    code: 200
    input: []
    output: RouteStop
    side_effects:
      - "RouteStop.trip_fee_cents pinned from the effective rate card for Route.route_date"
      - "RouteStop.billable_horse_count recomputed"
      - "calculations.trip_fee_allocation writes Invoice.trip_fee_share_cents and a TRIP_FEE InvoiceLine on every billable appointment's invoice, then re-runs calculations.invoice_build on each"
      - "increments RouteStop.version by 1"
  - method: POST
    path: "/route-stops/{id}/appointments"
    description: "Attach an UNROUTED appointment to this stop; reserves shoe pairs and consumes route capacity."
    roles: [Dispatcher]
    code: 200
    input: [appointment_id, expected_route_version]
    output: Appointment
    side_effects:
      - "Appointment.route_stop_id set; Appointment.status UNROUTED -> SCHEDULED"
      - "one ShoeReservation per distinct sku_id created RESERVED (or an existing RELEASED one re-RESERVED), moving pairs from available to reserved in the farrier's van bucket"
      - "Route.committed_units and Route.committed_minutes rise; RouteStop.service_minutes and end_minute rise"
      - "two Reminder rows minted PENDING"
      - "Appointment.estimated_total_cents refreshed"
      - "increments Route.version by 1"
      - "increments Appointment.version by 1"
  - method: DELETE
    path: "/route-stops/{id}/appointments/{appointment_id}"
    description: "Detach an appointment from the stop, releasing its reservations and route capacity."
    roles: [Dispatcher]
    code: 200
    input: []
    output: Appointment
    side_effects:
      - "Appointment.route_stop_id = null; status -> UNROUTED"
      - "RESERVED reservations move to RELEASED"
      - "Route.committed_units and Route.committed_minutes fall by exactly what the attach added"
      - "increments Route.version by 1"
      - "increments Appointment.version by 1"

  # ----- Appointment -----
  - method: POST
    path: "/appointments"
    description: "Create an UNROUTED appointment for a horse on a target date."
    roles: [Dispatcher, ClientUser]
    code: 201
    input: [horse_id, scheduled_date, "vet_present?"]
    output: Appointment
    side_effects: []
  - method: GET
    path: "/appointments"
    description: "List appointments with foreign-key filters."
    roles: [PlatformAdmin, Dispatcher, Farrier, ClientUser, Veterinarian, BillingClerk]
    code: 200
    input: ["horse_id?", "route_stop_id?", "origin_appointment_id?", "rate_card_id?", "status?", "billing_status?", "scheduled_date?", "limit?", "offset?"]
    output: Appointment[]
    side_effects: []
  - method: GET
    path: "/appointments/{id}"
    description: "Read one appointment including both status axes and the roll-up meters."
    roles: [PlatformAdmin, Dispatcher, Farrier, ClientUser, Veterinarian, BillingClerk]
    code: 200
    input: []
    output: Appointment
    side_effects: []
  - method: POST
    path: "/appointments/{id}/service-lines"
    description: "Set the per-limb service configuration of the visit. `lines` is a non-empty array of objects with keys limb_state_id, service_type and optional sku_id, prescription_id, with_pad. The call is ATOMIC and the array is validated in index order — the first offending element's error is returned and nothing is written. Response rows come back in the same order as the request array."
    roles: [Dispatcher, Farrier]
    code: 201
    input: [lines, expected_appointment_version]
    output: ServiceLine[]
    side_effects:
      - "Appointment.service_units and service_minutes recomputed"
      - "if attached, RouteStop.service_minutes, Route.committed_units and Route.committed_minutes recomputed and re-checked against both caps"
      - "if attached, the ShoeReservation for the sku is created or its pairs recomputed"
      - "Appointment.estimated_total_cents refreshed by the ESTIMATE variant of calculations.visit_price"
      - "increments Appointment.version by 1"
  - method: POST
    path: "/appointments/{id}/start"
    description: "Begin work on the horse at an ARRIVED stop."
    roles: [Farrier]
    code: 200
    input: []
    output: Appointment
    side_effects:
      - "increments Appointment.version by 1"
  - method: POST
    path: "/appointments/{id}/complete"
    description: "Finish the visit, naming the service lines actually performed."
    roles: [Farrier]
    code: 200
    input: [performed_service_line_ids]
    output: Appointment
    side_effects:
      - "named lines move to PERFORMED and drive their LimbState transitions; unnamed lines move to OMITTED"
      - "RESERVED reservations move to COMMITTED and the van bucket's on_hand and reserved both fall"
      - "Appointment.rate_card_id pinned by calculations.effective_rate_card_selection on the completion date"
      - "an Invoice is minted DRAFT by calculations.invoice_build; Appointment.billing_status -> INVOICED"
      - "Client.completed_visit_count += 1"
      - "Horse.last_completed_on and Horse.next_due_on recomputed; a successor Appointment plus its two Reminder rows are minted"
      - "increments Appointment.version by 1"
  - method: POST
    path: "/appointments/{id}/cancel"
    description: "Cancel a visit; the tier and fee follow calculations.cancellation_tier."
    roles: [ClientUser, Dispatcher]
    code: 200
    input: []
    output: Appointment
    side_effects:
      - "Appointment.cancellation_fee_cents set from the tier"
      - "ADVANCE and LATE detach and release; ONSITE stays attached to keep its trip-fee share"
      - "LATE and ONSITE mint a DRAFT Invoice carrying the fee line"
      - "increments Appointment.version by 1"
  - method: POST
    path: "/appointments/{id}/no-show"
    description: "Record that the horse was not presented at an ARRIVED stop."
    roles: [Farrier]
    code: 200
    input: []
    output: Appointment
    side_effects:
      - "Appointment.cancellation_fee_cents = NO_SHOW_FEE_CENTS; the appointment stays attached"
      - "RESERVED reservations move to RELEASED"
      - "a DRAFT Invoice carrying the NO_SHOW_FEE line is minted"
      - "Client.no_show_count_rolling and Client.billing_standing recomputed"
      - "increments Appointment.version by 1"
      - "increments Client.version by 1"
  - method: POST
    path: "/appointments/{id}/warranty-revisit"
    description: "Open a zero-labor follow-up visit against a completed visit."
    roles: [ClientUser, Dispatcher]
    code: 201
    input: [warranty_reason, scheduled_date]
    output: Appointment
    side_effects:
      - "a new Appointment is created UNROUTED with visit_kind WARRANTY_REVISIT and origin_appointment_id set"

  # ----- ServiceLine -----
  - method: GET
    path: "/service-lines"
    description: "List service lines with foreign-key filters."
    roles: [PlatformAdmin, Dispatcher, Farrier, Veterinarian]
    code: 200
    input: ["appointment_id?", "limb_state_id?", "prescription_id?", "sku_id?", "status?", "limit?", "offset?"]
    output: ServiceLine[]
    side_effects: []
  - method: GET
    path: "/service-lines/{id}"
    description: "Read one service line."
    roles: [PlatformAdmin, Dispatcher, Farrier, Veterinarian]
    code: 200
    input: []
    output: ServiceLine
    side_effects: []
  - method: DELETE
    path: "/service-lines/{id}"
    description: "Remove a PLANNED service line from its appointment."
    roles: [Dispatcher, Farrier]
    code: 200
    input: []
    output: ServiceLine
    side_effects:
      - "ServiceLine.status = REMOVED"
      - "Appointment roll-ups, RouteStop.service_minutes, Route totals and the ShoeReservation pairs are all recomputed"
      - "increments Appointment.version by 1"

  # ----- LamenessCase -----
  - method: POST
    path: "/lameness-cases"
    description: "Report lameness on a horse; severity at or above the threshold puts the horse on HOLD and starts CASCADE-A."
    roles: [ClientUser, Veterinarian]
    code: 201
    input: [horse_id, reported_on, severity]
    output: LamenessCase
    side_effects:
      - "when severity >= LAMENESS_HOLD_SEVERITY_THRESHOLD, hold_applied = true and CASCADE-A runs to depth 6"
  - method: GET
    path: "/lameness-cases"
    description: "List lameness cases, optionally by horse."
    roles: [PlatformAdmin, Dispatcher, Farrier, ClientUser, Veterinarian]
    code: 200
    input: ["horse_id?", "status?", "limit?", "offset?"]
    output: LamenessCase[]
    side_effects: []
  - method: GET
    path: "/lameness-cases/{id}"
    description: "Read one lameness case."
    roles: [PlatformAdmin, Dispatcher, Farrier, ClientUser, Veterinarian]
    code: 200
    input: []
    output: LamenessCase
    side_effects: []
  - method: POST
    path: "/lameness-cases/{id}/resolve"
    description: "Close the case; clears the horse hold when no other qualifying case remains."
    roles: [Veterinarian]
    code: 200
    input: []
    output: LamenessCase
    side_effects:
      - "ACTIVE prescriptions of the case move to REVOKED"
      - "Horse.hold_status recomputed; BLOCKED appointments move to UNROUTED"
      - "increments LamenessCase.version by 1"
  - method: POST
    path: "/lameness-cases/{id}/reopen"
    description: "Reopen a resolved case."
    roles: [Veterinarian]
    code: 200
    input: []
    output: LamenessCase
    side_effects:
      - "Horse.hold_status recomputed"
      - "increments LamenessCase.version by 1"

  # ----- VetPrescription -----
  - method: POST
    path: "/vet-prescriptions"
    description: "Draft a therapeutic prescription against a lameness case."
    roles: [Veterinarian]
    code: 201
    input: [lameness_case_id, issued_on, expires_on, limb_scope, prescribed_cycle_weeks]
    output: VetPrescription
    side_effects: []
  - method: GET
    path: "/vet-prescriptions"
    description: "List prescriptions with foreign-key filters."
    roles: [PlatformAdmin, Dispatcher, Farrier, ClientUser, Veterinarian]
    code: 200
    input: ["lameness_case_id?", "horse_id?", "status?", "limit?", "offset?"]
    output: VetPrescription[]
    side_effects: []
  - method: GET
    path: "/vet-prescriptions/{id}"
    description: "Read one prescription."
    roles: [PlatformAdmin, Dispatcher, Farrier, ClientUser, Veterinarian]
    code: 200
    input: []
    output: VetPrescription
    side_effects: []
  - method: POST
    path: "/vet-prescriptions/{id}/activate"
    description: "Make the prescription live, superseding any sibling already ACTIVE on the same case."
    roles: [Veterinarian]
    code: 200
    input: [expected_lameness_case_version]
    output: VetPrescription
    side_effects:
      - "any sibling ACTIVE prescription of the same case moves to SUPERSEDED"
      - "Horse.active_prescription_id set; Horse.next_due_on recomputed with the THERAPEUTIC variant"
      - "LamenessCase.status -> PRESCRIBED"
      - "increments VetPrescription.version by 1"
      - "increments LamenessCase.version by 1"
  - method: POST
    path: "/vet-prescriptions/{id}/revoke"
    description: "Withdraw a live prescription; the routine cycle takes over again."
    roles: [Veterinarian]
    code: 200
    input: []
    output: VetPrescription
    side_effects:
      - "Horse.active_prescription_id = null; Horse.next_due_on recomputed with the ROUTINE variant"
      - "increments VetPrescription.version by 1"

  # ----- Invoice -----
  - method: GET
    path: "/invoices"
    description: "List invoices with foreign-key filters."
    roles: [PlatformAdmin, BillingClerk, ClientUser, Dispatcher]
    code: 200
    input: ["appointment_id?", "client_id?", "rate_card_id?", "status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []
  - method: GET
    path: "/invoices/{id}"
    description: "Read one invoice with the full money breakdown."
    roles: [PlatformAdmin, BillingClerk, ClientUser, Dispatcher]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: GET
    path: "/invoices/{id}/lines"
    description: "List the lines of one invoice."
    roles: [PlatformAdmin, BillingClerk, ClientUser, Dispatcher]
    code: 200
    input: ["line_kind?", "limit?", "offset?"]
    output: InvoiceLine[]
    side_effects: []
  - method: POST
    path: "/invoices/{id}/issue"
    description: "Issue a DRAFT invoice to the client."
    roles: [BillingClerk]
    code: 200
    input: []
    output: Invoice
    side_effects:
      - "Invoice.issued_on = the logical clock date"
      - "increments Invoice.version by 1"
  - method: POST
    path: "/invoices/{id}/void"
    description: "Void an unpaid invoice."
    roles: [BillingClerk]
    code: 200
    input: []
    output: Invoice
    side_effects:
      - "Appointment.billing_status -> VOIDED"
      - "increments Invoice.version by 1"

  # ----- Reminder -----
  - method: GET
    path: "/reminders"
    description: "List reminders, optionally by appointment."
    roles: [PlatformAdmin, Dispatcher, ClientUser]
    code: 200
    input: ["appointment_id?", "status?", "limit?", "offset?"]
    output: Reminder[]
    side_effects: []
  - method: GET
    path: "/reminders/{id}"
    description: "Read one reminder."
    roles: [PlatformAdmin, Dispatcher, ClientUser]
    code: 200
    input: []
    output: Reminder
    side_effects: []
  - method: POST
    path: "/reminders/{id}/send"
    description: "Attempt delivery of a PENDING or FAILED reminder."
    roles: [Dispatcher]
    code: 200
    input: [delivery_outcome]
    output: Reminder
    side_effects:
      - "DELIVERED sets status SENT and sent_on; FAILED sets status FAILED and leaves sent_on null"
      - "increments Reminder.version by 1"
  - method: POST
    path: "/reminders/{id}/acknowledge"
    description: "Client acknowledges a SENT reminder, confirming the appointment."
    roles: [ClientUser]
    code: 200
    input: []
    output: Reminder
    side_effects:
      - "Reminder.status = ACKNOWLEDGED"
      - "the Appointment moves SCHEDULED -> CONFIRMED"
      - "increments Reminder.version by 1"
      - "increments Appointment.version by 1"

  # ----- logical clock (test-driving endpoint) -----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the clock reads exactly 2026-05-01T00:00:00Z (DEFAULT_CLOCK_UTC) and never falls back to real wall-clock time. Advancing the clock expires prescriptions (CASCADE-D), ages the no-show rolling window and re-derives every client's billing_standing."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, expired_prescription_ids: string[], restanding_client_ids: string[] }"
    side_effects:
      - "every ACTIVE VetPrescription with expires_on < the new date moves to EXPIRED and CASCADE-D runs to depth 5"
      - "calculations.no_show_rolling_count and calculations.client_billing_standing are re-run for every client"

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog — 53 codes.
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the six declared roles."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The caller's role is not in the endpoint's roles set."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An entity-backed role acts on a resource it does not own — a ClientUser on another client's horse or invoice, a Farrier on another farrier's route or stop."
  - id: ERR_BARN_NOT_FOUND
    http: 404
    condition: "A Barn id in the path or body matches no Barn."
  - id: ERR_CLIENT_NOT_FOUND
    http: 404
    condition: "A Client id in the path or body matches no Client."
  - id: ERR_HORSE_NOT_FOUND
    http: 404
    condition: "A Horse id in the path or body matches no Horse."
  - id: ERR_FARRIER_NOT_FOUND
    http: 404
    condition: "A Farrier id in the path or body matches no Farrier."
  - id: ERR_SKU_NOT_FOUND
    http: 404
    condition: "A ShoeSku id in the path or body matches no ShoeSku."
  - id: ERR_BUCKET_NOT_FOUND
    http: 404
    condition: "An InventoryBucket id in the path or body matches no bucket."
  - id: ERR_TRANSFER_NOT_FOUND
    http: 404
    condition: "A StockTransfer id in the path matches no transfer."
  - id: ERR_RESERVATION_NOT_FOUND
    http: 404
    condition: "A ShoeReservation id in the path matches no reservation."
  - id: ERR_RATE_CARD_NOT_FOUND
    http: 404
    condition: "A RateCard id in the path or in supersedes_rate_card_id matches no card."
  - id: ERR_ROUTE_NOT_FOUND
    http: 404
    condition: "A Route id in the path matches no route."
  - id: ERR_ROUTE_STOP_NOT_FOUND
    http: 404
    condition: "A RouteStop id in the path matches no stop."
  - id: ERR_APPOINTMENT_NOT_FOUND
    http: 404
    condition: "An Appointment id in the path or body matches no appointment, or the appointment named in a detach is not attached to that stop."
  - id: ERR_SERVICE_LINE_NOT_FOUND
    http: 404
    condition: "A ServiceLine id in the path, or an id inside performed_service_line_ids, matches no line of that appointment."
  - id: ERR_LAMENESS_CASE_NOT_FOUND
    http: 404
    condition: "A LamenessCase id in the path or body matches no case."
  - id: ERR_PRESCRIPTION_NOT_FOUND
    http: 404
    condition: "A VetPrescription id in the path or in a service line's prescription_id matches no prescription."
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "An Invoice id in the path matches no invoice."
  - id: ERR_REMINDER_NOT_FOUND
    http: 404
    condition: "A Reminder id in the path matches no reminder."
  - id: ERR_VALIDATION
    http: 400
    condition: "A required field is absent or mistyped, or a declared field-combination rule is broken (sku_id present for a TRIM line, prescription_id absent on a CORRECTIVE line, with_pad true on a RESET or GLUE_ON line, an empty served_weekdays or limb_scope, a warranty_reason on a ROUTINE visit)."
  - id: ERR_INVALID_ENUM
    http: 422
    condition: "An enum-valued field carries a value outside its declared member list. The routing list at validations priority 22 is exhaustive and closed."
  - id: ERR_VALUE_OUT_OF_RANGE
    http: 422
    condition: "A numeric or date field falls outside its declared range, including pagination limit and a non-contiguous sequence_index."
  - id: ERR_STALE_ROUTE_VERSION
    http: 412
    condition: "expected_route_version does not equal Route.version on attach."
  - id: ERR_STALE_APPOINTMENT_VERSION
    http: 412
    condition: "expected_appointment_version does not equal Appointment.version on service-line add."
  - id: ERR_STALE_CASE_VERSION
    http: 412
    condition: "expected_lameness_case_version does not equal LamenessCase.version on prescription activation."
  - id: ERR_STALE_CLIENT_VERSION
    http: 412
    condition: "expected_client_version does not equal Client.version on payment application."
  - id: ERR_FARRIER_INACTIVE
    http: 409
    condition: "GATE 1a — the farrier owning the route in scope has status INACTIVE or DECERTIFIED."
  - id: ERR_FARRIER_CERT_EXPIRED
    http: 409
    condition: "GATE 1b — that farrier's cert_expires_on is strictly before the logical clock date."
  - id: ERR_ROUTE_NOT_OPEN
    http: 409
    condition: "GATE 2 — the route is DISPATCHED, CLOSED or CANCELLED and no longer accepts stop insert, reorder, attach or detach."
  - id: ERR_CLIENT_PREPAY_REQUIRED
    http: 402
    condition: "GATE 3 — the client is PREPAY_REQUIRED with a deposit below PREPAY_DEPOSIT_MIN_CENTS, or SUSPENDED."
  - id: ERR_HORSE_ON_HOLD
    http: 409
    condition: "GATE 4 — the horse is on lameness HOLD and the work requested is not corrective work under a live prescription."
  - id: ERR_APPOINTMENT_NOT_ELIGIBLE
    http: 409
    condition: "GATE 5 — the appointment's status is outside the endpoint's eligible set."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "A transition precondition fails on an entity that is neither an Appointment nor a gate-2 Route — a retired horse, a resolved case being resolved again, a DRAFT prescription being revoked, a RECEIVED transfer being dispatched, a PAID invoice being voided, an ACKNOWLEDGED reminder being sent, a stop being arrived at out of sequence."
  - id: ERR_CREDENTIAL_INSUFFICIENT
    http: 403
    condition: "The route's farrier certification level does not cover a service type on the appointment."
  - id: ERR_NO_LIVE_PRESCRIPTION
    http: 422
    condition: "A CORRECTIVE service line names no prescription that is live on the appointment's scheduled_date."
  - id: ERR_LIMB_NOT_IN_PRESCRIPTION_SCOPE
    http: 422
    condition: "The named prescription is live but its limb_scope does not contain the service line's limb."
  - id: ERR_RESET_REQUIRES_SHOD_LIMB
    http: 422
    condition: "A RESET service line targets a limb whose shoeing_state is BAREFOOT."
  - id: ERR_RESET_LIMIT_REACHED
    http: 409
    condition: "A RESET service line targets a limb whose consecutive_reset_count already equals MAX_CONSECUTIVE_RESETS."
  - id: ERR_DUPLICATE_LIMB_LINE
    http: 409
    condition: "The appointment already carries a PLANNED or PERFORMED service line for that limb."
  - id: ERR_WARRANTY_WINDOW_EXPIRED
    http: 422
    condition: "A warranty revisit is requested more than WARRANTY_WINDOW_DAYS after the origin visit's completed_on."
  - id: ERR_BARN_MISMATCH
    http: 422
    condition: "The stop's barn_id differs from the horse's barn_id on attach."
  - id: ERR_BARN_WEEKDAY_NOT_SERVED
    http: 422
    condition: "The route_date's weekday is not in the stop barn's served_weekdays."
  - id: ERR_BARN_BLACKOUT_DATE
    http: 422
    condition: "The route_date is listed in the stop barn's blackout_dates."
  - id: ERR_OUTSIDE_ACCESS_WINDOW
    http: 422
    condition: "The stop starts before the barn opens, or would end after the barn closes once the appointment's minutes are added."
  - id: ERR_STOP_TIME_CONFLICT
    http: 409
    condition: "A stop begins before its predecessor's end plus the stop's own travel buffer."
  - id: ERR_SEDATION_VET_REQUIRED
    http: 422
    condition: "The horse requires sedation but the appointment does not carry vet_present true."
  - id: ERR_REMINDER_SUPPRESSED
    http: 409
    condition: "A sibling reminder of the same appointment was sent inside REMINDER_SUPPRESSION_WINDOW_DAYS, or the appointment is not in an eligible status."
  - id: ERR_ROUTE_UNIT_CAPACITY_EXCEEDED
    http: 409
    condition: "The attach would push Route.committed_units above ROUTE_MAX_UNITS_PER_DAY."
  - id: ERR_ROUTE_MINUTE_CAPACITY_EXCEEDED
    http: 409
    condition: "The stop insert or attach would push Route.committed_minutes above ROUTE_MAX_MINUTES_PER_DAY."
  - id: ERR_VAN_STOCK_INSUFFICIENT
    http: 409
    condition: "The farrier's van bucket lacks the pairs the appointment's service lines require."
  - id: ERR_SHOP_STOCK_INSUFFICIENT
    http: 409
    condition: "The shop bucket lacks the pairs a transfer dispatch would move."
  - id: ERR_NO_EFFECTIVE_RATE_CARD
    http: 422
    condition: "No RateCard with status ACTIVE or SUPERSEDED has effective_from on or before the service date."

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix — peer roles, six of them.
# ---------------------------------------------------------------------------
roles:
  - name: PlatformAdmin
    description: "Sets up the reference data — barns, farriers, shoe SKUs, rate cards, stock and the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /barns"
      - "POST /clients"
      - "POST /farriers"
      - "POST /farriers/{id}/deactivate"
      - "POST /farriers/{id}/reactivate"
      - "POST /farriers/{id}/recertify"
      - "POST /shoe-skus"
      - "POST /rate-cards"
      - "POST /rate-cards/{id}/activate"
      - "POST /inventory-buckets/{id}/adjust"
      - "POST /stock-transfers/{id}/dispatch"
      - "POST /stock-transfers/{id}/abort"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /horses"
      - "PATCH /horses/{id}"
      - "POST /horses/{id}/retire"
      - "POST /horses/{id}/reinstate"
      - "POST /stock-transfers"
      - "POST /stock-transfers/{id}/receive"
      - "all GET endpoints except the client-money reads it shares with BillingClerk"
  - name: Dispatcher
    description: "Builds routes, places stops, attaches horses and drives reminders."
    identity: "opaque"
    exclusive_operations:
      - "POST /routes"
      - "POST /routes/{id}/plan"
      - "POST /routes/{id}/dispatch"
      - "POST /routes/{id}/close"
      - "POST /routes/{id}/cancel"
      - "POST /routes/{id}/stops"
      - "POST /route-stops/{id}/reorder"
