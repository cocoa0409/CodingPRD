        grounds:
          - validations[priority=39]
          - errors[ERR_CIP_EXCLUSIVITY_CONFLICT]
          - entities.Program.fields.launch_window_start
          - entities.Program.fields.launch_window_end
          - entities.Partnership.fields.exclusivity_cip_codes
