  - rule_id: transitive_cascade
    instances:
      - name: sample_conclusion_cascades_exception_to_control_to_gap_to_posture
        grounds:
          - state_machines.AuditSample.TESTING_to_CONCLUDED_EXCEPTIONS
          - state_machines.Control.operating_status.IN_OBSERVATION_to_TESTED_EXCEPTION
          - state_machines.Gap.initial_state
          - calculations.gap_debt_points
          - calculations.engagement_gap_posture
          - entities.Gap.fields.audit_exception_id
        distinguishing_aspect: |
          DEPTH 4 from the conclude trigger: (1) the sample creates one AuditException; (2) the
          existence of that exception row moves Control.operating_status to TESTED_EXCEPTION and
          raises Engagement.open_exception_count; (3) the control entering TESTED_EXCEPTION creates
          one EXCEPTION_CASCADE Gap carrying audit_exception_id; (4) that Gap creation recomputes
          gap_debt_points to 8.00 and flips gap_posture OPEN -> RESTRICTED. Each link is caused by the
          previous link, not by the conclude call itself.
        test_recipe:
          setup:
            - "Engagement 'Northwind' (SOC_2_TYPE_2, categories [SECURITY]) is in FIELDWORK with zero gaps, open_exception_count 0 and gap_posture OPEN."
            - "Control S-01 (QUARTERLY / MANUAL / MODERATE, population_size 20) is DESIGN_APPROVED and IN_OBSERVATION."
            - "Its AuditSample has sample_size 4, allowed_deviations 0, three PASS items and one FAIL item recorded, status TESTING."
          setup_api_calls:
            - call: "POST /soc/trust-criteria"
              payload: { criterion_code: "CC1.1", category: "SECURITY", title: "Control environment", min_primary_controls: 1, applies_to_report_types: ["SOC_2_TYPE_2"] }
