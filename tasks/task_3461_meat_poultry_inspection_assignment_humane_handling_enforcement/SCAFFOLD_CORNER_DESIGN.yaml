# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_3461 meat & poultry inspection
# Breadth probe over §1.1-§1.7; §1.8-covered corners appear as excluded stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: establishment_create_returns_declared_defaults
        claim_type: Creation
        grounds:
          - entities.Establishment
          - endpoints.POST_/inspection/establishments
        distinguishing_aspect: "A minimal create returns 201 with grant_status UNGRANTED, inspection_status INACTIVE, pathogen_category null, open_nr_count 0, suspension_count 0, version 1 — all system/computed fields are server-owned."
        test_recipe:
          setup: ["Logical clock at default 2026-09-01T00:00:00Z. Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /inspection/establishments"
              payload: { name: "C1 Beef Plant", species_classes: ["CATTLE"], slaughter_capable: true }
              as: ProgramAdministrator
              captures: { est_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Establishment.${est_id}.grant_status == UNGRANTED and inspection_status == INACTIVE"
            - "Establishment.${est_id}.pathogen_category is null and open_nr_count == 0 and suspension_count == 0"
            - "Establishment.${est_id}.version == 1 and id / created_at / updated_at are present"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: grant_application_create_defaults_findings_pending
        claim_type: Defaults
        grounds:
          - entities.GrantApplication.fields.facility_finding
          - entities.GrantApplication.fields.revision_count
        distinguishing_aspect: "All three adequacy findings default to PENDING, revision_count to 0, status to SUBMITTED, decided_at null — none are client-suppliable."
        test_recipe:
          setup: ["Clock default. One establishment."]
          setup_api_calls:
            - call: "POST /inspection/establishments"
              payload: { name: "C2 Pork Plant", species_classes: ["SWINE"], slaughter_capable: false }
              as: ProgramAdministrator
              captures: { est_id: $.data.id }
          trigger:
            - call: "POST /inspection/grant-applications"
              payload: { establishment_id: "${est_id}", facility_doc_ref: "doc-fac-1", sanitation_plan_ref: "doc-san-1", haccp_plan_ref: "doc-hac-1" }
              as: EstablishmentManager
              as_user_id: "${est_id}"
              captures: { ga_id: $.data.id }
          assert:
            - "the response status is 201"
            - "GrantApplication.${ga_id}.facility_finding == PENDING and sanitation_finding == PENDING and haccp_finding == PENDING"
            - "GrantApplication.${ga_id}.revision_count == 0 and status == SUBMITTED and decided_at is null"

      - name: noncompliance_records_list_paginates
        claim_type: Listing
        grounds:
          - endpoints.GET_/inspection/noncompliance-records
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With 3 NRs on file, limit=2 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false — total_count counts the filtered set, not the page."
        test_recipe:
          setup: ["Clock default. Establishment granted; inspector; 3 SANITATION NRs issued."]
          setup_api_calls:
            - call: "POST /inspection/establishments"
              payload: { name: "C3 Plant", species_classes: ["CATTLE"], slaughter_capable: true }
              as: ProgramAdministrator
              captures: { est_id: $.data.id }
            - call: "POST /inspection/inspectors"
              payload: { full_name: "Ina Inspector", badge_number: "B-C301", species_qualifications: ["CATTLE"] }
              as: ProgramAdministrator
              captures: { insp_id: $.data.id }
            - call: "POST /inspection/noncompliance-records"
              payload: { establishment_id: "${est_id}", issued_by_inspector_id: "${insp_id}", regulation_family: "SANITATION", description: "nr one", observed_at: "2026-08-30T06:00:00Z" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspection/noncompliance-records"
              payload: { establishment_id: "${est_id}", issued_by_inspector_id: "${insp_id}", regulation_family: "SANITATION", description: "nr two", observed_at: "2026-08-30T07:00:00Z" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspection/noncompliance-records"
              payload: { establishment_id: "${est_id}", issued_by_inspector_id: "${insp_id}", regulation_family: "SANITATION", description: "nr three", observed_at: "2026-08-30T08:00:00Z" }
              as: Inspector
              as_user_id: "${insp_id}"
          trigger:
            - call: "GET /inspection/noncompliance-records"
              payload: { establishment_id: "${est_id}", limit: 2, offset: 0 }
              as: DistrictManager
          assert:
            - "the response status is 200 and response_type is array"
            - "page 1 returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /inspection/noncompliance-records?establishment_id=${est_id}&limit=2&offset=2 returns exactly 1 row with has_more == false"
            - "GET /inspection/noncompliance-records?establishment_id=${est_id} with no pagination params returns 3 rows (defaults limit=10, offset=0)"

      - name: establishment_get_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/inspection/establishments/{id}
          - errors.ERR_ESTABLISHMENT_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unallocated UUID yields the entity-specific ERR_ESTABLISHMENT_NOT_FOUND (404), not a generic 400."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "GET /inspection/establishments/00000000-0000-4000-8000-000000000000"
              as: DistrictManager
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_ESTABLISHMENT_NOT_FOUND"
            - "response_type is error and data carries error_id and message"

      - name: establishment_create_missing_species_classes_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Establishment.fields.species_classes
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "species_classes is required input with no default; omitting it is a 400 ERR_INVALID_REQUEST and no row is created."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /inspection/establishments"
              payload: { name: "No Species Plant", slaughter_capable: true }
              as: ProgramAdministrator
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"

      - name: recall_effectiveness_check_is_append_only_without_version
        claim_type: Immutability
        grounds:
          - entities.RecallEffectivenessCheck
        distinguishing_aspect: "RecallEffectivenessCheck declares common_fields: false — the response carries id and created_at but NO version and NO updated_at; there is no update endpoint in §1.5."
        test_recipe:
          setup: ["Clock default. Establishment granted; recall INITIATED -> CLASS_DETERMINED (CLASS_III)."]
          setup_api_calls:
            - call: "POST /inspection/establishments"
              payload: { name: "C6 Plant", species_classes: ["CATTLE"], slaughter_capable: true }
              as: ProgramAdministrator
              captures: { est_id: $.data.id }
            - call: "POST /inspection/recalls"
              payload: { establishment_id: "${est_id}", product_description: "ground beef lot 7", quantity_lbs: 1200.5, reason_code: "PATHOGEN" }
              as: RecallCoordinator
              captures: { rc_id: $.data.id }
            - call: "POST /inspection/recalls/${rc_id}/determine-class"
              payload: { recall_class: "CLASS_III" }
              as: DistrictManager
          trigger:
            - call: "POST /inspection/recalls/${rc_id}/effectiveness-checks"
              payload: { consignee_name: "Depot One", outcome: "EFFECTIVE", checked_at: "2026-09-01T09:00:00Z" }
              as: RecallCoordinator
              captures: { chk_id: $.data.id }
          assert:
            - "the response status is 201"
            - "RecallEffectivenessCheck.${chk_id} carries id and created_at"
            - "the response data does NOT contain a version field and does NOT contain an updated_at field"
            - "RecallEffectivenessCheck.${chk_id}.outcome == EFFECTIVE and consignee_name == \"Depot One\""

      - name: shift_assignment_denormalizes_establishment_from_window
        claim_type: Computed Fields
        grounds:
          - entities.ShiftAssignment.fields.establishment_id
          - endpoints.POST_/inspection/shift-windows/{id}/assignments
        distinguishing_aspect: "establishment_id is source: computed and is NOT an assignment input; the response's establishment_id equals the window's establishment, and a client-supplied establishment_id in the payload is rejected or ignored — never divergent."
        test_recipe:
          setup: ["Clock default. Establishment granted; window PLANNED 06:00-14:00; qualified inspector."]
          setup_api_calls:
            - call: "POST /inspection/establishments"
              payload: { name: "C7 Plant", species_classes: ["CATTLE"], slaughter_capable: true }
              as: ProgramAdministrator
              captures: { est_id: $.data.id }
            - call: "POST /inspection/grant-applications"
              payload: { establishment_id: "${est_id}", facility_doc_ref: "doc-fac-1", sanitation_plan_ref: "doc-san-1", haccp_plan_ref: "doc-hac-1" }
              as: EstablishmentManager
              as_user_id: "${est_id}"
              captures: { ga_c7: $.data.id }
            - call: "POST /inspection/grant-applications/${ga_c7}/begin-review"
              as: DistrictManager
            - call: "POST /inspection/grant-applications/${ga_c7}/record-adequacy"
              payload: { dimension: "FACILITY", finding: "ADEQUATE" }
              as: DistrictManager
            - call: "POST /inspection/grant-applications/${ga_c7}/record-adequacy"
              payload: { dimension: "SANITATION", finding: "ADEQUATE" }
              as: DistrictManager
            - call: "POST /inspection/grant-applications/${ga_c7}/record-adequacy"
              payload: { dimension: "HACCP", finding: "ADEQUATE" }
              as: DistrictManager
            - call: "POST /inspection/grant-applications/${ga_c7}/decide"
              payload: { decision: "GRANT" }
              as: DistrictManager
            - call: "POST /inspection/inspectors"
              payload: { full_name: "Ina Inspector", badge_number: "B-C701", species_qualifications: ["CATTLE"] }
              as: ProgramAdministrator
              captures: { insp_id: $.data.id }
            - call: "POST /inspection/shift-windows"
              payload: { establishment_id: "${est_id}", start_utc: "2026-09-02T06:00:00Z", end_utc: "2026-09-02T14:00:00Z", shift_type: "PROCESSING", planned_line_count: 1 }
              as: EstablishmentManager
              as_user_id: "${est_id}"
              captures: { sw_id: $.data.id, sw_v: $.data.version }
          trigger:
            - call: "POST /inspection/shift-windows/${sw_id}/assignments"
              payload: { inspector_id: "${insp_id}", line_index: 1, start_utc: "2026-09-02T06:00:00Z", end_utc: "2026-09-02T10:00:00Z", expected_shift_window_version: "${sw_v}" }
              as: ProgramAdministrator
              captures: { a1: $.data.id }
          assert:
            - "the response status is 201"
            - "ShiftAssignment.${a1}.establishment_id == ${est_id} (denormalized from the window, not from any payload field)"
            - "ShiftAssignment.${a1}.status == SCHEDULED"

      - name: recall_determine_class_sets_derived_requirements
        claim_type: Retrieval
        grounds:
          - entities.Recall.fields.required_min_checks
          - entities.Recall.fields.required_effectiveness_ratio
          - endpoints.GET_/inspection/recalls/{id}
        distinguishing_aspect: "GET after determine-class round-trips the class-derived fields: CLASS_I sets required_min_checks 10 and required_effectiveness_ratio 0.95; effectiveness_ratio is null before any check."
        test_recipe:
          setup: ["Clock default. Establishment granted; recall INITIATED."]
          setup_api_calls:
            - call: "POST /inspection/establishments"
              payload: { name: "C8 Plant", species_classes: ["CATTLE"], slaughter_capable: true }
              as: ProgramAdministrator
              captures: { est_id: $.data.id }
            - call: "POST /inspection/recalls"
              payload: { establishment_id: "${est_id}", product_description: "trim lot 9", quantity_lbs: 800, reason_code: "PATHOGEN" }
              as: RecallCoordinator
              captures: { rc_id: $.data.id }
          trigger:
            - call: "POST /inspection/recalls/${rc_id}/determine-class"
              payload: { recall_class: "CLASS_I" }
              as: DistrictManager
            - call: "GET /inspection/recalls/${rc_id}"
              as: RecallCoordinator
          assert:
            - "Recall.${rc_id}.recall_class == CLASS_I and status == CLASS_DETERMINED"
            - "Recall.${rc_id}.required_min_checks == 10 and required_effectiveness_ratio == 0.95"
            - "Recall.${rc_id}.checks_performed == 0 and checks_effective == 0 and effectiveness_ratio is null"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: grant_decide_with_deficient_finding_blocked
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.GrantApplication.UNDER_REVIEW_to_GRANTED
          - errors.ERR_GRANT_DECISION_BLOCKED
        distinguishing_aspect: "GRANT with two ADEQUATE findings but HACCP DEFICIENT is blocked with ERR_GRANT_DECISION_BLOCKED; the same application can still be DENIED, proving the block is grant-specific, not a freeze."
        test_recipe:
          setup: ["Clock default. Establishment; application UNDER_REVIEW with FACILITY ADEQUATE, SANITATION ADEQUATE, HACCP DEFICIENT."]
          setup_api_calls:
            - call: "POST /inspection/establishments"
              payload: { name: "SM1 Plant", species_classes: ["CATTLE"], slaughter_capable: true }
              as: ProgramAdministrator
              captures: { est_id: $.data.id }
            - call: "POST /inspection/grant-applications"
              payload: { establishment_id: "${est_id}", facility_doc_ref: "doc-fac-1", sanitation_plan_ref: "doc-san-1", haccp_plan_ref: "doc-hac-1" }
              as: EstablishmentManager
              as_user_id: "${est_id}"
              captures: { ga_id: $.data.id }
            - call: "POST /inspection/grant-applications/${ga_id}/begin-review"
              as: DistrictManager
            - call: "POST /inspection/grant-applications/${ga_id}/record-adequacy"
              payload: { dimension: "FACILITY", finding: "ADEQUATE" }
              as: DistrictManager
            - call: "POST /inspection/grant-applications/${ga_id}/record-adequacy"
              payload: { dimension: "SANITATION", finding: "ADEQUATE" }
              as: DistrictManager
            - call: "POST /inspection/grant-applications/${ga_id}/record-adequacy"
              payload: { dimension: "HACCP", finding: "DEFICIENT" }
              as: DistrictManager
          trigger:
            - call: "POST /inspection/grant-applications/${ga_id}/decide"
              payload: { decision: "GRANT" }
              as: DistrictManager
              captures: { error_id: $.data.error_id }
            - call: "POST /inspection/grant-applications/${ga_id}/decide"
              payload: { decision: "DENY" }
              as: DistrictManager
          assert:
            - "GRANT attempt: response status 409 and error_id == ERR_GRANT_DECISION_BLOCKED"
            - "application remains UNDER_REVIEW after the blocked grant"
            - "subsequent DENY returns 200 and GrantApplication.${ga_id}.status == DENIED"

      - name: grant_resubmit_cycle_resets_findings
        claim_type: Valid Transition
        grounds:
          - state_machines.GrantApplication.DENIED_to_SUBMITTED
        distinguishing_aspect: "The DENIED -> SUBMITTED cycle edge increments revision_count to 1, resets all three findings to PENDING, and replaces document references."
        test_recipe:
          setup: ["Clock default. Establishment; application DENIED after a DEFICIENT sanitation finding."]
          setup_api_calls:
            - call: "POST /inspection/establishments"
              payload: { name: "SM2 Plant", species_classes: ["CATTLE"], slaughter_capable: true }
              as: ProgramAdministrator
              captures: { est_id: $.data.id }
            - call: "POST /inspection/grant-applications"
              payload: { establishment_id: "${est_id}", facility_doc_ref: "doc-fac-1", sanitation_plan_ref: "doc-san-1", haccp_plan_ref: "doc-hac-1" }
              as: EstablishmentManager
              as_user_id: "${est_id}"
              captures: { ga_id: $.data.id }
            - call: "POST /inspection/grant-applications/${ga_id}/begin-review"
              as: DistrictManager
            - call: "POST /inspection/grant-applications/${ga_id}/record-adequacy"
              payload: { dimension: "SANITATION", finding: "DEFICIENT" }
              as: DistrictManager
            - call: "POST /inspection/grant-applications/${ga_id}/decide"
              payload: { decision: "DENY" }
              as: DistrictManager
          trigger:
            - call: "POST /inspection/grant-applications/${ga_id}/resubmit"
              payload: { facility_doc_ref: "doc-fac-2", sanitation_plan_ref: "doc-san-2", haccp_plan_ref: "doc-hac-2" }
              as: EstablishmentManager
              as_user_id: "${est_id}"
          assert:
            - "the response status is 200 and GrantApplication.${ga_id}.status == SUBMITTED"
            - "GrantApplication.${ga_id}.revision_count == 1"
            - "all three findings are PENDING again"
            - "GrantApplication.${ga_id}.sanitation_plan_ref == \"doc-san-2\""

      - name: grant_double_decide_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.GrantApplication
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "A second decide on a terminal (GRANTED) application is rejected ERR_INVALID_STATE; the grant side effects fire exactly once."
        test_recipe:
          setup: ["Clock default. Application GRANTED with all findings ADEQUATE."]
          setup_api_calls:
            - call: "POST /inspection/establishments"
              payload: { name: "SM3 Plant", species_classes: ["CATTLE"], slaughter_capable: true }
              as: ProgramAdministrator
              captures: { est_id: $.data.id }
            - call: "POST /inspection/grant-applications"
              payload: { establishment_id: "${est_id}", facility_doc_ref: "doc-fac-1", sanitation_plan_ref: "doc-san-1", haccp_plan_ref: "doc-hac-1" }
              as: EstablishmentManager
              as_user_id: "${est_id}"
              captures: { ga_id: $.data.id }
            - call: "POST /inspection/grant-applications/${ga_id}/begin-review"
              as: DistrictManager
            - call: "POST /inspection/grant-applications/${ga_id}/record-adequacy"
              payload: { dimension: "FACILITY", finding: "ADEQUATE" }
              as: DistrictManager
            - call: "POST /inspection/grant-applications/${ga_id}/record-adequacy"
              payload: { dimension: "SANITATION", finding: "ADEQUATE" }
              as: DistrictManager
            - call: "POST /inspection/grant-applications/${ga_id}/record-adequacy"
              payload: { dimension: "HACCP", finding: "ADEQUATE" }
              as: DistrictManager
            - call: "POST /inspection/grant-applications/${ga_id}/decide"
              payload: { decision: "GRANT" }
              as: DistrictManager
          trigger:
            - call: "POST /inspection/grant-applications/${ga_id}/decide"
              payload: { decision: "DENY" }
              as: DistrictManager
              captures: { error_id: $.data.error_id }
          assert:
            - "second decide: response status 409 and error_id == ERR_INVALID_STATE"
            - "GrantApplication.${ga_id}.status remains GRANTED"

      - name: nr_respond_twice_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.NoncomplianceRecord.OPEN_to_RESPONSE_SUBMITTED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "respond is defined only from OPEN; a second respond on RESPONSE_SUBMITTED is rejected ERR_INVALID_STATE and response_text is unchanged."
        test_recipe:
          setup: ["Clock default. Establishment; inspector; one OPEN NR."]
          setup_api_calls:
            - call: "POST /inspection/establishments"
              payload: { name: "SM4 Plant", species_classes: ["CATTLE"], slaughter_capable: true }
              as: ProgramAdministrator
              captures: { est_id: $.data.id }
            - call: "POST /inspection/inspectors"
              payload: { full_name: "Ina Inspector", badge_number: "B-SM41", species_qualifications: ["CATTLE"] }
              as: ProgramAdministrator
              captures: { insp_id: $.data.id }
            - call: "POST /inspection/noncompliance-records"
              payload: { establishment_id: "${est_id}", issued_by_inspector_id: "${insp_id}", regulation_family: "HACCP", description: "ccp deviation", observed_at: "2026-08-31T06:00:00Z" }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { nr1: $.data.id }
            - call: "POST /inspection/noncompliance-records/${nr1}/respond"
              payload: { response_text: "corrective action taken" }
              as: EstablishmentManager
              as_user_id: "${est_id}"
          trigger:
            - call: "POST /inspection/noncompliance-records/${nr1}/respond"
              payload: { response_text: "second response attempt" }
              as: EstablishmentManager
              as_user_id: "${est_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "NoncomplianceRecord.${nr1}.status == RESPONSE_SUBMITTED and response_text == \"corrective action taken\""

      - name: recall_determine_class_twice_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Recall.INITIATED_to_CLASS_DETERMINED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "determine-class is defined from INITIATED and CLOSED_INEFFECTIVE only; calling it on CLASS_DETERMINED is rejected ERR_INVALID_STATE."
        test_recipe:
          setup: ["Clock default. Establishment; recall CLASS_DETERMINED (CLASS_II)."]
          setup_api_calls:
            - call: "POST /inspection/establishments"
              payload: { name: "SM5 Plant", species_classes: ["CATTLE"], slaughter_capable: true }
              as: ProgramAdministrator
              captures: { est_id: $.data.id }
            - call: "POST /inspection/recalls"
              payload: { establishment_id: "${est_id}", product_description: "franks lot 3", quantity_lbs: 500, reason_code: "MISBRANDING" }
              as: RecallCoordinator
              captures: { rc_id: $.data.id }
            - call: "POST /inspection/recalls/${rc_id}/determine-class"
              payload: { recall_class: "CLASS_II" }
              as: DistrictManager
          trigger:
            - call: "POST /inspection/recalls/${rc_id}/determine-class"
              payload: { recall_class: "CLASS_I" }
              as: DistrictManager
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "Recall.${rc_id}.recall_class remains CLASS_II and status remains CLASS_DETERMINED"

      - name: recall_reclassification_cycle_resets_counters
        claim_type: Valid Transition
        grounds:
          - state_machines.Recall.CLOSED_INEFFECTIVE_to_CLASS_DETERMINED
          - calculations.recall_class_requirements
        distinguishing_aspect: "The recall cycle edge CLOSED_INEFFECTIVE -> CLASS_DETERMINED (via determine-class with a new class) resets checks_performed/checks_effective to 0 and effectiveness_ratio to null, and applies the new class's thresholds (10 / 0.95 for CLASS_I)."
        test_recipe:
          setup: ["Clock default. Establishment; recall CLASS_III with 4 checks (2 EFFECTIVE, 2 INEFFECTIVE -> ratio 0.50 < 0.75), closed CLOSED_INEFFECTIVE."]
          setup_api_calls:
            - call: "POST /inspection/establishments"
              payload: { name: "SM6 Plant", species_classes: ["CATTLE"], slaughter_capable: true }
              as: ProgramAdministrator
              captures: { est_id: $.data.id }
            - call: "POST /inspection/recalls"
              payload: { establishment_id: "${est_id}", product_description: "trim lot 11", quantity_lbs: 300, reason_code: "PATHOGEN" }
              as: RecallCoordinator
              captures: { rc_id: $.data.id }
            - call: "POST /inspection/recalls/${rc_id}/determine-class"
              payload: { recall_class: "CLASS_III" }
              as: DistrictManager
            - call: "POST /inspection/recalls/${rc_id}/effectiveness-checks"
              payload: { consignee_name: "Depot A", outcome: "EFFECTIVE", checked_at: "2026-09-01T06:00:00Z" }
              as: RecallCoordinator
            - call: "POST /inspection/recalls/${rc_id}/effectiveness-checks"
              payload: { consignee_name: "Depot B", outcome: "EFFECTIVE", checked_at: "2026-09-01T07:00:00Z" }
              as: RecallCoordinator
