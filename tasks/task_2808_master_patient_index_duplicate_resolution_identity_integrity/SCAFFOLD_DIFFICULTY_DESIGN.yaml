          - state_machines.PatientRecord.CLEAR_to_FRAUD_SUSPECTED
          - state_machines.PatientRecord.FRAUD_SUSPECTED_to_FRAUD_CONFIRMED
          - state_machines.DuplicateCandidatePair.UNDER_REVIEW_to_ESCALATED_FRAUD
          - entities.RegistrationSite.fields.flagged_record_count
          - calculations.record_integrity_state_derivation
        distinguishing_aspect: |
          One FraudInvestigation write fans OUT across three different entity types instead
          of walking one self-referential edge: FraudInvestigation -> PatientRecord
          (integrity_state) -> RegistrationSite.flagged_record_count, and in parallel
          PatientRecord -> every non-terminal DuplicateCandidatePair naming it, escalating
