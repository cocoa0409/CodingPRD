  # -------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: pp_close_on_open_period_reports_invalid_state_before_reserve_floor_breach
        grounds:
          - validations[priority=13]
          - validations[priority=54]
          - state_machines.FiscalPeriod.REVIEW_LOCKED_to_CLOSED
          - state_machines.FiscalPeriod.OPEN_to_OPEN
          - calculations.reserve_policy_posture
        distinguishing_aspect: |
          One request violates priority 13 and priority 54 at once - CLOSE is not a declared transition
          out of OPEN and reserve_months_ratio_bps is 7500, below the one-month floor - and the response
          must be ERR_INVALID_STATE, not ERR_RESERVE_FLOOR_BREACH; the same CLOSE on the same untouched
          reserve then returns ERR_RESERVE_FLOOR_BREACH once the period is REVIEW_LOCKED, proving the
          lower-priority rule was evaluated but masked rather than absent.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One FiscalPeriod FY2027 in status OPEN with monthly_expense_base_cents 200000 and reserve_balance_cents 150000, and no revenue at all, so concentration_hhi is 0, reserve_months_target is 3, operating_reserve_target_cents is 600000, reserve_months_ratio_bps is 7500 and sustainability_posture is CRITICAL."
            - "board_override_active is false and no Contribution exists, so priority 14 is satisfied throughout."
          setup_api_calls:
            - call: "POST /fiscal-periods"
              payload: { label: "FY2027", start_date: "2026-08-01", end_date: "2027-07-31", monthly_expense_base_cents: 200000, reserve_balance_cents: 150000 }
              as: FinanceController
              captures: { fp_id: "$.data.id" }
          trigger:
            - call: "POST /fiscal-periods/${fp_id}/status-actions"
              payload: { action: "CLOSE" }
              as: FinanceController
            - call: "POST /fiscal-periods/${fp_id}/status-actions"
              payload: { action: "LOCK" }
              as: FinanceController
            - call: "POST /fiscal-periods/${fp_id}/status-actions"
              payload: { action: "CLOSE" }
              as: FinanceController
            - call: "POST /fiscal-periods/${fp_id}/board-override"
              payload: { justification: "Board accepts closing FY2027 below the one-month reserve floor; recovery plan adopted." }
              as: BoardOversight
              as_user_id: "user-board-1"
            - call: "POST /fiscal-periods/${fp_id}/status-actions"
              payload: { action: "CLOSE" }
              as: FinanceController
          assert:
            - "GET /fiscal-periods/${fp_id}/sustainability before any trigger: reserve_months_ratio_bps == 7500, sustainability_posture == CRITICAL, restricted_release_cap_pct_bps == 0, operating_reserve_target_cents == 600000"
            - "trigger[0] -> 409 ERR_INVALID_STATE (priority 13), NOT ERR_RESERVE_FLOOR_BREACH, even though the reserve floor is also breached"
            - "after trigger[0]: FiscalPeriod.${fp_id}.status is still OPEN and board_override_active is still false"
            - "trigger[1] -> 200: status == REVIEW_LOCKED and locked_at == 2026-08-01T00:00:00Z (priority 55 is satisfied because concentration_hhi 0 < 4500)"
            - "trigger[2] -> 409 ERR_RESERVE_FLOOR_BREACH (priority 54 now surfaces on the identical CLOSE request with the identical reserve)"
            - "after trigger[2]: status is still REVIEW_LOCKED"
            - "trigger[3] -> 200: board_override_active == true and board_override_justification is stored; status is still REVIEW_LOCKED"
            - "trigger[4] -> 200: FiscalPeriod.${fp_id}.status == CLOSED with reserve_months_ratio_bps frozen at 7500"

      - name: pp_restricted_funder_outranks_cooling_off_on_proposal_submit
        grounds:
          - validations[priority=20]
          - validations[priority=34]
          - state_machines.Funder.PROSPECT_to_RESTRICTED
          - state_machines.Funder.RESTRICTED_to_CLEARED
          - entities.Funder.fields.restricted_at
        distinguishing_aspect: |
          A SUBMIT on a proposal whose funder is RESTRICTED and whose restricted_at is only hours old
          violates priority 20 and priority 34 together and must answer ERR_FUNDER_RESTRICTED; after the
          funder is rehabilitated to CLEARED - which deliberately leaves restricted_at at
          2026-08-01T00:00:00Z - the very same SUBMIT answers ERR_FUNDER_COOLING_OFF_VIOLATION at
          2026-08-10 and finally succeeds at 2026-08-31, exactly COOLING_OFF_DAYS after restricted_at.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; OPEN FiscalPeriod FY2027."
            - "Funder (FOUNDATION, unaffiliated, no advocacy) cultivated by user-dev-1, cleared to CLEARED with independence_risk_score 10, and holding no FirewallDisclosure rows at all."
            - "An UNRESTRICTED proposal with reporting_cadence NONE sits in status CLEARED, so no coverage area, disclosure or publication gate participates."
            - "The funder is then RESTRICTED by an editorial decision, which stamps restricted_at at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /fiscal-periods"
              payload: { label: "FY2027", start_date: "2026-08-01", end_date: "2027-07-31", monthly_expense_base_cents: 200000, reserve_balance_cents: 500000 }
              as: FinanceController
              captures: { fp_id: "$.data.id" }
            - call: "POST /funders"
              payload: { legal_name: "Ashgrove Foundation", funder_type: "FOUNDATION" }
              as: DevelopmentOfficer
              as_user_id: "user-dev-1"
              captures: { f_id: "$.data.id" }
            - call: "POST /funders/${f_id}/independence-clearance"
              payload: { decision: "CLEAR", basis: "SELF_ATTESTED" }
              as: EditorialDirector
              as_user_id: "user-ed-1"
            - call: "POST /grant-proposals"
              payload: { funder_id: "${f_id}", fiscal_period_id: "${fp_id}", title: "General operating support", requested_amount_cents: 250000, restriction_type: "UNRESTRICTED", reporting_cadence: "NONE", award_probability_bps: 6000 }
              as: DevelopmentOfficer
              as_user_id: "user-dev-1"
              captures: { gp_id: "$.data.id" }
            - call: "POST /grant-proposals/${gp_id}/pipeline-actions"
              payload: { action: "SUBMIT_FOR_REVIEW" }
              as: DevelopmentOfficer
              as_user_id: "user-dev-1"
            - call: "POST /grant-proposals/${gp_id}/internal-review"
              payload: { decision: "CLEAR" }
              as: EditorialDirector
              as_user_id: "user-ed-2"
            - call: "POST /funders/${f_id}/independence-clearance"
              payload: { decision: "RESTRICT", basis: "SELF_ATTESTED", reason: "Program officer publicly demanded a retraction." }
              as: EditorialDirector
              as_user_id: "user-ed-1"
          trigger:
            - call: "POST /grant-proposals/${gp_id}/pipeline-actions"
              payload: { action: "SUBMIT" }
              as: DevelopmentOfficer
              as_user_id: "user-dev-1"
            - call: "POST /funders/${f_id}/independence-clearance"
              payload: { decision: "CLEAR", basis: "SELF_ATTESTED", reason: "Funder adopted a written non-interference policy." }
              as: EditorialDirector
              as_user_id: "user-ed-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: FinanceController
            - call: "POST /grant-proposals/${gp_id}/pipeline-actions"
              payload: { action: "SUBMIT" }
              as: DevelopmentOfficer
              as_user_id: "user-dev-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-31T00:00:00Z" }
              as: FinanceController
            - call: "POST /grant-proposals/${gp_id}/pipeline-actions"
              payload: { action: "SUBMIT" }
              as: DevelopmentOfficer
              as_user_id: "user-dev-1"
          assert:
            - "end of setup: Funder.${f_id}.status == RESTRICTED, restricted_at == 2026-08-01T00:00:00Z, independence_risk_score == 10; GrantProposal.${gp_id}.status == CLEARED"
            - "trigger[0] -> 409 ERR_FUNDER_RESTRICTED (priority 20), NOT ERR_FUNDER_COOLING_OFF_VIOLATION, although the clock is 30 days short of restricted_at + COOLING_OFF_DAYS"
            - "after trigger[0]: GrantProposal.${gp_id}.status is still CLEARED"
            - "trigger[1] -> 200: Funder.${f_id}.status == CLEARED and restricted_at is STILL 2026-08-01T00:00:00Z (rehabilitation does not reset the cooling-off clock)"
            - "trigger[3] -> 409 ERR_FUNDER_COOLING_OFF_VIOLATION at 2026-08-10, which is 9 days after restricted_at"
            - "after trigger[3]: GrantProposal.${gp_id}.status is still CLEARED"
            - "trigger[5] -> 200 at 2026-08-31, exactly COOLING_OFF_DAYS (30) days after restricted_at: GrantProposal.${gp_id}.status == SUBMITTED"
            - "GET /fiscal-periods/${fp_id}/sustainability with basis PIPELINE after trigger[5]: recognized_revenue_cents == 150000 (round_half_up(250000 * 6000 / 10000)) - the proposal now counts in the pipeline projection"

  # -------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: bp_insubstantial_benefit_equal_to_threshold_is_excluded
        grounds:
          - calculations.tier_quid_pro_quo_value
          - entities.MembershipTier.fields.insubstantial_threshold_cents
          - entities.MembershipTier.fields.insubstantial_benefit_codes
          - calculations.contribution_deductible_split
          - entities.Contribution.fields.quid_pro_quo_cents
        distinguishing_aspect: |
          On an ANNUAL tier at 120000 cents the insubstantial threshold is exactly 2400, and two tiers
          that differ by a single cent land on opposite sides of the pinned <= comparison: a benefit
          worth exactly 2400 is insubstantial and excluded (quid_pro_quo_per_period_cents 15000), while
          the same benefit at 2401 is substantial and included (17401), so a strict < implementation
          would report 17400 for the first tier and a >= implementation would report 15000 for the second.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one OPEN FiscalPeriod FY2027."
            - "No membership tiers or members exist yet."
          setup_api_calls:
            - call: "POST /fiscal-periods"
              payload: { label: "FY2027", start_date: "2026-08-01", end_date: "2027-07-31", monthly_expense_base_cents: 200000, reserve_balance_cents: 500000 }
              as: FinanceController
              captures: { fp_id: "$.data.id" }
          trigger:
            - call: "POST /membership-tiers"
              payload:
                tier_code: "PATRON_AT"
                name: "Patron (benefit at threshold)"
                renewal_cadence: "ANNUAL"
                contribution_amount_cents: 120000
                grace_period_days: 30
                benefits:
                  - { benefit_code: "TOTE", fulfillment_type: "MERCHANDISE", annual_fair_market_value_cents: 1000 }
                  - { benefit_code: "EVENT", fulfillment_type: "EVENT_ACCESS", annual_fair_market_value_cents: 15000 }
                  - { benefit_code: "BOOK", fulfillment_type: "MERCHANDISE", annual_fair_market_value_cents: 2400 }
              as: DevelopmentOfficer
              as_user_id: "user-dev-1"
              captures: { tier_at_id: "$.data.id", quid_at: "$.data.quid_pro_quo_per_period_cents" }
            - call: "POST /membership-tiers"
              payload:
                tier_code: "PATRON_OVER"
                name: "Patron (benefit one cent over)"
                renewal_cadence: "ANNUAL"
                contribution_amount_cents: 120000
                grace_period_days: 30
                benefits:
                  - { benefit_code: "TOTE", fulfillment_type: "MERCHANDISE", annual_fair_market_value_cents: 1000 }
                  - { benefit_code: "EVENT", fulfillment_type: "EVENT_ACCESS", annual_fair_market_value_cents: 15000 }
                  - { benefit_code: "BOOK", fulfillment_type: "MERCHANDISE", annual_fair_market_value_cents: 2401 }
              as: DevelopmentOfficer
              as_user_id: "user-dev-1"
              captures: { tier_over_id: "$.data.id", quid_over: "$.data.quid_pro_quo_per_period_cents" }
            - call: "POST /membership-tiers/${tier_at_id}/publish"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "user-dev-1"
            - call: "POST /members"
              payload: { tier_id: "${tier_at_id}", email: "rosa@example.org", full_name: "Rosa Blume" }
              as: DevelopmentOfficer
              as_user_id: "user-dev-1"
              captures: { m_id: "$.data.id" }
            - call: "POST /contributions"
              payload: { fiscal_period_id: "${fp_id}", revenue_stream: "MEMBERSHIP", member_id: "${m_id}", amount_cents: 120000, received_date: "2026-08-10" }
              as: DevelopmentOfficer
              as_user_id: "user-dev-1"
              captures: { c_id: "$.data.id", c_deductible: "$.data.deductible_cents" }
          assert:
            - "both tiers: insubstantial_threshold_cents == 2400 == min(round_half_up(120000 * 200 / 10000), 13000)"
            - "trigger[0]: MembershipTier.${tier_at_id}.insubstantial_benefit_codes == [TOTE, BOOK] and quid_pro_quo_per_period_cents == 15000"
            - "trigger[1]: MembershipTier.${tier_over_id}.insubstantial_benefit_codes == [TOTE] and quid_pro_quo_per_period_cents == 17401"
            - "17401 - 15000 == 2401 - the single extra cent pulled the whole benefit value across the line"
            - "trigger[0] and trigger[1]: benefit_count == 3 for both tiers - the insubstantial exclusion never changes benefit_count"
            - "trigger[2] -> 200: MembershipTier.${tier_at_id}.status == PUBLISHED (15000 < 120000)"
            - "trigger[4]: Contribution.${c_id}.quid_pro_quo_cents == 15000 and deductible_cents == 105000; the same contribution on PATRON_OVER would have been 17401 / 102599"

      - name: bp_reserve_balance_exactly_half_target_is_watch_not_constrained
        grounds:
          - calculations.reserve_policy_posture
          - entities.FiscalPeriod.fields.sustainability_posture
          - entities.FiscalPeriod.fields.restricted_release_cap_pct_bps
          - entities.FiscalPeriod.fields.reserve_months_ratio_bps
        distinguishing_aspect: |
          Two revenue-free periods with monthly_expense_base_cents 200000 have
          operating_reserve_target_cents 600000 and a CONSTRAINED cut at round_half_up(600000/2) ==
          300000 evaluated with a strict <: a balance of exactly 300000 must report WATCH with
          restricted_release_cap_pct_bps 6000 while 299999 must report CONSTRAINED with 2500, and both
          rows report the identical reserve_months_ratio_bps 15000, so the posture split cannot be
          reproduced from the rounded ratio.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "FiscalPeriod A: monthly_expense_base_cents 200000, reserve_balance_cents 300000, no revenue - concentration_hhi 0, reserve_months_target 3, operating_reserve_target_cents 600000."
            - "FiscalPeriod B: identical except reserve_balance_cents 299999."
            - "Neither period has any Contribution or GrantProposal, so both share the same concentration inputs and differ only by one cent of reserve."
          setup_api_calls:
            - call: "POST /fiscal-periods"
              payload: { label: "FY2027-HALF-EXACT", start_date: "2026-08-01", end_date: "2027-07-31", monthly_expense_base_cents: 200000, reserve_balance_cents: 300000 }
              as: FinanceController
              captures: { fp_a: "$.data.id" }
            - call: "POST /fiscal-periods"
              payload: { label: "FY2027-HALF-MINUS-ONE", start_date: "2026-08-01", end_date: "2027-07-31", monthly_expense_base_cents: 200000, reserve_balance_cents: 299999 }
              as: FinanceController
              captures: { fp_b: "$.data.id" }
          trigger:
            - call: "GET /fiscal-periods/${fp_a}/sustainability"
              payload: {}
              as: BoardOversight
            - call: "GET /fiscal-periods/${fp_b}/sustainability"
              payload: {}
              as: BoardOversight
          assert:
            - "trigger[0]: reserve_months_target == 3 and operating_reserve_target_cents == 600000 and reserve_months_ratio_bps == 15000"
            - "trigger[0]: sustainability_posture == WATCH and restricted_release_cap_pct_bps == 6000 (300000 is NOT strictly less than 300000)"
            - "trigger[1]: reserve_months_target == 3 and operating_reserve_target_cents == 600000 and reserve_months_ratio_bps == 15000 - identical to trigger[0]"
            - "trigger[1]: sustainability_posture == CONSTRAINED and restricted_release_cap_pct_bps == 2500"
            - "both: concentration_hhi == 0 and top_source_share_bps == 0 and recognized_revenue_cents == 0, so nothing but the one-cent reserve difference separates the two postures"
            - "neither period is CRITICAL: both balances exceed monthly_expense_base_cents 200000"

  # -------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: ce_gift_acceptance_gated_by_funder_risk_derived_board_ratification
        grounds:
          - calculations.gift_stewardship_netting
          - validations[priority=27]
          - state_machines.GiftOffer.CLEARED_to_CLEARED
          - state_machines.GiftOffer.CLEARED_to_ACCEPTED
          - entities.GiftOffer.fields.board_ratification_required
          - entities.GiftOffer.fields.acceptance_gate_score
        distinguishing_aspect: |
          A 200000-cent gift is far below BOARD_RATIFICATION_THRESHOLD_CENTS and carries a
          stewardship_fee_cents of 0, yet board_ratification_required is true purely because the
          FUNDER's independence_risk_score is 48, so the first accept fails with
          ERR_BOARD_RATIFICATION_REQUIRED and only a BoardOversight ratification by a third user makes
          the identical accept succeed and mint the MAJOR_GIFT contribution.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; OPEN FiscalPeriod FY2027."
            - "CoverageArea CLIMATE, publication_gate OPEN."
            - "Funder (FOUNDATION affiliated to CLIMATE, self_attested_advocacy true) with an ACTIVE FirewallDisclosure for (funder, CLIMATE), cleared on the AUDITED basis with audited_advocacy_index 7, so independence_risk_score is 48: at or above RATIFICATION_RISK_FLOOR but below RISK_HARD_BAR."
            - "GiftOffer of 200000 cents, designation PROGRAM_RESTRICTED on CLIMATE, solicited by user-dev-1, no donor_conditions, already CLEARED by user-ed-2."
          setup_api_calls:
            - call: "POST /fiscal-periods"
              payload: { label: "FY2027", start_date: "2026-08-01", end_date: "2027-07-31", monthly_expense_base_cents: 200000, reserve_balance_cents: 500000 }
              as: FinanceController
              captures: { fp_id: "$.data.id" }
            - call: "POST /coverage-areas"
              payload: { area_code: "CLIMATE", name: "Climate and energy", editorial_lead_user_id: "user-ed-7" }
              as: EditorialDirector
              as_user_id: "user-ed-1"
              captures: { ca_id: "$.data.id" }
            - call: "POST /funders"
              payload: { legal_name: "Sable Ridge Foundation", funder_type: "FOUNDATION", affiliated_coverage_area_id: "${ca_id}", self_attested_advocacy: true }
              as: DevelopmentOfficer
              as_user_id: "user-dev-1"
              captures: { f_id: "$.data.id", f_v0: "$.data.version" }
            - call: "POST /firewall-disclosures"
              payload: { funder_id: "${f_id}", coverage_area_id: "${ca_id}", disclosure_text: "Sable Ridge funds climate coverage; the climate desk retains sole editorial control.", expected_funder_version: "${f_v0}" }
              as: EditorialDirector
              as_user_id: "user-ed-1"
              captures: { fd_id: "$.data.id" }
            - call: "POST /funders/${f_id}/independence-clearance"
              payload: { decision: "CLEAR", basis: "AUDITED", audited_advocacy_index: 7, reason: "Audited advocacy index 7; disclosure on file for the affiliated beat." }
              as: EditorialDirector
              as_user_id: "user-ed-1"
            - call: "POST /gift-offers"
              payload: { funder_id: "${f_id}", fiscal_period_id: "${fp_id}", offered_amount_cents: 200000, designation: "PROGRAM_RESTRICTED", coverage_area_id: "${ca_id}" }
              as: DevelopmentOfficer
              as_user_id: "user-dev-1"
              captures: { go_id: "$.data.id" }
            - call: "POST /gift-offers/${go_id}/submit-for-review"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "user-dev-1"
            - call: "POST /gift-offers/${go_id}/independence-review"
              payload: { decision: "CLEAR", review_note: "No conditions; disclosure current." }
              as: EditorialDirector
              as_user_id: "user-ed-2"
          trigger:
            - call: "POST /gift-offers/${go_id}/accept"
              payload: { received_date: "2026-08-20" }
              as: DevelopmentOfficer
              as_user_id: "user-dev-2"
            - call: "POST /gift-offers/${go_id}/board-ratification"
              payload: { ratification_note: "Board reviewed the independence file and ratified the gift." }
              as: BoardOversight
              as_user_id: "user-board-1"
            - call: "POST /gift-offers/${go_id}/accept"
              payload: { received_date: "2026-08-20" }
              as: DevelopmentOfficer
              as_user_id: "user-dev-2"
            - call: "GET /contributions"
              payload: { gift_offer_id: "${go_id}" }
              as: FinanceController
              captures: { gift_c_id: "$.data[0].id" }
          assert:
            - "end of setup: Funder.${f_id}.independence_risk_score == 48; GiftOffer.${go_id}.status == CLEARED, stewardship_fee_cents == 0, net_acceptable_amount_cents == 200000, board_ratification_required == true, board_ratified_by_user_id == null, acceptance_gate_score == 48"
            - "trigger[0] -> 409 ERR_BOARD_RATIFICATION_REQUIRED, driven only by the funder's score - 200000 is far below BOARD_RATIFICATION_THRESHOLD_CENTS 2500000"
            - "after trigger[0]: GiftOffer.${go_id}.status is still CLEARED and no Contribution exists for the offer"
            - "trigger[1] -> 200: board_ratified_by_user_id == user-board-1 and status is still CLEARED"
            - "trigger[2] -> 200: GiftOffer.${go_id}.status == ACCEPTED"
            - "trigger[3]: exactly one Contribution with revenue_stream == MAJOR_GIFT, amount_cents == 200000, funder_id == ${f_id}, gift_offer_id == ${go_id}, settlement_status == INITIATED, acknowledgment_status == UNACKNOWLEDGED, quid_pro_quo_cents == 0, deductible_cents == 200000"
            - "Funder.${f_id}.lifetime_committed_cents == 200000"
            - "FiscalPeriod.${fp_id}.recognized_revenue_cents == 0 - the new contribution is INITIATED, so the RECOGNIZED basis ignores it"

      - name: ce_proposal_clearance_requires_disclosure_for_exact_funder_area_pair
        grounds:
          - validations[priority=22]
          - state_machines.GrantProposal.INDEPENDENCE_REVIEW_to_CLEARED
          - entities.CoverageArea.fields.disclosed_funder_count
          - concurrency_rules[disclosure-create-stale-funder]
          - calculations.funder_independence_risk
        distinguishing_aspect: |
          The funder scores 48 and already holds an ACTIVE disclosure for its affiliated beat CLIMATE,
          but the proposal restricts spending to HOUSING, so clearance is refused with
          ERR_DISCLOSURE_REQUIRED until a second disclosure naming the exact (funder, HOUSING) pair
          exists; a per-funder disclosure check would have cleared the proposal on the first attempt.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; OPEN FiscalPeriod FY2027."
            - "Two CoverageAreas: CLIMATE and HOUSING, both with publication_gate OPEN."
            - "Funder (FOUNDATION affiliated to CLIMATE, self_attested_advocacy true) with an ACTIVE disclosure for (funder, CLIMATE), cleared on the AUDITED basis at audited_advocacy_index 7 so independence_risk_score is 48."
            - "A PROGRAM_RESTRICTED proposal of 300000 restricted to HOUSING (2026-09-01..2027-02-28, reporting_cadence NONE) sits in INDEPENDENCE_REVIEW, drafted by user-dev-1."
          setup_api_calls:
            - call: "POST /fiscal-periods"
              payload: { label: "FY2027", start_date: "2026-08-01", end_date: "2027-07-31", monthly_expense_base_cents: 200000, reserve_balance_cents: 500000 }
              as: FinanceController
              captures: { fp_id: "$.data.id" }
            - call: "POST /coverage-areas"
              payload: { area_code: "CLIMATE", name: "Climate and energy", editorial_lead_user_id: "user-ed-7" }
              as: EditorialDirector
              as_user_id: "user-ed-1"
              captures: { ca_climate: "$.data.id" }
            - call: "POST /coverage-areas"
              payload: { area_code: "HOUSING", name: "Housing and homelessness", editorial_lead_user_id: "user-ed-9" }
              as: EditorialDirector
              as_user_id: "user-ed-1"
              captures: { ca_housing: "$.data.id" }
            - call: "POST /funders"
              payload: { legal_name: "Grayland Foundation", funder_type: "FOUNDATION", affiliated_coverage_area_id: "${ca_climate}", self_attested_advocacy: true }
              as: DevelopmentOfficer
              as_user_id: "user-dev-1"
              captures: { f_id: "$.data.id", f_v0: "$.data.version" }
            - call: "POST /firewall-disclosures"
              payload: { funder_id: "${f_id}", coverage_area_id: "${ca_climate}", disclosure_text: "Grayland funds climate coverage; the climate desk retains sole editorial control.", expected_funder_version: "${f_v0}" }
              as: EditorialDirector
              as_user_id: "user-ed-1"
              captures: { fd_climate: "$.data.id" }
            - call: "POST /funders/${f_id}/independence-clearance"
              payload: { decision: "CLEAR", basis: "AUDITED", audited_advocacy_index: 7 }
              as: EditorialDirector
              as_user_id: "user-ed-1"
            - call: "POST /grant-proposals"
              payload: { funder_id: "${f_id}", fiscal_period_id: "${fp_id}", title: "Eviction filings tracker", requested_amount_cents: 300000, restriction_type: "PROGRAM_RESTRICTED", coverage_area_id: "${ca_housing}", restriction_start_date: "2026-09-01", restriction_end_date: "2027-02-28", reporting_cadence: "NONE", award_probability_bps: 6000 }
              as: DevelopmentOfficer
              as_user_id: "user-dev-1"
              captures: { gp_id: "$.data.id" }
            - call: "POST /grant-proposals/${gp_id}/pipeline-actions"
              payload: { action: "SUBMIT_FOR_REVIEW" }
              as: DevelopmentOfficer
              as_user_id: "user-dev-1"
          trigger:
            - call: "POST /grant-proposals/${gp_id}/internal-review"
              payload: { decision: "CLEAR", review_note: "First attempt, relying on the climate disclosure." }
              as: EditorialDirector
              as_user_id: "user-ed-2"
            - call: "GET /funders/${f_id}"
              payload: {}
              as: EditorialDirector
              captures: { f_v_now: "$.data.version" }
            - call: "POST /firewall-disclosures"
              payload: { funder_id: "${f_id}", coverage_area_id: "${ca_housing}", disclosure_text: "Grayland also funds housing coverage; the housing desk retains sole editorial control.", expected_funder_version: "${f_v_now}" }
              as: EditorialDirector
              as_user_id: "user-ed-1"
              captures: { fd_housing: "$.data.id" }
            - call: "POST /grant-proposals/${gp_id}/internal-review"
