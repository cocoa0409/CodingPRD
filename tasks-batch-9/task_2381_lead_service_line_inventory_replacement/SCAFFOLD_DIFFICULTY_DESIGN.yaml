      - name: replacement_order_consent_cycle_revisits_scoping_fork_with_divergent_side_effects
        grounds:
          - state_machines.ReplacementOrder.consent_state.REQUESTED_to_NO_RESPONSE
          - state_machines.ReplacementOrder.consent_state.NO_RESPONSE_to_REQUESTED
          - state_machines.ReplacementOrder.fulfillment_state.SCOPED_to_DRAFT
          - state_machines.ReplacementOrder.fulfillment_state.DRAFT_to_SCOPED
          - entities.ReplacementOrder.fields.scope
          - entities.ServiceLine.fields.consent_barrier_flag
        distinguishing_aspect: |
          ReplacementOrder — a different entity from ServiceLine — is non-linear in a
          different way: a genuine cycle DRAFT -> SCOPED -> DRAFT -> SCOPED driven by the
          consent axis looping NO_RESPONSE -> REQUESTED, whose two exits from the same
          SCOPED fork have divergent side-effect sets (the PARTIAL branch mutates two
          ServiceLine fields, the FULL branch mutates none).
        test_recipe:
          setup:
            - "WaterSystem with disadvantaged_tract_codes = ['17031-8402'] and a PUBLISHED inventory."
            - "One LEAD ServiceLine 101 Elm St inside that tract, so its no-barrier priority is 50.00 + 25.00 = 75.00."
            - "A ReplacementOrder on that line that has already been scoped PARTIAL through a NO_RESPONSE consent round (consent_barrier_flag true, priority 67.00) and then re-canvassed, returning the order to DRAFT / REQUESTED with scope cleared."
          setup_api_calls:
            - call: "POST /lsl/water-systems"
              payload: { pwsid: "IL2031007", system_name: "Sableton Water", compliance_deadline_date: "2027-10-16", baseline_lead_and_grr_count: 100, disadvantaged_tract_codes: ["17031-8402"], funding_mode: "WATERFALL" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
