              as: SalesRep
              captures: { q_id: $.data.id }
            - call: "POST /distributor/quote-lines"
              payload: { quote_id: "${q_id}", catalog_item_id: "${thhn_id}", qty: 200, unit_price_cents: 45.25 }
              as: SalesRep
            - call: "POST /distributor/quotes/${q_id}/submit"
              payload: {}
              as: SalesRep
            - call: "POST /distributor/quotes/${q_id}/award"
              payload: {}
              as: BranchManager
            - call: "POST /distributor/releases"
              payload: { job_account_id: "${j_id}", quote_id: "${q_id}", expected_job_account_version: "${j_v}", lines: [{ catalog_item_id: "${thhn_id}", qty: 200 }] }
              as: SalesRep
              captures: { r_id: $.data.id }
            - call: "POST /distributor/releases/${r_id}/credit-approve"
              payload: {}
              as: CreditManager
            - call: "POST /distributor/releases/${r_id}/allocate"
              payload: {}
              as: WarehouseManager
            - call: "POST /distributor/releases/${r_id}/schedule"
              payload: { truck_id: "T1", delivery_date: "2026-08-10", window_start_hour: 8, window_end_hour: 12 }
              as: Dispatcher
            - call: "POST /distributor/releases/${r_id}/deliver"
