              as_user_id: "${prov_id}"
              captures: { batch_id: $.data.id, bv1: $.data.version }
            - call: "POST /access-code-batches/${batch_id}/assignments"
              payload: { candidate_id: "${cand_id}", bundle_type: "EXAM_ONLY", expected_batch_version: "${bv1}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { code_id: $.data.id }
            - call: "POST /exam-sessions"
              payload: { candidate_id: "${cand_id}", exam_form_id: "${form_id}", access_code_id: "${code_id}", delivery_mode: "IN_PERSON", scheduled_start_at: "2026-09-10T09:00:00Z", testing_site_id: "${site_id}", proctor_id: "${proc_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:45:00Z" }
              as: PlatformAdmin
            - call: "POST /exam-sessions/${sess_id}/check-in"
              payload: { id_document_type: "GOVT_PHOTO_ID", id_document_expires_on: "2030-01-31", proctor_attestation: true }
              as: Proctor
              as_user_id: "${proc_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /exam-sessions/${sess_id}/start"
              payload: {}
              as: Proctor
              as_user_id: "${proc_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T10:30:00Z" }
              as: PlatformAdmin
            - call: "POST /exam-sessions/${sess_id}/submission"
              payload: { scored_correct_count: 60, pretest_correct_count: 4, proctor_attestation: true }
              as: Proctor
              as_user_id: "${proc_id}"
              captures: { sr_id: $.data.id }
            - call: "POST /score-reports/${sr_id}/finalization"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-scoring-1"
              captures: { final_score: $.data.final_scaled_score }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /training-providers/${prov_id}"
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { bal_pre_issue: $.data.credit_balance_cents, charged_pre_issue: $.data.lifetime_charged_cents }
          trigger:
            - call: "POST /certificates"
              payload: { score_report_id: "${sr_id}" }
              as: PlatformAdmin
              as_user_id: "admin-registry-2"
              captures: { cert_id: $.data.id, fee: $.data.issuance_fee_cents }
            - call: "GET /training-providers/${prov_id}"
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { bal_after_issue: $.data.credit_balance_cents, charged_after_issue: $.data.lifetime_charged_cents, credited_after_issue: $.data.lifetime_credited_cents }
            - call: "POST /security-incidents"
              payload: { exam_session_id: "${sess_id}", reported_by_proctor_id: "${proc_id}", category: "PROHIBITED_MATERIAL", severity: "MAJOR", narrative: "Crib sheet found under the candidate's keyboard during post-administration desk sweep" }
              as: Proctor
              as_user_id: "${proc_id}"
              captures: { inc_id: $.data.id, weight: $.data.severity_weight }
            - call: "POST /security-incidents/${inc_id}/review-open"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-integrity-9"
            - call: "POST /security-incidents/${inc_id}/resolution"
              payload: { outcome: "SUBSTANTIATE", resolution_note: "Crib sheet photographed and retained; score voided" }
              as: PlatformAdmin
              as_user_id: "admin-integrity-9"
              captures: { inc_status: $.data.status }
            - call: "GET /training-providers/${prov_id}"
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { bal_final: $.data.credit_balance_cents, charged_final: $.data.lifetime_charged_cents, credited_final: $.data.lifetime_credited_cents }
          assert:
            - "pre-issuance ledger: lifetime_credited_cents == 500000, lifetime_charged_cents == 3762, credit_balance_cents == 496238, and the identity 500000 - 3762 == 496238 holds"
            - "issuance charges the fee: Certificate.${cert_id}.issuance_fee_cents == 1500, lifetime_charged_cents == 5262, lifetime_credited_cents still 500000, credit_balance_cents == 494738 (identity 500000 - 5262 == 494738)"
            - "Certificate.${cert_id}.status == ISSUED with expires_at \"2031-09-12T00:00:00Z\" and recert_window_opens_at \"2031-03-16T00:00:00Z\""
            - "SecurityIncident.${inc_id}.severity_weight == 3 and status == SUBSTANTIATED after resolution (review-open by admin-integrity-9 is permitted because admin-scoring-1 finalized the report)"
            - "the revocation compensates the fee as a CREDIT, not as a reversal of the debit: lifetime_credited_cents == 501500 AND lifetime_charged_cents is STILL 5262 (never decremented)"
            - "credit_balance_cents == 496238 — bit-for-bit the pre-issuance balance, so the compensating pair leaves zero drift, and the identity 501500 - 5262 == 496238 holds again"
            - "Certificate.${cert_id}.status == REVOKED with revocation_reason == SCORE_VOIDED, ScoreReport.${sr_id}.status == VOIDED with pass_flag false, and ExamSession.${sess_id}.session_status == INVALIDATED with proctoring_status == COMPROMISED"
            - "Candidate.${cand_id}.compliance_status == NON_COMPLIANT and security_hold == false (security_hold is set only for CRITICAL incidents)"
            - "Proctor.${proc_id}.substantiated_incident_weight_total == 3, risk_score == 30.00 with risk_variant_applied == LIFETIME_CUMULATIVE, and registration_status == SUSPENDED with suspended_reason == RISK_THRESHOLD_BREACH"
          notes: "The two conserved quantities in this rule are disjoint: integer inventory counts on one AccessCodeBatch versus the three-field cents ledger on one TrainingProvider. Neither instance's compensation touches the other's quantity."
