# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 1776: Positive Pay & Check Fraud Prevention
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: enrollment_create_defaults_applied
        claim_type: defaults
        grounds: [entities.TreasuryEnrollment.fields.deadline_mode, entities.TreasuryEnrollment.fields.amount_tolerance_cents]
        distinguishing_aspect: "Omitting every optional config field applies the documented defaults."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /treasury/enrollments", payload: { business_name: "DefCo", tier: "POSITIVE_PAY", default_decision: "PAY" }, as: BankTreasuryManager, captures: { enr: $.data.id, dm_: $.data.deadline_mode, wh: $.data.decision_window_hours, tol: $.data.amount_tolerance_cents, th: $.data.payee_score_threshold, sd: $.data.stale_days, st: $.data.status, oc: $.data.open_exception_count } }
          assert:
            - "defaults: deadline_mode == SAME_DAY_CUTOFF, decision_window_hours == 24, amount_tolerance_cents == 0, payee_score_threshold == 85, stale_days == 180"
            - "initial: status == PENDING_ACTIVATION, open_exception_count == 0, provisional_credit_outstanding_cents == 0, ytd_bank_loss_cents == 0"

      - name: enrollment_create_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.TreasuryEnrollment.fields.tier, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "An out-of-enum tier value is rejected at the shape layer."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /treasury/enrollments", payload: { business_name: "BadCo", tier: "BASIC", default_decision: "PAY" }, as: BankTreasuryManager, captures: { err: $.data.error_id } }
          assert: ["err == ERR_INVALID_REQUEST (400)"]

      - name: enrollment_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.TreasuryEnrollment]
        distinguishing_aspect: "Client-supplied id/created_at/version on create are ignored; the server mints its own."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /treasury/enrollments", payload: { business_name: "SysCo", tier: "POSITIVE_PAY", default_decision: "PAY", id: "00000000-0000-0000-0000-000000000000", version: 99 }, as: BankTreasuryManager, captures: { rid: $.data.id, rv: $.data.version } }
          assert:
            - "rid != '00000000-0000-0000-0000-000000000000' (server-minted UUID)"
            - "rv == 1 (input version 99 ignored)"

      - name: enrollment_computed_field_input_ignored
        claim_type: computed_fields
        grounds: [entities.TreasuryEnrollment.fields.open_exception_count]
        distinguishing_aspect: "Computed fields in the request body are ignored and recomputed by the server."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /treasury/enrollments", payload: { business_name: "CmpCo", tier: "POSITIVE_PAY", default_decision: "PAY", open_exception_count: 77 }, as: BankTreasuryManager, captures: { oc: $.data.open_exception_count } }
          assert: ["oc == 0 (input 77 ignored)"]

      - name: get_missing_enrollment_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID yields the not-found error."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /treasury/enrollments/00000000-0000-0000-0000-000000000000", payload: {}, as: BankTreasuryManager, captures: { err: $.data.error_id } }
          assert: ["err == ERR_NOT_FOUND (404)"]

      - name: ops_run_has_no_version_field
        claim_type: immutability
        grounds: [entities.OpsRun]
        distinguishing_aspect: "OpsRun is append-only (common_fields: false): the response carries id and created_at but no version/updated_at."
        test_recipe:
          setup: ["One enrollment exists so the sweep has a scope"]
          setup_api_calls:
            - { call: "POST /treasury/enrollments", payload: { business_name: "OpsCo", tier: "POSITIVE_PAY", default_decision: "PAY" }, as: BankTreasuryManager, captures: { enr: $.data.id } }
            - { call: "POST /treasury/ops-runs", payload: { kind: "DAILY_SWEEP", enrollment_id: "${enr}" }, as: BankOps, captures: { run: $.data.id } }
          trigger:
            - { call: "GET /treasury/ops-runs/${run}", payload: {}, as: BankOps, captures: { k: $.data.kind, n: $.data.exceptions_defaulted } }
          assert:
            - "GET response data has keys id, created_at, kind, counters; NO version and NO updated_at keys"
            - "k == DAILY_SWEEP and n == 0 on a quiet scope"

      - name: user_create_with_missing_enrollment_returns_not_found
        claim_type: parent_relationships
        grounds: [entities.EnrollmentUser.fields.enrollment_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Body-referenced FK ids are validated at the existence layer."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /treasury/enrollment-users", payload: { enrollment_id: "00000000-0000-0000-0000-000000000000", display_name: "Ghost", user_role: "ADMIN" }, as: BankTreasuryManager, captures: { err: $.data.error_id } }
          assert: ["err == ERR_NOT_FOUND (404)"]

  - section: state_machines
    instances:
      - name: issued_check_initial_state_registered
        claim_type: initial_state
        grounds: [state_machines.IssuedCheck]
        distinguishing_aspect: "Rows accepted from an upload become IssuedCheck records in REGISTERED."
        test_recipe:
          setup: ["ACTIVE POSITIVE_PAY enrollment with account and admin user"]
          setup_api_calls:
            - { call: "POST /treasury/enrollments", payload: { business_name: "InitCo", tier: "POSITIVE_PAY", default_decision: "PAY" }, as: BankTreasuryManager, captures: { enr: $.data.id } }
            - { call: "POST /treasury/accounts", payload: { enrollment_id: "${enr}", account_number: "810001" }, as: BankTreasuryManager, captures: { acct: $.data.id } }
            - { call: "POST /treasury/enrollment-users", payload: { enrollment_id: "${enr}", display_name: "Admin", user_role: "ADMIN" }, as: BankTreasuryManager, captures: { adm: $.data.id } }
            - { call: "POST /treasury/training-sessions", payload: { enrollment_id: "${enr}", trainer_id: "tr-1", scheduled_start: "2026-08-01T09:00:00Z", scheduled_end: "2026-08-01T10:00:00Z" }, as: BankOps, captures: { sess: $.data.id } }
            - { call: "POST /treasury/training-sessions/${sess}/complete", payload: { attendee_user_ids: ["${adm}"] }, as: BankOps }
            - { call: "POST /treasury/enrollments/${enr}/activate", payload: {}, as: BankTreasuryManager }
          trigger:
            - { call: "POST /treasury/issue-files", payload: { enrollment_id: "${enr}", account_id: "${acct}", file_reference: "F-INIT", rows: [ { check_number: "1", amount_cents: 100, payee_name: "P", issue_date: "2026-08-01" } ] }, as: CustomerAdmin, as_user_id: "${adm}", captures: { f: $.data.id, fa: $.data.accepted_row_count, fst: $.data.status } }
            - { call: "GET /treasury/issued-checks", payload: { issue_file_id: "${f}" }, as: BankOps, captures: { cst: "$.data[0].status" } }
          assert:
            - "fst == ACCEPTED, fa == 1"
            - "The created check's status == REGISTERED"

      - name: void_consumed_check_rejected
        claim_type: invalid_transition
        grounds: [state_machines.IssuedCheck.REGISTERED_to_CONSUMED, "errors[ERR_CHECK_NOT_VOIDABLE]"]
        distinguishing_aspect: "Once a check has paid an item (CONSUMED), void is an illegal transition."
        test_recipe:
          setup: ["ACTIVE POSITIVE_PAY enrollment; check 701 (800) clean-paid by a presented item"]
          setup_api_calls:
            - { call: "POST /treasury/enrollments", payload: { business_name: "VoidCo", tier: "POSITIVE_PAY", default_decision: "PAY" }, as: BankTreasuryManager, captures: { enr: $.data.id } }
            - { call: "POST /treasury/accounts", payload: { enrollment_id: "${enr}", account_number: "810002" }, as: BankTreasuryManager, captures: { acct: $.data.id } }
            - { call: "POST /treasury/enrollment-users", payload: { enrollment_id: "${enr}", display_name: "Admin", user_role: "ADMIN" }, as: BankTreasuryManager, captures: { adm: $.data.id } }
            - { call: "POST /treasury/training-sessions", payload: { enrollment_id: "${enr}", trainer_id: "tr-1", scheduled_start: "2026-08-01T09:00:00Z", scheduled_end: "2026-08-01T10:00:00Z" }, as: BankOps, captures: { sess: $.data.id } }
            - { call: "POST /treasury/training-sessions/${sess}/complete", payload: { attendee_user_ids: ["${adm}"] }, as: BankOps }
            - { call: "POST /treasury/enrollments/${enr}/activate", payload: {}, as: BankTreasuryManager }
            - { call: "POST /treasury/issue-files", payload: { enrollment_id: "${enr}", account_id: "${acct}", file_reference: "F-VOID", rows: [ { check_number: "701", amount_cents: 800, payee_name: "V CO", issue_date: "2026-08-01" } ] }, as: CustomerAdmin, as_user_id: "${adm}" }
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "701", amount_cents: 800, payee_name_raw: "V CO", channel: "TELLER", presented_at: "2026-08-03T10:00:00Z" }, as: BankOps, captures: { it_st: $.data.status } }
            - { call: "GET /treasury/issued-checks", payload: { account_id: "${acct}", check_number: "701" }, as: BankOps, captures: { chk: "$.data[0].id", cst: "$.data[0].status" } }
          trigger:
            - { call: "POST /treasury/issued-checks/${chk}/void", payload: {}, as: CustomerAdmin, as_user_id: "${adm}", captures: { err: $.data.error_id } }
          assert:
            - "Precondition: it_st == PAID and the check is cst == CONSUMED"
            - "err == ERR_CHECK_NOT_VOIDABLE (409)"

      - name: stale_check_sweep_boundary_date
        claim_type: side_effect_execution
        grounds: [calculations.stale_check_age, state_machines.IssuedCheck.REGISTERED_to_STALE_DATED]
        distinguishing_aspect: "Age >= stale_days stales: at the default clock 2026-08-01 a check issued 2026-02-02 (exactly 180 days) stales while 2026-02-03 (179 days) survives."
        test_recipe:
          setup: ["ACTIVE POSITIVE_PAY enrollment (default stale_days 180); checks issued 2026-02-02 and 2026-02-03; logical clock untouched at its 2026-08-01T00:00:00Z default"]
          setup_api_calls:
            - { call: "POST /treasury/enrollments", payload: { business_name: "StaleCo", tier: "POSITIVE_PAY", default_decision: "PAY" }, as: BankTreasuryManager, captures: { enr: $.data.id } }
            - { call: "POST /treasury/accounts", payload: { enrollment_id: "${enr}", account_number: "810003" }, as: BankTreasuryManager, captures: { acct: $.data.id } }
            - { call: "POST /treasury/enrollment-users", payload: { enrollment_id: "${enr}", display_name: "Admin", user_role: "ADMIN" }, as: BankTreasuryManager, captures: { adm: $.data.id } }
            - { call: "POST /treasury/training-sessions", payload: { enrollment_id: "${enr}", trainer_id: "tr-1", scheduled_start: "2026-07-01T09:00:00Z", scheduled_end: "2026-07-01T10:00:00Z" }, as: BankOps, captures: { sess: $.data.id } }
            - { call: "POST /treasury/training-sessions/${sess}/complete", payload: { attendee_user_ids: ["${adm}"] }, as: BankOps }
            - { call: "POST /treasury/enrollments/${enr}/activate", payload: {}, as: BankTreasuryManager }
            - { call: "POST /treasury/issue-files", payload: { enrollment_id: "${enr}", account_id: "${acct}", file_reference: "F-STALE", rows: [ { check_number: "801", amount_cents: 100, payee_name: "OLD", issue_date: "2026-02-02" }, { check_number: "802", amount_cents: 100, payee_name: "NEWER", issue_date: "2026-02-03" } ] }, as: CustomerAdmin, as_user_id: "${adm}" }
          trigger:
            - { call: "POST /treasury/ops-runs", payload: { kind: "DAILY_SWEEP", enrollment_id: "${enr}" }, as: BankOps, captures: { n: $.data.checks_staled } }
            - { call: "GET /treasury/issued-checks", payload: { account_id: "${acct}", check_number: "801" }, as: BankOps, captures: { s1: "$.data[0].status" } }
            - { call: "GET /treasury/issued-checks", payload: { account_id: "${acct}", check_number: "802" }, as: BankOps, captures: { s2: "$.data[0].status" } }
          assert:
            - "n == 1"
            - "Check 801 (age exactly 180 days): s1 == STALE_DATED"
            - "Check 802 (age 179 days): s2 == REGISTERED"

      - name: reverse_returned_item_rejected
        claim_type: invalid_transition
        grounds: [state_machines.PresentedItem.PAID_to_REVERSED, "errors[ERR_ITEM_NOT_REVERSIBLE]"]
        distinguishing_aspect: "Reversal is defined only from PAID; a RETURNED item rejects it."
        test_recipe:
          setup: ["ACTIVE REVERSE-tier enrollment; exception decisioned RETURN so the item is RETURNED"]
          setup_api_calls:
            - { call: "POST /treasury/enrollments", payload: { business_name: "RevCo", tier: "REVERSE_POSITIVE_PAY", default_decision: "PAY" }, as: BankTreasuryManager, captures: { enr: $.data.id } }
            - { call: "POST /treasury/accounts", payload: { enrollment_id: "${enr}", account_number: "810004" }, as: BankTreasuryManager, captures: { acct: $.data.id } }
            - { call: "POST /treasury/enrollment-users", payload: { enrollment_id: "${enr}", display_name: "Admin", user_role: "ADMIN" }, as: BankTreasuryManager, captures: { adm: $.data.id } }
            - { call: "POST /treasury/enrollment-users", payload: { enrollment_id: "${enr}", display_name: "Dec", user_role: "DECISION_MAKER" }, as: BankTreasuryManager, captures: { dm: $.data.id } }
            - { call: "POST /treasury/training-sessions", payload: { enrollment_id: "${enr}", trainer_id: "tr-1", scheduled_start: "2026-08-01T09:00:00Z", scheduled_end: "2026-08-01T10:00:00Z" }, as: BankOps, captures: { sess: $.data.id } }
            - { call: "POST /treasury/training-sessions/${sess}/complete", payload: { attendee_user_ids: ["${adm}"] }, as: BankOps }
            - { call: "POST /treasury/enrollments/${enr}/activate", payload: {}, as: BankTreasuryManager }
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "1", amount_cents: 500, payee_name_raw: "P", channel: "TELLER", presented_at: "2026-08-03T10:00:00Z" }, as: BankOps, captures: { it: $.data.id, ex: $.data.exception_id } }
            - { call: "POST /treasury/exceptions/${ex}/decision", payload: { decision: "RETURN" }, as: CustomerDecisionMaker, as_user_id: "${dm}", captures: { dst: $.data.status } }
          trigger:
            - { call: "POST /treasury/presented-items/${it}/reverse", payload: { reason: "try" }, as: BankTreasuryManager, captures: { err: $.data.error_id } }
          assert:
            - "Precondition: dst == DECISIONED_RETURN (item RETURNED)"
            - "err == ERR_ITEM_NOT_REVERSIBLE (409)"

      - name: terminate_blocked_with_open_exception
        claim_type: precondition_enforcement
        grounds: [state_machines.TreasuryEnrollment.ACTIVE_to_TERMINATED, "errors[ERR_ENROLLMENT_NOT_SETTLED]"]
        distinguishing_aspect: "Termination refuses while any exception is OPEN, even with all accounts closed-able."
        test_recipe:
          setup: ["ACTIVE REVERSE-tier enrollment with one OPEN exception"]
          setup_api_calls:
            - { call: "POST /treasury/enrollments", payload: { business_name: "TermCo", tier: "REVERSE_POSITIVE_PAY", default_decision: "PAY" }, as: BankTreasuryManager, captures: { enr: $.data.id } }
            - { call: "POST /treasury/accounts", payload: { enrollment_id: "${enr}", account_number: "810005" }, as: BankTreasuryManager, captures: { acct: $.data.id } }
            - { call: "POST /treasury/enrollment-users", payload: { enrollment_id: "${enr}", display_name: "Admin", user_role: "ADMIN" }, as: BankTreasuryManager, captures: { adm: $.data.id } }
            - { call: "POST /treasury/training-sessions", payload: { enrollment_id: "${enr}", trainer_id: "tr-1", scheduled_start: "2026-08-01T09:00:00Z", scheduled_end: "2026-08-01T10:00:00Z" }, as: BankOps, captures: { sess: $.data.id } }
            - { call: "POST /treasury/training-sessions/${sess}/complete", payload: { attendee_user_ids: ["${adm}"] }, as: BankOps }
            - { call: "POST /treasury/enrollments/${enr}/activate", payload: {}, as: BankTreasuryManager }
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "1", amount_cents: 500, payee_name_raw: "P", channel: "TELLER", presented_at: "2026-08-03T10:00:00Z" }, as: BankOps, captures: { ex: $.data.exception_id } }
          trigger:
            - { call: "POST /treasury/enrollments/${enr}/terminate", payload: {}, as: BankTreasuryManager, captures: { err: $.data.error_id } }
          assert: ["err == ERR_ENROLLMENT_NOT_SETTLED (409); open_exception_count still 1"]

      - name: terminate_then_upload_rejected
        claim_type: terminal_lockdown
        grounds: [state_machines.TreasuryEnrollment, "errors[ERR_ENROLLMENT_TERMINATED]"]
        distinguishing_aspect: "TERMINATED is absorbing: after a clean close-out and terminate, even well-formed uploads are rejected with the terminal error."
        test_recipe:
          setup: ["ACTIVE POSITIVE_PAY enrollment, no exceptions, account closed, enrollment terminated"]
          setup_api_calls:
            - { call: "POST /treasury/enrollments", payload: { business_name: "DeadCo", tier: "POSITIVE_PAY", default_decision: "PAY" }, as: BankTreasuryManager, captures: { enr: $.data.id } }
            - { call: "POST /treasury/accounts", payload: { enrollment_id: "${enr}", account_number: "810006" }, as: BankTreasuryManager, captures: { acct: $.data.id } }
            - { call: "POST /treasury/enrollment-users", payload: { enrollment_id: "${enr}", display_name: "Admin", user_role: "ADMIN" }, as: BankTreasuryManager, captures: { adm: $.data.id } }
            - { call: "POST /treasury/training-sessions", payload: { enrollment_id: "${enr}", trainer_id: "tr-1", scheduled_start: "2026-08-01T09:00:00Z", scheduled_end: "2026-08-01T10:00:00Z" }, as: BankOps, captures: { sess: $.data.id } }
            - { call: "POST /treasury/training-sessions/${sess}/complete", payload: { attendee_user_ids: ["${adm}"] }, as: BankOps }
            - { call: "POST /treasury/enrollments/${enr}/activate", payload: {}, as: BankTreasuryManager }
            - { call: "POST /treasury/accounts/${acct}/close", payload: {}, as: BankTreasuryManager }
            - { call: "POST /treasury/enrollments/${enr}/terminate", payload: {}, as: BankTreasuryManager, captures: { tst: $.data.status } }
          trigger:
            - { call: "POST /treasury/issue-files", payload: { enrollment_id: "${enr}", account_id: "${acct}", file_reference: "F-DEAD", rows: [ { check_number: "1", amount_cents: 100, payee_name: "P", issue_date: "2026-08-01" } ] }, as: CustomerAdmin, as_user_id: "${adm}", captures: { err: $.data.error_id } }
          assert:
            - "tst == TERMINATED"
            - "err == ERR_ENROLLMENT_TERMINATED (terminal scope error beats the account-state error)"

      - name: account_close_blocked_by_open_exception
        claim_type: precondition_enforcement
        grounds: [state_machines.Account.ACTIVE_to_CLOSED, "errors[ERR_ACCOUNT_HAS_OPEN_EXCEPTIONS]"]
        distinguishing_aspect: "An account with an OPEN exception cannot close; decisioning the exception first releases the block."
        test_recipe:
          setup: ["ACTIVE REVERSE-tier enrollment with one OPEN exception"]
          setup_api_calls:
            - { call: "POST /treasury/enrollments", payload: { business_name: "BlkCo", tier: "REVERSE_POSITIVE_PAY", default_decision: "PAY" }, as: BankTreasuryManager, captures: { enr: $.data.id } }
            - { call: "POST /treasury/accounts", payload: { enrollment_id: "${enr}", account_number: "810007" }, as: BankTreasuryManager, captures: { acct: $.data.id } }
            - { call: "POST /treasury/enrollment-users", payload: { enrollment_id: "${enr}", display_name: "Admin", user_role: "ADMIN" }, as: BankTreasuryManager, captures: { adm: $.data.id } }
            - { call: "POST /treasury/enrollment-users", payload: { enrollment_id: "${enr}", display_name: "Dec", user_role: "DECISION_MAKER" }, as: BankTreasuryManager, captures: { dm: $.data.id } }
            - { call: "POST /treasury/training-sessions", payload: { enrollment_id: "${enr}", trainer_id: "tr-1", scheduled_start: "2026-08-01T09:00:00Z", scheduled_end: "2026-08-01T10:00:00Z" }, as: BankOps, captures: { sess: $.data.id } }
            - { call: "POST /treasury/training-sessions/${sess}/complete", payload: { attendee_user_ids: ["${adm}"] }, as: BankOps }
            - { call: "POST /treasury/enrollments/${enr}/activate", payload: {}, as: BankTreasuryManager }
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "1", amount_cents: 500, payee_name_raw: "P", channel: "TELLER", presented_at: "2026-08-03T10:00:00Z" }, as: BankOps, captures: { ex: $.data.exception_id } }
          trigger:
            - { call: "POST /treasury/accounts/${acct}/close", payload: {}, as: BankTreasuryManager, captures: { err: $.data.error_id } }
            - { call: "POST /treasury/exceptions/${ex}/decision", payload: { decision: "PAY" }, as: CustomerDecisionMaker, as_user_id: "${dm}" }
            - { call: "POST /treasury/accounts/${acct}/close", payload: {}, as: BankTreasuryManager, captures: { cl: $.data.status } }
          assert:
            - "While OPEN exception exists: err == ERR_ACCOUNT_HAS_OPEN_EXCEPTIONS"
            - "After the exception resolves: cl == CLOSED"

      - name: resume_elapsed_window_rejected
        claim_type: invalid_transition
        grounds: [state_machines.AchDebitRule.SUSPENDED_to_ACTIVE, "errors[ERR_ACH_RULE_NOT_ACTIVE]"]
        distinguishing_aspect: "Resume re-validates the window: a suspended rule whose end date has passed cannot reactivate."
        test_recipe:
          setup: ["ACTIVE POSITIVE_PAY enrollment; rule window [2026-08-01, 2026-08-05), suspended, clock advanced past the end"]
          setup_api_calls:
            - { call: "POST /treasury/enrollments", payload: { business_name: "ElapCo", tier: "POSITIVE_PAY", default_decision: "PAY" }, as: BankTreasuryManager, captures: { enr: $.data.id } }
            - { call: "POST /treasury/accounts", payload: { enrollment_id: "${enr}", account_number: "810008" }, as: BankTreasuryManager, captures: { acct: $.data.id } }
            - { call: "POST /treasury/enrollment-users", payload: { enrollment_id: "${enr}", display_name: "Admin", user_role: "ADMIN" }, as: BankTreasuryManager, captures: { adm: $.data.id } }
            - { call: "POST /treasury/training-sessions", payload: { enrollment_id: "${enr}", trainer_id: "tr-1", scheduled_start: "2026-07-01T09:00:00Z", scheduled_end: "2026-07-01T10:00:00Z" }, as: BankOps, captures: { sess: $.data.id } }
            - { call: "POST /treasury/training-sessions/${sess}/complete", payload: { attendee_user_ids: ["${adm}"] }, as: BankOps }
            - { call: "POST /treasury/enrollments/${enr}/activate", payload: {}, as: BankTreasuryManager }
            - { call: "POST /treasury/ach-rules", payload: { account_id: "${acct}", rule_type: "BLOCK", originator_company_id: "ORG9", sec_code: "WEB", effective_start_date: "2026-08-01", effective_end_date: "2026-08-05" }, as: CustomerAdmin, as_user_id: "${adm}", captures: { rule: $.data.id } }
            - { call: "POST /treasury/ach-rules/${rule}/suspend", payload: {}, as: CustomerAdmin, as_user_id: "${adm}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T00:00:00Z" }, as: BankOps }
          trigger:
            - { call: "POST /treasury/ach-rules/${rule}/resume", payload: {}, as: CustomerAdmin, as_user_id: "${adm}", captures: { err: $.data.error_id } }
          assert: ["err == ERR_ACH_RULE_NOT_ACTIVE (409)"]

      - name: session_complete_after_cancel_rejected
        claim_type: invalid_transition
        grounds: [state_machines.TrainingSession.SCHEDULED_to_CANCELLED, "errors[ERR_SESSION_NOT_COMPLETABLE]"]
        distinguishing_aspect: "CANCELLED is terminal for completion — with a perfectly valid attendee list, the state guard still fires."
