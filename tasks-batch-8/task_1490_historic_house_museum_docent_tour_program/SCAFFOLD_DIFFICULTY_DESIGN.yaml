            - { call: "POST /shift-assignments", payload: { docent_id: "${d1}", slot_id: "${slot1}", shift_role: "LEAD" }, as: DocentCoordinator, captures: { sh1: $.data.id } }
            - { call: "POST /shift-assignments/${sh1}/confirm", payload: {}, as: Docent, as_user_id: "${d1}" }
            - { call: "POST /tour-slots/${slot1}/open", payload: {}, as: MuseumAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T10:00:00Z" }, as: MuseumAdmin }
            - { call: "POST /tour-slots/${slot1}/advance", payload: { to_status: "IN_PROGRESS" }, as: MuseumAdmin }
          trigger:
            - { call: "POST /bookings", payload: { slot_id: "${slot1}", booking_kind: "GENERAL", visitor_name: "Gus", party_size: 1 }, as: FrontDeskStaff }
          assert:
            - "response http_status == 409 and error_id == ERR_SLOT_NOT_OPEN (Booking creation depends on TourSlot.status == OPEN)"

      - name: slot_open_requires_published_script
        grounds:
          - state_machines.TourSlot.SCHEDULED_to_OPEN
          - state_machines.ScriptVersion
          - errors[ERR_SCRIPT_NOT_PUBLISHED]
        distinguishing_aspect: |
          Entity pair TourSlot -> ScriptVersion (different pair than
          Booking -> TourSlot): a fully staffed slot on an ACTIVE route cannot
          open while the route's only script is still IN_REVIEW (no PUBLISHED
          script); rejected with ERR_SCRIPT_NOT_PUBLISHED.
        test_recipe:
          setup:
            - "SCHEDULED slot ${slot1} on ACTIVE route ${route1}, staffing STAFFED, but the route's only script ${s1} is IN_REVIEW (never approved/published)"
          setup_api_calls:
            - { call: "POST /rooms", payload: { name: "Parlor", floor: 1, capacity_max: 20, safety_max_party: 12, collection_tier: "STANDARD" }, as: MuseumAdmin, captures: { r1: $.data.id } }
            - { call: "POST /tour-routes", payload: { name: "Main Floor", kind: "STANDARD", room_ids: ["${r1}"], duration_minutes: 60, base_price_cents: 1000 }, as: MuseumAdmin, captures: { route1: $.data.id } }
            - { call: "POST /tour-routes/${route1}/script-versions", payload: { content_text: "Script under review", curriculum_standards: [] }, as: Curator, captures: { s1: $.data.id } }
            - { call: "POST /script-versions/${s1}/submit", payload: {}, as: Curator }
            - { call: "POST /tour-routes/${route1}/activate", payload: {}, as: MuseumAdmin }
            - { call: "POST /docents", payload: { full_name: "Dee Ocent", email: "dee@x.org" }, as: DocentCoordinator, captures: { d1: $.data.id } }
            - { call: "POST /docents/${d1}/advance", payload: { to_status: "TRAINEE" }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "HOURS", value: 30 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "SHADOW_TOUR", value: 1 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "SHADOW_TOUR", value: 1 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "SHADOW_TOUR", value: 1 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "QUIZ", value: 90 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/advance", payload: { to_status: "CERTIFIED", route_ids: ["${route1}"] }, as: DocentCoordinator }
            - { call: "POST /tour-slots", payload: { route_id: "${route1}", start_at: "2026-09-01T10:00:00Z" }, as: MuseumAdmin, captures: { slot1: $.data.id } }
            - { call: "POST /shift-assignments", payload: { docent_id: "${d1}", slot_id: "${slot1}", shift_role: "LEAD" }, as: DocentCoordinator, captures: { sh1: $.data.id } }
            - { call: "POST /shift-assignments/${sh1}/confirm", payload: {}, as: Docent, as_user_id: "${d1}" }
          trigger:
            - { call: "POST /tour-slots/${slot1}/open", payload: {}, as: MuseumAdmin }
          assert:
            - "response http_status == 409 and error_id == ERR_SCRIPT_NOT_PUBLISHED (TourSlot opening depends on a PUBLISHED ScriptVersion for its route)"
            - "TourSlot.${slot1}.status remains SCHEDULED"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: docent_shift_buffer_overlap
        grounds:
          - validations[priority=10]
          - errors[ERR_SHIFT_OVERLAP]
        distinguishing_aspect: |
          Resource Docent, buffer interval semantics: a new shift conflicts iff
          new.start < existing.end + 30min (and symmetrically) — a gap of
          exactly 30 minutes (11:30 after 10:00-11:00) is allowed, 29 minutes
          (11:29-style gap at 11:20 wait no: 11:20 < 11:30) is rejected with
          ERR_SHIFT_OVERLAP.
        test_recipe:
          setup:
            - "Docent ${d1} CERTIFIED on routes ${route1} and ${route2}, CONFIRMED LEAD of slot1 (route1, room ${ra}, 2026-09-01 10:00-11:00); slot2 on route1 at 11:30 (exactly 30 min gap); slot3 on route2 (room ${rb}) at 11:20 (20 min gap)"
          setup_api_calls:
            - { call: "POST /rooms", payload: { name: "Parlor", floor: 1, capacity_max: 20, safety_max_party: 12, collection_tier: "STANDARD" }, as: MuseumAdmin, captures: { ra: $.data.id } }
            - { call: "POST /rooms", payload: { name: "Library", floor: 2, capacity_max: 15, safety_max_party: 10, collection_tier: "STANDARD" }, as: MuseumAdmin, captures: { rb: $.data.id } }
            - { call: "POST /tour-routes", payload: { name: "Main Floor", kind: "STANDARD", room_ids: ["${ra}"], duration_minutes: 60, base_price_cents: 1000 }, as: MuseumAdmin, captures: { route1: $.data.id } }
            - { call: "POST /tour-routes", payload: { name: "Library Tour", kind: "STANDARD", room_ids: ["${rb}"], duration_minutes: 60, base_price_cents: 1000 }, as: MuseumAdmin, captures: { route2: $.data.id } }
            - { call: "POST /tour-routes/${route1}/activate", payload: {}, as: MuseumAdmin }
            - { call: "POST /tour-routes/${route2}/activate", payload: {}, as: MuseumAdmin }
            - { call: "POST /docents", payload: { full_name: "Dee Ocent", email: "dee@x.org" }, as: DocentCoordinator, captures: { d1: $.data.id } }
            - { call: "POST /docents/${d1}/advance", payload: { to_status: "TRAINEE" }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "HOURS", value: 30 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "SHADOW_TOUR", value: 1 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "SHADOW_TOUR", value: 1 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "SHADOW_TOUR", value: 1 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "QUIZ", value: 90 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/advance", payload: { to_status: "CERTIFIED", route_ids: ["${route1}", "${route2}"] }, as: DocentCoordinator }
            - { call: "POST /tour-slots", payload: { route_id: "${route1}", start_at: "2026-09-01T10:00:00Z" }, as: MuseumAdmin, captures: { slot1: $.data.id } }
            - { call: "POST /tour-slots", payload: { route_id: "${route1}", start_at: "2026-09-01T11:30:00Z" }, as: MuseumAdmin, captures: { slot2: $.data.id } }
            - { call: "POST /tour-slots", payload: { route_id: "${route2}", start_at: "2026-09-01T11:20:00Z" }, as: MuseumAdmin, captures: { slot3: $.data.id } }
            - { call: "POST /shift-assignments", payload: { docent_id: "${d1}", slot_id: "${slot1}", shift_role: "LEAD" }, as: DocentCoordinator, captures: { sh1: $.data.id } }
            - { call: "POST /shift-assignments/${sh1}/confirm", payload: {}, as: Docent, as_user_id: "${d1}" }
          trigger:
            - { call: "POST /shift-assignments", payload: { docent_id: "${d1}", slot_id: "${slot2}", shift_role: "LEAD" }, as: DocentCoordinator, captures: { sh2: $.data.id, sh2_st: $.data.status } }
            - { call: "POST /shift-assignments", payload: { docent_id: "${d1}", slot_id: "${slot3}", shift_role: "LEAD" }, as: DocentCoordinator }
          assert:
            - "ShiftAssignment.${sh2}.status == ASSIGNED — exactly 30-minute gap (11:30 start after 11:00 end) satisfies the buffer (boundary is exclusive of conflict)"
            - "slot3 trigger returns http_status 409 with error_id == ERR_SHIFT_OVERLAP (11:20 < 11:00 + 30min)"

      - name: room_occupancy_half_open
        grounds:
          - calculations.room_occupancy_windows
          - errors[ERR_ROOM_OCCUPANCY_CONFLICT]
        distinguishing_aspect: |
          Resource Room, half-open interval semantics (different resource and
          different semantics than the docent 30-minute buffer): a slot starting
          exactly when another ends (11:00 after 10:00-11:00) is allowed;
          starting one minute earlier (10:59) collides with
          ERR_ROOM_OCCUPANCY_CONFLICT.
        test_recipe:
          setup:
            - "ACTIVE route ${route1} over single room ${r1}, duration 60; slot1 already occupies ${r1} [10:00, 11:00)"
          setup_api_calls:
            - { call: "POST /rooms", payload: { name: "Parlor", floor: 1, capacity_max: 20, safety_max_party: 12, collection_tier: "STANDARD" }, as: MuseumAdmin, captures: { r1: $.data.id } }
            - { call: "POST /tour-routes", payload: { name: "Main Floor", kind: "STANDARD", room_ids: ["${r1}"], duration_minutes: 60, base_price_cents: 1000 }, as: MuseumAdmin, captures: { route1: $.data.id } }
            - { call: "POST /tour-routes/${route1}/activate", payload: {}, as: MuseumAdmin }
            - { call: "POST /tour-slots", payload: { route_id: "${route1}", start_at: "2026-09-01T10:00:00Z" }, as: MuseumAdmin, captures: { slot1: $.data.id } }
          trigger:
            - { call: "POST /tour-slots", payload: { route_id: "${route1}", start_at: "2026-09-01T11:00:00Z" }, as: MuseumAdmin, captures: { slot2: $.data.id, slot2_end: $.data.end_at } }
            - { call: "POST /tour-slots", payload: { route_id: "${route1}", start_at: "2026-09-01T10:59:00Z" }, as: MuseumAdmin }
          assert:
            - "TourSlot.${slot2} created with end_at == 2026-09-01T12:00:00Z — touching endpoints (10:00-11:00 vs 11:00-12:00) do NOT conflict under half-open semantics"
            - "10:59 trigger returns http_status 409 with error_id == ERR_ROOM_OCCUPANCY_CONFLICT"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: seat_bucket_conservation
        grounds:
          - entities.TourSlot.fields.seats_reserved
          - entities.TourSlot.fields.seats_confirmed
          - entities.TourSlot.fields.seats_available
          - state_machines.Booking
        distinguishing_aspect: |
          Conserved quantity: seat buckets. At every observation,
          seats_reserved + seats_confirmed + seats_available == capacity (18);
          the create/cancel pair leaves the slot exactly at its baseline.
        test_recipe:
          setup:
            - "OPEN slot ${slot1} with capacity 18 and no bookings"
          setup_api_calls:
            - { call: "POST /rooms", payload: { name: "Parlor", floor: 1, capacity_max: 20, safety_max_party: 12, collection_tier: "STANDARD" }, as: MuseumAdmin, captures: { r1: $.data.id } }
            - { call: "POST /tour-routes", payload: { name: "Main Floor", kind: "STANDARD", room_ids: ["${r1}"], duration_minutes: 60, base_price_cents: 1000 }, as: MuseumAdmin, captures: { route1: $.data.id, route1_v: $.data.version } }
            - { call: "POST /tour-routes/${route1}/script-versions", payload: { content_text: "Script", curriculum_standards: [] }, as: Curator, captures: { s1: $.data.id } }
            - { call: "POST /script-versions/${s1}/submit", payload: {}, as: Curator }
            - { call: "POST /script-versions/${s1}/review", payload: { decision: "APPROVE", accuracy_score: 90 }, as: Curator }
            - { call: "POST /script-versions/${s1}/publish", payload: { expected_route_version: "${route1_v}" }, as: MuseumAdmin }
            - { call: "POST /tour-routes/${route1}/activate", payload: {}, as: MuseumAdmin }
            - { call: "POST /docents", payload: { full_name: "Dee Ocent", email: "dee@x.org" }, as: DocentCoordinator, captures: { d1: $.data.id } }
            - { call: "POST /docents/${d1}/advance", payload: { to_status: "TRAINEE" }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "HOURS", value: 30 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "SHADOW_TOUR", value: 1 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "SHADOW_TOUR", value: 1 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "SHADOW_TOUR", value: 1 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "QUIZ", value: 90 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/advance", payload: { to_status: "CERTIFIED", route_ids: ["${route1}"] }, as: DocentCoordinator }
            - { call: "POST /tour-slots", payload: { route_id: "${route1}", start_at: "2026-09-01T10:00:00Z" }, as: MuseumAdmin, captures: { slot1: $.data.id } }
            - { call: "POST /shift-assignments", payload: { docent_id: "${d1}", slot_id: "${slot1}", shift_role: "LEAD" }, as: DocentCoordinator, captures: { sh1: $.data.id } }
            - { call: "POST /shift-assignments/${sh1}/confirm", payload: {}, as: Docent, as_user_id: "${d1}" }
            - { call: "POST /tour-slots/${slot1}/open", payload: {}, as: MuseumAdmin }
            - { call: "GET /tour-slots/${slot1}", payload: {}, as: MuseumAdmin, captures: { r0: $.data.seats_reserved, c0: $.data.seats_confirmed, a0: $.data.seats_available } }
          trigger:
            - { call: "POST /bookings", payload: { slot_id: "${slot1}", booking_kind: "GENERAL", visitor_name: "Ann", party_size: 4 }, as: FrontDeskStaff, captures: { bk1: $.data.id } }
            - { call: "GET /tour-slots/${slot1}", payload: {}, as: MuseumAdmin, captures: { r1v: $.data.seats_reserved, c1v: $.data.seats_confirmed, a1v: $.data.seats_available } }
            - { call: "POST /bookings/${bk1}/cancel", payload: {}, as: FrontDeskStaff }
            - { call: "GET /tour-slots/${slot1}", payload: {}, as: MuseumAdmin, captures: { r2v: $.data.seats_reserved, c2v: $.data.seats_confirmed, a2v: $.data.seats_available } }
          assert:
            - "baseline: 0 + 0 + 18 == 18"
            - "after reserve: seats_reserved == 4, seats_confirmed == 0, seats_available == 14; 4 + 0 + 14 == 18"
            - "after cancel: seats_reserved == 0, seats_confirmed == 0, seats_available == 18 — identical to baseline, no drift"

      - name: revenue_conservation_confirm_then_refund
        grounds:
          - calculations.refund_cents
          - calculations.slot_revenue_projection
          - entities.TourSlot.fields.revenue_committed_cents
        distinguishing_aspect: |
          Conserved quantity: money (different quantity than seat buckets).
          Confirm-then-cancel with a 100% refund returns
          revenue_committed_cents to baseline and pins
          refund_cents == total_price_cents == 2000.
        test_recipe:
          setup:
            - "OPEN slot ${slot1} starting 2026-09-10 (more than 48h after the default clock), no bookings"
          setup_api_calls:
            - { call: "POST /rooms", payload: { name: "Parlor", floor: 1, capacity_max: 20, safety_max_party: 12, collection_tier: "STANDARD" }, as: MuseumAdmin, captures: { r1: $.data.id } }
            - { call: "POST /tour-routes", payload: { name: "Main Floor", kind: "STANDARD", room_ids: ["${r1}"], duration_minutes: 60, base_price_cents: 1000 }, as: MuseumAdmin, captures: { route1: $.data.id, route1_v: $.data.version } }
            - { call: "POST /tour-routes/${route1}/script-versions", payload: { content_text: "Script", curriculum_standards: [] }, as: Curator, captures: { s1: $.data.id } }
            - { call: "POST /script-versions/${s1}/submit", payload: {}, as: Curator }
            - { call: "POST /script-versions/${s1}/review", payload: { decision: "APPROVE", accuracy_score: 90 }, as: Curator }
            - { call: "POST /script-versions/${s1}/publish", payload: { expected_route_version: "${route1_v}" }, as: MuseumAdmin }
            - { call: "POST /tour-routes/${route1}/activate", payload: {}, as: MuseumAdmin }
            - { call: "POST /docents", payload: { full_name: "Dee Ocent", email: "dee@x.org" }, as: DocentCoordinator, captures: { d1: $.data.id } }
            - { call: "POST /docents/${d1}/advance", payload: { to_status: "TRAINEE" }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "HOURS", value: 30 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "SHADOW_TOUR", value: 1 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "SHADOW_TOUR", value: 1 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "SHADOW_TOUR", value: 1 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "QUIZ", value: 90 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/advance", payload: { to_status: "CERTIFIED", route_ids: ["${route1}"] }, as: DocentCoordinator }
            - { call: "POST /tour-slots", payload: { route_id: "${route1}", start_at: "2026-09-10T10:00:00Z" }, as: MuseumAdmin, captures: { slot1: $.data.id } }
            - { call: "POST /shift-assignments", payload: { docent_id: "${d1}", slot_id: "${slot1}", shift_role: "LEAD" }, as: DocentCoordinator, captures: { sh1: $.data.id } }
            - { call: "POST /shift-assignments/${sh1}/confirm", payload: {}, as: Docent, as_user_id: "${d1}" }
            - { call: "POST /tour-slots/${slot1}/open", payload: {}, as: MuseumAdmin }
          trigger:
            - { call: "POST /bookings", payload: { slot_id: "${slot1}", booking_kind: "GENERAL", visitor_name: "Ann", party_size: 2 }, as: FrontDeskStaff, captures: { bk1: $.data.id } }
            - { call: "POST /bookings/${bk1}/confirm", payload: { paid_cents: 2000 }, as: FrontDeskStaff }
            - { call: "GET /tour-slots/${slot1}", payload: {}, as: MuseumAdmin, captures: { rev_mid: $.data.revenue_committed_cents } }
            - { call: "POST /bookings/${bk1}/cancel", payload: {}, as: FrontDeskStaff, captures: { refund: $.data.refund_cents, total: $.data.total_price_cents } }
            - { call: "GET /tour-slots/${slot1}", payload: {}, as: MuseumAdmin, captures: { rev_post: $.data.revenue_committed_cents } }
          assert:
            - "after confirm: revenue_committed_cents == 2000"
