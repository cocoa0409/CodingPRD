            - "GearItem.${item_ok_id}.replacement_value_depreciated_cents == 74900 (0 completed years; residual floor 19975 not binding) and replacement_value_successor_cents == 71910"
            - "GearItem.${item_ok_id}.disposition_status == WITH_CUSTOMER, proof_of_purchase_type == NONE, condition_grade == B"

      - name: path_id_existence_checked_before_body_id_not_found
        claim_type: priority_ordering
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_REPAIR_ORDER_NOT_FOUND]
        distinguishing_aspect: "With an unknown order in the path AND an unknown part lot in the body, priority 6 answers first: ERR_REPAIR_ORDER_NOT_FOUND, never ERR_PART_LOT_NOT_FOUND."
        test_recipe:
          setup: ["clock 2026-06-15T09:00:00Z; a center exists so the technician actor resolves, but no repair order and no part lot are created"]
          setup_api_calls:
            - call: "POST /gear-service/_clock/set_current_utc"
