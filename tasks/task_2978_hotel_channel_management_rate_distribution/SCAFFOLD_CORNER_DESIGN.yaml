            - call: "POST /distribution/rate-plans/${bar_id}/activate"
              payload: {}
              as: RevenueManager
          trigger:
            - call: "POST /distribution/reservations"
              payload: { channel_id: "${ota1_id}", rate_plan_id: "${bar_id}", room_type_id: "${king_id}", arrival_date: "2026-09-10", nights: 1 }
              as: ChannelPartner
              as_user_id: "${opq1_id}"
            - call: "POST /distribution/reservations"
              payload: { channel_id: "${opq1_id}", rate_plan_id: "${bar_id}", room_type_id: "${king_id}", arrival_date: "2026-09-10", nights: 1 }
              as: ChannelPartner
              as_user_id: "${opq1_id}"
              captures: { opq_res_id: $.data.id }
            - call: "POST /distribution/reservations/${opq_res_id}/cancel"
              payload: {}
              as: ChannelPartner
              as_user_id: "${ota1_id}"
            - call: "GET /distribution/reservations/${opq_res_id}"
              payload: {}
              as: ChannelPartner
              as_user_id: "${opq1_id}"
            - call: "POST /distribution/reservations/${opq_res_id}/cancel"
              payload: {}
              as: ChannelPartner
              as_user_id: "${opq1_id}"
          assert:
            - "Booking OTA1's channel while authenticated as OPQ1 returns HTTP 403 with data.error_id == ERR_CHANNEL_OWNERSHIP_VIOLATION - the role IS listed on the endpoint, so this is not ERR_ROLE_NOT_PERMITTED"
            - "OPQ1 booking its own channel returns HTTP 201 with channel_id == ${opq1_id}, reservation_state CONFIRMED and gross_amount_cents 25000 (BAR at base, no promotions, no channel adjustment)"
            - "OTA1 trying to cancel OPQ1's reservation returns HTTP 403 ERR_CHANNEL_OWNERSHIP_VIOLATION and the reservation read back by its owner is still CONFIRMED with cancelled_at null"
            - "OPQ1 cancelling its own reservation returns HTTP 200 with reservation_state CANCELLED"
            - "Neither refusal touched the ledger: after the sequence GET /distribution/channels/${ota1_id} shows bookings_count 0 and cancellations_count 0"

      - name: the_same_director_cannot_submit_and_then_approve_or_reject_a_promotion
        claim_type: segregation_of_duties
        grounds:
          - roles[RevenueDirector]
          - validations[priority=13]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: |
          Submit is a shared operation, so a director may legitimately submit - and that legitimate act
          is exactly what disqualifies them from both terminal decisions. The bar is per user id, not
          per role: a second RevenueDirector approves the very same promotion. It also covers reject,
          which shares the rule with approve, and the revise reset that re-opens the door.
        test_recipe:
          setup:
            - "Property HTL-SFO with plan BAR ACTIVE and promotion MEMBER10 on BAR (MEMBER_RATE, PERCENT 1000, 2026-09-01..2026-09-30)."
            - "The promotion is submitted by RevenueDirector user id rd-1, so approval_status is SUBMITTED and submitted_by_user_id is rd-1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /distribution/properties"
              payload: { code: "HTL-SFO", name: "Harborview SFO", currency_code: "USD", overbooking_pct_bp: 1000, booking_horizon_days: 365, mix_window_days: 30, rate_mismatch_tolerance_cents: 200, required_image_count: 5 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/rate-plans"
              payload: { code: "BAR", rate_class: "PUBLIC", base_amount_cents: 25000, floor_amount_cents: 18000, ceiling_amount_cents: 40000 }
              as: RevenueManager
              captures: { bar_id: $.data.id }
            - call: "POST /distribution/rate-plans/${bar_id}/activate"
              payload: {}
              as: RevenueManager
            - call: "POST /distribution/rate-plans/${bar_id}/promotions"
              payload: { code: "MEMBER10", promo_kind: "MEMBER_RATE", discount_kind: "PERCENT", discount_bp: 1000, start_date: "2026-09-01", end_date: "2026-09-30" }
              as: RevenueManager
              captures: { promo_id: $.data.id }
            - call: "POST /distribution/promotions/${promo_id}/submit"
              payload: {}
              as: RevenueDirector
              as_user_id: "rd-1"
              captures: { promo_v_submitted: $.data.version }
          trigger:
            - call: "POST /distribution/promotions/${promo_id}/approve"
              payload: {}
              as: RevenueDirector
              as_user_id: "rd-1"
            - call: "POST /distribution/promotions/${promo_id}/reject"
              payload: { reason: "self review" }
              as: RevenueDirector
              as_user_id: "rd-1"
            - call: "GET /distribution/promotions/${promo_id}"
              payload: {}
              as: RevenueDirector
              as_user_id: "rd-1"
            - call: "POST /distribution/promotions/${promo_id}/approve"
              payload: {}
              as: RevenueDirector
              as_user_id: "rd-2"
          assert:
            - "The submit response records submitted_by_user_id == \"rd-1\" while approval_status is SUBMITTED and approved_by_user_id is still null"
            - "rd-1's approve returns HTTP 403 with data.error_id == ERR_SEGREGATION_OF_DUTIES"
            - "rd-1's reject returns HTTP 403 ERR_SEGREGATION_OF_DUTIES too - the rule guards both terminal decisions, and reject_reason stays null"
            - "The read-back shows approval_status still SUBMITTED, submitted_by_user_id \"rd-1\", reject_reason null and version still ${promo_v_submitted} - a 403 applies no side effect"
            - "rd-2's approve returns HTTP 200 with approval_status APPROVED and approved_by_user_id \"rd-2\": the block is keyed on the user id, not on the role"

      - name: partner_override_and_human_guard_lift_are_both_rejected
        claim_type: role_forbidden_operations
        grounds:
          - roles[ChannelPartner]
          - validations[priority=6]
          - errors[ERR_OVERRIDE_NOT_PERMITTED]
          - state_machines[InventoryDay]
        distinguishing_aspect: |
          One error id guards two opposite directions of the same authority boundary: a partner may not
          claim overbooking authority it never had, and a human may not take back authority the system
          owns once an AUTO_OVERBOOK_GUARD restriction exists. The partner refusal fires at priority 6
          even on a day with plenty of room, i.e. before the ceiling check would ever have been needed.
        test_recipe:
          setup:
            - "Property HTL-SFO, room type TWIN with physical_capacity_units 2 and overbooking_pct_bp 5000 so its ceiling is floor(2 + 2*5000/10000) == 3."
            - "InventoryDay on 2026-09-10, channel OTA1 with an activated (HEALTHY) connection, plan BAR ACTIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /distribution/properties"
              payload: { code: "HTL-SFO", name: "Harborview SFO", currency_code: "USD", overbooking_pct_bp: 1000, booking_horizon_days: 365, mix_window_days: 30, rate_mismatch_tolerance_cents: 200, required_image_count: 5 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/room-types"
              payload: { code: "TWIN", name: "Twin Room", physical_capacity_units: 2, master_description_hash: "twinv1", master_image_count: 5, overbooking_pct_bp: 5000 }
              as: RevenueManager
              captures: { twin_id: $.data.id }
            - call: "POST /distribution/room-types/${twin_id}/inventory-days"
              payload: { stay_date: "2026-09-10" }
              as: RevenueManager
              captures: { inv_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/channels"
              payload: { code: "OTA1", channel_kind: "OTA_PUBLIC", commission_bp: 1750 }
              as: PlatformAdmin
              captures: { ota1_id: $.data.id }
            - call: "POST /distribution/channels/${ota1_id}/connections"
              payload: { protocol: "JSON_PUSH", endpoint_url: "https://ota1.example.com/ari" }
              as: ChannelOpsEngineer
              captures: { conn_id: $.data.id }
            - call: "POST /distribution/channel-connections/${conn_id}/activate"
              payload: {}
              as: ChannelOpsEngineer
            - call: "POST /distribution/properties/${prop_id}/rate-plans"
              payload: { code: "BAR", rate_class: "PUBLIC", base_amount_cents: 25000, floor_amount_cents: 18000, ceiling_amount_cents: 40000 }
              as: RevenueManager
              captures: { bar_id: $.data.id }
            - call: "POST /distribution/rate-plans/${bar_id}/activate"
              payload: {}
              as: RevenueManager
          trigger:
            - call: "POST /distribution/reservations"
              payload: { channel_id: "${ota1_id}", rate_plan_id: "${bar_id}", room_type_id: "${twin_id}", arrival_date: "2026-09-10", nights: 1, override_overbooking: true }
              as: ChannelPartner
              as_user_id: "${ota1_id}"
            - call: "POST /distribution/reservations"
              payload: { channel_id: "${ota1_id}", rate_plan_id: "${bar_id}", room_type_id: "${twin_id}", arrival_date: "2026-09-10", nights: 1 }
              as: RevenueManager
            - call: "POST /distribution/reservations"
              payload: { channel_id: "${ota1_id}", rate_plan_id: "${bar_id}", room_type_id: "${twin_id}", arrival_date: "2026-09-10", nights: 1 }
              as: RevenueManager
            - call: "POST /distribution/reservations"
              payload: { channel_id: "${ota1_id}", rate_plan_id: "${bar_id}", room_type_id: "${twin_id}", arrival_date: "2026-09-10", nights: 1, override_overbooking: true }
              as: RevenueManager
            - call: "GET /distribution/restrictions"
              payload: { room_type_id: "${twin_id}", restriction_type: "STOP_SELL" }
              as: RevenueManager
              captures: { guard_id: "$.data[0].id" }
            - call: "POST /distribution/restrictions/${guard_id}/lift"
              payload: {}
              as: RevenueManager
            - call: "POST /distribution/restrictions/${guard_id}/lift"
              payload: {}
              as: RevenueDirector
          assert:
            - "The partner's booking returns HTTP 403 with data.error_id == ERR_OVERRIDE_NOT_PERMITTED although the day was completely empty - the override authority check at priority 6 never consults inventory"
            - "The two plain RevenueManager bookings return HTTP 201; after the second, InventoryDay.${inv_id} reads { committed_units: 2, allocated_units: 0, shared_pool_units: 0, pooled_state: \"EXHAUSTED\" }"
            - "The third RevenueManager booking (override_overbooking true) returns HTTP 201 with overbooking_overridden true, and the day becomes { committed_units: 3, pooled_state: \"OVERSOLD\" }"
            - "That transition created exactly one Restriction - the list read has total_count == 1 with { restriction_type: \"STOP_SELL\", origin: \"AUTO_OVERBOOK_GUARD\", restriction_state: \"ACTIVE\", start_date: \"2026-09-10\", end_date: \"2026-09-10\" } (one per ACTIVE plan, and BAR is the only one)"
            - "RevenueManager lifting that guard returns HTTP 403 ERR_OVERRIDE_NOT_PERMITTED and the restriction is still ACTIVE with lift_reason null"
            - "RevenueDirector attempting the same lift returns HTTP 403 ERR_ROLE_NOT_PERMITTED instead - priority 3 fires before priority 6, so the two 403s are distinguishable by error_id"

  # =====================================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_room_type_version_is_refused_and_a_matching_echo_is_spent_by_the_write
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[allocation-create-stale-room-type]
          - errors[ERR_STALE_ROOM_TYPE_VERSION]
          - endpoints[POST /distribution/room-types/{id}/allocations]
        distinguishing_aspect: |
          The allotment endpoint borrows the PARENT room type's version, and the room type's version is
          bumped by two unrelated writes - a PATCH and an accepted allotment. So a caller who read the
          room type, patched it and then allotted is stale, and a caller who replays a version that has
          just been spent by its own successful allotment is stale too.
        test_recipe:
          setup:
            - "Property HTL-SFO, room type KING capacity 10 (version 1 on create), InventoryDay on 2026-09-10, channel OTA1 with an activated connection."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /distribution/properties"
              payload: { code: "HTL-SFO", name: "Harborview SFO", currency_code: "USD", overbooking_pct_bp: 1000, booking_horizon_days: 365, mix_window_days: 30, rate_mismatch_tolerance_cents: 200, required_image_count: 5 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/room-types"
              payload: { code: "KING", name: "King Room", physical_capacity_units: 10, master_description_hash: "kingv1", master_image_count: 5 }
              as: RevenueManager
              captures: { king_id: $.data.id, king_v1: $.data.version }
            - call: "POST /distribution/room-types/${king_id}/inventory-days"
              payload: { stay_date: "2026-09-10" }
              as: RevenueManager
              captures: { inv_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/channels"
              payload: { code: "OTA1", channel_kind: "OTA_PUBLIC", commission_bp: 1750 }
              as: PlatformAdmin
              captures: { ota1_id: $.data.id }
            - call: "POST /distribution/channels/${ota1_id}/connections"
              payload: { protocol: "JSON_PUSH", endpoint_url: "https://ota1.example.com/ari" }
              as: ChannelOpsEngineer
              captures: { conn_id: $.data.id }
            - call: "POST /distribution/channel-connections/${conn_id}/activate"
              payload: {}
              as: ChannelOpsEngineer
          trigger:
            - call: "PATCH /distribution/room-types/${king_id}"
              payload: { name: "King Room Harbour View" }
              as: RevenueManager
              captures: { king_v2: $.data.version }
            - call: "POST /distribution/room-types/${king_id}/allocations"
              payload: { channel_id: "${ota1_id}", allocated_units: 2, start_date: "2026-09-10", end_date: "2026-09-10", expected_room_type_version: "${king_v1}" }
              as: RevenueManager
            - call: "POST /distribution/room-types/${king_id}/allocations"
              payload: { channel_id: "${ota1_id}", allocated_units: 2, start_date: "2026-09-10", end_date: "2026-09-10", expected_room_type_version: "${king_v2}" }
              as: RevenueManager
              captures: { alloc_id: $.data.id }
            - call: "POST /distribution/room-types/${king_id}/allocations"
              payload: { channel_id: "${ota1_id}", allocated_units: 3, start_date: "2026-09-10", end_date: "2026-09-10", expected_room_type_version: "${king_v2}" }
              as: RevenueManager
            - call: "GET /distribution/room-types/${king_id}"
              payload: {}
              as: RevenueManager
          assert:
            - "The room type is created with version == 1 (${king_v1}) and the PATCH returns version == 2 (${king_v2})"
            - "The allotment echoing ${king_v1} returns HTTP 412 with data.error_id == ERR_STALE_ROOM_TYPE_VERSION"
            - "That refusal applied nothing: no ChannelAllocation row exists yet and InventoryDay.${inv_id} still reads { allocated_units: 0, shared_pool_units: 11, pooled_state: \"OPEN\" }"
            - "The allotment echoing ${king_v2} returns HTTP 201 with allocation_state OPEN and allocated_units 2, and InventoryDay.${inv_id} becomes { allocated_units: 2, shared_pool_units: 9 }"
            - "Replaying ${king_v2} for 3 units returns HTTP 412 ERR_STALE_ROOM_TYPE_VERSION - the accepted write spent that version - and the first allotment is NOT superseded: GET /distribution/allocations?room_type_id=${king_id} has total_count == 1 with allocation_state OPEN"
            - "The final read shows version == 3: two accepted writes (the PATCH and the allotment) bumped it, the two refusals did not, and the read itself does not"

      - name: stale_rate_plan_version_is_refused_and_a_correct_echo_rederives_and_fans_out
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[rate-plan-update-stale-version]
          - errors[ERR_STALE_RATE_PLAN_VERSION]
          - endpoints[PATCH /distribution/rate-plans/{id}]
        distinguishing_aspect: |
          Activation itself bumps RatePlan.version, so the natural read-then-write sequence (read the
          DRAFT plan, activate it, reprice it) is stale on the version check rather than on state - and
          the 412 must suppress the whole downstream fan-out: no re-derivation of the child plan, no
          RATE batch and no jobs. The accepted retry then produces all three at once.
        test_recipe:
          setup:
            - "Property HTL-SFO, room type KING, channel OTA1 with an activated connection."
            - "Plan BAR (PUBLIC, base 25000) and its child CORP (NEGOTIATED, parent BAR, offset PERCENT -1500, resolved 21250), both ACTIVE."
            - "Mapping BAR x OTA1 x KING is VERIFIED and IN_PARITY; CORP has no mapping at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /distribution/properties"
              payload: { code: "HTL-SFO", name: "Harborview SFO", currency_code: "USD", overbooking_pct_bp: 1000, booking_horizon_days: 365, mix_window_days: 30, rate_mismatch_tolerance_cents: 200, required_image_count: 5 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/room-types"
              payload: { code: "KING", name: "King Room", physical_capacity_units: 10, master_description_hash: "kingv1", master_image_count: 5 }
              as: RevenueManager
              captures: { king_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/channels"
              payload: { code: "OTA1", channel_kind: "OTA_PUBLIC", commission_bp: 1750 }
              as: PlatformAdmin
              captures: { ota1_id: $.data.id }
            - call: "POST /distribution/channels/${ota1_id}/connections"
              payload: { protocol: "JSON_PUSH", endpoint_url: "https://ota1.example.com/ari" }
              as: ChannelOpsEngineer
              captures: { conn_id: $.data.id }
            - call: "POST /distribution/channel-connections/${conn_id}/activate"
              payload: {}
              as: ChannelOpsEngineer
            - call: "POST /distribution/properties/${prop_id}/rate-plans"
              payload: { code: "BAR", rate_class: "PUBLIC", base_amount_cents: 25000, floor_amount_cents: 18000, ceiling_amount_cents: 40000 }
              as: RevenueManager
              captures: { bar_id: $.data.id, bar_v_draft: $.data.version }
            - call: "POST /distribution/properties/${prop_id}/rate-plans"
              payload: { code: "CORP", rate_class: "NEGOTIATED", parent_rate_plan_id: "${bar_id}", offset_kind: "PERCENT", offset_bp: -1500, floor_amount_cents: 15000, ceiling_amount_cents: 40000, negotiated_account_code: "ACME" }
              as: RevenueManager
              captures: { corp_id: $.data.id }
            - call: "POST /distribution/rate-plans/${bar_id}/activate"
              payload: {}
              as: RevenueManager
            - call: "POST /distribution/rate-plans/${corp_id}/activate"
              payload: {}
              as: RevenueManager
            - call: "POST /distribution/channel-mappings"
              payload: { rate_plan_id: "${bar_id}", channel_id: "${ota1_id}", room_type_id: "${king_id}", external_rate_code: "BAR-OTA1-KING", content_description_hash: "kingv1", content_image_count: 5 }
              as: ChannelOpsEngineer
              captures: { map_id: $.data.id }
            - call: "POST /distribution/channel-mappings/${map_id}/verify"
              payload: {}
              as: ChannelOpsEngineer
          trigger:
            - call: "PATCH /distribution/rate-plans/${bar_id}"
              payload: { expected_rate_plan_version: "${bar_v_draft}", base_amount_cents: 30000 }
              as: RevenueManager
            - call: "GET /distribution/rate-plans/${corp_id}"
              payload: {}
              as: RevenueManager
            - call: "GET /distribution/rate-plans/${bar_id}"
              payload: {}
              as: RevenueManager
              captures: { bar_v_active: $.data.version }
            - call: "PATCH /distribution/rate-plans/${bar_id}"
              payload: { expected_rate_plan_version: "${bar_v_active}", base_amount_cents: 30000 }
              as: RevenueManager
            - call: "GET /distribution/rate-plans/${corp_id}"
              payload: {}
              as: RevenueManager
            - call: "GET /distribution/distribution-batches"
              payload: { property_id: "${prop_id}", payload_kind: "RATE" }
              as: ChannelOpsEngineer
              captures: { batch_id: "$.data[0].id" }
          assert:
            - "The create returned version == 1 (${bar_v_draft}); the first PATCH echoes that value after activation bumped the plan to 2 and therefore returns HTTP 412 with data.error_id == ERR_STALE_RATE_PLAN_VERSION - not a state error"
            - "Nothing downstream ran: immediately after the 412, CORP still reads resolved_base_amount_cents == 21250 and GET /distribution/distribution-batches?property_id=${prop_id}&payload_kind=RATE has total_count == 0"
            - "The read-back shows BAR unchanged at base_amount_cents 25000 with version == 2 (${bar_v_active})"
            - "The retry with ${bar_v_active} returns HTTP 200 with base_amount_cents 30000, resolved_base_amount_cents 30000 and version == 3"
            - "The child was re-derived in the same request: CORP now reads resolved_base_amount_cents == 25500 (round_half_up(30000 * 8500 / 10000)) while CORP's own offset_bp is untouched at -1500"
            - "Exactly one RATE batch now exists (total_count == 1) in batch_state QUEUED with total_jobs == 1 - the single VERIFIED mapping BAR x OTA1 x KING - because CORP carries no mapping to fan out to"

      - name: version_increments_on_every_accepted_write_and_on_no_read_or_refusal
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[rate-plan-update-stale-version]
          - entities[RatePlan]
        distinguishing_aspect: |
          The version counter is not only bumped by the PATCH that carries the OCC field: activate and
          close bump it too, which is precisely why the OCC field is hard to guess. This walks a single
          plan through all four accepted writes and interleaves reads and one refusal to show neither
          moves the counter.
        test_recipe:
          setup:
            - "Property HTL-SFO only; the plan is created inside the trigger so its very first version is observed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /distribution/properties"
              payload: { code: "HTL-SFO", name: "Harborview SFO", currency_code: "USD", overbooking_pct_bp: 1000, booking_horizon_days: 365, mix_window_days: 30, rate_mismatch_tolerance_cents: 200, required_image_count: 5 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /distribution/properties/${prop_id}/rate-plans"
              payload: { code: "BAR", rate_class: "PUBLIC", base_amount_cents: 25000, floor_amount_cents: 18000, ceiling_amount_cents: 40000 }
              as: RevenueManager
              captures: { bar_id: $.data.id }
            - call: "GET /distribution/rate-plans/${bar_id}"
              payload: {}
              as: RevenueDirector
            - call: "POST /distribution/rate-plans/${bar_id}/activate"
              payload: {}
              as: RevenueManager
              captures: { v_after_activate: $.data.version }
            - call: "PATCH /distribution/rate-plans/${bar_id}"
              payload: { expected_rate_plan_version: "${v_after_activate}", ceiling_amount_cents: 45000 }
              as: RevenueManager
              captures: { v_after_patch: $.data.version }
            - call: "PATCH /distribution/rate-plans/${bar_id}"
              payload: { expected_rate_plan_version: "${v_after_activate}", ceiling_amount_cents: 50000 }
              as: RevenueManager
            - call: "POST /distribution/rate-plans/${bar_id}/close"
              payload: {}
              as: RevenueManager
            - call: "GET /distribution/rate-plans/${bar_id}"
              payload: {}
              as: RevenueManager
          assert:
            - "The create response has version == 1 and the following GET still reads version == 1 - a read never bumps"
            - "activate returns version == 2 (${v_after_activate}); the accepted PATCH returns version == 3 (${v_after_patch}) with ceiling_amount_cents 45000"
            - "The replayed PATCH echoing ${v_after_activate} returns HTTP 412 ERR_STALE_RATE_PLAN_VERSION and ceiling_amount_cents stays 45000"
            - "close returns version == 4 with plan_state CLOSED, so the final read is { version: 4, plan_state: \"CLOSED\", ceiling_amount_cents: 45000 } - four accepted writes, four increments, and the refusal contributed nothing"

      - name: connection_suspends_exactly_on_the_third_consecutive_failure_and_an_ok_heartbeat_resets_the_run
        claim_type: rate_threshold_triggers
        grounds:
          - state_machines[ChannelConnection]
          - calculations[connection_health_score]
          - validations[priority=12]
          - errors[ERR_CONNECTION_NOT_SELLABLE]
        distinguishing_aspect: |
          CONNECTION_FAILURE_SUSPEND_THRESHOLD is a cumulative counter with a reset, so the boundary is
          not "the third ERROR heartbeat ever" but "the third since the last OK": five ERROR heartbeats
          with one OK in the middle still leave the connection sellable at two, and only the run that
          reaches three flips it out of the sellable set.
        test_recipe:
          setup:
            - "Property HTL-SFO, room types KING and TWIN, channel OTA1 with an activated (HEALTHY, consecutive_failures 0) connection, plan BAR ACTIVE."
            - "Two DRAFT mappings on that channel: BAR x OTA1 x KING and BAR x OTA1 x TWIN, both content-matched so parity is never the blocker."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /distribution/properties"
              payload: { code: "HTL-SFO", name: "Harborview SFO", currency_code: "USD", overbooking_pct_bp: 1000, booking_horizon_days: 365, mix_window_days: 30, rate_mismatch_tolerance_cents: 200, required_image_count: 5 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/room-types"
              payload: { code: "KING", name: "King Room", physical_capacity_units: 10, master_description_hash: "kingv1", master_image_count: 5 }
              as: RevenueManager
              captures: { king_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/room-types"
              payload: { code: "TWIN", name: "Twin Room", physical_capacity_units: 2, master_description_hash: "twinv1", master_image_count: 5 }
              as: RevenueManager
              captures: { twin_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/channels"
              payload: { code: "OTA1", channel_kind: "OTA_PUBLIC", commission_bp: 1750 }
              as: PlatformAdmin
              captures: { ota1_id: $.data.id }
            - call: "POST /distribution/channels/${ota1_id}/connections"
              payload: { protocol: "JSON_PUSH", endpoint_url: "https://ota1.example.com/ari" }
              as: ChannelOpsEngineer
              captures: { conn_id: $.data.id }
            - call: "POST /distribution/channel-connections/${conn_id}/activate"
              payload: {}
              as: ChannelOpsEngineer
            - call: "POST /distribution/properties/${prop_id}/rate-plans"
              payload: { code: "BAR", rate_class: "PUBLIC", base_amount_cents: 25000, floor_amount_cents: 18000, ceiling_amount_cents: 40000 }
              as: RevenueManager
              captures: { bar_id: $.data.id }
            - call: "POST /distribution/rate-plans/${bar_id}/activate"
              payload: {}
              as: RevenueManager
            - call: "POST /distribution/channel-mappings"
              payload: { rate_plan_id: "${bar_id}", channel_id: "${ota1_id}", room_type_id: "${king_id}", external_rate_code: "BAR-OTA1-KING", content_description_hash: "kingv1", content_image_count: 5 }
              as: ChannelOpsEngineer
              captures: { map_king_id: $.data.id }
            - call: "POST /distribution/channel-mappings"
              payload: { rate_plan_id: "${bar_id}", channel_id: "${ota1_id}", room_type_id: "${twin_id}", external_rate_code: "BAR-OTA1-TWIN", content_description_hash: "twinv1", content_image_count: 5 }
              as: ChannelOpsEngineer
              captures: { map_twin_id: $.data.id }
          trigger:
            - call: "POST /distribution/channel-connections/${conn_id}/heartbeats"
              payload: { status: "ERROR", failure_code: "TIMEOUT" }
              as: ChannelOpsEngineer
            - call: "POST /distribution/channel-connections/${conn_id}/heartbeats"
              payload: { status: "ERROR", failure_code: "TIMEOUT" }
              as: ChannelOpsEngineer
            - call: "POST /distribution/channel-mappings/${map_king_id}/verify"
              payload: {}
              as: ChannelOpsEngineer
            - call: "POST /distribution/channel-connections/${conn_id}/heartbeats"
              payload: { status: "OK" }
              as: ChannelOpsEngineer
            - call: "POST /distribution/channel-connections/${conn_id}/heartbeats"
              payload: { status: "ERROR", failure_code: "AUTH_FAILED" }
              as: ChannelOpsEngineer
            - call: "POST /distribution/channel-connections/${conn_id}/heartbeats"
              payload: { status: "ERROR", failure_code: "AUTH_FAILED" }
              as: ChannelOpsEngineer
            - call: "POST /distribution/channel-connections/${conn_id}/heartbeats"
              payload: { status: "ERROR", failure_code: "AUTH_FAILED" }
              as: ChannelOpsEngineer
            - call: "POST /distribution/channel-mappings/${map_twin_id}/verify"
              payload: {}
              as: ChannelOpsEngineer
          assert:
            - "Failure 1 moves the connection HEALTHY -> DEGRADED with consecutive_failures 1 and last_failure_code TIMEOUT; failure 2 stays DEGRADED with consecutive_failures 2 (strictly below the threshold 3)"
            - "At consecutive_failures 2 the connection is still sellable, so verifying the KING mapping returns HTTP 200 with mapping_state VERIFIED"
            - "The OK heartbeat returns the connection to HEALTHY with consecutive_failures 0, last_failure_code null and last_heartbeat_at 2026-08-25T00:00:00.000Z - the run is reset, not merely paused"
            - "The next two failures rebuild the run to consecutive_failures 2 while the state is DEGRADED; the fifth ERROR overall is only the third of this run and it is the one that moves DEGRADED -> SUSPENDED with consecutive_failures 3"
            - "Verifying the TWIN mapping now returns HTTP 409 with data.error_id == ERR_CONNECTION_NOT_SELLABLE, and that mapping is still DRAFT"
            - "connection_health_score_bp is null throughout because no RateDistributionJob ever resolved - heartbeats feed the failure counter, not the health score denominator"

      - name: n_level_cascade_is_verified_end_to_end_from_a_rejected_job
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: transitive_cascade / job_rejection_suspends_connection_recalls_allotment_and_recomputes_inventory
          rationale: "That §1.8 instance walks the full four-level chain (rejected job -> connection SUSPENDED -> allotments recalled -> inventory days recomputed -> guard restriction lifted with its own batch) and asserts the ordering sensitivity of the later jobs in the same dispatch."

      - name: both_variants_produce_their_own_result_and_the_switch_delta_is_correct
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: dual_variant_calc / channel_net_adr_stay_basis_versus_booked_basis
          rationale: "That §1.8 instance runs one reservation set through both bases of GET /distribution/channels/{id}/performance and pins every differing field, and its sibling booking_pace_rolling_baseline_versus_stly_baseline does the same for the pace read, so both-variants and delta-on-switch are covered."

  # =====================================================================================
  - section: consistency_model
    instances:

      - name: every_write_is_immediately_visible_in_its_own_response_and_in_the_next_read
        claim_type: immediate
        grounds:
          - complexity_profile[consistency_model=immediate]
          - calculations[batch_dispatch_resolution]
          - endpoints[POST /distribution/distribution-batches/{id}/dispatch]
        distinguishing_aspect: |
          Nothing in this domain is deferred: a dispatch resolves its jobs inside the request, the
          mapping's pushed rate and mismatch verdict are refreshed in the same call, and a booking's
          inventory recompute is readable immediately after. The test therefore never polls, sleeps or
          re-dispatches - a second read must return byte-identical derived values.
        test_recipe:
          setup:
            - "Property HTL-SFO (rate_mismatch_tolerance_cents 200), room type KING capacity 10 with an InventoryDay on 2026-09-10, channel OTA1 (1750 bp, sell_adjustment_bp 0) with an activated connection, plan BAR ACTIVE at 25000, mapping BAR x OTA1 x KING VERIFIED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /distribution/properties"
              payload: { code: "HTL-SFO", name: "Harborview SFO", currency_code: "USD", overbooking_pct_bp: 1000, booking_horizon_days: 365, mix_window_days: 30, rate_mismatch_tolerance_cents: 200, required_image_count: 5 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/room-types"
              payload: { code: "KING", name: "King Room", physical_capacity_units: 10, master_description_hash: "kingv1", master_image_count: 5 }
              as: RevenueManager
              captures: { king_id: $.data.id }
            - call: "POST /distribution/room-types/${king_id}/inventory-days"
              payload: { stay_date: "2026-09-10" }
              as: RevenueManager
              captures: { inv_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/channels"
              payload: { code: "OTA1", channel_kind: "OTA_PUBLIC", commission_bp: 1750 }
              as: PlatformAdmin
              captures: { ota1_id: $.data.id }
            - call: "POST /distribution/channels/${ota1_id}/connections"
              payload: { protocol: "JSON_PUSH", endpoint_url: "https://ota1.example.com/ari" }
              as: ChannelOpsEngineer
              captures: { conn_id: $.data.id }
            - call: "POST /distribution/channel-connections/${conn_id}/activate"
              payload: {}
              as: ChannelOpsEngineer
            - call: "POST /distribution/properties/${prop_id}/rate-plans"
              payload: { code: "BAR", rate_class: "PUBLIC", base_amount_cents: 25000, floor_amount_cents: 18000, ceiling_amount_cents: 40000 }
              as: RevenueManager
              captures: { bar_id: $.data.id }
            - call: "POST /distribution/rate-plans/${bar_id}/activate"
              payload: {}
              as: RevenueManager
            - call: "POST /distribution/channel-mappings"
              payload: { rate_plan_id: "${bar_id}", channel_id: "${ota1_id}", room_type_id: "${king_id}", external_rate_code: "BAR-OTA1-KING", content_description_hash: "kingv1", content_image_count: 5 }
              as: ChannelOpsEngineer
              captures: { map_id: $.data.id }
            - call: "POST /distribution/channel-mappings/${map_id}/verify"
              payload: {}
              as: ChannelOpsEngineer
            - call: "GET /distribution/rate-plans/${bar_id}"
              payload: {}
              as: RevenueManager
              captures: { bar_v: $.data.version }
          trigger:
            - call: "PATCH /distribution/rate-plans/${bar_id}"
              payload: { expected_rate_plan_version: "${bar_v}", base_amount_cents: 26000 }
              as: RevenueManager
            - call: "GET /distribution/distribution-batches"
              payload: { property_id: "${prop_id}", payload_kind: "RATE" }
              as: ChannelOpsEngineer
              captures: { batch_id: "$.data[0].id" }
            - call: "POST /distribution/distribution-batches/${batch_id}/dispatch"
              payload: {}
              as: ChannelOpsEngineer
            - call: "GET /distribution/channel-mappings/${map_id}"
              payload: {}
              as: ChannelOpsEngineer
            - call: "POST /distribution/reservations"
              payload: { channel_id: "${ota1_id}", rate_plan_id: "${bar_id}", room_type_id: "${king_id}", arrival_date: "2026-09-10", nights: 1 }
              as: RevenueManager
            - call: "GET /distribution/inventory-days/${inv_id}"
              payload: {}
              as: RevenueManager
            - call: "GET /distribution/distribution-batches/${batch_id}"
              payload: {}
              as: ChannelOpsEngineer
          assert:
            - "The PATCH response itself already carries resolved_base_amount_cents 26000 - no read-after-write is needed to see the derivation"
            - "The RATE batch is listed as QUEUED with total_jobs 1 in the very next request, with no intervening scheduler tick"
            - "The dispatch response already shows batch_state APPLIED with applied_jobs 1 and rejected_jobs 0 - jobs are resolved inside the dispatch call, never later"
            - "The mapping read immediately after shows last_pushed_rate_cents 26000, last_push_at 2026-08-25T00:00:00.000Z and mismatch_state UNKNOWN (no observed rate has ever been posted), all set during that same dispatch"
            - "The booking response is 201 and the InventoryDay read right after it shows { committed_units: 1, allocated_units: 0, shared_pool_units: 10, pooled_state: \"OPEN\" } - the recompute is part of the booking, not a follow-up job"
            - "Re-reading the batch returns exactly the same derived values (APPLIED, applied_jobs 1, total_jobs 1): there is no convergence window in which two reads could disagree"
