      - name: corner_priority_ordering_between_validation_pairs
        claim_type: priority_ordering
        excluded_because:
          difficulty_instance: priority_conflict_pay_period_overlap_beats_duplicate_payroll_reference
          rationale: "The §1.8 instance already builds a single request that violates the priority-41 pay-period overlap and the priority-55 duplicate payroll reference simultaneously and pins ERR_PAY_PERIOD_OVERLAP as the answer, with the mirror case proving the loser is reachable on its own. Two further orderings are pinned inside corner instances above — priority 37 ahead of 65 on validate, and priority 43 ahead of 66 on deposit creation — so a standalone corner test for ordering would only re-run the same claim shape with different numbers."

      - name: corner_temporal_validation_windows
        claim_type: temporal_validation
        excluded_because:
          difficulty_instance: fiduciary_allocation_closed_window_touching_day_rejected
          rationale: "Every temporal window in the domain is already pinned at its boundary by a §1.8 instance: fiduciary-role interval adjacency and containment at priority 45/46, the half-open pay-period interval at priority 41, and the exit blackout slot with its 5-day buffer at priority 48. The remaining temporal rules that a corner test could reach — withholding_date inside [pay_period_start, pay_period_end + 31d] at priority 42 and the deposit window at priority 43 — are covered by the deposit instance above and by the deposit_due_date calculation corner, so a separate temporal instance would duplicate rather than extend."

      - name: corner_cascading_validation_chain
        claim_type: cascading_validation
        excluded_because:
          difficulty_instance: filing_preparation_gated_by_outstanding_test_then_frozen_posture
          rationale: "The one genuinely cascading validation in the domain is the filing-preparation gate, where clearing the outstanding PLAN_LEVEL compliance test only exposes the next refusal because running that test set the plan's compliance_posture to FROZEN. The §1.8 instance walks that two-stage refusal and then the unfreeze that finally admits prepare; a corner variant could only shorten it."

