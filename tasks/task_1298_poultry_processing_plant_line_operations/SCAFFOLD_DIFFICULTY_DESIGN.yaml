# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN — poultry plant line operations (§1.8)
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: flock_yield_provisional_vs_certified_diverge
        grounds:
          - calculations.flock_yield_pct
          - entities.FlockLot.fields.provisional_yield_pct
          - entities.FlockLot.fields.certified_yield_pct
        distinguishing_aspect: |
          Same lot data, two variants on the FlockLot domain: provisional uses the
          eviscerated-basis estimate (0.88 allowance, DRAFT|DISPUTED counts) while
          certified uses live-basis measured carcass weight with CERTIFIED counts —
          86.68 vs 71.28 for identical inputs.
        test_recipe:
          setup:
            - "Line EV-1 (EVISCERATION, rated 200); shift 2026-08-01 DAY_A capacity 20000 budget 100.0 fully staffed (10/20/12/2); sanitation VERIFIED and pre-op PASSED for (shift, EV-1); lot FL-100 received 10000 birds / 50 DOA / 50000 lb; run completed with birds_hung 9950, carcass_weight_lb 36000; one DRAFT condemnation of 100 carcasses exists"
          setup_api_calls:
            - { call: "POST /poultry/lines", payload: { line_code: "EV-1", line_type: "EVISCERATION", rated_speed_bpm: 200 }, as: PlantManager, captures: { l1: $.data.id } }
            - { call: "POST /poultry/shifts", payload: { shift_date: "2026-08-01", shift_code: "DAY_A", shackle_capacity_birds: 20000, labor_hours_budget: 100.0 }, as: PlantManager, captures: { s1: $.data.id, s1_v: $.data.version } }
            - { call: "POST /poultry/shifts/${s1}/staffing", payload: { shacklers_present: 10, eviscerators_present: 20, deboners_present: 12, qa_techs_present: 2, expected_shift_version: "${s1_v}" }, as: ShiftSupervisor }
            - { call: "POST /poultry/sanitation-runs", payload: { shift_id: "${s1}", line_id: "${l1}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T02:00:00Z" }, as: SanitationLead, captures: { sr1: $.data.id } }
            - { call: "POST /poultry/sanitation-runs/${sr1}/advance", payload: { to_status: "IN_PROGRESS" }, as: SanitationLead, as_user_id: "san-1" }
            - { call: "POST /poultry/sanitation-runs/${sr1}/advance", payload: { to_status: "COMPLETED" }, as: SanitationLead, as_user_id: "san-1" }
            - { call: "POST /poultry/sanitation-runs/${sr1}/advance", payload: { to_status: "VERIFIED" }, as: QATechnician, as_user_id: "qa-1" }
            - { call: "POST /poultry/pre-op-inspections", payload: { shift_id: "${s1}", line_id: "${l1}" }, as: QATechnician, captures: { po1: $.data.id } }
            - { call: "POST /poultry/pre-op-inspections/${po1}/advance", payload: { to_status: "PASSED" }, as: QATechnician, as_user_id: "qa-2" }
            - { call: "POST /poultry/flock-lots", payload: { lot_code: "FL-100", grower_name: "GrowerA", booked_head_count: 10000, expected_avg_live_weight_lb: 5.0, receiving_shift_id: "${s1}" }, as: ReceivingClerk, captures: { f1: $.data.id } }
            - { call: "POST /poultry/flock-lots/${f1}/receive", payload: { head_count_received: 10000, doa_count: 50, total_live_weight_lb: 50000.0 }, as: ReceivingClerk }
            - { call: "POST /poultry/line-runs", payload: { shift_id: "${s1}", line_id: "${l1}", flock_lot_id: "${f1}", planned_speed_bpm: 175 }, as: ShiftSupervisor, captures: { r1: $.data.id } }
            - { call: "POST /poultry/shifts/${s1}/transition", payload: { to_status: "RUNNING" }, as: ShiftSupervisor }
            - { call: "POST /poultry/line-runs/${r1}/advance", payload: { to_status: "RUNNING" }, as: LineOperator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T06:00:00Z" }, as: PlantManager }
            - { call: "POST /poultry/line-runs/${r1}/advance", payload: { to_status: "COMPLETED", birds_hung: 9950, carcass_weight_lb: 36000.0 }, as: LineOperator }
            - { call: "POST /poultry/condemnation-records", payload: { line_run_id: "${r1}", condemnation_code: "SEPTICEMIA", carcass_count: 100 }, as: QATechnician, as_user_id: "qa-1", captures: { c1: $.data.id } }
            - { call: "GET /poultry/flock-lots/${f1}", as: QATechnician, captures: { prov_yield: $.data.provisional_yield_pct } }
            - { call: "POST /poultry/condemnation-records/${c1}/advance", payload: { to_status: "CERTIFIED" }, as: USDAInspector, as_user_id: "usda-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T10:00:00Z" }, as: PlantManager }
          trigger:
            - { call: "POST /poultry/flock-lots/${f1}/advance", payload: { to_status: "SETTLED" }, as: ShiftSupervisor }
          assert:
            - "provisional variant read after DRAFT record: ${prov_yield} == 86.68"
            - "FlockLot.${f1}.certified_yield_pct == 71.28 after settle (live basis, CERTIFIED count 100)"
            - "FlockLot.${f1}.provisional_yield_pct == 86.68 still stored after settle (variants coexist and differ)"

      - name: water_intensity_birds_vs_weight_basis_diverge
        grounds:
          - calculations.shift_water_intensity
          - entities.ProductionShift.fields.water_rate_birds_basis
          - entities.ProductionShift.fields.water_rate_weight_basis
        distinguishing_aspect: |
          Same readings on the ProductionShift utility domain: birds-basis rate
          1507.54 > 1500.0 breaches and auto-suspends, while weight-basis rate
          41.67 <= 200.0 stays compliant — two valid denominators, divergent verdicts.
        test_recipe:
          setup:
            - "Line EV-1; shift fully staffed, RUNNING; lot FL-100 received; run completed birds_hung 9950 carcass 36000 (birds_processed 9950, chilled_weight_lb 36000); no water readings yet"
          setup_api_calls:
            - { call: "POST /poultry/lines", payload: { line_code: "EV-1", line_type: "EVISCERATION", rated_speed_bpm: 200 }, as: PlantManager, captures: { l1: $.data.id } }
            - { call: "POST /poultry/shifts", payload: { shift_date: "2026-08-01", shift_code: "DAY_A", shackle_capacity_birds: 20000, labor_hours_budget: 100.0 }, as: PlantManager, captures: { s1: $.data.id, s1_v: $.data.version } }
            - { call: "POST /poultry/shifts/${s1}/staffing", payload: { shacklers_present: 10, eviscerators_present: 20, deboners_present: 12, qa_techs_present: 2, expected_shift_version: "${s1_v}" }, as: ShiftSupervisor }
            - { call: "POST /poultry/sanitation-runs", payload: { shift_id: "${s1}", line_id: "${l1}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T02:00:00Z" }, as: SanitationLead, captures: { sr1: $.data.id } }
            - { call: "POST /poultry/sanitation-runs/${sr1}/advance", payload: { to_status: "IN_PROGRESS" }, as: SanitationLead, as_user_id: "san-1" }
            - { call: "POST /poultry/sanitation-runs/${sr1}/advance", payload: { to_status: "COMPLETED" }, as: SanitationLead, as_user_id: "san-1" }
            - { call: "POST /poultry/sanitation-runs/${sr1}/advance", payload: { to_status: "VERIFIED" }, as: QATechnician, as_user_id: "qa-1" }
            - { call: "POST /poultry/pre-op-inspections", payload: { shift_id: "${s1}", line_id: "${l1}" }, as: QATechnician, captures: { po1: $.data.id } }
            - { call: "POST /poultry/pre-op-inspections/${po1}/advance", payload: { to_status: "PASSED" }, as: QATechnician, as_user_id: "qa-2" }
            - { call: "POST /poultry/flock-lots", payload: { lot_code: "FL-100", grower_name: "GrowerA", booked_head_count: 10000, expected_avg_live_weight_lb: 5.0, receiving_shift_id: "${s1}" }, as: ReceivingClerk, captures: { f1: $.data.id } }
            - { call: "POST /poultry/flock-lots/${f1}/receive", payload: { head_count_received: 10000, doa_count: 50, total_live_weight_lb: 50000.0 }, as: ReceivingClerk }
            - { call: "POST /poultry/line-runs", payload: { shift_id: "${s1}", line_id: "${l1}", flock_lot_id: "${f1}", planned_speed_bpm: 175 }, as: ShiftSupervisor, captures: { r1: $.data.id } }
            - { call: "POST /poultry/shifts/${s1}/transition", payload: { to_status: "RUNNING" }, as: ShiftSupervisor }
            - { call: "POST /poultry/line-runs/${r1}/advance", payload: { to_status: "RUNNING" }, as: LineOperator }
            - { call: "POST /poultry/line-runs/${r1}/advance", payload: { to_status: "COMPLETED", birds_hung: 9950, carcass_weight_lb: 36000.0 }, as: LineOperator }
          trigger:
            - { call: "POST /poultry/utility-readings", payload: { shift_id: "${s1}", meter_type: "PROCESS_WATER", gallons: 15000.0 }, as: QATechnician }
            - { call: "GET /poultry/shifts/${s1}", as: QATechnician }
          assert:
            - "Shift.${s1}.water_rate_birds_basis == 1507.54 (> 1500.0 limit -> breach)"
            - "Shift.${s1}.water_rate_weight_basis == 41.67 (<= 200.0 limit -> compliant on the same readings)"
            - "Shift.${s1}.water_breach_active == true and status == SUSPENDED with suspend_reason == WATER_LIMIT_BREACH"

  - rule_id: combinatorial_formula
    instances:
      - name: effective_speed_nested_min_waiver_staffing
        grounds:
          - calculations.effective_max_line_speed
          - entities.LineSpeedWaiver.fields.max_speed_bpm
          - entities.ProductionShift.fields.shacklers_present
        distinguishing_aspect: |
          Mode (a): nested min of 3+ inputs with conditional branches on waiver state —
          min(rated 200, ACTIVE waiver 195, staffing floor(200*1.0)=200) = 195, then a
          staffing cut to ratio exactly 0.9 switches the branch to floor(200*0.9)=180
          and clamps the running line from 195 to 180.
        test_recipe:
          setup:
            - "EV-1 rated 200; waiver 195 bpm for [2026-08-01T00:00Z, 2026-08-02T00:00Z) APPROVED (ACTIVE at default clock); shift fully staffed 10/20/12/2 RUNNING; run R1 RUNNING at 175"
          setup_api_calls:
            - { call: "POST /poultry/lines", payload: { line_code: "EV-1", line_type: "EVISCERATION", rated_speed_bpm: 200 }, as: PlantManager, captures: { l1: $.data.id, l1_v: $.data.version } }
            - { call: "POST /poultry/lines/${l1}/waivers", payload: { max_speed_bpm: 195, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-02T00:00:00Z", expected_line_version: "${l1_v}" }, as: PlantManager, captures: { w1: $.data.id } }
            - { call: "POST /poultry/waivers/${w1}/advance", payload: { to_status: "SUBMITTED" }, as: PlantManager }
            - { call: "POST /poultry/waivers/${w1}/advance", payload: { to_status: "APPROVED" }, as: USDAInspector, as_user_id: "usda-1" }
            - { call: "POST /poultry/shifts", payload: { shift_date: "2026-08-01", shift_code: "DAY_A", shackle_capacity_birds: 20000, labor_hours_budget: 100.0 }, as: PlantManager, captures: { s1: $.data.id, s1_v: $.data.version } }
            - { call: "POST /poultry/shifts/${s1}/staffing", payload: { shacklers_present: 10, eviscerators_present: 20, deboners_present: 12, qa_techs_present: 2, expected_shift_version: "${s1_v}" }, as: ShiftSupervisor, captures: { s1_v2: $.data.version } }
            - { call: "POST /poultry/sanitation-runs", payload: { shift_id: "${s1}", line_id: "${l1}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T02:00:00Z" }, as: SanitationLead, captures: { sr1: $.data.id } }
            - { call: "POST /poultry/sanitation-runs/${sr1}/advance", payload: { to_status: "IN_PROGRESS" }, as: SanitationLead, as_user_id: "san-1" }
            - { call: "POST /poultry/sanitation-runs/${sr1}/advance", payload: { to_status: "COMPLETED" }, as: SanitationLead, as_user_id: "san-1" }
            - { call: "POST /poultry/sanitation-runs/${sr1}/advance", payload: { to_status: "VERIFIED" }, as: QATechnician, as_user_id: "qa-1" }
            - { call: "POST /poultry/pre-op-inspections", payload: { shift_id: "${s1}", line_id: "${l1}" }, as: QATechnician, captures: { po1: $.data.id } }
            - { call: "POST /poultry/pre-op-inspections/${po1}/advance", payload: { to_status: "PASSED" }, as: QATechnician, as_user_id: "qa-2" }
            - { call: "POST /poultry/flock-lots", payload: { lot_code: "FL-100", grower_name: "GrowerA", booked_head_count: 10000, expected_avg_live_weight_lb: 5.0, receiving_shift_id: "${s1}" }, as: ReceivingClerk, captures: { f1: $.data.id } }
            - { call: "POST /poultry/flock-lots/${f1}/receive", payload: { head_count_received: 10000, doa_count: 50, total_live_weight_lb: 50000.0 }, as: ReceivingClerk }
            - { call: "POST /poultry/line-runs", payload: { shift_id: "${s1}", line_id: "${l1}", flock_lot_id: "${f1}", planned_speed_bpm: 175 }, as: ShiftSupervisor, captures: { r1: $.data.id } }
            - { call: "POST /poultry/shifts/${s1}/transition", payload: { to_status: "RUNNING" }, as: ShiftSupervisor }
            - { call: "POST /poultry/line-runs/${r1}/advance", payload: { to_status: "RUNNING" }, as: LineOperator }
          trigger:
            - { call: "POST /poultry/line-runs/${r1}/set-speed", payload: { new_speed_bpm: 195 }, as: LineOperator, captures: { spd_after_waiver: $.data.current_speed_bpm } }
            - { call: "POST /poultry/shifts/${s1}/staffing", payload: { shacklers_present: 9, eviscerators_present: 20, deboners_present: 12, qa_techs_present: 2, expected_shift_version: "${s1_v2}" }, as: ShiftSupervisor }
            - { call: "GET /poultry/line-runs/${r1}", as: LineOperator }
          assert:
            - "set-speed 195 accepted under ACTIVE waiver with full staffing: ${spd_after_waiver} == 195"
            - "after staffing cut to ratio exactly 0.9: LineRun.${r1}.current_speed_bpm == 180 (floor(200*0.9))"
            - "LineRun.${r1}.speed_clamped == true"

      - name: order_fill_round_per_batch_then_sum
        grounds:
          - calculations.order_fill_weight
          - entities.DeboningBatch.fields.net_weight_lb
          - entities.ProductOrder.fields.filled_lb
        distinguishing_aspect: |
          Mode (b): pinned nested rounding — round each batch net (round_half_up 2dp
          of output*0.98) THEN sum yields 9.80 + 19.60 = 29.40, while the rejected
          sum-then-round order yields 29.41; with pounds_ordered 29.41 the pinned
          order leaves the order PARTIALLY_ALLOCATED where the other would ALLOCATE.
        test_recipe:
          setup:
            - "Line DB-1 (DEBONING, rated 50) and EV-1; shift RUNNING fully staffed; lot FL-100 CHILLED (run completed 9950/36000, zero condemnation records, 4h chill elapsed); order 29.41 lb FLEXIBLE due 2026-08-03; two batches of input 100 lb each on DB-1"
          setup_api_calls:
            - { call: "POST /poultry/lines", payload: { line_code: "EV-1", line_type: "EVISCERATION", rated_speed_bpm: 200 }, as: PlantManager, captures: { l1: $.data.id } }
            - { call: "POST /poultry/lines", payload: { line_code: "DB-1", line_type: "DEBONING", rated_speed_bpm: 50 }, as: PlantManager, captures: { l2: $.data.id } }
            - { call: "POST /poultry/shifts", payload: { shift_date: "2026-08-01", shift_code: "DAY_A", shackle_capacity_birds: 20000, labor_hours_budget: 100.0 }, as: PlantManager, captures: { s1: $.data.id, s1_v: $.data.version } }
            - { call: "POST /poultry/shifts/${s1}/staffing", payload: { shacklers_present: 10, eviscerators_present: 20, deboners_present: 12, qa_techs_present: 2, expected_shift_version: "${s1_v}" }, as: ShiftSupervisor }
            - { call: "POST /poultry/sanitation-runs", payload: { shift_id: "${s1}", line_id: "${l1}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T02:00:00Z" }, as: SanitationLead, captures: { sr1: $.data.id } }
            - { call: "POST /poultry/sanitation-runs/${sr1}/advance", payload: { to_status: "IN_PROGRESS" }, as: SanitationLead, as_user_id: "san-1" }
            - { call: "POST /poultry/sanitation-runs/${sr1}/advance", payload: { to_status: "COMPLETED" }, as: SanitationLead, as_user_id: "san-1" }
            - { call: "POST /poultry/sanitation-runs/${sr1}/advance", payload: { to_status: "VERIFIED" }, as: QATechnician, as_user_id: "qa-1" }
            - { call: "POST /poultry/pre-op-inspections", payload: { shift_id: "${s1}", line_id: "${l1}" }, as: QATechnician, captures: { po1: $.data.id } }
            - { call: "POST /poultry/pre-op-inspections/${po1}/advance", payload: { to_status: "PASSED" }, as: QATechnician, as_user_id: "qa-2" }
            - { call: "POST /poultry/flock-lots", payload: { lot_code: "FL-100", grower_name: "GrowerA", booked_head_count: 10000, expected_avg_live_weight_lb: 5.0, receiving_shift_id: "${s1}" }, as: ReceivingClerk, captures: { f1: $.data.id } }
            - { call: "POST /poultry/flock-lots/${f1}/receive", payload: { head_count_received: 10000, doa_count: 50, total_live_weight_lb: 50000.0 }, as: ReceivingClerk }
            - { call: "POST /poultry/line-runs", payload: { shift_id: "${s1}", line_id: "${l1}", flock_lot_id: "${f1}", planned_speed_bpm: 175 }, as: ShiftSupervisor, captures: { r1: $.data.id } }
            - { call: "POST /poultry/shifts/${s1}/transition", payload: { to_status: "RUNNING" }, as: ShiftSupervisor }
            - { call: "POST /poultry/line-runs/${r1}/advance", payload: { to_status: "RUNNING" }, as: LineOperator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T06:00:00Z" }, as: PlantManager }
            - { call: "POST /poultry/line-runs/${r1}/advance", payload: { to_status: "COMPLETED", birds_hung: 9950, carcass_weight_lb: 36000.0 }, as: LineOperator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T10:00:00Z" }, as: PlantManager }
            - { call: "POST /poultry/orders", payload: { customer_name: "CustR", product_code: "TENDERLOIN", pounds_ordered: 29.41, temperature_requirement: "FROZEN", due_at: "2026-08-03T00:00:00Z" }, as: OrderPlanner, captures: { o1: $.data.id } }
            - { call: "POST /poultry/deboning-batches", payload: { order_id: "${o1}", flock_lot_id: "${f1}", shift_id: "${s1}", line_id: "${l2}", crew_count: 6, input_weight_lb: 100.0 }, as: ShiftSupervisor, captures: { b1: $.data.id } }
            - { call: "POST /poultry/deboning-batches/${b1}/advance", payload: { to_status: "IN_PROGRESS" }, as: LineOperator }
            - { call: "POST /poultry/deboning-batches/${b1}/advance", payload: { to_status: "COMPLETED", actual_output_weight_lb: 10.005, actual_labor_hours: 0.5 }, as: LineOperator }
            - { call: "POST /poultry/deboning-batches", payload: { order_id: "${o1}", flock_lot_id: "${f1}", shift_id: "${s1}", line_id: "${l2}", crew_count: 6, input_weight_lb: 100.0 }, as: ShiftSupervisor, captures: { b2: $.data.id } }
            - { call: "POST /poultry/deboning-batches/${b2}/advance", payload: { to_status: "IN_PROGRESS" }, as: LineOperator }
          trigger:
            - { call: "POST /poultry/deboning-batches/${b2}/advance", payload: { to_status: "COMPLETED", actual_output_weight_lb: 20.005, actual_labor_hours: 0.5 }, as: LineOperator }
            - { call: "GET /poultry/orders/${o1}", as: OrderPlanner }
          assert:
            - "DeboningBatch.${b1}.net_weight_lb == 9.80 (round_half_up(10.005*0.98, 2))"
            - "DeboningBatch.${b2}.net_weight_lb == 19.60 (round_half_up(20.005*0.98, 2))"
            - "ProductOrder.${o1}.filled_lb == 29.40 (sum AFTER per-batch rounding; not 29.41)"
            - "ProductOrder.${o1}.allocation_status == PARTIALLY_ALLOCATED (29.40 < 29.41)"

      - name: staffing_speed_evaluation_order_pinned
        grounds:
          - calculations.effective_max_line_speed
          - validations[priority=5]
        distinguishing_aspect: |
          Mode (c): circular-looking dependency (speed sets staffing need, staffing
          caps speed) broken by pinned evaluation order — required headcount comes
          from a FIXED per-line-type table at rated speed, so at ratio 0.8 (< 0.9)
          the waiver is void and the cap is the base 175 even though an ACTIVE
          waiver authorizes 195.
        test_recipe:
          setup:
            - "EV-1 rated 200; waiver 195 ACTIVE; shift RUNNING with staffing 8/20/12/2 (ratio min(0.8, 1.0, 1.0) = 0.8); run R1 RUNNING at 175"
          setup_api_calls:
            - { call: "POST /poultry/lines", payload: { line_code: "EV-1", line_type: "EVISCERATION", rated_speed_bpm: 200 }, as: PlantManager, captures: { l1: $.data.id, l1_v: $.data.version } }
            - { call: "POST /poultry/lines/${l1}/waivers", payload: { max_speed_bpm: 195, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-02T00:00:00Z", expected_line_version: "${l1_v}" }, as: PlantManager, captures: { w1: $.data.id } }
            - { call: "POST /poultry/waivers/${w1}/advance", payload: { to_status: "SUBMITTED" }, as: PlantManager }
            - { call: "POST /poultry/waivers/${w1}/advance", payload: { to_status: "APPROVED" }, as: USDAInspector, as_user_id: "usda-1" }
            - { call: "POST /poultry/shifts", payload: { shift_date: "2026-08-01", shift_code: "DAY_A", shackle_capacity_birds: 20000, labor_hours_budget: 100.0 }, as: PlantManager, captures: { s1: $.data.id, s1_v: $.data.version } }
            - { call: "POST /poultry/shifts/${s1}/staffing", payload: { shacklers_present: 8, eviscerators_present: 20, deboners_present: 12, qa_techs_present: 2, expected_shift_version: "${s1_v}" }, as: ShiftSupervisor }
            - { call: "POST /poultry/sanitation-runs", payload: { shift_id: "${s1}", line_id: "${l1}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T02:00:00Z" }, as: SanitationLead, captures: { sr1: $.data.id } }
            - { call: "POST /poultry/sanitation-runs/${sr1}/advance", payload: { to_status: "IN_PROGRESS" }, as: SanitationLead, as_user_id: "san-1" }
            - { call: "POST /poultry/sanitation-runs/${sr1}/advance", payload: { to_status: "COMPLETED" }, as: SanitationLead, as_user_id: "san-1" }
            - { call: "POST /poultry/sanitation-runs/${sr1}/advance", payload: { to_status: "VERIFIED" }, as: QATechnician, as_user_id: "qa-1" }
            - { call: "POST /poultry/pre-op-inspections", payload: { shift_id: "${s1}", line_id: "${l1}" }, as: QATechnician, captures: { po1: $.data.id } }
            - { call: "POST /poultry/pre-op-inspections/${po1}/advance", payload: { to_status: "PASSED" }, as: QATechnician, as_user_id: "qa-2" }
