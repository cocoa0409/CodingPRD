      - name: catalog_entry_get_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_CATALOG_ENTRY_NOT_FOUND]", "validations[priority=8]"]
        distinguishing_aspect: "A well-formed but unknown DeviceCatalogEntry id returns ERR_CATALOG_ENTRY_NOT_FOUND with HTTP 404."
