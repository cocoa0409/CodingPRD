              as: Appraiser
              as_user_id: "${a_id}"
              captures: { c12: $.data.id }
            - { call: "POST /appraisal/comparables/${c12}/verify", payload: {}, as: Appraiser, as_user_id: "${a_id}" }
            - { call: "POST /appraisal/comparables/${c12}/lock", payload: {}, as: Appraiser, as_user_id: "${a_id}" }
            - call: "POST /appraisal/comparables"
              payload: { order_id: "${o1_id}", address: "3 Pine St", sale_price_cents: 45000000, sale_date: "2026-05-20", distance_miles: 1.20, site_adjustment_cents: 0, gla_adjustment_cents: 0, condition_adjustment_cents: 0 }
              as: Appraiser
              as_user_id: "${a_id}"
              captures: { c13: $.data.id }
            - { call: "POST /appraisal/comparables/${c13}/verify", payload: {}, as: Appraiser, as_user_id: "${a_id}" }
            - { call: "POST /appraisal/comparables/${c13}/lock", payload: {}, as: Appraiser, as_user_id: "${a_id}" }
            - call: "POST /appraisal/reports"
              payload: { order_id: "${o1_id}", report_type: FORM_1004, condition_rating: C3 }
              as: Appraiser
              as_user_id: "${a_id}"
              captures: { r1_id: $.data.id }
            - { call: "POST /appraisal/reports/${r1_id}/submit-for-qc", payload: {}, as: Appraiser, as_user_id: "${a_id}" }
            - { call: "POST /appraisal/reports/${r1_id}/qc-pass", payload: {}, as: QCReviewer, as_user_id: "${q_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: FirmAdmin }
            - { call: "POST /appraisal/reports/${r1_id}/deliver", payload: {}, as: Appraiser, as_user_id: "${a_id}" }
            # --- order 2 (desktop, same delivery date) ---
            - call: "POST /appraisal/orders"
              payload: { client_id: "${c_id}", property_address: "20 Oak Ave", property_type: SFR, estimated_value_cents: 45000000, loan_type: CONVENTIONAL, requested_turn_days: 7 }
