        distinguishing_aspect: "SUSPEND is guarded on RELEASED, so suspending a model that is only CERTIFIED is refused with 409 ERR_MODEL_STATE_INVALID and suspended_reason is left at NONE — the guard is on the source state, not on the reason payload."
