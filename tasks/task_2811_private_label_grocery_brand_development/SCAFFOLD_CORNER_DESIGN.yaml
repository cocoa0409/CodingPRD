          Consistency is immediate, so the fee, the retail price, the item state change and the program ledger are
          all readable in the same request that caused them: the lock response carries slotting_fee_cents 266980 and
          a budget-ledger read issued immediately afterwards already shows committed 266980 and available 4733020
          with no re-read or settle step in between.
