  - section: validations
    instances:

      - name: window_shape_is_checked_before_the_delivery_deadline
        claim_type: priority_ordering
        grounds:
          - validations[priority=31]
          - validations[priority=32]
          - endpoints[POST /mix-bookings]
        distinguishing_aspect: "Four window shapes on one unlocked project: a zero-length window and an inverted window are ERR_WINDOW_INVALID, a well-formed window past the delivery deadline is ERR_WINDOW_AFTER_DEADLINE, and a window that is BOTH inverted and past the deadline returns the priority-31 error, not the priority-32 one."
        test_recipe:
          setup:
            - "Stage at 100000 cents/hour, mixer certified STREAMING."
            - "Project with delivery_deadline_utc 2026-09-20T00:00:00Z, picture NOT_LOCKED (PREMIX is exempt from the lock rule)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: FacilityAdmin
              as_user_id: "admin-1"
            - call: "POST /mix-stages"
              payload: { room_code: "STAGE_V1", display_name: "Stage V1", hourly_rate_cents: 100000, supports_remote_review: true, changeover_minutes: 45 }
              as: FacilityAdmin
              as_user_id: "admin-1"
