            - "Pool with eight kegs; four allocated in one order, dispatched, filled, and all four distributed at 2026-08-01T03:00:00Z. Four of eight kegs remain IN_FLOAT so posture stays OPEN at 50.00 and no FILL is blocked."
            - "All four RETURN scans land at 2026-08-13T03:00:00Z, exactly 12 distributor days, so every accrual sits in the 10000 bp dwell band and on_time_return_pct is 100.00 throughout."
            - "SILVER_MIN_RETURNS is 3 and GOLD_MIN_RETURNS is 5, so the ladder advances exactly one step during the test."
