  # ===========================================================================
  - section: cross_cutting_layers
    instances:

      - name: occ_stale_site_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[site-capacity-profile-stale-version]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "The capacity-profile write requires the caller's observed Site.version: after another write advances it, a request carrying the stale version fails 412 ERR_STALE_VERSION; carrying the fresh version succeeds."
        test_recipe:
          setup: ["Logical clock 2026-09-10T14:00:00Z. SITE-A created (version 1)."]
          setup_api_calls:
            - call: "POST /mfc/_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T14:00:00Z" }
              as: SiteOps
            - call: "POST /mfc/sites"
              payload: { code: "SITE-A", name: "Downtown MFC", delivery_radius_miles: 5.0, fee_schedule: { base_cents: 199, per_mile_cents: 99, included_miles: 1.5, peak_surcharge_cents: 150, min_fee_cents: 99, max_fee_cents: 999 }, fee_waiver_threshold_cents: 3000, batch_max_lines: 2, batch_max_items: 20, expiry_horizon_days: 2 }
              as: SiteOps
              captures: { site_id: $.data.id, site_v1: $.data.version }
          trigger:
            - call: "PUT /mfc/sites/${site_id}/capacity-profile"
              payload: { expected_site_version: "${site_v1}", batch_max_lines: 4 }
              as: SiteOps
              captures: { site_v2: $.data.version }
            - call: "PUT /mfc/sites/${site_id}/capacity-profile"
              payload: { expected_site_version: "${site_v1}", batch_max_items: 99 }
              as: SiteOps
              captures: { err_occ: $.data.error_id }
            - call: "PUT /mfc/sites/${site_id}/capacity-profile"
              payload: { expected_site_version: "${site_v2}", batch_max_items: 99 }
              as: SiteOps
          assert:
            - "first update succeeds: Site.${site_id}.batch_max_lines == 4 and version == 2"
            - "stale retry: 412 and error_id == ERR_STALE_VERSION; batch_max_items unchanged (20)"
            - "fresh retry with the advanced version succeeds: batch_max_items == 99 and version == 3"

      - name: occ_stale_customer_version_on_membership_cancel
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[membership-write-stale-customer-version]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "Membership cancel carries expected_customer_version; a wallet adjustment (or any Customer-mutating cascade) that bumps Customer.version between the read and the cancel makes the cancel fail 412 — loyalty accrual and membership lifecycle stay serialized."
        test_recipe:
          setup: ["Customer with ACTIVE membership; current Customer.version captured before a wallet adjustment bumps it."]
          setup_api_calls:
            - call: "POST /mfc/customers"
              payload: { email: "occ@example.com", full_name: "Oskar Occ", date_of_birth: "1991-01-01T00:00:00Z" }
              as: Customer
              captures: { cust_o: $.data.id }
            - call: "POST /mfc/memberships"
              payload: { customer_id: "${cust_o}", tier: "FAM", monthly_fee_cents: 1000 }
              as: Customer
              as_user_id: "${cust_o}"
              captures: { memb_o: $.data.id }
            - call: "GET /mfc/customers/${cust_o}"
              payload: {}
              as: SiteOps
              captures: { cust_o_v: $.data.version }
          trigger:
            - call: "POST /mfc/customers/${cust_o}/wallet/adjustments"
              payload: { amount_cents: 25, reason: "interleaving bump" }
              as: SiteOps
            - call: "POST /mfc/memberships/${memb_o}/cancel"
              payload: { expected_customer_version: "${cust_o_v}" }
              as: Customer
              as_user_id: "${cust_o}"
              captures: { err_mocc: $.data.error_id }
          assert:
            - "the cancel returns 412 and error_id == ERR_STALE_VERSION"
            - "Membership.${memb_o}.status is still ACTIVE"

      - name: replenish_idempotency_key_prevents_double_posting
        claim_type: idempotency
        excluded_because:
          difficulty_instance: replenish_finalize_to_site_posture_depth3
          rationale: "The create/place/finalize chain is exercised there; the pure replay semantics (same key, original payload wins) is asserted by the corner instance replenishment_replay_with_same_idempotency_key_returns_original in section state_machines."
        grounds:
          - entities.ReplenishOrder.fields.idempotency_key

      - name: derived_on_hand_reconciles_across_reserve_commit_return
