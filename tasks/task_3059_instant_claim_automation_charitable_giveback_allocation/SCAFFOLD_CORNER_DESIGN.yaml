              captures: { fc: $.data.id }
            - call: "POST /fee-configs/${fc}/activate"
              payload: {}
              as: UnderwritingAdmin
            - call: "POST /policyholders"
              payload: { email: "p@x.com", full_name: "P", state_code: "TX" }
              as: Anonymous
              captures: { ph: $.data.id }
            - call: "POST /quotes"
              payload: { coverage_amount_cents: 500000, premium_cents: 50000 }
              as: Policyholder
              as_user_id: "${ph}"
              captures: { q: $.data.id }
            - call: "POST /applications"
              payload: { quote_id: "${q}", checkout_velocity_seconds: 60, device_reuse_count: 0, answers_ipa_acknowledged: true }
              as: Policyholder
              as_user_id: "${ph}"
              captures: { app: $.data.id }
            - call: "POST /applications/${app}/approve"
              payload: {}
              as: UnderwritingAdmin
              captures: { pol: $.data.id }
            - call: "POST /policies/${pol}/premium-payments"
              payload: { amount_cents: 50000 }
              as: FinanceOps
            - call: "POST /cohorts/${cohort_id}/close"
              payload: {}
              as: PlatformAdmin
            - call: "POST /cohorts/${cohort_id}/run-giveback"
              payload: {}
              as: FinanceOps
          trigger:
            - call: "POST /cohorts/${cohort_id}/run-giveback"
              payload: {}
              as: FinanceOps
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_COHORT_NOT_CLOSED (HTTP 409); Cohort.${cohort_id}.status == DONATED"

      - name: scheduled_quote_expiry_uses_logical_clock
        claim_type: scheduled_actions
        grounds:
          - entities.Quote.fields.expires_at
          - endpoints.POST_/_clock/set_current_utc
        distinguishing_aspect: "Time is logical, not wall-clock: without any set_current_utc call the clock reads the startup default 2026-09-01T00:00:00Z, and only an explicit set advances expiry evaluation."
        test_recipe:
          setup: ["No clock set — startup default. Policyholder and quote created."]
          setup_api_calls:
            - call: "POST /policyholders"
              payload: { email: "p@x.com", full_name: "P", state_code: "TX" }
              as: Anonymous
              captures: { ph: $.data.id }
            - call: "POST /quotes"
              payload: { coverage_amount_cents: 100000, premium_cents: 50000 }
              as: Policyholder
              as_user_id: "${ph}"
              captures: { q: $.data.id }
          trigger:
            - call: "GET /quotes/${q}"
              payload: {}
              as: Policyholder
              as_user_id: "${ph}"
          assert:
            - "Quote.${q}.expires_at == 2026-10-01T00:00:00Z (created at the 2026-09-01T00:00:00Z startup default, 30-day TTL)"
            - "Quote.${q}.status == OPEN"

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: instant_pay_visible_atomically_in_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/claims
        distinguishing_aspect: "Immediate consistency: the POST /claims response for an auto-approved claim already carries status PAID, payout_cents, and reinsurance_share_cents — no polling or delayed read is needed to observe the payment side effects."
        test_recipe:
          setup: ["Standard bound policy premium 100000 paid; treaty 0.75 attached."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /causes"
              payload: { name: "C" }
              as: PlatformAdmin
              captures: { cause_id: $.data.id }
            - call: "POST /cohorts"
              payload: { cohort_year: 2026, cause_id: "${cause_id}" }
              as: PlatformAdmin
              captures: { cohort_id: $.data.id }
            - call: "POST /rate-filings"
              payload: { state_code: "TX", max_flat_fee_pct: 0.30, max_flat_fee_cap_cents: 90000, filing_mode: "PCT_OF_PREMIUM" }
              as: UnderwritingAdmin
              captures: { filing: $.data.id }
            - call: "POST /rate-filings/${filing}/approve"
              payload: {}
              as: UnderwritingAdmin
            - call: "POST /fee-configs"
              payload: { state_code: "TX", filing_id: "${filing}", flat_fee_pct: 0.20, flat_fee_cents: 90000 }
              as: UnderwritingAdmin
              captures: { fc: $.data.id }
            - call: "POST /fee-configs/${fc}/activate"
              payload: {}
              as: UnderwritingAdmin
            - call: "POST /reinsurance-treaties"
              payload: { name: "QS-75", quota_share_pct: 0.75 }
              as: FinanceOps
              captures: { treaty_id: $.data.id }
            - call: "POST /reinsurance-treaties/${treaty_id}/activate"
              payload: {}
              as: FinanceOps
            - call: "POST /cohorts/${cohort_id}/reinsurance"
              payload: { treaty_id: "${treaty_id}" }
              as: FinanceOps
            - call: "POST /policyholders"
              payload: { email: "p@x.com", full_name: "P", state_code: "TX" }
              as: Anonymous
              captures: { ph: $.data.id }
            - call: "POST /quotes"
              payload: { coverage_amount_cents: 500000, premium_cents: 100000 }
              as: Policyholder
              as_user_id: "${ph}"
              captures: { q: $.data.id }
            - call: "POST /applications"
              payload: { quote_id: "${q}", checkout_velocity_seconds: 60, device_reuse_count: 0, answers_ipa_acknowledged: true }
              as: Policyholder
              as_user_id: "${ph}"
              captures: { app: $.data.id }
            - call: "POST /applications/${app}/approve"
              payload: {}
              as: UnderwritingAdmin
              captures: { pol: $.data.id }
            - call: "POST /policies/${pol}/premium-payments"
              payload: { amount_cents: 100000 }
              as: FinanceOps
          trigger:
            - call: "POST /claims"
              payload: { policy_id: "${pol}", video_statement_ref: "v", claimed_amount_cents: 1000, fraud_score: 0.10 }
              as: Policyholder
              as_user_id: "${ph}"
              captures: { claim: $.data.id }
          assert:
            - "the POST /claims response body itself shows status PAID, payout_cents 1000, reinsurance_share_cents 750"
            - "the immediately following GET /cohorts/${cohort_id} shows retained_claims_actual_cents == 250 (no lag)"

