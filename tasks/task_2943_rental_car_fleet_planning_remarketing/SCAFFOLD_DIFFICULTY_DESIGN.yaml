# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2943 — Rental Car Fleet Planning & Remarketing
#
# Every literal in every `assert:` below was produced by executing the matching
# §1.3 formula in code against the pinned setup inputs.
# Shared fixture world used by the chains below:
#   clock default 2026-08-01T00:00:00Z, always repositioned explicitly first
#   Market ATL  : hub 23 km, 250 c/km, prep_capacity_per_day 2
#   Market DFW  : hub 35 km, 300 c/km, prep_capacity_per_day 4
#   Segment MIDSIZE: rate 5500, soft 40000 km, hard 60000 km, recon cap 90000
#   Policy MID-2026: monthly 0.015, 12 c/km, floor 0.35
#   Program PGM (PROGRAM): 0.82 guarantee, hold 180..365, 45000 km, 30 c/km excess
#   Program RSK (RISK)   : 0.00 guarantee, hold 90..900, 100000 km, no excess
#   capitalized_cost_per_unit_cents 2800000 everywhere
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: vehicle_residual_program_guarantee_vs_policy_schedule_divergence
        grounds:
          - calculations.vehicle_residual_valuation
          - entities.Vehicle.fields.net_book_value_cents
          - entities.ManufacturerProgram.fields.program_type
          - entities.DepreciationPolicy.fields.monthly_depreciation_pct
          - endpoints[GET /fleet/vehicles/{vehicle_id}/valuation]
        distinguishing_aspect: |
          This instance lives in the Vehicle asset-valuation domain: the two variants
          POLICY_SCHEDULE and PROGRAM_GUARANTEE consume the SAME capitalized cost, odometer
          and holding period yet return 1900000 and 2236000 cents respectively, and
          ManufacturerProgram.program_type — not a caller preference — selects which one
          becomes net_book_value_cents.
        test_recipe:
          setup:
            - "One ATL market, one MIDSIZE segment, one ACTIVE MID-2026 depreciation policy."
            - "Two manufacturer programs: PGM with program_type PROGRAM, RSK with program_type RISK."
            - "One LOCKED ATL PEAK 2026 plan with planned_unit_count 10 and two allocations of 4 units each (one per program), so allocated_unit_count is 8 and posture is OPEN."
            - "Vehicle VPGM under the PROGRAM allocation and vehicle VRSK under the RISK allocation, both IN_SERVICE with in_service_at 2026-01-15T00:00:00Z and odometer_km 47000."
            - "Logical clock parked at 2026-09-15T00:00:00Z for the reads, giving holding_days 243 and holding_months 8 for both vehicles."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /fleet/markets"
              payload: { code: "ATL", name: "Atlanta", region: "EAST", transport_hub_distance_km: 23, transfer_cost_per_km_cents: 250, storage_cost_per_day_cents: 800, prep_capacity_per_day: 2, registration_lead_days: 3 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { mkt_atl: $.data.id }
            - call: "POST /fleet/vehicle-segments"
              payload: { code: "MIDSIZE", name: "Midsize sedan", baseline_daily_rate_cents: 5500, target_utilization_pct: 0.80, target_revenue_per_unit_month_cents: 132000, mileage_band_soft_limit_km: 40000, mileage_band_hard_limit_km: 60000, recondition_cap_cents: 90000 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { seg_mid: $.data.id }
            - call: "POST /fleet/depreciation-policies"
              payload: { segment_id: "${seg_mid}", name: "MID-2026", monthly_depreciation_pct: 0.015, mileage_depreciation_cents_per_km: 12, floor_residual_pct: 0.35, effective_from: "2026-01-01T00:00:00Z" }
              as: FleetController
              as_user_id: "u-ctl-a"
              captures: { pol_mid: $.data.id }
            - call: "POST /fleet/depreciation-policies/${pol_mid}/activate"
              payload: {}
              as: FleetController
              as_user_id: "u-ctl-b"
            - call: "POST /fleet/manufacturer-programs"
              payload: { manufacturer_name: "Northstar", program_year: 2026, program_type: "PROGRAM", repurchase_guarantee_pct: 0.82, min_holding_days: 180, max_holding_days: 365, max_eligible_mileage_km: 45000, excess_mileage_charge_cents_per_km: 30, damage_deduction_cap_cents: 150000 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { prg_pgm: $.data.id }
            - call: "POST /fleet/manufacturer-programs"
              payload: { manufacturer_name: "Cascade", program_year: 2026, program_type: "RISK", repurchase_guarantee_pct: 0.00, min_holding_days: 90, max_holding_days: 900, max_eligible_mileage_km: 100000, excess_mileage_charge_cents_per_km: 0, damage_deduction_cap_cents: 0 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { prg_rsk: $.data.id }
            - call: "POST /fleet/fleet-plans"
              payload: { market_id: "${mkt_atl}", season: "PEAK", plan_year: 2026, planned_unit_count: 10, revenue_per_unit_target_cents: 132000, utilization_target_pct: 0.80 }
              as: FleetPlanner
              as_user_id: "u-plan-1"
              captures: { plan_atl: $.data.id }
            - call: "POST /fleet/fleet-plans/${plan_atl}/lock"
              payload: {}
              as: FleetController
              as_user_id: "u-ctl-a"
              captures: { plan_v1: $.data.version }
            - call: "POST /fleet/fleet-plans/${plan_atl}/allocations"
              payload: { program_id: "${prg_pgm}", segment_id: "${seg_mid}", unit_count: 4, capitalized_cost_per_unit_cents: 2800000, expected_plan_version: "${plan_v1}" }
              as: FleetPlanner
              as_user_id: "u-plan-1"
              captures: { alloc_pgm: $.data.id }
            - call: "GET /fleet/fleet-plans/${plan_atl}"
              payload: {}
              as: FleetPlanner
              as_user_id: "u-plan-1"
              captures: { plan_v2: $.data.version }
            - call: "POST /fleet/fleet-plans/${plan_atl}/allocations"
              payload: { program_id: "${prg_rsk}", segment_id: "${seg_mid}", unit_count: 4, capitalized_cost_per_unit_cents: 2800000, expected_plan_version: "${plan_v2}" }
              as: FleetPlanner
              as_user_id: "u-plan-1"
              captures: { alloc_rsk: $.data.id }
            - call: "POST /fleet/purchase-allocations/${alloc_pgm}/vehicles"
              payload: { vin: "NS26PGMATL000001", current_market_id: "${mkt_atl}" }
              as: FleetPlanner
              as_user_id: "u-plan-1"
              captures: { veh_pgm: $.data.id }
            - call: "POST /fleet/purchase-allocations/${alloc_rsk}/vehicles"
              payload: { vin: "CA26RSKATL000001", current_market_id: "${mkt_atl}" }
              as: FleetPlanner
              as_user_id: "u-plan-1"
              captures: { veh_rsk: $.data.id }
            - call: "POST /fleet/vehicles/${veh_pgm}/in-fleet"
              payload: {}
              as: MarketOperator
              as_user_id: "${mkt_atl}"
            - call: "POST /fleet/vehicles/${veh_rsk}/in-fleet"
              payload: {}
              as: MarketOperator
              as_user_id: "${mkt_atl}"
            - call: "POST /fleet/vehicles/${veh_pgm}/in-fleeting-tasks"
              payload: { task_type: "REGISTRATION", cost_cents: 14000, window_start: "2026-01-05T08:00:00Z", window_end: "2026-01-05T09:00:00Z" }
              as: MarketOperator
              as_user_id: "${mkt_atl}"
              captures: { t_pgm_reg: $.data.id }
            - call: "POST /fleet/in-fleeting-tasks/${t_pgm_reg}/complete"
              payload: {}
              as: MarketOperator
              as_user_id: "${mkt_atl}"
            - call: "POST /fleet/vehicles/${veh_pgm}/in-fleeting-tasks"
              payload: { task_type: "LICENSING", cost_cents: 9000, window_start: "2026-01-06T08:00:00Z", window_end: "2026-01-06T09:00:00Z" }
              as: MarketOperator
              as_user_id: "${mkt_atl}"
              captures: { t_pgm_lic: $.data.id }
            - call: "POST /fleet/in-fleeting-tasks/${t_pgm_lic}/complete"
              payload: {}
              as: MarketOperator
              as_user_id: "${mkt_atl}"
            - call: "POST /fleet/vehicles/${veh_pgm}/in-fleeting-tasks"
