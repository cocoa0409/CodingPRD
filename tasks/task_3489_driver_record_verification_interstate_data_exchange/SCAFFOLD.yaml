scenario: 'Driver Record Verification & Interstate Data Exchange (American Association of Motor Vehicle Administrators): state
  membership with participation in interstate systems for driver license, title and registration data exchange, one-driver-one-record
  enforcement through a pointer system that identifies records held in other states, license transfer processing when a driver
  moves with surrender of the prior license and record transfer, commercial driver information system requirements with disqualification
  and conviction posting deadlines, social security number and lawful status verification services used at license issuance,
  title verification to prevent branded title washing across states, message standards, testing and certification for state
  system connections, fee structures and governance among member jurisdictions

  '
domain_name: driver-record-exchange
api_prefix: /driver-exchange
complexity_profile:
  primary_archetype: Compliance / audit
  secondary_archetype: Workflow orchestration
  complexity_layers:
  - optimistic_concurrency
  - cascading_side_effects
  - scheduled_actions
  - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
  - one_to_many
  - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
entities:
- name: Jurisdiction
  parent: null
  common_fields: true
  fields:
  - name: code
    type: string
    source: input
    description: Two-letter jurisdiction code; unique across all jurisdictions
  - name: name
    type: string
    source: input
    description: Official jurisdiction name
  - name: fee_tier
    type: enum
    source: input
    description: TIER_1 | TIER_2 | TIER_3 — dues weighting tier assigned by the association
  - name: membership_status
    type: enum
    source: system
    description: APPLIED | ACTIVE | SUSPENDED | WITHDRAWN; starts APPLIED
  - name: certified_systems_count
    type: integer
    source: computed
    description: Count of this jurisdiction's SystemParticipations whose status == CERTIFIED
  - name: timeliness_score_bp
    type: integer
    source: computed
    default: 10000
    description: Basis points (0..10000) of commercial convictions posted within the 30-day deadline; 10000 when no commercial
      convictions exist
- name: SystemParticipation
  parent: null
  common_fields: true
  fields:
  - name: jurisdiction_id
    type: string
    source: input
    description: FK -> Jurisdiction.id; the member jurisdiction enrolling in the system
  - name: system
    type: enum
    source: input
    description: POINTER_NETWORK | COMMERCIAL_DRIVER_NETWORK | TITLE_NETWORK
  - name: status
    type: enum
    source: system
    description: ENROLLING | TESTING | CERTIFIED | SUSPENDED; starts ENROLLING
  - name: granted_at
    type: datetime
    source: system
    description: Logical-clock timestamp of the most recent grant to CERTIFIED; null until first grant
  - name: suspended_at
    type: datetime
    source: system
    description: Logical-clock timestamp of the most recent suspension; null until suspended
  constraints_note: 'Unique (jurisdiction_id, system): a second participation for the same pair is rejected ERR_PARTICIPATION_ALREADY_EXISTS'
- name: ConnectionCertification
  parent: null
  common_fields: true
  fields:
  - name: participation_id
    type: string
    source: input
    description: FK -> SystemParticipation.id; the connection under test
  - name: window_start
    type: datetime
    source: input
    description: Start of the certification test window (half-open lower bound, inclusive)
  - name: window_end
    type: datetime
    source: input
    description: End of the certification test window (half-open upper bound, exclusive)
  - name: status
    type: enum
    source: system
    description: SCHEDULED | PASSED | FAILED; starts SCHEDULED
  - name: score
    type: integer
    source: system
    description: 0..100 conformance score recorded at completion; null until completed
  - name: completed_at
    type: datetime
    source: system
    description: Logical-clock timestamp of completion; null while SCHEDULED
- name: DriverIdentity
  parent: null
  common_fields: true
  fields:
  - name: full_name
    type: string
    source: input
    description: Driver full legal name
  - name: date_of_birth
    type: string
    source: input
    description: ISO date YYYY-MM-DD
  - name: ssn_last4_hash
    type: string
    source: input
    description: Salted hash of SSN last-4 used by verification services
  - name: lawful_status_basis
    type: enum
    source: input
    description: US_CITIZEN | PERMANENT_RESIDENT | TEMPORARY_STATUS
- name: DriverRecord
  parent: null
  common_fields: true
  fields:
  - name: driver_id
    type: string
    source: input
    description: FK -> DriverIdentity.id; the driver this record describes
  - name: holding_jurisdiction_id
    type: string
    source: system
    description: FK -> Jurisdiction.id; set to the creating registrar's jurisdiction (X-User-ID)
  - name: status
    type: enum
    source: system
    description: ACTIVE | TRANSFERRED_OUT; starts ACTIVE. At most one ACTIVE record per driver (one-driver-one-record)
  - name: points_total
    type: integer
    source: computed
    default: 0
    description: 'Offense-window points: sum of Conviction.points whose offense_date lies in [current_date - 1095 days, current_date]'
  - name: abstract_points_total
    type: integer
    source: computed
    default: 0
    description: 'Conviction-window points: same sum keyed on conviction_date instead of offense_date'
- name: License
  parent: null
  common_fields: true
  fields:
  - name: driver_id
    type: string
    source: input
    description: FK -> DriverIdentity.id
  - name: issuing_jurisdiction_id
    type: string
    source: system
    description: FK -> Jurisdiction.id; set to the issuing registrar's jurisdiction (X-User-ID)
  - name: record_id
    type: string
    source: system
    description: FK -> DriverRecord.id; the ACTIVE record held by the issuing jurisdiction at issuance time
  - name: license_class
    type: enum
    source: input
    description: STANDARD | COMMERCIAL
  - name: status
    type: enum
    source: system
    description: PENDING_VERIFICATION | ACTIVE | SUSPENDED | SURRENDERED | DENIED; starts PENDING_VERIFICATION
  - name: ssn_check_status
    type: enum
    source: system
    description: PENDING | VERIFIED | FAILED — parallel verification dimension 1
  - name: lawful_status_check_status
    type: enum
    source: system
    description: PENDING | VERIFIED | FAILED — parallel verification dimension 2
- name: LicenseTransfer
  parent: null
  common_fields: true
  fields:
  - name: driver_id
    type: string
    source: input
    description: FK -> DriverIdentity.id; the driver moving jurisdictions
  - name: from_jurisdiction_id
    type: string
    source: system
    description: FK -> Jurisdiction.id; derived from prior_license.issuing_jurisdiction_id
  - name: to_jurisdiction_id
    type: string
    source: system
    description: FK -> Jurisdiction.id; the initiating registrar's jurisdiction (X-User-ID)
  - name: prior_license_id
    type: string
    source: input
    description: FK -> License.id; the license to be surrendered
  - name: new_license_id
    type: string
    source: system
    description: FK -> License.id; license created at completion; null until COMPLETED
  - name: status
    type: enum
    source: system
    description: INITIATED | SURRENDER_RECORDED | CONTESTED | COMPLETED | CANCELLED; starts INITIATED
  - name: contest_reason
    type: string
    source: system
    description: Reason recorded by the most recent contest; null unless CONTESTED (cleared on re-surrender)
- name: Conviction
  parent: null
  common_fields: false
  fields:
  - name: record_id
    type: string
    source: input
    description: FK -> DriverRecord.id; record receiving the conviction posting
  - name: offense_date
    type: string
    source: input
    description: ISO date of the offense
  - name: conviction_date
    type: string
    source: input
    description: ISO date the court convicted
  - name: severity
    type: enum
    source: input
    description: NON_CMV | CMV_SERIOUS | CMV_MAJOR
  - name: points
    type: integer
    source: input
    description: Demerit points 1..6
  - name: posted_at
    type: datetime
    source: system
    description: Logical-clock timestamp when the conviction was posted
  - name: is_late
    type: boolean
    source: computed
    description: 'true iff posted date - conviction_date > 30 days (deadline is inclusive: exactly 30 days is timely)'
- name: Disqualification
  parent: null
  common_fields: true
  fields:
  - name: record_id
    type: string
    source: system
    description: FK -> DriverRecord.id; record under disqualification
  - name: basis
    type: enum
    source: system
    description: MANUAL_JUDICIAL | AUTO_MAJOR | AUTO_POINTS
  - name: start_date
    type: string
    source: system
    description: 'ISO date the disqualification begins (inclusive). Manual: supplied in request; auto: logical clock date
      at creation'
  - name: end_date
    type: string
    source: system
    description: ISO date the disqualification ends (inclusive; closed interval)
  - name: status
    type: enum
    source: computed
    description: 'Derived at read time from the logical clock: OVERTURNED if overturned; else COMPLETED if current date >
      end_date; else ACTIVE'
  - name: overturned_at
    type: datetime
    source: system
    description: Logical-clock timestamp of overturn; null unless OVERTURNED
- name: VehicleTitle
  parent: null
  common_fields: true
  fields:
  - name: vin
    type: string
    source: input
    description: 17-character VIN; unique among titles whose status == ACTIVE
  - name: holding_jurisdiction_id
    type: string
    source: system
    description: FK -> Jurisdiction.id; set to the titling registrar's jurisdiction (X-User-ID)
  - name: brands
    type: array
    source: input
    description: 'Brand set: subset of [SALVAGE, FLOOD, REBUILT, JUNK]; defaults to []'
  - name: status
    type: enum
    source: system
    description: ACTIVE | EXPORTED; starts ACTIVE
  - name: washing_alert
    type: boolean
    source: computed
    default: false
    description: Set true when a title transfer is rejected for brand disclosure mismatch on this title; never cleared
- name: TitleTransfer
  parent: null
  common_fields: true
  fields:
  - name: vehicle_title_id
    type: string
    source: input
    description: FK -> VehicleTitle.id; the source (out-of-state) title being re-titled
  - name: to_jurisdiction_id
    type: string
    source: system
    description: FK -> Jurisdiction.id; the requesting registrar's jurisdiction (X-User-ID)
  - name: disclosed_brands
    type: array
    source: input
    description: Brands the applicant discloses; must be a superset of the source title's brands
  - name: carried_brands
    type: array
    source: computed
    description: Sorted union of source brands and disclosed brands; carried onto the new title (brand-washing prevention)
  - name: new_title_id
    type: string
    source: system
    description: Server id of the VehicleTitle created in the receiving jurisdiction at completion; null until COMPLETED
  - name: status
    type: enum
    source: system
    description: VERIFIED | COMPLETED; created VERIFIED after the synchronous brand check
- name: FeeInvoice
  parent: null
  common_fields: true
  fields:
  - name: jurisdiction_id
    type: string
    source: input
    description: FK -> Jurisdiction.id; the invoiced member jurisdiction
  - name: fiscal_year
    type: integer
    source: input
    description: Calendar year of the dues assessment
  - name: projected_volume
    type: integer
    source: input
    description: Projected annual interchange transaction volume declared at issuance (reissue replaces it)
  - name: certified_count_at_issue
    type: integer
    source: computed
    description: Snapshot of jurisdiction.certified_systems_count pinned at issuance; drives the provisional multiplier
  - name: provisional_amount_cents
    type: integer
    source: computed
    description: Annual formula on projected_volume with the pinned multiplier (see annual_dues_assessment)
  - name: status
    type: enum
    source: system
    description: ISSUED | DISPUTED | SETTLED | AUDITED; created ISSUED
  - name: dispute_reason
    type: string
    source: system
    description: Reason supplied at dispute; null unless DISPUTED
  - name: settled_amount_cents
    type: integer
    source: system
    description: Amount the jurisdiction paid at settle; null until SETTLED
  - name: actual_volume_quarters
    type: array
    source: system
    description: Exactly 4 audited quarterly volumes supplied at finalize-audit; null until AUDITED
  - name: final_amount_cents
    type: integer
    source: computed
    description: Sum of per-quarter rounded charges with the multiplier recomputed from CURRENT certified_systems_count (see
      audited_dues_settlement)
  - name: adjustment_amount_cents
    type: integer
    source: computed
    description: final_amount_cents - settled_amount_cents; positive = underpayment due, negative = credit
state_machines:
- entity: Jurisdiction
  initial_state: APPLIED
  terminal_states:
  - WITHDRAWN
  transitions:
  - from: APPLIED
    to: ACTIVE
    trigger: PATCH /driver-exchange/jurisdictions/{id} with status=ACTIVE
    actor: AssociationAdmin
    preconditions:
    - At least one SystemParticipation of this jurisdiction has status == CERTIFIED with system == POINTER_NETWORK (ERR_PARTICIPATION_NOT_CERTIFIED)
    side_effects:
    - membership_status -> ACTIVE
  - from: ACTIVE
    to: SUSPENDED
    trigger: PATCH /driver-exchange/jurisdictions/{id} with status=SUSPENDED
    actor: AssociationAdmin
    preconditions: []
    side_effects:
    - 'Cascade link 1: every SystemParticipation of this jurisdiction with status == CERTIFIED transitions to SUSPENDED (suspended_at
      set)'
    - 'Cascade link 2 (caused by link 1): every LicenseTransfer with to_jurisdiction_id == this jurisdiction and status IN
      {INITIATED, CONTESTED} transitions to CANCELLED, because the POINTER_NETWORK participation those transfers rely on is
      no longer CERTIFIED'
  - from: SUSPENDED
    to: ACTIVE
    trigger: PATCH /driver-exchange/jurisdictions/{id} with status=ACTIVE
    actor: AssociationAdmin
    preconditions: []
    side_effects:
    - Every SystemParticipation of this jurisdiction with status == SUSPENDED that has at least one PASSED ConnectionCertification
      transitions back to CERTIFIED (granted_at refreshed)
  - from: ACTIVE
    to: WITHDRAWN
    trigger: PATCH /driver-exchange/jurisdictions/{id} with status=WITHDRAWN
    actor: AssociationAdmin
    preconditions: []
    side_effects:
    - membership_status -> WITHDRAWN (terminal; jurisdiction resources remain readable)
  - from: SUSPENDED
    to: WITHDRAWN
    trigger: PATCH /driver-exchange/jurisdictions/{id} with status=WITHDRAWN
    actor: AssociationAdmin
    preconditions: []
    side_effects: []
- entity: SystemParticipation
  initial_state: ENROLLING
  terminal_states: []
  transitions:
  - from: ENROLLING
    to: TESTING
    trigger: system (first ConnectionCertification scheduled for this participation via POST /driver-exchange/connection-certifications)
    actor: system
    preconditions: []
    side_effects: []
  - from: TESTING
    to: CERTIFIED
    trigger: POST /driver-exchange/system-participations/{id}/grant-certification
    actor: AssociationAdmin
    preconditions:
    - 'The certification with the maximum window_start among this participation''s ConnectionCertifications with status IN
      {PASSED, FAILED} (tie-break: latest created_at) has status == PASSED (ERR_GRANT_REQUIRES_PASSED_CERTIFICATION)'
    - Parent jurisdiction membership_status != WITHDRAWN (ERR_JURISDICTION_NOT_ACTIVE)
    side_effects:
    - status -> CERTIFIED; granted_at set
    - Jurisdiction.certified_systems_count recomputed
  - from: CERTIFIED
    to: SUSPENDED
    trigger: system (parent jurisdiction ACTIVE -> SUSPENDED)
    actor: system
    preconditions: []
    side_effects:
    - Jurisdiction.certified_systems_count recomputed
    - In-flight LicenseTransfers relying on this participation are cancelled (see Jurisdiction cascade link 2)
  - from: SUSPENDED
    to: CERTIFIED
    trigger: system (parent jurisdiction SUSPENDED -> ACTIVE, provided a PASSED certification exists)
    actor: system
    preconditions:
    - Participation has at least one ConnectionCertification with status == PASSED
    side_effects:
    - Jurisdiction.certified_systems_count recomputed
    note: 'CERTIFIED -> SUSPENDED -> CERTIFIED forms the cycle: decertification on jurisdiction suspension, restoration on
      re-activation'
- entity: ConnectionCertification
  initial_state: SCHEDULED
  terminal_states:
  - PASSED
  - FAILED
  transitions:
  - from: SCHEDULED
    to: PASSED
    trigger: POST /driver-exchange/connection-certifications/{id}/complete with result=PASSED
    actor: CertificationEngineer
    preconditions:
    - 'Logical clock current instant within [window_start, window_end) — half-open: exactly window_start is inside, exactly
      window_end is outside (ERR_OUTSIDE_TEST_WINDOW)'
    side_effects:
    - status -> PASSED; score and completed_at recorded
  - from: SCHEDULED
    to: FAILED
    trigger: POST /driver-exchange/connection-certifications/{id}/complete with result=FAILED
    actor: CertificationEngineer
    preconditions:
    - Logical clock current instant within [window_start, window_end) (ERR_OUTSIDE_TEST_WINDOW)
    side_effects:
    - status -> FAILED; score and completed_at recorded
- entity: DriverRecord
  initial_state: ACTIVE
  terminal_states:
  - TRANSFERRED_OUT
  transitions:
  - from: ACTIVE
    to: TRANSFERRED_OUT
    trigger: system (LicenseTransfer completion moves the master record)
    actor: system
    preconditions: []
    side_effects:
    - A replacement DriverRecord is created in the receiving jurisdiction with status ACTIVE and points_total = 0
    - 'One-driver-one-record invariant: count of ACTIVE DriverRecords for the driver remains exactly 1'
- entity: License
  initial_state: PENDING_VERIFICATION
  terminal_states:
  - DENIED
  transitions:
  - from: PENDING_VERIFICATION
    to: ACTIVE
    trigger: system (POST /driver-exchange/licenses/{id}/verification-results sets the second of ssn_check_status and lawful_status_check_status
      to VERIFIED)
    actor: system
    preconditions:
    - Both ssn_check_status == VERIFIED and lawful_status_check_status == VERIFIED
    side_effects: []
  - from: PENDING_VERIFICATION
    to: DENIED
    trigger: system (any verification-results call sets either check to FAILED)
    actor: system
    preconditions: []
    side_effects: []
  - from: ACTIVE
    to: SUSPENDED
    trigger: system (a Disqualification is created on the backing DriverRecord and license_class == COMMERCIAL)
    actor: system
    preconditions: []
    side_effects: []
    note: 'Cascade link 3 of the conviction cascade: conviction -> points recompute -> Disqualification -> this suspension.
      STANDARD licenses are not suspended.'
  - from: SUSPENDED
    to: ACTIVE
    trigger: POST /driver-exchange/licenses/{id}/reinstate
    actor: JurisdictionRegistrar
    preconditions:
    - Caller is a registrar of issuing_jurisdiction_id (ERR_JURISDICTION_OWNERSHIP_MISMATCH)
    - No Disqualification on the backing record whose derived status is ACTIVE (ERR_ACTIVE_DISQUALIFICATION)
    side_effects: []
  - from: ACTIVE
    to: SURRENDERED
    trigger: system (LicenseTransfer record-surrender records surrender of this license as prior_license)
    actor: system
    preconditions: []
    side_effects: []
  - from: SURRENDERED
    to: ACTIVE
    trigger: 'system (LicenseTransfer contest — compensation: the surrender is walked back while the transfer is disputed)'
    actor: system
    preconditions: []
    side_effects: []
- entity: LicenseTransfer
  initial_state: INITIATED
  terminal_states:
  - COMPLETED
  - CANCELLED
  transitions:
  - from: INITIATED
    to: SURRENDER_RECORDED
    trigger: POST /driver-exchange/license-transfers/{id}/record-surrender
    actor: JurisdictionRegistrar
    preconditions:
    - Caller is a registrar of from_jurisdiction_id (ERR_JURISDICTION_OWNERSHIP_MISMATCH)
    side_effects:
    - prior License ACTIVE -> SURRENDERED
    - contest_reason cleared to null
  - from: CONTESTED
    to: SURRENDER_RECORDED
    trigger: POST /driver-exchange/license-transfers/{id}/record-surrender (re-surrender after contest; closes the contest
      loop)
    actor: JurisdictionRegistrar
    preconditions:
    - Caller is a registrar of from_jurisdiction_id (ERR_JURISDICTION_OWNERSHIP_MISMATCH)
    side_effects:
    - prior License ACTIVE -> SURRENDERED
    - contest_reason cleared to null
  - from: SURRENDER_RECORDED
    to: CONTESTED
    trigger: POST /driver-exchange/license-transfers/{id}/contest
    actor: JurisdictionRegistrar
    preconditions:
    - Caller is a registrar of to_jurisdiction_id (ERR_JURISDICTION_OWNERSHIP_MISMATCH)
    side_effects:
    - contest_reason set from request
    - prior License SURRENDERED -> ACTIVE (compensation while disputed)
  - from: SURRENDER_RECORDED
    to: COMPLETED
    trigger: POST /driver-exchange/license-transfers/{id}/complete
    actor: JurisdictionRegistrar
    preconditions:
    - Caller is a registrar of to_jurisdiction_id (ERR_JURISDICTION_OWNERSHIP_MISMATCH)
    - prior License status == SURRENDERED (ERR_INVALID_STATE)
    - No Disqualification on the driver's ACTIVE record has derived status == ACTIVE (ERR_ACTIVE_DISQUALIFICATION)
    - to_jurisdiction membership_status == ACTIVE and holds a CERTIFIED POINTER_NETWORK participation (ERR_PARTICIPATION_NOT_CERTIFIED)
    side_effects:
    - prior DriverRecord ACTIVE -> TRANSFERRED_OUT
    - 'New DriverRecord created: same driver, holding_jurisdiction = to_jurisdiction, status ACTIVE, points_total = 0, abstract_points_total
      = 0'
    - 'New License created: PENDING_VERIFICATION, issuing_jurisdiction = to_jurisdiction, record = the new record, license_class
      copied from prior license, both check statuses PENDING'
    - new_license_id set to the new License id
  - from: INITIATED
    to: CANCELLED
    trigger: system (to_jurisdiction suspended — cascade link 2)
    actor: system
    preconditions: []
    side_effects: []
  - from: CONTESTED
    to: CANCELLED
    trigger: system (to_jurisdiction suspended — cascade link 2)
    actor: system
    preconditions:
    - On this cascade path the prior License remains ACTIVE (the contest compensation already restored it)
    side_effects: []
- entity: VehicleTitle
  initial_state: ACTIVE
  terminal_states:
  - EXPORTED
  transitions:
  - from: ACTIVE
    to: EXPORTED
    trigger: system (TitleTransfer completion re-titles the vehicle in the receiving jurisdiction)
    actor: system
    preconditions: []
    side_effects:
    - 'New VehicleTitle created: same VIN, holding_jurisdiction = receiving jurisdiction, brands = carried_brands, status
      ACTIVE, washing_alert = false'
- entity: TitleTransfer
  initial_state: VERIFIED
  terminal_states:
  - COMPLETED
  transitions:
  - from: VERIFIED
    to: COMPLETED
    trigger: POST /driver-exchange/title-transfers/{id}/complete
    actor: JurisdictionRegistrar
    preconditions:
    - Caller is a registrar of to_jurisdiction_id (ERR_JURISDICTION_OWNERSHIP_MISMATCH)
    - Source VehicleTitle status == ACTIVE (ERR_INVALID_STATE)
    side_effects:
    - Source VehicleTitle ACTIVE -> EXPORTED
    - New VehicleTitle created in receiving jurisdiction with brands = carried_brands
    - new_title_id set
- entity: FeeInvoice
  initial_state: ISSUED
  terminal_states:
  - AUDITED
  transitions:
  - from: ISSUED
    to: DISPUTED
    trigger: POST /driver-exchange/fee-invoices/{id}/dispute
    actor: JurisdictionRegistrar
    preconditions:
    - Caller is a registrar of the invoiced jurisdiction (ERR_JURISDICTION_OWNERSHIP_MISMATCH)
    side_effects:
    - dispute_reason recorded
  - from: DISPUTED
    to: ISSUED
    trigger: POST /driver-exchange/fee-invoices/{id}/reissue
    actor: AssociationAdmin
    preconditions: []
    side_effects:
    - projected_volume replaced; provisional_amount_cents recomputed with the ORIGINAL certified_count_at_issue (pinned multiplier)
    - dispute_reason cleared to null
    note: ISSUED -> DISPUTED -> ISSUED forms the dispute loop
  - from: ISSUED
    to: SETTLED
    trigger: POST /driver-exchange/fee-invoices/{id}/settle
    actor: JurisdictionRegistrar
    preconditions:
    - Caller is a registrar of the invoiced jurisdiction (ERR_JURISDICTION_OWNERSHIP_MISMATCH)
    - Request amount_cents == provisional_amount_cents exactly (ERR_FEE_AMOUNT_MISMATCH)
    side_effects:
    - settled_amount_cents recorded
  - from: SETTLED
    to: AUDITED
    trigger: POST /driver-exchange/fee-invoices/{id}/finalize-audit
    actor: AuditAuthority
    preconditions:
    - actual_volume_quarters has exactly 4 non-negative integer entries (ERR_INVALID_REQUEST)
    side_effects:
    - final_amount_cents computed per audited_dues_settlement (per-quarter rounding, multiplier from CURRENT certified_systems_count)
    - adjustment_amount_cents = final_amount_cents - settled_amount_cents (negative = credit owed to jurisdiction)
- entity: Disqualification
  initial_state: ACTIVE
  terminal_states:
  - COMPLETED
  - OVERTURNED
  note: 'status is DERIVED at read time from the logical clock: OVERTURNED if overturned_at set; else COMPLETED if current
    date > end_date; else ACTIVE. The only mutation endpoint is overturn.'
  transitions:
  - from: ACTIVE
    to: OVERTURNED
    trigger: POST /driver-exchange/disqualifications/{id}/overturn
    actor: AuditAuthority
    preconditions:
    - Derived status == ACTIVE (ERR_INVALID_STATE)
    side_effects:
    - overturned_at set; derived status becomes OVERTURNED
  - from: ACTIVE
    to: COMPLETED
    trigger: system (logical clock advances past end_date; derived on read)
    actor: system
    preconditions: []
    side_effects: []
concurrency_rules:
- rule_id: record-claim-stale-driver
  parent_entity: DriverIdentity
  write_endpoint: POST /driver-exchange/driver-records
  occ_field: expected_driver_version
  description: 'Creating a DriverRecord (claiming the one-driver-one-record master record)

    against a DriverIdentity whose version has advanced since the client last

    observed it is rejected. This captures the case where another jurisdiction''s

    claim has legitimately become the master record since the client''s read, so

    the client''s view of the driver is stale.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
- rule_id: transfer-initiate-stale-driver
  parent_entity: DriverIdentity
  write_endpoint: POST /driver-exchange/license-transfers
  occ_field: expected_driver_version
  description: 'Initiating a LicenseTransfer against a DriverIdentity whose version has

    advanced since the client last observed it is rejected. This captures the

    case where a record claim or an earlier transfer initiation has legitimately

    advanced the driver''s state since the client''s read, so the client''s view

    of the driver is stale.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
calculations:
- name: driver_points_total
  trigger: Conviction posted on the record (recomputed and stored at posting time)
  algorithm: aggregation
  formula: "Let W = POINTS_WINDOW_DAYS (1095). Let today = logical clock date.\npoints_total         = sum(c.points) over\
    \ convictions c on this record\n                       where (today - c.offense_date) IN [0, W]  (offense window, inclusive)\n\
    abstract_points_total = sum(c.points) over convictions c on this record\n                       where (today - c.conviction_date)\
    \ IN [0, W]  (conviction window, inclusive)\nBoth windows include the boundary day: a conviction exactly 1095 days old\
    \ counts.\n"
  input_set: All Conviction entities with record_id == this record (convictions are immutable and never removed)
  constants:
    POINTS_WINDOW_DAYS: 1095
  precision: integer points; no rounding
  variants:
  - name: offense_window
    when: 'Canonical operational points: drives disqualification evaluation and is exposed as DriverRecord.points_total'
    difference: Keys the trailing window on offense_date
  - name: conviction_window
    when: Abstract/reporting view exposed as DriverRecord.abstract_points_total
    difference: Keys the trailing window on conviction_date; diverges from offense_window whenever offense_date and conviction_date
      straddle the window boundary differently
- name: disqualification_duration
  trigger: After driver_points_total recomputation at conviction posting, when a disqualification trigger fires
  algorithm: threshold
  formula: "Evaluation order is pinned (circular-looking dependency resolved top-down):\n1. new_points = points_total (offense_window\
    \ variant) ALREADY INCLUDING the just-posted conviction.\n2. Trigger test: if the just-posted conviction has severity\
    \ == CMV_MAJOR -> base = MAJOR_BASE_DAYS, basis = AUTO_MAJOR;\n   elif new_points >= POINTS_THRESHOLD -> base = POINTS_BASE_DAYS,\
    \ basis = AUTO_POINTS;\n   else -> no disqualification is created.\n3. prior_count = count of existing Disqualifications\
    \ on this record with derived status IN {ACTIVE, COMPLETED}\n   (OVERTURNED disqualifications do not count).\n4. duration_days\
    \ = base * min(1 + prior_count, DURATION_MULTIPLIER_CAP).\n5. Window: start_date = logical clock date; end_date = start_date\
    \ + duration_days days.\n6. Overlap policy (auto creation): consider existing Disqualifications on the record with derived\n\
    \   status == ACTIVE whose closed interval [existing.start_date, existing.end_date] intersects\n   [start_date, end_date].\
    \ If the set is empty, create the new entity. If non-empty, NO new entity is\n   created; instead exactly one merge target\
    \ -- the intersecting record with the earliest start_date\n   (tie-break: created_at ascending) -- is extended: target.end_date\
    \ = max(target.end_date, new end_date).\n   Single-step extension, no iteration; basis and start_date of the merge target\
    \ are unchanged; other\n   derived-ACTIVE disqualifications are untouched.\nNote: points determine the tier, and the just-posted\
    \ conviction is itself part of points — step 1 pins that ordering.\n"
  input_set: Convictions on the record (per driver_points_total) and existing Disqualifications on the record
  constants:
    POINTS_THRESHOLD: 12
    POINTS_BASE_DAYS: 90
    MAJOR_BASE_DAYS: 365
    DURATION_MULTIPLIER_CAP: 3
  precision: whole days
- name: posting_timeliness_score
  trigger: Conviction posted on any DriverRecord whose holding_jurisdiction_id == the jurisdiction
  algorithm: aggregation
  formula: 'Eligible set: convictions on records held by this jurisdiction with severity IN {CMV_SERIOUS, CMV_MAJOR}.

    A conviction is TIMELY iff (posted_at date - conviction_date) <= CONVICTION_POSTING_DEADLINE_DAYS (30).

    The deadline is inclusive: exactly 30 days is timely; 31 days is late (is_late = true on the conviction).

    timeliness_score_bp = round_half_up(10000 * timely_count / total_count) for total_count > 0;

    timeliness_score_bp = 10000 when total_count == 0 (empty set is fully timely).

    '
  input_set: Convictions on DriverRecords with holding_jurisdiction_id == this jurisdiction, filtered to commercial severities
  constants:
    CONVICTION_POSTING_DEADLINE_DAYS: 30
  precision: integer basis points 0..10000
- name: annual_dues_assessment
  trigger: FeeInvoice creation and reissue (provisional assessment)
  algorithm: tiered_pricing
  formula: "Pinned evaluation order (base fee is NOT multiplied; the discount applies to the transaction fee only):\n1. n\
    \ = certified_count_at_issue (snapshot of jurisdiction.certified_systems_count pinned at first issuance;\n   reissue keeps\
    \ the ORIGINAL pinned n).\n2. multiplier = max(MULTIPLIER_FLOOR, 1 - DISCOUNT_STEP * (n - 1)).\n3. Marginal transaction\
    \ fee on projected_volume v (each bracket's transactions priced at that bracket's rate):\n   fee(v) = TIER1_RATE_CENTS\
    \ * min(v, TIER1_LIMIT)\n          + TIER2_RATE_CENTS * max(0, min(v - TIER1_LIMIT, TIER2_LIMIT - TIER1_LIMIT))\n    \
    \      + TIER3_RATE_CENTS * max(0, v - TIER2_LIMIT)\n4. provisional_amount_cents = round_half_up( min(ANNUAL_CAP_CENTS,\
    \ BASE_FEE_CENTS + fee(v) * multiplier) )\n"
  input_set: The FeeInvoice's projected_volume and the pinned certified_count_at_issue
  constants:
    BASE_FEE_CENTS: 2500000
    ANNUAL_CAP_CENTS: 20000000
    TIER1_LIMIT: 10000
    TIER2_LIMIT: 50000
    TIER1_RATE_CENTS: 12.5
    TIER2_RATE_CENTS: 10.5
    TIER3_RATE_CENTS: 8.5
    MULTIPLIER_FLOOR: 0.85
    DISCOUNT_STEP: 0.05
  precision: whole cents; round_half_up applied once, after the cap
  variants:
  - name: provisional
    when: At issuance/reissue — projected_volume with the pinned multiplier
    difference: Annual-volume single rounding; uses certified_count_at_issue frozen at issuance
  - name: audited
    when: At finalize-audit — see audited_dues_settlement
    difference: Different formula shape (per-quarter rounding) and multiplier from CURRENT certified_systems_count, so identical
      annual totals can settle to a different amount
- name: audited_dues_settlement
  trigger: FeeInvoice finalize-audit (final assessment)
  algorithm: tiered_pricing
  formula: "Rounding order is pinned: ROUND PER QUARTER, THEN SUM. Summing first and rounding once is a different\n(incorrect)\
    \ result whenever a quarter's raw charge lands on a fractional cent.\nFor each quarter q in actual_volume_quarters (exactly\
    \ 4 entries, order Q1..Q4):\n  q_charge_cents = round_half_up( BASE_FEE_CENTS / 4 + fee(q) * multiplier )\nwhere fee()\
    \ and the tier constants are exactly those of annual_dues_assessment, and\nmultiplier = max(MULTIPLIER_FLOOR, 1 - DISCOUNT_STEP\
    \ * (n_current - 1)) with\nn_current = jurisdiction.certified_systems_count AT AUDIT TIME (not the pinned count).\nfinal_amount_cents\
    \ = sum(q_charge_cents over the 4 quarters)\nadjustment_amount_cents = final_amount_cents - settled_amount_cents\n"
  input_set: actual_volume_quarters supplied at finalize-audit; jurisdiction's current certified_systems_count
  constants:
    BASE_FEE_CENTS: 2500000
    TIER1_LIMIT: 10000
    TIER2_LIMIT: 50000
    TIER1_RATE_CENTS: 12.5
    TIER2_RATE_CENTS: 10.5
    TIER3_RATE_CENTS: 8.5
    MULTIPLIER_FLOOR: 0.85
    DISCOUNT_STEP: 0.05
  precision: whole cents; round_half_up per quarter, then integer sum
  variants:
  - name: audited
    when: Always at finalize-audit
    difference: Per-quarter rounding then sum; multiplier uses current certified count (the provisional variant rounds once
      on annual volume with the pinned count)
- name: title_brand_carry_forward
  trigger: TitleTransfer creation (synchronous brand verification)
  algorithm: aggregation
  formula: 'Let S = set(source_title.brands), D = set(request.disclosed_brands).

    If NOT (D superset of S): reject with ERR_BRAND_DISCLOSURE_MISMATCH and set source_title.washing_alert = true

    (the washing attempt is recorded on the source title; no TitleTransfer is persisted).

    Else: carried_brands = sorted(D union S) alphabetically; the transfer is created VERIFIED.

    Empty-set boundary: S == D == [] passes verification and yields carried_brands == [].

    '
  input_set: The source VehicleTitle's brands and the request's disclosed_brands
  precision: set semantics; alphabetical ordering of the union for determinism
validations:
- priority: 1
  category: auth
  check: X-User-ID and X-User-Role headers must be present and well-formed
  error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
  http_status: 400
  applies_to: all
- priority: 2
  category: auth
  check: X-User-Role must be in the endpoint's declared roles
  error_id: ERR_INSUFFICIENT_PERMISSIONS
  http_status: 403
  applies_to: all
- priority: 3
  category: auth
  check: 'JurisdictionRegistrar ownership: X-User-ID must equal the id of the Jurisdiction that owns (or will own) the resource
    — record-holding jurisdiction for convictions, issuing jurisdiction for licenses/reinstate, invoiced jurisdiction for
    dispute/settle, from_jurisdiction for record-surrender, to_jurisdiction for initiate/contest/complete of transfers'
  error_id: ERR_JURISDICTION_OWNERSHIP_MISMATCH
  http_status: 403
  applies_to: jurisdiction-scoped JurisdictionRegistrar endpoints
- priority: 4
  category: existence
  check: Path ids and body foreign keys must reference existing resources (validated left-to-right)
  error_id: ERR_<RESOURCE>_NOT_FOUND
  http_status: 404
  applies_to: all
- priority: 5
  category: state
  check: 'OCC: expected_driver_version (when required by §1.2.1) must equal the DriverIdentity''s current version'
  error_id: ERR_STALE_VERSION
  http_status: 412
  applies_to: POST /driver-exchange/driver-records, POST /driver-exchange/license-transfers
- priority: 6
  category: state
  check: 'Target resource must be in a state from which the requested transition is declared (includes: conviction posting
    requires record ACTIVE — ERR_RECORD_NOT_ACTIVE; transfer/invoice/certification machine arcs — ERR_INVALID_STATE; grant
    requires latest certification PASSED — ERR_GRANT_REQUIRES_PASSED_CERTIFICATION; license-dependent operations require license
    ACTIVE — ERR_LICENSE_NOT_ACTIVE; jurisdiction activation requires membership preconditions — ERR_JURISDICTION_NOT_ACTIVE).
    Sub-ordering within this priority is pinned: ERR_JURISDICTION_NOT_ACTIVE first, then ERR_PARTICIPATION_NOT_CERTIFIED,
    then resource-level machine arcs (ERR_INVALID_STATE / ERR_RECORD_NOT_ACTIVE / ERR_LICENSE_NOT_ACTIVE / ERR_GRANT_REQUIRES_PASSED_CERTIFICATION)'
  error_id: ERR_INVALID_STATE | ERR_RECORD_NOT_ACTIVE | ERR_GRANT_REQUIRES_PASSED_CERTIFICATION | ERR_LICENSE_NOT_ACTIVE |
    ERR_JURISDICTION_NOT_ACTIVE
  http_status: 409
  applies_to: state transition and state-gated endpoints
- priority: 7
  category: business_safety
  check: 'Commercial credentialing safety: COMMERCIAL license issuance requires no Disqualification with derived status ACTIVE
    on the driver''s ACTIVE record; license reinstatement requires none either; transfer completion requires none (ERR_ACTIVE_DISQUALIFICATION).
    Brand-washing prevention: disclosed_brands must be a superset of the source title''s brands (ERR_BRAND_DISCLOSURE_MISMATCH)'
  error_id: ERR_ACTIVE_DISQUALIFICATION | ERR_BRAND_DISCLOSURE_MISMATCH
  http_status: 409
  applies_to: POST /driver-exchange/licenses, POST /driver-exchange/licenses/{id}/reinstate, POST /driver-exchange/license-transfers/{id}/complete,
    POST /driver-exchange/title-transfers
- priority: 8
  category: business_constraint
  check: 'Uniqueness and exclusivity: one-driver-one-record (ERR_RECORD_ALREADY_HELD), license issuance blocked while the
    driver''s ACTIVE record is held by another jurisdiction (ERR_RECORD_HELD_BY_OTHER_JURISDICTION — use the transfer flow),
    one in-flight LicenseTransfer per driver (ERR_TRANSFER_ALREADY_IN_FLIGHT), one ACTIVE VehicleTitle per VIN (ERR_VIN_ALREADY_TITLED),
    unique (jurisdiction, system) participation (ERR_PARTICIPATION_ALREADY_EXISTS), unique jurisdiction code (ERR_JURISDICTION_CODE_TAKEN)'
  error_id: ERR_RECORD_ALREADY_HELD | ERR_RECORD_HELD_BY_OTHER_JURISDICTION | ERR_TRANSFER_ALREADY_IN_FLIGHT | ERR_VIN_ALREADY_TITLED
    | ERR_PARTICIPATION_ALREADY_EXISTS | ERR_JURISDICTION_CODE_TAKEN
  http_status: 409
  applies_to: creation endpoints
- priority: 9
  category: business_temporal
  check: 'Temporal windows: certification window_start < window_end (ERR_INVALID_WINDOW); no overlap among a participation''s
    SCHEDULED certifications under half-open [start, end) semantics — adjacency is allowed (ERR_CERT_WINDOW_OVERLAP); completion
    only inside the window (ERR_OUTSIDE_TEST_WINDOW); manual Disqualification windows must not overlap an existing derived-ACTIVE
    Disqualification under CLOSED-interval semantics — shared boundary days collide (ERR_DISQUALIFICATION_OVERLAP)'
  error_id: ERR_INVALID_WINDOW | ERR_CERT_WINDOW_OVERLAP | ERR_OUTSIDE_TEST_WINDOW | ERR_DISQUALIFICATION_OVERLAP
  http_status: 400 (ERR_INVALID_WINDOW) | 409 (overlaps) | 422 (ERR_OUTSIDE_TEST_WINDOW) — per-error status in §1.6
  applies_to: POST /driver-exchange/connection-certifications, POST /driver-exchange/connection-certifications/{id}/complete,
    POST /driver-exchange/disqualifications
- priority: 10
  category: business_referential
  check: 'Cross-aggregate referential integrity: title transfer target jurisdiction must differ from the source title''s holding
    jurisdiction (ERR_SAME_JURISDICTION_TRANSFER); license issuance requires an ACTIVE DriverRecord held by the issuing jurisdiction
    (ERR_RECORD_NOT_FOUND when none exists); transfer initiation''s prior license must belong to the driver''s ACTIVE record
    chain'
  error_id: ERR_SAME_JURISDICTION_TRANSFER | ERR_RECORD_NOT_FOUND
  http_status: 422
  applies_to: POST /driver-exchange/title-transfers, POST /driver-exchange/licenses, POST /driver-exchange/license-transfers
- priority: 11
  category: business_fiscal
  check: 'Fee integrity: settle amount_cents must equal provisional_amount_cents exactly'
  error_id: ERR_FEE_AMOUNT_MISMATCH
  http_status: 402
  applies_to: POST /driver-exchange/fee-invoices/{id}/settle
response_envelope:
  success: "{ \"meta\": { \"api_request_id\": \"req_xxx\", \"api_request_timestamp\": \"ISO8601\" },\n  \"response_type\"\
    : \"object\" | \"array\", \"data\": {} }\n"
  error: "{ \"meta\": { ... }, \"response_type\": \"error\",\n  \"data\": { \"error_id\": \"ERR_XXX\", \"message\": \"...\"\
    \ } }\n"
  pagination_fields:
  - limit
  - offset
  - total_count
  - has_more
  pagination_defaults:
    limit: 10
    min: 1
    max: 100
    offset: 0
endpoints:
- method: POST
  path: /driver-exchange/_clock/set_current_utc
  description: Set the logical clock. Startup default (before any set call) is exactly 2026-09-01T00:00:00Z and MUST NOT fall
    back to wall-clock time; all deadlines, windows, and derived disqualification statuses read this clock.
  roles:
  - AssociationAdmin
  code: 200
  input:
  - to_iso8601
  output: null
  side_effects:
  - Logical clock advanced; Disqualification derived statuses re-evaluate lazily on next read
- method: POST
  path: /driver-exchange/jurisdictions
  description: Register a member jurisdiction (starts APPLIED)
  roles:
  - AssociationAdmin
  code: 201
  input:
  - code
  - name
  - fee_tier
  output: Jurisdiction
  side_effects:
  - membership_status = APPLIED; timeliness_score_bp = 10000; certified_systems_count = 0
  - code uniqueness enforced (ERR_JURISDICTION_CODE_TAKEN)
- method: GET
  path: /driver-exchange/jurisdictions/{id}
  description: Get a jurisdiction
  roles:
  - AssociationAdmin
  - JurisdictionRegistrar
  - CertificationEngineer
  - FederalVerifier
  - AuditAuthority
  code: 200
  input: []
  output: Jurisdiction
  side_effects: []
- method: PATCH
  path: /driver-exchange/jurisdictions/{id}
  description: 'Membership status transitions: APPLIED->ACTIVE (requires a CERTIFIED POINTER_NETWORK participation), ACTIVE->SUSPENDED
    (cascade), SUSPENDED->ACTIVE (participation restoration), ACTIVE|SUSPENDED->WITHDRAWN'
  roles:
  - AssociationAdmin
  code: 200
  input:
  - status
  output: Jurisdiction
  side_effects:
  - Membership state machine transition per §1.2 (incl. suspend/re-activate cascades)
  - increments Jurisdiction.version by 1
- method: GET
  path: /driver-exchange/jurisdictions/{id}/system-participations
  description: List a jurisdiction's system participations. Results are ordered by created_at ascending (stable, deterministic).
  roles:
  - AssociationAdmin
  - JurisdictionRegistrar
  - CertificationEngineer
  - FederalVerifier
  - AuditAuthority
  code: 200
  input:
  - limit?
  - offset?
  output: SystemParticipation[]
  side_effects: []
- method: GET
  path: /driver-exchange/jurisdictions/{id}/fee-invoices
  description: List a jurisdiction's fee invoices. Results are ordered by created_at ascending (stable, deterministic).
  roles:
  - AssociationAdmin
  - JurisdictionRegistrar
  - CertificationEngineer
  - FederalVerifier
  - AuditAuthority
  code: 200
  input:
  - limit?
  - offset?
  output: FeeInvoice[]
  side_effects: []
- method: GET
  path: /driver-exchange/jurisdictions/{id}/vehicle-titles
  description: List vehicle titles held by a jurisdiction. Results are ordered by created_at ascending (stable, deterministic).
  roles:
  - AssociationAdmin
  - JurisdictionRegistrar
  - CertificationEngineer
  - FederalVerifier
  - AuditAuthority
  code: 200
  input:
  - limit?
  - offset?
  output: VehicleTitle[]
  side_effects: []
- method: POST
  path: /driver-exchange/system-participations
  description: Enroll the caller's jurisdiction in an interstate system (starts ENROLLING). Jurisdiction must be APPLIED or
    ACTIVE (ERR_INVALID_STATE otherwise); unique (jurisdiction_id, system)
  roles:
  - JurisdictionRegistrar
  code: 201
  input:
  - jurisdiction_id
  - system
  output: SystemParticipation
  side_effects:
  - status = ENROLLING
  - jurisdiction_id must equal the registrar's X-User-ID (ERR_JURISDICTION_OWNERSHIP_MISMATCH)
- method: POST
  path: /driver-exchange/system-participations/{id}/grant-certification
  description: 'Grant CERTIFIED status after the latest certification PASSED (segregation: the engineer who ran the test cannot
    grant)'
  roles:
  - AssociationAdmin
  code: 200
  input: []
  output: SystemParticipation
  side_effects:
  - status -> CERTIFIED; granted_at set; jurisdiction.certified_systems_count recomputed
- method: POST
  path: /driver-exchange/connection-certifications
  description: 'Schedule a certification test window for a participation (participation ENROLLING -> TESTING). Windows of
    one participation''s SCHEDULED certifications use half-open [start, end) semantics: adjacency (new start == existing end)
    is allowed, any positive overlap is rejected'
  roles:
  - CertificationEngineer
  code: 201
  input:
  - participation_id
  - window_start
  - window_end
  output: ConnectionCertification
  side_effects:
  - status = SCHEDULED
  - Parent participation ENROLLING -> TESTING
- method: GET
  path: /driver-exchange/connection-certifications/{id}
  description: Get a certification
  roles:
  - AssociationAdmin
  - JurisdictionRegistrar
  - CertificationEngineer
  - FederalVerifier
  - AuditAuthority
  code: 200
  input: []
  output: ConnectionCertification
  side_effects: []
- method: GET
  path: /driver-exchange/connection-certifications
  description: List certifications, optionally filtered by participation. Results are ordered by created_at ascending (stable,
    deterministic).
  roles:
  - AssociationAdmin
  - JurisdictionRegistrar
  - CertificationEngineer
  - FederalVerifier
  - AuditAuthority
  code: 200
  input:
  - participation_id?
  - limit?
  - offset?
  output: ConnectionCertification[]
  side_effects: []
- method: POST
  path: /driver-exchange/connection-certifications/{id}/complete
  description: Record the certification result; only valid while the logical clock is inside [window_start, window_end)
  roles:
  - CertificationEngineer
  code: 200
  input:
  - result
  - score?
  output: ConnectionCertification
  side_effects:
  - status -> PASSED | FAILED; score and completed_at recorded
- method: POST
  path: /driver-exchange/drivers
  description: Register a driver identity (shared across jurisdictions). The registrar's own jurisdiction (X-User-ID) must
    exist (ERR_JURISDICTION_NOT_FOUND)
  roles:
  - JurisdictionRegistrar
  code: 201
  input:
  - full_name
  - date_of_birth
  - ssn_last4_hash
  - lawful_status_basis
  output: DriverIdentity
  side_effects: []
- method: GET
  path: /driver-exchange/drivers/{id}
  description: Get a driver (clients read DriverIdentity.version here before OCC-guarded writes)
  roles:
  - AssociationAdmin
  - JurisdictionRegistrar
  - CertificationEngineer
  - FederalVerifier
  - AuditAuthority
  code: 200
  input: []
  output: DriverIdentity
  side_effects: []
- method: POST
  path: /driver-exchange/driver-records
  description: Claim the master driver record (pointer) for a driver into the caller's jurisdiction. Caller's jurisdiction
    must be ACTIVE with a CERTIFIED POINTER_NETWORK participation. At most one ACTIVE record per driver.
  roles:
  - JurisdictionRegistrar
  code: 201
  input:
  - driver_id
  - expected_driver_version
  output: DriverRecord
  side_effects:
  - status = ACTIVE; holding_jurisdiction_id = caller's jurisdiction; points_total = 0; abstract_points_total = 0
  - increments DriverIdentity.version by 1
- method: GET
  path: /driver-exchange/driver-records/{id}
  description: Get a driver record
  roles:
  - AssociationAdmin
  - JurisdictionRegistrar
  - CertificationEngineer
  - FederalVerifier
  - AuditAuthority
  code: 200
  input: []
  output: DriverRecord
  side_effects: []
- method: GET
  path: /driver-exchange/driver-records
  description: List driver records, filterable by driver and/or holding jurisdiction. Results are ordered by created_at ascending
    (stable, deterministic).
  roles:
  - AssociationAdmin
  - JurisdictionRegistrar
  - CertificationEngineer
  - FederalVerifier
  - AuditAuthority
  code: 200
  input:
  - driver_id?
  - holding_jurisdiction_id?
  - limit?
  - offset?
  output: DriverRecord[]
  side_effects: []
- method: GET
  path: /driver-exchange/driver-records/{id}/convictions
  description: List convictions posted on a record. Results are ordered by created_at ascending (stable, deterministic).
  roles:
  - AssociationAdmin
  - JurisdictionRegistrar
  - CertificationEngineer
  - FederalVerifier
  - AuditAuthority
  code: 200
  input:
  - limit?
  - offset?
  output: Conviction[]
  side_effects: []
- method: GET
  path: /driver-exchange/driver-records/{id}/disqualifications
  description: List disqualifications on a record (derived statuses evaluated at read). Results are ordered by created_at
    ascending (stable, deterministic).
  roles:
  - AssociationAdmin
  - JurisdictionRegistrar
  - CertificationEngineer
  - FederalVerifier
  - AuditAuthority
  code: 200
  input:
  - limit?
  - offset?
  output: Disqualification[]
  side_effects: []
- method: POST
  path: /driver-exchange/convictions
  description: Post a conviction to a record held by the caller's jurisdiction. Holding jurisdiction must be ACTIVE with a
    CERTIFIED COMMERCIAL_DRIVER_NETWORK participation. Late postings (posted date - conviction_date > 30 days) are ACCEPTED
    but flagged is_late and depress the jurisdiction's timeliness_score_bp.
  roles:
  - JurisdictionRegistrar
  code: 201
  input:
  - record_id
  - offense_date
  - conviction_date
  - severity
  - points
  output: Conviction
  side_effects:
  - posted_at = logical clock; is_late computed
  - driver_points_total recomputed (both variants) on the record
  - 'disqualification_duration evaluated: CMV_MAJOR or points_total >= 12 may create/merge a Disqualification'
  - A created Disqualification suspends the driver's ACTIVE COMMERCIAL Licenses on this record
  - holding jurisdiction timeliness_score_bp recomputed
- method: POST
  path: /driver-exchange/disqualifications
  description: Manually record a judicial disqualification with explicit closed-interval dates; overlaps with a derived-ACTIVE
    disqualification on the same record are rejected (shared boundary days collide — closed semantics, unlike certification
    windows)
  roles:
  - AuditAuthority
  code: 201
  input:
  - record_id
  - start_date
  - end_date
  output: Disqualification
  side_effects:
  - basis = MANUAL_JUDICIAL
  - Suspends the driver's ACTIVE COMMERCIAL Licenses on this record (same cascade link 3 as auto creation)
- method: POST
  path: /driver-exchange/disqualifications/{id}/overturn
  description: Overturn a derived-ACTIVE disqualification
  roles:
  - AuditAuthority
  code: 200
  input: []
  output: Disqualification
  side_effects:
  - overturned_at set; derived status becomes OVERTURNED
- method: POST
  path: /driver-exchange/licenses
  description: Issue a license (starts PENDING_VERIFICATION). Requires an ACTIVE DriverRecord held by the caller's ACTIVE,
    POINTER_NETWORK-certified jurisdiction; COMMERCIAL class additionally requires no derived-ACTIVE Disqualification on that
    record.
  roles:
  - JurisdictionRegistrar
  code: 201
  input:
  - driver_id
  - license_class
  output: License
  side_effects:
  - status = PENDING_VERIFICATION; ssn_check_status = PENDING; lawful_status_check_status = PENDING
  - record_id bound to the driver's ACTIVE record held by the caller's jurisdiction (ERR_RECORD_NOT_FOUND if none; ERR_RECORD_HELD_BY_OTHER_JURISDICTION
    if the ACTIVE record is held elsewhere)
- method: GET
  path: /driver-exchange/licenses/{id}
  description: Get a license
  roles:
  - AssociationAdmin
  - JurisdictionRegistrar
  - CertificationEngineer
  - FederalVerifier
  - AuditAuthority
  code: 200
  input: []
  output: License
  side_effects: []
- method: GET
  path: /driver-exchange/licenses
  description: List licenses, filterable by driver, issuing jurisdiction, or backing record. Results are ordered by created_at
    ascending (stable, deterministic).
  roles:
  - AssociationAdmin
  - JurisdictionRegistrar
  - CertificationEngineer
  - FederalVerifier
  - AuditAuthority
  code: 200
  input:
  - driver_id?
  - issuing_jurisdiction_id?
  - record_id?
  - limit?
  - offset?
  output: License[]
  side_effects: []
- method: POST
  path: /driver-exchange/licenses/{id}/verification-results
  description: 'Verification service callback: post the SSN or LAWFUL_STATUS result for a PENDING_VERIFICATION license. Both
    VERIFIED -> ACTIVE (system); any FAILED -> DENIED (system). Posting to a license no longer PENDING_VERIFICATION, or re-posting
    a dimension already decided, is ERR_INVALID_STATE.'
  roles:
  - FederalVerifier
  code: 200
  input:
  - check_type
  - result
  output: License
  side_effects:
  - check_type dimension set to result; license auto-transitions per §1.2
- method: POST
  path: /driver-exchange/licenses/{id}/reinstate
  description: Reinstate a SUSPENDED license once no derived-ACTIVE Disqualification remains on the backing record
  roles:
  - JurisdictionRegistrar
  code: 200
  input: []
  output: License
  side_effects:
  - status SUSPENDED -> ACTIVE
- method: POST
  path: /driver-exchange/license-transfers
  description: Initiate a license transfer into the caller's jurisdiction. Prior license must be ACTIVE; its issuing jurisdiction
    becomes from_jurisdiction. Caller jurisdiction must be ACTIVE with CERTIFIED POINTER_NETWORK participation; no other in-flight
    (INITIATED, SURRENDER_RECORDED, CONTESTED) transfer may exist for the driver.
  roles:
  - JurisdictionRegistrar
  code: 201
  input:
  - driver_id
  - prior_license_id
  - expected_driver_version
  output: LicenseTransfer
  side_effects:
  - status = INITIATED; from_jurisdiction_id derived from the prior license
  - increments DriverIdentity.version by 1
- method: GET
  path: /driver-exchange/license-transfers/{id}
  description: Get a license transfer
  roles:
  - AssociationAdmin
  - JurisdictionRegistrar
  - CertificationEngineer
  - FederalVerifier
  - AuditAuthority
  code: 200
  input: []
  output: LicenseTransfer
  side_effects: []
- method: GET
  path: /driver-exchange/license-transfers
  description: List license transfers, filterable by any of the transfer's foreign keys. Results are ordered by created_at
    ascending (stable, deterministic).
  roles:
  - AssociationAdmin
  - JurisdictionRegistrar
  - CertificationEngineer
  - FederalVerifier
  - AuditAuthority
  code: 200
  input:
  - driver_id?
  - from_jurisdiction_id?
  - to_jurisdiction_id?
  - prior_license_id?
  - new_license_id?
  - limit?
  - offset?
  output: LicenseTransfer[]
  side_effects: []
- method: POST
  path: /driver-exchange/license-transfers/{id}/record-surrender
  description: From-jurisdiction registrar records surrender of the prior license (INITIATED or CONTESTED -> SURRENDER_RECORDED)
  roles:
  - JurisdictionRegistrar
  code: 200
  input: []
  output: LicenseTransfer
  side_effects:
  - prior License ACTIVE -> SURRENDERED; contest_reason cleared
- method: POST
  path: /driver-exchange/license-transfers/{id}/contest
  description: To-jurisdiction registrar contests a recorded surrender (SURRENDER_RECORDED -> CONTESTED); the prior license
    is restored to ACTIVE while disputed
  roles:
  - JurisdictionRegistrar
  code: 200
  input:
  - reason
  output: LicenseTransfer
  side_effects:
  - contest_reason set; prior License SURRENDERED -> ACTIVE (compensation)
- method: POST
  path: /driver-exchange/license-transfers/{id}/complete
  description: 'Complete the transfer: old record retires, new ACTIVE record and PENDING_VERIFICATION license are created
    in the receiving jurisdiction (one-driver-one-record invariant preserved)'
  roles:
  - JurisdictionRegistrar
  code: 200
  input: []
  output: LicenseTransfer
  side_effects:
  - Full completion cascade per §1.2 (record move, new record, new license, new_license_id set)
- method: POST
  path: /driver-exchange/vehicle-titles
  description: Title a vehicle in the caller's jurisdiction. Caller jurisdiction must be ACTIVE with a CERTIFIED TITLE_NETWORK
    participation. One ACTIVE title per VIN.
  roles:
  - JurisdictionRegistrar
  code: 201
  input:
  - vin
  - brands?
  output: VehicleTitle
  side_effects:
  - status = ACTIVE; brands default []; washing_alert = false
- method: POST
  path: /driver-exchange/title-transfers
  description: 'Request re-titling of an out-of-state vehicle into the caller''s TITLE_NETWORK-certified jurisdiction. Runs
    the brand-washing check synchronously: disclosed_brands must be a superset of the source title''s brands, else ERR_BRAND_DISCLOSURE_MISMATCH
    and the source title''s washing_alert is set.'
  roles:
  - JurisdictionRegistrar
  code: 201
  input:
  - vehicle_title_id
  - disclosed_brands
  output: TitleTransfer
  side_effects:
  - 'On success: status = VERIFIED; carried_brands = sorted union of source brands and disclosed brands'
- method: GET
  path: /driver-exchange/title-transfers/{id}
  description: Get a title transfer
  roles:
  - AssociationAdmin
  - JurisdictionRegistrar
  - CertificationEngineer
  - FederalVerifier
  - AuditAuthority
  code: 200
  input: []
  output: TitleTransfer
  side_effects: []
- method: GET
  path: /driver-exchange/title-transfers
  description: List title transfers, filterable by source title or receiving jurisdiction. Results are ordered by created_at
    ascending (stable, deterministic).
  roles:
  - AssociationAdmin
  - JurisdictionRegistrar
  - CertificationEngineer
  - FederalVerifier
  - AuditAuthority
  code: 200
  input:
  - vehicle_title_id?
  - to_jurisdiction_id?
  - limit?
  - offset?
  output: TitleTransfer[]
  side_effects: []
- method: POST
  path: /driver-exchange/title-transfers/{id}/complete
  description: 'Complete the re-titling: source title EXPORTED, new ACTIVE title created in the receiving jurisdiction carrying
    carried_brands'
  roles:
  - JurisdictionRegistrar
  code: 200
  input: []
  output: TitleTransfer
  side_effects:
  - Source title EXPORTED; new title created (brands = carried_brands, washing_alert = false); new_title_id set
- method: POST
  path: /driver-exchange/fee-invoices
  description: Issue annual dues invoice (created ISSUED). Jurisdiction must be ACTIVE. Provisional amount per annual_dues_assessment
    with certified_count_at_issue pinned now.
  roles:
  - AssociationAdmin
  code: 201
  input:
  - jurisdiction_id
  - fiscal_year
  - projected_volume
  output: FeeInvoice
  side_effects:
  - status = ISSUED; certified_count_at_issue pinned; provisional_amount_cents computed
- method: POST
  path: /driver-exchange/fee-invoices/{id}/dispute
  description: Invoiced jurisdiction's registrar disputes the assessment (ISSUED -> DISPUTED)
  roles:
  - JurisdictionRegistrar
  code: 200
  input:
  - reason
  output: FeeInvoice
  side_effects:
  - status -> DISPUTED; dispute_reason recorded
- method: POST
  path: /driver-exchange/fee-invoices/{id}/reissue
  description: Re-issue a disputed invoice with a corrected projected volume (DISPUTED -> ISSUED); recomputes with the ORIGINAL
    pinned certified_count_at_issue
  roles:
  - AssociationAdmin
  code: 200
  input:
  - projected_volume
  output: FeeInvoice
  side_effects:
  - provisional_amount_cents recomputed; dispute_reason cleared
- method: POST
  path: /driver-exchange/fee-invoices/{id}/settle
  description: Pay the invoice (ISSUED -> SETTLED); amount must equal provisional_amount_cents exactly
  roles:
  - JurisdictionRegistrar
  code: 200
  input:
  - amount_cents
  output: FeeInvoice
  side_effects:
  - status -> SETTLED; settled_amount_cents recorded
- method: POST
  path: /driver-exchange/fee-invoices/{id}/finalize-audit
  description: Audit the settled invoice against actual quarterly volumes (SETTLED -> AUDITED); computes final_amount_cents
    (per-quarter rounding, current multiplier) and adjustment_amount_cents
  roles:
  - AuditAuthority
  code: 200
  input:
  - actual_volume_quarters
  output: FeeInvoice
  side_effects:
  - status -> AUDITED; actual_volume_quarters, final_amount_cents, adjustment_amount_cents recorded
errors:
- id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
  http: 400
  condition: X-User-ID or X-User-Role header missing or malformed
- id: ERR_INSUFFICIENT_PERMISSIONS
  http: 403
  condition: Role is not in the endpoint's declared roles
- id: ERR_JURISDICTION_OWNERSHIP_MISMATCH
  http: 403
  condition: JurisdictionRegistrar's X-User-ID does not match the jurisdiction that owns (or will own) the resource
- id: ERR_INVALID_REQUEST
  http: 400
  condition: Missing required field, invalid enum member, malformed date/datetime, or constraint violation on field shape
    (e.g., points outside 1..6, negative volumes, actual_volume_quarters not exactly 4 entries)
- id: ERR_STALE_VERSION
  http: 412
  condition: expected_driver_version does not equal the DriverIdentity's current version (§1.2.1)
- id: ERR_JURISDICTION_NOT_FOUND
  http: 404
  condition: No jurisdiction with the given id
- id: ERR_PARTICIPATION_NOT_FOUND
  http: 404
  condition: No system participation with the given id
- id: ERR_CERTIFICATION_NOT_FOUND
  http: 404
  condition: No connection certification with the given id
- id: ERR_DRIVER_NOT_FOUND
  http: 404
  condition: No driver with the given id
- id: ERR_RECORD_NOT_FOUND
  http: 404
  condition: No driver record with the given id; also at license issuance when the driver has no ACTIVE record held by the
    caller's jurisdiction
- id: ERR_LICENSE_NOT_FOUND
  http: 404
  condition: No license with the given id
- id: ERR_TRANSFER_NOT_FOUND
  http: 404
  condition: No license transfer with the given id
- id: ERR_DISQUALIFICATION_NOT_FOUND
  http: 404
  condition: No disqualification with the given id
- id: ERR_TITLE_NOT_FOUND
  http: 404
  condition: No vehicle title with the given id
- id: ERR_TITLE_TRANSFER_NOT_FOUND
  http: 404
  condition: No title transfer with the given id
- id: ERR_INVOICE_NOT_FOUND
  http: 404
  condition: No fee invoice with the given id
- id: ERR_JURISDICTION_NOT_ACTIVE
  http: 409
  condition: Operation requires the acting (or parent) jurisdiction to be ACTIVE — record claims, license issuance, transfers,
    titles, convictions; also grant-certification while the jurisdiction is SUSPENDED or WITHDRAWN
- id: ERR_INVALID_STATE
  http: 409
  condition: Target resource is not in a state from which the requested transition is declared (generic machine arc violation;
    also participation enrollment while SUSPENDED/WITHDRAWN, verification-results on a decided license, overturn of a non-ACTIVE
    disqualification)
- id: ERR_PARTICIPATION_NOT_CERTIFIED
  http: 409
  condition: Operation requires the acting jurisdiction to hold a CERTIFIED participation in the relevant system (POINTER_NETWORK
    for records/licenses/transfers, TITLE_NETWORK for title operations); also jurisdiction activation without a CERTIFIED
    POINTER_NETWORK participation
- id: ERR_RECORD_NOT_ACTIVE
  http: 409
  condition: Conviction posting requires the record status == ACTIVE (TRANSFERRED_OUT records are immutable)
- id: ERR_LICENSE_NOT_ACTIVE
  http: 409
  condition: Transfer initiation requires the prior license status == ACTIVE
- id: ERR_GRANT_REQUIRES_PASSED_CERTIFICATION
  http: 409
  condition: grant-certification requires the participation's latest completed certification (max window_start, tie-break
    latest created_at) to be PASSED
- id: ERR_ACTIVE_DISQUALIFICATION
  http: 409
  condition: COMMERCIAL issuance, reinstatement, or transfer completion while a Disqualification on the driver's record has
    derived status ACTIVE
- id: ERR_BRAND_DISCLOSURE_MISMATCH
  http: 409
  condition: disclosed_brands is not a superset of the source title's brands (branded-title washing attempt); the source title's
    washing_alert is set
- id: ERR_RECORD_ALREADY_HELD
  http: 409
  condition: 'One-driver-one-record: the driver already has an ACTIVE DriverRecord (in any jurisdiction)'
- id: ERR_RECORD_HELD_BY_OTHER_JURISDICTION
  http: 409
  condition: 'License issuance blocked: the driver''s ACTIVE record is held by a different jurisdiction — use the license
    transfer flow'
- id: ERR_TRANSFER_ALREADY_IN_FLIGHT
  http: 409
  condition: The driver already has a LicenseTransfer in INITIATED, SURRENDER_RECORDED, or CONTESTED
- id: ERR_VIN_ALREADY_TITLED
  http: 409
  condition: An ACTIVE VehicleTitle with this VIN already exists
- id: ERR_PARTICIPATION_ALREADY_EXISTS
  http: 409
  condition: A participation for this (jurisdiction_id, system) pair already exists
- id: ERR_JURISDICTION_CODE_TAKEN
  http: 409
  condition: A jurisdiction with this code already exists
- id: ERR_INVALID_WINDOW
  http: 400
  condition: Certification window_end must be strictly after window_start
- id: ERR_CERT_WINDOW_OVERLAP
  http: 409
  condition: The participation already has a SCHEDULED certification whose half-open [window_start, window_end) interval intersects
    the requested one (adjacency — new start == existing end — is allowed)
- id: ERR_OUTSIDE_TEST_WINDOW
  http: 422
  condition: Certification completion attempted while the logical clock is outside [window_start, window_end)
- id: ERR_DISQUALIFICATION_OVERLAP
  http: 409
  condition: Manual disqualification closed interval [start_date, end_date] intersects an existing derived-ACTIVE disqualification
    on the record (shared boundary days collide)
- id: ERR_SAME_JURISDICTION_TRANSFER
  http: 422
  condition: Title transfer target jurisdiction equals the source title's holding jurisdiction
- id: ERR_FEE_AMOUNT_MISMATCH
  http: 402
  condition: settle amount_cents does not equal provisional_amount_cents exactly
roles:
- name: AssociationAdmin
  description: 'Association staff: membership lifecycle, certification grants, fee issuance, logical clock'
  identity: opaque
  exclusive_operations:
  - POST /driver-exchange/jurisdictions — register jurisdiction
  - PATCH /driver-exchange/jurisdictions/{id} — membership status transitions
  - POST /driver-exchange/system-participations/{id}/grant-certification — grant CERTIFIED (never the engineer who ran the
    test)
  - POST /driver-exchange/fee-invoices — issue annual dues
  - POST /driver-exchange/fee-invoices/{id}/reissue — reissue disputed invoice
  - POST /driver-exchange/_clock/set_current_utc — set logical clock
  shared_operations:
  - All GET endpoints
- name: JurisdictionRegistrar
  description: A member jurisdiction's DMV operator; X-User-ID equals the Jurisdiction id it acts for
  identity: entity_backed:Jurisdiction
  exclusive_operations:
  - POST /driver-exchange/system-participations — enroll own jurisdiction
  - POST /driver-exchange/drivers — register driver identity
  - POST /driver-exchange/driver-records — claim the master record pointer
  - POST /driver-exchange/convictions — post convictions to records held by own jurisdiction
  - POST /driver-exchange/licenses — issue licenses
  - POST /driver-exchange/licenses/{id}/reinstate — reinstate own licenses
  - POST /driver-exchange/license-transfers — initiate transfer into own jurisdiction
  - POST /driver-exchange/license-transfers/{id}/record-surrender — as from_jurisdiction
  - POST /driver-exchange/license-transfers/{id}/contest — as to_jurisdiction
  - POST /driver-exchange/license-transfers/{id}/complete — as to_jurisdiction
  - POST /driver-exchange/vehicle-titles — title vehicles in own jurisdiction
  - POST /driver-exchange/title-transfers and .../complete — re-title into own jurisdiction
  - POST /driver-exchange/fee-invoices/{id}/dispute and .../settle — own invoices only
  shared_operations:
  - All GET endpoints
- name: CertificationEngineer
  description: Runs connection test suites for jurisdiction onboarding; may not grant certification (segregation of duties
    with AssociationAdmin)
  identity: opaque
  exclusive_operations:
  - POST /driver-exchange/connection-certifications — schedule a test window
  - POST /driver-exchange/connection-certifications/{id}/complete — record PASSED/FAILED
  shared_operations:
  - All GET endpoints
- name: FederalVerifier
  description: Operates the SSN and lawful-status verification services used at license issuance
  identity: opaque
  exclusive_operations:
  - POST /driver-exchange/licenses/{id}/verification-results — post verification outcomes
  shared_operations:
  - All GET endpoints
- name: AuditAuthority
  description: 'Independent auditor: judicial disqualifications and dues audits; may not issue invoices (segregation of duties
    with AssociationAdmin)'
  identity: opaque
  exclusive_operations:
  - POST /driver-exchange/disqualifications — record a judicial disqualification
  - POST /driver-exchange/disqualifications/{id}/overturn — overturn
  - POST /driver-exchange/fee-invoices/{id}/finalize-audit — audit a settled invoice
  shared_operations:
  - All GET endpoints
