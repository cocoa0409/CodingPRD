      - name: corner_carved_out_component_without_subservice_organization_rejected
        claim_type: conditional_validation
        grounds: ["validations[priority=210]", "errors[ERR_BOUNDARY_SCOPE_MISMATCH]", "entities.BoundaryComponent.fields.scope_status"]
        distinguishing_aspect: "scope_status CARVED_OUT demands a non-null subservice_organization_id; omitting it returns 422 ERR_BOUNDARY_SCOPE_MISMATCH, and supplying an exclusion_rationale alongside IN_SCOPE is rejected by the same rule."
        test_recipe:
