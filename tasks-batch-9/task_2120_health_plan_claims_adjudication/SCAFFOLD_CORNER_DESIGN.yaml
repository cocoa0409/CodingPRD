              payload: { npi: "3000000009", name: "VAL9 Clinic", network_status: "IN_NETWORK" }
              as: PlanAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /adjudication/benefit-plans/${plan_id}/fee-schedule-rates"
              payload: { procedure_code: "73721", allowed_amount_cents: 40000, effective_date: "2026-01-01" }
              as: NetworkManager
            - call: "POST /adjudication/members"
              payload: { member_number: "M-VAL-9", plan_id: "${plan_id}" }
              as: PlanAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /adjudication/members/${mem_id}/coverages"
              payload: { effective_date: "2026-01-01", cob_order: "PRIMARY" }
              as: PlanAdmin
          trigger:
            - call: "POST /adjudication/claims"
              payload: { claim_number: "CLM-VAL-9", member_id: "${mem_id}", provider_id: "${prov_id}", other_payer_paid_cents: 999999, lines: [{ line_number: 1, procedure_code: "73721", units: 1, billed_amount_cents: 60000, service_date: "2026-02-10" }] }
              as: ClaimsIntake
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_OTHER_PAYER_EXCEEDS_BILLED"
            - "HTTP status is 422"
            - "GET /adjudication/claims?member_id=${mem_id} returns total_count == 0"

      - name: reusing_a_claim_number_returns_duplicate_claim_number
        claim_type: violation_to_error
