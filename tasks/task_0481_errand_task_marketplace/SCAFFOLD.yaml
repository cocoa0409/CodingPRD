# =============================================================================
# Errand & Task Marketplace (TaskRabbit style) — Scaffold Seed Tables
# §1.0–§1.7 only. The difficulty-design and corner-design indexes live in their
# own sibling files and never appear as keys in this file.
# =============================================================================

scenario: |
  Errand & Task Marketplace (TaskRabbit style): tasker skill & vetting, task
  category & hourly/fixed quote, same-day dispatch & scheduling, in-app chat &
  reschedule, service fee & tip, cancellation & trust/safety, recurring task,
  rating & rebooking.

domain_name: errand-task-marketplace
api_prefix: /

# -----------------------------------------------------------------------------
# Complexity profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  complexity_layers:
    - scheduled_deferred_actions      # logical clock; same-day gating; reschedule windows
    - cascading_side_effects          # cancel/dispatch/series cascades across Booking↔Tasker↔Settlement
    - dual_variant_calculation        # estimate quote vs final settlement; chronic vs acute trust
    - optimistic_concurrency          # OCC on Tasker.version when claiming a dispatch offer
    - rate_threshold_triggers         # cancellation-fee tiers; trust-gate breakpoints

  entity_topology: flat
  # Peer top-level entities (Client, Tasker, TaskCategory, Booking, RecurringSeries)
  # linked by foreign keys; child satellites (Skill, AvailabilityWindow, ChatMessage,
  # Settlement, Cancellation, Review, TrustIncident) reference parents by FK, not by URL nesting.

  state_machine_shape: cyclic
  # Booking carries a reschedule cycle (SCHEDULED -> RESCHEDULE_PROPOSED -> SCHEDULED);
  # Tasker carries a parallel non-linear gate (ACTIVE <-> RESTRICTED <-> SUSPENDED) driven
  # by a derived trust_score; Review has a moderation revert loop.

  relationship_patterns:
    - one_to_many        # Client 1:N Booking, Tasker 1:N Booking, RecurringSeries 1:N Booking
    - many_to_many       # Tasker <-> TaskCategory via TaskerSkill junction
    - cross_aggregate    # Booking references Tasker, Client, TaskCategory across aggregates

  role_model: peer_roles
  # Client owns its bookings/chat/reviews; Tasker owns its skills/availability/incidents-as-subject;
  # Dispatcher (opaque operator) drives dispatch & manual overrides; TrustSafetyOfficer (opaque)
  # files incidents and moderates reviews. Each role owns a distinct resource surface.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # ---------------------------------------------------------------------------
  - name: TaskCategory
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only" }
      - { name: name, type: string, source: input, description: "Category display name (e.g. 'Furniture Assembly')" }
      - { name: pricing_model, type: enum, source: input, description: "HOURLY | FIXED — which quote algorithm applies", constraints: "HOURLY | FIXED" }
      - { name: default_hourly_rate_cents, type: integer, source: input, description: "Default tasker rate when HOURLY; >=1000", constraints: ">= 1000; required when pricing_model=HOURLY" }
      - { name: fixed_price_cents, type: integer, source: input, description: "Flat price when FIXED; >=1000", constraints: ">= 1000; required when pricing_model=FIXED" }
      - { name: default_duration_minutes, type: integer, source: input, description: "Scheduled window length for FIXED bookings, in minutes; >=15", constraints: ">= 15" }
      - { name: requires_vetting, type: boolean, source: input, default: false, description: "If true, a tasker's TaskerSkill must be VETTED before claiming bookings in this category" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED", constraints: "ACTIVE | RETIRED" }

  # ---------------------------------------------------------------------------
  - name: Tasker
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only" }
      - { name: full_name, type: string, source: input, description: "Tasker legal name" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Tasker's personal hourly rate for HOURLY categories; >=1000", constraints: ">= 1000" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RESTRICTED | SUSPENDED — derived gate from trust_score (see calc trust_gate)", constraints: "ACTIVE | RESTRICTED | SUSPENDED" }
      - { name: trust_score, type: integer, source: computed, description: "0..100; starts 100, reduced by TrustIncident penalties; floored at 0 (see calc trust_score)" }
      - { name: incident_penalty_total, type: integer, source: computed, description: "Sum of severity penalties across this tasker's OPEN/UPHELD TrustIncidents" }
      - { name: active_booking_count, type: integer, source: computed, description: "Count of this tasker's Bookings in {CLAIMED, EN_ROUTE, IN_PROGRESS}" }
      - { name: completed_booking_count, type: integer, source: computed, description: "Count of this tasker's Bookings in COMPLETED" }
      - { name: rating_count, type: integer, source: computed, description: "Count of PUBLISHED Reviews for this tasker" }
      - { name: avg_rating, type: number, source: computed, description: "Mean rating_value over PUBLISHED Reviews, 2 dp round_half_up; 0.0 when rating_count=0 (see calc avg_rating)" }

  # ---------------------------------------------------------------------------
  - name: TaskerSkill
    parent: Tasker
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only" }
      - { name: tasker_id, type: string, source: input, description: "FK -> Tasker.id; the tasker holding this skill" }
      - { name: category_id, type: string, source: input, description: "FK -> TaskCategory.id; the category this skill covers" }
      - { name: vetting_status, type: enum, source: system, description: "PENDING | VETTED | REJECTED — vetting lifecycle", constraints: "PENDING | VETTED | REJECTED" }

  # ---------------------------------------------------------------------------
  - name: AvailabilityWindow
    parent: Tasker
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only" }
      - { name: tasker_id, type: string, source: input, description: "FK -> Tasker.id; window owner" }
      - { name: window_start, type: datetime, source: input, description: "Inclusive window start (ISO 8601 UTC)" }
      - { name: window_end, type: datetime, source: input, description: "Inclusive window end (ISO 8601 UTC); must be > window_start" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED — CLOSED windows no longer admit bookings", constraints: "OPEN | CLOSED" }

  # ---------------------------------------------------------------------------
  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only" }
      - { name: full_name, type: string, source: input, description: "Client name" }
      - { name: wallet_credit_cents, type: integer, source: computed, description: "Refundable credit balance held for this client; never negative; starts 0" }

  # ---------------------------------------------------------------------------
  - name: RecurringSeries
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only" }
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; series owner" }
      - { name: category_id, type: string, source: input, description: "FK -> TaskCategory.id; category for every occurrence" }
      - { name: tasker_id, type: string, source: input, description: "FK -> Tasker.id; preferred tasker for every occurrence" }
      - { name: frequency, type: enum, source: input, description: "WEEKLY | BIWEEKLY — spacing between occurrences", constraints: "WEEKLY | BIWEEKLY" }
      - { name: first_start, type: datetime, source: input, description: "scheduled_start of occurrence index 0 (ISO 8601 UTC)" }
      - { name: occurrence_count, type: integer, source: input, description: "Number of Bookings to generate; 2..12", constraints: ">= 2 and <= 12" }
      - { name: estimated_hours, type: number, source: input, description: "estimated_hours applied to every HOURLY occurrence; >=0.25", constraints: ">= 0.25; ignored for FIXED categories" }
      - { name: status, type: enum, source: system, description: "ACTIVE | ENDED — ENDED stops future skip/regeneration", constraints: "ACTIVE | ENDED" }
      - { name: generated_count, type: integer, source: computed, description: "Count of Bookings generated under this series" }

  # ---------------------------------------------------------------------------
  - name: Booking
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only" }
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; the requesting client" }
      - { name: category_id, type: string, source: input, description: "FK -> TaskCategory.id; the task category" }
      - { name: tasker_id, type: string, source: input, description: "FK -> Tasker.id; assigned tasker (set at claim; nullable while DRAFT/OFFERED)" }
      - { name: series_id, type: string, source: input, description: "FK -> RecurringSeries.id; null for one-off bookings" }
      - { name: dispatch_mode, type: enum, source: input, description: "SAME_DAY | SCHEDULED — SAME_DAY requires scheduled_start on the current clock's UTC date", constraints: "SAME_DAY | SCHEDULED" }
      - { name: scheduled_start, type: datetime, source: input, description: "Booking window start (ISO 8601 UTC)" }
      - { name: scheduled_end, type: datetime, source: computed, description: "scheduled_start + (estimated_hours*60 if HOURLY else category.default_duration_minutes)" }
      - { name: estimated_hours, type: number, source: input, description: "Estimated labor hours for HOURLY bookings; >=0.25; ignored for FIXED", constraints: ">= 0.25" }
      - { name: actual_hours, type: number, source: input, description: "Actual labor hours reported at completion for HOURLY; >=0; ignored for FIXED", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | OFFERED | CLAIMED | EN_ROUTE | IN_PROGRESS | COMPLETED | CANCELLED | EXPIRED", constraints: "DRAFT | OFFERED | CLAIMED | EN_ROUTE | IN_PROGRESS | COMPLETED | CANCELLED | EXPIRED" }
      - { name: estimated_labor_cents, type: integer, source: computed, description: "Quote labor subtotal at OFFER time (see calc quote_estimate)" }
      - { name: estimated_service_fee_cents, type: integer, source: computed, description: "floor(estimated_labor_cents * SERVICE_FEE_PCT)" }
      - { name: estimated_total_cents, type: integer, source: computed, description: "estimated_labor_cents + estimated_service_fee_cents (excludes tip)" }
      - { name: tip_cents, type: integer, source: input, default: 0, description: "Client tip added at completion; >=0", constraints: ">= 0" }
      - { name: reschedule_count, type: integer, source: computed, description: "Number of accepted reschedules on this booking; capped at MAX_RESCHEDULES" }
      - { name: proposed_start, type: datetime, source: system, description: "Pending reschedule start while status=RESCHEDULE_PROPOSED tracked here; null otherwise" }
      - { name: reschedule_pending, type: boolean, source: computed, description: "True while a reschedule proposal awaits the counterparty's accept/decline" }
      - { name: cancelled_by, type: enum, source: system, description: "CLIENT | TASKER | SYSTEM — set on cancellation; null otherwise", constraints: "CLIENT | TASKER | SYSTEM" }

  # ---------------------------------------------------------------------------
  - name: Settlement
    parent: Booking
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only" }
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; the settled booking (1:1)" }
      - { name: final_labor_cents, type: integer, source: computed, description: "Final labor charge at completion (see calc final_settlement)" }
      - { name: final_service_fee_cents, type: integer, source: computed, description: "floor(final_labor_cents * SERVICE_FEE_PCT)" }
      - { name: tip_cents, type: integer, source: computed, description: "Copied from Booking.tip_cents at settlement" }
      - { name: total_charged_cents, type: integer, source: computed, description: "final_labor_cents + final_service_fee_cents + tip_cents" }
      - { name: tasker_payout_cents, type: integer, source: computed, description: "final_labor_cents + tip_cents (tasker keeps labor + full tip; platform keeps service fee)" }

  # ---------------------------------------------------------------------------
  - name: Cancellation
    parent: Booking
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only" }
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; the cancelled booking (1:1)" }
      - { name: cancelled_by, type: enum, source: input, description: "CLIENT | TASKER — who initiated; SYSTEM cancellations carry no Cancellation row", constraints: "CLIENT | TASKER" }
      - { name: hours_before_start, type: number, source: computed, description: "(scheduled_start - clock_now) in hours at cancel time; may be negative if past start" }
      - { name: fee_tier, type: enum, source: computed, description: "FREE | LATE | LAST_MINUTE — tier from hours_before_start (see calc cancellation_fee)", constraints: "FREE | LATE | LAST_MINUTE" }
      - { name: cancellation_fee_cents, type: integer, source: computed, description: "Fee charged to the cancelling party (see calc cancellation_fee)" }

  # ---------------------------------------------------------------------------
  - name: ChatMessage
    parent: Booking
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only" }
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; the conversation's booking" }
      - { name: sender_role, type: enum, source: system, description: "CLIENT | TASKER — derived from the authenticated caller", constraints: "CLIENT | TASKER" }
      - { name: body, type: string, source: input, description: "Message text; 1..1000 chars", constraints: "len 1..1000" }
      - { name: created_at, type: datetime, source: system, description: "Append-only timestamp; chat ordering key (ASC)" }

  # ---------------------------------------------------------------------------
  - name: Review
    parent: Booking
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only" }
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; reviewed booking (1:1, client->tasker)" }
      - { name: tasker_id, type: string, source: input, description: "FK -> Tasker.id; the tasker being rated" }
      - { name: rating_value, type: integer, source: input, description: "1..5 star rating", constraints: ">= 1 and <= 5" }
      - { name: comment, type: string, source: input, description: "Optional free-text comment; 0..500 chars", constraints: "len 0..500" }
      - { name: status, type: enum, source: system, description: "PUBLISHED | HIDDEN | REMOVED — moderation lifecycle", constraints: "PUBLISHED | HIDDEN | REMOVED" }

  # ---------------------------------------------------------------------------
  - name: TrustIncident
    parent: Tasker
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only" }
      - { name: tasker_id, type: string, source: input, description: "FK -> Tasker.id; the subject tasker" }
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; the booking the incident arose from (nullable for standalone incidents)" }
      - { name: severity, type: enum, source: input, description: "LOW | MEDIUM | HIGH — drives trust penalty", constraints: "LOW | MEDIUM | HIGH" }
      - { name: status, type: enum, source: system, description: "OPEN | UPHELD | DISMISSED — DISMISSED removes the penalty", constraints: "OPEN | UPHELD | DISMISSED" }
      - { name: penalty_points, type: integer, source: computed, description: "LOW=5, MEDIUM=15, HIGH=35 while OPEN/UPHELD; 0 when DISMISSED (see calc trust_score)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------------------
  - entity: Booking
    field: status
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED, EXPIRED]
    transitions:
      - from: DRAFT
        to: OFFERED
        trigger: "POST /bookings/{id}/offer"
        actor: Client
        preconditions:
          - "Booking.category exists and TaskCategory.status == ACTIVE"
          - "If dispatch_mode == SAME_DAY: scheduled_start UTC date == clock_now UTC date"
          - "scheduled_start > clock_now"
        side_effects:
          - "Compute estimated_labor_cents, estimated_service_fee_cents, estimated_total_cents (calc quote_estimate)"
          - "Compute scheduled_end (calc schedule_window)"

      - from: OFFERED
        to: CLAIMED
        trigger: "POST /bookings/{id}/claim (carries tasker_id + expected_tasker_version)"
        actor: Dispatcher
        preconditions:
          - "Target Tasker.status == ACTIVE (RESTRICTED taskers require manual claim only — still allowed via this Dispatcher endpoint; SUSPENDED rejected)"
          - "Tasker has a TaskerSkill for Booking.category_id with vetting_status == VETTED when TaskCategory.requires_vetting == true"
          - "Booking window [scheduled_start, scheduled_end] is contained in some OPEN AvailabilityWindow of the tasker (calc window_containment)"
          - "No other Booking of this tasker in {CLAIMED, EN_ROUTE, IN_PROGRESS} collides with [scheduled_start, scheduled_end + TRAVEL_BUFFER_MIN] (calc booking_overlap)"
          - "expected_tasker_version matches Tasker.version (OCC)"
        side_effects:
          - "Booking.tasker_id set to target tasker"
          - "increments Tasker.version by 1"
          - "Tasker.active_booking_count recomputed (+1)"

      - from: CLAIMED
        to: EN_ROUTE
        trigger: "POST /bookings/{id}/depart"
        actor: Tasker
        preconditions:
          - "Caller tasker == Booking.tasker_id"
          - "Tasker.status != SUSPENDED"
          - "no reschedule_pending"
        side_effects: []

      - from: EN_ROUTE
        to: IN_PROGRESS
        trigger: "POST /bookings/{id}/start"
        actor: Tasker
        preconditions:
          - "Caller tasker == Booking.tasker_id"
        side_effects: []

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /bookings/{id}/complete (carries actual_hours for HOURLY, tip_cents optional)"
        actor: Tasker
        preconditions:
          - "Caller tasker == Booking.tasker_id"
          - "For HOURLY: actual_hours provided and >= 0"
        side_effects:
          - "Booking.tip_cents set from payload (default unchanged)"
          - "Create Settlement (calc final_settlement): final_labor_cents, final_service_fee_cents, tip_cents, total_charged_cents, tasker_payout_cents"
          - "Tasker.completed_booking_count recomputed (+1); active_booking_count recomputed (-1)"

      - from: [OFFERED, CLAIMED, EN_ROUTE]
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel (carries cancelled_by)"
        actor: "Client or Tasker"
        preconditions:
          - "cancelled_by == CLIENT requires caller is Booking.client_id; cancelled_by == TASKER requires caller is Booking.tasker_id"
          - "Booking not already terminal"
        side_effects:
          - "Create Cancellation (calc cancellation_fee): fee_tier, cancellation_fee_cents charged to cancelling party"
          - "Booking.cancelled_by set"
          - "If a tasker was assigned: Tasker.active_booking_count recomputed (-1); increments Tasker.version by 1"
          - "If cancelled_by == TASKER and fee_tier == LAST_MINUTE: create TrustIncident severity MEDIUM (cascade → trust_score recompute → trust_gate)"
        note: "IN_PROGRESS cannot be cancelled; it must complete."

      - from: OFFERED
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc advancing past scheduled_start (system, lazy on next read of this booking)"
        actor: system
        preconditions:
          - "clock_now >= scheduled_start"
          - "No tasker has claimed (still OFFERED)"
        side_effects:
          - "Booking marked EXPIRED; no Settlement, no Cancellation"

      - from: [CLAIMED, EN_ROUTE]
        to: [CLAIMED, EN_ROUTE]
        trigger: "reschedule cycle (propose -> accept|decline); status unchanged, reschedule_pending toggles"
        actor: "Client or Tasker"
        preconditions:
          - "On propose: no reschedule_pending already; reschedule_count < MAX_RESCHEDULES; proposed_start > clock_now"
          - "On accept: reschedule_pending == true; new window passes window_containment + booking_overlap; expected_tasker_version matches Tasker.version (OCC)"
          - "On decline: reschedule_pending == true"
        side_effects:
          - "propose: reschedule_pending=true, proposed_start=X (status stays CLAIMED/EN_ROUTE)"
          - "accept: scheduled_start=proposed_start, scheduled_end recomputed (schedule_window), reschedule_count+1, reschedule_pending=false, increments Tasker.version by 1"
          - "decline: reschedule_pending=false, proposed_start cleared"
        note: |
          Reschedule is a same-state cycle keyed on the reschedule_pending flag and
          proposed_start field, NOT a distinct status enum value, so the booking stays
          CLAIMED/EN_ROUTE throughout. Accept re-validates window_containment +
          booking_overlap against the new window; a conflict leaves the proposal pending
          and returns ERR_SCHEDULE_CONFLICT / ERR_OUTSIDE_AVAILABILITY. This is the
          cyclic shape the complexity_profile declares (A -> A revision loop).

  # ---------------------------------------------------------------------------
  - entity: Tasker
    field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: RESTRICTED
        trigger: "system: trust_score recompute drops into [40,69] (calc trust_gate)"
        actor: system
        preconditions:
          - "40 <= trust_score <= 69"
        side_effects:
          - "Tasker can no longer be auto-dispatched (RecurringSeries auto-claim skips it); manual Dispatcher claim still allowed"

      - from: RESTRICTED
        to: ACTIVE
        trigger: "system: trust_score recompute rises to >= 70 (e.g. TrustIncident dismissed)"
        actor: system
        preconditions:
          - "trust_score >= 70"
        side_effects: []

      - from: [ACTIVE, RESTRICTED]
        to: SUSPENDED
        trigger: "system: trust_score recompute drops below 40 (calc trust_gate)"
        actor: system
        preconditions:
          - "trust_score < 40"
        side_effects:
          - "All this tasker's OFFERED/CLAIMED/EN_ROUTE Bookings remain but no new claims may target this tasker"
          - "Tasker cannot depart/start (Booking depart precondition rejects SUSPENDED)"

      - from: SUSPENDED
        to: RESTRICTED
        trigger: "system: trust_score recompute rises into [40,69]"
        actor: system
        preconditions:
          - "40 <= trust_score <= 69"
        side_effects: []

      - from: SUSPENDED
        to: ACTIVE
        trigger: "system: trust_score recompute rises to >= 70"
        actor: system
        preconditions:
          - "trust_score >= 70"
        side_effects: []

  # ---------------------------------------------------------------------------
  - entity: TaskerSkill
    field: vetting_status
    initial_state: PENDING
    terminal_states: [REJECTED]
    transitions:
      - from: PENDING
        to: VETTED
        trigger: "POST /tasker-skills/{id}/vet"
        actor: TrustSafetyOfficer
        preconditions:
          - "TaskCategory.status == ACTIVE"
        side_effects: []
      - from: PENDING
        to: REJECTED
        trigger: "POST /tasker-skills/{id}/reject"
        actor: TrustSafetyOfficer
        preconditions: []
        side_effects: []
      - from: VETTED
        to: REJECTED
        trigger: "POST /tasker-skills/{id}/reject (revoke)"
        actor: TrustSafetyOfficer
        preconditions: []
        side_effects: []

  # ---------------------------------------------------------------------------
  - entity: TrustIncident
    field: status
    initial_state: OPEN
    terminal_states: [DISMISSED]
    transitions:
      - from: OPEN
        to: UPHELD
        trigger: "POST /trust-incidents/{id}/uphold"
        actor: TrustSafetyOfficer
        preconditions: []
        side_effects:
          - "penalty_points stays applied; Tasker.trust_score recomputed (calc trust_score) → trust_gate"
      - from: OPEN
        to: DISMISSED
        trigger: "POST /trust-incidents/{id}/dismiss"
        actor: TrustSafetyOfficer
        preconditions: []
        side_effects:
          - "penalty_points set to 0; Tasker.incident_penalty_total recomputed; Tasker.trust_score recomputed (calc trust_score) → trust_gate (may bubble Tasker SUSPENDED→RESTRICTED→ACTIVE)"
      - from: UPHELD
        to: DISMISSED
        trigger: "POST /trust-incidents/{id}/dismiss (appeal granted)"
        actor: TrustSafetyOfficer
        preconditions: []
        side_effects:
          - "penalty_points set to 0; Tasker.trust_score recomputed → trust_gate"

  # ---------------------------------------------------------------------------
  - entity: Review
    field: status
    initial_state: PUBLISHED
    terminal_states: [REMOVED]
    transitions:
      - from: PUBLISHED
        to: HIDDEN
        trigger: "POST /reviews/{id}/hide"
        actor: TrustSafetyOfficer
        preconditions: []
        side_effects:
          - "Tasker.rating_count recomputed (-1); Tasker.avg_rating recomputed (calc avg_rating)"
      - from: HIDDEN
        to: PUBLISHED
        trigger: "POST /reviews/{id}/restore"
        actor: TrustSafetyOfficer
        preconditions: []
        side_effects:
          - "Tasker.rating_count recomputed (+1); Tasker.avg_rating recomputed (calc avg_rating)"
      - from: [PUBLISHED, HIDDEN]
        to: REMOVED
        trigger: "POST /reviews/{id}/remove"
        actor: TrustSafetyOfficer
        preconditions: []
        side_effects:
          - "If was PUBLISHED: Tasker.rating_count recomputed (-1); Tasker.avg_rating recomputed (calc avg_rating)"

  # ---------------------------------------------------------------------------
  - entity: RecurringSeries
    field: status
    initial_state: ACTIVE
    terminal_states: [ENDED]
    transitions:
      - from: ACTIVE
        to: ENDED
        trigger: "POST /recurring-series/{id}/end"
        actor: Client
        preconditions:
          - "Caller is RecurringSeries.client_id"
        side_effects:
          - "Future not-yet-started occurrences (Bookings in {DRAFT, OFFERED}) are cancelled (cascade → each Booking → CANCELLED, cancelled_by SYSTEM, no fee)"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: claim-stale-tasker-version
    parent_entity: Tasker
    write_endpoint: "POST /bookings/{id}/claim"
    occ_field: "expected_tasker_version"
    description: |
      Claiming a Booking onto a Tasker whose version has advanced since the
      Dispatcher last observed it is rejected. This captures the case where the
      tasker has just had another booking claimed onto them (which legitimately
      consumes their capacity and changes their schedule), so the current
      Dispatcher's view of the tasker is stale; the claim is rejected on the
      stale-version check before any overlap re-evaluation that the Dispatcher's
      stale view would otherwise pass.
    error_id: ERR_STALE_TASKER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # --- (A) Pricing: estimate variant ---
  - name: quote_estimate
    trigger: "Booking DRAFT->OFFERED (POST /bookings/{id}/offer)"
    algorithm: tiered_pricing
    formula: |
      Let cat = Booking.category.
      if cat.pricing_model == HOURLY:
        rate = Tasker.hourly_rate_cents if Booking.tasker_id set else cat.default_hourly_rate_cents
        # At OFFER time tasker is not yet claimed, so the category default rate is used.
        estimated_labor_cents = floor(rate * Booking.estimated_hours)
      else:  # FIXED
        estimated_labor_cents = cat.fixed_price_cents
      estimated_service_fee_cents = floor(estimated_labor_cents * SERVICE_FEE_PCT)
      estimated_total_cents = estimated_labor_cents + estimated_service_fee_cents
    input_set: "Single Booking + its TaskCategory; tip excluded from estimate."
    constants:
      SERVICE_FEE_PCT: 0.15
    precision: "integer cents, floor truncation"
    variants:
      - name: estimate
        when: "OFFER time, before any tasker is claimed"
        difference: "Uses category.default_hourly_rate_cents and client-supplied estimated_hours; tip excluded."

  # --- (A') Pricing: final variant (dual-variant with quote_estimate) ---
  - name: final_settlement
    trigger: "Booking IN_PROGRESS->COMPLETED (POST /bookings/{id}/complete); creates Settlement"
    algorithm: tiered_pricing
    formula: |
      Let cat = Booking.category, tk = Booking.tasker (already claimed).
      if cat.pricing_model == HOURLY:
        # Final billing rounds actual_hours UP to the next quarter hour, then bills
        # at the CLAIMED TASKER's personal rate (not the category default).
        billed_hours = ceil(actual_hours / 0.25) * 0.25
        final_labor_cents = floor(tk.hourly_rate_cents * billed_hours)
      else:  # FIXED
        final_labor_cents = cat.fixed_price_cents
      final_service_fee_cents = floor(final_labor_cents * SERVICE_FEE_PCT)
      tip_cents = Booking.tip_cents
      total_charged_cents = final_labor_cents + final_service_fee_cents + tip_cents
      tasker_payout_cents = final_labor_cents + tip_cents
    input_set: "Single Booking + its claimed Tasker + TaskCategory."
    constants:
      SERVICE_FEE_PCT: 0.15
      BILLING_INCREMENT_HOURS: 0.25
    precision: "integer cents, floor truncation; billed_hours rounded UP to 0.25"
    variants:
      - name: final
        when: "COMPLETE time, tasker claimed"
        difference: |
          Diverges from quote_estimate on BOTH inputs: bills the claimed tasker's
          personal hourly_rate_cents (vs category default) AND actual_hours rounded
          up to a quarter hour (vs client estimated_hours). For identical category
          and hours the two variants therefore produce different labor and fee cents
          whenever tasker.hourly_rate_cents != category.default_hourly_rate_cents or
          actual_hours straddles a quarter-hour boundary.

  # --- (B) Cancellation fee tiers (threshold / combinatorial) ---
  - name: cancellation_fee
    trigger: "Booking ->CANCELLED (POST /bookings/{id}/cancel); creates Cancellation"
    algorithm: threshold
    formula: |
      hours_before_start = (Booking.scheduled_start - clock_now) / 3600 seconds
      # Tier breakpoints (note >= boundary direction):
      if hours_before_start >= 24:        fee_tier = FREE;        pct = 0.00
      elif hours_before_start >= 2:       fee_tier = LATE;        pct = 0.25
      else:                               fee_tier = LAST_MINUTE; pct = 0.50
      # Base for the percentage is the booking's labor estimate, NOT the total.
      cancellation_fee_cents = floor(Booking.estimated_labor_cents * pct)
    input_set: "Single Booking + logical clock; estimated_labor_cents already pinned at OFFER."
    constants:
      FREE_THRESHOLD_HOURS: 24
      LATE_THRESHOLD_HOURS: 2
      LATE_PCT: 0.25
      LAST_MINUTE_PCT: 0.50
    precision: "integer cents, floor truncation"

  # --- (C) Trust score: chronic + acute (dual-variant on Tasker domain) ---
  - name: trust_score
    trigger: "TrustIncident create/uphold/dismiss; review-driven? no — incident-driven only"
    algorithm: weighted_scoring
    formula: |
      base = 100
      incident_penalty_total = sum(penalty_points for ti in Tasker.TrustIncidents
                                   where ti.status in {OPEN, UPHELD})
        where penalty_points = {LOW:5, MEDIUM:15, HIGH:35}[ti.severity]
      trust_score = max(base - incident_penalty_total, 0)
    input_set: "All TrustIncidents of the tasker with status in {OPEN, UPHELD}; DISMISSED excluded."
    constants:
      BASE: 100
      PENALTY_LOW: 5
      PENALTY_MEDIUM: 15
      PENALTY_HIGH: 35
      FLOOR: 0
    precision: "integer points, floored at 0"

  # --- (C') Trust gate: derived status from score (cross-entity gate) ---
  - name: trust_gate
    trigger: "any trust_score recompute"
    algorithm: threshold
    formula: |
      if trust_score < 40:           Tasker.status = SUSPENDED
      elif trust_score <= 69:        Tasker.status = RESTRICTED   # 40..69 inclusive
      else:                          Tasker.status = ACTIVE       # >= 70
    input_set: "Single Tasker.trust_score."
    constants:
      SUSPEND_BELOW: 40
      RESTRICT_CEILING: 69
    precision: "integer comparison"

  # --- (D) Rating average ---
  - name: avg_rating
    trigger: "Review published/hidden/restored/removed"
    algorithm: aggregation
    formula: |
      published = [r.rating_value for r in Tasker.Reviews where r.status == PUBLISHED]
      rating_count = len(published)
      if rating_count == 0:
        avg_rating = 0.0
      else:
        avg_rating = round_half_up(sum(published) / rating_count, 2)
    input_set: "Reviews of the tasker with status == PUBLISHED only; HIDDEN and REMOVED excluded."
    constants: {}
    precision: "2 decimal places, round_half_up; 0.0 when empty"

  # --- (E) Schedule window ---
  - name: schedule_window
    trigger: "Booking offer; reschedule accept"
    algorithm: interval_merge
    formula: |
      duration_minutes = (Booking.estimated_hours * 60) if cat.pricing_model == HOURLY
                         else cat.default_duration_minutes
      scheduled_end = scheduled_start + duration_minutes minutes
    input_set: "Single Booking + TaskCategory."
    constants: {}
    precision: "minute-resolution datetime arithmetic"

  # --- (F) Booking-vs-Booking overlap (buffered, half-open) ---
  - name: booking_overlap
    trigger: "Booking claim; reschedule accept"
    algorithm: interval_merge
    formula: |
      For the target tasker, let CANDIDATE = Bookings in {CLAIMED, EN_ROUTE, IN_PROGRESS}
      excluding the booking under evaluation. The new booking occupies
      [scheduled_start, scheduled_end). A TRAVEL_BUFFER_MIN buffer is appended AFTER
      each booking's end. Two bookings conflict iff their buffered half-open intervals
      overlap:
        conflict <=> (new.start < other.end + BUFFER) AND (other.start < new.end + BUFFER)
      Boundary: a new booking starting exactly at other.end + BUFFER does NOT conflict
      (half-open). Tie-break / scan order over CANDIDATE: created_at ASC (no id use).
    input_set: "Target tasker's CLAIMED/EN_ROUTE/IN_PROGRESS bookings."
    constants:
      TRAVEL_BUFFER_MIN: 30
    precision: "minute-resolution; half-open intervals"

  # --- (G) AvailabilityWindow containment (closed, no buffer) ---
  - name: window_containment
    trigger: "Booking claim; reschedule accept"
    algorithm: interval_merge
    formula: |
      The booking window [scheduled_start, scheduled_end] must be fully contained
      in at least ONE of the tasker's OPEN AvailabilityWindows, using CLOSED
      containment with NO buffer:
        contained <=> EXISTS w in OPEN windows: w.window_start <= scheduled_start
                                            AND scheduled_end <= w.window_end
      Boundary: scheduled_end == w.window_end is allowed (closed). A booking that
      exceeds the window end by any positive epsilon is rejected.
    input_set: "Target tasker's AvailabilityWindows with status == OPEN."
    constants: {}
    precision: "minute-resolution; closed intervals"

  # --- (H) Recurring series generation ---
  - name: series_generation
    trigger: "RecurringSeries create (POST /recurring-series)"
    algorithm: chronological
    formula: |
      step_days = 7 if frequency == WEEKLY else 14
      For i in 0..occurrence_count-1, in ascending i:
        occurrence_start = first_start + i*step_days days
        Create Booking{client_id, category_id, tasker_id, series_id, dispatch_mode=SCHEDULED,
                       scheduled_start=occurrence_start, estimated_hours=series.estimated_hours,
                       status=OFFERED}
        scheduled_end computed via schedule_window; estimated_* via quote_estimate.
      generated_count = occurrence_count
    input_set: "Single RecurringSeries."
    constants:
      WEEKLY_DAYS: 7
      BIWEEKLY_DAYS: 14
    precision: "day-resolution offsets; occurrences ordered by ascending index i"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path/body resource ids exist (validated left-to-right); unknown id -> typed not-found"
    error_id: "ERR_BOOKING_NOT_FOUND / ERR_TASKER_NOT_FOUND / ERR_CLIENT_NOT_FOUND / ERR_CATEGORY_NOT_FOUND / ERR_SKILL_NOT_FOUND / ERR_WINDOW_NOT_FOUND / ERR_SERIES_NOT_FOUND / ERR_REVIEW_NOT_FOUND / ERR_INCIDENT_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with resource ids

  - priority: 4
    category: business_referential
    check: "Acting entity_backed user owns the resource (Client owns booking/series/review; Tasker is booking.tasker_id for tasker actions)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "client/tasker-scoped mutations"

  - priority: 5
    category: state
    check: "Target resource in a legal state for the requested transition"
    error_id: "ERR_BOOKING_INVALID_STATE / ERR_SKILL_INVALID_STATE / ERR_INCIDENT_INVALID_STATE / ERR_REVIEW_INVALID_STATE / ERR_SERIES_INVALID_STATE"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_safety
    check: "Tasker trust/vetting gates: SUSPENDED tasker cannot be claimed/depart; vetting required but not VETTED"
    error_id: "ERR_TASKER_SUSPENDED / ERR_VETTING_REQUIRED"
    http_status: 409
    applies_to: "claim, depart, start"

  - priority: 7
    category: business_temporal
    check: "Same-day dispatch date mismatch; scheduled_start in the past; reschedule into the past"
    error_id: "ERR_SAME_DAY_DATE_MISMATCH / ERR_START_IN_PAST"
    http_status: 422
    applies_to: "offer, reschedule/propose"

  - priority: 8
    category: business_constraint
    check: "Window containment failure (booking not inside any OPEN availability window)"
    error_id: ERR_OUTSIDE_AVAILABILITY
    http_status: 409
    applies_to: "claim, reschedule/accept"

  - priority: 9
    category: business_constraint
    check: "Booking-vs-booking buffered overlap conflict on the tasker's schedule"
    error_id: ERR_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "claim, reschedule/accept"

  - priority: 10
    category: business_constraint
    check: "Reschedule cap reached (reschedule_count == MAX_RESCHEDULES) or no proposal pending on accept/decline"
    error_id: "ERR_RESCHEDULE_LIMIT / ERR_NO_RESCHEDULE_PENDING"
    http_status: 409
    applies_to: "reschedule/propose, reschedule/accept, reschedule/decline"

  - priority: 11
    category: business_constraint
    check: "OCC: expected_tasker_version must equal Tasker.version on claim"
    error_id: ERR_STALE_TASKER_VERSION
    http_status: 412
    applies_to: "claim"

  - priority: 12
    category: business_constraint
    check: "Field-domain validation: enum membership, numeric ranges, tip>=0, rating 1..5, occurrence_count 2..12, estimated_hours>=0.25, window_end>window_start"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all create/update endpoints

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Logical clock (test-driving; default 2026-01-01T00:00:00Z) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Server startup default is 2026-01-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time. Advancing past an OFFERED booking's scheduled_start lazily EXPIRES it on next read."
    roles: [Dispatcher, TrustSafetyOfficer]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advances; OFFERED bookings past scheduled_start become EXPIRED on next read"]

  # ---- TaskCategory ----
  - method: POST
    path: "/task-categories"
    description: "Create a task category"
    roles: [Dispatcher]
    code: 201
    input: [name, pricing_model, "default_hourly_rate_cents?", "fixed_price_cents?", default_duration_minutes, "requires_vetting?"]
    output: TaskCategory
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/task-categories"
    description: "List categories"
    roles: [Dispatcher, TrustSafetyOfficer, Client, Tasker]
    code: 200
    input: ["limit?", "offset?"]
    output: "TaskCategory[]"
    side_effects: []
  - method: GET
    path: "/task-categories/{id}"
    description: "Get a category"
    roles: [Dispatcher, TrustSafetyOfficer, Client, Tasker]
    code: 200
    input: []
    output: TaskCategory
    side_effects: []
  - method: POST
    path: "/task-categories/{id}/retire"
    description: "Retire a category (no new skills/bookings)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: TaskCategory
    side_effects: ["status=RETIRED"]

  # ---- Tasker ----
  - method: POST
    path: "/taskers"
    description: "Register a tasker"
    roles: [Dispatcher]
    code: 201
    input: [full_name, hourly_rate_cents]
    output: Tasker
    side_effects: ["status=ACTIVE, trust_score=100"]
  - method: GET
    path: "/taskers"
    description: "List taskers"
    roles: [Dispatcher, TrustSafetyOfficer, Client]
    code: 200
    input: ["limit?", "offset?"]
    output: "Tasker[]"
    side_effects: []
  - method: GET
    path: "/taskers/{id}"
    description: "Get a tasker (returns derived trust_score, status, avg_rating, version)"
    roles: [Dispatcher, TrustSafetyOfficer, Client, Tasker]
    code: 200
    input: []
    output: Tasker
    side_effects: ["recompute lazy trust_score/status before returning"]

  # ---- TaskerSkill (junction; FK reverse-reachability via filtered list + sub-resource) ----
  - method: POST
    path: "/tasker-skills"
    description: "Declare a tasker skill for a category (vetting_status=PENDING)"
    roles: [Dispatcher, Tasker]
    code: 201
    input: [tasker_id, category_id]
    output: TaskerSkill
    side_effects: ["vetting_status=PENDING"]
  - method: GET
    path: "/tasker-skills"
    description: "List/filter tasker skills by tasker or category"
    roles: [Dispatcher, TrustSafetyOfficer, Client, Tasker]
    code: 200
    input: ["tasker_id?", "category_id?", "limit?", "offset?"]
    output: "TaskerSkill[]"
    side_effects: []
  - method: GET
    path: "/taskers/{id}/skills"
    description: "List a tasker's skills (sub-resource reverse-reachability for TaskerSkill.tasker_id)"
    roles: [Dispatcher, TrustSafetyOfficer, Client, Tasker]
    code: 200
    input: ["limit?", "offset?"]
    output: "TaskerSkill[]"
    side_effects: []
  - method: GET
    path: "/tasker-skills/{id}"
    description: "Get a single tasker skill"
    roles: [Dispatcher, TrustSafetyOfficer, Client, Tasker]
    code: 200
    input: []
    output: TaskerSkill
    side_effects: []
  - method: POST
    path: "/tasker-skills/{id}/vet"
    description: "Mark a skill VETTED"
    roles: [TrustSafetyOfficer]
    code: 200
    input: []
    output: TaskerSkill
    side_effects: ["vetting_status=VETTED"]
  - method: POST
    path: "/tasker-skills/{id}/reject"
    description: "Reject/revoke a skill"
    roles: [TrustSafetyOfficer]
    code: 200
    input: []
    output: TaskerSkill
    side_effects: ["vetting_status=REJECTED"]

  # ---- AvailabilityWindow ----
  - method: POST
    path: "/availability-windows"
    description: "Create an availability window for a tasker"
    roles: [Dispatcher, Tasker]
    code: 201
    input: [tasker_id, window_start, window_end]
    output: AvailabilityWindow
    side_effects: ["status=OPEN"]
  - method: GET
    path: "/availability-windows"
    description: "List/filter availability windows by tasker (reverse-reachability for AvailabilityWindow.tasker_id)"
    roles: [Dispatcher, TrustSafetyOfficer, Client, Tasker]
    code: 200
    input: ["tasker_id?", "limit?", "offset?"]
    output: "AvailabilityWindow[]"
    side_effects: []
  - method: GET
    path: "/availability-windows/{id}"
    description: "Get a single availability window"
    roles: [Dispatcher, TrustSafetyOfficer, Client, Tasker]
    code: 200
    input: []
    output: AvailabilityWindow
    side_effects: []
  - method: POST
    path: "/availability-windows/{id}/close"
    description: "Close a window"
    roles: [Dispatcher, Tasker]
    code: 200
    input: []
    output: AvailabilityWindow
    side_effects: ["status=CLOSED"]

  # ---- Client ----
  - method: POST
    path: "/clients"
    description: "Register a client"
    roles: [Dispatcher]
    code: 201
    input: [full_name]
    output: Client
    side_effects: ["wallet_credit_cents=0"]
  - method: GET
    path: "/clients"
    description: "List clients"
    roles: [Dispatcher, TrustSafetyOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Client[]"
    side_effects: []
  - method: GET
    path: "/clients/{id}"
    description: "Get a client"
    roles: [Dispatcher, TrustSafetyOfficer, Client]
    code: 200
    input: []
    output: Client
    side_effects: []

  # ---- Booking ----
  - method: POST
    path: "/bookings"
    description: "Create a one-off booking in DRAFT"
    roles: [Client, Dispatcher]
    code: 201
    input: [client_id, category_id, dispatch_mode, scheduled_start, "estimated_hours?", "tip_cents?"]
    output: Booking
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/bookings"
    description: "List/filter bookings by client, tasker, category, or series (reverse-reachability for Booking.client_id, tasker_id, category_id, series_id)"
    roles: [Dispatcher, TrustSafetyOfficer, Client, Tasker]
    code: 200
    input: ["client_id?", "tasker_id?", "category_id?", "series_id?", "status?", "limit?", "offset?"]
    output: "Booking[]"
    side_effects: ["lazily EXPIRE OFFERED bookings whose scheduled_start has passed"]
  - method: GET
    path: "/bookings/{id}"
    description: "Get a booking (lazily expires if OFFERED past scheduled_start)"
    roles: [Dispatcher, TrustSafetyOfficer, Client, Tasker]
    code: 200
    input: []
    output: Booking
    side_effects: ["lazy EXPIRE if OFFERED and clock_now >= scheduled_start"]
  - method: POST
    path: "/bookings/{id}/offer"
    description: "Publish a DRAFT booking as OFFERED; pins the quote estimate"
    roles: [Client, Dispatcher]
    code: 200
    input: []
    output: Booking
    side_effects: ["status=OFFERED; estimated_labor_cents/service_fee/total computed (quote_estimate); scheduled_end computed (schedule_window)"]
  - method: POST
    path: "/bookings/{id}/claim"
    description: "Dispatcher claims an OFFERED booking onto a tasker (OCC on Tasker.version)"
    roles: [Dispatcher]
    code: 200
    input: [tasker_id, expected_tasker_version]
    output: Booking
    side_effects: ["status=CLAIMED; Booking.tasker_id set; Tasker.version+1; active_booking_count recomputed; runs window_containment + booking_overlap checks"]
  - method: POST
    path: "/bookings/{id}/depart"
    description: "Assigned tasker departs (CLAIMED->EN_ROUTE)"
    roles: [Tasker]
    code: 200
    input: []
    output: Booking
    side_effects: ["status=EN_ROUTE"]
  - method: POST
    path: "/bookings/{id}/start"
    description: "Assigned tasker starts work (EN_ROUTE->IN_PROGRESS)"
    roles: [Tasker]
    code: 200
    input: []
    output: Booking
    side_effects: ["status=IN_PROGRESS"]
  - method: POST
    path: "/bookings/{id}/complete"
    description: "Assigned tasker completes (IN_PROGRESS->COMPLETED); creates Settlement"
    roles: [Tasker]
    code: 200
    input: ["actual_hours?", "tip_cents?"]
    output: Booking
    side_effects: ["status=COMPLETED; tip_cents set; Settlement created (final_settlement); Tasker counts recomputed"]
  - method: POST
    path: "/bookings/{id}/cancel"
    description: "Cancel a non-terminal, non-IN_PROGRESS booking; creates Cancellation"
    roles: [Client, Tasker]
    code: 200
    input: [cancelled_by]
    output: Booking
    side_effects: ["status=CANCELLED; Cancellation created (cancellation_fee); if tasker assigned Tasker.version+1 and active_booking_count recomputed; if TASKER + LAST_MINUTE create MEDIUM TrustIncident (cascade trust_score->trust_gate)"]

  # ---- Reschedule sub-flow (cyclic) ----
  - method: POST
    path: "/bookings/{id}/reschedule/propose"
    description: "Propose a new scheduled_start (CLAIMED/EN_ROUTE); sets reschedule_pending"
    roles: [Client, Tasker]
    code: 200
    input: [proposed_start]
    output: Booking
    side_effects: ["proposed_start set; reschedule_pending=true"]
  - method: POST
    path: "/bookings/{id}/reschedule/accept"
    description: "Counterparty accepts the pending proposal; re-validates window+overlap, applies new window"
    roles: [Client, Tasker]
    code: 200
    input: [expected_tasker_version]
    output: Booking
    side_effects: ["scheduled_start=proposed_start; scheduled_end recomputed (schedule_window); reschedule_count+1; reschedule_pending=false; Tasker.version+1; re-runs window_containment + booking_overlap"]
  - method: POST
    path: "/bookings/{id}/reschedule/decline"
    description: "Counterparty declines the pending proposal"
    roles: [Client, Tasker]
    code: 200
    input: []
    output: Booking
    side_effects: ["reschedule_pending=false; proposed_start cleared"]

  # ---- Settlement / Cancellation reverse-reachability ----
  - method: GET
    path: "/bookings/{id}/settlement"
    description: "Get the settlement for a booking (sub-resource reverse-reachability for Settlement.booking_id; array of 0..1)"
    roles: [Dispatcher, TrustSafetyOfficer, Client, Tasker]
    code: 200
    input: []
    output: "Settlement[]"
    side_effects: []
  - method: GET
    path: "/bookings/{id}/cancellation"
    description: "Get the cancellation for a booking (sub-resource reverse-reachability for Cancellation.booking_id; array of 0..1)"
    roles: [Dispatcher, TrustSafetyOfficer, Client, Tasker]
    code: 200
    input: []
    output: "Cancellation[]"
    side_effects: []

  # ---- ChatMessage ----
  - method: POST
    path: "/bookings/{id}/messages"
    description: "Post a chat message to a booking conversation (sender_role derived from caller)"
    roles: [Client, Tasker]
    code: 201
    input: [body]
    output: ChatMessage
    side_effects: ["append-only; created_at stamped"]
  - method: GET
    path: "/bookings/{id}/messages"
    description: "List chat messages for a booking, created_at ASC (reverse-reachability for ChatMessage.booking_id)"
    roles: [Client, Tasker, Dispatcher, TrustSafetyOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "ChatMessage[]"
    side_effects: []

  # ---- RecurringSeries ----
  - method: POST
    path: "/recurring-series"
    description: "Create a recurring series; generates occurrence_count OFFERED bookings"
    roles: [Client, Dispatcher]
    code: 201
    input: [client_id, category_id, tasker_id, frequency, first_start, occurrence_count, "estimated_hours?"]
    output: RecurringSeries
    side_effects: ["status=ACTIVE; generates Bookings (series_generation); generated_count set"]
  - method: GET
    path: "/recurring-series"
    description: "List/filter recurring series by client, category, or tasker (reverse-reachability for RecurringSeries.client_id, category_id, tasker_id)"
    roles: [Dispatcher, TrustSafetyOfficer, Client]
    code: 200
    input: ["client_id?", "category_id?", "tasker_id?", "limit?", "offset?"]
    output: "RecurringSeries[]"
    side_effects: []
  - method: GET
    path: "/recurring-series/{id}"
    description: "Get a recurring series"
    roles: [Dispatcher, TrustSafetyOfficer, Client]
    code: 200
    input: []
    output: RecurringSeries
    side_effects: []
  - method: POST
    path: "/recurring-series/{id}/end"
    description: "End a series; cascades cancel of future not-yet-started occurrences"
    roles: [Client, Dispatcher]
    code: 200
    input: []
    output: RecurringSeries
    side_effects: ["status=ENDED; DRAFT/OFFERED child bookings -> CANCELLED (cancelled_by SYSTEM, no fee)"]

  # ---- Review / Rebooking ----
  - method: POST
    path: "/reviews"
    description: "Client reviews a COMPLETED booking's tasker (PUBLISHED immediately)"
    roles: [Client]
    code: 201
    input: [booking_id, rating_value, "comment?"]
    output: Review
    side_effects: ["status=PUBLISHED; tasker_id copied from booking; Tasker.rating_count/avg_rating recomputed (avg_rating)"]
  - method: GET
    path: "/reviews"
    description: "List/filter reviews by tasker or booking (reverse-reachability for Review.tasker_id, Review.booking_id)"
    roles: [Dispatcher, TrustSafetyOfficer, Client, Tasker]
    code: 200
    input: ["tasker_id?", "booking_id?", "limit?", "offset?"]
    output: "Review[]"
    side_effects: []
  - method: GET
    path: "/reviews/{id}"
    description: "Get a single review"
    roles: [Dispatcher, TrustSafetyOfficer, Client, Tasker]
    code: 200
    input: []
    output: Review
    side_effects: []
  - method: POST
    path: "/reviews/{id}/hide"
    description: "Hide a published review"
    roles: [TrustSafetyOfficer]
    code: 200
    input: []
    output: Review
    side_effects: ["status=HIDDEN; Tasker.rating_count/avg_rating recomputed"]
  - method: POST
    path: "/reviews/{id}/restore"
    description: "Restore a hidden review"
    roles: [TrustSafetyOfficer]
    code: 200
    input: []
    output: Review
    side_effects: ["status=PUBLISHED; Tasker.rating_count/avg_rating recomputed"]
  - method: POST
    path: "/reviews/{id}/remove"
    description: "Permanently remove a review"
    roles: [TrustSafetyOfficer]
    code: 200
    input: []
    output: Review
    side_effects: ["status=REMOVED; if was PUBLISHED Tasker.rating_count/avg_rating recomputed"]
  - method: POST
    path: "/bookings/{id}/rebook"
    description: "Create a new DRAFT booking copying client/category/tasker of a COMPLETED booking (rebooking)"
    roles: [Client]
    code: 201
    input: [scheduled_start, dispatch_mode, "estimated_hours?", "tip_cents?"]
    output: Booking
    side_effects: ["new Booking status=DRAFT with same client_id/category_id; tasker_id left null (claimed afresh)"]

  # ---- TrustIncident ----
  - method: POST
    path: "/trust-incidents"
    description: "File a trust/safety incident against a tasker (OPEN); cascades trust_score->trust_gate"
    roles: [TrustSafetyOfficer]
    code: 201
    input: [tasker_id, severity, "booking_id?"]
    output: TrustIncident
    side_effects: ["status=OPEN; penalty_points set; Tasker.trust_score recomputed (trust_score) -> trust_gate (may RESTRICT/SUSPEND)"]
  - method: GET
    path: "/trust-incidents"
    description: "List/filter incidents by tasker (reverse-reachability for TrustIncident.tasker_id, booking_id)"
    roles: [Dispatcher, TrustSafetyOfficer]
    code: 200
    input: ["tasker_id?", "booking_id?", "limit?", "offset?"]
    output: "TrustIncident[]"
    side_effects: []
  - method: GET
    path: "/trust-incidents/{id}"
    description: "Get a single trust incident"
    roles: [Dispatcher, TrustSafetyOfficer]
    code: 200
    input: []
    output: TrustIncident
    side_effects: []
  - method: POST
    path: "/trust-incidents/{id}/uphold"
    description: "Uphold an OPEN incident (penalty stays)"
    roles: [TrustSafetyOfficer]
    code: 200
    input: []
    output: TrustIncident
    side_effects: ["status=UPHELD; trust_score recomputed -> trust_gate"]
  - method: POST
    path: "/trust-incidents/{id}/dismiss"
    description: "Dismiss an incident (removes penalty); cascades trust_score->trust_gate"
    roles: [TrustSafetyOfficer]
    code: 200
    input: []
    output: TrustIncident
    side_effects: ["status=DISMISSED; penalty_points=0; Tasker.trust_score recomputed -> trust_gate (may bubble back to ACTIVE/RESTRICTED)"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Request / auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Authenticated role not permitted for this operation" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "entity_backed caller is not the owner of the targeted resource" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Field-domain violation: bad enum, out-of-range number, missing required field, window_end<=window_start, rating outside 1..5, occurrence_count outside 2..12, estimated_hours<0.25" }
  # --- Not found ---
  - { id: ERR_BOOKING_NOT_FOUND, http: 404, condition: "Booking id does not exist" }
  - { id: ERR_TASKER_NOT_FOUND, http: 404, condition: "Tasker id does not exist" }
  - { id: ERR_CLIENT_NOT_FOUND, http: 404, condition: "Client id does not exist" }
  - { id: ERR_CATEGORY_NOT_FOUND, http: 404, condition: "TaskCategory id does not exist" }
  - { id: ERR_SKILL_NOT_FOUND, http: 404, condition: "TaskerSkill id does not exist" }
  - { id: ERR_WINDOW_NOT_FOUND, http: 404, condition: "AvailabilityWindow id does not exist" }
  - { id: ERR_SERIES_NOT_FOUND, http: 404, condition: "RecurringSeries id does not exist" }
  - { id: ERR_REVIEW_NOT_FOUND, http: 404, condition: "Review id does not exist" }
  - { id: ERR_INCIDENT_NOT_FOUND, http: 404, condition: "TrustIncident id does not exist" }
  - { id: ERR_SETTLEMENT_NOT_FOUND, http: 404, condition: "No Settlement exists for the booking" }
  # --- State ---
  - { id: ERR_BOOKING_INVALID_STATE, http: 409, condition: "Booking not in a legal state for the requested transition (e.g. claim a non-OFFERED, complete a non-IN_PROGRESS, cancel an IN_PROGRESS or terminal booking)" }
  - { id: ERR_SKILL_INVALID_STATE, http: 409, condition: "TaskerSkill not in a legal state (e.g. vet a REJECTED skill)" }
  - { id: ERR_INCIDENT_INVALID_STATE, http: 409, condition: "TrustIncident not in a legal state (e.g. uphold a DISMISSED incident)" }
  - { id: ERR_REVIEW_INVALID_STATE, http: 409, condition: "Review not in a legal state (e.g. hide an already-REMOVED review)" }
  - { id: ERR_SERIES_INVALID_STATE, http: 409, condition: "RecurringSeries not ACTIVE for the requested operation" }
  - { id: ERR_CATEGORY_RETIRED, http: 409, condition: "Operation references a RETIRED TaskCategory" }
  # --- Trust / vetting ---
  - { id: ERR_TASKER_SUSPENDED, http: 409, condition: "Target tasker is SUSPENDED — cannot be claimed onto a booking nor depart/start" }
  - { id: ERR_VETTING_REQUIRED, http: 409, condition: "Category requires vetting but the tasker has no VETTED TaskerSkill for it" }
  # --- Temporal ---
  - { id: ERR_SAME_DAY_DATE_MISMATCH, http: 422, condition: "dispatch_mode SAME_DAY but scheduled_start is not on the current clock's UTC date" }
  - { id: ERR_START_IN_PAST, http: 422, condition: "scheduled_start (or proposed_start) is at or before clock_now" }
  # --- Scheduling constraints ---
  - { id: ERR_OUTSIDE_AVAILABILITY, http: 409, condition: "Booking window not contained in any OPEN AvailabilityWindow of the tasker" }
  - { id: ERR_SCHEDULE_CONFLICT, http: 409, condition: "Booking window (plus travel buffer) collides with another active booking of the tasker" }
  - { id: ERR_RESCHEDULE_LIMIT, http: 409, condition: "Booking has reached MAX_RESCHEDULES accepted reschedules" }
  - { id: ERR_NO_RESCHEDULE_PENDING, http: 409, condition: "reschedule/accept or /decline with no pending proposal" }
  - { id: ERR_RESCHEDULE_ALREADY_PENDING, http: 409, condition: "reschedule/propose while a proposal is already pending" }
  # --- OCC ---
  - { id: ERR_STALE_TASKER_VERSION, http: 412, condition: "expected_tasker_version does not match current Tasker.version on claim or reschedule/accept" }
  # --- Review/rebooking domain ---
  - { id: ERR_BOOKING_NOT_COMPLETED, http: 409, condition: "review or rebook references a booking that is not COMPLETED" }
  - { id: ERR_DUPLICATE_REVIEW, http: 409, condition: "A review already exists for this booking" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Client
    description: "End user who requests errands/tasks; owns bookings, series, reviews, and the client side of chat."
    identity: "entity_backed:Client"
    exclusive_operations:
      - "POST /bookings — create own booking"
      - "POST /bookings/{id}/offer — offer own booking"
      - "POST /bookings/{id}/rebook — rebook own completed booking"
      - "POST /recurring-series — create own series"
      - "POST /recurring-series/{id}/end — end own series"
      - "POST /reviews — review own completed booking"
    shared_operations:
      - "POST /bookings/{id}/cancel — cancel (cancelled_by=CLIENT) own booking"
      - "POST /bookings/{id}/reschedule/propose — on own booking"
      - "POST /bookings/{id}/reschedule/accept — accept on own booking"
      - "POST /bookings/{id}/reschedule/decline — decline on own booking"
      - "POST /bookings/{id}/messages — chat as CLIENT"
      - "GET reads on own bookings/series/reviews/categories/taskers"

  - name: Tasker
    description: "Service provider; the assigned tasker on a booking. Owns own skills, availability windows, and the tasker side of chat; subject of trust incidents."
    identity: "entity_backed:Tasker"
    exclusive_operations:
      - "POST /bookings/{id}/depart — own assigned booking"
      - "POST /bookings/{id}/start — own assigned booking"
      - "POST /bookings/{id}/complete — own assigned booking"
    shared_operations:
      - "POST /tasker-skills — declare own skill (also Dispatcher)"
      - "POST /availability-windows — create own window (also Dispatcher)"
      - "POST /availability-windows/{id}/close — close own window (also Dispatcher)"
      - "POST /bookings/{id}/cancel — cancel (cancelled_by=TASKER) own assigned booking"
      - "POST /bookings/{id}/reschedule/propose|accept|decline — on own assigned booking"
      - "POST /bookings/{id}/messages — chat as TASKER"
      - "GET reads on own bookings/skills/windows/categories"

  - name: Dispatcher
    description: "Platform operator who registers taskers/clients/categories and claims bookings onto taskers. Opaque operator identity."
    identity: "opaque"
    exclusive_operations:
      - "POST /task-categories, POST /task-categories/{id}/retire"
      - "POST /taskers"
      - "POST /clients"
      - "POST /bookings/{id}/claim — claim a booking onto a tasker (OCC)"
      - "POST /_clock/set_current_utc — advance logical clock (shared with TrustSafetyOfficer)"
    shared_operations:
      - "POST /bookings, /bookings/{id}/offer (on behalf of client)"
      - "POST /recurring-series, /recurring-series/{id}/end"
      - "POST /tasker-skills, /availability-windows, /availability-windows/{id}/close"
      - "GET reads across all resources"

  - name: TrustSafetyOfficer
    description: "Trust & safety operator; vets skills, files/upholds/dismisses incidents, moderates reviews. Opaque operator identity."
    identity: "opaque"
    exclusive_operations:
      - "POST /tasker-skills/{id}/vet, POST /tasker-skills/{id}/reject"
      - "POST /trust-incidents, /trust-incidents/{id}/uphold, /trust-incidents/{id}/dismiss"
      - "POST /reviews/{id}/hide, /reviews/{id}/restore, /reviews/{id}/remove"
    shared_operations:
      - "POST /_clock/set_current_utc — advance logical clock (shared with Dispatcher)"
      - "GET reads across all resources"
