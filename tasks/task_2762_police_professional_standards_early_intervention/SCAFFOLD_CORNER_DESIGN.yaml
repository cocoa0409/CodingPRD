# §1.9 Scaffold Corner Design (Claim Coverage Index)
# Task 2762 — Police Professional Standards & Early Intervention
#
# Walks references/claim-extraction-guide.md section by section against
# SCAFFOLD.yaml §1.1–§1.7 and emits one instance per applicable row. Claims that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8) already owns are recorded here as
# `excluded_because` stubs naming the §1.8 instance that covers them; every other
# claim carries its own executable recipe.
#
# Every `name` is unique across the union of §1.8 and §1.9. Every numeric literal
# in an `assert:` was computed by executing the corresponding §1.3 formula against
# its declared `constants:`. The logical clock starts at its mandatory default
# 2026-08-01T00:00:00Z and is only moved by explicit POST /_clock/set_current_utc
# calls.
scaffold_corner_design:
  - section: entities
    instances:
      - name: officer_creation_returns_201_with_every_declared_field
        claim_type: Creation
        grounds:
          - endpoints["POST /officers"]
          - entities.Officer.fields.badge_number
          - entities.Officer.fields.unit_id
          - entities.Officer.fields.employment_status
          - response_envelope.success
        distinguishing_aspect: |
          The plain creation claim for the root entity of the domain: every declared input
          field is echoed back verbatim, the §1.0 envelope wrapper is present, and the
          server-managed common fields (id, created_at, updated_at, version) are all
          populated on the very first write with version 1 and created_at equal to the
          logical clock rather than to wall-clock time.
        test_recipe:
          setup:
            - "The logical clock stands at its mandatory default 2026-08-01T00:00:00Z."
            - "One PATROL_DIVISION unit 'Patrol North' exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /units"
              payload: { name: "Patrol North", unit_role: "PATROL_DIVISION", command_code: "PN", peer_group_code: "PG_NORTH", sworn_headcount: 60, intake_enabled: true }
              as: SystemAdmin
              captures: { patrol_unit_id: $.data.id }
          trigger:
            - call: "POST /officers"
              payload: { unit_id: "${patrol_unit_id}", badge_number: "PN-777", full_name: "Officer Ruiz", rank: "OFFICER", assignment_type: "PATROL", annual_salary_cents: 8800000, demographic_code: "DG_D", hire_date: "2021-06-14T00:00:00Z", is_investigator: false, certification_level: 1, max_case_load: 4 }
              as: SystemAdmin
              captures: { ruiz_id: $.data.id }
          assert:
            - "HTTP 201"
            - "response_type == object and meta.api_request_id and meta.api_request_timestamp are both present"
            - "data.unit_id == ${patrol_unit_id}"
            - "data.badge_number == PN-777"
            - "data.full_name == Officer Ruiz"
            - "data.rank == OFFICER"
            - "data.assignment_type == PATROL"
            - "data.annual_salary_cents == 8800000"
            - "data.demographic_code == DG_D"
            - "data.is_investigator == false"
            - "data.certification_level == 1"
            - "data.max_case_load == 4"
            - "data.employment_status == ACTIVE"
            - "data.id is a non-empty string"
            - "data.version == 1"
            - "data.created_at == 2026-08-01T00:00:00Z"
            - "data.updated_at == 2026-08-01T00:00:00Z"

      - name: omitted_optional_inputs_fall_back_to_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.Unit.fields.intake_enabled
          - entities.HearingRoom.fields.recording_enabled
          - entities.Officer.fields.is_investigator
          - entities.Officer.fields.certification_level
          - entities.Officer.fields.max_case_load
          - entities.Complaint.fields.complainant_demographic_code
          - entities.OfficerActivityEvent.fields.severity_code
        distinguishing_aspect: |
          Four different entities each carry a declared `default` on an optional input, and
          the defaults are not all falsy: intake_enabled and recording_enabled default to
          true, max_case_load defaults to 5, certification_level to 0, is_investigator to
          false, complainant_demographic_code to the literal UNKNOWN and activity-event
          severity_code to the literal NA. Omitting each optional key must produce exactly
          those values, so a lazy implementation that stores nulls for absent keys fails.
        test_recipe:
          setup:
            - "The logical clock stands at 2026-08-01T00:00:00Z."
            - "Nothing else exists; every row in this test is created with only its required inputs."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /units"
              payload: { name: "Internal Affairs", unit_role: "INTERNAL_AFFAIRS", command_code: "IA", peer_group_code: "PG_IA", sworn_headcount: 12 }
              as: SystemAdmin
              captures: { ia_unit_id: $.data.id }
            - call: "POST /hearing-rooms"
              payload: { facility_code: "HQ", room_name: "Interview 1", concurrent_capacity: 2 }
              as: SystemAdmin
              captures: { room1_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${ia_unit_id}", badge_number: "IA-900", full_name: "Officer Bell", rank: "OFFICER", assignment_type: "PATROL", annual_salary_cents: 8000000, demographic_code: "DG_A", hire_date: "2020-01-06T00:00:00Z" }
              as: SystemAdmin
              captures: { bell_id: $.data.id }
          trigger:
            - call: "POST /complaints"
              payload: { intake_channel: "ANONYMOUS", narrative: "Rude language on a traffic stop.", incident_datetime: "2026-07-20T18:00:00Z", alleged_injury: false, reported_allegation_types: ["DISCOURTESY"], subject_unit_id: "${ia_unit_id}" }
              as: Complainant
              captures: { anon_c_id: $.data.id }
            - call: "POST /officers/${bell_id}/activity-events"
              payload: { event_type: "PURSUIT", occurred_at: "2026-07-25T12:00:00Z" }
              as: Supervisor
              as_user_id: "${bell_id}"
              captures: { ev1_id: $.data.id }
          assert:
            - "Unit.${ia_unit_id}.intake_enabled == true"
            - "HearingRoom.${room1_id}.recording_enabled == true"
            - "Officer.${bell_id}.is_investigator == false"
            - "Officer.${bell_id}.certification_level == 0"
            - "Officer.${bell_id}.max_case_load == 5"
            - "Complaint.${anon_c_id}.complainant_demographic_code == UNKNOWN"
            - "Complaint.${anon_c_id}.alleged_injury == false"
            - "Complaint.${anon_c_id}.intake_reference_code == null (ANONYMOUS intake mints no withdrawal credential)"
            - "OfficerActivityEvent.${ev1_id}.severity_code == NA"
            - "OfficerActivityEvent.${ev1_id}.base_weight == 2.0 (PURSUIT base 2 times the NA multiplier 1.0)"
            - "OfficerActivityEvent.${ev1_id}.system_generated == false"

      - name: complaint_retrieval_returns_the_stored_intake_row
        claim_type: Retrieval
        grounds:
          - endpoints["GET /complaints/{id}"]
          - entities.Complaint.fields.narrative
          - entities.Complaint.fields.received_at
        distinguishing_aspect: |
          A read-after-write on the complaint aggregate: the GET must return the identical
          row the POST returned, including the fields the intake calculation derived, and it
          must not re-run the classification calculation (a re-run would be visible if the
          routing units changed between the two calls, which this recipe forces by adding a
          second INTERNAL_AFFAIRS unit after intake).
        test_recipe:
          setup:
            - "The logical clock stands at 2026-08-01T00:00:00Z."
            - "One INTERNAL_AFFAIRS unit and one PATROL_DIVISION unit exist, plus Sergeant Doyle as the reporting supervisor."
            - "A SUPERVISOR-channel complaint alleging NEGLECT_OF_DUTY has been filed, so it classifies CLASS_II and routes to the subject unit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /units"
              payload: { name: "Internal Affairs", unit_role: "INTERNAL_AFFAIRS", command_code: "IA", peer_group_code: "PG_IA", sworn_headcount: 12, intake_enabled: true }
              as: SystemAdmin
              captures: { ia_unit_id: $.data.id }
            - call: "POST /units"
              payload: { name: "Patrol North", unit_role: "PATROL_DIVISION", command_code: "PN", peer_group_code: "PG_NORTH", sworn_headcount: 60, intake_enabled: true }
              as: SystemAdmin
              captures: { patrol_unit_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${patrol_unit_id}", badge_number: "PN-010", full_name: "Sergeant Doyle", rank: "SERGEANT", assignment_type: "PATROL", annual_salary_cents: 10500000, demographic_code: "DG_A", hire_date: "2012-02-02T00:00:00Z" }
              as: SystemAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /complaints"
              payload: { intake_channel: "SUPERVISOR", narrative: "Reports not filed for four shifts.", incident_datetime: "2026-07-15T20:00:00Z", alleged_injury: false, reported_allegation_types: ["NEGLECT_OF_DUTY"], subject_unit_id: "${patrol_unit_id}", complainant_name: "Sergeant Doyle", complainant_contact: "doyle@dept.gov", complainant_demographic_code: "DG_A", reporting_supervisor_officer_id: "${sup_id}" }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /units"
              payload: { name: "Internal Affairs Annex", unit_role: "INTERNAL_AFFAIRS", command_code: "IAA", peer_group_code: "PG_IA", sworn_headcount: 4, intake_enabled: true }
              as: SystemAdmin
              captures: { ia2_unit_id: $.data.id }
          trigger:
            - call: "GET /complaints/${c1_id}"
              payload: {}
              as: RecordsCustodian
          assert:
            - "HTTP 200 and response_type == object"
            - "data.id == ${c1_id}"
            - "data.narrative == Reports not filed for four shifts."
            - "data.intake_channel == SUPERVISOR"
            - "data.incident_datetime == 2026-07-15T20:00:00Z"
            - "data.received_at == 2026-08-01T00:00:00Z"
            - "data.classification == CLASS_II"
            - "data.priority == 2"
            - "data.assigned_unit_id == ${patrol_unit_id}"
            - "data.screening_required == false"
            - "data.status == CLASSIFIED"
            - "data.intake_reference_code == CMP-000001"
            - "data.allegation_count == 0"
            - "data.version == 1 (the read performs no write)"

      - name: complaint_listing_returns_the_pagination_envelope
        claim_type: Listing
        grounds:
          - endpoints["GET /complaints"]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          Five complaints exist but the declared default limit is 10 and the declared maximum
          is 100, so the unqualified list returns all five with has_more false, while
          limit 2 / offset 0 returns two rows with has_more true and total_count 5, and
          limit 2 / offset 4 returns the single trailing row with has_more false. total_count
          always reports the full filtered set, never the page size.
        test_recipe:
          setup:
            - "The logical clock stands at 2026-08-01T00:00:00Z."
            - "One INTERNAL_AFFAIRS unit, one PATROL_DIVISION unit and Sergeant Doyle exist."
            - "Five SUPERVISOR-channel CLASS_II complaints have been filed against the patrol unit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /units"
              payload: { name: "Internal Affairs", unit_role: "INTERNAL_AFFAIRS", command_code: "IA", peer_group_code: "PG_IA", sworn_headcount: 12, intake_enabled: true }
              as: SystemAdmin
              captures: { ia_unit_id: $.data.id }
            - call: "POST /units"
              payload: { name: "Patrol North", unit_role: "PATROL_DIVISION", command_code: "PN", peer_group_code: "PG_NORTH", sworn_headcount: 60, intake_enabled: true }
              as: SystemAdmin
              captures: { patrol_unit_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${patrol_unit_id}", badge_number: "PN-010", full_name: "Sergeant Doyle", rank: "SERGEANT", assignment_type: "PATROL", annual_salary_cents: 10500000, demographic_code: "DG_A", hire_date: "2012-02-02T00:00:00Z" }
              as: SystemAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /complaints"
              payload: { intake_channel: "SUPERVISOR", narrative: "Complaint one.", incident_datetime: "2026-07-11T20:00:00Z", alleged_injury: false, reported_allegation_types: ["NEGLECT_OF_DUTY"], subject_unit_id: "${patrol_unit_id}", complainant_name: "Sergeant Doyle", complainant_contact: "doyle@dept.gov", reporting_supervisor_officer_id: "${sup_id}" }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /complaints"
              payload: { intake_channel: "SUPERVISOR", narrative: "Complaint two.", incident_datetime: "2026-07-12T20:00:00Z", alleged_injury: false, reported_allegation_types: ["NEGLECT_OF_DUTY"], subject_unit_id: "${patrol_unit_id}", complainant_name: "Sergeant Doyle", complainant_contact: "doyle@dept.gov", reporting_supervisor_officer_id: "${sup_id}" }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { p2_id: $.data.id }
            - call: "POST /complaints"
              payload: { intake_channel: "SUPERVISOR", narrative: "Complaint three.", incident_datetime: "2026-07-13T20:00:00Z", alleged_injury: false, reported_allegation_types: ["NEGLECT_OF_DUTY"], subject_unit_id: "${patrol_unit_id}", complainant_name: "Sergeant Doyle", complainant_contact: "doyle@dept.gov", reporting_supervisor_officer_id: "${sup_id}" }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { p3_id: $.data.id }
            - call: "POST /complaints"
              payload: { intake_channel: "SUPERVISOR", narrative: "Complaint four.", incident_datetime: "2026-07-14T20:00:00Z", alleged_injury: false, reported_allegation_types: ["NEGLECT_OF_DUTY"], subject_unit_id: "${patrol_unit_id}", complainant_name: "Sergeant Doyle", complainant_contact: "doyle@dept.gov", reporting_supervisor_officer_id: "${sup_id}" }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { p4_id: $.data.id }
            - call: "POST /complaints"
              payload: { intake_channel: "SUPERVISOR", narrative: "Complaint five.", incident_datetime: "2026-07-15T20:00:00Z", alleged_injury: false, reported_allegation_types: ["NEGLECT_OF_DUTY"], subject_unit_id: "${patrol_unit_id}", complainant_name: "Sergeant Doyle", complainant_contact: "doyle@dept.gov", reporting_supervisor_officer_id: "${sup_id}" }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { p5_id: $.data.id }
          trigger:
            - call: "GET /complaints"
              payload: {}
              as: RecordsCustodian
            - call: "GET /complaints"
              payload: { limit: 2, offset: 0 }
              as: RecordsCustodian
            - call: "GET /complaints"
              payload: { limit: 2, offset: 4 }
              as: RecordsCustodian
          assert:
            - "call 1: HTTP 200, response_type == array, limit == 10, offset == 0, total_count == 5, has_more == false, data length 5"
            - "call 2: limit == 2, offset == 0, total_count == 5, has_more == true, data length 2"
            - "call 3: limit == 2, offset == 4, total_count == 5, has_more == false, data length 1"
            - "no complaint appears twice across the two pages of call 2 and call 3 under a stable ordering"

      - name: unknown_complaint_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints["GET /complaints/{id}"]
          - validations[priority=3]
        distinguishing_aspect: |
          The existence ladder sits at priority 3, above every business rule, so a
          syntactically valid but unknown UUID must produce ERR_COMPLAINT_NOT_FOUND (404) on
          both a read route and an action route — the action route must not report a state
          error for a row that does not exist.
        test_recipe:
          setup:
            - "The logical clock stands at 2026-08-01T00:00:00Z and no complaint exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "GET /complaints/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: IACommander
              as_user_id: "00000000-0000-0000-0000-00000000000a"
              captures: { err_get: "$.data.error_id" }
            - call: "POST /complaints/00000000-0000-0000-0000-0000000000ff/purge"
              payload: { purge_reason: "probe" }
              as: RecordsCustodian
              captures: { err_purge: "$.data.error_id" }
          assert:
            - "call 1: HTTP 404 with ${err_get} == ERR_COMPLAINT_NOT_FOUND"
            - "call 2: HTTP 404 with ${err_purge} == ERR_COMPLAINT_NOT_FOUND (not ERR_COMPLAINT_NOT_PURGEABLE)"
            - "both responses carry response_type == error and data.message non-empty"

      - name: complaint_intake_missing_required_narrative_is_rejected
        claim_type: Required Fields
        grounds:
          - endpoints["POST /complaints"]
          - validations[priority=4]
          - entities.Complaint.fields.narrative
          - entities.Complaint.fields.reported_allegation_types
        distinguishing_aspect: |
          Schema validation sits at priority 4, below authentication and existence but above
          every business rule, so a body missing a required input is refused with
          ERR_INVALID_REQUEST (400) even when the same body would also violate a later
          business rule. The recipe omits narrative in one probe and reported_allegation_types
          in another, proving both are required and neither silently defaults.
        test_recipe:
          setup:
            - "The logical clock stands at 2026-08-01T00:00:00Z."
            - "One INTERNAL_AFFAIRS unit and one PATROL_DIVISION unit exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /units"
              payload: { name: "Internal Affairs", unit_role: "INTERNAL_AFFAIRS", command_code: "IA", peer_group_code: "PG_IA", sworn_headcount: 12, intake_enabled: true }
              as: SystemAdmin
              captures: { ia_unit_id: $.data.id }
            - call: "POST /units"
              payload: { name: "Patrol North", unit_role: "PATROL_DIVISION", command_code: "PN", peer_group_code: "PG_NORTH", sworn_headcount: 60, intake_enabled: true }
              as: SystemAdmin
              captures: { patrol_unit_id: $.data.id }
          trigger:
            - call: "POST /complaints"
              payload: { intake_channel: "PUBLIC", incident_datetime: "2026-07-15T20:00:00Z", alleged_injury: false, reported_allegation_types: ["DISCOURTESY"], subject_unit_id: "${patrol_unit_id}", complainant_name: "Dana Ruiz", complainant_contact: "dana@example.org" }
              as: Complainant
              captures: { err_no_narrative: "$.data.error_id" }
            - call: "POST /complaints"
              payload: { intake_channel: "PUBLIC", narrative: "No allegation types supplied.", incident_datetime: "2026-07-15T20:00:00Z", alleged_injury: false, subject_unit_id: "${patrol_unit_id}", complainant_name: "Dana Ruiz", complainant_contact: "dana@example.org" }
              as: Complainant
              captures: { err_no_types: "$.data.error_id" }
          assert:
            - "call 1: HTTP 400 with ${err_no_narrative} == ERR_INVALID_REQUEST"
            - "call 2: HTTP 400 with ${err_no_types} == ERR_INVALID_REQUEST"
            - "no Complaint row was created: GET /complaints returns total_count == 0"

      - name: complaint_classification_is_computed_and_the_extra_field_is_ignored
        claim_type: Computed Fields
        grounds:
          - calculations.complaint_classification_and_routing
          - entities.Complaint.fields.classification
          - entities.Complaint.fields.priority
          - entities.Complaint.fields.assigned_unit_id
          - entities.Complaint.fields.screening_required
          - entities.Complaint.fields.statute_expires_at
        distinguishing_aspect: |
          classification, priority, assigned_unit_id, screening_required and statute_expires_at
          are all `source: computed` and none of them is a declared input, so a caller that
          smuggles classification CLASS_III and priority 3 into the body must still get
          CLASS_I / priority 1 because alleged_injury true outranks the moderate allegation
          type, and the routing target must be the INTERNAL_AFFAIRS unit rather than the
          subject unit that the body names.
        test_recipe:
          setup:
            - "The logical clock stands at 2026-08-01T00:00:00Z."
            - "One INTERNAL_AFFAIRS unit, one PATROL_DIVISION unit with intake_enabled true and Sergeant Doyle exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /units"
              payload: { name: "Internal Affairs", unit_role: "INTERNAL_AFFAIRS", command_code: "IA", peer_group_code: "PG_IA", sworn_headcount: 12, intake_enabled: true }
              as: SystemAdmin
              captures: { ia_unit_id: $.data.id }
            - call: "POST /units"
              payload: { name: "Patrol North", unit_role: "PATROL_DIVISION", command_code: "PN", peer_group_code: "PG_NORTH", sworn_headcount: 60, intake_enabled: true }
              as: SystemAdmin
              captures: { patrol_unit_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${patrol_unit_id}", badge_number: "PN-010", full_name: "Sergeant Doyle", rank: "SERGEANT", assignment_type: "PATROL", annual_salary_cents: 10500000, demographic_code: "DG_A", hire_date: "2012-02-02T00:00:00Z" }
              as: SystemAdmin
              captures: { sup_id: $.data.id }
          trigger:
            - call: "POST /complaints"
              payload: { intake_channel: "SUPERVISOR", narrative: "Takedown caused a wrist fracture.", incident_datetime: "2026-07-15T20:00:00Z", alleged_injury: true, reported_allegation_types: ["NEGLECT_OF_DUTY"], subject_unit_id: "${patrol_unit_id}", complainant_name: "Sergeant Doyle", complainant_contact: "doyle@dept.gov", complainant_demographic_code: "DG_A", reporting_supervisor_officer_id: "${sup_id}", classification: "CLASS_III", priority: 3, assigned_unit_id: "${patrol_unit_id}" }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { inj_c_id: $.data.id }
          assert:
            - "HTTP 201"
            - "Complaint.${inj_c_id}.classification == CLASS_I (alleged_injury true wins Step 1 branch (a); the body value CLASS_III is ignored)"
            - "Complaint.${inj_c_id}.priority == 1 (PRIORITY_BY_CLASSIFICATION[CLASS_I]; the body value 3 is ignored)"
            - "Complaint.${inj_c_id}.assigned_unit_id == ${ia_unit_id} (Step 5(a) routes every CLASS_I to internal affairs, never to the subject unit named in the body)"
            - "Complaint.${inj_c_id}.screening_required == false (Step 4 needs CLASS_III and ANONYMOUS together)"
            - "Complaint.${inj_c_id}.statute_expires_at == 2027-07-15T20:00:00Z (incident_datetime plus STATUTE_DAYS 365)"
            - "Complaint.${inj_c_id}.status == CLASSIFIED"

      - name: intake_sequence_and_reference_code_are_minted_with_ignored_input
        claim_type: System Fields
        grounds:
          - entities.Complaint.fields.intake_sequence
          - entities.Complaint.fields.intake_reference_code
          - entities.Complaint.fields.received_at
          - entities.Complaint.fields.status
        distinguishing_aspect: |
          intake_sequence is a monotonic counter starting at 1 and intake_reference_code is
          derived from it as CMP- plus the six-digit zero-padded sequence, both `source:
          system`. A body that supplies id, intake_sequence 99, intake_reference_code
          CMP-000999, status CLOSED and received_at from the past must be ignored field by
          field: the first complaint in the store gets sequence 1 and CMP-000001, and the
          second gets 2 and CMP-000002 even though the second body also claims 99.
        test_recipe:
          setup:
            - "The logical clock stands at 2026-08-01T00:00:00Z and no complaint exists yet."
            - "One INTERNAL_AFFAIRS unit, one PATROL_DIVISION unit and Sergeant Doyle exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /units"
