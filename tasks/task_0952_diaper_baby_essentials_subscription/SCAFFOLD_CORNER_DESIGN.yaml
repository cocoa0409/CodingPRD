            - "Subscription.${sub_id}.cancelled_at == 2026-06-01T00:00:00.000Z"
            - "no PauseRecord row exists with subscription_id == ${sub_id}"

      - name: corner_lock_before_cutoff_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.Cycle.ALLOCATED_to_CUTOFF_LOCKED", "validations[priority=36]", "errors[ERR_CUTOFF_NOT_REACHED]"]
        distinguishing_aspect: "Locking at 2026-06-01T00:00:00Z, five days before the cycle's 2026-06-06T00:00:00Z cutoff, returns ERR_CUTOFF_NOT_REACHED (409) and the cycle stays ALLOCATED."
        test_recipe:
