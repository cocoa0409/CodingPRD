        grounds:
          - state_machines.Site.RECRUITED_to_ACTIVE
          - errors[ERR_NO_APPROVED_IRB]
          - errors[ERR_DESIGN_PLAN_INVALID_STATE]
        distinguishing_aspect: |
          Site -> (DesignPlan, IRBProtocol) pair: site activation is a guarded transition
          whose outcome depends on TWO other entities' states — a DRAFT plan blocks it with
          ERR_DESIGN_PLAN_INVALID_STATE (state priority), then with the plan LOCKED the
