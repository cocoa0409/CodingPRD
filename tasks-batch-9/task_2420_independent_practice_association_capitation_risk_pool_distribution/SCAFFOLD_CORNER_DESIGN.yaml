            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements"
              payload: { payer_name: "Corner Recovery Link Health", payer_tax_id: "94-3000073", delegation_scope: "FULL_RISK", base_pmpm_cents: 20000, reconciliation_method: "ROSTER_SNAPSHOT", ibnr_method: "COMPLETION_FACTOR", ibnr_completion_factor_bps: 8000, target_claims_pmpm_cents: 15000, professional_pool_share_bps: 10000, institutional_pool_share_bps: 0, quality_withhold_bps: 0, stop_loss_attachment_cents: 1000, reinsurance_recovery_bps: 9000, max_panel_size: 5 }
