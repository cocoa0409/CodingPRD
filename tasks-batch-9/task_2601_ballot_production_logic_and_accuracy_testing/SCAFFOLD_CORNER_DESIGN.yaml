      - name: sm_lot_receive_valid_transition_appends_receipt_custody_event
        claim_type: valid_transition
        grounds:
          - state_machines.BallotLot.IN_TRANSIT_to_RECEIVED
          - endpoints.POST /ballot-lots/{id}/receive
          - entities.Election.fields.total_ballots_received
        distinguishing_aspect: "The legal IN_TRANSIT -> RECEIVED edge does three things in one call that a naive status write would miss: it seeds unused_quantity to the full receipt (issued_quantity is still 0), it appends the RECEIPT custody row, and it re-derives the election-level total_ballots_received ledger."
        test_recipe:
          setup:
            - "One DELIVERED print job with a single IN_TRANSIT lot L-001 of 12500 ballots under seal SEAL-1001; election.total_ballots_received is still 0."
