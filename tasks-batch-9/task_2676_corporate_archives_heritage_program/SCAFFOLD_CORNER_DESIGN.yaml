  # ==========================================================================
  # §1.9 Section 8 — Cross-cutting complexity layers
  # complexity_layers = [optimistic_concurrency, cascading_side_effects,
  # dual_variant_calculation, temporal_windowing]. Both §1.2.1 concurrency
  # rules get their own stale-version instance.
  # ==========================================================================
  - section: cross-cutting complexity layers
    instances:

      - name: layers_occ_stale_series_version_on_appraisal_create_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[appraisal-create-stale-series]
          - errors[ERR_STALE_SERIES_VERSION]
          - state_machines.RecordSeries.ACTIVE_to_SUSPENDED
        distinguishing_aspect: "A hold activation and its release advance RecordSeries.version 1 -> 2 -> 3 while leaving disposition_state back at ACTIVE, so the series looks unchanged to a naive client. Posting an appraisal with the stale expected_series_version 1 is rejected with ERR_STALE_SERIES_VERSION (412) and no AppraisalRecord row is created, proving the check reads version rather than disposition_state."
        test_recipe:
          setup:
            - "ACTIVE series whose version has advanced to 3 through a hold activate/release cycle."
          setup_api_calls:
            - call: "POST /retention-schedules"
              payload: { code: "CL-01", retention_years: 60, disposition_action: "REVIEW", legal_citation: "Corp Policy 8.1", min_appraisal_score_for_permanent: 30.00 }
              as: ArchivesDirector
              as_user_id: "director-a"
              captures: { sched_id: $.data.id }
            - call: "POST /record-series"
              payload: { title: "Litigation Support Files", business_unit: "Legal", retention_schedule_id: "${sched_id}", sensitivity_ceiling: "CONFIDENTIAL", annual_volume_linear_feet: 9, earliest_record_year: 1990, latest_record_year: 2012 }
              as: Archivist
              as_user_id: "archivist-a"
              captures: { series_id: $.data.id, series_v1: $.data.version }
            - call: "POST /legal-holds"
              payload: { matter_number: "MAT-2026-0044", record_series_id: "${series_id}", effective_from: "2026-07-01T00:00:00Z" }
              as: LegalCounsel
              as_user_id: "counsel-a"
              captures: { hold_id: $.data.id }
            - call: "POST /legal-holds/${hold_id}/activate"
              payload: {}
              as: LegalCounsel
              as_user_id: "counsel-a"
            - call: "POST /legal-holds/${hold_id}/release"
              payload: { release_note: "Matter closed." }
              as: LegalCounsel
              as_user_id: "counsel-a"
          trigger:
            - call: "POST /appraisals"
              payload: { record_series_id: "${series_id}", informational_value: 3, evidential_value: 3, brand_heritage_value: 0, uniqueness_factor: 3, provenance_verified: true, expected_series_version: "${series_v1}" }
              as: Archivist
              as_user_id: "archivist-a"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 412"
            - "${err} == ERR_STALE_SERIES_VERSION"
            - "${series_v1} == 1"
            - "RecordSeries.${series_id}.version == 3"
            - "RecordSeries.${series_id}.disposition_state == ACTIVE"
            - "RecordSeries.${series_id}.legal_hold_active == false"
            - "GET /appraisals?record_series_id=${series_id} returns total_count 0"

      - name: layers_occ_stale_access_request_version_on_screening_create_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[screening-create-stale-request]
          - errors[ERR_STALE_ACCESS_REQUEST_VERSION]
          - endpoints[POST /confidentiality-screenings]
        distinguishing_aspect: "begin-screening advances AccessRequest.version 1 -> 2, so a screening posted with the version observed at request creation is rejected with ERR_STALE_ACCESS_REQUEST_VERSION (412); no ConfidentialityScreening row exists afterwards and the request stays in SCREENING, which distinguishes the OCC failure from a state-machine failure."
        test_recipe:
          setup:
            - "Request in SCREENING whose version is 2, with the creation-time version 1 still held by the client."
          setup_api_calls:
            - call: "POST /retention-schedules"
              payload: { code: "CL-02", retention_years: 61, disposition_action: "REVIEW", legal_citation: "Corp Policy 8.2", min_appraisal_score_for_permanent: 80.00 }
