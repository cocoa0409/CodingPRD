              as: SafetyReviewer
            - call: "POST /wbl/worksites"
              payload: { employer_partner_id: "${emp_id}", site_name: "Yardley Trim Room", address_line: "10 Yardley Rd", hazard_class: "NON_HAZARDOUS", has_power_machinery: false, displaces_paid_employee: false, max_concurrent_students: 2 }
