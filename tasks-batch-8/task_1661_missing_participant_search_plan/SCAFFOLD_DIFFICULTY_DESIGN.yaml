            - { call: "POST /notices", payload: { termination_case_id: "${c_sg}", notice_type: DISTRIBUTION, action_effective_date: "2026-10-20T00:00:00Z", expected_termination_case_version: "${c_sg_v2}" }, as: PlanAdministrator }
