          rationale: "Both computed cost fields are asserted as literals (754 and 1758) by the named §1.8 instance."

  # ===========================================================================
  - section: state_machines
    instances:

      - name: newly_created_rows_start_in_their_declared_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.Campaign.initial_state
          - state_machines.KitLine.initial_state
          - state_machines.FulfillmentWave.initial_state
          - state_machines.Enrollment.initial_state
        distinguishing_aspect: "Four machines are checked at birth in one chain: a campaign that was never advanced is DRAFT, a kit line is ACTIVE, a wave is PLANNED and a brand-new enrollment sits on PENDING_SCREEN with the independent obligation axis at NONE."
        test_recipe:
          setup:
            - "Campaign A is created and never advanced, so it is still on its initial state."
            - "Campaign B is opened for screening only because POST /enrollments requires status SCREENING_OPEN or SAMPLING_ACTIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { name: "Initial A", objective_type: "TRIAL_GENERATION", target_segment_codes: ["URBAN_MILLENNIAL"], syndication_retailer_ids: [], sampling_window_start: "2026-07-01T00:00:00Z", sampling_window_end: "2026-09-30T00:00:00Z", budget_total_cents: 1000000, review_due_days: 21, min_review_word_count: 10, holdout_pct: 0.0 }
              as: CampaignManager
              captures: { camp_a_id: $.data.id }
            - call: "POST /campaigns"
              payload: { name: "Initial B", objective_type: "TRIAL_GENERATION", target_segment_codes: ["URBAN_MILLENNIAL"], syndication_retailer_ids: [], sampling_window_start: "2026-07-01T00:00:00Z", sampling_window_end: "2026-09-30T00:00:00Z", budget_total_cents: 1000000, review_due_days: 21, min_review_word_count: 10, holdout_pct: 0.0 }
              as: CampaignManager
              captures: { camp_b_id: $.data.id }
            - call: "POST /kit-lines"
              payload: { campaign_id: "${camp_b_id}", component_sku: "HERO-1", component_role: "HERO_PRODUCT", unit_cost_cents: 1417, quantity_per_kit: 1, component_discount_pct: 0.8 }
              as: CampaignManager
              captures: { kl1_id: $.data.id }
            - call: "POST /campaigns/${camp_b_id}/open-screening"
              payload: {}
              as: CampaignManager
            - call: "POST /fulfillment-centers"
              payload: { name: "FC Init", zone_code: "EAST", daily_pick_capacity_units: 100, freight_cents_per_kit: 300 }
              as: FulfillmentOps
              captures: { fc_id: $.data.id }
            - call: "POST /fulfillment-waves"
              payload: { fulfillment_center_id: "${fc_id}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-02T00:00:00Z", planned_capacity_units: 50 }
              as: FulfillmentOps
              captures: { w1_id: $.data.id }
            - call: "POST /panelists"
              payload: { email: "init1@example.com", display_name: "Init One", address_hash: "H-INIT1", account_opened_at: "2026-01-01T00:00:00Z", segment_code: "URBAN_MILLENNIAL" }
              as: Anonymous
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /enrollments"
              payload: { campaign_id: "${camp_b_id}", panelist_id: "${p1_id}", screening_answers: { household_size: 3, attests_no_resale: true } }
              as: CampaignManager
              captures: { e1_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Campaign.${camp_a_id}.status == DRAFT"
            - "KitLine.${kl1_id}.status == ACTIVE"
            - "FulfillmentWave.${w1_id}.status == PLANNED"
            - "FulfillmentWave.${w1_id}.planned_unit_count == 0 and shipped_unit_count == 0"
            - "Panelist.${p1_id}.integrity_status == CLEAR"
            - "Enrollment.${e1_id}.screening_status == PENDING_SCREEN"
            - "Enrollment.${e1_id}.obligation_status == NONE"
            - "Enrollment.${e1_id}.enrollment_seq == 1"
            - "Enrollment.${e1_id}.screen_attempt_count == 0"
            - "Enrollment.${e1_id}.screening_failure_reason == null"
            - "Enrollment.${e1_id}.holdout_flag == false"
            - "Enrollment.${e1_id}.review_due_at == null"

      - name: open_screening_seeds_kit_cost_and_available_budget
        claim_type: valid_transition
        grounds:
          - state_machines.Campaign.DRAFT_to_SCREENING_OPEN
          - calculations.kit_assembly_unit_cost
          - calculations.campaign_budget_conservation
        distinguishing_aspect: "The DRAFT -> SCREENING_OPEN trigger both moves the status and fires its two declared side effects: kit_assembly_unit_cost_cents becomes 454 and budget_available_cents is seeded from budget_total_cents minus the zero committed amount."
        test_recipe:
          setup:
            - "One DRAFT campaign with the three canonical ACTIVE kit lines and budget_total_cents 1000000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { name: "Seed Budget", objective_type: "TRIAL_GENERATION", target_segment_codes: ["URBAN_MILLENNIAL"], syndication_retailer_ids: [], sampling_window_start: "2026-07-01T00:00:00Z", sampling_window_end: "2026-09-30T00:00:00Z", budget_total_cents: 1000000, review_due_days: 21, min_review_word_count: 10, holdout_pct: 0.0 }
              as: CampaignManager
              captures: { camp_id: $.data.id }
            - call: "POST /kit-lines"
              payload: { campaign_id: "${camp_id}", component_sku: "HERO-1", component_role: "HERO_PRODUCT", unit_cost_cents: 1417, quantity_per_kit: 1, component_discount_pct: 0.8 }
              as: CampaignManager
            - call: "POST /kit-lines"
              payload: { campaign_id: "${camp_id}", component_sku: "ACC-2", component_role: "ACCESSORY", unit_cost_cents: 388, quantity_per_kit: 2, component_discount_pct: 0.85 }
              as: CampaignManager
            - call: "POST /kit-lines"
              payload: { campaign_id: "${camp_id}", component_sku: "INS-3", component_role: "INSERT_CARD", unit_cost_cents: 554, quantity_per_kit: 1, component_discount_pct: 0.9 }
              as: CampaignManager
          trigger:
            - call: "POST /campaigns/${camp_id}/open-screening"
              payload: {}
              as: CampaignManager
          assert:
            - "HTTP status == 200"
            - "Campaign.${camp_id}.status == SCREENING_OPEN"
            - "Campaign.${camp_id}.kit_assembly_unit_cost_cents == 454"
            - "Campaign.${camp_id}.budget_committed_cents == 0"
            - "Campaign.${camp_id}.budget_available_cents == 1000000"
            - "Campaign.${camp_id}.launched_by_user_id == null (only activate-sampling stamps it)"

      - name: open_screening_without_an_active_kit_line_is_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Campaign.DRAFT_to_SCREENING_OPEN.preconditions
          - errors[ERR_CAMPAIGN_KIT_EMPTY]
          - validations[priority 27]
        distinguishing_aspect: "The transition's second precondition needs at least one ACTIVE KitLine; with none the campaign must stay DRAFT and answer 422 ERR_CAMPAIGN_KIT_EMPTY, and the kit cost stays at its create-time zero because no line ever contributed to it."
        test_recipe:
          setup:
            - "One DRAFT campaign with no kit lines at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { name: "No Kit", objective_type: "TRIAL_GENERATION", target_segment_codes: ["URBAN_MILLENNIAL"], syndication_retailer_ids: [], sampling_window_start: "2026-07-01T00:00:00Z", sampling_window_end: "2026-09-30T00:00:00Z", budget_total_cents: 1000000, review_due_days: 21, min_review_word_count: 10, holdout_pct: 0.0 }
              as: CampaignManager
              captures: { camp_id: $.data.id }
          trigger:
            - call: "POST /campaigns/${camp_id}/open-screening"
              payload: {}
              as: CampaignManager
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "${err_id} == ERR_CAMPAIGN_KIT_EMPTY"
            - "Campaign.${camp_id}.status == DRAFT"
            - "Campaign.${camp_id}.budget_committed_cents == 0 and budget_available_cents == 1000000 (unchanged from creation)"
            - "Campaign.${camp_id}.kit_assembly_unit_cost_cents == 0"

      - name: activate_sampling_without_a_screen_passed_enrollment_is_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Campaign.SCREENING_OPEN_to_SAMPLING_ACTIVE.preconditions
          - errors[ERR_INVALID_CAMPAIGN_TRANSITION]
        distinguishing_aspect: "SCREENING_OPEN -> SAMPLING_ACTIVE needs at least one SCREEN_PASSED enrollment; with a single PENDING_SCREEN enrollment the count is 0, so the campaign stays SCREENING_OPEN and launched_by_user_id is never stamped."
