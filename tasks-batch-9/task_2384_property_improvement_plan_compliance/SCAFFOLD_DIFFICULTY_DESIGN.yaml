        distinguishing_aspect: |
          A different metric class and a different endpoint: the empty-collection edge on GET
          /pip/plans/{id}/cost-summary, where removing the only item leaves an empty included set
          so brand_scoped_total_cents is 0 and variance_pct must be exactly 0.00 rather than a
          division-by-zero error or null.
        test_recipe:
          setup:
            - "One property with a plan holding a single GUEST_FACING item of 1000000 cents, issued at the default clock."
