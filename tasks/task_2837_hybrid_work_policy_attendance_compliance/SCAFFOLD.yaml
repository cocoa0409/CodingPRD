scenario: |
  2837. Hybrid Work Policy & Attendance Compliance (corporate workplace program office): role eligibility classification across fully remote, hybrid and onsite-required positions with manager approval, days-in-office expectations by team with badge and network data as compliance signals, exception request handling for medical, caregiving and disability accommodation, space allocation and neighborhood assignment tied to expected attendance, non-compliance escalation ladder through manager coaching and performance management, remote work location approval with tax, licensing and data security implications, policy communication, measurement of collaboration outcomes and periodic recalibration, equitable application monitoring across demographics

domain_name: hybrid-work-attendance-compliance
api_prefix: ""   # graph topology: every entity is exposed as a peer collection at the API root

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - rate_threshold_triggers
    - cascading_side_effects

  entity_topology: graph
  # graph: junction entities (SeatAllocation links Neighborhood x Team over a week interval;
  # DeskAssignment links SeatAllocation x Employee over a date interval) plus two
  # self-referential edges (EligibilityClassification.supersedes_classification_id,
  # EscalationCase.prior_case_id). No entity is nested in a URL path.

  state_machine_shape: parallel
  # RemoteLocationRequest carries two independent review dimensions
  # (tax_review_status x security_review_status) on the same row that must fork-join
  # before POST /remote-location-requests/{id}/decide is legal. Layered on top:
  # cyclic machines on AttendanceWeek (FINALIZED->AMENDED->FINALIZED),
  # ExceptionRequest (SUBMITTED->INFO_REQUESTED->SUBMITTED),
  # EscalationCase (COACHING->WRITTEN_WARNING->COACHING),
  # PolicyCycle (OPEN->RECALIBRATING->OPEN) and Employee (ACTIVE->ON_LEAVE->ACTIVE).

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # The user who drafts an EligibilityClassification may not decide it; the manager
  # who owns an Employee may not adjudicate that Employee's MEDICAL or
  # DISABILITY_ACCOMMODATION exception (AccommodationSpecialist only); the manager may
  # not sign the WRITTEN_WARNING or higher escalation step (HRBusinessPartner only,
  # and that HR user must not be the Employee's manager_user_id).

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:

  - name: PolicyCycle
    parent: null
    common_fields: true
    fields:
      - name: cycle_label
        type: string
        source: input
        description: "Human label for the recalibration period, e.g. FY27-H1."
        constraints: "1..40 chars; unique across all PolicyCycle rows"
      - name: effective_from
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) the policy cycle starts, inclusive."
      - name: effective_to
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) the policy cycle ends, inclusive."
        constraints: "must be strictly after effective_from"
      - name: posture
        type: enum
        source: system
        description: "Gate over every cycle-scoped write. OPEN allows all writes; RECALIBRATING blocks new SeatAllocation and EligibilityClassification decisions but still allows attendance finalization; LOCKED blocks every cycle-scoped write."
        default: "OPEN"
        constraints: "one of {OPEN, RECALIBRATING, LOCKED}"
      - name: days_in_office_floor
        type: integer
        source: input
        description: "Minimum expected_days_in_office_per_week any Team in this cycle may declare."
        constraints: "0..5"
      - name: badge_weight
        type: number
        source: input
        description: "Documentation weight of the BADGE signal source, surfaced in policy communication; recorded for audit, not used by credited_office_days."
        constraints: "0.00..1.00, 2 decimals"
      - name: network_weight
        type: number
        source: input
        description: "Documentation weight of the NETWORK signal source; recorded for audit, not used by credited_office_days."
        constraints: "0.00..1.00, 2 decimals; badge_weight + network_weight must equal 1.00"
      - name: collaboration_target_score
        type: number
        source: input
        description: "Target value RecalibrationReview.collaboration_index must reach for meets_collaboration_target to be true."
        constraints: "0.00..100.00, 2 decimals"
      - name: equity_variance_threshold_pct
        type: number
        source: input
        description: "Percentage-point spread between the best and worst demographic band compliance rate above which RecalibrationReview.equity_flag is raised."
        constraints: "0.00..100.00, 2 decimals"
      - name: enrolled_team_count
        type: integer
        source: computed
        description: "count(Team WHERE policy_cycle_id == this.id)."
        default: 0
      - name: aggregate_compliance_rate
        type: number
        source: computed
        description: "See calculations.aggregate_compliance_rate. Percentage of ACTIVE employees in this cycle whose compliance_state is COMPLIANT."
        default: 0.00
      - name: formal_action_total
        type: integer
        source: computed
        description: "sum(Team.formal_action_count) over Team rows WHERE policy_cycle_id == this.id. Conserved quantity of compensating-invariant formal_action_headcount_conservation."
        default: 0

  - name: Team
    parent: PolicyCycle
    common_fields: true
    fields:
      - name: policy_cycle_id
        type: string
        source: input
        description: "FK -> PolicyCycle.id; the cycle whose policy this team's expectation belongs to."
      - name: team_code
        type: string
        source: input
        description: "Short team identifier."
        constraints: "1..24 chars, uppercase alphanumerics and hyphens; unique per policy_cycle_id; used as the deterministic accumulation sort key in calculations.collaboration_index"
      - name: expected_days_in_office_per_week
        type: integer
        source: input
        description: "Days-in-office expectation for HYBRID employees on this team."
        constraints: "integer 0..5; must be >= PolicyCycle.days_in_office_floor"
      - name: core_collaboration_days
        type: array
        source: input
        description: "Weekday codes on which the team is expected to co-locate; documented for policy communication."
        constraints: "0..5 distinct members of {MON, TUE, WED, THU, FRI}"
      - name: headcount_planned
        type: integer
        source: input
        description: "Planned headcount used by calculations.team_seat_entitlement and as the weight in calculations.collaboration_index."
        constraints: "integer 1..5000"
      - name: signal_corroboration_required
        type: boolean
        source: input
        description: "Selects the credited_office_days variant for this team's employees: false -> SIGNAL_UNION, true -> SIGNAL_CORROBORATED."
        default: false
      - name: expected_daily_attendance
        type: integer
        source: computed
        description: "See calculations.team_seat_entitlement step 1: ceil(headcount_planned * expected_days_in_office_per_week / 5)."
        default: 0
      - name: base_entitlement
        type: integer
        source: computed
        description: "See calculations.team_seat_entitlement step 2; equals expected_daily_attendance and is the ONLY input to buffer-tier selection."
        default: 0
      - name: buffer_seats_entitled
        type: integer
        source: computed
        description: "See calculations.team_seat_entitlement step 4: ceil(base_entitlement * buffer_pct of the tier selected from base_entitlement)."
        default: 0
      - name: entitled_seats
        type: integer
        source: computed
        description: "See calculations.team_seat_entitlement step 5: base_entitlement + buffer_seats_entitled. Ceiling on SeatAllocation.allocated_seats for this team."
        default: 0
      - name: escalated_headcount
        type: integer
        source: computed
        description: "count(EscalationCase c JOIN Employee e ON c.employee_id == e.id WHERE e.team_id == this.id AND c.stage IN {COACHING, WRITTEN_WARNING, PERFORMANCE_PLAN, REFERRED})."
        default: 0
      - name: formal_action_count
        type: integer
        source: computed
        description: "count(EscalationCase c JOIN Employee e ON c.employee_id == e.id WHERE e.team_id == this.id AND c.stage IN {WRITTEN_WARNING, PERFORMANCE_PLAN, REFERRED})."
        default: 0

  - name: Employee
    parent: Team
    common_fields: true
    fields:
      - name: team_id
        type: string
        source: input
        description: "FK -> Team.id; the team whose days-in-office expectation applies."
      - name: employee_number
        type: string
        source: input
        description: "Workforce identifier."
        constraints: "1..24 chars; globally unique"
      - name: work_email
        type: string
        source: input
        description: "Contact address for policy communication."
        constraints: "must contain '@'; globally unique"
      - name: home_timezone
        type: string
        source: input
        description: "IANA timezone name recorded for policy communication; not used in any calculation."
      - name: tenure_start_date
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) employment began."
      - name: demographic_band
        type: enum
        source: input
        description: "Aggregation band used solely by calculations.equity_variance for equitable-application monitoring."
        constraints: "one of {BAND_A, BAND_B, BAND_C, BAND_D}"
      - name: manager_user_id
        type: string
        source: input
        description: "Opaque X-User-ID of the PeopleManager who owns this employee's approvals. Compared against the acting X-User-ID for segregation-of-duties checks; never equal to any entity id."
      - name: hr_partner_user_id
        type: string
        source: input
        description: "Opaque X-User-ID of the HRBusinessPartner assigned to this employee."
      - name: disability_accommodation_on_file
        type: boolean
        source: input
        description: "True when an accommodation record already exists; forces interactive_process_required on every exception request regardless of category."
        default: false
      - name: status
        type: enum
        source: system
        description: "Employment participation state."
        default: "ACTIVE"
        constraints: "one of {ACTIVE, ON_LEAVE, SEPARATED}"
      - name: current_eligibility_class
        type: enum
        source: computed
        description: "See calculations.current_eligibility_class. Falls back to ONSITE_REQUIRED when the employee has no APPROVED EligibilityClassification."
        default: "ONSITE_REQUIRED"
        constraints: "one of {FULLY_REMOTE, HYBRID, ONSITE_REQUIRED}"
      - name: cumulative_shortfall_days
        type: integer
        source: computed
        description: "sum(AttendanceWeek.shortfall_days WHERE employee_id == this.id AND status IN {FINALIZED, LOCKED})."
        default: 0
      - name: consecutive_breach_weeks
        type: integer
        source: computed
        description: "See calculations.non_compliance_pressure step 2: the count of most-recent contiguous AttendanceWeek rows with status IN {FINALIZED, LOCKED} and shortfall_days > 0, walking week_start_date DESC and stopping at the first such week whose shortfall_days == 0."
        default: 0
      - name: approved_relief_days_total
        type: integer
        source: computed
        description: "sum(ExceptionRequest.granted_relief_days WHERE employee_id == this.id AND status == APPROVED). Conserved quantity of compensating-invariant relief_day_conservation."
        default: 0
      - name: non_compliance_pressure
        type: number
        source: computed
        description: "See calculations.non_compliance_pressure. Drives compliance_state and the escalation ladder."
        default: 0.00
      - name: compliance_state
        type: enum
        source: computed
        description: "COMPLIANT when non_compliance_pressure == 0.00; AT_RISK when 0.00 < non_compliance_pressure < 2.00; BREACH when non_compliance_pressure >= 2.00."
        default: "COMPLIANT"
        constraints: "one of {COMPLIANT, AT_RISK, BREACH}"
      - name: escalation_stage
        type: enum
        source: computed
        description: "Mirror of the stage of the EscalationCase for this employee whose stage NOT IN {CURED, CLOSED_SEPARATION}; NONE when no such case exists."
        default: "NONE"
        constraints: "one of {NONE, COACHING, WRITTEN_WARNING, PERFORMANCE_PLAN, REFERRED}"

  - name: EligibilityClassification
    parent: Employee
    common_fields: true
    fields:
      - name: employee_id
        type: string
        source: input
        description: "FK -> Employee.id; the employee being classified."
      - name: supersedes_classification_id
        type: string
        source: system
        description: "FK -> EligibilityClassification.id; self-referential link set at creation to the employee's current APPROVED classification (the one selected by calculations.current_eligibility_class), or null when none exists."
        default: null
      - name: requested_class
        type: enum
        source: input
        description: "Role eligibility class being requested."
        constraints: "one of {FULLY_REMOTE, HYBRID, ONSITE_REQUIRED}"
      - name: justification_code
        type: enum
        source: input
        description: "Business justification recorded for audit."
        constraints: "one of {ROLE_DESIGN, EQUIPMENT_BOUND, CUSTOMER_ONSITE, TALENT_RETENTION, ACCOMMODATION_LINKED}"
      - name: effective_from
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) the class takes effect once APPROVED; primary sort key of calculations.current_eligibility_class."
      - name: state
        type: enum
        source: system
        description: "Approval lifecycle state."
        default: "DRAFT"
        constraints: "one of {DRAFT, PENDING_MANAGER, APPROVED, SUPERSEDED}"
      - name: created_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID captured from the caller of POST /eligibility-classifications; the segregation-of-duties check on the decision step forbids this same id from deciding."
      - name: decided_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the PeopleManager who ran the decision step; null before the decision."
        default: null
      - name: decision_note
        type: string
        source: input
        description: "Free-text note recorded on the decision step."
        default: null

  - name: AttendanceWeek
    parent: Employee
    common_fields: true
    fields:
      - name: employee_id
        type: string
        source: input
        description: "FK -> Employee.id; the employee whose week this is."
      - name: iso_week
        type: string
        source: input
        description: "ISO week label, format YYYY-Www (e.g. 2026-W37)."
        constraints: "matches ^\\d{4}-W\\d{2}$; unique per employee_id"
      - name: week_start_date
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) of the Monday of iso_week; the week window is the 7 dates [week_start_date, week_start_date + 6 days]."
        constraints: "must be the Monday of iso_week"
      - name: status
        type: enum
        source: system
        description: "Week accounting state."
        default: "OPEN"
        constraints: "one of {OPEN, FINALIZED, AMENDED, LOCKED}"
      - name: required_days
        type: integer
        source: computed
        description: "See calculations.required_days_for_week. 0 for FULLY_REMOTE, Team.expected_days_in_office_per_week for HYBRID, 5 for ONSITE_REQUIRED, snapshotted at each finalize."
        default: 0
      - name: variant_applied
        type: enum
        source: computed
        description: "Which calculations.credited_office_days variant ran, taken from Team.signal_corroboration_required at finalize time."
        default: "SIGNAL_UNION"
        constraints: "one of {SIGNAL_UNION, SIGNAL_CORROBORATED}"
      - name: credited_days
        type: integer
        source: computed
        description: "See calculations.credited_office_days; 0 until the first finalize."
        default: 0
      - name: relief_days_credited
        type: integer
        source: computed
        description: "See calculations.relief_days_credited; approved exception relief applied to this week."
        default: 0
      - name: shortfall_days
        type: integer
        source: computed
        description: "max(0, required_days - credited_days - relief_days_credited), recomputed at every finalize and at every APPROVED/REVOKED exception cascade that touches this week."
        default: 0
      - name: amendment_reason
        type: string
        source: input
        description: "Reason recorded when the week is reopened for amendment; null before the first amend."
        default: null
      - name: finalized_at
        type: datetime
        source: system
        description: "Logical-clock instant (ISO 8601 UTC, 3 fractional digits) of the most recent finalize; null before the first finalize."
        default: null

  - name: ComplianceSignal
    parent: AttendanceWeek
    common_fields: false
    fields:
      - name: attendance_week_id
        type: string
        source: input
        description: "FK -> AttendanceWeek.id; the week this observation lands in."
      - name: signal_source
        type: enum
        source: input
        description: "Origin of the presence observation."
        constraints: "one of {BADGE, NETWORK, MANUAL_ATTEST}"
      - name: site_code
        type: string
        source: input
        description: "Building or campus code where presence was observed."
        constraints: "1..16 chars"
      - name: observed_date
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) of the observation; must fall inside the parent week window."
      - name: minutes_present
        type: integer
        source: input
        description: "Observed minutes on site. Compared against MIN_PRESENCE_MINUTES for BADGE and NETWORK; ignored for MANUAL_ATTEST."
        constraints: "integer 0..1440"
      - name: dedupe_key
        type: string
        source: input
        description: "Idempotency handle for the upstream feed."
        constraints: "1..64 chars; unique per attendance_week_id"

  - name: ExceptionRequest
    parent: Employee
    common_fields: true
    fields:
      - name: employee_id
        type: string
        source: input
        description: "FK -> Employee.id; the requesting employee."
      - name: category
        type: enum
        source: input
        description: "Basis of the exception request."
        constraints: "one of {MEDICAL, CAREGIVING, DISABILITY_ACCOMMODATION}"
      - name: requested_relief_days
        type: integer
        source: input
        description: "Days-in-office relief the employee asks for per affected week."
        constraints: "integer 1..5"
      - name: start_date
        type: string
        source: input
        description: "First calendar date (YYYY-MM-DD) of the relief window, inclusive."
      - name: end_date
        type: string
        source: input
        description: "Last calendar date (YYYY-MM-DD) of the relief window, inclusive."
        constraints: "must be >= start_date"
      - name: rationale
        type: string
        source: input
        description: "Employee-supplied narrative."
        constraints: "1..1000 chars"
      - name: status
        type: enum
        source: system
        description: "Adjudication state."
        default: "SUBMITTED"
        constraints: "one of {SUBMITTED, INFO_REQUESTED, APPROVED, DENIED, REVOKED, WITHDRAWN}"
      - name: interactive_process_required
        type: boolean
        source: computed
        description: "true when category IN {MEDICAL, DISABILITY_ACCOMMODATION} OR Employee.disability_accommodation_on_file == true; such requests may only be adjudicated by AccommodationSpecialist and block escalation while pending."
        default: false
      - name: granted_relief_days
        type: integer
        source: computed
        description: "Relief days actually granted; 0 unless status == APPROVED, in which case it is the granted_relief_days supplied on the adjudicate step."
        default: 0
      - name: info_needed
        type: string
        source: input
        description: "What the adjudicator asked for on the most recent request-info step; null before the first one."
        default: null
      - name: response_note
        type: string
        source: input
        description: "Employee's most recent reply to an information request; null before the first reply."
        default: null
      - name: info_round_count
        type: integer
        source: computed
        description: "Number of completed INFO_REQUESTED -> SUBMITTED loops; incremented on the respond step."
        default: 0
      - name: adjudicated_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the adjudicator; null before adjudication."
        default: null
      - name: closure_reason
        type: string
        source: input
        description: "Denial reason, revocation reason, or withdrawal reason, whichever terminal step ran last; null while open."
        default: null

  - name: RemoteLocationRequest
    parent: Employee
    common_fields: true
    fields:
      - name: employee_id
        type: string
        source: input
        description: "FK -> Employee.id; the employee proposing a remote work location."
      - name: jurisdiction_code
        type: enum
        source: input
        description: "Tax/licensing jurisdiction of the proposed work location; keys JURISDICTION_BASE_RISK."
        constraints: "one of {US_CA, US_TX, US_NY, IE, IN, BR}"
      - name: data_classification_tier
        type: enum
        source: input
        description: "Highest data classification the role handles; keys TIER_RISK."
        constraints: "one of {PUBLIC, INTERNAL, CONFIDENTIAL, RESTRICTED}"
      - name: proposed_start_date
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) the remote arrangement would begin."
      - name: status
        type: enum
        source: system
        description: "Overall request state; independent of the two review dimensions below."
        default: "SUBMITTED"
        constraints: "one of {SUBMITTED, UNDER_REVIEW, APPROVED, DENIED}"
      - name: tax_review_status
        type: enum
        source: system
        description: "First parallel review dimension, advanced only by POST /remote-location-requests/{request_id}/tax-review."
        default: "PENDING"
        constraints: "one of {PENDING, CLEARED, BLOCKED}"
      - name: security_review_status
        type: enum
        source: system
        description: "Second parallel review dimension, advanced only by POST /remote-location-requests/{request_id}/security-review."
        default: "PENDING"
        constraints: "one of {PENDING, CLEARED, BLOCKED}"
      - name: licensing_gap_count
        type: integer
        source: input
        description: "Professional licensing gaps found by the tax review; 0 until the tax review is recorded."
        default: 0
        constraints: "integer 0..20"
      - name: tax_nexus_registration_cost_cents
        type: integer
        source: input
        description: "One-time registration cost the tax review estimates, in cents; 0 until the tax review is recorded."
        default: 0
        constraints: "integer 0..100000000"
      - name: control_gap_count
        type: integer
        source: input
        description: "Data-security control gaps found by the security review; 0 until the security review is recorded."
        default: 0
        constraints: "integer 0..20"
      - name: preliminary_risk_score
        type: integer
        source: computed
        description: "See calculations.relocation_risk_score variant PRELIMINARY, computed once at creation and never recomputed."
        default: 0
      - name: final_risk_score
        type: integer
        source: computed
        description: "See calculations.relocation_risk_score variant FINAL, computed at the decide step; 0 before the decide step."
        default: 0
      - name: decision_reason
        type: string
        source: computed
        description: "Machine reason recorded by the decide step."
        default: null
        constraints: "one of {BOTH_REVIEWS_CLEARED, REVIEW_BLOCKED, RISK_CEILING_REACHED} or null"

  - name: Neighborhood
    parent: PolicyCycle
    common_fields: true
    fields:
      - name: policy_cycle_id
        type: string
        source: input
        description: "FK -> PolicyCycle.id; the cycle this floor plan belongs to."
      - name: anchor_team_id
        type: string
        source: input
        description: "FK -> Team.id; the team this neighborhood is designed around; first ranking key of calculations.desk_selector."
      - name: neighborhood_code
        type: string
        source: input
        description: "Floor-plan zone code."
        constraints: "1..24 chars; unique per policy_cycle_id"
      - name: site_code
        type: string
        source: input
        description: "Building or campus code."
        constraints: "1..16 chars"
      - name: seat_count
        type: integer
        source: input
        description: "Physical seats in the zone."
        constraints: "integer 1..500"
      - name: buffer_seats
        type: integer
        source: input
        description: "Seats held back from allocation. Effective capacity is seat_count - buffer_seats."
        constraints: "integer 0..seat_count - 1"
      - name: desk_index_from
        type: integer
        source: input
        description: "Lowest desk index in the zone, inclusive."
        constraints: "integer >= 1"
      - name: desk_index_to
        type: integer
        source: input
        description: "Highest desk index in the zone, inclusive."
        constraints: "integer >= desk_index_from; desk_index_to - desk_index_from + 1 must equal seat_count"
      - name: committed_seats
        type: integer
        source: computed
        description: "sum(SeatAllocation.allocated_seats WHERE neighborhood_id == this.id AND status == COMMITTED AND the half-open week window [window_start_week, window_end_week) contains the current ISO week of the logical clock). Conserved quantity of compensating-invariant seat_conservation."
        default: 0
      - name: peak_committed_seats
        type: integer
        source: computed
        description: "See calculations.neighborhood_peak_load; the largest single-week committed load anywhere in the cycle window."
        default: 0
      - name: utilization_pct
        type: number
        source: computed
        description: "round_half_up(100 * peak_committed_seats / (seat_count - buffer_seats), 2)."
        default: 0.00
      - name: allocation_state
        type: enum
        source: computed
        description: "FROZEN when the parent PolicyCycle.posture == LOCKED; else TIGHT when utilization_pct >= 90.00; else OPEN."
        default: "OPEN"
        constraints: "one of {OPEN, TIGHT, FROZEN}"

  - name: SeatAllocation
    parent: Neighborhood
    common_fields: true
    fields:
      - name: neighborhood_id
        type: string
        source: input
        description: "FK -> Neighborhood.id; the zone seats are drawn from."
      - name: team_id
        type: string
        source: input
        description: "FK -> Team.id; the team the seats are allocated to."
      - name: allocated_seats
        type: integer
        source: input
        description: "Seats reserved for the team across the week window."
        constraints: "integer 1..500; must be <= Team.entitled_seats"
      - name: window_start_week
        type: string
        source: input
        description: "ISO week label (YYYY-Www) the window opens on, INCLUSIVE."
        constraints: "matches ^\\d{4}-W\\d{2}$"
      - name: window_end_week
        type: string
        source: input
        description: "ISO week label (YYYY-Www) the window closes on, EXCLUSIVE. The window is the half-open ISO-week interval [window_start_week, window_end_week)."
        constraints: "matches ^\\d{4}-W\\d{2}$; must be strictly after window_start_week"
      - name: status
        type: enum
        source: system
        description: "Allocation lifecycle state. Only COMMITTED allocations consume capacity."
        default: "RESERVED"
        constraints: "one of {RESERVED, COMMITTED, RELEASED}"
      - name: weeks_in_window
        type: integer
        source: computed
        description: "Count of ISO weeks in the half-open interval [window_start_week, window_end_week)."
        default: 0
      - name: line_chargeback_cents
        type: integer
        source: computed
        description: "See calculations.space_chargeback_cents step 1; the per-allocation rounded line amount. 0 while status != COMMITTED."
        default: 0
      - name: release_reason
        type: string
        source: input
        description: "Reason recorded on the release step; null while not RELEASED."
        default: null

  - name: DeskAssignment
    parent: SeatAllocation
    common_fields: true
    fields:
      - name: seat_allocation_id
        type: string
        source: input
        description: "FK -> SeatAllocation.id; the committed allocation this desk is drawn from."
      - name: employee_id
        type: string
        source: input
        description: "FK -> Employee.id; the occupant."
      - name: desk_index
        type: integer
        source: input
        description: "Desk number inside the allocation's neighborhood; must be within [Neighborhood.desk_index_from, Neighborhood.desk_index_to]."
        constraints: "integer >= 1"
      - name: start_date
        type: string
        source: input
        description: "First occupancy date (YYYY-MM-DD), inclusive."
      - name: end_date
        type: string
        source: input
        description: "Last occupancy date (YYYY-MM-DD), inclusive. Occupancy is the CLOSED interval [start_date, end_date]."
        constraints: "must be >= start_date"
      - name: status
        type: enum
        source: system
        description: "Occupancy state."
        default: "ASSIGNED"
        constraints: "one of {ASSIGNED, VACATED}"
      - name: assignment_mode
        type: enum
        source: system
        description: "MANUAL when created by POST /desk-assignments; AUTO when created by POST /desk-assignments/auto."
        default: "MANUAL"
        constraints: "one of {MANUAL, AUTO}"
      - name: vacated_at
        type: datetime
        source: system
        description: "Logical-clock instant (ISO 8601 UTC, 3 fractional digits) the desk was vacated; null while ASSIGNED."
        default: null

  - name: EscalationCase
    parent: Employee
    common_fields: true
    fields:
      - name: employee_id
        type: string
        source: input
        description: "FK -> Employee.id; the employee under escalation."
      - name: prior_case_id
        type: string
        source: system
        description: "FK -> EscalationCase.id; self-referential link to the most recently CURED case for the same employee (ordered by created_at DESC), or null when this is the first case."
        default: null
      - name: stage
        type: enum
        source: system
        description: "Position on the escalation ladder."
        default: "COACHING"
        constraints: "one of {COACHING, WRITTEN_WARNING, PERFORMANCE_PLAN, REFERRED, CURED, CLOSED_SEPARATION}"
      - name: opened_pressure
        type: number
        source: system
        description: "Employee.non_compliance_pressure captured at the instant the case was auto-opened."
        default: 0.00
      - name: discretionary_hold
        type: boolean
        source: system
        description: "Set true by POST /escalation-cases/{case_id}/escalate and cleared by POST /escalation-cases/{case_id}/de-escalate. While true, pressure-driven cascades leave stage untouched."
        default: false
      - name: last_action_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the last manual escalate or de-escalate caller; null when only cascades have moved the case."
        default: null
      - name: action_note
        type: string
        source: input
        description: "Note recorded on the last manual escalate or de-escalate step."
        default: null

  - name: RecalibrationReview
    parent: PolicyCycle
    common_fields: true
    fields:
      - name: policy_cycle_id
        type: string
        source: input
        description: "FK -> PolicyCycle.id; the cycle being recalibrated."
      - name: review_label
        type: string
        source: input
        description: "Label for this recalibration pass."
        constraints: "1..40 chars; unique per policy_cycle_id"
      - name: proposed_days_in_office_delta
        type: integer
        source: input
        description: "Signed change to every Team.expected_days_in_office_per_week applied on adoption."
        constraints: "integer -2..2"
      - name: state
        type: enum
        source: system
        description: "Review lifecycle state."
        default: "DRAFT"
        constraints: "one of {DRAFT, SUBMITTED, ADOPTED, REJECTED}"
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the caller who moved the review to SUBMITTED; null while DRAFT. Compared against the decision caller for segregation of duties."
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: "X-User-ID of the caller who recorded the adoption decision; null until then."
        default: null
      - name: collaboration_index
        type: number
        source: computed
        description: "See calculations.collaboration_index; 0.00 before the submit step."
        default: 0.00
      - name: meets_collaboration_target
        type: boolean
        source: computed
        description: "collaboration_index >= PolicyCycle.collaboration_target_score."
        default: false
      - name: total_space_chargeback_cents
        type: integer
        source: computed
        description: "See calculations.space_chargeback_cents; 0 before the submit step."
        default: 0
      - name: equity_variance_pct
        type: number
        source: computed
        description: "See calculations.equity_variance; 0.00 before the submit step."
        default: 0.00
      - name: equity_flag
        type: boolean
        source: computed
        description: "equity_variance_pct > PolicyCycle.equity_variance_threshold_pct (strict greater-than)."
        default: false
      - name: qualifying_band_count
        type: integer
        source: computed
        description: "Number of demographic bands with at least MIN_BAND_N ACTIVE employees in the cycle; fewer than 2 forces equity_variance_pct to 0.00."
        default: 0
      - name: decision_reason
        type: string
        source: input
        description: "Reason recorded on the decision step; null before it."
        default: null

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:

  - entity: PolicyCycle
    initial_state: OPEN
    terminal_states: [LOCKED]
    transitions:
      - from: OPEN
        to: RECALIBRATING
        trigger: "POST /policy-cycles/{cycle_id}/posture with target_posture=RECALIBRATING"
        actor: WorkplaceProgramOffice
        preconditions:
          - "posture == OPEN"
        side_effects:
          - "posture := RECALIBRATING"
          - "increments PolicyCycle.version by 1"
      - from: RECALIBRATING
        to: OPEN
        trigger: "POST /policy-cycles/{cycle_id}/posture with target_posture=OPEN"
        actor: WorkplaceProgramOffice
        preconditions:
          - "posture == RECALIBRATING"
        side_effects:
          - "posture := OPEN"
          - "increments PolicyCycle.version by 1"
        note: "Cyclic edge: OPEN -> RECALIBRATING -> OPEN is the recalibration round."
      - from: OPEN
        to: LOCKED
        trigger: "POST /policy-cycles/{cycle_id}/posture with target_posture=LOCKED"
        actor: WorkplaceProgramOffice
        preconditions:
          - "posture == OPEN"
        side_effects:
          - "posture := LOCKED"
          - "every Neighborhood WHERE policy_cycle_id == this.id recomputes allocation_state, which becomes FROZEN because the parent posture is LOCKED"
          - "every AttendanceWeek of every Employee on a Team in this cycle whose status == FINALIZED transitions to LOCKED"
          - "increments PolicyCycle.version by 1"
      - from: RECALIBRATING
        to: LOCKED
        trigger: "POST /policy-cycles/{cycle_id}/posture with target_posture=LOCKED"
        actor: WorkplaceProgramOffice
        preconditions:
          - "posture == RECALIBRATING"
        side_effects:
          - "posture := LOCKED"
          - "every Neighborhood WHERE policy_cycle_id == this.id recomputes allocation_state to FROZEN"
          - "every AttendanceWeek of every Employee on a Team in this cycle whose status == FINALIZED transitions to LOCKED"
          - "increments PolicyCycle.version by 1"

  - entity: Employee
    initial_state: ACTIVE
    terminal_states: [SEPARATED]
    transitions:
      - from: ACTIVE
        to: ON_LEAVE
        trigger: "POST /employees/{employee_id}/status with target_status=ON_LEAVE"
        actor: HRBusinessPartner
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "status := ON_LEAVE"
          - "PolicyCycle.aggregate_compliance_rate recomputed because the ACTIVE denominator shrank"
          - "increments Employee.version by 1"
      - from: ON_LEAVE
        to: ACTIVE
        trigger: "POST /employees/{employee_id}/status with target_status=ACTIVE"
        actor: HRBusinessPartner
        preconditions:
          - "status == ON_LEAVE"
        side_effects:
          - "status := ACTIVE"
          - "PolicyCycle.aggregate_compliance_rate recomputed"
          - "increments Employee.version by 1"
        note: "Cyclic edge ACTIVE -> ON_LEAVE -> ACTIVE."
      - from: ACTIVE
        to: SEPARATED
        trigger: "POST /employees/{employee_id}/status with target_status=SEPARATED"
        actor: HRBusinessPartner
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "status := SEPARATED"
          - "every DeskAssignment WHERE employee_id == this.id AND status == ASSIGNED transitions to VACATED with vacated_at := logical clock now"
          - "the EscalationCase WHERE employee_id == this.id AND stage NOT IN {CURED, CLOSED_SEPARATION}, if any, transitions to CLOSED_SEPARATION; that stage change decrements Team.escalated_headcount and, when the case was in {WRITTEN_WARNING, PERFORMANCE_PLAN, REFERRED}, Team.formal_action_count, which in turn decrements PolicyCycle.formal_action_total"
          - "PolicyCycle.aggregate_compliance_rate recomputed"
          - "increments Employee.version by 1"
      - from: ON_LEAVE
        to: SEPARATED
        trigger: "POST /employees/{employee_id}/status with target_status=SEPARATED"
        actor: HRBusinessPartner
        preconditions:
          - "status == ON_LEAVE"
        side_effects:
          - "status := SEPARATED"
          - "same cascade as ACTIVE -> SEPARATED"
          - "increments Employee.version by 1"

  - entity: EligibilityClassification
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PENDING_MANAGER
        trigger: "POST /eligibility-classifications/{classification_id}/submit"
        actor: PeopleManager | HRBusinessPartner
        preconditions:
          - "state == DRAFT"
          - "Employee.status == ACTIVE"
          - "parent PolicyCycle.posture == OPEN"
        side_effects:
          - "state := PENDING_MANAGER"
          - "increments EligibilityClassification.version by 1"
      - from: PENDING_MANAGER
        to: APPROVED
        trigger: "POST /eligibility-classifications/{classification_id}/decision with decision=APPROVE"
        actor: PeopleManager
        preconditions:
          - "state == PENDING_MANAGER"
          - "parent PolicyCycle.posture == OPEN"
          - "acting X-User-ID == Employee.manager_user_id"
          - "acting X-User-ID != EligibilityClassification.created_by_user_id (segregation of duties)"
        side_effects:
          - "state := APPROVED; decided_by_user_id := acting X-User-ID"
          - "the EligibilityClassification identified by supersedes_classification_id, when not null, transitions APPROVED -> SUPERSEDED"
          - "Employee.current_eligibility_class recomputed via calculations.current_eligibility_class"
          - "Employee.non_compliance_pressure and compliance_state recomputed because the SEVERITY_MULTIPLIER keyed on current_eligibility_class changed"
          - "increments EligibilityClassification.version by 1"
      - from: PENDING_MANAGER
        to: DRAFT
        trigger: "POST /eligibility-classifications/{classification_id}/decision with decision=REVISE"
        actor: PeopleManager
        preconditions:
          - "state == PENDING_MANAGER"
          - "parent PolicyCycle.posture == OPEN"
          - "acting X-User-ID == Employee.manager_user_id"
          - "acting X-User-ID != EligibilityClassification.created_by_user_id (segregation of duties)"
        side_effects:
          - "state := DRAFT; decided_by_user_id := acting X-User-ID; decision_note := supplied note"
          - "increments EligibilityClassification.version by 1"
        note: "Revert edge; the draft can be resubmitted, giving DRAFT -> PENDING_MANAGER -> DRAFT."
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system: a newer EligibilityClassification for the same employee whose supersedes_classification_id == this.id reaches APPROVED"
        actor: system
        preconditions:
          - "state == APPROVED"
        side_effects:
          - "state := SUPERSEDED"
          - "increments EligibilityClassification.version by 1"

  - entity: AttendanceWeek
    initial_state: OPEN
    terminal_states: [LOCKED]
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: "POST /attendance-weeks/{week_id}/finalize"
        actor: SystemIntegration | HRBusinessPartner | PeopleManager
        preconditions:
          - "status == OPEN"
          - "parent Employee.status IN {ACTIVE, ON_LEAVE}"
          - "PolicyCycle.posture IN {OPEN, RECALIBRATING}"
        side_effects:
          - "LINK 1: status := FINALIZED; finalized_at := logical clock now; required_days := calculations.required_days_for_week; variant_applied := SIGNAL_CORROBORATED when Team.signal_corroboration_required else SIGNAL_UNION; credited_days := calculations.credited_office_days; relief_days_credited := calculations.relief_days_credited; shortfall_days := max(0, required_days - credited_days - relief_days_credited)"
          - "LINK 2: because this week became FINALIZED, Employee.cumulative_shortfall_days, Employee.consecutive_breach_weeks, Employee.non_compliance_pressure and Employee.compliance_state are recomputed"
          - "LINK 3: because Employee.compliance_state became BREACH and no EscalationCase for the employee has stage NOT IN {CURED, CLOSED_SEPARATION}, a new EscalationCase is created with stage := COACHING, opened_pressure := Employee.non_compliance_pressure, discretionary_hold := false and prior_case_id := the id of the most recent CURED case for this employee ordered by created_at DESC (null when none); Employee.escalation_stage becomes COACHING and Team.escalated_headcount increments by 1"
          - "LINK 4: because that case exists with discretionary_hold == false, its stage is set to calculations.pressure_derived_stage of the employee's non_compliance_pressure, so a pressure of 4.00 or more moves it COACHING -> WRITTEN_WARNING in the same cascade"
          - "LINK 5: because the case's stage entered the formal-action band {WRITTEN_WARNING, PERFORMANCE_PLAN, REFERRED}, Team.formal_action_count increments by 1"
          - "LINK 6: because Team.formal_action_count changed, PolicyCycle.formal_action_total is recomputed as sum(Team.formal_action_count) over the cycle's teams and PolicyCycle.aggregate_compliance_rate is recomputed"
          - "increments AttendanceWeek.version by 1"
        note: "Depth-6 transitive cascade transitive_cascade/finalize_week_to_cycle_formal_action_total. Each LINK is caused by the previous LINK, not by the finalize call."
      - from: FINALIZED
        to: AMENDED
        trigger: "POST /attendance-weeks/{week_id}/amend"
        actor: HRBusinessPartner
        preconditions:
          - "status == FINALIZED"
          - "PolicyCycle.posture IN {OPEN, RECALIBRATING}"
        side_effects:
          - "status := AMENDED; amendment_reason := supplied reason"
          - "shortfall_days := 0, credited_days := 0, relief_days_credited := 0 (the week stops contributing while amended)"
          - "Employee.cumulative_shortfall_days, consecutive_breach_weeks, non_compliance_pressure and compliance_state recomputed"
          - "the employee's EscalationCase with stage NOT IN {CURED, CLOSED_SEPARATION} and discretionary_hold == false has stage set to calculations.pressure_derived_stage; when that value is CURED the case becomes CURED and Team.escalated_headcount / Team.formal_action_count / PolicyCycle.formal_action_total decrement accordingly"
          - "increments AttendanceWeek.version by 1"
      - from: AMENDED
        to: FINALIZED
        trigger: "POST /attendance-weeks/{week_id}/finalize"
        actor: SystemIntegration | HRBusinessPartner | PeopleManager
        preconditions:
          - "status == AMENDED"
          - "parent Employee.status IN {ACTIVE, ON_LEAVE}"
          - "PolicyCycle.posture IN {OPEN, RECALIBRATING}"
        side_effects:
          - "identical LINK 1..LINK 6 cascade as OPEN -> FINALIZED, recomputed against the signals present now"
          - "increments AttendanceWeek.version by 1"
        note: "Cyclic edge FINALIZED -> AMENDED -> FINALIZED; the week can be re-finalized any number of times."
      - from: FINALIZED
        to: LOCKED
        trigger: "system: parent PolicyCycle.posture becomes LOCKED"
        actor: system
        preconditions:
          - "status == FINALIZED"
        side_effects:
          - "status := LOCKED (still counted by Employee.cumulative_shortfall_days)"
          - "increments AttendanceWeek.version by 1"

  - entity: ExceptionRequest
    initial_state: SUBMITTED
    terminal_states: [DENIED, REVOKED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: INFO_REQUESTED
        trigger: "POST /exception-requests/{request_id}/request-info"
        actor: AccommodationSpecialist | HRBusinessPartner
        preconditions:
          - "status == SUBMITTED"
          - "when interactive_process_required == true the actor MUST be AccommodationSpecialist"
        side_effects:
          - "status := INFO_REQUESTED; info_needed := supplied text"
          - "increments ExceptionRequest.version by 1"
      - from: INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /exception-requests/{request_id}/respond"
        actor: Employee | PeopleManager | HRBusinessPartner
        preconditions:
          - "status == INFO_REQUESTED"
          - "when the actor role is Employee, acting X-User-ID MUST equal ExceptionRequest.employee_id"
        side_effects:
          - "status := SUBMITTED; response_note := supplied text; info_round_count increments by 1"
          - "increments ExceptionRequest.version by 1"
        note: "Cyclic edge SUBMITTED -> INFO_REQUESTED -> SUBMITTED; unbounded negotiation rounds, counted by info_round_count."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /exception-requests/{request_id}/adjudicate with decision=APPROVE"
        actor: AccommodationSpecialist | HRBusinessPartner
        preconditions:
          - "status == SUBMITTED"
          - "when interactive_process_required == true the actor MUST be AccommodationSpecialist"
          - "granted_relief_days <= requested_relief_days"
          - "when interactive_process_required == true, info_round_count MUST be >= 1"
          - "no other ExceptionRequest of the same employee with the same category and status == APPROVED has a [start_date, end_date] closed interval intersecting this one"
        side_effects:
          - "LINK 1: status := APPROVED; granted_relief_days := supplied value; adjudicated_by_user_id := acting X-User-ID"
          - "LINK 2: because this request became APPROVED, Employee.approved_relief_days_total is recomputed"
          - "LINK 3: because the employee's approved relief changed, every AttendanceWeek of this employee with status IN {FINALIZED, LOCKED} whose 7-date window intersects [start_date, end_date] recomputes relief_days_credited and shortfall_days, processed in week_start_date ASC order"
          - "LINK 4: because those weeks' shortfall_days changed, Employee.cumulative_shortfall_days, consecutive_breach_weeks, non_compliance_pressure and compliance_state are recomputed"
          - "LINK 5: because the employee's pressure changed, the EscalationCase with stage NOT IN {CURED, CLOSED_SEPARATION} and discretionary_hold == false has stage set to calculations.pressure_derived_stage; leaving the formal-action band decrements Team.formal_action_count and therefore PolicyCycle.formal_action_total"
          - "increments ExceptionRequest.version by 1"
        note: "Depth-5 transitive cascade transitive_cascade/approve_exception_to_escalation_deescalation, originating from a different transition than the finalize cascade."
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /exception-requests/{request_id}/adjudicate with decision=DENY"
        actor: AccommodationSpecialist | HRBusinessPartner
        preconditions:
          - "status == SUBMITTED"
          - "when interactive_process_required == true the actor MUST be AccommodationSpecialist"
        side_effects:
          - "status := DENIED; closure_reason := supplied closure_reason; adjudicated_by_user_id := acting X-User-ID; granted_relief_days stays 0"
          - "increments ExceptionRequest.version by 1"
      - from: APPROVED
        to: REVOKED
        trigger: "POST /exception-requests/{request_id}/revoke"
        actor: AccommodationSpecialist
        preconditions:
          - "status == APPROVED"
        side_effects:
          - "status := REVOKED; closure_reason := supplied closure_reason; granted_relief_days := 0"
          - "Employee.approved_relief_days_total recomputed (compensation of LINK 2 above)"
          - "the same AttendanceWeek set as the approve cascade recomputes relief_days_credited and shortfall_days in week_start_date ASC order"
          - "Employee.cumulative_shortfall_days, consecutive_breach_weeks, non_compliance_pressure and compliance_state recomputed"
          - "the open EscalationCase with discretionary_hold == false has stage set to calculations.pressure_derived_stage; re-entering the formal-action band re-increments Team.formal_action_count and PolicyCycle.formal_action_total"
          - "increments ExceptionRequest.version by 1"
        note: "Compensating action of the APPROVE transition; conserves Employee.approved_relief_days_total and PolicyCycle.formal_action_total."
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /exception-requests/{request_id}/adjudicate with decision=WITHDRAW"
        actor: AccommodationSpecialist | HRBusinessPartner
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "status := WITHDRAWN; closure_reason := supplied closure_reason"
          - "increments ExceptionRequest.version by 1"
      - from: INFO_REQUESTED
        to: WITHDRAWN
        trigger: "POST /exception-requests/{request_id}/adjudicate with decision=WITHDRAW"
        actor: AccommodationSpecialist | HRBusinessPartner
        preconditions:
          - "status == INFO_REQUESTED"
        side_effects:
          - "status := WITHDRAWN; closure_reason := supplied closure_reason"
          - "increments ExceptionRequest.version by 1"

  - entity: RemoteLocationRequest
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /remote-location-requests/{request_id}/tax-review OR POST /remote-location-requests/{request_id}/security-review — whichever review is recorded first"
        actor: HRBusinessPartner | WorkplaceProgramOffice (tax-review) | ComplianceAuditor | WorkplaceProgramOffice (security-review)
        preconditions:
          - "status == SUBMITTED"
          - "the dimension being written (tax_review_status for tax-review, security_review_status for security-review) == PENDING"
        side_effects:
          - "status := UNDER_REVIEW"
          - "tax-review sets tax_review_status := CLEARED|BLOCKED and stores licensing_gap_count and tax_nexus_registration_cost_cents; security-review sets security_review_status := CLEARED|BLOCKED and stores control_gap_count"
          - "increments RemoteLocationRequest.version by 1"
        note: "Fork point of the parallel review dimensions; the two dimensions advance independently and in either order."
      - from: UNDER_REVIEW
        to: UNDER_REVIEW
        trigger: "the OTHER of POST /remote-location-requests/{request_id}/tax-review, POST /remote-location-requests/{request_id}/security-review"
        actor: HRBusinessPartner | WorkplaceProgramOffice (tax-review) | ComplianceAuditor | WorkplaceProgramOffice (security-review)
        preconditions:
          - "status == UNDER_REVIEW"
          - "the dimension being written == PENDING"
        side_effects:
          - "the second dimension leaves PENDING; status is unchanged"
          - "increments RemoteLocationRequest.version by 1"
        note: "Parallel-dimension self-loop: tax_review_status x security_review_status evolve on the same row without moving status."
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /remote-location-requests/{request_id}/decide"
        actor: WorkplaceProgramOffice
        preconditions:
          - "status == UNDER_REVIEW"
          - "tax_review_status != PENDING AND security_review_status != PENDING (join condition)"
          - "tax_review_status == CLEARED AND security_review_status == CLEARED"
          - "data_classification_tier == RESTRICTED implies jurisdiction_code IN ALLOWED_RESTRICTED_JURISDICTIONS"
          - "calculations.relocation_risk_score variant FINAL < APPROVAL_RISK_CEILING"
        side_effects:
          - "final_risk_score := calculations.relocation_risk_score variant FINAL"
          - "status := APPROVED; decision_reason := BOTH_REVIEWS_CLEARED"
          - "increments RemoteLocationRequest.version by 1"
        note: "Join point of the fork; the APPROVED branch runs a different side-effect set than the DENIED branch."
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /remote-location-requests/{request_id}/decide"
        actor: WorkplaceProgramOffice
        preconditions:
          - "status == UNDER_REVIEW"
          - "tax_review_status != PENDING AND security_review_status != PENDING (join condition)"
          - "tax_review_status == BLOCKED OR security_review_status == BLOCKED OR calculations.relocation_risk_score variant FINAL >= APPROVAL_RISK_CEILING"
        side_effects:
          - "final_risk_score := calculations.relocation_risk_score variant FINAL"
          - "status := DENIED; decision_reason := REVIEW_BLOCKED when either dimension is BLOCKED, else RISK_CEILING_REACHED"
          - "increments RemoteLocationRequest.version by 1"

  - entity: SeatAllocation
    initial_state: RESERVED
    terminal_states: [RELEASED]
    transitions:
      - from: RESERVED
        to: COMMITTED
        trigger: "POST /seat-allocations/{allocation_id}/commit"
        actor: WorkplaceProgramOffice
        preconditions:
          - "status == RESERVED"
          - "parent Neighborhood.allocation_state != FROZEN"
          - "for every ISO week w in the half-open interval [window_start_week, window_end_week): sum(allocated_seats of SeatAllocation rows on the same neighborhood_id with status == COMMITTED whose half-open window contains w) + this.allocated_seats <= Neighborhood.seat_count - Neighborhood.buffer_seats"
        side_effects:
          - "status := COMMITTED; line_chargeback_cents := calculations.space_chargeback_cents step 1 for this allocation"
          - "Neighborhood.committed_seats, peak_committed_seats, utilization_pct and allocation_state recomputed"
          - "increments SeatAllocation.version by 1"
      - from: RESERVED
        to: RELEASED
        trigger: "POST /seat-allocations/{allocation_id}/release"
        actor: WorkplaceProgramOffice
        preconditions:
          - "status == RESERVED"
        side_effects:
          - "status := RELEASED; release_reason := supplied reason"
          - "increments SeatAllocation.version by 1"
      - from: COMMITTED
        to: RELEASED
        trigger: "POST /seat-allocations/{allocation_id}/release"
        actor: WorkplaceProgramOffice
        preconditions:
          - "status == COMMITTED"
        side_effects:
          - "status := RELEASED; release_reason := supplied reason; line_chargeback_cents := 0"
          - "every DeskAssignment WHERE seat_allocation_id == this.id AND status == ASSIGNED transitions to VACATED with vacated_at := logical clock now"
          - "Neighborhood.committed_seats, peak_committed_seats, utilization_pct and allocation_state recomputed"
          - "increments SeatAllocation.version by 1"
        note: "Compensating action of COMMIT; conserves Neighborhood.committed_seats exactly."

  - entity: DeskAssignment
    initial_state: ASSIGNED
    terminal_states: [VACATED]
    transitions:
      - from: ASSIGNED
        to: VACATED
        trigger: "POST /desk-assignments/{assignment_id}/vacate"
        actor: WorkplaceProgramOffice
        preconditions:
          - "status == ASSIGNED"
        side_effects:
          - "status := VACATED; vacated_at := logical clock now"
          - "the desk_index becomes available to calculations.desk_selector for overlapping date ranges"
          - "increments DeskAssignment.version by 1"
      - from: ASSIGNED
        to: VACATED
        trigger: "system: parent SeatAllocation transitions COMMITTED -> RELEASED, or parent Employee transitions to SEPARATED"
        actor: system
        preconditions:
          - "status == ASSIGNED"
        side_effects:
          - "status := VACATED; vacated_at := logical clock now"
          - "increments DeskAssignment.version by 1"

  - entity: EscalationCase
    initial_state: COACHING
    terminal_states: [CURED, CLOSED_SEPARATION]
    note: "The system-cascade trigger listed on the rungs below assigns stage := calculations.pressure_derived_stage in ONE step, so a single finalize / amend / exception cascade may move the case more than one rung at a time (COACHING straight to PERFORMANCE_PLAN when the recomputed pressure is 7.00 or more, or PERFORMANCE_PLAN straight to CURED when it falls under 2.00). Such a multi-rung move is the composition of the rungs it passes through, and its counter side effects are computed ONCE from band entry/exit: Team.escalated_headcount changes only on entry to a terminal stage, and Team.formal_action_count changes only when the case crosses the boundary of the formal-action band {WRITTEN_WARNING, PERFORMANCE_PLAN, REFERRED} — never once per rung skipped. The MANUAL escalate / de-escalate triggers always move exactly one rung."
    transitions:
      - from: COACHING
        to: WRITTEN_WARNING
        trigger: "system: a finalize / amend / exception cascade sets stage := calculations.pressure_derived_stage while discretionary_hold == false; OR POST /escalation-cases/{case_id}/escalate"
        actor: system | HRBusinessPartner
        preconditions:
          - "stage == COACHING"
          - "for the manual path: actor is HRBusinessPartner AND acting X-User-ID != Employee.manager_user_id (segregation of duties) AND no ExceptionRequest of the employee has status IN {SUBMITTED, INFO_REQUESTED} with interactive_process_required == true"
        side_effects:
          - "stage := WRITTEN_WARNING; on the manual path discretionary_hold := true, last_action_by_user_id := acting X-User-ID and action_note := supplied note"
          - "Employee.escalation_stage := WRITTEN_WARNING"
          - "Team.formal_action_count increments by 1 because the stage entered the formal-action band"
          - "PolicyCycle.formal_action_total recomputed"
          - "increments EscalationCase.version by 1"
      - from: WRITTEN_WARNING
        to: COACHING
        trigger: "system: a cascade sets stage := calculations.pressure_derived_stage == COACHING while discretionary_hold == false; OR POST /escalation-cases/{case_id}/de-escalate"
        actor: system | PeopleManager
        preconditions:
          - "stage == WRITTEN_WARNING"
          - "for the manual path: actor is PeopleManager AND acting X-User-ID == Employee.manager_user_id"
        side_effects:
          - "stage := COACHING; on the manual path discretionary_hold := false, last_action_by_user_id := acting X-User-ID and action_note := supplied note"
          - "Employee.escalation_stage := COACHING"
          - "Team.formal_action_count decrements by 1 because the stage left the formal-action band"
          - "PolicyCycle.formal_action_total recomputed"
          - "increments EscalationCase.version by 1"
        note: "Cyclic edge COACHING -> WRITTEN_WARNING -> COACHING; the ladder walks up and down without a terminal step."
      - from: WRITTEN_WARNING
        to: PERFORMANCE_PLAN
        trigger: "system: cascade sets stage := PERFORMANCE_PLAN while discretionary_hold == false; OR POST /escalation-cases/{case_id}/escalate"
        actor: system | HRBusinessPartner
        preconditions:
          - "stage == WRITTEN_WARNING"
          - "for the manual path: actor is HRBusinessPartner AND acting X-User-ID != Employee.manager_user_id AND no ExceptionRequest of the employee has status IN {SUBMITTED, INFO_REQUESTED} with interactive_process_required == true"
        side_effects:
          - "stage := PERFORMANCE_PLAN; manual path sets discretionary_hold := true"
          - "Employee.escalation_stage := PERFORMANCE_PLAN"
          - "Team.formal_action_count unchanged (already inside the formal-action band)"
          - "increments EscalationCase.version by 1"
      - from: PERFORMANCE_PLAN
        to: WRITTEN_WARNING
        trigger: "system: cascade sets stage := WRITTEN_WARNING while discretionary_hold == false; OR POST /escalation-cases/{case_id}/de-escalate"
        actor: system | PeopleManager
        preconditions:
          - "stage == PERFORMANCE_PLAN"
          - "for the manual path: actor is PeopleManager AND acting X-User-ID == Employee.manager_user_id"
        side_effects:
          - "stage := WRITTEN_WARNING; manual path sets discretionary_hold := false"
          - "Employee.escalation_stage := WRITTEN_WARNING"
          - "increments EscalationCase.version by 1"
      - from: PERFORMANCE_PLAN
        to: REFERRED
        trigger: "system: cascade sets stage := REFERRED while discretionary_hold == false; OR POST /escalation-cases/{case_id}/escalate"
        actor: system | HRBusinessPartner
        preconditions:
          - "stage == PERFORMANCE_PLAN"
          - "for the manual path: actor is HRBusinessPartner AND acting X-User-ID != Employee.manager_user_id AND no ExceptionRequest of the employee has status IN {SUBMITTED, INFO_REQUESTED} with interactive_process_required == true"
        side_effects:
          - "stage := REFERRED"
          - "Employee.escalation_stage := REFERRED"
          - "increments EscalationCase.version by 1"
      - from: COACHING
        to: CURED
        trigger: "system: a finalize / amend / exception cascade sets stage := calculations.pressure_derived_stage == CURED while discretionary_hold == false"
        actor: system
        preconditions:
          - "stage == COACHING"
          - "discretionary_hold == false"
        side_effects:
          - "stage := CURED"
          - "Employee.escalation_stage := NONE"
          - "Team.escalated_headcount decrements by 1"
          - "PolicyCycle.aggregate_compliance_rate recomputed"
          - "increments EscalationCase.version by 1"
        note: "A later breach opens a NEW case whose prior_case_id points at this one."
      - from: WRITTEN_WARNING
        to: CURED
        trigger: "system: cascade sets stage := CURED while discretionary_hold == false"
        actor: system
        preconditions:
          - "stage == WRITTEN_WARNING"
          - "discretionary_hold == false"
        side_effects:
          - "stage := CURED"
          - "Employee.escalation_stage := NONE"
          - "Team.escalated_headcount decrements by 1; Team.formal_action_count decrements by 1"
          - "PolicyCycle.formal_action_total recomputed; PolicyCycle.aggregate_compliance_rate recomputed"
          - "increments EscalationCase.version by 1"
      - from: COACHING
        to: CLOSED_SEPARATION
        trigger: "system: parent Employee transitions to SEPARATED"
        actor: system
        preconditions:
          - "stage == COACHING"
        side_effects:
          - "stage := CLOSED_SEPARATION"
          - "Employee.escalation_stage := NONE; Team.escalated_headcount decrements by 1"
          - "increments EscalationCase.version by 1"
      - from: WRITTEN_WARNING
        to: CLOSED_SEPARATION
        trigger: "system: parent Employee transitions to SEPARATED"
        actor: system
        preconditions:
          - "stage == WRITTEN_WARNING"
        side_effects:
          - "stage := CLOSED_SEPARATION"
          - "Employee.escalation_stage := NONE; Team.escalated_headcount and Team.formal_action_count each decrement by 1; PolicyCycle.formal_action_total recomputed"
          - "increments EscalationCase.version by 1"
      - from: PERFORMANCE_PLAN
        to: CLOSED_SEPARATION
        trigger: "system: parent Employee transitions to SEPARATED"
        actor: system
        preconditions:
          - "stage == PERFORMANCE_PLAN"
        side_effects:
          - "stage := CLOSED_SEPARATION"
          - "Employee.escalation_stage := NONE; Team.escalated_headcount and Team.formal_action_count each decrement by 1; PolicyCycle.formal_action_total recomputed"
          - "increments EscalationCase.version by 1"
      - from: REFERRED
        to: CLOSED_SEPARATION
        trigger: "system: parent Employee transitions to SEPARATED"
        actor: system
        preconditions:
          - "stage == REFERRED"
        side_effects:
          - "stage := CLOSED_SEPARATION"
          - "Employee.escalation_stage := NONE; Team.escalated_headcount and Team.formal_action_count each decrement by 1; PolicyCycle.formal_action_total recomputed"
          - "increments EscalationCase.version by 1"
      - from: REFERRED
        to: PERFORMANCE_PLAN
        trigger: "POST /escalation-cases/{case_id}/de-escalate"
        actor: PeopleManager
        preconditions:
          - "stage == REFERRED"
          - "acting X-User-ID == Employee.manager_user_id"
        side_effects:
          - "stage := PERFORMANCE_PLAN; discretionary_hold := false"
          - "Employee.escalation_stage := PERFORMANCE_PLAN"
          - "increments EscalationCase.version by 1"

  - entity: RecalibrationReview
    initial_state: DRAFT
    terminal_states: [ADOPTED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /recalibration-reviews/{review_id}/submit"
        actor: WorkplaceProgramOffice
        preconditions:
          - "state == DRAFT"
          - "parent PolicyCycle.posture == RECALIBRATING"
        side_effects:
          - "state := SUBMITTED"
          - "collaboration_index := calculations.collaboration_index; meets_collaboration_target := collaboration_index >= PolicyCycle.collaboration_target_score"
          - "total_space_chargeback_cents := calculations.space_chargeback_cents"
          - "qualifying_band_count and equity_variance_pct := calculations.equity_variance; equity_flag := equity_variance_pct > PolicyCycle.equity_variance_threshold_pct"
          - "increments RecalibrationReview.version by 1"
      - from: SUBMITTED
        to: ADOPTED
        trigger: "POST /recalibration-reviews/{review_id}/decision with decision=ADOPT"
        actor: WorkplaceProgramOffice
        preconditions:
          - "state == SUBMITTED"
          - "parent PolicyCycle.posture == RECALIBRATING"
          - "equity_flag == false (an equity-flagged review cannot be adopted)"
        side_effects:
          - "state := ADOPTED; decision_reason := supplied reason"
          - "PolicyCycle.posture := OPEN, closing the recalibration window"
          - "every Team WHERE policy_cycle_id == parent cycle has expected_days_in_office_per_week := clamp(0, 5, expected_days_in_office_per_week + proposed_days_in_office_delta), processed in team_code ASC order"
          - "because each Team.expected_days_in_office_per_week changed, that Team's expected_daily_attendance, base_entitlement, buffer_seats_entitled and entitled_seats are recomputed"
          - "increments PolicyCycle.version by 1"
          - "increments RecalibrationReview.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /recalibration-reviews/{review_id}/decision with decision=REJECT"
        actor: WorkplaceProgramOffice
        preconditions:
          - "state == SUBMITTED"
          - "parent PolicyCycle.posture == RECALIBRATING"
        side_effects:
          - "state := REJECTED; decision_reason := supplied reason"
          - "PolicyCycle.posture := OPEN, closing the recalibration window"
          - "no Team field changes"
          - "increments PolicyCycle.version by 1"
          - "increments RecalibrationReview.version by 1"
        note: "Branch point: ADOPT and REJECT run divergent side-effect sets from the same from-state."

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules  (OCC on the parent entity's `version` only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: classification-create-stale-employee
    parent_entity: Employee
    write_endpoint: "POST /eligibility-classifications"
    occ_field: "expected_employee_version"
    description: |
      Creating an EligibilityClassification against an Employee whose version has
      advanced since the client last observed it is rejected. This captures the case
      where another writer has already created a classification that legitimately
      supersedes the employee's current APPROVED class (the new row's
      supersedes_classification_id is set from it), so the current writer's view of
      the employee is stale.
    error_id: ERR_STALE_EMPLOYEE_VERSION
    http_status: 412

  - rule_id: seat-allocation-create-stale-neighborhood
    parent_entity: Neighborhood
    write_endpoint: "POST /seat-allocations"
    occ_field: "expected_neighborhood_version"
    description: |
      Creating a SeatAllocation against a Neighborhood whose version has advanced
      since the client last observed it is rejected. A second allocation on the same
      zone is legitimate product behaviour, so the only deterministic guard against a
      stale capacity picture is the parent's version.
    error_id: ERR_STALE_NEIGHBORHOOD_VERSION
    http_status: 412

  - rule_id: recalibration-decision-stale-cycle
    parent_entity: PolicyCycle
    write_endpoint: "POST /recalibration-reviews/{review_id}/decision"
    occ_field: "expected_policy_cycle_version"
    description: |
      Deciding a RecalibrationReview against a PolicyCycle whose version has advanced
      since the client last observed it is rejected. Adopting a review rewrites every
      Team.expected_days_in_office_per_week in the cycle, so a second adoption
      legitimately supersedes the first and the second decider's view of the cycle
      baseline is stale.
    error_id: ERR_STALE_POLICY_CYCLE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:

  - name: current_eligibility_class
    trigger: "Recomputed whenever an EligibilityClassification of the employee reaches APPROVED or SUPERSEDED, and read by required_days_for_week and non_compliance_pressure."
    algorithm: selector_policy
    formula: |
      candidates = EligibilityClassification rows WHERE employee_id == E.id
                   AND state == 'APPROVED'
      if candidates is empty:
          return 'ONSITE_REQUIRED'          # policy default: unclassified roles are onsite-required
      rank candidates by (effective_from DESC, created_at DESC)
      return rank[0].requested_class
    input_set: "Only state == APPROVED classifications. DRAFT, PENDING_MANAGER and SUPERSEDED rows are excluded."
    constants:
      UNCLASSIFIED_DEFAULT_CLASS: ONSITE_REQUIRED
    precision: "enum, no rounding"
    variants: []
    note: "Eligibility filter, ranking expression, tie-break and empty-set fallback are all pinned. created_at (never id) is the final tie-break."

  - name: required_days_for_week
    trigger: "Evaluated at every POST /attendance-weeks/{week_id}/finalize and written to AttendanceWeek.required_days."
    algorithm: threshold
    formula: |
      cls = Employee.current_eligibility_class          # cross-entity read
      if cls == 'FULLY_REMOTE':     return 0
      if cls == 'HYBRID':           return Team.expected_days_in_office_per_week
      if cls == 'ONSITE_REQUIRED':  return ONSITE_REQUIRED_DAYS
    input_set: "The employee's current class at finalize time and the Team row referenced by Employee.team_id."
    constants:
      ONSITE_REQUIRED_DAYS: 5
    precision: "integer days"
    variants: []

  - name: credited_office_days
    trigger: "Evaluated at every POST /attendance-weeks/{week_id}/finalize and written to AttendanceWeek.credited_days; AttendanceWeek.variant_applied records which variant ran."
    algorithm: aggregation
    formula: |
      week_dates = the 7 calendar dates [week_start_date .. week_start_date + 6 days]
      signals    = ComplianceSignal rows WHERE attendance_week_id == W.id
      for each date d in week_dates:
          badge_ok(d)   = EXISTS s in signals with s.signal_source == 'BADGE'
                          AND s.observed_date == d
                          AND s.minutes_present >= MIN_PRESENCE_MINUTES
          network_ok(d) = EXISTS s in signals with s.signal_source == 'NETWORK'
                          AND s.observed_date == d
                          AND s.minutes_present >= MIN_PRESENCE_MINUTES
          attest_ok(d)  = EXISTS s in signals with s.signal_source == 'MANUAL_ATTEST'
                          AND s.observed_date == d        # minutes_present ignored
      variant = 'SIGNAL_CORROBORATED' if Team.signal_corroboration_required else 'SIGNAL_UNION'
      if variant == 'SIGNAL_UNION':
          credited_days = count of d where badge_ok(d) OR network_ok(d) OR attest_ok(d)
      else:
          credited_days = count of d where (badge_ok(d) AND network_ok(d)) OR attest_ok(d)
      return min(credited_days, 5)
    input_set: "All ComplianceSignal rows attached to this AttendanceWeek, regardless of insertion order. Signals of other weeks are excluded; there is no cross-week carryover."
    constants:
      MIN_PRESENCE_MINUTES: 240
    precision: "integer days, capped at 5"
    variants:
      - name: SIGNAL_UNION
        when: "Team.signal_corroboration_required == false"
        difference: "A calendar date counts when ANY of badge, network or manual attestation clears the minute floor. Corroboration is not required, so a badge-only day counts."
      - name: SIGNAL_CORROBORATED
        when: "Team.signal_corroboration_required == true"
        difference: "A calendar date counts only when badge AND network BOTH clear the minute floor on that date, or a manual attestation exists for it. Identical signal sets therefore yield strictly fewer credited days than SIGNAL_UNION whenever any date has exactly one automated source."

  - name: relief_days_credited
    trigger: "Evaluated at every POST /attendance-weeks/{week_id}/finalize, and re-evaluated for the affected weeks by the ExceptionRequest APPROVE and REVOKE cascades. Written to AttendanceWeek.relief_days_credited."
    algorithm: waterfall_allocation
    formula: |
      week_dates = the 7 calendar dates [week_start_date .. week_start_date + 6 days]
      exceptions = ExceptionRequest rows WHERE employee_id == W.employee_id
                   AND status == 'APPROVED'
                   AND closed interval [start_date, end_date] intersects week_dates
      order exceptions by created_at ASC        # deterministic allocation order
      running = 0
      for x in exceptions:
          overlap_business_days = count of dates d in week_dates
                                  where d is MON..FRI
                                  and x.start_date <= d <= x.end_date
          running = running + min(x.granted_relief_days, overlap_business_days)
      return min(running, W.required_days)      # never credit more relief than the week demands
    input_set: "Only status == APPROVED exception requests of the same employee. SUBMITTED, INFO_REQUESTED, DENIED, REVOKED and WITHDRAWN rows are excluded."
    constants: {}
    precision: "integer days"
    variants: []

  - name: non_compliance_pressure
    trigger: "Recomputed whenever an AttendanceWeek of the employee changes status or shortfall_days, whenever Employee.current_eligibility_class changes, and whenever the employee's approved relief changes. Written to Employee.non_compliance_pressure."
    algorithm: weighted_scoring
    formula: |
      # step 1 - raw shortfall over settled weeks
      raw_shortfall = sum(AttendanceWeek.shortfall_days
                          WHERE employee_id == E.id AND status IN {'FINALIZED','LOCKED'})
      # step 2 - consecutive breach streak, most recent first
      settled = AttendanceWeek rows WHERE employee_id == E.id
                AND status IN {'FINALIZED','LOCKED'}
                ordered by week_start_date DESC
      streak = 0
      for w in settled:
          if w.shortfall_days > 0: streak = streak + 1
          else: break
      # step 3 - non-linear combination: three inputs, conditional multiplier, ceiling
      mult = SEVERITY_MULTIPLIER[E.current_eligibility_class]
      pressure = round_half_up(raw_shortfall * mult + streak * CONSECUTIVE_WEIGHT, 2)
      return min(PRESSURE_CEILING, pressure)
    input_set: "Only AttendanceWeek rows with status IN {FINALIZED, LOCKED}. OPEN and AMENDED weeks contribute nothing to raw_shortfall and break the streak walk only if they are excluded from `settled` entirely (they are)."
    constants:
      SEVERITY_MULTIPLIER: { FULLY_REMOTE: 0.0, HYBRID: 1.0, ONSITE_REQUIRED: 1.5 }
      CONSECUTIVE_WEIGHT: 1.0
      PRESSURE_CEILING: 12.00
    precision: "2 decimal places, round_half_up, applied once after the sum and before the ceiling clamp"
    variants: []
    note: "Combinatorial mode (a): three inputs (raw_shortfall, streak, class), a conditional multiplier keyed on entity state, and a min() ceiling. Order is pinned - multiply, then add the streak term, then round, then clamp."

  - name: pressure_derived_stage
    trigger: "Evaluated by every cascade that touches Employee.non_compliance_pressure to decide the EscalationCase stage, and skipped entirely when EscalationCase.discretionary_hold == true."
    algorithm: threshold
    formula: |
      p = Employee.non_compliance_pressure
      if p >= STAGE_REFERRED:         return 'REFERRED'
      if p >= STAGE_PERFORMANCE_PLAN: return 'PERFORMANCE_PLAN'
      if p >= STAGE_WRITTEN_WARNING:  return 'WRITTEN_WARNING'
      if p >= STAGE_COACHING:         return 'COACHING'
      return 'CURED'
    input_set: "The single Employee.non_compliance_pressure value; all comparisons are inclusive (>=)."
    constants:
      STAGE_COACHING: 2.00
      STAGE_WRITTEN_WARNING: 4.00
      STAGE_PERFORMANCE_PLAN: 7.00
      STAGE_REFERRED: 10.00
    precision: "enum, comparisons at 2 decimal places"
    variants: []
    note: "Boundary precision: a pressure of exactly 4.00 yields WRITTEN_WARNING; 3.99 yields COACHING."

  - name: relocation_risk_score
    trigger: "Variant PRELIMINARY runs once at POST /remote-location-requests and writes preliminary_risk_score. Variant FINAL runs at POST /remote-location-requests/{request_id}/decide and writes final_risk_score."
    algorithm: weighted_scoring
    formula: |
      base = JURISDICTION_BASE_RISK[jurisdiction_code] + TIER_RISK[data_classification_tier]
      # PRELIMINARY
      preliminary = min(RISK_CEILING, base)
      # FINAL
      licensing_penalty = min(LICENSING_PENALTY_CAP, LICENSING_PENALTY_PER_GAP * licensing_gap_count)
      control_penalty   = min(CONTROL_PENALTY_CAP,   CONTROL_PENALTY_PER_GAP   * control_gap_count)
      nexus_penalty     = min(NEXUS_PENALTY_CAP,
                              floor(tax_nexus_registration_cost_cents / NEXUS_COST_PER_POINT_CENTS))
      final = min(RISK_CEILING,
                  base + licensing_penalty + control_penalty + nexus_penalty)
    input_set: "PRELIMINARY reads only jurisdiction_code and data_classification_tier, which are supplied at creation. FINAL additionally reads licensing_gap_count and tax_nexus_registration_cost_cents (written by the tax review) and control_gap_count (written by the security review); before those reviews all three are 0, so FINAL would equal PRELIMINARY."
    constants:
      JURISDICTION_BASE_RISK: { US_CA: 10, US_TX: 6, US_NY: 12, IE: 18, IN: 26, BR: 30 }
      TIER_RISK: { PUBLIC: 0, INTERNAL: 8, CONFIDENTIAL: 18, RESTRICTED: 30 }
      LICENSING_PENALTY_PER_GAP: 7
      LICENSING_PENALTY_CAP: 21
      CONTROL_PENALTY_PER_GAP: 9
      CONTROL_PENALTY_CAP: 27
      NEXUS_COST_PER_POINT_CENTS: 250000
      NEXUS_PENALTY_CAP: 12
      RISK_CEILING: 100
      APPROVAL_RISK_CEILING: 60
      ALLOWED_RESTRICTED_JURISDICTIONS: [US_CA, US_TX, US_NY]
    precision: "integer points; the nexus term uses floor division, every cap uses min()"
    variants:
      - name: PRELIMINARY
        when: "At creation, before either review has been recorded."
        difference: "Uses ONLY the jurisdiction and data-tier base, deliberately ignoring licensing, control and nexus-cost penalties because they are not yet verified. It is stored once and never recomputed."
      - name: FINAL
        when: "At the decide step, after both review dimensions have left PENDING."
        difference: "Adds the three capped penalty terms on top of the same base, so for identical creation inputs FINAL >= PRELIMINARY and the two differ whenever any gap count or nexus cost is non-zero. Only FINAL is compared against APPROVAL_RISK_CEILING."

  - name: team_seat_entitlement
    trigger: "Recomputed whenever Team.headcount_planned or Team.expected_days_in_office_per_week changes (team creation and RecalibrationReview adoption). Written to Team.expected_daily_attendance, base_entitlement, buffer_seats_entitled and entitled_seats."
    algorithm: tiered_pricing
    formula: |
      # PINNED EVALUATION ORDER - the dependency only LOOKS circular
      # step 1
      expected_daily_attendance = ceil(headcount_planned * expected_days_in_office_per_week / 5)
      # step 2
      base_entitlement = expected_daily_attendance
      # step 3 - the tier is selected from base_entitlement, NEVER from the total
      buffer_pct = first tier t in BUFFER_TIERS (in declared order)
                   where t.max_base is null OR base_entitlement <= t.max_base
      # step 4
      buffer_seats_entitled = ceil(base_entitlement * buffer_pct)
      # step 5
      entitled_seats = base_entitlement + buffer_seats_entitled
    input_set: "The single Team row. No SeatAllocation or DeskAssignment row participates."
    constants:
      BUFFER_TIERS:
        - { max_base: 10, buffer_pct: 0.20 }
        - { max_base: 25, buffer_pct: 0.12 }
        - { max_base: null, buffer_pct: 0.06 }
    precision: "integers throughout; every division is followed by ceil()"
    variants: []
    note: |
      Combinatorial mode (c): the buffer depends on a tier and the tier looks like it
      should depend on the entitled total, which itself contains the buffer. The order
      above resolves it. The two readings genuinely diverge: at
      headcount_planned=25 / expected_days_in_office_per_week=5 the base is 25, so the
      pinned order selects buffer_pct 0.12 -> buffer 3 -> entitled_seats 28, whereas
      keying the tier off the total (28 > 25 -> 0.06) would give buffer 2 ->
      entitled_seats 27. 28 is correct.

  - name: neighborhood_peak_load
    trigger: "Recomputed whenever any SeatAllocation on the neighborhood enters or leaves COMMITTED. Written to Neighborhood.committed_seats, peak_committed_seats, utilization_pct and allocation_state."
    algorithm: interval_merge
    formula: |
      cap = seat_count - buffer_seats
      committed = SeatAllocation rows WHERE neighborhood_id == N.id AND status == 'COMMITTED'
      cycle_weeks = every ISO week w whose Monday falls in
                    [PolicyCycle.effective_from .. PolicyCycle.effective_to]
      load(w) = sum(a.allocated_seats for a in committed
                    where week_ordinal(a.window_start_week) <= week_ordinal(w)
                      and week_ordinal(w) < week_ordinal(a.window_end_week))   # HALF-OPEN
      peak_committed_seats = max(load(w) for w in cycle_weeks), or 0 when cycle_weeks is empty
      current_week = ISO week of the logical clock's current instant
      committed_seats = load(current_week) if current_week in cycle_weeks else 0
      utilization_pct = round_half_up(100 * peak_committed_seats / cap, 2)
      allocation_state = 'FROZEN' if PolicyCycle.posture == 'LOCKED'
                         else 'TIGHT' if utilization_pct >= TIGHT_UTILIZATION_PCT
                         else 'OPEN'
    input_set: "Only status == COMMITTED allocations. RESERVED and RELEASED allocations contribute 0 to every week's load."
    constants:
      TIGHT_UTILIZATION_PCT: 90.00
    precision: "integer seats; utilization_pct at 2 decimal places, round_half_up"
    variants: []
    note: "Interval semantics A: HALF-OPEN ISO-week interval [window_start_week, window_end_week) with AGGREGATE capacity. Two allocations that merely touch (one ends at W41, the next starts at W41) do NOT overlap."

  - name: space_chargeback_cents
    trigger: "Step 1 runs on every SeatAllocation RESERVED -> COMMITTED transition and writes SeatAllocation.line_chargeback_cents. Step 2 runs at POST /recalibration-reviews/{review_id}/submit and writes RecalibrationReview.total_space_chargeback_cents."
    algorithm: tiered_pricing
    formula: |
      # step 1 - per-allocation line, ROUNDED HERE
      weeks_in_window = week_ordinal(window_end_week) - week_ordinal(window_start_week)
      bps  = DISCOUNT_BPS_BY_EXPECTED_DAYS[Team.expected_days_in_office_per_week]
      line_chargeback_cents = round_half_up(
          SEAT_RATE_CENTS_PER_SEAT_WEEK * allocated_seats * weeks_in_window * bps / 10000)
      # step 2 - PINNED ORDER: sum the ALREADY-ROUNDED lines, do NOT re-round
      lines = SeatAllocation rows WHERE status == 'COMMITTED'
              AND neighborhood_id IN (Neighborhood WHERE policy_cycle_id == cycle.id)
      order lines by created_at ASC
      total_space_chargeback_cents = sum(l.line_chargeback_cents for l in lines)
    input_set: "Only status == COMMITTED allocations on neighborhoods of this policy cycle. RESERVED and RELEASED allocations contribute nothing (their line_chargeback_cents is 0)."
    constants:
      SEAT_RATE_CENTS_PER_SEAT_WEEK: 4333
      DISCOUNT_BPS_BY_EXPECTED_DAYS: { 5: 10000, 4: 9500, 3: 9000, 2: 8500, 1: 8500, 0: 8500 }
    precision: "integer cents; round_half_up applied ONCE PER LINE in step 1 and NEVER again in step 2"
    variants: []
    note: |
      Combinatorial mode (b): nested rounding whose ORDER changes the answer.
      round-per-line-then-sum is the pinned order. Worked divergence: a line for a
      4-day team with allocated_seats=5 and weeks_in_window=2 is
      4333*5*2*9500/10000 = 41163.5 -> 41164, and a line for a 2-day team with
      allocated_seats=2 and weeks_in_window=5 is 4333*2*5*8500/10000 = 36830.5 ->
      36831; the pinned total is 77995, whereas summing the raw values first
      (41163.5 + 36830.5 = 77994.0) and rounding once gives 77994. 77995 is correct.

  - name: collaboration_index
    trigger: "Evaluated at POST /recalibration-reviews/{review_id}/submit and written to RecalibrationReview.collaboration_index."
    algorithm: weighted_scoring
    formula: |
      teams = Team rows WHERE policy_cycle_id == cycle.id
              AND EXISTS an AttendanceWeek with status IN {'FINALIZED','LOCKED'}
                  for some Employee on that team
      order teams by team_code ASC                       # deterministic accumulation order
      if teams is empty: return 0.00
      for t in teams:
          weeks = AttendanceWeek rows of Employees WHERE team_id == t.id
                  AND status IN {'FINALIZED','LOCKED'}
          credited = sum(w.credited_days for w in weeks)
          demanded = sum(w.required_days for w in weeks)
          # ROUND EACH TEAM SUB-SCORE FIRST
          sub_score(t) = round_half_up(100 * credited / max(1, demanded), 2)
      numerator   = sum(sub_score(t) * t.headcount_planned for t in teams)
      denominator = sum(t.headcount_planned for t in teams)
      return round_half_up(numerator / denominator, 2)
    input_set: "Only AttendanceWeek rows with status IN {FINALIZED, LOCKED}. Teams with no such week are excluded from BOTH numerator and denominator. An empty team set returns 0.00 rather than dividing by zero."
    constants: {}
    precision: "2 decimal places, round_half_up, applied per team sub-score and then once more on the weighted mean"
    variants: []
    note: "Pinned rounding order: per-team round, then headcount-weighted mean, then round. Pooling all weeks globally instead (sum-then-round) gives a different number - e.g. team sub-scores 40.00 (headcount 25) and 66.67 (headcount 12) give 48.65, while pooling the same 4 credited of 8 demanded days gives 50.00."

  - name: equity_variance
    trigger: "Evaluated at POST /recalibration-reviews/{review_id}/submit and written to RecalibrationReview.qualifying_band_count, equity_variance_pct and equity_flag."
    algorithm: aggregation
    formula: |
      population = Employee rows WHERE team_id IN (Team WHERE policy_cycle_id == cycle.id)
                   AND status == 'ACTIVE'
      for each band b in {BAND_A, BAND_B, BAND_C, BAND_D}:
          n_b = count(population where demographic_band == b)
          if n_b < MIN_BAND_N: skip b            # band does not qualify
          c_b = count(population where demographic_band == b
                      AND compliance_state == 'COMPLIANT')
          rate(b) = round_half_up(100 * c_b / n_b, 2)
      qualifying = the bands not skipped, ordered by band name ASC
      qualifying_band_count = count(qualifying)
      if qualifying_band_count < 2: return (qualifying_band_count, 0.00)
      equity_variance_pct = round_half_up(max(rate(b) for b in qualifying)
                                          - min(rate(b) for b in qualifying), 2)
      return (qualifying_band_count, equity_variance_pct)
    input_set: "Only Employee rows with status == ACTIVE on teams of this cycle. ON_LEAVE and SEPARATED employees are excluded from both n_b and c_b. Bands with fewer than MIN_BAND_N active employees are dropped entirely (small-cell suppression)."
    constants:
      MIN_BAND_N: 2
    precision: "2 decimal places, round_half_up per band rate and once on the spread"
    variants: []
    note: "Empty/degenerate-set edge: fewer than 2 qualifying bands returns exactly 0.00, never an error or a null."

  - name: aggregate_compliance_rate
    trigger: "Recomputed whenever an Employee.compliance_state or Employee.status changes anywhere in the cycle. Written to PolicyCycle.aggregate_compliance_rate."
    algorithm: aggregation
    formula: |
      population = Employee rows WHERE team_id IN (Team WHERE policy_cycle_id == cycle.id)
                   AND status == 'ACTIVE'
      if population is empty: return 0.00
      compliant = count(population where compliance_state == 'COMPLIANT')
      return round_half_up(100 * compliant / count(population), 2)
    input_set: "Only status == ACTIVE employees on teams of this cycle."
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants: []

  - name: desk_selector
    trigger: "Runs on POST /desk-assignments/auto to pick the neighborhood and desk_index the server assigns."
    algorithm: selector_policy
    formula: |
      # (a) eligibility filter
      allocations = SeatAllocation rows WHERE team_id == Employee.team_id
                    AND status == 'COMMITTED'
                    AND the half-open week interval [window_start_week, window_end_week)
                        contains EVERY ISO week touched by [start_date, end_date]
      allocations = allocations where Neighborhood(allocation).allocation_state
                    IN {'OPEN','TIGHT'}
      candidates = for each allocation a, for each desk index i in
                   [Neighborhood(a).desk_index_from .. Neighborhood(a).desk_index_to]:
                     (a, i) is a candidate iff NO DeskAssignment row with
                       status == 'ASSIGNED'
                       AND seat_allocation_id references the same neighborhood
                       AND desk_index == i
                       AND its closed interval [start_date, end_date] is within
                           CHANGEOVER_BUFFER_DAYS of [requested start_date, end_date]
                           (see the desk-overlap predicate in validations priority 74)
      # (d) empty-pool fallback
      if candidates is empty: reject with ERR_NO_ELIGIBLE_DESK (409)
      # (b) ranking expression
      rank candidates by
        1. (Neighborhood(a).anchor_team_id == Employee.team_id) DESC   # anchor match first
        2. Neighborhood(a).utilization_pct ASC
        3. desk_index ASC
      # (c) tie-break
        4. Neighborhood(a).created_at ASC
        5. SeatAllocation a.created_at ASC
      return rank[0]
    input_set: "Only COMMITTED allocations of the employee's own team whose week window fully covers the requested date range, on neighborhoods whose allocation_state is OPEN or TIGHT. FROZEN neighborhoods and RESERVED/RELEASED allocations are excluded."
    constants:
      CHANGEOVER_BUFFER_DAYS: 1
    precision: "exact integer desk index"
    variants: []
    note: "No random field participates: the ranking uses anchor match, utilization_pct and desk_index, and the final tie-breaks use created_at. Entity `id` is never consulted."

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table
#
# PRECEDENCE: a LOWER `priority` number is checked FIRST and its error_id is the
# one returned when several rules are violated by the same request. The bands are
#   10-12  authentication / role authorisation
#   20-28  existence, ownership, segregation of duties
#   30-34  request shape, enums, numeric ranges, interval well-formedness
#   40-44  optimistic concurrency, cycle posture
#   50-58  lifecycle state preconditions
#   60     uniqueness
#   64     cross-entity configuration gates
#   70     aggregate capacity
#   74     temporal overlap
#   80-90  policy ceilings and governance gates
# ---------------------------------------------------------------------------
validations:

  # --- 10-12 authentication and role authorisation ------------------------
  - rule: "Every endpoint except POST /_clock/set_current_utc requires an X-User-ID header naming a known user."
    applies_to: ["ALL"]
    condition: "X-User-ID header absent or empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    priority: 10
    category: authentication

  - rule: "The caller's role must appear in the endpoint's allowed-roles list."
    applies_to: ["ALL"]
    condition: "caller role not in the endpoint's roles column"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    priority: 12
    category: rbac
    note: "Checked BEFORE existence: an unauthorised caller naming a non-existent resource receives ERR_UNAUTHORIZED (403), never a 404."

  # --- 20-28 existence, ownership, segregation of duties -------------------
  - rule: "Every path id and every foreign key in the payload must resolve to an existing row."
    applies_to: ["ALL"]
    condition: "referenced row does not exist"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    priority: 20
    category: existence
    note: "Concrete codes: ERR_POLICY_CYCLE_NOT_FOUND, ERR_TEAM_NOT_FOUND, ERR_EMPLOYEE_NOT_FOUND, ERR_CLASSIFICATION_NOT_FOUND, ERR_ATTENDANCE_WEEK_NOT_FOUND, ERR_EXCEPTION_REQUEST_NOT_FOUND, ERR_RELOCATION_REQUEST_NOT_FOUND, ERR_NEIGHBORHOOD_NOT_FOUND, ERR_SEAT_ALLOCATION_NOT_FOUND, ERR_DESK_ASSIGNMENT_NOT_FOUND, ERR_ESCALATION_CASE_NOT_FOUND, ERR_RECALIBRATION_REVIEW_NOT_FOUND."

  - rule: "A caller with role Employee may read or act on an Employee-scoped resource only when Employee.id resolves from their own X-User-ID."
    applies_to: ["GET /employees/{employee_id}", "POST /exception-requests", "POST /remote-location-requests", "GET /attendance-weeks/{week_id}", "GET /exception-requests/{request_id}"]
    condition: "caller role == Employee and the target row's employee_id is not the caller's own Employee row"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    priority: 24
    category: ownership

  - rule: "The user who created an EligibilityClassification may not be the user who records its manager decision."
    applies_to: ["POST /eligibility-classifications/{classification_id}/decision"]
    condition: "X-User-ID equals the classification's created_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    priority: 28
    category: segregation_of_duties

  - rule: "The user who submitted a RecalibrationReview may not be the user who records its adoption decision."
    applies_to: ["POST /recalibration-reviews/{review_id}/decision"]
    condition: "X-User-ID equals the review's submitted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    priority: 28
    category: segregation_of_duties

  # --- 30-34 request shape ------------------------------------------------
  - rule: "Required input fields must be present, and enum fields must carry a declared member."
    applies_to: ["ALL"]
    condition: "a required input field is missing, or an enum field carries a value outside its declared set"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    priority: 30
    category: field_shape

  - rule: "Numeric inputs must respect their declared ranges: allocated_seats >= 1, seat_count >= 1, buffer_seats >= 0, headcount_planned >= 1, expected_days_in_office_per_week in 0..5, requested_relief_days in 1..5, minutes_present in 0..1440, desk_index >= 1, proposed_days_in_office_delta in -2..2, limit in 1..100, offset >= 0."
    applies_to: ["ALL"]
    condition: "a numeric input falls outside its declared range"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    priority: 30
    category: field_shape

  - rule: "A Neighborhood's desk index band must be well formed and large enough to hold its seats: desk_index_from >= 1, desk_index_to >= desk_index_from, and (desk_index_to - desk_index_from + 1) == seat_count."
    applies_to: ["POST /neighborhoods"]
    condition: "the desk index band is inverted or narrower than seat_count"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    priority: 30
    category: field_shape

  - rule: "A Neighborhood's buffer_seats must be strictly smaller than seat_count so that usable capacity is positive."
    applies_to: ["POST /neighborhoods"]
    condition: "buffer_seats >= seat_count"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    priority: 30
    category: field_shape

  - rule: "A SeatAllocation's HALF-OPEN ISO-week window must be non-empty: week_ordinal(window_end_week) > week_ordinal(window_start_week), and both must be well-formed ISO week labels of the form YYYY-Www."
    applies_to: ["POST /seat-allocations"]
    condition: "window_end_week <= window_start_week in ISO-week ordinal terms, or either label is malformed"
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    priority: 34
    category: interval_shape

  - rule: "A DeskAssignment's CLOSED date interval must be non-empty: start_date <= end_date."
    applies_to: ["POST /desk-assignments", "POST /desk-assignments/auto"]
    condition: "end_date < start_date"
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    priority: 34
    category: interval_shape

  - rule: "An ExceptionRequest's CLOSED date interval must be non-empty: start_date <= end_date."
    applies_to: ["POST /exception-requests"]
    condition: "end_date < start_date"
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    priority: 34
    category: interval_shape

  # --- 40-44 concurrency and cycle posture --------------------------------
  - rule: "POST /eligibility-classifications must carry expected_employee_version equal to the current Employee.version."
    applies_to: ["POST /eligibility-classifications"]
    condition: "expected_employee_version != Employee.version"
    error_id: ERR_STALE_EMPLOYEE_VERSION
    http_status: 412
    priority: 40
    category: concurrency

  - rule: "POST /seat-allocations must carry expected_neighborhood_version equal to the current Neighborhood.version."
    applies_to: ["POST /seat-allocations"]
    condition: "expected_neighborhood_version != Neighborhood.version"
    error_id: ERR_STALE_NEIGHBORHOOD_VERSION
    http_status: 412
    priority: 40
    category: concurrency

  - rule: "POST /recalibration-reviews/{review_id}/decision must carry expected_policy_cycle_version equal to the current PolicyCycle.version."
    applies_to: ["POST /recalibration-reviews/{review_id}/decision"]
    condition: "expected_policy_cycle_version != PolicyCycle.version"
    error_id: ERR_STALE_POLICY_CYCLE_VERSION
    http_status: 412
    priority: 40
    category: concurrency

  - rule: "No mutation is accepted anywhere in a policy cycle whose posture is LOCKED."
    applies_to: ["POST /teams", "POST /employees", "POST /eligibility-classifications", "POST /attendance-weeks", "POST /attendance-weeks/{week_id}/signals", "POST /attendance-weeks/{week_id}/finalize", "POST /attendance-weeks/{week_id}/amend", "POST /exception-requests", "POST /neighborhoods", "POST /seat-allocations", "POST /seat-allocations/{allocation_id}/commit", "POST /desk-assignments", "POST /desk-assignments/auto", "POST /recalibration-reviews", "POST /recalibration-reviews/{review_id}/submit"]
    condition: "the PolicyCycle reached through the entity graph has posture == LOCKED"
    error_id: ERR_CYCLE_LOCKED
    http_status: 409
    priority: 44
    category: cross_entity_state

  # --- 50-58 lifecycle preconditions --------------------------------------
  - rule: "A posture change must name a target reachable from the cycle's current posture; LOCKED is terminal."
    applies_to: ["POST /policy-cycles/{cycle_id}/posture"]
    condition: "target_posture is not reachable from PolicyCycle.posture, which covers target_posture == the current posture and every target out of LOCKED"
    error_id: ERR_INVALID_POSTURE_TRANSITION
    http_status: 409
    priority: 50
    category: state_precondition

  - rule: "An employee status change must name a target reachable from the current status; SEPARATED is terminal."
    applies_to: ["POST /employees/{employee_id}/status"]
    condition: "target_status is not reachable from Employee.status, which covers target_status == the current status and every target out of SEPARATED"
    error_id: ERR_INVALID_EMPLOYEE_STATUS_TRANSITION
    http_status: 409
    priority: 50
    category: state_precondition

  - rule: "A classification submit requires state == DRAFT."
    applies_to: ["POST /eligibility-classifications/{classification_id}/submit"]
    condition: "EligibilityClassification.state != 'DRAFT'"
    error_id: ERR_CLASSIFICATION_NOT_DRAFT
    http_status: 409
    priority: 50
    category: state_precondition

  - rule: "A recalibration submit requires state == DRAFT."
    applies_to: ["POST /recalibration-reviews/{review_id}/submit"]
    condition: "RecalibrationReview.state != 'DRAFT'"
    error_id: ERR_REVIEW_NOT_DRAFT
    http_status: 409
    priority: 50
    category: state_precondition

  - rule: "A classification decision requires state == PENDING_MANAGER."
    applies_to: ["POST /eligibility-classifications/{classification_id}/decision"]
    condition: "EligibilityClassification.state != 'PENDING_MANAGER'"
    error_id: ERR_CLASSIFICATION_NOT_PENDING
    http_status: 409
    priority: 50
    category: state_precondition

  - rule: "Signals may only be appended to, and finalize may only be called on, an AttendanceWeek that is still editable - status IN {OPEN, AMENDED}."
    applies_to: ["POST /attendance-weeks/{week_id}/signals", "POST /attendance-weeks/{week_id}/finalize"]
    condition: "AttendanceWeek.status not in {'OPEN', 'AMENDED'}"
    error_id: ERR_WEEK_NOT_OPEN
    http_status: 409
    priority: 50
    category: state_precondition

  - rule: "Amendment requires an already settled week: status == FINALIZED."
    applies_to: ["POST /attendance-weeks/{week_id}/amend"]
    condition: "AttendanceWeek.status != 'FINALIZED'"
    error_id: ERR_WEEK_NOT_FINALIZED
    http_status: 409
    priority: 50
    category: state_precondition

  - rule: "Requesting information and adjudicating require an ExceptionRequest in a live intake state."
    applies_to: ["POST /exception-requests/{request_id}/request-info", "POST /exception-requests/{request_id}/adjudicate"]
    condition: "ExceptionRequest.status not in {'SUBMITTED','INFO_REQUESTED'}"
    error_id: ERR_REQUEST_NOT_SUBMITTED
    http_status: 409
    priority: 50
    category: state_precondition

  - rule: "Responding to an information request requires status == INFO_REQUESTED."
    applies_to: ["POST /exception-requests/{request_id}/respond"]
    condition: "ExceptionRequest.status != 'INFO_REQUESTED'"
    error_id: ERR_REQUEST_NOT_INFO_REQUESTED
    http_status: 409
    priority: 50
    category: state_precondition

  - rule: "Revocation requires an ExceptionRequest with status == APPROVED."
    applies_to: ["POST /exception-requests/{request_id}/revoke"]
    condition: "ExceptionRequest.status != 'APPROVED'"
    error_id: ERR_EXCEPTION_NOT_APPROVED
    http_status: 409
    priority: 50
    category: state_precondition

  - rule: "A relocation review dimension may be recorded only once and only while the request is still open."
    applies_to: ["POST /remote-location-requests/{request_id}/tax-review", "POST /remote-location-requests/{request_id}/security-review"]
    condition: "the addressed dimension has already left PENDING, or the request status is APPROVED or DENIED"
    error_id: ERR_REVIEW_ALREADY_RECORDED
    http_status: 409
    priority: 50
    category: state_precondition

  - rule: "The relocation decision is final: a request that has reached APPROVED or DENIED accepts no further decision."
    applies_to: ["POST /remote-location-requests/{request_id}/decide"]
    condition: "RemoteLocationRequest.status IN {'APPROVED', 'DENIED'}"
    error_id: ERR_RELOCATION_DECISION_FINAL
    http_status: 409
    priority: 50
    category: state_precondition
    note: "Cannot collide with the ERR_REVIEWS_INCOMPLETE rule below: a decided request necessarily has both dimensions out of PENDING."

  - rule: "The relocation decision may only be taken once both parallel dimensions have left PENDING."
    applies_to: ["POST /remote-location-requests/{request_id}/decide"]
    condition: "tax_review_status == 'PENDING' or security_review_status == 'PENDING'"
    error_id: ERR_REVIEWS_INCOMPLETE
    http_status: 409
    priority: 50
    category: state_precondition

  - rule: "Commit requires a SeatAllocation with status == RESERVED; release requires status == COMMITTED."
    applies_to: ["POST /seat-allocations/{allocation_id}/commit", "POST /seat-allocations/{allocation_id}/release"]
    condition: "commit called on an allocation whose status is COMMITTED (ERR_ALLOCATION_NOT_RESERVED), or either trigger called on a RELEASED allocation (ERR_ALLOCATION_TERMINAL). Release is legal from BOTH RESERVED and COMMITTED, so there is no not-COMMITTED release error."
    error_id: ERR_ALLOCATION_NOT_RESERVED
    http_status: 409
    priority: 50
    category: state_precondition
    note: "ERR_ALLOCATION_TERMINAL takes the place of ERR_ALLOCATION_NOT_RESERVED when status == RELEASED, because RELEASED is terminal and neither trigger can ever apply again."

  - rule: "Vacating requires a DeskAssignment with status == ASSIGNED."
    applies_to: ["POST /desk-assignments/{assignment_id}/vacate"]
    condition: "DeskAssignment.status != 'ASSIGNED'"
    error_id: ERR_ASSIGNMENT_NOT_ACTIVE
    http_status: 409
    priority: 50
    category: state_precondition

  - rule: "An escalation case at COACHING cannot be de-escalated further along the ladder, a case at REFERRED cannot be escalated past the top rung, and a case in a terminal stage accepts no trigger."
    applies_to: ["POST /escalation-cases/{case_id}/escalate", "POST /escalation-cases/{case_id}/de-escalate"]
    condition: "de-escalate called while stage == 'COACHING' (ERR_ESCALATION_AT_FLOOR), escalate called while stage == 'REFERRED' (ERR_ESCALATION_AT_CEILING), or either trigger called while stage in {'CURED','CLOSED_SEPARATION'} (ERR_ESCALATION_TERMINAL)"
    error_id: ERR_ESCALATION_AT_FLOOR
    http_status: 409
    priority: 50
    category: state_precondition

  - rule: "A recalibration decision requires state == SUBMITTED."
    applies_to: ["POST /recalibration-reviews/{review_id}/decision"]
    condition: "RecalibrationReview.state != 'SUBMITTED'"
    error_id: ERR_REVIEW_NOT_SUBMITTED
    http_status: 409
    priority: 50
    category: state_precondition

  - rule: "Employee-scoped work items may only be created for an ACTIVE employee."
    applies_to: ["POST /eligibility-classifications", "POST /attendance-weeks", "POST /exception-requests", "POST /remote-location-requests", "POST /desk-assignments", "POST /desk-assignments/auto"]
    condition: "Employee.status != 'ACTIVE'"
    error_id: ERR_EMPLOYEE_NOT_ACTIVE
    http_status: 409
    priority: 54
    category: cross_entity_state
    note: "Ranked BELOW the OCC check at priority 40, so a request that is both stale and aimed at a SEPARATED employee returns ERR_STALE_EMPLOYEE_VERSION (412)."

  - rule: "Recalibration measurement and adoption may only happen inside a recalibration window: the parent PolicyCycle.posture must be RECALIBRATING."
    applies_to: ["POST /recalibration-reviews/{review_id}/submit", "POST /recalibration-reviews/{review_id}/decision"]
    condition: "the parent PolicyCycle.posture != 'RECALIBRATING'"
    error_id: ERR_CYCLE_NOT_RECALIBRATING
    http_status: 409
    priority: 54
    category: cross_entity_state
    note: "Ranked BELOW the band-44 ERR_CYCLE_LOCKED rule that covers submit, so a submit inside a LOCKED cycle returns ERR_CYCLE_LOCKED; the decision endpoint is NOT in the band-44 list, so a decision inside a LOCKED cycle returns ERR_CYCLE_NOT_RECALIBRATING."

  - rule: "A remote-location request requires the employee to already hold an APPROVED classification, and that class must permit working away from the assigned site."
    applies_to: ["POST /remote-location-requests"]
    condition: "no APPROVED EligibilityClassification exists for the employee (ERR_NO_APPROVED_CLASSIFICATION), or current_eligibility_class == 'ONSITE_REQUIRED' (ERR_CLASS_NOT_REMOTE_ELIGIBLE)"
    error_id: ERR_NO_APPROVED_CLASSIFICATION
    http_status: 409
    priority: 58
    category: cross_entity_state

  # --- 60 uniqueness ------------------------------------------------------
  - rule: "PolicyCycle.cycle_label is globally unique."
    applies_to: ["POST /policy-cycles"]
    condition: "another PolicyCycle already carries this cycle_label"
    error_id: ERR_DUPLICATE_CYCLE_LABEL
    http_status: 409
    priority: 60
    category: uniqueness

  - rule: "Team.team_code is unique within its PolicyCycle."
    applies_to: ["POST /teams"]
    condition: "another Team on the same policy_cycle_id already carries this team_code"
    error_id: ERR_DUPLICATE_TEAM_CODE
    http_status: 409
    priority: 60
    category: uniqueness

  - rule: "Neighborhood.neighborhood_code is unique within its PolicyCycle."
    applies_to: ["POST /neighborhoods"]
    condition: "another Neighborhood on the same policy_cycle_id already carries this neighborhood_code"
    error_id: ERR_DUPLICATE_NEIGHBORHOOD_CODE
    http_status: 409
    priority: 60
    category: uniqueness

  - rule: "Employee.employee_number is globally unique."
    applies_to: ["POST /employees"]
    condition: "another Employee already carries this employee_number"
    error_id: ERR_DUPLICATE_EMPLOYEE_NUMBER
    http_status: 409
    priority: 60
    category: uniqueness

  - rule: "Employee.work_email is globally unique."
    applies_to: ["POST /employees"]
    condition: "another Employee already carries this work_email"
    error_id: ERR_DUPLICATE_WORK_EMAIL
    http_status: 409
    priority: 60
    category: uniqueness
    note: "When a payload duplicates BOTH employee_number and work_email, the employee_number rule above is evaluated first, so ERR_DUPLICATE_EMPLOYEE_NUMBER is returned."

  - rule: "RecalibrationReview.review_label is unique within its PolicyCycle."
    applies_to: ["POST /recalibration-reviews"]
    condition: "another RecalibrationReview on the same policy_cycle_id already carries this review_label"
    error_id: ERR_DUPLICATE_REVIEW_LABEL
    http_status: 409
    priority: 60
    category: uniqueness

  - rule: "At most one AttendanceWeek may exist per (employee_id, iso_week)."
    applies_to: ["POST /attendance-weeks"]
    condition: "an AttendanceWeek already exists for this employee and iso_week"
    error_id: ERR_DUPLICATE_ATTENDANCE_WEEK
    http_status: 409
    priority: 60
    category: uniqueness

  - rule: "ComplianceSignal.dedupe_key is unique within its AttendanceWeek."
    applies_to: ["POST /attendance-weeks/{week_id}/signals"]
    condition: "a ComplianceSignal with this dedupe_key already exists on this week"
    error_id: ERR_DUPLICATE_SIGNAL
    http_status: 409
    priority: 60
    category: uniqueness
    note: "Ranked ABOVE the observed_date containment gate at priority 64, so a replayed dedupe_key carrying an out-of-range observed_date returns ERR_DUPLICATE_SIGNAL, not ERR_SIGNAL_OUTSIDE_WEEK. Both are ranked below ERR_WEEK_NOT_OPEN at priority 50."

  # --- 64 cross-entity configuration gates --------------------------------
  - rule: "A ComplianceSignal's observed_date must fall inside its week: week_start_date <= observed_date <= week_start_date + 6 days."
    applies_to: ["POST /attendance-weeks/{week_id}/signals"]
    condition: "observed_date lies outside the seven dates of the addressed AttendanceWeek"
    error_id: ERR_SIGNAL_OUTSIDE_WEEK
    http_status: 422
    priority: 64
    category: cross_entity_config

  - rule: "A SeatAllocation's team must belong to the same PolicyCycle as its Neighborhood."
    applies_to: ["POST /seat-allocations"]
    condition: "Team.policy_cycle_id != Neighborhood.policy_cycle_id"
    error_id: ERR_TEAM_ALLOCATION_MISMATCH
    http_status: 409
    priority: 64
    category: cross_entity_config

  - rule: "A DeskAssignment's employee must belong to the allocation's team, and the desk_index must fall inside the neighborhood's declared band."
    applies_to: ["POST /desk-assignments"]
    condition: "Employee.team_id != SeatAllocation.team_id, or desk_index outside [desk_index_from, desk_index_to]"
    error_id: ERR_TEAM_ALLOCATION_MISMATCH
    http_status: 409
    priority: 64
    category: cross_entity_config

  - rule: "A DeskAssignment's CLOSED date interval must be fully covered by the HALF-OPEN week window of its SeatAllocation: every ISO week touched by [start_date, end_date] must satisfy window_start_week <= week < window_end_week."
    applies_to: ["POST /desk-assignments"]
    condition: "any ISO week touched by the requested dates lies outside the allocation's half-open window"
    error_id: ERR_ASSIGNMENT_OUTSIDE_WINDOW
    http_status: 409
    priority: 64
    category: cross_entity_config
    note: "A request whose end_date falls in the exact week named by window_end_week is OUTSIDE the window, because the upper bound is exclusive."

  - rule: "A MEDICAL or DISABILITY_ACCOMMODATION exception, or any exception for an employee with disability_accommodation_on_file, may only be adjudicated by AccommodationSpecialist."
    applies_to: ["POST /exception-requests/{request_id}/adjudicate"]
    condition: "interactive_process_required == true and the caller role is not AccommodationSpecialist"
    error_id: ERR_ACCOMMODATION_SPECIALIST_REQUIRED
    http_status: 409
    priority: 64
    category: cross_entity_config

  - rule: "An exception whose interactive process is required may not be approved until at least one information round has completed."
    applies_to: ["POST /exception-requests/{request_id}/adjudicate"]
    condition: "decision == 'APPROVE' and interactive_process_required == true and info_round_count == 0"
    error_id: ERR_INTERACTIVE_PROCESS_PENDING
    http_status: 409
    priority: 64
    category: cross_entity_config

  - rule: "RESTRICTED data may only be handled from a jurisdiction in ALLOWED_RESTRICTED_JURISDICTIONS."
    applies_to: ["POST /remote-location-requests/{request_id}/decide"]
    condition: "decision == 'APPROVE' and data_classification_tier == 'RESTRICTED' and jurisdiction_code not in ALLOWED_RESTRICTED_JURISDICTIONS"
    error_id: ERR_DATA_RESIDENCY_PROHIBITED
    http_status: 409
    priority: 64
    category: cross_entity_config
    note: "Ranked ABOVE the risk-ceiling check at priority 80, so a RESTRICTED request into a prohibited jurisdiction returns ERR_DATA_RESIDENCY_PROHIBITED even when its final risk also breaches APPROVAL_RISK_CEILING."

  # --- 70 aggregate capacity ----------------------------------------------
  - rule: "Committing a SeatAllocation must not push any ISO week in its window above the neighborhood's usable capacity (seat_count - buffer_seats), counting all other COMMITTED allocations on that neighborhood week by week."
    applies_to: ["POST /seat-allocations/{allocation_id}/commit"]
    condition: "for some ISO week w in [window_start_week, window_end_week), the sum of allocated_seats over COMMITTED allocations covering w, plus this allocation's allocated_seats, exceeds seat_count - buffer_seats"
    error_id: ERR_NEIGHBORHOOD_CAPACITY_EXCEEDED
    http_status: 409
    priority: 70
    category: aggregate_capacity
    note: "Aggregate, per-week, half-open. Each allocation is individually within capacity; only the overlapping sum breaches it. Landing exactly ON capacity is allowed."

  - rule: "A team's COMMITTED and RESERVED allocations may not together exceed Team.entitled_seats in any single ISO week."
    applies_to: ["POST /seat-allocations"]
    condition: "for some ISO week w in the requested window, the sum of allocated_seats over the team's non-RELEASED allocations covering w, plus the requested allocated_seats, exceeds Team.entitled_seats"
    error_id: ERR_SEAT_ENTITLEMENT_EXCEEDED
    http_status: 409
    priority: 70
    category: aggregate_capacity
    note: "Ranked BELOW ERR_INVALID_INTERVAL (34) and below the OCC check (40)."

  # --- 74 temporal overlap ------------------------------------------------
  - rule: "A desk may not be occupied by two live assignments whose CLOSED intervals are separated by fewer than CHANGEOVER_BUFFER_DAYS clear days. Formally, for the same neighborhood and desk_index, a new [s2,e2] is rejected when s2 <= e1 + CHANGEOVER_BUFFER_DAYS and s1 <= e2 + CHANGEOVER_BUFFER_DAYS against any ASSIGNED [s1,e1]."
    applies_to: ["POST /desk-assignments"]
    condition: "the changeover predicate above holds against any DeskAssignment with status == ASSIGNED on the same neighborhood and desk_index"
    error_id: ERR_DESK_CHANGEOVER_CONFLICT
    http_status: 409
    priority: 74
    category: temporal_overlap
    note: "Interval semantics B: CLOSED interval, PER-RESOURCE exclusivity (one desk, one occupant) and a sanitation buffer, so back-to-back assignments that merely abut are still rejected. This is deliberately different from the SeatAllocation window, which is HALF-OPEN and AGGREGATE. VACATED assignments never conflict."

  - rule: "An employee may not hold two live ExceptionRequests of the same category whose CLOSED date intervals overlap."
    applies_to: ["POST /exception-requests"]
    condition: "an ExceptionRequest with the same employee_id and category and status in {'SUBMITTED','INFO_REQUESTED','APPROVED'} satisfies start_date <= new_end_date and new_start_date <= end_date"
    error_id: ERR_EXCEPTION_WINDOW_OVERLAP
    http_status: 409
    priority: 74
    category: temporal_overlap
    note: "DENIED, REVOKED and WITHDRAWN requests are dead and never conflict, so a revoked window can be re-requested."

  # --- 80-90 policy ceilings and governance gates -------------------------
  - rule: "A remote-location request may not be approved when its FINAL risk score reaches APPROVAL_RISK_CEILING."
    applies_to: ["POST /remote-location-requests/{request_id}/decide"]
    condition: "decision == 'APPROVE' and final_risk_score >= APPROVAL_RISK_CEILING"
    error_id: ERR_RELOCATION_RISK_CEILING
    http_status: 409
    priority: 80
    category: policy_ceiling
    note: "Inclusive boundary: exactly 60 is a rejection, 59 is approvable."

  - rule: "A tax review may not record a nexus registration cost above the per-request budget."
    applies_to: ["POST /remote-location-requests/{request_id}/tax-review"]
    condition: "tax_nexus_registration_cost_cents > 5000000"
    error_id: ERR_TAX_NEXUS_BUDGET_EXCEEDED
    http_status: 409
    priority: 80
    category: policy_ceiling

  - rule: "Adopting a RecalibrationReview may not drive any Team below the cycle's days_in_office_floor."
    applies_to: ["POST /recalibration-reviews/{review_id}/decision"]
    condition: "decision == 'ADOPT' and, for some Team in the cycle, expected_days_in_office_per_week + proposed_days_in_office_delta < PolicyCycle.days_in_office_floor"
    error_id: ERR_BELOW_DAYS_FLOOR
    http_status: 409
    priority: 80
    category: policy_ceiling

  - rule: "Granted relief may not exceed what the employee asked for."
    applies_to: ["POST /exception-requests/{request_id}/adjudicate"]
    condition: "decision == 'APPROVE' and granted_relief_days > ExceptionRequest.requested_relief_days"
    error_id: ERR_RELIEF_EXCEEDS_REQUEST
    http_status: 409
    priority: 80
    category: policy_ceiling

  - rule: "An automatic desk assignment must find at least one eligible desk."
    applies_to: ["POST /desk-assignments/auto"]
    condition: "the desk_selector candidate pool is empty"
    error_id: ERR_NO_ELIGIBLE_DESK
    http_status: 409
    priority: 80
    category: policy_ceiling

  - rule: "A review whose equity_flag is true may not be adopted."
    applies_to: ["POST /recalibration-reviews/{review_id}/decision"]
    condition: "decision == 'ADOPT' and RecalibrationReview.equity_flag == true"
    error_id: ERR_EQUITY_FLAG_BLOCKS_ADOPTION
    http_status: 409
    priority: 90
    category: governance_gate
    note: "Lowest precedence of all: an ADOPT that breaches both the days floor and the equity gate returns ERR_BELOW_DAYS_FLOOR."

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
#
# api_prefix is "" - every collection is a peer at the API root.
# All endpoints except POST /_clock/set_current_utc require an X-User-ID header.
# ---------------------------------------------------------------------------
endpoints:

  # --- logical clock (test-driving namespace) ------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical current UTC instant. The server starts with the logical clock fixed at 2026-08-01T00:00:00Z (ISO week 2026-W31); until this endpoint is called the clock reads exactly that default and never falls back to real wall-clock time. Every date/week comparison in this API - attendance week containment, seat-allocation window coverage, desk changeover buffers, exception windows - resolves against this logical clock."
    roles: [WorkplaceProgramOffice, HRBusinessPartner, PeopleManager, AccommodationSpecialist, ComplianceAuditor, SystemIntegration, Employee]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects: ["Rebinds the logical now; no entity is mutated and no recomputation is triggered."]

  # --- PolicyCycle --------------------------------------------------------
  - method: POST
    path: "/policy-cycles"
    description: "Opens a new hybrid-work policy cycle."
    roles: [WorkplaceProgramOffice]
    code: 201
    input: [cycle_label, effective_from, effective_to, days_in_office_floor, badge_weight, network_weight, collaboration_target_score, equity_variance_threshold_pct]
    output: PolicyCycle
    side_effects: ["posture := OPEN", "enrolled_team_count := 0", "aggregate_compliance_rate := 0.00", "formal_action_total := 0"]

  - method: GET
    path: "/policy-cycles/{cycle_id}"
    description: "Reads one policy cycle including its derived roll-ups."
    roles: [WorkplaceProgramOffice, HRBusinessPartner, PeopleManager, AccommodationSpecialist, ComplianceAuditor, SystemIntegration]
    code: 200
    input: []
    output: PolicyCycle
    side_effects: []

  - method: GET
    path: "/policy-cycles"
    description: "Lists policy cycles, newest first by created_at DESC."
    roles: [WorkplaceProgramOffice, HRBusinessPartner, PeopleManager, AccommodationSpecialist, ComplianceAuditor, SystemIntegration]
    code: 200
    input: ["posture?", "limit?", "offset?"]
    output: PolicyCycle[]
    side_effects: []

  - method: POST
    path: "/policy-cycles/{cycle_id}/posture"
    description: "Moves the cycle between OPEN, RECALIBRATING and LOCKED. target_posture is one of {OPEN, RECALIBRATING, LOCKED}."
    roles: [WorkplaceProgramOffice]
    code: 200
    input: [target_posture, "note?"]
    output: PolicyCycle
    side_effects: ["On LOCKED: every Neighborhood in the cycle recomputes allocation_state := FROZEN, and every subsequent mutation inside the cycle is refused with ERR_CYCLE_LOCKED."]

  # --- Team ---------------------------------------------------------------
  - method: POST
    path: "/teams"
    description: "Enrolls a team in the cycle with its days-in-office expectation and signal-corroboration policy."
    roles: [WorkplaceProgramOffice]
    code: 201
    input: [policy_cycle_id, team_code, expected_days_in_office_per_week, core_collaboration_days, headcount_planned, "signal_corroboration_required?"]
    output: Team
    side_effects: ["calculations.team_seat_entitlement writes expected_daily_attendance, base_entitlement, buffer_seats_entitled and entitled_seats", "PolicyCycle.enrolled_team_count += 1"]

  - method: GET
    path: "/teams/{team_id}"
    description: "Reads one team including its seat entitlement."
    roles: [WorkplaceProgramOffice, HRBusinessPartner, PeopleManager, AccommodationSpecialist, ComplianceAuditor, SystemIntegration]
    code: 200
    input: []
    output: Team
    side_effects: []

  - method: GET
    path: "/teams"
    description: "Lists teams, optionally filtered by cycle; ordered by team_code ASC."
    roles: [WorkplaceProgramOffice, HRBusinessPartner, PeopleManager, AccommodationSpecialist, ComplianceAuditor, SystemIntegration]
    code: 200
    input: ["policy_cycle_id?", "limit?", "offset?"]
    output: Team[]
    side_effects: []

  # --- Employee -----------------------------------------------------------
  - method: POST
    path: "/employees"
    description: "Registers an employee on a team. status starts ACTIVE and current_eligibility_class starts at the ONSITE_REQUIRED policy default until an APPROVED classification exists."
    roles: [HRBusinessPartner]
    code: 201
    input: [team_id, employee_number, work_email, home_timezone, tenure_start_date, demographic_band, manager_user_id, hr_partner_user_id, "disability_accommodation_on_file?"]
    output: Employee
    side_effects: ["status := ACTIVE", "current_eligibility_class := ONSITE_REQUIRED", "compliance_state := COMPLIANT", "escalation_stage := NONE", "PolicyCycle.aggregate_compliance_rate recomputed"]

  - method: GET
    path: "/employees/{employee_id}"
    description: "Reads one employee including pressure, compliance_state and escalation_stage."
    roles: [WorkplaceProgramOffice, HRBusinessPartner, PeopleManager, AccommodationSpecialist, ComplianceAuditor, SystemIntegration, Employee]
    code: 200
    input: []
    output: Employee
    side_effects: []

  - method: GET
    path: "/employees"
    description: "Lists employees, optionally filtered; ordered by employee_number ASC."
    roles: [WorkplaceProgramOffice, HRBusinessPartner, PeopleManager, AccommodationSpecialist, ComplianceAuditor, SystemIntegration]
    code: 200
    input: ["team_id?", "status?", "compliance_state?", "escalation_stage?", "current_eligibility_class?", "limit?", "offset?"]
    output: Employee[]
    side_effects: []

  - method: POST
    path: "/employees/{employee_id}/status"
    description: "Moves an employee between ACTIVE, ON_LEAVE and SEPARATED. target_status is one of {ACTIVE, ON_LEAVE, SEPARATED}."
    roles: [HRBusinessPartner]
    code: 200
    input: [target_status, "note?"]
    output: Employee
    side_effects: ["On SEPARATED: every ASSIGNED DeskAssignment of the employee moves to VACATED and its neighborhood's derived seat fields are recomputed; every non-terminal EscalationCase of the employee moves to CLOSED_SEPARATION; PolicyCycle.aggregate_compliance_rate and RecalibrationReview equity inputs drop the employee from the ACTIVE population."]

  # --- EligibilityClassification -----------------------------------------
  - method: POST
    path: "/eligibility-classifications"
    description: "Drafts a role eligibility classification for an employee. Carries the OCC guard expected_employee_version."
    roles: [PeopleManager, HRBusinessPartner]
    code: 201
    input: [employee_id, requested_class, justification_code, effective_from, expected_employee_version, "decision_note?"]
    output: EligibilityClassification
    side_effects: ["state := DRAFT", "created_by_user_id := X-User-ID", "Employee.version += 1 on success"]

  - method: POST
    path: "/eligibility-classifications/{classification_id}/submit"
    description: "Routes a DRAFT classification to the approving manager."
    roles: [PeopleManager, HRBusinessPartner]
    code: 200
    input: []
    output: EligibilityClassification
    side_effects: ["state := PENDING_MANAGER"]

  - method: POST
    path: "/eligibility-classifications/{classification_id}/decision"
    description: "Records the manager decision. decision is one of {APPROVE, REVISE}; APPROVE moves the row to APPROVED, REVISE sends it back to DRAFT. The caller may not be created_by_user_id."
    roles: [PeopleManager]
    code: 200
    input: [decision, "decision_note?"]
    output: EligibilityClassification
    side_effects: ["On APPROVE: any previously APPROVED classification of the same employee moves to SUPERSEDED with supersedes_classification_id pointing at this row; Employee.current_eligibility_class is recomputed; Employee.non_compliance_pressure, compliance_state and escalation_stage are recomputed because the severity multiplier changed", "decided_by_user_id := X-User-ID"]

  - method: GET
    path: "/eligibility-classifications/{classification_id}"
    description: "Reads one classification."
    roles: [WorkplaceProgramOffice, HRBusinessPartner, PeopleManager, AccommodationSpecialist, ComplianceAuditor, SystemIntegration]
    code: 200
    input: []
    output: EligibilityClassification
    side_effects: []

  - method: GET
    path: "/eligibility-classifications"
    description: "Lists classifications; ordered by effective_from DESC then created_at DESC. supersedes_classification_id finds the row that superseded a given classification."
    roles: [WorkplaceProgramOffice, HRBusinessPartner, PeopleManager, AccommodationSpecialist, ComplianceAuditor, SystemIntegration]
    code: 200
    input: ["employee_id?", "supersedes_classification_id?", "state?", "limit?", "offset?"]
    output: EligibilityClassification[]
    side_effects: []

  # --- AttendanceWeek and ComplianceSignal --------------------------------
  - method: POST
    path: "/attendance-weeks"
    description: "Opens an attendance week for an employee. week_start_date must be the Monday of iso_week."
    roles: [SystemIntegration, HRBusinessPartner, PeopleManager]
    code: 201
    input: [employee_id, iso_week, week_start_date]
    output: AttendanceWeek
    side_effects: ["status := OPEN", "required_days, credited_days, relief_days_credited and shortfall_days := 0", "variant_applied := null until finalize"]

  - method: GET
    path: "/attendance-weeks/{week_id}"
    description: "Reads one attendance week including its settled day counts."
    roles: [WorkplaceProgramOffice, HRBusinessPartner, PeopleManager, AccommodationSpecialist, ComplianceAuditor, SystemIntegration, Employee]
    code: 200
    input: []
    output: AttendanceWeek
    side_effects: []

  - method: GET
    path: "/attendance-weeks"
    description: "Lists attendance weeks; ordered by week_start_date ASC."
    roles: [WorkplaceProgramOffice, HRBusinessPartner, PeopleManager, AccommodationSpecialist, ComplianceAuditor, SystemIntegration]
    code: 200
    input: ["employee_id?", "iso_week?", "status?", "limit?", "offset?"]
    output: AttendanceWeek[]
    side_effects: []

  - method: POST
    path: "/attendance-weeks/{week_id}/signals"
    description: "Appends one immutable compliance signal (badge swipe, network presence sample or manual attestation) to an OPEN week."
    roles: [SystemIntegration, PeopleManager]
    code: 201
    input: [signal_source, site_code, observed_date, minutes_present, dedupe_key]
    output: ComplianceSignal
    side_effects: ["No derived field moves until finalize; signals are pure evidence."]

  - method: POST
    path: "/attendance-weeks/{week_id}/finalize"
    description: "Settles the week: picks the credited-days variant from the team's corroboration policy, applies approved relief, and drives the full non-compliance cascade."
    roles: [SystemIntegration, HRBusinessPartner, PeopleManager]
    code: 200
    input: []
    output: AttendanceWeek
    side_effects: ["required_days := calculations.required_days_for_week", "variant_applied and credited_days := calculations.credited_office_days", "relief_days_credited := calculations.relief_days_credited", "shortfall_days := max(0, required_days - credited_days - relief_days_credited)", "status := FINALIZED, finalized_at := logical now", "Employee.cumulative_shortfall_days, consecutive_breach_weeks, non_compliance_pressure, compliance_state and escalation_stage recomputed", "An EscalationCase is opened or advanced per calculations.pressure_derived_stage unless the live case carries discretionary_hold", "Team.escalated_headcount and formal_action_count recomputed", "PolicyCycle.aggregate_compliance_rate and formal_action_total recomputed"]

  - method: POST
    path: "/attendance-weeks/{week_id}/amend"
    description: "Reopens a FINALIZED week for correction; the week returns to OPEN-equivalent editability under status AMENDED and its contribution to the employee's pressure is withdrawn until it is finalized again."
    roles: [HRBusinessPartner]
    code: 200
    input: [amendment_reason]
    output: AttendanceWeek
    side_effects: ["status := AMENDED", "the week leaves the settled set, so Employee.cumulative_shortfall_days, consecutive_breach_weeks, non_compliance_pressure, compliance_state and escalation_stage are recomputed downward", "Team and PolicyCycle roll-ups recomputed"]

  - method: GET
    path: "/compliance-signals/{signal_id}"
    description: "Reads one immutable compliance signal."
    roles: [WorkplaceProgramOffice, HRBusinessPartner, PeopleManager, AccommodationSpecialist, ComplianceAuditor, SystemIntegration]
    code: 200
    input: []
    output: ComplianceSignal
    side_effects: []

  - method: GET
    path: "/compliance-signals"
    description: "Lists compliance signals; ordered by observed_date ASC then created_at ASC. This is the only discovery channel for signals attached to a week."
    roles: [WorkplaceProgramOffice, HRBusinessPartner, PeopleManager, AccommodationSpecialist, ComplianceAuditor, SystemIntegration]
    code: 200
    input: ["attendance_week_id?", "signal_source?", "limit?", "offset?"]
    output: ComplianceSignal[]
    side_effects: []

  # --- ExceptionRequest ---------------------------------------------------
  - method: POST
    path: "/exception-requests"
    description: "Files an attendance exception request for medical, caregiving or disability-accommodation reasons over a CLOSED date interval."
    roles: [Employee, PeopleManager, HRBusinessPartner]
    code: 201
    input: [employee_id, category, requested_relief_days, start_date, end_date, rationale]
    output: ExceptionRequest
    side_effects: ["status := SUBMITTED", "interactive_process_required := (category IN {MEDICAL, DISABILITY_ACCOMMODATION}) OR Employee.disability_accommodation_on_file", "granted_relief_days := 0", "info_round_count := 0"]

  - method: POST
    path: "/exception-requests/{request_id}/request-info"
    description: "Opens an information round on a live request, moving it to INFO_REQUESTED. This is the interactive-process step for accommodation cases and may repeat."
    roles: [AccommodationSpecialist, HRBusinessPartner]
    code: 200
    input: [info_needed]
    output: ExceptionRequest
    side_effects: ["status := INFO_REQUESTED"]

  - method: POST
    path: "/exception-requests/{request_id}/respond"
    description: "Supplies the requested information and returns the request to SUBMITTED, closing one information round."
    roles: [Employee, PeopleManager, HRBusinessPartner]
    code: 200
    input: [response_note]
    output: ExceptionRequest
    side_effects: ["status := SUBMITTED", "info_round_count += 1"]

  - method: POST
    path: "/exception-requests/{request_id}/adjudicate"
    description: "Closes a live request. decision is one of {APPROVE, DENY, WITHDRAW}. granted_relief_days is required for APPROVE and must not exceed requested_relief_days."
    roles: [AccommodationSpecialist, HRBusinessPartner]
    code: 200
    input: [decision, "granted_relief_days?", "closure_reason?"]
    output: ExceptionRequest
    side_effects: ["On APPROVE: status := APPROVED, granted_relief_days stored, Employee.approved_relief_days_total recomputed, every FINALIZED or LOCKED AttendanceWeek of the employee overlapping [start_date, end_date] recomputes relief_days_credited and shortfall_days, then Employee pressure/compliance_state/escalation_stage recompute, then the live EscalationCase is de-escalated or CURED, then Team.escalated_headcount and formal_action_count and PolicyCycle.formal_action_total and aggregate_compliance_rate recompute", "On DENY: status := DENIED and nothing downstream moves", "On WITHDRAW: status := WITHDRAWN and nothing downstream moves", "adjudicated_by_user_id := X-User-ID"]

  - method: POST
    path: "/exception-requests/{request_id}/revoke"
    description: "Compensating action: withdraws an already APPROVED exception and reverses every effect its approval had."
    roles: [AccommodationSpecialist, HRBusinessPartner]
    code: 200
    input: [closure_reason]
    output: ExceptionRequest
    side_effects: ["status := REVOKED, granted_relief_days := 0", "the same cascade the approval ran is replayed in reverse: affected weeks' relief_days_credited and shortfall_days, Employee.approved_relief_days_total, pressure, compliance_state and escalation_stage, the EscalationCase stage, then Team and PolicyCycle roll-ups - all returning to their pre-approval values with no drift"]

  - method: GET
    path: "/exception-requests/{request_id}"
    description: "Reads one exception request."
    roles: [WorkplaceProgramOffice, HRBusinessPartner, PeopleManager, AccommodationSpecialist, ComplianceAuditor, SystemIntegration, Employee]
    code: 200
    input: []
    output: ExceptionRequest
    side_effects: []

  - method: GET
    path: "/exception-requests"
    description: "Lists exception requests; ordered by created_at ASC, which is also the relief allocation order."
    roles: [WorkplaceProgramOffice, HRBusinessPartner, PeopleManager, AccommodationSpecialist, ComplianceAuditor, SystemIntegration]
    code: 200
    input: ["employee_id?", "status?", "category?", "limit?", "offset?"]
    output: ExceptionRequest[]
    side_effects: []

  # --- RemoteLocationRequest ----------------------------------------------
  - method: POST
    path: "/remote-location-requests"
    description: "Requests approval to work from a named jurisdiction. Requires an APPROVED classification that is not ONSITE_REQUIRED. Scores the PRELIMINARY risk variant at creation."
    roles: [Employee, PeopleManager, HRBusinessPartner]
    code: 201
    input: [employee_id, jurisdiction_code, data_classification_tier, proposed_start_date]
    output: RemoteLocationRequest
    side_effects: ["status := SUBMITTED", "tax_review_status := PENDING", "security_review_status := PENDING", "licensing_gap_count, control_gap_count and tax_nexus_registration_cost_cents := 0", "preliminary_risk_score := calculations.relocation_risk_score variant PRELIMINARY", "final_risk_score := 0 until the decision"]

  - method: POST
    path: "/remote-location-requests/{request_id}/tax-review"
    description: "Records the tax and licensing dimension. review_outcome is one of {CLEARED, BLOCKED}. This dimension moves independently of the security dimension."
    roles: [HRBusinessPartner, WorkplaceProgramOffice]
    code: 200
    input: [review_outcome, licensing_gap_count, tax_nexus_registration_cost_cents]
    output: RemoteLocationRequest
    side_effects: ["tax_review_status := review_outcome", "licensing_gap_count and tax_nexus_registration_cost_cents stored", "status := UNDER_REVIEW if still SUBMITTED", "security_review_status is left untouched"]

  - method: POST
    path: "/remote-location-requests/{request_id}/security-review"
    description: "Records the data-security dimension. review_outcome is one of {CLEARED, BLOCKED}. This dimension moves independently of the tax dimension."
    roles: [ComplianceAuditor, WorkplaceProgramOffice]
    code: 200
    input: [review_outcome, control_gap_count]
    output: RemoteLocationRequest
    side_effects: ["security_review_status := review_outcome", "control_gap_count stored", "status := UNDER_REVIEW if still SUBMITTED", "tax_review_status is left untouched"]

  - method: POST
    path: "/remote-location-requests/{request_id}/decide"
    description: "Join point for the two parallel review dimensions. decision is one of {APPROVE, DENY}. Scores the FINAL risk variant and compares it against APPROVAL_RISK_CEILING."
    roles: [WorkplaceProgramOffice]
    code: 200
    input: [decision]
    output: RemoteLocationRequest
    side_effects: ["final_risk_score := calculations.relocation_risk_score variant FINAL, written on both APPROVE and DENY", "On APPROVE with both dimensions CLEARED: status := APPROVED, decision_reason := BOTH_REVIEWS_CLEARED", "On DENY, or on APPROVE with either dimension BLOCKED: status := DENIED, decision_reason := REVIEW_BLOCKED", "On APPROVE whose FINAL score reaches the ceiling: refused with ERR_RELOCATION_RISK_CEILING and decision_reason := RISK_CEILING_REACHED is NOT written; the request stays UNDER_REVIEW"]

  - method: GET
    path: "/remote-location-requests/{request_id}"
    description: "Reads one remote-location request including both review dimensions and both risk scores."
    roles: [WorkplaceProgramOffice, HRBusinessPartner, PeopleManager, AccommodationSpecialist, ComplianceAuditor, SystemIntegration, Employee]
    code: 200
    input: []
    output: RemoteLocationRequest
    side_effects: []

  - method: GET
    path: "/remote-location-requests"
    description: "Lists remote-location requests; ordered by created_at ASC."
    roles: [WorkplaceProgramOffice, HRBusinessPartner, PeopleManager, AccommodationSpecialist, ComplianceAuditor, SystemIntegration]
    code: 200
    input: ["employee_id?", "status?", "jurisdiction_code?", "limit?", "offset?"]
    output: RemoteLocationRequest[]
    side_effects: []

  # --- Neighborhood, SeatAllocation, DeskAssignment ------------------------
  - method: POST
    path: "/neighborhoods"
    description: "Creates a seating neighborhood anchored to a team, with a contiguous desk index band whose width equals seat_count."
    roles: [WorkplaceProgramOffice]
    code: 201
    input: [policy_cycle_id, anchor_team_id, neighborhood_code, site_code, seat_count, buffer_seats, desk_index_from, desk_index_to]
    output: Neighborhood
    side_effects: ["committed_seats := 0", "peak_committed_seats := 0", "utilization_pct := 0.00", "allocation_state := OPEN, or FROZEN when the cycle posture is LOCKED"]

  - method: GET
    path: "/neighborhoods/{neighborhood_id}"
    description: "Reads one neighborhood including its peak load and allocation state."
    roles: [WorkplaceProgramOffice, HRBusinessPartner, PeopleManager, AccommodationSpecialist, ComplianceAuditor, SystemIntegration]
    code: 200
    input: []
    output: Neighborhood
    side_effects: []

  - method: GET
    path: "/neighborhoods"
    description: "Lists neighborhoods; ordered by neighborhood_code ASC."
    roles: [WorkplaceProgramOffice, HRBusinessPartner, PeopleManager, AccommodationSpecialist, ComplianceAuditor, SystemIntegration]
    code: 200
    input: ["policy_cycle_id?", "anchor_team_id?", "allocation_state?", "limit?", "offset?"]
    output: Neighborhood[]
    side_effects: []

  - method: POST
    path: "/seat-allocations"
    description: "Reserves seats for a team in a neighborhood over a HALF-OPEN ISO-week window [window_start_week, window_end_week). Carries the OCC guard expected_neighborhood_version."
    roles: [WorkplaceProgramOffice]
    code: 201
    input: [neighborhood_id, team_id, allocated_seats, window_start_week, window_end_week, expected_neighborhood_version]
    output: SeatAllocation
    side_effects: ["status := RESERVED", "weeks_in_window := week_ordinal(window_end_week) - week_ordinal(window_start_week)", "line_chargeback_cents := 0 until commit", "Neighborhood.version += 1 on success"]

  - method: POST
    path: "/seat-allocations/{allocation_id}/commit"
    description: "Commits a reserved allocation, charging it back and admitting it to the neighborhood's per-week aggregate load."
    roles: [WorkplaceProgramOffice]
    code: 200
    input: []
    output: SeatAllocation
    side_effects: ["status := COMMITTED", "line_chargeback_cents := calculations.space_chargeback_cents step 1", "Neighborhood.committed_seats, peak_committed_seats, utilization_pct and allocation_state recomputed"]

  - method: POST
    path: "/seat-allocations/{allocation_id}/release"
    description: "Compensating action: releases a committed allocation and returns its seats to the neighborhood."
    roles: [WorkplaceProgramOffice]
    code: 200
    input: [release_reason]
    output: SeatAllocation
    side_effects: ["status := RELEASED", "line_chargeback_cents := 0", "every ASSIGNED DeskAssignment on this allocation moves to VACATED", "Neighborhood.committed_seats, peak_committed_seats, utilization_pct and allocation_state recomputed downward"]

  - method: GET
    path: "/seat-allocations/{allocation_id}"
    description: "Reads one seat allocation."
    roles: [WorkplaceProgramOffice, HRBusinessPartner, PeopleManager, AccommodationSpecialist, ComplianceAuditor, SystemIntegration]
    code: 200
    input: []
    output: SeatAllocation
    side_effects: []

  - method: GET
    path: "/seat-allocations"
    description: "Lists seat allocations; ordered by created_at ASC, which is also the chargeback accumulation order."
    roles: [WorkplaceProgramOffice, HRBusinessPartner, PeopleManager, AccommodationSpecialist, ComplianceAuditor, SystemIntegration]
    code: 200
    input: ["neighborhood_id?", "team_id?", "status?", "limit?", "offset?"]
    output: SeatAllocation[]
    side_effects: []

  - method: POST
    path: "/desk-assignments"
    description: "Assigns a named desk index to an employee over a CLOSED date interval inside a committed allocation's week window."
    roles: [WorkplaceProgramOffice, PeopleManager]
    code: 201
    input: [seat_allocation_id, employee_id, desk_index, start_date, end_date]
    output: DeskAssignment
    side_effects: ["status := ASSIGNED", "assignment_mode := MANUAL"]

  - method: POST
    path: "/desk-assignments/auto"
    description: "Lets the server pick the neighborhood and desk index using calculations.desk_selector, then creates the assignment."
    roles: [WorkplaceProgramOffice, PeopleManager]
    code: 201
    input: [employee_id, start_date, end_date]
    output: DeskAssignment
    side_effects: ["status := ASSIGNED", "assignment_mode := AUTO", "seat_allocation_id and desk_index are chosen by the pinned selector policy"]

  - method: POST
    path: "/desk-assignments/{assignment_id}/vacate"
    description: "Vacates a live desk assignment, freeing the desk for a new occupant subject to the changeover buffer."
    roles: [WorkplaceProgramOffice, PeopleManager]
    code: 200
    input: []
    output: DeskAssignment
    side_effects: ["status := VACATED", "vacated_at := logical now", "the desk stops conflicting with new assignments"]

  - method: GET
    path: "/desk-assignments/{assignment_id}"
    description: "Reads one desk assignment."
    roles: [WorkplaceProgramOffice, HRBusinessPartner, PeopleManager, AccommodationSpecialist, ComplianceAuditor, SystemIntegration]
    code: 200
    input: []
    output: DeskAssignment
    side_effects: []

  - method: GET
    path: "/desk-assignments"
    description: "Lists desk assignments; ordered by start_date ASC then desk_index ASC. This is the discovery channel for assignments the server created or vacated by cascade."
    roles: [WorkplaceProgramOffice, HRBusinessPartner, PeopleManager, AccommodationSpecialist, ComplianceAuditor, SystemIntegration]
    code: 200
    input: ["seat_allocation_id?", "employee_id?", "status?", "limit?", "offset?"]
    output: DeskAssignment[]
    side_effects: []

  # --- EscalationCase (cascade-created; no collection POST) ---------------
  - method: POST
    path: "/escalation-cases/{case_id}/escalate"
    description: "Manually advances a case one rung up the escalation ladder: COACHING -> WRITTEN_WARNING -> PERFORMANCE_PLAN -> REFERRED."
    roles: [PeopleManager, HRBusinessPartner]
    code: 200
    input: [action_note]
    output: EscalationCase
    side_effects: ["stage moves one rung up", "Employee.escalation_stage mirrors the new stage", "Team.formal_action_count and PolicyCycle.formal_action_total recomputed", "last_action_by_user_id := X-User-ID"]

  - method: POST
    path: "/escalation-cases/{case_id}/de-escalate"
    description: "Manually steps a case one rung back down the ladder; from COACHING the only exit is a cure driven by the relief cascade, so this is refused at the floor."
    roles: [PeopleManager, HRBusinessPartner]
    code: 200
    input: [action_note]
    output: EscalationCase
    side_effects: ["stage moves one rung down", "Employee.escalation_stage mirrors the new stage", "Team.formal_action_count and PolicyCycle.formal_action_total recomputed", "last_action_by_user_id := X-User-ID"]

  - method: POST
    path: "/escalation-cases/{case_id}/hold"
    description: "Sets or clears discretionary_hold. While the hold is set, automatic pressure-driven stage changes are suppressed for this case, but pressure itself keeps accumulating on the employee."
    roles: [HRBusinessPartner]
    code: 200
    input: [discretionary_hold, action_note]
    output: EscalationCase
    side_effects: ["discretionary_hold := the supplied boolean", "no stage change and no roll-up change occurs on this call", "last_action_by_user_id := X-User-ID"]

  - method: GET
    path: "/escalation-cases/{case_id}"
    description: "Reads one escalation case."
    roles: [WorkplaceProgramOffice, HRBusinessPartner, PeopleManager, AccommodationSpecialist, ComplianceAuditor, SystemIntegration]
    code: 200
    input: []
    output: EscalationCase
    side_effects: []

  - method: GET
    path: "/escalation-cases"
    description: "Lists escalation cases; ordered by created_at ASC. Cases are only ever created by system cascade, so this is their sole discovery channel. prior_case_id finds the successor of a closed case."
    roles: [WorkplaceProgramOffice, HRBusinessPartner, PeopleManager, AccommodationSpecialist, ComplianceAuditor, SystemIntegration]
    code: 200
    input: ["employee_id?", "prior_case_id?", "stage?", "limit?", "offset?"]
    output: EscalationCase[]
    side_effects: []

  # --- RecalibrationReview ------------------------------------------------
  - method: POST
    path: "/recalibration-reviews"
    description: "Drafts a periodic recalibration of the cycle's days-in-office expectation."
    roles: [WorkplaceProgramOffice]
    code: 201
    input: [policy_cycle_id, review_label, proposed_days_in_office_delta]
    output: RecalibrationReview
    side_effects: ["state := DRAFT", "every computed measurement field := 0 / false until submit"]

  - method: POST
    path: "/recalibration-reviews/{review_id}/submit"
    description: "Freezes the measurement snapshot: collaboration index, space chargeback total and the equity spread across demographic bands."
    roles: [WorkplaceProgramOffice]
    code: 200
    input: []
    output: RecalibrationReview
    side_effects: ["state := SUBMITTED", "collaboration_index := calculations.collaboration_index", "meets_collaboration_target := collaboration_index >= PolicyCycle.collaboration_target_score", "total_space_chargeback_cents := calculations.space_chargeback_cents step 2", "qualifying_band_count and equity_variance_pct := calculations.equity_variance", "equity_flag := (qualifying_band_count >= 2 AND equity_variance_pct > PolicyCycle.equity_variance_threshold_pct)", "submitted_by_user_id := X-User-ID"]

  - method: POST
    path: "/recalibration-reviews/{review_id}/decision"
    description: "Adopts or rejects a submitted review. decision is one of {ADOPT, REJECT}. Carries the OCC guard expected_policy_cycle_version. The caller may not be submitted_by_user_id."
    roles: [WorkplaceProgramOffice, ComplianceAuditor]
    code: 200
    input: [decision, expected_policy_cycle_version, "decision_reason?"]
    output: RecalibrationReview
    side_effects: ["On ADOPT: state := ADOPTED; every Team in the cycle has expected_days_in_office_per_week shifted by proposed_days_in_office_delta and clamped to 0..5, processed in team_code ASC order; each such team re-runs calculations.team_seat_entitlement; PolicyCycle.posture := OPEN; PolicyCycle.version += 1", "On REJECT: state := REJECTED; no Team is touched; PolicyCycle.posture := OPEN; PolicyCycle.version += 1", "decided_by_user_id := X-User-ID"]

  - method: GET
    path: "/recalibration-reviews/{review_id}"
    description: "Reads one recalibration review including its frozen measurements."
    roles: [WorkplaceProgramOffice, HRBusinessPartner, PeopleManager, AccommodationSpecialist, ComplianceAuditor, SystemIntegration]
    code: 200
    input: []
    output: RecalibrationReview
    side_effects: []

  - method: GET
    path: "/recalibration-reviews"
    description: "Lists recalibration reviews; ordered by created_at ASC."
    roles: [WorkplaceProgramOffice, HRBusinessPartner, PeopleManager, AccommodationSpecialist, ComplianceAuditor, SystemIntegration]
    code: 200
    input: ["policy_cycle_id?", "state?", "limit?", "offset?"]
    output: RecalibrationReview[]
    side_effects: []

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:

  # --- authentication / authorisation -------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID header missing or empty on any endpoint other than POST /_clock/set_current_utc."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The caller's X-User-Role is not listed in the endpoint's roles column. Checked before existence, so it also masks a bad resource id."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "A caller with role Employee addresses an Employee-scoped resource that does not belong to their own Employee row."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "The classification decision caller equals created_by_user_id, or the recalibration decision caller equals submitted_by_user_id."

  # --- existence ----------------------------------------------------------
  - id: ERR_POLICY_CYCLE_NOT_FOUND
    http: 404
    condition: "policy_cycle_id or {cycle_id} does not resolve to a PolicyCycle."
  - id: ERR_TEAM_NOT_FOUND
    http: 404
    condition: "team_id, anchor_team_id or {team_id} does not resolve to a Team."
  - id: ERR_EMPLOYEE_NOT_FOUND
    http: 404
    condition: "employee_id or {employee_id} does not resolve to an Employee."
  - id: ERR_CLASSIFICATION_NOT_FOUND
    http: 404
    condition: "{classification_id} does not resolve to an EligibilityClassification."
  - id: ERR_ATTENDANCE_WEEK_NOT_FOUND
    http: 404
    condition: "{week_id} or attendance_week_id does not resolve to an AttendanceWeek."
  - id: ERR_COMPLIANCE_SIGNAL_NOT_FOUND
    http: 404
    condition: "{signal_id} does not resolve to a ComplianceSignal."
  - id: ERR_EXCEPTION_REQUEST_NOT_FOUND
    http: 404
    condition: "{request_id} does not resolve to an ExceptionRequest."
  - id: ERR_RELOCATION_REQUEST_NOT_FOUND
    http: 404
    condition: "{request_id} does not resolve to a RemoteLocationRequest."
  - id: ERR_NEIGHBORHOOD_NOT_FOUND
    http: 404
    condition: "neighborhood_id or {neighborhood_id} does not resolve to a Neighborhood."
  - id: ERR_SEAT_ALLOCATION_NOT_FOUND
    http: 404
    condition: "seat_allocation_id or {allocation_id} does not resolve to a SeatAllocation."
  - id: ERR_DESK_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "{assignment_id} does not resolve to a DeskAssignment."
  - id: ERR_ESCALATION_CASE_NOT_FOUND
    http: 404
    condition: "{case_id} does not resolve to an EscalationCase."
  - id: ERR_RECALIBRATION_REVIEW_NOT_FOUND
    http: 404
    condition: "{review_id} does not resolve to a RecalibrationReview."

  # --- request shape ------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "A required input field is missing, an enum carries an undeclared member, a numeric input falls outside its declared range, badge_weight + network_weight != 1.00, week_start_date is not the Monday of iso_week, iso_week does not match ^\\d{4}-W\\d{2}$, the neighborhood desk band width does not equal seat_count, or buffer_seats >= seat_count."
  - id: ERR_INVALID_INTERVAL
    http: 422
    condition: "A declared interval is empty or inverted: a SeatAllocation whose window_end_week is not strictly after window_start_week in ISO-week ordinal terms, or a DeskAssignment or ExceptionRequest whose end_date precedes its start_date."
  - id: ERR_SIGNAL_OUTSIDE_WEEK
    http: 422
    condition: "A ComplianceSignal's observed_date lies outside the seven dates [week_start_date .. week_start_date + 6 days] of the addressed AttendanceWeek."

  # --- optimistic concurrency ---------------------------------------------
  - id: ERR_STALE_EMPLOYEE_VERSION
    http: 412
    condition: "POST /eligibility-classifications carries an expected_employee_version that does not equal the current Employee.version."
  - id: ERR_STALE_NEIGHBORHOOD_VERSION
    http: 412
    condition: "POST /seat-allocations carries an expected_neighborhood_version that does not equal the current Neighborhood.version."
  - id: ERR_STALE_POLICY_CYCLE_VERSION
    http: 412
    condition: "POST /recalibration-reviews/{review_id}/decision carries an expected_policy_cycle_version that does not equal the current PolicyCycle.version."

  # --- lifecycle / state --------------------------------------------------
  - id: ERR_CYCLE_LOCKED
    http: 409
    condition: "Any mutation anywhere inside a PolicyCycle whose posture is LOCKED."
  - id: ERR_CYCLE_NOT_RECALIBRATING
    http: 409
    condition: "A recalibration submit or decision addressed a review whose parent PolicyCycle.posture is not RECALIBRATING."
  - id: ERR_INVALID_POSTURE_TRANSITION
    http: 409
    condition: "POST /policy-cycles/{cycle_id}/posture names a target_posture that is not reachable from the current posture, including any transition out of LOCKED."
  - id: ERR_CLASSIFICATION_NOT_DRAFT
    http: 409
    condition: "POST /eligibility-classifications/{classification_id}/submit addressed a classification whose state is not DRAFT."
  - id: ERR_CLASSIFICATION_NOT_PENDING
    http: 409
    condition: "POST /eligibility-classifications/{classification_id}/decision addressed a classification whose state is not PENDING_MANAGER, including a second decision on an already APPROVED row."
  - id: ERR_WEEK_NOT_OPEN
    http: 409
    condition: "A signal append or a finalize addressed an AttendanceWeek whose status is neither OPEN nor AMENDED, including a second finalize of the same week."
  - id: ERR_WEEK_NOT_FINALIZED
    http: 409
    condition: "POST /attendance-weeks/{week_id}/amend addressed a week whose status is not FINALIZED."
  - id: ERR_REQUEST_NOT_SUBMITTED
    http: 409
    condition: "A request-info or adjudicate call addressed an ExceptionRequest whose status is not SUBMITTED or INFO_REQUESTED."
  - id: ERR_REQUEST_NOT_INFO_REQUESTED
    http: 409
    condition: "POST /exception-requests/{request_id}/respond addressed a request whose status is not INFO_REQUESTED."
  - id: ERR_EXCEPTION_NOT_APPROVED
    http: 409
    condition: "POST /exception-requests/{request_id}/revoke addressed a request whose status is not APPROVED, including a second revoke."
  - id: ERR_REVIEW_ALREADY_RECORDED
    http: 409
    condition: "A tax-review or security-review call addressed a dimension that has already left PENDING, or a request that is already APPROVED or DENIED."
  - id: ERR_REVIEWS_INCOMPLETE
    http: 409
    condition: "POST /remote-location-requests/{request_id}/decide while either tax_review_status or security_review_status is still PENDING."
  - id: ERR_RELOCATION_DECISION_FINAL
    http: 409
    condition: "POST /remote-location-requests/{request_id}/decide addressed a request already in the terminal APPROVED or DENIED status."
  - id: ERR_ALLOCATION_NOT_RESERVED
    http: 409
    condition: "POST /seat-allocations/{allocation_id}/commit addressed an allocation whose status is not RESERVED."
  - id: ERR_ALLOCATION_TERMINAL
    http: 409
    condition: "Either seat-allocation trigger addressed an allocation whose status is RELEASED, which is terminal."
  - id: ERR_ASSIGNMENT_NOT_ACTIVE
    http: 409
    condition: "POST /desk-assignments/{assignment_id}/vacate addressed an assignment whose status is not ASSIGNED, including a second vacate."
  - id: ERR_ESCALATION_AT_FLOOR
    http: 409
    condition: "POST /escalation-cases/{case_id}/de-escalate addressed a case whose stage is already COACHING, the bottom rung of the ladder."
  - id: ERR_ESCALATION_AT_CEILING
    http: 409
    condition: "POST /escalation-cases/{case_id}/escalate addressed a case whose stage is already REFERRED, the top rung of the ladder."
  - id: ERR_ESCALATION_TERMINAL
    http: 409
    condition: "Any escalation trigger addressed a case whose stage is CURED or CLOSED_SEPARATION, both terminal."
  - id: ERR_REVIEW_NOT_DRAFT
    http: 409
    condition: "POST /recalibration-reviews/{review_id}/submit addressed a review whose state is not DRAFT."
  - id: ERR_REVIEW_NOT_SUBMITTED
    http: 409
    condition: "POST /recalibration-reviews/{review_id}/decision addressed a review whose state is not SUBMITTED, including a second decision on an ADOPTED or REJECTED review."
  - id: ERR_EMPLOYEE_NOT_ACTIVE
    http: 409
    condition: "A work item was created for an Employee whose status is ON_LEAVE or SEPARATED."
  - id: ERR_INVALID_EMPLOYEE_STATUS_TRANSITION
    http: 409
    condition: "POST /employees/{employee_id}/status names a target_status not reachable from the current status, including any transition out of the terminal SEPARATED."

  # --- cross-entity gates -------------------------------------------------
  - id: ERR_NO_APPROVED_CLASSIFICATION
    http: 409
    condition: "POST /remote-location-requests for an employee who holds no APPROVED EligibilityClassification."
  - id: ERR_CLASS_NOT_REMOTE_ELIGIBLE
    http: 409
    condition: "POST /remote-location-requests for an employee whose current_eligibility_class is ONSITE_REQUIRED."
  - id: ERR_TEAM_ALLOCATION_MISMATCH
    http: 409
    condition: "A SeatAllocation whose Team and Neighborhood belong to different policy cycles, or a DeskAssignment whose Employee is not on the allocation's team, or whose desk_index falls outside the neighborhood's declared band."
  - id: ERR_ASSIGNMENT_OUTSIDE_WINDOW
    http: 409
    condition: "A DeskAssignment whose closed date interval touches an ISO week outside its allocation's half-open week window - including the week named by the exclusive window_end_week."
  - id: ERR_ACCOMMODATION_SPECIALIST_REQUIRED
    http: 409
    condition: "An adjudication of a request whose interactive_process_required is true, by a caller whose role is not AccommodationSpecialist."
  - id: ERR_INTERACTIVE_PROCESS_PENDING
    http: 409
    condition: "An APPROVE adjudication of a request whose interactive_process_required is true and whose info_round_count is still 0."
  - id: ERR_DATA_RESIDENCY_PROHIBITED
    http: 409
    condition: "An APPROVE decision on a RESTRICTED-tier relocation whose jurisdiction_code is not in ALLOWED_RESTRICTED_JURISDICTIONS."

  # --- uniqueness ---------------------------------------------------------
  - id: ERR_DUPLICATE_CYCLE_LABEL
    http: 409
    condition: "POST /policy-cycles with a cycle_label already used by another PolicyCycle."
  - id: ERR_DUPLICATE_TEAM_CODE
    http: 409
    condition: "POST /teams with a team_code already used inside the same policy_cycle_id."
  - id: ERR_DUPLICATE_EMPLOYEE_NUMBER
    http: 409
    condition: "POST /employees with an employee_number already used by another Employee."
  - id: ERR_DUPLICATE_WORK_EMAIL
    http: 409
    condition: "POST /employees with a work_email already used by another Employee."
  - id: ERR_DUPLICATE_ATTENDANCE_WEEK
    http: 409
    condition: "POST /attendance-weeks for an (employee_id, iso_week) pair that already exists."
  - id: ERR_DUPLICATE_SIGNAL
    http: 409
    condition: "A signal append whose dedupe_key already exists on the addressed AttendanceWeek. Outranks ERR_SIGNAL_OUTSIDE_WEEK."
  - id: ERR_DUPLICATE_NEIGHBORHOOD_CODE
    http: 409
    condition: "POST /neighborhoods with a neighborhood_code already used inside the same policy_cycle_id."
  - id: ERR_DUPLICATE_REVIEW_LABEL
    http: 409
    condition: "POST /recalibration-reviews with a review_label already used inside the same policy_cycle_id."

  # --- aggregate capacity, overlap, ceilings ------------------------------
  - id: ERR_NEIGHBORHOOD_CAPACITY_EXCEEDED
    http: 409
    condition: "A commit that would push the per-week aggregate of COMMITTED allocated_seats above seat_count - buffer_seats in at least one ISO week of the allocation's half-open window. Landing exactly on capacity is permitted."
  - id: ERR_SEAT_ENTITLEMENT_EXCEEDED
    http: 409
    condition: "A seat allocation whose requested seats would push the team's non-RELEASED per-week total above Team.entitled_seats in at least one ISO week."
  - id: ERR_DESK_CHANGEOVER_CONFLICT
    http: 409
    condition: "A desk assignment whose closed interval sits within CHANGEOVER_BUFFER_DAYS of an existing ASSIGNED interval on the same neighborhood and desk_index - abutting intervals conflict, VACATED ones never do."
  - id: ERR_EXCEPTION_WINDOW_OVERLAP
    http: 409
    condition: "A new exception request whose closed interval overlaps a SUBMITTED, INFO_REQUESTED or APPROVED request of the same employee and category."
  - id: ERR_RELIEF_EXCEEDS_REQUEST
    http: 409
    condition: "An APPROVE adjudication whose granted_relief_days exceeds the request's requested_relief_days."
  - id: ERR_RELOCATION_RISK_CEILING
    http: 409
    condition: "An APPROVE decision whose FINAL relocation risk score reaches APPROVAL_RISK_CEILING (60). Exactly 60 is refused; 59 is approvable."
  - id: ERR_TAX_NEXUS_BUDGET_EXCEEDED
    http: 409
    condition: "A tax review recording tax_nexus_registration_cost_cents above the per-request budget of 5000000."
  - id: ERR_BELOW_DAYS_FLOOR
    http: 409
    condition: "An ADOPT decision whose delta would drive some Team's expected_days_in_office_per_week below PolicyCycle.days_in_office_floor."
  - id: ERR_NO_ELIGIBLE_DESK
    http: 409
    condition: "POST /desk-assignments/auto found an empty candidate pool after the selector's eligibility filter."
  - id: ERR_EQUITY_FLAG_BLOCKS_ADOPTION
    http: 409
    condition: "An ADOPT decision on a review whose equity_flag is true. Lowest precedence of all validations, so a days-floor breach reports first."

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix - role_model: segregation_of_duties
# ---------------------------------------------------------------------------
roles:

  - name: Employee
    description: "The person subject to the policy. Files their own exception and relocation requests and answers information rounds, and can read their own attendance record - nothing else."
    identity: "entity_backed:Employee"
    exclusive_operations: []
    shared_operations:
      - "POST /exception-requests (own employee_id only)"
      - "POST /exception-requests/{request_id}/respond (own request only)"
      - "POST /remote-location-requests (own employee_id only)"
      - "GET /employees/{employee_id} (own row only)"
      - "GET /attendance-weeks/{week_id} (own week only)"
      - "GET /exception-requests/{request_id} (own request only)"
      - "GET /remote-location-requests/{request_id} (own request only)"
      - "POST /_clock/set_current_utc"

  - name: PeopleManager
    description: "The approving manager for eligibility classification and the first rung of the coaching ladder. Also records manual attestations and manual desk assignments for their team."
    identity: "opaque"
    exclusive_operations:
      - "POST /eligibility-classifications/{classification_id}/decision"
    shared_operations:
      - "POST /eligibility-classifications"
      - "POST /eligibility-classifications/{classification_id}/submit"
      - "POST /attendance-weeks"
      - "POST /attendance-weeks/{week_id}/signals"
      - "POST /attendance-weeks/{week_id}/finalize"
      - "POST /exception-requests"
      - "POST /exception-requests/{request_id}/respond"
      - "POST /remote-location-requests"
      - "POST /desk-assignments"
      - "POST /desk-assignments/auto"
      - "POST /desk-assignments/{assignment_id}/vacate"
      - "POST /escalation-cases/{case_id}/escalate"
      - "POST /escalation-cases/{case_id}/de-escalate"
      - "all GET reads except GET /employees list filtering by demographic band"
      - "POST /_clock/set_current_utc"

  - name: HRBusinessPartner
    description: "Owns the employee record and the amendment/adjudication surface. Cannot record the eligibility decision, which belongs to the manager, and cannot decide a relocation, which belongs to the program office."
    identity: "opaque"
    exclusive_operations:
      - "POST /employees"
      - "POST /employees/{employee_id}/status"
      - "POST /attendance-weeks/{week_id}/amend"
      - "POST /escalation-cases/{case_id}/hold"
    shared_operations:
      - "POST /eligibility-classifications"
      - "POST /eligibility-classifications/{classification_id}/submit"
      - "POST /attendance-weeks"
      - "POST /attendance-weeks/{week_id}/finalize"
      - "POST /exception-requests"
      - "POST /exception-requests/{request_id}/request-info"
      - "POST /exception-requests/{request_id}/respond"
      - "POST /exception-requests/{request_id}/adjudicate (only when interactive_process_required is false)"
      - "POST /exception-requests/{request_id}/revoke"
      - "POST /remote-location-requests"
      - "POST /remote-location-requests/{request_id}/tax-review"
      - "POST /escalation-cases/{case_id}/escalate"
      - "POST /escalation-cases/{case_id}/de-escalate"
      - "all GET reads"
      - "POST /_clock/set_current_utc"

  - name: AccommodationSpecialist
    description: "Runs the interactive process for medical, caregiving and disability-accommodation exceptions. The only role permitted to adjudicate a request whose interactive_process_required is true."
    identity: "opaque"
    exclusive_operations:
      - "POST /exception-requests/{request_id}/adjudicate when interactive_process_required is true"
    shared_operations:
      - "POST /exception-requests/{request_id}/request-info"
      - "POST /exception-requests/{request_id}/adjudicate"
      - "POST /exception-requests/{request_id}/revoke"
      - "all GET reads"
      - "POST /_clock/set_current_utc"

  - name: WorkplaceProgramOffice
    description: "Owns the policy cycle, the space model and the recalibration workflow. Cannot create employees or amend attendance, which belong to HR."
    identity: "opaque"
    exclusive_operations:
      - "POST /policy-cycles"
      - "POST /policy-cycles/{cycle_id}/posture"
      - "POST /teams"
      - "POST /neighborhoods"
      - "POST /seat-allocations"
      - "POST /seat-allocations/{allocation_id}/commit"
      - "POST /seat-allocations/{allocation_id}/release"
      - "POST /remote-location-requests/{request_id}/decide"
      - "POST /recalibration-reviews"
      - "POST /recalibration-reviews/{review_id}/submit"
    shared_operations:
      - "POST /remote-location-requests/{request_id}/tax-review"
      - "POST /remote-location-requests/{request_id}/security-review"
      - "POST /desk-assignments"
      - "POST /desk-assignments/auto"
      - "POST /desk-assignments/{assignment_id}/vacate"
      - "POST /recalibration-reviews/{review_id}/decision"
      - "all GET reads"
      - "POST /_clock/set_current_utc"

  - name: ComplianceAuditor
    description: "Independent reviewer of data-security posture and of recalibration adoption. Read-only everywhere else, and deliberately able to countersign a review the program office submitted."
    identity: "opaque"
    exclusive_operations:
      - "POST /remote-location-requests/{request_id}/security-review"
    shared_operations:
      - "POST /recalibration-reviews/{review_id}/decision"
      - "all GET reads"
      - "POST /_clock/set_current_utc"

  - name: SystemIntegration
    description: "The badge and network telemetry feed. Opens attendance weeks, appends automated signals and settles weeks; touches nothing else."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /attendance-weeks"
      - "POST /attendance-weeks/{week_id}/signals"
      - "POST /attendance-weeks/{week_id}/finalize"
      - "all GET reads"
      - "POST /_clock/set_current_utc"
