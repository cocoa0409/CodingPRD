        test_recipe:
          setup:
            - "an empty-cohort packet for the single day 2026-08-01 compiled by compliance-A, so deficiency_flags is [\"F248_INSUFFICIENT_FREQUENCY\"] and a remediation_note is always supplied"
            - "the clock stays at 2026-08-01T00:00:00Z so window_end equals the calendar date of current_utc"
