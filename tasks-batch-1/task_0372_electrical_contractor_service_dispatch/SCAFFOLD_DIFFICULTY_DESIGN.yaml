              payload: { job_id: "${job_id}", technician_id: "${tech_id}", sku_id: "${sku_id}", quantity: 5 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { usage_id: $.data.id }
          trigger:
            - call: "POST /v1/material-usages"
              payload: { job_id: "${job_id}", technician_id: "${tech_id}", sku_id: "${sku_id}", quantity: 1 }
              as: Technician
