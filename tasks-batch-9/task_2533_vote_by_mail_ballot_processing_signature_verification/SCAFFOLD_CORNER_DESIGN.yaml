      - name: second_check_in_and_double_revocation_return_session_state_invalid
        claim_type: Idempotency
        grounds:
          - errors[ERR_SESSION_STATE_INVALID]
          - validations[ERR_SESSION_STATE_INVALID]
          - state_machines.ObserverAccessSession.transitions.SCHEDULED_to_CHECKED_IN
        distinguishing_aspect: "Check-in requires SCHEDULED and revocation requires SCHEDULED or CHECKED_IN, so a second check-in on a CHECKED_IN session and a second revoke on a REVOKED session both return 409 ERR_SESSION_STATE_INVALID rather than ERR_OBSERVER_WINDOW_NOT_ACTIVE."
        test_recipe:
          setup:
            - "Observer session os1 (DEM, INTAKE, window 14:00-16:00Z) checked in with the clock at 2026-11-03T14:30:00Z."
          setup_api_calls:
            - *c_clock_sep10
            - *c_election
            - *c_session_dem
            - call: "POST /vote-by-mail/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-03T14:30:00Z" }
              as: ElectionsAdmin
            - call: "POST /vote-by-mail/observer-sessions/${os1}/check-in"
              payload: {}
              as: Observer
              as_user_id: "obs-dem-1"
          trigger:
            - call: "POST /vote-by-mail/observer-sessions/${os1}/check-in"
              payload: {}
              as: Observer
              as_user_id: "obs-dem-1"
              captures: { second_checkin_err: $.data.error_id }
            - call: "POST /vote-by-mail/observer-sessions/${os1}/revoke"
              payload: { revocation_reason_code: "DISRUPTIVE_CONDUCT" }
              as: CanvassSupervisor
            - call: "POST /vote-by-mail/observer-sessions/${os1}/revoke"
              payload: { revocation_reason_code: "DISRUPTIVE_CONDUCT" }
              as: CanvassSupervisor
              captures: { second_revoke_err: $.data.error_id }
          assert:
            - "Second check-in: HTTP 409 with data.error_id == \"ERR_SESSION_STATE_INVALID\" (the clock is inside the window, so this is not ERR_OBSERVER_WINDOW_NOT_ACTIVE)"
            - "First revoke: HTTP 200 with status == \"REVOKED\""
            - "Second revoke: HTTP 409 with data.error_id == \"ERR_SESSION_STATE_INVALID\""
            - "GET /vote-by-mail/observer-sessions?election_id=${e1}&status=REVOKED returns total_count == 1"
            - "GET /vote-by-mail/transparency-log?election_id=${e1}&event_type=OBSERVER_SESSION_REVOKED returns total_count == 1 (the refused second revoke logs nothing)"

  - section: rbac
    instances:
      - name: signature_reviewer_cannot_open_a_review_round_or_issue_a_cure
        claim_type: Exclusive operations
        grounds:
          - roles.SignatureReviewer.exclusive_operations
          - roles.ElectionsClerk.exclusive_operations
          - validations[ERR_ROLE_FORBIDDEN]
        distinguishing_aspect: "The reviewer's only write is the decision on their own assigned review: opening a round and issuing a cure notice both return 403 ERR_ROLE_FORBIDDEN for SignatureReviewer while the identical calls succeed for ElectionsClerk."
        test_recipe:
          setup:
            - "Envelope en1 SEALED and UNVERIFIED; reviewer rv1 TRAINED."
          setup_api_calls:
            - *c_clock_sep10
            - *c_election
            - *c_voter1
            - *c_reviewer1
            - *c_request1
            - *c_av1_lookup
            - *c_av1_same
            - *c_approve1
            - *c_batch1
            - *c_packet1
            - *c_seal1
            - *c_dispatch1
            - *c_clock_nov3
            - *c_envelope1
          trigger:
            - call: "POST /vote-by-mail/return-envelopes/${en1}/signature-reviews"
              payload: {}
