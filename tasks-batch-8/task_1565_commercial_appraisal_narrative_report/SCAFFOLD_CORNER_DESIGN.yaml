        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=8]", "errors[ERR_FORBIDDEN_FOR_ROLE]"]
        distinguishing_aspect: "Role authorization (priority 2) precedes state (priority 8): a StaffAppraiser calling sign on a DRAFTING report gets ERR_FORBIDDEN_FOR_ROLE, not ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["engagement IN_PROGRESS; report in DRAFTING"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Apex Bank", client_type: "LENDER" }
