# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Temporary Fencing & Site Security Rental — 9 rule_ids x 2 instances = 18.
# Every numeric literal in every `assert:` was produced by executing the
# matching §1.3 formula against its `constants:` (Decimal + ROUND_HALF_UP).
# Municipality HRB-01 carries rental_tax_rate_bp 890 throughout.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: event_vs_construction_proration_divergence
        grounds:
          - calculations.invoice_period_charge
          - calculations.invoice_total_rollup
          - entities.RentalContract.fields.contract_type
          - entities.Invoice.fields.billable_days
          - state_machines.RentalContract.billing_NOT_BILLED_to_CURRENT
        distinguishing_aspect: |
          Two contracts holding the byte-identical monthly_recurring_cents of 60000,
          billed over the byte-identical 17-day window, produce 34000 and 36429
          because the EVENT variant rounds a daily rate before multiplying by days
          while the CONSTRUCTION variant multiplies by a 28-day cycle fraction and
          rounds once; the variant is selected by RentalContract.contract_type alone.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z, then advanced to 2026-08-20 for mobilization and 2026-09-06 for billing."
            - "Municipality HRB-01: permit_lead_time_days 5, max_concurrent_closure_linear_feet 800, rental_tax_rate_bp 890."
            - "One account with a credit_limit_cents high enough that no dispatch is ever credit-held."
            - "Two jobsites, both SOIL, both requires_sidewalk_closure false, so no permit gating applies."
            - "EVENT contract: 250 ft, NONE screen, term 1, BARR-8 x10 -> monthly_recurring_cents 60000, install_labor_cents 48750."
            - "CONSTRUCTION contract: 250 ft, NONE screen, term 3, GATE-12 x7 + BARR-8 x4 -> monthly_recurring_cents 60000, install_labor_cents 51250."
            - "Both contracts ACTIVE with billing_anchor_utc 2026-08-20T00:00:00Z and billing_status CURRENT from their MOBILIZATION invoices."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fence-rentals/municipalities"
              payload: { name: "City of Harbor Point", jurisdiction_code: "HRB-01", permit_lead_time_days: 5, max_concurrent_closure_linear_feet: 800, rental_tax_rate_bp: 890, permit_review_rounds_allowed: 2, allows_solid_wind_screen: true }
              as: PlatformAdmin
              captures: { m1_id: "$.data.id"}
            - call: "POST /fence-rentals/accounts"
              payload: { legal_name: "Ridgeline Builders LLC", billing_email: "ap@ridgeline.example", credit_limit_cents: 100000000 }
              as: AccountManager
              as_user_id: "am-001"
              captures: { a1_id: "$.data.id"}
            - call: "POST /fence-rentals/products"
              payload: { code: "PANEL-CL-10", category: "FENCE_PANEL", description: "10 ft chain-link fence panel", panel_length_ft: 10, unit_monthly_rate_cents: 0, replacement_cost_cents_per_unit: 24000, fleet_age_months: 18, wind_load_rating_mph: 90, owned_count: 400 }
              as: PlatformAdmin
              captures: { p_panel_id: "$.data.id"}
            - call: "POST /fence-rentals/products"
              payload: { code: "GATE-12", category: "GATE", description: "12 ft double swing gate", unit_monthly_rate_cents: 4500, replacement_cost_cents_per_unit: 95000, fleet_age_months: 6, owned_count: 40 }
              as: PlatformAdmin
            - call: "POST /fence-rentals/products"
              payload: { code: "BARR-8", category: "BARRICADE", description: "8 ft interlocking steel barricade", unit_monthly_rate_cents: 3250, replacement_cost_cents_per_unit: 42000, fleet_age_months: 30, owned_count: 60 }
              as: PlatformAdmin
            - call: "POST /fence-rentals/crews"
              payload: { crew_code: "CRW-A", depot_code: "DEP-1", daily_capacity_hours: 12.0 }
              as: DispatchCoordinator
              as_user_id: "dc-001"
              captures: { c1_id: "$.data.id"}
            - call: "POST /fence-rentals/crews"
              payload: { crew_code: "CRW-B", depot_code: "DEP-1", daily_capacity_hours: 12.0 }
              as: DispatchCoordinator
              as_user_id: "dc-001"
              captures: { c2_id: "$.data.id"}
            - call: "POST /fence-rentals/jobsites"
              payload: { customer_account_id: "${a1_id}", municipality_id: "${m1_id}", site_label: "Quay Street Festival Lot", address_line: "11 Quay Street", site_condition: "SOIL", phase_count: 4, requires_sidewalk_closure: false }
              as: AccountManager
              as_user_id: "am-001"
              captures: { j1_id: "$.data.id", j1_v: "$.data.version"}
            - call: "POST /fence-rentals/jobsites"
              payload: { customer_account_id: "${a1_id}", municipality_id: "${m1_id}", site_label: "Foundry Road Phase Yard", address_line: "402 Foundry Road", site_condition: "SOIL", phase_count: 4, requires_sidewalk_closure: false }
              as: AccountManager
              as_user_id: "am-001"
              captures: { j2_id: "$.data.id", j2_v: "$.data.version"}
            - call: "POST /fence-rentals/jobsites/${j1_id}/quotes"
