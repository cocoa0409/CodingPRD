        distinguishing_aspect: |
          Depth-3 cascade: grant-pto sets App -> PTO_GRANTED (hop 1); that mutation drives the
          App's Project -> OPERATIONAL (hop 2, caused by hop 1); the Project becoming OPERATIONAL
          mints a WarrantyPolicy with coverage_years=25 (hop 3, caused by hop 2). Each link is
          caused by the previous, not directly by the grant-pto call.
