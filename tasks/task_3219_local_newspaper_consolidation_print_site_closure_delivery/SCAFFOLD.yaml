    roles: [PrintOperationsDirector]
    code: 200
    input: [receiving_print_site_id, expected_hub_version]
    output: PrintMarket
    side_effects:
      - "select_transfer_route runs (§1.3); the chosen route becomes committed"
      - "status becomes consolidation_planned and route_selection_status becomes current"
      - "increments RegionHub.version by 1"
      - "print_site_transfer_cost_cents, print_site_transfer_credit_cents and net_print_site_transfer_cost_cents recomputed (§1.3 print_site_transfer_cost) for the market"

