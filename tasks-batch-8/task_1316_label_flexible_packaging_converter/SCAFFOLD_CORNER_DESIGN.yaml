  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: tier_boundary_5000_rate_switch
        claim_type: correct_result
        grounds: [calculations.job_quote_calc]
        distinguishing_aspect: "Tier boundary at 5000 is inclusive (5000 <= qty < 20000 → rate_b): qty 4999 quotes 173116 cents (rate_a base 22496) while qty 5000 quotes 169620 cents (rate_b base 19000) — the quote drops as quantity crosses into the cheaper tier."
        test_recipe:
          setup: ["Customer C; approved 2-color artwork (120000c plates); substrate 1000mm @40c; ink @300c; shelf die; press setup 300 / waste 5%"]
          setup_api_calls:
            - call: "POST /label-jobs/customers"
              payload: { account_name: "Tier5 Co" }
              as: Estimator
              captures: { c_id: $.data.id }
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions"
              payload: { artwork_code: "AW-T5", revision_no: 1, color_count: 2, plate_set_cost_cents: 120000 }
              as: PrepressOperator
              captures: { av_id: $.data.id }
            - call: "POST /label-jobs/substrates"
              payload: { substrate_code: "T5-1", width_mm: 1000, cost_per_msq_cents: 40 }
              as: Estimator
              captures: { sub_id: $.data.id }
            - call: "POST /label-jobs/ink-recipes"
              payload: { recipe_code: "INK-T5", cost_per_lb_cents: 300 }
              as: Estimator
              captures: { ink_id: $.data.id }
            - call: "POST /label-jobs/dies"
              payload: { die_code: "D-T5", shape_description: "rect", cavities_across: 4 }
              as: Estimator
              captures: { die_id: $.data.id }
            - call: "POST /label-jobs/presses"
              payload: { press_code: "P-T5", station_count: 4, setup_waste_ft: 300, run_waste_pct_numerator: 5 }
              as: Estimator
              captures: { press_id: $.data.id }
          trigger:
            - call: "POST /label-jobs/customers/${c_id}/jobs"
              payload: { artwork_version_id: "${av_id}", substrate_id: "${sub_id}", ink_recipe_id: "${ink_id}", die_id: "${die_id}", press_id: "${press_id}", quantity_ordered: 4999, repeat_length_mm: 76, rewind_max_rolls: 3, max_splices_per_roll: 1 }
              as: Estimator
              captures: { j4999: $.data.id }
            - call: "POST /label-jobs/customers/${c_id}/jobs"
              payload: { artwork_version_id: "${av_id}", substrate_id: "${sub_id}", ink_recipe_id: "${ink_id}", die_id: "${die_id}", press_id: "${press_id}", quantity_ordered: 5000, repeat_length_mm: 76, rewind_max_rolls: 3, max_splices_per_roll: 1 }
              as: Estimator
              captures: { j5000: $.data.id }
          assert:
            - "LabelJob.${j4999}.quoted_price_cents == 173116"
            - "LabelJob.${j5000}.quoted_price_cents == 169620"

      - name: tier_boundary_20000_rate_switch
        claim_type: correct_result
        grounds: [calculations.job_quote_calc]
        distinguishing_aspect: "Tier boundary at 20000 is inclusive (qty >= 20000 → rate_c): qty 19999 quotes 301299 cents while qty 20000 quotes 289302 cents."
        test_recipe:
          setup: ["Customer C; approved 2-color artwork (120000c plates); substrate 1000mm @40c; ink @300c; shelf die; press setup 300 / waste 5%"]
