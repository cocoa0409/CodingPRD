            - call: "POST /sports-med/rtp-protocols/${proto_id}/advances"
              payload: { expected_protocol_version: "${pv0}" }
              as: MedicalStaff
            - call: "GET /sports-med/rtp-protocols/${proto_id}"
              payload: {}
              as: MedicalStaff
              captures: { pv1: $.data.version }
            - call: "POST /sports-med/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-08T00:00:00Z" }
              as: TeamAdmin
            - call: "POST /sports-med/daily-status-entries"
              payload: { injury_case_id: "${case_id}", entry_date: "2026-08-08", designation: "MODIFIED", symptom_free: true, functional_test_score: 88 }
              as: MedicalStaff
              as_user_id: "med-1"
            - call: "POST /sports-med/rtp-protocols/${proto_id}/advances"
              payload: { expected_protocol_version: "${pv1}" }
              as: MedicalStaff
            - call: "GET /sports-med/rtp-protocols/${proto_id}"
              payload: {}
              as: MedicalStaff
              captures: { pv2: $.data.version }
            - call: "POST /sports-med/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: TeamAdmin
            - call: "POST /sports-med/daily-status-entries"
              payload: { injury_case_id: "${case_id}", entry_date: "2026-08-12", designation: "FULL", symptom_free: true, functional_test_score: 95 }
              as: MedicalStaff
              as_user_id: "med-1"
            - call: "POST /sports-med/rtp-protocols/${proto_id}/clearances"
              payload: { expected_protocol_version: "${pv2}" }
              as: MedicalStaff
              as_user_id: "med-1"
              captures: { clr_id: $.data.id }
            # advance clock 8 days beyond the 72h freshness window, no new entry
            - call: "POST /sports-med/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: TeamAdmin
          trigger:
            - call: "POST /sports-med/clearances/${clr_id}/decide"
              payload: { decision: "GRANTED" }
              as: TeamPhysician
              as_user_id: "phys-9"
              captures: { err: $.data.error_id }
          assert:
            - "trigger returns error_id ERR_STALE_EVALUATION (latest DailyStatusEntry from 2026-08-12 is > 72h before current_utc 2026-08-20)"
            - "ClearanceAuthorization.${clr_id}.status == PENDING (unchanged)"

  # =================================================================
  # Rule 8 — resource_temporal_overlap (2 instances, different interval semantics)
  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: daily_status_entry_supersede_same_date_single_current
        grounds:
          - entities.DailyStatusEntry.fields.is_current
          - entities.DailyStatusEntry.fields.supersedes_entry_id
          - validations[priority=13]
        distinguishing_aspect: |
          Interval semantics: point-in-day replacement — a new DailyStatusEntry
          for an occupied (case, entry_date) must supersede the incumbent via
          supersedes_entry_id; creating one for an occupied date WITHOUT
          supersedes_entry_id is rejected (ERR_INVALID_SUPERSEDE_TARGET /
          ERR_INVALID_REQUEST), and the superseded entry flips is_current to
          false. Date-occupancy semantics, distinct from the window-containment
          rule of the sibling instance.
        test_recipe:
          setup:
            - "Team; athlete; OPEN case; one is_current entry for 2026-08-03 (designation OUT)"
            - "Clock 2026-08-03"
          setup_api_calls:
            - call: "POST /sports-med/teams"
              payload: { name: "T", sport: "SOCCER", season_start_date: "2026-08-01", season_end_date: "2026-12-01" }
              as: TeamAdmin
              captures: { t_id: $.data.id }
            - call: "POST /sports-med/athletes"
              payload: { team_id: "${t_id}", full_name: "A", position: "M", enrollment_date: "2026-08-01" }
              as: TeamAdmin
              captures: { a_id: $.data.id }
            - call: "POST /sports-med/diagnosis-codes"
              payload: { code: "S83.5", body_region: "KNEE", severity_class: "MINOR", is_concussion: false }
              as: TeamAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /sports-med/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: TeamAdmin
            - call: "POST /sports-med/injury-cases"
              payload: { athlete_id: "${a_id}", diagnosis_code_id: "${dc_id}", occurred_on: "2026-08-02", surface: "GRASS", mechanism: "CONTACT" }
              as: MedicalStaff
              captures: { case_id: $.data.id }
            - call: "POST /sports-med/daily-status-entries"
              payload: { injury_case_id: "${case_id}", entry_date: "2026-08-03", designation: "OUT", symptom_free: false, functional_test_score: 40 }
              as: MedicalStaff
              captures: { entry1: $.data.id }
          trigger:
            - call: "POST /sports-med/daily-status-entries"
              payload: { injury_case_id: "${case_id}", entry_date: "2026-08-03", designation: "LIMITED", symptom_free: true, functional_test_score: 70, supersedes_entry_id: "${entry1}" }
              as: MedicalStaff
              captures: { entry2: $.data.id, e2_current: $.data.is_current }
            - call: "GET /sports-med/daily-status-entries/${entry1}"
              payload: {}
              as: MedicalStaff
              captures: { e1_current: $.data.is_current }
          assert:
            - "DailyStatusEntry.${entry2}.is_current == true"
            - "DailyStatusEntry.${entry1}.is_current == false (superseded incumbent flips)"
            - "exactly one is_current entry exists for (${case_id}, 2026-08-03)"

      - name: claim_service_date_policy_year_window_containment
        grounds:
          - validations[priority=12]
          - errors.ERR_SERVICE_DATE_OUT_OF_POLICY_YEAR
          - entities.InsurancePolicy.fields.policy_year_start
        distinguishing_aspect: |
          Interval semantics: closed-window containment — every
          line_items[].service_date must lie INSIDE the inclusive
          [policy_year_start, policy_year_end] window; a line dated the day
          after policy_year_end is rejected, while a line dated exactly on
          policy_year_end passes (inclusive boundary) — window-containment
          semantics on Claim x InsurancePolicy, distinct from date-occupancy.
        test_recipe:
          setup:
            - "Team; athlete; OPEN case; ACTIVE policy with policy_year 2026-01-01..2026-12-31"
            - "Claim A: line service_date 2027-01-01 (outside) -> rejected; Claim B: line service_date 2026-12-31 (boundary, inclusive) -> accepted"
            - "Clock 2026-08-01"
          setup_api_calls:
            - call: "POST /sports-med/teams"
              payload: { name: "T", sport: "HOCKEY", season_start_date: "2026-08-01", season_end_date: "2027-04-01" }
              as: TeamAdmin
              captures: { t_id: $.data.id }
            - call: "POST /sports-med/athletes"
              payload: { team_id: "${t_id}", full_name: "A", position: "D", enrollment_date: "2026-08-01" }
              as: TeamAdmin
              captures: { a_id: $.data.id }
            - call: "POST /sports-med/diagnosis-codes"
              payload: { code: "M70.0", body_region: "HIP", severity_class: "MINOR", is_concussion: false }
              as: TeamAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /sports-med/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TeamAdmin
            - call: "POST /sports-med/injury-cases"
              payload: { athlete_id: "${a_id}", diagnosis_code_id: "${dc_id}", occurred_on: "2026-08-01", surface: "ICE", mechanism: "CONTACT" }
              as: MedicalStaff
              captures: { case_id: $.data.id }
            - call: "POST /sports-med/insurance-policies"
              payload: { athlete_id: "${a_id}", payer_name: "Payer", policy_number: "PN-W", deductible_cents: 0, coinsurance_pct: 80, oop_max_cents: 500000, policy_year_start: "2026-01-01", policy_year_end: "2026-12-31" }
              as: BillingStaff
              captures: { pol_id: $.data.id, pol_v0: $.data.version }
            - call: "POST /sports-med/claims"
              payload: { injury_case_id: "${case_id}", insurance_policy_id: "${pol_id}", billed_amount_cents: 10000, line_items: [ { cpt_code: "A", charge_cents: 10000, service_date: "2027-01-01" } ] }
              as: BillingStaff
              captures: { claim_out: $.data.id }
            - call: "POST /sports-med/claims"
              payload: { injury_case_id: "${case_id}", insurance_policy_id: "${pol_id}", billed_amount_cents: 10000, line_items: [ { cpt_code: "B", charge_cents: 10000, service_date: "2026-12-31" } ] }
              as: BillingStaff
              captures: { claim_edge: $.data.id }
            - call: "GET /sports-med/insurance-policies/${pol_id}"
              payload: {}
              as: BillingStaff
              captures: { pol_v1: $.data.version }
          trigger:
            - call: "POST /sports-med/claims/${claim_out}/submit"
              payload: { expected_policy_version: "${pol_v1}" }
              as: BillingStaff
              captures: { err_out: $.data.error_id }
            - call: "GET /sports-med/insurance-policies/${pol_id}"
              payload: {}
              as: BillingStaff
              captures: { pol_v2: $.data.version }
            - call: "POST /sports-med/claims/${claim_edge}/submit"
              payload: { expected_policy_version: "${pol_v2}" }
              as: BillingStaff
              captures: { edge_status: $.data.status }
          assert:
            - "submit of claim_out returns ERR_SERVICE_DATE_OUT_OF_POLICY_YEAR (2027-01-01 outside window)"
            - "submit of claim_edge succeeds (service_date == policy_year_end 2026-12-31 is inclusive) -> status SUBMITTED"

  # =================================================================
  # Rule 9 — compensating_invariant (2 instances, different conserved quantities)
  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: claim_money_conservation_across_adjudication
        grounds:
          - calculations.claim_adjudication
          - entities.Claim.fields.payer_paid_cents
          - entities.Claim.fields.patient_resp_cents
        distinguishing_aspect: |
          Conserved quantity: billed money. For every non-denied adjudication,
          payer_paid_cents + patient_resp_cents == billed_amount_cents exactly,
          and the policy accumulator deltas equal the claim-level fields
          (deductible_met += deductible_applied, oop_accrued += patient_resp) —
          no drift even at OOP-cap truncation.
        test_recipe:
          setup:
            - "Team; athlete; OPEN case; policy ded 50000 met 0, coins 80, oop_max 200000 accrued 0"
            - "Claim billed 120000 submitted"
            - "Clock 2026-08-01"
          setup_api_calls:
            - call: "POST /sports-med/teams"
              payload: { name: "T", sport: "SOCCER", season_start_date: "2026-08-01", season_end_date: "2026-12-01" }
              as: TeamAdmin
              captures: { t_id: $.data.id }
            - call: "POST /sports-med/athletes"
              payload: { team_id: "${t_id}", full_name: "A", position: "F", enrollment_date: "2026-08-01" }
              as: TeamAdmin
              captures: { a_id: $.data.id }
            - call: "POST /sports-med/diagnosis-codes"
              payload: { code: "S83.511A", body_region: "KNEE", severity_class: "MODERATE", is_concussion: false }
              as: TeamAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /sports-med/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TeamAdmin
            - call: "POST /sports-med/injury-cases"
              payload: { athlete_id: "${a_id}", diagnosis_code_id: "${dc_id}", occurred_on: "2026-08-01", surface: "GRASS", mechanism: "CONTACT" }
              as: MedicalStaff
              captures: { case_id: $.data.id }
            - call: "POST /sports-med/insurance-policies"
              payload: { athlete_id: "${a_id}", payer_name: "Payer", policy_number: "PN-M", deductible_cents: 50000, coinsurance_pct: 80, oop_max_cents: 200000, policy_year_start: "2026-01-01", policy_year_end: "2026-12-31" }
              as: BillingStaff
              captures: { pol_id: $.data.id, pol_v0: $.data.version }
            - call: "POST /sports-med/claims"
              payload: { injury_case_id: "${case_id}", insurance_policy_id: "${pol_id}", billed_amount_cents: 120000, line_items: [ { cpt_code: "X1", charge_cents: 120000, service_date: "2026-08-02" } ] }
              as: BillingStaff
              captures: { claim_id: $.data.id }
            - call: "POST /sports-med/claims/${claim_id}/submit"
              payload: { expected_policy_version: "${pol_v0}" }
              as: BillingStaff
          trigger:
            - call: "POST /sports-med/claims/${claim_id}/adjudicate"
              payload: {}
              as: BillingStaff
              captures: { payer: $.data.payer_paid_cents, patient: $.data.patient_resp_cents, ded: $.data.deductible_applied_cents }
            - call: "GET /sports-med/insurance-policies/${pol_id}"
              payload: {}
              as: BillingStaff
              captures: { pol_ded_met: $.data.deductible_met_cents, pol_oop: $.data.oop_accrued_cents }
          assert:
            - "Claim.${claim_id}.payer_paid_cents + patient_resp_cents == 120000 (money conserved: 56000 + 64000)"
            - "Claim.${claim_id}.payer_paid_cents == 56000 and patient_resp_cents == 64000 and deductible_applied_cents == 50000"
            - "InsurancePolicy.${pol_id}.deductible_met_cents == 50000 (== deductible_applied)"
            - "InsurancePolicy.${pol_id}.oop_accrued_cents == 64000 (== patient_resp)"

      - name: daily_status_supersede_current_count_invariant
        grounds:
          - entities.DailyStatusEntry.fields.is_current
          - calculations.availability_tier_derivation
        distinguishing_aspect: |
          Conserved quantity: cardinality of the is_current set. A create +
          supersede pair must leave exactly ONE is_current DailyStatusEntry per
          (injury_case_id, entry_date) — the forward action (create) paired
          with the compensating flip (incumbent is_current -> false) conserves
          the singleton invariant, a different quantity than billed money.
        test_recipe:
          setup:
            - "Team; athlete; OPEN case; one entry E1 for 2026-08-03 (is_current true)"
            - "Two successive corrections E2 (supersedes E1) and E3 (supersedes E2) for the same date"
            - "Clock 2026-08-03"
          setup_api_calls:
            - call: "POST /sports-med/teams"
              payload: { name: "T", sport: "BASKETBALL", season_start_date: "2026-08-01", season_end_date: "2027-04-01" }
              as: TeamAdmin
              captures: { t_id: $.data.id }
            - call: "POST /sports-med/athletes"
              payload: { team_id: "${t_id}", full_name: "A", position: "G", enrollment_date: "2026-08-01" }
              as: TeamAdmin
              captures: { a_id: $.data.id }
            - call: "POST /sports-med/diagnosis-codes"
              payload: { code: "S93.4", body_region: "ANKLE_FOOT", severity_class: "MINOR", is_concussion: false }
              as: TeamAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /sports-med/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: TeamAdmin
            - call: "POST /sports-med/injury-cases"
              payload: { athlete_id: "${a_id}", diagnosis_code_id: "${dc_id}", occurred_on: "2026-08-02", surface: "COURT", mechanism: "NON_CONTACT" }
              as: MedicalStaff
              captures: { case_id: $.data.id }
            - call: "POST /sports-med/daily-status-entries"
              payload: { injury_case_id: "${case_id}", entry_date: "2026-08-03", designation: "OUT", symptom_free: false, functional_test_score: 40 }
              as: MedicalStaff
              captures: { e1: $.data.id }
            - call: "POST /sports-med/daily-status-entries"
              payload: { injury_case_id: "${case_id}", entry_date: "2026-08-03", designation: "LIMITED", symptom_free: true, functional_test_score: 60, supersedes_entry_id: "${e1}" }
              as: MedicalStaff
              captures: { e2: $.data.id }
          trigger:
            - call: "POST /sports-med/daily-status-entries"
              payload: { injury_case_id: "${case_id}", entry_date: "2026-08-03", designation: "MODIFIED", symptom_free: true, functional_test_score: 75, supersedes_entry_id: "${e2}" }
              as: MedicalStaff
              captures: { e3: $.data.id }
            - call: "GET /sports-med/daily-status-entries?injury_case_id=${case_id}&entry_date=2026-08-03&is_current=true"
              payload: {}
              as: MedicalStaff
              captures: { current_list: $.data }
          assert:
            - "DailyStatusEntry.${e3}.is_current == true"
            - "DailyStatusEntry.${e1}.is_current == false and DailyStatusEntry.${e2}.is_current == false"
            - "count of is_current entries for (${case_id}, 2026-08-03) == 1 (singleton invariant conserved across two create+supersede pairs)"
