              as: PlantAdmin
              captures: { fu1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /fumigations/${fu1}/start"
              payload: {}
              as: PlantAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-12T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /fumigations/${fu1}/begin-aeration"
              payload: {}
              as: PlantAdmin
          trigger:
            - call: "POST /shipments/${sh1}/confirm"
              payload: {}
              as: PlantOperator
              captures: { err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /shipments/${sh1}/confirm"
              payload: {}
              as: PlantOperator
          assert:
            - "first confirm (bin AERATING, shipment BLOCKED): error_id == ERR_INVALID_STATE, HTTP 409"
            - "clock past cleared_at (2026-05-14T00:00:00Z): bin lazy-clears to AVAILABLE, placements back to STORED, Shipment.${sh1} back to PLANNED"
            - "second confirm succeeds: Shipment.${sh1}.status == DELIVERED"
            - "BuyerContract.${c1}.delivered_qty_lbs == 1000 and status == FULFILLED (delivered == required)"
            - "StoragePlacement.${pl1}.remaining_lbs == 500"

  - rule_id: resource_temporal_overlap
    instances:
      - name: dryer_half_open_adjacency
        grounds:
          - calculations.dryer_reservation_overlap
          - errors[ERR_DRYER_TIME_CONFLICT]
        distinguishing_aspect: |
          Half-open interval semantics on the Dryer resource: [start_at,
          end_at) — a batch starting exactly when another ends is legal, while
          any strict interior overlap conflicts. Lot-level detail: each batch
          references a distinct lot with a recorded MOISTURE_KERNEL test.
        test_recipe:
          setup:
            - "Grower G1; three lots each with MOISTURE_KERNEL recorded; dryer D-1"
            - "Batch 1 on D-1: [2026-05-02T00:00:00Z, 2026-05-04T00:00:00Z)"
          setup_api_calls:
            - call: "POST /growers"
              payload: { name: "Riverbend Orchards", ranch_code: "RB-01", base_price_cents_per_lb: 250 }
              as: PlantAdmin
              captures: { g1: $.data.id }
            - call: "POST /lots"
              payload: { grower_id: "${g1}", variety: "Nonpareil", gross_weight_lbs: 2000 }
              as: IntakeOperator
              captures: { lotA: $.data.id }
            - call: "POST /lab-tests"
              payload: { lot_id: "${lotA}", test_type: "MOISTURE_KERNEL", moisture_pct: 10.0, kernel_pct: 0.50, foreign_material_pct: 0.01 }
              as: LabTechnician
            - call: "POST /lots"
              payload: { grower_id: "${g1}", variety: "Butte", gross_weight_lbs: 2000 }
              as: IntakeOperator
              captures: { lotB: $.data.id }
            - call: "POST /lab-tests"
              payload: { lot_id: "${lotB}", test_type: "MOISTURE_KERNEL", moisture_pct: 10.0, kernel_pct: 0.50, foreign_material_pct: 0.01 }
              as: LabTechnician
            - call: "POST /lots"
              payload: { grower_id: "${g1}", variety: "Carmel", gross_weight_lbs: 2000 }
              as: IntakeOperator
              captures: { lotC: $.data.id }
            - call: "POST /lab-tests"
              payload: { lot_id: "${lotC}", test_type: "MOISTURE_KERNEL", moisture_pct: 10.0, kernel_pct: 0.50, foreign_material_pct: 0.01 }
              as: LabTechnician
            - call: "POST /dryers"
              payload: { dryer_code: "D-1", capacity_lbs: 60000 }
              as: PlantAdmin
              captures: { dryer1: $.data.id }
            - call: "POST /drying-batches"
              payload: { dryer_id: "${dryer1}", lot_id: "${lotA}", start_at: "2026-05-02T00:00:00Z", end_at: "2026-05-04T00:00:00Z" }
              as: PlantOperator
          trigger:
            - call: "POST /drying-batches"
              payload: { dryer_id: "${dryer1}", lot_id: "${lotB}", start_at: "2026-05-04T00:00:00Z", end_at: "2026-05-06T00:00:00Z" }
              as: PlantOperator
              captures: { batchB: $.data.id }
            - call: "POST /drying-batches"
              payload: { dryer_id: "${dryer1}", lot_id: "${lotC}", start_at: "2026-05-03T00:00:00Z", end_at: "2026-05-05T00:00:00Z" }
              as: PlantOperator
              captures: { err: $.data.error_id }
          assert:
            - "adjacent batch [05-04, 05-06) succeeds (half-open: start == prior end is no conflict)"
            - "overlapping batch [05-03, 05-05) fails: error_id == ERR_DRYER_TIME_CONFLICT, HTTP 409"
            - "DryingBatch.${batchB}.status == SCHEDULED"

      - name: fumigation_closed_interval_with_aeration_buffer
        grounds:
          - calculations.fumigation_schedule_overlap
          - errors[ERR_FUMIGATION_TIME_CONFLICT]
        distinguishing_aspect: |
          Closed interval WITH aeration buffer on the StorageBin resource —
          different semantics from the dryer's half-open rule: a new event
          starting exactly at the previous event's effective_end (cleared_at)
          CONFLICTS (inclusive boundary), and the blocked span extends
          aeration_hours past begin-aeration rather than ending at the event's
          own end.
        test_recipe:
          setup:
            - "Bin B-3 (cap 4000, KERNEL); fumigation F1: start_at 2026-05-10, aeration 48h; started at 05-10; begin-aeration at 05-12 -> cleared_at 2026-05-14T00:00:00Z"
          setup_api_calls:
            - call: "POST /bins"
              payload: { bin_code: "B-3", capacity_lbs: 4000, allowed_product_forms: ["KERNEL"] }
              as: PlantAdmin
              captures: { bin3: $.data.id }
            - call: "POST /fumigations"
              payload: { bin_id: "${bin3}", start_at: "2026-05-10T00:00:00Z", aeration_hours: 48 }
              as: PlantAdmin
              captures: { fu1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /fumigations/${fu1}/start"
              payload: {}
              as: PlantAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-12T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /fumigations/${fu1}/begin-aeration"
              payload: {}
              as: PlantAdmin
          trigger:
            - call: "POST /fumigations"
              payload: { bin_id: "${bin3}", start_at: "2026-05-14T00:00:00Z", aeration_hours: 24 }
              as: PlantAdmin
              captures: { err: $.data.error_id }
            - call: "POST /fumigations"
              payload: { bin_id: "${bin3}", start_at: "2026-05-15T00:00:00Z", aeration_hours: 24 }
              as: PlantAdmin
              captures: { fu2: $.data.id }
          assert:
            - "FumigationEvent.${fu1}.cleared_at == 2026-05-14T00:00:00Z (= 05-12 + 48h)"
            - "new event with start_at == cleared_at (2026-05-14T00:00:00Z) CONFLICTS under closed-interval semantics: error_id == ERR_FUMIGATION_TIME_CONFLICT, HTTP 409"
            - "new event with start_at 2026-05-15T00:00:00Z succeeds: FumigationEvent.${fu2}.status == SCHEDULED"

  - rule_id: compensating_invariant
    instances:
      - name: bin_occupancy_place_withdraw_roundtrip
        grounds:
          - entities.StorageBin.fields.occupied_lbs
          - calculations.fifo_withdrawal_allocation
          - state_machines.StoragePlacement.STORED_to_WITHDRAWN
        distinguishing_aspect: |
          Conserved quantity: bin weight (occupied_lbs). Placing 2000 lbs then
          withdrawing exactly 2000 lbs returns occupied_lbs to its pre-placement
          value 0 — forward action plus its compensating withdrawal leaves the
          named quantity unchanged (occupied_lbs == sum of STORED remaining).
        test_recipe:
          setup:
            - "Processed KERNEL lot (kernel_out 2400); bin B1 cap 5000 allowing KERNEL, empty (occupied 0)"
          setup_api_calls:
            - call: "POST /growers"
              payload: { name: "Riverbend Orchards", ranch_code: "RB-01", base_price_cents_per_lb: 250 }
              as: PlantAdmin
              captures: { g1: $.data.id }
            - call: "POST /lots"
              payload: { grower_id: "${g1}", variety: "Nonpareil", gross_weight_lbs: 5000 }
              as: IntakeOperator
              captures: { lot1: $.data.id }
            - call: "POST /lab-tests"
              payload: { lot_id: "${lot1}", test_type: "MOISTURE_KERNEL", moisture_pct: 6.0, kernel_pct: 0.50, foreign_material_pct: 0.01 }
              as: LabTechnician
            - call: "POST /lab-tests"
              payload: { lot_id: "${lot1}", test_type: "AFLATOXIN", aflatoxin_ppb: 2.0 }
              as: LabTechnician
            - call: "POST /lots/${lot1}/route"
              payload: { route: "KERNEL" }
              as: IntakeOperator
            - call: "GET /lots/${lot1}"
              as: PlantOperator
              captures: { lot1_v: $.data.version }
            - call: "POST /processing-runs"
              payload: { lot_id: "${lot1}", expected_lot_version: "${lot1_v}" }
              as: PlantOperator
              captures: { run1: $.data.id }
            - call: "POST /processing-runs/${run1}/start"
              payload: {}
              as: PlantOperator
            - call: "POST /processing-runs/${run1}/complete"
              payload: { kernel_out_lbs: 2400, shell_out_lbs: 1300, hull_out_lbs: 900 }
              as: PlantOperator
            - call: "POST /lab-tests"
              payload: { lot_id: "${lot1}", test_type: "KERNEL_GRADE", edible_kernel_pct: 0.80, size_spec: "SPEC_23_25" }
              as: LabTechnician
            - call: "POST /bins"
              payload: { bin_code: "B-1", capacity_lbs: 5000, allowed_product_forms: ["KERNEL"] }
              as: PlantAdmin
              captures: { bin1: $.data.id }
          trigger:
            - call: "POST /placements"
              payload: { bin_id: "${bin1}", lot_id: "${lot1}", product_form: "KERNEL", quantity_lbs: 2000 }
              as: PlantOperator
              captures: { pl1: $.data.id }
            - call: "POST /withdrawals"
              payload: { bin_id: "${bin1}", product_form: "KERNEL", quantity_lbs: 2000 }
              as: PlantOperator
              captures: { wd1: $.data.id }
          assert:
            - "after placement: StorageBin.${bin1}.occupied_lbs == 2000"
            - "after withdrawal: StorageBin.${bin1}.occupied_lbs == 0 (invariant: occupied returns to the pre-placement value)"
            - "StoragePlacement.${pl1}.status == WITHDRAWN and remaining_lbs == 0"
            - "Withdrawal.${wd1}.allocations == [{placement_id: ${pl1}, quantity_lbs: 2000}]"

      - name: grower_payable_approve_void_roundtrip
        grounds:
          - entities.Grower.fields.payable_outstanding_cents
          - state_machines.Settlement.DRAFT_to_ISSUED
          - state_machines.Settlement.ISSUED_to_DRAFT
        distinguishing_aspect: |
          Conserved quantity: grower money (payable_outstanding_cents) — a
          different conserved quantity from bin weight. Approve (+854299)
          paired with its compensating void (-854299) leaves the grower's
          payable exactly at its pre-approve value of 0.
        test_recipe:
          setup:
            - "Processed lot (graded 3240.00) with Settlement DRAFT total_cents 854299; grower payable 0"
          setup_api_calls:
            - call: "POST /growers"
              payload: { name: "Delta Farms", ranch_code: "DF-02", base_price_cents_per_lb: 247, premium_rate_pct: 0.075 }
              as: PlantAdmin
              captures: { g2: $.data.id }
            - call: "POST /lots"
              payload: { grower_id: "${g2}", variety: "Butte", gross_weight_lbs: 8000 }
              as: IntakeOperator
              captures: { lot2: $.data.id }
            - call: "POST /lab-tests"
              payload: { lot_id: "${lot2}", test_type: "MOISTURE_KERNEL", moisture_pct: 11.5, kernel_pct: 0.60, foreign_material_pct: 0.03 }
              as: LabTechnician
            - call: "POST /lab-tests"
              payload: { lot_id: "${lot2}", test_type: "AFLATOXIN", aflatoxin_ppb: 3.0 }
              as: LabTechnician
            - call: "POST /dryers"
              payload: { dryer_code: "D-1", capacity_lbs: 60000 }
              as: PlantAdmin
              captures: { dryer1: $.data.id }
            - call: "POST /drying-batches"
              payload: { dryer_id: "${dryer1}", lot_id: "${lot2}", start_at: "2026-05-02T00:00:00Z", end_at: "2026-05-03T00:00:00Z" }
              as: PlantOperator
              captures: { batch1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /drying-batches/${batch1}/start"
              payload: {}
              as: PlantOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-03T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /drying-batches/${batch1}/complete"
              payload: { final_moisture_pct: 9.5 }
              as: PlantOperator
            - call: "POST /lots/${lot2}/route"
              payload: { route: "KERNEL" }
              as: IntakeOperator
            - call: "GET /lots/${lot2}"
              as: PlantOperator
              captures: { lot2_v: $.data.version }
            - call: "POST /processing-runs"
              payload: { lot_id: "${lot2}", expected_lot_version: "${lot2_v}" }
              as: PlantOperator
              captures: { run2: $.data.id }
            - call: "POST /processing-runs/${run2}/start"
              payload: {}
              as: PlantOperator
            - call: "POST /processing-runs/${run2}/complete"
              payload: { kernel_out_lbs: 4500, shell_out_lbs: 1800, hull_out_lbs: 1200 }
              as: PlantOperator
            - call: "POST /lab-tests"
              payload: { lot_id: "${lot2}", test_type: "KERNEL_GRADE", edible_kernel_pct: 0.72, size_spec: "SPEC_25_27" }
              as: LabTechnician
            - call: "POST /settlements"
              payload: { lot_id: "${lot2}" }
              as: PlantAdmin
              captures: { st2: $.data.id }
          trigger:
            - call: "POST /settlements/${st2}/approve"
              payload: {}
              as: PlantAdmin
            - call: "POST /settlements/${st2}/void"
              payload: {}
              as: PlantAdmin
            - call: "GET /growers/${g2}"
              as: PlantAdmin
          assert:
            - "after approve: Grower.${g2}.payable_outstanding_cents == 854299"
            - "after void: Grower.${g2}.payable_outstanding_cents == 0 (invariant: payable unchanged by approve+void)"
            - "Settlement.${st2}.status == DRAFT"
            - "Grower.${g2}.lifetime_paid_cents == 0 (pay never ran)"
