# =============================================================================
# §1.9 Scaffold Corner Design — athletics-priority-points
#
# Breadth probe over the claims §1.1-§1.7 of SCAFFOLD.yaml declare that the
# nine Difficulty Rules in SCAFFOLD_DIFFICULTY_DESIGN.yaml do not already
# cover. `section:` values and `claim_type:` values are taken verbatim from
# references/claim-extraction-guide.md; no categories are invented.
#
# Fixture identities reused from §1.8: officer-1 (DevelopmentOfficer),
# admin-1 (PlatformAdmin), certifier-1 (PointsCertifier),
# analyst-1 (DisputeAnalyst), policy-1 (PolicyCommittee). Donor-role calls
# always carry the donor's own id in as_user_id.
#
# Every instant is ISO 8601 UTC with three fractional digits. The logical
# clock starts at 2026-08-01T00:00:00.000Z, so instances that depend on the
# calendar year set it explicitly.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: donor_create_returns_201_with_defaults_and_echoed_input
        claim_type: creation
        grounds:
          - endpoints.POST_/athletics/donors
          - entities.Donor
        distinguishing_aspect: |
          A create with only the four required fields must come back 201 with
          every computed counter seeded rather than absent: donor_status
          ACTIVE, all six point columns 0.00, cumulative_giving_cents 0,
          rank_position null and season_ticket_first_cycle_year null because
          the optional input was omitted.
        test_recipe:
          setup:
            - "Empty database; the logical clock sits at its mandatory startup default 2026-08-01T00:00:00.000Z."
          setup_api_calls: []
          trigger:
            - call: "POST /athletics/donors"
              payload: { full_name: "Avery Alum", email: "avery.alum@example.com", alumni_status: "ALUMNUS", entity_type: "INDIVIDUAL" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { av_id: "$.data.id" }
          assert:
            - "the response status is 201 and meta carries api_request_id and api_request_timestamp"
            - "response_type == object"
            - "Donor.${av_id}.full_name == Avery Alum"
            - "Donor.${av_id}.email == avery.alum@example.com"
            - "Donor.${av_id}.alumni_status == ALUMNUS"
            - "Donor.${av_id}.entity_type == INDIVIDUAL"
            - "Donor.${av_id}.donor_status == ACTIVE"
            - "Donor.${av_id}.season_ticket_first_cycle_year is null"
            - "Donor.${av_id}.season_ticket_seasons_purchased == 0"
            - "Donor.${av_id}.cumulative_giving_cents == 0"
            - "Donor.${av_id}.consecutive_giving_years == 0"
            - "Donor.${av_id}.provisional_points == 0.00"
            - "Donor.${av_id}.certified_base_points == 0.00"
            - "Donor.${av_id}.certified_points == 0.00"
            - "Donor.${av_id}.transferred_points_in == 0.00"
            - "Donor.${av_id}.transferred_points_out == 0.00"
            - "Donor.${av_id}.dispute_adjustment_points == 0.00"
            - "Donor.${av_id}.rank_position is null"
            - "Donor.${av_id}.pending_request_count == 0"
            - "Donor.${av_id}.version == 1"

      - name: donor_get_by_id_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - endpoints.GET_/athletics/donors/{id}
        distinguishing_aspect: |
          The single-resource read returns the same field values the create
          returned, with response_type object rather than array, and is
          readable by a role that cannot write donors.
        test_recipe:
          setup:
            - "One Donor exists, created by officer-1."
          setup_api_calls:
            - call: "POST /athletics/donors"
              payload: { full_name: "Rory Reader", email: "rory.reader@example.com", alumni_status: "FACULTY_STAFF", entity_type: "INDIVIDUAL" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { rory_id: "$.data.id" }
          trigger:
            - call: "GET /athletics/donors/${rory_id}"
              payload: {}
              as: PointsCertifier
              as_user_id: "certifier-1"
          assert:
            - "the response status is 200 and response_type == object"
            - "the returned id equals ${rory_id}"
            - "Donor.${rory_id}.email == rory.reader@example.com"
            - "Donor.${rory_id}.alumni_status == FACULTY_STAFF"
            - "Donor.${rory_id}.version == 1"
            - "created_at and updated_at are both 2026-08-01T00:00:00.000Z"

      - name: donors_list_reports_total_count_and_has_more_across_pages
        claim_type: listing
        grounds:
          - endpoints.GET_/athletics/donors
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          total_count counts the whole matching set, not the page: with three
          donors and limit 2 the first page returns 2 rows with total_count 3
          and has_more true, and offset 2 returns the remaining single row
          with has_more false.
        test_recipe:
          setup:
            - "Exactly three Donor rows exist, created in the order Page One, Page Two, Page Three."
          setup_api_calls:
            - call: "POST /athletics/donors"
              payload: { full_name: "Page One", email: "page.one@example.com", alumni_status: "NON_ALUMNUS", entity_type: "INDIVIDUAL" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/donors"
              payload: { full_name: "Page Two", email: "page.two@example.com", alumni_status: "NON_ALUMNUS", entity_type: "INDIVIDUAL" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/donors"
              payload: { full_name: "Page Three", email: "page.three@example.com", alumni_status: "NON_ALUMNUS", entity_type: "INDIVIDUAL" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "GET /athletics/donors?limit=2&offset=0"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "GET /athletics/donors?limit=2&offset=2"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
          assert:
            - "the first page returns response_type == array with exactly 2 rows"
            - "the first page reports limit 2, offset 0, total_count 3 and has_more true"
            - "the second page returns exactly 1 row"
            - "the second page reports limit 2, offset 2, total_count 3 and has_more false"

      - name: donor_get_with_unknown_id_returns_donor_not_found
        claim_type: not_found
        grounds:
          - errors.ERR_DONOR_NOT_FOUND
          - validations.priority_5
        distinguishing_aspect: |
          An unresolvable path id yields the entity-specific 404 code
          ERR_DONOR_NOT_FOUND, not a generic 404 and not an empty 200 body.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /athletics/donors/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 404"
            - "response_type == error"
            - "${err} == ERR_DONOR_NOT_FOUND"

      - name: donor_create_without_alumni_status_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints.POST_/athletics/donors
          - validations.priority_6
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          alumni_status carries no default, so omitting it is a 400 rather
          than a silently defaulted NON_ALUMNUS row; the database must be
          left empty afterwards.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /athletics/donors"
              payload: { full_name: "Missing Field", email: "missing.field@example.com", entity_type: "INDIVIDUAL" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { err: "$.data.error_id" }
            - call: "GET /athletics/donors"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
          assert:
            - "the create returns HTTP 400"
            - "${err} == ERR_INVALID_REQUEST"
            - "the subsequent list reports total_count 0"

      - name: gift_create_without_gift_status_defaults_to_pledged
        claim_type: defaults
        grounds:
          - entities.Gift.fields.gift_status
          - endpoints.POST_/athletics/donors/{id}/gifts
        distinguishing_aspect: |
          gift_status is the only optional input on gift creation and its
          declared default is PLEDGED, so an omitted value must not settle the
          gift: settled_at stays null and the donor's cumulative_giving_cents
          stays 0 because only the PLEDGED to RECEIVED transition adds to it.
        test_recipe:
          setup:
            - "One Donor exists; the logical clock sits at 2026-08-01T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /athletics/donors"
              payload: { full_name: "Devon Default", email: "devon.default@example.com", alumni_status: "NON_ALUMNUS", entity_type: "INDIVIDUAL" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { dd_id: "$.data.id" }
          trigger:
            - call: "POST /athletics/donors/${dd_id}/gifts"
              payload: { gift_date: "2026-03-01T00:00:00.000Z", amount_cents: 1000000, designation: "ATHLETICS_ANNUAL" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { g_id: "$.data.id" }
          assert:
            - "the response status is 201"
            - "Gift.${g_id}.gift_status == PLEDGED"
            - "Gift.${g_id}.settled_at is null"
            - "Gift.${g_id}.donor_id == ${dd_id}"
            - "Donor.${dd_id}.cumulative_giving_cents == 0"

      - name: seat_create_without_max_concurrent_holds_defaults_to_one
        claim_type: defaults
        grounds:
          - entities.Seat.fields.max_concurrent_holds
          - endpoints.POST_/athletics/sections/{id}/seats
        distinguishing_aspect: |
          The seat-level hold ceiling defaults to 1, which is what makes the
          ordinary single-hold seat behaviour the default rather than an
          unbounded hold count.
        test_recipe:
          setup:
            - "Section SEC-DF exists with seat_capacity 2."
          setup_api_calls:
            - call: "POST /athletics/sections"
              payload: { section_code: "SEC-DF", venue_code: "STADIUM", seat_capacity: 2, per_seat_requirement_cents: 100000, required_points_per_seat: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { sec_df_id: "$.data.id" }
          trigger:
            - call: "POST /athletics/sections/${sec_df_id}/seats"
              payload: { row_label: "DF", seat_number: 1 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { seat_df_id: "$.data.id" }
          assert:
            - "the response status is 201"
            - "Seat.${seat_df_id}.max_concurrent_holds == 1"
            - "Seat.${seat_df_id}.seat_status == AVAILABLE"
            - "Seat.${seat_df_id}.section_id == ${sec_df_id}"
            - "Section.${sec_df_id}.seat_row_count == 1"
            - "Section.${sec_df_id}.seats_available == 1"

      - name: gift_create_derives_cycle_year_from_gift_date
        claim_type: computed_fields
        grounds:
          - entities.Gift.fields.cycle_year
        distinguishing_aspect: |
          cycle_year is derived from gift_date's UTC calendar year, not from
          the logical clock's year and not from any client input: a gift dated
          2025-11-15 recorded while the clock reads 2026 must land in cycle
          2025, which is what lets the streak walk find a gap.
        test_recipe:
          setup:
            - "One Donor exists; the logical clock sits at 2026-08-01T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /athletics/donors"
              payload: { full_name: "Cyra Cycle", email: "cyra.cycle@example.com", alumni_status: "NON_ALUMNUS", entity_type: "INDIVIDUAL" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { cy_id: "$.data.id" }
          trigger:
            - call: "POST /athletics/donors/${cy_id}/gifts"
              payload: { gift_date: "2025-11-15T00:00:00.000Z", amount_cents: 750000, designation: "CAPITAL", gift_status: "RECEIVED" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { g25_id: "$.data.id" }
            - call: "GET /athletics/donors/${cy_id}/gifts?cycle_year=2025"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
          assert:
            - "Gift.${g25_id}.cycle_year == 2025"
            - "the cycle_year=2025 filter returns exactly 1 row whose id is ${g25_id}"
            - "Donor.${cy_id}.cumulative_giving_cents == 750000"

      - name: donor_create_stamps_system_id_timestamps_and_version_one
        claim_type: system_fields
        grounds:
          - entities.Donor
          - endpoints.POST_/_clock/set_current_utc
        distinguishing_aspect: |
          id, created_at, updated_at and version are server-stamped from the
          logical clock rather than wall time: with the clock parked at
          2026-05-04T09:30:00.000Z both timestamps must equal that instant
          exactly, to millisecond precision, and version starts at 1.
        test_recipe:
          setup:
            - "The logical clock has been set to 2026-05-04T09:30:00.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:30:00.000Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /athletics/donors"
              payload: { full_name: "Sam System", email: "sam.system@example.com", alumni_status: "STUDENT", entity_type: "INDIVIDUAL" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { ss_id: "$.data.id" }
          assert:
            - "${ss_id} is a non-empty server-generated string"
            - "Donor.${ss_id}.created_at == 2026-05-04T09:30:00.000Z"
            - "Donor.${ss_id}.updated_at == 2026-05-04T09:30:00.000Z"
            - "Donor.${ss_id}.version == 1"
            - "the response body contains no client-supplied id, created_at, updated_at or version echo"

      - name: donor_create_with_unrecognised_entity_type_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.Donor.fields.entity_type
          - validations.priority_6
        distinguishing_aspect: |
          entity_type accepts exactly four symbols; PARTNERSHIP is rejected at
          priority 6 rather than stored as an opaque string, which matters
          because ENTITY_GIVING_REALIGNMENT transfers key off this enum.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /athletics/donors"
              payload: { full_name: "Enum Breaker", email: "enum.breaker@example.com", alumni_status: "ALUMNUS", entity_type: "PARTNERSHIP" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 400"
            - "${err} == ERR_INVALID_REQUEST"
            - "no Donor row is created"

      - name: recalculation_create_with_dispute_window_before_cutoff_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.PointRecalculation.fields.dispute_window_end
          - validations.priority_6
        distinguishing_aspect: |
          The declared constraint is strict ordering, so a dispute_window_end
          earlier than cutoff_date is a 400 at creation rather than an empty
          dispute window discovered later at decide time.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /athletics/point-recalculations"
              payload: { cycle_year: 2026, cutoff_date: "2026-06-30T23:59:59.999Z", dispute_window_end: "2026-06-01T00:00:00.000Z" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 400"
            - "${err} == ERR_INVALID_REQUEST"
            - "no PointRecalculation row is created"

      - name: duplicate_donor_email_is_rejected_as_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.Donor.fields.email
          - validations.priority_6
        distinguishing_aspect: |
          email is declared unique across Donor, so the second create with the
          same address fails at priority 6 and the first row survives
          untouched at version 1.
        test_recipe:
          setup:
            - "One Donor already holds twin@example.com."
          setup_api_calls:
            - call: "POST /athletics/donors"
              payload: { full_name: "Twin One", email: "twin@example.com", alumni_status: "NON_ALUMNUS", entity_type: "INDIVIDUAL" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { twin_id: "$.data.id" }
          trigger:
            - call: "POST /athletics/donors"
              payload: { full_name: "Twin Two", email: "twin@example.com", alumni_status: "ALUMNUS", entity_type: "INDIVIDUAL" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "the second create returns HTTP 400"
            - "${err} == ERR_INVALID_REQUEST"
            - "Donor.${twin_id}.full_name == Twin One"
            - "Donor.${twin_id}.version == 1"
            - "GET /athletics/donors reports total_count 1"

      - name: point_ledger_entry_is_immutable_and_has_no_version_field
        claim_type: immutability
        grounds:
          - entities.PointLedgerEntry
          - endpoints.GET_/athletics/point-ledger-entries/{id}
        distinguishing_aspect: |
          PointLedgerEntry is the one entity declared with common_fields
          false: §1.5 exposes only two GETs for it and no write endpoint at
          all, and the row carries computed_at instead of updated_at and no
          version column, so nothing can bump it after the run wrote it.
        test_recipe:
          setup:
            - "A recalculation for cycle 2026 has been run (status COMPUTED) over one donor holding a single RECEIVED 1,000,000-cent ATHLETICS_ANNUAL gift dated 2026-03-01, so both variant generations of PointLedgerEntry rows exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /athletics/donors"
              payload: { full_name: "Immy Mutable", email: "immy.mutable@example.com", alumni_status: "NON_ALUMNUS", entity_type: "INDIVIDUAL" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { im_id: "$.data.id" }
            - call: "POST /athletics/donors/${im_id}/gifts"
              payload: { gift_date: "2026-03-01T00:00:00.000Z", amount_cents: 1000000, designation: "ATHLETICS_ANNUAL", gift_status: "RECEIVED" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/point-recalculations"
              payload: { cycle_year: 2026, cutoff_date: "2026-06-30T23:59:59.999Z", dispute_window_end: "2026-09-30T00:00:00.000Z" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { r_id: "$.data.id" }
            - call: "POST /athletics/point-recalculations/${r_id}/run"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "GET /athletics/point-ledger-entries?donor_id=${im_id}&variant=CERTIFIED&entry_type=CUMULATIVE_GIVING"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { le_id: "$.data[0].id" }
          trigger:
            - call: "GET /athletics/point-ledger-entries/${le_id}"
              payload: {}
              as: PolicyCommittee
              as_user_id: "policy-1"
          assert:
            - "the response status is 200"
            - "the row exposes donor_id, recalculation_id, entry_type, variant, points, basis_note and computed_at"
            - "the row exposes no version field and no updated_at field"
            - "PointLedgerEntry.${le_id}.entry_type == CUMULATIVE_GIVING"
            - "PointLedgerEntry.${le_id}.variant == CERTIFIED"
            - "PointLedgerEntry.${le_id}.points == 10.00"
            - "PointLedgerEntry.${le_id}.computed_at == 2026-04-01T00:00:00.000Z"
            - "§1.5 declares no POST, PUT, PATCH or DELETE endpoint under /athletics/point-ledger-entries"

      - name: seat_create_under_unknown_section_returns_section_not_found
        claim_type: parent_relationships
        grounds:
          - entities.Seat.parent
          - errors.ERR_SECTION_NOT_FOUND
        distinguishing_aspect: |
          Seat is the one entity with a declared parent, so its nested create
          resolves the parent path id first and returns the parent's own 404
          code rather than creating an orphan seat.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /athletics/sections/00000000-0000-4000-8000-000000000002/seats"
              payload: { row_label: "ZZ", seat_number: 1 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 404"
            - "${err} == ERR_SECTION_NOT_FOUND"
            - "no Seat row is created"

      - name: transfer_create_with_unknown_recipient_returns_referenced_entity_not_found
        claim_type: foreign_key_references_validated
        grounds:
          - validations.priority_7
          - errors.ERR_REFERENCED_ENTITY_NOT_FOUND
          - entities.PointTransfer.fields.recipient_donor_id
        distinguishing_aspect: |
          The topology is flat, so cross-references arrive in the body rather
          than the path: an unresolvable recipient_donor_id is priority 7's
          ERR_REFERENCED_ENTITY_NOT_FOUND, distinct from the path-id 404
          ERR_DONOR_NOT_FOUND, and no PointTransfer row is created.
        test_recipe:
          setup:
            - "One Donor exists to act as the transfer source."
          setup_api_calls:
            - call: "POST /athletics/donors"
              payload: { full_name: "Fiona Source", email: "fiona.source@example.com", alumni_status: "NON_ALUMNUS", entity_type: "INDIVIDUAL" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { fs_id: "$.data.id", fs_v: "$.data.version" }
          trigger:
            - call: "POST /athletics/point-transfers"
              payload: { source_donor_id: "${fs_id}", recipient_donor_id: "00000000-0000-4000-8000-000000000003", basis: "DEATH", points_amount: 10.00, expected_source_donor_version: "${fs_v}" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 404"
            - "${err} == ERR_REFERENCED_ENTITY_NOT_FOUND"
            - "GET /athletics/donors/${fs_id}/point-transfers returns total_count 0"
            - "Donor.${fs_id}.version == 1"

  # ---------------------------------------------------------------------------
  # Table 2 (State Machines) — claim-extraction-guide.md §2.
  # 12 state machines; state_machine_shape: parallel. Claims cover valid
  # transitions, precondition enforcement, side-effect execution, invalid
  # transitions, initial state, terminal-state lockdown, idempotency, plus the
  # shape rows (cyclic / branching / parallel / guarded) and the side-effect
  # patterns (cascade down, cross-entity, ledger sync, compensation).
  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: donor_status_change_active_to_lapsed_stamps_the_effective_date
        claim_type: valid_transition
        grounds:
          - state_machines.Donor.donor_status.transitions.ACTIVE_to_LAPSED
          - endpoints.POST_/athletics/donors/{id}/status-change
        distinguishing_aspect: |
          The ACTIVE -> LAPSED edge must move donor_status AND overwrite
          status_effective_date with the caller-supplied effective_date (not with
          the logical clock), bump version by exactly one, and leave every points
          field untouched. An implementation that stamps "now" instead of
          effective_date, or that recomputes points on a status change, fails.
        test_recipe:
          setup:
            - "Empty database; logical clock at its default 2026-08-01T00:00:00.000Z."
            - "Exactly one Donor, ACTIVE, version 1, with no gifts and no recalculation run."
          setup_api_calls:
            - call: "POST /athletics/donors"
              payload: { full_name: "Lena Lapsing", email: "lena.lapsing@example.com", alumni_status: "NON_ALUMNUS", entity_type: "INDIVIDUAL" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { ll_id: "$.data.id", ll_v: "$.data.version" }
          trigger:
            - call: "POST /athletics/donors/${ll_id}/status-change"
              payload: { new_status: "LAPSED", effective_date: "2026-07-01T00:00:00.000Z", reason: "No qualifying gift in the last two cycles", expected_donor_version: "${ll_v}" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
          assert:
            - "HTTP 200 with an object envelope whose data is the updated Donor."
            - "Donor.${ll_id}.donor_status == \"LAPSED\""
            - "Donor.${ll_id}.status_effective_date == \"2026-07-01T00:00:00.000Z\" (the request value, NOT the clock 2026-08-01T00:00:00.000Z)"
            - "Donor.${ll_id}.version == 2"
            - "Donor.${ll_id}.certified_base_points == 0.00 and Donor.${ll_id}.certified_points == 0.00"
            - "Donor.${ll_id}.cumulative_giving_cents == 0"

      - name: donor_lapsed_to_active_reactivation_loop_preserves_points
        claim_type: cyclic
        grounds:
          - state_machines.Donor.donor_status.transitions.LAPSED_to_ACTIVE
          - complexity_profile.state_machine_shape
        distinguishing_aspect: |
          Donor.donor_status admits a genuine ACTIVE -> LAPSED -> ACTIVE loop.
          Each traversal must advance version and re-stamp status_effective_date,
          while certified_base_points / certified_points / cumulative_giving_cents
          survive the round trip unchanged. An implementation that treats LAPSED
          as one-way, or that zeroes points on lapse and does not restore them on
          reactivation, fails.
        test_recipe:
          setup:
            - "One Donor with a single RECEIVED ATHLETICS_ANNUAL gift of 1000000 cents dated 2026-03-01, cumulative_giving_cents 1000000, version 2, still ACTIVE."
          setup_api_calls:
