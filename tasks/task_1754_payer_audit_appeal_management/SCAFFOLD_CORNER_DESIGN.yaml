  # ===================================================================
  # Section: calculations
  # ===================================================================
  - section: calculations
    instances:
      - name: interest_zero_before_first_period
        claim_type: correct_result
        grounds: ["calculations.recoupment_interest_accrual"]
        distinguishing_aspect: "periods = floor(eligible_days / 30): at 29 days interest is 0; at exactly 30 days the first period completes and interest jumps to 10000 on principal 1000000 at 100bps."
        test_recipe:
          setup: ["demand principal 1000000 issued 2026-08-01 on a determined case"]
          setup_api_calls:
            - { call: "POST /payers", payload: { name: "P1", payer_type: "RAC", records_submission_days: 30, l1_deadline_days: 30, l2_deadline_days: 30, l3_deadline_days: 30, l4_deadline_days: 30, l5_deadline_days: 30, external_review_deadline_days: 30, concurrent_audit_cap: 10, hold_levels: [], interest_rate_bps_tier1: 100, interest_rate_bps_tier2: 200, interest_cap_pct: 25 }, as: RevenueCycleAdmin, captures: { p1: $.data.id } }
            - { call: "POST /issue-codes", payload: { code: "AUTH", category: "TECHNICAL", description: "Missing auth" }, as: RevenueCycleAdmin, captures: { ic: $.data.id } }
            - { call: "POST /audit-cases", payload: { payer_id: "${p1}", audit_type: "RAC_COMPLEX", received_at: "2026-08-01T00:00:00Z" }, as: HIMCoordinator, captures: { c1: $.data.id } }
            - { call: "POST /audit-cases/${c1}/claim-lines", payload: { claim_number: "L-1", patient_account_number: "PA-1", service_start_date: "2026-01-01T00:00:00Z", service_end_date: "2026-01-03T00:00:00Z", billed_amount_cents: 1000000 }, as: HIMCoordinator, captures: { l1: $.data.id } }
            - { call: "GET /audit-cases/${c1}", payload: {}, as: Any, captures: { c1v: $.data.version } }
            - { call: "POST /audit-cases/${c1}/records-submissions", payload: { manifest_ref: "M1", expected_audit_case_version: "${c1v}" }, as: HIMCoordinator }
            - { call: "POST /audit-cases/${c1}/begin-payer-review", payload: {}, as: PayerAgent, as_user_id: "${p1}" }
            - { call: "POST /audit-cases/${c1}/determination", payload: { outcomes: [ { claim_line_id: "${l1}", outcome: "DENIED", denied_amount_cents: 1000000, denial_category: "TECHNICAL", issue_code_id: "${ic}" } ] }, as: PayerAgent, as_user_id: "${p1}" }
            - { call: "POST /audit-cases/${c1}/recoupment-demands", payload: { principal_cents: 1000000, issued_at: "2026-08-01T00:00:00Z" }, as: PayerAgent, as_user_id: "${p1}", captures: { d1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-30T00:00:00Z" }, as: RevenueCycleAdmin }
          trigger:
            - { call: "GET /recoupment-demands/${d1}", payload: {}, as: Any, captures: { i29: $.data.accrued_interest_cents } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: RevenueCycleAdmin }
            - { call: "GET /recoupment-demands/${d1}", payload: {}, as: Any, captures: { i30: $.data.accrued_interest_cents } }
          assert:
            - "i29 == 0 (29 days -> floor(29/30) == 0 periods)"
            - "i30 == 10000 (30 days -> 1 period -> 1000000 * 100 / 10000)"

      - name: interest_cap_binds_at_ceiling
        claim_type: constants_applied
        grounds: ["calculations.recoupment_interest_accrual", "entities.RecoupmentDemand.fields.interest_cap_pct_snapshot"]
        distinguishing_aspect: "With tier2 at 1000bps, 10 periods of raw interest on principal 100000 total 82000, but interest_cap_pct 25 caps the accrual at exactly 25000 (cap snapshot taken at demand creation)."
        test_recipe:
          setup: ["payer tier2 1000bps cap 25%; demand principal 100000 issued 2026-08-01; read at 2027-06-07 (310 days -> 10 periods)"]
          setup_api_calls:
            - { call: "POST /payers", payload: { name: "P1", payer_type: "RAC", records_submission_days: 30, l1_deadline_days: 30, l2_deadline_days: 30, l3_deadline_days: 30, l4_deadline_days: 30, l5_deadline_days: 30, external_review_deadline_days: 30, concurrent_audit_cap: 10, hold_levels: [], interest_rate_bps_tier1: 100, interest_rate_bps_tier2: 1000, interest_cap_pct: 25 }, as: RevenueCycleAdmin, captures: { p1: $.data.id } }
            - { call: "POST /issue-codes", payload: { code: "AUTH", category: "TECHNICAL", description: "Missing auth" }, as: RevenueCycleAdmin, captures: { ic: $.data.id } }
            - { call: "POST /audit-cases", payload: { payer_id: "${p1}", audit_type: "RAC_COMPLEX", received_at: "2026-08-01T00:00:00Z" }, as: HIMCoordinator, captures: { c1: $.data.id } }
            - { call: "POST /audit-cases/${c1}/claim-lines", payload: { claim_number: "L-1", patient_account_number: "PA-1", service_start_date: "2026-01-01T00:00:00Z", service_end_date: "2026-01-03T00:00:00Z", billed_amount_cents: 100000 }, as: HIMCoordinator, captures: { l1: $.data.id } }
            - { call: "GET /audit-cases/${c1}", payload: {}, as: Any, captures: { c1v: $.data.version } }
            - { call: "POST /audit-cases/${c1}/records-submissions", payload: { manifest_ref: "M1", expected_audit_case_version: "${c1v}" }, as: HIMCoordinator }
            - { call: "POST /audit-cases/${c1}/begin-payer-review", payload: {}, as: PayerAgent, as_user_id: "${p1}" }
            - { call: "POST /audit-cases/${c1}/determination", payload: { outcomes: [ { claim_line_id: "${l1}", outcome: "DENIED", denied_amount_cents: 100000, denial_category: "TECHNICAL", issue_code_id: "${ic}" } ] }, as: PayerAgent, as_user_id: "${p1}" }
            - { call: "POST /audit-cases/${c1}/recoupment-demands", payload: { principal_cents: 100000, issued_at: "2026-08-01T00:00:00Z" }, as: PayerAgent, as_user_id: "${p1}", captures: { d1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-06-07T00:00:00Z" }, as: RevenueCycleAdmin }
          trigger:
            - { call: "GET /recoupment-demands/${d1}", payload: {}, as: Any, captures: { i_cap: $.data.accrued_interest_cents } }
          assert:
            - "i_cap == 25000 (min(82000, 100000 * 25 / 100); cap binds)"

      - name: waterfall_skips_on_hold_demands
        claim_type: input_set_filtering
        grounds: ["calculations.offset_waterfall_allocation", "state_machines.RecoupmentDemand.DEMANDED_to_ON_HOLD"]
        distinguishing_aspect: "The waterfall's candidate set excludes ON_HOLD demands: allocating a remittance while the only demand is ON_HOLD creates zero offsets and leaves the remittance untouched."
        test_recipe:
          setup: ["payer hold_levels [LEVEL_1]; case denied 100000 with demand 100000; L1 appeal filed -> demand ON_HOLD; remittance 50000"]
          setup_api_calls:
            - { call: "POST /payers", payload: { name: "P1", payer_type: "RAC", records_submission_days: 30, l1_deadline_days: 30, l2_deadline_days: 30, l3_deadline_days: 30, l4_deadline_days: 30, l5_deadline_days: 30, external_review_deadline_days: 30, concurrent_audit_cap: 10, hold_levels: ["LEVEL_1"], interest_rate_bps_tier1: 100, interest_rate_bps_tier2: 200, interest_cap_pct: 25 }, as: RevenueCycleAdmin, captures: { p1: $.data.id } }
            - { call: "POST /issue-codes", payload: { code: "AUTH", category: "TECHNICAL", description: "Missing auth" }, as: RevenueCycleAdmin, captures: { ic: $.data.id } }
            - { call: "POST /audit-cases", payload: { payer_id: "${p1}", audit_type: "RAC_COMPLEX", received_at: "2026-08-01T00:00:00Z" }, as: HIMCoordinator, captures: { c1: $.data.id } }
            - { call: "POST /audit-cases/${c1}/claim-lines", payload: { claim_number: "L-1", patient_account_number: "PA-1", service_start_date: "2026-01-01T00:00:00Z", service_end_date: "2026-01-03T00:00:00Z", billed_amount_cents: 100000 }, as: HIMCoordinator, captures: { l1: $.data.id } }
            - { call: "GET /audit-cases/${c1}", payload: {}, as: Any, captures: { c1v: $.data.version } }
            - { call: "POST /audit-cases/${c1}/records-submissions", payload: { manifest_ref: "M1", expected_audit_case_version: "${c1v}" }, as: HIMCoordinator }
            - { call: "POST /audit-cases/${c1}/begin-payer-review", payload: {}, as: PayerAgent, as_user_id: "${p1}" }
            - { call: "POST /audit-cases/${c1}/determination", payload: { outcomes: [ { claim_line_id: "${l1}", outcome: "DENIED", denied_amount_cents: 100000, denial_category: "TECHNICAL", issue_code_id: "${ic}" } ] }, as: PayerAgent, as_user_id: "${p1}" }
            - { call: "POST /audit-cases/${c1}/recoupment-demands", payload: { principal_cents: 100000 }, as: PayerAgent, as_user_id: "${p1}", captures: { d1: $.data.id } }
            - { call: "POST /claim-lines/${l1}/appeals", payload: {}, as: AppealsSpecialist, captures: { ap1: $.data.id } }
            - { call: "POST /appeals/${ap1}/file", payload: {}, as: AppealsSpecialist }
            - { call: "POST /remittances", payload: { payer_id: "${p1}", gross_amount_cents: 50000 }, as: PayerAgent, as_user_id: "${p1}", captures: { rem: $.data.id } }
          trigger:
            - { call: "POST /remittances/${rem}/allocate", payload: {}, as: PFSAccountant }
            - { call: "GET /remittances/${rem}", payload: {}, as: Any, captures: { r_avail: $.data.available_cents, r_st: $.data.status } }
            - { call: "GET /recoupment-demands/${d1}/offset-transactions", payload: {}, as: Any }
          assert:
            - "allocate returns an empty OffsetTransaction[] (total_count == 0)"
            - "r_avail == 50000 and r_st == \"RECEIVED\" (ON_HOLD demand was skipped)"
            - "GET /recoupment-demands/${d1}/offset-transactions returns total_count == 0"

