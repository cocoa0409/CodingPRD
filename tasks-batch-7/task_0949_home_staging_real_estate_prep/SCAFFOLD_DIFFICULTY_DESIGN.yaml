              as: WarehouseManager
            - call: "POST /staging/pickups/${pickup_id}/complete"
              payload: {}
              as: StagingCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_ASSESSMENT_INVALID_STATE"
            - "Pickup.${pickup_id}.state == IN_PROGRESS"
            - "DamageAssessment.${as_id}.state == ASSESSED"
            - "DamageAssessment.${as_id}.depreciated_replacement_value == 375.00"
            - "DamageAssessment.${as_id}.disposition == REPAIR"
            - "DamageAssessment.${as_id}.charge_amount == 40.00"

      - name: photo_shoot_cannot_be_scheduled_after_destage_started
        grounds:
