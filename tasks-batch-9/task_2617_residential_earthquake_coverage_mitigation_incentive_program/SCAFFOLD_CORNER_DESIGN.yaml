          assert:
            - "${exp_1} == \"2026-08-31T00:00:00Z\" - quoted_at 2026-08-01 plus QUOTE_VALID_DAYS 30"
            - "${early_err} == \"ERR_QUOTE_STILL_VALID\" with HTTP 409 - at 2026-08-30 the quote has not run out"
            - "${bind_err} == \"ERR_QUOTE_EXPIRED\" with HTTP 409 - the bind window is the half-open [quoted_at, quote_expires_at), so the boundary instant is already too late"
