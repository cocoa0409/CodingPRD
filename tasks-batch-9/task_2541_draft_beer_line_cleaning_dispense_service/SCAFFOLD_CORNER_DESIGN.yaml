      - name: corner_cooler_readings_are_shared_by_two_roles_and_unauthorized_for_dispatch
        claim_type: Permitted operation
        grounds:
          - rbac.ServiceTechnician.shared_operations
          - rbac.VenueManager.shared_operations
          - endpoints.POST_cooler_readings
          - entities.CoolerReading.fields.source
        distinguishing_aspect: |
          The one shared write in §1.7 is genuinely shared and self-labelling: the
          technician's reading is stamped source TECH_MANUAL, the venue manager's
          VENUE_MANUAL, each with recorded_by_user_id taken from the caller, while
          DispatchCoordinator — who owns most of the write surface — is
          ERR_UNAUTHORIZED (403) here.
        test_recipe:
          setup:
            - "ServiceAccount 'Cellar Cooler Pub' created with glycol_system_present true, so exactly one GlycolLoop exists."
            - "Technician 'Dana Ruiz' ACTIVE; the venue manager acts as the account id."
          setup_api_calls:
            - call: "POST /draft-service/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/accounts"
              payload: { venue_name: "Cellar Cooler Pub", access_window_start_minute: 480, access_window_end_minute: 1080, glycol_system_present: true }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { acct: $.data.id }
            - call: "POST /draft-service/technicians"
              payload: { full_name: "Dana Ruiz", certification_level: "MASTER", caustic_certified: true, status: "ACTIVE" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { tech: $.data.id }
            - call: "GET /draft-service/glycol-loops?account_id=${acct}&limit=10&offset=0"
              payload: {}
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { loop: "$.data[0].id" }
          trigger:
            - call: "POST /draft-service/cooler-readings"
              payload: { glycol_loop_id: "${loop}", cooler_temp_f: 36.00, glycol_supply_temp_f: 28.50 }
              as: ServiceTechnician
              as_user_id: "${tech}"
              captures: { r1: $.data.id, src1: $.data.source, by1: $.data.recorded_by_user_id }
            - call: "POST /draft-service/cooler-readings"
              payload: { glycol_loop_id: "${loop}", cooler_temp_f: 37.00, glycol_supply_temp_f: 29.00 }
              as: VenueManager
              as_user_id: "${acct}"
              captures: { r2: $.data.id, src2: $.data.source, by2: $.data.recorded_by_user_id }
            - call: "POST /draft-service/cooler-readings"
              payload: { glycol_loop_id: "${loop}", cooler_temp_f: 38.00, glycol_supply_temp_f: 29.50 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { err: $.data.error_id }
            - call: "GET /draft-service/cooler-readings?glycol_loop_id=${loop}&source=VENUE_MANUAL&limit=10&offset=0"
              payload: {}
              as: QualityAuditor
              as_user_id: "auditor-1"
              captures: { total: $.total_count, listed: "$.data[0].id" }
          assert:
            - "both writes return HTTP 201 — the operation is shared, not exclusive"
            - "${src1} == TECH_MANUAL and ${by1} == ${tech}"
            - "${src2} == VENUE_MANUAL and ${by2} == ${acct}"
            - "the dispatcher's write returns HTTP 403 and ${err} == ERR_UNAUTHORIZED"
            - "${total} == 1 and ${listed} == ${r2} — only the venue-sourced reading matches the filter"
            - "CoolerReading.${r1}.reading_at == 2026-08-01T00:00:00Z (stamped from the logical clock, not supplied)"

      - name: corner_the_auditor_who_escalated_a_complaint_cannot_resolve_it
        claim_type: Segregation of duties
        grounds:
          - validations[9].ERR_SEGREGATION_OF_DUTIES
          - state_machines.QualityComplaint.ESCALATED_to_RESOLVED
          - complexity_profile.role_model
        distinguishing_aspect: |
          The interlock is per-user, not per-role: auditor-1, who set
          escalated_by_user_id on the ESCALATED hop, is refused with
          ERR_SEGREGATION_OF_DUTIES (403) on the resolve, while auditor-2 — same
          role, different X-User-ID — closes it and lands closed_by_user_id.
        test_recipe:
          setup:
            - "ServiceAccount 'Anchor Alehouse' ACTIVE with an ACTIVE contract; BeerLine #1 IN_SERVICE, never cleaned."
            - "One OPEN FOAMY_POUR complaint reported by the venue manager at 2026-08-05T11:00:00Z."
            - "Two distinct QualityAuditor user ids: auditor-1 and auditor-2."
          setup_api_calls:
            - call: "POST /draft-service/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/accounts"
              payload: { venue_name: "Anchor Alehouse", access_window_start_minute: 480, access_window_end_minute: 1080, glycol_system_present: false }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { acct: $.data.id, acct_v: $.data.version }
            - call: "POST /draft-service/contracts"
              payload: { account_id: "${acct}", cleaning_frequency_days: 21, contracted_line_count: 4, per_line_rate_cents: 4175, visit_base_fee_cents: 7500, effective_from: "2026-08-01T00:00:00Z", expected_account_version: "${acct_v}" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { ctr: $.data.id }
            - call: "POST /draft-service/contracts/${ctr}/status"
              payload: { to_status: "ACTIVE" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/beer-lines"
              payload: { account_id: "${acct}", line_number: 1, run_length_feet: 32, vertical_rise_feet: 4, inner_diameter_inches: 0.375, beer_style_group: "ALE", average_daily_throughput_liters: 12.0 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { line1: $.data.id }
            - call: "POST /draft-service/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T11:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/quality-complaints"
              payload: { account_id: "${acct}", line_id: "${line1}", symptom: "FOAMY_POUR" }
              as: VenueManager
              as_user_id: "${acct}"
              captures: { cmp: $.data.id, cstate: $.data.status }
            - call: "POST /draft-service/quality-complaints/${cmp}/diagnostic-round"
              payload: { outcome: "ROOT_CAUSE_FOUND", finding_code: "BIOFILM_IN_RUN" }
              as: QualityAuditor
              as_user_id: "auditor-1"
              captures: { cstate2: $.data.status }
            - call: "POST /draft-service/quality-complaints/${cmp}/closure"
              payload: { disposition: "ESCALATED", measured_waste_liters: 0.0 }
              as: QualityAuditor
              as_user_id: "auditor-1"
              captures: { cstate3: $.data.status, esc_by: $.data.escalated_by_user_id }
          trigger:
            - call: "POST /draft-service/quality-complaints/${cmp}/closure"
              payload: { disposition: "RESOLVED", measured_waste_liters: 4.0 }
              as: QualityAuditor
              as_user_id: "auditor-1"
              captures: { err: $.data.error_id }
            - call: "POST /draft-service/quality-complaints/${cmp}/closure"
              payload: { disposition: "RESOLVED", measured_waste_liters: 4.0 }
              as: QualityAuditor
              as_user_id: "auditor-2"
              captures: { cstate4: $.data.status, closed_by: $.data.closed_by_user_id }
          assert:
            - "${cstate} == OPEN, ${cstate2} == DIAGNOSING, ${cstate3} == ESCALATED and ${esc_by} == auditor-1"
            - "ServiceAccount.${acct}.open_complaint_count == 1 while the complaint is ESCALATED"
            - "auditor-1's resolve returns HTTP 403 with ${err} == ERR_SEGREGATION_OF_DUTIES and the complaint stays ESCALATED"
            - "auditor-2's resolve returns HTTP 200 with ${cstate4} == RESOLVED and ${closed_by} == auditor-2"
            - "QualityComplaint.${cmp}.escalated_by_user_id is still auditor-1 after the resolve"
            - "ServiceAccount.${acct}.open_complaint_count == 0"

      - name: corner_venue_manager_cannot_open_a_complaint_against_another_venue
        claim_type: Unauthorized operation
        grounds:
          - validations[7].ERR_ACCOUNT_SCOPE_VIOLATION
          - rbac.VenueManager.entity_backed
          - endpoints.POST_quality_complaints
        distinguishing_aspect: |
          VenueManager is entity_backed by ServiceAccount, so the X-User-ID *is*
          the tenancy boundary: acting as account A's manager against account B's
          line is ERR_ACCOUNT_SCOPE_VIOLATION (403) — a scope failure, not a role
          failure — and the identical payload succeeds when B's own manager sends
          it.
        test_recipe:
          setup:
            - "Two ACTIVE accounts, 'Anchor Alehouse' (A) and 'Harbor Taproom' (B), each with an ACTIVE contract."
            - "BeerLine #1 belongs to account B."
          setup_api_calls:
            - call: "POST /draft-service/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/accounts"
              payload: { venue_name: "Anchor Alehouse", access_window_start_minute: 480, access_window_end_minute: 1080, glycol_system_present: false }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { acctA: $.data.id }
            - call: "POST /draft-service/accounts"
              payload: { venue_name: "Harbor Taproom", access_window_start_minute: 600, access_window_end_minute: 1200, glycol_system_present: false }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { acctB: $.data.id, acctB_v: $.data.version }
            - call: "POST /draft-service/contracts"
              payload: { account_id: "${acctB}", cleaning_frequency_days: 21, contracted_line_count: 4, per_line_rate_cents: 4175, visit_base_fee_cents: 7500, effective_from: "2026-08-01T00:00:00Z", expected_account_version: "${acctB_v}" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { ctrB: $.data.id }
            - call: "POST /draft-service/contracts/${ctrB}/status"
              payload: { to_status: "ACTIVE" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/beer-lines"
              payload: { account_id: "${acctB}", line_number: 1, run_length_feet: 32, vertical_rise_feet: 4, inner_diameter_inches: 0.375, beer_style_group: "ALE", average_daily_throughput_liters: 12.0 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { lineB: $.data.id }
          trigger:
            - call: "POST /draft-service/quality-complaints"
              payload: { account_id: "${acctB}", line_id: "${lineB}", symptom: "FLAT_POUR" }
              as: VenueManager
              as_user_id: "${acctA}"
              captures: { err: $.data.error_id }
            - call: "POST /draft-service/quality-complaints"
              payload: { account_id: "${acctB}", line_id: "${lineB}", symptom: "FLAT_POUR" }
              as: VenueManager
              as_user_id: "${acctB}"
              captures: { cmp: $.data.id, cacct: $.data.account_id }
          assert:
            - "account A's manager gets HTTP 403 with ${err} == ERR_ACCOUNT_SCOPE_VIOLATION"
            - "ServiceAccount.${acctB}.open_complaint_count == 0 after the refusal"
            - "account B's manager gets HTTP 201 with ${cacct} == ${acctB} and QualityComplaint.${cmp}.status == OPEN"
            - "ServiceAccount.${acctB}.open_complaint_count == 1 and ServiceAccount.${acctA}.open_complaint_count == 0"

  # ===========================================================================
  # SECTION 8 — cross_cutting_layers
  # complexity_layers: optimistic_concurrency, cascading_side_effects,
  # dual_variant_calculation, rate_threshold_triggers. Both §1.2.1 concurrency
  # rules get their own OCC instance; the cascade and dual-variant layers are
  # already the spine of §1.8 rules 4 and 1 and are stubbed.
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: corner_contract_create_carrying_the_pre_activation_account_version_is_stale
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.contract-create-stale-account
          - validations[10].ERR_STALE_ACCOUNT_VERSION
          - endpoints.POST_contracts
        distinguishing_aspect: |
          Activating the first contract is what advances ServiceAccount.version
          from 1 to 2, so a second contract still quoting version 1 is
          ERR_STALE_ACCOUNT_VERSION (412) while the same payload quoting 2 is
          created — and activating that one expires its predecessor and takes the
          account to version 3.
        test_recipe:
          setup:
            - "ServiceAccount 'Anchor Alehouse' ACTIVE at version 1 (creation does not touch version)."
            - "ServiceContract #1 created with expected_account_version 1 and then activated, taking the account to version 2."
          setup_api_calls:
            - call: "POST /draft-service/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/accounts"
              payload: { venue_name: "Anchor Alehouse", access_window_start_minute: 480, access_window_end_minute: 1080, glycol_system_present: false }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { acct: $.data.id, acct_v1: $.data.version }
            - call: "POST /draft-service/contracts"
              payload: { account_id: "${acct}", cleaning_frequency_days: 21, contracted_line_count: 4, per_line_rate_cents: 4175, visit_base_fee_cents: 7500, effective_from: "2026-08-01T00:00:00Z", expected_account_version: "${acct_v1}" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
