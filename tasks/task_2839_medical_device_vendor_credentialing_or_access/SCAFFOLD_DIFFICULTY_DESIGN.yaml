            - "Case CASE-10001 runs 2026-09-20T08:00:00Z to 10:00:00Z and an authorization is CREATED (status REQUESTED) while the rep is still CREDENTIALED."
            - "The clock moves to 2026-09-01T00:00:00Z and one sweep runs: the credential expires, the posture becomes LAPSED and the rep is SUSPENDED. The authorization is untouched because phase 4 only revokes APPROVED rows."
