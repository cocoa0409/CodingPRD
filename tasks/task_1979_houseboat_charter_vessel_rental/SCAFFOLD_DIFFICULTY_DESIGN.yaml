          - concurrency_rules[booking-cancel-stale-version]
        distinguishing_aspect: |
          Day-count tier boundary on the cancel endpoint: days_before == 14 lands inside the
          14 <= d < 30 band (50%), not the 8..13 band (25%) — the >= lower-bound inclusion decides
          204750 vs 102375 on the same booking. Different metric and endpoint than the sibling
          date-inclusion boundary.
