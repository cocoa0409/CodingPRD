      - name: superseding_inspection_voids_parent_inspection
        claim_type: side_effect_execution
        grounds:
          - state_machines[Inspection].transitions[DRAFT->VOIDED]
          - entities.Inspection.fields.parent_inspection_id
          - entities.Inspection.fields.purpose
          - errors[ERR_INSPECTION_ALREADY_OPEN]
        distinguishing_aspect: |
          Naming parent_inspection_id is the one way to open a second inspection on a vehicle that
          already has an open one: it voids the parent with failure_reason
          SUPERSEDED_BY_REINSPECTION and makes the child purpose RE_INSPECTION, whereas the same
          create without the parent link is ERR_INSPECTION_ALREADY_OPEN. The voided parent also
          releases its technician slot, which is why the same technician can be re-used.
        test_recipe:
          setup:
            - "Dealer D1 with technician T1, published MPI-172, canonical vehicle V1 carrying one IN_PROGRESS inspection I1 recorded at 09:00."
          setup_api_calls:
            - call: "POST /cpo/dealers"
              payload: { name: "Coast Motors", franchise_code: "FR-1001", region_code: "WEST" }
              as: ProgramAdministrator
              captures: { d1: $.data.id }
            - call: "POST /cpo/dealers/${d1}/technicians"
              payload: { name: "Ada Tech", credential_id: "CR-1", credential_expires_at: "2027-01-01T00:00:00Z", credential_status: "ACTIVE" }
              as: ProgramAdministrator
              captures: { t1: $.data.id }
            - call: "POST /cpo/checklist-templates"
              payload: { code: "MPI-172", effective_from: "2026-01-01" }
              as: ProgramAdministrator
              captures: { tpl: $.data.id }
            - call: "POST /cpo/checklist-templates/${tpl}/items"
              payload: { item_code: "P1", category: "POWERTRAIN", severity: "CRITICAL", pass_criteria: "no engine or transmission fault codes", reconditioning_allowed: false }
              as: ProgramAdministrator
            - call: "POST /cpo/checklist-templates/${tpl}/items"
              payload: { item_code: "S1", category: "SAFETY", severity: "CRITICAL", pass_criteria: "all airbag and restraint systems nominal", reconditioning_allowed: true, max_reconditioning_cost_cents: 200000 }
              as: ProgramAdministrator
            - call: "POST /cpo/checklist-templates/${tpl}/items"
              payload: { item_code: "B1", category: "BRAKES", severity: "MAJOR", pass_criteria: "pad thickness within 4.0..12.0 mm", min_measure: 4.0, max_measure: 12.0, reconditioning_allowed: true, max_reconditioning_cost_cents: 100000 }
              as: ProgramAdministrator
            - call: "POST /cpo/checklist-templates/${tpl}/publish"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /cpo/vehicles"
              payload: { vin: "1HGCM82633A000001", model_year: 2022, in_service_date: "2022-02-01", odometer_miles: 62000, title_brand: "CLEAN", prior_use: "PERSONAL", owner_count: 1 }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { v1: $.data.id }
            - call: "POST /cpo/inspections"
              payload: { vehicle_id: "${v1}", technician_id: "${t1}", template_id: "${tpl}", started_at: "2026-07-31T09:00:00Z", odometer_at_inspection: 62000 }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { i1: $.data.id }
            - call: "PUT /cpo/inspections/${i1}/results"
              payload: { results: [{ item_code: "P1", outcome: "PASS" }] }
              as: InspectionTechnician
              as_user_id: "${t1}"
          trigger:
            - call: "POST /cpo/inspections"
              payload: { vehicle_id: "${v1}", technician_id: "${t1}", template_id: "${tpl}", started_at: "2026-07-31T14:00:00Z", odometer_at_inspection: 62050 }
              as: DealerPrincipal
              as_user_id: "${d1}"
            - call: "POST /cpo/inspections"
              payload: { vehicle_id: "${v1}", technician_id: "${t1}", template_id: "${tpl}", started_at: "2026-07-31T14:00:00Z", odometer_at_inspection: 62050, parent_inspection_id: "${i1}" }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { i2: $.data.id }
            - call: "GET /cpo/inspections/${i1}"
              payload: {}
              as: ProgramAuditor
            - call: "GET /cpo/inspections/${i1}/results"
              payload: { attempt_index: 1 }
              as: ProgramAuditor
          assert:
            - "trigger call 1 returns 409 ERR_INSPECTION_ALREADY_OPEN: I1 is IN_PROGRESS and the request does not name it as parent"
            - "trigger call 2 returns 201 with Inspection.${i2}.purpose == RE_INSPECTION, parent_inspection_id == ${i1}, complaint_id == null, status == DRAFT, attempt_count == 0"
            - "trigger call 3 shows Inspection.${i1}.status == VOIDED with failure_reason == SUPERSEDED_BY_REINSPECTION and submitted_at == null"
            - "trigger call 4 still returns the single attempt-1 result row of the voided parent: voiding does not delete evidence"
            - "Vehicle.${v1}.cpo_state stays CERTIFICATION_PENDING: the superseding create is not a fresh entry into the pending state"
            - "Technician.${t1}.completed_inspection_count == 0: only a PASSED submit increments it"

      - name: reconditioning_item_waived_by_administrator
        claim_type: valid_transition
        grounds:
          - state_machines[ReconditioningItem].transitions[REQUIRED->WAIVED]
          - state_machines[ReconditioningItem].transitions[REQUIRED->COMPLETED]
          - errors[ERR_RECONDITIONING_ITEM_CLOSED]
          - calculations.reconditioning_reimbursement
        distinguishing_aspect: |
          The two closures of a reconditioning item behave differently on money: WAIVED leaves
          actual_cost_cents null and reimbursable_cents 0 and is performed by the administrator,
          while COMPLETED by a second technician records the cost and pays
          round_half_up(50000 * 0.60) == 30000. Both are terminal, so a second closure of the waived
          row is ERR_RECONDITIONING_ITEM_CLOSED, and the inspection's totals count only the
          COMPLETED row.
        test_recipe:
          setup:
            - "Dealer D1 with technicians T1 (inspector) and T2 (repair sign-off), published MPI-172, canonical vehicle V1."
            - "Inspection I1 recorded S1 FAIL and B1 FAIL, then submitted to RECONDITIONING_REQUIRED, generating two REQUIRED items."
