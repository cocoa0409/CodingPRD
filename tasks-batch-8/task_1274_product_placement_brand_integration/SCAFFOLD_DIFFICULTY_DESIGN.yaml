            - { call: "POST /brands/${b_id}/briefs", payload: { title: "Summer fizz", objective: "awareness", budget_cents: 1000000 }, as: BrandRep, as_user_id: "${b_id}", captures: { br_id: $.data.id } }
            - { call: "POST /briefs/${br_id}/submit", as: BrandRep, as_user_id: "${b_id}" }
            - { call: "POST /series", payload: { name: "Night Shift", network_name: "NBN", clearance_policy: "STANDARD" }, as: AgencyAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /series/${s_id}/episodes", payload: { episode_number: 1, runtime_seconds: 1200, air_date: "2026-06-01T20:00:00Z" }, as: ProductionRep, as_user_id: "prod-1", captures: { ep_id: $.data.id, ep_v: $.data.version } }
            - { call: "POST /episodes/${ep_id}/opportunities", payload: { scene_description: "Kitchen", start_timecode_seconds: 0, end_timecode_seconds: 40, estimated_exposure_seconds: 30 }, as: ProductionRep, as_user_id: "prod-1", captures: { opp_id: $.data.id } }
            - { call: "POST /episodes/${ep_id}/clearances", payload: { brand_id: "${b_id}", expected_episode_version: "${ep_v}" }, as: IntegrationManager, captures: { cl_id: $.data.id } }
            - { call: "POST /clearances/${cl_id}/decide", payload: { decision: "GRANT" }, as: ClearanceOfficer, as_user_id: "co-1" }
            - { call: "POST /proposals", payload: { brief_id: "${br_id}", opportunity_id: "${opp_id}", proposed_fee_cents: 1000000, guaranteed_seconds: 30, guaranteed_verbal_mentions: 2, cross_promo_owed_count: 0, rate_cents_per_second: 2000 }, as: IntegrationManager, captures: { p_id: $.data.id } }
            - { call: "POST /proposals/${p_id}/submit", as: IntegrationManager }
            - { call: "POST /proposals/${p_id}/production-decision", payload: { decision: "APPROVE" }, as: ProductionRep, as_user_id: "prod-2" }
            - { call: "POST /proposals/${p_id}/network-decision", payload: { decision: "APPROVE" }, as: NetworkStandardsReviewer, as_user_id: "nsr-1" }
            - { call: "POST /episodes/${ep_id}/lock", as: ProductionRep, as_user_id: "prod-1" }
            - { call: "POST /proposals/${p_id}/contract", as: IntegrationManager, captures: { ct_id: $.data.id } }
            - { call: "POST /contracts/${ct_id}/activate", as: IntegrationManager }
            - { call: "POST /contracts/${ct_id}/disclosures", payload: { disclosure_text: "Paid placement by FizzCo" }, as: IntegrationManager, captures: { d_id: $.data.id } }
            - { call: "POST /disclosures/${d_id}/file", as: IntegrationManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-02T00:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /episodes/${ep_id}/mark-aired", as: ProductionRep, as_user_id: "prod-1" }
            - { call: "POST /disclosures/${d_id}/acknowledge", as: NetworkStandardsReviewer, as_user_id: "nsr-1" }
            - { call: "POST /episodes/${ep_id}/airing-reports", payload: { contract_id: "${ct_id}", measured_segments_seconds: [15, 15], measured_verbal_mentions: 2 }, as: VerificationAnalyst, as_user_id: "ver-1", captures: { r_id: $.data.id } }
          trigger:
            - { call: "POST /airing-reports/${r_id}/verify", as: VerificationAnalyst, as_user_id: "ver-2" }
            - { call: "GET /contracts/${ct_id}", as: IntegrationManager, captures: { ct_status: $.data.status, ct_final: $.data.final_settlement_cents, ct_bonus: $.data.bonus_cents } }
            - { call: "GET /contracts/${ct_id}/makegood-credits", as: IntegrationManager, captures: { mg_count: $.data } }
          assert:
            - "captured ct_status == SETTLED (no makegood at exact equality)"
            - "captured ct_bonus == 0"
            - "captured ct_final == 1000000"
            - "GET makegood-credits returned an empty array (no MakeGoodCredit created at the 30 == 30 boundary)"
      - name: fee_equal_to_remaining_budget_allowed
        grounds:
          - calculations.brief_budget_remaining
          - validations[priority=11]
        distinguishing_aspect: |
          Metric cents via POST /proposals: a fee exactly equal to the brief's
          remaining budget (100000 == 100000) is accepted (<= boundary), and
          the next proposal at 20000 cents against remaining 0 is rejected with
          ERR_BUDGET_EXCEEDED — a different metric and endpoint from the
          exposure-seconds boundary.
        test_recipe:
          setup:
            - "Brand with OPEN brief budget 100000; STANDARD series; episode with opportunities [0,40) and [40,80)"
          setup_api_calls:
            - { call: "POST /brands", payload: { name: "FizzCo", category: "BEVERAGE" }, as: AgencyAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /brands/${b_id}/briefs", payload: { title: "Small push", objective: "trial", budget_cents: 100000 }, as: BrandRep, as_user_id: "${b_id}", captures: { br_id: $.data.id } }
            - { call: "POST /briefs/${br_id}/submit", as: BrandRep, as_user_id: "${b_id}" }
            - { call: "POST /series", payload: { name: "Night Shift", network_name: "NBN", clearance_policy: "STANDARD" }, as: AgencyAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /series/${s_id}/episodes", payload: { episode_number: 1, runtime_seconds: 1200, air_date: "2026-06-01T20:00:00Z" }, as: ProductionRep, as_user_id: "prod-1", captures: { ep_id: $.data.id } }
            - { call: "POST /episodes/${ep_id}/opportunities", payload: { scene_description: "Kitchen", start_timecode_seconds: 0, end_timecode_seconds: 40, estimated_exposure_seconds: 25 }, as: ProductionRep, as_user_id: "prod-1", captures: { opp1: $.data.id } }
            - { call: "POST /episodes/${ep_id}/opportunities", payload: { scene_description: "Garage", start_timecode_seconds: 40, end_timecode_seconds: 80, estimated_exposure_seconds: 20 }, as: ProductionRep, as_user_id: "prod-1", captures: { opp2: $.data.id } }
          trigger:
            - { call: "POST /proposals", payload: { brief_id: "${br_id}", opportunity_id: "${opp1}", proposed_fee_cents: 100000, guaranteed_seconds: 10, guaranteed_verbal_mentions: 0, cross_promo_owed_count: 0, rate_cents_per_second: 2000 }, as: IntegrationManager, captures: { p1_id: $.data.id, p1_status: $.data.status } }
            - { call: "POST /proposals", payload: { brief_id: "${br_id}", opportunity_id: "${opp2}", proposed_fee_cents: 20000, guaranteed_seconds: 10, guaranteed_verbal_mentions: 0, cross_promo_owed_count: 0, rate_cents_per_second: 2000 }, as: IntegrationManager, captures: { err: $.data.error_id } }
          assert:
            - "first proposal created: captured p1_status == DRAFT (fee 100000 == remaining 100000 allowed at the <= boundary)"
            - "captured err == ERR_BUDGET_EXCEEDED (remaining now 0; 20000 > 0 rejected; fee floor 10*2000 == 20000 passed first)"
            - "BrandBrief.${br_id}.remaining_budget_cents == 0"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (Contract->Episode and
  #           Clearance->Brand: different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: activation_requires_episode_locked
        grounds:
          - state_machines.IntegrationContract.PENDING_SIGNATURE_to_ACTIVE
          - validations[priority=8]
        distinguishing_aspect: |
          Pair Contract -> Episode: POST /contracts/{id}/activate is rejected
          with ERR_EPISODE_NOT_LOCKED while the contract's episode is still
          SCRIPT_REVIEW, and succeeds only after the episode locks — the
          contract's transition set is gated by a different entity's state.
        test_recipe:
          setup:
            - "Brand, OPEN brief 1000000, STANDARD series, episode SCRIPT_REVIEW (never locked), opportunity [0,40) est 25s, GRANTED clearance"
            - "Proposal approved by production and network; contract created (PENDING_SIGNATURE)"
          setup_api_calls:
            - { call: "POST /brands", payload: { name: "FizzCo", category: "BEVERAGE" }, as: AgencyAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /brands/${b_id}/briefs", payload: { title: "Summer fizz", objective: "awareness", budget_cents: 1000000 }, as: BrandRep, as_user_id: "${b_id}", captures: { br_id: $.data.id } }
            - { call: "POST /briefs/${br_id}/submit", as: BrandRep, as_user_id: "${b_id}" }
            - { call: "POST /series", payload: { name: "Night Shift", network_name: "NBN", clearance_policy: "STANDARD" }, as: AgencyAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /series/${s_id}/episodes", payload: { episode_number: 1, runtime_seconds: 1200, air_date: "2026-06-01T20:00:00Z" }, as: ProductionRep, as_user_id: "prod-1", captures: { ep_id: $.data.id, ep_v: $.data.version } }
            - { call: "POST /episodes/${ep_id}/opportunities", payload: { scene_description: "Kitchen", start_timecode_seconds: 0, end_timecode_seconds: 40, estimated_exposure_seconds: 25 }, as: ProductionRep, as_user_id: "prod-1", captures: { opp_id: $.data.id } }
            - { call: "POST /episodes/${ep_id}/clearances", payload: { brand_id: "${b_id}", expected_episode_version: "${ep_v}" }, as: IntegrationManager, captures: { cl_id: $.data.id } }
            - { call: "POST /clearances/${cl_id}/decide", payload: { decision: "GRANT" }, as: ClearanceOfficer, as_user_id: "co-1" }
            - { call: "POST /proposals", payload: { brief_id: "${br_id}", opportunity_id: "${opp_id}", proposed_fee_cents: 1000000, guaranteed_seconds: 30, guaranteed_verbal_mentions: 0, cross_promo_owed_count: 0, rate_cents_per_second: 2000 }, as: IntegrationManager, captures: { p_id: $.data.id } }
            - { call: "POST /proposals/${p_id}/submit", as: IntegrationManager }
            - { call: "POST /proposals/${p_id}/production-decision", payload: { decision: "APPROVE" }, as: ProductionRep, as_user_id: "prod-2" }
            - { call: "POST /proposals/${p_id}/network-decision", payload: { decision: "APPROVE" }, as: NetworkStandardsReviewer, as_user_id: "nsr-1" }
            - { call: "POST /proposals/${p_id}/contract", as: IntegrationManager, captures: { ct_id: $.data.id } }
          trigger:
            - { call: "POST /contracts/${ct_id}/activate", as: IntegrationManager, captures: { err: $.data.error_id } }
            - { call: "POST /episodes/${ep_id}/lock", as: ProductionRep, as_user_id: "prod-1" }
            - { call: "POST /contracts/${ct_id}/activate", as: IntegrationManager, captures: { ct_status: $.data.status } }
          assert:
            - "captured err == ERR_EPISODE_NOT_LOCKED (episode was SCRIPT_REVIEW)"
            - "after locking, captured ct_status == ACTIVE (same transition now legal)"
      - name: clearance_requires_brand_active
        grounds:
          - validations[priority=10]
          - state_machines.Brand.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Pair Clearance -> Brand: POST /episodes/{id}/clearances is rejected
          with ERR_BRAND_SUSPENDED when the referenced brand is SUSPENDED, and
          succeeds after resume — a different entity pair than
          Contract -> Episode.
        test_recipe:
          setup:
            - "Brand FizzCo BEVERAGE, suspended; STANDARD series with episode SCRIPT_REVIEW"
          setup_api_calls:
            - { call: "POST /brands", payload: { name: "FizzCo", category: "BEVERAGE" }, as: AgencyAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /brands/${b_id}/suspend", as: AgencyAdmin }
            - { call: "POST /series", payload: { name: "Night Shift", network_name: "NBN", clearance_policy: "STANDARD" }, as: AgencyAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /series/${s_id}/episodes", payload: { episode_number: 1, runtime_seconds: 1200, air_date: "2026-06-01T20:00:00Z" }, as: ProductionRep, as_user_id: "prod-1", captures: { ep_id: $.data.id, ep_v: $.data.version } }
          trigger:
            - { call: "POST /episodes/${ep_id}/clearances", payload: { brand_id: "${b_id}", expected_episode_version: "${ep_v}" }, as: IntegrationManager, captures: { err: $.data.error_id } }
            - { call: "POST /brands/${b_id}/resume", as: AgencyAdmin }
            - { call: "POST /episodes/${ep_id}/clearances", payload: { brand_id: "${b_id}", expected_episode_version: "${ep_v}" }, as: IntegrationManager, captures: { cl_status: $.data.status } }
          assert:
            - "captured err == ERR_BRAND_SUSPENDED"
            - "after resume, captured cl_status == REQUESTED"
            - "Brand.${b_id}.status == ACTIVE"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (half-open scene windows on
  #           ScriptOpportunity vs inclusive/exclusive air-date buffer windows
  #           on Episode: different interval semantics, different resources)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: scene_window_half_open_overlap
        grounds:
          - validations[priority=8]
          - entities.ScriptOpportunity.fields.start_timecode_seconds
        distinguishing_aspect: |
          Resource ScriptOpportunity scene window, half-open semantics:
          [0,40) and [40,80) touch at endpoint 40 and coexist, while [39,41)
          intersects [0,40) and is rejected — adjacency is allowed, strict
          intersection is not.
        test_recipe:
          setup:
            - "STANDARD series, episode runtime 1200 in SCRIPT_REVIEW, opportunity [0,40) IDENTIFIED"
          setup_api_calls:
            - { call: "POST /series", payload: { name: "Night Shift", network_name: "NBN", clearance_policy: "STANDARD" }, as: AgencyAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /series/${s_id}/episodes", payload: { episode_number: 1, runtime_seconds: 1200, air_date: "2026-06-01T20:00:00Z" }, as: ProductionRep, as_user_id: "prod-1", captures: { ep_id: $.data.id } }
            - { call: "POST /episodes/${ep_id}/opportunities", payload: { scene_description: "Kitchen", start_timecode_seconds: 0, end_timecode_seconds: 40, estimated_exposure_seconds: 20 }, as: ProductionRep, as_user_id: "prod-1", captures: { opp1: $.data.id } }
          trigger:
            - { call: "POST /episodes/${ep_id}/opportunities", payload: { scene_description: "Garage", start_timecode_seconds: 40, end_timecode_seconds: 80, estimated_exposure_seconds: 20 }, as: ProductionRep, as_user_id: "prod-1", captures: { opp2: $.data.id, opp2_status: $.data.status } }
            - { call: "POST /episodes/${ep_id}/opportunities", payload: { scene_description: "Hall", start_timecode_seconds: 39, end_timecode_seconds: 41, estimated_exposure_seconds: 2 }, as: ProductionRep, as_user_id: "prod-1", captures: { err: $.data.error_id } }
          assert:
            - "captured opp2_status == IDENTIFIED (touching at 40 is not an overlap)"
            - "captured err == ERR_SCENE_WINDOW_OVERLAP ([39,41) intersects [0,40) and [40,80))"
            - "GET /episodes/${ep_id}/opportunities returns exactly 2 rows"
      - name: airdate_strict_window_day7_conflict_day8_ok
        grounds:
          - validations[priority=9]
          - calculations.clearance_conflict_score
        distinguishing_aspect: |
          Resource Episode air-date with a 7-day buffer window (STRICT
          inclusive): a same-category GRANT 7 days after an existing GRANTED
          clearance is rejected while 8 days after is accepted — a
          buffer-window semantics distinct from the half-open scene-window
          adjacency rule.
        test_recipe:
          setup:
            - "Brand Snackly FOOD; STRICT series with episodes A (2026-06-01), B (2026-06-08, 7 days later), C (2026-06-09, 8 days later)"
            - "Clearance on A GRANTED"
          setup_api_calls:
            - { call: "POST /brands", payload: { name: "Snackly", category: "FOOD" }, as: AgencyAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /series", payload: { name: "Strict Show", network_name: "NBN", clearance_policy: "STRICT" }, as: AgencyAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /series/${s_id}/episodes", payload: { episode_number: 1, runtime_seconds: 1200, air_date: "2026-06-01T20:00:00Z" }, as: ProductionRep, as_user_id: "prod-1", captures: { ep_a: $.data.id, ep_a_v: $.data.version } }
            - { call: "POST /series/${s_id}/episodes", payload: { episode_number: 2, runtime_seconds: 1200, air_date: "2026-06-08T20:00:00Z" }, as: ProductionRep, as_user_id: "prod-1", captures: { ep_b: $.data.id, ep_b_v: $.data.version } }
            - { call: "POST /series/${s_id}/episodes", payload: { episode_number: 3, runtime_seconds: 1200, air_date: "2026-06-09T20:00:00Z" }, as: ProductionRep, as_user_id: "prod-1", captures: { ep_c: $.data.id, ep_c_v: $.data.version } }
            - { call: "POST /episodes/${ep_a}/clearances", payload: { brand_id: "${b_id}", expected_episode_version: "${ep_a_v}" }, as: IntegrationManager, captures: { cl_a: $.data.id } }
            - { call: "POST /clearances/${cl_a}/decide", payload: { decision: "GRANT" }, as: ClearanceOfficer, as_user_id: "co-1" }
            - { call: "POST /episodes/${ep_b}/clearances", payload: { brand_id: "${b_id}", expected_episode_version: "${ep_b_v}" }, as: IntegrationManager, captures: { cl_b: $.data.id } }
            - { call: "POST /episodes/${ep_c}/clearances", payload: { brand_id: "${b_id}", expected_episode_version: "${ep_c_v}" }, as: IntegrationManager, captures: { cl_c: $.data.id } }
          trigger:
            - { call: "POST /clearances/${cl_b}/decide", payload: { decision: "GRANT" }, as: ClearanceOfficer, as_user_id: "co-1", captures: { err_b: $.data.error_id } }
            - { call: "POST /clearances/${cl_c}/decide", payload: { decision: "GRANT" }, as: ClearanceOfficer, as_user_id: "co-1", captures: { status_c: $.data.status } }
          assert:
            - "captured err_b == ERR_AIRDATE_PROXIMITY_CONFLICT (|7| <= 7 within STRICT window)"
            - "captured status_c == GRANTED (|8| > 7 outside the window)"
            - "CompetitiveClearance.${cl_b}.status == REQUESTED (still undecided)"

  # ===========================================================================
  # Rule 9 — compensating_invariant (contract money in cents vs episode
  #           category slots: different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: makegood_waive_restores_outstanding_balance
        grounds:
          - state_machines.MakeGoodCredit.PENDING_to_WAIVED
          - state_machines.IntegrationContract.MAKEGOOD_REQUIRED_to_SETTLED
          - calculations.makegood_compensation
        distinguishing_aspect: |
          Conserved quantity: contract money in cents. The forward action
          (verify with shortfall debits outstanding by 35000) paired with its
          compensating action (waive credits it back) leaves
          outstanding_balance_cents == base_fee_cents + bonus_cents ==
          1000000 exactly — no drift.
        test_recipe:
          setup:
            - "Full chain to ACTIVE contract: fee 1000000, guaranteed 30s + 2 mentions, 0 promos, rate 2000; GRANTED clearance; disclosure ACKNOWLEDGED; episode AIRED; report segments [20], mentions 1"
            - "Invariant baseline: outstanding_balance_cents == 1000000 after activation"
          setup_api_calls:
            - { call: "POST /brands", payload: { name: "FizzCo", category: "BEVERAGE" }, as: AgencyAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /brands/${b_id}/briefs", payload: { title: "Summer fizz", objective: "awareness", budget_cents: 1000000 }, as: BrandRep, as_user_id: "${b_id}", captures: { br_id: $.data.id } }
            - { call: "POST /briefs/${br_id}/submit", as: BrandRep, as_user_id: "${b_id}" }
            - { call: "POST /series", payload: { name: "Night Shift", network_name: "NBN", clearance_policy: "STANDARD" }, as: AgencyAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /series/${s_id}/episodes", payload: { episode_number: 1, runtime_seconds: 1200, air_date: "2026-06-01T20:00:00Z" }, as: ProductionRep, as_user_id: "prod-1", captures: { ep_id: $.data.id, ep_v: $.data.version } }
            - { call: "POST /episodes/${ep_id}/opportunities", payload: { scene_description: "Kitchen", start_timecode_seconds: 0, end_timecode_seconds: 40, estimated_exposure_seconds: 25 }, as: ProductionRep, as_user_id: "prod-1", captures: { opp_id: $.data.id } }
            - { call: "POST /episodes/${ep_id}/clearances", payload: { brand_id: "${b_id}", expected_episode_version: "${ep_v}" }, as: IntegrationManager, captures: { cl_id: $.data.id } }
            - { call: "POST /clearances/${cl_id}/decide", payload: { decision: "GRANT" }, as: ClearanceOfficer, as_user_id: "co-1" }
            - { call: "POST /proposals", payload: { brief_id: "${br_id}", opportunity_id: "${opp_id}", proposed_fee_cents: 1000000, guaranteed_seconds: 30, guaranteed_verbal_mentions: 2, cross_promo_owed_count: 0, rate_cents_per_second: 2000 }, as: IntegrationManager, captures: { p_id: $.data.id } }
            - { call: "POST /proposals/${p_id}/submit", as: IntegrationManager }
            - { call: "POST /proposals/${p_id}/production-decision", payload: { decision: "APPROVE" }, as: ProductionRep, as_user_id: "prod-2" }
            - { call: "POST /proposals/${p_id}/network-decision", payload: { decision: "APPROVE" }, as: NetworkStandardsReviewer, as_user_id: "nsr-1" }
            - { call: "POST /episodes/${ep_id}/lock", as: ProductionRep, as_user_id: "prod-1" }
            - { call: "POST /proposals/${p_id}/contract", as: IntegrationManager, captures: { ct_id: $.data.id } }
            - { call: "POST /contracts/${ct_id}/activate", as: IntegrationManager, captures: { baseline: $.data.outstanding_balance_cents } }
            - { call: "POST /contracts/${ct_id}/disclosures", payload: { disclosure_text: "Paid placement by FizzCo" }, as: IntegrationManager, captures: { d_id: $.data.id } }
            - { call: "POST /disclosures/${d_id}/file", as: IntegrationManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-02T00:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /episodes/${ep_id}/mark-aired", as: ProductionRep, as_user_id: "prod-1" }
            - { call: "POST /disclosures/${d_id}/acknowledge", as: NetworkStandardsReviewer, as_user_id: "nsr-1" }
            - { call: "POST /episodes/${ep_id}/airing-reports", payload: { contract_id: "${ct_id}", measured_segments_seconds: [20], measured_verbal_mentions: 1 }, as: VerificationAnalyst, as_user_id: "ver-1", captures: { r_id: $.data.id } }
          trigger:
            - { call: "POST /airing-reports/${r_id}/verify", as: VerificationAnalyst, as_user_id: "ver-2" }
            - { call: "GET /contracts/${ct_id}/makegood-credits", as: IntegrationManager, captures: { mg_id: "$.data[0].id" } }
            - { call: "POST /makegood-credits/${mg_id}/waive", as: IntegrationManager }
            - { call: "GET /contracts/${ct_id}", as: IntegrationManager, captures: { ct_outstanding: $.data.outstanding_balance_cents, ct_status: $.data.status, ct_final: $.data.final_settlement_cents, ct_mg_total: $.data.makegood_total_cents } }
          assert:
            - "captured baseline == 1000000"
            - "captured ct_outstanding == 1000000 (verify debit 35000 fully compensated by waive; conserved)"
            - "captured ct_mg_total == 0"
            - "captured ct_status == SETTLED"
            - "captured ct_final == 1000000"
      - name: clearance_release_restores_category_slot
        grounds:
          - state_machines.CompetitiveClearance.REQUESTED_to_GRANTED
          - state_machines.CompetitiveClearance.GRANTED_to_RELEASED
          - validations[priority=8]
        distinguishing_aspect: |
          Conserved quantity: the per-(episode, category) exclusivity slot
          count. GRANT consumes the single slot; its compensating RELEASE
          returns the count of GRANTED clearances to 0, so a subsequent GRANT
          for the same category succeeds — a different conserved quantity from
          contract cents.
        test_recipe:
          setup:
            - "Brand FizzCo BEVERAGE; STANDARD series; episode SCRIPT_REVIEW"
          setup_api_calls:
            - { call: "POST /brands", payload: { name: "FizzCo", category: "BEVERAGE" }, as: AgencyAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /series", payload: { name: "Night Shift", network_name: "NBN", clearance_policy: "STANDARD" }, as: AgencyAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /series/${s_id}/episodes", payload: { episode_number: 1, runtime_seconds: 1200, air_date: "2026-06-01T20:00:00Z" }, as: ProductionRep, as_user_id: "prod-1", captures: { ep_id: $.data.id, ep_v: $.data.version } }
            - { call: "POST /episodes/${ep_id}/clearances", payload: { brand_id: "${b_id}", expected_episode_version: "${ep_v}" }, as: IntegrationManager, captures: { cl1: $.data.id } }
            - { call: "POST /clearances/${cl1}/decide", payload: { decision: "GRANT" }, as: ClearanceOfficer, as_user_id: "co-1", captures: { cl1_status: $.data.status } }
          trigger:
            - { call: "POST /clearances/${cl1}/release", as: ClearanceOfficer, as_user_id: "co-1", captures: { cl1_released: $.data.status } }
            - { call: "GET /episodes/${ep_id}", as: IntegrationManager, captures: { ep_v2: $.data.version } }
            - { call: "POST /episodes/${ep_id}/clearances", payload: { brand_id: "${b_id}", expected_episode_version: "${ep_v2}" }, as: IntegrationManager, captures: { cl2: $.data.id } }
            - { call: "POST /clearances/${cl2}/decide", payload: { decision: "GRANT" }, as: ClearanceOfficer, as_user_id: "co-1", captures: { cl2_status: $.data.status } }
          assert:
            - "captured cl1_status == GRANTED (slot consumed)"
            - "captured cl1_released == RELEASED (slot restored: count of GRANTED for (episode, BEVERAGE) back to 0)"
            - "captured cl2_status == GRANTED (re-grant succeeds only because release conserved the slot)"
