            - "hop 1: BusUnit.${legacy_1_id}.service_status == RECALL_OPEN and BusUnit.${legacy_2_id}.service_status == RECALL_OPEN, production_status still DELIVERED for both"
            - "hop 2: Dealer.${dealer_tx_id}.open_recall_unit_count == 2 and certification_standing == RESTRICTED (threshold 2)"
            - "hop 3: both RemedyTasks have escalation_level FACTORY_DIRECTED and RecallCampaign.${campaign_id}.escalated_task_count == 2"
            - "hop 4: each task's kits_reserved == 2 (1 base + 1 factory-escalation kit); campaign reserved_kits == 4, available_kits == 1, consumed_kits == 0, kit_shortfall_count == 0"
