              as: ComplianceOfficer
              captures: { certA: $.data.id }
            - call: "POST /brands"
              payload: { wholesaler_id: "${whA}", brand_name: "Rio Reserve", supplier_name: "Rio Supply Co", beverage_class: "SPIRITS", registration_effective_from: "2026-01-01T00:00:00Z", registration_expires_on: "2027-12-31T23:59:59Z" }
              as: FilingAgent
              as_user_id: "${agentA}"
              captures: { brandA: $.data.id }
            - call: "POST /brands/${brandA}/approve"
              as: ComplianceOfficer
            - call: "POST /price-schedules"
              payload: { wholesaler_id: "${whA}", state_program_id: "${prog}", posting_month: "2026-08" }
              as: FilingAgent
              as_user_id: "${agentA}"
              captures: { schedA: $.data.id }
            - call: "POST /price-schedule-items"
              payload: { schedule_id: "${schedA}", brand_id: "${brandA}", size_ml: 750, bottles_per_case: 12, case_price_cents: 120000, unit_price_cents: 11000 }
              as: FilingAgent
              as_user_id: "${agentA}"
              captures: { itemA: $.data.id }
            - call: "POST /price-schedules/${schedA}/submit"
              as: FilingAgent
              as_user_id: "${agentA}"
            - call: "POST /price-schedules/${schedA}/certify"
              as: CertifyingOfficer
              as_user_id: "${certA}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /posting-runs"
              payload: { state_program_id: "${prog}" }
              as: ComplianceOfficer
            - call: "POST /retailer-invoices"
              payload: { wholesaler_id: "${whA}", retailer_license_number: "R-500", invoice_date: "2026-09-05T00:00:00Z" }
              as: FilingAgent
              as_user_id: "${agentA}"
              captures: { inv: $.data.id }
            - call: "POST /invoice-lines"
              payload: { invoice_id: "${inv}", item_id: "${itemA}", cases_quantity: 2, case_price_charged_cents: 115000, unit_price_charged_cents: 11000 }
              as: FilingAgent
              as_user_id: "${agentA}"
              captures: { lineA: $.data.id }
            - call: "POST /retailer-invoices/${inv}/validate"
              as: FilingAgent
              as_user_id: "${agentA}"
            - call: "GET /wholesalers/${whA}"
