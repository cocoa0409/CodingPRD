          - errors[ERR_INVALID_APPLICATION_STATE]
        distinguishing_aspect: "submit exists from DRAFT and from RETURNED_FOR_CORRECTION only; replaying it on a SUBMITTED application returns ERR_INVALID_APPLICATION_STATE 409 and does not re-stamp prepared_by_user_id or bump the fee totals."
        test_recipe:
