                loan_amount_cents: 300000000
                note_rate: 0.0700
                funding_type: "DRY"
                payee_name: "Summit Title & Escrow"
                payee_account_last4: "4417"
                payee_routing_last4: "0021"
                expected_facility_version: "${fac_v_a3}"
              as: CollateralAnalyst
              as_user_id: "ca_1"
              captures: { a3b_id: "$.data.id" }
            - call: "POST /margin-calls"
              payload: { facility_id: "${fac_id}", trigger_reason: "COVENANT_BREACH" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { mcf2_id: "$.data.id", mcf2_amount: "$.data.call_amount_cents", mcf2_ver: "$.data.version" }
          trigger:
            - call: "POST /margin-calls/${mcf2_id}/cure-payments"
