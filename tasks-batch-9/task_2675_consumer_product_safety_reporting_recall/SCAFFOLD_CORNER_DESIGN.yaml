          The Incident machine allows the classify self-loop only from CLASSIFIED.
          Once analysis has swept a row into CLUSTERED — and again once a REPORTABLE
          determination has pushed it to ESCALATED — reclassification would silently
          change a severity_weight that a stored risk_index already depends on, so
