          assert:
            - "40.00 + 20.00 = 60.00 > field 50.00"
            - "err == ERR_LINE_ACRES_EXCEED_FIELD"

      - name: acreage_certify_segregation_of_duties
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "The specialist who filed a report may not also certify it (SoD); this exercises the SoD check distinct from the AGI/conservation gates."
