errors:
- id: ERR_UNAUTHENTICATED
  http: 401
  condition: Missing or malformed X-User-Role / X-User-ID headers
- id: ERR_FORBIDDEN_ROLE
  http: 403
  condition: Role not in endpoint's roles list
- id: ERR_IDENTITY_MISMATCH
  http: 403
  condition: Entity-backed role's X-User-ID does not resolve to an entity instance in scope (wrong org, wrong reseller, wrong user)
- id: ERR_NOT_FOUND
  http: 404
  condition: Path resource id does not exist
- id: ERR_REFERENCE_NOT_FOUND
  http: 404
  condition: Body-referenced FK id does not exist
- id: ERR_INVALID_REQUEST
  http: 400
  condition: Missing required field or malformed value
- id: ERR_INVALID_STATE
  http: 409
  condition: Target entity not in a state permitting the requested transition
- id: ERR_STALE_VERSION
  http: 412
  condition: expected_<parent>_version does not match the parent's current version
- id: ERR_ORG_FROZEN
  http: 409
  condition: Organization compliance_posture == FROZEN blocks the operation
- id: ERR_AUDIT_FREEZE
  http: 409
  condition: Asset purge blocked while org under audit
- id: ERR_SEGREGATION_OF_DUTIES
  http: 403
  condition: Approver equals requester/creator (segregation of duties violation)
- id: ERR_OFFLINE_ACTIVATION_NOT_ALLOWED
  http: 422
  condition: Offline activation requested on a plan that forbids it or on a non-SERIALIZED mode
- id: ERR_DEPLOYMENT_MODE_NOT_PERMITTED
  http: 422
  condition: deployment_mode not in plan.deployment_modes
- id: ERR_DUPLICATE_PLAN_SEAT
  http: 409
  condition: User already holds an ASSIGNED seat under the same plan in the org
- id: ERR_DEVICE_LIMIT_EXCEEDED
  http: 422
  condition: Seat already has plan.max_devices_per_seat ACTIVE device-entitlements
- id: ERR_CROSS_ORG_REFERENCE
  http: 422
  condition: Referenced user/asset belongs to a different organization
- id: ERR_RECLAIM_GRACE_ACTIVE
  http: 409
  condition: Reclaim finalize attempted before pending_reclaim_not_before
- id: ERR_TRANSFER_EXPIRED
  http: 409
  condition: TransferRequest approval attempted at/after expires_at
- id: ERR_DEADLINE_NOT_FUTURE
  http: 422
  condition: forced_upgrade_deadline not strictly in the future
- id: ERR_NO_AVAILABLE_VERSION
  http: 409
  condition: No AVAILABLE ProductVersion remains for the plan
- id: ERR_SEAT_CAPACITY_EXCEEDED
  http: 422
  condition: seats_assigned would exceed seats_purchased, or seats_purchased exceeds plan.seat_limit
- id: ERR_MONTHLY_NO_ETF
  http: 422
  condition: MONTHLY plan cancellation attempted outside the refund window
- id: ERR_NO_RESELLER_AVAILABLE
  http: 422
  condition: No ACTIVE reseller in the order's region
- id: ERR_RESELLER_SUSPENDED
  http: 409
  condition: Reseller not ACTIVE at activation/fulfillment
- id: ERR_SUBSCRIPTION_NOT_ACTIVE
  http: 409
  condition: Operation requires subscription.status == ACTIVE
- id: ERR_USER_NOT_ACTIVE
  http: 409
  condition: Target end user not ACTIVE
roles:
- name: SystemAdmin
  description: Platform operator; opaque identity; full override across orgs
  identity: opaque
  exclusive_operations:
  - create plans, product versions, resellers, organizations, admins
  - activate/settle subscriptions; finalize cancellations; execute transfers
  - deprecate/restore/force-upgrade product versions
  - open/raise/remediate/close compliance audits
  - cancel reseller orders; set logical clock
  shared_operations:
  - read any resource
  - create subscriptions and seats (OCC)
- name: OrgAdmin
  description: Organization administrator (SYSTEM_ADMIN or PRODUCT_ADMIN kind) scoped to their org
  identity: entity_backed:Admin
  exclusive_operations:
  - assign/reclaim seats in own org
  - initiate/approve/reject transfer requests in own org
  - request cancellations; manage add-ons; manage org assets
  - deactivate/reactivate/mark-departed end users in own org
  - approve/reject deployment packages in own org (different admin than creator)
  shared_operations:
  - read org-scoped resources
  - create end users and devices
- name: DeploymentAdmin
  description: Packaging administrator (DEPLOYMENT_ADMIN kind) scoped to their org
  identity: entity_backed:Admin
  exclusive_operations:
  - create/submit/publish/retire deployment packages in own org
  shared_operations:
  - read plans, product versions, org packages
- name: ResellerAgent
  description: Reseller operator; identity is the Reseller entity itself
  identity: entity_backed:Reseller
  exclusive_operations:
  - fulfill or reject orders routed to their reseller
  shared_operations:
  - read own orders and reseller record
- name: EndUser
  description: Licensed end user; identity is the EndUser entity
  identity: entity_backed:EndUser
  exclusive_operations:
  - activate own entitlements on own devices
  - accept asset transfers addressed to them
  - register own devices; consume add-on quota
  shared_operations:
  - read own record, devices, assets, entitlements
