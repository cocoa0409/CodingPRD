- rule_id: compensating_invariant
  instances:
  - name: abstraction_retraction_restores_report_ledger_without_drift
    grounds:
    - state_machines.QualityMeasureAbstraction FINALIZED/DRAFT -> RETRACTED (COMPENSATION side effect)
    - endpoints.POST /stroke-network/abstractions (auto-attach to the single in-period DRAFT report)
    - endpoints.POST /stroke-network/abstractions/{id}/retract
    - calculations.measure_compliance_rate PROVISIONAL variant
    - calculations.dtn_excess_reporting
    distinguishing_aspect: 'CONSERVED QUANTITY: the CertificationReport''s attached-abstraction ledger — included_abstraction_count together with the three published rate fields — which must return BIT-FOR-BIT to its pre-attachment values once the abstraction that perturbed it is retracted. PINNED FORMULA: for each reported measure m, denom = count of rows with report_id == report.id AND measure_code == m AND status IN {DRAFT, FINALIZED} AND denominator_included == true; numer = the same pool with numerator_flag == true; rate = 0.00 when denom == 0 else round(100.0 * numer / denom, 2); and included_abstraction_count = count of rows with report_id == report.id. Restoration must come from RECOMPUTING that formula over the remaining rows, not from subtracting a remembered delta, so a divide-by-zero-guard or a decrement-only implementation drifts. Two quantities are deliberately INVARIANT across the whole episode as controls: closed_case_count_in_period and mean_dtn_excess_pct.'
    test_recipe:
      setup:
      - Clock walked from 2026-09-01T08:00:00Z; hub, spoke, ACTIVE TIER_1_FULL agreement, one board-certified ON_CALL Neurologist with a GRANTED CONSULT_AND_THROMBOLYSIS credential.
      - 'Case A at the spoke: door_at 08:00:00Z, imaging 08:10:00Z, consult COMPLETED 08:24:00Z with a 240-second HD session, checklist ELIGIBLE, thrombolytic 08:50:00Z so door_to_needle_minutes is 50 (inside target).'
      - One STK_DTN_60 abstraction A1 created for case A at 08:52:00Z (while the case is still open, per priority 40), then case A is CLOSED at 08:55:00Z and A1 is FINALIZED at 08:57:00Z by a different user (segregation of duties).
      - 'Case B at the spoke: door_at 09:10:00Z, imaging 09:20:00Z, consult COMPLETED 09:29:00Z, checklist ELIGIBLE, thrombolytic 10:20:00Z so door_to_needle_minutes is 70 (a DTN_EXCEEDED MAJOR deviation is opened but never substantiated). Case B is deliberately LEFT OPEN in THROMBOLYSIS_ADMINISTERED.'
      - A CertificationReport is then created for the spoke covering [2026-09-01T00:00:00Z, 2026-10-01T00:00:00Z) at 10:30:00Z. Because only case A is CLOSED, the create attaches A1 only, and the baseline ledger is captured from the create response.
