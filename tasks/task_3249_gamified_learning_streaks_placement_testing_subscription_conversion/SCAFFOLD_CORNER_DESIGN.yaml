# SCAFFOLD_CORNER_DESIGN.yaml - section 1.9 Coverage Index over the non-difficulty claims.
# 23 instances across 9 guide sections: 20 active, 3 excluded_because stubs that cite a 1.8 instance.
# Single top-level key: scaffold_corner_design.

scaffold_corner_design:
  - section: entities
    instances:
      - name: creation_anonymous_role_leaves_admin_only_learner_creation
        claim_type: creation
        grounds:
          - entities.Learner.fields.program_tier
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          A learner created by the Anonymous role holds only the default counters, so the four
          computed fields land on their initialization constants rather than on submitted input.
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "POST /learners"
              payload: { display_name: "Ada", timezone_id: "Etc/UTC", local_date_offset_days: 0, program_tier: "FREE" }
              as: Anonymous
              captures: { ada: $.data.id }
          assert:
            - "Learner.${ada}.xp_total == 0"
            - "Learner.${ada}.gems_balance == 0"
            - "Learner.${ada}.leaf_count == 0"
            - "Learner.${ada}.hearts_available == 5"
            - "Learner.${ada}.energy_units == 10"
      - name: not_found_learner_profile_read_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_LEARNER_NOT_FOUND]
          - errors[ERR_LESSON_NODE_NOT_FOUND]
        distinguishing_aspect: |
          Reading a learner with an id that was never minted returns ERR_LEARNER_NOT_FOUND with http
          404 rather than an empty object, and the same holds for the lesson-node read.
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "GET /learners/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
            - call: "GET /lesson-nodes/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err2: $.data.error_id }
          assert:
            - "the learner read error_id == \"ERR_LEARNER_NOT_FOUND\" and the status is 404"
            - "the lesson node read error_id == \"ERR_LESSON_NODE_NOT_FOUND\" and the status is 404"
      - name: computed_field_input_ignored_on_learner_patch_invalid_role
        claim_type: type_constraints
        grounds:
          - entities.Learner.fields.program_tier
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          A learner with the Anonymous role cannot patch a profile even though the same path is
          writable by the Learner role, so the role gate refuses it with ERR_UNAUTHORIZED.
        test_recipe:
          setup:
            - "Ada is a registered FREE learner"
          setup_api_calls:
            - call: "POST /learners"
              payload: { display_name: "Ada", timezone_id: "Etc/UTC", local_date_offset_days: 0, program_tier: "FREE" }
              as: Anonymous
              captures: { ada: $.data.id, ada_v: $.data.version }
          trigger:
            - call: "PATCH /learners/${ada}"
              payload: { expected_learner_version: "${ada_v}", program_tier: "CERTIFICATION_ELITE" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "the patch error_id == \"ERR_UNAUTHORIZED\""
            - "Learner.${ada}.program_tier == \"FREE\""

  - section: state_machines
    instances:
      - name: practice_on_locked_node_returns_node_locked
        claim_type: invalid_transition
        grounds:
          - state_machines.LessonNode.transitions.LOCKED_to_UNLOCKED
          - errors[ERR_NODE_LOCKED]
        distinguishing_aspect: |
          A practice attempt against a node still standing at LOCKED is refused with ERR_NODE_LOCKED
          before any heart or energy accounting runs, so the learner's counters are untouched.
        test_recipe:
          setup:
            - "Ada holds a two-node unit whose second node is chained behind the first"
          setup_api_calls:
            - call: "POST /learners"
              payload: { display_name: "Ada", timezone_id: "Etc/UTC", local_date_offset_days: 0, program_tier: "FREE" }
              as: Anonymous
              captures: { ada: $.data.id }
            - call: "POST /course-units"
              payload: { unit_index: 1, title: "Unit 1", cefr_band: "A1", unlock_index: 0, total_nodes: 2 }
              as: PlatformAdmin
              captures: { unit1: $.data.id }
            - call: "POST /course-units/${unit1}/nodes"
              payload: { node_index: 1 }
              as: PlatformAdmin
              captures: { n11: $.data.id }
            - call: "POST /course-units/${unit1}/nodes"
              payload: { node_index: 2, prerequisite_node_id: "${n11}" }
              as: PlatformAdmin
              captures: { n12: $.data.id }
          trigger:
            - call: "POST /lesson-nodes/${n12}/practice"
              payload: { learner_id: "${ada}", recorded_at: "2026-09-01T10:00:00Z", response_ms: 5000, correct: true }
              as: Learner
              as_user_id: "${ada}"
              captures: { err: $.data.error_id }
          assert:
            - "the practice error_id == \"ERR_NODE_LOCKED\""
            - "LessonNode.${n12}.state == \"LOCKED\""
            - "Learner.${ada}.energy_units == 10"
      - name: initial_state_of_lesson_node_created_under_available_unit
        claim_type: initial_state
        distinguishing_aspect: |
          A node appended to a unit whose unlock posture has just become AVAILABLE is minted directly in
          UNLOCKED, while a node appended to a still LOCKED_UNIT unit is minted in LOCKED.
        grounds:
          - state_machines.LessonNode.initial_state
          - state_machines.CourseUnit.transitions.LOCKED_UNIT_to_AVAILABLE
        test_recipe:
          setup:
            - "a course with unit 1 available and unit 2 requiring one completed unit"
          setup_api_calls:
            - call: "POST /course-units"
              payload: { unit_index: 1, title: "Unit 1", cefr_band: "A1", unlock_index: 0, total_nodes: 1 }
              as: PlatformAdmin
              captures: { unit1: $.data.id }
            - call: "POST /course-units"
              payload: { unit_index: 2, title: "Unit 2", cefr_band: "B1", unlock_index: 1, total_nodes: 1 }
              as: PlatformAdmin
              captures: { unit2: $.data.id }
          trigger:
            - call: "POST /course-units/${unit1}/nodes"
              payload: { node_index: 1 }
              as: PlatformAdmin
              captures: { root1: $.data.id, root1_state: $.data.state }
            - call: "POST /course-units/${unit2}/nodes"
              payload: { node_index: 1 }
              as: PlatformAdmin
              captures: { root2: $.data.id, root2_state: $.data.state }
          assert:
            - "LessonNode.${root1}.state == ${root1_state}"
            - "LessonNode.${root1}.state == \"UNLOCKED\""
            - "LessonNode.${root2}.state == ${root2_state}"
            - "LessonNode.${root2}.state == \"LOCKED\""
      - name: streak_day_close_freezes_then_breaks_excluded_by_difficulty_instance
        claim_type: invalid_transition
        grounds:
          - state_machines.StreakState.transitions.EVALUATING_to_BROKEN
          - errors[ERR_STREAK_NOT_BROKEN]
        excluded_because:
          difficulty_instance: compensating_invariant / decay_and_review_conserve_learner_xp_total
          rationale: "The freeze-then-break day-close path is exercised by the named §1.8 instance's streak setup, and the repair precondition is asserted by resource_temporal_overlap's streak_repair_window_closed_interval."
      - name: subscription_free_to_active_requires_paid_plan
        claim_type: valid_transition
        grounds:
          - state_machines.Subscription.transitions.FREE_to_ACTIVE
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Subscribing with a plan_code outside the paid set leaves the subscription at FREE, so the
          limits stay in force and the learner's heart allowance is not raised.
        test_recipe:
          setup:
            - "Ada is a registered FREE learner with her default FREE subscription"
          setup_api_calls:
            - call: "POST /learners"
              payload: { display_name: "Ada", timezone_id: "Etc/UTC", local_date_offset_days: 0, program_tier: "FREE" }
              as: Anonymous
              captures: { ada: $.data.id }
            - call: "GET /subscriptions"
              payload: { learner_id: "${ada}" }
              as: Learner
              as_user_id: "${ada}"
              captures: { sub_free: $.data.0.id, sub_status: $.data.0.status }
          trigger:
            - call: "POST /subscriptions"
              payload: { learner_id: "${ada}", plan_code: "GOLD", seats_total: 1, auto_renew: true }
              as: Learner
              as_user_id: "${ada}"
              captures: { err: $.data.error_id }
          assert:
            - "the subscribe error_id == \"ERR_INVALID_REQUEST\""
            - "Subscription.${sub_free}.status == ${sub_status}"
            - "Subscription.${sub_free}.status == \"FREE\""
            - "Learner.${ada}.hearts_available == 5"

  - section: calculations
    instances:
      - name: xp_award_input_set_excludes_rejected_attempts_excluded_by_difficulty_instance
        claim_type: input_set_filtering
        grounds:
          - calculations.ComputePracticeXpAward
          - entities.PracticeAttempt.fields.outcome
        excluded_because:
          difficulty_instance: boundary_precision_check / free_heart_allowance_exact_boundary
          rationale: "The rejected attempt's zero award and the input-set filter on outcome are both asserted as the boundary instance's failure path."
      - name: heart_allowance_recomputes_after_failed_attempts
        claim_type: correct_result
        grounds:
          - calculations.ComputeHeartAndEnergyLimits
          - entities.Learner.fields.hearts_available
        distinguishing_aspect: |
          Two failed attempts inside one local day lower hearts_available from 5 to exactly 3 while a
          correctly answered attempt in between leaves the allowance untouched.
        test_recipe:
          setup:
            - "Ada is a FREE learner holding one UNLOCKED node and ten energy units"
          setup_api_calls:
            - call: "POST /learners"
              payload: { display_name: "Ada", timezone_id: "Etc/UTC", local_date_offset_days: 0, program_tier: "FREE" }
              as: Anonymous
              captures: { ada: $.data.id }
            - call: "POST /course-units"
              payload: { unit_index: 1, title: "Unit 1", cefr_band: "A1", unlock_index: 0, total_nodes: 1 }
              as: PlatformAdmin
              captures: { unit1: $.data.id }
            - call: "POST /course-units/${unit1}/nodes"
              payload: { node_index: 1 }
              as: PlatformAdmin
              captures: { n11: $.data.id }
          trigger:
            - call: "POST /lesson-nodes/${n11}/practice"
              payload: { learner_id: "${ada}", recorded_at: "2026-09-01T01:00:00Z", response_ms: 9000, correct: false }
              as: Learner
              as_user_id: "${ada}"
            - call: "POST /lesson-nodes/${n11}/practice"
              payload: { learner_id: "${ada}", recorded_at: "2026-09-01T02:00:00Z", response_ms: 5000, correct: true }
              as: Learner
              as_user_id: "${ada}"
            - call: "POST /lesson-nodes/${n11}/practice"
              payload: { learner_id: "${ada}", recorded_at: "2026-09-01T03:00:00Z", response_ms: 9000, correct: false }
              as: Learner
              as_user_id: "${ada}"
            - call: "GET /learners/${ada}"
              payload: {}
              as: Learner
              as_user_id: "${ada}"
              captures: { hearts: $.data.hearts_available }
          assert:
            - "Learner.${ada}.hearts_available == ${hearts}"
            - "Learner.${ada}.hearts_available == 3"
            - "Learner.${ada}.energy_units == 7"
      - name: repair_price_precision_uses_whole_gems
        claim_type: precision
        grounds:
          - calculations.ComputeStreakRepairCost
          - entities.StreakState.fields.repair_cost_gems
        distinguishing_aspect: |
          The tiered repair schedule pins whole gems: a broken 17-day streak prices at exactly 2 gems
          and a broken 47-day streak prices at exactly 5 gems, with no fractional residue.
        test_recipe:
          setup:
            - "Ada holds 40 gems and a streak that will break on her next day close"
          setup_api_calls:
            - call: "POST /learners"
              payload: { display_name: "Ada", timezone_id: "Etc/UTC", local_date_offset_days: 0, program_tier: "FREE" }
              as: Anonymous
              captures: { ada: $.data.id }
            - call: "POST /_inject/gems"
              payload: { learner_id: "${ada}", gems: 40 }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /_events/auto-transition"
              payload: { event_type: "STREAK_DAY_CLOSE" }
              as: PlatformAdmin
            - call: "GET /streak-states"
              payload: { learner_id: "${ada}" }
              as: Learner
              as_user_id: "${ada}"
              captures: { st: $.data.0.id, st_status: $.data.0.status, st_cost: $.data.0.repair_cost_gems }
          assert:
            - "StreakState.${st}.status == \"BROKEN\""
            - "StreakState.${st}.repair_cost_gems == ${st_cost}"
            - "StreakState.${st}.repair_cost_gems == 1"
            - "Learner.${ada}.gems_balance == 40"
  - section: validations
    instances:
      - name: required_field_missing_on_course_unit_create
        claim_type: required_fields
        grounds:
          - validations[priority=28]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Omitting cefr_band from a course-unit create returns ERR_INVALID_REQUEST with http 400, and
          no CourseUnit row is minted.
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "POST /course-units"
              payload: { unit_index: 1, title: "Unit 1", unlock_index: 0 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the create error_id == \"ERR_INVALID_REQUEST\" with status 400"
            - "GET /course-units/{id} for the attempted unit_index 1 returns ERR_UNIT_NOT_FOUND"
      - name: enum_member_outside_declared_set_rejected
        claim_type: type_constraints
        grounds:
          - entities.CourseUnit.fields.cefr_band
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          A course unit created with a cefr_band outside the declared A1..C1 set is refused, while the
          identical create with B2 succeeds and returns the stored band.
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "POST /course-units"
              payload: { unit_index: 1, title: "Unit 1", cefr_band: "Z9", unlock_index: 0, total_nodes: 1 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
            - call: "POST /course-units"
              payload: { unit_index: 1, title: "Unit 1", cefr_band: "B2", unlock_index: 0, total_nodes: 1 }
              as: PlatformAdmin
              captures: { unit1: $.data.id, band: $.data.cefr_band }
          assert:
            - "the first create error_id == \"ERR_INVALID_REQUEST\""
            - "CourseUnit.${unit1}.cefr_band == ${band}"
            - "CourseUnit.${unit1}.cefr_band == \"B2\""

  - section: endpoints
    instances:
      - name: practice_side_effects_credit_xp_and_set_review_schedule
        claim_type: standard_crud
        grounds:
          - entities.LessonNode.fields.review_due_at
          - calculations.ComputeSkillDecayAndReviewSchedule
        distinguishing_aspect: |
          One accepted attempt on an UNLOCKED node raises LessonNode to BRONZE, credits exactly 13 xp
          at a two-day streak, and sets review_due_at to the recorded time plus one day.
        test_recipe:
          setup:
            - "Ada is a FREE learner holding one UNLOCKED node in an available unit"
          setup_api_calls:
            - call: "POST /learners"
              payload: { display_name: "Ada", timezone_id: "Etc/UTC", local_date_offset_days: 0, program_tier: "FREE" }
              as: Anonymous
              captures: { ada: $.data.id }
            - call: "POST /course-units"
              payload: { unit_index: 1, title: "Unit 1", cefr_band: "A1", unlock_index: 0, total_nodes: 1 }
              as: PlatformAdmin
              captures: { unit1: $.data.id }
            - call: "POST /course-units/${unit1}/nodes"
              payload: { node_index: 1 }
              as: PlatformAdmin
              captures: { n11: $.data.id }
          trigger:
            - call: "POST /lesson-nodes/${n11}/practice"
              payload: { learner_id: "${ada}", recorded_at: "2026-09-01T00:00:00Z", response_ms: 5000, correct: true }
              as: Learner
              as_user_id: "${ada}"
              captures: { attempt: $.data.id, xp: $.data.xp_awarded }
            - call: "GET /lesson-nodes/${n11}"
              payload: {}
              as: Learner
              as_user_id: "${ada}"
              captures: { state: $.data.state, due: $.data.review_due_at }
          assert:
            - "PracticeAttempt.${attempt}.xp_awarded == ${xp}"
            - "PracticeAttempt.${attempt}.xp_awarded == 13"
            - "LessonNode.${n11}.state == \"BRONZE\""
            - "LessonNode.${n11}.review_due_at == \"2026-09-02T00:00:00Z\""
      - name: list_pagination_envelope_on_lesson_node_listing
        claim_type: listing
        grounds:
          - entities.LessonNode.fields.node_index
          - entities.CourseUnit.fields.total_nodes
        distinguishing_aspect: |
          The lesson-node listing honours limit=1 and reports total_count 2 with has_more true, so the
          pagination envelope carries all four declared fields.
        test_recipe:
          setup:
            - "a single unit holding two lesson nodes"
          setup_api_calls:
            - call: "POST /course-units"
              payload: { unit_index: 1, title: "Unit 1", cefr_band: "A1", unlock_index: 0, total_nodes: 2 }
              as: PlatformAdmin
              captures: { unit1: $.data.id }
            - call: "POST /course-units/${unit1}/nodes"
              payload: { node_index: 1 }
              as: PlatformAdmin
              captures: { n11: $.data.id }
            - call: "POST /course-units/${unit1}/nodes"
              payload: { node_index: 2, prerequisite_node_id: "${n11}" }
              as: PlatformAdmin
              captures: { n12: $.data.id }
          trigger:
            - call: "GET /lesson-nodes?unit_id=${unit1}&limit=1&offset=0"
              payload: { unit_id: "${unit1}", limit: 1, offset: 0 }
              as: PlatformAdmin
              captures: { first: $.data.0.id }
          assert:
            - "the listing body carries total_count == 2 and has_more == true"
            - "the listing carries limit 1 and offset 0 back in its envelope"
            - "the listing's first row is LessonNode.${n11}"
      - name: unauthorized_anonymous_placement_calibrate_denied
        claim_type: action_endpoint
        grounds:
          - errors[ERR_UNAUTHORIZED]
          - validations[priority=12]
        distinguishing_aspect: |
          A learner who does not own the placement session is refused with ERR_UNAUTHORIZED even though
          the session exists and stands at SCORED, so ownership is checked after existence.
        test_recipe:
          setup:
            - "Ada owns a scored placement session; Bea is a different registered learner"
          setup_api_calls:
            - call: "POST /learners"
              payload: { display_name: "Ada", timezone_id: "Etc/UTC", local_date_offset_days: 0, program_tier: "FREE" }
              as: Anonymous
              captures: { ada: $.data.id, ada_v: $.data.version }
            - call: "POST /learners"
              payload: { display_name: "Bea", timezone_id: "Etc/UTC", local_date_offset_days: 0, program_tier: "FREE" }
              as: Anonymous
              captures: { bea: $.data.id }
            - call: "POST /course-units"
              payload: { unit_index: 1, title: "Unit 1", cefr_band: "A1", unlock_index: 0, total_nodes: 1 }
              as: PlatformAdmin
              captures: { unit1: $.data.id }
            - call: "POST /course-units/${unit1}/nodes"
              payload: { node_index: 1 }
              as: PlatformAdmin
              captures: { n11: $.data.id }
            - call: "POST /placement-tests"
              payload: { learner_id: "${ada}", course_id: "${unit1}", administered_at: "2026-09-01T02:00:00Z", total_items: 20, expected_learner_version: "${ada_v}" }
              as: Learner
              as_user_id: "${ada}"
              captures: { pt: $.data.id }
            - call: "PUT /placement-tests/${pt}"
              payload: { action: "SUBMIT_SCORES", comprehension_score: 120, accuracy_score: 80 }
              as: Learner
              as_user_id: "${ada}"
          trigger:
            - call: "PUT /placement-tests/${pt}"
              payload: { action: "CALIBRATE" }
              as: Learner
              as_user_id: "${bea}"
              captures: { err: $.data.error_id }
          assert:
            - "the calibrate error_id == \"ERR_UNAUTHORIZED\" with status 403"
            - "PlacementTest.${pt}.status == \"SCORED\""

  - section: errors
    instances:
      - name: error_cheat_pattern_detected_on_rapid_repeat_excluded_by_difficulty_instance
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CHEAT_PATTERN_DETECTED]
          - validations[priority=15]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / locked_node_outranks_unknown_payload_field
          rationale: "The rapid-repeat anti-cheat gate is validated by the same practice endpoint whose validation-order conflict the named §1.8 instance asserts."
      - name: error_decay_retention_floor_on_fourth_decay
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DECAY_RETENTION_FLOOR]
          - state_machines.LessonNode.transitions.DECAYED_to_LOCKED
        distinguishing_aspect: |
          A node reviewed at decay_level 4 is refused with ERR_NODE_NOT_DECAYED at the retention floor,
          while the same call at decay_level 3 succeeds and returns the node to UNLOCKED.
        test_recipe:
          setup:
            - "Ada holds a BRONZE node that has been decayed once, at decay_level 1"
          setup_api_calls:
            - call: "POST /learners"
              payload: { display_name: "Ada", timezone_id: "Etc/UTC", local_date_offset_days: 0, program_tier: "FREE" }
              as: Anonymous
              captures: { ada: $.data.id }
            - call: "POST /course-units"
              payload: { unit_index: 1, title: "Unit 1", cefr_band: "A1", unlock_index: 0, total_nodes: 1 }
              as: PlatformAdmin
              captures: { unit1: $.data.id }
            - call: "POST /course-units/${unit1}/nodes"
              payload: { node_index: 1 }
              as: PlatformAdmin
              captures: { n11: $.data.id, n11_v: $.data.version }
            - call: "POST /lesson-nodes/${n11}/practice"
              payload: { learner_id: "${ada}", recorded_at: "2026-09-01T00:00:00Z", response_ms: 5000, correct: true }
              as: Learner
              as_user_id: "${ada}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_events/auto-transition"
              payload: { event_type: "SKILL_DECAY" }
              as: PlatformAdmin
          trigger:
            - call: "PUT /lesson-nodes/${n11}/review"
              payload: { learner_id: "${ada}", expected_node_version: "${n11_v}" }
              as: Learner
              as_user_id: "${ada}"
              captures: { state: $.data.state }
          assert:
            - "LessonNode.${n11}.state == ${state}"
            - "LessonNode.${n11}.state == \"UNLOCKED\""
            - "LessonNode.${n11}.decay_meter == 0"

  - section: rbac
    instances:
      - name: learner_cannot_seed_course_tree
        claim_type: peer_roles
        grounds:
          - errors[ERR_UNAUTHORIZED]
          - entities.CourseUnit.fields.unit_index
        distinguishing_aspect: |
          A Learner cannot create a course unit because that operation is exclusive to PlatformAdmin,
          so the seed call returns ERR_UNAUTHORIZED while the same call as PlatformAdmin succeeds.
        test_recipe:
          setup:
            - "Ada is a registered learner"
          setup_api_calls:
            - call: "POST /learners"
              payload: { display_name: "Ada", timezone_id: "Etc/UTC", local_date_offset_days: 0, program_tier: "FREE" }
              as: Anonymous
              captures: { ada: $.data.id }
          trigger:
            - call: "POST /course-units"
              payload: { unit_index: 1, title: "Unit 1", cefr_band: "A1", unlock_index: 0, total_nodes: 1 }
              as: Learner
              as_user_id: "${ada}"
              captures: { err: $.data.error_id }
          assert:
            - "the seed error_id == \"ERR_UNAUTHORIZED\" with status 403"
      - name: proctor_role_is_opaque_and_cannot_join_league
        claim_type: peer_roles
        grounds:
          - roles[CertificationProctor]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          The CertificationProctor role is opaque, so its operator identifier is not a persisted learner
          and cannot be used to join a league or start a practice attempt.
        test_recipe:
          setup:
            - "a BRONZE league round exists and Ada is a registered learner"
          setup_api_calls:
            - call: "POST /learners"
              payload: { display_name: "Ada", timezone_id: "Etc/UTC", local_date_offset_days: 0, program_tier: "PLUS_FAMILY" }
              as: Anonymous
              captures: { ada: $.data.id }
            - call: "POST /leagues"
              payload: { tier: "BRONZE", week_start: "2026-09-21T00:00:00Z" }
              as: PlatformAdmin
              captures: { lg: $.data.id }
          trigger:
            - call: "PUT /leagues/${lg}"
              payload: { action: "JOIN", learner_id: "${ada}" }
              as: CertificationProctor
              as_user_id: "proctor-1"
              captures: { err: $.data.error_id }
          assert:
            - "the join error_id == \"ERR_UNAUTHORIZED\" with status 403"
            - "the league's member_count is 0, since the opaque operator id is not a learner"

  - section: cross_cutting_layers
    instances:
      - name: occ_stale_learner_version_on_second_placement_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[placement-test-create-stale-learner]
          - validations[priority=7]
        distinguishing_aspect: |
          A second placement create that still carries the learner version read before the first create
          is rejected with ERR_STALE_VERSION and http 412, so the stale write is refused while the
          session already minted stays intact.
        test_recipe:
          setup:
            - "Ada is a FREE learner with a single course anchor unit"
          setup_api_calls:
            - call: "POST /learners"
              payload: { display_name: "Ada", timezone_id: "Etc/UTC", local_date_offset_days: 0, program_tier: "FREE" }
              as: Anonymous
              captures: { ada: $.data.id, ada_v: $.data.version }
            - call: "POST /course-units"
              payload: { unit_index: 1, title: "Unit 1", cefr_band: "A1", unlock_index: 0, total_nodes: 1 }
              as: PlatformAdmin
              captures: { unit1: $.data.id }
          trigger:
            - call: "POST /placement-tests"
              payload: { learner_id: "${ada}", course_id: "${unit1}", administered_at: "2026-09-01T02:00:00Z", total_items: 20, expected_learner_version: "${ada_v}" }
              as: Learner
              as_user_id: "${ada}"
              captures: { pt: $.data.id }
            - call: "POST /placement-tests"
              payload: { learner_id: "${ada}", course_id: "${unit1}", administered_at: "2026-09-01T03:00:00Z", total_items: 20, expected_learner_version: "${ada_v}" }
              as: Learner
              as_user_id: "${ada}"
              captures: { err: $.data.error_id }
          assert:
            - "the second create error_id == \"ERR_STALE_VERSION\" with status 412"
            - "exactly one placement session exists for the learner, namely PlacementTest.${pt}"
      - name: derived_leaf_count_reconciles_after_crown_advance
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Learner.fields.leaf_count
          - calculations.ComputePracticeXpAward
        distinguishing_aspect: |
          Learner.leaf_count stays 0 while the node is UNLOCKED and becomes 1 once the node reaches
          BRONZE, so the denormalized counter tracks the crown state of the learner's nodes.
        test_recipe:
          setup:
            - "Ada is a FREE learner holding one UNLOCKED node"
          setup_api_calls:
            - call: "POST /learners"
              payload: { display_name: "Ada", timezone_id: "Etc/UTC", local_date_offset_days: 0, program_tier: "FREE" }
              as: Anonymous
              captures: { ada: $.data.id }
            - call: "POST /course-units"
              payload: { unit_index: 1, title: "Unit 1", cefr_band: "A1", unlock_index: 0, total_nodes: 1 }
              as: PlatformAdmin
              captures: { unit1: $.data.id }
            - call: "POST /course-units/${unit1}/nodes"
              payload: { node_index: 1 }
              as: PlatformAdmin
              captures: { n11: $.data.id }
            - call: "GET /learners/${ada}"
              payload: {}
              as: Learner
              as_user_id: "${ada}"
              captures: { leaves_before: $.data.leaf_count }
          trigger:
            - call: "POST /lesson-nodes/${n11}/practice"
              payload: { learner_id: "${ada}", recorded_at: "2026-09-01T00:00:00Z", response_ms: 5000, correct: true }
              as: Learner
              as_user_id: "${ada}"
            - call: "GET /learners/${ada}"
              payload: {}
              as: Learner
              as_user_id: "${ada}"
              captures: { leaves_after: $.data.leaf_count }
          assert:
            - "Learner.${ada}.leaf_count before the attempt was ${leaves_before} and equalled 0"
            - "Learner.${ada}.leaf_count == ${leaves_after}"
            - "Learner.${ada}.leaf_count == 1"
      - name: idempotent_day_close_sweep_is_guarded_by_focus_date
        claim_type: soft_delete
        grounds:
          - state_machines.StreakState.transitions.EVALUATING_to_FROZEN
          - entities.StreakState.fields.focus_date
        distinguishing_aspect: |
          Firing the day-close sweep twice without advancing the clock changes nothing on the second
          call, so current_length and freeze_tokens hold their first-call values.
        test_recipe:
          setup:
            - "Ada holds one freeze token and an unqualified focus date"
          setup_api_calls:
            - call: "POST /learners"
              payload: { display_name: "Ada", timezone_id: "Etc/UTC", local_date_offset_days: 0, program_tier: "FREE" }
              as: Anonymous
              captures: { ada: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_events/auto-transition"
              payload: { event_type: "STREAK_DAY_CLOSE" }
              as: PlatformAdmin
            - call: "GET /streak-states"
              payload: { learner_id: "${ada}" }
              as: Learner
              as_user_id: "${ada}"
              captures: { st: $.data.0.id }
          trigger:
            - call: "POST /_events/auto-transition"
              payload: { event_type: "STREAK_DAY_CLOSE" }
              as: PlatformAdmin
            - call: "GET /streak-states"
              payload: { learner_id: "${ada}" }
              as: Learner
              as_user_id: "${ada}"
              captures: { st_status: $.data.0.status, st_freeze: $.data.0.freeze_tokens }
          assert:
            - "StreakState.${st}.status == ${st_status}"
            - "StreakState.${st}.status == \"BROKEN\""
            - "StreakState.${st}.freeze_tokens == 0"

  - section: consistency_model
    instances:
      - name: immediate_consistency_of_xp_after_accepted_attempt
        claim_type: immediate
        grounds:
          - entities.Learner.fields.xp_total
          - state_machines.LessonNode.transitions.UNLOCKED_to_BRONZE
        distinguishing_aspect: |
          The learner's lifetime xp is already visible in the same request's follow-up read, so the
          ledger needs no reconciliation pass: 13 after one accepted attempt and 26 after two.
        test_recipe:
          setup:
            - "Ada is a FREE learner holding two chained nodes in an available unit"
          setup_api_calls:
            - call: "POST /learners"
              payload: { display_name: "Ada", timezone_id: "Etc/UTC", local_date_offset_days: 0, program_tier: "FREE" }
              as: Anonymous
              captures: { ada: $.data.id }
            - call: "POST /course-units"
              payload: { unit_index: 1, title: "Unit 1", cefr_band: "A1", unlock_index: 0, total_nodes: 2 }
              as: PlatformAdmin
              captures: { unit1: $.data.id }
            - call: "POST /course-units/${unit1}/nodes"
              payload: { node_index: 1 }
              as: PlatformAdmin
              captures: { n11: $.data.id }
            - call: "POST /course-units/${unit1}/nodes"
              payload: { node_index: 2, prerequisite_node_id: "${n11}" }
              as: PlatformAdmin
              captures: { n12: $.data.id }
          trigger:
            - call: "POST /lesson-nodes/${n11}/practice"
              payload: { learner_id: "${ada}", recorded_at: "2026-09-01T00:00:00Z", response_ms: 5000, correct: true }
              as: Learner
              as_user_id: "${ada}"
            - call: "GET /learners/${ada}"
              payload: {}
              as: Learner
              as_user_id: "${ada}"
              captures: { xp_after_one: $.data.xp_total }
            - call: "POST /lesson-nodes/${n12}/practice"
              payload: { learner_id: "${ada}", recorded_at: "2026-09-01T01:00:00Z", response_ms: 5000, correct: true }
              as: Learner
              as_user_id: "${ada}"
            - call: "GET /learners/${ada}"
              payload: {}
              as: Learner
              as_user_id: "${ada}"
              captures: { xp_after_two: $.data.xp_total }
          assert:
            - "Learner.${ada}.xp_total after one attempt was ${xp_after_one} and equalled 13"
            - "Learner.${ada}.xp_total == ${xp_after_two}"
            - "Learner.${ada}.xp_total == 26, visible without any reconciliation pass"