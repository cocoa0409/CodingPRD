            - call: "POST /clearing/participants/${p_wn2}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /clearing/participants/${p_wo2}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /clearing/securities"
              payload: { ticker: "WNT1", cusip: "912828XV1", prev_settlement_price_cents: 5000 }
              as: PlatformAdmin
              captures: { sec_wnt: $.data.id }
            - call: "POST /clearing/settlement-windows"
              payload: { security_id: "${sec_wnt}", settlement_date: "2026-09-10", trade_entry_deadline: "2026-09-09T20:00:00Z", affirmation_deadline: "2026-09-09T22:00:00Z" }
              as: PlatformAdmin
              captures: { win_wnt: $.data.id }
            - call: "POST /clearing/trade-submissions"
              payload: { counterparty_participant_id: "${p_wo2}", security_id: "${sec_wnt}", side: "BUY", quantity: 100, trade_price_cents: 4000, trade_date: "2026-09-08T14:00:00Z" }
              as: ClearingMember
              as_user_id: "${p_wn2}"
              captures: { t_wnt: $.data.id }
            - call: "POST /clearing/trade-submissions/${t_wnt}/lock-in"
              payload: {}
              as: ClearingMember
              as_user_id: "${p_wn2}"
            - call: "POST /clearing/settlement-windows/${win_wnt}/net"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /clearing/trade-submissions/${t_wnt}/unmatch"
              payload: {}
              as: PlatformAdmin
              captures: { err_wnt: $.data.error_id }
          assert:
            - "the response status is 409 and data.error_id == ERR_WINDOW_ALREADY_NETTED"
            - "GET /clearing/trade-submissions/${t_wnt} still reports lock_status == LOCKED_IN"

      - name: zero_amount_funding_rejected
        claim_type: Violation → Error
        grounds:
          - errors[ERR_INVALID_AMOUNT]
          - validations[priority=19]
        distinguishing_aspect: "A funding posting of zero is refused with 422 ERR_INVALID_AMOUNT, while the same endpoint accepts a zero amount when mark_to_market_only is true, so the sign rule is scoped to the funding leg."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-05T00:00:00Z. Participants ZA2 and ZB2 are ACTIVE; Security ZER1 has a NETTED window for 2026-09-10 with ZA2 owing 400000 cents."
          setup_api_calls:
            - call: "POST /clearing/_clock/set_current_utc"
