      - name: posting_ledger_replays_after_the_clock_moves_and_after_a_withdrawal
        claim_type: projection
        grounds:
          - calculations.posting_obligation_status
          - entities.DisposalUnit.fields.overdue_posting_types
          - entities.DisposalUnit.fields.late_posting_count
          - entities.PublicPosting.fields.days_late
          - entities.PublicPosting.fields.satisfied_obligation
        distinguishing_aspect: |
          The obligation ledger is a projection over three kinds of event: an obligation opening, the clock
          crossing its due date, and a posting arriving or being withdrawn. The same unit must read
          overdue == [] before the clock moves, [STABILITY_ASSESSMENT] after it, [] again once the late
          posting lands, and [STABILITY_ASSESSMENT] once more after the withdrawal — a stored flag set at
          posting time never returns to the overdue state. The ANNUAL_GW_REPORT posting carries no due
          date, so it must count as neither satisfied nor late.
        test_recipe:
          setup:
            - "One clean unit with an ADEQUATE stability assessment dated 2026-07-15 (stability_posting_due_date 2026-08-14)"
          setup_api_calls:
            - call: "POST /ccr/professionals"
              payload: { full_name: "Dana Reyes", license_number: "PE-11001", license_state: "NC", discipline: "GEOTECHNICAL" }
              as: UtilityAdmin
              captures: { pe_geo_id: $.data.id }
            - call: "POST /ccr/units"
              payload: { unit_code: "IMP-0131", unit_name: "Ash Pond 131", unit_type: "SURFACE_IMPOUNDMENT", plant_code: "PLNT01", liner_class: "COMPOSITE_LINED", hazard_potential_class: "SIGNIFICANT", original_ash_in_place_tons: 480000, cessation_date: "2026-03-31", uppermost_aquifer_separation_ft: 12.50, wetland_distance_ft: 2000.00, seismic_pga_g: 0.050, fault_distance_ft: 1200.00, unstable_area_flag: false }
              as: UtilityAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /ccr/stability-assessments"
              payload: { unit_id: "${unit_id}", assessed_on: "2026-07-15", factor_of_safety_static: 1.60, factor_of_safety_seismic: 1.10, factor_of_safety_liquefaction: 1.30 }
              as: ProfessionalEngineer
              as_user_id: "${pe_geo_id}"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: UtilityAdmin
              captures: { clock_now: $.data.current_utc }
            - call: "POST /ccr/public-postings"
              payload: { unit_id: "${unit_id}", posting_type: "STABILITY_ASSESSMENT", posted_on: "2026-08-20", document_uri: "https://utility.example.com/ccr/imp-0131/stability-2026.pdf", document_sha256: "a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1" }
              as: ComplianceOfficer
              captures: { stab_posting_id: $.data.id }
            - call: "POST /ccr/public-postings"
              payload: { unit_id: "${unit_id}", posting_type: "ANNUAL_GW_REPORT", posted_on: "2026-08-20", document_uri: "https://utility.example.com/ccr/imp-0131/annual-gw-2025.pdf", document_sha256: "c4b2c4b2c4b2c4b2c4b2c4b2c4b2c4b2c4b2c4b2c4b2c4b2c4b2c4b2c4b2c4b2" }
              as: ComplianceOfficer
              captures: { annual_posting_id: $.data.id }
            - call: "POST /ccr/public-postings/${stab_posting_id}/withdraw"
              payload: { withdrawn_on: "2026-08-21", withdrawal_reason: "Wrong revision of the stability certification was attached" }
              as: ComplianceOfficer
          assert:
            - "before the triggers: DisposalUnit.${unit_id}.overdue_posting_types == [], late_posting_count == 0 and compliance_posture == WATCH"
            - "after trigger call 1: DisposalUnit.${unit_id}.overdue_posting_types == [STABILITY_ASSESSMENT] and compliance_posture == FROZEN"
            - "after trigger call 2: PublicPosting.${stab_posting_id}.satisfied_obligation == true and days_late == 6"
            - "after trigger call 2: DisposalUnit.${unit_id}.overdue_posting_types == [], late_posting_count == 1 and compliance_posture == COMPLIANT"
            - "after trigger call 3: PublicPosting.${annual_posting_id}.satisfied_obligation == false and days_late == 0 because ANNUAL_GW_REPORT carries no due date"
            - "after trigger call 3: DisposalUnit.${unit_id}.late_posting_count is still 1, not 2"
            - "after trigger call 4: PublicPosting.${stab_posting_id}.status == WITHDRAWN with satisfied_obligation == false and days_late == 0"
            - "after trigger call 4: DisposalUnit.${unit_id}.overdue_posting_types == [STABILITY_ASSESSMENT], late_posting_count == 0 and compliance_posture == FROZEN again"

      - name: posture_precedence_puts_frozen_above_restricted_and_propagates_both_ways
        claim_type: constraint_propagation
        grounds:
          - calculations.compliance_posture
          - calculations.location_restriction_verdict
          - calculations.posting_obligation_status
          - entities.DisposalUnit.fields.compliance_posture
        distinguishing_aspect: |
          One unit holds a permanent RESTRICTED cause (a DISQUALIFIED siting verdict) and acquires a
          temporary FROZEN cause (an overdue posting). While both hold, the answer must be FROZEN, not
          RESTRICTED and not a merged value; when only the FROZEN cause is cleared the answer must fall
          back to RESTRICTED rather than to COMPLIANT. The chain reaches a fixed point after one pass —
          clearing the posting must not also clear the siting verdict.
        test_recipe:
          setup:
            - "One DISQUALIFIED unit (unstable_area_flag true) with an ADEQUATE stability assessment dated 2026-07-15"
          setup_api_calls:
            - call: "POST /ccr/professionals"
              payload: { full_name: "Dana Reyes", license_number: "PE-11001", license_state: "NC", discipline: "GEOTECHNICAL" }
              as: UtilityAdmin
              captures: { pe_geo_id: $.data.id }
            - call: "POST /ccr/units"
              payload: { unit_code: "IMP-0132", unit_name: "Ash Pond 132", unit_type: "SURFACE_IMPOUNDMENT", plant_code: "PLNT01", liner_class: "COMPOSITE_LINED", hazard_potential_class: "SIGNIFICANT", original_ash_in_place_tons: 480000, cessation_date: "2026-03-31", uppermost_aquifer_separation_ft: 12.50, wetland_distance_ft: 2000.00, seismic_pga_g: 0.050, fault_distance_ft: 1200.00, unstable_area_flag: true }
              as: UtilityAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /ccr/stability-assessments"
              payload: { unit_id: "${unit_id}", assessed_on: "2026-07-15", factor_of_safety_static: 1.60, factor_of_safety_seismic: 1.10, factor_of_safety_liquefaction: 1.30 }
              as: ProfessionalEngineer
              as_user_id: "${pe_geo_id}"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: UtilityAdmin
              captures: { clock_now: $.data.current_utc }
            - call: "POST /ccr/public-postings"
              payload: { unit_id: "${unit_id}", posting_type: "STABILITY_ASSESSMENT", posted_on: "2026-08-20", document_uri: "https://utility.example.com/ccr/imp-0132/stability-2026.pdf", document_sha256: "7e907e907e907e907e907e907e907e907e907e907e907e907e907e907e907e90" }
              as: ComplianceOfficer
              captures: { posting_id: $.data.id }
          assert:
            - "at creation: DisposalUnit.${unit_id}.location_restriction_verdict == DISQUALIFIED and compliance_posture == RESTRICTED"
            - "before the triggers the unit also has a pending posting obligation due 2026-08-14, and the posture is still RESTRICTED — RESTRICTED outranks WATCH"
            - "after trigger call 1: DisposalUnit.${unit_id}.overdue_posting_types == [STABILITY_ASSESSMENT] and compliance_posture == FROZEN — FROZEN outranks RESTRICTED"
            - "after trigger call 2: DisposalUnit.${unit_id}.overdue_posting_types == [] and compliance_posture == RESTRICTED, not COMPLIANT"
            - "DisposalUnit.${unit_id}.location_restriction_verdict is still DISQUALIFIED and demonstration_required is still false after both triggers"
            - "DisposalUnit.${unit_id}.governing_stability_verdict is ADEQUATE throughout, so the FROZEN reading came from the posting ledger alone"

      - name: per_year_rounding_of_the_care_stream
        claim_type: precision
        grounds:
          - calculations.closure_cost_present_value
        excluded_because:
          difficulty_instance: care_stream_pv_rounds_each_year_before_summation
          rationale: "That instance pins the rounding order with a plan whose per-year and post-summation roundings differ, and asserts the exact cent totals for both methods."

      - name: class_f_spec_boundary
        claim_type: threshold
        grounds:
          - calculations.ash_quality_and_reuse_score
        excluded_because:
          difficulty_instance: loi_exactly_six_percent_meets_class_f_and_six_point_zero_one_fails
          rationale: "That instance walks the LOI limit at exactly 6.00 and at 6.01 and shows the second is refused at qualification, which is the threshold-1 / threshold / threshold+1 walk for this calculation."

      - name: running_ash_total_after_add_and_reversal
        claim_type: aggregation
        grounds:
          - calculations.ash_in_place_balance
        excluded_because:
          difficulty_instance: shipment_return_restores_the_ash_inventory_and_the_agreement_ledger_exactly
          rationale: "That instance asserts the running total after two additions and after a reversal, and that ash_mass_balance_ok holds at every step."

      - name: assurance_tier_boundaries
        claim_type: tiered_pricing
        grounds:
          - calculations.corrective_action_assurance_amount
        excluded_because:
          difficulty_instance: assurance_contingency_tier_keyed_on_base_not_on_total
          rationale: "That instance sits a base cost just under a tier ceiling so that the subtotal crosses into the next band, and asserts the tier is keyed on the base alone."

      - name: touching_commitment_windows_are_treated_as_overlapping
        claim_type: interval_merge
