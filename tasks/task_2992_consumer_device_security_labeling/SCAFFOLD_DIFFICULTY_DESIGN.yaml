              captures: { grant_casc_id: $.data.id }
            - call: "POST /labeling/label-grants/${grant_casc_id}/registry-entry"
              payload: { update_policy_url: "https://northwind.example/updates/spk-s1", update_cadence: "AUTOMATIC", vuln_disclosure_contact: "security@northwind.example" }
              as: Manufacturer
              as_user_id: "${mfr_small_id}"
            - call: "POST /labeling/label-grants/${grant_casc_id}/registry-publication"
              payload: { publication_decision: "PUBLISHED", publication_note: "Registry disclosure complete." }
              as: ConformityReviewer
              as_user_id: "reviewer-2"
            - call: "POST /labeling/display-authorizations"
              payload: { retailer_id: "${retailer_id}", label_grant_id: "${grant_casc_id}", channel: "IN_STORE", display_from: "2026-08-10T00:00:00Z", display_until: "2026-09-10T00:00:00Z" }
              as: Retailer
              as_user_id: "${retailer_id}"
              captures: { auth_store_id: $.data.id }
            - call: "POST /labeling/display-authorizations"
              payload: { retailer_id: "${retailer_id}", label_grant_id: "${grant_casc_id}", channel: "ONLINE", display_from: "2026-08-10T00:00:00Z", display_until: "2026-09-10T00:00:00Z" }
              as: Retailer
              as_user_id: "${retailer_id}"
              captures: { auth_online_id: $.data.id }
            - call: "GET /labeling/products/${prod_speaker_id}"
              as: Manufacturer
              as_user_id: "${mfr_small_id}"
              captures: { prod_speaker_v2: $.data.version }
          trigger:
            - call: "POST /labeling/products/${prod_speaker_id}/spec-changes"
              payload: { expected_product_version: "${prod_speaker_v2}", change_summary: "Firmware 1.1.0 replaces the authentication stack.", firmware_version: "1.1.0" }
              as: Manufacturer
              as_user_id: "${mfr_small_id}"
          assert:
            - "Product.${prod_speaker_id}.spec_revision == 1"
            - "Product.${prod_speaker_id}.conformance_currency == STALE"
            - "Product.${prod_speaker_id}.firmware_version == 1.1.0"
            - "LabelGrant.${grant_casc_id}.grant_status == SUSPENDED"
            - "LabelGrant.${grant_casc_id}.suspension_reason == PRODUCT_SPEC_CHANGED"
            - "LabelGrant.${grant_casc_id}.renewal_required == true"
            - "RetailerDisplayAuthorization.${auth_store_id}.status == WITHDRAWN with withdrawal_reason == GRANT_SUSPENDED"
            - "RetailerDisplayAuthorization.${auth_online_id}.status == WITHDRAWN with withdrawal_reason == GRANT_SUSPENDED"
            - "Retailer.${retailer_id}.active_display_count == 0"
            - "Retailer.${retailer_id}.participation_tier == BASELINE, down from GOLD"
            - "LabelGrant.${grant_casc_id}.registry_publication_status is still PUBLISHED (the spec change does not touch the publication dimension)"

      - name: upheld_adjudication_delinquency_suspends_all_manufacturer_grants
        depth: 3
        grounds:
          - state_machines.EnforcementCase.transitions.NOTICE_ISSUED_to_ADJUDICATED_UPHELD
          - calculations.manufacturer_penalty_ledger
          - state_machines.LabelGrant.transitions.ACTIVE_to_SUSPENDED_on_sponsor_delinquency
          - state_machines.RetailerDisplayAuthorization.transitions.AUTHORIZED_to_WITHDRAWN_on_grant_cascade
          - entities.Manufacturer.fields.standing
        chain:
          - "LINK 1: adjudicating the case UPHELD assesses 28980 cents and recomputes the subject's ledger to outstanding_penalty_cents 28980, total_assessed_penalty_cents 28980, upheld_case_count 1."
          - "LINK 2: caused by link 1 — standing is re-derived and becomes DELINQUENT because 28980 >= DELINQUENCY_THRESHOLD_CENTS 25000."
          - "LINK 3: caused by link 2 — every ACTIVE LabelGrant of every Product of the subject moves to SUSPENDED with suspension_reason SPONSOR_DELINQUENT and renewal_required false, whose own cascade withdraws the retailer's AUTHORIZED display authorization and re-derives the retailer's participation tier."
        distinguishing_aspect: |
          A different trigger family (enforcement adjudication rather than a product edit) and a
          different first hop: the cascade starts from a MONEY ledger threshold, so link 3 fires only
          because the recomputed outstanding balance crossed 25000 — an unauthorized-display case of
          five IN_STORE units (24150) would stop after link 1 with grants untouched, and the
          suspension_reason differs from the spec-change path (SPONSOR_DELINQUENT, renewal_required false).
