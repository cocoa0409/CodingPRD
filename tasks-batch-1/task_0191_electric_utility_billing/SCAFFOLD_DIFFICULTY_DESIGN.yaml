            - "at clock 2026-02-15 (45 days): Account.${acct_id}.financial_status == IN_ARREARS"

      - name: empty_period_bill_zero_consumption_floors_to_fixed
        grounds:
          - calculations.price_bill
          - entities.Bill.fields.total_import_kwh
          - entities.Bill.fields.energy_charge_cents
          - entities.Bill.fields.total_due_cents
        distinguishing_aspect: |
          Empty-set boundary on a DIFFERENT metric/endpoint (POST /bills/{id}/issue): a billing period
          with ZERO reads yields total_import_kwh == 0, energy_charge_cents == 0, demand == 0, and
          total_due_cents == fixed_charge (1000). The TOU-share denominator is guarded against div-by-zero.
        test_recipe:
