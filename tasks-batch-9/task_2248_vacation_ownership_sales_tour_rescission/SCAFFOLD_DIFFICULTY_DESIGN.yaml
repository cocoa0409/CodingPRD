          the one carrying postmark_utc 2026-08-24T12:00:00Z selects the postmark_rule
          variant and reaches VALIDATED, the one omitting postmark_utc falls back to the
          receipt_rule variant and reaches REJECTED_LATE; this instance owns the
          BASIS-SELECTION variant axis, and the divergence is a state outcome, not an amount.
