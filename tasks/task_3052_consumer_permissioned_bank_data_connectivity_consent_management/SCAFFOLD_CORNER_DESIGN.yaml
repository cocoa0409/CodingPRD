              captures: { rec_id: $.data.id }
          trigger:
            - call: "POST /recipients/${rec_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceReviewer
              as_user_id: same_user
              captures: { err: $.data.error_id }
          assert:
            - "http status == 422 and error_id == ERR_SOD_VIOLATION"
            - "Recipient.${rec_id}.status remains PENDING_REVIEW"

      - name: agreement_scope_not_permitted_on_connection_create
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - errors[ERR_AGREEMENT_SCOPE_NOT_PERMITTED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / dependency_connection_create_requires_consent_active
          rationale: "Connection-creation gating on referenced-entity state is exercised there; this stub avoids duplicating the connection-create gate family. The agreement-scope variant is additionally covered by corner instance agreement_scope_mismatch_rejected below."

      - name: agreement_scope_mismatch_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=10]
          - calculations.consent_scope_coverage
        distinguishing_aspect: "A consent whose scopes are legal for the recipient/tier but absent from the ACTIVE agreement's permitted_fields_by_scope keys blocks connection creation with ERR_AGREEMENT_SCOPE_NOT_PERMITTED."
        test_recipe:
          setup: ["Agreement permits only BALANCE; consent carries [TRANSACTIONS] which tier and policy allow"]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "ScopeGate Bank", supported_methods: ["CREDENTIALS"], target_method: "CREDENTIALS", migration_window_start: "2026-09-10T00:00:00Z", migration_window_end: "2026-10-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { inst_id: $.data.id, inst_v: $.data.version }
            - call: "POST /institutions/${inst_id}/agreements"
              payload: { rate_limit_per_hour: 100, permitted_fields_by_scope: { BALANCE: ["current_cents"] }, expected_institution_version: "${inst_v}" }
              as: PlatformAdmin
            - call: "POST /recipients"
              payload: { name: "ScopeApp", declared_use_case: "scope gate", minimization_policy: "BROAD" }
              as: PlatformAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /recipients/${rec_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceReviewer
              as_user_id: reviewer_1
            - call: "POST /tiers"
              payload: { tier_name: "ScopeTier", scopes_included: ["TRANSACTIONS"], rate_class: "HIGH" }
              as: PlatformAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /recipients/${rec_id}/tier_assignments"
              payload: { tier_id: "${tier_id}" }
              as: PlatformAdmin
            - call: "GET /recipients/${rec_id}"
              as: PlatformAdmin
              captures: { rec_id_v: $.data.version }
            - call: "POST /recipients/${rec_id}/consents"
              payload: { consumer_ref: "cons_ab", data_scopes: ["TRANSACTIONS"], expires_at: "2026-12-31T00:00:00Z", expected_recipient_version: "${rec_id_v}" }
              as: Consumer
              as_user_id: cons_ab
              captures: { consent_id: $.data.id }
          trigger:
            - call: "POST /institutions/${inst_id}/connections"
              payload: { consumer_ref: "cons_ab", consent_id: "${consent_id}", method: "CREDENTIALS" }
              as: Consumer
              as_user_id: cons_ab
              captures: { err: $.data.error_id }
          assert:
            - "http status == 422 and error_id == ERR_AGREEMENT_SCOPE_NOT_PERMITTED"
            - "GET /institutions/${inst_id}/connections returns an empty list"

      - name: method_not_supported_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=16]
          - errors[ERR_METHOD_NOT_SUPPORTED]
        distinguishing_aspect: "Connection method must be a member of institution.supported_methods: requesting OAUTH_TOKEN at a CREDENTIALS-only institution fails with ERR_METHOD_NOT_SUPPORTED."
        test_recipe:
          setup: ["Institution supporting only CREDENTIALS; valid consent/tier/agreement stack"]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "CredOnly Bank", supported_methods: ["CREDENTIALS"], target_method: "CREDENTIALS", migration_window_start: "2026-09-10T00:00:00Z", migration_window_end: "2026-10-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { inst_id: $.data.id, inst_v: $.data.version }
            - call: "POST /institutions/${inst_id}/agreements"
              payload: { rate_limit_per_hour: 100, permitted_fields_by_scope: { BALANCE: ["current_cents"] }, expected_institution_version: "${inst_v}" }
              as: PlatformAdmin
            - call: "POST /recipients"
              payload: { name: "MethodApp", declared_use_case: "method gate", minimization_policy: "BROAD" }
              as: PlatformAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /recipients/${rec_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceReviewer
              as_user_id: reviewer_1
            - call: "POST /tiers"
              payload: { tier_name: "MethodTier", scopes_included: ["BALANCE"], rate_class: "LOW" }
              as: PlatformAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /recipients/${rec_id}/tier_assignments"
              payload: { tier_id: "${tier_id}" }
              as: PlatformAdmin
            - call: "GET /recipients/${rec_id}"
              as: PlatformAdmin
              captures: { rec_id_v: $.data.version }
            - call: "POST /recipients/${rec_id}/consents"
              payload: { consumer_ref: "cons_ac", data_scopes: ["BALANCE"], expires_at: "2026-12-31T00:00:00Z", expected_recipient_version: "${rec_id_v}" }
              as: Consumer
              as_user_id: cons_ac
              captures: { consent_id: $.data.id }
          trigger:
            - call: "POST /institutions/${inst_id}/connections"
              payload: { consumer_ref: "cons_ac", consent_id: "${consent_id}", method: "OAUTH_TOKEN" }
              as: Consumer
              as_user_id: cons_ac
              captures: { err: $.data.error_id }
          assert:
            - "http status == 422 and error_id == ERR_METHOD_NOT_SUPPORTED"

      - name: duplicate_active_consent_same_scopes_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=17]
          - errors[ERR_DUPLICATE_ACTIVE]
        distinguishing_aspect: "A second non-terminal consent for the same (consumer_ref, recipient_id, identical data_scopes set) is rejected ERR_DUPLICATE_ACTIVE rather than superseding."
        test_recipe:
          setup: ["One ACTIVE consent [BALANCE] for consumer cons_ad under recipient R"]
          setup_api_calls:
            - call: "POST /recipients"
              payload: { name: "DupApp", declared_use_case: "dup consent", minimization_policy: "BROAD" }
