          - "errors[ERR_STREAM_WINDOW_CONFLICT]"
          - "errors[ERR_SIMULCAST_BUFFER_CONFLICT]"
          - "errors[ERR_BELOW_PAYOUT_THRESHOLD]"
          - "errors[ERR_TAX_FORM_NOT_VERIFIED]"
          - "errors[ERR_DISCLOSURE_REQUIRED]"
        excluded_because:
