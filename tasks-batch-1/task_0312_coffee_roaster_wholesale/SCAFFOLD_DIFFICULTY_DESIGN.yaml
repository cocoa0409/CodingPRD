  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: reorder_par_boundary_strict_less_than
        grounds:
          - calculations.green_reorder_status
          - entities.GreenLot.fields.reorder_status
          - state_machines.RoastBatch.PLANNED_to_ROASTING
        distinguishing_aspect: |
          Numeric threshold boundary on green reorder via POST /roast-batches/{id}/start: available_kg ==
          par_level_kg stays OK (strict <), only available_kg < par triggers BELOW_PAR. At available 25.000
          == par 25 it is OK; one more kg consumed flips it.
        test_recipe:
          setup:
            - "GreenLot received 50 kg, par_level_kg 25; a batch consumes exactly 25 kg leaving available exactly 25.000 (== par)."
          setup_api_calls:
            - call: "POST /roast-profiles"
              payload: { name: "Bnd", roast_level: "MEDIUM", expected_shrink_bps: 1500, charge_temp_c: 200 }
              as: RoasterStaff
              captures: { rp_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-BND", name: "Bnd", roast_profile_id: "${rp_id}", base_price_cents_per_kg: 1900, freshness_window_days: 14 }
              as: RoasterStaff
              captures: { prod_id: $.data.id }
            - call: "POST /green-lots"
              payload: { origin: "Sumatra", lot_ref: "SUM-001", received_kg: 50, par_level_kg: 25 }
              as: RoasterStaff
              captures: { gl_id: $.data.id, gl_v: $.data.version }
            - call: "POST /roast-batches"
              payload: { green_lot_id: "${gl_id}", product_id: "${prod_id}", planned_green_kg: 25, expected_green_lot_version: "${gl_v}" }
              as: RoasterStaff
              captures: { rb_id: $.data.id }
          trigger:
            - call: "POST /roast-batches/${rb_id}/start"
              payload: { actual_green_kg: 25 }
              as: RoasterStaff
            - call: "GET /green-lots/${gl_id}"
              payload: {}
              as: RoasterStaff
              captures: { gl_avail: $.data.available_kg, gl_reorder: $.data.reorder_status }
          assert:
            - "GreenLot.${gl_id}.available_kg == 25.000 (50 - 25)"
            - "GreenLot.${gl_id}.reorder_status == OK (25.000 == par 25 is not below; strict <)"

      - name: empty_lines_order_zero_collection_rejected
        grounds:
          - validations[priority=4]
          - entities.Order.fields.lines
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Empty-collection boundary on a different metric/endpoint (POST /accounts/{id}/orders): an order
          with an empty lines array is rejected with ERR_INVALID_REQUEST (422), distinct from the numeric
          par threshold above.
        test_recipe:
          setup:
            - "An account exists; client posts an order with lines = []."
          setup_api_calls:
            - call: "POST /price-tiers"
              payload: { code: "E0", discount_bps: 0, min_monthly_kg: 0, freshness_max_days: 60 }
              as: SalesRep
