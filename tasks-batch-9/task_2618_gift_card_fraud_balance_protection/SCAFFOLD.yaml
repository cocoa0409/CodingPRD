# ----------------------------------------------------------------------------
# §1.7 Roles  (segregation_of_duties role model)
# ----------------------------------------------------------------------------
roles:
  - name: StoreManager
    identity: "entity_backed:RetailStore"
    description: |
      Runs one retail floor. The X-User-ID header carries the RetailStore.id the
      manager runs, so every write is scope-checked by §1.4 p22: the target's
      effective store_id must equal the X-User-ID, and a target with a null
      store_id (every DIGITAL card and every DIGITAL issuance request) is
      unreachable to this role.
    exclusive_operations:
      - "POST /card-racks/{id}/clear-tamper (shared with RiskManager)"
      - "POST /issuance-requests/{id}/decide (shared with RiskManager)"
      - "POST /bulk-purchase-orders/{id}/decide (shared with RiskManager)"
    shared_operations:
      - "POST /card-racks, POST /card-racks/{id}/audits"
      - "POST /gift-cards"
      - "POST /bulk-purchase-orders, POST /bulk-purchase-orders/{id}/identity-verification"
      - "every GET in §1.5 except the referral and exposure-summary reads"

  - name: PosAssociate
    identity: opaque
    description: |
      Works the register. Drives activation controls, redemptions, holds,
      balance inquiries, bulk intake and claim intake. Cannot decide anything —
      no approve, decline, resolve or restate operation is open to this role.
    exclusive_operations:
      - "POST /gift-cards/{id}/redemptions"
      - "POST /issuance-requests"
    shared_operations:
      - "POST /gift-cards, POST /card-racks/{id}/audits"
      - "POST /gift-cards/{id}/balance-inquiries, POST /gift-cards/{id}/redemption-holds, POST /redemption-holds/{id}/settle"
      - "POST /issuance-requests/{id}/screen"
      - "POST /bulk-purchase-orders, POST /bulk-purchase-orders/{id}/identity-verification"
      - "POST /victim-claims, POST /victim-claims/{id}/resubmit-evidence"

  - name: FraudAnalyst
    identity: opaque
    description: |
      Investigates. Raises and triages draining alerts, validates reseller
      listings, chases claim evidence and files law-enforcement referrals.
      Deliberately CANNOT resolve an alert or decide a claim — that is the
      segregation-of-duties boundary this role exists to create.
    exclusive_operations:
      - "POST /draining-alerts/{id}/triage"
      - "POST /reseller-listings/{id}/validate"
      - "POST /victim-claims/{id}/request-evidence"
    shared_operations:
      - "POST /draining-alerts"
      - "POST /law-enforcement-referrals"
      - "POST /victim-claims, POST /victim-claims/{id}/resubmit-evidence"
      - "POST /gift-cards/{id}/balance-inquiries, POST /issuance-requests/{id}/screen"

  - name: RiskManager
    identity: opaque
    description: |
      Decides. Resolves alerts, decides and rescinds claims, overrides card
      posture and reverses ledger events. Bound by §1.4 p58: may not resolve an
      alert they themselves triaged, nor decide a claim they themselves took in.
    exclusive_operations:
      - "POST /draining-alerts/{id}/resolve"
      - "POST /draining-alerts/{id}/reopen"
      - "POST /victim-claims/{id}/decide"
      - "POST /gift-cards/{id}/posture"
      - "POST /ledger-events/{id}/reverse"
    shared_operations:
      - "POST /card-racks/{id}/clear-tamper"
      - "POST /issuance-requests/{id}/decide, POST /bulk-purchase-orders/{id}/decide"
      - "POST /draining-alerts, POST /law-enforcement-referrals"
      - "POST /gift-cards/{id}/redemption-holds, POST /redemption-holds/{id}/settle"
      - "POST /victim-claims/{id}/rescind"

  - name: LiabilityAccountant
    identity: opaque
    description: |
      Owns balance-liability accounting. Opens, closes and restates periods and
      reads the exposure summary. Cannot touch a card, an alert or a claim
      decision — the only claim operation open to this role is rescission, which
      is an accounting reversal.
    exclusive_operations:
      - "POST /liability-periods"
      - "POST /liability-periods/{id}/close"
      - "POST /liability-periods/{id}/restate"
    shared_operations:
      - "POST /victim-claims/{id}/rescind"
      - "GET /liability-periods/{id}/exposure-summary"

  - name: ResellerPartner
    identity: opaque
    description: |
      A third-party secondary-marketplace partner. May submit listings and probe
      card balances, and may read its own listings, but may NOT validate a
      listing — validation is the retailer's control, not the reseller's.
    exclusive_operations:
      - "POST /reseller-listings"
    shared_operations:
      - "POST /gift-cards/{id}/balance-inquiries"
      - "GET /gift-cards/{id}/reseller-listings, GET /reseller-listings, GET /reseller-listings/{id}"

  - name: PlatformAdmin
    identity: opaque
    description: |
      Platform operator. Owns the risk-policy constants, the logical clock and
      store registration. Deliberately has NO operational authority: it cannot
      activate a card, redeem, approve a bulk order, resolve an alert, decide a
      claim or close a period.
    exclusive_operations:
      - "PUT /risk-policy"
      - "POST /_clock/set_current_utc"
      - "POST /stores"
    shared_operations:
      - "POST /card-racks"
      - "POST /issuance-requests/{id}/screen"
      - "every GET in §1.5"
