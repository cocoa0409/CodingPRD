            - "An implementation that loops back to step 6 is wrong: a second pass would report allowed_state_incentive_cents 622000 / allowed_federal_credit_cents 83400 and keep shrinking; skipping the step-7 recompute is also wrong and would report allowed_federal_credit_cents 60000 with residual_overage_cents 0"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: rebate_project_incomplete_resubmission_loop_repins_measure_set
        grounds:
          - state_machines.RebateProject.SUBMITTED_to_INCOMPLETE
          - state_machines.RebateProject.INCOMPLETE_to_SUBMITTED
          - entities.RebateProject.fields.submission_count
          - entities.RebateProject.fields.incomplete_reason
          - endpoints.POST_/rebate-projects/{id}/submit
        distinguishing_aspect: |
          Non-linearity on the RebateProject aggregate: a revision CYCLE
          (SUBMITTED -> INCOMPLETE -> SUBMITTED) that returns to a state the
          entity already occupied, carries a monotone counter across the loop
          (submission_count 1 -> 2) and re-pins a REPLACED measure set on the
          way back, so the provisional total after the loop differs from the
          total before it. The loop is bounded on the exit side only: from
          APPROVED there is no submit edge at all.
        test_recipe:
          setup:
            - "An OPEN program with low_tier_cost_share_pct 1.00, low_tier_cap_cents 1400000 and group_cap_cents 800000."
            - "Catalog: HP-HVAC-01 unit 800000 / cap 800000 / HVAC_GROUP / sort 10 / 200 A / anchor, HP-DUCT-01 unit 250000 / cap 250000 / HVAC_GROUP / sort 15 / 100 A / prerequisite HP-HVAC-01."
