  # =====================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_pay_on_void_invoice
        grounds:
          - validations[priority=7]
          - validations[priority=15]
          - state_machines.Invoice.OPEN_to_VOID
        distinguishing_aspect: |
          Pair (state priority 7 vs business_fiscal priority 15): paying a VOID invoice with a
          wrong amount fails ERR_INVALID_STATE (409, state) rather than ERR_PAYMENT_AMOUNT_MISMATCH
          (422, fiscal) — state precondition is checked first.
        test_recipe:
          setup:
            - "ACTIVE STANDARD account with one OPEN invoice that is then VOIDed."
          setup_api_calls:
            - call: "POST /service-plans"
              payload: { tier: "STANDARD", trash_cart_size_gallons: 65, recycling_cart_size_gallons: 65, monthly_base_cents: 4000, extra_cart_monthly_cents: 1200, extra_pickup_base_cents: 2500, bulk_item_cents: 800 }
