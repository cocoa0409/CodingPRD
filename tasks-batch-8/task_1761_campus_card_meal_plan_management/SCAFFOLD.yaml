    side_effects: []
  - method: GET
    path: "/api/terms/{id}"
    description: "Get one term"
    roles: [PlatformAdmin, CardOfficeAdmin, DiningServicesManager, BursarOffice, FraudAnalyst, CardHolder]
    code: 200
    input: []
    output: Term
    side_effects: []
  - method: POST
    path: "/api/terms/{id}/open"
