        grounds:
          - errors[ERR_SILO_CAPACITY_EXCEEDED]
          - validations[priority 19, ERR_SILO_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          The silo constraint bites at the moment of crediting, not at batch creation or feeding: a plant
          with a 50 t silo happily calcines a batch whose planned yield is 77.340 t and only the stucco
          test fails with ERR_SILO_CAPACITY_EXCEEDED (422), leaving the batch in CALCINING and the silo
          empty.
        test_recipe:
          setup:
            - "Plant GYP-3 with stucco_silo_capacity_tons 50 and a 100.000 t lot assayed 10.00 % / 90.0 %."
            - "Batch BM fed with the whole lot and closed, so stucco_yield_planned_tons == 77.340."
