        claim_type: Precision
        grounds: [calculations.communicator_health, entities.SecuritySystem.fields.backup_battery_pct]
        distinguishing_aspect: "Battery >= 20 boundary: backup_battery_pct 20 -> HEALTHY, 19 -> DEGRADED (checkin/signal healthy)."
        test_recipe:
