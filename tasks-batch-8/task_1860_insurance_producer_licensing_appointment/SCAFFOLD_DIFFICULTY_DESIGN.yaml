# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 1860: Insurance Producer Licensing & Appointment Management
# 9 Difficulty Rules x 2 instances = 18 instances.
# All clock positions are absolute (logical clock default 2026-08-01T00:00:00Z).
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: ce_spillover_vs_strict_variant_divergence
        grounds:
          - calculations.ce_compliance_determination
          - entities.License.fields.license_class
        distinguishing_aspect: |
          Identical CE data (20 GENERAL + 5 ETHICS hours against a 24-total /
          3-ethics requirement) is COMPLIANT under the SPILLOVER variant
          (RESIDENT license: ethics counts toward the total) but NON_COMPLIANT
          under the STRICT variant (NON_RESIDENT license: general hours alone
          must cover 24 - 3 = 21; 20 < 21). Entity domain: License/CE.
        test_recipe:
          setup:
            - "Producer with two licenses: CA RESIDENT and AZ NON_RESIDENT, both LIFE, both period [2026-01-01, 2028-01-01], default CE requirement 24 total / 3 ethics"
            - "Both licenses hold exactly 20 GENERAL + 5 ETHICS hours of ACCEPTED CE credits completed inside the period"
            - "Logical clock at 2027-12-01 (inside renewal window [2027-10-03, 2028-01-01] for both)"
          setup_api_calls:
            - call: "POST /api/producers"
              payload: { npn: "NPN-2001", full_name: "Split Variant", resident_state_code: "CA" }
              as: LicensingCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /api/licenses"
              payload: { producer_id: "${p_id}", state_code: "CA", license_class: "RESIDENT", lines_of_authority: ["LIFE"], issue_date: "2026-01-01T00:00:00Z", expiration_date: "2028-01-01T00:00:00Z" }
              as: LicensingCoordinator
              captures: { l_res: $.data.id }
            - call: "POST /api/licenses"
              payload: { producer_id: "${p_id}", state_code: "AZ", license_class: "NON_RESIDENT", lines_of_authority: ["LIFE"], issue_date: "2026-01-01T00:00:00Z", expiration_date: "2028-01-01T00:00:00Z" }
              as: LicensingCoordinator
              captures: { l_nr: $.data.id }
            - call: "POST /api/ce-credits"
              payload: { license_id: "${l_res}", provider_name: "CEU", course_title: "Gen 20", category: "GENERAL", credit_hours: 20, completed_on: "2026-06-01T00:00:00Z" }
              as: LicensingCoordinator
              captures: { c1: $.data.id }
            - call: "POST /api/ce-credits/${c1}/review"
              payload: { decision: "ACCEPT" }
              as: LicensingCoordinator
            - call: "POST /api/ce-credits"
              payload: { license_id: "${l_res}", provider_name: "CEU", course_title: "Eth 5", category: "ETHICS", credit_hours: 5, completed_on: "2026-06-02T00:00:00Z" }
              as: LicensingCoordinator
              captures: { c2: $.data.id }
            - call: "POST /api/ce-credits/${c2}/review"
              payload: { decision: "ACCEPT" }
              as: LicensingCoordinator
            - call: "POST /api/ce-credits"
              payload: { license_id: "${l_nr}", provider_name: "CEU", course_title: "Gen 20", category: "GENERAL", credit_hours: 20, completed_on: "2026-06-01T00:00:00Z" }
              as: LicensingCoordinator
              captures: { c3: $.data.id }
            - call: "POST /api/ce-credits/${c3}/review"
              payload: { decision: "ACCEPT" }
              as: LicensingCoordinator
            - call: "POST /api/ce-credits"
              payload: { license_id: "${l_nr}", provider_name: "CEU", course_title: "Eth 5", category: "ETHICS", credit_hours: 5, completed_on: "2026-06-02T00:00:00Z" }
              as: LicensingCoordinator
              captures: { c4: $.data.id }
            - call: "POST /api/ce-credits/${c4}/review"
              payload: { decision: "ACCEPT" }
              as: LicensingCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-12-01T00:00:00Z" }
              as: CarrierAdmin
            - call: "GET /api/licenses/${l_res}"
              as: LicensingCoordinator
              captures: { res_v: $.data.version }
            - call: "GET /api/licenses/${l_nr}"
              as: LicensingCoordinator
              captures: { nr_v: $.data.version }
          trigger:
            - call: "POST /api/licenses/${l_res}/renew"
              payload: { expected_license_version: "${res_v}" }
              as: LicensingCoordinator
              captures: { res_status: $.data.status, res_renewed: $.data.renewed_count }
            - call: "POST /api/licenses/${l_nr}/renew"
              payload: { expected_license_version: "${nr_v}" }
              as: LicensingCoordinator
              captures: { nr_err: $.data.error_id }
          assert:
            - "License.${l_res} renew succeeds: res_status == ACTIVE and res_renewed == 1 (SPILLOVER: 20 + 5 = 25 >= 24 and 5 >= 3)"
            - "License.${l_nr} renew rejected: nr_err == ERR_CE_INCOMPLETE (STRICT: general 20 < 24 - 3 = 21)"
            - "License.${l_nr}.renewed_count == 0 and License.${l_nr}.status == ACTIVE after rejection"

      - name: commission_provisional_vs_final_tier_crossing
        grounds:
          - calculations.commission_amount_cents
          - calculations.producer_ytd_issued_premium
          - entities.CommissionEntry.fields.amount_variant
        distinguishing_aspect: |
          The same application's commission differs between the PROVISIONAL
          variant (YTD at submission, below the $1M tier -> x1.00 -> 2400000)
          and the FINAL variant (YTD at issue, at/above $1M after an intervening
          issue -> x1.10 -> 2640000). Entity domain: CommissionEntry — distinct
          from ce_spillover_vs_strict_variant_divergence (License/CE).
        test_recipe:
          setup:
            - "Producer with ACTIVE CA PROPERTY license and ACTIVE own appointment (effective 2026-08-01)"
            - "App0 (premium 90000000) already ISSUED at 2026-08-01 -> ytd_issued_premium_cents == 90000000"
            - "App1 (premium 20000000) SUBMITTED at 2026-08-01: provisional commission 2400000 (mult 1.00)"
            - "App2 (premium 20000000) ISSUED at 2026-08-02: final commission 2400000 (ytd before = 90000000 -> mult 1.00); ytd becomes 110000000"
          setup_api_calls:
            - call: "POST /api/producers"
              payload: { npn: "NPN-2002", full_name: "Tier Crosser", resident_state_code: "CA" }
              as: LicensingCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /api/licenses"
              payload: { producer_id: "${p_id}", state_code: "CA", license_class: "RESIDENT", lines_of_authority: ["PROPERTY"], issue_date: "2026-01-01T00:00:00Z", expiration_date: "2028-01-01T00:00:00Z" }
              as: LicensingCoordinator
            - call: "POST /api/appointments"
              payload: { producer_id: "${p_id}", state_code: "CA", lines_of_authority: ["PROPERTY"], effective_date: "2026-01-15T00:00:00Z" }
              as: LicensingCoordinator
              captures: { appt: $.data.id }
            - call: "POST /api/appointments/${appt}/file"
              as: LicensingCoordinator
            - call: "POST /api/applications"
              payload: { producer_id: "${p_id}", state_code: "CA", line_of_authority: "PROPERTY", applicant_name: "Zero", premium_cents: 90000000 }
              as: LicensingCoordinator
              captures: { app0: $.data.id }
            - call: "POST /api/applications/${app0}/decide"
              payload: { decision: "APPROVE" }
              as: LicensingCoordinator
            - call: "POST /api/applications/${app0}/issue"
              as: LicensingCoordinator
            - call: "POST /api/applications"
              payload: { producer_id: "${p_id}", state_code: "CA", line_of_authority: "PROPERTY", applicant_name: "One", premium_cents: 20000000 }
              as: LicensingCoordinator
              captures: { app1: $.data.id }
            - call: "GET /api/commission-entries"
              payload: { application_id: "${app1}" }
              as: LicensingCoordinator
              captures: { e1: "$.data[0].id", e1_prov: "$.data[0].amount_cents", e1_prov_variant: "$.data[0].amount_variant" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: CarrierAdmin
            - call: "POST /api/applications"
              payload: { producer_id: "${p_id}", state_code: "CA", line_of_authority: "PROPERTY", applicant_name: "Two", premium_cents: 20000000 }
              as: LicensingCoordinator
              captures: { app2: $.data.id }
            - call: "POST /api/applications/${app2}/decide"
              payload: { decision: "APPROVE" }
              as: LicensingCoordinator
            - call: "POST /api/applications/${app2}/issue"
              as: LicensingCoordinator
            - call: "GET /api/commission-entries"
              payload: { application_id: "${app2}" }
              as: LicensingCoordinator
              captures: { e2: "$.data[0].id", e2_amt: "$.data[0].amount_cents" }
            - call: "POST /api/applications/${app1}/decide"
              payload: { decision: "APPROVE" }
              as: LicensingCoordinator
          trigger:
            - call: "POST /api/applications/${app1}/issue"
              as: LicensingCoordinator
            - call: "GET /api/commission-entries/${e1}"
              as: LicensingCoordinator
              captures: { e1_final: $.data.amount_cents, e1_variant: $.data.amount_variant }
            - call: "GET /api/producers/${p_id}"
              as: LicensingCoordinator
              captures: { ytd: $.data.ytd_issued_premium_cents }
          assert:
            - "e1_prov == 2400000 and e1_prov_variant == PROVISIONAL (floor(20000000 * 0.12 * 1.00 * 1.00))"
            - "e2_amt == 2400000 (issued when ytd before = 90000000 < 100000000 -> mult 1.00)"
            - "e1_final == 2640000 and e1_variant == FINAL (issued when ytd before = 110000000 >= 100000000 -> floor(20000000 * 0.12 * 1.10))"
            - "ytd == 130000000 (90000000 + 20000000 + 20000000)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: commission_amount_tiered_multi_input
        grounds:
          - calculations.commission_amount_cents
          - calculations.producer_eligibility_posture
        distinguishing_aspect: |
          Mode (a) combinatorial: amount combines four inputs — premium_cents,
          LOA base rate (PROPERTY 0.12), YTD volume tier (0 -> x1.00), and the
          conditional agency-uplift branch (x1.05 because the affiliated agency
          holds an ACTIVE appointment covering the LOA) — with a single terminal
          floor: floor(12345678 * 0.12 * 1.00 * 1.05) = 1555555.
        test_recipe:
          setup:
            - "Agency with ACTIVE agency-held CA PROPERTY license and ACTIVE agency appointment"
            - "Producer affiliated to the agency, with own ACTIVE CA PROPERTY license but NO own appointment"
            - "Logical clock at default 2026-08-01"
          setup_api_calls:
            - call: "POST /api/agencies"
              payload: { name: "Uplift Agency", resident_state_code: "CA" }
              as: LicensingCoordinator
              captures: { ag: $.data.id }
            - call: "POST /api/licenses"
              payload: { agency_id: "${ag}", state_code: "CA", license_class: "RESIDENT", lines_of_authority: ["PROPERTY"], issue_date: "2026-01-01T00:00:00Z", expiration_date: "2028-01-01T00:00:00Z", ce_required_hours: 0, ce_ethics_required_hours: 0 }
              as: LicensingCoordinator
            - call: "POST /api/appointments"
              payload: { agency_id: "${ag}", state_code: "CA", lines_of_authority: ["PROPERTY"], effective_date: "2026-01-15T00:00:00Z" }
              as: LicensingCoordinator
              captures: { ag_appt: $.data.id }
            - call: "POST /api/appointments/${ag_appt}/file"
              as: LicensingCoordinator
            - call: "POST /api/producers"
              payload: { npn: "NPN-2003", full_name: "Uplifted", resident_state_code: "CA", agency_id: "${ag}" }
              as: LicensingCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /api/licenses"
              payload: { producer_id: "${p_id}", state_code: "CA", license_class: "RESIDENT", lines_of_authority: ["PROPERTY"], issue_date: "2026-01-01T00:00:00Z", expiration_date: "2028-01-01T00:00:00Z" }
              as: LicensingCoordinator
          trigger:
            - call: "POST /api/applications"
              payload: { producer_id: "${p_id}", state_code: "CA", line_of_authority: "PROPERTY", applicant_name: "X", premium_cents: 12345678 }
              as: LicensingCoordinator
              captures: { app: $.data.id, app_snap: $.data.eligibility_snapshot }
            - call: "GET /api/commission-entries"
              payload: { application_id: "${app}" }
              as: LicensingCoordinator
              captures: { e_amt: "$.data[0].amount_cents", e_st: "$.data[0].status" }
            - call: "GET /api/producers/${p_id}/eligibility"
              payload: { state_code: "CA", line_of_authority: "PROPERTY" }
              as: LicensingCoordinator
              captures: { elig: $.data.eligibility_status, via_ag: $.data.via_agency }
          assert:
            - "e_amt == 1555555 (floor(12345678 * 0.12 * 1.00 * 1.05); single terminal floor, no per-factor rounding)"
            - "e_st == PAYABLE (eligibility ELIGIBLE through the agency appointment)"
            - "app_snap == ELIGIBLE"
            - "elig == ELIGIBLE and via_ag == true"

      - name: fine_allocation_rounding_remainder
        grounds:
          - calculations.fine_allocation
          - entities.RegulatoryAction.fields.fine_allocations
        distinguishing_aspect: |
          Mode (b) nested rounding: each allocation is floor-per-line FIRST
          (floor(10001 * 1/3) = 3333 each), then the remainder (10001 - 9999 =
          2 cents) is distributed one cent at a time in input-set order
          (premium DESC, created_at ASC tie-break), yielding 3334/3334/3333 —
          sum-then-round would give a different per-line split. Distinct mode
          from commission_amount_tiered_multi_input (mode a).
        test_recipe:
          setup:
            - "Producer with ACTIVE CA PROPERTY license and ACTIVE own appointment"
            - "Three applications (premium 10000000 each) ISSUED in CA at 2026-08-01, 2026-08-02, 2026-08-03 respectively (created_at strictly increasing)"
            - "A REPORTED FINE action of 10001 cents in CA created by officer-a"
          setup_api_calls:
            - call: "POST /api/producers"
              payload: { npn: "NPN-2004", full_name: "Fined Producer", resident_state_code: "CA" }
              as: LicensingCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /api/licenses"
              payload: { producer_id: "${p_id}", state_code: "CA", license_class: "RESIDENT", lines_of_authority: ["PROPERTY"], issue_date: "2026-01-01T00:00:00Z", expiration_date: "2028-01-01T00:00:00Z" }
              as: LicensingCoordinator
            - call: "POST /api/appointments"
              payload: { producer_id: "${p_id}", state_code: "CA", lines_of_authority: ["PROPERTY"], effective_date: "2026-01-15T00:00:00Z" }
              as: LicensingCoordinator
              captures: { appt: $.data.id }
            - call: "POST /api/appointments/${appt}/file"
              as: LicensingCoordinator
            - call: "POST /api/applications"
              payload: { producer_id: "${p_id}", state_code: "CA", line_of_authority: "PROPERTY", applicant_name: "A1", premium_cents: 10000000 }
              as: LicensingCoordinator
              captures: { app1: $.data.id }
            - call: "POST /api/applications/${app1}/decide"
              payload: { decision: "APPROVE" }
              as: LicensingCoordinator
            - call: "POST /api/applications/${app1}/issue"
              as: LicensingCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: CarrierAdmin
            - call: "POST /api/applications"
              payload: { producer_id: "${p_id}", state_code: "CA", line_of_authority: "PROPERTY", applicant_name: "A2", premium_cents: 10000000 }
              as: LicensingCoordinator
              captures: { app2: $.data.id }
            - call: "POST /api/applications/${app2}/decide"
              payload: { decision: "APPROVE" }
              as: LicensingCoordinator
            - call: "POST /api/applications/${app2}/issue"
              as: LicensingCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: CarrierAdmin
            - call: "POST /api/applications"
              payload: { producer_id: "${p_id}", state_code: "CA", line_of_authority: "PROPERTY", applicant_name: "A3", premium_cents: 10000000 }
              as: LicensingCoordinator
              captures: { app3: $.data.id }
            - call: "POST /api/applications/${app3}/decide"
              payload: { decision: "APPROVE" }
              as: LicensingCoordinator
            - call: "POST /api/applications/${app3}/issue"
              as: LicensingCoordinator
            - call: "POST /api/regulatory-actions"
              payload: { producer_id: "${p_id}", state_code: "CA", action_type: "FINE", fine_amount_cents: 10001, effective_date: "2026-08-03T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { ra: $.data.id }
          trigger:
            - call: "POST /api/regulatory-actions/${ra}/confirm"
              as: ComplianceOfficer
              as_user_id: "officer-b"
              captures: { ra_st: $.data.status, fa: $.data.fine_allocations }
          assert:
            - "ra_st == CONFIRMED"
            - "fa == [{application_id: ${app1}, allocated_cents: 3334}, {application_id: ${app2}, allocated_cents: 3334}, {application_id: ${app3}, allocated_cents: 3333}] (floor-per-line 3333 each, remainder 2 distributed in input-set order: premium DESC tie -> created_at ASC)"
            - "sum of allocated_cents == 10001 == RegulatoryAction.${ra}.fine_amount_cents"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: license_expiry_renewal_cycle
        grounds:
          - state_machines.License.ACTIVE_to_ACTIVE
          - state_machines.License.ACTIVE_to_EXPIRED
          - state_machines.License.EXPIRED_to_ACTIVE
        distinguishing_aspect: |
          License machine is cyclic: ACTIVE -> ACTIVE renew self-loop, then
          ACTIVE -> EXPIRED (clock sweep) -> ACTIVE (grace renewal) closes an
          A -> B -> A loop — not a linear pipeline. Entity: License.
        test_recipe:
          setup:
            - "Producer with CA RESIDENT LIFE license, period [2026-01-01, 2026-09-01], ce_required_hours 0 (CE trivially compliant)"
            - "Clock at default 2026-08-01 (inside renewal window [2026-06-03, 2026-09-01])"
          setup_api_calls:
            - call: "POST /api/producers"
              payload: { npn: "NPN-2005", full_name: "Cyclic License", resident_state_code: "CA" }
              as: LicensingCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /api/licenses"
              payload: { producer_id: "${p_id}", state_code: "CA", license_class: "RESIDENT", lines_of_authority: ["LIFE"], issue_date: "2026-01-01T00:00:00Z", expiration_date: "2026-09-01T00:00:00Z", ce_required_hours: 0, ce_ethics_required_hours: 0 }
              as: LicensingCoordinator
              captures: { lic: $.data.id, lic_v1: $.data.version }
            - call: "POST /api/licenses/${lic}/renew"
              payload: { expected_license_version: "${lic_v1}" }
              as: LicensingCoordinator
              captures: { st1: $.data.status, rc1: $.data.renewed_count, exp1: $.data.expiration_date }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-09-02T00:00:00Z" }
              as: CarrierAdmin
            - call: "GET /api/licenses/${lic}"
              as: LicensingCoordinator
              captures: { st2: $.data.status, lic_v2: $.data.version }
          trigger:
            - call: "POST /api/licenses/${lic}/renew"
              payload: { expected_license_version: "${lic_v2}" }
              as: LicensingCoordinator
              captures: { st3: $.data.status, rc3: $.data.renewed_count, exp3: $.data.expiration_date }
          assert:
            - "First renew (ACTIVE -> ACTIVE): st1 == ACTIVE, rc1 == 1, exp1 == 2028-09-01T00:00:00Z"
            - "After sweep at 2028-09-02 (strictly past expiration 2028-09-01): st2 == EXPIRED"
            - "Grace renew (EXPIRED -> ACTIVE, 2028-09-01 < 2028-09-02 <= 2028-10-01): st3 == ACTIVE, rc3 == 2, exp3 == 2030-09-01T00:00:00Z"

      - name: appointment_terminate_rescind_cycle
        grounds:
          - state_machines.Appointment.ACTIVE_to_TERMINATION_PENDING
          - state_machines.Appointment.TERMINATION_PENDING_to_ACTIVE
          - state_machines.Appointment.TERMINATION_PENDING_to_TERMINATED
        distinguishing_aspect: |
          Appointment machine is cyclic: ACTIVE -> TERMINATION_PENDING ->
          ACTIVE (rescind) -> TERMINATION_PENDING -> TERMINATED, and the rescind
          leg restores ACTIVE without touching effective_date. Different entity
          from license_expiry_renewal_cycle (Appointment vs License).
        test_recipe:
          setup:
            - "Producer with ACTIVE CA LIFE license and ACTIVE appointment effective 2026-01-15"
            - "Clock at default 2026-08-01 (never advances)"
          setup_api_calls:
            - call: "POST /api/producers"
              payload: { npn: "NPN-2006", full_name: "Cyclic Appointment", resident_state_code: "CA" }
              as: LicensingCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /api/licenses"
              payload: { producer_id: "${p_id}", state_code: "CA", license_class: "RESIDENT", lines_of_authority: ["LIFE"], issue_date: "2026-01-01T00:00:00Z", expiration_date: "2028-01-01T00:00:00Z" }
              as: LicensingCoordinator
            - call: "POST /api/appointments"
              payload: { producer_id: "${p_id}", state_code: "CA", lines_of_authority: ["LIFE"], effective_date: "2026-01-15T00:00:00Z" }
              as: LicensingCoordinator
              captures: { appt: $.data.id }
            - call: "POST /api/appointments/${appt}/file"
              as: LicensingCoordinator
              captures: { st_file: $.data.status, eff0: $.data.effective_date }
            - call: "POST /api/appointments/${appt}/terminate"
              payload: { termination_reason: "FOR_CAUSE" }
              as: LicensingCoordinator
              captures: { st_t1: $.data.status }
            - call: "POST /api/appointments/${appt}/rescind-termination"
              as: LicensingCoordinator
              captures: { st_r: $.data.status, eff_r: $.data.effective_date, tr_r: $.data.termination_reason }
            - call: "POST /api/appointments/${appt}/terminate"
              payload: { termination_reason: "VOLUNTARY" }
              as: LicensingCoordinator
              captures: { st_t2: $.data.status }
          trigger:
            - call: "POST /api/appointments/${appt}/file-termination"
              as: LicensingCoordinator
              captures: { st_f: $.data.status, tdate: $.data.termination_date }
          assert:
            - "st_file == ACTIVE and eff0 == 2026-01-15T00:00:00Z"
            - "st_t1 == TERMINATION_PENDING"
            - "Rescind closes the loop: st_r == ACTIVE, tr_r == null, eff_r == 2026-01-15T00:00:00Z (effective_date unchanged)"
            - "st_t2 == TERMINATION_PENDING"
            - "st_f == TERMINATED and tdate == 2026-08-01T00:00:00Z (clock at file-termination)"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: regulatory_confirm_cascade_depth3
        grounds:
          - state_machines.RegulatoryAction.REPORTED_to_CONFIRMED
          - state_machines.License.ACTIVE_to_SUSPENDED
          - state_machines.CommissionEntry.PAYABLE_to_HELD
        distinguishing_aspect: |
          Depth-3 chain: confirm(SUSPENSION) mutates License (1); the License
          suspension itself mutates the Appointment to TERMINATION_PENDING (2);
          the appointment-level cascade mutates the CommissionEntry PAYABLE ->
          HELD (3). Trigger: POST /api/regulatory-actions/{id}/confirm.
        test_recipe:
          setup:
            - "Producer with ACTIVE CA PROPERTY license, ACTIVE own appointment, and one ISSUED application (premium 10000000) whose CommissionEntry is PAYABLE with amount 1200000"
            - "A REPORTED SUSPENSION action in CA created by officer-a"
          setup_api_calls:
            - call: "POST /api/producers"
              payload: { npn: "NPN-2007", full_name: "Cascade Target", resident_state_code: "CA" }
              as: LicensingCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /api/licenses"
              payload: { producer_id: "${p_id}", state_code: "CA", license_class: "RESIDENT", lines_of_authority: ["PROPERTY"], issue_date: "2026-01-01T00:00:00Z", expiration_date: "2028-01-01T00:00:00Z" }
              as: LicensingCoordinator
              captures: { lic: $.data.id }
            - call: "POST /api/appointments"
              payload: { producer_id: "${p_id}", state_code: "CA", lines_of_authority: ["PROPERTY"], effective_date: "2026-01-15T00:00:00Z" }
              as: LicensingCoordinator
              captures: { appt: $.data.id }
            - call: "POST /api/appointments/${appt}/file"
              as: LicensingCoordinator
            - call: "POST /api/applications"
              payload: { producer_id: "${p_id}", state_code: "CA", line_of_authority: "PROPERTY", applicant_name: "Risk", premium_cents: 10000000 }
              as: LicensingCoordinator
              captures: { app: $.data.id }
            - call: "POST /api/applications/${app}/decide"
              payload: { decision: "APPROVE" }
              as: LicensingCoordinator
            - call: "POST /api/applications/${app}/issue"
              as: LicensingCoordinator
            - call: "GET /api/commission-entries"
              payload: { application_id: "${app}" }
              as: LicensingCoordinator
              captures: { e: "$.data[0].id" }
            - call: "POST /api/regulatory-actions"
              payload: { producer_id: "${p_id}", state_code: "CA", action_type: "SUSPENSION", effective_date: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { ra: $.data.id }
          trigger:
            - call: "POST /api/regulatory-actions/${ra}/confirm"
              as: ComplianceOfficer
              as_user_id: "officer-b"
            - call: "GET /api/licenses/${lic}"
              as: LicensingCoordinator
              captures: { lic_st: $.data.status }
            - call: "GET /api/appointments/${appt}"
              as: LicensingCoordinator
              captures: { appt_st: $.data.status, appt_tr: $.data.termination_reason }
            - call: "GET /api/commission-entries/${e}"
              as: LicensingCoordinator
              captures: { e_st: $.data.status, e_hr: $.data.hold_reason }
            - call: "GET /api/producers/${p_id}"
              as: LicensingCoordinator
              captures: { held: $.data.commission_held_cents }
          assert:
            - "lic_st == SUSPENDED (hop 1)"
            - "appt_st == TERMINATION_PENDING and appt_tr == LICENSE_INACTIVE (hop 2, caused by hop 1)"
            - "e_st == HELD and e_hr == REGULATORY_HOLD (hop 3, caused by hop 2)"
            - "held == 1200000 (Producer.commission_held_cents recomputed)"

      - name: inquiry_overdue_cascade_depth2
        grounds:
          - state_machines.RegulatoryInquiry.OPEN_to_OVERDUE
          - state_machines.Producer.ACTIVE_to_SUSPENDED
          - state_machines.PolicyApplication.transitions
        distinguishing_aspect: |
          Depth-2 chain from a different trigger: the clock sweep mutates
          RegulatoryInquiry OPEN -> OVERDUE (1); that mutation itself suspends
          the Producer (2) and the producer suspension auto-declines his
          SUBMITTED application (3rd entity). Trigger: POST
          /_clock/set_current_utc — distinct from regulatory_confirm_cascade_depth3.
        test_recipe:
          setup:
            - "Producer (no license) with one SUBMITTED application; its CommissionEntry is HELD with UNLICENSED_AT_SALE"
            - "OPEN inquiry against the producer received 2026-08-01, response_due_at 2026-08-31T00:00:00Z"
          setup_api_calls:
            - call: "POST /api/producers"
              payload: { npn: "NPN-2008", full_name: "Overdue Target", resident_state_code: "TX" }
              as: LicensingCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /api/applications"
              payload: { producer_id: "${p_id}", state_code: "TX", line_of_authority: "LIFE", applicant_name: "Sub", premium_cents: 1000000 }
              as: LicensingCoordinator
              captures: { app: $.data.id }
            - call: "POST /api/inquiries"
              payload: { producer_id: "${p_id}", state_code: "TX", reference_number: "INQ-2008" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { inq: $.data.id, inq_due: $.data.response_due_at }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CarrierAdmin
            - call: "GET /api/inquiries/${inq}"
              as: ComplianceOfficer
              captures: { inq_st: $.data.status }
            - call: "GET /api/producers/${p_id}"
              as: ComplianceOfficer
              captures: { p_st: $.data.status }
            - call: "GET /api/applications/${app}"
              as: ComplianceOfficer
              captures: { app_st: $.data.status }
            - call: "GET /api/commission-entries"
              payload: { application_id: "${app}" }
              as: ComplianceOfficer
              captures: { e_st: "$.data[0].status" }
          assert:
            - "inq_due == 2026-08-31T00:00:00Z (received_at + 30 days)"
            - "inq_st == OVERDUE (hop 1: sweep, 2026-09-01 > 2026-08-31)"
            - "p_st == SUSPENDED (hop 2, caused by hop 1)"
            - "app_st == DECLINED (hop 3 entity, caused by the producer suspension)"
            - "e_st == FORFEITED (decline forfeits the entry)"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: renew_revoked_beats_ce_incomplete
        grounds:
          - validations[priority=7]
          - validations[priority=10]
        distinguishing_aspect: |
          Pair state vs business_safety: a renew request on a REVOKED license
          with incomplete CE fails with ERR_INVALID_STATE (priority 7), never
          ERR_CE_INCOMPLETE (priority 10).
        test_recipe:
          setup:
            - "Producer with CA LIFE license (default CE requirement 24/3, zero completed hours -> CE incomplete), period [2026-01-01, 2028-01-01]"
            - "A CONFIRMED REVOCATION action has pushed the license to REVOKED"
          setup_api_calls:
            - call: "POST /api/producers"
              payload: { npn: "NPN-2009", full_name: "Revoked Renewer", resident_state_code: "CA" }
              as: LicensingCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /api/licenses"
              payload: { producer_id: "${p_id}", state_code: "CA", license_class: "RESIDENT", lines_of_authority: ["LIFE"], issue_date: "2026-01-01T00:00:00Z", expiration_date: "2028-01-01T00:00:00Z" }
              as: LicensingCoordinator
              captures: { lic: $.data.id }
            - call: "POST /api/regulatory-actions"
              payload: { producer_id: "${p_id}", state_code: "CA", action_type: "REVOCATION", effective_date: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { ra: $.data.id }
            - call: "POST /api/regulatory-actions/${ra}/confirm"
              as: ComplianceOfficer
              as_user_id: "officer-b"
            - call: "GET /api/licenses/${lic}"
              as: LicensingCoordinator
              captures: { lic_v: $.data.version, lic_st: $.data.status }
          trigger:
            - call: "POST /api/licenses/${lic}/renew"
              payload: { expected_license_version: "${lic_v}" }
              as: LicensingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "lic_st == REVOKED before the trigger"
            - "err == ERR_INVALID_STATE (state precondition beats the CE business_safety failure that also holds)"
            - "License.${lic}.renewed_count == 0 after rejection"

      - name: suspended_producer_beats_premium_minimum
        grounds:
          - validations[priority=8]
          - validations[priority=21]
        distinguishing_aspect: |
          Pair business_safety vs business_fiscal: an application submission by
          a SUSPENDED producer with premium_cents below the 500-cent minimum
          fails with ERR_PRODUCER_SUSPENDED (priority 8), never
          ERR_PREMIUM_BELOW_MINIMUM (priority 21) — a different category pair
          from renew_revoked_beats_ce_incomplete.
        test_recipe:
          setup:
            - "Producer SUSPENDED via inquiry-overdue cascade (inquiry received 2026-08-01, due 2026-08-31; clock swept to 2026-09-01)"
          setup_api_calls:
            - call: "POST /api/producers"
              payload: { npn: "NPN-2010", full_name: "Suspended Submitter", resident_state_code: "TX" }
              as: LicensingCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /api/inquiries"
              payload: { producer_id: "${p_id}", state_code: "TX", reference_number: "INQ-2010" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CarrierAdmin
            - call: "GET /api/producers/${p_id}"
              as: ComplianceOfficer
              captures: { p_st: $.data.status }
          trigger:
            - call: "POST /api/applications"
              payload: { producer_id: "${p_id}", state_code: "TX", line_of_authority: "LIFE", applicant_name: "Cheap", premium_cents: 100 }
              as: LicensingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "p_st == SUSPENDED before the trigger"
            - "err == ERR_PRODUCER_SUSPENDED (business_safety beats business_fiscal; 100 < 500 also holds but is masked)"
            - "No PolicyApplication is created for ${p_id} by the rejected call"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: ce_hours_exact_threshold_passes
        grounds:
          - calculations.ce_compliance_determination
          - validations[priority=10]
        distinguishing_aspect: |
          Numeric-hours boundary: exactly 24.0 completed hours (21 GENERAL + 3
          ETHICS) against a 24.0 / 3 requirement passes (>= is inclusive) and
          renewal succeeds. Metric: CE credit hours; endpoint: POST
          /api/licenses/{id}/renew.
        test_recipe:
          setup:
            - "Producer with CA RESIDENT LIFE license, period [2026-01-01, 2028-01-01], default requirement 24/3"
            - "ACCEPTED credits: 21 GENERAL + 3 ETHICS (exactly the threshold on both axes)"
            - "Clock at 2027-12-01 (inside renewal window)"
          setup_api_calls:
            - call: "POST /api/producers"
              payload: { npn: "NPN-2011", full_name: "Exact Hours", resident_state_code: "CA" }
              as: LicensingCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /api/licenses"
              payload: { producer_id: "${p_id}", state_code: "CA", license_class: "RESIDENT", lines_of_authority: ["LIFE"], issue_date: "2026-01-01T00:00:00Z", expiration_date: "2028-01-01T00:00:00Z" }
              as: LicensingCoordinator
              captures: { lic: $.data.id }
            - call: "POST /api/ce-credits"
              payload: { license_id: "${lic}", provider_name: "CEU", course_title: "Gen 21", category: "GENERAL", credit_hours: 21, completed_on: "2026-06-01T00:00:00Z" }
              as: LicensingCoordinator
              captures: { c1: $.data.id }
            - call: "POST /api/ce-credits/${c1}/review"
              payload: { decision: "ACCEPT" }
              as: LicensingCoordinator
            - call: "POST /api/ce-credits"
              payload: { license_id: "${lic}", provider_name: "CEU", course_title: "Eth 3", category: "ETHICS", credit_hours: 3, completed_on: "2026-06-02T00:00:00Z" }
              as: LicensingCoordinator
              captures: { c2: $.data.id }
            - call: "POST /api/ce-credits/${c2}/review"
              payload: { decision: "ACCEPT" }
              as: LicensingCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-12-01T00:00:00Z" }
              as: CarrierAdmin
            - call: "GET /api/licenses/${lic}"
              as: LicensingCoordinator
              captures: { lic_v: $.data.version, ce_tot: $.data.ce_completed_hours, ce_eth: $.data.ce_ethics_completed_hours }
          trigger:
            - call: "POST /api/licenses/${lic}/renew"
              payload: { expected_license_version: "${lic_v}" }
              as: LicensingCoordinator
              captures: { st: $.data.status, rc: $.data.renewed_count }
          assert:
            - "ce_tot == 24 and ce_eth == 3 before renewal (exact threshold, no margin)"
            - "Renewal succeeds at exact equality: st == ACTIVE and rc == 1"

      - name: jit_filing_on_deadline_vs_after
        grounds:
          - calculations.jit_filing_deadline
          - state_machines.Appointment.JIT_PENDING_to_LAPSED
        distinguishing_aspect: |
          Datetime boundary: filing at exactly submitted_at + 15 days is timely
          (<= inclusive) while one second later the sweep has lapsed the
          appointment and filing fails. Metric: seconds-precision datetime;
          endpoint: POST /api/appointments/{id}/file — different metric and
          endpoint from ce_hours_exact_threshold_passes.
        test_recipe:
          setup:
            - "Producer P1 and P2, each with ACTIVE CA LIFE license and each having submitted one application at 2026-08-01T00:00:00Z -> two JIT_PENDING appointments with jit_filing_deadline 2026-08-16T00:00:00Z"
          setup_api_calls:
            - call: "POST /api/producers"
              payload: { npn: "NPN-2012", full_name: "On Time", resident_state_code: "CA" }
              as: LicensingCoordinator
              captures: { p1: $.data.id }
            - call: "POST /api/licenses"
              payload: { producer_id: "${p1}", state_code: "CA", license_class: "RESIDENT", lines_of_authority: ["LIFE"], issue_date: "2026-01-01T00:00:00Z", expiration_date: "2028-01-01T00:00:00Z" }
              as: LicensingCoordinator
            - call: "POST /api/producers"
              payload: { npn: "NPN-2013", full_name: "One Second Late", resident_state_code: "CA" }
              as: LicensingCoordinator
              captures: { p2: $.data.id }
            - call: "POST /api/licenses"
              payload: { producer_id: "${p2}", state_code: "CA", license_class: "RESIDENT", lines_of_authority: ["LIFE"], issue_date: "2026-01-01T00:00:00Z", expiration_date: "2028-01-01T00:00:00Z" }
              as: LicensingCoordinator
            - call: "POST /api/applications"
              payload: { producer_id: "${p1}", state_code: "CA", line_of_authority: "LIFE", applicant_name: "A", premium_cents: 5000000 }
              as: LicensingCoordinator
              captures: { app1: $.data.id, jit1: $.data.jit_appointment_id }
            - call: "POST /api/applications"
              payload: { producer_id: "${p2}", state_code: "CA", line_of_authority: "LIFE", applicant_name: "B", premium_cents: 5000000 }
              as: LicensingCoordinator
              captures: { app2: $.data.id, jit2: $.data.jit_appointment_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T00:00:00Z" }
              as: CarrierAdmin
          trigger:
            - call: "POST /api/appointments/${jit1}/file"
              as: LicensingCoordinator
              captures: { f1_st: $.data.status, f1_deadline: $.data.jit_filing_deadline }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T00:00:01Z" }
              as: CarrierAdmin
            - call: "POST /api/appointments/${jit2}/file"
              as: LicensingCoordinator
              captures: { f2_err: $.data.error_id }
            - call: "GET /api/appointments/${jit2}"
              as: LicensingCoordinator
              captures: { jit2_st: $.data.status }
          assert:
            - "f1_deadline == 2026-08-16T00:00:00Z (submitted_at + 15 days)"
            - "Filing at exactly the deadline is timely: f1_st == ACTIVE"
            - "One second past the deadline the appointment is LAPSED: jit2_st == LAPSED"
            - "f2_err == ERR_JIT_FILING_WINDOW_CLOSED"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: application_approve_requires_license_active
        grounds:
          - state_machines.PolicyApplication.SUBMITTED_to_APPROVED
          - validations[priority=9]
        distinguishing_aspect: |
          Pair (PolicyApplication -> License): the APPROVE transition is
          guarded by the producer's License state; once the license lapses to
          EXPIRED the approve is rejected with ERR_LICENSE_NOT_ACTIVE.
        test_recipe:
          setup:
            - "Producer with CA LIFE license expiring 2027-01-01 and one SUBMITTED application (JIT appointment created at submission)"
            - "Clock swept to 2027-02-01: license is EXPIRED (and the JIT appointment has lapsed)"
          setup_api_calls:
            - call: "POST /api/producers"
              payload: { npn: "NPN-2014", full_name: "Gated Approve", resident_state_code: "CA" }
              as: LicensingCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /api/licenses"
              payload: { producer_id: "${p_id}", state_code: "CA", license_class: "RESIDENT", lines_of_authority: ["LIFE"], issue_date: "2026-01-01T00:00:00Z", expiration_date: "2027-01-01T00:00:00Z" }
              as: LicensingCoordinator
              captures: { lic: $.data.id }
            - call: "POST /api/applications"
              payload: { producer_id: "${p_id}", state_code: "CA", line_of_authority: "LIFE", applicant_name: "Gated", premium_cents: 5000000 }
              as: LicensingCoordinator
              captures: { app: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-01T00:00:00Z" }
              as: CarrierAdmin
            - call: "GET /api/licenses/${lic}"
              as: LicensingCoordinator
              captures: { lic_st: $.data.status }
          trigger:
            - call: "POST /api/applications/${app}/decide"
              payload: { decision: "APPROVE" }
              as: LicensingCoordinator
              captures: { err: $.data.error_id }
            - call: "GET /api/applications/${app}"
              as: LicensingCoordinator
              captures: { app_st: $.data.status }
          assert:
            - "lic_st == EXPIRED before the trigger"
            - "err == ERR_LICENSE_NOT_ACTIVE"
            - "app_st == SUBMITTED (failed guard leaves the application untouched)"

      - name: commission_release_requires_appointment_active
        grounds:
          - state_machines.CommissionEntry.HELD_to_PAYABLE
          - validations[priority=11]
        distinguishing_aspect: |
          Pair (CommissionEntry -> Appointment): releasing an
          APPOINTMENT_PENDING hold is guarded by an ACTIVE appointment covering
          the application's state+LOA; rejected while the JIT appointment is
          still JIT_PENDING, allowed after it is filed. Different entity pair
          from application_approve_requires_license_active.
        test_recipe:
          setup:
            - "Producer with ACTIVE CA LIFE license (no appointment) and one application submitted at 2026-08-01 -> JIT_PENDING appointment; CommissionEntry HELD with hold_reason APPOINTMENT_PENDING"
          setup_api_calls:
            - call: "POST /api/producers"
              payload: { npn: "NPN-2015", full_name: "Held Commission", resident_state_code: "CA" }
              as: LicensingCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /api/licenses"
              payload: { producer_id: "${p_id}", state_code: "CA", license_class: "RESIDENT", lines_of_authority: ["LIFE"], issue_date: "2026-01-01T00:00:00Z", expiration_date: "2028-01-01T00:00:00Z" }
              as: LicensingCoordinator
            - call: "POST /api/applications"
              payload: { producer_id: "${p_id}", state_code: "CA", line_of_authority: "LIFE", applicant_name: "Held", premium_cents: 10000000 }
              as: LicensingCoordinator
              captures: { app: $.data.id, jit: $.data.jit_appointment_id }
            - call: "GET /api/commission-entries"
              payload: { application_id: "${app}" }
              as: LicensingCoordinator
              captures: { e: "$.data[0].id", e_st0: "$.data[0].status", e_hr0: "$.data[0].hold_reason" }
          trigger:
            - call: "POST /api/commission-entries/${e}/release"
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
            - call: "POST /api/appointments/${jit}/file"
              as: LicensingCoordinator
              captures: { jit_st: $.data.status }
            - call: "POST /api/commission-entries/${e}/release"
              as: ComplianceOfficer
              captures: { e_st1: $.data.status, e_hr1: $.data.hold_reason }
            - call: "GET /api/producers/${p_id}"
              as: LicensingCoordinator
              captures: { held: $.data.commission_held_cents }
          assert:
            - "e_st0 == HELD and e_hr0 == APPOINTMENT_PENDING"
            - "First release rejected: err == ERR_APPOINTMENT_NOT_ACTIVE (JIT appointment still JIT_PENDING)"
            - "jit_st == ACTIVE after filing"
            - "Second release succeeds: e_st1 == PAYABLE and e_hr1 == null"
            - "held == 0 (Producer.commission_held_cents recomputed)"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: appointment_refile_adjacency_half_open
        grounds:
          - validations[priority=18]
          - entities.Appointment.fields.effective_date
        distinguishing_aspect: |
          Half-open interval semantics on Appointment: a re-appointment whose
          effective_date equals the prior appointment's termination_date is
          ADJACENT and allowed, while one day earlier falls inside
          [effective_date, termination_date) and is rejected. Resource:
          Appointment; semantics: adjacency-allowed half-open.
        test_recipe:
          setup:
            - "Producer with ACTIVE CA LIFE license"
            - "Appointment A1 [2026-08-01, 2026-08-20): filed ACTIVE at default clock, terminated VOLUNTARY, termination filed at clock 2026-08-20 -> TERMINATED with termination_date 2026-08-20T00:00:00Z"
          setup_api_calls:
            - call: "POST /api/producers"
              payload: { npn: "NPN-2016", full_name: "Refile", resident_state_code: "CA" }
              as: LicensingCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /api/licenses"
              payload: { producer_id: "${p_id}", state_code: "CA", license_class: "RESIDENT", lines_of_authority: ["LIFE"], issue_date: "2026-01-01T00:00:00Z", expiration_date: "2028-01-01T00:00:00Z" }
              as: LicensingCoordinator
            - call: "POST /api/appointments"
              payload: { producer_id: "${p_id}", state_code: "CA", lines_of_authority: ["LIFE"], effective_date: "2026-08-01T00:00:00Z" }
              as: LicensingCoordinator
              captures: { a1: $.data.id }
            - call: "POST /api/appointments/${a1}/file"
              as: LicensingCoordinator
            - call: "POST /api/appointments/${a1}/terminate"
              payload: { termination_reason: "VOLUNTARY" }
              as: LicensingCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: CarrierAdmin
            - call: "POST /api/appointments/${a1}/file-termination"
              as: LicensingCoordinator
              captures: { a1_st: $.data.status, a1_term: $.data.termination_date }
          trigger:
            - call: "POST /api/appointments"
              payload: { producer_id: "${p_id}", state_code: "CA", lines_of_authority: ["LIFE"], effective_date: "2026-08-19T00:00:00Z" }
              as: LicensingCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /api/appointments"
              payload: { producer_id: "${p_id}", state_code: "CA", lines_of_authority: ["LIFE"], effective_date: "2026-08-20T00:00:00Z" }
              as: LicensingCoordinator
              captures: { a2: $.data.id, a2_st: $.data.status, a2_eff: $.data.effective_date }
          assert:
            - "a1_st == TERMINATED and a1_term == 2026-08-20T00:00:00Z"
            - "err == ERR_APPOINTMENT_INTERVAL_OVERLAP (2026-08-19 inside [2026-08-01, 2026-08-20))"
            - "Adjacency allowed at the boundary: a2_st == REQUESTED and a2_eff == 2026-08-20T00:00:00Z"

      - name: probation_spacing_buffer_365_days
        grounds:
          - validations[priority=20]
          - state_machines.RegulatoryAction.REPORTED_to_CONFIRMED
        distinguishing_aspect: |
          Buffer semantics on RegulatoryAction: two CONFIRMED PROBATION actions
          for the same subject+state must have effective_dates >= 365 days
          apart — 364 days is rejected, exactly 365 passes. Adjacency is NOT
          allowed (mandatory gap), a different interval semantics from
          appointment_refile_adjacency_half_open, on a different resource.
        test_recipe:
          setup:
            - "Producer with one CONFIRMED PROBATION action in CA effective 2025-01-01"
            - "Two further REPORTED PROBATION actions: effective 2025-12-31 (364 days later) and 2026-01-01 (exactly 365 days later)"
          setup_api_calls:
            - call: "POST /api/producers"
              payload: { npn: "NPN-2017", full_name: "Probationer", resident_state_code: "CA" }
              as: LicensingCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /api/regulatory-actions"
              payload: { producer_id: "${p_id}", state_code: "CA", action_type: "PROBATION", effective_date: "2025-01-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { ra1: $.data.id }
            - call: "POST /api/regulatory-actions/${ra1}/confirm"
              as: ComplianceOfficer
              as_user_id: "officer-b"
              captures: { ra1_st: $.data.status }
            - call: "POST /api/regulatory-actions"
              payload: { producer_id: "${p_id}", state_code: "CA", action_type: "PROBATION", effective_date: "2025-12-31T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { ra2: $.data.id }
            - call: "POST /api/regulatory-actions"
              payload: { producer_id: "${p_id}", state_code: "CA", action_type: "PROBATION", effective_date: "2026-01-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { ra3: $.data.id }
          trigger:
            - call: "POST /api/regulatory-actions/${ra2}/confirm"
              as: ComplianceOfficer
              as_user_id: "officer-b"
              captures: { err2: $.data.error_id }
            - call: "GET /api/regulatory-actions/${ra2}"
              as: ComplianceOfficer
              captures: { ra2_st: $.data.status }
            - call: "POST /api/regulatory-actions/${ra3}/confirm"
              as: ComplianceOfficer
              as_user_id: "officer-b"
              captures: { ra3_st: $.data.status }
          assert:
            - "ra1_st == CONFIRMED"
            - "err2 == ERR_PROBATION_SPACING (364-day gap < 365-day buffer) and ra2_st == REPORTED"
            - "ra3_st == CONFIRMED (exactly 365 days satisfies the inclusive buffer)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: commission_hold_release_bucket_conservation
        grounds:
          - state_machines.CommissionEntry.PAYABLE_to_HELD
          - state_machines.CommissionEntry.HELD_to_PAYABLE
          - entities.Producer.fields.commission_held_cents
        distinguishing_aspect: |
          Conserved quantity: total commission cents across status buckets.
          The forward action (regulatory cascade PAYABLE -> HELD) paired with
          its compensating action (license reinstate + release HELD -> PAYABLE)
          leaves amount_cents == 1200000 untouched; only the bucket (and the
          derived commission_held_cents 0 -> 1200000 -> 0) moves.
        test_recipe:
          setup:
            - "Producer with ACTIVE CA PROPERTY license, ACTIVE own appointment, one ISSUED application (premium 10000000) whose CommissionEntry is PAYABLE with amount_cents 1200000"
            - "A REPORTED SUSPENSION action in CA (officer-a), confirmed by officer-b -> cascade holds the entry"
          setup_api_calls:
            - call: "POST /api/producers"
              payload: { npn: "NPN-2018", full_name: "Bucket Conserver", resident_state_code: "CA" }
              as: LicensingCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /api/licenses"
              payload: { producer_id: "${p_id}", state_code: "CA", license_class: "RESIDENT", lines_of_authority: ["PROPERTY"], issue_date: "2026-01-01T00:00:00Z", expiration_date: "2028-01-01T00:00:00Z" }
              as: LicensingCoordinator
              captures: { lic: $.data.id }
            - call: "POST /api/appointments"
              payload: { producer_id: "${p_id}", state_code: "CA", lines_of_authority: ["PROPERTY"], effective_date: "2026-01-15T00:00:00Z" }
              as: LicensingCoordinator
              captures: { appt: $.data.id }
            - call: "POST /api/appointments/${appt}/file"
              as: LicensingCoordinator
            - call: "POST /api/applications"
              payload: { producer_id: "${p_id}", state_code: "CA", line_of_authority: "PROPERTY", applicant_name: "Risk", premium_cents: 10000000 }
              as: LicensingCoordinator
              captures: { app: $.data.id }
            - call: "POST /api/applications/${app}/decide"
              payload: { decision: "APPROVE" }
              as: LicensingCoordinator
            - call: "POST /api/applications/${app}/issue"
              as: LicensingCoordinator
            - call: "GET /api/commission-entries"
              payload: { application_id: "${app}" }
              as: LicensingCoordinator
              captures: { e: "$.data[0].id", amt0: "$.data[0].amount_cents", st0: "$.data[0].status" }
            - call: "POST /api/regulatory-actions"
              payload: { producer_id: "${p_id}", state_code: "CA", action_type: "SUSPENSION", effective_date: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { ra: $.data.id }
            - call: "POST /api/regulatory-actions/${ra}/confirm"
              as: ComplianceOfficer
              as_user_id: "officer-b"
            - call: "GET /api/producers/${p_id}"
              as: ComplianceOfficer
              captures: { held1: $.data.commission_held_cents }
          trigger:
            - call: "POST /api/commission-entries/${e}/release"
              as: ComplianceOfficer
              captures: { err_hold: $.data.error_id }
            - call: "POST /api/licenses/${lic}/reinstate"
              as: ComplianceOfficer
              captures: { lic_st: $.data.status }
            - call: "POST /api/commission-entries/${e}/release"
              as: ComplianceOfficer
              captures: { st2: $.data.status, hr2: $.data.hold_reason, amt2: $.data.amount_cents }
            - call: "GET /api/producers/${p_id}"
              as: ComplianceOfficer
              captures: { held2: $.data.commission_held_cents }
          assert:
            - "amt0 == 1200000 and st0 == PAYABLE before the cascade"
            - "held1 == 1200000 after the confirm cascade (bucket moved, nothing created or destroyed)"
            - "err_hold == ERR_REGULATORY_HOLD_ACTIVE (release blocked while license SUSPENDED)"
            - "lic_st == ACTIVE after reinstate"
            - "Round trip conserves the quantity: st2 == PAYABLE, hr2 == null, amt2 == 1200000, held2 == 0"

      - name: ytd_premium_issue_rescind_reconciliation
        grounds:
          - calculations.producer_ytd_issued_premium
          - state_machines.PolicyApplication.ISSUED_to_RESCINDED
          - entities.Producer.fields.ytd_issued_premium_cents
        distinguishing_aspect: |
          Conserved quantity: derived-vs-source reconciliation — the forward
          action (issue) and its compensating action (rescind) leave
          Producer.ytd_issued_premium_cents equal to SUM(premium_cents) over
          ISSUED applications at every step (75000000 after issue, 0 after
          rescind). Different quantity type from
          commission_hold_release_bucket_conservation (filtered-set aggregate
          vs status-bucket sum).
        test_recipe:
          setup:
            - "Producer with ACTIVE CA LIFE license and ACTIVE own appointment; one APPROVED application (premium 75000000)"
          setup_api_calls:
            - call: "POST /api/producers"
              payload: { npn: "NPN-2019", full_name: "Ytd Reconciler", resident_state_code: "CA" }
              as: LicensingCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /api/licenses"
              payload: { producer_id: "${p_id}", state_code: "CA", license_class: "RESIDENT", lines_of_authority: ["LIFE"], issue_date: "2026-01-01T00:00:00Z", expiration_date: "2028-01-01T00:00:00Z" }
              as: LicensingCoordinator
            - call: "POST /api/appointments"
              payload: { producer_id: "${p_id}", state_code: "CA", lines_of_authority: ["LIFE"], effective_date: "2026-01-15T00:00:00Z" }
              as: LicensingCoordinator
              captures: { appt: $.data.id }
            - call: "POST /api/appointments/${appt}/file"
              as: LicensingCoordinator
            - call: "POST /api/applications"
              payload: { producer_id: "${p_id}", state_code: "CA", line_of_authority: "LIFE", applicant_name: "Reconcile", premium_cents: 75000000 }
              as: LicensingCoordinator
              captures: { app: $.data.id }
            - call: "POST /api/applications/${app}/decide"
              payload: { decision: "APPROVE" }
              as: LicensingCoordinator
          trigger:
            - call: "POST /api/applications/${app}/issue"
              as: LicensingCoordinator
              captures: { st1: $.data.status }
            - call: "GET /api/producers/${p_id}"
              as: LicensingCoordinator
              captures: { ytd1: $.data.ytd_issued_premium_cents }
            - call: "POST /api/applications/${app}/rescind"
              as: LicensingCoordinator
              captures: { st2: $.data.status }
            - call: "GET /api/producers/${p_id}"
              as: LicensingCoordinator
              captures: { ytd2: $.data.ytd_issued_premium_cents }
            - call: "GET /api/commission-entries"
              payload: { application_id: "${app}" }
              as: LicensingCoordinator
              captures: { e_st: "$.data[0].status" }
          assert:
            - "st1 == ISSUED and ytd1 == 75000000 (== SUM(premium_cents) over ISSUED applications)"
            - "st2 == RESCINDED and ytd2 == 0 (compensating action restores the aggregate: zero ISSUED applications remain)"
            - "e_st == FORFEITED (rescission forfeits the commission)"
