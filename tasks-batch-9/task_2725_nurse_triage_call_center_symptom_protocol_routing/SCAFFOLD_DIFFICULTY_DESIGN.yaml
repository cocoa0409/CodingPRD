# ============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 2725 — Nurse Triage Call Center & Symptom Protocol Routing
#
# Nine §0.5 rule_ids, each with at least two differentiated instances.
# Every numeric literal in every `assert:` line was computed from the
# §1.3 formulas and their `constants:` before being written here.
# Logical clock default on a fresh server: 2026-08-01T00:00:00Z (Saturday).
# 2026-08-03 is a Monday; the practice office window used below is
# 13:00-22:00 UTC, so 2026-08-03T14:30:00Z is in-hours and
# 2026-08-01T14:30:00Z is after-hours.
# ============================================================================

scaffold_difficulty_design:

  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: acuity_provisional_stated_age_vs_confirmed_dob_crosses_emergency_band
        grounds:
          - calculations.assessment_acuity_score.variants.intake_provisional
          - calculations.assessment_acuity_score.variants.nurse_confirmed
          - calculations.disposition_recommendation
          - entities.ProtocolAssessment.fields.age_years_used
          - entities.ProtocolAssessment.fields.acuity_score
          - endpoints[POST /triage-calls/{id}/assessments]
        distinguishing_aspect: "Clinical-scoring domain (ProtocolAssessment): the same 77-year-old caller who self-reports 'sixty' scores 78 provisionally and 90 once the nurse confirms against Patient.dob, which is the difference between a recommended ED_NOW and a recommended EMERGENCY_911."
        test_recipe:
          setup:
            - "One practice with office hours 13:00-22:00 UTC and the clock parked at 2026-08-03T14:30:00Z (Monday, in-hours)."
            - "One nurse licensed in CA, on an ACTIVE shift, max_concurrent_calls 2, high_risk_cap 2."
            - "One protocol with base_severity 62, pregnancy_sensitive false, emergency_override false, min_disposition_level HOME_CARE."
            - "One patient born 1948-09-10, so the dob-derived age at the clock date is exactly 77."
            - "Two separate calls for that patient, both matched, consented and assigned to the same nurse."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T14:30:00Z" }
              as: PlatformAdmin
            - call: "POST /practices"
              payload: { name: "Northside Family Health", office_open_utc_hhmm: "13:00", office_close_utc_hhmm: "22:00", per_minute_rate_millicents: 4225, weekend_is_after_hours: true, consent_recording_required: false, variance_review_threshold: 1, audit_period_start_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { practice_id: $.data.id }
            - call: "POST /nurses"
              payload: { full_name: "Nora Vance", seniority_level: 3, max_concurrent_calls: 2, high_risk_cap: 2 }
              as: PlatformAdmin
              captures: { nurse_a_id: $.data.id }
            - call: "POST /nurses/${nurse_a_id}/licenses"
              payload: { state_code: "CA", license_number: "CA-11111", expires_on: "2027-01-31" }
              as: PlatformAdmin
            - call: "POST /nurses/${nurse_a_id}/shifts"
              payload: { start_utc: "2026-08-03T12:00:00Z", end_utc: "2026-08-03T20:00:00Z" }
              as: PlatformAdmin
            - call: "POST /symptom-protocols"
              payload: { code: "CHEST-PAIN", title: "Chest Pain In Adults", base_severity: 62, min_age_years: 0, max_age_years: 120, pregnancy_sensitive: false, emergency_override: false, min_disposition_level: "HOME_CARE", infant_modifier_points: 22 }
              as: PlatformAdmin
              captures: { protocol_id: $.data.id }
            - call: "POST /practices/${practice_id}/patients"
              payload: { full_name: "Harold Pike", dob: "1948-09-10", sex: "MALE", pregnancy_status: "NOT_APPLICABLE", phone: "+14155550101", mrn: "MRN-0002" }
              as: PlatformAdmin
              captures: { patient_id: $.data.id }
            - call: "POST /triage-calls"
              payload: { practice_id: "${practice_id}", caller_name: "Harold Pike", caller_phone: "+14155550101", caller_state_code: "CA", caller_relationship: "SELF", reason_text: "chest tightness" }
              as: IntakeAgent
              captures: { call_prov_id: $.data.id }
            - call: "POST /triage-calls/${call_prov_id}/match-patient"
              payload: { patient_id: "${patient_id}", match_method: "MRN" }
              as: IntakeAgent
            - call: "POST /triage-calls/${call_prov_id}/consent"
              payload: { consent_type: "PATIENT_SELF", consent_given_by: "Harold Pike" }
              as: IntakeAgent
            - call: "POST /triage-calls/${call_prov_id}/assign-nurse"
              payload: { preferred_nurse_id: "${nurse_a_id}" }
              as: IntakeAgent
            - call: "POST /triage-calls"
              payload: { practice_id: "${practice_id}", caller_name: "Harold Pike", caller_phone: "+14155550101", caller_state_code: "CA", caller_relationship: "SELF", reason_text: "chest tightness returned" }
              as: IntakeAgent
              captures: { call_conf_id: $.data.id }
            - call: "POST /triage-calls/${call_conf_id}/match-patient"
              payload: { patient_id: "${patient_id}", match_method: "MRN" }
              as: IntakeAgent
            - call: "POST /triage-calls/${call_conf_id}/consent"
              payload: { consent_type: "PATIENT_SELF", consent_given_by: "Harold Pike" }
              as: IntakeAgent
            - call: "POST /triage-calls/${call_conf_id}/assign-nurse"
              payload: { preferred_nurse_id: "${nurse_a_id}" }
              as: IntakeAgent
          trigger:
            - call: "POST /triage-calls/${call_prov_id}/assessments"
              payload: { protocol_id: "${protocol_id}", confirmation_mode: "PROVISIONAL", red_flag_count: 2, stated_age_years: 60 }
              as: TriageNurse
              as_user_id: "${nurse_a_id}"
              captures: { assessment_prov_id: $.data.id }
            - call: "POST /triage-calls/${call_conf_id}/assessments"
              payload: { protocol_id: "${protocol_id}", confirmation_mode: "CONFIRMED", red_flag_count: 2, confirmed_pregnancy_status: "NOT_APPLICABLE" }
              as: TriageNurse
              as_user_id: "${nurse_a_id}"
              captures: { assessment_conf_id: $.data.id }
            - call: "GET /triage-calls/${call_prov_id}"
              as: TriageNurse
              as_user_id: "${nurse_a_id}"
              captures: { call_prov_version: $.data.version }
            - call: "GET /triage-calls/${call_conf_id}"
              as: TriageNurse
              as_user_id: "${nurse_a_id}"
              captures: { call_conf_version: $.data.version }
            - call: "POST /dispositions"
              payload: { call_id: "${call_prov_id}", assessment_id: "${assessment_prov_id}", final_level: "ED_NOW", expected_call_version: "${call_prov_version}" }
              as: TriageNurse
              as_user_id: "${nurse_a_id}"
              captures: { disposition_prov_id: $.data.id }
            - call: "POST /dispositions"
              payload: { call_id: "${call_conf_id}", assessment_id: "${assessment_conf_id}", final_level: "EMERGENCY_911", expected_call_version: "${call_conf_version}" }
              as: TriageNurse
              as_user_id: "${nurse_a_id}"
              captures: { disposition_conf_id: $.data.id }
          assert:
            - "ProtocolAssessment.${assessment_prov_id}.age_years_used == 60"
            - "ProtocolAssessment.${assessment_prov_id}.age_modifier_points == 0"
            - "ProtocolAssessment.${assessment_prov_id}.red_flag_points == 16"
            - "ProtocolAssessment.${assessment_prov_id}.acuity_score == 78"
            - "ProtocolAssessment.${assessment_conf_id}.age_years_used == 77"
            - "ProtocolAssessment.${assessment_conf_id}.age_modifier_points == 12"
            - "ProtocolAssessment.${assessment_conf_id}.acuity_score == 90"
            - "Disposition.${disposition_prov_id}.recommended_level == ED_NOW"
            - "Disposition.${disposition_conf_id}.recommended_level == EMERGENCY_911"
            - "Disposition.${disposition_prov_id}.is_override == false"
            - "Disposition.${disposition_conf_id}.is_override == false"
            - "TriageCall.${call_prov_id}.requires_warm_transfer == false"
            - "TriageCall.${call_conf_id}.requires_warm_transfer == true"

      - name: concordance_strict_vs_band_tolerant_diverge_on_one_ordinal_gap
        grounds:
          - calculations.practice_concordance_rate.variants.strict_level_match
          - calculations.practice_concordance_rate.variants.band_tolerant
          - calculations.outcome_variance_classification
          - endpoints[GET /practices/{id}/compliance-summary]
          - entities.ComplianceAuditRecord.fields.variance_severity_points
        distinguishing_aspect: "Compliance-aggregation domain (Practice), not clinical scoring: a single audit record whose outcome sits exactly one ordinal above the advice given drives concordance_rate_strict_pct to 0.0 and concordance_rate_band_tolerant_pct to 100.0 in the same response."
        test_recipe:
          setup:
            - "Practice with variance_review_threshold 1 and audit_period_start_utc 2026-08-01T00:00:00Z."
            - "Two triage nurses: the one who gives the advice and a second one who performs the verification (segregation of duties)."
            - "One in-hours call scored to acuity 70, dispositioned ED_NOW, whose HIGH_RISK callback is reached and verified IMPROVED before its 2-hour due time."
            - "One audit record reporting ED_ADMITTED (ordinal 5) against final_level ED_NOW (ordinal 4)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T14:30:00Z" }
              as: PlatformAdmin
            - call: "POST /practices"
              payload: { name: "Northside Family Health", office_open_utc_hhmm: "13:00", office_close_utc_hhmm: "22:00", per_minute_rate_millicents: 4225, weekend_is_after_hours: true, consent_recording_required: false, variance_review_threshold: 1, audit_period_start_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { practice_id: $.data.id }
            - call: "POST /nurses"
              payload: { full_name: "Nora Vance", seniority_level: 3, max_concurrent_calls: 2, high_risk_cap: 2 }
              as: PlatformAdmin
              captures: { nurse_a_id: $.data.id }
            - call: "POST /nurses/${nurse_a_id}/licenses"
              payload: { state_code: "CA", license_number: "CA-11111", expires_on: "2027-01-31" }
              as: PlatformAdmin
            - call: "POST /nurses/${nurse_a_id}/shifts"
              payload: { start_utc: "2026-08-03T12:00:00Z", end_utc: "2026-08-03T20:00:00Z" }
              as: PlatformAdmin
            - call: "POST /nurses"
              payload: { full_name: "Cira Lund", seniority_level: 2, max_concurrent_calls: 2, high_risk_cap: 2 }
              as: PlatformAdmin
              captures: { nurse_c_id: $.data.id }
            - call: "POST /nurses/${nurse_c_id}/licenses"
              payload: { state_code: "CA", license_number: "CA-33333", expires_on: "2027-01-31" }
              as: PlatformAdmin
            - call: "POST /symptom-protocols"
              payload: { code: "CHEST-PAIN", title: "Chest Pain In Adults", base_severity: 62, min_age_years: 0, max_age_years: 120, pregnancy_sensitive: false, emergency_override: false, min_disposition_level: "HOME_CARE", infant_modifier_points: 22 }
              as: PlatformAdmin
              captures: { protocol_id: $.data.id }
            - call: "POST /practices/${practice_id}/patients"
              payload: { full_name: "Dana Reyes", dob: "1990-03-15", sex: "FEMALE", pregnancy_status: "NOT_PREGNANT", phone: "+14155550100", mrn: "MRN-0001" }
              as: PlatformAdmin
              captures: { patient_id: $.data.id }
            - call: "POST /triage-calls"
              payload: { practice_id: "${practice_id}", caller_name: "Dana Reyes", caller_phone: "+14155550100", caller_state_code: "CA", caller_relationship: "SELF", reason_text: "chest discomfort" }
              as: IntakeAgent
              captures: { call_id: $.data.id }
            - call: "POST /triage-calls/${call_id}/match-patient"
              payload: { patient_id: "${patient_id}", match_method: "MRN" }
              as: IntakeAgent
            - call: "POST /triage-calls/${call_id}/consent"
              payload: { consent_type: "PATIENT_SELF", consent_given_by: "Dana Reyes" }
              as: IntakeAgent
            - call: "POST /triage-calls/${call_id}/assign-nurse"
              payload: { preferred_nurse_id: "${nurse_a_id}" }
              as: IntakeAgent
            - call: "POST /triage-calls/${call_id}/assessments"
              payload: { protocol_id: "${protocol_id}", confirmation_mode: "CONFIRMED", red_flag_count: 1, confirmed_pregnancy_status: "NOT_PREGNANT" }
              as: TriageNurse
              as_user_id: "${nurse_a_id}"
              captures: { assessment_id: $.data.id }
            - call: "GET /triage-calls/${call_id}"
              as: TriageNurse
              as_user_id: "${nurse_a_id}"
              captures: { call_version: $.data.version }
            - call: "POST /dispositions"
              payload: { call_id: "${call_id}", assessment_id: "${assessment_id}", final_level: "ED_NOW", expected_call_version: "${call_version}" }
              as: TriageNurse
              as_user_id: "${nurse_a_id}"
              captures: { disposition_id: $.data.id }
            - call: "GET /callback-tasks?disposition_id=${disposition_id}"
              as: TriageNurse
              as_user_id: "${nurse_a_id}"
              captures: { callback_id: "$.data[0].id" }
            - call: "POST /callback-tasks/${callback_id}/attempts"
              payload: { outcome: "REACHED" }
              as: TriageNurse
              as_user_id: "${nurse_a_id}"
            - call: "POST /callback-tasks/${callback_id}/verify"
              payload: { patient_condition: "IMPROVED", advice_followed: true, verifier_attestation: "Caller went to the emergency department as advised and reports feeling better." }
              as: TriageNurse
              as_user_id: "${nurse_c_id}"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T19:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dispositions/${disposition_id}/audit-records"
              payload: { reported_outcome: "ED_ADMITTED", outcome_source: "ED_FEED", outcome_observed_at: "2026-08-03T18:00:00Z" }
              as: ComplianceAuditor
              captures: { audit_record_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T20:00:00Z" }
              as: PlatformAdmin
            - call: "GET /practices/${practice_id}/compliance-summary"
              as: ComplianceAuditor
              captures: { strict_rate: $.data.concordance_rate_strict_pct, band_rate: $.data.concordance_rate_band_tolerant_pct, audited: $.data.audited_count }
          assert:
            - "ComplianceAuditRecord.${audit_record_id}.outcome_ordinal == 5"
            - "ComplianceAuditRecord.${audit_record_id}.disposition_level_ordinal == 4"
            - "ComplianceAuditRecord.${audit_record_id}.variance_class == UNDERTRIAGE"
            - "ComplianceAuditRecord.${audit_record_id}.variance_severity_points == 7"
            - "${audited} == 1"
            - "${strict_rate} == 0.0"
            - "${band_rate} == 100.0"
            - "GET /practices/${practice_id}/compliance-summary returns concordant_count_strict == 0 and concordant_count_band_tolerant == 1"
            - "GET /practices/${practice_id}/compliance-summary returns undertriage_count == 1 and overtriage_count == 0"
            - "GET /practices/${practice_id}/compliance-summary returns variance_severity_points_total == 7"
            - "Disposition.${disposition_id}.audit_status == VARIANCE_ESCALATED"
            - "Practice.${practice_id}.open_variance_count == 1"
            - "Practice.${practice_id}.compliance_posture == UNDER_REVIEW"

  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:

      # ---- mode (a): multi-step conditional routing ------------------------
      - name: disposition_routing_step_two_override_beats_band_and_step_five_floor_lifts_home_care
        grounds:
          - calculations.disposition_recommendation
          - entities.SymptomProtocol.fields.emergency_override
          - entities.SymptomProtocol.fields.min_disposition_level
          - calculations.callback_requirement
          - endpoints[POST /dispositions]
        distinguishing_aspect: "Mode (a) — multi-step conditional routing: on one and the same protocol, a single red flag makes step 2 promote an acuity-28 HOME_CARE band all the way to EMERGENCY_911, while zero red flags leaves step 2 inert and lets step 5's protocol floor lift the acuity-20 HOME_CARE band to OFFICE_APPT_72H. Re-ordering the steps changes both answers."
        test_recipe:
          setup:
            - "Clock at 2026-08-03T14:30:00Z (Monday, in-hours), practice office hours 13:00-22:00 UTC."
            - "One protocol with base_severity 20, emergency_override true and min_disposition_level OFFICE_APPT_72H."
            - "One 36-year-old patient and two calls, both assigned to the same nurse (max_concurrent_calls 2, high_risk_cap 2)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T14:30:00Z" }
              as: PlatformAdmin
            - call: "POST /practices"
              payload: { name: "Northside Family Health", office_open_utc_hhmm: "13:00", office_close_utc_hhmm: "22:00", per_minute_rate_millicents: 4225, weekend_is_after_hours: true, consent_recording_required: false, variance_review_threshold: 1, audit_period_start_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { practice_id: $.data.id }
            - call: "POST /nurses"
              payload: { full_name: "Nora Vance", seniority_level: 3, max_concurrent_calls: 2, high_risk_cap: 2 }
              as: PlatformAdmin
              captures: { nurse_a_id: $.data.id }
            - call: "POST /nurses/${nurse_a_id}/licenses"
              payload: { state_code: "CA", license_number: "CA-11111", expires_on: "2027-01-31" }
              as: PlatformAdmin
            - call: "POST /nurses/${nurse_a_id}/shifts"
              payload: { start_utc: "2026-08-03T12:00:00Z", end_utc: "2026-08-03T20:00:00Z" }
              as: PlatformAdmin
            - call: "POST /symptom-protocols"
              payload: { code: "ABD-PAIN-OVR", title: "Abdominal Pain With Red Flag Override", base_severity: 20, min_age_years: 0, max_age_years: 120, pregnancy_sensitive: false, emergency_override: true, min_disposition_level: "OFFICE_APPT_72H", infant_modifier_points: 22 }
              as: PlatformAdmin
              captures: { protocol_id: $.data.id }
            - call: "POST /practices/${practice_id}/patients"
              payload: { full_name: "Dana Reyes", dob: "1990-03-15", sex: "FEMALE", pregnancy_status: "NOT_PREGNANT", phone: "+14155550100", mrn: "MRN-0001" }
              as: PlatformAdmin
              captures: { patient_id: $.data.id }
            - call: "POST /triage-calls"
              payload: { practice_id: "${practice_id}", caller_name: "Dana Reyes", caller_phone: "+14155550100", caller_state_code: "CA", caller_relationship: "SELF", reason_text: "abdominal pain with rigid abdomen" }
              as: IntakeAgent
              captures: { call_flag_id: $.data.id }
            - call: "POST /triage-calls/${call_flag_id}/match-patient"
              payload: { patient_id: "${patient_id}", match_method: "MRN" }
              as: IntakeAgent
            - call: "POST /triage-calls/${call_flag_id}/consent"
              payload: { consent_type: "PATIENT_SELF", consent_given_by: "Dana Reyes" }
              as: IntakeAgent
            - call: "POST /triage-calls/${call_flag_id}/assign-nurse"
              payload: { preferred_nurse_id: "${nurse_a_id}" }
              as: IntakeAgent
            - call: "POST /triage-calls"
              payload: { practice_id: "${practice_id}", caller_name: "Dana Reyes", caller_phone: "+14155550100", caller_state_code: "CA", caller_relationship: "SELF", reason_text: "mild abdominal pain, no red flags" }
              as: IntakeAgent
              captures: { call_plain_id: $.data.id }
            - call: "POST /triage-calls/${call_plain_id}/match-patient"
              payload: { patient_id: "${patient_id}", match_method: "MRN" }
              as: IntakeAgent
            - call: "POST /triage-calls/${call_plain_id}/consent"
              payload: { consent_type: "PATIENT_SELF", consent_given_by: "Dana Reyes" }
              as: IntakeAgent
            - call: "POST /triage-calls/${call_plain_id}/assign-nurse"
              payload: { preferred_nurse_id: "${nurse_a_id}" }
              as: IntakeAgent
          trigger:
            - call: "POST /triage-calls/${call_flag_id}/assessments"
              payload: { protocol_id: "${protocol_id}", confirmation_mode: "CONFIRMED", red_flag_count: 1, confirmed_pregnancy_status: "NOT_PREGNANT" }
              as: TriageNurse
              as_user_id: "${nurse_a_id}"
              captures: { assessment_flag_id: $.data.id }
            - call: "POST /triage-calls/${call_plain_id}/assessments"
              payload: { protocol_id: "${protocol_id}", confirmation_mode: "CONFIRMED", red_flag_count: 0, confirmed_pregnancy_status: "NOT_PREGNANT" }
              as: TriageNurse
              as_user_id: "${nurse_a_id}"
              captures: { assessment_plain_id: $.data.id }
            - call: "GET /triage-calls/${call_flag_id}"
              as: TriageNurse
              as_user_id: "${nurse_a_id}"
              captures: { call_flag_version: $.data.version }
            - call: "GET /triage-calls/${call_plain_id}"
              as: TriageNurse
              as_user_id: "${nurse_a_id}"
              captures: { call_plain_version: $.data.version }
            - call: "POST /dispositions"
              payload: { call_id: "${call_flag_id}", assessment_id: "${assessment_flag_id}", final_level: "EMERGENCY_911", expected_call_version: "${call_flag_version}" }
              as: TriageNurse
              as_user_id: "${nurse_a_id}"
              captures: { disposition_flag_id: $.data.id }
            - call: "POST /dispositions"
              payload: { call_id: "${call_plain_id}", assessment_id: "${assessment_plain_id}", final_level: "OFFICE_APPT_72H", expected_call_version: "${call_plain_version}" }
              as: TriageNurse
              as_user_id: "${nurse_a_id}"
              captures: { disposition_plain_id: $.data.id }
            - call: "GET /callback-tasks?disposition_id=${disposition_flag_id}"
              as: TriageNurse
              as_user_id: "${nurse_a_id}"
              captures: { callback_flag_id: "$.data[0].id" }
            - call: "GET /callback-tasks?disposition_id=${disposition_plain_id}"
              as: TriageNurse
              as_user_id: "${nurse_a_id}"
              captures: { callback_plain_id: "$.data[0].id" }
          assert:
            - "ProtocolAssessment.${assessment_flag_id}.acuity_score == 28"
            - "ProtocolAssessment.${assessment_plain_id}.acuity_score == 20"
            - "Disposition.${disposition_flag_id}.recommended_level == EMERGENCY_911"
            - "Disposition.${disposition_plain_id}.recommended_level == OFFICE_APPT_72H"
            - "CallbackTask.${callback_flag_id}.risk_class == HIGH_RISK"
            - "CallbackTask.${callback_flag_id}.due_by_utc == 2026-08-03T16:30:00Z"
            - "CallbackTask.${callback_flag_id}.max_attempts == 3"
            - "CallbackTask.${callback_plain_id}.risk_class == STANDARD"
            - "CallbackTask.${callback_plain_id}.due_by_utc == 2026-08-04T02:30:00Z"
            - "CallbackTask.${callback_plain_id}.max_attempts == 2"
            - "TriageCall.${call_flag_id}.requires_warm_transfer == true"
            - "TriageCall.${call_plain_id}.requires_warm_transfer == false"
            - "Practice.${practice_id}.open_callback_count == 2"

      # ---- mode (b): rounding order --------------------------------------
      - name: advice_fee_rounds_per_call_before_practice_ledger_accrual
        grounds:
          - calculations.call_advice_fee
          - entities.Practice.fields.advice_fee_accrued_cents
          - entities.Practice.fields.billed_advice_minutes_total
          - entities.TriageCall.fields.billable_minutes
          - endpoints[POST /triage-calls/{id}/complete]
