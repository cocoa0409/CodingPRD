  - rule_id: compensating_invariant
    instances:
      - name: escrow_funds_conserved_on_approve_then_overturn
        grounds:
          - state_machines.Draw.REQUESTED_to_APPROVED
          - state_machines.Draw.DISPUTED_to_REJECTED
          - entities.Escrow.fields.funded_cents
          - entities.Escrow.fields.available_cents
          - entities.Escrow.fields.retained_cents
          - entities.Escrow.fields.released_cents
