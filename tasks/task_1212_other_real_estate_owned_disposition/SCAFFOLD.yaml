scenario: "generate task hard than expert level! 1212. Other Real Estate Owned (OREO) Disposition: acquisition accounting at fair value & holding period limit, property management & carrying cost tracking, appraisal cadence & write-down decisions, marketing/listing strategy & broker selection, offer evaluation & approval authority, environmental & title issue resolution, sale closing & gain/loss recognition, regulatory holding-period extension request"

domain_name: "oreo-disposition"
api_prefix: "/api"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: OREOProperty
    parent: null
    common_fields: true
    fields:
      - { name: address, type: string, source: input, description: "Street address of the foreclosed property" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state code; drives broker/appraiser coverage eligibility" }
      - { name: county, type: string, source: input, description: "County where the property sits" }
      - { name: property_type, type: enum, source: input, description: "RESIDENTIAL | COMMERCIAL | INDUSTRIAL | LAND", constraints: "enum {RESIDENTIAL, COMMERCIAL, INDUSTRIAL, LAND}" }
      - { name: acquisition_date, type: datetime, source: input, description: "Date (YYYY-MM-DD) the bank took the property into OREO; anchor of the holding period" }
      - { name: bpo_value, type: number, source: input, description: "Broker price opinion value at acquisition; feeds the PROVISIONAL acquisition accounting variant" }
      - { name: foreclosure_debt, type: number, source: input, description: "Unpaid principal balance foreclosed; informational, never used in gain/loss" }
      - { name: fair_value_at_acquisition, type: number, source: computed, description: "PROVISIONAL variant = bpo_value; FINAL variant = appraised_value of the first CERTIFIED Appraisal whose effective_date <= acquisition_date + 180 days" }
      - { name: acquisition_basis, type: number, source: computed, description: "fair_value_at_acquisition - round(fair_value_at_acquisition * COST_TO_SELL_PCT, 2); recorded at fair value less cost to sell" }
      - { name: carrying_value, type: number, source: computed, description: "acquisition_basis + capitalized_cost_total - sum(WriteDown.amount where status == POSTED); 2dp" }
      - { name: capitalized_cost_total, type: number, source: computed, description: "Sum of CarryingCost.amount where cost_type == CAPITAL_IMPROVEMENT (each amount rounded 2dp half-up at posting)" }
      - { name: expensed_cost_total, type: number, source: computed, description: "Sum of CarryingCost.amount where cost_type != CAPITAL_IMPROVEMENT; never added to carrying_value" }
      - { name: current_fair_value, type: number, source: computed, description: "appraised_value of the CERTIFIED Appraisal with the latest effective_date; null until the first certification" }
      - { name: net_realizable_value, type: number, source: computed, description: "current_fair_value - round(current_fair_value * COST_TO_SELL_PCT, 2); null until first certification" }
      - { name: holding_deadline, type: datetime, source: computed, description: "acquisition_date + HOLDING_PERIOD_DAYS + sum(APPROVED ExtensionRequest.requested_extension_days); property is compliant while clock <= holding_deadline" }
      - { name: extension_days_approved, type: integer, source: computed, description: "Sum of requested_extension_days over APPROVED ExtensionRequests; capped at MAX_TOTAL_EXTENSION_DAYS" }
      - { name: lifecycle_status, type: enum, source: system, description: "HELD | MARKETED | UNDER_CONTRACT | DISPOSED | CHARGED_OFF", default: HELD, constraints: "enum {HELD, MARKETED, UNDER_CONTRACT, DISPOSED, CHARGED_OFF}" }
      - { name: appraisal_status, type: enum, source: computed, description: "UNAPPRAISED (no CERTIFIED appraisal) | CURRENT (clock <= effective_date + 335) | DUE_SOON (effective_date + 335 < clock <= effective_date + 365) | OVERDUE (clock > effective_date + 365) of the latest CERTIFIED appraisal", constraints: "enum {UNAPPRAISED, CURRENT, DUE_SOON, OVERDUE}" }
      - { name: active_listing_count, type: integer, source: computed, description: "Count of ListingAgreement with status == ACTIVE on this property" }
      - { name: open_environmental_issue_count, type: integer, source: computed, description: "Count of IssueCase with issue_type == ENVIRONMENTAL and status IN {OPEN, IN_REMEDIATION}" }
      - { name: open_title_issue_count, type: integer, source: computed, description: "Count of IssueCase with issue_type == TITLE and status IN {OPEN, IN_REMEDIATION}" }
      - { name: recognized_gain_loss_total, type: number, source: computed, description: "sum(LedgerEntry.amount where entry_type IN {GAIN_RECOGNIZED, LOSS_RECOGNIZED}) for this property; LOSS entries carry negative amounts" }
      - { name: pending_write_down_count, type: integer, source: computed, description: "Count of WriteDown with status == PROPOSED on this property" }

  - name: Appraiser
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Appraiser or appraisal firm name" }
      - { name: license_number, type: string, source: input, description: "State appraisal license number" }
      - { name: coverage_states, type: array, source: input, description: "Array of two-letter state codes the appraiser is licensed in" }
      - { name: fee_flat, type: number, source: input, description: "Flat fee per appraisal engagement, 2dp" }

  - name: Broker
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Brokerage name" }
      - { name: license_number, type: string, source: input, description: "Real estate broker license number" }
      - { name: coverage_states, type: array, source: input, description: "Array of two-letter state codes the broker serves" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED; only ACTIVE brokers may receive new listings", default: ACTIVE, constraints: "enum {ACTIVE, SUSPENDED}" }
      - { name: performance_score, type: number, source: computed, description: "Weighted score over this broker's SETTLED closings (see broker_performance_score); null while the broker has zero SETTLED closings" }

  - name: CarryingCost
    parent: null
    common_fields: false
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> OREOProperty.id; property the cost belongs to" }
      - { name: cost_type, type: enum, source: input, description: "TAXES | INSURANCE | MAINTENANCE | UTILITIES | HOA | CAPITAL_IMPROVEMENT", constraints: "enum {TAXES, INSURANCE, MAINTENANCE, UTILITIES, HOA, CAPITAL_IMPROVEMENT}" }
      - { name: amount, type: number, source: input, description: "Cost amount; rounded to 2dp half-up at posting and stored at that precision (pinned rounding order: round per entry, then aggregate)" }
      - { name: incurred_date, type: datetime, source: input, description: "Date the cost was incurred" }
      - { name: description, type: string, source: input, description: "Free-text memo", constraints: "optional" }

  - name: Appraisal
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> OREOProperty.id; appraised property" }
      - { name: appraiser_id, type: string, source: input, description: "FK -> Appraiser.id; engaged appraiser; must equal X-User-ID of the creating Appraiser-role caller" }
      - { name: effective_date, type: datetime, source: input, description: "Valuation effective date; must be <= current clock; at most one CERTIFIED appraisal per (property_id, effective_date)" }
      - { name: appraised_value, type: number, source: input, description: "Appraised fair value, 2dp, > 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | CERTIFIED", default: DRAFT, constraints: "enum {DRAFT, SUBMITTED, CERTIFIED}" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID captured at submit; segregation-of-duties compared at certify" }
      - { name: certified_by_user_id, type: string, source: system, description: "X-User-ID of the certifying ChiefAppraiser" }
      - { name: rejection_reason, type: string, source: system, description: "Reason recorded when a SUBMITTED appraisal is rejected back to DRAFT", constraints: "optional" }

  - name: WriteDown
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> OREOProperty.id; property being written down" }
      - { name: amount, type: number, source: input, description: "Signed 2dp amount; positive reduces carrying_value, negative is an upward adjustment" }
      - { name: reason, type: enum, source: input, description: "MARKET_DECLINE | MEASUREMENT_PERIOD_ADJUSTMENT | REGULATORY_CHARGE_OFF", constraints: "enum {MARKET_DECLINE, MEASUREMENT_PERIOD_ADJUSTMENT, REGULATORY_CHARGE_OFF}" }
      - { name: status, type: enum, source: system, description: "PROPOSED | POSTED | REJECTED", default: PROPOSED, constraints: "enum {PROPOSED, POSTED, REJECTED}" }
      - { name: auto_generated, type: boolean, source: system, description: "true when created by appraisal certification evaluation or charge-off cascade; false for manual CreditOfficer proposals" }
      - { name: proposed_by_user_id, type: string, source: system, description: "X-User-ID of the proposer; the literal string 'system' for auto-generated rows; segregation-of-duties compared at approve" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of the approving OREOCommittee member" }

  - name: ListingAgreement
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> OREOProperty.id; marketed property" }
      - { name: broker_id, type: string, source: input, description: "FK -> Broker.id; engaged listing broker" }
      - { name: start_date, type: datetime, source: input, description: "Mandate start (inclusive); half-open interval [start_date, end_date)" }
      - { name: end_date, type: datetime, source: input, description: "Mandate end (exclusive); must be > start_date" }
      - { name: listing_price, type: number, source: input, description: "Asking price, 2dp" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | TERMINATED | EXPIRED", default: DRAFT, constraints: "enum {DRAFT, ACTIVE, TERMINATED, EXPIRED}" }
      - { name: termination_reason, type: enum, source: system, description: "MANUAL | UNDER_CONTRACT | CHARGE_OFF; set only on the TERMINATED transition", constraints: "optional; enum {MANUAL, UNDER_CONTRACT, CHARGE_OFF}" }

  - name: Offer
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> OREOProperty.id; property the offer targets" }
      - { name: listing_agreement_id, type: string, source: input, description: "FK -> ListingAgreement.id; optional; when supplied must be an ACTIVE agreement on the same property", constraints: "optional" }
      - { name: buyer_name, type: string, source: input, description: "Prospective buyer name" }
      - { name: offer_price, type: number, source: input, description: "Initial offered contract price, 2dp, > 0" }
      - { name: financing_type, type: enum, source: input, description: "CASH | SELLER_FINANCED; selects the gain-recognition variant at closing", constraints: "enum {CASH, SELLER_FINANCED}" }
      - { name: down_payment, type: number, source: input, description: "Required iff financing_type == SELLER_FINANCED; 0 < down_payment < offer_price", constraints: "optional; required for SELLER_FINANCED" }
      - { name: earnest_money, type: number, source: input, description: "Earnest money deposit, 2dp, >= 0" }
      - { name: status, type: enum, source: system, description: "RECEIVED | UNDER_REVIEW | COUNTERED | ACCEPTED | REJECTED | WITHDRAWN | RESCINDED | CLOSED", default: RECEIVED, constraints: "enum {RECEIVED, UNDER_REVIEW, COUNTERED, ACCEPTED, REJECTED, WITHDRAWN, RESCINDED, CLOSED}" }
      - { name: current_price, type: number, source: computed, description: "Latest negotiated price: counter_price of the most recent counter, else offer_price; all commission/proceeds math uses current_price" }
      - { name: counter_round, type: integer, source: computed, description: "Number of counter-offers issued on this offer", default: 0 }
      - { name: rejection_reason, type: enum, source: system, description: "MANUAL | SUPERSEDED | PROPERTY_CHARGED_OFF; set only on the REJECTED transition", constraints: "optional; enum {MANUAL, SUPERSEDED, PROPERTY_CHARGED_OFF}" }

  - name: IssueCase
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> OREOProperty.id; property with the defect" }
      - { name: issue_type, type: enum, source: input, description: "ENVIRONMENTAL | TITLE", constraints: "enum {ENVIRONMENTAL, TITLE}" }
      - { name: severity, type: enum, source: input, description: "LOW | MEDIUM | HIGH", constraints: "enum {LOW, MEDIUM, HIGH}" }
      - { name: description, type: string, source: input, description: "Defect description" }
      - { name: status, type: enum, source: system, description: "OPEN | IN_REMEDIATION | RESOLVED | WAIVED", default: OPEN, constraints: "enum {OPEN, IN_REMEDIATION, RESOLVED, WAIVED}" }
      - { name: resolution_notes, type: string, source: system, description: "Recorded at resolve", constraints: "optional" }

  - name: ClosingStatement
    parent: null
    common_fields: true
    fields:
      - { name: offer_id, type: string, source: input, description: "FK -> Offer.id; the ACCEPTED offer being closed" }
      - { name: property_id, type: string, source: system, description: "FK -> OREOProperty.id; denormalized from Offer.property_id at creation" }
      - { name: closing_date, type: datetime, source: input, description: "Scheduled settlement date; must be <= property.holding_deadline at creation" }
      - { name: contract_price, type: number, source: computed, description: "Snapshot of Offer.current_price at creation" }
      - { name: commission_total, type: number, source: computed, description: "broker_commission_tiered(contract_price, property_type, financing_type)" }
      - { name: listing_broker_share, type: number, source: computed, description: "round(commission_total * 0.5, 2) half-up; pinned split order (see commission_split)" }
      - { name: selling_broker_share, type: number, source: computed, description: "commission_total - listing_broker_share (remainder absorbs the odd cent)" }
      - { name: closing_cost_flat, type: number, source: computed, description: "CLOSING_COST_FLAT constant (2500.00), seller-paid" }
      - { name: net_proceeds, type: number, source: computed, description: "contract_price - commission_total - closing_cost_flat" }
      - { name: carrying_value_at_closing, type: number, source: computed, description: "Snapshot of property.carrying_value at creation" }
      - { name: gain_loss, type: number, source: computed, description: "net_proceeds - carrying_value_at_closing; positive = gain" }
      - { name: recognized_gain_at_settlement, type: number, source: computed, description: "CASH variant: gain_loss; SELLER_FINANCED variant: round(down_payment * (gain_loss / contract_price), 2) when gain_loss > 0, else gain_loss (losses recognized in full)" }
      - { name: deferred_gain, type: number, source: computed, description: "SELLER_FINANCED: gain_loss - recognized_gain_at_settlement; CASH: 0.00" }
      - { name: status, type: enum, source: system, description: "DRAFT | SETTLED | VOID", default: DRAFT, constraints: "enum {DRAFT, SETTLED, VOID}" }

  - name: ExtensionRequest
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> OREOProperty.id; property seeking more disposition time" }
      - { name: requested_extension_days, type: integer, source: input, description: "Days requested beyond the current holding_deadline; 1..1825" }
      - { name: justification, type: string, source: input, description: "Regulator-facing justification" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | DENIED", default: DRAFT, constraints: "enum {DRAFT, SUBMITTED, APPROVED, DENIED}" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the submitting ComplianceOfficer" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the OREOCommittee member who approved or denied" }

  - name: LedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: property_id, type: string, source: system, description: "FK -> OREOProperty.id; owning property ledger" }
      - { name: write_down_id, type: string, source: system, description: "FK -> WriteDown.id; set on WRITE_DOWN entries (negated again on void is not applicable; write-downs are never voided)", constraints: "optional nullable" }
      - { name: closing_statement_id, type: string, source: system, description: "FK -> ClosingStatement.id; set on PROCEEDS / GAIN_RECOGNIZED / LOSS_RECOGNIZED entries and their negated void counterparts", constraints: "optional nullable" }
      - { name: entry_type, type: enum, source: system, description: "ACQUISITION | CARRYING_COST | WRITE_DOWN | CHARGE_OFF | PROCEEDS | GAIN_RECOGNIZED | LOSS_RECOGNIZED", constraints: "enum {ACQUISITION, CARRYING_COST, WRITE_DOWN, CHARGE_OFF, PROCEEDS, GAIN_RECOGNIZED, LOSS_RECOGNIZED}" }
      - { name: amount, type: number, source: system, description: "Signed 2dp. ACQUISITION +acquisition_basis; CARRYING_COST -amount; WRITE_DOWN -write_down.amount; CHARGE_OFF -carrying_value_at_chargeoff; PROCEEDS +net_proceeds; GAIN_RECOGNIZED +recognized gain; LOSS_RECOGNIZED -loss magnitude; void appends same-type rows with negated amounts" }
      - { name: memo, type: string, source: system, description: "Human-readable posting memo" }

  - name: ApprovalTier
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Tier label" }
      - { name: min_net_proceeds, type: number, source: input, description: "Half-open tier floor (inclusive), 2dp" }
      - { name: max_net_proceeds, type: number, source: input, description: "Half-open tier ceiling (exclusive); null = unbounded", constraints: "optional nullable" }
      - { name: required_role, type: enum, source: input, description: "OREOSpecialist (rank 1) | CreditOfficer (rank 2) | OREOCommittee (rank 3)", constraints: "enum {OREOSpecialist, CreditOfficer, OREOCommittee}" }
      - { name: required_rank, type: integer, source: computed, description: "1 for OREOSpecialist, 2 for CreditOfficer, 3 for OREOCommittee" }

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: OREOProperty
    initial_state: HELD
    terminal_states: [DISPOSED, CHARGED_OFF]
    transitions:
      - from: HELD
        to: MARKETED
        trigger: "POST /api/listing-agreements/{id}/activate"
        actor: OREOSpecialist
        preconditions:
          - "property.lifecycle_status == HELD"
          - "property.appraisal_status IN {CURRENT, DUE_SOON}"
          - "property.open_environmental_issue_count == 0"
          - "broker eligible: Broker.status == ACTIVE and property.state_code IN Broker.coverage_states"
        side_effects:
          - "ListingAgreement.status := ACTIVE"
          - "property.active_listing_count recomputed (now >= 1)"
          - "property.version incremented"
      - from: MARKETED
        to: HELD
        trigger: "POST /api/listing-agreements/{id}/terminate, or clock advance expiring the last ACTIVE listing"
        actor: OREOSpecialist | system
        preconditions:
          - "transition fires only when, after the listing leaves ACTIVE, property.active_listing_count == 0"
        side_effects:
          - "property.active_listing_count recomputed"
          - "property.version incremented"
      - from: MARKETED
        to: UNDER_CONTRACT
        trigger: "POST /api/offers/{id}/accept"
        actor: OREOSpecialist | CreditOfficer | OREOCommittee
        preconditions:
          - "offer.status IN {UNDER_REVIEW, COUNTERED}"
          - "property.appraisal_status IN {CURRENT, DUE_SOON}"
          - "property.open_environmental_issue_count == 0"
          - "property.pending_write_down_count == 0"
          - "net_proceeds(offer.current_price) > 0"
          - "caller rank >= required tier rank; deep-discount (net_proceeds < 0.9 * carrying_value) forces rank 3"
        side_effects:
          - "offer.status := ACCEPTED"
          - "the ACTIVE ListingAgreement on the property := TERMINATED with termination_reason UNDER_CONTRACT"
          - "every other Offer on the property with status IN {RECEIVED, UNDER_REVIEW, COUNTERED} := REJECTED with rejection_reason SUPERSEDED"
          - "property.version incremented"
      - from: UNDER_CONTRACT
        to: MARKETED
        trigger: "POST /api/offers/{id}/rescind on the ACCEPTED offer"
        actor: OREOSpecialist | CreditOfficer
        preconditions:
          - "offer.status == ACCEPTED"
          - "no ClosingStatement with status IN {DRAFT, SETTLED} exists for the offer"
        side_effects:
          - "offer.status := RESCINDED"
          - "property.version incremented (property may be MARKETED with zero ACTIVE listings until re-listed)"
      - from: UNDER_CONTRACT
        to: DISPOSED
        trigger: "POST /api/closing-statements/{id}/settle"
        actor: CreditOfficer
        preconditions:
          - "closing.status == DRAFT"
        side_effects:
          - "offer.status := CLOSED"
          - "closing.status := SETTLED"
          - "append LedgerEntry PROCEEDS +net_proceeds"
          - "append LedgerEntry GAIN_RECOGNIZED +recognized_gain_at_settlement if gain_loss > 0 else LOSS_RECOGNIZED -|gain_loss|"
          - "property.recognized_gain_loss_total recomputed"
          - "property.version incremented"
      - from: DISPOSED
        to: UNDER_CONTRACT
        trigger: "POST /api/closing-statements/{id}/void"
        actor: OREOCommittee
        preconditions:
          - "closing.status == SETTLED"
        side_effects:
          - "append negated LedgerEntry rows (PROCEEDS -net_proceeds; GAIN_RECOGNIZED/LOSS_RECOGNIZED negated)"
          - "closing.status := VOID"
          - "offer.status := ACCEPTED"
          - "property.recognized_gain_loss_total recomputed (returns to pre-settle value)"
          - "property.version incremented"
      - from: HELD
        to: CHARGED_OFF
        trigger: "POST /api/_clock/set_current_utc advancing clock beyond holding_deadline, or POST /api/oreo-properties/{id}/charge-off"
        actor: system | ComplianceOfficer
        preconditions:
          - "clock-triggered path: clock > property.holding_deadline"
        side_effects:
          - "auto-create WriteDown status POSTED, amount == property.carrying_value, reason REGULATORY_CHARGE_OFF, auto_generated true (link 2 of the charge-off cascade)"
          - "that WriteDown posting itself appends LedgerEntry CHARGE_OFF amount -carrying_value and sets property.carrying_value := 0.00 (link 3)"
          - "every ListingAgreement on the property with status == ACTIVE := TERMINATED with termination_reason CHARGE_OFF"
          - "every ListingAgreement with status == DRAFT is left untouched"
          - "every Offer on the property with status IN {RECEIVED, UNDER_REVIEW, COUNTERED} := REJECTED with rejection_reason PROPERTY_CHARGED_OFF"
          - "an ACCEPTED offer, if any, := RESCINDED"
          - "property.version incremented"
      - from: MARKETED
        to: CHARGED_OFF
        trigger: "same as HELD -> CHARGED_OFF"
        actor: system | ComplianceOfficer
        preconditions: ["same as HELD -> CHARGED_OFF"]
        side_effects: ["same side effects as HELD -> CHARGED_OFF"]
      - from: UNDER_CONTRACT
        to: CHARGED_OFF
        trigger: "same as HELD -> CHARGED_OFF"
        actor: system | ComplianceOfficer
        preconditions: ["same as HELD -> CHARGED_OFF"]
        side_effects: ["same side effects as HELD -> CHARGED_OFF, plus ACCEPTED offer RESCINDED"]

  - entity: Offer
    initial_state: RECEIVED
    terminal_states: [REJECTED, WITHDRAWN, RESCINDED, CLOSED]
    transitions:
      - from: RECEIVED
        to: UNDER_REVIEW
        trigger: "POST /api/offers/{id}/submit-review"
        actor: OREOSpecialist
        preconditions: ["offer.status == RECEIVED"]
        side_effects: ["offer.version incremented"]
      - from: UNDER_REVIEW
        to: COUNTERED
        trigger: "POST /api/offers/{id}/counter"
        actor: OREOSpecialist
        preconditions: ["offer.status == UNDER_REVIEW", "counter_price > 0"]
        side_effects: ["offer.current_price := counter_price", "offer.counter_round += 1", "offer.version incremented"]
      - from: COUNTERED
        to: UNDER_REVIEW
        trigger: "POST /api/offers/{id}/resume (buyer response received; negotiation cycle re-opens)"
        actor: OREOSpecialist
        preconditions: ["offer.status == COUNTERED"]
        side_effects: ["offer.version incremented"]
      - from: UNDER_REVIEW
        to: ACCEPTED
        trigger: "POST /api/offers/{id}/accept"
        actor: OREOSpecialist | CreditOfficer | OREOCommittee
        preconditions: ["see OREOProperty MARKETED -> UNDER_CONTRACT"]
        side_effects: ["property -> UNDER_CONTRACT cascade (see OREOProperty machine)"]
      - from: COUNTERED
        to: ACCEPTED
        trigger: "POST /api/offers/{id}/accept"
        actor: OREOSpecialist | CreditOfficer | OREOCommittee
        preconditions: ["see OREOProperty MARKETED -> UNDER_CONTRACT"]
        side_effects: ["property -> UNDER_CONTRACT cascade (see OREOProperty machine)"]
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /api/offers/{id}/reject"
        actor: OREOSpecialist | CreditOfficer
        preconditions: ["offer.status == RECEIVED"]
        side_effects: ["offer.rejection_reason := MANUAL", "offer.version incremented"]
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /api/offers/{id}/reject, or supersede/charge-off cascades"
        actor: OREOSpecialist | CreditOfficer | system
        preconditions: ["offer.status == UNDER_REVIEW"]
        side_effects: ["offer.rejection_reason := MANUAL | SUPERSEDED | PROPERTY_CHARGED_OFF per trigger", "offer.version incremented"]
      - from: COUNTERED
        to: REJECTED
        trigger: "POST /api/offers/{id}/reject, or supersede/charge-off cascades"
        actor: OREOSpecialist | CreditOfficer | system
        preconditions: ["offer.status == COUNTERED"]
        side_effects: ["offer.rejection_reason per trigger", "offer.version incremented"]
      - from: RECEIVED
        to: WITHDRAWN
        trigger: "POST /api/offers/{id}/withdraw"
        actor: OREOSpecialist
        preconditions: ["offer.status == RECEIVED"]
        side_effects: ["offer.version incremented"]
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /api/offers/{id}/withdraw"
        actor: OREOSpecialist
        preconditions: ["offer.status == UNDER_REVIEW"]
        side_effects: ["offer.version incremented"]
      - from: COUNTERED
        to: WITHDRAWN
        trigger: "POST /api/offers/{id}/withdraw"
        actor: OREOSpecialist
        preconditions: ["offer.status == COUNTERED"]
        side_effects: ["offer.version incremented"]
      - from: ACCEPTED
        to: RESCINDED
        trigger: "POST /api/offers/{id}/rescind, closing void, or charge-off cascade"
        actor: OREOSpecialist | CreditOfficer | system
        preconditions: ["offer.status == ACCEPTED"]
        side_effects: ["property reverts per OREOProperty machine (UNDER_CONTRACT -> MARKETED on manual rescind)"]
      - from: ACCEPTED
        to: CLOSED
        trigger: "POST /api/closing-statements/{id}/settle"
        actor: CreditOfficer
        preconditions: ["closing.status == DRAFT"]
        side_effects: ["property -> DISPOSED (see OREOProperty machine)"]

  - entity: Appraisal
    initial_state: DRAFT
    terminal_states: [CERTIFIED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/appraisals/{id}/submit"
        actor: Appraiser
        preconditions:
          - "appraisal.status == DRAFT"
          - "X-User-ID == appraisal.appraiser_id (entity-backed ownership)"
        side_effects: ["appraisal.submitted_by_user_id := X-User-ID", "appraisal.version incremented"]
      - from: SUBMITTED
        to: CERTIFIED
        trigger: "POST /api/appraisals/{id}/certify"
        actor: ChiefAppraiser
        preconditions:
          - "appraisal.status == SUBMITTED"
          - "X-User-ID != appraisal.submitted_by_user_id (segregation of duties)"
          - "no other CERTIFIED appraisal on the same property with the same effective_date"
        side_effects:
          - "appraisal.certified_by_user_id := X-User-ID (link 1 of the certification cascade)"
          - "property.current_fair_value := appraised_value; property.appraisal_status recomputed from effective_date (link 2)"
          - "that property-value mutation triggers acquisition/write-down evaluation (link 3): if effective_date <= acquisition_date + 180 days -> FINAL acquisition variant recomputes fair_value_at_acquisition and acquisition_basis, and when delta != 0 auto-creates a POSTED WriteDown (amount = old carrying_value - new acquisition_basis, reason MEASUREMENT_PERIOD_ADJUSTMENT, auto_generated true) which appends LedgerEntry WRITE_DOWN -amount; otherwise -> write_down_evaluation runs and when required > 0 auto-creates a PROPOSED WriteDown (reason MARKET_DECLINE) raising property.pending_write_down_count"
          - "property.version incremented"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /api/appraisals/{id}/reject (revision loop)"
        actor: ChiefAppraiser
        preconditions: ["appraisal.status == SUBMITTED"]
        side_effects: ["appraisal.rejection_reason := input rejection_reason", "appraisal.version incremented"]

  - entity: WriteDown
    initial_state: PROPOSED
    terminal_states: [POSTED, REJECTED]
    transitions:
      - from: PROPOSED
        to: POSTED
        trigger: "POST /api/write-downs/{id}/approve"
        actor: OREOCommittee
        preconditions:
          - "write_down.status == PROPOSED"
          - "X-User-ID != write_down.proposed_by_user_id (segregation of duties; auto-generated rows carry proposed_by_user_id == 'system' so any committee member may approve)"
        side_effects:
          - "write_down.approved_by_user_id := X-User-ID"
          - "append LedgerEntry WRITE_DOWN amount -write_down.amount with write_down_id set"
          - "property.carrying_value recomputed (acquisition_basis + capitalized_cost_total - sum(POSTED amounts))"
          - "property.pending_write_down_count recomputed"
          - "property.version incremented"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /api/write-downs/{id}/reject"
        actor: OREOCommittee
        preconditions: ["write_down.status == PROPOSED"]
        side_effects: ["property.pending_write_down_count recomputed", "property.version incremented"]

  - entity: ListingAgreement
    initial_state: DRAFT
    terminal_states: [TERMINATED, EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/listing-agreements/{id}/activate"
        actor: OREOSpecialist
        preconditions: ["see OREOProperty HELD -> MARKETED"]
        side_effects: ["property HELD -> MARKETED (see OREOProperty machine)"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /api/listing-agreements/{id}/terminate, offer accept, or charge-off cascade"
        actor: OREOSpecialist | system
        preconditions: ["listing.status == ACTIVE"]
        side_effects:
          - "termination_reason := MANUAL | UNDER_CONTRACT | CHARGE_OFF per trigger"
          - "property.active_listing_count recomputed; if it reaches 0 and property.lifecycle_status == MARKETED, property MARKETED -> HELD"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /api/_clock/set_current_utc advancing clock beyond end_date"
        actor: system
        preconditions: ["listing.status == ACTIVE", "clock > end_date"]
        side_effects: ["same active_listing_count recompute and possible MARKETED -> HELD revert as TERMINATED"]

  - entity: IssueCase
    initial_state: OPEN
    terminal_states: [RESOLVED, WAIVED]
    transitions:
      - from: OPEN
        to: IN_REMEDIATION
        trigger: "POST /api/issues/{id}/start-remediation"
        actor: PropertyManager
        preconditions: ["issue.status == OPEN"]
        side_effects: ["issue.version incremented (issue counts unchanged: IN_REMEDIATION still counts as open)"]
      - from: IN_REMEDIATION
        to: RESOLVED
        trigger: "POST /api/issues/{id}/resolve"
        actor: PropertyManager
        preconditions: ["issue.status == IN_REMEDIATION"]
        side_effects: ["issue.resolution_notes := input", "property open issue counts recomputed", "property.version incremented"]
      - from: OPEN
        to: WAIVED
        trigger: "POST /api/issues/{id}/waive"
        actor: OREOCommittee
        preconditions: ["issue.status == OPEN", "issue.issue_type == TITLE (ENVIRONMENTAL issues are never waivable)"]
        side_effects: ["property open issue counts recomputed", "property.version incremented"]

  - entity: ClosingStatement
    initial_state: DRAFT
    terminal_states: [VOID]
    transitions:
      - from: DRAFT
        to: SETTLED
        trigger: "POST /api/closing-statements/{id}/settle"
        actor: CreditOfficer
        preconditions: ["closing.status == DRAFT"]
        side_effects: ["see OREOProperty UNDER_CONTRACT -> DISPOSED"]
      - from: SETTLED
        to: VOID
        trigger: "POST /api/closing-statements/{id}/void"
        actor: OREOCommittee
        preconditions: ["closing.status == SETTLED"]
        side_effects: ["see OREOProperty DISPOSED -> UNDER_CONTRACT (compensating reversal entries)"]

  - entity: ExtensionRequest
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/extension-requests/{id}/submit"
        actor: ComplianceOfficer
        preconditions:
          - "extension.status == DRAFT"
          - "property.lifecycle_status IN {HELD, MARKETED, UNDER_CONTRACT} (regulator will not consider a terminal property)"
        side_effects: ["extension.submitted_by_user_id := X-User-ID", "extension.version incremented"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /api/extension-requests/{id}/approve"
        actor: OREOCommittee
        preconditions:
          - "extension.status == SUBMITTED"
          - "property.extension_days_approved + requested_extension_days <= MAX_TOTAL_EXTENSION_DAYS (aggregate capacity of the post-deadline allowance)"
        side_effects:
          - "extension.decided_by_user_id := X-User-ID"
          - "property.extension_days_approved += requested_extension_days"
          - "property.holding_deadline += requested_extension_days days"
          - "property.version incremented"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /api/extension-requests/{id}/deny"
        actor: OREOCommittee
        preconditions: ["extension.status == SUBMITTED"]
        side_effects: ["extension.decided_by_user_id := X-User-ID", "extension.version incremented"]
      - from: DENIED
        to: DRAFT
        trigger: "POST /api/extension-requests/{id}/revise (resubmission loop with a new day count)"
        actor: ComplianceOfficer
        preconditions: ["extension.status == DENIED"]
        side_effects: ["extension.requested_extension_days := input", "extension.version incremented"]

  - entity: Broker
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /api/brokers/{id} with status == SUSPENDED"
        actor: OREOAdmin
        preconditions: ["broker.status == ACTIVE"]
        side_effects: ["broker becomes ineligible for new listings; existing ACTIVE listings are unaffected", "broker.version incremented"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /api/brokers/{id} with status == ACTIVE"
        actor: OREOAdmin
        preconditions: ["broker.status == SUSPENDED"]
        side_effects: ["broker.version incremented"]

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules (OCC only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: appraisal-create-stale-property
    parent_entity: OREOProperty
    write_endpoint: "POST /api/appraisals"
    occ_field: "expected_property_version"
    description: |
      Creating an Appraisal against an OREOProperty whose version has advanced
      beyond the version the client observed is rejected. The legitimate product
      case: a prior writer has just certified another appraisal (advancing
      property.version and recomputing current_fair_value), so the stale
      writer's assumptions about valuation state no longer hold.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: offer-create-stale-property
    parent_entity: OREOProperty
    write_endpoint: "POST /api/offers"
    occ_field: "expected_property_version"
    description: |
      Creating an Offer against an OREOProperty whose version has advanced
      beyond the version the client observed is rejected. The legitimate product
      case: a prior writer has just created another offer (advancing
      property.version), so the stale writer's view of pipeline state is
      outdated even though offer creation itself remains a legal operation.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: acquisition_fair_value
    trigger: "POST /api/oreo-properties (PROVISIONAL) and POST /api/appraisals/{id}/certify when effective_date <= acquisition_date + MEASUREMENT_WINDOW_DAYS (FINAL)"
    algorithm: threshold
    formula: |
      PROVISIONAL variant (at creation):
        fair_value_at_acquisition = bpo_value
      FINAL variant (first CERTIFIED appraisal inside the measurement window):
        fair_value_at_acquisition = appraised_value
      acquisition_basis = fair_value_at_acquisition
                          - round(fair_value_at_acquisition * COST_TO_SELL_PCT, 2)
      On FINAL recomputation: delta = carrying_value - acquisition_basis;
      if delta != 0 auto-post WriteDown(amount = delta, MEASUREMENT_PERIOD_ADJUSTMENT);
      if delta == 0 no WriteDown row is created.
    input_set: "The OREOProperty being created or re-measured; the CERTIFIED appraisal with effective_date <= acquisition_date + 180"
    constants:
      COST_TO_SELL_PCT: 0.08
      MEASUREMENT_WINDOW_DAYS: 180
    precision: "2 decimal places, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "From property creation until the first in-window CERTIFIED appraisal"
        difference: "Uses bpo_value, so identical property data yields a different acquisition_basis than FINAL"
      - name: FINAL
        when: "Certification of an appraisal with effective_date <= acquisition_date + 180 days"
        difference: "Uses appraised_value; triggers a MEASUREMENT_PERIOD_ADJUSTMENT WriteDown for the delta"

  - name: carrying_value_reconciliation
    trigger: "On property creation, on POST /api/carrying-costs, and on WriteDown -> POSTED"
    algorithm: aggregation
    formula: |
      carrying_value = acquisition_basis
                     + sum(CarryingCost.amount where cost_type == CAPITAL_IMPROVEMENT)
                     - sum(WriteDown.amount where status == POSTED)
      Invariant: this equality MUST hold at all times; it is the reconciliation
      identity checked by GET /api/oreo-properties/{id}/summary.
    input_set: "All CarryingCost rows of the property (amounts already rounded per entry at posting); all POSTED WriteDown rows of the property"
    constants: {}
    precision: "2 decimal places; per-entry rounding pinned at posting, sums are exact over stored 2dp values"

  - name: write_down_evaluation
    trigger: "POST /api/appraisals/{id}/certify when effective_date > acquisition_date + MEASUREMENT_WINDOW_DAYS"
    algorithm: threshold
    formula: |
      net_realizable_value = current_fair_value - round(current_fair_value * COST_TO_SELL_PCT, 2)
      required = carrying_value - net_realizable_value
      if required > 0:  auto-create WriteDown(status PROPOSED, amount = required,
                        reason MARKET_DECLINE, auto_generated = true)
      if required <= 0: create nothing (the required == 0 boundary creates NO row)
    input_set: "The property's current carrying_value and the newly certified appraised_value"
    constants:
      COST_TO_SELL_PCT: 0.08
    precision: "2 decimal places, round_half_up; boundary is strict greater-than: required == 0 creates no WriteDown"

  - name: broker_commission_tiered
    trigger: "POST /api/closing-statements (computed at DRAFT creation) and inside net_proceeds evaluation at POST /api/offers/{id}/accept"
    algorithm: tiered_pricing
    formula: |
      base_rate(tier) = tier.rate + (0.01 if property_type == LAND else 0.00)
      tiered = sum over tiers of base_rate(tier) * portion_of_price_in_tier
      if financing_type == SELLER_FINANCED:
          commission_total = min(tiered, round(SF_COMMISSION_CAP_PCT * price, 2))
      else:
          commission_total = tiered
      commission_total = round(commission_total, 2)  # half-up, single rounding at the end
      `price` is Offer.current_price at acceptance time / contract_price at closing.
    input_set: "Offer.current_price, property.property_type, offer.financing_type"
    constants:
      TIER_1_LIMIT: 500000.00
      TIER_1_RATE: 0.06
      TIER_2_LIMIT: 1000000.00
      TIER_2_RATE: 0.05
      TIER_3_RATE: 0.03
      LAND_SURCHARGE: 0.01
      SF_COMMISSION_CAP_PCT: 0.06
    precision: "2 decimal places, round_half_up; tier portions: [0, 500000] @ r1, (500000, 1000000] @ r2, above 1000000 @ r3"

  - name: commission_split
    trigger: "POST /api/closing-statements, immediately after broker_commission_tiered"
    algorithm: aggregation
    formula: |
      # Pinned rounding order (sum-then-round-then-split):
      commission_total      = round(tiered_total, 2)                  # from broker_commission_tiered
      listing_broker_share  = round(commission_total * SPLIT_RATIO, 2)  # half-up
      selling_broker_share  = commission_total - listing_broker_share   # remainder absorbs the odd cent
      # Forbidden alternative (split-then-round each share) can produce a
      # 1-cent drift; it is NOT the spec.
    input_set: "commission_total of the ClosingStatement"
    constants:
      SPLIT_RATIO: 0.5
    precision: "2 decimal places, round_half_up; order pinned: round total first, then listing share, then selling = remainder"

  - name: net_proceeds_and_gain_loss
    trigger: "POST /api/offers/{id}/accept (authority evaluation on projected figures) and POST /api/closing-statements (persisted snapshots)"
    algorithm: aggregation
    formula: |
      net_proceeds = current_price - commission_total - CLOSING_COST_FLAT
      gain_loss    = net_proceeds - carrying_value
      CASH variant:            recognized_gain_at_settlement = gain_loss; deferred_gain = 0.00
      SELLER_FINANCED variant: if gain_loss > 0:
                                   recognized = round(down_payment * (gain_loss / current_price), 2)
                                   deferred  = gain_loss - recognized
                               else (loss):
                                   recognized = gain_loss (losses recognized in full at settlement)
                                   deferred  = 0.00
    input_set: "Offer (current_price, financing_type, down_payment), commission_total, property.carrying_value"
    constants:
      CLOSING_COST_FLAT: 2500.00
    precision: "2 decimal places, round_half_up; the installment ratio is NOT pre-rounded — only the final recognized amount is rounded"
    variants:
      - name: CASH
        when: "offer.financing_type == CASH"
        difference: "Full gain_loss recognized at settlement"
      - name: SELLER_FINANCED
        when: "offer.financing_type == SELLER_FINANCED"
        difference: "Identical sale economics recognize only the down-payment-proportional share of a gain at settlement; the remainder is deferred — recognized differs from CASH for identical inputs"

  - name: approval_tier_selection
    trigger: "POST /api/offers/{id}/accept"
    algorithm: threshold
    formula: |
      net = net_proceeds(offer)                       # from net_proceeds_and_gain_loss
      tier = the ApprovalTier where min_net_proceeds <= net < max_net_proceeds
             (max null = unbounded); tiers are validated non-overlapping at creation
      required_rank = tier.required_rank if a tier matches else 3
      if net < DEEP_DISCOUNT_RATIO * property.carrying_value: required_rank = 3
      caller_rank (OREOSpecialist=1, CreditOfficer=2, OREOCommittee=3) must be >= required_rank
      Boundary: net exactly equal to a tier ceiling falls into the NEXT tier
      (half-open [min, max)); net exactly equal to 0.9 * carrying_value is NOT
      deep-discount (strict less-than).
    input_set: "All ApprovalTier rows; offer economics; property.carrying_value"
    constants:
      DEEP_DISCOUNT_RATIO: 0.9
    precision: "2 decimal places; half-open interval boundaries are inclusive at min, exclusive at max"

  - name: holding_period_compliance
    trigger: "POST /api/_clock/set_current_utc (sweep) and GET /api/oreo-properties/{id}/summary"
    algorithm: threshold
    formula: |
      holding_deadline = acquisition_date + HOLDING_PERIOD_DAYS days
                         + extension_days_approved days
      compliant  iff clock <= holding_deadline      # exact-deadline day is still compliant
      violation  iff clock >  holding_deadline      # strictly greater
      On sweep: every property with lifecycle_status IN {HELD, MARKETED, UNDER_CONTRACT}
      and clock > holding_deadline transitions to CHARGED_OFF (see OREOProperty machine).
    input_set: "All non-terminal OREOProperty rows; APPROVED ExtensionRequest days per property"
    constants:
      HOLDING_PERIOD_DAYS: 1825
      MAX_TOTAL_EXTENSION_DAYS: 1825
    precision: "Date granularity (day); comparison is strict greater-than for violation"

  - name: appraisal_currency
    trigger: "POST /api/_clock/set_current_utc (sweep) and POST /api/appraisals/{id}/certify"
    algorithm: threshold
    formula: |
      Let E = effective_date of the property's CERTIFIED appraisal with the
      latest effective_date. If none exists: appraisal_status = UNAPPRAISED.
      CURRENT   iff clock <= E + (APPRAISAL_INTERVAL_DAYS - APPRAISAL_DUE_SOON_WINDOW_DAYS)
      DUE_SOON  iff E + 335 < clock <= E + APPRAISAL_INTERVAL_DAYS
      OVERDUE   iff clock > E + APPRAISAL_INTERVAL_DAYS   # strict greater-than
    input_set: "CERTIFIED appraisals of the property (latest effective_date wins; ties impossible per ERR_DUPLICATE_APPRAISAL_DATE)"
    constants:
      APPRAISAL_INTERVAL_DAYS: 365
      APPRAISAL_DUE_SOON_WINDOW_DAYS: 30
    precision: "Date granularity (day); boundaries inclusive/exclusive as pinned above"

  - name: broker_performance_score
    trigger: "Recomputed on every ClosingStatement -> SETTLED and on every broker read"
    algorithm: weighted_scoring
    formula: |
      Over this broker's SETTLED closings (joined Offer.listing_agreement_id ->
      ListingAgreement.broker_id == this broker):
        close_rate   = count(CLOSED offers) / count(offers in terminal states
                       {CLOSED, REJECTED, WITHDRAWN, RESCINDED} on this broker's listings)
        avg_days     = mean(closing_date - listing start_date, in days)
        market_ratio = 1 - min(avg_days, 180) / 180
        price_ratio  = mean(contract_price / listing_price)
        score = round(0.5 * close_rate + 0.3 * market_ratio + 0.2 * price_ratio, 4)
      If the broker has zero SETTLED closings: performance_score = null.
    input_set: "Offers in terminal states on this broker's listings; SETTLED ClosingStatements joined through the offer's listing agreement"
    constants:
      W_CLOSE_RATE: 0.5
      W_MARKET_TIME: 0.3
      W_PRICE_RATIO: 0.2
      DAYS_CAP: 180
    precision: "4 decimal places, round_half_up"

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (ordered by priority)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Caller role is in the endpoint's roles list; entity-backed ownership: Appraiser creating/submitting must have X-User-ID == appraiser_id / appraisal.appraiser_id"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: business_constraint
    check: "Request body schema: required fields present, types valid, enum members valid, ranges valid (offer_price > 0; 0 < down_payment < offer_price when SELLER_FINANCED; requested_extension_days in 1..1825; end_date > start_date)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all endpoints with a body"
  - priority: 4
    category: existence
    check: "Path-template ids exist, validated left-to-right; body FK references (property_id, broker_id, appraiser_id, offer_id, listing_agreement_id) exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path or body references"
  - priority: 5
    category: state
    check: "OCC: expected_property_version equals the property's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/appraisals, POST /api/offers"
  - priority: 6
    category: state
    check: "State-machine preconditions in declared per-endpoint sub-order: (a) target entity in a legal from-state (ERR_OFFER_NOT_REVIEWABLE, ERR_OFFER_NOT_ACCEPTED, ERR_APPRAISAL_INVALID_STATE, ERR_WRITE_DOWN_NOT_PROPOSED, ERR_LISTING_NOT_ACTIVE, ERR_ISSUE_INVALID_STATE, ERR_CLOSING_INVALID_STATE, ERR_EXTENSION_INVALID_STATE); (b) property lifecycle gates (ERR_PROPERTY_NOT_MARKETABLE, ERR_PROPERTY_ALREADY_TERMINAL); (c) derived appraisal-currency gate (ERR_APPRAISAL_OVERDUE)"
    error_id: ERR_OFFER_NOT_REVIEWABLE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 7
    category: business_safety
    check: "No ENVIRONMENTAL IssueCase with status IN {OPEN, IN_REMEDIATION} on the property (regulatory safety gate)"
    error_id: ERR_ENVIRONMENTAL_ISSUE_OPEN
    http_status: 409
    applies_to: "POST /api/listing-agreements/{id}/activate, POST /api/offers/{id}/accept, POST /api/closing-statements"
  - priority: 8
    category: business_temporal
    check: "Temporal rules: listing interval overlap vs {DRAFT, ACTIVE} agreements on the property (ERR_LISTING_OVERLAP); appraisal effective_date <= clock (ERR_EFFECTIVE_DATE_IN_FUTURE); closing_date <= property.holding_deadline (ERR_CLOSING_BEYOND_DEADLINE); extension aggregate capacity (ERR_EXTENSION_CAP_EXCEEDED)"
    error_id: ERR_LISTING_OVERLAP
    http_status: 409
    applies_to: "POST /api/listing-agreements, POST /api/appraisals, POST /api/closing-statements, POST /api/extension-requests/{id}/approve"
  - priority: 9
    category: business_constraint
    check: "Constraint rules: segregation of duties (ERR_SEGREGATION_OF_DUTIES); one CERTIFIED appraisal per (property, effective_date) (ERR_DUPLICATE_APPRAISAL_DATE); ENVIRONMENTAL issues not waivable (ERR_ENVIRONMENTAL_NOT_WAIVABLE); approval-tier intervals non-overlapping (ERR_TIER_OVERLAP); no TITLE issue IN {OPEN, IN_REMEDIATION} blocks closing (ERR_TITLE_ISSUE_OPEN)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /api/appraisals/{id}/certify, POST /api/write-downs/{id}/approve, POST /api/issues/{id}/waive, POST /api/approval-tiers, POST /api/closing-statements"
  - priority: 10
    category: business_referential
    check: "Referential eligibility: broker ACTIVE and covers property.state_code (ERR_BROKER_NOT_ELIGIBLE); appraiser covers property.state_code (ERR_APPRAISER_NOT_ELIGIBLE); optional listing_agreement_id must be ACTIVE on the same property (ERR_LISTING_NOT_ACTIVE); broker recommendation candidate pool empty (ERR_NO_ELIGIBLE_BROKER)"
    error_id: ERR_BROKER_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /api/listing-agreements, POST /api/listing-agreements/{id}/activate, POST /api/appraisals, POST /api/offers, GET /api/oreo-properties/{id}/broker-recommendation"
  - priority: 11
    category: business_fiscal
    check: "Fiscal gates in sub-order: (a) pending write-down block (ERR_WRITE_DOWN_PENDING); (b) net_proceeds > 0 (ERR_BELOW_MIN_PROCEEDS); (c) approval authority rank incl. deep-discount override (ERR_APPROVAL_AUTHORITY_EXCEEDED)"
    error_id: ERR_WRITE_DOWN_PENDING
    http_status: 409
    applies_to: "POST /api/offers/{id}/accept"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  - { method: POST, path: "/api/oreo-properties", description: "Take a foreclosed property into OREO at provisional fair value", roles: [OREOAdmin], code: 201, input: [address, state_code, county, property_type, acquisition_date, bpo_value, foreclosure_debt], output: OREOProperty, side_effects: [acquisition_fair_value PROVISIONAL variant, holding_deadline = acquisition_date + 1825, append LedgerEntry ACQUISITION +acquisition_basis, lifecycle_status = HELD, appraisal_status = UNAPPRAISED] }
  - { method: GET, path: "/api/oreo-properties", description: "List properties with filters and pagination", roles: [OREOAdmin, PropertyManager, OREOSpecialist, Appraiser, ChiefAppraiser, CreditOfficer, OREOCommittee, ComplianceOfficer, Broker], code: 200, input: ["lifecycle_status?", "appraisal_status?", "state_code?", "limit?", "offset?"], output: "OREOProperty[]", side_effects: [] }
  - { method: GET, path: "/api/oreo-properties/{id}", description: "Read one property", roles: [OREOAdmin, PropertyManager, OREOSpecialist, Appraiser, ChiefAppraiser, CreditOfficer, OREOCommittee, ComplianceOfficer, Broker], code: 200, input: [], output: OREOProperty, side_effects: [] }
  - method: GET
    path: "/api/oreo-properties/{id}/summary"
    description: "Computed reconciliation read: carrying-value identity, holding-period posture, issue and listing counts"
    roles: [OREOAdmin, PropertyManager, OREOSpecialist, Appraiser, ChiefAppraiser, CreditOfficer, OREOCommittee, ComplianceOfficer, Broker]
    code: 200
    input: []
    output: { property_id: string, lifecycle_status: string, appraisal_status: string, acquisition_basis: number, capitalized_cost_total: number, expensed_cost_total: number, posted_write_down_total: number, carrying_value: number, current_fair_value: number, net_realizable_value: number, holding_deadline: string, extension_days_approved: integer, active_listing_count: integer, open_environmental_issue_count: integer, open_title_issue_count: integer, pending_write_down_count: integer, recognized_gain_loss_total: number }
    side_effects: []
  - { method: POST, path: "/api/oreo-properties/{id}/charge-off", description: "Manual regulatory charge-off of a non-terminal property", roles: [ComplianceOfficer], code: 200, input: [], output: OREOProperty, side_effects: [OREOProperty -> CHARGED_OFF cascade incl. auto POSTED WriteDown (REGULATORY_CHARGE_OFF), LedgerEntry CHARGE_OFF, listing termination, offer rejection] }
  - { method: GET, path: "/api/oreo-properties/{id}/broker-recommendation", description: "Selector: eligible brokers (status ACTIVE, coverage includes property.state_code) ranked by performance_score DESC (nulls last), tie-break created_at ASC; empty pool -> ERR_NO_ELIGIBLE_BROKER", roles: [OREOAdmin, PropertyManager, OREOSpecialist], code: 200, input: [], output: "Broker[]", side_effects: [] }
  - { method: POST, path: "/api/carrying-costs", description: "Post a carrying cost (rounded 2dp half-up at posting)", roles: [PropertyManager], code: 201, input: [property_id, cost_type, amount, incurred_date, "description?"], output: CarryingCost, side_effects: [carrying_value_reconciliation, capitalized_cost_total/expensed_cost_total updated, append LedgerEntry CARRYING_COST -amount, increments OREOProperty.version by 1] }
  - { method: GET, path: "/api/carrying-costs", description: "List carrying costs, filterable by property", roles: [OREOAdmin, PropertyManager, OREOSpecialist, Appraiser, ChiefAppraiser, CreditOfficer, OREOCommittee, ComplianceOfficer, Broker], code: 200, input: ["property_id?", "cost_type?", "limit?", "offset?"], output: "CarryingCost[]", side_effects: [] }
  - { method: GET, path: "/api/carrying-costs/{id}", description: "Read one carrying cost", roles: [OREOAdmin, PropertyManager, OREOSpecialist, Appraiser, ChiefAppraiser, CreditOfficer, OREOCommittee, ComplianceOfficer, Broker], code: 200, input: [], output: CarryingCost, side_effects: [] }
  - { method: POST, path: "/api/appraisers", description: "Register an appraiser", roles: [OREOAdmin], code: 201, input: [name, license_number, coverage_states, fee_flat], output: Appraiser, side_effects: [] }
  - { method: GET, path: "/api/appraisers", description: "List appraisers", roles: [OREOAdmin, PropertyManager, OREOSpecialist, Appraiser, ChiefAppraiser, CreditOfficer, OREOCommittee, ComplianceOfficer, Broker], code: 200, input: ["limit?", "offset?"], output: "Appraiser[]", side_effects: [] }
  - { method: GET, path: "/api/appraisers/{id}", description: "Read one appraiser", roles: [OREOAdmin, PropertyManager, OREOSpecialist, Appraiser, ChiefAppraiser, CreditOfficer, OREOCommittee, ComplianceOfficer, Broker], code: 200, input: [], output: Appraiser, side_effects: [] }
  - { method: POST, path: "/api/appraisals", description: "Create an appraisal engagement in DRAFT (OCC-guarded on property version)", roles: [Appraiser], code: 201, input: [property_id, appraiser_id, effective_date, appraised_value, expected_property_version], output: Appraisal, side_effects: [increments OREOProperty.version by 1, status = DRAFT] }
  - { method: GET, path: "/api/appraisals", description: "List appraisals, filterable by property or appraiser", roles: [OREOAdmin, PropertyManager, OREOSpecialist, Appraiser, ChiefAppraiser, CreditOfficer, OREOCommittee, ComplianceOfficer, Broker], code: 200, input: ["property_id?", "appraiser_id?", "status?", "limit?", "offset?"], output: "Appraisal[]", side_effects: [] }
  - { method: GET, path: "/api/appraisals/{id}", description: "Read one appraisal", roles: [OREOAdmin, PropertyManager, OREOSpecialist, Appraiser, ChiefAppraiser, CreditOfficer, OREOCommittee, ComplianceOfficer, Broker], code: 200, input: [], output: Appraisal, side_effects: [] }
  - { method: POST, path: "/api/appraisals/{id}/submit", description: "Submit a DRAFT appraisal (owner appraiser only)", roles: [Appraiser], code: 200, input: [], output: Appraisal, side_effects: [Appraisal DRAFT -> SUBMITTED, records submitted_by_user_id] }
  - { method: POST, path: "/api/appraisals/{id}/certify", description: "Certify a SUBMITTED appraisal (segregated from submitter); fires valuation cascade", roles: [ChiefAppraiser], code: 200, input: [], output: Appraisal, side_effects: [Appraisal SUBMITTED -> CERTIFIED, property.current_fair_value updated, appraisal_status recomputed, acquisition_fair_value FINAL variant or write_down_evaluation cascade, property.version incremented] }
  - { method: POST, path: "/api/appraisals/{id}/reject", description: "Reject a SUBMITTED appraisal back to DRAFT for revision", roles: [ChiefAppraiser], code: 200, input: [rejection_reason], output: Appraisal, side_effects: [Appraisal SUBMITTED -> DRAFT] }
  - { method: POST, path: "/api/brokers", description: "Register a broker", roles: [OREOAdmin], code: 201, input: [name, license_number, coverage_states], output: Broker, side_effects: [status = ACTIVE, performance_score = null] }
  - { method: GET, path: "/api/brokers", description: "List brokers", roles: [OREOAdmin, PropertyManager, OREOSpecialist, Appraiser, ChiefAppraiser, CreditOfficer, OREOCommittee, ComplianceOfficer, Broker], code: 200, input: ["status?", "state_code?", "limit?", "offset?"], output: "Broker[]", side_effects: [] }
  - { method: GET, path: "/api/brokers/{id}", description: "Read one broker", roles: [OREOAdmin, PropertyManager, OREOSpecialist, Appraiser, ChiefAppraiser, CreditOfficer, OREOCommittee, ComplianceOfficer, Broker], code: 200, input: [], output: Broker, side_effects: [] }
  - { method: PATCH, path: "/api/brokers/{id}", description: "Update broker status (ACTIVE <-> SUSPENDED) or coverage", roles: [OREOAdmin], code: 200, input: ["status?", "coverage_states?", "name?"], output: Broker, side_effects: [Broker state machine transition when status changes, broker.version incremented] }
  - { method: POST, path: "/api/listing-agreements", description: "Create a DRAFT listing mandate; half-open [start_date, end_date) intervals on the same property with status IN {DRAFT, ACTIVE} must not overlap (adjacency allowed)", roles: [PropertyManager, OREOSpecialist], code: 201, input: [property_id, broker_id, start_date, end_date, listing_price], output: ListingAgreement, side_effects: [status = DRAFT] }
  - { method: GET, path: "/api/listing-agreements", description: "List listing agreements, filterable by property or broker", roles: [OREOAdmin, PropertyManager, OREOSpecialist, Appraiser, ChiefAppraiser, CreditOfficer, OREOCommittee, ComplianceOfficer, Broker], code: 200, input: ["property_id?", "broker_id?", "status?", "limit?", "offset?"], output: "ListingAgreement[]", side_effects: [] }
  - { method: GET, path: "/api/listing-agreements/{id}", description: "Read one listing agreement", roles: [OREOAdmin, PropertyManager, OREOSpecialist, Appraiser, ChiefAppraiser, CreditOfficer, OREOCommittee, ComplianceOfficer, Broker], code: 200, input: [], output: ListingAgreement, side_effects: [] }
  - { method: POST, path: "/api/listing-agreements/{id}/activate", description: "Activate a DRAFT mandate; gates on property/appraisal/environmental/broker eligibility; property HELD -> MARKETED", roles: [OREOSpecialist], code: 200, input: [], output: ListingAgreement, side_effects: [ListingAgreement DRAFT -> ACTIVE, OREOProperty HELD -> MARKETED, property.version incremented] }
  - { method: POST, path: "/api/listing-agreements/{id}/terminate", description: "Terminate an ACTIVE mandate; property reverts to HELD when no ACTIVE mandate remains", roles: [OREOSpecialist], code: 200, input: [], output: ListingAgreement, side_effects: [ListingAgreement ACTIVE -> TERMINATED (MANUAL), active_listing_count recompute, possible MARKETED -> HELD, property.version incremented] }
  - { method: POST, path: "/api/offers", description: "Register a buyer offer in RECEIVED (OCC-guarded on property version)", roles: [OREOSpecialist], code: 201, input: [property_id, "listing_agreement_id?", buyer_name, offer_price, financing_type, "down_payment?", earnest_money, expected_property_version], output: Offer, side_effects: [status = RECEIVED, current_price = offer_price, increments OREOProperty.version by 1] }
  - { method: GET, path: "/api/offers", description: "List offers, filterable by property or listing", roles: [OREOAdmin, PropertyManager, OREOSpecialist, Appraiser, ChiefAppraiser, CreditOfficer, OREOCommittee, ComplianceOfficer, Broker], code: 200, input: ["property_id?", "listing_agreement_id?", "status?", "financing_type?", "limit?", "offset?"], output: "Offer[]", side_effects: [] }
  - { method: GET, path: "/api/offers/{id}", description: "Read one offer", roles: [OREOAdmin, PropertyManager, OREOSpecialist, Appraiser, ChiefAppraiser, CreditOfficer, OREOCommittee, ComplianceOfficer, Broker], code: 200, input: [], output: Offer, side_effects: [] }
  - { method: POST, path: "/api/offers/{id}/submit-review", description: "Move RECEIVED offer into UNDER_REVIEW", roles: [OREOSpecialist], code: 200, input: [], output: Offer, side_effects: [Offer RECEIVED -> UNDER_REVIEW] }
  - { method: POST, path: "/api/offers/{id}/counter", description: "Counter an UNDER_REVIEW offer; negotiation cycle", roles: [OREOSpecialist], code: 200, input: [counter_price], output: Offer, side_effects: [Offer UNDER_REVIEW -> COUNTERED, current_price = counter_price, counter_round += 1] }
  - { method: POST, path: "/api/offers/{id}/resume", description: "Buyer response received: COUNTERED -> UNDER_REVIEW", roles: [OREOSpecialist], code: 200, input: [], output: Offer, side_effects: [Offer COUNTERED -> UNDER_REVIEW] }
  - { method: POST, path: "/api/offers/{id}/accept", description: "Accept an offer under approval-authority tiers; property MARKETED -> UNDER_CONTRACT; other pending offers superseded", roles: [OREOSpecialist, CreditOfficer, OREOCommittee], code: 200, input: [], output: Offer, side_effects: [Offer -> ACCEPTED, OREOProperty MARKETED -> UNDER_CONTRACT, ACTIVE listing TERMINATED (UNDER_CONTRACT), other offers REJECTED (SUPERSEDED), property.version incremented] }
  - { method: POST, path: "/api/offers/{id}/reject", description: "Reject a pending offer", roles: [OREOSpecialist, CreditOfficer], code: 200, input: [], output: Offer, side_effects: [Offer -> REJECTED (MANUAL)] }
  - { method: POST, path: "/api/offers/{id}/withdraw", description: "Withdraw a pending offer", roles: [OREOSpecialist], code: 200, input: [], output: Offer, side_effects: [Offer -> WITHDRAWN] }
  - { method: POST, path: "/api/offers/{id}/rescind", description: "Rescind an ACCEPTED offer before settlement; property reverts to MARKETED", roles: [OREOSpecialist, CreditOfficer], code: 200, input: [], output: Offer, side_effects: [Offer ACCEPTED -> RESCINDED, OREOProperty UNDER_CONTRACT -> MARKETED, property.version incremented] }
  - { method: POST, path: "/api/issues", description: "Open an environmental or title issue on a non-terminal property", roles: [PropertyManager], code: 201, input: [property_id, issue_type, severity, description], output: IssueCase, side_effects: [status = OPEN, property open issue counts recomputed, property.version incremented] }
  - { method: GET, path: "/api/issues", description: "List issues, filterable by property and type", roles: [OREOAdmin, PropertyManager, OREOSpecialist, Appraiser, ChiefAppraiser, CreditOfficer, OREOCommittee, ComplianceOfficer, Broker], code: 200, input: ["property_id?", "issue_type?", "status?", "limit?", "offset?"], output: "IssueCase[]", side_effects: [] }
  - { method: GET, path: "/api/issues/{id}", description: "Read one issue", roles: [OREOAdmin, PropertyManager, OREOSpecialist, Appraiser, ChiefAppraiser, CreditOfficer, OREOCommittee, ComplianceOfficer, Broker], code: 200, input: [], output: IssueCase, side_effects: [] }
  - { method: POST, path: "/api/issues/{id}/start-remediation", description: "OPEN -> IN_REMEDIATION", roles: [PropertyManager], code: 200, input: [], output: IssueCase, side_effects: [IssueCase OPEN -> IN_REMEDIATION] }
  - { method: POST, path: "/api/issues/{id}/resolve", description: "IN_REMEDIATION -> RESOLVED with notes", roles: [PropertyManager], code: 200, input: [resolution_notes], output: IssueCase, side_effects: [IssueCase IN_REMEDIATION -> RESOLVED, property open issue counts recomputed, property.version incremented] }
  - { method: POST, path: "/api/issues/{id}/waive", description: "OPEN -> WAIVED; TITLE issues only", roles: [OREOCommittee], code: 200, input: [], output: IssueCase, side_effects: [IssueCase OPEN -> WAIVED, property open issue counts recomputed, property.version incremented] }
  - { method: POST, path: "/api/write-downs", description: "Manually propose a write-down (records proposer for segregation of duties)", roles: [CreditOfficer], code: 201, input: [property_id, amount, reason], output: WriteDown, side_effects: [status = PROPOSED, proposed_by_user_id = X-User-ID, property.pending_write_down_count recomputed, property.version incremented] }
  - { method: GET, path: "/api/write-downs", description: "List write-downs, filterable by property", roles: [OREOAdmin, PropertyManager, OREOSpecialist, Appraiser, ChiefAppraiser, CreditOfficer, OREOCommittee, ComplianceOfficer, Broker], code: 200, input: ["property_id?", "status?", "limit?", "offset?"], output: "WriteDown[]", side_effects: [] }
  - { method: GET, path: "/api/write-downs/{id}", description: "Read one write-down", roles: [OREOAdmin, PropertyManager, OREOSpecialist, Appraiser, ChiefAppraiser, CreditOfficer, OREOCommittee, ComplianceOfficer, Broker], code: 200, input: [], output: WriteDown, side_effects: [] }
  - { method: POST, path: "/api/write-downs/{id}/approve", description: "Approve a PROPOSED write-down (segregated from proposer); posts ledger entry and recomputes carrying value", roles: [OREOCommittee], code: 200, input: [], output: WriteDown, side_effects: [WriteDown PROPOSED -> POSTED, append LedgerEntry WRITE_DOWN -amount, carrying_value_reconciliation, property.version incremented] }
  - { method: POST, path: "/api/write-downs/{id}/reject", description: "Reject a PROPOSED write-down", roles: [OREOCommittee], code: 200, input: [], output: WriteDown, side_effects: [WriteDown PROPOSED -> REJECTED, pending_write_down_count recomputed] }
  - { method: POST, path: "/api/closing-statements", description: "Draft a closing statement for an ACCEPTED offer; computes commission, split, net proceeds, gain/loss variant snapshots", roles: [OREOSpecialist], code: 201, input: [offer_id, closing_date], output: ClosingStatement, side_effects: [broker_commission_tiered, commission_split, net_proceeds_and_gain_loss variant selected by offer.financing_type, status = DRAFT] }
  - { method: GET, path: "/api/closing-statements", description: "List closing statements, filterable by offer or property", roles: [OREOAdmin, PropertyManager, OREOSpecialist, Appraiser, ChiefAppraiser, CreditOfficer, OREOCommittee, ComplianceOfficer, Broker], code: 200, input: ["offer_id?", "property_id?", "status?", "limit?", "offset?"], output: "ClosingStatement[]", side_effects: [] }
  - { method: GET, path: "/api/closing-statements/{id}", description: "Read one closing statement", roles: [OREOAdmin, PropertyManager, OREOSpecialist, Appraiser, ChiefAppraiser, CreditOfficer, OREOCommittee, ComplianceOfficer, Broker], code: 200, input: [], output: ClosingStatement, side_effects: [] }
  - { method: POST, path: "/api/closing-statements/{id}/settle", description: "Settle a DRAFT closing; posts proceeds and gain/loss; property -> DISPOSED", roles: [CreditOfficer], code: 200, input: [], output: ClosingStatement, side_effects: [ClosingStatement DRAFT -> SETTLED, append LedgerEntry PROCEEDS +net_proceeds and GAIN_RECOGNIZED/LOSS_RECOGNIZED, Offer ACCEPTED -> CLOSED, OREOProperty UNDER_CONTRACT -> DISPOSED, property.version incremented] }
  - { method: POST, path: "/api/closing-statements/{id}/void", description: "Void a SETTLED closing; appends negated compensating ledger entries; property -> UNDER_CONTRACT, offer -> ACCEPTED", roles: [OREOCommittee], code: 200, input: [], output: ClosingStatement, side_effects: [ClosingStatement SETTLED -> VOID, negated LedgerEntry rows appended, Offer CLOSED -> ACCEPTED, OREOProperty DISPOSED -> UNDER_CONTRACT, property.version incremented] }
  - { method: POST, path: "/api/extension-requests", description: "Draft a regulatory holding-period extension request", roles: [ComplianceOfficer], code: 201, input: [property_id, requested_extension_days, justification], output: ExtensionRequest, side_effects: [status = DRAFT] }
  - { method: GET, path: "/api/extension-requests", description: "List extension requests, filterable by property", roles: [OREOAdmin, PropertyManager, OREOSpecialist, Appraiser, ChiefAppraiser, CreditOfficer, OREOCommittee, ComplianceOfficer, Broker], code: 200, input: ["property_id?", "status?", "limit?", "offset?"], output: "ExtensionRequest[]", side_effects: [] }
  - { method: GET, path: "/api/extension-requests/{id}", description: "Read one extension request", roles: [OREOAdmin, PropertyManager, OREOSpecialist, Appraiser, ChiefAppraiser, CreditOfficer, OREOCommittee, ComplianceOfficer, Broker], code: 200, input: [], output: ExtensionRequest, side_effects: [] }
  - { method: POST, path: "/api/extension-requests/{id}/submit", description: "Submit a DRAFT request to the regulator; property must be non-terminal", roles: [ComplianceOfficer], code: 200, input: [], output: ExtensionRequest, side_effects: [ExtensionRequest DRAFT -> SUBMITTED, records submitted_by_user_id] }
  - { method: POST, path: "/api/extension-requests/{id}/approve", description: "Regulator approval; aggregate 1825-day allowance cap; extends holding_deadline", roles: [OREOCommittee], code: 200, input: [], output: ExtensionRequest, side_effects: [ExtensionRequest SUBMITTED -> APPROVED, property.extension_days_approved += requested days, property.holding_deadline += requested days, property.version incremented] }
  - { method: POST, path: "/api/extension-requests/{id}/deny", description: "Regulator denial", roles: [OREOCommittee], code: 200, input: [], output: ExtensionRequest, side_effects: [ExtensionRequest SUBMITTED -> DENIED] }
  - { method: POST, path: "/api/extension-requests/{id}/revise", description: "Revise a DENIED request back to DRAFT with a new day count (resubmission loop)", roles: [ComplianceOfficer], code: 200, input: [requested_extension_days], output: ExtensionRequest, side_effects: [ExtensionRequest DENIED -> DRAFT, requested_extension_days updated] }
  - { method: GET, path: "/api/ledger-entries", description: "List append-only ledger rows, filterable by property / write-down / closing", roles: [OREOAdmin, PropertyManager, OREOSpecialist, Appraiser, ChiefAppraiser, CreditOfficer, OREOCommittee, ComplianceOfficer, Broker], code: 200, input: ["property_id?", "write_down_id?", "closing_statement_id?", "entry_type?", "limit?", "offset?"], output: "LedgerEntry[]", side_effects: [] }
  - { method: GET, path: "/api/ledger-entries/{id}", description: "Read one ledger entry", roles: [OREOAdmin, PropertyManager, OREOSpecialist, Appraiser, ChiefAppraiser, CreditOfficer, OREOCommittee, ComplianceOfficer, Broker], code: 200, input: [], output: LedgerEntry, side_effects: [] }
  - { method: POST, path: "/api/approval-tiers", description: "Configure an approval-authority tier; [min_net_proceeds, max_net_proceeds) intervals must not overlap (adjacency allowed; null max = unbounded)", roles: [OREOAdmin], code: 201, input: [name, min_net_proceeds, "max_net_proceeds?", required_role], output: ApprovalTier, side_effects: [required_rank derived from required_role] }
  - { method: GET, path: "/api/approval-tiers", description: "List approval tiers", roles: [OREOAdmin, PropertyManager, OREOSpecialist, Appraiser, ChiefAppraiser, CreditOfficer, OREOCommittee, ComplianceOfficer, Broker], code: 200, input: ["limit?", "offset?"], output: "ApprovalTier[]", side_effects: [] }
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Test-driving logical clock. Server startup default (before any set call) is exactly 2026-05-01T00:00:00Z; the clock never falls back to wall-clock time. Setting the clock sweeps: (1) appraisal_status recomputed for all properties; (2) ACTIVE listings with end_date < clock -> EXPIRED (property may revert MARKETED -> HELD); (3) properties with clock > holding_deadline and lifecycle_status IN {HELD, MARKETED, UNDER_CONTRACT} -> CHARGED_OFF with the full charge-off cascade"
    roles: [OREOAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: [appraisal_currency sweep, listing expiry sweep, holding_period_compliance sweep with charge-off cascade]

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint, or entity-backed ownership mismatch (Appraiser acting on another appraiser's appraisal)" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, invalid type, invalid enum member, or range violation (e.g. offer_price <= 0, end_date <= start_date, requested_extension_days outside 1..1825)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_property_version does not match the property's current version (OCC)" }
  - { id: ERR_OFFER_NOT_REVIEWABLE, http: 409, condition: "Offer not in a from-state legal for submit-review / counter / resume / accept / reject / withdraw" }
  - { id: ERR_OFFER_NOT_ACCEPTED, http: 409, condition: "Closing creation or rescind attempted on an offer that is not ACCEPTED" }
  - { id: ERR_APPRAISAL_INVALID_STATE, http: 409, condition: "Appraisal not in the from-state legal for submit / certify / reject" }
  - { id: ERR_WRITE_DOWN_NOT_PROPOSED, http: 409, condition: "Approve/reject attempted on a WriteDown not in PROPOSED" }
  - { id: ERR_LISTING_NOT_ACTIVE, http: 409, condition: "Terminate attempted on a non-ACTIVE listing, or offer references a listing agreement that is not ACTIVE on the same property" }
  - { id: ERR_ISSUE_INVALID_STATE, http: 409, condition: "Issue transition attempted from an illegal from-state (e.g. resolve while OPEN, waive while IN_REMEDIATION)" }
  - { id: ERR_CLOSING_INVALID_STATE, http: 409, condition: "Settle attempted on non-DRAFT closing, or void attempted on non-SETTLED closing" }
  - { id: ERR_EXTENSION_INVALID_STATE, http: 409, condition: "Extension transition attempted from an illegal from-state (e.g. deny while DRAFT, revise while SUBMITTED)" }
  - { id: ERR_PROPERTY_NOT_MARKETABLE, http: 409, condition: "Offer creation or acceptance requires property.lifecycle_status == MARKETED; listing activation requires HELD" }
  - { id: ERR_PROPERTY_ALREADY_TERMINAL, http: 409, condition: "Operation targets a DISPOSED or CHARGED_OFF property (carrying costs, appraisals, issues, listings, extension submit, manual charge-off)" }
  - { id: ERR_APPRAISAL_OVERDUE, http: 409, condition: "Listing activation or offer creation while property.appraisal_status IN {UNAPPRAISED, OVERDUE}" }
  - { id: ERR_ENVIRONMENTAL_ISSUE_OPEN, http: 409, condition: "ENVIRONMENTAL IssueCase IN {OPEN, IN_REMEDIATION} blocks listing activation, offer acceptance, or closing creation" }
  - { id: ERR_TITLE_ISSUE_OPEN, http: 409, condition: "TITLE IssueCase IN {OPEN, IN_REMEDIATION} blocks closing creation" }
  - { id: ERR_LISTING_OVERLAP, http: 409, condition: "New listing's half-open [start_date, end_date) overlaps another DRAFT/ACTIVE listing on the same property (adjacency is allowed)" }
  - { id: ERR_EFFECTIVE_DATE_IN_FUTURE, http: 422, condition: "Appraisal effective_date is after the current logical clock" }
  - { id: ERR_CLOSING_BEYOND_DEADLINE, http: 422, condition: "closing_date is after the property's holding_deadline" }
  - { id: ERR_EXTENSION_CAP_EXCEEDED, http: 422, condition: "Approving would push extension_days_approved beyond the 1825-day aggregate allowance" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Certifier equals appraisal submitter, or write-down approver equals its proposer" }
  - { id: ERR_DUPLICATE_APPRAISAL_DATE, http: 409, condition: "Another CERTIFIED appraisal on the same property already carries this effective_date" }
  - { id: ERR_ENVIRONMENTAL_NOT_WAIVABLE, http: 422, condition: "Waive attempted on an ENVIRONMENTAL issue" }
  - { id: ERR_TIER_OVERLAP, http: 409, condition: "New approval tier's [min, max) interval overlaps an existing tier" }
  - { id: ERR_BROKER_NOT_ELIGIBLE, http: 422, condition: "Broker is SUSPENDED or does not cover the property's state_code" }
  - { id: ERR_APPRAISER_NOT_ELIGIBLE, http: 422, condition: "Appraiser does not cover the property's state_code" }
  - { id: ERR_NO_ELIGIBLE_BROKER, http: 422, condition: "Broker recommendation candidate pool is empty" }
  - { id: ERR_WRITE_DOWN_PENDING, http: 409, condition: "Offer acceptance blocked while a PROPOSED WriteDown exists on the property" }
  - { id: ERR_BELOW_MIN_PROCEEDS, http: 422, condition: "Projected net_proceeds <= 0 at offer acceptance" }
  - { id: ERR_APPROVAL_AUTHORITY_EXCEEDED, http: 403, condition: "Caller rank below the required ApprovalTier rank, or deep-discount (net_proceeds < 0.9 * carrying_value) requires OREOCommittee" }

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: OREOAdmin
    description: "OREO platform administrator; owns intake, vendor registration, tier configuration, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /api/oreo-properties"
      - "POST /api/appraisers"
      - "POST /api/brokers"
      - "PATCH /api/brokers/{id}"
      - "POST /api/approval-tiers"
      - "POST /api/_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]
  - name: PropertyManager
    description: "Manages held properties day-to-day: carrying costs, issue tracking, listing drafting"
    identity: opaque
    exclusive_operations:
      - "POST /api/carrying-costs"
      - "POST /api/issues"
      - "POST /api/issues/{id}/start-remediation"
      - "POST /api/issues/{id}/resolve"
    shared_operations: ["POST /api/listing-agreements", "all GET endpoints"]
  - name: OREOSpecialist
    description: "Disposition marketer: activates listings, works offers, drafts closings"
    identity: opaque
    exclusive_operations:
      - "POST /api/listing-agreements/{id}/activate"
      - "POST /api/listing-agreements/{id}/terminate"
      - "POST /api/offers"
      - "POST /api/offers/{id}/submit-review"
      - "POST /api/offers/{id}/counter"
      - "POST /api/offers/{id}/resume"
      - "POST /api/offers/{id}/withdraw"
      - "POST /api/closing-statements"
    shared_operations: ["POST /api/listing-agreements", "POST /api/offers/{id}/accept (rank 1)", "POST /api/offers/{id}/reject", "POST /api/offers/{id}/rescind", "all GET endpoints"]
  - name: Appraiser
    description: "Licensed appraiser; creates and submits own appraisals"
    identity: "entity_backed:Appraiser"
    exclusive_operations:
      - "POST /api/appraisals"
      - "POST /api/appraisals/{id}/submit"
    shared_operations: ["all GET endpoints"]
  - name: ChiefAppraiser
    description: "Review appraiser; certifies or rejects submissions — must not be the submitting appraiser"
    identity: opaque
    exclusive_operations:
      - "POST /api/appraisals/{id}/certify"
      - "POST /api/appraisals/{id}/reject"
    shared_operations: ["all GET endpoints"]
  - name: CreditOfficer
    description: "Credit authority: proposes write-downs, settles closings, accepts mid-tier offers"
    identity: opaque
    exclusive_operations:
      - "POST /api/write-downs"
      - "POST /api/closing-statements/{id}/settle"
    shared_operations: ["POST /api/offers/{id}/accept (rank 2)", "POST /api/offers/{id}/reject", "POST /api/offers/{id}/rescind", "all GET endpoints"]
  - name: OREOCommittee
    description: "Senior approval body and regulator proxy: approves write-downs and extensions, waives title issues, voids closings, accepts any offer tier"
    identity: opaque
    exclusive_operations:
      - "POST /api/write-downs/{id}/approve"
      - "POST /api/write-downs/{id}/reject"
      - "POST /api/issues/{id}/waive"
      - "POST /api/extension-requests/{id}/approve"
      - "POST /api/extension-requests/{id}/deny"
      - "POST /api/closing-statements/{id}/void"
    shared_operations: ["POST /api/offers/{id}/accept (rank 3)", "all GET endpoints"]
  - name: ComplianceOfficer
    description: "Regulatory compliance: files extension requests and executes manual charge-offs"
    identity: opaque
    exclusive_operations:
      - "POST /api/extension-requests"
      - "POST /api/extension-requests/{id}/submit"
      - "POST /api/extension-requests/{id}/revise"
      - "POST /api/oreo-properties/{id}/charge-off"
    shared_operations: ["all GET endpoints"]
  - name: Broker
    description: "External listing broker; read-only access to own record, listings, and offers"
    identity: "entity_backed:Broker"
    exclusive_operations: []
    shared_operations: ["all GET endpoints"]
