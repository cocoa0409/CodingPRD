            - "Wendy Cole holds one ASSIGNED TrainingAssignment for WVP-ADMIN with attempt_count 0 and due_at 2026-08-20T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /worksites"
