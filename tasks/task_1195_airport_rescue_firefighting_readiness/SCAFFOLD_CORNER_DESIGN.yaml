            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-102", full_name: "Ben Kim" }, as: ArffChief, captures: { ff2: $.data.id } }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-103", full_name: "Cal Ray" }, as: ArffChief, captures: { ff3: $.data.id } }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-104", full_name: "Dee Fox" }, as: ArffChief, captures: { ff4: $.data.id } }
