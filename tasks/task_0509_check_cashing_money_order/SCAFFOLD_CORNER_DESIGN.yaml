              payload: {}
              as: StoreManager
              as_user_id: "manager-9"
              captures: { dv: $.data.version }
          trigger:
            - call: "POST /cash-drawers/${drawer_id}/close"
              payload: { counted_cash_cents: 400000, expected_drawer_version: "${dv}" }
              as: StoreManager
              as_user_id: "manager-9"
              captures: { new_v: $.data.version }
          assert:
            - "CashDrawer.${drawer_id}.status == CLOSED"
            - "CashDrawer.${drawer_id}.variance_cents == 0"
            - "CashDrawer.${drawer_id}.version == ${dv} + 1"

      - name: drawer_close_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ['concurrency_rules[drawer-close-stale-version]', 'errors[ERR_STALE_DRAWER_VERSION]', 'endpoints."POST /cash-drawers/{id}/close"']
        distinguishing_aspect: "Closing with expected_drawer_version one behind the actual (the version read before begin-reconcile bumped it) -> ERR_STALE_DRAWER_VERSION (412). Uses ${dv0} - ... no: uses a stale captured version."
        test_recipe:
          setup: ["a drawer opened (version captured as ${dv0}), then begin-reconciled (which is itself a mutation bumping the version), so ${dv0} is now stale relative to the close-eligible RECONCILING version"]
          setup_api_calls:
            - call: "POST /cash-drawers"
              payload: { store_code: "C33", business_date: "2026-05-01", opening_float_cents: 400000 }
              as: StoreManager
              as_user_id: "manager-9"
              captures: { drawer_id: $.data.id, dv0: $.data.version }
            - call: "POST /cash-drawers/${drawer_id}/begin-reconcile"
              payload: {}
              as: StoreManager
              as_user_id: "manager-9"
          trigger:
            - call: "POST /cash-drawers/${drawer_id}/close"
              payload: { counted_cash_cents: 400000, expected_drawer_version: "${dv0}" }
              as: StoreManager
              as_user_id: "manager-9"
          assert:
            - "response error_id == ERR_STALE_DRAWER_VERSION"
            - "response http_status == 412"

      - name: customer_version_increments_on_screen_cascade
        claim_type: derived_field_reconciliation
        grounds: [entities.Customer.fields.version, entities.Customer.fields.kyc_status]
        distinguishing_aspect: "A compliance screen mutates Customer.kyc_status (a computed field) and increments Customer.version from 1 to 2 (mutation including cascaded side effect)."
        test_recipe:
          setup: ["a registered customer (version 1, kyc_status PENDING)"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ver Bump", id_type: "STATE_ID", id_number: "SID-135", date_of_birth: "1985-05-05" }
              as: Teller
              as_user_id: "teller-1"
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /compliance-screens"
              payload: { customer_id: "${cust_id}", ofac_list_hit: false, kyc_documents_valid: true }
              as: StoreManager
              as_user_id: "manager-9"
          assert:
            - "Customer.${cust_id}.kyc_status == VERIFIED"
            - "Customer.${cust_id}.version == 2"

      - name: velocity_count_threshold_at_boundary
        claim_type: rate_threshold_triggers
        grounds: ['validations[priority=12]', calculations.velocity_window, 'errors[ERR_VELOCITY_LIMIT_EXCEEDED]']
        excluded_because:
          difficulty_instance: resource_temporal_overlap / velocity_rolling_window_half_open_aggregate
          rationale: "The DAILY_TXN_LIMIT=12 boundary and 13th-posting rejection are exercised by the named §1.8 rolling-window instance."

  # =========================================================================
  # SECTION: consistency_model
  # =========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_post_cascade
        claim_type: immediate
        grounds: [calculations.drawer_expected_cash, entities.CashDrawer.fields.expected_cash_cents]
        distinguishing_aspect: "The drawer's expected_cash_cents reflects a CHECK_CASH posting in the SAME request cycle: immediately after POST /transactions (face=100000 fee=1099), GET /cash-drawers/{id} shows expected 901099 (opening 1000000 - 98901)."
        test_recipe:
          setup: ["VERIFIED customer, GOVT schedule, OPEN drawer float 1000000"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Immed Vis", id_type: "DRIVERS_LICENSE", id_number: "DL-136", date_of_birth: "1990-06-06" }
              as: Teller
              as_user_id: "teller-1"
              captures: { cust_id: $.data.id }
            - call: "POST /compliance-screens"
              payload: { customer_id: "${cust_id}", ofac_list_hit: false, kyc_documents_valid: true }
              as: StoreManager
              as_user_id: "manager-9"
            - call: "POST /fee-schedules"
              payload: { check_type: "GOVERNMENT", base_fee_cents: 99, percent_rate_bps: 100, tier_breakpoint_cents: 500000, high_percent_rate_bps: 200, max_fee_cents: 50000, active: true }
              as: StoreManager
              as_user_id: "manager-9"
              captures: { sched_id: $.data.id }
            - call: "POST /cash-drawers"
              payload: { store_code: "C34", business_date: "2026-05-01", opening_float_cents: 1000000 }
              as: StoreManager
              as_user_id: "manager-9"
              captures: { drawer_id: $.data.id }
            - call: "POST /transactions"
              payload: { customer_id: "${cust_id}", drawer_id: "${drawer_id}", txn_type: "CHECK_CASH", face_amount_cents: 100000, fee_schedule_id: "${sched_id}", maker_account_risk: "LOW" }
              as: Teller
              as_user_id: "teller-1"
          trigger:
            - call: "GET /cash-drawers/${drawer_id}"
              payload: {}
              as: StoreManager
              as_user_id: "manager-9"
          assert:
            - "CashDrawer.${drawer_id}.expected_cash_cents == 901099"
