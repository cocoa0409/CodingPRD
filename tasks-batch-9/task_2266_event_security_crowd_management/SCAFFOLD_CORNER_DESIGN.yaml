  - name: event_close_cascades_lanes_posts_plan_and_on_post_assignments
    claim_type: side_effect_execution
    grounds:
    - state_machines.SecurityEvent.IN_PROGRESS_to_CLOSED
    - state_machines.PostAssignment.ON_POST_to_RELIEVED
    - state_machines.PostAssignment.CONFIRMED_to_COMPLETED
    - state_machines.StaffingPlan.LOCKED_to_CLOSED
    - state_machines.ScreeningLane.OPEN_to_CLOSED
    - state_machines.Post.FILLED_to_CLOSED
    - calculations.assignment_cost
    distinguishing_aspect: |
      Event CLOSE is the widest single side-effect set in §1.2 — it relieves and completes the on-post roster, closes every lane, drags an ACTIVATED plan through LOCKED to CLOSED and closes every post — so the claim is that all five entity families move in ONE request, and specifically that the billed ledger is written from the actual on-post span while the committed ledger is deliberately left alone.
