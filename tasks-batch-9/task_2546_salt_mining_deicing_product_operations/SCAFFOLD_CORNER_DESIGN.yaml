          assert:
            - "${fresh_lot_v} == ${stale_lot_v} + 2 and ${lstate} == AVAILABLE"
            - "call 1 -> HTTP 412 with error code ERR_STALE_STOCKPILE_LOT_VERSION and the lot's tonnage split is untouched (940.00 / 0.00 / 940.00)"
            - "call 2 -> HTTP 201 with ${origin} == MANUAL and ${rank} == 1"
            - "StockpileLot.${lot_id}.tons_reserved == 500.00, tons_available == 440.00 and version == ${fresh_lot_v} + 1"
            - "DeliveryOrder.${order_id}.status == ALLOCATED and allocated_tons == 500.00"

      - name: four_level_defect_cascade_end_to_end
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: defect_inspection_cascades_panel_mine_run_and_open_tonnage
          rationale: |
            The full four-hop chain (inspection -> panel SUSPENDED -> mine hoist derate/down ->
            SCHEDULED runs HELD -> scheduled_hoist_tons_open re-derived), its ordering sensitivity and
            the fact that an already HOISTED run is spared are all asserted there; the second
            cascade shape (order shortfall into the contract ledger) is asserted by
            shortfall_cascades_order_penalty_into_contract_ledger_and_breach_watch.

      - name: both_preseason_target_variants_and_the_switch_delta
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: preseason_target_severity_weighted_versus_trailing_baseline_switch
          rationale: |
            Both declared variants of calculations.preseason_stockpile_target are computed on one
            forecast row there and the signed delta on the method switch is asserted as a literal;
            the second dual-variant calculation (penalty PER_EVENT vs SEASON_AGGREGATE) is asserted by
            shortfall_penalty_per_event_versus_season_aggregate_reconciliation.

      - name: covered_utilization_threshold_at_the_boundary
        claim_type: rate_threshold_triggers
        excluded_because:
          difficulty_instance: covered_storage_auto_surge_at_exactly_ninety_percent_of_capacity
          rationale: |
            The instantaneous boundary (one ton under stays OPEN, exactly at flips to SURGE, on the
            unrounded cross-multiplied ratio rather than the 2-decimal field) and the fact that a
            manual return to OPEN is not re-tripped are all asserted there; the cumulative variant of
            the same layer — the breach_watch threshold at 5 % of contract value — is asserted by
            shortfall_cascades_order_penalty_into_contract_ledger_and_breach_watch.

  # ===========================================================================
  # 9. From Consistency Model — complexity_profile.consistency_model = immediate
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: allocate_response_already_carries_every_recomputed_field
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.storm_allocation_waterfall
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          Every derived field must be correct in the SAME response that caused the change, not on a
          later read: the allocate response itself must show ALLOCATED / 500.00, and the subsequent
          GETs of the order, the lot and the depot posture must be byte-identical to what the write
          already reported. Any deferred or batched recomputation shows up as a difference between
          the write response and the immediate read.
        test_recipe:
          setup:
            - "A 940.00 t covered NY HIGHWAY_DEICING lot at Syracuse Depot, an ACTIVE 1000 t NY contract and a REQUESTED 500 t order."
          setup_api_calls:
            - call: "POST /salt/mines"
