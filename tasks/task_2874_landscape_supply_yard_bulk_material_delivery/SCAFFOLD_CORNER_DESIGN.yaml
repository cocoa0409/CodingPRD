            - "trigger 1: HTTP 403 with data.error_id == \"ERR_SEGREGATION_OF_DUTIES\" (X-User-ID equals DeliveryLoad.${load_id}.dispatched_by_user_id); the claim stays UNDER_REVIEW with decided_by_user_id null"
            - "trigger 2: HTTP 200 with status == APPROVED, decided_by_user_id == \"adjuster-clean\" and approved_amount_cents == 20000"
            - "payable_cents == 20000 because the load carried driveway_protection_used false, which zeroes the 15000 deductible"

      - name: shared_read_operations_work_for_every_declared_role
        claim_type: shared_operations
        grounds:
          - endpoints[GET /material-orders/{materialOrderId}]
          - endpoints[GET /materials]
        distinguishing_aspect: "The order detail read is the one endpoint every one of the six roles shares, so all six must succeed on the identical row while account scoping still applies to the contractor arm."
        test_recipe:
          setup:
            - "One account owning a DRAFT WILL_CALL order."
          setup_api_calls:
            - call: "POST /contractor-accounts"
              payload: { business_name: "Shared Landscapes", credit_limit_cents: 500000, po_required: false, driveway_protection_required: false }
              as: YardAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /material-orders"
              payload: { contractor_account_id: "${acct_id}", fulfillment_mode: "WILL_CALL" }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { ord_id: $.data.id }
          trigger:
            - call: "GET /material-orders/${ord_id}"
              payload: {}
              as: YardAdmin
            - call: "GET /material-orders/${ord_id}"
              payload: {}
              as: CreditManager
            - call: "GET /material-orders/${ord_id}"
              payload: {}
              as: DispatchPlanner
            - call: "GET /material-orders/${ord_id}"
              payload: {}
              as: YardLoader
            - call: "GET /material-orders/${ord_id}"
              payload: {}
              as: ClaimsAdjuster
            - call: "GET /material-orders/${ord_id}"
              payload: {}
              as: Contractor
              as_user_id: "${acct_id}"
          assert:
            - "all six triggers return HTTP 200 with the same id ${ord_id}, fulfillment_mode WILL_CALL and fulfillment_status DRAFT"
            - "no role sees a different projection of the row — the shared read is not role-filtered"

  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_expected_material_version_on_price_create_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[price-schedule-create-stale-material]
          - errors[ERR_STALE_MATERIAL_VERSION]
        distinguishing_aspect: "Posting a price row is itself a write against the parent material, so the version the client quoted when it read the material is already stale after the first schedule lands; the second post must be refused and then succeed with the re-read version."
        test_recipe:
          setup:
            - "One material whose version is captured at creation, plus one EFFECTIVE price row created with that version (which advances the material to the next version)."
          setup_api_calls:
            - call: "POST /materials"
              payload: { sku: "MULCH-C1", name: "Concurrency Mulch", offered_forms: [BULK], seasonal_category: "MULCH", density_lb_per_cubic_yard: 900, shrinkage_factor: 0.10, moisture_pct: 15.0, unit_bag_cubic_yards: 0.037, prebuy_eligible: false }
              as: YardAdmin
              captures: { mat_id: $.data.id, mat_ver: $.data.version }
            - call: "POST /price-schedules"
              payload: { material_id: "${mat_id}", effective_from: "2026-07-01T00:00:00.000Z", bulk_price_per_cubic_yard_cents: 2000, bagged_price_per_bag_cents: 899, seasonal_surcharge_pct: 0.0, expected_material_version: "${mat_ver}" }
              as: YardAdmin
              captures: { sched_1: $.data.id }
          trigger:
            - call: "POST /price-schedules"
              payload: { material_id: "${mat_id}", effective_from: "2026-09-01T00:00:00.000Z", bulk_price_per_cubic_yard_cents: 2400, bagged_price_per_bag_cents: 999, seasonal_surcharge_pct: 5.0, expected_material_version: "${mat_ver}" }
              as: YardAdmin
            - call: "GET /materials/${mat_id}"
              payload: {}
              as: YardAdmin
              captures: { mat_ver2: $.data.version }
            - call: "POST /price-schedules"
              payload: { material_id: "${mat_id}", effective_from: "2026-09-01T00:00:00.000Z", bulk_price_per_cubic_yard_cents: 2400, bagged_price_per_bag_cents: 999, seasonal_surcharge_pct: 5.0, expected_material_version: "${mat_ver2}" }
              as: YardAdmin
              captures: { sched_2: $.data.id }
            - call: "GET /price-schedules"
              payload: { material_id: "${mat_id}", limit: 10, offset: 0 }
              as: YardAdmin
          assert:
            - "trigger 1: HTTP 412 with data.error_id == \"ERR_STALE_MATERIAL_VERSION\"; no PriceSchedule row is created and Material.${mat_id}.version is unchanged by the failed attempt"
            - "trigger 2: version == ${mat_ver2} == ${mat_ver} + 1 (the setup schedule advanced it exactly once)"
            - "trigger 3: HTTP 201 with status == SCHEDULED (effective_from is in the future) and Material.${mat_id}.version == ${mat_ver} + 2"
            - "trigger 4: total_count == 2 with ${sched_1} still EFFECTIVE and ${sched_2} SCHEDULED — the refused attempt left no partial row behind"

      - name: stale_expected_account_version_on_credit_adjustment_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[credit-adjustment-stale-account]
          - errors[ERR_STALE_ACCOUNT_VERSION]
        distinguishing_aspect: "The second OCC rule guards money rather than price: a credit manager holding a pre-adjustment view of the account is refused, and the retry with the re-read version applies the new limit and recomputes credit_available_cents in the same response."
        test_recipe:
          setup:
            - "One account limited to 100000 cents whose version is captured at creation, then raised to 200000 by a first credit adjustment quoting that version."
          setup_api_calls:
            - call: "POST /contractor-accounts"
              payload: { business_name: "Concurrency Landscapes", credit_limit_cents: 100000, po_required: false, driveway_protection_required: false }
              as: YardAdmin
              captures: { acct_id: $.data.id, acct_ver: $.data.version }
            - call: "POST /contractor-accounts/${acct_id}/credit-adjustments"
              payload: { new_credit_limit_cents: 200000, memo: "First raise.", expected_contractor_account_version: "${acct_ver}" }
              as: CreditManager
          trigger:
            - call: "POST /contractor-accounts/${acct_id}/credit-adjustments"
              payload: { new_credit_limit_cents: 300000, memo: "Racing raise.", expected_contractor_account_version: "${acct_ver}" }
              as: CreditManager
            - call: "GET /contractor-accounts/${acct_id}"
              payload: {}
              as: CreditManager
              captures: { acct_ver2: $.data.version }
            - call: "POST /contractor-accounts/${acct_id}/credit-adjustments"
              payload: { new_credit_limit_cents: 300000, memo: "Racing raise, retried.", expected_contractor_account_version: "${acct_ver2}" }
              as: CreditManager
          assert:
            - "trigger 1: HTTP 412 with data.error_id == \"ERR_STALE_ACCOUNT_VERSION\"; credit_limit_cents stays 200000"
            - "trigger 2: credit_limit_cents == 200000, credit_used_cents == 0, credit_available_cents == 200000 and version == ${acct_ver2} == ${acct_ver} + 1"
            - "trigger 3: HTTP 200 with credit_limit_cents == 300000, credit_available_cents == 300000 in the same response body and version == ${acct_ver} + 2"

      - name: cascading_side_effects_chain_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
        excluded_because:
          difficulty_instance: delivery_repricing_cascades_to_credit_hold_and_cancels_queued_ticket
          rationale: "The §1.8 multi_hop_cascade instance already walks a five-hop chain (delivery repricing -> credit recomputation -> CREDIT_HOLD entry -> queued-ticket cancellation -> order revert) and asserts each hop, which is exactly this layer's claim."

      - name: dual_variant_calculation_produces_two_results_and_a_delta
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
        excluded_because:
          difficulty_instance: order_total_quoted_at_confirm_versus_final_at_delivery
          rationale: "The §1.8 dual_variant_divergence instance runs both order-charge variants on one order and asserts the delta, covering variant divergence, variant selection and reconciliation in a single flow."

      - name: rate_threshold_trigger_tested_at_its_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers[rate_threshold_triggers]
        excluded_because:
          difficulty_instance: min_load_fee_threshold_exact_versus_one_cent_short
          rationale: "The §1.8 boundary instance pins the minimum-load-fee threshold at exactly the constant and one cent below it, which is this layer's boundary claim; the discount tier boundary is separately covered in the calculations section."

  - section: consistency_model
    instances:
      - name: delivery_cascade_is_visible_to_the_next_read_with_no_lag
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "One delivery rewrites five different rows; under an immediate model the write response and every follow-up read in the same test must already agree, with no second read needed to see the settled values."
        test_recipe:
          setup:
            - "A CONFIRMED 6.0 cubic-yard CLASS_A delivery order 2 miles out (bulk 12000 + min-load fee 7500 + TRI_AXLE delivery 13500 + 850 mileage = 33850) with a DISPATCHED 6.0 cubic-yard load and a 100 cubic-yard lot."
          setup_api_calls:
            - call: "POST /materials"
              payload: { sku: "AGG-CM1", name: "Consistency Stone", offered_forms: [BULK], seasonal_category: "AGGREGATE", density_lb_per_cubic_yard: 1000, shrinkage_factor: 0.10, moisture_pct: 15.0, unit_bag_cubic_yards: 0.037, prebuy_eligible: false }
              as: YardAdmin
              captures: { mat_id: $.data.id, mat_ver: $.data.version }
            - call: "POST /price-schedules"
              payload: { material_id: "${mat_id}", effective_from: "2026-07-01T00:00:00.000Z", bulk_price_per_cubic_yard_cents: 2000, bagged_price_per_bag_cents: 899, seasonal_surcharge_pct: 0.0, expected_material_version: "${mat_ver}" }
              as: YardAdmin
            - call: "POST /inventory-lots"
              payload: { material_id: "${mat_id}", gross_cubic_yards: 100.0, moisture_pct_at_intake: 15.0 }
              as: YardAdmin
              captures: { lot_id: $.data.id }
            - call: "POST /contractor-accounts"
              payload: { business_name: "Consistency Landscapes", credit_limit_cents: 5000000, po_required: false, driveway_protection_required: false }
              as: YardAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /material-orders"
              payload: { contractor_account_id: "${acct_id}", fulfillment_mode: "DELIVERY", delivery_address: "11 Consistency Ct", driveway_access_class: "CLASS_A", delivery_distance_miles: 2.0 }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /order-lines"
              payload: { material_order_id: "${ord_id}", material_id: "${mat_id}", form: "BULK", quantity: 6.0 }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { line_id: $.data.id }
            - call: "POST /material-orders/${ord_id}/confirm"
              payload: {}
              as: Contractor
              as_user_id: "${acct_id}"
            - call: "POST /delivery-trucks"
              payload: { truck_code: "TRI-CM1", axle_class: "TRI_AXLE", max_payload_lb: 60000, bed_capacity_cubic_yards: 20.0, min_driveway_access_class: "CLASS_A" }
              as: DispatchPlanner
              captures: { truck_id: $.data.id }
            - call: "POST /delivery-loads"
              payload: { material_order_id: "${ord_id}", delivery_truck_id: "${truck_id}", planned_cubic_yards: 6.0, window_start: "2026-08-02T08:00:00.000Z", window_end: "2026-08-02T09:00:00.000Z" }
              as: DispatchPlanner
              captures: { load_id: $.data.id }
            - call: "POST /delivery-loads/${load_id}/dispatch"
              payload: {}
              as: DispatchPlanner
              as_user_id: "planner-cm1"
          trigger:
            - call: "POST /delivery-loads/${load_id}/deliver"
              payload: { actual_net_cubic_yards: 6.0, driveway_protection_used: true, spillage_cubic_yards: 0.0 }
              as: DispatchPlanner
              as_user_id: "planner-cm1"
            - call: "GET /material-orders/${ord_id}"
              payload: {}
              as: CreditManager
            - call: "GET /order-lines/${line_id}"
              payload: {}
              as: CreditManager
            - call: "GET /inventory-lots/${lot_id}"
              payload: {}
              as: YardAdmin
            - call: "GET /delivery-trucks/${truck_id}"
              payload: {}
              as: DispatchPlanner
            - call: "GET /contractor-accounts/${acct_id}"
              payload: {}
              as: CreditManager
          assert:
            - "trigger 1: HTTP 200 whose own body already shows status == DELIVERED with actual_net_cubic_yards == 6.00 and driveway_protection_used == true"
            - "trigger 2: fulfillment_status == FULFILLED and final_total_cents == 33850 on the first read — no re-read is required"
            - "trigger 3: delivered_volume_cubic_yards == 6.00 on the single BULK line"
            - "trigger 4: withdrawn_gross_cubic_yards == 6.00, reserved_cubic_yards == 0.00 and status still AVAILABLE"
            - "trigger 5: DeliveryTruck.${truck_id}.status == AVAILABLE — the window release is not deferred"
            - "trigger 6: credit_used_cents == 33850 (the final total replaced the quote) and credit_available_cents == 4966150"
