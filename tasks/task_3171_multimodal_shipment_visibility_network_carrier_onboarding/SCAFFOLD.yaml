# =============================================================================
# Scaffold — Multimodal Shipment Visibility Network & Carrier Onboarding
# task_3171_multimodal_shipment_visibility_network_carrier_onboarding
# =============================================================================

scenario: |
  Multimodal Shipment Visibility Network & Carrier Onboarding (project44): carrier
  connection onboarding across telematics providers, transportation management systems
  and manual updates with data quality scoring, shipment identity resolution matching
  purchase orders, shipments and tracking references across parties, estimated time of
  arrival modeling with confidence intervals and exception alerting on delay risk,
  facility dwell and appointment adherence analytics with detention exposure, ocean,
  rail, parcel and truckload mode differences in data availability and update cadence,
  alert routing and workflow for exception management by customer service teams, data
  sharing permissions between shippers, carriers and their customers, connection health
  monitoring and remediation

domain_name: multimodal-shipment-visibility
api_prefix: "/"

# =============================================================================
# §0.3 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: event_sourcing        # shipment state derived by replaying ordered tracking events
  secondary_archetype: access_control_matrix  # shipper/carrier/consignee data-share grants
  complexity_layers:
    - optimistic_concurrency               # OCC on PurchaseOrder.version and Facility.version
    - cascading_side_effects               # checkpoint staleness cascade; delay-confirmation cascade
    - dual_variant_calculation             # ETA variants; data-quality variants
    - ops_run_checkpoint                   # POST /_ops/run-checkpoint advances the quality/ETA epoch
  entity_topology: hybrid                  # flat FK references + sub-resource reads
  state_machine_shape: parallel            # Shipment carries tracking_status x identity_state; other machines cyclic/branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic                          # DataShareGrant.grantee_id resolves to Carrier or Consignee by grantee_type
  role_model: peer_roles                   # NetworkOps / CarrierRep / ShipperRep / CustomerService own distinct surfaces
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Carrier
    parent: null
    common_fields: true
    fields:
      - { name: carrier_name, type: string, source: input, description: "Carrier legal name" }
      - { name: scac_code, type: string, source: input, description: "Standard Carrier Alpha Code" }

  - name: Shipper
    parent: null
    common_fields: true
    fields:
      - { name: company_name, type: string, source: input, description: "Shipper company name" }

  - name: Consignee
    parent: Shipper
    common_fields: true
    fields:
      - { name: shipper_id, type: string, source: system, description: "FK -> Shipper.id; owning shipper (path parameter)" }
      - { name: company_name, type: string, source: input, description: "Consignee company name" }
      - { name: destination_code, type: string, source: input, description: "Destination location code" }

  - name: CarrierConnection
    parent: Carrier
    common_fields: true
    fields:
      - { name: carrier_id, type: string, source: system, description: "FK -> Carrier.id; owning carrier (path parameter)" }
      - { name: channel, type: enum, source: input, description: "TELEMATICS | TMS | MANUAL", constraints: "enum {TELEMATICS, TMS, MANUAL}" }
      - { name: supported_modes, type: array, source: input, description: "Array of mode enums the connection can feed", constraints: "non-empty subset of {OCEAN, RAIL, PARCEL, TRUCKLOAD}; MANUAL channel must not include PARCEL" }
      - { name: status, type: enum, source: system, description: "DRAFT | CREDENTIALS_SUBMITTED | TESTING | ACTIVE | SUSPENDED | RETIRED", constraints: "initial DRAFT" }
      - { name: credential_ref, type: string, source: system, description: "Credential reference recorded at submit-credentials, null until then" }
      - { name: testing_window_start, type: datetime, source: system, description: "Certification window start (closed interval), null until begin-testing" }
      - { name: testing_window_end, type: datetime, source: system, description: "Certification window end (closed interval, inclusive), null until begin-testing" }
      - { name: cadence_minutes, type: integer, source: computed, description: "Required heartbeat cadence: TELEMATICS 15, TMS 240, MANUAL 1440" }
      - { name: data_quality_score, type: integer, source: computed, description: "Authoritative epoch-windowed quality score (0-100), null until first scoring checkpoint" }
      - { name: instantaneous_quality_score, type: integer, source: computed, description: "Instantaneous variant from latest heartbeat only, null until first heartbeat" }
      - { name: health_status, type: enum, source: computed, description: "HEALTHY | DEGRADED | CRITICAL derived from data_quality_score", constraints: "HEALTHY >= 70, DEGRADED >= 40, CRITICAL < 40; null until scored" }
      - { name: missed_heartbeat_streak, type: integer, source: computed, description: "Consecutive checkpoint windows with no on-cadence heartbeat", default: 0 }
      - { name: last_heartbeat_at, type: datetime, source: system, description: "Ingest time of most recent heartbeat, null until first heartbeat" }
      - { name: suspended_at, type: datetime, source: system, description: "Timestamp of latest ACTIVE -> SUSPENDED transition, null when not suspended" }

  - name: PurchaseOrder
    parent: Shipper
    common_fields: true
    fields:
      - { name: shipper_id, type: string, source: system, description: "FK -> Shipper.id; owning shipper (path parameter)" }
      - { name: po_number, type: string, source: input, description: "Purchase order number" }
      - { name: destination_code, type: string, source: input, description: "Destination location code" }
      - { name: booking_reference, type: string, source: input, description: "Carrier booking reference used for identity matching" }
      - { name: confirmed_link_count, type: integer, source: computed, description: "Count of ShipmentIdentityLinks in CONFIRMED state pointing at this PO", default: 0 }

  - name: Facility
    parent: null
    common_fields: true
    fields:
      - { name: facility_name, type: string, source: input, description: "Facility name" }
      - { name: facility_type, type: enum, source: input, description: "ORIGIN | DESTINATION | BOTH", constraints: "enum {ORIGIN, DESTINATION, BOTH}" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", constraints: "initial ACTIVE" }
      - { name: total_dwell_minutes, type: integer, source: computed, description: "Sum of dwell_minutes over COMPLETED (non-voided) appointments", default: 0 }
      - { name: detention_exposure_minutes, type: integer, source: computed, description: "Sum of exposure_minutes over COMPLETED (non-voided) appointments", default: 0 }
      - { name: appointment_adherence_pct, type: integer, source: computed, description: "round_half_up(100 * adherent_count / (completed_count + missed_count)); null when denominator is 0" }

  - name: Shipment
    parent: Shipper
    common_fields: true
    fields:
      - { name: shipper_id, type: string, source: system, description: "FK -> Shipper.id; owning shipper (path parameter)" }
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id; carrying carrier" }
      - { name: connection_id, type: string, source: input, description: "FK -> CarrierConnection.id; data feed connection" }
      - { name: mode, type: enum, source: input, description: "OCEAN | RAIL | PARCEL | TRUCKLOAD", constraints: "enum {OCEAN, RAIL, PARCEL, TRUCKLOAD}; must be in connection.supported_modes" }
      - { name: tracking_reference, type: string, source: input, description: "Tracking reference" }
      - { name: mode_reference, type: string, source: input, description: "Mode-specific reference: container number (OCEAN), railcar number (RAIL), parcel tracking number (PARCEL), PRO number (TRUCKLOAD)" }
      - { name: destination_code, type: string, source: input, description: "Destination location code" }
      - { name: po_reference_claim, type: string, source: input, description: "Carrier-claimed PO number used for identity matching; empty string when unknown", default: "" }
      - { name: planned_departure_at, type: datetime, source: input, description: "Planned departure (UTC)" }
      - { name: planned_arrival_at, type: datetime, source: input, description: "Planned arrival (UTC); must be strictly after planned_departure_at" }
      - { name: tracking_status, type: enum, source: system, description: "BOOKED | IN_TRANSIT | EXCEPTION | OUT_FOR_DELIVERY | DELIVERED | CANCELLED", constraints: "initial BOOKED; derived by replaying non-voided TrackingEvents" }
      - { name: identity_state, type: enum, source: system, description: "UNRESOLVED | MATCHED_PROVISIONAL | MATCHED_CONFIRMED", constraints: "initial UNRESOLVED; independent of tracking_status" }
      - { name: data_freshness, type: enum, source: system, description: "FRESH | STALE", constraints: "initial FRESH; STALE when feed connection is suspended while shipment in transit" }
      - { name: eta_at, type: datetime, source: computed, description: "Predicted arrival per eta_prediction (baseline at creation)" }
      - { name: eta_variant, type: enum, source: computed, description: "SCHEDULED_BASELINE | TELEMETRY_BLENDED; which variant produced eta_at" }
      - { name: eta_confidence_halfwidth_minutes, type: integer, source: computed, description: "Confidence-interval halfwidth per eta_confidence_halfwidth rule" }
      - { name: actual_delay_minutes, type: integer, source: computed, description: "Recorded when a DELAY_RISK alert is resolved DELAY_CONFIRMED", default: 0 }

  - name: TrackingEvent
    parent: Shipment
    common_fields: false
    fields:
      - { name: shipment_id, type: string, source: system, description: "FK -> Shipment.id; parent shipment (path parameter)" }
      - { name: event_time, type: datetime, source: input, description: "When the event occurred at the carrier (UTC)" }
      - { name: event_type, type: enum, source: input, description: "DEPARTED | ARRIVED_WAYPOINT | POSITION_UPDATE | DELAY_REPORTED | RECOVERED | OUT_FOR_DELIVERY | DELIVERED", constraints: "enum as listed" }
      - { name: delay_minutes, type: integer, source: input, description: "Delay magnitude; only meaningful on DELAY_REPORTED / RECOVERED", default: 0 }
      - { name: is_late, type: boolean, source: computed, description: "true when event_time is earlier than the max event_time already applied to the shipment at ingest" }
      - { name: voided, type: boolean, source: system, description: "true after void endpoint; voided events excluded from replay", default: false }

  - name: ShipmentIdentityLink
    parent: Shipment
    common_fields: true
    fields:
      - { name: shipment_id, type: string, source: system, description: "FK -> Shipment.id; parent shipment (path parameter)" }
      - { name: purchase_order_id, type: string, source: input, description: "FK -> PurchaseOrder.id; matched purchase order" }
      - { name: match_score, type: number, source: computed, description: "Identity match score in [0,1] per identity_match_score rule, computed at proposal" }
      - { name: status, type: enum, source: system, description: "PROPOSED | CONFIRMED | REJECTED", constraints: "initial PROPOSED" }

  - name: ExceptionAlert
    parent: Shipment
    common_fields: true
    fields:
      - { name: shipment_id, type: string, source: system, description: "FK -> Shipment.id; parent shipment" }
      - { name: alert_type, type: enum, source: system, description: "DELAY_RISK | CONNECTION_DEGRADED", constraints: "system-created only" }
      - { name: severity, type: enum, source: computed, description: "MEDIUM | HIGH per delay_risk_assessment (HIGH iff projected delay > 2x tolerance)" }
      - { name: assigned_queue, type: string, source: computed, description: "CS_TIER2 when severity HIGH, else CS_TIER1" }
      - { name: status, type: enum, source: system, description: "OPEN | ESCALATED | ACKNOWLEDGED | RESOLVED", constraints: "initial OPEN" }
      - { name: opened_at, type: datetime, source: system, description: "Logical-clock timestamp at alert creation" }
      - { name: resolution, type: enum, source: input, description: "DELAY_CONFIRMED | FALSE_ALARM | DELIVERY_OBSERVED; required at resolve", constraints: "enum as listed" }
      - { name: resolved_at, type: datetime, source: system, description: "Logical-clock timestamp at resolve, null until then" }

  - name: Appointment
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: system, description: "FK -> Facility.id; booked facility (path parameter)" }
      - { name: shipment_id, type: string, source: input, description: "FK -> Shipment.id; shipment being received/shipped" }
      - { name: window_start, type: datetime, source: input, description: "Appointment window start (half-open interval start)" }
      - { name: window_end, type: datetime, source: input, description: "Appointment window end (half-open interval end, exclusive); must be strictly after window_start" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | MISSED | VOIDED", constraints: "initial SCHEDULED" }
      - { name: actual_arrival_at, type: datetime, source: input, description: "Actual arrival recorded at completion, null until then" }
      - { name: actual_departure_at, type: datetime, source: input, description: "Actual departure recorded at completion, null until then" }
      - { name: dwell_minutes, type: integer, source: computed, description: "actual_departure_at - actual_arrival_at in minutes, null until completed" }
      - { name: adherent, type: boolean, source: computed, description: "true iff window_start <= actual_arrival_at < window_end, null until completed" }
      - { name: exposure_minutes, type: integer, source: computed, description: "Detention exposure per detention_exposure rule, null until completed" }

  - name: DataShareGrant
    parent: Shipper
    common_fields: true
    fields:
      - { name: shipper_id, type: string, source: system, description: "FK -> Shipper.id; granting shipper (path parameter)" }
      - { name: grantee_type, type: enum, source: input, description: "CARRIER | CONSIGNEE", constraints: "enum {CARRIER, CONSIGNEE}" }
      - { name: grantee_id, type: string, source: input, description: "Polymorphic reference, resolved by grantee_type: a Carrier.id when CARRIER, a Consignee.id when CONSIGNEE" }
      - { name: scope, type: enum, source: input, description: "ETA_ONLY | FULL_TRACE", constraints: "enum {ETA_ONLY, FULL_TRACE}" }
      - { name: effective_from, type: datetime, source: input, description: "Grant effective start (UTC)" }
      - { name: expires_at, type: datetime, source: input, description: "Grant expiry (UTC); must be strictly after effective_from" }
      - { name: status, type: enum, source: system, description: "ACTIVE | REVOKED", constraints: "initial ACTIVE" }

  - name: HeartbeatRecord
    parent: CarrierConnection
    common_fields: false
    fields:
      - { name: connection_id, type: string, source: system, description: "FK -> CarrierConnection.id; parent connection (path parameter)" }
      - { name: reported_at, type: datetime, source: input, description: "When the carrier claims the data was sent (UTC)" }
      - { name: recorded_at, type: datetime, source: system, description: "Logical-clock ingest timestamp" }
      - { name: payload_completeness_pct, type: integer, source: input, description: "Completeness of payload 0-100", constraints: "integer in [0,100]" }
      - { name: on_time, type: boolean, source: computed, description: "true iff recorded_at - reported_at <= connection.cadence_minutes" }

  - name: OpsRun
    parent: null
    common_fields: false
    fields:
      - { name: run_index, type: integer, source: system, description: "Monotonic checkpoint counter starting at 1" }
      - { name: executed_at, type: datetime, source: system, description: "Logical-clock timestamp of the checkpoint" }
      - { name: connections_degraded, type: integer, source: system, description: "Connections auto-suspended for staleness in this run" }
      - { name: testing_connections_reset, type: integer, source: system, description: "TESTING connections reset to DRAFT for expired windows in this run" }
      - { name: etas_recomputed, type: integer, source: system, description: "Shipments whose ETA was recomputed in this run" }
      - { name: alerts_created, type: integer, source: system, description: "ExceptionAlerts created in this run" }
      - { name: alerts_escalated, type: integer, source: system, description: "OPEN HIGH-severity alerts escalated in this run" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: CarrierConnection
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: CREDENTIALS_SUBMITTED
        trigger: "POST /connections/{id}/submit-credentials"
        actor: CarrierRep
        preconditions:
          - "status == DRAFT (ERR_CONNECTION_INVALID_STATE)"
          - "acting CarrierRep's X-User-ID == connection.carrier_id (ERR_INSUFFICIENT_PERMISSIONS)"
        side_effects:
          - "credential_ref recorded"
      - from: CREDENTIALS_SUBMITTED
        to: TESTING
        trigger: "POST /connections/{id}/begin-testing"
        actor: NetworkOps
        preconditions:
          - "status == CREDENTIALS_SUBMITTED (ERR_CONNECTION_INVALID_STATE)"
          - "testing_window_end > testing_window_start (ERR_INVALID_REQUEST)"
          - "no other connection of the same Carrier in TESTING whose [testing_window_start, testing_window_end] CLOSED interval intersects the requested closed interval (touching endpoints conflict) (ERR_TESTING_WINDOW_CONFLICT)"
        side_effects:
          - "testing_window_start / testing_window_end recorded"
      - from: TESTING
        to: ACTIVE
        trigger: "POST /connections/{id}/activate"
        actor: NetworkOps
        preconditions:
          - "status == TESTING (ERR_CONNECTION_INVALID_STATE)"
          - "data_quality_score >= 70 (ERR_QUALITY_GATE_NOT_MET); null score fails the gate"
        side_effects:
          - "health_status recomputed"
      - from: TESTING
        to: DRAFT
        trigger: "system (at POST /_ops/run-checkpoint when testing_window_end < now and connection still TESTING)"
        actor: system
        preconditions: []
        side_effects:
          - "testing_window_start / testing_window_end cleared to null; credential_ref cleared to null"
          - "OpsRun.testing_connections_reset incremented"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /connections/{id}/suspend OR system (at checkpoint when now - last_heartbeat_at > 2 * cadence_minutes)"
        actor: "NetworkOps | system"
        preconditions:
          - "status == ACTIVE (ERR_CONNECTION_INVALID_STATE)"
        side_effects:
          - "suspended_at set to now"
          - "Cascade link 1: every Shipment with connection_id == this connection and tracking_status IN {IN_TRANSIT, EXCEPTION} gets data_freshness = STALE"
          - "Cascade link 2: each such Shipment's ETA is recomputed (eta_confidence_halfwidth_minutes gains the x1.5 stale multiplier)"
          - "Cascade link 3: delay_risk_assessment runs per affected Shipment; an ExceptionAlert (DELAY_RISK) is created when projected delay exceeds mode tolerance"
          - "when triggered by checkpoint: OpsRun.connections_degraded incremented"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /connections/{id}/resume"
        actor: NetworkOps
        preconditions:
          - "status == SUSPENDED (ERR_CONNECTION_INVALID_STATE)"
          - "remediation proven: last_heartbeat_at > suspended_at (ERR_REMEDIATION_NOT_PROVEN)"
        side_effects:
          - "suspended_at cleared to null"
          - "every Shipment with connection_id == this connection and data_freshness == STALE gets data_freshness = FRESH and ETA recomputed without stale multiplier"
      - from: DRAFT
        to: RETIRED
        trigger: "POST /connections/{id}/retire"
        actor: NetworkOps
        preconditions:
          - "status IN {DRAFT, SUSPENDED} (ERR_CONNECTION_INVALID_STATE)"
        side_effects: []
      - from: SUSPENDED
        to: RETIRED
        trigger: "POST /connections/{id}/retire"
        actor: NetworkOps
        preconditions:
          - "status IN {DRAFT, SUSPENDED} (ERR_CONNECTION_INVALID_STATE)"
        side_effects: []

  - entity: Shipment
    initial_state: BOOKED
    terminal_states: [DELIVERED, CANCELLED]
    note: "Two parallel state dimensions on one entity: tracking_status (event-replay derived, cyclic via EXCEPTION) and identity_state (driven by ShipmentIdentityLink transitions). They evolve independently."
    dimensions:
      - name: tracking_status
        transitions:
          - from: BOOKED
            to: IN_TRANSIT
            trigger: "system (replay: DEPARTED is the latest effective event)"
            actor: system
            preconditions: []
            side_effects: ["eta re-evaluated per eta_prediction"]
          - from: IN_TRANSIT
            to: EXCEPTION
            trigger: "system (replay: DELAY_REPORTED is the latest effective event)"
            actor: system
            preconditions: []
            side_effects: ["open_delay_minutes increased by event.delay_minutes", "eta re-evaluated"]
          - from: EXCEPTION
            to: IN_TRANSIT
            trigger: "system (replay: RECOVERED is the latest effective event)"
            actor: system
            preconditions: []
            side_effects: ["open_delay_minutes decreased by event.delay_minutes (floor 0)", "eta re-evaluated"]
          - from: IN_TRANSIT
            to: OUT_FOR_DELIVERY
            trigger: "system (replay: OUT_FOR_DELIVERY latest effective event)"
            actor: system
            preconditions: []
            side_effects: ["eta re-evaluated"]
          - from: EXCEPTION
            to: OUT_FOR_DELIVERY
            trigger: "system (replay: OUT_FOR_DELIVERY latest effective event)"
            actor: system
            preconditions: []
            side_effects: ["eta re-evaluated"]
          - from: OUT_FOR_DELIVERY
            to: DELIVERED
            trigger: "system (replay: DELIVERED latest effective event)"
            actor: system
            preconditions: []
            side_effects: ["eta_at frozen at actual delivery event_time; eta re-evaluated"]
          - from: BOOKED
            to: DELIVERED
            trigger: "system (replay: DELIVERED with no intervening events, e.g. small parcel)"
            actor: system
            preconditions: []
            side_effects: ["eta_at frozen at actual delivery event_time"]
          - from: IN_TRANSIT
            to: DELIVERED
            trigger: "system (replay: DELIVERED latest effective event)"
            actor: system
            preconditions: []
            side_effects: ["eta_at frozen at actual delivery event_time"]
          - from: BOOKED
            to: CANCELLED
            trigger: "POST /shipments/{id}/cancel"
            actor: ShipperRep
            preconditions:
              - "acting ShipperRep's X-User-ID == shipment.shipper_id (ERR_INSUFFICIENT_PERMISSIONS)"
              - "tracking_status IN {BOOKED, IN_TRANSIT, EXCEPTION} (ERR_SHIPMENT_NOT_CANCELLABLE)"
            side_effects:
              - "OPEN or ESCALATED ExceptionAlerts on this shipment auto-transition to RESOLVED with resolution FALSE_ALARM"
          - from: IN_TRANSIT
            to: CANCELLED
            trigger: "POST /shipments/{id}/cancel"
            actor: ShipperRep
            preconditions:
              - "acting ShipperRep's X-User-ID == shipment.shipper_id (ERR_INSUFFICIENT_PERMISSIONS)"
              - "tracking_status IN {BOOKED, IN_TRANSIT, EXCEPTION} (ERR_SHIPMENT_NOT_CANCELLABLE)"
            side_effects:
              - "OPEN or ESCALATED ExceptionAlerts on this shipment auto-transition to RESOLVED with resolution FALSE_ALARM"
          - from: EXCEPTION
            to: CANCELLED
            trigger: "POST /shipments/{id}/cancel"
            actor: ShipperRep
            preconditions:
              - "acting ShipperRep's X-User-ID == shipment.shipper_id (ERR_INSUFFICIENT_PERMISSIONS)"
              - "tracking_status IN {BOOKED, IN_TRANSIT, EXCEPTION} (ERR_SHIPMENT_NOT_CANCELLABLE)"
            side_effects:
              - "OPEN or ESCALATED ExceptionAlerts on this shipment auto-transition to RESOLVED with resolution FALSE_ALARM"
      - name: identity_state
        transitions:
          - from: UNRESOLVED
            to: MATCHED_PROVISIONAL
            trigger: "system (a ShipmentIdentityLink on this shipment enters PROPOSED)"
            actor: system
            preconditions: []
            side_effects: []
          - from: MATCHED_PROVISIONAL
            to: UNRESOLVED
            trigger: "system (the last non-REJECTED link on this shipment becomes REJECTED with none CONFIRMED)"
            actor: system
            preconditions: []
            side_effects: []
          - from: MATCHED_PROVISIONAL
            to: MATCHED_CONFIRMED
            trigger: "system (a link on this shipment enters CONFIRMED)"
            actor: system
            preconditions: []
            side_effects: []
          - from: MATCHED_CONFIRMED
            to: MATCHED_PROVISIONAL
            trigger: "system (the last CONFIRMED link is rejected while other non-REJECTED links remain, or none remain)"
            actor: system
            preconditions: []
            side_effects: ["if no non-REJECTED links remain, identity_state becomes UNRESOLVED instead"]

  - entity: ShipmentIdentityLink
    initial_state: PROPOSED
    terminal_states: [REJECTED]
    transitions:
      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /identity-links/{id}/confirm"
        actor: ShipperRep
        preconditions:
          - "status == PROPOSED (ERR_LINK_NOT_PROPOSED)"
          - "acting ShipperRep's X-User-ID == purchase_order.shipper_id (ERR_INSUFFICIENT_PERMISSIONS)"
          - "shipment.tracking_status NOT IN {DELIVERED, CANCELLED} (ERR_SHIPMENT_TERMINAL)"
          - "match_score > 0.90 strictly (ERR_MATCH_SCORE_BELOW_THRESHOLD)"
        side_effects:
          - "PurchaseOrder.confirmed_link_count += 1 and PurchaseOrder.version += 1"
          - "Shipment.identity_state -> MATCHED_CONFIRMED and Shipment.version += 1"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /identity-links/{id}/reject"
        actor: ShipperRep
        preconditions:
          - "status IN {PROPOSED, CONFIRMED} (ERR_LINK_NOT_PROPOSED)"
          - "acting ShipperRep's X-User-ID == purchase_order.shipper_id (ERR_INSUFFICIENT_PERMISSIONS)"
        side_effects:
          - "Shipment.identity_state re-derived"
      - from: CONFIRMED
        to: REJECTED
        trigger: "POST /identity-links/{id}/reject"
        actor: ShipperRep
        preconditions:
          - "status IN {PROPOSED, CONFIRMED} (ERR_LINK_NOT_PROPOSED)"
          - "acting ShipperRep's X-User-ID == purchase_order.shipper_id (ERR_INSUFFICIENT_PERMISSIONS)"
        side_effects:
          - "PurchaseOrder.confirmed_link_count -= 1 and PurchaseOrder.version += 1 (compensation restores the count)"
          - "Shipment.identity_state re-derived"

  - entity: ExceptionAlert
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /alerts/{id}/acknowledge"
        actor: CustomerService
        preconditions:
          - "status IN {OPEN, ESCALATED} (ERR_ALERT_INVALID_STATE)"
        side_effects: []
      - from: ESCALATED
        to: ACKNOWLEDGED
        trigger: "POST /alerts/{id}/acknowledge"
        actor: CustomerService
        preconditions:
          - "status IN {OPEN, ESCALATED} (ERR_ALERT_INVALID_STATE)"
        side_effects: []
      - from: OPEN
        to: ESCALATED
        trigger: "system (at POST /_ops/run-checkpoint when severity == HIGH, status == OPEN, and now - opened_at > 240 minutes)"
        actor: system
        preconditions: []
        side_effects:
          - "OpsRun.alerts_escalated incremented"
      - from: ACKNOWLEDGED
        to: RESOLVED
        trigger: "POST /alerts/{id}/resolve"
        actor: CustomerService
        preconditions:
          - "status == ACKNOWLEDGED (ERR_ALERT_INVALID_STATE)"
          - "resolution is a valid enum member (ERR_INVALID_REQUEST)"
        side_effects:
          - "resolved_at set to now"
          - "when resolution == DELAY_CONFIRMED (cascade): Shipment.actual_delay_minutes = max(0, eta_at - planned_arrival_at); then every SCHEDULED Appointment with shipment_id == this shipment and window_end < Shipment.eta_at transitions to MISSED; then the appointment's Facility.appointment_adherence_pct is recomputed counting the miss"
      - from: OPEN
        to: RESOLVED
        trigger: "system (parent Shipment cancelled; resolution FALSE_ALARM)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ESCALATED
        to: RESOLVED
        trigger: "system (parent Shipment cancelled; resolution FALSE_ALARM)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Appointment
    initial_state: SCHEDULED
    terminal_states: [MISSED, VOIDED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /appointments/{id}/complete"
        actor: CarrierRep
        preconditions:
          - "status == SCHEDULED (ERR_APPOINTMENT_INVALID_STATE)"
          - "acting CarrierRep's X-User-ID == appointment.shipment.carrier_id (ERR_INSUFFICIENT_PERMISSIONS)"
          - "actual_departure_at > actual_arrival_at (ERR_INVALID_REQUEST)"
        side_effects:
          - "dwell_minutes, adherent, exposure_minutes computed"
          - "Facility.total_dwell_minutes += dwell_minutes; Facility.detention_exposure_minutes += exposure_minutes; Facility.appointment_adherence_pct recomputed; Facility.version += 1"
      - from: SCHEDULED
        to: MISSED
        trigger: "system (cascade: a DELAY_RISK alert on the appointment's shipment is resolved DELAY_CONFIRMED and window_end < Shipment.eta_at)"
        actor: system
        preconditions: []
        side_effects:
          - "Facility.appointment_adherence_pct recomputed counting the miss"
      - from: COMPLETED
        to: VOIDED
        trigger: "POST /appointments/{id}/void-completion"
        actor: NetworkOps
        preconditions:
          - "status == COMPLETED (ERR_APPOINTMENT_INVALID_STATE)"
        side_effects:
          - "Facility.total_dwell_minutes -= dwell_minutes; Facility.detention_exposure_minutes -= exposure_minutes; Facility.appointment_adherence_pct recomputed excluding the voided completion; Facility.version += 1 (compensation restores facility aggregates)"

  - entity: DataShareGrant
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /data-share-grants/{id}/revoke"
        actor: ShipperRep
        preconditions:
          - "status == ACTIVE (ERR_GRANT_ALREADY_REVOKED)"
          - "acting ShipperRep's X-User-ID == grant.shipper_id (ERR_INSUFFICIENT_PERMISSIONS)"
        side_effects:
          - "grantee loses access immediately (subsequent reads fail visibility check)"

  - entity: Facility
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /facilities/{id} with status=SUSPENDED"
        actor: PlatformAdmin
        preconditions:
          - "status == ACTIVE (ERR_INVALID_REQUEST when target equals current)"
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /facilities/{id} with status=ACTIVE"
        actor: PlatformAdmin
        preconditions:
          - "status == SUSPENDED (ERR_INVALID_REQUEST when target equals current)"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: identity-link-create-stale-po
    parent_entity: PurchaseOrder
    write_endpoint: "POST /shipments/{id}/identity-links"
    occ_field: "expected_po_version"
    description: |
      Creating a ShipmentIdentityLink against a PurchaseOrder whose version has
      advanced since the client last observed it is rejected. A purchase order
      legitimately accumulates multiple links (multi-shipment orders), so no
      state precondition rejects a second create; the stale-version OCC check
      is the only guard against acting on an outdated view of the PO.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: appointment-book-stale-facility
    parent_entity: Facility
    write_endpoint: "POST /facilities/{id}/appointments"
    occ_field: "expected_facility_version"
    description: |
      Booking an Appointment against a Facility whose version has advanced
      since the client last observed it is rejected. A facility legitimately
      accumulates many disjoint appointments, so no state precondition
      rejects a second booking; the stale-version OCC check is the only guard
      against acting on an outdated view of the facility.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: eta_prediction
    trigger: "shipment creation, tracking-event ingest or void, recompute-eta endpoint, ops-run checkpoint"
    algorithm: projection
    formula: |
      R = planned_arrival_at - planned_departure_at (minutes; strictly positive).
      Let E = max event_time over non-voided TrackingEvents of the shipment (null when none).
      Variant selection (pinned):
        TELEMETRY_BLENDED iff E is not null, else SCHEDULED_BASELINE.
      SCHEDULED_BASELINE: eta_at = planned_arrival_at.
      TELEMETRY_BLENDED:
        p = clamp((E - planned_departure_at) / R, 0, 1)
        open_delay = max(0, sum(delay_minutes over non-voided DELAY_REPORTED)
                          - sum(delay_minutes over non-voided RECOVERED))
        eta_at = E + R * (1 - p) + open_delay  (all in minutes)
      Replay order for status derivation and for E: event_time ASC, tie-break
      TrackingEvent.created_at ASC (never id).
    input_set: "non-voided TrackingEvents of the shipment"
    constants:
      MIN_REMAINING_FRACTION: 0
    precision: "whole minutes, round_half_up"
    variants:
      - name: scheduled_baseline
        when: "no non-voided tracking events exist"
        difference: "ignores telemetry entirely; eta_at equals planned_arrival_at"
      - name: telemetry_blended
        when: "at least one non-voided tracking event exists"
        difference: "reprojects from latest event position plus open delay reports"

  - name: eta_confidence_halfwidth
    trigger: "whenever eta_prediction runs"
    algorithm: threshold
    formula: |
      BASE(mode): OCEAN 720, RAIL 360, PARCEL 60, TRUCKLOAD 120.
      Q = connection.data_quality_score as of the LAST completed ops-run
      checkpoint (evaluation order pinned: current-run quality never feeds the
      same run's CI); Q defaults to 50 when the connection has never been scored.
      halfwidth = BASE(mode) * (1 + (100 - Q)/100)
      if shipment.data_freshness == STALE: halfwidth = halfwidth * 1.5
      final = round_half_up(halfwidth) (integer minutes)
    input_set: "the shipment's feed CarrierConnection"
    constants:
      BASE_CI_HALFWIDTH_MINUTES: { OCEAN: 720, RAIL: 360, PARCEL: 60, TRUCKLOAD: 120 }
      UNSET_QUALITY_NEUTRAL: 50
      STALE_CI_MULTIPLIER: 1.5
    precision: "integer minutes, round_half_up at the final step only"

  - name: data_quality_score_epoch
    trigger: "POST /_ops/run-checkpoint (per non-RETIRED connection); authoritative score"
    algorithm: weighted_scoring
    formula: |
      Window W = (max(connection.created_at, prev_run_at), now] over
      HeartbeatRecord.recorded_at (inclusive of now, exclusive of window start).
      total = count of heartbeat records in W.
      timeliness_raw = 100 * (on_time count in W) / total   (0 when total == 0)
      completeness_raw = avg(payload_completeness_pct in W) (0 when total == 0)
      expected_count = floor(W_minutes / cadence_minutes)
      cadence_raw = 100 * min(1, total / expected_count)    (0 when expected_count == 0)
      Rounding order is PINNED (mode: nested rounding):
        t = round_half_up(timeliness_raw); c = round_half_up(completeness_raw);
        d = round_half_up(cadence_raw)
        score = round_half_up(0.40*t + 0.35*c + 0.25*d)
      Also: health_status = HEALTHY if score >= 70, DEGRADED if >= 40, else CRITICAL;
      missed_heartbeat_streak += 1 when total == 0 else reset to 0.
    input_set: "HeartbeatRecords of the connection within window W"
    constants:
      W_TIMELINESS: 0.40
      W_COMPLETENESS: 0.35
      W_CADENCE: 0.25
    precision: "integer score, round_half_up per dimension then at final"
    variants:
      - name: epoch_windowed
        when: "at ops-run checkpoint"
        difference: "aggregates the whole window; the authoritative data_quality_score"

  - name: data_quality_score_instantaneous
    trigger: "after every heartbeat ingest; updates instantaneous_quality_score only"
    algorithm: weighted_scoring
    formula: |
      Using only the LATEST HeartbeatRecord (by recorded_at, tie-break created_at ASC):
      instantaneous = round_half_up(0.60 * (on_time ? 100 : 0) + 0.40 * payload_completeness_pct)
    input_set: "latest HeartbeatRecord of the connection"
    constants:
      W_INSTANT_TIMELINESS: 0.60
      W_INSTANT_COMPLETENESS: 0.40
    precision: "integer score, round_half_up"
    variants:
      - name: instantaneous
        when: "on each heartbeat"
        difference: "latest-heartbeat-only view; deliberately diverges from the epoch-windowed authoritative score for identical raw data"

  - name: identity_match_score
    trigger: "POST /shipments/{id}/identity-links (computed at proposal, stored on the link)"
    algorithm: weighted_scoring
    formula: |
      score = 0.5 * (shipment.po_reference_claim == po.po_number AND po_reference_claim != "")
            + 0.4 * (shipment.tracking_reference == po.booking_reference)
            + 0.1 * (shipment.destination_code == po.destination_code)
      Confirm gate: score > 0.90 strictly.
    input_set: "the linked Shipment and PurchaseOrder"
    constants:
      W_PO_NUMBER: 0.5
      W_BOOKING_REFERENCE: 0.4
      W_DESTINATION: 0.1
      CONFIRM_THRESHOLD: 0.90
    precision: "two decimal places; comparisons against exact decimal constants"

  - name: detention_exposure
    trigger: "POST /appointments/{id}/complete"
    algorithm: tiered_pricing
    formula: |
      dwell_minutes = actual_departure_at - actual_arrival_at (whole minutes)
      adherent = (window_start <= actual_arrival_at < window_end)
      free = FREE_TIME_MINUTES[shipment.mode]
      if adherent: free = free + GRACE_MINUTES
      exposure_minutes = max(0, dwell_minutes - free)
      Facility.total_dwell_minutes += dwell_minutes
      Facility.detention_exposure_minutes += exposure_minutes
    input_set: "the completed appointment plus its shipment's mode"
    constants:
      FREE_TIME_MINUTES: { OCEAN: 240, RAIL: 360, PARCEL: 0, TRUCKLOAD: 120 }
      GRACE_MINUTES: 15
    precision: "integer minutes"

  - name: facility_adherence
    trigger: "appointment complete, appointment missed (cascade), appointment completion voided"
    algorithm: aggregation
    formula: |
      completed_count = appointments at facility with status == COMPLETED
      missed_count = appointments at facility with status == MISSED
      adherent_count = COMPLETED appointments with adherent == true
      denominator = completed_count + missed_count
      appointment_adherence_pct = null when denominator == 0 else
        round_half_up(100 * adherent_count / denominator)
    input_set: "appointments of the facility in status COMPLETED or MISSED (VOIDED and SCHEDULED excluded)"
    constants: {}
    precision: "integer percent, round_half_up"

  - name: delay_risk_assessment
    trigger: "after every eta_prediction recompute (event ingest, recompute-eta, checkpoint, connection resume/suspend)"
    algorithm: threshold
    formula: |
      delay_minutes = (eta_at - planned_arrival_at) in minutes
      T = TOLERANCE_MINUTES[shipment.mode]
      Create an ExceptionAlert (alert_type DELAY_RISK, status OPEN, opened_at = now)
      iff delay_minutes > T AND shipment.tracking_status IN {BOOKED, IN_TRANSIT, EXCEPTION, OUT_FOR_DELIVERY}
      AND no OPEN/ESCALATED/ACKNOWLEDGED DELAY_RISK alert already exists for the shipment.
      severity = HIGH iff delay_minutes > 2*T else MEDIUM
      assigned_queue = CS_TIER2 when HIGH else CS_TIER1
    input_set: "the recomputed shipment"
    constants:
      TOLERANCE_MINUTES: { OCEAN: 720, RAIL: 360, PARCEL: 30, TRUCKLOAD: 60 }
      ESCALATION_SLA_MINUTES: 240
    precision: "integer minutes; boundary is strict >"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.7, including ownership rules (CarrierRep acts only on own carrier's resources; ShipperRep only on own shipper's resources)"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: auth
    check: "Data-share visibility: CarrierRep/ConsigneeRep reads of another shipper's shipment data require an ACTIVE DataShareGrant (grantee matches X-User-ID, now in [effective_from, expires_at]); ETA_ONLY scope bars event-list reads"
    error_id: ERR_DATA_SHARE_FORBIDDEN
    http_status: 403
    applies_to: "GET /shipments/{id}, GET /shipments/{id}/events, GET /shipments/{id}/alerts"

  - priority: 4
    category: existence
    check: "Path resource ids exist, validated left-to-right"
    error_id: "ERR_CARRIER_NOT_FOUND | ERR_SHIPPER_NOT_FOUND | ERR_CONSIGNEE_NOT_FOUND | ERR_CONNECTION_NOT_FOUND | ERR_PURCHASE_ORDER_NOT_FOUND | ERR_FACILITY_NOT_FOUND | ERR_SHIPMENT_NOT_FOUND | ERR_EVENT_NOT_FOUND | ERR_IDENTITY_LINK_NOT_FOUND | ERR_ALERT_NOT_FOUND | ERR_APPOINTMENT_NOT_FOUND | ERR_DATA_SHARE_GRANT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 5
    category: business_constraint
    check: "Request shape: required fields present; enums valid; window_end > window_start / testing_window_end > testing_window_start / expires_at > effective_from / planned_arrival_at > planned_departure_at / actual_departure_at > actual_arrival_at; payload_completeness_pct in [0,100]; supported_modes non-empty subset of modes; MANUAL channel must not include PARCEL (ERR_INVALID_MODE_CONFIG); shipment.mode in connection.supported_modes (ERR_INVALID_MODE_CONFIG)"
    error_id: "ERR_INVALID_REQUEST | ERR_INVALID_MODE_CONFIG"
    http_status: 400
    applies_to: "all POST/PATCH endpoints"

  - priority: 6
    category: state
    check: "Target resource state preconditions per §1.2 (connection lifecycle states; facility ACTIVE for booking; shipment trackable/cancellable; link PROPOSED; alert ACKNOWLEDGED for resolve; appointment SCHEDULED/COMPLETED; grant ACTIVE; remediation proven on resume; shipment non-terminal for link confirm)"
    error_id: "ERR_CONNECTION_INVALID_STATE | ERR_CONNECTION_NOT_ACTIVE | ERR_REMEDIATION_NOT_PROVEN | ERR_FACILITY_NOT_ACTIVE | ERR_SHIPMENT_NOT_TRACKABLE | ERR_SHIPMENT_NOT_CANCELLABLE | ERR_SHIPMENT_TERMINAL | ERR_LINK_NOT_PROPOSED | ERR_ALERT_INVALID_STATE | ERR_APPOINTMENT_INVALID_STATE | ERR_GRANT_ALREADY_REVOKED"
    http_status: 409
    applies_to: "all state-transition and state-gated endpoints"

  - priority: 7
    category: business_temporal
    check: "Interval occupation conflicts: appointment window (half-open [start,end)) overlaps an existing SCHEDULED appointment at the same facility -> ERR_APPOINTMENT_WINDOW_CONFLICT; begin-testing window (closed [start,end], touching endpoints conflict) intersects another TESTING connection of the same carrier -> ERR_TESTING_WINDOW_CONFLICT"
    error_id: "ERR_APPOINTMENT_WINDOW_CONFLICT | ERR_TESTING_WINDOW_CONFLICT"
    http_status: 409
    applies_to: "POST /facilities/{id}/appointments, POST /connections/{id}/begin-testing"

  - priority: 8
    category: business_constraint
    check: "Threshold gates: connection activate requires data_quality_score >= 70 (ERR_QUALITY_GATE_NOT_MET); identity-link confirm requires match_score > 0.90 strictly (ERR_MATCH_SCORE_BELOW_THRESHOLD)"
    error_id: "ERR_QUALITY_GATE_NOT_MET | ERR_MATCH_SCORE_BELOW_THRESHOLD"
    http_status: 422
    applies_to: "POST /connections/{id}/activate, POST /identity-links/{id}/confirm"

  - priority: 9
    category: business_referential
    check: "OCC: expected_po_version == PurchaseOrder.version on identity-link create; expected_facility_version == Facility.version on appointment create; grantee_id resolves to an existing Carrier (grantee_type CARRIER) or Consignee of the granting shipper (grantee_type CONSIGNEE)"
    error_id: "ERR_STALE_VERSION | ERR_CARRIER_NOT_FOUND | ERR_CONSIGNEE_NOT_FOUND"
    http_status: 412
    applies_to: "POST /shipments/{id}/identity-links, POST /facilities/{id}/appointments, POST /shippers/{id}/data-share-grants"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Carrier ---
  - method: POST
    path: "/carriers"
    description: "Create a carrier organization"
    roles: [NetworkOps]
    code: 201
    input: [carrier_name, scac_code]
    output: Carrier
    side_effects: ["version starts at 1"]

  - method: GET
    path: "/carriers/{id}"
    description: "Get a carrier"
    roles: [PlatformAdmin, NetworkOps, CarrierRep, ShipperRep, CustomerService, ConsigneeRep]
    code: 200
    input: []
    output: Carrier
    side_effects: []

  - method: GET
    path: "/carriers/{id}/connections"
    description: "List connections of a carrier (reverse FK)"
    roles: [PlatformAdmin, NetworkOps, CarrierRep, ShipperRep, CustomerService, ConsigneeRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "CarrierConnection[]"
    side_effects: []

  - method: GET
    path: "/carriers/{id}/shipments"
    description: "List shipments carried by a carrier (reverse FK)"
    roles: [PlatformAdmin, NetworkOps, CarrierRep, ShipperRep, CustomerService, ConsigneeRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "Shipment[]"
    side_effects: []

  # --- Shipper ---
  - method: POST
    path: "/shippers"
    description: "Create a shipper organization"
    roles: [PlatformAdmin]
    code: 201
    input: [company_name]
    output: Shipper
    side_effects: []

  - method: GET
    path: "/shippers/{id}"
    description: "Get a shipper"
    roles: [PlatformAdmin, NetworkOps, CarrierRep, ShipperRep, CustomerService, ConsigneeRep]
    code: 200
    input: []
    output: Shipper
    side_effects: []

  - method: GET
    path: "/shippers/{id}/consignees"
    description: "List consignees of a shipper (reverse FK)"
    roles: [PlatformAdmin, NetworkOps, CarrierRep, ShipperRep, CustomerService, ConsigneeRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "Consignee[]"
    side_effects: []

  - method: GET
    path: "/shippers/{id}/purchase-orders"
    description: "List purchase orders of a shipper (reverse FK)"
    roles: [PlatformAdmin, NetworkOps, CarrierRep, ShipperRep, CustomerService, ConsigneeRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "PurchaseOrder[]"
    side_effects: []

  - method: GET
    path: "/shippers/{id}/shipments"
    description: "List shipments of a shipper (reverse FK)"
    roles: [PlatformAdmin, NetworkOps, CarrierRep, ShipperRep, CustomerService, ConsigneeRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "Shipment[]"
    side_effects: []

  - method: GET
    path: "/shippers/{id}/data-share-grants"
    description: "List data-share grants of a shipper (reverse FK)"
    roles: [PlatformAdmin, NetworkOps, CarrierRep, ShipperRep, CustomerService, ConsigneeRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "DataShareGrant[]"
    side_effects: []

  # --- Consignee ---
  - method: POST
    path: "/shippers/{id}/consignees"
    description: "Register a consignee under a shipper"
    roles: [ShipperRep]
    code: 201
    input: [company_name, destination_code]
    output: Consignee
    side_effects: ["acting ShipperRep's X-User-ID must equal {id}"]

  # --- CarrierConnection ---
  - method: POST
    path: "/carriers/{id}/connections"
    description: "Create a carrier connection in DRAFT"
    roles: [NetworkOps]
    code: 201
    input: [channel, supported_modes]
    output: CarrierConnection
    side_effects: ["cadence_minutes derived from channel", "status = DRAFT"]

  - method: GET
    path: "/connections/{id}"
    description: "Get a carrier connection"
    roles: [PlatformAdmin, NetworkOps, CarrierRep, ShipperRep, CustomerService, ConsigneeRep]
    code: 200
    input: []
    output: CarrierConnection
    side_effects: []

  - method: POST
    path: "/connections/{id}/submit-credentials"
    description: "Carrier submits connection credentials (DRAFT -> CREDENTIALS_SUBMITTED)"
    roles: [CarrierRep]
    code: 200
    input: [credential_ref]
    output: CarrierConnection
    side_effects: ["status transition; credential_ref recorded"]

  - method: POST
    path: "/connections/{id}/begin-testing"
    description: "Open the certification testing window (CREDENTIALS_SUBMITTED -> TESTING)"
    roles: [NetworkOps]
    code: 200
    input: [testing_window_start, testing_window_end]
    output: CarrierConnection
    side_effects: ["status transition; closed-interval testing-window conflict check on the carrier"]

  - method: POST
    path: "/connections/{id}/activate"
    description: "Activate a TESTING connection gated on epoch quality score >= 70"
    roles: [NetworkOps]
    code: 200
    input: []
    output: CarrierConnection
    side_effects: ["status transition; ERR_QUALITY_GATE_NOT_MET when score < 70 or null"]

  - method: POST
    path: "/connections/{id}/suspend"
    description: "Manually suspend an ACTIVE connection"
    roles: [NetworkOps]
    code: 200
    input: [reason]
    output: CarrierConnection
    side_effects: ["status transition; suspended_at set; shipment freshness/ETA/alert cascade per §1.2"]

  - method: POST
    path: "/connections/{id}/resume"
    description: "Resume a SUSPENDED connection after remediation (heartbeat newer than suspended_at)"
    roles: [NetworkOps]
    code: 200
    input: []
    output: CarrierConnection
    side_effects: ["status transition; suspended_at cleared; STALE shipments return to FRESH with ETA recompute"]

  - method: POST
    path: "/connections/{id}/retire"
    description: "Retire a DRAFT or SUSPENDED connection"
    roles: [NetworkOps]
    code: 200
    input: []
    output: CarrierConnection
    side_effects: ["status transition to RETIRED"]

  - method: POST
    path: "/connections/{id}/heartbeats"
    description: "Carrier posts a connection heartbeat (allowed in TESTING, ACTIVE, SUSPENDED)"
    roles: [CarrierRep]
    code: 201
    input: [reported_at, payload_completeness_pct]
    output: HeartbeatRecord
    side_effects:
      - "recorded_at = logical clock now; on_time computed vs cadence_minutes"
      - "last_heartbeat_at updated; instantaneous_quality_score recomputed"
      - "ERR_CONNECTION_INVALID_STATE when status not in {TESTING, ACTIVE, SUSPENDED}"

  - method: GET
    path: "/connections/{id}/heartbeats"
    description: "List heartbeat records of a connection (reverse FK)"
    roles: [PlatformAdmin, NetworkOps, CarrierRep, ShipperRep, CustomerService, ConsigneeRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "HeartbeatRecord[]"
    side_effects: []

  # --- PurchaseOrder ---
  - method: POST
    path: "/shippers/{id}/purchase-orders"
    description: "Create a purchase order"
    roles: [ShipperRep]
    code: 201
    input: [po_number, destination_code, booking_reference]
    output: PurchaseOrder
    side_effects: ["confirmed_link_count = 0"]

  - method: GET
    path: "/purchase-orders/{id}"
    description: "Get a purchase order"
    roles: [PlatformAdmin, NetworkOps, CarrierRep, ShipperRep, CustomerService, ConsigneeRep]
    code: 200
    input: []
    output: PurchaseOrder
    side_effects: []

  - method: GET
    path: "/purchase-orders/{id}/identity-links"
    description: "List identity links pointing at a purchase order (reverse FK)"
    roles: [PlatformAdmin, NetworkOps, CarrierRep, ShipperRep, CustomerService, ConsigneeRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "ShipmentIdentityLink[]"
    side_effects: []

  # --- Facility ---
  - method: POST
    path: "/facilities"
    description: "Create a facility (ACTIVE)"
    roles: [PlatformAdmin]
    code: 201
    input: [facility_name, facility_type]
    output: Facility
    side_effects: ["total_dwell_minutes = 0; detention_exposure_minutes = 0; appointment_adherence_pct = null"]

  - method: GET
    path: "/facilities/{id}"
    description: "Get a facility"
    roles: [PlatformAdmin, NetworkOps, CarrierRep, ShipperRep, CustomerService, ConsigneeRep]
    code: 200
    input: []
    output: Facility
    side_effects: []

  - method: PATCH
    path: "/facilities/{id}"
    description: "Toggle facility status (ACTIVE <-> SUSPENDED)"
    roles: [PlatformAdmin]
    code: 200
    input: [status]
    output: Facility
    side_effects: ["status transition; version += 1"]

  # --- Shipment ---
  - method: POST
    path: "/shippers/{id}/shipments"
    description: "Create a shipment (BOOKED, identity UNRESOLVED); connection must be TESTING or ACTIVE"
    roles: [ShipperRep]
    code: 201
    input: [carrier_id, connection_id, mode, tracking_reference, mode_reference, destination_code, "po_reference_claim?", planned_departure_at, planned_arrival_at]
    output: Shipment
    side_effects:
      - "eta_prediction runs (SCHEDULED_BASELINE); eta_confidence_halfwidth computed"
      - "ERR_CONNECTION_NOT_ACTIVE when connection status not in {TESTING, ACTIVE}"
      - "ERR_INVALID_MODE_CONFIG when mode not in connection.supported_modes"

  - method: GET
    path: "/shipments"
    description: "List shipments with filters (reverse FK for connection_id)"
    roles: [PlatformAdmin, NetworkOps, CarrierRep, ShipperRep, CustomerService, ConsigneeRep]
    code: 200
    input: ["limit?", "offset?", "connection_id?", "mode?", "tracking_status?"]
    output: "Shipment[]"
    side_effects: []

  - method: GET
    path: "/shipments/{id}"
    description: "Get a shipment (visibility-scoped per §1.4 priority 3)"
    roles: [PlatformAdmin, NetworkOps, CarrierRep, ShipperRep, CustomerService, ConsigneeRep]
    code: 200
    input: []
    output: Shipment
    side_effects: []

  - method: POST
    path: "/shipments/{id}/events"
    description: "Ingest a carrier tracking event; shipment tracking_status re-derived by replay"
    roles: [CarrierRep]
    code: 201
    input: [event_time, event_type, "delay_minutes?"]
    output: TrackingEvent
    side_effects:
      - "acting CarrierRep's X-User-ID must equal shipment.carrier_id"
      - "connection must be ACTIVE (ERR_CONNECTION_NOT_ACTIVE)"
      - "shipment tracking_status must not be DELIVERED or CANCELLED (ERR_SHIPMENT_NOT_TRACKABLE)"
      - "is_late computed; tracking_status re-derived by replay (event_time ASC, tie-break created_at ASC)"
      - "eta_prediction + eta_confidence_halfwidth rerun; delay_risk_assessment runs"
      - "Shipment.version += 1"

  - method: GET
    path: "/shipments/{id}/events"
    description: "List tracking events of a shipment (reverse FK); barred for ETA_ONLY grantees"
    roles: [PlatformAdmin, NetworkOps, CarrierRep, ShipperRep, CustomerService, ConsigneeRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "TrackingEvent[]"
    side_effects: []

  - method: POST
    path: "/shipments/{id}/events/{eventId}/void"
    description: "Void a tracking event (retroactive correction); replay re-derives shipment state"
    roles: [NetworkOps]
    code: 200
    input: []
    output: TrackingEvent
    side_effects:
      - "voided = true; tracking_status re-derived excluding the voided event"
      - "eta_prediction + eta_confidence_halfwidth rerun; delay_risk_assessment runs"

  - method: POST
    path: "/shipments/{id}/recompute-eta"
    description: "On-demand ETA recompute (eta_prediction + confidence + delay_risk_assessment)"
    roles: [NetworkOps]
    code: 200
    input: []
    output: Shipment
    side_effects: ["eta_prediction rerun; alert may be created per delay_risk_assessment"]

  - method: POST
    path: "/shipments/{id}/cancel"
    description: "Cancel a shipment (BOOKED/IN_TRANSIT/EXCEPTION only)"
    roles: [ShipperRep]
    code: 200
    input: []
    output: Shipment
    side_effects: ["tracking_status -> CANCELLED; open alerts auto-resolve FALSE_ALARM"]

  # --- ShipmentIdentityLink ---
  - method: POST
    path: "/shipments/{id}/identity-links"
    description: "Propose an identity link between a shipment and a purchase order (OCC on PO version)"
    roles: [NetworkOps]
    code: 201
    input: [purchase_order_id, expected_po_version]
    output: ShipmentIdentityLink
    side_effects:
      - "match_score computed per identity_match_score"
      - "status = PROPOSED; Shipment.identity_state -> MATCHED_PROVISIONAL"
      - "PurchaseOrder.version += 1 (OCC parent bump)"
      - "ERR_STALE_VERSION when expected_po_version != PurchaseOrder.version"

  - method: GET
    path: "/shipments/{id}/identity-links"
    description: "List identity links of a shipment (reverse FK)"
    roles: [PlatformAdmin, NetworkOps, CarrierRep, ShipperRep, CustomerService, ConsigneeRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "ShipmentIdentityLink[]"
    side_effects: []

  - method: POST
    path: "/identity-links/{id}/confirm"
    description: "Confirm a PROPOSED link (score > 0.90 strictly; shipment non-terminal)"
    roles: [ShipperRep]
    code: 200
    input: []
    output: ShipmentIdentityLink
    side_effects:
      - "PurchaseOrder.confirmed_link_count += 1 and version += 1"
      - "Shipment.identity_state -> MATCHED_CONFIRMED"

  - method: POST
    path: "/identity-links/{id}/reject"
    description: "Reject a PROPOSED or CONFIRMED link (compensates confirmed_link_count when CONFIRMED)"
    roles: [ShipperRep]
    code: 200
    input: []
    output: ShipmentIdentityLink
    side_effects:
      - "when CONFIRMED: PurchaseOrder.confirmed_link_count -= 1 and version += 1"
      - "Shipment.identity_state re-derived"

  # --- ExceptionAlert ---
  - method: GET
    path: "/alerts"
    description: "Customer-service alert queue with filters"
    roles: [CustomerService, NetworkOps, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "status?", "severity?"]
    output: "ExceptionAlert[]"
    side_effects: []

  - method: GET
    path: "/shipments/{id}/alerts"
    description: "List alerts of a shipment (reverse FK; visibility-scoped)"
    roles: [PlatformAdmin, NetworkOps, CarrierRep, ShipperRep, CustomerService, ConsigneeRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "ExceptionAlert[]"
    side_effects: []

  - method: POST
    path: "/alerts/{id}/acknowledge"
    description: "Acknowledge an OPEN or ESCALATED alert"
    roles: [CustomerService]
    code: 200
    input: []
    output: ExceptionAlert
    side_effects: ["status -> ACKNOWLEDGED"]

  - method: POST
    path: "/alerts/{id}/resolve"
    description: "Resolve an ACKNOWLEDGED alert; DELAY_CONFIRMED fires the appointment-miss cascade"
    roles: [CustomerService]
    code: 200
    input: [resolution]
    output: ExceptionAlert
    side_effects:
      - "status -> RESOLVED; resolved_at set"
      - "DELAY_CONFIRMED cascade per §1.2: shipment.actual_delay_minutes set; late appointments MISSED; facility adherence recomputed"

  # --- Appointment ---
  - method: POST
    path: "/facilities/{id}/appointments"
    description: "Book an appointment (half-open window; OCC on Facility version)"
    roles: [CarrierRep]
    code: 201
    input: [shipment_id, window_start, window_end, expected_facility_version]
    output: Appointment
    side_effects:
      - "Facility must be ACTIVE (ERR_FACILITY_NOT_ACTIVE)"
      - "acting CarrierRep's X-User-ID must equal shipment.carrier_id"
      - "half-open overlap check vs SCHEDULED appointments at the facility"
      - "Facility.version += 1 (OCC parent bump); ERR_STALE_VERSION on mismatch"

  - method: GET
    path: "/facilities/{id}/appointments"
    description: "List appointments at a facility (reverse FK)"
    roles: [PlatformAdmin, NetworkOps, CarrierRep, ShipperRep, CustomerService, ConsigneeRep]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Appointment[]"
    side_effects: []

  - method: GET
    path: "/appointments"
    description: "List appointments with filters (reverse FK for shipment_id)"
    roles: [PlatformAdmin, NetworkOps, CarrierRep, ShipperRep, CustomerService, ConsigneeRep]
    code: 200
    input: ["limit?", "offset?", "shipment_id?", "facility_id?"]
    output: "Appointment[]"
    side_effects: []

  - method: GET
    path: "/appointments/{id}"
    description: "Get an appointment"
    roles: [PlatformAdmin, NetworkOps, CarrierRep, ShipperRep, CustomerService, ConsigneeRep]
    code: 200
    input: []
    output: Appointment
    side_effects: []

  - method: POST
    path: "/appointments/{id}/complete"
    description: "Record arrival/departure; computes dwell, adherence, detention exposure"
    roles: [CarrierRep]
    code: 200
    input: [actual_arrival_at, actual_departure_at]
    output: Appointment
    side_effects: ["dwell/exposure computed; Facility aggregates incremented; Facility.version += 1"]

  - method: POST
    path: "/appointments/{id}/void-completion"
    description: "Void a completion (compensating action restoring facility aggregates)"
    roles: [NetworkOps]
    code: 200
    input: []
    output: Appointment
    side_effects: ["Facility aggregates decremented; appointment -> VOIDED; Facility.version += 1"]

  # --- DataShareGrant ---
  - method: POST
    path: "/shippers/{id}/data-share-grants"
    description: "Grant a carrier or consignee scoped read access to the shipper's shipment data"
    roles: [ShipperRep]
    code: 201
    input: [grantee_type, grantee_id, scope, effective_from, expires_at]
    output: DataShareGrant
    side_effects: ["status = ACTIVE; grantee existence validated by grantee_type"]

  - method: POST
    path: "/data-share-grants/{id}/revoke"
    description: "Revoke an ACTIVE grant"
    roles: [ShipperRep]
    code: 200
    input: []
    output: DataShareGrant
    side_effects: ["status -> REVOKED"]

  # --- Test-driving / ops ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced (never backwards; setting an earlier instant than current is ERR_INVALID_REQUEST)"]

  - method: POST
    path: "/_ops/run-checkpoint"
    description: "Ops-run checkpoint: score connection quality, reset expired TESTING windows, suspend stale connections (with shipment freshness + ETA + alert cascade), escalate overdue HIGH alerts"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: OpsRun
    side_effects:
      - "data_quality_score_epoch per non-RETIRED connection"
      - "TESTING connections with testing_window_end < now reset to DRAFT"
      - "ACTIVE connections with now - last_heartbeat_at > 2 * cadence_minutes auto-SUSPENDED (cascade per §1.2)"
      - "OPEN HIGH alerts older than 240 minutes ESCALATED"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role lacks permission for this endpoint, or entity-backed ownership check failed" }
  - { id: ERR_DATA_SHARE_FORBIDDEN, http: 403, condition: "Read requires an ACTIVE DataShareGrant covering the caller, or ETA_ONLY scope bars the events read" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/invalid field, bad enum, or inverted interval/timestamp pair" }
  - { id: ERR_INVALID_MODE_CONFIG, http: 400, condition: "MANUAL channel includes PARCEL, supported_modes empty/invalid, or shipment.mode not in connection.supported_modes" }
  - { id: ERR_CARRIER_NOT_FOUND, http: 404, condition: "Carrier id does not exist (also unresolvable grantee_id when grantee_type CARRIER)" }
  - { id: ERR_SHIPPER_NOT_FOUND, http: 404, condition: "Shipper id does not exist" }
  - { id: ERR_CONSIGNEE_NOT_FOUND, http: 404, condition: "Consignee id does not exist (also unresolvable grantee_id when grantee_type CONSIGNEE)" }
  - { id: ERR_CONNECTION_NOT_FOUND, http: 404, condition: "CarrierConnection id does not exist" }
  - { id: ERR_PURCHASE_ORDER_NOT_FOUND, http: 404, condition: "PurchaseOrder id does not exist" }
  - { id: ERR_FACILITY_NOT_FOUND, http: 404, condition: "Facility id does not exist" }
  - { id: ERR_SHIPMENT_NOT_FOUND, http: 404, condition: "Shipment id does not exist" }
  - { id: ERR_EVENT_NOT_FOUND, http: 404, condition: "TrackingEvent id does not exist" }
  - { id: ERR_IDENTITY_LINK_NOT_FOUND, http: 404, condition: "ShipmentIdentityLink id does not exist" }
  - { id: ERR_ALERT_NOT_FOUND, http: 404, condition: "ExceptionAlert id does not exist" }
  - { id: ERR_APPOINTMENT_NOT_FOUND, http: 404, condition: "Appointment id does not exist" }
  - { id: ERR_DATA_SHARE_GRANT_NOT_FOUND, http: 404, condition: "DataShareGrant id does not exist" }
  - { id: ERR_CONNECTION_INVALID_STATE, http: 409, condition: "Connection state does not allow the requested transition (or heartbeats outside TESTING/ACTIVE/SUSPENDED)" }
  - { id: ERR_CONNECTION_NOT_ACTIVE, http: 409, condition: "Shipment create requires connection TESTING/ACTIVE; event ingest requires connection ACTIVE" }
  - { id: ERR_REMEDIATION_NOT_PROVEN, http: 409, condition: "Resume requires a heartbeat recorded after suspended_at" }
  - { id: ERR_TESTING_WINDOW_CONFLICT, http: 409, condition: "Closed-interval testing window intersects another TESTING connection of the same carrier (touching endpoints conflict)" }
  - { id: ERR_QUALITY_GATE_NOT_MET, http: 422, condition: "Activation requires epoch data_quality_score >= 70" }
  - { id: ERR_SHIPMENT_NOT_TRACKABLE, http: 409, condition: "Event ingest on a DELIVERED or CANCELLED shipment" }
  - { id: ERR_SHIPMENT_NOT_CANCELLABLE, http: 409, condition: "Cancel attempted from OUT_FOR_DELIVERY or a terminal state" }
  - { id: ERR_SHIPMENT_TERMINAL, http: 409, condition: "Identity-link confirm requires shipment tracking_status not in {DELIVERED, CANCELLED}" }
  - { id: ERR_MATCH_SCORE_BELOW_THRESHOLD, http: 422, condition: "Link confirm requires match_score > 0.90 strictly" }
  - { id: ERR_LINK_NOT_PROPOSED, http: 409, condition: "Confirm requires PROPOSED; reject requires PROPOSED or CONFIRMED" }
  - { id: ERR_ALERT_INVALID_STATE, http: 409, condition: "Acknowledge requires OPEN/ESCALATED; resolve requires ACKNOWLEDGED" }
  - { id: ERR_FACILITY_NOT_ACTIVE, http: 409, condition: "Appointment booking requires the facility ACTIVE" }
  - { id: ERR_APPOINTMENT_WINDOW_CONFLICT, http: 409, condition: "Half-open appointment window overlaps an existing SCHEDULED appointment at the facility" }
  - { id: ERR_APPOINTMENT_INVALID_STATE, http: 409, condition: "Complete requires SCHEDULED; void-completion requires COMPLETED" }
  - { id: ERR_GRANT_ALREADY_REVOKED, http: 409, condition: "Revoke requires an ACTIVE grant" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_*_version does not match the parent's current version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator; owns shippers, facilities, the logical clock, and ops-run checkpoints"
    identity: "opaque"
    exclusive_operations:
      - "POST /shippers"
      - "POST /facilities"
      - "PATCH /facilities/{id}"
      - "POST /_clock/set_current_utc"
      - "POST /_ops/run-checkpoint"
    shared_operations:
      - "All GET endpoints; GET /alerts"

  - name: NetworkOps
    description: "Network onboarding operator; owns carriers, connection lifecycle, identity-link proposals, ETA recomputes, event voids, completion voids"
    identity: "opaque"
    exclusive_operations:
      - "POST /carriers"
      - "POST /carriers/{id}/connections"
      - "POST /connections/{id}/begin-testing"
      - "POST /connections/{id}/activate"
      - "POST /connections/{id}/suspend"
      - "POST /connections/{id}/resume"
      - "POST /connections/{id}/retire"
      - "POST /shipments/{id}/events/{eventId}/void"
      - "POST /shipments/{id}/recompute-eta"
      - "POST /shipments/{id}/identity-links"
      - "POST /appointments/{id}/void-completion"
    shared_operations:
      - "All GET endpoints; GET /alerts"

  - name: CarrierRep
    description: "Carrier representative; X-User-ID equals the Carrier.id they act for (ownership enforced)"
    identity: "entity_backed:Carrier"
    exclusive_operations:
      - "POST /connections/{id}/submit-credentials (own carrier only)"
      - "POST /connections/{id}/heartbeats (own carrier only)"
      - "POST /shipments/{id}/events (own carrier's shipments only)"
      - "POST /facilities/{id}/appointments (for own carrier's shipments only)"
      - "POST /appointments/{id}/complete (own carrier's shipments only)"
    shared_operations:
      - "All GET endpoints subject to data-share visibility"

  - name: ShipperRep
    description: "Shipper representative; X-User-ID equals the Shipper.id they act for (ownership enforced)"
    identity: "entity_backed:Shipper"
    exclusive_operations:
      - "POST /shippers/{id}/consignees (own shipper only)"
      - "POST /shippers/{id}/purchase-orders (own shipper only)"
      - "POST /shippers/{id}/shipments (own shipper only)"
      - "POST /shipments/{id}/cancel (own shipments only)"
      - "POST /identity-links/{id}/confirm (own POs only)"
      - "POST /identity-links/{id}/reject (own POs only)"
      - "POST /shippers/{id}/data-share-grants (own shipper only)"
      - "POST /data-share-grants/{id}/revoke (own grants only)"
    shared_operations:
      - "All GET endpoints subject to data-share visibility"

  - name: CustomerService
    description: "Customer-service exception handler; works the alert queue"
    identity: "opaque"
    exclusive_operations:
      - "POST /alerts/{id}/acknowledge"
      - "POST /alerts/{id}/resolve"
    shared_operations:
      - "All GET endpoints; GET /alerts"

  - name: ConsigneeRep
    description: "Consignee (shipper's customer) read-only viewer; X-User-ID equals the Consignee.id they act for"
    identity: "entity_backed:Consignee"
    exclusive_operations: []
    shared_operations:
      - "All GET endpoints subject to data-share visibility (requires an ACTIVE grant from the shipment's shipper)"
