              as_user_id: "${ga}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_SLOT_START_PASSED"

      - name: revision_not_monotonic_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=12]", "errors[ERR_REVISION_NOT_MONOTONIC]"]
        distinguishing_aspect: "Second revision with effective_utc not strictly after the first revision's effective_utc -> 409 ERR_REVISION_NOT_MONOTONIC."
