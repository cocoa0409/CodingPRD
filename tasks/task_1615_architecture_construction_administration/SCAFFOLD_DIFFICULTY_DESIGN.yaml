            - call: "POST /ca/field-reports"
              payload: { site_visit_id: "${v1_id}", issued_by_user_id: "user-arch-lead", conformance_summary: "MINOR_DEVIATIONS", nonconforming_work_flag: false }
              as: ArchitectCA
            - call: "POST /ca/record-documents"
              payload: { project_id: "${p_id}", doc_type: "AS_BUILT" }
              as: Contractor
              as_user_id: "user-contractor-1"
              captures: { rd1_id: $.data.id }
            - call: "POST /ca/record-documents/${rd1_id}/review"
              payload: { outcome: "ACCEPT" }
              as: ArchitectCA
              as_user_id: "user-arch-lead"
            - call: "POST /ca/record-documents"
              payload: { project_id: "${p_id}", doc_type: "OM_MANUAL" }
              as: Contractor
              as_user_id: "user-contractor-1"
              captures: { rd2_id: $.data.id }
            - call: "POST /ca/record-documents/${rd2_id}/review"
              payload: { outcome: "ACCEPT" }
              as: ArchitectCA
              as_user_id: "user-arch-lead"
            - call: "POST /ca/record-documents"
              payload: { project_id: "${p_id}", doc_type: "WARRANTY" }
              as: Contractor
              as_user_id: "user-contractor-1"
              captures: { rd3_id: $.data.id }
            - call: "POST /ca/record-documents/${rd3_id}/review"
              payload: { outcome: "ACCEPT" }
              as: ArchitectCA
              as_user_id: "user-arch-lead"
            - call: "POST /ca/record-documents"
              payload: { project_id: "${p_id}", doc_type: "TEST_REPORT" }
              as: Contractor
              as_user_id: "user-contractor-1"
              captures: { rd4_id: $.data.id }
            - call: "POST /ca/record-documents/${rd4_id}/review"
              payload: { outcome: "ACCEPT" }
              as: ArchitectCA
              as_user_id: "user-arch-lead"
            - call: "POST /ca/projects/${p_id}/achieve-substantial-completion"
              payload: {}
              as: ArchitectCA
              as_user_id: "user-arch-lead"
            - call: "POST /ca/punch-list-items"
              payload: { project_id: "${p_id}", raised_visit_id: "${v1_id}", description: "Caulk joint at entry", location: "Entry" }
              as: ArchitectCA
              as_user_id: "user-arch-lead"
              captures: { item_id: $.data.id }
            - call: "POST /ca/punch-list-items/${item_id}/claim-complete"
              payload: {}
              as: Contractor
              as_user_id: "user-contractor-1"
          trigger:
            - call: "POST /ca/projects/${p_id}/achieve-final-completion"
              payload: {}
              as: ArchitectCA
              as_user_id: "user-arch-lead"
              captures: { err_id: $.data.error_id }
            - call: "POST /ca/punch-list-items/${item_id}/verify"
              payload: {}
              as: ArchitectCA
              as_user_id: "user-arch-lead"
            - call: "POST /ca/projects/${p_id}/achieve-final-completion"
