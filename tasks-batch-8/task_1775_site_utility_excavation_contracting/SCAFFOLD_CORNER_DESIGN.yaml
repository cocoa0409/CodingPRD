              as: ProjectManager
            - call: "POST /site-utility/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /site-utility/pothole-verifications"
              payload: { project_id: "${p_id}", locate_ticket_id: "${t_id}", station_label: "STA 1+00", expected_utility_type: WATER, method: VACUUM, design_depth_in: 60, design_offset_in: 12 }
