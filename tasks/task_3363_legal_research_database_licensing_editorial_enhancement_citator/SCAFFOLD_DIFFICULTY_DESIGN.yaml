            - {call: "POST /legal-research/invoices/generate", payload: {subscription_id: "${s_y}", period_start: "2026-09-01", period_end: "2026-10-01"}, as: BillingAdmin, captures: {inv_y: $.data.id}}
          assert:
            - "Invoice.${inv_x}: overage_search_units == 0 and overage_view_units == 0 and overage_fee_cents == 0 and total_cents == 5000 (== comparison: exactly-at-quota is NOT over)"
