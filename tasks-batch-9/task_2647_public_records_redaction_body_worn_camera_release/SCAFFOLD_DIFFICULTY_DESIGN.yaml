              payload: { scope_narrative: "Narrowed to the 10-minute contact", requested_date_from: "2026-07-23T00:00:00Z", requested_date_to: "2026-07-23T23:59:59Z", expected_request_version: "${req_v1}" }
              as: RecordsClerk
