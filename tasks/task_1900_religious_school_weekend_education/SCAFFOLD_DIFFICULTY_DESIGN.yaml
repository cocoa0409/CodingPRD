scaffold_difficulty_design:
  # =====================================================================
  # Rule 1 — dual_variant_calc (3 instances, 3 different entity domains)
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: tuition_provisional_estimate_vs_final_invoice_line
        grounds:
          - calculations.enrollment_net_tuition
          - entities.Enrollment.fields.estimated_tuition_cents
          - entities.TuitionInvoice.fields.line_items
          - entities.Enrollment.fields.sibling_rank
        distinguishing_aspect: |
          Tuition domain: the same enrollment is priced twice — provisional (frozen
          estimated_tuition_cents at creation) vs final (line_cents at invoice issue).
          A sibling withdrawal between the two removes the WITHDRAWN enrollment from
          the rank set, shifting the third child from rank 2 (20% off) to rank 1
          (10% off), so the final line differs from the frozen estimate.
        test_recipe:
          setup:
            - "Year OPEN (security plan ACTIVE) with member tuition 72500, early_bird 7.5% before 2026-08-15, sibling tiers [0, 0.10, 0.20], activity fee 5000"
            - "Section G3/BEGINNER capacity 10 staffed; MEMBER family with 3 G3/BEGINNER students, all enrolled before the deadline (clock at default 2026-08-01)"
            - "Middle enrollment withdrawn BEFORE any invoice issue (credit_pct 1.0 but no billed invoice -> no credit)"
          setup_api_calls:
            - { call: "POST /school/school-years", payload: { name: "2026-27", start_date: "2026-09-01", end_date: "2027-06-01", member_tuition_cents: 72500, non_member_tuition_cents: 120000, early_bird_pct: 0.075, early_bird_deadline: "2026-08-15T00:00:00Z", sibling_discount_pcts: [0, 0.10, 0.20], activity_fee_cents: 5000, volunteer_hours_required: 8, volunteer_buyout_fee_cents: 25000, late_fee_pct: 0.015, late_fee_min_balance_cents: 500, tuition_due_date: "2026-10-01", withdrawal_deadline: "2026-09-30", refund_pct_after_deadline: 0.5, attendance_threshold_pct: 80 }, as: SchoolAdmin, captures: { y_id: $.data.id } }
            - { call: "POST /school/school-years/${y_id}/security-plan", payload: { plan_document: "Camera coverage and check-in desk" }, as: SchoolAdmin, captures: { sp_id: $.data.id } }
            - { call: "POST /school/security-plans/${sp_id}/submit", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/security-plans/${sp_id}/approve", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/school-years/${y_id}/open", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/teachers", payload: { full_name: "Teach One", email: "t1@x.org", background_check_cleared: true }, as: SchoolAdmin, captures: { t_id: $.data.id } }
            - { call: "POST /school/teachers/${t_id}/vet", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/teachers/${t_id}/hire", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/school-years/${y_id}/sections", payload: { grade: "G3", hebrew_level: "BEGINNER", capacity: 10, room: "R1", day_of_week: "SUN", start_time: "10:00", end_time: "11:30", teacher_id: "${t_id}" }, as: SchoolAdmin, captures: { sec_id: $.data.id, sec_v: $.data.version } }
            - { call: "POST /school/families", payload: { family_name: "Fam Trio", primary_email: "trio@x.org", membership_status: "MEMBER" }, as: SchoolAdmin, captures: { fam_id: $.data.id, fam_v: $.data.version } }
            - { call: "POST /school/families/${fam_id}/students", payload: { full_name: "Kid A", grade: "G3", hebrew_level: "BEGINNER" }, as: SchoolAdmin, captures: { stu_a: $.data.id } }
            - { call: "POST /school/families/${fam_id}/students", payload: { full_name: "Kid B", grade: "G3", hebrew_level: "BEGINNER" }, as: SchoolAdmin, captures: { stu_b: $.data.id } }
            - { call: "POST /school/families/${fam_id}/students", payload: { full_name: "Kid C", grade: "G3", hebrew_level: "BEGINNER" }, as: SchoolAdmin, captures: { stu_c: $.data.id } }
            - { call: "POST /school/sections/${sec_id}/enrollments", payload: { student_id: "${stu_a}", expected_section_version: "${sec_v}" }, as: SchoolAdmin, captures: { enr_a: $.data.id, est_a: $.data.estimated_tuition_cents } }
            - { call: "GET /school/sections/${sec_id}", payload: {}, as: SchoolAdmin, captures: { sec_v2: $.data.version } }
            - { call: "POST /school/sections/${sec_id}/enrollments", payload: { student_id: "${stu_b}", expected_section_version: "${sec_v2}" }, as: SchoolAdmin, captures: { enr_b: $.data.id, est_b: $.data.estimated_tuition_cents } }
            - { call: "GET /school/sections/${sec_id}", payload: {}, as: SchoolAdmin, captures: { sec_v3: $.data.version } }
            - { call: "POST /school/sections/${sec_id}/enrollments", payload: { student_id: "${stu_c}", expected_section_version: "${sec_v3}" }, as: SchoolAdmin, captures: { enr_c: $.data.id, est_c: $.data.estimated_tuition_cents } }
            - { call: "POST /school/enrollments/${enr_b}/withdraw", payload: {}, as: SchoolAdmin }
          trigger:
            - { call: "POST /school/families/${fam_id}/invoices", payload: { school_year_id: "${y_id}", expected_family_version: "${fam_v}" }, as: SchoolAdmin, captures: { inv_id: $.data.id, gross: $.data.gross_cents } }
          assert:
            - "est_a == 67063 (rank0: round_half_up(72500 * 1.00 * 0.925))"
            - "est_b == 60356 (rank1: round_half_up(65250 * 0.925))"
            - "est_c == 53650 (rank2 provisional: round_half_up(58000 * 0.925)) — frozen on Enrollment.${enr_c}"
            - "TuitionInvoice.${inv_id} line for ${enr_c} line_cents == 60356 (rank shifted 2 -> 1 after sibling withdrawal) — differs from frozen estimate 53650"
            - "TuitionInvoice.${inv_id} line for ${enr_a} line_cents == 67063; withdrawn ${enr_b} has NO line"
            - "TuitionInvoice.${inv_id}.gross_cents == 127419; activity_fee_cents == 5000; total_due_cents == 132419; balance_cents == 132419; status == ISSUED; kind == TUITION"

      - name: assistance_award_percent_of_net_vs_flat_cap
        grounds:
          - calculations.assistance_award_amount
          - entities.AssistanceApplication.fields.award_method
          - entities.TuitionInvoice.fields.award_cents
        distinguishing_aspect: |
          Assistance domain (different entity domain than tuition): two families with
          identical gross tuition (181069) receive awards computed by the two committee
          methods — PERCENT_OF_NET (25% of gross = 45267) vs FLAT_CAP (min(150000,
          gross) = 150000) — producing different award_cents and total_due_cents.
        test_recipe:
          setup:
            - "Year OPEN with the standard config; one G3/BEGINNER section capacity 10"
            - "MEMBER family P with 3 enrolled students; MEMBER family Q with 3 enrolled students (identical gross 181069 each)"
            - "P has APPROVED application PERCENT_OF_NET 0.25; Q has APPROVED application FLAT_CAP 150000 (different reviewers/deciders to respect SoD)"
          setup_api_calls:
            - { call: "POST /school/school-years", payload: { name: "2026-27", start_date: "2026-09-01", end_date: "2027-06-01", member_tuition_cents: 72500, non_member_tuition_cents: 120000, early_bird_pct: 0.075, early_bird_deadline: "2026-08-15T00:00:00Z", sibling_discount_pcts: [0, 0.10, 0.20], activity_fee_cents: 5000, volunteer_hours_required: 8, volunteer_buyout_fee_cents: 25000, late_fee_pct: 0.015, late_fee_min_balance_cents: 500, tuition_due_date: "2026-10-01", withdrawal_deadline: "2026-09-30", refund_pct_after_deadline: 0.5, attendance_threshold_pct: 80 }, as: SchoolAdmin, captures: { y_id: $.data.id } }
            - { call: "POST /school/school-years/${y_id}/security-plan", payload: { plan_document: "Plan" }, as: SchoolAdmin, captures: { sp_id: $.data.id } }
            - { call: "POST /school/security-plans/${sp_id}/submit", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/security-plans/${sp_id}/approve", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/school-years/${y_id}/open", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/teachers", payload: { full_name: "T", email: "t@x.org", background_check_cleared: true }, as: SchoolAdmin, captures: { t_id: $.data.id } }
            - { call: "POST /school/teachers/${t_id}/vet", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/teachers/${t_id}/hire", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/school-years/${y_id}/sections", payload: { grade: "G3", hebrew_level: "BEGINNER", capacity: 10, room: "R1", day_of_week: "SUN", start_time: "10:00", end_time: "11:30", teacher_id: "${t_id}" }, as: SchoolAdmin, captures: { sec_id: $.data.id, sv: $.data.version } }
            - { call: "POST /school/families", payload: { family_name: "Fam P", primary_email: "p@x.org", membership_status: "MEMBER" }, as: SchoolAdmin, captures: { fam_p: $.data.id, fam_p_v: $.data.version } }
            - { call: "POST /school/families", payload: { family_name: "Fam Q", primary_email: "q@x.org", membership_status: "MEMBER" }, as: SchoolAdmin, captures: { fam_q: $.data.id, fam_q_v: $.data.version } }
            - { call: "POST /school/families/${fam_p}/students", payload: { full_name: "P1", grade: "G3", hebrew_level: "BEGINNER" }, as: SchoolAdmin, captures: { p1: $.data.id } }
            - { call: "POST /school/families/${fam_p}/students", payload: { full_name: "P2", grade: "G3", hebrew_level: "BEGINNER" }, as: SchoolAdmin, captures: { p2: $.data.id } }
            - { call: "POST /school/families/${fam_p}/students", payload: { full_name: "P3", grade: "G3", hebrew_level: "BEGINNER" }, as: SchoolAdmin, captures: { p3: $.data.id } }
            - { call: "POST /school/families/${fam_q}/students", payload: { full_name: "Q1", grade: "G3", hebrew_level: "BEGINNER" }, as: SchoolAdmin, captures: { q1: $.data.id } }
            - { call: "POST /school/families/${fam_q}/students", payload: { full_name: "Q2", grade: "G3", hebrew_level: "BEGINNER" }, as: SchoolAdmin, captures: { q2: $.data.id } }
            - { call: "POST /school/families/${fam_q}/students", payload: { full_name: "Q3", grade: "G3", hebrew_level: "BEGINNER" }, as: SchoolAdmin, captures: { q3: $.data.id } }
            - { call: "POST /school/sections/${sec_id}/enrollments", payload: { student_id: "${p1}", expected_section_version: "${sv}" }, as: SchoolAdmin }
            - { call: "GET /school/sections/${sec_id}", payload: {}, as: SchoolAdmin, captures: { sv: $.data.version } }
            - { call: "POST /school/sections/${sec_id}/enrollments", payload: { student_id: "${p2}", expected_section_version: "${sv}" }, as: SchoolAdmin }
            - { call: "GET /school/sections/${sec_id}", payload: {}, as: SchoolAdmin, captures: { sv: $.data.version } }
            - { call: "POST /school/sections/${sec_id}/enrollments", payload: { student_id: "${p3}", expected_section_version: "${sv}" }, as: SchoolAdmin }
            - { call: "GET /school/sections/${sec_id}", payload: {}, as: SchoolAdmin, captures: { sv: $.data.version } }
            - { call: "POST /school/sections/${sec_id}/enrollments", payload: { student_id: "${q1}", expected_section_version: "${sv}" }, as: SchoolAdmin }
            - { call: "GET /school/sections/${sec_id}", payload: {}, as: SchoolAdmin, captures: { sv: $.data.version } }
            - { call: "POST /school/sections/${sec_id}/enrollments", payload: { student_id: "${q2}", expected_section_version: "${sv}" }, as: SchoolAdmin }
            - { call: "GET /school/sections/${sec_id}", payload: {}, as: SchoolAdmin, captures: { sv: $.data.version } }
            - { call: "POST /school/sections/${sec_id}/enrollments", payload: { student_id: "${q3}", expected_section_version: "${sv}" }, as: SchoolAdmin }
            - { call: "POST /school/families/${fam_p}/assistance-applications", payload: { school_year_id: "${y_id}", reason: "Job loss" }, as: SchoolAdmin, captures: { app_p: $.data.id } }
            - { call: "POST /school/assistance-applications/${app_p}/start-review", payload: {}, as: AssistanceOfficer, as_user_id: "officer-1" }
            - { call: "POST /school/assistance-applications/${app_p}/decide", payload: { decision: "APPROVED", award_method: "PERCENT_OF_NET", award_percent: 0.25 }, as: SchoolAdmin, as_user_id: "admin-9" }
            - { call: "POST /school/families/${fam_q}/assistance-applications", payload: { school_year_id: "${y_id}", reason: "Medical bills" }, as: SchoolAdmin, captures: { app_q: $.data.id } }
            - { call: "POST /school/assistance-applications/${app_q}/start-review", payload: {}, as: AssistanceOfficer, as_user_id: "officer-2" }
            - { call: "POST /school/assistance-applications/${app_q}/decide", payload: { decision: "APPROVED", award_method: "FLAT_CAP", award_amount_cents: 150000 }, as: SchoolAdmin, as_user_id: "admin-9" }
          trigger:
            - { call: "POST /school/families/${fam_p}/invoices", payload: { school_year_id: "${y_id}", expected_family_version: "${fam_p_v}" }, as: SchoolAdmin, captures: { inv_p: $.data.id } }
            - { call: "POST /school/families/${fam_q}/invoices", payload: { school_year_id: "${y_id}", expected_family_version: "${fam_q_v}" }, as: SchoolAdmin, captures: { inv_q: $.data.id } }
          assert:
            - "TuitionInvoice.${inv_p}.gross_cents == 181069 and TuitionInvoice.${inv_q}.gross_cents == 181069 (identical data)"
            - "TuitionInvoice.${inv_p}.award_cents == 45267 (round_half_up(0.25 * 181069)) via PERCENT_OF_NET"
            - "TuitionInvoice.${inv_q}.award_cents == 150000 via FLAT_CAP (min(150000, 181069))"
            - "TuitionInvoice.${inv_p}.total_due_cents == 140802 vs TuitionInvoice.${inv_q}.total_due_cents == 36069 — variants diverge"
            - "TuitionInvoice.${inv_p}.assistance_application_id == ${app_p}; TuitionInvoice.${inv_q}.assistance_application_id == ${app_q}"

      - name: attendance_current_vs_projected_percentage
        grounds:
          - calculations.attendance_percentage
          - entities.Milestone.fields.current_attendance_pct
          - entities.Milestone.fields.projected_attendance_pct
        distinguishing_aspect: |
          Milestone/attendance domain (third distinct domain): identical posted data —
          current variant counts only HELD sessions with attendance (3/4 = 75.0),
          projected variant adds the remaining SCHEDULED session as a future PRESENT
          ((3+1)/(4+1) = 80.0); same input, two pinned outputs.
        test_recipe:
          setup:
            - "Year OPEN, standard config; G3/BEGINNER section capacity 5; one MEMBER family with one enrolled student"
            - "Sessions on 2026-09-13, 2026-09-20, 2026-09-27, 2026-10-04 all HELD with attendance posted: P, P, P, ABSENT; a fifth session 2026-10-11 left SCHEDULED"
          setup_api_calls:
            - { call: "POST /school/school-years", payload: { name: "2026-27", start_date: "2026-09-01", end_date: "2027-06-01", member_tuition_cents: 72500, non_member_tuition_cents: 120000, early_bird_pct: 0.075, early_bird_deadline: "2026-08-15T00:00:00Z", sibling_discount_pcts: [0, 0.10, 0.20], activity_fee_cents: 5000, volunteer_hours_required: 8, volunteer_buyout_fee_cents: 25000, late_fee_pct: 0.015, late_fee_min_balance_cents: 500, tuition_due_date: "2026-10-01", withdrawal_deadline: "2026-09-30", refund_pct_after_deadline: 0.5, attendance_threshold_pct: 80 }, as: SchoolAdmin, captures: { y_id: $.data.id } }
            - { call: "POST /school/school-years/${y_id}/security-plan", payload: { plan_document: "Plan" }, as: SchoolAdmin, captures: { sp_id: $.data.id } }
            - { call: "POST /school/security-plans/${sp_id}/submit", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/security-plans/${sp_id}/approve", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/school-years/${y_id}/open", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/teachers", payload: { full_name: "T", email: "t@x.org", background_check_cleared: true }, as: SchoolAdmin, captures: { t_id: $.data.id } }
            - { call: "POST /school/teachers/${t_id}/vet", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/teachers/${t_id}/hire", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/school-years/${y_id}/sections", payload: { grade: "G3", hebrew_level: "BEGINNER", capacity: 5, room: "R1", day_of_week: "SUN", start_time: "10:00", end_time: "11:30", teacher_id: "${t_id}" }, as: SchoolAdmin, captures: { sec_id: $.data.id, sv: $.data.version } }
            - { call: "POST /school/families", payload: { family_name: "Fam S", primary_email: "s@x.org", membership_status: "MEMBER" }, as: SchoolAdmin, captures: { fam_id: $.data.id } }
            - { call: "POST /school/families/${fam_id}/students", payload: { full_name: "Solo", grade: "G3", hebrew_level: "BEGINNER" }, as: SchoolAdmin, captures: { stu: $.data.id } }
            - { call: "POST /school/sections/${sec_id}/enrollments", payload: { student_id: "${stu}", expected_section_version: "${sv}" }, as: SchoolAdmin }
            - { call: "POST /school/sections/${sec_id}/sessions", payload: { session_date: "2026-09-13" }, as: SchoolAdmin, captures: { se1: $.data.id } }
            - { call: "POST /school/sections/${sec_id}/sessions", payload: { session_date: "2026-09-20" }, as: SchoolAdmin, captures: { se2: $.data.id } }
            - { call: "POST /school/sections/${sec_id}/sessions", payload: { session_date: "2026-09-27" }, as: SchoolAdmin, captures: { se3: $.data.id } }
            - { call: "POST /school/sections/${sec_id}/sessions", payload: { session_date: "2026-10-04" }, as: SchoolAdmin, captures: { se4: $.data.id } }
            - { call: "POST /school/sections/${sec_id}/sessions", payload: { session_date: "2026-10-11" }, as: SchoolAdmin, captures: { se5: $.data.id } }
            - { call: "POST /school/_clock/set_current_utc", payload: { to_iso8601: "2026-10-04T12:00:00Z" }, as: SchoolAdmin }
            - { call: "POST /school/sessions/${se1}/hold", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/sessions/${se2}/hold", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/sessions/${se3}/hold", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/sessions/${se4}/hold", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/sessions/${se1}/attendance", payload: { entries: [{ student_id: "${stu}", status: "PRESENT" }] }, as: SchoolAdmin }
            - { call: "POST /school/sessions/${se2}/attendance", payload: { entries: [{ student_id: "${stu}", status: "PRESENT" }] }, as: SchoolAdmin }
            - { call: "POST /school/sessions/${se3}/attendance", payload: { entries: [{ student_id: "${stu}", status: "PRESENT" }] }, as: SchoolAdmin }
            - { call: "POST /school/sessions/${se4}/attendance", payload: { entries: [{ student_id: "${stu}", status: "ABSENT" }] }, as: SchoolAdmin }
            - { call: "GET /school/milestones?student_id=${stu}", payload: {}, as: SchoolAdmin, captures: { m_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /school/milestones/${m_id}/evaluate", payload: {}, as: SchoolAdmin }
          assert:
            - "Milestone.${m_id}.current_attendance_pct == 75.0 (3.0 / 4 HELD-with-attendance sessions)"
            - "Milestone.${m_id}.projected_attendance_pct == 80.0 ((3 + 1 SCHEDULED) / (4 + 1)) — same data, different variant value"
            - "Milestone.${m_id}.status == TRACKING (75.0 < 80 — only the current variant gates eligibility)"

  # =====================================================================
  # Rule 2 — combinatorial_formula (2 instances, modes (a) and (c))
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: enrollment_net_tuition_tiered_branch_rounding
        grounds:
          - calculations.enrollment_net_tuition
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — membership-status branch
          selects the base, sibling-rank tier selects the discount, the early-bird
          conditional applies a second multiplicative factor, and two pinned
          round_half_up steps interleave. NON_MEMBER rank0 early = 111000 while MEMBER
          rank2 early = 53650 from the same formula skeleton.
        test_recipe:
          setup:
            - "Year OPEN, standard config; G1/INTERMEDIATE section capacity 10"
            - "NON_MEMBER family N with 1 student; MEMBER family M with 3 students; all enrolled before the early-bird deadline"
          setup_api_calls:
            - { call: "POST /school/school-years", payload: { name: "2026-27", start_date: "2026-09-01", end_date: "2027-06-01", member_tuition_cents: 72500, non_member_tuition_cents: 120000, early_bird_pct: 0.075, early_bird_deadline: "2026-08-15T00:00:00Z", sibling_discount_pcts: [0, 0.10, 0.20], activity_fee_cents: 5000, volunteer_hours_required: 8, volunteer_buyout_fee_cents: 25000, late_fee_pct: 0.015, late_fee_min_balance_cents: 500, tuition_due_date: "2026-10-01", withdrawal_deadline: "2026-09-30", refund_pct_after_deadline: 0.5, attendance_threshold_pct: 80 }, as: SchoolAdmin, captures: { y_id: $.data.id } }
            - { call: "POST /school/school-years/${y_id}/security-plan", payload: { plan_document: "Plan" }, as: SchoolAdmin, captures: { sp_id: $.data.id } }
            - { call: "POST /school/security-plans/${sp_id}/submit", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/security-plans/${sp_id}/approve", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/school-years/${y_id}/open", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/teachers", payload: { full_name: "T", email: "t@x.org", background_check_cleared: true }, as: SchoolAdmin, captures: { t_id: $.data.id } }
            - { call: "POST /school/teachers/${t_id}/vet", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/teachers/${t_id}/hire", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/school-years/${y_id}/sections", payload: { grade: "G1", hebrew_level: "INTERMEDIATE", capacity: 10, room: "R2", day_of_week: "SUN", start_time: "10:00", end_time: "11:30", teacher_id: "${t_id}" }, as: SchoolAdmin, captures: { sec_id: $.data.id, sv: $.data.version } }
            - { call: "POST /school/families", payload: { family_name: "Fam N", primary_email: "n@x.org", membership_status: "NON_MEMBER" }, as: SchoolAdmin, captures: { fam_n: $.data.id } }
            - { call: "POST /school/families/${fam_n}/students", payload: { full_name: "N1", grade: "G1", hebrew_level: "INTERMEDIATE" }, as: SchoolAdmin, captures: { n1: $.data.id } }
            - { call: "POST /school/families", payload: { family_name: "Fam M", primary_email: "m@x.org", membership_status: "MEMBER" }, as: SchoolAdmin, captures: { fam_m: $.data.id } }
            - { call: "POST /school/families/${fam_m}/students", payload: { full_name: "M1", grade: "G1", hebrew_level: "INTERMEDIATE" }, as: SchoolAdmin, captures: { m1: $.data.id } }
            - { call: "POST /school/families/${fam_m}/students", payload: { full_name: "M2", grade: "G1", hebrew_level: "INTERMEDIATE" }, as: SchoolAdmin, captures: { m2: $.data.id } }
            - { call: "POST /school/families/${fam_m}/students", payload: { full_name: "M3", grade: "G1", hebrew_level: "INTERMEDIATE" }, as: SchoolAdmin, captures: { m3: $.data.id } }
          trigger:
            - { call: "POST /school/sections/${sec_id}/enrollments", payload: { student_id: "${n1}", expected_section_version: "${sv}" }, as: SchoolAdmin, captures: { est_n1: $.data.estimated_tuition_cents } }
            - { call: "GET /school/sections/${sec_id}", payload: {}, as: SchoolAdmin, captures: { sv: $.data.version } }
            - { call: "POST /school/sections/${sec_id}/enrollments", payload: { student_id: "${m1}", expected_section_version: "${sv}" }, as: SchoolAdmin, captures: { est_m1: $.data.estimated_tuition_cents } }
