            - { call: "POST /endoscopy/rooms", payload: { name: "R-U1", room_class: "STANDARD", supports_anesthesia: true }, as: UnitAdmin, captures: { ru1: $.data.id } }
            - { call: "POST /endoscopy/rooms", payload: { name: "R-U2", room_class: "STANDARD", supports_anesthesia: true }, as: UnitAdmin, captures: { ru2: $.data.id } }
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p_yng}", provider_id: "${dr1}", procedure_type_id: "${t_col}", room_id: "${ru1}", scheduled_start: "2026-08-05T08:00:00Z", indication: "SCREENING", anesthesia_type: "MAC" }, as: SchedulingCoordinator, captures: { u1a: $.data.id } }
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p_yng}", provider_id: "${dr1}", procedure_type_id: "${t_col}", room_id: "${ru1}", scheduled_start: "2026-08-05T09:05:00Z", indication: "SCREENING", anesthesia_type: "MAC" }, as: SchedulingCoordinator, captures: { u1b: $.data.id } }
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p_old}", provider_id: "${dr1}", procedure_type_id: "${t_col}", room_id: "${ru1}", scheduled_start: "2026-08-05T10:10:00Z", indication: "SCREENING", anesthesia_type: "MAC" }, as: SchedulingCoordinator, captures: { u1c: $.data.id } }
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p_yng}", provider_id: "${dr1}", procedure_type_id: "${t_col}", room_id: "${ru2}", scheduled_start: "2026-08-05T08:00:00Z", indication: "SCREENING", anesthesia_type: "MAC" }, as: SchedulingCoordinator, captures: { u2a: $.data.id } }
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p_yng}", provider_id: "${dr1}", procedure_type_id: "${t_egd}", room_id: "${ru2}", scheduled_start: "2026-08-05T09:05:00Z", indication: "DIAGNOSTIC", anesthesia_type: "MAC" }, as: SchedulingCoordinator, captures: { u2b: $.data.id } }
          trigger:
            - { call: "GET /endoscopy/reports/room-utilization", payload: { date: "2026-08-05" }, as: QualityOfficer, captures: { unit_pct: $.data.unit_utilization_pct, open_min: $.data.open_minutes_per_room } }
          assert:
            - "open_minutes_per_room == 480"
            - "rooms entry for ${ru1}: occupied_minutes == 200, utilization_pct == 41.7"
            - "rooms entry for ${ru2}: occupied_minutes == 115, utilization_pct == 24.0"
            - "unit_utilization_pct == 32.9 — round_half_up(avg(41.7, 24.0), 1); NOT 32.8 which the sum-then-round order (315/960) would give"
            - "All five bookings contribute while merely SCHEDULED (occupancy set includes SCHEDULED)"

  - rule_id: non_linear_state_machine
    instances:
      - name: booking_parallel_axes_status_times_prep
        grounds:
          - state_machines.ProcedureBooking
          - state_machines.ProcedureBookingPrep
          - entities.ProcedureBooking.fields.prep_status
        distinguishing_aspect: |
          Parallel state dimensions on ONE entity: the booking axis can move
          SCHEDULED -> CANCELLED while the prep axis stays PREP_CONFIRMED (no reset), and the
          abort transition is reachable only from the combined state
          (booking == IN_PROGRESS AND prep == PREP_INADEQUATE). The sibling instance is the
          cyclic Scope machine — a different entity and a different non-linear shape.
        test_recipe:
          setup:
            - "Patient P_YOUNG (1990-05-05), provider DR1, COLONO type, room R_STD, scopes SC1 (COLONOSCOPE)"
            - "B1: created and prep confirmed, then cancelled while prep axis stays put"
            - "B2: driven to IN_PROGRESS, assessed inadequate, then aborted (combined-axis guard)"
          setup_api_calls:
            - { call: "POST /endoscopy/patients", payload: { mrn: "M3201", full_name: "Pat Young", date_of_birth: "1990-05-05" }, as: SchedulingCoordinator, captures: { p1: $.data.id } }
            - { call: "POST /endoscopy/providers", payload: { full_name: "Dr One", specialty: "GASTROENTEROLOGY" }, as: UnitAdmin, captures: { dr1: $.data.id } }
            - { call: "POST /endoscopy/procedure-types", payload: { code: "COLONO", display_name: "Colonoscopy", base_duration_minutes: 40, prep_protocol: "SPLIT_DOSE", colonoscopy_family: true, adr_relevant: true, required_scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { t_col: $.data.id } }
            - { call: "POST /endoscopy/rooms", payload: { name: "R-STD", room_class: "STANDARD", supports_anesthesia: true }, as: UnitAdmin, captures: { r1: $.data.id } }
            - { call: "POST /endoscopy/scopes", payload: { serial_number: "SC-301", scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { sc1: $.data.id } }
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p1}", provider_id: "${dr1}", procedure_type_id: "${t_col}", room_id: "${r1}", scheduled_start: "2026-08-02T09:00:00Z", indication: "SCREENING", anesthesia_type: "NONE" }, as: SchedulingCoordinator, captures: { b1: $.data.id } }
            - { call: "POST /endoscopy/bookings/${b1}/confirm-prep", payload: {}, as: SchedulingCoordinator }
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p1}", provider_id: "${dr1}", procedure_type_id: "${t_col}", room_id: "${r1}", scheduled_start: "2026-08-02T11:00:00Z", indication: "SCREENING", anesthesia_type: "NONE" }, as: SchedulingCoordinator, captures: { b2: $.data.id } }
            - { call: "POST /endoscopy/bookings/${b2}/confirm-prep", payload: {}, as: SchedulingCoordinator }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T11:00:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/bookings/${b2}/check-in", payload: {}, as: SchedulingCoordinator }
            - { call: "POST /endoscopy/bookings/${b2}/start", payload: { scope_id: "${sc1}" }, as: Endoscopist, as_user_id: "${dr1}" }
            - { call: "POST /endoscopy/bookings/${b2}/record-prep-assessment", payload: { bbps_left: 1, bbps_right: 2, bbps_transverse: 2 }, as: Endoscopist, as_user_id: "${dr1}" }
          trigger:
            - { call: "POST /endoscopy/bookings/${b1}/cancel", payload: { reason: "patient request" }, as: SchedulingCoordinator, captures: { b1_status: $.data.status, b1_prep: $.data.prep_status } }
            - { call: "POST /endoscopy/bookings/${b2}/abort", payload: { reason: "prep inadequate" }, as: Endoscopist, as_user_id: "${dr1}", captures: { b2_status: $.data.status, b2_prep: $.data.prep_status } }
          assert:
            - "B1 ${b1}: status == CANCELLED while prep_status == PREP_CONFIRMED — prep axis does NOT reset on booking-axis cancellation"
            - "B2 ${b2}: status == ABORTED_PREP_INADEQUATE and prep_status == PREP_INADEQUATE — abort reachable only from the (IN_PROGRESS, PREP_INADEQUATE) combined state"
            - "GET /endoscopy/scopes/${sc1}.status == AWAITING_REPROCESS (scope freed by abort, not by cancel)"

      - name: scope_cyclic_loop_with_quarantine_branch
        grounds:
          - state_machines.Scope
          - state_machines.ReprocessingCycle
          - state_machines.QuarantineCase
          - calculations.scope_storage_expiry
        distinguishing_aspect: |
          Cyclic machine on Scope: AVAILABLE -> AWAITING_REPROCESS -> REPROCESSING -> AVAILABLE
          closes the loop TWICE (second pass resets storage_expires_at to a later instant while
          use_count stays 1), then the QUARANTINED branch loops QUARANTINED -> REPROCESSING ->
          QUARANTINED (reculture complete does NOT free the scope) before release returns to
          AVAILABLE. Different entity and different shape (cycle vs parallel axes) from the
          sibling booking instance.
        test_recipe:
          setup:
            - "Patient P (1990-05-05), provider DR1, COLONO type, room R_STD, scope SC (COLONOSCOPE)"
            - "Booking B at 2026-08-10T09:00:00Z NONE anesthesia, prep confirmed"
            - "Cycle 1 on SC (dried 2026-08-10T08:26:00Z); booking run with SC; cycle 2 (dried 10:26)"
          setup_api_calls:
            - { call: "POST /endoscopy/patients", payload: { mrn: "M3301", full_name: "Pat Loop", date_of_birth: "1990-05-05" }, as: SchedulingCoordinator, captures: { p1: $.data.id } }
            - { call: "POST /endoscopy/providers", payload: { full_name: "Dr One", specialty: "GASTROENTEROLOGY" }, as: UnitAdmin, captures: { dr1: $.data.id } }
            - { call: "POST /endoscopy/procedure-types", payload: { code: "COLONO", display_name: "Colonoscopy", base_duration_minutes: 40, prep_protocol: "SPLIT_DOSE", colonoscopy_family: true, adr_relevant: true, required_scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { t_col: $.data.id } }
            - { call: "POST /endoscopy/rooms", payload: { name: "R-STD", room_class: "STANDARD", supports_anesthesia: true }, as: UnitAdmin, captures: { r1: $.data.id } }
            - { call: "POST /endoscopy/scopes", payload: { serial_number: "SC-LOOP", scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { sc: $.data.id } }
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p1}", provider_id: "${dr1}", procedure_type_id: "${t_col}", room_id: "${r1}", scheduled_start: "2026-08-10T09:00:00Z", indication: "SCREENING", anesthesia_type: "NONE" }, as: SchedulingCoordinator, captures: { b1: $.data.id } }
            - { call: "POST /endoscopy/bookings/${b1}/confirm-prep", payload: {}, as: SchedulingCoordinator }
            # cycle 1
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:00:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/scopes/${sc}/send-to-reprocessing", payload: {}, as: ReprocessingTechnician }
            - { call: "POST /endoscopy/reprocessing-cycles", payload: { scope_id: "${sc}" }, as: ReprocessingTechnician, as_user_id: "tech-1", captures: { cy1: $.data.id } }
            - { call: "POST /endoscopy/reprocessing-cycles/${cy1}/steps/advance", payload: { to_step: "PRECLEANED" }, as: ReprocessingTechnician }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:06:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/reprocessing-cycles/${cy1}/steps/advance", payload: { to_step: "CLEANED" }, as: ReprocessingTechnician }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:16:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/reprocessing-cycles/${cy1}/steps/advance", payload: { to_step: "DISINFECTED", hld_solution_lot: "LOT-1", hld_concentration_ppm: 350 }, as: ReprocessingTechnician }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:26:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/reprocessing-cycles/${cy1}/steps/advance", payload: { to_step: "DRIED" }, as: ReprocessingTechnician }
            - { call: "POST /endoscopy/reprocessing-cycles/${cy1}/steps/advance", payload: { to_step: "COMPLETE" }, as: ReprocessingTechnician }
            - { call: "GET /endoscopy/scopes/${sc}", payload: {}, as: UnitAdmin, captures: { sc_status_c1: $.data.status, sc_exp_c1: $.data.storage_expires_at } }
            # procedure run (loop through IN_USE)
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/bookings/${b1}/check-in", payload: {}, as: SchedulingCoordinator }
            - { call: "POST /endoscopy/bookings/${b1}/start", payload: { scope_id: "${sc}" }, as: Endoscopist, as_user_id: "${dr1}" }
            - { call: "POST /endoscopy/bookings/${b1}/record-prep-assessment", payload: { bbps_left: 3, bbps_right: 3, bbps_transverse: 3 }, as: Endoscopist, as_user_id: "${dr1}" }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:40:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/bookings/${b1}/complete", payload: { cecum_intubated: true, withdrawal_time_seconds: 500, adenomas_detected: 0 }, as: Endoscopist, as_user_id: "${dr1}" }
            # cycle 2 (second loop iteration)
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T10:00:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/reprocessing-cycles", payload: { scope_id: "${sc}", booking_id: "${b1}" }, as: ReprocessingTechnician, as_user_id: "tech-1", captures: { cy2: $.data.id } }
            - { call: "POST /endoscopy/reprocessing-cycles/${cy2}/steps/advance", payload: { to_step: "PRECLEANED" }, as: ReprocessingTechnician }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T10:06:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/reprocessing-cycles/${cy2}/steps/advance", payload: { to_step: "CLEANED" }, as: ReprocessingTechnician }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T10:16:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/reprocessing-cycles/${cy2}/steps/advance", payload: { to_step: "DISINFECTED", hld_solution_lot: "LOT-2", hld_concentration_ppm: 350 }, as: ReprocessingTechnician }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T10:26:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/reprocessing-cycles/${cy2}/steps/advance", payload: { to_step: "DRIED" }, as: ReprocessingTechnician }
            - { call: "POST /endoscopy/reprocessing-cycles/${cy2}/steps/advance", payload: { to_step: "COMPLETE" }, as: ReprocessingTechnician }
            - { call: "GET /endoscopy/scopes/${sc}", payload: {}, as: UnitAdmin, captures: { sc_status_c2: $.data.status, sc_exp_c2: $.data.storage_expires_at, sc_uses: $.data.use_count } }
            # positive culture -> quarantine branch
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T10:30:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/culture-tests", payload: { scope_id: "${sc}", reprocessing_cycle_id: "${cy2}" }, as: InfectionControlNurse, captures: { cpos: $.data.id } }
            - { call: "POST /endoscopy/culture-tests/${cpos}/result", payload: { result: "POSITIVE", organism: "KLEBSIELLA_PNEUMONIAE", cfu_count: 120 }, as: InfectionControlNurse }
            - { call: "GET /endoscopy/scopes/${sc}", payload: {}, as: UnitAdmin, captures: { sc_status_q: $.data.status } }
            # reculture cycle (quarantine loop: REPROCESSING -> QUARANTINED)
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T10:45:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/reprocessing-cycles", payload: { scope_id: "${sc}" }, as: ReprocessingTechnician, as_user_id: "tech-9", captures: { cy3: $.data.id, cy3_reculture: $.data.is_reculture } }
            - { call: "POST /endoscopy/reprocessing-cycles/${cy3}/steps/advance", payload: { to_step: "PRECLEANED" }, as: ReprocessingTechnician }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T10:51:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/reprocessing-cycles/${cy3}/steps/advance", payload: { to_step: "CLEANED" }, as: ReprocessingTechnician }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T11:01:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/reprocessing-cycles/${cy3}/steps/advance", payload: { to_step: "DISINFECTED", hld_solution_lot: "LOT-3", hld_concentration_ppm: 400 }, as: ReprocessingTechnician }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T11:11:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/reprocessing-cycles/${cy3}/steps/advance", payload: { to_step: "DRIED" }, as: ReprocessingTechnician }
            - { call: "POST /endoscopy/reprocessing-cycles/${cy3}/steps/advance", payload: { to_step: "COMPLETE" }, as: ReprocessingTechnician }
            - { call: "GET /endoscopy/scopes/${sc}", payload: {}, as: UnitAdmin, captures: { sc_status_recult: $.data.status } }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T11:20:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/culture-tests", payload: { scope_id: "${sc}", reprocessing_cycle_id: "${cy3}" }, as: InfectionControlNurse, captures: { cneg: $.data.id } }
            - { call: "POST /endoscopy/culture-tests/${cneg}/result", payload: { result: "NEGATIVE" }, as: InfectionControlNurse }
            - { call: "GET /endoscopy/scopes/${sc}", payload: {}, as: UnitAdmin, captures: { sv: $.data.version } }
          trigger:
            - { call: "POST /endoscopy/scopes/${sc}/release-quarantine", payload: { expected_scope_version: "${sv}" }, as: InfectionControlNurse, as_user_id: "nurse-1", captures: { sc_status_rel: $.data.status } }
          assert:
            - "After cycle 1 COMPLETE: scope.status == AVAILABLE and storage_expires_at == 2026-08-13T08:26:00Z (dried 08-10T08:26 + 72h)"
            - "After cycle 2 COMPLETE: scope.status == AVAILABLE again (loop closed twice) and storage_expires_at == 2026-08-13T10:26:00Z (refreshed from second dried_at) while use_count == 1"
            - "After POSITIVE result: scope.status == QUARANTINED"
            - "Reculture cycle ${cy3}.is_reculture == true; after its COMPLETE the scope.status == QUARANTINED still (reculture completion does not free the scope)"
            - "After release: scope.status == AVAILABLE and the QuarantineCase for ${sc} is RELEASED with released_by == nurse-1"

  - rule_id: transitive_cascade
    instances:
      - name: positive_culture_cascades_to_patient_recall_flags
        grounds:
          - state_machines.Scope.AVAILABLE_to_QUARANTINED
          - state_machines.ScopeCultureTest.PENDING_to_RESULTED
          - state_machines.QuarantineCase
          - calculations.culture_exposure_window
          - entities.ProcedureBooking.fields.notification_flag
        distinguishing_aspect: |
          Depth-4 chain where each link is caused by the previous link's mutation, not the
          original call: POSITIVE result mutates Scope (link 1: -> QUARANTINED); the scope
          transition creates QuarantineCase with a computed exposure window (link 2); case
          creation flags in-window ScopeUsages (link 3); each flagged usage bubbles up to its
          booking's notification_flag (link 4). The sibling cascade is depth 3 from a different
          trigger (booking abort). Window arithmetic is left-exclusive/right-inclusive:
          the usage ending exactly at the last NEGATIVE sample is excluded, the one ending
          exactly at the POSITIVE sample is included.
        test_recipe:
          setup:
            - "Patient P_EXP, provider DRX, COLONO type, room R_EXP, scope SX (COLONOSCOPE)"
            - "Bookings: BU_EDGE scheduled 2026-08-09T08:30 (usage will end exactly at the last negative culture time), BU1 2026-08-10T08:30, BU2 2026-08-12T08:00, BU3 2026-08-14T09:00; all prep-confirmed"
            - "Cycle0 completes 2026-08-09T07:31 (expiry 08-12T07:31); culture C0 NEGATIVE sampled 2026-08-09T08:00"
            - "BU_EDGE completes 08-09T08:00 (== C0.sampled_at, EXCLUDED); cycle_a completes 08-09T08:56; BU1 completes 08-10T09:00 (IN); cycle_b completes 08-10T09:56; BU2 completes 08-12T09:00 (IN); cycle_c completes 08-12T09:56 (expiry 08-15T09:56); BU3 completes 08-14T10:00 (== positive sample time, INCLUDED)"
          setup_api_calls:
            - { call: "POST /endoscopy/patients", payload: { mrn: "M4001", full_name: "Pat Expo", date_of_birth: "1990-05-05" }, as: SchedulingCoordinator, captures: { pe: $.data.id } }
            - { call: "POST /endoscopy/providers", payload: { full_name: "Dr Expo", specialty: "GASTROENTEROLOGY" }, as: UnitAdmin, captures: { drx: $.data.id } }
            - { call: "POST /endoscopy/procedure-types", payload: { code: "COLONO", display_name: "Colonoscopy", base_duration_minutes: 40, prep_protocol: "SPLIT_DOSE", colonoscopy_family: true, adr_relevant: true, required_scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { t_col: $.data.id } }
            - { call: "POST /endoscopy/rooms", payload: { name: "R-EXP", room_class: "STANDARD", supports_anesthesia: true }, as: UnitAdmin, captures: { re: $.data.id } }
            - { call: "POST /endoscopy/scopes", payload: { serial_number: "SX-1", scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { sx: $.data.id } }
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${pe}", provider_id: "${drx}", procedure_type_id: "${t_col}", room_id: "${re}", scheduled_start: "2026-08-09T08:30:00Z", indication: "SCREENING", anesthesia_type: "NONE" }, as: SchedulingCoordinator, captures: { bu_edge: $.data.id } }
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${pe}", provider_id: "${drx}", procedure_type_id: "${t_col}", room_id: "${re}", scheduled_start: "2026-08-10T08:30:00Z", indication: "SCREENING", anesthesia_type: "NONE" }, as: SchedulingCoordinator, captures: { bu1: $.data.id } }
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${pe}", provider_id: "${drx}", procedure_type_id: "${t_col}", room_id: "${re}", scheduled_start: "2026-08-12T08:00:00Z", indication: "SURVEILLANCE", anesthesia_type: "NONE" }, as: SchedulingCoordinator, captures: { bu2: $.data.id } }
