scaffold_difficulty_design:
  # ==========================================================================
  # Rule 1: Dual-variant calculations across different entity domains
  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: attendance_rate_provisional_vs_final_on_session
        grounds:
          - calculations.session_attendance_rate
          - entities.Session.fields.status
          - entities.AttendanceRecord.fields.status
        distinguishing_aspect: |
          Domain: Session attendance metric. The provisional variant counts
          CHECKED_IN + ATTENDED; the final variant counts only ATTENDED. Same
          input records produce different rates because the provisional variant
          includes records that have not yet checked out.
        test_recipe:
          setup:
            - "Program P1 with posture=OPEN"
            - "PeerGroup G1 under P1, modality=IN_PERSON, base_capacity=5, status=ACTIVE"
            - "Room R1 physical_capacity=10, status=AVAILABLE"
            - "Facilitator F1 status=CERTIFIED, level=3, supervision_required=false"
            - "Participant A and Participant B both ACTIVE with SIGNED agreements"
            - "Two Enrollments on G1 (A and B), both seat_status=CONFIRMED"
            - "Session S1 on G1 from 2026-08-02T10:00:00Z to 2026-08-02T11:00:00Z, status=IN_PROGRESS"
            - "Both A and B have CHECKED_IN attendance records on S1"
            - "A has checked out (ATTENDED); B has not (still CHECKED_IN)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "P1", focus_area: "GRIEF" }
              as: ProgramAdmin
              captures: { pid: $.data.id }
            - call: "POST /rooms"
              payload: { name: "R1", physical_capacity: 10 }
              as: ProgramAdmin
              captures: { rid: $.data.id }
            - call: "POST /programs/${pid}/groups"
              payload: { name: "G1", modality: "IN_PERSON", base_capacity: 5, required_facilitator_level: 2 }
              as: ProgramAdmin
              captures: { gid: $.data.id }
            - call: "POST /programs/${pid}/groups/${gid}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /facilitators"
              payload: { full_name: "F One", email: "f1@x.com" }
              as: ProgramAdmin
              captures: { fid: $.data.id }
            - call: "POST /training-courses"
              payload: { code: "T101", title: "Intro", credit_hours: 4, level_weight: 2 }
              as: ProgramAdmin
              captures: { tcid: $.data.id }
            - call: "POST /facilitators/${fid}/advance-to-screening"
              payload: {}
              as: ProgramAdmin
            - call: "POST /facilitators/${fid}/advance-to-training"
              payload: {}
              as: ProgramAdmin
            - call: "POST /facilitators/${fid}/training-completions"
              payload: { course_id: "${tcid}", completed_at: "2026-07-15T00:00:00Z", score: 90 }
              as: ProgramAdmin
            - call: "POST /facilitators/${fid}/advance-to-practice"
              payload: {}
              as: ProgramAdmin
            - call: "POST /facilitators"
              payload: { full_name: "Rev One", email: "rev1@x.com" }
              as: ProgramAdmin
              captures: { reviewer_id: $.data.id }
            - call: "POST /facilitators/${reviewer_id}/advance-to-screening"
              payload: {}
              as: ProgramAdmin
            - call: "POST /facilitators/${reviewer_id}/advance-to-training"
              payload: {}
              as: ProgramAdmin
            - call: "POST /training-courses"
              payload: { code: "T901", title: "Advanced", credit_hours: 6, level_weight: 3 }
              as: ProgramAdmin
              captures: { tcid_adv: $.data.id }
            - call: "POST /facilitators/${reviewer_id}/training-completions"
              payload: { course_id: "${tcid_adv}", completed_at: "2026-07-01T00:00:00Z", score: 95 }
              as: ProgramAdmin
            - call: "POST /facilitators/${reviewer_id}/training-completions"
              payload: { course_id: "${tcid}", completed_at: "2026-07-02T00:00:00Z", score: 90 }
              as: ProgramAdmin
            - call: "POST /facilitators/${reviewer_id}/advance-to-practice"
              payload: {}
              as: ProgramAdmin
            - call: "POST /facilitators/${reviewer_id}/certify"
              payload: {}
              as: ProgramAdmin
            - call: "POST /facilitators/${fid}/supervision-reviews"
              payload: { reviewer_id: "${reviewer_id}", occurred_at: "2026-07-20T00:00:00Z", rating: 4 }
              as: ProgramAdmin
            - call: "POST /facilitators/${fid}/certify"
              payload: {}
              as: ProgramAdmin
            - call: "POST /participants"
              payload: { full_name: "P A", email: "pa@x.com", household_size: 1 }
              as: ProgramAdmin
              captures: { pa_id: $.data.id }
            - call: "POST /participants"
              payload: { full_name: "P B", email: "pb@x.com", household_size: 1 }
              as: ProgramAdmin
              captures: { pb_id: $.data.id }
            - call: "POST /participants/${pa_id}/agreements"
              payload: { signed_at: "2026-07-25T00:00:00Z", expires_at: "2027-07-25T00:00:00Z", agreement_version: 1 }
              as: ProgramAdmin
            - call: "POST /participants/${pb_id}/agreements"
              payload: { signed_at: "2026-07-25T00:00:00Z", expires_at: "2027-07-25T00:00:00Z", agreement_version: 1 }
              as: ProgramAdmin
            - call: "POST /participants/${pa_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /participants/${pb_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${pid}/groups/${gid}/enrollments"
              payload: { participant_id: "${pa_id}" }
              as: ProgramAdmin
              captures: { eid_a: $.data.id, gv_a: $.data.version }
            - call: "POST /programs/${pid}/groups/${gid}/enrollments"
              payload: { participant_id: "${pb_id}" }
              as: ProgramAdmin
              captures: { eid_b: $.data.id }
            - call: "GET /programs/${pid}/groups/${gid}"
              payload: {}
              as: ProgramAdmin
              captures: { gv_pre_a: $.data.version }
            - call: "POST /programs/${pid}/groups/${gid}/enrollments/${eid_a}/confirm"
              payload: { expected_group_version: "${gv_pre_a}" }
              as: ProgramAdmin
            - call: "GET /programs/${pid}/groups/${gid}"
              payload: {}
              as: ProgramAdmin
              captures: { gv_pre_b: $.data.version }
            - call: "POST /programs/${pid}/groups/${gid}/enrollments/${eid_b}/confirm"
              payload: { expected_group_version: "${gv_pre_b}" }
              as: ProgramAdmin
            - call: "POST /programs/${pid}/groups/${gid}/sessions"
              payload: { start_at: "2026-08-02T10:00:00Z", end_at: "2026-08-02T11:00:00Z", primary_facilitator_id: "${fid}", room_id: "${rid}" }
              as: ProgramAdmin
              captures: { sid: $.data.id }
            - call: "GET /facilitators/${fid}"
              payload: {}
              as: ProgramAdmin
              captures: { fv_pre: $.data.version }
            - call: "POST /programs/${pid}/groups/${gid}/sessions/${sid}/schedule"
              payload: { expected_facilitator_version: "${fv_pre}" }
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T10:05:00Z" }
              as: ProgramAdmin
            - call: "POST /programs/${pid}/groups/${gid}/sessions/${sid}/attendance"
              payload: { participant_id: "${pa_id}", access_modality: "IN_PERSON" }
              as: Facilitator
              as_user_id: "${fid}"
              captures: { aid_a: $.data.id }
            - call: "POST /programs/${pid}/groups/${gid}/sessions/${sid}/attendance"
              payload: { participant_id: "${pb_id}", access_modality: "IN_PERSON" }
              as: Facilitator
              as_user_id: "${fid}"
              captures: { aid_b: $.data.id }
            - call: "POST /programs/${pid}/groups/${gid}/sessions/${sid}/attendance/${aid_a}/checkout"
              payload: {}
              as: Facilitator
              as_user_id: "${fid}"
          trigger:
            - call: "GET /programs/${pid}/groups/${gid}/sessions/${sid}/summary"
              payload: {}
              as: ProgramAdmin
              captures: { prov_rate: $.data.attendance_rate_provisional, final_rate: $.data.attendance_rate_final }
          assert:
            - "Session.${sid}.status == IN_PROGRESS (still in progress at summary call)"
            - "provisional rate uses {CHECKED_IN, ATTENDED} / CONFIRMED = 2/2 = 1.0000"
            - "final rate uses {ATTENDED} / CONFIRMED = 1/2 = 0.5000"
            - "Session summary attendance_rate_provisional == 1.0000"
            - "Session summary attendance_rate_final == 0.5000"
            - "attendance_rate_provisional != attendance_rate_final"

      - name: facilitator_capacity_score_conservative_vs_accelerated
        grounds:
          - calculations.facilitator_capacity_score
          - entities.Facilitator.fields.level
        distinguishing_aspect: |
          Domain: Facilitator scoring metric. Conservative weights supervision 0.5,
          training 0.3, sessions 0.2; accelerated weights training 0.5, supervision 0.2,
          sessions 0.3. On identical inputs (training_hours=10, supervision_count=1,
          sessions_led=2), conservative = 0.5*1+0.3*10+0.2*2 = 3.90 while accelerated =
          0.2*1+0.5*10+0.3*2 = 5.80 — different numbers, different domain from Session.
        test_recipe:
          setup:
            - "Facilitator F1 with: 1 passing TrainingCompletion on a 4-credit-hour course (level_weight=2), 1 passing TrainingCompletion on a 6-credit-hour course (level_weight=3), so training_hours=10"
            - "1 SupervisionReview with rating>=3"
            - "2 Sessions where F1 was primary_facilitator and status=COMPLETED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /facilitators"
              payload: { full_name: "F Cap", email: "fcap@x.com" }
              as: ProgramAdmin
              captures: { fid: $.data.id }
            - call: "POST /training-courses"
              payload: { code: "C4", title: "4h", credit_hours: 4, level_weight: 2 }
              as: ProgramAdmin
              captures: { tc4: $.data.id }
            - call: "POST /training-courses"
              payload: { code: "C6", title: "6h", credit_hours: 6, level_weight: 3 }
              as: ProgramAdmin
              captures: { tc6: $.data.id }
            - call: "POST /facilitators/${fid}/advance-to-screening"
              payload: {}
              as: ProgramAdmin
            - call: "POST /facilitators/${fid}/advance-to-training"
              payload: {}
              as: ProgramAdmin
            - call: "POST /facilitators/${fid}/training-completions"
              payload: { course_id: "${tc4}", completed_at: "2026-07-01T00:00:00Z", score: 85 }
              as: ProgramAdmin
            - call: "POST /facilitators/${fid}/training-completions"
              payload: { course_id: "${tc6}", completed_at: "2026-07-05T00:00:00Z", score: 90 }
              as: ProgramAdmin
            - call: "POST /facilitators/${fid}/advance-to-practice"
              payload: {}
              as: ProgramAdmin
            # Reviewer with level>=4: 2 training completions with weight 3+2 = 5+1 = level 5, plus rating-4 supervisions
            - call: "POST /facilitators"
              payload: { full_name: "Rev", email: "rev@x.com" }
              as: ProgramAdmin
              captures: { rid: $.data.id }
            - call: "POST /facilitators/${rid}/advance-to-screening"
              payload: {}
              as: ProgramAdmin
            - call: "POST /facilitators/${rid}/advance-to-training"
              payload: {}
              as: ProgramAdmin
            - call: "POST /facilitators/${rid}/training-completions"
              payload: { course_id: "${tc4}", completed_at: "2026-07-01T00:00:00Z", score: 95 }
              as: ProgramAdmin
            - call: "POST /facilitators/${rid}/training-completions"
              payload: { course_id: "${tc6}", completed_at: "2026-07-01T00:00:00Z", score: 95 }
              as: ProgramAdmin
            - call: "POST /facilitators/${rid}/advance-to-practice"
              payload: {}
              as: ProgramAdmin
            - call: "POST /facilitators/${rid}/certify"
              payload: {}
              as: ProgramAdmin
            - call: "POST /facilitators/${fid}/supervision-reviews"
              payload: { reviewer_id: "${rid}", occurred_at: "2026-07-20T00:00:00Z", rating: 4 }
              as: ProgramAdmin
            - call: "POST /facilitators/${fid}/certify"
              payload: {}
              as: ProgramAdmin
            # Build a program/group/room for the 2 sessions F1 leads to COMPLETED
            - call: "POST /programs"
              payload: { name: "PX", focus_area: "ANXIETY" }
              as: ProgramAdmin
              captures: { pid: $.data.id }
            - call: "POST /rooms"
              payload: { name: "Rm", physical_capacity: 10 }
              as: ProgramAdmin
              captures: { rmid: $.data.id }
            - call: "POST /programs/${pid}/groups"
              payload: { name: "GX", modality: "IN_PERSON", base_capacity: 5, required_facilitator_level: 1 }
              as: ProgramAdmin
              captures: { gid: $.data.id }
            - call: "POST /programs/${pid}/groups/${gid}/activate"
              payload: {}
              as: ProgramAdmin
            # Session 1
            - call: "POST /programs/${pid}/groups/${gid}/sessions"
              payload: { start_at: "2026-08-02T08:00:00Z", end_at: "2026-08-02T09:00:00Z", primary_facilitator_id: "${fid}", room_id: "${rmid}" }
              as: ProgramAdmin
              captures: { s1: $.data.id }
            - call: "GET /facilitators/${fid}"
              payload: {}
              as: ProgramAdmin
              captures: { fv1: $.data.version }
            - call: "POST /programs/${pid}/groups/${gid}/sessions/${s1}/schedule"
              payload: { expected_facilitator_version: "${fv1}" }
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T09:30:00Z" }
              as: ProgramAdmin
            - call: "POST /programs/${pid}/groups/${gid}/sessions/${s1}/complete"
              payload: {}
              as: Facilitator
              as_user_id: "${fid}"
            # Session 2
            - call: "POST /programs/${pid}/groups/${gid}/sessions"
              payload: { start_at: "2026-08-02T10:00:00Z", end_at: "2026-08-02T11:00:00Z", primary_facilitator_id: "${fid}", room_id: "${rmid}" }
              as: ProgramAdmin
              captures: { s2: $.data.id }
            - call: "GET /facilitators/${fid}"
              payload: {}
              as: ProgramAdmin
              captures: { fv2: $.data.version }
            - call: "POST /programs/${pid}/groups/${gid}/sessions/${s2}/schedule"
              payload: { expected_facilitator_version: "${fv2}" }
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T11:30:00Z" }
              as: ProgramAdmin
            - call: "POST /programs/${pid}/groups/${gid}/sessions/${s2}/complete"
              payload: {}
              as: Facilitator
              as_user_id: "${fid}"
          trigger:
            - call: "GET /facilitators/${fid}/capacity-score"
              payload: {}
              as: ProgramAdmin
              captures: { cons: $.data.conservative, accel: $.data.accelerated, sess_led: $.data.sessions_led }
          assert:
            - "training_hours = 4 + 6 = 10"
            - "supervision_count = 1"
            - "sessions_led = 2"
            - "conservative = round_half_up(0.5*1 + 0.3*10 + 0.2*2, 2) = round_half_up(0.5 + 3.0 + 0.4, 2) = 3.90"
            - "accelerated  = round_half_up(0.2*1 + 0.5*10 + 0.3*2, 2) = round_half_up(0.2 + 5.0 + 0.6, 2) = 5.80"
            - "cons != accel"
            - "sess_led == 2"

  # ==========================================================================
  # Rule 2: Combinatorial formulas across different modes
  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: session_capacity_formula_mode_a_hybrid_split
        grounds:
          - calculations.session_capacity_formula
          - entities.PeerGroup.fields.modality
          - entities.Session.fields.effective_capacity
        distinguishing_aspect: |
          Mode (a) — nested min with state-conditional branch on modality.
          HYBRID: in_person_seats = min(Room.physical_capacity, ceil(base*0.5));
          virtual_seats = base - in_person_seats; effective = sum. For
          base_capacity=7 and physical_capacity=2: in_person_seats = min(2, ceil(3.5))=min(2,4)=2;
          virtual_seats = 7-2 = 5; effective_capacity = 7. For VIRTUAL modality:
          effective = base_capacity directly.
        test_recipe:
          setup:
            - "Program P with posture=OPEN"
            - "PeerGroup HYBRID with base_capacity=7, Room with physical_capacity=2"
            - "PeerGroup VIRTUAL with base_capacity=7"
            - "Facilitator F CERTIFIED, level=3, supervision_required=false"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "P", focus_area: "GRIEF" }
              as: ProgramAdmin
              captures: { pid: $.data.id }
            - call: "POST /rooms"
              payload: { name: "SmallRoom", physical_capacity: 2 }
              as: ProgramAdmin
              captures: { rid: $.data.id }
            - call: "POST /programs/${pid}/groups"
              payload: { name: "GH", modality: "HYBRID", base_capacity: 7, required_facilitator_level: 1 }
              as: ProgramAdmin
              captures: { gid_h: $.data.id }
            - call: "POST /programs/${pid}/groups"
              payload: { name: "GV", modality: "VIRTUAL", base_capacity: 7, required_facilitator_level: 1 }
              as: ProgramAdmin
              captures: { gid_v: $.data.id }
            - call: "POST /programs/${pid}/groups/${gid_h}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${pid}/groups/${gid_v}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /facilitators"
              payload: { full_name: "FM", email: "fm@x.com" }
              as: ProgramAdmin
              captures: { fid: $.data.id }
            - call: "POST /training-courses"
              payload: { code: "TC", title: "T", credit_hours: 4, level_weight: 2 }
              as: ProgramAdmin
              captures: { tcid: $.data.id }
            - call: "POST /facilitators/${fid}/advance-to-screening"
              payload: {}
              as: ProgramAdmin
            - call: "POST /facilitators/${fid}/advance-to-training"
              payload: {}
              as: ProgramAdmin
            - call: "POST /facilitators/${fid}/training-completions"
              payload: { course_id: "${tcid}", completed_at: "2026-07-01T00:00:00Z", score: 90 }
              as: ProgramAdmin
            - call: "POST /facilitators/${fid}/advance-to-practice"
              payload: {}
              as: ProgramAdmin
            - call: "POST /facilitators"
              payload: { full_name: "Rev2", email: "rev2@x.com" }
              as: ProgramAdmin
              captures: { rid2: $.data.id }
            - call: "POST /facilitators/${rid2}/advance-to-screening"
              payload: {}
              as: ProgramAdmin
            - call: "POST /facilitators/${rid2}/advance-to-training"
              payload: {}
              as: ProgramAdmin
            - call: "POST /training-courses"
              payload: { code: "TCX", title: "TX", credit_hours: 6, level_weight: 3 }
              as: ProgramAdmin
              captures: { tcidx: $.data.id }
            - call: "POST /facilitators/${rid2}/training-completions"
              payload: { course_id: "${tcid}", completed_at: "2026-07-01T00:00:00Z", score: 95 }
              as: ProgramAdmin
            - call: "POST /facilitators/${rid2}/training-completions"
              payload: { course_id: "${tcidx}", completed_at: "2026-07-01T00:00:00Z", score: 95 }
              as: ProgramAdmin
            - call: "POST /facilitators/${rid2}/advance-to-practice"
              payload: {}
              as: ProgramAdmin
            - call: "POST /facilitators/${rid2}/certify"
              payload: {}
              as: ProgramAdmin
            - call: "POST /facilitators/${fid}/supervision-reviews"
              payload: { reviewer_id: "${rid2}", occurred_at: "2026-07-20T00:00:00Z", rating: 4 }
              as: ProgramAdmin
            - call: "POST /facilitators/${fid}/certify"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /programs/${pid}/groups/${gid_h}/sessions"
              payload: { start_at: "2026-08-03T10:00:00Z", end_at: "2026-08-03T11:00:00Z", primary_facilitator_id: "${fid}", room_id: "${rid}" }
              as: ProgramAdmin
              captures: { sid_h: $.data.id, ec_h: $.data.effective_capacity }
            - call: "POST /programs/${pid}/groups/${gid_v}/sessions"
              payload: { start_at: "2026-08-04T10:00:00Z", end_at: "2026-08-04T11:00:00Z", primary_facilitator_id: "${fid}" }
              as: ProgramAdmin
              captures: { sid_v: $.data.id, ec_v: $.data.effective_capacity }
          assert:
            - "HYBRID: in_person_seats = min(2, ceil(7*0.5)) = min(2, 4) = 2"
            - "HYBRID: virtual_seats = 7 - 2 = 5"
            - "HYBRID: effective_capacity = 2 + 5 = 7"
            - "VIRTUAL: effective_capacity = 7"
            - "Session.${sid_h}.effective_capacity == 7"
            - "Session.${sid_v}.effective_capacity == 7"

      - name: training_stipend_mode_b_round_per_course_then_sum
        grounds:
          - calculations.training_stipend_award
        distinguishing_aspect: |
          Mode (b) — nested rounding order pinned: round each course stipend to
          cents FIRST then sum. Three courses each with credit_hours=1,
          level_weight=2: per-course = round_half_up(1*18.50*1.25, 2) = round_half_up(23.125, 2) = 23.13;
          total = 3 * 23.13 = 69.39. Counterfactual sum-then-round would be
          round_half_up(3*23.125, 2) = round_half_up(69.375, 2) = 69.38 — DIFFERENT by 0.01.
        test_recipe:
          setup:
            - "Facilitator F with 3 passing TrainingCompletions on three separate courses, each credit_hours=1, level_weight=2"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /facilitators"
              payload: { full_name: "FS", email: "fs@x.com" }
              as: ProgramAdmin
              captures: { fid: $.data.id }
            - call: "POST /training-courses"
              payload: { code: "A1", title: "A1", credit_hours: 1, level_weight: 2 }
              as: ProgramAdmin
              captures: { c1: $.data.id }
            - call: "POST /training-courses"
              payload: { code: "A2", title: "A2", credit_hours: 1, level_weight: 2 }
              as: ProgramAdmin
              captures: { c2: $.data.id }
            - call: "POST /training-courses"
              payload: { code: "A3", title: "A3", credit_hours: 1, level_weight: 2 }
              as: ProgramAdmin
              captures: { c3: $.data.id }
            - call: "POST /facilitators/${fid}/advance-to-screening"
              payload: {}
              as: ProgramAdmin
            - call: "POST /facilitators/${fid}/advance-to-training"
              payload: {}
              as: ProgramAdmin
            - call: "POST /facilitators/${fid}/training-completions"
              payload: { course_id: "${c1}", completed_at: "2026-07-01T00:00:00Z", score: 90 }
              as: ProgramAdmin
            - call: "POST /facilitators/${fid}/training-completions"
              payload: { course_id: "${c2}", completed_at: "2026-07-02T00:00:00Z", score: 90 }
              as: ProgramAdmin
            - call: "POST /facilitators/${fid}/training-completions"
              payload: { course_id: "${c3}", completed_at: "2026-07-03T00:00:00Z", score: 90 }
              as: ProgramAdmin
          trigger:
            - call: "GET /facilitators/${fid}/capacity-score"
              payload: {}
              as: ProgramAdmin
          assert:
            - "Per-course stipend = round_half_up(1 * 18.50 * (1.0 + 0.25*(2-1)), 2) = round_half_up(23.125, 2) = 23.13"
            - "Total = 3 * 23.13 = 69.39 (round-per-course-then-sum)"
            - "Sum-then-round would yield round_half_up(69.375, 2) = 69.38"
            - "The two methods produce DIFFERENT results (69.39 vs 69.38) — pinned order matters"
            - "Facilitator has 3 passing completions on ACTIVE courses"

