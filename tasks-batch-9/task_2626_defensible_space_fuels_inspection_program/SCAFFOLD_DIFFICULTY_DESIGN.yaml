            - "Sending estimated_cost_cents 750000 (exactly ABATEMENT_CAP_CENTS, inclusive) against the OVERDUE notice succeeds and creates an AUTHORIZED AbatementOrder"

      - name: inspector_not_certified_outranks_window_conflict_rejected
        priority_pair: [50, 62]
        grounds:
          - validations.priority_50
          - validations.priority_62
          - errors.ERR_INSPECTOR_NOT_CERTIFIED
          - errors.ERR_INSPECTOR_WINDOW_CONFLICT
          - entities.Inspector.fields.certification_level
          - endpoints."POST /fire-district/inspections"
        distinguishing_aspect: |
          Pairs business_safety (priority 50, ERR_INSPECTOR_NOT_CERTIFIED, 422) against
          business_temporal (priority 62, ERR_INSPECTOR_WINDOW_CONFLICT, 409) with the status
          ordering INVERTED relative to the sibling instance: here the winning error carries
          the LARGER http status, so an implementation that sorts candidate errors by status
          code, or that returns the first conflict it happens to detect while walking existing
          rows, produces 409 instead of 422. The gap is only 12 priorities and both rules read
          the same request field set.
        test_recipe:
