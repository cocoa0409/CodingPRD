  # =========================================================================
  - section: rbac
    instances:

      - name: request_without_identity_headers_returns_unauthenticated
        claim_type: Violation to Error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Authentication is priority 1: a hull registration sent with neither X-User-Role nor X-User-ID returns ERR_UNAUTHENTICATED and HTTP 401 before any body validation runs, even though the body is perfectly well formed."
        test_recipe:
          setup: ["Empty database. The trigger call is issued with BOTH identity headers omitted."]
          setup_api_calls: []
          trigger:
            - call: "POST /barges"
              payload: { hull_number: "BL-F001", capacity_tons: 1750, light_draft_feet: 1.5, tons_per_inch_immersion: 17.0 }
              as: WaterwayAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_UNAUTHENTICATED with HTTP 401"
            - "GET /barges issued with valid headers returns total_count 0"

      - name: harbor_agent_cannot_seal_a_tow
        claim_type: Role denial
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN_ROLE]", "roles.HarborAgent"]
        distinguishing_aspect: "Sealing is an exclusive TowboatDispatcher operation; a HarborAgent attempt returns ERR_FORBIDDEN_ROLE and HTTP 403 at priority 2, before the empty-tow state check at priority 9 could fire."
        test_recipe:
          setup: ["One BUILDING tow with zero barges."]
          setup_api_calls:
            - call: "POST /tows"
              payload: { towboat_name: "M/V Quebec", horsepower: 4000, origin_mile: 600, destination_mile: 200, controlling_gauge_station: "MEMPHIS" }
              as: TowboatDispatcher
              captures: { tow_id: $.data.id }
          trigger:
            - call: "POST /tows/${tow_id}/seal"
              payload: {}
              as: HarborAgent
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_FORBIDDEN_ROLE with HTTP 403"
            - "${err} != ERR_TOW_INVALID_STATE even though the tow has no barges"
            - "Tow.${tow_id}.status == BUILDING and version == 1"

      - name: claims_adjuster_cannot_issue_a_freight_invoice
        claim_type: Role denial
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN_ROLE]", "roles.ContractManager"]
        distinguishing_aspect: "Invoicing is exclusive to ContractManager under the peer-role split; a ClaimsAdjuster attempt returns ERR_FORBIDDEN_ROLE at priority 2, before the movement-state and billable-line checks."
        test_recipe:
          setup: ["One shipper, one commodity and one DRAFT contract."]
          setup_api_calls:
            - call: "POST /commodities"
              payload: { code: "CORN", commodity_group: "GRAIN", residue_class: "CLEAN", hazard_flag: false, stowage_factor: 1.28 }
              as: WaterwayAdmin
              captures: { corn_id: $.data.id }
            - call: "POST /shippers"
              payload: { name: "Delta Grain Co", credit_limit_cents: 900000000 }
              as: ContractManager
              captures: { sh_id: $.data.id }
            - call: "POST /freight-contracts"
              payload: { shipper_id: "${sh_id}", commodity_id: "${corn_id}", contracted_tons: 1700, origin_mile: 600, destination_mile: 200, laytime_hours: 12, declared_value_cents_per_ton: 22000 }
              as: ContractManager
              captures: { fc_id: $.data.id }
            - call: "GET /shippers/${sh_id}"
              payload: {}
              as: ContractManager
              captures: { sh_v: $.data.version }
          trigger:
            - call: "POST /freight-contracts/${fc_id}/issue-invoice"
              payload: { expected_shipper_version: "${sh_v}" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_FORBIDDEN_ROLE with HTTP 403"
            - "FreightContract.${fc_id}.billing_status == NOT_BILLED and movement_status == DRAFT"
            - "Shipper.${sh_id}.outstanding_balance_cents == 0"

      - name: lock_master_cannot_grant_a_slot_at_another_chamber
        claim_type: Ownership denial
        grounds: ["validations[priority=7]", "errors[ERR_NOT_RESOURCE_OWNER]", "roles.LockMaster"]
        distinguishing_aspect: "LockMaster is entity_backed:Lock, so X-User-ID must equal the reservation's lock_id; a lockmaster acting with the second chamber's id on the first chamber's slot returns ERR_NOT_RESOURCE_OWNER and HTTP 403."
        test_recipe:
          setup: ["Two locks; one empty tow holding a REQUESTED slot at the first lock."]
          setup_api_calls:
            - call: "POST /locks"
              payload: { lock_name: "Chain of Rocks", river_mile: 185.0, chamber_capacity_barges: 9, cycle_minutes: 45, turnback_buffer_minutes: 30 }
              as: WaterwayAdmin
              captures: { lock1_id: $.data.id }
            - call: "POST /locks"
              payload: { lock_name: "Mel Price", river_mile: 200.8, chamber_capacity_barges: 9, cycle_minutes: 60, turnback_buffer_minutes: 20 }
              as: WaterwayAdmin
              captures: { lock2_id: $.data.id }
            - call: "POST /tows"
              payload: { towboat_name: "M/V Romeo", horsepower: 4000, origin_mile: 600, destination_mile: 200, controlling_gauge_station: "MEMPHIS" }
              as: TowboatDispatcher
              captures: { tow_id: $.data.id, tow_v: $.data.version }
            - call: "POST /lock-reservations"
              payload: { lock_id: "${lock1_id}", tow_id: "${tow_id}", requested_start_at: "2026-08-15T08:00:00Z", expected_tow_version: "${tow_v}" }
              as: TowboatDispatcher
              captures: { lr_id: $.data.id }
          trigger:
            - call: "POST /lock-reservations/${lr_id}/grant"
              payload: {}
              as: LockMaster
              as_user_id: "${lock2_id}"
              captures: { err: $.data.error_id }
            - call: "POST /lock-reservations/${lr_id}/grant"
              payload: {}
              as: LockMaster
              as_user_id: "${lock1_id}"
          assert:
            - "${err} == ERR_NOT_RESOURCE_OWNER with HTTP 403"
            - "after the refused call LockReservation.${lr_id}.status == REQUESTED and Lock.${lock1_id}.granted_reservation_count == 0"
            - "the correctly-owned grant returns HTTP 200 with status GRANTED and Lock.${lock1_id}.granted_reservation_count == 1"

      - name: tariff_filer_cannot_effectuate_the_filing_it_filed
        claim_type: Segregation of duties
        grounds: ["validations[priority=8]", "errors[ERR_SEGREGATION_OF_DUTIES]", "state_machines.TariffFiling.FILED_to_EFFECTIVE"]
        distinguishing_aspect: "The effectuation guard compares X-User-ID to filed_by_user_id: the same operator u-1 acting under the RateAuthority role is refused with ERR_SEGREGATION_OF_DUTIES and HTTP 403, while a different operator u-2 succeeds on the identical call."
        test_recipe:
          setup: ["One GRAIN filing filed by operator u-1."]
          setup_api_calls:
            - call: "POST /tariff-filings"
              payload: { tariff_code: "T-GRAIN-SOD", commodity_group: "GRAIN", base_rate_cents_per_ton_mile: 1.2378, min_charge_cents: 250000, demurrage_rate_cents_per_hour: 32500, fuel_surcharge_table: [{ threshold_cents_per_gallon: 200, pct: 0.0 }], effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }
              as: TariffAnalyst
              as_user_id: "u-1"
              captures: { tf_id: $.data.id }
            - call: "POST /tariff-filings/${tf_id}/file"
              payload: {}
              as: TariffAnalyst
              as_user_id: "u-1"
          trigger:
            - call: "POST /tariff-filings/${tf_id}/effectuate"
              payload: {}
              as: RateAuthority
              as_user_id: "u-1"
              captures: { err: $.data.error_id }
            - call: "POST /tariff-filings/${tf_id}/effectuate"
              payload: {}
              as: RateAuthority
              as_user_id: "u-2"
          assert:
            - "${err} == ERR_SEGREGATION_OF_DUTIES with HTTP 403"
            - "after the refusal TariffFiling.${tf_id}.status == FILED and effectuated_by_user_id == null"
            - "the u-2 call returns HTTP 200 with status EFFECTIVE and effectuated_by_user_id == \"u-2\""
            - "TariffFiling.${tf_id}.filed_by_user_id == \"u-1\""

      - name: claim_assessor_cannot_approve_or_deny_its_own_assessment
        claim_type: Segregation of duties
        grounds: ["validations[priority=8]", "errors[ERR_SEGREGATION_OF_DUTIES]", "state_machines.CargoClaim.ASSESSED_to_DENIED"]
        distinguishing_aspect: "The same guard applies on the claims side and to BOTH outcomes: adjuster adj-1, who wrote the assessment, is refused with ERR_SEGREGATION_OF_DUTIES on approve and on deny, while adj-2 may deny the claim and leave the contract's billing untouched."
