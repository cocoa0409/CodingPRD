            - call: "GET /taxpayer-accounts/${t_id}"
              payload: {}
              as: ExemptionsReviewer
              as_user_id: "reviewer-02"
              captures: { net_relief: $.data.net_relief_cents }
          assert:
            - "${st_now} == APPROVED and ${g1_id} is a non-null grant id present in the determine response body itself"
            - "the list response reports total_count == 1 with ${first_grant_id} == ${g1_id} and ${first_applied} == 8400000 on the very next request — no re-read or delay was needed"
            - "${p_ver} == 2, ${p_exempt} == 8400000, ${p_taxable} == 25200000 and ${p_status} == PARTIALLY_EXEMPT"
            - "${p_exempt} + ${p_taxable} == 33600000 == assessed_value_cents, the decomposition invariant, already true in the same read"
            - "${net_relief} == 0 (lifetime_refund_cents 0 minus lifetime_recovery_collected_cents 0) — derived fields are recomputed synchronously, never lagged"
