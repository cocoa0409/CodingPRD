      - name: stacking_single_pass_order_recomputes_federal_credit_exactly_once
        grounds:
          - calculations.benefit_stacking_limit
          - entities.StackingDeclaration.fields.allowed_state_incentive_cents
          - entities.StackingDeclaration.fields.allowed_federal_credit_cents
          - entities.StackingDeclaration.fields.residual_overage_cents
          - entities.RebateProject.fields.stacking_adjusted_state_incentive_cents
          - endpoints.POST_/rebate-projects/{id}/stacking-declarations
        distinguishing_aspect: |
          Mode (c): a pinned EVALUATION ORDER executed exactly once, not a
          min() chain and not a proration. The federal credit is computed from
          the pre-trim state incentive, the combined-benefit limit trims the
          state incentive, and then the federal credit is recomputed ONE time
          from the trimmed figure — which makes it grow from 60000 to 78000
          and leaves a deliberate 18000 residual_overage_cents that the
          scaffold does NOT iterate away. An implementation that loops to a
          fixed point, or that never recomputes F, produces a different
          triple.
        test_recipe:
          setup:
            - "An OPEN program with federal_credit_pct 0.30, federal_credit_cap_cents 1000000 (high enough that the cap never binds) and max_combined_benefit_pct 0.80."
            - "Catalog: HP-HVAC-01 unit 800000 / measure_cap 700000 / HVAC_GROUP / sort 10 / 200 A / anchor, so the single line resolves to exactly 700000."
            - "A LOW-tier household (80.0% AMI, cost share 1.00, cap 1400000) so neither the group cap nor the household cap binds."
            - "A DRAFT project with estimated_project_cost_cents 1000000 and provisional_total_incentive_cents 700000; actual_project_cost_cents is still null, so the stacking basis cost is the estimate."
            - "No prior StackingDeclaration exists on the project."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HEEHRA 2026 Mode C", state_code: "CO", budget_total_cents: 50000000, low_tier_cap_cents: 1400000, low_tier_cost_share_pct: 1.00, group_cap_cents: 800000, federal_credit_pct: 0.30, federal_credit_cap_cents: 1000000, max_combined_benefit_pct: 0.80 }
