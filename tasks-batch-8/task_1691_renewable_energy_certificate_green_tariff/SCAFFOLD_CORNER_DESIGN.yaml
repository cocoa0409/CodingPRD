  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_subscription_create_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[subscription-create-stale-program]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Two strictly sequential subscription creates carrying the same observed Program.version: the first succeeds (bumping the version), the second is rejected ERR_STALE_VERSION 412 — stale-capacity views never oversubscribe."
        test_recipe:
          setup: ["Program OPEN, version observed at 3"]
          setup_api_calls:
            - call: "POST /greenpower/programs"
              payload: { name: "SunTariff", market_class: "VOLUNTARY", eligible_region_codes: ["CAISO"], eligible_technologies: ["SOLAR"], capacity_cap_kw: 1000, rate_tiers: [{up_to_kwh: 500, rate_cents_per_kwh: 5}], annual_claim_cap_mwh: 10000 }
              as: RegistryAdmin
              captures: { p: $.data.id, pv: $.data.version }
            - call: "POST /greenpower/accounts"
              payload: { account_type: "PROGRAM", owner_name: "SunTariff Holding", program_id: "${p}" }
              as: RegistryAdmin
              captures: { pacc: $.data.id }
            - call: "PATCH /greenpower/programs/${p}"
              payload: { expected_program_version: "${pv}", holding_account_id: "${pacc}" }
              as: RegistryAdmin
              captures: { pv2: $.data.version }
            - call: "POST /greenpower/programs/${p}/open"
              payload: {}
              as: RegistryAdmin
              captures: { pv3: $.data.version }
          trigger:
            - call: "POST /greenpower/subscriptions"
              payload: { program_id: "${p}", customer_name: "Customer A", utility_account_no: "U-A", allocation_kw: 100, estimated_usage_kwh: 900, expected_program_version: "${pv3}" }
              as: ProgramManager
              captures: { s1: $.data.id }
            - call: "POST /greenpower/subscriptions"
              payload: { program_id: "${p}", customer_name: "Customer B", utility_account_no: "U-B", allocation_kw: 100, estimated_usage_kwh: 900, expected_program_version: "${pv3}" }
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "first create succeeds: Subscription.${s1} PENDING, Program.${p}.version advanced to ${pv3} + 1"
            - "second create with the same expected_program_version: error_id == ERR_STALE_VERSION, HTTP 412"

      - name: occ_generator_patch_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[generator-config-stale-generator]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Sequential PATCHes on a Generator: the second writer replaying the pre-first-patch version is rejected ERR_STALE_VERSION; the fresh-version retry succeeds."
        test_recipe:
          setup: ["Generator REGISTERED (version 1)"]
          setup_api_calls:
            - call: "POST /greenpower/generators"
              payload: { legal_name: "Sierra Solar", facility_code: "SS1", technology: "SOLAR", nameplate_capacity_kw: 5000, region_code: "CAISO", commissioning_date: "2020-01-01" }
              as: RegistryAdmin
              captures: { g: $.data.id, gv: $.data.version }
          trigger:
            - call: "PATCH /greenpower/generators/${g}"
              payload: { expected_generator_version: "${gv}", legal_name: "Sierra Solar LLC" }
              as: RegistryAdmin
              captures: { gv2: $.data.version }
            - call: "PATCH /greenpower/generators/${g}"
              payload: { expected_generator_version: "${gv}", region_code: "ERCOT" }
              as: RegistryAdmin
              captures: { err: $.data.error_id }
            - call: "PATCH /greenpower/generators/${g}"
              payload: { expected_generator_version: "${gv2}", region_code: "ERCOT" }
              as: RegistryAdmin
          assert:
            - "first PATCH succeeds (legal_name updated, version ${gv} + 1)"
            - "replay with the stale version: error_id == ERR_STALE_VERSION, HTTP 412"
            - "retry with the fresh version succeeds: Generator.${g}.region_code == ERCOT"

      - name: occ_program_patch_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[program-config-stale-program]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Program config PATCH is OCC-guarded: a second PATCH carrying the creation version after the holding-account PATCH committed is rejected ERR_STALE_VERSION."
        test_recipe:
          setup: ["Program created (version 1); holding account exists"]
          setup_api_calls:
            - call: "POST /greenpower/programs"
              payload: { name: "SunTariff", market_class: "VOLUNTARY", eligible_region_codes: ["CAISO"], eligible_technologies: ["SOLAR"], capacity_cap_kw: 1000, rate_tiers: [{up_to_kwh: 500, rate_cents_per_kwh: 5}], annual_claim_cap_mwh: 10000 }
              as: RegistryAdmin
              captures: { p: $.data.id, pv: $.data.version }
            - call: "POST /greenpower/accounts"
              payload: { account_type: "PROGRAM", owner_name: "SunTariff Holding", program_id: "${p}" }
              as: RegistryAdmin
              captures: { pacc: $.data.id }
          trigger:
            - call: "PATCH /greenpower/programs/${p}"
              payload: { expected_program_version: "${pv}", holding_account_id: "${pacc}" }
              as: RegistryAdmin
            - call: "PATCH /greenpower/programs/${p}"
              payload: { expected_program_version: "${pv}", capacity_cap_kw: 2000 }
              as: RegistryAdmin
              captures: { err: $.data.error_id }
          assert:
            - "first PATCH succeeds (holding account wired, version 2)"
            - "second PATCH with stale version: error_id == ERR_STALE_VERSION, HTTP 412; Program.${p}.capacity_cap_kw remains 1000"

      - name: occ_obligation_patch_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[obligation-amend-stale-obligation]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A compliance retirement silently advances the obligation's version (covered_mwh mutation), so a true-up amendment carrying the pre-retirement version is rejected ERR_STALE_VERSION — amendments never clobber unseen coverage."
