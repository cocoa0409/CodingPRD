  - section: rbac
    instances:

      - name: rbac_shop_manager_cannot_create_manufacturer_unauthorized
        claim_type: exclusive_operation_denied
        grounds:
          - roles.PlatformAdmin.exclusive_operations
          - roles.ContentPublisher.exclusive_operations
          - validations[priority=2]
        distinguishing_aspect: |
          Each opaque operator's exclusive catalogue operations are closed to the other roles:
          ShopManager cannot mint a Manufacturer and cannot open a Publication, and ContentPublisher
          cannot mint a SystemArea — all three fail 403 ERR_UNAUTHORIZED while the owning role's
          identical payload succeeds.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; one Shop 'Bay Auto' exists so a ShopManager identity is available"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /shops"
              payload: { name: "Bay Auto", tier: "PRO" }
              as: PlatformAdmin
              captures: { shop_id: $.data.id }
          trigger:
            - call: "POST /manufacturers"
              payload: { name: "Acme Motors", oem_code: "ACME", region: "NA", independent_list_monthly_cents: 115000, independent_covered_system_count: 3, oem_dealer_monthly_cents: 100000, oem_dealer_covered_system_count: 4 }
              as: ShopManager
              as_user_id: "${shop_id}"
            - call: "POST /system-areas"
              payload: { code: "POWERTRAIN", name: "Powertrain", requires_calibration_doc: false, requires_security_credential: true }
              as: ContentPublisher
              as_user_id: "cp_1"
            - call: "POST /manufacturers"
              payload: { name: "Acme Motors", oem_code: "ACME", region: "NA", independent_list_monthly_cents: 115000, independent_covered_system_count: 3, oem_dealer_monthly_cents: 100000, oem_dealer_covered_system_count: 4 }
              as: PlatformAdmin
          assert:
            - "ShopManager POST /manufacturers: HTTP status == 403 and response.data.error_id == ERR_UNAUTHORIZED"
            - "ContentPublisher POST /system-areas: HTTP status == 403 and response.data.error_id == ERR_UNAUTHORIZED"
            - "PlatformAdmin POST /manufacturers: HTTP status == 201 and response.data.oem_code == ACME"
            - "PlatformAdmin POST /manufacturers: response.data.parity_status == COMPLIANT"

      - name: rbac_missing_or_unknown_role_header_returns_4XX_unauthenticated
        claim_type: exclusive_operation_denied
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
          - roles
        distinguishing_aspect: |
          Authentication is checked strictly before authorization: a request with no auth headers
          and a request carrying a role string that is not one of the five declared roles both fail
          401 ERR_UNAUTHENTICATED — never 403 — and the same URL succeeds 200 once a declared role
          is supplied.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; one Shop 'Bay Auto' exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /shops"
              payload: { name: "Bay Auto", tier: "PRO" }
              as: PlatformAdmin
              captures: { shop_id: $.data.id }
          trigger:
            - call: "GET /shops/${shop_id}"
              payload: {}
              as: NO_HEADERS
            - call: "GET /shops/${shop_id}"
              payload: {}
              as: Mechanic
              as_user_id: "someone"
            - call: "GET /shops/${shop_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "no-header call: HTTP status == 401 and response.data.error_id == ERR_UNAUTHENTICATED"
            - "undeclared-role call: HTTP status == 401 and response.data.error_id == ERR_UNAUTHENTICATED"
            - "undeclared-role call: response.data.error_id != ERR_UNAUTHORIZED"
            - "PlatformAdmin call: HTTP status == 200 and response.data.name == Bay Auto"

      - name: rbac_shop_manager_cannot_touch_another_shops_entitlement_or_roster
        claim_type: scope_isolation
        grounds:
          - validations[priority=3]
          - errors[ERR_CROSS_SHOP_ACCESS]
          - roles.ShopManager.scope
