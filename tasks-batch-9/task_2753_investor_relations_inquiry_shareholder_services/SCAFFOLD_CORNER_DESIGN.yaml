              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { co_id: "$.data.id" }
            - call: "POST /disclosures"
              payload: { company_id: "${co_id}", disclosure_type: "GUIDANCE_UPDATE", fact_key: "EPS-FY2026-INITIAL", metric: "EPS", period_label: "FY2026", guidance_low: 2.00, guidance_high: 2.20 }
              as: DisclosureOfficer
              as_user_id: "u_do_1"
              captures: { d1_id: "$.data.id" }
            - call: "POST /disclosures/${d1_id}/publish"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "u_do_1"
          trigger:
            - call: "POST /disclosures"
              payload: { company_id: "${co_id}", disclosure_type: "PRESS_RELEASE", fact_key: "EPS-FY2026-INITIAL" }
              as: DisclosureOfficer
              as_user_id: "u_do_1"
            - call: "POST /disclosures"
              payload: { company_id: "${co_id}", disclosure_type: "GUIDANCE_UPDATE", fact_key: "EPS-FY2026-UPDATE", metric: "EPS", period_label: "FY2026", guidance_low: 2.10, guidance_high: 2.30 }
              as: DisclosureOfficer
              as_user_id: "u_do_1"
              captures: { d2_id: "$.data.id" }
            - call: "POST /disclosures/${d2_id}/publish"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "u_do_1"
            - call: "POST /disclosures"
              payload: { company_id: "${co_id}", disclosure_type: "PRESS_RELEASE", fact_key: "EPS-FY2026-INITIAL" }
              as: DisclosureOfficer
              as_user_id: "u_do_1"
          assert:
            - "trigger step 1 responds HTTP 409 with $.data.error_id == ERR_DUPLICATE_FACT_KEY"
            - "trigger step 3 responds HTTP 200 with $.data.status == 'PUBLISHED' and Disclosure.${d1_id}.status == 'SUPERSEDED'"
            - "trigger step 4 responds HTTP 201 with $.data.fact_key == 'EPS-FY2026-INITIAL' and $.data.status == 'DRAFT'"
            - "the superseded row keeps its own fact_key value — releasing the key does not blank the field"

