              as: MissionOps
            - call: "GET /rideshare/missions/${m_id}/anomalies"
              payload: {}
              as: MissionOps
              captures: { an1: "$.data[0].id" }
          trigger:
            - call: "POST /rideshare/separation-events/${ev1}/report-outcome"
              payload: { outcome: "EXECUTED" }
              as: MissionOps
              captures: { err_blocked: $.data.error_id }
            - call: "POST /rideshare/anomalies/${an1}/transition"
