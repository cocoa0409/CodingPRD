              as: IsoAdmin
              captures: { m1: $.data.id }
            - call: "POST /merchants/${m1}/activate"
              payload: {}
              as: IsoAdmin
            - call: "POST /residual-batches"
              payload: { processor_program_id: "${p1}", period_month: "2026-07", coverage_start: "2026-07-01", coverage_end: "2026-08-01", file_checksum: "sha256:rej-0001" }
