  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_safety_on_cert_issue
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_CERT_STATE_INVALID]
          - errors[ERR_EMISSIONS_TIER_INSUFFICIENT]
        distinguishing_aspect: |
          Category pair state x business_safety: issuing a certificate that is
          still APP_DRAFT (state violation) on an order whose EPA_TIER_4 engine
          cannot satisfy the US_CA TIER_4_FINAL_CARB requirement (safety
          violation) returns ERR_CERT_STATE_INVALID — state (priority 5) is
          checked before safety (priority 6).
        test_recipe:
          setup:
            - "Order O9 US_CA with engine EPA_TIER_4 (rank 2 < required rank 4); certificate created, never submitted"
          setup_api_calls:
            - call: "POST /genset-packaging/customers"
              payload: { name: "India Corp", credit_limit_cents: 200000000, primary_locale: "US_CA" }
              as: PlatformAdmin
