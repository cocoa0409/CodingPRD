            - { call: "POST /demolition/utility-disconnects/${ud_id}/transition", payload: { action: "REPORT_DISCONNECTED" }, as: UtilityCoordinator, as_user_id: "nn-r-1" }
            - { call: "POST /demolition/utility-disconnects/${ud_id}/transition", payload: { action: "VERIFY" }, as: UtilityCoordinator, as_user_id: "nn-v-1" }
            - { call: "POST /demolition/utility-disconnects/${ud_id}/transition", payload: { action: "CONFIRM" }, as: UtilityCoordinator, as_user_id: "nn-c-1" }
