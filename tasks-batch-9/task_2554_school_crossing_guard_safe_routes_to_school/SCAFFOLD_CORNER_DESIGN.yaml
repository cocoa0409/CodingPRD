      - name: corner_absence_four_link_coverage_cascade_stub
        claim_type: cross_entity
        grounds:
          - endpoints.POST_/srts/absence-reports
          - state_machines.School.coverage_posture
        excluded_because:
          difficulty_instance: absence_create_depth4_cascade_to_route_advisory_hold
          rationale: |
            The four-link assignment -> post -> school -> route cascade fired by filing an
            absence, including the ADVISORY_HOLD projection with hold_reason
            SCHOOL_COVERAGE_SUSPENDED, is asserted end-to-end by the §1.8 transitive
            cascade instance. Repeating it here would duplicate the same assertions.

      - name: corner_rescind_compensation_restores_counters_stub
        claim_type: compensation
        grounds:
          - endpoints.POST_/srts/absence-reports/{id}/rescind
          - state_machines.GuardPost.coverage_status
        excluded_because:
          difficulty_instance: post_coverage_partition_conserved_across_absence_and_rescind
          rationale: |
            Undoing an absence and proving every counter it moved returns to its
            pre-report value with no drift is exactly the §1.8 compensating-invariant
            instance, which additionally asserts the partition identity
            covered + uncovered == active at each step.

