              payload: { limit: 0 }
              as: PlatformAdmin
              captures: { pg_err: "$.data.error_id" }
          assert:
            - "response status 400 and error_id == ERR_INVALID_PAGINATION_PARAMETERS"

      - name: publish_before_appeal_window_elapsed_rejected
        claim_type: Violation → Error
        grounds:
          - errors[ERR_PUBLISH_WINDOW_NOT_ELAPSED]
        distinguishing_aspect: "Publish at exactly assigned_at + 120h is still blocked (the window rule is strict >): 409 ERR_PUBLISH_WINDOW_NOT_ELAPSED at 2026-09-07T10:30:00Z, then success one second later at 10:30:01."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Rating ASSIGNED 2026-09-02T10:30:00Z; no appeal."
          setup_api_calls:
            - *c_default
            - *mk_issuer
            - *mk_cv_go
            - *act_cv_go
            - *mk_eng_go
            - *accept_go
            - *doc_audit
            - *doc_budget
            - *doc_tax
            - *doc_debt
            - *score_a
            - *sched_std
            - *c_open
            - *open_std
            - *votes_aab
            - *vote_a2
            - *vote_bbb3
            - *close_std
            - *get_rating
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T10:30:00Z" }
              as: PlatformAdmin
            - call: "POST /muni/ratings/${rating_id}/publish"
              payload: { outlook: "STABLE", rationale: "boundary attempt" }
              as: LeadAnalyst
              as_user_id: "analyst-1"
              captures: { pub_err: "$.data.error_id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T10:30:01Z" }
              as: PlatformAdmin
            - call: "POST /muni/ratings/${rating_id}/publish"
              payload: { outlook: "STABLE", rationale: "one second past the window" }
              as: LeadAnalyst
              as_user_id: "analyst-1"
              captures: { pub_status: $.data.status }
          assert:
            - "at exactly assigned_at+120h: 409 ERR_PUBLISH_WINDOW_NOT_ELAPSED (strict-greater semantics)"
            - "one second later: publish succeeds, status PUBLISHED"

      - name: appeal_after_window_rejected
        claim_type: Violation → Error
        grounds:
          - errors[ERR_APPEAL_WINDOW_CLOSED]
        distinguishing_aspect: "A pure temporal failure (no state confound): the rating is still ASSIGNED but the clock is one second past assigned_at+120h — appeal rejected 422 ERR_APPEAL_WINDOW_CLOSED; one second earlier (exactly at the deadline) it is accepted."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Rating ASSIGNED 2026-09-02T10:30:00Z."
          setup_api_calls:
            - *c_default
            - *mk_issuer
            - *mk_cv_go
            - *act_cv_go
            - *mk_eng_go
            - *accept_go
            - *doc_audit
            - *doc_budget
            - *doc_tax
            - *doc_debt
            - *score_a
            - *sched_std
            - *c_open
            - *open_std
            - *votes_aab
            - *vote_a2
            - *vote_bbb3
            - *close_std
            - *get_rating
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T10:30:01Z" }
              as: PlatformAdmin
            - call: "POST /muni/ratings/${rating_id}/appeals"
              payload: { new_information_codes: ["PENSION_VALUATION"] }
              as: Issuer
              as_user_id: "${iss}"
              captures: { late_err: "$.data.error_id" }
          assert:
            - "response status 422 and error_id == ERR_APPEAL_WINDOW_CLOSED (rating is ASSIGNED, so only the temporal rule fails)"
            - "no Appeal row exists for the rating afterwards"

      - name: second_appeal_rejected
        claim_type: Violation → Error
        grounds:
          - errors[ERR_APPEAL_ALREADY_EXISTS]
        distinguishing_aspect: "One appeal per rating: a second filing with a different, genuinely-new code (EPA_LITIGATION_REPORT) while the first appeal is FILED is rejected 409 ERR_APPEAL_ALREADY_EXISTS."
        test_recipe:
          setup:
