            - "Clock 2026-08-03T09:00:00.000Z. Recognition with all four forums; Nadia Rey is an ACCREDITED_REP with an APPROVED FULL accreditation, so her authorization_status is AUTHORIZED_ACCREDITED — authorized, but not an attorney."
