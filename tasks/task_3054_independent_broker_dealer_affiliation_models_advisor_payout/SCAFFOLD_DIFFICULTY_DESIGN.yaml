  - rule_id: priority_pair_validation_conflict
    instances:

      - name: suspension_on_unsupervised_branch_prefers_state_over_authorization
        grounds:
          - state_machines.Advisor.ACTIVE_to_SUSPENDED
          - validations[priority=13]
          - validations[priority=2]
          - errors.ERR_INVALID_STATE
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "The request violates both the state precondition (branch not SUPERVISED) and the authorization rule (an entity-backed actor addressing another advisor), and the state error ERR_INVALID_STATE must win over ERR_UNAUTHORIZED, a state-versus-auth pair."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Branch SOLO-1 exists but has never been enrolled, so state is UNSUPERVISED. Advisor A-1201 is ACTIVE on it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /branches"
              payload: { branch_code: "SOLO-1", name: "Solo Practice", transmittal_account: "TA-9001", osj_name: "Solo OSJ" }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /advisors"
              payload: { advisor_code: "A-1201", crd_number: "3234567", full_name: "Rune Salazar", affiliation_model: "IC", primary_branch_code: "SOLO-1", ingested_book_total_cents: 500000000, book_transferred_cents: 400000000, protocol_eligible: true, eo_coverage_level: "STANDARD" }
