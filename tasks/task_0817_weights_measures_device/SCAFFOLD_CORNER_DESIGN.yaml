  # ---------------- Errors already covered by §1.8 (stubs) ----------------
  - section: errors
    instances:
      - name: error_establishment_suspended_on_finalize
        claim_type: violation_to_error
        grounds: ["errors[ERR_ESTABLISHMENT_SUSPENDED]"]
        excluded_because:
          difficulty_instance: seal_requires_active_establishment
          rationale: "ERR_ESTABLISHMENT_SUSPENDED is asserted as the failure path of the named §1.8 cross-entity dependency instance."

      - name: error_device_not_testable_on_start
        claim_type: violation_to_error
        grounds: ["errors[ERR_DEVICE_NOT_TESTABLE]"]
        excluded_because:
          difficulty_instance: inspection_start_requires_testable_device
          rationale: "ERR_DEVICE_NOT_TESTABLE is asserted by the named §1.8 cross-entity dependency instance (and by state_beats_temporal_on_schedule)."

      - name: error_inspector_schedule_conflict
