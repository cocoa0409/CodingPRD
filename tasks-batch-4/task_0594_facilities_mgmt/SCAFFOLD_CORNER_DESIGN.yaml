scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: building_create_returns_system_fields_and_open_posture
        claim_type: Creation
        grounds:
          - entities.Building.fields.operating_posture
          - 'endpoints["POST /fm/buildings"]'
        distinguishing_aspect: "A newly created Building returns a server-minted UUID id (no type prefix), version 1, posture OPEN and both derived counters at 0."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000, region: "APAC" }
              as: FacilityManager
              captures: { b1: $.data.id, b1_v: $.data.version }
          assert:
            - "HTTP status is 201"
            - "Building.${b1}.operating_posture == OPEN, oos_critical_asset_count == 0, open_p1_work_order_count == 0"
            - "${b1_v} == 1 and ${b1} is a bare UUID (36 chars, no prefix)"
            - "response envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == 'object'"

      - name: get_building_with_unknown_id_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_BUILDING_NOT_FOUND]"]
        distinguishing_aspect: "A GET for a syntactically valid but unknown building UUID returns 404 ERR_BUILDING_NOT_FOUND, not an empty object."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
          trigger:
            - call: "GET /fm/buildings/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FacilityManager
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 404 and ${err_id} == ERR_BUILDING_NOT_FOUND"
            - "response_type == 'error'"

      - name: work_order_create_missing_required_field_invalid_request
        claim_type: Required Fields
        grounds:
          - "validations[priority=25]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Omitting estimated_parts_cost (a required input with no default) on POST /fm/work-orders returns 400 ERR_INVALID_REQUEST and creates nothing."
        test_recipe:
          setup: ["One building in OPEN posture."]
          setup_api_calls:
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /fm/work-orders"
              payload: { building_id: "${b1}", wo_type: "CORRECTIVE", priority: "P3", estimated_labor_hours: 2 }
              as: FacilityManager
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 400 and ${err_id} == ERR_INVALID_REQUEST"
            - "GET /fm/work-orders?building_id=${b1} returns total_count == 0"

      - name: work_order_create_invalid_enum_priority_rejected
        claim_type: Type Constraints
        grounds:
          - "validations[priority=25]"
          - entities.WorkOrder.fields.priority
        distinguishing_aspect: "priority 'P9' is outside the declared enum {P1,P2,P3,P4} and is rejected with 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["One building in OPEN posture."]
          setup_api_calls:
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /fm/work-orders"
              payload: { building_id: "${b1}", wo_type: "CORRECTIVE", priority: "P9", estimated_labor_hours: 2, estimated_parts_cost: 0 }
              as: FacilityManager
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 400 and ${err_id} == ERR_INVALID_REQUEST"

      - name: asset_condition_score_computed_from_runtime_hours
        claim_type: Computed Fields
        grounds:
          - calculations.asset_condition_score
          - entities.Asset.fields.condition_score
        distinguishing_aspect: "condition_score is computed at creation: 2500 runtime hours means floor(2500/1000) = 2 decay blocks * 5 points, so the score is 90.00 with failure_count 0 — a client-supplied condition_score is ignored."
        test_recipe:
          setup: ["One building."]
          setup_api_calls:
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /fm/assets"
              payload: { building_id: "${b1}", asset_tag: "AHU-01", category: "HVAC", criticality: "STANDARD", runtime_hours: 2500 }
              as: FacilityManager
              captures: { a1: $.data.id }
          assert:
            - "Asset.${a1}.condition_score == 90.00"
            - "Asset.${a1}.status == IN_SERVICE, failure_count == 0, last_pm_at == null"

      - name: space_defaults_to_vacant_with_full_free_share
        claim_type: Defaults
        grounds:
          - entities.Space.fields.free_share_pct
          - entities.Space.fields.occupancy_status
        distinguishing_aspect: "A new Space starts allocated_share_pct 0, free_share_pct 100 and occupancy_status VACANT, and cost_center defaults to null when omitted."
        test_recipe:
          setup: ["One building."]
          setup_api_calls:
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /fm/buildings/${b1}/spaces"
              payload: { space_code: "S1", floor: 3, area_sqm: 150, space_type: "LAB" }
              as: FacilityManager
              captures: { s1: $.data.id }
          assert:
            - "Space.${s1}.allocated_share_pct == 0, free_share_pct == 100, occupancy_status == VACANT"
            - "Space.${s1}.version == 1"

      - name: utility_reading_is_immutable_event_without_version
        claim_type: Immutability
        grounds:
          - entities.UtilityReading
          - 'endpoints["POST /fm/utility-readings"]'
        distinguishing_aspect: "UtilityReading declares common_fields: false, so its response carries id and created_at but no version and no updated_at, and the scaffold exposes no update or delete endpoint for it."
        test_recipe:
          setup: ["One building."]
          setup_api_calls:
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /fm/utility-readings"
              payload: { building_id: "${b1}", meter_type: "WATER", period_start: "2026-05-01T00:00:00Z", period_end: "2026-05-31T23:59:59Z", consumption_kwh: 0, cost: 100.00 }
              as: SustainabilityAnalyst
              captures: { ur1: $.data.id }
          assert:
            - "HTTP status is 201 and the response data contains id and created_at"
            - "the response data contains neither a version nor an updated_at field"
            - "GET /fm/buildings/${b1}/utility-readings returns exactly 1 reading whose id == ${ur1}"

      - name: work_order_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - 'endpoints["GET /fm/work-orders"]'
        distinguishing_aspect: "With three work orders and limit 2 / offset 0, the list returns 2 items, total_count 3 and has_more true; offset 2 returns 1 item and has_more false."
        test_recipe:
          setup: ["One OPEN building with three P3 CORRECTIVE work orders."]
          setup_api_calls:
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b1: $.data.id }
            - call: "POST /fm/work-orders"
              payload: { building_id: "${b1}", wo_type: "CORRECTIVE", priority: "P3", estimated_labor_hours: 1, estimated_parts_cost: 0 }
              as: FacilityManager
            - call: "POST /fm/work-orders"
              payload: { building_id: "${b1}", wo_type: "CORRECTIVE", priority: "P3", estimated_labor_hours: 1, estimated_parts_cost: 0 }
              as: FacilityManager
            - call: "POST /fm/work-orders"
              payload: { building_id: "${b1}", wo_type: "CORRECTIVE", priority: "P3", estimated_labor_hours: 1, estimated_parts_cost: 0 }
              as: FacilityManager
          trigger:
            - call: "GET /fm/work-orders"
              payload: { building_id: "${b1}", limit: 2, offset: 0 }
              as: FacilityManager
          assert:
            - "response_type == 'array' with 2 items, meta/pagination total_count == 3 and has_more == true"
            - "the same call with offset 2 returns 1 item and has_more == false"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: accept_dispatch_twice_rejected_as_not_actionable
        claim_type: Idempotency
        grounds:
          - state_machines.Dispatch.OFFERED_to_ACCEPTED
          - "errors[ERR_DISPATCH_NOT_ACTIONABLE]"
        distinguishing_aspect: "A second accept on an already-ACCEPTED dispatch is rejected with 409 ERR_DISPATCH_NOT_ACTIONABLE and does not re-stamp accepted_at."
        test_recipe:
          setup: ["One work order dispatched and accepted at 2026-05-04T09:30:00Z."]
          setup_api_calls:
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b1: $.data.id }
            - call: "POST /fm/vendors"
              payload: { name: "CoolAir", trade: "HVAC", hourly_rate: 100.00, sla_response_minutes: 60, sla_resolve_minutes: 240 }
              as: FacilityManager
              captures: { v1: $.data.id }
            - call: "POST /fm/work-orders"
              payload: { building_id: "${b1}", wo_type: "CORRECTIVE", priority: "P3", estimated_labor_hours: 1, estimated_parts_cost: 0 }
              as: FacilityManager
              captures: { wo1: $.data.id, wo1_v: $.data.version }
            - call: "POST /fm/work-orders/${wo1}/dispatches"
              payload: { vendor_id: "${v1}", expected_work_order_version: "${wo1_v}" }
              as: FacilityManager
              captures: { d1: $.data.id }
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:30:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/dispatches/${d1}/accept"
              payload: {}
              as: VendorTech
              as_user_id: "${v1}"
          trigger:
            - call: "POST /fm/dispatches/${d1}/accept"
              payload: {}
              as: VendorTech
              as_user_id: "${v1}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 409 and ${err_id} == ERR_DISPATCH_NOT_ACTIONABLE"
            - "Dispatch.${d1}.status == ACCEPTED and accepted_at == 2026-05-04T09:30:00.000Z"
            - "WorkOrder.${wo1}.status == IN_PROGRESS"

      - name: qa_on_new_work_order_rejected_as_not_open
        claim_type: Invalid Transitions
        grounds:
          - state_machines.WorkOrder.PENDING_QA_to_CLOSED
          - "errors[ERR_WORK_ORDER_NOT_OPEN]"
        distinguishing_aspect: "QA is only declared from PENDING_QA; calling it on a NEW order returns 409 ERR_WORK_ORDER_NOT_OPEN and leaves status NEW."
        test_recipe:
          setup: ["One NEW work order."]
          setup_api_calls:
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b1: $.data.id }
            - call: "POST /fm/work-orders"
              payload: { building_id: "${b1}", wo_type: "CORRECTIVE", priority: "P3", estimated_labor_hours: 1, estimated_parts_cost: 0 }
              as: FacilityManager
              captures: { wo1: $.data.id }
          trigger:
            - call: "POST /fm/work-orders/${wo1}/qa"
              payload: { outcome: "PASS" }
              as: FacilityManager
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 409 and ${err_id} == ERR_WORK_ORDER_NOT_OPEN"
            - "WorkOrder.${wo1}.status == NEW and closed_at == null"

      - name: cancel_closed_work_order_rejected_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.WorkOrder.NEW_to_CANCELLED
          - "errors[ERR_WORK_ORDER_NOT_OPEN]"
        distinguishing_aspect: "CLOSED is terminal on the status dimension: cancelling a CLOSED order returns 409 ERR_WORK_ORDER_NOT_OPEN and its billing_status stays PENDING."
        test_recipe:
          setup: ["One work order taken all the way to CLOSED via dispatch, accept, complete and QA PASS."]
          setup_api_calls:
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b1: $.data.id }
            - call: "POST /fm/vendors"
              payload: { name: "CoolAir", trade: "HVAC", hourly_rate: 100.00, sla_response_minutes: 60, sla_resolve_minutes: 240 }
              as: FacilityManager
              captures: { v1: $.data.id }
            - call: "POST /fm/work-orders"
              payload: { building_id: "${b1}", wo_type: "CORRECTIVE", priority: "P3", estimated_labor_hours: 2, estimated_parts_cost: 0 }
              as: FacilityManager
              captures: { wo1: $.data.id, wo1_v: $.data.version }
            - call: "POST /fm/work-orders/${wo1}/dispatches"
              payload: { vendor_id: "${v1}", expected_work_order_version: "${wo1_v}" }
              as: FacilityManager
              captures: { d1: $.data.id }
            - call: "POST /fm/dispatches/${d1}/accept"
              payload: {}
              as: VendorTech
              as_user_id: "${v1}"
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/dispatches/${d1}/complete"
              payload: { actual_labor_hours: 2, actual_parts_cost: 0 }
              as: VendorTech
              as_user_id: "${v1}"
            - call: "POST /fm/work-orders/${wo1}/qa"
              payload: { outcome: "PASS" }
              as: FacilityManager
          trigger:
            - call: "POST /fm/work-orders/${wo1}/cancel"
              payload: {}
              as: FacilityManager
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 409 and ${err_id} == ERR_WORK_ORDER_NOT_OPEN"
            - "WorkOrder.${wo1}.status == CLOSED, billing_status == PENDING, billable_amount == 200.00, closed_at == 2026-05-04T10:00:00.000Z"

      - name: dispatch_decline_reverts_order_to_new_and_restores_standard_rate_estimate
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Dispatch.OFFERED_to_DECLINED
          - state_machines.WorkOrder.DISPATCHED_to_NEW
          - calculations.work_order_billable_amount
        distinguishing_aspect: "Declining rolls the order back to NEW, clears dispatched_at and both SLA due timestamps, and re-runs the provisional estimate on STANDARD_LABOR_RATE — 4h/0 parts at P3 falls from 400.00 (vendor rate 100.00) back to 320.00 (rate 80.00)."
        test_recipe:
          setup: ["One P3 work order (4 estimated hours, no parts) dispatched to a vendor charging 100.00/hour."]
          setup_api_calls:
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b1: $.data.id }
            - call: "POST /fm/vendors"
              payload: { name: "CoolAir", trade: "HVAC", hourly_rate: 100.00, sla_response_minutes: 60, sla_resolve_minutes: 240 }
              as: FacilityManager
              captures: { v1: $.data.id }
            - call: "POST /fm/work-orders"
              payload: { building_id: "${b1}", wo_type: "CORRECTIVE", priority: "P3", estimated_labor_hours: 4, estimated_parts_cost: 0 }
              as: FacilityManager
              captures: { wo1: $.data.id, wo1_v: $.data.version }
            - call: "POST /fm/work-orders/${wo1}/dispatches"
              payload: { vendor_id: "${v1}", expected_work_order_version: "${wo1_v}" }
              as: FacilityManager
              captures: { d1: $.data.id }
          trigger:
            - call: "POST /fm/dispatches/${d1}/decline"
              payload: { reason: "No crew available" }
              as: VendorTech
              as_user_id: "${v1}"
            - call: "GET /fm/work-orders/${wo1}"
              payload: {}
              as: FacilityManager
          assert:
            - "Dispatch.${d1}.status == DECLINED"
            - "WorkOrder.${wo1}.status == NEW, dispatched_at == null, sla_response_due_at == null, sla_resolve_due_at == null"
            - "WorkOrder.${wo1}.estimated_amount == 320.00 (4 * 80.00 STANDARD_LABOR_RATE, P3 surcharge 0)"
            - "Vendor.${v1}.strike_count == 0 (a decline is not a breach)"

      - name: ops_run_promotes_overdue_pm_plan_into_preventive_work_order
        claim_type: Valid Transition
        grounds:
          - calculations.pm_overdue_promotion
          - calculations.pm_compliance_state
          - 'endpoints["POST /fm/buildings/{building_id}/ops-run"]'
        distinguishing_aspect: "A plan due 2026-05-10 with 5 grace days is OVERDUE once the clock passes 2026-05-15; ops-run creates exactly one PREVENTIVE P2 order for it (estimated_amount 494.00 = 3h * 80.00 labour + 10% P2 surcharge + 200.00 * 1.15 parts) and a second ops-run creates no duplicate."
        test_recipe:
          setup:
            - "One STANDARD asset with an ACTIVE PM plan: next_due_at 2026-05-10T00:00:00Z, grace_days 5."
            - "Clock advanced to 2026-05-16T09:00:00Z, past the grace window."
          setup_api_calls:
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b1: $.data.id }
            - call: "POST /fm/assets"
              payload: { building_id: "${b1}", asset_tag: "AHU-01", category: "HVAC", criticality: "STANDARD" }
              as: FacilityManager
              captures: { a1: $.data.id }
            - call: "POST /fm/pm-plans"
              payload: { asset_id: "${a1}", interval_days: 30, grace_days: 5, next_due_at: "2026-05-10T00:00:00Z" }
              as: FacilityManager
              captures: { pm1: $.data.id }
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-16T09:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /fm/buildings/${b1}/ops-run"
              payload: {}
              as: FacilityManager
            - call: "GET /fm/work-orders"
              payload: { pm_plan_id: "${pm1}" }
              as: FacilityManager
            - call: "POST /fm/buildings/${b1}/ops-run"
              payload: {}
              as: FacilityManager
          assert:
            - "the first ops-run returns exactly one id in created_work_order_ids"
            - "GET /fm/work-orders?pm_plan_id=${pm1} returns total_count == 1 with wo_type == PREVENTIVE, priority == P2, status == NEW, asset_id == ${a1}"
            - "that order's estimated_amount == 494.00 (3 * 80.00 = 240.00 labour, 24.00 P2 surcharge, 200.00 * 1.15 = 230.00 parts)"
            - "the second ops-run returns an empty created_work_order_ids (an open PREVENTIVE order already exists for the plan)"

      - name: ops_run_retires_dead_asset_and_its_pm_plans
        claim_type: Valid Transition
        grounds:
          - state_machines.Asset.OUT_OF_SERVICE_to_RETIRED
          - state_machines.PMPlan.ACTIVE_to_RETIRED
          - calculations.asset_condition_score
        distinguishing_aspect: "A STANDARD asset with 16000 runtime hours drops to condition_score 8.00 once it fails (100 - 80 decay - 12 failure), below the RETIREMENT_SCORE_THRESHOLD of 20, so ops-run RETIREs it and its PM plan."
        test_recipe:
          setup: ["OUT_OF_SERVICE STANDARD asset with 16000 runtime hours and one failure; one ACTIVE PM plan on it; building not FROZEN because the asset is not CRITICAL."]
          setup_api_calls:
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b1: $.data.id }
            - call: "POST /fm/assets"
              payload: { building_id: "${b1}", asset_tag: "AHU-OLD", category: "HVAC", criticality: "STANDARD", runtime_hours: 16000 }
              as: FacilityManager
              captures: { a1: $.data.id }
            - call: "POST /fm/pm-plans"
              payload: { asset_id: "${a1}", interval_days: 30, grace_days: 5, next_due_at: "2026-06-01T00:00:00Z" }
              as: FacilityManager
              captures: { pm1: $.data.id }
            - call: "POST /fm/assets/${a1}/report-failure"
              payload: {}
              as: FacilityManager
          trigger:
            - call: "POST /fm/buildings/${b1}/ops-run"
              payload: {}
              as: FacilityManager
            - call: "GET /fm/assets/${a1}"
              payload: {}
              as: FacilityManager
            - call: "GET /fm/assets/${a1}/pm-plans"
              payload: {}
              as: FacilityManager
          assert:
            - "before the ops-run Asset.${a1}.condition_score == 8.00 and status == OUT_OF_SERVICE"
            - "ops-run returns ${a1} in retired_asset_ids"
            - "Asset.${a1}.status == RETIRED"
            - "PMPlan.${pm1}.status == RETIRED"
            - "Building.${b1}.operating_posture == OPEN (a STANDARD asset never froze it)"

      - name: ops_run_expires_lease_and_releases_its_allocations
        claim_type: Cascade down
        grounds:
          - state_machines.Lease.ACTIVE_to_EXPIRED
          - calculations.space_share_conservation
          - entities.LeaseAllocation.fields.status
        distinguishing_aspect: "Once the clock passes end_date, ops-run EXPIREs the ACTIVE lease and RELEASEs its allocations, so the space returns to free_share_pct 100 and VACANT."
        test_recipe:
          setup: ["ACTIVE lease ending 2026-05-31 holding 100% of a 200 sqm space; clock moved to 2026-06-01."]
          setup_api_calls:
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b1: $.data.id }
            - call: "POST /fm/buildings/${b1}/spaces"
              payload: { space_code: "S1", floor: 1, area_sqm: 200, space_type: "OFFICE" }
              as: FacilityManager
              captures: { s1: $.data.id }
            - call: "POST /fm/leases"
              payload: { building_id: "${b1}", tenant_name: "Acme", base_rate_per_sqm_month: 10.00, start_date: "2026-05-01T00:00:00Z", end_date: "2026-05-31T23:59:59Z" }
              as: FinanceController
              captures: { l1: $.data.id }
            - call: "POST /fm/leases/${l1}/allocations"
              payload: { space_id: "${s1}", share_pct: 100, effective_from: "2026-05-01T00:00:00Z", effective_to: "2026-05-31T23:59:59Z" }
              as: FinanceController
              captures: { al1: $.data.id }
            - call: "POST /fm/leases/${l1}/activate"
              payload: {}
              as: FinanceController
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:01Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /fm/buildings/${b1}/ops-run"
              payload: {}
              as: FacilityManager
            - call: "GET /fm/leases/${l1}"
              payload: {}
              as: FinanceController
            - call: "GET /fm/spaces/${s1}"
              payload: {}
              as: FinanceController
          assert:
            - "ops-run returns ${l1} in expired_lease_ids"
            - "Lease.${l1}.status == EXPIRED and allocated_area_sqm == 0"
            - "LeaseAllocation.${al1}.status == RELEASED"
            - "Space.${s1}.allocated_share_pct == 0, free_share_pct == 100, occupancy_status == VACANT"

      - name: preventive_close_resets_asset_counters_and_advances_plan
        claim_type: Ledger sync
        grounds:
          - state_machines.WorkOrder.PENDING_QA_to_CLOSED
          - entities.Asset.fields.runtime_hours
          - entities.PMPlan.fields.next_due_at
          - calculations.asset_condition_score
        distinguishing_aspect: "Closing a PREVENTIVE order on an asset resets runtime_hours to 0, decrements failure_count by one (floored at 0), stamps last_pm_at from the clock, restores condition_score to 100.00 and pushes pm_plan.next_due_at forward by interval_days."
        test_recipe:
          setup:
            - "Asset with 3000 runtime hours (condition_score 85.00) and an ACTIVE PM plan due 2026-06-01 with interval 30 days."
            - "A PREVENTIVE P2 order on that asset and plan, completed by the vendor and sitting in PENDING_QA."
          setup_api_calls:
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b1: $.data.id }
            - call: "POST /fm/assets"
              payload: { building_id: "${b1}", asset_tag: "AHU-01", category: "HVAC", criticality: "STANDARD", runtime_hours: 3000 }
              as: FacilityManager
              captures: { a1: $.data.id }
            - call: "POST /fm/pm-plans"
              payload: { asset_id: "${a1}", interval_days: 30, grace_days: 5, next_due_at: "2026-06-01T00:00:00Z" }
              as: FacilityManager
              captures: { pm1: $.data.id }
            - call: "POST /fm/vendors"
              payload: { name: "CoolAir", trade: "HVAC", hourly_rate: 100.00, sla_response_minutes: 60, sla_resolve_minutes: 240 }
              as: FacilityManager
              captures: { v1: $.data.id }
            - call: "POST /fm/work-orders"
              payload: { building_id: "${b1}", asset_id: "${a1}", pm_plan_id: "${pm1}", wo_type: "PREVENTIVE", priority: "P2", estimated_labor_hours: 3, estimated_parts_cost: 200.00 }
              as: FacilityManager
              captures: { wo1: $.data.id, wo1_v: $.data.version }
            - call: "POST /fm/work-orders/${wo1}/dispatches"
              payload: { vendor_id: "${v1}", expected_work_order_version: "${wo1_v}" }
              as: FacilityManager
              captures: { d1: $.data.id }
            - call: "POST /fm/dispatches/${d1}/accept"
              payload: {}
              as: VendorTech
              as_user_id: "${v1}"
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T11:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/dispatches/${d1}/complete"
              payload: { actual_labor_hours: 3, actual_parts_cost: 200.00 }
              as: VendorTech
              as_user_id: "${v1}"
          trigger:
            - call: "POST /fm/work-orders/${wo1}/qa"
              payload: { outcome: "PASS" }
              as: FacilityManager
            - call: "GET /fm/assets/${a1}"
              payload: {}
              as: FacilityManager
            - call: "GET /fm/assets/${a1}/pm-plans"
              payload: {}
              as: FacilityManager
          assert:
            - "WorkOrder.${wo1}.status == CLOSED and closed_at == 2026-05-04T11:00:00.000Z"
            - "Asset.${a1}.runtime_hours == 0, failure_count == 0, condition_score == 100.00, last_pm_at == 2026-05-04T11:00:00.000Z"
            - "PMPlan.${pm1}.next_due_at == 2026-07-01T00:00:00.000Z (2026-06-01 + 30 days) and status == ACTIVE"
            - "WorkOrder.${wo1}.billable_amount == 560.00 (3 * 100.00 = 300.00 labour, 30.00 P2 surcharge, 200.00 * 1.15 = 230.00 parts)"

      - name: non_chargeable_order_close_waives_billing_dimension
        claim_type: parallel
        grounds:
          - state_machines.WorkOrder_billing.PENDING_to_WAIVED
          - entities.WorkOrder.fields.billing_status
        distinguishing_aspect: "The billing dimension advances independently of status: closing an order with chargeable == false sets billing_status WAIVED while status is CLOSED, and the order is then never collected by a statement."
        test_recipe:
          setup: ["One CORRECTIVE P3 order with chargeable false, completed and awaiting QA."]
          setup_api_calls:
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b1: $.data.id }
            - call: "POST /fm/vendors"
              payload: { name: "CoolAir", trade: "HVAC", hourly_rate: 100.00, sla_response_minutes: 60, sla_resolve_minutes: 240 }
              as: FacilityManager
              captures: { v1: $.data.id }
            - call: "POST /fm/work-orders"
              payload: { building_id: "${b1}", wo_type: "CORRECTIVE", priority: "P3", estimated_labor_hours: 2, estimated_parts_cost: 0, chargeable: false }
              as: FacilityManager
              captures: { wo1: $.data.id, wo1_v: $.data.version }
            - call: "POST /fm/work-orders/${wo1}/dispatches"
              payload: { vendor_id: "${v1}", expected_work_order_version: "${wo1_v}" }
              as: FacilityManager
              captures: { d1: $.data.id }
            - call: "POST /fm/dispatches/${d1}/accept"
              payload: {}
              as: VendorTech
              as_user_id: "${v1}"
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/dispatches/${d1}/complete"
              payload: { actual_labor_hours: 2, actual_parts_cost: 0 }
              as: VendorTech
              as_user_id: "${v1}"
          trigger:
            - call: "POST /fm/work-orders/${wo1}/qa"
              payload: { outcome: "PASS" }
              as: FacilityManager
          assert:
            - "WorkOrder.${wo1}.status == CLOSED and WorkOrder.${wo1}.billing_status == WAIVED"
            - "WorkOrder.${wo1}.statement_id == null"
            - "GET /fm/work-orders?billing_status=WAIVED returns total_count == 1"

  # ===========================================================================
  - section: calculations
    instances:
      - name: min_callout_amount_floors_a_tiny_estimate
        claim_type: Constants Applied
        grounds:
          - calculations.work_order_billable_amount
          - entities.WorkOrder.fields.estimated_amount
        distinguishing_aspect: "MIN_CALLOUT_AMOUNT 150.00 is a max() floor: a P4 order of 0.5 hours and no parts computes 40.00 of labour but is billed at exactly 150.00."
        test_recipe:
          setup: ["Clock at 2026-05-04T09:00:00Z (no after-hours multiplier); one OPEN building."]
          setup_api_calls:
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /fm/work-orders"
              payload: { building_id: "${b1}", wo_type: "CORRECTIVE", priority: "P4", estimated_labor_hours: 0.5, estimated_parts_cost: 0 }
              as: FacilityManager
              captures: { wo1: $.data.id }
          assert:
            - "WorkOrder.${wo1}.estimated_amount == 150.00 (0.5 * 80.00 = 40.00 is below the 150.00 callout floor)"

      - name: statement_om_share_pro_rated_by_allocated_area
        claim_type: Input Set Filtering
        grounds:
          - calculations.chargeback_statement_total
          - entities.ChargebackStatement.fields.om_share
          - state_machines.WorkOrder_billing.PENDING_to_INVOICED
        distinguishing_aspect: "Only CLOSED + PENDING + chargeable orders closed inside the period enter om_share, pro-rated by the lease's allocated area over the building's gross area: a 200.00 order in a 1000 sqm building with a 100 sqm lease contributes exactly 20.00, and the order flips to INVOICED."
        test_recipe:
          setup:
            - "Building of 1000 sqm; ACTIVE lease holding 100% of a 100 sqm space for May 2026 at 10.00/sqm."
            - "One chargeable CORRECTIVE order closed on 2026-05-10 with billable_amount 200.00; no utility readings."
          setup_api_calls:
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b1: $.data.id }
            - call: "POST /fm/buildings/${b1}/spaces"
              payload: { space_code: "S1", floor: 1, area_sqm: 100, space_type: "OFFICE" }
              as: FacilityManager
              captures: { s1: $.data.id }
            - call: "POST /fm/leases"
              payload: { building_id: "${b1}", tenant_name: "Acme", base_rate_per_sqm_month: 10.00, start_date: "2026-05-01T00:00:00Z", end_date: "2027-04-30T23:59:59Z" }
              as: FinanceController
              captures: { l1: $.data.id }
            - call: "POST /fm/leases/${l1}/allocations"
              payload: { space_id: "${s1}", share_pct: 100, effective_from: "2026-05-01T00:00:00Z", effective_to: "2027-04-30T23:59:59Z" }
              as: FinanceController
            - call: "POST /fm/leases/${l1}/activate"
              payload: {}
              as: FinanceController
            - call: "POST /fm/vendors"
              payload: { name: "CoolAir", trade: "HVAC", hourly_rate: 100.00, sla_response_minutes: 60, sla_resolve_minutes: 240 }
              as: FacilityManager
              captures: { v1: $.data.id }
            - call: "POST /fm/work-orders"
              payload: { building_id: "${b1}", wo_type: "CORRECTIVE", priority: "P3", estimated_labor_hours: 2, estimated_parts_cost: 0, chargeable: true }
              as: FacilityManager
              captures: { wo1: $.data.id, wo1_v: $.data.version }
            - call: "POST /fm/work-orders/${wo1}/dispatches"
              payload: { vendor_id: "${v1}", expected_work_order_version: "${wo1_v}" }
              as: FacilityManager
              captures: { d1: $.data.id }
            - call: "POST /fm/dispatches/${d1}/accept"
              payload: {}
              as: VendorTech
              as_user_id: "${v1}"
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T11:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/dispatches/${d1}/complete"
              payload: { actual_labor_hours: 2, actual_parts_cost: 0 }
              as: VendorTech
              as_user_id: "${v1}"
            - call: "POST /fm/work-orders/${wo1}/qa"
              payload: { outcome: "PASS" }
              as: FacilityManager
            - call: "GET /fm/leases/${l1}"
              payload: {}
              as: FinanceController
              captures: { l1_v: $.data.version }
          trigger:
            - call: "POST /fm/leases/${l1}/statements"
              payload: { period_start: "2026-05-01T00:00:00Z", period_end: "2026-05-31T23:59:59Z", expected_lease_version: "${l1_v}" }
              as: FinanceController
              captures: { st1: $.data.id }
            - call: "GET /fm/work-orders/${wo1}"
              payload: {}
              as: FinanceController
          assert:
            - "WorkOrder.${wo1}.billable_amount == 200.00 (2 * 100.00, P3 surcharge 0, no parts, no penalty)"
            - "ChargebackStatement.${st1}.om_share == 20.00 (round(200.00 * 100/1000, 2))"
            - "ChargebackStatement.${st1}.base_rent == 1000.00, utility_share == 0.00, total_amount == 1020.00"
            - "WorkOrder.${wo1}.billing_status == INVOICED and statement_id == ${st1}"

      - name: kpi_energy_excludes_water_and_partially_contained_readings
        claim_type: Input Set Filtering
        grounds:
          - calculations.building_kpi_dashboard
          - entities.UtilityReading.fields.meter_type
        distinguishing_aspect: "energy_intensity_kwh_per_sqm counts only ELECTRIC and GAS readings FULLY CONTAINED in the window (3000 kWh / 1000 sqm = 3.0), while total_utility_cost counts every fully-contained reading including WATER (600.00 + 100.00 = 700.00); a GAS reading straddling the window edge contributes to neither."
        test_recipe:
          setup:
            - "Building of 1000 sqm with three readings: ELECTRIC 3000 kWh / 600.00 fully inside May; WATER 0 kWh / 100.00 fully inside May; GAS 5000 kWh / 900.00 spanning 2026-04-25 to 2026-05-05 (not fully contained)."
          setup_api_calls:
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b1: $.data.id }
            - call: "POST /fm/utility-readings"
              payload: { building_id: "${b1}", meter_type: "ELECTRIC", period_start: "2026-05-01T00:00:00Z", period_end: "2026-05-31T23:59:59Z", consumption_kwh: 3000, cost: 600.00 }
              as: SustainabilityAnalyst
            - call: "POST /fm/utility-readings"
              payload: { building_id: "${b1}", meter_type: "WATER", period_start: "2026-05-01T00:00:00Z", period_end: "2026-05-31T23:59:59Z", consumption_kwh: 0, cost: 100.00 }
              as: SustainabilityAnalyst
            - call: "POST /fm/utility-readings"
              payload: { building_id: "${b1}", meter_type: "GAS", period_start: "2026-04-25T00:00:00Z", period_end: "2026-05-05T23:59:59Z", consumption_kwh: 5000, cost: 900.00 }
              as: SustainabilityAnalyst
          trigger:
            - call: "GET /fm/buildings/${b1}/kpi"
              payload: { window_start: "2026-05-01T00:00:00Z", window_end: "2026-05-31T23:59:59Z" }
              as: SustainabilityAnalyst
          assert:
            - "response.data.energy_intensity_kwh_per_sqm == 3.0 (3000 / 1000; the straddling GAS reading is excluded)"
            - "response.data.total_utility_cost == 700.00 (600.00 ELECTRIC + 100.00 WATER)"
            - "response.data.occupancy_pct == 0.00 and response.data.posture == OPEN"

  # ===========================================================================
  - section: validations
    instances:
      - name: duplicate_asset_tag_rejected
        claim_type: Violation → Error
        grounds:
          - "validations[priority=78]"
          - "errors[ERR_DUPLICATE_ASSET_TAG]"
        distinguishing_aspect: "asset_tag is globally unique: re-registering AHU-01 in a DIFFERENT building still returns 409 ERR_DUPLICATE_ASSET_TAG."
        test_recipe:
          setup: ["Two buildings; asset AHU-01 already registered in the first."]
          setup_api_calls:
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b1: $.data.id }
            - call: "POST /fm/buildings"
              payload: { name: "Tower Two", code: "BLD-2", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b2: $.data.id }
            - call: "POST /fm/assets"
              payload: { building_id: "${b1}", asset_tag: "AHU-01", category: "HVAC", criticality: "STANDARD" }
              as: FacilityManager
          trigger:
            - call: "POST /fm/assets"
              payload: { building_id: "${b2}", asset_tag: "AHU-01", category: "HVAC", criticality: "STANDARD" }
              as: FacilityManager
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 409 and ${err_id} == ERR_DUPLICATE_ASSET_TAG"
            - "GET /fm/buildings/${b2}/assets returns total_count == 0"

      - name: duplicate_building_code_and_space_code_rejected
        claim_type: Violation → Error
        grounds:
          - "validations[priority=78]"
          - "errors[ERR_DUPLICATE_BUILDING_CODE]"
          - "errors[ERR_DUPLICATE_SPACE_CODE]"
        distinguishing_aspect: "Building.code is globally unique (409 ERR_DUPLICATE_BUILDING_CODE) while Space.space_code is unique only WITHIN its building (409 ERR_DUPLICATE_SPACE_CODE), so the same space_code in another building is accepted."
        test_recipe:
          setup: ["Building BLD-1 with space S1, and a second building BLD-2."]
          setup_api_calls:
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b1: $.data.id }
            - call: "POST /fm/buildings"
              payload: { name: "Tower Two", code: "BLD-2", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b2: $.data.id }
            - call: "POST /fm/buildings/${b1}/spaces"
              payload: { space_code: "S1", floor: 1, area_sqm: 100, space_type: "OFFICE" }
              as: FacilityManager
          trigger:
            - call: "POST /fm/buildings"
              payload: { name: "Clone", code: "BLD-1", gross_area_sqm: 500 }
              as: FacilityManager
              captures: { err_building: $.data.error_id }
            - call: "POST /fm/buildings/${b1}/spaces"
              payload: { space_code: "S1", floor: 2, area_sqm: 50, space_type: "OFFICE" }
              as: FacilityManager
              captures: { err_space: $.data.error_id }
            - call: "POST /fm/buildings/${b2}/spaces"
              payload: { space_code: "S1", floor: 1, area_sqm: 50, space_type: "OFFICE" }
              as: FacilityManager
              captures: { s_ok: $.data.id }
          assert:
            - "${err_building} == ERR_DUPLICATE_BUILDING_CODE with HTTP 409"
            - "${err_space} == ERR_DUPLICATE_SPACE_CODE with HTTP 409"
            - "the S1 space in building ${b2} is created with 201 and Space.${s_ok}.space_code == S1"

      - name: pm_plan_asset_mismatch_rejected
        claim_type: Cross-entity validation
        grounds:
          - "validations[priority=65]"
          - "errors[ERR_PM_PLAN_ASSET_MISMATCH]"
        distinguishing_aspect: "A work order naming asset A1 but a PM plan belonging to asset A2 is rejected with 422 ERR_PM_PLAN_ASSET_MISMATCH."
        test_recipe:
          setup: ["Two assets in one building; a PM plan on the second asset."]
          setup_api_calls:
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b1: $.data.id }
            - call: "POST /fm/assets"
              payload: { building_id: "${b1}", asset_tag: "AHU-01", category: "HVAC", criticality: "STANDARD" }
              as: FacilityManager
              captures: { a1: $.data.id }
            - call: "POST /fm/assets"
              payload: { building_id: "${b1}", asset_tag: "AHU-02", category: "HVAC", criticality: "STANDARD" }
              as: FacilityManager
              captures: { a2: $.data.id }
            - call: "POST /fm/pm-plans"
              payload: { asset_id: "${a2}", interval_days: 30, grace_days: 5, next_due_at: "2026-06-01T00:00:00Z" }
              as: FacilityManager
              captures: { pm2: $.data.id }
          trigger:
            - call: "POST /fm/work-orders"
              payload: { building_id: "${b1}", asset_id: "${a1}", pm_plan_id: "${pm2}", wo_type: "PREVENTIVE", priority: "P2", estimated_labor_hours: 3, estimated_parts_cost: 200.00 }
              as: FacilityManager
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 422 and ${err_id} == ERR_PM_PLAN_ASSET_MISMATCH"
            - "GET /fm/work-orders?building_id=${b1} returns total_count == 0"

      - name: vendor_trade_mismatch_on_dispatch_rejected
        claim_type: Cross-entity validation
        grounds:
          - "validations[priority=62]"
          - "errors[ERR_VENDOR_TRADE_MISMATCH]"
        distinguishing_aspect: "Dispatching an ELEVATOR vendor to a work order whose asset category is HVAC returns 422 ERR_VENDOR_TRADE_MISMATCH, and the order stays NEW with no dispatch row."
        test_recipe:
          setup: ["An HVAC asset, an ELEVATOR vendor, and a NEW work order on that asset."]
          setup_api_calls:
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b1: $.data.id }
            - call: "POST /fm/assets"
              payload: { building_id: "${b1}", asset_tag: "AHU-01", category: "HVAC", criticality: "STANDARD" }
              as: FacilityManager
              captures: { a1: $.data.id }
            - call: "POST /fm/vendors"
              payload: { name: "LiftCo", trade: "ELEVATOR", hourly_rate: 90.00, sla_response_minutes: 60, sla_resolve_minutes: 240 }
              as: FacilityManager
              captures: { v1: $.data.id }
            - call: "POST /fm/work-orders"
              payload: { building_id: "${b1}", asset_id: "${a1}", wo_type: "CORRECTIVE", priority: "P3", estimated_labor_hours: 2, estimated_parts_cost: 0 }
              as: FacilityManager
              captures: { wo1: $.data.id, wo1_v: $.data.version }
          trigger:
            - call: "POST /fm/work-orders/${wo1}/dispatches"
              payload: { vendor_id: "${v1}", expected_work_order_version: "${wo1_v}" }
              as: FacilityManager
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 422 and ${err_id} == ERR_VENDOR_TRADE_MISMATCH"
            - "WorkOrder.${wo1}.status == NEW, dispatched_at == null, version == ${wo1_v} (no mutation)"
            - "GET /fm/dispatches?work_order_id=${wo1} returns total_count == 0"

      - name: statement_period_not_a_calendar_month_rejected
        claim_type: Temporal validation
        grounds:
          - "validations[priority=72]"
          - "errors[ERR_STATEMENT_PERIOD_INVALID]"
        distinguishing_aspect: "A statement period of 2026-05-01 to 2026-06-15 spans two calendar months and is rejected with 422 ERR_STATEMENT_PERIOD_INVALID."
        test_recipe:
          setup: ["ACTIVE lease with one allocation."]
          setup_api_calls:
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b1: $.data.id }
            - call: "POST /fm/buildings/${b1}/spaces"
              payload: { space_code: "S1", floor: 1, area_sqm: 100, space_type: "OFFICE" }
              as: FacilityManager
              captures: { s1: $.data.id }
            - call: "POST /fm/leases"
