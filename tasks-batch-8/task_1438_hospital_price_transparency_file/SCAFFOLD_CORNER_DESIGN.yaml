            - { call: "POST /transparency/shoppable-service-lists/${l1}/publish", as: TransparencyOfficer }
            - { call: "POST /transparency/shoppable-service-lists", payload: { facility_id: "${fac}", title: "L2", entries: [ { service_item_id: "${si}", display_name: "MRI with-cond", bundled_ancillary_item_ids: [ "${anc}" ], include_conditional_ancillaries: true, display_order: 1 } ] }, as: TransparencyOfficer, captures: { l2: $.data.id } }
            - { call: "POST /transparency/shoppable-service-lists/${l2}/certify", as: TransparencyOfficer }
            - { call: "POST /transparency/shoppable-service-lists/${l2}/publish", as: TransparencyOfficer }
          trigger:
            - { call: "GET /transparency/shoppable-service-lists/${l1}/display", as: Consumer, captures: { p1: "$.data.entries" } }
            - { call: "GET /transparency/shoppable-service-lists/${l2}/display", as: Consumer, captures: { p2: "$.data.entries" } }
          assert:
            - "L1 (flag false): entries[0].package_price_cents == 40000 (conditional ancillary skipped)"
            - "L2 (flag true): entries[0].package_price_cents == 40900 (40000 + floor(1000*0.9)=900)"

      - name: display_uses_pinned_record_and_flags_stale_after_correction
        claim_type: variant_selection
        grounds: ["calculations.consumer_display_price", "entities.ShoppableServiceList.fields.pinned_records", "state_machines.DiscrepancyReport.CORRECTION_APPROVED_to_CORRECTED"]
        distinguishing_aspect: "Version-pinning on approval: publish pins {charge_record_id, record_version == 3}; the display serves pinned values (package 40000) even after a correction supersedes the record (version 4, SUPERSEDED) — and then reports stale flags true."
        test_recipe:
          setup: ["Facility F (min 1, mandated 1); contract 40% ACTIVE; SI mandated gross 100000; cycle PUBLISHED with record R1 (cash 50000, derived 40000); list L PUBLISHED (pins R1 at version 3); full correction chain applied with proposed gross 80000"]
          setup_api_calls:
            - { call: "POST /transparency/facilities", payload: { name: "F", cms_certification_number: "CCN-K7", bed_count: 50, shoppable_min_entries: 1, mandated_min_entries: 1 }, as: PlatformAdmin, captures: { fac: $.data.id } }
            - { call: "POST /transparency/payers", payload: { name: "PA", payer_type: "COMMERCIAL" }, as: ContractManager, captures: { pa: $.data.id } }
            - { call: "POST /transparency/payer-contracts", payload: { facility_id: "${fac}", payer_id: "${pa}", confidentiality_clause: "DISCLOSE_ALLOWED", annual_volume: 100, effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }, as: ContractManager, captures: { ca: $.data.id } }
            - { call: "POST /transparency/service-items", payload: { facility_id: "${fac}", code: "70551", code_type: "CPT", description: "MRI", service_class: "SHOPPABLE", gross_charge_cents: 100000, cms_shoppable_mandated: true }, as: TransparencyOfficer, captures: { si: $.data.id } }
            - { call: "POST /transparency/payer-negotiated-rates", payload: { contract_id: "${ca}", service_item_id: "${si}", rate_type: "PERCENT_OF_GROSS", rate_percent: 40 }, as: ContractManager }
            - { call: "POST /transparency/payer-contracts/${ca}/activate", as: ContractManager }
            - { call: "POST /transparency/publication-cycles", payload: { facility_id: "${fac}", cycle_type: "MONTHLY", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", schema_version: "v2.0.0" }, as: TransparencyOfficer, captures: { cy: $.data.id } }
            - { call: "POST /transparency/standard-charge-records", payload: { facility_id: "${fac}", publication_cycle_id: "${cy}", service_item_id: "${si}", discounted_cash_cents: 50000 }, as: TransparencyOfficer, captures: { r1: $.data.id } }
            - { call: "POST /transparency/standard-charge-records/${r1}/validate", as: TransparencyOfficer }
            - { call: "POST /transparency/publication-cycles/${cy}/freeze", as: TransparencyOfficer, captures: { cy_v: $.data.version } }
            - { call: "POST /transparency/machine-readable-files", payload: { publication_cycle_id: "${cy}", file_format: "JSON", expected_publication_cycle_version: "${cy_v}" }, as: TransparencyOfficer, captures: { f1: $.data.id } }
            - { call: "POST /transparency/machine-readable-files/${f1}/validate", as: TransparencyOfficer }
            - { call: "POST /transparency/publication-cycles/${cy}/publish", as: TransparencyOfficer }
            - { call: "POST /transparency/shoppable-service-lists", payload: { facility_id: "${fac}", title: "L", entries: [ { service_item_id: "${si}", display_name: "MRI", bundled_ancillary_item_ids: [], include_conditional_ancillaries: false, display_order: 1 } ] }, as: TransparencyOfficer, captures: { lst: $.data.id } }
            - { call: "POST /transparency/shoppable-service-lists/${lst}/certify", as: TransparencyOfficer }
            - { call: "POST /transparency/shoppable-service-lists/${lst}/publish", as: TransparencyOfficer, captures: { pins: $.data.pinned_records } }
            - { call: "GET /transparency/shoppable-service-lists/${lst}/display", as: Consumer, captures: { stale0: "$.data.stale_any" } }
            - { call: "POST /transparency/discrepancy-reports", payload: { publication_cycle_id: "${cy}", standard_charge_record_id: "${r1}", reporter_type: "INTERNAL", description: "gross wrong" }, as: TransparencyOfficer, captures: { d1: $.data.id } }
            - { call: "POST /transparency/discrepancy-reports/${d1}/triage", payload: { outcome: "CONFIRMED" }, as: ComplianceAuditor }
            - { call: "POST /transparency/discrepancy-reports/${d1}/propose-correction", payload: { proposed_gross_charge_cents: 80000 }, as: TransparencyOfficer, as_user_id: "officer-a" }
            - { call: "POST /transparency/discrepancy-reports/${d1}/approve-correction", as: TransparencyOfficer, as_user_id: "officer-b" }
            - { call: "POST /transparency/discrepancy-reports/${d1}/apply-correction", as: TransparencyOfficer, as_user_id: "officer-a" }
          trigger:
            - { call: "GET /transparency/shoppable-service-lists/${lst}/display", as: Consumer, captures: { stale1: "$.data.stale_any" } }
          assert:
            - "at publish: pinned_records == [ { service_item_id: SI, charge_record_id: R1, record_version: 3 } ] (R1: v1 create, v2 validate, v3 publish cascade)"
            - "before correction: stale_any == false and entries[0].package_price_cents == 40000 (min(100000, 50000, 40000))"
            - "after correction: stale_any == true and entries[0].stale == true (pinned version 3 != current, record SUPERSEDED)"
            - "package_price_cents still == 40000 — the display keeps serving the PINNED record's snapshot values"

      - name: penalty_tiered_top_bracket_bed_200
        claim_type: constants_applied
        grounds: ["calculations.penalty_accrual"]
        distinguishing_aspect: "TIERED with bed_count == 200 selects the >= 200 bracket (40000/day): one day after rejection the accrual reads exactly 40000, unlike the 10000 tier-1 value asserted in §1.8."
        test_recipe:
          setup: ["Facility FZ (TIERED, bed_count 200) with full publish chain, attestation SUBMITTED 2026, REJECTED at 2026-08-01 with plan_due 2026-09-01"]
          setup_api_calls:
            - { call: "POST /transparency/facilities", payload: { name: "FZ", cms_certification_number: "CCN-K8", bed_count: 200, penalty_policy: "TIERED" }, as: PlatformAdmin, captures: { fz: $.data.id } }
            - { call: "POST /transparency/payers", payload: { name: "PZ", payer_type: "COMMERCIAL" }, as: ContractManager, captures: { pz: $.data.id } }
            - { call: "POST /transparency/payer-contracts", payload: { facility_id: "${fz}", payer_id: "${pz}", confidentiality_clause: "DISCLOSE_ALLOWED", annual_volume: 100, effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }, as: ContractManager, captures: { cz: $.data.id } }
