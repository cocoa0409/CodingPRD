  # Section: endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: catalog_list_pagination_and_filter
        claim_type: pagination_with_filtering
        grounds: [endpoints, response_envelope]
        distinguishing_aspect: "GET /catalog-items with limit=2&offset=0 on 3 PROVISIONS items returns 2 rows, total_count 3, has_more true; offset=2 returns 1 row, has_more false; category=BONDED filter returns only the bonded item."
        test_recipe:
          setup: ["4 catalog items: 3 PROVISIONS + 1 BONDED"]
          setup_api_calls:
            - call: "POST /chandlery/catalog-items"
              payload: { sku: "PG-1", name: "I1", category: PROVISIONS, bonded_eligible: false, requires_cold_chain: false, base_price_cents: 100, duty_rate_pct: 0 }
              as: ChandlerOpsManager
            - call: "POST /chandlery/catalog-items"
              payload: { sku: "PG-2", name: "I2", category: PROVISIONS, bonded_eligible: false, requires_cold_chain: false, base_price_cents: 100, duty_rate_pct: 0 }
              as: ChandlerOpsManager
            - call: "POST /chandlery/catalog-items"
              payload: { sku: "PG-3", name: "I3", category: PROVISIONS, bonded_eligible: false, requires_cold_chain: false, base_price_cents: 100, duty_rate_pct: 0 }
              as: ChandlerOpsManager
            - call: "POST /chandlery/catalog-items"
              payload: { sku: "PG-4", name: "I4", category: BONDED, bonded_eligible: true, requires_cold_chain: false, base_price_cents: 100, duty_rate_pct: 0 }
              as: ChandlerOpsManager
          trigger:
            - call: "GET /chandlery/catalog-items"
              payload: {}
              as: ChandlerSalesRep
          assert:
            - "GET /chandlery/catalog-items?category=PROVISIONS&limit=2&offset=0 => 2 items, total_count == 3, has_more == true"
            - "GET /chandlery/catalog-items?category=PROVISIONS&limit=2&offset=2 => 1 item, total_count == 3, has_more == false"
            - "GET /chandlery/catalog-items?category=BONDED => exactly 1 item (sku PG-4)"

