            - "Offer B targets Riverside Pavilion on 2026-08-24 for the same artist -- inside A's window, on a different stage, three days apart from a same-genre neighbour so genre adjacency (1 day) does not fire, and 12500000 + 500000 is far under the 40000000 cap."
