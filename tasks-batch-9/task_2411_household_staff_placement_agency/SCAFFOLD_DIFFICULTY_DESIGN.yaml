- rule_id: cross_entity_state_dependency
  instances:
  - name: requisition_creation_depends_on_the_client_nda_being_countersigned
    grounds: validations.nda_countersigned_before_scoping; state_machines.Client.PROSPECT -> ONBOARDED; entities.Client.confidentiality_agreement_status
    mechanism: A requisition may only exist for a household whose confidentiality agreement has been countersigned
      by the agency. A client that has signed but not been countersigned is still PROSPECT, and the gate reads the
      client row rather than anything in the request body.
    naive_implementation: Validate only that client_id resolves, so a half-executed NDA still lets work start.
    distinguishing_aspect: The identical POST /role-requisitions body is refused with ERR_NDA_NOT_COUNTERSIGNED while
      the client sits at SIGNED and accepted a moment later once the countersignature lands.
    test_recipe:
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        as: AgencyPrincipal
        payload:
          current_utc: '2026-08-01T00:00:00Z'
      - call: POST /clients
        as: AgencyPrincipal
        payload:
          household_name: Marchmont Row
          primary_contact_email: ops@marchmont.example
          region_code: DC
        captures:
          client_id: $.data.id
      - call: POST /clients/${client_id}/confidentiality-agreement
        as: Client
        payload:
          action: SIGN
          signatory_name: W. Marchmont
        captures:
          nda_status: $.data.confidentiality_agreement_status
          client_status: $.data.status
      - call: POST /fee-schedules
        as: AgencyPrincipal
        payload:
          role_type: CHEF
          comp_band_floor_cents: 0
          fee_percent_bps: 2000
          guarantee_window_days: 120
          effective_from: '2026-01-01'
      trigger:
      - call: POST /role-requisitions
        as: PlacementConsultant
        payload:
          client_id: ${client_id}
          role_type: CHEF
          first_year_compensation_cents: 9000000
          schedule_pattern: FIVE_TWO
          live_in_required: false
        captures:
          err: $.data.error_id
      - call: POST /clients/${client_id}/confidentiality-agreement
        as: AgencyPrincipal
        payload:
          action: COUNTERSIGN
        captures:
          nda_after: $.data.confidentiality_agreement_status
      - call: POST /role-requisitions
        as: PlacementConsultant
        payload:
          client_id: ${client_id}
          role_type: CHEF
          first_year_compensation_cents: 9000000
          schedule_pattern: FIVE_TWO
          live_in_required: false
        captures:
          req_id: $.data.id
      asserts:
      - after SIGN the client reads confidentiality_agreement_status == SIGNED and status == PROSPECT
      - the first trigger call returns 409 with error_id == ERR_NDA_NOT_COUNTERSIGNED
      - the countersignature returns 200 with confidentiality_agreement_status == COUNTERSIGNED, status == ONBOARDED
        and a non-null countersigned_at
      - the identical body then returns 201 with status == DRAFT and scoping_round == 0
      - GET /role-requisitions with client_id == ${client_id} returns exactly one row - the refused attempt created
