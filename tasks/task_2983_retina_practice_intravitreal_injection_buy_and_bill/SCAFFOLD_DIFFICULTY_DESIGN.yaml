            - *c_pol_np_ref
            - *c_pol_mcr_ref
            - *c_pol_mcr_bio
            - *c_pt1
            - *c_pt2
            - *c_pt3
            - *c_pt4
            - *c_cl1
            - *c_cl2
            - *c_cl3
            - *c_lot_ref
            - &c_img_p3_0801
