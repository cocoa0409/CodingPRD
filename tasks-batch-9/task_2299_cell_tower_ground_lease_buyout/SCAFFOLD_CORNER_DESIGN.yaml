          assert:
            - "CarrierTenancy.${t_anchor}.quality_points == 25"
            - "CarrierTenancy.${t_colo}.quality_points == 6"
            - "LeaseStream.${ls_id}.tenancy_quality_score == 31"
            - "StreamValuation.${val_id}.tenancy_quality_score_snapshot == 31"
            - "StreamValuation.${val_id}.discount_rate_bps == 1250"
            - "StreamValuation.${val_id}.growth_rate_bps == 300"
            - "StreamValuation.${val_id}.horizon_years == 40"
            - "StreamValuation.${val_id}.value_cents == 34987613"
            - "StreamValuation.${val_id}.max_bid_cents == 36736994"
            - "StreamValuation.${val_id}.status == DRAFT"
      - name: input_set_filtering_terminated_tenancy_leaves_the_quality_score_input_set
        claim_type: input_set_filtering
        grounds:
          - calculations.tenancy_quality_score
          - entities.CarrierTenancy.fields.status
          - endpoints[POST /lease-buyouts/carrier-tenancies/{id}/status]
          - calculations.stream_valuation_value
        distinguishing_aspect: |
          The declared input set is ACTIVE or HOLDOVER tenancies only, and the exclusion is observable in
          money because it crosses a discount tier: two ACTIVE INVESTMENT_GRADE ANCHORs score 80 and value
          the stream at 64151290 cents on the 700 bps tier, but once the second tenancy is TERMINATED the
          score falls to 40, the tier moves to 1000 bps and a fresh valuation is 44627011 — a difference of
          19523279 cents driven purely by set membership, while the terminated row keeps its historical
          quality_points 40.
        test_recipe:
          setup:
            - "A lease stream with rent 3600000 cents, FIXED_PCT 300 bps and 180 remaining months."
            - "Two ACTIVE INVESTMENT_GRADE ANCHOR tenancies (Vantage Wireless created first, Ridgeline Towers second)."
            - "One DRAFT LUMP_SUM_PERPETUAL valuation computed at score 80."
            - "The stream is still a PROSPECT, so no DELINQUENT cascade applies when the anchor is terminated."
