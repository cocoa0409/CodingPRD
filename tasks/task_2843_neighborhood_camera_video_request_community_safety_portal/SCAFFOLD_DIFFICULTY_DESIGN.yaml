      - name: discriminatory_removal_cascades_five_levels_to_system_opened_cases
        grounds:
          - endpoints[POST /neighborhood-safety/moderation-cases/{id}/decide]
          - calculations.strike_privilege_ladder
          - entities.Resident.fields.total_strike_score
          - entities.Resident.fields.post_privilege_state
          - state_machines.ResidentPost.state.PUBLISHED_to_UNDER_REVIEW
          - entities.ModerationCase.fields.opened_by_user_id
          - validations[priority=31]
          - errors.ERR_POSTING_SUSPENDED
        distinguishing_aspect: |
          Depth 5 again but from an entirely different trigger — a moderator's removal decision
          rather than a resident's privacy control — and the links are of different kinds: a
          counter increment (L1), a weighted re-derivation where the discrimination strike
          counts double (L2), a threshold-driven enum flip (L3), a fan-out that re-opens OTHER
          rows of the same entity in ascending created_at (L4), and the creation of brand new
          ModerationCase rows attributed to "system" rather than to any acting user (L5). L4
          is a set-valued step whose membership is itself filtered by
          RECENT_POST_LOOKBACK_DAYS and by state, so the cascade cannot be implemented as a
          straight-line update of one row per level.
