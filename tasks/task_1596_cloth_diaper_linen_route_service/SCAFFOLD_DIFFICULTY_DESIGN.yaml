            - { call: "POST /api/service-zones", payload: { zone_code: "Z-NORTH", service_weekdays: ["MON", "THU"], stop_cutoff_hours: 24, active: true }, as: PlatformAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /api/inventory-pools", payload: { size_code: "MEDIUM" }, as: PlatformAdmin, captures: { pool_m: $.data.id } }
            - { call: "POST /api/inventory-pools/${pool_m}/adjustments", payload: { adjustment_type: "ACQUIRE", units: 500 }, as: PlatformAdmin }
            - { call: "POST /api/customers", payload: { full_name: "Wi Ndow", email: "wi@x.com", service_zone_id: "${zone_id}", child_birthdate: "2026-01-15", child_size_code: "MEDIUM" }, as: PlatformAdmin, captures: { cust_a: $.data.id } }
            - { call: "POST /api/customers", payload: { full_name: "Wi Ndow2", email: "wi2@x.com", service_zone_id: "${zone_id}", child_birthdate: "2026-01-15", child_size_code: "MEDIUM" }, as: PlatformAdmin, captures: { cust_b: $.data.id } }
            - { call: "POST /api/subscriptions", payload: { customer_id: "${cust_a}", subscription_plan_id: "${plan_id}", service_zone_id: "${zone_id}", start_date: "2026-08-01", current_size_code: "MEDIUM", window_start_minutes: 480, window_end_minutes: 720 }, as: PlatformAdmin, captures: { sub_a: $.data.id } }
            - { call: "POST /api/subscriptions", payload: { customer_id: "${cust_b}", subscription_plan_id: "${plan_id}", service_zone_id: "${zone_id}", start_date: "2026-08-01", current_size_code: "MEDIUM", window_start_minutes: 480, window_end_minutes: 720 }, as: PlatformAdmin, captures: { sub_b: $.data.id } }
            - { call: "GET /api/starter-kits?subscription_id=${sub_a}", as: PlatformAdmin, captures: { kit_a: "$.data[0].id" } }
            - { call: "GET /api/starter-kits?subscription_id=${sub_b}", as: PlatformAdmin, captures: { kit_b: "$.data[0].id" } }
            - { call: "POST /api/starter-kits/${kit_a}/events", payload: { event_type: "ISSUE" }, as: PlantOperator }
            - { call: "POST /api/starter-kits/${kit_b}/events", payload: { event_type: "ISSUE" }, as: PlantOperator }
            - { call: "POST /api/customers/${cust_a}/events", payload: { event_type: "ACTIVATE" }, as: PlatformAdmin }
            - { call: "POST /api/customers/${cust_b}/events", payload: { event_type: "ACTIVATE" }, as: PlatformAdmin }
            - { call: "POST /api/subscriptions/${sub_a}/events", payload: { event_type: "ACTIVATE" }, as: PlatformAdmin }
            - { call: "POST /api/subscriptions/${sub_b}/events", payload: { event_type: "ACTIVATE" }, as: PlatformAdmin }
            - { call: "POST /api/routes", payload: { service_zone_id: "${zone_id}", route_date: "2026-08-03" }, as: PlatformAdmin, captures: { route_id: $.data.id } }
          trigger:
            - { call: "POST /api/route-stops", payload: { route_id: "${route_id}", subscription_id: "${sub_b}", window_start_minutes: 735, window_end_minutes: 800 }, as: PlatformAdmin, captures: { stop_new: $.data.id, stop_mk: $.data.is_makeup } }
            - { call: "POST /api/route-stops", payload: { route_id: "${route_id}", subscription_id: "${sub_b}", window_start_minutes: 734, window_end_minutes: 800 }, as: PlatformAdmin, captures: { err_id: $.data.error_id } }
          assert:
            - "window [735, 800) -> 201, is_makeup == true (735 >= 720 + 15: buffer satisfied exactly)"
            - "window [734, 800) -> $.data.error_id == ERR_STOP_WINDOW_CONFLICT (734 < 735: one minute short of the 15-minute buffer)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: swap_forward_reverse_conserves_units
        grounds:
          - calculations.inventory_available_units
          - state_machines.InventorySwap.STAGED_to_COMPLETED
        distinguishing_aspect: |
          Conserved quantity: physical unit counts. A forward swap (MEDIUM -> LARGE) followed
          by its compensating reverse swap (LARGE -> MEDIUM), each with full returns, leaves
          every bucket of both pools back at its pre-swap value and the conservation
          equation on_hand+reserved+in_transit+checked_out+in_wash+quarantined+lost+retired
          == total_acquired holding on BOTH pools.
        test_recipe:
          setup:
            - "ACTIVE STANDARD subscription size MEDIUM (kit 88 issued); MEDIUM pool acquired 500; LARGE pool acquired 200"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/subscription-plans", payload: { tier_code: "STANDARD", weekly_quota: 80, weekly_fee_cents: 3900, overage_rate_cents: 10, overage_cap_items: 20, deposit_cents: 18000, service_bags_per_week: 1, weight_policy: "COUNT_BASIS", kit_reserve_pct: 10 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /api/service-zones", payload: { zone_code: "Z-NORTH", service_weekdays: ["MON", "THU"], stop_cutoff_hours: 24, active: true }, as: PlatformAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /api/inventory-pools", payload: { size_code: "MEDIUM" }, as: PlatformAdmin, captures: { pool_m: $.data.id } }
            - { call: "POST /api/inventory-pools/${pool_m}/adjustments", payload: { adjustment_type: "ACQUIRE", units: 500 }, as: PlatformAdmin }
            - { call: "POST /api/inventory-pools", payload: { size_code: "LARGE" }, as: PlatformAdmin, captures: { pool_l: $.data.id } }
            - { call: "POST /api/inventory-pools/${pool_l}/adjustments", payload: { adjustment_type: "ACQUIRE", units: 200 }, as: PlatformAdmin }
            - { call: "POST /api/customers", payload: { full_name: "In Variant", email: "in@x.com", service_zone_id: "${zone_id}", child_birthdate: "2026-01-15", child_size_code: "MEDIUM" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /api/subscriptions", payload: { customer_id: "${cust_id}", subscription_plan_id: "${plan_id}", service_zone_id: "${zone_id}", start_date: "2026-08-01", current_size_code: "MEDIUM", window_start_minutes: 480, window_end_minutes: 720 }, as: PlatformAdmin, captures: { sub_id: $.data.id } }
            - { call: "GET /api/starter-kits?subscription_id=${sub_id}", as: PlatformAdmin, captures: { kit_id: "$.data[0].id" } }
            - { call: "POST /api/starter-kits/${kit_id}/events", payload: { event_type: "ISSUE" }, as: PlantOperator }
            - { call: "POST /api/customers/${cust_id}/events", payload: { event_type: "ACTIVATE" }, as: PlatformAdmin }
            - { call: "POST /api/subscriptions/${sub_id}/events", payload: { event_type: "ACTIVATE" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /api/inventory-swaps", payload: { subscription_id: "${sub_id}", to_size_code: "LARGE" }, as: Customer, as_user_id: "${cust_id}", captures: { swap1: $.data.id } }
            - { call: "GET /api/inventory-pools/${pool_l}", as: PlatformAdmin, captures: { poolL_v: $.data.version } }
            - { call: "POST /api/inventory-swaps/${swap1}/approve", payload: { expected_inventory_pool_version: "${poolL_v}" }, as: PlatformAdmin }
            - { call: "POST /api/inventory-swaps/${swap1}/events", payload: { event_type: "STAGE" }, as: PlantOperator }
            - { call: "POST /api/inventory-swaps/${swap1}/events", payload: { event_type: "COMPLETE", returned_old_count: 88 }, as: PlantOperator, captures: { swap1_status: $.data.status } }
            - { call: "POST /api/inventory-swaps", payload: { subscription_id: "${sub_id}", to_size_code: "MEDIUM" }, as: Customer, as_user_id: "${cust_id}", captures: { swap2: $.data.id } }
            - { call: "GET /api/inventory-pools/${pool_m}", as: PlatformAdmin, captures: { poolM_v: $.data.version } }
            - { call: "POST /api/inventory-swaps/${swap2}/approve", payload: { expected_inventory_pool_version: "${poolM_v}" }, as: PlatformAdmin }
            - { call: "POST /api/inventory-swaps/${swap2}/events", payload: { event_type: "STAGE" }, as: PlantOperator }
            - { call: "POST /api/inventory-swaps/${swap2}/events", payload: { event_type: "COMPLETE", returned_old_count: 88 }, as: PlantOperator, captures: { swap2_status: $.data.status } }
            - { call: "GET /api/inventory-pools/${pool_m}", as: PlatformAdmin, captures: { m_on: $.data.on_hand_units, m_res: $.data.reserved_units, m_tr: $.data.in_transit_units, m_out: $.data.checked_out_units, m_wash: $.data.in_wash_units, m_q: $.data.quarantined_units, m_lost: $.data.lost_units, m_ret: $.data.retired_units, m_tot: $.data.total_acquired_units } }
            - { call: "GET /api/inventory-pools/${pool_l}", as: PlatformAdmin, captures: { l_on: $.data.on_hand_units, l_res: $.data.reserved_units, l_tr: $.data.in_transit_units, l_out: $.data.checked_out_units, l_wash: $.data.in_wash_units, l_q: $.data.quarantined_units, l_lost: $.data.lost_units, l_ret: $.data.retired_units, l_tot: $.data.total_acquired_units } }
            - { call: "GET /api/subscriptions/${sub_id}", as: PlatformAdmin, captures: { sub_size: $.data.current_size_code } }
          assert:
            - "both swaps COMPLETED; Subscription.${sub_id}.current_size_code == MEDIUM again (forward then reverse)"
            - "MEDIUM pool: on_hand 324, reserved 0, in_transit 0, checked_out 88, in_wash 88, quarantined 0, lost 0, retired 0 -> sum 500 == total_acquired_units 500"
            - "LARGE pool: on_hand 112, reserved 0, in_transit 0, checked_out 0, in_wash 88, quarantined 0, lost 0, retired 0 -> sum 200 == total_acquired_units 200"

      - name: deposit_charge_and_refund_conserve_cents
        grounds:
          - calculations.deposit_refund_settlement
          - state_machines.LostItemCase.OPEN_to_CHARGED
        distinguishing_aspect: |
          Conserved quantity: money cents (distinct from physical units). The deposit ledger
          identity deposit_charged == deposit_held + deposit_applied + deposit_refunded holds
          after a CHARGE forward action and again after the compensating TERMINATE refund; a
          second charge-free customer ends with refunded == charged and held == 0.
