      - name: qc_deviation_threshold_boundaries
        claim_type: constants_applied
        excluded_because:
          difficulty_instance: "boundary_precision_check / qc_deviation_exactly_at_fail_limit_is_warn_and_one_thousandth_over_is_fail"
          rationale: "QC_WARN_SD_LIMIT and QC_FAIL_SD_LIMIT are pinned there at 1.500 (WARN) and 1.510 (FAIL) from phantom readings 1.0150 and 1.0151, including the rule that classification reads the already-rounded deviation_sd_units."
      - name: precision_lsc_multiplier_and_degrees_of_freedom
        claim_type: correct_result
        excluded_because:
          difficulty_instance: "boundary_precision_check / bmd_change_exactly_equal_to_lsc_is_significant_loss"
          rationale: "That instance certifies a device with 30 patients x 2 scans and rms_sd 0.0100, asserts lsc_g_cm2 0.0277 and precision_degrees_of_freedom 30, and then drives a BMD change of exactly -0.0277 through the interpretation, so LSC_MULTIPLIER 2.77 and MIN_PRECISION_DOF 30 are both already exercised."
      - name: frax_variant_selection_by_supplied_session
        claim_type: variant_selection
        excluded_because:
          difficulty_instance: "dual_variant_calc / frax_with_bmd_versus_without_bmd_diverges_on_identical_risk_profile"
          rationale: "Variant selection is the substance of that instance: supplying scan_session_id selects WITH_BMD and omitting it selects WITHOUT_BMD from the same RiskFactorProfile, with both probability pairs and the 14.4-point delta asserted."
      - name: mpr_variant_selection_by_source_policy
        claim_type: variant_selection
        excluded_because:
          difficulty_instance: "dual_variant_calc / mpr_claims_only_versus_all_sources_weighted_flips_adherence_status"
          rationale: "The adherence_source_policy selector is exercised there: identical AdherenceRefill rows give 0.659 PARTIAL under CLAIMS_ONLY and 0.824 ADHERENT under ALL_SOURCES_WEIGHTED, which also covers REFILL_PATIENT_REPORT_WEIGHT 0.5."
      - name: interval_and_action_six_step_ordering
        claim_type: correct_result
        excluded_because:
          difficulty_instance: "combinatorial_formula / interval_action_six_step_order_pins_initiate_treatment_over_payer_limited"
          rationale: "All six ordered steps of interval_and_action_determination are asserted there, including the step 6 first-match rule that yields INITIATE_TREATMENT rather than PAYER_LIMITED_INTERVAL when the payer floor raises the interval."

  - section: validations
    instances:
      - name: full_scan_to_report_pipeline_satisfies_every_validation
        claim_type: satisfaction_to_pass
        grounds:
          - validations
          - state_machines.ScanSession.SUBMITTED_to_ARCHIVED
          - state_machines.DiagnosticReport.DRAFT_to_FINALIZED
        distinguishing_aspect: "The canonical pipeline (register policy and device, certify precision, register patient, order, book, check in, measure, submit, review, report, finalize) must pass with no error at any step and leave every entity in its expected end state: appointment COMPLETED, order COMPLETED, session ARCHIVED, report FINALIZED with finalized_by_user_id phys-001, and the patient's ledger showing lifetime_screening_scan_count 1, open_scheduled_order_count 0 and baseline_report_id equal to last_finalized_report_id."
        test_recipe:
          setup:
