              payload: {}
              as: AccountManager
              as_user_id: "u_am_1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409"
            - "${err_id} == ERR_LINE_ITEM_INVALID_STATE"
            - "LineItem.${li_id}.line_item_status == ELIGIBLE"

