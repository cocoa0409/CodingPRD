  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_case_version_on_authorization_create_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.supportive-authorization-create-stale-case
          - errors.ERR_STALE_CASE_VERSION
          - endpoints[POST /supportive-service-authorizations]
        distinguishing_aspect: |
          The first authorization create bumps AssistanceCase.version by 1, so
          replaying the previously observed version on a second create is refused
          with 412 ERR_STALE_CASE_VERSION and no second authorization row exists;
          re-reading the case and echoing the fresh version lets the identical
          payload through.
        test_recipe:
          setup:
            - "A SINGLE_PARENT case of household size 3 with no income is ACTIVE with 2026-08 issued and has an ACTIVE COMMUNITY_SERVICE assignment of 20 weekly hours for 2026-08-01..2026-12-01."
