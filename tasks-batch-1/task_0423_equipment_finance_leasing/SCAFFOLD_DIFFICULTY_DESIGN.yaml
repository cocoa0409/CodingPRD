        distinguishing_aspect: |
          Category pair state (priority 5, ERR_INVALID_STATE) vs business_referential (priority 12,
          ERR_VENDOR_NOT_APPROVED): funding a lease still in ORIGINATION (not BOOKED) whose vendor is
          ALSO not approved must return ERR_NOT_BOOKED... no — fund's state guard is ERR_NOT_BOOKED
          (priority 13). Here we use a lease whose fund is attempted twice: the second fund sees
          funding_status==FUNDED (invalid state, priority 5) even though vendor was later suspended
          (priority 12) — ERR_INVALID_STATE wins.
