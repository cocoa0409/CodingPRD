    code: 200
    input: ["structure_id?", "permit_id?", "inspection_id?", "reverses_record_id?", "record_type?", "counted_in_cumulative?", "limit?", "offset?"]
    output: ImprovementRecord[]
    side_effects: []

  # ---------------------------------------------------------- DeterminationCase
  - method: POST
    path: "/floodplain/determination-cases"
    description: "Open a substantial improvement / substantial damage determination case; supersedes any prior open or determined case for the structure"
    roles: [FloodplainAdministrator]
    code: 201
    input: [structure_id, method, expected_structure_version]
    output: DeterminationCase
    side_effects:
      - "any DeterminationCase of the structure with status IN {OPEN, DETERMINED} -> WITHDRAWN; a withdrawn DETERMINED case reverts Structure.substantial_status to NONE"
      - "status = OPEN; trigger_source = ADMIN; anchor_record_id = Structure.anchor_record_id; determination_type derived from the anchor record's record_type; threshold_pct = SI_THRESHOLD_PCT"
      - "increments Structure.version by 1"

  - method: GET
    path: "/floodplain/determination-cases/{caseId}"
    description: "Read a determination case"
