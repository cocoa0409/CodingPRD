              payload: { code: "IND_M3", title: "Mid-year review complete", sequence_index: 3, required_contact_minutes: 0, required_observation_cycles: 0, required_credited_seminars: 0, license_stage_unlocked: "PROVISIONAL", gates_license_recommendation: false, prerequisite_milestone_id: "${m5_id}" }
              as: ProgramAdmin
            - call: "POST /milestones"
