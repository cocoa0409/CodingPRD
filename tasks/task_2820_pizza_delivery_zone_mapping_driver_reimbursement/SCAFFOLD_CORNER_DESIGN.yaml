  - section: cross_cutting_complexity_layers
    instances:
    - name: publishing_a_zone_version_against_the_pre_activation_store_version_is_stale
      claim_type: optimistic_concurrency
      grounds: [concurrency_rules.zone-version-create-stale-store, errors.ERR_STALE_STORE_VERSION, validations.priority_11, endpoints.POST /store-ops/zone-versions]
      distinguishing_aspect: 'The activation of the FIRST version is what invalidates the client''s token: a publisher who read the store before activating and then publishes a second, non-overlapping window with that same expected_store_version gets ERR_STALE_STORE_VERSION (412), and the retry with the re-read version succeeds unchanged.'
      test_recipe:
        setup: ['A store whose first zone version has been created and then ACTIVATED, which bumped Store.version by one.', 'The publisher still holds the version it captured at store creation, one behind the current value.']
        setup_api_calls:
        - call: POST /store-ops/_clock/set_current_utc
          payload: {current_utc: '2026-08-05T09:00:00Z'}
          as: StoreManager
          as_user_id: boot
        - call: POST /store-ops/stores
          payload: {store_number: '7421', name: Riverside, latitude_micro: 39000000, longitude_micro: -84000000}
          as: StoreManager
          as_user_id: boot
          captures: {store_id: $.data.id, store_v1: $.data.version}
        - call: POST /store-ops/zone-versions
          payload:
            store_id: ${store_id}
            polygon:
            - {latitude_micro: 38900000, longitude_micro: -84200000}
            - {latitude_micro: 39200000, longitude_micro: -84200000}
            - {latitude_micro: 39200000, longitude_micro: -83800000}
            - {latitude_micro: 38900000, longitude_micro: -83800000}
            effective_from: '2026-07-01T00:00:00Z'
            effective_to: '2026-09-01T00:00:00Z'
            expected_store_version: ${store_v1}
            max_drive_time_minutes: 40
            base_drive_minutes: 6
            minutes_per_mile: 3
            peak_surcharge_minutes: 7
            barrier_surcharge_minutes: 4
          as: StoreManager
          as_user_id: ${store_id}
          captures: {zv1_id: $.data.id}
        - call: POST /store-ops/zone-versions/${zv1_id}/activate
          payload: {}
          as: StoreManager
          as_user_id: ${store_id}
        trigger:
        - call: POST /store-ops/zone-versions
          payload:
            store_id: ${store_id}
            polygon:
            - {latitude_micro: 38900000, longitude_micro: -84200000}
            - {latitude_micro: 39200000, longitude_micro: -84200000}
            - {latitude_micro: 39200000, longitude_micro: -83800000}
            - {latitude_micro: 38900000, longitude_micro: -83800000}
            effective_from: '2026-09-01T00:00:00Z'
            effective_to: '2026-10-01T00:00:00Z'
            expected_store_version: ${store_v1}
            max_drive_time_minutes: 40
            base_drive_minutes: 6
            minutes_per_mile: 3
            peak_surcharge_minutes: 7
            barrier_surcharge_minutes: 4
          as: StoreManager
          as_user_id: ${store_id}
          captures: {e_stale: $.data.error_id}
        - call: GET /store-ops/stores/${store_id}
          payload: {}
          as: StoreManager
          as_user_id: ${store_id}
          captures: {store_v2: $.data.version}
        - call: POST /store-ops/zone-versions
          payload:
            store_id: ${store_id}
            polygon:
            - {latitude_micro: 38900000, longitude_micro: -84200000}
            - {latitude_micro: 39200000, longitude_micro: -84200000}
            - {latitude_micro: 39200000, longitude_micro: -83800000}
            - {latitude_micro: 38900000, longitude_micro: -83800000}
            effective_from: '2026-09-01T00:00:00Z'
            effective_to: '2026-10-01T00:00:00Z'
            expected_store_version: ${store_v2}
            max_drive_time_minutes: 40
            base_drive_minutes: 6
            minutes_per_mile: 3
            peak_surcharge_minutes: 7
            barrier_surcharge_minutes: 4
          as: StoreManager
          as_user_id: ${store_id}
          captures: {zv2_id: $.data.id, zv2_status: $.data.status, zv2_num: $.data.version_number}
        assert: ['${e_stale} == ''ERR_STALE_STORE_VERSION'' with HTTP 412, not 409 and not ERR_ZONE_WINDOW_OVERLAP', '${store_v2} == ${store_v1} + 1 — the activation was the only write between the two publishes', 'immediately after the 412, GET /store-ops/zone-versions?store_id=${store_id} still reports total_count 1', 'the retry returns HTTP 201 with ${zv2_status} == ''DRAFT'' and ${zv2_num} == 2', 'ZoneVersion.${zv1_id}.status is still ''ACTIVE'' and Store.${store_id}.active_zone_version_number == 1']
    - name: filing_a_second_insurance_certificate_with_the_pre_filing_driver_version_is_stale
