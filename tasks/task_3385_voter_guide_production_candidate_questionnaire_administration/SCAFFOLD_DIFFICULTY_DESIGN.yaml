            - { call: "POST /contests/${ct2}/forums", payload: { scheduled_start: "2026-10-10T12:00:00Z", scheduled_end: "2026-10-10T14:00:00Z", moderator_volunteer_id: "${mod2}" }, as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { f2_id: "$.data.id" } }
            - { call: "POST /contests/${ct2}/forums", payload: { scheduled_start: "2026-10-10T11:30:00Z", scheduled_end: "2026-10-10T13:00:00Z", moderator_volunteer_id: "${mod3}" }, as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "Forum 1 (10:00-12:00) created: 201, status PLANNED"
            - "Forum 2 (12:00-14:00) created: 201 — adjacency start == prior end is allowed under half-open [start, end) semantics"
            - "Forum 3 (11:30-13:00) rejected: error_id == ERR_FORUM_TIME_OVERLAP, HTTP 422 — it intersects both existing intervals in the same jurisdiction even though its contest differs"

