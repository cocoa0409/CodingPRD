          On POST /dispatch-assignments/{id}/complete, a dispatch in BOOKED (not EN_ROUTE) on a job whose
          compliance_status != CLEARED fails BOTH the state check (P6) and the compliance-safety check (P8);
          the lower-priority-number P6 wins => ERR_INVALID_STATE (state) over ERR_COMPLIANCE_NOT_CLEARED
          (business_safety). Different error-category pair than instance 2.
        test_recipe:
