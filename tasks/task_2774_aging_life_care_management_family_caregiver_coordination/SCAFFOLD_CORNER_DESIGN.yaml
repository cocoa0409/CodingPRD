      - name: risk_posture_crisis_branch_outranks_elevated_conditions
        claim_type: correct_result
        grounds:
          - calculations.client_risk_posture
          - calculations.assessment_composite_acuity
          - state_machines.CrisisEpisode.OPEN_to_STABILIZED
        distinguishing_aspect: "risk_posture is first-match: a client whose acuity_score is 82 reads ELEVATED, flips to CRISIS the moment an episode is OPEN, and returns to ELEVATED once that episode is STABILIZED because only OPEN and TRANSITION_OVERSIGHT episodes feed branch one."
        test_recipe:
          setup:
            - "CareManager Dana, supervisor Iris, Client Juno."
            - "One assessment with domain_scores safety 5, cognition 5, adl 3, medical_complexity 3, social_support 3, finances 3 taken to ACCEPTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T09:00:00Z" }
              as: PracticeAdmin
            - call: "POST /care/care-managers"
              payload: { full_name: "Dana Reyes", credential: "CMC", hourly_rate_cents: 22500 }
              as: PracticeAdmin
              captures: { cm_dana: $.data.id }
            - call: "POST /care/care-managers"
              payload: { full_name: "Iris Vance", credential: "CCM", hourly_rate_cents: 30000, is_supervisor: true }
              as: PracticeAdmin
              captures: { cm_iris: $.data.id }
            - call: "POST /care/clients"
              payload: { full_name: "Juno Castellanos", residence_setting: "PRIVATE_HOME" }
              as: PracticeAdmin
              captures: { cli: $.data.id, risk_initial: $.data.risk_posture, acuity_initial: $.data.acuity_score }
            - call: "POST /care/assessments"
              payload: { client_id: "${cli}", care_manager_id: "${cm_dana}", domain_scores: { adl: 3, cognition: 5, medical_complexity: 3, social_support: 3, safety: 5, finances: 3 } }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { asm: $.data.id }
            - call: "PATCH /care/assessments/${asm}/state"
              payload: { to_state: "SUBMITTED" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { screening: $.data.screening_acuity }
            - call: "PATCH /care/assessments/${asm}/state"
              payload: { to_state: "ACCEPTED" }
              as: PracticeSupervisor
              as_user_id: "${cm_iris}"
              captures: { comprehensive: $.data.comprehensive_acuity }
          trigger:
            - call: "GET /care/clients/${cli}"
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { acuity: $.data.acuity_score, risk_elevated: $.data.risk_posture }
            - call: "POST /care/crisis-episodes"
              payload: { client_id: "${cli}", trigger_type: "FALL" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { ep: $.data.id }
            - call: "GET /care/clients/${cli}"
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { risk_crisis: $.data.risk_posture }
            - call: "PATCH /care/crisis-episodes/${ep}/state"
              payload: { to_state: "STABILIZED" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { ep_status: $.data.status }
            - call: "GET /care/clients/${cli}"
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { risk_back: $.data.risk_posture }
          assert:
            - "At creation: data.acuity_score == 0 and data.risk_posture == \"ROUTINE\""
            - "Assessment SUBMITTED: screening_acuity == 73 (mean 22/6 x 20 = 73.33 -> 73); ACCEPTED: comprehensive_acuity == 82 (0.30x5 + 0.25x5 + 0.20x3 + 0.15x3 + 0.05x3 + 0.05x3 = 4.10, x20)"
            - "Client.${cli}.acuity_score == 82 and risk_posture == \"ELEVATED\" (82 >= 70) — no episode exists yet"
            - "With the episode OPEN: Client.${cli}.risk_posture == \"CRISIS\" — branch one wins even though the ELEVATED condition is also true"
            - "With the episode STABILIZED: Client.${cli}.risk_posture == \"ELEVATED\" again, because STABILIZED is outside {OPEN, TRANSITION_OVERSIGHT}"

      - name: conference_quorum_exact_half_of_four_invited_is_met
        claim_type: threshold_boundary
        grounds:
          - calculations.conference_quorum_evaluation
          - state_machines.FamilyConference.SCHEDULED_to_CONVENED
          - errors[ERR_QUORUM_NOT_MET]
        distinguishing_aspect: "The quorum threshold is the integer comparison attended * 2 >= invited: with four invited, two attendees including the surrogate is exactly half and passes, while one attendee is 2 >= 4 false and returns ERR_QUORUM_NOT_MET."
        test_recipe:
          setup:
            - "Client Kepa (capacity_status PRESUMED_CAPABLE) with four contacts: surrogate Lea plus Mira, Noe and Oda."
            - "Two conferences on different days, both inviting all four contacts."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
