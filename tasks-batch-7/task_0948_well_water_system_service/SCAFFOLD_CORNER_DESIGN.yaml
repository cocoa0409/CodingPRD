      - name: corner_calc_callback_window_right_closed_at_day_ninety_for_labor_only
        claim_type: Correct Result
        grounds: ["calculations.callback_window_eligibility", "calculations.warranty_coverage_state", "entities.CallbackClaim.fields.days_since_coverage_start", "errors[ERR_CALLBACK_OUT_OF_WARRANTY]"]
        distinguishing_aspect: |
          Against ONE completion at 2026-06-01T12:00:00Z the complaint_class picks the
          window. A LABOR claim submitted at exactly 2026-08-30T12:00:00Z is day 90 and
          is accepted 201 because the window is right-closed on whole days and the
          coverage_state test is STRICTLY greater; a PART claim submitted one day later
          is day 91 and is still accepted because its window is 365 days; the LABOR
          claim submitted at that same day-91 instant is refused 409
          ERR_CALLBACK_OUT_OF_WARRANTY. An implementation using a half-open 90-day
          window rejects the first claim, and one that applies a single window to both
          classes rejects the PART claim too.
