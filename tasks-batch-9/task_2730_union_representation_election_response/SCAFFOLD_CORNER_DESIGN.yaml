      - name: caller_supplied_counts_must_be_arithmetically_coherent
        claim_type: Violation → Error
        grounds:
          - validations[priority=25]
          - errors.ERR_UNIT_HEADCOUNT_ZERO
          - errors.ERR_CARD_COUNTS_INCONSISTENT
          - errors.ERR_CLAIM_COUNTS_INCONSISTENT
          - errors.ERR_VOTER_LIST_EMPTY
        distinguishing_aspect: |
          All four coherence errors are 422s that must be raised before any field is written: a showing
          verified against an empty unit, struck cards (20 + 15 + 10 + 0 = 45) exceeding the 40 submitted,
          unsupported claims exceeding material claims, and a list submitted with zero entries. Each leaves
          its target row exactly as it was, which distinguishes a pre-write guard from a post-write rollback
          that would still have bumped version.
        test_recipe:
          setup:
            - "petition 07-RC-340311 freshly in SCOPE_ANALYSIS with no classifications at all"
            - "the same petition later carries PROD and MAINT, both ruled INCLUDED, plus a DRAFT email message and a DRAFT voter list"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-08-03T09:00:00Z"}
              as: LaborRelationsDirector
            - call: "POST /labor-relations/petitions"
              payload: {"case_number": "07-RC-340311", "petition_type": "RC", "union_name": "United Plant Workers Local 812", "filed_date": "2026-08-03", "proposed_unit_description": "All production and maintenance employees at Plant 1", "claimed_employee_count": 120, "payroll_period_end": "2026-08-14"}
              as: LaborRelationsDirector
              captures: {"pet_id": "$.data.id"}
