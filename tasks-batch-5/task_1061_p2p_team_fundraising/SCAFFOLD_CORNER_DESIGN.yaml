          assert:
            - "the request is sent with NO X-User-Role and NO X-User-ID header"
            - "HTTP status == 401"
            - "error_id == ERR_UNAUTHENTICATED"

      - name: participant_cannot_settle_donation_returns_unauthorized
        claim_type: role_denial
        grounds: ["validations[priority=2]", "errors[ERR_UNAUTHORIZED]", "roles.PlatformAdmin"]
        distinguishing_aspect: "POST /api/donations/{id}/settle is a PlatformAdmin-exclusive operation, so a Participant caller returns 403 ERR_UNAUTHORIZED and the donation stays PENDING."
        test_recipe:
          setup: ["PUBLISHED campaign with an ACTIVE participant and one PENDING 10000-cent gift."]
          setup_api_calls:
            - call: "POST /api/organizations"
              payload: { name: "Riverside Health Foundation", ein: "12-3456789", contact_email: "ops@riverside.org" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /api/campaigns"
              payload: { organization_id: "${org_id}", title: "Autumn Walk 2026", goal_amount_cents: 1000000 }
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /api/campaigns/${camp_id}/publish"
              payload: {}
              as: CampaignManager
              as_user_id: "${org_id}"
            - call: "POST /api/participants"
              payload: { campaign_id: "${camp_id}", display_name: "Alice Reyes" }
