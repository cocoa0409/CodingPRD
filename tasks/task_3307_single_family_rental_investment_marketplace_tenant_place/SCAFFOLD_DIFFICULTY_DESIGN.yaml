  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: lease_period_overlap_half_open
        grounds:
          - validations[priority=7]
          - errors[ERR_LEASE_PERIOD_OVERLAP]
        distinguishing_aspect: |
          Half-open interval semantics on the Listing's lease resource:
          [lease_start, lease_end) intersection with an existing ACTIVE lease
          is rejected, but pure adjacency (new start == existing end) is
          permitted — a strict geometric boundary, not a fuzzy date compare.
        test_recipe:
          setup:
            - "Seller S, listing L with ACTIVE lease LE1 [2026-01-01, 2026-12-31)"
          setup_api_calls:
            - call: "POST /marketplace/sellers"
              payload: { legal_name: "Overlap Seller", seller_state: "TX", seller_type: "LLC" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /marketplace/listings"
              payload: { seller_id: "${s_id}", address_line: "81 Overlap St", listing_state: "TX", asking_price_cents: 10000000, listing_kind: "SINGLE", seller_asks_confidential: false }
              as: Seller
              as_user_id: "${s_id}"
              captures: { l_id: $.data.id }
            - call: "POST /marketplace/listings/${l_id}/leases"
              payload: { tenant_alias: "T-O1", monthly_rent_cents: 100000, lease_start: "2026-01-01T00:00:00Z", lease_end: "2026-12-31T00:00:00Z", deposit_cents: 100000 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { le1: $.data.id }
          trigger:
            - call: "POST /marketplace/listings/${l_id}/leases"
              payload: { tenant_alias: "T-O2", monthly_rent_cents: 100000, lease_start: "2026-06-01T00:00:00Z", lease_end: "2027-06-01T00:00:00Z", deposit_cents: 100000 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { e: $.data.error_id }
            - call: "POST /marketplace/listings/${l_id}/leases"
              payload: { tenant_alias: "T-O3", monthly_rent_cents: 100000, lease_start: "2026-12-31T00:00:00Z", lease_end: "2027-12-31T00:00:00Z", deposit_cents: 100000 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { le2: $.data.id }
          assert:
            - "First trigger error_id == ERR_LEASE_PERIOD_OVERLAP (2026-06-01 falls inside [2026-01-01, 2026-12-31))"
            - "Second trigger succeeds: adjacent lease starting exactly at LE1.lease_end created with id ${le2} (half-open: end excluded)"

      - name: payment_record_due_month_bucket
        grounds:
          - validations[priority=8]
          - errors[ERR_DUPLICATE_DUE_MONTH]
        distinguishing_aspect: |
          Different interval semantics (discrete calendar-month bucket, not a
          geometric interval) on a different resource (the Lease's payment
          ledger): two records due 2026-03-05 and 2026-03-25 collide because
          they share a UTC month, even though the dates do not overlap.
        test_recipe:
          setup:
            - "Seller S, listing L, lease LE with a March record already recorded"
          setup_api_calls:
            - call: "POST /marketplace/sellers"
              payload: { legal_name: "Bucket Seller", seller_state: "TX", seller_type: "LLC" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /marketplace/listings"
              payload: { seller_id: "${s_id}", address_line: "83 Bucket St", listing_state: "TX", asking_price_cents: 10000000, listing_kind: "SINGLE", seller_asks_confidential: false }
              as: Seller
              as_user_id: "${s_id}"
              captures: { l_id: $.data.id }
            - call: "POST /marketplace/listings/${l_id}/leases"
              payload: { tenant_alias: "T-B", monthly_rent_cents: 100000, lease_start: "2026-01-01T00:00:00Z", lease_end: "2027-01-01T00:00:00Z", deposit_cents: 100000 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { le: $.data.id }
            - call: "POST /marketplace/leases/${le}/payment-records"
              payload: { due_date: "2026-03-05T00:00:00Z", paid_date: "2026-03-05T00:00:00Z", amount_cents: 100000 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { pr1: $.data.id }
          trigger:
            - call: "POST /marketplace/leases/${le}/payment-records"
              payload: { due_date: "2026-03-25T00:00:00Z", amount_cents: 100000 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { e: $.data.error_id }
            - call: "POST /marketplace/leases/${le}/payment-records"
              payload: { due_date: "2026-04-01T00:00:00Z", amount_cents: 100000 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { pr2: $.data.id }
          assert:
            - "First trigger error_id == ERR_DUPLICATE_DUE_MONTH (same UTC month as 2026-03-05)"
            - "Second trigger succeeds: April record created with id ${pr2}"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: listed_count_conservation_across_submit_and_withdraw
        grounds:
          - calculations.bulk_discount_bps
          - state_machines.Listing.transitions
          - entities.Seller.fields.listed_count
        distinguishing_aspect: |
          Conserved quantity is the seller's derived listed_count (and the
          bulk_discount_bps derived from it): a SUBMIT forward action paired
          with a WITHDRAW compensating action must restore listed_count and
          bulk_discount_bps to their exact pre-submit values — no drift.
        test_recipe:
          setup:
            - "Seller S with exactly 2 SUBMITTED listings (bulk_discount_bps == 100); third listing L3 in DRAFT"
          setup_api_calls:
            - call: "POST /marketplace/sellers"
              payload: { legal_name: "Conserve Seller", seller_state: "TX", seller_type: "LLC" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /marketplace/listings"
              payload: { seller_id: "${s_id}", address_line: "91 C St", listing_state: "TX", asking_price_cents: 10000000, listing_kind: "SINGLE", seller_asks_confidential: false }
              as: Seller
              as_user_id: "${s_id}"
              captures: { l1: $.data.id }
            - call: "POST /marketplace/listings"
              payload: { seller_id: "${s_id}", address_line: "92 C St", listing_state: "TX", asking_price_cents: 10000000, listing_kind: "SINGLE", seller_asks_confidential: false }
              as: Seller
              as_user_id: "${s_id}"
              captures: { l2: $.data.id }
            - call: "POST /marketplace/listings"
              payload: { seller_id: "${s_id}", address_line: "93 C St", listing_state: "TX", asking_price_cents: 10000000, listing_kind: "SINGLE", seller_asks_confidential: false }
              as: Seller
              as_user_id: "${s_id}"
              captures: { l3: $.data.id }
            - call: "POST /marketplace/listings/${l1}/transition"
              payload: { action: "SUBMIT" }
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /marketplace/listings/${l2}/transition"
              payload: { action: "SUBMIT" }
              as: Seller
              as_user_id: "${s_id}"
            - call: "GET /marketplace/sellers/${s_id}"
              as: PlatformAdmin
              captures: { count_pre: $.data.listed_count, bps_pre: $.data.bulk_discount_bps }
          trigger:
            - call: "POST /marketplace/listings/${l3}/transition"
              payload: { action: "SUBMIT" }
              as: Seller
              as_user_id: "${s_id}"
            - call: "GET /marketplace/sellers/${s_id}"
              as: PlatformAdmin
              captures: { count_mid: $.data.listed_count, bps_mid: $.data.bulk_discount_bps }
            - call: "POST /marketplace/listings/${l3}/transition"
              payload: { action: "WITHDRAW" }
              as: Seller
              as_user_id: "${s_id}"
            - call: "GET /marketplace/sellers/${s_id}"
              as: PlatformAdmin
              captures: { count_post: $.data.listed_count, bps_post: $.data.bulk_discount_bps }
          assert:
            - "count_pre == 2 and bps_pre == 100"
            - "count_mid == 3 and bps_mid == 100"
            - "count_post == count_pre and bps_post == bps_pre (forward + compensating action leave the conserved quantity unchanged)"

      - name: escrow_cancel_compensates_listing_and_guarantee
        grounds:
          - state_machines.Escrow.transitions
          - state_machines.Listing.UNDER_CONTRACT_to_LISTED
          - state_machines.Guarantee.transitions
        distinguishing_aspect: |
          Different conserved quantity (listing saleability posture): an offer
          ACCEPT forward action moves Listing to UNDER_CONTRACT and holds the
          guarantee ISSUED; the compensating escrow CANCEL must restore Listing
          to LISTED and the guarantee posture re-derivable — specifically the
          voided guarantee must not remain ACTIVE and the listing must be
          sellable again (a new offer can be submitted without ERR_PRECONDITION).
