            - call: "POST /safety/cases/${case_b}/day-entries"
              payload: { day_type: "DAYS_AWAY", start_date: "2026-06-02", end_date: "2026-06-11" }
              as: SafetyOfficer
            - call: "POST /safety/cases/${case_b}/day-entries"
              payload: { day_type: "RESTRICTED", start_date: "2026-06-12", end_date: "2026-07-01" }
              as: SafetyOfficer
            - call: "POST /safety/hour-logs"
              payload: { establishment_id: "${est_id}", year: 2026, month: 1, hours_worked: 5000, employment_count: 10 }
              as: RecordkeepingCoordinator
              captures: { hl_1: $.data.id }
            - call: "POST /safety/hour-logs/${hl_1}/approve"
              payload: {}
              as: RecordkeepingCoordinator
            - call: "POST /safety/hour-logs"
              payload: { establishment_id: "${est_id}", year: 2026, month: 2, hours_worked: 5000, employment_count: 10 }
              as: RecordkeepingCoordinator
              captures: { hl_2: $.data.id }
            - call: "POST /safety/hour-logs/${hl_2}/approve"
              payload: {}
