            - { call: "POST /fleet-wash/routes", payload: { route_date: "2026-08-05", van_id: "${van_id}", lead_technician_id: "${tech_id}" }, as: Dispatcher, captures: { route_id: $.data.id, route_v: $.data.version } }
            - { call: "POST /fleet-wash/routes/${route_id}/stops", payload: { wash_order_id: "${order_id}", expected_route_version: "${route_v}" }, as: Dispatcher, captures: { stop_id: $.data.id } }
            - { call: "POST /fleet-wash/routes/${route_id}/events", payload: { event_type: "PUBLISH" }, as: Dispatcher }
            - { call: "POST /fleet-wash/routes/${route_id}/stops/${stop_id}/events", payload: { event_type: "ARRIVE" }, as: Technician, as_user_id: "${tech_id}" }
            - { call: "POST /fleet-wash/wash-orders/${order_id}/events", payload: { event_type: "START" }, as: Technician, as_user_id: "${tech_id}" }
            - { call: "POST /fleet-wash/wash-orders/${order_id}/events", payload: { event_type: "COMPLETE", vehicles_washed_ids: ["${v1}"] }, as: Technician, as_user_id: "${tech_id}" }
            - { call: "POST /fleet-wash/damage-claims", payload: { wash_order_id: "${order_id}", area: "GLASS", claimed_amount_cents: 9000, description: "chip" }, as: Customer, as_user_id: "${cust_id}", captures: { dc_id: $.data.id } }
            - { call: "POST /fleet-wash/damage-claims/${dc_id}/events", payload: { event_type: "START_REVIEW" }, as: QualityAuditor, as_user_id: "auditor-1" }
            - { call: "POST /fleet-wash/damage-claims/${dc_id}/events", payload: { event_type: "APPROVE" }, as: QualityAuditor, as_user_id: "auditor-1" }
          trigger:
            - { call: "POST /fleet-wash/damage-claims/${dc_id}/events", payload: { event_type: "MARK_PAID" }, as: QualityAuditor, as_user_id: "auditor-1", captures: { err: $.data.error_id } }
            - { call: "POST /fleet-wash/damage-claims/${dc_id}/events", payload: { event_type: "MARK_PAID" }, as: QualityAuditor, as_user_id: "auditor-2", captures: { st: $.data.status, pb: $.data.paid_by } }
          assert:
            - "err == ERR_SEGREGATION_OF_DUTIES with http 403 (approver auditor-1 cannot pay)"
            - "st == PAID and pb == auditor-2 (different auditor succeeds)"

      - name: customer_cannot_create_route
        claim_type: role_denial
        grounds: ["roles[Dispatcher].exclusive_operations", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Route management is Dispatcher-exclusive; a Customer role call to POST /fleet-wash/routes is denied ERR_FORBIDDEN (403) before existence checks."
        test_recipe:
          setup: ["a van and technician exist so only the role check fails"]
          setup_api_calls:
            - { call: "POST /fleet-wash/vans", payload: { name: "VAN-B2", tank_capacity_gal: 100, reclaim_system: "BASIC" }, as: PlatformAdmin, captures: { van_id: $.data.id } }
            - { call: "POST /fleet-wash/technicians", payload: { name: "Tech B2" }, as: PlatformAdmin, captures: { tech_id: $.data.id } }
          trigger:
            - { call: "POST /fleet-wash/routes", payload: { route_date: "2026-08-05", van_id: "${van_id}", lead_technician_id: "${tech_id}" }, as: Customer, as_user_id: "00000000-0000-4000-8000-000000000001", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN with http 403; no route is created"

      - name: technician_cannot_file_damage_claim
        claim_type: role_denial
        grounds: ["roles[Customer].exclusive_operations", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Damage-claim filing is Customer-exclusive; a Technician receives ERR_FORBIDDEN even with a well-formed payload."
        test_recipe:
          setup: ["a technician entity exists (identity source)"]
          setup_api_calls:
            - { call: "POST /fleet-wash/technicians", payload: { name: "Tech B3" }, as: PlatformAdmin, captures: { tech_id: $.data.id } }
          trigger:
            - { call: "POST /fleet-wash/damage-claims", payload: { wash_order_id: "00000000-0000-4000-8000-000000000002", area: "GLASS", claimed_amount_cents: 1000, description: "x" }, as: Technician, as_user_id: "${tech_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN with http 403 (role check at priority 2 precedes the 404 existence check)"

      - name: customer_cannot_touch_other_customers_order
        claim_type: role_denial
        grounds: ["validations[priority=2]", "roles[Customer]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Ownership scoping for entity_backed roles: Customer B acting on Customer A's wash order is ERR_FORBIDDEN even though Customer is an allowed role for the endpoint."
        test_recipe:
          setup: ["customer A with site/vehicle and a DRAFT order; customer B exists"]
          setup_api_calls:
            - { call: "POST /fleet-wash/customers", payload: { name: "BA", email: "ba@x.com" }, as: PlatformAdmin, captures: { ca: $.data.id } }
            - { call: "POST /fleet-wash/customers", payload: { name: "BB", email: "bb@x.com" }, as: PlatformAdmin, captures: { cb: $.data.id } }
            - { call: "POST /fleet-wash/sites", payload: { customer_id: "${ca}", name: "BAS", lot_size_sqft: 8000, containment_type: "VACUUM_RECOVERY", water_reclaim_required: false, max_discharge_gal: 100 }, as: PlatformAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${ca}", site_id: "${site_id}", plate: "BA1", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { va: $.data.id } }
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${ca}", site_id: "${site_id}", vehicle_ids: ["${va}"], scheduled_window_start: "2026-08-06T13:00:00Z", scheduled_window_end: "2026-08-06T14:00:00Z" }, as: PlatformAdmin, captures: { order_id: $.data.id } }
          trigger:
            - { call: "POST /fleet-wash/wash-orders/${order_id}/events", payload: { event_type: "CONFIRM" }, as: Customer, as_user_id: "${cb}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN with http 403; WashOrder.${order_id}.status remains DRAFT"

      - name: auditor_cannot_report_incident
        claim_type: role_denial
        grounds: ["roles[ComplianceOfficer].exclusive_operations", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Compliance-incident reporting is ComplianceOfficer-exclusive; QualityAuditor is denied ERR_FORBIDDEN."
        test_recipe:
          setup: ["a site exists so only the role check fails"]
          setup_api_calls:
            - { call: "POST /fleet-wash/customers", payload: { name: "B5", email: "b5@x.com" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /fleet-wash/sites", payload: { customer_id: "${cust_id}", name: "B5S", lot_size_sqft: 8000, containment_type: "VACUUM_RECOVERY", water_reclaim_required: false, max_discharge_gal: 100 }, as: PlatformAdmin, captures: { site_id: $.data.id } }
          trigger:
            - { call: "POST /fleet-wash/compliance-incidents", payload: { site_id: "${site_id}", incident_type: "SPILL", notes: "auditor attempt" }, as: QualityAuditor, as_user_id: "auditor-9", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN with http 403"

  - section: cross_cutting_layers
    instances:
      - name: occ_stale_stop_add_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[route-stop-add-stale-route]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Adding stop B with the pre-add-A route version is rejected 412 ERR_STALE_VERSION; re-reading the route and replaying with the current version succeeds and increments Route.version."
        test_recipe:
          setup: ["RETAIL customer; site; 2 SEDANs; two CONFIRMED orders A and B; BASIC van loaded 96; DRAFT route (version 1 captured)"]
          setup_api_calls:
            - { call: "POST /fleet-wash/customers", payload: { name: "X1", email: "x1@x.com" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /fleet-wash/sites", payload: { customer_id: "${cust_id}", name: "X1S", lot_size_sqft: 8000, containment_type: "VACUUM_RECOVERY", water_reclaim_required: false, max_discharge_gal: 100 }, as: PlatformAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "X1A", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v1: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "X1B", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v2: $.data.id } }
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${cust_id}", site_id: "${site_id}", vehicle_ids: ["${v1}"], scheduled_window_start: "2026-08-05T13:00:00Z", scheduled_window_end: "2026-08-05T14:00:00Z" }, as: PlatformAdmin, captures: { oa_id: $.data.id } }
            - { call: "POST /fleet-wash/wash-orders/${oa_id}/events", payload: { event_type: "CONFIRM" }, as: Dispatcher }
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${cust_id}", site_id: "${site_id}", vehicle_ids: ["${v2}"], scheduled_window_start: "2026-08-05T14:00:00Z", scheduled_window_end: "2026-08-05T15:00:00Z" }, as: PlatformAdmin, captures: { ob_id: $.data.id } }
            - { call: "POST /fleet-wash/wash-orders/${ob_id}/events", payload: { event_type: "CONFIRM" }, as: Dispatcher }
            - { call: "POST /fleet-wash/vans", payload: { name: "VAN-X1", tank_capacity_gal: 100, reclaim_system: "BASIC" }, as: PlatformAdmin, captures: { van_id: $.data.id } }
            - { call: "POST /fleet-wash/vans/${van_id}/events", payload: { event_type: "LOAD_WATER", gallons: 96 }, as: Dispatcher }
            - { call: "POST /fleet-wash/technicians", payload: { name: "Tech X1" }, as: PlatformAdmin, captures: { tech_id: $.data.id } }
            - { call: "POST /fleet-wash/routes", payload: { route_date: "2026-08-05", van_id: "${van_id}", lead_technician_id: "${tech_id}" }, as: Dispatcher, captures: { route_id: $.data.id, route_v1: $.data.version } }
          trigger:
            - { call: "POST /fleet-wash/routes/${route_id}/stops", payload: { wash_order_id: "${oa_id}", expected_route_version: "${route_v1}" }, as: Dispatcher, captures: { sa: $.data.id } }
            - { call: "POST /fleet-wash/routes/${route_id}/stops", payload: { wash_order_id: "${ob_id}", expected_route_version: "${route_v1}" }, as: Dispatcher, captures: { err: $.data.error_id } }
            - { call: "GET /fleet-wash/routes/${route_id}", payload: {}, as: Dispatcher, captures: { route_v2: $.data.version } }
            - { call: "POST /fleet-wash/routes/${route_id}/stops", payload: { wash_order_id: "${ob_id}", expected_route_version: "${route_v2}" }, as: Dispatcher, captures: { sb: $.data.id, sb_seq: $.data.sequence } }
            - { call: "GET /fleet-wash/routes/${route_id}", payload: {}, as: Dispatcher, captures: { route_v3: $.data.version } }
          assert:
            - "Second add with the stale version: err == ERR_STALE_VERSION with http 412"
            - "Replay with the observed current version: sb_seq == 2 and route_v3 == route_v2 + 1 (version increments on every mutation)"

      - name: occ_stale_contract_amend_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[fleet-contract-amend-stale-contract]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PUT with the pre-ACTIVATE contract version is rejected 412; PUT with the current version applies the amendment and bumps version (third OCC parent: WashOrder reschedule is exercised by difficulty instance wash_order_cycle_and_billing_dimension)."
        test_recipe:
          setup: ["FLEET customer; contract created (version 1 captured) then ACTIVATEd (version 2)"]
          setup_api_calls:
            - { call: "POST /fleet-wash/customers", payload: { name: "X2", email: "x2@x.com", customer_type: "FLEET" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /fleet-wash/fleet-contracts", payload: { customer_id: "${cust_id}", start_date: "2026-01-01", end_date: "2026-12-31", monthly_minimum_cents: 200000, sedan_rate_cents: 3000, suv_pickup_rate_cents: 4000, van_boxtruck_rate_cents: 6000, heavy_fleet_rate_cents: 10000 }, as: PlatformAdmin, captures: { fc_id: $.data.id, fc_v1: $.data.version } }
            - { call: "POST /fleet-wash/fleet-contracts/${fc_id}/events", payload: { event_type: "ACTIVATE" }, as: PlatformAdmin }
          trigger:
            - { call: "PUT /fleet-wash/fleet-contracts/${fc_id}", payload: { expected_fleet_contract_version: "${fc_v1}", monthly_minimum_cents: 250000 }, as: PlatformAdmin, captures: { err: $.data.error_id } }
            - { call: "GET /fleet-wash/fleet-contracts/${fc_id}", payload: {}, as: PlatformAdmin, captures: { fc_v2: $.data.version } }
            - { call: "PUT /fleet-wash/fleet-contracts/${fc_id}", payload: { expected_fleet_contract_version: "${fc_v2}", monthly_minimum_cents: 250000 }, as: PlatformAdmin, captures: { fc_min: $.data.monthly_minimum_cents, fc_v3: $.data.version } }
          assert:
            - "Stale amend: err == ERR_STALE_VERSION with http 412"
            - "Current-version amend: fc_min == 250000 and fc_v3 == fc_v2 + 1"

      - name: cascade_end_to_end_weather_and_compliance
        claim_type: cascading_side_effects
        grounds: ["calculations.weather_policy_evaluation", "state_machines.ComplianceIncident.UNDER_REVIEW_to_CONFIRMED"]
        excluded_because:
          difficulty_instance: weather_freeze_cascade
          rationale: "N-level cascade ordering, released-water reconciliation, and partial state coverage are asserted end-to-end by §1.8 instances weather_freeze_cascade and compliance_confirm_cascade."

  - section: consistency_model
    instances:
      - name: immediate_consistency_quote_visible_in_create_response
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model", "calculations.wash_quote_cents"]
        distinguishing_aspect: "Immediate consistency: the POST /wash-orders response itself carries the computed quote_cents (3780 for 1 SEDAN at a reclaim site) with no separate read required."
        test_recipe:
          setup: ["RETAIL customer; reclaim site (BERMS, water_reclaim_required, max_discharge_gal 1000); 1 SEDAN"]
          setup_api_calls:
            - { call: "POST /fleet-wash/customers", payload: { name: "Y1", email: "y1@x.com" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /fleet-wash/sites", payload: { customer_id: "${cust_id}", name: "Y1S", lot_size_sqft: 60000, containment_type: "BERMS", water_reclaim_required: true, max_discharge_gal: 1000 }, as: PlatformAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "Y1", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v1: $.data.id } }
          trigger:
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${cust_id}", site_id: "${site_id}", vehicle_ids: ["${v1}"], scheduled_window_start: "2026-08-06T13:00:00Z", scheduled_window_end: "2026-08-06T14:00:00Z" }, as: PlatformAdmin, captures: { q: $.data.quote_cents, st: $.data.status } }
          assert:
            - "q == 3780 in the creation response (3500 + round_half_up(3500 x 0.08) = 280) and st == DRAFT"
