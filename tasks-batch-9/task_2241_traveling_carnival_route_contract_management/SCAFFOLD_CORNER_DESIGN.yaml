              payload: { jurisdiction_id: "${jur_v1}", name: "Franklin County Fairgrounds", city: "Columbus", lot_area_sqft: 100000, power_amps_available: 1200, expected_attendance: 20001, lot_surface: "GRAVEL" }
              as: PlatformAdmin
              captures: { ven_v1: "$.data.id" }
            - call: "POST /workers"
              payload: { full_name: "Rigger One", employment_type: "PERMANENT", hourly_rate_cents: 2000 }
              as: PlatformAdmin
              captures: { rig_v1: "$.data.id" }
            - call: "POST /routes"
              payload: { name: "2026 Midwest Swing", season_year: 2026, home_base_state: "OH" }
              as: RouteManager
