            - "MembershipAgreement.${ag_id}.status == ACTIVE again, the OVERDUE state having been cleared by the single reschedule"
            - "after a second clock advance to 2027-01-15 the same visit returns to MISSED and the agreement returns to OVERDUE, proving the loop is reachable twice"
  # ================================================================ RULE 4
  - rule_id: transitive_cascade
    instances:
      - name: discount_floor_cascade_through_override_limit
        grounds:
          - state_machines.Appointment.DISPATCHED_to_COMPLETED
          - validations[priority=16]
          - validations[priority=17]
          - calculations.discount_floor_check
        distinguishing_aspect: |
          Depth 3: approving an over-ceiling quote is refused (hop 1), which leaves pricing_status
          OVERRIDE_PENDING (hop 2) so no QuoteApproved guard exists, which in turn leaves
          authorization_required true and blocks completion (hop 3) via the discount floor.
        test_recipe:
          setup:
            - "one branch, one HVAC technician, one published 300000-cent HVAC task valued at 300000 cents"
