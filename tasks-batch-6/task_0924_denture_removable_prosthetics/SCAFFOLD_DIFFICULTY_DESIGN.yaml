  # =========================================================================
  # Rule 2 -- combinatorial formulas across different modes (a), (b), (c)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: installment_rounding_residual_lands_on_final_row
        grounds:
          - calculations.installment_schedule
          - entities.Installment.fields.amount
          - entities.Installment.fields.is_residual_installment
          - entities.PaymentPlan.fields.principal_amount
        distinguishing_aspect: |
          MODE (b) -- nested rounding where the order matters. Rounding the per-installment
          base first and putting the whole residual on the final row gives
          six rows of 137.14 and a seventh of 137.16; summing 960.00/7 and rounding once
          would give seven rows of 137.14 and lose 0.02 of principal.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-01T00:00:00Z."
            - "One patient with one FLEXIBLE_PARTIAL case carrying one MAXILLARY arch past complete-exam, so fee_schedule_total is 1200.00, billed_amount is 1200.00 and patient_responsibility_amount is 1200.00."
          setup_api_calls:
            - call: "POST /prosthetics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-root"
            - call: "POST /prosthetics/patients"
              payload: { full_name: "Dilys Marchetti", date_of_birth: "1955-04-18", phone: "555-0244" }
              as: FrontOffice
              as_user_id: "fo-lindgren"
              captures: { pat_id: $.data.id }
            - call: "POST /prosthetics/cases"
              payload: { patient_id: "${pat_id}", prosthesis_type: "FLEXIBLE_PARTIAL" }
              as: FrontOffice
              as_user_id: "fo-lindgren"
              captures: { case_id: $.data.id }
            - call: "POST /prosthetics/case-arches"
              payload: { case_id: "${case_id}", arch_position: "MAXILLARY" }
              as: Prosthodontist
              as_user_id: "dr-nunes"
            - call: "POST /prosthetics/cases/${case_id}/complete-exam"
              payload: {}
              as: Prosthodontist
              as_user_id: "dr-nunes"
            - call: "GET /prosthetics/cases/${case_id}"
              payload: {}
              as: FrontOffice
              as_user_id: "fo-lindgren"
              captures: { case_v: $.data.version }
          trigger:
            - call: "POST /prosthetics/payment-plans"
              payload: { patient_id: "${pat_id}", case_id: "${case_id}", installment_count: 7, down_payment_amount: 240.00, first_due_date: "2026-06-01T00:00:00Z", frequency: "MONTHLY", expected_prosthesis_case_version: "${case_v}", pay_in_full: false }
              as: FrontOffice
              as_user_id: "fo-lindgren"
              captures: { plan_id: $.data.id }
          assert:
            - "PaymentPlan.${plan_id}.principal_amount == 960.00"
            - "PaymentPlan.${plan_id}.outstanding_amount == 960.00"
            - "PaymentPlan.${plan_id}.paid_amount == 0.00"
            - "GET /prosthetics/installments with payment_plan_id ${plan_id} returns total_count 7"
            - "the Installment with sequence_number 1 has amount == 137.14 and is_residual_installment == false"
            - "the Installment with sequence_number 6 has amount == 137.14 and is_residual_installment == false"
            - "the Installment with sequence_number 7 has amount == 137.16 and is_residual_installment == true"
            - "the sum of Installment.amount across the seven rows == 960.00"
            - "the Installment with sequence_number 1 has due_date == 2026-06-01T00:00:00.000Z and the row with sequence_number 7 has due_date == 2026-11-28T00:00:00.000Z"

      - name: prompt_pay_discount_tier_keyed_on_pre_discount_subtotal
        grounds:
          - calculations.case_total_due
          - entities.ProsthesisCase.fields.prompt_pay_discount_amount
          - entities.ProsthesisCase.fields.patient_responsibility_amount
          - calculations.lab_rush_fee
        distinguishing_aspect: |
          MODE (c) -- circular-looking dependency with a pinned evaluation order. The
          discount rate is keyed on the step-6 pre-discount responsibility 2500.00, which
          sits exactly on PROMPT_PAY_TIER_2_MIN, so the discount is 125.00 and the final
          responsibility is 2375.00; an implementation that re-tiers on the post-discount
          2375.00 would fall to the 0.03 band and produce 2425.00.
        test_recipe:
