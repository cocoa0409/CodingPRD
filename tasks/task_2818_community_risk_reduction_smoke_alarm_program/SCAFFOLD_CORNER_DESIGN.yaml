            - call: "POST /crr/visits/${v_id}/complete"
              payload: { install_outcome: "DEFERRED", deferral_reason: "LANDLORD_APPROVAL_REQUIRED" }
              as: CrrTechnician
              as_user_id: "${crew_id}"
            - call: "GET /crr/households/${hh_id}"
              as: CanvassCoordinator
              captures: { hh_v1: $.data.version }
            - call: "POST /crr/escape-plans"
              payload: { household_id: "${hh_id}", expected_household_version: "${hh_v1}", primary_exit_per_sleeping_area: true, secondary_exit_count: 1, meeting_point_description: "Mailbox at the kerb" }
              as: CanvassCoordinator
              captures: { plan1_id: $.data.id }
          trigger:
            - call: "POST /crr/escape-plans"
              payload: { household_id: "${hh_id}", expected_household_version: "${hh_v1}", primary_exit_per_sleeping_area: true, secondary_exit_count: 2, meeting_point_description: "Corner of Birch Row and 4th" }
              as: CanvassCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "${err} == ERR_STALE_HOUSEHOLD_VERSION"
            - "EscapePlan.${plan1_id}.status == DRAFT (no partial supersede)"
            - "Household.${hh_id}.live_escape_plan_id == ${plan1_id}"
            - "Household.${hh_id}.version == ${hh_v1} + 1 (bumped once by the accepted create, not by the refusal)"
            - "GET /crr/escape-plans?household_id=${hh_id} returns total_count 1"

      - name: selector_skips_a_lot_whose_grant_can_no_longer_afford_it
        claim_type: selector_policy
        grounds:
          - calculations.device_lot_selector
          - entities.PartnerGrant.available_cents
          - endpoints[POST /crr/installations]
        distinguishing_aspect: "The eligibility predicate's money clause (available_cents >= lot.unit_cost_cents) is evaluated per candidate, not per request: the cheapest, freshest lot wins twice, then its grant's residual falls below its own unit cost and the third install silently routes to the dearer lot of another grant - a filter, not the priority 33 funds error, because a different candidate remains."
        test_recipe:
          setup:
            - "Two ACTIVE grants from two partners, each with one SMOKE_10YR lot sharing expiry 2027-06-30: lot A at 1850 under a 4000-cent grant, lot B at 2400 under a 500000-cent grant. One SURVEYED visit on a 2-storey, 2-sleeping-area household."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /crr/zones"
              payload: { zone_code: "Z-B54", name: "Birchwood Leaf", occupied_units: 2000, structure_fire_count_5yr: 15, fire_injury_count_5yr: 2, pre_1980_unit_pct: 40.0, senior_household_pct: 20.0, under5_household_pct: 8.0, disability_household_pct: 4.0, assumed_alarm_absence_pct: 50.0, daily_visit_cap: 12 }
              as: RiskAnalyst
              captures: { z_id: $.data.id, z_v0: $.data.version }
            - call: "POST /crr/zones/${z_id}/assessments"
              payload: { basis: "PROVISIONAL", expected_zone_version: "${z_v0}" }
              as: RiskAnalyst
            - call: "POST /crr/households"
              payload: { zone_id: "${z_id}", address_line: "12 Birch Row", occupant_count: 4, sleeping_areas_count: 2, storeys: 2 }
              as: CanvassCoordinator
              captures: { hh_id: $.data.id }
            - call: "POST /crr/crews"
              payload: { crew_code: "CREW-B1", member_count: 2, certification_level: "ADVANCED", max_daily_minutes: 480 }
              as: ProgramAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /crr/routes"
              payload: { zone_id: "${z_id}", crew_id: "${crew_id}", service_date: "2026-08-01", window_start_utc: "2026-08-01T13:00:00Z", window_end_utc: "2026-08-01T21:00:00Z", planned_slots: 4 }
              as: CanvassCoordinator
              captures: { r_id: $.data.id }
            - call: "POST /crr/routes/${r_id}/publish"
              payload: {}
              as: CanvassCoordinator
            - call: "POST /crr/visits"
              payload: { household_id: "${hh_id}", route_id: "${r_id}", scheduled_start_utc: "2026-08-01T14:00:00Z", appointment_option: "SCHEDULED_APPOINTMENT" }
              as: CanvassCoordinator
              captures: { v_id: $.data.id }
            - call: "POST /crr/visits/${v_id}/arrive"
              payload: { occupant_present: true, pre_existing_working_smoke_alarms: 0, pre_existing_working_co_alarms: 0 }
              as: CrrTechnician
              as_user_id: "${crew_id}"
            - call: "POST /crr/partners"
              payload: { org_name: "Firesafe Trust", org_type: "NONPROFIT", contact_email: "grants@firesafe.example", agreement_signed: true }
              as: ProgramAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /crr/partners"
              payload: { org_name: "Metro Utility Co", org_type: "UTILITY", contact_email: "safety@metroutility.example", agreement_signed: true }
              as: ProgramAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /crr/grants"
              payload: { partner_id: "${p1_id}", grant_code: "G-THIN-A", authorized_cents: 4000, period_start_date: "2026-07-01", period_end_date: "2026-12-31", allowed_device_types: ["SMOKE_10YR"], unit_rate_cents_by_type: { SMOKE_10YR: 2195 }, reimbursement_basis: "UNIT_RATE", reimbursement_pct: 87.5, indirect_rate_pct: 12.5, match_pct: 20.0 }
              as: GrantOfficer
              captures: { ga_id: $.data.id }
            - call: "POST /crr/grants/${ga_id}/activate"
              payload: {}
              as: GrantOfficer
            - call: "POST /crr/grants"
              payload: { partner_id: "${p2_id}", grant_code: "G-DEEP-B", authorized_cents: 500000, period_start_date: "2026-07-01", period_end_date: "2026-12-31", allowed_device_types: ["SMOKE_10YR"], unit_rate_cents_by_type: { SMOKE_10YR: 2195 }, reimbursement_basis: "UNIT_RATE", reimbursement_pct: 87.5, indirect_rate_pct: 12.5, match_pct: 20.0 }
              as: GrantOfficer
              captures: { gb_id: $.data.id }
            - call: "POST /crr/grants/${gb_id}/activate"
              payload: {}
              as: GrantOfficer
            - call: "POST /crr/device-lots"
              payload: { funding_grant_id: "${ga_id}", sku: "SKU-SM10-CHEAP", device_type: "SMOKE_10YR", unit_cost_cents: 1850, received_qty: 10, expiry_date: "2027-06-30" }
              as: GrantOfficer
              captures: { lot_a: $.data.id }
            - call: "POST /crr/device-lots"
              payload: { funding_grant_id: "${gb_id}", sku: "SKU-SM10-DEAR", device_type: "SMOKE_10YR", unit_cost_cents: 2400, received_qty: 10, expiry_date: "2027-06-30" }
              as: GrantOfficer
              captures: { lot_b: $.data.id }
          trigger:
            - call: "POST /crr/installations"
              payload: { visit_id: "${v_id}", device_type: "SMOKE_10YR", placement_location: "HALLWAY_OUTSIDE_SLEEPING", storey: 1 }
              as: CrrTechnician
              as_user_id: "${crew_id}"
              captures: { i1_id: $.data.id }
            - call: "POST /crr/installations"
              payload: { visit_id: "${v_id}", device_type: "SMOKE_10YR", placement_location: "SLEEPING_AREA", storey: 1 }
              as: CrrTechnician
              as_user_id: "${crew_id}"
              captures: { i2_id: $.data.id }
            - call: "POST /crr/installations"
              payload: { visit_id: "${v_id}", device_type: "SMOKE_10YR", placement_location: "SLEEPING_AREA", storey: 2 }
              as: CrrTechnician
              as_user_id: "${crew_id}"
              captures: { i3_id: $.data.id }
          assert:
            - "all three responses are 201 with device_lot_id populated even though the request omitted it"
            - "AlarmInstallation.${i1_id}.device_lot_id == ${lot_a} and reserved_cost_cents == 1850 (cheapest of the two equal-expiry lots)"
            - "AlarmInstallation.${i2_id}.device_lot_id == ${lot_a} and reserved_cost_cents == 1850"
            - "AlarmInstallation.${i3_id}.device_lot_id == ${lot_b} and reserved_cost_cents == 2400 - the money clause knocked lot A out"
            - "each installation's reimbursable_cents == 1921 (round_half_up(2195 * 87.5 / 100) on the unit rate, independent of the lot cost)"
            - "PartnerGrant.${ga_id}.reserved_cents == 3842 and available_cents == 158 (158 < 1850, so lot A is no longer a candidate)"
            - "PartnerGrant.${gb_id}.reserved_cents == 1921 and available_cents == 498079"
            - "DeviceLot.${lot_a}.reserved_qty == 2 and DeviceLot.${lot_b}.reserved_qty == 1"
            - "no ERR_GRANT_FUNDS_EXHAUSTED is ever returned - the funds error is only for an explicitly named lot, the selector merely filters"

      - name: three_level_cascade_from_a_failed_follow_up_is_verified_end_to_end
        excluded_because:
          difficulty_instance: follow_up_alarm_missing_cascades_household_then_zone_then_district
          rationale: "The cascading_side_effects layer's N-level chain claim is exactly that difficulty instance: one follow-up contact recording a missing alarm walks Household -> RiskZone effectiveness counters -> district-level outcome aggregation, and it already asserts every hop plus the ordering of the two counter updates. A corner variant would only re-count the same hops."

      - name: partial_failure_inside_a_cascade_leaves_no_drift
        excluded_because:
          difficulty_instance: visit_cancel_cascades_installation_then_lot_then_grant
          rationale: "The layer's partial-failure claim is covered there: cancelling a visit with RESERVED installations must void every one, return each lot's reserved_qty and each grant's reserved_cents, and leave zero drift; the instance asserts the pre/post ledger identity on all three levels, so an extra corner would duplicate it."

      - name: compensating_writes_conserve_units_and_money
        excluded_because:
          difficulty_instance: device_units_conserved_when_a_reserved_installation_is_voided
          rationale: "Conservation under compensation is the whole point of that difficulty instance (on_hand_qty + consumed_qty invariant across reserve/void), and its money twin grant_money_conserved_when_a_committed_installation_is_voided covers the cents side. Both already sit at the layer's hardest point."

      - name: both_reimbursement_variants_and_the_switch_delta
        excluded_because:
          difficulty_instance: installation_reimbursement_unit_rate_vs_actual_cost_diverges
          rationale: "The dual_variant_calculation layer needs both variants computed on identical data plus the delta; that instance runs UNIT_RATE and ACTUAL_COST grants over the same lot and device and asserts both figures and their difference, and zone_risk_score_provisional_demographic_vs_validated_field_diverges does the same for the second dual-variant rule."

  # =========================================================================
  # 9. From Consistency Model - immediate
  # =========================================================================
  - section: consistency_model
    instances:
      - name: every_cascaded_counter_is_readable_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines[HomeSafetyVisit.install_status SURVEYED_to_INSTALL_COMPLETE]
          - entities.RiskZone
        distinguishing_aspect: "consistency_model is immediate, so the four-hop completion cascade must be fully settled by the time the completion response is written: the response body itself carries the new visit state, and reads issued immediately afterwards - with no retry, no sleep, no second mutation - already show the lot, grant, household and zone counters moved."
        test_recipe:
          setup:
            - "One SURVEYED visit with one RESERVED SMOKE_10YR installation, a DRAFT report covering the service date, and a household needing 2 smoke alarms with 1 pre-existing."
          setup_api_calls:
