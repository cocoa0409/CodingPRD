        distinguishing_aspect: |
          A priority pair with a 28-rung gap on a different endpoint, and one
          where the lower rung is only reachable after a calculation: the request
          needs 243125 g from a line holding 1000 g while the line's
          stewardship_status is still NOT_REQUIRED. ERR_STEWARDSHIP_NOT_APPROVED
