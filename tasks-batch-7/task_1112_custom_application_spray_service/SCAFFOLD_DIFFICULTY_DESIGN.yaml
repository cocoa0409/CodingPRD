  # ------------------------------------------------------------- rule 5 -----
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_safety_on_cancelled_start
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_REI_ACTIVE]
        distinguishing_aspect: |
          Error-category pair (state vs business_safety): starting a CANCELLED
          work order whose field is still under REI lockout violates both
          priority-6 (state) and priority-7 (safety); the state error must win.
