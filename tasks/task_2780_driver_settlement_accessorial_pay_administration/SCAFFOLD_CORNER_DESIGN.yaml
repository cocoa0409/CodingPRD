          The Driver role is entity_backed, so X-User-ID is itself a Driver.id and priority 3 compares it to the
          driver_id of whatever is addressed - the row, the load reached through Load.driver_id, or the body's
          own driver_id on a claim or a dispute. DRV_SCA reads itself at 200 and is refused with
          ERR_DRIVER_SCOPE_VIOLATION at 403 on all four of DRV_SCB's surfaces, including the two writes where
