              as: PermitCoordinator
            - call: "POST /api/orders/${order_id}/schedule"
              payload: { scheduled_date: "2026-08-01", crew_id: "crew-1" }
              as: SalesRep
            - call: "POST /api/orders/${order_id}/start"
              payload: {}
              as: InstallCrew
            - call: "POST /api/orders/${order_id}/complete"
              payload: {}
              as: InstallCrew
            - call: "GET /api/orders/${order_id}/rto-contract"
              as: FinanceManager
              captures: { contract_id: "$.data[0].id" }
            - call: "POST /api/rto-contracts/${contract_id}/payments"
              payload: { amount_cents: 20000, method: "CARD", idempotency_key: "rto-p1" }
              as: FinanceManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T00:00:00Z" }
