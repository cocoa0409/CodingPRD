  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: service_period_half_open_intervals_allow_exact_adjacency
        resource_entity: ServicePeriod
        interval_semantics: "HALF-OPEN [period_start, period_end) with no buffer"
        grounds:
          - validations.priority_62
          - validations.priority_58
          - entities.ServicePeriod.fields.days_in_period
        distinguishing_aspect: |
          The resource is the concession's payment calendar and the interval is HALF-OPEN with
          no buffer, so touching endpoints do NOT collide: a period starting exactly on the
          prior period's period_end is accepted, and the two periods together cover 61 days
          with no day counted twice. A closed-interval implementation rejects the adjacent
          period; an implementation that only compares period_start values accepts the
          straddling third period.
        test_recipe:
          setup:
            - "Concession at OPERATIONS with monthly_unitary_charge_cents 8604167 and no ServicePeriod rows."
            - "Logical clock at 2027-01-21T00:00:00Z."
          setup_api_calls:
