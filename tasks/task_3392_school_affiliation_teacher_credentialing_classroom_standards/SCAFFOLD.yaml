# =============================================================================
# SCAFFOLD.yaml — School Affiliation, Teacher Credentialing & Classroom
# Standards (Montessori-style society accreditation platform)
# §1.0–§1.7 seed tables. §1.8 and §1.9 live in sibling files.
# =============================================================================

scenario: |
  School Affiliation, Teacher Credentialing & Classroom Standards (American
  Montessori Society): school membership levels from affiliation through
  accreditation with escalating requirements, teacher education program
  accreditation with practicum requirements, adult learner supervision and
  course content standards, credential issuance by age level with practicum
  completion verification and renewal requirements, classroom standards
  covering multi-age grouping, uninterrupted work periods, materials
  completeness and teacher-student ratios, school self-study and verification
  visits with consultant reports and improvement plans, brand and terminology
  usage where the method name is not exclusively controlled requiring
  differentiation, conference and professional development delivery with
  continuing education credit, member school directory listing and
  parent-facing verification

domain_name: "montessori-society-accreditation"
api_prefix: "/society"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency        # OCC on School.version / ImprovementPlan.version
    - cascading_side_effects        # plan-overdue and credential-revocation cascades
    - dual_variant_calculation      # CE windows (Credential) and audit clearance (School)
    - rate_threshold_triggers       # ratios, CE hours, dues tiers, tenure
  entity_topology: flat             # peer entities joined by FK references; sub-resource GETs only for reverse reachability
  state_machine_shape: cyclic       # SelfStudy revision loop; Credential ACTIVE<->LAPSED; ImprovementPlan OPEN<->SUBMITTED; School has parallel dimensions
  relationship_patterns:
    - one_to_many                   # School->Classroom, Program->AdultLearner
    - many_to_many                  # Credential x PDEvent via CECreditEntry
    - cross_aggregate               # Classroom.lead_credential_id, Placement.supervisor_credential_id, Plan.visit_id
  role_model: segregation_of_duties # accreditation reviewer != visit consultant; supervisors never verify
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: StandardsCatalog
    parent: null
    common_fields: true
    fields:
      - name: version_label
        type: string
        source: input
        description: "Unique human label for this edition of the standards, e.g. 'Standards 2026'."
      - name: status
        type: enum
        source: system
        description: "Lifecycle: DRAFT -> ACTIVE -> RETIRED. See state_machines.StandardsCatalog."
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE, RETIRED}"
      - name: effective_from
        type: string
        source: input
        description: "ISO 8601 date (YYYY-MM-DD) from which this edition governs; must be strictly later than the currently ACTIVE catalog's effective_from at activation."
      - name: min_uninterrupted_work_minutes_by_level
        type: object
        source: input
        description: "Map age_level -> minimum uninterrupted work-period minutes a compliant classroom must offer."
      - name: max_students_per_adult_by_level
        type: object
        source: input
        description: "Map age_level -> maximum students per supervising adult (inclusive cap)."
      - name: materials_pass_threshold
        type: number
        source: input
        description: "Minimum materials completeness score (unrounded mean of per-group rounded ratios) for a COMPLIANT materials check, e.g. 0.9."
      - name: min_multi_age_span_years_by_level
        type: object
        source: input
        description: "Map age_level -> minimum declared multi-age span in years (inclusive)."
      - name: practicum_min_hours_by_level
        type: object
        source: input
        description: "Map age_level -> minimum practicum hours required before a placement can be verified."
      - name: ce_hours_required
        type: number
        source: input
        description: "Continuing-education hours required for credential renewal, measured per calculations.ce_hours_qualification (CYCLE variant is authoritative at renewal)."
      - name: credential_validity_months
        type: integer
        source: input
        description: "Calendar months a credential stays ACTIVE from issuance/renewal."
      - name: renewal_window_months
        type: integer
        source: input
        description: "Calendar months before expires_at when the renewal window opens (inclusive of the opening date)."
      - name: renewal_grace_months
        type: integer
        source: input
        description: "Calendar months after expires_at during which a LAPSED credential may still renew (inclusive of the final grace date)."
      - name: min_membership_months_before_accreditation
        type: integer
        source: input
        description: "Calendar months a school must hold MEMBER level before submitting an ACCREDITATION application."
      - name: consultant_travel_buffer_days
        type: integer
        source: input
        description: "Whole-day buffer around each verification-visit window during which the same consultant cannot be double-booked."
      - name: plan_response_days
        type: integer
        source: input
        description: "Days from report filing (or auto-creation) until an improvement plan's due_date."

  - name: School
    parent: null
    common_fields: true
    notes: "School.version increments ONLY on direct school mutations: dues-payments, brand update, standing transition, membership_level advance, school-application create, self-study create, self-study acceptance. Audit creation, classroom create/transfer, plan auto-creation and computed-field recomputation (compliant_classroom_count, directory_visible, annual_dues_cents, total_enrollment) do NOT bump School.version; those fields are computed on read."
    fields:
      - name: name
        type: string
        source: input
        description: "Legal name of the school."
      - name: display_name
        type: string
        source: input
        description: "Public brand display name; unique case-insensitively across all schools in any membership_level."
      - name: uses_method_name
        type: boolean
        source: input
        description: "True when display_name incorporates the uncontrolled method name (constant METHOD_NAME = 'Montessori')."
      - name: descriptor
        type: string
        source: input
        description: "Differentiating descriptor (e.g. 'Inspired') that must appear inside display_name when a non-ACCREDITED school uses the method name. Null when unused."
        default: null
      - name: contact_email
        type: string
        source: input
        description: "Primary contact email."
      - name: membership_level
        type: enum
        source: system
        description: "Escalating membership level; see state_machines School (level dimension)."
        default: APPLICANT
        constraints: "one of {APPLICANT, AFFILIATE, MEMBER, ACCREDITED}"
      - name: standing
        type: enum
        source: system
        description: "Compliance standing, independent of level; see state_machines School (standing dimension)."
        default: GOOD_STANDING
        constraints: "one of {GOOD_STANDING, PROBATION, SUSPENDED, REVOKED}"
      - name: affiliated_since
        type: string
        source: system
        description: "ISO date the school first reached AFFILIATE level. Null until then."
        default: null
      - name: member_since
        type: string
        source: system
        description: "ISO date the school first reached MEMBER level; tenure anchor for ACCREDITATION applications. Null until then."
        default: null
      - name: accredited_since
        type: string
        source: system
        description: "ISO date the school first reached ACCREDITED level. Null until then."
        default: null
      - name: dues_paid_through
        type: string
        source: system
        description: "ISO date through which dues are paid, set by POST /society/schools/{id}/dues-payments. Null when never paid."
        default: null
      - name: pinned_catalog_id
        type: string
        source: system
        description: "FK -> StandardsCatalog.id; the catalog edition locked when the school's self-study is ACCEPTED. Drives classroom-audit scoring until replaced. Null until first acceptance."
        default: null
      - name: dues_current
        type: boolean
        source: computed
        description: "true iff dues_paid_through is not null and dues_paid_through >= current logical date."
      - name: brand_compliant
        type: boolean
        source: computed
        description: "true iff (NOT uses_method_name) OR (membership_level == ACCREDITED) OR (descriptor is non-null and display_name contains descriptor)."
      - name: directory_visible
        type: boolean
        source: computed
        description: "true iff membership_level in {MEMBER, ACCREDITED} AND standing == GOOD_STANDING AND brand_compliant AND dues_current. See calculations.directory_visibility."
      - name: total_enrollment
        type: integer
        source: computed
        description: "Sum of enrolled_student_count over all Classrooms of this school. Conserved by transfer-students (see §1.2.1-style invariant in calculations.transfer_conservation)."
      - name: compliant_classroom_count
        type: integer
        source: computed
        description: "Count of classrooms whose latest ClassroomAudit verdict is COMPLIANT and whose compliance_override == NONE."
      - name: annual_dues_cents
        type: integer
        source: computed
        description: "Current annual dues quote from calculations.annual_membership_dues for the school's level, total_enrollment and classroom count."

  - name: Classroom
    parent: null
    common_fields: true
    fields:
      - name: school_id
        type: string
        source: input
        description: "FK -> School.id; owning school."
      - name: name
        type: string
        source: input
        description: "Classroom label, e.g. 'Willow Room'."
      - name: age_level
        type: enum
        source: input
        description: "Age grouping served."
        constraints: "one of {INFANT_TODDLER, EARLY_CHILDHOOD, ELEMENTARY_I, ELEMENTARY_II, SECONDARY}"
      - name: declared_age_span_years
        type: integer
        source: input
        description: "Declared multi-age span in years; audited against the catalog's min_multi_age_span_years_by_level."
      - name: enrolled_student_count
        type: integer
        source: input
        description: "Current enrollment. Mutated only by transfer-students after creation."
        constraints: ">= 0"
      - name: assistant_count
        type: integer
        source: input
        description: "Number of assistant adults regularly in the room."
        constraints: ">= 0"
      - name: lead_credential_id
        type: string
        source: input
        description: "FK -> Credential.id; the lead teacher's credential. Must be status ACTIVE with age_level == classroom.age_level at assignment. Null allowed (unstaffed)."
        default: null
      - name: compliance_override
        type: enum
        source: system
        description: "NONE normally; set to NONCOMPLIANT_LEAD by the credential-revocation cascade and cleared when a valid ACTIVE lead of matching age_level is (re)assigned."
        default: NONE
        constraints: "one of {NONE, NONCOMPLIANT_LEAD}"
      - name: latest_audit_verdict
        type: string
        source: computed
        description: "Verdict of the most recent ClassroomAudit (by created_at) for this classroom; null when never audited."

  - name: ClassroomAudit
    parent: null
    common_fields: false
    fields:
      - name: classroom_id
        type: string
        source: input
        description: "FK -> Classroom.id; audited classroom."
      - name: visit_id
        type: string
        source: input
        description: "FK -> VerificationVisit.id; optional. When supplied, the visit must belong to the classroom's school, be SCHEDULED, and the acting Consultant must be the visit's consultant_id."
        default: null
      - name: catalog_id
        type: string
        source: system
        description: "FK -> StandardsCatalog.id; edition applied: the school's pinned_catalog_id if set, else the currently ACTIVE catalog. Pinned at audit creation."
      - name: auditor_consultant_id
        type: string
        source: system
        description: "X-User-ID of the filing Consultant (opaque operator id)."
      - name: observed_at
        type: datetime
        source: system
        description: "Logical-clock timestamp at creation."
      - name: students_present
        type: integer
        source: input
        description: "Students observed during the work period."
        constraints: ">= 0"
      - name: adults_present
        type: integer
        source: input
        description: "Supervising adults observed (lead + assistants)."
        constraints: ">= 1"
      - name: observed_uninterrupted_minutes
        type: integer
        source: input
        description: "Longest observed uninterrupted work period, minutes."
        constraints: ">= 0"
      - name: materials_groups
        type: array
        source: input
        description: "Array of {domain, required_count, present_count}; present_count <= required_count per group; at least one group."
      - name: ratio_students_per_adult
        type: number
        source: computed
        description: "students_present / adults_present, rounded half-up to 2 decimals; compared <= cap (see calculations.classroom_ratio_compliance)."
      - name: ratio_pass
        type: boolean
        source: computed
        description: "true iff ratio_students_per_adult <= catalog.max_students_per_adult_by_level[age_level]."
      - name: work_period_pass
        type: boolean
        source: computed
        description: "true iff observed_uninterrupted_minutes >= catalog.min_uninterrupted_work_minutes_by_level[age_level]."
      - name: materials_score
        type: number
        source: computed
        description: "Per calculations.materials_completeness_score: round each group's present/required to 2dp half-up FIRST, then arithmetic mean; stored rounded to 4dp half-up."
      - name: materials_pass
        type: boolean
        source: computed
        description: "true iff the UNROUNDED mean of per-group rounded scores >= catalog.materials_pass_threshold."
      - name: multi_age_pass
        type: boolean
        source: computed
        description: "true iff classroom.declared_age_span_years >= catalog.min_multi_age_span_years_by_level[age_level]."
      - name: verdict
        type: enum
        source: computed
        description: "COMPLIANT iff ratio_pass AND work_period_pass AND materials_pass AND multi_age_pass; else NONCOMPLIANT."
        constraints: "one of {COMPLIANT, NONCOMPLIANT}"
      - name: failed_checks
        type: array
        source: computed
        description: "Subset of [RATIO, WORK_PERIOD, MATERIALS, MULTI_AGE] naming failed checks; empty when COMPLIANT."

  - name: TeacherEducationProgram
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Program name."
      - name: age_levels_offered
        type: array
        source: input
        description: "Non-empty subset of the age_level enum the program prepares adult learners for."
      - name: course_contact_hours_by_level
        type: object
        source: input
        description: "Map age_level -> academic contact hours delivered; course content standard declared per level."
      - name: practicum_hours_by_level
        type: object
        source: input
        description: "Map age_level -> practicum hours the program schedules; at accreditation each must be >= the ACTIVE catalog's practicum_min_hours_by_level for that level."
      - name: status
        type: enum
        source: system
        description: "Accreditation lifecycle; see state_machines.TeacherEducationProgram."
        default: PROVISIONAL
        constraints: "one of {PROVISIONAL, ACCREDITED, PROBATION, SUSPENDED}"

  - name: AdultLearner
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> TeacherEducationProgram.id; enrolling program. Program status must be in {PROVISIONAL, ACCREDITED} at enrollment."
      - name: full_name
        type: string
        source: input
        description: "Learner's full name."
      - name: age_level
        type: enum
        source: input
        description: "Age-level specialization; must be an element of the program's age_levels_offered."
        constraints: "one of {INFANT_TODDLER, EARLY_CHILDHOOD, ELEMENTARY_I, ELEMENTARY_II, SECONDARY}"
      - name: status
        type: enum
        source: system
        description: "Progression; see state_machines.AdultLearner."
        default: ENROLLED
        constraints: "one of {ENROLLED, IN_PRACTICUM, PRACTICUM_COMPLETE, CREDENTIALED}"

  - name: PracticumPlacement
    parent: null
    common_fields: true
    fields:
      - name: learner_id
        type: string
        source: input
        description: "FK -> AdultLearner.id; the placed adult learner. One learner may hold at most one ACTIVE/HOURS_COMPLETE placement covering any date (half-open overlap rule)."
      - name: host_school_id
        type: string
        source: input
        description: "FK -> School.id; practicum site. School membership_level must be in {AFFILIATE, MEMBER, ACCREDITED} at creation."
      - name: supervisor_credential_id
        type: string
        source: input
        description: "FK -> Credential.id; supervising teacher. OPTIONAL to break the bootstrap cycle (a program's first cohort has no credentialed supervisors yet); when null the placement is unsupervised. When provided: must be status ACTIVE, age_level equal to the learner's age_level, and supervising fewer than 3 other ACTIVE placements."
        default: null
      - name: age_level
        type: enum
        source: system
        description: "Copied from the learner's age_level at creation; immutable."
        constraints: "one of {INFANT_TODDLER, EARLY_CHILDHOOD, ELEMENTARY_I, ELEMENTARY_II, SECONDARY}"
      - name: start_date
        type: string
        source: input
        description: "ISO date (YYYY-MM-DD) placement window opens, inclusive."
      - name: end_date
        type: string
        source: input
        description: "ISO date placement window closes, exclusive for overlap purposes; must be strictly after start_date and strictly after the current logical date."
      - name: target_hours
        type: integer
        source: system
        description: "Copied from the ACTIVE catalog's practicum_min_hours_by_level[age_level] at creation; pinned for this placement."
      - name: hours_logged
        type: integer
        source: computed
        description: "Accumulated hours from log-hours calls; monotonically increasing."
        default: 0
      - name: status
        type: enum
        source: system
        description: "See state_machines.PracticumPlacement."
        default: ACTIVE
        constraints: "one of {ACTIVE, HOURS_COMPLETE, VERIFIED, CANCELLED}"

  - name: Credential
    parent: null
    common_fields: true
    fields:
      - name: learner_id
        type: string
        source: input
        description: "FK -> AdultLearner.id; credential holder. At most one credential per (learner_id, age_level) with status in {ACTIVE, LAPSED}."
      - name: age_level
        type: enum
        source: input
        description: "Age level of practice; must equal the learner's age_level."
        constraints: "one of {INFANT_TODDLER, EARLY_CHILDHOOD, ELEMENTARY_I, ELEMENTARY_II, SECONDARY}"
      - name: status
        type: enum
        source: system
        description: "See state_machines.Credential."
        default: ACTIVE
        constraints: "one of {ACTIVE, LAPSED, EXPIRED, REVOKED}"
      - name: issued_at
        type: datetime
        source: system
        description: "Logical timestamp of issuance (or of the most recent renewal start)."
      - name: cycle_start
        type: string
        source: system
        description: "ISO date the current validity cycle began (issuance or last renewal date); CYCLE CE window anchor."
      - name: expires_at
        type: datetime
        source: system
        description: "cycle_start + ACTIVE catalog's credential_validity_months at the time of issuance/renewal."
      - name: renewed_count
        type: integer
        source: system
        description: "Number of successful renewals."
        default: 0
      - name: ce_hours_cycle_credited
        type: number
        source: computed
        description: "Sum of hours over this credential's CECreditEntry rows with status ACTIVE and earned_at date >= cycle_start (CYCLE variant of calculations.ce_hours_qualification)."
      - name: ce_hours_rolling_credited
        type: number
        source: computed
        description: "Sum of hours over ACTIVE CECreditEntry rows with earned_at date in the trailing credential_validity_months window ending today (ROLLING variant)."

  - name: SchoolApplication
    parent: null
    common_fields: true
    fields:
      - name: school_id
        type: string
        source: input
        description: "FK -> School.id; applicant school. OCC: create requires expected_school_version matching the school's current version."
      - name: type
        type: enum
        source: input
        description: "Advancement sought; must equal the school's next level: APPLICANT->AFFILIATION, AFFILIATE->MEMBERSHIP, MEMBER->ACCREDITATION."
        constraints: "one of {AFFILIATION, MEMBERSHIP, ACCREDITATION}"
      - name: status
        type: enum
        source: system
        description: "See state_machines.SchoolApplication."
        default: DRAFT
        constraints: "one of {DRAFT, UNDER_REVIEW, RETURNED, SUSPENDED, APPROVED, DENIED}"
      - name: supporting_self_study_id
        type: string
        source: system
        description: "FK -> SelfStudy.id; for ACCREDITATION, the ACCEPTED self-study pinned at submit time. Null for other types."
        default: null
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical timestamp of the most recent successful submit."
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: "Logical timestamp of APPROVED/DENIED decision. Null while undecided."
        default: null
      - name: reviewer_user_id
        type: string
        source: system
        description: "X-User-ID of the AccreditationReviewer who decided. Null while undecided."
        default: null

  - name: SelfStudy
    parent: null
    common_fields: true
    fields:
      - name: school_id
        type: string
        source: input
        description: "FK -> School.id; authoring school. OCC: create requires expected_school_version."
      - name: narrative
        type: string
        source: input
        description: "Free-text self-study narrative."
      - name: status
        type: enum
        source: system
        description: "See state_machines.SelfStudy."
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, RETURNED_FOR_REVISION, ACCEPTED}"
      - name: pinned_catalog_id
        type: string
        source: system
        description: "FK -> StandardsCatalog.id; ACTIVE catalog locked at creation. Review proceeds against this edition even if it is later RETIRED (version pinning)."
      - name: pinned_catalog_label
        type: string
        source: system
        description: "Denormalized version_label of pinned_catalog_id, copied at creation."
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical timestamp of latest submit. Null while DRAFT."
        default: null

  - name: VerificationVisit
    parent: null
    common_fields: true
    fields:
      - name: school_id
        type: string
        source: input
        description: "FK -> School.id; visited school."
      - name: self_study_id
        type: string
        source: input
        description: "FK -> SelfStudy.id; must be an ACCEPTED self-study belonging to school_id."
      - name: consultant_id
        type: string
        source: input
        description: "Opaque user id of the assigned Consultant. Overlap rule: no two non-CANCELLED visits for the same consultant may have windows within consultant_travel_buffer_days of each other."
      - name: window_start
        type: string
        source: input
        description: "ISO date the visit window opens (inclusive); must be >= current logical date."
      - name: window_end
        type: string
        source: input
        description: "ISO date the visit window closes (inclusive); must be >= window_start."
      - name: status
        type: enum
        source: system
        description: "See state_machines.VerificationVisit."
        default: SCHEDULED
        constraints: "one of {SCHEDULED, REPORT_FILED, CANCELLED}"
      - name: verdict
        type: enum
        source: input
        description: "Consultant verdict filed via the reports endpoint; null until filed."
        default: null
        constraints: "one of {COMPLIANT, IMPROVEMENT_REQUIRED, NONCOMPLIANT}"
      - name: findings
        type: array
        source: input
        description: "Array of finding strings filed with the report."
        default: []
      - name: report_filed_at
        type: datetime
        source: system
        description: "Logical timestamp when the report was filed. Null until filed."
        default: null

  - name: ImprovementPlan
    parent: null
    common_fields: true
    fields:
      - name: school_id
        type: string
        source: system
        description: "FK -> School.id; obligated school. Copied from the triggering visit or revocation cascade."
      - name: visit_id
        type: string
        source: system
        description: "FK -> VerificationVisit.id; the visit whose report created this plan. Null for plans auto-created by the credential-revocation cascade."
        default: null
      - name: required_actions
        type: array
        source: system
        description: "Array of required-action strings. Copied from report findings when auto-created."
      - name: due_date
        type: string
        source: system
        description: "ISO date = filing date + ACTIVE catalog's plan_response_days. OVERDUE when current logical date is strictly greater."
      - name: status
        type: enum
        source: system
        description: "See state_machines.ImprovementPlan."
        default: OPEN
        constraints: "one of {OPEN, OVERDUE, SUBMITTED, VERIFIED}"
      - name: response_notes
        type: string
        source: system
        description: "Latest SchoolAdmin response narrative. OCC: respond requires expected_improvement_plan_version."
        default: null
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical timestamp of latest response."
        default: null
      - name: verified_at
        type: datetime
        source: system
        description: "Logical timestamp of verification. Null until VERIFIED."
        default: null

  - name: PDEvent
    parent: null
    common_fields: true
    fields:
      - name: title
        type: string
        source: input
        description: "Event or conference session title."
      - name: provider_name
        type: string
        source: input
        description: "Delivering organization (conference, program, or society)."
      - name: start_at
        type: datetime
        source: input
        description: "Event start (ISO 8601)."
      - name: end_at
        type: datetime
        source: input
        description: "Event end (ISO 8601); must be strictly after start_at."
      - name: ce_hours
        type: number
        source: input
        description: "Continuing-education credit hours the event grants at full attendance."
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: "SCHEDULED until the logical clock passes end_at, then COMPLETED (auto-transition on clock advance). See state_machines.PDEvent."
        default: SCHEDULED
        constraints: "one of {SCHEDULED, COMPLETED}"

  - name: CECreditEntry
    parent: null
    common_fields: false
    fields:
      - name: credential_id
        type: string
        source: input
        description: "FK -> Credential.id; credited credential. At most one non-VOID entry per (credential_id, pd_event_id)."
      - name: pd_event_id
        type: string
        source: system
        description: "FK -> PDEvent.id; source event, copied from the attendance endpoint path."
      - name: hours
        type: number
        source: input
        description: "Hours credited; defaults to the event's ce_hours; must be > 0 and <= event.ce_hours."
      - name: earned_at
        type: datetime
        source: system
        description: "Set to the event's end_at (not the posting time) — credit is earned when the event completes."
      - name: status
        type: enum
        source: system
        description: "ACTIVE until voided; void is the compensating action of the CE ledger."
        default: ACTIVE
        constraints: "one of {ACTIVE, VOID}"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: StandardsCatalog
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /society/standards-catalogs/{id}/activate"
        actor: SocietyAdmin
        preconditions:
          - "catalog.status == DRAFT"
          - "if another catalog is ACTIVE, this catalog's effective_from must be strictly later than that catalog's effective_from (else ERR_CATALOG_EFFECTIVE_ORDER)"
        side_effects:
          - "the previously ACTIVE catalog (if any) transitions ACTIVE -> RETIRED"
      - from: ACTIVE
        to: RETIRED
        trigger: "system: activation of a newer catalog"
        actor: system
        preconditions:
          - "another catalog is being activated"
        side_effects:
          - "schools and self-studies that pinned this catalog keep evaluating against it (version pinning; no re-derivation)"

  - entity: School
    dimension: membership_level
    initial_state: APPLICANT
    terminal_states: []
    transitions:
      - from: APPLICANT
        to: AFFILIATE
        trigger: "POST /society/school-applications/{id}/review with outcome APPROVED on an AFFILIATION application"
        actor: AccreditationReviewer
        preconditions:
          - "application.status == UNDER_REVIEW and application.type == AFFILIATION"
          - "school.dues_current == true at decision time"
        side_effects:
          - "school.affiliated_since := current logical date"
          - "increments School.version by 1"
      - from: AFFILIATE
        to: MEMBER
        trigger: "POST /society/school-applications/{id}/review with outcome APPROVED on a MEMBERSHIP application"
        actor: AccreditationReviewer
        preconditions:
          - "application.status == UNDER_REVIEW and application.type == MEMBERSHIP"
          - "school.dues_current == true at decision time"
        side_effects:
          - "school.member_since := current logical date"
          - "increments School.version by 1"
      - from: MEMBER
        to: ACCREDITED
        trigger: "POST /society/school-applications/{id}/review with outcome APPROVED on an ACCREDITATION application"
        actor: AccreditationReviewer
        preconditions:
          - "application.status == UNDER_REVIEW and application.type == ACCREDITATION"
          - "school.standing == GOOD_STANDING"
          - "school.dues_current == true at decision time"
          - "the REPORT_FILED visit supporting the application has verdict COMPLIANT, or verdict IMPROVEMENT_REQUIRED whose improvement plan is VERIFIED"
          - "segregation of duties: reviewer X-User-ID != consultant_id of that visit (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "school.accredited_since := current logical date"
          - "directory visibility recomputed (calculations.directory_visibility)"
          - "increments School.version by 1"

  - entity: School
    dimension: standing
    initial_state: GOOD_STANDING
    terminal_states: [REVOKED]
    transitions:
      - from: GOOD_STANDING
        to: PROBATION
        trigger: "system: an ImprovementPlan of this school flips OPEN -> OVERDUE on clock advance; OR POST /society/schools/{id}/standing with to_standing PROBATION"
        actor: system | AccreditationReviewer
        preconditions:
          - "system path: the flipping plan belongs to this school"
        side_effects:
          - "every SchoolApplication of this school in UNDER_REVIEW transitions to SUSPENDED"
          - "directory visibility recomputed"
          - "increments School.version by 1"
      - from: PROBATION
        to: SUSPENDED
        trigger: "system: a further ImprovementPlan flips OVERDUE while standing is PROBATION; OR POST /society/schools/{id}/standing with to_standing SUSPENDED"
        actor: system | AccreditationReviewer
        preconditions:
          - "system path: the flipping plan belongs to this school"
        side_effects:
          - "every SchoolApplication of this school in UNDER_REVIEW transitions to SUSPENDED (idempotent if already SUSPENDED)"
          - "directory visibility recomputed"
          - "increments School.version by 1"
      - from: PROBATION
        to: GOOD_STANDING
        trigger: "system: the school's last non-VERIFIED ImprovementPlan becomes VERIFIED; OR POST /society/schools/{id}/standing with to_standing GOOD_STANDING"
        actor: system | AccreditationReviewer
        preconditions:
          - "system path: no ImprovementPlan of this school remains in {OPEN, OVERDUE, SUBMITTED}"
        side_effects:
          - "every SchoolApplication of this school in SUSPENDED transitions back to UNDER_REVIEW"
          - "directory visibility recomputed"
          - "increments School.version by 1"
      - from: SUSPENDED
        to: GOOD_STANDING
        trigger: "POST /society/schools/{id}/standing with to_standing GOOD_STANDING"
        actor: AccreditationReviewer
        preconditions:
          - "no ImprovementPlan of this school remains in {OPEN, OVERDUE, SUBMITTED}"
        side_effects:
          - "every SchoolApplication of this school in SUSPENDED transitions back to UNDER_REVIEW"
          - "directory visibility recomputed"
          - "increments School.version by 1"
      - from: GOOD_STANDING
        to: REVOKED
        trigger: "POST /society/schools/{id}/standing with to_standing REVOKED"
        actor: AccreditationReviewer
        preconditions: []
        side_effects:
          - "every SchoolApplication of this school in {DRAFT, UNDER_REVIEW, RETURNED, SUSPENDED} transitions to DENIED"
          - "directory visibility recomputed (becomes false)"
          - "increments School.version by 1"
      - from: PROBATION
        to: REVOKED
        trigger: "POST /society/schools/{id}/standing with to_standing REVOKED"
        actor: AccreditationReviewer
        preconditions: []
        side_effects:
          - "every SchoolApplication of this school in {DRAFT, UNDER_REVIEW, RETURNED, SUSPENDED} transitions to DENIED"
          - "directory visibility recomputed (becomes false)"
          - "increments School.version by 1"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /society/schools/{id}/standing with to_standing REVOKED"
        actor: AccreditationReviewer
        preconditions: []
        side_effects:
          - "every SchoolApplication of this school in {DRAFT, UNDER_REVIEW, RETURNED, SUSPENDED} transitions to DENIED"
          - "directory visibility recomputed (becomes false)"
          - "increments School.version by 1"

  - entity: SchoolApplication
    initial_state: DRAFT
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /society/school-applications/{id}/submit"
        actor: SchoolAdmin
        preconditions:
          - "application.status == DRAFT or RETURNED"
          - "type-escalating requirements pass (see validations; ordered: state, tenure temporal, referential, constraint, fiscal)"
          - "for ACCREDITATION: pins supporting_self_study_id to the school's ACCEPTED self-study"
        side_effects:
          - "application.submitted_at := now"
      - from: RETURNED
        to: UNDER_REVIEW
        trigger: "POST /society/school-applications/{id}/submit (resubmission closes the revision loop)"
        actor: SchoolAdmin
        preconditions:
          - "same checks as DRAFT -> UNDER_REVIEW, re-evaluated against current state"
        side_effects:
          - "application.submitted_at := now"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /society/school-applications/{id}/review with outcome APPROVED"
        actor: AccreditationReviewer
        preconditions:
          - "application.status == UNDER_REVIEW"
          - "approval preconditions of the school's level transition (see School membership_level machine), including dues_current recheck and ACCREDITATION segregation-of-duties"
        side_effects:
          - "school.membership_level advances per application.type"
          - "application.decided_at := now; application.reviewer_user_id := reviewer X-User-ID"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /society/school-applications/{id}/review with outcome DENIED; OR system cascade when school standing becomes REVOKED"
        actor: AccreditationReviewer | system
        preconditions:
          - "application.status in {UNDER_REVIEW, SUSPENDED, DRAFT, RETURNED} for the system cascade"
        side_effects:
          - "application.decided_at := now; application.reviewer_user_id := reviewer X-User-ID (reviewer path only)"
      - from: UNDER_REVIEW
        to: RETURNED
        trigger: "POST /society/school-applications/{id}/review with outcome RETURNED"
        actor: AccreditationReviewer
        preconditions:
          - "application.status == UNDER_REVIEW"
        side_effects: []
      - from: UNDER_REVIEW
        to: SUSPENDED
        trigger: "system: school standing leaves GOOD_STANDING"
        actor: system
        preconditions:
          - "application.status == UNDER_REVIEW"
        side_effects: []
      - from: SUSPENDED
        to: UNDER_REVIEW
        trigger: "system: school standing returns to GOOD_STANDING"
        actor: system
        preconditions:
          - "application.status == SUSPENDED"
        side_effects: []

  - entity: SelfStudy
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /society/self-studies/{id}/submit"
        actor: SchoolAdmin
        preconditions:
          - "self_study.status == DRAFT or RETURNED_FOR_REVISION"
          - "narrative is non-empty"
        side_effects:
          - "self_study.submitted_at := now"
      - from: RETURNED_FOR_REVISION
        to: SUBMITTED
        trigger: "POST /society/self-studies/{id}/submit (revision cycle)"
        actor: SchoolAdmin
        preconditions:
          - "self_study.status == RETURNED_FOR_REVISION"
        side_effects:
          - "self_study.submitted_at := now"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /society/self-studies/{id}/review with outcome ACCEPTED"
        actor: AccreditationReviewer
        preconditions:
          - "self_study.status == SUBMITTED"
        side_effects:
          - "school.pinned_catalog_id := self_study.pinned_catalog_id (version pinning on approval)"
          - "increments School.version by 1"
      - from: SUBMITTED
        to: RETURNED_FOR_REVISION
        trigger: "POST /society/self-studies/{id}/review with outcome RETURNED_FOR_REVISION"
        actor: AccreditationReviewer
        preconditions:
          - "self_study.status == SUBMITTED"
        side_effects: []

  - entity: VerificationVisit
    initial_state: SCHEDULED
    terminal_states: [REPORT_FILED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: REPORT_FILED
        trigger: "POST /society/verification-visits/{id}/reports"
        actor: Consultant
        preconditions:
          - "visit.status == SCHEDULED"
          - "acting X-User-ID == visit.consultant_id (ownership)"
          - "current logical date >= visit.window_start"
        side_effects:
          - "visit.verdict, visit.findings, visit.report_filed_at recorded"
          - "if verdict in {IMPROVEMENT_REQUIRED, NONCOMPLIANT}: auto-create ImprovementPlan(school_id := visit.school_id, visit_id := visit.id, required_actions := findings, due_date := today + ACTIVE catalog plan_response_days)"
          - "if verdict == NONCOMPLIANT and school.standing == GOOD_STANDING: school standing transitions to PROBATION (which itself suspends UNDER_REVIEW applications and recomputes directory visibility)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /society/verification-visits/{id}/cancel"
        actor: AccreditationReviewer
        preconditions:
          - "visit.status == SCHEDULED"
        side_effects: []

  - entity: ImprovementPlan
    initial_state: OPEN
    terminal_states: [VERIFIED]
    transitions:
      - from: OPEN
        to: OVERDUE
        trigger: "system: clock advance makes current logical date strictly greater than due_date"
        actor: system
        preconditions:
          - "plan.status == OPEN"
        side_effects:
          - "school standing transitions GOOD_STANDING -> PROBATION, or PROBATION -> SUSPENDED if already PROBATION (the school's standing transition then suspends its UNDER_REVIEW applications and recomputes directory visibility)"
      - from: OPEN
        to: SUBMITTED
        trigger: "POST /society/improvement-plans/{id}/respond"
        actor: SchoolAdmin
        preconditions:
          - "plan.status in {OPEN, OVERDUE}"
          - "expected_improvement_plan_version == plan.version (OCC)"
        side_effects:
          - "plan.response_notes := payload; plan.submitted_at := now"
          - "increments ImprovementPlan.version by 1"
      - from: OVERDUE
        to: SUBMITTED
        trigger: "POST /society/improvement-plans/{id}/respond (late response allowed)"
        actor: SchoolAdmin
        preconditions:
          - "plan.status in {OPEN, OVERDUE}"
          - "expected_improvement_plan_version == plan.version (OCC)"
        side_effects:
          - "plan.response_notes := payload; plan.submitted_at := now"
          - "increments ImprovementPlan.version by 1"
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /society/improvement-plans/{id}/review with outcome VERIFIED"
        actor: AccreditationReviewer
        preconditions:
          - "plan.status == SUBMITTED"
        side_effects:
          - "plan.verified_at := now"
          - "if the school has no remaining plan in {OPEN, OVERDUE, SUBMITTED} and standing == PROBATION: standing auto-transitions PROBATION -> GOOD_STANDING (resuming SUSPENDED applications and recomputing directory visibility)"
      - from: SUBMITTED
        to: OPEN
        trigger: "POST /society/improvement-plans/{id}/review with outcome CHANGES_REQUESTED (revision cycle)"
        actor: AccreditationReviewer
        preconditions:
          - "plan.status == SUBMITTED"
        side_effects:
          - "plan.due_date := current logical date + ACTIVE catalog plan_response_days"

  - entity: Credential
    initial_state: ACTIVE
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: LAPSED
        trigger: "system: clock advance makes current logical date strictly greater than date(expires_at)"
        actor: system
        preconditions:
          - "credential.status == ACTIVE"
        side_effects: []
      - from: LAPSED
        to: EXPIRED
        trigger: "system: clock advance makes current logical date strictly greater than date(expires_at) + renewal_grace_months of the ACTIVE catalog"
        actor: system
        preconditions:
          - "credential.status == LAPSED"
        side_effects: []
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /society/credentials/{id}/renew"
        actor: AdultLearner | Registrar
        preconditions:
          - "renewal window open and CE hours and fee checks pass (see validations)"
        side_effects:
          - "cycle_start := current logical date; expires_at := now + ACTIVE catalog credential_validity_months; renewed_count += 1; issued_at := now"
          - "ce_hours_cycle_credited rebases to the new cycle (prior-cycle entries fall out of the CYCLE window)"
      - from: LAPSED
        to: ACTIVE
        trigger: "POST /society/credentials/{id}/renew (inside grace window; late fee applies)"
        actor: AdultLearner | Registrar
        preconditions:
          - "renewal window (including grace) open and CE hours and fee checks pass"
        side_effects:
          - "cycle_start := current logical date; expires_at := now + ACTIVE catalog credential_validity_months; renewed_count += 1; issued_at := now"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /society/credentials/{id}/revoke"
        actor: AccreditationReviewer
        preconditions:
          - "credential.status in {ACTIVE, LAPSED}"
        side_effects:
          - "every Classroom with lead_credential_id == this credential gets compliance_override := NONCOMPLIANT_LEAD (mutation of each such classroom)"
          - "each affected classroom's school recomputes compliant_classroom_count (mutation of the school's computed state)"
          - "if an affected school's membership_level == ACCREDITED and at least one classroom flipped to NONCOMPLIANT_LEAD: auto-create an ImprovementPlan (school_id, visit_id null, required_actions ['Restore a credentialed lead teacher of matching age level'], due_date := today + plan_response_days)"
      - from: LAPSED
        to: REVOKED
        trigger: "POST /society/credentials/{id}/revoke"
        actor: AccreditationReviewer
        preconditions:
          - "credential.status in {ACTIVE, LAPSED}"
        side_effects:
          - "same classroom and school cascade as ACTIVE -> REVOKED"

  - entity: PracticumPlacement
    initial_state: ACTIVE
    terminal_states: [VERIFIED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: HOURS_COMPLETE
        trigger: "system: POST /society/practicum-placements/{id}/log-hours pushes hours_logged >= target_hours"
        actor: system
        preconditions:
          - "placement.status == ACTIVE"
        side_effects: []
      - from: HOURS_COMPLETE
        to: VERIFIED
        trigger: "POST /society/practicum-placements/{id}/verify"
        actor: ProgramDirector
        preconditions:
          - "placement.status == HOURS_COMPLETE"
          - "acting ProgramDirector owns the placement learner's program (X-User-ID == learner.program_id)"
        side_effects:
          - "learner transitions IN_PRACTICUM -> PRACTICUM_COMPLETE"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /society/practicum-placements/{id}/cancel"
        actor: ProgramDirector
        preconditions:
          - "placement.status == ACTIVE"
        side_effects: []

  - entity: AdultLearner
    initial_state: ENROLLED
    terminal_states: [CREDENTIALED]
    transitions:
      - from: ENROLLED
        to: IN_PRACTICUM
        trigger: "system: a PracticumPlacement for this learner is created ACTIVE"
        actor: system
        preconditions:
          - "learner.status == ENROLLED"
        side_effects: []
      - from: IN_PRACTICUM
        to: PRACTICUM_COMPLETE
        trigger: "system: the learner's placement is VERIFIED"
        actor: system
        preconditions:
          - "learner.status == IN_PRACTICUM"
        side_effects: []
      - from: PRACTICUM_COMPLETE
        to: CREDENTIALED
        trigger: "system: a Credential is issued to this learner"
        actor: system
        preconditions:
          - "learner.status == PRACTICUM_COMPLETE"
        side_effects: []

  - entity: PDEvent
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "system: clock advance makes current logical datetime strictly greater than end_at"
        actor: system
        preconditions:
          - "event.status == SCHEDULED"
        side_effects: []

  - entity: CECreditEntry
    initial_state: ACTIVE
    terminal_states: [VOID]
    transitions:
      - from: ACTIVE
        to: VOID
        trigger: "POST /society/ce-entries/{id}/void"
        actor: SocietyAdmin
        preconditions:
          - "entry.status == ACTIVE"
        side_effects:
          - "credential.ce_hours_cycle_credited and ce_hours_rolling_credited recomputed (ledger sync; calculations.ce_hours_qualification)"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, resolved by OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: application-create-stale-school
    parent_entity: School
    write_endpoint: "POST /society/school-applications"
    occ_field: "expected_school_version"
    description: |
      Creating a SchoolApplication against a School whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just created an application or self-study (or
      mutated the school) and the current writer's view of the school is
      therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: self-study-create-stale-school
    parent_entity: School
    write_endpoint: "POST /society/self-studies"
    occ_field: "expected_school_version"
    description: |
      Creating a SelfStudy against a School whose version has advanced since
      the client last observed it is rejected; the new self-study would
      legitimately supersede a sibling in-flight draft, so the stale writer
      must re-read the school first.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: plan-respond-stale-plan
    parent_entity: ImprovementPlan
    write_endpoint: "POST /society/improvement-plans/{id}/respond"
    occ_field: "expected_improvement_plan_version"
    description: |
      Responding to an ImprovementPlan whose version has advanced since the
      client last observed it is rejected; a newer response supersedes the
      prior one, so a stale writer must re-read the plan first.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: classroom_ratio_compliance
    trigger: "on POST /society/classroom-audits (computed at audit creation)"
    algorithm: threshold
    formula: |
      ratio_students_per_adult = round_half_up(students_present / adults_present, 2)
      cap = audit.catalog.max_students_per_adult_by_level[classroom.age_level]
      ratio_pass = (ratio_students_per_adult <= cap)   # boundary: equality PASSES
    input_set: "the audit's own students_present/adults_present; catalog pinned at audit creation"
    constants:
      ROUND_DECIMALS: 2
    precision: "ratio stored at 2 decimal places, round_half_up; comparison uses the rounded value"
    variants: []

  - name: work_period_compliance
    trigger: "on POST /society/classroom-audits"
    algorithm: threshold
    formula: |
      work_period_pass = (observed_uninterrupted_minutes >= catalog.min_uninterrupted_work_minutes_by_level[age_level])
      # boundary: exactly the minimum PASSES (>=, not >)
    input_set: "audit.observed_uninterrupted_minutes; pinned catalog minimum for the classroom's age_level"
    constants: {}
    precision: "integer minutes, no rounding"
    variants: []

  - name: materials_completeness_score
    trigger: "on POST /society/classroom-audits"
    algorithm: weighted_scoring
    formula: |
      # ROUNDING ORDER IS PINNED: round per group FIRST, then average.
      for each group g in materials_groups:
          score_g = round_half_up(g.present_count / g.required_count, 2)
      score = arithmetic_mean(score_g)            # NOT re-rounded before comparison
      materials_score = round_half_up(score, 4)   # stored display value
      materials_pass = (score >= catalog.materials_pass_threshold)
      # Counter-order (sum then round) is FORBIDDEN: for groups
      # [8/9, 8/9, 8/9, 1/1] per-group-first yields 0.9175 (pass at 0.90),
      # sum-first yields 25/28 = 0.8929 (fail). The pinned order passes.
    input_set: "audit.materials_groups; pinned catalog materials_pass_threshold"
    constants: {}
    precision: "per-group 2dp half-up; mean exact; stored 4dp half-up"
    variants: []

  - name: classroom_audit_verdict
    trigger: "on POST /society/classroom-audits, after the three component checks"
    algorithm: aggregation
    formula: |
      multi_age_pass = (classroom.declared_age_span_years >= catalog.min_multi_age_span_years_by_level[classroom.age_level])
      verdict = COMPLIANT if (ratio_pass AND work_period_pass AND materials_pass AND multi_age_pass) else NONCOMPLIANT
      failed_checks = names of failed component checks, in fixed order [RATIO, WORK_PERIOD, MATERIALS, MULTI_AGE]
    input_set: "the audit's four component pass flags"
    constants: {}
    precision: "boolean conjunction"
    variants: []

  - name: annual_membership_dues
    trigger: "on GET /society/schools/{id} (computed read; field annual_dues_cents) and implicitly whenever dues_current is evaluated for display"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is pinned (circular-looking dependency resolved):
      #   1. base depends on level; 2. marginal student fee; 3. classroom
      #   surcharge; 4. floor; 5. cap. Floor applies BEFORE cap.
      base = BASE_DUES_CENTS[level]                    # APPLICANT quotes the AFFILIATE schedule
      fee  = marginal over total_enrollment:
               first 100 students      -> 1500c each
               students 101..300       -> 1200c each  (marginal, NOT average)
               students 301+           ->  900c each
      surcharge = PER_CLASSROOM_SURCHARGE_CENTS * count_of_classrooms
      raw = base + fee + surcharge
      annual_dues_cents = min(MAX_DUES_CENTS, max(MIN_DUES_CENTS, raw))
      # Verified anchors: AFFILIATE/0 students/1 room -> raw 48000 -> 60000 (floor);
      # MEMBER/250/4 -> 452000; AFFILIATE 100 students/1 room -> 198000,
      # 101 students -> 199200 (only the 101st student bills at 1200c);
      # ACCREDITED/1500/20 -> raw 1780000 -> 1500000 (cap).
    input_set: "school.membership_level, school.total_enrollment (sum over ALL its classrooms regardless of audit state), count of its classrooms"
    constants:
      BASE_DUES_AFFILIATE_CENTS: 40000
      BASE_DUES_MEMBER_CENTS: 90000
      BASE_DUES_ACCREDITED_CENTS: 150000
      TIER1_UP_TO: 100
      TIER1_RATE_CENTS: 1500
      TIER2_UP_TO: 300
      TIER2_RATE_CENTS: 1200
      TIER3_RATE_CENTS: 900
      PER_CLASSROOM_SURCHARGE_CENTS: 8000
      MIN_DUES_CENTS: 60000
      MAX_DUES_CENTS: 1500000
    precision: "integer cents; no rounding needed"
    variants: []

  - name: ce_hours_qualification
    trigger: "on GET /society/credentials/{id} (both variants exposed), on POST /society/pd-events/{id}/attendance and /society/ce-entries/{id}/void (recompute), and authoritatively on POST /society/credentials/{id}/renew (CYCLE only)"
    algorithm: aggregation
    formula: |
      ACTIVE entries = CECreditEntry rows with credential_id == credential.id AND status == ACTIVE
      CYCLE   = sum(hours) where date(earned_at) >= credential.cycle_start
      ROLLING = sum(hours) where date(earned_at) >= (current logical date - ACTIVE catalog credential_validity_months)
      qualifies = (CYCLE >= ACTIVE catalog.ce_hours_required)   # boundary: exact equality QUALIFIES
      # earned_at is the event's end_at, not posting time; VOID rows excluded from both.
    input_set: "the credential's CECreditEntry rows (status ACTIVE only); credential.cycle_start; ACTIVE catalog's credential_validity_months and ce_hours_required"
    constants: {}
    precision: "hours at 1 decimal place; comparisons exact"
    variants:
      - name: CYCLE
        when: "authoritative at renewal adjudication (POST renew)"
        difference: "counts only hours earned on or after cycle_start; identical ledger can qualify under ROLLING yet fail under CYCLE"
      - name: ROLLING
        when: "provisional estimate surfaced on credential reads (ce_hours_rolling_credited)"
        difference: "counts the trailing validity-months window regardless of cycle boundaries; prior-cycle hours still inside the window inflate ROLLING above CYCLE"

  - name: school_classroom_clearance
    trigger: "on POST /society/school-applications/{id}/submit (variant chosen by application type)"
    algorithm: aggregation
    formula: |
      For each classroom of the school, consider ClassroomAudit rows (any visit, any auditor).
      MOST RECENT = greatest created_at; two audits filed in the same logical instant are
      tie-broken by server receipt order (the later-filed request wins) — never by id.
      LATEST_PASS:      classroom clears iff its MOST RECENT audit verdict == COMPLIANT
                        and classroom.compliance_override == NONE
      NO_FAIL_IN_CYCLE: classroom clears iff NO audit with observed_at date within the trailing
                        12 calendar months (inclusive of today) has verdict == NONCOMPLIANT,
                        AND at least one such in-window audit exists,
                        AND classroom.compliance_override == NONE
      school clears iff EVERY classroom clears (schools with zero classrooms never clear)
      # Same audit history can clear under LATEST_PASS and fail under NO_FAIL_IN_CYCLE:
      # one NONCOMPLIANT followed by one COMPLIANT in the window -> LATEST_PASS true,
      # NO_FAIL_IN_CYCLE false.
    input_set: "all ClassroomAudit rows for the school's classrooms; classroom.compliance_override; current logical date"
    constants:
      CYCLE_WINDOW_MONTHS: 12
    precision: "date-granularity window, inclusive endpoints"
    variants:
      - name: LATEST_PASS
        when: "MEMBERSHIP application submit"
        difference: "only the latest audit per classroom matters; an earlier NONCOMPLIANT is forgiven"
      - name: NO_FAIL_IN_CYCLE
        when: "ACCREDITATION application submit"
        difference: "any NONCOMPLIANT inside the trailing 12-month window fails the classroom even if a later audit passed"

  - name: practicum_completion
    trigger: "on POST /society/practicum-placements/{id}/log-hours"
    algorithm: threshold
    formula: |
      hours_logged_new = hours_logged + payload.hours
      if hours_logged_new >= placement.target_hours: transition ACTIVE -> HOURS_COMPLETE
      # boundary: exactly target_hours completes (>=, not >)
    input_set: "the placement's hours_logged and target_hours (target pinned at creation from the then-ACTIVE catalog)"
    constants: {}
    precision: "integer hours"
    variants: []

  - name: directory_visibility
    trigger: "recomputed on any mutation of school.membership_level, school.standing, school.brand_compliant inputs, or school.dues_paid_through; consumed by GET /society/directory and GET /society/directory/{school_id}"
    algorithm: constraint_propagation
    formula: |
      directory_visible = (membership_level in {MEMBER, ACCREDITED})
                          AND (standing == GOOD_STANDING)
                          AND brand_compliant
                          AND dues_current
    input_set: "the school's four gating fields"
    constants: {}
    precision: "boolean"
    variants: []

  - name: transfer_conservation
    trigger: "on POST /society/classrooms/{id}/transfer-students"
    algorithm: waterfall_allocation
    formula: |
      precondition: 0 < student_count <= from_classroom.enrolled_student_count
      from.enrolled_student_count -= student_count
      to.enrolled_student_count   += student_count
      INVARIANT: school.total_enrollment after == school.total_enrollment before
      # boundary: student_count == from.enrolled_student_count is allowed (leaves 0)
    input_set: "the two classrooms, which MUST share school_id and age_level"
    constants: {}
    precision: "integer seats"
    variants: []

  - name: renewal_fee
    trigger: "on POST /society/credentials/{id}/renew"
    algorithm: threshold
    formula: |
      expected_fee_cents = RENEWAL_BASE_FEE_CENTS + (LATE_FEE_CENTS if credential.status == LAPSED else 0)
      payload.fee_cents must equal expected_fee_cents exactly (else ERR_FEE_MISMATCH)
    input_set: "credential.status"
    constants:
      RENEWAL_BASE_FEE_CENTS: 8500
      LATE_FEE_CENTS: 5000
    precision: "integer cents"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; first failure wins)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is a declared role. Anonymous is valid only for /society/directory endpoints."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except GET /society/directory and GET /society/directory/{school_id} (which accept Anonymous)"

  - priority: 2
    category: auth
    check: "X-User-Role is listed in the endpoint's roles."
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path ids exist, validated left-to-right; then body-supplied FK ids (school_id, learner_id, classroom_id, credential_id, self_study_id, supervisor_credential_id, host_school_id, to_classroom_id, visit_id) that are PRESENT and well-formed; a missing FK field defers to the priority-4 shape check."
    error_id: ERR_SCHOOL_NOT_FOUND
    http_status: 404
    applies_to: "all (entity-specific variants: ERR_CLASSROOM_NOT_FOUND, ERR_AUDIT_NOT_FOUND, ERR_PROGRAM_NOT_FOUND, ERR_LEARNER_NOT_FOUND, ERR_PLACEMENT_NOT_FOUND, ERR_CREDENTIAL_NOT_FOUND, ERR_APPLICATION_NOT_FOUND, ERR_SELF_STUDY_NOT_FOUND, ERR_VISIT_NOT_FOUND, ERR_PLAN_NOT_FOUND, ERR_CATALOG_NOT_FOUND, ERR_EVENT_NOT_FOUND, ERR_CE_ENTRY_NOT_FOUND)"

  - priority: 4
    category: business_constraint
    check: "Field shape of the payload (syntactic constraint class): required fields present, enum members valid, numeric ranges honored, materials_groups non-empty with present_count <= required_count per group, log hours > 0. Later checks assume well-typed inputs."
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all"

  - priority: 5
    category: auth
    check: "Entity-backed ownership: SchoolAdmin's X-User-ID equals the target school id (or the school_id of the target child resource); ProgramDirector's X-User-ID equals the target program id (or the learner's program_id); AdultLearner's X-User-ID equals placement.learner_id / credential.learner_id; Consultant's X-User-ID equals visit.consultant_id for report filing (and for audits carrying a visit_id)."
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all role-scoped write endpoints"

  - priority: 6
    category: state
    check: "OCC expected_*_version match (ERR_STALE_VERSION 412) is evaluated here, BEFORE the state-transition check within this priority (a stale replay on a now-invalid state still yields 412). Target entity is in a state from which the requested transition exists (e.g., submit only from DRAFT/RETURNED; verify only from HOURS_COMPLETE; report only from SCHEDULED; attendance only on COMPLETED events; renew only from ACTIVE/LAPSED -> else ERR_CREDENTIAL_NOT_RENEWABLE; wrong-typed application for the school's level; enrollment into PROBATION/SUSPENDED program; generic else ERR_INVALID_STATE)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints (entity-specific variants: ERR_CREDENTIAL_NOT_RENEWABLE 409, ERR_STALE_VERSION 412)"

  - priority: 7
    category: business_temporal
    check: "Temporal window rules: placement end_date strictly after start_date and strictly after today; log-hours work_date inside [start_date, end_date]; learner half-open placement overlap [start,end) against existing ACTIVE/HOURS_COMPLETE placements (end == start adjacency allowed); consultant visit overlap with buffer (new.window_start <= existing.window_end + buffer_days AND existing.window_start <= new.window_end + buffer_days, over non-CANCELLED visits; touching windows conflict); visit window_start >= today and window_end >= window_start; renewal window [date(expires_at) - renewal_window_months, date(expires_at) + renewal_grace_months] inclusive; ACCREDITATION tenure: today >= member_since + min_membership_months_before_accreditation (equality passes)."
    error_id: ERR_PLACEMENT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "placement create (ERR_PLACEMENT_WINDOW_OVERLAP 409, ERR_PLACEMENT_WINDOW_INVALID 422); log-hours (ERR_PLACEMENT_WINDOW_INVALID 422); visit create (ERR_CONSULTANT_SCHEDULE_CONFLICT 409, ERR_VISIT_WINDOW_INVALID 422); credential renew (ERR_RENEWAL_WINDOW_CLOSED 422); application submit ACCREDITATION (ERR_ACCREDITATION_TENURE_TOO_SHORT 422)"

  - priority: 8
    category: business_referential
    check: "Cross-entity reference consistency (inputs already well-typed per priority 4): learner.age_level in program.age_levels_offered; placement supervisor credential (when provided) age_level == learner.age_level; classroom lead credential age_level == classroom.age_level; credential issuance age_level == learner.age_level; visit.self_study_id belongs to visit.school_id and is ACCEPTED; audit visit_id belongs to the classroom's school; ACCREDITATION submit requires an ACCEPTED self-study (ERR_SELF_STUDY_REQUIRED) and a REPORT_FILED visit on it (ERR_VERIFICATION_VISIT_REQUIRED); placement host school level in {AFFILIATE, MEMBER, ACCREDITED} (ERR_HOST_SCHOOL_INELIGIBLE)."
    error_id: ERR_AGE_LEVEL_MISMATCH
    http_status: 422
    applies_to: "learner create, placement create, classroom create, credential create, visit create, audit create, application submit (variants ERR_SELF_STUDY_REQUIRED, ERR_VERIFICATION_VISIT_REQUIRED, ERR_HOST_SCHOOL_INELIGIBLE, all 422)"

  - priority: 9
    category: business_constraint
    check: "Uniqueness, capacity, posture and segregation: display_name case-insensitively unique (ERR_DISPLAY_NAME_TAKEN 409); one in-flight application per school (ERR_IN_FLIGHT_APPLICATION_EXISTS 409); one in-flight self-study per school (ERR_IN_FLIGHT_SELF_STUDY_EXISTS 409); one {ACTIVE,LAPSED} credential per learner+age_level (ERR_DUPLICATE_CREDENTIAL 409); one non-VOID CE entry per credential+event (ERR_DUPLICATE_ATTENDANCE 409); when supervisor_credential_id is provided: supervisor credential ACTIVE (ERR_SUPERVISOR_CREDENTIAL_INACTIVE 409) and supervising fewer than 3 other ACTIVE placements (ERR_SUPERVISOR_CAPACITY_EXCEEDED 422); AFFILIATION submit needs >= 1 classroom (ERR_CLASSROOM_REQUIRED 422) and brand_compliant (ERR_BRAND_DIFFERENTIATION_REQUIRED 422); MEMBERSHIP submit needs LATEST_PASS clearance (ERR_CLASSROOM_NONCOMPLIANT 422); ACCREDITATION submit needs NO_FAIL_IN_CYCLE clearance (ERR_CLASSROOM_NONCOMPLIANT 422) and no plan in {OPEN, OVERDUE, SUBMITTED} (ERR_OPEN_IMPROVEMENT_PLAN 409); ACCREDITATION approval reviewer != supporting visit consultant (ERR_SEGREGATION_OF_DUTIES 409); brand differentiation at school create/brand update (ERR_BRAND_DIFFERENTIATION_REQUIRED 422); renewal CE CYCLE hours >= ce_hours_required (ERR_INSUFFICIENT_CE_HOURS 422); transfer within same school and age_level with student_count <= source enrollment (ERR_TRANSFER_CROSS_SCHOOL 422 / ERR_AGE_LEVEL_MISMATCH 422 / ERR_TRANSFER_EXCEEDS_ENROLLMENT 422); program accreditation requires practicum_hours_by_level[level] >= ACTIVE catalog practicum_min_hours_by_level[level] for every offered level (ERR_PRACTICUM_STANDARD_UNMET 422); credential issuance requires learner PRACTICUM_COMPLETE (ERR_PRACTICUM_NOT_VERIFIED 422) and program ACCREDITED (ERR_PROGRAM_NOT_ACCREDITED 409); catalog activation effective_from strictly later than current ACTIVE (ERR_CATALOG_EFFECTIVE_ORDER 422); self-study/placement/audit creation requires an ACTIVE catalog (ERR_NO_ACTIVE_CATALOG 422)."
    error_id: ERR_IN_FLIGHT_APPLICATION_EXISTS
    http_status: 409
    applies_to: "write endpoints as enumerated"

  - priority: 10
    category: business_fiscal
    check: "Fiscal gates LAST: application submit requires school.dues_current (ERR_DUES_DELINQUENT 402); application APPROVED review rechecks dues_current (ERR_DUES_DELINQUENT 402); renewal fee_cents must equal calculations.renewal_fee (ERR_FEE_MISMATCH 422)."
    error_id: ERR_DUES_DELINQUENT
    http_status: 402
    applies_to: "application submit/review, credential renew (ERR_FEE_MISMATCH 422)"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  - method: POST
    path: "/society/_clock/set_current_utc"
    description: "Test-driving logical clock. Sets the server's current UTC instant. Before any call, the logical clock reads exactly 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock time. Advancing the clock runs the time sweep: Credential ACTIVE->LAPSED and LAPSED->EXPIRED, ImprovementPlan OPEN->OVERDUE (with the school standing cascade), PDEvent SCHEDULED->COMPLETED."
    roles: [SocietyAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["time-based transitions sweep with their documented cascades"]

  - method: POST
    path: "/society/standards-catalogs"
    description: "Create a standards catalog edition in DRAFT."
    roles: [SocietyAdmin]
    code: 201
    input: [version_label, effective_from, min_uninterrupted_work_minutes_by_level, max_students_per_adult_by_level, materials_pass_threshold, min_multi_age_span_years_by_level, practicum_min_hours_by_level, ce_hours_required, credential_validity_months, renewal_window_months, renewal_grace_months, min_membership_months_before_accreditation, consultant_travel_buffer_days, plan_response_days]
    output: StandardsCatalog
    side_effects: []

  - method: GET
    path: "/society/standards-catalogs/{id}"
    description: "Read one catalog edition."
    roles: [SocietyAdmin, AccreditationReviewer, SchoolAdmin, ProgramDirector, Registrar, Consultant]
    code: 200
    input: []
    output: StandardsCatalog
    side_effects: []

  - method: POST
    path: "/society/standards-catalogs/{id}/activate"
    description: "Activate a DRAFT catalog; the previously ACTIVE catalog becomes RETIRED."
    roles: [SocietyAdmin]
    code: 200
    input: []
    output: StandardsCatalog
    side_effects: ["previous ACTIVE catalog -> RETIRED"]

  - method: POST
    path: "/society/schools"
    description: "Onboard a school at membership_level APPLICANT, standing GOOD_STANDING. Brand fields are validated immediately (differentiation rule for non-ACCREDITED schools using the method name)."
    roles: [SocietyAdmin]
    code: 201
    input: [name, display_name, uses_method_name, "descriptor?", contact_email]
    output: School
    side_effects: []

  - method: GET
    path: "/society/schools/{id}"
    description: "Read one school including computed dues_current, brand_compliant, directory_visible, total_enrollment, compliant_classroom_count, annual_dues_cents."
    roles: [SocietyAdmin, AccreditationReviewer, SchoolAdmin, Registrar]
    code: 200
    input: []
    output: School
    side_effects: []

  - method: GET
    path: "/society/schools"
    description: "List schools with optional filters."
    roles: [SocietyAdmin, AccreditationReviewer, Registrar]
    code: 200
    input: ["membership_level?", "standing?", "pinned_catalog_id?", "limit?", "offset?"]
    output: "School[]"
    side_effects: []

  - method: POST
    path: "/society/schools/{id}/brand"
    description: "Update the school's public brand usage. Re-validates the differentiation rule and display_name uniqueness."
    roles: [SchoolAdmin]
    code: 200
    input: [display_name, uses_method_name, "descriptor?"]
    output: School
    side_effects: ["brand_compliant and directory_visible recomputed", "increments School.version by 1"]

  - method: POST
    path: "/society/schools/{id}/dues-payments"
    description: "Record a dues payment; sets dues_paid_through to period_end."
    roles: [SocietyAdmin]
    code: 201
    input: [period_start, period_end, amount_cents]
    output: School
    side_effects: ["school.dues_paid_through := period_end", "dues_current and directory_visible recomputed", "increments School.version by 1"]

  - method: POST
    path: "/society/schools/{id}/standing"
    description: "Reviewer-driven standing change (PROBATION, SUSPENDED, GOOD_STANDING, REVOKED) per the standing state machine."
    roles: [AccreditationReviewer]
    code: 200
    input: [to_standing, "reason?"]
    output: School
    side_effects: ["standing transition side effects (application suspend/resume/deny, directory recompute)", "increments School.version by 1"]

  - method: GET
    path: "/society/directory"
    description: "Public member-school directory: only directory_visible schools, public fields."
    roles: [Anonymous]
    code: 200
    input: ["limit?", "offset?"]
    output: "{ items: array, total_count: integer, has_more: boolean }"
    side_effects: []

  - method: GET
    path: "/society/directory/{school_id}"
    description: "Parent-facing verification: for a listed school returns the full public verification payload; for a known but non-listed school returns listed false with display_name only; unknown id -> ERR_SCHOOL_NOT_FOUND."
    roles: [Anonymous]
    code: 200
    input: []
    output: "{ school_id: string, display_name: string, listed: boolean, membership_level: string, standing: string, accredited: boolean, brand_compliant: boolean }"
    side_effects: []

  - method: POST
    path: "/society/classrooms"
    description: "Create a classroom. Lead credential (if supplied) must be ACTIVE with matching age_level."
    roles: [SchoolAdmin]
    code: 201
    input: [school_id, name, age_level, declared_age_span_years, enrolled_student_count, assistant_count, "lead_credential_id?"]
    output: Classroom
    side_effects: []

  - method: GET
    path: "/society/classrooms/{id}"
    description: "Read one classroom including latest_audit_verdict and compliance_override."
    roles: [SocietyAdmin, AccreditationReviewer, SchoolAdmin, Consultant]
    code: 200
    input: []
    output: Classroom
    side_effects: []

  - method: GET
    path: "/society/classrooms"
    description: "List classrooms with optional filters."
    roles: [SocietyAdmin, AccreditationReviewer, SchoolAdmin, Consultant]
    code: 200
    input: ["school_id?", "lead_credential_id?", "age_level?", "limit?", "offset?"]
    output: "Classroom[]"
    side_effects: []

  - method: POST
    path: "/society/classrooms/{id}/transfer-students"
    description: "Move students between two classrooms of the SAME school and SAME age_level. Conserves school.total_enrollment (calculations.transfer_conservation)."
    roles: [SchoolAdmin]
    code: 200
    input: [to_classroom_id, student_count]
    output: "{ from_classroom_id: string, to_classroom_id: string, from_enrolled_student_count: integer, to_enrolled_student_count: integer, school_total_enrollment: integer }"
    side_effects: ["both classrooms' enrolled_student_count mutated", "both classrooms' version incremented"]

  - method: POST
    path: "/society/classroom-audits"
    description: "File a classroom standards audit. The catalog applied is the school's pinned_catalog_id if set, else the currently ACTIVE catalog (pinned on the audit). Computes ratio, work-period, materials, multi-age checks and the verdict."
    roles: [Consultant]
    code: 201
    input: [classroom_id, "visit_id?", students_present, adults_present, observed_uninterrupted_minutes, materials_groups]
    output: ClassroomAudit
    side_effects: ["classroom.latest_audit_verdict updated", "school.compliant_classroom_count recomputed"]

  - method: GET
    path: "/society/classroom-audits/{id}"
    description: "Read one audit with all computed fields."
    roles: [SocietyAdmin, AccreditationReviewer, SchoolAdmin, Consultant]
    code: 200
    input: []
    output: ClassroomAudit
    side_effects: []

  - method: GET
    path: "/society/classroom-audits"
    description: "List audits with optional filters."
    roles: [SocietyAdmin, AccreditationReviewer, SchoolAdmin, Consultant]
    code: 200
    input: ["classroom_id?", "catalog_id?", "visit_id?", "verdict?", "limit?", "offset?"]
    output: "ClassroomAudit[]"
    side_effects: []

  - method: POST
    path: "/society/teacher-education-programs"
    description: "Register a teacher education program in PROVISIONAL status."
    roles: [SocietyAdmin]
    code: 201
    input: [name, age_levels_offered, course_contact_hours_by_level, practicum_hours_by_level]
    output: TeacherEducationProgram
    side_effects: []

  - method: GET
    path: "/society/teacher-education-programs/{id}"
    description: "Read one program."
    roles: [SocietyAdmin, AccreditationReviewer, ProgramDirector, Registrar]
    code: 200
    input: []
    output: TeacherEducationProgram
    side_effects: []

  - method: POST
    path: "/society/teacher-education-programs/{id}/status"
    description: "Accreditation decision on a program. Allowed transitions: PROVISIONAL->ACCREDITED (requires practicum_hours_by_level >= ACTIVE catalog practicum_min_hours_by_level for every offered level, else ERR_PRACTICUM_STANDARD_UNMET), ACCREDITED->PROBATION, PROBATION->ACCREDITED, ACCREDITED->SUSPENDED, PROBATION->SUSPENDED."
    roles: [AccreditationReviewer]
    code: 200
    input: [to_status, "reason?"]
    output: TeacherEducationProgram
    side_effects: []

  - method: POST
    path: "/society/adult-learners"
    description: "Enroll an adult learner into a program (PROVISIONAL or ACCREDITED). Learner age_level must be in the program's age_levels_offered."
    roles: [ProgramDirector]
