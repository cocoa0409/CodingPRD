            - "PROBE B (APPROVED funder on the WRONG claim): create sa2 (total_amount_cents 500000, funding_claim_id ${claim2}) with a freshly captured expected_association_version, open its ballot, cast YES owner ballots from ${oa}/${ua} and ${ob}/${ub}, close-ballot -> yes_share_bp == 10000 and approval_status == APPROVED with Association.reserve_designated_cents == 500000. Repeating the trigger on ${claim1} STILL returns 409 ERR_LITIGATION_FUNDING_MISSING"
            - "PROBE C (FAILED funder on the RIGHT claim): cast a single YES owner ballot from ${oa}/${ua} on ${sa1} and close-ballot -> eligible_weight_bp == 10000, yes_weight_bp == 6000, yes_share_bp == 6000, approval_status == FAILED, Association.reserve_designated_cents unchanged at 500000. Repeating the trigger STILL returns 409 ERR_LITIGATION_FUNDING_MISSING — the guard reads approval_status == APPROVED, not merely 'a ballot was tallied'"
            - "PROBE D (correct funder): create sa3 (total_amount_cents 2000000, funding_claim_id ${claim1}), open its ballot, cast YES from ${oa}/${ua} and ${ob}/${ub}, close-ballot -> approval_status == APPROVED and Association.reserve_designated_cents == 2500000. The trigger now returns 200 with InsuranceClaim.${claim1}.litigation_status == IN_LITIGATION, adjustment_status still ADJUSTED_ASSOCIATION (the dimensions are independent) and disclosure_required still true"
            - "PROBE E (reverse direction): POST /special-assessments/{sa3}/rescind as BoardDirector ${d1} returns HTTP 409 with error.id == ERR_LITIGATION_ACTIVE and leaves approval_status == APPROVED with reserve_designated_cents == 2500000, while POST /special-assessments/{sa2}/rescind returns 200 (its claim is not in suit) -> sa2 approval_status == RESCINDED, funding_status == REFUNDED (collected_cents == 0), reserve_designated_cents == 2000000"
            - "PROBE F (unblocking): POST /insurance-claims/${claim1}/litigation-stage with stage RESOLVED returns 200 with litigation_status == RESOLVED and disclosure_required == false; POST /special-assessments/{sa3}/rescind then returns 200 with approval_status == RESCINDED and Association.${assoc_id}.reserve_designated_cents == 0"

      - name: work_order_start_gated_by_common_element_status_decommissioned_only
        grounds:
          - state_machines.MaintenanceWorkOrder.SCHEDULED_to_IN_PROGRESS
          - validations[priority=18]  # ERR_ELEMENT_NOT_SERVICEABLE
          - endpoints[POST /work-orders/{id}/start]
          - endpoints[POST /vendor-contracts/{id}/submit]
          - entities.CommonElement.fields.status
        distinguishing_aspect: |
          A DIFFERENT entity pair — (MaintenanceWorkOrder, CommonElement) — where the blocking
          state lives on the referenced element, not on the work order or its contract. The gate
          is asymmetric and must be tested for exactly ONE forbidden value: DECOMMISSIONED blocks
          start, while IMPAIRED does NOT, so an implementation that requires SERVICEABLE fails.
          The same element state simultaneously blocks POST /vendor-contracts/{id}/submit for an
          unrelated draft contract, and the successful start must NOT be blocked by the now-stale
          pinned_element_version (priority 20 applies only to activate and reinstate).
