      - name: scorecard_return_sends_the_pool_back_to_draft_and_clears_the_certifier
        claim_type: Side Effect Execution
        grounds:
          - "state_machines.BusinessUnitPool: SCORECARD_SUBMITTED -> DRAFT"
          - entities.BusinessUnitPool.fields.scorecard_certified_by_user_id
          - endpoints."POST /bu-pools/{poolId}/scorecard-decision"
        distinguishing_aspect: |
          A RETURN decision on a submitted scorecard is not a no-op: the pool
          goes back to DRAFT, scorecard_certified_by_user_id stays null, and
          the manager can then submit a REVISED achievement (92.50 replacing
          the original 140.00) which is what a later certification would fund
          from. An implementation that leaves the pool SCORECARD_SUBMITTED
          blocks the revision entirely.
        test_recipe:
          setup:
            - "One unit, one plan, L5 target row, one pool whose manager submitted a 140.00 scorecard (status SCORECARD_SUBMITTED)."
          setup_api_calls:
            - call: "POST /business-units"
              payload: { unit_code: "UNIT-B3", name: "Unit B3" }
              as: PlanAdmin
              captures: { unit_id: "$.data.id" }
            - call: "POST /bonus-plans"
              payload: { plan_year: 2026, plan_name: "FY26 Scorecard Return Plan", plan_period_start: "2026-01-01", plan_period_end: "2027-01-01", payment_date: "2027-03-15", company_weight_pct: 50.00, business_unit_weight_pct: 30.00, individual_weight_pct: 20.00 }
              as: PlanAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /job-level-targets"
              payload: { plan_id: "${plan_id}", job_level: "L5", target_bonus_pct: 20.00, guideline_min_ratio: 0.25, guideline_max_ratio: 2.00 }
              as: PlanAdmin
            - call: "POST /bu-pools"
              payload: { plan_id: "${plan_id}", business_unit_id: "${unit_id}" }
              as: PlanAdmin
              captures: { pool_id: "$.data.id" }
            - call: "POST /bu-pools/${pool_id}/submit-scorecard"
              payload: { bu_metric_achievement_pct: 140.00, scorecard_narrative: "best year ever" }
              as: BusinessUnitManager
              as_user_id: "${unit_id}"
          trigger:
            - call: "POST /bu-pools/${pool_id}/scorecard-decision"
              payload: { decision: "RETURN", decision_note: "evidence does not support 140.00" }
              as: CompensationCommittee
              as_user_id: "cc_scorecard"
            - call: "POST /bu-pools/${pool_id}/submit-scorecard"
              payload: { bu_metric_achievement_pct: 92.50, scorecard_narrative: "restated against audited unit results" }
              as: BusinessUnitManager
              as_user_id: "${unit_id}"
          assert:
            - "After the RETURN: BusinessUnitPool.${pool_id}.calibration_status == DRAFT and BusinessUnitPool.${pool_id}.scorecard_certified_by_user_id == null"
            - "After the resubmission: BusinessUnitPool.${pool_id}.calibration_status == SCORECARD_SUBMITTED"
            - "BusinessUnitPool.${pool_id}.bu_metric_achievement_pct == 92.50"
            - "BusinessUnitPool.${pool_id}.scorecard_narrative == restated against audited unit results"
            - "BusinessUnitPool.${pool_id}.funded_cents == 0 and BusinessUnitPool.${pool_id}.distribution_status == NO_ELIGIBLE_PARTICIPANTS"

