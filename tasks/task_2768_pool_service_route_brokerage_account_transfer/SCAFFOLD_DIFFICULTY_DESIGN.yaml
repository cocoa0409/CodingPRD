            - "Deal.${deal_id}.status == CLOSED and Deal.${deal_id}.clawback_status == CLAWBACK_TRIGGERED after all three calls"

      - name: service_account_transferred_lost_recovered_transfer_cycle
        grounds:
          - "state_machines.ServiceAccount.TRANSFERRED_to_LOST"
          - "state_machines.ServiceAccount.LOST_to_TRANSFERRED"
          - "entities.ServiceAccount.fields.transfer_status"
          - "entities.ServiceAccount.fields.current_mrr_cents"
          - "entities.Deal.fields.clawback_status"
          - "entities.EscrowAccount.fields.holdback_release_blocked"
          - "concurrency_rules[attrition-append-stale-deal]"
        distinguishing_aspect: "Cyclic shape on ServiceAccount.transfer_status driven entirely by appended events rather than by a direct endpoint on the entity: TRANSFERRED -> LOST -> TRANSFERRED is reached only through POST /attrition-events with event_type CANCELLED then RECOVERED, and re-entering TRANSFERRED restores current_mrr_cents to 14318 and un-blocks the escrow holdback that the outbound edge blocked."
