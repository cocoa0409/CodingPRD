              captures: { rf_sku: $.data.sku, rf_class: $.data.malt_class, rf_price: $.data.list_price_cents_per_lb, rf_moist: $.data.max_moisture_pct, rf_dp: $.data.min_diastatic_power, rf_pallet: $.data.pallet_quantity_lbs }
            - call: "GET /yeast-strains/${rf_strain_id}"
              payload: {}
              as: CreditManager
              captures: { rf_code: $.data.strain_code, rf_ferm: $.data.fermentation_type, rf_lead: $.data.propagation_lead_time_days, rf_viab: $.data.viability_pct_at_ship, rf_cells: $.data.cells_per_ml_slurry_billion, rf_minb: $.data.min_batch_l, rf_vmax: $.data.vessel_max_l }
          assert:
