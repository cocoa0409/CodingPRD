            - "the response status is 409"
            - "the response error_id is ERR_AGENCY_SUSPENDED"
            - "PortalInventoryOffer.${o1_id}.status == SUSPENDED and suspension_reason == AGENCY_SUSPENDED"
            - "PortalInventoryOffer.${o2_id}.status == SUSPENDED and suspension_reason == AGENCY_SUSPENDED"
            - "TravelAgencyPartner.${ag_id}.status == SUSPENDED and suspended_reason == PARITY_AUDIT"

      - name: transaction_reversal_clawback_frees_the_rotation_headroom_it_had_consumed
        claim_type: action_endpoint
        grounds:
          - state_machines.Transaction.POSTED_to_REVERSED
          - calculations.transaction_points_award.input_set
          - entities.PointsLedgerEntry
        distinguishing_aspect: "The CLAWBACK entry removes the reversed transaction's 600 points and its 30000 cents leaves the rotation accumulator, so a second identical transaction sees the full 50000-cent headroom again and earns another 600 points; lifetime_points_earned stays 1200 because CLAWBACK is not an EARN_* entry_type, and with no transfers outstanding HOP 3 holds nothing."
        test_recipe:
          setup:
            - "One CORE account, one MAPPED GROCERY category at base_multiplier 1.0, and one ACTIVE rotation at bonus_multiplier 2.0 with capped_spend_cents 50000 over [2026-09-01T00:00:00Z, 2026-10-01T00:00:00Z)."
          setup_api_calls:
            - call: "POST /rewards/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/merchant-categories"
              payload: { mcc_code: "5411", display_name: "Grocery Stores", base_category: "GROCERY", base_multiplier: 1.0, is_fallback: false }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { mc_id: $.data.id }
            - call: "POST /rewards/accounts"
              payload: { cardholder_name: "Lior Ben-Ami", email: "lior@example.com", card_product_code: "CORE", enrolled_at: "2025-01-16T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { a_id: $.data.id }
            - call: "POST /rewards/rotations"
              payload: { merchant_category_id: "${mc_id}", rotation_code: "SEPT-CLAWBACK", bonus_multiplier: 2.0, capped_spend_cents: 50000, window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { rot_id: $.data.id }
            - call: "POST /rewards/rotations/${rot_id}/publish"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/ops-runs"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/transactions"
              payload: { account_id: "${a_id}", mcc_code: "5411", amount_cents: 30000, posted_at: "2026-09-05T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { txn1_id: $.data.id }
          trigger:
            - call: "POST /rewards/transactions/${txn1_id}/reverse"
              payload: { reversal_reason: "MERCHANT_CREDIT" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/transactions"
              payload: { account_id: "${a_id}", mcc_code: "5411", amount_cents: 30000, posted_at: "2026-09-05T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { txn2_id: $.data.id }
          assert:
            - "Transaction.${txn1_id}.base_points == 300 and bonus_points == 300 and total_points_earned == 600"
            - "Transaction.${txn1_id}.rotation_id == ${rot_id} and rotation_eligible_cents == 30000"
            - "after the reverse Transaction.${txn1_id}.status == REVERSED and reversal_reason == MERCHANT_CREDIT"
            - "a PointsLedgerEntry with entry_type CLAWBACK, points_delta -600, source_entity_type TRANSACTION and source_entity_id ${txn1_id} exists"
            - "Transaction.${txn2_id}.rotation_eligible_cents == 30000 and bonus_points == 300 and total_points_earned == 600"
            - "GET /rewards/points-ledger-entries with account_id ${a_id} returns total_count 5"
            - "Account.${a_id}.points_balance == 600 and lifetime_points_earned == 1200"
            - "Account.${a_id}.transfer_hold_count == 0 and fraud_posture == CLEAR"

  - section: errors
    instances:
      - name: unresolvable_path_id_and_body_id_both_not_found
        claim_type: error_triggerability
        grounds:
          - validations[priority=30]
          - errors.ERR_RESOURCE_NOT_FOUND
        distinguishing_aspect: "Path ids resolve before body ids, and body ids resolve left to right in declaration order: an unknown offer id in the path returns ERR_RESOURCE_NOT_FOUND naming PortalInventoryOffer, a transfer request with an unknown account_id names Account, and one with a real account_id but an unknown partner_agreement_id names PartnerAgreement."
        test_recipe:
          setup:
            - "One CORE account and one OPEN offer exist, so every id in the failing calls except the deliberately bogus one resolves."
          setup_api_calls:
            - call: "POST /rewards/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/accounts"
              payload: { cardholder_name: "Kai Lindqvist", email: "kai@example.com", card_product_code: "CORE", enrolled_at: "2025-01-17T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { a_id: $.data.id, a_v: $.data.version }
            - call: "POST /rewards/agency-partners"
              payload: { name: "Bare Fare Consolidators", contracted_markup_bps: 0, parity_tolerance_bps: 0, invoice_terms_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ag_id: $.data.id }
            - call: "POST /rewards/inventory-offers"
              payload: { agency_partner_id: "${ag_id}", itinerary_code: "YYZ-LHR-36", depart_at: "2026-10-20T21:00:00Z", return_at: "2026-10-28T07:00:00Z", net_rate_cents: 10000, agency_public_price_cents: 10000, agency_public_seats: 2, portal_seats: 2, tax_cents: 0 }
              as: AgencySupplier
              as_user_id: "${ag_id}"
              captures: { o_v: $.data.version }
          trigger:
            - call: "POST /rewards/inventory-offers/11111111-1111-4111-8111-111111111111/book"
              payload: { account_id: "${a_id}", traveler_name: "Kai Lindqvist", expected_offer_version: "${o_v}" }
              as: Cardholder
              as_user_id: "${a_id}"
            - call: "POST /rewards/transfer-requests"
              payload: { account_id: "33333333-3333-4333-8333-333333333333", partner_agreement_id: "44444444-4444-4444-8444-444444444444", points_out: 1000, expected_account_version: "${a_v}" }
              as: Cardholder
              as_user_id: "33333333-3333-4333-8333-333333333333"
            - call: "POST /rewards/transfer-requests"
              payload: { account_id: "${a_id}", partner_agreement_id: "44444444-4444-4444-8444-444444444444", points_out: 1000, expected_account_version: "${a_v}" }
              as: Cardholder
              as_user_id: "${a_id}"
          assert:
            - "the book call returns 404 with error_id ERR_RESOURCE_NOT_FOUND and a message naming PortalInventoryOffer"
            - "the first transfer call returns 404 with error_id ERR_RESOURCE_NOT_FOUND and a message naming Account"
            - "the second transfer call returns 404 with error_id ERR_RESOURCE_NOT_FOUND and a message naming PartnerAgreement"
            - "every one of the three responses carries a non-empty error_id and message and no data payload"
            - "GET /rewards/transfer-requests with account_id ${a_id} returns total_count 0"

      - name: every_catalogued_error_is_reachable_across_the_two_design_files
        claim_type: error_coverage
        grounds:
          - errors
        distinguishing_aspect: "All 41 catalogued error_ids are triggered by at least one named instance across SCAFFOLD_DIFFICULTY_DESIGN.yaml and this file: the 401/403 family by the rbac section, ERR_RESOURCE_NOT_FOUND / ERR_INVALID_REQUEST / ERR_INVALID_PAGINATION by the errors, entities and validations sections, the two 412 OCC codes by the cross_cutting_complexity_layers section, ERR_INVALID_STATE_TRANSITION / ERR_OFFER_HAS_COMMITTED_SEATS / ERR_ACCOUNT_HAS_IN_FLIGHT_POINTS / ERR_AGREEMENT_HAS_IN_FLIGHT_TRANSFERS / ERR_TRANSFER_REVERSAL_WINDOW_EXPIRED / ERR_BENEFIT_NOT_CONSUMABLE by the state_machines section, and the remaining business codes by the validations section plus the nine §1.8 rules."
        test_recipe:
          setup:
            - "No fixtures of its own: this instance is the cross-check that no error_id in §1.6 lacks a triggering test, and it is satisfied by running the suites named above."
          setup_api_calls: []
          trigger:
            - call: "GET /rewards/_clock"
              as: ProgramAdmin
              as_user_id: "admin-1"
          assert:
            - "the error catalog has 41 entries and each error_id appears as the asserted error_id of at least one instance in SCAFFOLD_DIFFICULTY_DESIGN.yaml or SCAFFOLD_CORNER_DESIGN.yaml"
            - "no instance asserts an error_id that is absent from the §1.6 catalog"

  - section: rbac
    instances:
      - name: cardholder_creating_an_account_forbidden
        claim_type: role_denied
        grounds:
          - rbac.Cardholder.denied
          - validations[priority=20]
          - errors.ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: "POST /rewards/accounts is a ProgramAdmin exclusive operation, so a Cardholder attempt returns 403 ERR_ROLE_NOT_PERMITTED and no row is written — the role check at priority 20 runs before any body validation, so an otherwise perfect payload is still refused."
        test_recipe:
          setup:
            - "One existing account so the acting Cardholder id resolves."
          setup_api_calls:
            - call: "POST /rewards/accounts"
              payload: { cardholder_name: "Nora Bianchi", email: "nora@example.com", card_product_code: "CORE", enrolled_at: "2025-01-18T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /rewards/accounts"
              payload: { cardholder_name: "Self Enrolled", email: "self@example.com", card_product_code: "PREMIER", enrolled_at: "2026-08-01T00:00:00Z" }
              as: Cardholder
              as_user_id: "${a_id}"
          assert:
            - "the response status is 403"
            - "the response error_id is ERR_ROLE_NOT_PERMITTED"
            - "GET /rewards/accounts as ProgramAdmin returns total_count 1"

      - name: cardholder_reading_another_cardholders_account_forbidden
        claim_type: peer_role_isolation
        grounds:
          - rbac.Cardholder.shared_operations
          - validations[priority=21]
          - errors.ERR_ACCOUNT_OWNERSHIP_REQUIRED
        distinguishing_aspect: "GET /rewards/accounts/{id} is shared with the Cardholder role but scoped to the caller's own row: reading another account returns 403 ERR_ACCOUNT_OWNERSHIP_REQUIRED at priority 21, while the same call against the caller's own id returns 200 — a peer-role boundary, not a role-list denial."
        test_recipe:
          setup:
            - "Two accounts, A and B."
          setup_api_calls:
            - call: "POST /rewards/accounts"
              payload: { cardholder_name: "Owen Pike", email: "owen@example.com", card_product_code: "CORE", enrolled_at: "2025-01-19T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { a_id: $.data.id }
            - call: "POST /rewards/accounts"
              payload: { cardholder_name: "Pia Rossi", email: "pia@example.com", card_product_code: "PREMIER", enrolled_at: "2025-01-20T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { b_id: $.data.id }
          trigger:
            - call: "GET /rewards/accounts/${b_id}"
              as: Cardholder
              as_user_id: "${a_id}"
            - call: "GET /rewards/accounts/${a_id}"
              as: Cardholder
              as_user_id: "${a_id}"
          assert:
            - "the cross-account read returns 403 with error_id ERR_ACCOUNT_OWNERSHIP_REQUIRED"
            - "the own-account read returns 200 with data.id ${a_id} and cardholder_name Owen Pike"

      - name: agency_ticketing_another_agencys_order_forbidden
        claim_type: peer_role_isolation
        grounds:
          - rbac.AgencySupplier.exclusive_operations
          - validations[priority=22]
          - errors.ERR_AGENCY_SCOPE_VIOLATION
        distinguishing_aspect: "The AgencySupplier scope check at priority 22 compares X-User-ID against the agency behind the order's offer, so a second ACTIVE agency ticketing a rival's CONFIRMED order returns 403 ERR_AGENCY_SCOPE_VIOLATION before the fulfillment precondition is ever consulted, and the owning agency then tickets the same order successfully."
        test_recipe:
          setup:
            - "Two ACTIVE agencies at markup 0 / tolerance 0. Agency ONE owns an offer that a CORE account with 10000 points has booked and confirmed."
          setup_api_calls:
            - call: "POST /rewards/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/merchant-categories"
              payload: { mcc_code: "5411", display_name: "Grocery Stores", base_category: "GROCERY", base_multiplier: 1.0, is_fallback: false }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/accounts"
              payload: { cardholder_name: "Quinn Adler", email: "quinn@example.com", card_product_code: "CORE", enrolled_at: "2025-01-21T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { a_id: $.data.id }
            - call: "POST /rewards/transactions"
              payload: { account_id: "${a_id}", mcc_code: "5411", amount_cents: 1000000, posted_at: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/agency-partners"
              payload: { name: "Agency One", contracted_markup_bps: 0, parity_tolerance_bps: 0, invoice_terms_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ag1_id: $.data.id }
            - call: "POST /rewards/agency-partners"
              payload: { name: "Agency Two", contracted_markup_bps: 0, parity_tolerance_bps: 0, invoice_terms_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ag2_id: $.data.id }
            - call: "POST /rewards/inventory-offers"
              payload: { agency_partner_id: "${ag1_id}", itinerary_code: "PHL-BCN-39", depart_at: "2026-10-22T19:00:00Z", return_at: "2026-10-30T09:00:00Z", net_rate_cents: 10000, agency_public_price_cents: 10000, agency_public_seats: 2, portal_seats: 2, tax_cents: 0 }
              as: AgencySupplier
              as_user_id: "${ag1_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /rewards/inventory-offers/${o_id}/book"
              payload: { account_id: "${a_id}", traveler_name: "Quinn Adler", expected_offer_version: "${o_v}" }
              as: Cardholder
              as_user_id: "${a_id}"
              captures: { ro_id: $.data.id }
            - call: "POST /rewards/redemption-orders/${ro_id}/confirm"
              as: Cardholder
              as_user_id: "${a_id}"
          trigger:
            - call: "POST /rewards/redemption-orders/${ro_id}/ticket"
              payload: { ticket_number: "TKT-RIVAL-1" }
              as: AgencySupplier
              as_user_id: "${ag2_id}"
            - call: "POST /rewards/redemption-orders/${ro_id}/ticket"
              payload: { ticket_number: "TKT-OWNER-1" }
              as: AgencySupplier
              as_user_id: "${ag1_id}"
          assert:
            - "the rival ticketing call returns 403 with error_id ERR_AGENCY_SCOPE_VIOLATION"
            - "after the rival attempt RedemptionOrder.${ro_id}.fulfillment_status == CONFIRMED and ticket_number == null"
            - "TravelAgencyPartner.${ag2_id}.payable_cents == 0"
            - "the owning agency's call returns 200 and RedemptionOrder.${ro_id}.fulfillment_status == TICKETED"
            - "RedemptionOrder.${ro_id}.ticket_number == TKT-OWNER-1 and settlement_status == AGENCY_INVOICED"
            - "TravelAgencyPartner.${ag1_id}.payable_cents == 10000"

      - name: request_with_missing_auth_headers_rejected
        claim_type: authentication
        grounds:
          - validations[priority=10]
          - errors.ERR_MISSING_AUTH_HEADERS
        distinguishing_aspect: "Both headers are mandatory on every endpoint including reads: a GET /rewards/_clock with no X-User-Role and no X-User-ID returns 401 ERR_MISSING_AUTH_HEADERS, and so does a write whose X-User-ID is an empty string."
        test_recipe:
          setup:
            - "Empty database; the clock is at its 2026-08-01T00:00:00Z default."
          setup_api_calls: []
          trigger:
            - call: "GET /rewards/_clock"
            - call: "POST /rewards/accounts"
              payload: { cardholder_name: "Headerless Hank", email: "hank@example.com", card_product_code: "CORE", enrolled_at: "2025-01-22T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: ""
          assert:
            - "the header-less read returns 401 with error_id ERR_MISSING_AUTH_HEADERS"
            - "the empty-X-User-ID write returns 401 with error_id ERR_MISSING_AUTH_HEADERS"
            - "GET /rewards/accounts as ProgramAdmin returns total_count 0"

      - name: request_with_unknown_role_header_rejected
        claim_type: authentication
        grounds:
          - validations[priority=11]
          - errors.ERR_UNKNOWN_ROLE
        distinguishing_aspect: "An unrecognised X-User-Role is a 401 ERR_UNKNOWN_ROLE at priority 11, one step ahead of the 403 ERR_ROLE_NOT_PERMITTED that a recognised-but-unauthorised role would get: Concierge on a read the Cardholder role is allowed to make is still refused."
        test_recipe:
          setup:
            - "Empty database; the clock is at its 2026-08-01T00:00:00Z default."
          setup_api_calls: []
          trigger:
            - call: "GET /rewards/_clock"
              as: Concierge
              as_user_id: "concierge-1"
          assert:
            - "the response status is 401"
            - "the response error_id is ERR_UNKNOWN_ROLE"

      - name: segregation_of_duties_blocks_the_same_operator_on_both_halves
        claim_type: segregation_of_duties
        grounds:
          - rbac.role_model
          - validations[priority=23]
          - errors.ERR_SEGREGATION_OF_DUTIES
        distinguishing_aspect: "Segregation of duties compares opaque operator ids, not roles: the ProgramApprover acting as admin-1 cannot announce the notice admin-1 drafted, and the approver acting as fraud-1 cannot release the transfer fraud-1 held; a different operator id in the same role completes both actions."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z. One PENDING_APPROVAL notice drafted by admin-1 with effective_at 2026-11-01T00:00:00Z."
            - "One CORE account holding 10000 points with a SUBMITTED transfer of 4000 points that fraud-1 has placed on hold."
          setup_api_calls:
            - call: "POST /rewards/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/merchant-categories"
              payload: { mcc_code: "5411", display_name: "Grocery Stores", base_category: "GROCERY", base_multiplier: 1.0, is_fallback: false }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/change-notices"
              payload: { notice_code: "SOD-2026-11", change_type: "BENEFIT_REMOVAL", effective_at: "2026-11-01T00:00:00Z", grandfather_window_days: 30, cohort_enrolled_before: "2025-01-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { pn_id: $.data.id }
            - call: "POST /rewards/change-notices/${pn_id}/submit"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/accounts"
              payload: { cardholder_name: "Rhea Kapoor", email: "rhea@example.com", card_product_code: "CORE", enrolled_at: "2025-01-23T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { a_id: $.data.id }
            - call: "POST /rewards/transactions"
              payload: { account_id: "${a_id}", mcc_code: "5411", amount_cents: 1000000, posted_at: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/partner-agreements"
              payload: { partner_name: "Skyward Miles", partner_program_code: "SKYW", ratio_points_out: 1000, ratio_partner_units_in: 1000, min_transfer_points: 1000, transfer_increment_points: 1000, transfer_latency_hours: 48, reversal_window_hours: 72, settlement_cost_cents_per_1k: 900 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { pa_id: $.data.id }
            - call: "POST /rewards/partner-agreements/${pa_id}/submit"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/partner-agreements/${pa_id}/approve"
              as: ProgramApprover
              as_user_id: "approver-1"
            - call: "GET /rewards/accounts/${a_id}"
              as: Cardholder
              as_user_id: "${a_id}"
              captures: { a_v: $.data.version }
            - call: "POST /rewards/transfer-requests"
              payload: { account_id: "${a_id}", partner_agreement_id: "${pa_id}", points_out: 4000, expected_account_version: "${a_v}" }
              as: Cardholder
              as_user_id: "${a_id}"
              captures: { tr_id: $.data.id }
            - call: "POST /rewards/transfer-requests/${tr_id}/hold"
              payload: { hold_reason: "MANUAL_REVIEW" }
              as: FraudAnalyst
              as_user_id: "fraud-1"
          trigger:
            - call: "POST /rewards/change-notices/${pn_id}/announce"
              as: ProgramApprover
              as_user_id: "admin-1"
            - call: "POST /rewards/transfer-requests/${tr_id}/release"
              as: ProgramApprover
              as_user_id: "fraud-1"
            - call: "POST /rewards/change-notices/${pn_id}/announce"
              as: ProgramApprover
              as_user_id: "approver-2"
            - call: "POST /rewards/transfer-requests/${tr_id}/release"
              as: ProgramApprover
              as_user_id: "approver-2"
          assert:
            - "the announce as admin-1 returns 403 with error_id ERR_SEGREGATION_OF_DUTIES"
            - "ProgramChangeNotice.${pn_id}.status == PENDING_APPROVAL after that refusal"
            - "the release as fraud-1 returns 403 with error_id ERR_SEGREGATION_OF_DUTIES"
            - "TransferRequest.${tr_id}.status == HELD and held_by_user_id == fraud-1 after that refusal"
            - "the announce as approver-2 returns 200 and ProgramChangeNotice.${pn_id}.approved_by_user_id == approver-2"
            - "the release as approver-2 returns 200 and TransferRequest.${tr_id}.status == SUBMITTED"
            - "TransferRequest.${tr_id}.released_by_user_id == approver-2 and hold_reason == MANUAL_REVIEW"
            - "Account.${a_id}.transfer_hold_count == 1 and fraud_posture == CLEAR"

      - name: fraud_analyst_listing_liability_snapshots_forbidden
        claim_type: rbac_allow_and_deny
        grounds:
          - rbac.FraudAnalyst.shared_operations
          - rbac.FraudAnalyst.denied
          - errors.ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: "The FraudAnalyst's read surface is enumerated, not global: GET /rewards/accounts and GET /rewards/fraud-cases are allowed and return 200, while GET /rewards/liability-snapshots and GET /rewards/agency-partners are outside the role list and return 403 ERR_ROLE_NOT_PERMITTED."
        test_recipe:
          setup:
            - "One account, one agency and one snapshot exist so each list would have a row to return if it were permitted."
          setup_api_calls:
            - call: "POST /rewards/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/accounts"
              payload: { cardholder_name: "Sami Toure", email: "sami@example.com", card_product_code: "CORE", enrolled_at: "2025-01-24T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { a_id: $.data.id }
            - call: "POST /rewards/agency-partners"
              payload: { name: "Northwind Travel", contracted_markup_bps: 2000, parity_tolerance_bps: 1000, invoice_terms_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/liability-snapshots"
              payload: { as_of: "2026-08-01T00:00:00Z", method: "FAIR_VALUE" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "GET /rewards/accounts"
              as: FraudAnalyst
              as_user_id: "fraud-1"
            - call: "GET /rewards/fraud-cases"
              payload: { account_id: "${a_id}" }
              as: FraudAnalyst
              as_user_id: "fraud-1"
            - call: "GET /rewards/liability-snapshots"
              as: FraudAnalyst
              as_user_id: "fraud-1"
            - call: "GET /rewards/agency-partners"
              as: FraudAnalyst
              as_user_id: "fraud-1"
          assert:
            - "the accounts list returns 200 with total_count 1"
            - "the fraud-cases list returns 200 with total_count 0"
            - "the liability-snapshots list returns 403 with error_id ERR_ROLE_NOT_PERMITTED"
            - "the agency-partners list returns 403 with error_id ERR_ROLE_NOT_PERMITTED"

  - section: cross_cutting_complexity_layers
    instances:
      - name: offer_book_rejects_a_version_the_agency_has_already_resynced_away
        layer: optimistic_concurrency
        claim_type: stale_version_rejected
        grounds:
          - concurrency_rules[rule_id=offer-book-stale-offer-version]
          - errors.ERR_STALE_OFFER_VERSION
          - validations[priority=35]
        distinguishing_aspect: "The offer keeps two free seats, so nothing about its state blocks a second booking — only the expected_offer_version does. Booking with the version read before the agency's resync returns 412 ERR_STALE_OFFER_VERSION and commits no seat, and the very same call with the post-resync version succeeds, proving the refusal came from the version compare and not from capacity."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z. A CORE account earns 10000 points from a 1,000,000-cent grocery transaction at the 1.0 base multiplier."
            - "A zero-markup, zero-tax agency offer at net 10000 cents with 2 public and 2 portal seats; its version is captured, then a resync bumps the row."
          setup_api_calls:
            - call: "POST /rewards/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/merchant-categories"
              payload: { mcc_code: "5411", display_name: "Grocery Stores", base_category: "GROCERY", base_multiplier: 1.0, is_fallback: false }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/accounts"
              payload: { cardholder_name: "Tomas Weber", email: "tomas@example.com", card_product_code: "CORE", enrolled_at: "2025-01-25T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { a_id: $.data.id }
            - call: "POST /rewards/transactions"
              payload: { account_id: "${a_id}", mcc_code: "5411", amount_cents: 1000000, posted_at: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/agency-partners"
              payload: { name: "Parity Travel", contracted_markup_bps: 0, parity_tolerance_bps: 0, invoice_terms_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ag_id: $.data.id }
            - call: "POST /rewards/inventory-offers"
              payload: { agency_partner_id: "${ag_id}", itinerary_code: "BOS-LIS-51", depart_at: "2026-11-04T21:00:00Z", return_at: "2026-11-12T08:00:00Z", net_rate_cents: 10000, agency_public_price_cents: 10000, agency_public_seats: 2, portal_seats: 2, tax_cents: 0 }
              as: AgencySupplier
              as_user_id: "${ag_id}"
              captures: { o_id: $.data.id, o_v1: $.data.version }
            - call: "POST /rewards/inventory-offers/${o_id}/resync"
              payload: { net_rate_cents: 10000, agency_public_price_cents: 10000, agency_public_seats: 2, portal_seats: 2 }
              as: AgencySupplier
              as_user_id: "${ag_id}"
              captures: { o_v2: $.data.version }
          trigger:
            - call: "POST /rewards/inventory-offers/${o_id}/book"
              payload: { account_id: "${a_id}", traveler_name: "Tomas Weber", expected_offer_version: "${o_v1}" }
              as: Cardholder
              as_user_id: "${a_id}"
            - call: "POST /rewards/inventory-offers/${o_id}/book"
              payload: { account_id: "${a_id}", traveler_name: "Tomas Weber", expected_offer_version: "${o_v2}" }
              as: Cardholder
              as_user_id: "${a_id}"
          assert:
            - "the stale booking returns 412 with error_id ERR_STALE_OFFER_VERSION"
            - "after the refusal PortalInventoryOffer.${o_id}.portal_seats_committed == 0 and availability_status == AVAILABLE"
            - "after the refusal Account.${a_id}.points_balance == 10000 and points_pending_redemption == 0"
            - "the resynced-version booking returns 201 with fulfillment_status QUOTED and points_debited 10000"
            - "PortalInventoryOffer.${o_id}.portal_seats_committed == 1 and version == 3"
            - "Account.${a_id}.points_pending_redemption == 10000 and available_points == 0"

      - name: transfer_create_rejects_an_account_version_that_predates_the_first_debit
        layer: optimistic_concurrency
        claim_type: stale_version_rejected
        grounds:
          - concurrency_rules[rule_id=transfer-create-stale-account-version]
          - errors.ERR_STALE_ACCOUNT_VERSION
          - validations[priority=36]
        distinguishing_aspect: "The account may hold several in-flight transfers at once, so the second create is refused only because expected_account_version still names the pre-debit version: 412 ERR_STALE_ACCOUNT_VERSION with no ledger movement, and the retry with the freshly re-read version is admitted. Version is compared, not the points arithmetic — the request would have passed every amount check."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z. A CORE account holds 10000 points. One ACTIVE 1000:1000 agreement with min 1000 and increment 1000."
            - "The account's version is read once, then a 1000-point transfer is submitted against it."
          setup_api_calls:
            - call: "POST /rewards/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/merchant-categories"
              payload: { mcc_code: "5411", display_name: "Grocery Stores", base_category: "GROCERY", base_multiplier: 1.0, is_fallback: false }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/accounts"
              payload: { cardholder_name: "Uma Lindqvist", email: "uma@example.com", card_product_code: "CORE", enrolled_at: "2025-01-26T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { a_id: $.data.id }
            - call: "POST /rewards/transactions"
              payload: { account_id: "${a_id}", mcc_code: "5411", amount_cents: 1000000, posted_at: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/partner-agreements"
              payload: { partner_name: "Cloudline Miles", partner_program_code: "CLDL", ratio_points_out: 1000, ratio_partner_units_in: 1000, min_transfer_points: 1000, transfer_increment_points: 1000, transfer_latency_hours: 48, reversal_window_hours: 72, settlement_cost_cents_per_1k: 900 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { pa_id: $.data.id }
            - call: "POST /rewards/partner-agreements/${pa_id}/submit"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/partner-agreements/${pa_id}/approve"
              as: ProgramApprover
              as_user_id: "approver-1"
            - call: "GET /rewards/accounts/${a_id}"
              as: Cardholder
              as_user_id: "${a_id}"
              captures: { a_v1: $.data.version }
            - call: "POST /rewards/transfer-requests"
              payload: { account_id: "${a_id}", partner_agreement_id: "${pa_id}", points_out: 1000, expected_account_version: "${a_v1}" }
              as: Cardholder
              as_user_id: "${a_id}"
              captures: { tr1_id: $.data.id }
          trigger:
            - call: "POST /rewards/transfer-requests"
              payload: { account_id: "${a_id}", partner_agreement_id: "${pa_id}", points_out: 1000, expected_account_version: "${a_v1}" }
              as: Cardholder
              as_user_id: "${a_id}"
            - call: "GET /rewards/accounts/${a_id}"
              as: Cardholder
              as_user_id: "${a_id}"
              captures: { a_v2: $.data.version }
            - call: "POST /rewards/transfer-requests"
              payload: { account_id: "${a_id}", partner_agreement_id: "${pa_id}", points_out: 1000, expected_account_version: "${a_v2}" }
              as: Cardholder
              as_user_id: "${a_id}"
          assert:
            - "the replayed-version create returns 412 with error_id ERR_STALE_ACCOUNT_VERSION"
            - "after the refusal GET /rewards/transfer-requests?account_id=${a_id} returns total_count 1"
            - "after the refusal Account.${a_id}.points_pending_transfer == 1000 and available_points == 9000"
            - "the re-read version differs from ${a_v1}"
            - "the retry returns 201 with status SUBMITTED and points_out 1000"
            - "Account.${a_id}.points_balance == 10000 and points_pending_transfer == 2000 and available_points == 8000"
            - "TransferRequest.${tr1_id}.status == SUBMITTED"

      - name: posture_thresholds_fire_exactly_at_thirty_and_sixty
        layer: rate_threshold_triggers
        claim_type: instantaneous_threshold_boundary
        grounds:
          - calculations.account_fraud_posture
          - calculations.ato_risk_score
          - "constants POSTURE_WATCH_SCORE 30 / POSTURE_LOCK_SCORE 60 / SIGNAL_WEIGHTS"
        distinguishing_aspect: "Three accounts differ only in which signals their OPEN case carries: NEW_PAYEE scores 25 and stays CLEAR, DEVICE_CHANGE scores exactly 30 and reaches WATCH, and PASSWORD_RESET + NEW_PAYEE + EMAIL_CHANGE scores exactly 60 and reaches LOCKED. Both thresholds are inclusive, so an off-by-one comparison mislabels the 30 account and the 60 account while leaving the 25 account correct."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z. Three accounts A25, A30 and A60, each with one OPEN ACCOUNT_TAKEOVER case and no transfers at all, so the review leg never runs and risk_score is the pure signal sum."
          setup_api_calls:
            - call: "POST /rewards/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/accounts"
              payload: { cardholder_name: "Vera Costa", email: "vera@example.com", card_product_code: "CORE", enrolled_at: "2025-01-27T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { a25_id: $.data.id }
            - call: "POST /rewards/accounts"
              payload: { cardholder_name: "Wes Aoki", email: "wes@example.com", card_product_code: "CORE", enrolled_at: "2025-01-28T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { a30_id: $.data.id }
            - call: "POST /rewards/accounts"
              payload: { cardholder_name: "Yuki Mori", email: "yuki@example.com", card_product_code: "CORE", enrolled_at: "2025-01-29T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { a60_id: $.data.id }
          trigger:
            - call: "POST /rewards/fraud-cases"
              payload: { account_id: "${a25_id}", case_type: "ACCOUNT_TAKEOVER", signals: ["NEW_PAYEE"], device_fingerprint_changed: false }
              as: FraudAnalyst
              as_user_id: "fraud-1"
              captures: { c25_id: $.data.id }
            - call: "POST /rewards/fraud-cases"
              payload: { account_id: "${a30_id}", case_type: "ACCOUNT_TAKEOVER", signals: ["DEVICE_CHANGE"], device_fingerprint_changed: true }
              as: FraudAnalyst
              as_user_id: "fraud-1"
              captures: { c30_id: $.data.id }
            - call: "POST /rewards/fraud-cases"
              payload: { account_id: "${a60_id}", case_type: "ACCOUNT_TAKEOVER", signals: ["PASSWORD_RESET", "NEW_PAYEE", "EMAIL_CHANGE"], device_fingerprint_changed: false }
              as: FraudAnalyst
              as_user_id: "fraud-1"
              captures: { c60_id: $.data.id }
          assert:
            - "FraudCase.${c25_id}.risk_score == 25 and status == OPEN"
            - "Account.${a25_id}.fraud_posture == CLEAR"
            - "FraudCase.${c30_id}.risk_score == 30"
            - "Account.${a30_id}.fraud_posture == WATCH"
            - "FraudCase.${c60_id}.risk_score == 60"
            - "Account.${a60_id}.fraud_posture == LOCKED"
            - "every FraudCase.review_score is null because no case has been reviewed"

      - name: two_holds_alone_pin_an_account_at_watch
        layer: rate_threshold_triggers
        claim_type: cumulative_threshold_boundary
        excluded_because:
          difficulty_instance: cascade_transaction_reversal_to_negative_balance_to_holds_to_posture
          rationale: "The cumulative side of the threshold layer — transfer_hold_count reaching exactly POSTURE_WATCH_HOLD_COUNT (2) and pinning the account at WATCH with no fraud case in play, monotonic across releases — is exercised end to end by that §1.8 instance, which counts the holds the reversal cascade places and asserts the posture that results. A separate corner test would replay the same counter."

      - name: three_level_cascade_from_a_single_transaction_reversal
        layer: cascading_side_effects
        claim_type: multi_level_chain
        excluded_because:
          difficulty_instance: cascade_transaction_reversal_to_negative_balance_to_holds_to_posture
          rationale: "The N-level chain claim for this layer is that instance: reversal writes the CLAWBACK entry (hop 1), the recomputed balance turns strictly negative (hop 2), the in-flight transfers are held and transfer_hold_count rises (hop 3), and the posture recompute lands on WATCH/LOCKED (hop 4), with the ordering sensitivity asserted at every hop."

      - name: cascade_that_rejects_in_flight_work_and_restores_the_ledger
        layer: cascading_side_effects
        claim_type: compensating_chain
        excluded_because:
          difficulty_instance: cascade_fraud_confirmation_to_lock_to_rejection_to_ledger_restoration
          rationale: "The partial-failure and compensation half of this layer is that instance: confirming the case locks the account, the lock rejects each SUBMITTED and HELD transfer, and every rejection restores its debited points so the balance returns to its pre-transfer value — the cascade's undo path, asserted per hop."

      - name: provisional_and_final_issuer_cost_variants_diverge
        layer: dual_variant_calculation
        claim_type: variant_divergence_and_delta
        excluded_because:
          difficulty_instance: dual_variant_redemption_issuer_cost_provisional_vs_final
          rationale: "Both variants on the same order, the divergence between them and the delta applied to the agency payable when settlement switches provisional to final are all asserted with pre-computed literals in that §1.8 instance."

      - name: instant_and_review_ato_score_variants_diverge
        layer: dual_variant_calculation
        claim_type: variant_selection_by_context
        excluded_because:
          difficulty_instance: dual_variant_ato_score_instant_vs_review
          rationale: "Variant selection by context — the instant signal-only score while the case is OPEN versus the velocity-and-decay score from UNDER_REVIEW onward, on identical case data — is that instance's whole subject, including the posture flip the switch causes."

  - section: consistency_model
    instances:
      - name: computed_fields_and_cascades_are_visible_in_the_same_response
        claim_type: immediate_visibility
        grounds:
          - complexity_profile.consistency_model
          - endpoints POST /rewards/inventory-offers/{id}/book
          - endpoints POST /rewards/redemption-orders/{id}/confirm
        distinguishing_aspect: "The consistency model is immediate, so a booking's own 201 body already carries the derived points_debited, copay_cents and issuer_cost_provisional_cents, and the sold-out flip it causes on the offer plus the pending balance it causes on the account are readable in the very next GET with no sweep, no ops-run and no re-read delay. Confirmation likewise settles the balance in its own response."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z. A CORE account holds 10000 points. A zero-markup offer at net 8000 cents with 1 public and 1 portal seat and 500 cents of tax."
          setup_api_calls:
            - call: "POST /rewards/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/merchant-categories"
              payload: { mcc_code: "5411", display_name: "Grocery Stores", base_category: "GROCERY", base_multiplier: 1.0, is_fallback: false }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/accounts"
              payload: { cardholder_name: "Zane Okafor", email: "zane@example.com", card_product_code: "CORE", enrolled_at: "2025-01-30T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { a_id: $.data.id }
            - call: "POST /rewards/transactions"
              payload: { account_id: "${a_id}", mcc_code: "5411", amount_cents: 1000000, posted_at: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/agency-partners"
              payload: { name: "Immediate Travel", contracted_markup_bps: 0, parity_tolerance_bps: 0, invoice_terms_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ag_id: $.data.id }
            - call: "POST /rewards/inventory-offers"
              payload: { agency_partner_id: "${ag_id}", itinerary_code: "SEA-AKL-77", depart_at: "2026-12-02T23:00:00Z", return_at: "2026-12-14T06:00:00Z", net_rate_cents: 8000, agency_public_price_cents: 8000, agency_public_seats: 1, portal_seats: 1, tax_cents: 500 }
              as: AgencySupplier
              as_user_id: "${ag_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
          trigger:
            - call: "POST /rewards/inventory-offers/${o_id}/book"
              payload: { account_id: "${a_id}", traveler_name: "Zane Okafor", expected_offer_version: "${o_v}" }
              as: Cardholder
              as_user_id: "${a_id}"
              captures: { ro_id: $.data.id }
            - call: "GET /rewards/inventory-offers/${o_id}"
              as: Cardholder
              as_user_id: "${a_id}"
            - call: "GET /rewards/accounts/${a_id}"
              as: Cardholder
              as_user_id: "${a_id}"
            - call: "POST /rewards/redemption-orders/${ro_id}/confirm"
              as: Cardholder
              as_user_id: "${a_id}"
          assert:
            - "the booking response data already contains points_debited 8000, copay_cents 500 and issuer_cost_provisional_cents 8000"
            - "the booking response data.fulfillment_status == QUOTED and portal_inventory_offer_id == ${o_id}"
            - "the immediately following offer GET shows availability_status SOLD_OUT and portal_seats_committed 1"
            - "the immediately following account GET shows points_balance 10000, points_pending_redemption 8000 and available_points 2000"
            - "the confirm response data.fulfillment_status == CONFIRMED"
            - "a GET of the account right after confirm shows points_balance 2000, points_pending_redemption 0, available_points 2000 and lifetime_points_redeemed 8000"
            - "no ops-run or clock advance is needed for any of these reads to be current"
