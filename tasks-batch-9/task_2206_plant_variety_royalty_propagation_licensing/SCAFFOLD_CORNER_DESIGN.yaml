      - name: annuity_grace_check_runs_before_the_annuity_amount_check
        claim_type: cascading_validation
        grounds:
          - validations[priority=32]
          - validations[priority=38]
          - calculations.annuity_total_due
        distinguishing_aspect: "The amount check at priority 38 needs the figure that calculations.annuity_total_due produces at this instant, but that figure is only meaningful inside the grace window - so priority 32's window check must run first: a payment landing one second past due_date + 90 days with a wrong amount returns ERR_GRACE_PERIOD_EXPIRED, never ERR_ANNUITY_AMOUNT_MISMATCH."
        test_recipe:
          setup:
            - "One Variety with a GRANTED US filing (annuity_base_cents 200000) moved to MAINTENANCE_DUE with annuity_due_date 2026-09-01T00:00:00Z and annuity_grace_days 90, so the inclusive grace boundary is 2026-11-30T00:00:00Z."
            - "The clock is advanced to 2026-11-30T00:00:01Z - one second past the boundary - without any intervening clock call that would have swept the filing to LAPSED."
          setup_api_calls:
            - call: "POST /varieties"
              payload: { denomination: "Harrow Bramble", species: "Rubus idaeus", breeder_code: "HR", base_royalty_cents_per_plant: 35, base_royalty_cents_per_acre: 1200 }
              as: BreederAdmin
              as_user_id: "breeder-1"
              captures: { v_id: $.data.id }
            - call: "POST /protection-filings"
              payload: { variety_id: "${v_id}", instrument_type: "PLANT_PATENT", jurisdiction_code: "US", annuity_base_cents: 200000 }
              as: BreederAdmin
              as_user_id: "breeder-1"
              captures: { f_id: $.data.id }
            - call: "POST /protection-filings/${f_id}/file"
              payload: {}
              as: BreederAdmin
              as_user_id: "breeder-1"
            - call: "POST /protection-filings/${f_id}/grant"
              payload: {}
              as: BreederAdmin
              as_user_id: "breeder-1"
            - call: "POST /protection-filings/${f_id}/schedule-annuity"
              payload: { annuity_due_date: "2026-09-01T00:00:00Z", annuity_grace_days: 90 }
              as: BreederAdmin
              as_user_id: "breeder-1"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-30T00:00:00Z" }
              as: BreederAdmin
              as_user_id: "breeder-1"
            - call: "POST /protection-filings/${f_id}/pay-annuity"
              payload: { paid_amount_cents: 1 }
              as: BreederAdmin
              as_user_id: "breeder-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-30T00:00:01Z" }
              as: BreederAdmin
              as_user_id: "breeder-1"
            - call: "POST /protection-filings/${f_id}/pay-annuity"
              payload: { paid_amount_cents: 1 }
              as: BreederAdmin
              as_user_id: "breeder-1"
          assert:
            - "At exactly the boundary 2026-11-30T00:00:00Z the filing is still MAINTENANCE_DUE (the sweep fires only when now > due_date + grace_days) and the wrong-amount payment returns 422 ERR_ANNUITY_AMOUNT_MISMATCH - priority 38, because priority 32 is satisfied"
            - "One second later the clock sweep has moved ProtectionFiling.${f_id}.status to LAPSED with lapse_reason == GRACE_EXPIRED, so the second payment returns ERR_INVALID_STATE_TRANSITION"
            - "Repeating the experiment WITHOUT the intervening clock sweep - by scheduling the annuity for 2026-09-01T00:00:00Z and jumping straight to 2026-11-30T00:00:01Z in one clock call - the pay-annuity call returns ERR_GRACE_PERIOD_EXPIRED rather than ERR_ANNUITY_AMOUNT_MISMATCH"
            - "ProtectionFiling.${f_id}.installments_paid_count == 0 and annuity_total_due_cents == 0 in every rejected case"
            - "Variety.${v_id}.protection_posture == LAPSED_PROTECTION once the filing has lapsed"

      - name: reinstate_blocked_by_both_gates_returns_the_compliance_error_first
        claim_type: priority_ordering
        grounds:
          - validations[priority=16]
          - validations[priority=17]
          - calculations.propagator_compliance_score
        distinguishing_aspect: "Reinstatement has two independent gates. With compliance_score 69 (LATE_REPORT 6 plus MATERIAL_AUDIT_FINDING 25) AND material_audit_finding_count 1, both are violated and the priority-16 error ERR_COMPLIANCE_SCORE_TOO_LOW is returned - not the priority-17 ERR_MATERIAL_FINDING_UNRESOLVED. Settling the report BEFORE the audit is what keeps the LATE_REPORT penalty alive, since a disputed report stops contributing."
        test_recipe:
          setup:
            - "One Variety, one Propagator, one ACTIVE TIER_B agreement for US-WA, one ACTIVE quota of 20000 units."
            - "One report with due_at 2026-08-10T00:00:00Z carrying a single line of 100 units, submitted late at clock 2026-08-15T00:00:00Z, accepted by officer-2 (booked 3500 + late fee 70 = 3570), then SETTLED by officer-3."
            - "An AuditEngagement on that report is then finalized MATERIAL with underreported_units 50; because the report is SETTLED it is NOT disputed, so the LATE_REPORT penalty survives alongside the audit penalty."
          setup_api_calls:
            - call: "POST /varieties"
              payload: { denomination: "Inglewood Bramble", species: "Rubus idaeus", breeder_code: "IG", base_royalty_cents_per_plant: 35, base_royalty_cents_per_acre: 1200 }
              as: BreederAdmin
