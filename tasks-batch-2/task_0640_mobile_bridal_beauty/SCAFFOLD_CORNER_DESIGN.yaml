  # =====================================================================================
  # RBAC — role denials and ownership
  # =====================================================================================
  - section: rbac
    instances:
      - name: client_cannot_register_artist
        claim_type: forbidden_role
        grounds: [roles, endpoints]
        distinguishing_aspect: "POST /artists is Coordinator-exclusive; a Client call -> ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /bridal-beauty/artists"
              payload: { display_name: "X", skill_tier: "LEAD", hair_rate_per_face_cents: 10000, makeup_rate_per_face_cents: 12000, travel_rate_per_km_cents: 500, max_faces_per_hour: 3 }
              as: Client
              as_user_id: "client-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FORBIDDEN_ROLE"

      - name: coordinator_cannot_complete_trial
        claim_type: forbidden_role
        grounds: [roles, endpoints]
        distinguishing_aspect: "POST /trials/{id}/complete is Artist-exclusive; a Coordinator call -> ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["a BOOKED trial"]
          setup_api_calls:
            - call: "POST /bridal-beauty/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /bridal-beauty/artists"
              payload: { display_name: "L1", skill_tier: "LEAD", hair_rate_per_face_cents: 20000, makeup_rate_per_face_cents: 25000, travel_rate_per_km_cents: 600, max_faces_per_hour: 2 }
              as: Coordinator
              captures: { l1_id: $.data.id }
            - call: "POST /bridal-beauty/events"
              payload: { client_id: "client-1", event_date_utc: "2026-07-15T08:00:00Z", ready_by_utc: "2026-07-15T12:00:00Z", venue_distance_km: 10, trial_required: true }
              as: Client
              as_user_id: "client-1"
              captures: { e_id: $.data.id }
            - call: "POST /bridal-beauty/trials"
              payload: { event_id: "${e_id}", artist_id: "${l1_id}", start_utc: "2026-06-10T09:00:00Z", end_utc: "2026-06-10T10:00:00Z", trial_fee_cents: 5000 }
