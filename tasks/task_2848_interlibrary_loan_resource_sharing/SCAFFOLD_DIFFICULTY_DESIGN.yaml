            - call: "GET /ill/copyright-usage"
              payload: { issn: "4321-8765", calendar_year: 2026 }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { used_full: $.data.counted_fill_count, left_full: $.data.free_fills_remaining }
          trigger:
            - call: "POST /ill/requests/${req5_id}/cancel"
              payload: {}
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { req5_status: $.data.status }
            - call: "GET /ill/copyright-usage"
              payload: { issn: "4321-8765", calendar_year: 2026 }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { used_returned: $.data.counted_fill_count, left_returned: $.data.free_fills_remaining }
            - call: "POST /ill/requests"
              payload: { patron_id: "${patron_id}", bib_item_id: "${bib_art_id}", rota_id: "${rota_id}", service_type: "COPY", delivery_mode: "ELECTRONIC", needed_by: "2026-08-20T00:00:00Z", max_supply_fee_cents: 5000, pages_requested: 12 }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { req7_id: $.data.id, req7_status: $.data.status }
            - call: "GET /ill/copyright-usage"
              payload: { issn: "4321-8765", calendar_year: 2026 }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { used_refilled: $.data.counted_fill_count, left_refilled: $.data.free_fills_remaining }
          assert:
            - "${used_full} == 5 and ${left_full} == 0 and ${req6_status_0} == COPYRIGHT_HOLD"
            - "${req5_status} == CANCELLED"
            - "GET /ill/requests/${req5_id}/copyright-clearances shows the single clearance with status VOIDED and sequence_in_year still 5 — the row is retained as an audit trace, not deleted"
            - "${used_returned} == 4 and ${left_returned} == 1 — the conserved allowance came back"
            - "${req7_status} == SOURCING and GET /ill/requests/${req7_id}/copyright-clearances returns exactly 1 ACTIVE CONTU_FREE clearance with sequence_in_year == 5 — the freed slot is reissued once and only once"
            - "${used_refilled} == 5 and ${left_refilled} == 0 — the pool is exactly full again, with no drift above or below the limit"
            - "GET /ill/requests/${req6_id} still shows status COPYRIGHT_HOLD — returning a fill does not retroactively release a request that was already held"
            - "GET /ill/requests/${req6_id}/copyright-clearances still returns total_count == 0"
            - "Patron.${patron_id}.open_request_count == 6 — five surviving originals plus the new request, with the cancelled one removed"
