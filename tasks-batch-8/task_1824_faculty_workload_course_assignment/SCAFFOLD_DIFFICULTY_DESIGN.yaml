  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: assignment_requires_active_qualification
        grounds:
          - validations[priority=6]
          - state_machines.Qualification
          - entities.Qualification.fields.status
        distinguishing_aspect: |
          Entity pair Assignment -> Qualification: the assignment create
          transition is gated by the state of a DIFFERENT entity (an ACTIVE
          qualification row for faculty x course); without it the create fails
          while an identical request with one succeeds.
        test_recipe:
          setup:
            - "Term OPEN; CS-301; Anna WITH an ACTIVE qualification for CS-301; Ben WITHOUT any qualification; sections 01 (MON) and 02 (TUE) SCHEDULED"
          setup_api_calls:
            - { call: "POST /workload-terms", payload: { term_code: "2026-FA", title: "Fall 2026", start_date: "2026-08-24", census_date: "2026-09-07", comp_budget_cents: 2000000 }, as: DepartmentChair, captures: { t_id: "$.data.id" } }
            - { call: "POST /workload-terms/${t_id}/transition", payload: { to_state: "OPEN" }, as: DepartmentChair }
            - { call: "POST /courses", payload: { course_code: "CS-301", title: "Algorithms", course_type: "LECTURE", base_credits: 3, default_enrollment_cap: 30, allowed_modalities: ["IN_PERSON", "ONLINE"] }, as: DepartmentChair, captures: { c1_id: "$.data.id" } }
            - { call: "POST /faculty-members", payload: { full_name: "Anna Aho", email: "anna@x.edu", rank: "ASSOCIATE_PROFESSOR", base_salary_cents: 9000000 }, as: DepartmentChair, captures: { f1_id: "$.data.id" } }
            - { call: "POST /faculty-members", payload: { full_name: "Ben Berg", email: "ben@x.edu", rank: "ASSISTANT_PROFESSOR", base_salary_cents: 8000000 }, as: DepartmentChair, captures: { f2_id: "$.data.id" } }
            - { call: "POST /qualifications", payload: { faculty_id: "${f1_id}", course_id: "${c1_id}", expires_on: "2027-01-15" }, as: DepartmentChair }
            - { call: "POST /course-sections", payload: { term_id: "${t_id}", course_id: "${c1_id}", section_number: "01", modality: "IN_PERSON", meeting_day: "MON", start_minute: 540, end_minute: 600 }, as: DepartmentChair, captures: { s1_id: "$.data.id" } }
            - { call: "POST /course-sections/${s1_id}/transition", payload: { to_state: "SCHEDULED" }, as: DepartmentChair }
            - { call: "POST /course-sections", payload: { term_id: "${t_id}", course_id: "${c1_id}", section_number: "02", modality: "IN_PERSON", meeting_day: "TUE", start_minute: 540, end_minute: 600 }, as: DepartmentChair, captures: { s2_id: "$.data.id" } }
            - { call: "POST /course-sections/${s2_id}/transition", payload: { to_state: "SCHEDULED" }, as: DepartmentChair }
          trigger:
            - { call: "POST /assignments", payload: { section_id: "${s1_id}", faculty_id: "${f1_id}" }, as: DepartmentChair, captures: { a1_id: "$.data.id", a1_status: "$.data.status" } }
            - { call: "POST /assignments", payload: { section_id: "${s2_id}", faculty_id: "${f2_id}" }, as: DepartmentChair, captures: { err: "$.data.error_id" } }
          assert:
            - "Assignment.${a1_id}.status == PROPOSED (qualified faculty succeeds)"
            - "Ben's assignment fails with ${err} == ERR_NOT_QUALIFIED_FOR_COURSE"

      - name: section_schedule_depends_on_term_status
        grounds:
          - state_machines.CourseSection.PROPOSED_to_SCHEDULED
          - state_machines.WorkloadTerm.OPEN_to_LOCKED
          - errors[ERR_INVALID_TERM_STATE]
        distinguishing_aspect: |
          Entity pair CourseSection -> WorkloadTerm (different pair from the
          other instance): the PROPOSED -> SCHEDULED transition is allowed
          while the term is DRAFT or OPEN but is rejected once the term is
          LOCKED.
        test_recipe:
          setup:
            - "Term created (DRAFT); CS-301; S1 created AND scheduled while DRAFT; term OPEN; S2 created (stays PROPOSED); term LOCKED"
          setup_api_calls:
            - { call: "POST /workload-terms", payload: { term_code: "2026-FA", title: "Fall 2026", start_date: "2026-08-24", census_date: "2026-09-07", comp_budget_cents: 2000000 }, as: DepartmentChair, captures: { t_id: "$.data.id" } }
            - { call: "POST /courses", payload: { course_code: "CS-301", title: "Algorithms", course_type: "LECTURE", base_credits: 3, default_enrollment_cap: 30, allowed_modalities: ["IN_PERSON", "ONLINE"] }, as: DepartmentChair, captures: { c1_id: "$.data.id" } }
            - { call: "POST /course-sections", payload: { term_id: "${t_id}", course_id: "${c1_id}", section_number: "01", modality: "IN_PERSON", meeting_day: "MON", start_minute: 540, end_minute: 600 }, as: DepartmentChair, captures: { s1_id: "$.data.id" } }
            - { call: "POST /course-sections/${s1_id}/transition", payload: { to_state: "SCHEDULED" }, as: DepartmentChair, captures: { s1_status: "$.data.status" } }
            - { call: "POST /workload-terms/${t_id}/transition", payload: { to_state: "OPEN" }, as: DepartmentChair }
            - { call: "POST /course-sections", payload: { term_id: "${t_id}", course_id: "${c1_id}", section_number: "02", modality: "IN_PERSON", meeting_day: "TUE", start_minute: 540, end_minute: 600 }, as: DepartmentChair, captures: { s2_id: "$.data.id" } }
            - { call: "POST /workload-terms/${t_id}/transition", payload: { to_state: "LOCKED" }, as: DepartmentChair }
          trigger:
            - { call: "POST /course-sections/${s2_id}/transition", payload: { to_state: "SCHEDULED" }, as: DepartmentChair, captures: { err: "$.data.error_id" } }
          assert:
            - "CourseSection.${s1_id} reached SCHEDULED while the term was DRAFT (${s1_status} == SCHEDULED)"
            - "Scheduling ${s2_id} while the term is LOCKED fails with ${err} == ERR_INVALID_TERM_STATE"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: half_open_meeting_overlap_adjacency
        grounds:
          - calculations.faculty_schedule_overlap_check
          - errors[ERR_MEETING_TIME_CONFLICT]
        distinguishing_aspect: |
          Resource = faculty weekly meeting schedule (via CourseSection meeting
          windows), HALF-OPEN [start, end) semantics: back-to-back meetings
          (10:00 == 10:00) are allowed while a genuine overlap (09:30-10:30 vs
          09:00-10:00) is rejected.
        test_recipe:
          setup:
            - "Term OPEN; CS-301; Anna qualified; S1 MON 09:00-10:00 with a PROPOSED assignment for Anna; S2 MON 10:00-11:00 SCHEDULED; S3 MON 09:30-10:30 SCHEDULED"
          setup_api_calls:
            - { call: "POST /workload-terms", payload: { term_code: "2026-FA", title: "Fall 2026", start_date: "2026-08-24", census_date: "2026-09-07", comp_budget_cents: 2000000 }, as: DepartmentChair, captures: { t_id: "$.data.id" } }
            - { call: "POST /workload-terms/${t_id}/transition", payload: { to_state: "OPEN" }, as: DepartmentChair }
            - { call: "POST /courses", payload: { course_code: "CS-301", title: "Algorithms", course_type: "LECTURE", base_credits: 3, default_enrollment_cap: 30, allowed_modalities: ["IN_PERSON", "ONLINE"] }, as: DepartmentChair, captures: { c1_id: "$.data.id" } }
            - { call: "POST /faculty-members", payload: { full_name: "Anna Aho", email: "anna@x.edu", rank: "ASSOCIATE_PROFESSOR", base_salary_cents: 9000000 }, as: DepartmentChair, captures: { f1_id: "$.data.id" } }
            - { call: "POST /qualifications", payload: { faculty_id: "${f1_id}", course_id: "${c1_id}", expires_on: "2027-01-15" }, as: DepartmentChair }
            - { call: "POST /course-sections", payload: { term_id: "${t_id}", course_id: "${c1_id}", section_number: "01", modality: "IN_PERSON", meeting_day: "MON", start_minute: 540, end_minute: 600 }, as: DepartmentChair, captures: { s1_id: "$.data.id" } }
            - { call: "POST /course-sections/${s1_id}/transition", payload: { to_state: "SCHEDULED" }, as: DepartmentChair }
            - { call: "POST /assignments", payload: { section_id: "${s1_id}", faculty_id: "${f1_id}" }, as: DepartmentChair, captures: { a1_id: "$.data.id" } }
            - { call: "POST /course-sections", payload: { term_id: "${t_id}", course_id: "${c1_id}", section_number: "02", modality: "IN_PERSON", meeting_day: "MON", start_minute: 600, end_minute: 660 }, as: DepartmentChair, captures: { s2_id: "$.data.id" } }
            - { call: "POST /course-sections/${s2_id}/transition", payload: { to_state: "SCHEDULED" }, as: DepartmentChair }
            - { call: "POST /course-sections", payload: { term_id: "${t_id}", course_id: "${c1_id}", section_number: "03", modality: "IN_PERSON", meeting_day: "MON", start_minute: 570, end_minute: 630 }, as: DepartmentChair, captures: { s3_id: "$.data.id" } }
            - { call: "POST /course-sections/${s3_id}/transition", payload: { to_state: "SCHEDULED" }, as: DepartmentChair }
          trigger:
            - { call: "POST /assignments", payload: { section_id: "${s2_id}", faculty_id: "${f1_id}" }, as: DepartmentChair, captures: { a2_id: "$.data.id", a2_status: "$.data.status" } }
            - { call: "POST /assignments", payload: { section_id: "${s3_id}", faculty_id: "${f1_id}" }, as: DepartmentChair, captures: { err: "$.data.error_id" } }
          assert:
            - "Assignment.${a2_id}.status == PROPOSED (S2 starts exactly when S1 ends: half-open adjacency allowed)"
            - "S3 request fails with ${err} == ERR_MEETING_TIME_CONFLICT (09:30 < 10:00 and 09:00 < 10:30)"

      - name: closed_interval_release_overlap
        grounds:
          - calculations.release_period_overlap_check
          - errors[ERR_RELEASE_PERIOD_OVERLAP]
        distinguishing_aspect: |
          Resource = faculty release-time calendar (ReleaseTimeGrant entity,
          different resource from meeting schedules), CLOSED [start, end]
          semantics (different interval geometry): a grant starting on the exact
          day the previous one ends CONFLICTS (shared calendar day), while
          starting the next day is allowed.
        test_recipe:
          setup:
            - "Term OPEN; Anna; grant G1 REQUESTED 2026-08-24..2026-10-16"
          setup_api_calls:
            - { call: "POST /workload-terms", payload: { term_code: "2026-FA", title: "Fall 2026", start_date: "2026-08-24", census_date: "2026-09-07", comp_budget_cents: 2000000 }, as: DepartmentChair, captures: { t_id: "$.data.id" } }
            - { call: "POST /workload-terms/${t_id}/transition", payload: { to_state: "OPEN" }, as: DepartmentChair }
            - { call: "POST /faculty-members", payload: { full_name: "Anna Aho", email: "anna@x.edu", rank: "ASSOCIATE_PROFESSOR", base_salary_cents: 9000000 }, as: DepartmentChair, captures: { f1_id: "$.data.id" } }
            - { call: "POST /release-time-grants", payload: { term_id: "${t_id}", faculty_id: "${f1_id}", grant_type: "RESEARCH_BUYOUT", credits_released: 3, start_date: "2026-08-24", end_date: "2026-10-16" }, as: DepartmentChair, captures: { g1_id: "$.data.id" } }
          trigger:
            - { call: "POST /release-time-grants", payload: { term_id: "${t_id}", faculty_id: "${f1_id}", grant_type: "ADMINISTRATIVE", credits_released: 1, start_date: "2026-10-16", end_date: "2026-11-30" }, as: DepartmentChair, captures: { err: "$.data.error_id" } }
            - { call: "POST /release-time-grants", payload: { term_id: "${t_id}", faculty_id: "${f1_id}", grant_type: "ADMINISTRATIVE", credits_released: 1, start_date: "2026-10-17", end_date: "2026-11-30" }, as: DepartmentChair, captures: { g3_id: "$.data.id", g3_status: "$.data.status" } }
          assert:
            - "Grant starting 2026-10-16 fails with ${err} == ERR_RELEASE_PERIOD_OVERLAP (closed intervals share the day 2026-10-16)"
            - "Grant.${g3_id}.status == REQUESTED (starting 2026-10-17, the day after, is disjoint and allowed)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: teaching_credits_confirm_rescind_invariant
        grounds:
          - calculations.load_sheet_recompute
          - state_machines.Assignment.PROPOSED_to_CONFIRMED
          - state_machines.Assignment.CONFIRMED_to_RESCINDED
          - entities.LoadSheet.fields.teaching_credits
        distinguishing_aspect: |
          Conserved quantity = teaching credits: the forward action (propose +
          confirm) paired with its compensation (rescind) returns
          LoadSheet.teaching_credits to exactly 0.0 — the invariant
          teaching_credits == sum(credit_units over PROPOSED/CONFIRMED) holds
          with zero drift.
        test_recipe:
          setup:
            - "Term OPEN; CS-301; Anna qualified; S1 SCHEDULED; clock default (not late -> no stipend side effect)"
          setup_api_calls:
            - { call: "POST /workload-terms", payload: { term_code: "2026-FA", title: "Fall 2026", start_date: "2026-08-24", census_date: "2026-09-07", comp_budget_cents: 2000000 }, as: DepartmentChair, captures: { t_id: "$.data.id" } }
            - { call: "POST /workload-terms/${t_id}/transition", payload: { to_state: "OPEN" }, as: DepartmentChair }
            - { call: "POST /courses", payload: { course_code: "CS-301", title: "Algorithms", course_type: "LECTURE", base_credits: 3, default_enrollment_cap: 30, allowed_modalities: ["IN_PERSON", "ONLINE"] }, as: DepartmentChair, captures: { c1_id: "$.data.id" } }
            - { call: "POST /faculty-members", payload: { full_name: "Anna Aho", email: "anna@x.edu", rank: "ASSOCIATE_PROFESSOR", base_salary_cents: 9000000 }, as: DepartmentChair, captures: { f1_id: "$.data.id" } }
            - { call: "POST /qualifications", payload: { faculty_id: "${f1_id}", course_id: "${c1_id}", expires_on: "2027-01-15" }, as: DepartmentChair }
            - { call: "POST /course-sections", payload: { term_id: "${t_id}", course_id: "${c1_id}", section_number: "01", modality: "IN_PERSON", meeting_day: "MON", start_minute: 540, end_minute: 600 }, as: DepartmentChair, captures: { s1_id: "$.data.id" } }
            - { call: "POST /course-sections/${s1_id}/transition", payload: { to_state: "SCHEDULED" }, as: DepartmentChair }
            - { call: "POST /assignments", payload: { section_id: "${s1_id}", faculty_id: "${f1_id}" }, as: DepartmentChair, captures: { a1_id: "$.data.id" } }
          trigger:
            - { call: "POST /assignments/${a1_id}/transition", payload: { to_state: "CONFIRMED" }, as: FacultyMember, as_user_id: "${f1_id}" }
            - { call: "POST /assignments/${a1_id}/transition", payload: { to_state: "RESCINDED" }, as: DepartmentChair }
            - { call: "GET /load-sheets", payload: { term_id: "${t_id}", faculty_id: "${f1_id}" }, as: DepartmentChair }
          assert:
            - "LoadSheet(term ${t_id}, faculty ${f1_id}).teaching_credits == 0.0 after confirm+rescind (forward + compensation cancel exactly)"
            - "LoadSheet.overload_credits == 0.0 and underload_credits == 12.0 (back to the untouched baseline)"
            - "WorkloadTerm.${t_id}.comp_budget_spent_cents == 0 (not late: no residual drift in the ledger)"

      - name: release_credits_approve_revoke_invariant
        grounds:
          - calculations.load_sheet_recompute
          - state_machines.ReleaseTimeGrant.REQUESTED_to_APPROVED
          - state_machines.ReleaseTimeGrant.APPROVED_to_REVOKED
          - entities.LoadSheet.fields.release_credits
        distinguishing_aspect: |
          Conserved quantity = release credits (different quantity from
          teaching credits): approve (+3.0) paired with revoke (-3.0) returns
          LoadSheet.release_credits to exactly 0.0 — the invariant
          release_credits == sum(credits_released over APPROVED grants) holds
          with zero drift.
        test_recipe:
          setup:
            - "Term OPEN; Anna; grant G1 ADMINISTRATIVE 3.0 credits 2026-08-24..2026-12-11 REQUESTED"
          setup_api_calls:
            - { call: "POST /workload-terms", payload: { term_code: "2026-FA", title: "Fall 2026", start_date: "2026-08-24", census_date: "2026-09-07", comp_budget_cents: 2000000 }, as: DepartmentChair, captures: { t_id: "$.data.id" } }
            - { call: "POST /workload-terms/${t_id}/transition", payload: { to_state: "OPEN" }, as: DepartmentChair }
            - { call: "POST /faculty-members", payload: { full_name: "Anna Aho", email: "anna@x.edu", rank: "ASSOCIATE_PROFESSOR", base_salary_cents: 9000000 }, as: DepartmentChair, captures: { f1_id: "$.data.id" } }
            - { call: "POST /release-time-grants", payload: { term_id: "${t_id}", faculty_id: "${f1_id}", grant_type: "ADMINISTRATIVE", credits_released: 3, start_date: "2026-08-24", end_date: "2026-12-11" }, as: DepartmentChair, captures: { g1_id: "$.data.id" } }
          trigger:
            - { call: "POST /release-time-grants/${g1_id}/transition", payload: { to_state: "APPROVED" }, as: DeanOffice, captures: { g1_buyout: "$.data.buyout_value_cents" } }
            - { call: "GET /load-sheets", payload: { term_id: "${t_id}", faculty_id: "${f1_id}" }, as: DepartmentChair }
            - { call: "POST /release-time-grants/${g1_id}/transition", payload: { to_state: "REVOKED" }, as: DeanOffice }
            - { call: "GET /load-sheets", payload: { term_id: "${t_id}", faculty_id: "${f1_id}" }, as: DepartmentChair }
          assert:
            - "After approve: ReleaseTimeGrant.${g1_id}.buyout_value_cents == 240000 (FLAT_RATE 3 x 80000)"
            - "After approve: LoadSheet(term ${t_id}, faculty ${f1_id}).release_credits == 3.0 and effective_obligation_credits == 9.0"
            - "After revoke: LoadSheet.release_credits == 0.0 and effective_obligation_credits == 12.0 (compensation restores the invariant)"
