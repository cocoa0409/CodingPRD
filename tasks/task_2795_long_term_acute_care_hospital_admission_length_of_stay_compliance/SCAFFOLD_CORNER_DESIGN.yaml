        distinguishing_aspect: "The same re-price endpoint takes two branches on one optional field: with override_drg_rate_id it prices against DRG 573 (base 3,600,000, discharge_payment_pct 100.00) and without it falls back to the referral's DRG 207 (1,512,000, 25.20) - and in both branches the previous DRAFT is auto-voided with void_reason SUPERSEDED, which is why each call needs a freshly read expected_stay_version."
