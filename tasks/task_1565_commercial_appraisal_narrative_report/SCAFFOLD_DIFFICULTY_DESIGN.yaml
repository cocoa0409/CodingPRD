            - "accept at exactly 2026-08-21T00:00:00Z (A's due_date, half-open adjacency): Engagement.${eng_b}.status == IN_PROGRESS"
            - "Engagement.${eng_b}.due_date == 2026-09-05T00:00:00Z"

  # ===================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===================================================================
  - rule_id: compensating_invariant
    instances:
      - name: client_billing_writeoff_roundtrip
        grounds:
          - calculations.volume_discount_tier
          - state_machines.Engagement.IN_PROGRESS_to_COMPLETED
          - errors[ERR_FEE_ALREADY_WRITTEN_OFF]
        distinguishing_aspect: |
          Conserved quantity = Client.total_billed_cents (money). Forward
          action (delivery bills +450000) paired with its compensating action
          (write_off_fee bills -450000) leaves the client's billed total
          exactly at its pre-delivery value 0; a second write-off is rejected.
        test_recipe:
          setup:
            - "Engagement fully delivered (TIERED STANDARD, 1 approach, 30-day turnaround -> final_fee_cents 450000); client total_billed_cents 0 -> 450000"
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Apex Bank", client_type: "LENDER" }
              as: EngagementManager
              captures: { cl_id: $.data.id }
