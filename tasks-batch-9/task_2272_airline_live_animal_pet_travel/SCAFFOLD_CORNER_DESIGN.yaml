          - entities.BreedRestriction.fields.status
          - endpoints.PUT /breed-restrictions/{id}/status
        distinguishing_aspect: "Priority 24 only consults ACTIVE restrictions: the same 27 kg gross animal that a WEIGHT_CAPPED restriction at 20 kg would reject is screened successfully once that restriction is WITHDRAWN, and the species breed_restriction_count falls back to 0."
        test_recipe:
          setup:
            - "SpeciesProfile DOG carrying a WEIGHT_CAPPED BreedRestriction on Labrador with max_weight_kg 20"
            - "A CHECKED reservation whose animal is a 20 kg Labrador in a 7 kg tare container, so gross weight is 27 and exceeds the cap"
            - "The restriction is then moved to status WITHDRAWN"
          setup_api_calls:
            - { call: "POST /species-profiles", payload: { species_code: "DOG", common_name: "Dog", acceptance_class: "ACCEPTED_ALL_ROUTINGS", max_cabin_weight_kg: 12, min_age_weeks: 16 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { sp_dog: $.data.id } }
