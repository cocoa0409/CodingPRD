scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: fuel_cost_volume_vs_tankered
        grounds:
          - calculations.fuel_order_cost
          - state_machines.FuelOrder.REQUESTED_to_DISPATCHED
          - entities.FuelOrder.fields.priced_amount_cents
        distinguishing_aspect: |
          The FuelOrder domain prices the same 6000-gal uplift two ways: the
          volume_discounted variant yields 3115000 cents, the tankered_flat
          variant yields 180000 cents — divergence proven on the FuelOrder entity.
        test_recipe:
          setup:
            - "Operator ACTIVE with jeta_month_cumulative_gallons=0; JET_A aircraft (mtow 30000 -> MID)."
            - "ACTIVE JET_A FuelContract base=520, tankering_fee=30."
            - "Two ON_GROUND visits, each with a REQUESTED JET_A fuel order for 6000 gal; one tankering=false, one tankering=true."
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Aero Ops", contact_email: "ops@aero.test" }
              as: BillingClerk
              captures: { op_id: $.data.id }
            - call: "POST /aircraft"
              payload: { operator_id: "${op_id}", tail_number: "N100AA", fuel_type: "JET_A", mtow_lb: 30000 }
              as: OpsDispatcher
              captures: { ac_id: $.data.id }
            - call: "POST /fuel-contracts"
              payload: { operator_id: "${op_id}", product: "JET_A", base_price_cents_per_gal: 520, tankering_fee_cents_per_gal: 30 }
              as: BillingClerk
              captures: { fc_id: $.data.id }
            - call: "POST /service-visits"
              payload: { operator_id: "${op_id}", aircraft_id: "${ac_id}", arrival_utc: "2026-06-14T08:00:00.000Z", departure_utc: "2026-06-15T08:00:00.000Z" }
              as: OpsDispatcher
              captures: { v1_id: $.data.id }
            - call: "POST /service-visits/${v1_id}/arrive"
              payload: {}
              as: OpsDispatcher
            - call: "POST /service-visits"
              payload: { operator_id: "${op_id}", aircraft_id: "${ac_id}", arrival_utc: "2026-06-16T08:00:00.000Z", departure_utc: "2026-06-17T08:00:00.000Z" }
              as: OpsDispatcher
              captures: { v2_id: $.data.id }
            - call: "POST /service-visits/${v2_id}/arrive"
              payload: {}
              as: OpsDispatcher
            - call: "POST /fuel-orders"
              payload: { service_visit_id: "${v1_id}", aircraft_id: "${ac_id}", fuel_contract_id: "${fc_id}", product: "JET_A", ordered_gallons: 6000, tankering: false }
              as: FuelTech
              captures: { fo_vol_id: $.data.id }
            - call: "POST /fuel-orders"
              payload: { service_visit_id: "${v2_id}", aircraft_id: "${ac_id}", fuel_contract_id: "${fc_id}", product: "JET_A", ordered_gallons: 6000, tankering: true }
              as: FuelTech
              captures: { fo_tank_id: $.data.id }
          trigger:
            - call: "POST /fuel-orders/${fo_vol_id}/dispatch"
              payload: {}
              as: FuelTech
            - call: "POST /fuel-orders/${fo_tank_id}/dispatch"
              payload: {}
              as: FuelTech
          assert:
            - "FuelOrder.${fo_vol_id}.priced_amount_cents == 3115000"
            - "FuelOrder.${fo_tank_id}.priced_amount_cents == 180000"
            - "FuelOrder.${fo_vol_id}.priced_amount_cents != FuelOrder.${fo_tank_id}.priced_amount_cents"

      - name: ramp_fee_standard_vs_waived
        grounds:
          - calculations.parking_ramp_fee
          - state_machines.ParkingAssignment.HELD_to_OCCUPIED
          - entities.ParkingAssignment.fields.fee_cents
        distinguishing_aspect: |
          The ParkingAssignment domain prices a MID 3-night RAMP occupation two
          ways: standard_fee = 45000 cents, ramp_waived = 0 cents when the visit
          has >= 200 delivered JET_A gallons — divergence on a different entity
          (ParkingAssignment) than instance fuel_cost_volume_vs_tankered.
        test_recipe:
          setup:
            - "Operator ACTIVE; JET_A MID aircraft (mtow 30000)."
            - "Visit A SERVICING-eligible with a RAMP spot held; NO fuel delivered -> standard fee."
            - "Visit B SERVICING with >=200 JET_A gallons delivered (a FUELED non-tankering order of 6000 gal) and a RAMP spot held -> waived."
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Aero Ops", contact_email: "ops@aero.test" }
              as: BillingClerk
              captures: { op_id: $.data.id }
            - call: "POST /aircraft"
              payload: { operator_id: "${op_id}", tail_number: "N100AA", fuel_type: "JET_A", mtow_lb: 30000 }
              as: OpsDispatcher
              captures: { ac_id: $.data.id }
            - call: "POST /fuel-contracts"
              payload: { operator_id: "${op_id}", product: "JET_A", base_price_cents_per_gal: 520, tankering_fee_cents_per_gal: 30 }
              as: BillingClerk
              captures: { fc_id: $.data.id }
            - call: "POST /parking-spots"
              payload: { label: "RAMP-A", spot_type: "RAMP", max_weight_class: "HEAVY" }
              as: OpsDispatcher
              captures: { spot_a_id: $.data.id }
            - call: "POST /parking-spots"
              payload: { label: "RAMP-B", spot_type: "RAMP", max_weight_class: "HEAVY" }
              as: OpsDispatcher
              captures: { spot_b_id: $.data.id }
            - call: "POST /service-visits"
              payload: { operator_id: "${op_id}", aircraft_id: "${ac_id}", arrival_utc: "2026-06-14T08:00:00.000Z", departure_utc: "2026-06-17T08:00:00.000Z" }
              as: OpsDispatcher
              captures: { va_id: $.data.id }
            - call: "POST /service-visits/${va_id}/arrive"
              payload: {}
              as: OpsDispatcher
            - call: "POST /parking-assignments"
              payload: { service_visit_id: "${va_id}", spot_id: "${spot_a_id}", occupy_start_utc: "2026-06-14T08:00:00.000Z", occupy_end_utc: "2026-06-17T08:00:00.000Z" }
              as: OpsDispatcher
              captures: { pa_a_id: $.data.id, pa_a_ver: $.data.version }
            - call: "POST /service-visits"
              payload: { operator_id: "${op_id}", aircraft_id: "${ac_id}", arrival_utc: "2026-06-20T08:00:00.000Z", departure_utc: "2026-06-23T08:00:00.000Z" }
              as: OpsDispatcher
              captures: { vb_id: $.data.id }
            - call: "POST /service-visits/${vb_id}/arrive"
              payload: {}
              as: OpsDispatcher
            - call: "POST /fuel-orders"
              payload: { service_visit_id: "${vb_id}", aircraft_id: "${ac_id}", fuel_contract_id: "${fc_id}", product: "JET_A", ordered_gallons: 6000, tankering: false }
              as: FuelTech
              captures: { fo_b_id: $.data.id }
            - call: "POST /fuel-orders/${fo_b_id}/dispatch"
              payload: {}
              as: FuelTech
            - call: "POST /fuel-orders/${fo_b_id}/complete-fueling"
              payload: {}
              as: FuelTech
            - call: "POST /into-plane-tickets"
              payload: { fuel_order_id: "${fo_b_id}", delivered_gallons: 6000 }
              as: FuelTech
            - call: "POST /parking-assignments"
              payload: { service_visit_id: "${vb_id}", spot_id: "${spot_b_id}", occupy_start_utc: "2026-06-20T08:00:00.000Z", occupy_end_utc: "2026-06-23T08:00:00.000Z" }
              as: OpsDispatcher
              captures: { pa_b_id: $.data.id, pa_b_ver: $.data.version }
          trigger:
            - call: "POST /parking-assignments/${pa_a_id}/occupy"
              payload: { expected_assignment_version: "${pa_a_ver}" }
              as: OpsDispatcher
            - call: "POST /parking-assignments/${pa_b_id}/occupy"
              payload: { expected_assignment_version: "${pa_b_ver}" }
              as: OpsDispatcher
          assert:
            - "ParkingAssignment.${pa_a_id}.fee_cents == 45000"
            - "ParkingAssignment.${pa_b_id}.fee_cents == 0"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: fuel_marginal_cross_tier
        grounds:
          - calculations.fuel_order_cost
          - state_machines.FuelOrder.REQUESTED_to_DISPATCHED
          - state_machines.FuelOrder.DISPATCHED_to_FUELED
        distinguishing_aspect: |
          MODE (a): a >=3-input non-linear marginal-tier formula (base, prev
          cumulative, ordered_gallons selecting per-gallon tier). A second 16000-gal
          order at prev=6000 straddles tiers 2 and 3 and yields 8226000 cents,
          not a flat rate times gallons.
        test_recipe:
          setup:
            - "Operator ACTIVE; JET_A MID aircraft; ACTIVE JET_A contract base=520."
            - "First order of 6000 gal FUELED -> operator.jeta_month_cumulative_gallons=6000."
            - "Second REQUESTED order for 16000 gal on a fresh ON_GROUND visit."
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Aero Ops", contact_email: "ops@aero.test" }
              as: BillingClerk
              captures: { op_id: $.data.id }
            - call: "POST /aircraft"
              payload: { operator_id: "${op_id}", tail_number: "N100AA", fuel_type: "JET_A", mtow_lb: 30000 }
              as: OpsDispatcher
              captures: { ac_id: $.data.id }
            - call: "POST /fuel-contracts"
              payload: { operator_id: "${op_id}", product: "JET_A", base_price_cents_per_gal: 520, tankering_fee_cents_per_gal: 30 }
              as: BillingClerk
              captures: { fc_id: $.data.id }
            - call: "POST /service-visits"
              payload: { operator_id: "${op_id}", aircraft_id: "${ac_id}", arrival_utc: "2026-06-14T08:00:00.000Z", departure_utc: "2026-06-15T08:00:00.000Z" }
              as: OpsDispatcher
              captures: { v1_id: $.data.id }
            - call: "POST /service-visits/${v1_id}/arrive"
              payload: {}
              as: OpsDispatcher
            - call: "POST /fuel-orders"
              payload: { service_visit_id: "${v1_id}", aircraft_id: "${ac_id}", fuel_contract_id: "${fc_id}", product: "JET_A", ordered_gallons: 6000, tankering: false }
              as: FuelTech
              captures: { fo1_id: $.data.id }
            - call: "POST /fuel-orders/${fo1_id}/dispatch"
              payload: {}
              as: FuelTech
            - call: "POST /fuel-orders/${fo1_id}/complete-fueling"
              payload: {}
              as: FuelTech
            - call: "POST /service-visits"
              payload: { operator_id: "${op_id}", aircraft_id: "${ac_id}", arrival_utc: "2026-06-16T08:00:00.000Z", departure_utc: "2026-06-17T08:00:00.000Z" }
              as: OpsDispatcher
              captures: { v2_id: $.data.id }
            - call: "POST /service-visits/${v2_id}/arrive"
              payload: {}
              as: OpsDispatcher
            - call: "POST /fuel-orders"
              payload: { service_visit_id: "${v2_id}", aircraft_id: "${ac_id}", fuel_contract_id: "${fc_id}", product: "JET_A", ordered_gallons: 16000, tankering: false }
              as: FuelTech
              captures: { fo2_id: $.data.id }
          trigger:
            - call: "POST /fuel-orders/${fo2_id}/dispatch"
              payload: {}
              as: FuelTech
          assert:
            - "FuelOrder.${fo2_id}.priced_amount_cents == 8226000"

      - name: deice_pinned_rounding_order
        grounds:
          - calculations.deice_service_charge
          - state_machines.RampService.IN_PROGRESS_to_COMPLETED
          - entities.RampService.fields.charge_cents
        distinguishing_aspect: |
          MODE (b): pinned rounding order — round the fluid base term
          (gallons * 1800 * dilution) to whole cents BEFORE adding the integer
          holdover surcharge. 40 gal TYPE_IV with 25 min holdover yields 104800
          cents (100800 base + 4000 surcharge), a different axis than the
          marginal-tier mode (a).
        test_recipe:
          setup:
            - "Operator ACTIVE; aircraft; visit in SERVICING (arrived, occupied, start-servicing)."
            - "A DE_ICE RampService (40 gal TYPE_IV, 25 min holdover) moved to IN_PROGRESS."
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Aero Ops", contact_email: "ops@aero.test" }
              as: BillingClerk
              captures: { op_id: $.data.id }
            - call: "POST /aircraft"
              payload: { operator_id: "${op_id}", tail_number: "N100AA", fuel_type: "JET_A", mtow_lb: 30000 }
              as: OpsDispatcher
              captures: { ac_id: $.data.id }
            - call: "POST /parking-spots"
              payload: { label: "TD-1", spot_type: "TIE_DOWN", max_weight_class: "HEAVY" }
              as: OpsDispatcher
              captures: { spot_id: $.data.id }
            - call: "POST /service-visits"
              payload: { operator_id: "${op_id}", aircraft_id: "${ac_id}", arrival_utc: "2026-06-14T08:00:00.000Z", departure_utc: "2026-06-15T08:00:00.000Z" }
              as: OpsDispatcher
              captures: { v_id: $.data.id }
            - call: "POST /service-visits/${v_id}/arrive"
              payload: {}
              as: OpsDispatcher
            - call: "POST /parking-assignments"
              payload: { service_visit_id: "${v_id}", spot_id: "${spot_id}", occupy_start_utc: "2026-06-14T08:00:00.000Z", occupy_end_utc: "2026-06-15T08:00:00.000Z" }
              as: OpsDispatcher
              captures: { pa_id: $.data.id, pa_ver: $.data.version }
            - call: "POST /parking-assignments/${pa_id}/occupy"
              payload: { expected_assignment_version: "${pa_ver}" }
              as: OpsDispatcher
            - call: "POST /service-visits/${v_id}/start-servicing"
              payload: {}
              as: OpsDispatcher
            - call: "POST /ramp-services"
              payload: { service_visit_id: "${v_id}", service_type: "DE_ICE", deice_fluid_gallons: 40, deice_fluid_type: "TYPE_IV", deice_holdover_minutes: 25 }
              as: OpsDispatcher
              captures: { rs_id: $.data.id }
            - call: "POST /ramp-services/${rs_id}/start"
              payload: {}
              as: LineManager
          trigger:
            - call: "POST /ramp-services/${rs_id}/complete"
              payload: {}
              as: LineManager
          assert:
            - "RampService.${rs_id}.charge_cents == 104800"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: fuel_order_parallel_axes_independent
        grounds:
          - state_machines.FuelOrder.DISPATCHED_to_FUELED
          - state_machines.FuelOrder.NOT_STARTED_to_RECONCILED
          - entities.FuelOrder.fields.logistics_status
          - entities.FuelOrder.fields.reconciliation_status
        distinguishing_aspect: |
          On one FuelOrder row the logistics axis reaches FUELED while the
          reconciliation axis advances from NOT_STARTED to RECONCILED
          independently — two state dimensions evolve on the same entity.
        test_recipe:
          setup:
            - "A FUELED JET_A fuel order (6000 gal) whose reconciliation_status is still NOT_STARTED."
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Aero Ops", contact_email: "ops@aero.test" }
              as: BillingClerk
              captures: { op_id: $.data.id }
            - call: "POST /aircraft"
              payload: { operator_id: "${op_id}", tail_number: "N100AA", fuel_type: "JET_A", mtow_lb: 30000 }
              as: OpsDispatcher
              captures: { ac_id: $.data.id }
            - call: "POST /fuel-contracts"
              payload: { operator_id: "${op_id}", product: "JET_A", base_price_cents_per_gal: 520, tankering_fee_cents_per_gal: 30 }
              as: BillingClerk
              captures: { fc_id: $.data.id }
            - call: "POST /service-visits"
              payload: { operator_id: "${op_id}", aircraft_id: "${ac_id}", arrival_utc: "2026-06-14T08:00:00.000Z", departure_utc: "2026-06-15T08:00:00.000Z" }
              as: OpsDispatcher
              captures: { v_id: $.data.id }
            - call: "POST /service-visits/${v_id}/arrive"
              payload: {}
              as: OpsDispatcher
            - call: "POST /fuel-orders"
              payload: { service_visit_id: "${v_id}", aircraft_id: "${ac_id}", fuel_contract_id: "${fc_id}", product: "JET_A", ordered_gallons: 6000, tankering: false }
              as: FuelTech
              captures: { fo_id: $.data.id }
            - call: "POST /fuel-orders/${fo_id}/dispatch"
              payload: {}
              as: FuelTech
            - call: "POST /fuel-orders/${fo_id}/complete-fueling"
              payload: {}
              as: FuelTech
          trigger:
            - call: "POST /into-plane-tickets"
              payload: { fuel_order_id: "${fo_id}", delivered_gallons: 6060 }
              as: FuelTech
          assert:
            - "FuelOrder.${fo_id}.logistics_status == FUELED"
            - "FuelOrder.${fo_id}.reconciliation_status == RECONCILED"

      - name: ramp_slot_revoke_re_request_cycle
        grounds:
          - state_machines.RampSlot.APPROVED_to_REVOKED
          - state_machines.RampSlot.REVOKED_to_REQUESTED
          - entities.RampSlot.fields.status
        distinguishing_aspect: |
          A RampSlot (different entity than FuelOrder) traverses the cycle
          REQUESTED->APPROVED->REVOKED->REQUESTED, returning to a non-terminal
          state already visited — a true cyclic shape, not a forward pipeline.
        test_recipe:
          setup:
            - "An APPROVED RampSlot on a RAMP pad for a SCHEDULED visit."
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Aero Ops", contact_email: "ops@aero.test" }
              as: BillingClerk
              captures: { op_id: $.data.id }
            - call: "POST /aircraft"
              payload: { operator_id: "${op_id}", tail_number: "N100AA", fuel_type: "JET_A", mtow_lb: 30000 }
              as: OpsDispatcher
              captures: { ac_id: $.data.id }
            - call: "POST /parking-spots"
              payload: { label: "PAD-1", spot_type: "RAMP", max_weight_class: "HEAVY" }
              as: OpsDispatcher
              captures: { pad_id: $.data.id }
            - call: "POST /service-visits"
              payload: { operator_id: "${op_id}", aircraft_id: "${ac_id}", arrival_utc: "2026-06-14T08:00:00.000Z", departure_utc: "2026-06-15T08:00:00.000Z" }
              as: OpsDispatcher
              captures: { v_id: $.data.id }
            - call: "POST /ramp-slots"
              payload: { service_visit_id: "${v_id}", pad_id: "${pad_id}", window_start_utc: "2026-06-14T10:00:00.000Z", window_end_utc: "2026-06-14T11:00:00.000Z" }
              as: OpsDispatcher
              captures: { slot_id: $.data.id }
            - call: "POST /ramp-slots/${slot_id}/approve"
              payload: {}
              as: OpsDispatcher
            - call: "POST /ramp-slots/${slot_id}/revoke"
              payload: {}
              as: OpsDispatcher
          trigger:
            - call: "POST /ramp-slots/${slot_id}/re-request"
              payload: {}
              as: Operator
              as_user_id: "${op_id}"
          assert:
            - "RampSlot.${slot_id}.status == REQUESTED"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: visit_cancel_cascade_depth3
        grounds:
          - state_machines.ServiceVisit.ON_GROUND_to_CANCELLED
          - state_machines.ParkingAssignment.OCCUPIED_to_RELEASED
          - entities.ParkingAssignment.fields.status
        distinguishing_aspect: |
          Depth-3 cascade from the visit-cancel trigger: cancelling an ON_GROUND
          visit RELEASES its OCCUPIED ParkingAssignment, and that release in turn
          frees the ParkingSpot occupation window so a later overlapping occupy on
          the same spot succeeds — each hop caused by the prior hop.
        test_recipe:
          setup:
            - "An ON_GROUND visit with one OCCUPIED ParkingAssignment on a TIE_DOWN spot for window [10:00,11:00)."
            - "A second visit with a HELD assignment on the same spot for an overlapping window [10:30,10:45)."
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Aero Ops", contact_email: "ops@aero.test" }
              as: BillingClerk
              captures: { op_id: $.data.id }
            - call: "POST /aircraft"
              payload: { operator_id: "${op_id}", tail_number: "N100AA", fuel_type: "JET_A", mtow_lb: 30000 }
              as: OpsDispatcher
              captures: { ac_id: $.data.id }
            - call: "POST /parking-spots"
              payload: { label: "TD-7", spot_type: "TIE_DOWN", max_weight_class: "HEAVY" }
              as: OpsDispatcher
              captures: { spot_id: $.data.id }
            - call: "POST /service-visits"
              payload: { operator_id: "${op_id}", aircraft_id: "${ac_id}", arrival_utc: "2026-06-14T08:00:00.000Z", departure_utc: "2026-06-15T08:00:00.000Z" }
              as: OpsDispatcher
              captures: { v1_id: $.data.id }
            - call: "POST /service-visits/${v1_id}/arrive"
              payload: {}
              as: OpsDispatcher
            - call: "POST /parking-assignments"
              payload: { service_visit_id: "${v1_id}", spot_id: "${spot_id}", occupy_start_utc: "2026-06-14T10:00:00.000Z", occupy_end_utc: "2026-06-14T11:00:00.000Z" }
              as: OpsDispatcher
              captures: { pa1_id: $.data.id, pa1_ver: $.data.version }
            - call: "POST /parking-assignments/${pa1_id}/occupy"
              payload: { expected_assignment_version: "${pa1_ver}" }
              as: OpsDispatcher
            - call: "POST /service-visits"
              payload: { operator_id: "${op_id}", aircraft_id: "${ac_id}", arrival_utc: "2026-06-14T09:00:00.000Z", departure_utc: "2026-06-15T09:00:00.000Z" }
              as: OpsDispatcher
              captures: { v2_id: $.data.id }
            - call: "POST /service-visits/${v2_id}/arrive"
              payload: {}
              as: OpsDispatcher
            - call: "POST /parking-assignments"
              payload: { service_visit_id: "${v2_id}", spot_id: "${spot_id}", occupy_start_utc: "2026-06-14T10:30:00.000Z", occupy_end_utc: "2026-06-14T10:45:00.000Z" }
              as: OpsDispatcher
              captures: { pa2_id: $.data.id, pa2_ver: $.data.version }
          trigger:
            - call: "POST /service-visits/${v1_id}/cancel"
              payload: {}
              as: OpsDispatcher
            - call: "POST /parking-assignments/${pa2_id}/occupy"
              payload: { expected_assignment_version: "${pa2_ver}" }
              as: OpsDispatcher
          assert:
            - "ServiceVisit.${v1_id}.status == CANCELLED"
            - "ParkingAssignment.${pa1_id}.status == RELEASED"
            - "ParkingAssignment.${pa2_id}.status == OCCUPIED"

      - name: adjust_billing_cascade_depth3
        grounds:
          - state_machines.FuelOrder.IN_REVIEW_to_ADJUSTED
          - entities.Invoice.fields.total_cents
          - entities.Operator.fields.open_invoice_balance_cents
        distinguishing_aspect: |
          Depth-3 cascade from the adjust-billing trigger (a different trigger
          than visit-cancel): adjusting a flagged order re-prices priced_amount_cents,
          that re-price recomputes the visit's Invoice.total_cents, and that recompute
          recomputes operator.open_invoice_balance_cents — each hop caused by the prior.
        test_recipe:
          setup:
