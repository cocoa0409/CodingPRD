# =============================================================================
# §1.9 Scaffold Corner Design — task_1700 ship chandlery
# Breadth coverage: every testable claim of SCAFFOLD.yaml §1.1–§1.7 that §1.8
# does not already exercise. Same structured-recipe contract as §1.8.
# Sections follow references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: vessel_call_creation_defaults
        claim_type: creation_defaults
        grounds: [entities.VesselCall.fields.status, entities.VesselCall.fields.customs_clearance_status, entities.VesselCall.fields.actual_eta]
        distinguishing_aspect: "A created VesselCall starts in SCHEDULED x PENDING with actual_eta null; version == 1; server ignores client-supplied status."
        test_recipe:
          setup: ["Agent exists"]
          setup_api_calls:
            - call: "POST /chandlery/ship-agents"
              payload: { name: "Agent AA", settlement_currency: USD, credit_limit_cents: 1000000, payment_terms_days: 30 }
              as: FinanceController
              captures: { agentA: $.data.id }
          trigger:
            - call: "POST /chandlery/vessel-calls"
              payload: { vessel_name: "MV Aurora II", imo_number: "9074760", agent_id: "${agentA}", port_code: "SGSIN", scheduled_eta: "2026-08-10T08:00:00Z", scheduled_etd: "2026-08-14T12:00:00Z", foreign_going: true }
              as: ChandlerOpsManager
              captures: { vcA2: $.data.id, vcA2_status: $.data.status, vcA2_ccs: $.data.customs_clearance_status, vcA2_v: $.data.version }
          assert:
            - "VesselCall.${vcA2}.status == SCHEDULED"
            - "VesselCall.${vcA2}.customs_clearance_status == PENDING"
            - "VesselCall.${vcA2}.actual_eta is null AND version == 1"

      - name: ship_agent_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.ShipAgent.fields.settlement_currency, "validations[priority=4]"]
        distinguishing_aspect: "Omitting required settlement_currency is rejected with ERR_INVALID_REQUEST (400); no agent is persisted."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /chandlery/ship-agents"
              payload: { name: "Agent NoCurrency", credit_limit_cents: 1000, payment_terms_days: 30 }
              as: FinanceController
              captures: { errA: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: catalog_item_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.CatalogItem.fields.category, "validations[priority=4]"]
        distinguishing_aspect: "category outside {PROVISIONS, BONDED, DECK, ENGINE, CABIN} fails with ERR_INVALID_REQUEST before any persistence."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /chandlery/catalog-items"
              payload: { sku: "BAD-01", name: "Mystery", category: "FRESH", bonded_eligible: false, requires_cold_chain: false, base_price_cents: 100 }
              as: ChandlerOpsManager
              captures: { errB: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: vessel_call_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_VESSEL_CALL_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET on a random UUID yields ERR_VESSEL_CALL_NOT_FOUND with http 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /chandlery/vessel-calls/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: ChandlerOpsManager
              captures: { errC: $.data.error_id }
          assert:
            - "error_id == ERR_VESSEL_CALL_NOT_FOUND"

      - name: stock_lot_computed_on_hand_at_creation
        claim_type: computed_fields
        grounds: [entities.StockLot.fields.on_hand_qty, entities.StockLot.fields.reserved_qty]
        distinguishing_aspect: "on_hand_qty initializes to received_qty and reserved_qty to 0; a client-sent on_hand_qty is ignored."
        test_recipe:
          setup: ["Catalog item exists"]
          setup_api_calls:
            - call: "POST /chandlery/catalog-items"
              payload: { sku: "WATER-C1", name: "Water 1L", category: PROVISIONS, bonded_eligible: false, requires_cold_chain: false, base_price_cents: 120, duty_rate_pct: 0 }
              as: ChandlerOpsManager
              captures: { waterC1: $.data.id }
          trigger:
            - call: "POST /chandlery/stock-lots"
              payload: { catalog_item_id: "${waterC1}", lot_code: "DS-C1", storage_tier: DRY_STORE, received_qty: 250, capacity_qty: 0 }
              as: WarehouseSupervisor
              captures: { lotC1: $.data.id, lotC1_oh: $.data.on_hand_qty, lotC1_res: $.data.reserved_qty }
          assert:
            - "StockLot.${lotC1}.on_hand_qty == 250 AND reserved_qty == 0"

      - name: payment_immutable_no_version_field
        claim_type: immutability
        grounds: [entities.Payment]
        distinguishing_aspect: "Payment is common_fields: false — the response carries id and created_at but no version/updated_at, and no update endpoint exists in §1.5."
        test_recipe:
          setup:
            - "Full WATER order flow delivered and invoiced (total 120,000); a payment of 120,000 USD closes it"
          setup_api_calls:
            - call: "POST /chandlery/ship-agents"
              payload: { name: "Agent AB", settlement_currency: USD, credit_limit_cents: 5000000, payment_terms_days: 30 }
              as: FinanceController
              captures: { agentB: $.data.id }
            - call: "POST /chandlery/catalog-items"
              payload: { sku: "WATER-C2", name: "Water 1L", category: PROVISIONS, bonded_eligible: false, requires_cold_chain: false, base_price_cents: 120, duty_rate_pct: 0 }
              as: ChandlerOpsManager
              captures: { waterC2: $.data.id }
            - call: "POST /chandlery/stock-lots"
              payload: { catalog_item_id: "${waterC2}", lot_code: "DS-C2", storage_tier: DRY_STORE, received_qty: 10000, capacity_qty: 0 }
              as: WarehouseSupervisor
            - call: "POST /chandlery/vessel-calls"
              payload: { vessel_name: "MV Castor", imo_number: "9074761", agent_id: "${agentB}", port_code: "SGSIN", scheduled_eta: "2026-08-10T08:00:00Z", scheduled_etd: "2026-08-14T12:00:00Z", foreign_going: false }
              as: ChandlerOpsManager
              captures: { vcB2: $.data.id }
            - call: "POST /chandlery/vessel-calls/${vcB2}/requisitions"
              payload: { title: "Water", lines: [{ catalog_item_id: "${waterC2}", requested_qty: 1000, allows_substitution: false }] }
              as: VesselCateringOfficer
              as_user_id: "${vcB2}"
              captures: { reqB2: $.data.id }
            - call: "POST /chandlery/requisitions/${reqB2}/submit"
              payload: {}
              as: VesselCateringOfficer
              as_user_id: "${vcB2}"
            - call: "POST /chandlery/requisitions/${reqB2}/quotations"
              payload: { lines: [{ catalog_item_id: "${waterC2}", qty: 1000, unit_price_cents: 120, is_substitution: false }], valid_until: "2026-08-12T00:00:00Z" }
              as: ChandlerSalesRep
              captures: { quoB2: $.data.id }
            - call: "POST /chandlery/quotations/${quoB2}/send"
              payload: {}
              as: ChandlerSalesRep
            - call: "POST /chandlery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: ChandlerOpsManager
            - call: "POST /chandlery/vessel-calls/${vcB2}/arrive"
              payload: {}
              as: ChandlerOpsManager
            - call: "POST /chandlery/quotations/${quoB2}/accept"
              payload: {}
              as: VesselCateringOfficer
              as_user_id: "${vcB2}"
              captures: { ordB2: $.data.id }
            - call: "POST /chandlery/orders/${ordB2}/deliveries"
              payload: { window_start: "2026-08-10T10:00:00Z", window_end: "2026-08-10T14:00:00Z", lines: [{ catalog_item_id: "${waterC2}", qty: 1000 }] }
              as: WarehouseSupervisor
              captures: { delB2: $.data.id }
            - call: "POST /chandlery/deliveries/${delB2}/dispatch"
              payload: {}
              as: WarehouseSupervisor
            - call: "POST /chandlery/deliveries/${delB2}/confirm"
              payload: { receiver_name: "Cook", signature_ref: "sig-c2", confirmed_lines: [{ catalog_item_id: "${waterC2}", qty: 1000 }] }
              as: VesselCateringOfficer
              as_user_id: "${vcB2}"
            - call: "POST /chandlery/orders/${ordB2}/invoices"
              payload: { fx_rate_to_settlement: 1.0 }
              as: FinanceController
              captures: { invB2: $.data.id }
          trigger:
            - call: "POST /chandlery/invoices/${invB2}/payments"
              payload: { amount_cents: 120000, currency: USD }
              as: ShipAgentClerk
              as_user_id: "${agentB}"
              captures: { payB2: $.data.id, payB2_conv: $.data.converted_amount_cents }
          assert:
            - "Payment.${payB2}.converted_amount_cents == 120000 (same currency: identity conversion)"
            - "Payment response contains id and created_at but no version field (append-only)"

      - name: requisition_requires_existing_vessel_call_parent
        claim_type: parent_relationships
        grounds: [entities.Requisition.fields.vessel_call_id, "errors[ERR_VESSEL_CALL_NOT_FOUND]"]
        distinguishing_aspect: "Creating a requisition under a non-existent vessel call id yields ERR_VESSEL_CALL_NOT_FOUND (existence, priority 3) before any body validation."
        test_recipe:
          setup: ["Catalog item exists"]
          setup_api_calls:
            - call: "POST /chandlery/catalog-items"
              payload: { sku: "WATER-C3", name: "Water 1L", category: PROVISIONS, bonded_eligible: false, requires_cold_chain: false, base_price_cents: 120, duty_rate_pct: 0 }
              as: ChandlerOpsManager
              captures: { waterC3: $.data.id }
          trigger:
            - call: "POST /chandlery/vessel-calls/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/requisitions"
              payload: { title: "orphan", lines: [{ catalog_item_id: "${waterC3}", requested_qty: 1, allows_substitution: false }] }
              as: VesselCateringOfficer
              as_user_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              captures: { errD: $.data.error_id }
          assert:
            - "error_id == ERR_VESSEL_CALL_NOT_FOUND"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: confirm_scheduled_delivery_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Delivery, "errors[ERR_DELIVERY_NOT_CONFIRMABLE]"]
        distinguishing_aspect: "confirm from SCHEDULED (dispatch skipped) fails with ERR_DELIVERY_NOT_CONFIRMABLE; the delivery stays SCHEDULED."
        test_recipe:
          setup: ["WATER order accepted; delivery created but never dispatched"]
          setup_api_calls:
            - call: "POST /chandlery/ship-agents"
              payload: { name: "Agent AC", settlement_currency: USD, credit_limit_cents: 5000000, payment_terms_days: 30 }
              as: FinanceController
              captures: { agentC: $.data.id }
            - call: "POST /chandlery/catalog-items"
              payload: { sku: "WATER-C4", name: "Water 1L", category: PROVISIONS, bonded_eligible: false, requires_cold_chain: false, base_price_cents: 120, duty_rate_pct: 0 }
              as: ChandlerOpsManager
              captures: { waterC4: $.data.id }
            - call: "POST /chandlery/stock-lots"
              payload: { catalog_item_id: "${waterC4}", lot_code: "DS-C4", storage_tier: DRY_STORE, received_qty: 10000, capacity_qty: 0 }
              as: WarehouseSupervisor
            - call: "POST /chandlery/vessel-calls"
              payload: { vessel_name: "MV Circe", imo_number: "9074762", agent_id: "${agentC}", port_code: "SGSIN", scheduled_eta: "2026-08-10T08:00:00Z", scheduled_etd: "2026-08-14T12:00:00Z", foreign_going: false }
              as: ChandlerOpsManager
              captures: { vcC2: $.data.id }
            - call: "POST /chandlery/vessel-calls/${vcC2}/requisitions"
              payload: { title: "Water", lines: [{ catalog_item_id: "${waterC4}", requested_qty: 100, allows_substitution: false }] }
              as: VesselCateringOfficer
              as_user_id: "${vcC2}"
              captures: { reqC2: $.data.id }
            - call: "POST /chandlery/requisitions/${reqC2}/submit"
              payload: {}
              as: VesselCateringOfficer
              as_user_id: "${vcC2}"
            - call: "POST /chandlery/requisitions/${reqC2}/quotations"
              payload: { lines: [{ catalog_item_id: "${waterC4}", qty: 100, unit_price_cents: 120, is_substitution: false }], valid_until: "2026-08-12T00:00:00Z" }
              as: ChandlerSalesRep
              captures: { quoC2: $.data.id }
            - call: "POST /chandlery/quotations/${quoC2}/send"
              payload: {}
              as: ChandlerSalesRep
            - call: "POST /chandlery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: ChandlerOpsManager
            - call: "POST /chandlery/vessel-calls/${vcC2}/arrive"
              payload: {}
              as: ChandlerOpsManager
            - call: "POST /chandlery/quotations/${quoC2}/accept"
              payload: {}
              as: VesselCateringOfficer
              as_user_id: "${vcC2}"
              captures: { ordC2: $.data.id }
            - call: "POST /chandlery/orders/${ordC2}/deliveries"
              payload: { window_start: "2026-08-10T10:00:00Z", window_end: "2026-08-10T14:00:00Z", lines: [{ catalog_item_id: "${waterC4}", qty: 100 }] }
              as: WarehouseSupervisor
              captures: { delC2: $.data.id }
          trigger:
            - call: "POST /chandlery/deliveries/${delC2}/confirm"
              payload: { receiver_name: "Cook", signature_ref: "sig-c4", confirmed_lines: [{ catalog_item_id: "${waterC4}", qty: 100 }] }
              as: VesselCateringOfficer
              as_user_id: "${vcC2}"
              captures: { errE: $.data.error_id }
          assert:
            - "error_id == ERR_DELIVERY_NOT_CONFIRMABLE"
            - "Delivery.${delC2} remains SCHEDULED (no side effects)"

      - name: accept_draft_quotation_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Quotation, "errors[ERR_QUOTATION_NOT_ACCEPTABLE]"]
        distinguishing_aspect: "accept from DRAFT (never sent) fails with ERR_QUOTATION_NOT_ACCEPTABLE even when the vessel is IN_PORT and credit is ample."
        test_recipe:
          setup: ["WATER quotation created but never sent; vessel IN_PORT"]
          setup_api_calls:
            - call: "POST /chandlery/ship-agents"
              payload: { name: "Agent AD", settlement_currency: USD, credit_limit_cents: 5000000, payment_terms_days: 30 }
              as: FinanceController
              captures: { agentD: $.data.id }
            - call: "POST /chandlery/catalog-items"
              payload: { sku: "WATER-C5", name: "Water 1L", category: PROVISIONS, bonded_eligible: false, requires_cold_chain: false, base_price_cents: 120, duty_rate_pct: 0 }
              as: ChandlerOpsManager
              captures: { waterC5: $.data.id }
            - call: "POST /chandlery/stock-lots"
              payload: { catalog_item_id: "${waterC5}", lot_code: "DS-C5", storage_tier: DRY_STORE, received_qty: 10000, capacity_qty: 0 }
              as: WarehouseSupervisor
            - call: "POST /chandlery/vessel-calls"
              payload: { vessel_name: "MV Daphne", imo_number: "9074763", agent_id: "${agentD}", port_code: "SGSIN", scheduled_eta: "2026-08-10T08:00:00Z", scheduled_etd: "2026-08-14T12:00:00Z", foreign_going: false }
              as: ChandlerOpsManager
              captures: { vcD2: $.data.id }
            - call: "POST /chandlery/vessel-calls/${vcD2}/requisitions"
              payload: { title: "Water", lines: [{ catalog_item_id: "${waterC5}", requested_qty: 100, allows_substitution: false }] }
              as: VesselCateringOfficer
              as_user_id: "${vcD2}"
              captures: { reqD2: $.data.id }
            - call: "POST /chandlery/requisitions/${reqD2}/submit"
              payload: {}
              as: VesselCateringOfficer
              as_user_id: "${vcD2}"
            - call: "POST /chandlery/requisitions/${reqD2}/quotations"
              payload: { lines: [{ catalog_item_id: "${waterC5}", qty: 100, unit_price_cents: 120, is_substitution: false }], valid_until: "2026-08-12T00:00:00Z" }
              as: ChandlerSalesRep
              captures: { quoD2: $.data.id }
            - call: "POST /chandlery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: ChandlerOpsManager
            - call: "POST /chandlery/vessel-calls/${vcD2}/arrive"
              payload: {}
              as: ChandlerOpsManager
          trigger:
            - call: "POST /chandlery/quotations/${quoD2}/accept"
              payload: {}
              as: VesselCateringOfficer
              as_user_id: "${vcD2}"
              captures: { errF: $.data.error_id }
          assert:
            - "error_id == ERR_QUOTATION_NOT_ACCEPTABLE (DRAFT is not acceptable; send must come first)"

      - name: double_accept_idempotency_terminal_lockdown
        claim_type: idempotency_and_terminal_lockdown
        grounds: [state_machines.Quotation.SENT_to_ACCEPTED, "errors[ERR_QUOTATION_NOT_ACCEPTABLE]"]
        distinguishing_aspect: "A second accept on an already ACCEPTED (terminal) quotation fails with ERR_QUOTATION_NOT_ACCEPTABLE and creates no second Order."
        test_recipe:
          setup: ["WATER quotation accepted once"]
          setup_api_calls:
            - call: "POST /chandlery/ship-agents"
              payload: { name: "Agent AE", settlement_currency: USD, credit_limit_cents: 5000000, payment_terms_days: 30 }
              as: FinanceController
              captures: { agentE: $.data.id }
            - call: "POST /chandlery/catalog-items"
              payload: { sku: "WATER-C6", name: "Water 1L", category: PROVISIONS, bonded_eligible: false, requires_cold_chain: false, base_price_cents: 120, duty_rate_pct: 0 }
              as: ChandlerOpsManager
              captures: { waterC6: $.data.id }
            - call: "POST /chandlery/stock-lots"
              payload: { catalog_item_id: "${waterC6}", lot_code: "DS-C6", storage_tier: DRY_STORE, received_qty: 10000, capacity_qty: 0 }
              as: WarehouseSupervisor
            - call: "POST /chandlery/vessel-calls"
              payload: { vessel_name: "MV Echo", imo_number: "9074764", agent_id: "${agentE}", port_code: "SGSIN", scheduled_eta: "2026-08-10T08:00:00Z", scheduled_etd: "2026-08-14T12:00:00Z", foreign_going: false }
              as: ChandlerOpsManager
              captures: { vcE2: $.data.id }
            - call: "POST /chandlery/vessel-calls/${vcE2}/requisitions"
              payload: { title: "Water", lines: [{ catalog_item_id: "${waterC6}", requested_qty: 100, allows_substitution: false }] }
              as: VesselCateringOfficer
              as_user_id: "${vcE2}"
              captures: { reqE2: $.data.id }
            - call: "POST /chandlery/requisitions/${reqE2}/submit"
              payload: {}
              as: VesselCateringOfficer
              as_user_id: "${vcE2}"
            - call: "POST /chandlery/requisitions/${reqE2}/quotations"
              payload: { lines: [{ catalog_item_id: "${waterC6}", qty: 100, unit_price_cents: 120, is_substitution: false }], valid_until: "2026-08-12T00:00:00Z" }
              as: ChandlerSalesRep
              captures: { quoE2: $.data.id }
            - call: "POST /chandlery/quotations/${quoE2}/send"
              payload: {}
              as: ChandlerSalesRep
            - call: "POST /chandlery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: ChandlerOpsManager
            - call: "POST /chandlery/vessel-calls/${vcE2}/arrive"
              payload: {}
              as: ChandlerOpsManager
            - call: "POST /chandlery/quotations/${quoE2}/accept"
              payload: {}
              as: VesselCateringOfficer
              as_user_id: "${vcE2}"
              captures: { ordE2: $.data.id }
          trigger:
            - call: "POST /chandlery/quotations/${quoE2}/accept"
              payload: {}
              as: VesselCateringOfficer
              as_user_id: "${vcE2}"
              captures: { errG: $.data.error_id }
            - call: "GET /chandlery/quotations/${quoE2}/orders"
              payload: {}
              as: ChandlerOpsManager
          assert:
            - "second accept: error_id == ERR_QUOTATION_NOT_ACCEPTABLE"
            - "GET /quotations/${quoE2}/orders returns exactly 1 order (no duplicate created)"

      - name: requisition_initial_state_and_recall_cycle
        claim_type: initial_state_and_valid_transition
        grounds: [state_machines.Requisition.SUBMITTED_to_DRAFT, entities.Requisition.fields.status]
        distinguishing_aspect: "New requisition starts DRAFT; recall SUBMITTED -> DRAFT is legal (cycle) when no SENT quotation exists; recall a second time from DRAFT fails ERR_REQUISITION_NOT_RECALLABLE."
        test_recipe:
          setup: ["Vessel call + requisition with one line; submitted once"]
          setup_api_calls:
            - call: "POST /chandlery/ship-agents"
              payload: { name: "Agent AF", settlement_currency: USD, credit_limit_cents: 1000000, payment_terms_days: 30 }
              as: FinanceController
              captures: { agentF: $.data.id }
            - call: "POST /chandlery/catalog-items"
              payload: { sku: "WATER-C7", name: "Water 1L", category: PROVISIONS, bonded_eligible: false, requires_cold_chain: false, base_price_cents: 120, duty_rate_pct: 0 }
              as: ChandlerOpsManager
              captures: { waterC7: $.data.id }
            - call: "POST /chandlery/vessel-calls"
              payload: { vessel_name: "MV Flora", imo_number: "9074765", agent_id: "${agentF}", port_code: "SGSIN", scheduled_eta: "2026-08-10T08:00:00Z", scheduled_etd: "2026-08-14T12:00:00Z", foreign_going: false }
              as: ChandlerOpsManager
              captures: { vcF2: $.data.id }
            - call: "POST /chandlery/vessel-calls/${vcF2}/requisitions"
              payload: { title: "Water", lines: [{ catalog_item_id: "${waterC7}", requested_qty: 5, allows_substitution: false }] }
              as: VesselCateringOfficer
              as_user_id: "${vcF2}"
              captures: { reqF2: $.data.id, reqF2_st: $.data.status }
            - call: "POST /chandlery/requisitions/${reqF2}/submit"
              payload: {}
              as: VesselCateringOfficer
              as_user_id: "${vcF2}"
          trigger:
            - call: "POST /chandlery/requisitions/${reqF2}/recall"
              payload: {}
              as: VesselCateringOfficer
              as_user_id: "${vcF2}"
              captures: { reqF2_st2: $.data.status }
            - call: "POST /chandlery/requisitions/${reqF2}/recall"
              payload: {}
              as: VesselCateringOfficer
              as_user_id: "${vcF2}"
              captures: { errH: $.data.error_id }
          assert:
            - "created status == DRAFT"
            - "recall from SUBMITTED -> DRAFT succeeds (cycle)"
            - "second recall fails: error_id == ERR_REQUISITION_NOT_RECALLABLE"

      - name: vessel_depart_cascade_fails_deliveries_and_cancels_orders
        claim_type: cascade_side_effects
        grounds: [state_machines.VesselCall.IN_PORT_to_DEPARTED, state_machines.Delivery, state_machines.Order.OPEN_to_CANCELLED]
