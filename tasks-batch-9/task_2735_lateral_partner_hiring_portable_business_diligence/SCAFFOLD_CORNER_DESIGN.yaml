      - name: offer_create_links_only_to_an_assessment_of_its_own_candidate
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /lateral-hiring/candidates/{candidate_id}/offers]
          - validations[priority=14]
          - errors[ERR_ASSESSMENT_CANDIDATE_MISMATCH]
          - entities.CompensationOffer.fields.portability_assessment_id
          - entities.PortabilityAssessment.fields.questionnaire_id
        distinguishing_aspect: |
          The link is TWO hops long: the offer points at a PortabilityAssessment, which
          points at a LateralQuestionnaire, which points at the Candidate in the path — so a
          naive one-hop existence check passes and only the transitive walk catches the
          cross-wiring. Both candidates are deliberately in the SAME practice group on the
          SAME engagement and both are CLEARED with a CURRENT assessment, so every earlier
          validation rung (existence, OCC, pipeline state, clearance) is satisfied and the
