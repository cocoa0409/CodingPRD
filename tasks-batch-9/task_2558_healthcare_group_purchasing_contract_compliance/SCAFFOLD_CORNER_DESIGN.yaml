              as: ContractManager
              captures: { a1: $.data.id }
            - call: "POST /gpo/price-activations/${a1}/activate"
              payload: {}
              as: ContractManager
            - call: "POST /gpo/distributor-files"
              payload: { member_id: "${m1}", contract_id: "${c1}", distributor_code: "D-A", period_start: "2026-08-01", period_end: "2026-09-01", lines: [ { member_item_number: "MI-1", quantity_units: 1, unit_price_paid_cents: 9500, purchase_date: "2026-08-05" } ] }
              as: DistributorAgent
