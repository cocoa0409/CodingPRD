            - "Member.${m_cora_id}.wallet_hold_cents == 0"
            - "Member.${m_cora_id}.wallet_credit_cents == 2500"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (>= 2 instances, two DIFFERENT
  #          error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: pair_state_versus_business_safety_on_return
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - validations[priority=16]
          - state_machines.Reservation.IN_USE_to_RETURNED
          - state_machines.Vehicle.IN_USE_to_AVAILABLE
        distinguishing_aspect: "State versus business_safety pair: in one request the return violates the from-state precondition, comes from a member whose screening is not CLEAR, and carries a mismatched returned pod, so the state check (ERR_INVALID_STATE, 409) must win over both business_safety checks (ERR_SCREENING_NOT_CLEAR and ERR_WRONG_RETURN_POD)."
        test_recipe:
          setup:
            - "One approved member with an ACTIVE membership, one AVAILABLE campus-pod vehicle"
            - "One CONFIRMED reservation for that member on that vehicle"
            - "The member's latest driving-record report re-decided to REFERRED"
          setup_api_calls:
            - call: "POST /car-share/member-registrations"
              payload: { full_name: "Priya Priority", email: "priya.priority@x.com", kind: "INDIVIDUAL" }
              as: Anonymous
              captures: { m_priya_id: $.data.id }
            - call: "POST /car-share/driving-record-reports/{id}/decision"
              payload: { report_decision: "CLEAR" }
              as: PodOperator
            - call: "POST /car-share/members/{id}/application-decision"
              payload: { decision: "APPROVE" }
              as: PodOperator
            - call: "POST /car-share/pods"
              payload: { name: "Campus Prio", site_type: "CAMPUS", capacity: 4, fuel_floor_pct: 20 }
              as: FleetAdmin
              captures: { pod_pri_id: $.data.id }
            - call: "POST /car-share/pods"
              payload: { name: "Campus Prio Two", site_type: "CAMPUS", capacity: 4, fuel_floor_pct: 20 }
              as: FleetAdmin
              captures: { pod_pri2_id: $.data.id }
            - call: "POST /car-share/vehicles"
              payload: { pod_id: "${pod_pri_id}", vin: "VIN3158J1", model: "Spark", capacity_seats: 4, next_service_miles: 15000 }
              as: FleetAdmin
              captures: { veh_j1_id: $.data.id, veh_j1_ver: $.data.version }
            - call: "POST /car-share/reservations"
              payload: { member_id: "${m_priya_id}", pod_id: "${pod_pri_id}", vehicle_id: "${veh_j1_id}", start_at: "2026-09-05T09:00:00Z", end_at: "2026-09-05T13:00:00Z", reserved_hours: 4, expected_vehicle_version: "${veh_j1_ver}" }
              as: Member
              as_user_id: "${m_priya_id}"
              captures: { res_j1_id: $.data.id }
            - call: "POST /car-share/members/{id}/driving-record-reports"
              payload: { license_state: "CA", license_years_held: 9 }
              as: Member
              as_user_id: "${m_priya_id}"
              captures: { drr_j1_id: $.data.id }
            - call: "POST /car-share/driving-record-reports/{id}/decision"
              payload: { report_decision: "REFERRED" }
              as: PodOperator
          trigger:
            - call: "POST /car-share/reservations/{id}/return"
              payload: { returned_pod_id: "${pod_pri2_id}", returned_odometer_miles: 41000, returned_fuel_level_pct: 50, contamination_level: 0 }
              as: Member
              as_user_id: "${m_priya_id}"
              captures: { err_j1: $.data.error_id }
          assert:
            - "${err_j1} == \"ERR_INVALID_STATE\""
            - "${err_j1} != \"ERR_SCREENING_NOT_CLEAR\""
            - "${err_j1} != \"ERR_WRONG_RETURN_POD\""
            - "Reservation.${res_j1_id}.status == CONFIRMED"

      - name: pair_existence_versus_business_fiscal_on_waive
        grounds:
          - validations[priority=3]
          - validations[priority=27]
          - state_machines.Incident.ASSESSED_to_FEE_CHARGED
          - entities.Member.fields.wallet_credit_cents
        distinguishing_aspect: "Existence versus business_fiscal pair: a party-split aimed at an unknown incident while the acting member's wallet is also short must return ERR_INCIDENT_NOT_FOUND (404) rather than ERR_INSUFFICIENT_WALLET_CREDIT (422), because existence is resolved left-to-right in the path before fiscal checks."
        test_recipe:
          setup:
            - "One approved individual member with an ACTIVE membership, one AVAILABLE vehicle in a campus pod"
            - "One CONFIRMED reservation and one OPEN DAMAGE incident with repair_cost_cents 12000"
            - "Logical clock at 2026-09-05T10:00:00Z"
          setup_api_calls:
            - call: "POST /car-share/member-registrations"
              payload: { full_name: "Ravi Referential", email: "ravi.referential@x.com", kind: "INDIVIDUAL" }
              as: Anonymous
              captures: { m_ravi_id: $.data.id }
            - call: "POST /car-share/driving-record-reports/{id}/decision"
              payload: { report_decision: "CLEAR" }
              as: PodOperator
            - call: "POST /car-share/members/{id}/application-decision"
              payload: { decision: "APPROVE" }
              as: PodOperator
            - call: "GET /car-share/members/{m_ravi_id}/memberships"
              as: PodOperator
              captures: { ms_ravi_id: "$.data[0].id" }
            - call: "POST /car-share/pods"
              payload: { name: "Campus Referential", site_type: "CAMPUS", capacity: 4, fuel_floor_pct: 20 }
              as: FleetAdmin
              captures: { pod_ref_id: $.data.id }
            - call: "POST /car-share/vehicles"
              payload: { pod_id: "${pod_ref_id}", vin: "VIN3158K1", model: "Versa", capacity_seats: 5, next_service_miles: 18000 }
              as: FleetAdmin
              captures: { veh_k1_id: $.data.id, veh_k1_ver: $.data.version }
            - call: "POST /car-share/reservations"
              payload: { member_id: "${m_ravi_id}", pod_id: "${pod_ref_id}", vehicle_id: "${veh_k1_id}", start_at: "2026-09-05T09:00:00Z", end_at: "2026-09-05T13:00:00Z", reserved_hours: 4, expected_vehicle_version: "${veh_k1_ver}" }
              as: Member
              as_user_id: "${m_ravi_id}"
              captures: { res_k1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /car-share/incidents"
              payload: { reservation_id: "${res_k1_id}", vehicle_id: "${veh_k1_id}", member_id: "${m_ravi_id}", incident_type: "DAMAGE", repair_cost_cents: 12000 }
              as: PodOperator
              captures: { inc_k1_id: $.data.id, inc_k1_ver: $.data.version }
          trigger:
            - call: "POST /car-share/incidents/{id}/party-split"
              payload: { expected_incident_version: "${inc_k1_ver}" }
              as: PodOperator
              captures: { tok_a1: $.data.id }
            - call: "POST /car-share/incidents/e3158c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/waive-fee"
              payload: { reason: "GOODWILL" }
              as: PodOperator
              captures: { err_k1: $.data.error_id }
          assert:
            - "${err_k1} == \"ERR_INCIDENT_NOT_FOUND\""
            - "${err_k1} != \"ERR_INSUFFICIENT_WALLET_CREDIT\""
            - "Incident.${inc_k1_id}.status == FEE_CHARGED"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (>= 2 instances, different metrics and
  #          distinct endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: late_penalty_grace_block_boundary
        grounds:
          - calculations.late_return_penalty
          - entities.Reservation.fields.late_minutes
          - validations[priority=6]
        distinguishing_aspect: "Numeric threshold crossing on the lateness metric reached through the reopen-overdue endpoint: at exactly 10 late minutes the block count is 0 so no late block is billed and the charge stays 3680, while eleven late minutes bills one 1725-cent block and lifts the charge to 5520."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T12:00:00Z"
            - "One approved member with an ACTIVE membership and one AVAILABLE campus-pod vehicle"
            - "One CONFIRMED reservation with end_at 2026-09-05T13:00:00Z"
          setup_api_calls:
            - call: "POST /car-share/member-registrations"
              payload: { full_name: "Bella Boundary", email: "bella.boundary@x.com", kind: "INDIVIDUAL" }
              as: Anonymous
              captures: { m_bella_id: $.data.id }
            - call: "POST /car-share/driving-record-reports/{id}/decision"
              payload: { report_decision: "CLEAR" }
              as: PodOperator
            - call: "POST /car-share/members/{id}/application-decision"
              payload: { decision: "APPROVE" }
              as: PodOperator
            - call: "POST /car-share/pods"
              payload: { name: "Campus Boundary", site_type: "CAMPUS", capacity: 4, fuel_floor_pct: 20 }
              as: FleetAdmin
              captures: { pod_bnd_id: $.data.id }
            - call: "POST /car-share/vehicles"
              payload: { pod_id: "${pod_bnd_id}", vin: "VIN3158L1", model: "Prius C", capacity_seats: 5, next_service_miles: 22000 }
              as: FleetAdmin
              captures: { veh_l1_id: $.data.id, veh_l1_ver: $.data.version }
            - call: "POST /car-share/reservations"
              payload: { member_id: "${m_bella_id}", pod_id: "${pod_bnd_id}", vehicle_id: "${veh_l1_id}", start_at: "2026-09-05T09:00:00Z", end_at: "2026-09-05T13:00:00Z", reserved_hours: 4, expected_vehicle_version: "${veh_l1_ver}" }
              as: Member
              as_user_id: "${m_bella_id}"
              captures: { res_l1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T13:10:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /car-share/reservations/{id}/reopen-overdue"
              payload: {}
              as: PodOperator
          assert:
            - "Reservation.${res_l1_id}.late_minutes == 10"
            - "Reservation.${res_l1_id}.status == OVERDUE"
            - "Reservation.${res_l1_id}.status_before_overdue == CONFIRMED"
            - "Reservation.${res_l1_id}.charge_total_cents == 3680"

      - name: pod_capacity_zero_bay_boundary
        grounds:
          - calculations.pod_utilization
          - entities.Pod.fields.available_bays
          - entities.Pod.fields.capacity
          - validations[priority=26]
        distinguishing_aspect: "Empty-collection and zero-count boundary on a different metric reached through the shift-bundles endpoint: a bundle of zero vehicles must still take the first matching surcharge band and yield bundle_fee_cents 19600, while an ordinary placement into a pod with capacity 1 and one occupying vehicle is refused with ERR_POD_CAPACITY_EXCEEDED because available_bays is 0."
        test_recipe:
          setup:
            - "One isolated pod with capacity 1 holding one AVAILABLE vehicle, so its declared available_bays is exactly 0"
            - "A separate empty destination pod used by the bundle"
          setup_api_calls:
            - call: "POST /car-share/pods"
              payload: { name: "Tight Lot", site_type: "NEIGHBORHOOD", capacity: 1, fuel_floor_pct: 25 }
              as: FleetAdmin
              captures: { pod_tight_id: $.data.id, pod_tight_ver: $.data.version }
            - call: "POST /car-share/pods"
              payload: { name: "Empty Lot", site_type: "NEIGHBORHOOD", capacity: 3, fuel_floor_pct: 25 }
              as: FleetAdmin
              captures: { pod_empty_id: $.data.id }
