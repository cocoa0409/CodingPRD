  # =========================================================================
  # Rule 3 - non-linear state-machine shapes on different entities:
  # a revision cycle on DealRegistration, parallel dimensions on MdfClaim
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: deal_registration_revision_cycle_caps_at_two_rounds
        grounds:
          - state_machines.DealRegistration.UNDER_REVIEW_to_CHANGES_REQUESTED
          - state_machines.DealRegistration.CHANGES_REQUESTED_to_SUBMITTED
          - state_machines.DealRegistration.SUBMITTED_to_UNDER_REVIEW
          - entities.DealRegistration.fields.revision_round
          - entities.DealRegistration.fields.submitted_at
          - validations[priority=10]
        distinguishing_aspect: |
          Non-linearity on DealRegistration is a CYCLE: SUBMITTED -> UNDER_REVIEW ->
          CHANGES_REQUESTED -> SUBMITTED can be traversed exactly MAX_REVISION_ROUNDS = 2 times,
          every traversal rewrites submitted_at (2026-03-01 -> 2026-03-02 -> 2026-03-03) so the
          conflict chronological key moves later, and the third resubmission is refused with
          ERR_INVALID_STATE_TRANSITION rather than silently looping forever.
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00.000Z."
            - "One RESELLER partner with a single TECH_ASSOCIATE certification (2 credits = CERT_CREDIT_MIN_TO_REGISTER) and marketing_commitment_cents = 0."
            - "One OPEN_CHANNEL account and one DRAFT registration for ANALYTICS_ADDON."
            - "One full revision loop already completed: submit at 2026-03-01, START_REVIEW, REQUEST_CHANGES, resubmit at 2026-03-02 (revision_round 1), START_REVIEW, REQUEST_CHANGES."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
            - call: "POST /partners"
