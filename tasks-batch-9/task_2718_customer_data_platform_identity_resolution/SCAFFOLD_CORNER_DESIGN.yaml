              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DataPlatformAdmin
              as_user_id: "u_admin"
          trigger:
            - call: "GET /cdp/ingest-batches/00000000-0000-4000-8000-000000000006"
              payload: {}
              as: DataEngineer
              as_user_id: "u_eng"
          assert:
            - "the response status is 404"
            - "the response body error_id == ERR_INGEST_BATCH_NOT_FOUND"

