scenario: |
  Certified Collision Repair Network Standards & Parts Requirements (American Honda): shop certification requirements covering equipment, training, tooling and structural repair capability, annual audit and recertification with corrective action for lapsed requirements, repair procedure adherence including required scanning, calibration of driver assistance sensors and parts replacement rules, original equipment parts usage expectations with documentation when alternatives are used, technician training curriculum and certification tracking by role, consumer-facing shop locator listing and referral flow from dealers and insurers, warranty on certified repairs and defect escalation, insurer relationships where certification status affects steering

domain_name: certified-collision-repair-network
api_prefix: /network

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
    - optimistic_concurrency
    - version_pinning_on_approval
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Shop
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Registered legal name of the collision repair shop"
      - name: state_code
        type: string
        source: input
        description: "Two-letter US state code where the shop operates"
        constraints: "2 uppercase letters"
      - name: zip_code
        type: string
        source: input
        description: "5-digit ZIP used by locator radius queries"
      - name: latitude
        type: number
        source: input
        description: "Geocoded latitude for locator distance computation"
      - name: longitude
        type: number
        source: input
        description: "Geocoded longitude for locator distance computation"
      - name: certification_status
        type: enum
        source: system
        description: "Derived network posture gating all shop child operations"
        default: APPLICANT
        constraints: "one of {APPLICANT, CERTIFIED, PROBATION, SUSPENDED, EXPIRED, DECERTIFIED}"
      - name: locator_hidden
        type: boolean
        source: computed
        description: "True when shop MUST be excluded from the consumer locator (any status other than CERTIFIED, or an active audit in VERIFICATION with a CRITICAL finding)"
        default: false
      - name: structural_capability
        type: boolean
        source: input
        description: "Shop declares structural (frame/unibody) repair capability; gates structural repair orders"
        default: false
      - name: lifetime_repair_count
        type: integer
        source: computed
        description: "Count of RepairOrder rows ever created for this shop; incremented on each create"
        default: 0
      - name: pending_referral_count
        type: integer
        source: computed
        description: "Count of Referral rows in ROUTED state pointing at this shop"
        default: 0
      - name: warranty_reserve_cents
        type: integer
        source: computed
        description: "Aggregated warranty reserve accrual (see warranty_reserve_accrual); decremented by reversal"
        default: 0
      - name: live_compliance_score
        type: number
        source: computed
        description: "Live variant of shop_compliance_score over current non-lapsed attestations"
        default: 0.0

  - name: Requirement
    parent: null
    common_fields: true
    fields:
      - name: requirement_code
        type: string
        source: input
        description: "Stable business code, e.g. EQ-WELD-01; unique together with requirement_version"
      - name: category
        type: enum
        source: input
        description: "Certification requirement category"
        constraints: "one of {EQUIPMENT, TRAINING, TOOLING, STRUCTURAL}"
      - name: requirement_version
        type: integer
        source: system
        description: "Revision number of this requirement row; starts at 1, incremented by publish-revision which creates a NEW row"
        default: 1
      - name: supersedes_requirement_id
        type: string
        source: system
        description: "FK -> Requirement.id; set on the new revision row, null on the first revision"
        constraints: "nullable"
      - name: description
        type: string
        source: input
        description: "Human-readable requirement text"
      - name: severity_if_failed
        type: enum
        source: input
        description: "Finding severity when an audit finds this requirement unsatisfied"
        constraints: "one of {MINOR, MAJOR, CRITICAL}"
      - name: status
        type: enum
        source: system
        description: "Lifecycle of the requirement row"
        default: DRAFT
        constraints: "one of {DRAFT, PUBLISHED, SUPERSEDED, RETIRED}"
      - name: effective_from
        type: datetime
        source: input
        description: "ISO8601 instant from which the published revision applies to audits"

  - name: CertificationCycle
    parent: Shop
    common_fields: true
    fields:
      - name: shop_id
        type: string
        source: input
        description: "FK -> Shop.id; the shop under certification"
      - name: cycle_index
        type: integer
        source: computed
        description: "1-based ordinal of this cycle for the shop, assigned in created_at order"
      - name: window_start
        type: datetime
        source: input
        description: "Inclusive start of the certification window (closed interval)"
      - name: window_end
        type: datetime
        source: input
        description: "Inclusive end of the certification window; MUST equal window_start + 365 days - 1 second; next cycle's window_start MUST equal this cycle's window_end + 1 second (zero-gap adjacency)"
      - name: status
        type: enum
        source: system
        description: "Cycle lifecycle"
        default: OPEN
        constraints: "one of {OPEN, AUDIT_SCHEDULED, UNDER_AUDIT, CORRECTIVE_ACTION, CLOSED_PASS, CLOSED_FAIL}"
      - name: audit_snapshot_score
        type: number
        source: computed
        description: "Audit-snapshot variant of shop_compliance_score frozen when the cycle's audit is closed; null until then"
        constraints: "nullable"

  - name: ShopAttestation
    parent: Shop
    common_fields: true
    fields:
      - name: shop_id
        type: string
        source: input
        description: "FK -> Shop.id; attesting shop"
      - name: requirement_id
        type: string
        source: input
        description: "FK -> Requirement.id; the exact published revision attested against (version-pinned)"
      - name: evidence_uri
        type: string
        source: input
        description: "URI of uploaded evidence (photo, invoice, certificate)"
      - name: attested_at
        type: datetime
        source: system
        description: "Server timestamp of attestation submission"
      - name: status
        type: enum
        source: system
        description: "Attestation lifecycle"
        default: ACTIVE
        constraints: "one of {ACTIVE, LAPSED, UNDER_CORRECTION, SUPERSEDED}"
      - name: lapse_reason
        type: string
        source: system
        description: "Why the attestation lapsed (requirement revised, training currency lost, audit finding)"
        constraints: "nullable"

  - name: Audit
    parent: CertificationCycle
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: "FK -> CertificationCycle.id; cycle under audit"
      - name: auditor_user_id
        type: string
        source: system
        description: "X-User-ID of the NetworkAuditor who scheduled the audit (opaque id, audit-trail only)"
      - name: scheduled_start
        type: datetime
        source: input
        description: "Inclusive start of the on-site window [scheduled_start, scheduled_end) — half-open"
      - name: scheduled_end
        type: datetime
        source: input
        description: "Exclusive end of the on-site window; overlaps with another non-cancelled audit of the SAME shop are rejected"
      - name: round_number
        type: integer
        source: computed
        description: "Re-audit round; 1 on creation, incremented whenever verification rejects a corrective action and findings are re-issued"
        default: 1
      - name: status
        type: enum
        source: system
        description: "Audit lifecycle"
        default: SCHEDULED
        constraints: "one of {SCHEDULED, IN_PROGRESS, FINDINGS_ISSUED, VERIFICATION, PASSED, FAILED, CANCELLED}"
      - name: severity_points
        type: integer
        source: computed
        description: "Sum of finding severity weights (MINOR=1, MAJOR=5, CRITICAL=25) over non-withdrawn findings"
        default: 0
      - name: grade
        type: enum
        source: computed
        description: "certification_grade_from_findings result; null until close"
        constraints: "one of {A, B, C, F}; nullable"

  - name: CorrectiveAction
    parent: Audit
    common_fields: true
    fields:
      - name: audit_id
        type: string
        source: input
        description: "FK -> Audit.id; audit whose finding opened this corrective action"
      - name: attestation_id
        type: string
        source: input
        description: "FK -> ShopAttestation.id; the attestation found deficient (cross-aggregate reference)"
      - name: finding_severity
        type: enum
        source: input
        description: "Severity of the underlying finding"
        constraints: "one of {MINOR, MAJOR, CRITICAL}"
      - name: due_at
        type: datetime
        source: computed
        description: "Server-set deadline: finding issued_at + CORRECTIVE_ACTION_DAYS (30) for MAJOR, + CRITICAL_ACTION_DAYS (10) for CRITICAL, + MINOR_ACTION_DAYS (60) for MINOR"
      - name: status
        type: enum
        source: system
        description: "Corrective action lifecycle"
        default: OPEN
        constraints: "one of {OPEN, SUBMITTED, VERIFIED, REJECTED}"
      - name: issued_by_user_id
        type: string
        source: system
        description: "X-User-ID of the issuing NetworkAuditor; the verifying auditor MUST be a different user (segregation of duties)"
      - name: verified_by_user_id
        type: string
        source: system
        description: "X-User-ID of the verifying NetworkAuditor; null until verification"
        constraints: "nullable"

  - name: Technician
    parent: Shop
    common_fields: true
    fields:
      - name: shop_id
        type: string
        source: input
        description: "FK -> Shop.id; employing shop"
      - name: full_name
        type: string
        source: input
        description: "Technician legal name"
      - name: tech_role
        type: enum
        source: input
        description: "Primary role driving the required curriculum"
        constraints: "one of {STRUCTURAL, NON_STRUCTURAL, ESTIMATOR, REFINISH, ADAS_SPECIALIST}"
      - name: status
        type: enum
        source: system
        description: "Employment/certification posture"
        default: PROVISIONAL
        constraints: "one of {PROVISIONAL, CURRENT, LAPSED, INACTIVE}"
      - name: curriculum_progress_pct
        type: number
        source: computed
        description: "Percentage of required courses for tech_role with a non-expired CourseCompletion (see technician_currency)"
        default: 0.0

  - name: TrainingCourse
    parent: null
    common_fields: true
    fields:
      - name: course_code
        type: string
        source: input
        description: "Stable course code, e.g. TR-ADAS-201"
      - name: title
        type: string
        source: input
        description: "Course title"
      - name: required_for_roles
        type: array
        source: input
        description: "Array of tech_role enum values for which this course is part of the required curriculum"
      - name: validity_months
        type: integer
        source: input
        description: "Months a completion remains current; completions expire validity_months after completed_at"
        constraints: ">= 1"
      - name: credit_hours
        type: integer
        source: input
        description: "Credit hours awarded on completion"
        constraints: ">= 0"
      - name: active
        type: boolean
        source: input
        description: "Whether new completions may be recorded against this course"
        default: true

  - name: CourseCompletion
    parent: Technician
    common_fields: true
    fields:
      - name: technician_id
        type: string
        source: input
        description: "FK -> Technician.id; completing technician"
      - name: course_id
        type: string
        source: input
        description: "FK -> TrainingCourse.id; completed course"
      - name: completed_at
        type: datetime
        source: input
        description: "When the course was completed; expiry = completed_at + course.validity_months (calendar months)"
      - name: proof_uri
        type: string
        source: input
        description: "Certificate of completion URI"
      - name: status
        type: enum
        source: system
        description: "Derived currency posture; EXPIRED is stamped by the clock-advance sweep, never set at creation"
        default: CURRENT
        constraints: "one of {CURRENT, EXPIRED}"

  - name: RepairOrder
    parent: Shop
    common_fields: true
    fields:
      - name: shop_id
        type: string
        source: input
        description: "FK -> Shop.id; repairing shop"
      - name: referral_id
        type: string
        source: input
        description: "FK -> Referral.id; referral that routed the consumer; nullable for walk-ins"
        constraints: "nullable"
      - name: vin
        type: string
        source: input
        description: "Vehicle identification number (17 chars)"
      - name: vehicle_model_year
        type: integer
        source: input
        description: "Model year; ADAS-equipped if >= ADAS_MODEL_YEAR_THRESHOLD (2018) unless overridden"
      - name: adas_equipped
        type: boolean
        source: input
        description: "Explicit override; when omitted the server derives it from vehicle_model_year"
        constraints: "nullable"
      - name: is_structural
        type: boolean
        source: input
        description: "Whether the repair involves structural (frame/unibody) work; requires shop.structural_capability"
        default: false
      - name: insurer_relation_id
        type: string
        source: input
        description: "FK -> InsurerRelation.id; DRP relationship under which the repair is billed; nullable"
        constraints: "nullable"
      - name: assigned_technician_id
        type: string
        source: input
        description: "FK -> Technician.id; lead technician; for structural repairs must be a CURRENT STRUCTURAL technician of the same shop"
      - name: status
        type: enum
        source: system
        description: "Repair lifecycle"
        default: ESTIMATE
        constraints: "one of {ESTIMATE, APPROVED, IN_REPAIR, QC, REWORK, CALIBRATION, COMPLETE, WARRANTY_ACTIVE, CLOSED, VOIDED}"
      - name: estimate_total_cents
        type: integer
        source: input
        description: "Customer-facing estimate in cents"
        constraints: ">= 0"
      - name: oe_parts_ratio_by_cost
        type: number
        source: computed
        description: "oe_parts_ratio cost variant, recomputed on every PartLineItem mutation"
        default: 0.0
      - name: oe_parts_ratio_by_count
        type: number
        source: computed
        description: "oe_parts_ratio count variant, recomputed on every PartLineItem mutation"
        default: 0.0
      - name: rework_count
        type: integer
        source: computed
        description: "Number of QC->REWORK loops taken on this order"
        default: 0
      - name: completed_at
        type: datetime
        source: system
        description: "Server timestamp when status first reached COMPLETE; null until then"
        constraints: "nullable"

  - name: ProcedureStep
    parent: RepairOrder
    common_fields: true
    fields:
      - name: repair_order_id
        type: string
        source: input
        description: "FK -> RepairOrder.id; owning repair order"
      - name: step_type
        type: enum
        source: input
        description: "Procedure step kind"
        constraints: "one of {PRE_SCAN, STRUCTURAL_MEASURE, WELD_BOND, POST_SCAN, ADAS_CALIBRATION_STATIC, ADAS_CALIBRATION_DYNAMIC}"
      - name: performed_by_technician_id
        type: string
        source: input
        description: "FK -> Technician.id; technician who performed the step"
      - name: performed_at
        type: datetime
        source: input
        description: "Timestamp of step execution; chronology rules are evaluated against this field"
      - name: result
        type: enum
        source: input
        description: "Step outcome"
        constraints: "one of {PASS, FAIL, NOT_APPLICABLE}"
      - name: scan_report_uri
        type: string
        source: input
        description: "Diagnostic scan report URI; required when step_type is PRE_SCAN or POST_SCAN and result != NOT_APPLICABLE"
        constraints: "nullable"
      - name: sequence_index
        type: integer
        source: computed
        description: "Server-assigned chronological index within the repair order, ordered by performed_at ASC then created_at ASC"
      - name: status
        type: enum
        source: system
        description: "Record lifecycle; VOIDED when superseded by a re-performed step of the same type"
        default: RECORDED
        constraints: "one of {RECORDED, VOIDED}"

  - name: PartLineItem
    parent: RepairOrder
    common_fields: true
    fields:
      - name: repair_order_id
        type: string
        source: input
        description: "FK -> RepairOrder.id; owning repair order"
      - name: part_number
        type: string
        source: input
        description: "Catalog part number"
      - name: part_class
        type: enum
        source: input
        description: "Part origin classification; OE and OE_SURPLUS count as OE for ratio purposes"
        constraints: "one of {OE, OE_SURPLUS, AFTERMARKET, RECYCLED, REMANUFACTURED}"
      - name: unit_cost_cents
        type: integer
        source: input
        description: "Per-unit cost in cents"
        constraints: ">= 0"
      - name: quantity
        type: integer
        source: input
        description: "Units used"
        constraints: ">= 1"
      - name: is_safety_critical
        type: boolean
        source: input
        description: "Safety-critical parts (airbags, seatbelts, structural) may only be OE or OE_SURPLUS"
        default: false
      - name: alternative_justification
        type: string
        source: input
        description: "Mandatory documentation when part_class is not OE/OE_SURPLUS: reason + consumer consent reference"
        constraints: "nullable"
      - name: line_status
        type: enum
        source: system
        description: "Line lifecycle"
        default: ACTIVE
        constraints: "one of {ACTIVE, REMOVED}"

  - name: WarrantyClaim
    parent: RepairOrder
    common_fields: true
    fields:
      - name: repair_order_id
        type: string
        source: input
        description: "FK -> RepairOrder.id; the certified repair under claim"
      - name: claimant_contact
        type: string
        source: input
        description: "Consumer contact for the claim"
      - name: defect_category
        type: enum
        source: input
        description: "Defect classification"
        constraints: "one of {WORKMANSHIP, PART_DEFECT, CORROSION, PAINT_ADHESION, CALIBRATION_DRIFT}"
      - name: claim_amount_cents
        type: integer
        source: input
        description: "Estimated remedy cost in cents"
        constraints: ">= 0"
      - name: filed_at
        type: datetime
        source: system
        description: "Server timestamp; claim is in-warranty only if filed within WARRANTY_MONTHS (12) of repair_order.completed_at"
      - name: status
        type: enum
        source: system
        description: "Claim lifecycle"
        default: FILED
        constraints: "one of {FILED, UNDER_REVIEW, ESCALATED, RESOLVED_ACCEPTED, RESOLVED_DENIED, CLOSED}"
      - name: filed_by_role
        type: string
        source: system
        description: "Role that filed the claim; a ShopManager filer may NOT review the same claim (segregation of duties)"
      - name: reviewed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the reviewing party; null until review"
        constraints: "nullable"

  - name: InsurerRelation
    parent: Shop
    common_fields: true
    fields:
      - name: shop_id
        type: string
        source: input
        description: "FK -> Shop.id; shop side of the DRP relationship"
      - name: insurer_code
        type: string
        source: input
        description: "Stable insurer identifier, e.g. INS-ACME; unique per (shop_id, insurer_code) pair"
      - name: steering_enabled
        type: boolean
        source: computed
        description: "True only while the shop certification_status is CERTIFIED or PROBATION; recomputed on every shop posture change"
        default: false
      - name: discount_pct_bps
        type: integer
        source: input
        description: "Negotiated parts discount in basis points (1/100 of a percent), 0..2000"
        constraints: "0..2000"
      - name: status
        type: enum
        source: system
        description: "Relationship lifecycle"
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED, TERMINATED}"

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - name: consumer_zip
        type: string
        source: input
        description: "Consumer ZIP used for locator radius ranking"
      - name: source_type
        type: enum
        source: input
        description: "Referral origin"
        constraints: "one of {DEALER, INSURER, CONSUMER_DIRECT}"
      - name: source_reference
        type: string
        source: input
        description: "Dealer code, insurer claim id, or marketing code"
      - name: insurer_code
        type: string
        source: input
        description: "Required when source_type is INSURER; otherwise null"
        constraints: "nullable"
      - name: vin
        type: string
        source: input
        description: "Vehicle identification number"
      - name: routed_shop_id
        type: string
        source: system
        description: "FK -> Shop.id; shop chosen by referral_ranking selector; null while UNROUTED"
        constraints: "nullable"
      - name: status
        type: enum
        source: system
        description: "Referral lifecycle"
        default: UNROUTED
        constraints: "one of {UNROUTED, ROUTED, ACCEPTED, DECLINED, EXPIRED}"
      - name: routed_at
        type: datetime
        source: system
        description: "Server timestamp of routing; referral auto-expires REFERRAL_TTL_HOURS (72) later unless ACCEPTED/DECLINED"
        constraints: "nullable"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Shop
    initial_state: APPLICANT
    terminal_states: [DECERTIFIED]
    note: "certification_status is posture-driven: derived from the shop's current cycle/audit state, NOT free-form. Transitions listed are the only legal writers."
    transitions:
      - from: APPLICANT
        to: CERTIFIED
        trigger: "POST /network/certification-cycles/{id}/close with result PASS on the shop's cycle 1"
        actor: NetworkAuditor
        preconditions:
          - "cycle.status == UNDER_AUDIT or cycle.status == CORRECTIVE_ACTION"
          - "cycle.cycle_index == 1"
          - "audit.grade IN {A, B}"
        side_effects:
          - "recompute shop.locator_hidden := false"
          - "recompute every InsurerRelation of the shop: steering_enabled := true when relation.status == ACTIVE"
      - from: CERTIFIED
        to: PROBATION
        trigger: "cycle close with grade C, OR corrective action due_at passes while status != VERIFIED (clock sweep)"
        actor: system
        preconditions: []
        side_effects:
          - "shop.locator_hidden := false (PROBATION remains listed)"
          - "InsurerRelation.steering_enabled recomputed: stays true for ACTIVE relations (PROBATION still steerable)"
          - "all ROUTED referrals to the shop stay valid"
      - from: PROBATION
        to: CERTIFIED
        trigger: "POST /network/certification-cycles/{id}/close with result PASS and grade IN {A, B} on the current cycle"
        actor: NetworkAuditor
        preconditions:
          - "no OPEN or SUBMITTED corrective action with past-due due_at exists for any audit of the shop"
        side_effects:
          - "recompute shop.locator_hidden := false"
      - from: CERTIFIED
        to: SUSPENDED
        trigger: "cycle close with grade F, OR clock sweep: any CRITICAL corrective action of the shop's audits passes due_at still OPEN"
        actor: system
        preconditions: []
        side_effects:
          - "shop.locator_hidden := true (cascade down)"
          - "every InsurerRelation of the shop: steering_enabled := false (cascade down)"
          - "every Referral in ROUTED state pointing at the shop auto-transitions to DECLINED and pending_referral_count recomputed (cascade down, depth 3: Shop -> Referral -> Shop counter)"
      - from: PROBATION
        to: SUSPENDED
        trigger: "second consecutive cycle close with grade C, OR overdue CRITICAL corrective action beyond due_at (clock sweep)"
        actor: system
        preconditions: []
        side_effects:
          - "same cascade as CERTIFIED -> SUSPENDED"
      - from: SUSPENDED
        to: CERTIFIED
        trigger: "POST /network/certification-cycles/{id}/close with result PASS and grade IN {A, B} after all corrective actions VERIFIED"
        actor: NetworkAuditor
        preconditions:
          - "every CorrectiveAction for audits of the shop's current cycle has status == VERIFIED"
        side_effects:
          - "shop.locator_hidden := false"
          - "every ACTIVE InsurerRelation of the shop: steering_enabled := true (compensation of the suspension cascade)"
      - from: CERTIFIED
        to: EXPIRED
        trigger: "clock sweep: current cycle's window_end passed with no audit SCHEDULED within cycle"
        actor: system
        preconditions:
          - "logical clock > cycle.window_end"
          - "no Audit row exists for the cycle with status IN {SCHEDULED, IN_PROGRESS, FINDINGS_ISSUED, VERIFICATION}"
        side_effects:
          - "shop.locator_hidden := true"
          - "steering_enabled := false on all relations"
      - from: EXPIRED
        to: CERTIFIED
        trigger: "POST /network/certification-cycles/{id}/close with result PASS on a new cycle opened after expiry"
        actor: NetworkAuditor
        preconditions:
          - "a new CertificationCycle was created for the shop after expiry"
        side_effects:
          - "shop.locator_hidden := false"
          - "steering_enabled recomputed for ACTIVE relations"
      - from: SUSPENDED
        to: DECERTIFIED
        trigger: "POST /network/shops/{id}/decertify"
        actor: NetworkAdmin
        preconditions:
          - "shop.certification_status == SUSPENDED for at least DECERTIFY_GRACE_DAYS (90) days per logical clock"
          - "no RepairOrder of the shop has status IN {ESTIMATE, APPROVED, IN_REPAIR, QC, REWORK, CALIBRATION}"
        side_effects:
          - "every ACTIVE InsurerRelation -> TERMINATED"
          - "every ROUTED Referral -> DECLINED"
          - "shop.locator_hidden := true (terminal)"

  - entity: Requirement
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /network/requirements/{id}/publish"
        actor: NetworkAdmin
        preconditions:
          - "effective_from is present and >= logical clock"
        side_effects: []
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "POST /network/requirements/{id}/publish-revision creates a NEW Requirement row (same requirement_code, requirement_version+1) and supersedes this row"
        actor: NetworkAdmin
        preconditions:
          - "requirement.status == PUBLISHED"
        side_effects:
          - "new row created with supersedes_requirement_id := this row's id, status PUBLISHED, version per revision"
          - "every ShopAttestation pinned to THIS requirement row transitions ACTIVE -> LAPSED with lapse_reason 'REQUIREMENT_REVISED' (cascade)"
          - "each affected shop's live_compliance_score recomputed (bubble up)"
          - "each affected Technician whose currency depended on a TRAINING-category requirement attestation may flip to LAPSED via technician_currency recompute"
      - from: PUBLISHED
        to: RETIRED
        trigger: "POST /network/requirements/{id}/retire"
        actor: NetworkAdmin
        preconditions:
          - "no Audit in status IN_PROGRESS references this requirement"
        side_effects:
          - "attestations pinned to this requirement transition ACTIVE -> LAPSED with lapse_reason 'REQUIREMENT_RETIRED'"
      - from: DRAFT
        to: RETIRED
        trigger: "POST /network/requirements/{id}/retire"
        actor: NetworkAdmin
        preconditions: []
        side_effects: []

  - entity: ShopAttestation
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: LAPSED
        trigger: "system: owning Requirement superseded/retired, or audit finding opened against it"
        actor: system
        preconditions: []
        side_effects:
          - "owning Shop.live_compliance_score recomputed"
          - "owning Shop.locator_hidden recomputed (a lapsed CRITICAL-severity requirement while an audit is in VERIFICATION forces locator_hidden := true)"
      - from: LAPSED
        to: UNDER_CORRECTION
        trigger: "POST /network/audits/{id}/corrective-actions (a corrective action is opened referencing this attestation)"
        actor: NetworkAuditor
        preconditions:
          - "audit.status == FINDINGS_ISSUED"
        side_effects: []
      - from: UNDER_CORRECTION
        to: ACTIVE
        trigger: "corrective action transitions to VERIFIED"
        actor: NetworkAuditor
        preconditions: []
        side_effects:
          - "owning Shop.live_compliance_score recomputed (compensation: score returns toward pre-lapse value)"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /network/shops/{id}/attestations with the same requirement_id re-attests; the older ACTIVE attestation for the same requirement row is superseded"
        actor: ShopManager
        preconditions:
          - "shop.certification_status IN {CERTIFIED, PROBATION, APPLICANT}"
        side_effects:
          - "owning Shop.live_compliance_score recomputed"

  - entity: CertificationCycle
    initial_state: OPEN
    terminal_states: [CLOSED_PASS, CLOSED_FAIL]
    transitions:
      - from: OPEN
        to: AUDIT_SCHEDULED
        trigger: "POST /network/certification-cycles/{id}/audits"
        actor: NetworkAuditor
        preconditions:
          - "no other Audit for the same shop with status IN {SCHEDULED, IN_PROGRESS, FINDINGS_ISSUED, VERIFICATION}"
        side_effects: []
      - from: AUDIT_SCHEDULED
        to: UNDER_AUDIT
        trigger: "POST /network/audits/{id}/begin"
        actor: NetworkAuditor
        preconditions:
          - "logical clock within [audit.scheduled_start, audit.scheduled_end)"
        side_effects: []
      - from: UNDER_AUDIT
        to: CORRECTIVE_ACTION
        trigger: "POST /network/audits/{id}/issue-findings with at least one finding"
        actor: NetworkAuditor
        preconditions:
          - "audit.status == IN_PROGRESS"
        side_effects:
          - "each referenced ShopAttestation -> LAPSED (lapse_reason 'AUDIT_FINDING')"
          - "one CorrectiveAction row created per finding with severity-keyed due_at"
      - from: UNDER_AUDIT
        to: CLOSED_PASS
        trigger: "POST /network/audits/{id}/issue-findings with zero findings"
        actor: NetworkAuditor
        preconditions: []
        side_effects:
          - "audit.grade := certification_grade_from_findings(0 points) = A"
          - "cycle.audit_snapshot_score := shop_compliance_score(audit-snapshot variant)"
      - from: CORRECTIVE_ACTION
        to: CLOSED_PASS
        trigger: "POST /network/certification-cycles/{id}/close after every corrective action VERIFIED"
        actor: NetworkAuditor
        preconditions:
          - "all CorrectiveAction rows of the cycle's audit have status == VERIFIED"
        side_effects:
          - "audit.grade computed via certification_grade_from_findings"
          - "cycle.audit_snapshot_score frozen"
          - "Shop posture transition per Shop machine (CERTIFIED/PROBATION per grade)"
      - from: CORRECTIVE_ACTION
        to: CLOSED_FAIL
        trigger: "POST /network/certification-cycles/{id}/close with result FAIL, or clock sweep past last due_at with any corrective action still OPEN"
        actor: NetworkAuditor
        preconditions: []
        side_effects:
          - "Shop -> SUSPENDED or DECERTIFIED per Shop machine rules"

  - entity: Audit
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /network/audits/{id}/begin"
        actor: NetworkAuditor
        preconditions:
          - "logical clock within [scheduled_start, scheduled_end)"
          - "audit.auditor_user_id == acting NetworkAuditor X-User-ID"
        side_effects:
          - "cycle: AUDIT_SCHEDULED -> UNDER_AUDIT"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /network/audits/{id}/cancel"
        actor: NetworkAuditor
        preconditions: []
        side_effects:
          - "cycle returns AUDIT_SCHEDULED -> OPEN"
      - from: IN_PROGRESS
        to: FINDINGS_ISSUED
        trigger: "POST /network/audits/{id}/issue-findings with >= 1 finding"
        actor: NetworkAuditor
        preconditions: []
        side_effects:
          - "audit.severity_points recomputed"
          - "attestation lapses + corrective actions created per CertificationCycle machine"
      - from: IN_PROGRESS
        to: PASSED
        trigger: "POST /network/audits/{id}/issue-findings with 0 findings"
        actor: NetworkAuditor
        preconditions: []
        side_effects:
          - "audit.grade := A; cycle -> CLOSED_PASS"
      - from: FINDINGS_ISSUED
        to: VERIFICATION
        trigger: "POST /network/corrective-actions/{id}/submit for the last OPEN corrective action (all actions now SUBMITTED or VERIFIED)"
        actor: ShopManager
        preconditions:
          - "every CorrectiveAction of the audit has status IN {SUBMITTED, VERIFIED}"
        side_effects: []
      - from: VERIFICATION
        to: FINDINGS_ISSUED
        trigger: "POST /network/corrective-actions/{id}/verify with verdict REJECTED"
        actor: NetworkAuditor
        preconditions:
          - "verifying auditor X-User-ID != action.issued_by_user_id"
        side_effects:
          - "audit.round_number += 1 (re-audit cycle loop)"
          - "rejected action -> REJECTED then a fresh OPEN corrective action is created with a NEW due_at"
      - from: VERIFICATION
        to: PASSED
        trigger: "POST /network/corrective-actions/{id}/verify with verdict VERIFIED on the last non-verified action"
        actor: NetworkAuditor
        preconditions:
          - "verifying auditor X-User-ID != action.issued_by_user_id"
          - "after this verification every action of the audit is VERIFIED"
        side_effects:
          - "audit.grade computed; cycle eligible for CLOSED_PASS"
      - from: VERIFICATION
        to: FAILED
        trigger: "clock sweep: any corrective action due_at passed with status OPEN or SUBMITTED"
        actor: system
        preconditions: []
        side_effects:
          - "cycle -> CLOSED_FAIL; Shop posture per Shop machine"

  - entity: CorrectiveAction
    initial_state: OPEN
    terminal_states: [VERIFIED]
    transitions:
      - from: OPEN
        to: SUBMITTED
        trigger: "POST /network/corrective-actions/{id}/submit"
        actor: ShopManager
        preconditions:
          - "acting shop owns the audited attestation"
          - "logical clock <= action.due_at"
        side_effects:
          - "if this is the last OPEN action of the audit, audit FINDINGS_ISSUED -> VERIFICATION"
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /network/corrective-actions/{id}/verify with verdict VERIFIED"
        actor: NetworkAuditor
        preconditions:
          - "verifier X-User-ID != issued_by_user_id (segregation of duties)"
        side_effects:
          - "referenced attestation UNDER_CORRECTION -> ACTIVE (compensation)"
          - "shop.live_compliance_score recomputed"
          - "if last non-verified action, audit VERIFICATION -> PASSED"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /network/corrective-actions/{id}/verify with verdict REJECTED"
        actor: NetworkAuditor
        preconditions:
          - "verifier X-User-ID != issued_by_user_id"
        side_effects:
          - "a NEW CorrectiveAction row is created in OPEN with recalculated due_at (revision loop)"
          - "audit VERIFICATION -> FINDINGS_ISSUED, round_number += 1"

  - entity: RepairOrder
    initial_state: ESTIMATE
    terminal_states: [CLOSED, VOIDED]
    transitions:
      - from: ESTIMATE
        to: APPROVED
        trigger: "POST /network/repair-orders/{id}/approve"
        actor: ShopManager
        preconditions:
          - "shop.certification_status IN {CERTIFIED, PROBATION}"
          - "if is_structural then shop.structural_capability == true"
          - "assigned technician is CURRENT (or for non-structural, PROVISIONAL allowed) and belongs to the same shop"
        side_effects:
          - "at least one PRE_SCAN ProcedureStep MUST exist with result != NOT_APPLICABLE (validated at approve time — required scanning rule)"
      - from: APPROVED
        to: IN_REPAIR
        trigger: "POST /network/repair-orders/{id}/start-repair"
        actor: ShopManager
        preconditions:
          - "at least one PartLineItem with line_status == ACTIVE exists"
        side_effects: []
      - from: IN_REPAIR
        to: QC
        trigger: "POST /network/repair-orders/{id}/submit-qc"
        actor: ShopManager
        preconditions: []
        side_effects: []
      - from: QC
        to: REWORK
        trigger: "POST /network/repair-orders/{id}/fail-qc"
        actor: ShopManager
        preconditions:
          - "rework_count < MAX_REWORK (3)"
        side_effects:
          - "rework_count += 1"
      - from: REWORK
        to: QC
        trigger: "POST /network/repair-orders/{id}/submit-qc"
        actor: ShopManager
        preconditions: []
        side_effects: []
      - from: QC
        to: CALIBRATION
        trigger: "POST /network/repair-orders/{id}/pass-qc on an ADAS-equipped vehicle"
        actor: ShopManager
        preconditions:
          - "order is ADAS-equipped (explicit adas_equipped true, or derived from model year)"
        side_effects: []
      - from: QC
        to: COMPLETE
        trigger: "POST /network/repair-orders/{id}/pass-qc on a non-ADAS vehicle"
        actor: ShopManager
        preconditions:
          - "a POST_SCAN ProcedureStep with result == PASS exists with performed_at later than every ACTIVE PartLineItem's created_at (scan-after-parts chronology)"
        side_effects:
          - "order.completed_at := logical clock"
          - "shop.lifetime_repair_count unchanged (increment happens at create)"
      - from: CALIBRATION
        to: COMPLETE
        trigger: "POST /network/repair-orders/{id}/pass-qc from CALIBRATION"
        actor: ShopManager
        preconditions:
          - "an ADAS_CALIBRATION_STATIC or ADAS_CALIBRATION_DYNAMIC step with result == PASS exists"
          - "the calibration step's performed_at is later than every POST_SCAN step's performed_at (calibration-after-scan chronology)"
        side_effects:
          - "order.completed_at := logical clock"
      - from: COMPLETE
        to: WARRANTY_ACTIVE
        trigger: "system: completed_at + DELIVERY_GRACE_HOURS (24) reached without a WarrantyClaim (clock sweep)"
        actor: system
        preconditions: []
        side_effects:
          - "shop.warranty_reserve_cents += warranty_reserve_accrual(order) (ledger sync)"
      - from: WARRANTY_ACTIVE
        to: CLOSED
        trigger: "clock sweep: completed_at + WARRANTY_MONTHS (12 calendar months) passed with all claims CLOSED/RESOLVED"
        actor: system
        preconditions:
          - "no WarrantyClaim of this order has status IN {FILED, UNDER_REVIEW, ESCALATED}"
        side_effects:
          - "unclaimed remainder of the order's reserve accrual is released: shop.warranty_reserve_cents -= remaining accrual for this order (compensation)"
      - from: ESTIMATE
        to: VOIDED
        trigger: "POST /network/repair-orders/{id}/void"
        actor: ShopManager
        preconditions:
          - "order.status == ESTIMATE"
        side_effects: []
      - from: APPROVED
        to: VOIDED
        trigger: "POST /network/repair-orders/{id}/void with reason"
        actor: ShopManager
        preconditions:
          - "no ProcedureStep with step_type == WELD_BOND exists (structural work not started)"
        side_effects:
          - "linked Referral, if any and in ACCEPTED, is NOT reverted (historical record)"

  - entity: Technician
    initial_state: PROVISIONAL
    terminal_states: [INACTIVE]
    transitions:
      - from: PROVISIONAL
        to: CURRENT
        trigger: "system: curriculum_progress_pct reaches 100.0 on CourseCompletion create or clock sweep recompute"
        actor: system
        preconditions: []
        side_effects: []
      - from: CURRENT
        to: LAPSED
        trigger: "clock sweep: any required CourseCompletion flips CURRENT -> EXPIRED, dropping curriculum_progress_pct below 100.0"
        actor: system
        preconditions: []
        side_effects:
          - "shop.live_compliance_score recomputed (TRAINING category weight)"
          - "RepairOrders where this technician is assigned and status == ESTIMATE cannot transition to APPROVED until reassigned (state precondition, no auto-void)"
      - from: LAPSED
        to: CURRENT
        trigger: "system: a new CourseCompletion restores curriculum_progress_pct to 100.0"
        actor: system
        preconditions: []
        side_effects:
          - "shop.live_compliance_score recomputed (compensation)"
      - from: PROVISIONAL
        to: INACTIVE
        trigger: "POST /network/technicians/{id}/deactivate"
        actor: ShopManager
        preconditions:
          - "no RepairOrder references this technician with status IN {ESTIMATE, APPROVED, IN_REPAIR, QC, REWORK, CALIBRATION}"
        side_effects: []
      - from: CURRENT
        to: INACTIVE
        trigger: "POST /network/technicians/{id}/deactivate"
        actor: ShopManager
        preconditions:
          - "same as PROVISIONAL -> INACTIVE"
        side_effects: []

  # CourseCompletion, ProcedureStep and PartLineItem lifecycles follow.
  - entity: CourseCompletion
    initial_state: CURRENT
    terminal_states: [EXPIRED]
    transitions:
      - from: CURRENT
        to: EXPIRED
        trigger: "clock sweep: completed_at + course.validity_months (calendar months) < logical clock"
        actor: system
        preconditions: []
        side_effects:
          - "technician curriculum_progress_pct recomputed; Technician may flip CURRENT -> LAPSED (cascade, depth 2)"
          - "if the technician was lead on an ESTIMATE repair order, that order's approve precondition now fails (no auto-transition)"

  - entity: ProcedureStep
    initial_state: RECORDED
    terminal_states: [VOIDED]
    transitions:
      - from: RECORDED
        to: VOIDED
        trigger: "POST /network/repair-orders/{id}/procedure-steps with same step_type re-performs the step; the older RECORDED row of the same step_type is voided"
        actor: ShopManager
        preconditions:
          - "order.status IN {IN_REPAIR, QC, REWORK, CALIBRATION}"
        side_effects:
          - "chronology validations re-evaluated for the order"

  - entity: PartLineItem
    initial_state: ACTIVE
    terminal_states: [REMOVED]
    transitions:
      - from: ACTIVE
        to: REMOVED
        trigger: "DELETE /network/repair-orders/{id}/part-lines/{id}"
        actor: ShopManager
        preconditions:
          - "order.status IN {ESTIMATE, APPROVED, IN_REPAIR}"
        side_effects:
          - "order.oe_parts_ratio_by_cost and oe_parts_ratio_by_count recomputed"

  - entity: WarrantyClaim
    initial_state: FILED
    terminal_states: [RESOLVED_ACCEPTED, RESOLVED_DENIED, CLOSED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /network/warranty-claims/{id}/review"
        actor: NetworkAdmin
        preconditions:
          - "reviewer role is NetworkAdmin (ShopManager filer may never review)"
        side_effects: []
      - from: UNDER_REVIEW
        to: ESCALATED
        trigger: "POST /network/warranty-claims/{id}/escalate"
        actor: NetworkAdmin
        preconditions:
          - "defect_category == PART_DEFECT or claim_amount_cents > ESCALATION_THRESHOLD_CENTS (500000)"
        side_effects:
          - "shop.pending escalations tracked; shop posture unchanged but next audit's grade threshold worsens per certification_grade_from_findings constants"
      - from: UNDER_REVIEW
        to: RESOLVED_ACCEPTED
        trigger: "POST /network/warranty-claims/{id}/resolve with verdict ACCEPTED"
        actor: NetworkAdmin
        preconditions:
          - "reviewer X-User-ID != claim filer X-User-ID"
        side_effects:
          - "shop.warranty_reserve_cents -= claim_amount_cents capped at remaining accrual for this order (ledger sync, floor 0)"
      - from: UNDER_REVIEW
        to: RESOLVED_DENIED
        trigger: "POST /network/warranty-claims/{id}/resolve with verdict DENIED"
        actor: NetworkAdmin
        preconditions:
          - "reviewer X-User-ID != claim filer X-User-ID"
        side_effects: []
      - from: ESCALATED
        to: RESOLVED_ACCEPTED
        trigger: "POST /network/warranty-claims/{id}/resolve with verdict ACCEPTED"
        actor: NetworkAdmin
        preconditions:
          - "claim must have been ESCALATED first when part defect or over threshold"
        side_effects:
          - "same reserve decrement as UNDER_REVIEW path"
      - from: ESCALATED
        to: RESOLVED_DENIED
        trigger: "POST /network/warranty-claims/{id}/resolve with verdict DENIED"
        actor: NetworkAdmin
        preconditions: []
        side_effects: []
      - from: RESOLVED_ACCEPTED
        to: CLOSED
        trigger: "clock sweep 30 days after resolution"
        actor: system
        preconditions: []
        side_effects: []
      - from: RESOLVED_DENIED
        to: CLOSED
        trigger: "clock sweep 30 days after resolution"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Referral
    initial_state: UNROUTED
    terminal_states: [ACCEPTED, DECLINED, EXPIRED]
    transitions:
      - from: UNROUTED
        to: ROUTED
        trigger: "POST /network/referrals/{id}/route (explicit) or automatic route on creation when locator_selector yields a candidate"
        actor: system
        preconditions:
          - "candidate pool non-empty per referral_ranking selector"
        side_effects:
          - "chosen shop.pending_referral_count += 1"
          - "routed_at := logical clock"
      - from: ROUTED
        to: ACCEPTED
        trigger: "POST /network/referrals/{id}/accept"
        actor: ShopManager
        preconditions:
          - "acting shop.id == referral.routed_shop_id"
          - "logical clock < routed_at + REFERRAL_TTL_HOURS (72)"
          - "shop.certification_status IN {CERTIFIED, PROBATION}"
        side_effects:
          - "shop.pending_referral_count -= 1"
      - from: ROUTED
        to: DECLINED
        trigger: "POST /network/referrals/{id}/decline or shop suspension cascade"
        actor: ShopManager
        preconditions:
          - "acting shop.id == referral.routed_shop_id (manual decline path)"
        side_effects:
          - "shop.pending_referral_count -= 1"
      - from: ROUTED
        to: EXPIRED
        trigger: "clock sweep: routed_at + REFERRAL_TTL_HOURS (72) passed"
        actor: system
        preconditions: []
        side_effects:
          - "shop.pending_referral_count -= 1 (compensation of the routing increment — net zero)"

  - entity: InsurerRelation
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /network/insurer-relations/{id}/suspend"
        actor: NetworkAdmin
        preconditions: []
        side_effects:
          - "steering_enabled := false"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /network/insurer-relations/{id}/reinstate"
        actor: NetworkAdmin
        preconditions:
          - "shop.certification_status IN {CERTIFIED, PROBATION}"
        side_effects:
          - "steering_enabled recomputed from shop posture"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /network/insurer-relations/{id}/terminate or shop decertification cascade"
        actor: NetworkAdmin
        preconditions: []
        side_effects:
          - "steering_enabled := false"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /network/insurer-relations/{id}/terminate"
        actor: NetworkAdmin
        preconditions: []
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only — all other conflicts are state preconditions)
# =============================================================================
concurrency_rules:
  - rule_id: repair-order-create-stale-shop
    parent_entity: Shop
    write_endpoint: "POST /network/shops/{id}/repair-orders"
    occ_field: "expected_shop_version"
    description: |
      Creating a RepairOrder against a Shop whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      writer mutated the shop (posture cascade, referral counter, reserve accrual)
      after the client read it, so the client's view of certification_status is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: cycle-close-stale-cycle
    parent_entity: CertificationCycle
    write_endpoint: "POST /network/certification-cycles/{id}/close"
    occ_field: "expected_cycle_version"
    description: |
      Closing a CertificationCycle whose version has advanced since the client last
      observed it is rejected. Another writer (finding issuance, corrective-action
      verification cascades bumping the cycle) makes the client's view of the cycle
      stale, so the close is refused rather than applied over unknown state.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: attestation-create-stale-shop
    parent_entity: Shop
    write_endpoint: "POST /network/shops/{id}/attestations"
    occ_field: "expected_shop_version"
    description: |
      Creating a ShopAttestation against a Shop whose version has advanced since the
      client last observed it is rejected; a superseding attestation (which legitimately
      supersedes the prior attestation for the same requirement row under §1.2) may
      have been written by another client, making this writer's view stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: shop_compliance_score
    trigger: "On any ShopAttestation status change, any Technician status change, Requirement publish-revision/retire cascade, and at audit close (snapshot variant)"
    algorithm: weighted_scoring
    formula: |
      CATEGORY_WEIGHT = {EQUIPMENT: 30, STRUCTURAL: 30, TOOLING: 15, TRAINING: 25}
      For each category C:
        total_C = count of Requirement rows with status == PUBLISHED, category == C,
                  and effective_from <= logical clock
        satisfied_C = count of DISTINCT requirement_id among total_C such that
                  the shop has a ShopAttestation with requirement_id == that row
                  and attestation.status == ACTIVE
        cat_score_C = (total_C == 0) ? 100.0 : 100.0 * satisfied_C / total_C
      training_factor: TRAINING category additionally requires that the shop has
        >= 1 Technician with status == CURRENT for each tech_role present among
        the shop's technicians; if any represented role has zero CURRENT
        technicians, cat_score_TRAINING := cat_score_TRAINING * 0.5
      score = sum(CATEGORY_WEIGHT[C] * cat_score_C) / 100.0
      Round to 2 decimal places, round_half_up.
    input_set: "PUBLISHED Requirement rows effective as of the evaluation instant; ACTIVE attestations only (LAPSED, UNDER_CORRECTION, SUPERSEDED excluded)"
    constants:
      W_EQUIPMENT: 30
      W_STRUCTURAL: 30
      W_TOOLING: 15
      W_TRAINING: 25
    precision: "2 decimal places, round_half_up"
    variants:
      - name: live
        when: "stored on shop.live_compliance_score; recomputed on every attestation/technician/requirement mutation"
        difference: "Uses current state at recompute time; can move up or down between audits"
      - name: audit_snapshot
        when: "stored on cycle.audit_snapshot_score exactly once at cycle close"
        difference: "Frozen at close; computed from state as of the audit close instant and NEVER recomputed, even if attestations later lapse. Live and snapshot therefore diverge after any post-close mutation."

  - name: certification_grade_from_findings
    trigger: "At audit close (PASSED path) or cycle close"
    algorithm: threshold
    formula: |
      severity_points = sum over the audit's CorrectiveAction rows (any status):
        MINOR -> 1, MAJOR -> 5, CRITICAL -> 25
      escalation_penalty = 3 * (count of WarrantyClaim rows against repairs of the
        shop with status == ESCALATED at the evaluation instant)
      effective_points = severity_points + escalation_penalty
      grade :=  A when effective_points == 0
                B when 1 <= effective_points <= 5
                C when 6 <= effective_points <= 24
                F when effective_points >= 25
      Boundaries are INCLUSIVE as written: 5 -> B, 6 -> C, 24 -> C, 25 -> F.
    input_set: "All CorrectiveAction rows of the audit (including REJECTED and their OPEN replacements count once each), plus ESCALATED WarrantyClaims of the shop at evaluation time"
    constants:
      W_MINOR: 1
      W_MAJOR: 5
      W_CRITICAL: 25
      ESCALATION_PENALTY_EACH: 3
      GRADE_B_MAX: 5
      GRADE_C_MAX: 24
    precision: "integer points; grade boundaries inclusive as specified"

  - name: oe_parts_ratio
    trigger: "On every PartLineItem create/remove for the parent RepairOrder"
    algorithm: aggregation
    formula: |
      Active lines: PartLineItem rows of the order with line_status == ACTIVE.
      OE classes = {OE, OE_SURPLUS}.
      ratio_by_count = (count of active lines with part_class IN OE classes)
                       / (count of all active lines)
      ratio_by_cost  = sum(unit_cost_cents * quantity for OE-class active lines)
                       / sum(unit_cost_cents * quantity for all active lines)
      If there are zero active lines, BOTH ratios are defined as 1.0 (vacuously
      compliant) — the empty-set rule.
      Both ratios rounded to 4 decimal places, round_half_up.
    input_set: "PartLineItem rows of the order with line_status == ACTIVE"
    constants:
      EMPTY_SET_RATIO: 1.0
    precision: "4 decimal places, round_half_up"
    variants:
      - name: by_count
        when: "stored on order.oe_parts_ratio_by_count; used by the audit OE-usage expectation check"
        difference: "Each line weighs equally regardless of cost; a cheap aftermarket clip drags the ratio exactly as much as an expensive aftermarket bumper"
      - name: by_cost
        when: "stored on order.oe_parts_ratio_by_cost; used for insurer DRP reporting"
        difference: "Cost-weighted; expensive OE parts can mask many cheap non-OE lines. Identical input data yields different ratios under the two variants."

  - name: technician_currency
    trigger: "On CourseCompletion create, on TrainingCourse change, and on clock sweep expiry"
    algorithm: aggregation
    formula: |
      Required set for technician T: all TrainingCourse rows with active == true
        and T.tech_role IN course.required_for_roles.
      Satisfied: a required course is satisfied when T has a CourseCompletion row
        with course_id == that course and status == CURRENT (completed_at +
        course.validity_months calendar months > logical clock).
      curriculum_progress_pct = 100.0 * satisfied_count / required_count,
        rounded to 2 decimal places, round_half_up; when required_count == 0 the
        progress is defined as 100.0 (vacuous satisfaction).
      T.status := CURRENT iff progress == 100.0 AND T.status != INACTIVE;
        LAPSED iff progress < 100.0 AND T was previously CURRENT;
        PROVISIONAL while never-yet-current.
    input_set: "TrainingCourse rows active == true with the technician's role in required_for_roles; CourseCompletion rows of the technician with status == CURRENT"
    constants:
      FULL_PROGRESS: 100.0
    precision: "2 decimal places, round_half_up"

  - name: referral_ranking
    trigger: "POST /network/referrals (auto-route) and POST /network/referrals/{id}/route"
    algorithm: weighted_scoring
    formula: |
      Eligibility filter (candidate pool): Shop rows with
        certification_status IN {CERTIFIED, PROBATION} AND locator_hidden == false
        AND haversine_miles(shop.lat/lon, consumer ZIP centroid) <= LOCATOR_RADIUS_MILES (25)
        AND (referral.source_type != INSURER OR there exists an InsurerRelation
             with shop_id == shop.id, insurer_code == referral.insurer_code,
             status == ACTIVE, steering_enabled == true)
      Ranking score = 0.6 * (1 - distance_miles / LOCATOR_RADIUS_MILES)
                    + 0.3 * (live_compliance_score / 100.0)
                    + 0.1 * (1 - min(pending_referral_count, 20) / 20)
      Sort: score DESC; tie-break 1: live_compliance_score DESC;
        tie-break 2: created_at ASC (earliest-onboarded shop wins).
        id MUST NOT participate in ranking or tie-break.
      Fallback: empty pool -> referral stays UNROUTED and the API returns the
        referral with routed_shop_id == null (no error).
    input_set: "All Shop rows passing the eligibility filter at evaluation time"
    constants:
      LOCATOR_RADIUS_MILES: 25
      W_DISTANCE: 0.6
      W_COMPLIANCE: 0.3
      W_LOAD: 0.1
      LOAD_CAP: 20
    precision: "6 decimal places for intermediate score, round_half_up"

  - name: warranty_reserve_accrual
    trigger: "When RepairOrder reaches WARRANTY_ACTIVE, and released when the order reaches CLOSED"
    algorithm: tiered_pricing
    formula: |
      base = order.estimate_total_cents
      tiered rate on base (marginal tiers):
        first 100000 cents            -> 3.0%
        next 400000 cents (..500000)  -> 2.0%
        above 500000 cents            -> 1.0%
      adas_multiplier = 1.5 if the order is ADAS-equipped else 1.0
      rework_penalty = 500 * order.rework_count cents (flat per rework loop)
      accrual = round_half_up(base_rate_amount * adas_multiplier) + rework_penalty
      Evaluation order is pinned: (1) marginal tiered base rate, (2) multiply by
      adas_multiplier, (3) round_half_up to whole cents, (4) add flat rework
      penalty. Rounding BEFORE adding the penalty is mandatory — the two orders
      produce different cents.
      Accrual is ADDED to shop.warranty_reserve_cents on WARRANTY_ACTIVE entry and
      the unreleased remainder is SUBTRACTED on CLOSED (compensating invariant:
      a repair with no accepted claims nets zero drift on the reserve).
    input_set: "The transitioning RepairOrder only"
    constants:
      TIER1_CAP_CENTS: 100000
      TIER1_RATE: 0.03
      TIER2_CAP_CENTS: 500000
      TIER2_RATE: 0.02
      TIER3_RATE: 0.01
      ADAS_MULTIPLIER: 1.5
      REWORK_PENALTY_CENTS: 500
    precision: "whole cents, round_half_up at the pinned step"

  - name: audit_window_overlap
    trigger: "POST /network/certification-cycles/{id}/audits"
    algorithm: interval_merge
    formula: |
      A new audit window [new_start, new_end) for shop S conflicts when there
      exists another Audit A of the same shop (via cycle.shop_id) with
      A.status IN {SCHEDULED, IN_PROGRESS} AND
      new_start < A.scheduled_end AND A.scheduled_start < new_end
      (half-open intersection; touching windows where new_start == A.scheduled_end
      are NOT a conflict). CANCELLED/PASSED/FAILED audits never conflict.
      Distinct from cycle windows, which use CLOSED zero-gap adjacency
      (next.window_start == prev.window_end + 1 second exactly).
    input_set: "Audit rows of the same shop with status IN {SCHEDULED, IN_PROGRESS}"
    constants: {}
    precision: "whole seconds"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /network/locator/search"
  - priority: 2
    category: auth
    check: "Role is permitted for the endpoint per §1.5 roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path-template resources exist, validated left-to-right; nested child must belong to the parent in the path"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Request-body foreign keys resolve: shop_id, cycle_id, requirement_id, technician_id, course_id, repair_order_id, referral_id, insurer_relation_id, audit_id, attestation_id"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: state
    check: "Target entity in a legal source state for the invoked transition (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version equals the parent's current version (see §1.2.1)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /network/shops/{id}/repair-orders, POST /network/certification-cycles/{id}/close, POST /network/shops/{id}/attestations"
  - priority: 7
    category: business_safety
    check: "PartLineItem: safety-critical parts (is_safety_critical == true) may only be OE or OE_SURPLUS"
    error_id: ERR_SAFETY_PART_CLASS
    http_status: 422
    applies_to: "POST /network/repair-orders/{id}/part-lines"
  - priority: 8
    category: business_safety
    check: "RepairOrder approve: a PRE_SCAN step with result != NOT_APPLICABLE must exist (mandatory pre-repair scanning rule)"
    error_id: ERR_PRE_SCAN_REQUIRED
    http_status: 422
    applies_to: "POST /network/repair-orders/{id}/approve"
  - priority: 9
    category: business_safety
    check: "RepairOrder pass-qc from CALIBRATION: a passing ADAS calibration step must exist and its performed_at must be strictly after every POST_SCAN step's performed_at"
    error_id: ERR_CALIBRATION_SEQUENCE
    http_status: 422
    applies_to: "POST /network/repair-orders/{id}/pass-qc"
  - priority: 10
    category: business_safety
    check: "RepairOrder pass-qc from QC (non-ADAS path): a POST_SCAN step with result PASS must exist with performed_at later than every ACTIVE PartLineItem's created_at"
    error_id: ERR_POST_SCAN_REQUIRED
    http_status: 422
    applies_to: "POST /network/repair-orders/{id}/pass-qc"
  - priority: 11
    category: business_referential
    check: "Structural repair order requires shop.structural_capability == true and assigned technician tech_role == STRUCTURAL with status == CURRENT"
    error_id: ERR_STRUCTURAL_CAPABILITY
    http_status: 422
    applies_to: "POST /network/shops/{id}/repair-orders, POST /network/repair-orders/{id}/approve"
  - priority: 12
    category: business_referential
    check: "Corrective action verification: verifier X-User-ID must differ from the action's issued_by_user_id (segregation of duties)"
    error_id: ERR_SELF_VERIFICATION
    http_status: 422
    applies_to: "POST /network/corrective-actions/{id}/verify"
  - priority: 13
    category: business_referential
    check: "Warranty claim review/resolve: reviewer X-User-ID must differ from the filer X-User-ID"
    error_id: ERR_SELF_VERIFICATION
    http_status: 422
    applies_to: "POST /network/warranty-claims/{id}/review, POST /network/warranty-claims/{id}/resolve"
  - priority: 14
    category: business_constraint
    check: "PartLineItem with part_class IN {AFTERMARKET, RECYCLED, REMANUFACTURED} must carry a non-empty alternative_justification"
    error_id: ERR_ALT_PART_UNDOCUMENTED
    http_status: 422
    applies_to: "POST /network/repair-orders/{id}/part-lines"
  - priority: 15
    category: business_constraint
    check: "CertificationCycle window: window_end == window_start + 365 days - 1 second; new cycle's window_start == previous cycle's window_end + 1 second (zero-gap)"
    error_id: ERR_CYCLE_WINDOW
    http_status: 422
    applies_to: "POST /network/shops/{id}/certification-cycles"
  - priority: 16
    category: business_temporal
    check: "Audit scheduling: [scheduled_start, scheduled_end) half-open window must not intersect another SCHEDULED/IN_PROGRESS audit of the same shop; touching endpoints allowed"
    error_id: ERR_AUDIT_OVERLAP
    http_status: 409
    applies_to: "POST /network/certification-cycles/{id}/audits"
  - priority: 17
    category: business_temporal
    check: "Audit begin: logical clock must be within [scheduled_start, scheduled_end)"
    error_id: ERR_AUDIT_WINDOW_MISSED
    http_status: 422
    applies_to: "POST /network/audits/{id}/begin"
  - priority: 18
    category: business_temporal
    check: "Warranty claim: filed within WARRANTY_MONTHS (12 calendar months) of repair_order.completed_at; order must be in WARRANTY_ACTIVE"
    error_id: ERR_WARRANTY_EXPIRED
    http_status: 422
    applies_to: "POST /network/repair-orders/{id}/warranty-claims"
  - priority: 19
    category: business_temporal
    check: "Referral accept: logical clock < routed_at + 72 hours and routed shop still CERTIFIED/PROBATION"
    error_id: ERR_REFERRAL_EXPIRED
    http_status: 422
    applies_to: "POST /network/referrals/{id}/accept"
  - priority: 20
    category: business_temporal
    check: "Corrective action submit: logical clock <= due_at"
    error_id: ERR_CORRECTIVE_OVERDUE
    http_status: 422
    applies_to: "POST /network/corrective-actions/{id}/submit"
  - priority: 21
    category: business_constraint
    check: "RepairOrder approve requires shop.certification_status IN {CERTIFIED, PROBATION}; SUSPENDED/EXPIRED/DECERTIFIED shops may not start new repairs"
    error_id: ERR_SHOP_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /network/shops/{id}/repair-orders, POST /network/repair-orders/{id}/approve"
  - priority: 22
    category: business_constraint
    check: "Shop decertify requires SUSPENDED for >= 90 days and no open repair orders"
    error_id: ERR_DECERTIFY_BLOCKED
    http_status: 422
    applies_to: "POST /network/shops/{id}/decertify"
  - priority: 23
    category: business_constraint
    check: "Requirement publish: effective_from must be >= logical clock"
    error_id: ERR_EFFECTIVE_IN_PAST
    http_status: 422
    applies_to: "POST /network/requirements/{id}/publish, POST /network/requirements/{id}/publish-revision"
  - priority: 24
    category: business_fiscal
    check: "Warranty resolve ACCEPTED: decrement is capped at the remaining accrual for the order; never drives shop.warranty_reserve_cents negative"
    error_id: ERR_RESERVE_FLOOR
    http_status: 422
    applies_to: "POST /network/warranty-claims/{id}/resolve"
  - priority: 25
    category: business_constraint
    check: "Enum/type/format checks: vin 17 chars, state_code 2 uppercase letters, discount_pct_bps 0..2000, estimate_total_cents >= 0, quantity >= 1"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Shops ---
  - method: POST
    path: "/network/shops"
    description: "Register a new shop into the network as APPLICANT"
    roles: [NetworkAdmin]
    code: 201
    input: [legal_name, state_code, zip_code, latitude, longitude, "structural_capability?"]
    output: Shop
    side_effects: []
  - method: GET
    path: "/network/shops"
    description: "List shops with filters and pagination"
    roles: [NetworkAdmin, NetworkAuditor, ShopManager, DealerRep, InsurerRep]
    code: 200
    input: ["state_code?", "certification_status?", "limit?", "offset?"]
    output: Shop[]
    side_effects: []
  - method: GET
    path: "/network/shops/{id}"
    description: "Fetch one shop incl. derived posture fields"
    roles: [NetworkAdmin, NetworkAuditor, ShopManager, DealerRep, InsurerRep]
    code: 200
    input: []
    output: Shop
    side_effects: []
  - method: POST
    path: "/network/shops/{id}/decertify"
    description: "Terminate a long-suspended shop from the network"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: Shop
    side_effects: ["InsurerRelations TERMINATED", "ROUTED Referrals DECLINED", "locator_hidden := true"]

  # --- Certification cycles ---
  - method: POST
    path: "/network/shops/{id}/certification-cycles"
    description: "Open the next certification cycle; window must be exactly 365 days and zero-gap adjacent to the previous cycle"
    roles: [NetworkAdmin]
    code: 201
    input: [window_start, window_end]
    output: CertificationCycle
    side_effects: ["cycle_index assigned in created_at order"]
  - method: GET
    path: "/network/shops/{id}/certification-cycles"
    description: "List a shop's certification cycles"
    roles: [NetworkAdmin, NetworkAuditor, ShopManager]
    code: 200
    input: ["limit?", "offset?"]
    output: CertificationCycle[]
    side_effects: []
  - method: GET
    path: "/network/certification-cycles/{id}"
    description: "Fetch one cycle"
    roles: [NetworkAdmin, NetworkAuditor, ShopManager]
    code: 200
    input: []
    output: CertificationCycle
    side_effects: []
  - method: POST
    path: "/network/certification-cycles/{id}/close"
    description: "Close a cycle with result PASS or FAIL; OCC-guarded; applies grade and shop posture transitions"
    roles: [NetworkAuditor]
    code: 200
    input: [expected_cycle_version, result]
    output: CertificationCycle
    side_effects: ["audit.grade computed", "cycle.audit_snapshot_score frozen", "Shop posture per §1.2", "increments CertificationCycle.version by 1"]

  # --- Requirements ---
  - method: POST
    path: "/network/requirements"
    description: "Create a requirement row in DRAFT"
    roles: [NetworkAdmin]
    code: 201
    input: [requirement_code, category, description, severity_if_failed, effective_from]
    output: Requirement
    side_effects: []
  - method: GET
    path: "/network/requirements"
    description: "List requirements with filters; supersedes_requirement_id? finds revision children of a requirement row"
    roles: [NetworkAdmin, NetworkAuditor, ShopManager]
    code: 200
    input: ["category?", "status?", "supersedes_requirement_id?", "limit?", "offset?"]
    output: Requirement[]
    side_effects: []
  - method: GET
    path: "/network/requirements/{id}"
    description: "Fetch one requirement row"
    roles: [NetworkAdmin, NetworkAuditor, ShopManager]
    code: 200
    input: []
    output: Requirement
    side_effects: []
  - method: POST
    path: "/network/requirements/{id}/publish"
    description: "Publish a DRAFT requirement"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: Requirement
    side_effects: []
  - method: POST
    path: "/network/requirements/{id}/publish-revision"
    description: "Publish a new revision of a PUBLISHED requirement: creates a NEW Requirement row (same requirement_code, requirement_version+1, supersedes_requirement_id := this row) and supersedes this row; pinned attestations lapse"
    roles: [NetworkAdmin]
    code: 201
    input: [description, severity_if_failed, effective_from]
    output: Requirement
    side_effects: ["old row -> SUPERSEDED", "pinned attestations ACTIVE -> LAPSED", "shop.live_compliance_score recomputed"]
  - method: POST
    path: "/network/requirements/{id}/retire"
    description: "Retire a requirement; pinned attestations lapse"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: Requirement
    side_effects: ["pinned attestations ACTIVE -> LAPSED"]

  # --- Attestations ---
  - method: POST
    path: "/network/shops/{id}/attestations"
    description: "Attest satisfaction of a published requirement revision; OCC-guarded; supersedes the older ACTIVE attestation for the same requirement row"
    roles: [ShopManager]
    code: 201
    input: [requirement_id, evidence_uri, expected_shop_version]
    output: ShopAttestation
    side_effects: ["older ACTIVE attestation for same requirement row -> SUPERSEDED", "shop.live_compliance_score recomputed", "increments Shop.version by 1"]
  - method: GET
    path: "/network/shops/{id}/attestations"
    description: "List a shop's attestations"
    roles: [NetworkAdmin, NetworkAuditor, ShopManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ShopAttestation[]
    side_effects: []
  - method: GET
    path: "/network/attestations"
    description: "Filtered list of attestations across shops; requirement_id? finds all attestations pinned to a requirement row"
    roles: [NetworkAdmin, NetworkAuditor]
    code: 200
    input: ["requirement_id?", "shop_id?", "status?", "limit?", "offset?"]
    output: ShopAttestation[]
    side_effects: []
  - method: GET
    path: "/network/attestations/{id}"
    description: "Fetch one attestation"
    roles: [NetworkAdmin, NetworkAuditor, ShopManager]
    code: 200
    input: []
    output: ShopAttestation
    side_effects: []

  # --- Audits ---
  - method: POST
    path: "/network/certification-cycles/{id}/audits"
    description: "Schedule an audit; half-open window overlap with the same shop's active audits is rejected"
    roles: [NetworkAuditor]
    code: 201
    input: [scheduled_start, scheduled_end]
    output: Audit
    side_effects: ["cycle OPEN -> AUDIT_SCHEDULED", "audit.auditor_user_id := acting X-User-ID"]
  - method: GET
    path: "/network/certification-cycles/{id}/audits"
    description: "List audits of a cycle"
    roles: [NetworkAdmin, NetworkAuditor, ShopManager]
    code: 200
    input: ["limit?", "offset?"]
    output: Audit[]
    side_effects: []
  - method: GET
    path: "/network/audits/{id}"
    description: "Fetch one audit"
    roles: [NetworkAdmin, NetworkAuditor, ShopManager]
    code: 200
    input: []
    output: Audit
    side_effects: []
  - method: POST
    path: "/network/audits/{id}/begin"
    description: "Begin a scheduled audit within its window"
    roles: [NetworkAuditor]
    code: 200
    input: []
    output: Audit
    side_effects: ["cycle AUDIT_SCHEDULED -> UNDER_AUDIT"]
  - method: POST
    path: "/network/audits/{id}/cancel"
    description: "Cancel a scheduled audit"
    roles: [NetworkAuditor]
    code: 200
    input: []
    output: Audit
    side_effects: ["cycle AUDIT_SCHEDULED -> OPEN"]
  - method: POST
    path: "/network/audits/{id}/issue-findings"
    description: "Issue findings; each finding lapses the referenced attestation and opens a CorrectiveAction with severity-keyed due_at; zero findings passes the audit"
    roles: [NetworkAuditor]
    code: 200
    input: [findings]
    output: Audit
    side_effects: ["attestations -> LAPSED", "CorrectiveActions created", "audit.severity_points recomputed", "cycle UNDER_AUDIT -> CORRECTIVE_ACTION or CLOSED_PASS"]

  # --- Corrective actions ---
  - method: GET
    path: "/network/audits/{id}/corrective-actions"
    description: "List corrective actions of an audit"
    roles: [NetworkAdmin, NetworkAuditor, ShopManager]
    code: 200
    input: ["limit?", "offset?"]
    output: CorrectiveAction[]
    side_effects: []
  - method: GET
    path: "/network/corrective-actions"
    description: "Filtered list of corrective actions; attestation_id? finds actions against an attestation"
    roles: [NetworkAdmin, NetworkAuditor]
    code: 200
    input: ["attestation_id?", "status?", "limit?", "offset?"]
    output: CorrectiveAction[]
    side_effects: []
  - method: GET
    path: "/network/corrective-actions/{id}"
    description: "Fetch one corrective action"
    roles: [NetworkAdmin, NetworkAuditor, ShopManager]
    code: 200
    input: []
    output: CorrectiveAction
    side_effects: []
  - method: POST
    path: "/network/corrective-actions/{id}/submit"
    description: "Shop submits corrected evidence before due_at"
    roles: [ShopManager]
    code: 200
    input: [evidence_uri]
    output: CorrectiveAction
    side_effects: ["if last OPEN action, audit FINDINGS_ISSUED -> VERIFICATION"]
  - method: POST
    path: "/network/corrective-actions/{id}/verify"
    description: "Auditor verifies or rejects submitted evidence; verifier must differ from issuer (segregation of duties)"
    roles: [NetworkAuditor]
    code: 200
    input: [verdict]
    output: CorrectiveAction
    side_effects: ["VERIFIED: attestation UNDER_CORRECTION -> ACTIVE; audit may pass", "REJECTED: new OPEN action created; audit round_number += 1"]

  # --- Technicians & training ---
  - method: POST
    path: "/network/shops/{id}/technicians"
    description: "Hire a technician into a shop"
    roles: [ShopManager]
    code: 201
    input: [full_name, tech_role]
    output: Technician
    side_effects: []
  - method: GET
    path: "/network/shops/{id}/technicians"
    description: "List a shop's technicians"
    roles: [NetworkAdmin, NetworkAuditor, ShopManager]
    code: 200
    input: ["status?", "tech_role?", "limit?", "offset?"]
    output: Technician[]
    side_effects: []
  - method: GET
    path: "/network/technicians/{id}"
    description: "Fetch one technician"
    roles: [NetworkAdmin, NetworkAuditor, ShopManager]
    code: 200
    input: []
    output: Technician
    side_effects: []
  - method: POST
    path: "/network/technicians/{id}/deactivate"
    description: "Deactivate a technician with no open repair orders"
    roles: [ShopManager]
    code: 200
    input: []
    output: Technician
    side_effects: []
  - method: POST
    path: "/network/training-courses"
    description: "Create a training course"
    roles: [NetworkAdmin]
    code: 201
    input: [course_code, title, required_for_roles, validity_months, credit_hours, "active?"]
    output: TrainingCourse
    side_effects: []
  - method: GET
    path: "/network/training-courses"
    description: "List training courses"
    roles: [NetworkAdmin, NetworkAuditor, ShopManager]
    code: 200
    input: ["active?", "limit?", "offset?"]
    output: TrainingCourse[]
    side_effects: []
  - method: GET
    path: "/network/training-courses/{id}"
    description: "Fetch one course"
    roles: [NetworkAdmin, NetworkAuditor, ShopManager]
    code: 200
    input: []
    output: TrainingCourse
    side_effects: []
  - method: POST
    path: "/network/technicians/{id}/course-completions"
    description: "Record a course completion; recomputes curriculum and may flip technician status"
    roles: [ShopManager, NetworkAdmin]
    code: 201
    input: [course_id, completed_at, proof_uri]
    output: CourseCompletion
    side_effects: ["technician_currency recompute", "Technician status may transition"]
  - method: GET
    path: "/network/technicians/{id}/course-completions"
    description: "List a technician's completions"
    roles: [NetworkAdmin, NetworkAuditor, ShopManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CourseCompletion[]
    side_effects: []
  - method: GET
    path: "/network/training-courses/{id}/completions"
    description: "List completions recorded against a course (reverse lookup)"
    roles: [NetworkAdmin, NetworkAuditor, ShopManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CourseCompletion[]
    side_effects: []
  - method: GET
    path: "/network/technicians/{id}/repair-orders"
    description: "List repair orders where this technician is the assigned lead (reverse lookup)"
    roles: [NetworkAdmin, NetworkAuditor, ShopManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RepairOrder[]
    side_effects: []
  - method: GET
    path: "/network/technicians/{id}/procedure-steps"
    description: "List procedure steps performed by this technician (reverse lookup)"
    roles: [NetworkAdmin, NetworkAuditor, ShopManager]
    code: 200
    input: ["step_type?", "limit?", "offset?"]
    output: ProcedureStep[]
    side_effects: []
  - method: GET
    path: "/network/referrals/{id}/repair-orders"
    description: "List repair orders created from this referral (reverse lookup)"
    roles: [NetworkAdmin, DealerRep, InsurerRep, ShopManager]
    code: 200
    input: ["limit?", "offset?"]
    output: RepairOrder[]
    side_effects: []
  - method: GET
    path: "/network/insurer-relations/{id}/repair-orders"
    description: "List repair orders billed under this insurer relation (reverse lookup)"
    roles: [NetworkAdmin, InsurerRep]
    code: 200
    input: ["limit?", "offset?"]
    output: RepairOrder[]
    side_effects: []

  # --- Repair orders ---
  - method: POST
    path: "/network/shops/{id}/repair-orders"
    description: "Create a repair order; OCC-guarded on shop version; requires shop CERTIFIED or PROBATION"
    roles: [ShopManager]
    code: 201
    input: [expected_shop_version, vin, vehicle_model_year, estimate_total_cents, assigned_technician_id, "is_structural?", "adas_equipped?", "referral_id?", "insurer_relation_id?"]
    output: RepairOrder
    side_effects: ["shop.lifetime_repair_count += 1", "increments Shop.version by 1"]
  - method: GET
    path: "/network/shops/{id}/repair-orders"
    description: "List a shop's repair orders"
    roles: [NetworkAdmin, NetworkAuditor, ShopManager, InsurerRep]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RepairOrder[]
    side_effects: []
  - method: GET
    path: "/network/repair-orders/{id}"
    description: "Fetch one repair order"
    roles: [NetworkAdmin, NetworkAuditor, ShopManager, InsurerRep]
    code: 200
    input: []
    output: RepairOrder
    side_effects: []
  - method: POST
    path: "/network/repair-orders/{id}/approve"
    description: "Approve an estimate; requires a completed PRE_SCAN step and role/capability checks"
    roles: [ShopManager]
    code: 200
    input: []
    output: RepairOrder
    side_effects: []
  - method: POST
    path: "/network/repair-orders/{id}/start-repair"
    description: "Begin physical repair; requires at least one ACTIVE part line"
    roles: [ShopManager]
    code: 200
    input: []
    output: RepairOrder
    side_effects: []
  - method: POST
    path: "/network/repair-orders/{id}/submit-qc"
    description: "Submit to QC from IN_REPAIR or REWORK"
    roles: [ShopManager]
    code: 200
    input: []
    output: RepairOrder
    side_effects: []
  - method: POST
    path: "/network/repair-orders/{id}/fail-qc"
    description: "Fail QC into REWORK; bounded by MAX_REWORK (3)"
    roles: [ShopManager]
    code: 200
    input: []
    output: RepairOrder
    side_effects: ["rework_count += 1"]
  - method: POST
    path: "/network/repair-orders/{id}/pass-qc"
    description: "Pass QC; routes via CALIBRATION for ADAS vehicles; enforces scan/calibration chronology"
    roles: [ShopManager]
    code: 200
    input: []
    output: RepairOrder
    side_effects: ["completed_at set on COMPLETE"]
  - method: POST
    path: "/network/repair-orders/{id}/void"
    description: "Void an order in ESTIMATE or APPROVED (latter only before structural work starts)"
    roles: [ShopManager]
    code: 200
    input: ["reason?"]
    output: RepairOrder
    side_effects: []

  # --- Procedure steps ---
  - method: POST
    path: "/network/repair-orders/{id}/procedure-steps"
    description: "Record a procedure step; re-performing a step_type voids the older RECORDED row of the same type"
    roles: [ShopManager]
    code: 201
    input: [step_type, performed_by_technician_id, performed_at, result, "scan_report_uri?"]
    output: ProcedureStep
    side_effects: ["older same-type RECORDED step -> VOIDED", "sequence_index assigned by performed_at ASC then created_at ASC"]
  - method: GET
    path: "/network/repair-orders/{id}/procedure-steps"
    description: "List steps of a repair order"
    roles: [NetworkAdmin, NetworkAuditor, ShopManager, InsurerRep]
    code: 200
    input: ["step_type?", "status?", "limit?", "offset?"]
    output: ProcedureStep[]
    side_effects: []

  # --- Part line items ---
  - method: POST
    path: "/network/repair-orders/{id}/part-lines"
    description: "Add a part line; safety-critical and documentation rules enforced; ratios recomputed"
    roles: [ShopManager]
    code: 201
    input: [part_number, part_class, unit_cost_cents, quantity, "is_safety_critical?", "alternative_justification?"]
    output: PartLineItem
    side_effects: ["oe_parts_ratio variants recomputed"]
  - method: GET
    path: "/network/repair-orders/{id}/part-lines"
    description: "List part lines of a repair order"
    roles: [NetworkAdmin, NetworkAuditor, ShopManager, InsurerRep]
    code: 200
    input: ["line_status?", "limit?", "offset?"]
    output: PartLineItem[]
    side_effects: []
  - method: DELETE
    path: "/network/repair-orders/{id}/part-lines/{id}"
    description: "Remove a part line while the order is editable"
    roles: [ShopManager]
    code: 200
    input: []
    output: PartLineItem
    side_effects: ["line_status -> REMOVED", "oe_parts_ratio variants recomputed"]

  # --- Warranty claims ---
  - method: POST
    path: "/network/repair-orders/{id}/warranty-claims"
    description: "File a warranty claim against a completed certified repair within the warranty window"
    roles: [ShopManager, NetworkAdmin]
    code: 201
    input: [claimant_contact, defect_category, claim_amount_cents]
    output: WarrantyClaim
    side_effects: ["filed_at stamped", "filed_by_role recorded"]
  - method: GET
    path: "/network/repair-orders/{id}/warranty-claims"
    description: "List claims of a repair order"
    roles: [NetworkAdmin, NetworkAuditor, ShopManager, InsurerRep]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []
  - method: GET
    path: "/network/warranty-claims/{id}"
    description: "Fetch one claim"
    roles: [NetworkAdmin, NetworkAuditor, ShopManager]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []
  - method: POST
    path: "/network/warranty-claims/{id}/review"
    description: "Move a claim to UNDER_REVIEW; reviewer must differ from filer"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []
  - method: POST
    path: "/network/warranty-claims/{id}/escalate"
    description: "Escalate a defect to the OEM; required for PART_DEFECT or claims over ESCALATION_THRESHOLD_CENTS"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["escalation affects next audit grade via certification_grade_from_findings"]
  - method: POST
    path: "/network/warranty-claims/{id}/resolve"
    description: "Resolve a claim ACCEPTED or DENIED; ACCEPTED decrements the shop reserve (floor 0, capped at the order's remaining accrual)"
    roles: [NetworkAdmin]
    code: 200
    input: [verdict]
    output: WarrantyClaim
    side_effects: ["ACCEPTED: shop.warranty_reserve_cents decremented"]

  # --- Insurer relations ---
  - method: POST
    path: "/network/shops/{id}/insurer-relations"
    description: "Establish a DRP relationship between a shop and an insurer"
    roles: [NetworkAdmin]
    code: 201
    input: [insurer_code, discount_pct_bps]
    output: InsurerRelation
    side_effects: ["steering_enabled initialized from shop posture"]
  - method: GET
    path: "/network/shops/{id}/insurer-relations"
    description: "List a shop's insurer relations"
    roles: [NetworkAdmin, NetworkAuditor, ShopManager, InsurerRep]
    code: 200
    input: ["status?", "insurer_code?", "limit?", "offset?"]
    output: InsurerRelation[]
    side_effects: []
  - method: GET
    path: "/network/insurer-relations/{id}"
    description: "Fetch one insurer relation"
    roles: [NetworkAdmin, InsurerRep]
    code: 200
    input: []
    output: InsurerRelation
    side_effects: []
  - method: POST
    path: "/network/insurer-relations/{id}/suspend"
    description: "Suspend a relation; steering off"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: InsurerRelation
    side_effects: ["steering_enabled := false"]
  - method: POST
    path: "/network/insurer-relations/{id}/reinstate"
    description: "Reinstate a suspended relation when the shop posture allows steering"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: InsurerRelation
    side_effects: ["steering_enabled recomputed"]
  - method: POST
    path: "/network/insurer-relations/{id}/terminate"
    description: "Terminate a relation"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: InsurerRelation
    side_effects: ["steering_enabled := false"]

  # --- Referrals & locator ---
  - method: POST
    path: "/network/referrals"
    description: "Create a referral; auto-routes via referral_ranking when the candidate pool is non-empty, else stays UNROUTED"
    roles: [DealerRep, InsurerRep, NetworkAdmin]
    code: 201
    input: [consumer_zip, source_type, source_reference, vin, "insurer_code?"]
    output: Referral
    side_effects: ["auto-route per referral_ranking; chosen shop.pending_referral_count += 1"]
  - method: GET
    path: "/network/referrals/{id}"
    description: "Fetch one referral"
    roles: [NetworkAdmin, DealerRep, InsurerRep, ShopManager]
    code: 200
    input: []
    output: Referral
    side_effects: []
  - method: GET
    path: "/network/referrals"
    description: "Filtered list of referrals; routed_shop_id? finds referrals pointing at a shop"
    roles: [NetworkAdmin, DealerRep, InsurerRep, ShopManager]
    code: 200
    input: ["routed_shop_id?", "status?", "source_type?", "insurer_code?", "limit?", "offset?"]
    output: Referral[]
    side_effects: []
  - method: POST
    path: "/network/referrals/{id}/route"
    description: "Explicitly (re)run the routing selector for an UNROUTED referral"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: Referral
    side_effects: ["chosen shop.pending_referral_count += 1"]
  - method: POST
    path: "/network/referrals/{id}/accept"
    description: "Routed shop accepts the referral within the TTL"
    roles: [ShopManager]
    code: 200
    input: []
    output: Referral
    side_effects: ["shop.pending_referral_count -= 1"]
  - method: POST
    path: "/network/referrals/{id}/decline"
    description: "Routed shop declines the referral"
    roles: [ShopManager]
    code: 200
    input: []
    output: Referral
    side_effects: ["shop.pending_referral_count -= 1"]
  - method: POST
    path: "/network/locator/search"
    description: "Consumer-facing locator: list visible (non-hidden) certified/probation shops within radius, ranked by referral_ranking score; anonymous, no auth"
    roles: [Anonymous]
    code: 200
    input: [zip_code, "radius_miles?", "limit?", "offset?"]
    output: Shop[]
    side_effects: []

  # --- Test-driving endpoints (per §1.5 priority ladder rung 3) ---
  - method: POST
    path: "/network/_clock/set_current_utc"
    description: "Set the logical clock. Startup default is 2026-09-01T00:00:00Z; the logical clock MUST NOT fall back to wall-clock time. Advancing the clock triggers the sweep: course-completion expiries, referral TTL expiry, corrective-action overdue transitions, cycle window expiry, and WARRANTY_ACTIVE/CLOSED transitions."
    roles: [NetworkAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, swept_counts: object }"
    side_effects: ["time-gated sweeps per §1.2 transitions marked 'clock sweep'"]
  - method: POST
    path: "/network/_sweep/run"
    description: "Re-run all time-gated sweeps at the current logical clock without advancing it"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: "{ swept_counts: object }"
    side_effects: ["same sweep set as clock advance"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role not permitted for this endpoint per §1.5 roles"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path or body reference does not resolve, or nested child does not belong to path parent"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed payload, enum/type/format violation"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Entity not in a legal source state for the requested transition"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the parent's current version (OCC)"
  - id: ERR_SAFETY_PART_CLASS
    http: 422
    condition: "Safety-critical part classified as AFTERMARKET/RECYCLED/REMANUFACTURED"
  - id: ERR_ALT_PART_UNDOCUMENTED
    http: 422
    condition: "Non-OE part line without alternative_justification"
  - id: ERR_PRE_SCAN_REQUIRED
    http: 422
    condition: "Repair order approve attempted without a recorded PRE_SCAN step"
  - id: ERR_POST_SCAN_REQUIRED
    http: 422
    condition: "QC pass attempted without a passing POST_SCAN later than all active part lines"
  - id: ERR_CALIBRATION_SEQUENCE
    http: 422
    condition: "ADAS calibration missing or performed before the last POST_SCAN"
  - id: ERR_STRUCTURAL_CAPABILITY
    http: 422
    condition: "Structural repair without shop structural capability or without a CURRENT STRUCTURAL technician"
  - id: ERR_SHOP_NOT_CERTIFIED
    http: 422
    condition: "Shop posture forbids the operation (SUSPENDED/EXPIRED/DECERTIFIED)"
  - id: ERR_SELF_VERIFICATION
    http: 422
    condition: "Same user attempts to verify/review their own issuance/filing (segregation of duties)"
  - id: ERR_CYCLE_WINDOW
    http: 422
    condition: "Cycle window is not exactly 365 days or not zero-gap adjacent to the previous cycle"
  - id: ERR_AUDIT_OVERLAP
    http: 409
    condition: "Audit window intersects another SCHEDULED/IN_PROGRESS audit of the same shop"
  - id: ERR_AUDIT_WINDOW_MISSED
    http: 422
    condition: "Audit begin outside [scheduled_start, scheduled_end)"
  - id: ERR_WARRANTY_EXPIRED
    http: 422
    condition: "Claim filed after warranty window or on an order not in WARRANTY_ACTIVE"
  - id: ERR_REFERRAL_EXPIRED
    http: 422
    condition: "Referral accept after TTL or against a shop no longer CERTIFIED/PROBATION"
  - id: ERR_CORRECTIVE_OVERDUE
    http: 422
    condition: "Corrective action submitted after due_at"
  - id: ERR_DECERTIFY_BLOCKED
    http: 422
    condition: "Decertify attempted before 90 days of SUSPENDED or with open repair orders"
  - id: ERR_EFFECTIVE_IN_PAST
    http: 422
    condition: "Requirement publish/revision with effective_from in the past"
  - id: ERR_RESERVE_FLOOR
    http: 422
    condition: "Warranty acceptance would drive the shop reserve below zero or exceed the order's remaining accrual"
  - id: ERR_MAX_REWORK
    http: 422
    condition: "fail-qc beyond MAX_REWORK (3) loops"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated consumer hitting the public locator"
    identity: opaque
    exclusive_operations:
      - "POST /network/locator/search"
    shared_operations: []
  - name: NetworkAdmin
    description: "OEM network administrator: manages requirements, cycles, insurer relations, warranty review; cannot audit"
    identity: opaque
    exclusive_operations:
      - "POST /network/shops"
      - "POST /network/shops/{id}/decertify"
      - "POST /network/shops/{id}/certification-cycles"
      - "POST /network/requirements and publish/publish-revision/retire"
      - "POST /network/training-courses"
      - "warranty review/escalate/resolve"
      - "insurer-relation create/suspend/reinstate/terminate"
      - "POST /network/_clock/set_current_utc and /network/_sweep/run"
    shared_operations:
      - "read endpoints across the network"
      - "POST /network/referrals"
      - "POST /network/technicians/{id}/course-completions"
  - name: NetworkAuditor
    description: "Field auditor: schedules and runs audits, issues findings, verifies corrective actions; cannot administer requirements or warranty claims"
    identity: opaque
    exclusive_operations:
      - "audit schedule/begin/cancel/issue-findings"
      - "POST /network/corrective-actions/{id}/verify"
      - "POST /network/certification-cycles/{id}/close"
    shared_operations:
      - "read endpoints across the network"
  - name: ShopManager
    description: "Manager of a certified shop: attestations, technicians, repair orders, steps, parts, referral accept/decline"
    identity: "entity_backed:Shop"
    exclusive_operations:
      - "POST /network/shops/{id}/attestations"
      - "repair order lifecycle actions"
      - "procedure-step and part-line writes"
      - "POST /network/corrective-actions/{id}/submit"
      - "referral accept/decline"
    shared_operations:
      - "read endpoints for own shop and network reference data"
      - "POST /network/repair-orders/{id}/warranty-claims"
  - name: DealerRep
    description: "Dealer representative originating referrals"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /network/referrals"
      - "read referrals and shops"
  - name: InsurerRep
    description: "Insurer representative originating referrals and viewing DRP repair data"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /network/referrals"
      - "read referrals, shops, repair orders, part lines, claims"
