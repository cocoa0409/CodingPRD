              as: SchoolAdmin
              captures: { lo: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-04T16:00:00.000Z" }
              as: SchoolAdmin
            - call: "POST /lessons/${lo}/complete"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { sv3: $.data.version }
            - call: "POST /lessons"
              payload: { student_id: "${stu_id}", enrollment_id: "${enr_id}", lesson_type: "ROAD", start_at: "2026-06-05T08:00:00.000Z", end_at: "2026-06-05T14:00:00.000Z", instructor_id: "${inst_id}", vehicle_id: "${veh_id}", expected_student_version: "${sv3}" }
              as: SchoolAdmin
              captures: { lr: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T14:00:00.000Z" }
              as: SchoolAdmin
            - call: "POST /lessons/${lr}/complete"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /students/${stu_id}/certificate"
              payload: { enrollment_id: "${enr_id}" }
              as: SchoolAdmin
              captures: { cert_id: $.data.id }
