          rationale: "That §1.8 instance feeds byte-identical reported data through both variants after a mid-period reclassification and asserts the two integers differ."

      - name: funding_ratio_propagates_from_statements_into_the_plan_and_its_programs
        claim_type: constraint_propagation
        grounds:
          - calculations.work_plan_compliance.funding_ratio
          - state_machines.AnnualWorkPlan.APPROVED_to_AMENDMENT_PENDING
        excluded_because:
          difficulty_instance: transitive_cascade / granted_dispute_cascades_through_funding_ratio_into_a_frozen_program
          rationale: "That §1.8 instance drives the propagation end to end — a granted adjustment lowers the forecast, the ratio falls under 0.9000, the plan moves to AMENDMENT_PENDING and the program freezes."

  # ===========================================================================
  # SECTION 4 — Validations (claim-extraction-guide Table 4)
  # The three priority_conflict corners are the subject of a whole §1.8 rule and
  # are emitted as stubs; everything else here is a real instance.
  # ===========================================================================
  - section: validations
    instances:

      - name: a_second_signature_from_the_same_business_is_refused_as_a_duplicate
        claim_type: violation_to_error
        grounds:
          - validations.p80_one_valid_signature_per_drive_and_business
          - errors[ERR_DUPLICATE_SIGNATURE]
          - calculations.petition_support
        distinguishing_aspect: |
          The uniqueness rule is scoped to VALID signatures of one (petition_drive_id,
          lodging_business_id) pair, and the refusal must leave the drive's tallies untouched — no
          second 60,000,000 is added to signed_basis_cents and weighted_support_pct stays 0.6000
          rather than climbing to 1.2000.
        test_recipe:
          setup:
            - "canonical district PROPOSED with the four-property roll"
            - "FORMATION drive OPEN in [2026-08-01, 2026-09-01), b1 has signed once"
          setup_api_calls:
            - *c_clock_form
            - *c_district
            - *c_b1
            - *c_b2
            - *c_b3
            - *c_b4
            - *c_drive
            - *c_sign_b1
          trigger:
            - call: "POST /petition-drives/${pd_id}/signatures"
              payload: { lodging_business_id: "${b1_id}" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
          assert:
            - "the response status is 409 with data.error_id == ERR_DUPLICATE_SIGNATURE"
            - "PetitionDrive.${pd_id}.valid_signature_count == 1"
            - "PetitionDrive.${pd_id}.signed_basis_cents == 60000000"
            - "PetitionDrive.${pd_id}.weighted_support_pct == 0.6000"
            - "GET /petition-drives/${pd_id}/signatures returns exactly one row"

      - name: a_withdrawn_signature_does_not_block_a_fresh_signature_from_the_same_business
        claim_type: satisfaction_to_pass
        grounds:
          - validations.p80_one_valid_signature_per_drive_and_business
          - state_machines.PetitionSignature.VALID_to_WITHDRAWN
          - calculations.petition_support.input_set
        excluded_because:
          difficulty_instance: compensating_invariant / signature_withdrawal_restores_petition_support_to_its_prior_value
          rationale: "That §1.8 instance already withdraws b1's signature, checks the drive's tallies fall back to 0.0000, then re-signs the same business and asserts the 201 plus the restored 0.6000 precisely because the uniqueness predicate counts only VALID rows; a §1.9 duplicate of the same walk would add no new coverage."

      - name: a_withdrawn_dispute_frees_its_type_slot_while_the_other_type_was_never_blocked
        claim_type: satisfaction_to_pass
        grounds:
          - validations.p80_one_non_terminal_dispute_per_statement_and_type
          - errors[ERR_DISPUTE_ALREADY_OPEN]
          - state_machines.AssessmentDispute.SUBMITTED_to_WITHDRAWN
          - endpoints.POST_/assessment-disputes
        distinguishing_aspect: |
          The uniqueness predicate is keyed on (assessment_statement_id, dispute_type) and counts only
          non-terminal rows, so one statement carries two independent slots. The walk proves both halves
          of the predicate on the same statement: a second CALCULATION_ERROR dispute is refused while the
          first is SUBMITTED, an EXEMPT_PROPERTY dispute on the very same statement is accepted at the
          same moment, and once the first dispute is WITHDRAWN — a terminal state — the previously
          refused CALCULATION_ERROR request succeeds unchanged. Every accepted dispute is a fresh row
          with version 1 and a lodging_business_id copied from the statement rather than from the payload.
        test_recipe:
          setup:
            - "district ACTIVE, st1 filed at 824,500"
            - "one CALCULATION_ERROR dispute on st1 sitting in SUBMITTED (review deliberately not opened, so WITHDRAW stays legal)"
          setup_api_calls:
            - *c_clock_form
            - *c_district
            - *c_b1
            - *c_b2
            - *c_b3
            - *c_b4
            - *c_drive
            - *c_sign_b1
            - *c_tally
            - *c_certify
            - *c_activate
            - *c_period_q1
            - *c_generate_q1
            - *c_find_st1
            - *c_file_st1
            - *c_dispute_st1
          trigger:
            - call: "POST /assessment-disputes"
              payload: { assessment_statement_id: "${st1_id}", dispute_type: "CALCULATION_ERROR", claimed_adjustment_cents: 50000, dispute_note: "same ground filed twice" }
              as: LodgingOperator
              as_user_id: "${b1_id}"
            - call: "POST /assessment-disputes"
              payload: { assessment_statement_id: "${st1_id}", dispute_type: "EXEMPT_PROPERTY", claimed_adjustment_cents: 824500, dispute_note: "the annex wing is a nonprofit retreat" }
              as: LodgingOperator
              as_user_id: "${b1_id}"
              captures: { dsp_exempt_id: "$.data.id" }
            - call: "POST /assessment-disputes/${dsp1_id}/proceedings"
              payload: { action: "WITHDRAW", note: "operator will refile with the corrected ledger" }
              as: LodgingOperator
              as_user_id: "${b1_id}"
            - call: "POST /assessment-disputes"
              payload: { assessment_statement_id: "${st1_id}", dispute_type: "CALCULATION_ERROR", claimed_adjustment_cents: 50000, dispute_note: "refiled on the corrected ledger" }
              as: LodgingOperator
              as_user_id: "${b1_id}"
              captures: { dsp1_again_id: "$.data.id" }
          assert:
            - "the second CALCULATION_ERROR filing returns 409 with data.error_id == ERR_DISPUTE_ALREADY_OPEN"
            - "the EXEMPT_PROPERTY filing returns 201 even though a CALCULATION_ERROR dispute is open on the same statement, because the slot key includes dispute_type"
            - "AssessmentDispute.${dsp_exempt_id}.status == SUBMITTED with version == 1 and lodging_business_id == ${b1_id} and claimed_adjustment_cents == 824500"
            - "the withdrawal returns 200 and AssessmentDispute.${dsp1_id}.status == WITHDRAWN"
            - "the refiled CALCULATION_ERROR dispute returns 201 and ${dsp1_again_id} != ${dsp1_id}"
            - "AssessmentDispute.${dsp1_again_id}.status == SUBMITTED with version == 1, appeal_count == 0 and info_request_count == 0"
            - "GET /assessment-disputes?dispute_type=CALCULATION_ERROR returns both the WITHDRAWN ${dsp1_id} and the SUBMITTED ${dsp1_again_id}, so the withdrawn row was retained rather than deleted"
            - "AssessmentStatement.${st1_id}.effective_assessment_cents is still 824500 and AssessmentStatement.${st1_id}.payment_status is still UNPAID, because filing or withdrawing a dispute never touches the money"

      - name: statement_filing_priority_ladder_returns_401_403_403_400_then_404
        claim_type: priority_ordering
        grounds:
          - validations.p10_authentication
          - validations.p20_role_authorisation
          - validations.p25_operator_identity_resolves
          - validations.p30_input_shape
          - validations.p40_existence
        distinguishing_aspect: |
          One endpoint is hit five times with a request that is simultaneously unauthenticated, wrongly
          roled, backed by an unresolvable operator identity, missing a required field and pointed at a
          statement id that does not exist. Each call removes exactly one defect, so the observed error
          walks the priority ladder 401 -> 403 ERR_FORBIDDEN_ROLE -> 403 ERR_OPERATOR_IDENTITY_UNKNOWN
          -> 400 -> 404; an implementation that validates the body first would answer 400 to all five.
        test_recipe:
          setup:
            - "canonical district ACTIVE with period FY2027-Q1 generated, st1 belongs to b1"
          setup_api_calls:
            - *c_clock_form
            - *c_district
            - *c_b1
            - *c_b2
            - *c_b3
            - *c_b4
            - *c_drive
            - *c_sign_b1
            - *c_tally
            - *c_certify
            - *c_activate
            - *c_period_q1
            - *c_generate_q1
            - *c_find_st1
          trigger:
            - call: "POST /assessment-statements/00000000-0000-0000-0000-0000000000ff/filings"
              payload: { reported_room_nights: 2000 }
              as: "NONE — the X-User-Role and X-User-ID headers are both omitted"
              as_user_id: "NONE"
            - call: "POST /assessment-statements/00000000-0000-0000-0000-0000000000ff/filings"
              payload: { reported_room_nights: 2000 }
              as: BoardMember
              as_user_id: "board-member-01"
            - call: "POST /assessment-statements/00000000-0000-0000-0000-0000000000ff/filings"
              payload: { reported_room_nights: 2000 }
              as: LodgingOperator
              as_user_id: "00000000-0000-0000-0000-0000000000aa"
            - call: "POST /assessment-statements/00000000-0000-0000-0000-0000000000ff/filings"
              payload: { reported_room_nights: 2000 }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "POST /assessment-statements/00000000-0000-0000-0000-0000000000ff/filings"
              payload: { reported_room_nights: 2000, reported_gross_room_revenue_cents: 41225000 }
              as: DistrictAdministrator
              as_user_id: "admin-01"
          assert:
            - "call 1 returns 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "call 2 returns 403 with data.error_id == ERR_FORBIDDEN_ROLE, because BoardMember is not in this endpoint's roles"
            - "call 3 returns 403 with data.error_id == ERR_OPERATOR_IDENTITY_UNKNOWN, decided before the missing field and before the path id"
            - "call 4 returns 400 with data.error_id == ERR_INVALID_REQUEST for the missing reported_gross_room_revenue_cents"
            - "call 5 returns 404 with data.error_id == ERR_ASSESSMENT_STATEMENT_NOT_FOUND"
            - "AssessmentStatement.${st1_id}.filing_status is still NOT_FILED, since none of the five calls touched a real statement"

      - name: a_program_cannot_be_funded_by_a_plan_still_in_board_review
        claim_type: cross_entity_validation
        grounds:
          - validations.p60_program_requires_approved_plan
          - errors[ERR_WORK_PLAN_NOT_APPROVED]
          - state_machines.AnnualWorkPlan.BOARD_REVIEW_to_APPROVED
        distinguishing_aspect: |
          The refusal is decided entirely on a different aggregate: the program request is perfectly
          well formed and the district is ACTIVE, and only the plan's BOARD_REVIEW status blocks it.
          The identical request is accepted once a second board member approves the plan, which proves
          the check reads the plan row rather than anything on the program payload.
        test_recipe:
          setup:
            - "canonical district ACTIVE, st1 and st2 filed so the plan can clear the funding ratio"
            - "plan FY2027 sponsored, standing in BOARD_REVIEW"
          setup_api_calls:
            - *c_clock_form
            - *c_district
            - *c_b1
            - *c_b2
            - *c_b3
            - *c_b4
            - *c_drive
            - *c_sign_b1
            - *c_tally
            - *c_certify
            - *c_activate
            - *c_period_q1
            - *c_generate_q1
            - *c_find_st1
            - *c_file_st1
            - *c_find_st2
            - *c_file_st2
            - *c_plan_fy2027
            - *c_sponsor
          trigger:
            - call: "POST /marketing-programs"
              payload: { annual_work_plan_id: "${wp_id}", name: "Autumn Group Sales Push", channel: "GROUP_SALES", committed_cents: 62000, lodging_tax_matched_cents: 0, booking_window_start: "2026-09-01T00:00:00Z", booking_window_end: "2026-12-01T00:00:00Z" }
              as: DmoLiaison
              as_user_id: "dmo-01"
            - *c_approve
            - *c_program
          assert:
            - "the first program creation returns 409 with data.error_id == ERR_WORK_PLAN_NOT_APPROVED"
            - "AnnualWorkPlan.${wp_id}.committed_program_cents == 0 after the refusal"
            - "GET /annual-work-plans/${wp_id}/marketing-programs returns 0 rows after the refusal"
            - "the approval returns 200 and AnnualWorkPlan.${wp_id}.status == APPROVED with funding_ratio 1.1645"
            - "the identical program creation then returns 201 with MarketingProgram.${mp_id}.status == PLANNED"
            - "AnnualWorkPlan.${wp_id}.committed_program_cents == 62000"

      - name: notice_exactly_fourteen_days_ahead_is_accepted_and_thirteen_is_not
        claim_type: temporal_validation
        grounds:
          - validations.p75_minimum_public_notice
          - errors[ERR_MEETING_NOTICE_TOO_LATE]
          - state_machines.TransparencyRecord.SCHEDULED_to_NOTICED
        distinguishing_aspect: |
          Both sides of the 14-whole-day notice boundary are walked from a single pinned clock: with the
          clock at 2026-08-01 a record scheduled for 2026-08-15 is exactly 14 days out and must be
          noticeable, while one scheduled for 2026-08-14 is 13 days out and must be refused. Only one
          of the two records is a PUBLIC_MEETING, so the unrelated 10-day meeting separation rule
          cannot interfere with the result.
        test_recipe:
          setup:
            - "canonical district ACTIVE, logical clock 2026-08-01T00:00:00Z"
            - "an ANNUAL_REPORT record scheduled_for 2026-08-15 and a PUBLIC_MEETING record scheduled_for 2026-08-14"
          setup_api_calls:
            - *c_clock_form
            - *c_district
            - *c_b1
            - *c_b2
            - *c_b3
            - *c_b4
            - *c_drive
            - *c_sign_b1
            - *c_tally
            - *c_certify
            - *c_activate
            - &c_rec_report
              call: "POST /transparency-records"
              payload: { district_id: "${d_id}", record_type: "ANNUAL_REPORT", fiscal_year: 2027, scheduled_for: "2026-08-15T00:00:00Z", required_by: "2026-09-30T00:00:00Z" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { rec_report_id: "$.data.id" }
            - &c_rec_meeting
              call: "POST /transparency-records"
              payload: { district_id: "${d_id}", record_type: "PUBLIC_MEETING", fiscal_year: 2027, scheduled_for: "2026-08-14T00:00:00Z", required_by: "2026-09-30T00:00:00Z" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { rec_meeting_id: "$.data.id" }
          trigger:
            - call: "POST /transparency-records/${rec_meeting_id}/advance"
              payload: { to_status: "NOTICED" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "POST /transparency-records/${rec_report_id}/advance"
              payload: { to_status: "NOTICED" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
          assert:
            - "the 13-day notice returns 409 with data.error_id == ERR_MEETING_NOTICE_TOO_LATE"
            - "TransparencyRecord.${rec_meeting_id}.status is still SCHEDULED and noticed_on == null"
            - "the 14-day notice returns 200 with TransparencyRecord.${rec_report_id}.status == NOTICED"
            - "TransparencyRecord.${rec_report_id}.noticed_on == 2026-08-01T00:00:00Z"
            - "District.${d_id}.transparency_standing == COMPLIANT throughout"

      - name: committed_program_spend_may_equal_but_not_exceed_the_marketing_line
        claim_type: aggregate_validation
        grounds:
          - validations.p90_program_budget_within_marketing_line
          - errors[ERR_PROGRAM_BUDGET_EXCEEDED]
          - entities.AnnualWorkPlan.fields.committed_program_cents
        distinguishing_aspect: |
          The ceiling is an aggregate over sibling rows rather than a per-row limit: two programs of
          400000 and 250000 are both accepted because their sum is exactly the 650000
          SALES_AND_MARKETING line, and a third program of a single cent is then refused. Neither
          accepted program is individually near the ceiling, so a per-request check would have let the
          third through.
        test_recipe:
          setup:
            - "canonical district ACTIVE with st1 and st2 filed, plan FY2027 APPROVED with SALES_AND_MARKETING 650000"
          setup_api_calls:
            - *c_clock_form
            - *c_district
            - *c_b1
            - *c_b2
            - *c_b3
            - *c_b4
            - *c_drive
            - *c_sign_b1
            - *c_tally
            - *c_certify
            - *c_activate
            - *c_period_q1
            - *c_generate_q1
            - *c_find_st1
            - *c_file_st1
            - *c_find_st2
            - *c_file_st2
            - *c_plan_fy2027
            - *c_sponsor
            - *c_approve
          trigger:
            - call: "POST /marketing-programs"
              payload: { annual_work_plan_id: "${wp_id}", name: "Shoulder Season Digital", channel: "PAID_SEARCH", committed_cents: 400000, booking_window_start: "2026-09-01T00:00:00Z", booking_window_end: "2026-12-01T00:00:00Z" }
              as: DmoLiaison
              as_user_id: "dmo-01"
              captures: { mp_big_id: "$.data.id" }
            - call: "POST /marketing-programs"
              payload: { annual_work_plan_id: "${wp_id}", name: "Meeting Planner Fam Trips", channel: "GROUP_SALES", committed_cents: 250000, booking_window_start: "2026-09-01T00:00:00Z", booking_window_end: "2026-12-01T00:00:00Z" }
              as: DmoLiaison
              as_user_id: "dmo-01"
              captures: { mp_fill_id: "$.data.id" }
            - call: "POST /marketing-programs"
              payload: { annual_work_plan_id: "${wp_id}", name: "One Cent Too Far", channel: "TRADE_SHOW", committed_cents: 1, booking_window_start: "2026-09-01T00:00:00Z", booking_window_end: "2026-12-01T00:00:00Z" }
              as: DmoLiaison
              as_user_id: "dmo-01"
          assert:
            - "the 400000 program returns 201 and AnnualWorkPlan.${wp_id}.committed_program_cents == 400000"
            - "the 250000 program returns 201 and AnnualWorkPlan.${wp_id}.committed_program_cents == 650000, exactly the marketing line"
            - "the 1-cent program returns 409 with data.error_id == ERR_PROGRAM_BUDGET_EXCEEDED"
            - "AnnualWorkPlan.${wp_id}.committed_program_cents is still 650000 after the refusal"
            - "GET /annual-work-plans/${wp_id}/marketing-programs returns exactly 2 rows"

      - name: capital_improvement_is_permitted_on_a_pct_district_and_refused_on_a_tiered_one
        claim_type: conditional_validation
        grounds:
          - validations.p85_expenditure_categories_permitted
          - errors[ERR_EXPENDITURE_CATEGORY_NOT_PERMITTED]
          - calculations.work_plan_compliance.category_caps
        distinguishing_aspect: |
          Two plans carrying byte-identical expenditure_lines are approved against two districts that
          differ only in assessment_method: the PCT_OF_ROOM_REVENUE district accepts the
          CAPITAL_IMPROVEMENT line and reports capital_improvement_cents 200000, while the
          TIERED_BY_CLASSIFICATION district refuses the same line. Both plans satisfy every cap, so the
          conditional category rule is the only thing separating the two outcomes.
        test_recipe:
          setup:
            - "canonical PCT district ACTIVE with st1 and st2 filed, so its plan clears the 0.9000 funding ratio"
            - "Summit Ridge district ACTIVE on TIERED_BY_CLASSIFICATION"
            - "each district holds a DRAFT FY2027 plan with lines SALES_AND_MARKETING 700000, ADMINISTRATION 100000, CAPITAL_IMPROVEMENT 200000, sponsored by board-member-01"
          setup_api_calls:
            - *c_clock_form
            - *c_district
            - *c_b1
            - *c_b2
            - *c_b3
            - *c_b4
            - *c_drive
            - *c_sign_b1
            - *c_tally
            - *c_certify
            - *c_activate
            - *c_period_q1
            - *c_generate_q1
            - *c_find_st1
            - *c_file_st1
            - *c_find_st2
            - *c_file_st2
            - *c3_district
            - *c3_b1
            - *c3_b2
            - *c3_b3
            - *c3_drive
            - *c3_sign
            - *c3_tally
            - *c3_certify
            - *c3_activate
            - call: "POST /annual-work-plans"
              payload: { district_id: "${d_id}", fiscal_year: 2027, expenditure_lines: [{ category: "SALES_AND_MARKETING", amount_cents: 700000, narrative: "paid search and group sales" }, { category: "ADMINISTRATION", amount_cents: 100000, narrative: "district staff" }, { category: "CAPITAL_IMPROVEMENT", amount_cents: 200000, narrative: "wayfinding signage" }] }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { wp_ci_id: "$.data.id" }
            - call: "POST /annual-work-plans"
              payload: { district_id: "${d3_id}", fiscal_year: 2027, expenditure_lines: [{ category: "SALES_AND_MARKETING", amount_cents: 700000, narrative: "paid search and group sales" }, { category: "ADMINISTRATION", amount_cents: 100000, narrative: "district staff" }, { category: "CAPITAL_IMPROVEMENT", amount_cents: 200000, narrative: "wayfinding signage" }] }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { wp3_ci_id: "$.data.id" }
            - call: "POST /annual-work-plans/${wp_ci_id}/board-actions"
              payload: { action: "SPONSOR", note: "sponsored for the fiscal 2027 board cycle" }
              as: BoardMember
              as_user_id: "board-member-01"
            - call: "POST /annual-work-plans/${wp3_ci_id}/board-actions"
              payload: { action: "SPONSOR", note: "sponsored for the fiscal 2027 board cycle" }
              as: BoardMember
              as_user_id: "board-member-01"
          trigger:
            - call: "POST /annual-work-plans/${wp3_ci_id}/board-actions"
              payload: { action: "APPROVE", note: "approved at the Summit Ridge board meeting" }
              as: BoardMember
              as_user_id: "board-member-02"
            - call: "POST /annual-work-plans/${wp_ci_id}/board-actions"
              payload: { action: "APPROVE", note: "approved at the Harbor Bay board meeting" }
              as: BoardMember
              as_user_id: "board-member-02"
          assert:
            - "the TIERED_BY_CLASSIFICATION approval returns 409 with data.error_id == ERR_EXPENDITURE_CATEGORY_NOT_PERMITTED"
            - "AnnualWorkPlan.${wp3_ci_id}.status is still BOARD_REVIEW and approver_user_id == null"
            - "the PCT_OF_ROOM_REVENUE approval returns 200 with AnnualWorkPlan.${wp_ci_id}.status == APPROVED"
            - "AnnualWorkPlan.${wp_ci_id}.capital_improvement_cents == 200000 and total_budget_cents == 1000000"
            - "AnnualWorkPlan.${wp_ci_id}.administration_cents == 100000 is under the 150000 cap and sales_and_marketing_cents == 700000 is over the 600000 floor, so no cap decided either outcome"
            - "AnnualWorkPlan.${wp_ci_id}.funding_ratio == 1.1645"

      - name: operator_ownership_is_checked_after_existence_so_a_missing_statement_returns_404
        claim_type: cascading_validation
        grounds:
          - validations.p40_existence
          - validations.p50_operator_resource_ownership
          - errors[ERR_ASSESSMENT_STATEMENT_NOT_FOUND]
          - errors[ERR_NOT_RESOURCE_OWNER]
        distinguishing_aspect: |
          The ownership check cannot run until existence has resolved the row it would read, so b2
          aiming at an id that does not exist gets 404 rather than the 403 an ownership-first
          implementation would return, and the same operator aiming at b1's real statement then gets
          403. b2's own identity resolves in both calls, so p25 is satisfied and only the p40/p50 order
          is under test.
        test_recipe:
          setup:
            - "canonical district ACTIVE with period FY2027-Q1 generated; st1 belongs to b1 and b2 is a different assessable property"
          setup_api_calls:
            - *c_clock_form
            - *c_district
            - *c_b1
            - *c_b2
            - *c_b3
            - *c_b4
            - *c_drive
            - *c_sign_b1
            - *c_tally
            - *c_certify
            - *c_activate
            - *c_period_q1
            - *c_generate_q1
            - *c_find_st1
          trigger:
            - call: "POST /assessment-statements/00000000-0000-0000-0000-0000000000ff/filings"
              payload: { reported_room_nights: 600, reported_gross_room_revenue_cents: 20000000 }
              as: LodgingOperator
              as_user_id: "${b2_id}"
            - call: "POST /assessment-statements/${st1_id}/filings"
              payload: { reported_room_nights: 600, reported_gross_room_revenue_cents: 20000000 }
              as: LodgingOperator
              as_user_id: "${b2_id}"
          assert:
            - "the first call returns 404 with data.error_id == ERR_ASSESSMENT_STATEMENT_NOT_FOUND"
            - "the second call returns 403 with data.error_id == ERR_NOT_RESOURCE_OWNER"
            - "AssessmentStatement.${st1_id}.filing_status is still NOT_FILED and provisional_assessment_cents == 0"

      - name: certification_lockdown_outranks_the_closed_filing_window
        claim_type: priority_conflict
        grounds:
          - validations.p60_certified_statement_lockdown
          - validations.p75_filing_window_open
          - validations.p65_statement_occ
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / certified_statement_beats_closed_filing_window_with_occ_already_satisfied
          rationale: "That §1.8 instance fires all three checks in one amendment request and asserts ERR_STATEMENT_ALREADY_CERTIFIED wins over ERR_FILING_WINDOW_CLOSED with the OCC precondition already satisfied."

      - name: segregation_of_duties_outranks_the_administration_share_cap
        claim_type: priority_conflict
        grounds:
          - validations.p70_segregation_of_duties
          - validations.p85_administration_share_cap
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / segregation_of_duties_beats_administration_share_cap_on_plan_approval
          rationale: "That §1.8 instance approves a non-compliant plan as its own sponsor and asserts ERR_SEGREGATION_OF_DUTIES rather than ERR_ADMIN_SHARE_EXCEEDED, then flips only the identity to expose the cap."

      - name: the_closed_petition_window_outranks_an_ineligible_signer
        claim_type: priority_conflict
        grounds:
          - validations.p75_petition_window_open
          - validations.p80_signer_inside_boundary
          - validations.p80_signer_not_exempt
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / closed_petition_window_beats_outside_boundary_signer
          rationale: "That §1.8 instance sends one signature that is both out of window and out of boundary and asserts ERR_PETITION_WINDOW_CLOSED wins, then reopens the window to expose the boundary error."

  # ===========================================================================
  # SECTION 5 — Endpoints (claim-extraction-guide Table 5)
  # ===========================================================================
  - section: endpoints
    instances:

      - name: transparency_records_are_created_read_back_and_filtered_by_type_and_status
        claim_type: standard_crud
        grounds:
          - endpoints.POST_/transparency-records
          - endpoints.GET_/transparency-records/{id}
          - endpoints.GET_/districts/{id}/transparency-records
          - entities.TransparencyRecord.fields
        distinguishing_aspect: |
          The transparency aggregate is the one entity whose whole create-read-list surface is otherwise
          untouched: three records of three different record_type values are created on one district,
          each read back individually with every system field at its declared default, and the district
          collection is then filtered by record_type (1 of 3) and by status (3 of 3), which proves the
          two query parameters are applied independently rather than ignored.
        test_recipe:
          setup:
            - "canonical district ACTIVE, logical clock 2026-08-01T00:00:00Z"
          setup_api_calls:
            - *c_clock_form
            - *c_district
            - *c_b1
            - *c_b2
            - *c_b3
            - *c_b4
            - *c_drive
            - *c_sign_b1
            - *c_tally
            - *c_certify
            - *c_activate
          trigger:
            - *c_rec_report
            - *c_rec_meeting
            - &c_rec_audit
              call: "POST /transparency-records"
              payload: { district_id: "${d_id}", record_type: "FINANCIAL_AUDIT", fiscal_year: 2027, scheduled_for: "2026-09-15T00:00:00Z", required_by: "2026-10-31T00:00:00Z" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { rec_audit_id: "$.data.id" }
            - call: "GET /transparency-records/${rec_audit_id}"
              payload: {}
              as: PublicViewer
              as_user_id: "public-01"
            - call: "GET /districts/${d_id}/transparency-records"
              payload: { record_type: "PUBLIC_MEETING" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "GET /districts/${d_id}/transparency-records"
              payload: { status: "SCHEDULED" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
          assert:
            - "all three creations return 201 with status == SCHEDULED and version == 1"
            - "TransparencyRecord.${rec_audit_id}.engaged_by_user_id == admin-01, taken from X-User-ID rather than from the body"
            - "TransparencyRecord.${rec_audit_id}.noticed_on == null and completed_on == null and published_on == null and document_reference == null"
            - "the individual read returns 200 with fiscal_year 2027, scheduled_for 2026-09-15T00:00:00Z and required_by 2026-10-31T00:00:00Z"
            - "the record_type PUBLIC_MEETING listing returns exactly 1 row, whose id == ${rec_meeting_id}"
            - "the status SCHEDULED listing returns exactly 3 rows"
            - "District.${d_id}.transparency_standing == COMPLIANT, since nothing is OVERDUE yet"

      - name: a_short_formation_tally_fails_the_district_and_closes_every_later_door
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/petition-drives/{id}/tally
          - state_machines.PetitionDrive.OPEN_to_SHORT_OF_THRESHOLD
          - state_machines.District.PETITION_CIRCULATING_to_FORMATION_FAILED
          - errors[ERR_DISTRICT_NOT_ACTIVE]
        distinguishing_aspect: |
          One tally with an empty body is the only action that can kill a district: with only b4's
          5,000,000 signed against a 100,000,000 roll the drive scores 0.0500, lands in
          SHORT_OF_THRESHOLD with short_reason WEIGHTED_BELOW_THRESHOLD, and the district itself falls
          to the terminal FORMATION_FAILED, after which even a well-formed assessment period is refused.
        test_recipe:
          setup:
            - "canonical district with the four-property roll, FORMATION drive OPEN, district PETITION_CIRCULATING"
            - "only b4 (5,000,000 of the 100,000,000 roll) has signed"
          setup_api_calls:
            - *c_clock_form
            - *c_district
            - *c_b1
            - *c_b2
            - *c_b3
            - *c_b4
            - *c_drive
            - call: "POST /petition-drives/${pd_id}/signatures"
              payload: { lodging_business_id: "${b4_id}" }
              as: LodgingOperator
              as_user_id: "${b4_id}"
          trigger:
            - call: "POST /petition-drives/${pd_id}/tally"
              payload: {}
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "POST /assessment-periods"
              payload: { district_id: "${d_id}", period_label: "FY2027-Q1", period_start: "2026-08-01T00:00:00Z", period_end: "2026-11-01T00:00:00Z", due_date: "2026-11-15T00:00:00Z", grace_days: 10 }
              as: DistrictAdministrator
              as_user_id: "admin-01"
          assert:
            - "the tally returns 200"
            - "PetitionDrive.${pd_id}.status == SHORT_OF_THRESHOLD and short_reason == WEIGHTED_BELOW_THRESHOLD"
            - "PetitionDrive.${pd_id}.weighted_support_pct == 0.0500 and signed_basis_cents == 5000000"
            - "PetitionDrive.${pd_id}.assessable_basis_snapshot_cents == 100000000 and assessable_count_snapshot == 4"
            - "PetitionDrive.${pd_id}.headcount_support_pct == 0.2500 and required_headcount_pct == 0.0000"
            - "PetitionDrive.${pd_id}.tallied_at == 2026-08-01T00:00:00Z"
            - "District.${d_id}.status == FORMATION_FAILED and formed_on == null and expiration_date == null"
            - "the assessment period creation returns 409 with data.error_id == ERR_DISTRICT_NOT_ACTIVE"

      - name: the_delinquency_sweep_touches_only_the_statements_that_still_owe_money
        claim_type: bulk_action
        grounds:
          - endpoints.POST_/assessment-periods/{id}/delinquency-sweep
          - calculations.delinquency_charges.input_set
          - state_machines.AssessmentPeriod.CLOSED_to_DELINQUENCY_SWEPT
        distinguishing_aspect: |
          One empty-bodied call fans out across four statements and must change exactly one: the
          paid-in-full st1 is skipped, the two never-filed statements are skipped because their
          total_due_cents is 0, and only st2 is charged — penalty 34000, interest 170, total_due 374170.
          District.delinquent_charges_cents therefore rises by 34170 and only b2 collects a strike.
        test_recipe:
          setup:
            - "canonical district, st1 filed at 824500 and settled in one 824500 remittance, st2 filed at 340000 and unpaid"
            - "st3 and st4 generated but never filed, so their effective assessment is 0"
            - "period CLOSED at clock 2026-11-16, clock advanced to 2026-11-26"
          setup_api_calls:
            - *c_clock_form
            - *c_district
            - *c_b1
            - *c_b2
            - *c_b3
            - *c_b4
            - *c_drive
            - *c_sign_b1
            - *c_tally
            - *c_certify
            - *c_activate
            - *c_period_q1
            - *c_generate_q1
            - *c_find_st1
            - *c_file_st1
            - *c_pay_st1_full
            - *c_find_st2
            - *c_file_st2
            - *c_clock_period_end
            - *c_close_q1
            - *c_clock_after_grace
          trigger:
            - *c_sweep_q1
          assert:
            - "the response status is 200 and AssessmentPeriod.${ap_id}.status == DELINQUENCY_SWEPT"
            - "AssessmentPeriod.${ap_id}.billed_total_cents == 1164500 and collected_total_cents == 824500"
            - "AssessmentStatement.${st2_id}.payment_status == DELINQUENT with delinquency_stage == NOTICE"
            - "AssessmentStatement.${st2_id}.penalty_cents == 34000 and interest_cents == 170 and total_due_cents == 374170"
            - "AssessmentStatement.${st1_id}.payment_status is still PAID_IN_FULL with penalty_cents == 0 and interest_cents == 0 and delinquency_stage == NONE"
            - "the two never-filed statements are still UNPAID with penalty_cents == 0, interest_cents == 0 and delinquency_stage == NONE"
            - "District.${d_id}.delinquent_charges_cents == 34170"
            - "LodgingBusiness.${b2_id}.delinquency_strike_count == 1 and compliance_standing == WATCH"
            - "LodgingBusiness.${b1_id}.delinquency_strike_count == 0 and compliance_standing == GOOD"
            - "PetitionSignature.${sig_b1_id}.status is still VALID"

      - name: one_signature_is_reachable_from_the_drive_side_and_from_the_property_side
        claim_type: cross_reference_link
        grounds:
          - endpoints.GET_/petition-drives/{id}/signatures
          - endpoints.GET_/lodging-businesses/{id}/petition-signatures
          - endpoints.GET_/petition-signatures/{id}
          - entities.PetitionSignature.fields.weight_basis_revenue_cents
        distinguishing_aspect: |
          The same PetitionSignature row must be reachable through three different paths — the drive's
          collection, the property's collection and its own id — and b1's withdrawn-then-resigned pair
          proves the status filter behaves the same on both collections: filtering to VALID returns one
          row on each side while the unfiltered property collection returns both.
        test_recipe:
          setup:
            - "canonical district PROPOSED, FORMATION drive OPEN"
            - "b1 signs, withdraws and signs again, so the drive holds one WITHDRAWN and one VALID row for b1"
          setup_api_calls:
            - *c_clock_form
            - *c_district
            - *c_b1
            - *c_b2
            - *c_b3
            - *c_b4
            - *c_drive
            - *c_sign_b1
            - call: "POST /petition-signatures/${sig_b1_id}/withdrawal"
              payload: { reason: "re-executing the signature page" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "POST /petition-drives/${pd_id}/signatures"
              payload: { lodging_business_id: "${b1_id}" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { sig_b1_final_id: "$.data.id" }
          trigger:
            - call: "GET /petition-drives/${pd_id}/signatures"
              payload: { status: "VALID" }
              as: BoardMember
              as_user_id: "board-member-01"
            - call: "GET /lodging-businesses/${b1_id}/petition-signatures"
              payload: { status: "VALID" }
              as: LodgingOperator
              as_user_id: "${b1_id}"
            - call: "GET /lodging-businesses/${b1_id}/petition-signatures"
              payload: {}
              as: LodgingOperator
              as_user_id: "${b1_id}"
            - call: "GET /petition-signatures/${sig_b1_final_id}"
              payload: {}
              as: IndependentAuditor
              as_user_id: "auditor-01"
          assert:
            - "the drive-side VALID listing returns exactly 1 row whose id == ${sig_b1_final_id}"
            - "the property-side VALID listing returns exactly 1 row whose id == ${sig_b1_final_id}"
            - "the unfiltered property-side listing returns exactly 2 rows, one VALID and one WITHDRAWN"
            - "GET /petition-signatures/${sig_b1_final_id} returns petition_drive_id == ${pd_id} and lodging_business_id == ${b1_id}"
            - "PetitionSignature.${sig_b1_final_id}.weight_basis_revenue_cents == 60000000"
            - "PetitionDrive.${pd_id}.valid_signature_count == 1 and signed_basis_cents == 60000000"

      - name: the_financial_summary_derives_every_figure_and_stores_none_of_them
        claim_type: computed_read
        grounds:
          - endpoints.GET_/districts/{id}/financial-summary
          - calculations.delinquency_charges
          - calculations.payment_status_derivation
          - entities.District.fields.collected_to_date_cents
        distinguishing_aspect: |
          A single read must reduce four statements, one remittance and one sweep to ten figures that no
          entity stores together: billed 1164500 across the FY2027 period, collected 824500,
          delinquent charges 34170, outstanding 374170, credit 0, four statements of which exactly one
          is delinquent. outstanding_total_cents is the sum of per-statement total_due_cents, not
          billed minus collected, and the two differ here by the 34170 of charges.
        test_recipe:
          setup:
            - "the swept fixture: st1 filed 824500 and paid in full, st2 filed 340000 and swept, st3 and st4 never filed"
            - "clock 2026-11-26, period FY2027-Q1 DELINQUENCY_SWEPT"
          setup_api_calls:
            - *c_clock_form
            - *c_district
            - *c_b1
            - *c_b2
            - *c_b3
            - *c_b4
            - *c_drive
            - *c_sign_b1
            - *c_tally
            - *c_certify
            - *c_activate
            - *c_period_q1
            - *c_generate_q1
            - *c_find_st1
            - *c_file_st1
            - *c_pay_st1_full
            - *c_find_st2
            - *c_file_st2
            - *c_clock_period_end
            - *c_close_q1
            - *c_clock_after_grace
            - *c_sweep_q1
          trigger:
            - call: "GET /districts/${d_id}/financial-summary"
              payload: { fiscal_year: 2027 }
              as: PublicViewer
              as_user_id: "public-01"
          assert:
            - "the response status is 200"
            - "data.district_id == ${d_id} and data.fiscal_year == 2027"
            - "data.billed_total_cents == 1164500"
            - "data.collected_to_date_cents == 824500"
            - "data.delinquent_charges_cents == 34170"
            - "data.outstanding_total_cents == 374170"
            - "data.credit_total_cents == 0"
            - "data.statement_count == 4 and data.delinquent_statement_count == 1"
            - "data.lodging_tax_match_committed_cents == 0"
            - "billed_total_cents - collected_to_date_cents == 340000 != outstanding_total_cents, because the 34170 of charges is billed by the sweep rather than by the statements"

      - name: audit_certification_is_admissible_only_once_the_period_has_left_open
        claim_type: conditional_action
        grounds:
          - validations.p60_audit_requires_closed_period
          - errors[ERR_PERIOD_NOT_CLOSED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / audit_certification_gated_on_the_owning_period_leaving_open
          rationale: "That §1.8 instance holds a FILED statement steady and moves only the owning period, asserting ERR_PERIOD_NOT_CLOSED while it is OPEN and success immediately after closure."

  # ===========================================================================
  # SECTION 6 — Errors (claim-extraction-guide Table 6)
  #
  # Table 6 carries no claim_type rows of its own; it requires that every error
  # code in §1.6 be triggerable. The instances below trigger, for real, every
  # code that no §1.8 instance already triggers, and the index at the end of the
  # section maps all 57 codes of §1.6 to the instance that raises each one.
  # Codes already raised by a §1.8 instance appear here as excluded_because
  # stubs naming it.
  # ===========================================================================
  - section: errors
    instances:

      - name: unknown_ids_on_the_remaining_read_endpoints_each_return_their_own_not_found_code
        claim_type: not_found
        grounds:
          - validations.p40_path_id_existence_resolved_left_to_right
          - errors[ERR_LODGING_BUSINESS_NOT_FOUND]
          - errors[ERR_PETITION_DRIVE_NOT_FOUND]
          - errors[ERR_PETITION_SIGNATURE_NOT_FOUND]
          - errors[ERR_ASSESSMENT_PERIOD_NOT_FOUND]
          - errors[ERR_WORK_PLAN_NOT_FOUND]
          - errors[ERR_MARKETING_PROGRAM_NOT_FOUND]
          - errors[ERR_ROOM_NIGHT_CLAIM_NOT_FOUND]
          - errors[ERR_TRANSPARENCY_RECORD_NOT_FOUND]
          - errors[ERR_DISPUTE_NOT_FOUND]
        distinguishing_aspect: |
          §1.6 declares a separate 404 code per entity rather than one generic code, so an
          implementation that collapses them into a single ERR_NOT_FOUND passes every other test in the
          suite and fails only this one. Each read is issued against an empty database, so no row of any
          kind exists and the code returned identifies the entity named by the path segment. The last two
          calls prove the same codes come back from a write path, where existence (priority 40) is
          resolved before every state and business rule — the statement-generation call carries no body
          and the board-action call carries a well-formed APPROVE that no non-existent plan could ever
          be eligible for, so a 404 rather than a 409 pins the ordering.
        test_recipe:
          setup:
            - "empty database, logical clock pinned to 2026-08-01T00:00:00Z; no district, roll, drive, period, plan, program, claim, record or dispute exists"
          setup_api_calls:
            - *c_clock_form
          trigger:
            - call: "GET /lodging-businesses/00000000-0000-4000-8000-000000000901"
              payload: {}
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "GET /petition-drives/00000000-0000-4000-8000-000000000902"
              payload: {}
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "GET /petition-signatures/00000000-0000-4000-8000-000000000903"
              payload: {}
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "GET /assessment-periods/00000000-0000-4000-8000-000000000904"
              payload: {}
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "GET /annual-work-plans/00000000-0000-4000-8000-000000000905"
              payload: {}
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "GET /marketing-programs/00000000-0000-4000-8000-000000000906"
              payload: {}
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "GET /room-night-claims/00000000-0000-4000-8000-000000000907"
              payload: {}
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "GET /transparency-records/00000000-0000-4000-8000-000000000908"
              payload: {}
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "GET /assessment-disputes/00000000-0000-4000-8000-000000000909"
              payload: {}
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "POST /assessment-periods/00000000-0000-4000-8000-00000000090a/statement-generation"
              payload: {}
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "POST /annual-work-plans/00000000-0000-4000-8000-00000000090b/board-actions"
              payload: { action: "APPROVE", note: "well-formed board action against an id that does not exist" }
              as: BoardMember
              as_user_id: "board-member-01"
          assert:
            - "every one of the eleven calls returns 404"
            - "the lodging-business read returns data.error_id == ERR_LODGING_BUSINESS_NOT_FOUND"
            - "the petition-drive read returns data.error_id == ERR_PETITION_DRIVE_NOT_FOUND"
            - "the petition-signature read returns data.error_id == ERR_PETITION_SIGNATURE_NOT_FOUND"
            - "the assessment-period read returns data.error_id == ERR_ASSESSMENT_PERIOD_NOT_FOUND"
            - "the annual-work-plan read returns data.error_id == ERR_WORK_PLAN_NOT_FOUND"
            - "the marketing-program read returns data.error_id == ERR_MARKETING_PROGRAM_NOT_FOUND"
            - "the room-night-claim read returns data.error_id == ERR_ROOM_NIGHT_CLAIM_NOT_FOUND"
            - "the transparency-record read returns data.error_id == ERR_TRANSPARENCY_RECORD_NOT_FOUND"
            - "the assessment-dispute read returns data.error_id == ERR_DISPUTE_NOT_FOUND"
            - "the statement-generation write returns data.error_id == ERR_ASSESSMENT_PERIOD_NOT_FOUND"
            - "the board-action write returns 404 with data.error_id == ERR_WORK_PLAN_NOT_FOUND rather than ERR_INVALID_STATE_TRANSITION or ERR_SEGREGATION_OF_DUTIES, because path-id existence at priority 40 is resolved before every state and business rule from priority 60 onwards; the body is well formed, so the priority-30 shape gate has nothing to say about it"
            - "the nine error_id values are nine distinct strings, so no pair of entities shares a 404 code"

      - name: the_contingency_cap_and_the_marketing_floor_both_refuse_a_plan_at_board_approval
        claim_type: violation_to_error
        grounds:
          - validations.p85_contingency_share_cap
          - validations.p85_marketing_share_floor
          - errors[ERR_CONTINGENCY_SHARE_EXCEEDED]
          - errors[ERR_MARKETING_SHARE_BELOW_MINIMUM]
          - calculations.work_plan_compliance
          - state_machines.AnnualWorkPlan.BOARD_REVIEW_to_APPROVED
        distinguishing_aspect: |
          Both caps are derived from the plan's own total rather than from a fixed figure, and both are
          evaluated at APPROVE only — a DRAFT plan may hold any mix at all, which is why each walk has to
          go through SPONSOR first. On a 1,000,000-cent plan the contingency ceiling is exactly 100,000
          and the marketing floor exactly 600,000, so a plan is refused for one extra cent of reserve and
          a second plan is refused for one missing cent of marketing. The district here holds no
          assessment statement whatsoever, so its funding_ratio would be 0.0000: the assertion that the
          returned code is the share-cap code and not ERR_FUNDING_RATIO_BELOW_MINIMUM is what pins the
          priority-85-before-priority-90 ordering inside a single endpoint call.
        test_recipe:
          setup:
            - "canonical district ACTIVE with the four-property roll; no assessment period and no statement exist, so any funding_ratio computed for fiscal 2027 is 0.0000"
          setup_api_calls:
            - *c_clock_form
            - *c_district
            - *c_b1
            - *c_b2
            - *c_b3
            - *c_b4
            - *c_drive
            - *c_sign_b1
            - *c_tally
            - *c_certify
            - *c_activate
          trigger:
            - call: "POST /annual-work-plans"
              payload: { district_id: "${d_id}", fiscal_year: 2027, expenditure_lines: [{ category: "SALES_AND_MARKETING", amount_cents: 649999, narrative: "paid search and trade shows" }, { category: "ADMINISTRATION", amount_cents: 150000, narrative: "district staff" }, { category: "CONTINGENCY_RESERVE", amount_cents: 100001, narrative: "one cent over the statutory reserve" }, { category: "DESTINATION_EVENTS", amount_cents: 100000, narrative: "harbour festival" }] }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { wp_cont_id: "$.data.id" }
            - call: "POST /annual-work-plans/${wp_cont_id}/board-actions"
              payload: { action: "SPONSOR", note: "sponsored despite the reserve line" }
              as: BoardMember
              as_user_id: "board-member-01"
            - call: "POST /annual-work-plans/${wp_cont_id}/board-actions"
              payload: { action: "APPROVE", note: "board vote on the over-reserved plan" }
              as: BoardMember
              as_user_id: "board-member-02"
            - call: "POST /annual-work-plans"
              payload: { district_id: "${d_id}", fiscal_year: 2027, expenditure_lines: [{ category: "SALES_AND_MARKETING", amount_cents: 599999, narrative: "one cent short of the marketing floor" }, { category: "ADMINISTRATION", amount_cents: 150000, narrative: "district staff" }, { category: "CONTINGENCY_RESERVE", amount_cents: 100000, narrative: "statutory reserve" }, { category: "DESTINATION_EVENTS", amount_cents: 150001, narrative: "harbour festival and winter lights" }] }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { wp_mkt_id: "$.data.id" }
            - call: "POST /annual-work-plans/${wp_mkt_id}/board-actions"
              payload: { action: "SPONSOR", note: "sponsored despite the marketing line" }
              as: BoardMember
              as_user_id: "board-member-01"
            - call: "POST /annual-work-plans/${wp_mkt_id}/board-actions"
              payload: { action: "APPROVE", note: "board vote on the under-marketed plan" }
              as: BoardMember
              as_user_id: "board-member-02"
          assert:
            - "both plan creations return 201 even though neither mix is compliant, because the caps bind at APPROVE and not at creation"
            - "AnnualWorkPlan.${wp_cont_id}.total_budget_cents == 1000000 with contingency_reserve_cents == 100001, and AnnualWorkPlan.${wp_mkt_id}.total_budget_cents == 1000000 with sales_and_marketing_cents == 599999"
            - "both SPONSOR calls return 200 and leave each plan in BOARD_REVIEW with sponsor_user_id == \"board-member-01\""
            - "the first APPROVE returns 409 with data.error_id == ERR_CONTINGENCY_SHARE_EXCEEDED, because round_half_up(1000000 * 0.10) == 100000 and 100001 > 100000"
            - "the second APPROVE returns 409 with data.error_id == ERR_MARKETING_SHARE_BELOW_MINIMUM, because round_half_up(1000000 * 0.60) == 600000 and 599999 < 600000"
            - "neither refusal is ERR_FUNDING_RATIO_BELOW_MINIMUM even though the district has no statements and the ratio would be 0.0000, because the share caps sit at priority 85 and the funding ratio at priority 90"
            - "neither refusal is ERR_ADMIN_SHARE_EXCEEDED: 150000 == round_half_up(1000000 * 0.15) and an administration share exactly on its cap is accepted"
            - "AnnualWorkPlan.${wp_cont_id}.status and AnnualWorkPlan.${wp_mkt_id}.status are both still BOARD_REVIEW with approver_user_id null and approved_at null"

      - name: amendment_variance_is_measured_against_the_stored_total_and_admits_exactly_the_allowance
        claim_type: violation_to_error
        grounds:
          - validations.p90_amendment_variance_ceiling
          - errors[ERR_AMENDMENT_VARIANCE_EXCEEDED]
          - calculations.work_plan_compliance
          - state_machines.AnnualWorkPlan.AMENDMENT_PENDING_to_APPROVED
          - concurrency_rules.work-plan-amendment-stale-plan
        distinguishing_aspect: |
          The allowance is round_half_up(baseline_total_cents * 0.25) on the total as CURRENTLY STORED,
          not on the proposed total — 250,000 on the canonical 1,000,000 plan. A proposal 260,000 above
          the baseline is refused while a proposal exactly 250,000 above it is accepted, which separates
          `<=` from `<` on the allowance. The refused amendment must consume nothing: revision_count stays
          0 and the plan's version does not move, so the same expected_work_plan_version that was rejected
          is still current and is reused verbatim by the accepted call. Both proposals satisfy every
          priority-85 share cap and both keep funding_ratio above 0.9000, so the variance ceiling is the
          only rule that can distinguish them.
        test_recipe:
          setup:
            - "canonical district ACTIVE, FY2027-Q1 generated, st1 filed 824,500 and st2 filed 340,000"
            - "plan FY2027 APPROVED at total 1,000,000 with forecast 1,164,500 and funding_ratio 1.1645"
          setup_api_calls:
            - *c_clock_form
            - *c_district
            - *c_b1
            - *c_b2
            - *c_b3
            - *c_b4
            - *c_drive
            - *c_sign_b1
            - *c_tally
            - *c_certify
            - *c_activate
            - *c_period_q1
            - *c_generate_q1
            - *c_find_st1
            - *c_file_st1
            - *c_find_st2
            - *c_file_st2
            - *c_plan_fy2027
            - *c_sponsor
            - *c_approve
          trigger:
            - call: "POST /annual-work-plans/${wp_id}/amendments"
              payload: { expected_work_plan_version: "${wp_v_approved}", expenditure_lines: [{ category: "SALES_AND_MARKETING", amount_cents: 800000, narrative: "expanded paid search" }, { category: "ADMINISTRATION", amount_cents: 180000, narrative: "district staff" }, { category: "CONTINGENCY_RESERVE", amount_cents: 120000, narrative: "statutory reserve" }, { category: "DESTINATION_EVENTS", amount_cents: 160000, narrative: "harbour festival" }], amendment_reason: "260,000 above the stored baseline" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "POST /annual-work-plans/${wp_id}/amendments"
              payload: { expected_work_plan_version: "${wp_v_approved}", expenditure_lines: [{ category: "SALES_AND_MARKETING", amount_cents: 800000, narrative: "expanded paid search" }, { category: "ADMINISTRATION", amount_cents: 180000, narrative: "district staff" }, { category: "CONTINGENCY_RESERVE", amount_cents: 120000, narrative: "statutory reserve" }, { category: "DESTINATION_EVENTS", amount_cents: 150000, narrative: "harbour festival" }], amendment_reason: "exactly the 250,000 allowance" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { wp_v_amended: "$.data.version" }
          assert:
            - "the 1,260,000 proposal returns 409 with data.error_id == ERR_AMENDMENT_VARIANCE_EXCEEDED, because abs(1260000 - 1000000) == 260000 > round_half_up(1000000 * 0.25) == 250000"
            - "that refusal is not ERR_FUNDING_RATIO_BELOW_MINIMUM: round_half_up(1164500 / 1260000, 4) == 0.9242 which clears 0.9000, so only the variance ceiling can refuse it"
            - "that refusal is not a share-cap error: 800000 >= round_half_up(1260000 * 0.60) == 756000, 180000 <= round_half_up(1260000 * 0.15) == 189000 and 120000 <= round_half_up(1260000 * 0.10) == 126000"
            - "after the refusal AnnualWorkPlan.${wp_id}.revision_count == 0, total_budget_cents == 1000000, sales_and_marketing_cents == 650000 and version == ${wp_v_approved}"
            - "the 1,250,000 proposal returns 200 with the same expected_work_plan_version, because abs(1250000 - 1000000) == 250000 is exactly the allowance and the comparison is <="
            - "AnnualWorkPlan.${wp_id}.total_budget_cents == 1250000 with sales_and_marketing_cents == 800000, administration_cents == 180000, contingency_reserve_cents == 120000 and destination_events_cents == 150000"
            - "AnnualWorkPlan.${wp_id}.revision_count == 1, status == APPROVED and ${wp_v_amended} == ${wp_v_approved} + 1"
            - "AnnualWorkPlan.${wp_id}.funding_ratio == 0.9316, because round_half_up(1164500 / 1250000, 4) == 0.9316 and the forecast itself did not move"

      - name: the_funding_ratio_refuses_the_unfunded_fiscal_year_while_the_funded_one_approves
        claim_type: violation_to_error
        grounds:
          - validations.p90_funding_ratio_floor
          - errors[ERR_FUNDING_RATIO_BELOW_MINIMUM]
          - calculations.work_plan_compliance
        distinguishing_aspect: |
          The forecast is assembled from the statements of every AssessmentPeriod whose period_label
          begins with "FY<plan.fiscal_year>", so the SAME district approves a fiscal 2027 plan at
          funding_ratio 1.1645 and is refused a fiscal 2028 plan at 0.0000 in the same walk. An
          implementation that forecasts from every period of the district regardless of label, or that
          reads District.current_fiscal_year instead of the plan's own fiscal_year, approves both plans
          and fails here. The refused plan is compliant on every share cap, so the ratio is the only
          rule that can reject it.
        test_recipe:
          setup:
            - "canonical district ACTIVE with the single period FY2027-Q1, st1 filed 824,500 and st2 filed 340,000"
            - "plan FY2027 already APPROVED at total 1,000,000"
          setup_api_calls:
            - *c_clock_form
            - *c_district
            - *c_b1
            - *c_b2
            - *c_b3
            - *c_b4
            - *c_drive
            - *c_sign_b1
            - *c_tally
            - *c_certify
            - *c_activate
            - *c_period_q1
            - *c_generate_q1
            - *c_find_st1
            - *c_file_st1
            - *c_find_st2
            - *c_file_st2
            - *c_plan_fy2027
            - *c_sponsor
            - *c_approve
          trigger:
            - call: "POST /annual-work-plans"
              payload: { district_id: "${d_id}", fiscal_year: 2028, expenditure_lines: [{ category: "SALES_AND_MARKETING", amount_cents: 650000, narrative: "fiscal 2028 paid search" }, { category: "ADMINISTRATION", amount_cents: 150000, narrative: "district staff" }, { category: "CONTINGENCY_RESERVE", amount_cents: 100000, narrative: "statutory reserve" }, { category: "DESTINATION_EVENTS", amount_cents: 100000, narrative: "harbour festival" }] }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { wp28_id: "$.data.id" }
            - call: "POST /annual-work-plans/${wp28_id}/board-actions"
              payload: { action: "SPONSOR", note: "sponsored for the fiscal 2028 cycle" }
              as: BoardMember
              as_user_id: "board-member-03"
            - call: "POST /annual-work-plans/${wp28_id}/board-actions"
              payload: { action: "APPROVE", note: "board vote on the fiscal 2028 plan" }
              as: BoardMember
              as_user_id: "board-member-04"
          assert:
            - "the fiscal 2028 plan is created 201 and sponsored 200, reaching BOARD_REVIEW with total_budget_cents == 1000000"
            - "the APPROVE returns 409 with data.error_id == ERR_FUNDING_RATIO_BELOW_MINIMUM"
            - "the forecast for fiscal 2028 is 0 because the district's only period is labelled FY2027-Q1 and no period label begins with FY2028, so funding_ratio == 0.0000 < 0.9000"
            - "the refusal is not a share-cap error: 650000 >= 600000, 150000 <= 150000 and 100000 <= 100000 all hold on a 1,000,000-cent total"
            - "AnnualWorkPlan.${wp28_id}.status is still BOARD_REVIEW with approver_user_id null"
            - "AnnualWorkPlan.${wp_id}.status is still APPROVED with funding_ratio == 1.1645 and assessment_revenue_forecast_cents == 1164500, so the failed fiscal 2028 approval left the fiscal 2027 plan untouched"
            - "the two plans coexist: GET /districts/${d_id}/annual-work-plans returns both rows, one APPROVED for 2027 and one BOARD_REVIEW for 2028"

      - name: the_lodging_tax_match_is_bounded_by_the_pool_and_by_half_the_approved_plan_total
        claim_type: violation_to_error
        grounds:
          - validations.p90_lodging_tax_match_cap
          - validations.p90_lodging_tax_match_pool
          - errors[ERR_LODGING_TAX_MATCH_CAP_EXCEEDED]
          - errors[ERR_LODGING_TAX_MATCH_EXHAUSTED]
          - entities.District.fields.lodging_tax_match_committed_cents
          - endpoints.POST_/districts/{id}/dmo-coordination
          - endpoints.POST_/marketing-programs
        distinguishing_aspect: |
          Two different ceilings guard the same conserved figure and they are reached from opposite
          directions. Committing match money is bounded by min(50% of the approved plan total, the pool),
          and lowering the pool underneath money already committed is refused as EXHAUSTED rather than
          silently leaving the district over-committed. The walk starts with the pool binding at 400,000
          (below the 500,000 statutory ceiling), then raises the pool to 900,000 so that the ceiling
          becomes the binding constraint, and shows one extra cent refused and the exact ceiling accepted.
          District.lodging_tax_match_committed_cents is a derived sum over the district's non-CANCELLED
          programs, so the refused calls must leave it exactly where it was.
        test_recipe:
          setup:
            - "canonical district ACTIVE, st1 and st2 filed, plan FY2027 APPROVED at total 1,000,000 -> match ceiling round_half_up(1000000 * 0.50) == 500000"
            - "DMO agreement EXECUTED with lodging_tax_match_pool_cents 400,000 and nothing committed yet"
          setup_api_calls:
            - *c_clock_form
            - *c_district
            - *c_b1
            - *c_b2
            - *c_b3
            - *c_b4
            - *c_drive
            - *c_sign_b1
            - *c_tally
            - *c_certify
            - *c_activate
            - *c_period_q1
            - *c_generate_q1
            - *c_find_st1
            - *c_file_st1
            - *c_find_st2
            - *c_file_st2
            - *c_plan_fy2027
            - *c_sponsor
            - *c_approve
            - *c_dmo_executed
          trigger:
            - call: "POST /marketing-programs"
              payload: { annual_work_plan_id: "${wp_id}", name: "Shoulder Season Paid Search", channel: "PAID_SEARCH", committed_cents: 400000, lodging_tax_matched_cents: 400000, booking_window_start: "2026-10-01T00:00:00Z", booking_window_end: "2026-12-01T00:00:00Z" }
              as: DmoLiaison
              as_user_id: "dmo-01"
              captures: { mp_pool_id: "$.data.id" }
            - call: "POST /districts/${d_id}/dmo-coordination"
              payload: { dmo_name: "Visit Harbor Bay", dmo_agreement_status: "EXECUTED", dmo_contract_cents: 200000, lodging_tax_match_pool_cents: 300000, public_lodging_tax_offset_cents: 0 }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "POST /districts/${d_id}/dmo-coordination"
              payload: { dmo_name: "Visit Harbor Bay", dmo_agreement_status: "EXECUTED", dmo_contract_cents: 200000, lodging_tax_match_pool_cents: 900000, public_lodging_tax_offset_cents: 0 }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "POST /marketing-programs"
              payload: { annual_work_plan_id: "${wp_id}", name: "Winter OTA Overbid", channel: "OTA_CAMPAIGN", committed_cents: 100001, lodging_tax_matched_cents: 100001, booking_window_start: "2026-10-01T00:00:00Z", booking_window_end: "2026-12-01T00:00:00Z" }
              as: DmoLiaison
              as_user_id: "dmo-01"
            - call: "POST /marketing-programs"
              payload: { annual_work_plan_id: "${wp_id}", name: "Winter OTA Campaign", channel: "OTA_CAMPAIGN", committed_cents: 100000, lodging_tax_matched_cents: 100000, booking_window_start: "2026-10-01T00:00:00Z", booking_window_end: "2026-12-01T00:00:00Z" }
              as: DmoLiaison
              as_user_id: "dmo-01"
              captures: { mp_cap_id: "$.data.id" }
          assert:
            - "the 400,000 program returns 201 and District.${d_id}.lodging_tax_match_committed_cents == 400000, exactly the pool and below the 500000 ceiling"
            - "lowering the pool to 300,000 returns 409 with data.error_id == ERR_LODGING_TAX_MATCH_EXHAUSTED, because 400000 already committed exceeds the proposed pool"
            - "after that refusal District.${d_id}.lodging_tax_match_pool_cents is still 400000 and District.${d_id}.version did not change, so a refused coordination call writes nothing at all"
            - "raising the pool to 900,000 returns 200 and leaves lodging_tax_match_committed_cents at 400000"
            - "the 100,001 program returns 409 with data.error_id == ERR_LODGING_TAX_MATCH_CAP_EXCEEDED, because 400000 + 100001 == 500001 > min(500000, 900000)"
            - "that refusal is not ERR_LODGING_TAX_MATCH_EXHAUSTED: the 900,000 pool has room, so only the plan-derived ceiling binds"
            - "that refusal is not ERR_PROGRAM_BUDGET_EXCEEDED: committed_program_cents would be 500001, still under sales_and_marketing_cents 650000"
            - "the 100,000 program returns 201 and District.${d_id}.lodging_tax_match_committed_cents == 500000, exactly the ceiling, because the comparison is <="
            - "AnnualWorkPlan.${wp_id}.committed_program_cents == 500000 over the two surviving programs, and GET /annual-work-plans/${wp_id}/marketing-programs returns exactly ${mp_pool_id} and ${mp_cap_id}"
            - "GET /districts/${d_id}/financial-summary with fiscal_year 2027 reports lodging_tax_match_committed_cents == 500000"

      - name: a_qualifying_tally_is_still_refused_while_the_assessable_pool_holds_fewer_than_three_businesses
        claim_type: violation_to_error
        grounds:
          - validations.p90_minimum_petition_pool
          - errors[ERR_PETITION_POOL_TOO_SMALL]
          - calculations.petition_support
          - state_machines.PetitionDrive.OPEN_to_QUALIFIED
        distinguishing_aspect: |
          The pool floor is independent of the support thresholds: a two-property district can reach
          100.0000 percent revenue-weighted support and still may not certify itself into existence. The
          refusal must leave the drive OPEN — not SHORT_OF_THRESHOLD — because the drive did qualify and
          the district must therefore stay in PETITION_CIRCULATING rather than cascading to
          FORMATION_FAILED. Adding a third assessable property later makes the very same tally succeed,
          which also proves the tally recomputes petition_support from the live assessable set rather
          than from the snapshot taken when the drive opened: weighted support drops from 1.0000 to
          0.8000 and headcount from 1.0000 to 0.6667 while the drive still qualifies.
        test_recipe:
          setup:
            - "logical clock 2026-08-01T00:00:00Z"
            - "a second district Tidepool Commons PROPOSED with only two assessable properties, both of which have signed its FORMATION drive"
          setup_api_calls:
            - *c_clock_form
            - call: "POST /districts"
              payload: { name: "Tidepool Commons Tourism Improvement District", assessment_method: "PCT_OF_ROOM_REVENUE", included_zones: ["ZONE_CORE"], formation_threshold_pct: 0.6000, term_years: 1, current_fiscal_year: 2027 }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { pd_district_id: "$.data.id" }
            - call: "POST /lodging-businesses"
              payload: { district_id: "${pd_district_id}", legal_name: "Tidepool Arms", boundary_zone: "ZONE_CORE", classification: "FULL_SERVICE", room_count: 100, prior_year_gross_room_revenue_cents: 40000000, operator_contact_email: "ops@tidepoolarms.example" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { pool_b1_id: "$.data.id" }
            - call: "POST /lodging-businesses"
              payload: { district_id: "${pd_district_id}", legal_name: "Tidepool Lodge", boundary_zone: "ZONE_CORE", classification: "LIMITED_SERVICE", room_count: 80, prior_year_gross_room_revenue_cents: 40000000, operator_contact_email: "ops@tidepoollodge.example" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
