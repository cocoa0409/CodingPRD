      - name: collect_freight_is_excluded_from_the_insured_value_base
        claim_type: correct_result
        grounds:
          - calculations.certificate_insured_value
          - calculations.certificate_premium_components
          - entities.OpenPolicy.fields.freight_basis
        distinguishing_aspect: |
          freight_basis is a policy-level switch on the CIF base, not on the
          premium rate: under COLLECT the identical shipment (invoice 1000000.00,
          freight 45000.00, duty 5000.00, markup 0.10) insures for 1105500.00
          instead of 1155000.00, and every premium component falls with it —
          5223.49 / 663.30 / 281.90 = 6168.69 against 6444.91. A model that
          drops freight from the premium but not from the insured value, or that
          rounds the sum instead of the components, cannot produce this row.
        test_recipe:
          setup:
            - "one ACTIVE OpenPolicy with freight_basis COLLECT and markup_pct 0.10"
            - "rates 3.500 / 0.600 / 0.255, commodity loading 0.35, APPROVED vessel (surcharge 0.00), both ports GREEN"
            - "one certificate quoting freight_amount 45000.00 anyway"
