          setup:
            - "The canonical ACTIVE lease with an APPROVED 2027 season plan and three ACCEPTED reports of 40,000,000 each remitting 2,150,000 each."
            - "The lease-year-1 reconciliation exists from 2028-03-05: annual_fee_due 7,750,000, remitted 6,450,000, additional_fee_due 1,300,000, PENDING_PAYMENT, due_date 2028-03-30."
            - "An audit engagement covering 2027-04-01..2027-07-01 is in FINDINGS_ISSUED: fieldwork froze reported_gross_receipts_cents at 120,000,000 and the auditor issued adjusted_gross_receipts_cents 132,000,000, so underreport_pct is 10.00 and penalty_applies is true."
