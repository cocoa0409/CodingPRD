            - call: "POST /quotes"
              payload: { vehicle_profile_id: "${veh}", shop_location_id: "${shop}" }
              as: ShopManager
              captures: { q: $.data.id, qv0: $.data.version }
            - call: "POST /quotes/${q}/lines"
              payload: { service_package_id: "${pkg}", film_material_id: "${mat}", coverage: "FULL", window_position: "REAR_SIDE", requested_vlt_pct: 60, expected_quote_version: "${qv0}" }
              as: ShopManager
              captures: { qv1: $.data.version }
            - call: "POST /quotes/${q}/price"
              payload: { expected_quote_version: "${qv1}" }
              as: ShopManager
              captures: { qv2: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-11T00:00:00Z" }
              as: ShopManager
          trigger:
            - call: "POST /quotes/${q}/accept"
              payload: { expected_quote_version: "${qv2}" }
              as: Customer
              as_user_id: "c-ttl"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_QUOTE_EXPIRED, HTTP 409 (clock 2026-05-11 > created_at 2026-04-01 + 30d)"

      - name: not_found_fk_on_quote_create
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_NOT_FOUND]"
          - "validations[priority=10]"
          - entities.Quote.fields.shop_location_id
        distinguishing_aspect: "POST /quotes with a non-existent shop_location_id returns ERR_NOT_FOUND (404) — FK existence validated."
        test_recipe:
          setup: ["A valid vehicle exists; shop_location_id references a non-existent id."]
          setup_api_calls:
            - call: "POST /vehicle-profiles"
              payload: { customer_user_id: "c-nf", vin: "VIN-NF", size_class: "SEDAN" }
              as: ShopManager
              captures: { veh: $.data.id }
          trigger:
            - call: "POST /quotes"
              payload: { vehicle_profile_id: "${veh}", shop_location_id: "00000000-0000-0000-0000-000000000000" }
              as: ShopManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND, HTTP 404"

      - name: stale_quote_version_on_line_add
        claim_type: violation_to_error
        grounds:
          - "concurrency_rules[line-add-stale-quote]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Adding a line with expected_quote_version one behind the quote's current version (after a prior line bumped it) returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["A DRAFT quote with one line already added (version advanced); a second line-add carries the pre-first-line version."]
          setup_api_calls:
            - call: "POST /state-tint-regulations"
              payload: { state_code: "MD", front_side_min_vlt_pct: 35, windshield_strip_max_inches: 5, medical_exemption_allowed: false }
              as: ComplianceOfficer
            - call: "POST /shop-locations"
              payload: { name: "S", state_code: "MD" }
              as: ShopManager
              captures: { shop: $.data.id }
            - call: "POST /service-packages"
              payload: { name: "Tint", service_type: "TINT", base_rate_cents: 28000, duration_minutes: 120, cure_buffer_minutes: 0, warranty_days: 365, requires_proof: false }
              as: ShopManager
              captures: { pkg: $.data.id }
            - call: "POST /film-materials"
              payload: { sku: "M-OCC", category: "TINT_FILM", cure_hours: 24, price_multiplier_bps: 14500 }
              as: ShopManager
              captures: { mat: $.data.id }
            - call: "POST /vehicle-profiles"
              payload: { customer_user_id: "c-occ", vin: "VIN-OCC", size_class: "SEDAN" }
              as: ShopManager
              captures: { veh: $.data.id }
            - call: "POST /quotes"
              payload: { vehicle_profile_id: "${veh}", shop_location_id: "${shop}" }
              as: ShopManager
              captures: { q: $.data.id, qv0: $.data.version }
            - call: "POST /quotes/${q}/lines"
              payload: { service_package_id: "${pkg}", film_material_id: "${mat}", coverage: "FULL", window_position: "REAR_SIDE", requested_vlt_pct: 50, expected_quote_version: "${qv0}" }
              as: ShopManager
              captures: { qv1: $.data.version }
          trigger:
            - call: "POST /quotes/${q}/lines"
              payload: { service_package_id: "${pkg}", film_material_id: "${mat}", coverage: "PARTIAL", window_position: "REAR_WINDOW", requested_vlt_pct: 50, expected_quote_version: "${qv0}" }
              as: ShopManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION, HTTP 412 (qv0 is stale; current version is qv1)"

      - name: stale_quote_version_on_workorder_create
        claim_type: violation_to_error
        grounds:
          - "concurrency_rules[workorder-create-stale-quote]"
          - "errors[ERR_STALE_VERSION]"
        excluded_because:
          difficulty_instance: transitive_cascade / cancel_workorder_releases_then_reschedule_reholds
          rationale: "The workorder-create OCC against an advancing Quote.version is exercised by the cancel cascade instance, whose re-schedule step must carry the fresh post-cancel quote version; a stale value is the immediate negative corollary."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: schedule_response_reflects_estimated_cure_immediately
        claim_type: immediate
        grounds: [endpoints.POST /work-orders, entities.WorkOrder.fields.cure_complete_at]
        distinguishing_aspect: "The POST /work-orders response immediately contains the ESTIMATED cure_complete_at (2026-06-03T11:00:00Z) computed in the same request — no read-after-write lag."
        test_recipe:
          setup: ["An ACCEPTED TINT quote (ceramic cure 24h), bay+installer ready; schedule at 2026-06-02T09:00 (dur 120)."]
          setup_api_calls:
            - call: "POST /state-tint-regulations"
              payload: { state_code: "DE", front_side_min_vlt_pct: 35, windshield_strip_max_inches: 5, medical_exemption_allowed: false }
