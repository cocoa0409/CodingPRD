            - { call: "POST /fleetcare/technicians", payload: { full_name: "Ravi Shah", region_code: "NORTH", skill_categories: ["TREADMILL"] }, as: ContractAdministrator, captures: { t2_id: "$.data.id" } }
            - { call: "POST /fleetcare/preventive-visits", payload: { contract_id: "${c_id}", equipment_id: "${e1_id}", window_start: "2026-08-15T08:00:00Z", window_end: "2026-08-15T09:30:00Z", technician_id: "${t1_id}" }, as: ServiceCoordinator, captures: { va_id: "$.data.id" } }
            - { call: "POST /fleetcare/preventive-visits", payload: { contract_id: "${c_id}", equipment_id: "${e2_id}", window_start: "2026-08-15T12:00:00Z", window_end: "2026-08-15T13:30:00Z", technician_id: "${t2_id}" }, as: ServiceCoordinator, captures: { vb_id: "$.data.id" } }
            - { call: "GET /fleetcare/technician-assignments", payload: { preventive_visit_id: "${va_id}" }, as: ServiceCoordinator, captures: { aa_id: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T12:00:00Z" }, as: ContractAdministrator }
