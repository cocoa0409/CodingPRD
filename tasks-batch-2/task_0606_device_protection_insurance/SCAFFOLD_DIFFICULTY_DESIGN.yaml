# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Device Protection & Mobile Insurance Claims (Expert)
#
# Shared fixture conventions referenced across instances:
#   Plan PLAN_STD: monthly_premium_cents=2000, base_deductible_cents=10000,
#       loss_deductible_multiplier_bps=15000, annual_claim_limit=2,
#       replacement_value_cap_cents=80000
#   SKU_BOOK:   msrp_cents=90000,  depreciation_rate_bps_per_month=200, stock_on_hand=5
#               -> depreciated@6mo = 79200 (< cap 80000)  => book_value_variant
#   SKU_CAPPED: msrp_cents=200000, depreciation_rate_bps_per_month=100, stock_on_hand=5
#               -> depreciated@6mo = 188000 (>= cap 80000) => capped_replacement_variant
#   Clock set to 2026-06-01T00:00:00Z; device_purchase_date 2025-12-01 => age_months=6
#   IMEI_A=356758901234560  IMEI_B=490154203237518 (both 15-digit Luhn-valid)
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: replacement_value_book_vs_capped_diverges
        grounds:
          - calculations.replacement_value
          - state_machines.Claim.APPROVED_to_ROUTED_REPLACE
          - entities.Claim.fields.replacement_value_cents
        distinguishing_aspect: |
          Two LOST claims with identical age (6mo) and identical plan cap (80000) but different
          SKUs yield divergent replacement_value_cents: SKU_BOOK pays book value 79200 while
          SKU_CAPPED pays the flat cap 80000 — divergence on the Claim entity's replacement value.
        test_recipe:
          setup:
            - "Clock at 2026-06-01. Customer C with two ACTIVE enrollments: E_book on SKU_BOOK, E_cap on SKU_CAPPED, both purchase_date 2025-12-01, both on PLAN_STD."
            - "A LOST claim on each enrollment, each screened (PASS) and approved (deductible 15000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { full_name: "C", carrier_account_number: "CA-DV-1" }
              as: PlatformAdmin
              captures: { cust: $.data.id }
            - call: "POST /plans"
              payload: { code: "PLAN_STD", monthly_premium_cents: 2000, base_deductible_cents: 10000, loss_deductible_multiplier_bps: 15000, annual_claim_limit: 2, replacement_value_cap_cents: 80000 }
              as: PlatformAdmin
              captures: { plan: $.data.id }
            - call: "POST /replacement-skus"
              payload: { model_name: "BOOK", msrp_cents: 90000, depreciation_rate_bps_per_month: 200, stock_on_hand: 5 }
              as: PlatformAdmin
              captures: { sku_book: $.data.id }
            - call: "POST /replacement-skus"
              payload: { model_name: "CAPPED", msrp_cents: 200000, depreciation_rate_bps_per_month: 100, stock_on_hand: 5 }
              as: PlatformAdmin
              captures: { sku_cap: $.data.id }
            - call: "POST /enrollments"
              payload: { customer_id: "${cust}", plan_id: "${plan}", imei: "356758901234560", device_model: "PhoneA", device_purchase_date: "2025-12-01T00:00:00Z", replacement_sku_id: "${sku_book}" }
              as: PlatformAdmin
              captures: { e_book: $.data.id }
            - call: "POST /enrollments"
              payload: { customer_id: "${cust}", plan_id: "${plan}", imei: "490154203237518", device_model: "PhoneB", device_purchase_date: "2025-12-01T00:00:00Z", replacement_sku_id: "${sku_cap}" }
              as: PlatformAdmin
              captures: { e_cap: $.data.id }
            - call: "POST /enrollments/${e_book}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /enrollments/${e_cap}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { e_cap_v: $.data.version }
            - call: "POST /claims"
              payload: { enrollment_id: "${e_book}", peril: "LOST", incident_at: "2026-05-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { cl_book: $.data.id }
            - call: "POST /claims/${cl_book}/screen"
              payload: {}
              as: ClaimsAdjuster
            - call: "GET /enrollments/${e_book}"
              payload: {}
              as: PlatformAdmin
              captures: { e_book_v: $.data.version }
            - call: "POST /claims/${cl_book}/approve"
              payload: { expected_enrollment_version: "${e_book_v}" }
              as: ClaimsAdjuster
            - call: "POST /claims"
              payload: { enrollment_id: "${e_cap}", peril: "LOST", incident_at: "2026-05-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { cl_cap: $.data.id }
            - call: "POST /claims/${cl_cap}/screen"
              payload: {}
              as: ClaimsAdjuster
            - call: "GET /enrollments/${e_cap}"
              payload: {}
              as: PlatformAdmin
              captures: { e_cap_v2: $.data.version }
            - call: "POST /claims/${cl_cap}/approve"
              payload: { expected_enrollment_version: "${e_cap_v2}" }
              as: ClaimsAdjuster
          trigger:
            - call: "POST /claims/${cl_book}/route"
              payload: {}
              as: ClaimsAdjuster
              captures: { rv_book: $.data.replacement_value_cents }
            - call: "POST /claims/${cl_cap}/route"
              payload: {}
              as: ClaimsAdjuster
              captures: { rv_cap: $.data.replacement_value_cents }
          assert:
            - "Claim.${cl_book}.replacement_value_cents == 79200"
            - "Claim.${cl_cap}.replacement_value_cents == 80000"
            - "Claim.${cl_book}.net_payout_cents == 64200"
            - "Claim.${cl_cap}.net_payout_cents == 65000"

      - name: fraud_velocity_review_vs_block_outcome_diverges
        grounds:
          - calculations.fraud_velocity
          - state_machines.Claim.SUBMITTED_to_UNDER_REVIEW
          - entities.FraudScreen.fields.outcome
          - entities.Customer.fields.risk_flag
        distinguishing_aspect: |
          Velocity scoring on the Customer domain (distinct from replacement_value's Claim domain):
          the 2nd in-window claim screens to REVIEW (count 2) while the 3rd screens to BLOCK
          (count 3) for the same customer — divergent outcome from the same aggregation formula.
        test_recipe:
          setup:
            - "Clock 2026-06-01. Customer C, ACTIVE enrollment E on SKU_BOOK/PLAN_STD."
            - "Two prior CRACKED claims already screened and DENIED (NO_COVERAGE), incident_at 2026-03-10 and 2026-04-10 (both inside 90d of the trigger claim)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { full_name: "C", carrier_account_number: "CA-DV-2" }
              as: PlatformAdmin
              captures: { cust: $.data.id }
            - call: "POST /plans"
              payload: { code: "PLAN_STD", monthly_premium_cents: 2000, base_deductible_cents: 10000, loss_deductible_multiplier_bps: 15000, annual_claim_limit: 2, replacement_value_cap_cents: 80000 }
              as: PlatformAdmin
              captures: { plan: $.data.id }
            - call: "POST /replacement-skus"
              payload: { model_name: "BOOK", msrp_cents: 90000, depreciation_rate_bps_per_month: 200, stock_on_hand: 5 }
              as: PlatformAdmin
              captures: { sku: $.data.id }
            - call: "POST /enrollments"
              payload: { customer_id: "${cust}", plan_id: "${plan}", imei: "356758901234560", device_model: "PhoneA", device_purchase_date: "2025-12-01T00:00:00Z", replacement_sku_id: "${sku}" }
              as: PlatformAdmin
              captures: { enr: $.data.id }
            - call: "POST /enrollments/${enr}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /claims"
              payload: { enrollment_id: "${enr}", peril: "CRACKED", incident_at: "2026-03-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /claims/${c1}/screen"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /claims/${c1}/deny"
              payload: { denial_reason: "NO_COVERAGE" }
              as: ClaimsAdjuster
            - call: "POST /claims"
              payload: { enrollment_id: "${enr}", peril: "CRACKED", incident_at: "2026-04-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { c2: $.data.id }
          trigger:
            - call: "POST /claims/${c2}/screen"
              payload: {}
              as: ClaimsAdjuster
              captures: { c2_status: $.data.status }
            - call: "POST /claims/${c2}/deny"
              payload: { denial_reason: "NO_COVERAGE" }
              as: ClaimsAdjuster
            - call: "POST /claims"
              payload: { enrollment_id: "${enr}", peril: "CRACKED", incident_at: "2026-05-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { c3: $.data.id }
            - call: "POST /claims/${c3}/screen"
              payload: {}
              as: ClaimsAdjuster
          assert:
            - "FraudScreen for ${c2} has outcome == REVIEW and velocity_count == 2"
            - "FraudScreen for ${c3} has outcome == BLOCK and velocity_count == 3"
            - "Customer.${cust}.risk_flag == BLOCKED after ${c3} screen"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: deductible_loss_tier_then_watch_surcharge_order
        grounds:
          - calculations.quote_deductible
          - state_machines.Claim.UNDER_REVIEW_to_APPROVED
          - entities.Claim.fields.deductible_cents
        distinguishing_aspect: |
          Mode (c) pinned-evaluation-order: tier_base (loss multiplier) is computed FIRST, then the
          25% WATCH surcharge is applied to that tier_base — not to the un-multiplied base. THEFT on a
          WATCH customer yields 15000 + 3750 = 18750, not 10000+2500 then *1.5.
        test_recipe:
          setup:
            - "Clock 2026-06-01. Customer C already at risk_flag=WATCH (a prior claim screened REVIEW)."
            - "ACTIVE enrollment on SKU_BOOK/PLAN_STD; a THEFT claim screened to PASS and ready to approve."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { full_name: "C", carrier_account_number: "CA-DV-3" }
              as: PlatformAdmin
              captures: { cust: $.data.id }
            - call: "POST /plans"
              payload: { code: "PLAN_STD", monthly_premium_cents: 2000, base_deductible_cents: 10000, loss_deductible_multiplier_bps: 15000, annual_claim_limit: 2, replacement_value_cap_cents: 80000 }
              as: PlatformAdmin
              captures: { plan: $.data.id }
            - call: "POST /replacement-skus"
              payload: { model_name: "BOOK", msrp_cents: 90000, depreciation_rate_bps_per_month: 200, stock_on_hand: 5 }
              as: PlatformAdmin
              captures: { sku: $.data.id }
            - call: "POST /enrollments"
              payload: { customer_id: "${cust}", plan_id: "${plan}", imei: "356758901234560", device_model: "PhoneA", device_purchase_date: "2025-12-01T00:00:00Z", replacement_sku_id: "${sku}" }
              as: PlatformAdmin
              captures: { enr: $.data.id }
            - call: "POST /enrollments/${enr}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /claims"
              payload: { enrollment_id: "${enr}", peril: "CRACKED", incident_at: "2026-03-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { cprev1: $.data.id }
            - call: "POST /claims/${cprev1}/screen"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /claims/${cprev1}/deny"
              payload: { denial_reason: "NO_COVERAGE" }
              as: ClaimsAdjuster
            - call: "POST /claims"
              payload: { enrollment_id: "${enr}", peril: "CRACKED", incident_at: "2026-04-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { cprev2: $.data.id }
            - call: "POST /claims/${cprev2}/screen"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /claims/${cprev2}/deny"
              payload: { denial_reason: "NO_COVERAGE" }
              as: ClaimsAdjuster
            - call: "POST /claims"
              payload: { enrollment_id: "${enr}", peril: "THEFT", incident_at: "2026-05-20T00:00:00Z", police_report_number: "PR-77" }
              as: PlatformAdmin
              captures: { cl: $.data.id }
            - call: "POST /claims/${cl}/screen"
              payload: {}
              as: ClaimsAdjuster
            - call: "GET /enrollments/${enr}"
              payload: {}
              as: PlatformAdmin
              captures: { enr_v: $.data.version }
          trigger:
            - call: "POST /claims/${cl}/approve"
              payload: { expected_enrollment_version: "${enr_v}" }
              as: ClaimsAdjuster
              captures: { ded: $.data.deductible_cents }
          assert:
            - "Customer.${cust}.risk_flag == WATCH at approval time"
            - "Claim.${cl}.deductible_cents == 18750"

      - name: replacement_value_floor_then_cap_nonlinear
        grounds:
          - calculations.replacement_value
          - state_machines.Claim.APPROVED_to_ROUTED_REPLACE
          - entities.Claim.fields.net_payout_cents
        distinguishing_aspect: |
          Mode (a) nested min/max with >=3 inputs: replacement_value = min(max(depreciated, FLOOR), cap)
          where depreciated derives from msrp, dep_rate, and age. With an over-depreciated SKU the
          max(.,FLOOR=5000) clamp binds first, then min(.,cap) leaves 5000 — distinct interaction from
          the order-of-operations mode of the sibling deductible instance.
        test_recipe:
          setup:
            - "Clock 2026-06-01. Customer C, ACTIVE enrollment on SKU_FLOOR (msrp 60000, dep 2000bps/mo) purchase 2025-12-01."
            - "A LOST claim screened PASS and approved (deductible 15000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { full_name: "C", carrier_account_number: "CA-DV-4" }
              as: PlatformAdmin
              captures: { cust: $.data.id }
            - call: "POST /plans"
              payload: { code: "PLAN_STD", monthly_premium_cents: 2000, base_deductible_cents: 10000, loss_deductible_multiplier_bps: 15000, annual_claim_limit: 2, replacement_value_cap_cents: 80000 }
              as: PlatformAdmin
              captures: { plan: $.data.id }
            - call: "POST /replacement-skus"
              payload: { model_name: "FLOOR", msrp_cents: 60000, depreciation_rate_bps_per_month: 2000, stock_on_hand: 5 }
              as: PlatformAdmin
              captures: { sku: $.data.id }
            - call: "POST /enrollments"
              payload: { customer_id: "${cust}", plan_id: "${plan}", imei: "356758901234560", device_model: "PhoneA", device_purchase_date: "2025-12-01T00:00:00Z", replacement_sku_id: "${sku}" }
              as: PlatformAdmin
              captures: { enr: $.data.id }
            - call: "POST /enrollments/${enr}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /claims"
              payload: { enrollment_id: "${enr}", peril: "LOST", incident_at: "2026-05-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { cl: $.data.id }
            - call: "POST /claims/${cl}/screen"
              payload: {}
              as: ClaimsAdjuster
            - call: "GET /enrollments/${enr}"
              payload: {}
              as: PlatformAdmin
              captures: { enr_v: $.data.version }
            - call: "POST /claims/${cl}/approve"
              payload: { expected_enrollment_version: "${enr_v}" }
              as: ClaimsAdjuster
          trigger:
            - call: "POST /claims/${cl}/route"
              payload: {}
              as: ClaimsAdjuster
              captures: { rv: $.data.replacement_value_cents }
          assert:
            - "Claim.${cl}.replacement_value_cents == 5000"
            - "Claim.${cl}.net_payout_cents == 0"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: claim_branch_fork_repair_vs_replace
        grounds:
          - state_machines.Claim.APPROVED_to_ROUTED_REPAIR
          - state_machines.Claim.APPROVED_to_ROUTED_REPLACE
          - entities.Claim.fields.routing
        distinguishing_aspect: |
          Claim's APPROVED state forks: a CRACKED claim with economical repair routes to ROUTED_REPAIR
          (creates RepairOrder, no stock change) while an over-cost CRACKED claim routes to
          ROUTED_REPLACE (creates AdvancedExchange, decrements stock) — divergent side-effect sets that
          rejoin at FULFILLED. Branching fork-join on the Claim entity.
        test_recipe:
          setup:
            - "Clock 2026-06-01. Two ACTIVE enrollments on SKU_BOOK/PLAN_STD (depreciated rv 79200), each with a CRACKED claim approved (deductible 10000)."
            - "Claim A routed with repair_cost_cents 30000 (<= 79200 -> REPAIR); claim B routed with repair_cost_cents 90000 (> 79200 -> REPLACE)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { full_name: "C", carrier_account_number: "CA-DV-5" }
              as: PlatformAdmin
              captures: { cust: $.data.id }
            - call: "POST /plans"
              payload: { code: "PLAN_STD", monthly_premium_cents: 2000, base_deductible_cents: 10000, loss_deductible_multiplier_bps: 15000, annual_claim_limit: 2, replacement_value_cap_cents: 80000 }
              as: PlatformAdmin
              captures: { plan: $.data.id }
            - call: "POST /replacement-skus"
              payload: { model_name: "BOOK", msrp_cents: 90000, depreciation_rate_bps_per_month: 200, stock_on_hand: 5 }
              as: PlatformAdmin
              captures: { sku: $.data.id }
            - call: "POST /enrollments"
              payload: { customer_id: "${cust}", plan_id: "${plan}", imei: "356758901234560", device_model: "PhoneA", device_purchase_date: "2025-12-01T00:00:00Z", replacement_sku_id: "${sku}" }
              as: PlatformAdmin
              captures: { e_a: $.data.id }
            - call: "POST /enrollments"
              payload: { customer_id: "${cust}", plan_id: "${plan}", imei: "490154203237518", device_model: "PhoneB", device_purchase_date: "2025-12-01T00:00:00Z", replacement_sku_id: "${sku}" }
              as: PlatformAdmin
              captures: { e_b: $.data.id }
            - call: "POST /enrollments/${e_a}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /enrollments/${e_b}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /claims"
              payload: { enrollment_id: "${e_a}", peril: "CRACKED", incident_at: "2026-05-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { cl_a: $.data.id }
            - call: "POST /claims/${cl_a}/screen"
              payload: {}
              as: ClaimsAdjuster
            - call: "GET /enrollments/${e_a}"
              payload: {}
              as: PlatformAdmin
              captures: { e_a_v: $.data.version }
            - call: "POST /claims/${cl_a}/approve"
              payload: { expected_enrollment_version: "${e_a_v}" }
              as: ClaimsAdjuster
            - call: "POST /claims"
              payload: { enrollment_id: "${e_b}", peril: "CRACKED", incident_at: "2026-05-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { cl_b: $.data.id }
            - call: "POST /claims/${cl_b}/screen"
              payload: {}
              as: ClaimsAdjuster
            - call: "GET /enrollments/${e_b}"
              payload: {}
              as: PlatformAdmin
              captures: { e_b_v: $.data.version }
            - call: "POST /claims/${cl_b}/approve"
              payload: { expected_enrollment_version: "${e_b_v}" }
              as: ClaimsAdjuster
          trigger:
            - call: "POST /claims/${cl_a}/route"
              payload: { repair_cost_cents: 30000 }
              as: ClaimsAdjuster
              captures: { route_a: $.data.routing }
            - call: "POST /claims/${cl_b}/route"
              payload: { repair_cost_cents: 90000 }
              as: ClaimsAdjuster
              captures: { route_b: $.data.routing }
          assert:
            - "Claim.${cl_a}.routing == REPAIR and Claim.${cl_a}.status == ROUTED_REPAIR"
            - "Claim.${cl_b}.routing == REPLACE and Claim.${cl_b}.status == ROUTED_REPLACE"
            - "A RepairOrder exists with claim_id == ${cl_a}; no AdvancedExchange exists for ${cl_a}"
            - "An AdvancedExchange exists with claim_id == ${cl_b}; ReplacementSku.${sku}.stock_on_hand == 4"

      - name: enrollment_suspend_reactivate_revert_loop
        grounds:
          - state_machines.Enrollment.ACTIVE_to_SUSPENDED
          - state_machines.Enrollment.SUSPENDED_to_ACTIVE
          - entities.Enrollment.fields.status
        distinguishing_aspect: |
          Enrollment (distinct entity from Claim) has a cycle ACTIVE -> SUSPENDED -> ACTIVE: suspend then
          reactivate returns to ACTIVE, demonstrating a revert loop rather than a one-way pipeline.
        test_recipe:
          setup:
            - "Clock 2026-06-01. An ACTIVE enrollment with cycle-0 premium invoice paid (premium_paid_through_cycle=0)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { full_name: "C", carrier_account_number: "CA-DV-6" }
              as: PlatformAdmin
              captures: { cust: $.data.id }
            - call: "POST /plans"
              payload: { code: "PLAN_STD", monthly_premium_cents: 2000, base_deductible_cents: 10000, loss_deductible_multiplier_bps: 15000, annual_claim_limit: 2, replacement_value_cap_cents: 80000 }
              as: PlatformAdmin
              captures: { plan: $.data.id }
            - call: "POST /replacement-skus"
              payload: { model_name: "BOOK", msrp_cents: 90000, depreciation_rate_bps_per_month: 200, stock_on_hand: 5 }
              as: PlatformAdmin
              captures: { sku: $.data.id }
            - call: "POST /enrollments"
              payload: { customer_id: "${cust}", plan_id: "${plan}", imei: "356758901234560", device_model: "PhoneA", device_purchase_date: "2025-12-01T00:00:00Z", replacement_sku_id: "${sku}" }
              as: PlatformAdmin
              captures: { enr: $.data.id }
            - call: "POST /enrollments/${enr}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /premium-invoices"
              payload: { enrollment_id: "${enr}", cycle_index: 0 }
              as: PlatformAdmin
              captures: { inv0: $.data.id }
            - call: "GET /enrollments/${enr}"
              payload: {}
              as: PlatformAdmin
              captures: { enr_v0: $.data.version }
            - call: "POST /premium-invoices/${inv0}/pay"
              payload: { expected_enrollment_version: "${enr_v0}" }
              as: PlatformAdmin
            - call: "POST /enrollments/${enr}/suspend"
              payload: {}
              as: PlatformAdmin
              captures: { susp_status: $.data.status }
          trigger:
            - call: "POST /enrollments/${enr}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { reactivated_status: $.data.status }
          assert:
            - "Enrollment.${enr}.status == SUSPENDED immediately after suspend"
            - "Enrollment.${enr}.status == ACTIVE after the reactivate trigger"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: claim_screen_block_cascade_depth3
        grounds:
          - state_machines.Claim.SUBMITTED_to_UNDER_REVIEW
          - calculations.fraud_velocity
          - entities.FraudScreen.fields.outcome
          - entities.Customer.fields.risk_flag
        distinguishing_aspect: |
          Depth-3 chain triggered by claim screen: screen -> creates FraudScreen (link1) ->
          FraudScreen.outcome=BLOCK -> sets Customer.risk_flag=BLOCKED (link2, caused by link1) ->
