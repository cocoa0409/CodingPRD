          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "A publish carrying a stale expected_landlord_version AND an overlapping window fails with ERR_STALE_VERSION (412) — the priority-5 concurrency check wins over the priority-10 constraint check, so the overlap error never surfaces."
        test_recipe:
          setup: ["Landlord ll (created -> version 1, captured ll_v); criteria C1 [2026-01-01, 2026-06-30] published (version advances to 2); criteria C2 with overlapping window [2026-06-15, 2026-12-31] in DRAFT"]
