              as: RegulatoryReviewer
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 and data.error_id == ERR_INSUFFICIENT_PERMISSIONS"

      - name: missing_auth_header_returns_400
        claim_type: Denied Operation
        grounds:
          - validations[priority=1]
          - errors.ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
        distinguishing_aspect: "A request with no X-User-Role / X-User-ID headers fails at priority 1 with 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER — before role, ownership, or existence checks."
        test_recipe:
