              payload: { plan_name: "Cycle Rollover", sponsor_name: "Corner Corp", plan_year: 2026, total_shares_outstanding: 1000000, vesting_schedule: "CLIFF_3YR", service_measurement_method: "TERMINATION_DATE_MEASURE", forfeiture_policy: "REALLOCATE_PRO_RATA", distribution_policy: "FIVE_YEAR_INSTALLMENT" }
