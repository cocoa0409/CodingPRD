  # ---------------------------------------------------------------------------
  # Section: endpoints
  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: spend_records_filtered_by_supplier
        claim_type: standard_crud
        grounds:
          - endpoints: "GET /api/v1/spend-records"
          - entities.SpendRecord.fields.supplier_id
        distinguishing_aspect: "The supplier_id filter narrows the list to exactly that supplier's records (2 of 3), with total_count reflecting the filtered set."
        test_recipe:
          setup: ["BU; suppliers A (2 records: 10000, 20000) and B (1 record: 30000)"]
          setup_api_calls:
            - call: "POST /api/v1/business-units"
              payload: { name: "Aerospace", code: "AERO", lead_user_id: "lead-1" }
              as: DiversityAdmin
              captures: { bu_id: $.data.id }
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "Filter A", tax_id: "T-FA", kind: "DIVERSE", contact_email: "a@x.com" }
              as: DiversityAnalyst
              captures: { sA: $.data.id }
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "Filter B", tax_id: "T-FB", kind: "PRIME", contact_email: "b@x.com" }
              as: DiversityAnalyst
              captures: { sB: $.data.id }
            - call: "POST /api/v1/spend-records"
              payload: { supplier_id: "${sA}", business_unit_id: "${bu_id}", amount_cents: 10000, transaction_date: "2026-02-01", payment_date: "2026-02-01" }
              as: DiversityAnalyst
            - call: "POST /api/v1/spend-records"
              payload: { supplier_id: "${sA}", business_unit_id: "${bu_id}", amount_cents: 20000, transaction_date: "2026-02-02", payment_date: "2026-02-02" }
              as: DiversityAnalyst
            - call: "POST /api/v1/spend-records"
              payload: { supplier_id: "${sB}", business_unit_id: "${bu_id}", amount_cents: 30000, transaction_date: "2026-02-03", payment_date: "2026-02-03" }
              as: DiversityAnalyst
          trigger:
            - call: "GET /api/v1/spend-records"
              payload: { supplier_id: "${sA}" }
              as: DiversityAnalyst
              captures: { first_amount: "$.data[0].amount_cents" }
          assert:
            - "Response total_count == 2 and has_more == false"
            - "Every returned record has supplier_id == ${sA}; the 30000 record of B is absent"

      - name: spend_records_pagination_defaults
        claim_type: listing
        grounds:
          - response_envelope.pagination_defaults
          - endpoints: "GET /api/v1/spend-records"
        distinguishing_aspect: "With 6 records and no params, default limit 10 returns all 6 (has_more false); with limit 5 the first page has 5 rows and has_more true, and offset 5 returns the 1 remainder."
        test_recipe:
          setup: ["BU; one supplier; six spend records"]
          setup_api_calls:
            - call: "POST /api/v1/business-units"
              payload: { name: "Aerospace", code: "AERO", lead_user_id: "lead-1" }
              as: DiversityAdmin
              captures: { bu_id: $.data.id }
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "Page Co", tax_id: "T-PAGE", kind: "DIVERSE", contact_email: "p@x.com" }
              as: DiversityAnalyst
              captures: { sup_id: $.data.id }
            - call: "POST /api/v1/spend-records"
              payload: { supplier_id: "${sup_id}", business_unit_id: "${bu_id}", amount_cents: 1001, transaction_date: "2026-02-01", payment_date: "2026-02-01" }
              as: DiversityAnalyst
            - call: "POST /api/v1/spend-records"
              payload: { supplier_id: "${sup_id}", business_unit_id: "${bu_id}", amount_cents: 1002, transaction_date: "2026-02-02", payment_date: "2026-02-02" }
              as: DiversityAnalyst
            - call: "POST /api/v1/spend-records"
              payload: { supplier_id: "${sup_id}", business_unit_id: "${bu_id}", amount_cents: 1003, transaction_date: "2026-02-03", payment_date: "2026-02-03" }
              as: DiversityAnalyst
            - call: "POST /api/v1/spend-records"
              payload: { supplier_id: "${sup_id}", business_unit_id: "${bu_id}", amount_cents: 1004, transaction_date: "2026-02-04", payment_date: "2026-02-04" }
              as: DiversityAnalyst
            - call: "POST /api/v1/spend-records"
              payload: { supplier_id: "${sup_id}", business_unit_id: "${bu_id}", amount_cents: 1005, transaction_date: "2026-02-05", payment_date: "2026-02-05" }
              as: DiversityAnalyst
            - call: "POST /api/v1/spend-records"
              payload: { supplier_id: "${sup_id}", business_unit_id: "${bu_id}", amount_cents: 1006, transaction_date: "2026-02-06", payment_date: "2026-02-06" }
              as: DiversityAnalyst
          trigger:
            - call: "GET /api/v1/spend-records"
              payload: { business_unit_id: "${bu_id}" }
              as: DiversityAnalyst
            - call: "GET /api/v1/spend-records"
              payload: { business_unit_id: "${bu_id}", limit: 5 }
              as: DiversityAnalyst
            - call: "GET /api/v1/spend-records"
              payload: { business_unit_id: "${bu_id}", limit: 5, offset: 5 }
              as: DiversityAnalyst
          assert:
            - "Unparametrized list: total_count == 6, 6 rows returned (default limit 10), has_more == false"
            - "limit=5: 5 rows, total_count == 6, has_more == true"
            - "limit=5&offset=5: exactly 1 row (the remainder), has_more == false"

      - name: certifications_list_scoped_to_owning_supplier
        claim_type: listing
        grounds:
          - endpoints: "GET /api/v1/suppliers/{id}/certifications"
          - entities.Certification.fields.supplier_id
        distinguishing_aspect: "The sub-resource list returns only the path supplier's certifications (2), never a sibling supplier's (1)."
        test_recipe:
          setup: ["Supplier A with two submitted certifications; supplier B with one"]
          setup_api_calls:
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "Scoped A", tax_id: "T-SCA", kind: "DIVERSE", contact_email: "a@x.com" }
              as: DiversityAnalyst
              captures: { sA: $.data.id }
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "Scoped B", tax_id: "T-SCB", kind: "DIVERSE", contact_email: "b@x.com" }
              as: DiversityAnalyst
              captures: { sB: $.data.id }
            - call: "POST /api/v1/suppliers/${sA}/certifications"
              payload: { cert_type: "MBE", certifying_body: "NMSDC", certificate_number: "M-SCA", valid_from: "2026-01-01", valid_to: "2026-12-31" }
              as: DiversityAnalyst
              as_user_id: analyst-1
            - call: "POST /api/v1/suppliers/${sA}/certifications"
              payload: { cert_type: "WBE", certifying_body: "WBENC", certificate_number: "W-SCA", valid_from: "2026-01-01", valid_to: "2026-12-31" }
              as: DiversityAnalyst
              as_user_id: analyst-1
            - call: "POST /api/v1/suppliers/${sB}/certifications"
              payload: { cert_type: "VET", certifying_body: "NVBDC", certificate_number: "V-SCB", valid_from: "2026-01-01", valid_to: "2026-12-31" }
