  # ---------------------------------------------------------------------------
  # Rule 8 — resource temporal-overlap with DIFFERENT interval semantics
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: route_stop_half_open_adjacency_allowed_overlap_rejected
        grounds:
          - calculations.route_window_overlap
          - errors[ERR_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Half-open semantics on SystemAsset as the resource: a stop whose
          window_start == existing window_end (back-to-back adjacency) is
          ACCEPTED, while a stop overlapping by one minute is rejected with
          ERR_WINDOW_CONFLICT — adjacency allowed, overlap forbidden.
        test_recipe:
          setup:
            - "Account, asset, PLANNED route R with one stop S1 at [2026-08-02T08:00:00Z, 2026-08-02T10:00:00Z)"
          setup_api_calls:
            - { call: "POST /wt/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /wt/accounts"
              payload: { account_name: "Window Co" }
              as: AccountManager
              captures: { c8a_acct: $.data.id }
            - call: "POST /wt/assets"
              payload: { account_id: "${c8a_acct}", asset_tag: "CT-W", asset_type: "COOLING_TOWER", recirculation_rate_gpm: 300, system_volume_gal: 6000, metallurgy: "MILD_STEEL" }
              as: WaterChemist
              captures: { c8a_asset: $.data.id }
            - call: "POST /wt/test-routes"
              payload: { account_id: "${c8a_acct}", route_name: "W-R" }
              as: WaterChemist
              captures: { c8a_rt: $.data.id }
            - call: "POST /wt/test-routes/${c8a_rt}/stops"
              payload: { asset_id: "${c8a_asset}", window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T10:00:00Z", sequence_index: 1 }
              as: WaterChemist
              captures: { c8a_s1: $.data.id }
          trigger:
            - call: "POST /wt/test-routes/${c8a_rt}/stops"
              payload: { asset_id: "${c8a_asset}", window_start: "2026-08-02T10:00:00Z", window_end: "2026-08-02T12:00:00Z", sequence_index: 2 }
              as: WaterChemist
              captures: { c8a_s2: $.data.id }
            - call: "POST /wt/test-routes/${c8a_rt}/stops"
              payload: { asset_id: "${c8a_asset}", window_start: "2026-08-02T11:59:00Z", window_end: "2026-08-02T13:00:00Z", sequence_index: 3 }
              as: WaterChemist
              captures: { c8a_err: $.data.error_id }
          assert:
            - "adjacent stop created: RouteStop.${c8a_s2}.status == SCHEDULED"
            - "overlapping stop error_id == ERR_WINDOW_CONFLICT"
            - "route has exactly 2 stops after the rejected insert"

      - name: coupon_interval_closed_plus_7day_buffer_adjacency_forbidden
        grounds:
          - calculations.coupon_interval_overlap
          - errors[ERR_COUPON_INTERVAL_CONFLICT]
        distinguishing_aspect: |
          Closed-interval + 7-day re-passivation buffer semantics on the
          rack-position resource: installing a coupon exactly 7 days after the
          previous coupon's removal is ACCEPTED (boundary inclusive), but 6
          days 23 hours after removal is REJECTED with
          ERR_COUPON_INTERVAL_CONFLICT — adjacency is forbidden here, the
          opposite of the route-stop rule, on a different resource entity.
        test_recipe:
          setup:
            - "Asset with INSTALLED rack RK; coupon C1 installed 2026-08-01T00:00:00Z position 1, removed at 2026-08-10T00:00:00Z (clock advanced)"
          setup_api_calls:
            - { call: "POST /wt/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /wt/accounts"
              payload: { account_name: "Buffer Co" }
              as: AccountManager
              captures: { c8b_acct: $.data.id }
            - call: "POST /wt/assets"
              payload: { account_id: "${c8b_acct}", asset_tag: "CT-BUF", asset_type: "COOLING_TOWER", recirculation_rate_gpm: 300, system_volume_gal: 6000, metallurgy: "MILD_STEEL" }
              as: WaterChemist
              captures: { c8b_asset: $.data.id }
            - call: "POST /wt/racks"
              payload: { asset_id: "${c8b_asset}", rack_code: "RK-B", position_count: 2 }
              as: WaterChemist
              captures: { c8b_rack: $.data.id }
            - call: "POST /wt/racks/${c8b_rack}/coupons"
              payload: { position_index: 1, alloy: "COPPER", density_g_cm3: 8.96, area_in2: 5.4, pre_weight_g: 40.0, installed_at: "2026-08-01T00:00:00Z" }
              as: WaterChemist
              captures: { c8b_c1: $.data.id }
            - { call: "POST /wt/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /wt/coupons/${c8b_c1}/remove", payload: { post_weight_g: 39.9 }, as: WaterChemist }
          trigger:
            - call: "POST /wt/racks/${c8b_rack}/coupons"
              payload: { position_index: 1, alloy: "COPPER", density_g_cm3: 8.96, area_in2: 5.4, pre_weight_g: 40.0, installed_at: "2026-08-16T23:00:00Z" }
              as: WaterChemist
              captures: { c8b_err: $.data.error_id }
            - call: "POST /wt/racks/${c8b_rack}/coupons"
              payload: { position_index: 1, alloy: "COPPER", density_g_cm3: 8.96, area_in2: 5.4, pre_weight_g: 40.0, installed_at: "2026-08-17T00:00:00Z" }
              as: WaterChemist
              captures: { c8b_c2: $.data.id }
          assert:
            - "6d23h-after-removal install error_id == ERR_COUPON_INTERVAL_CONFLICT"
            - "exactly-7d-after-removal install succeeds: CorrosionCoupon.${c8b_c2}.status == INSTALLED"
            - "CorrosionCoupon.${c8b_c1}.exposure_days == 9"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating-action invariants over DIFFERENT conserved quantities
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: tote_exchange_mass_conservation_per_station
        grounds:
          - state_machines.DeliveryOrder.IN_TRANSIT_to_DELIVERED
          - state_machines.DeliveryOrder.DELIVERED_to_CLOSED
          - entities.FeedStation.fields.inventory_gal
        distinguishing_aspect: |
          Conserved quantity: chemical mass per station. Forward action
          confirm-delivery (+110 gal) paired with compensating close
          (-4 gal residual) and telemetry consumption (40.0009 gal) leaves
          inventory_gal == 65.9991 = 110 - 4 - 40.0009 exactly; a second
          order CANCELLED from SCHEDULED moves nothing (release compensates
          the allocation), keeping the invariant intact.
        test_recipe:
          setup:
            - "Commissioned asset with ONLINE station FS (product container 55); order O1 delivered 110 gal and CLOSED with returned_residual 4; telemetry consumption 40.0009 gal in trailing window; order O2 created, submitted, scheduled, then cancelled; clock 2026-08-05T00:00:00Z"
          setup_api_calls:
            - { call: "POST /wt/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /wt/accounts"
              payload: { account_name: "Mass Co" }
              as: AccountManager
              captures: { c9a_acct: $.data.id }
            - call: "POST /wt/assets"
              payload: { account_id: "${c9a_acct}", asset_tag: "CT-M", asset_type: "COOLING_TOWER", recirculation_rate_gpm: 500, system_volume_gal: 9000, metallurgy: "MILD_STEEL" }
              as: WaterChemist
              captures: { c9a_asset: $.data.id }
            - call: "POST /wt/products"
              payload: { product_code: "M-INH", active_pct: 10, container_size_gal: 55, unit_price_cents_per_gal: 100, contract_price_cents_per_gal: 90 }
              as: PlatformAdmin
              captures: { c9a_prod: $.data.id }
            - call: "POST /wt/feed-stations"
              payload: { asset_id: "${c9a_asset}", product_id: "${c9a_prod}", capacity_cap_ml_per_min: 50 }
              as: WaterChemist
              captures: { c9a_fs: $.data.id }
            - call: "POST /wt/program-designs"
              payload: { asset_id: "${c9a_asset}" }
              as: WaterChemist
              captures: { c9a_pd: $.data.id }
            - { call: "POST /wt/program-designs/${c9a_pd}/record-survey", payload: { survey_notes: "s" }, as: WaterChemist }
            - { call: "POST /wt/program-designs/${c9a_pd}/draft", payload: { proposed_coc: 4.0, inhibitor_target_ppm: 5, ph_min: 7.0, ph_max: 9.5, conductivity_max_umhos: 4000, service_rate_cents_per_month: 0 }, as: WaterChemist }
            - call: "POST /wt/program-designs/${c9a_pd}/propose"
              payload: {}
              as: WaterChemist
              captures: { c9a_pd_v: $.data.version }
            - call: "POST /wt/program-designs/${c9a_pd}/accept"
              payload: { expected_program_design_version: "${c9a_pd_v}" }
              as: CustomerContact
              as_user_id: "${c9a_acct}"
            - { call: "POST /wt/feed-stations/${c9a_fs}/bring-online", payload: {}, as: WaterChemist }
            - { call: "POST /wt/assets/${c9a_asset}/commission", payload: {}, as: WaterChemist }
            - call: "POST /wt/delivery-orders"
              payload: { account_id: "${c9a_acct}", station_id: "${c9a_fs}", quantity_gal: 110 }
              as: AccountManager
              captures: { c9a_o1: $.data.id, c9a_o1_v: $.data.version }
            - { call: "POST /wt/delivery-orders/${c9a_o1}/submit", payload: {}, as: AccountManager }
            - { call: "POST /wt/delivery-orders/${c9a_o1}/schedule", payload: { scheduled_for: "2026-08-02T00:00:00Z", expected_delivery_order_version: "${c9a_o1_v}" }, as: AccountManager }
            - { call: "POST /wt/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /wt/delivery-orders/${c9a_o1}/dispatch", payload: {}, as: AccountManager }
            - { call: "POST /wt/delivery-orders/${c9a_o1}/confirm-delivery", payload: { delivered_gal: 110 }, as: WaterChemist }
            - { call: "POST /wt/delivery-orders/${c9a_o1}/close", payload: { returned_residual_gal: 4 }, as: WaterChemist }
            - { call: "POST /wt/feed-stations/${c9a_fs}/telemetry", payload: { recorded_at: "2026-08-02T06:00:00Z", feed_pulses: 7571, ml_per_pulse: 5.0, level_gal: 100 }, as: WaterChemist }
            - { call: "POST /wt/feed-stations/${c9a_fs}/telemetry", payload: { recorded_at: "2026-08-03T06:00:00Z", feed_pulses: 7571, ml_per_pulse: 5.0, level_gal: 95 }, as: WaterChemist }
            - { call: "POST /wt/feed-stations/${c9a_fs}/telemetry", payload: { recorded_at: "2026-08-04T06:00:00Z", feed_pulses: 7571, ml_per_pulse: 5.0, level_gal: 90 }, as: WaterChemist }
            - { call: "POST /wt/feed-stations/${c9a_fs}/telemetry", payload: { recorded_at: "2026-08-04T18:00:00Z", feed_pulses: 7571, ml_per_pulse: 5.0, level_gal: 85 }, as: WaterChemist }
