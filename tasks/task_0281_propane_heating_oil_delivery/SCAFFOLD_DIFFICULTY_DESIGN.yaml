            - call: "POST /accounts/${acct_id}/delivery-orders/${order_id}/assign"
              payload: { route_id: "${route_id}" }
              as: Dispatcher
            - call: "POST /trucks/${truck_id}/routes/${route_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /tanks/${tank_id}/inspections"
              payload: { result: "FAILED", inspected_at: "2026-01-02T00:00:00Z" }
              as: Inspector
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: AccountManager
