              as: FrontDeskClerk
              captures: { pat: $.data.id }
            - call: "POST /coverages"
              payload: { patient_id: "${pat}", coverage_type: "SELF_PAY" }
              as: FrontDeskClerk
            - call: "POST /clinics/${c}/queue-entries/${qe}/mark-ready"
              payload: {}
              as: FrontDeskClerk
            - call: "POST /clinics/${c}/exam-rooms/${room}/take-offline"
              payload: {}
              as: ClinicManager
            - call: "GET /clinics/${c}"
              payload: {}
              as: Provider
              captures: { cv: $.data.version }
          trigger:
            - call: "POST /visits"
