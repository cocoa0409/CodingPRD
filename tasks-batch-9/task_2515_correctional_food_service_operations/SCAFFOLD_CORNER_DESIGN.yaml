            - "${medical_error} == ERR_CLINICAL_INDICATION_REQUIRED with HTTP 422"
            - "DietOrder.${medical_order}.status == PENDING_VERIFICATION and version == 1"
            - "Two orders of different order_type may cover the same window for one inmate, because the conflict rule in calculations.diet_order_coverage_window is scoped per order_type"

