        excluded_because:
          difficulty_instance: non_linear_state_machine / faculty_dossier_and_appointment_dimensions_move_independently
          rationale: "The deficiency-code ordering and the single-pass fixed point across repudiation and cure are asserted there."

      - name: coursework_threshold_probed_at_and_below_the_minimum
        claim_type: threshold
        grounds: [calculations.assignment_qualification_determination.constants]
        excluded_because:
          difficulty_instance: boundary_precision_check / coursework_hours_exactly_at_eighteen_qualifies_seventeen_does_not
          rationale: "18 (inclusive pass) and 17 (fail) on the same section are asserted there."

  # ===========================================================================
  # VALIDATIONS
  # ===========================================================================
  - section: validations
    instances:
      - name: every_uniqueness_rule_rejects_its_own_duplicate_key
        claim_type: violation_to_error
        grounds:
          - validations[priority=19].ERR_DUPLICATE_DISCIPLINE_CODE
          - validations[priority=20].ERR_DUPLICATE_TERM_CODE
          - validations[priority=21].ERR_DUPLICATE_FACULTY_EMAIL
          - validations[priority=22].ERR_DUPLICATE_ASSIGNMENT
          - validations[priority=23].ERR_DUPLICATE_ROSTER
        distinguishing_aspect: |
          All five uniqueness keys are probed in one fixture so each returns its own code rather
          than a shared duplicate error, and the assignment key is proven to be the composite
          (section, faculty) pair — the same faculty on a different section is accepted in the
          same run that the repeat pair is rejected.
        test_recipe:
          setup:
            - "Communication 09.01, Journalism 09.04, Public Relations 09.02, term 2026FA, both programs and Morgan Ellis (morgan.ellis@example.edu) exist."
            - "Morgan Ellis is INSTRUCTOR_OF_RECORD of the DEGREE_FIELD program's MONDAY section, and a DRAFT roster exists for (DEGREE_FIELD program, 2026FA)."
          setup_api_calls:
            - *c_clock
            - *c_comm
            - *c_journ
            - *c_pr
            - *c_prog_df
            - *c_prog_cw
            - *c_term
            - *c_term_open
            - *c_fac_m
            - *c_rec_m_journ
            - *c_tr_m_journ
            - *c_vf_m_journ
            - *c_sec_df
            - *c_sec_df_b
            - *c_asn_m_df
            - *c_roster_df
          trigger:
            - call: "POST /disciplines"
              payload: { code: "09.04", name: "Journalism Studies", required_terminal_degree_level: MASTERS, min_graduate_credit_hours: 18 }
              as: SystemAdmin
              as_user_id: "admin-01"
              captures: { e_disc: $.data.error_id }
            - call: "POST /terms"
              payload: { code: "2026FA", start_date: "2027-01-10", end_date: "2027-05-10", census_date: "2027-01-25" }
              as: SystemAdmin
              as_user_id: "admin-01"
              captures: { e_term: $.data.error_id }
            - call: "POST /faculty-members"
              payload: { full_name: "Morgan Ellis II", email: "morgan.ellis@example.edu", employment_class: ADJUNCT, home_program_id: "${prog_df_id}" }
              as: RegistrarOfficer
              as_user_id: "registrar-01"
              captures: { e_email: $.data.error_id }
            - call: "GET /course-sections/${sec_df_id}"
              payload: {}
              as: RegistrarOfficer
              as_user_id: "registrar-01"
              captures: { sec_df_v2: $.data.version }
            - call: "POST /course-assignments"
              payload: { course_section_id: "${sec_df_id}", faculty_member_id: "${fac_m_id}", assignment_role: CO_INSTRUCTOR, expected_section_version: "${sec_df_v2}" }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
              captures: { e_asn: $.data.error_id }
            - call: "POST /course-assignments"
              payload: { course_section_id: "${sec_df_b_id}", faculty_member_id: "${fac_m_id}", assignment_role: INSTRUCTOR_OF_RECORD, expected_section_version: "${sec_df_b_v}" }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
              captures: { asn_ok_id: $.data.id }
            - call: "POST /faculty-rosters"
              payload: { program_id: "${prog_df_id}", term_id: "${term_id}" }
              as: AccreditationLiaison
              as_user_id: "liaison-01"
              captures: { e_roster: $.data.error_id }
          assert:
            - "e_disc == ERR_DUPLICATE_DISCIPLINE_CODE with HTTP 409 — the name differs but the code 09.04 collides"
            - "e_term == ERR_DUPLICATE_TERM_CODE with HTTP 409"
            - "e_email == ERR_DUPLICATE_FACULTY_EMAIL with HTTP 409 — email uniqueness ignores full_name"
            - "e_asn == ERR_DUPLICATE_ASSIGNMENT with HTTP 409 — the (section, faculty) pair repeats even though assignment_role differs"
            - "asn_ok_id is a created assignment (HTTP 201) — the same faculty on a different section is not a duplicate"
            - "e_roster == ERR_DUPLICATE_ROSTER with HTTP 409 — the existing roster is still DRAFT"
            - "CourseSection.${sec_df_id}.version == ${sec_df_v2} — the rejected assignment did not bump it, while ${sec_df_b_id}.version advanced by the accepted one"

      - name: discipline_reparent_rejects_self_and_ancestor_targets
        claim_type: violation_to_error
        grounds:
          - validations[priority=18].ERR_DISCIPLINE_CYCLE
          - endpoints[POST /disciplines/{disciplineId}]
        distinguishing_aspect: |
          The cycle check must walk the whole ancestor chain, not just compare one hop: pointing
          Communication at its own grandchild Broadcast is rejected exactly like pointing
          Journalism at itself, while an unrelated re-parent in the same run succeeds.
        test_recipe:
          setup:
            - "The chain Communication 09.01 -> Journalism 09.04 -> Broadcast Journalism 09.05 exists."
            - "Public Relations 09.02 is a root discipline with no parent."
          setup_api_calls:
            - *c_clock
            - *c_comm
            - *c_journ
            - *c_pr
            - call: "POST /disciplines"
              payload: { code: "09.05", name: "Broadcast Journalism", parent_discipline_id: "${journ_id}", required_terminal_degree_level: MASTERS, min_graduate_credit_hours: 18 }
              as: SystemAdmin
              as_user_id: "admin-01"
              captures: { bcast_id: $.data.id, bcast_v: $.data.version }
            - call: "GET /disciplines/${comm_id}"
              payload: {}
              as: SystemAdmin
              as_user_id: "admin-01"
              captures: { comm_v: $.data.version }
            - call: "GET /disciplines/${journ_id}"
              payload: {}
              as: SystemAdmin
              as_user_id: "admin-01"
              captures: { journ_v: $.data.version }
            - call: "GET /disciplines/${pr_id}"
              payload: {}
              as: SystemAdmin
              as_user_id: "admin-01"
              captures: { pr_v: $.data.version }
          trigger:
            - call: "POST /disciplines/${journ_id}"
              payload: { parent_discipline_id: "${journ_id}" }
              as: SystemAdmin
              as_user_id: "admin-01"
              captures: { e_self: $.data.error_id }
            - call: "POST /disciplines/${comm_id}"
              payload: { parent_discipline_id: "${bcast_id}" }
              as: SystemAdmin
              as_user_id: "admin-01"
              captures: { e_cycle: $.data.error_id }
            - call: "POST /disciplines/${pr_id}"
              payload: { parent_discipline_id: "${comm_id}" }
              as: SystemAdmin
              as_user_id: "admin-01"
              captures: { pr_parent: $.data.parent_discipline_id }
          assert:
            - "e_self == ERR_DISCIPLINE_CYCLE with HTTP 409 — a discipline cannot be its own parent"
            - "e_cycle == ERR_DISCIPLINE_CYCLE with HTTP 409 — Broadcast is two hops below Communication, so the walk must climb past Journalism to find the cycle"
            - "Discipline.${comm_id}.parent_discipline_id is still null and Discipline.${comm_id}.version == ${comm_v} — the rejected write changed nothing"
            - "pr_parent == ${comm_id} — an acyclic re-parent in the same fixture is accepted with HTTP 200"
            - "Discipline.${journ_id}.parent_discipline_id is still ${comm_id} and version == ${journ_v}"

      - name: temporal_guards_reject_future_pd_closed_contract_window_and_late_response
        claim_type: violation_to_error
        grounds:
          - validations[priority=30].ERR_PD_DATE_IN_FUTURE
          - validations[priority=28].ERR_CONTRACT_WINDOW_CLOSED
          - validations[priority=29].ERR_RESPONSE_WINDOW_CLOSED
        distinguishing_aspect: |
          Three independent clock comparisons are probed against three different reference dates in
          one run — the current date for a PD activity, Term.start_date for contract issuance and
          AccreditorReview.response_due_date for the remediation response — so a single
          "is it in the past" helper cannot satisfy all three.
        test_recipe:
          setup:
            - "The clock starts at 2026-08-01T00:00:00Z; term 2026FA runs 2026-09-15..2026-12-20 and is OPEN."
            - "Dana Reyes is a CREDENTIALED_ELIGIBLE ADJUNCT with a VERIFIED dossier (Public Relations MASTERS, official transcript)."
            - "Alex Stone is EXCEPTION_FLAGGED on a 3-credit Journalism section of the DEGREE_FIELD program and that program's roster has been generated."
            - "A COMPREHENSIVE review runs 2026-07-25..2026-08-10; findings issued at clock 2026-08-01 put it in REMEDIATION_REQUIRED with a response_due_date computed from its risk tier."
          setup_api_calls:
            - *c_clock
            - *c_comm
            - *c_journ
            - *c_pr
            - *c_prog_df
            - *c_prog_cw
            - *c_term
            - *c_term_open
            - *c_fac_d
            - *c_rec_d_pr
            - *c_tr_d_pr
            - *c_vf_d_pr
            - *c_fac_x
            - *c_rec_x_pr
            - *c_tr_x_pr
            - *c_vf_x_pr
            - *c_sec_df_b
            - *c_asn_x_df_b
            - *c_roster_df
            - *c_roster_df_gen
            - *c_review_df
            - *c_review_df_start
            - call: "POST /accreditor-reviews/${review_df_id}/findings"
              payload: { finding_count: 1, narrative: "One unqualified instructor of record" }
              as: AccreditorReviewer
              as_user_id: "reviewer-01"
              captures: { review_due: $.data.response_due_date }
            - call: "GET /faculty-members/${fac_d_id}"
              payload: {}
              as: RegistrarOfficer
              as_user_id: "registrar-01"
              captures: { fac_d_v: $.data.version }
          trigger:
            - call: "POST /pd-records"
              payload: { faculty_member_id: "${fac_d_id}", discipline_id: "${pr_id}", activity_type: CONFERENCE, contact_hours: 4.0, activity_date: "2026-08-02" }
              as: RegistrarOfficer
              as_user_id: "registrar-01"
              captures: { e_pd: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-01"
            - call: "POST /faculty-contracts"
              payload: { faculty_member_id: "${fac_d_id}", term_id: "${term_id}", employment_class: ADJUNCT, contract_credit_hours: 6, expected_faculty_version: "${fac_d_v}" }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
              captures: { e_contract: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-05T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-01"
            - call: "POST /accreditor-reviews/${review_df_id}/response"
              payload: { response_narrative: "Remediation plan attached." }
              as: AccreditationLiaison
              as_user_id: "liaison-01"
              captures: { e_resp: $.data.error_id }
          assert:
            - "e_pd == ERR_PD_DATE_IN_FUTURE with HTTP 400 — activity_date 2026-08-02 is one day after the pinned clock date 2026-08-01"
            - "e_contract == ERR_CONTRACT_WINDOW_CLOSED with HTTP 409 — the clock date 2026-09-15 is NOT strictly before Term.start_date 2026-09-15, so the window closes exactly on the first instructional day even though the faculty is CREDENTIALED_ELIGIBLE and the version is current"
            - "e_resp == ERR_RESPONSE_WINDOW_CLOSED with HTTP 409 — 2027-01-05 is past review_due (2026-08-01 + the tier response days, at most 90 days = 2026-10-30)"
            - "No FacultyContract row exists for (${fac_d_id}, ${term_id}) and FacultyMember.${fac_d_id}.appointment_status is still CREDENTIALED_ELIGIBLE with version == ${fac_d_v}"
            - "AccreditorReview.${review_df_id}.status is still REMEDIATION_REQUIRED with response_round == 0"
            - "ProfessionalDevelopmentRecord rows for ${fac_d_id} number zero and FacultyMember.${fac_d_id}.pd_hours_current_cycle == 0.0"

      - name: dossier_and_foreign_credential_preconditions_block_downstream_writes
