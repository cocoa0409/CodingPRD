            - call: "GET /stop-loss-reimbursements?stop_loss_policy_id=${pol}"
              payload: {}
              as: Auditor
          assert:
            - "data array contains exactly 1 StopLossReimbursement with reimbursement_type == SPECIFIC and amount_cents == 500000"

      - name: create_second_check_run_with_same_claim_returns_already_in_check_run
        claim_type: Conditional action
        grounds: ["validations[priority=4]", "errors[ERR_CLAIM_ALREADY_IN_CHECK_RUN]"]
        distinguishing_aspect: "A claim already held by a DRAFT check-run cannot be placed into a second check-run: POST /check-runs returns 409 ERR_CLAIM_ALREADY_IN_CHECK_RUN."
        test_recipe:
          setup: ["Plan (ded 0); provider; member; adjudicated claim; fund; one DRAFT check-run over the claim."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { sponsor_name: "Acme", sponsor_tax_id: "11-1111111", plan_year_start: "2026-01-01", plan_year_end: "2026-12-31", individual_deductible_cents: 0, oop_max_cents: 500000, plan_coinsurance_pct: 0.80, run_out_days: 90 }
