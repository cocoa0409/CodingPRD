            - "trigger call 3 -> 201: the identical 299 bp is legal at SILVER, whose floor is 200, and response_hours == 24"
            - "GET /service-contracts?project_id=${pj1} returns an empty page"
            - "both created contracts: spare_required_count == 1 (ceil(1 x bp / 10000) over a single-module project) and contract_state == PENDING"

      - name: a_project_may_carry_only_one_service_contract
        claim_type: violation_to_error
        grounds:
          - validations[priority=41]
          - errors.ERR_CONTRACT_ALREADY_EXISTS
        distinguishing_aspect: |
          The uniqueness is on the project, irrespective of tier or state: a second
          contract is refused even when it names a different tier, and even though
          the first contract is only PENDING rather than ACTIVE. That makes
          DisplayProject.service_posture a well-defined single-source field and
          keeps the SLA clock unambiguous.
        test_recipe:
          setup:
            - "An FP10-IN project ${pj} with one PENDING BRONZE contract ${sc}."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlantAdmin
