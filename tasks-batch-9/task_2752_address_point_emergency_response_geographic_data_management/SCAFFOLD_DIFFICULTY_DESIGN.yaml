  # ===========================================================================
  # RULE 3 — non_linear_state_machine (2 instances, different entities:
  #          DiscrepancyCase (cyclic) and AddressAssignmentRequest (parallel))
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: discrepancy_case_proposal_counter_cycle_two_rounds
        grounds:
          - state_machines.DiscrepancyCase
          - calculations.discrepancy_proposal_projection
          - entities.DiscrepancyCase.fields.status
          - entities.DiscrepancyCase.fields.round_count
          - entities.DiscrepancyCase.fields.current_proposal_id
          - endpoints.POST_/gis/discrepancy-cases/{id}/proposals
        distinguishing_aspect: |
          The case does not advance monotonically: it walks OPEN -> PROPOSAL_PENDING -> COUNTERED
          -> PROPOSAL_PENDING, RE-ENTERING a state it already left, and which state the third
          filing lands in depends on which side authored the previous proposal rather than on
          round_count. A linear implementation that treats each filing as "next stage" cannot
          return to PROPOSAL_PENDING at round 3.
        test_recipe:
          setup:
            - "Jurisdiction LARCO with one DRAFT RoadCenterline 'N MAPLE STREET'."
            - "Two ACTIVE agencies in LARCO: LAW (the opener) and FIRE (the counterparty)."
            - "One DiscrepancyCase on subject_type ROAD_NAME over that centerline, opened by the LAW liaison with FIRE as counterparty, status OPEN, round_count 0, current_proposal_id null."
            - "MAX_PROPOSAL_ROUNDS is 3, so filings 1..3 stay inside the negotiation cycle and none of them escalates."
            - "The case version is re-read with GET before each filing because DiscrepancyProposal is append-only and carries no version field of its own."
          setup_api_calls:
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
            - call: "POST /gis/agencies"
              payload: { name: "Larimer County Sheriff", agency_type: "LAW", jurisdiction_id: "${j_id}" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { law_id: $.data.id }
            - call: "POST /gis/agencies"
              payload: { name: "Poudre Fire Authority", agency_type: "FIRE", jurisdiction_id: "${j_id}" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { fire_id: $.data.id }
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "N MAPLE STREET", jurisdiction_id: "${j_id}", from_addr_left: 100, to_addr_left: 198, parity_left: "EVEN", from_addr_right: 101, to_addr_right: 199, parity_right: "ODD" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { road_id: $.data.id }
            - call: "POST /gis/discrepancy-cases"
              payload: { subject_type: "ROAD_NAME", subject_ref_id: "${road_id}", counterparty_agency_id: "${fire_id}", description: "Sheriff CAD carries N MAPLE ST, fire RMS carries N MAPLE AVE" }
              as: AgencyLiaison
              as_user_id: "${law_id}"
              captures: { case_id: $.data.id, case_v0: $.data.version }
            - call: "POST /gis/discrepancy-cases/${case_id}/proposals"
              payload: { proposed_value: "N MAPLE STREET", expected_case_version: "${case_v0}", rationale: "Round 1 filed by the opener" }
              as: AgencyLiaison
              as_user_id: "${law_id}"
              captures: { p1_id: $.data.id }
            - call: "GET /gis/discrepancy-cases/${case_id}"
              payload: {}
              as: AgencyLiaison
              as_user_id: "${fire_id}"
              captures: { case_v1: $.data.version }
            - call: "POST /gis/discrepancy-cases/${case_id}/proposals"
              payload: { proposed_value: "N MAPLE AVE", expected_case_version: "${case_v1}", rationale: "Round 2 counter filed by the counterparty" }
              as: AgencyLiaison
              as_user_id: "${fire_id}"
              captures: { p2_id: $.data.id }
            - call: "GET /gis/discrepancy-cases/${case_id}"
              payload: {}
              as: AgencyLiaison
              as_user_id: "${law_id}"
              captures: { case_v2: $.data.version }
          trigger:
            - call: "POST /gis/discrepancy-cases/${case_id}/proposals"
              payload: { proposed_value: "N MAPLE STREET", expected_case_version: "${case_v2}", rationale: "Round 3 re-filed by the opener" }
              as: AgencyLiaison
              as_user_id: "${law_id}"
              captures: { p3_id: $.data.id }
          assert:
            - "DiscrepancyCase.${case_id}.status == \"PROPOSAL_PENDING\"   # re-entered, NOT a new forward stage"
            - "DiscrepancyCase.${case_id}.round_count == 3"
            - "DiscrepancyCase.${case_id}.current_proposal_id == \"${p3_id}\""
            - "DiscrepancyCase.${case_id}.escalated_at == null   # round_count reached MAX_PROPOSAL_ROUNDS but did not exceed it"
            - "DiscrepancyProposal.${p1_id}.round_number == 1"
            - "DiscrepancyProposal.${p1_id}.proposed_by_side == \"OPENER\""
            - "DiscrepancyProposal.${p1_id}.status == \"COUNTERED\""
            - "DiscrepancyProposal.${p2_id}.round_number == 2"
            - "DiscrepancyProposal.${p2_id}.proposed_by_side == \"COUNTERPARTY\""
            - "DiscrepancyProposal.${p2_id}.status == \"COUNTERED\""
            - "DiscrepancyProposal.${p3_id}.round_number == 3"
            - "DiscrepancyProposal.${p3_id}.proposed_by_side == \"OPENER\""
            - "DiscrepancyProposal.${p3_id}.status == \"PENDING\""
            - "RoadCenterline.${road_id}.open_discrepancy_case_count == 1"

      - name: assignment_request_parallel_review_and_utility_dimensions
        grounds:
          - state_machines.AddressAssignmentRequest
          - entities.AddressAssignmentRequest.fields.review_status
          - entities.AddressAssignmentRequest.fields.utility_status
          - entities.AddressAssignmentRequest.fields.fulfillment_status
          - calculations.next_house_number_selection
          - calculations.assignable_slot_count
        distinguishing_aspect: |
          Three parallel dimensions move independently and the derived join is recomputed after
          every one of them: a UTILITY_HELD decision DEMOTES fulfillment_status from
          READY_TO_ASSIGN back to OPEN while review_status stays GIS_APPROVED, and a second CLEAR
          re-promotes it. The entity is AddressAssignmentRequest and the non-linearity is the
          parallel-dimension demote/re-promote, not the DiscrepancyCase proposal cycle.
        test_recipe:
          setup:
            - "Jurisdiction LARCO (postal_city FORT COLLINS) with one CoverageCell C001."
            - "One VALIDATED RoadCenterline 'N MAPLE STREET', LEFT range [100,198] EVEN, carrying no address points, so assignable_slot_count_left is 50."
            - "One AddressAssignmentRequest for permit BP-2026-0001 on that centerline, side LEFT, requested_unit_count 2, no proposed_house_number."
            - "The utility dimension has already been CLEARED while the GIS review dimension is still PENDING_REVIEW, so fulfillment_status is still OPEN — one cleared dimension is not enough."
          setup_api_calls:
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
            - call: "POST /gis/coverage-cells"
              payload: { cell_code: "C001", jurisdiction_id: "${j_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { cell_id: $.data.id }
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "N MAPLE STREET", jurisdiction_id: "${j_id}", from_addr_left: 100, to_addr_left: 198, parity_left: "EVEN", from_addr_right: 101, to_addr_right: 199, parity_right: "ODD" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { road_id: $.data.id }
            - call: "POST /gis/road-centerlines/${road_id}/validate"
              payload: {}
              as: GisAnalyst
              as_user_id: "analyst-1"
            - call: "POST /gis/address-assignment-requests"
              payload: { permit_number: "BP-2026-0001", parcel_id: "8712300045", road_centerline_id: "${road_id}", side: "LEFT", requested_unit_count: 2 }
              as: PermitCoordinator
              as_user_id: "permit-1"
              captures: { req_id: $.data.id }
            - call: "POST /gis/address-assignment-requests/${req_id}/utility-clearance"
              payload: { decision: "CLEAR", utility_note: "Water and sewer taps confirmed available" }
              as: PermitCoordinator
              as_user_id: "permit-1"
          trigger:
            - call: "POST /gis/address-assignment-requests/${req_id}/gis-review"
              payload: { decision: "APPROVE", review_note: "Parcel fronts the LEFT side; range has capacity" }
              as: GisAnalyst
              as_user_id: "analyst-1"
            - call: "POST /gis/address-assignment-requests/${req_id}/utility-clearance"
              payload: { decision: "HOLD", utility_note: "Dry-utility conflict discovered after approval" }
              as: PermitCoordinator
              as_user_id: "permit-1"
            - call: "POST /gis/address-assignment-requests/${req_id}/utility-clearance"
              payload: { decision: "CLEAR", utility_note: "Conflict resolved; hold lifted" }
              as: PermitCoordinator
              as_user_id: "permit-1"
            - call: "POST /gis/address-assignment-requests/${req_id}/assign"
              payload: {}
              as: GisAnalyst
              as_user_id: "analyst-1"
          assert:
            - "AddressAssignmentRequest.${req_id}.review_status == \"GIS_APPROVED\"   # untouched by the utility HOLD"
            - "AddressAssignmentRequest.${req_id}.utility_status == \"UTILITY_CLEARED\""
            - "AddressAssignmentRequest.${req_id}.fulfillment_status == \"FULFILLED\""
            - "AddressAssignmentRequest.${req_id}.assigned_house_number == 100   # min of the closed EVEN candidate set [100,198]"
            - "AddressAssignmentRequest.${req_id}.minted_point_count == 3   # 1 base + 2 units"
            - "AddressAssignmentRequest.${req_id}.assigned_address_point_id != null"
            - "RoadCenterline.${road_id}.assignable_slot_count_left == 49   # capacity 50 minus the single base point; units consume none"
            - "GET /gis/address-points?road_centerline_id=${road_id} total_count == 3"

  # ===========================================================================
  # RULE 4 — transitive_cascade (2 instances, different triggering transitions:
  #          RoadCenterline PUBLISHED->RETIRED (5 levels) and
  #          DiscrepancyCase CONCURRED->ADOPTED (5 levels))
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: road_retire_cascades_points_units_pins_package
        grounds:
          - state_machines.RoadCenterline.PUBLISHED_to_RETIRED
          - state_machines.AddressPoint.system_retire
          - calculations.package_record_pin_set
          - calculations.assignable_slot_count
          - entities.ProvisioningPackage.fields.invalidated_reason
          - cascade_rules.PIN_STALENESS_RULE
        distinguishing_aspect: |
          A single retire call propagates five levels deep: road RETIRED (1) -> base point
          ROAD_RETIRED (2) -> its subaddress unit PARENT_RETIRED (3, reachable ONLY through the
          parent) -> all three FRESH pins flip to STALE (4) -> the SEALED ProvisioningPackage
          becomes INVALIDATED with invalidated_reason PIN_STALE (5). The triggering transition is
          a road retirement, not a discrepancy adoption.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Jurisdiction LARCO (postal_city FORT COLLINS) with one CoverageCell C001 and no agencies or boundaries at all, so the in-scope record set is exactly the road plus its two address points."
            - "RoadCenterline 'N MAPLE STREET' PUBLISHED."
            - "One ACTIVE base AddressPoint at 100 LEFT (PARCEL, geometry_verified true, postal FORT COLLINS) and one ACTIVE subaddress unit '1' of unit_type UNIT beneath it."
            - "A ROAD-scoped QcValidationReport over the centerline with zero defects, CERTIFIED (quality_score 100.00, is_provisioning_eligible true)."
            - "A MAPPING ProvisioningPackage on that report, SEALED with package_version 1 and exactly three FRESH pins (one ROAD_CENTERLINE, two ADDRESS_POINT), stale_pin_count 0, drift_detected false."
          setup_api_calls:
            - call: "POST /gis/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
            - call: "POST /gis/coverage-cells"
              payload: { cell_code: "C001", jurisdiction_id: "${j_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { cell_id: $.data.id }
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "N MAPLE STREET", jurisdiction_id: "${j_id}", from_addr_left: 100, to_addr_left: 198, parity_left: "EVEN", from_addr_right: 101, to_addr_right: 199, parity_right: "ODD" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { road_id: $.data.id }
            - call: "POST /gis/address-points"
              payload: { house_number: 100, road_centerline_id: "${road_id}", side: "LEFT", source: "PARCEL", postal_city: "FORT COLLINS", cell_id: "${cell_id}", geometry_verified: true }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { base_id: $.data.id }
            - call: "POST /gis/road-centerlines/${road_id}/validate"
              payload: {}
              as: GisAnalyst
              as_user_id: "analyst-1"
            - call: "POST /gis/road-centerlines/${road_id}/publish"
              payload: {}
              as: QcCertifier
              as_user_id: "qc-1"
            - call: "POST /gis/address-points/${base_id}/activate"
              payload: {}
              as: GisAnalyst
              as_user_id: "analyst-1"
            - call: "POST /gis/address-points"
              payload: { house_number: 100, road_centerline_id: "${road_id}", side: "LEFT", source: "PARCEL", postal_city: "FORT COLLINS", cell_id: "${cell_id}", geometry_verified: true, unit_type: "UNIT", unit_id: "1", parent_address_point_id: "${base_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { unit_id_pk: $.data.id }
            - call: "POST /gis/address-points/${unit_id_pk}/activate"
              payload: {}
              as: GisAnalyst
              as_user_id: "analyst-1"
            - call: "POST /gis/qc-validation-reports"
              payload: { scope: "ROAD", road_centerline_id: "${road_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { rep_id: $.data.id }
            - call: "POST /gis/qc-validation-reports/${rep_id}/certify"
              payload: {}
              as: QcCertifier
              as_user_id: "qc-1"
            - call: "POST /gis/provisioning-packages"
              payload: { channel: "MAPPING", jurisdiction_id: "${j_id}", qc_report_id: "${rep_id}" }
              as: ProvisioningOfficer
              as_user_id: "prov-1"
              captures: { pkg_id: $.data.id }
            - call: "POST /gis/provisioning-packages/${pkg_id}/seal"
              payload: {}
              as: ProvisioningOfficer
              as_user_id: "prov-1"
          trigger:
            - call: "POST /gis/road-centerlines/${road_id}/retire"
              payload: { retire_reason: "Vacated by county resolution 2026-114" }
              as: GisAnalyst
              as_user_id: "analyst-1"
          assert:
            - "RoadCenterline.${road_id}.status == \"RETIRED\"   # level 1"
            - "RoadCenterline.${road_id}.retired_at == \"2026-08-01T00:00:00.000Z\""
            - "RoadCenterline.${road_id}.assignable_slot_count_left == 50   # both points released their slot"
            - "AddressPoint.${base_id}.status == \"RETIRED\"   # level 2"
            - "AddressPoint.${base_id}.retire_reason == \"ROAD_RETIRED\""
            - "AddressPoint.${unit_id_pk}.status == \"RETIRED\"   # level 3, reached via the parent"
            - "AddressPoint.${unit_id_pk}.retire_reason == \"PARENT_RETIRED\"   # NOT ROAD_RETIRED"
            - "ProvisioningPackage.${pkg_id}.pinned_record_count == 3"
            - "ProvisioningPackage.${pkg_id}.stale_pin_count == 3   # level 4"
            - "ProvisioningPackage.${pkg_id}.fresh_pin_count == 0"
            - "ProvisioningPackage.${pkg_id}.drift_detected == true"
            - "ProvisioningPackage.${pkg_id}.status == \"INVALIDATED\"   # level 5"
            - "ProvisioningPackage.${pkg_id}.invalidated_reason == \"PIN_STALE\""
            - "ProvisioningPackage.${pkg_id}.package_version == 1   # the number is kept, never reused"
            - "QcValidationReport.${rep_id}.status == \"CERTIFIED\"   # retirement does not decertify"

      - name: discrepancy_adopt_cascades_road_points_report_package
        grounds:
          - state_machines.DiscrepancyCase.CONCURRED_to_ADOPTED
          - state_machines.RoadCenterline.PUBLISHED_to_VALIDATED
          - calculations.normalized_road_name
          - calculations.address_point_confidence_score
          - entities.QcValidationReport.fields.decertified_reason
          - entities.ProvisioningPackage.fields.invalidated_reason
        distinguishing_aspect: |
          The triggering transition is a DiscrepancyCase adoption (not a road retirement) and the
          five levels are different records: case ADOPTED (1) -> road takes the new name,
          re-normalizes and DEMOTES from PUBLISHED to VALIDATED (2) -> every live AddressPoint on
          it reverts to confidence_basis PROVISIONAL with certified_confidence_score nulled and
          confidence_score re-scored to 91.00 under the harsher VALIDATED penalty (3) -> the
          CERTIFIED report DECERTIFIES with SUBJECT_RECORD_CHANGED (4) -> the DRAFT package
          INVALIDATES with REPORT_DECERTIFIED (5).
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Jurisdiction LARCO (postal_city FORT COLLINS) with one CoverageCell C001 and no boundaries."
            - "Two ACTIVE agencies in LARCO: LAW (opener) and FIRE (counterparty)."
            - "RoadCenterline 'N MAPLE STREET' PUBLISHED with one ACTIVE base AddressPoint at 100 LEFT (PARCEL, geometry_verified true, postal FORT COLLINS)."
            - "A ROAD-scoped QcValidationReport over the centerline, zero defects, CERTIFIED — so the point already carries confidence_basis CERTIFIED and certified_confidence_score 96.00 (no coverage bonus, no open case at certification time)."
            - "A DRAFT MAPPING ProvisioningPackage on that report (never sealed)."
            - "A DiscrepancyCase on ROAD_NAME over that centerline opened AFTER certification, with one proposal 'N MAPLE AVE' filed by LAW and concurred by FIRE, so status is CONCURRED."
          setup_api_calls:
            - call: "POST /gis/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
            - call: "POST /gis/coverage-cells"
              payload: { cell_code: "C001", jurisdiction_id: "${j_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { cell_id: $.data.id }
            - call: "POST /gis/agencies"
              payload: { name: "Larimer County Sheriff", agency_type: "LAW", jurisdiction_id: "${j_id}" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { law_id: $.data.id }
            - call: "POST /gis/agencies"
              payload: { name: "Poudre Fire Authority", agency_type: "FIRE", jurisdiction_id: "${j_id}" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { fire_id: $.data.id }
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "N MAPLE STREET", jurisdiction_id: "${j_id}", from_addr_left: 100, to_addr_left: 198, parity_left: "EVEN", from_addr_right: 101, to_addr_right: 199, parity_right: "ODD" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { road_id: $.data.id }
            - call: "POST /gis/address-points"
              payload: { house_number: 100, road_centerline_id: "${road_id}", side: "LEFT", source: "PARCEL", postal_city: "FORT COLLINS", cell_id: "${cell_id}", geometry_verified: true }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { pt_id: $.data.id }
            - call: "POST /gis/road-centerlines/${road_id}/validate"
              payload: {}
              as: GisAnalyst
              as_user_id: "analyst-1"
            - call: "POST /gis/road-centerlines/${road_id}/publish"
              payload: {}
              as: QcCertifier
              as_user_id: "qc-1"
            - call: "POST /gis/address-points/${pt_id}/activate"
              payload: {}
              as: GisAnalyst
              as_user_id: "analyst-1"
            - call: "POST /gis/qc-validation-reports"
              payload: { scope: "ROAD", road_centerline_id: "${road_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { rep_id: $.data.id }
            - call: "POST /gis/qc-validation-reports/${rep_id}/certify"
              payload: {}
              as: QcCertifier
              as_user_id: "qc-1"
            - call: "POST /gis/provisioning-packages"
              payload: { channel: "MAPPING", jurisdiction_id: "${j_id}", qc_report_id: "${rep_id}" }
              as: ProvisioningOfficer
              as_user_id: "prov-1"
              captures: { pkg_id: $.data.id }
            - call: "POST /gis/discrepancy-cases"
              payload: { subject_type: "ROAD_NAME", subject_ref_id: "${road_id}", counterparty_agency_id: "${fire_id}", description: "Both agencies now agree the county road name should read N MAPLE AVE" }
              as: AgencyLiaison
              as_user_id: "${law_id}"
              captures: { case_id: $.data.id, case_v0: $.data.version }
            - call: "POST /gis/discrepancy-cases/${case_id}/proposals"
              payload: { proposed_value: "N MAPLE AVE", expected_case_version: "${case_v0}", rationale: "Matches the recorded plat" }
              as: AgencyLiaison
              as_user_id: "${law_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /gis/discrepancy-cases/${case_id}/concur"
              payload: { proposal_id: "${prop_id}" }
              as: AgencyLiaison
              as_user_id: "${fire_id}"
          trigger:
            - call: "POST /gis/discrepancy-cases/${case_id}/adopt"
              payload: {}
              as: SystemAdmin
              as_user_id: "sysadmin-1"
          assert:
            - "DiscrepancyCase.${case_id}.status == \"ADOPTED\"   # level 1"
            - "DiscrepancyCase.${case_id}.resolved_value == \"N MAPLE AVE\""
            - "DiscrepancyCase.${case_id}.concurred_by_side == \"COUNTERPARTY\""
            - "DiscrepancyCase.${case_id}.adopted_at == \"2026-08-01T00:00:00.000Z\""
            - "DiscrepancyProposal.${prop_id}.status == \"ADOPTED\""
            - "RoadCenterline.${road_id}.primary_name == \"N MAPLE AVE\"   # level 2"
            - "RoadCenterline.${road_id}.normalized_name == \"N MAPLE AVENUE\"   # last token AVE expands"
            - "RoadCenterline.${road_id}.status == \"VALIDATED\"   # demoted from PUBLISHED"
            - "RoadCenterline.${road_id}.qc_dirty == true"
            - "RoadCenterline.${road_id}.open_discrepancy_case_count == 0"
            - "AddressPoint.${pt_id}.confidence_basis == \"PROVISIONAL\"   # level 3"
            - "AddressPoint.${pt_id}.certified_confidence_score == null"
            - "AddressPoint.${pt_id}.confidence_score == 91.00   # 70 + 12 + 8 + 6 - 5 (road now VALIDATED)"
            - "AddressPoint.${pt_id}.status == \"ACTIVE\"   # the point is re-scored, never retired"
            - "QcValidationReport.${rep_id}.status == \"DECERTIFIED\"   # level 4"
            - "QcValidationReport.${rep_id}.decertified_reason == \"SUBJECT_RECORD_CHANGED\""
            - "ProvisioningPackage.${pkg_id}.status == \"INVALIDATED\"   # level 5"
            - "ProvisioningPackage.${pkg_id}.invalidated_reason == \"REPORT_DECERTIFIED\""
            - "ProvisioningPackage.${pkg_id}.package_version == null   # never sealed"

  # ===========================================================================
  # RULE 5 — priority_pair_validation_conflict (4 instances, four DIFFERENT
  #          error-category pairs: state/safety, safety/constraint,
  #          state(OCC)/temporal, auth/existence)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: road_retire_state_beats_discrepancy_freeze
        grounds:
          - validations[priority=7]
          - validations[priority=10]
          - errors.ERR_ROAD_INVALID_STATE
          - errors.ERR_ROAD_FROZEN_BY_DISCREPANCY
        distinguishing_aspect: |
          Category pair state (priority 7) vs business_safety (priority 10): a second retire call
          on an already RETIRED centerline that ALSO carries an open discrepancy case must return
          ERR_ROAD_INVALID_STATE, never the safety error. An implementation that checks the
          discrepancy freeze first (it is the more dramatic rule) returns the wrong code.
        test_recipe:
          setup:
            - "Jurisdiction LARCO with two ACTIVE agencies, LAW and FIRE."
            - "One RoadCenterline 'N MAPLE STREET' already RETIRED (retired straight from DRAFT while it had no open cases)."
            - "A DiscrepancyCase on ROAD_NAME over that same centerline, opened AFTER the retirement and still OPEN, so open_discrepancy_case_count == 1. Case creation validates only that the subject id resolves (validations[priority=5]) and that no unresolved case already exists on the subject (validations[priority=22]) — it does NOT inspect the centerline's status, which is what makes this double violation reachable."
          setup_api_calls:
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
            - call: "POST /gis/agencies"
              payload: { name: "Larimer County Sheriff", agency_type: "LAW", jurisdiction_id: "${j_id}" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { law_id: $.data.id }
            - call: "POST /gis/agencies"
              payload: { name: "Poudre Fire Authority", agency_type: "FIRE", jurisdiction_id: "${j_id}" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { fire_id: $.data.id }
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "N MAPLE STREET", jurisdiction_id: "${j_id}", from_addr_left: 100, to_addr_left: 198, parity_left: "EVEN", from_addr_right: 101, to_addr_right: 199, parity_right: "ODD" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { road_id: $.data.id }
            - call: "POST /gis/road-centerlines/${road_id}/retire"
              payload: { retire_reason: "Duplicate centerline created in error" }
              as: GisAnalyst
              as_user_id: "analyst-1"
            - call: "POST /gis/discrepancy-cases"
              payload: { subject_type: "ROAD_NAME", subject_ref_id: "${road_id}", counterparty_agency_id: "${fire_id}", description: "Fire disputes the retirement of the N MAPLE STREET name record" }
              as: AgencyLiaison
              as_user_id: "${law_id}"
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /gis/road-centerlines/${road_id}/retire"
              payload: { retire_reason: "Second retirement attempt" }
              as: GisAnalyst
              as_user_id: "analyst-1"
          assert:
            - "response status_code == 409"
            - "response body error_id == \"ERR_ROAD_INVALID_STATE\"   # priority 7 wins over priority 10"
            - "response body error_id != \"ERR_ROAD_FROZEN_BY_DISCREPANCY\""
            - "RoadCenterline.${road_id}.status == \"RETIRED\""
            - "RoadCenterline.${road_id}.retire_reason == \"Duplicate centerline created in error\"   # unchanged by the rejected call"
            - "RoadCenterline.${road_id}.open_discrepancy_case_count == 1"
            - "DiscrepancyCase.${case_id}.status == \"OPEN\""

      - name: road_frozen_safety_beats_range_overlap
        grounds:
          - validations[priority=10]
          - validations[priority=21]
          - calculations.address_range_overlap_detection
          - errors.ERR_ROAD_FROZEN_BY_DISCREPANCY
          - errors.ERR_ROAD_RANGE_OVERLAP
        distinguishing_aspect: |
          Category pair business_safety (priority 10) vs business_constraint (priority 21) — a
          different pair from road_retire_state_beats_discrepancy_freeze, and here the state check
          passes cleanly (the road really is DRAFT, so validate IS a legal transition). Both the
          discrepancy freeze and the range overlap are violated and the safety error must win.
        test_recipe:
          setup:
            - "Jurisdiction LARCO with two ACTIVE agencies, LAW and FIRE."
            - "R1 'N MAPLE STREET' left [100,198] EVEN, right [101,199] ODD, VALIDATED."
            - "R2 'N Maple St' (same normalized name 'N MAPLE STREET') left [150,248] EVEN, right [151,249] ODD, still DRAFT — its left interval intersects R1's at max(100,150)=150 <= min(198,248)=198, so validating it violates priority 21."
            - "An OPEN DiscrepancyCase on ADDRESS_RANGE over R2, so R2.open_discrepancy_case_count == 1 and priority 10 is violated too."
          setup_api_calls:
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
            - call: "POST /gis/agencies"
              payload: { name: "Larimer County Sheriff", agency_type: "LAW", jurisdiction_id: "${j_id}" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { law_id: $.data.id }
            - call: "POST /gis/agencies"
              payload: { name: "Poudre Fire Authority", agency_type: "FIRE", jurisdiction_id: "${j_id}" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { fire_id: $.data.id }
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "N MAPLE STREET", jurisdiction_id: "${j_id}", from_addr_left: 100, to_addr_left: 198, parity_left: "EVEN", from_addr_right: 101, to_addr_right: 199, parity_right: "ODD" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { r1_id: $.data.id }
            - call: "POST /gis/road-centerlines/${r1_id}/validate"
              payload: {}
              as: GisAnalyst
              as_user_id: "analyst-1"
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "N Maple St", jurisdiction_id: "${j_id}", from_addr_left: 150, to_addr_left: 248, parity_left: "EVEN", from_addr_right: 151, to_addr_right: 249, parity_right: "ODD" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { r2_id: $.data.id }
            - call: "POST /gis/discrepancy-cases"
              payload: { subject_type: "ADDRESS_RANGE", subject_ref_id: "${r2_id}", counterparty_agency_id: "${fire_id}", description: "Sheriff and fire disagree on the 150-248 block assignment" }
              as: AgencyLiaison
              as_user_id: "${law_id}"
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /gis/road-centerlines/${r2_id}/validate"
              payload: {}
              as: GisAnalyst
              as_user_id: "analyst-1"
          assert:
            - "response status_code == 409"
            - "response body error_id == \"ERR_ROAD_FROZEN_BY_DISCREPANCY\"   # priority 10 wins over priority 21"
            - "response body error_id != \"ERR_ROAD_RANGE_OVERLAP\""
            - "RoadCenterline.${r2_id}.status == \"DRAFT\"   # validate is a legal transition from DRAFT; only the guards failed"
            - "RoadCenterline.${r2_id}.normalized_name == \"N MAPLE STREET\""
            - "RoadCenterline.${r1_id}.status == \"VALIDATED\""

      - name: occ_stale_beats_boundary_window_invalid
        grounds:
          - validations[priority=8]
          - validations[priority=30]
          - concurrency_rules
          - errors.ERR_STALE_BOUNDARY_VERSION
          - errors.ERR_BOUNDARY_WINDOW_INVALID
        distinguishing_aspect: |
          Category pair state/OCC (priority 8, HTTP 412) vs business_temporal (priority 30, HTTP
          422). The payload carries BOTH a stale expected_boundary_version and an inverted window
          (effective_end < effective_start); the 412 must win, so the status code itself
          discriminates. Neither error category appears in the other three instances.
        test_recipe:
          setup:
            - "Jurisdiction LARCO with an ACTIVE LAW agency and two CoverageCells C001 and C002."
            - "A DRAFT EmergencyServiceBoundary for that agency, effective_start 2026-08-01T00:00:00Z, no effective_end. Its version at creation is captured."
            - "One cell assignment has already been added for C001 using that captured version, which bumped the boundary's version, so the captured value is now one behind."
          setup_api_calls:
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
            - call: "POST /gis/coverage-cells"
              payload: { cell_code: "C001", jurisdiction_id: "${j_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { cell1_id: $.data.id }
            - call: "POST /gis/coverage-cells"
              payload: { cell_code: "C002", jurisdiction_id: "${j_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { cell2_id: $.data.id }
            - call: "POST /gis/agencies"
              payload: { name: "Larimer County Sheriff", agency_type: "LAW", jurisdiction_id: "${j_id}" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { law_id: $.data.id }
            - call: "POST /gis/emergency-service-boundaries"
              payload: { agency_id: "${law_id}", effective_start: "2026-08-01T00:00:00Z" }
              as: AgencyLiaison
              as_user_id: "${law_id}"
              captures: { b_id: $.data.id, b_v_stale: $.data.version }
            - call: "POST /gis/emergency-service-boundaries/${b_id}/cell-assignments"
              payload: { cell_id: "${cell1_id}", effective_start: "2026-08-01T00:00:00Z", expected_boundary_version: "${b_v_stale}" }
              as: AgencyLiaison
              as_user_id: "${law_id}"
              captures: { asn1_id: $.data.id }
          trigger:
            - call: "POST /gis/emergency-service-boundaries/${b_id}/cell-assignments"
              payload: { cell_id: "${cell2_id}", effective_start: "2026-08-01T00:00:00Z", effective_end: "2026-07-01T00:00:00Z", expected_boundary_version: "${b_v_stale}" }
              as: AgencyLiaison
              as_user_id: "${law_id}"
          assert:
            - "response status_code == 412   # NOT 422"
            - "response body error_id == \"ERR_STALE_BOUNDARY_VERSION\"   # priority 8 wins over priority 30"
            - "response body error_id != \"ERR_BOUNDARY_WINDOW_INVALID\""
            - "EmergencyServiceBoundary.${b_id}.assigned_cell_count == 1   # the rejected call created nothing"
            - "EmergencyServiceBoundary.${b_id}.status == \"DRAFT\""
            - "BoundaryCellAssignment.${asn1_id}.status == \"PENDING\""
            - "GET /gis/emergency-service-boundaries/${b_id}/cell-assignments total_count == 1"

      - name: adopt_unauthorized_role_beats_case_not_found
        grounds:
          - validations[priority=2]
          - validations[priority=4]
          - roles.GisAnalyst
          - errors.ERR_UNAUTHORIZED
          - errors.ERR_CASE_NOT_FOUND
        distinguishing_aspect: |
          Category pair auth (priority 2, HTTP 403) vs existence (priority 4, HTTP 404) — the
          authorization gate runs before the path id is even resolved, so a GisAnalyst calling
          adopt on a completely non-existent case id gets 403, not 404. Leaking 404 here would
          also leak whether the id exists to a caller with no rights on the endpoint.
        test_recipe:
          setup:
            - "A bare system with at least one Jurisdiction so the request is otherwise well-formed."
            - "POST /gis/discrepancy-cases/{id}/adopt is exclusive to SystemAdmin (§1.7)."
            - "The path id 00000000-0000-0000-0000-000000000000 belongs to no stored DiscrepancyCase."
          setup_api_calls:
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
          trigger:
            - call: "POST /gis/discrepancy-cases/00000000-0000-0000-0000-000000000000/adopt"
              payload: {}
              as: GisAnalyst
              as_user_id: "analyst-1"
          assert:
            - "response status_code == 403   # NOT 404"
            - "response body error_id == \"ERR_UNAUTHORIZED\"   # priority 2 wins over priority 4"
            - "response body error_id != \"ERR_CASE_NOT_FOUND\""
            - "response body data.error_id is present and data.message is a non-empty string"

  # ===========================================================================
  # RULE 6 — boundary_precision_check (3 instances, three DIFFERENT metrics on
  #          three DISTINCT endpoints: eligibility score on waive, house-number
  #          upper bound on assign, cadence elapsed_days on publish)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: eligibility_score_exactly_at_minimum_is_eligible
        grounds:
          - calculations.provisioning_eligibility_score
          - calculations.qc_quality_score
          - endpoints.POST_/gis/qc-defects/{id}/waive
          - entities.QcValidationReport.fields.is_provisioning_eligible
        distinguishing_aspect: |
          Metric: provisioning_eligibility_score against PROVISIONING_MIN_SCORE. The waive lands
          the score on EXACTLY 90.00 and PROVISIONING_MIN_SCORE is INCLUSIVE, so the report is
          eligible; an implementation using a strict `>` rejects a legitimate release. The probed
          endpoint is the defect waive.
        test_recipe:
          setup:
            - "Jurisdiction LARCO (postal_city FORT COLLINS) with one CoverageCell C001."
            - "One VALIDATED RoadCenterline whose primary_name 'N Maple St' does not equal normalized_name 'N MAPLE STREET' -> exactly one ROAD WARNING (ROAD_NAME_NOT_NORMALIZED); qc_dirty was cleared by validate and the road has addresses, so it emits no other ROAD defect."
            - "Four PENDING POSTAL base points at 100, 102, 104, 106 (geometry_verified true, postal_city FORT COLLINS) -> confidence 66.00 each -> four ADDRESS INFO defects and nothing else."
            - "One PENDING FIELD base point at 108 with postal_city LOVELAND (geometry_verified true, confidence 93.00) -> exactly one ADDRESS WARNING (postal mismatch)."
            - "One PENDING PARCEL subaddress unit '1' beneath 108 with unit_type OMITTED (geometry_verified true, postal_city FORT COLLINS, confidence 85.00) -> exactly one ADDRESS WARNING (ADDRESS_UNIT_TYPE_MISSING)."
            - "One PENDING PARCEL base point at 110 with geometry_verified false (postal_city FORT COLLINS, confidence 79.00) -> exactly one ADDRESS BLOCKING (missing geometry)."
            - "A ROAD-scoped report over that centerline: 8 defects = 1 BLOCKING + 3 WARNING + 4 INFO, quality_score 86.88 (ADDRESS 0.45*73.5 = 33.08 + ROAD 28.80 + BOUNDARY 25.00), tier B, provisioning_eligibility_score 86.88, is_provisioning_eligible false."
            - "The BLOCKING defect id has been read from the report's defect list."
          setup_api_calls:
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
            - call: "POST /gis/coverage-cells"
              payload: { cell_code: "C001", jurisdiction_id: "${j_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { cell_id: $.data.id }
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "N Maple St", jurisdiction_id: "${j_id}", from_addr_left: 100, to_addr_left: 198, parity_left: "EVEN", from_addr_right: 101, to_addr_right: 199, parity_right: "ODD" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { road_id: $.data.id }
            - call: "POST /gis/road-centerlines/${road_id}/validate"
              payload: {}
              as: GisAnalyst
              as_user_id: "analyst-1"
            - call: "POST /gis/address-points"
              payload: { house_number: 100, road_centerline_id: "${road_id}", side: "LEFT", source: "POSTAL", postal_city: "FORT COLLINS", cell_id: "${cell_id}", geometry_verified: true }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { i1_id: $.data.id }
            - call: "POST /gis/address-points"
              payload: { house_number: 102, road_centerline_id: "${road_id}", side: "LEFT", source: "POSTAL", postal_city: "FORT COLLINS", cell_id: "${cell_id}", geometry_verified: true }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { i2_id: $.data.id }
            - call: "POST /gis/address-points"
              payload: { house_number: 104, road_centerline_id: "${road_id}", side: "LEFT", source: "POSTAL", postal_city: "FORT COLLINS", cell_id: "${cell_id}", geometry_verified: true }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { i3_id: $.data.id }
            - call: "POST /gis/address-points"
              payload: { house_number: 106, road_centerline_id: "${road_id}", side: "LEFT", source: "POSTAL", postal_city: "FORT COLLINS", cell_id: "${cell_id}", geometry_verified: true }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { i4_id: $.data.id }
            - call: "POST /gis/address-points"
              payload: { house_number: 108, road_centerline_id: "${road_id}", side: "LEFT", source: "FIELD", postal_city: "LOVELAND", cell_id: "${cell_id}", geometry_verified: true }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { w1_id: $.data.id }
            - call: "POST /gis/address-points"
              payload: { house_number: 108, road_centerline_id: "${road_id}", side: "LEFT", source: "PARCEL", postal_city: "FORT COLLINS", cell_id: "${cell_id}", geometry_verified: true, unit_id: "1", parent_address_point_id: "${w1_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { w2_id: $.data.id }
            - call: "POST /gis/address-points"
              payload: { house_number: 110, road_centerline_id: "${road_id}", side: "LEFT", source: "PARCEL", postal_city: "FORT COLLINS", cell_id: "${cell_id}", geometry_verified: false }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { blk_pt_id: $.data.id }
            - call: "POST /gis/qc-validation-reports"
              payload: { scope: "ROAD", road_centerline_id: "${road_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { rep_id: $.data.id }
            - call: "GET /gis/qc-validation-reports/${rep_id}/defects"
              payload: { severity: "BLOCKING" }
              as: QcCertifier
              as_user_id: "qc-1"
              captures: { blk_defect_id: "$.data[0].id" }
          trigger:
            - call: "POST /gis/qc-defects/${blk_defect_id}/waive"
              payload: { waiver_reason: "Survey geometry for 110 arrives next cycle; release approved" }
              as: QcCertifier
              as_user_id: "qc-1"
          assert:
            - "AddressPoint.${i1_id}.confidence_score == 66.00"
            - "AddressPoint.${w1_id}.confidence_score == 93.00"
            - "AddressPoint.${w2_id}.confidence_score == 85.00"
            - "AddressPoint.${blk_pt_id}.confidence_score == 79.00"
            - "QcValidationReport.${rep_id}.defect_count == 8"
            - "QcValidationReport.${rep_id}.warning_defect_count == 3"
            - "QcValidationReport.${rep_id}.info_defect_count == 4"
            - "QcValidationReport.${rep_id}.open_blocking_defect_count == 0"
            - "QcValidationReport.${rep_id}.waived_blocking_count == 1"
            - "QcValidationReport.${rep_id}.quality_score == 92.50   # ADDRESS 38.70 + ROAD 28.80 + BOUNDARY 25.00"
            - "QcValidationReport.${rep_id}.quality_tier == \"B\""
            - "QcValidationReport.${rep_id}.provisioning_eligibility_score == 90.00   # 92.50 - 1*2.5, EXACTLY the minimum"
            - "QcValidationReport.${rep_id}.is_provisioning_eligible == true   # PROVISIONING_MIN_SCORE is inclusive"

      - name: house_number_equal_to_range_upper_bound_accepted
        grounds:
          - calculations.next_house_number_selection
          - validations[priority=23]
          - endpoints.POST_/gis/address-assignment-requests/{id}/assign
          - entities.AddressAssignmentRequest.fields.assigned_house_number
        distinguishing_aspect: |
          Metric: the house-number range upper bound. to_addr_left is the INCLUSIVE end of the
          closed interval, so proposed_house_number 198 on [100,198] EVEN is a member of the
          candidate set and must be honoured verbatim instead of raising
          ERR_HOUSE_NUMBER_UNAVAILABLE or silently falling back to min(candidate_set) = 100. A
          different metric and a different endpoint from eligibility_score_exactly_at_minimum_is_eligible.
        test_recipe:
          setup:
            - "Jurisdiction LARCO (postal_city FORT COLLINS) with one CoverageCell C001."
            - "One VALIDATED RoadCenterline 'N MAPLE STREET', LEFT range [100,198] EVEN, with no address points at all, so the candidate set is the full 50-member EVEN set including both endpoints."
            - "One AddressAssignmentRequest for permit BP-2026-0198 on the LEFT side with proposed_house_number 198 and requested_unit_count 0, already GIS_APPROVED and UTILITY_CLEARED, so fulfillment_status is READY_TO_ASSIGN."
          setup_api_calls:
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
            - call: "POST /gis/coverage-cells"
              payload: { cell_code: "C001", jurisdiction_id: "${j_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { cell_id: $.data.id }
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "N MAPLE STREET", jurisdiction_id: "${j_id}", from_addr_left: 100, to_addr_left: 198, parity_left: "EVEN", from_addr_right: 101, to_addr_right: 199, parity_right: "ODD" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { road_id: $.data.id }
            - call: "POST /gis/road-centerlines/${road_id}/validate"
              payload: {}
              as: GisAnalyst
              as_user_id: "analyst-1"
            - call: "POST /gis/address-assignment-requests"
              payload: { permit_number: "BP-2026-0198", parcel_id: "8712300198", road_centerline_id: "${road_id}", side: "LEFT", requested_unit_count: 0, proposed_house_number: 198 }
              as: PermitCoordinator
              as_user_id: "permit-1"
              captures: { req_id: $.data.id }
            - call: "POST /gis/address-assignment-requests/${req_id}/gis-review"
              payload: { decision: "APPROVE" }
              as: GisAnalyst
              as_user_id: "analyst-1"
            - call: "POST /gis/address-assignment-requests/${req_id}/utility-clearance"
              payload: { decision: "CLEAR" }
              as: PermitCoordinator
              as_user_id: "permit-1"
          trigger:
            - call: "POST /gis/address-assignment-requests/${req_id}/assign"
              payload: {}
              as: GisAnalyst
              as_user_id: "analyst-1"
          assert:
            - "response status_code == 200"
            - "AddressAssignmentRequest.${req_id}.fulfillment_status == \"FULFILLED\""
            - "AddressAssignmentRequest.${req_id}.assigned_house_number == 198   # the inclusive upper bound, NOT 100"
            - "AddressAssignmentRequest.${req_id}.minted_point_count == 1"
            - "RoadCenterline.${road_id}.assignable_slot_count_left == 49"
            - "GET /gis/address-points?road_centerline_id=${road_id} data[0].house_number == 198"
            - "GET /gis/address-points?road_centerline_id=${road_id} data[0].source == \"PERMIT\""
            - "GET /gis/address-points?road_centerline_id=${road_id} data[0].postal_city == \"FORT COLLINS\""

      - name: cadence_window_opens_exactly_at_channel_interval
        grounds:
          - calculations.cadence_window_evaluation
          - validations[priority=32]
          - endpoints.POST_/gis/provisioning-packages/{id}/publish
          - errors.ERR_CADENCE_WINDOW_NOT_OPEN
        distinguishing_aspect: |
          Metric: elapsed_days against CHANNEL_CADENCE_DAYS[MAPPING] = 14, probed to the
          millisecond on the publish endpoint. At 2026-08-14T23:59:59.999Z (elapsed 13.99999...)
          the window is still CLOSED, and one millisecond later at 2026-08-15T00:00:00.000Z
          (elapsed exactly 14.0) it is OPEN because the comparison is inclusive. A third distinct
          metric and endpoint.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Jurisdiction LARCO (postal_city FORT COLLINS) with one CoverageCell C001, no agencies and no boundaries."
            - "RoadCenterline 'N MAPLE STREET' PUBLISHED with one ACTIVE PARCEL base point at 100 LEFT."
            - "A ROAD-scoped QcValidationReport over that centerline, zero defects, CERTIFIED by qc-1 (so prov-1 may publish without breaching segregation of duties)."
            - "MAPPING package v1 on that report, SEALED and then PUBLISHED at 2026-08-01T00:00:00.000Z (no predecessor, so its own cadence window was open)."
            - "A second MAPPING package on the same report and jurisdiction, SEALED as package_version 2 with fresh pins."
          setup_api_calls:
            - call: "POST /gis/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
            - call: "POST /gis/coverage-cells"
              payload: { cell_code: "C001", jurisdiction_id: "${j_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { cell_id: $.data.id }
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "N MAPLE STREET", jurisdiction_id: "${j_id}", from_addr_left: 100, to_addr_left: 198, parity_left: "EVEN", from_addr_right: 101, to_addr_right: 199, parity_right: "ODD" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { road_id: $.data.id }
            - call: "POST /gis/address-points"
              payload: { house_number: 100, road_centerline_id: "${road_id}", side: "LEFT", source: "PARCEL", postal_city: "FORT COLLINS", cell_id: "${cell_id}", geometry_verified: true }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { pt_id: $.data.id }
            - call: "POST /gis/road-centerlines/${road_id}/validate"
              payload: {}
              as: GisAnalyst
              as_user_id: "analyst-1"
            - call: "POST /gis/road-centerlines/${road_id}/publish"
              payload: {}
              as: QcCertifier
              as_user_id: "qc-1"
            - call: "POST /gis/address-points/${pt_id}/activate"
              payload: {}
              as: GisAnalyst
              as_user_id: "analyst-1"
            - call: "POST /gis/qc-validation-reports"
              payload: { scope: "ROAD", road_centerline_id: "${road_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { rep_id: $.data.id }
            - call: "POST /gis/qc-validation-reports/${rep_id}/certify"
              payload: {}
              as: QcCertifier
              as_user_id: "qc-1"
            - call: "POST /gis/provisioning-packages"
              payload: { channel: "MAPPING", jurisdiction_id: "${j_id}", qc_report_id: "${rep_id}" }
              as: ProvisioningOfficer
              as_user_id: "prov-1"
              captures: { pkg1_id: $.data.id }
            - call: "POST /gis/provisioning-packages/${pkg1_id}/seal"
              payload: {}
              as: ProvisioningOfficer
              as_user_id: "prov-1"
            - call: "POST /gis/provisioning-packages/${pkg1_id}/publish"
              payload: {}
              as: ProvisioningOfficer
              as_user_id: "prov-1"
            - call: "POST /gis/provisioning-packages"
              payload: { channel: "MAPPING", jurisdiction_id: "${j_id}", qc_report_id: "${rep_id}" }
              as: ProvisioningOfficer
              as_user_id: "prov-1"
              captures: { pkg2_id: $.data.id }
            - call: "POST /gis/provisioning-packages/${pkg2_id}/seal"
              payload: {}
              as: ProvisioningOfficer
              as_user_id: "prov-1"
          trigger:
            - call: "POST /gis/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-14T23:59:59.999Z" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
            - call: "POST /gis/provisioning-packages/${pkg2_id}/publish"
              payload: {}
              as: ProvisioningOfficer
              as_user_id: "prov-1"
            - call: "POST /gis/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
            - call: "POST /gis/provisioning-packages/${pkg2_id}/publish"
              payload: {}
              as: ProvisioningOfficer
              as_user_id: "prov-1"
          assert:
            - "the FIRST publish attempt returns status_code 409 with error_id \"ERR_CADENCE_WINDOW_NOT_OPEN\"   # elapsed 13.99999... days"
            - "the SECOND publish attempt returns status_code 200   # elapsed exactly 14.0 days, inclusive"
            - "ProvisioningPackage.${pkg2_id}.status == \"PUBLISHED\""
            - "ProvisioningPackage.${pkg2_id}.package_version == 2"
            - "ProvisioningPackage.${pkg2_id}.published_at == \"2026-08-15T00:00:00.000Z\""
            - "ProvisioningPackage.${pkg1_id}.status == \"SUPERSEDED\""
            - "ProvisioningPackage.${pkg1_id}.published_at == \"2026-08-01T00:00:00.000Z\"   # the baseline that was compared against"
            - "ProvisioningPackage.${pkg1_id}.package_version == 1"

  # ===========================================================================
  # RULE 7 — cross_entity_state_dependency (3 instances, three different entity
  #          pairs: AddressPoint->RoadCenterline, ProvisioningPackage->
  #          QcValidationReport, EmergencyServiceBoundary->Agency)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: address_point_activate_requires_validated_road
        grounds:
          - state_machines.AddressPoint.PENDING_to_ACTIVE
          - validations[priority=7]
          - errors.ERR_ROAD_INVALID_STATE
          - calculations.address_point_confidence_score
        distinguishing_aspect: |
          Entity pair AddressPoint -> RoadCenterline: the point itself is perfectly PENDING and
          the activate transition is defined for it, yet activation is refused because the OWNING
          centerline is still DRAFT, and the error names the ROAD (ERR_ROAD_INVALID_STATE) rather
          than the point. Validating the road then makes the identical call succeed, and the
          point's confidence rises from 81.00 to 91.00 as ROAD_STATUS_PENALTY drops 15 -> 5.
        test_recipe:
          setup:
            - "Jurisdiction LARCO (postal_city FORT COLLINS) with one CoverageCell C001."
            - "RoadCenterline 'N MAPLE STREET' still DRAFT (never validated), open_discrepancy_case_count 0."
            - "One PENDING AddressPoint at 100 LEFT, source PARCEL, geometry_verified true, postal_city FORT COLLINS -> confidence 81.00 while the road is DRAFT (70 + 12 + 8 + 6 - 15)."
          setup_api_calls:
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
            - call: "POST /gis/coverage-cells"
              payload: { cell_code: "C001", jurisdiction_id: "${j_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { cell_id: $.data.id }
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "N MAPLE STREET", jurisdiction_id: "${j_id}", from_addr_left: 100, to_addr_left: 198, parity_left: "EVEN", from_addr_right: 101, to_addr_right: 199, parity_right: "ODD" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { road_id: $.data.id }
            - call: "POST /gis/address-points"
              payload: { house_number: 100, road_centerline_id: "${road_id}", side: "LEFT", source: "PARCEL", postal_city: "FORT COLLINS", cell_id: "${cell_id}", geometry_verified: true }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { pt_id: $.data.id }
          trigger:
            - call: "POST /gis/address-points/${pt_id}/activate"
              payload: {}
              as: GisAnalyst
              as_user_id: "analyst-1"
            - call: "POST /gis/road-centerlines/${road_id}/validate"
              payload: {}
              as: GisAnalyst
              as_user_id: "analyst-1"
            - call: "POST /gis/address-points/${pt_id}/activate"
              payload: {}
              as: GisAnalyst
              as_user_id: "analyst-1"
          assert:
            - "the FIRST activate returns status_code 409 with error_id \"ERR_ROAD_INVALID_STATE\"   # NOT ERR_ADDRESS_POINT_INVALID_STATE"
            - "after the first activate AddressPoint.${pt_id}.status == \"PENDING\""
            - "after the first activate AddressPoint.${pt_id}.confidence_score == 81.00"
            - "the SECOND activate returns status_code 200"
            - "AddressPoint.${pt_id}.status == \"ACTIVE\""
            - "AddressPoint.${pt_id}.confidence_score == 91.00   # ROAD_STATUS_PENALTY 15 -> 5"
            - "RoadCenterline.${road_id}.status == \"VALIDATED\""
            - "RoadCenterline.${road_id}.assignable_slot_count_left == 49"

      - name: package_seal_requires_certified_report
        grounds:
          - validations[priority=13]
          - state_machines.ProvisioningPackage.DRAFT_to_SEALED
          - errors.ERR_QC_REPORT_NOT_CERTIFIED
          - calculations.package_record_pin_set
        distinguishing_aspect: |
          Entity pair ProvisioningPackage -> QcValidationReport (a different pair from
          address_point_activate_requires_validated_road): a DRAFT package with a perfectly valid
          in-scope record set cannot seal while its report is merely GENERATED, and the SAME seal
          call succeeds the moment the report is CERTIFIED. Nothing about the package changed
          between the two attempts.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Jurisdiction LARCO (postal_city FORT COLLINS) with one CoverageCell C001 and no boundaries."
            - "RoadCenterline 'N MAPLE STREET' PUBLISHED with one ACTIVE PARCEL base point at 100 LEFT, so the in-scope record set holds exactly two records."
            - "A ROAD-scoped QcValidationReport over that centerline with zero defects, still GENERATED (quality_score 100.00, is_provisioning_eligible true)."
            - "A DRAFT MAPPING ProvisioningPackage referencing that report."
          setup_api_calls:
            - call: "POST /gis/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
            - call: "POST /gis/coverage-cells"
              payload: { cell_code: "C001", jurisdiction_id: "${j_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { cell_id: $.data.id }
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "N MAPLE STREET", jurisdiction_id: "${j_id}", from_addr_left: 100, to_addr_left: 198, parity_left: "EVEN", from_addr_right: 101, to_addr_right: 199, parity_right: "ODD" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { road_id: $.data.id }
            - call: "POST /gis/address-points"
              payload: { house_number: 100, road_centerline_id: "${road_id}", side: "LEFT", source: "PARCEL", postal_city: "FORT COLLINS", cell_id: "${cell_id}", geometry_verified: true }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { pt_id: $.data.id }
            - call: "POST /gis/road-centerlines/${road_id}/validate"
              payload: {}
              as: GisAnalyst
              as_user_id: "analyst-1"
            - call: "POST /gis/road-centerlines/${road_id}/publish"
              payload: {}
              as: QcCertifier
              as_user_id: "qc-1"
            - call: "POST /gis/address-points/${pt_id}/activate"
              payload: {}
              as: GisAnalyst
              as_user_id: "analyst-1"
            - call: "POST /gis/qc-validation-reports"
              payload: { scope: "ROAD", road_centerline_id: "${road_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { rep_id: $.data.id }
            - call: "POST /gis/provisioning-packages"
              payload: { channel: "MAPPING", jurisdiction_id: "${j_id}", qc_report_id: "${rep_id}" }
              as: ProvisioningOfficer
              as_user_id: "prov-1"
              captures: { pkg_id: $.data.id }
          trigger:
            - call: "POST /gis/provisioning-packages/${pkg_id}/seal"
              payload: {}
              as: ProvisioningOfficer
              as_user_id: "prov-1"
            - call: "POST /gis/qc-validation-reports/${rep_id}/certify"
              payload: {}
              as: QcCertifier
              as_user_id: "qc-1"
            - call: "POST /gis/provisioning-packages/${pkg_id}/seal"
              payload: {}
              as: ProvisioningOfficer
              as_user_id: "prov-1"
          assert:
            - "the FIRST seal returns status_code 409 with error_id \"ERR_QC_REPORT_NOT_CERTIFIED\""
            - "after the first seal ProvisioningPackage.${pkg_id}.status == \"DRAFT\""
            - "after the first seal ProvisioningPackage.${pkg_id}.package_version == null"
            - "after the first seal ProvisioningPackage.${pkg_id}.pinned_record_count == 0   # no partial snapshot"
            - "the SECOND seal returns status_code 200"
            - "ProvisioningPackage.${pkg_id}.status == \"SEALED\""
            - "ProvisioningPackage.${pkg_id}.package_version == 1"
            - "ProvisioningPackage.${pkg_id}.pinned_record_count == 2   # one ROAD_CENTERLINE + one ADDRESS_POINT"
            - "ProvisioningPackage.${pkg_id}.fresh_pin_count == 2"
            - "ProvisioningPackage.${pkg_id}.stale_pin_count == 0"
            - "ProvisioningPackage.${pkg_id}.sealed_at == \"2026-08-01T00:00:00.000Z\""
            - "ProvisioningPackage.${pkg_id}.sealed_by_user_id == \"prov-1\""
            - "QcValidationReport.${rep_id}.status == \"CERTIFIED\""

      - name: boundary_activate_requires_active_agency
        grounds:
          - validations[priority=14]
          - state_machines.EmergencyServiceBoundary.PROPOSED_to_ACTIVE
          - errors.ERR_AGENCY_NOT_ACTIVE
          - entities.Agency.fields.status
        distinguishing_aspect: |
          Entity pair EmergencyServiceBoundary -> Agency (a third distinct pair): a correctly
          PROPOSED boundary with a valid cell assignment cannot activate because its owning Agency
          was SUSPENDED after the proposal, while a sibling boundary on the SAME cell owned by an
          ACTIVE agency activates in the same fixture. The blocking state lives two hops away from
          the boundary being activated.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Jurisdiction LARCO with one CoverageCell C001."
            - "A LAW agency and a FIRE agency, both created ACTIVE."
            - "The LAW boundary is PROPOSED with an open-ended cell assignment on C001; the FIRE boundary is PROPOSED the same way."
            - "The LAW agency is then SUSPENDED (POST /gis/agencies/{id}/suspend); suspension does not touch the boundary's own status, which stays PROPOSED."
          setup_api_calls:
            - call: "POST /gis/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
