        distinguishing_aspect: "close is declared only from ISSUED, so firing it on a DRAFT prospectus is a 409 ERR_PROSPECTUS_STATUS_INVALID from priority 10 — and that beats the priority-27 ERR_SUBMISSION_WINDOW_OPEN that the pre-deadline clock would otherwise raise."
        test_recipe:
          setup:
            - "A park, an opportunity approved for solicitation, and a DRAFT prospectus with a 2027-02-01T00:00:00Z deadline; the clock is 2027-01-05, so the window is still open."
