  # ===========================================================================
  # Cross-cutting OCC instance (referenced by §1.9 excluded_because stubs)
  - rule_id: optimistic_concurrency_occ
    instances:
      - name: stale_claim_version_on_adjustment_create_returns_412
        grounds:
          - concurrency_rules[adjustment-create-stale-claim]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: |
          OCC on Claim.version: an adjustment create carrying the claim version
          observed before a prior adjustment superseded it is rejected with
          ERR_STALE_VERSION (412); the current version succeeds.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01. Home H, host T LICENSED. Member M home=H. Rate 30000 proc 99213 T [2026-01-01,2027-01-01). Fee schedule H->T [2026-01-01,2026-12-31] cap 10000 fee 150 rate 0.02 discount 0. Claim billed 20000 service 2026-08-10 PAID (version captured). First adjustment created (bumps Claim.version)."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AssociationAdmin
            - call: "POST /v1/plans"
              payload: { plan_code: "HCA", legal_name: "Home Plan CA", service_area_states: ["CA"] }
              as: AssociationAdmin
              captures: { h_id: $.data.id }
            - call: "POST /v1/plans"
              payload: { plan_code: "TTX", legal_name: "Host Plan TX", service_area_states: ["TX"] }
              as: AssociationAdmin
              captures: { t_id: $.data.id }
            - call: "POST /v1/plans/${h_id}/activate-license"
              payload: {}
              as: AssociationAdmin
            - call: "POST /v1/plans/${t_id}/activate-license"
              payload: {}
              as: AssociationAdmin
            - call: "POST /v1/members"
              payload: { home_plan_id: "${h_id}", member_number: "M1", full_name: "Pat One", national_account_id: null }
              as: HomePlanOperator
              as_user_id: "${h_id}"
              captures: { m_id: $.data.id }
            - call: "POST /v1/rate-schedules"
              payload: { plan_id: "${t_id}", provider_npi: "1234567890", procedure_code: "99213", negotiated_rate_cents: 30000, effective_start: "2026-01-01", effective_end: "2027-01-01" }
              as: HostPlanOperator
              as_user_id: "${t_id}"
            - call: "POST /v1/access-fee-schedules"
              payload: { home_plan_id: "${h_id}", host_plan_id: "${t_id}", tier1_cap_cents: 10000, tier1_fee_cents: 150, tier2_rate: 0.02, national_account_discount_pct: 0, effective_start: "2026-01-01", effective_end: "2026-12-31" }
              as: AssociationAdmin
            - call: "POST /v1/claims"
              payload: { member_id: "${m_id}", host_plan_id: "${t_id}", provider_npi: "1234567890", procedure_code: "99213", service_date: "2026-08-10", service_state: "TX", billed_amount_cents: 20000 }
              as: HostPlanOperator
              as_user_id: "${t_id}"
              captures: { c_id: $.data.id }
            - call: "POST /v1/claims/${c_id}/price"
              payload: {}
              as: HostPlanOperator
              as_user_id: "${t_id}"
            - call: "POST /v1/claims/${c_id}/route"
              payload: {}
              as: HostPlanOperator
              as_user_id: "${t_id}"
            - call: "POST /v1/claims/${c_id}/determine-benefit"
              payload: {}
              as: HomePlanOperator
              as_user_id: "${h_id}"
            - call: "POST /v1/claims/${c_id}/pay"
              payload: {}
              as: HostPlanOperator
              as_user_id: "${t_id}"
              captures: { c_ver_paid: $.data.version }
            - call: "POST /v1/claims/${c_id}/adjustments"
              payload: { reason: "first", delta_allowed_cents: -1000, expected_claim_version: "${c_ver_paid}" }
              as: HostPlanOperator
              as_user_id: "${t_id}"
          trigger:
            - call: "POST /v1/claims/${c_id}/adjustments"
              payload: { reason: "second with stale version", delta_allowed_cents: -2000, expected_claim_version: "${c_ver_paid}" }
              as: HostPlanOperator
              as_user_id: "${t_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION with HTTP 412 (claim version advanced when the first adjustment moved the claim to ADJUSTMENT_PENDING)"
