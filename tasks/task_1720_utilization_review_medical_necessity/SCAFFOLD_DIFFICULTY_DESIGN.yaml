              payload: { rationale: "Latest review now CRITERIA_NOT_MET.", service_lines: [{ description: "Room", charge_cents: 200000, rate_milli: 500 }], expected_case_version: "${case_v3}" }
              as: URNurse
              captures: { cc_id: $.data.id }
          assert:
            - "First attempt: error_id == ERR_CC44_CRITERIA_STILL_MET with http 422 (latest submitted review was CRITERIA_MET)"
            - "After the NOT_MET review: ConditionCode44Request.${cc_id}.status == CONCURRENCE_PENDING"
            - "UtilizationCase.${case_id}.review_status == ADMISSION_REVIEWED (second review does not regress the axis)"

      - name: appeal_blocked_while_p2p_scheduled
        grounds:
          - validations[priority=11]
          - state_machines.DenialCase.OPEN_to_APPEAL_FILED
          - state_machines.PeerToPeerConference.SCHEDULED_to_COMPLETED
        distinguishing_aspect: |
          Entity pair AppealCase -> PeerToPeerConference: appeal filing is rejected with ERR_DENIAL_NOT_FINAL while a conference is SCHEDULED, and succeeds after the conference completes UPHELD (which returns the denial to OPEN) — a third, distinct cross-entity pair.
        test_recipe:
          setup:
            - "Medicare case; authorization denied at 2026-08-02T12:00:00Z; conference scheduled 2026-08-03T10:00-10:30 within the 72h window"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
