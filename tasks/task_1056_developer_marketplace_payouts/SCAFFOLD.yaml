scenario: "1056. Developer Marketplace & App-Store Payouts: app listing & review/approval, pricing (one-time/subscription/IAP), revenue-share & payout, refund & chargeback, tax (VAT/marketplace-facilitator), fraud/policy takedown, analytics, developer-account/1099"
domain_name: "developer-marketplace-payouts"
api_prefix: "/api"

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by explicit FK fields; only two nested creation paths
  # (pricing-plans under an app, refunds/chargebacks under a purchase) exist so
  # ownership is unambiguous. Everything else is a flat collection with filters.

  state_machine_shape: cyclic
  # App cycles DRAFT -> IN_REVIEW -> CHANGES_REQUESTED -> DRAFT and LIVE <-> SUSPENDED;
  # PolicyCase cycles UPHELD -> APPEALED -> UPHELD; PayoutBatch cycles FAILED -> PENDING_APPROVAL;
  # Purchase carries two independent dimensions (payment_status x settlement_status).

  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic

  role_model: segregation_of_duties
  # PolicyCase: the officer who opened a case may not decide it.
  # PayoutBatch: FinanceOps calculates and submits; only PlatformAdmin approves.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Developer
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Legal payee name printed on the 1099 form.
      - name: email
        type: string
        source: input
        description: Contact email for the developer account.
      - name: country_code
        type: string
        source: input
        description: ISO-3166 alpha-2 country of tax residence.
        constraints: "2 uppercase letters"
      - name: tax_id_provided
        type: boolean
        source: input
        default: false
        description: True when a valid tax identification number is on file; false forces backup withholding.
      - name: status
        type: enum
        source: system
        default: PENDING_VERIFICATION
        description: Account lifecycle state.
        constraints: "PENDING_VERIFICATION | ACTIVE | SUSPENDED | TERMINATED"
      - name: payout_hold
        type: boolean
        source: system
        default: false
        description: When true, no PayoutLine for this developer may be approved or paid.
      - name: risk_watch
        type: boolean
        source: system
        default: false
        description: When true, risk_score is computed with the ACCELERATED variant (30-day window).
      - name: policy_strike_count
        type: integer
        source: system
        default: 0
        description: Count of upheld policy takedowns attributed to this developer.
      - name: lifetime_revenue_base_cents
        type: integer
        source: computed
        default: 0
        description: Running sum of Purchase.revenue_base_cents over this developer's purchases whose payment_status is CAPTURED.
      - name: unpaid_accrual_cents
        type: integer
        source: computed
        default: 0
        description: Sum of LedgerEntry.amount_cents for this developer where settled is false.
      - name: negative_balance_cents
        type: integer
        source: computed
        default: 0
        description: Non-negative amount the developer owes the marketplace, recovered out of future payout lines.
      - name: carryover_cents
        type: integer
        source: computed
        default: 0
        description: Payable amount deferred because it fell under MIN_PAYOUT_CENTS, added to the next batch's gross earnings.
      - name: risk_score
        type: integer
        source: computed
        default: 0
        description: Weighted refund/chargeback/strike risk score in 0..100.
      - name: risk_variant
        type: enum
        source: computed
        default: STANDARD
        description: Which variant of developer_risk_score produced risk_score.
        constraints: "STANDARD | ACCELERATED"

  - name: App
    parent: null
    common_fields: true
    fields:
      - name: developer_id
        type: string
        source: input
        description: FK -> Developer.id; the owning developer account.
      - name: name
        type: string
        source: input
        description: Public listing name of the app.
      - name: category
        type: enum
        source: input
        description: Store category of the listing.
        constraints: "PRODUCTIVITY | GAMES | FINANCE | HEALTH | DEVELOPER_TOOLS"
      - name: listed_countries
        type: array
        source: input
        description: ISO-3166 alpha-2 country codes where the listing is offered.
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: Listing lifecycle state.
        constraints: "DRAFT | IN_REVIEW | CHANGES_REQUESTED | APPROVED | LIVE | SUSPENDED | DELISTED"
      - name: review_round
        type: integer
        source: system
        default: 0
        description: Number of ReviewSubmission rounds opened against this app.
      - name: policy_strike_count
        type: integer
        source: system
        default: 0
        description: Count of upheld policy takedowns against this listing.

  - name: ReviewSubmission
    parent: null
    common_fields: true
    fields:
      - name: app_id
        type: string
        source: system
        description: FK -> App.id; the listing under review.
      - name: round_number
        type: integer
        source: system
        description: 1-based review round, equal to App.review_round at the moment this submission was created.
      - name: submitted_notes
        type: string
        source: input
        description: Developer-authored notes accompanying the submission.
      - name: status
        type: enum
        source: system
        default: SUBMITTED
        description: Review lifecycle state.
        constraints: "SUBMITTED | IN_TRIAGE | PASSED | REJECTED"
      - name: triaged_by_user_id
        type: string
        source: system
        description: X-User-ID of the ReviewAgent who moved this submission to IN_TRIAGE; null before triage.
      - name: decision_reason
        type: string
        source: system
        description: Reason text recorded with the PASSED/REJECTED decision; null before decision.

  - name: PricingPlan
    parent: null
    common_fields: true
    fields:
      - name: app_id
        type: string
        source: system
        description: FK -> App.id; the listing this plan prices.
      - name: kind
        type: enum
        source: input
        description: Monetization model of the plan.
        constraints: "ONE_TIME | SUBSCRIPTION | IAP"
      - name: price_cents
        type: integer
        source: input
        description: Tax-inclusive list price in minor units of currency.
        constraints: "must be > 0"
      - name: currency
        type: string
        source: input
        description: ISO-4217 currency code the plan is priced in.
      - name: country_code
        type: string
        source: input
        description: ISO-3166 alpha-2 country whose TaxJurisdiction governs purchases against this plan.
      - name: billing_period_months
        type: integer
        source: input
        default: 0
        description: Renewal period in months; must be >= 1 when kind is SUBSCRIPTION and exactly 0 otherwise.
      - name: effective_from
        type: datetime
        source: input
        description: Inclusive start of the plan's effective window (ISO 8601 UTC).
      - name: effective_to
        type: datetime
        source: input
        description: Inclusive end of the plan's effective window (ISO 8601 UTC).
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: Plan availability state.
        constraints: "ACTIVE | RETIRED"

  - name: TaxJurisdiction
    parent: null
    common_fields: false
    fields:
      - name: country_code
        type: string
        source: input
        description: ISO-3166 alpha-2 country code; unique across all TaxJurisdiction rows.
      - name: vat_rate_bps
        type: integer
        source: input
        description: VAT/GST rate in basis points applied to tax-inclusive list prices.
        constraints: "0 <= vat_rate_bps <= 3000"
      - name: marketplace_facilitator
        type: boolean
        source: input
        description: True when the marketplace remits the VAT; false when the developer remits it and receives a tax pass-through.

  - name: RevenueShareTier
    parent: null
    common_fields: false
    fields:
      - name: label
        type: string
        source: input
        description: Human-readable tier name.
      - name: min_cumulative_base_cents
        type: integer
        source: input
        description: Inclusive lower bound of Developer.lifetime_revenue_base_cents at which this tier applies.
      - name: developer_share_bps
        type: integer
        source: input
        description: Developer's share of revenue_base_cents in basis points.
        constraints: "0 < developer_share_bps <= 10000"

  - name: Purchase
    parent: null
    common_fields: true
    fields:
      - name: app_id
        type: string
        source: input
        description: FK -> App.id; the listing that was bought.
      - name: pricing_plan_id
        type: string
        source: input
        description: FK -> PricingPlan.id; the plan the buyer transacted on.
      - name: developer_id
        type: string
        source: system
        description: FK -> Developer.id; copied from App.developer_id at creation.
      - name: tax_jurisdiction_id
        type: string
        source: system
        description: FK -> TaxJurisdiction.id; resolved from buyer_country_code at creation.
      - name: buyer_country_code
        type: string
        source: input
        description: ISO-3166 alpha-2 country of the buyer, used to resolve the TaxJurisdiction.
      - name: external_order_ref
        type: string
        source: input
        description: Storefront order reference; unique across all purchases.
      - name: line_items
        type: array
        source: input
        description: "Array of objects with keys sku (string), unit_price_cents (integer > 0), quantity (integer > 0); at least one element."
      - name: gross_cents
        type: integer
        source: computed
        description: Sum over line_items of unit_price_cents * quantity; tax-inclusive.
      - name: tax_cents
        type: integer
        source: computed
        description: VAT extracted from gross_cents by purchase_tax_split, rounded per line item then summed.
      - name: revenue_base_cents
        type: integer
        source: computed
        description: gross_cents - tax_cents; the commissionable base.
      - name: developer_tax_remittance_cents
        type: integer
        source: computed
        description: tax_cents when the jurisdiction is not a marketplace facilitator, else 0; paid through to the developer.
      - name: tax_remitter
        type: enum
        source: computed
        description: Which party remits the VAT for this purchase.
        constraints: "MARKETPLACE | DEVELOPER"
      - name: provisional_share_bps
        type: integer
        source: computed
        description: Tier rate selected by the PROVISIONAL variant of revenue_share_split at capture time.
      - name: provisional_developer_net_cents
        type: integer
        source: computed
        description: Developer share of revenue_base_cents under the PROVISIONAL variant.
      - name: platform_fee_cents
        type: integer
        source: computed
        description: revenue_base_cents - provisional_developer_net_cents.
      - name: refunded_gross_cents
        type: integer
        source: computed
        default: 0
        description: Cumulative sum of Refund.amount_cents for this purchase where Refund.status is EXECUTED.
      - name: payment_status
        type: enum
        source: system
        default: AUTHORIZED
        description: Money-movement dimension of the purchase.
        constraints: "AUTHORIZED | CAPTURED | VOIDED | PARTIALLY_REFUNDED | REFUNDED | CHARGED_BACK"
      - name: settlement_status
        type: enum
        source: system
        default: UNSETTLED
        description: Developer-ledger dimension of the purchase, evolving independently of payment_status.
        constraints: "UNSETTLED | ACCRUED | PAID | CLAWED_BACK"
      - name: captured_at
        type: datetime
        source: system
        description: Logical-clock instant at which the purchase was captured; null while AUTHORIZED.

  - name: Refund
    parent: null
    common_fields: true
    fields:
      - name: purchase_id
        type: string
        source: system
        description: FK -> Purchase.id; the purchase being refunded.
      - name: amount_cents
        type: integer
        source: input
        description: Tax-inclusive gross amount to refund.
        constraints: "must be > 0"
      - name: reason
        type: enum
        source: input
        description: Why the refund was requested.
        constraints: "BUYER_REQUEST | FRAUD | POLICY | DUPLICATE"
      - name: status
        type: enum
        source: system
        default: REQUESTED
        description: Refund lifecycle state.
        constraints: "REQUESTED | APPROVED | DENIED | EXECUTED"
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the FinanceOps operator who approved or denied this refund; null before decision.
      - name: developer_net_reversal_cents
        type: integer
        source: computed
        description: Portion of the refund charged back to the developer's accrual, computed at execution.
      - name: tax_reversal_cents
        type: integer
        source: computed
        description: VAT portion of the refunded amount, computed at execution.

  - name: Chargeback
    parent: null
    common_fields: true
    fields:
      - name: purchase_id
        type: string
        source: system
        description: FK -> Purchase.id; the disputed purchase.
      - name: network_case_ref
        type: string
        source: input
        description: Card-network dispute reference; unique across all chargebacks.
      - name: amount_cents
        type: integer
        source: input
        description: Disputed gross amount in minor units.
        constraints: "must be > 0"
      - name: status
        type: enum
        source: system
        default: RECEIVED
        description: Dispute lifecycle state.
        constraints: "RECEIVED | REPRESENTED | WON | LOST | REVERSED"
      - name: received_at
        type: datetime
        source: system
        description: Logical-clock instant at which the dispute was recorded.
      - name: clawback_cents
        type: integer
        source: computed
        default: 0
        description: Developer accrual reversed when the dispute resolved LOST; re-credited on REVERSED.

  - name: PolicyCase
    parent: null
    common_fields: true
    fields:
      - name: app_id
        type: string
        source: input
        description: FK -> App.id; the listing under investigation.
      - name: developer_id
        type: string
        source: system
        description: FK -> Developer.id; copied from App.developer_id at creation.
      - name: category
        type: enum
        source: input
        description: Policy violation family.
        constraints: "FRAUD | IP_INFRINGEMENT | MALWARE | CONTENT | PAYMENT_ABUSE"
      - name: severity
        type: enum
        source: input
        description: Severity assigned at intake.
        constraints: "LOW | MEDIUM | HIGH"
      - name: status
        type: enum
        source: system
        default: OPEN
        description: Case lifecycle state.
        constraints: "OPEN | INVESTIGATING | UPHELD | DISMISSED | APPEALED | REINSTATED"
      - name: opened_by_user_id
        type: string
        source: system
        description: X-User-ID of the PolicyOfficer who opened the case.
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the PolicyOfficer who decided the case; null before decision.

  - name: PayoutBatch
    parent: null
    common_fields: true
    fields:
      - name: payout_currency
        type: string
        source: input
        description: ISO-4217 currency this batch pays out in.
      - name: period_start
        type: datetime
        source: input
        description: Inclusive start of the half-open earnings window (ISO 8601 UTC).
      - name: period_end
        type: datetime
        source: input
        description: Exclusive end of the half-open earnings window (ISO 8601 UTC).
      - name: status
        type: enum
        source: system
        default: OPEN
        description: Batch lifecycle state.
        constraints: "OPEN | CALCULATED | PENDING_APPROVAL | APPROVED | PAID | FAILED"
      - name: line_count
        type: integer
        source: computed
        default: 0
        description: Number of PayoutLine rows created by the calculate step.
      - name: total_payable_cents
        type: integer
        source: computed
        default: 0
        description: Sum of PayoutLine.payout_amount_cents over lines whose status is PAYABLE.
      - name: total_withholding_cents
        type: integer
        source: computed
        default: 0
        description: Sum of PayoutLine.withholding_cents over lines whose status is PAYABLE.
      - name: total_reserve_cents
        type: integer
        source: computed
        default: 0
        description: Sum of PayoutLine.reserve_cents over all lines in the batch.
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the FinanceOps operator who submitted the batch for approval.
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the PlatformAdmin who approved the batch.
      - name: failure_reason
        type: string
        source: system
        description: Reason recorded when the pay step failed; null otherwise.

  - name: PayoutLine
    parent: null
    common_fields: true
    fields:
      - name: payout_batch_id
        type: string
        source: system
        description: FK -> PayoutBatch.id; the batch this line belongs to.
      - name: developer_id
        type: string
        source: system
        description: FK -> Developer.id; the payee.
      - name: gross_earnings_cents
        type: integer
        source: computed
        description: Step 1 of payout_line_waterfall - eligible net plus tax pass-through plus carryover minus reversals.
      - name: final_share_bps
        type: integer
        source: computed
        description: Tier rate selected by the FINAL variant of revenue_share_split at calculation time.
      - name: tier_trueup_cents
        type: integer
        source: computed
        description: Sum over eligible purchases of (final net - provisional_developer_net_cents); may be negative.
      - name: reserve_cents
        type: integer
        source: computed
        description: Chargeback reserve withheld from gross_earnings_cents.
      - name: recovery_cents
        type: integer
        source: computed
        description: Amount applied against Developer.negative_balance_cents.
      - name: withholding_cents
        type: integer
        source: computed
        description: Backup withholding applied when the developer has no tax id on file.
      - name: payout_amount_cents
        type: integer
        source: computed
        description: Amount actually paid; 0 when the line is HELD_BELOW_MINIMUM or HELD_DEVELOPER.
      - name: carryover_added_cents
        type: integer
        source: computed
        default: 0
        description: Amount pushed into Developer.carryover_cents because the line fell under MIN_PAYOUT_CENTS.
      - name: status
        type: enum
        source: system
        default: PAYABLE
        description: Line disposition.
        constraints: "PAYABLE | HELD_BELOW_MINIMUM | HELD_DEVELOPER | PAID | FAILED"

  - name: LedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: developer_id
        type: string
        source: system
        description: FK -> Developer.id; the account the entry moves.
      - name: purchase_id
        type: string
        source: system
        description: FK -> Purchase.id; null for entries not tied to a purchase.
      - name: payout_line_id
        type: string
        source: system
        description: FK -> PayoutLine.id; null until the entry is swept into a payout line.
      - name: entry_type
        type: enum
        source: system
        description: Kind of ledger movement.
        constraints: "ACCRUAL | TAX_PASSTHROUGH | TIER_TRUEUP | REFUND_REVERSAL | CLAWBACK | CLAWBACK_REVERSAL | RESERVE | RECOVERY | WITHHOLDING | PAYOUT | CARRYOVER"
      - name: amount_cents
        type: integer
        source: system
        description: Signed amount in minor units; positive credits the developer, negative debits.
      - name: settled
        type: boolean
        source: system
        default: false
        description: True once the entry has been swept into a PAID payout line.
      - name: memo
        type: string
        source: system
        description: Short human-readable description of the movement.

  - name: TaxForm1099
    parent: null
    common_fields: true
    fields:
      - name: developer_id
        type: string
        source: input
        description: FK -> Developer.id; the payee the form reports.
      - name: tax_year
        type: integer
        source: input
        description: Calendar year the form covers; unique per developer.
      - name: reportable_cents
        type: integer
        source: computed
        description: Gross reportable payouts for the year, before backup withholding.
      - name: withheld_cents
        type: integer
        source: computed
        description: Backup withholding remitted for the year.
      - name: threshold_cents
        type: integer
        source: computed
        description: Value of FORM_1099_THRESHOLD_CENTS applied to this form.
      - name: status
        type: enum
        source: system
        description: Whether the form must be issued.
        constraints: "ISSUABLE | NOT_REQUIRED"

state_machines:
  - entity: Developer
    initial_state: PENDING_VERIFICATION
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING_VERIFICATION
        to: ACTIVE
        trigger: "POST /api/developers/{developer_id}/verify"
        actor: PlatformAdmin
        preconditions:
          - "Developer.status == PENDING_VERIFICATION"
          - "Developer.tax_id_provided == true, else ERR_TAX_ID_REQUIRED"
        side_effects:
          - "Developer.status = ACTIVE"
          - "increments Developer.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/developers/{developer_id}/suspend, or system cascade when Developer.policy_strike_count reaches POLICY_STRIKE_SUSPEND_THRESHOLD"
        actor: PolicyOfficer
        preconditions:
          - "Developer.status == ACTIVE"
        side_effects:
          - "Developer.status = SUSPENDED"
          - "Developer.risk_watch = true, so developer_risk_score switches to the ACCELERATED variant and Developer.risk_variant = ACCELERATED"
          - "Developer.payout_hold = true"
          - "every PayoutLine of this developer whose status is PAYABLE and whose PayoutBatch.status is in {CALCULATED, PENDING_APPROVAL} flips to HELD_DEVELOPER with payout_amount_cents = 0"
          - "each PayoutLine that flipped to HELD_DEVELOPER causes its PayoutBatch.total_payable_cents and PayoutBatch.total_withholding_cents to be recomputed over the remaining PAYABLE lines"
        note: "Third link of the policy-takedown cascade; the fourth link is the batch-total recomputation."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/developers/{developer_id}/reinstate"
        actor: PolicyOfficer
        preconditions:
          - "Developer.status == SUSPENDED"
        side_effects:
          - "Developer.status = ACTIVE"
          - "Developer.risk_watch = false and developer_risk_score is recomputed with the STANDARD variant"
          - "Developer.payout_hold = false only when Developer.negative_balance_cents == 0"
        note: "Cycle back into ACTIVE; PayoutLines already flipped to HELD_DEVELOPER are not restored."
      - from: PENDING_VERIFICATION
        to: TERMINATED
        trigger: "POST /api/developers/{developer_id}/terminate"
        actor: PlatformAdmin
        preconditions:
          - "Developer.status != TERMINATED"
        side_effects:
          - "Developer.status = TERMINATED"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /api/developers/{developer_id}/terminate"
        actor: PlatformAdmin
        preconditions:
          - "Developer.status != TERMINATED"
        side_effects:
          - "Developer.status = TERMINATED"
          - "every App of this developer whose status is not DELISTED moves to DELISTED"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /api/developers/{developer_id}/terminate"
        actor: PlatformAdmin
        preconditions:
          - "Developer.status != TERMINATED"
        side_effects:
          - "Developer.status = TERMINATED"
          - "every App of this developer whose status is not DELISTED moves to DELISTED"

  - entity: App
    initial_state: DRAFT
    terminal_states: [DELISTED]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /api/apps/{app_id}/submit-for-review"
        actor: Developer
        preconditions:
          - "App.status == DRAFT"
          - "X-User-ID == App.developer_id"
          - "at least one PricingPlan exists for this app with status == ACTIVE"
        side_effects:
          - "App.status = IN_REVIEW"
          - "App.review_round increments by 1"
          - "creates a ReviewSubmission with status SUBMITTED and round_number = App.review_round"
      - from: CHANGES_REQUESTED
        to: IN_REVIEW
        trigger: "POST /api/apps/{app_id}/submit-for-review"
        actor: Developer
        preconditions:
          - "App.status == CHANGES_REQUESTED"
          - "X-User-ID == App.developer_id"
          - "at least one PricingPlan exists for this app with status == ACTIVE"
        side_effects:
          - "App.status = IN_REVIEW"
          - "App.review_round increments by 1"
          - "creates a ReviewSubmission with status SUBMITTED and round_number = App.review_round"
        note: "Revision loop: an app may re-enter review any number of times."
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /api/review-submissions/{review_submission_id}/decision with outcome PASSED"
        actor: ReviewAgent
        preconditions:
          - "App.status == IN_REVIEW"
          - "the ReviewSubmission.status == IN_TRIAGE"
        side_effects:
          - "App.status = APPROVED"
      - from: IN_REVIEW
        to: CHANGES_REQUESTED
        trigger: "POST /api/review-submissions/{review_submission_id}/decision with outcome REJECTED"
        actor: ReviewAgent
        preconditions:
          - "App.status == IN_REVIEW"
          - "the ReviewSubmission.status == IN_TRIAGE"
        side_effects:
          - "App.status = CHANGES_REQUESTED"
      - from: APPROVED
        to: LIVE
        trigger: "POST /api/apps/{app_id}/publish"
        actor: Developer
        preconditions:
          - "App.status == APPROVED"
          - "X-User-ID == App.developer_id"
          - "the owning Developer.status == ACTIVE, else ERR_DEVELOPER_NOT_ACTIVE"
        side_effects:
          - "App.status = LIVE"
      - from: LIVE
        to: SUSPENDED
        trigger: "POST /api/apps/{app_id}/suspend"
        actor: PolicyOfficer
        preconditions:
          - "App.status == LIVE"
        side_effects:
          - "App.status = SUSPENDED"
          - "new purchases against this app are rejected with ERR_APP_NOT_PURCHASABLE"
      - from: SUSPENDED
        to: LIVE
        trigger: "POST /api/apps/{app_id}/reinstate"
        actor: PolicyOfficer
        preconditions:
          - "App.status == SUSPENDED"
          - "the owning Developer.status == ACTIVE, else ERR_DEVELOPER_NOT_ACTIVE"
        side_effects:
          - "App.status = LIVE"
        note: "LIVE <-> SUSPENDED is a cycle; an app may be suspended and reinstated repeatedly."
      - from: DRAFT
        to: DELISTED
        trigger: "POST /api/apps/{app_id}/delist, or system cascade from a Developer termination"
        actor: PolicyOfficer
        preconditions:
          - "App.status != DELISTED"
        side_effects:
          - "App.status = DELISTED"
          - "every PricingPlan of this app whose status is ACTIVE moves to RETIRED"
          - "App.policy_strike_count increments by 1 and Developer.policy_strike_count increments by 1"
          - "when the resulting Developer.policy_strike_count >= POLICY_STRIKE_SUSPEND_THRESHOLD and Developer.status == ACTIVE, the Developer transitions ACTIVE -> SUSPENDED with all of that transition's side effects"
      - from: APPROVED
        to: DELISTED
        trigger: "POST /api/apps/{app_id}/delist, or system cascade from a Developer termination"
        actor: PolicyOfficer
        preconditions:
          - "App.status != DELISTED"
        side_effects:
          - "App.status = DELISTED"
          - "every PricingPlan of this app whose status is ACTIVE moves to RETIRED"
          - "App.policy_strike_count increments by 1 and Developer.policy_strike_count increments by 1"
          - "when the resulting Developer.policy_strike_count >= POLICY_STRIKE_SUSPEND_THRESHOLD and Developer.status == ACTIVE, the Developer transitions ACTIVE -> SUSPENDED with all of that transition's side effects"
      - from: LIVE
        to: DELISTED
        trigger: "POST /api/apps/{app_id}/delist, or system cascade from a PolicyCase decision of UPHELD"
        actor: PolicyOfficer
        preconditions:
          - "App.status != DELISTED"
        side_effects:
          - "App.status = DELISTED"
          - "every PricingPlan of this app whose status is ACTIVE moves to RETIRED"
          - "App.policy_strike_count increments by 1 and Developer.policy_strike_count increments by 1"
          - "when the resulting Developer.policy_strike_count >= POLICY_STRIKE_SUSPEND_THRESHOLD and Developer.status == ACTIVE, the Developer transitions ACTIVE -> SUSPENDED with all of that transition's side effects"
        note: "Second link of the policy-takedown cascade."
      - from: SUSPENDED
        to: DELISTED
        trigger: "POST /api/apps/{app_id}/delist, or system cascade from a PolicyCase decision of UPHELD"
        actor: PolicyOfficer
        preconditions:
          - "App.status != DELISTED"
        side_effects:
          - "App.status = DELISTED"
          - "every PricingPlan of this app whose status is ACTIVE moves to RETIRED"
          - "App.policy_strike_count increments by 1 and Developer.policy_strike_count increments by 1"
          - "when the resulting Developer.policy_strike_count >= POLICY_STRIKE_SUSPEND_THRESHOLD and Developer.status == ACTIVE, the Developer transitions ACTIVE -> SUSPENDED with all of that transition's side effects"

  - entity: ReviewSubmission
    initial_state: SUBMITTED
    terminal_states: [PASSED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: IN_TRIAGE
        trigger: "POST /api/review-submissions/{review_submission_id}/triage"
        actor: ReviewAgent
        preconditions:
          - "ReviewSubmission.status == SUBMITTED"
        side_effects:
          - "ReviewSubmission.status = IN_TRIAGE"
          - "ReviewSubmission.triaged_by_user_id = X-User-ID"
      - from: IN_TRIAGE
        to: PASSED
        trigger: "POST /api/review-submissions/{review_submission_id}/decision with outcome PASSED"
        actor: ReviewAgent
        preconditions:
          - "ReviewSubmission.status == IN_TRIAGE"
        side_effects:
          - "ReviewSubmission.status = PASSED and decision_reason is stored"
          - "the linked App transitions IN_REVIEW -> APPROVED"
      - from: IN_TRIAGE
        to: REJECTED
        trigger: "POST /api/review-submissions/{review_submission_id}/decision with outcome REJECTED"
        actor: ReviewAgent
        preconditions:
          - "ReviewSubmission.status == IN_TRIAGE"
        side_effects:
          - "ReviewSubmission.status = REJECTED and decision_reason is stored"
          - "the linked App transitions IN_REVIEW -> CHANGES_REQUESTED"

  - entity: Purchase
    initial_state: AUTHORIZED
    terminal_states: [VOIDED]
    note: |
      Purchase carries two independent state dimensions on the same row.
      Dimension 1 (payment_status): AUTHORIZED | CAPTURED | VOIDED | PARTIALLY_REFUNDED | REFUNDED | CHARGED_BACK.
      Dimension 2 (settlement_status): UNSETTLED | ACCRUED | PAID | CLAWED_BACK.
      A purchase may be PARTIALLY_REFUNDED while still ACCRUED, or CAPTURED while already PAID.
      The `from:`/`to:` fields below name the dimension explicitly in `note:`.
    transitions:
      - from: AUTHORIZED
        to: CAPTURED
        trigger: "POST /api/purchases/{purchase_id}/capture"
        actor: StorefrontService
        preconditions:
          - "Purchase.payment_status == AUTHORIZED"
        side_effects:
          - "Purchase.payment_status = CAPTURED and Purchase.captured_at = current logical clock"
          - "runs revenue_share_split in its PROVISIONAL variant, writing provisional_share_bps, provisional_developer_net_cents and platform_fee_cents"
          - "Developer.lifetime_revenue_base_cents increases by Purchase.revenue_base_cents"
          - "Purchase.settlement_status moves UNSETTLED -> ACCRUED"
          - "creates a LedgerEntry with entry_type ACCRUAL and amount_cents = provisional_developer_net_cents"
          - "when tax_remitter == DEVELOPER, also creates a LedgerEntry with entry_type TAX_PASSTHROUGH and amount_cents = developer_tax_remittance_cents"
          - "Developer.unpaid_accrual_cents is recomputed as the sum of that developer's unsettled LedgerEntry.amount_cents"
          - "developer_risk_score is recomputed, refreshing Developer.risk_score and Developer.risk_variant"
        note: "Dimension 1 transition that also drives the dimension-2 transition UNSETTLED -> ACCRUED."
      - from: AUTHORIZED
        to: VOIDED
        trigger: "POST /api/purchases/{purchase_id}/void"
        actor: StorefrontService
        preconditions:
          - "Purchase.payment_status == AUTHORIZED"
        side_effects:
          - "Purchase.payment_status = VOIDED"
          - "Purchase.settlement_status stays UNSETTLED and no LedgerEntry is created"
        note: "Dimension 1 terminal branch."
      - from: CAPTURED
        to: PARTIALLY_REFUNDED
        trigger: "POST /api/refunds/{refund_id}/execute where refunded_gross_cents after execution is less than gross_cents"
        actor: FinanceOps
        preconditions:
          - "Purchase.payment_status == CAPTURED"
        side_effects:
          - "Purchase.payment_status = PARTIALLY_REFUNDED"
          - "Purchase.refunded_gross_cents increases by Refund.amount_cents"
          - "creates a LedgerEntry with entry_type REFUND_REVERSAL and amount_cents = -Refund.developer_net_reversal_cents"
          - "Developer.unpaid_accrual_cents is recomputed"
        note: "Dimension 1; settlement_status is untouched, demonstrating dimension independence."
      - from: CAPTURED
        to: REFUNDED
        trigger: "POST /api/refunds/{refund_id}/execute where refunded_gross_cents after execution equals gross_cents"
        actor: FinanceOps
        preconditions:
          - "Purchase.payment_status == CAPTURED"
        side_effects:
          - "Purchase.payment_status = REFUNDED"
          - "Purchase.refunded_gross_cents = Purchase.gross_cents"
          - "creates a LedgerEntry with entry_type REFUND_REVERSAL and amount_cents = -Refund.developer_net_reversal_cents"
          - "Developer.unpaid_accrual_cents is recomputed"
      - from: PARTIALLY_REFUNDED
        to: REFUNDED
        trigger: "POST /api/refunds/{refund_id}/execute where refunded_gross_cents after execution equals gross_cents"
        actor: FinanceOps
        preconditions:
          - "Purchase.payment_status == PARTIALLY_REFUNDED"
        side_effects:
          - "Purchase.payment_status = REFUNDED"
          - "creates a LedgerEntry with entry_type REFUND_REVERSAL and amount_cents = -Refund.developer_net_reversal_cents"
          - "Developer.unpaid_accrual_cents is recomputed"
      - from: CAPTURED
        to: CHARGED_BACK
        trigger: "POST /api/chargebacks/{chargeback_id}/resolve with outcome LOST"
        actor: FinanceOps
        preconditions:
          - "Purchase.payment_status in {CAPTURED, PARTIALLY_REFUNDED}"
        side_effects:
          - "Purchase.payment_status = CHARGED_BACK"
          - "Purchase.settlement_status moves to CLAWED_BACK"
          - "Chargeback.clawback_cents = Purchase.provisional_developer_net_cents and a LedgerEntry with entry_type CLAWBACK and amount_cents = -clawback_cents is created"
          - "Developer.unpaid_accrual_cents is recomputed from unsettled LedgerEntry rows"
          - "when the recomputed Developer.unpaid_accrual_cents is negative, Developer.negative_balance_cents = -unpaid_accrual_cents, Developer.unpaid_accrual_cents = 0, and Developer.payout_hold = true"
          - "developer_risk_score is recomputed"
        note: "Head of the chargeback cascade; links 2 and 3 fire off the ledger movement, not off the resolve call."
      - from: PARTIALLY_REFUNDED
        to: CHARGED_BACK
        trigger: "POST /api/chargebacks/{chargeback_id}/resolve with outcome LOST"
        actor: FinanceOps
        preconditions:
          - "Purchase.payment_status in {CAPTURED, PARTIALLY_REFUNDED}"
        side_effects:
          - "Purchase.payment_status = CHARGED_BACK"
          - "Purchase.settlement_status moves to CLAWED_BACK"
          - "Chargeback.clawback_cents = Purchase.provisional_developer_net_cents - sum of executed Refund.developer_net_reversal_cents on this purchase, floored at 0"
          - "Developer.unpaid_accrual_cents is recomputed"
      - from: ACCRUED
        to: PAID
        trigger: "POST /api/payout-batches/{payout_batch_id}/pay with outcome SUCCEEDED"
        actor: FinanceOps
        preconditions:
          - "Purchase.settlement_status == ACCRUED"
          - "the purchase's LedgerEntry rows were swept into a PayoutLine whose status becomes PAID"
        side_effects:
          - "Purchase.settlement_status = PAID"
          - "every LedgerEntry of that purchase carrying the sweeping payout_line_id has settled = true"
        note: "Dimension 2 transition, independent of payment_status."
      - from: PAID
        to: CLAWED_BACK
        trigger: "POST /api/chargebacks/{chargeback_id}/resolve with outcome LOST on an already-paid purchase"
        actor: FinanceOps
        preconditions:
          - "Purchase.settlement_status == PAID"
        side_effects:
          - "Purchase.settlement_status = CLAWED_BACK"
          - "a LedgerEntry with entry_type CLAWBACK and settled = false is created, driving Developer.unpaid_accrual_cents negative and therefore Developer.negative_balance_cents positive"
        note: "Dimension 2 transition reachable only after a payout has already settled the purchase."

  - entity: Refund
    initial_state: REQUESTED
    terminal_states: [DENIED, EXECUTED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /api/refunds/{refund_id}/decide with outcome APPROVED"
        actor: FinanceOps
        preconditions:
          - "Refund.status == REQUESTED"
        side_effects:
          - "Refund.status = APPROVED and decided_by_user_id = X-User-ID"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /api/refunds/{refund_id}/decide with outcome DENIED"
        actor: FinanceOps
        preconditions:
          - "Refund.status == REQUESTED"
        side_effects:
          - "Refund.status = DENIED and decided_by_user_id = X-User-ID"
      - from: APPROVED
        to: EXECUTED
        trigger: "POST /api/refunds/{refund_id}/execute"
        actor: FinanceOps
        preconditions:
          - "Refund.status == APPROVED"
          - "the linked Purchase.payment_status is in {CAPTURED, PARTIALLY_REFUNDED}, else ERR_PURCHASE_NOT_REFUNDABLE"
        side_effects:
          - "Refund.status = EXECUTED"
          - "runs refund_reversal_split, writing Refund.tax_reversal_cents and Refund.developer_net_reversal_cents"
          - "drives the Purchase payment dimension to PARTIALLY_REFUNDED or REFUNDED"
          - "developer_risk_score is recomputed"

  - entity: Chargeback
    initial_state: RECEIVED
    terminal_states: [WON, REVERSED]
    transitions:
      - from: RECEIVED
        to: REPRESENTED
        trigger: "POST /api/chargebacks/{chargeback_id}/represent"
        actor: FinanceOps
        preconditions:
          - "Chargeback.status == RECEIVED"
          - "current logical clock is strictly before received_at plus CHARGEBACK_REPRESENT_WINDOW_DAYS, else ERR_REPRESENTMENT_WINDOW_EXPIRED"
        side_effects:
          - "Chargeback.status = REPRESENTED"
      - from: RECEIVED
        to: LOST
        trigger: "POST /api/chargebacks/{chargeback_id}/resolve with outcome LOST"
        actor: FinanceOps
        preconditions:
          - "Chargeback.status in {RECEIVED, REPRESENTED}"
        side_effects:
          - "Chargeback.status = LOST"
          - "drives the Purchase transition to CHARGED_BACK with all of that transition's side effects"
      - from: REPRESENTED
        to: WON
        trigger: "POST /api/chargebacks/{chargeback_id}/resolve with outcome WON"
        actor: FinanceOps
        preconditions:
          - "Chargeback.status in {RECEIVED, REPRESENTED}"
        side_effects:
          - "Chargeback.status = WON"
          - "no ledger movement; Purchase.payment_status and settlement_status are unchanged"
      - from: REPRESENTED
        to: LOST
        trigger: "POST /api/chargebacks/{chargeback_id}/resolve with outcome LOST"
        actor: FinanceOps
        preconditions:
          - "Chargeback.status in {RECEIVED, REPRESENTED}"
        side_effects:
          - "Chargeback.status = LOST"
          - "drives the Purchase transition to CHARGED_BACK with all of that transition's side effects"
      - from: LOST
        to: REVERSED
        trigger: "POST /api/chargebacks/{chargeback_id}/reverse"
        actor: FinanceOps
        preconditions:
          - "Chargeback.status == LOST"
        side_effects:
          - "Chargeback.status = REVERSED"
          - "creates a LedgerEntry with entry_type CLAWBACK_REVERSAL and amount_cents = +Chargeback.clawback_cents"
          - "Purchase.payment_status returns to CAPTURED or PARTIALLY_REFUNDED according to whether refunded_gross_cents is 0"
          - "Purchase.settlement_status returns to ACCRUED"
          - "Developer.unpaid_accrual_cents, Developer.negative_balance_cents and Developer.payout_hold are recomputed from the ledger"
          - "developer_risk_score is recomputed, refreshing Developer.risk_score and Developer.risk_variant"
        note: "Compensating action for the LOST transition; the DEVELOPER_ACCRUAL_IDENTITY must be restored exactly."

  - entity: PolicyCase
    initial_state: OPEN
    terminal_states: [DISMISSED, REINSTATED]
    transitions:
      - from: OPEN
        to: INVESTIGATING
        trigger: "POST /api/policy-cases/{policy_case_id}/investigate"
        actor: PolicyOfficer
        preconditions:
          - "PolicyCase.status == OPEN"
        side_effects:
          - "PolicyCase.status = INVESTIGATING"
          - "Developer.risk_watch = true and Developer.risk_variant = ACCELERATED, so developer_risk_score switches to the 30-day window"
      - from: INVESTIGATING
        to: UPHELD
        trigger: "POST /api/policy-cases/{policy_case_id}/decide with outcome UPHELD"
        actor: PolicyOfficer
        preconditions:
          - "PolicyCase.status == INVESTIGATING"
          - "X-User-ID != PolicyCase.opened_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "PolicyCase.status = UPHELD and decided_by_user_id = X-User-ID"
          - "the linked App transitions to DELISTED with all of that transition's side effects"
        note: "Head of the policy-takedown cascade: case -> app -> developer -> payout lines -> batch totals."
      - from: INVESTIGATING
        to: DISMISSED
        trigger: "POST /api/policy-cases/{policy_case_id}/decide with outcome DISMISSED"
        actor: PolicyOfficer
        preconditions:
          - "PolicyCase.status == INVESTIGATING"
          - "X-User-ID != PolicyCase.opened_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "PolicyCase.status = DISMISSED and decided_by_user_id = X-User-ID"
          - "Developer.risk_watch = false when no other PolicyCase of that developer is in status OPEN, INVESTIGATING or APPEALED"
      - from: UPHELD
        to: APPEALED
        trigger: "POST /api/policy-cases/{policy_case_id}/appeal"
        actor: Developer
        preconditions:
          - "PolicyCase.status == UPHELD"
          - "X-User-ID == PolicyCase.developer_id"
        side_effects:
          - "PolicyCase.status = APPEALED"
      - from: APPEALED
        to: UPHELD
        trigger: "POST /api/policy-cases/{policy_case_id}/appeal-decision with outcome DENIED"
        actor: PolicyOfficer
        preconditions:
          - "PolicyCase.status == APPEALED"
          - "X-User-ID != PolicyCase.opened_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "PolicyCase.status = UPHELD"
        note: "UPHELD -> APPEALED -> UPHELD is a cycle; a case may be appealed and re-upheld repeatedly."
      - from: APPEALED
        to: REINSTATED
        trigger: "POST /api/policy-cases/{policy_case_id}/appeal-decision with outcome GRANTED"
        actor: PolicyOfficer
        preconditions:
          - "PolicyCase.status == APPEALED"
          - "X-User-ID != PolicyCase.opened_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "PolicyCase.status = REINSTATED"
          - "App.policy_strike_count decrements by 1 and Developer.policy_strike_count decrements by 1, both floored at 0"
          - "the App stays DELISTED; reinstatement of the listing itself is out of scope"

  - entity: PayoutBatch
    initial_state: OPEN
    terminal_states: [PAID]
    transitions:
      - from: OPEN
        to: CALCULATED
        trigger: "POST /api/payout-batches/{payout_batch_id}/calculate"
        actor: FinanceOps
        preconditions:
          - "PayoutBatch.status == OPEN"
        side_effects:
          - "runs revenue_share_split in its FINAL variant and payout_line_waterfall once per eligible developer"
          - "creates one PayoutLine per eligible developer and sets PayoutBatch.line_count, total_payable_cents, total_withholding_cents, total_reserve_cents"
          - "PayoutBatch.status = CALCULATED"
        note: "When no developer is eligible the batch still moves to CALCULATED with line_count 0 and all totals 0."
      - from: CALCULATED
        to: PENDING_APPROVAL
        trigger: "POST /api/payout-batches/{payout_batch_id}/submit"
        actor: FinanceOps
        preconditions:
          - "PayoutBatch.status == CALCULATED"
        side_effects:
          - "PayoutBatch.status = PENDING_APPROVAL and submitted_by_user_id = X-User-ID"
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /api/payout-batches/{payout_batch_id}/approve"
        actor: PlatformAdmin
        preconditions:
          - "PayoutBatch.status == PENDING_APPROVAL"
          - "no PayoutLine in this batch with status PAYABLE belongs to a Developer whose payout_hold is true, else ERR_DEVELOPER_PAYOUT_HELD"
        side_effects:
          - "PayoutBatch.status = APPROVED and approved_by_user_id = X-User-ID"
      - from: APPROVED
        to: PAID
        trigger: "POST /api/payout-batches/{payout_batch_id}/pay with outcome SUCCEEDED"
        actor: FinanceOps
        preconditions:
          - "PayoutBatch.status == APPROVED"
        side_effects:
          - "PayoutBatch.status = PAID"
          - "every PayoutLine with status PAYABLE moves to PAID"
          - "for each PAID line, creates LedgerEntry rows of entry_type PAYOUT, RESERVE, RECOVERY, WITHHOLDING and CARRYOVER as produced by payout_line_waterfall, and marks every swept LedgerEntry settled = true with payout_line_id set"
          - "each swept Purchase moves settlement_status ACCRUED -> PAID"
          - "Developer.negative_balance_cents decreases by PayoutLine.recovery_cents and Developer.carryover_cents is set from PayoutLine.carryover_added_cents"
      - from: APPROVED
        to: FAILED
        trigger: "POST /api/payout-batches/{payout_batch_id}/pay with outcome FAILED"
        actor: FinanceOps
        preconditions:
          - "PayoutBatch.status == APPROVED"
        side_effects:
          - "PayoutBatch.status = FAILED and failure_reason is stored"
          - "every PayoutLine with status PAYABLE moves to FAILED"
          - "no LedgerEntry is created and no Purchase settlement_status changes"
      - from: FAILED
        to: PENDING_APPROVAL
        trigger: "POST /api/payout-batches/{payout_batch_id}/retry"
        actor: FinanceOps
        preconditions:
          - "PayoutBatch.status == FAILED"
        side_effects:
          - "PayoutBatch.status = PENDING_APPROVAL and failure_reason is cleared"
          - "every PayoutLine with status FAILED returns to PAYABLE"
        note: "Retry cycle: FAILED -> PENDING_APPROVAL -> APPROVED -> PAID or FAILED again."

  - entity: PayoutLine
    initial_state: PAYABLE
    terminal_states: [PAID]
    transitions:
      - from: PAYABLE
        to: HELD_DEVELOPER
        trigger: "system cascade when the line's Developer transitions ACTIVE -> SUSPENDED"
        actor: system
        preconditions:
          - "PayoutLine.status == PAYABLE"
          - "the owning PayoutBatch.status is in {CALCULATED, PENDING_APPROVAL}"
        side_effects:
          - "PayoutLine.status = HELD_DEVELOPER and payout_amount_cents = 0"
          - "the owning PayoutBatch.total_payable_cents and total_withholding_cents are recomputed over remaining PAYABLE lines"
      - from: PAYABLE
        to: PAID
        trigger: "POST /api/payout-batches/{payout_batch_id}/pay with outcome SUCCEEDED"
        actor: FinanceOps
        preconditions:
          - "PayoutLine.status == PAYABLE"
          - "PayoutBatch.status == APPROVED"
        side_effects:
          - "PayoutLine.status = PAID"
          - "LedgerEntry rows are written and the swept purchases settle"
      - from: PAYABLE
        to: FAILED
        trigger: "POST /api/payout-batches/{payout_batch_id}/pay with outcome FAILED"
        actor: FinanceOps
        preconditions:
          - "PayoutLine.status == PAYABLE"
        side_effects:
          - "PayoutLine.status = FAILED"
      - from: FAILED
        to: PAYABLE
        trigger: "POST /api/payout-batches/{payout_batch_id}/retry"
        actor: FinanceOps
        preconditions:
          - "PayoutLine.status == FAILED"
        side_effects:
          - "PayoutLine.status = PAYABLE"

concurrency_rules:
  - rule_id: pricing-plan-create-stale-app
    parent_entity: App
    write_endpoint: "POST /api/apps/{app_id}/pricing-plans"
    occ_field: "expected_app_version"
    description: |
      Creating a PricingPlan against an App whose version has advanced since the
      client last read it is rejected with a stale-version error. A newly created
      plan legitimately supersedes the prior plan of the same kind by extending
      the effective-window chain, so a writer working from an out-of-date view of
      the app would silently append behind a window it never saw.
    error_id: ERR_STALE_APP_VERSION
    http_status: 412

  - rule_id: payout-hold-set-stale-developer
    parent_entity: Developer
    write_endpoint: "POST /api/developers/{developer_id}/payout-holds"
    occ_field: "expected_developer_version"
    description: |
      Setting or clearing a payout hold on a Developer whose version has advanced
      since the client last read it is rejected with a stale-version error. Hold
      decisions are taken against an observed ledger position, and any cascade
      that moved negative_balance_cents in between invalidates that position.
    error_id: ERR_STALE_DEVELOPER_VERSION
    http_status: 412

calculations:
  - name: purchase_tax_split
    trigger: "POST /api/purchases — runs once at purchase creation, before any share calculation"
    algorithm: threshold
    formula: |
      jurisdiction = the TaxJurisdiction whose country_code == Purchase.buyer_country_code
                     (exactly one row exists; absence is ERR_JURISDICTION_NOT_CONFIGURED)
      r = jurisdiction.vat_rate_bps

      # PINNED ROUNDING ORDER: round each line item's VAT to whole cents FIRST,
      # then sum the rounded per-line amounts. Summing the line grosses and
      # rounding once at the end is explicitly NOT the rule and yields a
      # different tax_cents whenever more than one line item is present.
      for each line in Purchase.line_items (in the order supplied in the request body):
          line_gross = line.unit_price_cents * line.quantity
          line_tax   = round_half_up(line_gross * r / (10000 + r))

      gross_cents = sum over lines of line_gross
      tax_cents   = sum over lines of line_tax          # round-then-sum
      revenue_base_cents = gross_cents - tax_cents

      if jurisdiction.marketplace_facilitator == true:
          tax_remitter = "MARKETPLACE"
          developer_tax_remittance_cents = 0
      else:
          tax_remitter = "DEVELOPER"
          developer_tax_remittance_cents = tax_cents
    input_set: "The line_items array supplied on the create request; prices are tax-inclusive. No other purchase participates."
    constants:
      ROUNDING_ORDER: "per_line_then_sum"
    precision: "whole cents, round_half_up applied once per line item"

  - name: revenue_share_split
    trigger: "PROVISIONAL variant on POST /api/purchases/{purchase_id}/capture; FINAL variant on POST /api/payout-batches/{payout_batch_id}/calculate"
    algorithm: tiered_pricing
    formula: |
      # Tier selection (deterministic selector)
      #   candidate set : all RevenueShareTier rows with min_cumulative_base_cents <= base_amount
      #   ranking       : min_cumulative_base_cents DESC
      #   tie-break     : developer_share_bps DESC, then created_at ASC
      #   empty set     : fall back to DEFAULT_SHARE_BPS
      select_tier(base_amount):
          candidates = [t for t in RevenueShareTier if t.min_cumulative_base_cents <= base_amount]
          if candidates is empty: return DEFAULT_SHARE_BPS
          sort candidates by (min_cumulative_base_cents DESC, developer_share_bps DESC, created_at ASC)
          return candidates[0].developer_share_bps

      # PROVISIONAL — evaluated at capture, BEFORE this purchase is folded into the developer's lifetime base
      provisional_share_bps = select_tier(Developer.lifetime_revenue_base_cents)   # value as of just before this capture
      provisional_developer_net_cents = round_half_up(Purchase.revenue_base_cents * provisional_share_bps / 10000)
      platform_fee_cents = Purchase.revenue_base_cents - provisional_developer_net_cents

      # FINAL — evaluated once per developer at batch calculation, AFTER every capture in the window landed
      final_share_bps = select_tier(Developer.lifetime_revenue_base_cents)         # value at calculation time
      for each eligible purchase p of that developer in the batch:
          final_net(p) = round_half_up(p.revenue_base_cents * final_share_bps / 10000)
      tier_trueup_cents = sum over eligible p of (final_net(p) - p.provisional_developer_net_cents)
    input_set: "PROVISIONAL: the single purchase being captured. FINAL: every Purchase of the developer with settlement_status ACCRUED whose captured_at is in [PayoutBatch.period_start, PayoutBatch.period_end) and whose PricingPlan.currency == PayoutBatch.payout_currency."
    constants:
      DEFAULT_SHARE_BPS: 7000
    precision: "whole cents, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "At POST /api/purchases/{purchase_id}/capture, on the Purchase row"
        difference: "Tier is chosen from the developer's lifetime base EXCLUDING the purchase being captured, so a purchase that itself crosses a tier boundary is booked at the lower rate."
      - name: FINAL
        when: "At POST /api/payout-batches/{payout_batch_id}/calculate, on the PayoutLine row"
        difference: "Tier is chosen once per developer from the lifetime base INCLUDING every capture in the window and applied to every eligible purchase, so the boundary-crossing purchase and all its predecessors are re-rated upward; the delta is booked as tier_trueup_cents."

  - name: developer_risk_score
    trigger: "Recomputed on POST /api/purchases/{purchase_id}/capture, POST /api/refunds/{refund_id}/execute, POST /api/chargebacks/{chargeback_id}/resolve, POST /api/chargebacks/{chargeback_id}/reverse, POST /api/policy-cases/{policy_case_id}/investigate, POST /api/policy-cases/{policy_case_id}/decide, POST /api/developers/{developer_id}/suspend and POST /api/developers/{developer_id}/reinstate"
    algorithm: weighted_scoring
    formula: |
      scored_set = Purchase rows of this developer whose payment_status is in
                   {CAPTURED, PARTIALLY_REFUNDED, REFUNDED, CHARGED_BACK}
                   (VOIDED and AUTHORIZED purchases never enter the score)
      if Developer.risk_watch == true:
          scored_set = scored_set filtered to captured_at >= (current logical clock - RISK_WINDOW_DAYS days), inclusive
          variant = "ACCELERATED"
      else:
          variant = "STANDARD"

      denom = sum over scored_set of gross_cents
      if denom == 0:
          refund_rate = 0
          chargeback_rate = 0
      else:
          refund_rate     = (sum over scored_set of refunded_gross_cents) / denom
          chargeback_rate = (sum over scored_set of gross_cents where payment_status == CHARGED_BACK) / denom

      strike_factor = min(1, Developer.policy_strike_count / POLICY_STRIKE_SUSPEND_THRESHOLD)
      raw = REFUND_WEIGHT * refund_rate + CHARGEBACK_WEIGHT * chargeback_rate + STRIKE_WEIGHT * strike_factor
      risk_score   = min(100, round_half_up(raw))
      risk_variant = variant
    input_set: "Purchases of the developer that reached capture; the ACCELERATED variant additionally clips the set to the trailing RISK_WINDOW_DAYS by captured_at."
    constants:
      REFUND_WEIGHT: 40
      CHARGEBACK_WEIGHT: 40
      STRIKE_WEIGHT: 20
      RISK_WINDOW_DAYS: 30
      POLICY_STRIKE_SUSPEND_THRESHOLD: 3
    precision: "integer 0..100, round_half_up on the weighted sum"
    variants:
      - name: STANDARD
        when: "Developer.risk_watch == false"
        difference: "Denominator and numerators span every captured purchase for all time, so old refunds keep depressing the score forever."
      - name: ACCELERATED
        when: "Developer.risk_watch == true (set by a PolicyCase entering INVESTIGATING or by a developer suspension)"
        difference: "Denominator and numerators are clipped to purchases captured within the trailing RISK_WINDOW_DAYS, so the same underlying data yields a different score."

  - name: refund_reversal_split
    trigger: "POST /api/refunds/{refund_id}/execute"
    algorithm: waterfall_allocation
    formula: |
      r = the vat_rate_bps of the Purchase's TaxJurisdiction
      prior_tax_reversed = sum of tax_reversal_cents over EXECUTED Refunds of this purchase
      prior_net_reversed = sum of developer_net_reversal_cents over EXECUTED Refunds of this purchase

      if Purchase.refunded_gross_cents + Refund.amount_cents == Purchase.gross_cents:
          # FULL-REFUND CLAMP — the closing refund absorbs every remaining cent so
          # the per-purchase ledger identity closes exactly at zero.
          tax_reversal_cents           = Purchase.tax_cents - prior_tax_reversed
          developer_net_reversal_cents = Purchase.provisional_developer_net_cents - prior_net_reversed
      else:
          tax_reversal_cents           = round_half_up(Refund.amount_cents * r / (10000 + r))
          refund_base                  = Refund.amount_cents - tax_reversal_cents
          developer_net_reversal_cents = round_half_up(refund_base * Purchase.provisional_share_bps / 10000)
    input_set: "The single Refund being executed plus every previously EXECUTED Refund on the same Purchase."
    constants:
      FULL_REFUND_CLAMP: true
    precision: "whole cents, round_half_up"

  - name: payout_line_waterfall
    trigger: "POST /api/payout-batches/{payout_batch_id}/calculate — once per eligible developer"
    algorithm: waterfall_allocation
    formula: |
      # The withholding base LOOKS circular: withholding is a rate on "what is
      # payable", while payable is defined as the amount left after withholding.
      # The evaluation order below is PINNED and resolves it: withholding is
      # always taken on after_recovery (the pre-withholding balance), never on
      # payable_cents.

      step 0: eligible = Purchases of this developer with settlement_status == ACCRUED,
                         captured_at in [PayoutBatch.period_start, PayoutBatch.period_end),
                         and PricingPlan.currency == PayoutBatch.payout_currency
      step 1: gross_earnings_cents =
                  sum over eligible p of final_net(p)                                   # revenue_share_split FINAL
                + sum over eligible p of p.developer_tax_remittance_cents
                - sum over eligible p of (EXECUTED Refund.developer_net_reversal_cents on p)
                + Developer.carryover_cents
      step 2: reserve_cents   = round_half_up(max(0, gross_earnings_cents) * CHARGEBACK_RESERVE_BPS / 10000)
      step 3: after_reserve   = gross_earnings_cents - reserve_cents
      step 4: recovery_cents  = min(max(0, after_reserve), Developer.negative_balance_cents)
      step 5: after_recovery  = after_reserve - recovery_cents
      step 6: withholding_cents = 0 if Developer.tax_id_provided == true
                                  else round_half_up(max(0, after_recovery) * BACKUP_WITHHOLDING_BPS / 10000)
      step 7: payable_cents   = after_recovery - withholding_cents
      step 8: if payable_cents < MIN_PAYOUT_CENTS:
                  status = "HELD_BELOW_MINIMUM"
                  payout_amount_cents  = 0
                  carryover_added_cents = max(0, payable_cents)
              else:
                  status = "PAYABLE"
                  payout_amount_cents  = payable_cents
                  carryover_added_cents = 0
    input_set: "Eligible ACCRUED purchases in the half-open batch window for the batch currency, plus the developer's carryover_cents and negative_balance_cents as they stand when calculate runs."
    constants:
      CHARGEBACK_RESERVE_BPS: 500
      BACKUP_WITHHOLDING_BPS: 2400
      MIN_PAYOUT_CENTS: 5000
    precision: "whole cents, round_half_up at steps 2 and 6 only"

  - name: form_1099_rollup
    trigger: "POST /api/tax-forms"
    algorithm: aggregation
    formula: |
      lines = PayoutLine rows where developer_id == TaxForm1099.developer_id
              and status == PAID
              and the owning PayoutBatch.period_start falls in UTC calendar year == tax_year
      reportable_cents = sum over lines of (payout_amount_cents + withholding_cents)
      withheld_cents   = sum over lines of withholding_cents
      threshold_cents  = FORM_1099_THRESHOLD_CENTS
      status = "ISSUABLE" if reportable_cents >= FORM_1099_THRESHOLD_CENTS else "NOT_REQUIRED"
    input_set: "Only PayoutLine rows in status PAID; PAYABLE, HELD_BELOW_MINIMUM, HELD_DEVELOPER and FAILED lines are excluded."
    constants:
      FORM_1099_THRESHOLD_CENTS: 60000
    precision: "whole cents; the threshold comparison is >= (exactly 60000 is ISSUABLE)"

  - name: app_analytics_rollup
    trigger: "GET /api/apps/{app_id}/analytics"
    algorithm: aggregation
    formula: |
      scored = Purchase rows of this app whose payment_status is in
               {CAPTURED, PARTIALLY_REFUNDED, REFUNDED, CHARGED_BACK}
      gross_cents          = sum over scored of gross_cents
      tax_cents            = sum over scored of tax_cents
      revenue_base_cents   = sum over scored of revenue_base_cents
      developer_net_cents  = sum over scored of provisional_developer_net_cents
      refunded_gross_cents = sum over scored of refunded_gross_cents
      unit_count           = sum over scored of (sum over line_items of quantity)
      refund_rate_bps      = 0 if gross_cents == 0
                             else round_half_up(refunded_gross_cents * 10000 / gross_cents)
    input_set: "Purchases of this app that reached capture; AUTHORIZED and VOIDED purchases are excluded, so an app with no captured purchase yields every field 0 rather than a division error."
    constants:
      EMPTY_SET_REFUND_RATE_BPS: 0
    precision: "whole cents; refund_rate_bps is an integer, round_half_up"

invariants:
  - name: PURCHASE_SPLIT_IDENTITY
    conserved_quantity: "per-purchase ledger sum"
    formula: |
      At creation:  platform_fee_cents + provisional_developer_net_cents + tax_cents == gross_cents
      After the closing (full) Refund executes:
        sum of LedgerEntry.amount_cents over all rows with purchase_id == Purchase.id == 0
      and Purchase.refunded_gross_cents == Purchase.gross_cents.
    forward_action: "POST /api/purchases/{purchase_id}/capture"
    compensating_action: "POST /api/refunds/{refund_id}/execute for the full gross amount"

  - name: DEVELOPER_ACCRUAL_IDENTITY
    conserved_quantity: "developer unsettled accrual balance"
    formula: |
      Developer.unpaid_accrual_cents - Developer.negative_balance_cents ==
        sum of LedgerEntry.amount_cents over all rows with developer_id == Developer.id and settled == false
      This equality must hold before the chargeback is resolved LOST and again after it is REVERSED,
      with both sides back at their pre-dispute values.
    forward_action: "POST /api/chargebacks/{chargeback_id}/resolve with outcome LOST"
    compensating_action: "POST /api/chargebacks/{chargeback_id}/reverse"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "The acting role appears in the endpoint's roles list in the API endpoint table"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "When the acting role is Developer, X-User-ID equals the developer_id of the targeted App, PricingPlan (via its App), PolicyCase or Developer resource"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all Developer-role endpoints"
  - priority: 4
    category: auth
    check: "The PolicyOfficer deciding a PolicyCase (decide or appeal-decision) has an X-User-ID different from PolicyCase.opened_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /api/policy-cases/{policy_case_id}/decide, POST /api/policy-cases/{policy_case_id}/appeal-decision"
  - priority: 10
    category: existence
    check: "Every resource named in the path exists, validated left to right"
    error_id: ERR_DEVELOPER_NOT_FOUND
    http_status: 404
    applies_to: "all path-parameterised endpoints; the concrete error_id matches the missing resource type"
  - priority: 15
    category: business_constraint
    check: "Request body carries every required field with the declared type, every enum value is a declared member, price_cents and amount_cents are > 0, line_items is a non-empty array of objects with unit_price_cents > 0 and quantity > 0, external_order_ref and network_case_ref are unique"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 20
    category: business_constraint
    check: "limit is an integer in 1..100 and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"
  - priority: 30
    category: state
    check: "expected_app_version equals App.version"
    error_id: ERR_STALE_APP_VERSION
    http_status: 412
    applies_to: "POST /api/apps/{app_id}/pricing-plans"
  - priority: 31
    category: state
    check: "expected_developer_version equals Developer.version"
    error_id: ERR_STALE_DEVELOPER_VERSION
    http_status: 412
    applies_to: "POST /api/developers/{developer_id}/payout-holds"
  - priority: 40
    category: state
    check: "The target resource is in a from-state declared for the requested transition in the state machine table"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 41
    category: state
    check: "Publishing or reinstating an App requires the owning Developer.status == ACTIVE"
    error_id: ERR_DEVELOPER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /api/apps/{app_id}/publish, POST /api/apps/{app_id}/reinstate"
  - priority: 42
    category: state
    check: "Executing a Refund requires the linked Purchase.payment_status in {CAPTURED, PARTIALLY_REFUNDED}; a VOIDED, REFUNDED or CHARGED_BACK purchase is not refundable"
    error_id: ERR_PURCHASE_NOT_REFUNDABLE
    http_status: 409
    applies_to: "POST /api/purchases/{purchase_id}/refunds, POST /api/refunds/{refund_id}/execute"
  - priority: 50
    category: business_safety
    check: "Recording a Purchase requires App.status == LIVE and the referenced PricingPlan.status == ACTIVE"
    error_id: ERR_APP_NOT_PURCHASABLE
    http_status: 409
    applies_to: "POST /api/purchases"
  - priority: 51
    category: business_safety
    check: "Approving a PayoutBatch requires that no PayoutLine in the batch with status PAYABLE belongs to a Developer whose payout_hold is true"
    error_id: ERR_DEVELOPER_PAYOUT_HELD
    http_status: 409
    applies_to: "POST /api/payout-batches/{payout_batch_id}/approve"
  - priority: 55
    category: business_referential
    check: "A TaxJurisdiction row exists whose country_code equals the referenced country (PricingPlan.country_code on plan creation, Purchase.buyer_country_code on purchase creation)"
    error_id: ERR_JURISDICTION_NOT_CONFIGURED
    http_status: 422
    applies_to: "POST /api/apps/{app_id}/pricing-plans, POST /api/purchases"
  - priority: 56
    category: business_referential
    check: "The referenced PricingPlan.app_id equals the referenced app_id on the purchase"
    error_id: ERR_PLAN_APP_MISMATCH
    http_status: 422
    applies_to: "POST /api/purchases"
  - priority: 60
    category: business_temporal
    check: "A new PricingPlan on the same App with the same kind must start at least PRICING_COOLDOWN_HOURS after the inclusive end of every existing non-RETIRED plan of that kind: new.effective_from >= existing.effective_to + PRICING_COOLDOWN_HOURS. Exactly PRICING_COOLDOWN_HOURS apart is accepted; effective_from must also be <= effective_to."
    error_id: ERR_PRICING_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /api/apps/{app_id}/pricing-plans"
  - priority: 61
    category: business_temporal
    check: "A new PayoutBatch half-open window [period_start, period_end) must not intersect the half-open window of any existing PayoutBatch whose status is not FAILED and whose payout_currency matches. Touching windows (previous period_end == new period_start) are accepted; period_start must be strictly before period_end."
    error_id: ERR_BATCH_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /api/payout-batches"
  - priority: 62
    category: business_temporal
    check: "A refund may only be requested while the current logical clock is at or before Purchase.captured_at plus REFUND_WINDOW_DAYS"
    error_id: ERR_REFUND_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /api/purchases/{purchase_id}/refunds"
  - priority: 63
    category: business_temporal
    check: "A chargeback may only be represented while the current logical clock is strictly before Chargeback.received_at plus CHARGEBACK_REPRESENT_WINDOW_DAYS"
    error_id: ERR_REPRESENTMENT_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /api/chargebacks/{chargeback_id}/represent"
  - priority: 70
    category: business_fiscal
    check: "Refund.amount_cents must not exceed Purchase.gross_cents - Purchase.refunded_gross_cents"
    error_id: ERR_REFUND_EXCEEDS_REMAINING
    http_status: 422
    applies_to: "POST /api/purchases/{purchase_id}/refunds"
  - priority: 71
    category: business_fiscal
    check: "billing_period_months must be >= 1 when kind == SUBSCRIPTION and exactly 0 when kind is ONE_TIME or IAP"
    error_id: ERR_INVALID_PRICING
    http_status: 422
    applies_to: "POST /api/apps/{app_id}/pricing-plans"
  - priority: 72
    category: business_constraint
    check: "Verifying a Developer requires tax_id_provided == true"
    error_id: ERR_TAX_ID_REQUIRED
    http_status: 422
    applies_to: "POST /api/developers/{developer_id}/verify"
  - priority: 73
    category: business_constraint
    check: "At most one TaxForm1099 may exist per (developer_id, tax_year) pair"
    error_id: ERR_TAX_FORM_EXISTS
    http_status: 409
    applies_to: "POST /api/tax-forms"
  - priority: 74
    category: business_constraint
    check: "At most one TaxJurisdiction may exist per country_code"
    error_id: ERR_JURISDICTION_EXISTS
    http_status: 409
    applies_to: "POST /api/tax-jurisdictions"

constants:
  PRICING_COOLDOWN_HOURS: 24
  REFUND_WINDOW_DAYS: 30
  CHARGEBACK_REPRESENT_WINDOW_DAYS: 7
  POLICY_STRIKE_SUSPEND_THRESHOLD: 3
  DEFAULT_SHARE_BPS: 7000
  CHARGEBACK_RESERVE_BPS: 500
  BACKUP_WITHHOLDING_BPS: 2400
  MIN_PAYOUT_CENTS: 5000
  FORM_1099_THRESHOLD_CENTS: 60000
  RISK_WINDOW_DAYS: 30
  REFUND_WEIGHT: 40
  CHARGEBACK_WEIGHT: 40
  STRIKE_WEIGHT: 20
  DEFAULT_CLOCK_UTC: "2026-07-01T00:00:00Z"

endpoints:
  # ---- test-driving clock -------------------------------------------------
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-07-01T00:00:00Z and never falls back to real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: ["to_iso8601"]
    output: "{ current_utc: string }"
    side_effects: ["all window, expiry and captured_at evaluations use the new instant"]

  # ---- configuration ------------------------------------------------------
  - method: POST
    path: "/api/tax-jurisdictions"
    description: "Register a country's VAT rate and marketplace-facilitator posture."
    roles: [PlatformAdmin]
    code: 201
    input: ["country_code", "vat_rate_bps", "marketplace_facilitator"]
    output: TaxJurisdiction
    side_effects: ["none"]
  - method: GET
    path: "/api/tax-jurisdictions"
    description: "List configured tax jurisdictions."
    roles: [PlatformAdmin, FinanceOps, StorefrontService]
    code: 200
    input: ["limit?", "offset?", "country_code?"]
    output: TaxJurisdiction[]
    side_effects: []
  - method: GET
    path: "/api/tax-jurisdictions/{tax_jurisdiction_id}"
    description: "Read one tax jurisdiction."
    roles: [PlatformAdmin, FinanceOps, StorefrontService]
    code: 200
    input: []
    output: TaxJurisdiction
    side_effects: []
  - method: POST
    path: "/api/revenue-share-tiers"
    description: "Register a revenue-share tier breakpoint."
    roles: [PlatformAdmin]
    code: 201
    input: ["label", "min_cumulative_base_cents", "developer_share_bps"]
    output: RevenueShareTier
    side_effects: ["future tier selections consider this row"]
  - method: GET
    path: "/api/revenue-share-tiers"
    description: "List revenue-share tiers."
    roles: [PlatformAdmin, FinanceOps, Developer]
    code: 200
    input: ["limit?", "offset?"]
    output: RevenueShareTier[]
    side_effects: []
  - method: GET
    path: "/api/revenue-share-tiers/{revenue_share_tier_id}"
    description: "Read one revenue-share tier."
    roles: [PlatformAdmin, FinanceOps, Developer]
    code: 200
    input: []
    output: RevenueShareTier
    side_effects: []

  # ---- developer accounts -------------------------------------------------
  - method: POST
    path: "/api/developers"
    description: "Open a developer account in PENDING_VERIFICATION."
    roles: [PlatformAdmin]
    code: 201
    input: ["legal_name", "email", "country_code", "tax_id_provided?"]
    output: Developer
    side_effects: ["Developer.status = PENDING_VERIFICATION"]
  - method: GET
    path: "/api/developers"
    description: "List developer accounts."
    roles: [PlatformAdmin, FinanceOps, PolicyOfficer]
    code: 200
    input: ["limit?", "offset?", "status?", "country_code?"]
    output: Developer[]
    side_effects: []
  - method: GET
    path: "/api/developers/{developer_id}"
    description: "Read one developer account including risk and ledger roll-ups."
    roles: [PlatformAdmin, FinanceOps, PolicyOfficer, Developer]
    code: 200
    input: []
    output: Developer
    side_effects: []
  - method: POST
    path: "/api/developers/{developer_id}/verify"
    description: "Move a developer account from PENDING_VERIFICATION to ACTIVE."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Developer
    side_effects: ["Developer.status = ACTIVE", "increments Developer.version by 1"]
  - method: POST
    path: "/api/developers/{developer_id}/suspend"
    description: "Suspend a developer account, holding payouts and switching risk scoring to the accelerated window."
    roles: [PolicyOfficer]
    code: 200
    input: ["reason"]
    output: Developer
    side_effects:
      - "Developer.status = SUSPENDED, risk_watch = true, payout_hold = true"
      - "PAYABLE PayoutLines in CALCULATED/PENDING_APPROVAL batches flip to HELD_DEVELOPER"
      - "affected PayoutBatch totals are recomputed"
  - method: POST
    path: "/api/developers/{developer_id}/reinstate"
    description: "Return a suspended developer account to ACTIVE."
    roles: [PolicyOfficer]
    code: 200
    input: ["reason"]
    output: Developer
    side_effects: ["Developer.status = ACTIVE, risk_watch = false", "risk_score recomputed with the STANDARD variant"]
  - method: POST
    path: "/api/developers/{developer_id}/terminate"
    description: "Terminate a developer account and delist every remaining listing."
    roles: [PlatformAdmin]
    code: 200
    input: ["reason"]
    output: Developer
    side_effects: ["Developer.status = TERMINATED", "every non-DELISTED App of the developer moves to DELISTED"]
  - method: POST
    path: "/api/developers/{developer_id}/payout-holds"
    description: "Set or clear the payout hold flag on a developer account under optimistic concurrency."
    roles: [FinanceOps]
    code: 200
    input: ["hold", "expected_developer_version", "reason?"]
    output: Developer
    side_effects: ["Developer.payout_hold = hold", "increments Developer.version by 1"]
  - method: POST
    path: "/api/developers/{developer_id}/tax-profile"
    description: "Record the outcome of a tax-identity check; clearing tax_id_provided puts the account into backup withholding on all future payout lines."
    roles: [PlatformAdmin]
    code: 200
    input: ["tax_id_provided", "reason?"]
    output: Developer
    side_effects: ["Developer.tax_id_provided = tax_id_provided", "increments Developer.version by 1"]
  - method: GET
    path: "/api/developers/{developer_id}/summary"
    description: "Computed read of the developer's ledger position and risk posture."
    roles: [PlatformAdmin, FinanceOps, Developer]
    code: 200
    input: []
    output: "{ developer_id: string, unpaid_accrual_cents: integer, negative_balance_cents: integer, carryover_cents: integer, lifetime_revenue_base_cents: integer, risk_score: integer, risk_variant: string, payout_hold: boolean }"
    side_effects: []

  # ---- app listings -------------------------------------------------------
  - method: POST
    path: "/api/apps"
    description: "Create a DRAFT app listing owned by the acting developer."
    roles: [Developer]
    code: 201
    input: ["developer_id", "name", "category", "listed_countries"]
    output: App
    side_effects: ["App.status = DRAFT, review_round = 0"]
  - method: GET
    path: "/api/apps"
    description: "List app listings."
    roles: [Developer, ReviewAgent, PolicyOfficer, PlatformAdmin, FinanceOps, StorefrontService]
    code: 200
    input: ["limit?", "offset?", "developer_id?", "status?", "category?"]
    output: App[]
    side_effects: []
  - method: GET
    path: "/api/apps/{app_id}"
    description: "Read one app listing."
    roles: [Developer, ReviewAgent, PolicyOfficer, PlatformAdmin, FinanceOps, StorefrontService]
    code: 200
    input: []
    output: App
    side_effects: []
  - method: PATCH
    path: "/api/apps/{app_id}"
    description: "Edit listing metadata; a CHANGES_REQUESTED listing returns to DRAFT on edit."
    roles: [Developer]
    code: 200
    input: ["name?", "category?", "listed_countries?"]
    output: App
    side_effects: ["App.status moves CHANGES_REQUESTED -> DRAFT when it was CHANGES_REQUESTED", "increments App.version by 1"]
  - method: POST
    path: "/api/apps/{app_id}/submit-for-review"
    description: "Submit a DRAFT or CHANGES_REQUESTED listing for review, opening a new review round."
    roles: [Developer]
    code: 201
    input: ["submitted_notes"]
    output: ReviewSubmission
    side_effects: ["App.status = IN_REVIEW", "App.review_round increments by 1", "creates a ReviewSubmission in SUBMITTED"]
  - method: POST
    path: "/api/apps/{app_id}/publish"
    description: "Publish an APPROVED listing; requires the owning developer to be ACTIVE."
    roles: [Developer]
    code: 200
    input: []
    output: App
    side_effects: ["App.status = LIVE"]
  - method: POST
    path: "/api/apps/{app_id}/suspend"
    description: "Suspend a LIVE listing, blocking new purchases."
    roles: [PolicyOfficer]
    code: 200
    input: ["reason"]
    output: App
    side_effects: ["App.status = SUSPENDED"]
  - method: POST
    path: "/api/apps/{app_id}/reinstate"
    description: "Return a SUSPENDED listing to LIVE."
    roles: [PolicyOfficer]
    code: 200
    input: ["reason"]
    output: App
    side_effects: ["App.status = LIVE"]
  - method: POST
    path: "/api/apps/{app_id}/delist"
    description: "Permanently delist a listing, retiring its plans and adding a policy strike."
    roles: [PolicyOfficer]
    code: 200
    input: ["reason"]
    output: App
    side_effects:
      - "App.status = DELISTED"
      - "every ACTIVE PricingPlan of the app moves to RETIRED"
      - "App.policy_strike_count and Developer.policy_strike_count increment by 1"
      - "Developer may cascade ACTIVE -> SUSPENDED at POLICY_STRIKE_SUSPEND_THRESHOLD"
  - method: GET
    path: "/api/apps/{app_id}/analytics"
    description: "Computed sales roll-up for a listing; every field is 0 when no purchase reached capture."
    roles: [Developer, PlatformAdmin, FinanceOps]
    code: 200
    input: []
    output: "{ app_id: string, gross_cents: integer, tax_cents: integer, revenue_base_cents: integer, developer_net_cents: integer, refunded_gross_cents: integer, unit_count: integer, refund_rate_bps: integer }"
    side_effects: []
  - method: GET
    path: "/api/apps/{app_id}/review-submissions"
    description: "List the review rounds opened against a listing."
    roles: [Developer, ReviewAgent, PolicyOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: ReviewSubmission[]
    side_effects: []
  - method: GET
    path: "/api/apps/{app_id}/pricing-plans"
    description: "List the pricing plans of a listing."
    roles: [Developer, ReviewAgent, PlatformAdmin, FinanceOps, StorefrontService]
    code: 200
    input: ["limit?", "offset?", "kind?", "status?"]
    output: PricingPlan[]
    side_effects: []
  - method: POST
    path: "/api/apps/{app_id}/pricing-plans"
    description: "Attach a pricing plan to a listing under optimistic concurrency on the app version."
    roles: [Developer]
    code: 201
    input: ["kind", "price_cents", "currency", "country_code", "effective_from", "effective_to", "expected_app_version", "billing_period_months?"]
    output: PricingPlan
    side_effects: ["creates a PricingPlan in ACTIVE", "increments App.version by 1"]

  # ---- review -------------------------------------------------------------
  - method: GET
    path: "/api/review-submissions"
    description: "List review submissions."
    roles: [ReviewAgent, PolicyOfficer, PlatformAdmin, Developer]
    code: 200
    input: ["limit?", "offset?", "app_id?", "status?"]
    output: ReviewSubmission[]
    side_effects: []
  - method: GET
    path: "/api/review-submissions/{review_submission_id}"
    description: "Read one review submission."
    roles: [ReviewAgent, PolicyOfficer, PlatformAdmin, Developer]
    code: 200
    input: []
    output: ReviewSubmission
    side_effects: []
  - method: POST
    path: "/api/review-submissions/{review_submission_id}/triage"
    description: "Claim a SUBMITTED review round for triage."
    roles: [ReviewAgent]
    code: 200
    input: []
    output: ReviewSubmission
    side_effects: ["ReviewSubmission.status = IN_TRIAGE", "triaged_by_user_id = X-User-ID"]
  - method: POST
    path: "/api/review-submissions/{review_submission_id}/decision"
    description: "Record the review outcome, driving the listing to APPROVED or CHANGES_REQUESTED."
    roles: [ReviewAgent]
    code: 200
    input: ["outcome", "decision_reason"]
    output: ReviewSubmission
    side_effects: ["ReviewSubmission.status = PASSED or REJECTED", "App.status = APPROVED or CHANGES_REQUESTED"]

  # ---- pricing plans ------------------------------------------------------
  - method: GET
    path: "/api/pricing-plans"
    description: "List pricing plans across listings."
    roles: [Developer, PlatformAdmin, FinanceOps, StorefrontService]
    code: 200
    input: ["limit?", "offset?", "app_id?", "kind?", "status?"]
    output: PricingPlan[]
    side_effects: []
  - method: GET
    path: "/api/pricing-plans/{pricing_plan_id}"
    description: "Read one pricing plan."
    roles: [Developer, PlatformAdmin, FinanceOps, StorefrontService]
    code: 200
    input: []
    output: PricingPlan
    side_effects: []
  - method: POST
    path: "/api/pricing-plans/{pricing_plan_id}/retire"
    description: "Retire an ACTIVE pricing plan."
    roles: [Developer]
    code: 200
    input: []
    output: PricingPlan
    side_effects: ["PricingPlan.status = RETIRED"]

  # ---- purchases ----------------------------------------------------------
  - method: POST
    path: "/api/purchases"
    description: "Record a storefront purchase in AUTHORIZED/UNSETTLED and compute the tax split."
    roles: [StorefrontService]
    code: 201
    input: ["app_id", "pricing_plan_id", "buyer_country_code", "external_order_ref", "line_items"]
    output: Purchase
    side_effects: ["runs purchase_tax_split", "Purchase.payment_status = AUTHORIZED, settlement_status = UNSETTLED"]
  - method: GET
    path: "/api/purchases"
    description: "List purchases."
    roles: [StorefrontService, PlatformAdmin, FinanceOps, Developer]
    code: 200
    input: ["limit?", "offset?", "app_id?", "pricing_plan_id?", "developer_id?", "tax_jurisdiction_id?", "payment_status?", "settlement_status?"]
    output: Purchase[]
    side_effects: []
  - method: GET
    path: "/api/purchases/{purchase_id}"
    description: "Read one purchase with both status dimensions and the computed split."
    roles: [StorefrontService, PlatformAdmin, FinanceOps, Developer]
    code: 200
    input: []
    output: Purchase
    side_effects: []
  - method: POST
    path: "/api/purchases/{purchase_id}/capture"
    description: "Capture an authorized purchase, accruing the developer's provisional share."
    roles: [StorefrontService]
    code: 200
    input: []
    output: Purchase
    side_effects:
      - "runs revenue_share_split PROVISIONAL"
      - "payment_status = CAPTURED, settlement_status = ACCRUED, captured_at stamped"
      - "creates ACCRUAL (and TAX_PASSTHROUGH when applicable) LedgerEntry rows"
      - "recomputes Developer.lifetime_revenue_base_cents, unpaid_accrual_cents and risk_score"
  - method: POST
    path: "/api/purchases/{purchase_id}/void"
    description: "Void an authorized purchase before capture."
    roles: [StorefrontService]
    code: 200
    input: []
    output: Purchase
    side_effects: ["payment_status = VOIDED", "no ledger movement"]

  # ---- refunds ------------------------------------------------------------
  - method: POST
    path: "/api/purchases/{purchase_id}/refunds"
    description: "Request a refund against a captured purchase."
    roles: [StorefrontService]
    code: 201
    input: ["amount_cents", "reason"]
    output: Refund
    side_effects: ["creates a Refund in REQUESTED"]
  - method: GET
    path: "/api/refunds"
    description: "List refunds."
    roles: [StorefrontService, FinanceOps, PlatformAdmin, Developer]
    code: 200
    input: ["limit?", "offset?", "purchase_id?", "status?"]
    output: Refund[]
    side_effects: []
  - method: GET
    path: "/api/refunds/{refund_id}"
    description: "Read one refund."
    roles: [StorefrontService, FinanceOps, PlatformAdmin, Developer]
    code: 200
    input: []
    output: Refund
    side_effects: []
  - method: POST
    path: "/api/refunds/{refund_id}/decide"
    description: "Approve or deny a requested refund."
    roles: [FinanceOps]
    code: 200
    input: ["outcome", "note?"]
    output: Refund
    side_effects: ["Refund.status = APPROVED or DENIED", "decided_by_user_id = X-User-ID"]
  - method: POST
    path: "/api/refunds/{refund_id}/execute"
    description: "Execute an approved refund, reversing the developer's accrual."
    roles: [FinanceOps]
    code: 200
    input: []
    output: Refund
    side_effects:
      - "runs refund_reversal_split"
      - "Purchase.payment_status moves to PARTIALLY_REFUNDED or REFUNDED"
      - "creates a REFUND_REVERSAL LedgerEntry"
      - "recomputes Developer.unpaid_accrual_cents and risk_score"

  # ---- chargebacks --------------------------------------------------------
  - method: POST
    path: "/api/purchases/{purchase_id}/chargebacks"
    description: "Record an inbound network dispute against a purchase."
    roles: [StorefrontService]
    code: 201
    input: ["network_case_ref", "amount_cents"]
    output: Chargeback
    side_effects: ["creates a Chargeback in RECEIVED with received_at stamped from the logical clock"]
  - method: GET
    path: "/api/chargebacks"
    description: "List chargebacks."
    roles: [StorefrontService, FinanceOps, PlatformAdmin, Developer]
    code: 200
    input: ["limit?", "offset?", "purchase_id?", "status?"]
    output: Chargeback[]
    side_effects: []
  - method: GET
    path: "/api/chargebacks/{chargeback_id}"
    description: "Read one chargeback."
    roles: [StorefrontService, FinanceOps, PlatformAdmin, Developer]
    code: 200
    input: []
    output: Chargeback
    side_effects: []
  - method: POST
    path: "/api/chargebacks/{chargeback_id}/represent"
    description: "Contest a received dispute within the representment window."
    roles: [FinanceOps]
    code: 200
    input: ["evidence_ref"]
    output: Chargeback
    side_effects: ["Chargeback.status = REPRESENTED"]
  - method: POST
    path: "/api/chargebacks/{chargeback_id}/resolve"
    description: "Record the network's decision; LOST claws back the developer's accrual."
    roles: [FinanceOps]
    code: 200
    input: ["outcome"]
    output: Chargeback
    side_effects:
      - "Chargeback.status = WON or LOST"
      - "on LOST: Purchase moves to CHARGED_BACK/CLAWED_BACK, a CLAWBACK LedgerEntry is written, and the developer's negative balance and payout hold are recomputed"
  - method: POST
    path: "/api/chargebacks/{chargeback_id}/reverse"
    description: "Compensating action: the network reverses a lost dispute and the clawback is credited back."
    roles: [FinanceOps]
    code: 200
    input: ["reason"]
    output: Chargeback
    side_effects:
      - "Chargeback.status = REVERSED"
      - "creates a CLAWBACK_REVERSAL LedgerEntry of +clawback_cents"
      - "Purchase returns to CAPTURED/PARTIALLY_REFUNDED and ACCRUED"
      - "Developer.unpaid_accrual_cents, negative_balance_cents and payout_hold are recomputed"

  # ---- policy cases -------------------------------------------------------
  - method: POST
    path: "/api/policy-cases"
    description: "Open a policy or fraud case against a listing."
    roles: [PolicyOfficer]
    code: 201
    input: ["app_id", "category", "severity"]
    output: PolicyCase
    side_effects: ["creates a PolicyCase in OPEN with opened_by_user_id = X-User-ID"]
  - method: GET
    path: "/api/policy-cases"
    description: "List policy cases."
    roles: [PolicyOfficer, PlatformAdmin, Developer]
    code: 200
    input: ["limit?", "offset?", "app_id?", "developer_id?", "status?", "category?"]
    output: PolicyCase[]
    side_effects: []
  - method: GET
    path: "/api/policy-cases/{policy_case_id}"
    description: "Read one policy case."
    roles: [PolicyOfficer, PlatformAdmin, Developer]
    code: 200
    input: []
    output: PolicyCase
    side_effects: []
  - method: POST
    path: "/api/policy-cases/{policy_case_id}/investigate"
    description: "Move an open case into investigation and put the developer on risk watch."
    roles: [PolicyOfficer]
    code: 200
    input: []
    output: PolicyCase
    side_effects: ["PolicyCase.status = INVESTIGATING", "Developer.risk_watch = true and risk_score recomputed with the ACCELERATED variant"]
  - method: POST
    path: "/api/policy-cases/{policy_case_id}/decide"
    description: "Decide an investigated case; UPHELD delists the listing and cascades to the developer."
    roles: [PolicyOfficer]
    code: 200
    input: ["outcome", "rationale"]
    output: PolicyCase
    side_effects:
      - "PolicyCase.status = UPHELD or DISMISSED, decided_by_user_id = X-User-ID"
      - "on UPHELD: the App is delisted, plans retire, strike counts increment, and the developer may cascade to SUSPENDED with payout lines held and batch totals recomputed"
  - method: POST
    path: "/api/policy-cases/{policy_case_id}/appeal"
    description: "Developer appeals an upheld case."
    roles: [Developer]
    code: 200
    input: ["appeal_statement"]
    output: PolicyCase
    side_effects: ["PolicyCase.status = APPEALED"]
  - method: POST
    path: "/api/policy-cases/{policy_case_id}/appeal-decision"
    description: "Decide an appeal; GRANTED reverses the strike counts, DENIED returns the case to UPHELD."
    roles: [PolicyOfficer]
    code: 200
    input: ["outcome", "rationale"]
    output: PolicyCase
    side_effects: ["PolicyCase.status = REINSTATED or UPHELD", "on REINSTATED both strike counters decrement, floored at 0"]

  # ---- payouts ------------------------------------------------------------
  - method: POST
    path: "/api/payout-batches"
    description: "Open a payout batch for a currency and a half-open earnings window."
    roles: [FinanceOps]
    code: 201
    input: ["payout_currency", "period_start", "period_end"]
    output: PayoutBatch
    side_effects: ["creates a PayoutBatch in OPEN"]
  - method: GET
    path: "/api/payout-batches"
    description: "List payout batches."
    roles: [FinanceOps, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "status?", "payout_currency?"]
    output: PayoutBatch[]
    side_effects: []
  - method: GET
    path: "/api/payout-batches/{payout_batch_id}"
    description: "Read one payout batch with its totals."
    roles: [FinanceOps, PlatformAdmin]
    code: 200
    input: []
    output: PayoutBatch
    side_effects: []
  - method: POST
    path: "/api/payout-batches/{payout_batch_id}/calculate"
    description: "Run the FINAL revenue share and the payout waterfall, materialising one line per eligible developer."
    roles: [FinanceOps]
    code: 200
    input: []
    output: PayoutBatch
    side_effects: ["creates PayoutLine rows", "PayoutBatch.status = CALCULATED with line_count and totals set"]
  - method: POST
    path: "/api/payout-batches/{payout_batch_id}/submit"
    description: "Submit a calculated batch for approval."
    roles: [FinanceOps]
    code: 200
    input: []
    output: PayoutBatch
    side_effects: ["PayoutBatch.status = PENDING_APPROVAL", "submitted_by_user_id = X-User-ID"]
  - method: POST
    path: "/api/payout-batches/{payout_batch_id}/approve"
    description: "Approve a submitted batch; rejected when any payable line belongs to a held developer."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: PayoutBatch
    side_effects: ["PayoutBatch.status = APPROVED", "approved_by_user_id = X-User-ID"]
  - method: POST
    path: "/api/payout-batches/{payout_batch_id}/pay"
    description: "Disburse an approved batch; SUCCEEDED settles the ledger, FAILED marks every line FAILED."
    roles: [FinanceOps]
    code: 200
    input: ["outcome", "failure_reason?"]
    output: PayoutBatch
    side_effects:
      - "on SUCCEEDED: lines move to PAID, PAYOUT/RESERVE/RECOVERY/WITHHOLDING/CARRYOVER LedgerEntry rows are written, swept entries are marked settled, purchases move ACCRUED -> PAID, and the developer's negative balance and carryover are updated"
      - "on FAILED: PayoutBatch.status = FAILED and every PAYABLE line moves to FAILED"
  - method: POST
    path: "/api/payout-batches/{payout_batch_id}/retry"
    description: "Return a failed batch to PENDING_APPROVAL for another approval and disbursement attempt."
    roles: [FinanceOps]
    code: 200
    input: []
    output: PayoutBatch
    side_effects: ["PayoutBatch.status = PENDING_APPROVAL", "FAILED lines return to PAYABLE"]
  - method: GET
    path: "/api/payout-batches/{payout_batch_id}/lines"
    description: "List the payout lines materialised for a batch."
    roles: [FinanceOps, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: PayoutLine[]
    side_effects: []
  - method: GET
    path: "/api/payout-lines"
    description: "List payout lines across batches."
    roles: [FinanceOps, PlatformAdmin, Developer]
    code: 200
    input: ["limit?", "offset?", "payout_batch_id?", "developer_id?", "status?"]
    output: PayoutLine[]
    side_effects: []
  - method: GET
    path: "/api/payout-lines/{payout_line_id}"
    description: "Read one payout line with every waterfall step materialised."
    roles: [FinanceOps, PlatformAdmin, Developer]
    code: 200
    input: []
    output: PayoutLine
    side_effects: []

  # ---- ledger and tax forms ----------------------------------------------
  - method: GET
    path: "/api/ledger-entries"
    description: "List ledger entries."
    roles: [FinanceOps, PlatformAdmin, Developer]
    code: 200
    input: ["limit?", "offset?", "developer_id?", "purchase_id?", "payout_line_id?", "entry_type?", "settled?"]
    output: LedgerEntry[]
    side_effects: []
  - method: GET
    path: "/api/ledger-entries/{ledger_entry_id}"
    description: "Read one ledger entry."
    roles: [FinanceOps, PlatformAdmin, Developer]
    code: 200
    input: []
    output: LedgerEntry
    side_effects: []
  - method: GET
    path: "/api/developers/{developer_id}/ledger-entries"
    description: "List a developer's ledger entries."
    roles: [FinanceOps, PlatformAdmin, Developer]
    code: 200
    input: ["limit?", "offset?", "entry_type?", "settled?"]
    output: LedgerEntry[]
    side_effects: []
  - method: POST
    path: "/api/tax-forms"
    description: "Generate the annual 1099 roll-up for a developer."
    roles: [PlatformAdmin]
    code: 201
    input: ["developer_id", "tax_year"]
    output: TaxForm1099
    side_effects: ["runs form_1099_rollup and sets status to ISSUABLE or NOT_REQUIRED"]
  - method: GET
    path: "/api/tax-forms"
    description: "List generated 1099 forms."
    roles: [PlatformAdmin, FinanceOps, Developer]
    code: 200
    input: ["limit?", "offset?", "developer_id?", "tax_year?", "status?"]
    output: TaxForm1099[]
    side_effects: []
  - method: GET
    path: "/api/tax-forms/{tax_form_id}"
    description: "Read one 1099 form."
    roles: [PlatformAdmin, FinanceOps, Developer]
    code: 200
    input: []
    output: TaxForm1099
    side_effects: []

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not a declared role"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed in the endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "A Developer-role caller acts on a resource whose owning developer_id differs from X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The PolicyOfficer deciding a case or its appeal is the same X-User-ID that opened the case"
  - id: ERR_DEVELOPER_NOT_FOUND
    http: 404
    condition: "No Developer exists with the referenced id"
  - id: ERR_APP_NOT_FOUND
    http: 404
    condition: "No App exists with the referenced id"
  - id: ERR_REVIEW_SUBMISSION_NOT_FOUND
    http: 404
    condition: "No ReviewSubmission exists with the referenced id"
  - id: ERR_PRICING_PLAN_NOT_FOUND
    http: 404
    condition: "No PricingPlan exists with the referenced id"
  - id: ERR_TAX_JURISDICTION_NOT_FOUND
    http: 404
    condition: "No TaxJurisdiction exists with the referenced id"
  - id: ERR_REVENUE_SHARE_TIER_NOT_FOUND
    http: 404
    condition: "No RevenueShareTier exists with the referenced id"
  - id: ERR_PURCHASE_NOT_FOUND
    http: 404
    condition: "No Purchase exists with the referenced id"
  - id: ERR_REFUND_NOT_FOUND
    http: 404
    condition: "No Refund exists with the referenced id"
  - id: ERR_CHARGEBACK_NOT_FOUND
    http: 404
    condition: "No Chargeback exists with the referenced id"
  - id: ERR_POLICY_CASE_NOT_FOUND
    http: 404
    condition: "No PolicyCase exists with the referenced id"
  - id: ERR_PAYOUT_BATCH_NOT_FOUND
    http: 404
    condition: "No PayoutBatch exists with the referenced id"
  - id: ERR_PAYOUT_LINE_NOT_FOUND
    http: 404
    condition: "No PayoutLine exists with the referenced id"
  - id: ERR_LEDGER_ENTRY_NOT_FOUND
    http: 404
    condition: "No LedgerEntry exists with the referenced id"
  - id: ERR_TAX_FORM_NOT_FOUND
    http: 404
    condition: "No TaxForm1099 exists with the referenced id"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, wrong type, undeclared enum member, non-positive amount, empty line_items, or duplicate external_order_ref / network_case_ref"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside 1..100 or offset below 0"
  - id: ERR_STALE_APP_VERSION
    http: 412
    condition: "expected_app_version does not equal the current App.version on pricing-plan creation"
  - id: ERR_STALE_DEVELOPER_VERSION
    http: 412
    condition: "expected_developer_version does not equal the current Developer.version on a payout-hold write"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The requested transition is not declared from the resource's current state"
  - id: ERR_DEVELOPER_NOT_ACTIVE
    http: 409
    condition: "Publishing or reinstating a listing whose owning Developer.status is not ACTIVE"
  - id: ERR_PURCHASE_NOT_REFUNDABLE
    http: 409
    condition: "Refund requested or executed against a purchase whose payment_status is not CAPTURED or PARTIALLY_REFUNDED"
  - id: ERR_APP_NOT_PURCHASABLE
    http: 409
    condition: "Purchase recorded against an App that is not LIVE or a PricingPlan that is not ACTIVE"
  - id: ERR_DEVELOPER_PAYOUT_HELD
    http: 409
    condition: "Batch approval attempted while a PAYABLE line belongs to a developer with payout_hold true"
  - id: ERR_PRICING_WINDOW_CONFLICT
    http: 409
    condition: "New pricing plan window overlaps, or starts less than PRICING_COOLDOWN_HOURS after, an existing non-RETIRED plan of the same kind on the same app; also raised when effective_from is after effective_to"
  - id: ERR_BATCH_PERIOD_OVERLAP
    http: 409
    condition: "New payout batch half-open window intersects an existing non-FAILED batch window in the same currency; also raised when period_start is not strictly before period_end"
  - id: ERR_TAX_FORM_EXISTS
    http: 409
    condition: "A TaxForm1099 already exists for this developer and tax year"
  - id: ERR_JURISDICTION_EXISTS
    http: 409
    condition: "A TaxJurisdiction already exists for this country_code"
  - id: ERR_JURISDICTION_NOT_CONFIGURED
    http: 422
    condition: "No TaxJurisdiction row matches the referenced country code"
  - id: ERR_PLAN_APP_MISMATCH
    http: 422
    condition: "The referenced pricing plan does not belong to the referenced app"
  - id: ERR_REFUND_WINDOW_EXPIRED
    http: 422
    condition: "Refund requested more than REFUND_WINDOW_DAYS after Purchase.captured_at"
  - id: ERR_REPRESENTMENT_WINDOW_EXPIRED
    http: 422
    condition: "Representment attempted at or after Chargeback.received_at plus CHARGEBACK_REPRESENT_WINDOW_DAYS"
  - id: ERR_REFUND_EXCEEDS_REMAINING
    http: 422
    condition: "Refund amount_cents exceeds Purchase.gross_cents minus Purchase.refunded_gross_cents"
  - id: ERR_INVALID_PRICING
    http: 422
    condition: "billing_period_months is 0 on a SUBSCRIPTION plan or non-zero on a ONE_TIME/IAP plan"
  - id: ERR_TAX_ID_REQUIRED
    http: 422
    condition: "Developer verification attempted while tax_id_provided is false"

roles:
  - name: Developer
    description: "Owner of a developer account; creates listings and pricing plans, publishes approved apps, appeals policy cases."
    identity: "entity_backed:Developer"
    exclusive_operations:
      - "POST /api/apps"
      - "PATCH /api/apps/{app_id}"
      - "POST /api/apps/{app_id}/submit-for-review"
      - "POST /api/apps/{app_id}/publish"
      - "POST /api/apps/{app_id}/pricing-plans"
      - "POST /api/pricing-plans/{pricing_plan_id}/retire"
      - "POST /api/policy-cases/{policy_case_id}/appeal"
    shared_operations:
      - "GET /api/apps, GET /api/apps/{app_id}, GET /api/apps/{app_id}/analytics"
      - "GET /api/purchases, GET /api/refunds, GET /api/chargebacks"
      - "GET /api/payout-lines, GET /api/ledger-entries, GET /api/tax-forms"
  - name: ReviewAgent
    description: "Store reviewer who triages and decides review submissions."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/review-submissions/{review_submission_id}/triage"
      - "POST /api/review-submissions/{review_submission_id}/decision"
    shared_operations:
      - "GET /api/apps, GET /api/review-submissions, GET /api/apps/{app_id}/pricing-plans"
  - name: PolicyOfficer
    description: "Trust-and-safety operator who opens, investigates and decides policy cases and moves listings and accounts in and out of suspension."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/policy-cases"
      - "POST /api/policy-cases/{policy_case_id}/investigate"
      - "POST /api/policy-cases/{policy_case_id}/decide"
      - "POST /api/policy-cases/{policy_case_id}/appeal-decision"
      - "POST /api/apps/{app_id}/suspend"
      - "POST /api/apps/{app_id}/reinstate"
      - "POST /api/apps/{app_id}/delist"
      - "POST /api/developers/{developer_id}/suspend"
      - "POST /api/developers/{developer_id}/reinstate"
    shared_operations:
      - "GET /api/apps, GET /api/developers, GET /api/policy-cases, GET /api/review-submissions"
  - name: FinanceOps
    description: "Payments operator who decides refunds, works chargebacks, sets payout holds and drives payout batches up to submission and disbursement. Cannot approve a batch."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/refunds/{refund_id}/decide"
      - "POST /api/refunds/{refund_id}/execute"
      - "POST /api/chargebacks/{chargeback_id}/represent"
      - "POST /api/chargebacks/{chargeback_id}/resolve"
      - "POST /api/chargebacks/{chargeback_id}/reverse"
      - "POST /api/developers/{developer_id}/payout-holds"
      - "POST /api/payout-batches"
      - "POST /api/payout-batches/{payout_batch_id}/calculate"
      - "POST /api/payout-batches/{payout_batch_id}/submit"
      - "POST /api/payout-batches/{payout_batch_id}/pay"
      - "POST /api/payout-batches/{payout_batch_id}/retry"
    shared_operations:
      - "GET /api/developers, GET /api/purchases, GET /api/payout-batches, GET /api/payout-lines, GET /api/ledger-entries, GET /api/tax-forms"
  - name: PlatformAdmin
    description: "Marketplace administrator who configures jurisdictions and tiers, manages developer account lifecycle, approves payout batches and issues 1099 forms."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/_clock/set_current_utc"
      - "POST /api/tax-jurisdictions"
      - "POST /api/revenue-share-tiers"
      - "POST /api/developers"
      - "POST /api/developers/{developer_id}/verify"
      - "POST /api/developers/{developer_id}/terminate"
      - "POST /api/developers/{developer_id}/tax-profile"
      - "POST /api/payout-batches/{payout_batch_id}/approve"
      - "POST /api/tax-forms"
    shared_operations:
      - "GET /api/developers, GET /api/apps, GET /api/purchases, GET /api/payout-batches, GET /api/payout-lines, GET /api/ledger-entries"
  - name: StorefrontService
    description: "Storefront backend that records purchases, captures or voids them, and files refund requests and inbound network disputes."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/purchases"
      - "POST /api/purchases/{purchase_id}/capture"
      - "POST /api/purchases/{purchase_id}/void"
      - "POST /api/purchases/{purchase_id}/refunds"
      - "POST /api/purchases/{purchase_id}/chargebacks"
    shared_operations:
      - "GET /api/apps, GET /api/pricing-plans, GET /api/purchases, GET /api/refunds, GET /api/chargebacks, GET /api/tax-jurisdictions"
