              payload: { outing_id: "${o_id}", package_tier_id: "${t_id}", buyer_name: "Sponsor Two", player_count: 1 }
              as: SponsorshipManager
              captures: { r2_id: $.data.id }
            - call: "POST /outing-ops/registrations/${r2_id}/payment"
              payload: { amount_cents: 300000 }
              as: CharityTreasurer
            - call: "POST /outing-ops/sponsor-allocations"
              payload: { registration_id: "${r1_id}", sponsorship_asset_id: "${as_id}", source: "UPSELL" }
              as: SponsorshipManager
              captures: { al1_id: $.data.id }
            - call: "POST /outing-ops/sponsor-allocations"
              payload: { registration_id: "${r2_id}", sponsorship_asset_id: "${as_id}", source: "UPSELL" }
              as: SponsorshipManager
              captures: { al2_id: $.data.id }
            - call: "POST /outing-ops/sponsor-allocations/${al1_id}/fulfillment"
              payload: { action: "COMMIT" }
              as: SponsorshipManager
            - call: "POST /outing-ops/sponsor-allocations/${al2_id}/fulfillment"
              payload: { action: "COMMIT" }
              as: SponsorshipManager
          trigger:
            - call: "POST /outing-ops/sponsor-allocations/${al1_id}/fulfillment"
              payload: { action: "APPROVE_ARTWORK" }
              as: SponsorshipManager
            - call: "POST /outing-ops/sponsor-allocations/${al1_id}/fulfillment"
              payload: { action: "INSTALL" }
              as: SponsorshipManager
            - call: "POST /outing-ops/sponsor-allocations/${al1_id}/fulfillment"
              payload: { action: "VERIFY" }
              as: SponsorshipManager
            - call: "POST /outing-ops/sponsor-allocations/${al2_id}/fulfillment"
              payload: { action: "WAIVE", waived_reason: "Sign never printed" }
              as: SponsorshipManager
          assert:
            - "after both COMMIT calls GET /outing-ops/sponsorship-assets/${as_id} reads status == 'COMMITTED', reserved_count == 0, committed_count == 2, fulfilled_count == 0 and remaining_capacity == 0"
            - "after the VERIFY the asset still reads status == 'COMMITTED' because ${al2_id} is only COMMITTED - fulfilled_count == 1 and committed_count == 1"
            - "after the WAIVE the asset reads status == 'FULFILLED' with reserved_count == 0, committed_count == 0, fulfilled_count == 2 and remaining_capacity == 0"
            - "the VERIFY call is sent with an X-User-Id different from the APPROVE_ARTWORK call, so verified_by_user_id != artwork_approved_by_user_id and no ERR_SEGREGATION_OF_DUTIES is raised"
            - "GET /outing-ops/sponsor-allocations/${al2_id} reads fulfillment_credit_cents == 30000 (round_half_up(0.60 * 50000)) while ${al1_id} keeps 0"
            - "GET /outing-ops/outings/${o_id} reads gross_revenue_cents == 700000 - 600000 of tier money plus both 50000 upsells, since WAIVED and VERIFIED allocations are both revenue-bearing"

      - name: paying_a_fundraising_item_pushes_its_cash_into_the_outing_ledger
        claim_type: Side Effect Execution
        grounds:
          - state_machines[FundraisingItem][SOLD -> PAID].side_effects
          - calculations.net_proceeds_rollup
        distinguishing_aspect: "Ledger sync from a non-registration channel: the DONATION cash lands in Outing.gross_revenue_cents in the same request and re-drives the admin fee, whose BASE is gross revenue even though its RATE is keyed off the before-fee net."
        test_recipe:
          setup:
            - "An OPEN outing on a 9500-per-player contract with one CONFIRMED four-player registration paying 120000, so course_charge_cents == 38000 and net_proceeds_cents == 76000 before the donation."
            - "One DONATION appeal with ask_cents 0, pledged at 50000."
