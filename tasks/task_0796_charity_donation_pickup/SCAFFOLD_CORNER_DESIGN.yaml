            - call: "POST /pickup-requests/${req_id}/items"
              payload: { category: "FURNITURE", volume_cf: 20, weight_lbs: 5, declared_value_cents: 100, declared_condition: "GOOD" }
              as: Donor
              as_user_id: "${donor_id}"
            - call: "POST /pickup-requests/${req_id}/schedule"
              payload: { route_id: "${route_id}", slot_start: "2026-03-15T10:00:00Z", slot_end: "2026-03-15T10:30:00Z", expected_route_version: "${route_v}" }
              as: Dispatcher
            - call: "POST /pickup-requests/${req_id}/complete"
              payload: { measured_volume_cf: 20 }
              as: Driver
            - call: "GET /pickup-requests/${req_id}/haul-invoices"
              payload: {}
              as: Donor
              as_user_id: "${donor_id}"
              captures: { invoice_id: "$.data[0].id" }
            - call: "POST /haul-invoices/${invoice_id}/pay"
              payload: {}
              as: Donor
              as_user_id: "${donor_id}"
          trigger:
            - call: "POST /haul-invoices/${invoice_id}/pay"
              payload: {}
              as: Donor
              as_user_id: "${donor_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVOICE_INVALID_STATE"

  # ================================================================
  - section: endpoints
    instances:
      - name: list_pickup_requests_pagination_envelope
        claim_type: listing
        grounds: [endpoints, entities.PickupRequest]
        distinguishing_aspect: "GET /pickup-requests returns response_type array with pagination fields total_count and has_more in meta/envelope."
        test_recipe:
          setup: ["One donor with two REQUESTED pickups."]
          setup_api_calls:
            - call: "POST /partners"
              payload: { name: "PageCo", region_code: "CA-BAY", tax_id: "EIN-C23", accepted_categories: ["FURNITURE"] }
              as: PlatformAdmin
              captures: { partner_id: $.data.id }
            - call: "POST /donors"
              payload: { email: "c23@x.com", full_name: "C23", address: "23 B St", region_code: "CA-BAY" }
              as: Anonymous
              captures: { donor_id: $.data.id }
            - call: "POST /pickup-requests"
              payload: { donor_id: "${donor_id}", partner_id: "${partner_id}", pickup_mode: "ATTENDED", disposition: "DONATION", address: "23 B St" }
              as: Donor
              as_user_id: "${donor_id}"
            - call: "POST /pickup-requests"
              payload: { donor_id: "${donor_id}", partner_id: "${partner_id}", pickup_mode: "ATTENDED", disposition: "HAUL", address: "23 B St" }
              as: Donor
              as_user_id: "${donor_id}"
          trigger:
            - call: "GET /pickup-requests?donor_id=${donor_id}&limit=1&offset=0"
              payload: {}
              as: Donor
              as_user_id: "${donor_id}"
          assert:
            - "response_type == array"
            - "data length == 1"
            - "total_count == 2 and has_more == true"

