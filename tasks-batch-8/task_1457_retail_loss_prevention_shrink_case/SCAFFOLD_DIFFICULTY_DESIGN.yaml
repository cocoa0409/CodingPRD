  - rule_id: boundary_precision_check
    instances:
      - name: alert_escalation_exactly_75_vs_74
        grounds:
          - calculations.alert_score
          - state_machines.Alert.OPEN_to_ESCALATED
        distinguishing_aspect: |
          Numeric-threshold boundary on the alert score metric via POST /exception-events:
          group E1 lands exactly on ESCALATE_THRESHOLD (75.00, inclusive) and escalates;
          group E2 lands at 74.00 and stays OPEN. Both groups share the store so the only
          difference is the score arithmetic.
        test_recipe:
          setup:
            - "Store S1 ACTIVE; employees E1 and E2 at S1"
            - "E1 events (same occurred_at day): REFUND_NO_RECEIPT 5000 (15.0), HIGH_VALUE_VOID 5000 (21.0), SWEETHEART_SCAN 20000 (24.0) -> alert created OPEN at 60.0; SELF_CHECKOUT_MISMATCH 4000 (9.0) -> 69.0; NO_SALE_DRAWER 4000 (6.0) -> 75.0"
            - "E2 events: REFUND_NO_RECEIPT 5000 (15.0), HIGH_VALUE_VOID 5000 (21.0), SWEETHEART_SCAN 20000 (24.0) -> alert OPEN 60.0; PRICE_OVERRIDE 4000 (8.0) -> 68.0; NO_SALE_DRAWER 4000 (6.0) -> 74.0"
