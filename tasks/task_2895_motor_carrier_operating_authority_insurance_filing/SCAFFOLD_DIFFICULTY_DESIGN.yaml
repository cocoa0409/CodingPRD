# ============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 2895: Motor Carrier Operating Authority & Insurance Filing
#
# 9 rule_id blocks, 19 instances. Every numeric literal in every `assert:` was
# produced by executing the §1.3 formulas with Decimal ROUND_HALF_UP; none is an
# estimate. Every ${var} is bound by a `captures:` block on an earlier line of
# the same instance. The logical clock starts at 2026-08-01T00:00:00Z.
# ============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: carrier_risk_score_self_reported_versus_audited_variant
        grounds:
          - calculations.carrier_compliance_risk_score
          - calculations.safety_audit_outcome
          - entities.Carrier.fields.compliance_risk_variant
          - entities.Carrier.fields.compliance_risk_score
          - state_machines.SafetyAudit.SCHEDULED_to_PASSED
        distinguishing_aspect: |
          The two variants score the SAME carrier on a Carrier-level reputation
          scale: SELF_REPORTED derives its driver and vehicle components from
          fleet RATIOS (60 drivers / 40 vehicles, 40 vehicles / 10) and yields
          30.25 at activation, while AUDITED derives them from violation COUNTS
          (2 driver violations, 3 vehicle defects) and yields 9.60 for the same
          carrier — a 20.65 divergence on one entity.
        test_recipe:
          setup:
            - "one carrier (40 vehicles, 60 drivers, self-reported out-of-service rate 12.5%) holding one ACTIVE FOR_HIRE_PROPERTY authority for TX/OK/NM"
            - "activation has already written the SELF_REPORTED score 30.25 and created a SCHEDULED new-entrant SafetyAudit"
            - "logical clock at 2026-08-26T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /carriers"
              payload: { legal_name: "Lone Star Freight LLC", dba_name: "Lone Star", domicile_state: "TX", self_reported_vehicle_count: 40, self_reported_driver_count: 60, self_reported_oos_rate_pct: 12.5 }
              as: RegistryAdmin
              captures: { carrier_id: $.data.id }
            - call: "POST /process-agents"
              payload: { company_name: "Gulf Coast Process Agents", coverage_states: ["TX", "OK", "NM"], blanket_agent: false }
              as: RegistryAdmin
              captures: { agent_id: $.data.id }
            - call: "POST /insurers"
              payload: { company_name: "Permian Mutual Casualty", naic_code: "12345", authorized_states: ["TX", "OK", "NM"] }
              as: RegistryAdmin
              captures: { insurer_id: $.data.id }
            - call: "POST /authority-applications"
              payload: { carrier_id: "${carrier_id}", application_kind: "NEW", transportation_type: "FOR_HIRE_PROPERTY", requested_operating_states: ["TX", "OK", "NM"], hazmat_endorsement_requested: false, hazmat_bulk_capable: false }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { app_id: $.data.id }
            - call: "POST /authority-applications/${app_id}/submit"
              payload: {}
              as: CarrierRep
              as_user_id: "${carrier_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /authority-applications/${app_id}/vetting-review"
              payload: { disposition: "PUBLISH", findings: "no adverse vetting findings" }
              as: VettingAnalyst
              as_user_id: "staff-va-001"
            - call: "GET /operating-authorities"
              payload: { application_id: "${app_id}" }
              as: ComplianceOfficer
              as_user_id: "staff-co-002"
              captures: { auth_id: "$.data[0].id" }
            - call: "POST /operating-authorities/${auth_id}/process-agent-designations"
              payload: { process_agent_id: "${agent_id}", state_codes: ["TX", "OK", "NM"], effective_from: "2026-08-05T00:00:00Z" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
            - call: "GET /operating-authorities/${auth_id}"
              payload: {}
              as: InsuranceFiler
              as_user_id: "${insurer_id}"
              captures: { auth_v1: $.data.version }
            - call: "POST /insurance-filings"
              payload: { authority_id: "${auth_id}", insurer_id: "${insurer_id}", filing_type: "BIPD", coverage_limit_cents: 75000000, policy_number: "BIPD-1", effective_at: "2026-08-05T00:00:00Z", expected_authority_version: "${auth_v1}" }
              as: InsuranceFiler
              as_user_id: "${insurer_id}"
              captures: { filing1_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/fee-payments"
              payload: { amount_cents: 64791, memo: "docket filing fee" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-26T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /operating-authorities/${auth_id}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "staff-co-002"
            - call: "GET /carriers/${carrier_id}/safety-audits"
              payload: { status: "SCHEDULED" }
              as: ComplianceOfficer
              as_user_id: "staff-co-002"
              captures: { audit_id: "$.data[0].id" }
          trigger:
            - call: "POST /safety-audits/${audit_id}/record-result"
              payload: { audited_oos_rate_pct: 4.0, audited_driver_violation_count: 2, audited_vehicle_defect_count: 3, acute_violation_count: 0 }
              as: ComplianceOfficer
              as_user_id: "staff-co-003"
          assert:
            - "immediately after activation and before the trigger, Carrier.${carrier_id}.compliance_risk_score == 30.25 and Carrier.${carrier_id}.compliance_risk_variant == SELF_REPORTED"
            - "SafetyAudit.${audit_id}.audit_score == 9.60"
            - "SafetyAudit.${audit_id}.status == PASSED"
            - "Carrier.${carrier_id}.compliance_risk_score == 9.60"
            - "Carrier.${carrier_id}.compliance_risk_variant == AUDITED"
            - "Carrier.${carrier_id}.audited_oos_rate_pct == 4.0 while Carrier.${carrier_id}.self_reported_oos_rate_pct is still 12.5"
            - "Carrier.${carrier_id}.entrant_status == PERMANENT"
            - "OperatingAuthority.${auth_id}.new_entrant_audit_status == PASSED and OperatingAuthority.${auth_id}.authority_status == ACTIVE"

      - name: contract_liability_suspension_estimate_versus_settled_actual
        grounds:
          - calculations.contract_disruption_liability
          - entities.CustomerContract.fields.disruption_liability_variant
          - state_machines.CustomerContract.ACTIVE_to_SUSPENDED_BY_AUTHORITY
          - state_machines.CustomerContract.SUSPENDED_BY_AUTHORITY_to_ACTIVE
          - state_machines.RevocationProceeding.NOTICE_ISSUED_to_CURED
        distinguishing_aspect: |
          This variant pair lives on a different entity and a different quantity
          (money on CustomerContract, not a score on Carrier): SUSPENSION_ESTIMATE
          projects the 112 remaining term days at suspension and books 50400000
          cents, while SETTLED_ACTUAL charges only the 4 elapsed embargo days plus
          a per-embargoed-shipment penalty and books 2250000 cents — the estimate
          is 22.4x the settled figure on the identical contract.
        test_recipe:
          setup:
            - "the ACTIVE authority of the previous instance, plus one ACTIVE CustomerContract committing 90000000 cents/month for 2026-09-01 through 2026-12-31"
            - "one shipment tendered on 2026-09-02 and departed, so it is IN_TRANSIT"
            - "the BIPD filing is cancelled on 2026-09-10, lapsing insurance and suspending the authority"
            - "a replacement BIPD filing is made on 2026-09-14 and the proceeding is cured the same day"
