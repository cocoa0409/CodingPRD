      - name: error_invalid_request_missing_required_field
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_REQUEST]", "validations[priority=22]"]
        distinguishing_aspect: "POST /jobs missing required quoted_price_cents is rejected with ERR_INVALID_REQUEST http 400 — required-field enforcement distinct from the range-check use of the same error id."
        test_recipe:
          setup: ["customer exists"]
          setup_api_calls:
            - call: "POST /panel-shop/customers"
              payload: { company_name: "Miss Co", site_state_code: "UT" }
              as: ProjectManager
              captures: { c_ms: "$.data.id" }
          trigger:
            - call: "POST /panel-shop/jobs"
              payload: { customer_id: "${c_ms}", job_number: "J-MS1" }
              as: ProjectManager
              captures: { err_ms: "$.data.error_id" }
          assert:
            - "response status == 400 and error_id == ERR_INVALID_REQUEST"

      - name: error_reference_not_found_on_fk_body
        claim_type: violation_to_error
        grounds: ["errors[ERR_REFERENCE_NOT_FOUND]", "validations[priority=5]"]
        distinguishing_aspect: "POST /jobs with a nonexistent customer_id returns ERR_REFERENCE_NOT_FOUND 404 (body FK), distinct from ERR_NOT_FOUND on path ids."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /panel-shop/jobs"
              payload: { customer_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", job_number: "J-NF1", quoted_price_cents: 100 }
              as: ProjectManager
              captures: { err_rf: "$.data.error_id" }
          assert:
            - "response status == 404 and error_id == ERR_REFERENCE_NOT_FOUND"

