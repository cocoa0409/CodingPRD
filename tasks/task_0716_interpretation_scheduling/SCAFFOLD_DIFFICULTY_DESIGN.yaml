  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: interpreter_double_booked_closed_interval
        grounds:
          - validations[priority=10]
          - entities.InterpretationRequest.fields.window_start
          - entities.InterpretationRequest.fields.window_end
        distinguishing_aspect: "On the Interpreter resource, a SCHEDULED dispatch is rejected when the new window shares ANY instant (closed-interval: touching endpoints conflict) with the interpreter's existing scheduled session window."
        test_recipe:
          setup:
            - "An interpreter holding an accepted SCHEDULED assignment for window 11:00-12:00; only that interpreter qualifies."
            - "A second SCHEDULED request whose window 12:00-13:00 touches the first at 12:00 (closed-interval conflict)."
          setup_api_calls:
            - call: "POST /interpretation/clients"
              payload: { org_name: "County Court", org_type: "COURT", contact_email: "court@x.com" }
              as: PlatformAdmin
              captures: { court_id: $.data.id }
            - call: "POST /interpretation/rate-plans"
              payload: { client_id: "${court_id}", certification_tier: "COURT", modality: "VIDEO", billing_mode: "PER_MINUTE", rate_cents: 240, min_block_units: 10 }
              as: PlatformAdmin
            - call: "POST /interpretation/language-pairs"
              payload: { source_lang: "en", target_lang: "es" }
              as: PlatformAdmin
              captures: { lp_id: $.data.id }
            - call: "POST /interpretation/interpreters"
              payload: { full_name: "Court I", max_concurrent_load: 2 }
              as: PlatformAdmin
              captures: { itp_id: $.data.id }
            - call: "POST /interpretation/interpreters/${itp_id}/certifications"
              payload: { tier: "COURT", expires_at: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /interpretation/interpreters/${itp_id}/languages"
              payload: { language_pair_id: "${lp_id}" }
              as: PlatformAdmin
            - call: "POST /interpretation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /interpretation/requests"
              payload: { client_id: "${court_id}", language_pair_id: "${lp_id}", modality: "VIDEO", required_tier: "COURT", scheduling_mode: "SCHEDULED", window_start: "2026-03-10T11:00:00Z", window_end: "2026-03-10T12:00:00Z" }
              as: ClientAccount
              as_user_id: "${court_id}"
              captures: { r1_id: $.data.id, r1_v: $.data.version }
            - call: "POST /interpretation/requests/${r1_id}/dispatch"
              payload: { expected_request_version: "${r1_v}" }
              as: CoordinatorOps
              captures: { a1_id: $.data.id }
            - call: "POST /interpretation/assignments/${a1_id}/accept"
              payload: {}
              as: Interpreter
              as_user_id: "${itp_id}"
            - call: "POST /interpretation/requests"
              payload: { client_id: "${court_id}", language_pair_id: "${lp_id}", modality: "VIDEO", required_tier: "COURT", scheduling_mode: "SCHEDULED", window_start: "2026-03-10T12:00:00Z", window_end: "2026-03-10T13:00:00Z" }
              as: ClientAccount
              as_user_id: "${court_id}"
              captures: { r2_id: $.data.id, r2_v: $.data.version }
          trigger:
            - call: "POST /interpretation/requests/${r2_id}/dispatch"
              payload: { expected_request_version: "${r2_v}" }
              as: CoordinatorOps
          assert:
            - "InterpretationRequest.${r2_id}.status == UNFULFILLABLE (the only qualified interpreter is double-booked under closed-interval overlap; touching at 12:00 conflicts)."
            - "No new accepted Assignment is created for ${r2_id} against ${itp_id}."
      - name: client_window_conflict_half_open
        grounds:
          - validations[priority=11]
          - entities.InterpretationRequest.fields.window_start
          - entities.InterpretationRequest.fields.window_end
        distinguishing_aspect: "On the ClientAccount resource, a SCHEDULED request CREATE is rejected for half-open [start,end) overlap with another of the client's own SCHEDULED requests — adjacency that only touches (12:00 meets 12:00) is ALLOWED, the opposite interval semantics from the closed-interval interpreter rule."
        test_recipe:
          setup:
            - "A client with an OPEN SCHEDULED request for window 11:00-12:00."
            - "A second create for window 11:30-12:30 (half-open overlap) is rejected; a third for 12:00-13:00 (touching only) succeeds."
          setup_api_calls:
            - call: "POST /interpretation/clients"
              payload: { org_name: "County Court", org_type: "COURT", contact_email: "court@x.com" }
              as: PlatformAdmin
              captures: { court_id: $.data.id }
            - call: "POST /interpretation/language-pairs"
              payload: { source_lang: "en", target_lang: "es" }
              as: PlatformAdmin
              captures: { lp_id: $.data.id }
            - call: "POST /interpretation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /interpretation/requests"
              payload: { client_id: "${court_id}", language_pair_id: "${lp_id}", modality: "VIDEO", required_tier: "COURT", scheduling_mode: "SCHEDULED", window_start: "2026-03-10T11:00:00Z", window_end: "2026-03-10T12:00:00Z" }
              as: ClientAccount
              as_user_id: "${court_id}"
              captures: { r1_id: $.data.id }
          trigger:
            - call: "POST /interpretation/requests"
              payload: { client_id: "${court_id}", language_pair_id: "${lp_id}", modality: "VIDEO", required_tier: "COURT", scheduling_mode: "SCHEDULED", window_start: "2026-03-10T11:30:00Z", window_end: "2026-03-10T12:30:00Z" }
              as: ClientAccount
              as_user_id: "${court_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_CLIENT_WINDOW_CONFLICT for the 11:30-12:30 overlap."
            - "A separate create for window 12:00-13:00 (touching the first only at the 12:00 boundary) succeeds with 201 — half-open semantics permit adjacency."

  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: invoice_issue_settle_balance_conserved
        grounds:
          - state_machines.Complaint.UNDER_REVIEW_to_UPHELD
          - entities.ClientAccount.fields.outstanding_balance_cents
          - entities.Invoice.fields.total_cents
        distinguishing_aspect: "Conserved quantity = ClientAccount.outstanding_balance_cents. Forward action invoice issue adds total_cents; the compensating UPHELD-BILLING waiver debits exactly the waived session's billed_amount_cents, leaving outstanding_balance_cents == (sum of ISSUED invoice totals) - (sum of waived session amounts), pinned to 0 here."
        test_recipe:
          setup:
            - "One med phone session billed 3900c, on an ISSUED invoice -> outstanding 3900."
            - "A BILLING complaint UPHELD against that session waives the charge."
          setup_api_calls:
            - call: "POST /interpretation/clients"
