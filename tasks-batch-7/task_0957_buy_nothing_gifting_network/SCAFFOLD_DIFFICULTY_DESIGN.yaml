              as: Anonymous
              captures: { g_m_id: $.data.id }
            - call: "POST /v1/members"
              payload: { email: "xm@x.com", display_name: "M" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /v1/groups"
              payload: { name: "XEntity Group", zip_code: "98112", join_policy: "OPEN", capacity: 150 }
              as: PlatformAdmin
