              payload: { sale_price_cents: 25000000, sale_date: "2027-08-01T00:00:00Z" }
              as: Servicer
          trigger:
            - call: "POST /api/v1/servicing-accounts/${sa_id}/close"
              payload: {}
              as: Servicer
          assert:
            - "ServicingAccount.${sa_id}.recapture_amount_cents == 3437083"
            - "ServicingAccount.${sa_id}.forgiven_amount_cents == 212917"
            - "ServicingAccount.${sa_id}.lifecycle_status == CLOSED"
            - "Award.${aw_id}.status == RECAPTURED"
