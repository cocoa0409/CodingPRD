      - name: calc_premium_tier_boundary
        claim_type: boundary_edge
        grounds: [calculations.insurance_endorsement_premium, entities.Production.fields.endorsement_premium_cents]
        distinguishing_aspect: "Tier boundary is inclusive downward: exposure exactly 100000000 prices at 2% (premium 2000000), while 200000000 prices at 3% (premium 6000000)."
        test_recipe:
          setup: ["two fresh productions"]
          setup_api_calls:
            - call: "POST /api/productions"
              payload: { name: "PA", total_budget_cents: 500000000 }
              as: ProductionExecutive
              captures: { pa: $.data.id }
            - call: "POST /api/productions"
              payload: { name: "PB", total_budget_cents: 500000000 }
              as: ProductionExecutive
              captures: { pb: $.data.id }
          trigger:
            - call: "POST /api/productions/${pa}/file-insurance"
              payload: { declared_exposure_cents: 100000000 }
              as: ProductionExecutive
              captures: { prem_a: $.data.endorsement_premium_cents }
            - call: "POST /api/productions/${pb}/file-insurance"
              payload: { declared_exposure_cents: 200000000 }
              as: ProductionExecutive
              captures: { prem_b: $.data.endorsement_premium_cents }
          assert:
            - "prem_a == 2000000 (boundary exposure 100000000 stays in the 2% tier)"
            - "prem_b == 6000000 (200000000 is in the 3% tier)"

