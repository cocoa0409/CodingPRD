            - "Response status == 401 and data.error_id == ERR_UNAUTHENTICATED"

      - name: error_margin_call_unmet_underfunded_deposit
        claim_type: violation_to_error
        grounds: ["errors[ERR_MARGIN_CALL_UNMET]", "validations[priority=13]", state_machines.HedgePosition.MARGIN_CALL_to_OPEN]
        distinguishing_aspect: "A meet-call deposit (4000) below the outstanding margin_call_dollars (4500) returns 409 ERR_MARGIN_CALL_UNMET; the position stays in MARGIN_CALL."
        test_recipe:
          setup: ["A SHORT 3-contract hedge marked to 4.80 into MARGIN_CALL (call 4500)."]
          setup_api_calls:
            - call: "POST /commodities"
              payload: { symbol: "CORN", test_weight_lbs_per_bushel: 56, base_moisture_pct: 15.0, shrink_pct_per_point: 1.4, drying_cents_per_point_per_bushel: 4 }
