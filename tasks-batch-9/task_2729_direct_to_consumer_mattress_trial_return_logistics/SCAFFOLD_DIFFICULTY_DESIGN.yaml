# ===========================================================================
# 1.8 Scaffold Difficulty Design - Direct-to-Consumer Mattress Trial & Return
# Logistics. Every instance grounds in SCAFFOLD.yaml 1.1-1.7 only.
# Logical clock starts at 2026-08-01T00:00:00Z in every instance; any other
# instant is reached with POST /_clock/set_current_utc.
# ===========================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: refund_proration_provisional_usage_vs_final_tier_diverge_at_45_nights
        grounds:
          - calculations.refund_settlement
          - entities.ReturnCase.fields.provisional_refund_cents
          - entities.ReturnCase.fields.final_refund_cents
          - entities.RefundAuthorization.fields.net_refund_cents
          - state_machines.ReturnCase.logistics_status.PICKED_UP_to_INSPECTED
          - state_machines.ReturnCase.financial_status.PENDING_to_AUTHORIZED
        distinguishing_aspect: |
          Money variant: on one identical ReturnCase (paid_amount_cents 120000, nights_used 45,
          trial_nights 100) the PROVISIONAL usage basis withholds 13500 while the FINAL tier basis
          withholds 6000, so provisional_refund_cents == 106500 and final_refund_cents == 114000
          differ by exactly 7500 cents.
        test_recipe:
          setup:
            - "One QUEEN MEDIUM MattressModel priced 120000 cents with break_in_nights 21 and trial_nights 100."
            - "One ACTIVE CHARITY DispositionPartner in region CA accepting grades A and B, 6 intake units per day."
            - "One Customer with a DTC TrialOrder for 120000 cents, no promotion bundle, delivered at 2026-08-01T00:00:00Z."
            - "A ReturnCase opened 2026-09-10, collected 2026-09-15 (nights_used 45), inspected grade A / not soiled, donated to the charity, intake confirmed DELIVERED."
          setup_api_calls:
            - call: "POST /mattress-models"
              payload: { sku: "MDL-Q-MED", name: "Comfort Q Medium", firmness: "MEDIUM", size: "QUEEN", list_price_cents: 120000, break_in_nights: 21, trial_nights: 100 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /disposition-partners"
              payload: { name: "Rest Easy Charity", partner_type: "CHARITY", region_code: "CA", daily_intake_capacity_units: 6, accepts_condition_grades: ["A", "B"], soil_policy: "REJECT_SOILED", priority_rank: 1 }
              as: PlatformAdmin
              captures: { charity_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "dv1@example.com", full_name: "Dana Variant", household_hash: "HH-DV1" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /trial-orders"
              payload: { customer_id: "${cust_id}", model_id: "${model_id}", channel: "DTC", gross_price_cents: 120000 }
              as: TrialSupportAgent
              captures: { order_id: $.data.id }
            - call: "POST /trial-orders/${order_id}/dispatch"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /trial-orders/${order_id}/deliver"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /return-cases"
              payload: { order_id: "${order_id}", reason_code: "COMFORT" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rc_id: $.data.id }
            - call: "POST /pickup-routes"
              payload: { region_code: "CA", route_date: "2026-09-15", window_start_at: "2026-09-15T08:00:00Z", window_end_at: "2026-09-15T18:00:00Z", capacity_units: 6 }
              as: LogisticsCoordinator
              captures: { route_id: $.data.id }
            - call: "POST /pickup-routes/${route_id}/publish"
              payload: {}
              as: LogisticsCoordinator
              captures: { route_v: $.data.version }
            - call: "POST /pickup-appointments"
              payload: { route_id: "${route_id}", return_case_id: "${rc_id}", slot_start_at: "2026-09-15T09:00:00Z", slot_end_at: "2026-09-15T11:00:00Z", expected_pickup_route_version: "${route_v}" }
              as: LogisticsCoordinator
              captures: { appt_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pickup-appointments/${appt_id}/complete"
              payload: { outcome: "COMPLETED" }
              as: LogisticsCoordinator
            - call: "POST /return-cases/${rc_id}/inspect"
              payload: { condition_grade: "A", soil_flag: false, accessory_returned: false }
              as: LogisticsCoordinator
            - call: "POST /return-cases/${rc_id}/disposition"
              payload: { disposition: "DONATION", intake_date: "2026-09-16" }
              as: LogisticsCoordinator
              captures: { assign_id: $.data.id }
            - call: "POST /disposition-assignments/${assign_id}/confirm-intake"
              payload: { outcome: "DELIVERED" }
              as: LogisticsCoordinator
            - call: "GET /return-cases/${rc_id}"
              payload: {}
              as: FinanceController
              captures: { rc_v: $.data.version }
          trigger:
            - call: "POST /refund-authorizations"
              payload: { return_case_id: "${rc_id}", expected_return_case_version: "${rc_v}" }
              as: FinanceController
              as_user_id: "fin-authorizer-1"
              captures: { refund_id: $.data.id }
            - call: "GET /return-cases/${rc_id}/refund-summary"
              payload: {}
              as: FinanceController
          assert:
            - "ReturnCase.${rc_id}.nights_used == 45"
            - "ReturnCase.${rc_id}.provisional_refund_cents == 106500"
            - "RefundAuthorization.${refund_id}.proration_deduction_cents == 6000"
            - "RefundAuthorization.${refund_id}.net_refund_cents == 114000"
            - "ReturnCase.${rc_id}.final_refund_cents == 114000"
            - "ReturnCase.${rc_id}.proration_deduction_cents == 6000 (the FINAL value overwrites the 13500 stamped at inspection)"
            - "GET /return-cases/${rc_id}/refund-summary returns variant_in_effect == FINAL and variant_delta_cents == 7500"
            - "ReturnCase.${rc_id}.financial_status == AUTHORIZED"

      - name: abuse_score_rolling_decay_vs_lifetime_diverge_on_212_day_old_signal
        grounds:
          - calculations.abuse_score
          - entities.Customer.fields.abuse_score_rolling
          - entities.Customer.fields.abuse_score_lifetime
          - entities.TrialAbuseSignal.fields.recorded_at
          - entities.Customer.fields.status
        distinguishing_aspect: |
          Risk-points variant on a different entity domain (Customer fraud posture, not ReturnCase
          money): the same two signals score ROLLING_12M 40 versus LIFETIME 55 at clock
          2026-08-01, and 13 versus 55 at clock 2027-01-02, because only the rolling variant
          applies the 180-day half-weight step and the 365-day drop.
        test_recipe:
          setup:
            - "One Customer with no orders."
            - "One HOUSEHOLD_MATCH signal dated 2026-01-01 (212 days old at the opening clock) and one REPEAT_RETURN signal dated 2026-07-01 (31 days old)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "dv2@example.com", full_name: "Robin Decay", household_hash: "HH-DV2" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /trial-abuse-signals"
              payload: { customer_id: "${cust_id}", signal_type: "HOUSEHOLD_MATCH", recorded_at: "2026-01-01T00:00:00Z", source_note: "aged household match" }
              as: PlatformAdmin
            - call: "POST /trial-abuse-signals"
              payload: { customer_id: "${cust_id}", signal_type: "REPEAT_RETURN", recorded_at: "2026-07-01T00:00:00Z", source_note: "recent completed return" }
              as: PlatformAdmin
          trigger:
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "At clock 2026-08-01T00:00:00Z: Customer.${cust_id}.abuse_score_rolling == 40"
            - "At clock 2026-08-01T00:00:00Z: Customer.${cust_id}.abuse_score_lifetime == 55"
            - "At clock 2026-08-01T00:00:00Z: Customer.${cust_id}.status == ACTIVE and trial_block_until == null"
            - "At clock 2027-01-02T00:00:00Z: Customer.${cust_id}.abuse_score_rolling == 13"
            - "At clock 2027-01-02T00:00:00Z: Customer.${cust_id}.abuse_score_lifetime == 55"
            - "Customer.${cust_id}.signal_count == 2 at both clock positions"

  - rule_id: combinatorial_formula
    instances:
      - name: bundle_unwind_three_components_rounded_individually_before_summing
        grounds:
          - calculations.bundle_unwind
          - calculations.order_pricing
          - entities.PromotionBundle.fields.unwind_policy
          - entities.ReturnCase.fields.bundle_unwind_cents
          - state_machines.ReturnCase.logistics_status.PICKED_UP_to_INSPECTED
        distinguishing_aspect: |
          Mode (b) - multi-component sum with per-component rounding pinned: the DEDUCT_PRORATED
          bundle's three components round to 6787 + 1119 + 4236 == 12142, whereas summing the exact
          rationals (6787 + 1118.936... + 4235.55 == 12141.486...) and rounding once yields 12141,
          so the one-cent gap falsifies any implementation that rounds only at the end.
        test_recipe:
          setup:
            - "One QUEEN MEDIUM MattressModel priced 120000 cents, break_in_nights 21, trial_nights 100."
            - "One PromotionBundle with unwind_policy DEDUCT_PRORATED, accessory_retail_cents 12340, gift_card_cents 7701, percent_off_bps 1000, requires_accessory_return false."
            - "One ACTIVE CHARITY DispositionPartner in region CA accepting grades A and B."
            - "A bundled DTC TrialOrder for gross 120000 (bundle_discount 12000, paid 108000) delivered 2026-08-01, collected 2026-09-15 with nights_used 45, inspected grade A / not soiled / accessory NOT returned."
          setup_api_calls:
            - call: "POST /mattress-models"
              payload: { sku: "MDL-Q-MED-B", name: "Comfort Q Medium", firmness: "MEDIUM", size: "QUEEN", list_price_cents: 120000, break_in_nights: 21, trial_nights: 100 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /promotion-bundles"
              payload: { code: "SLEEP-KIT-PRO", unwind_policy: "DEDUCT_PRORATED", accessory_retail_cents: 12340, percent_off_bps: 1000, gift_card_cents: 7701, requires_accessory_return: false }
              as: PlatformAdmin
              captures: { bundle_id: $.data.id }
            - call: "POST /disposition-partners"
              payload: { name: "Rest Easy Charity", partner_type: "CHARITY", region_code: "CA", daily_intake_capacity_units: 6, accepts_condition_grades: ["A", "B"], soil_policy: "REJECT_SOILED", priority_rank: 1 }
              as: PlatformAdmin
              captures: { charity_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "cf1@example.com", full_name: "Casey Bundle", household_hash: "HH-CF1" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /trial-orders"
              payload: { customer_id: "${cust_id}", model_id: "${model_id}", channel: "DTC", gross_price_cents: 120000, bundle_id: "${bundle_id}" }
              as: TrialSupportAgent
              captures: { order_id: $.data.id }
            - call: "POST /trial-orders/${order_id}/dispatch"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /trial-orders/${order_id}/deliver"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /return-cases"
              payload: { order_id: "${order_id}", reason_code: "COMFORT" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rc_id: $.data.id }
            - call: "POST /pickup-routes"
              payload: { region_code: "CA", route_date: "2026-09-15", window_start_at: "2026-09-15T08:00:00Z", window_end_at: "2026-09-15T18:00:00Z", capacity_units: 6 }
              as: LogisticsCoordinator
              captures: { route_id: $.data.id }
            - call: "POST /pickup-routes/${route_id}/publish"
              payload: {}
              as: LogisticsCoordinator
              captures: { route_v: $.data.version }
            - call: "POST /pickup-appointments"
              payload: { route_id: "${route_id}", return_case_id: "${rc_id}", slot_start_at: "2026-09-15T09:00:00Z", slot_end_at: "2026-09-15T11:00:00Z", expected_pickup_route_version: "${route_v}" }
              as: LogisticsCoordinator
              captures: { appt_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pickup-appointments/${appt_id}/complete"
              payload: { outcome: "COMPLETED" }
              as: LogisticsCoordinator
          trigger:
            - call: "POST /return-cases/${rc_id}/inspect"
              payload: { condition_grade: "A", soil_flag: false, accessory_returned: false }
              as: LogisticsCoordinator
          assert:
            - "TrialOrder.${order_id}.bundle_discount_cents == 12000"
            - "TrialOrder.${order_id}.paid_amount_cents == 108000"
            - "ReturnCase.${rc_id}.nights_used == 45"
            - "ReturnCase.${rc_id}.bundle_unwind_cents == 12142"
            - "ReturnCase.${rc_id}.damage_offset_cents == 0"
            - "ReturnCase.${rc_id}.proration_deduction_cents == 12150"
            - "ReturnCase.${rc_id}.provisional_refund_cents == 83708"

      - name: exchange_tier_credit_keyed_on_raw_difference_not_post_fee_difference
        grounds:
          - calculations.exchange_settlement
          - entities.ComfortExchange.fields.raw_price_difference_cents
          - entities.ComfortExchange.fields.tier_credit_cents
          - entities.ComfortExchange.fields.price_difference_cents
          - entities.ComfortExchange.fields.settlement_direction
        distinguishing_aspect: |
          Mode (c) - pinned evaluation order: with raw_price_difference_cents 19000 the tier lookup
          in step 4 reads the STEP-1 raw value (19000 < TIER_A_MAX_CENTS, so tier_credit_cents == 0
          and price_difference_cents == 28900); an implementation that keys the tier on the post-fee
          value 28900 would grant 3000 and return 25900, so the two orderings are distinguishable
          by one assertion.
        test_recipe:
          setup:
            - "Two QUEEN MattressModels of different firmness: MEDIUM at 120000 cents and FIRM at 139000 cents, both break_in_nights 21 / trial_nights 100."
            - "One Customer with a DTC TrialOrder on the MEDIUM model for 120000 cents (paid 120000), delivered 2026-08-01, exchange_chain_depth 0."
            - "Clock advanced to 2026-08-22T00:00:00Z, exactly break_in_ends_at, so the exchange request is admissible."
          setup_api_calls:
            - call: "POST /mattress-models"
              payload: { sku: "MDL-Q-MED-X", name: "Comfort Q Medium", firmness: "MEDIUM", size: "QUEEN", list_price_cents: 120000, break_in_nights: 21, trial_nights: 100 }
              as: PlatformAdmin
              captures: { model_med_id: $.data.id }
            - call: "POST /mattress-models"
              payload: { sku: "MDL-Q-FIRM-X", name: "Comfort Q Firm", firmness: "FIRM", size: "QUEEN", list_price_cents: 139000, break_in_nights: 21, trial_nights: 100 }
              as: PlatformAdmin
              captures: { model_firm_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "cf2@example.com", full_name: "Quinn Firmness", household_hash: "HH-CF2" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /trial-orders"
              payload: { customer_id: "${cust_id}", model_id: "${model_med_id}", channel: "DTC", gross_price_cents: 120000 }
              as: TrialSupportAgent
              captures: { order_id: $.data.id }
            - call: "POST /trial-orders/${order_id}/dispatch"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /trial-orders/${order_id}/deliver"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-22T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /comfort-exchanges"
              payload: { original_order_id: "${order_id}", target_model_id: "${model_firm_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { exch_id: $.data.id }
          assert:
            - "ComfortExchange.${exch_id}.sequence_number == 1"
            - "ComfortExchange.${exch_id}.raw_price_difference_cents == 19000"
            - "ComfortExchange.${exch_id}.exchange_fee_cents == 9900"
            - "ComfortExchange.${exch_id}.tier_credit_cents == 0"
            - "ComfortExchange.${exch_id}.price_difference_cents == 28900"
            - "ComfortExchange.${exch_id}.settlement_direction == CHARGE_CUSTOMER"
            - "ComfortExchange.${exch_id}.status == REQUESTED"

      - name: price_match_credit_branch_table_capped_for_match_to_advertised
        grounds:
          - calculations.attribution_settlement
          - entities.RetailPartner.fields.price_match_policy
          - entities.AttributionClaim.fields.price_match_credit_cents
          - entities.AttributionClaim.fields.commission_cents
          - state_machines.AttributionClaim.status.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          Mode (a) - branch table over claim_type x price_match_policy: for a MATCH_TO_ADVERTISED
          partner the raw gap 20000 is capped at PRICE_MATCH_CAP_BPS of gross (12000), so
          price_match_credit_cents == 12000 while commission_cents stays 0; the MATCH_TO_LOWEST cell
          of the same table would pay the uncapped 20000.
        test_recipe:
          setup:
            - "One QUEEN MEDIUM MattressModel priced 120000 cents."
            - "One ACTIVE RetailPartner in region CA with commission_bps 500, price_match_policy MATCH_TO_ADVERTISED, attribution_window_days 30."
            - "One RETAIL_PARTNER-channel TrialOrder for gross 120000 (paid 120000) attributed to that partner and delivered 2026-08-01."
            - "A PRICE_MATCH AttributionClaim submitted 2026-08-10 with 2 evidence links against a competitor price of 100000, already moved UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /mattress-models"
              payload: { sku: "MDL-Q-MED-P", name: "Comfort Q Medium", firmness: "MEDIUM", size: "QUEEN", list_price_cents: 120000 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /retail-partners"
              payload: { name: "Sleep Barn CA", region_code: "CA", commission_bps: 500, price_match_policy: "MATCH_TO_ADVERTISED", attribution_window_days: 30 }
              as: PlatformAdmin
              captures: { partner_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "cf3@example.com", full_name: "Pat Matcher", household_hash: "HH-CF3" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /trial-orders"
              payload: { customer_id: "${cust_id}", model_id: "${model_id}", channel: "RETAIL_PARTNER", gross_price_cents: 120000, retail_partner_id: "${partner_id}" }
              as: TrialSupportAgent
              captures: { order_id: $.data.id }
            - call: "POST /trial-orders/${order_id}/dispatch"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /trial-orders/${order_id}/deliver"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /attribution-claims"
              payload: { partner_id: "${partner_id}", order_id: "${order_id}", claim_type: "PRICE_MATCH", evidence_url_count: 2, competitor_price_cents: 100000 }
              as: RetailPartner
              as_user_id: "${partner_id}"
              captures: { attr_id: $.data.id }
            - call: "POST /attribution-claims/${attr_id}/review"
              payload: { action: "ACCEPT_FOR_REVIEW" }
              as: FinanceController
          trigger:
            - call: "POST /attribution-claims/${attr_id}/resolve"
              payload: { decision: "APPROVE" }
              as: FinanceController
          assert:
            - "AttributionClaim.${attr_id}.status == APPROVED"
            - "AttributionClaim.${attr_id}.price_match_credit_cents == 12000"
            - "AttributionClaim.${attr_id}.commission_cents == 0"
            - "AttributionClaim.${attr_id}.resolved_at == 2026-08-10T00:00:00Z"
            - "TrialOrder.${order_id}.price_match_credit_cents == 12000"
            - "TrialOrder.${order_id}.paid_amount_cents == 120000 and outstanding_refundable_cents == 120000 (the credit never touches the refundable principal)"

  - rule_id: non_linear_state_machine
    instances:
      - name: fulfillment_axis_cycles_damaged_reported_back_to_delivered_while_trial_axis_holds_break_in
        grounds:
          - state_machines.TrialOrder.fulfillment_status.DELIVERED_to_DAMAGED_REPORTED
          - state_machines.TrialOrder.fulfillment_status.DAMAGED_REPORTED_to_DELIVERED
          - state_machines.QualityClaim.status.SUBMITTED_to_EVIDENCE_REQUESTED
          - state_machines.QualityClaim.status.EVIDENCE_REQUESTED_to_SUBMITTED
          - calculations.quality_claim_credit
        distinguishing_aspect: |
          Re-entry on the TrialOrder fulfillment dimension (DELIVERED -> DAMAGED_REPORTED ->
          DELIVERED) driven by the QualityClaim SUBMITTED <-> EVIDENCE_REQUESTED loop, while the
          parallel trial dimension stays BREAK_IN throughout - the two axes of the same entity move
          independently on different triggers.
        test_recipe:
          setup:
            - "One QUEEN MEDIUM MattressModel priced 120000 cents with break_in_nights 21, trial_nights 100."
            - "One Customer with a DTC TrialOrder for 120000 cents delivered 2026-08-01T00:00:00Z (break_in_ends_at 2026-08-22T00:00:00Z)."
            - "Clock at 2026-08-05T00:00:00Z, i.e. 4 nights slept, past COMPRESSION_RECOVERY_WAIT_NIGHTS and still inside the break-in window."
          setup_api_calls:
            - call: "POST /mattress-models"
              payload: { sku: "MDL-Q-MED-C", name: "Comfort Q Medium", firmness: "MEDIUM", size: "QUEEN", list_price_cents: 120000, break_in_nights: 21, trial_nights: 100 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "sm1@example.com", full_name: "Sam Cycle", household_hash: "HH-SM1" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /trial-orders"
              payload: { customer_id: "${cust_id}", model_id: "${model_id}", channel: "DTC", gross_price_cents: 120000 }
              as: TrialSupportAgent
              captures: { order_id: $.data.id }
            - call: "POST /trial-orders/${order_id}/dispatch"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /trial-orders/${order_id}/deliver"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /quality-claims"
              payload: { order_id: "${order_id}", claim_type: "COMPRESSION_RECOVERY", photo_evidence_count: 2 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /quality-claims/${claim_id}/request-evidence"
              payload: {}
              as: TrialSupportAgent
            - call: "POST /quality-claims/${claim_id}/submit-evidence"
              payload: { photo_evidence_count: 2 }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /quality-claims/${claim_id}/adjudicate"
              payload: { resolution: "CREDIT" }
              as: TrialSupportAgent
              as_user_id: "agent-adjudicator-1"
          assert:
            - "After the claim was filed: TrialOrder.${order_id}.fulfillment_status was DAMAGED_REPORTED"
