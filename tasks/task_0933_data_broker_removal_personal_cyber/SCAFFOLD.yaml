    roles: [PlatformAdmin]
    code: 200
    input: []
    output: BillingCycle
    side_effects:
      - "BillingCycle OPEN -> CLOSED, freezes pre_discount_total_cents / loyalty_discount_cents / total_charged_cents"
      - "mints the successor cycle (cycle_seq + 1) when the account is ACTIVE"
      - "appends three CYCLE_GRANT ledger entries against the successor cycle"
      - "increments BillingCycle.version by 1"

  - method: GET
    path: "/entitlement-ledger"
    description: "FK reverse lookup for EntitlementLedgerEntry.account_id, .member_id and .cycle_id. Append-only log ordered by created_at ASC."
    roles: [PlatformAdmin, AccountOwner, Auditor]
    code: 200
    input: ["account_id?", "member_id?", "cycle_id?", "resource_type?", "entry_type?", "limit?", "offset?"]
    output: EntitlementLedgerEntry[]
    side_effects: []

  - method: GET
    path: "/entitlement-ledger/{id}"
    description: "Reads one ledger entry including its derived signed_amount."
    roles: [PlatformAdmin, AccountOwner, Auditor]
    code: 200
    input: []
    output: EntitlementLedgerEntry
    side_effects: []

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog — 61 codes, each triggerable by at least one §1.4 rung
# or §1.2.1 concurrency rule.
# ---------------------------------------------------------------------------

errors:

  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or X-User-Role is not one of the five declared roles (rungs 1-2)."
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The endpoint's §1.5 roles list does not contain the supplied X-User-Role (rung 3)."
  - id: ERR_IDENTITY_UNRESOLVED
    http: 403
    condition: "Role Member or AccountOwner supplied an X-User-ID that is not an existing Member.id, or an AccountOwner's Member row has is_primary false (rung 4)."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "A Member or AccountOwner addressed a row outside their own Account, or a non-primary Member addressed another member's row (rung 12)."

  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "plan_id or new_plan_id in the request body does not resolve."
  - id: ERR_ACCOUNT_NOT_FOUND
    http: 404
    condition: "{id} does not resolve."
  - id: ERR_MEMBER_NOT_FOUND
    http: 404
    condition: "{id} or a body member_id does not resolve."
  - id: ERR_PROFILE_NOT_FOUND
    http: 404
    condition: "{id} or a body profile_id does not resolve."
  - id: ERR_BROKER_NOT_FOUND
    http: 404
    condition: "{id} or a body broker_id does not resolve."
  - id: ERR_SCAN_NOT_FOUND
    http: 404
    condition: "{id} does not resolve."
  - id: ERR_EXPOSURE_NOT_FOUND
    http: 404
    condition: "{id} or a body exposure_id does not resolve."
  - id: ERR_REMOVAL_REQUEST_NOT_FOUND
    http: 404
    condition: "{id} does not resolve."
  - id: ERR_DOCUMENT_NOT_FOUND
    http: 404
    condition: "{id} does not resolve."
  - id: ERR_BREACH_EVENT_NOT_FOUND
    http: 404
    condition: "{id} does not resolve."
  - id: ERR_ALERT_NOT_FOUND
    http: 404
    condition: "{id} does not resolve."
  - id: ERR_FINDING_NOT_FOUND
    http: 404
    condition: "{id} does not resolve."
  - id: ERR_ADDON_NOT_FOUND
    http: 404
    condition: "{id} or a body addon_id does not resolve."
  - id: ERR_SEAT_NOT_FOUND
    http: 404
    condition: "{id} does not resolve."
  - id: ERR_CYCLE_NOT_FOUND
    http: 404
    condition: "{id} does not resolve."
  - id: ERR_LEDGER_ENTRY_NOT_FOUND
    http: 404
    condition: "{id} does not resolve."

  - id: ERR_VALIDATION
    http: 422
    condition: "A required body field is absent, or a supplied field has the wrong JSON type (rungs 6-7)."
  - id: ERR_INVALID_ENUM
    http: 422
    condition: "A field on rung 8's exhaustive list carries a value outside its declared member set."
  - id: ERR_VALUE_OUT_OF_RANGE
    http: 422
    condition: "A numeric field violates its §1.1 range constraint (rung 9)."
  - id: ERR_INVALID_DATE_RANGE
    http: 422
    condition: "BreachEvent.disclosed_at is earlier than breach_date, or IdentityDocument.expires_at is not at least one second after current_utc (rung 10)."

  - id: ERR_ACCOUNT_LEGAL_HOLD
    http: 409
    condition: "GLOBAL WRITE GATE 1 — the account in scope has legal_hold true (rung 13)."
  - id: ERR_ACCOUNT_CANCELLED
    http: 409
    condition: "GLOBAL WRITE GATE 2 — the account in scope has status CANCELLED (rung 14)."
  - id: ERR_ACCOUNT_SUSPENDED
    http: 409
    condition: "GLOBAL WRITE GATE 3 — the account in scope has status SUSPENDED (rung 15)."
  - id: ERR_AUTHORIZATION_REVOKED
    http: 409
    condition: "The member on whose behalf the operation acts has authorization_status REVOKED (rung 16)."

  - id: ERR_STALE_PROFILE_VERSION
    http: 412
    condition: "expected_profile_version does not equal MonitoredProfile.version (concurrency rule identifier-add-stale-profile)."
  - id: ERR_STALE_ADDON_VERSION
    http: 412
    condition: "expected_addon_version does not equal AddOnSubscription.version (concurrency rule device-seat-bind-stale-addon)."
  - id: ERR_STALE_ACCOUNT_VERSION
    http: 412
    condition: "expected_account_version does not equal Account.version (concurrency rules plan-change-stale-account and member-invite-stale-account)."

  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target row's current state has no declared §1.2 transition for the requested trigger (rung 18)."
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "The target row already sits in one of its machine's terminal_states (rung 19)."

  - id: ERR_PROFILE_NOT_ACTIVE
    http: 409
    condition: "The MonitoredProfile the operation depends on is not ACTIVE (rung 20)."
  - id: ERR_MEMBER_NOT_ACTIVE
    http: 409
    condition: "The Member the operation depends on is not ACTIVE (rung 21)."
  - id: ERR_BROKER_RETIRED
    http: 409
    condition: "The Broker the operation depends on has status RETIRED (rung 22)."
  - id: ERR_ADDON_NOT_ACTIVE
    http: 409
    condition: "The AddOnSubscription the operation depends on is not ACTIVE (rung 23)."
  - id: ERR_CYCLE_CLOSED
    http: 409
    condition: "The account has no OPEN BillingCycle to book the money into because its latest cycle was closed while the account was SUSPENDED (rung 24)."

  - id: ERR_IDENTITY_VERIFICATION_REQUIRED
    http: 403
    condition: "The broker requires identity verification and the member holds no VERIFIED IdentityDocument at all (rung 25)."
  - id: ERR_IDENTITY_DOCUMENT_EXPIRED
    http: 409
    condition: "The broker requires identity verification and every VERIFIED IdentityDocument the member holds has current_utc at or past its expires_at (rung 26)."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The X-User-ID completing a removal request equals the X-User-ID that submitted it (rung 27)."

  - id: ERR_SLA_NOT_ELAPSED
    http: 409
    condition: "Expiry was requested before the request's sla_deadline_at (rung 28)."
  - id: ERR_RESCAN_TOO_SOON
    http: 409
    condition: "A RECURRING scan was queued fewer than 7 whole days after last_completed_scan_at (rung 29)."
  - id: ERR_INITIAL_SCAN_ALREADY_DONE
    http: 409
    condition: "An INITIAL scan was queued on a profile that already has a last_completed_scan_at (rung 30)."
  - id: ERR_SEAT_REBIND_COOLOFF
    http: 409
    condition: "A seat rebind was attempted before released_at + 72 hours (rung 31)."
  - id: ERR_EXPOSURE_CHANNEL_BUFFER
    http: 409
    condition: "A new removal request was drafted before the 24-hour reopen buffer following the previous request's closed_at had elapsed (rung 32)."

  - id: ERR_ESCALATION_CAP_REACHED
    http: 409
    condition: "Escalation was requested on a request whose escalation_count is already 2 (rung 33)."
  - id: ERR_SCAN_RETRY_CAP_REACHED
    http: 409
    condition: "Retry was requested on a scan whose retry_count is already 2 (rung 34)."
  - id: ERR_DUPLICATE_REMOVAL_REQUEST
    http: 409
    condition: "A RemovalRequest in DRAFTED, SUBMITTED, ACKNOWLEDGED or ESCALATED already occupies the exposure (rung 35)."
  - id: ERR_DUPLICATE_IDENTIFIER
    http: 409
    condition: "The profile already carries an Identifier with the same (identifier_type, identifier_value) pair (rung 36)."
  - id: ERR_IDENTIFIER_CAP_EXCEEDED
    http: 409
    condition: "The profile already holds MAX_IDENTIFIERS_PER_PROFILE (8) identifiers (rung 37)."
  - id: ERR_DUPLICATE_MEMBER_EMAIL
    http: 409
    condition: "Another Member in {INVITED, ACTIVE} on the same account already uses the supplied email (rung 38)."
  - id: ERR_DUPLICATE_ADDON
    http: 409
    condition: "An AddOnSubscription of the same addon_type in {ACTIVE, SUSPENDED} already exists on the account (rung 39)."
  - id: ERR_PROFILE_HAS_NO_IDENTIFIER
    http: 409
    condition: "Activation was attempted on a profile that carries no Identifier rows (rung 40)."
  - id: ERR_MEMBER_CAP_EXCEEDED
    http: 409
    condition: "The account already holds Plan.max_members rows in {INVITED, ACTIVE} (rung 41)."
  - id: ERR_SEAT_CAPACITY_EXCEEDED
    http: 409
    condition: "The add-on's BOUND seat count already equals seats_total (rung 42)."

  - id: ERR_PROFILE_QUOTA_EXCEEDED
    http: 409
    condition: "Account.profile_units_remaining is 0 at profile activation (rung 43)."
  - id: ERR_SCAN_QUOTA_EXCEEDED
    http: 409
    condition: "Account.scan_units_remaining is 0 at scan creation (rung 44)."
  - id: ERR_REMOVAL_QUOTA_EXCEEDED
    http: 409
    condition: "Account.removal_units_remaining is 0 at removal-request creation and the exposure is not fee_exempt (rung 45)."
  - id: ERR_MEMBER_SUBCAP_EXCEEDED
    http: 409
    condition: "The shared pool still has units but the member's own sub-cap is exhausted (rung 46)."
  - id: ERR_PLAN_DOWNGRADE_BELOW_USAGE
    http: 409
    condition: "The target plan's max_members is below the account's occupied seat count, or its profile_quota_per_cycle is below profile_units_consumed (rung 47)."

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------

roles:

  - name: PlatformAdmin
    description: "Operator of the service. Owns catalogue configuration (plans, brokers, breach events), account lifecycle, billing-cycle closure and the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /plans"
      - "POST /brokers"
      - "POST /brokers/{id}/retire"
      - "POST /accounts"
      - "POST /accounts/{id}/suspend"
      - "POST /accounts/{id}/resume"
      - "POST /accounts/{id}/legal-hold"
      - "POST /breach-events"
      - "POST /breach-events/{id}/ingest"
      - "POST /billing-cycles/{id}/close"
      - "GET /accounts"
    shared_operations:
      - "POST /accounts/{id}/cancel (with AccountOwner)"
      - "POST /accounts/{id}/plan-changes (with AccountOwner)"
      - "POST /accounts/{id}/members (with AccountOwner)"
      - "POST /accounts/{id}/addons (with AccountOwner)"
      - "POST /members/{id}/remove (with AccountOwner)"
      - "POST /identity-documents/{id}/verify (with PrivacyAgent)"
      - "POST /removal-requests/{id}/expire (with PrivacyAgent)"
      - "POST /addons/{id}/suspend and /resume (with AccountOwner)"
      - "every GET endpoint listing PlatformAdmin in its roles"

  - name: PrivacyAgent
    description: "Removal-operations staff acting toward brokers on the member's behalf. Segregation of duties is enforced on this role: the agent id that submits a removal request may not complete it."
    identity: opaque
    exclusive_operations:
      - "POST /scan-runs/{id}/start"
      - "POST /scan-runs/{id}/findings"
      - "POST /scan-runs/{id}/complete"
      - "POST /scan-runs/{id}/fail"
      - "POST /scan-runs/{id}/retry"
      - "POST /removal-requests/{id}/submit"
      - "POST /removal-requests/{id}/acknowledge"
      - "POST /removal-requests/{id}/complete"
      - "POST /removal-requests/{id}/reject"
      - "POST /removal-requests/{id}/escalate"
      - "POST /identity-documents/{id}/reject"
      - "POST /credential-findings"
      - "POST /credential-findings/{id}/reopen"
    shared_operations:
      - "POST /identity-documents/{id}/verify (with PlatformAdmin)"
      - "POST /removal-requests/{id}/expire (with PlatformAdmin)"
      - "POST /members/{id}/identity-documents (with AccountOwner, Member)"
      - "POST /scan-runs, POST /scan-runs/{id}/cancel (with AccountOwner, Member)"
      - "POST /removal-requests, POST /removal-requests/{id}/void (with AccountOwner, Member)"
      - "POST /breach-alerts/{id}/acknowledge (with AccountOwner, Member)"
      - "GET /brokers/{id}/compliance-report (with PlatformAdmin, Auditor)"
      - "every GET endpoint listing PrivacyAgent in its roles"

  - name: AccountOwner
    description: "The primary Member of a household. X-User-ID is the id of a Member row whose is_primary is true. Can administer the household roster, plan and add-ons in addition to everything a Member can do."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /accounts/{id}/members"
      - "POST /accounts/{id}/addons"
      - "POST /members/{id}/remove (shared only with PlatformAdmin)"
    shared_operations:
      - "POST /accounts/{id}/cancel, POST /accounts/{id}/plan-changes (with PlatformAdmin)"
      - "POST /addons/{id}/suspend and /resume (with PlatformAdmin)"
      - "POST /members/{id}/activate, POST /members/{id}/authorization (with Member)"
      - "POST /monitored-profiles and its activate / pause / retire / identifiers / PATCH endpoints (with Member)"
      - "POST /scan-runs, POST /scan-runs/{id}/cancel (with PrivacyAgent, Member)"
      - "POST /removal-requests, POST /removal-requests/{id}/void (with PrivacyAgent, Member)"
      - "POST /breach-alerts/{id}/acknowledge and /resolve (with Member)"
      - "POST /credential-findings/{id}/remediate (with Member)"
      - "POST /device-seats and its release / rebind endpoints (with Member)"
      - "POST /members/{id}/identity-documents (with PrivacyAgent, Member)"
      - "every GET endpoint listing AccountOwner in its roles"

  - name: Member
    description: "A non-primary household member. X-User-ID is the id of a Member row. Scoped by rung 12 to rows whose member_id equals their own id, plus account-level reads."
    identity: "entity_backed:Member"
    exclusive_operations: []
    shared_operations:
      - "POST /members/{id}/activate, POST /members/{id}/authorization (with AccountOwner)"
      - "POST /monitored-profiles and its activate / pause / retire / identifiers / PATCH endpoints (with AccountOwner)"
      - "POST /scan-runs, POST /scan-runs/{id}/cancel (with PrivacyAgent, AccountOwner)"
      - "POST /removal-requests, POST /removal-requests/{id}/void (with PrivacyAgent, AccountOwner)"
      - "POST /breach-alerts/{id}/acknowledge and /resolve (with AccountOwner)"
      - "POST /credential-findings/{id}/remediate (with AccountOwner)"
      - "POST /device-seats and its release / rebind endpoints (with AccountOwner)"
      - "POST /members/{id}/identity-documents (with PrivacyAgent, AccountOwner)"
      - "every GET endpoint listing Member in its roles"

  - name: Auditor
    description: "Read-only compliance reviewer. Holds no mutating capability anywhere in the API."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /accounts, GET /accounts/{id}, GET /accounts/{id}/members"
      - "GET /accounts/{id}/addons, GET /accounts/{id}/billing-cycles, GET /accounts/{id}/entitlement-statement"
      - "GET /members/{id}, GET /members/{id}/monitored-profiles, GET /members/{id}/exposure-summary"
      - "GET /monitored-profiles/{id}, GET /monitored-profiles/{id}/identifiers, GET /monitored-profiles/{id}/hygiene-score"
      - "GET /brokers/{id}/compliance-report"
      - "GET /scan-runs, GET /scan-runs/{id}, GET /exposures, GET /exposures/{id}"
      - "GET /removal-requests, GET /removal-requests/{id}"
      - "GET /breach-alerts, GET /breach-alerts/{id}"
      - "GET /credential-findings, GET /credential-findings/{id}"
      - "GET /addons/{id}, GET /device-seats, GET /device-seats/{id}"
      - "GET /entitlement-ledger, GET /entitlement-ledger/{id}"
