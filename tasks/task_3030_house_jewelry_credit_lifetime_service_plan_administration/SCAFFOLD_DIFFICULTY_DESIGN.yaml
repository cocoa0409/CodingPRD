  - rule_id: priority_pair_validation_conflict
    instances:

      # --- Pair: business_compliance vs business_fiscal ---
      - name: regulation_terms_outrank_credit_limit_on_decision
        grounds:
          - validations[priority=6]
          - validations[priority=20]
          - errors.ERR_REGULATION_TERMS_VIOLATION
          - errors.ERR_CREDIT_LIMIT_EXCEEDED
        distinguishing_aspect: "A different error-category pair from the sibling instance — business_compliance (priority 6) against business_fiscal (priority 20). When a decision request both sits in a state whose lifetime-plan terms are unregistered and asks for more than the tier's limit, the returned error_id is ERR_REGULATION_TERMS_VIOLATION because priority 6 is evaluated first."
