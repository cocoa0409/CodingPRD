              payload: { effective_date: "2026-09-01" }
              as: SupervisingAttorney
              captures: { e_revstatus1: "$.data.error_id" }
            - call: "PATCH /child-support/participants/${cpv6}/income"
              payload: { monthly_gross_income_cents: 250000, income_verification_source: "VERIFIED_WAGE_RECORD" }
              as: CaseWorker
            - call: "PATCH /child-support/participants/${ncpv6}/income"
              payload: { monthly_gross_income_cents: 500000, income_verification_source: "VERIFIED_WAGE_RECORD" }
              as: CaseWorker
            - call: "POST /child-support/orders/${orderv6}/modification-reviews"
              payload: { trigger_type: "PARTY_REQUEST" }
              as: CaseWorker
              captures: { rev2: "$.data.id" }
            - call: "POST /child-support/modification-reviews/${rev2}/screening"
              payload: {}
              as: CaseWorker
              captures: { s4_st: "$.data.status", s4_recalc: "$.data.recalculated_guideline_cents", s4_var: "$.data.variance_numerator_cents", s4_met: "$.data.substantial_change_met" }
            - call: "POST /child-support/modification-reviews/${rev2}/proposed-order"
              payload: { effective_date: "2026-08-01" }
              as: SupervisingAttorney
              captures: { e_notlater: "$.data.error_id" }
            - call: "POST /child-support/modification-reviews/${rev2}/proposed-order"
              payload: { effective_date: "2026-09-01" }
              as: SupervisingAttorney
              captures: { r2_st: "$.data.status", r2_prop: "$.data.proposed_order_id" }
            - call: "GET /child-support/orders/${r2_prop}"
              as: CaseWorker
              captures: { prop_st: "$.data.status", prop_g: "$.data.guideline_monthly_cents", prop_eff: "$.data.effective_date" }
            - call: "POST /child-support/modification-reviews/${rev2}/screening"
              payload: {}
              as: CaseWorker
              captures: { e_revstatus2: "$.data.error_id" }
          assert:
            - "HTTP 409 and ${e_noteligible} == ERR_REVIEW_NOT_YET_ELIGIBLE  # 2026-08-01 is before review_eligible_date 2029-08-01"
            - "${rev1_st} == REQUESTED and ${rev1_snap} == 75000  # PARTY_REQUEST is exempt from the eligibility date"
            - "${cp_src} == SELF_REPORTED  # the PATCH is what makes screening bounce"
            - "${s1_st} == INFO_PENDING and ${s1_cnt} == 1 and ${s1_reason} == CP_INCOME_UNVERIFIED  # no guideline recomputation happens on this path"
            - "${i1_st} == REQUESTED and ${s2_cnt} == 2  # info_request_count survives the round trip and increments only on screening"
            - "${i2_st} == REQUESTED and ${s3_cnt} == 3"
            - "HTTP 409 and ${e_infolimit} == ERR_INFO_REQUEST_LIMIT  # the rule is `count is at or below 2`, so 3 fails even though this payload finally carries VERIFIED_WAGE_RECORD"
            - "HTTP 409 and ${e_revstatus1} == ERR_INVALID_REVIEW_STATUS  # a proposed order requires THRESHOLD_MET, and review 1 is stuck in INFO_PENDING"
            - "${s4_st} == THRESHOLD_MET and ${s4_recalc} == 125006  # combined 750000 is band 2 at 0.25 so basic is 187500; round_half_up_4dp(500000/750000) == 0.6667; round_half_up(187500 * 0.6667) == round_half_up(125006.25) == 125006"
            - "${s4_var} == 50006 and ${s4_met} == true  # 50006 * 10000 >= 1500 * 75000 and 50006 >= 5000, so both gates clear"
            - "HTTP 422 and ${e_notlater} == ERR_MODIFICATION_EFFECTIVE_DATE_NOT_LATER  # 2026-08-01 equals the reviewed order's effective_date and the rule demands strictly later"
            - "${r2_st} == ORDER_PROPOSED"
            - "${prop_st} == CALCULATED and ${prop_g} == 125006 and ${prop_eff} == 2026-09-01  # the successor order is created already calculated, not DRAFT"
            - "HTTP 409 and ${e_revstatus2} == ERR_INVALID_REVIEW_STATUS  # ORDER_PROPOSED accepts no further screening"


      - name: arrears_satisfied_closure_needs_principal_and_interest_at_zero
        claim_type: satisfaction_to_pass
        grounds:
          - "validations[priority 44]"
          - "errors[ERR_ARREARS_OUTSTANDING]"
          - "calculations.arrears_interest_accrual.input_set"
          - "calculations.payment_allocation_waterfall"
          - "calculations.payment_distribution_split"
          - "state_machines.SupportCase.case_status.ENFORCEMENT -> CLOSED"
        distinguishing_aspect: >
          The closure rule has a two-part conjunction and the second part is
          satisfied WITHOUT ever being paid: a 75000 payment clears the arrears
          charge principal and nothing reaches interest bucket 4, yet because
          SATISFIED charges leave the interest input set entirely and retroactively,
          interest_receivable_cents collapses from 375 to 0 on its own and the
          closure that was just refused now succeeds. An implementation that keeps
          interest on satisfied charges, or that treats the 375 as still owed,
          leaves the case permanently uncloseable.
        test_recipe:
          setup:
            - "Empty database. Clock starts at 2026-08-01T00:00:00Z, then advances to 2026-09-20T00:00:00Z."
            - "CP 200000 and NCP 300000 VERIFIED_WAGE_RECORD; ENTERED order, monthly_obligation_cents 75000; case is DIRECT_APPLICATION so tanf_assistance is false."
            - "One ARREARS_JUDGMENT charge of 75000 with period 2026-06-01..2026-07-01 and due_date 2026-08-15."
            - "At 2026-09-20 that charge has been outstanding one whole calendar month, so both interest variants read 375."
          setup_api_calls:
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /child-support/participants"
