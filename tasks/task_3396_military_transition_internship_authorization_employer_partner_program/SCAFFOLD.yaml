# =============================================================================
# SCAFFOLD — Military Transition Internship Authorization & Employer Partner
# Program (SkillBridge-style). Single source of truth for PRD, tests, impl.
# =============================================================================

scenario: |
  Military Transition Internship Authorization & Employer Partner Program
  (SkillBridge): service member eligibility within a window before separation
  with unit commander approval and continued pay from the service, employer
  authorization as a program provider with training plan submission and
  periodic review, internship matching between service member skills and
  employer openings with location and duty constraints, training plan
  execution with defined learning objectives, supervision and no employer wage
  payment during the internship, installation-level approval policies that
  vary across commands with denial and appeal handling, conversion to
  employment after separation with hiring rate measurement, program compliance
  auditing to prevent use as unpaid labor, transition assistance program
  coordination and timeline sequencing

domain_name: military-transition-internship
api_prefix: /skillbridge

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency      # OCC on ServiceMember.version and EmployerOpening.version
    - cascading_side_effects      # audit sanction -> employer revoke -> openings close -> matches void
    - dual_variant_calculation    # hiring rate (cohort vs rolling); training progress (resolution vs mastery)
    - rate_threshold_triggers     # wage-violation threshold suspension; compliance score sanction threshold
  entity_topology: flat           # peer entities joined by FK references; no nested creation paths
  state_machine_shape: parallel   # ServiceMember (service_status x tap_stage) and InternshipMatch (match_status x plan_status) carry parallel dimensions; InternshipApplication and Employer additionally exhibit cyclic loops (appeal cycle, suspend/remediate cycle)
  relationship_patterns:
    - many_to_many                # InternshipMatch is the junction between InternshipApplication (member side) and EmployerOpening (employer side)
    - cross_aggregate             # matches reference Installation policy; audits reference Employer; conversions reference Matches
  role_model: approval_chain      # ServiceMember -> UnitCommander -> InstallationAuthority, with segregation-of-duties on appeal adjudication
  consistency_model: immediate    # every mutation + its cascades are atomic in the request/clock-set call

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Installation
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Installation display name" }
      - { name: command_code, type: string, source: input, description: "Owning command code (e.g. NAVSW, ACC); identifies which command's policy applies" }
      - { name: region_code, type: string, source: input, description: "Geographic region code used for ON_SITE opening duty constraints" }
      - { name: max_internship_duration_days, type: integer, source: input, description: "Command policy: maximum allowed internship duration in days; varies across commands; must be >= 1" }
      - { name: appeal_window_days, type: integer, source: input, description: "Command policy: days after a denial during which an appeal may be filed; must be >= 1" }
      - { name: requires_tap_complete, type: boolean, source: input, description: "Command policy: when true, commander approval requires member tap_stage == CAPSTONE_DONE" }
      - { name: excluded_pay_grades, type: array, source: input, default: [], description: "Command policy: pay grades barred from the program at this installation (e.g. [\"E1\",\"E2\"])" }

  - name: ServiceMember
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Member legal name" }
      - { name: service_branch, type: enum, source: input, description: "ARMY | NAVY | AIR_FORCE | MARINES | SPACE_FORCE | COAST_GUARD" }
      - { name: pay_grade, type: string, source: input, description: "Pay grade string, e.g. E5, O3" }
      - { name: separation_date, type: datetime, source: input, description: "Scheduled separation date (date precision, UTC). Eligibility window and match end bound derive from it" }
      - { name: skills, type: array, source: input, description: "List of skill codes (strings) the member holds" }
      - { name: home_installation_id, type: string, source: input, description: "FK -> Installation.id; the installation whose policies govern this member" }
      - { name: service_status, type: enum, source: system, default: ACTIVE_DUTY, description: "ACTIVE_DUTY | SEPARATED. System flips to SEPARATED when logical clock date >= separation_date" }
      - { name: tap_stage, type: enum, source: system, default: TAP_NOT_STARTED, description: "TAP_NOT_STARTED | PRESEPARATION_COUNSELING_DONE | CORE_CURRICULUM_DONE | CAPSTONE_DONE. Advances one stage per tap-advance call, strictly in order" }
      - { name: active_match_count, type: integer, source: computed, default: 0, description: "= COUNT(InternshipMatch m WHERE m.service_member_id == this.id AND m.match_status IN {PROPOSED, INSTALLATION_APPROVED, ACTIVE}). Recomputed on every match create/terminate/void/complete affecting this member" }
      - { name: days_until_separation, type: integer, source: computed, description: "= (separation_date - current logical clock date) in whole days; negative once separated" }

  - name: InternshipApplication
    parent: null
    common_fields: true
    fields:
      - { name: service_member_id, type: string, source: input, description: "FK -> ServiceMember.id; applicant" }
      - { name: installation_id, type: string, source: system, description: "FK -> Installation.id; copied from ServiceMember.home_installation_id at submission; governs appeal window and TAP gate" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | DENIED | UNDER_APPEAL. DENIED is live while appeal_count < MAX_APPEALS_PER_APPLICATION (2) and de facto terminal once appeals are exhausted" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp at submission" }
      - { name: days_until_separation_at_submission, type: integer, source: system, description: "Snapshot of member days_until_separation at submission time (audit trail)" }
      - { name: decided_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the commander (or appeal adjudicator) who most recently decided" }
      - { name: decision_reason, type: string, source: system, default: null, description: "Reason recorded with the most recent decision; mandatory on DENY" }
      - { name: decided_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of the most recent decision" }
      - { name: appeal_count, type: integer, source: system, default: 0, description: "Number of appeals filed; incremented on each appeal" }
      - { name: appeal_deadline, type: datetime, source: computed, default: null, description: "= decided_at + Installation.appeal_window_days (days); null until first denial" }

  - name: Employer
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Employer legal name" }
      - { name: industry_code, type: string, source: input, description: "Industry classification code" }
      - { name: authorization_status, type: enum, source: system, description: "PENDING_AUTHORIZATION | AUTHORIZED | SUSPENDED | AUTHORIZATION_LAPSED | REVOKED" }
      - { name: authorized_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of most recent transition into AUTHORIZED" }
      - { name: next_review_due_date, type: datetime, source: system, default: null, description: "= authorized_at + REVIEW_INTERVAL_DAYS (180) at each (re-)authorization or passed review; clock strictly past this date auto-lapses the employer" }
      - { name: pending_violations, type: integer, source: system, default: 0, description: "Wage-violation ledger: incremented by violating WageRecords, reset to 0 by a CLOSED_CLEARED audit" }
      - { name: last_cleared_audit_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of the most recent CLOSED_CLEARED audit; violation ledger counts records after this instant" }
      - { name: last_compliance_score, type: number, source: system, default: null, description: "Compliance score computed at the most recent audit close (2 decimal places)" }

  - name: EmployerOpening
    parent: null
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: input, description: "FK -> Employer.id; owning employer" }
      - { name: title, type: string, source: input, description: "Opening title" }
      - { name: required_skills, type: array, source: input, description: "Skill codes a member must fully hold (subset check)" }
      - { name: location_type, type: enum, source: input, description: "ON_SITE | REMOTE. ON_SITE requires region_code and restricts matching to members whose home installation shares the region" }
      - { name: region_code, type: string, source: input, default: null, description: "Required when location_type == ON_SITE; forbidden-null otherwise acceptable" }
      - { name: capacity, type: integer, source: input, description: "Maximum number of concurrently-overlapping non-terminal matches on this opening; must be >= 1" }
      - { name: filled_count, type: integer, source: computed, default: 0, description: "= COUNT(InternshipMatch m WHERE m.employer_opening_id == this.id AND m.match_status IN {PROPOSED, INSTALLATION_APPROVED, ACTIVE}). Informational slot ledger; recomputed on every match create/terminate/void/complete on this opening" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED. CLOSED only via employer revocation cascade" }

  - name: InternshipMatch
    parent: null
    common_fields: true
    fields:
      - { name: internship_application_id, type: string, source: input, description: "FK -> InternshipApplication.id; the approved application being matched" }
      - { name: employer_opening_id, type: string, source: input, description: "FK -> EmployerOpening.id; the opening being filled" }
      - { name: service_member_id, type: string, source: system, description: "FK -> ServiceMember.id; denormalized copy of application.service_member_id" }
      - { name: employer_id, type: string, source: system, description: "FK -> Employer.id; denormalized copy of opening.employer_id" }
      - { name: installation_id, type: string, source: system, description: "FK -> Installation.id; denormalized copy of member home installation; its max_internship_duration_days gates the duration" }
      - { name: start_date, type: datetime, source: input, description: "Internship start date (date precision, UTC)" }
      - { name: end_date, type: datetime, source: input, description: "Internship end date (exclusive bound for overlap; duration = end_date - start_date in days)" }
      - { name: match_status, type: enum, source: system, description: "PROPOSED | INSTALLATION_APPROVED | INSTALLATION_DENIED | ACTIVE | COMPLETED | TERMINATED_EARLY | MATCH_VOIDED" }
      - { name: plan_status, type: enum, source: system, description: "PLAN_DRAFT | PLAN_SUBMITTED | PLAN_APPROVED | PLAN_RETURNED. Parallel dimension of the same row" }
      - { name: learning_objectives, type: array, source: input, default: [], description: "Array of { objective_code, description, weight_hours, status }. objective_code unique within the plan; weight_hours integer > 0; status PENDING | ACHIEVED | EXCUSED (system-mutated by supervision reports). Written by submit-plan" }
      - { name: supervisor_name, type: string, source: input, default: null, description: "Named worksite supervisor on the training plan" }
      - { name: weekly_hours, type: integer, source: input, default: null, description: "Scheduled weekly internship hours; >= 1" }
      - { name: plan_revision_count, type: integer, source: system, default: 0, description: "Incremented each time review-plan returns the plan (PLAN_SUBMITTED -> PLAN_RETURNED)" }
      - { name: flagged_wage_violation, type: boolean, source: system, default: false, description: "Set true when any WageRecord with amount_cents > 0 is posted while this match is ACTIVE" }
      - { name: resolution_ratio, type: number, source: computed, default: 1.0, description: "= COUNT(objectives with status IN {ACHIEVED, EXCUSED}) / COUNT(objectives); 1.0 when no objectives; 2 decimal places round_half_up" }
      - { name: mastery_ratio, type: number, source: computed, default: 1.0, description: "= SUM(weight_hours of ACHIEVED objectives) / SUM(weight_hours of all objectives); 1.0 when no objectives; 2 decimal places round_half_up" }
      - { name: completed_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of completion" }
      - { name: termination_reason, type: enum, source: system, default: null, description: "VOLUNTARY | MEDICAL | EMPLOYER_REQUEST | CONDUCT | SEPARATION | EMPLOYER_REVOKED" }
      - { name: installation_decision_by, type: string, source: system, default: null, description: "X-User-ID of the InstallationAuthority who decided the match" }
      - { name: installation_decision_reason, type: string, source: system, default: null, description: "Reason recorded with the installation decision" }

  - name: SupervisionReport
    parent: null
    common_fields: false
    fields:
      - { name: internship_match_id, type: string, source: input, description: "FK -> InternshipMatch.id; match being supervised" }
      - { name: week_start_date, type: datetime, source: input, description: "Monday (or week anchor) of the supervised week; must lie within [match.start_date, match.end_date]; unique per match" }
      - { name: hours_supervised, type: integer, source: input, description: "Supervised hours this week; >= 0" }
      - { name: objectives_achieved, type: array, source: input, default: [], description: "Objective codes (from the match's approved plan) marked ACHIEVED by this report" }
      - { name: objectives_excused, type: array, source: input, default: [], description: "Objective codes marked EXCUSED by this report" }
      - { name: supervisor_name, type: string, source: input, description: "Attesting supervisor" }
      - { name: attestation_text, type: string, source: input, description: "Free-text supervision attestation" }

  - name: WageRecord
    parent: null
    common_fields: false
    fields:
      - { name: internship_match_id, type: string, source: input, description: "FK -> InternshipMatch.id; match the payment period refers to" }
      - { name: period_start_date, type: datetime, source: input, description: "Pay period start; must lie within [match.start_date, match.end_date]" }
      - { name: period_end_date, type: datetime, source: input, description: "Pay period end; must be >= period_start_date and within [match.start_date, match.end_date]" }
      - { name: amount_cents, type: integer, source: input, description: "Employer-paid amount in cents; >= 0. Any value > 0 during an ACTIVE internship is a compliance violation (the service continues member pay)" }
      - { name: memo, type: string, source: input, default: null, description: "Optional memo" }
      - { name: is_violation, type: boolean, source: computed, description: "= (amount_cents > 0). Drives the wage-violation cascade" }

  - name: ComplianceAudit
    parent: null
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: input, description: "FK -> Employer.id; employer under audit" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED_CLEARED | CLOSED_SANCTIONED" }
      - { name: opened_at, type: datetime, source: system, description: "Logical-clock timestamp the audit was opened" }
      - { name: findings, type: array, source: input, default: [], description: "Array of { finding_code, severity, note } supplied at close. finding_code IN {WAGE_PAYMENT_DETECTED, SUPERVISION_MISSING, OBJECTIVE_MISMATCH, TRAINING_PLAN_ABSENT}; severity IN {MINOR, MAJOR, CRITICAL}" }
      - { name: compliance_score, type: number, source: computed, default: null, description: "Computed at close per calculations.compliance_score; 2 decimal places" }
      - { name: closed_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of close" }

  - name: ConversionRecord
    parent: null
    common_fields: false
    fields:
      - { name: internship_match_id, type: string, source: input, description: "FK -> InternshipMatch.id; the completed match converting to employment" }
      - { name: conversion_date, type: datetime, source: input, description: "Date the employment conversion took effect; must be >= member separation_date and <= separation_date + CONVERSION_WINDOW_DAYS (90)" }
      - { name: offer_made, type: boolean, source: input, description: "Whether the employer extended an offer" }
      - { name: offer_accepted, type: boolean, source: input, description: "Whether the member accepted; true requires offer_made == true" }
      - { name: hired, type: boolean, source: computed, description: "= (offer_made AND offer_accepted). Counted as a conversion in hiring-rate" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ServiceMember
    initial_state: "service_status=ACTIVE_DUTY, tap_stage=TAP_NOT_STARTED (parallel dimensions)"
    terminal_states: ["service_status=SEPARATED (dimension)", "tap_stage=CAPSTONE_DONE (dimension)"]
    transitions:
      - from: "service_status=ACTIVE_DUTY"
        to: "service_status=SEPARATED"
        trigger: "system (POST /skillbridge/_clock/set_current_utc sweep: logical clock date >= separation_date)"
        actor: system
        preconditions:
          - "member.service_status == ACTIVE_DUTY"
        side_effects:
          - "Each InternshipMatch m with m.service_member_id == member.id AND m.match_status IN {PROPOSED, INSTALLATION_APPROVED} -> MATCH_VOIDED; the affected EmployerOpening.filled_count is recomputed"
          - "Each InternshipMatch m with m.service_member_id == member.id AND m.match_status == ACTIVE -> TERMINATED_EARLY with termination_reason = SEPARATION; opening filled_count recomputed"
          - "member.active_match_count recomputed (becomes 0 unless a COMPLETED... no: COMPLETED is terminal and never counted; becomes 0)"
        note: "Sweep order within a clock-set call: (1) employer lapse sweep, (2) member separation sweep, (3) match auto-start sweep; within each sweep entities process in created_at ASC order (never id)"
      - from: "tap_stage=TAP_NOT_STARTED"
        to: "tap_stage=PRESEPARATION_COUNSELING_DONE"
        trigger: "POST /skillbridge/service-members/{id}/tap-advance with target_stage=PRESEPARATION_COUNSELING_DONE"
        actor: TransitionCounselor
        preconditions:
          - "member.service_status == ACTIVE_DUTY (ERR_MEMBER_NOT_ON_ACTIVE_DUTY)"
          - "target_stage is exactly the next stage in TAP order (ERR_TAP_SEQUENCE_VIOLATION otherwise)"
        side_effects: []
      - from: "tap_stage=PRESEPARATION_COUNSELING_DONE"
        to: "tap_stage=CORE_CURRICULUM_DONE"
        trigger: "POST /skillbridge/service-members/{id}/tap-advance with target_stage=CORE_CURRICULUM_DONE"
        actor: TransitionCounselor
        preconditions:
          - "member.service_status == ACTIVE_DUTY (ERR_MEMBER_NOT_ON_ACTIVE_DUTY)"
          - "target_stage is exactly the next stage in TAP order (ERR_TAP_SEQUENCE_VIOLATION otherwise)"
        side_effects: []
      - from: "tap_stage=CORE_CURRICULUM_DONE"
        to: "tap_stage=CAPSTONE_DONE"
        trigger: "POST /skillbridge/service-members/{id}/tap-advance with target_stage=CAPSTONE_DONE"
        actor: TransitionCounselor
        preconditions:
          - "member.service_status == ACTIVE_DUTY (ERR_MEMBER_NOT_ON_ACTIVE_DUTY)"
          - "target_stage is exactly the next stage in TAP order (ERR_TAP_SEQUENCE_VIOLATION otherwise)"
        side_effects: []
        note: "TAP sequencing is one-directional; there is no regression transition"

  - entity: InternshipApplication
    initial_state: SUBMITTED
    terminal_states: [APPROVED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /skillbridge/internship-applications/{id}/commander-decision with decision=APPROVE"
        actor: UnitCommander
        preconditions:
          - "application.status == SUBMITTED (ERR_APPLICATION_NOT_SUBMITTED)"
          - "conditional TAP gate: if Installation(application.installation_id).requires_tap_complete == true then member.tap_stage must == CAPSTONE_DONE (ERR_TAP_INCOMPLETE)"
        side_effects:
          - "decided_by_user_id = X-User-ID; decided_at = logical clock; decision_reason = request reason (optional on APPROVE)"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /skillbridge/internship-applications/{id}/commander-decision with decision=DENY (reason mandatory: ERR_VALIDATION when absent)"
        actor: UnitCommander
        preconditions:
          - "application.status == SUBMITTED (ERR_APPLICATION_NOT_SUBMITTED)"
          - "conditional TAP gate applies identically to both decision outcomes: if installation.requires_tap_complete == true then member.tap_stage must == CAPSTONE_DONE (ERR_TAP_INCOMPLETE)"
        side_effects:
          - "decided_by_user_id = X-User-ID; decided_at = logical clock; decision_reason = request reason"
          - "appeal_deadline = decided_at + Installation.appeal_window_days days"
      - from: DENIED
        to: UNDER_APPEAL
        trigger: "POST /skillbridge/internship-applications/{id}/appeal"
        actor: ServiceMember
        preconditions:
          - "application.status == DENIED (ERR_APPLICATION_NOT_DENIED)"
          - "logical clock <= application.appeal_deadline (ERR_APPEAL_WINDOW_EXPIRED)"
          - "application.appeal_count < MAX_APPEALS_PER_APPLICATION (2) (ERR_MAX_APPEALS_REACHED)"
          - "ownership: X-User-ID == application.service_member_id (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects:
          - "appeal_count += 1"
      - from: UNDER_APPEAL
        to: APPROVED
        trigger: "POST /skillbridge/internship-applications/{id}/adjudicate-appeal with outcome=OVERTURNED"
        actor: InstallationAuthority
        preconditions:
          - "application.status == UNDER_APPEAL (ERR_NO_PENDING_APPEAL)"
          - "segregation of duties: adjudicator X-User-ID != application.decided_by_user_id (ERR_APPEAL_ADJUDICATOR_CONFLICT)"
        side_effects:
          - "decided_by_user_id = adjudicator X-User-ID; decided_at = logical clock; decision_reason = request reason"
      - from: UNDER_APPEAL
        to: DENIED
        trigger: "POST /skillbridge/internship-applications/{id}/adjudicate-appeal with outcome=UPHELD"
        actor: InstallationAuthority
        preconditions:
          - "application.status == UNDER_APPEAL (ERR_NO_PENDING_APPEAL)"
          - "segregation of duties: adjudicator X-User-ID != application.decided_by_user_id (ERR_APPEAL_ADJUDICATOR_CONFLICT)"
        side_effects:
          - "decided_by_user_id = adjudicator X-User-ID; decided_at = logical clock; decision_reason = request reason"
          - "appeal_deadline recomputed = decided_at + Installation.appeal_window_days days"
        note: "This is the cycle edge: DENIED -> UNDER_APPEAL -> DENIED may repeat while appeals remain; the appeal endpoint itself enforces appeal_count < MAX_APPEALS_PER_APPLICATION (2) with ERR_MAX_APPEALS_REACHED, so a DENIED application with an exhausted appeal budget is de facto terminal"

  - entity: Employer
    initial_state: PENDING_AUTHORIZATION
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING_AUTHORIZATION
        to: AUTHORIZED
        trigger: "POST /skillbridge/employers/{id}/authorize"
        actor: ProgramOffice
        preconditions:
          - "employer.authorization_status == PENDING_AUTHORIZATION (ERR_EMPLOYER_NOT_PENDING_AUTHORIZATION)"
        side_effects:
          - "authorized_at = logical clock"
          - "next_review_due_date = logical clock date + REVIEW_INTERVAL_DAYS (180)"
      - from: AUTHORIZED
        to: AUTHORIZED
        trigger: "POST /skillbridge/employers/{id}/periodic-review with outcome=PASS"
        actor: ProgramOffice
        preconditions:
          - "employer.authorization_status IN {AUTHORIZED, SUSPENDED, AUTHORIZATION_LAPSED} (ERR_EMPLOYER_NOT_AUTHORIZED otherwise — covers PENDING_AUTHORIZATION and REVOKED)"
        side_effects:
          - "authorized_at = logical clock; next_review_due_date = logical clock date + REVIEW_INTERVAL_DAYS (180)"
        note: "Self-loop: a passed review on an AUTHORIZED employer refreshes the review horizon"
      - from: AUTHORIZATION_LAPSED
        to: AUTHORIZED
        trigger: "POST /skillbridge/employers/{id}/periodic-review with outcome=PASS"
        actor: ProgramOffice
        preconditions:
          - "employer.authorization_status IN {AUTHORIZED, SUSPENDED, AUTHORIZATION_LAPSED} (ERR_EMPLOYER_NOT_AUTHORIZED)"
        side_effects:
          - "authorized_at = logical clock; next_review_due_date = logical clock date + REVIEW_INTERVAL_DAYS (180)"
      - from: SUSPENDED
        to: AUTHORIZED
        trigger: "POST /skillbridge/employers/{id}/periodic-review with outcome=PASS"
        actor: ProgramOffice
        preconditions:
          - "employer.authorization_status IN {AUTHORIZED, SUSPENDED, AUTHORIZATION_LAPSED} (ERR_EMPLOYER_NOT_AUTHORIZED)"
        side_effects:
          - "authorized_at = logical clock; next_review_due_date = logical clock date + REVIEW_INTERVAL_DAYS (180)"
        note: "Remediation edge of the AUTHORIZED -> SUSPENDED -> AUTHORIZED cycle. A passed review does NOT reset pending_violations (only a CLOSED_CLEARED audit does)"
      - from: AUTHORIZED
        to: SUSPENDED
        trigger: "POST /skillbridge/employers/{id}/periodic-review with outcome=FAIL, or system (wage-violation threshold: a new violating WageRecord raises pending_violations to >= WAGE_VIOLATION_SUSPEND_THRESHOLD (2))"
        actor: ProgramOffice | system
        preconditions:
          - "employer.authorization_status IN {AUTHORIZED, AUTHORIZATION_LAPSED} for the review path (ERR_EMPLOYER_NOT_AUTHORIZED)"
        side_effects: []
      - from: AUTHORIZATION_LAPSED
        to: SUSPENDED
        trigger: "POST /skillbridge/employers/{id}/periodic-review with outcome=FAIL"
        actor: ProgramOffice
        preconditions:
          - "employer.authorization_status IN {AUTHORIZED, AUTHORIZATION_LAPSED} (ERR_EMPLOYER_NOT_AUTHORIZED)"
        side_effects: []
      - from: AUTHORIZED
        to: AUTHORIZATION_LAPSED
        trigger: "system (POST /skillbridge/_clock/set_current_utc sweep: logical clock date strictly > next_review_due_date)"
        actor: system
        preconditions:
          - "employer.authorization_status == AUTHORIZED AND next_review_due_date is not null AND logical clock date > next_review_due_date"
        side_effects: []
        note: "Boundary: clock date == next_review_due_date keeps AUTHORIZED (strictly-greater comparison)"
      - from: AUTHORIZED
        to: REVOKED
        trigger: "system (ComplianceAudit close computes compliance_score < SANCTION_SCORE_THRESHOLD (70))"
        actor: system
        preconditions:
          - "employer.authorization_status != REVOKED"
        side_effects:
          - "cascade link 2: every EmployerOpening of this employer with status == OPEN -> CLOSED"
          - "cascade link 3: every InternshipMatch with employer_id == this.id and match_status IN {PROPOSED, INSTALLATION_APPROVED} -> MATCH_VOIDED; every such match with match_status == ACTIVE -> TERMINATED_EARLY with termination_reason = EMPLOYER_REVOKED"
          - "cascade link 3 continued: EmployerOpening.filled_count recomputed for every opening whose matches changed; ServiceMember.active_match_count recomputed for every affected member"
      - from: SUSPENDED
        to: REVOKED
        trigger: "system (ComplianceAudit close computes compliance_score < SANCTION_SCORE_THRESHOLD (70))"
        actor: system
        preconditions:
          - "employer.authorization_status != REVOKED"
        side_effects:
          - "same cascade as AUTHORIZED -> REVOKED"
      - from: AUTHORIZATION_LAPSED
        to: REVOKED
        trigger: "system (ComplianceAudit close computes compliance_score < SANCTION_SCORE_THRESHOLD (70))"
        actor: system
        preconditions:
          - "employer.authorization_status != REVOKED"
        side_effects:
          - "same cascade as AUTHORIZED -> REVOKED"

  - entity: EmployerOpening
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /skillbridge/employer-openings/{id}/close (employer withdraws the opening)"
        actor: EmployerRep
        preconditions:
          - "opening.status == OPEN (ERR_OPENING_NOT_OPEN on double-close)"
          - "ownership: X-User-ID == opening.employer_id (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects:
          - "every InternshipMatch on this opening with match_status IN {PROPOSED, INSTALLATION_APPROVED} -> MATCH_VOIDED (ACTIVE matches are in-flight and unaffected)"
          - "filled_count recomputed; ServiceMember.active_match_count recomputed for every affected member"
      - from: OPEN
        to: CLOSED
        trigger: "system (employer revocation cascade)"
        actor: system
        preconditions:
          - "opening.status == OPEN AND owning employer transitions to REVOKED"
        side_effects:
          - "InternshipMatches referencing this opening are voided/terminated by the employer cascade (see Employer -> REVOKED)"
          - "filled_count recomputed (drops to 0 as matches become terminal)"

  - entity: InternshipMatch
    initial_state: "match_status=PROPOSED, plan_status=PLAN_DRAFT (parallel dimensions on one row)"
    terminal_states: ["match_status IN {INSTALLATION_DENIED, COMPLETED, TERMINATED_EARLY, MATCH_VOIDED}"]
    transitions:
      - from: "plan_status=PLAN_DRAFT"
        to: "plan_status=PLAN_SUBMITTED"
        trigger: "POST /skillbridge/internship-matches/{id}/submit-plan"
        actor: EmployerRep
        preconditions:
          - "match.match_status == PROPOSED (ERR_MATCH_NOT_PROPOSED) — plan is locked once the installation decides"
          - "learning_objectives non-empty; each objective_code unique within the plan; each weight_hours integer > 0; weekly_hours >= 1 (ERR_VALIDATION)"
          - "ownership: X-User-ID == match.employer_id (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects:
          - "learning_objectives, supervisor_name, weekly_hours overwritten with the submission; all objective statuses reset to PENDING"
      - from: "plan_status=PLAN_RETURNED"
        to: "plan_status=PLAN_SUBMITTED"
        trigger: "POST /skillbridge/internship-matches/{id}/submit-plan"
        actor: EmployerRep
        preconditions:
          - "match.match_status == PROPOSED (ERR_MATCH_NOT_PROPOSED)"
          - "plan_revision_count < MAX_PLAN_REVISIONS (3) (ERR_MAX_PLAN_REVISIONS_REACHED)"
          - "same payload validation as PLAN_DRAFT -> PLAN_SUBMITTED (ERR_VALIDATION)"
          - "ownership: X-User-ID == match.employer_id (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects:
          - "learning_objectives, supervisor_name, weekly_hours overwritten; objective statuses reset to PENDING"
        note: "This is the revision cycle edge: PLAN_SUBMITTED -> PLAN_RETURNED -> PLAN_SUBMITTED may repeat up to 3 returns"
      - from: "plan_status=PLAN_SUBMITTED"
        to: "plan_status=PLAN_APPROVED"
        trigger: "POST /skillbridge/internship-matches/{id}/review-plan with outcome=APPROVE"
        actor: InstallationAuthority
        preconditions:
          - "match.plan_status == PLAN_SUBMITTED (ERR_PLAN_NOT_SUBMITTED)"
        side_effects: []
      - from: "plan_status=PLAN_SUBMITTED"
        to: "plan_status=PLAN_RETURNED"
        trigger: "POST /skillbridge/internship-matches/{id}/review-plan with outcome=RETURN"
        actor: InstallationAuthority
        preconditions:
          - "match.plan_status == PLAN_SUBMITTED (ERR_PLAN_NOT_SUBMITTED)"
        side_effects:
          - "plan_revision_count += 1"
      - from: "match_status=PROPOSED"
        to: "match_status=INSTALLATION_APPROVED"
        trigger: "POST /skillbridge/internship-matches/{id}/installation-decision with decision=APPROVE"
        actor: InstallationAuthority
        preconditions:
          - "match.match_status == PROPOSED (ERR_MATCH_NOT_PROPOSED)"
          - "match.plan_status == PLAN_APPROVED (ERR_PLAN_NOT_APPROVED) — cross-dimension gate on the same row"
          - "Employer(match.employer_id).authorization_status == AUTHORIZED (ERR_EMPLOYER_NOT_AUTHORIZED)"
          - "ServiceMember(match.service_member_id).service_status == ACTIVE_DUTY (ERR_MEMBER_NOT_ON_ACTIVE_DUTY)"
        side_effects:
          - "installation_decision_by = X-User-ID; installation_decision_reason = request reason"
      - from: "match_status=PROPOSED"
        to: "match_status=INSTALLATION_DENIED"
        trigger: "POST /skillbridge/internship-matches/{id}/installation-decision with decision=DENY (reason mandatory: ERR_VALIDATION when absent)"
        actor: InstallationAuthority
        preconditions:
          - "match.match_status == PROPOSED (ERR_MATCH_NOT_PROPOSED)"
          - "Employer(match.employer_id).authorization_status == AUTHORIZED (ERR_EMPLOYER_NOT_AUTHORIZED)"
        side_effects:
          - "installation_decision_by = X-User-ID; installation_decision_reason = request reason"
          - "EmployerOpening.filled_count and ServiceMember.active_match_count recomputed (slot released)"
        note: "DENY does not require PLAN_APPROVED — an installation may deny a training-free proposal"
      - from: "match_status=INSTALLATION_APPROVED"
        to: "match_status=ACTIVE"
        trigger: "system (POST /skillbridge/_clock/set_current_utc sweep: logical clock date >= start_date AND member still ACTIVE_DUTY)"
        actor: system
        preconditions:
          - "match.match_status == INSTALLATION_APPROVED"
          - "logical clock date >= match.start_date"
          - "ServiceMember(match.service_member_id).service_status == ACTIVE_DUTY (members whose separation fired in the same clock sweep instead void the match — the member separation sweep runs before the match auto-start sweep)"
        side_effects: []
      - from: "match_status=ACTIVE"
        to: "match_status=COMPLETED"
        trigger: "POST /skillbridge/internship-matches/{id}/complete"
        actor: InstallationAuthority
        preconditions:
          - "match.match_status == ACTIVE (ERR_MATCH_NOT_ACTIVE)"
          - "logical clock date >= match.end_date (ERR_COMPLETION_DATE_NOT_REACHED)"
          - "every learning objective has status IN {ACHIEVED, EXCUSED}, i.e. resolution_ratio == 1.00 (ERR_OBJECTIVES_INCOMPLETE)"
          - "supervision coverage: COUNT(SupervisionReport for this match) >= FLOOR(duration_days / SUPERVISION_CADENCE_DAYS (7)) (ERR_INSUFFICIENT_SUPERVISION)"
          - "mastery_ratio >= MIN_MASTERY_RATIO (0.75) (ERR_MASTERY_BELOW_THRESHOLD)"
        side_effects:
          - "completed_at = logical clock"
          - "EmployerOpening.filled_count and ServiceMember.active_match_count recomputed (slot released)"
      - from: "match_status=PROPOSED"
        to: "match_status=TERMINATED_EARLY"
        trigger: "POST /skillbridge/internship-matches/{id}/terminate"
        actor: EmployerRep | InstallationAuthority
        preconditions:
          - "match.match_status IN {PROPOSED, INSTALLATION_APPROVED, ACTIVE} (a terminal match — INSTALLATION_DENIED, COMPLETED, TERMINATED_EARLY, MATCH_VOIDED — yields ERR_MATCH_NOT_TERMINABLE)"
        side_effects:
          - "termination_reason = request reason (VOLUNTARY | MEDICAL | EMPLOYER_REQUEST | CONDUCT)"
          - "EmployerOpening.filled_count and ServiceMember.active_match_count recomputed"
        note: "EmployerRep caller additionally requires ownership X-User-ID == match.employer_id (ERR_FORBIDDEN_OWNERSHIP); InstallationAuthority is exempt"
      - from: "match_status=INSTALLATION_APPROVED"
        to: "match_status=TERMINATED_EARLY"
        trigger: "POST /skillbridge/internship-matches/{id}/terminate"
        actor: EmployerRep | InstallationAuthority
        preconditions:
          - "match.match_status IN {PROPOSED, INSTALLATION_APPROVED, ACTIVE} (ERR_MATCH_NOT_TERMINABLE)"
        side_effects:
          - "termination_reason = request reason; filled_count and active_match_count recomputed"
      - from: "match_status=ACTIVE"
        to: "match_status=TERMINATED_EARLY"
        trigger: "POST /skillbridge/internship-matches/{id}/terminate"
        actor: EmployerRep | InstallationAuthority
        preconditions:
          - "match.match_status IN {PROPOSED, INSTALLATION_APPROVED, ACTIVE} (ERR_MATCH_NOT_TERMINABLE)"
        side_effects:
          - "termination_reason = request reason; filled_count and active_match_count recomputed"
      - from: "match_status=PROPOSED"
        to: "match_status=MATCH_VOIDED"
        trigger: "system (member separation sweep, or employer revocation cascade)"
        actor: system
        preconditions:
          - "match.match_status IN {PROPOSED, INSTALLATION_APPROVED} AND (member became SEPARATED or employer became REVOKED)"
        side_effects:
          - "EmployerOpening.filled_count and ServiceMember.active_match_count recomputed"
      - from: "match_status=INSTALLATION_APPROVED"
        to: "match_status=MATCH_VOIDED"
        trigger: "system (member separation sweep, or employer revocation cascade)"
        actor: system
        preconditions:
          - "match.match_status IN {PROPOSED, INSTALLATION_APPROVED} AND (member became SEPARATED or employer became REVOKED)"
        side_effects:
          - "EmployerOpening.filled_count and ServiceMember.active_match_count recomputed"

  - entity: ComplianceAudit
    initial_state: OPEN
    terminal_states: [CLOSED_CLEARED, CLOSED_SANCTIONED]
    transitions:
      - from: OPEN
        to: CLOSED_CLEARED
        trigger: "POST /skillbridge/compliance-audits/{id}/close when compliance_score >= SANCTION_SCORE_THRESHOLD (70)"
        actor: ProgramOffice
        preconditions:
          - "audit.status == OPEN (ERR_AUDIT_ALREADY_CLOSED)"
        side_effects:
          - "compliance_score computed per calculations.compliance_score from the close payload's findings"
          - "closed_at = logical clock"
          - "cascade link: Employer.pending_violations = 0; Employer.last_cleared_audit_at = logical clock; Employer.last_compliance_score = computed score"
      - from: OPEN
        to: CLOSED_SANCTIONED
        trigger: "POST /skillbridge/compliance-audits/{id}/close when compliance_score < SANCTION_SCORE_THRESHOLD (70)"
        actor: ProgramOffice
        preconditions:
          - "audit.status == OPEN (ERR_AUDIT_ALREADY_CLOSED)"
        side_effects:
          - "compliance_score computed; closed_at = logical clock; Employer.last_compliance_score = computed score"
          - "cascade link 1: Employer -> REVOKED (see Employer state machine for links 2-3)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only; everything else is a state precondition)
# =============================================================================
concurrency_rules:
  - rule_id: match-create-stale-opening
    parent_entity: EmployerOpening
    write_endpoint: "POST /skillbridge/internship-matches"
    occ_field: expected_employer_opening_version
    description: |
      Creating an InternshipMatch against an EmployerOpening whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another match was created against (or another state change
      touched) the same opening after the client read it, so the client's view
      of remaining capacity is stale. The client must re-read the opening and
      retry with the fresh version.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: member-update-stale-version
    parent_entity: ServiceMember
    write_endpoint: "PATCH /skillbridge/service-members/{id}"
    occ_field: expected_service_member_version
    description: |
      Updating a ServiceMember (separation_date, skills, pay_grade) with an
      expected_service_member_version that no longer matches the member's
      current version is rejected. A separation_date edit in particular must
      never apply on top of a member record the caller has not re-read, because
      the edit re-validates every non-terminal match against the new window.
    error_id: ERR_STALE_VERSION
    http_status: 412
# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: eligibility_window
    trigger: "POST /skillbridge/internship-applications (submission time)"
    algorithm: threshold
    formula: |
      days_until_separation = (member.separation_date - logical_clock_date).days
      eligible  <=>  ELIGIBILITY_WINDOW_MIN_DAYS <= days_until_separation <= ELIGIBILITY_WINDOW_MAX_DAYS
      Both bounds INCLUSIVE: exactly 30 days and exactly 180 days are eligible;
      29 or 181 days are rejected with ERR_OUTSIDE_ELIGIBILITY_WINDOW.
    input_set: "the applying ServiceMember (must also be service_status == ACTIVE_DUTY)"
    constants:
      ELIGIBILITY_WINDOW_MIN_DAYS: 30
      ELIGIBILITY_WINDOW_MAX_DAYS: 180
    precision: "whole days; date-precision comparison against the logical clock"

  - name: match_duration_gate
    trigger: "POST /skillbridge/internship-matches (creation time)"
    algorithm: threshold
    formula: |
      duration_days = (end_date - start_date).days                     # end exclusive
      separation_headroom_days = (member.separation_date - start_date).days - SEPARATION_BUFFER_DAYS
      policy_cap_days = Installation(member.home_installation_id).max_internship_duration_days
      effective_max_days = min(policy_cap_days, separation_headroom_days)
      Reject ERR_START_DATE_IN_PAST     if start_date < logical_clock_date
      Reject ERR_DURATION_BELOW_MINIMUM if duration_days < MIN_INTERNSHIP_DURATION_DAYS
      Reject ERR_DURATION_EXCEEDS_POLICY if duration_days > effective_max_days
      Evaluation order is pinned exactly as written: past-start, then minimum,
      then the nested-min maximum. The nested min combines three inputs
      (requested duration, per-command policy cap, separation headroom) and the
      result differs by which input binds — this is the combinatorial core.
    input_set: "the candidate InternshipMatch dates, the applicant ServiceMember, the member's home Installation"
    constants:
      SEPARATION_BUFFER_DAYS: 7
      MIN_INTERNSHIP_DURATION_DAYS: 30
    precision: "whole days; both bounds of the duration gate inclusive (duration_days == effective_max_days passes)"

  - name: employer_hiring_rate
    trigger: "GET /skillbridge/employers/{id}/hiring-rate"
    algorithm: aggregation
    formula: |
      Base set: InternshipMatch m with m.employer_id == employer.id AND m.match_status == COMPLETED.
      variant == COHORT:
        window = [cohort_start_date, cohort_end_date]  (both bounds inclusive, from query params)
        completions = COUNT(base set whose member's separation_date IN window)
      variant == ROLLING:
        window = [logical_clock_date - ROLLING_HIRING_WINDOW_DAYS, logical_clock_date]  (inclusive)
        completions = COUNT(base set whose completed_at date IN window)
      conversions = COUNT(of those completions, a ConversionRecord cr exists with
                    cr.internship_match_id == m.id AND cr.hired == true)
      hiring_rate_pct = (completions == 0) ? 0.00 : round_half_up(100.0 * conversions / completions, 2)
      The two variants legitimately diverge for identical underlying data because
      they bucket completions on different dates (member separation_date vs
      match completed_at) over different windows.
    input_set: "COMPLETED matches of the employer; ConversionRecords joined on internship_match_id"
    constants:
      ROLLING_HIRING_WINDOW_DAYS: 90
      CONVERSION_WINDOW_DAYS: 90
    precision: "2 decimal places, round_half_up; zero denominator yields exactly 0.00"
    variants:
      - name: cohort
        when: "query param variant=COHORT (requires cohort_start_date and cohort_end_date, else ERR_VALIDATION)"
        difference: "buckets completions by member.separation_date within the caller-supplied cohort window"
      - name: rolling
        when: "query param variant=ROLLING (default when variant omitted)"
        difference: "buckets completions by match.completed_at within the trailing 90-day window ending at the logical clock"

  - name: training_progress_measures
    trigger: "recomputed on every SupervisionReport that marks objectives, and read at POST /skillbridge/internship-matches/{id}/complete"
    algorithm: weighted_scoring
    formula: |
      resolution_ratio = COUNT(objectives o IN match.learning_objectives WHERE o.status IN {ACHIEVED, EXCUSED})
                         / COUNT(match.learning_objectives)          # 1.00 when plan empty
      mastery_ratio    = SUM(o.weight_hours WHERE o.status == ACHIEVED)
                         / SUM(o.weight_hours over all objectives)     # 1.00 when plan empty
      Completion gate: resolution_ratio must == 1.00 AND mastery_ratio must be >= MIN_MASTERY_RATIO.
      The two measures legitimately diverge: an excused objective resolves the
      plan but contributes no mastery hours, so a heavily-excused plan can be
      fully resolved yet below the mastery floor.
    input_set: "match.learning_objectives (approved plan), objective statuses as mutated by supervision reports"
    constants:
      MIN_MASTERY_RATIO: 0.75
    precision: "2 decimal places, round_half_up"
    variants:
      - name: resolution_ratio
        when: "structural completeness check at completion"
        difference: "counts ACHIEVED and EXCUSED alike (unweighted)"
      - name: mastery_ratio
        when: "quality floor at completion"
        difference: "counts ACHIEVED only, weighted by weight_hours"

  - name: supervision_coverage
    trigger: "POST /skillbridge/internship-matches/{id}/complete"
    algorithm: threshold
    formula: |
      duration_days = (match.end_date - match.start_date).days
      expected_reports = FLOOR(duration_days / SUPERVISION_CADENCE_DAYS)
      submitted_reports = COUNT(SupervisionReport r WHERE r.internship_match_id == match.id)
      coverage_satisfied <=> submitted_reports >= expected_reports
      Boundary is exact: duration 34 days -> floor(34/7) = 4 reports; duration 35
      days -> floor(35/7) = 5 reports. One report too few -> ERR_INSUFFICIENT_SUPERVISION.
    input_set: "the completing InternshipMatch and all of its SupervisionReports"
    constants:
      SUPERVISION_CADENCE_DAYS: 7
    precision: "integer floor"

  - name: compliance_score
    trigger: "POST /skillbridge/compliance-audits/{id}/close"
    algorithm: aggregation
    formula: |
      Process findings in array order. For finding i with severity s_i:
        prior_i = COUNT(earlier findings IN THE SAME AUDIT with the same finding_code)
        deduction_i = round_half_up(SEVERITY_BASE[s_i] * (1 + REPEAT_MULTIPLIER * prior_i), 2)
      PINNED ROUNDING ORDER: round each deduction_i to 2 decimal places FIRST,
      then sum. (Rounding only the final sum is the rejected alternative.)
      total_deduction = min(SUM(deduction_i), AUDIT_BASE_SCORE)
      compliance_score = AUDIT_BASE_SCORE - total_deduction
      outcome: compliance_score >= SANCTION_SCORE_THRESHOLD -> CLOSED_CLEARED (and the
               employer's pending_violations ledger resets to 0)
               compliance_score <  SANCTION_SCORE_THRESHOLD -> CLOSED_SANCTIONED (and the
               employer is revoked per the Employer state machine cascade)
      Empty findings -> score 100.00 -> CLOSED_CLEARED.
    input_set: "the findings array supplied in the close call"
    constants:
      AUDIT_BASE_SCORE: 100
      SANCTION_SCORE_THRESHOLD: 70
      REPEAT_MULTIPLIER: 0.5
      SEVERITY_BASE_MINOR: 5.00
      SEVERITY_BASE_MAJOR: 20.00
      SEVERITY_BASE_CRITICAL: 45.00
    precision: "2 decimal places, round_half_up, per-finding then sum (order pinned)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role is a declared role name"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 1.5
    category: auth
    check: "Request schema: required fields present, types correct, enum values in range; conditional requirements (decision=DENY requires reason; location_type=ON_SITE requires region_code; offer_accepted=true requires offer_made=true; learning_objectives non-empty with unique codes and weight_hours > 0; variant=COHORT requires cohort dates; objectives_achieved and objectives_excused disjoint; wage period_start_date <= period_end_date)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all endpoints with a request body"
  - priority: 2
    category: auth
    check: "Role is permitted to call this endpoint per the RBAC matrix"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Path resource ids exist, validated left-to-right"
    error_id: "ERR_INSTALLATION_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_EMPLOYER_NOT_FOUND | ERR_OPENING_NOT_FOUND | ERR_MATCH_NOT_FOUND | ERR_AUDIT_NOT_FOUND"
    http_status: 404
    applies_to: "all path-parameterized endpoints"
  - priority: 4
    category: existence
    check: "Body foreign-key ids exist, validated in declared input order (e.g. on POST /skillbridge/internship-matches: internship_application_id first, then employer_opening_id)"
    error_id: "ERR_APPLICATION_NOT_FOUND | ERR_OPENING_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_EMPLOYER_NOT_FOUND | ERR_INSTALLATION_NOT_FOUND | ERR_MATCH_NOT_FOUND"
    http_status: 404
    applies_to: "creation endpoints with body FKs"
  - priority: 5
    category: state
    check: "OCC: expected_<parent>_version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PATCH /skillbridge/service-members/{id}; POST /skillbridge/internship-matches"
    note: "Checked immediately after the OCC parent's existence check, before ownership/state/business rules"
  - priority: 6
    category: auth
    check: "Entity-backed ownership: ServiceMember X-User-ID == application.service_member_id (apply/appeal); EmployerRep X-User-ID == employer_id of the opening/match being touched (openings, matches, submit-plan, employer-side terminate, supervision reports, wage records, conversion records)"
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: "POST /skillbridge/internship-applications; POST .../appeal; POST /skillbridge/employer-openings; POST /skillbridge/internship-matches; POST .../submit-plan; POST .../terminate (EmployerRep only); POST /skillbridge/supervision-reports; POST /skillbridge/wage-records; POST /skillbridge/conversion-records"
  - priority: 7
    category: state
    check: "ServiceMember.service_status == ACTIVE_DUTY"
    error_id: ERR_MEMBER_NOT_ON_ACTIVE_DUTY
    http_status: 409
    applies_to: "POST /skillbridge/internship-applications; POST .../tap-advance; POST /skillbridge/internship-matches (applicant); POST .../installation-decision (APPROVE)"
  - priority: 8
    category: state
    check: "InternshipApplication in the required state (commander-decision: SUBMITTED; appeal: DENIED; adjudicate-appeal: UNDER_APPEAL)"
    error_id: "ERR_APPLICATION_NOT_SUBMITTED | ERR_APPLICATION_NOT_DENIED | ERR_NO_PENDING_APPEAL"
    http_status: 409
    applies_to: "application decision/appeal endpoints"
  - priority: 8.5
    category: state
    check: "Segregation of duties on appeal adjudication: adjudicator X-User-ID != application.decided_by_user_id"
    error_id: ERR_APPEAL_ADJUDICATOR_CONFLICT
    http_status: 403
    applies_to: "POST /skillbridge/internship-applications/{id}/adjudicate-appeal"
    note: "Sits immediately after the UNDER_APPEAL state check — needs decided_by_user_id loaded"
  - priority: 9
    category: state
    check: "Employer.authorization_status == AUTHORIZED for commercial operations; IN {AUTHORIZED, SUSPENDED, AUTHORIZATION_LAPSED} for periodic-review; == PENDING_AUTHORIZATION for authorize; ComplianceAudit.status == OPEN for close"
    error_id: "ERR_EMPLOYER_NOT_AUTHORIZED | ERR_EMPLOYER_NOT_PENDING_AUTHORIZATION | ERR_AUDIT_ALREADY_CLOSED"
    http_status: 409
    applies_to: "POST /skillbridge/employer-openings; POST /skillbridge/internship-matches; POST .../installation-decision; POST .../authorize; POST .../periodic-review; POST .../close"
  - priority: 10
    category: state
    check: "EmployerOpening.status == OPEN for new matches and for close; InternshipApplication.status == APPROVED for match creation; InternshipMatch.match_status == PROPOSED for submit-plan and installation-decision; == ACTIVE for supervision reports and complete; IN {PROPOSED, INSTALLATION_APPROVED, ACTIVE} for terminate; wage records require match_status ACTIVE (dedicated error); plan_status == PLAN_SUBMITTED for review-plan; == PLAN_APPROVED for installation-decision APPROVE; match COMPLETED for conversion records"
    error_id: "ERR_OPENING_NOT_OPEN | ERR_APPLICATION_NOT_APPROVED | ERR_MATCH_NOT_PROPOSED | ERR_MATCH_NOT_ACTIVE | ERR_MATCH_NOT_TERMINABLE | ERR_WAGE_RECORD_NOT_ALLOWED | ERR_PLAN_NOT_SUBMITTED | ERR_PLAN_NOT_APPROVED | ERR_MATCH_NOT_COMPLETED"
    http_status: 409
    applies_to: "match and child-resource endpoints"
  - priority: 11
    category: business_constraint
    check: "Member holds at most one application in {SUBMITTED, UNDER_APPEAL, APPROVED, DENIED}"
    error_id: ERR_ACTIVE_APPLICATION_EXISTS
    http_status: 409
    applies_to: "POST /skillbridge/internship-applications"
  - priority: 12
    category: business_constraint
    check: "Member pay_grade not in Installation.excluded_pay_grades"
    error_id: ERR_PAY_GRADE_EXCLUDED
    http_status: 409
    applies_to: "POST /skillbridge/internship-applications"
  - priority: 13
    category: business_temporal
    check: "Eligibility window: ELIGIBILITY_WINDOW_MIN_DAYS (30) <= days_until_separation <= ELIGIBILITY_WINDOW_MAX_DAYS (180), inclusive"
    error_id: ERR_OUTSIDE_ELIGIBILITY_WINDOW
    http_status: 409
    applies_to: "POST /skillbridge/internship-applications"
  - priority: 14
    category: business_temporal
    check: "Appeal filed within Installation.appeal_window_days of the denial (clock <= appeal_deadline) and appeal_count < MAX_APPEALS_PER_APPLICATION (2)"
    error_id: "ERR_APPEAL_WINDOW_EXPIRED | ERR_MAX_APPEALS_REACHED"
    http_status: 409
    applies_to: "POST /skillbridge/internship-applications/{id}/appeal"
    note: "window check precedes the count check"
  - priority: 15
    category: business_constraint
    check: "TAP gate: if Installation.requires_tap_complete then member.tap_stage == CAPSTONE_DONE; tap-advance target_stage is exactly the next stage"
    error_id: "ERR_TAP_INCOMPLETE | ERR_TAP_SEQUENCE_VIOLATION"
    http_status: 409
    applies_to: "POST .../commander-decision; POST .../tap-advance"
  - priority: 16
    category: business_temporal
    check: "Match dates: start_date >= logical clock date; duration_days >= MIN_INTERNSHIP_DURATION_DAYS (30); duration_days <= min(installation.max_internship_duration_days, (separation_date - start_date).days - SEPARATION_BUFFER_DAYS (7)) — evaluated in this pinned order per calculations.match_duration_gate"
    error_id: "ERR_START_DATE_IN_PAST | ERR_DURATION_BELOW_MINIMUM | ERR_DURATION_EXCEEDS_POLICY"
    http_status: 409
    applies_to: "POST /skillbridge/internship-matches"
  - priority: 17
    category: business_constraint
    check: "Member.skills is a superset of opening.required_skills"
    error_id: ERR_SKILLS_MISMATCH
    http_status: 409
    applies_to: "POST /skillbridge/internship-matches"
  - priority: 18
    category: business_constraint
    check: "Duty/location constraint: ON_SITE opening requires opening.region_code == Installation(member.home_installation_id).region_code; REMOTE openings impose no region constraint"
    error_id: ERR_LOCATION_CONSTRAINT_VIOLATION
    http_status: 409
    applies_to: "POST /skillbridge/internship-matches"
  - priority: 19
    category: business_temporal
    check: "Member schedule overlap (half-open intervals): no other non-terminal match m of this member with NOT (new.end_date <= m.start_date OR new.start_date >= m.end_date); adjacency (new.start_date == m.end_date) is allowed"
    error_id: ERR_MEMBER_SCHEDULE_OVERLAP
    http_status: 409
    applies_to: "POST /skillbridge/internship-matches"
  - priority: 20
    category: business_fiscal
    check: "Opening concurrency capacity: COUNT(non-terminal matches m of this opening with intervals overlapping [start_date, end_date), same half-open predicate) < opening.capacity"
    error_id: ERR_OPENING_AT_CAPACITY
    http_status: 409
    applies_to: "POST /skillbridge/internship-matches"
    note: "Quota/fiscal checks run last per the standard priority grouping"
  - priority: 21
    category: business_temporal
    check: "Supervision week_start_date and wage period dates lie within [match.start_date, match.end_date] (wage: period_start_date <= period_end_date within range); objective codes referenced by a report exist in the match's plan"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "POST /skillbridge/supervision-reports; POST /skillbridge/wage-records"
  - priority: 22
    category: business_constraint
    check: "Supervision week unique per match (one report per (match, week_start_date))"
    error_id: ERR_DUPLICATE_WEEK_REPORT
    http_status: 409
    applies_to: "POST /skillbridge/supervision-reports"
  - priority: 23
    category: business_constraint
    check: "Plan resubmission allowed only while plan_revision_count < MAX_PLAN_REVISIONS (3)"
    error_id: ERR_MAX_PLAN_REVISIONS_REACHED
    http_status: 409
    applies_to: "POST /skillbridge/internship-matches/{id}/submit-plan (from PLAN_RETURNED)"
  - priority: 24
    category: business_temporal
    check: "Completion timing: logical clock date >= match.end_date"
    error_id: ERR_COMPLETION_DATE_NOT_REACHED
    http_status: 409
    applies_to: "POST /skillbridge/internship-matches/{id}/complete"
  - priority: 25
    category: business_constraint
    check: "Completion content gates, in pinned order: all objectives resolved (ERR_OBJECTIVES_INCOMPLETE); supervision coverage met (ERR_INSUFFICIENT_SUPERVISION); mastery_ratio >= MIN_MASTERY_RATIO 0.75 (ERR_MASTERY_BELOW_THRESHOLD)"
    error_id: "ERR_OBJECTIVES_INCOMPLETE | ERR_INSUFFICIENT_SUPERVISION | ERR_MASTERY_BELOW_THRESHOLD"
    http_status: 409
    applies_to: "POST /skillbridge/internship-matches/{id}/complete"
  - priority: 26
    category: business_temporal
    check: "PATCH separation_date must not strand non-terminal matches: every non-terminal match of the member must still satisfy end_date <= new_separation_date - SEPARATION_BUFFER_DAYS (7)"
    error_id: ERR_SEPARATION_DATE_CONFLICT
    http_status: 409
    applies_to: "PATCH /skillbridge/service-members/{id}"
  - priority: 27
    category: business_temporal
    check: "Conversion timing: member.separation_date <= conversion_date <= member.separation_date + CONVERSION_WINDOW_DAYS (90)"
    error_id: ERR_CONVERSION_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /skillbridge/conversion-records"
  - priority: 28
    category: business_constraint
    check: "At most one ConversionRecord per match"
    error_id: ERR_CONVERSION_ALREADY_RECORDED
    http_status: 409
    applies_to: "POST /skillbridge/conversion-records"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/skillbridge/_clock/set_current_utc"
    description: "Test-driving logical clock. Sets the server logical time. Startup default (before any call) is exactly 2026-09-01T00:00:00Z and never falls back to wall-clock. Side effects sweep in pinned order: (1) employers whose next_review_due_date is strictly past -> AUTHORIZATION_LAPSED; (2) members with separation_date <= clock date -> SEPARATED (cascading match voids/terminations); (3) INSTALLATION_APPROVED matches with start_date <= clock date and member still ACTIVE_DUTY -> ACTIVE. Within each sweep, entities process in created_at ASC order."
    roles: [ProgramOffice]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string, employers_lapsed: integer, members_separated: integer, matches_activated: integer }
    side_effects: ["employer lapse sweep", "member separation sweep with match void/terminate cascade", "match auto-start sweep", "version increments on every mutated entity"]

  - method: POST
    path: "/skillbridge/installations"
    description: "Create an Installation with its command-level approval policy"
    roles: [ProgramOffice]
    code: 201
    input: [name, command_code, region_code, max_internship_duration_days, appeal_window_days, requires_tap_complete, "excluded_pay_grades?"]
    output: Installation
    side_effects: []

  - method: POST
    path: "/skillbridge/service-members"
    description: "Register a transitioning service member (TAP office intake)"
    roles: [TransitionCounselor]
    code: 201
    input: [full_name, service_branch, pay_grade, separation_date, skills, home_installation_id]
    output: ServiceMember
    side_effects: ["service_status=ACTIVE_DUTY", "tap_stage=TAP_NOT_STARTED", "active_match_count=0"]

  - method: GET
    path: "/skillbridge/service-members"
    description: "List service members; filterable"
    roles: [ProgramOffice, TransitionCounselor, UnitCommander, InstallationAuthority, ServiceMember, EmployerRep]
    code: 200
    input: ["home_installation_id?", "service_status?", "limit?", "offset?"]
    output: "ServiceMember[]"
    side_effects: []

  - method: GET
    path: "/skillbridge/service-members/{id}"
    description: "Get one service member (includes computed days_until_separation, active_match_count)"
    roles: [ProgramOffice, TransitionCounselor, UnitCommander, InstallationAuthority, ServiceMember, EmployerRep]
    code: 200
    input: []
    output: ServiceMember
    side_effects: []

  - method: PATCH
    path: "/skillbridge/service-members/{id}"
    description: "Update separation_date / skills / pay_grade under OCC. A separation_date change re-validates every non-terminal match of the member (ERR_SEPARATION_DATE_CONFLICT if any would strand). Increments ServiceMember.version by 1."
    roles: [TransitionCounselor]
    code: 200
    input: [expected_service_member_version, "separation_date?", "skills?", "pay_grade?"]
    output: ServiceMember
    side_effects: ["increments ServiceMember.version by 1", "days_until_separation recomputed", "separation-date conflict revalidation"]

  - method: POST
    path: "/skillbridge/service-members/{id}/tap-advance"
    description: "Advance TAP stage by exactly one step (TAP sequencing)"
    roles: [TransitionCounselor]
    code: 200
    input: [target_stage]
    output: ServiceMember
    side_effects: ["tap_stage advances one step", "increments ServiceMember.version by 1"]

  - method: POST
    path: "/skillbridge/internship-applications"
    description: "Member submits a program application (eligibility window, pay-grade and duplicate-application gates)"
    roles: [ServiceMember]
    code: 201
    input: [service_member_id]
    output: InternshipApplication
    side_effects: ["status=SUBMITTED", "submitted_at=logical clock", "days_until_separation_at_submission snapshot", "installation_id copied from member"]

  - method: GET
    path: "/skillbridge/internship-applications"
    description: "List applications; filterable"
    roles: [ProgramOffice, TransitionCounselor, UnitCommander, InstallationAuthority, ServiceMember, EmployerRep]
    code: 200
    input: ["service_member_id?", "installation_id?", "status?", "limit?", "offset?"]
    output: "InternshipApplication[]"
    side_effects: []

  - method: GET
    path: "/skillbridge/internship-applications/{id}"
    description: "Get one application"
    roles: [ProgramOffice, TransitionCounselor, UnitCommander, InstallationAuthority, ServiceMember, EmployerRep]
    code: 200
    input: []
    output: InternshipApplication
    side_effects: []

  - method: POST
    path: "/skillbridge/internship-applications/{id}/commander-decision"
    description: "Unit commander approves or denies the application (DENY requires reason; conditional TAP gate)"
    roles: [UnitCommander]
    code: 200
    input: [decision, "reason?"]
    output: InternshipApplication
    side_effects: ["status -> APPROVED | DENIED", "decided_by_user_id/decided_at stamped", "appeal_deadline computed on denial", "increments InternshipApplication.version by 1"]

  - method: POST
    path: "/skillbridge/internship-applications/{id}/appeal"
    description: "Member appeals a DENIED application (window + count caps)"
    roles: [ServiceMember]
    code: 200
    input: ["appeal_reason?"]
    output: InternshipApplication
    side_effects: ["status -> UNDER_APPEAL", "appeal_count += 1", "increments InternshipApplication.version by 1"]

  - method: POST
    path: "/skillbridge/internship-applications/{id}/adjudicate-appeal"
    description: "Installation authority adjudicates a pending appeal (segregation of duties: adjudicator must differ from the denier)"
    roles: [InstallationAuthority]
    code: 200
    input: [outcome, "reason?"]
    output: InternshipApplication
    side_effects: ["status -> APPROVED | DENIED", "decision fields restamped", "appeal_deadline recomputed when back to DENIED", "increments InternshipApplication.version by 1"]

  - method: POST
    path: "/skillbridge/employers"
    description: "Register an employer as a candidate program provider"
    roles: [ProgramOffice]
    code: 201
    input: [legal_name, industry_code]
    output: Employer
    side_effects: ["authorization_status=PENDING_AUTHORIZATION", "pending_violations=0"]

  - method: GET
    path: "/skillbridge/employers/{id}"
    description: "Get one employer"
    roles: [ProgramOffice, TransitionCounselor, UnitCommander, InstallationAuthority, ServiceMember, EmployerRep]
    code: 200
    input: []
    output: Employer
    side_effects: []

  - method: POST
    path: "/skillbridge/employers/{id}/authorize"
    description: "Authorize a pending employer as a program provider"
    roles: [ProgramOffice]
    code: 200
    input: []
    output: Employer
    side_effects: ["authorization_status -> AUTHORIZED", "authorized_at = logical clock", "next_review_due_date = clock + REVIEW_INTERVAL_DAYS (180)", "increments Employer.version by 1"]

  - method: POST
    path: "/skillbridge/employers/{id}/periodic-review"
    description: "Periodic program review: PASS (re)authorizes and refreshes the review horizon; FAIL suspends"
    roles: [ProgramOffice]
    code: 200
    input: [outcome, "notes?"]
    output: Employer
    side_effects: ["PASS -> AUTHORIZED with refreshed next_review_due_date", "FAIL -> SUSPENDED", "increments Employer.version by 1"]

  - method: GET
    path: "/skillbridge/employers/{id}/compliance-audits"
    description: "List compliance audits for an employer (FK reverse-reachability for ComplianceAudit.employer_id)"
    roles: [ProgramOffice, TransitionCounselor, UnitCommander, InstallationAuthority, ServiceMember, EmployerRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "ComplianceAudit[]"
    side_effects: []

  - method: GET
    path: "/skillbridge/employers/{id}/hiring-rate"
    description: "Computed read: employer hiring rate. variant=COHORT (requires cohort_start_date + cohort_end_date, buckets completions by member separation_date) or variant=ROLLING (default; trailing 90-day window on match completed_at). Empty denominator yields hiring_rate_pct 0.00."
    roles: [ProgramOffice, EmployerRep, InstallationAuthority]
    code: 200
    input: ["variant?", "cohort_start_date?", "cohort_end_date?"]
    output: { employer_id: string, variant: string, window_start_date: string, window_end_date: string, completed_count: integer, converted_count: integer, hiring_rate_pct: number }
    side_effects: []

  - method: POST
    path: "/skillbridge/employer-openings"
    description: "Employer posts an internship opening (employer must be AUTHORIZED; ON_SITE requires region_code)"
    roles: [EmployerRep]
    code: 201
    input: [employer_id, title, required_skills, location_type, capacity, "region_code?"]
    output: EmployerOpening
    side_effects: ["status=OPEN", "filled_count=0"]

  - method: GET
    path: "/skillbridge/employer-openings"
    description: "List openings; filterable"
    roles: [ProgramOffice, TransitionCounselor, UnitCommander, InstallationAuthority, ServiceMember, EmployerRep]
    code: 200
    input: ["employer_id?", "status?", "limit?", "offset?"]
    output: "EmployerOpening[]"
    side_effects: []

  - method: GET
    path: "/skillbridge/employer-openings/{id}"
    description: "Get one opening (includes computed filled_count and OCC version)"
    roles: [ProgramOffice, TransitionCounselor, UnitCommander, InstallationAuthority, ServiceMember, EmployerRep]
    code: 200
    input: []
    output: EmployerOpening
    side_effects: []

  - method: POST
    path: "/skillbridge/employer-openings/{id}/close"
    description: "Employer withdraws an OPEN opening. Voids its PROPOSED/INSTALLATION_APPROVED matches (ACTIVE matches unaffected); slot ledger recomputed. Double-close yields ERR_OPENING_NOT_OPEN."
    roles: [EmployerRep]
    code: 200
    input: []
    output: EmployerOpening
    side_effects: ["status -> CLOSED", "PROPOSED/INSTALLATION_APPROVED matches on this opening -> MATCH_VOIDED", "filled_count recomputed", "affected members' active_match_count recomputed", "increments EmployerOpening.version by 1"]

  - method: POST
    path: "/skillbridge/internship-matches"
    description: "Propose a match between an approved application and an opening under OCC on the opening. Validates (in priority order): body FK existence, opening version, employer ownership, application APPROVED, opening OPEN, employer AUTHORIZED, member ACTIVE_DUTY, date/duration gates, skills subset, location constraint, member schedule overlap, opening concurrency capacity."
    roles: [EmployerRep]
    code: 201
    input: [internship_application_id, employer_opening_id, start_date, end_date, expected_employer_opening_version]
    output: InternshipMatch
    side_effects: ["match_status=PROPOSED", "plan_status=PLAN_DRAFT", "denormalized service_member_id/employer_id/installation_id copied", "increments EmployerOpening.version by 1", "EmployerOpening.filled_count recomputed", "ServiceMember.active_match_count recomputed"]

  - method: GET
    path: "/skillbridge/internship-matches"
    description: "List matches; filterable on every FK"
    roles: [ProgramOffice, TransitionCounselor, UnitCommander, InstallationAuthority, ServiceMember, EmployerRep]
    code: 200
    input: ["internship_application_id?", "employer_opening_id?", "service_member_id?", "employer_id?", "installation_id?", "match_status?", "limit?", "offset?"]
    output: "InternshipMatch[]"
    side_effects: []

  - method: GET
    path: "/skillbridge/internship-matches/{id}"
    description: "Get one match (both state dimensions, ratios, revision count)"
    roles: [ProgramOffice, TransitionCounselor, UnitCommander, InstallationAuthority, ServiceMember, EmployerRep]
    code: 200
    input: []
    output: InternshipMatch
    side_effects: []

  - method: POST
    path: "/skillbridge/internship-matches/{id}/installation-decision"
    description: "Installation authority approves or denies the proposed match under its command's policy (APPROVE requires approved plan; DENY requires reason)"
    roles: [InstallationAuthority]
    code: 200
    input: [decision, "reason?"]
    output: InternshipMatch
    side_effects: ["match_status -> INSTALLATION_APPROVED | INSTALLATION_DENIED", "decision fields stamped", "on DENY: opening filled_count and member active_match_count recomputed", "increments InternshipMatch.version by 1"]

  - method: POST
    path: "/skillbridge/internship-matches/{id}/submit-plan"
    description: "Employer submits (or resubmits after a return) the training plan with learning objectives"
    roles: [EmployerRep]
    code: 200
    input: [learning_objectives, supervisor_name, weekly_hours]
    output: InternshipMatch
    side_effects: ["plan_status -> PLAN_SUBMITTED", "plan fields overwritten; objective statuses reset to PENDING", "increments InternshipMatch.version by 1"]

  - method: POST
    path: "/skillbridge/internship-matches/{id}/review-plan"
    description: "Installation authority reviews the submitted plan (APPROVE or RETURN; RETURN increments plan_revision_count)"
    roles: [InstallationAuthority]
    code: 200
    input: [outcome, "feedback?"]
    output: InternshipMatch
    side_effects: ["plan_status -> PLAN_APPROVED | PLAN_RETURNED", "on RETURN: plan_revision_count += 1", "increments InternshipMatch.version by 1"]

  - method: POST
    path: "/skillbridge/internship-matches/{id}/terminate"
    description: "Terminate a non-terminal match early with a reason (slot released)"
    roles: [EmployerRep, InstallationAuthority]
    code: 200
    input: [reason]
    output: InternshipMatch
    side_effects: ["match_status -> TERMINATED_EARLY", "termination_reason set", "opening filled_count and member active_match_count recomputed", "increments InternshipMatch.version by 1"]

  - method: POST
    path: "/skillbridge/internship-matches/{id}/complete"
    description: "Complete an ACTIVE match at/past end_date (objectives, supervision coverage, and mastery gates)"
    roles: [InstallationAuthority]
    code: 200
    input: []
    output: InternshipMatch
    side_effects: ["match_status -> COMPLETED", "completed_at = logical clock", "opening filled_count and member active_match_count recomputed", "increments InternshipMatch.version by 1"]

  - method: GET
    path: "/skillbridge/internship-matches/{id}/supervision-reports"
    description: "List supervision reports for a match (FK reverse-reachability)"
    roles: [ProgramOffice, TransitionCounselor, UnitCommander, InstallationAuthority, ServiceMember, EmployerRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "SupervisionReport[]"
    side_effects: []

  - method: GET
    path: "/skillbridge/internship-matches/{id}/wage-records"
    description: "List wage records for a match (FK reverse-reachability)"
    roles: [ProgramOffice, TransitionCounselor, UnitCommander, InstallationAuthority, ServiceMember, EmployerRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "WageRecord[]"
    side_effects: []

  - method: GET
    path: "/skillbridge/internship-matches/{id}/conversion-records"
    description: "List conversion records for a match (FK reverse-reachability; 0 or 1 element)"
    roles: [ProgramOffice, TransitionCounselor, UnitCommander, InstallationAuthority, ServiceMember, EmployerRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "ConversionRecord[]"
    side_effects: []

  - method: POST
    path: "/skillbridge/supervision-reports"
    description: "Employer files a weekly supervision report; marks plan objectives ACHIEVED/EXCUSED; one report per (match, week_start_date)"
    roles: [EmployerRep]
    code: 201
    input: [internship_match_id, week_start_date, hours_supervised, supervisor_name, attestation_text, "objectives_achieved?", "objectives_excused?"]
    output: SupervisionReport
    side_effects: ["match objective statuses updated (ACHIEVED/EXCUSED)", "match resolution_ratio and mastery_ratio recomputed", "increments InternshipMatch.version by 1"]

  - method: POST
    path: "/skillbridge/wage-records"
    description: "Employer records any payment for an internship period. amount_cents == 0 is the normal no-wage attestation; amount_cents > 0 while the match is ACTIVE creates a violation and cascades (match flagged, employer pending_violations += 1, suspension at threshold 2)"
    roles: [EmployerRep]
    code: 201
    input: [internship_match_id, period_start_date, period_end_date, amount_cents, "memo?"]
    output: WageRecord
    side_effects: ["is_violation computed", "on violation: match.flagged_wage_violation = true; employer.pending_violations += 1; if pending_violations >= WAGE_VIOLATION_SUSPEND_THRESHOLD (2) and employer IN {AUTHORIZED, AUTHORIZATION_LAPSED}: employer -> SUSPENDED", "increments InternshipMatch.version and Employer.version by 1 on violation"]

  - method: POST
    path: "/skillbridge/compliance-audits"
    description: "Open a compliance audit on an employer (any employer state allowed)"
    roles: [ProgramOffice]
    code: 201
    input: [employer_id]
    output: ComplianceAudit
    side_effects: ["status=OPEN", "opened_at = logical clock"]

  - method: POST
    path: "/skillbridge/compliance-audits/{id}/close"
    description: "Close an audit with its findings; computes compliance_score (per-finding rounding, then sum, then clamp); >= 70 clears and resets the violation ledger, < 70 sanctions and revokes the employer with the full cascade"
    roles: [ProgramOffice]
    code: 200
    input: ["findings?"]
    output: ComplianceAudit
    side_effects: ["status -> CLOSED_CLEARED | CLOSED_SANCTIONED", "compliance_score and closed_at set", "CLEARED: employer.pending_violations = 0, last_cleared_audit_at set", "SANCTIONED: employer -> REVOKED cascade (openings CLOSED, proposed matches VOIDED, active matches TERMINATED_EARLY)", "increments ComplianceAudit.version and Employer.version by 1"]

  - method: POST
    path: "/skillbridge/conversion-records"
    description: "Record a post-separation employment conversion for a completed match (one per match; date within 90 days after separation)"
    roles: [EmployerRep]
    code: 201
    input: [internship_match_id, conversion_date, offer_made, offer_accepted]
    output: ConversionRecord
    side_effects: ["hired computed"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/invalid" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, type/enum violation, or failed conditional requirement (DENY without reason; ON_SITE without region_code; offer_accepted without offer_made; empty objectives; unknown objective code; bad COHORT params; bad wage period)" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role may not call this endpoint" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "Entity-backed caller does not own the referenced resource (member vs application; employer rep vs opening/match)" }
  - { id: ERR_APPEAL_ADJUDICATOR_CONFLICT, http: 403, condition: "Appeal adjudicator X-User-ID equals the denying commander's decided_by_user_id (segregation of duties)" }
  - { id: ERR_INSTALLATION_NOT_FOUND, http: 404, condition: "Installation id does not exist" }
  - { id: ERR_MEMBER_NOT_FOUND, http: 404, condition: "ServiceMember id does not exist" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "InternshipApplication id does not exist" }
  - { id: ERR_EMPLOYER_NOT_FOUND, http: 404, condition: "Employer id does not exist" }
  - { id: ERR_OPENING_NOT_FOUND, http: 404, condition: "EmployerOpening id does not exist" }
  - { id: ERR_MATCH_NOT_FOUND, http: 404, condition: "InternshipMatch id does not exist" }
  - { id: ERR_AUDIT_NOT_FOUND, http: 404, condition: "ComplianceAudit id does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_MEMBER_NOT_ON_ACTIVE_DUTY, http: 409, condition: "Member service_status != ACTIVE_DUTY" }
  - { id: ERR_OUTSIDE_ELIGIBILITY_WINDOW, http: 409, condition: "days_until_separation outside [30, 180] inclusive at application submission" }
  - { id: ERR_PAY_GRADE_EXCLUDED, http: 409, condition: "Member pay_grade is in the installation's excluded_pay_grades" }
  - { id: ERR_ACTIVE_APPLICATION_EXISTS, http: 409, condition: "Member already has an application in {SUBMITTED, UNDER_APPEAL, APPROVED, DENIED}" }
  - { id: ERR_APPLICATION_NOT_SUBMITTED, http: 409, condition: "commander-decision requires status SUBMITTED" }
  - { id: ERR_APPLICATION_NOT_DENIED, http: 409, condition: "appeal requires status DENIED" }
  - { id: ERR_NO_PENDING_APPEAL, http: 409, condition: "adjudicate-appeal requires status UNDER_APPEAL" }
  - { id: ERR_APPEAL_WINDOW_EXPIRED, http: 409, condition: "logical clock past appeal_deadline" }
  - { id: ERR_MAX_APPEALS_REACHED, http: 409, condition: "appeal_count >= MAX_APPEALS_PER_APPLICATION (2)" }
  - { id: ERR_TAP_INCOMPLETE, http: 409, condition: "Installation requires_tap_complete and member tap_stage != CAPSTONE_DONE at commander decision" }
  - { id: ERR_TAP_SEQUENCE_VIOLATION, http: 409, condition: "tap-advance target_stage is not exactly the next stage" }
  - { id: ERR_SEPARATION_DATE_CONFLICT, http: 409, condition: "PATCH separation_date would strand a non-terminal match (end_date > new separation_date - 7 days)" }
  - { id: ERR_EMPLOYER_NOT_PENDING_AUTHORIZATION, http: 409, condition: "authorize requires PENDING_AUTHORIZATION" }
  - { id: ERR_EMPLOYER_NOT_AUTHORIZED, http: 409, condition: "Operation requires employer AUTHORIZED (or review-eligible state); also fired for REVOKED/PENDING where applicable" }
  - { id: ERR_OPENING_NOT_OPEN, http: 409, condition: "Match creation requires opening status OPEN" }
  - { id: ERR_APPLICATION_NOT_APPROVED, http: 409, condition: "Match creation requires application status APPROVED" }
  - { id: ERR_SKILLS_MISMATCH, http: 409, condition: "Member skills do not cover opening required_skills" }
  - { id: ERR_LOCATION_CONSTRAINT_VIOLATION, http: 409, condition: "ON_SITE opening region_code differs from member home installation region_code" }
  - { id: ERR_DURATION_BELOW_MINIMUM, http: 409, condition: "duration_days < MIN_INTERNSHIP_DURATION_DAYS (30)" }
  - { id: ERR_DURATION_EXCEEDS_POLICY, http: 409, condition: "duration_days > min(installation.max_internship_duration_days, (separation_date - start_date).days - 7)" }
  - { id: ERR_START_DATE_IN_PAST, http: 409, condition: "start_date < logical clock date" }
  - { id: ERR_MEMBER_SCHEDULE_OVERLAP, http: 409, condition: "Member already holds a non-terminal match whose half-open interval intersects the proposal" }
  - { id: ERR_OPENING_AT_CAPACITY, http: 409, condition: "Concurrently-overlapping non-terminal matches on the opening would reach/exceed capacity" }
  - { id: ERR_MATCH_NOT_PROPOSED, http: 409, condition: "submit-plan / installation-decision require match_status PROPOSED" }
  - { id: ERR_MATCH_NOT_ACTIVE, http: 409, condition: "Operation requires match_status ACTIVE (supervision report, wage record, complete)" }
  - { id: ERR_MATCH_NOT_TERMINABLE, http: 409, condition: "terminate requires match_status IN {PROPOSED, INSTALLATION_APPROVED, ACTIVE}" }
  - { id: ERR_PLAN_NOT_SUBMITTED, http: 409, condition: "review-plan requires plan_status PLAN_SUBMITTED" }
  - { id: ERR_PLAN_NOT_APPROVED, http: 409, condition: "installation-decision APPROVE requires plan_status PLAN_APPROVED" }
  - { id: ERR_MAX_PLAN_REVISIONS_REACHED, http: 409, condition: "Resubmit from PLAN_RETURNED with plan_revision_count >= MAX_PLAN_REVISIONS (3)" }
  - { id: ERR_COMPLETION_DATE_NOT_REACHED, http: 409, condition: "complete before logical clock date >= end_date" }
  - { id: ERR_OBJECTIVES_INCOMPLETE, http: 409, condition: "complete with any objective still PENDING (resolution_ratio < 1.00)" }
  - { id: ERR_INSUFFICIENT_SUPERVISION, http: 409, condition: "complete with fewer than floor(duration_days/7) supervision reports" }
  - { id: ERR_MASTERY_BELOW_THRESHOLD, http: 409, condition: "complete with mastery_ratio < 0.75 despite full resolution" }
  - { id: ERR_DUPLICATE_WEEK_REPORT, http: 409, condition: "A supervision report already exists for this (match, week_start_date)" }
  - { id: ERR_WAGE_RECORD_NOT_ALLOWED, http: 409, condition: "Wage records only accepted while the match is ACTIVE" }
  - { id: ERR_MATCH_NOT_COMPLETED, http: 409, condition: "Conversion record requires match_status COMPLETED" }
  - { id: ERR_CONVERSION_WINDOW_EXPIRED, http: 409, condition: "conversion_date before separation_date or after separation_date + 90 days" }
  - { id: ERR_CONVERSION_ALREADY_RECORDED, http: 409, condition: "A ConversionRecord already exists for this match" }
  - { id: ERR_AUDIT_ALREADY_CLOSED, http: 409, condition: "close requires audit status OPEN" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramOffice
    description: "Program office administrator: installations, employer authorization/review, compliance audits, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /skillbridge/_clock/set_current_utc"
      - "POST /skillbridge/installations"
      - "POST /skillbridge/employers"
      - "POST /skillbridge/employers/{id}/authorize"
      - "POST /skillbridge/employers/{id}/periodic-review"
      - "POST /skillbridge/compliance-audits"
      - "POST /skillbridge/compliance-audits/{id}/close"
    shared_operations:
      - "all GET endpoints"
      - "GET /skillbridge/employers/{id}/hiring-rate"

  - name: TransitionCounselor
    description: "Transition Assistance Program counselor: registers members, advances TAP stages, maintains member records"
    identity: opaque
    exclusive_operations:
      - "POST /skillbridge/service-members"
      - "PATCH /skillbridge/service-members/{id}"
      - "POST /skillbridge/service-members/{id}/tap-advance"
    shared_operations:
      - "all GET endpoints"

  - name: ServiceMember
    description: "Transitioning service member acting on their own applications"
    identity: entity_backed:ServiceMember
    exclusive_operations:
      - "POST /skillbridge/internship-applications (X-User-ID == service_member_id)"
      - "POST /skillbridge/internship-applications/{id}/appeal (X-User-ID == application.service_member_id)"
    shared_operations:
      - "all GET endpoints"

  - name: UnitCommander
    description: "Member's unit commander: first-line approve/deny of applications"
    identity: opaque
    exclusive_operations:
      - "POST /skillbridge/internship-applications/{id}/commander-decision"
    shared_operations:
      - "all GET endpoints"

  - name: InstallationAuthority
    description: "Installation-level approval authority: appeal adjudication (segregated from the denier), match decisions, plan reviews, match completion"
    identity: opaque
    exclusive_operations:
      - "POST /skillbridge/internship-applications/{id}/adjudicate-appeal"
      - "POST /skillbridge/internship-matches/{id}/installation-decision"
      - "POST /skillbridge/internship-matches/{id}/review-plan"
      - "POST /skillbridge/internship-matches/{id}/complete"
    shared_operations:
      - "all GET endpoints"
      - "GET /skillbridge/employers/{id}/hiring-rate"
      - "POST /skillbridge/internship-matches/{id}/terminate (shared with EmployerRep)"

  - name: EmployerRep
    description: "Employer representative acting for their own employer"
    identity: entity_backed:Employer
    exclusive_operations:
      - "POST /skillbridge/employer-openings (X-User-ID == employer_id)"
      - "POST /skillbridge/employer-openings/{id}/close (X-User-ID == opening.employer_id)"
      - "POST /skillbridge/internship-matches (X-User-ID == opening.employer_id)"
      - "POST /skillbridge/internship-matches/{id}/submit-plan (X-User-ID == match.employer_id)"
      - "POST /skillbridge/supervision-reports (X-User-ID == match.employer_id)"
      - "POST /skillbridge/wage-records (X-User-ID == match.employer_id)"
      - "POST /skillbridge/conversion-records (X-User-ID == match.employer_id)"
    shared_operations:
      - "all GET endpoints"
      - "GET /skillbridge/employers/{id}/hiring-rate"
      - "POST /skillbridge/internship-matches/{id}/terminate (shared with InstallationAuthority; employer side requires ownership)"
