  - rule_id: boundary_precision_check
    instances:
      - name: food_safety_gate_at_exactly_seventy_and_refrigeration_step_at_twelve
        grounds:
          - calculations.field_kitchen_food_safety_score
          - validations[priority=20]
          - entities.FieldKitchen.fields.food_safety_score
          - errors[ERR_FOOD_SAFETY_SCORE_TOO_LOW]
        distinguishing_aspect: |
          The clearance gate is inclusive at exactly 70: SOLAR + PIPED with 11 refrigeration hours scores
          exactly 70 and clears, while the same kitchen at 5 refrigeration hours scores 55 and is refused,
          and the cold-chain term itself steps at exactly 12 hours so 11 hours scores 70 and 12 hours
          scores 80.
        test_recipe:
          setup:
            - "Incident ${inc_id} is ACTIVE"
            - "FieldKitchen ${fk_id} is UTILITIES_PENDING with power_source SOLAR, water_source PIPED and daily_capacity_meals 800"
          setup_api_calls:
