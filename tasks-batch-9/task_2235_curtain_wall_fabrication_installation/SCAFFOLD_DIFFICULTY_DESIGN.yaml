      assert:
      - 'the 14:00 -> 16:00 request for 1 chamber returns ERR_LAB_CAPACITY_EXCEEDED with HTTP 409: mockup 1 and mockup 2
        already commit 2 of 2 chambers across that interval'
      - the 20:00 -> 06:00 request for 2 chambers returns 201 - window_start equal to mockup 1 window_end is not an intersection
        under half-open comparison
      - MockupTest.${mock4}.chamber_hours == 20 and invoice_cents == 910000 with surcharge_cents 0
      - MockupTest.${mock1}.chamber_hours == 14 and invoice_cents == 781000; MockupTest.${mock2}.chamber_hours == 6 and
