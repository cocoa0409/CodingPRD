      - name: cascading_side_effects_bg_flag_not_in_progress
        claim_type: cascading_side_effects
        grounds: ["state_machines.BackgroundCheck.PENDING_to_FLAGGED", "state_machines.Sitter.BG_CHECK_PENDING_to_SUSPENDED"]
        distinguishing_aspect: "BG_FLAG on a Sitter in BG_CHECK_PENDING (never CLEARED, so never ACTIVE, so no Bookings) executes only links 1+2 of the cascade — Sitter SUSPENDED with empty Booking impact (no REQUESTED bookings exist)."
        test_recipe:
          setup: ["Sitter s_bf in BG_CHECK_PENDING; no Bookings."]
          setup_api_calls:
            - call: "POST /api/v1/sitters/register"
              payload: { email: "sbf@example.com", full_name: "S BF", phone: "+12025559120" }
              as: Anonymous
              captures: { sbf_id: $.data.id }
