      - name: the_coaching_hold_arms_below_seventy_and_re_arms_when_new_points_land
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.driver_safety_score
          - validations[priority 11]
          - errors.ERR_DRIVER_SAFETY_INELIGIBLE
        distinguishing_aspect: "One scalar carries two thresholds with different owners: coaching_hold arms strictly below 70 while bidding and assignment need 80, so the same driver reports ERR_DRIVER_COACHING_HOLD at a score of 66 and ERR_DRIVER_SAFETY_INELIGIBLE at exactly 70 - the code change is the proof that the hold comparison is strict. The smallest charge in the catalogue is 2 points, so 70 and 68 are the adjacent observable states around the threshold, and a single new 2-point event re-arms the hold that coaching had just cleared."
        test_recipe:
          setup:
            - "D-C6 collects 34 open points: SEATBELT sev 3 (12), HARD_BRAKE sev 3 (6), FOLLOWING_DISTANCE sev 3 (6), SPEEDING sev 2 (6) and SEATBELT sev 1 (4). safety_score 66, coaching_hold true."
            - "TRIP-C6 is a stopless DRAFT trip with equipment standing by, so the only possible objection to an assignment is the driver."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FleetPlanner
            - call: "POST /fleet/domiciles"
              payload: { domicile_code: "DOM-C6", region_code: "MIDWEST", tractor_capacity: 20, driver_headcount_target: 10, fixed_ownership_cents_per_day: 10000, overhead_cents_per_day: 3000, dedicated_rate_cents_per_mile: 280, dedicated_rate_cents_per_case: 205 }
