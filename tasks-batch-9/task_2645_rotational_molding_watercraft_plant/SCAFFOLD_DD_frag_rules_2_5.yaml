  # ===========================================================================
  # RULE 2 — combinatorial_formula
  # Three instances in three DIFFERENT §0.5 modes: (b) nested rounding whose
  # order changes the answer, (c) a circular-looking dependency resolved by a
  # pinned evaluation order, (a) four-input non-linear interaction.
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: wall_distribution_nested_rounding_mean_then_sd_then_cv
        grounds:
          - calculations.wall_thickness_distribution
          - calculations.cycle_warpage_index
          - calculations.inspection_verdict
          - entities.FinishedUnit.fields.mean_wall_thickness_mm
          - entities.FinishedUnit.fields.wall_sd_mm
          - entities.FinishedUnit.fields.wall_cv_pct
          - state_machines.FinishedUnit.OUTFITTED_to_SELLABLE
        distinguishing_aspect: |
          This instance is §0.5 Rule 2 MODE (b) — nested rounding where the ORDER of the
          rounding steps changes the answer: wall_thickness_distribution rounds the mean to
          3 dp FIRST, takes the population standard deviation about that ALREADY-ROUNDED mean,
          rounds it to 3 dp, and only then divides the two rounded values, so the six points
          [6.14, 6.00, 6.19, 6.34, 6.18, 6.06] yield wall_cv_pct exactly 1.74 and an
          inspection_verdict of PASS, whereas forming the cv from the unrounded mean
          6.151666... and unrounded sd 0.1074547... yields 1.75, which is > wall_cv_max_pct
          1.74 and would flip the very same hull to REWORK.
        test_recipe:
          setup:
            - "ProductModel PM-WCV-KM: KAYAK/MID, HDPE_LINEAR, nominal_charge_kg 24.000, charge_tolerance_pct 5.00, min_cooling_minutes 30, target_wall_thickness_mm 6.20, wall_thickness_min_mm 4.50, impact_test_min_joules 90.00 and — the pin of this instance — wall_cv_max_pct exactly 1.74."
            - "Mold MLD-WCV-1 for that model, cavity_count 1, nominal_charge_kg 24.000 == 24.000 * 1, service_interval_cycles 10 so CASCADE-B never fires."
            - "OvenStation OV-1 (arm_count 2, max_size_class OVERSIZE, changeover_buffer_min 15, energy_cents_per_min 100) and CoolingBay CB-1 (concurrent_slot_capacity 2, airflow_mode FORCED_AIR), both OPERATIONAL."
            - "Four ACTIVE Technicians: RESIN_TECH with RESIN_BLENDING, MOLDING_OPERATOR, ASSEMBLY_TECH with FIXTURE_ASSEMBLY, QUALITY_INSPECTOR with WALL_GAUGE + IMPACT_RIG — three distinct rows for the operator, the outfitter and the inspector (§1.4 priority 57)."
            - "Warehouse WH-WCV, footprint_capacity_cube_m3 20.0000 in a single zone Z-A of 20.0000; nothing is ever stored, so posture stays NORMAL."
            - "ResinLot LOT-WCV: HDPE_LINEAR, melt_index 4.00, colour exactly the master code SEAFOAM, additive UV12, regrind_pct_by_mass 10.00, cost_cents_per_kg 210, received_kg 500.000, expires_on 2035-12-31 — qualified, so the release gate of PO-WCV passes."
            - "ProductionOrder PO-WCV (ordered_qty 1, no demand_bucket_id) released to READY_TO_SCHEDULE, one MoldingCycle run 09:00 -> 10:00 oven and demolded at 10:35 (actual_cooling_minutes 35 >= min_cooling_minutes 30), so exactly one FinishedUnit exists in build_status DEMOLDED."
            - "That hull is trimmed (trim_waste_kg 0.400) and outfitted with hardware_kit_serial HK-WCV-0001, so build_status is OUTFITTED and inspection_verdict is still PENDING when the trigger runs."
            - "The cycle is scheduled with oven_temp_c 288.0 (thermal_term 0.000), arm_rpm_major 8.00 / arm_rpm_minor 2.00 (rotation_ratio 4.000, rotation_term 0.000) and scheduled_cooling_minutes 30 (cooling_term 0.000), so the ONLY non-zero term available to cycle_warpage_index FINAL is the distribution term derived from the rounded wall_cv_pct."
          setup_api_calls:
            - call: "POST /product-models"
              payload: { model_code: "PM-WCV-KM", hull_type: "KAYAK", size_class: "MID", resin_grade: "HDPE_LINEAR", master_color_code: "SEAFOAM", max_color_delta_e: 1.50, required_additive_package_code: "UV12", max_regrind_pct: 30.00, min_melt_index_g10min: 2.50, max_melt_index_g10min: 6.00, nominal_charge_kg: 24.000, charge_tolerance_pct: 5.00, min_cooling_minutes: 30, target_wall_thickness_mm: 6.20, wall_thickness_min_mm: 4.50, wall_cv_max_pct: 1.74, impact_test_min_joules: 90.00, gross_cube_m3: 2.0000, nest_factor: 0.5000, unit_weight_kg: 24.000, msrp_cents: 180000, warranty_basis: "PRO_RATA_AGE", initial_warranty_reserve_cents: 500000, seasonal_family: "PADDLE" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { pm: $.data.id }
            - call: "POST /molds"
              payload: { mold_code: "MLD-WCV-1", product_model_id: "${pm}", size_class: "MID", cavity_count: 1, nominal_charge_kg: 24.000, service_interval_cycles: 10 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { mold: $.data.id }
            - call: "POST /oven-stations"
              payload: { station_code: "OV-1", arm_count: 2, max_size_class: "OVERSIZE", changeover_buffer_min: 15, energy_cents_per_min: 100 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { station: $.data.id }
            - call: "POST /cooling-bays"
              payload: { bay_code: "CB-1", concurrent_slot_capacity: 2, airflow_mode: "FORCED_AIR" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { bay: $.data.id }
            - call: "POST /technicians"
              payload: { employee_code: "T-RES-1", full_name: "Rita Resin", role_code: "RESIN_TECH", certifications: ["RESIN_BLENDING"] }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { t_res: $.data.id }
            - call: "POST /technicians"
              payload: { employee_code: "T-OPR-1", full_name: "Omar Oven", role_code: "MOLDING_OPERATOR", certifications: [] }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { t_op: $.data.id }
            - call: "POST /technicians"
              payload: { employee_code: "T-ASM-1", full_name: "Ana Assembly", role_code: "ASSEMBLY_TECH", certifications: ["FIXTURE_ASSEMBLY"] }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { t_asm: $.data.id }
            - call: "POST /technicians"
              payload: { employee_code: "T-QCI-1", full_name: "Quinn Quality", role_code: "QUALITY_INSPECTOR", certifications: ["WALL_GAUGE", "IMPACT_RIG"] }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { t_qc: $.data.id }
            - call: "POST /warehouses"
              payload: { site_code: "WH-WCV", footprint_capacity_cube_m3: 20.0000, zones: [{ zone_code: "Z-A", capacity_cube_m3: 20.0000 }], restricted_threshold_pct: 85.00, frozen_threshold_pct: 95.00 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { wh: $.data.id }
            - call: "POST /resin-lots"
              payload: { lot_code: "LOT-WCV", resin_grade: "HDPE_LINEAR", melt_index_g10min: 4.00, color_code: "SEAFOAM", color_delta_e: 0.50, additive_package_code: "UV12", regrind_pct_by_mass: 10.00, cost_cents_per_kg: 210, received_kg: 500.000, expires_on: "2035-12-31" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { lot: $.data.id, lot_v: $.data.version }
            - call: "POST /production-orders"
              payload: { order_code: "PO-WCV", product_model_id: "${pm}", target_warehouse_id: "${wh}", ordered_qty: 1 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { po: $.data.id }
            - call: "POST /production-orders/${po}/release"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { po_v: $.data.version }
            - call: "POST /molding-cycles"
              payload: { production_order_id: "${po}", oven_station_id: "${station}", arm_index: 1, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T09:00:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "FORCED_AIR", expected_production_order_version: "${po_v}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { cyc: $.data.id }
            - call: "POST /resin-charges"
              payload: { molding_cycle_id: "${cyc}", resin_lot_id: "${lot}", charge_kg: 24.000, regrind_kg: 2.400, expected_resin_lot_version: "${lot_v}" }
              as: ResinTechnician
              as_user_id: "${t_res}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /molding-cycles/${cyc}/start-oven"
              payload: { actual_oven_start_at: "2026-08-01T09:00:00Z" }
              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T10:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /molding-cycles/${cyc}/enter-cooling"
              payload: { actual_oven_end_at: "2026-08-01T10:00:00Z" }
              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T10:35:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /molding-cycles/${cyc}/demold"
              payload: { actual_cooling_end_at: "2026-08-01T10:35:00Z" }
              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "GET /finished-units?molding_cycle_id=${cyc}"
              payload: {}
              as: QualityInspector
              as_user_id: "${t_qc}"
              captures: { fu: "$.data[0].id" }
            - call: "POST /finished-units/${fu}/trim"
              payload: { trim_waste_kg: 0.400 }
              as: AssemblyTechnician
              as_user_id: "${t_asm}"
            - call: "POST /finished-units/${fu}/outfit"
              payload: { hardware_kit_serial: "HK-WCV-0001" }
              as: AssemblyTechnician
              as_user_id: "${t_asm}"
          trigger:
            - call: "POST /finished-units/${fu}/inspect"
              payload: { wall_thickness_points: [6.14, 6.00, 6.19, 6.34, 6.18, 6.06], impact_test_joules: 120.00, cosmetic_defect_grade: "A" }
              as: QualityInspector
              as_user_id: "${t_qc}"
            - call: "GET /finished-units/${fu}"
              payload: {}
              as: QualityInspector
              as_user_id: "${t_qc}"
            - call: "GET /production-orders/${po}"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
          assert:
            - "FinishedUnit.${fu}.mean_wall_thickness_mm == 6.152"
            - "FinishedUnit.${fu}.wall_sd_mm == 0.107"
            - "FinishedUnit.${fu}.wall_cv_pct == 1.74"
            - "FinishedUnit.${fu}.min_wall_thickness_mm == 6.00"
            - "FinishedUnit.${fu}.final_warpage_index == 0.000"
            - "FinishedUnit.${fu}.inspection_verdict == \"PASS\""
            - "FinishedUnit.${fu}.build_status == \"SELLABLE\""
            - "FinishedUnit.${fu}.rework_count == 0"
            - "ProductionOrder.${po}.completed_qty == 1"
            - "ProductionOrder.${po}.status == \"COMPLETE\""
            - "the nesting order is falsifiable: an implementation that takes the sd about the UNROUNDED mean and divides UNROUNDED sd by UNROUNDED mean produces wall_cv_pct 1.75, distribution_term round(max(0, 1.75 - 1.74)/10, 3) == 0.001, final_warpage_index 0.001 and inspection_verdict REWORK with build_status REWORK — none of which this instance accepts"

      - name: zone_selector_anchor_affinity_then_remaining_then_promotion
        grounds:
          - calculations.storage_zone_selection
          - calculations.storage_footprint
          - calculations.warehouse_footprint_posture
          - state_machines.FinishedUnit.UNALLOCATED_to_STORED
          - state_machines.FinishedUnit.STORED_to_UNALLOCATED
          - entities.FinishedUnit.fields.is_zone_anchor
          - entities.FinishedUnit.fields.stored_footprint_cube_m3
          - entities.Warehouse.fields.committed_cube_m3
        distinguishing_aspect: |
          This instance is §0.5 Rule 2 MODE (c) — a circular-looking dependency resolved only
          by a pinned evaluation order (NOT the nested-rounding of
          wall_distribution_nested_rounding_mean_then_sd_then_cv): the zone chosen depends on
          candidate_footprint, candidate_footprint depends on anchor_exists(z), and
          anchor_exists(z) depends on which zone earlier units were assigned, so the formula is
          only well defined because storage_zone_selection pins the order
          anchor_exists -> candidate_footprint -> remaining_after -> rank(anchor DESC,
          remaining ASC, zone_code ASC). The pin is observable twice: hull 2 is forced into the
          nearly full Z-A (remaining_after 1.0000) instead of the wholly empty Z-B
          (remaining_after 8.0000), and releasing the Z-A anchor frees 2.0000 of hull footprint
          yet only drops Warehouse.committed_cube_m3 from 6.0000 to 5.0000 because the
          promotion of hull 2 re-charges it the full gross cube.
