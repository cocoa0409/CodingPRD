              payload: { seller_id: "${s_id}", jurisdiction_id: "${ca_id}", customer_ref: "small", customer_exempt_requested: false }
              as: Seller
              as_user_id: "${s_id}"
              captures: { t_id: $.data.id }
            - call: "POST /line-items"
              payload: { transaction_id: "${t_id}", category_code: "TANGIBLE", quantity: 1, unit_price: 7.95 }
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /line-items"
              payload: { transaction_id: "${t_id}", category_code: "TANGIBLE", quantity: 1, unit_price: 7.95 }
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /transactions/${t_id}/settle"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /tax-returns"
              payload: { seller_id: "${s_id}", jurisdiction_id: "${ca_id}", period_start: "2026-02-01T00:00:00Z", period_end: "2026-03-01T00:00:00Z" }
              as: TaxPreparer
              as_user_id: "preparer-1"
              captures: { ret_id: $.data.id }
            - call: "POST /tax-returns/${ret_id}/accept"
              payload: {}
              as: TaxApprover
              as_user_id: "approver-1"
          trigger:
            - call: "POST /transactions/${t_id}/void"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_TRANSACTION_LOCKED"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: certificate_halfopen_overlap_adjacency_allowed
        grounds:
          - validations[priority=8]
          - errors[ERR_CERTIFICATE_OVERLAP]
          - entities.ExemptionCertificate.fields.valid_from
          - entities.ExemptionCertificate.fields.valid_to
        distinguishing_aspect: |
          HALF-OPEN interval semantics on ExemptionCertificate: a second ACTIVE certificate for the same
          (seller,jurisdiction,customer_ref,category) whose [2026-06-01,2026-12-01) overlaps the existing
          [2026-01-01,2026-07-01) is rejected (ERR_CERTIFICATE_OVERLAP), but an ADJACENT window starting exactly
          at the first's valid_to is NOT a conflict for this entity (adjacency allowed).
        test_recipe:
          setup:
            - "CA jurisdiction; ACTIVE seller s; one ACTIVE certificate (b1, TANGIBLE) valid [2026-01-01,2026-07-01)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /tax-jurisdictions"
              payload: { state_code: "CA", sourcing_rule: "DESTINATION", state_rate: 0.0725, local_rate: 0.0100, reduced_rate: 0.02, economic_nexus_sales_threshold: 100000.00, economic_nexus_txn_threshold: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ca_id: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "S", origin_state_code: "CA" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s_id: $.data.id }
            - call: "POST /exemption-certificates"
              payload: { seller_id: "${s_id}", jurisdiction_id: "${ca_id}", customer_ref: "b1", exempt_category_code: "TANGIBLE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-07-01T00:00:00Z" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { cert1_id: $.data.id }
          trigger:
            - call: "POST /exemption-certificates"
              payload: { seller_id: "${s_id}", jurisdiction_id: "${ca_id}", customer_ref: "b1", exempt_category_code: "TANGIBLE", valid_from: "2026-06-01T00:00:00Z", valid_to: "2026-12-01T00:00:00Z" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_CERTIFICATE_OVERLAP"

      - name: return_closed_overlap_adjacency_forbidden
        grounds:
          - validations[priority=9]
          - errors[ERR_RETURN_PERIOD_OVERLAP]
          - entities.TaxReturn.fields.period_start
          - entities.TaxReturn.fields.period_end
        distinguishing_aspect: |
          CLOSED interval semantics (adjacency FORBIDDEN) on a DIFFERENT resource entity TaxReturn: a second
          DRAFT return for the same (seller,jurisdiction) whose [2026-03-01,2026-04-01] starts EXACTLY at the
          existing return's period_end (2026-03-01) is rejected (ERR_RETURN_PERIOD_OVERLAP) — touching endpoints
          collide here, the opposite adjacency treatment from the certificate's half-open rule.
        test_recipe:
          setup:
            - "CA jurisdiction; seller s; one DRAFT CA TaxReturn covering [2026-02-01,2026-03-01]."
          setup_api_calls:
            - call: "POST /tax-jurisdictions"
              payload: { state_code: "CA", sourcing_rule: "DESTINATION", state_rate: 0.0725, local_rate: 0.0100, reduced_rate: 0.02, economic_nexus_sales_threshold: 100000.00, economic_nexus_txn_threshold: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ca_id: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "S", origin_state_code: "CA" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s_id: $.data.id }
            - call: "POST /tax-returns"
              payload: { seller_id: "${s_id}", jurisdiction_id: "${ca_id}", period_start: "2026-02-01T00:00:00Z", period_end: "2026-03-01T00:00:00Z" }
              as: TaxPreparer
              as_user_id: "preparer-1"
              captures: { ret1_id: $.data.id }
          trigger:
            - call: "POST /tax-returns"
              payload: { seller_id: "${s_id}", jurisdiction_id: "${ca_id}", period_start: "2026-03-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z" }
              as: TaxPreparer
              as_user_id: "preparer-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_RETURN_PERIOD_OVERLAP"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: void_restores_cumulative_taxable_sales
        grounds:
          - state_machines.Transaction.PENDING_to_SETTLED
          - state_machines.Transaction.SETTLED_to_VOIDED
          - entities.NexusProfile.fields.cumulative_taxable_sales
          - entities.NexusProfile.fields.cumulative_txn_count
        distinguishing_aspect: |
          Conserved quantity NexusProfile.cumulative_taxable_sales: settling a 7.95-subtotal SELLER transaction
          raises it from 0.00 to 7.95; voiding the same transaction (compensating action) restores it EXACTLY
          to 0.00 and cumulative_txn_count back to 0 — invariant cumulative_taxable_sales == sum over live
          SETTLED SELLER transactions holds (no drift).
        test_recipe:
          setup:
            - "CA jurisdiction; seller s with CA NexusProfile NO_NEXUS, 0.00."
            - "PENDING CA transaction with one TANGIBLE line qty 1 @ 7.95."
          setup_api_calls:
            - call: "POST /tax-jurisdictions"
              payload: { state_code: "CA", sourcing_rule: "DESTINATION", state_rate: 0.0725, local_rate: 0.0100, reduced_rate: 0.02, economic_nexus_sales_threshold: 100000.00, economic_nexus_txn_threshold: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ca_id: $.data.id }
            - call: "POST /product-categories"
              payload: { jurisdiction_id: "${ca_id}", category_code: "TANGIBLE", taxability: "FULL" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /sellers"
              payload: { legal_name: "S", origin_state_code: "CA" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s_id: $.data.id }
            - call: "POST /nexus-profiles"
              payload: { seller_id: "${s_id}", jurisdiction_id: "${ca_id}" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { np_id: $.data.id }
            - call: "POST /transactions"
              payload: { seller_id: "${s_id}", jurisdiction_id: "${ca_id}", customer_ref: "b1", customer_exempt_requested: false }
              as: Seller
              as_user_id: "${s_id}"
              captures: { t_id: $.data.id }
            - call: "POST /line-items"
              payload: { transaction_id: "${t_id}", category_code: "TANGIBLE", quantity: 1, unit_price: 7.95 }
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /transactions/${t_id}/settle"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
          trigger:
            - call: "POST /transactions/${t_id}/void"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
            - call: "GET /nexus-profiles/${np_id}"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
              captures: { cum: $.data.cumulative_taxable_sales, cnt: $.data.cumulative_txn_count }
          assert:
            - "NexusProfile.${np_id}.cumulative_taxable_sales == 0.00"
            - "NexusProfile.${np_id}.cumulative_txn_count == 0"
            - "Transaction.${t_id}.settlement_status == VOIDED"

      - name: void_restores_threshold_posture_when_not_registered
        grounds:
          - state_machines.NexusProfile.NO_NEXUS_to_THRESHOLD_MET
          - state_machines.NexusProfile.THRESHOLD_MET_to_NO_NEXUS
          - calculations.nexus_status
          - entities.NexusProfile.fields.nexus_status
        distinguishing_aspect: |
          A DIFFERENT conserved quantity — the derived nexus POSTURE: a settle to exactly 100000.00 flips
          NO_NEXUS->THRESHOLD_MET; voiding that transaction (compensating action) drops cumulative back below
          threshold and the posture is conserved/restored to NO_NEXUS (because the profile was never REGISTERED),
          proving the posture-restoration invariant distinct from the dollar-balance invariant above.
        test_recipe:
          setup:
            - "CA jurisdiction sales threshold 100000.00; seller s with CA NexusProfile NO_NEXUS."
            - "A SETTLED CA SELLER transaction of subtotal 100000.00 that flipped the profile to THRESHOLD_MET (NOT registered)."
          setup_api_calls:
            - call: "POST /tax-jurisdictions"
              payload: { state_code: "CA", sourcing_rule: "DESTINATION", state_rate: 0.0725, local_rate: 0.0100, reduced_rate: 0.02, economic_nexus_sales_threshold: 100000.00, economic_nexus_txn_threshold: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ca_id: $.data.id }
            - call: "POST /product-categories"
              payload: { jurisdiction_id: "${ca_id}", category_code: "TANGIBLE", taxability: "FULL" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /sellers"
              payload: { legal_name: "S", origin_state_code: "CA" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s_id: $.data.id }
            - call: "POST /nexus-profiles"
              payload: { seller_id: "${s_id}", jurisdiction_id: "${ca_id}" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { np_id: $.data.id }
            - call: "POST /transactions"
              payload: { seller_id: "${s_id}", jurisdiction_id: "${ca_id}", customer_ref: "b1", customer_exempt_requested: false }
              as: Seller
              as_user_id: "${s_id}"
              captures: { t_id: $.data.id }
            - call: "POST /line-items"
              payload: { transaction_id: "${t_id}", category_code: "TANGIBLE", quantity: 1, unit_price: 100000.00 }
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /transactions/${t_id}/settle"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
          trigger:
            - call: "POST /transactions/${t_id}/void"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
            - call: "GET /nexus-profiles/${np_id}"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
              captures: { st: $.data.nexus_status, cum: $.data.cumulative_taxable_sales }
          assert:
            - "NexusProfile.${np_id}.nexus_status == NO_NEXUS"
            - "NexusProfile.${np_id}.cumulative_taxable_sales == 0.00"
