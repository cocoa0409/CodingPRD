            - "CertificateCondition.${cond2}.status == ACTIVE"
            - "Certificate.${cert}.compliance_index_rolling == 100.00"

      - name: condition_waiver_by_the_developer_unauthorized
        claim_type: unauthorized_operation_denied
        grounds:
          - roles.CommissionStaff.exclusive_operations
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "Only the commission may relax its own order: the Developer's waiver attempt returns ERR_UNAUTHORIZED (403) and the crew-limit condition stays ACTIVE, so the aggregate crew cap remains 9."
        test_recipe:
          setup:
            - "Certificate ISSUED/ACTIVE with an ACTIVE ENG-CREW-1 crew-limit condition"
          setup_api_calls: *cCERT
          trigger:
            - call: "POST /siting/certificate-conditions/${cond3}/waiver"
              payload: { waiver_reason: "Schedule pressure" }
              as: Developer
              as_user_id: "dev-nora"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_UNAUTHORIZED"
            - "CertificateCondition.${cond3}.status == ACTIVE"
            - "CertificateCondition.${cond3}.crew_limit == 9"

      - name: federal_permit_action_by_commission_staff_unauthorized
        claim_type: unauthorized_operation_denied
        grounds:
          - roles.FederalPermitOfficer.exclusive_operations
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "State staff cannot act on a federal crossing: the permit action is refused with ERR_UNAUTHORIZED (403) and the segment's permit dimension stays REQUIRED."
        test_recipe:
          setup:
            - "Segment 2 crosses a NAVIGABLE_WATERWAY with permit status REQUIRED"
          setup_api_calls:
