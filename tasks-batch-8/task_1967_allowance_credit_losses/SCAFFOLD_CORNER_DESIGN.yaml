  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_run_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[ma-create-stale-run]"]
        distinguishing_aspect: "After a successful adjustment creation bumps the run version, a second create carrying the previously observed version is rejected with ERR_STALE_VERSION (412); no row is created."
        test_recipe:
          setup: ["Run 2026-Q1 EXECUTED; version captured at execute"]
          setup_api_calls:
            - call: "POST /cecl/loss-models"
              payload: { name: "CECL-LR", method: LOSS_RATE, forecast_period_quarters: 2, reversion_method: IMMEDIATE, reversion_period_quarters: 0, historical_lookback_quarters: 8 }
              as: ModelValidator
              captures: { m_id: $.data.id }
            - call: "POST /cecl/loss-models/${m_id}/activate"
              payload: {}
              as: ModelValidator
            - call: "POST /cecl/portfolio-segments"
              payload: { segment_code: "CC-PRIME-2024", name: "Prime Cards", product_type: CREDIT_CARD, risk_rating_band: PRIME, vintage_year: 2024 }
              as: CreditAnalyst
              captures: { seg_id: $.data.id }
            - call: "POST /cecl/loans"
              payload: { segment_id: "${seg_id}", loan_number: "LN-OC", amortized_cost_cents: 1000000, risk_rating: PASS }
              as: CreditAnalyst
            - call: "POST /cecl/economic-scenarios"
              payload: { name: "Baseline", scenario_type: BASELINE, unemployment_rate_bps: 500, gdp_growth_bps: 200, effective_from_period: "2026-Q1", effective_to_period: "2027-Q1" }
              as: ModelValidator
              captures: { sc_base: $.data.id }
            - call: "POST /cecl/model-runs"
              payload: { as_of_period: "2026-Q1", loss_model_id: "${m_id}", scenario_weights: [ { scenario_id: "${sc_base}", weight_bps: 10000 } ] }
              as: CreditAnalyst
              captures: { run_id: $.data.id }
            - call: "POST /cecl/model-runs/${run_id}/execute"
              payload: {}
              as: CreditAnalyst
              captures: { rv: $.data.version }
          trigger:
            - call: "POST /cecl/model-runs/${run_id}/management-adjustments"
              payload: { amount_cents: 100, rationale: "First overlay", expected_model_run_version: "${rv}" }
              as: CreditAnalyst
              captures: { ma1: $.data.id }
            - call: "POST /cecl/model-runs/${run_id}/management-adjustments"
              payload: { amount_cents: 200, rationale: "Stale overlay", expected_model_run_version: "${rv}" }
              as: CreditAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "First create succeeds (version matched ${rv}) -> ${ma1} exists"
            - "Second create with the same observed version -> error_id == ERR_STALE_VERSION (${err}); http 412"
            - "GET /cecl/model-runs/${run_id}/management-adjustments returns exactly 1 row"

      - name: occ_stale_evaluation_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[evaluation-update-stale]"]
        distinguishing_aspect: "Two sequential PATCHes carrying the same observed evaluation version: the first succeeds (version advances), the second is rejected with ERR_EVALUATION_STALE_VERSION (412)."
        test_recipe:
          setup: ["Run EXECUTED with one DRAFT evaluation (version captured from list)"]
          setup_api_calls:
            - call: "POST /cecl/loss-models"
              payload: { name: "CECL-LR", method: LOSS_RATE, forecast_period_quarters: 2, reversion_method: IMMEDIATE, reversion_period_quarters: 0, historical_lookback_quarters: 8 }
              as: ModelValidator
              captures: { m_id: $.data.id }
            - call: "POST /cecl/loss-models/${m_id}/activate"
              payload: {}
              as: ModelValidator
            - call: "POST /cecl/portfolio-segments"
              payload: { segment_code: "SB-SUB-2023", name: "SmallBiz Subprime", product_type: SMALL_BUSINESS, risk_rating_band: SUBPRIME, vintage_year: 2023 }
              as: CreditAnalyst
              captures: { seg_id: $.data.id }
            - call: "POST /cecl/loans"
              payload: { segment_id: "${seg_id}", loan_number: "LN-OE", amortized_cost_cents: 500000, risk_rating: SUBSTANDARD, collateral_value_cents: 460000 }
              as: CreditAnalyst
            - call: "POST /cecl/economic-scenarios"
              payload: { name: "Baseline", scenario_type: BASELINE, unemployment_rate_bps: 500, gdp_growth_bps: 200, effective_from_period: "2026-Q1", effective_to_period: "2027-Q1" }
              as: ModelValidator
              captures: { sc_base: $.data.id }
            - call: "POST /cecl/model-runs"
              payload: { as_of_period: "2026-Q1", loss_model_id: "${m_id}", scenario_weights: [ { scenario_id: "${sc_base}", weight_bps: 10000 } ] }
              as: CreditAnalyst
              captures: { run_id: $.data.id }
            - call: "POST /cecl/model-runs/${run_id}/execute"
              payload: {}
              as: CreditAnalyst
            - call: "GET /cecl/individual-evaluations"
              payload: { run_id: "${run_id}" }
              as: CreditAnalyst
              captures: { ie_id: "$.data[0].id", ie_v: "$.data[0].version" }
          trigger:
            - call: "PATCH /cecl/individual-evaluations/${ie_id}"
              payload: { expected_evaluation_version: "${ie_v}", analysis_notes: "Initial analysis notes documented here with sufficient detail." }
              as: CreditAnalyst
              captures: { v2: $.data.version }
            - call: "PATCH /cecl/individual-evaluations/${ie_id}"
              payload: { expected_evaluation_version: "${ie_v}", collateral_value_cents: 400000 }
              as: CreditAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "First PATCH succeeds: version advances (${v2} == ${ie_v} + 1)"
            - "Second PATCH with stale version -> error_id == ERR_EVALUATION_STALE_VERSION (${err}); http 412"
            - "Evaluation collateral_value_cents remains 460000 (stale write not applied)"

      - name: version_increments_on_each_mutation
        claim_type: optimistic_concurrency
        grounds: [entities.ModelRun, "concurrency_rules[ma-create-stale-run]"]
        distinguishing_aspect: "ModelRun.version starts at 1 and increments by exactly 1 on each mutation: create -> 1, execute -> 2, submit_for_review -> 3."
