scenario: "2192. Certified Payroll & Prevailing Wage Compliance (public works contractor): wage determination assignment by classification & locality, apprentice ratio & registered program verification, weekly certified payroll submission & statement of compliance, fringe benefit credit calculation vs cash payment, on-site interview & audit response, restitution for underpayment & debarment risk, subcontractor payroll collection & review, project-specific reporting portals"
domain_name: "certified-payroll-prevailing-wage-compliance"
api_prefix: "/"
# Flat, multi-root API: every collection (`/projects`, `/contractors`,
# `/wage-determinations`, `/payroll-submissions`, `/findings`, `/interviews`,
# `/restitution-payments`, ...) hangs directly off the root because the graph has no
# single owning aggregate -- agency-side rows (determinations, portals, findings,
# interviews) and contractor-side rows (payrolls, workers, restitution) are peers.

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: graph
  # Graph, not hierarchy: WageDetermination self-supersedes, Contractor self-nests by
  # tier, ContractAssignment self-nests via upper_tier_assignment_id, PayrollSubmission
  # self-supersedes, and PayrollLine joins Worker x WageRate x FringeBenefitPlan across
  # three aggregate boundaries.
  state_machine_shape: parallel
  # PayrollSubmission carries two independent axes (workflow_status x compliance_status);
  # Finding is cyclic (RESPONSE_REJECTED -> RESPONSE_SUBMITTED); OnSiteInterview is a
  # fork-join with divergent side-effect sets; Project posture is compound/derived.
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  # The ContractorStaff member who prepared a payroll may not certify it, and the
  # AgencyComplianceOfficer who accepted a submission may not adjudicate a Finding
  # raised against that same submission.
  consistency_model: immediate
  difficulty_level: expert_plus
  target_counts:
    entities: 15
    state_machines: 6
    calculations: 8
    endpoints: 42
    errors: 40

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: ReportingPortal
    parent: null
    common_fields: false
    fields:
      - name: portal_code
        type: string
        source: input
        description: Short code of the project-specific reporting portal (e.g. LCPTRACKER_CA).
        constraints: unique across all portals, 3-40 chars
      - name: submission_format
        type: enum
        source: input
        description: Wire format the portal accepts for a weekly certified payroll.
        constraints: one of {WH347_PDF, XML_LCP, CSV_FLAT}
      - name: cutoff_offset_days
        type: integer
        source: input
        description: Whole days after week_ending_date at which the portal's filing window closes.
        constraints: 1..21
      - name: grace_hours
        type: integer
        source: input
        description: Extra hours appended to the cutoff instant before a filing counts as late.
        default: 0
        constraints: 0..72
      - name: requires_notarized_statement
        type: boolean
        source: input
        description: When true, certification requires notary_reference_number to be present.
        default: false

  - name: WageDetermination
    parent: null
    common_fields: true
    fields:
      - name: decision_number
        type: string
        source: input
        description: Published wage decision number (e.g. CA20260014).
        constraints: unique per (decision_number, modification_number)
      - name: modification_number
        type: integer
        source: input
        description: Modification sequence of the published decision.
        default: 0
        constraints: ">= 0"
      - name: locality_code
        type: string
        source: input
        description: County/locality the determination governs (e.g. CA-ALAMEDA).
        constraints: uppercase, 4-24 chars
      - name: effective_date
        type: datetime
        source: input
        description: Inclusive instant from which this determination governs its locality.
      - name: expiry_date
        type: datetime
        source: input
        description: "Optional EXCLUSIVE instant at which this determination stops governing, so the governing interval is the half-open [effective_date, expiry_date). Null means open-ended. Being superseded overwrites it with the successor's effective_date. A determination whose declared expiry has already passed still keeps status ACTIVE until a successor supersedes it."
        constraints: "when present, strictly after effective_date"
      - name: status
        type: enum
        source: system
        description: Lifecycle state of the determination.
        default: DRAFT
        constraints: one of {DRAFT, ACTIVE, SUPERSEDED}
      - name: superseded_by_id
        type: string
        source: computed
        description: "FK -> WageDetermination.id; self-referential successor link, null while this determination is the governing one for its locality."
      - name: rate_count
        type: integer
        source: computed
        description: Number of WageRate rows attached to this determination.
        default: 0

  - name: WageRate
    parent: WageDetermination
    common_fields: false
    fields:
      - name: wage_determination_id
        type: string
        source: input
        description: "FK -> WageDetermination.id; owning determination."
      - name: classification_code
        type: string
        source: input
        description: Craft classification the rate applies to (e.g. ELEC-INSIDE-JW).
        constraints: unique per (wage_determination_id, classification_code, zone_code)
      - name: trade_code
        type: string
        source: input
        description: Trade family used for apprentice-ratio grouping (e.g. ELEC).
        constraints: uppercase, 2-12 chars
      - name: zone_code
        type: string
        source: input
        description: Travel/zone band this rate row applies to.
        default: BASE
        constraints: one of {BASE, ZONE1, ZONE2}
      - name: base_hourly_rate_cents
        type: integer
        source: input
        description: Required straight-time basic hourly rate in whole cents.
        constraints: ">= 1"
      - name: fringe_hourly_rate_cents
        type: integer
        source: input
        description: Required hourly fringe benefit amount in whole cents.
        constraints: ">= 0"
      - name: zone_adjustment_cents
        type: integer
        source: input
        description: Cents added to base_hourly_rate_cents when the project zone matches zone_code.
        default: 0
        constraints: ">= 0"
      - name: apprentice_scale_pct
        type: array
        source: input
        description: Ordered percentages of base rate by apprentice period; index 0 is period 1.
        constraints: 1..8 integers each in 30..100, strictly non-decreasing

  - name: Contractor
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered legal name of the contractor.
        constraints: unique, 2-120 chars
      - name: parent_contractor_id
        type: string
        source: input
        description: "FK -> Contractor.id; self-referential corporate parent, null for an independent firm."
      - name: dir_registration_number
        type: string
        source: input
        description: Public-works contractor registration number.
        constraints: unique
      - name: registration_status
        type: enum
        source: input
        description: Public-works registration standing.
        default: REGISTERED
        constraints: one of {REGISTERED, LAPSED}
      - name: debarment_status
        type: enum
        source: system
        description: Debarment standing driven by debarment_risk_score thresholds.
        default: CLEAR
        constraints: one of {CLEAR, PROPOSED, DEBARRED}
      - name: debarment_risk_score
        type: integer
        source: computed
        description: 0-100 weighted risk score recomputed by calculations.debarment_risk_score.
        default: 0
      - name: last_finding_at
        type: datetime
        source: system
        description: Logical-clock instant at which the most recent Finding against this contractor was raised; null when none.
      - name: open_critical_finding_count
        type: integer
        source: computed
        description: Count of Findings against this contractor whose severity is CRITICAL and status is in {OPEN, RESPONSE_SUBMITTED, RESPONSE_REJECTED}.
        default: 0
      - name: outstanding_restitution_cents
        type: integer
        source: computed
        description: Sum of restitution_outstanding_cents across all non-terminal Findings against this contractor.
        default: 0

  - name: ContractorStaff
    parent: Contractor
    common_fields: false
    fields:
      - name: contractor_id
        type: string
        source: input
        description: "FK -> Contractor.id; employing contractor."
      - name: full_name
        type: string
        source: input
        description: Staff member's name as printed on the statement of compliance.
      - name: capability
        type: enum
        source: input
        description: Which certified-payroll duties this staff member is authorised to perform.
        constraints: one of {PREPARER, CERTIFIER, BOTH}
      - name: notary_reference_number
        type: string
        source: input
        description: Notary commission reference; required when certifying on a portal with requires_notarized_statement true.

  - name: ApprenticeProgram
    parent: null
    common_fields: true
    fields:
      - name: registration_number
        type: string
        source: input
        description: State/federal apprenticeship program registration number.
        constraints: unique
      - name: sponsor_name
        type: string
        source: input
        description: Name of the sponsoring joint apprenticeship committee or employer.
      - name: trade_code
        type: string
        source: input
        description: Trade family the program covers; must match WageRate.trade_code for ratio grouping.
        constraints: uppercase, 2-12 chars
      - name: registration_status
        type: enum
        source: input
        description: Program standing; only REGISTERED programs support apprentice-rate payroll lines.
        default: REGISTERED
        constraints: one of {REGISTERED, PROVISIONAL, LAPSED}
      - name: allowed_apprentice_hours_per_100_journey
        type: integer
        source: input
        description: Apprentice hours permitted per 100 journeyworker hours of the same trade_code in one payroll week.
        constraints: 1..100
      - name: period_count
        type: integer
        source: input
        description: Number of apprentice periods the program defines; bounds Worker.apprentice_period.
        constraints: 1..8

  - name: FringeBenefitPlan
    parent: Contractor
    common_fields: true
    fields:
      - name: contractor_id
        type: string
        source: input
        description: "FK -> Contractor.id; contributing contractor."
      - name: plan_name
        type: string
        source: input
        description: Name of the benefit plan or trust.
        constraints: unique per contractor_id
      - name: plan_type
        type: enum
        source: input
        description: Funding character of the plan; drives creditability.
        constraints: one of {BONA_FIDE_TRUST, UNFUNDED, CASH_IN_LIEU}
      - name: annual_contribution_cents
        type: integer
        source: input
        description: Total dollars contributed to the plan over the annualization year, in whole cents.
        constraints: ">= 0"
      - name: annual_total_hours
        type: number
        source: input
        description: All hours worked by covered employees in the annualization year, public and private work combined.
        constraints: "> 0, 2 decimal places"
      - name: annual_public_works_hours
        type: number
        source: input
        description: Subset of annual_total_hours performed on covered public works.
        constraints: "> 0, <= annual_total_hours, 2 decimal places"
      - name: approval_status
        type: enum
        source: system
        description: Agency approval standing for crediting this plan.
        default: PENDING_APPROVAL
        constraints: one of {PENDING_APPROVAL, APPROVED, REJECTED}
      - name: annualized_credit_cents
        type: integer
        source: computed
        description: Authoritative hourly credit from calculations.fringe_hourly_credit variant ANNUALIZED_ALL_HOURS.
        default: 0
      - name: claimed_credit_cents
        type: integer
        source: computed
        description: Contractor-facing hourly credit from calculations.fringe_hourly_credit variant COVERED_HOURS_ONLY.
        default: 0

  - name: Project
    parent: null
    common_fields: true
    fields:
      - name: project_name
        type: string
        source: input
        description: Public works project name.
        constraints: unique, 2-120 chars
      - name: awarding_agency
        type: string
        source: input
        description: Public body that awarded the contract.
      - name: locality_code
        type: string
        source: input
        description: County/locality of the work site; must equal the assigned determination's locality_code.
        constraints: uppercase, 4-24 chars
      - name: zone_code
        type: string
        source: input
        description: Travel zone of the work site, selecting which WageRate zone row applies.
        default: BASE
        constraints: one of {BASE, ZONE1, ZONE2}
      - name: wage_determination_id
        type: string
        source: input
        description: "FK -> WageDetermination.id; determination locked to this project at award."
      - name: reporting_portal_id
        type: string
        source: input
        description: "FK -> ReportingPortal.id; portal that receives weekly certified payroll for this project."
      - name: funding_source
        type: enum
        source: input
        description: Which prevailing-wage regime governs.
        constraints: one of {FEDERAL_DAVIS_BACON, STATE_ONLY, DUAL}
      - name: contract_award_date
        type: datetime
        source: input
        description: Award instant; determination effective_date must be at or before this instant.
      - name: status
        type: enum
        source: system
        description: Project lifecycle state.
        default: AWARDED
        constraints: one of {AWARDED, ACTIVE, SUBSTANTIALLY_COMPLETE, CLOSED}
      - name: posture
        type: enum
        source: computed
        description: Derived compliance posture from calculations.project_posture; gates child payroll and closeout operations.
        default: OPEN
        constraints: one of {OPEN, RESTRICTED, FROZEN}
      - name: open_finding_count
        type: integer
        source: computed
        description: Count of Findings on this project whose status is in {OPEN, RESPONSE_SUBMITTED, RESPONSE_REJECTED}.
        default: 0
      - name: open_critical_finding_count
        type: integer
        source: computed
        description: Subset of open_finding_count whose severity is CRITICAL.
        default: 0
      - name: outstanding_restitution_cents
        type: integer
        source: computed
        description: Sum of restitution_outstanding_cents over the Findings counted by open_finding_count.
        default: 0
      - name: suspended_assignment_count
        type: integer
        source: computed
        description: Count of ContractAssignments on this project whose status is SUSPENDED.
        default: 0

  - name: ContractAssignment
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the public works project."
      - name: contractor_id
        type: string
        source: input
        description: "FK -> Contractor.id; the prime or subcontractor performing work."
      - name: upper_tier_assignment_id
        type: string
        source: input
        description: "FK -> ContractAssignment.id; self-referential link to the assignment that awarded this subcontract; null for the prime (tier 0)."
      - name: tier
        type: integer
        source: computed
        description: 0 for the prime; otherwise upper tier's tier + 1.
        constraints: 0..4
      - name: subcontract_amount_cents
        type: integer
        source: input
        description: Value of this tier's scope in whole cents.
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: Assignment participation state.
        default: INVITED
        constraints: one of {INVITED, ACTIVE, SUSPENDED, TERMINATED}
      - name: cumulative_certified_hours
        type: number
        source: computed
        description: Conserved ledger of hours carried by ACCEPTED PayrollSubmissions on this assignment, maintained by calculations.certified_hours_ledger.
        default: 0
      - name: cumulative_restitution_cents
        type: integer
        source: computed
        description: Sum of DISBURSED RestitutionPayment.amount_cents across Findings whose payroll_submission_id belongs to this assignment.
        default: 0
      - name: open_finding_count
        type: integer
        source: computed
        description: Count of Findings on this assignment's submissions whose status is in {OPEN, RESPONSE_SUBMITTED, RESPONSE_REJECTED}.
        default: 0

  - name: Worker
    parent: null
    common_fields: true
    fields:
      - name: employer_contractor_id
        type: string
        source: input
        description: "FK -> Contractor.id; employing contractor of record."
      - name: worker_number
        type: string
        source: input
        description: Payroll identifier printed on the WH-347 in place of the SSN.
        constraints: unique per employer_contractor_id
      - name: full_name
        type: string
        source: input
        description: Worker's name as reported on certified payroll.
      - name: default_classification_code
        type: string
        source: input
        description: Classification normally reported for this worker.
      - name: apprentice_program_id
        type: string
        source: input
        description: "FK -> ApprenticeProgram.id; enrolling program, null for a journeyworker."
      - name: apprentice_period
        type: integer
        source: input
        description: 1-based apprentice period selecting apprentice_scale_pct; null for a journeyworker.
        constraints: 1..8 and <= program.period_count when apprentice_program_id is set
      - name: interview_count
        type: integer
        source: computed
        description: Count of OnSiteInterviews on this worker whose status is in {CONDUCTED_MATCHED, CONDUCTED_DISCREPANT}.
        default: 0

  - name: PayrollSubmission
    parent: ContractAssignment
    common_fields: true
    fields:
      - name: contract_assignment_id
        type: string
        source: input
        description: "FK -> ContractAssignment.id; the tier whose payroll this is."
      - name: week_ending_date
        type: datetime
        source: input
        description: Saturday 00:00:00Z closing the 7-day payroll week; the covered interval is [week_ending_date - 6 days, week_ending_date] inclusive on both ends.
        constraints: must be a Saturday at 00:00:00.000Z
      - name: prepared_by_staff_id
        type: string
        source: input
        description: "FK -> ContractorStaff.id; staff member who assembled the payroll."
      - name: certified_by_staff_id
        type: string
        source: system
        description: "FK -> ContractorStaff.id; staff member who signed the statement of compliance; null until certification."
      - name: superseded_submission_id
        type: string
        source: input
        description: "FK -> PayrollSubmission.id; self-referential link to the RETURNED submission this one replaces; null for a first filing."
      - name: no_work_performed
        type: boolean
        source: input
        description: True when the tier performed no covered work in the week; permits a zero-line payroll.
        default: false
      - name: workflow_status
        type: enum
        source: system
        description: Filing axis of the parallel state machine.
        default: DRAFT
        constraints: one of {DRAFT, PENDING_CERTIFICATION, SUBMITTED, UNDER_REVIEW, ACCEPTED, RETURNED}
      - name: compliance_status
        type: enum
        source: system
        description: Compliance axis of the parallel state machine; evolves independently of workflow_status.
        default: UNVERIFIED
        constraints: one of {UNVERIFIED, COMPLIANT, DEFICIENT, RESTITUTION_PENDING, REMEDIED}
      - name: statement_signed_at
        type: datetime
        source: system
        description: Logical-clock instant the statement of compliance was signed; null until certification.
      - name: notary_reference_number
        type: string
        source: input
        description: Notary reference captured at certification when the portal requires notarization.
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock instant the payroll was transmitted to the portal; null until submission.
      - name: filing_due_at
        type: datetime
        source: computed
        description: Portal deadline instant from calculations.portal_filing_deadline.
      - name: is_late
        type: boolean
        source: computed
        description: True when submitted_at > filing_due_at; equality is on time.
        default: false
      - name: accepted_by_user_id
        type: string
        source: system
        description: Opaque AgencyComplianceOfficer X-User-ID that accepted this submission; null until acceptance.
      - name: total_hours_reported
        type: number
        source: computed
        description: Sum of (straight_hours + overtime_hours) over this submission's PayrollLines.
        default: 0
      - name: straight_time_underpayment_cents
        type: integer
        source: computed
        description: Portal preliminary screen total from calculations.underpayment_restitution variant STRAIGHT_TIME_ONLY.
        default: 0
      - name: make_whole_underpayment_cents
        type: integer
        source: computed
        description: Authoritative restitution total from calculations.underpayment_restitution variant FULL_MAKE_WHOLE.
        default: 0
      - name: excess_apprentice_hours
        type: number
        source: computed
        description: Apprentice hours beyond the permitted ratio for this week from calculations.apprentice_ratio_compliance.
        default: 0

  - name: PayrollLine
    parent: PayrollSubmission
    common_fields: false
    fields:
      - name: payroll_submission_id
        type: string
        source: input
        description: "FK -> PayrollSubmission.id; owning weekly payroll."
      - name: worker_id
        type: string
        source: input
        description: "FK -> Worker.id; the worker this line reports."
      - name: fringe_plan_id
        type: string
        source: input
        description: "FK -> FringeBenefitPlan.id; plan whose hourly credit is claimed on this line; null when all fringe is paid in cash."
      - name: classification_code
        type: string
        source: input
        description: Classification actually reported for the week; need not equal the worker's default.
      - name: straight_hours
        type: number
        source: input
        description: Hours at or below 40 for the week.
        constraints: ">= 0, <= 40, 2 decimal places"
      - name: overtime_hours
        type: number
        source: input
        description: Hours above 40 for the week.
        constraints: ">= 0, 2 decimal places"
      - name: base_rate_paid_cents
        type: integer
        source: input
        description: Straight-time cash hourly rate actually paid, in whole cents.
        constraints: ">= 0"
      - name: overtime_rate_paid_cents
        type: integer
        source: input
        description: Overtime cash hourly rate actually paid, in whole cents; ignored when overtime_hours is 0.
        default: 0
        constraints: ">= 0"
      - name: fringe_cash_paid_cents
        type: integer
        source: input
        description: Fringe amount paid in cash per hour, in whole cents.
        default: 0
        constraints: ">= 0"
      - name: reported_as_apprentice
        type: boolean
        source: input
        description: True when the contractor claims the apprentice scale for this line.
        default: false
      - name: required_base_cents
        type: integer
        source: computed
        description: Required hourly basic rate from calculations.required_prevailing_rate.
        default: 0
      - name: required_fringe_cents
        type: integer
        source: computed
        description: Required hourly fringe amount from calculations.required_prevailing_rate.
        default: 0
      - name: creditable_fringe_cents
        type: integer
        source: computed
        description: Hourly fringe credit actually allowed on this line from calculations.creditable_fringe_per_line.
        default: 0
      - name: reclassified_journey_hours
        type: number
        source: computed
        description: Portion of this line's hours repriced at the journeyworker rate because the week exceeded the apprentice ratio.
        default: 0
      - name: line_underpayment_cents
        type: integer
        source: computed
        description: Per-line make-whole deficiency in whole cents from calculations.underpayment_restitution.
        default: 0

  - name: OnSiteInterview
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; project whose site was visited."
      - name: contract_assignment_id
        type: string
        source: input
        description: "FK -> ContractAssignment.id; tier the interviewed worker was performing under."
      - name: worker_id
        type: string
        source: input
        description: "FK -> Worker.id; worker interviewed."
      - name: window_start
        type: datetime
        source: input
        description: Inclusive start instant of the interview window.
      - name: window_end
        type: datetime
        source: input
        description: Exclusive end instant of the interview window; window is half-open [window_start, window_end).
      - name: observed_classification_code
        type: string
        source: system
        description: Classification the auditor observed the worker performing; null until conducted.
      - name: observed_hourly_rate_cents
        type: integer
        source: system
        description: Cash rate the worker stated, in whole cents; null until conducted.
      - name: status
        type: enum
        source: system
        description: Interview state; the fork at conduct time selects divergent side effects.
        default: SCHEDULED
        constraints: one of {SCHEDULED, CONDUCTED_MATCHED, CONDUCTED_DISCREPANT, CANCELLED}
      - name: compared_submission_id
        type: string
        source: system
        description: "FK -> PayrollSubmission.id; ACCEPTED submission whose covered week contains window_start and that the observation was compared against; null until conducted."

  - name: Finding
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; project the finding is recorded against."
      - name: payroll_submission_id
        type: string
        source: input
        description: "FK -> PayrollSubmission.id; submission the finding cites."
      - name: worker_id
        type: string
        source: input
        description: "FK -> Worker.id; affected worker; null for a submission-level finding."
      - name: source_interview_id
        type: string
        source: system
        description: "FK -> OnSiteInterview.id; interview that generated this finding; null for an auditor-raised finding."
      - name: finding_type
        type: enum
        source: input
        description: Nature of the deficiency.
        constraints: one of {UNDERPAYMENT, MISCLASSIFICATION, APPRENTICE_RATIO, FRINGE_CREDIT, MISSING_PAYROLL}
      - name: severity
        type: enum
        source: input
        description: Severity band driving posture and risk scoring.
        constraints: one of {MINOR, MAJOR, CRITICAL}
      - name: restitution_required_cents
        type: integer
        source: input
        description: Total back-wage obligation the finding imposes, in whole cents; conserved quantity of the restitution ledger.
        constraints: ">= 0"
      - name: restitution_outstanding_cents
        type: integer
        source: computed
        description: restitution_required_cents minus the sum of DISBURSED RestitutionPayment.amount_cents on this finding.
        default: 0
      - name: status
        type: enum
        source: system
        description: Adjudication state; RESPONSE_REJECTED cycles back to RESPONSE_SUBMITTED.
        default: OPEN
        constraints: one of {OPEN, RESPONSE_SUBMITTED, RESPONSE_REJECTED, RESPONSE_ACCEPTED, WITHDRAWN}
      - name: response_round
        type: integer
        source: computed
        description: Number of times a response has been submitted on this finding.
        default: 0
      - name: raised_by_user_id
        type: string
        source: system
        description: Opaque LaborStandardsAuditor X-User-ID that raised the finding.
      - name: response_due_at
        type: datetime
        source: computed
        description: Logical-clock instant by which a response is due; raise instant + RESPONSE_WINDOW_DAYS.
      - name: response_narrative
        type: string
        source: input
        description: Latest contractor response text; null until a response is filed.

  - name: RestitutionPayment
    parent: Finding
    common_fields: true
    fields:
      - name: finding_id
        type: string
        source: input
        description: "FK -> Finding.id; the obligation this payment satisfies."
      - name: worker_id
        type: string
        source: input
        description: "FK -> Worker.id; payee."
      - name: amount_cents
        type: integer
        source: input
        description: Back-wage amount in whole cents.
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: Disbursement state; REVERSED restores the finding's outstanding balance exactly.
        default: PENDING
        constraints: one of {PENDING, DISBURSED, REVERSED, VOIDED}
      - name: disbursed_at
        type: datetime
        source: system
        description: Logical-clock instant of disbursement; null until DISBURSED.
      - name: reversal_reason
        type: string
        source: input
        description: Reason recorded when an auditor reverses a disbursement; null otherwise.

state_machines:
  - entity: WageDetermination
    state_field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    shape: linear_with_supersede_cascade
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /wage-determinations/{id}/activate"
        actor: PortalAdmin
        preconditions:
          - "determination.rate_count >= 1"
          - "no other WageDetermination with the same locality_code and status in {ACTIVE, SUPERSEDED} has a half-open governing interval [effective_date, expiry_date or +infinity) that intersects this determination's own half-open interval, unless that determination's id is supplied as supersedes_determination_id"
          - "when supersedes_determination_id is supplied: that determination has status == ACTIVE, the same locality_code, and effective_date strictly before this determination's effective_date"
        side_effects:
          - "sets status = ACTIVE"
          - "increments WageDetermination.version by 1"
          - "when supersedes_determination_id is supplied, drives the predecessor ACTIVE_to_SUPERSEDED transition"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system event: a successor determination for the same locality_code completes DRAFT_to_ACTIVE naming this determination as supersedes_determination_id"
        actor: system
        preconditions:
          - "determination.status == ACTIVE"
        side_effects:
          - "sets status = SUPERSEDED, superseded_by_id = successor.id, expiry_date = successor.effective_date"
          - "increments WageDetermination.version by 1"
          - "CASCADE HOP 2 (caused by this SUPERSEDED transition, not by the activate call): every Project with wage_determination_id == this determination and status == AWARDED is re-pointed to superseded_by_id and its version incremented"
          - "CASCADE HOP 3 (caused by hop 2's re-point): every PayrollSubmission on a re-pointed Project whose workflow_status is in {DRAFT, PENDING_CERTIFICATION} has each of its PayrollLine.required_base_cents / required_fringe_cents / creditable_fringe_cents / line_underpayment_cents recomputed against the successor's WageRate rows, and its straight_time_underpayment_cents / make_whole_underpayment_cents refreshed"

  - entity: Contractor
    state_field: debarment_status
    initial_state: CLEAR
    terminal_states: [DEBARRED]
    shape: cyclic
    transitions:
      - from: CLEAR
        to: PROPOSED
        trigger: "system event: calculations.debarment_risk_score result >= DEBARMENT_PROPOSAL_THRESHOLD after any Finding or RestitutionPayment mutation touching this contractor"
        actor: system
        preconditions:
          - "contractor.debarment_status == CLEAR"
          - "recomputed debarment_risk_score >= 70"
        side_effects:
          - "sets debarment_status = PROPOSED"
          - "increments Contractor.version by 1"
          - "CASCADE HOP 3 (caused by this PROPOSED transition, not by the Finding creation): every ContractAssignment of this contractor with status == ACTIVE, on every project, is driven through ACTIVE_to_SUSPENDED"
      - from: PROPOSED
        to: CLEAR
        trigger: "system event: calculations.debarment_risk_score result < DEBARMENT_PROPOSAL_THRESHOLD after a Finding reaches RESPONSE_ACCEPTED or WITHDRAWN, or after decay advances the clock"
        actor: system
        preconditions:
          - "contractor.debarment_status == PROPOSED"
          - "recomputed debarment_risk_score < 70"
        side_effects:
          - "sets debarment_status = CLEAR"
          - "increments Contractor.version by 1"
        note: "Cycle CLEAR -> PROPOSED -> CLEAR; the same contractor row may traverse it repeatedly."
      - from: PROPOSED
        to: DEBARRED
        trigger: "POST /contractors/{id}/debarment"
        actor: LaborStandardsAuditor
        preconditions:
          - "contractor.debarment_status == PROPOSED"
          - "to_status == DEBARRED"
        side_effects:
          - "sets debarment_status = DEBARRED"
          - "increments Contractor.version by 1"
          - "every ContractAssignment for this contractor whose status is in {INVITED, ACTIVE} transitions ACTIVE_to_SUSPENDED / is set to SUSPENDED, incrementing each assignment's version"
          - "each affected assignment's Project has suspended_assignment_count and posture recomputed"

  - entity: Project
    state_field: status
    initial_state: AWARDED
    terminal_states: [CLOSED]
    shape: compound_guarded
    transitions:
      - from: AWARDED
        to: ACTIVE
        trigger: "POST /projects/{id}/status with to_status = ACTIVE"
        actor: PortalAdmin
        preconditions:
          - "project.status == AWARDED"
          - "at least one ContractAssignment on this project has tier == 0 and status == ACTIVE"
        side_effects:
          - "sets status = ACTIVE"
          - "increments Project.version by 1"
      - from: ACTIVE
        to: SUBSTANTIALLY_COMPLETE
        trigger: "POST /projects/{id}/status with to_status = SUBSTANTIALLY_COMPLETE"
        actor: PortalAdmin
        preconditions:
          - "project.status == ACTIVE"
          - "project.posture != FROZEN"
        side_effects:
          - "sets status = SUBSTANTIALLY_COMPLETE"
          - "increments Project.version by 1"
      - from: SUBSTANTIALLY_COMPLETE
        to: CLOSED
        trigger: "POST /projects/{id}/status with to_status = CLOSED"
        actor: PortalAdmin
        preconditions:
          - "project.status == SUBSTANTIALLY_COMPLETE"
          - "project.open_finding_count == 0"
          - "project.outstanding_restitution_cents == 0"
          - "no PayrollSubmission on any of this project's assignments has workflow_status in {DRAFT, PENDING_CERTIFICATION, SUBMITTED, UNDER_REVIEW, RETURNED}"
        side_effects:
          - "sets status = CLOSED"
          - "sets posture = OPEN"
          - "increments Project.version by 1"
          - "every ContractAssignment on this project whose status is in {INVITED, ACTIVE, SUSPENDED} is set to TERMINATED, incrementing each assignment's version"

  - entity: ContractAssignment
    state_field: status
    initial_state: INVITED
    terminal_states: [TERMINATED]
    shape: cyclic
    transitions:
      - from: INVITED
        to: ACTIVE
        trigger: "POST /contract-assignments/{id}/activate"
        actor: PortalAdmin
        preconditions:
          - "assignment.status == INVITED"
          - "contractor.debarment_status == CLEAR"
          - "contractor.registration_status == REGISTERED"
          - "project.status in {AWARDED, ACTIVE}"
          - "when upper_tier_assignment_id is not null: the upper tier assignment has status == ACTIVE"
        side_effects:
          - "sets status = ACTIVE"
          - "increments ContractAssignment.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system event: a Finding with severity == CRITICAL reaches status OPEN against a PayrollSubmission on this assignment, or the assignment's contractor reaches debarment_status DEBARRED"
        actor: system
        preconditions:
          - "assignment.status == ACTIVE"
        side_effects:
          - "sets status = SUSPENDED"
          - "increments ContractAssignment.version by 1"
          - "CASCADE (caused by this SUSPENDED transition): the parent Project's suspended_assignment_count is recomputed and calculations.project_posture re-evaluated, incrementing Project.version"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /contract-assignments/{id}/reinstate"
        actor: AgencyComplianceOfficer
        preconditions:
          - "assignment.status == SUSPENDED"
          - "assignment.open_finding_count == 0"
          - "contractor.debarment_status == CLEAR"
        side_effects:
          - "sets status = ACTIVE"
          - "increments ContractAssignment.version by 1"
          - "parent Project's suspended_assignment_count recomputed and posture re-evaluated, incrementing Project.version"
        note: "Cycle ACTIVE -> SUSPENDED -> ACTIVE; a tier may be suspended and reinstated any number of times."
      - from: ACTIVE
        to: TERMINATED
        trigger: "system event: parent Project completes SUBSTANTIALLY_COMPLETE_to_CLOSED"
        actor: system
        preconditions:
          - "assignment.status in {INVITED, ACTIVE, SUSPENDED}"
        side_effects:
          - "sets status = TERMINATED"
          - "increments ContractAssignment.version by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "system event: parent Project completes SUBSTANTIALLY_COMPLETE_to_CLOSED"
        actor: system
        preconditions:
          - "assignment.status == SUSPENDED"
        side_effects:
          - "sets status = TERMINATED"
          - "increments ContractAssignment.version by 1"

  - entity: PayrollSubmission
    state_field: workflow_status
    initial_state: DRAFT
    terminal_states: [RETURNED]
    shape: parallel_dimension_filing_axis_cyclic
    note: "Axis 1 of 2 on PayrollSubmission. This axis tracks filing/adjudication of the paper; compliance_status (below) tracks wage correctness and evolves independently on the same row."
    transitions:
      - from: DRAFT
        to: PENDING_CERTIFICATION
        trigger: "POST /payroll-submissions/{id}/finalize"
        actor: PayrollPreparer
        preconditions:
          - "submission.workflow_status == DRAFT"
          - "logical clock now >= submission.week_ending_date"
          - "PayrollLine count on this submission >= 1, OR submission.no_work_performed == true and PayrollLine count == 0"
          - "project.posture != FROZEN"
          - "assignment.status == ACTIVE"
        side_effects:
          - "runs calculations.apprentice_ratio_compliance, then calculations.required_prevailing_rate, then calculations.creditable_fringe_per_line, then calculations.underpayment_restitution, in that pinned order"
          - "writes PayrollLine.required_base_cents, required_fringe_cents, creditable_fringe_cents, reclassified_journey_hours, line_underpayment_cents on every line"
          - "writes submission.total_hours_reported, excess_apprentice_hours, straight_time_underpayment_cents, make_whole_underpayment_cents"
          - "writes submission.filing_due_at from calculations.portal_filing_deadline"
          - "sets workflow_status = PENDING_CERTIFICATION"
          - "drives the compliance axis UNVERIFIED_to_COMPLIANT or UNVERIFIED_to_DEFICIENT on this same row"
          - "increments PayrollSubmission.version by 1"
      - from: PENDING_CERTIFICATION
        to: SUBMITTED
        trigger: "POST /payroll-submissions/{id}/certify"
        actor: CertifyingOfficial
        preconditions:
          - "submission.workflow_status == PENDING_CERTIFICATION"
          - "the acting ContractorStaff has capability in {CERTIFIER, BOTH} and contractor_id == assignment.contractor_id"
          - "the acting ContractorStaff.id != submission.prepared_by_staff_id (segregation of duties)"
          - "when the project's ReportingPortal.requires_notarized_statement is true: notary_reference_number is present in the request and equals the acting staff member's notary_reference_number"
          - "project.posture != FROZEN"
        side_effects:
          - "sets certified_by_staff_id = acting staff id, statement_signed_at = logical clock now, notary_reference_number when supplied"
          - "sets submitted_at = logical clock now and is_late = (submitted_at > filing_due_at)"
          - "sets workflow_status = SUBMITTED"
          - "increments PayrollSubmission.version by 1"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /payroll-submissions/{id}/begin-review"
        actor: AgencyComplianceOfficer
        preconditions:
          - "submission.workflow_status == SUBMITTED"
        side_effects:
          - "sets workflow_status = UNDER_REVIEW"
          - "increments PayrollSubmission.version by 1"
      - from: UNDER_REVIEW
        to: ACCEPTED
        trigger: "POST /payroll-submissions/{id}/accept"
        actor: AgencyComplianceOfficer
        preconditions:
          - "submission.workflow_status == UNDER_REVIEW"
          - "submission.compliance_status != DEFICIENT"
        side_effects:
          - "sets workflow_status = ACCEPTED and accepted_by_user_id = acting X-User-ID"
          - "adds submission.total_hours_reported to assignment.cumulative_certified_hours per calculations.certified_hours_ledger"
          - "increments ContractAssignment.version by 1 and PayrollSubmission.version by 1"
      - from: ACCEPTED
        to: UNDER_REVIEW
        trigger: "POST /payroll-submissions/{id}/rescind-acceptance"
        actor: AgencyComplianceOfficer
        preconditions:
          - "submission.workflow_status == ACCEPTED"
          - "rescission_reason is present"
          - "no OnSiteInterview has compared_submission_id == submission.id and status in {CONDUCTED_MATCHED, CONDUCTED_DISCREPANT}"
        side_effects:
          - "sets workflow_status = UNDER_REVIEW and accepted_by_user_id = null"
          - "COMPENSATION: subtracts submission.total_hours_reported from assignment.cumulative_certified_hours per calculations.certified_hours_ledger, restoring the exact pre-acceptance value"
          - "increments ContractAssignment.version by 1 and PayrollSubmission.version by 1"
        note: "Cycle UNDER_REVIEW -> ACCEPTED -> UNDER_REVIEW; the compensating half of the certified-hours ledger invariant."
      - from: UNDER_REVIEW
        to: RETURNED
        trigger: "POST /payroll-submissions/{id}/return"
        actor: AgencyComplianceOfficer
        preconditions:
          - "submission.workflow_status == UNDER_REVIEW"
        side_effects:
          - "sets workflow_status = RETURNED"
          - "increments PayrollSubmission.version by 1"
          - "increments ContractAssignment.version by 1 so a superseding create must carry the refreshed expected_contract_assignment_version"
        note: "RETURNED is terminal for this row; correction happens by creating a new PayrollSubmission whose superseded_submission_id names this row."

  - entity: PayrollSubmission
    state_field: compliance_status
    initial_state: UNVERIFIED
    terminal_states: []
    shape: parallel_dimension_compliance_axis_cyclic
    note: "Axis 2 of 2 on PayrollSubmission. REMEDIED -> DEFICIENT makes this axis cyclic; a row may be ACCEPTED on the filing axis while cycling DEFICIENT/RESTITUTION_PENDING/REMEDIED here."
    transitions:
      - from: UNVERIFIED
        to: COMPLIANT
        trigger: "system event: DRAFT_to_PENDING_CERTIFICATION completes with make_whole_underpayment_cents == 0 and excess_apprentice_hours == 0"
        actor: system
        preconditions:
          - "submission.compliance_status == UNVERIFIED"
        side_effects:
          - "sets compliance_status = COMPLIANT"
      - from: UNVERIFIED
        to: DEFICIENT
        trigger: "system event: DRAFT_to_PENDING_CERTIFICATION completes with make_whole_underpayment_cents > 0 or excess_apprentice_hours > 0"
        actor: system
        preconditions:
          - "submission.compliance_status == UNVERIFIED"
        side_effects:
          - "sets compliance_status = DEFICIENT"
      - from: COMPLIANT
        to: DEFICIENT
        trigger: "system event: a Finding reaches status OPEN citing this submission"
        actor: system
        preconditions:
          - "submission.compliance_status in {COMPLIANT, REMEDIED}"
        side_effects:
          - "sets compliance_status = DEFICIENT"
          - "increments PayrollSubmission.version by 1"
      - from: REMEDIED
        to: DEFICIENT
        trigger: "system event: a new Finding reaches status OPEN citing this already-remedied submission"
        actor: system
        preconditions:
          - "submission.compliance_status == REMEDIED"
        side_effects:
          - "sets compliance_status = DEFICIENT"
          - "increments PayrollSubmission.version by 1"
      - from: DEFICIENT
        to: RESTITUTION_PENDING
        trigger: "system event: the first RestitutionPayment on any Finding citing this submission reaches status DISBURSED while that Finding's restitution_outstanding_cents remains > 0"
        actor: system
        preconditions:
          - "submission.compliance_status == DEFICIENT"
        side_effects:
          - "sets compliance_status = RESTITUTION_PENDING"
          - "increments PayrollSubmission.version by 1"
      - from: RESTITUTION_PENDING
        to: REMEDIED
        trigger: "system event: every Finding citing this submission has status in {RESPONSE_ACCEPTED, WITHDRAWN} and the sum of their restitution_outstanding_cents == 0"
        actor: system
        preconditions:
          - "submission.compliance_status == RESTITUTION_PENDING"
        side_effects:
          - "sets compliance_status = REMEDIED"
          - "increments PayrollSubmission.version by 1"
      - from: DEFICIENT
        to: REMEDIED
        trigger: "system event: every Finding citing this submission has status in {RESPONSE_ACCEPTED, WITHDRAWN} and the sum of their restitution_outstanding_cents == 0"
        actor: system
        preconditions:
          - "submission.compliance_status == DEFICIENT"
        side_effects:
          - "sets compliance_status = REMEDIED"
          - "increments PayrollSubmission.version by 1"

  - entity: Finding
    state_field: status
    initial_state: OPEN
    terminal_states: [RESPONSE_ACCEPTED, WITHDRAWN]
    shape: cyclic
    transitions:
      - from: OPEN
        to: RESPONSE_SUBMITTED
        trigger: "POST /findings/{id}/response"
        actor: CertifyingOfficial
        preconditions:
          - "finding.status in {OPEN, RESPONSE_REJECTED}"
          - "the acting ContractorStaff.contractor_id equals the contractor of the cited submission's assignment"
          - "expected_finding_version equals finding.version"
        side_effects:
          - "sets response_narrative, increments response_round by 1, sets status = RESPONSE_SUBMITTED"
          - "increments Finding.version by 1"
      - from: RESPONSE_REJECTED
        to: RESPONSE_SUBMITTED
        trigger: "POST /findings/{id}/response"
        actor: CertifyingOfficial
        preconditions:
          - "finding.status == RESPONSE_REJECTED"
          - "expected_finding_version equals finding.version"
        side_effects:
          - "overwrites response_narrative, increments response_round by 1, sets status = RESPONSE_SUBMITTED"
          - "increments Finding.version by 1"
        note: "Revision loop: RESPONSE_REJECTED -> RESPONSE_SUBMITTED -> RESPONSE_REJECTED may repeat without bound; response_round records the round count."
      - from: RESPONSE_SUBMITTED
        to: RESPONSE_REJECTED
        trigger: "POST /findings/{id}/review-response with decision = REJECT"
        actor: AgencyComplianceOfficer
        preconditions:
          - "finding.status == RESPONSE_SUBMITTED"
          - "acting X-User-ID != the cited submission's accepted_by_user_id (segregation of duties)"
        side_effects:
          - "sets status = RESPONSE_REJECTED"
          - "increments Finding.version by 1"
      - from: RESPONSE_SUBMITTED
        to: RESPONSE_ACCEPTED
        trigger: "POST /findings/{id}/review-response with decision = ACCEPT"
        actor: AgencyComplianceOfficer
        preconditions:
          - "finding.status == RESPONSE_SUBMITTED"
          - "finding.restitution_outstanding_cents == 0"
          - "acting X-User-ID != the cited submission's accepted_by_user_id (segregation of duties)"
        side_effects:
          - "sets status = RESPONSE_ACCEPTED"
          - "increments Finding.version by 1"
          - "recomputes project.open_finding_count, open_critical_finding_count, outstanding_restitution_cents and calculations.project_posture, incrementing Project.version"
          - "recomputes assignment.open_finding_count, incrementing ContractAssignment.version"
          - "recomputes contractor.open_critical_finding_count and calculations.debarment_risk_score, which may drive Contractor PROPOSED_to_CLEAR"
          - "may drive the cited submission's compliance axis DEFICIENT_to_REMEDIED or RESTITUTION_PENDING_to_REMEDIED"
      - from: RESPONSE_SUBMITTED
        to: RESPONSE_ACCEPTED
        trigger: "system event: a RestitutionPayment disbursement drives finding.restitution_outstanding_cents to 0 while finding_type == UNDERPAYMENT"
        actor: system
        preconditions:
          - "finding.status == RESPONSE_SUBMITTED"
          - "finding.finding_type == UNDERPAYMENT"
          - "finding.restitution_outstanding_cents == 0 after the disbursement"
        side_effects:
          - "sets status = RESPONSE_ACCEPTED"
          - "increments Finding.version by 1"
          - "CASCADE HOP 3 (caused by this auto-acceptance): the cited submission's compliance axis advances to REMEDIED when no other Finding on it is non-terminal"
      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /findings/{id}/withdraw"
        actor: LaborStandardsAuditor
        preconditions:
          - "finding.status in {OPEN, RESPONSE_REJECTED}"
          - "no RestitutionPayment on this finding has status DISBURSED"
        side_effects:
          - "sets status = WITHDRAWN and restitution_outstanding_cents = 0"
          - "increments Finding.version by 1"
          - "every RestitutionPayment on this finding with status PENDING is set to VOIDED"
          - "recomputes project.open_finding_count / outstanding_restitution_cents / posture, assignment.open_finding_count, contractor.open_critical_finding_count and debarment_risk_score"
      - from: RESPONSE_REJECTED
        to: WITHDRAWN
        trigger: "POST /findings/{id}/withdraw"
        actor: LaborStandardsAuditor
        preconditions:
          - "finding.status == RESPONSE_REJECTED"
          - "no RestitutionPayment on this finding has status DISBURSED"
        side_effects:
          - "sets status = WITHDRAWN and restitution_outstanding_cents = 0"
          - "increments Finding.version by 1"
          - "every RestitutionPayment on this finding with status PENDING is set to VOIDED"

  - entity: OnSiteInterview
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [CONDUCTED_MATCHED, CONDUCTED_DISCREPANT, CANCELLED]
    shape: fork_join_divergent
    transitions:
      - from: SCHEDULED
        to: CONDUCTED_MATCHED
        trigger: "POST /interviews/{id}/conduct — branch taken when the observation agrees with the compared payroll line"
        actor: LaborStandardsAuditor
        preconditions:
          - "interview.status == SCHEDULED"
          - "logical clock now >= interview.window_start"
          - "exactly one PayrollSubmission on interview.contract_assignment_id has workflow_status == ACCEPTED and a covered week interval [week_ending_date - 6 days, week_ending_date] containing interview.window_start; that row becomes compared_submission_id"
          - "that submission has a PayrollLine for interview.worker_id whose classification_code == observed_classification_code and whose base_rate_paid_cents >= observed_hourly_rate_cents"
        side_effects:
          - "sets observed_classification_code, observed_hourly_rate_cents, compared_submission_id, status = CONDUCTED_MATCHED"
          - "increments Worker.interview_count by 1"
          - "increments OnSiteInterview.version by 1"
        note: "MATCHED branch raises no Finding and leaves the submission's compliance axis untouched."
      - from: SCHEDULED
        to: CONDUCTED_DISCREPANT
        trigger: "POST /interviews/{id}/conduct — branch taken when the observation contradicts the compared payroll line"
        actor: LaborStandardsAuditor
        preconditions:
          - "interview.status == SCHEDULED"
          - "logical clock now >= interview.window_start"
          - "exactly one PayrollSubmission on interview.contract_assignment_id has workflow_status == ACCEPTED and a covered week interval containing interview.window_start; that row becomes compared_submission_id"
          - "that submission has no PayrollLine for interview.worker_id, OR its line's classification_code != observed_classification_code, OR its line's base_rate_paid_cents < observed_hourly_rate_cents"
        side_effects:
          - "sets observed_classification_code, observed_hourly_rate_cents, compared_submission_id, status = CONDUCTED_DISCREPANT"
          - "increments Worker.interview_count by 1"
          - "increments OnSiteInterview.version by 1"
          - "CASCADE HOP 1: auto-creates a Finding with project_id = interview.project_id, payroll_submission_id = compared_submission_id, worker_id = interview.worker_id, source_interview_id = interview.id, finding_type = MISCLASSIFICATION, severity = MAJOR, restitution_required_cents = 0, status = OPEN"
          - "CASCADE HOP 2 (caused by that Finding reaching OPEN): the compared submission's compliance axis moves COMPLIANT_to_DEFICIENT or REMEDIED_to_DEFICIENT, and project/assignment/contractor counters are recomputed"
        note: "DIVERGENT branch: same endpoint, same from-state, a strictly larger side-effect set than the MATCHED branch."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /interviews/{id}/cancel"
        actor: LaborStandardsAuditor
        preconditions:
          - "interview.status == SCHEDULED"
        side_effects:
          - "sets status = CANCELLED"
          - "increments OnSiteInterview.version by 1"
          - "frees the interview's window so a new interview on the same worker may occupy an overlapping or buffer-adjacent window"

  - entity: RestitutionPayment
    state_field: status
    initial_state: PENDING
    terminal_states: [REVERSED, VOIDED]
    shape: branching_with_compensation
    transitions:
      - from: PENDING
        to: DISBURSED
        trigger: "POST /restitution-payments/{id}/disburse"
        actor: PayrollPreparer
        preconditions:
          - "payment.status == PENDING"
          - "finding.status in {OPEN, RESPONSE_SUBMITTED, RESPONSE_REJECTED}"
          - "payment.amount_cents <= finding.restitution_outstanding_cents"
        side_effects:
          - "sets status = DISBURSED and disbursed_at = logical clock now"
          - "CASCADE HOP 1: finding.restitution_outstanding_cents -= payment.amount_cents; assignment.cumulative_restitution_cents += payment.amount_cents; contractor.outstanding_restitution_cents recomputed"
          - "CASCADE HOP 2 (caused by hop 1 reaching zero outstanding): Finding RESPONSE_SUBMITTED_to_RESPONSE_ACCEPTED fires when finding_type == UNDERPAYMENT"
          - "when outstanding remains > 0, drives the cited submission's compliance axis DEFICIENT_to_RESTITUTION_PENDING"
          - "increments RestitutionPayment.version, Finding.version, ContractAssignment.version and Contractor.version by 1 each"
      - from: DISBURSED
        to: REVERSED
        trigger: "POST /restitution-payments/{id}/reverse"
        actor: AgencyComplianceOfficer
        preconditions:
          - "payment.status == DISBURSED"
          - "finding.status != WITHDRAWN"
          - "reversal_reason is present"
        side_effects:
          - "sets status = REVERSED and reversal_reason"
          - "COMPENSATION: finding.restitution_outstanding_cents += payment.amount_cents; assignment.cumulative_restitution_cents -= payment.amount_cents; contractor.outstanding_restitution_cents recomputed"
          - "when the finding had auto-advanced to RESPONSE_ACCEPTED solely because outstanding hit zero, it returns to RESPONSE_SUBMITTED; the cited submission's compliance axis then returns to RESTITUTION_PENDING when at least one DISBURSED RestitutionPayment still exists on any Finding citing that submission, and to DEFICIENT when none does"
          - "increments RestitutionPayment.version, Finding.version, ContractAssignment.version and Contractor.version by 1 each"
      - from: PENDING
        to: VOIDED
        trigger: "POST /restitution-payments/{id}/reverse"
        actor: AgencyComplianceOfficer
        preconditions:
          - "payment.status == PENDING"
          - "reversal_reason is present"
        side_effects:
          - "sets status = VOIDED and reversal_reason"
          - "leaves finding.restitution_outstanding_cents, assignment.cumulative_restitution_cents and contractor.outstanding_restitution_cents unchanged because no funds had moved"
          - "increments RestitutionPayment.version by 1"
        note: "Same endpoint as DISBURSED_to_REVERSED; the from-state selects a materially different side-effect set."

concurrency_rules:
  - rule_id: payroll-supersede-stale-assignment
    parent_entity: ContractAssignment
    write_endpoint: "POST /payroll-submissions"
    occ_field: "expected_contract_assignment_version"
    description: |
      Creating a PayrollSubmission whose superseded_submission_id names a RETURNED
      row is rejected when expected_contract_assignment_version is behind the
      assignment's current version. A correction filing legitimately supersedes the
      returned row, so nothing in the state machine forbids a second create; the
      stale-version check is what tells a preparer that the assignment has moved on
      (another correction was already filed, the tier was suspended, or a payroll was
      accepted) since the version they last read.
    error_id: ERR_STALE_ASSIGNMENT_VERSION
    http_status: 412
  - rule_id: finding-response-stale-finding
    parent_entity: Finding
    write_endpoint: "POST /findings/{id}/response"
    occ_field: "expected_finding_version"
    description: |
      Filing a response on a Finding whose version has advanced past the value the
      contractor last observed is rejected. Each response legitimately overwrites the
      prior response_narrative and increments response_round, so a second response is
      permitted by the state machine; the stale-version check surfaces that the
      finding changed underneath the author (a reviewer decision landed, a restitution
      disbursement moved the outstanding balance) before the overwrite is accepted.
    error_id: ERR_STALE_FINDING_VERSION
    http_status: 412

calculations:
  - name: fringe_hourly_credit
    trigger: "on POST /contractors/{id}/fringe-plans (creation) and on POST /fringe-plans/{id}/approve (approval decision)"
    algorithm: aggregation
    entity_domain: FringeBenefitPlan
    formula: |
      # DUAL-VARIANT: identical stored inputs, two defensible annualization denominators,
      # two different cents-per-hour credits. Both are persisted on the plan row.
      if plan.plan_type == "CASH_IN_LIEU":
          annualized_credit_cents = 0
          claimed_credit_cents    = 0
      else:
          annualized_credit_cents = round_half_up(plan.annual_contribution_cents / plan.annual_total_hours)
          claimed_credit_cents    = round_half_up(plan.annual_contribution_cents / plan.annual_public_works_hours)
      # annual_public_works_hours <= annual_total_hours by field constraint, so
      # claimed_credit_cents >= annualized_credit_cents always, with strict inequality
      # whenever the contractor also performs private work.
    input_set: "The single FringeBenefitPlan row named in the request. No other plan, no PayrollLine, participates."
    constants: {}
    precision: "whole cents, round_half_up on the division result"
    variants:
      - name: ANNUALIZED_ALL_HOURS
        when: "AUTHORITATIVE for compliance crediting; stored in annualized_credit_cents and consumed by calculations.creditable_fringe_per_line"
        difference: "Divides by annual_total_hours (public plus private work), which dilutes the hourly credit."
      - name: COVERED_HOURS_ONLY
        when: "Contractor-facing figure the plan sponsor asserts; stored in claimed_credit_cents and surfaced by GET /contractors/{id}/fringe-plans only"
        difference: "Divides by annual_public_works_hours only, producing a strictly larger credit whenever private hours exist. NEVER used to reduce a wage deficiency."

  - name: required_prevailing_rate
    trigger: "on POST /payroll-submissions/{id}/finalize, for every PayrollLine on the submission; and again on the WageDetermination ACTIVE_to_SUPERSEDED cascade hop 3 for DRAFT/PENDING_CERTIFICATION submissions"
    algorithm: threshold
    entity_domain: PayrollLine
    formula: |
      # >= 3 interacting inputs (matched WageRate row, project zone, apprentice period,
      # program registration) with nested conditional branches: mode (a) combinatorial.
      wr = the unique WageRate with
             wage_determination_id == project.wage_determination_id
             AND classification_code == line.classification_code
             AND zone_code == project.zone_code
      if wr does not exist: reject ERR_NO_WAGE_RATE_FOR_CLASSIFICATION
      journey_base_cents = wr.base_hourly_rate_cents + wr.zone_adjustment_cents
      if line.reported_as_apprentice == false:
          line.required_base_cents = journey_base_cents
      else:
          prog = ApprenticeProgram of worker.apprentice_program_id
          if prog is null or prog.registration_status != "REGISTERED":
              reject ERR_APPRENTICE_PROGRAM_NOT_REGISTERED
          if prog.trade_code != wr.trade_code:
              reject ERR_APPRENTICE_TRADE_MISMATCH
          pct = wr.apprentice_scale_pct[worker.apprentice_period - 1]
          if that index does not exist: reject ERR_APPRENTICE_PERIOD_OUT_OF_SCALE
          line.required_base_cents = round_half_up(journey_base_cents * pct / 100)
      line.required_fringe_cents = wr.fringe_hourly_rate_cents
      # Apprentices owe the FULL fringe amount: the scale percentage applies to the
      # basic rate only. This is the pinned interpretation.
    input_set: "Only WageRate rows belonging to project.wage_determination_id whose zone_code equals project.zone_code. Rows on superseded determinations are excluded even when the project once pointed at them."
    constants: {}
    precision: "whole cents, round_half_up on the apprentice scaling multiplication"
    variants: []

  - name: creditable_fringe_per_line
    trigger: "on POST /payroll-submissions/{id}/finalize, immediately after required_prevailing_rate, for every PayrollLine"
    algorithm: threshold
    entity_domain: PayrollLine
    formula: |
      if line.fringe_plan_id is null:
          plan_credit = 0
      else:
          plan = FringeBenefitPlan of line.fringe_plan_id
          if plan.contractor_id != assignment.contractor_id: reject ERR_FRINGE_PLAN_FOREIGN
          if plan.approval_status != "APPROVED":                plan_credit = 0
          elif plan.plan_type == "UNFUNDED":                    plan_credit = 0
          else:                                                 plan_credit = plan.annualized_credit_cents
      line.creditable_fringe_cents = min(plan_credit, line.required_fringe_cents)
      # CAP, pinned: fringe credit in excess of the determination's fringe requirement is
      # discarded here and can never offset a basic-rate shortfall. Cash fringe
      # (fringe_cash_paid_cents) is NOT capped and DOES count toward the total rate.
    input_set: "The one FringeBenefitPlan named on the line, if any. Plans on the contractor that the line does not name contribute nothing."
    constants: {}
    precision: "whole cents"
    variants: []

  - name: apprentice_ratio_compliance
    trigger: "on POST /payroll-submissions/{id}/finalize, BEFORE required_prevailing_rate and underpayment_restitution"
    algorithm: constraint_propagation
    entity_domain: PayrollSubmission
    formula: |
      # MODE (c): circular-looking dependency with a PINNED evaluation order.
      # Excess apprentice hours must be repriced at the journeyworker rate, which would
      # conceptually enlarge the journeyworker hour pool J_T, which would enlarge the
      # permitted apprentice hours allowed_A_T, which would shrink the excess -- a loop.
      # PINNED: ONE pass using the pre-reclassification J_T. No fixed-point iteration,
      # no second pass. The repriced hours stay counted as apprentice hours for ratio
      # purposes and are counted as journeyworker hours for wage purposes only.
      for each trade_code T appearing among the submission's lines
          (T = WageRate.trade_code of the row matched by calculations.required_prevailing_rate):
        A_T = sum of (straight_hours + overtime_hours) over lines with reported_as_apprentice == true and trade T
        J_T = sum of (straight_hours + overtime_hours) over lines with reported_as_apprentice == false and trade T
        ratio_pct = MIN over the distinct ApprenticeProgram rows referenced by trade-T apprentice
                    lines of allowed_apprentice_hours_per_100_journey
                    # MIN is order-independent, so no tie-break is needed
        allowed_A_T = round_half_up_2dp(J_T * ratio_pct / 100)
        excess_T = max(0, A_T - allowed_A_T)      # STRICT: A_T == allowed_A_T is compliant
        # Allocation of excess_T onto lines, pinned deterministic order:
        #   candidate lines = trade-T lines with reported_as_apprentice == true
        #   sort DESCENDING by (straight_hours + overtime_hours),
        #        tie-break ASCENDING by PayrollLine.created_at
        #   each line absorbs min(remaining_excess, straight_hours + overtime_hours)
        #        into line.reclassified_journey_hours
      submission.excess_apprentice_hours = sum over T of excess_T
    input_set: "Every PayrollLine on the submission under finalization, grouped by the trade_code of its matched WageRate row. Lines on other submissions of the same week or assignment are excluded: the ratio is per-submission, per-week."
    constants: {}
    precision: "hours to 2 decimal places, round_half_up on allowed_A_T"
    variants: []

  - name: underpayment_restitution
    trigger: "on POST /payroll-submissions/{id}/finalize, after apprentice_ratio_compliance, required_prevailing_rate and creditable_fringe_per_line"
    algorithm: waterfall_allocation
    entity_domain: PayrollSubmission
    formula: |
      # MODE (b): nested rounding whose ORDER changes the cents. PINNED: round once per
      # line per hour-category (straight, overtime), then sum categories, then sum lines.
      # The rejected alternative AGGREGATE_THEN_ROUND is recorded as a variant so the
      # divergence is explicit.
      for each PayrollLine L on the submission:
        recl          = L.reclassified_journey_hours
        recl_straight = min(recl, L.straight_hours)          # PINNED: straight hours reprice first
        recl_ot       = recl - recl_straight
        scaled_straight = L.straight_hours   - recl_straight
        scaled_ot       = L.overtime_hours   - recl_ot

        journey_base_cents = wr.base_hourly_rate_cents + wr.zone_adjustment_cents   # same matched row at 100%
        paid_st_total = L.base_rate_paid_cents     + L.fringe_cash_paid_cents + L.creditable_fringe_cents
        paid_ot_total = L.overtime_rate_paid_cents + L.fringe_cash_paid_cents + L.creditable_fringe_cents

        req_st_scaled  = L.required_base_cents + L.required_fringe_cents
        req_st_journey = journey_base_cents    + L.required_fringe_cents
        req_ot_scaled  = round_half_up(L.required_base_cents * OVERTIME_BASE_MULTIPLIER) + L.required_fringe_cents
        req_ot_journey = round_half_up(journey_base_cents     * OVERTIME_BASE_MULTIPLIER) + L.required_fringe_cents
        # Fringe is NOT multiplied by the overtime factor: pinned interpretation.

        def_st_scaled  = max(0, req_st_scaled  - paid_st_total)
        def_st_journey = max(0, req_st_journey - paid_st_total)
        def_ot_scaled  = max(0, req_ot_scaled  - paid_ot_total)
        def_ot_journey = max(0, req_ot_journey - paid_ot_total)

        line_straight_cents = round_half_up(def_st_scaled * scaled_straight + def_st_journey * recl_straight)
        line_ot_cents       = round_half_up(def_ot_scaled * scaled_ot       + def_ot_journey * recl_ot)
        L.line_underpayment_cents = line_straight_cents + line_ot_cents

      submission.straight_time_underpayment_cents = sum over L of line_straight_cents
      submission.make_whole_underpayment_cents    = sum over L of L.line_underpayment_cents
    input_set: "Every PayrollLine on the submission being finalized, after reclassified_journey_hours has been written by apprentice_ratio_compliance. Lines belonging to a superseded (RETURNED) submission for the same week are excluded."
    constants:
      OVERTIME_BASE_MULTIPLIER: 1.5
    precision: "whole cents; round_half_up applied per line per hour-category, then summed. Hours carry 2 decimal places."
    variants:
      - name: STRAIGHT_TIME_ONLY
        when: "The portal's preliminary screen; stored in straight_time_underpayment_cents and returned by GET /payroll-submissions/{id}/underpayment-summary"
        difference: "Omits every overtime deficiency, so it is strictly less than FULL_MAKE_WHOLE whenever any line has overtime_hours > 0 and an overtime deficiency."
      - name: FULL_MAKE_WHOLE
        when: "AUTHORITATIVE: gates the compliance axis (UNVERIFIED_to_DEFICIENT) and is the ceiling a Finding's restitution_required_cents is validated against"
        difference: "Adds the overtime deficiency segment, priced at 1.5x the required BASIC rate plus the unmultiplied fringe."
      - name: AGGREGATE_THEN_ROUND
        when: "REJECTED alternative, documented so the pinned rounding order is unambiguous"
        difference: "Would sum the exact per-hour deficiency products across all lines and round once at the end, differing from the pinned order by up to (line_count) cents."

  - name: certified_hours_ledger
    trigger: "on PayrollSubmission UNDER_REVIEW_to_ACCEPTED (forward) and ACCEPTED_to_UNDER_REVIEW (compensating)"
    algorithm: aggregation
    entity_domain: ContractAssignment
    formula: |
      # CONSERVED QUANTITY (hours):
      #   assignment.cumulative_certified_hours ==
      #     sum of total_hours_reported over PayrollSubmissions with
      #     contract_assignment_id == assignment.id AND workflow_status == "ACCEPTED"
      # forward   (accept):              cumulative_certified_hours += submission.total_hours_reported
      # compensate(rescind-acceptance):  cumulative_certified_hours -= submission.total_hours_reported
      # A RETURNED row never contributed, so its superseding row's acceptance adds exactly once.
      submission.total_hours_reported = sum over PayrollLine of (straight_hours + overtime_hours)
    input_set: "PayrollSubmissions on this assignment with workflow_status == ACCEPTED only. DRAFT, PENDING_CERTIFICATION, SUBMITTED, UNDER_REVIEW and RETURNED rows contribute nothing."
    constants: {}
    precision: "hours to 2 decimal places; add and subtract exactly, no rounding"
    variants: []

  - name: restitution_obligation_ledger
    trigger: "on RestitutionPayment PENDING_to_DISBURSED (forward), DISBURSED_to_REVERSED (compensating), PENDING_to_VOIDED (no-op) and Finding OPEN_to_WITHDRAWN"
    algorithm: aggregation
    entity_domain: Finding
    formula: |
      # CONSERVED QUANTITY (cents), for every Finding whose status != "WITHDRAWN":
      #   finding.restitution_required_cents ==
      #     finding.restitution_outstanding_cents
      #     + sum of amount_cents over RestitutionPayments on this finding with status == "DISBURSED"
      # forward   (disburse): outstanding -= amount_cents ; assignment.cumulative_restitution_cents += amount_cents
      # compensate(reverse):  outstanding += amount_cents ; assignment.cumulative_restitution_cents -= amount_cents
      # no-op     (void):     both sides unchanged -- a PENDING payment never entered the ledger
      contractor.outstanding_restitution_cents =
        sum of restitution_outstanding_cents over Findings whose cited submission's assignment
        has contractor_id == contractor.id AND finding.status != "WITHDRAWN"
      project.outstanding_restitution_cents =
        sum of restitution_outstanding_cents over Findings with project_id == project.id
        AND status in {OPEN, RESPONSE_SUBMITTED, RESPONSE_REJECTED}
    input_set: "RestitutionPayments with status == DISBURSED only. PENDING, VOIDED and REVERSED payments contribute zero to the disbursed side of the identity."
    constants: {}
    precision: "whole cents, exact integer addition and subtraction"
    variants: []

  - name: debarment_risk_score
    trigger: "on Finding creation, Finding status change, RestitutionPayment disbursement/reversal, and on POST /_clock/set_current_utc for every contractor with last_finding_at not null"
    algorithm: weighted_scoring
    entity_domain: Contractor
    formula: |
      S = { Finding f : the ContractAssignment of f.payroll_submission_id has
                        contractor_id == contractor.id
            AND f.status in {"OPEN", "RESPONSE_SUBMITTED", "RESPONSE_REJECTED"} }
      raw = CRITICAL_WEIGHT * count(f in S with severity == "CRITICAL")
          + MAJOR_WEIGHT    * count(f in S with severity == "MAJOR")
          + MINOR_WEIGHT    * count(f in S with severity == "MINOR")
          + (RESTITUTION_FLAG_WEIGHT if contractor.outstanding_restitution_cents >= RESTITUTION_FLAG_THRESHOLD_CENTS else 0)
      if contractor.last_finding_at is null:
          decay = 0
      else:
          periods = floor((clock_now - contractor.last_finding_at) / DECAY_PERIOD_DAYS days)
          decay   = DECAY_PER_PERIOD * periods
      contractor.debarment_risk_score = max(0, min(100, raw - decay))
      # THRESHOLD, inclusive: score >= DEBARMENT_PROPOSAL_THRESHOLD drives
      # Contractor CLEAR_to_PROPOSED; score < the threshold drives PROPOSED_to_CLEAR.
      # A score of exactly 70 DOES propose debarment.
    input_set: "Findings against this contractor's assignments in the three non-terminal statuses. RESPONSE_ACCEPTED and WITHDRAWN findings drop out of S entirely and stop contributing weight."
    constants:
      CRITICAL_WEIGHT: 40
      MAJOR_WEIGHT: 15
      MINOR_WEIGHT: 8
      RESTITUTION_FLAG_WEIGHT: 25
      RESTITUTION_FLAG_THRESHOLD_CENTS: 500000
      DECAY_PER_PERIOD: 5
      DECAY_PERIOD_DAYS: 28
      DEBARMENT_PROPOSAL_THRESHOLD: 70
    precision: "integer score clamped to 0..100; floor on the decay period count"
    variants: []

  - name: project_posture
    trigger: "on Finding creation and every Finding status change, on RestitutionPayment disbursement/reversal, on ContractAssignment status change, and on POST /projects/{id}/status"
    algorithm: threshold
    entity_domain: Project
    formula: |
      S = { Finding f : f.project_id == project.id
            AND f.status in {"OPEN", "RESPONSE_SUBMITTED", "RESPONSE_REJECTED"} }
      project.open_finding_count          = count(S)
      project.open_critical_finding_count = count(f in S with severity == "CRITICAL")
      project.outstanding_restitution_cents = sum of f.restitution_outstanding_cents over S
      project.suspended_assignment_count  = count of ContractAssignments on this project with status == "SUSPENDED"
      # PINNED evaluation order; the FIRST matching step wins.
      step 1: if project.open_critical_finding_count >= 1                                        -> FROZEN
      step 2: elif project.outstanding_restitution_cents > POSTURE_FROZEN_RESTITUTION_CENTS      -> FROZEN
      step 3: elif project.open_finding_count >= POSTURE_RESTRICTED_FINDING_COUNT                -> RESTRICTED
      step 4: elif project.suspended_assignment_count >= 1                                       -> RESTRICTED
      step 5: else                                                                               -> OPEN
      # Step 2 is STRICTLY greater: outstanding of exactly 500000 does NOT freeze.
      # Step 3 is inclusive: exactly 2 open findings DOES restrict.
    input_set: "Findings on this project in the three non-terminal statuses, plus this project's ContractAssignments. Findings on other projects of the same contractor never affect this project's posture."
    constants:
      POSTURE_FROZEN_RESTITUTION_CENTS: 500000
      POSTURE_RESTRICTED_FINDING_COUNT: 2
    precision: "integer counts and cents; no rounding"
    variants: []

  - name: portal_filing_deadline
    trigger: "on POST /payroll-submissions/{id}/finalize (writes filing_due_at) and on POST /payroll-submissions/{id}/certify (writes is_late)"
    algorithm: interval_merge
    entity_domain: PayrollSubmission
    formula: |
      portal = ReportingPortal of project.reporting_portal_id
      filing_due_at = submission.week_ending_date
                      + portal.cutoff_offset_days days
                      + portal.grace_hours hours
      # week_ending_date is a Saturday at 00:00:00.000Z, so filing_due_at is exact.
      is_late = (submission.submitted_at > filing_due_at)
      # INCLUSIVE deadline: submitted_at exactly equal to filing_due_at is ON TIME.
      hard_close_at = submission.week_ending_date + PORTAL_HARD_CLOSE_DAYS days
      # A certify attempt at clock_now > hard_close_at is rejected outright
      # (ERR_SUBMISSION_WINDOW_CLOSED); clock_now == hard_close_at is still accepted.
      response_due_at (on Finding creation) = clock_now + RESPONSE_WINDOW_DAYS days
    input_set: "The one ReportingPortal the project points at, and this submission's own week_ending_date. Portal changes after finalization do not retroactively move filing_due_at."
    constants:
      RESPONSE_WINDOW_DAYS: 30
      PORTAL_HARD_CLOSE_DAYS: 90
    precision: "instants to milliseconds, UTC"
    variants: []

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present; X-User-Role is one of the five declared roles."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "The acting role appears in the endpoint's roles list in the API endpoint table."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Every path-segment resource exists, validated left to right: project, contract assignment, payroll submission, finding, restitution payment, interview, wage determination, contractor, fringe plan, apprentice program."
    error_id: "ERR_PROJECT_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_SUBMISSION_NOT_FOUND | ERR_FINDING_NOT_FOUND | ERR_RESTITUTION_NOT_FOUND | ERR_INTERVIEW_NOT_FOUND | ERR_DETERMINATION_NOT_FOUND | ERR_CONTRACTOR_NOT_FOUND | ERR_FRINGE_PLAN_NOT_FOUND | ERR_PROGRAM_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"
  - priority: 4
    category: existence
    check: "Every foreign key supplied in the request body resolves, validated in body-field declaration order: contract_assignment_id, prepared_by_staff_id, superseded_submission_id, worker_id, fringe_plan_id, wage_determination_id, reporting_portal_id, upper_tier_assignment_id, contractor_id, payroll_submission_id, source_interview_id."
    error_id: "ERR_ASSIGNMENT_NOT_FOUND | ERR_STAFF_NOT_FOUND | ERR_SUBMISSION_NOT_FOUND | ERR_WORKER_NOT_FOUND | ERR_FRINGE_PLAN_NOT_FOUND | ERR_DETERMINATION_NOT_FOUND | ERR_PORTAL_NOT_FOUND | ERR_CONTRACTOR_NOT_FOUND | ERR_PROGRAM_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints accepting foreign keys in the body"
  - priority: 5
    category: auth
    check: "Ownership for entity_backed roles: the acting ContractorStaff (X-User-ID) must have contractor_id equal to the contractor of the ContractAssignment that owns the target PayrollSubmission, Finding response, or RestitutionPayment."
    error_id: ERR_NOT_OWNER
    http_status: 403
    applies_to: "POST /payroll-submissions, POST /payroll-submissions/{id}/lines, POST /payroll-submissions/{id}/finalize, POST /payroll-submissions/{id}/certify, POST /findings/{id}/response, POST /findings/{id}/restitution-payments, POST /restitution-payments/{id}/disburse, POST /workers, POST /contractors/{id}/fringe-plans"
  - priority: 6
    category: auth
    check: "Capability check on the acting ContractorStaff: capability must be in {PREPARER, BOTH} for preparation endpoints and in {CERTIFIER, BOTH} for POST /payroll-submissions/{id}/certify and POST /findings/{id}/response."
    error_id: ERR_STAFF_CAPABILITY_MISSING
    http_status: 403
    applies_to: "POST /payroll-submissions, POST /payroll-submissions/{id}/lines, POST /payroll-submissions/{id}/finalize, POST /payroll-submissions/{id}/certify, POST /findings/{id}/response"
  - priority: 7
    category: business_constraint
    check: "Request body shape and field-level constraints: required fields present, enums in range, integers non-negative, hours within 2 decimal places, week_ending_date parseable."
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: all
  - priority: 8
    category: state
    check: "The target resource is in a from-state that the requested transition declares in the state machine table. On POST /findings the cited submission's workflow_status must additionally be in {SUBMITTED, UNDER_REVIEW, ACCEPTED, RETURNED}; on POST /interviews/{id}/conduct exactly one ACCEPTED submission on the assignment must cover window_start."
    error_id: "ERR_INVALID_SUBMISSION_STATE | ERR_INVALID_FINDING_STATE | ERR_INVALID_ASSIGNMENT_STATE | ERR_INVALID_DETERMINATION_STATE | ERR_INVALID_INTERVIEW_STATE | ERR_INVALID_PAYMENT_STATE | ERR_INVALID_PROJECT_STATUS_TRANSITION"
    http_status: 409
    applies_to: "all state-changing endpoints"
  - priority: 9
    category: state
    check: "Project posture gate: the owning project's posture must not be FROZEN."
    error_id: ERR_PROJECT_FROZEN
    http_status: 409
    applies_to: "POST /payroll-submissions, POST /payroll-submissions/{id}/lines, POST /payroll-submissions/{id}/finalize, POST /payroll-submissions/{id}/certify, POST /projects/{id}/status (to_status = SUBSTANTIALLY_COMPLETE)"
  - priority: 10
    category: state
    check: "Optimistic concurrency: expected_contract_assignment_version equals the assignment's current version on payroll creation; expected_finding_version equals the finding's current version on response filing."
    error_id: "ERR_STALE_ASSIGNMENT_VERSION | ERR_STALE_FINDING_VERSION"
    http_status: 412
    applies_to: "POST /payroll-submissions, POST /findings/{id}/response"
  - priority: 11
    category: business_safety
    check: "Segregation of duties on certification: the acting ContractorStaff.id must differ from submission.prepared_by_staff_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /payroll-submissions/{id}/certify"
  - priority: 12
    category: business_safety
    check: "Segregation of duties on adjudication: the acting AgencyComplianceOfficer X-User-ID must differ from the cited submission's accepted_by_user_id."
    error_id: ERR_SOD_REVIEW_CONFLICT
    http_status: 409
    applies_to: "POST /findings/{id}/review-response"
  - priority: 13
    category: business_safety
    check: "Notarization: when the project's ReportingPortal.requires_notarized_statement is true, notary_reference_number must be present in the certify request and equal the acting staff member's notary_reference_number."
    error_id: ERR_NOTARIZATION_REQUIRED
    http_status: 422
    applies_to: "POST /payroll-submissions/{id}/certify"
  - priority: 14
    category: business_safety
    check: "Debarment gate: the assignment's contractor must have debarment_status == CLEAR and registration_status == REGISTERED."
    error_id: ERR_CONTRACTOR_DEBARRED
    http_status: 409
    applies_to: "POST /contract-assignments/{id}/activate, POST /contract-assignments/{id}/reinstate, POST /projects/{id}/contract-assignments"
  - priority: 15
    category: business_referential
    check: "Apprentice program registration: every line with reported_as_apprentice true must reference a Worker whose apprentice_program_id resolves to a program with registration_status == REGISTERED."
    error_id: ERR_APPRENTICE_PROGRAM_NOT_REGISTERED
    http_status: 422
    applies_to: "POST /payroll-submissions/{id}/lines, POST /payroll-submissions/{id}/finalize"
  - priority: 16
    category: business_referential
    check: "Apprentice trade alignment: the program's trade_code must equal the trade_code of the WageRate row matched for the line's classification_code."
    error_id: ERR_APPRENTICE_TRADE_MISMATCH
    http_status: 422
    applies_to: "POST /payroll-submissions/{id}/lines, POST /payroll-submissions/{id}/finalize"
  - priority: 17
    category: business_referential
    check: "Apprentice period within scale: worker.apprentice_period must be <= the length of the matched WageRate.apprentice_scale_pct array and <= the program's period_count."
    error_id: ERR_APPRENTICE_PERIOD_OUT_OF_SCALE
    http_status: 422
    applies_to: "POST /payroll-submissions/{id}/lines, POST /payroll-submissions/{id}/finalize"
  - priority: 18
    category: business_referential
    check: "Wage rate coverage: a WageRate row must exist for (project.wage_determination_id, line.classification_code, project.zone_code)."
    error_id: ERR_NO_WAGE_RATE_FOR_CLASSIFICATION
    http_status: 422
    applies_to: "POST /payroll-submissions/{id}/lines, POST /payroll-submissions/{id}/finalize"
  - priority: 19
    category: business_referential
    check: "Fringe plan ownership: line.fringe_plan_id must belong to the assignment's contractor."
    error_id: ERR_FRINGE_PLAN_FOREIGN
    http_status: 422
    applies_to: "POST /payroll-submissions/{id}/lines"
  - priority: 20
    category: business_referential
    check: "Fringe plan usability: the named plan's approval_status must not be REJECTED."
    error_id: ERR_FRINGE_PLAN_NOT_APPROVED
    http_status: 422
    applies_to: "POST /payroll-submissions/{id}/lines"
  - priority: 21
    category: business_referential
    check: "Upper tier participation: when upper_tier_assignment_id is supplied it must belong to the same project and, at activation time, have status == ACTIVE."
    error_id: ERR_UPPER_TIER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /projects/{id}/contract-assignments, POST /contract-assignments/{id}/activate"
  - priority: 22
    category: business_temporal
    check: "week_ending_date must be a Saturday at exactly 00:00:00.000Z."
    error_id: ERR_WEEK_ENDING_NOT_SATURDAY
    http_status: 422
    applies_to: "POST /payroll-submissions"
  - priority: 23
    category: business_temporal
    check: "The payroll week must be over: the logical clock must be at or after week_ending_date before a submission may be finalized."
    error_id: ERR_PAYROLL_WEEK_NOT_ENDED
    http_status: 422
    applies_to: "POST /payroll-submissions/{id}/finalize"
  - priority: 24
    category: business_temporal
    check: "Payroll week occupation on a ContractAssignment: the new submission's covered interval [week_ending_date - 6 days, week_ending_date] (CLOSED on both ends, so back-to-back weeks that share no day are permitted) must not intersect the covered interval of any existing submission on the same assignment whose workflow_status is in {DRAFT, PENDING_CERTIFICATION, SUBMITTED, UNDER_REVIEW, ACCEPTED}. RETURNED rows do not occupy their week and may be superseded."
    error_id: ERR_PAYROLL_WEEK_OVERLAP
    http_status: 409
    applies_to: "POST /payroll-submissions"
  - priority: 25
    category: business_temporal
    check: "Governing-period occupation on a locality: the activating determination's HALF-OPEN interval [effective_date, expiry_date or +infinity) must not intersect the half-open governing interval of any other determination with the same locality_code whose status is in {ACTIVE, SUPERSEDED}, unless that determination is named as supersedes_determination_id. Because both intervals are half-open, a determination whose effective_date exactly equals another determination's expiry_date (whether that expiry was declared on input or written by a supersede) does NOT collide, while one whose effective_date falls strictly inside that closed-open span does."
    error_id: ERR_DETERMINATION_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /wage-determinations/{id}/activate"
  - priority: 26
    category: business_temporal
    check: "Interview window occupation on a Worker: the requested HALF-OPEN window [window_start, window_end) expanded by INTERVIEW_BUFFER_MINUTES = 60 on BOTH sides must not intersect the unexpanded window of any other OnSiteInterview on the same worker_id with status in {SCHEDULED, CONDUCTED_MATCHED, CONDUCTED_DISCREPANT}. Buffered adjacency is therefore a conflict even when the raw windows merely touch."
    error_id: ERR_INTERVIEW_BUFFER_CONFLICT
    http_status: 409
    applies_to: "POST /interviews"
  - priority: 27
    category: business_temporal
    check: "Portal hard close: at certify time the logical clock must be at or before week_ending_date + PORTAL_HARD_CLOSE_DAYS (90) days. Equality is accepted."
    error_id: ERR_SUBMISSION_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /payroll-submissions/{id}/certify"
  - priority: 28
    category: business_constraint
    check: "One line per worker per submission: (payroll_submission_id, worker_id) must be unique."
    error_id: ERR_DUPLICATE_WORKER_LINE
    http_status: 409
    applies_to: "POST /payroll-submissions/{id}/lines"
  - priority: 29
    category: business_constraint
    check: "Empty payroll: a submission with zero PayrollLines may only be finalized when no_work_performed is true; a submission with at least one line may not have no_work_performed true."
    error_id: ERR_EMPTY_PAYROLL
    http_status: 422
    applies_to: "POST /payroll-submissions/{id}/finalize"
  - priority: 30
    category: business_constraint
    check: "Apprentice ratio attestation: when submission.excess_apprentice_hours > 0 the certify request must carry a non-empty apprentice_ratio_exception_note. Exactly 0 excess hours needs no note."
    error_id: ERR_APPRENTICE_RATIO_EXCEEDED
    http_status: 422
    applies_to: "POST /payroll-submissions/{id}/certify"
  - priority: 31
    category: business_constraint
    check: "Fringe double counting: a line may not both name a fringe_plan_id whose plan_type is CASH_IN_LIEU and report fringe_cash_paid_cents > 0."
    error_id: ERR_FRINGE_DOUBLE_COUNT
    http_status: 422
    applies_to: "POST /payroll-submissions/{id}/lines"
  - priority: 32
    category: business_constraint
    check: "Supersede linkage: when superseded_submission_id is supplied it must reference a submission on the same contract_assignment_id with the same week_ending_date and workflow_status == RETURNED."
    error_id: ERR_INVALID_SUPERSEDE_TARGET
    http_status: 409
    applies_to: "POST /payroll-submissions"
  - priority: 33
    category: business_fiscal
    check: "Restitution ceiling at creation: the sum of amount_cents over this finding's RestitutionPayments with status in {PENDING, DISBURSED}, plus the new amount_cents, must not exceed finding.restitution_required_cents."
    error_id: ERR_RESTITUTION_EXCEEDS_OBLIGATION
    http_status: 422
    applies_to: "POST /findings/{id}/restitution-payments"
  - priority: 34
    category: business_fiscal
    check: "Restitution ceiling at disbursement: payment.amount_cents must be <= finding.restitution_outstanding_cents."
    error_id: ERR_RESTITUTION_EXCEEDS_OBLIGATION
    http_status: 422
    applies_to: "POST /restitution-payments/{id}/disburse"
  - priority: 35
    category: business_fiscal
    check: "Finding restitution ceiling: restitution_required_cents on a UNDERPAYMENT finding must be <= the cited submission's make_whole_underpayment_cents."
    error_id: ERR_RESTITUTION_ABOVE_COMPUTED_UNDERPAYMENT
    http_status: 422
    applies_to: "POST /findings"
  - priority: 36
    category: business_fiscal
    check: "Closeout ledger gate: project.open_finding_count must be 0 and project.outstanding_restitution_cents must be 0, and no submission on the project may sit in a non-terminal workflow_status."
    error_id: ERR_OPEN_FINDINGS_BLOCK_CLOSEOUT
    http_status: 409
    applies_to: "POST /projects/{id}/status (to_status = CLOSED)"
  - priority: 37
    category: business_fiscal
    check: "Underpayment gate on acceptance: a submission whose compliance_status is DEFICIENT may not be accepted."
    error_id: ERR_UNDERPAYMENT_UNRESOLVED
    http_status: 409
    applies_to: "POST /payroll-submissions/{id}/accept"

endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. Before any call the logical clock reads exactly 2026-08-01T00:00:00.000Z and never falls back to wall-clock time. Also re-runs calculations.debarment_risk_score for every Contractor whose last_finding_at is not null, so decay is observable."
    roles: [PortalAdmin]
    code: 200
    input: [to_iso8601]
    output: ClockState
    side_effects:
      - "sets the logical clock to to_iso8601"
      - "recomputes Contractor.debarment_risk_score for every contractor with last_finding_at not null, which may drive Contractor PROPOSED_to_CLEAR"

  - method: POST
    path: "/reporting-portals"
    description: "Registers a project-specific reporting portal."
    roles: [PortalAdmin]
    code: 201
    input: [portal_code, submission_format, cutoff_offset_days, "grace_hours?", "requires_notarized_statement?"]
    output: ReportingPortal
    side_effects: []

  - method: POST
    path: "/wage-determinations"
    description: "Creates a DRAFT wage determination for a locality."
    roles: [PortalAdmin]
    code: 201
    input: [decision_number, "modification_number?", locality_code, effective_date, "expiry_date?"]
    output: WageDetermination
    side_effects: ["sets status = DRAFT, rate_count = 0, version = 1"]

  - method: POST
    path: "/wage-determinations/{id}/wage-rates"
    description: "Adds a classification rate row to a DRAFT determination."
    roles: [PortalAdmin]
    code: 201
    input: [classification_code, trade_code, "zone_code?", base_hourly_rate_cents, fringe_hourly_rate_cents, "zone_adjustment_cents?", apprentice_scale_pct]
    output: WageRate
    side_effects: ["increments WageDetermination.rate_count and WageDetermination.version by 1"]

  - method: GET
    path: "/wage-determinations/{id}/wage-rates"
    description: "Lists the rate rows of a determination."
    roles: [PortalAdmin, AgencyComplianceOfficer, LaborStandardsAuditor, PayrollPreparer, CertifyingOfficial]
    code: 200
    input: ["classification_code?", "zone_code?", "limit?", "offset?"]
    output: WageRate[]
    side_effects: []

  - method: POST
    path: "/wage-determinations/{id}/activate"
    description: "Activates a DRAFT determination, optionally superseding the currently ACTIVE determination for the same locality."
    roles: [PortalAdmin]
    code: 200
    input: ["supersedes_determination_id?"]
    output: WageDetermination
    side_effects:
      - "drives WageDetermination DRAFT_to_ACTIVE"
      - "drives the named predecessor ACTIVE_to_SUPERSEDED, setting its expiry_date and superseded_by_id"
      - "re-points AWARDED Projects from the predecessor to this determination"
      - "recomputes required rates and underpayment totals on DRAFT/PENDING_CERTIFICATION submissions of re-pointed projects"

  - method: GET
    path: "/wage-determinations"
    description: "Lists determinations; superseded_by_id finds the successors of a determination."
    roles: [PortalAdmin, AgencyComplianceOfficer, LaborStandardsAuditor, PayrollPreparer, CertifyingOfficial]
    code: 200
    input: ["locality_code?", "status?", "superseded_by_id?", "limit?", "offset?"]
    output: WageDetermination[]
    side_effects: []

  - method: GET
    path: "/wage-determinations/{id}"
    description: "Reads one determination including status, effective_date, expiry_date and superseded_by_id."
    roles: [PortalAdmin, AgencyComplianceOfficer, LaborStandardsAuditor, PayrollPreparer, CertifyingOfficial]
    code: 200
    input: []
    output: WageDetermination
    side_effects: []

  - method: POST
    path: "/apprentice-programs"
    description: "Registers an apprenticeship program with its permitted ratio and period count."
    roles: [PortalAdmin]
    code: 201
    input: [registration_number, sponsor_name, trade_code, "registration_status?", allowed_apprentice_hours_per_100_journey, period_count]
    output: ApprenticeProgram
    side_effects: []

  - method: PATCH
    path: "/apprentice-programs/{id}"
    description: "Updates a program's registration standing (REGISTERED, PROVISIONAL, LAPSED)."
    roles: [PortalAdmin]
    code: 200
    input: [registration_status]
    output: ApprenticeProgram
    side_effects: ["increments ApprenticeProgram.version by 1"]

  - method: POST
    path: "/contractors"
    description: "Registers a prime or subcontractor."
    roles: [PortalAdmin]
    code: 201
    input: [legal_name, dir_registration_number, "parent_contractor_id?", "registration_status?"]
    output: Contractor
    side_effects: ["sets debarment_status = CLEAR, debarment_risk_score = 0"]

  - method: GET
    path: "/contractors"
    description: "Lists contractors; parent_contractor_id finds the corporate children of a contractor."
    roles: [PortalAdmin, AgencyComplianceOfficer, LaborStandardsAuditor, PayrollPreparer, CertifyingOfficial]
    code: 200
    input: ["parent_contractor_id?", "debarment_status?", "registration_status?", "limit?", "offset?"]
    output: Contractor[]
    side_effects: []

  - method: GET
    path: "/contractors/{id}"
    description: "Reads one contractor including debarment_risk_score, open_critical_finding_count and outstanding_restitution_cents."
    roles: [PortalAdmin, AgencyComplianceOfficer, LaborStandardsAuditor, PayrollPreparer, CertifyingOfficial]
    code: 200
    input: []
    output: Contractor
    side_effects: []

  - method: POST
    path: "/contractors/{id}/debarment"
    description: "Formally debars a contractor already in PROPOSED, or restores a PROPOSED contractor to CLEAR."
    roles: [LaborStandardsAuditor]
    code: 200
    input: [to_status, reason]
    output: Contractor
    side_effects:
      - "drives Contractor PROPOSED_to_DEBARRED or PROPOSED_to_CLEAR"
      - "on DEBARRED, suspends every INVITED/ACTIVE ContractAssignment of the contractor and recomputes each project's suspended_assignment_count and posture"

  - method: POST
    path: "/contractors/{id}/staff"
    description: "Adds a payroll preparer / certifying official to a contractor."
    roles: [PortalAdmin]
    code: 201
    input: [full_name, capability, "notary_reference_number?"]
    output: ContractorStaff
    side_effects: []

  - method: GET
    path: "/contractors/{id}/staff"
    description: "Lists a contractor's staff members."
    roles: [PortalAdmin, AgencyComplianceOfficer, LaborStandardsAuditor, PayrollPreparer, CertifyingOfficial]
    code: 200
    input: ["capability?", "limit?", "offset?"]
    output: ContractorStaff[]
    side_effects: []

  - method: POST
    path: "/contractors/{id}/fringe-plans"
    description: "Declares a fringe benefit plan; both annualization variants are computed and stored immediately."
    roles: [PayrollPreparer]
    code: 201
    input: [plan_name, plan_type, annual_contribution_cents, annual_total_hours, annual_public_works_hours]
    output: FringeBenefitPlan
    side_effects:
      - "runs calculations.fringe_hourly_credit, writing annualized_credit_cents and claimed_credit_cents"
      - "sets approval_status = PENDING_APPROVAL"

  - method: GET
    path: "/contractors/{id}/fringe-plans"
    description: "Lists a contractor's fringe plans with both annualized_credit_cents and claimed_credit_cents."
    roles: [PortalAdmin, AgencyComplianceOfficer, LaborStandardsAuditor, PayrollPreparer, CertifyingOfficial]
    code: 200
    input: ["approval_status?", "plan_type?", "limit?", "offset?"]
    output: FringeBenefitPlan[]
    side_effects: []

  - method: POST
    path: "/fringe-plans/{id}/approve"
    description: "Agency decision on a fringe plan: APPROVE makes annualized_credit_cents creditable on payroll lines, REJECT blocks the plan."
    roles: [AgencyComplianceOfficer]
    code: 200
    input: [decision]
    output: FringeBenefitPlan
    side_effects:
      - "sets approval_status = APPROVED or REJECTED"
      - "re-runs calculations.fringe_hourly_credit"
      - "increments FringeBenefitPlan.version by 1"

  - method: POST
    path: "/projects"
    description: "Creates a public works project and locks its wage determination and reporting portal at award."
    roles: [PortalAdmin]
    code: 201
    input: [project_name, awarding_agency, locality_code, "zone_code?", wage_determination_id, reporting_portal_id, funding_source, contract_award_date]
    output: Project
    side_effects: ["sets status = AWARDED, posture = OPEN and all derived counters to 0"]

  - method: GET
    path: "/projects"
    description: "Lists projects; wage_determination_id and reporting_portal_id find the projects attached to a determination or portal."
    roles: [PortalAdmin, AgencyComplianceOfficer, LaborStandardsAuditor, PayrollPreparer, CertifyingOfficial]
    code: 200
    input: ["wage_determination_id?", "reporting_portal_id?", "status?", "posture?", "locality_code?", "limit?", "offset?"]
    output: Project[]
    side_effects: []

  - method: GET
    path: "/projects/{id}"
    description: "Reads one project including posture and all derived compliance counters."
    roles: [PortalAdmin, AgencyComplianceOfficer, LaborStandardsAuditor, PayrollPreparer, CertifyingOfficial]
    code: 200
    input: []
    output: Project
    side_effects: []

  - method: POST
    path: "/projects/{id}/status"
    description: "Advances the project lifecycle to ACTIVE, SUBSTANTIALLY_COMPLETE or CLOSED."
    roles: [PortalAdmin]
    code: 200
    input: [to_status]
    output: Project
    side_effects:
      - "drives the Project status machine"
      - "re-runs calculations.project_posture"
      - "on CLOSED, terminates every non-terminal ContractAssignment on the project"

  - method: POST
    path: "/projects/{id}/contract-assignments"
    description: "Adds a prime (tier 0) or subcontract tier to a project."
    roles: [PortalAdmin]
    code: 201
    input: [contractor_id, "upper_tier_assignment_id?", subcontract_amount_cents]
    output: ContractAssignment
    side_effects: ["computes tier from the upper tier, sets status = INVITED, version = 1"]

  - method: GET
    path: "/projects/{id}/contract-assignments"
    description: "Lists the tiers of a project."
    roles: [PortalAdmin, AgencyComplianceOfficer, LaborStandardsAuditor, PayrollPreparer, CertifyingOfficial]
    code: 200
    input: ["status?", "tier?", "limit?", "offset?"]
    output: ContractAssignment[]
    side_effects: []

  - method: GET
    path: "/contract-assignments"
    description: "Lists assignments; contractor_id finds a contractor's tiers, upper_tier_assignment_id finds the lower tiers awarded by a tier."
    roles: [PortalAdmin, AgencyComplianceOfficer, LaborStandardsAuditor, PayrollPreparer, CertifyingOfficial]
    code: 200
    input: ["project_id?", "contractor_id?", "upper_tier_assignment_id?", "status?", "limit?", "offset?"]
    output: ContractAssignment[]
    side_effects: []

  - method: GET
    path: "/contract-assignments/{id}"
    description: "Reads one tier including tier, status, cumulative_certified_hours, open_finding_count and version."
    roles: [PortalAdmin, AgencyComplianceOfficer, LaborStandardsAuditor, PayrollPreparer, CertifyingOfficial]
    code: 200
    input: []
    output: ContractAssignment
    side_effects: []

  - method: POST
    path: "/contract-assignments/{id}/activate"
    description: "Activates an INVITED tier once its contractor is CLEAR and REGISTERED and its upper tier is ACTIVE."
    roles: [PortalAdmin]
    code: 200
    input: []
    output: ContractAssignment
    side_effects:
      - "drives ContractAssignment INVITED_to_ACTIVE"
      - "increments ContractAssignment.version by 1"

  - method: POST
    path: "/contract-assignments/{id}/reinstate"
    description: "Returns a SUSPENDED tier to ACTIVE once its findings are closed and its contractor is CLEAR."
    roles: [AgencyComplianceOfficer]
    code: 200
    input: [reason]
    output: ContractAssignment
    side_effects:
      - "drives ContractAssignment SUSPENDED_to_ACTIVE"
      - "recomputes the project's suspended_assignment_count and posture"

  - method: POST
    path: "/workers"
    description: "Registers a worker under an employing contractor, optionally enrolled in an apprenticeship program."
    roles: [PayrollPreparer]
    code: 201
    input: [employer_contractor_id, worker_number, full_name, default_classification_code, "apprentice_program_id?", "apprentice_period?"]
    output: Worker
    side_effects: []

  - method: GET
    path: "/workers"
    description: "Lists workers; employer_contractor_id and apprentice_program_id find a contractor's or a program's workers."
    roles: [PortalAdmin, AgencyComplianceOfficer, LaborStandardsAuditor, PayrollPreparer, CertifyingOfficial]
    code: 200
    input: ["employer_contractor_id?", "apprentice_program_id?", "worker_number?", "limit?", "offset?"]
    output: Worker[]
    side_effects: []

  - method: GET
    path: "/workers/{id}"
    description: "Reads one worker including employer_contractor_id, apprentice_program_id and apprentice_period."
    roles: [PortalAdmin, AgencyComplianceOfficer, LaborStandardsAuditor, PayrollPreparer, CertifyingOfficial]
    code: 200
    input: []
    output: Worker
    side_effects: []

  - method: POST
    path: "/payroll-submissions"
    description: "Opens a DRAFT weekly certified payroll for a tier. Carries OCC on the assignment; a correction filing names the RETURNED row it supersedes."
    roles: [PayrollPreparer]
    code: 201
    input: [contract_assignment_id, week_ending_date, prepared_by_staff_id, expected_contract_assignment_version, "superseded_submission_id?", "no_work_performed?"]
    output: PayrollSubmission
    side_effects:
      - "sets workflow_status = DRAFT and compliance_status = UNVERIFIED"
      - "increments ContractAssignment.version by 1"

  - method: GET
    path: "/payroll-submissions"
    description: "Lists submissions; contract_assignment_id, prepared_by_staff_id, certified_by_staff_id and superseded_submission_id are the reverse-lookup filters for those foreign keys."
    roles: [PortalAdmin, AgencyComplianceOfficer, LaborStandardsAuditor, PayrollPreparer, CertifyingOfficial]
    code: 200
    input: ["contract_assignment_id?", "project_id?", "workflow_status?", "compliance_status?", "week_ending_date?", "prepared_by_staff_id?", "certified_by_staff_id?", "superseded_submission_id?", "is_late?", "limit?", "offset?"]
    output: PayrollSubmission[]
    side_effects: []

  - method: GET
    path: "/payroll-submissions/{id}"
    description: "Reads one weekly filing: both axes, computed totals, filing_due_at, is_late, superseded_submission_id and version."
    roles: [PortalAdmin, AgencyComplianceOfficer, LaborStandardsAuditor, PayrollPreparer, CertifyingOfficial]
    code: 200
    input: []
    output: PayrollSubmission
    side_effects: []

  - method: POST
    path: "/payroll-submissions/{id}/lines"
    description: "Adds one worker's week to a DRAFT payroll."
    roles: [PayrollPreparer]
    code: 201
    input: [worker_id, classification_code, straight_hours, overtime_hours, base_rate_paid_cents, "overtime_rate_paid_cents?", "fringe_cash_paid_cents?", "fringe_plan_id?", "reported_as_apprentice?"]
    output: PayrollLine
    side_effects:
      - "increments PayrollSubmission.version by 1"
      - "leaves all computed line fields at 0 until finalization"

  - method: GET
    path: "/payroll-lines"
    description: "Lists payroll lines; payroll_submission_id, worker_id and fringe_plan_id are the reverse-lookup filters for those foreign keys."
    roles: [PortalAdmin, AgencyComplianceOfficer, LaborStandardsAuditor, PayrollPreparer, CertifyingOfficial]
    code: 200
    input: ["payroll_submission_id?", "worker_id?", "fringe_plan_id?", "classification_code?", "limit?", "offset?"]
    output: PayrollLine[]
    side_effects: []

  - method: GET
    path: "/payroll-lines/{id}"
    description: "Reads one payroll line including every computed required-rate, creditable-fringe and underpayment field."
    roles: [PortalAdmin, AgencyComplianceOfficer, LaborStandardsAuditor, PayrollPreparer, CertifyingOfficial]
    code: 200
    input: []
    output: PayrollLine
    side_effects: []

  - method: POST
    path: "/payroll-submissions/{id}/finalize"
    description: "Runs the full wage engine on a DRAFT payroll in the pinned order (apprentice ratio, required rate, creditable fringe, underpayment) and moves the filing axis to PENDING_CERTIFICATION while the compliance axis becomes COMPLIANT or DEFICIENT."
    roles: [PayrollPreparer]
    code: 200
    input: []
    output: PayrollSubmission
    side_effects:
      - "writes every computed PayrollLine field"
      - "writes total_hours_reported, excess_apprentice_hours, straight_time_underpayment_cents, make_whole_underpayment_cents, filing_due_at"
      - "drives workflow DRAFT_to_PENDING_CERTIFICATION and the compliance axis UNVERIFIED_to_COMPLIANT or UNVERIFIED_to_DEFICIENT"
      - "increments PayrollSubmission.version by 1"

  - method: POST
    path: "/payroll-submissions/{id}/certify"
    description: "Signs the statement of compliance and transmits to the portal in one act; enforces segregation of duties against the preparer, notarization, the apprentice-ratio attestation and the portal hard close."
    roles: [CertifyingOfficial]
    code: 200
    input: ["notary_reference_number?", "apprentice_ratio_exception_note?"]
    output: PayrollSubmission
    side_effects:
      - "sets certified_by_staff_id, statement_signed_at, submitted_at, is_late"
      - "drives workflow PENDING_CERTIFICATION_to_SUBMITTED"
      - "increments PayrollSubmission.version by 1"

  - method: POST
    path: "/payroll-submissions/{id}/begin-review"
    description: "Agency picks up a SUBMITTED payroll for review."
    roles: [AgencyComplianceOfficer]
    code: 200
    input: []
    output: PayrollSubmission
    side_effects: ["drives workflow SUBMITTED_to_UNDER_REVIEW", "increments PayrollSubmission.version by 1"]

  - method: POST
    path: "/payroll-submissions/{id}/accept"
    description: "Accepts a reviewed payroll and adds its hours to the assignment's certified-hours ledger."
    roles: [AgencyComplianceOfficer]
    code: 200
    input: []
    output: PayrollSubmission
    side_effects:
      - "drives workflow UNDER_REVIEW_to_ACCEPTED and records accepted_by_user_id"
      - "adds total_hours_reported to ContractAssignment.cumulative_certified_hours"
      - "increments PayrollSubmission.version and ContractAssignment.version by 1"

  - method: POST
    path: "/payroll-submissions/{id}/return"
    description: "Returns a reviewed payroll for correction; the row becomes terminal and may only be replaced by a superseding filing."
    roles: [AgencyComplianceOfficer]
    code: 200
    input: [return_reason]
    output: PayrollSubmission
    side_effects:
      - "drives workflow UNDER_REVIEW_to_RETURNED"
      - "increments PayrollSubmission.version and ContractAssignment.version by 1"

  - method: POST
    path: "/payroll-submissions/{id}/rescind-acceptance"
    description: "Compensating action for an acceptance: returns the row to UNDER_REVIEW and removes its hours from the certified-hours ledger, restoring the exact prior value."
    roles: [AgencyComplianceOfficer]
    code: 200
    input: [rescission_reason]
    output: PayrollSubmission
    side_effects:
      - "drives workflow ACCEPTED_to_UNDER_REVIEW and clears accepted_by_user_id"
      - "subtracts total_hours_reported from ContractAssignment.cumulative_certified_hours"
      - "increments PayrollSubmission.version and ContractAssignment.version by 1"

  - method: GET
    path: "/payroll-submissions/{id}/underpayment-summary"
    description: "Computed read exposing both underpayment variants side by side plus the excess apprentice hours."
    roles: [PortalAdmin, AgencyComplianceOfficer, LaborStandardsAuditor, PayrollPreparer, CertifyingOfficial]
    code: 200
    input: []
    output: UnderpaymentSummary
    side_effects: []

  - method: POST
    path: "/findings"
    description: "Auditor raises a compliance finding against an ACCEPTED or UNDER_REVIEW payroll submission."
    roles: [LaborStandardsAuditor]
    code: 201
    input: [project_id, payroll_submission_id, "worker_id?", finding_type, severity, restitution_required_cents]
    output: Finding
    side_effects:
      - "sets status = OPEN, restitution_outstanding_cents = restitution_required_cents, response_round = 0, raised_by_user_id = acting X-User-ID, response_due_at = clock now + 30 days"
      - "moves the cited submission's compliance axis COMPLIANT_to_DEFICIENT or REMEDIED_to_DEFICIENT"
      - "sets contractor.last_finding_at, recomputes contractor.open_critical_finding_count / outstanding_restitution_cents / debarment_risk_score, which may drive Contractor CLEAR_to_PROPOSED and from there suspend every ACTIVE assignment of that contractor"
      - "recomputes assignment.open_finding_count and, on severity CRITICAL, drives ContractAssignment ACTIVE_to_SUSPENDED"
      - "recomputes project.open_finding_count / open_critical_finding_count / outstanding_restitution_cents / suspended_assignment_count and calculations.project_posture"

  - method: GET
    path: "/findings"
    description: "Lists findings; project_id, payroll_submission_id, worker_id and source_interview_id are the reverse-lookup filters for those foreign keys."
    roles: [PortalAdmin, AgencyComplianceOfficer, LaborStandardsAuditor, PayrollPreparer, CertifyingOfficial]
    code: 200
    input: ["project_id?", "payroll_submission_id?", "worker_id?", "source_interview_id?", "status?", "severity?", "finding_type?", "limit?", "offset?"]
    output: Finding[]
    side_effects: []

  - method: GET
    path: "/findings/{id}"
    description: "Reads one finding including status, severity, response_round, restitution_required_cents and version."
    roles: [PortalAdmin, AgencyComplianceOfficer, LaborStandardsAuditor, PayrollPreparer, CertifyingOfficial]
    code: 200
    input: []
    output: Finding
    side_effects: []

  - method: POST
    path: "/findings/{id}/response"
    description: "Contractor files or re-files a response on an OPEN or RESPONSE_REJECTED finding; carries OCC on the finding."
    roles: [CertifyingOfficial]
    code: 200
    input: [response_narrative, expected_finding_version]
    output: Finding
    side_effects:
      - "drives Finding OPEN_to_RESPONSE_SUBMITTED or RESPONSE_REJECTED_to_RESPONSE_SUBMITTED"
      - "increments response_round and Finding.version by 1"

  - method: POST
    path: "/findings/{id}/review-response"
    description: "Agency accepts or rejects a filed response; acceptance requires a zero outstanding balance and a reviewer who did not accept the cited payroll."
    roles: [AgencyComplianceOfficer]
    code: 200
    input: [decision, "reviewer_note?"]
    output: Finding
    side_effects:
      - "drives Finding RESPONSE_SUBMITTED_to_RESPONSE_ACCEPTED or RESPONSE_SUBMITTED_to_RESPONSE_REJECTED"
      - "on acceptance, recomputes project posture/counters, assignment.open_finding_count, contractor risk score and the cited submission's compliance axis"

  - method: POST
    path: "/findings/{id}/withdraw"
    description: "Auditor withdraws a finding that has no disbursed restitution; voids its PENDING payments and zeroes its outstanding balance."
    roles: [LaborStandardsAuditor]
    code: 200
    input: [withdrawal_reason]
    output: Finding
    side_effects:
      - "drives Finding OPEN_to_WITHDRAWN or RESPONSE_REJECTED_to_WITHDRAWN"
      - "sets every PENDING RestitutionPayment on the finding to VOIDED"
      - "recomputes project posture/counters, assignment.open_finding_count, contractor risk score and the cited submission's compliance axis"

  - method: POST
    path: "/findings/{id}/restitution-payments"
    description: "Schedules a back-wage payment to a worker against a finding's obligation."
    roles: [PayrollPreparer]
    code: 201
    input: [worker_id, amount_cents]
    output: RestitutionPayment
    side_effects: ["sets status = PENDING; leaves the finding's outstanding balance untouched until disbursement"]

  - method: GET
    path: "/restitution-payments"
    description: "Lists restitution payments; finding_id and worker_id are the reverse-lookup filters for those foreign keys."
    roles: [PortalAdmin, AgencyComplianceOfficer, LaborStandardsAuditor, PayrollPreparer, CertifyingOfficial]
    code: 200
    input: ["finding_id?", "worker_id?", "status?", "limit?", "offset?"]
    output: RestitutionPayment[]
    side_effects: []

  - method: GET
    path: "/restitution-payments/{id}"
    description: "Reads one restitution payment including status, amount_cents, disbursed_at and reversal linkage."
    roles: [PortalAdmin, AgencyComplianceOfficer, LaborStandardsAuditor, PayrollPreparer, CertifyingOfficial]
    code: 200
    input: []
    output: RestitutionPayment
    side_effects: []

  - method: POST
    path: "/restitution-payments/{id}/disburse"
    description: "Disburses a PENDING back-wage payment, debiting the finding's outstanding obligation."
    roles: [PayrollPreparer]
    code: 200
    input: []
    output: RestitutionPayment
    side_effects:
      - "drives RestitutionPayment PENDING_to_DISBURSED"
      - "decrements finding.restitution_outstanding_cents, increments assignment.cumulative_restitution_cents, recomputes contractor.outstanding_restitution_cents and debarment_risk_score"
      - "when the outstanding balance reaches 0 on an UNDERPAYMENT finding in RESPONSE_SUBMITTED, auto-drives RESPONSE_SUBMITTED_to_RESPONSE_ACCEPTED and from there the cited submission's compliance axis to REMEDIED and the project's posture recomputation"

  - method: POST
    path: "/restitution-payments/{id}/reverse"
    description: "Compensating action: a DISBURSED payment becomes REVERSED and its cents return to the finding's outstanding balance; a PENDING payment becomes VOIDED with no ledger movement."
    roles: [AgencyComplianceOfficer]
    code: 200
    input: [reversal_reason]
    output: RestitutionPayment
    side_effects:
      - "drives RestitutionPayment DISBURSED_to_REVERSED or PENDING_to_VOIDED depending on the from-state"
      - "on REVERSED, restores finding.restitution_outstanding_cents and assignment.cumulative_restitution_cents to their exact pre-disbursement values, rolls an auto-accepted finding back to RESPONSE_SUBMITTED, and returns the cited submission's compliance axis to RESTITUTION_PENDING when another DISBURSED payment remains on it or to DEFICIENT when none does"

  - method: POST
    path: "/interviews"
    description: "Schedules an on-site interview window for a worker on a project tier."
    roles: [LaborStandardsAuditor]
    code: 201
    input: [project_id, contract_assignment_id, worker_id, window_start, window_end]
    output: OnSiteInterview
    side_effects: ["sets status = SCHEDULED and occupies the buffered window on the worker"]

  - method: POST
    path: "/interviews/{id}/conduct"
    description: "Records the observation and forks to CONDUCTED_MATCHED or CONDUCTED_DISCREPANT by comparing it against the ACCEPTED payroll covering window_start."
    roles: [LaborStandardsAuditor]
    code: 200
    input: [observed_classification_code, observed_hourly_rate_cents]
    output: OnSiteInterview
    side_effects:
      - "sets compared_submission_id, observed fields and status"
      - "increments Worker.interview_count by 1"
      - "on the DISCREPANT branch only, auto-creates a MISCLASSIFICATION / MAJOR Finding and cascades the compliance axis, counters and posture"

  - method: POST
    path: "/interviews/{id}/cancel"
    description: "Cancels a SCHEDULED interview and frees its buffered window."
    roles: [LaborStandardsAuditor]
    code: 200
    input: [cancellation_reason]
    output: OnSiteInterview
    side_effects: ["drives OnSiteInterview SCHEDULED_to_CANCELLED", "increments OnSiteInterview.version by 1"]

  - method: GET
    path: "/interviews"
    description: "Lists interviews; project_id, contract_assignment_id, worker_id and compared_submission_id are the reverse-lookup filters for those foreign keys."
    roles: [PortalAdmin, AgencyComplianceOfficer, LaborStandardsAuditor, PayrollPreparer, CertifyingOfficial]
    code: 200
    input: ["project_id?", "contract_assignment_id?", "worker_id?", "compared_submission_id?", "status?", "limit?", "offset?"]
    output: OnSiteInterview[]
    side_effects: []

  - method: GET
    path: "/interviews/{id}"
    description: "Reads one on-site interview including its buffered window, status, comparison result and raised finding."
    roles: [PortalAdmin, AgencyComplianceOfficer, LaborStandardsAuditor, PayrollPreparer, CertifyingOfficial]
    code: 200
    input: []
    output: OnSiteInterview
    side_effects: []

composite_outputs:
  - name: ClockState
    fields:
      - name: current_utc
        type: datetime
        source: system
        description: The logical clock's value after the call; default before any call is 2026-08-01T00:00:00.000Z.
      - name: contractors_rescored
        type: integer
        source: computed
        description: Count of contractors whose debarment_risk_score was recomputed by this clock move.
  - name: UnderpaymentSummary
    fields:
      - name: payroll_submission_id
        type: string
        source: system
        description: Identifier of the PayrollSubmission summarised (echo of the path id).
      - name: straight_time_underpayment_cents
        type: integer
        source: computed
        description: Variant STRAIGHT_TIME_ONLY total.
      - name: make_whole_underpayment_cents
        type: integer
        source: computed
        description: Variant FULL_MAKE_WHOLE total (authoritative).
      - name: variant_delta_cents
        type: integer
        source: computed
        description: make_whole_underpayment_cents minus straight_time_underpayment_cents.
      - name: excess_apprentice_hours
        type: number
        source: computed
        description: Submission-level excess apprentice hours.
      - name: line_count
        type: integer
        source: computed
        description: Number of PayrollLines on the submission.

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the five declared roles."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The acting role is not listed for the endpoint."
  - id: ERR_NOT_OWNER
    http: 403
    condition: "The acting ContractorStaff's contractor_id does not match the contractor of the targeted assignment, submission, finding or payment."
  - id: ERR_STAFF_CAPABILITY_MISSING
    http: 403
    condition: "The acting ContractorStaff lacks the capability the endpoint requires (PREPARER/BOTH to prepare, CERTIFIER/BOTH to certify or respond)."
  - id: ERR_PROJECT_NOT_FOUND
    http: 404
    condition: "No Project with the given id."
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "No ContractAssignment with the given id, in path or body."
  - id: ERR_SUBMISSION_NOT_FOUND
    http: 404
    condition: "No PayrollSubmission with the given id, in path or body."
  - id: ERR_FINDING_NOT_FOUND
    http: 404
    condition: "No Finding with the given id."
  - id: ERR_RESTITUTION_NOT_FOUND
    http: 404
    condition: "No RestitutionPayment with the given id."
  - id: ERR_INTERVIEW_NOT_FOUND
    http: 404
    condition: "No OnSiteInterview with the given id."
  - id: ERR_DETERMINATION_NOT_FOUND
    http: 404
    condition: "No WageDetermination with the given id, in path or body."
  - id: ERR_CONTRACTOR_NOT_FOUND
    http: 404
    condition: "No Contractor with the given id, in path or body."
  - id: ERR_STAFF_NOT_FOUND
    http: 404
    condition: "No ContractorStaff with the given prepared_by_staff_id or acting X-User-ID."
  - id: ERR_WORKER_NOT_FOUND
    http: 404
    condition: "No Worker with the given worker_id."
  - id: ERR_FRINGE_PLAN_NOT_FOUND
    http: 404
    condition: "No FringeBenefitPlan with the given id, in path or body."
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "No ApprenticeProgram with the given id."
  - id: ERR_PORTAL_NOT_FOUND
    http: 404
    condition: "No ReportingPortal with the given reporting_portal_id."
  - id: ERR_VALIDATION
    http: 422
    condition: "Required body field missing, enum out of range, negative integer where non-negative required, hours with more than 2 decimal places, or unparseable timestamp."
  - id: ERR_INVALID_SUBMISSION_STATE
    http: 409
    condition: "The submission's workflow_status is not a declared from-state for the requested transition."
  - id: ERR_INVALID_FINDING_STATE
    http: 409
    condition: "The finding's status is not a declared from-state for the requested transition."
  - id: ERR_INVALID_ASSIGNMENT_STATE
    http: 409
    condition: "The assignment's status is not a declared from-state for activate or reinstate, or is not ACTIVE when a payroll is opened or finalized."
  - id: ERR_INVALID_DETERMINATION_STATE
    http: 409
    condition: "Activating a determination that is not DRAFT, activating a determination whose rate_count is 0, adding a rate to a determination that is not DRAFT, or naming a supersedes_determination_id that is not ACTIVE, of a different locality, or whose effective_date is not strictly before the activating determination's effective_date."
  - id: ERR_INVALID_INTERVIEW_STATE
    http: 409
    condition: "Conducting or cancelling an interview that is not SCHEDULED."
  - id: ERR_INVALID_PAYMENT_STATE
    http: 409
    condition: "Disbursing a payment that is not PENDING, or reversing one already REVERSED or VOIDED."
  - id: ERR_INVALID_PROJECT_STATUS_TRANSITION
    http: 409
    condition: "to_status is not reachable from the project's current status, or the prime tier is not ACTIVE when activating."
  - id: ERR_PROJECT_FROZEN
    http: 409
    condition: "The owning project's posture is FROZEN and the requested payroll or completion operation is gated on it."
  - id: ERR_STALE_ASSIGNMENT_VERSION
    http: 412
    condition: "expected_contract_assignment_version does not equal the assignment's current version."
  - id: ERR_STALE_FINDING_VERSION
    http: 412
    condition: "expected_finding_version does not equal the finding's current version."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "The certifying ContractorStaff.id equals the submission's prepared_by_staff_id."
  - id: ERR_SOD_REVIEW_CONFLICT
    http: 409
    condition: "The reviewing AgencyComplianceOfficer's X-User-ID equals the cited submission's accepted_by_user_id."
  - id: ERR_NOTARIZATION_REQUIRED
    http: 422
    condition: "The project's portal requires a notarized statement and notary_reference_number is absent or does not match the certifying staff member's notary_reference_number."
  - id: ERR_CONTRACTOR_DEBARRED
    http: 409
    condition: "The contractor's debarment_status is not CLEAR or its registration_status is not REGISTERED when a tier is created, activated or reinstated."
  - id: ERR_APPRENTICE_PROGRAM_NOT_REGISTERED
    http: 422
    condition: "A line reported as apprentice references a worker whose program is missing or whose registration_status is not REGISTERED."
  - id: ERR_APPRENTICE_TRADE_MISMATCH
    http: 422
    condition: "The apprentice program's trade_code differs from the matched WageRate's trade_code."
  - id: ERR_APPRENTICE_PERIOD_OUT_OF_SCALE
    http: 422
    condition: "worker.apprentice_period exceeds the matched WageRate.apprentice_scale_pct length or the program's period_count."
  - id: ERR_NO_WAGE_RATE_FOR_CLASSIFICATION
    http: 422
    condition: "No WageRate exists for (project.wage_determination_id, classification_code, project.zone_code)."
  - id: ERR_FRINGE_PLAN_FOREIGN
    http: 422
    condition: "The named fringe plan belongs to a contractor other than the assignment's contractor."
  - id: ERR_FRINGE_PLAN_NOT_APPROVED
    http: 422
    condition: "The named fringe plan's approval_status is REJECTED."
  - id: ERR_FRINGE_DOUBLE_COUNT
    http: 422
    condition: "A line names a CASH_IN_LIEU plan and also reports fringe_cash_paid_cents greater than 0."
  - id: ERR_UPPER_TIER_NOT_ACTIVE
    http: 409
    condition: "upper_tier_assignment_id belongs to another project, or is not ACTIVE at activation time."
  - id: ERR_WEEK_ENDING_NOT_SATURDAY
    http: 422
    condition: "week_ending_date is not a Saturday at exactly 00:00:00.000Z."
  - id: ERR_PAYROLL_WEEK_NOT_ENDED
    http: 422
    condition: "The logical clock is before week_ending_date at finalization."
  - id: ERR_PAYROLL_WEEK_OVERLAP
    http: 409
    condition: "The new submission's closed covered interval intersects the covered interval of a non-RETURNED submission on the same assignment."
  - id: ERR_DETERMINATION_PERIOD_OVERLAP
    http: 409
    condition: "The activating determination's half-open governing interval intersects another ACTIVE determination's interval in the same locality and that determination was not named as supersedes_determination_id."
  - id: ERR_INTERVIEW_BUFFER_CONFLICT
    http: 409
    condition: "The requested interview window, expanded by 60 minutes on both sides, intersects another non-cancelled interview window on the same worker."
  - id: ERR_SUBMISSION_WINDOW_CLOSED
    http: 409
    condition: "Certification attempted more than 90 days after week_ending_date."
  - id: ERR_DUPLICATE_WORKER_LINE
    http: 409
    condition: "A PayrollLine already exists for this (payroll_submission_id, worker_id) pair."
  - id: ERR_EMPTY_PAYROLL
    http: 422
    condition: "Finalizing a zero-line submission with no_work_performed false, or a submission that has lines with no_work_performed true."
  - id: ERR_APPRENTICE_RATIO_EXCEEDED
    http: 422
    condition: "Certifying a submission with excess_apprentice_hours greater than 0 without an apprentice_ratio_exception_note."
  - id: ERR_INVALID_SUPERSEDE_TARGET
    http: 409
    condition: "superseded_submission_id is on another assignment, has a different week_ending_date, or is not RETURNED."
  - id: ERR_RESTITUTION_EXCEEDS_OBLIGATION
    http: 422
    condition: "A scheduled or disbursed restitution amount would push the finding's satisfied total above restitution_required_cents."
  - id: ERR_RESTITUTION_ABOVE_COMPUTED_UNDERPAYMENT
    http: 422
    condition: "An UNDERPAYMENT finding's restitution_required_cents exceeds the cited submission's make_whole_underpayment_cents."
  - id: ERR_OPEN_FINDINGS_BLOCK_CLOSEOUT
    http: 409
    condition: "Closing a project while any finding is non-terminal, any restitution is outstanding, or any submission sits in a non-terminal workflow_status."
  - id: ERR_UNDERPAYMENT_UNRESOLVED
    http: 409
    condition: "Accepting a submission whose compliance_status is DEFICIENT."

roles:
  - name: PortalAdmin
    description: "System operator who maintains wage determinations, portals, apprenticeship programs, contractor registrations, staff rosters, projects and contract tiers, and the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /reporting-portals"
      - "POST /wage-determinations"
      - "POST /wage-determinations/{id}/wage-rates"
      - "POST /wage-determinations/{id}/activate"
      - "POST /apprentice-programs"
      - "PATCH /apprentice-programs/{id}"
      - "POST /contractors"
      - "POST /contractors/{id}/staff"
      - "POST /projects"
      - "POST /projects/{id}/status"
      - "POST /projects/{id}/contract-assignments"
      - "POST /contract-assignments/{id}/activate"
    shared_operations:
      - "all GET endpoints"
  - name: PayrollPreparer
    description: "Contractor staff member who assembles weekly certified payroll, registers workers and fringe plans, and schedules and disburses restitution. May never sign the statement of compliance for a payroll they prepared."
    identity: "entity_backed:ContractorStaff"
    exclusive_operations:
      - "POST /workers"
      - "POST /contractors/{id}/fringe-plans"
      - "POST /payroll-submissions"
      - "POST /payroll-submissions/{id}/lines"
      - "POST /payroll-submissions/{id}/finalize"
      - "POST /findings/{id}/restitution-payments"
      - "POST /restitution-payments/{id}/disburse"
    shared_operations:
      - "all GET endpoints"
  - name: CertifyingOfficial
    description: "Contractor staff member authorised to sign the statement of compliance and to file responses to findings. Segregation of duties forbids certifying a payroll whose prepared_by_staff_id is this same staff row."
    identity: "entity_backed:ContractorStaff"
    exclusive_operations:
      - "POST /payroll-submissions/{id}/certify"
      - "POST /findings/{id}/response"
    shared_operations:
      - "all GET endpoints"
  - name: AgencyComplianceOfficer
    description: "Awarding-agency reviewer who reviews, accepts, returns and rescinds payroll submissions, approves fringe plans, adjudicates finding responses, reverses restitution and reinstates suspended tiers. Segregation of duties forbids adjudicating a finding against a payroll this same officer accepted."
    identity: opaque
    exclusive_operations:
      - "POST /fringe-plans/{id}/approve"
      - "POST /payroll-submissions/{id}/begin-review"
      - "POST /payroll-submissions/{id}/accept"
      - "POST /payroll-submissions/{id}/return"
      - "POST /payroll-submissions/{id}/rescind-acceptance"
      - "POST /findings/{id}/review-response"
      - "POST /restitution-payments/{id}/reverse"
      - "POST /contract-assignments/{id}/reinstate"
    shared_operations:
      - "all GET endpoints"
  - name: LaborStandardsAuditor
    description: "Enforcement investigator who schedules and conducts on-site interviews, raises and withdraws findings, and issues formal debarment decisions."
    identity: opaque
    exclusive_operations:
      - "POST /interviews"
      - "POST /interviews/{id}/conduct"
      - "POST /interviews/{id}/cancel"
      - "POST /findings"
      - "POST /findings/{id}/withdraw"
      - "POST /contractors/{id}/debarment"
    shared_operations:
      - "all GET endpoints"
