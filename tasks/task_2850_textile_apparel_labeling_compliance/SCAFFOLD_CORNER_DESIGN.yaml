            - "Setup sanity: ${posture_at_review} == \"OPEN\", ${basis} == \"AD_VALOREM\" and ${assessed} == 30000.00 (300000.00 * 0.100 rounded, then * 1.00)"
            - "${ledger_before} == 30000.00 and ${posture_before} == \"SUSPENDED\" - 30000.00 is strictly above the 25000.00 threshold"
            - "Publish attempt: HTTP 422 and ${e_publish} == \"ERR_BRAND_POSTURE_SUSPENDED\" - suspension is the only posture that reaches the publish path"
            - "Approve attempt: HTTP 422 and ${e_approve} == \"ERR_BRAND_POSTURE_SUSPENDED\", never ERR_BRAND_POSTURE_RESTRICTED, because priority 90 answers before 92"
            - "Correction: HTTP 200 with ${sh_state} == \"MARKING_CORRECTED\" and ${mitigated} == 30000.00 - all 12000 units corrected inside the 10-day prompt window mitigates at rate 1.0"
            - "${ledger_after} == 0.00 and ${posture_after} == \"OPEN\""
            - "The two identical retries then succeed: ${l3_final} == \"PUBLISHED\" and ${l2_final} == \"APPROVED\", so nothing but the posture ever blocked them"

