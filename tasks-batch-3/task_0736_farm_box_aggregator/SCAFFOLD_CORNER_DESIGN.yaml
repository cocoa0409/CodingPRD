# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe across claim-extraction-guide sections. §1.8 covers depth.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: create_farm_returns_system_fields
        claim_type: Creation
        grounds: [entities.Farm, 'endpoints:POST /farms']
        distinguishing_aspect: "POST /farms with required fields returns 201 with a server-minted id, version==1, payout_balance_cents==0, settled_cycle_count==0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /farms"
              payload: { name: "Green Acres", region_code: "R1", commission_pct: 0.15, snap_authorized: true }
              as: PlatformAdmin
              captures: { farm_id: $.data.id }
          assert:
            - "response HTTP status == 201"
            - "Farm.${farm_id}.version == 1 and Farm.${farm_id}.payout_balance_cents == 0"
            - "Farm.${farm_id}.settled_cycle_count == 0"

      - name: get_farm_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Farm, 'errors[ERR_NOT_FOUND]']
        distinguishing_aspect: "GET /farms/{id} for an id absent from the DB returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /farms/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 404"
            - "response error_id == ERR_NOT_FOUND"

      - name: create_product_missing_pricing_mode_invalid_request
        claim_type: Required Fields
        grounds: [entities.Product, 'validations[priority=6]', 'errors[ERR_INVALID_REQUEST]']
        distinguishing_aspect: "POST /farms/{id}/products lacking the required pricing_mode field returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["One farm exists."]
          setup_api_calls:
            - call: "POST /farms"
              payload: { name: "Green Acres", region_code: "R1", commission_pct: 0.15, snap_authorized: true }
              as: PlatformAdmin
              captures: { farm_id: $.data.id }
          trigger:
            - call: "POST /farms/${farm_id}/products"
              payload: { name: "Mystery", category: "OTHER" }
              as: Farm
              as_user_id: "${farm_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 422"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: offering_remaining_qty_computed_on_create
        claim_type: Computed Fields
        grounds: [entities.Offering.fields.remaining_qty, calculations.offering_availability, 'endpoints:POST /market-cycles/{id}/offerings']
        distinguishing_aspect: "A freshly created offering has reserved_qty==0, committed_qty==0, remaining_qty==offered_qty (100), regardless of any client-sent value."
        test_recipe:
          setup: ["Farm with a FIXED product; a market cycle."]
          setup_api_calls:
            - call: "POST /farms"
              payload: { name: "Green Acres", region_code: "R1", commission_pct: 0.15, snap_authorized: true }
              as: PlatformAdmin
              captures: { farm_id: $.data.id }
            - call: "POST /farms/${farm_id}/products"
              payload: { name: "Eggs", category: "DAIRY", pricing_mode: "FIXED", unit_price_cents: 400, snap_eligible: false }
              as: Farm
              as_user_id: "${farm_id}"
              captures: { prod_id: $.data.id }
            - call: "POST /market-cycles"
              payload: { cycle_code: "C1", region_code: "R1", order_open_at: "2026-06-02T00:00:00Z", order_cutoff_at: "2026-06-05T00:00:00Z", fulfillment_date: "2026-06-06T00:00:00Z" }
              as: PlatformAdmin
              captures: { cycle_id: $.data.id }
          trigger:
            - call: "POST /market-cycles/${cycle_id}/offerings"
              payload: { product_id: "${prod_id}", offered_qty: 100 }
              as: Farm
              as_user_id: "${farm_id}"
              captures: { off_id: $.data.id }
          assert:
            - "Offering.${off_id}.remaining_qty == 100"
            - "Offering.${off_id}.reserved_qty == 0 and Offering.${off_id}.committed_qty == 0"

      - name: line_pricing_fixed_mode_computed
        claim_type: Computed Fields
        grounds: [calculations.line_pricing, entities.OrderLine.fields.estimated_line_cents]
        distinguishing_aspect: "A FIXED egg line (unit_price 400) of qty 2 computes estimated_line_cents == 800 and copies snap_eligible=false from the product; client cannot set these."
        test_recipe:
          setup: ["Farm/OPEN cycle/egg offering (FIXED 400, non-snap); a CART order by a customer."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /farms"
              payload: { name: "Green Acres", region_code: "R1", commission_pct: 0.15, snap_authorized: true }
              as: PlatformAdmin
              captures: { farm_id: $.data.id }
            - call: "POST /pickup-hubs"
              payload: { name: "Hub", hub_type: "PICKUP", slot_capacity: 100, region_code: "R1" }
              as: PlatformAdmin
              captures: { hub_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Ada", snap_balance_cents: 0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /farms/${farm_id}/products"
              payload: { name: "Eggs", category: "DAIRY", pricing_mode: "FIXED", unit_price_cents: 400, snap_eligible: false }
              as: Farm
              as_user_id: "${farm_id}"
              captures: { prod_id: $.data.id }
            - call: "POST /market-cycles"
              payload: { cycle_code: "C1", region_code: "R1", order_open_at: "2026-06-02T00:00:00Z", order_cutoff_at: "2026-06-05T00:00:00Z", fulfillment_date: "2026-06-06T00:00:00Z" }
              as: PlatformAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /market-cycles/${cycle_id}/offerings"
              payload: { product_id: "${prod_id}", offered_qty: 100 }
              as: Farm
              as_user_id: "${farm_id}"
              captures: { off_id: $.data.id }
            - call: "POST /market-cycles/${cycle_id}/open"
              payload: {}
              as: PlatformAdmin
            - call: "POST /orders"
              payload: { market_cycle_id: "${cycle_id}", pickup_hub_id: "${hub_id}", fulfillment_type: "PICKUP" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /orders/${order_id}/lines"
              payload: { offering_id: "${off_id}", requested_qty: 2 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
          assert:
            - "OrderLine.${line_id}.estimated_line_cents == 800"
            - "OrderLine.${line_id}.snap_eligible == false and OrderLine.${line_id}.line_status == REQUESTED"

  - section: state_machines
    instances:
      - name: subscription_initial_state_active
        claim_type: Initial State
        grounds: [state_machines.Subscription.initial_state, entities.Subscription.fields.status]
        distinguishing_aspect: "A newly created subscription starts in status ACTIVE."
        test_recipe:
          setup: ["A hub and a customer."]
          setup_api_calls:
            - call: "POST /pickup-hubs"
              payload: { name: "Hub", hub_type: "PICKUP", slot_capacity: 100, region_code: "R1" }
              as: PlatformAdmin
              captures: { hub_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Ada", snap_balance_cents: 0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /customers/${cust_id}/subscriptions"
              payload: { pickup_hub_id: "${hub_id}", box_size: "SMALL", cadence: "WEEKLY", price_cap_cents: 1500 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id }
          assert:
            - "Subscription.${sub_id}.status == ACTIVE"

      - name: pause_already_paused_subscription_rejected
        claim_type: Idempotency
        grounds: [state_machines.Subscription.ACTIVE_to_PAUSED, 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "Pausing a subscription already in PAUSED returns ERR_INVALID_STATE (409); no state change."
        test_recipe:
          setup: ["A PAUSED subscription."]
          setup_api_calls:
            - call: "POST /pickup-hubs"
              payload: { name: "Hub", hub_type: "PICKUP", slot_capacity: 100, region_code: "R1" }
              as: PlatformAdmin
              captures: { hub_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Ada", snap_balance_cents: 0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/subscriptions"
              payload: { pickup_hub_id: "${hub_id}", box_size: "SMALL", cadence: "WEEKLY", price_cap_cents: 1500 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/pause"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /subscriptions/${sub_id}/pause"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (409)"
            - "Subscription.${sub_id}.status == PAUSED (unchanged)"

      - name: open_already_open_cycle_rejected
        claim_type: Invalid Transitions
        grounds: [state_machines.MarketCycle.SCHEDULED_to_OPEN, 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "Opening a cycle already in OPEN returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["An OPEN cycle."]
          setup_api_calls:
            - call: "POST /market-cycles"
              payload: { cycle_code: "C1", region_code: "R1", order_open_at: "2026-06-02T00:00:00Z", order_cutoff_at: "2026-06-05T00:00:00Z", fulfillment_date: "2026-06-06T00:00:00Z" }
              as: PlatformAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /market-cycles/${cycle_id}/open"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /market-cycles/${cycle_id}/open"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (409)"
            - "MarketCycle.${cycle_id}.status == OPEN (unchanged)"

      - name: pack_before_cutoff_order_not_allocated
        claim_type: guarded transitions
        grounds: ['validations[priority=7]', state_machines.OrderLine.ALLOCATED_to_PACKED, 'errors[ERR_ORDER_NOT_ALLOCATED]']
        distinguishing_aspect: "Packing a line whose parent order is still PLACED (cycle not cut off) trips the order-level guard first: ERR_ORDER_NOT_ALLOCATED (409), not the line-state error."
        test_recipe:
          setup: ["A PLACED order (checked out, cycle NOT cut off) with one egg line still REQUESTED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /farms"
              payload: { name: "Green Acres", region_code: "R1", commission_pct: 0.15, snap_authorized: true }
              as: PlatformAdmin
              captures: { farm_id: $.data.id }
            - call: "POST /pickup-hubs"
              payload: { name: "Hub", hub_type: "PICKUP", slot_capacity: 100, region_code: "R1" }
              as: PlatformAdmin
              captures: { hub_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Ada", snap_balance_cents: 0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /farms/${farm_id}/products"
              payload: { name: "Eggs", category: "DAIRY", pricing_mode: "FIXED", unit_price_cents: 400, snap_eligible: false }
              as: Farm
              as_user_id: "${farm_id}"
              captures: { prod_id: $.data.id }
            - call: "POST /market-cycles"
              payload: { cycle_code: "C1", region_code: "R1", order_open_at: "2026-06-02T00:00:00Z", order_cutoff_at: "2026-06-05T00:00:00Z", fulfillment_date: "2026-06-06T00:00:00Z" }
              as: PlatformAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /market-cycles/${cycle_id}/offerings"
              payload: { product_id: "${prod_id}", offered_qty: 100 }
              as: Farm
              as_user_id: "${farm_id}"
              captures: { off_id: $.data.id }
            - call: "POST /market-cycles/${cycle_id}/open"
              payload: {}
              as: PlatformAdmin
            - call: "POST /orders"
              payload: { market_cycle_id: "${cycle_id}", pickup_hub_id: "${hub_id}", fulfillment_type: "PICKUP" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { offering_id: "${off_id}", requested_qty: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
            - call: "POST /orders/${order_id}/checkout"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /order-lines/${line_id}/pack"
              payload: { fulfilled_qty: 1 }
              as: Farm
              as_user_id: "${farm_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ORDER_NOT_ALLOCATED (409)"
            - "OrderLine.${line_id}.line_status == REQUESTED (unchanged)"

  - section: calculations
    instances:
      - name: refund_to_wallet_for_non_eligible_short
        claim_type: Correct Result
        grounds: [calculations.refund_allocation, state_machines.OrderLine.ALLOCATED_to_SHORTED, entities.Customer.fields.wallet_credit_cents]
        distinguishing_aspect: "A fully shorted NON-snap-eligible flower line (est 500) routes its entire 500 credit to wallet (snap_eligible=false path): Customer.wallet_credit_cents==500, Order.refunded_wallet_cents==500, refunded_snap_cents==0."
        test_recipe:
          setup: ["Customer snap 0; OPEN cycle; flower offering (FIXED 500, non-snap); order with one flower line qty1, checked out, cycle cut off (line ALLOCATED)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /farms"
              payload: { name: "Green Acres", region_code: "R1", commission_pct: 0.15, snap_authorized: true }
              as: PlatformAdmin
              captures: { farm_id: $.data.id }
            - call: "POST /pickup-hubs"
              payload: { name: "Hub", hub_type: "PICKUP", slot_capacity: 100, region_code: "R1" }
              as: PlatformAdmin
              captures: { hub_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Ada", snap_balance_cents: 0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /farms/${farm_id}/products"
              payload: { name: "Cut Flowers", category: "OTHER", pricing_mode: "FIXED", unit_price_cents: 500, snap_eligible: false }
              as: Farm
              as_user_id: "${farm_id}"
              captures: { prod_id: $.data.id }
            - call: "POST /market-cycles"
              payload: { cycle_code: "C1", region_code: "R1", order_open_at: "2026-06-02T00:00:00Z", order_cutoff_at: "2026-06-05T00:00:00Z", fulfillment_date: "2026-06-06T00:00:00Z" }
              as: PlatformAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /market-cycles/${cycle_id}/offerings"
              payload: { product_id: "${prod_id}", offered_qty: 50 }
              as: Farm
              as_user_id: "${farm_id}"
              captures: { off_id: $.data.id }
            - call: "POST /market-cycles/${cycle_id}/open"
              payload: {}
              as: PlatformAdmin
            - call: "POST /orders"
              payload: { market_cycle_id: "${cycle_id}", pickup_hub_id: "${hub_id}", fulfillment_type: "PICKUP" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { offering_id: "${off_id}", requested_qty: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
            - call: "POST /orders/${order_id}/checkout"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /market-cycles/${cycle_id}/cutoff"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /order-lines/${line_id}/pack"
              payload: { fulfilled_qty: 0 }
              as: Farm
              as_user_id: "${farm_id}"
          assert:
            - "OrderLine.${line_id}.line_status == SHORTED and OrderLine.${line_id}.final_line_cents == 0"
            - "Customer.${cust_id}.wallet_credit_cents == 500 and Customer.${cust_id}.snap_balance_cents == 0"
            - "Order.${order_id}.refunded_wallet_cents == 500 and Order.${order_id}.refunded_snap_cents == 0"

  - section: validations
    instances:
      - name: checkout_empty_order_rejected
        claim_type: Violation -> Error
        grounds: ['validations[priority=9]', 'errors[ERR_EMPTY_ORDER]']
        distinguishing_aspect: "Checkout of an order with zero lines returns ERR_EMPTY_ORDER (409)."
        test_recipe:
          setup: ["An OPEN cycle and a CART order with no lines."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pickup-hubs"
              payload: { name: "Hub", hub_type: "PICKUP", slot_capacity: 100, region_code: "R1" }
              as: PlatformAdmin
              captures: { hub_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Ada", snap_balance_cents: 0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /market-cycles"
              payload: { cycle_code: "C1", region_code: "R1", order_open_at: "2026-06-02T00:00:00Z", order_cutoff_at: "2026-06-05T00:00:00Z", fulfillment_date: "2026-06-06T00:00:00Z" }
              as: PlatformAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /market-cycles/${cycle_id}/open"
              payload: {}
              as: PlatformAdmin
            - call: "POST /orders"
              payload: { market_cycle_id: "${cycle_id}", pickup_hub_id: "${hub_id}", fulfillment_type: "PICKUP" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /orders/${order_id}/checkout"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_EMPTY_ORDER (409)"
            - "Order.${order_id}.order_status == CART (unchanged)"

      - name: over_pack_more_than_allocated_rejected
        claim_type: Violation -> Error
        grounds: ['validations[priority=13]', 'errors[ERR_OVER_PACK]']
        distinguishing_aspect: "Packing fulfilled_qty 3 against allocated_qty 2 returns ERR_OVER_PACK (409)."
        test_recipe:
          setup: ["ALLOCATED egg line with allocated_qty 2 (order checked out and cycle cut off)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /farms"
              payload: { name: "Green Acres", region_code: "R1", commission_pct: 0.15, snap_authorized: true }
              as: PlatformAdmin
              captures: { farm_id: $.data.id }
            - call: "POST /pickup-hubs"
              payload: { name: "Hub", hub_type: "PICKUP", slot_capacity: 100, region_code: "R1" }
              as: PlatformAdmin
              captures: { hub_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Ada", snap_balance_cents: 0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /farms/${farm_id}/products"
              payload: { name: "Eggs", category: "DAIRY", pricing_mode: "FIXED", unit_price_cents: 400, snap_eligible: false }
              as: Farm
              as_user_id: "${farm_id}"
              captures: { prod_id: $.data.id }
            - call: "POST /market-cycles"
              payload: { cycle_code: "C1", region_code: "R1", order_open_at: "2026-06-02T00:00:00Z", order_cutoff_at: "2026-06-05T00:00:00Z", fulfillment_date: "2026-06-06T00:00:00Z" }
              as: PlatformAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /market-cycles/${cycle_id}/offerings"
              payload: { product_id: "${prod_id}", offered_qty: 100 }
              as: Farm
              as_user_id: "${farm_id}"
              captures: { off_id: $.data.id }
            - call: "POST /market-cycles/${cycle_id}/open"
              payload: {}
              as: PlatformAdmin
            - call: "POST /orders"
              payload: { market_cycle_id: "${cycle_id}", pickup_hub_id: "${hub_id}", fulfillment_type: "PICKUP" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { offering_id: "${off_id}", requested_qty: 2 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
            - call: "POST /orders/${order_id}/checkout"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /market-cycles/${cycle_id}/cutoff"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /order-lines/${line_id}/pack"
              payload: { fulfilled_qty: 3 }
              as: Farm
              as_user_id: "${farm_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_OVER_PACK (409)"
            - "OrderLine.${line_id}.line_status == ALLOCATED (unchanged)"

      - name: pack_weight_line_missing_weight_invalid
        claim_type: Violation -> Error
        grounds: ['validations[priority=13]', 'errors[ERR_INVALID_WEIGHT]']
        distinguishing_aspect: "Packing a WEIGHT tomato line with fulfilled_qty 3 but no actual_weight_kg returns ERR_INVALID_WEIGHT (422)."
        test_recipe:
          setup: ["ALLOCATED WEIGHT tomato line (order checked out, cycle cut off)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /farms"
              payload: { name: "Green Acres", region_code: "R1", commission_pct: 0.15, snap_authorized: true }
              as: PlatformAdmin
              captures: { farm_id: $.data.id }
            - call: "POST /pickup-hubs"
              payload: { name: "Hub", hub_type: "PICKUP", slot_capacity: 100, region_code: "R1" }
              as: PlatformAdmin
              captures: { hub_id: $.data.id }
