      - name: wash_batch_second_running_same_washer_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.WashBatch.SCHEDULED_to_RUNNING, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "At most one RUNNING batch per washer: starting batch2 (10:30-11:30, purge-clean) while batch1 (09:00-10:00) is RUNNING is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Plant; batch1 on WASHER_A 09:00-10:00 started (RUNNING); batch2 on WASHER_A 10:30-11:30 SCHEDULED"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant SM23" }, as: PlantAdmin, captures: { plant: $.data.id } }
