              payload: {state_code: "CA", factor_formula: "DOUBLE_WEIGHTED_SALES", tax_rate: 0.0884, throwback_rule: "THROWBACK", service_sourcing_rule: "MARKET_BASED", prior_year_tax: 40000}
              as: TaxManager
              captures: {reg_ca_id: $.data.id}
            - call: "GET /salt/registrations/${reg_ca_id}"
              payload: {}
              as: Controller
              captures: {reg_v1: $.data.version}
            - call: "POST /salt/registrations/${reg_ca_id}/payments"
              payload: {tax_year: 2026, installment_number: 1, amount: 8000.00, paid_on_date: "2026-04-15T00:00:00Z", expected_registration_version: "${reg_v1}"}
              as: Controller
            - call: "GET /salt/registrations/${reg_ca_id}"
              payload: {}
              as: Controller
              captures: {reg_v2: $.data.version}
          trigger:
            - call: "POST /salt/registrations/${reg_ca_id}/payments"
              payload: {tax_year: 2026, installment_number: 1, amount: 3000.00, paid_on_date: "2026-04-20T00:00:00Z", expected_registration_version: "${reg_v2}"}
              as: Controller
              captures: {err_id: $.data.error_id}
          assert:
            - "the response is HTTP 409 with data.error_id == ERR_DUPLICATE_INSTALLMENT"
            - "StateRegistration.${reg_ca_id}.total_payments_received == 8000.00 and unapplied_payment_balance == 8000.00"
            - "GET /salt/payments with registration_id filter returns exactly one row"

      - name: vda_lookback_over_maximum_returns_exposure_mismatch
        claim_type: violation_to_error
        grounds:
          - validations[priority=41]
          - errors[ERR_VDA_EXPOSURE_MISMATCH]
