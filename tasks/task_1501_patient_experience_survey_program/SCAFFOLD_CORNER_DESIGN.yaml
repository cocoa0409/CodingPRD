# =============================================================================
# §1.9 Scaffold Corner Design — Patient Experience Survey Program (HCAHPS)
# Breadth coverage of testable claims NOT already covered by §1.8.
# Sections/claim_types follow references/claim-extraction-guide.md.
# Negative-path triggers capture $.data.error_id (error envelope, §1.0).
# =============================================================================
scaffold_corner_design:
  # ============================================================ entities ====
  - section: entities
    instances:
      - name: program_creation_defaults
        claim_type: creation
        grounds:
          - entities.SurveyProgram
        distinguishing_aspect: "Successful POST returns 201 with system fields: version == 1, active_vendor_id == null, id/created_at/updated_at server-minted."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/survey-programs", payload: { name: "P-E1", sampling_protocol: "STRATIFIED_BY_UNIT", admin_mode: "MIXED_MODE" }, as: ProgramAdmin, captures: { pg: "$.data.id", pg_v: "$.data.version" } }
          assert:
            - "201; SurveyProgram.${pg}.version == 1 and active_vendor_id == null"
            - "sampling_protocol == STRATIFIED_BY_UNIT echoed; created_at == 2026-08-01T00:00:00Z (logical clock default)"

      - name: discharge_defaults_pending
        claim_type: defaults
        grounds:
          - entities.Discharge.fields.status
          - entities.Discharge.fields.exclusion_reasons
        distinguishing_aspect: "A created discharge starts ELIGIBILITY_PENDING with empty exclusion_reasons until evaluate runs."
        test_recipe:
          setup: ["program + unit + provider exist"]
          setup_api_calls:
            - { call: "POST /api/survey-programs", payload: { name: "P-E2", sampling_protocol: "CENSUS", admin_mode: "MAIL_ONLY" }, as: ProgramAdmin, captures: { pg: "$.data.id" } }
            - { call: "POST /api/units", payload: { program_id: "${pg}", name: "Unit 1", unit_code: "U1" }, as: ProgramAdmin, captures: { un: "$.data.id" } }
            - { call: "POST /api/providers", payload: { program_id: "${pg}", full_name: "Dr A", npi: "NPI1", specialty: "IM" }, as: ProgramAdmin, captures: { pr: "$.data.id" } }
          trigger:
            - { call: "POST /api/discharges", payload: { program_id: "${pg}", mrn: "M-001", unit_id: "${un}", provider_id: "${pr}", admit_date: "2026-06-01", discharge_date: "2026-06-03", discharge_disposition: "HOME", primary_dx_group: "MEDICAL", payer: "MEDICARE", age_years: 65, address_country: "US", no_publicity_flag: false, custody_status: "NONE" }, as: DataSteward, captures: { d: "$.data.id" } }
          assert:
            - "Discharge.${d}.status == ELIGIBILITY_PENDING and exclusion_reasons == []"

      - name: discharge_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - "errors[ERR_NOT_FOUND]"
          - "endpoints[GET /api/discharges/{dischargeId}]"
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID yields 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/discharges/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: Any, captures: { err: "$.data.error_id" } }
          assert:
            - "404 with error_id == ERR_NOT_FOUND"

      - name: unit_code_unique_per_program
        claim_type: type_constraints
        grounds:
          - "errors[ERR_DUPLICATE_UNIT_CODE]"
          - "validations[priority=8]"
        distinguishing_aspect: "Duplicate unit_code within the same program is rejected; the same code in a different program is accepted (tenant-scoped uniqueness)."
        test_recipe:
          setup: ["programs P1, P2; unit U1 in P1 with unit_code UU"]
          setup_api_calls:
            - { call: "POST /api/survey-programs", payload: { name: "P-E3A", sampling_protocol: "CENSUS", admin_mode: "MAIL_ONLY" }, as: ProgramAdmin, captures: { pg1: "$.data.id" } }
            - { call: "POST /api/survey-programs", payload: { name: "P-E3B", sampling_protocol: "CENSUS", admin_mode: "MAIL_ONLY" }, as: ProgramAdmin, captures: { pg2: "$.data.id" } }
            - { call: "POST /api/units", payload: { program_id: "${pg1}", name: "Alpha", unit_code: "UU" }, as: ProgramAdmin, captures: { u1: "$.data.id" } }
          trigger:
            - { call: "POST /api/units", payload: { program_id: "${pg1}", name: "Beta", unit_code: "UU" }, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
            - { call: "POST /api/units", payload: { program_id: "${pg2}", name: "Gamma", unit_code: "UU" }, as: ProgramAdmin, captures: { u3: "$.data.id" } }
          assert:
            - "same-program duplicate -> 409 ERR_DUPLICATE_UNIT_CODE"
            - "cross-program same code -> 201 (unit ${u3} created)"

      - name: provider_npi_unique_per_program
        claim_type: type_constraints
        grounds:
          - "errors[ERR_DUPLICATE_NPI]"
          - "validations[priority=8]"
        distinguishing_aspect: "Duplicate npi within one program is rejected with ERR_DUPLICATE_NPI."
        test_recipe:
          setup: ["program with provider NPI1"]
          setup_api_calls:
            - { call: "POST /api/survey-programs", payload: { name: "P-E4", sampling_protocol: "CENSUS", admin_mode: "MAIL_ONLY" }, as: ProgramAdmin, captures: { pg: "$.data.id" } }
            - { call: "POST /api/providers", payload: { program_id: "${pg}", full_name: "Dr A", npi: "NPI1", specialty: "IM" }, as: ProgramAdmin, captures: { p1: "$.data.id" } }
          trigger:
            - { call: "POST /api/providers", payload: { program_id: "${pg}", full_name: "Dr B", npi: "NPI1", specialty: "CARD" }, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "409 ERR_DUPLICATE_NPI; only one provider with npi NPI1 exists"

      - name: discharge_rejects_extra_payload_fields
        claim_type: computed_fields
        grounds:
          - "validations[priority=3.5]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Client-supplied computed/system fields (status, exclusion_reasons) are rejected as unknown fields with 400 ERR_INVALID_REQUEST — computed fields cannot be smuggled in."
        test_recipe:
          setup: ["program + unit + provider exist"]
          setup_api_calls:
            - { call: "POST /api/survey-programs", payload: { name: "P-E5", sampling_protocol: "CENSUS", admin_mode: "MAIL_ONLY" }, as: ProgramAdmin, captures: { pg: "$.data.id" } }
            - { call: "POST /api/units", payload: { program_id: "${pg}", name: "Unit 1", unit_code: "U1" }, as: ProgramAdmin, captures: { un: "$.data.id" } }
            - { call: "POST /api/providers", payload: { program_id: "${pg}", full_name: "Dr A", npi: "NPI1", specialty: "IM" }, as: ProgramAdmin, captures: { pr: "$.data.id" } }
          trigger:
            - { call: "POST /api/discharges", payload: { program_id: "${pg}", mrn: "M-001", unit_id: "${un}", provider_id: "${pr}", admit_date: "2026-06-01", discharge_date: "2026-06-03", discharge_disposition: "HOME", primary_dx_group: "MEDICAL", payer: "MEDICARE", age_years: 65, address_country: "US", no_publicity_flag: false, custody_status: "NONE", status: "ELIGIBLE" }, as: DataSteward, captures: { err: "$.data.error_id" } }
          assert:
            - "400 ERR_INVALID_REQUEST (unknown field status)"

  # ====================================================== state_machines ====
  - section: state_machines
    instances:
      - name: cycle_initial_state_draft
        claim_type: initial_state
        grounds:
          - state_machines.SurveyCycle
        distinguishing_aspect: "A newly created cycle starts in DRAFT with zeroed derived counters (sampled_count 0, completed_responses 0, response_rate null)."
        test_recipe:
          setup: ["program exists"]
          setup_api_calls:
            - { call: "POST /api/survey-programs", payload: { name: "P-SM1", sampling_protocol: "CENSUS", admin_mode: "MAIL_ONLY" }, as: ProgramAdmin, captures: { pg: "$.data.id" } }
          trigger:
            - { call: "POST /api/cycles", payload: { program_id: "${pg}", label: "Q1", cycle_index: 1, discharge_window_start: "2026-06-01", discharge_window_end: "2026-06-30", fielding_start_date: "2026-08-03", fielding_end_date: "2026-08-31", target_sample_size: 100 }, as: ProgramAdmin, captures: { cy: "$.data.id" } }
          assert:
            - "SurveyCycle.${cy}.status == DRAFT, sampled_count == 0, completed_responses == 0, eligible_denominator == 0, response_rate == null, publication_eligible == false"

      - name: cycle_terminal_lockdown
        claim_type: terminal_lockdown
        grounds:
          - state_machines.SurveyCycle
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "PUBLISHED and VOIDED are terminal: void on a PUBLISHED cycle and open-sampling on a VOIDED cycle both fail with 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["cycle C1 PUBLISHED (25 all-4 MAIL responses); cycle C2 VOIDED from DRAFT"]
          setup_api_calls:
            - { call: "POST /api/survey-programs", payload: { name: "P-SM2", sampling_protocol: "CENSUS", admin_mode: "MAIL_ONLY" }, as: ProgramAdmin, captures: { pg: "$.data.id", pg_v: "$.data.version" } }
            - { call: "POST /api/vendors", payload: { program_id: "${pg}", name: "V1", cycle_budget_cents: 100000, expected_program_version: "${pg_v}" }, as: ProgramAdmin, captures: { vn: "$.data.id" } }
            - { call: "POST /api/units", payload: { program_id: "${pg}", name: "Unit 1", unit_code: "U1" }, as: ProgramAdmin, captures: { un: "$.data.id" } }
            - { call: "POST /api/providers", payload: { program_id: "${pg}", full_name: "Dr A", npi: "NPI1", specialty: "IM" }, as: ProgramAdmin, captures: { pr: "$.data.id" } }
            - { call: "POST /api/cycles", payload: { program_id: "${pg}", label: "Q1", cycle_index: 1, discharge_window_start: "2026-06-01", discharge_window_end: "2026-06-30", fielding_start_date: "2026-08-03", fielding_end_date: "2026-08-31", target_sample_size: 100 }, as: ProgramAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /api/cycles/${c1}/open-sampling", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/discharges/import", payload: { program_id: "${pg}", count: 25, template: { mrn_prefix: "M", unit_id: "${un}", provider_id: "${pr}", admit_date: "2026-06-01", discharge_date: "2026-06-03", discharge_disposition: "HOME", primary_dx_group: "MEDICAL", payer: "MEDICARE", age_years: 65, address_country: "US", no_publicity_flag: false, custody_status: "NONE" } }, as: DataSteward, captures: { d_ids: "$.data.discharge_ids" } }
            - { call: "POST /api/sample-cases/import", payload: { cycle_id: "${c1}", discharge_ids: "${d_ids}", mode_assigned: "MAIL", postage_cost_cents: 100 }, as: DataSteward, captures: { k_ids: "$.data.sample_case_ids" } }
            - { call: "POST /api/cycles/${c1}/start-fielding", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/responses/import", payload: { case_ids: "${k_ids}", mode_used: "MAIL", nurse_comm_score: 4, doctor_comm_score: 4, cleanliness_score: 4, overall_rating_score: 4 }, as: VendorOperator, as_user_id: "${vn}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /api/cycles/${c1}/close-fielding", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/cycles/${c1}/begin-scoring", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/cycles/${c1}/publish", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/cycles", payload: { program_id: "${pg}", label: "Q2", cycle_index: 2, discharge_window_start: "2026-07-01", discharge_window_end: "2026-07-31", fielding_start_date: "2026-09-01", fielding_end_date: "2026-09-30", target_sample_size: 100 }, as: ProgramAdmin, captures: { c2: "$.data.id" } }
            - { call: "POST /api/cycles/${c2}/void", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "POST /api/cycles/${c1}/void", payload: {}, as: ProgramAdmin, captures: { err1: "$.data.error_id" } }
            - { call: "POST /api/cycles/${c2}/open-sampling", payload: {}, as: ProgramAdmin, captures: { err2: "$.data.error_id" } }
          assert:
            - "void on PUBLISHED -> 409 ERR_INVALID_STATE"
            - "open-sampling on VOIDED -> 409 ERR_INVALID_STATE"
            - "SurveyCycle.${c1}.status remains PUBLISHED; SurveyCycle.${c2}.status remains VOIDED"

      - name: ticket_double_acknowledge_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.ServiceRecoveryTicket.OPEN_to_ACKNOWLEDGED
          - "errors[ERR_TICKET_NOT_ACKNOWLEDGEABLE]"
        distinguishing_aspect: "acknowledge is single-shot: the second acknowledge on an ACKNOWLEDGED ticket fails with 409 ERR_TICKET_NOT_ACKNOWLEDGEABLE."
        test_recipe:
          setup: ["cycle FIELDING; case RESPONDED with commented response; ticket OPEN on the unit"]
          setup_api_calls:
            - { call: "POST /api/survey-programs", payload: { name: "P-SM3", sampling_protocol: "CENSUS", admin_mode: "MAIL_ONLY" }, as: ProgramAdmin, captures: { pg: "$.data.id", pg_v: "$.data.version" } }
            - { call: "POST /api/vendors", payload: { program_id: "${pg}", name: "V1", cycle_budget_cents: 100000, expected_program_version: "${pg_v}" }, as: ProgramAdmin, captures: { vn: "$.data.id" } }
            - { call: "POST /api/units", payload: { program_id: "${pg}", name: "Unit 1", unit_code: "U1" }, as: ProgramAdmin, captures: { un: "$.data.id" } }
            - { call: "POST /api/providers", payload: { program_id: "${pg}", full_name: "Dr A", npi: "NPI1", specialty: "IM" }, as: ProgramAdmin, captures: { pr: "$.data.id" } }
            - { call: "POST /api/cycles", payload: { program_id: "${pg}", label: "Q1", cycle_index: 1, discharge_window_start: "2026-06-01", discharge_window_end: "2026-06-30", fielding_start_date: "2026-08-03", fielding_end_date: "2026-08-31", target_sample_size: 100 }, as: ProgramAdmin, captures: { cy: "$.data.id" } }
            - { call: "POST /api/cycles/${cy}/open-sampling", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/discharges/import", payload: { program_id: "${pg}", count: 1, template: { mrn_prefix: "M", unit_id: "${un}", provider_id: "${pr}", admit_date: "2026-06-01", discharge_date: "2026-06-03", discharge_disposition: "HOME", primary_dx_group: "MEDICAL", payer: "MEDICARE", age_years: 65, address_country: "US", no_publicity_flag: false, custody_status: "NONE" } }, as: DataSteward, captures: { d_ids: "$.data.discharge_ids" } }
            - { call: "POST /api/sample-cases/import", payload: { cycle_id: "${cy}", discharge_ids: "${d_ids}", mode_assigned: "MAIL", postage_cost_cents: 100 }, as: DataSteward, captures: { c_ids: "$.data.sample_case_ids" } }
            - { call: "POST /api/cycles/${cy}/start-fielding", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/responses", payload: { case_id: "${c_ids[0]}", mode_used: "MAIL", nurse_comm_score: 3, doctor_comm_score: 3, cleanliness_score: 2, overall_rating_score: 3, comment_text: "Room was noisy" }, as: VendorOperator, as_user_id: "${vn}", captures: { rsp: "$.data.id" } }
            - { call: "POST /api/service-recovery-tickets", payload: { unit_id: "${un}", response_id: "${rsp}", domain: "CLEANLINESS", priority: "MEDIUM" }, as: UnitManager, as_user_id: "${un}", captures: { tkt: "$.data.id" } }
            - { call: "POST /api/service-recovery-tickets/${tkt}/acknowledge", payload: {}, as: UnitManager, as_user_id: "${un}" }
          trigger:
            - { call: "POST /api/service-recovery-tickets/${tkt}/acknowledge", payload: {}, as: UnitManager, as_user_id: "${un}", captures: { err: "$.data.error_id" } }
          assert:
            - "second acknowledge -> 409 ERR_TICKET_NOT_ACKNOWLEDGEABLE; ticket remains ACKNOWLEDGED"

      - name: adjudicated_response_is_terminal
        claim_type: terminal_lockdown
        grounds:
          - state_machines.SurveyResponse.PENDING_REVIEW_to_INCLUDED
          - "errors[ERR_RESPONSE_NOT_PENDING_REVIEW]"
        distinguishing_aspect: "Once adjudicated INCLUDED, a response cannot be adjudicated again (second adjudicate -> 409 ERR_RESPONSE_NOT_PENDING_REVIEW)."
        test_recipe:
          setup: ["cycle RECONCILIATION with one late response already adjudicated INCLUDED"]
          setup_api_calls:
            - { call: "POST /api/survey-programs", payload: { name: "P-SM4", sampling_protocol: "CENSUS", admin_mode: "MAIL_ONLY" }, as: ProgramAdmin, captures: { pg: "$.data.id", pg_v: "$.data.version" } }
            - { call: "POST /api/vendors", payload: { program_id: "${pg}", name: "V1", cycle_budget_cents: 100000, expected_program_version: "${pg_v}" }, as: ProgramAdmin, captures: { vn: "$.data.id" } }
            - { call: "POST /api/units", payload: { program_id: "${pg}", name: "Unit 1", unit_code: "U1" }, as: ProgramAdmin, captures: { un: "$.data.id" } }
            - { call: "POST /api/providers", payload: { program_id: "${pg}", full_name: "Dr A", npi: "NPI1", specialty: "IM" }, as: ProgramAdmin, captures: { pr: "$.data.id" } }
            - { call: "POST /api/cycles", payload: { program_id: "${pg}", label: "Q1", cycle_index: 1, discharge_window_start: "2026-06-01", discharge_window_end: "2026-06-30", fielding_start_date: "2026-08-03", fielding_end_date: "2026-08-31", target_sample_size: 100 }, as: ProgramAdmin, captures: { cy: "$.data.id" } }
            - { call: "POST /api/cycles/${cy}/open-sampling", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/discharges/import", payload: { program_id: "${pg}", count: 1, template: { mrn_prefix: "M", unit_id: "${un}", provider_id: "${pr}", admit_date: "2026-06-01", discharge_date: "2026-06-03", discharge_disposition: "HOME", primary_dx_group: "MEDICAL", payer: "MEDICARE", age_years: 65, address_country: "US", no_publicity_flag: false, custody_status: "NONE" } }, as: DataSteward, captures: { d_ids: "$.data.discharge_ids" } }
            - { call: "POST /api/sample-cases/import", payload: { cycle_id: "${cy}", discharge_ids: "${d_ids}", mode_assigned: "MAIL", postage_cost_cents: 100 }, as: DataSteward, captures: { c_ids: "$.data.sample_case_ids" } }
            - { call: "POST /api/cycles/${cy}/start-fielding", payload: {}, as: ProgramAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /api/responses", payload: { case_id: "${c_ids[0]}", mode_used: "MAIL", nurse_comm_score: 4, doctor_comm_score: 4, cleanliness_score: 4, overall_rating_score: 4 }, as: VendorOperator, as_user_id: "${vn}", captures: { rsp: "$.data.id" } }
            - { call: "POST /api/cycles/${cy}/close-fielding", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/responses/${rsp}/adjudicate", payload: { decision: "INCLUDE" }, as: DataSteward }
          trigger:
            - { call: "POST /api/responses/${rsp}/adjudicate", payload: { decision: "EXCLUDE" }, as: DataSteward, captures: { err: "$.data.error_id" } }
          assert:
            - "second adjudicate -> 409 ERR_RESPONSE_NOT_PENDING_REVIEW; response stays INCLUDED"
            - "cycle completed_responses == 1 (unchanged by the rejected call)"

      - name: vendor_supersede_side_effects
        claim_type: side_effect_execution
        grounds:
          - state_machines.SurveyVendor.ACTIVE_to_SUPERSEDED
          - "concurrency_rules[vendor-create-stale-program]"
        distinguishing_aspect: "Creating a second vendor supersedes the first: old vendor SUPERSEDED with superseded_at set, program.active_vendor_id repointed, SurveyProgram.version incremented by 1."
        test_recipe:
          setup: ["program P with vendor V1 ACTIVE (program version advanced to 2 by V1 creation)"]
          setup_api_calls:
            - { call: "POST /api/survey-programs", payload: { name: "P-SM5", sampling_protocol: "CENSUS", admin_mode: "MAIL_ONLY" }, as: ProgramAdmin, captures: { pg: "$.data.id", pg_v: "$.data.version" } }
            - { call: "POST /api/vendors", payload: { program_id: "${pg}", name: "V1", cycle_budget_cents: 50000, expected_program_version: "${pg_v}" }, as: ProgramAdmin, captures: { v1: "$.data.id" } }
            - { call: "GET /api/survey-programs/${pg}", payload: {}, as: Any, captures: { pg_v2: "$.data.version" } }
          trigger:
            - { call: "POST /api/vendors", payload: { program_id: "${pg}", name: "V2", cycle_budget_cents: 75000, expected_program_version: "${pg_v2}" }, as: ProgramAdmin, captures: { v2: "$.data.id" } }
            - { call: "GET /api/vendors/${v1}", payload: {}, as: Any, captures: { v1_st: "$.data.status" } }
            - { call: "GET /api/survey-programs/${pg}", payload: {}, as: Any, captures: { av: "$.data.active_vendor_id", pg_v3: "$.data.version" } }
          assert:
            - "SurveyVendor.${v1}.status == SUPERSEDED and superseded_at == 2026-08-01T00:00:00Z (logical clock default)"
            - "program.active_vendor_id == ${v2} and program.version == 3 (1 at create, +1 per vendor creation)"

      - name: initiative_met_branch_side_effects
        claim_type: side_effect_execution
        grounds:
          - state_machines.ImprovementInitiative.UNDER_EVALUATION_to_TARGET_MET
        distinguishing_aspect: "The TARGET_MET branch (unit adjusted 88.00 >= target 85.00) sets achieved_at and does NOT escalate tickets — the OPEN ticket on the same unit+domain stays OPEN (divergent side effects vs TARGET_MISSED)."
        test_recipe:
          setup:
            - "Cycle idx1 PUBLISHED (unit cleanliness adjusted 80.00); initiative (U1, CLEANLINESS, baseline idx1, evaluation idx2, target 85.00) ACTIVE"
            - "Cycle idx2 FIELDING with 22 all-4 + 3 all-3 MAIL responses (cleanliness adjusted will be 88.00); OPEN ticket on (U1, CLEANLINESS) routing a commented response"
          setup_api_calls:
            - { call: "POST /api/survey-programs", payload: { name: "P-SM6", sampling_protocol: "CENSUS", admin_mode: "MAIL_ONLY" }, as: ProgramAdmin, captures: { pg: "$.data.id", pg_v: "$.data.version" } }
            - { call: "POST /api/vendors", payload: { program_id: "${pg}", name: "V1", cycle_budget_cents: 100000, expected_program_version: "${pg_v}" }, as: ProgramAdmin, captures: { vn: "$.data.id" } }
            - { call: "POST /api/units", payload: { program_id: "${pg}", name: "Unit 1", unit_code: "U1" }, as: ProgramAdmin, captures: { un: "$.data.id" } }
            - { call: "POST /api/providers", payload: { program_id: "${pg}", full_name: "Dr A", npi: "NPI1", specialty: "IM" }, as: ProgramAdmin, captures: { pr: "$.data.id" } }
            - { call: "POST /api/cycles", payload: { program_id: "${pg}", label: "Q1", cycle_index: 1, discharge_window_start: "2026-06-01", discharge_window_end: "2026-06-30", fielding_start_date: "2026-08-03", fielding_end_date: "2026-08-31", target_sample_size: 100 }, as: ProgramAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /api/cycles/${c1}/open-sampling", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/discharges/import", payload: { program_id: "${pg}", count: 20, template: { mrn_prefix: "A", unit_id: "${un}", provider_id: "${pr}", admit_date: "2026-06-01", discharge_date: "2026-06-03", discharge_disposition: "HOME", primary_dx_group: "MEDICAL", payer: "MEDICARE", age_years: 65, address_country: "US", no_publicity_flag: false, custody_status: "NONE" } }, as: DataSteward, captures: { d1a: "$.data.discharge_ids" } }
            - { call: "POST /api/discharges/import", payload: { program_id: "${pg}", count: 5, template: { mrn_prefix: "B", unit_id: "${un}", provider_id: "${pr}", admit_date: "2026-06-01", discharge_date: "2026-06-03", discharge_disposition: "HOME", primary_dx_group: "MEDICAL", payer: "MEDICARE", age_years: 65, address_country: "US", no_publicity_flag: false, custody_status: "NONE" } }, as: DataSteward, captures: { d1b: "$.data.discharge_ids" } }
