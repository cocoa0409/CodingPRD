          trigger:
            - call: "POST /subrogation-cases/${sub}/send-demand"
              payload: {}
              as: SubrogationSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: rental_approve_requires_verified_coverage_and_rental_coverage
        grounds:
          - state_machines.RentalReimbursement.PENDING_to_APPROVED
          - entities.CoverageVerification.fields.outcome
          - entities.Coverage.fields.coverage_type
        distinguishing_aspect: |
          Entity pair (RentalReimbursement, CoverageVerification/Coverage): approving a rental
          requires the parent Claim to carry a VERIFIED CoverageVerification AND the policy to have
          a RENTAL Coverage. With a RENTAL coverage and verified claim the approve succeeds.
          Distinct entity pair from (SubrogationCase, Claim).
        test_recipe:
          setup:
            - "A verified claim whose policy has both COLLISION and RENTAL coverages; a PENDING rental reimbursement with reimbursement_cents > 0."
          setup_api_calls:
            - call: "POST /policies"
              payload: { policyholder_name: "Rent Co", policy_number: "POL-RENT-1", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2026-12-31T00:00:00.000Z", comparative_fault_rule: "PURE" }
              as: ClaimsSupervisor
              captures: { pol: $.data.id }
            - call: "POST /policies/${pol}/coverages"
              payload: { coverage_type: "COLLISION", limit_cents: 1000000, deductible_cents: 50000 }
              as: ClaimsSupervisor
            - call: "POST /policies/${pol}/coverages"
              payload: { coverage_type: "RENTAL", limit_cents: 100000, rental_daily_cap_cents: 5000, rental_max_days: 10 }
              as: ClaimsSupervisor
            - call: "POST /adjusters"
              payload: { full_name: "Adj One", license_tier: "STANDARD" }
              as: ClaimsSupervisor
              captures: { adj1: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${pol}", loss_datetime: "2026-06-01T00:00:00.000Z", loss_type: "COLLISION", vehicle_acv_cents: 800000 }
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { claim: $.data.id }
            - call: "POST /claims/${claim}/verify-coverage"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
            - call: "POST /rental-reimbursements"
              payload: { claim_id: "${claim}", rental_start_date: "2026-06-01T00:00:00.000Z", rental_end_date: "2026-06-08T00:00:00.000Z", daily_rate_cents: 6000 }
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { rr: $.data.id, reimb: $.data.reimbursement_cents }
          trigger:
            - call: "POST /rental-reimbursements/${rr}/approve"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { st: $.data.status }
          assert:
            - "RentalReimbursement.${rr}.reimbursement_cents == 35000"
            - "RentalReimbursement.${rr}.status == APPROVED"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: rental_period_overlap_half_open_adjacency_allowed
        grounds:
          - validations[priority=17]
          - entities.RentalReimbursement.fields.rental_start_date
          - entities.RentalReimbursement.fields.rental_end_date
        distinguishing_aspect: |
          Half-open [start, end) interval semantics on RentalReimbursement: a second rental
          [2026-06-05, 2026-06-10) overlaps an existing [2026-06-01, 2026-06-08) on the same claim
          -> ERR_RENTAL_PERIOD_OVERLAP. Adjacency (end==start) would be allowed; this case truly
          overlaps. Resource entity = RentalReimbursement.
        test_recipe:
          setup:
            - "A verified claim with a RENTAL coverage and an existing PENDING rental [2026-06-01, 2026-06-08)."
          setup_api_calls:
            - call: "POST /policies"
              payload: { policyholder_name: "Ovl Co", policy_number: "POL-OVL-1", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2026-12-31T00:00:00.000Z", comparative_fault_rule: "PURE" }
              as: ClaimsSupervisor
              captures: { pol: $.data.id }
            - call: "POST /policies/${pol}/coverages"
              payload: { coverage_type: "COLLISION", limit_cents: 1000000, deductible_cents: 50000 }
              as: ClaimsSupervisor
            - call: "POST /policies/${pol}/coverages"
              payload: { coverage_type: "RENTAL", limit_cents: 100000, rental_daily_cap_cents: 5000, rental_max_days: 30 }
              as: ClaimsSupervisor
            - call: "POST /adjusters"
              payload: { full_name: "Adj One", license_tier: "STANDARD" }
              as: ClaimsSupervisor
              captures: { adj1: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${pol}", loss_datetime: "2026-06-01T00:00:00.000Z", loss_type: "COLLISION", vehicle_acv_cents: 800000 }
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { claim: $.data.id }
            - call: "POST /claims/${claim}/verify-coverage"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
            - call: "POST /rental-reimbursements"
              payload: { claim_id: "${claim}", rental_start_date: "2026-06-01T00:00:00.000Z", rental_end_date: "2026-06-08T00:00:00.000Z", daily_rate_cents: 6000 }
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { rr1: $.data.id }
          trigger:
            - call: "POST /rental-reimbursements"
              payload: { claim_id: "${claim}", rental_start_date: "2026-06-05T00:00:00.000Z", rental_end_date: "2026-06-10T00:00:00.000Z", daily_rate_cents: 6000 }
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_RENTAL_PERIOD_OVERLAP"

      - name: policy_period_overlap_closed_adjacency_rejected
        grounds:
          - validations[priority=18]
          - entities.Policy.fields.effective_date
          - entities.Policy.fields.expiration_date
        distinguishing_aspect: |
          Closed [effective, expiration] interval semantics on Policy with ADJACENCY REJECTED:
          a new policy for the same policyholder_name starting exactly on the prior policy's
          expiration_date (2026-12-31) collides -> ERR_POLICY_PERIOD_OVERLAP. Different interval
          geometry (closed, touching-collides) and different resource entity (Policy) than the
          half-open rental rule.
        test_recipe:
          setup:
            - "An existing ACTIVE policy for policyholder 'Same Holder' with window [2026-01-01, 2026-12-31]."
          setup_api_calls:
            - call: "POST /policies"
              payload: { policyholder_name: "Same Holder", policy_number: "POL-SAME-1", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2026-12-31T00:00:00.000Z", comparative_fault_rule: "PURE" }
              as: ClaimsSupervisor
              captures: { pol1: $.data.id }
          trigger:
            - call: "POST /policies"
              payload: { policyholder_name: "Same Holder", policy_number: "POL-SAME-2", effective_date: "2026-12-31T00:00:00.000Z", expiration_date: "2027-12-31T00:00:00.000Z", comparative_fault_rule: "PURE" }
              as: ClaimsSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_POLICY_PERIOD_OVERLAP"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: settle_then_void_conserves_claim_net_cash
        grounds:
          - state_machines.Claim.REPAIR_APPROVED_to_SETTLED
          - state_machines.Disbursement.APPROVED_to_VOIDED
          - entities.Claim.fields.total_disbursed_cents
          - calculations.claim_ledger_balance
        distinguishing_aspect: |
          Conserved quantity #1 = net cash disbursed (Claim.total_disbursed_cents, in cents).
          Forward action settle creates a +550000 SETTLEMENT disbursement (total_disbursed_cents
          550000); the compensating void of that disbursement returns total_disbursed_cents to 0,
          conserving net cash exactly.
        test_recipe:
          setup:
            - "A REPAIR-settled claim with one APPROVED SETTLEMENT disbursement of 550000; total_disbursed_cents == 550000."
          setup_api_calls:
            - call: "POST /policies"
              payload: { policyholder_name: "Cmp Co", policy_number: "POL-CMP-1", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2026-12-31T00:00:00.000Z", comparative_fault_rule: "PURE" }
              as: ClaimsSupervisor
              captures: { pol: $.data.id }
            - call: "POST /policies/${pol}/coverages"
              payload: { coverage_type: "COLLISION", limit_cents: 1000000, deductible_cents: 50000 }
              as: ClaimsSupervisor
            - call: "POST /adjusters"
              payload: { full_name: "Adj One", license_tier: "STANDARD" }
              as: ClaimsSupervisor
              captures: { adj1: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${pol}", loss_datetime: "2026-06-01T00:00:00.000Z", loss_type: "COLLISION", vehicle_acv_cents: 800000 }
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { claim: $.data.id }
            - call: "POST /claims/${claim}/verify-coverage"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { c_v1: $.data.version }
            - call: "POST /claims/${claim}/assign-adjuster"
              payload: { adjuster_id: "${adj1}", expected_claim_version: "${c_v1}" }
              as: ClaimsSupervisor
              captures: { c_v2: $.data.version }
            - call: "POST /repair-estimates"
              payload: { claim_id: "${claim}", lines: [ { description: "body", labor_cents: 400000, parts_cents: 200000 } ] }
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { est: $.data.id }
            - call: "POST /repair-estimates/${est}/submit"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
            - call: "POST /claims/${claim}/decide-disposition"
              payload: { decision: "REPAIR", expected_claim_version: "${c_v2}" }
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { c_v3: $.data.version }
            - call: "POST /claims/${claim}/settle"
              payload: { expected_claim_version: "${c_v3}" }
              as: ClaimsSupervisor
            - call: "GET /claims/${claim}/disbursements"
              payload: {}
              as: ClaimsSupervisor
              captures: { disb0: "$.data[0].id" }
          trigger:
            - call: "POST /disbursements/${disb0}/void"
              payload: {}
              as: ClaimsSupervisor
              captures: { st: $.data.status }
            - call: "GET /claims/${claim}"
              payload: {}
              as: ClaimsSupervisor
              captures: { td: $.data.total_disbursed_cents }
          assert:
            - "Disbursement.${disb0}.status == VOIDED"
            - "Claim.${claim}.total_disbursed_cents == 0"

      - name: estimate_supersede_conserves_single_submitted_count
        grounds:
          - state_machines.RepairEstimate.DRAFT_to_SUBMITTED
          - state_machines.RepairEstimate.SUBMITTED_to_SUPERSEDED
          - entities.RepairEstimate.fields.status
        distinguishing_aspect: |
          Conserved quantity #2 = the cardinality invariant "exactly one SUBMITTED RepairEstimate
          per claim" (a count, not cents — a different type of conserved quantity than net cash).
          Forward submit of estimate#2 paired with the compensating supersede of estimate#1 leaves
          the count of SUBMITTED estimates at exactly 1.
        test_recipe:
          setup:
            - "A claim at UNDER_REVIEW with estimate#1 SUBMITTED and estimate#2 DRAFT."
          setup_api_calls:
            - call: "POST /policies"
              payload: { policyholder_name: "Cnt Co", policy_number: "POL-CNT-1", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2026-12-31T00:00:00.000Z", comparative_fault_rule: "PURE" }
              as: ClaimsSupervisor
              captures: { pol: $.data.id }
            - call: "POST /policies/${pol}/coverages"
              payload: { coverage_type: "COLLISION", limit_cents: 1000000, deductible_cents: 50000 }
              as: ClaimsSupervisor
            - call: "POST /adjusters"
              payload: { full_name: "Adj One", license_tier: "STANDARD" }
              as: ClaimsSupervisor
              captures: { adj1: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${pol}", loss_datetime: "2026-06-01T00:00:00.000Z", loss_type: "COLLISION", vehicle_acv_cents: 800000 }
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { claim: $.data.id }
            - call: "POST /claims/${claim}/verify-coverage"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { c_v1: $.data.version }
            - call: "POST /claims/${claim}/assign-adjuster"
              payload: { adjuster_id: "${adj1}", expected_claim_version: "${c_v1}" }
              as: ClaimsSupervisor
            - call: "POST /repair-estimates"
              payload: { claim_id: "${claim}", lines: [ { description: "v1", labor_cents: 300000, parts_cents: 0 } ] }
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { est1: $.data.id }
            - call: "POST /repair-estimates/${est1}/submit"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
            - call: "POST /repair-estimates"
              payload: { claim_id: "${claim}", lines: [ { description: "v2", labor_cents: 500000, parts_cents: 0 } ] }
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { est2: $.data.id }
          trigger:
            - call: "POST /repair-estimates/${est2}/submit"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
            - call: "GET /repair-estimates?claim_id=${claim}&status=SUBMITTED"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { only_submitted_id: "$.data[0].id" }
          assert:
            - "GET /repair-estimates?claim_id=${claim}&status=SUBMITTED returns exactly 1 row with meta.total_count == 1 (est2 SUBMITTED, est1 SUPERSEDED)"
            - "RepairEstimate.${est2}.status == SUBMITTED"
            - "RepairEstimate.${est1}.status == SUPERSEDED"
