# =============================================================================
# §1.9 Scaffold Corner Design — task_1236 building materials reuse warehouse
# Breadth coverage of §1.1–§1.7 claims NOT already exercised by §1.8.
# claim_type values come from references/claim-extraction-guide.md section rows.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: donor_create_defaults_applied
        claim_type: defaults
        grounds: ["entities.Donor.fields.status", "entities.Donor.fields.recognition_tier", "entities.Donor.fields.trailing_receipt_value_cents"]
        distinguishing_aspect: "Omitting phone applies default ''; system fields initialize status ACTIVE, tier NONE, trailing 0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /reuse/donors"
              payload: { full_name: "C One", donor_type: "INDIVIDUAL", email: "c1@x.com", address_text: "1 Rd" }
              as: IntakeStaff
              captures: { d_id: $.data.id, d_status: $.data.status, d_tier: $.data.recognition_tier, d_trailing: $.data.trailing_receipt_value_cents, d_phone: $.data.phone }
          trigger: []
          assert:
            - "Donor.${d_id}.status == 'ACTIVE', recognition_tier == 'NONE', trailing_receipt_value_cents == 0, phone == ''"

      - name: item_read_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_ITEM_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns 404 ERR_ITEM_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /reuse/items/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response is 404 with error_id == ERR_ITEM_NOT_FOUND"

      - name: donor_create_missing_required_email
        claim_type: required_fields
        grounds: ["entities.Donor.fields.email", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Missing required input field email -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /reuse/donors"
              payload: { full_name: "No Email", donor_type: "INDIVIDUAL", address_text: "2 Rd" }
              as: IntakeStaff
              captures: { err: $.data.error_id }
          assert:
            - "response is 400 with error_id == ERR_INVALID_REQUEST"

      - name: category_create_computed_field_input_ignored
        claim_type: system_fields
        grounds: ["entities.Category.fields.acceptance_status"]
        distinguishing_aspect: "Client-supplied acceptance_status on create is ignored; server initializes ACCEPTING."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /reuse/categories"
              payload: { code: "SYSFL", display_name: "Sys Field", pricing_model: "PER_UNIT", base_rate_cents: 100, hazmat_risk_flag: false, markdown_after_days: 30, markdown_step_pct: 0.20, markdown_interval_days: 15, max_markdown_steps: 2, floor_price_pct: 0.40, target_turn_days: 45, acceptance_status: "RETIRED" }
              as: StoreManager
              captures: { c_status: $.data.acceptance_status }
          assert:
            - "response category.acceptance_status == 'ACCEPTING' (client input ignored)"

      - name: screening_immutable_record_shape
        claim_type: immutability
        grounds: ["entities.HazmatScreening"]
        distinguishing_aspect: "common_fields false: screening response carries id + created_at but no version/updated_at; no PATCH endpoint exists for screenings."
        test_recipe:
          setup: ["technician and job in SCREENING_PENDING"]
          setup_api_calls:
            - call: "POST /reuse/crew-members"
              payload: { full_name: "Tech C", crew_type: "VOLUNTEER", hazmat_certified: true }
              as: CrewCoordinator
              captures: { tech_id: $.data.id }
            - call: "POST /reuse/deconstruction-jobs"
              payload: { title: "Imm Job", site_address_text: "3 Rd", quoted_fee_cents: 1000 }
              as: CrewCoordinator
              captures: { job_id: $.data.id }
            - call: "POST /reuse/deconstruction-jobs/${job_id}/request-screening"
              payload: {}
              as: CrewCoordinator
          trigger:
            - call: "POST /reuse/hazmat-screenings"
              payload: { job_id: "${job_id}", lead_result: "NEGATIVE", asbestos_result: "NOT_TESTED" }
              as: HazmatTechnician
              as_user_id: "${tech_id}"
              captures: { s_outcome: $.data.outcome, s_round: $.data.screening_round }
          assert:
            - "screening outcome == 'PENDING' (asbestos NOT_TESTED) and screening_round == 1"
            - "screening payload exposes id and created_at but no version field (common_fields false)"

      - name: item_create_body_fk_not_found
        claim_type: parent_relationships
        grounds: ["entities.Item.fields.offer_id", "errors[ERR_OFFER_NOT_FOUND]", "validations[priority=5]"]
        distinguishing_aspect: "Body FK offer_id referencing a non-existent offer -> 404 ERR_OFFER_NOT_FOUND (existence of body references, priority 5)."
        test_recipe:
          setup: ["a category exists"]
          setup_api_calls:
            - call: "POST /reuse/categories"
              payload: { code: "FKCAT", display_name: "FK Cat", pricing_model: "PER_UNIT", base_rate_cents: 100, hazmat_risk_flag: false, markdown_after_days: 30, markdown_step_pct: 0.20, markdown_interval_days: 15, max_markdown_steps: 2, floor_price_pct: 0.40, target_turn_days: 45 }
              as: StoreManager
              captures: { cat_id: $.data.id }
          trigger:
            - call: "POST /reuse/items"
              payload: { category_id: "${cat_id}", description_text: "orphan", condition_grade: "A", measure_qty: 1, measure_unit: "UNIT", pre_1978_flag: false, estimated_weight_lbs: 1, offer_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2" }
              as: IntakeStaff
              captures: { err: $.data.error_id }
          assert:
            - "response is 404 with error_id == ERR_OFFER_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: receive_offered_offer_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.DonationOffer", "errors[ERR_OFFER_NOT_ACCEPTED]"]
        distinguishing_aspect: "receive is defined only from ACCEPTED; from OFFERED it fails with ERR_OFFER_NOT_ACCEPTED."
        test_recipe:
          setup: ["category + donor + offer in OFFERED"]
          setup_api_calls:
            - call: "POST /reuse/categories"
              payload: { code: "ROFF", display_name: "R Off", pricing_model: "PER_UNIT", base_rate_cents: 100, hazmat_risk_flag: false, markdown_after_days: 30, markdown_step_pct: 0.20, markdown_interval_days: 15, max_markdown_steps: 2, floor_price_pct: 0.40, target_turn_days: 45 }
              as: StoreManager
              captures: { cat_id: $.data.id }
            - call: "POST /reuse/donors"
              payload: { full_name: "D R", donor_type: "INDIVIDUAL", email: "dr@x.com", address_text: "4 Rd" }
              as: IntakeStaff
              captures: { donor_id: $.data.id }
            - call: "POST /reuse/donation-offers"
              payload: { donor_id: "${donor_id}", source_type: "DROPOFF", category_id: "${cat_id}", description_text: "x", estimated_quantity: 1, quantity_unit: "UNIT", condition_grade: "A", pre_1978_flag: false }
              as: IntakeStaff
              captures: { offer_id: $.data.id }
          trigger:
            - call: "POST /reuse/donation-offers/${offer_id}/receive"
              payload: {}
              as: IntakeStaff
              captures: { err: $.data.error_id }
          assert:
            - "409 ERR_OFFER_NOT_ACCEPTED; offer.status remains OFFERED"

      - name: completed_job_lockdown_cancel_rejected
        claim_type: terminal_lockdown
        grounds: ["state_machines.DeconstructionJob", "errors[ERR_INVALID_JOB_STATE]"]
        distinguishing_aspect: "COMPLETED is terminal: cancel from COMPLETED returns ERR_INVALID_JOB_STATE and no cascade fires."
        test_recipe:
          setup: ["job driven to COMPLETED (cleared, scheduled, assigned, started, completed)"]
          setup_api_calls:
            - call: "POST /reuse/crew-members"
              payload: { full_name: "Tech T", crew_type: "PAID", hourly_rate_cents: 4000, hazmat_certified: true }
              as: CrewCoordinator
              captures: { tech_id: $.data.id }
            - call: "POST /reuse/crew-members"
              payload: { full_name: "Lead T", crew_type: "PAID", hourly_rate_cents: 5000, lead_certified: true }
              as: CrewCoordinator
              captures: { lead_id: $.data.id }
            - call: "POST /reuse/vehicles"
              payload: { plate_code: "TRK-T", capacity_lbs: 9000 }
              as: CrewCoordinator
              captures: { veh_id: $.data.id }
            - call: "POST /reuse/deconstruction-jobs"
              payload: { title: "Lock Job", site_address_text: "5 Rd", quoted_fee_cents: 1000 }
              as: CrewCoordinator
              captures: { job_id: $.data.id }
            - call: "POST /reuse/deconstruction-jobs/${job_id}/request-screening"
              payload: {}
              as: CrewCoordinator
            - call: "POST /reuse/hazmat-screenings"
              payload: { job_id: "${job_id}", lead_result: "NEGATIVE", asbestos_result: "NEGATIVE" }
              as: HazmatTechnician
              as_user_id: "${tech_id}"
            - call: "POST /reuse/deconstruction-jobs/${job_id}/schedule"
              payload: { lead_crew_member_id: "${lead_id}", vehicle_id: "${veh_id}", scheduled_start: "2026-06-22T08:00:00Z", scheduled_end: "2026-06-22T16:00:00Z" }
              as: CrewCoordinator
            - call: "POST /reuse/crew-assignments"
              payload: { job_id: "${job_id}", crew_member_id: "${lead_id}", role_on_job: "LEAD", start_at: "2026-06-22T08:00:00Z", end_at: "2026-06-22T12:00:00Z" }
              as: CrewCoordinator
            - call: "POST /reuse/deconstruction-jobs/${job_id}/start"
              payload: {}
              as: CrewCoordinator
            - call: "POST /reuse/deconstruction-jobs/${job_id}/complete"
              payload: {}
              as: CrewCoordinator
          trigger:
            - call: "POST /reuse/deconstruction-jobs/${job_id}/cancel"
              payload: {}
              as: CrewCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "409 ERR_INVALID_JOB_STATE; job.status remains COMPLETED"

      - name: offer_initial_state_offered
        claim_type: initial_state
        grounds: ["state_machines.DonationOffer"]
        distinguishing_aspect: "Newly created offer starts in OFFERED with version 1."
        test_recipe:
          setup: ["category + donor"]
          setup_api_calls:
            - call: "POST /reuse/categories"
              payload: { code: "INITC", display_name: "Init Cat", pricing_model: "PER_UNIT", base_rate_cents: 100, hazmat_risk_flag: false, markdown_after_days: 30, markdown_step_pct: 0.20, markdown_interval_days: 15, max_markdown_steps: 2, floor_price_pct: 0.40, target_turn_days: 45 }
              as: StoreManager
              captures: { cat_id: $.data.id }
            - call: "POST /reuse/donors"
              payload: { full_name: "D I", donor_type: "INDIVIDUAL", email: "di@x.com", address_text: "6 Rd" }
              as: IntakeStaff
              captures: { donor_id: $.data.id }
          trigger:
            - call: "POST /reuse/donation-offers"
              payload: { donor_id: "${donor_id}", source_type: "DROPOFF", category_id: "${cat_id}", description_text: "init", estimated_quantity: 2, quantity_unit: "UNIT", condition_grade: "B", pre_1978_flag: false }
              as: IntakeStaff
              captures: { o_status: $.data.status, o_version: $.data.version }
          assert:
            - "offer.status == 'OFFERED' and version == 1 at creation"

      - name: reject_void_reverts_to_issued
        claim_type: revert_edge
        grounds: ["state_machines.TaxReceipt.VOID_REQUESTED_to_ISSUED", "state_machines.TaxReceipt.ISSUED_to_VOID_REQUESTED"]
        distinguishing_aspect: "The ISSUED -> VOID_REQUESTED -> ISSUED revert restores status with no valuation change; offer stays RECEIPTED."
        test_recipe:
          setup: ["offer RECEIVED by staff-rv with one priced item 40000; receipt drafted and ISSUED by staff-iv"]
          setup_api_calls:
            - call: "POST /reuse/categories"
              payload: { code: "RVCAT", display_name: "Revert Cat", pricing_model: "PER_UNIT", base_rate_cents: 40000, hazmat_risk_flag: false, markdown_after_days: 30, markdown_step_pct: 0.20, markdown_interval_days: 15, max_markdown_steps: 2, floor_price_pct: 0.40, target_turn_days: 45 }
              as: StoreManager
              captures: { cat_id: $.data.id }
            - call: "POST /reuse/donors"
              payload: { full_name: "D RV", donor_type: "INDIVIDUAL", email: "drv@x.com", address_text: "7 Rd" }
              as: IntakeStaff
              captures: { donor_id: $.data.id }
            - call: "POST /reuse/donation-offers"
              payload: { donor_id: "${donor_id}", source_type: "DROPOFF", category_id: "${cat_id}", description_text: "rv", estimated_quantity: 1, quantity_unit: "UNIT", condition_grade: "A", pre_1978_flag: false }
              as: IntakeStaff
              captures: { offer_id: $.data.id }
            - call: "POST /reuse/donation-offers/${offer_id}/review"
              payload: {}
              as: IntakeStaff
            - call: "POST /reuse/donation-offers/${offer_id}/accept"
              payload: {}
              as: IntakeStaff
            - call: "POST /reuse/donation-offers/${offer_id}/receive"
              payload: {}
              as: IntakeStaff
              as_user_id: "staff-rv"
            - call: "POST /reuse/items"
              payload: { category_id: "${cat_id}", description_text: "rv item", condition_grade: "A", measure_qty: 1, measure_unit: "UNIT", pre_1978_flag: false, estimated_weight_lbs: 3, offer_id: "${offer_id}" }
              as: IntakeStaff
              captures: { item_id: $.data.id }
            - call: "POST /reuse/items/${item_id}/price"
              payload: { price_override_cents: 40000 }
              as: StoreManager
            - call: "POST /reuse/tax-receipts"
              payload: { offer_id: "${offer_id}" }
              as: IntakeStaff
              captures: { rcpt_id: $.data.id }
            - call: "POST /reuse/tax-receipts/${rcpt_id}/issue"
              payload: {}
              as: IntakeStaff
              as_user_id: "staff-iv"
              captures: { r_status: $.data.status, r_total: $.data.valued_total_cents }
          trigger:
            - call: "POST /reuse/tax-receipts/${rcpt_id}/request-void"
              payload: { void_reason: "donor dispute" }
              as: IntakeStaff
              captures: { r_st2: $.data.status }
            - call: "POST /reuse/tax-receipts/${rcpt_id}/reject-void"
              payload: {}
              as: WarehouseAdmin
              captures: { r_st3: $.data.status, r_total3: $.data.valued_total_cents }
          assert:
            - "request-void moves receipt to VOID_REQUESTED; reject-void returns it to ISSUED"
            - "valued_total_cents unchanged at 40000 after the round trip"

      - name: job_cancel_cascades_to_assignments_and_appointments
        claim_type: cascade_down
        grounds: ["state_machines.DeconstructionJob.SCHEDULED_to_CANCELLED"]
        distinguishing_aspect: "Cancelling a SCHEDULED job cascades: ASSIGNED assignment -> CANCELLED and BOOKED job-subject appointment -> CANCELLED."
        test_recipe:
          setup: ["job SCHEDULED with one ASSIGNED assignment and one BOOKED appointment (subject DECONSTRUCTION_JOB)"]
          setup_api_calls:
            - call: "POST /reuse/crew-members"
              payload: { full_name: "Tech CC", crew_type: "PAID", hourly_rate_cents: 4000, hazmat_certified: true }
              as: CrewCoordinator
              captures: { tech_id: $.data.id }
            - call: "POST /reuse/crew-members"
              payload: { full_name: "Lead CC", crew_type: "PAID", hourly_rate_cents: 5000, lead_certified: true }
              as: CrewCoordinator
              captures: { lead_id: $.data.id }
            - call: "POST /reuse/vehicles"
              payload: { plate_code: "TRK-CC", capacity_lbs: 9000 }
              as: CrewCoordinator
              captures: { veh_id: $.data.id }
            - call: "POST /reuse/deconstruction-jobs"
              payload: { title: "Cascade Job", site_address_text: "8 Rd", quoted_fee_cents: 1000 }
              as: CrewCoordinator
              captures: { job_id: $.data.id }
            - call: "POST /reuse/deconstruction-jobs/${job_id}/request-screening"
              payload: {}
              as: CrewCoordinator
            - call: "POST /reuse/hazmat-screenings"
              payload: { job_id: "${job_id}", lead_result: "NEGATIVE", asbestos_result: "NEGATIVE" }
              as: HazmatTechnician
              as_user_id: "${tech_id}"
            - call: "POST /reuse/deconstruction-jobs/${job_id}/schedule"
              payload: { lead_crew_member_id: "${lead_id}", vehicle_id: "${veh_id}", scheduled_start: "2026-06-24T08:00:00Z", scheduled_end: "2026-06-24T16:00:00Z" }
              as: CrewCoordinator
            - call: "POST /reuse/crew-assignments"
              payload: { job_id: "${job_id}", crew_member_id: "${lead_id}", role_on_job: "LEAD", start_at: "2026-06-24T08:00:00Z", end_at: "2026-06-24T12:00:00Z" }
              as: CrewCoordinator
              captures: { asg_id: $.data.id }
            - call: "POST /reuse/pickup-appointments"
              payload: { subject_type: "DECONSTRUCTION_JOB", subject_id: "${job_id}", vehicle_id: "${veh_id}", window_start: "2026-06-25T09:00:00Z", window_end: "2026-06-25T10:00:00Z" }
              as: CrewCoordinator
              captures: { appt_id: $.data.id }
          trigger:
            - call: "POST /reuse/deconstruction-jobs/${job_id}/cancel"
              payload: {}
              as: CrewCoordinator
            - call: "GET /reuse/crew-assignments/${asg_id}"
              as: CrewCoordinator
              captures: { a_status: $.data.status }
            - call: "GET /reuse/pickup-appointments/${appt_id}"
              as: CrewCoordinator
              captures: { p_status: $.data.status }
          assert:
            - "job CANCELLED; CrewAssignment.${asg_id}.status == CANCELLED (cascade)"
            - "PickupAppointment.${appt_id}.status == CANCELLED (cascade)"

      - name: failed_screening_quarantines_only_weighed_batches
        claim_type: conditional_cascade
        grounds: ["state_machines.DeconstructionJob.IN_PROGRESS_to_HAZMAT_HOLD"]
        distinguishing_aspect: "Post-hoc FAILED screening on an IN_PROGRESS job quarantines only WEIGHED batches; the MANIFESTED batch is untouched, and certified tonnage drops by exactly the quarantined batch's diverted weight."
        test_recipe:
          setup: ["job IN_PROGRESS with batch1 WEIGHED (480 scale, 30 contamination -> 450 diverted) and batch2 MANIFESTED"]
          setup_api_calls:
            - call: "POST /reuse/crew-members"
              payload: { full_name: "Tech Q", crew_type: "PAID", hourly_rate_cents: 4000, hazmat_certified: true }
              as: CrewCoordinator
              captures: { tech_id: $.data.id }
            - call: "POST /reuse/crew-members"
              payload: { full_name: "Lead Q", crew_type: "PAID", hourly_rate_cents: 5000, lead_certified: true }
              as: CrewCoordinator
              captures: { lead_id: $.data.id }
            - call: "POST /reuse/vehicles"
              payload: { plate_code: "TRK-Q", capacity_lbs: 9000 }
              as: CrewCoordinator
              captures: { veh_id: $.data.id }
            - call: "POST /reuse/categories"
              payload: { code: "QCAT", display_name: "Q Cat", pricing_model: "PER_UNIT", base_rate_cents: 100, hazmat_risk_flag: true, markdown_after_days: 30, markdown_step_pct: 0.20, markdown_interval_days: 15, max_markdown_steps: 2, floor_price_pct: 0.40, target_turn_days: 45 }
              as: StoreManager
              captures: { cat_id: $.data.id }
            - call: "POST /reuse/deconstruction-jobs"
              payload: { title: "Q Job", site_address_text: "9 Rd", quoted_fee_cents: 1000 }
              as: CrewCoordinator
              captures: { job_id: $.data.id }
            - call: "POST /reuse/deconstruction-jobs/${job_id}/request-screening"
              payload: {}
              as: CrewCoordinator
            - call: "POST /reuse/hazmat-screenings"
              payload: { job_id: "${job_id}", lead_result: "NEGATIVE", asbestos_result: "NEGATIVE" }
              as: HazmatTechnician
              as_user_id: "${tech_id}"
            - call: "POST /reuse/deconstruction-jobs/${job_id}/schedule"
              payload: { lead_crew_member_id: "${lead_id}", vehicle_id: "${veh_id}", scheduled_start: "2026-06-26T08:00:00Z", scheduled_end: "2026-06-26T16:00:00Z" }
              as: CrewCoordinator
            - call: "POST /reuse/crew-assignments"
              payload: { job_id: "${job_id}", crew_member_id: "${lead_id}", role_on_job: "LEAD", start_at: "2026-06-26T08:00:00Z", end_at: "2026-06-26T12:00:00Z" }
              as: CrewCoordinator
            - call: "POST /reuse/deconstruction-jobs/${job_id}/start"
              payload: {}
              as: CrewCoordinator
            - call: "POST /reuse/salvage-batches"
              payload: { job_id: "${job_id}", category_id: "${cat_id}", estimated_weight_lbs: 500 }
              as: CrewCoordinator
              captures: { b1_id: $.data.id }
            - call: "POST /reuse/salvage-batches/${b1_id}/weigh"
              payload: { scale_weight_lbs: 480, contamination_weight_lbs: 30 }
              as: CrewCoordinator
            - call: "POST /reuse/salvage-batches"
              payload: { job_id: "${job_id}", category_id: "${cat_id}", estimated_weight_lbs: 200 }
              as: CrewCoordinator
              captures: { b2_id: $.data.id }
          trigger:
            - call: "POST /reuse/hazmat-screenings"
              payload: { job_id: "${job_id}", lead_result: "POSITIVE", asbestos_result: "NOT_TESTED" }
              as: HazmatTechnician
              as_user_id: "${tech_id}"
            - call: "GET /reuse/deconstruction-jobs/${job_id}"
              as: CrewCoordinator
              captures: { j_status: $.data.status, j_cert: $.data.certified_diverted_weight_lbs }
            - call: "GET /reuse/salvage-batches/${b1_id}"
              as: CrewCoordinator
              captures: { b1_status: $.data.status }
            - call: "GET /reuse/salvage-batches/${b2_id}"
              as: CrewCoordinator
              captures: { b2_status: $.data.status }
          assert:
            - "job -> HAZMAT_HOLD on post-hoc FAILED screening"
            - "batch1 (was WEIGHED) -> QUARANTINED and job.certified_diverted_weight_lbs drops 450 -> 0"
            - "batch2 (MANIFESTED) is untouched: status remains MANIFESTED (conditional cascade)"

      - name: agreement_supersede_transitions_old_to_superseded
        claim_type: side_effect_execution
        grounds: ["state_machines.BulkPurchaseAgreement.ACTIVE_to_SUPERSEDED", "entities.BulkPurchaseAgreement.fields.supersedes_agreement_id"]
        distinguishing_aspect: "Creating agreement A2 with supersedes_agreement_id == A1 (same contractor+category, fresh OCC version) moves A1 ACTIVE -> SUPERSEDED while A2 starts ACTIVE."
        test_recipe:
          setup: ["account approved (version captured); category; agreement A1 created"]
          setup_api_calls:
            - call: "POST /reuse/categories"
              payload: { code: "SUPCAT", display_name: "Sup Cat", pricing_model: "PER_UNIT", base_rate_cents: 100, hazmat_risk_flag: false, markdown_after_days: 30, markdown_step_pct: 0.20, markdown_interval_days: 15, max_markdown_steps: 2, floor_price_pct: 0.40, target_turn_days: 45 }
              as: StoreManager
              captures: { cat_id: $.data.id }
            - call: "POST /reuse/contractor-accounts"
              payload: { company_name: "Ctor Sup", contact_email: "sup@x.com", credit_limit_cents: 100000000 }
              as: WarehouseAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /reuse/contractor-accounts/${acct_id}/approve"
              payload: {}
              as: WarehouseAdmin
              captures: { acct_v: $.data.version }
