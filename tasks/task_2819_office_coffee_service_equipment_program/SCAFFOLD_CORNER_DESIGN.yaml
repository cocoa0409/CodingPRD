              as_user_id: "${route_id}"
            - call: "POST /ocs/maintenance-work-orders/${wo_id}/advance"
              payload: { to_status: "RESOLVED", resolution_note: "Pump replaced" }
              as: RouteTechnician
              as_user_id: "${route_id}"
          assert:
            - "after the swap loaner_status == OUT, loaner_asset_id == ${loaner_id} and EquipmentAsset.${loaner_id}.asset_status == ON_LOAN"
            - "the AWAITING_PARTS hop sets wo_status == AWAITING_PARTS, parts_eta == 2026-08-06T00:00:00Z and awaiting_parts_cycles == 1 while loaner_status stays OUT and the loaner asset stays ON_LOAN"
            - "the return to IN_PROGRESS leaves awaiting_parts_cycles at 1 and loaner_status still OUT - the two dimensions move independently"
            - "the RESOLVED attempt while loaner_status == OUT is HTTP 409 with data.error_id == ERR_LOANER_STATE_INVALID, and wo_status stays IN_PROGRESS"
            - "the loaner return sets loaner_status == RETURNED, loaner_returned_on == 2026-08-05T00:00:00Z, EquipmentAsset.${loaner_id}.asset_status == RECONDITIONING and reconditioning_until == 2026-08-06T00:00:00Z"
            - "the final RESOLVED advance is 2xx with wo_status == RESOLVED, loaner_status still RETURNED and awaiting_parts_cycles still 1"

      - name: corner_completing_the_same_visit_twice_is_rejected_on_the_second_attempt
        claim_type: idempotency
        grounds:
          - state_machines.ServiceVisit.transitions
          - validations[priority=15]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / visit_state_conflict_beats_delivered_units_overflow
          rationale: "That §1.8 instance re-completes an already COMPLETED visit and asserts ERR_VISIT_STATE_INVALID with the par ledger unchanged, which is exactly the second-attempt claim."

      - name: corner_cancelling_the_account_cascades_down_to_placements_sites_and_visits
        claim_type: cascade_down
        grounds:
          - state_machines.Account.transitions
          - endpoints[POST /ocs/accounts/{account_id}/cancel]
        excluded_because:
          difficulty_instance: transitive_cascade / account_cancellation_cascades_placement_to_site_to_scheduled_visit
          rationale: "That §1.8 instance walks the full three-hop cancellation cascade and asserts each hop's status plus the DRAFT invoice voiding."

      - name: corner_voiding_a_completed_visit_reverses_every_side_effect
        claim_type: compensation
        grounds:
          - state_machines.ServiceVisit.transitions
          - endpoints[POST /ocs/service-visits/{visit_id}/void]
        excluded_because:
          difficulty_instance: compensating_invariant / visit_void_restores_the_par_unit_ledger_and_route_minutes_without_drift
          rationale: "That §1.8 instance asserts the par ledger, the route minutes and the site posture all return to their pre-completion values with no drift."

      - name: corner_compliance_status_can_loop_back_to_meeting_minimum
        claim_type: cyclic
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.EquipmentPlacement.transitions
        excluded_because:
          difficulty_instance: non_linear_state_machine / placement_compliance_cycles_warned_billed_then_back_to_meeting_minimum
          rationale: "That §1.8 instance drives the full MEETING_MINIMUM -> SHORTFALL_WARNED -> SHORTFALL_BILLED -> MEETING_MINIMUM loop through repeated /evaluate-compliance calls."

      - name: corner_escalation_cascade_only_defers_adjustments_that_are_still_proposed
        claim_type: conditional_cascade
        grounds:
          - state_machines.PriceAdjustment.transitions
          - state_machines.Account.transitions
        excluded_because:
          difficulty_instance: transitive_cascade / visit_completion_cascades_par_stockout_to_site_to_account_to_deferred_adjustment
          rationale: "That §1.8 instance asserts the four-hop chain in which only a PROPOSED adjustment is moved to DEFERRED when the account turns AT_RISK."

      - name: corner_transitions_guarded_by_another_entity_state
        claim_type: guarded_transitions
        grounds:
          - complexity_profile.state_machine_shape
          - validations[priority=12]
          - validations[priority=14]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / visit_scheduling_depends_on_site_planning_state
          rationale: "That §1.8 instance (with its two siblings on asset stock state and asset descale state) already asserts the A->B-only-if-C-in-state-X guard in both directions."

  # ================================================================= CALCULATIONS
  - section: calculations
    instances:

      - name: corner_consumption_debit_floors_the_modeled_draw_then_clamps_at_the_shelf_quantity
        claim_type: chronological
        grounds:
          - calculations.consumption_debit
          - entities.ParLevel.fields.on_hand_units
          - endpoints[POST /ocs/service-visits/{visit_id}/complete]
        distinguishing_aspect: "Three successive completions on the same ParLevel row exercise the pinned order (debit the modeled consumption, then credit the delivery), the floor on the modeled draw (par 28 over 7 days debits exactly 14) and the min() clamp (par 70 over 7 days would debit 35 but only 21 units are on the shelf, so 21 is debited and on_hand lands at 0 before the delivery, never negative)."
        test_recipe:
          setup:
            - "clock at 2026-08-03T08:00:00Z; MON route (capacity 480, buffer 30); one COFFEE product; model URN-30"
            - "one CONSOLIDATED account with one planned site (headcount 40, days_per_week 5, DRIP) whose COFFEE ParLevel row was created at par 65 / reorder 26 and then overridden to par 28 / reorder 12"
          setup_api_calls:
            - call: "POST /ocs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ocs/routes"
              payload: { name: "Metro MON", service_day: "MON", capacity_minutes: 480, travel_buffer_minutes: 30 }
              as: ProgramAdmin
              captures: { route_id: "$.data.id" }
            - call: "POST /ocs/product-items"
              payload: { sku: "COF-HOUSE-12OZ", category: "COFFEE", base_unit_price_micros: 4500000, pack_units: 6, green_coffee_linked: true }
              as: ProgramAdmin
              captures: { p_cof_id: "$.data.id" }
            - call: "POST /ocs/equipment-models"
              payload: { model_code: "URN-30", brewer_class: "THERMAL", cups_per_hour_capacity: 30, min_headcount: 1, max_headcount: 250, monthly_rent_cents: 4500, descale_interval_days: 90, list_value_cents: 120000 }
              as: ProgramAdmin
              captures: { model_id: "$.data.id" }
            - call: "POST /ocs/accounts"
              payload: { legal_name: "Northgate Holdings LLC", billing_mode: "CONSOLIDATED", green_index_baseline_micros: 2000000, price_protection_days: 90 }
              as: AccountManager
              captures: { acct_id: "$.data.id" }
            - call: "POST /ocs/sites"
              payload: { account_id: "${acct_id}", route_id: "${route_id}", site_name: "HQ Floor 3", headcount: 40, days_per_week: 5, consumption_model: "HEADCOUNT_MODEL", service_minutes_estimate: 45 }
              as: AccountManager
              captures: { site_id: "$.data.id" }
            - call: "POST /ocs/sites/${site_id}/size-and-plan"
              payload: { brew_style: "DRIP" }
              as: AccountManager
            - call: "GET /ocs/par-levels"
              payload: { site_id: "${site_id}", product_id: "${p_cof_id}" }
              as: AccountManager
              captures: { par_id: "$.data[0].id" }
            - call: "PATCH /ocs/par-levels/${par_id}"
              payload: { par_units: 28, reorder_point_units: 12 }
              as: AccountManager
            - call: "POST /ocs/service-visits"
              payload: { site_id: "${site_id}", window_start: "2026-08-03T09:00:00Z", window_end: "2026-08-03T09:45:00Z", planned_minutes: 45 }
              as: AccountManager
              captures: { v1_id: "$.data.id" }
            - call: "POST /ocs/service-visits/${v1_id}/lines"
              payload: { product_id: "${p_cof_id}", requested_units: 30 }
              as: RouteTechnician
              as_user_id: "${route_id}"
            - call: "POST /ocs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:30:00Z" }
              as: ProgramAdmin
            - call: "POST /ocs/service-visits/${v1_id}/complete"
              payload: { delivered_lines: [{ product_id: "${p_cof_id}", delivered_units: 30 }] }
              as: RouteTechnician
              as_user_id: "${route_id}"
          trigger:
            - call: "POST /ocs/service-visits"
              payload: { site_id: "${site_id}", window_start: "2026-08-10T09:00:00Z", window_end: "2026-08-10T09:45:00Z", planned_minutes: 45 }
              as: AccountManager
              captures: { v2_id: "$.data.id" }
            - call: "POST /ocs/service-visits/${v2_id}/lines"
              payload: { product_id: "${p_cof_id}", requested_units: 5 }
              as: RouteTechnician
              as_user_id: "${route_id}"
            - call: "POST /ocs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:30:00Z" }
              as: ProgramAdmin
            - call: "POST /ocs/service-visits/${v2_id}/complete"
              payload: { delivered_lines: [{ product_id: "${p_cof_id}", delivered_units: 5 }] }
              as: RouteTechnician
              as_user_id: "${route_id}"
            - call: "PATCH /ocs/par-levels/${par_id}"
              payload: { par_units: 70, reorder_point_units: 28 }
              as: AccountManager
            - call: "POST /ocs/service-visits"
              payload: { site_id: "${site_id}", window_start: "2026-08-17T09:00:00Z", window_end: "2026-08-17T09:45:00Z", planned_minutes: 45 }
              as: AccountManager
              captures: { v3_id: "$.data.id" }
            - call: "POST /ocs/service-visits/${v3_id}/lines"
              payload: { product_id: "${p_cof_id}", requested_units: 3 }
              as: RouteTechnician
              as_user_id: "${route_id}"
            - call: "POST /ocs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-17T09:30:00Z" }
              as: ProgramAdmin
            - call: "POST /ocs/service-visits/${v3_id}/complete"
              payload: { delivered_lines: [{ product_id: "${p_cof_id}", delivered_units: 3 }] }
              as: RouteTechnician
              as_user_id: "${route_id}"
          assert:
            - "after visit 1 (elapsed_days == 0) ParLevel.${par_id}: cumulative_consumed_units == 0, on_hand_units == 30, cumulative_delivered_units == 30, stock_status == IN_STOCK (30 > 12)"
            - "after visit 2 (elapsed_days == 7, par 28 so modeled_daily == 2.0): consumed_units == floor(2.0 * 7) == 14, so on_hand_units == 30 - 14 + 5 == 21, cumulative_consumed_units == 14, cumulative_delivered_units == 35 and stock_status == IN_STOCK (21 > 12)"
            - "after visit 3 (elapsed_days == 7, par 70 so modeled_daily == 5.0): the modeled draw floor(5.0 * 7) == 35 exceeds the 21 units on hand, so consumed_units == 21 (the min() clamp) and on_hand_units == 21 - 21 + 3 == 3, never a negative quantity"
            - "cumulative_consumed_units == 35 and cumulative_delivered_units == 38 after visit 3, so the two counters never drift from the on_hand arithmetic"
            - "stock_status after visit 3 == LOW because 0 < 3 <= 28, and Site.${site_id}.escalation_score == 7.5 with service_posture ACTIVE"
            - "the debit-then-credit order is observable: crediting first would have left on_hand at 24 - 24 == 0 after visit 3 instead of 3"

      - name: corner_trailing_purchase_rollup_excludes_voided_visits_and_other_sites
        claim_type: input_set_filtering
        grounds:
          - calculations.trailing_purchase_rollup
          - calculations.equipment_program_charge
          - endpoints[POST /ocs/equipment-placements/{placement_id}/evaluate-compliance]
        distinguishing_aspect: "Three COMPLETED visits exist inside the 90-day window but only one qualifies: the VOIDED visit of the same site and the COMPLETED visit of the account's OTHER site are both excluded, so trailing_purchase_cents is 9000 rather than 18000 or 27000."
        test_recipe:
          setup:
