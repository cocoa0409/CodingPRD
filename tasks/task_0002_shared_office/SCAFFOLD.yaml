scenario: "Shared office space management: workstation/meeting room/event area reservation, flexible billing (hourly/daily/monthly), visitor registration, access control, bill consolidation, and lease termination process. with more complex bussiness logic you can image."
domain_name: "shared-office"
api_prefix: "/shared-office"

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
    - scheduled_deferred_actions
  entity_topology: graph
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Tenant
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered legal name of the tenant company
        constraints: "length 1..120"
      - name: credit_limit_cents
        type: integer
        source: input
        description: Max outstanding bill balance before ACCESS_RESTRICTED posture
        default: 500000
        constraints: ">= 0"
      - name: outstanding_balance_cents
        type: integer
        source: computed
        description: "Sum of Bill.total_due_cents for bills whose status IN {ISSUED, OVERDUE}. Recomputed on every Bill status transition into or out of {ISSUED, OVERDUE}."
        default: 0
      - name: access_posture
        type: enum
        source: computed
        description: "Gates all new reservations, visitor registrations, and access-badge activations. Derived from outstanding_balance_cents and lease.status."
        constraints: "OPEN | RESTRICTED | FROZEN"
        default: "OPEN"
      - name: status
        type: enum
        source: system
        description: Tenant lifecycle status
        constraints: "ACTIVE | TERMINATING | CLOSED"
        default: "ACTIVE"

  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: tenant_id
        type: string
        source: input
        description: FK to Tenant.id
        constraints: "must reference Tenant with status IN {ACTIVE, TERMINATING}"
      - name: email
        type: string
        source: input
        description: Login email
        constraints: "unique across all Members regardless of tenant"
      - name: full_name
        type: string
        source: input
        description: Member display name
      - name: role_in_tenant
        type: enum
        source: input
        description: Tenant-internal role
        constraints: "ADMIN | STAFF"
        default: "STAFF"
      - name: status
        type: enum
        source: system
        description: Member access status
        constraints: "ACTIVE | SUSPENDED | REVOKED"
        default: "ACTIVE"

  - name: Lease
    parent: Tenant
    common_fields: true
    fields:
      - name: tenant_id
        type: string
        source: input
        description: FK to Tenant.id
      - name: billing_plan
        type: enum
        source: input
        description: "Workstation billing plan anchor: governs provisional pricing for workstation reservations made by this tenant's members"
        constraints: "HOURLY | DAILY | MONTHLY"
      - name: monthly_rate_cents
        type: integer
        source: input
        description: Base monthly commitment (only meaningful when billing_plan = MONTHLY)
        default: 0
        constraints: ">= 0"
      - name: term_start_date
        type: string
        source: input
        description: Lease term start (YYYY-MM-DD, inclusive)
      - name: term_end_date
        type: string
        source: input
        description: Lease term end (YYYY-MM-DD, inclusive)
      - name: status
        type: enum
        source: system
        description: Lease lifecycle
        constraints: "DRAFT | ACTIVE | TERMINATION_REQUESTED | TERMINATION_REVIEWING | TERMINATED | REJECTED"
        default: "DRAFT"
      - name: termination_effective_date
        type: string
        source: system
        description: "Set when TERMINATION_REVIEWING → TERMINATED; null otherwise"
        default: null
      - name: termination_penalty_cents
        type: integer
        source: computed
        description: "Computed by calculation `lease_termination_penalty` at TERMINATION_REVIEWING → TERMINATED; 0 otherwise"
        default: 0

  - name: Resource
    parent: null
    common_fields: true
    fields:
      - name: kind
        type: enum
        source: input
        description: Resource type — drives pricing algorithm selection
        constraints: "WORKSTATION | MEETING_ROOM | EVENT_AREA"
      - name: code
        type: string
        source: input
        description: Short human code (e.g., WS-12, MR-3, EVT-A)
        constraints: "unique across all Resources"
      - name: capacity
        type: integer
        source: input
        description: Headcount capacity
        constraints: ">= 1"
      - name: hourly_rate_cents
        type: integer
        source: input
        description: Used by meeting rooms; set to 0 for other kinds
        default: 0
      - name: daily_rate_cents
        type: integer
        source: input
        description: Used by workstations for daily-plan pricing; set to 0 for other kinds
        default: 0
      - name: block_rate_cents
        type: integer
        source: input
        description: "Used by event areas; one block = 4 hours; set to 0 for other kinds"
        default: 0
      - name: status
        type: enum
        source: system
        description: Resource availability
        constraints: "AVAILABLE | MAINTENANCE | RETIRED"
        default: "AVAILABLE"

  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - name: tenant_id
        type: string
        source: input
        description: FK to Tenant.id (redundant with member.tenant_id, denormalized for bill consolidation)
      - name: member_id
        type: string
        source: input
        description: FK to Member.id — who made the reservation
      - name: resource_id
        type: string
        source: input
        description: FK to Resource.id
      - name: start_at
        type: datetime
        source: input
        description: "ISO 8601 UTC, inclusive"
      - name: end_at
        type: datetime
        source: input
        description: "ISO 8601 UTC, EXCLUSIVE. Intervals are half-open [start_at, end_at)"
      - name: status
        type: enum
        source: system
        description: Reservation lifecycle
        constraints: "PENDING | CONFIRMED | IN_USE | COMPLETED | CANCELLED | NO_SHOW"
        default: "PENDING"
      - name: provisional_fee_cents
        type: integer
        source: computed
        description: "Fee computed at PENDING → CONFIRMED using `reservation_fee_provisional`"
        default: 0
      - name: final_fee_cents
        type: integer
        source: computed
        description: "Fee computed at IN_USE → COMPLETED using `reservation_fee_final`; differs from provisional_fee_cents when actual_end_at differs from end_at or when the cheaper pricing tier differs retrospectively"
        default: 0
      - name: actual_start_at
        type: datetime
        source: system
        description: "Set when status CONFIRMED → IN_USE via access badge check-in; null otherwise"
        default: null
      - name: actual_end_at
        type: datetime
        source: system
        description: "Set when status IN_USE → COMPLETED via badge check-out OR system sweep on end_at; null otherwise"
        default: null
      - name: bill_id
        type: string
        source: system
        description: "FK to Bill.id once consolidated; null before consolidation"
        default: null

  - name: Visitor
    parent: null
    common_fields: false
    fields:
      - name: host_member_id
        type: string
        source: input
        description: FK to Member.id — who invited the visitor
      - name: tenant_id
        type: string
        source: input
        description: FK to Tenant.id (denormalized from host for bill consolidation)
      - name: visitor_name
        type: string
        source: input
        description: Visitor's full name
      - name: expected_arrival_at
        type: datetime
        source: input
        description: Announced arrival (ISO 8601 UTC)
      - name: expected_departure_at
        type: datetime
        source: input
        description: Announced departure (ISO 8601 UTC)
      - name: actual_arrival_at
        type: datetime
        source: system
        description: Set on CHECK_IN event; null before
        default: null
      - name: actual_departure_at
        type: datetime
        source: system
        description: Set on CHECK_OUT event OR system sweep; null before
        default: null
      - name: status
        type: enum
        source: system
        description: Visitor lifecycle
        constraints: "REGISTERED | CHECKED_IN | CHECKED_OUT | NO_SHOW | REVOKED"
        default: "REGISTERED"
      - name: overstay_fee_cents
        type: integer
        source: computed
        description: "Charged at CHECKED_IN → CHECKED_OUT when actual_departure_at > expected_departure_at; see `visitor_overstay_fee`"
        default: 0
      - name: bill_id
        type: string
        source: system
        description: FK to Bill.id once overstay fee consolidated; null if no fee or not yet consolidated
        default: null

  - name: AccessBadge
    parent: Member
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: FK to Member.id
      - name: badge_serial
        type: string
        source: input
        description: Physical badge serial
        constraints: "unique across all AccessBadges"
      - name: status
        type: enum
        source: system
        description: Badge status — gates check-in events
        constraints: "ACTIVE | SUSPENDED | REVOKED"
        default: "ACTIVE"
      - name: last_used_at
        type: datetime
        source: system
        description: Last successful swipe timestamp
        default: null

  - name: Bill
    parent: null
    common_fields: true
    fields:
      - name: tenant_id
        type: string
        source: input
        description: FK to Tenant.id — one Bill per (tenant, billing_period)
      - name: period_start_date
        type: string
        source: input
        description: Consolidation window start (inclusive, YYYY-MM-DD)
      - name: period_end_date
        type: string
        source: input
        description: Consolidation window end (inclusive, YYYY-MM-DD)
      - name: subtotal_cents
        type: integer
        source: computed
        description: "Sum of (Reservation.final_fee_cents for reservations with status=COMPLETED and bill_id=this.id) plus (Visitor.overstay_fee_cents for visitors with status=CHECKED_OUT and bill_id=this.id) plus any line from Lease termination penalty assigned to this bill"
        default: 0
      - name: tax_cents
        type: integer
        source: computed
        description: "Tax on subtotal_cents; see `bill_tax` (sum-then-round)"
        default: 0
      - name: late_fee_cents
        type: integer
        source: computed
        description: "Accrues after status OVERDUE; see `bill_late_fee`"
        default: 0
      - name: total_due_cents
        type: integer
        source: computed
        description: "subtotal_cents + tax_cents + late_fee_cents"
        default: 0
      - name: status
        type: enum
        source: system
        description: Bill lifecycle
        constraints: "DRAFT | ISSUED | OVERDUE | PAID | VOIDED"
        default: "DRAFT"
      - name: issued_at
        type: datetime
        source: system
        description: Timestamp when DRAFT → ISSUED
        default: null
      - name: due_at
        type: datetime
        source: system
        description: "Set at DRAFT → ISSUED: issued_at + 14 days"
        default: null
      - name: paid_at
        type: datetime
        source: system
        description: Timestamp when ISSUED or OVERDUE → PAID
        default: null

  - name: BillLine
    parent: Bill
    common_fields: false
    fields:
      - name: bill_id
        type: string
        source: input
        description: FK to Bill.id
      - name: line_kind
        type: enum
        source: system
        description: Source of the line
        constraints: "WORKSTATION_FEE | MEETING_ROOM_FEE | EVENT_AREA_FEE | VISITOR_OVERSTAY | TERMINATION_PENALTY | MONTHLY_COMMITMENT"
      - name: source_entity_id
        type: string
        source: system
        description: "Polymorphic FK: Reservation.id | Visitor.id | Lease.id depending on line_kind"
      - name: amount_cents
        type: integer
        source: computed
        description: Per-line amount (already rounded at the source calculation)

concurrency_rules:
  - scenario: "Two members of the same or different tenants attempt to reserve the same Resource over overlapping half-open intervals"
    guarantee: "At most one Reservation exists in {PENDING, CONFIRMED, IN_USE} for a given Resource over any overlapping [start_at, end_at) window; the loser is rejected"
    error_id: ERR_RESERVATION_CONFLICT
    http_status: 409
    serialization: "First-writer-wins on Reservation creation; serialized on resource_id"

  - scenario: "Member triggers badge CHECK_IN on a Reservation while an admin concurrently CANCELs the same Reservation"
    guarantee: "Exactly one transition succeeds; loser observes the terminal state"
    error_id: ERR_INVALID_RESERVATION_STATE
    http_status: 409
    serialization: "First-writer-wins on Reservation.status"

  - scenario: "Tenant PaymentClerk PAYs a Bill while the nightly overdue sweep concurrently transitions the same Bill ISSUED → OVERDUE"
    guarantee: "Exactly one transition succeeds; the loser sees the new status"
    error_id: ERR_INVALID_BILL_STATE
    http_status: 409
    serialization: "First-writer-wins on Bill.status"

  - scenario: "Two admins of the same tenant concurrently submit lease termination requests"
    guarantee: "At most one Lease transitions ACTIVE → TERMINATION_REQUESTED; the loser sees the new state"
    error_id: ERR_INVALID_LEASE_STATE
    http_status: 409
    serialization: "First-writer-wins on Lease.status"

  - scenario: "Host member revokes a Visitor while reception concurrently performs CHECK_IN for that visitor"
    guarantee: "Exactly one transition succeeds; the loser is rejected"
    error_id: ERR_INVALID_VISITOR_STATE
    http_status: 409
    serialization: "First-writer-wins on Visitor.status"

state_machines:
  - entity: Reservation
    initial_state: PENDING
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /shared-office/reservations/{id}/confirm"
        actor: TenantMember
        preconditions:
          - "Reservation.status == PENDING"
          - "Tenant.access_posture == OPEN (not RESTRICTED, not FROZEN)"
          - "Resource.status == AVAILABLE"
          - "Member.status == ACTIVE"
          - "No other Reservation for same resource_id in {CONFIRMED, IN_USE} overlaps [start_at, end_at)"
        side_effects:
          - "Compute provisional_fee_cents via `reservation_fee_provisional`"

      - from: PENDING
        to: CANCELLED
        trigger: "POST /shared-office/reservations/{id}/cancel"
        actor: TenantMember
        preconditions:
          - "Reservation.status == PENDING"
        side_effects: []

      - from: CONFIRMED
        to: IN_USE
        trigger: "POST /shared-office/access-events (kind=CHECK_IN, reservation_id=...)"
        actor: TenantMember
        preconditions:
          - "Reservation.status == CONFIRMED"
          - "AccessBadge.status == ACTIVE for the member"
          - "Tenant.access_posture IN {OPEN, RESTRICTED}"
          - "now() is in [start_at - 15 minutes, end_at)"
        side_effects:
          - "Reservation.actual_start_at := now()"
          - "AccessBadge.last_used_at := now()"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /shared-office/reservations/{id}/cancel"
        actor: TenantMember
        preconditions:
          - "Reservation.status == CONFIRMED"
          - "now() < start_at"
        side_effects:
          - "Reservation.provisional_fee_cents := 0 (refund not yet consolidated)"

      - from: CONFIRMED
        to: NO_SHOW
        trigger: "system (sweep) — now() >= end_at and status still CONFIRMED"
        actor: system
        preconditions:
          - "Reservation.status == CONFIRMED"
          - "now() >= end_at"
        side_effects:
          - "final_fee_cents := provisional_fee_cents (no-show still billed)"
          - "Assign Reservation.bill_id := current DRAFT Bill for (tenant_id, current period); if none exists, create DRAFT Bill first"
          - "Recompute Bill.subtotal_cents / tax_cents / total_due_cents"

      - from: IN_USE
        to: COMPLETED
        trigger: "POST /shared-office/access-events (kind=CHECK_OUT, reservation_id=...) OR system sweep when now() >= end_at"
        actor: TenantMember | system
        preconditions:
          - "Reservation.status == IN_USE"
        side_effects:
          - "Reservation.actual_end_at := now() (if CHECK_OUT) or end_at (if sweep)"
          - "Compute final_fee_cents via `reservation_fee_final`"
          - "Assign Reservation.bill_id := current DRAFT Bill for (tenant_id, current period); if none exists, create DRAFT Bill first"
          - "Recompute Bill.subtotal_cents / tax_cents / total_due_cents"

  - entity: Visitor
    initial_state: REGISTERED
    terminal_states: [CHECKED_OUT, NO_SHOW, REVOKED]
    transitions:
      - from: REGISTERED
        to: CHECKED_IN
        trigger: "POST /shared-office/access-events (kind=VISITOR_CHECK_IN, visitor_id=...)"
        actor: Receptionist
        preconditions:
          - "Visitor.status == REGISTERED"
          - "host Member.status == ACTIVE"
          - "Tenant.access_posture != FROZEN"
          - "now() in [expected_arrival_at - 30 minutes, expected_departure_at + 6 hours]"
        side_effects:
          - "Visitor.actual_arrival_at := now()"

      - from: REGISTERED
        to: NO_SHOW
        trigger: "system (sweep) — now() >= expected_departure_at and status still REGISTERED"
        actor: system
        preconditions:
          - "Visitor.status == REGISTERED"
          - "now() >= expected_departure_at"
        side_effects: []

      - from: REGISTERED
        to: REVOKED
        trigger: "POST /shared-office/visitors/{id}/revoke"
        actor: TenantMember (host) | TenantAdmin
        preconditions:
          - "Visitor.status == REGISTERED"
        side_effects: []

      - from: CHECKED_IN
        to: CHECKED_OUT
        trigger: "POST /shared-office/access-events (kind=VISITOR_CHECK_OUT, visitor_id=...) OR system sweep at expected_departure_at + 6h"
        actor: Receptionist | system
        preconditions:
          - "Visitor.status == CHECKED_IN"
        side_effects:
          - "Visitor.actual_departure_at := now() (or expected_departure_at + 6h on sweep)"
          - "Compute Visitor.overstay_fee_cents via `visitor_overstay_fee`"
          - "If overstay_fee_cents > 0: assign Visitor.bill_id := current DRAFT Bill for (tenant_id, period), create it if missing; recompute Bill totals"

  - entity: Lease
    initial_state: DRAFT
    terminal_states: [TERMINATED, REJECTED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /shared-office/leases/{id}/activate"
        actor: PlatformAdmin
        preconditions:
          - "Lease.status == DRAFT"
          - "Tenant.status == ACTIVE"
          - "term_start_date <= term_end_date"
        side_effects: []

      - from: ACTIVE
        to: TERMINATION_REQUESTED
        trigger: "POST /shared-office/leases/{id}/request-termination"
        actor: TenantAdmin
        preconditions:
          - "Lease.status == ACTIVE"
        side_effects:
          - "Auto-transition all Reservation rows where tenant_id=this.tenant_id AND status IN {PENDING, CONFIRMED} AND start_at > now() → CANCELLED (each such cancel cascades: clear provisional_fee_cents)"

      - from: TERMINATION_REQUESTED
        to: TERMINATION_REVIEWING
        trigger: "POST /shared-office/leases/{id}/begin-review"
        actor: PlatformAdmin
        preconditions:
          - "Lease.status == TERMINATION_REQUESTED"
        side_effects: []

      - from: TERMINATION_REQUESTED
        to: ACTIVE
        trigger: "POST /shared-office/leases/{id}/withdraw-termination"
        actor: TenantAdmin
        preconditions:
          - "Lease.status == TERMINATION_REQUESTED"
        side_effects: []
        note: "Revert loop: termination can be withdrawn before PlatformAdmin takes review; this forms the cycle ACTIVE → TERMINATION_REQUESTED → ACTIVE."

      - from: TERMINATION_REVIEWING
        to: TERMINATED
        trigger: "POST /shared-office/leases/{id}/finalize-termination"
        actor: PlatformAdmin
        preconditions:
          - "Lease.status == TERMINATION_REVIEWING"
          - "PlatformAdmin performing this transition MUST NOT be the same platform user who performed begin-review on this same Lease (segregation of duties)"
        side_effects:
          - "Compute termination_penalty_cents via `lease_termination_penalty`; set termination_effective_date := today()"
          - "Append BillLine(line_kind=TERMINATION_PENALTY, source_entity_id=Lease.id, amount_cents=termination_penalty_cents) to current DRAFT Bill of tenant; create Bill if missing"
          - "Cascade to Tenant: Tenant.status := TERMINATING (triggers recompute of Tenant.access_posture which flips to RESTRICTED if not already)"
          - "Cascade to AccessBadge: for all members of this tenant, AccessBadge.status := SUSPENDED on termination_effective_date (deferred, via sweep)"

      - from: TERMINATION_REVIEWING
        to: REJECTED
        trigger: "POST /shared-office/leases/{id}/reject-termination"
        actor: PlatformAdmin
        preconditions:
          - "Lease.status == TERMINATION_REVIEWING"
        side_effects: []

  - entity: Bill
    initial_state: DRAFT
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /shared-office/bills/{id}/issue"
        actor: BillingOfficer
        preconditions:
          - "Bill.status == DRAFT"
          - "Bill has at least one BillLine"
          - "All Reservations whose bill_id=this.id have status IN {COMPLETED, NO_SHOW}"
        side_effects:
          - "issued_at := now(); due_at := issued_at + 14 days"
          - "Recompute Tenant.outstanding_balance_cents (new Bill enters the sum)"
          - "Recompute Tenant.access_posture: OPEN → RESTRICTED if outstanding_balance_cents >= Tenant.credit_limit_cents"

      - from: ISSUED
        to: OVERDUE
        trigger: "system (sweep) — now() >= due_at and status still ISSUED"
        actor: system
        preconditions:
          - "Bill.status == ISSUED"
          - "now() >= due_at"
        side_effects:
          - "Recompute late_fee_cents via `bill_late_fee`; refresh total_due_cents"
          - "Recompute Tenant.outstanding_balance_cents"
          - "Recompute Tenant.access_posture: RESTRICTED → FROZEN if any Bill of this tenant is OVERDUE for > 30 days"

      - from: ISSUED
        to: PAID
        trigger: "POST /shared-office/bills/{id}/pay"
        actor: PaymentClerk
        preconditions:
          - "Bill.status == ISSUED"
        side_effects:
          - "paid_at := now()"
          - "Recompute Tenant.outstanding_balance_cents"
          - "Recompute Tenant.access_posture"

      - from: OVERDUE
        to: PAID
        trigger: "POST /shared-office/bills/{id}/pay"
        actor: PaymentClerk
        preconditions:
          - "Bill.status == OVERDUE"
        side_effects:
          - "paid_at := now()"
          - "Recompute Tenant.outstanding_balance_cents"
          - "Recompute Tenant.access_posture: FROZEN may relax to RESTRICTED or OPEN"

      - from: DRAFT
        to: VOIDED
        trigger: "POST /shared-office/bills/{id}/void"
        actor: PlatformAdmin
        preconditions:
          - "Bill.status == DRAFT"
        side_effects:
          - "Clear bill_id on all Reservations and Visitors pointing to this Bill (they will be re-consolidated into next DRAFT Bill)"

  - entity: AccessBadge
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /shared-office/access-badges/{id}/suspend OR system sweep on lease termination_effective_date"
        actor: PlatformAdmin | system
        preconditions:
          - "AccessBadge.status == ACTIVE"
        side_effects: []

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /shared-office/access-badges/{id}/reactivate"
        actor: PlatformAdmin
        preconditions:
          - "AccessBadge.status == SUSPENDED"
          - "Tenant.access_posture != FROZEN"
          - "Member.status == ACTIVE"
        side_effects: []

      - from: ACTIVE
        to: REVOKED
        trigger: "POST /shared-office/access-badges/{id}/revoke"
        actor: PlatformAdmin
        preconditions:
          - "AccessBadge.status == ACTIVE"
        side_effects: []

      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /shared-office/access-badges/{id}/revoke"
        actor: PlatformAdmin
        preconditions:
          - "AccessBadge.status == SUSPENDED"
        side_effects: []

calculations:
  - name: reservation_fee_provisional
    trigger: "Reservation.status PENDING → CONFIRMED"
    algorithm: tiered_pricing
    formula: |
      hours = (end_at - start_at).total_seconds() / 3600
      # half-open interval; fractional hours allowed
      IF Resource.kind == MEETING_ROOM:
        units = ceil(hours * 2) / 2       # round up to nearest 0.5 hour
        fee_cents = int(round(units * Resource.hourly_rate_cents))  # rate already in cents; result integer
      ELIF Resource.kind == EVENT_AREA:
        blocks = ceil(hours / 4)          # each block = 4 hours
        is_weekend = (start_at.weekday() in {5, 6}) AND (end_at.weekday() in {5, 6})
        gross = blocks * Resource.block_rate_cents
        fee_cents = gross // 2 if is_weekend else gross   # 50% off on full-weekend bookings
      ELIF Resource.kind == WORKSTATION:
        # Provisional pricing by Lease.billing_plan:
        lease = Lease for Member.tenant_id with status = ACTIVE, latest term_start_date
        IF lease.billing_plan == HOURLY:
          fee_cents = int(round(hours * Resource.hourly_rate_cents))
        ELIF lease.billing_plan == DAILY:
          days = ceil(hours / 8)
          fee_cents = days * Resource.daily_rate_cents
        ELIF lease.billing_plan == MONTHLY:
          # already included in monthly commitment — per-reservation fee is 0
          fee_cents = 0
    input_set: "Reservation at the moment of confirmation; tenant's ACTIVE Lease with the greatest term_start_date (tie-break: greatest Lease.id lexicographically)"
    constants:
      MEETING_ROOM_ROUND_UNIT_HOURS: 0.5
      WORKSTATION_DAILY_HOURS_PER_DAY: 8
      EVENT_AREA_BLOCK_HOURS: 4
      EVENT_AREA_WEEKEND_DISCOUNT: 0.5
    precision: "Integer cents; Python `round` (banker's rounding) on computed floats, BUT rates are already in cents so multiplication + ceil keeps results integral except for workstation HOURLY where half-cents are rounded half-up"

  - name: reservation_fee_final
    trigger: "Reservation.status IN_USE → COMPLETED (via CHECK_OUT or sweep) and also PENDING|CONFIRMED → NO_SHOW"
    algorithm: tiered_pricing
    formula: |
      # NO_SHOW branch:
      IF transition is into NO_SHOW:
        final_fee_cents = provisional_fee_cents
        RETURN
      # COMPLETED branch:
      billable_start = max(start_at, actual_start_at)
      billable_end   = min(end_at, actual_end_at) if Resource.kind != WORKSTATION else actual_end_at
      # For WORKSTATION and MEETING_ROOM, early check-out reduces hours; late check-out (past end_at) is capped at end_at.
      # For EVENT_AREA, blocks are pre-committed and not refundable.
      hours_actual = max(0, (billable_end - billable_start).total_seconds() / 3600)
      IF Resource.kind == MEETING_ROOM:
        units = ceil(hours_actual * 2) / 2
        final_fee_cents = int(round(units * Resource.hourly_rate_cents))
      ELIF Resource.kind == EVENT_AREA:
        final_fee_cents = provisional_fee_cents        # not reduced
      ELIF Resource.kind == WORKSTATION:
        lease = same as in reservation_fee_provisional
        IF lease.billing_plan == MONTHLY:
          final_fee_cents = 0
        ELSE:
          hourly_cost = int(round(hours_actual * Resource.hourly_rate_cents))
          days_used  = ceil(hours_actual / 8)
          daily_cost = days_used * Resource.daily_rate_cents
          # RETROSPECTIVE pick-cheaper — may differ from provisional tier
          final_fee_cents = min(hourly_cost, daily_cost)
          # Tie-break when hourly_cost == daily_cost: pick HOURLY (record as final_plan_used = HOURLY)
    input_set: "Single Reservation at completion; Lease resolved identically to provisional calc"
    constants:
      WORKSTATION_DAILY_HOURS_PER_DAY: 8
    precision: "Integer cents; rounding order: compute hours_actual → multiply → round_half_up → int; no per-minute rounding"
    variants:
      - name: provisional_vs_final
        when: "Workstation reservations where actual_end_at < end_at (early departure) or where the cheaper tier retrospectively flips"
        difference: "Provisional picks the tier at confirmation using booked hours; Final picks the cheaper of (hourly_cost using actual hours, daily_cost using ceil(actual_hours / 8)). The two can disagree: a member books 8 hours (daily is cheaper 50.00 vs hourly 64.00) but leaves after 5 hours (final hourly 40.00 beats daily 50.00)."

  - name: visitor_overstay_fee
    trigger: "Visitor.status CHECKED_IN → CHECKED_OUT"
    algorithm: threshold
    formula: |
      overstay_seconds = max(0, (actual_departure_at - expected_departure_at).total_seconds())
      overstay_minutes = overstay_seconds / 60
      IF overstay_minutes <= 0:
        overstay_fee_cents = 0
      ELSE:
        units = ceil(overstay_minutes / 30)              # every 30 minutes rounded up
        overstay_fee_cents = units * OVERSTAY_RATE_CENTS_PER_30MIN
    input_set: "Single Visitor at check-out"
    constants:
      OVERSTAY_RATE_CENTS_PER_30MIN: 500    # 5.00 per 30-minute block
    precision: "Integer cents, no fractional handling (rate and blocks are integer)"

  - name: lease_termination_penalty
    trigger: "Lease.status TERMINATION_REVIEWING → TERMINATED"
    algorithm: threshold
    formula: |
      remaining_full_months = max(0, floor_months_between(termination_effective_date, Lease.term_end_date))
      # where termination_effective_date = today() at finalize-termination time,
      # and floor_months_between counts full calendar-month boundaries strictly after termination_effective_date
      # up to and including Lease.term_end_date.
      IF Lease.billing_plan == MONTHLY:
        termination_penalty_cents = int(round(remaining_full_months * Lease.monthly_rate_cents * PENALTY_FACTOR))
      ELSE:
        termination_penalty_cents = 0
    input_set: "Single Lease at finalize-termination time"
    constants:
      PENALTY_FACTOR: 0.3
    precision: "Integer cents, round_half_up on the final product"

  - name: bill_tax
    trigger: "Any event that mutates Bill.subtotal_cents (reservation completion, visitor overstay, lease termination penalty); Bill issue"
    algorithm: aggregation
    formula: |
      # Sum-then-round: tax is computed on the summed subtotal, NOT per-line.
      tax_cents = int(round(Bill.subtotal_cents * TAX_RATE))
      # Where subtotal_cents is the sum of BillLine.amount_cents for this Bill.
      # BillLine.amount_cents was already rounded at the SOURCE calculation (reservation_fee_final, visitor_overstay_fee, lease_termination_penalty, monthly_commitment).
      # Evaluation order is pinned: per-line amounts are rounded by their source calc; tax is applied ONCE to their sum.
    input_set: "All BillLine rows with bill_id = this.id"
    constants:
      TAX_RATE: 0.0825
    precision: "Integer cents, round_half_up"
    variants:
      - name: per_line_vs_sum_then_round
        when: "Per-line tax calculation would produce different cents than sum-then-round"
        difference: "The scaffold PINS sum-then-round; implementations that compute tax per line and sum will differ by 1¢ on bills whose per-line amounts have specific fractional shapes."

  - name: bill_late_fee
    trigger: "Bill.status ISSUED → OVERDUE, and each subsequent weekly sweep after due_at while status == OVERDUE"
    algorithm: decay_function
    formula: |
      weeks_past_due = floor((now() - due_at).total_seconds() / (7 * 24 * 3600))
      # Late fee is computed on (subtotal_cents + tax_cents), NOT on the previous late_fee_cents (no compounding)
      principal = Bill.subtotal_cents + Bill.tax_cents
      late_fee_cents = int(round(principal * LATE_FEE_RATE_PER_WEEK * weeks_past_due))
      # Re-written (not additive) on each weekly sweep; total_due_cents = subtotal + tax + late_fee
    input_set: "Single Bill; now() from current clock"
    constants:
      LATE_FEE_RATE_PER_WEEK: 0.015
    precision: "Integer cents, round_half_up on the final product"
    variants:
      - name: full_week_threshold
        when: "Bill crosses exactly the 7-day mark past due_at"
        difference: "weeks_past_due uses strict floor; 6 days 23 hours ⇒ 0 weeks ⇒ late_fee 0. 7 days 0 hours ⇒ 1 week ⇒ late_fee charged."

  - name: tenant_access_posture
    trigger: "Any mutation of Tenant.outstanding_balance_cents, any Bill.status change, Lease termination finalization"
    algorithm: constraint_propagation
    formula: |
      any_overdue_30d = EXISTS Bill with tenant_id=this.id AND status=OVERDUE AND (now() - due_at) > 30 days
      IF Tenant.status == CLOSED:
        posture = FROZEN
      ELIF Lease.status == TERMINATION_REVIEWING for any lease of this tenant:
        posture = RESTRICTED
      ELIF Tenant.status == TERMINATING:
        posture = RESTRICTED
      ELIF any_overdue_30d:
        posture = FROZEN
      ELIF outstanding_balance_cents >= credit_limit_cents:
        posture = RESTRICTED
      ELSE:
        posture = OPEN
    input_set: "All Bills and Leases of this tenant"
    constants:
      OVERDUE_FROZEN_DAYS: 30
    precision: "Enum, deterministic evaluation by the above if/elif ladder (order matters)"

validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_MISSING_AUTH
    http_status: 401
    applies_to: "all except GET /shared-office/health"

  - priority: 2
    category: auth
    check: "X-User-Role value is one of the declared roles"
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: "all"

  - priority: 3
    category: auth
    check: "Role is permitted to call this endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all mutating endpoints"

  - priority: 4
    category: existence
    check: "Path parameters resolve to existing resources left-to-right (tenant → lease → reservation)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 5
    category: existence
    check: "Body-level FKs (tenant_id, member_id, resource_id, host_member_id, bill_id) reference existing rows"
    error_id: ERR_REFERENCED_ENTITY_MISSING
    http_status: 404
    applies_to: "POST/PATCH endpoints with FK fields"

  - priority: 6
    category: state
    check: "Optimistic concurrency: `version` in body (if provided) matches current version on target row"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all PATCH and action endpoints on versioned entities"

  - priority: 7
    category: state
    check: "Reservation is in a state from which the requested transition is allowed (per §1.2 Reservation state machine)"
    error_id: ERR_INVALID_RESERVATION_STATE
    http_status: 409
    applies_to: "reservation action endpoints"

  - priority: 8
    category: state
    check: "Bill is in a state from which the requested transition is allowed"
    error_id: ERR_INVALID_BILL_STATE
    http_status: 409
    applies_to: "bill action endpoints"

  - priority: 9
    category: state
    check: "Lease is in a state from which the requested transition is allowed"
    error_id: ERR_INVALID_LEASE_STATE
    http_status: 409
    applies_to: "lease action endpoints"

  - priority: 10
    category: state
    check: "Visitor is in a state from which the requested transition is allowed"
    error_id: ERR_INVALID_VISITOR_STATE
    http_status: 409
    applies_to: "visitor action endpoints"

  - priority: 11
    category: business_safety
    check: "Segregation of duties: for Lease.finalize-termination, the acting PlatformAdmin.X-User-ID MUST NOT equal the X-User-ID that performed begin-review on the same Lease"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /leases/{id}/finalize-termination"

  - priority: 12
    category: business_safety
    check: "Tenant.access_posture must allow the requested operation: CONFIRM reservation requires OPEN; CHECK_IN reservation requires OPEN or RESTRICTED; VISITOR_CHECK_IN requires not FROZEN"
    error_id: ERR_ACCESS_POSTURE_DENIES
    http_status: 422
    applies_to: "reservation confirm, access-events with kind in {CHECK_IN, VISITOR_CHECK_IN}"

  - priority: 13
    category: business_referential
    check: "Reservation member_id belongs to a Member whose tenant_id matches the Reservation.tenant_id; host_member_id on Visitor belongs to same tenant_id"
    error_id: ERR_TENANT_MISMATCH
    http_status: 422
    applies_to: "reservation creation, visitor registration"

  - priority: 14
    category: business_temporal
    check: "Reservation start_at < end_at, both on integer-minute boundaries, both within [now() - 1 hour, now() + 180 days]"
    error_id: ERR_INVALID_TIME_WINDOW
    http_status: 422
    applies_to: "reservation creation"

  - priority: 15
    category: business_temporal
    check: "Reservation [start_at, end_at) does not overlap any existing Reservation for the same resource_id in states {PENDING, CONFIRMED, IN_USE}. Half-open: R1=[09:00,11:00), R2=[11:00,13:00) do NOT conflict."
    error_id: ERR_RESERVATION_CONFLICT
    http_status: 409
    applies_to: "reservation creation"

  - priority: 16
    category: business_constraint
    check: "Event-area reservation duration must be an exact multiple of EVENT_AREA_BLOCK_HOURS (4h). Meeting-room duration must be a multiple of 0.5h. Workstation duration must be a multiple of 1h."
    error_id: ERR_RESERVATION_GRANULARITY
    http_status: 422
    applies_to: "reservation creation"

  - priority: 17
    category: business_constraint
    check: "Resource.capacity >= requested headcount (defaults to 1 when omitted)"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "reservation creation"

  - priority: 18
    category: business_referential
    check: "For `finalize-termination`: all Reservations of this tenant with status IN {PENDING, CONFIRMED, IN_USE} must be cancelled or completed first"
    error_id: ERR_HAS_OPEN_RESERVATIONS
    http_status: 422
    applies_to: "POST /leases/{id}/finalize-termination"

  - priority: 19
    category: business_fiscal
    check: "For `finalize-termination`: all Bills of this tenant with status IN {DRAFT} must be issued or voided first"
    error_id: ERR_HAS_DRAFT_BILLS
    http_status: 422
    applies_to: "POST /leases/{id}/finalize-termination"

  - priority: 20
    category: business_fiscal
    check: "Bill.issue requires Bill has at least one BillLine (subtotal_cents > 0)"
    error_id: ERR_EMPTY_BILL
    http_status: 422
    applies_to: "POST /bills/{id}/issue"

  - priority: 21
    category: business_fiscal
    check: "Issue Bill requires all Reservations whose bill_id = this.id are in {COMPLETED, NO_SHOW}"
    error_id: ERR_BILL_HAS_OPEN_RESERVATIONS
    http_status: 422
    applies_to: "POST /bills/{id}/issue"

  - priority: 22
    category: business_constraint
    check: "Visitor expected_arrival_at < expected_departure_at, span <= 24 hours"
    error_id: ERR_INVALID_VISITOR_WINDOW
    http_status: 422
    applies_to: "POST /visitors"

  - priority: 23
    category: business_constraint
    check: "Pagination limit within [1, 100]; offset >= 0"
    error_id: ERR_PAGINATION_OUT_OF_RANGE
    http_status: 400
    applies_to: "GET list endpoints"

endpoints:
  - method: GET
    path: "/shared-office/health"
    description: "Health check"
    roles: [PlatformAdmin, TenantAdmin, TenantMember, BillingOfficer, PaymentClerk, Receptionist]
    code: 200
    input: []
    output: "{status: 'ok'}"
    side_effects: []

  - method: POST
    path: "/shared-office/_clock/advance"
    description: "Test-driving clock advance. Advances the virtual clock to the given ISO 8601 UTC timestamp. Does NOT run sweeps on its own — sweeps must be invoked separately via /_sweep/run."
    roles: [PlatformAdmin]
    code: 200
    input: [to_timestamp]
    output: "{now: datetime}"
    side_effects: []

  - method: POST
    path: "/shared-office/_sweep/run"
    description: "Test-driving sweep. Executes in order: (1) CONFIRMED reservations whose end_at <= now() → NO_SHOW if not checked in, else COMPLETED; (2) CHECKED_IN visitors past expected_departure_at + 6h → CHECKED_OUT (compute overstay); (3) REGISTERED visitors past expected_departure_at → NO_SHOW; (4) ISSUED bills past due_at → OVERDUE (compute late_fee); (5) OVERDUE bills: recompute late_fee weekly; (6) recompute Tenant.outstanding_balance_cents and Tenant.access_posture."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: "{swept_count: int}"
    side_effects:
      - "Reservation sweep transitions"
      - "Visitor sweep transitions"
      - "Bill sweep transitions"
      - "AccessBadge suspend on lease termination_effective_date"
      - "Recompute Tenant.outstanding_balance_cents and Tenant.access_posture"

  - method: POST
    path: "/shared-office/tenants"
    description: "Create a Tenant (company that will occupy the shared space)"
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, "credit_limit_cents?"]
    output: Tenant
    side_effects: []

  - method: GET
    path: "/shared-office/tenants/{tenantId}"
    description: "Fetch a Tenant (includes computed outstanding_balance_cents and access_posture)"
    roles: [PlatformAdmin, TenantAdmin, BillingOfficer]
    code: 200
    input: []
    output: Tenant
    side_effects: []

  - method: GET
    path: "/shared-office/tenants"
    description: "List tenants"
    roles: [PlatformAdmin, BillingOfficer]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Tenant[]
    side_effects: []

  - method: POST
    path: "/shared-office/leases"
    description: "Draft a lease"
    roles: [PlatformAdmin]
    code: 201
    input: [tenant_id, billing_plan, "monthly_rate_cents?", term_start_date, term_end_date]
    output: Lease
    side_effects: []

  - method: POST
    path: "/shared-office/leases/{leaseId}/activate"
    description: "Activate a draft lease"
    roles: [PlatformAdmin]
    code: 200
    input: ["version?"]
    output: Lease
    side_effects:
      - "Lease.status DRAFT → ACTIVE"

  - method: POST
    path: "/shared-office/leases/{leaseId}/request-termination"
    description: "Tenant admin requests early termination"
    roles: [TenantAdmin]
    code: 200
    input: ["version?"]
    output: Lease
    side_effects:
      - "Lease.status ACTIVE → TERMINATION_REQUESTED"
      - "Cascade-cancel future Reservations (status IN {PENDING, CONFIRMED} AND start_at > now())"

  - method: POST
    path: "/shared-office/leases/{leaseId}/withdraw-termination"
    description: "Tenant admin withdraws a pending termination request (cycle back to ACTIVE)"
    roles: [TenantAdmin]
    code: 200
    input: ["version?"]
    output: Lease
    side_effects:
      - "Lease.status TERMINATION_REQUESTED → ACTIVE"

  - method: POST
    path: "/shared-office/leases/{leaseId}/begin-review"
    description: "Platform admin begins reviewing termination (records X-User-ID as reviewer_user_id)"
    roles: [PlatformAdmin]
    code: 200
    input: ["version?"]
    output: Lease
    side_effects:
      - "Lease.status TERMINATION_REQUESTED → TERMINATION_REVIEWING"

  - method: POST
    path: "/shared-office/leases/{leaseId}/finalize-termination"
    description: "Platform admin finalizes termination (segregation of duties: must differ from reviewer_user_id)"
    roles: [PlatformAdmin]
    code: 200
    input: ["version?"]
    output: Lease
    side_effects:
      - "Lease.status TERMINATION_REVIEWING → TERMINATED"
      - "Compute termination_penalty_cents (cascading into BillLine and Tenant.outstanding_balance_cents at the next bill issue)"
      - "Tenant.status → TERMINATING; Tenant.access_posture recompute"

  - method: POST
    path: "/shared-office/leases/{leaseId}/reject-termination"
    description: "Platform admin rejects termination"
    roles: [PlatformAdmin]
    code: 200
    input: ["version?"]
    output: Lease
    side_effects:
      - "Lease.status TERMINATION_REVIEWING → REJECTED"

  - method: GET
    path: "/shared-office/leases/{leaseId}"
    description: "Fetch a lease"
    roles: [PlatformAdmin, TenantAdmin]
    code: 200
    input: []
    output: Lease
    side_effects: []

  - method: POST
    path: "/shared-office/members"
    description: "Create a member under a tenant"
    roles: [PlatformAdmin, TenantAdmin]
    code: 201
    input: [tenant_id, email, full_name, "role_in_tenant?"]
    output: Member
    side_effects: []

  - method: GET
    path: "/shared-office/members/{memberId}"
    description: "Fetch a member"
    roles: [PlatformAdmin, TenantAdmin, TenantMember]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: POST
    path: "/shared-office/resources"
    description: "Register a bookable resource (workstation, meeting room, event area)"
    roles: [PlatformAdmin]
    code: 201
    input: [kind, code, capacity, "hourly_rate_cents?", "daily_rate_cents?", "block_rate_cents?"]
    output: Resource
    side_effects: []

  - method: GET
    path: "/shared-office/resources"
    description: "List resources"
    roles: [PlatformAdmin, TenantAdmin, TenantMember]
    code: 200
    input: ["limit?", "offset?", "kind?", "status?"]
    output: Resource[]
    side_effects: []

  - method: POST
    path: "/shared-office/reservations"
    description: "Create a reservation (enters PENDING)"
    roles: [TenantMember, TenantAdmin]
    code: 201
    input: [tenant_id, member_id, resource_id, start_at, end_at]
    output: Reservation
    side_effects: []

  - method: POST
    path: "/shared-office/reservations/{reservationId}/confirm"
    description: "Confirm a PENDING reservation (computes provisional_fee_cents)"
    roles: [TenantMember, TenantAdmin]
    code: 200
    input: ["version?"]
    output: Reservation
    side_effects:
      - "Reservation.status PENDING → CONFIRMED"
      - "Reservation.provisional_fee_cents := `reservation_fee_provisional`"

  - method: POST
    path: "/shared-office/reservations/{reservationId}/cancel"
    description: "Cancel a reservation (allowed from PENDING or CONFIRMED pre-start)"
    roles: [TenantMember, TenantAdmin]
    code: 200
    input: ["version?"]
    output: Reservation
    side_effects:
      - "Reservation.status → CANCELLED"

  - method: GET
    path: "/shared-office/reservations/{reservationId}"
    description: "Fetch a reservation"
    roles: [PlatformAdmin, TenantAdmin, TenantMember]
    code: 200
    input: []
    output: Reservation
    side_effects: []

  - method: GET
    path: "/shared-office/reservations"
    description: "List reservations with filters"
    roles: [PlatformAdmin, TenantAdmin, TenantMember, BillingOfficer]
    code: 200
    input: ["limit?", "offset?", "tenant_id?", "resource_id?", "status?", "start_after?", "start_before?"]
    output: Reservation[]
    side_effects: []

  - method: POST
    path: "/shared-office/visitors"
    description: "Register a visitor"
    roles: [TenantMember, TenantAdmin]
    code: 201
    input: [host_member_id, visitor_name, expected_arrival_at, expected_departure_at]
    output: Visitor
    side_effects: []

  - method: POST
    path: "/shared-office/visitors/{visitorId}/revoke"
    description: "Revoke a registered visitor before check-in"
    roles: [TenantMember, TenantAdmin]
    code: 200
    input: ["version?"]
    output: Visitor
    side_effects:
      - "Visitor.status REGISTERED → REVOKED"

  - method: GET
    path: "/shared-office/visitors/{visitorId}"
    description: "Fetch a visitor"
    roles: [PlatformAdmin, TenantAdmin, TenantMember, Receptionist]
    code: 200
    input: []
    output: Visitor
    side_effects: []

  - method: POST
    path: "/shared-office/access-badges"
    description: "Issue an access badge to a member"
    roles: [PlatformAdmin]
    code: 201
    input: [member_id, badge_serial]
    output: AccessBadge
    side_effects: []

  - method: POST
    path: "/shared-office/access-badges/{badgeId}/suspend"
    description: "Suspend an active badge"
    roles: [PlatformAdmin]
    code: 200
    input: ["version?"]
    output: AccessBadge
    side_effects:
      - "AccessBadge.status ACTIVE → SUSPENDED"

  - method: POST
    path: "/shared-office/access-badges/{badgeId}/reactivate"
    description: "Reactivate a suspended badge (only allowed if Tenant.access_posture != FROZEN)"
    roles: [PlatformAdmin]
    code: 200
    input: ["version?"]
    output: AccessBadge
    side_effects:
      - "AccessBadge.status SUSPENDED → ACTIVE"

  - method: POST
    path: "/shared-office/access-badges/{badgeId}/revoke"
    description: "Revoke a badge (terminal)"
    roles: [PlatformAdmin]
    code: 200
    input: ["version?"]
    output: AccessBadge
    side_effects:
      - "AccessBadge.status {ACTIVE, SUSPENDED} → REVOKED"

  - method: POST
    path: "/shared-office/access-events"
    description: "Record an access event — drives CHECK_IN / CHECK_OUT on Reservations and Visitors"
    roles: [TenantMember, TenantAdmin, Receptionist]
    code: 201
    input: [kind, "reservation_id?", "visitor_id?", "badge_id?"]
    output: "{event_id, accepted: bool, reason?: string}"
    side_effects:
      - "For kind=CHECK_IN: Reservation CONFIRMED → IN_USE; AccessBadge.last_used_at updated"
      - "For kind=CHECK_OUT: Reservation IN_USE → COMPLETED; compute final_fee_cents; consolidate BillLine"
      - "For kind=VISITOR_CHECK_IN: Visitor REGISTERED → CHECKED_IN"
      - "For kind=VISITOR_CHECK_OUT: Visitor CHECKED_IN → CHECKED_OUT; compute overstay_fee_cents; consolidate BillLine if fee > 0"

  - method: POST
    path: "/shared-office/bills/{billId}/issue"
    description: "Billing officer issues a DRAFT bill (sets issued_at, due_at); triggers posture recompute"
    roles: [BillingOfficer]
    code: 200
    input: ["version?"]
    output: Bill
    side_effects:
      - "Bill.status DRAFT → ISSUED"
      - "Recompute Tenant.outstanding_balance_cents and access_posture"

  - method: POST
    path: "/shared-office/bills/{billId}/pay"
    description: "Payment clerk marks bill paid"
    roles: [PaymentClerk]
    code: 200
    input: ["version?"]
    output: Bill
    side_effects:
      - "Bill.status {ISSUED, OVERDUE} → PAID"
      - "Recompute Tenant.outstanding_balance_cents and access_posture"

  - method: POST
    path: "/shared-office/bills/{billId}/void"
    description: "Platform admin voids a DRAFT bill"
    roles: [PlatformAdmin]
    code: 200
    input: ["version?"]
    output: Bill
    side_effects:
      - "Bill.status DRAFT → VOIDED"
      - "Clear bill_id on all Reservations and Visitors linked to this Bill"

  - method: GET
    path: "/shared-office/bills/{billId}"
    description: "Fetch a bill (includes BillLines, computed subtotal/tax/late_fee/total_due)"
    roles: [PlatformAdmin, TenantAdmin, BillingOfficer, PaymentClerk]
    code: 200
    input: []
    output: "Bill including lines[]"
    side_effects: []

  - method: GET
    path: "/shared-office/bills"
    description: "List bills with filters"
    roles: [PlatformAdmin, TenantAdmin, BillingOfficer, PaymentClerk]
    code: 200
    input: ["limit?", "offset?", "tenant_id?", "status?"]
    output: Bill[]
    side_effects: []

errors:
  - id: ERR_MISSING_AUTH
    http: 401
    condition: "X-User-ID or X-User-Role header missing/empty"
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role value not in declared role list"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role is not permitted to perform this operation"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-parameter resource does not exist"
  - id: ERR_REFERENCED_ENTITY_MISSING
    http: 404
    condition: "Body-level FK references a non-existent row"
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "Body `version` does not match current row version"
  - id: ERR_RESERVATION_CONFLICT
    http: 409
    condition: "Proposed reservation [start_at, end_at) overlaps an existing non-terminal reservation on the same resource"
  - id: ERR_INVALID_RESERVATION_STATE
    http: 409
    condition: "Reservation not in an allowed from-state for the requested transition"
  - id: ERR_INVALID_BILL_STATE
    http: 409
    condition: "Bill not in an allowed from-state for the requested transition"
  - id: ERR_INVALID_LEASE_STATE
    http: 409
    condition: "Lease not in an allowed from-state for the requested transition"
  - id: ERR_INVALID_VISITOR_STATE
    http: 409
    condition: "Visitor not in an allowed from-state for the requested transition"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 422
    condition: "Same user attempted both begin-review and finalize-termination on same Lease"
  - id: ERR_ACCESS_POSTURE_DENIES
    http: 422
    condition: "Tenant.access_posture denies the requested operation"
  - id: ERR_TENANT_MISMATCH
    http: 422
    condition: "member_id or host_member_id does not belong to the named tenant_id"
  - id: ERR_INVALID_TIME_WINDOW
    http: 422
    condition: "Reservation start_at/end_at fails validation (ordering, granularity-minute, horizon)"
  - id: ERR_RESERVATION_GRANULARITY
    http: 422
    condition: "Reservation duration does not match resource-kind granularity (0.5h/1h/4h)"
  - id: ERR_CAPACITY_EXCEEDED
    http: 422
    condition: "Requested headcount exceeds Resource.capacity"
  - id: ERR_HAS_OPEN_RESERVATIONS
    http: 422
    condition: "Lease finalization blocked: tenant still has reservations in {PENDING, CONFIRMED, IN_USE}"
  - id: ERR_HAS_DRAFT_BILLS
    http: 422
    condition: "Lease finalization blocked: tenant still has DRAFT bills"
  - id: ERR_EMPTY_BILL
    http: 422
    condition: "Attempt to issue a bill with no lines"
  - id: ERR_BILL_HAS_OPEN_RESERVATIONS
    http: 422
    condition: "Attempt to issue a bill while some of its Reservations are not in {COMPLETED, NO_SHOW}"
  - id: ERR_INVALID_VISITOR_WINDOW
    http: 422
    condition: "Visitor expected_arrival_at / expected_departure_at fails validation"
  - id: ERR_PAGINATION_OUT_OF_RANGE
    http: 400
    condition: "limit outside [1, 100] or offset < 0"

roles:
  - name: PlatformAdmin
    description: "Shared-office platform operator — provisions tenants, leases, resources, badges; finalizes lease termination; runs clock/sweep in tests"
    identity: "opaque"
    exclusive_operations:
      - "POST /tenants"
      - "POST /leases"
      - "POST /leases/{id}/activate"
      - "POST /leases/{id}/begin-review"
      - "POST /leases/{id}/finalize-termination"
      - "POST /leases/{id}/reject-termination"
      - "POST /resources"
      - "POST /access-badges"
      - "POST /access-badges/{id}/suspend"
      - "POST /access-badges/{id}/reactivate"
      - "POST /access-badges/{id}/revoke"
      - "POST /bills/{id}/void"
      - "POST /_clock/advance"
      - "POST /_sweep/run"
    shared_operations:
      - "GET on any resource"

  - name: TenantAdmin
    description: "Tenant-side administrator — manages members, initiates/withdraws lease termination, reserves and cancels resources for the tenant"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /leases/{id}/request-termination"
      - "POST /leases/{id}/withdraw-termination"
    shared_operations:
      - "POST /members (for own tenant)"
      - "POST /reservations (as creating member of own tenant)"
      - "POST /reservations/{id}/confirm"
      - "POST /reservations/{id}/cancel"
      - "POST /visitors (as host of own tenant)"
      - "POST /visitors/{id}/revoke"
      - "GET tenant-scoped resources"

  - name: TenantMember
    description: "Regular tenant employee — makes reservations, registers visitors, triggers access events via own badge"
    identity: "entity_backed:Member"
    exclusive_operations: []
    shared_operations:
      - "POST /reservations (for self)"
      - "POST /reservations/{id}/confirm (for own reservations)"
      - "POST /reservations/{id}/cancel (for own reservations)"
      - "POST /visitors (as own host)"
      - "POST /visitors/{id}/revoke (for own-hosted visitors)"
      - "POST /access-events (CHECK_IN / CHECK_OUT via own badge)"

  - name: Receptionist
    description: "Front-desk role operating visitor check-ins/check-outs"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /access-events (VISITOR_CHECK_IN / VISITOR_CHECK_OUT)"
      - "GET /visitors/{id}"

  - name: BillingOfficer
    description: "Consolidates and issues bills"
    identity: "opaque"
    exclusive_operations:
      - "POST /bills/{id}/issue"
    shared_operations:
      - "GET /bills, /bills/{id}, /tenants, /reservations"

  - name: PaymentClerk
    description: "Records payment on issued/overdue bills (segregated from BillingOfficer to enforce duties)"
    identity: "opaque"
    exclusive_operations:
      - "POST /bills/{id}/pay"
    shared_operations:
      - "GET /bills, /bills/{id}"
