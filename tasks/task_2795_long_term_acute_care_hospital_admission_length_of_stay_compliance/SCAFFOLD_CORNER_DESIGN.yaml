            - "period_total1 == 1512000 and period_count1 == 1 - Dev's DRAFT is still excluded"
            - "det471_status2 == VOIDED, period_total2 == 0 and period_count2 == 0 - the subtract side filters identically"
            - "stay471_pay == PENDING and stay471_pct == null after the void"
            - "GET /ltch/stays/${stay472_id}/payment-determinations with status FINAL returns 0 items throughout"

      - name: tiered_pricing_of_the_short_stay_outlier_candidate_set
        claim_type: tiered_pricing
        grounds:
          - calculations.stay_payment_determination
          - entities.PaymentDetermination.base_payment_cents
        excluded_because:
          difficulty_instance: combinatorial_formula / sso_nested_min_of_three_candidates_selects_ipps_full
          rationale: "The tiering in this scaffold is the short-stay-outlier candidate set - full standard amount versus 120 percent of the IPPS comparable per diem times covered LOS versus the IPPS comparable full amount - and that instance walks all three candidates on one stay, showing which tier wins and why the other two lose. Its sibling boundary instance (boundary_precision_check / sso_threshold_at_25_days_versus_26_days) covers the straddle at the tier boundary, so the marginal-versus-average angle would only re-run the same arithmetic here."

      - name: interval_merge_adjacency_of_a_stay_interval
        claim_type: interval_merge
        grounds:
          - calculations.covered_los_days
        excluded_because:
          difficulty_instance: resource_temporal_overlap / patient_occupancy_is_half_open_at_the_discharge_instant
          rationale: "Adjacency with gap 0 - a new stay starting exactly at the previous discharge instant - is asserted there in both directions (one second earlier overlaps, the same instant does not)."

      - name: weighted_scoring_weights_and_bands_of_the_denial_risk_score
        claim_type: weighted_scoring
        grounds:
          - calculations.denial_risk_score
        excluded_because:
          difficulty_instance: dual_variant_calc / denial_risk_as_documented_vs_query_adjusted_band_drop
          rationale: "The weight sum, the answered-query credit and the resulting band change are all asserted as literals in that instance."

      - name: variant_divergence_of_the_two_payment_systems
        claim_type: variant_divergence
        grounds:
          - calculations.stay_payment_determination
        excluded_because:
          difficulty_instance: dual_variant_calc / payment_variant_standard_vs_site_neutral_on_one_determination
          rationale: "Both variant amounts on one determination row, and their non-equality, are asserted there."

      - name: reconciliation_of_the_ledger_when_a_determination_is_repriced
        claim_type: reconciliation
        grounds:
          - calculations.period_payment_rollup
        excluded_because:
          difficulty_instance: compensating_invariant / void_reprice_refinalize_leaves_the_period_ledger_undrifted
          rationale: "The void-then-reprice delta and its effect on the period ledger are the subject of that instance, closed out by a period close that would fail on any drift."

  - section: validations
    instances:
      - name: discharge_into_a_closed_period_returns_period_closed
        claim_type: violation_to_error
        grounds:
          - validations.priority_7
          - errors.ERR_PERIOD_CLOSED
        distinguishing_aspect: "Priority 7 is checked against the period the stay already owns, so closing the period underneath an ADMITTED stay - legal, because an ADMITTED stay holds no DRAFT determination - turns its later discharge into ERR_PERIOD_CLOSED (409) rather than any clinical error."
        test_recipe:
          setup:
            - "OPEN period FY2027, ACTIVE criteria set CS-2026A, DRG 207."
            - "Patient Eli Shut is admitted at the default clock 2026-08-01, then the period is closed while the stay is still ADMITTED."
