      - name: institution_recertification_cycle
        grounds:
          - state_machines.PartnerInstitution.CERTIFIED_to_SUSPENDED
          - state_machines.PartnerInstitution.SUSPENDED_to_CERTIFIED
          - state_machines.PartnerInstitution.CERTIFIED_to_LAPSED
          - state_machines.PartnerInstitution.LAPSED_to_UNDER_REVIEW
        distinguishing_aspect: |
          Cyclic machine on PartnerInstitution: CERTIFIED -> SUSPENDED -> CERTIFIED -> LAPSED
          -> UNDER_REVIEW -> CERTIFIED; cycle driven by three different trigger kinds (admin
          action, clock epoch, review lifecycle) — distinct entity from BarrierCase.
        test_recipe:
          setup:
            - "Institution CERTIFIED at clock 2026-05-01 (expires 2028-05-01)"
          setup_api_calls:
            - { call: "POST /api/account-standards", payload: { code: "BO-2026", name: "Bank On 2026", effective_from: "2026-01-01", monthly_fee_cap_cents: 500, overdraft_fee_allowed: false, min_opening_deposit_cap_cents: 2500, accepted_alt_id_types: ["MATRICULA_CONSULAR"], chex_second_look_required: true, requires_financial_education: false, rubric_mode: "STANDARD_RUBRIC" }, as: CoalitionAdmin, captures: { std_id: $.data.id } }
