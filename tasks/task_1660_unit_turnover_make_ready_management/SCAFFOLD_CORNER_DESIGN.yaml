            - "error_id == ERR_UNAUTHORIZED (http 403)"

      - name: coordinator_cannot_inspect
        claim_type: rbac_denial
        grounds: [roles, endpoints]
        distinguishing_aspect: "Inspection submission is Inspector-exclusive (segregation of duties vs the coordinator who ran the turn): TurnCoordinator → 403 ERR_UNAUTHORIZED regardless of turn state."
        test_recipe:
          setup: ["OPEN turn exists"]
          setup_api_calls:
            - call: "POST /make-ready/properties"
              payload: { name: "Sunset Arms", days_to_ready_target: 5, pm_threshold_bp: 1000, rm_threshold_bp: 3000, capital_threshold_cents: 50000, replacement_policy: "PERCENT_OF_REPLACE" }
              as: RegionalManager
