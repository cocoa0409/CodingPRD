    status: 200
    side_effects:
      - "sets case_status = CLEARED_FOR_CONTACT, cleared_for_contact_at = now, heightened_review_required = false"
      - "releases a GRANTED roster exemption and returns the slot to the club"
      - "sets Player.availability_status = AVAILABLE and re-derives public_injury_designation"
      - "increments the approving consultant's cases_cleared_count by 1"
      - "increments ConcussionCase.version, Player.version and (on slot release) Club.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_CASE_NOT_FOUND, ERR_ROLE_IDENTITY_MISMATCH, ERR_CLUB_SCOPE_VIOLATION, ERR_CLINICIAN_SUSPENDED, ERR_CLINICIAN_CREDENTIAL_EXPIRED, ERR_CASE_STATE_INVALID, ERR_CASE_STAGE_FROZEN, ERR_RETURN_BEFORE_EARLIEST_DATE, ERR_INC_CLEARANCE_EXPIRED, ERR_INC_CLEARANCE_MISSING, ERR_BASELINE_NOT_ESTABLISHED, ERR_BASELINE_RETEST_REQUIRED]

