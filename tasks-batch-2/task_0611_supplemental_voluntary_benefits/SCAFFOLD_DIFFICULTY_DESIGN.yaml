  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: claim_void_conserves_benefit_paid_cents
        grounds:
          - state_machines.Claim.APPROVED_to_VOIDED
          - entities.Enrollment.fields.benefit_paid_cents
          - entities.Enrollment.fields.benefit_remaining_cents
        distinguishing_aspect: |
          Conserved quantity = enrollment.benefit_paid_cents. Approving a FRACTURE
          claim debits benefit_paid_cents from 0 to 200000; voiding the same
          (unpaid) claim credits it back to exactly 0, leaving benefit_paid_cents
          unchanged versus pre-approval. Distinct conserved quantity from the
          total_weekly_deduction_cents invariant below.
        test_recipe:
          setup:
            - "One ACTIVE funded enrollment (benefit_paid_cents=0); a FRACTURE claim approved (debits to 200000) then voided."
          setup_api_calls:
            - call: "POST /benefits/employers"
