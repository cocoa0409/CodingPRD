            - "EditorialPanelMeeting.${mtg_sp}.weighted_yes == 0"

  - section: rbac
    instances:
      - name: committee_reviewer_cannot_terminate_licence
        claim_type: role_denial
        grounds:
          - roles.CommitteeReviewer
          - roles.LicensingOfficer
          - errors[ERR_UNAUTHORIZED]
          - endpoints.POST /cpt/licensing-agreements/{id}/terminations
        distinguishing_aspect: |
          A CommitteeReviewer acting with a licensing payload is rejected at the
          priority-2 authorization layer with ERR_UNAUTHORIZED at status 403, and
          the licence keeps agreement_status ACTIVE.
        test_recipe:
          setup:
            - "One DistributionTerritory on the SITE method and one ACTIVE provider licence"
            - "Logical clock at 2026-09-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /cpt/distribution-territories"
              payload: { territory_code: "US-ALASKA", method: "SITE", edi_payer_network: false, metadata_schema_version: "2026.1" }
              as: LicensingOfficer
              captures: { ter_rb: $.data.id }
            - call: "POST /cpt/licensing-agreements"
              payload: { licensee_type: "PROVIDER", licensee_name: "Alaska Clinic", vendor_worldwide: false, expected_users: 7, sales_unit_count: 5, base_fee_cents: 0, territory_id: "${ter_rb}" }
              as: LicensingOfficer
              captures: { lic_rb: $.data.id }
            - call: "POST /cpt/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: EditorialStaff
            - call: "POST /cpt/licensing-agreements/${lic_rb}/activations"
              payload: {}
              as: LicensingOfficer
              captures: { lic_rb_v1: $.data.version }
          trigger:
            - call: "POST /cpt/licensing-agreements/${lic_rb}/terminations"
              payload: { reason: "Committee attempt" }
              as: CommitteeReviewer
              captures: { err_rb: $.data.error_id }
          assert:
            - "${err_rb} == ERR_UNAUTHORIZED"
            - "the returned http status is 403"
            - "LicensingAgreement.${lic_rb}.agreement_status == ACTIVE"

      - name: licensee_cannot_list_all_code_changes
        claim_type: role_denial
        grounds:
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
          - endpoints.GET /cpt/code-changes
        distinguishing_aspect: |
          A Licensee holds no listing permission on the shared code-change
          collection, so the read is rejected with ERR_UNAUTHORIZED at status 403
          rather than returning the editorial office's view.
        test_recipe:
          setup:
            - "One DistributionTerritory on the SITE method and one ACTIVE provider licence"
            - "Logical clock at 2026-09-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /cpt/distribution-territories"
              payload: { territory_code: "US-SIERRA", method: "SITE", edi_payer_network: false, metadata_schema_version: "2026.1" }
              as: LicensingOfficer
              captures: { ter_ua: $.data.id }
            - call: "POST /cpt/licensing-agreements"
              payload: { licensee_type: "PROVIDER", licensee_name: "Sierra Clinic", vendor_worldwide: false, expected_users: 8, sales_unit_count: 5, base_fee_cents: 0, territory_id: "${ter_ua}" }
              as: LicensingOfficer
              captures: { lic_ua: $.data.id }
            - call: "POST /cpt/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: EditorialStaff
          trigger:
            - call: "GET /cpt/code-changes"
              payload: {}
              as: Licensee
              as_user_id: "${lic_ua}"
              captures: { err_ua: $.data.error_id }
          assert:
            - "${err_ua} == ERR_UNAUTHORIZED"
            - "the returned http status is 403"

      - name: unauthenticated_request_returns_401
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: |
          A request carrying no X-User-Role header fails the priority-1
          authentication check with ERR_UNAUTHENTICATED at status 401 before any
          authorization or resource check runs.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /cpt/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: EditorialStaff
          trigger:
            - call: "GET /cpt/code-changes"
              payload: {}
              as: "<unauthenticated>"
              captures: { err_ua2: $.data.error_id }
          assert:
            - "${err_ua2} == ERR_UNAUTHENTICATED"
            - "the returned http status is 401"

      - name: app_linkage_owned_by_different_change
        claim_type: cross_entity_integrity
        grounds:
          - entities.CodeChange.fields.applicant_id
          - validations[priority=3]
          - errors[ERR_NOT_FOUND]
          - entities.ChangeApplicant.fields.status
        distinguishing_aspect: |
