scaffold_difficulty_design:

  # =========================================================================
  # Rule 1: dual_variant_calc (>=2 instances, different entity domains)
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: drug_phase_forward_vs_chronological
        grounds:
          - calculations.donut_hole_phase_calc
          - calculations.donut_hole_phase_calc.variants.forward_estimate
          - state_machines.DrugClaim.SUBMITTED_to_ADJUDICATED
          - endpoints.GET_/beneficiaries/{beneficiary_id}/drug-cost-estimate
          - endpoints.POST_/drug-claims/{id}/adjudicate
          - entities.DrugPhaseLedger.fields.current_phase
          - entities.DrugClaim.fields.phase_at_adjudication
        distinguishing_aspect: |
          Forward variant projects the next fill against the ledger snapshot AT QUERY TIME;
          chronological variant replays ALL ADJUDICATED claims sorted by fill_date ASC, ties broken
          by DrugClaim.id ASC. When a claim with an EARLIER fill_date is adjudicated AFTER a later
          one, the two variants produce different beneficiary_cost_cents — this instance is on the
          DRUG-SPEND domain (DrugClaim / DrugPhaseLedger), distinct from instance 2 which is on the
          ENROLLMENT-PREMIUM domain.
        test_recipe:
          setup:
            - "POST /_clock/advance to=2026-06-01T00:00:00Z (so Beneficiary is in IEP window)."
            - "Create Beneficiary B with DOB 1961-04-15, state_code=CA."
            - "Create Plan P_PARTD with plan_type=PART_D, plan_year=2026, monthly_premium_cents=4000, annual_deductible_cents=40000, initial_coverage_limit_cents=400000, catastrophic_threshold_cents=150000, star_rating=4.0."
            - "POST EnrollmentPeriod (already auto-created as IEP). Create Enrollment for B+P_PARTD citing IEP period, effective_date=2026-04-01; activate."
            - "Submit DrugClaim C1: fill_date=2026-05-10, tier=TIER_3, gross_cost_cents=50000; adjudicate. Ledger after: deductible_paid=40000, spend=50000, troop=42500, current_phase=INITIAL_COVERAGE."
          trigger:
            - "GET /beneficiaries/{B.id}/drug-cost-estimate?gross_cost_cents=20000&tier=TIER_3  -> response F."
            - "Submit DrugClaim C2: fill_date=2026-05-05 (EARLIER than C1), tier=TIER_3, gross_cost_cents=20000; adjudicate C2 -> response C2_adj."
          assert:
            - "F.phase_at_adjudication == 'INITIAL_COVERAGE' (forward sees ledger at INITIAL_COVERAGE)."
            - "F.beneficiary_cost_cents == 5000 (round_half_up(20000 * 0.25) = 5000)."
            - "C2_adj.phase_at_adjudication == 'DEDUCTIBLE' (chronological replay: C2 fill_date precedes C1, so C2 is the FIRST claim and consumes the deductible)."
            - "C2_adj.beneficiary_cost_cents == 20000 (entire 20000 is deductible spend; no rounding)."
            - "F.beneficiary_cost_cents != C2_adj.beneficiary_cost_cents (forward vs chronological disagree on identical gross/tier)."

      - name: enrollment_premium_provisional_vs_final
        grounds:
          - calculations.plan_total_monthly_cost_calc
          - calculations.plan_total_monthly_cost_calc.variants.provisional
          - calculations.plan_total_monthly_cost_calc.variants.final
          - endpoints.GET_/enrollments/{id}/cost-summary
          - entities.LateEnrollmentPenalty.fields.snapshot_base_premium_cents
          - state_machines.Enrollment.PENDING_to_ACTIVE
        distinguishing_aspect: |
          Provisional cost-summary uses Plan.monthly_premium_cents LIVE; final cost-summary uses
          LateEnrollmentPenalty.snapshot_base_premium_cents PINNED at activation. Mutating
          Plan.monthly_premium_cents after activation changes provisional but never changes final —
          this instance lives on the ENROLLMENT-PREMIUM domain (Enrollment / Plan / LEP), distinct
          from instance 1 which is on the DRUG-SPEND domain.
        test_recipe:
          setup:
            - "POST /_clock/advance to=2025-06-01T00:00:00Z. Create Beneficiary B with DOB 1956-06-15. Server computes medicare_eligibility_date = first_of_month(2021-06-15) = 2021-06-01; iep_end_date = 2021-09-30T23:59:59Z (long since IEP_CLOSED)."
            - "Create open AEP EnrollmentPeriod for B: window 2025-10-15..2025-12-07. Advance clock to 2025-10-20."
            - "Create Plan P_PARTB plan_type=PART_B, plan_year=2026, monthly_premium_cents=18000, star_rating=4.0."
            - "Create Enrollment E for B+P_PARTB citing the AEP period, effective_date=2026-01-01. months_between(2021-06-01, 2026-01-01) = 55 months; months_late = max(0, 55 - 7) = 48."
          trigger:
            - "GET /enrollments/{E.id}/cost-summary while E.status=PENDING -> response P1. (For provisional, the calc projects months_late=48 because the same effective_date is used.)"
            - "POST /enrollments/{E.id}/activate. LEP record auto-created: months_late=48, full_years=48//12=4, penalty_rate_decimal=0.40, monthly_penalty_cents=round_half_up(17490*0.40)=6996."
            - "Update Plan.monthly_premium_cents to 22000 by creating a new plan (or via an admin-controlled fixture mutation declared in INSTRUCTION); the assertion only requires Plan.monthly_premium_cents to differ from snapshot at the time P2 is read."
            - "GET /enrollments/{E.id}/cost-summary while E.status=ACTIVE -> response P2."
          assert:
            - "P1.variant == 'provisional'."
            - "P1.lep_cents == 6996 (LEP for Part B uses NATIONAL_AVG_PART_B_PREMIUM_CENTS=17490 * 0.40, not Plan.monthly_premium_cents)."
            - "P1.base_premium_cents == 18000."
            - "P1.effective_premium_cents == 24996 (18000 + 6996)."
            - "P2.variant == 'final'."
            - "P2.lep_cents == 6996 (pinned at activation)."
            - "P2.base_premium_cents == 18000 (snapshot_base_premium_cents frozen at activation, NOT the new 22000)."
            - "P2.effective_premium_cents == 24996 (final uses snapshot; live Plan.monthly_premium_cents change ignored)."
            - "P2.effective_premium_cents != (22000 + 6996) (proves snapshot wins over live)."

  # =========================================================================
  # Rule 2: combinatorial_formula (>=2 instances, different modes from {a,b,c})
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: donut_hole_phase_walk_mode_b
        grounds:
          - calculations.donut_hole_phase_calc
          - calculations.donut_hole_phase_calc.formula
          - calculations.donut_hole_phase_calc.precision
          - entities.Plan.fields.annual_deductible_cents
          - entities.Plan.fields.initial_coverage_limit_cents
          - entities.Plan.fields.catastrophic_threshold_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding order matters. The scaffold pins: round_half_up is applied ONCE
          PER PHASE-SHARE inside each phase (deductible unrounded, initial rounded, gap rounded,
          catastrophic rounded). "Round per-phase then sum" vs "sum then round" produce different
          cents when a single claim spans multiple phases. This is mode (b); instance 2 is mode (c).
        test_recipe:
          setup:
            - "Reach an active PART_D enrollment for Beneficiary B under Plan P_PARTD (D=40000, I=400000, C=150000) starting with empty ledger (same setup family as drug_phase_forward_vs_chronological)."
          trigger:
            - "Submit DrugClaim C: fill_date=2026-05-01, tier=TIER_3 (COPAY_RATE_INITIAL=0.25), gross_cost_cents=50001; adjudicate."
          assert:
            - "C.phase_at_adjudication == 'INITIAL_COVERAGE' (spans DEDUCTIBLE then INITIAL_COVERAGE)."
            - "C.beneficiary_cost_cents == 42500 (deductible step covers 40000 unrounded; initial step covers 10001, round_half_up(10001*0.25)=round_half_up(2500.25)=2500; total=40000+2500=42500)."
            - "C.plan_cost_cents == 7501 (10001 - 2500 = 7501)."
            - "C.beneficiary_cost_cents + C.plan_cost_cents == 50001 (sum-of-shares == gross; no double-rounding loss)."
            - "Naive 'sum then round' would compute round_half_up(50001*0.25)=12500 for non-deductible portion — different from the pinned 2500 + 40000 = 42500."

      - name: lep_circular_resolution_mode_c
        grounds:
          - calculations.late_enrollment_penalty_calc
          - calculations.plan_total_monthly_cost_calc
          - state_machines.Enrollment.PENDING_to_ACTIVE
          - entities.LateEnrollmentPenalty.fields.snapshot_base_premium_cents
          - entities.LateEnrollmentPenalty.fields.monthly_penalty_cents
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency. effective_premium_cents = base + lep; lep depends
          on national-average premium constant (not the per-plan base); BUT plan_total_monthly_cost_calc
          must read EITHER live Plan.monthly_premium_cents (provisional) OR
          LateEnrollmentPenalty.snapshot_base_premium_cents (final). The scaffold PINS evaluation
          order: at activation, snapshot_base = Plan.monthly_premium_cents AT THAT INSTANT; then
          monthly_penalty_cents = round_half_up(NATIONAL_AVG * penalty_rate); then
          effective = snapshot_base + monthly_penalty_cents — making the value well-defined even
          when Plan.monthly_premium_cents later changes. This is mode (c); instance 1 is mode (b).
        test_recipe:
          setup:
            - "Same as enrollment_premium_provisional_vs_final, up to the activation step (DOB 1956-06-15, eligibility 2021-06-01, effective 2026-01-01, months_late=48, Plan.monthly_premium_cents=18000)."
          trigger:
            - "Capture state immediately after POST /enrollments/{E.id}/activate."
          assert:
            - "LateEnrollmentPenalty.snapshot_base_premium_cents == 18000 (captured at activation)."
            - "LateEnrollmentPenalty.months_late == 48."
            - "LateEnrollmentPenalty.penalty_rate_decimal == 0.40 (full_years = 48//12 = 4; 4 * 0.10 = 0.40)."
            - "LateEnrollmentPenalty.monthly_penalty_cents == 6996 (round_half_up(17490 * 0.40) = 6996, uses national avg, NOT Plan.monthly_premium_cents)."
            - "Subsequent change to Plan.monthly_premium_cents does not change LateEnrollmentPenalty.snapshot_base_premium_cents (stays at 18000)."

  # =========================================================================
  # Rule 3: non_linear_state_machine (>=2 instances, different entities)
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: medigap_underwriting_revision_cycle
        grounds:
          - state_machines.MedigapPolicy
          - state_machines.MedigapPolicy.APPLIED_to_UNDERWRITING
          - state_machines.MedigapPolicy.UNDERWRITING_to_APPLIED
          - endpoints.POST_/medigap-policies/{id}/revise-application
        distinguishing_aspect: |
          MedigapPolicy has a CYCLE: APPLIED -> UNDERWRITING -> APPLIED -> UNDERWRITING -> ... via
          /revise-application. Each revision resets applied_at and zeros underwriting_uplift_decimal.
          Entity is MedigapPolicy. Instance 2 is on a different entity (Enrollment) with a different
          non-linear shape (branching fork/join).
        test_recipe:
          setup:
            - "Create Beneficiary B (state_code=CA) and Plan P_MEDIGAP (plan_type=MEDIGAP, state_code=CA, monthly_premium_cents=20000)."
            - "POST /medigap-policies with beneficiary_id=B.id, plan_id=P_MEDIGAP.id, underwriting_uplift_decimal=0.0. (No MEDIGAP_GI window exists.)"
          trigger:
            - "POST /medigap-policies/{id}/begin-underwriting -> status=UNDERWRITING."
            - "POST /medigap-policies/{id}/revise-application -> status=APPLIED (cycle hop 1)."
            - "POST /medigap-policies/{id}/begin-underwriting -> status=UNDERWRITING (cycle hop 2)."
            - "POST /medigap-policies/{id}/revise-application -> status=APPLIED (cycle hop 3)."
          assert:
            - "MedigapPolicy.status sequence over the 4 transitions == ['UNDERWRITING','APPLIED','UNDERWRITING','APPLIED]."
            - "MedigapPolicy.version increased by exactly 4 (one per transition)."
            - "MedigapPolicy.underwriting_uplift_decimal == 0.0 at every APPLIED checkpoint (reset by revise)."

      - name: enrollment_branching_active_or_rejected
        grounds:
          - state_machines.Enrollment
          - state_machines.Enrollment.PENDING_to_ACTIVE
          - state_machines.Enrollment.PENDING_to_REJECTED
          - state_machines.Enrollment.ACTIVE_to_ACTIVE
          - endpoints.POST_/enrollments/{id}/activate
          - endpoints.POST_/enrollments/{id}/reject
          - endpoints.POST_/enrollments/{id}/transfer
        distinguishing_aspect: |
          Enrollment has branching: from PENDING the path forks to ACTIVE (via /activate) OR
          REJECTED (via /reject) with DIFFERENT side-effect sets — activate creates LEP, marks
          period CONSUMED, possibly creates DrugPhaseLedger, bubbles Beneficiary state; reject does
          NONE of those (period stays OPEN). Additionally the ACTIVE_to_ACTIVE transfer transition
          is a self-cycle. Entity is Enrollment, different from instance 1's MedigapPolicy.
        test_recipe:
          setup:
            - "Two independent Beneficiaries B1, B2 both in IEP_OPEN with PART_D plan P_PARTD."
            - "Create Enrollment E1 (B1, P_PARTD) and E2 (B2, P_PARTD), both PENDING, both referencing their own OPEN IEP period."
          trigger:
            - "POST /enrollments/{E1.id}/activate."
            - "POST /enrollments/{E2.id}/reject."
          assert:
            - "E1.status == 'ACTIVE'; B1.lifecycle_status transitioned to 'ENROLLED'; B1's IEP EnrollmentPeriod.status == 'CONSUMED'; a DrugPhaseLedger row exists for E1."
            - "E2.status == 'REJECTED'; B2.lifecycle_status remained 'IEP_OPEN'; B2's IEP EnrollmentPeriod.status == 'OPEN' (NOT CONSUMED); no DrugPhaseLedger row exists for E2."

  # =========================================================================
  # Rule 4: transitive_cascade (>=2 instances, different triggers, depths >=3 and >=2)
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: deceased_triggers_depth3_cascade
        grounds:
          - state_machines.Beneficiary.ENROLLED_to_DECEASED
          - state_machines.Enrollment.ACTIVE_to_TERMINATED
          - state_machines.DrugClaim.SUBMITTED_to_REVERSED
          - state_machines.MedigapPolicy.APPLIED_to_CANCELLED
          - state_machines.MedigapPolicy.UNDERWRITING_to_CANCELLED
          - state_machines.MedigapPolicy.ISSUED_to_CANCELLED
          - endpoints.POST_/beneficiaries/{id}/mark-deceased
        distinguishing_aspect: |
          Depth-3 cascade ORIGINATING FROM /mark-deceased: hop 1 — Beneficiary.lifecycle_status
          -> DECEASED triggers Enrollment.ACTIVE -> TERMINATED on hop 2; hop 2 — Enrollment
          TERMINATED triggers DrugPhaseLedger.current_phase freeze AND triggers a freshly-opened
          SEP_LOSS_OF_COVERAGE EnrollmentPeriod, which when combined with DECEASED becomes
          immediately stale (status auto-set to CLOSED) on hop 3. The trigger /mark-deceased is
          DISTINCT from instance 2's trigger (drug-claim adjudication).
        test_recipe:
          setup:
            - "Reach Beneficiary B with one ACTIVE PART_C Enrollment E_C, one ACTIVE PART_D Enrollment E_D with at least one ADJUDICATED DrugClaim (ledger non-empty), and one MedigapPolicy M in ISSUED state."
          trigger:
            - "POST /beneficiaries/{B.id}/mark-deceased."
          assert:
            - "B.lifecycle_status == 'DECEASED' (hop 1)."
            - "E_C.status == 'TERMINATED' AND E_D.status == 'TERMINATED' (hop 2 caused by hop 1)."
            - "M.status == 'CANCELLED' (hop 2 caused by hop 1)."
            - "DrugPhaseLedger.current_phase is frozen at its value as of E_D.termination_date (hop 3 caused by hop 2)."
            - "A SEP_LOSS_OF_COVERAGE EnrollmentPeriod was created and immediately set to status='CLOSED' because Beneficiary is DECEASED (hop 3 caused by hop 2)."

      - name: drug_claim_depth2_ledger_cascade
        grounds:
          - state_machines.DrugClaim.SUBMITTED_to_ADJUDICATED
          - calculations.donut_hole_phase_calc
          - entities.DrugPhaseLedger.fields.current_phase
          - entities.DrugPhaseLedger.fields.last_adjudicated_claim_id
          - entities.DrugClaim.fields.phase_at_adjudication
        distinguishing_aspect: |
          Depth-2 cascade ORIGINATING FROM /drug-claims/{id}/adjudicate: hop 1 — DrugClaim
          status SUBMITTED -> ADJUDICATED writes DrugClaim.phase_at_adjudication and
          beneficiary_cost_cents/plan_cost_cents. Hop 2 — the BEFORE-update on hop 1 forces a
          fresh recompute of DrugPhaseLedger.current_phase based on the new counters (each link
          caused by the previous, not by the original API call: adjudicate mutates the claim, the
          mutated claim mutates the ledger). Trigger /adjudicate is DISTINCT from instance 1's
          /mark-deceased.
        test_recipe:
          setup:
            - "Reach an active PART_D enrollment with empty DrugPhaseLedger. Plan: D=40000, I=400000, C=150000."
          trigger:
            - "Submit DrugClaim C: fill_date=2026-05-10, tier=TIER_3, gross_cost_cents=50000; adjudicate."
          assert:
            - "C.status == 'ADJUDICATED' (hop 1)."
            - "C.phase_at_adjudication == 'INITIAL_COVERAGE' (hop 1)."
            - "C.beneficiary_cost_cents == 42500 AND C.plan_cost_cents == 7500 (hop 1)."
            - "DrugPhaseLedger.last_adjudicated_claim_id == C.id (hop 2, caused by hop 1)."
            - "DrugPhaseLedger.current_phase == 'INITIAL_COVERAGE' (hop 2, recomputed from new counters: deductible_paid=40000=D and spend=50000<I=400000)."

  # =========================================================================
  # Rule 5: priority_pair_validation_conflict (>=2 instances, different category pairs)
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: deceased_vs_premium_pair
        grounds:
          - validations[priority=6]
          - validations[priority=17]
          - errors.ERR_BENEFICIARY_DECEASED
          - errors.ERR_INVALID_PREMIUM
          - endpoints.POST_/enrollments/{id}/activate
        distinguishing_aspect: |
          Dual-failure on POST /enrollments/{id}/activate: Beneficiary is DECEASED (state category,
          priority 6) AND Plan.monthly_premium_cents=0 for a non-Part-A enrollment
          (business_fiscal category, priority 17). The lower-priority-number rule wins -> server
          MUST return ERR_BENEFICIARY_DECEASED, not ERR_INVALID_PREMIUM. Category pair = state vs
          business_fiscal; instance 2 uses business_referential vs business_constraint.
        test_recipe:
          setup:
            - "Create Beneficiary B and Plan P_PARTB (plan_type=PART_B, monthly_premium_cents=0). Create AEP period, create Enrollment E in PENDING."
            - "POST /beneficiaries/{B.id}/mark-deceased."
          trigger:
            - "POST /enrollments/{E.id}/activate."
          assert:
            - "HTTP status == 409."
            - "error_id == 'ERR_BENEFICIARY_DECEASED' (NOT 'ERR_INVALID_PREMIUM')."

      - name: duplicate_part_vs_transfer_window_pair
        grounds:
          - validations[priority=13]
          - validations[priority=16]
          - errors.ERR_DUPLICATE_PART_ENROLLMENT
          - errors.ERR_TRANSFER_WINDOW_INVALID
          - endpoints.POST_/enrollments/{id}/transfer
        distinguishing_aspect: |
          Dual-failure on POST /enrollments/{id}/transfer: AEP window not open (transfer_window
          invalid, business_constraint, priority 16) AND beneficiary already has overlapping ACTIVE
          PART_C enrollment for the new plan_year (business_referential, priority 13). Priority-13
          wins -> ERR_DUPLICATE_PART_ENROLLMENT. Category pair = business_referential vs
          business_constraint; instance 1's pair was state vs business_fiscal (distinct).
        test_recipe:
          setup:
            - "Beneficiary B; Plan P_PARTC_2025 (plan_year=2025, plan_type=PART_C); Plan P_PARTC_2026 (plan_year=2026, plan_type=PART_C)."
            - "Create ACTIVE Enrollment E_2025 (B, P_PARTC_2025) and ALSO create a SECOND ACTIVE Enrollment E_2026_X (B, P_PARTC_2026) already covering 2026 via a SEP — so a transfer to a different P_PARTC_2026' would duplicate."
            - "Advance clock to 2025-09-01 (BEFORE AEP starts on Oct 15)."
          trigger:
            - "POST /enrollments/{E_2025.id}/transfer with new_plan_id pointing at a third P_PARTC_2026' plan."
          assert:
            - "HTTP status == 409."
            - "error_id == 'ERR_DUPLICATE_PART_ENROLLMENT' (priority-13, not priority-16)."

  # =========================================================================
  # Rule 6: boundary_precision_check (>=2 instances, different metrics, different endpoints)
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: iep_end_date_inclusive_last_second
        grounds:
          - calculations.medicare_eligibility_window_calc
          - calculations.medicare_eligibility_window_calc.precision
          - state_machines.Beneficiary.IEP_OPEN_to_IEP_CLOSED
          - endpoints.POST_/_clock/advance
        distinguishing_aspect: |
          Boundary on a TEMPORAL metric reached via /_clock/advance: iep_end_date is INCLUSIVE
          (23:59:59 UTC of the last day). At exactly iep_end_date, Beneficiary stays IEP_OPEN; at
          iep_end_date + 1 second, transitions to IEP_CLOSED. Endpoint is /_clock/advance.
          Instance 2 uses an empty-set boundary on a DIFFERENT endpoint (/star-ratings list).
        test_recipe:
          setup:
            - "Create Beneficiary B with date_of_birth=1961-04-15. Server computes iep_start=2026-01-01, iep_end=2026-07-31T23:59:59Z."
            - "POST /_clock/advance to=2026-01-02T00:00:00Z so B.lifecycle_status auto-transitions to IEP_OPEN."
          trigger:
            - "POST /_clock/advance to=2026-07-31T23:59:59Z -> read B."
            - "POST /_clock/advance to=2026-08-01T00:00:00Z -> read B."
          assert:
            - "After advance to 2026-07-31T23:59:59Z: B.lifecycle_status == 'IEP_OPEN' (boundary INCLUSIVE)."
            - "After advance to 2026-08-01T00:00:00Z: B.lifecycle_status == 'IEP_CLOSED' (boundary crossed by exactly 1 second)."

      - name: star_rating_band_exact_80_inclusive
        grounds:
          - calculations.star_rating_weighted_score
          - calculations.star_rating_weighted_score.precision
          - endpoints.POST_/plans/{id}/star-ratings
          - entities.StarRatingSnapshot.fields.weighted_star_rating
        distinguishing_aspect: |
          Boundary on a NUMERIC SCORE metric reached via POST /plans/{id}/star-ratings: banding
          uses INCLUSIVE lower bounds. composite_raw=80.0000 -> 4.5, composite_raw=79.9999 -> 4.0.
          Different metric (numeric band) and different endpoint (/star-ratings) from instance 1.
        test_recipe:
          setup:
            - "Create Plan P (plan_type=PART_C, plan_year=2026, monthly_premium_cents=10000, star_rating=3.0)."
          trigger:
            - "POST /plans/{P.id}/star-ratings with measurement_year=2026, clinical=80.0, experience=80.0, service=80.0 -> S1."
            - "POST /plans/{P.id}/star-ratings with measurement_year=2027, clinical=80.0, experience=80.0, service=79.99 -> S2."
          assert:
            - "S1.weighted_star_rating == 4.5 (composite_raw = 0.5*80 + 0.3*80 + 0.2*80 = 80.0000; 80 >= 80 boundary inclusive)."
            - "S2.weighted_star_rating == 4.0 (composite_raw = 0.5*80 + 0.3*80 + 0.2*79.99 = 40 + 24 + 15.998 = 79.998; 79.998 < 80, falls to 70-band)."
            - "P.star_rating after S2 publish == 4.0 (latest measurement_year=2027 dominates)."

  # =========================================================================
  # Rule 7: cross_entity_state_dependency (>=2 instances, different entity pairs)
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: enrollment_activate_requires_period_open
        grounds:
          - state_machines.Enrollment.PENDING_to_ACTIVE
          - entities.EnrollmentPeriod.fields.status
          - validations[priority=10]
          - errors.ERR_PERIOD_NOT_OPEN
          - endpoints.POST_/enrollments/{id}/activate
        distinguishing_aspect: |
          Enrollment's PENDING -> ACTIVE transition requires EnrollmentPeriod.status = OPEN. The
          entity pair is Enrollment ↔ EnrollmentPeriod. Different from instance 2's pair
          (DrugClaim ↔ Enrollment).
        test_recipe:
          setup:
            - "Beneficiary B; Plan P_PARTB; create an AEP EnrollmentPeriod with window 2025-10-15..2025-12-07."
            - "Clock advanced to 2025-12-08 (period now CLOSED automatically)."
            - "Enrollment E created with effective_date=2026-01-01 citing this AEP period."
          trigger:
            - "POST /enrollments/{E.id}/activate."
          assert:
            - "HTTP status == 409."
            - "error_id == 'ERR_PERIOD_NOT_OPEN' (EnrollmentPeriod.status='CLOSED', not OPEN)."

      - name: drug_claim_adjudicate_requires_enrollment_active
        grounds:
          - state_machines.DrugClaim.SUBMITTED_to_ADJUDICATED
          - entities.Enrollment.fields.status
          - state_machines.Enrollment.ACTIVE_to_TERMINATED
          - endpoints.POST_/drug-claims/{id}/adjudicate
          - endpoints.POST_/enrollments/{id}/terminate
        distinguishing_aspect: |
          DrugClaim's SUBMITTED -> ADJUDICATED transition requires the referenced Enrollment.status
          = ACTIVE. If the Enrollment was TERMINATED between submission and adjudication, the
          adjudication is blocked. Entity pair is DrugClaim ↔ Enrollment, different from instance 1
          (Enrollment ↔ EnrollmentPeriod).
        test_recipe:
          setup:
            - "Beneficiary B with an ACTIVE PART_D Enrollment E_D. Submit DrugClaim C with fill_date inside coverage interval; do NOT adjudicate yet."
          trigger:
            - "POST /enrollments/{E_D.id}/terminate with termination_date = today."
            - "POST /drug-claims/{C.id}/adjudicate."
          assert:
            - "HTTP status == 409."
            - "error_id == 'ERR_INVALID_STATE' (DrugClaim adjudication requires Enrollment.status='ACTIVE', got 'TERMINATED')."

  # =========================================================================
  # Rule 8: resource_temporal_overlap (>=2 instances, different interval semantics)
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: enrollment_coverage_interval_open_ended_overlap
        grounds:
          - validations[priority=13]
          - errors.ERR_DUPLICATE_PART_ENROLLMENT
          - entities.Enrollment.fields.effective_date
          - entities.Enrollment.fields.termination_date
          - endpoints.POST_/enrollments/{id}/activate
          - concurrency_rules[Two ACTIVE enrollments to the same Part]
        distinguishing_aspect: |
          Enrollment overlap uses HALF-OPEN-ENDED interval semantics: an ACTIVE enrollment with
          termination_date=null is treated as [effective_date, +infinity). A new enrollment with
          effective_date >= existing.effective_date overlaps unconditionally; only termination
          before the new effective_date opens the slot. Resource = Enrollment; instance 2 is on
          MedigapPolicy with CLOSED-PAIRWISE semantics.
        test_recipe:
          setup:
            - "Beneficiary B with ACTIVE Enrollment E1 (part_covered=PART_B, effective_date=2025-06-01, termination_date=null)."
            - "Open SEP period covering 2026-01-01..2026-01-31."
            - "Create Enrollment E2 (B, another PART_B plan) effective_date=2026-01-15, citing the SEP."
          trigger:
            - "POST /enrollments/{E2.id}/activate."
          assert:
            - "HTTP status == 409."
            - "error_id == 'ERR_DUPLICATE_PART_ENROLLMENT' (E1's open-ended interval covers E2.effective_date)."

      - name: medigap_pairwise_closed_overlap
        grounds:
          - entities.MedigapPolicy.fields.status
          - state_machines.MedigapPolicy
          - concurrency_rules[Medigap GI evaluation and underwriting]
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: |
          MedigapPolicy overlap uses PAIRWISE-CLOSED semantics: at most one MedigapPolicy with
          status IN {APPLIED, UNDERWRITING, GUARANTEED_ISSUED, ISSUED} per (beneficiary_id, plan_id)
          tuple. The interval geometry treats status as the resource and the comparison is exact
          tuple-uniqueness rather than an open-ended timeline. Resource = MedigapPolicy, different
          from instance 1's Enrollment. The interval semantics — exact tuple match vs half-open
          timeline — are also distinct.
        test_recipe:
          setup:
            - "Beneficiary B (state_code=CA); Plan P_MED (plan_type=MEDIGAP, state_code=CA)."
            - "POST /medigap-policies (B, P_MED) -> M1 in status=APPLIED."
          trigger:
            - "POST /medigap-policies (B, P_MED) again -> attempt M2."
          assert:
            - "HTTP status == 409."
            - "error_id == 'ERR_INVALID_STATE' (an APPLIED/UNDERWRITING/GUARANTEED_ISSUED/ISSUED MedigapPolicy already exists for this (beneficiary_id, plan_id))."

  # =========================================================================
  # Rule 9: compensating_invariant (>=2 instances, different conserved quantities)
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: drug_ledger_reverse_invariant
        grounds:
          - state_machines.DrugClaim.ADJUDICATED_to_REVERSED
          - validations[priority=15]
          - errors.ERR_LEDGER_INVARIANT_BREACH
          - entities.DrugPhaseLedger.fields.deductible_paid_cents
          - entities.DrugPhaseLedger.fields.total_drug_spend_cents
          - entities.DrugPhaseLedger.fields.troop_cents
          - endpoints.POST_/drug-claims/{id}/reverse
        distinguishing_aspect: |
          Conserved quantity: DrugPhaseLedger counters MUST always equal the sum of contributions
          from currently-ADJUDICATED claims. Reversal of the LAST adjudicated claim with no later
          claims must roll the ledger back to its pre-claim state. The named quantity is
          (deductible_paid_cents, total_drug_spend_cents, troop_cents) — drug-spend ledger.
          Distinct from instance 2's conserved quantity (EnrollmentPeriod consumption count).
        test_recipe:
          setup:
            - "Reach an active PART_D enrollment with empty ledger; Plan D=40000, I=400000, C=150000."
            - "Submit and adjudicate DrugClaim C: gross=50000, tier=TIER_3. Ledger after: deductible_paid=40000, total_drug_spend=50000, troop=42500."
          trigger:
            - "POST /drug-claims/{C.id}/reverse."
          assert:
            - "C.status == 'REVERSED'."
            - "DrugPhaseLedger.deductible_paid_cents == 0 (rolled back exactly)."
            - "DrugPhaseLedger.total_drug_spend_cents == 0 (rolled back exactly)."
            - "DrugPhaseLedger.troop_cents == 0 (rolled back exactly)."
            - "DrugPhaseLedger.current_phase == 'DEDUCTIBLE' (recomputed)."
            - "Sum of beneficiary_cost_cents across status='ADJUDICATED' claims for this ledger == DrugPhaseLedger.troop_cents == 0 (invariant holds)."

      - name: enrollment_period_consumption_invariant
        grounds:
          - state_machines.Enrollment.PENDING_to_ACTIVE
          - state_machines.Enrollment.PENDING_to_REJECTED
          - entities.EnrollmentPeriod.fields.status
          - entities.EnrollmentPeriod.fields.consumed_by_enrollment_id
          - concurrency_rules[Same EnrollmentPeriod referenced by two activations]
          - errors.ERR_PERIOD_ALREADY_CONSUMED
        distinguishing_aspect: |
          Conserved quantity: for every EnrollmentPeriod, COUNT(status='CONSUMED') + COUNT(status IN
          {SCHEDULED,OPEN,CLOSED}) == 1; i.e., a period is consumed AT MOST ONCE. The forward
          action is /enrollments/.../activate (CONSUMES the period) and the compensating action is
          /enrollments/.../reject (does NOT consume). The named quantity is the period's
          consumption count — distinct from instance 1's drug-spend ledger counters.
        test_recipe:
          setup:
            - "Beneficiary B, Plan P_PARTB, AEP period AP with status=OPEN."
            - "Create Enrollment E1 (B, P_PARTB, AP) PENDING and E2 (B, P_PARTB, AP) PENDING (both referencing the same AP — only allowed while both PENDING)."
          trigger:
            - "POST /enrollments/{E1.id}/activate -> success; AP.status -> CONSUMED, AP.consumed_by_enrollment_id = E1.id."
            - "POST /enrollments/{E2.id}/activate -> attempted."
          assert:
            - "First activation: AP.status == 'CONSUMED' AND AP.consumed_by_enrollment_id == E1.id."
            - "Second activation: HTTP status == 409 AND error_id == 'ERR_PERIOD_ALREADY_CONSUMED'."
            - "Invariant: COUNT(EnrollmentPeriod where id=AP.id AND status='CONSUMED') == 1 (never 2)."
