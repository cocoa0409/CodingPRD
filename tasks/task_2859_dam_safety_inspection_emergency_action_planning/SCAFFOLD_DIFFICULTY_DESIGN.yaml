            - "repriced: base_fee_cents == 100000, engineering_review_fee_cents == 66000, delinquency_surcharge_cents == 24900 (the owner was DELINQUENT from the first posting), volume_credit_cents == 0, total_fee_cents == 190900"
            - "the resubmit appended exactly one FeeLedgerEntry with entry_type == FEE_VOID, amount_cents == -239100 (190900 - 430000) and balance_after_cents == 190900"
