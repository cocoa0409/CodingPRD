# =============================================================================
# Apparel Boutique & Fitting-Room Retail — Scaffold (§1.0–§1.7)
# Difficulty band: Expert
# =============================================================================

scenario: "Apparel Boutique & Fitting-Room Retail: style/SKU by size & color matrix, inventory & restock, fitting-room hold & styling appointment, seasonal markdown & clearance, loyalty & store credit, exchange/return window, special order/ship-from-store, lookbook"

domain_name: apparel-boutique-fitting-room-retail
api_prefix: /
# Flat multi-root topology: Boutique, Customer, Style, FittingRoom, Stylist,
# Lookbook, SalesOrder, SpecialOrder are all top-level collections linked by FK
# rather than nested URL ownership; sub-resources (sku-variants, holds,
# appointments, lines, returns) hang off their parent's collection path.

# -----------------------------------------------------------------------------
# Complexity Profile (§0.1–§0.3)
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: quota_allocation        # finite inventory reserved/committed/released across holds, sales, special orders
  secondary_archetype: pricing_engine        # seasonal markdown + clearance stacking with dual-variant pricing
  complexity_layers:
    - dual_variant_calculation               # markdown provisional-vs-final; loyalty projected-vs-actual
    - cascading_side_effects                  # return->orderline->sku->style; markdown->style->hold
    - optimistic_concurrency                  # CREATE-with-supersede on MarkdownSchedule vs Style.version
    - rate_threshold_triggers                 # loyalty tier breakpoints; return-window boundary

  entity_topology: hybrid
  # Boutique tree (Customer/Style/FittingRoom/Stylist/Lookbook under Boutique;
  # SkuVariant under Style; OrderLine/ReturnRequest under SalesOrder) plus
  # cross-cutting FK associations (Hold -> Room+Customer+SkuVariant; Appointment
  # -> Stylist+Customer; SpecialOrder -> Customer+SkuVariant; Lookbook -> Styles).

  state_machine_shape: parallel
  # SalesOrder carries two independent state axes (payment_status x
  # fulfillment_status); other machines are branching / branching-with-revert.

  relationship_patterns:
    - one_to_many        # Style -> SkuVariant; SalesOrder -> OrderLine
    - cross_aggregate    # FittingRoomHold references SkuVariant across the Style aggregate
    - polymorphic        # ReturnRequest.resolution references either store-credit or exchange OrderLine

  role_model: peer_roles
  # Customer owns own orders/holds/appointments; StoreAssociate runs the floor
  # (holds, sales, returns); Merchandiser owns styles/SKUs/markdowns/lookbooks;
  # StoreManager is the operational override + opaque admin surface.

  consistency_model: immediate

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Boutique
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Store display name" }
      - { name: state_code, type: string, source: input, description: "US state code; selects sales-tax rate", constraints: "2-letter uppercase" }
      - { name: tax_rate_bps, type: integer, source: input, description: "Sales-tax rate in basis points (e.g., 875 = 8.75%)", constraints: ">= 0 and <= 2000" }
      - { name: current_business_date, type: integer, source: system, description: "Deterministic store clock as a day index (epoch day count); advanced only via the clock endpoint", default: 0 }
      - { name: return_window_days, type: integer, source: input, description: "Days a delivered/completed order remains returnable", default: 30, constraints: ">= 0" }
      - { name: store_credit_outstanding_cents, type: integer, source: computed, description: "Sum of store_credit_cents over all Customers of this boutique; conservation invariant anchor" }

  - name: Customer
    parent: Boutique
    common_fields: true
    fields:
      - { name: boutique_id, type: string, source: system, description: "FK -> Boutique.id" }
      - { name: full_name, type: string, source: input, description: "Customer name" }
      - { name: email, type: string, source: input, description: "Contact email; unique within a boutique", constraints: "unique per boutique_id" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: ACTIVE, constraints: "ACTIVE, SUSPENDED" }
      - { name: store_credit_cents, type: integer, source: computed, description: "Redeemable store-credit wallet balance; never negative", default: 0 }
      - { name: loyalty_points, type: integer, source: computed, description: "Lifetime loyalty points net of reversals; 1 point per 100 captured cents", default: 0 }
      - { name: captured_spend_cents, type: integer, source: computed, description: "Cumulative net captured spend (captures minus refunds); drives loyalty tier", default: 0 }
      - { name: loyalty_tier, type: enum, source: computed, description: "Actual tier from captured_spend_cents thresholds", default: STANDARD, constraints: "STANDARD, SILVER, GOLD" }

  - name: Style
    parent: Boutique
    common_fields: true
    fields:
      - { name: boutique_id, type: string, source: system, description: "FK -> Boutique.id" }
      - { name: style_code, type: string, source: input, description: "Merchandiser SKU root; unique within a boutique", constraints: "unique per boutique_id" }
      - { name: name, type: string, source: input, description: "Style display name" }
      - { name: category, type: enum, source: input, description: "Apparel category", constraints: "TOPS, BOTTOMS, DRESSES, OUTERWEAR, ACCESSORIES" }
      - { name: season, type: enum, source: input, description: "Merchandising season", constraints: "SPRING, SUMMER, FALL, WINTER" }
      - { name: list_price_cents, type: integer, source: input, description: "Full retail price before any markdown", constraints: "> 0" }
      - { name: current_price_cents, type: integer, source: computed, description: "Effective price after the active MarkdownSchedule (= list_price_cents when none active)" }
      - { name: clearance, type: boolean, source: computed, description: "True once an ACTIVE markdown of phase CLEARANCE applies", default: false }
      - { name: total_available, type: integer, source: computed, description: "Sum of available over this style's SkuVariants" }

  - name: SkuVariant
    parent: Style
    common_fields: true
    fields:
      - { name: style_id, type: string, source: system, description: "FK -> Style.id" }
      - { name: size, type: enum, source: input, description: "Size axis of the size x color matrix", constraints: "XS, S, M, L, XL" }
      - { name: color, type: string, source: input, description: "Color axis of the size x color matrix" }
      - { name: on_hand, type: integer, source: computed, description: "Physical units in store; conservation: on_hand == available + reserved", default: 0 }
      - { name: reserved, type: integer, source: computed, description: "Units reserved by ACTIVE/EXTENDED FittingRoomHolds plus PLACED/SOURCED SpecialOrders", default: 0 }
      - { name: available, type: integer, source: computed, description: "Units free to sell = on_hand - reserved; never negative", default: 0 }
      - { name: status, type: enum, source: system, description: "STOCKED while sellable; DISCONTINUED blocks new reservations", default: STOCKED, constraints: "STOCKED, DISCONTINUED" }

  - name: FittingRoom
    parent: Boutique
    common_fields: true
    fields:
      - { name: boutique_id, type: string, source: system, description: "FK -> Boutique.id" }
      - { name: label, type: string, source: input, description: "Room label, e.g., 'Room 3'" }
      - { name: status, type: enum, source: system, description: "OPEN accepts holds; CLOSED blocks new holds", default: OPEN, constraints: "OPEN, CLOSED" }

  - name: FittingRoomHold
    parent: FittingRoom
    common_fields: true
    fields:
      - { name: fitting_room_id, type: string, source: system, description: "FK -> FittingRoom.id" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: sku_variant_id, type: string, source: input, description: "FK -> SkuVariant.id; the unit reserved off the floor" }
      - { name: start_minute, type: integer, source: input, description: "Hold start as minute-of-day within current_business_date", constraints: ">= 0 and < 1440" }
      - { name: end_minute, type: integer, source: input, description: "Hold end as minute-of-day; half-open interval [start_minute, end_minute)", constraints: "> start_minute and <= 1440" }
      - { name: status, type: enum, source: system, description: "Hold lifecycle", default: ACTIVE, constraints: "ACTIVE, EXTENDED, CONVERTED, EXPIRED, RELEASED" }
      - { name: held_price_cents, type: integer, source: computed, description: "Style.current_price_cents snapshot at hold creation; refreshed when an active markdown re-prices the style" }
      - { name: sales_order_id, type: string, source: computed, description: "FK -> SalesOrder.id; set when the hold is CONVERTED to a sale", default: null }

  - name: Stylist
    parent: Boutique
    common_fields: true
    fields:
      - { name: boutique_id, type: string, source: system, description: "FK -> Boutique.id" }
      - { name: full_name, type: string, source: input, description: "Stylist name" }
      - { name: buffer_minutes, type: integer, source: input, description: "Mandatory cleanup gap required between two appointments on this stylist", default: 15, constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE accepts appointments; OFF blocks new confirmations", default: ACTIVE, constraints: "ACTIVE, OFF" }

  - name: StylingAppointment
    parent: Stylist
    common_fields: true
    fields:
      - { name: stylist_id, type: string, source: system, description: "FK -> Stylist.id" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: start_minute, type: integer, source: input, description: "Appointment start as minute-of-day within current_business_date", constraints: ">= 0 and < 1440" }
      - { name: end_minute, type: integer, source: input, description: "Appointment end as minute-of-day; closed-buffer interval (see §1.2.1/§1.4)", constraints: "> start_minute and <= 1440" }
      - { name: status, type: enum, source: system, description: "Appointment lifecycle", default: REQUESTED, constraints: "REQUESTED, CONFIRMED, COMPLETED, NO_SHOW, CANCELLED" }

  - name: MarkdownSchedule
    parent: Style
    common_fields: true
    fields:
      - { name: style_id, type: string, source: system, description: "FK -> Style.id" }
      - { name: phase, type: enum, source: input, description: "SEASONAL = percent-off markdown; CLEARANCE = deeper terminal markdown that stacks", constraints: "SEASONAL, CLEARANCE" }
      - { name: markdown_pct, type: integer, source: input, description: "Percent off list_price_cents for this schedule (whole percent)", constraints: ">= 1 and <= 90" }
      - { name: effective_date, type: integer, source: input, description: "Day index on/after which the schedule may be activated", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "Markdown lifecycle", default: DRAFT, constraints: "DRAFT, SCHEDULED, ACTIVE, ENDED, SUPERSEDED" }
      - { name: projected_price_cents, type: integer, source: computed, description: "Provisional preview price computed at scheduling time (dual-variant: forward-looking)" }
      - { name: applied_price_cents, type: integer, source: computed, description: "Final price computed at activation (dual-variant: actual), written onto Style.current_price_cents", default: null }

  - name: SalesOrder
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id" }
      - { name: boutique_id, type: string, source: system, description: "FK -> Boutique.id" }
      - { name: payment_status, type: enum, source: system, description: "Payment axis (independent of fulfillment)", default: UNPAID, constraints: "UNPAID, AUTHORIZED, CAPTURED, REFUNDED" }
      - { name: fulfillment_status, type: enum, source: system, description: "Fulfillment axis (independent of payment)", default: OPEN, constraints: "OPEN, COMPLETED, CANCELLED" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum over OrderLines of unit_price_cents * qty (per-line then sum; see calc order_pricing)" }
      - { name: loyalty_discount_cents, type: integer, source: computed, description: "Tier discount applied at authorization (keyed on customer tier BEFORE this order is captured)" }
      - { name: tax_cents, type: integer, source: computed, description: "Sales tax on (subtotal - loyalty_discount) at boutique.tax_rate_bps" }
      - { name: store_credit_applied_cents, type: integer, source: computed, description: "Store credit redeemed against this order at capture", default: 0 }
      - { name: total_cents, type: integer, source: computed, description: "Net cash charged = subtotal - loyalty_discount + tax - store_credit_applied" }
      - { name: points_earned, type: integer, source: computed, description: "Loyalty points minted at capture; reversed on full refund", default: 0 }
      - { name: return_anchor_date, type: integer, source: computed, description: "boutique.current_business_date stamped at fulfillment COMPLETED; start of the return window", default: null }

  - name: OrderLine
    parent: SalesOrder
    common_fields: true
    fields:
      - { name: sales_order_id, type: string, source: system, description: "FK -> SalesOrder.id" }
      - { name: sku_variant_id, type: string, source: input, description: "FK -> SkuVariant.id" }
      - { name: qty, type: integer, source: input, description: "Units purchased on this line", constraints: ">= 1" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Style.current_price_cents snapshot at line creation" }
      - { name: line_total_cents, type: integer, source: computed, description: "unit_price_cents * qty (the per-line value summed by order_pricing)" }
      - { name: status, type: enum, source: system, description: "Line lifecycle", default: SOLD, constraints: "SOLD, RETURNED, EXCHANGED" }

  - name: ReturnRequest
    parent: SalesOrder
    common_fields: true
    fields:
      - { name: sales_order_id, type: string, source: system, description: "FK -> SalesOrder.id" }
      - { name: order_line_id, type: string, source: input, description: "FK -> OrderLine.id; the line being returned" }
      - { name: resolution, type: enum, source: input, description: "Requested resolution path", constraints: "REFUND, EXCHANGE" }
      - { name: exchange_sku_variant_id, type: string, source: input, description: "FK -> SkuVariant.id; required when resolution == EXCHANGE", default: null }
      - { name: status, type: enum, source: system, description: "Return lifecycle", default: REQUESTED, constraints: "REQUESTED, APPROVED, REJECTED, VOIDED" }
      - { name: refund_cents, type: integer, source: computed, description: "Store-credit refund amount granted on REFUND approval = returned line_total_cents", default: 0 }
      - { name: points_reversed, type: integer, source: computed, description: "Loyalty points clawed back on approval = points minted for the returned line", default: 0 }

  - name: SpecialOrder
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id" }
      - { name: source_sku_variant_id, type: string, source: input, description: "FK -> SkuVariant.id; the unit reserved for ship-from-store" }
      - { name: qty, type: integer, source: input, description: "Units to ship", constraints: ">= 1" }
      - { name: ship_to_state_code, type: string, source: input, description: "Destination state; selects nexus tax on the special order", constraints: "2-letter uppercase" }
      - { name: status, type: enum, source: system, description: "Special-order fulfillment lifecycle", default: PLACED, constraints: "PLACED, SOURCED, SHIPPED, DELIVERED, CANCELLED" }
      - { name: reserved_units, type: integer, source: computed, description: "Units this order currently holds reserved on the source variant (qty while PLACED/SOURCED, 0 once SHIPPED/CANCELLED)" }

  - name: Lookbook
    parent: Boutique
    common_fields: true
    fields:
      - { name: boutique_id, type: string, source: system, description: "FK -> Boutique.id" }
      - { name: title, type: string, source: input, description: "Lookbook title" }
      - { name: season, type: enum, source: input, description: "Season this lookbook curates", constraints: "SPRING, SUMMER, FALL, WINTER" }
      - { name: style_ids, type: array, source: input, description: "Ordered list of Style.id curated into this lookbook", default: [] }
      - { name: status, type: enum, source: system, description: "DRAFT editable; PUBLISHED frozen", default: DRAFT, constraints: "DRAFT, PUBLISHED" }
      - { name: featured_count, type: integer, source: computed, description: "Count of style_ids whose Style.clearance == false (full-price features)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # --- SalesOrder: PARALLEL dimensions (payment_status x fulfillment_status) ---
  - entity: SalesOrder
    field: payment_status
    initial_state: UNPAID
    terminal_states: [REFUNDED]
    transitions:
      - from: UNPAID
        to: AUTHORIZED
        trigger: "POST /sales-orders/{id}/authorize"
        actor: StoreAssociate
        preconditions:
          - "SalesOrder.fulfillment_status == OPEN"
          - "SalesOrder has >= 1 OrderLine"
          - "Customer.status == ACTIVE"
        side_effects:
          - "compute loyalty_discount_cents via order_pricing using Customer.loyalty_tier read NOW (before this order's capture)"
          - "compute subtotal_cents, tax_cents, total_cents via order_pricing"
          - "no inventory movement yet"
      - from: AUTHORIZED
        to: CAPTURED
        trigger: "POST /sales-orders/{id}/capture"
        actor: StoreAssociate
        preconditions:
          - "SalesOrder.payment_status == AUTHORIZED"
          - "every OrderLine's SkuVariant.available >= line qty (availability re-checked at capture)"
          - "redeem_store_credit <= Customer.store_credit_cents"
        side_effects:
          - "store_credit_applied_cents = min(redeem_store_credit, subtotal-loyalty_discount+tax)"
          - "recompute total_cents = subtotal - loyalty_discount + tax - store_credit_applied"
          - "decrement Customer.store_credit_cents by store_credit_applied_cents"
          - "for each OrderLine: decrement SkuVariant.on_hand by qty; recompute SkuVariant.available; bubble up Style.total_available"
          - "mint points_earned via loyalty_accrual; increment Customer.loyalty_points and Customer.captured_spend_cents; recompute Customer.loyalty_tier (actual variant)"
      - from: CAPTURED
        to: REFUNDED
        trigger: "system: last SOLD OrderLine of a CAPTURED order transitions to RETURNED (full return)"
        actor: system
        preconditions:
          - "all OrderLines of the order are RETURNED or EXCHANGED (none remain SOLD)"
        side_effects:
          - "reverse remaining points: decrement Customer.loyalty_points and Customer.captured_spend_cents to pre-order baseline; recompute Customer.loyalty_tier"
        note: "Compensating invariant: loyalty points conserved across capture+full-return (see calc loyalty_accrual)."

  - entity: SalesOrder
    field: fulfillment_status
    initial_state: OPEN
    terminal_states: [CANCELLED]
    transitions:
      - from: OPEN
        to: COMPLETED
        trigger: "POST /sales-orders/{id}/complete"
        actor: StoreAssociate
        preconditions:
          - "SalesOrder.payment_status == CAPTURED"
        side_effects:
          - "order becomes return-eligible; record completion against boutique.current_business_date as return-window anchor"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /sales-orders/{id}/cancel"
        actor: StoreAssociate
        preconditions:
          - "SalesOrder.payment_status IN {UNPAID, AUTHORIZED}"
        side_effects:
          - "no inventory was decremented (capture not reached); order voided"
        note: "Cross-axis guard: cancel forbidden once payment_status == CAPTURED (see §1.4)."

  # --- FittingRoomHold: BRANCHING with divergent side-effect sets per branch ---
  - entity: FittingRoomHold
    field: status
    initial_state: ACTIVE
    terminal_states: [CONVERTED, EXPIRED, RELEASED]
    transitions:
      - from: ACTIVE
        to: EXTENDED
        trigger: "POST /fitting-room-holds/{id}/extend"
        actor: StoreAssociate
        preconditions:
          - "FittingRoomHold.status == ACTIVE"
          - "new end_minute does not overlap another non-terminal hold on the same FittingRoom (half-open semantics)"
        side_effects:
          - "extend end_minute; reservation on SkuVariant persists (no inventory change)"
      - from: ACTIVE
        to: CONVERTED
        trigger: "POST /fitting-room-holds/{id}/convert"
        actor: StoreAssociate
        preconditions:
          - "FittingRoomHold.status IN {ACTIVE, EXTENDED}"
          - "a SalesOrder is supplied that contains an OrderLine for this hold's sku_variant_id"
        side_effects:
          - "set sales_order_id; reservation transfers to the sale (reserved decremented here, on_hand decremented at order capture)"
          - "recompute SkuVariant.reserved and SkuVariant.available; bubble up Style.total_available"
      - from: EXTENDED
        to: CONVERTED
        trigger: "POST /fitting-room-holds/{id}/convert"
        actor: StoreAssociate
        preconditions:
          - "FittingRoomHold.status IN {ACTIVE, EXTENDED}"
        side_effects:
          - "set sales_order_id; recompute SkuVariant.reserved and SkuVariant.available; bubble up Style.total_available"
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /fitting-room-holds/{id}/release"
        actor: StoreAssociate
        preconditions:
          - "FittingRoomHold.status IN {ACTIVE, EXTENDED}"
        side_effects:
          - "free the reservation: decrement SkuVariant.reserved by 1; recompute SkuVariant.available; bubble up Style.total_available (inventory-conservation compensating action)"
      - from: EXTENDED
        to: RELEASED
        trigger: "POST /fitting-room-holds/{id}/release"
        actor: StoreAssociate
        preconditions:
          - "FittingRoomHold.status IN {ACTIVE, EXTENDED}"
        side_effects:
          - "decrement SkuVariant.reserved by 1; recompute SkuVariant.available; bubble up Style.total_available"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /_clock/advance (system sweep: end_minute <= now and not converted)"
        actor: system
        preconditions:
          - "FittingRoomHold.status IN {ACTIVE, EXTENDED}"
          - "hold end_minute <= boutique current minute at sweep, or business date advanced past hold's day"
        side_effects:
          - "decrement SkuVariant.reserved by 1; recompute SkuVariant.available; bubble up Style.total_available"
      - from: EXTENDED
        to: EXPIRED
        trigger: "POST /_clock/advance (system sweep)"
        actor: system
        preconditions:
          - "FittingRoomHold.status IN {ACTIVE, EXTENDED}"
        side_effects:
          - "decrement SkuVariant.reserved by 1; recompute SkuVariant.available; bubble up Style.total_available"

  # --- StylingAppointment: BRANCHING fork (CONFIRMED -> {COMPLETED, NO_SHOW, CANCELLED}) ---
  - entity: StylingAppointment
    field: status
    initial_state: REQUESTED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /styling-appointments/{id}/confirm"
        actor: StoreAssociate
        preconditions:
          - "StylingAppointment.status == REQUESTED"
          - "Stylist.status == ACTIVE (cross-entity dependency)"
          - "interval does not collide with another CONFIRMED appointment on the stylist within buffer_minutes (closed-buffer semantics)"
        side_effects:
          - "appointment booked on the stylist's timeline"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /styling-appointments/{id}/cancel"
        actor: Customer
        preconditions:
          - "StylingAppointment.status IN {REQUESTED, CONFIRMED}"
        side_effects:
          - "release the stylist slot"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /styling-appointments/{id}/cancel"
        actor: Customer
        preconditions:
          - "StylingAppointment.status IN {REQUESTED, CONFIRMED}"
        side_effects:
          - "release the stylist slot"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /styling-appointments/{id}/complete"
        actor: StoreAssociate
        preconditions:
          - "StylingAppointment.status == CONFIRMED"
        side_effects:
          - "appointment fulfilled"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /styling-appointments/{id}/no-show"
        actor: StoreAssociate
        preconditions:
          - "StylingAppointment.status == CONFIRMED"
        side_effects:
          - "slot released; no penalty in v1"

  # --- MarkdownSchedule: BRANCHING with revert (SCHEDULED -> DRAFT) and supersede ---
  - entity: MarkdownSchedule
    field: status
    initial_state: DRAFT
    terminal_states: [ENDED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /markdown-schedules/{id}/schedule"
        actor: Merchandiser
        preconditions:
          - "MarkdownSchedule.status == DRAFT"
        side_effects:
          - "compute projected_price_cents via markdown_pricing (provisional variant)"
      - from: SCHEDULED
        to: DRAFT
        trigger: "POST /markdown-schedules/{id}/unschedule"
        actor: Merchandiser
        preconditions:
          - "MarkdownSchedule.status == SCHEDULED"
        side_effects:
          - "clear projected_price_cents back to null"
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /markdown-schedules/{id}/activate"
        actor: Merchandiser
        preconditions:
          - "MarkdownSchedule.status == SCHEDULED"
          - "boutique.current_business_date >= effective_date"
          - "no other MarkdownSchedule of the same Style is ACTIVE (the prior ACTIVE one is SUPERSEDED first by create-supersede, see §1.2.1)"
        side_effects:
          - "compute applied_price_cents via markdown_pricing (final variant) and write Style.current_price_cents"
          - "if phase == CLEARANCE set Style.clearance = true"
          - "CASCADE: for each ACTIVE/EXTENDED FittingRoomHold whose sku_variant belongs to this Style, refresh held_price_cents to the new Style.current_price_cents; recompute Lookbook.featured_count for lookbooks containing this style"
      - from: ACTIVE
        to: ENDED
        trigger: "POST /markdown-schedules/{id}/end"
        actor: Merchandiser
        preconditions:
          - "MarkdownSchedule.status == ACTIVE"
        side_effects:
          - "restore Style.current_price_cents = list_price_cents; set Style.clearance = false; refresh dependent held_price_cents and Lookbook.featured_count"
      - from: SCHEDULED
        to: SUPERSEDED
        trigger: "system: a newer MarkdownSchedule is created against the same Style (create-supersede)"
        actor: system
        preconditions:
          - "MarkdownSchedule.status IN {DRAFT, SCHEDULED}"
        side_effects:
          - "older schedule retired so only one is live per style"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system: a newer MarkdownSchedule is activated against the same Style"
        actor: system
        preconditions:
          - "MarkdownSchedule.status == ACTIVE"
        side_effects:
          - "old active schedule retired before the new one writes Style.current_price_cents"

  # --- ReturnRequest: BRANCHING fork (APPROVED vs REJECTED) with cascade + compensation ---
  - entity: ReturnRequest
    field: status
    initial_state: REQUESTED
    terminal_states: [REJECTED, VOIDED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /returns/{id}/approve"
        actor: StoreAssociate
        preconditions:
          - "ReturnRequest.status == REQUESTED"
          - "SalesOrder.fulfillment_status == COMPLETED (cross-entity dependency)"
          - "within return window: boutique.current_business_date - completion anchor <= boutique.return_window_days"
          - "if resolution == EXCHANGE: exchange SkuVariant.available >= 1"
        side_effects:
          - "CASCADE L1: set OrderLine.status = RETURNED (REFUND) or EXCHANGED (EXCHANGE)"
          - "CASCADE L2: that OrderLine status change increments its SkuVariant.on_hand by qty (restock) and recomputes SkuVariant.available"
          - "CASCADE L3: the SkuVariant.available change bubbles up to recompute Style.total_available"
          - "REFUND: grant refund_cents = line_total_cents to Customer.store_credit_cents (recompute boutique.store_credit_outstanding_cents)"
          - "EXCHANGE: reserve 1 unit of exchange SkuVariant (decrement its available)"
          - "reverse points_reversed (= points minted for this line) from Customer.loyalty_points and Customer.captured_spend_cents; recompute Customer.loyalty_tier"
          - "if no OrderLine remains SOLD, system transitions SalesOrder.payment_status CAPTURED -> REFUNDED"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /returns/{id}/reject"
        actor: StoreManager
        preconditions:
          - "ReturnRequest.status == REQUESTED"
        side_effects:
          - "no inventory or ledger change"
      - from: APPROVED
        to: VOIDED
        trigger: "POST /returns/{id}/void"
        actor: StoreManager
        preconditions:
          - "ReturnRequest.status == APPROVED"
          - "resolution == REFUND (only refund returns are voidable in v1)"
        side_effects:
          - "COMPENSATION: set OrderLine.status back to SOLD; decrement that SkuVariant.on_hand by qty; recompute available; bubble up Style.total_available"
          - "claw back refund_cents from Customer.store_credit_cents (store-credit conservation); recompute boutique.store_credit_outstanding_cents"
          - "re-mint points_reversed back onto Customer.loyalty_points and Customer.captured_spend_cents; recompute Customer.loyalty_tier"

  # --- SpecialOrder: branching lifecycle with cross-entity inventory dependency ---
  - entity: SpecialOrder
    field: status
    initial_state: PLACED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: PLACED
        to: SOURCED
        trigger: "POST /special-orders/{id}/source"
        actor: StoreAssociate
        preconditions:
          - "SpecialOrder.status == PLACED"
          - "source SkuVariant.available >= qty at sourcing time (cross-entity dependency)"
        side_effects:
          - "reserve qty units: increment source SkuVariant.reserved by qty; set reserved_units = qty; recompute available; bubble up Style.total_available"
      - from: SOURCED
        to: SHIPPED
        trigger: "POST /special-orders/{id}/ship"
        actor: StoreAssociate
        preconditions:
          - "SpecialOrder.status == SOURCED"
        side_effects:
          - "commit units: decrement source SkuVariant.on_hand by qty and reserved by qty; set reserved_units = 0; recompute available; bubble up Style.total_available"
      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /special-orders/{id}/deliver"
        actor: StoreAssociate
        preconditions:
          - "SpecialOrder.status == SHIPPED"
        side_effects:
          - "special order closed"
      - from: PLACED
        to: CANCELLED
        trigger: "POST /special-orders/{id}/cancel"
        actor: StoreAssociate
        preconditions:
          - "SpecialOrder.status IN {PLACED, SOURCED}"
        side_effects:
          - "release any reservation: decrement source SkuVariant.reserved by reserved_units; set reserved_units = 0; recompute available; bubble up Style.total_available (inventory-conservation compensating action)"
      - from: SOURCED
        to: CANCELLED
        trigger: "POST /special-orders/{id}/cancel"
        actor: StoreAssociate
        preconditions:
          - "SpecialOrder.status IN {PLACED, SOURCED}"
        side_effects:
          - "decrement source SkuVariant.reserved by reserved_units; set reserved_units = 0; recompute available; bubble up Style.total_available"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: markdown-create-stale-style
    parent_entity: Style
    write_endpoint: "POST /markdown-schedules"
    occ_field: "expected_style_version"
    description: |
      Creating a MarkdownSchedule against a Style whose version has advanced
      since the client last observed it is rejected with a stale-version error.
      A new schedule legitimately supersedes the prior DRAFT/SCHEDULED schedule
      for that style (create-supersede), so two creates that both believe they
      are starting from the same Style snapshot cannot both proceed; the one
      carrying the stale expected_style_version is rejected.
    error_id: ERR_STALE_STYLE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  # ---- Dual-variant #1 (domain: Style/MarkdownSchedule pricing) ----
  - name: markdown_pricing
    trigger: "projected_price_cents on SCHEDULED (preview); applied_price_cents on ACTIVATE (final write to Style.current_price_cents)"
    algorithm: tiered_pricing
    formula: |
      base = Style.list_price_cents
      if phase == CLEARANCE:
          # CLEARANCE stacks multiplicatively: if the style currently carries a
          # ACTIVE SEASONAL markdown (Style.current_price_cents < list_price_cents),
          # the clearance basis is that already-reduced current price; otherwise it
          # applies to list price directly.
          seasonal_basis = (Style.current_price_cents < base) ? Style.current_price_cents : base
          price = round_half_up(seasonal_basis * (100 - markdown_pct) / 100)
      else:   # SEASONAL
          price = round_half_up(base * (100 - markdown_pct) / 100)
      price = max(price, MIN_PRICE_CENTS)
    input_set: "single Style + this MarkdownSchedule; SEASONAL marks off list price, CLEARANCE may stack on the live seasonal price"
    constants:
      MIN_PRICE_CENTS: 100
    precision: "integer cents, round_half_up at the single multiplication step"
    variants:
      - name: provisional
        when: "computed at SCHEDULE time as projected_price_cents; uses Style.current_price_cents as it stands at scheduling"
        difference: "forward-looking preview; does NOT write Style.current_price_cents and does NOT re-read clearance basis at activation"
      - name: final
        when: "computed at ACTIVATE time as applied_price_cents; re-reads Style.current_price_cents at activation"
        difference: "if a SEASONAL markdown went ACTIVE on the same style between scheduling and activation of a CLEARANCE schedule, the seasonal_basis differs, so applied_price_cents diverges from projected_price_cents for the same schedule"

  # ---- Dual-variant #2 (domain: Customer loyalty) ----
  - name: loyalty_tier_eval
    trigger: "actual variant recomputed on capture/refund; projected variant on GET /customers/{id}/tier-projection"
    algorithm: threshold
    formula: |
      # actual: thresholds over already-captured net spend
      actual_tier = STANDARD
      if Customer.captured_spend_cents >= GOLD_THRESHOLD_CENTS: actual_tier = GOLD
      elif Customer.captured_spend_cents >= SILVER_THRESHOLD_CENTS: actual_tier = SILVER
      # projected: add the net cash of AUTHORIZED-but-not-yet-CAPTURED SalesOrders
      pending = sum(total_cents for o in SalesOrder
                    where o.customer_id == c.id and o.payment_status == AUTHORIZED)
      projected_basis = Customer.captured_spend_cents + pending
      projected_tier = STANDARD
      if projected_basis >= GOLD_THRESHOLD_CENTS: projected_tier = GOLD
      elif projected_basis >= SILVER_THRESHOLD_CENTS: projected_tier = SILVER
    input_set: "actual: captured orders only; projected: captured + AUTHORIZED pending"
    constants:
      SILVER_THRESHOLD_CENTS: 50000
      GOLD_THRESHOLD_CENTS: 150000
    precision: "integer cents; >= comparison at each threshold (boundary-exact)"
    variants:
      - name: actual
        when: "stored on Customer.loyalty_tier; updated by capture/refund side-effects"
        difference: "excludes AUTHORIZED pending orders"
      - name: projected
        when: "returned by the tier-projection read endpoint"
        difference: "includes AUTHORIZED pending net cash, so it can be a higher tier than actual for the same customer"

  # ---- Combinatorial mode (b): per-line-then-sum rounding order (Order pricing) ----
  - name: order_pricing
    trigger: "on POST /sales-orders/{id}/authorize (subtotal, loyalty_discount, tax); store_credit_applied and total finalized at capture"
    algorithm: aggregation
    formula: |
      # MODE (b): rounding order pinned — round each line, THEN sum.
      for each OrderLine:
          line_total_cents = OrderLine.unit_price_cents * OrderLine.qty   # exact integer
      subtotal_cents = sum(line_total_cents over OrderLines)              # sum of per-line integers
      # loyalty discount keyed on tier read BEFORE this order's capture (see order_pricing note)
      disc_rate_bps = TIER_DISCOUNT_BPS[Customer.loyalty_tier]
      loyalty_discount_cents = round_half_up(subtotal_cents * disc_rate_bps / 10000)  # round AFTER summing subtotal
      taxable_cents = subtotal_cents - loyalty_discount_cents
      tax_cents = round_half_up(taxable_cents * boutique.tax_rate_bps / 10000)
      # at capture:
      store_credit_applied_cents = min(redeem_store_credit, subtotal_cents - loyalty_discount_cents + tax_cents)
      total_cents = subtotal_cents - loyalty_discount_cents + tax_cents - store_credit_applied_cents
    input_set: "all OrderLines of this order; unit_price_cents already snapshotted at line creation"
    constants:
      TIER_DISCOUNT_BPS: { STANDARD: 0, SILVER: 500, GOLD: 1000 }
    precision: "integer cents, round_half_up; rounding applied per the pinned order: line products are exact, discount/tax rounded once after summation"
    variants:
      - name: per_line_then_sum
        when: "the only sanctioned order; documented to contrast with the forbidden sum-then-round path"
        difference: "line products are exact integers so order is moot at the line step, but discount and tax are each rounded exactly once over the summed subtotal, NOT per line"

  # ---- Combinatorial mode (c): circular-looking dependency, evaluation order pinned ----
  - name: loyalty_accrual
    trigger: "points_earned minted on capture; reversed on full refund / return approval"
    algorithm: threshold
    formula: |
      # MODE (c): points depend on net captured cash, which depends on store_credit_applied,
      # which depends on total — pin evaluation order to break the apparent cycle.
      # Step 1: total_cents already finalized by order_pricing at capture (store_credit_applied resolved first).
      # Step 2: accrual basis is the NET CASH actually paid, i.e., total_cents (store-credit-funded cents earn NO points).
      net_cash_basis = SalesOrder.total_cents
      points_earned = floor(net_cash_basis / POINTS_DIVISOR_CENTS)
      # On full return of a line, reverse exactly the points that line contributed:
      line_share = round_half_up(points_earned * (OrderLine.line_total_cents / subtotal_cents))
      points_reversed = line_share
    input_set: "one captured SalesOrder; per-line reversal prorates points by line_total share of subtotal"
    constants:
      POINTS_DIVISOR_CENTS: 100
    precision: "floor for minting; round_half_up for per-line reversal share; net of reversals never below 0"
    variants:
      - name: mint
        when: "at capture"
        difference: "uses total_cents (net cash) as basis — store-credit-funded portion earns nothing"
      - name: reverse
        when: "at return approval / full refund"
        difference: "prorated clawback of the minted points by line share; the conservation invariant requires sum of reversals over all lines == points_earned"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the acting role is permitted to perform this operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "every path/body resource id resolves to an existing entity (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: business_referential
    check: "ownership: a Customer acting on a hold/appointment/order/special-order must be that resource's customer_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "customer-owned mutations"

  - priority: 5
    category: business_constraint
    check: "request body well-formed: required fields present, enums in range, qty>=1, minute fields in [0,1440], end_minute>start_minute"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all writes"

  - priority: 6
    category: state
    check: "target resource is in a state from which this transition is defined (§1.2 from-state)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 7
    category: business_referential
    check: "OCC: expected_style_version on POST /markdown-schedules matches current Style.version"
    error_id: ERR_STALE_STYLE_VERSION
    http_status: 412
    applies_to: "POST /markdown-schedules"

  # --- Return path: STATE before TEMPORAL (priority pair #1) ---
  - priority: 8
    category: state
    check: "return approval requires SalesOrder.fulfillment_status == COMPLETED"
    error_id: ERR_ORDER_NOT_RETURNABLE_STATE
    http_status: 409
    applies_to: "POST /returns/{id}/approve"

  - priority: 9
    category: business_temporal
    check: "return approval within window: current_business_date - completion anchor <= boutique.return_window_days"
    error_id: ERR_RETURN_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /returns/{id}/approve"

  # --- Appointment path: STATE/cross-entity before TEMPORAL overlap ---
  - priority: 10
    category: state
    check: "stylist must be ACTIVE to confirm an appointment (cross-entity)"
    error_id: ERR_STYLIST_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /styling-appointments/{id}/confirm"

  - priority: 11
    category: business_temporal
    check: "appointment confirm must not collide with another CONFIRMED appointment on the stylist within buffer_minutes (closed-buffer overlap)"
    error_id: ERR_STYLIST_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /styling-appointments/{id}/confirm"

  # --- Hold path: half-open room overlap, then sku availability ---
  - priority: 12
    category: business_temporal
    check: "fitting-room hold must not overlap another non-terminal hold on the same room (half-open [start,end) semantics; back-to-back allowed)"
    error_id: ERR_ROOM_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /fitting-room-holds, POST /fitting-room-holds/{id}/extend"

  - priority: 13
    category: business_constraint
    check: "sku availability: reserving for a hold/special-order requires SkuVariant.available >= units and SkuVariant.status == STOCKED"
    error_id: ERR_INSUFFICIENT_INVENTORY
    http_status: 409
    applies_to: "POST /fitting-room-holds, POST /special-orders/{id}/source, POST /sales-orders/{id}/capture"

  # --- Capture path: business_constraint (inventory) before business_fiscal (credit) — priority pair #2 ---
  - priority: 14
    category: business_fiscal
    check: "store-credit redemption cannot exceed Customer.store_credit_cents at capture"
    error_id: ERR_INSUFFICIENT_STORE_CREDIT
    http_status: 422
    applies_to: "POST /sales-orders/{id}/capture"

  - priority: 15
    category: business_constraint
    check: "markdown activation requires boutique.current_business_date >= effective_date"
    error_id: ERR_MARKDOWN_NOT_EFFECTIVE
    http_status: 409
    applies_to: "POST /markdown-schedules/{id}/activate"

  - priority: 16
    category: business_constraint
    check: "uniqueness: Customer.email unique per boutique; Style.style_code unique per boutique"
    error_id: ERR_DUPLICATE_KEY
    http_status: 409
    applies_to: "POST /customers, POST /styles"

  - priority: 17
    category: business_constraint
    check: "EXCHANGE return requires exchange_sku_variant_id present and that variant has available >= 1"
    error_id: ERR_EXCHANGE_UNAVAILABLE
    http_status: 409
    applies_to: "POST /returns/{id}/approve"

  - priority: 18
    category: state
    check: "a PUBLISHED lookbook cannot be patched or re-published (frozen)"
    error_id: ERR_LOOKBOOK_FROZEN
    http_status: 409
    applies_to: "PATCH /lookbooks/{id}, POST /lookbooks/{id}/publish"

  - priority: 19
    category: business_constraint
    check: "pagination limit in [1,100] and offset >= 0"
    error_id: ERR_VALIDATION_LIMIT
    http_status: 400
    applies_to: "all list endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- Boutique ----
  - { method: POST, path: "/boutiques", description: "Create a boutique", roles: [StoreManager], code: 201, input: [name, state_code, tax_rate_bps, "return_window_days?"], output: Boutique, side_effects: ["init current_business_date=0"] }
  - { method: GET, path: "/boutiques/{id}", description: "Get boutique", roles: [StoreManager, Merchandiser, StoreAssociate], code: 200, input: [], output: Boutique }
  - { method: GET, path: "/boutiques", description: "List boutiques", roles: [StoreManager, Merchandiser, StoreAssociate], code: 200, input: ["limit?", "offset?"], output: "Boutique[]" }
  - { method: POST, path: "/_clock/advance", description: "Test clock: set boutique current_business_date and sweep expired holds", roles: [StoreManager], code: 200, input: [boutique_id, to_business_date, "to_minute?"], output: Boutique, side_effects: ["set current_business_date", "sweep ACTIVE/EXTENDED holds whose interval has passed to EXPIRED with inventory release"] }

  # ---- Customer ----
  - { method: POST, path: "/customers", description: "Register a customer", roles: [StoreManager, StoreAssociate], code: 201, input: [boutique_id, full_name, email], output: Customer, side_effects: ["status=ACTIVE, store_credit_cents=0, loyalty_points=0, captured_spend_cents=0, loyalty_tier=STANDARD"] }
  - { method: GET, path: "/customers/{id}", description: "Get customer", roles: [StoreManager, StoreAssociate, Customer], code: 200, input: [], output: Customer }
  - { method: GET, path: "/customers", description: "List/filter customers", roles: [StoreManager, StoreAssociate], code: 200, input: ["boutique_id?", "limit?", "offset?"], output: "Customer[]" }
  - { method: GET, path: "/customers/{id}/tier-projection", description: "Projected loyalty tier including AUTHORIZED pending orders (dual-variant read)", roles: [StoreManager, StoreAssociate, Customer], code: 200, input: [], output: "{ actual_tier: string, projected_tier: string, projected_basis_cents: integer }" }
  - { method: POST, path: "/customers/{id}/store-credit-grants", description: "Grant store credit (manager adjustment / goodwill)", roles: [StoreManager], code: 201, input: [amount_cents], output: Customer, side_effects: ["increment store_credit_cents", "recompute boutique.store_credit_outstanding_cents"] }

  # ---- Style + SkuVariant ----
  - { method: POST, path: "/styles", description: "Create a style", roles: [Merchandiser], code: 201, input: [boutique_id, style_code, name, category, season, list_price_cents], output: Style, side_effects: ["current_price_cents=list_price_cents, clearance=false, total_available=0"] }
  - { method: GET, path: "/styles/{id}", description: "Get style", roles: [StoreManager, Merchandiser, StoreAssociate, Customer], code: 200, input: [], output: Style }
  - { method: GET, path: "/styles", description: "List/filter styles", roles: [StoreManager, Merchandiser, StoreAssociate, Customer], code: 200, input: ["boutique_id?", "season?", "category?", "limit?", "offset?"], output: "Style[]" }
  - { method: POST, path: "/styles/{id}/sku-variants", description: "Add a size/color variant with initial on-hand", roles: [Merchandiser], code: 201, input: [size, color, on_hand], output: SkuVariant, side_effects: ["available=on_hand, reserved=0", "bubble up Style.total_available"] }
  - { method: GET, path: "/styles/{id}/sku-variants", description: "List a style's SkuVariants (FK reverse-reachability)", roles: [StoreManager, Merchandiser, StoreAssociate, Customer], code: 200, input: [], output: "SkuVariant[]" }
  - { method: GET, path: "/sku-variants/{id}", description: "Get a SkuVariant", roles: [StoreManager, Merchandiser, StoreAssociate, Customer], code: 200, input: [], output: SkuVariant }
  - { method: POST, path: "/sku-variants/{id}/restock", description: "Restock units onto a variant", roles: [Merchandiser], code: 200, input: [units], output: SkuVariant, side_effects: ["increment on_hand and available by units", "bubble up Style.total_available"] }

  # ---- MarkdownSchedule ----
  - { method: POST, path: "/markdown-schedules", description: "Create a markdown schedule for a style (OCC create-supersede on Style)", roles: [Merchandiser], code: 201, input: [style_id, phase, markdown_pct, effective_date, expected_style_version], output: MarkdownSchedule, side_effects: ["status=DRAFT", "SUPERSEDE any prior DRAFT/SCHEDULED schedule of the style", "increments Style.version by 1"] }
  - { method: GET, path: "/markdown-schedules/{id}", description: "Get a markdown schedule", roles: [StoreManager, Merchandiser], code: 200, input: [], output: MarkdownSchedule }
  - { method: GET, path: "/markdown-schedules", description: "List markdown schedules (filter by style)", roles: [StoreManager, Merchandiser], code: 200, input: ["style_id?", "status?", "limit?", "offset?"], output: "MarkdownSchedule[]" }
  - { method: POST, path: "/markdown-schedules/{id}/schedule", description: "DRAFT->SCHEDULED; compute projected_price_cents", roles: [Merchandiser], code: 200, input: [], output: MarkdownSchedule, side_effects: ["projected_price_cents via markdown_pricing(provisional)"] }
  - { method: POST, path: "/markdown-schedules/{id}/unschedule", description: "SCHEDULED->DRAFT; clear projected price", roles: [Merchandiser], code: 200, input: [], output: MarkdownSchedule, side_effects: ["projected_price_cents=null"] }
  - { method: POST, path: "/markdown-schedules/{id}/activate", description: "SCHEDULED->ACTIVE; write Style.current_price_cents and cascade to holds/lookbooks", roles: [Merchandiser], code: 200, input: [], output: MarkdownSchedule, side_effects: ["applied_price_cents via markdown_pricing(final)", "Style.current_price_cents updated; clearance set if phase CLEARANCE", "CASCADE refresh held_price_cents on ACTIVE/EXTENDED holds of the style", "recompute Lookbook.featured_count"] }
  - { method: POST, path: "/markdown-schedules/{id}/end", description: "ACTIVE->ENDED; restore list price", roles: [Merchandiser], code: 200, input: [], output: MarkdownSchedule, side_effects: ["Style.current_price_cents=list_price_cents; clearance=false; refresh dependent holds/lookbooks"] }

  # ---- FittingRoom + FittingRoomHold ----
  - { method: POST, path: "/fitting-rooms", description: "Create a fitting room", roles: [StoreManager, StoreAssociate], code: 201, input: [boutique_id, label], output: FittingRoom, side_effects: ["status=OPEN"] }
  - { method: GET, path: "/fitting-rooms/{id}", description: "Get a fitting room", roles: [StoreManager, StoreAssociate, Customer], code: 200, input: [], output: FittingRoom }
  - { method: GET, path: "/fitting-rooms", description: "List fitting rooms", roles: [StoreManager, StoreAssociate, Customer], code: 200, input: ["boutique_id?", "limit?", "offset?"], output: "FittingRoom[]" }
  - { method: POST, path: "/fitting-room-holds", description: "Reserve a sku in a room for an interval", roles: [StoreAssociate, Customer], code: 201, input: [fitting_room_id, customer_id, sku_variant_id, start_minute, end_minute], output: FittingRoomHold, side_effects: ["reserve 1 unit: increment SkuVariant.reserved, recompute available, bubble Style.total_available", "snapshot held_price_cents", "status=ACTIVE"] }
  - { method: GET, path: "/fitting-room-holds/{id}", description: "Get a hold", roles: [StoreManager, StoreAssociate, Customer], code: 200, input: [], output: FittingRoomHold }
  - { method: GET, path: "/fitting-rooms/{id}/holds", description: "List holds of a room (FK reverse-reachability)", roles: [StoreManager, StoreAssociate, Customer], code: 200, input: [], output: "FittingRoomHold[]" }
  - { method: GET, path: "/fitting-room-holds", description: "List/filter holds (by customer, sku, or converted sales order)", roles: [StoreManager, StoreAssociate, Customer], code: 200, input: ["customer_id?", "sku_variant_id?", "sales_order_id?", "limit?", "offset?"], output: "FittingRoomHold[]" }
  - { method: POST, path: "/fitting-room-holds/{id}/extend", description: "ACTIVE->EXTENDED; lengthen interval", roles: [StoreAssociate, Customer], code: 200, input: [end_minute], output: FittingRoomHold, side_effects: ["re-check room overlap; persist reservation"] }
  - { method: POST, path: "/fitting-room-holds/{id}/convert", description: "Convert hold to a sale line (transfers reservation)", roles: [StoreAssociate], code: 200, input: [sales_order_id], output: FittingRoomHold, side_effects: ["set sales_order_id; recompute SkuVariant.reserved/available; bubble Style.total_available"] }
  - { method: POST, path: "/fitting-room-holds/{id}/release", description: "Release a hold; free reservation", roles: [StoreAssociate, Customer], code: 200, input: [], output: FittingRoomHold, side_effects: ["decrement SkuVariant.reserved; recompute available; bubble Style.total_available"] }

  # ---- Stylist + StylingAppointment ----
  - { method: POST, path: "/stylists", description: "Create a stylist", roles: [StoreManager], code: 201, input: [boutique_id, full_name, "buffer_minutes?"], output: Stylist, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/stylists/{id}", description: "Get a stylist", roles: [StoreManager, StoreAssociate, Customer], code: 200, input: [], output: Stylist }
  - { method: GET, path: "/stylists", description: "List stylists", roles: [StoreManager, StoreAssociate, Customer], code: 200, input: ["boutique_id?", "limit?", "offset?"], output: "Stylist[]" }
  - { method: POST, path: "/stylists/{id}/status", description: "Set stylist ACTIVE/OFF", roles: [StoreManager], code: 200, input: [status], output: Stylist, side_effects: ["set status"] }
  - { method: POST, path: "/styling-appointments", description: "Request a styling appointment", roles: [StoreAssociate, Customer], code: 201, input: [stylist_id, customer_id, start_minute, end_minute], output: StylingAppointment, side_effects: ["status=REQUESTED"] }
  - { method: GET, path: "/styling-appointments/{id}", description: "Get an appointment", roles: [StoreManager, StoreAssociate, Customer], code: 200, input: [], output: StylingAppointment }
  - { method: GET, path: "/stylists/{id}/appointments", description: "List a stylist's appointments (FK reverse-reachability)", roles: [StoreManager, StoreAssociate, Customer], code: 200, input: [], output: "StylingAppointment[]" }
  - { method: GET, path: "/styling-appointments", description: "List/filter appointments (by customer)", roles: [StoreManager, StoreAssociate, Customer], code: 200, input: ["customer_id?", "limit?", "offset?"], output: "StylingAppointment[]" }
  - { method: POST, path: "/styling-appointments/{id}/confirm", description: "REQUESTED->CONFIRMED; buffer overlap + stylist-active check", roles: [StoreAssociate], code: 200, input: [], output: StylingAppointment, side_effects: ["book slot"] }
  - { method: POST, path: "/styling-appointments/{id}/cancel", description: "Cancel an appointment", roles: [StoreAssociate, Customer], code: 200, input: [], output: StylingAppointment, side_effects: ["release slot"] }
  - { method: POST, path: "/styling-appointments/{id}/complete", description: "CONFIRMED->COMPLETED", roles: [StoreAssociate], code: 200, input: [], output: StylingAppointment, side_effects: ["fulfilled"] }
  - { method: POST, path: "/styling-appointments/{id}/no-show", description: "CONFIRMED->NO_SHOW", roles: [StoreAssociate], code: 200, input: [], output: StylingAppointment, side_effects: ["release slot"] }

  # ---- SalesOrder + OrderLine ----
  - { method: POST, path: "/sales-orders", description: "Open a sales order for a customer", roles: [StoreAssociate], code: 201, input: [customer_id], output: SalesOrder, side_effects: ["payment_status=UNPAID, fulfillment_status=OPEN"] }
  - { method: GET, path: "/sales-orders/{id}", description: "Get a sales order", roles: [StoreManager, StoreAssociate, Customer], code: 200, input: [], output: SalesOrder }
  - { method: GET, path: "/sales-orders", description: "List/filter sales orders (by customer or boutique)", roles: [StoreManager, StoreAssociate, Customer], code: 200, input: ["customer_id?", "boutique_id?", "limit?", "offset?"], output: "SalesOrder[]" }
  - { method: POST, path: "/sales-orders/{id}/lines", description: "Add an order line (snapshots current price)", roles: [StoreAssociate], code: 201, input: [sku_variant_id, qty], output: OrderLine, side_effects: ["unit_price_cents=Style.current_price_cents; line_total_cents=unit_price*qty"] }
  - { method: GET, path: "/sales-orders/{id}/lines", description: "List order lines of an order (FK reverse-reachability)", roles: [StoreManager, StoreAssociate, Customer], code: 200, input: [], output: "OrderLine[]" }
  - { method: GET, path: "/order-lines/{id}", description: "Get an order line", roles: [StoreManager, StoreAssociate, Customer], code: 200, input: [], output: OrderLine }
  - { method: GET, path: "/order-lines", description: "List/filter order lines (by sku variant; FK reverse-reachability)", roles: [StoreManager, StoreAssociate, Customer], code: 200, input: ["sku_variant_id?", "limit?", "offset?"], output: "OrderLine[]" }
  - { method: POST, path: "/sales-orders/{id}/authorize", description: "UNPAID->AUTHORIZED; price the order", roles: [StoreAssociate], code: 200, input: [], output: SalesOrder, side_effects: ["compute subtotal/loyalty_discount/tax via order_pricing"] }
  - { method: POST, path: "/sales-orders/{id}/capture", description: "AUTHORIZED->CAPTURED; redeem credit, decrement inventory, mint points", roles: [StoreAssociate], code: 200, input: ["redeem_store_credit?"], output: SalesOrder, side_effects: ["store_credit_applied + total finalize", "decrement on_hand per line; bubble Style.total_available", "mint points; update captured_spend_cents and loyalty_tier"] }
  - { method: POST, path: "/sales-orders/{id}/complete", description: "fulfillment OPEN->COMPLETED; set return anchor", roles: [StoreAssociate], code: 200, input: [], output: SalesOrder, side_effects: ["return-window anchor at current_business_date"] }
  - { method: POST, path: "/sales-orders/{id}/cancel", description: "fulfillment OPEN->CANCELLED (pre-capture only)", roles: [StoreAssociate], code: 200, input: [], output: SalesOrder, side_effects: ["void order"] }

  # ---- ReturnRequest ----
  - { method: POST, path: "/returns", description: "File a return/exchange against an order line", roles: [StoreAssociate, Customer], code: 201, input: [sales_order_id, order_line_id, resolution, "exchange_sku_variant_id?"], output: ReturnRequest, side_effects: ["status=REQUESTED"] }
  - { method: GET, path: "/returns/{id}", description: "Get a return request", roles: [StoreManager, StoreAssociate, Customer], code: 200, input: [], output: ReturnRequest }
  - { method: GET, path: "/sales-orders/{id}/returns", description: "List returns for an order (FK reverse-reachability)", roles: [StoreManager, StoreAssociate, Customer], code: 200, input: [], output: "ReturnRequest[]" }
  - { method: GET, path: "/returns", description: "List/filter returns (by order line or exchange variant)", roles: [StoreManager, StoreAssociate, Customer], code: 200, input: ["order_line_id?", "exchange_sku_variant_id?", "limit?", "offset?"], output: "ReturnRequest[]" }
  - { method: POST, path: "/returns/{id}/approve", description: "REQUESTED->APPROVED; restock + refund/exchange cascade", roles: [StoreAssociate], code: 200, input: [], output: ReturnRequest, side_effects: ["OrderLine->RETURNED/EXCHANGED; restock sku; bubble Style.total_available; refund store credit OR reserve exchange; reverse points; maybe order->REFUNDED"] }
  - { method: POST, path: "/returns/{id}/reject", description: "REQUESTED->REJECTED", roles: [StoreManager], code: 200, input: [], output: ReturnRequest, side_effects: ["no change"] }
  - { method: POST, path: "/returns/{id}/void", description: "APPROVED->VOIDED (refund only); compensate restock + credit + points", roles: [StoreManager], code: 200, input: [], output: ReturnRequest, side_effects: ["OrderLine->SOLD; un-restock; claw back store credit; re-mint points"] }

  # ---- SpecialOrder ----
  - { method: POST, path: "/special-orders", description: "Place a ship-from-store special order", roles: [StoreAssociate, Customer], code: 201, input: [customer_id, source_sku_variant_id, qty, ship_to_state_code], output: SpecialOrder, side_effects: ["status=PLACED; reserved_units=0 (reservation happens at source)"] }
  - { method: GET, path: "/special-orders/{id}", description: "Get a special order", roles: [StoreManager, StoreAssociate, Customer], code: 200, input: [], output: SpecialOrder }
  - { method: GET, path: "/special-orders", description: "List/filter special orders (by customer or source sku)", roles: [StoreManager, StoreAssociate, Customer], code: 200, input: ["customer_id?", "source_sku_variant_id?", "limit?", "offset?"], output: "SpecialOrder[]" }
  - { method: POST, path: "/special-orders/{id}/source", description: "PLACED->SOURCED; reserve units", roles: [StoreAssociate], code: 200, input: [], output: SpecialOrder, side_effects: ["reserve qty on source sku; recompute available; bubble Style.total_available"] }
  - { method: POST, path: "/special-orders/{id}/ship", description: "SOURCED->SHIPPED; commit units", roles: [StoreAssociate], code: 200, input: [], output: SpecialOrder, side_effects: ["decrement on_hand and reserved by qty; bubble Style.total_available"] }
  - { method: POST, path: "/special-orders/{id}/deliver", description: "SHIPPED->DELIVERED", roles: [StoreAssociate], code: 200, input: [], output: SpecialOrder, side_effects: ["close"] }
  - { method: POST, path: "/special-orders/{id}/cancel", description: "PLACED/SOURCED->CANCELLED; release reservation", roles: [StoreAssociate], code: 200, input: [], output: SpecialOrder, side_effects: ["release reserved_units; recompute available; bubble Style.total_available"] }

  # ---- Lookbook ----
  - { method: POST, path: "/lookbooks", description: "Create a lookbook", roles: [Merchandiser], code: 201, input: [boutique_id, title, season, "style_ids?"], output: Lookbook, side_effects: ["status=DRAFT; compute featured_count"] }
  - { method: GET, path: "/lookbooks/{id}", description: "Get a lookbook", roles: [StoreManager, Merchandiser, StoreAssociate, Customer], code: 200, input: [], output: Lookbook }
  - { method: GET, path: "/lookbooks", description: "List/filter lookbooks", roles: [StoreManager, Merchandiser, StoreAssociate, Customer], code: 200, input: ["boutique_id?", "season?", "limit?", "offset?"], output: "Lookbook[]" }
  - { method: PATCH, path: "/lookbooks/{id}", description: "Edit a DRAFT lookbook's styles/title", roles: [Merchandiser], code: 200, input: ["title?", "style_ids?"], output: Lookbook, side_effects: ["recompute featured_count"] }
  - { method: POST, path: "/lookbooks/{id}/publish", description: "DRAFT->PUBLISHED; freeze", roles: [Merchandiser], code: 200, input: [], output: Lookbook, side_effects: ["status=PUBLISHED"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing/invalid auth headers or unknown role" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "role not permitted for this operation per §1.7" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Customer acting on a resource whose customer_id is not their own id" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "referenced resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "malformed body: missing required field, bad enum, qty<1, minute out of [0,1440], end<=start" }
  - { id: ERR_DUPLICATE_KEY, http: 409, condition: "Customer.email or Style.style_code already exists in the boutique" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "transition not defined from the resource's current state" }
  - { id: ERR_STALE_STYLE_VERSION, http: 412, condition: "expected_style_version != current Style.version on markdown create" }
  - { id: ERR_ORDER_NOT_RETURNABLE_STATE, http: 409, condition: "return approval attempted while SalesOrder.fulfillment_status != COMPLETED" }
  - { id: ERR_RETURN_WINDOW_CLOSED, http: 422, condition: "return approval after return_window_days elapsed since completion anchor" }
  - { id: ERR_STYLIST_NOT_ACTIVE, http: 409, condition: "appointment confirm while Stylist.status != ACTIVE" }
  - { id: ERR_STYLIST_DOUBLE_BOOKED, http: 409, condition: "appointment confirm collides with another CONFIRMED appointment within buffer_minutes" }
  - { id: ERR_ROOM_DOUBLE_BOOKED, http: 409, condition: "hold create/extend overlaps another non-terminal hold on the same room (half-open)" }
  - { id: ERR_INSUFFICIENT_INVENTORY, http: 409, condition: "SkuVariant.available < requested units or variant DISCONTINUED" }
  - { id: ERR_INSUFFICIENT_STORE_CREDIT, http: 422, condition: "redeem_store_credit exceeds Customer.store_credit_cents at capture" }
  - { id: ERR_MARKDOWN_NOT_EFFECTIVE, http: 409, condition: "markdown activate before boutique.current_business_date reaches effective_date" }
  - { id: ERR_EXCHANGE_UNAVAILABLE, http: 409, condition: "EXCHANGE return missing exchange_sku_variant_id or that variant has available < 1" }
  - { id: ERR_LOOKBOOK_FROZEN, http: 409, condition: "edit/patch attempted on a PUBLISHED lookbook" }
  - { id: ERR_VALIDATION_LIMIT, http: 400, condition: "pagination limit/offset out of [1,100]/[0,inf)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "Shopper acting on own holds, appointments, returns, and special orders"
    identity: "entity_backed:Customer"
    exclusive_operations: []
    shared_operations:
      - "POST /fitting-room-holds (own customer_id)"
      - "POST /fitting-room-holds/{id}/extend, /release (own holds)"
      - "POST /styling-appointments (own customer_id)"
      - "POST /styling-appointments/{id}/cancel (own appointments)"
      - "POST /returns (own orders)"
      - "POST /special-orders (own customer_id)"
      - "GET own customer/order/hold/appointment/return/special-order/style/lookbook reads"

  - name: StoreAssociate
    description: "Floor staff running holds, sales, captures, returns intake, special-order fulfillment, appointment confirm/complete"
    identity: "opaque"
    exclusive_operations:
      - "POST /sales-orders and /sales-orders/{id}/(lines|authorize|capture|complete|cancel)"
      - "POST /fitting-room-holds/{id}/convert"
      - "POST /styling-appointments/{id}/(confirm|complete|no-show)"
      - "POST /returns/{id}/approve"
      - "POST /special-orders/{id}/(source|ship|deliver|cancel)"
    shared_operations:
      - "POST /customers, /fitting-rooms, /fitting-room-holds (and extend/release), /styling-appointments, /returns, /special-orders"
      - "GET reads across boutique resources"

  - name: Merchandiser
    description: "Owns product catalog: styles, SKU variants, markdown schedules, lookbooks"
    identity: "opaque"
    exclusive_operations:
      - "POST /styles, /styles/{id}/sku-variants, /sku-variants/{id}/restock"
      - "POST /markdown-schedules and all markdown transition endpoints"
      - "POST /lookbooks, PATCH /lookbooks/{id}, POST /lookbooks/{id}/publish"
    shared_operations:
      - "GET catalog reads"

  - name: StoreManager
    description: "Operational override + admin: boutique setup, clock, store-credit grants, return reject/void, stylist roster"
    identity: "opaque"
    exclusive_operations:
      - "POST /boutiques, /_clock/advance"
      - "POST /customers/{id}/store-credit-grants"
      - "POST /stylists, /stylists/{id}/status"
      - "POST /returns/{id}/reject, /returns/{id}/void"
    shared_operations:
      - "GET reads across all resources"
