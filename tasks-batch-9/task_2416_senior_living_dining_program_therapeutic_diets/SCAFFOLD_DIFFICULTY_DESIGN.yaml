            - call: "POST /residents"
              payload: { community_id: "${c_id}", full_name: "Priya Deshmukh", care_level: "MEMORY_CARE", baseline_weight_kg: 58.0 }
              as: ProgramAdministrator
              captures: { r_id: $.data.id, r_v: $.data.version }
            - call: "POST /diet-orders"
              payload: { resident_id: "${r_id}", texture_level: "REGULAR", liquid_consistency: "THIN", expected_resident_version: "${r_v}" }
              as: ClinicalStaff
              as_user_id: "cs-1"
              captures: { do_id: $.data.id }
            - call: "POST /diet-orders/${do_id}/dietitian-review"
              payload: { decision: "APPROVE" }
              as: RegisteredDietitian
              as_user_id: "rd-1"
            - call: "POST /venues/${v_id}/temperature-logs"
              payload: { probe_point: "HOT_HOLDING", temperature_f: 120.0 }
              as: SatelliteKitchenLead
              captures: { log1_in_range: $.data.in_range, log1_seq: $.data.violation_sequence_index }
            - call: "POST /venues/${v_id}/temperature-logs"
              payload: { probe_point: "HOT_HOLDING", temperature_f: 120.0 }
              as: SatelliteKitchenLead
              captures: { log2_seq: $.data.violation_sequence_index }
            - call: "GET /venues/${v_id}"
              payload: {}
              as: SatelliteKitchenLead
              captures: { posture_watch: $.data.temp_compliance_posture, count_watch: $.data.consecutive_temp_violation_count }
          trigger:
            - call: "POST /meal-tickets"
              payload: { venue_id: "${v_id}", ticket_type: "GUEST", service_date: "2026-08-10", meal_period: "LUNCH", resident_id: "${r_id}" }
              as: SatelliteKitchenLead
              captures: { guest_error: $.data.error_id, guest_message: $.data.message }
            - call: "POST /meal-tickets"
              payload: { venue_id: "${v_id}", ticket_type: "RESIDENT", service_date: "2026-08-10", meal_period: "LUNCH", resident_id: "${r_id}" }
              as: SatelliteKitchenLead
              captures: { res_ticket_id: $.data.id, res_ticket_amount: $.data.billed_amount_cents }
            - call: "POST /venues/${v_id}/temperature-logs"
              payload: { probe_point: "HOT_HOLDING", temperature_f: 120.0 }
              as: SatelliteKitchenLead
              captures: { log3_seq: $.data.violation_sequence_index }
            - call: "GET /venues/${v_id}"
