  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: markdown_window_overlap_rejected_half_open
        grounds:
          - validations[priority=12]
          - entities.Markdown.fields.effective_from
          - entities.Markdown.fields.effective_until
        distinguishing_aspect: "Markdown intervals on a Sku use half-open [from, until) semantics: a second markdown overlapping the first by any positive measure is rejected with ERR_MARKDOWN_OVERLAP, while a window starting exactly at the first's effective_until (touching adjacency) is allowed."
        test_recipe:
          setup:
            - "A SKU with a SEASONAL markdown [2026-03-01, 2026-04-01)."
          setup_api_calls:
            - call: "POST /skus"
              payload: { sport: "APPAREL", name: "Hoodie", base_price_cents: 6000, size_label: "L" }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /markdowns"
              payload: { sku_id: "${sku_id}", markdown_kind: "SEASONAL", percent_off: 20, effective_from: "2026-03-01T00:00:00Z", effective_until: "2026-04-01T00:00:00Z" }
              as: PriceAdmin
          trigger:
            - call: "POST /markdowns"
              payload: { sku_id: "${sku_id}", markdown_kind: "CLEARANCE", percent_off: 40, effective_from: "2026-03-15T00:00:00Z", effective_until: "2026-05-01T00:00:00Z" }
              as: PriceAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_MARKDOWN_OVERLAP"
            - "HTTP status == 409"

