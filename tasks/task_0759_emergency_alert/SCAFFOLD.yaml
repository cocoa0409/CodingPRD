# =============================================================================
# Task 0759 — Community Emergency-Alert & Notification (CodeRED / Everbridge style)
# Difficulty: Expert
# =============================================================================

scenario: |
  759. Community Emergency-Alert & Notification (CodeRED/Everbridge style): contact
  database & opt-in/geo subscription, alert composition & severity/channel
  (SMS/voice/email/IPAWS), targeting (polygon/group) & throttling, delivery/receipt
  & retry, multilingual & accessibility (TTY), template & drill, integration
  (CAD/weather), reporting

domain_name: emergency-alert
# Flat / graph topology: peer top-level collections (/contacts, /alerts, /groups,
# /gateways, ...) linked by foreign keys. Empty api_prefix keeps every collection
# at the URL root; entity collection segments are the first path segment.
api_prefix: ""

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
    - scheduled_actions
  entity_topology: graph
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many          # Subscription junction links Contact <-> Group
    - cross_aggregate       # Notification references Alert, Contact, ContactChannel
  role_model: segregation_of_duties
  consistency_model: immediate

  entity_count: 11
  state_machine_count: 8
  calculation_count: 7
  validation_layers: 11
  endpoint_count: 44
  error_code_count: 26
  role_count: 5

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Contact
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only, never a business-decision input" }
      - { name: full_name, type: string, source: input, description: "Recipient display name" }
      - { name: primary_language, type: enum, source: input, description: "EN | ES | ZH | VI — preferred delivery language", default: "EN" }
      - { name: tty_required, type: boolean, source: input, description: "Contact is deaf/hard-of-hearing; requires a TTY-capable channel", default: false }
      - { name: default_lat, type: number, source: input, description: "Home latitude in decimal degrees (nullable)", default: null }
      - { name: default_lon, type: number, source: input, description: "Home longitude in decimal degrees (nullable)", default: null }
      - { name: quiet_start_min, type: integer, source: input, description: "Quiet-hours window start, minutes from UTC midnight [0..1439], null = none", default: null }
      - { name: quiet_end_min, type: integer, source: input, description: "Quiet-hours window end, minutes from UTC midnight [0..1439], null = none", default: null }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | DELETED", default: "ACTIVE", constraints: "ACTIVE|SUSPENDED|DELETED" }
      - { name: reliability_score, type: number, source: computed, description: "Delivery reliability over this contact's Notification history; see calculations.contact_reliability (dual-variant)" }

  - name: ContactChannel
    parent: Contact
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only" }
      - { name: contact_id, type: string, source: system, description: "FK -> Contact.id; owning contact" }
      - { name: channel_type, type: enum, source: input, description: "SMS | VOICE | EMAIL | IPAWS", constraints: "SMS|VOICE|EMAIL|IPAWS" }
      - { name: address, type: string, source: input, description: "Phone number or email address" }
      - { name: tty_capable, type: boolean, source: input, description: "Channel can carry TTY/relay (VOICE with TTY, or a TTY SMS gateway)", default: false }
      - { name: opt_in_status, type: enum, source: system, description: "PENDING | CONFIRMED | OPTED_OUT", default: "PENDING", constraints: "PENDING|CONFIRMED|OPTED_OUT" }
      - { name: confirmation_token, type: string, source: system, description: "Opaque token minted at creation; required to confirm opt-in" }

  - name: Group
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only" }
      - { name: name, type: string, source: input, description: "Targeting group name (e.g. 'Downtown Residents')" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED — CLOSED groups reject new subscriptions", default: "OPEN", constraints: "OPEN|CLOSED" }
      - { name: member_count, type: integer, source: computed, description: "Count of ACTIVE GROUP Subscriptions referencing this group" }

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only" }
      - { name: contact_id, type: string, source: input, description: "FK -> Contact.id; the subscribing contact" }
      - { name: subscription_type, type: enum, source: input, description: "GROUP | GEO", constraints: "GROUP|GEO" }
      - { name: group_id, type: string, source: input, description: "FK -> Group.id; required when subscription_type=GROUP, null for GEO", default: null }
      - { name: center_lat, type: number, source: input, description: "GEO subscription centroid latitude (required for GEO)", default: null }
      - { name: center_lon, type: number, source: input, description: "GEO subscription centroid longitude (required for GEO)", default: null }
      - { name: radius_m, type: integer, source: input, description: "GEO subscription area radius in meters (metadata; not used in alert match)", default: null }
      - { name: status, type: enum, source: system, description: "ACTIVE | CANCELLED", default: "ACTIVE", constraints: "ACTIVE|CANCELLED" }

  - name: Template
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only" }
      - { name: name, type: string, source: input, description: "Template name" }
      - { name: default_severity, type: enum, source: input, description: "INFO | ADVISORY | WARNING | CRITICAL", constraints: "INFO|ADVISORY|WARNING|CRITICAL" }
      - { name: body_by_language, type: object, source: input, description: "Map language->message body, e.g. {EN: '...', ES: '...'}" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | ARCHIVED — only PUBLISHED templates may back a submitted alert", default: "DRAFT", constraints: "DRAFT|PUBLISHED|ARCHIVED" }

  - name: Alert
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only" }
      - { name: title, type: string, source: input, description: "Alert headline" }
      - { name: severity, type: enum, source: input, description: "INFO | ADVISORY | WARNING | CRITICAL", constraints: "INFO|ADVISORY|WARNING|CRITICAL" }
      - { name: channels, type: array, source: input, description: "Requested delivery channel_types, subset of [SMS,VOICE,EMAIL,IPAWS]" }
      - { name: template_id, type: string, source: input, description: "FK -> Template.id; optional backing template", default: null }
      - { name: target_type, type: enum, source: input, description: "GROUP | GEO", constraints: "GROUP|GEO" }
      - { name: target_group_id, type: string, source: input, description: "FK -> Group.id; required when target_type=GROUP", default: null }
      - { name: center_lat, type: number, source: input, description: "GEO target circle centroid latitude (required when target_type=GEO)", default: null }
      - { name: center_lon, type: number, source: input, description: "GEO target circle centroid longitude (required when target_type=GEO)", default: null }
      - { name: radius_m, type: integer, source: input, description: "GEO target circle radius in meters (required when target_type=GEO)", default: null }
      - { name: effective_from, type: datetime, source: input, description: "ISO8601 UTC; alert may not dispatch before this instant" }
      - { name: effective_until, type: datetime, source: input, description: "ISO8601 UTC; alert may not dispatch at/after this instant" }
      - { name: author_user_id, type: string, source: system, description: "X-User-ID of the Dispatcher who created the alert; used for segregation-of-duties check" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_APPROVAL | APPROVED | DISPATCHING | SENT | CLOSED | CANCELLED", default: "DRAFT", constraints: "DRAFT|PENDING_APPROVAL|APPROVED|DISPATCHING|SENT|CLOSED|CANCELLED" }
      - { name: revision_count, type: integer, source: system, description: "Increments each time the alert is rejected back to DRAFT", default: 0 }
      - { name: pending_count, type: integer, source: computed, description: "Count of this alert's Notifications in {QUEUED,SENT,RETRYING,FAILED}; see calculations.alert_pending_count" }
      - { name: estimated_reach, type: integer, source: computed, description: "Forward-looking distinct-contact reach snapshot at dispatch; see calculations.alert_reach variant estimated_reach" }
      - { name: delivered_reach, type: integer, source: computed, description: "Final distinct-contact reach at close; see calculations.alert_reach variant delivered_reach" }
      - { name: sms_billable_segments, type: integer, source: computed, description: "Total SMS segments billed for this alert; see calculations.sms_billable_segments" }
      - { name: source_incident_ref, type: string, source: system, description: "External CAD/weather reference when auto-created by integration ingest, else null", default: null }
      - { name: version, type: integer, source: system, description: "Optimistic-concurrency version; starts at 1, increments on every mutation" }

  - name: AlertLocalization
    parent: Alert
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only" }
      - { name: alert_id, type: string, source: system, description: "FK -> Alert.id; owning alert" }
      - { name: language, type: enum, source: input, description: "EN | ES | ZH | VI", constraints: "EN|ES|ZH|VI" }
      - { name: message_text, type: string, source: input, description: "Localized message body" }
      - { name: segment_count, type: integer, source: computed, description: "ceil(len(message_text)/160); see calculations.sms_billable_segments" }

  - name: Notification
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only" }
      - { name: alert_id, type: string, source: system, description: "FK -> Alert.id; source alert" }
      - { name: contact_id, type: string, source: system, description: "FK -> Contact.id; recipient" }
      - { name: channel_id, type: string, source: system, description: "FK -> ContactChannel.id; recipient channel" }
      - { name: channel_type, type: enum, source: system, description: "SMS | VOICE | EMAIL | IPAWS (copied from channel)", constraints: "SMS|VOICE|EMAIL|IPAWS" }
      - { name: language, type: enum, source: system, description: "Language selected for this recipient (contact.primary_language if a localization exists, else EN fallback)", constraints: "EN|ES|ZH|VI" }
      - { name: delivery_status, type: enum, source: system, description: "QUEUED | SENT | DELIVERED | FAILED | RETRYING | EXHAUSTED | SUPPRESSED", default: "QUEUED", constraints: "QUEUED|SENT|DELIVERED|FAILED|RETRYING|EXHAUSTED|SUPPRESSED" }
      - { name: receipt_status, type: enum, source: system, description: "NONE | ACKNOWLEDGED — independent receipt dimension", default: "NONE", constraints: "NONE|ACKNOWLEDGED" }
      - { name: attempt_count, type: integer, source: system, description: "Number of send attempts made", default: 0 }
      - { name: next_retry_at, type: datetime, source: system, description: "When a RETRYING notification becomes eligible for re-send; null otherwise", default: null }

  - name: Gateway
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only" }
      - { name: name, type: string, source: input, description: "Gateway name" }
      - { name: channel_type, type: enum, source: input, description: "SMS | VOICE | EMAIL | IPAWS — the channel this gateway carries", constraints: "SMS|VOICE|EMAIL|IPAWS" }
      - { name: capacity_per_window, type: integer, source: input, description: "Max notifications of this channel_type that may enter a throttle window" }
      - { name: status, type: enum, source: system, description: "ONLINE | OFFLINE", default: "ONLINE", constraints: "ONLINE|OFFLINE" }
      - { name: window_count, type: integer, source: computed, description: "Count of non-SUPPRESSED Notifications of this channel_type created in the current throttle window; see calculations.gateway_window_count" }

  - name: GatewayMaintenanceWindow
    parent: Gateway
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only" }
      - { name: gateway_id, type: string, source: system, description: "FK -> Gateway.id; owning gateway" }
      - { name: start_at, type: datetime, source: input, description: "ISO8601 UTC window start (inclusive)" }
      - { name: end_at, type: datetime, source: input, description: "ISO8601 UTC window end (exclusive)" }

  - name: Drill
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only" }
      - { name: group_id, type: string, source: input, description: "FK -> Group.id; group the drill exercises" }
      - { name: scheduled_start, type: datetime, source: input, description: "ISO8601 UTC drill start (inclusive)" }
      - { name: scheduled_end, type: datetime, source: input, description: "ISO8601 UTC drill end (inclusive)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED", default: "SCHEDULED", constraints: "SCHEDULED|COMPLETED|CANCELLED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # -------------------------------------------------------------------------
  - entity: Alert
    field: status
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    note: "Cyclic: PENDING_APPROVAL can revert to DRAFT (revision loop)."
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /alerts/{id}/submit"
        actor: Dispatcher
        preconditions:
          - "At least one AlertLocalization exists whose language == severity's required set (>=1 localization total)"
          - "target_type=GROUP requires target_group_id set; target_type=GEO requires center_lat, center_lon, radius_m set (else ERR_TARGET_REQUIRED)"
          - "If template_id set, referenced Template.status == PUBLISHED (else ERR_TEMPLATE_NOT_PUBLISHED)"
          - "effective_from < effective_until (else ERR_INVALID_WINDOW)"
        side_effects: []
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /alerts/{id}/approve"
        actor: Approver
        preconditions:
          - "X-User-ID of approver != Alert.author_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []
      - from: PENDING_APPROVAL
        to: DRAFT
        trigger: "POST /alerts/{id}/reject"
        actor: Approver
        preconditions:
          - "X-User-ID of approver != Alert.author_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Increments Alert.revision_count by 1"
        note: "Revision loop — returns alert to editable DRAFT."
      - from: APPROVED
        to: DISPATCHING
        trigger: "POST /alerts/{id}/dispatch"
        actor: Dispatcher
        preconditions:
          - "OCC: payload.expected_alert_version == Alert.version (else ERR_STALE_VERSION, 412)"
          - "Every targeted TTY-required contact has at least one CONFIRMED tty_capable channel of a requested channel_type (else ERR_ACCESSIBILITY_UNMET)"
          - "Current clock in [effective_from, effective_until) (else ERR_WINDOW_EXPIRED)"
          - "For each requested channel_type, projected gateway.window_count + new sends <= gateway.capacity_per_window, unless severity==CRITICAL (else ERR_THROTTLE_EXCEEDED)"
          - "Resolved recipient set (matched, ACTIVE, >=1 CONFIRMED requested channel, not throttle-skipped) is non-empty (else ERR_NO_RECIPIENTS)"
        side_effects:
          - "increments Alert.version by 1"
          - "Creates one Notification (delivery_status=QUEUED) per (matched contact, CONFIRMED channel of a requested channel_type)"
          - "Sets Alert.estimated_reach = distinct matched contacts with >=1 created Notification (calculations.alert_reach:estimated_reach)"
          - "Sets Alert.sms_billable_segments (calculations.sms_billable_segments)"
          - "Recomputes Alert.pending_count and each affected Gateway.window_count"
      - from: DISPATCHING
        to: SENT
        trigger: "system: POST /_tick/run flushes QUEUED notifications of ONLINE gateways to SENT"
        actor: system
        preconditions:
          - "No QUEUED notifications remain for the alert (all advanced to SENT or SUPPRESSED)"
        side_effects:
          - "Each QUEUED Notification whose gateway is ONLINE -> SENT (attempt_count=1); OFFLINE gateway -> notification stays QUEUED"
      - from: SENT
        to: CLOSED
        trigger: "POST /alerts/{id}/close, or system when pending_count reaches 0"
        actor: "Dispatcher or system"
        preconditions:
          - "Alert.pending_count == 0 for the system-triggered close"
        side_effects:
          - "Sets Alert.delivered_reach = distinct contacts with >=1 DELIVERED Notification (calculations.alert_reach:delivered_reach)"
      - from: [DRAFT, PENDING_APPROVAL, APPROVED, DISPATCHING, SENT]
        to: CANCELLED
        trigger: "POST /alerts/{id}/cancel"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "CASCADE(depth2) link1: every non-terminal Notification (QUEUED,SENT,RETRYING,FAILED) of this alert -> SUPPRESSED"
          - "CASCADE(depth2) link2: suppression triggers recompute of each affected Gateway.window_count (dropping the suppressed sends)"
          - "Recomputes Alert.pending_count (-> 0)"

  # -------------------------------------------------------------------------
  - entity: Notification
    field: delivery_status
    initial_state: QUEUED
    terminal_states: [DELIVERED, EXHAUSTED, SUPPRESSED]
    note: "Cyclic retry loop: SENT -> FAILED -> RETRYING -> SENT."
    transitions:
      - from: QUEUED
        to: SENT
        trigger: "system: POST /_tick/run"
        actor: system
        preconditions:
          - "Parent Alert.status == DISPATCHING (cross-entity)"
          - "Recipient Contact.status == ACTIVE (cross-entity)"
          - "The ONLINE Gateway for this channel_type exists and status==ONLINE (else stays QUEUED)"
        side_effects:
          - "attempt_count = 1"
      - from: SENT
        to: DELIVERED
        trigger: "POST /notifications/{id}/delivery-report with outcome=DELIVERED, or POST /notifications/{id}/acknowledge"
        actor: "Integrator or Contact"
        preconditions: []
        side_effects:
          - "Decrements parent Alert.pending_count"
          - "If parent Alert.pending_count reaches 0 and Alert.status==SENT -> Alert closes (delivered_reach set)"
      - from: SENT
        to: FAILED
        trigger: "POST /notifications/{id}/delivery-report with outcome=FAILED"
        actor: Integrator
        preconditions: []
        side_effects: []
      - from: FAILED
        to: RETRYING
        trigger: "system: POST /_tick/run when attempt_count < RETRY_MAX_ATTEMPTS"
        actor: system
        preconditions:
          - "attempt_count < RETRY_MAX_ATTEMPTS (3)"
        side_effects:
          - "Sets next_retry_at = now + calculations.retry_backoff_delay"
      - from: RETRYING
        to: SENT
        trigger: "system: POST /_tick/run when next_retry_at <= now"
        actor: system
        preconditions:
          - "next_retry_at <= current clock"
        side_effects:
          - "attempt_count += 1; next_retry_at = null"
      - from: FAILED
        to: EXHAUSTED
        trigger: "system: POST /_tick/run when attempt_count >= RETRY_MAX_ATTEMPTS"
        actor: system
        preconditions:
          - "attempt_count >= RETRY_MAX_ATTEMPTS (3)"
        side_effects:
          - "Decrements parent Alert.pending_count"
      - from: [QUEUED, SENT, RETRYING, FAILED]
        to: SUPPRESSED
        trigger: "system: channel opt-out cascade, or alert cancel cascade"
        actor: system
        preconditions: []
        side_effects:
          - "Decrements parent Alert.pending_count; recomputes Gateway.window_count"

  # -------------------------------------------------------------------------
  - entity: Notification
    field: receipt_status
    initial_state: NONE
    terminal_states: [ACKNOWLEDGED]
    note: "Parallel dimension to delivery_status — evolves independently."
    transitions:
      - from: NONE
        to: ACKNOWLEDGED
        trigger: "POST /notifications/{id}/acknowledge"
        actor: Contact
        preconditions:
          - "Acting Contact (X-User-ID) == Notification.contact_id"
          - "delivery_status in {SENT, DELIVERED, RETRYING}"
        side_effects:
          - "If delivery_status == SENT, also advances delivery_status SENT -> DELIVERED"

  # -------------------------------------------------------------------------
  - entity: ContactChannel
    field: opt_in_status
    initial_state: PENDING
    terminal_states: [OPTED_OUT]
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /channels/{id}/confirm"
        actor: Contact
        preconditions:
          - "payload.confirmation_token == ContactChannel.confirmation_token (else ERR_INVALID_TOKEN)"
          - "Acting Contact (X-User-ID) == ContactChannel.contact_id"
        side_effects: []
      - from: [PENDING, CONFIRMED]
        to: OPTED_OUT
        trigger: "POST /channels/{id}/opt-out"
        actor: Contact
        preconditions:
          - "Acting Contact (X-User-ID) == ContactChannel.contact_id"
        side_effects:
          - "CASCADE(depth3) link1: every non-terminal Notification (QUEUED,SENT,RETRYING,FAILED) on this channel -> SUPPRESSED"
          - "CASCADE(depth3) link2: each suppression decrements its parent Alert.pending_count"
          - "CASCADE(depth3) link3: when an affected Alert's pending_count reaches 0 and Alert.status in {DISPATCHING,SENT}, that Alert -> CLOSED (delivered_reach set)"
          - "Recomputes affected Gateway.window_count"

  # -------------------------------------------------------------------------
  - entity: Group
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /groups/{id}/close"
        actor: ContactAdmin
        preconditions: []
        side_effects: []

  # -------------------------------------------------------------------------
  - entity: Subscription
    field: status
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: "ContactAdmin or Contact"
        preconditions:
          - "For Contact actor, X-User-ID == Subscription.contact_id"
        side_effects:
          - "Recomputes Group.member_count if a GROUP subscription"

  # -------------------------------------------------------------------------
  - entity: Template
    field: status
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /templates/{id}/publish"
        actor: ContactAdmin
        preconditions: []
        side_effects: []

  # -------------------------------------------------------------------------
  - entity: Drill
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "system: POST /_tick/run when scheduled_end <= current clock"
        actor: system
        preconditions:
          - "scheduled_end <= current clock"
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /drills/{id}/cancel"
        actor: ContactAdmin
        preconditions: []
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: dispatch-stale-alert
    parent_entity: Alert
    write_endpoint: "POST /alerts/{id}/dispatch"
    occ_field: "expected_alert_version"
    description: |
      Dispatching an Alert whose version has advanced since the client last
      observed it is rejected. Between the client's read and this dispatch, the
      alert may have been rejected back to DRAFT and re-approved (revision loop),
      or re-approved after a targeting edit — either advances Alert.version. A
      dispatch carrying a stale expected_alert_version is refused so it cannot
      fan out notifications against a superseded targeting/approval snapshot.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: alert_reach
    trigger: "estimated_reach set on Alert DISPATCHING; delivered_reach set on Alert CLOSED"
    algorithm: forward_looking
    formula: |
      # Same alert, two valid reach definitions that diverge whenever any sent
      # notification is not (yet) delivered.
      estimated_reach = COUNT(DISTINCT n.contact_id
                              for Notification n where n.alert_id == alert.id)   # snapshot at dispatch, all created notifications
      delivered_reach = COUNT(DISTINCT n.contact_id
                              for Notification n where n.alert_id == alert.id
                                                   and n.delivery_status == DELIVERED)  # final, at close
    input_set: "estimated_reach counts every created notification's contact; delivered_reach counts only DELIVERED"
    precision: "integer counts"
    variants:
      - name: estimated_reach
        when: "Alert transitions APPROVED->DISPATCHING"
        difference: "Counts distinct contacts with >=1 created notification (forward-looking; treats every queued send as a reach)"
      - name: delivered_reach
        when: "Alert reaches CLOSED"
        difference: "Counts distinct contacts with >=1 DELIVERED notification (final; excludes FAILED/EXHAUSTED/SUPPRESSED/pending)"

  - name: contact_reliability
    trigger: "read on Contact (computed on the fly from its Notification history)"
    algorithm: weighted_scoring
    formula: |
      total = COUNT(Notification n where n.contact_id == contact.id
                    and n.delivery_status in {SENT,DELIVERED,FAILED,EXHAUSTED,RETRYING})
      if total == 0: reliability_score = 0.00
      else:
        optimistic_hits = COUNT(n where n.delivery_status in {SENT,DELIVERED,RETRYING})
        strict_hits     = COUNT(n where n.delivery_status == DELIVERED)
        reliability_score = round(hits / total, 2)   # round_half_up, 2 dp
    input_set: "This contact's non-SUPPRESSED notifications"
    precision: "2 decimal places, round_half_up"
    variants:
      - name: optimistic
        when: "default reliability read"
        difference: "Treats SENT and RETRYING as successes (optimistic_hits / total)"
      - name: strict
        when: "strict reporting read (?mode=strict on GET /contacts/{id})"
        difference: "Counts only DELIVERED as success (strict_hits / total) — diverges from optimistic whenever a SENT/RETRYING is not yet DELIVERED"

  - name: sms_billable_segments
    trigger: "Alert DISPATCHING (side effect)"
    algorithm: aggregation
    formula: |
      # Rounding order is PINNED: segments are computed PER-notification, THEN summed.
      # (Summing raw char counts first then dividing by 160 gives a different total.)
      segment_count(localization) = ceil(len(localization.message_text) / SMS_SEGMENT_SIZE)
      sms_billable_segments = SUM over SMS Notification n of
                                  segment_count(localization for (n.alert_id, n.language))
    input_set: "Notifications with channel_type == SMS on the alert"
    constants:
      SMS_SEGMENT_SIZE: 160
    precision: "integer segments; ceil per notification, then sum (round-per-line-item-then-sum)"

  - name: retry_backoff_delay
    trigger: "Notification FAILED->RETRYING"
    algorithm: threshold
    formula: |
      # >=3 inputs (attempt_count, severity, constants) with nested min and a
      # tiered severity multiplier; non-linear.
      severity_factor = {INFO:1, ADVISORY:1, WARNING:2, CRITICAL:4}[alert.severity]
      raw = RETRY_BASE_DELAY_SEC * (2 ** (attempt_count - 1)) * severity_factor
      retry_backoff_delay = min(RETRY_MAX_BACKOFF_SEC, raw)   # seconds
      next_retry_at = current_clock + retry_backoff_delay
    input_set: "The failing notification's attempt_count and its alert's severity"
    constants:
      RETRY_BASE_DELAY_SEC: 60
      RETRY_MAX_BACKOFF_SEC: 3600
      RETRY_MAX_ATTEMPTS: 3
    precision: "integer seconds"

  - name: gateway_window_count
    trigger: "Notification create/suppress; read on Gateway"
    algorithm: aggregation
    formula: |
      window_start = floor current_clock to the top of the UTC hour
      window_end   = window_start + THROTTLE_WINDOW_MINUTES minutes
      window_count(gateway) = COUNT(Notification n where
                                    n.channel_type == gateway.channel_type
                                    and n.created_at in [window_start, window_end)
                                    and n.delivery_status != SUPPRESSED)
    input_set: "Non-SUPPRESSED notifications of the gateway's channel_type created in the current hour-aligned window"
    constants:
      THROTTLE_WINDOW_MINUTES: 60
    precision: "integer count; window boundary [start, end) half-open"

  - name: geo_target_match
    trigger: "Alert dispatch and POST /alerts/{id}/preview (GEO targeting)"
    algorithm: threshold
    formula: |
      # Planar equirectangular distance with a FIXED meters-per-degree constant
      # (no latitude cosine term) so results are deterministic and integer.
      dlat_m = (subscription.center_lat - alert.center_lat) * DEG_TO_M
      dlon_m = (subscription.center_lon - alert.center_lon) * DEG_TO_M
      distance_m = round( sqrt(dlat_m^2 + dlon_m^2) )        # round_half_up to integer meters
      matched = distance_m <= alert.radius_m                 # INCLUSIVE boundary (<=)
    input_set: "ACTIVE GEO Subscriptions; a contact is geo-matched when any of its ACTIVE GEO subscriptions is matched"
    constants:
      DEG_TO_M: 111320
    precision: "integer meters, round_half_up; inclusion is distance_m <= radius_m"

  - name: alert_pending_count
    trigger: "Notification create/deliver/exhaust/suppress; Alert dispatch/cancel"
    algorithm: aggregation
    formula: |
      pending_count(alert) = COUNT(Notification n where n.alert_id == alert.id
                                   and n.delivery_status in {QUEUED,SENT,RETRYING,FAILED})
    input_set: "This alert's notifications still in flight"
    precision: "integer count"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted to perform this operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every resource named in the path exists, validated left-to-right"
    error_id: ERR_*_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 4
    category: state
    check: "Target resource is in a valid state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: business_constraint
    check: "OCC: expected_alert_version matches Alert.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /alerts/{id}/dispatch"

  - priority: 6
    category: business_referential
    check: "Body references resolve and satisfy their referential precondition: template PUBLISHED; group OPEN; opt-in token valid"
    error_id: "ERR_TEMPLATE_NOT_PUBLISHED | ERR_GROUP_NOT_OPEN | ERR_INVALID_TOKEN"
    http_status: 422
    applies_to: "POST /alerts/{id}/submit, POST /subscriptions, POST /channels/{id}/confirm"

  - priority: 7
    category: business_constraint
    check: "Cross-actor & uniqueness constraints: approver != author; no duplicate ACTIVE subscription; effective_from < effective_until"
    error_id: "ERR_SEGREGATION_OF_DUTIES | ERR_DUPLICATE_SUBSCRIPTION | ERR_INVALID_WINDOW"
    http_status: 409
    applies_to: "POST /alerts/{id}/approve, POST /alerts/{id}/reject, POST /subscriptions, POST /alerts/{id}/submit"

  - priority: 8
    category: business_safety
    check: "Accessibility: every targeted tty_required contact has a CONFIRMED tty_capable channel among the requested channel_types"
    error_id: ERR_ACCESSIBILITY_UNMET
    http_status: 422
    applies_to: "POST /alerts/{id}/dispatch"

  - priority: 9
    category: business_temporal
    check: "Temporal windows: dispatch within [effective_from, effective_until); maintenance/drill windows do not overlap an existing one on the resource"
    error_id: "ERR_WINDOW_EXPIRED | ERR_WINDOW_OVERLAP"
    http_status: 422
    applies_to: "POST /alerts/{id}/dispatch, POST /gateways/{id}/maintenance-windows, POST /drills"

  - priority: 10
    category: business_fiscal
    check: "Throttle: projected window_count + new sends <= gateway.capacity_per_window per requested channel_type, unless severity==CRITICAL"
    error_id: ERR_THROTTLE_EXCEEDED
    http_status: 409
    applies_to: "POST /alerts/{id}/dispatch"

  - priority: 11
    category: business_constraint
    check: "Resolved recipient set for the dispatch is non-empty"
    error_id: ERR_NO_RECIPIENTS
    http_status: 422
    applies_to: "POST /alerts/{id}/dispatch"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- infra / test-driving ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default (never wall-clock)."
    roles: [Integrator]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["Sets logical clock used by all window/expiry/retry rules"]

  - method: POST
    path: "/_tick/run"
    description: "Advance system processing at the current clock: flush QUEUED->SENT on ONLINE gateways, drive retry loop (FAILED->RETRYING->SENT / EXHAUSTED), complete due drills, auto-close alerts whose pending_count reached 0, move DISPATCHING->SENT."
    roles: [Integrator]
    code: 200
    input: []
    output: "{ sent_count: integer, retried_count: integer, exhausted_count: integer, completed_drills: integer, closed_alerts: integer }"
    side_effects: ["Notification and Alert and Drill system transitions per §1.2"]

  - method: POST
    path: "/_integration/ingest_incident"
    description: "CAD/weather integration ingest. Creates a DRAFT Alert seeded from the external incident (GEO target from incident circle, severity mapped). source_incident_ref recorded."
    roles: [Integrator]
    code: 201
    input: [source, external_ref, severity, center_lat, center_lon, radius_m, channels]
    output: Alert
    side_effects: ["Creates Alert(status=DRAFT, target_type=GEO, source_incident_ref=external_ref, author_user_id=X-User-ID)"]

  # ---- Contact ----
  - method: POST
    path: "/contacts"
    description: "Create a contact"
    roles: [ContactAdmin]
    code: 201
    input: [full_name, "primary_language?", "tty_required?", "default_lat?", "default_lon?", "quiet_start_min?", "quiet_end_min?"]
    output: Contact
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/contacts/{id}"
    description: "Get a contact. Optional ?mode=strict switches reliability_score to the strict variant."
    roles: [ContactAdmin, Dispatcher, Approver, Contact]
    code: 200
    input: ["mode?"]
    output: Contact
    side_effects: []

  - method: POST
    path: "/contacts/{id}/channels"
    description: "Add a channel to a contact (opt-in PENDING)"
    roles: [ContactAdmin]
    code: 201
    input: [channel_type, address, "tty_capable?"]
    output: ContactChannel
    side_effects: ["opt_in_status=PENDING, confirmation_token minted"]

  - method: GET
    path: "/contacts/{id}/channels"
    description: "List a contact's channels (FK reverse-reachability for ContactChannel.contact_id)"
    roles: [ContactAdmin, Dispatcher, Contact]
    code: 200
    input: ["opt_in_status?", "limit?", "offset?"]
    output: ContactChannel[]
    side_effects: []

  - method: POST
    path: "/channels/{id}/confirm"
    description: "Confirm a channel opt-in with the token"
    roles: [Contact]
    code: 200
    input: [confirmation_token]
    output: ContactChannel
    side_effects: ["opt_in_status PENDING->CONFIRMED"]

  - method: POST
    path: "/channels/{id}/opt-out"
    description: "Opt a channel out; cascades suppression of that channel's in-flight notifications"
    roles: [Contact]
    code: 200
    input: []
    output: ContactChannel
    side_effects:
      - "opt_in_status -> OPTED_OUT"
      - "CASCADE: in-flight Notifications on channel -> SUPPRESSED -> Alert.pending_count decrement -> Alert auto-CLOSE when 0; Gateway.window_count recompute"

  # ---- Group ----
  - method: POST
    path: "/groups"
    description: "Create a targeting group"
    roles: [ContactAdmin]
    code: 201
    input: [name]
    output: Group
    side_effects: ["status=OPEN"]

  - method: GET
    path: "/groups/{id}"
    description: "Get a group"
    roles: [ContactAdmin, Dispatcher, Approver]
    code: 200
    input: []
    output: Group
    side_effects: []

  - method: POST
    path: "/groups/{id}/close"
    description: "Close a group (rejects new subscriptions)"
    roles: [ContactAdmin]
    code: 200
    input: []
    output: Group
    side_effects: ["status OPEN->CLOSED"]

  # ---- Subscription ----
  - method: POST
    path: "/subscriptions"
    description: "Create an opt-in subscription (GROUP or GEO)"
    roles: [ContactAdmin, Contact]
    code: 201
    input: [contact_id, subscription_type, "group_id?", "center_lat?", "center_lon?", "radius_m?"]
    output: Subscription
    side_effects: ["status=ACTIVE; recomputes Group.member_count for GROUP"]

  - method: GET
    path: "/subscriptions/{id}"
    description: "Get a subscription"
    roles: [ContactAdmin, Dispatcher, Contact]
    code: 200
    input: []
    output: Subscription
    side_effects: []

  - method: GET
    path: "/subscriptions"
    description: "List subscriptions filtered by contact or group (FK reverse-reachability for Subscription.contact_id and Subscription.group_id)"
    roles: [ContactAdmin, Dispatcher, Contact]
    code: 200
    input: ["contact_id?", "group_id?", "subscription_type?", "limit?", "offset?"]
    output: Subscription[]
    side_effects: []

  - method: POST
    path: "/subscriptions/{id}/cancel"
    description: "Cancel a subscription"
    roles: [ContactAdmin, Contact]
    code: 200
    input: []
    output: Subscription
    side_effects: ["status ACTIVE->CANCELLED; recomputes Group.member_count"]

  # ---- Template ----
  - method: POST
    path: "/templates"
    description: "Create an alert template (DRAFT)"
    roles: [ContactAdmin]
    code: 201
    input: [name, default_severity, body_by_language]
    output: Template
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/templates/{id}"
    description: "Get a template"
    roles: [ContactAdmin, Dispatcher]
    code: 200
    input: []
    output: Template
    side_effects: []

  - method: POST
    path: "/templates/{id}/publish"
    description: "Publish a template"
    roles: [ContactAdmin]
    code: 200
    input: []
    output: Template
    side_effects: ["status DRAFT->PUBLISHED"]

  # ---- Alert ----
  - method: POST
    path: "/alerts"
    description: "Compose an alert (DRAFT). author_user_id recorded from X-User-ID."
    roles: [Dispatcher]
    code: 201
    input: [title, severity, channels, target_type, effective_from, effective_until, "template_id?", "target_group_id?", "center_lat?", "center_lon?", "radius_m?"]
    output: Alert
    side_effects: ["status=DRAFT, version=1, revision_count=0, author_user_id=X-User-ID"]

  - method: GET
    path: "/alerts/{id}"
    description: "Get an alert"
    roles: [ContactAdmin, Dispatcher, Approver, Integrator]
    code: 200
    input: []
    output: Alert
    side_effects: []

  - method: GET
    path: "/alerts"
    description: "List alerts filtered by template or target group (FK reverse-reachability for Alert.template_id and Alert.target_group_id)"
    roles: [ContactAdmin, Dispatcher, Approver]
    code: 200
    input: ["status?", "template_id?", "target_group_id?", "limit?", "offset?"]
    output: Alert[]
    side_effects: []

  - method: POST
    path: "/alerts/{id}/localizations"
    description: "Add a language localization to an alert"
    roles: [Dispatcher]
    code: 201
    input: [language, message_text]
    output: AlertLocalization
    side_effects: ["segment_count computed = ceil(len/160)"]

  - method: GET
    path: "/alerts/{id}/localizations"
    description: "List an alert's localizations (FK reverse-reachability for AlertLocalization.alert_id)"
    roles: [ContactAdmin, Dispatcher, Approver]
    code: 200
    input: ["limit?", "offset?"]
    output: AlertLocalization[]
    side_effects: []

  - method: POST
    path: "/alerts/{id}/submit"
    description: "Submit alert for approval"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Alert
    side_effects: ["status DRAFT->PENDING_APPROVAL"]

  - method: POST
    path: "/alerts/{id}/approve"
    description: "Approve alert (approver must differ from author)"
    roles: [Approver]
    code: 200
    input: []
    output: Alert
    side_effects: ["status PENDING_APPROVAL->APPROVED"]

  - method: POST
    path: "/alerts/{id}/reject"
    description: "Reject alert back to DRAFT (revision loop)"
    roles: [Approver]
    code: 200
    input: ["reason?"]
    output: Alert
    side_effects: ["status PENDING_APPROVAL->DRAFT; revision_count += 1"]

  - method: POST
    path: "/alerts/{id}/preview"
    description: "Computed read: resolve the recipient/reach preview without mutating (used for GEO boundary preview)"
    roles: [Dispatcher, Approver]
    code: 200
    input: []
    output: "{ estimated_reach: integer, matched_contact_ids: array, throttled_contact_ids: array }"
    side_effects: []

  - method: POST
    path: "/alerts/{id}/dispatch"
    description: "Dispatch an APPROVED alert: fan out notifications, set reach/segments. OCC on expected_alert_version."
    roles: [Dispatcher]
    code: 200
    input: [expected_alert_version]
    output: Alert
    side_effects:
      - "increments Alert.version by 1"
      - "status APPROVED->DISPATCHING; creates QUEUED Notifications; sets estimated_reach, sms_billable_segments, pending_count; recomputes Gateway.window_count"

  - method: POST
    path: "/alerts/{id}/cancel"
    description: "Cancel an alert; cascades suppression of in-flight notifications"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Alert
    side_effects: ["status->CANCELLED; CASCADE non-terminal Notifications -> SUPPRESSED -> Gateway.window_count recompute; pending_count->0"]

  - method: POST
    path: "/alerts/{id}/close"
    description: "Close a SENT alert and finalize delivered_reach"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Alert
    side_effects: ["status SENT->CLOSED; sets delivered_reach"]

  # ---- Notification ----
  - method: GET
    path: "/notifications/{id}"
    description: "Get a notification"
    roles: [ContactAdmin, Dispatcher, Integrator, Contact]
    code: 200
    input: []
    output: Notification
    side_effects: []

  - method: GET
    path: "/notifications"
    description: "List notifications filtered by alert, contact, or channel (FK reverse-reachability for Notification.alert_id, contact_id, channel_id)"
    roles: [ContactAdmin, Dispatcher, Integrator, Contact]
    code: 200
    input: ["alert_id?", "contact_id?", "channel_id?", "delivery_status?", "limit?", "offset?"]
    output: Notification[]
    side_effects: []

  - method: POST
    path: "/notifications/{id}/delivery-report"
    description: "Gateway delivery-receipt webhook: outcome DELIVERED or FAILED"
    roles: [Integrator]
    code: 200
    input: [outcome]
    output: Notification
    side_effects: ["SENT->DELIVERED (pending_count--, maybe auto-close) or SENT->FAILED"]

  - method: POST
    path: "/notifications/{id}/acknowledge"
    description: "Recipient acknowledges receipt (TTY / read confirmation)"
    roles: [Contact]
    code: 200
    input: []
    output: Notification
    side_effects: ["receipt_status NONE->ACKNOWLEDGED; if delivery_status==SENT also SENT->DELIVERED"]

  # ---- Gateway ----
  - method: POST
    path: "/gateways"
    description: "Register a channel gateway (ONLINE)"
    roles: [ContactAdmin]
    code: 201
    input: [name, channel_type, capacity_per_window]
    output: Gateway
    side_effects: ["status=ONLINE"]

  - method: GET
    path: "/gateways/{id}"
    description: "Get a gateway (includes computed window_count)"
    roles: [ContactAdmin, Dispatcher, Integrator]
    code: 200
    input: []
    output: Gateway
    side_effects: []

  - method: POST
    path: "/gateways/{id}/toggle"
    description: "Toggle gateway ONLINE/OFFLINE"
    roles: [ContactAdmin]
    code: 200
    input: [status]
    output: Gateway
    side_effects: ["status <- payload.status"]

  - method: POST
    path: "/gateways/{id}/maintenance-windows"
    description: "Schedule a maintenance window on a gateway. Half-open [start_at, end_at); rejects overlap with an existing window (adjacency end==start allowed)."
    roles: [ContactAdmin]
    code: 201
    input: [start_at, end_at]
    output: GatewayMaintenanceWindow
    side_effects: []

  - method: GET
    path: "/gateways/{id}/maintenance-windows"
    description: "List a gateway's maintenance windows (FK reverse-reachability for GatewayMaintenanceWindow.gateway_id)"
    roles: [ContactAdmin, Dispatcher, Integrator]
    code: 200
    input: ["limit?", "offset?"]
    output: GatewayMaintenanceWindow[]
    side_effects: []

  # ---- Drill ----
  - method: POST
    path: "/drills"
    description: "Schedule a drill for a group. Closed [scheduled_start, scheduled_end]; rejects any drill on the same group within DRILL_BUFFER_MINUTES (=30) of an existing SCHEDULED drill (buffer-gap semantics)."
    roles: [ContactAdmin]
    code: 201
    input: [group_id, scheduled_start, scheduled_end]
    output: Drill
    side_effects: ["status=SCHEDULED"]

  - method: GET
    path: "/drills/{id}"
    description: "Get a drill"
    roles: [ContactAdmin, Dispatcher]
    code: 200
    input: []
    output: Drill
    side_effects: []

  - method: GET
    path: "/drills"
    description: "List drills filtered by group (FK reverse-reachability for Drill.group_id)"
    roles: [ContactAdmin, Dispatcher]
    code: 200
    input: ["group_id?", "status?", "limit?", "offset?"]
    output: Drill[]
    side_effects: []

  - method: POST
    path: "/drills/{id}/cancel"
    description: "Cancel a scheduled drill"
    roles: [ContactAdmin]
    code: 200
    input: []
    output: Drill
    side_effects: ["status SCHEDULED->CANCELLED"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body, missing required field, invalid enum, or bad numeric/range" }
  - { id: ERR_CONTACT_NOT_FOUND, http: 404, condition: "Contact id in path/body does not exist" }
  - { id: ERR_CHANNEL_NOT_FOUND, http: 404, condition: "ContactChannel id does not exist" }
  - { id: ERR_GROUP_NOT_FOUND, http: 404, condition: "Group id does not exist" }
  - { id: ERR_SUBSCRIPTION_NOT_FOUND, http: 404, condition: "Subscription id does not exist" }
  - { id: ERR_TEMPLATE_NOT_FOUND, http: 404, condition: "Template id does not exist" }
  - { id: ERR_ALERT_NOT_FOUND, http: 404, condition: "Alert id does not exist" }
  - { id: ERR_NOTIFICATION_NOT_FOUND, http: 404, condition: "Notification id does not exist" }
  - { id: ERR_GATEWAY_NOT_FOUND, http: 404, condition: "Gateway id does not exist" }
  - { id: ERR_DRILL_NOT_FOUND, http: 404, condition: "Drill id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_alert_version does not match Alert.version (OCC)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Approver/rejecter X-User-ID equals the alert's author_user_id" }
  - { id: ERR_TEMPLATE_NOT_PUBLISHED, http: 422, condition: "Alert submit references a Template whose status != PUBLISHED" }
  - { id: ERR_GROUP_NOT_OPEN, http: 409, condition: "Subscription created against a Group whose status != OPEN" }
  - { id: ERR_INVALID_TOKEN, http: 422, condition: "confirmation_token does not match the channel's token" }
  - { id: ERR_DUPLICATE_SUBSCRIPTION, http: 409, condition: "An ACTIVE subscription already exists for (contact_id, type, group_id/geo-centroid)" }
  - { id: ERR_INVALID_WINDOW, http: 409, condition: "effective_from >= effective_until (or window bounds otherwise invalid)" }
  - { id: ERR_ACCESSIBILITY_UNMET, http: 422, condition: "A targeted tty_required contact lacks a CONFIRMED tty_capable channel among requested channel_types" }
  - { id: ERR_WINDOW_EXPIRED, http: 422, condition: "Dispatch attempted outside [effective_from, effective_until)" }
  - { id: ERR_WINDOW_OVERLAP, http: 422, condition: "Maintenance window overlaps an existing one, or a drill violates the group buffer gap" }
  - { id: ERR_THROTTLE_EXCEEDED, http: 409, condition: "Projected gateway window_count would exceed capacity_per_window and severity != CRITICAL" }
  - { id: ERR_NO_RECIPIENTS, http: 422, condition: "Resolved recipient set for a dispatch is empty" }
  - { id: ERR_TARGET_REQUIRED, http: 422, condition: "Alert submit missing required targeting fields for its target_type" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Dispatcher
    description: "Composes alerts, localizations, targeting; submits, previews, dispatches, cancels, closes. Cannot approve their own alert."
    identity: opaque
    exclusive_operations:
      - "POST /alerts — compose"
      - "POST /alerts/{id}/localizations"
      - "POST /alerts/{id}/submit"
      - "POST /alerts/{id}/preview"
      - "POST /alerts/{id}/dispatch"
      - "POST /alerts/{id}/cancel"
      - "POST /alerts/{id}/close"
    shared_operations:
      - "GET /alerts, GET /alerts/{id}, GET reverse-reachability lists"

  - name: Approver
    description: "Approves or rejects alerts submitted by a Dispatcher. Segregation of duties: X-User-ID must differ from Alert.author_user_id."
    identity: opaque
    exclusive_operations:
      - "POST /alerts/{id}/approve"
      - "POST /alerts/{id}/reject"
    shared_operations:
      - "GET /alerts, GET /alerts/{id}, POST /alerts/{id}/preview"

  - name: ContactAdmin
    description: "Manages contacts, channels, groups, subscriptions, templates, gateways, maintenance windows, drills."
    identity: opaque
    exclusive_operations:
      - "POST /contacts, POST /contacts/{id}/channels"
      - "POST /groups, POST /groups/{id}/close"
      - "POST /templates, POST /templates/{id}/publish"
      - "POST /gateways, POST /gateways/{id}/toggle, POST /gateways/{id}/maintenance-windows"
      - "POST /drills, POST /drills/{id}/cancel"
    shared_operations:
      - "POST /subscriptions, POST /subscriptions/{id}/cancel"
      - "GET reads across resources"

  - name: Contact
    description: "A recipient acting on their own channels, subscriptions, and notifications. entity_backed: X-User-ID equals a Contact.id."
    identity: "entity_backed:Contact"
    exclusive_operations:
      - "POST /channels/{id}/confirm (own channel)"
      - "POST /channels/{id}/opt-out (own channel)"
      - "POST /notifications/{id}/acknowledge (own notification)"
    shared_operations:
      - "POST /subscriptions (self), POST /subscriptions/{id}/cancel (self)"
      - "GET /contacts/{id} (self), GET /contacts/{id}/channels (self)"

  - name: Integrator
    description: "Operational/system role for CAD/weather ingest, gateway delivery-report webhooks, the logical clock, and tick processing. Opaque operator id."
    identity: opaque
    exclusive_operations:
      - "POST /_integration/ingest_incident"
      - "POST /_clock/set_current_utc"
      - "POST /_tick/run"
      - "POST /notifications/{id}/delivery-report"
    shared_operations:
      - "GET /alerts/{id}, GET /notifications, GET /gateways/{id}"
