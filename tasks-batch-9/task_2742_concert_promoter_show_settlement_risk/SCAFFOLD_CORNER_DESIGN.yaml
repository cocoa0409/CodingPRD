              captures: { cd_of2_v_after: $.data.version }
            - call: "POST /ticket-tiers/${cd_tt1_id}/sales"
              payload: { qty: 1 }
              as: TalentBuyer
              captures: { cd_e_sale_after_cascade: $.data.error_id }
            - call: "GET /markets/${cd_mk_id}"
              payload: {}
              as: RiskOfficer
            - call: "GET /artists/${cd_ar_id}"
              payload: {}
              as: TalentBuyer
          assert:
            - "PARENT — Show S show_status == CANCELLED, sales_status == CLOSED, refund_liability_cents == 250000 (50 x 5000 at face)"
            - "TIER CASCADE IGNORES THE CHILD'S OWN STAGE — tier ${cd_tt1_id} (was ON_SALE) status == CLOSED AND tier ${cd_tt2_id} (was still DRAFT) status == CLOSED; sold_qty stays 50 and 0 respectively as the historical record"
            - "BUDGET CASCADE — BudgetLine ${cd_bl1_id}.status == VOID and ${cd_bl2_id}.status == VOID; both were ACTIVE"
            - "NON-TERMINAL OFFER MOVES — Offer ${cd_of1_id}.status == WITHDRAWN (it was DRAFT, which the cascade explicitly includes)"
            - "TERMINAL OFFERS ARE UNTOUCHED — Offer ${cd_of2_id}.status is still ACCEPTED with version ${cd_of2_v_after} == ${cd_of2_v}, and Offer ${cd_of0_id}.status is still WITHDRAWN with version ${cd_of0_v_after} == ${cd_of0_v}; an implementation that withdraws 'every offer on the show' fails here"
            - "THE CASCADE IS REAL, NOT COSMETIC — ${cd_e_sale_after_cascade} == ERR_INVALID_STATE 409: the closed tier genuinely refuses further sales, and tier ${cd_tt1_id}.sold_qty is still 50"
            - "LEDGER — market.committed_guarantee_cents == 0, exposure_utilization_pct == 0.00, risk_posture OPEN, and artist Cascade Act confirmed_show_count == 0 (the 800000 that the acceptance booked is fully released)"

      - name: cross_entity_side_effect_offer_acceptance_adjusts_show_artist_and_market
        claim_type: Cross-entity
        grounds:
          - "state_machines.Offer.transitions.SUBMITTED_to_ACCEPTED"
          - "state_machines.Show.transitions.PLANNED_to_CONFIRMED"
          - "entities.Artist.fields.confirmed_show_count"
        excluded_because:
          difficulty_instance: offer_acceptance_cascades_three_levels_offer_show_artist_and_market
          rationale: "That §1.8 instance already asserts the state and every touched field on all three collateral entities (Show, Artist, Market) after a single accept."

      - name: ledger_sync_invoice_approval_reconciles_the_line_show_and_market_rollups
        claim_type: Ledger sync
        grounds:
          - "state_machines.VendorInvoice.transitions.VERIFIED_to_APPROVED"
          - "calculations.budget_line_variance_recognition"
          - "calculations.market_guarantee_exposure"
        excluded_because:
          difficulty_instance: invoice_approval_cascades_four_levels_invoice_line_show_market
          rationale: "That §1.8 instance already reconciles the derived rollups before and after a single approval across all four levels of the chain."

      - name: compensation_cancellation_reverses_every_acceptance_side_effect
        claim_type: Compensation
        grounds:
          - "state_machines.Show.transitions.CONFIRMED_to_CANCELLED"
          - "calculations.market_guarantee_exposure.conservation_notes"
        excluded_because:
          difficulty_instance: market_guarantee_exposure_returns_to_its_exact_prior_value_after_cancellation
          rationale: "That §1.8 instance is the exact no-drift round trip: every field the acceptance moved is asserted back at its pre-acceptance value after the compensating cancellation."

      - name: postponement_spares_the_budget_lines_that_cancellation_voids
        claim_type: Conditional cascade
        grounds:
          - "state_machines.Show.transitions.ON_SALE_to_POSTPONED"
          - "state_machines.Show.transitions.ON_SALE_to_CANCELLED"
          - "endpoints[POST /cancellation-events].side_effects"
          - "calculations.refund_liability_and_recovery"
          - "calculations.budget_line_variance_recognition"
        distinguishing_aspect: "Two shows in identical states receive the same endpoint with only `kind` different: the BudgetLine cascade is conditional on kind (POSTPONED leaves the line ACTIVE, CANCELLED VOIDs it) while the ticketing cascade is unconditional (both shows end sales_status CLOSED with CLOSED tiers) — and the VOIDed line still counts toward unrecovered_cost_cents, so the two shows report the same 200000 unrecovered cost from different line statuses."
        test_recipe:
          setup:
            - "One market Conditional Market (limit 5000000) and one venue Cond Hall (cap 800, facility 0, tax 0)."
            - "Two shows built identically except for the artist: Show X (Cond Act X) and Show Y (Cond Act Y), each RENTAL rental_fee 0, each CONFIRMED on a 500000 FLAT_GUARANTEE with deposit 0, each carrying one ACTIVE PRODUCTION line budgeted 200000 whose 200000 invoice is APPROVED (so settlement_expense_cents == 200000), each ON_SALE with 20 of 200 GA seats sold at 5000 -> gross_sold_cents 100000."
