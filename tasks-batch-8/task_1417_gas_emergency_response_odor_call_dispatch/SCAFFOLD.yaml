  # --- EmergencyCall / incident intake ---
  - method: POST
    path: "/gas-ops/emergency-calls"
    description: "Intake an odor/emergency call. Dedup: same normalized_address with a non-terminal incident -> DUPLICATE link; same address with a CLOSED incident inside the recurrence window -> RECURRENCE (reopens it); otherwise a new GasIncident is created (lifecycle NEW, priority := implied_priority)."
    roles: [Dispatcher, Supervisor]
    code: 201
    input: [caller_name, caller_phone, address_line, city, territory_id, location_context, odor_reported, symptoms_reported, hissing_reported, "occupancy_type?"]
    output: EmergencyCall
    side_effects:
      - "PRIMARY: create GasIncident (NEW, priority = implied_priority, response_clock_started_at := now); if implied_priority == P1 the AUTO_PRIORITY notification rule fires at creation (auto_notification_created := true)"
      - "DUPLICATE: incident.linked_call_count += 1; if implied_priority exceeds current priority, auto-escalate (never lowers): priority raised, threshold recomputed, breach re-evaluated, incident.version increments; on reaching P1 the AUTO_PRIORITY notification rule fires; DRAFT/REJECTED covering reports marked needs_regeneration"
      - "RECURRENCE: incident CLOSED -> REOPENED per state machine"

  - method: GET
    path: "/gas-ops/emergency-calls"
    description: "List emergency calls"
    roles: [SystemAdmin, Dispatcher, Supervisor]
    code: 200
    input: ["incident_id?", "territory_id?", "limit?", "offset?"]
    output: "EmergencyCall[]"
    side_effects: []

  - method: GET
    path: "/gas-ops/emergency-calls/{callId}"
    description: "Get an emergency call"
    roles: [SystemAdmin, Dispatcher, Supervisor]
    code: 200
    input: []
    output: EmergencyCall
    side_effects: []

  # --- GasIncident ---
  - method: GET
    path: "/gas-ops/incidents"
    description: "List incidents (Regulator sees only CLOSED/MERGED; FieldTechnician sees only incidents it has a DispatchAssignment for)"
    roles: [SystemAdmin, Dispatcher, FieldTechnician, Supervisor, Regulator]
    code: 200
    input: ["territory_id?", "lifecycle_status?", "priority?", "limit?", "offset?"]
    output: "GasIncident[]"
    side_effects: []

  - method: GET
    path: "/gas-ops/incidents/{incidentId}"
    description: "Get an incident with all computed clock/severity/breach fields (scope rules apply)"
    roles: [SystemAdmin, Dispatcher, FieldTechnician, Supervisor, Regulator]
    code: 200
    input: []
    output: GasIncident
    side_effects: []

  - method: POST
    path: "/gas-ops/incidents/{incidentId}/triage"
    description: "Confirm/set priority; NEW or REOPENED -> TRIAGED"
    roles: [Dispatcher, Supervisor]
    code: 200
    input: [priority, "classification_notes?"]
    output: GasIncident
    side_effects: ["lifecycle_status -> TRIAGED", "P1 auto-notification rule", "covering DRAFT/REJECTED reports marked stale", "increments GasIncident.version by 1"]

  - method: POST
    path: "/gas-ops/incidents/{incidentId}/reclassify-priority"
    description: "Reclassify priority from TRIAGED/DISPATCHED/ON_SCENE/MAKE_SAFE_IN_PROGRESS/MONITORING; OCC-guarded"
    roles: [Dispatcher, Supervisor]
    code: 200
    input: [new_priority, expected_incident_version, reason]
    output: GasIncident
    side_effects: ["priority := new_priority", "threshold recomputed and breach_class re-evaluated", "P1 auto-notification rule", "covering DRAFT/REJECTED reports marked stale", "increments GasIncident.version by 1"]

  - method: POST
    path: "/gas-ops/incidents/{incidentId}/close"
    description: "Close an incident in MONITORING after all safety/referential gates pass"
    roles: [Supervisor]
    code: 200
    input: ["notes?"]
    output: GasIncident
    side_effects: ["lifecycle_status -> CLOSED, closed_at := now", "entry_status -> NOT_REQUIRED", "covering DRAFT/REJECTED reports marked stale", "increments GasIncident.version by 1"]

  - method: POST
    path: "/gas-ops/incidents/{incidentId}/merge-duplicate"
    description: "Merge the path (source) incident into source_incident_id's opposite: the path incident is the TARGET; body names the SOURCE to merge in"
    roles: [Supervisor]
    code: 200
    input: [source_incident_id]
    output: GasIncident
    side_effects: ["Source -> MERGED; calls re-linked; target.linked_call_count += source count; target.priority raised if source higher; target.version increments"]

  - method: POST
