  # Rule 5 - validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_error_wins_over_under_keel_safety_on_second_depart
        grounds:
          - validations[priority=10]
          - validations[priority=18]
          - validation_priority_conflicts.state_beats_safety_on_depart
          - errors[ERR_TRIP_NOT_BOARDING]
          - errors[ERR_UNDER_KEEL_CLEARANCE]
        distinguishing_aspect: |
          Category pair `state` (priority 10) versus `business_safety` (priority 18): a request that
          violates both must answer ERR_TRIP_NOT_BOARDING, never ERR_UNDER_KEEL_CLEARANCE. This is
          the state-versus-safety pairing, structurally different from the referential-versus-fiscal
          pairing exercised by the sibling instance.
        test_recipe:
          setup:
            - "Vessel 'Harrier' 40 seats, draft 1.25 m, OFFSHORE, requiring MASTER_25T, with a passing ANNUAL inspection."
            - "ServiceDay 2026-09-14 at 10.0 kn / 0.30 m / 2.10 m, so posture is NORMAL and the clearance is 0.85 m."
            - "A trip that has already been boarded and departed at 10:05, so operational_status is DEPARTED."
            - "Low water on that day has since been patched down to 1.50 m, which makes posture RESTRICTED and the clearance 0.25 m, below the 0.30 m floor."
          setup_api_calls:
            - call: "POST /harbor/docks"
