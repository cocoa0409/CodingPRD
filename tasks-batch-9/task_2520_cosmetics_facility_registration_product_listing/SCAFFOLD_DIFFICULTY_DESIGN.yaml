            - "GET /cosmetics/facilities/${fac_id}/ledger-entries returns, in ascending sequence_no, one ADVERSE_EVENT_REPORT entry, one POSTURE_CHANGE entry with posture_before OPEN and posture_after RESTRICTED, and one STATE_TRANSITION entry naming ${lst_id}"
            - "Facility.${fac_id}.open_serious_event_count == 0 and Facility.${fac_id}.abbreviated_renewal_eligible == false (posture is no longer OPEN)"
            - "${pts} == 10.00"

      - name: sweep_lapse_cascades_posture_listing_designation_and_dormancy
        grounds:
          - state_machines.Facility.REGISTERED_to_LAPSED
          - calculations.facility_compliance_posture
          - state_machines.ProductListing.LISTED_to_SUSPENDED
          - entities.ResponsiblePerson.fields.active_designation_count
          - entities.RegistrationPeriod.fields.status
        distinguishing_aspect: |
          A cascade of the same depth from a DIFFERENT triggering transition — the ops sweep's step-1
          lapse rather than an adverse-event report: hop 1 Facility REGISTERED -> LAPSED past
          current_period_end (and the ACTIVE RegistrationPeriod -> EXPIRED); hop 2 the LAPSED status
          forces compliance_posture FROZEN through the override branch, not the points branch; hop 3
          every LISTED listing -> SUSPENDED with suspension_reason FACILITY_LAPSED; hop 4 the vacated
          designation slot decrements ResponsiblePerson.active_designation_count to 0, which
          re-derives status ACTIVE -> DORMANT. The hop-2 escalation out of OPEN additionally fires
          the substantiation-revalidation cascade counted in revalidation_required_count.
        test_recipe:
          setup:
            - "one REGISTERED facility approved at clock 2026-08-01T00:00:00Z, so current_period_end is 2028-07-31 and grace_end_date is 2028-09-29"
            - "one ResponsiblePerson (default designation_cap 25) holding one LISTED + SUBSTANTIATED listing, so active_designation_count is 1 and status is ACTIVE"
            - "logical clock advanced to 2028-08-01T00:00:00Z — one day past current_period_end and still inside the grace window, so the sweep lapses the facility rather than merely marking it RENEWAL_DUE"
