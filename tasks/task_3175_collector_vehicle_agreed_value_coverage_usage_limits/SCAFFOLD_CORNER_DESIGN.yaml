            - call: "POST /vehicles"
              payload: { vin: "VIN105", year: 1970, make: "Ford", model: "Mustang", vehicle_class: CLASSIC, condition_grade: GOOD, storage_type: ENCLOSED_GARAGE, primary_use: PLEASURE }
              as: Member
              as_user_id: "${m_id}"
              captures: { v_id: $.data.id, v_ver: $.data.version }
            - call: "POST /vehicles/${v_id}/photos"
              payload: { photo_type: FRONT, image_ref: "img://f", captured_at: "2026-09-01T00:00:00Z" }
