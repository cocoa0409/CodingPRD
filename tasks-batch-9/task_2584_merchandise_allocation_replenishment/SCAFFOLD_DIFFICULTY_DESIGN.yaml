  - rule_id: transitive_cascade
    instances:
      - name: transfer_receive_cascades_position_then_item_then_assortment_action
        grounds:
          - state_machines[TransferRecommendation].transitions[DISPATCHED->RECEIVED].side_effects
          - calculations.assortment_health_derivation
          - state_machines[Item].transitions
          - state_machines[AssortmentAction].transitions[PENDING->SUPERSEDED]
          - endpoints.POST /allocation/transfer-recommendations/{recommendationId}/receive
        distinguishing_aspect: |
          One StoreOperator call fires a four-link chain in which every link is caused by the previous
          one: RECEIVED merges the size_split into position 0101 (link 1), which drops its
          broken_size_count from 2 to 0 and flips assortment_status to COMPLETE (link 2), which drops the
          item's broken_store_count to 0 and re-derives lifecycle_state BROKEN -> ACTIVE (link 3), which
          invalidates the still-PENDING AssortmentAction and moves it to SUPERSEDED (link 4). Remove any
          earlier link and the later ones cannot happen.
        test_recipe:
          setup:
            - "Program FA26 ACTIVE with stores 0101(A,URBAN,freight 41.00,sell-through 6500), 0102(B,URBAN,freight 38.00,5800), 0103(C,SUBURBAN,freight 42.00,4200)"
            - "Shelf plans effective 2026-07-01 open-ended: 0101 capacity 48 / pmin 12, 0102 capacity 24 / pmin 8, 0103 capacity 15 / pmin 8"
            - "SizeProfile TOP-4SZ = S 2000 / M 3500 / L 3000 / XL 1500 with core_size_min_share_bp 1500, so all four sizes are CORE; SKU-1001 retail 36.50"
            - "Positions: 0101 holds 4 units (S 0, M 3, L 1, XL 0) with min 12 / max 48 -> LOW + BROKEN; 0102 holds 30 units (S 8, M 10, L 8, XL 4) with min 8 / max 24 -> OVERSTOCK + COMPLETE; 0103 holds 5 units (S 1, M 2, L 1, XL 1) with min 4 / max 20 -> IN_STOCK + COMPLETE"
            - "A detection sweep has already raised one PENDING AssortmentAction for (SKU-1001, store 0101)"
            - "A 6-unit rebalance 0102 -> 0101 has been proposed, approved and dispatched"
          setup_api_calls:
            - call: "POST /allocation/programs"
              payload: { name: "FA26 Core Tops", season_code: "FA26", banner_code: "NORTH" }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { prog_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0101", grade: "A", grade_index_bp: 13000, cluster_code: "URBAN", freight_flat_usd: 41.00, historical_sell_through_bp: 6500 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { s1_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0102", grade: "B", grade_index_bp: 10000, cluster_code: "URBAN", freight_flat_usd: 38.00, historical_sell_through_bp: 5800 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { s2_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0103", grade: "C", grade_index_bp: 12500, cluster_code: "SUBURBAN", freight_flat_usd: 42.00, historical_sell_through_bp: 4200 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { s3_id: $.data.id }
            - call: "POST /allocation/fixture-plans"
              payload: { store_id: "${s1_id}", item_class: "APPAREL_TOP", effective_from: "2026-07-01T00:00:00Z", fixture_count: 4, facings_per_fixture: 3, units_per_facing: 4, presentation_min_units: 12 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/fixture-plans"
              payload: { store_id: "${s2_id}", item_class: "APPAREL_TOP", effective_from: "2026-07-01T00:00:00Z", fixture_count: 2, facings_per_fixture: 3, units_per_facing: 4, presentation_min_units: 8 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/fixture-plans"
              payload: { store_id: "${s3_id}", item_class: "APPAREL_TOP", effective_from: "2026-07-01T00:00:00Z", fixture_count: 1, facings_per_fixture: 3, units_per_facing: 5, presentation_min_units: 8 }
