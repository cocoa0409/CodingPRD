scenario: '1803. Streetlight LED Conversion Program (municipal streetlight program): pole/luminaire

  inventory & wattage audit, conversion route scheduling & crew production, unmetered tariff

  adjustment & billing recalculation, municipal ownership vs utility-owned rate, outage

  reporting portal & repair SLA, dark-sky/color-temperature policy, salvage & recycling of

  removed fixtures, savings verification

  '
domain_name: streetlight-led-conversion
api_prefix: /streetlights
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
  - optimistic_concurrency
  - cascading_side_effects
  - dual_variant_calculation
  - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
  - one_to_many
  - many_to_many
  - self_referential
  - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
response_envelope:
  success: "{ \"meta\": { \"api_request_id\": \"req_xxx\", \"api_request_timestamp\": \"ISO8601\" },\n  \"response_type\": \"object\" | \"array\", \"data\": {} }\n"
  error: "{ \"meta\": { ... }, \"response_type\": \"error\",\n  \"data\": { \"error_id\": \"ERR_XXX\", \"message\": \"...\" } }\n"
  pagination_fields:
  - limit
  - offset
  - total_count
  - has_more
  pagination_defaults:
    limit: 10
    min: 1
    max: 100
    offset: 0
entities:
- name: ConversionProgram
  parent: null
  common_fields: true
  fields:
  - name: program_name
    type: string
    source: input
    description: Program display name
  - name: program_budget_cents
    type: integer
    source: input
    description: Total program budget in cents; must be > 0
  - name: fy_rebate_cap_cents
    type: integer
    source: input
    description: Fiscal-year cap on attested incentive rebate credits; must be > 0
  - name: rebate_cents_per_kwh
    type: integer
    source: input
    description: Incentive rebate rate per verified kWh saved; must be > 0
  - name: budget_balance_cents
    type: integer
    source: computed
    description: program_budget_cents - outstanding estimates - reconciled labor + salvage settlements + attested rebate credits (see budget_balance_ledger calc)
  - name: current_billing_run_estimated_cents
    type: integer
    source: computed
    description: Sum of TariffAccount.current_period_estimated_cents over all accounts of this program
  - name: converted_pole_count
    type: integer
    source: computed
    description: Count of Poles of this program with led_in_service_date not null
  - name: pending_salvage_item_count
    type: integer
    source: computed
    description: Count of SalvageItems of this program with batch_id null (unbatched pool)
  - name: status
    type: enum
    source: system
    description: DRAFT | ACTIVE | CLOSED
    constraints: initial DRAFT
- name: ServiceDistrict
  parent: ConversionProgram
  common_fields: true
  fields:
  - name: program_id
    type: string
    source: input
    description: FK -> ConversionProgram.id
  - name: district_name
    type: string
    source: input
    description: District name; unique per program
  - name: zone
    type: enum
    source: input
    description: RESIDENTIAL | ARTERIAL | DOWNTOWN | RURAL
  - name: cct_cap_kelvin
    type: integer
    source: computed
    description: 'Dark-sky CCT cap derived from zone: RESIDENTIAL 3000, ARTERIAL 4000, DOWNTOWN 2700, RURAL 2200'
  - name: full_cutoff_required
    type: boolean
    source: computed
    description: true when zone is RESIDENTIAL or RURAL; else false
- name: Pole
  parent: ServiceDistrict
  common_fields: true
  fields:
  - name: district_id
    type: string
    source: input
    description: FK -> ServiceDistrict.id
  - name: pole_number
    type: string
    source: input
    description: Yard/plant number; unique per program (across districts)
  - name: ownership_type
    type: enum
    source: input
    description: MUNICIPAL | UTILITY_OWNED — selects billing variant and audit path
  - name: fixture_class
    type: enum
    source: input
    description: 'Existing (removed) fixture class: COBRA_HEAD | FLOOD | POST_TOP | DECORATIVE'
  - name: nameplate_wattage
    type: integer
    source: input
    description: Nameplate wattage of existing luminaire; must be > 0
  - name: effective_wattage
    type: integer
    source: computed
    description: Latest ACCEPTED WattageAudit.audited_wattage; falls back to nameplate_wattage when no audit accepted
  - name: pre_conversion_wattage
    type: integer
    source: system
    description: Snapshot of effective_wattage frozen at first conversion completion; null until then
  - name: led_wattage
    type: integer
    source: system
    description: Installed LED wattage from latest completed work order; null until conversion
  - name: led_in_service_date
    type: string
    source: system
    description: ISO date (YYYY-MM-DD) of latest work-order completion; drives billing proration
  - name: billing_wattage
    type: integer
    source: computed
    description: led_wattage when led_in_service_date set, else effective_wattage
  - name: wattage_tier
    type: enum
    source: computed
    description: 'Tier of billing_wattage: T1 < 100, T2 100-199, T3 200-299, T4 300-449, T5 >= 450'
  - name: pre_repair_status
    type: enum
    source: system
    description: Status held before UNDER_REPAIR; restored on replacement completion; null otherwise
  - name: status
    type: enum
    source: system
    description: SURVEYED | AUDIT_CLEARED | SCHEDULED | CONVERTED | REWORK | VERIFIED | UNDER_REPAIR | EXEMPT
    constraints: initial SURVEYED
- name: WattageAudit
  parent: Pole
  common_fields: true
  fields:
  - name: pole_id
    type: string
    source: system
    description: FK -> Pole.id (path-bound)
  - name: audited_wattage
    type: integer
    source: input
    description: Field-measured wattage; must be > 0
  - name: auditor_notes
    type: string
    source: input
    description: Free-text notes
    default: ''
  - name: revision_count
    type: integer
    source: system
    description: Number of resubmissions of this audit record; starts 0
  - name: decided_by_user_id
    type: string
    source: system
    description: X-User-ID of accept/dispute decision; null while SUBMITTED
  - name: status
    type: enum
    source: system
    description: SUBMITTED | ACCEPTED | DISPUTED | SUPERSEDED
    constraints: initial SUBMITTED
- name: Crew
  parent: ConversionProgram
  common_fields: true
  fields:
  - name: program_id
    type: string
    source: input
    description: FK -> ConversionProgram.id
  - name: crew_name
    type: string
    source: input
    description: Crew name
  - name: base_stops_per_shift
    type: integer
    source: input
    description: Maximum stops one shift can complete; must be > 0
  - name: hourly_rate_cents
    type: integer
    source: input
    description: Straight-time hourly labor rate in cents; must be > 0
- name: ConversionRoute
  parent: ServiceDistrict
  common_fields: true
  fields:
  - name: district_id
    type: string
    source: input
    description: FK -> ServiceDistrict.id
  - name: crew_id
    type: string
    source: input
    description: FK -> Crew.id — assigned crew
  - name: window_start_date
    type: string
    source: input
    description: ISO date; inclusive window start
  - name: window_end_date
    type: string
    source: input
    description: ISO date; inclusive window end; must be >= window_start_date
  - name: traffic_control_required
    type: boolean
    source: input
    description: Whether shifts carry 60-min (vs 30-min) mobilization overhead
  - name: stop_count
    type: integer
    source: computed
    description: Count of RouteStops with status PENDING or BLOCKED or COMPLETE (excludes SKIPPED)
  - name: blocked_stop_count
    type: integer
    source: computed
    description: Count of RouteStops with status BLOCKED
  - name: total_workload_minutes
    type: integer
    source: computed
    description: Sum of stop_minutes over non-SKIPPED stops
  - name: required_shifts
    type: integer
    source: computed
    description: ceil(total_workload_minutes / (480 - mobilization_minutes))
  - name: status
    type: enum
    source: system
    description: PLANNED | RELEASED | IN_PROGRESS | SUSPENDED | CLOSED | CANCELLED
    constraints: initial PLANNED
- name: RouteStop
  parent: ConversionRoute
  common_fields: true
  fields:
  - name: route_id
    type: string
    source: system
    description: FK -> ConversionRoute.id (path-bound)
  - name: pole_id
    type: string
    source: input
    description: FK -> Pole.id
  - name: sequence_number
    type: integer
    source: input
    description: Stop order within route; unique per route; must be > 0
  - name: difficulty_class
    type: enum
    source: input
    description: STANDARD | HEAVY | COMPLEX
  - name: stop_minutes
    type: integer
    source: computed
    description: STANDARD 45, HEAVY 75, COMPLEX 120
  - name: status
    type: enum
    source: system
    description: PENDING | COMPLETE | SKIPPED | BLOCKED
    constraints: initial PENDING
- name: WorkOrder
  parent: ConversionRoute
  common_fields: true
  fields:
  - name: route_id
    type: string
    source: system
    description: FK -> ConversionRoute.id; null for replacement orders
  - name: stop_id
    type: string
    source: system
    description: FK -> RouteStop.id; null for replacement orders
  - name: pole_id
    type: string
    source: system
    description: FK -> Pole.id
  - name: crew_id
    type: string
    source: system
    description: FK -> Crew.id (route crew, or resolving crew for replacements)
  - name: ticket_id
    type: string
    source: system
    description: FK -> OutageTicket.id; set only on replacement orders, else null
  - name: is_replacement
    type: boolean
    source: system
    description: true for outage-spawned replacement orders
  - name: stop_minutes
    type: integer
    source: system
    description: 'Minutes basis: stop''s difficulty minutes, or 75 for replacements'
  - name: new_fixture_wattage
    type: integer
    source: input
    description: LED wattage; required at dispatch; must be > 0
  - name: new_cct_kelvin
    type: integer
    source: input
    description: LED color temperature; required at dispatch; must be > 0
  - name: shielding
    type: enum
    source: input
    description: FULL_CUTOFF | SEMI_CUTOFF | NONE; required at dispatch
  - name: estimated_labor_cost_cents
    type: integer
    source: computed
    description: 'Straight-time estimate debited at dispatch: round_half_up(hourly_rate_cents * stop_minutes / 60)'
  - name: est_reconciled
    type: boolean
    source: system
    description: true once the estimate has been netted against an actual at completion
  - name: cumulative_week_minutes_before
    type: integer
    source: computed
    description: Crew ISO-week completed minutes before this completion (see work_order_labor_cost)
  - name: overtime_minutes
    type: integer
    source: computed
    description: Minutes of this completion billed at 1.5x
  - name: labor_cost_cents
    type: integer
    source: computed
    description: Overtime-aware actual labor cost; null until completion
  - name: performed_by_user_id
    type: string
    source: system
    description: X-User-ID of the completer (crew id for FieldSupervisor)
  - name: qc_by_user_id
    type: string
    source: system
    description: X-User-ID of the QC decider
  - name: completed_at
    type: datetime
    source: system
    description: Logical-clock timestamp of latest completion; null until completed
  - name: execution_status
    type: enum
    source: system
    description: PENDING | DISPATCHED | COMPLETED | FAILED | REWORK_PENDING | CANCELLED
    constraints: initial PENDING
  - name: qc_status
    type: enum
    source: system
    description: NONE | AWAITING_QC | QC_PASSED | QC_FAILED
    constraints: initial NONE
- name: TariffRateSchedule
  parent: ConversionProgram
  common_fields: true
  fields:
  - name: program_id
    type: string
    source: input
    description: FK -> ConversionProgram.id
  - name: ownership_class
    type: enum
    source: input
    description: MUNICIPAL | UTILITY_OWNED — window uniqueness scope
  - name: effective_from
    type: string
    source: input
    description: ISO date; half-open window start (inclusive)
  - name: effective_until
    type: string
    source: input
    description: ISO date; half-open window end (exclusive); null = open-ended; must be > effective_from when present
    default: null
  - name: tier_rates
    type: object
    source: input
    description: 'Map {T1..T5: integer cents per pole per month}; all five keys required, each > 0'
  - name: status
    type: enum
    source: system
    description: DRAFT | FILED | EFFECTIVE | SUPERSEDED
    constraints: initial DRAFT
- name: TariffAccount
  parent: ServiceDistrict
  common_fields: true
  fields:
  - name: district_id
    type: string
    source: input
    description: FK -> ServiceDistrict.id
  - name: account_number
    type: string
    source: input
    description: Utility account number; unique per program
  - name: ownership_class
    type: enum
    source: input
    description: MUNICIPAL | UTILITY_OWNED — one open account per (district, class)
  - name: current_period
    type: string
    source: system
    description: YYYY-MM of the open billing period; initialized from logical clock month at creation
  - name: current_period_estimated_cents
    type: integer
    source: computed
    description: Sum of charge_cents over this account's REGULAR lines in current_period with status ESTIMATED
  - name: ytd_billed_cents
    type: integer
    source: computed
    description: Sum of charge_cents over REGULAR lines with status in {BILLED, SUPERSEDED} plus all ADJUSTMENT lines, periods in the calendar year of current_period
  - name: status
    type: enum
    source: system
    description: OPEN | FROZEN
    constraints: initial OPEN
- name: BillingLine
  parent: TariffAccount
  common_fields: true
  fields:
  - name: account_id
    type: string
    source: system
    description: FK -> TariffAccount.id
  - name: pole_id
    type: string
    source: system
    description: FK -> Pole.id
  - name: rate_schedule_id
    type: string
    source: system
    description: FK -> TariffRateSchedule.id used for this line's rate lookup
  - name: period
    type: string
    source: system
    description: YYYY-MM this line bills
  - name: line_type
    type: enum
    source: system
    description: REGULAR | ADJUSTMENT
  - name: billing_wattage
    type: integer
    source: computed
    description: Wattage basis used for the dominant rate lookup (see monthly_unmetered_charge)
  - name: tier
    type: enum
    source: computed
    description: Tier applied for the dominant portion (T1..T5)
  - name: charge_cents
    type: integer
    source: computed
    description: Charge per monthly_unmetered_charge (REGULAR) or signed delta (ADJUSTMENT)
  - name: supersedes_line_id
    type: string
    source: system
    description: FK -> BillingLine.id; set on ADJUSTMENT lines, else null
  - name: status
    type: enum
    source: system
    description: ESTIMATED | BILLED | SUPERSEDED
    constraints: REGULAR starts ESTIMATED; ADJUSTMENT starts BILLED
- name: OutageTicket
  parent: Pole
  common_fields: true
  fields:
  - name: pole_id
    type: string
    source: input
    description: FK -> Pole.id
  - name: reporter_user_id
    type: string
    source: system
    description: X-User-ID of the creating CitizenReporter
  - name: description
    type: string
    source: input
    description: Free-text problem description
  - name: hazard_flag
    type: boolean
    source: input
    description: Reporter-indicated safety hazard
    default: false
  - name: duplicate_of_ticket_id
    type: string
    source: system
    description: FK -> OutageTicket.id; set when auto-linked as duplicate, else null
  - name: priority
    type: enum
    source: computed
    description: CRITICAL | HIGH | STANDARD per sla_priority_and_breach; null until TRIAGED
  - name: sla_hours
    type: integer
    source: computed
    description: CRITICAL 24 | HIGH 48 | STANDARD 96; null until TRIAGED
  - name: sla_breached
    type: boolean
    source: computed
    description: resolved_at - reported_at > sla_hours (strictly greater); null until RESOLVED
  - name: assigned_crew_id
    type: string
    source: system
    description: FK -> Crew.id assigned at dispatch; null until DISPATCHED
  - name: reported_at
    type: datetime
    source: system
    description: Logical-clock creation timestamp; SLA clock origin (never reset)
  - name: resolved_at
    type: datetime
    source: system
    description: Logical-clock timestamp of latest resolution
  - name: resolution_code
    type: enum
    source: input
    description: 'Required at resolve: LIGHT_OUT_FIXED | FIXTURE_REPLACED | NO_FAULT_FOUND'
  - name: reopen_count
    type: integer
    source: system
    description: Number of REOPENED cycles; starts 0
  - name: status
    type: enum
    source: system
    description: OPEN | TRIAGED | DISPATCHED | RESOLVED | VERIFIED | REOPENED | DUPLICATE
    constraints: initial OPEN (or DUPLICATE when auto-linked)
- name: SalvageBatch
  parent: ConversionProgram
  common_fields: true
  fields:
  - name: program_id
    type: string
    source: input
    description: FK -> ConversionProgram.id
  - name: batch_label
    type: string
    source: input
    description: Human label; unique per program
  - name: contaminated_flag
    type: boolean
    source: input
    description: 'Set at seal: batch carries PCB contamination (15% deduction)'
  - name: item_count
    type: integer
    source: computed
    description: Count of SalvageItems currently in this batch
  - name: total_weight_lbs
    type: number
    source: computed
    description: Sum of item weight_lbs; 1 decimal place
  - name: settlement_value_cents
    type: integer
    source: computed
    description: Per salvage_settlement_value; null until MANIFESTED
  - name: manifest_code
    type: string
    source: system
    description: Server-minted manifest identifier at MANIFESTED; format MF-<batch_label>
  - name: status
    type: enum
    source: system
    description: ACCUMULATING | SEALED | MANIFESTED | SETTLED | REJECTED
    constraints: initial ACCUMULATING
- name: SalvageItem
  parent: SalvageBatch
  common_fields: true
  fields:
  - name: batch_id
    type: string
    source: system
    description: FK -> SalvageBatch.id; null while in the unbatched pool
  - name: pole_id
    type: string
    source: system
    description: FK -> Pole.id whose fixture was removed
  - name: fixture_class
    type: enum
    source: system
    description: 'Copied from Pole.fixture_class at removal: COBRA_HEAD | FLOOD | POST_TOP | DECORATIVE'
  - name: weight_lbs
    type: number
    source: input
    description: Declared at batch-add; must be > 0 with at most 1 decimal place
  - name: mercury_flag
    type: boolean
    source: input
    description: 'Declared at batch-add: fixture contains mercury (300-cent handling deduction)'
    default: false
- name: SavingsReport
  parent: ConversionProgram
  common_fields: true
  fields:
  - name: program_id
    type: string
    source: input
    description: FK -> ConversionProgram.id
  - name: period
    type: string
    source: input
    description: YYYY-MM being verified
  - name: method
    type: enum
    source: input
    description: ENGINEERING_ESTIMATE | METERED_ACTUAL — selects savings variant
  - name: fiscal_year_label
    type: string
    source: input
    description: Fiscal-year grouping key for the rebate cap, e.g. FY2026
  - name: baseline_kwh
    type: number
    source: computed
    description: Per savings_verification_kwh; 3 decimal places
  - name: actual_kwh
    type: number
    source: computed
    description: Per savings_verification_kwh; 3 decimal places
  - name: savings_kwh
    type: number
    source: computed
    description: baseline_kwh - actual_kwh; 3 decimal places
  - name: raw_credit_cents
    type: integer
    source: computed
    description: round_half_up(savings_kwh * program.rebate_cents_per_kwh)
  - name: attested_credit_cents
    type: integer
    source: computed
    description: Capped credit per incentive_rebate_credit; null until ATTESTED
  - name: submitted_by_user_id
    type: string
    source: system
    description: X-User-ID of submitter
  - name: attested_by_user_id
    type: string
    source: system
    description: X-User-ID of attester; null until ATTESTED
  - name: status
    type: enum
    source: system
    description: DRAFT | SUBMITTED | ATTESTED | REJECTED | SUPERSEDED
    constraints: initial DRAFT
- name: ComplianceException
  parent: Pole
  common_fields: true
  fields:
  - name: pole_id
    type: string
    source: input
    description: FK -> Pole.id
  - name: exception_kind
    type: enum
    source: input
    description: CCT_WAIVER | CONVERSION_EXEMPTION
  - name: requested_cct_kelvin
    type: integer
    source: input
    description: Required for CCT_WAIVER; waiver ceiling; must be > 0; null for CONVERSION_EXEMPTION
  - name: valid_until
    type: string
    source: input
    description: ISO date; approval requires valid_until >= current date
  - name: decided_by_user_id
    type: string
    source: system
    description: X-User-ID of ComplianceOfficer decision; null while REQUESTED
  - name: status
    type: enum
    source: system
    description: REQUESTED | APPROVED | DENIED | EXPIRED
    constraints: initial REQUESTED
state_machines:
- entity: ConversionProgram
  initial_state: DRAFT
  terminal_states:
  - CLOSED
  transitions:
  - from: DRAFT
    to: ACTIVE
    trigger: POST /streetlights/programs/{id}/activate
    actor: ProgramManager
    preconditions: []
    side_effects:
    - increments ConversionProgram.version by 1
  - from: ACTIVE
    to: CLOSED
    trigger: POST /streetlights/programs/{id}/close
    actor: ProgramManager
    preconditions:
    - All ConversionRoutes of the program are in {CLOSED, CANCELLED} (ERR_ROUTES_STILL_ACTIVE)
    side_effects:
    - increments ConversionProgram.version by 1
- entity: Pole
  initial_state: SURVEYED
  terminal_states:
  - EXEMPT
  transitions:
  - from: SURVEYED
    to: AUDIT_CLEARED
    trigger: system (first WattageAudit ACCEPTED for a MUNICIPAL pole) or POST /streetlights/poles/{id}/attest-nameplate (UTILITY_OWNED pole)
    actor: system | BillingAnalyst
    preconditions: []
    side_effects: []
  - from: AUDIT_CLEARED
    to: SCHEDULED
    trigger: system (RouteStop created referencing this pole)
    actor: system
    preconditions: []
    side_effects: []
  - from: SCHEDULED
    to: CONVERTED
    trigger: system (linked WorkOrder execution_status -> COMPLETED)
    actor: system
    preconditions: []
    side_effects:
    - pre_conversion_wattage := effective_wattage (snapshot, first completion only)
    - led_wattage := work order new_fixture_wattage; led_in_service_date := completion date
  - from: CONVERTED
    to: VERIFIED
    trigger: system (linked WorkOrder qc_status -> QC_PASSED)
    actor: system
    preconditions: []
    side_effects: []
  - from: CONVERTED
    to: REWORK
    trigger: system (linked WorkOrder qc_status -> QC_FAILED)
    actor: system
    preconditions: []
    side_effects: []
  - from: REWORK
    to: CONVERTED
    trigger: 'system (rework completion: linked WorkOrder execution_status -> COMPLETED again)'
    actor: system
    preconditions: []
    side_effects:
    - led_wattage and led_in_service_date refreshed from the rework completion
  - from: SCHEDULED
    to: AUDIT_CLEARED
    trigger: system (RouteStop SKIPPED via skip action, work-order cancel, or route cancel)
    actor: system
    preconditions: []
    side_effects: []
  - from: SCHEDULED
    to: UNDER_REPAIR
    trigger: system (OutageTicket resolved with resolution_code FIXTURE_REPLACED)
    actor: system
    preconditions: []
    side_effects:
    - pre_repair_status := SCHEDULED
    - PENDING RouteStop referencing this pole -> BLOCKED; route blocked_stop_count recomputed
  - from: CONVERTED
    to: UNDER_REPAIR
    trigger: system (OutageTicket resolved with resolution_code FIXTURE_REPLACED)
    actor: system
    preconditions: []
    side_effects:
    - pre_repair_status := CONVERTED
  - from: REWORK
    to: UNDER_REPAIR
    trigger: system (OutageTicket resolved with resolution_code FIXTURE_REPLACED)
    actor: system
    preconditions: []
    side_effects:
    - pre_repair_status := REWORK
  - from: VERIFIED
    to: UNDER_REPAIR
    trigger: system (OutageTicket resolved with resolution_code FIXTURE_REPLACED)
    actor: system
    preconditions: []
    side_effects:
    - pre_repair_status := VERIFIED
  - from: UNDER_REPAIR
    to: SCHEDULED
    trigger: system (replacement WorkOrder qc_status -> QC_PASSED and pre_repair_status == SCHEDULED)
    actor: system
    preconditions: []
    side_effects:
    - pre_repair_status := null
    - BLOCKED RouteStop referencing this pole -> PENDING; route blocked_stop_count recomputed
  - from: UNDER_REPAIR
    to: VERIFIED
    trigger: system (replacement WorkOrder qc_status -> QC_PASSED and pre_repair_status in {CONVERTED, REWORK, VERIFIED})
    actor: system
    preconditions: []
    side_effects:
    - pre_repair_status := null
  - from: AUDIT_CLEARED
    to: EXEMPT
    trigger: system (CONVERSION_EXEMPTION ComplianceException APPROVED)
    actor: system
    preconditions: []
    side_effects:
    - pole excluded from future generate-lines runs
  - from: UNDER_REPAIR
    to: UNDER_REPAIR
    trigger: system (another OutageTicket resolved with resolution_code FIXTURE_REPLACED while already UNDER_REPAIR)
    actor: system
    preconditions: []
    side_effects:
    - pre_repair_status RETAINED from the first repair episode (not overwritten)
    - a new replacement WorkOrder is created (crew := resolving crew); no stop transition (stop already BLOCKED or absent)
- entity: WattageAudit
  initial_state: SUBMITTED
  terminal_states:
  - SUPERSEDED
  transitions:
  - from: SUBMITTED
    to: ACCEPTED
    trigger: POST /streetlights/audits/{id}/accept
    actor: ProgramManager
    preconditions:
    - Pole is not EXEMPT (ERR_POLE_EXEMPT)
    side_effects:
    - pole.effective_wattage := audited_wattage
    - any prior ACCEPTED audit for this pole -> SUPERSEDED
    - 'if pole.status == SURVEYED: pole -> AUDIT_CLEARED'
    - 'audit_retroactive_adjustment: re-rate this pole''s ESTIMATED lines and supersede BILLED lines whose charge changes, creating ADJUSTMENT lines; account and program rollups recomputed'
    - increments Pole.version by 1
  - from: SUBMITTED
    to: DISPUTED
    trigger: POST /streetlights/audits/{id}/dispute
    actor: ProgramManager
    preconditions: []
    side_effects:
    - decided_by_user_id recorded
  - from: DISPUTED
    to: SUBMITTED
    trigger: POST /streetlights/audits/{id}/resubmit
    actor: FieldSupervisor
    preconditions: []
    side_effects:
    - audited_wattage := payload value; revision_count += 1; decided_by_user_id := null
  - from: ACCEPTED
    to: SUPERSEDED
    trigger: system (a newer WattageAudit for the same pole is ACCEPTED)
    actor: system
    preconditions: []
    side_effects: []
- entity: ConversionRoute
  initial_state: PLANNED
  terminal_states:
  - CLOSED
  - CANCELLED
  transitions:
  - from: PLANNED
    to: RELEASED
    trigger: POST /streetlights/conversion-routes/{id}/release
    actor: ProgramManager
    preconditions:
    - stop_count >= 1 (ERR_EMPTY_ROUTE)
    side_effects:
    - one WorkOrder auto-created per non-SKIPPED stop (execution_status PENDING, qc_status NONE, stop_minutes from stop difficulty)
  - from: RELEASED
    to: IN_PROGRESS
    trigger: system (first linked WorkOrder dispatch)
    actor: system
    preconditions: []
    side_effects: []
  - from: IN_PROGRESS
    to: SUSPENDED
    trigger: 'POST /streetlights/conversion-routes/{id}/suspend OR system (route_auto_suspension: blocked_stop_count * 2 >= stop_count)'
    actor: ProgramManager | system
    preconditions: []
    side_effects: []
  - from: SUSPENDED
    to: IN_PROGRESS
    trigger: POST /streetlights/conversion-routes/{id}/resume
    actor: ProgramManager
    preconditions:
    - blocked_stop_count * 2 < stop_count (ERR_ROUTE_STILL_BLOCKED)
    side_effects: []
  - from: PLANNED
    to: CANCELLED
    trigger: POST /streetlights/conversion-routes/{id}/cancel
    actor: ProgramManager
    preconditions: []
    side_effects:
    - all PENDING/BLOCKED stops -> SKIPPED
    - linked poles in SCHEDULED -> AUDIT_CLEARED
  - from: RELEASED
    to: CANCELLED
    trigger: POST /streetlights/conversion-routes/{id}/cancel
    actor: ProgramManager
    preconditions: []
    side_effects:
    - all PENDING/BLOCKED stops -> SKIPPED
    - non-terminal WorkOrders -> CANCELLED with outstanding-estimate refunds
    - linked poles in SCHEDULED -> AUDIT_CLEARED
  - from: IN_PROGRESS
    to: CANCELLED
    trigger: POST /streetlights/conversion-routes/{id}/cancel
    actor: ProgramManager
    preconditions: []
    side_effects:
    - same cascade as RELEASED -> CANCELLED
  - from: SUSPENDED
    to: CANCELLED
    trigger: POST /streetlights/conversion-routes/{id}/cancel
    actor: ProgramManager
    preconditions: []
    side_effects:
    - same cascade as RELEASED -> CANCELLED
  - from: IN_PROGRESS
    to: CLOSED
    trigger: 'system (route_auto_close: every stop in {COMPLETE, SKIPPED} AND no WorkOrder with execution_status in {PENDING, DISPATCHED, FAILED, REWORK_PENDING} AND no WorkOrder with qc_status == AWAITING_QC)'
    actor: system
    preconditions: []
    side_effects: []
- entity: RouteStop
  initial_state: PENDING
  terminal_states:
  - COMPLETE
  - SKIPPED
  transitions:
  - from: PENDING
    to: COMPLETE
    trigger: system (linked WorkOrder execution_status -> COMPLETED)
    actor: system
    preconditions: []
    side_effects: []
  - from: PENDING
    to: SKIPPED
    trigger: POST /streetlights/route-stops/{id}/skip OR system (route cancel cascade or linked work-order cancel)
    actor: ProgramManager | system
    preconditions:
    - linked WorkOrder (if any) has execution_status PENDING (ERR_STOP_NOT_PENDING if DISPATCHED/COMPLETED work exists)
    side_effects:
    - linked PENDING WorkOrder -> CANCELLED (no estimate was debited, so no refund)
    - pole SCHEDULED -> AUDIT_CLEARED
  - from: PENDING
    to: BLOCKED
    trigger: system (pole -> UNDER_REPAIR)
    actor: system
    preconditions: []
    side_effects:
    - route blocked_stop_count recomputed; route_auto_suspension evaluated
  - from: BLOCKED
    to: PENDING
    trigger: system (pole leaves UNDER_REPAIR to SCHEDULED)
    actor: system
    preconditions: []
    side_effects:
    - route blocked_stop_count recomputed
- entity: WorkOrder
  initial_state: PENDING
  terminal_states:
  - CANCELLED
  note: 'Parallel dimensions: execution_status and qc_status evolve on one row. qc_status transitions: NONE -> AWAITING_QC on each completion; AWAITING_QC -> QC_PASSED | QC_FAILED via QC endpoints; QC_FAILED
    persists through rework dispatch and resets to AWAITING_QC on the rework completion.'
  transitions:
  - from: PENDING
    to: DISPATCHED
    trigger: POST /streetlights/work-orders/{id}/dispatch
    actor: FieldSupervisor
    preconditions:
    - acting crew (X-User-ID) == work order crew_id (ERR_FORBIDDEN)
    - route (when route_id not null) in {RELEASED, IN_PROGRESS} (ERR_ROUTE_SUSPENDED when SUSPENDED; on CLOSED/CANCELLED routes every linked work order is terminal, so the work-order state check fires first)
    - linked stop (when stop_id not null) status == PENDING (ERR_STOP_BLOCKED)
    - no other WorkOrder for the same pole with execution_status DISPATCHED (ERR_ACTIVE_WORK_ORDER_EXISTS)
    - 'dark-sky: new_cct_kelvin <= district cct_cap_kelvin, unless pole holds an APPROVED CCT_WAIVER with requested_cct_kelvin >= new_cct_kelvin and valid_until >= current date (ERR_CCT_EXCEEDS_ZONE_CAP)'
    - 'shielding: FULL_CUTOFF required when district full_cutoff_required (ERR_SHIELDING_REQUIRED)'
    - 'wattage reduction: new_fixture_wattage * 5 <= pole.effective_wattage * 4 (ERR_INSUFFICIENT_WATTAGE_REDUCTION)'
    - estimated_labor_cost_cents <= program.budget_balance_cents (ERR_PROGRAM_BUDGET_EXCEEDED)
    side_effects:
    - estimated_labor_cost_cents computed and debited from program.budget_balance_cents
    - fixture fields stored; route RELEASED -> IN_PROGRESS on first dispatch
    - increments ConversionProgram.version by 1
  - from: REWORK_PENDING
    to: DISPATCHED
    trigger: POST /streetlights/work-orders/{id}/dispatch
    actor: FieldSupervisor
    preconditions:
    - same as PENDING -> DISPATCHED
    side_effects:
    - fixture fields updated from payload; no new estimate debit (single estimate per work order)
  - from: DISPATCHED
    to: COMPLETED
    trigger: POST /streetlights/work-orders/{id}/complete
    actor: FieldSupervisor
    preconditions:
    - acting crew == work order crew_id (ERR_FORBIDDEN)
    side_effects:
    - completed_at := clock; performed_by_user_id := X-User-ID; qc_status -> AWAITING_QC
    - labor_cost_cents computed per work_order_labor_cost; program.budget_balance_cents -= (labor_cost_cents - estimated_labor_cost_cents) when est not yet reconciled, else -= labor_cost_cents; est_reconciled
      := true
    - 'conversion orders: pole -> CONVERTED (or REWORK -> CONVERTED) with wattage/date snapshots'
    - 'replacement orders: pole wattage/date refreshed (status stays UNDER_REPAIR until QC)'
    - one SalvageItem auto-created (batch_id null, fixture_class from pole, weight_lbs 0, mercury_flag false) at the FIRST completion of this order only (est_reconciled false -> true); rework re-completions
      create none
    - ESTIMATED BillingLines for this pole in open account periods re-rated (monthly_unmetered_charge)
    - linked stop -> COMPLETE; route_auto_close evaluated
    - increments ConversionProgram.version by 1
  - from: DISPATCHED
    to: FAILED
    trigger: POST /streetlights/work-orders/{id}/fail
    actor: FieldSupervisor
    preconditions:
    - acting crew == work order crew_id (ERR_FORBIDDEN)
    side_effects:
    - no budget movement (estimate remains outstanding)
  - from: FAILED
    to: PENDING
    trigger: system (automatic immediate retry queue)
    actor: system
    preconditions: []
    side_effects: []
  - from: PENDING
    to: CANCELLED
    trigger: POST /streetlights/work-orders/{id}/cancel OR system (route cancel / stop skip cascade)
    actor: ProgramManager | system
    preconditions: []
    side_effects:
    - linked stop (if PENDING) -> SKIPPED; pole SCHEDULED -> AUDIT_CLEARED
  - from: DISPATCHED
    to: CANCELLED
    trigger: POST /streetlights/work-orders/{id}/cancel OR system (route cancel cascade)
    actor: ProgramManager | system
    preconditions: []
    side_effects:
    - program.budget_balance_cents += estimated_labor_cost_cents when est not yet reconciled
    - linked stop (if PENDING) -> SKIPPED; pole SCHEDULED -> AUDIT_CLEARED
  - from: REWORK_PENDING
    to: CANCELLED
    trigger: POST /streetlights/work-orders/{id}/cancel
    actor: ProgramManager
    preconditions: []
    side_effects:
    - linked stop (if PENDING) -> SKIPPED; pole stays REWORK (already converted; no status revert)
- entity: WorkOrderQC
  note: Logical machine for the qc_status dimension of WorkOrder (declared on WorkOrder row; separated for clarity of the parallel dimension).
  entity_ref: WorkOrder
  initial_state: NONE
  terminal_states:
  - QC_PASSED
  transitions:
  - from: NONE
    to: AWAITING_QC
    trigger: system (execution_status -> COMPLETED)
    actor: system
    preconditions: []
    side_effects: []
  - from: AWAITING_QC
    to: QC_PASSED
    trigger: POST /streetlights/work-orders/{id}/qc-pass
    actor: QaInspector
    preconditions:
    - execution_status == COMPLETED (ERR_QC_NOT_AWAITING otherwise, incl. wrong qc state)
    - X-User-ID != performed_by_user_id (ERR_SEGREGATION_OF_DUTIES)
    side_effects:
    - qc_by_user_id := X-User-ID
    - 'conversion orders: pole CONVERTED -> VERIFIED'
    - 'replacement orders: pole UNDER_REPAIR -> SCHEDULED when pre_repair_status == SCHEDULED (blocked stop returns to PENDING), else pole UNDER_REPAIR -> VERIFIED'
  - from: AWAITING_QC
    to: QC_FAILED
    trigger: POST /streetlights/work-orders/{id}/qc-fail
    actor: QaInspector
    preconditions:
    - execution_status == COMPLETED (ERR_QC_NOT_AWAITING)
    - X-User-ID != performed_by_user_id (ERR_SEGREGATION_OF_DUTIES)
    side_effects:
    - qc_by_user_id := X-User-ID
    - execution_status COMPLETED -> REWORK_PENDING
    - 'conversion orders: pole CONVERTED -> REWORK'
  - from: QC_FAILED
    to: AWAITING_QC
    trigger: system (rework completion)
    actor: system
    preconditions: []
    side_effects: []
- entity: TariffRateSchedule
  initial_state: DRAFT
  terminal_states:
  - SUPERSEDED
  transitions:
  - from: DRAFT
    to: FILED
    trigger: POST /streetlights/rate-schedules/{id}/file
    actor: BillingAnalyst
    preconditions:
    - 'no half-open-window overlap with any FILED or EFFECTIVE schedule of same (program_id, ownership_class): overlap = self.effective_from < other.effective_until(null=+inf) AND other.effective_from <
      self.effective_until(null=+inf); adjacency (self.from == other.until or self.until == other.from) is allowed (ERR_RATE_WINDOW_OVERLAP)'
    side_effects: []
  - from: FILED
    to: EFFECTIVE
    trigger: POST /streetlights/rate-schedules/{id}/activate
    actor: BillingAnalyst
    preconditions: []
    side_effects: []
  - from: EFFECTIVE
    to: SUPERSEDED
    trigger: POST /streetlights/rate-schedules/{id}/retire
    actor: BillingAnalyst
    preconditions:
    - payload effective_until present, > effective_from, and >= current date (ERR_INVALID_REQUEST)
    side_effects:
    - effective_until := payload value (window shortened)
- entity: TariffAccount
  initial_state: OPEN
  terminal_states: []
  transitions:
  - from: OPEN
    to: FROZEN
    trigger: POST /streetlights/tariff-accounts/{id}/freeze
    actor: BillingAnalyst
    preconditions: []
    side_effects: []
  - from: FROZEN
    to: OPEN
    trigger: POST /streetlights/tariff-accounts/{id}/unfreeze
    actor: BillingAnalyst
    preconditions: []
    side_effects: []
- entity: BillingLine
  initial_state: ESTIMATED
  terminal_states:
  - SUPERSEDED
  transitions:
  - from: ESTIMATED
    to: BILLED
    trigger: system (POST /streetlights/tariff-accounts/{id}/close-period)
    actor: system
    preconditions: []
    side_effects:
    - account.ytd_billed_cents and current_period_estimated_cents recomputed
  - from: ESTIMATED
    to: ESTIMATED
    trigger: system (re-rate on pole conversion completion, replacement completion, or accepted audit)
    actor: system
    preconditions: []
    side_effects:
    - charge_cents, billing_wattage, tier, rate_schedule_id recomputed in place
  - from: BILLED
    to: SUPERSEDED
    trigger: 'system (audit_retroactive_adjustment: accepted audit changes this line''s computed charge)'
    actor: system
    preconditions: []
    side_effects:
    - new ADJUSTMENT BillingLine created (status BILLED, supersedes_line_id := this line, charge_cents := signed delta)
    - account.ytd_billed_cents recomputed
- entity: OutageTicket
  initial_state: OPEN
  terminal_states:
  - VERIFIED
  - DUPLICATE
  transitions:
  - from: OPEN
    to: DUPLICATE
    trigger: 'system (at creation: an existing ticket for the same pole has status in {OPEN, TRIAGED, DISPATCHED, RESOLVED, REOPENED})'
    actor: system
    preconditions: []
    side_effects:
    - duplicate_of_ticket_id := selector result per ticket_duplicate_selector
  - from: OPEN
    to: TRIAGED
    trigger: POST /streetlights/outage-tickets/{id}/triage
    actor: ProgramManager
    preconditions: []
    side_effects:
    - priority and sla_hours computed per sla_priority_and_breach
  - from: TRIAGED
    to: DISPATCHED
    trigger: POST /streetlights/outage-tickets/{id}/dispatch
    actor: ProgramManager
    preconditions: []
    side_effects:
    - assigned_crew_id := payload crew_id
  - from: DISPATCHED
    to: RESOLVED
    trigger: POST /streetlights/outage-tickets/{id}/resolve
    actor: FieldSupervisor
    preconditions:
    - acting crew (X-User-ID) == assigned_crew_id (ERR_FORBIDDEN)
    side_effects:
    - resolved_at := clock; sla_breached := (resolved_at - reported_at) > sla_hours hours (strictly greater)
    - 'when resolution_code == FIXTURE_REPLACED: cascade_resolve_replacement fires (pole -> UNDER_REPAIR with pre_repair_status; replacement WorkOrder created exec PENDING crew := assigned_crew_id; pole''s
      PENDING stop -> BLOCKED; route_auto_suspension evaluated)'
  - from: RESOLVED
    to: VERIFIED
    trigger: POST /streetlights/outage-tickets/{id}/verify
    actor: CitizenReporter
    preconditions:
    - X-User-ID == reporter_user_id (ERR_FORBIDDEN)
    side_effects: []
  - from: RESOLVED
    to: REOPENED
    trigger: POST /streetlights/outage-tickets/{id}/reopen
    actor: CitizenReporter
    preconditions:
    - X-User-ID == reporter_user_id (ERR_FORBIDDEN)
    - clock <= resolved_at + 72 hours (ERR_REOPEN_WINDOW_EXPIRED)
    side_effects:
    - reopen_count += 1
    - priority escalates one level (STANDARD -> HIGH -> CRITICAL; CRITICAL stays); sla_hours recomputed
    - 'SLA clock NOT reset: reported_at unchanged; next resolution measures from original reported_at'
  - from: REOPENED
    to: TRIAGED
    trigger: POST /streetlights/outage-tickets/{id}/triage
    actor: ProgramManager
    preconditions: []
    side_effects:
    - priority/sla_hours re-asserted (escalated values retained)
- entity: SalvageBatch
  initial_state: ACCUMULATING
  terminal_states:
  - SETTLED
  - REJECTED
  transitions:
  - from: ACCUMULATING
    to: SEALED
    trigger: POST /streetlights/salvage-batches/{id}/seal
    actor: ComplianceOfficer
    preconditions:
    - item_count >= 1 (ERR_EMPTY_BATCH)
    side_effects:
    - contaminated_flag recorded from payload
  - from: SEALED
    to: MANIFESTED
    trigger: POST /streetlights/salvage-batches/{id}/manifest
    actor: ComplianceOfficer
    preconditions:
    - every item has weight_lbs > 0 (ERR_UNWEIGHED_ITEMS)
    side_effects:
    - manifest_code := MF-<batch_label>
    - settlement_value_cents computed per salvage_settlement_value
  - from: MANIFESTED
    to: SETTLED
    trigger: POST /streetlights/salvage-batches/{id}/settle
    actor: BillingAnalyst
    preconditions: []
    side_effects:
    - program.budget_balance_cents += settlement_value_cents
    - increments ConversionProgram.version by 1
  - from: SEALED
    to: REJECTED
    trigger: POST /streetlights/salvage-batches/{id}/reject
    actor: ComplianceOfficer
    preconditions:
    - batch in {SEALED, MANIFESTED} (ERR_BATCH_NOT_REJECTABLE)
    side_effects:
    - all items returned to unbatched pool (batch_id := null)
  - from: MANIFESTED
    to: REJECTED
    trigger: POST /streetlights/salvage-batches/{id}/reject
    actor: ComplianceOfficer
    preconditions: []
    side_effects:
    - all items returned to unbatched pool (batch_id := null); settlement_value_cents := null
- entity: SavingsReport
  initial_state: DRAFT
  terminal_states:
  - ATTESTED
  - SUPERSEDED
  transitions:
  - from: DRAFT
    to: SUBMITTED
    trigger: POST /streetlights/savings-reports/{id}/submit
    actor: ProgramManager
    preconditions:
    - every TariffAccount of the program has current_period > report.period AND no ESTIMATED lines in report.period (ERR_REPORT_PERIOD_OPEN)
    side_effects:
    - submitted_by_user_id := X-User-ID
  - from: SUBMITTED
    to: ATTESTED
    trigger: POST /streetlights/savings-reports/{id}/attest
    actor: Auditor
    preconditions:
    - X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)
    side_effects:
    - attested_credit_cents computed per incentive_rebate_credit
    - program.budget_balance_cents += attested_credit_cents
    - attested_by_user_id := X-User-ID
    - increments ConversionProgram.version by 1
  - from: SUBMITTED
    to: REJECTED
    trigger: POST /streetlights/savings-reports/{id}/reject
    actor: Auditor
    preconditions:
    - X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)
    side_effects:
    - rejected report contributes 0 to fiscal-year credited totals
  - from: REJECTED
    to: DRAFT
    trigger: POST /streetlights/savings-reports/{id}/revise
    actor: ProgramManager
    preconditions: []
    side_effects:
    - submitted_by_user_id := null; computed kwh/credit fields recomputed from current pole state
  - from: DRAFT
    to: SUPERSEDED
    trigger: system (a new SavingsReport is created for the same (program_id, period))
    actor: system
    preconditions: []
    side_effects: []
  - from: REJECTED
    to: SUPERSEDED
    trigger: system (a new SavingsReport is created for the same (program_id, period))
    actor: system
    preconditions: []
    side_effects: []
- entity: ComplianceException
  initial_state: REQUESTED
  terminal_states:
  - DENIED
  - EXPIRED
  transitions:
  - from: REQUESTED
    to: APPROVED
    trigger: POST /streetlights/compliance-exceptions/{id}/approve
    actor: ComplianceOfficer
    preconditions:
    - valid_until >= current date (ERR_EXCEPTION_WINDOW_PAST)
    - 'when exception_kind == CONVERSION_EXEMPTION: pole status == AUDIT_CLEARED (ERR_POLE_NOT_AUDIT_CLEARED)'
    side_effects:
    - decided_by_user_id := X-User-ID
    - 'CONVERSION_EXEMPTION: pole AUDIT_CLEARED -> EXEMPT'
  - from: REQUESTED
    to: DENIED
    trigger: POST /streetlights/compliance-exceptions/{id}/deny
    actor: ComplianceOfficer
    preconditions: []
    side_effects:
    - decided_by_user_id := X-User-ID
  - from: APPROVED
    to: EXPIRED
    trigger: POST /streetlights/compliance-exceptions/{id}/refresh (materializes time-based expiry)
    actor: any authenticated role
    preconditions:
    - current date > valid_until (ERR_EXCEPTION_NOT_EXPIRED otherwise)
    side_effects: []
  note: Dispatch-time CCT waiver evaluation treats an APPROVED exception with valid_until < current date as expired (not honored) even before refresh materializes EXPIRED.
concurrency_rules:
- rule_id: audit-submit-stale-pole
  parent_entity: Pole
  write_endpoint: POST /streetlights/poles/{poleId}/audits
  occ_field: expected_pole_version
  description: 'Submitting a WattageAudit against a Pole whose version has advanced since

    the client last observed it is rejected. Audit submission always succeeds

    under natural product semantics (a new SUBMITTED audit is legal whenever no

    other audit is pending), so the OCC check is the only rejection when the

    client''s view of the pole is stale.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
- rule_id: report-create-stale-program
  parent_entity: ConversionProgram
  write_endpoint: POST /streetlights/savings-reports
  occ_field: expected_program_version
  description: 'Creating a SavingsReport against a ConversionProgram whose version has

    advanced since the client last observed it is rejected. Creating a report

    for a period legitimately supersedes the prior DRAFT/REJECTED report, so a

    second create with a fresh version would itself succeed; only the stale

    expected_program_version distinguishes the rejected request.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
calculations:
- name: wattage_tier_assignment
  trigger: on any read or rate lookup of a Pole (derived from billing_wattage)
  algorithm: threshold
  formula: 'w = pole.billing_wattage  (= led_wattage when led_in_service_date set, else effective_wattage)

    T1 when w < 100; T2 when 100 <= w < 200; T3 when 200 <= w < 300;

    T4 when 300 <= w < 450; T5 when w >= 450.

    Tier lower bounds are INCLUSIVE: w == 100 -> T2, w == 200 -> T3, w == 300 -> T4, w == 450 -> T5.

    '
  input_set: every Pole
  precision: integer watts; exact boundary semantics pinned above
- name: monthly_unmetered_charge
  trigger: generate-lines (line creation), and re-rate of ESTIMATED lines on pole conversion/replacement completion or accepted audit
  algorithm: tiered_pricing
  formula: "Let period = [p_start, p_end] (calendar month of account.current_period, inclusive both ends),\nD = days in period, pole P with ownership_class C.\nRate schedule S = the TariffRateSchedule of\
    \ (program, C) with status in {EFFECTIVE, SUPERSEDED}\nwhose half-open window [effective_from, effective_until) covers p_start (effective_until null = +inf).\nIf none exists -> generation fails atomically\
    \ with ERR_NO_EFFECTIVE_RATE_SCHEDULE.\nR_old = S.tier_rates[tier(pole.effective_wattage)]; R_new = S.tier_rates[tier(pole.led_wattage)] (when converted).\nVariant selected by P.ownership_class:\n-\
    \ MUNICIPAL (daily proration):\n    if P.led_in_service_date is null or > p_end: charge = R_old, billing_wattage = effective_wattage\n    elif P.led_in_service_date <= p_start: charge = R_new, billing_wattage\
    \ = led_wattage\n    else: d_old = days in [p_start, in_service_date - 1]; d_new = D - d_old (in-service day bills NEW rate)\n          charge = round_half_up(R_old * d_old / D) + round_half_up(R_new\
    \ * d_new / D)\n          billing_wattage = led_wattage; tier = tier(led_wattage)\n- UTILITY_OWNED (whole-month deferral):\n    if P.led_in_service_date is null or > p_end: charge = R_old, billing_wattage\
    \ = effective_wattage\n    elif P.led_in_service_date >= p_start: charge = R_old (conversion bills OLD rate for the WHOLE\n          period; new rate applies from the next period), billing_wattage =\
    \ effective_wattage\n    else: charge = R_new, billing_wattage = led_wattage\nEach prorated part is rounded individually, THEN summed (rounding order pinned).\n"
  input_set: Poles of the account's (district, ownership_class) with status != EXEMPT
  precision: integer cents; round_half_up per prorated part, then sum
  variants:
  - name: municipal_daily_proration
    when: pole.ownership_type == MUNICIPAL
    difference: splits the period at led_in_service_date; old and new rates prorated by day counts
  - name: utility_whole_month_deferral
    when: pole.ownership_type == UTILITY_OWNED
    difference: entire conversion period bills at the OLD rate; new rate applies from the next period
- name: route_capacity_check
  trigger: POST /streetlights/conversion-routes/{id}/stops (evaluated incrementally on each added stop, including the candidate stop)
  algorithm: constraint_propagation
  formula: "m_new = minutes(difficulty_class)                    # STANDARD 45 | HEAVY 75 | COMPLEX 120\nM = 60 when route.traffic_control_required else 30   # mobilization minutes per shift\nS = 480  \
    \                                            # shift minutes\nW = sum of stop_minutes over all non-SKIPPED stops INCLUDING the candidate\nrequired_shifts = ceil(W / (S - M))\nwindow_days = (window_end_date\
    \ - window_start_date).days + 1   # inclusive\nREJECT (ERR_ROUTE_CAPACITY_EXCEEDED) when:\n    required_shifts > window_days\n    OR ceil(stop_count_including_candidate / required_shifts) > crew.base_stops_per_shift\n\
    Both checks use the post-add W and stop_count (incremental evaluation).\n"
  input_set: non-SKIPPED stops of the route plus the candidate stop
  constants:
    SHIFT_MINUTES: 480
    MOBILIZATION_TRAFFIC_MINUTES: 60
    MOBILIZATION_BASE_MINUTES: 30
  note: 'Non-linear: nested ceil with conditional mobilization; stop-rate cap can bind while shift-fit passes and vice versa'
- name: work_order_labor_cost
  trigger: POST /streetlights/work-orders/{id}/complete
  algorithm: chronological
  formula: 'Weekly accumulator scope: the crew''s COMPLETED work orders (execution COMPLETED, any qc) whose

    completed_at falls in the same ISO-8601 week (Monday 00:00 UTC .. Sunday 24:00 UTC) as this completion.

    Processing order for threshold attribution: completed_at ASC, then route.window_start_date ASC,

    then stop.sequence_number ASC (ties on completed_at are fully broken: a crew''s routes never share a

    calendar day because route windows are closed-interval disjoint per crew, and sequence_number is

    unique per route; replacement orders have window_start_date := null and sort AFTER dated orders on

    the same completed_at, with ticket.created_at ASC as their ordering key).

    prev = sum of stop_minutes over that ordered set EXCLUDING this completion

    m = this order''s stop_minutes; rate = crew.hourly_rate_cents; T = 2400 (weekly overtime threshold)

    if prev >= T:            normal = 0,        excess = m

    elif prev + m > T:       excess = prev + m - T,  normal = m - excess

    else:                    normal = m,        excess = 0

    labor_cost_cents = round_half_up(rate * normal / 60) + round_half_up(rate * 1.5 * excess / 60)

    cumulative_week_minutes_before := prev; overtime_minutes := excess

    Marginal allocation: only minutes BEYOND 2400 bill at 1.5x; prev == 2400 exactly means the whole

    stop is overtime; prev + m == 2400 exactly means NO overtime on that stop.

    '
  constants:
    WEEKLY_OVERTIME_MINUTES: 2400
    OVERTIME_MULTIPLIER: 1.5
  precision: integer cents; each component rounded round_half_up, then summed
- name: salvage_settlement_value
  trigger: POST /streetlights/salvage-batches/{id}/manifest
  algorithm: waterfall_allocation
  formula: "Evaluation order is PINNED (rounding order is observable):\n1. Per fixture class c in {COBRA_HEAD, FLOOD, POST_TOP, DECORATIVE}:\n     class_weight = sum of weight_lbs over batch items of class\
    \ c\n     class_value_cents(c) = round_half_up(class_weight * PRICE_PER_LB_CENTS[c])\n                            - MERCURY_DEDUCTION_CENTS * (count of class-c items with mercury_flag)\n     class_value_cents(c)\
    \ = max(0, class_value_cents(c))\n2. subtotal = sum of the four ROUNDED class values        # per-class-round-then-sum, NOT sum-then-round\n3. contamination deduction: when batch.contaminated_flag:\
    \ deduction = round_half_up(subtotal * 0.15); subtotal -= deduction\n4. settlement_value_cents = max(0, subtotal - TRANSPORT_FEE_CENTS)\n"
  constants:
    PRICE_PER_LB_CENTS:
      COBRA_HEAD: 85
      FLOOD: 95
      POST_TOP: 70
      DECORATIVE: 110
    MERCURY_DEDUCTION_CENTS: 300
    CONTAMINATION_RATE: 0.15
    TRANSPORT_FEE_CENTS: 4500
  precision: integer cents; round_half_up at steps 1 and 3 only
- name: savings_verification_kwh
  trigger: SavingsReport creation and revise (fields recomputed from current pole state)
  algorithm: aggregation
  formula: "Period P = report.period (calendar month); B = BURN_HOURS[month of P]; D = days in P.\nInclusion set: poles of the program with led_in_service_date set AND led_in_service_date <= p_end\nAND\
    \ status in {CONVERTED, REWORK, VERIFIED, UNDER_REPAIR} (EXEMPT and pre-conversion poles excluded).\nPer-pole quantities are rounded to 3 decimals (round_half_up) BEFORE summation (order pinned).\n\
    - ENGINEERING_ESTIMATE (design estimate; full-month credit regardless of in-service day):\n    per pole: baseline_p = pre_conversion_wattage * B / 1000\n              actual_p   = led_wattage * B /\
    \ 1000\n- METERED_ACTUAL (prorated to in-service days):\n    d_new = days d in P with d >= led_in_service_date (0 when in-service after p_end; D when before p_start)\n    d_old = D - d_new\n    per\
    \ pole: baseline_p = pre_conversion_wattage * B / 1000\n              actual_p   = (pre_conversion_wattage * B * d_old / D + led_wattage * B * d_new / D) / 1000\nreport.baseline_kwh = sum(baseline_p);\
    \ report.actual_kwh = sum(actual_p)\nreport.savings_kwh = round_half_up(baseline_kwh - actual_kwh, 3)\n"
  constants:
    BURN_HOURS:
      '01': 420
      '02': 380
      '03': 360
      '04': 320
      '05': 290
      '06': 270
      '07': 280
      08: 310
      09: 340
      '10': 380
      '11': 410
      '12': 430
  precision: kwh to 3 decimal places, round_half_up; per-pole rounding before summation
  variants:
  - name: engineering_estimate
    when: report.method == ENGINEERING_ESTIMATE
    difference: credits the full calendar month for every converted pole, ignoring the in-service day
  - name: metered_actual
    when: report.method == METERED_ACTUAL
    difference: 'prorates actual consumption: old fixture burns pre-in-service days, LED burns the rest'
- name: incentive_rebate_credit
  trigger: POST /streetlights/savings-reports/{id}/attest
  algorithm: threshold
  formula: "Circular-looking dependency, evaluation order PINNED:\n1. raw_credit_cents = round_half_up(report.savings_kwh * program.rebate_cents_per_kwh)\n2. fy_credited_cents = sum of attested_credit_cents\
    \ over OTHER SavingsReports of the same\n   (program_id, fiscal_year_label) with status ATTESTED (REJECTED, SUPERSEDED, DRAFT, SUBMITTED\n   excluded; THIS report excluded)\n3. remaining = max(0, program.fy_rebate_cap_cents\
    \ - fy_credited_cents)\n4. attested_credit_cents = min(raw_credit_cents, remaining)\nprogram.budget_balance_cents += attested_credit_cents (exactly once, at attestation)\n"
  precision: integer cents, round_half_up at step 1
- name: sla_priority_and_breach
  trigger: ticket triage (priority/sla_hours set), reopen (priority escalation), resolve (breach evaluation)
  algorithm: threshold
  formula: "At triage:\n  hazard_flag == true -> CRITICAL\n  elif district.zone == ARTERIAL and pole.wattage_tier in {T4, T5} -> CRITICAL\n  elif district.zone == ARTERIAL or pole.wattage_tier in {T3, T4,\
    \ T5} -> HIGH\n  else -> STANDARD\nsla_hours: CRITICAL 24 | HIGH 48 | STANDARD 96\nAt reopen: priority escalates exactly one level (STANDARD->HIGH->CRITICAL; CRITICAL unchanged);\nsla_hours recomputed\
    \ from the escalated priority; reported_at is NOT reset.\nAt resolve: sla_breached = (resolved_at - reported_at) > sla_hours   # STRICTLY greater;\nelapsed exactly == sla_hours is NOT a breach.\n"
  input_set: the ticket and its pole/district
  constants:
    SLA_HOURS:
      CRITICAL: 24
      HIGH: 48
      STANDARD: 96
    REOPEN_WINDOW_HOURS: 72
- name: ticket_duplicate_selector
  trigger: POST /streetlights/outage-tickets (at creation)
  algorithm: aggregation
  formula: 'Candidate set: existing OutageTickets with pole_id == payload pole_id and status in

    {OPEN, TRIAGED, DISPATCHED, RESOLVED, REOPENED} (VERIFIED and DUPLICATE excluded).

    Empty candidate set -> new ticket created OPEN.

    Otherwise new ticket is created with status DUPLICATE and

    duplicate_of_ticket_id := candidate with earliest created_at (ties broken by reported_at ASC,

    which equals created_at for tickets; a full tie cannot occur because creation is serialized

    through the logical clock plus monotonic insertion order).

    DUPLICATE tickets carry no priority/sla and cannot be triaged (terminal).

    '
  note: 'Selector determinism: eligibility filter, ranking (created_at ASC), and empty-set fallback all pinned'
- name: audit_retroactive_adjustment
  trigger: POST /streetlights/audits/{id}/accept (when pole.effective_wattage changes)
  algorithm: chronological
  formula: "For the audited pole, process its BillingLines in period ASC order (created_at ASC within a period):\n- ESTIMATED REGULAR lines: recompute monthly_unmetered_charge in place (new effective_wattage\n\
    \  changes R_old and possibly the old-rate tier); update charge_cents/billing_wattage/tier.\n- BILLED REGULAR lines: recompute the charge with the new effective_wattage (dates, proration\n  split, and\
    \ ownership variant unchanged; only the wattage basis moves).\n  delta = new_charge_cents - old charge_cents.\n  When delta != 0: old line -> SUPERSEDED; create ADJUSTMENT line (status BILLED,\n  supersedes_line_id\
    \ = old line, period = old period, charge_cents = delta, line_type ADJUSTMENT).\n  When delta == 0: leave the line untouched (no SUPERSEDED churn).\nThen recompute the account's current_period_estimated_cents\
    \ and ytd_billed_cents and the\nprogram's current_billing_run_estimated_cents.\n"
  input_set: all BillingLines of the pole across all accounts/periods
  precision: integer cents
- name: budget_balance_ledger
  trigger: work-order dispatch, completion, cancel; salvage settle; report attest; route cancel cascade
  algorithm: aggregation
  formula: "budget_balance_cents evolves only through these postings:\n  dispatch (from PENDING):            -= estimated_labor_cost_cents\n  dispatch (from REWORK_PENDING):     no posting (single estimate\
    \ per work order)\n  complete:                           -= (labor_cost_cents - estimated_labor_cost_cents) when est\n                                        not yet reconciled; else -= labor_cost_cents\n\
    \  cancel from DISPATCHED:             += estimated_labor_cost_cents when est not yet reconciled\n  cancel from PENDING/REWORK_PENDING: no posting\n  salvage settle:                     += settlement_value_cents\n\
    \  report attest:                      += attested_credit_cents\nInvariant (compensating pairs): dispatch-from-PENDING followed by cancel-from-DISPATCHED leaves\nbudget_balance_cents EXACTLY unchanged;\
    \ seal/manifest/settle vs reject never both post.\n"
  precision: integer cents
- name: route_auto_suspension
  trigger: any change to a route's blocked_stop_count (stop -> BLOCKED or BLOCKED -> PENDING)
  algorithm: threshold
  formula: "When route.status == IN_PROGRESS and stop_count >= 1:\n  blocked_stop_count * 2 >= stop_count  ->  route -> SUSPENDED (automatic)\nThe comparison is a >= on the doubled count (a route with exactly\
    \ half its stops blocked suspends;\nstop_count is odd-safe: 1 blocked of 3 does NOT suspend, 2 blocked of 4 DOES).\nResume is never automatic: POST resume requires blocked_stop_count * 2 < stop_count.\n"
  input_set: stops of the route with status BLOCKED vs non-SKIPPED stops
validations:
- priority: 1
  category: auth
  check: X-User-Role and X-User-ID headers present; X-User-Role must be a declared role
  error_id: ERR_UNAUTHENTICATED
  http_status: 401
  applies_to: all
- priority: 2
  category: request
  check: Body parses; required fields present; types match; enum values valid; date strings ISO; window_end_date >= window_start_date; weight_lbs has at most 1 decimal place
  error_id: ERR_INVALID_REQUEST
  http_status: 400
  applies_to: all
- priority: 3
  category: auth
  check: Role is permitted on this endpoint per §1.5 roles list
  error_id: ERR_FORBIDDEN
  http_status: 403
  applies_to: all
- priority: 4
  category: existence
  check: Path ids validated left-to-right, then body FK ids in input order; each must exist
  error_id: ERR_{RESOURCE}_NOT_FOUND (ERR_PROGRAM_NOT_FOUND, ERR_DISTRICT_NOT_FOUND, ERR_POLE_NOT_FOUND, ERR_AUDIT_NOT_FOUND, ERR_CREW_NOT_FOUND, ERR_ROUTE_NOT_FOUND, ERR_STOP_NOT_FOUND, ERR_WORK_ORDER_NOT_FOUND,
    ERR_RATE_SCHEDULE_NOT_FOUND, ERR_ACCOUNT_NOT_FOUND, ERR_BILLING_LINE_NOT_FOUND, ERR_TICKET_NOT_FOUND, ERR_BATCH_NOT_FOUND, ERR_SALVAGE_ITEM_NOT_FOUND, ERR_REPORT_NOT_FOUND, ERR_EXCEPTION_NOT_FOUND)
  http_status: 404
  applies_to: all endpoints with path or body resource ids
- priority: 5
  category: auth
  check: 'Ownership identity: FieldSupervisor X-User-ID == crew_id of the target work order / assigned ticket crew; CitizenReporter X-User-ID == reporter_user_id on verify/reopen'
  error_id: ERR_FORBIDDEN
  http_status: 403
  applies_to: work-orders/{id}/dispatch|complete|fail; outage-tickets/{id}/resolve|verify|reopen
- priority: 6
  category: auth
  check: 'Segregation of duties: qc-pass/qc-fail X-User-ID != work order performed_by_user_id; attest/reject X-User-ID != report submitted_by_user_id'
  error_id: ERR_SEGREGATION_OF_DUTIES
  http_status: 403
  applies_to: work-orders/{id}/qc-pass|qc-fail; savings-reports/{id}/attest|reject
- priority: 7
  category: concurrency
  check: expected_pole_version == Pole.version (audit create); expected_program_version == ConversionProgram.version (report create)
  error_id: ERR_STALE_VERSION
  http_status: 412
  applies_to: POST /streetlights/poles/{poleId}/audits; POST /streetlights/savings-reports
- priority: 8
  category: state
  check: ConversionProgram must be ACTIVE for child mutations
  error_id: ERR_PROGRAM_NOT_ACTIVE
  http_status: 409
  applies_to: all POST/transition endpoints under districts, poles, audits, crews, routes, stops, work-orders, rate-schedules, tariff-accounts, billing context, outage-tickets, salvage, savings-reports,
    compliance-exceptions (program lifecycle endpoints themselves excluded)
- priority: 9
  category: state
  check: Target resource state permits the transition; when several apply, the TARGET resource's own state is checked before related-entity state (work order before route before stop at dispatch)
  error_id: ERR_AUDIT_NOT_SUBMITTED | ERR_ROUTE_NOT_PLANNED | ERR_ROUTE_SUSPENDED | ERR_ROUTE_TERMINAL | ERR_ROUTE_NOT_SUSPENDED | ERR_ROUTE_STILL_BLOCKED | ERR_STOP_NOT_PENDING | ERR_STOP_BLOCKED | ERR_WORK_ORDER_NOT_DISPATCHABLE
    | ERR_WORK_ORDER_NOT_COMPLETABLE | ERR_WORK_ORDER_NOT_CANCELLABLE | ERR_QC_NOT_AWAITING | ERR_ACCOUNT_NOT_OPEN | ERR_TICKET_NOT_OPEN | ERR_TICKET_NOT_TRIAGED | ERR_TICKET_NOT_DISPATCHED | ERR_TICKET_NOT_RESOLVED
    | ERR_BATCH_NOT_ACCUMULATING | ERR_BATCH_NOT_SEALED | ERR_BATCH_NOT_MANIFESTED | ERR_REPORT_NOT_DRAFT | ERR_REPORT_NOT_SUBMITTED | ERR_EXCEPTION_NOT_PENDING | ERR_RATE_SCHEDULE_NOT_DRAFT | ERR_RATE_SCHEDULE_NOT_FILED
    | ERR_RATE_SCHEDULE_NOT_EFFECTIVE | ERR_POLE_EXEMPT | ERR_ROUTES_STILL_ACTIVE | ERR_POLE_NOT_AUDIT_CLEARED
  http_status: 409
  applies_to: state transition endpoints
- priority: 10
  category: business_safety
  check: 'Dark-sky CCT: new_cct_kelvin <= district cct_cap_kelvin unless an APPROVED, unexpired CCT_WAIVER for this pole covers it'
  error_id: ERR_CCT_EXCEEDS_ZONE_CAP
  http_status: 422
  applies_to: POST /streetlights/work-orders/{id}/dispatch
- priority: 11
  category: business_safety
  check: 'Shielding: FULL_CUTOFF required when district full_cutoff_required (RESIDENTIAL, RURAL)'
  error_id: ERR_SHIELDING_REQUIRED
  http_status: 422
  applies_to: POST /streetlights/work-orders/{id}/dispatch
- priority: 12
  category: business_temporal
  check: Crew route windows (CLOSED intervals, both endpoints inclusive) must not share any calendar day with another non-CANCELLED route of the same crew; adjacency on the same day IS a conflict
  error_id: ERR_ROUTE_WINDOW_OVERLAP
  http_status: 409
  applies_to: POST /streetlights/conversion-routes
- priority: 13
  category: business_temporal
  check: Rate schedule windows (HALF-OPEN [from, until)) must not overlap a FILED/EFFECTIVE schedule of the same (program, ownership_class); adjacency (until == other's from) is allowed
  error_id: ERR_RATE_WINDOW_OVERLAP
  http_status: 409
  applies_to: POST /streetlights/rate-schedules/{id}/file
- priority: 14
  category: business_temporal
  check: Stops may only be added while route.window_start_date >= current date
  error_id: ERR_ROUTE_WINDOW_PAST
  http_status: 422
  applies_to: POST /streetlights/conversion-routes/{id}/stops
- priority: 15
  category: business_temporal
  check: ComplianceException valid_until must be >= current date at creation and at approval
  error_id: ERR_EXCEPTION_WINDOW_PAST
  http_status: 422
  applies_to: POST /streetlights/compliance-exceptions; POST /streetlights/compliance-exceptions/{id}/approve
- priority: 16
  category: business_temporal
  check: Ticket reopen allowed only within resolved_at + 72 hours
  error_id: ERR_REOPEN_WINDOW_EXPIRED
  http_status: 422
  applies_to: POST /streetlights/outage-tickets/{id}/reopen
- priority: 17
  category: business_constraint
  check: pole_number unique per program
  error_id: ERR_DUPLICATE_POLE_NUMBER
  http_status: 409
  applies_to: POST /streetlights/poles
- priority: 18
  category: business_constraint
  check: No second OPEN/FROZEN TariffAccount for the same (district_id, ownership_class)
  error_id: ERR_DUPLICATE_ACCOUNT
  http_status: 409
  applies_to: POST /streetlights/tariff-accounts
- priority: 19
  category: business_constraint
  check: sequence_number unique within the route
  error_id: ERR_DUPLICATE_SEQUENCE
  http_status: 409
  applies_to: POST /streetlights/conversion-routes/{id}/stops
- priority: 20
  category: business_constraint
  check: Pole may not hold a second PENDING stop while it already has a PENDING stop on any non-terminal route
  error_id: ERR_DUPLICATE_STOP
  http_status: 409
  applies_to: POST /streetlights/conversion-routes/{id}/stops
- priority: 21
  category: business_constraint
  check: route_capacity_check must pass for the candidate stop (shift-fit AND stop-rate)
  error_id: ERR_ROUTE_CAPACITY_EXCEEDED
  http_status: 422
  applies_to: POST /streetlights/conversion-routes/{id}/stops
- priority: 22
  category: business_constraint
  check: Route must contain >= 1 stop to release
  error_id: ERR_EMPTY_ROUTE
  http_status: 422
  applies_to: POST /streetlights/conversion-routes/{id}/release
- priority: 23
  category: business_constraint
  check: No other DISPATCHED work order exists for the same pole
  error_id: ERR_ACTIVE_WORK_ORDER_EXISTS
  http_status: 409
  applies_to: POST /streetlights/work-orders/{id}/dispatch
- priority: 24
  category: business_constraint
  check: 'Wattage reduction: new_fixture_wattage * 5 <= pole.effective_wattage * 4 (at least 20% reduction; exactly 80% allowed)'
  error_id: ERR_INSUFFICIENT_WATTAGE_REDUCTION
  http_status: 422
  applies_to: POST /streetlights/work-orders/{id}/dispatch
- priority: 25
  category: business_constraint
  check: Pole may hold at most one SUBMITTED audit
  error_id: ERR_AUDIT_ALREADY_PENDING
  http_status: 409
  applies_to: POST /streetlights/poles/{poleId}/audits
- priority: 26
  category: business_constraint
  check: SalvageBatch must contain >= 1 item to seal
  error_id: ERR_EMPTY_BATCH
  http_status: 422
  applies_to: POST /streetlights/salvage-batches/{id}/seal
- priority: 27
  category: business_constraint
  check: Every item in a SEALED batch must have weight_lbs > 0 before manifesting
  error_id: ERR_UNWEIGHED_ITEMS
  http_status: 422
  applies_to: POST /streetlights/salvage-batches/{id}/manifest
- priority: 28
  category: business_constraint
  check: No ATTESTED SavingsReport exists for the same (program_id, period) when creating a report
  error_id: ERR_REPORT_PERIOD_FINALIZED
  http_status: 409
  applies_to: POST /streetlights/savings-reports
- priority: 29
  category: business_constraint
  check: Every TariffAccount of the program has current_period > report.period and no ESTIMATED lines in report.period at submit
  error_id: ERR_REPORT_PERIOD_OPEN
  http_status: 409
  applies_to: POST /streetlights/savings-reports/{id}/submit
- priority: 30
  category: business_constraint
  check: An EFFECTIVE-or-SUPERSEDED rate schedule window covers the period start for every (account ownership_class) with eligible poles
  error_id: ERR_NO_EFFECTIVE_RATE_SCHEDULE
  http_status: 422
  applies_to: POST /streetlights/tariff-accounts/{id}/generate-lines
- priority: 31
  category: business_referential
  check: Stop pole must belong to the route's district
  error_id: ERR_CROSS_DISTRICT_STOP
  http_status: 422
  applies_to: POST /streetlights/conversion-routes/{id}/stops
- priority: 32
  category: business_referential
  check: Wattage audits are permitted only for MUNICIPAL poles
  error_id: ERR_AUDIT_NOT_PERMITTED_UTILITY
  http_status: 422
  applies_to: POST /streetlights/poles/{poleId}/audits
- priority: 33
  category: business_referential
  check: Nameplate attestation is permitted only for UTILITY_OWNED poles
  error_id: ERR_ATTEST_NOT_PERMITTED_MUNICIPAL
  http_status: 422
  applies_to: POST /streetlights/poles/{id}/attest-nameplate
- priority: 33.5
  category: business_constraint
  check: SalvageItem must currently be unbatched (batch_id null) to be added to a batch
  error_id: ERR_SALVAGE_ITEM_ALREADY_BATCHED
  http_status: 409
  applies_to: POST /streetlights/salvage-batches/{id}/items
- priority: 34
  category: business_fiscal
  check: estimated_labor_cost_cents <= program.budget_balance_cents at dispatch
  error_id: ERR_PROGRAM_BUDGET_EXCEEDED
  http_status: 402
  applies_to: POST /streetlights/work-orders/{id}/dispatch
endpoints:
- method: POST
  path: /streetlights/programs
  description: Create a ConversionProgram (status DRAFT; budget_balance := program_budget_cents)
  roles:
  - ProgramManager
  code: 201
  input:
  - program_name
  - program_budget_cents
  - fy_rebate_cap_cents
  - rebate_cents_per_kwh
  output: ConversionProgram
  side_effects:
  - computed rollups initialized to 0 / budget
- method: GET
