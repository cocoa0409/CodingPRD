  # ===========================================================================
  # Rule 4 — transitive_cascade (three distinct triggers; depths 3, 4, 3)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: recall_quarantine_cascade
        grounds:
          - state_machines.RecallCase.UNITS_IDENTIFIED_to_QUARANTINE_COMPLETE
          - state_machines.BloodUnit.RESERVED_to_QUARANTINED_HOLD
          - state_machines.Crossmatch.COMPATIBLE_to_CANCELLED
          - state_machines.TransfusionOrder.READY_to_AWAITING_CROSSMATCH
        distinguishing_aspect: |
          Trigger = execute-quarantine on a DONOR recall. Depth-3 chain: recall
          transition -> donor's units HELD (link 1) -> a held RESERVED unit's
          crossmatch CANCELLED (link 2, caused by the hold) -> the order reverts
          READY -> AWAITING_CROSSMATCH (link 3, caused by the cancellation).
        test_recipe:
          setup:
            - "clock 2026-08-10T09:00:00Z; donor D-900 has U1 AVAILABLE and U2 RESERVED (X2 COMPATIBLE on order O1, which is READY)"
            - "manual DONOR-scope recall for D-900 in UNITS_IDENTIFIED"
