            - "BuyerCommitment.${com}.fill_pct == 0.0000 and BuyerCommitment.${com}.risk_flag == ON_TRACK and BuyerCommitment.${com}.status == OPEN and BuyerCommitment.${com}.version == 2"

      - name: block_traceability_summary_aggregates_by_pick_date_and_hold_state
        claim_type: aggregation
        grounds:
          - calculations.block_traceability_summary
          - endpoints["GET /berry-ops/blocks/{block_id}/traceability-summary"]
        distinguishing_aspect: |
          The roll-up counts every lot of the block regardless of status:
          lot_count 3 and total_packed_lbs 150.00 still include the rejected
          40.00 lb lot, which is counted both once in held_lot_count
          and once in rejected_lot_count, while shipped_lbs stays 0.00 because
          no lot reached DELIVERED. pick_date_count is 2 with earliest
          2026-08-03 and latest 2026-08-04.
        test_recipe:
          setup:
            - "One block with one 40 MPN water sample (PROVISIONAL / CLEARED) and one window 2026-08-03T06:00:00Z -> 2026-08-04T18:00:00Z."
            - "Three lots at 1.00 lb per clamshell: 60 clamshells picked 2026-08-03, 40 clamshells picked 2026-08-03, 50 clamshells picked 2026-08-04. The 40-clamshell lot is then rejected."
          setup_api_calls:
            - call: "POST /berry-ops/blocks"
              payload: { name: "BLK-C13", variety: "STRAWBERRY", acres: 8.00, planting_year: 2021, irrigation_source_code: "WELL-C13" }
