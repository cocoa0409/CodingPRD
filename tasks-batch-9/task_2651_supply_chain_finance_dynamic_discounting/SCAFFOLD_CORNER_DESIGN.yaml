        claim_type: side_effect_execution
        grounds:
          - state_machines.Funder.ACTIVE_to_WITHDRAWN
          - state_machines.FunderCommitment.ACTIVE_to_EXPIRED
          - calculations.funder_available_capital
          - "endpoints[POST /funders/{id}/pause]"
        distinguishing_aspect: |
          Withdrawal is admissible only because encumbered_capital_cents is 0, and its cascade
          expires BOTH tranches in created_at ASC order - including the future-dated 2026-09 tranche
          that was not yet covering the clock date - driving available_capital_cents from 1000000 to 0.
        test_recipe:
          setup:
            - "One ACTIVE Funder with capital_limit 2000000 and two ACTIVE tranches: 1000000 over 2026-08-01..2026-08-31 and 500000 over 2026-09-01..2026-09-30"
            - "No EarlyPayment has ever named this funder, so encumbered_capital_cents is 0"
          setup_api_calls:
