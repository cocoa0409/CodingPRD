            - { call: "POST /consignment/offers", payload: { listing_id: "${listing_id}", buyer_id: "${buyer_a}", amount_cents: 160000, expected_listing_version: "${lv}" }, as: Buyer, as_user_id: "${buyer_a}" }
          trigger:
            - { call: "POST /consignment/offers", payload: { listing_id: "${listing_id}", buyer_id: "${buyer_b}", amount_cents: 170000, expected_listing_version: "${lv}" }, as: Buyer, as_user_id: "${buyer_b}", captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_STALE_LISTING_VERSION"
            - "http_status == 412"

  - section: consistency_model
    instances:
      - name: sale_totals_present_immediately_in_response
        claim_type: immediate
        grounds:
          - calculations.buyer_order_total
          - entities.Sale.fields.order_total_cents
        excluded_because:
          difficulty_instance: combinatorial_formula / buyer_order_total_pinned_rounding_order
          rationale: "That §1.8 instance asserts buyer_fee/tax/order_total are computed and present in the direct-buy response in the same request (immediate consistency)."
