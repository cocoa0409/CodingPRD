          assert:
            - "HTTP status is 409 and data.error_id == ERR_PROFILE_HAS_NO_IDENTIFIER"
            - "MonitoredProfile.${prof_id}.status == DRAFT and activated_at is null"
            - "Account.${acct_id}.profile_units_consumed == 0 and profile_units_remaining == 4"

      - name: second_profile_activation_rejected_by_profile_quota
