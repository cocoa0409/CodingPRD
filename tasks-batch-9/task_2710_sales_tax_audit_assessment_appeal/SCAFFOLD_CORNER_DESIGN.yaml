      - name: a_taxpayer_cannot_read_another_taxpayers_notice
        claim_type: Other role's exclusive operation denied
        grounds: ["endpoints.GET /assessments/{id}", errors.ERR_NOT_RESOURCE_OWNER, validations.priority_4]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / path_existence_priority_3_outranks_ownership_priority_4
          rationale: |
            §1.8 already drives the ownership rung with both faces on one fixture: a
            second taxpayer reading the first taxpayer's assessment gets 403
            ERR_NOT_RESOURCE_OWNER, and the same caller reading an id that does not
            exist gets 404 first, which is the only way to prove rule 4 runs after
            rule 3. Repeating the denial here would add no observable.

