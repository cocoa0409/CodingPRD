              as: BuyerRep
              as_user_id: "${buyer_id}"
              captures: { case_id: $.data.id }
            - call: "POST /arbitration/cases/${case_id}/evidence"
              payload: { evidence_type: "INSPECTION_REPORT", provider_name: "Statewide Vehicle Inspection", document_reference: "IR-77121", repair_estimate_cents: 285000 }
              as: BuyerRep
              as_user_id: "${buyer_id}"
            - call: "POST /arbitration/cases/${case_id}/evidence"
              payload: { evidence_type: "THIRD_PARTY_VERIFICATION", provider_name: "National Title History", document_reference: "TPV-4409", odometer_reading: 104000 }
              as: Inspector
