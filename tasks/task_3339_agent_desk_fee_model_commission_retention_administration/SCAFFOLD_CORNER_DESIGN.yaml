            - "the second write-off (90 days past due) returns 200 and Invoice.${inv_id}.status == WRITTEN_OFF"

      - name: complete_termination_before_notice_window_rejected
        claim_type: Violation → Error
        grounds:
          - errors.ERR_TERMINATION_WINDOW_OPEN
          - validations.priority_9_business_temporal
        distinguishing_aspect: "complete-termination at termination_requested_at + 13 days is rejected 409 ERR_TERMINATION_WINDOW_OPEN; at exactly +14 days it succeeds."
        test_recipe:
          setup: ["Alice terminated at 2026-09-10T00:00:00Z; clock advanced to 2026-09-23T00:00:00Z (13 days later)."]
          setup_api_calls:
