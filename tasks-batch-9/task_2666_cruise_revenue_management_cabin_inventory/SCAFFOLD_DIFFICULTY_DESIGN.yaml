            - "ItineraryChange.${itc_p}.obc_per_guest_cents == 5000 and refund_pct == 0.05"
            - "ItineraryChange.${itc_p}.affected_bookings_count == 1"
            - "ItineraryChange.${itc_p}.total_obc_granted_cents == 10000"
            - "ItineraryChange.${itc_p}.total_refund_granted_cents == 14500"
            - "Booking.${bk_c}.itinerary_compensation_obc_cents == 10000"
            - "Booking.${bk_c}.itinerary_refund_cents == 14500"
            - "Booking.${bk_c}.projected_onboard_gross_cents == 110000 and projected_onboard_net_cents == 100000"
            - "Booking.${bk_c}.balance_due_cents == 275500"
            - "Booking.${bk_c}.net_ticket_cents == 290000 (never rewritten by compensation)"
            - "Sailing.${sail_p}.projected_onboard_revenue_cents == 100000"
            - "Sailing.${sail_p}.compensation_liability_cents == 24500"
            - "Sailing.${sail_p}.ralbd_gross_cents == 18275 and ralbd_net_cents == 18275"
            - "Sailing.${sail_p}.revenue_alert == true (it was false at 20000 before the publish)"

