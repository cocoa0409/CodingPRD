  # =========================================================================
  # Section 6 — Errors
  # =========================================================================
  - section: errors
    instances:
      - name: extend_unknown_offer_id_returns_offer_not_found
        claim_type: violation_to_error
        grounds:
          - errors[ERR_OFFER_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "POST /offers/{unknown-uuid}/extend returns 404 ERR_OFFER_NOT_FOUND — path existence (priority 4) is checked before the ClientContact ownership rule (priority 6), which cannot even be evaluated without the offer."
        test_recipe:
          setup:
            - "One company exists so the ClientContact header has a real Company id; no offers exist."
          setup_api_calls:
            - call: "POST /companies"
              payload: { legal_name: "Acme Corp", industry: "Industrials" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /offers/00000000-0000-4000-8000-000000000000/extend"
              payload: {}
              as: ClientContact
              as_user_id: "${client_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err} == ERR_OFFER_NOT_FOUND"

      - name: create_engagement_with_unknown_fee_schedule_returns_not_found
        claim_type: violation_to_error
        grounds:
          - errors[ERR_FEE_SCHEDULE_NOT_FOUND]
          - validations[priority=5]
        distinguishing_aspect: "POST /engagements with a well-formed but unknown fee_schedule_id returns 404 ERR_FEE_SCHEDULE_NOT_FOUND (body-FK existence, priority 5) even though client_company_id resolves fine."
        test_recipe:
          setup:
            - "One Partner consultant and one client company; no fee schedules exist."
          setup_api_calls:
            - call: "POST /consultants"
              payload: { full_name: "Pat Partner", seniority: "PARTNER" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /companies"
              payload: { legal_name: "Acme Corp", industry: "Industrials" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /engagements"
              payload: { client_company_id: "${client_id}", fee_schedule_id: "00000000-0000-4000-8000-000000000000", fee_cap_cents: 20000000 }
              as: Partner
              as_user_id: "${p_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err} == ERR_FEE_SCHEDULE_NOT_FOUND"
            - "GET /engagements?client_company_id=${client_id} returns total_count == 0"

