      - name: pagination_limit_above_one_hundred_returns_invalid_pagination
        claim_type: Violation to Error
        grounds:
          - validations[priority=10]
          - errors[ERR_INVALID_PAGINATION]
          - response_envelope.pagination_defaults
        distinguishing_aspect: "limit 101 returns ERR_INVALID_PAGINATION (400) and offset -1 returns the same code, while limit 100 succeeds."
        test_recipe:
          setup:
            - "One CA judgment exists."
          setup_api_calls:
            - call: "POST /creditors"
              payload: { name: "Harbor Recovery LLC", contact_email: "ops@harbor.example" }
              as: CaseManager
              captures: { cred_id: $.data.id }
            - call: "POST /debtors"
              payload: { full_name: "Dana Reyes", state_code: "CA" }
              as: CaseManager
              captures: { dbt_id: $.data.id }
            - call: "POST /judgments"
              payload: { creditor_id: "${cred_id}", debtor_id: "${dbt_id}", court_case_number: "CV-2026-4015", state_code: "CA", original_principal_cents: 5000000, interest_rate_bps: 0, entered_on: "2026-01-01" }
              as: CaseManager
              captures: { jud_id: $.data.id }
          trigger:
            - call: "GET /judgments"
              payload: { limit: 101 }
              as: CaseManager
              captures: { err_limit: $.data.error_id }
            - call: "GET /judgments"
              payload: { offset: -1 }
              as: CaseManager
              captures: { err_offset: $.data.error_id }
            - call: "GET /judgments"
              payload: { limit: 100 }
              as: CaseManager
          assert:
            - "${err_limit} == ERR_INVALID_PAGINATION"
            - "${err_offset} == ERR_INVALID_PAGINATION"
            - "HTTP status == 400 on both failures"
            - "the third call returns HTTP 200 with total_count == 1"

      - name: setting_the_clock_backwards_returns_clock_regression
        claim_type: Violation to Error
        grounds:
          - validations[priority=11]
          - errors[ERR_CLOCK_REGRESSION]
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "After advancing the clock to 2026-09-01T00:00:00Z, setting it back to 2026-08-15T00:00:00Z returns ERR_CLOCK_REGRESSION (422) and the clock still reads 2026-09-01T00:00:00Z."
        test_recipe:
          setup:
            - "The logical clock has been advanced from its 2026-08-01T00:00:00Z default to 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CaseManager
              captures: { now1: $.data.current_utc }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: CaseManager
              captures: { err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CaseManager
              captures: { now2: $.data.current_utc }
          assert:
            - "${now1} == 2026-09-01T00:00:00.000Z"
            - "${err} == ERR_CLOCK_REGRESSION"
            - "HTTP status == 422"
            - "${now2} == 2026-09-01T00:00:00.000Z"

      - name: second_reinstatement_returns_reinstatement_limit
        claim_type: Violation to Error
        grounds:
