          assert:
            - "error_id == ERR_ORDER_NOT_ALLOCATABLE (captured ${err}) — state (p6) outranks fiscal (p10) although qty 5.000 > lot available 2.000 would also fail ERR_INSUFFICIENT_MATERIAL"
      - name: run_create_safety_beats_temporal_priority
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_GRADE_INCOMPATIBLE]
          - errors[ERR_STATION_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Category pair business_safety vs business_temporal: the new run's tool
          grade (INDUSTRIAL) is below the FOOD order's grade AND its window
          overlaps an existing SCHEDULED run on the same station. The safety
          error ERR_GRADE_INCOMPATIBLE (priority 7) must win over the temporal
          error ERR_STATION_WINDOW_OVERLAP (priority 8).
        test_recipe:
          setup:
            - "Station ST-S (MEDICAL) already occupied 10:00-11:00 by a SCHEDULED run of INDUSTRIAL order O-A on INDUSTRIAL tool T-A"
