        distinguishing_aspect: "An X-User-Role value that is not one of the five declared roles returns 401 ERR_UNAUTHENTICATED, distinct from the 403 ERR_UNAUTHORIZED given to a known-but-wrong role."
        test_recipe:
          setup:
