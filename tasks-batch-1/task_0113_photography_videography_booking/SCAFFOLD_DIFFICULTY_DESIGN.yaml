            - call: "POST /studio/shoot-schedules/${sch14}/complete"
              payload: {}
              as: Photographer
              as_user_id: "${p14}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_STATE"
            - "ShootSchedule.${sch14}.status == SCHEDULED"

  # ===================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: second_shooter_buffer_overlap_on_assignment
        # interval semantics: half-open [start,end) PLUS 60-min travel buffer; resource = SecondShooterAssignment
        grounds:
          - validations[priority=11]
          - state_machines.SecondShooterAssignment.ASSIGNED_to_RELEASED
          - calculations.second_shooter_fee
        distinguishing_aspect: |
          Assigning second10 to a window whose nearest edge is 30 minutes from his existing ASSIGNED
          window is rejected ERR_SHOOTER_DOUBLE_BOOKED because the 60-minute travel buffer is added on
          each side. Interval semantics: half-open + buffer (resource SecondShooterAssignment) — distinct
          from the no-buffer lead-photographer rule below.
        test_recipe:
          setup:
            - "second10 ASSIGNED to schedule X (14:00-18:00 on 2026-09-01). A second CONFIRMED booking has schedule Y starting 18:30 same day (30-min gap < 60-min buffer)."
          setup_api_calls:
            - call: "POST /studio/clients"
              payload: { email: "c15@x.com", full_name: "C Fifteen", phone: "1500" }
              as: StudioAdmin
              captures: { c15: $.data.id }
            - call: "POST /studio/photographers"
              payload: { email: "lead15a@x.com", full_name: "Lead 15A", skills: ["PHOTO"], hourly_rate_cents: 12000 }
              as: StudioAdmin
              captures: { lead15a: $.data.id }
            - call: "POST /studio/photographers"
              payload: { email: "lead15b@x.com", full_name: "Lead 15B", skills: ["PHOTO"], hourly_rate_cents: 12000 }
              as: StudioAdmin
              captures: { lead15b: $.data.id }
            - call: "POST /studio/photographers"
              payload: { email: "second15@x.com", full_name: "Second 15", skills: ["PHOTO"], hourly_rate_cents: 8000 }
              as: StudioAdmin
              captures: { second15: $.data.id }
            - call: "POST /studio/session-packages"
              payload: { name: "Wedding Std 15", session_type: "WEDDING", tier: "STANDARD", base_fee_cents: 200000, included_shoot_hours: 6, overage_hourly_rate_cents: 15000, included_edited_images: 100, deposit_pct: 0.30, requires_model_release: true, active: true }
              as: StudioAdmin
              captures: { pkg15: $.data.id }
            - call: "POST /studio/bookings"
              payload: { client_id: "${c15}", package_id: "${pkg15}", lead_photographer_id: "${lead15a}", requested_shoot_hours: 6 }
              as: Client
              as_user_id: "${c15}"
              captures: { bkX: $.data.id }
            - call: "POST /studio/contracts"
              payload: { booking_id: "${bkX}", includes_model_release: true }
              as: StudioAdmin
              captures: { ctX: $.data.id }
            - call: "POST /studio/contracts/${ctX}/send"
              payload: {}
              as: StudioAdmin
            - call: "POST /studio/contracts/${ctX}/sign"
              payload: {}
              as: Client
              as_user_id: "${c15}"
            - call: "POST /studio/shoot-schedules"
              payload: { booking_id: "${bkX}", start_utc: "2026-09-01T14:00:00Z", end_utc: "2026-09-01T18:00:00Z" }
              as: StudioAdmin
              captures: { schX: $.data.id, schX_v: $.data.version }
            - call: "POST /studio/bookings/${bkX}/confirm"
              payload: {}
              as: Client
              as_user_id: "${c15}"
            - call: "POST /studio/shoot-schedules/${schX}/second-shooter-assignments"
              payload: { photographer_id: "${second15}", expected_shoot_schedule_version: "${schX_v}" }
              as: StudioAdmin
              captures: { asgX: $.data.id }
            - call: "POST /studio/bookings"
              payload: { client_id: "${c15}", package_id: "${pkg15}", lead_photographer_id: "${lead15b}", requested_shoot_hours: 6 }
              as: Client
              as_user_id: "${c15}"
              captures: { bkY: $.data.id }
            - call: "POST /studio/contracts"
              payload: { booking_id: "${bkY}", includes_model_release: true }
              as: StudioAdmin
              captures: { ctY: $.data.id }
            - call: "POST /studio/contracts/${ctY}/send"
              payload: {}
              as: StudioAdmin
            - call: "POST /studio/contracts/${ctY}/sign"
              payload: {}
              as: Client
              as_user_id: "${c15}"
            - call: "POST /studio/shoot-schedules"
              payload: { booking_id: "${bkY}", start_utc: "2026-09-01T18:30:00Z", end_utc: "2026-09-01T20:00:00Z" }
              as: StudioAdmin
              captures: { schY: $.data.id, schY_v: $.data.version }
            - call: "POST /studio/bookings/${bkY}/confirm"
              payload: {}
              as: Client
              as_user_id: "${c15}"
          trigger:
            - call: "POST /studio/shoot-schedules/${schY}/second-shooter-assignments"
              payload: { photographer_id: "${second15}", expected_shoot_schedule_version: "${schY_v}" }
              as: StudioAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_SHOOTER_DOUBLE_BOOKED"

      - name: lead_photographer_no_buffer_overlap_on_schedule_create
        # interval semantics: plain half-open [start,end), NO buffer; resource = ShootSchedule
        grounds:
          - validations[priority=11]
          - entities.ShootSchedule.fields.start_utc
          - state_machines.ShootSchedule.SCHEDULED_to_RESCHEDULED
        distinguishing_aspect: |
          Creating a ShootSchedule for the SAME lead photographer that strictly overlaps an existing
          non-terminal window is rejected ERR_LEAD_PHOTOGRAPHER_BUSY, but ADJACENT windows (end==next
          start, zero gap) are allowed — no travel buffer. Interval semantics: plain half-open on the
          ShootSchedule resource, distinct from the buffered second-shooter rule.
        test_recipe:
          setup:
            - "lead16 has an existing SCHEDULED window 10:00-12:00 on 2026-09-05; a new booking for lead16 attempts an overlapping 11:00-13:00 window."
          setup_api_calls:
            - call: "POST /studio/clients"
              payload: { email: "c16@x.com", full_name: "C Sixteen", phone: "1600" }
              as: StudioAdmin
              captures: { c16: $.data.id }
            - call: "POST /studio/photographers"
              payload: { email: "lead16@x.com", full_name: "Lead 16", skills: ["PHOTO"], hourly_rate_cents: 9000 }
              as: StudioAdmin
              captures: { lead16: $.data.id }
            - call: "POST /studio/session-packages"
              payload: { name: "Portrait Basic 16", session_type: "PORTRAIT", tier: "BASIC", base_fee_cents: 100000, included_shoot_hours: 2, overage_hourly_rate_cents: 12000, included_edited_images: 30, deposit_pct: 0.30, requires_model_release: false, active: true }
              as: StudioAdmin
              captures: { pkg16: $.data.id }
            - call: "POST /studio/bookings"
              payload: { client_id: "${c16}", package_id: "${pkg16}", lead_photographer_id: "${lead16}", requested_shoot_hours: 2 }
              as: Client
              as_user_id: "${c16}"
              captures: { bk16a: $.data.id }
            - call: "POST /studio/shoot-schedules"
              payload: { booking_id: "${bk16a}", start_utc: "2026-09-05T10:00:00Z", end_utc: "2026-09-05T12:00:00Z" }
              as: StudioAdmin
              captures: { sch16a: $.data.id }
            - call: "POST /studio/bookings"
              payload: { client_id: "${c16}", package_id: "${pkg16}", lead_photographer_id: "${lead16}", requested_shoot_hours: 2 }
              as: Client
              as_user_id: "${c16}"
              captures: { bk16b: $.data.id }
          trigger:
            - call: "POST /studio/shoot-schedules"
              payload: { booking_id: "${bk16b}", start_utc: "2026-09-05T11:00:00Z", end_utc: "2026-09-05T13:00:00Z" }
              as: StudioAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_LEAD_PHOTOGRAPHER_BUSY"

  # ===================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cancel_refund_leaves_net_retained_equals_cancellation_fee
        # conserved quantity: net cash retained by the studio
        grounds:
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - state_machines.Booking.REFUND_PENDING_to_UNPAID
          - calculations.balance_due
          - calculations.cancellation_fee
        distinguishing_aspect: |
          Forward DEPOSIT capture (30000) + compensating REFUND (22500) leave net retained ==
          cancellation_fee_cents (7500): amount_paid_cents = captured(30000) - refunded(22500) = 7500,
          exactly the retained fee. Conserved quantity = net cash retained.
        test_recipe:
          setup:
            - "PORTRAIT BASIC booking CONFIRMED, deposit 30000 settled (DEPOSIT_PAID). Cancelled at lead>=14d -> cancellation_fee 7500, payment_status REFUND_PENDING. A REFUND payment of 22500 is created."
          setup_api_calls:
            - call: "POST /studio/clients"
              payload: { email: "c17@x.com", full_name: "C Seventeen", phone: "1700" }
              as: StudioAdmin
              captures: { c17: $.data.id }
            - call: "POST /studio/photographers"
              payload: { email: "p17@x.com", full_name: "P Seventeen", skills: ["PHOTO"], hourly_rate_cents: 7000 }
              as: StudioAdmin
              captures: { p17: $.data.id }
            - call: "POST /studio/session-packages"
              payload: { name: "Portrait Basic 17", session_type: "PORTRAIT", tier: "BASIC", base_fee_cents: 100000, included_shoot_hours: 2, overage_hourly_rate_cents: 12000, included_edited_images: 30, deposit_pct: 0.30, requires_model_release: false, active: true }
              as: StudioAdmin
              captures: { pkg17: $.data.id }
            - call: "POST /studio/bookings"
              payload: { client_id: "${c17}", package_id: "${pkg17}", lead_photographer_id: "${p17}", requested_shoot_hours: 2 }
              as: Client
              as_user_id: "${c17}"
              captures: { bk17: $.data.id }
            - call: "POST /studio/contracts"
              payload: { booking_id: "${bk17}" }
              as: StudioAdmin
              captures: { ct17: $.data.id }
            - call: "POST /studio/contracts/${ct17}/send"
              payload: {}
              as: StudioAdmin
            - call: "POST /studio/contracts/${ct17}/sign"
              payload: {}
              as: Client
              as_user_id: "${c17}"
            - call: "POST /studio/shoot-schedules"
              payload: { booking_id: "${bk17}", start_utc: "2026-08-20T10:00:00Z", end_utc: "2026-08-20T12:00:00Z" }
              as: StudioAdmin
              captures: { sch17: $.data.id }
            - call: "POST /studio/bookings/${bk17}/confirm"
              payload: {}
              as: Client
              as_user_id: "${c17}"
            - call: "POST /studio/payments"
              payload: { booking_id: "${bk17}", kind: "DEPOSIT", amount_cents: 30000 }
              as: StudioAdmin
              captures: { pay17d: $.data.id }
            - call: "POST /studio/payments/${pay17d}/settle"
              payload: {}
              as: StudioAdmin
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T10:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/bookings/${bk17}/cancel"
              payload: {}
              as: Client
              as_user_id: "${c17}"
            - call: "POST /studio/payments"
              payload: { booking_id: "${bk17}", kind: "REFUND", amount_cents: 22500 }
              as: StudioAdmin
              captures: { pay17r: $.data.id }
          trigger:
            - call: "POST /studio/payments/${pay17r}/settle"
              payload: {}
              as: StudioAdmin
          assert:
            - "Booking.${bk17}.amount_paid_cents == 7500"
            - "Booking.${bk17}.cancellation_fee_cents == 7500"
            - "Booking.${bk17}.payment_status == UNPAID"

      - name: addon_order_then_cancel_restores_booking_total
        # conserved quantity: Booking.total_fee_cents (booking total)
        grounds:
          - state_machines.AddOnOrder.ORDERED_to_CANCELLED
          - calculations.addon_line_total
          - calculations.booking_total_fee
          - concurrency_rules[addon-order-stale-booking]
        distinguishing_aspect: |
          Ordering a PRINT add-on (line_total 27000) raises Booking.total_fee_cents 100000 -> 127000;
          cancelling that exact order restores it to 100000. Conserved quantity = Booking.total_fee_cents,
          a different conserved quantity from net cash retained above.
        test_recipe:
          setup:
            - "DRAFT booking on PORTRAIT BASIC (total 100000), booking.version observed; one PRINT add-on (60@500 -> 27000) ordered -> total 127000."
          setup_api_calls:
            - call: "POST /studio/clients"
              payload: { email: "c18@x.com", full_name: "C Eighteen", phone: "1800" }
              as: StudioAdmin
              captures: { c18: $.data.id }
            - call: "POST /studio/photographers"
              payload: { email: "p18@x.com", full_name: "P Eighteen", skills: ["PHOTO"], hourly_rate_cents: 7000 }
              as: StudioAdmin
              captures: { p18: $.data.id }
            - call: "POST /studio/session-packages"
              payload: { name: "Portrait Basic 18", session_type: "PORTRAIT", tier: "BASIC", base_fee_cents: 100000, included_shoot_hours: 2, overage_hourly_rate_cents: 12000, included_edited_images: 30, deposit_pct: 0.30, requires_model_release: false, active: true }
              as: StudioAdmin
              captures: { pkg18: $.data.id }
            - call: "POST /studio/bookings"
              payload: { client_id: "${c18}", package_id: "${pkg18}", lead_photographer_id: "${p18}", requested_shoot_hours: 2 }
              as: Client
              as_user_id: "${c18}"
              captures: { bk18: $.data.id, bk18_v0: $.data.version }
            - call: "POST /studio/bookings/${bk18}/add-on-orders"
              payload: { line_kind: "PRINT", quantity: 60, unit_price_cents: 500, expected_booking_version: "${bk18_v0}" }
              as: Client
              as_user_id: "${c18}"
              captures: { ao18: $.data.id }
            - call: "GET /studio/bookings/${bk18}"
              payload: {}
              as: Client
              as_user_id: "${c18}"
              captures: { bk18_v1: $.data.version }
          trigger:
            - call: "POST /studio/add-on-orders/${ao18}/cancel"
              payload: { expected_booking_version: "${bk18_v1}" }
              as: Client
              as_user_id: "${c18}"
          assert:
            - "AddOnOrder.${ao18}.status == CANCELLED"
            - "Booking.${bk18}.total_fee_cents == 100000"
