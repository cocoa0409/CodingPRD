  # ===========================================================================
  # Section: cross_cutting_layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: corner_occ_plan_create_stale
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[plan-create-stale-space]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Plan creation is OCC-guarded on ConfinedSpace.version: after plan1's create bumps the version, a second create carrying the pre-create version is rejected with ERR_STALE_VERSION (412), and plan1 remains DRAFT (not superseded by a failed write)."
        test_recipe:
          setup: ["Space at version 1 (freshly created)"]
          setup_api_calls:
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T06:00:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Lead One", role_qualifications: ["RESCUE_LEAD"] }, as: OperationsManager, captures: { rtl_id: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts", payload: { name: "OCC Co", billing_mode: "HOURLY_STANDBY", hourly_standby_rate_cents: 20000, event_base_fee_cents: 150000, event_per_rescuer_cents: 25000, credit_limit_cents: 100000000 }, as: OperationsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts/${acct}/confined-spaces", payload: { space_code: "TK-OC1", classification: "PERMIT_REQUIRED", requires_continuous_monitoring: false, max_entrants: 2, ventilation_required: false, blind_flange_required: false, exposure_standard: "TWA8" }, as: OperationsManager, captures: { sp: "$.data.id", sp_v: "$.data.version" } }
          trigger:
            - { call: "POST /rescue-ops/confined-spaces/${sp}/rescue-plans", payload: { required_team_size: 1, required_certifications: ["CONFINED_SPACE_RESCUE"], retrieval_system_type: "TRIPOD", expected_space_version: "${sp_v}" }, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { plan1: "$.data.id" } }
            - { call: "POST /rescue-ops/confined-spaces/${sp}/rescue-plans", payload: { required_team_size: 2, required_certifications: ["CONFINED_SPACE_RESCUE"], retrieval_system_type: "TRIPOD", expected_space_version: "${sp_v}" }, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "First create succeeds (expected == current version 1)"
            - "Second create with the SAME captured version fails with ERR_STALE_VERSION (412): the first create advanced ConfinedSpace.version to 2"
            - "RescuePlan.${plan1}.status == DRAFT (the failed create superseded nothing)"

      - name: corner_occ_plan_approve_stale
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[plan-approve-stale-space]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Approval is supersede-on-approve guarded by the space version: after creating plan2 (which bumps the version), approving plan2 with the version captured before plan2's create fails with 412; retrying with the fresh version succeeds and supersedes nothing (plan1 already SUPERSEDED by creation)."
        test_recipe:
          setup: ["Space with plan1 DRAFT; version captured before plan2 creation"]
          setup_api_calls:
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T06:00:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Lead One", role_qualifications: ["RESCUE_LEAD"] }, as: OperationsManager, captures: { rtl_id: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts", payload: { name: "OCC2 Co", billing_mode: "HOURLY_STANDBY", hourly_standby_rate_cents: 20000, event_base_fee_cents: 150000, event_per_rescuer_cents: 25000, credit_limit_cents: 100000000 }, as: OperationsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts/${acct}/confined-spaces", payload: { space_code: "TK-OC2", classification: "PERMIT_REQUIRED", requires_continuous_monitoring: false, max_entrants: 2, ventilation_required: false, blind_flange_required: false, exposure_standard: "TWA8" }, as: OperationsManager, captures: { sp: "$.data.id", sp_v: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${sp}/rescue-plans", payload: { required_team_size: 1, required_certifications: ["CONFINED_SPACE_RESCUE"], retrieval_system_type: "TRIPOD", expected_space_version: "${sp_v}" }, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { plan1: "$.data.id" } }
            - { call: "GET /rescue-ops/confined-spaces/${sp}", as: OperationsManager, captures: { sp_v2: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${sp}/rescue-plans", payload: { required_team_size: 2, required_certifications: ["CONFINED_SPACE_RESCUE", "HIGH_ANGLE"], retrieval_system_type: "MECHANICAL_RETRIEVAL", expected_space_version: "${sp_v2}" }, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { plan2: "$.data.id" } }
          trigger:
            - { call: "POST /rescue-ops/rescue-plans/${plan2}/approve", payload: { expected_space_version: "${sp_v2}" }, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { err: "$.data.error_id" } }
            - { call: "GET /rescue-ops/confined-spaces/${sp}", as: OperationsManager, captures: { sp_v3: "$.data.version" } }
            - { call: "POST /rescue-ops/rescue-plans/${plan2}/approve", payload: { expected_space_version: "${sp_v3}" }, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { plan2_status: "$.data.status" } }
          assert:
            - "Approve with the stale version (captured before plan2's create bumped the space) fails with ERR_STALE_VERSION (412)"
            - "Retry with the fresh version succeeds: RescuePlan.${plan2}.status == APPROVED"
            - "RescuePlan.${plan1}.status == SUPERSEDED (by creation, before any approval)"

      - name: corner_occ_permit_create_stale
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[permit-create-stale-space]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Permit creation supersedes DRAFT permits and bumps the space version: a second create with the stale version is rejected with 412, leaving the first permit DRAFT (not auto-cancelled by a rejected request)."
        test_recipe:
          setup: ["Space at version 1"]
          setup_api_calls:
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T06:00:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Sup One", role_qualifications: ["ENTRY_SUPERVISOR"] }, as: OperationsManager, captures: { sup_id: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts", payload: { name: "OCC3 Co", billing_mode: "HOURLY_STANDBY", hourly_standby_rate_cents: 20000, event_base_fee_cents: 150000, event_per_rescuer_cents: 25000, credit_limit_cents: 100000000 }, as: OperationsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts/${acct}/confined-spaces", payload: { space_code: "TK-OC3", classification: "PERMIT_REQUIRED", requires_continuous_monitoring: false, max_entrants: 2, ventilation_required: false, blind_flange_required: false, exposure_standard: "TWA8" }, as: OperationsManager, captures: { sp: "$.data.id", sp_v: "$.data.version" } }
          trigger:
            - { call: "POST /rescue-ops/confined-spaces/${sp}/entry-permits", payload: { purpose: "First", planned_start_at: "2026-08-03T06:00:00Z", planned_end_at: "2026-08-03T20:00:00Z", expected_space_version: "${sp_v}" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { per_a: "$.data.id" } }
            - { call: "POST /rescue-ops/confined-spaces/${sp}/entry-permits", payload: { purpose: "Second", planned_start_at: "2026-08-03T06:00:00Z", planned_end_at: "2026-08-03T20:00:00Z", expected_space_version: "${sp_v}" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "First create succeeds"
            - "Second create with the stale version fails with ERR_STALE_VERSION (412)"
            - "EntryPermit.${per_a}.status == DRAFT (a rejected supersede attempt must not cancel it)"

      - name: corner_occ_space_patch_stale_then_success
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[space-update-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PATCH on the space itself is OCC-guarded: the first patch with the captured version succeeds and increments version; replaying the same patch with the same (now stale) version fails with 412. version increments by exactly 1 per successful mutation."
        test_recipe:
          setup: ["Space at version 1 (version captured at creation)"]
          setup_api_calls:
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T06:00:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/client-accounts", payload: { name: "OCC4 Co", billing_mode: "HOURLY_STANDBY", hourly_standby_rate_cents: 20000, event_base_fee_cents: 150000, event_per_rescuer_cents: 25000, credit_limit_cents: 100000000 }, as: OperationsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts/${acct}/confined-spaces", payload: { space_code: "TK-OC4", classification: "PERMIT_REQUIRED", requires_continuous_monitoring: false, max_entrants: 2, ventilation_required: false, blind_flange_required: false, exposure_standard: "TWA8" }, as: OperationsManager, captures: { sp: "$.data.id", sp_v: "$.data.version" } }
          trigger:
            - { call: "PATCH /rescue-ops/confined-spaces/${sp}", payload: { max_entrants: 3, expected_space_version: "${sp_v}" }, as: OperationsManager, captures: { v_after: "$.data.version" } }
            - { call: "PATCH /rescue-ops/confined-spaces/${sp}", payload: { max_entrants: 4, expected_space_version: "${sp_v}" }, as: OperationsManager, captures: { err: "$.data.error_id" } }
          assert:
            - "First PATCH succeeds: max_entrants == 3 and version == ${sp_v} + 1"
            - "Second PATCH replaying the stale version fails with ERR_STALE_VERSION (412); max_entrants stays 3"

