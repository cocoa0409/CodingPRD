              payload: { name: "AE-2", target_class_size: 10, ed_deadline_iso: "2030-11-01T00:00:00Z", ea_deadline_iso: "2030-11-15T00:00:00Z", rd_deadline_iso: "2031-01-01T00:00:00Z", rolling_open: false, requires_css_profile: false, cooldown_ms: 86400000 }
