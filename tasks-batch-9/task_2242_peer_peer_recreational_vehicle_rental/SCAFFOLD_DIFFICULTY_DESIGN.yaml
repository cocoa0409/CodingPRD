  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    scaffold_basis: >-
      §1.4 is a single totally ordered list of 39 rules spanning three HTTP status
      families (409 state, 422 business, 402 funds). POST
      /rv-marketplace/bookings alone is subject to priorities 14, 16, 17, 18, 19,
      20, 21, 22, 24, 26, 34 and 35, so a request can violate two rules whose
      relative order changes both the error_id AND the status code.
    instances:

      - name: suspended_listing_409_outranks_underage_renter_422
        grounds: >-
          §1.4 priority 14 ERR_LISTING_NOT_BOOKABLE (409) versus priority 16
          ERR_RENTER_AGE_BELOW_MINIMUM (422), both applying to POST
          /rv-marketplace/bookings.
        distinguishing_aspect: >-
          This pair straddles the 409/422 boundary, so getting the order wrong
          changes the status class and not merely the code. One request violates
          both: the renter was born 2005-01-15 (21 years old at the 2026-08-29
          start, against min_renter_age 25) AND the listing has been suspended.
          The correct answer is 409 ERR_LISTING_NOT_BOOKABLE. The control proves
          the age rule is live: after reinstating the listing the identical body
          returns 422 ERR_RENTER_AGE_BELOW_MINIMUM.
        test_recipe:
          setup: >-
            Canonical marketplace and LISTED listing, plus a second renter born
            2005-01-15, then the listing is suspended by the platform.
          setup_api_calls:
            - *c_clock
            - *c_owner
            - *c_renter
            - *c_season_peak
            - *c_season_shoulder
            - *c_season_off
            - *c_plan_std
            - *c_policy_mod
            - *c_qual_dr
            - *c_qual_tow
            - *c_listing
            - *c_doc_title
            - *c_doc_reg
            - *c_doc_ins
            - *c_insp_front
            - *c_insp_rear
            - *c_insp_interior
            - *c_insp_roof
            - *c_insp_under
            - *c_verify_title
            - *c_verify_reg
            - *c_verify_ins
            - *c_submit
            - *c_list_approve
            - *c_fund
            - &c_renter_young
              call: "POST /rv-marketplace/renters"
              payload: { display_name: "Cody Young", email: "cody@rvshare.test", date_of_birth: "2005-01-15", license_state_code: "OR" }
              as: PlatformAdmin
              captures: { young_renter_id: "$.data.id" }
            - &c_list_suspend
              call: "POST /rv-marketplace/listings/${listing_id}/suspend"
              payload: { suspend_reason: "roof seal recall pending" }
              as: PlatformAdmin
          trigger:
            - &c_booking_young
              call: "POST /rv-marketplace/bookings"
              payload:
                listing_id: "${listing_id}"
                renter_id: "${young_renter_id}"
                protection_plan_id: "${plan_id}"
                cancellation_policy_id: "${policy_id}"
                start_date: "2026-08-29"
                end_date: "2026-09-02"
                delivery_option: "PICKUP"
                declared_miles: 380
                declared_generator_hours: 11.0
              as: Renter
              as_user_id: "${young_renter_id}"
              captures: { error_id: "$.data.error_id" }
            - &c_list_reinstate
              call: "POST /rv-marketplace/listings/${listing_id}/reinstate"
              as: PlatformAdmin
            - *c_booking_young
          assert:
            - "trigger step 1 (suspended listing + underage renter): response 409 and data.error_id == 'ERR_LISTING_NOT_BOOKABLE'"
            - "trigger step 2 (reinstate): response 200 and data.listing_status == 'LISTED'"
            - "trigger step 3 (identical body, listing now LISTED): response 422 and data.error_id == 'ERR_RENTER_AGE_BELOW_MINIMUM'"
            - "no Booking row was created by either attempt: GET /rv-marketplace/bookings?renter_id=${young_renter_id} returns total_count == 0"

      - name: rolling_driving_points_422_outranks_missing_towing_verification_422
        grounds: >-
          §1.4 priority 18 ERR_DRIVING_RECORD_POINTS_EXCEEDED versus priority 19
          ERR_TOWING_EXPERIENCE_MISSING, plus §1.3
          renter_driving_record_points variant ROLLING_36M with MAX_RECORD_POINTS
          = 6.
        distinguishing_aspect: >-
          Unlike the previous instance, both rules here return 422, so only the
          error_id can distinguish them — an implementation that evaluates the
          cheap towing lookup before the aggregate points sum returns a
          plausible-looking 422 with the wrong id. The offending renter has four
          in-window MINOR checks worth 2 points each (8 > 6) and no towing check
          at all, so both rules are violated; priority 18 wins. The control
          renter has only three such checks (exactly 6, which priority 18 admits
          because the bound is <=) and also no towing check, and therefore fails
          on priority 19 instead.
        test_recipe:
          setup: >-
            Canonical marketplace and LISTED TRAVEL_TRAILER listing (requires
            towing, gvwr 8500 so the ADVANCED-tier rule at priority 20 is not in
            play), plus renter D with four 2-point MINOR driving records and no
            towing check, and renter E with three 2-point MINOR driving records
            and no towing check.
