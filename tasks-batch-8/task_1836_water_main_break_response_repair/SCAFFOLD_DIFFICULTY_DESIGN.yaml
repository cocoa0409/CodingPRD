            - call: "POST /isolation-events"
              payload: { break_report_id: "${brA}", valve_ids: ["${v1}"], expected_break_report_version: "${brA_v}" }
              as: Dispatcher
              captures: { isoA: $.data.id }
            - call: "POST /isolation-events/${isoA}/execute"
              as: Dispatcher
            - call: "POST /work-orders"
              payload: { break_report_id: "${brA}", est_pipe_length_ft: 4 }
              as: Dispatcher
