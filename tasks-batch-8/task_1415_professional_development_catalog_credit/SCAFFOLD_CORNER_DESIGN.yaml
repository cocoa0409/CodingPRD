    distinguishing_aspect: 'Immediate consistency: PATCH seat_capacity 2 -> 3 synchronously promotes the waitlisted registration; the PATCH RESPONSE itself shows seats_registered == 3 (no lag, no ops-run
      needed).'
    test_recipe:
      setup:
      - S1 capacity 2 fee 0 PUBLISHED; T1, T2 REGISTERED; T3 WAITLISTED seq 1
      setup_api_calls:
      - call: POST /pd/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: PDCoordinator
      - call: POST /pd/buildings
        payload:
          name: IM Bldg
          building_code: IM1
        as: PDCoordinator
        captures:
          b1: $.data.id
      - call: POST /pd/employees
        payload:
          full_name: T IM
          email: tim@x.com
          employee_kind: TEACHER
          primary_building_id: ${b1}
          base_lane: BA
        as: PDCoordinator
        captures:
          t1: $.data.id
      - call: POST /pd/employees
        payload:
          full_name: T IN
          email: tin@x.com
          employee_kind: TEACHER
          primary_building_id: ${b1}
          base_lane: BA
        as: PDCoordinator
        captures:
          t2: $.data.id
      - call: POST /pd/employees
        payload:
          full_name: T IO
          email: tio@x.com
          employee_kind: TEACHER
          primary_building_id: ${b1}
          base_lane: BA
        as: PDCoordinator
        captures:
          t3: $.data.id
      - call: POST /pd/employees
        payload:
          full_name: I IM
          email: iim@x.com
          employee_kind: SPECIALIST
          primary_building_id: ${b1}
          base_lane: MA
        as: PDCoordinator
        captures:
          ins1: $.data.id
      - call: POST /pd/courses
        payload:
          course_code: IM-1
          title: Immediate Course
          delivery_mode: VIRTUAL
          clock_hours: 5
          fee_cents: 0
        as: PDCoordinator
        captures:
          c1: $.data.id
      - call: POST /pd/sections
        payload:
          course_id: ${c1}
          term: 2026-FALL
          instructor_id: ${ins1}
          building_id: ${b1}
          room: R1
          seat_capacity: 2
          starts_at: '2026-08-15T09:00:00Z'
          ends_at: '2026-08-20T17:00:00Z'
          registration_opens_at: '2026-08-01T00:00:00Z'
          registration_closes_at: '2026-08-10T00:00:00Z'
        as: PDCoordinator
        captures:
          s1: $.data.id
      - call: POST /pd/sections/${s1}/meetings
        payload:
          starts_at: '2026-08-15T10:00:00Z'
          ends_at: '2026-08-15T12:00:00Z'
          room: R1
        as: PDCoordinator
      - call: POST /pd/sections/${s1}/publish
        payload: {}
        as: PDCoordinator
      - call: POST /pd/registrations
        payload:
          teacher_id: ${t1}
          section_id: ${s1}
        as: Teacher
        as_user_id: ${t1}
      - call: POST /pd/registrations
        payload:
          teacher_id: ${t2}
          section_id: ${s1}
        as: Teacher
        as_user_id: ${t2}
      - call: POST /pd/registrations
        payload:
          teacher_id: ${t3}
          section_id: ${s1}
        as: Teacher
        as_user_id: ${t3}
        captures:
          r3: $.data.id
          r3_st: $.data.status
      trigger:
      - call: PATCH /pd/sections/${s1}
        payload:
          seat_capacity: 3
        as: PDCoordinator
        captures:
          cap: $.data.seat_capacity
          reg_n: $.data.seats_registered
          open_n: $.data.seats_open
      - call: GET /pd/registrations/${r3}
        payload: {}
        as: PDCoordinator
        captures:
          r3_st2: $.data.status
      assert:
      - 'Pre-patch: R3 was WAITLISTED'
      - PATCH response itself reports seat_capacity == 3, seats_registered == 3, seats_open == 0 (promotion applied in the same request)
      - R3 status == REGISTERED on immediate re-read
- section: errors
  instances:
