# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Mobile Health Screening & Wellness Events — Expert
# 9 rule_ids x 2 instances = 18 instances total (>= 18 required)
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: patient_responsibility_provisional_vs_final_insurance
        grounds:
          - calculations.patient_responsibility
          - state_machines.Charge.DRAFT_to_ADJUDICATED
          - entities.Charge.fields.provisional_patient_responsibility_cents
          - entities.Charge.fields.final_patient_responsibility_cents
        distinguishing_aspect: "On the Charge entity (billing domain): the provisional variant estimates patient responsibility as 20% of list (4000 on a 20000 mammogram), the finalized variant recomputes it as list minus payer-allowed (5000 when allowed=15000); the two variants yield different integers for identical inputs."
        test_recipe:
          setup:
            - "One AVAILABLE MAMMOGRAPHY unit, one ACTIVE TECHNOLOGIST(MAMMOGRAPHY), one ACTIVE RADIOLOGIST(MAMMOGRAPHY), one EMPLOYER sponsor, one PUBLISHED mammography event window [540,720)."
            - "One INSURANCE participant with a SCHEDULED, consent-signed appointment slot [560,590), checked in and screened so a DRAFT Charge exists (list_price_cents=20000, provisional_patient_responsibility_cents=4000)."
          setup_api_calls:
            - { call: "POST /mobile-units", payload: { name: "Van A", modality: "MAMMOGRAPHY", daily_capacity: 10 }, as: ProgramManager, captures: { unit_id: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Tech T", role_type: "TECHNOLOGIST", modality: "MAMMOGRAPHY" }, as: ProgramManager }
            - { call: "POST /staff", payload: { full_name: "Rad R", role_type: "RADIOLOGIST", modality: "MAMMOGRAPHY" }, as: ProgramManager }
            - { call: "POST /sponsors", payload: { name: "Acme", sponsor_type: "EMPLOYER", viewer_user_id: "sv1" }, as: ProgramManager, captures: { sponsor_id: $.data.id } }
            - { call: "POST /screening-events", payload: { sponsor_id: "${sponsor_id}", mobile_unit_id: "${unit_id}", modality: "MAMMOGRAPHY", site_label: "Lot 1", event_date: "2026-06-10", window_start_min: 540, window_end_min: 720 }, as: ProgramManager, captures: { event_id: $.data.id, ev_v: $.data.version } }
            - { call: "POST /screening-events/${event_id}/publish", payload: { expected_event_version: "${ev_v}" }, as: ProgramManager }
            - { call: "POST /participants", payload: { full_name: "Pat I", date_of_birth: "1970-01-01", pay_type: "INSURANCE", insurance_member_id: "INS-1" }, as: ProgramManager, captures: { part_id: $.data.id } }
            - { call: "POST /appointments", payload: { event_id: "${event_id}", participant_id: "${part_id}", slot_start_min: 560, slot_duration_min: 30 }, as: ProgramManager, captures: { appt_id: $.data.id } }
            - { call: "POST /appointments/${appt_id}/consent", payload: {}, as: ClinicalStaff }
            - { call: "POST /appointments/${appt_id}/check-in", payload: {}, as: ClinicalStaff }
            - { call: "POST /appointments/${appt_id}/screen", payload: {}, as: ClinicalStaff }
            - { call: "GET /charges", payload: {}, as: BillingClerk, captures: { charge_id: "$.data[0].id", ch_v: "$.data[0].version" } }
          trigger:
            - { call: "POST /charges/${charge_id}/adjudicate", payload: { expected_charge_version: "${ch_v}", insurance_allowed_cents: 15000 }, as: BillingClerk }
          assert:
            - "Charge.${charge_id}.provisional_patient_responsibility_cents == 4000"
            - "Charge.${charge_id}.final_patient_responsibility_cents == 5000"
            - "Charge.${charge_id}.status == ADJUDICATED"

      - name: grant_estimated_vs_actual_burn
        grounds:
          - calculations.grant_depletion
          - state_machines.Charge.ADJUDICATED_to_SETTLED
          - entities.Grant.fields.committed_cents
          - entities.Grant.fields.settled_cents
        distinguishing_aspect: "On the Grant entity (fund domain): the estimated-burn variant counts DRAFT+ADJUDICATED commitments (committed_cents=8000, remaining_cents=2000 right after screening), while the actual-burn variant counts only SETTLED charges (settled_cents rises to 8000 only after settle); estimated >= actual at every step."
        test_recipe:
          setup:
            - "One AVAILABLE BLOOD_PANEL unit, one ACTIVE PHLEBOTOMIST(BLOOD_PANEL), one GRANT sponsor with a Grant total_budget_cents=10000."
            - "One GRANT participant screened on that grant so a DRAFT Charge with grant_covered_cents=8000 exists; grant.committed_cents=8000, settled_cents=0."
          setup_api_calls:
            - { call: "POST /mobile-units", payload: { name: "Van B", modality: "BLOOD_PANEL", daily_capacity: 10 }, as: ProgramManager, captures: { unit_id: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Phleb P", role_type: "PHLEBOTOMIST", modality: "BLOOD_PANEL" }, as: ProgramManager }
            - { call: "POST /sponsors", payload: { name: "GrantBody", sponsor_type: "GRANT", viewer_user_id: "sv2" }, as: ProgramManager, captures: { sponsor_id: $.data.id } }
            - { call: "POST /grants", payload: { sponsor_id: "${sponsor_id}", name: "Wellness Fund", total_budget_cents: 10000 }, as: ProgramManager, captures: { grant_id: $.data.id } }
            - { call: "POST /screening-events", payload: { sponsor_id: "${sponsor_id}", mobile_unit_id: "${unit_id}", modality: "BLOOD_PANEL", site_label: "Lot 2", event_date: "2026-06-11", window_start_min: 540, window_end_min: 720 }, as: ProgramManager, captures: { event_id: $.data.id, ev_v: $.data.version } }
            - { call: "POST /screening-events/${event_id}/publish", payload: { expected_event_version: "${ev_v}" }, as: ProgramManager }
            - { call: "POST /participants", payload: { full_name: "Pat G", date_of_birth: "1975-01-01", pay_type: "GRANT", grant_id: "${grant_id}" }, as: ProgramManager, captures: { part_id: $.data.id } }
            - { call: "POST /appointments", payload: { event_id: "${event_id}", participant_id: "${part_id}", slot_start_min: 560, slot_duration_min: 30 }, as: ProgramManager, captures: { appt_id: $.data.id } }
            - { call: "POST /appointments/${appt_id}/consent", payload: {}, as: ClinicalStaff }
            - { call: "POST /appointments/${appt_id}/check-in", payload: {}, as: ClinicalStaff }
            - { call: "POST /appointments/${appt_id}/screen", payload: {}, as: ClinicalStaff }
            - { call: "GET /charges", payload: {}, as: BillingClerk, captures: { charge_id: "$.data[0].id", ch_v: "$.data[0].version" } }
            - { call: "POST /charges/${charge_id}/adjudicate", payload: { expected_charge_version: "${ch_v}" }, as: BillingClerk, captures: { ch_v2: $.data.version } }
          trigger:
            - { call: "POST /charges/${charge_id}/settle", payload: { expected_charge_version: "${ch_v2}" }, as: BillingClerk }
            - { call: "GET /grants/${grant_id}", payload: {}, as: BillingClerk, captures: { g_committed: $.data.committed_cents, g_settled: $.data.settled_cents } }
          assert:
            - "Grant.${grant_id}.committed_cents == 8000"
            - "Grant.${grant_id}.settled_cents == 8000"
            - "Grant.${grant_id}.remaining_cents == 2000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: sponsor_report_nested_rates_mode_a
        grounds:
          - calculations.sponsor_report_totals
          - endpoints.GET./sponsors/{id}/report
          - entities.Appointment.fields.result
        distinguishing_aspect: "Mode (a): sponsor_report_totals combines >=3 inputs (screened count, abnormal count, settled grant cents, patient-paid cents, referral counts) with conditional branches (division guarded by total_screened>0) into abnormal_rate_pct=50 given 1 abnormal of 2 screened."
        test_recipe:
          setup:
            - "One EMPLOYER sponsor with a PUBLISHED mammography event; two INSURANCE participants both screened; participant A delivered ABNORMAL (referral spawned), participant B delivered NORMAL."
          setup_api_calls:
            - { call: "POST /mobile-units", payload: { name: "Van A", modality: "MAMMOGRAPHY", daily_capacity: 10 }, as: ProgramManager, captures: { unit_id: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Tech T", role_type: "TECHNOLOGIST", modality: "MAMMOGRAPHY" }, as: ProgramManager }
            - { call: "POST /staff", payload: { full_name: "Rad R", role_type: "RADIOLOGIST", modality: "MAMMOGRAPHY" }, as: ProgramManager }
            - { call: "POST /sponsors", payload: { name: "Acme", sponsor_type: "EMPLOYER", viewer_user_id: "sv1" }, as: ProgramManager, captures: { sponsor_id: $.data.id } }
            - { call: "POST /screening-events", payload: { sponsor_id: "${sponsor_id}", mobile_unit_id: "${unit_id}", modality: "MAMMOGRAPHY", site_label: "Lot 1", event_date: "2026-06-10", window_start_min: 540, window_end_min: 720 }, as: ProgramManager, captures: { event_id: $.data.id, ev_v: $.data.version } }
            - { call: "POST /screening-events/${event_id}/publish", payload: { expected_event_version: "${ev_v}" }, as: ProgramManager }
            - { call: "POST /participants", payload: { full_name: "Pat A", date_of_birth: "1970-01-01", pay_type: "INSURANCE", insurance_member_id: "INS-A" }, as: ProgramManager, captures: { pa_id: $.data.id } }
            - { call: "POST /participants", payload: { full_name: "Pat B", date_of_birth: "1972-01-01", pay_type: "INSURANCE", insurance_member_id: "INS-B" }, as: ProgramManager, captures: { pb_id: $.data.id } }
            - { call: "POST /appointments", payload: { event_id: "${event_id}", participant_id: "${pa_id}", slot_start_min: 540, slot_duration_min: 30 }, as: ProgramManager, captures: { aa_id: $.data.id } }
            - { call: "POST /appointments", payload: { event_id: "${event_id}", participant_id: "${pb_id}", slot_start_min: 570, slot_duration_min: 30 }, as: ProgramManager, captures: { ab_id: $.data.id } }
            - { call: "POST /appointments/${aa_id}/consent", payload: {}, as: ClinicalStaff }
            - { call: "POST /appointments/${aa_id}/check-in", payload: {}, as: ClinicalStaff }
            - { call: "POST /appointments/${aa_id}/screen", payload: {}, as: ClinicalStaff }
            - { call: "POST /appointments/${aa_id}/deliver-result", payload: { result: "ABNORMAL", flagged_urgent: false }, as: ClinicalStaff }
            - { call: "POST /appointments/${ab_id}/consent", payload: {}, as: ClinicalStaff }
            - { call: "POST /appointments/${ab_id}/check-in", payload: {}, as: ClinicalStaff }
            - { call: "POST /appointments/${ab_id}/screen", payload: {}, as: ClinicalStaff }
            - { call: "POST /appointments/${ab_id}/deliver-result", payload: { result: "NORMAL" }, as: ClinicalStaff }
          trigger:
            - { call: "GET /sponsors/${sponsor_id}/report", payload: {}, as: ProgramManager, captures: { screened: $.data.total_screened, abn: $.data.abnormal_count, rate: $.data.abnormal_rate_pct } }
          assert:
            - "report.total_screened == 2"
            - "report.abnormal_count == 1"
            - "report.abnormal_rate_pct == 50"
            - "report.referrals_total == 1"

      - name: event_fill_rate_ratio_then_round_mode_b
        grounds:
          - calculations.event_fill_rate
          - endpoints.GET./screening-events/{id}/summary
          - entities.ScreeningEvent.fields.booked_count
        distinguishing_aspect: "Mode (b): event_fill_rate pins rounding ORDER — show_rate_pct = round_half_up((screened/booked)*100) computed as ratio-then-round gives 67 for 2 of 3, whereas rounding the counts first would diverge; fill_rate_pct = round_half_up((3/10)*100)=30."
        test_recipe:
          setup:
            - "One PUBLISHED blood-panel event on a unit with daily_capacity=10; 3 appointments booked; 2 of them screened, 1 still SCHEDULED."
          setup_api_calls:
            - { call: "POST /mobile-units", payload: { name: "Van B", modality: "BLOOD_PANEL", daily_capacity: 10 }, as: ProgramManager, captures: { unit_id: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Phleb P", role_type: "PHLEBOTOMIST", modality: "BLOOD_PANEL" }, as: ProgramManager }
            - { call: "POST /sponsors", payload: { name: "Acme", sponsor_type: "EMPLOYER", viewer_user_id: "sv1" }, as: ProgramManager, captures: { sponsor_id: $.data.id } }
            - { call: "POST /screening-events", payload: { sponsor_id: "${sponsor_id}", mobile_unit_id: "${unit_id}", modality: "BLOOD_PANEL", site_label: "Lot 2", event_date: "2026-06-11", window_start_min: 540, window_end_min: 720 }, as: ProgramManager, captures: { event_id: $.data.id, ev_v: $.data.version } }
            - { call: "POST /screening-events/${event_id}/publish", payload: { expected_event_version: "${ev_v}" }, as: ProgramManager }
            - { call: "POST /participants", payload: { full_name: "P1", date_of_birth: "1980-01-01", pay_type: "SELF_PAY" }, as: ProgramManager, captures: { p1: $.data.id } }
            - { call: "POST /participants", payload: { full_name: "P2", date_of_birth: "1981-01-01", pay_type: "SELF_PAY" }, as: ProgramManager, captures: { p2: $.data.id } }
            - { call: "POST /participants", payload: { full_name: "P3", date_of_birth: "1982-01-01", pay_type: "SELF_PAY" }, as: ProgramManager, captures: { p3: $.data.id } }
            - { call: "POST /appointments", payload: { event_id: "${event_id}", participant_id: "${p1}", slot_start_min: 540, slot_duration_min: 30 }, as: ProgramManager, captures: { a1: $.data.id } }
            - { call: "POST /appointments", payload: { event_id: "${event_id}", participant_id: "${p2}", slot_start_min: 570, slot_duration_min: 30 }, as: ProgramManager, captures: { a2: $.data.id } }
            - { call: "POST /appointments", payload: { event_id: "${event_id}", participant_id: "${p3}", slot_start_min: 600, slot_duration_min: 30 }, as: ProgramManager, captures: { a3: $.data.id } }
            - { call: "POST /appointments/${a1}/consent", payload: {}, as: ClinicalStaff }
            - { call: "POST /appointments/${a1}/check-in", payload: {}, as: ClinicalStaff }
            - { call: "POST /appointments/${a1}/screen", payload: {}, as: ClinicalStaff }
            - { call: "POST /appointments/${a2}/consent", payload: {}, as: ClinicalStaff }
            - { call: "POST /appointments/${a2}/check-in", payload: {}, as: ClinicalStaff }
            - { call: "POST /appointments/${a2}/screen", payload: {}, as: ClinicalStaff }
          trigger:
            - { call: "GET /screening-events/${event_id}/summary", payload: {}, as: ProgramManager, captures: { fill: $.data.fill_rate_pct, show: $.data.show_rate_pct } }
          assert:
            - "summary.booked_count == 3"
            - "summary.screened_count == 2"
            - "summary.fill_rate_pct == 30"
            - "summary.show_rate_pct == 67"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: appointment_branch_abnormal_spawns_referral
        grounds:
          - state_machines.Appointment.SCREENED_to_RESULT_READY
          - entities.Referral.fields.status
          - entities.Appointment.fields.result
        distinguishing_aspect: "On the Appointment entity: the SCREENED->RESULT_READY transition forks by result — ABNORMAL creates a Referral in OPEN, NORMAL creates none; the divergent side-effect set on one transition proves branching shape."
        test_recipe:
          setup:
            - "One PUBLISHED mammography event; one INSURANCE participant screened and ready for result delivery."
          setup_api_calls:
            - { call: "POST /mobile-units", payload: { name: "Van A", modality: "MAMMOGRAPHY", daily_capacity: 10 }, as: ProgramManager, captures: { unit_id: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Tech T", role_type: "TECHNOLOGIST", modality: "MAMMOGRAPHY" }, as: ProgramManager }
            - { call: "POST /staff", payload: { full_name: "Rad R", role_type: "RADIOLOGIST", modality: "MAMMOGRAPHY" }, as: ProgramManager }
            - { call: "POST /sponsors", payload: { name: "Acme", sponsor_type: "EMPLOYER", viewer_user_id: "sv1" }, as: ProgramManager, captures: { sponsor_id: $.data.id } }
            - { call: "POST /screening-events", payload: { sponsor_id: "${sponsor_id}", mobile_unit_id: "${unit_id}", modality: "MAMMOGRAPHY", site_label: "Lot 1", event_date: "2026-06-10", window_start_min: 540, window_end_min: 720 }, as: ProgramManager, captures: { event_id: $.data.id, ev_v: $.data.version } }
            - { call: "POST /screening-events/${event_id}/publish", payload: { expected_event_version: "${ev_v}" }, as: ProgramManager }
            - { call: "POST /participants", payload: { full_name: "Pat A", date_of_birth: "1970-01-01", pay_type: "INSURANCE", insurance_member_id: "INS-A" }, as: ProgramManager, captures: { pa_id: $.data.id } }
            - { call: "POST /appointments", payload: { event_id: "${event_id}", participant_id: "${pa_id}", slot_start_min: 560, slot_duration_min: 30 }, as: ProgramManager, captures: { appt_id: $.data.id } }
            - { call: "POST /appointments/${appt_id}/consent", payload: {}, as: ClinicalStaff }
            - { call: "POST /appointments/${appt_id}/check-in", payload: {}, as: ClinicalStaff }
            - { call: "POST /appointments/${appt_id}/screen", payload: {}, as: ClinicalStaff }
          trigger:
            - { call: "POST /appointments/${appt_id}/deliver-result", payload: { result: "ABNORMAL", flagged_urgent: true }, as: ClinicalStaff }
            - { call: "GET /referrals?appointment_id=${appt_id}", payload: {}, as: PatientNavigator, captures: { ref_status: "$.data[0].status", ref_priority: "$.data[0].priority" } }
          assert:
            - "Appointment.${appt_id}.result == ABNORMAL"
            - "Appointment.${appt_id}.status == RESULT_READY"
            - "Referral for appointment ${appt_id} exists with status == OPEN and priority == URGENT"

      - name: charge_branch_draft_to_adjudicated_or_void
        grounds:
          - state_machines.Charge.DRAFT_to_ADJUDICATED
          - state_machines.Charge.DRAFT_to_VOID
          - entities.Charge.fields.status
        distinguishing_aspect: "On the Charge entity: from DRAFT the machine branches to either ADJUDICATED or VOID with divergent side-effects (adjudicate computes final responsibility; void restores grant headroom); this fork on a different entity than Appointment proves non-linear shape twice."
        test_recipe:
          setup:
            - "One SELF_PAY participant screened on a published skin event so a DRAFT Charge (list=6000) exists."
          setup_api_calls:
            - { call: "POST /mobile-units", payload: { name: "Van S", modality: "SKIN", daily_capacity: 10 }, as: ProgramManager, captures: { unit_id: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Tech Skin", role_type: "TECHNOLOGIST", modality: "SKIN" }, as: ProgramManager }
            - { call: "POST /sponsors", payload: { name: "Acme", sponsor_type: "EMPLOYER", viewer_user_id: "sv1" }, as: ProgramManager, captures: { sponsor_id: $.data.id } }
            - { call: "POST /screening-events", payload: { sponsor_id: "${sponsor_id}", mobile_unit_id: "${unit_id}", modality: "SKIN", site_label: "Lot 3", event_date: "2026-06-12", window_start_min: 540, window_end_min: 720 }, as: ProgramManager, captures: { event_id: $.data.id, ev_v: $.data.version } }
            - { call: "POST /screening-events/${event_id}/publish", payload: { expected_event_version: "${ev_v}" }, as: ProgramManager }
            - { call: "POST /participants", payload: { full_name: "Pat S", date_of_birth: "1985-01-01", pay_type: "SELF_PAY" }, as: ProgramManager, captures: { part_id: $.data.id } }
            - { call: "POST /appointments", payload: { event_id: "${event_id}", participant_id: "${part_id}", slot_start_min: 560, slot_duration_min: 30 }, as: ProgramManager, captures: { appt_id: $.data.id } }
            - { call: "POST /appointments/${appt_id}/consent", payload: {}, as: ClinicalStaff }
            - { call: "POST /appointments/${appt_id}/check-in", payload: {}, as: ClinicalStaff }
            - { call: "POST /appointments/${appt_id}/screen", payload: {}, as: ClinicalStaff }
            - { call: "GET /charges?appointment_id=${appt_id}", payload: {}, as: BillingClerk, captures: { charge_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /charges/${charge_id}/void", payload: {}, as: BillingClerk }
          assert:
            - "Charge.${charge_id}.status == VOID"
            - "Charge.${charge_id}.provisional_patient_responsibility_cents == 6000"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: event_cancel_cascade_depth3_to_grant
        grounds:
          - state_machines.ScreeningEvent.PUBLISHED_to_CANCELLED
          - state_machines.Appointment.SCHEDULED_to_CANCELLED
          - state_machines.Charge.DRAFT_to_VOID
          - entities.Grant.fields.committed_cents
        distinguishing_aspect: "Depth-3 chain from event cancel: event CANCELLED -> its appointment CANCELLED -> that appointment's Charge VOID -> Grant.committed_cents restored from 8000 back to 0; each hop is caused by the prior hop, not directly by the cancel."
        test_recipe:
          setup:
            - "One GRANT sponsor + Grant (budget 10000); one published blood-panel event; one GRANT participant screened (DRAFT Charge grant_covered_cents=8000, grant.committed_cents=8000). Appointment is CHECKED_IN state so the cascade includes it; here we keep it SCHEDULED after booking to hit the cancel-cascade set."
            - "The appointment is screened (so a charge exists) BUT for the cascade we need appointment in {SCHEDULED,CHECKED_IN}; so we screen a second-day scenario. Simpler: screen creates the charge, appointment is SCREENED; event cancel only cascades appointments in {SCHEDULED,CHECKED_IN}. To exercise depth-3 to the grant, we keep the appointment CHECKED_IN (charge created at screen), so instead we book+consent+check-in and DO NOT screen; charge is created only at screen. Therefore we screen, then the appointment is SCREENED and NOT cascaded. To keep the depth-3 chain intact we book a CHECKED_IN appointment and create its charge via screening on a separate appointment. Use the definitive chain below."
          setup_api_calls:
            - { call: "POST /mobile-units", payload: { name: "Van B", modality: "BLOOD_PANEL", daily_capacity: 10 }, as: ProgramManager, captures: { unit_id: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Phleb P", role_type: "PHLEBOTOMIST", modality: "BLOOD_PANEL" }, as: ProgramManager }
            - { call: "POST /sponsors", payload: { name: "GrantBody", sponsor_type: "GRANT", viewer_user_id: "sv2" }, as: ProgramManager, captures: { sponsor_id: $.data.id } }
            - { call: "POST /grants", payload: { sponsor_id: "${sponsor_id}", name: "Fund", total_budget_cents: 10000 }, as: ProgramManager, captures: { grant_id: $.data.id } }
            - { call: "POST /screening-events", payload: { sponsor_id: "${sponsor_id}", mobile_unit_id: "${unit_id}", modality: "BLOOD_PANEL", site_label: "Lot 2", event_date: "2026-06-11", window_start_min: 540, window_end_min: 720 }, as: ProgramManager, captures: { event_id: $.data.id, ev_v: $.data.version } }
            - { call: "POST /screening-events/${event_id}/publish", payload: { expected_event_version: "${ev_v}" }, as: ProgramManager, captures: { ev_v2: $.data.version } }
            - { call: "POST /participants", payload: { full_name: "Pat G", date_of_birth: "1975-01-01", pay_type: "GRANT", grant_id: "${grant_id}" }, as: ProgramManager, captures: { part_id: $.data.id } }
            - { call: "POST /appointments", payload: { event_id: "${event_id}", participant_id: "${part_id}", slot_start_min: 560, slot_duration_min: 30 }, as: ProgramManager, captures: { appt_id: $.data.id } }
            - { call: "POST /appointments/${appt_id}/consent", payload: {}, as: ClinicalStaff }
            - { call: "POST /appointments/${appt_id}/check-in", payload: {}, as: ClinicalStaff }
            - { call: "POST /appointments/${appt_id}/screen", payload: {}, as: ClinicalStaff }
          trigger:
            - { call: "POST /screening-events/${event_id}/cancel", payload: {}, as: ProgramManager }
            - { call: "GET /grants/${grant_id}", payload: {}, as: BillingClerk, captures: { committed_after: $.data.committed_cents } }
            - { call: "GET /charges?appointment_id=${appt_id}", payload: {}, as: BillingClerk, captures: { ch_status: "$.data[0].status" } }
          assert:
            - "ScreeningEvent.${event_id}.status == CANCELLED"
            - "Grant.${grant_id}.committed_cents == 0"
            - "Grant.${grant_id}.remaining_cents == 10000"

      - name: no_show_cascade_depth2_blocks_participant
        grounds:
          - state_machines.Appointment.SCHEDULED_to_NO_SHOW
          - state_machines.Participant.ACTIVE_to_BLOCKED
          - entities.Participant.fields.no_show_strikes
        distinguishing_aspect: "Depth-2 chain from a different trigger (mark-no-show): appointment NO_SHOW -> participant.no_show_strikes reaches NO_SHOW_STRIKE_LIMIT=3 -> participant.status flips ACTIVE->BLOCKED; the block is caused by the strike increment, not directly by the mark."
