      - name: corner_refund_exceeds_captured
        claim_type: Violation → Error
        grounds: ["validations[priority=65]", "errors[ERR_REFUND_EXCEEDS_CAPTURED]", state_machines.Charge.CAPTURED_to_REFUNDED]
        distinguishing_aspect: "Refunding 9000 against a CAPTURED 8700 charge returns ERR_REFUND_EXCEEDS_CAPTURED."
