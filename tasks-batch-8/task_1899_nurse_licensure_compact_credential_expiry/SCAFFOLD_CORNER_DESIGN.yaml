        claim_type: violation_to_error
        grounds:
          - "response_envelope"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "Every error body follows the fixed envelope: meta.api_request_id + meta.api_request_timestamp, response_type 'error', data.error_id + data.message."
        test_recipe:
          setup: ["Empty database, clock default."]
          setup_api_calls: []
          trigger:
            - { call: "GET /credentialing/units/11111111-2222-4333-8444-555555555555", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 404; response_type == 'error'; data.error_id == 'ERR_NOT_FOUND'; data.message non-empty; meta.api_request_id present"

      - name: duplicate_email_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=7]"
          - "errors[ERR_DUPLICATE_RESOURCE]"
        distinguishing_aspect: "Nurse email uniqueness: a second nurse with the same email fails 409 ERR_DUPLICATE_RESOURCE."
        test_recipe:
          setup: ["Clock 2026-08-01; one nurse with email dup@x.com."]
          setup_api_calls:
