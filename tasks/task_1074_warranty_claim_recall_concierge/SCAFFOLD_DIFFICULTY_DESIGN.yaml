          - entities.Subscription.fields.period_start
          - entities.Subscription.fields.period_end
          - errors[ERR_SUBSCRIPTION_PERIOD_OVERLAP]
        distinguishing_aspect: "Subscription periods are HALF-OPEN [start,end): a new subscription starting exactly at an existing one's period_end (2026-01-01) is accepted (touching != overlap), while one whose interval overlaps is rejected with ERR_SUBSCRIPTION_PERIOD_OVERLAP."
        test_recipe:
          setup:
            - "A household with subscription sub1 covering [2025-01-01, 2026-01-01)."
          setup_api_calls:
            - call: "POST /households"
              payload: { primary_email: "h15@x.test", display_name: "H15" }
              as: Anonymous
              captures: { hh: $.data.id }
            - call: "POST /households/${hh}/members"
              payload: { full_name: "Owner 15", email: "o15@x.test", role: "OWNER" }
              as: Anonymous
              captures: { owner: $.data.id }
            - call: "POST /households/${hh}/subscriptions"
              payload: { tier: "BASIC", period_start: "2025-01-01T00:00:00Z", period_end: "2026-01-01T00:00:00Z" }
              as: HouseholdOwner
              as_user_id: "${owner}"
              captures: { sub1: $.data.id }
          trigger:
            - call: "POST /households/${hh}/subscriptions"
              payload: { tier: "PLUS", period_start: "2026-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z" }
              as: HouseholdOwner
              as_user_id: "${owner}"
              captures: { sub2: $.data.id }
            - call: "POST /households/${hh}/subscriptions"
              payload: { tier: "PREMIUM", period_start: "2025-06-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z" }
              as: HouseholdOwner
              as_user_id: "${owner}"
              captures: { err: $.data.error_id }
          assert:
            - "sub2 (period_start == sub1.period_end) is created with status ACTIVE (touching endpoints do not overlap)"
            - "the third create returns HTTP 409 with error_id == ERR_SUBSCRIPTION_PERIOD_OVERLAP"

      - name: recall_window_closed_touching_endpoints_overlap
        grounds:
          - validations[priority=10]
          - entities.RecallNotice.fields.effective_from
          - entities.RecallNotice.fields.effective_to
          - errors[ERR_RECALL_WINDOW_OVERLAP]
        distinguishing_aspect: "Recall windows are CLOSED [from,to] on the (manufacturer, model) resource: a second recall whose effective_from equals the first's effective_to is REJECTED with ERR_RECALL_WINDOW_OVERLAP (touching endpoints DO overlap) — the opposite adjacency semantics from Subscription's half-open periods."
        test_recipe:
          setup:
            - "A manufacturer with a PUBLISHED HIGH recall for model M9 over [2025-01-01, 2025-06-01]; a second DRAFT recall for the same manufacturer+model M9 over [2025-06-01, 2025-12-01] (effective_from == first's effective_to)."
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { name: "Winco", contact_email: "w@winco.test" }
              as: PlatformAdmin
              captures: { mfr: $.data.id }
            - call: "POST /recall-notices"
              payload: { manufacturer_id: "${mfr}", affected_model_number: "M9", serial_range_start: 1, serial_range_end: 100, severity: "HIGH", remedy_type: "REPAIR", effective_from: "2025-01-01T00:00:00Z", effective_to: "2025-06-01T00:00:00Z" }
              as: ManufacturerAgent
              as_user_id: "${mfr}"
              captures: { rn1: $.data.id }
            - call: "POST /recall-notices/${rn1}/publish"
              payload: {}
              as: ManufacturerAgent
              as_user_id: "${mfr}"
            - call: "POST /recall-notices"
              payload: { manufacturer_id: "${mfr}", affected_model_number: "M9", serial_range_start: 1, serial_range_end: 100, severity: "HIGH", remedy_type: "REPAIR", effective_from: "2025-06-01T00:00:00Z", effective_to: "2025-12-01T00:00:00Z" }
              as: ManufacturerAgent
              as_user_id: "${mfr}"
              captures: { rn2: $.data.id }
          trigger:
            - call: "POST /recall-notices/${rn2}/publish"
              payload: {}
              as: ManufacturerAgent
              as_user_id: "${mfr}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger publish returns HTTP 409 with error_id == ERR_RECALL_WINDOW_OVERLAP"
            - "RecallNotice.${rn2}.status == DRAFT"

  # =================================================================
  # Rule 9 — compensating-action invariants across different conserved quantities
  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: claims_used_conserved_by_submit_then_withdraw
        grounds:
          - state_machines.Claim.DRAFT_to_SUBMITTED
          - state_machines.Claim.SUBMITTED_to_WITHDRAWN
          - calculations.claims_used_ledger
        distinguishing_aspect: "Conserved quantity claims_used (integer allowance count): SUBMIT increments it to 1 and the compensating WITHDRAW decrements it back to 0, leaving claims_used == COUNT(consumed-set claims) == 0 with no drift."
        test_recipe:
          setup:
            - "A BASIC household with an ACTIVE subscription and a REGISTERED product; a REFUND claim with one document, submitted (claims_used=1)."
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { name: "Cons", contact_email: "c@cons.test" }
              as: PlatformAdmin
              captures: { mfr: $.data.id }
            - call: "POST /households"
              payload: { primary_email: "h16@x.test", display_name: "H16" }
              as: Anonymous
              captures: { hh: $.data.id }
            - call: "POST /households/${hh}/members"
              payload: { full_name: "Owner 16", email: "o16@x.test", role: "OWNER" }
              as: Anonymous
              captures: { owner: $.data.id }
            - call: "POST /households/${hh}/subscriptions"
              payload: { tier: "BASIC", period_start: "2025-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z" }
              as: HouseholdOwner
              as_user_id: "${owner}"
              captures: { sub: $.data.id }
            - call: "POST /products"
              payload: { household_id: "${hh}", manufacturer_id: "${mfr}", model_number: "CN-1", serial_number: 1, purchase_date: "2025-01-01T00:00:00Z", purchase_price_cents: 10000, warranty_months: 24 }
              as: HouseholdOwner
              as_user_id: "${owner}"
              captures: { prod: $.data.id }
            - call: "POST /claims"
              payload: { product_id: "${prod}", filed_by_member_id: "${owner}", claim_type: "WARRANTY", resolution_preference: "REFUND", issue_description: "compensate" }
              as: HouseholdOwner
              as_user_id: "${owner}"
              captures: { claim: $.data.id }
            - call: "POST /claims/${claim}/documents"
              payload: { doc_type: "RECEIPT", file_uri: "s3://r/16" }
              as: HouseholdOwner
              as_user_id: "${owner}"
            - call: "POST /claims/${claim}/submit"
              payload: {}
              as: HouseholdOwner
              as_user_id: "${owner}"
          trigger:
            - call: "POST /claims/${claim}/withdraw"
              payload: {}
              as: HouseholdOwner
              as_user_id: "${owner}"
          assert:
            - "Claim.${claim}.status == WITHDRAWN"
            - "Subscription.${sub}.claims_used == 0"

      - name: exposure_score_conserved_by_publish_then_remedy
        grounds:
          - state_machines.RecallNotice.DRAFT_to_PUBLISHED
          - state_machines.RecallMatch.ACKNOWLEDGED_to_REMEDIED
          - calculations.recall_exposure_score
        distinguishing_aspect: "Conserved quantity recall_exposure_score (weighted risk sum): publish adds the CRITICAL weight (5) and the compensating remedy removes it, leaving recall_exposure_score == sum of severity_weight over open matches == 0 — a different conserved quantity than the integer claims_used count."
        test_recipe:
          setup:
            - "A WEIGHTED household with a REGISTERED product; a PUBLISHED CRITICAL recall matching it (exposure 5); the match acknowledged (ACKNOWLEDGED, still open)."
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { name: "Risk", contact_email: "r@risk.test" }
              as: PlatformAdmin
              captures: { mfr: $.data.id }
            - call: "POST /households"
              payload: { primary_email: "h17@x.test", display_name: "H17", exposure_scoring_mode: "WEIGHTED" }
              as: Anonymous
              captures: { hh: $.data.id }
            - call: "POST /households/${hh}/members"
              payload: { full_name: "Owner 17", email: "o17@x.test", role: "OWNER" }
              as: Anonymous
              captures: { owner: $.data.id }
            - call: "POST /products"
              payload: { household_id: "${hh}", manufacturer_id: "${mfr}", model_number: "RK-9", serial_number: 9, purchase_date: "2025-01-01T00:00:00Z", purchase_price_cents: 50000, warranty_months: 12 }
              as: HouseholdOwner
              as_user_id: "${owner}"
              captures: { prod: $.data.id }
            - call: "POST /recall-notices"
              payload: { manufacturer_id: "${mfr}", affected_model_number: "RK-9", serial_range_start: 1, serial_range_end: 100, severity: "CRITICAL", remedy_type: "REPLACE", effective_from: "2025-06-01T00:00:00Z", effective_to: "2026-06-01T00:00:00Z" }
              as: ManufacturerAgent
              as_user_id: "${mfr}"
              captures: { rn: $.data.id }
            - call: "POST /recall-notices/${rn}/publish"
              payload: {}
              as: ManufacturerAgent
              as_user_id: "${mfr}"
            - call: "GET /recall-matches"
              payload: { product_id: "${prod}" }
              as: PlatformAdmin
              captures: { m: "$.data[0].id" }
            - call: "POST /recall-matches/${m}/acknowledge"
              payload: {}
              as: HouseholdOwner
              as_user_id: "${owner}"
          trigger:
            - call: "POST /recall-matches/${m}/remedy"
              payload: {}
              as: ConciergeAgent
              as_user_id: "cx-remedy"
          assert:
            - "RecallMatch.${m}.status == REMEDIED"
            - "Product.${prod}.recall_status == REMEDIED"
            - "Household.${hh}.recall_exposure_score == 0"
