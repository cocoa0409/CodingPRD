scenario: |
  Generate task harder than expert level!

  2639. Repertory Cinema Programming & Rights Clearance (art house cinema): programming calendar
  balancing first-run art films, repertory series and special events with audience development goals,
  distributor booking with terms, minimum run commitments and house nut negotiations, repertory title
  rights clearance with licensing fees, print or digital source availability and format compatibility,
  membership program with discount tickets, advance access and donor benefits, special event production
  including filmmaker Q and A sessions, festivals and themed series, print traffic, digital cinema
  package delivery and key management with playback testing, box office reporting and settlement with
  distributors, single-screen scheduling optimization across show times

domain_name: repertory-cinema-programming-rights
api_prefix: "/"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Every business resource is addressed at the URL root (`/bookings/{id}`, `/showtimes/{id}`,
  # `/clearances/{id}`) and linked by foreign keys carried in request bodies. The only nested
  # path in the whole surface is the append-only negotiation log `GET /bookings/{id}/offers`.
  # No ownership tree is encoded in the URL space; `api_prefix: "/"` is therefore literal.

  state_machine_shape: cyclic
  # Booking runs alternating negotiation rounds (OFFERED -> COUNTERED -> OFFERED -> COUNTERED ...),
  # RightsClearance loops SUBMITTED -> CHANGES_REQUESTED -> SUBMITTED, Settlement loops
  # SUBMITTED -> DISPUTED -> SUBMITTED, and Showtime carries three INDEPENDENT state dimensions
  # (status x sale_status x playback_status), two of which are themselves cyclic
  # (ON_SALE <-> SOLD_OUT, KEY_PENDING <-> PLAYBACK_FAILED).

  relationship_patterns:
    - one_to_many          # Booking -> Showtime, Showtime -> TicketOrder, DcpAsset -> KdmKey
    - self_referential     # Booking.supersedes_booking_id -> Booking.id (re-negotiated engagement)
    - cross_aggregate      # Showtime references Booking, RightsClearance and DcpAsset simultaneously
    - polymorphic          # TicketOrder.member_id is present for member sales, null for walk-ups

  role_model: segregation_of_duties
  # The RightsManager who lodged a clearance may not be the RightsManager who clears it
  # (`X-User-ID` comparison, ERR_SEGREGATION_OF_DUTIES); booking terms are negotiated by
  # Programmer but only ExecutiveDirector may confirm them; box office settles, ExecutiveDirector
  # finalizes.

  consistency_model: immediate

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Venue
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Auditorium name (single-screen art house).
      - name: seat_capacity
        type: integer
        source: input
        description: Total physical seats in the auditorium.
        constraints: ">= 1"
      - name: house_hold_seats
        type: integer
        source: input
        default: 0
        description: Seats permanently withheld from sale for press/guests; never sellable.
        constraints: ">= 0 and < seat_capacity"
      - name: trailer_reel_minutes
        type: integer
        source: input
        description: Fixed pre-show trailer reel added to every showtime's on-screen duration.
        constraints: ">= 0"
      - name: turnaround_minutes
        type: integer
        source: input
        description: Clean/reset buffer appended AFTER end_at before the screen is free again.
        constraints: ">= 0"
      - name: min_useful_gap_minutes
        type: integer
        source: input
        default: 45
        description: Gap below which a hole in the day's schedule is considered fragmentation.
        constraints: ">= 0"
      - name: dcp_ingest_lane_count
        type: integer
        source: input
        description: Number of parallel ingest lanes on the venue's digital cinema server.
        constraints: ">= 1"
      - name: open_local_time
        type: string
        source: input
        description: Earliest permitted showtime start, venue-local HH:MM.
      - name: last_start_local_time
        type: string
        source: input
        description: Latest permitted showtime start, venue-local HH:MM (end may fall after it).
      - name: utc_offset_minutes
        type: integer
        source: input
        default: 0
        description: Fixed offset used to derive venue-local date/time from UTC instants.
      - name: max_first_run_share
        type: number
        source: input
        default: 0.60
        description: Ceiling on the FIRST_RUN share of a venue ISO week's non-cancelled showtimes.
        constraints: "0 < value <= 1"
      - name: weekly_repertory_target
        type: integer
        source: input
        default: 6
        description: Audience-development target for REPERTORY_SERIES screenings per ISO week.
        constraints: ">= 0"
      - name: supported_formats
        type: array
        source: input
        description: Projection formats the booth can run; showtime.format must be a member.
        constraints: "non-empty subset of {DCP_2K, DCP_4K, PRINT_35MM, PRINT_16MM, DIGITAL_FILE_PRORES}"
      - name: base_house_nut_weekly_cents
        type: integer
        source: input
        default: 480000
        description: Board-approved weekly house nut cap; no booking may be confirmed above it.
        constraints: ">= 0"

  - name: Distributor
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Distributor or licensor trading name.
      - name: contact_email
        type: string
        source: input
        description: Booking desk contact address.
      - name: default_terms_variant
        type: enum
        source: input
        description: Settlement shape this distributor normally demands.
        constraints: "one of {SLIDING_SCALE_90_10, PERCENTAGE_FLOOR, FLAT_FEE}"
      - name: default_min_run_days
        type: integer
        source: input
        description: Distributor's standard minimum-run commitment in playing days.
        constraints: ">= 1"
      - name: default_distributor_share_pct
        type: number
        source: input
        description: Distributor's standard percentage of adjusted gross.
        constraints: "0 <= value <= 1"
      - name: requires_advance_guarantee
        type: boolean
        source: input
        default: false
        description: When true, every Booking for this distributor must carry guarantee_cents > 0.

  - name: Title
    parent: null
    common_fields: true
    fields:
      - name: title_name
        type: string
        source: input
        description: Film title as printed in the calendar.
      - name: release_year
        type: integer
        source: input
        description: Original theatrical release year.
      - name: runtime_minutes
        type: integer
        source: input
        description: Feature running time excluding trailers.
        constraints: ">= 1"
      - name: is_first_run
        type: boolean
        source: input
        description: True for first-run art films, false for repertory/archival titles.
      - name: native_format
        type: enum
        source: input
        description: Format the print/package natively exists in.
        constraints: "one of {DCP_2K, DCP_4K, PRINT_35MM, PRINT_16MM, DIGITAL_FILE_PRORES}"
      - name: rights_holder_distributor_id
        type: string
        source: input
        description: "FK -> Distributor.id; the party that controls theatrical rights for this title."

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - name: title_id
        type: string
        source: input
        description: "FK -> Title.id; the title being engaged."
      - name: distributor_id
        type: string
        source: input
        description: "FK -> Distributor.id; counterparty for the engagement."
      - name: venue_id
        type: string
        source: input
        description: "FK -> Venue.id; screen the engagement occupies."
      - name: supersedes_booking_id
        type: string
        source: input
        default: null
        description: "FK -> Booking.id; self-reference to the WITHDRAWN engagement this one replaces."
      - name: terms_variant
        type: enum
        source: input
        description: Settlement algorithm branch selected for this engagement.
        constraints: "one of {SLIDING_SCALE_90_10, PERCENTAGE_FLOOR, FLAT_FEE}"
      - name: house_nut_cents
        type: integer
        source: input
        description: Negotiated engagement house nut; overwritten by the accepted offer on confirm.
        constraints: ">= 0"
      - name: distributor_share_pct
        type: number
        source: input
        description: Negotiated distributor share; overwritten by the accepted offer on confirm.
        constraints: "0 <= value <= 1"
      - name: guarantee_cents
        type: integer
        source: input
        description: Minimum film rent floor payable regardless of gross.
        constraints: ">= 0"
      - name: min_run_days
        type: integer
        source: input
        description: Minimum distinct venue-local playing days committed to the distributor.
        constraints: ">= 1"
      - name: engagement_start_date
        type: string
        source: input
        description: First permitted playing date (venue-local YYYY-MM-DD, inclusive).
      - name: engagement_end_date
        type: string
        source: input
        description: Last permitted playing date (venue-local YYYY-MM-DD, inclusive).
      - name: status
        type: enum
        source: system
        default: OFFERED
        description: Negotiation and engagement lifecycle state.
        constraints: "one of {OFFERED, COUNTERED, CONFIRMED, RUNNING, CLOSED, WITHDRAWN}"
      - name: round_count
        type: integer
        source: computed
        default: 1
        description: Number of BookingOffer rounds lodged so far; capped by MAX_NEGOTIATION_ROUNDS.
      - name: scheduled_showtime_count
        type: integer
        source: computed
        default: 0
        description: Count of Showtime rows for this booking with status IN {SCHEDULED, COMPLETED}.
      - name: actual_playing_days
        type: integer
        source: computed
        default: 0
        description: Distinct venue-local dates among this booking's COMPLETED showtimes (set on close).
      - name: min_run_compliant
        type: boolean
        source: computed
        default: false
        description: True when actual_playing_days >= min_run_days at close time.
      - name: min_run_penalty_cents
        type: integer
        source: computed
        default: 0
        description: Shortfall penalty computed by booking_min_run_compliance at close.
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the Programmer who created the booking (opaque operator id).
      - name: confirmed_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the ExecutiveDirector who confirmed the engagement.

  - name: BookingOffer
    parent: null
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the engagement being negotiated."
      - name: round_index
        type: integer
        source: system
        description: 1-based negotiation round this offer occupies (equals Booking.round_count when lodged).
      - name: proposed_by
        type: enum
        source: input
        description: Which side lodged this round.
        constraints: "one of {CINEMA, DISTRIBUTOR}"
      - name: proposed_house_nut_cents
        type: integer
        source: input
        description: House nut proposed in this round.
        constraints: ">= 0"
      - name: proposed_distributor_share_pct
        type: number
        source: input
        description: Distributor share proposed in this round.
        constraints: "0 <= value <= 1"
      - name: proposed_min_run_days
        type: integer
        source: input
        description: Minimum run days proposed in this round.
        constraints: ">= 1"
      - name: proposed_guarantee_cents
        type: integer
        source: input
        description: Guarantee floor proposed in this round.
        constraints: ">= 0"
      - name: outcome
        type: enum
        source: system
        default: PENDING
        description: Disposition of this round.
        constraints: "one of {PENDING, ACCEPTED, COUNTERED, REJECTED, EXPIRED}"
      - name: expires_at
        type: datetime
        source: computed
        description: created_at + OFFER_VALIDITY_HOURS; a PENDING offer past this instant cannot be accepted.
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the Programmer who lodged the round (opaque operator id).

  - name: RightsClearance
    parent: null
    common_fields: true
    fields:
      - name: title_id
        type: string
        source: input
        description: "FK -> Title.id; title whose exhibition rights are being cleared."
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; engagement the licence is attached to."
      - name: licensor_name
        type: string
        source: input
        description: Archive, estate or distributor granting the licence.
      - name: license_fee_cents
        type: integer
        source: input
        description: Flat licensing fee payable for the clearance.
        constraints: ">= 0"
      - name: territory
        type: string
        source: input
        description: Licensed territory code (e.g. "US-NY-METRO").
      - name: window_start_date
        type: string
        source: input
        description: First licensed exhibition date (venue-local YYYY-MM-DD, inclusive).
      - name: window_end_date
        type: string
        source: input
        description: Last licensed exhibition date (venue-local YYYY-MM-DD, inclusive).
      - name: max_screenings
        type: integer
        source: input
        description: Contractual ceiling on licensed screenings under this clearance.
        constraints: ">= 1"
      - name: source_format
        type: enum
        source: input
        description: Format the licence covers; showtime.format must equal it.
        constraints: "one of {DCP_2K, DCP_4K, PRINT_35MM, PRINT_16MM, DIGITAL_FILE_PRORES}"
      - name: screenings_used
        type: integer
        source: computed
        default: 0
        description: Count of Showtime rows on this clearance with status IN {SCHEDULED, COMPLETED}.
      - name: screenings_remaining
        type: integer
        source: computed
        description: max_screenings - screenings_used; never negative.
      - name: status
        type: enum
        source: system
        default: SUBMITTED
        description: Clearance lifecycle state.
        constraints: "one of {SUBMITTED, CHANGES_REQUESTED, CLEARED, EXPIRED, REVOKED}"
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the RightsManager who lodged the clearance (segregation-of-duties subject).
      - name: cleared_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the RightsManager who cleared it; must differ from submitted_by_user_id.
      - name: change_request_note
        type: string
        source: input
        default: null
        description: Last note recorded by request-changes.
      - name: revoked_reason
        type: string
        source: input
        default: null
        description: Free-text reason captured when the clearance is revoked.

  - name: DcpAsset
    parent: null
    common_fields: true
    fields:
      - name: title_id
        type: string
        source: input
        description: "FK -> Title.id; title the package or print carries."
      - name: source_distributor_id
        type: string
        source: input
        description: "FK -> Distributor.id; shipper of the package or print."
      - name: venue_id
        type: string
        source: input
        description: "FK -> Venue.id; destination venue whose ingest lanes the window occupies."
      - name: format
        type: enum
        source: input
        description: Physical/digital format of this specific asset.
        constraints: "one of {DCP_2K, DCP_4K, PRINT_35MM, PRINT_16MM, DIGITAL_FILE_PRORES}"
      - name: is_encrypted
        type: boolean
        source: input
        description: True when playback requires a KdmKey covering the showtime.
      - name: carrier_ref
        type: string
        source: input
        default: null
        description: Print-traffic waybill / courier reference.
      - name: ingest_window_start_at
        type: datetime
        source: input
        description: Booked start of the server ingest window (closed interval start).
      - name: ingest_window_end_at
        type: datetime
        source: input
        description: Booked end of the server ingest window (closed interval end); must be > start.
      - name: status
        type: enum
        source: system
        default: REQUESTED
        description: Print-traffic and ingest state.
        constraints: "one of {REQUESTED, IN_TRANSIT, RECEIVED, INGESTING, INGESTED, RETURNED}"
      - name: received_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant at which the asset was marked RECEIVED.
      - name: ingested_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant at which the asset reached INGESTED.

  - name: KdmKey
    parent: null
    common_fields: true
    fields:
      - name: dcp_asset_id
        type: string
        source: input
        description: "FK -> DcpAsset.id; encrypted package this key unlocks."
      - name: venue_id
        type: string
        source: input
        description: "FK -> Venue.id; venue whose projection server the key is bound to."
      - name: server_ref
        type: string
        source: input
        description: Projector/server certificate reference the KDM was cut for.
      - name: valid_from
        type: datetime
        source: input
        description: Start of key validity (closed interval start).
      - name: valid_until
        type: datetime
        source: input
        description: End of key validity (closed interval end); must be > valid_from.
      - name: status
        type: enum
        source: system
        default: ISSUED
        description: Key lifecycle state.
        constraints: "one of {ISSUED, EXPIRED, REVOKED}"
      - name: revoked_reason
        type: string
        source: input
        default: null
        description: Reason captured when the key is revoked.

  - name: Showtime
    parent: null
    common_fields: true
    fields:
      - name: venue_id
        type: string
        source: input
        description: "FK -> Venue.id; the single screen this showtime occupies."
      - name: title_id
        type: string
        source: input
        description: "FK -> Title.id; feature being screened."
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; engagement the screening is billed against."
      - name: clearance_id
        type: string
        source: input
        description: "FK -> RightsClearance.id; licence consuming one screening allowance."
      - name: dcp_asset_id
        type: string
        source: input
        description: "FK -> DcpAsset.id; package or print that will be projected."
      - name: strand
        type: enum
        source: input
        description: Programming strand used for calendar-balance and audience-development rules.
        constraints: "one of {FIRST_RUN, REPERTORY_SERIES, FESTIVAL, SPECIAL_EVENT}"
      - name: series_label
        type: string
        source: input
        default: null
        description: Themed-series name printed in the calendar (free text, no referential meaning).
      - name: start_at
        type: datetime
        source: input
        description: Advertised start instant (UTC); venue-local time derived via venue.utc_offset_minutes.
      - name: end_at
        type: datetime
        source: computed
        description: start_at + trailer_reel_minutes + title.runtime_minutes + extra_minutes.
      - name: blocked_until
        type: datetime
        source: computed
        description: end_at + venue.turnaround_minutes; screen occupancy interval is [start_at, blocked_until).
      - name: extra_minutes
        type: integer
        source: computed
        default: 0
        description: On-screen minutes added by the CONFIRMED SpecialEvent attached to this showtime.
      - name: base_price_cents
        type: integer
        source: input
        description: Advertised full-price admission before member discount and surcharge.
        constraints: ">= 0"
      - name: surcharge_cents
        type: integer
        source: computed
        default: 0
        description: Per-ticket surcharge contributed by the CONFIRMED SpecialEvent.
      - name: public_sale_opens_at
        type: datetime
        source: input
        description: Instant at which non-member sales open; members may buy earlier per tier.
      - name: format
        type: enum
        source: input
        description: Projection format for this screening.
        constraints: "one of {DCP_2K, DCP_4K, PRINT_35MM, PRINT_16MM, DIGITAL_FILE_PRORES}"
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: "Lifecycle dimension (independent of sale_status and playback_status)."
        constraints: "one of {SCHEDULED, CANCELLED, COMPLETED}"
      - name: sale_status
        type: enum
        source: system
        default: DRAFT
        description: "Ticketing dimension; evolves independently of playback_status."
        constraints: "one of {DRAFT, ON_SALE, SOLD_OUT, SALES_CLOSED}"
      - name: playback_status
        type: enum
        source: system
        default: UNVERIFIED
        description: "Technical dimension; evolves independently of sale_status."
        constraints: "one of {UNVERIFIED, KEY_PENDING, PLAYBACK_VERIFIED, PLAYBACK_FAILED}"
      - name: seats_sold
        type: integer
        source: computed
        default: 0
        description: Sum of TicketOrder.quantity for orders with status IN {RESERVED, PAID}.
      - name: seats_available
        type: integer
        source: computed
        description: venue.seat_capacity - venue.house_hold_seats - seats_sold; never negative.
      - name: gross_cents
        type: integer
        source: computed
        default: 0
        description: Sum of TicketOrder.total_cents for orders with status == PAID.
      - name: admissions_count
        type: integer
        source: computed
        default: 0
        description: Sum of TicketOrder.quantity for orders with status == PAID.
      - name: slot_score
        type: integer
        source: computed
        default: null
        description: Winning slot_ranking_score; set only by auto-schedule, null for manual creation.
      - name: cancel_reason
        type: string
        source: input
        default: null
        description: Reason recorded on cancellation, including cascade-generated reasons.

  - name: SpecialEvent
    parent: null
    common_fields: true
    fields:
      - name: showtime_id
        type: string
        source: input
        description: "FK -> Showtime.id; screening the event is produced around."
      - name: event_type
        type: enum
        source: input
        description: Kind of production wrapped around the screening.
        constraints: "one of {FILMMAKER_QA, PANEL, FESTIVAL_SCREENING, THEMED_INTRO}"
      - name: guest_name
        type: string
        source: input
        description: Visiting filmmaker or panellist name.
      - name: extra_minutes
        type: integer
        source: input
        description: Additional on-screen/stage minutes the event adds to the showtime block.
        constraints: ">= 0"
      - name: surcharge_cents
        type: integer
        source: input
        description: Per-ticket surcharge applied once the event is CONFIRMED.
        constraints: ">= 0"
      - name: guest_fee_cents
        type: integer
        source: input
        description: Honorarium payable to the guest; cinema expense, never part of film rent.
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        default: PLANNED
        description: Production lifecycle state.
        constraints: "one of {PLANNED, CONFIRMED, CANCELLED}"
      - name: displaced_showtime_ids
        type: array
        source: computed
        default: []
        description: Ids of showtimes auto-cancelled by this event's confirmation cascade.

  - name: TicketOrder
    parent: null
    common_fields: true
    fields:
      - name: showtime_id
        type: string
        source: input
        description: "FK -> Showtime.id; screening being sold."
      - name: member_id
        type: string
        source: input
        default: null
        description: "FK -> Member.id; null for walk-up/anonymous purchases."
      - name: quantity
        type: integer
        source: input
        description: Total seats on the order including comps.
        constraints: "1 <= quantity <= MAX_TICKETS_PER_ORDER"
      - name: comp_quantity
        type: integer
        source: input
        default: 0
        description: Seats drawn from the member's comp allowance; priced at zero admission.
        constraints: "0 <= comp_quantity <= quantity"
      - name: purchaser_email
        type: string
        source: input
        description: Confirmation address for the order.
      - name: unit_price_cents
        type: integer
        source: computed
        description: Per-paid-ticket price after member discount, rounded to whole cents FIRST.
      - name: line_subtotal_cents
        type: integer
        source: computed
        description: unit_price_cents * (quantity - comp_quantity).
      - name: facility_fee_cents
        type: integer
        source: computed
        description: FACILITY_FEE_CENTS_PER_TICKET * quantity; retained by the cinema, comps included.
      - name: applied_credit_cents
        type: integer
        source: computed
        default: 0
        description: Member credit consumed by this order.
      - name: total_cents
        type: integer
        source: computed
        description: line_subtotal_cents + facility_fee_cents - applied_credit_cents.
      - name: status
        type: enum
        source: system
        default: RESERVED
        description: Order lifecycle state.
        constraints: "one of {RESERVED, PAID, REFUNDED, VOID}"
      - name: refund_destination
        type: enum
        source: input
        default: null
        description: Where a refund was sent.
        constraints: "one of {CASH, MEMBER_CREDIT}"

  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Member name on the card.
      - name: email
        type: string
        source: input
        description: Member contact address; unique across non-cancelled members.
      - name: join_date
        type: string
        source: input
        description: Date the membership record was opened (YYYY-MM-DD).
      - name: status
        type: enum
        source: system
        default: PENDING
        description: Membership state.
        constraints: "one of {PENDING, ACTIVE, LAPSED}"
      - name: donations
        type: array
        source: system
        default: []
        description: Append-only list of {amount_cents, received_at} objects lodged via the donations endpoint.
      - name: expires_at
        type: datetime
        source: computed
        default: null
        description: Latest qualifying donation's received_at + MEMBERSHIP_TERM_DAYS.
      - name: rolling_donation_cents
        type: integer
        source: computed
        default: 0
        description: Donation total inside the trailing ROLLING_WINDOW_DAYS window ending at the clock.
      - name: fiscal_ytd_donation_cents
        type: integer
        source: computed
        default: 0
        description: Donation total from FISCAL_YEAR_START through the clock.
      - name: rolling_tier
        type: enum
        source: computed
        default: PROSPECT
        description: Tier implied by rolling_donation_cents.
        constraints: "one of {PROSPECT, BASIC, SUPPORTER, DONOR_CIRCLE}"
      - name: fiscal_tier
        type: enum
        source: computed
        default: PROSPECT
        description: Tier implied by fiscal_ytd_donation_cents.
        constraints: "one of {PROSPECT, BASIC, SUPPORTER, DONOR_CIRCLE}"
      - name: effective_tier
        type: enum
        source: computed
        default: PROSPECT
        description: Higher-ranked of rolling_tier and fiscal_tier; drives every member benefit.
        constraints: "one of {PROSPECT, BASIC, SUPPORTER, DONOR_CIRCLE}"
      - name: discount_pct
        type: number
        source: computed
        default: 0.00
        description: Admission discount implied by effective_tier.
      - name: advance_access_hours
        type: integer
        source: computed
        default: 0
        description: Hours before public_sale_opens_at this member may purchase.
      - name: comp_tickets_granted
        type: integer
        source: computed
        default: 0
        description: Comp allowance implied by effective_tier for the current membership term.
      - name: comp_tickets_remaining
        type: integer
        source: computed
        default: 0
        description: comp_tickets_granted minus comps held on non-VOID/non-REFUNDED orders.
      - name: credit_balance_cents
        type: integer
        source: computed
        default: 0
        description: Refund credit available to spend on future orders.

  - name: Settlement
    parent: null
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; engagement being settled with the distributor."
      - name: variant
        type: enum
        source: input
        description: Which settlement algorithm branch produced the stored figures.
        constraints: "one of {PROVISIONAL, FINAL}"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: Settlement lifecycle state.
        constraints: "one of {DRAFT, SUBMITTED, RECONCILED, PAID, DISPUTED}"
      - name: box_office_cents
        type: integer
        source: computed
        description: Sum of TicketOrder.total_cents over the variant's included order set.
      - name: facility_fee_total_cents
        type: integer
        source: computed
        description: Sum of TicketOrder.facility_fee_cents over the same included order set.
      - name: adjusted_gross_cents
        type: integer
        source: computed
        description: box_office_cents - facility_fee_total_cents; the film-rent basis.
      - name: playing_days
        type: integer
        source: computed
        description: Distinct venue-local dates among the variant's included showtime set.
      - name: proration_factor
        type: number
        source: computed
        description: House-nut proration derived from playing_days with MIN_PRORATION_FLOOR applied.
      - name: house_nut_applied_cents
        type: integer
        source: computed
        description: round_half_up(booking.house_nut_cents * proration_factor).
      - name: film_rent_cents
        type: integer
        source: computed
        description: Amount owed to the distributor after the guarantee floor is applied.
      - name: cinema_retained_cents
        type: integer
        source: computed
        description: adjusted_gross_cents + facility_fee_total_cents - film_rent_cents.
      - name: min_run_penalty_cents
        type: integer
        source: computed
        default: 0
        description: Copy of booking.min_run_penalty_cents at the time the figures were computed.
      - name: submitted_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the BoxOfficeManager who submitted the settlement.
      - name: finalized_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the ExecutiveDirector who finalized the settlement.
      - name: dispute_note
        type: string
        source: input
        default: null
        description: Distributor's dispute rationale captured on resolve(outcome=DISPUTED).

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Booking
    initial_state: OFFERED
    terminal_states: [CLOSED, WITHDRAWN]
    shape: cyclic
    note: |
      Alternating negotiation rounds form the cycle: OFFERED -> COUNTERED -> OFFERED and
      COUNTERED -> COUNTERED are all legal until round_count reaches MAX_NEGOTIATION_ROUNDS.
      `POST /bookings` itself lodges round 1 (proposed_by CINEMA), so no DRAFT state exists.
    transitions:
      - from: "(none)"
        to: OFFERED
        trigger: "POST /bookings"
        actor: Programmer
        preconditions:
          - "title_id, distributor_id, venue_id all exist"
          - "engagement_start_date <= engagement_end_date"
          - "distributor.requires_advance_guarantee == false OR guarantee_cents > 0"
        side_effects:
          - "Creates BookingOffer round_index=1, proposed_by=CINEMA, outcome=PENDING, expires_at=created_at+OFFER_VALIDITY_HOURS"
          - "Sets round_count=1, scheduled_showtime_count=0, min_run_compliant=false, min_run_penalty_cents=0"
          - "Sets created_by_user_id = X-User-ID"

      - from: OFFERED
        to: COUNTERED
        trigger: "POST /bookings/{id}/counter"
        actor: Programmer
        preconditions:
          - "expected_booking_version == Booking.version (OCC, see concurrency_rules booking-counter-stale-version)"
          - "round_count < MAX_NEGOTIATION_ROUNDS"
          - "latest BookingOffer.outcome == PENDING"
        side_effects:
          - "Latest PENDING BookingOffer.outcome := COUNTERED"
          - "Creates BookingOffer round_index=round_count+1 with the posted terms, outcome=PENDING"
          - "round_count += 1; increments Booking.version by 1"

      - from: COUNTERED
        to: COUNTERED
        trigger: "POST /bookings/{id}/counter"
        actor: Programmer
        preconditions:
          - "expected_booking_version == Booking.version (OCC)"
          - "round_count < MAX_NEGOTIATION_ROUNDS"
          - "latest BookingOffer.outcome == PENDING"
        side_effects:
          - "Latest PENDING BookingOffer.outcome := COUNTERED"
          - "Creates BookingOffer round_index=round_count+1 with the posted terms, outcome=PENDING"
          - "round_count += 1; increments Booking.version by 1"
        note: "Self-loop: the counter-to-a-counter round. This is the cycle Rule 3 targets."

      - from: COUNTERED
        to: OFFERED
        trigger: "POST /bookings/{id}/offer"
        actor: Programmer
        preconditions:
          - "round_count < MAX_NEGOTIATION_ROUNDS"
          - "latest BookingOffer.outcome == PENDING"
        side_effects:
          - "Latest PENDING BookingOffer.outcome := COUNTERED"
          - "Creates BookingOffer round_index=round_count+1, proposed_by=CINEMA, outcome=PENDING"
          - "round_count += 1"
        note: "Closes the cycle back to OFFERED. No OCC: a second sequential call is refused by from-state."

      - from: OFFERED
        to: CONFIRMED
        trigger: "POST /bookings/{id}/confirm"
        actor: ExecutiveDirector
        preconditions:
          - "latest BookingOffer.outcome == PENDING"
          - "clock <= latest BookingOffer.expires_at"
          - "latest BookingOffer.proposed_house_nut_cents <= venue.base_house_nut_weekly_cents"
        side_effects:
          - "Latest BookingOffer.outcome := ACCEPTED"
          - "Copies accepted offer terms onto house_nut_cents, distributor_share_pct, min_run_days, guarantee_cents"
          - "Sets confirmed_by_user_id = X-User-ID"

      - from: COUNTERED
        to: CONFIRMED
        trigger: "POST /bookings/{id}/confirm"
        actor: ExecutiveDirector
        preconditions:
          - "latest BookingOffer.outcome == PENDING"
          - "clock <= latest BookingOffer.expires_at"
          - "latest BookingOffer.proposed_house_nut_cents <= venue.base_house_nut_weekly_cents"
        side_effects:
          - "Latest BookingOffer.outcome := ACCEPTED"
          - "Copies accepted offer terms onto house_nut_cents, distributor_share_pct, min_run_days, guarantee_cents"
          - "Sets confirmed_by_user_id = X-User-ID"
        note: "The cinema accepting the distributor's counter."

      - from: CONFIRMED
        to: RUNNING
        trigger: "system: first Showtime under this booking reaches status COMPLETED"
        actor: system
        preconditions:
          - "Booking.status == CONFIRMED"
        side_effects:
          - "No other field changes; increments Booking.version by 1"
        note: "Bubble-up: caused by the child's COMPLETED transition, not by a direct call."

      - from: CONFIRMED
        to: CLOSED
        trigger: "POST /bookings/{id}/close"
        actor: BoxOfficeManager
        preconditions:
          - "Booking.status IN {CONFIRMED, RUNNING}"
        side_effects:
          - "Runs booking_min_run_compliance: sets actual_playing_days, min_run_compliant, min_run_penalty_cents"
        note: "Zero-COMPLETED-showtime close is legal and exercises the empty-set branch."

      - from: RUNNING
        to: CLOSED
        trigger: "POST /bookings/{id}/close"
        actor: BoxOfficeManager
        preconditions:
          - "Booking.status IN {CONFIRMED, RUNNING}"
        side_effects:
          - "Runs booking_min_run_compliance: sets actual_playing_days, min_run_compliant, min_run_penalty_cents"

      - from: OFFERED
        to: WITHDRAWN
        trigger: "POST /bookings/{id}/withdraw"
        actor: ExecutiveDirector
        preconditions:
          - "Booking.status IN {OFFERED, COUNTERED, CONFIRMED, RUNNING}"
        side_effects:
          - "HOP 1: every BookingOffer with outcome PENDING := REJECTED"
          - "HOP 2: because the booking is WITHDRAWN, every RightsClearance with booking_id == this and status IN {SUBMITTED, CHANGES_REQUESTED, CLEARED} := REVOKED with revoked_reason 'BOOKING_WITHDRAWN'"
          - "HOP 3: because those clearances are REVOKED, every Showtime on them with status == SCHEDULED := CANCELLED (cancel_reason 'CLEARANCE_REVOKED'), sale_status := SALES_CLOSED"
          - "HOP 4: because those showtimes are CANCELLED, their TicketOrders with status RESERVED := VOID and status PAID := REFUNDED (refund_destination MEMBER_CREDIT when member_id is set, else CASH), restoring member credit_balance_cents and comp_tickets_remaining, and each affected clearance's screenings_used is recomputed"

      - from: COUNTERED
        to: WITHDRAWN
        trigger: "POST /bookings/{id}/withdraw"
        actor: ExecutiveDirector
        preconditions:
          - "Booking.status IN {OFFERED, COUNTERED, CONFIRMED, RUNNING}"
        side_effects:
          - "Same four-hop cascade as OFFERED -> WITHDRAWN"

      - from: CONFIRMED
        to: WITHDRAWN
        trigger: "POST /bookings/{id}/withdraw"
        actor: ExecutiveDirector
        preconditions:
          - "Booking.status IN {OFFERED, COUNTERED, CONFIRMED, RUNNING}"
        side_effects:
          - "Same four-hop cascade as OFFERED -> WITHDRAWN"

      - from: RUNNING
        to: WITHDRAWN
        trigger: "POST /bookings/{id}/withdraw"
        actor: ExecutiveDirector
        preconditions:
          - "Booking.status IN {OFFERED, COUNTERED, CONFIRMED, RUNNING}"
        side_effects:
          - "Same four-hop cascade as OFFERED -> WITHDRAWN"

  - entity: BookingOffer
    initial_state: PENDING
    terminal_states: [ACCEPTED, COUNTERED, REJECTED, EXPIRED]
    shape: branching
    note: "Append-only negotiation log; the `outcome` field is the only mutable state."
    transitions:
      - from: "(none)"
        to: PENDING
        trigger: "POST /bookings (round 1) or POST /bookings/{id}/counter or POST /bookings/{id}/offer"
        actor: Programmer
        preconditions:
          - "Parent Booking.round_count < MAX_NEGOTIATION_ROUNDS for rounds after the first"
        side_effects:
          - "expires_at := created_at + OFFER_VALIDITY_HOURS"
          - "submitted_by_user_id := X-User-ID"
      - from: PENDING
        to: COUNTERED
        trigger: "system: a later round supersedes this one"
        actor: system
        preconditions:
          - "A new BookingOffer is being created on the same booking"
        side_effects: ["No further mutation is possible on this offer"]
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /bookings/{id}/confirm"
        actor: ExecutiveDirector
        preconditions:
          - "clock <= expires_at"
        side_effects: ["Parent booking copies this offer's terms"]
      - from: PENDING
        to: REJECTED
        trigger: "POST /bookings/{id}/withdraw"
        actor: ExecutiveDirector
        preconditions: ["Parent booking is being withdrawn"]
        side_effects: ["None beyond the outcome flip"]
      - from: PENDING
        to: EXPIRED
        trigger: "system: POST /bookings/{id}/confirm observes clock > expires_at"
        actor: system
        preconditions:
          - "clock > expires_at"
        side_effects:
          - "outcome := EXPIRED and the confirm call is rejected with ERR_OFFER_EXPIRED"
        note: "Lazy expiry evaluated at confirm time; no background job exists."

  - entity: RightsClearance
    initial_state: SUBMITTED
    terminal_states: [EXPIRED, REVOKED]
    shape: cyclic
    note: "Creation IS the submission. SUBMITTED -> CHANGES_REQUESTED -> SUBMITTED is the revision loop."
    transitions:
      - from: "(none)"
        to: SUBMITTED
        trigger: "POST /clearances"
        actor: RightsManager
        preconditions:
          - "title_id and booking_id exist"
          - "Booking.status NOT IN {WITHDRAWN}"
          - "window_start_date <= window_end_date"
          - "source_format == title.native_format OR source_format IN venue.supported_formats"
        side_effects:
          - "submitted_by_user_id := X-User-ID; screenings_used := 0; screenings_remaining := max_screenings"
      - from: SUBMITTED
        to: CHANGES_REQUESTED
        trigger: "POST /clearances/{id}/request-changes"
        actor: RightsManager
        preconditions: ["status == SUBMITTED"]
        side_effects: ["change_request_note := posted note"]
      - from: CHANGES_REQUESTED
        to: SUBMITTED
        trigger: "POST /clearances/{id}/submit"
        actor: RightsManager
        preconditions: ["status == CHANGES_REQUESTED"]
        side_effects: ["submitted_by_user_id := X-User-ID (re-lodging resets the segregation subject)"]
        note: "Closes the revision cycle."
      - from: SUBMITTED
        to: CLEARED
        trigger: "POST /clearances/{id}/clear"
        actor: RightsManager
        preconditions:
          - "status == SUBMITTED"
          - "X-User-ID != submitted_by_user_id (segregation of duties)"
          - "clock's venue-local date <= window_end_date"
        side_effects:
          - "cleared_by_user_id := X-User-ID"
      - from: CLEARED
        to: EXPIRED
        trigger: "system: POST /showtimes or POST /showtimes/auto-schedule observes clock's venue-local date > window_end_date"
        actor: system
        preconditions: ["status == CLEARED", "venue-local date of clock > window_end_date"]
        side_effects:
          - "status := EXPIRED and the showtime creation is rejected with ERR_CLEARANCE_EXPIRED"
        note: "Lazy expiry; the licence window is only re-checked when someone tries to use it."
      - from: CLEARED
        to: REVOKED
        trigger: "POST /clearances/{id}/revoke"
        actor: RightsManager
        preconditions: ["status IN {SUBMITTED, CHANGES_REQUESTED, CLEARED}"]
        side_effects:
          - "HOP 1: revoked_reason := posted reason"
          - "HOP 2: because the licence is gone, every Showtime with this clearance_id and status == SCHEDULED := CANCELLED (cancel_reason 'CLEARANCE_REVOKED') and sale_status := SALES_CLOSED"
          - "HOP 3: because those showtimes are CANCELLED, their RESERVED TicketOrders := VOID and PAID TicketOrders := REFUNDED, restoring member credit_balance_cents / comp_tickets_remaining, and booking.scheduled_showtime_count is recomputed"
      - from: SUBMITTED
        to: REVOKED
        trigger: "POST /clearances/{id}/revoke"
        actor: RightsManager
        preconditions: ["status IN {SUBMITTED, CHANGES_REQUESTED, CLEARED}"]
        side_effects: ["Same cascade as CLEARED -> REVOKED (usually a no-op, since no showtime can exist yet)"]
      - from: CHANGES_REQUESTED
        to: REVOKED
        trigger: "POST /clearances/{id}/revoke"
        actor: RightsManager
        preconditions: ["status IN {SUBMITTED, CHANGES_REQUESTED, CLEARED}"]
        side_effects: ["Same cascade as CLEARED -> REVOKED"]

  - entity: DcpAsset
    initial_state: REQUESTED
    terminal_states: [RETURNED]
    shape: linear
    note: "Print-traffic pipeline; every hop is one call to POST /dcp-assets/{id}/traffic-update."
    transitions:
      - from: "(none)"
        to: REQUESTED
        trigger: "POST /dcp-assets"
        actor: TechnicalManager
        preconditions:
          - "title_id, source_distributor_id, venue_id exist"
          - "format IN venue.supported_formats"
          - "ingest_window_end_at > ingest_window_start_at"
          - "ingest_lane_capacity admits the window (see calculations.ingest_lane_capacity)"
        side_effects: ["None beyond creation"]
      - from: REQUESTED
        to: IN_TRANSIT
        trigger: "POST /dcp-assets/{id}/traffic-update with new_status=IN_TRANSIT"
        actor: TechnicalManager
        preconditions: ["status == REQUESTED"]
        side_effects: ["carrier_ref := posted carrier_ref when supplied"]
      - from: IN_TRANSIT
        to: RECEIVED
        trigger: "POST /dcp-assets/{id}/traffic-update with new_status=RECEIVED"
        actor: TechnicalManager
        preconditions: ["status == IN_TRANSIT"]
        side_effects: ["received_at := clock"]
      - from: RECEIVED
        to: INGESTING
        trigger: "POST /dcp-assets/{id}/traffic-update with new_status=INGESTING"
        actor: TechnicalManager
        preconditions:
          - "status == RECEIVED"
          - "clock >= ingest_window_start_at"
        side_effects: ["None beyond the status flip"]
      - from: INGESTING
        to: INGESTED
        trigger: "POST /dcp-assets/{id}/traffic-update with new_status=INGESTED"
        actor: TechnicalManager
        preconditions: ["status == INGESTING"]
        side_effects:
          - "ingested_at := clock"
          - "The asset's ingest window stops counting against venue lane capacity"
      - from: INGESTED
        to: RETURNED
        trigger: "POST /dcp-assets/{id}/traffic-update with new_status=RETURNED"
        actor: TechnicalManager
        preconditions:
          - "status == INGESTED"
          - "No Showtime on this dcp_asset_id has status == SCHEDULED"
        side_effects: ["carrier_ref := posted carrier_ref when supplied"]

  - entity: KdmKey
    initial_state: ISSUED
    terminal_states: [EXPIRED, REVOKED]
    shape: branching
    transitions:
      - from: "(none)"
        to: ISSUED
        trigger: "POST /kdm-keys"
        actor: TechnicalManager
        preconditions:
          - "dcp_asset_id and venue_id exist and DcpAsset.venue_id == posted venue_id"
          - "DcpAsset.is_encrypted == true"
          - "valid_until > valid_from"
          - "No other KdmKey on the same (dcp_asset_id, venue_id) with status == ISSUED whose CLOSED validity interval intersects this one"
        side_effects:
          - "HOP 1: every Showtime with this venue_id + dcp_asset_id, status == SCHEDULED and playback_status IN {UNVERIFIED, PLAYBACK_FAILED} that this key covers (valid_from <= start_at AND valid_until >= end_at) := KEY_PENDING"
      - from: ISSUED
        to: REVOKED
        trigger: "POST /kdm-keys/{id}/revoke"
        actor: TechnicalManager
        preconditions: ["status == ISSUED"]
        side_effects:
          - "HOP 1: revoked_reason := posted reason"
          - "HOP 2: because the key is gone, every Showtime with this venue_id + dcp_asset_id, status == SCHEDULED and playback_status IN {KEY_PENDING, PLAYBACK_VERIFIED} that has no OTHER covering ISSUED key := UNVERIFIED, and if sale_status IN {ON_SALE, SOLD_OUT} then sale_status := SALES_CLOSED"
          - "HOP 3: because those showtimes' sales are closed, their TicketOrders with status == RESERVED := VOID (unpaid holds released), and each affected showtime's seats_sold / seats_available are recomputed"
      - from: ISSUED
        to: EXPIRED
        trigger: "system: POST /showtimes/{id}/verify-playback observes valid_until < clock while evaluating candidate keys"
        actor: system
        preconditions: ["status == ISSUED", "valid_until < clock"]
        side_effects:
          - "status := EXPIRED; the key stops being a coverage candidate for that verification"

  - entity: Showtime
    initial_state: SCHEDULED
    initial_states: { status: SCHEDULED, sale_status: DRAFT, playback_status: UNVERIFIED }
    terminal_states: [CANCELLED, COMPLETED]
    shape: parallel
    note: |
      Three INDEPENDENT state dimensions live on one row: `status` (lifecycle), `sale_status`
      (ticketing) and `playback_status` (technical). Every state name is globally unique so a
      transition reference is unambiguous. sale_status contains the ON_SALE <-> SOLD_OUT cycle and
      playback_status contains the KEY_PENDING <-> PLAYBACK_FAILED retest cycle.
    transitions:
      - from: "(none)"
        to: SCHEDULED
        trigger: "POST /showtimes or POST /showtimes/auto-schedule"
        actor: Programmer
        preconditions:
          - "expected_clearance_version == RightsClearance.version (OCC)"
          - "Booking.status IN {CONFIRMED, RUNNING}"
          - "RightsClearance.status == CLEARED and clearance.booking_id == posted booking_id"
          - "venue-local date of start_at BETWEEN clearance.window_start_date AND clearance.window_end_date (inclusive)"
          - "venue-local date of start_at BETWEEN booking.engagement_start_date AND booking.engagement_end_date (inclusive)"
          - "clearance.screenings_remaining >= 1"
          - "format == clearance.source_format, format == dcp_asset.format, format IN venue.supported_formats"
          - "venue-local time of start_at BETWEEN venue.open_local_time AND venue.last_start_local_time (inclusive)"
          - "No screen-interval collision per calculations.screen_slot_block"
          - "weekly_programming_balance admits the candidate"
        side_effects:
          - "end_at / blocked_until computed; extra_minutes=0; surcharge_cents=0; slot_score set only by auto-schedule"
          - "clearance.screenings_used += 1 and clearance.screenings_remaining -= 1"
          - "increments RightsClearance.version by 1"
          - "booking.scheduled_showtime_count += 1"
      - from: DRAFT
        to: ON_SALE
        trigger: "POST /showtimes/{id}/open-sales"
        actor: BoxOfficeManager
        preconditions:
          - "sale_status == DRAFT and status == SCHEDULED"
          - "Booking.status IN {CONFIRMED, RUNNING} (cross-entity guard)"
          - "seats_available >= 1"
        side_effects: ["None beyond the sale_status flip"]
        note: "Independent of playback_status: a DRAFT-key showtime may still open sales."
      - from: ON_SALE
        to: SOLD_OUT
        trigger: "system: a TicketOrder creation drives seats_available to exactly 0"
        actor: system
        preconditions: ["sale_status == ON_SALE", "seats_available == 0 after the order"]
        side_effects: ["None beyond the sale_status flip"]
      - from: SOLD_OUT
        to: ON_SALE
        trigger: "system: a refund or void frees at least one seat"
        actor: system
        preconditions: ["sale_status == SOLD_OUT", "seats_available >= 1 after the release"]
        side_effects: ["None beyond the sale_status flip"]
        note: "Cycle: sale_status oscillates as seats are released and resold."
      - from: ON_SALE
        to: SALES_CLOSED
        trigger: "POST /showtimes/{id}/close-sales"
        actor: BoxOfficeManager
        preconditions: ["sale_status IN {ON_SALE, SOLD_OUT}"]
        side_effects:
          - "Every TicketOrder on this showtime with status == RESERVED := VOID; seats_sold recomputed"
      - from: SOLD_OUT
        to: SALES_CLOSED
        trigger: "POST /showtimes/{id}/close-sales"
        actor: BoxOfficeManager
        preconditions: ["sale_status IN {ON_SALE, SOLD_OUT}"]
        side_effects:
          - "Every TicketOrder on this showtime with status == RESERVED := VOID; seats_sold recomputed"
      - from: UNVERIFIED
        to: KEY_PENDING
        trigger: "system: POST /kdm-keys issues a covering key"
        actor: system
        preconditions: ["status == SCHEDULED", "new key covers [start_at, end_at]"]
        side_effects: ["None beyond the playback_status flip"]
      - from: PLAYBACK_FAILED
        to: KEY_PENDING
        trigger: "system: POST /kdm-keys issues a replacement covering key"
        actor: system
        preconditions: ["status == SCHEDULED", "new key covers [start_at, end_at]"]
        side_effects: ["None beyond the playback_status flip"]
        note: "Retest cycle: a failed booth test is re-armed by cutting a fresh KDM."
      - from: KEY_PENDING
        to: PLAYBACK_VERIFIED
        trigger: "POST /showtimes/{id}/verify-playback with result=PASS"
        actor: TechnicalManager
        preconditions:
          - "playback_status == KEY_PENDING and status == SCHEDULED"
          - "DcpAsset.status == INGESTED (cross-entity guard)"
          - "A covering ISSUED KdmKey exists with valid_from <= start_at AND valid_until >= end_at"
        side_effects: ["Any candidate KdmKey with valid_until < clock is transitioned ISSUED -> EXPIRED first"]
      - from: KEY_PENDING
        to: PLAYBACK_FAILED
        trigger: "POST /showtimes/{id}/verify-playback with result=FAIL"
        actor: TechnicalManager
        preconditions:
          - "playback_status == KEY_PENDING and status == SCHEDULED"
          - "DcpAsset.status == INGESTED (cross-entity guard)"
        side_effects: ["None beyond the playback_status flip"]
      - from: PLAYBACK_VERIFIED
        to: UNVERIFIED
        trigger: "system: POST /kdm-keys/{id}/revoke removes the last covering key"
        actor: system
        preconditions: ["status == SCHEDULED", "no other ISSUED key covers [start_at, end_at]"]
        side_effects: ["sale_status ON_SALE|SOLD_OUT := SALES_CLOSED; RESERVED orders := VOID"]
      - from: KEY_PENDING
        to: UNVERIFIED
        trigger: "system: POST /kdm-keys/{id}/revoke removes the last covering key"
        actor: system
        preconditions: ["status == SCHEDULED", "no other ISSUED key covers [start_at, end_at]"]
        side_effects: ["sale_status ON_SALE|SOLD_OUT := SALES_CLOSED; RESERVED orders := VOID"]
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /showtimes/{id}/complete"
        actor: BoxOfficeManager
        preconditions:
          - "status == SCHEDULED"
          - "sale_status == SALES_CLOSED"
          - "playback_status == PLAYBACK_VERIFIED"
          - "clock >= end_at"
        side_effects:
          - "gross_cents / admissions_count frozen from PAID orders"
          - "If Booking.status == CONFIRMED then Booking.status := RUNNING (bubble-up)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /showtimes/{id}/cancel"
        actor: Programmer
        preconditions: ["status == SCHEDULED"]
        side_effects:
          - "sale_status := SALES_CLOSED; cancel_reason := posted reason"
          - "HOP 1: TicketOrders with status RESERVED := VOID; with status PAID := REFUNDED (MEMBER_CREDIT when member_id set, else CASH)"
          - "HOP 2: because those orders are refunded, member credit_balance_cents += refunded total_cents and comp_tickets_remaining is restored"
          - "clearance.screenings_used -= 1 and clearance.screenings_remaining += 1; increments RightsClearance.version by 1"
          - "booking.scheduled_showtime_count -= 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: POST /special-events/{id}/confirm with displace_conflicts=true displaces this showtime"
        actor: system
        preconditions: ["status == SCHEDULED", "screen interval intersects the extended block of the event's showtime"]
        side_effects:
          - "cancel_reason := 'DISPLACED_BY_SPECIAL_EVENT'; sale_status := SALES_CLOSED"
          - "Same order-refund, credit-restore, allowance-restore and counter cascade as the manual cancel"

  - entity: SpecialEvent
    initial_state: PLANNED
    terminal_states: [CANCELLED]
    shape: branching
    transitions:
      - from: "(none)"
        to: PLANNED
        trigger: "POST /special-events"
        actor: Programmer
        preconditions:
          - "Showtime exists with status == SCHEDULED"
          - "No other SpecialEvent on this showtime_id with status IN {PLANNED, CONFIRMED}"
        side_effects: ["None beyond creation; the showtime block is NOT yet extended"]
      - from: PLANNED
        to: CONFIRMED
        trigger: "POST /special-events/{id}/confirm"
        actor: Programmer
        preconditions:
          - "status == PLANNED and Showtime.status == SCHEDULED"
          - "Extended block stays inside the venue operating day (start_at is unchanged, so only blocked_until moves)"
          - "displace_conflicts == true OR the extended block collides with nothing"
        side_effects:
          - "HOP 1: Showtime.extra_minutes := extra_minutes and Showtime.surcharge_cents := surcharge_cents, so end_at and blocked_until both move later"
          - "HOP 2: because blocked_until moved, every other Showtime at the venue with status == SCHEDULED whose [start_at, blocked_until) now intersects the extended block := CANCELLED (cancel_reason 'DISPLACED_BY_SPECIAL_EVENT'), sale_status := SALES_CLOSED, and its id is appended to displaced_showtime_ids"
          - "HOP 3: because those showtimes are CANCELLED, their RESERVED TicketOrders := VOID and PAID TicketOrders := REFUNDED, and each displaced showtime's clearance gets screenings_used -= 1 (clearance.version += 1) while its booking gets scheduled_showtime_count -= 1"
          - "HOP 4: because the PAID member orders were refunded to MEMBER_CREDIT, each affected Member.credit_balance_cents += refunded total_cents and comp_tickets_remaining is restored"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /special-events/{id}/cancel"
        actor: Programmer
        preconditions: ["status IN {PLANNED, CONFIRMED}"]
        side_effects: ["None: an unconfirmed event never touched the showtime"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /special-events/{id}/cancel"
        actor: Programmer
        preconditions: ["status IN {PLANNED, CONFIRMED}"]
        side_effects:
          - "Compensation: Showtime.extra_minutes := 0 and Showtime.surcharge_cents := 0, so end_at and blocked_until return to their pre-confirmation values"
          - "Already-displaced showtimes are NOT resurrected; displaced_showtime_ids is retained as the audit trail"

  - entity: TicketOrder
    initial_state: RESERVED
    terminal_states: [REFUNDED, VOID]
    shape: branching
    transitions:
      - from: "(none)"
        to: RESERVED
        trigger: "POST /ticket-orders"
        actor: Member | Anonymous | BoxOfficeManager
        preconditions:
          - "Showtime.status == SCHEDULED and sale_status IN {ON_SALE, SOLD_OUT}"
          - "quantity <= MAX_TICKETS_PER_ORDER"
          - "quantity <= showtime.seats_available"
          - "clock >= public_sale_opens_at OR the member's advance window is open"
          - "comp_quantity == 0 OR (member_id set AND effective_tier IN {SUPPORTER, DONOR_CIRCLE} AND comp_quantity <= comp_tickets_remaining)"
        side_effects:
          - "Runs ticket_order_pricing to set unit_price_cents, line_subtotal_cents, facility_fee_cents, applied_credit_cents, total_cents"
          - "member.credit_balance_cents -= applied_credit_cents; member.comp_tickets_remaining -= comp_quantity"
          - "showtime.seats_sold += quantity; seats_available recomputed; ON_SALE := SOLD_OUT when seats_available hits 0"
      - from: RESERVED
        to: PAID
        trigger: "POST /ticket-orders/{id}/pay"
        actor: Member | Anonymous | BoxOfficeManager
        preconditions:
          - "status == RESERVED"
          - "Showtime.status == SCHEDULED"
        side_effects:
          - "showtime.gross_cents += total_cents; showtime.admissions_count += quantity"
      - from: RESERVED
        to: VOID
        trigger: "POST /showtimes/{id}/close-sales, POST /showtimes/{id}/cancel, or the KDM-revoke / special-event-displacement cascades"
        actor: system
        preconditions: ["status == RESERVED"]
        side_effects:
          - "showtime.seats_sold -= quantity; member.comp_tickets_remaining += comp_quantity; member.credit_balance_cents += applied_credit_cents"
      - from: PAID
        to: REFUNDED
        trigger: "POST /ticket-orders/{id}/refund"
        actor: BoxOfficeManager
        preconditions:
          - "status == PAID"
          - "Showtime.status != COMPLETED"
        side_effects:
          - "refund_destination := posted value"
          - "showtime.gross_cents -= total_cents; admissions_count -= quantity; seats_sold -= quantity"
          - "SOLD_OUT := ON_SALE when seats_available becomes >= 1"
          - "When refund_destination == MEMBER_CREDIT: member.credit_balance_cents += total_cents"
          - "member.comp_tickets_remaining += comp_quantity; member.credit_balance_cents += applied_credit_cents"
      - from: PAID
        to: REFUNDED
        trigger: "system: showtime cancellation, clearance revocation or special-event displacement cascade"
        actor: system
        preconditions: ["status == PAID"]
        side_effects:
          - "refund_destination := MEMBER_CREDIT when member_id is set, else CASH; same ledger reversals as the manual refund"

  - entity: Member
    initial_state: PENDING
    terminal_states: []
    shape: cyclic
    transitions:
      - from: "(none)"
        to: PENDING
        trigger: "POST /members"
        actor: BoxOfficeManager
        preconditions: ["email not already used by a Member with status IN {PENDING, ACTIVE, LAPSED}"]
        side_effects: ["All computed standing fields initialise to PROSPECT / 0 / null"]
      - from: PENDING
        to: ACTIVE
        trigger: "POST /members/{id}/donations"
        actor: BoxOfficeManager
        preconditions:
          - "rolling_donation_cents after the donation >= TIER_BASIC_CENTS"
        side_effects:
          - "Runs member_standing: rolling_donation_cents, fiscal_ytd_donation_cents, rolling_tier, fiscal_tier, effective_tier, discount_pct, advance_access_hours, comp_tickets_granted, comp_tickets_remaining"
          - "expires_at := this donation's received_at + MEMBERSHIP_TERM_DAYS"
      - from: ACTIVE
        to: LAPSED
        trigger: "POST /membership-sweeps"
        actor: BoxOfficeManager
        preconditions: ["status == ACTIVE", "expires_at < clock (strict)"]
        side_effects:
          - "Recomputes member_standing at the sweep clock; discount_pct, advance_access_hours and comp_tickets_remaining are recomputed but retained fields are not zeroed"
      - from: LAPSED
        to: ACTIVE
        trigger: "POST /members/{id}/donations"
        actor: BoxOfficeManager
        preconditions:
          - "rolling_donation_cents after the donation >= TIER_BASIC_CENTS"
        side_effects:
          - "expires_at := this donation's received_at + MEMBERSHIP_TERM_DAYS; standing recomputed"
        note: "Cycle: a lapsed member renews by donating again."

  - entity: Settlement
    initial_state: DRAFT
    terminal_states: [PAID]
    shape: cyclic
    transitions:
      - from: "(none)"
        to: DRAFT
        trigger: "POST /settlements"
        actor: BoxOfficeManager
        preconditions:
          - "expected_booking_version == Booking.version (OCC)"
          - "Booking.status == CLOSED"
          - "No other Settlement on this booking with status IN {SUBMITTED, RECONCILED, PAID}"
        side_effects:
          - "Runs settlement_film_rent under the posted `variant` and stores every figure"
          - "min_run_penalty_cents := booking.min_run_penalty_cents"
          - "increments Booking.version by 1"
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /settlements/{id}/submit"
        actor: BoxOfficeManager
        preconditions:
          - "status IN {DRAFT, DISPUTED}"
          - "Booking.status == CLOSED (cross-entity guard)"
        side_effects: ["submitted_by_user_id := X-User-ID"]
      - from: DISPUTED
        to: SUBMITTED
        trigger: "POST /settlements/{id}/submit"
        actor: BoxOfficeManager
        preconditions: ["status IN {DRAFT, DISPUTED}"]
        side_effects: ["submitted_by_user_id := X-User-ID"]
        note: "Cycle: a disputed settlement is re-lodged after adjustment."
      - from: SUBMITTED
        to: RECONCILED
        trigger: "POST /settlements/{id}/finalize"
        actor: ExecutiveDirector
        preconditions: ["status == SUBMITTED"]
        side_effects:
          - "variant := FINAL and every figure is recomputed under the FINAL input set"
          - "finalized_by_user_id := X-User-ID"
      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /settlements/{id}/resolve with outcome=DISPUTED"
        actor: ExecutiveDirector
        preconditions: ["status IN {SUBMITTED, RECONCILED}"]
        side_effects: ["dispute_note := posted note"]
      - from: RECONCILED
        to: DISPUTED
        trigger: "POST /settlements/{id}/resolve with outcome=DISPUTED"
        actor: ExecutiveDirector
        preconditions: ["status IN {SUBMITTED, RECONCILED}"]
        side_effects: ["dispute_note := posted note"]
      - from: RECONCILED
        to: PAID
        trigger: "POST /settlements/{id}/resolve with outcome=PAID"
        actor: ExecutiveDirector
        preconditions: ["status == RECONCILED"]
        side_effects: ["None beyond the status flip; the figures are frozen"]

# =============================================================================
# 1.2.1 Concurrency Rules  (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: booking-counter-stale-version
    parent_entity: Booking
    write_endpoint: "POST /bookings/{id}/counter"
    occ_field: "expected_booking_version"
    description: |
      Lodging a counter round against a Booking whose version has advanced since the client last
      read it is rejected. A counter legitimately supersedes whatever PENDING offer it answers, so
      the operation is valid from both OFFERED and COUNTERED and a repeat call would otherwise
      succeed; the stale-version check is what tells the caller that the round it was answering has
      already been superseded by another counter.
    error_id: ERR_STALE_BOOKING_VERSION
    http_status: 412

  - rule_id: settlement-create-stale-booking
    parent_entity: Booking
    write_endpoint: "POST /settlements"
    occ_field: "expected_booking_version"
    description: |
      Creating a Settlement against a Booking whose version has advanced since the client last read
      it is rejected. A fresh DRAFT settlement legitimately supersedes an earlier DRAFT on the same
      booking, so the call would otherwise succeed on repeat; the stale-version check catches the
      caller whose view of the closed engagement (playing days, penalty) predates another writer's
      draft.
    error_id: ERR_STALE_BOOKING_VERSION
    http_status: 412

  - rule_id: showtime-create-stale-clearance
    parent_entity: RightsClearance
    write_endpoint: "POST /showtimes"
    occ_field: "expected_clearance_version"
    description: |
      Scheduling a Showtime against a RightsClearance whose version has advanced since the client
      last read it is rejected. Multiple screenings legitimately draw down the same clearance, so a
      repeat call succeeds under natural product semantics; the stale-version check catches the
      caller whose screenings_remaining figure predates another writer's draw-down or a cancellation
      restore.
    error_id: ERR_STALE_CLEARANCE_VERSION
    http_status: 412

  - rule_id: autoschedule-stale-clearance
    parent_entity: RightsClearance
    write_endpoint: "POST /showtimes/auto-schedule"
    occ_field: "expected_clearance_version"
    description: |
      The optimiser entry point carries the same stale-clearance guard as the manual scheduler: the
      slot search reads screenings_remaining and the day's existing occupancy, so a caller holding
      an out-of-date clearance version is rejected before a slot is minted.
    error_id: ERR_STALE_CLEARANCE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: ticket_order_pricing
    trigger: "POST /ticket-orders (the (none) -> RESERVED transition on TicketOrder)"
    algorithm: tiered_pricing
    formula: |
      # ---- STEP ORDER IS NORMATIVE. Rounding happens PER TICKET, BEFORE any summation. ----
      gross_unit_cents = showtime.base_price_cents + showtime.surcharge_cents
      paid_qty         = quantity - comp_quantity
      discount_pct     = (member_id is null) ? 0.00 : member.discount_pct     # member.discount_pct from member_standing
      unit_price_cents = round_half_up(gross_unit_cents * (1 - discount_pct)) # (b) PER-TICKET ROUNDING FIRST
      line_subtotal_cents  = unit_price_cents * paid_qty                      # then multiply
      facility_fee_cents   = FACILITY_FEE_CENTS_PER_TICKET * quantity         # comps pay the facility fee too
      order_before_credit  = line_subtotal_cents + facility_fee_cents
      applied_credit_cents = (apply_credit == true AND member_id is not null)
                             ? min(member.credit_balance_cents, order_before_credit)
                             : 0
      total_cents = order_before_credit - applied_credit_cents
      # FORBIDDEN alternative that this rule explicitly rules out:
      #   round_half_up(gross_unit_cents * paid_qty * (1 - discount_pct)) + facility_fee_cents
      #   e.g. base 1450, discount 0.15, qty 3 -> pinned 4149, forbidden 4148.
    input_set: |
      Exactly one Showtime (its base_price_cents and its surcharge_cents, which is non-zero only when a
      CONFIRMED SpecialEvent is attached) and at most one Member (its discount_pct and
      credit_balance_cents at request time). No other order on the showtime participates.
    constants:
      FACILITY_FEE_CENTS_PER_TICKET: 150
      MAX_TICKETS_PER_ORDER: 10
    precision: "integer cents throughout; round_half_up applied once, to unit_price_cents only"
    variants:
      - name: comp_seat_line
        when: "comp_quantity > 0"
        difference: "Comp seats are excluded from paid_qty (zero admission) but still counted in facility_fee_cents."
      - name: credit_redemption_line
        when: "apply_credit == true and member.credit_balance_cents > 0"
        difference: "applied_credit_cents caps at order_before_credit, so total_cents floors at 0 and never goes negative."

  - name: settlement_film_rent
    trigger: "POST /settlements (variant as posted) and POST /settlements/{id}/finalize (forced FINAL)"
    algorithm: forward_looking
    formula: |
      # ---- variant selects the INCLUSION SET; everything after that is shared arithmetic ----
      if variant == PROVISIONAL:
          included_showtimes = Showtime where booking_id == B and status IN {SCHEDULED, COMPLETED}
          included_orders    = TicketOrder on included_showtimes with status IN {RESERVED, PAID}
      else:  # FINAL
          included_showtimes = Showtime where booking_id == B and status == COMPLETED
          included_orders    = TicketOrder on included_showtimes with status == PAID

      box_office_cents        = sum(included_orders.total_cents)
      facility_fee_total_cents= sum(included_orders.facility_fee_cents)
      adjusted_gross_cents    = box_office_cents - facility_fee_total_cents
      playing_days            = count of DISTINCT venue-local calendar dates of included_showtimes.start_at
      proration_factor        = (playing_days == 0)
                                ? 0.0
                                : min(1.0, max(MIN_PRORATION_FLOOR, playing_days / booking.min_run_days))
      house_nut_applied_cents = round_half_up(booking.house_nut_cents * proration_factor)

      if booking.terms_variant == SLIDING_SCALE_90_10:
          film_rent_raw = round_half_up(SLIDING_SCALE_EXHIBITOR_SPLIT_COMPLEMENT
                                        * max(0, adjusted_gross_cents - house_nut_applied_cents))
      elif booking.terms_variant == PERCENTAGE_FLOOR:
          film_rent_raw = round_half_up(booking.distributor_share_pct * adjusted_gross_cents)
      else:  # FLAT_FEE
          film_rent_raw = booking.guarantee_cents

      film_rent_cents       = max(film_rent_raw, booking.guarantee_cents)   # guarantee is a FLOOR, never a cap
      cinema_retained_cents = adjusted_gross_cents + facility_fee_total_cents - film_rent_cents
    input_set: |
      (a) source entity: Showtime filtered by booking_id and by the variant's explicit status set, plus
      TicketOrder filtered by the variant's explicit status set; (b) window: the whole engagement, no date
      truncation - every included showtime counts regardless of engagement_end_date; (c) playing_days is a
      DISTINCT-date count so two showtimes on the same venue-local date contribute one day, and no
      tie-break is needed because the result is a set cardinality, not an ordering.
    constants:
      MIN_PRORATION_FLOOR: 0.60
      SLIDING_SCALE_EXHIBITOR_SPLIT_COMPLEMENT: 0.90
    precision: "integer cents; round_half_up applied to house_nut_applied_cents and film_rent_raw independently"
    variants:
      - name: provisional_forward_looking
        when: "POST /settlements with variant=PROVISIONAL - the box office's estimate at engagement close"
        difference: "Counts SCHEDULED showtimes and unpaid RESERVED holds, so both the gross AND the playing-day count are larger, which RAISES the prorated house nut and therefore LOWERS 90/10 film rent."
      - name: final_realised
        when: "POST /settlements/{id}/finalize - the figure actually remitted to the distributor"
        difference: "Counts only COMPLETED showtimes and PAID orders. Identical stored data yields a different film_rent_cents; with the canonical fixture PROVISIONAL=5332 and FINAL=4409."

  - name: member_standing
    trigger: "POST /members/{id}/donations, POST /membership-sweeps, and on read of GET /members/{id}"
    algorithm: threshold
    formula: |
      rolling_window_start   = clock - ROLLING_WINDOW_DAYS days
      rolling_donation_cents = sum(d.amount_cents for d in member.donations
                                   where rolling_window_start <= d.received_at <= clock)
      fiscal_ytd_donation_cents = sum(d.amount_cents for d in member.donations
                                   where FISCAL_YEAR_START <= d.received_at <= clock)

      tier_of(x) = DONOR_CIRCLE if x >= TIER_DONOR_CIRCLE_CENTS
                   else SUPPORTER if x >= TIER_SUPPORTER_CENTS
                   else BASIC     if x >= TIER_BASIC_CENTS
                   else PROSPECT
      rolling_tier   = tier_of(rolling_donation_cents)
      fiscal_tier    = tier_of(fiscal_ytd_donation_cents)
      effective_tier = the tier with the higher rank in
                       {PROSPECT:0, BASIC:1, SUPPORTER:2, DONOR_CIRCLE:3}
                       (ties resolve to the same value, so no tie-break is needed)

      discount_pct           = {PROSPECT:0.00, BASIC:0.10, SUPPORTER:0.15, DONOR_CIRCLE:0.25}[effective_tier]
      advance_access_hours   = {PROSPECT:0,    BASIC:24,   SUPPORTER:48,   DONOR_CIRCLE:168}[effective_tier]
      comp_tickets_granted   = {PROSPECT:0,    BASIC:0,    SUPPORTER:2,    DONOR_CIRCLE:6}[effective_tier]
      comp_tickets_remaining = comp_tickets_granted
                               - sum(o.comp_quantity for TicketOrder o of this member
                                     with status IN {RESERVED, PAID})
      expires_at = (member.donations is empty)
                   ? null
                   : max(d.received_at for d in member.donations) + MEMBERSHIP_TERM_DAYS days
    input_set: |
      (a) source: the member's own `donations` array only - donations are never shared between members;
      (b) windows: rolling is the half-open-at-neither-end inclusive range [clock - 365d, clock], fiscal is
      the inclusive range [FISCAL_YEAR_START, clock]; a donation stamped exactly at either boundary IS
      counted; (c) sums are order-insensitive so no tie-break applies.
    constants:
      ROLLING_WINDOW_DAYS: 365
      FISCAL_YEAR_START: "2026-07-01T00:00:00.000Z"
      TIER_BASIC_CENTS: 6000
      TIER_SUPPORTER_CENTS: 15000
      TIER_DONOR_CIRCLE_CENTS: 50000
      MEMBERSHIP_TERM_DAYS: 365
    precision: "integer cents; discount_pct is an exact 2-decimal constant, never rounded"
    variants:
      - name: rolling_12_month_standing
        when: "always computed into rolling_tier"
        difference: "Counts every donation in the trailing 365 days, including ones from the previous fiscal year."
      - name: fiscal_ytd_standing
        when: "always computed into fiscal_tier"
        difference: "Counts only donations on or after FISCAL_YEAR_START. Identical donation history yields a different tier - a 20000-cent gift on 2026-03-01 makes rolling_tier SUPPORTER while fiscal_tier is still PROSPECT, and an 8000-cent gift on 2026-07-15 makes fiscal_tier BASIC."

  - name: booking_min_run_compliance
    trigger: "POST /bookings/{id}/close (the CONFIRMED|RUNNING -> CLOSED transition)"
    algorithm: constraint_propagation
    formula: |
      # ---- (c) The dependency LOOKS circular: the penalty is priced off a daily nut that is priced
      #      off a prorated nut that is priced off the very day count that defines the shortfall.
      #      The evaluation order below is normative and makes the value well-defined. ----
      STEP 1: completed = Showtime where booking_id == B and status == COMPLETED
      STEP 2: actual_playing_days = count of DISTINCT venue-local dates of completed.start_at
      STEP 3: shortfall_days = max(0, booking.min_run_days - actual_playing_days)
      STEP 4: proration_factor = (actual_playing_days == 0)
                                 ? 0.0
                                 : min(1.0, max(MIN_PRORATION_FLOOR,
                                                actual_playing_days / booking.min_run_days))
      STEP 5: house_nut_applied_cents = round_half_up(booking.house_nut_cents * proration_factor)
      STEP 6: daily_nut_cents = (actual_playing_days == 0)
                                 ? round_half_up(booking.house_nut_cents / booking.min_run_days)
                                 : round_half_up(house_nut_applied_cents / actual_playing_days)
      STEP 7: min_run_penalty_cents = round_half_up(shortfall_days * daily_nut_cents * MIN_RUN_PENALTY_RATE)
      STEP 8: min_run_compliant = (shortfall_days == 0)
      # FORBIDDEN shortcut: daily_nut_cents = round_half_up(house_nut_cents / min_run_days).
      # It agrees with STEP 6 whenever the floor is not binding, and DISAGREES exactly when it is:
      # nut 12500, min_run_days 4, actual 1 -> pinned 11250, forbidden 4688.
    input_set: |
      (a) source: Showtime rows with booking_id == B and status == COMPLETED only - SCHEDULED and
      CANCELLED showtimes are excluded even when they fall inside the engagement window; (b) window: the
      whole engagement, inclusive of engagement_start_date and engagement_end_date; (c) DISTINCT-date
      cardinality, so ordering and ties are irrelevant.
    constants:
      MIN_RUN_PENALTY_RATE: 0.50
      MIN_PRORATION_FLOOR: 0.60
    precision: "integer cents; round_half_up applied independently at STEP 5, STEP 6 and STEP 7"

  - name: screen_slot_block
    trigger: "POST /showtimes, POST /showtimes/auto-schedule, POST /special-events/{id}/confirm"
    algorithm: interval_merge
    formula: |
      content_minutes = venue.trailer_reel_minutes + title.runtime_minutes + showtime.extra_minutes
      end_at          = start_at + content_minutes
      blocked_until   = end_at + venue.turnaround_minutes          # asymmetric buffer: tail only
      occupancy(S)    = HALF-OPEN interval [S.start_at, S.blocked_until)

      collides(candidate) = EXISTS S2 with S2.venue_id == candidate.venue_id
                            AND S2.id != candidate.id
                            AND S2.status != CANCELLED
                            AND candidate.start_at < S2.blocked_until
                            AND S2.start_at < candidate.blocked_until
      # Half-open geometry: candidate.start_at == S2.blocked_until is LEGAL back-to-back programming.
      # The buffer is applied to the TAIL only, so a candidate ending exactly at S2.start_at is legal
      # ONLY if candidate.blocked_until <= S2.start_at (i.e. the turnaround also fits).
    input_set: |
      (a) source: every Showtime with the same venue_id and status IN {SCHEDULED, COMPLETED} (i.e. status
      != CANCELLED); (b) no date window - the comparison is instant-based, so a block spilling past
      midnight still collides with the next day's first show; (c) existence test, no ordering, no tie-break.
    constants: {}
    precision: "whole minutes; all instants stored as ISO 8601 UTC with three fractional digits"

  - name: kdm_coverage_and_window_overlap
    trigger: "POST /kdm-keys (overlap branch) and POST /showtimes/{id}/verify-playback (coverage branch)"
    algorithm: interval_merge
    formula: |
      # ---- COVERAGE (evaluated at verify-playback) ----
      covers(K, S) = K.dcp_asset_id == S.dcp_asset_id
                     AND K.venue_id == S.venue_id
                     AND K.status == ISSUED
                     AND K.valid_from  <= S.start_at
                     AND K.valid_until >= S.end_at        # >= : a key expiring EXACTLY at end_at covers.
      # Note the asymmetry with screen_slot_block: coverage is measured against end_at, NOT
      # blocked_until - the projector is idle during turnaround, so the key need not span it.

      # ---- WINDOW OVERLAP (evaluated at key issue) ----
      validity(K) = CLOSED interval [K.valid_from, K.valid_until]
      overlaps(candidate) = EXISTS K2 with K2.dcp_asset_id == candidate.dcp_asset_id
                            AND K2.venue_id == candidate.venue_id
                            AND K2.status == ISSUED
                            AND candidate.valid_from <= K2.valid_until
                            AND K2.valid_from <= candidate.valid_until
      # CLOSED geometry: candidate.valid_from == K2.valid_until IS an overlap. Two keys for one
      # package must be strictly disjoint, unlike two showtimes which may touch.
    input_set: |
      (a) source: KdmKey rows with status == ISSUED only (EXPIRED and REVOKED keys neither cover nor
      block); (b) window: the candidate's own closed interval; (c) existence test, no ordering.
    constants: {}
    precision: "instant comparison at millisecond resolution"

  - name: ingest_lane_capacity
    trigger: "POST /dcp-assets"
    algorithm: aggregation
    formula: |
      occupying_statuses = {REQUESTED, IN_TRANSIT, RECEIVED, INGESTING}   # INGESTED/RETURNED release the lane
      window(A) = CLOSED interval [A.ingest_window_start_at, A.ingest_window_end_at]

      boundary_instants = { candidate.ingest_window_start_at, candidate.ingest_window_end_at }
                          UNION { A.ingest_window_start_at for existing A }
                          UNION { A.ingest_window_end_at   for existing A }
      evaluated_instants = boundary_instants restricted to window(candidate)   # inclusive of both ends

      concurrency(t) = 1 + count(existing A at candidate.venue_id
                                 with A.status IN occupying_statuses
                                 AND A.ingest_window_start_at <= t <= A.ingest_window_end_at)
      reject iff max(concurrency(t) for t in evaluated_instants) > venue.dcp_ingest_lane_count
      # Aggregate-capacity geometry: overlap alone is NOT an error - only the (lane_count + 1)-th
      # concurrent window is. Endpoints are inclusive, so a window starting exactly when another ends
      # still counts as concurrent at that instant.
    input_set: |
      (a) source: DcpAsset rows with the same venue_id and status IN {REQUESTED, IN_TRANSIT, RECEIVED,
      INGESTING}; (b) window: closed on both ends; (c) the sweep evaluates only interval endpoints inside
      the candidate window, which is sufficient because concurrency is piecewise-constant between them -
      no ordering-dependent tie-break exists.
    constants: {}
    precision: "instant comparison at millisecond resolution; concurrency is an integer count"

  - name: slot_ranking_score
    trigger: "POST /showtimes/auto-schedule"
    algorithm: weighted_scoring
    formula: |
      # ---- (a) three-plus inputs with nested min/max and conditional branches ----
      candidate_grid = every instant from target_date + earliest_local_time to
                       target_date + latest_local_time in SLOT_GRANULARITY_MINUTES steps, inclusive
      eligible(slot) = venue-local time of slot BETWEEN venue.open_local_time AND venue.last_start_local_time
                       AND NOT collides(slot)                    # screen_slot_block geometry
                       AND weekly_programming_balance admits it
                       AND clearance.screenings_remaining >= 1
                       AND venue-local date of slot inside BOTH [clearance.window_start_date, clearance.window_end_date]
                          AND [booking.engagement_start_date, booking.engagement_end_date]

      gap_before_minutes = same-day non-CANCELLED showtimes with blocked_until <= slot.start_at exist
                           ? min(GAP_CAP_MINUTES, whole_minutes(slot.start_at - max(those blocked_until)))
                           : GAP_CAP_MINUTES
      gap_after_minutes  = same-day non-CANCELLED showtimes with start_at >= slot.blocked_until exist
                           ? min(GAP_CAP_MINUTES, whole_minutes(min(those start_at) - slot.blocked_until))
                           : GAP_CAP_MINUTES

      prime_component = 60 if PRIME_START_LOCAL <= local_time(slot) <= PRIME_END_LOCAL
                        else 35 if SHOULDER_START_LOCAL <= local_time(slot) < PRIME_START_LOCAL
                        else 10
      spacing_component = min(SPACING_CAP, (gap_before_minutes // SLOT_GRANULARITY_MINUTES) * 2)
                        + min(SPACING_CAP, (gap_after_minutes  // SLOT_GRANULARITY_MINUTES) * 2)
      fragmentation_penalty = (0 < gap_before_minutes < venue.min_useful_gap_minutes ? 15 : 0)
                            + (0 < gap_after_minutes  < venue.min_useful_gap_minutes ? 15 : 0)
      strand_bonus = (strand == REPERTORY_SERIES
                      AND repertory count of that ISO week (excluding the candidate)
                          < venue.weekly_repertory_target) ? 10 : 0

      slot_score(slot) = prime_component + spacing_component - fragmentation_penalty + strand_bonus

      # ---- SELECTOR (all four elements pinned) ----
      # eligibility filter : eligible(slot) above
      # ranking expression : slot_score DESC
      # tie-break          : earliest slot.start_at ASC (grid instants are unique, so this always resolves)
      # empty-pool fallback: reject the request with ERR_NO_ELIGIBLE_SLOT (422); nothing is created
    input_set: |
      (a) source: Showtime rows at the same venue_id with status != CANCELLED whose venue-local date equals
      target_date (for the gap terms) plus the whole ISO week (for strand_bonus and the balance filter);
      (b) window: the grid is inclusive of both earliest_local_time and latest_local_time; (c) tie-break is
      earliest start_at ASC - never `id`, never insertion order.
    constants:
      SLOT_GRANULARITY_MINUTES: 15
      GAP_CAP_MINUTES: 120
      SPACING_CAP: 12
      PRIME_START_LOCAL: "18:00"
      PRIME_END_LOCAL: "21:00"
      SHOULDER_START_LOCAL: "15:00"
    precision: "integer score; gaps floored to whole minutes before integer division"

  - name: showtime_box_office_rollup
    trigger: "POST /ticket-orders, POST /ticket-orders/{id}/pay, POST /ticket-orders/{id}/refund, POST /showtimes/{id}/close-sales, POST /showtimes/{id}/cancel, POST /showtimes/{id}/complete"
    algorithm: aggregation
    formula: |
      seats_sold       = sum(o.quantity     for TicketOrder o on S with o.status IN {RESERVED, PAID})
      seats_available  = venue.seat_capacity - venue.house_hold_seats - seats_sold        # never < 0
      gross_cents      = sum(o.total_cents  for TicketOrder o on S with o.status == PAID)
      admissions_count = sum(o.quantity     for TicketOrder o on S with o.status == PAID)
      # Conservation invariant (must hold after EVERY mutation, including cascades):
      #   seats_sold + seats_available + venue.house_hold_seats == venue.seat_capacity
      # Auto sale_status: ON_SALE -> SOLD_OUT the moment seats_available == 0;
      #                   SOLD_OUT -> ON_SALE the moment seats_available >= 1 again.
    input_set: |
      (a) source: TicketOrder rows with showtime_id == S, filtered by the explicit status sets above -
      VOID and REFUNDED orders contribute to nothing; (b) no time window; (c) sums are order-insensitive.
    constants: {}
    precision: "integer seats and integer cents; full recompute from orders on every mutation, never incremental drift"

  - name: clearance_screening_allowance
    trigger: "POST /showtimes, POST /showtimes/auto-schedule, POST /showtimes/{id}/cancel, and every cancellation cascade"
    algorithm: aggregation
    formula: |
      screenings_used      = count(Showtime where clearance_id == C and status IN {SCHEDULED, COMPLETED})
      screenings_remaining = C.max_screenings - screenings_used
      # Conservation invariant: screenings_used + screenings_remaining == C.max_screenings, always.
      # Gate: a new showtime is refused when screenings_remaining == 0 (so remaining == 1 still admits one).
    input_set: |
      (a) source: Showtime rows with clearance_id == C and status IN {SCHEDULED, COMPLETED} - CANCELLED
      showtimes release their allowance; (b) no time window - the licence ceiling spans the whole clearance
      window; (c) cardinality only.
    constants: {}
    precision: "integer counts; recomputed from Showtime rows, never decremented blindly"

  - name: weekly_programming_balance
    trigger: "POST /showtimes and POST /showtimes/auto-schedule (eligibility filter)"
    algorithm: threshold
    formula: |
      iso_week(S) = the Monday 00:00:00.000 .. Sunday 23:59:59.999 venue-local span containing S.start_at
      week_rows        = Showtime at the same venue_id, status != CANCELLED, start_at inside iso_week(candidate)
      total_after      = count(week_rows) + 1
      first_run_after  = count(week_rows where strand == FIRST_RUN) + (candidate.strand == FIRST_RUN ? 1 : 0)
      reject iff first_run_after > ceil(total_after * venue.max_first_run_share)
      # With max_first_run_share 0.60: 1 of 1 ok (ceil(0.6)=1), 2 of 2 ok (ceil(1.2)=2),
      # 3 of 3 rejected (ceil(1.8)=2). The ceiling makes the exact boundary observable.
      repertory_count_of_week = count(week_rows where strand == REPERTORY_SERIES)   # feeds slot_ranking_score
    input_set: |
      (a) source: Showtime rows at the same venue_id with status IN {SCHEDULED, COMPLETED}; (b) window: the
      venue-local ISO week, Monday-inclusive to Sunday-inclusive; (c) counts only, no ordering.
    constants: {}
    precision: "integer counts; ceil applied to the product, never to the share"

# =============================================================================
# 1.4 Validation Rules Table (evaluated in strictly ascending priority order;
#     the FIRST violated rule wins and no later rule is evaluated)
# =============================================================================
validations:

  # ---- 1..5 : the universal ladder, applied to every request ----
  - priority: 1
    rule: "The X-Role header is present and names a role declared in §1.7 (Anonymous is supplied by omitting X-Role, which is legal only on endpoints that list Anonymous)."
    error_id: ERR_UNAUTHENTICATED
    category: auth
    applies_to: "every endpoint"

  - priority: 2
    rule: "The supplied role appears in the target endpoint's `roles` list. For endpoints under segregation of duties the header X-User-ID must also be present."
    error_id: ERR_FORBIDDEN_ROLE
    category: authz
    applies_to: "every endpoint"

  - priority: 3
    rule: "Body parses as JSON, every required field is present and non-null, every field has the declared type, every enum value is a declared member, every timestamp is ISO 8601 UTC, every *_cents and *_minutes and *_days and quantity is a non-negative integer, and quantity is between 1 and MAX_TICKETS_PER_ORDER inclusive."
    error_id: ERR_INVALID_REQUEST
    category: schema
    applies_to: "every write endpoint"

  - priority: 4
    rule: "Every id in the path and every FK in the payload resolves to an existing row of the declared entity type."
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    category: existence
    applies_to: "every endpoint carrying a path id or an FK"

  - priority: 5
    rule: "When the endpoint declares an OCC field in §1.2.1, the supplied expected_<parent>_version equals the referenced parent's current `version`."
    error_id: "the concurrency rule's declared error_id"
    category: concurrency
    applies_to: "POST /bookings/{id}/counter, POST /showtimes, POST /showtimes/auto-schedule, POST /settlements"

  # ---- 6 : state ----
  - priority: 6
    rule: "The target entity is in a state from which the requested transition is declared in §1.2; a terminal state admits nothing. Includes: booking not OFFERED/COUNTERED on counter; offer not PENDING on accept; clearance not SUBMITTED on clear; asset transition not the declared next step; key not ISSUED on revoke; showtime.sale_status not ON_SALE/SOLD_OUT when ordering; showtime.status != SCHEDULED on complete/cancel; order not RESERVED on pay; order not PAID on refund; settlement not DRAFT on submit."
    error_id: "ERR_<ENTITY>_INVALID_STATE"
    category: state
    applies_to: "every transition endpoint"

  # ---- 7 : rights + technical safety (must outrank scheduling) ----
  - priority: 7
    rule: "A showtime may only be created for a title whose RightsClearance is in state CLEARED. A clearance in SUBMITTED, CHANGES_REQUESTED, EXPIRED, DENIED or REVOKED cannot carry a screening."
    error_id: ERR_CLEARANCE_NOT_CLEARED
    category: business_safety
    applies_to: "POST /showtimes, POST /showtimes/auto-schedule"

  - priority: 8
    rule: "The showtime's venue-local date lies inside the clearance's licence window [window_start_date, window_end_date] (both ends inclusive)."
    error_id: ERR_CLEARANCE_WINDOW_NOT_COVERED
    category: business_safety
    applies_to: "POST /showtimes, POST /showtimes/auto-schedule"

  - priority: 9
    rule: "clearance_screening_allowance.screenings_remaining >= 1 for the referenced clearance."
    error_id: ERR_SCREENING_ALLOWANCE_EXHAUSTED
    category: business_safety
    applies_to: "POST /showtimes, POST /showtimes/auto-schedule"

  - priority: 10
    rule: "Projection formats agree all the way down the chain: showtime.format is a member of venue.supported_formats, showtime.format == dcp_asset.format, and showtime.format == clearance.source_format. On POST /dcp-assets the asset's own format must be a member of venue.supported_formats."
    error_id: ERR_FORMAT_INCOMPATIBLE
    category: business_safety
    applies_to: "POST /showtimes, POST /showtimes/auto-schedule, POST /dcp-assets"

  - priority: 11
    rule: "On POST /showtimes/{id}/verify-playback the referenced DcpAsset is in state INGESTED, and on POST /showtimes/{id}/open-sales the owning Booking is in state CONFIRMED or RUNNING."
    error_id: ERR_DEPENDENCY_STATE_INVALID
    category: business_safety
    applies_to: "POST /showtimes/{id}/verify-playback, POST /showtimes/{id}/open-sales"

  - priority: 12
    rule: "On POST /showtimes/{id}/verify-playback there exists an ISSUED KdmKey satisfying kdm_coverage_and_window_overlap.covers(K, S), i.e. K.valid_from <= S.start_at AND K.valid_until >= S.end_at."
    error_id: ERR_NO_COVERING_KDM
    category: business_safety
    applies_to: "POST /showtimes/{id}/verify-playback"

  - priority: 13
    rule: "The acting X-User-ID differs from clearance.submitted_by_user_id: the person who lodged a rights clearance cannot be the person who clears it."
    error_id: ERR_SEGREGATION_OF_DUTIES
    category: business_safety
    applies_to: "POST /clearances/{id}/clear"

  # ---- 14..17 : temporal / resource geometry ----
  - priority: 14
    rule: "The showtime's screen block does not collide with another non-CANCELLED showtime at the same venue under screen_slot_block's half-open geometry [start_at, blocked_until)."
    error_id: ERR_SCREEN_SLOT_CONFLICT
    category: business_temporal
    applies_to: "POST /showtimes, POST /showtimes/auto-schedule, POST /special-events/{id}/confirm"

  - priority: 15
    rule: "A new KdmKey's closed validity interval [valid_from, valid_until] is strictly disjoint from every other ISSUED key for the same (dcp_asset_id, venue_id) pair, and valid_from < valid_until."
    error_id: ERR_KDM_WINDOW_OVERLAP
    category: business_temporal
    applies_to: "POST /kdm-keys"

  - priority: 16
    rule: "Admitting the new DcpAsset's closed ingest window does not push concurrency past venue.dcp_ingest_lane_count at any evaluated instant (ingest_lane_capacity)."
    error_id: ERR_INGEST_LANE_CAPACITY_EXCEEDED
    category: business_temporal
    applies_to: "POST /dcp-assets"

  - priority: 17
    rule: "The showtime's venue-local start time lies inside [venue.open_local_time, venue.last_start_local_time], its venue-local date lies inside the booking's [engagement_start_date, engagement_end_date] (both ends inclusive), and its start_at is not earlier than the clock."
    error_id: ERR_SHOWTIME_WINDOW_INVALID
    category: business_temporal
    applies_to: "POST /showtimes, POST /showtimes/auto-schedule"

  - priority: 18
    rule: "A member's advance-access privilege is respected: when showtime.public_sale_opens_at is later than the clock, an order is admitted only if the member's advance window has opened, i.e. clock >= public_sale_opens_at - member.advance_access_hours. Anonymous and PROSPECT buyers have a zero-hour window."
    error_id: ERR_ADVANCE_ACCESS_NOT_OPEN
    category: business_temporal
    applies_to: "POST /ticket-orders"

  # ---- 19..24 : constraint / referential ----
  - priority: 19
    rule: "The requested seats fit: quantity <= showtime_box_office_rollup.seats_available."
    error_id: ERR_INSUFFICIENT_SEATS
    category: business_constraint
    applies_to: "POST /ticket-orders"

  - priority: 20
    rule: "comp_quantity <= quantity and comp_quantity <= member.comp_tickets_remaining; a non-member order must carry comp_quantity == 0."
    error_id: ERR_COMP_ALLOWANCE_EXCEEDED
    category: business_constraint
    applies_to: "POST /ticket-orders"

  - priority: 21
    rule: "booking.round_count < MAX_NEGOTIATION_ROUNDS before a counter is lodged: the fourth round is the last one that may be recorded, so a counter attempted at round 4 is refused."
    error_id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED
    category: business_constraint
    applies_to: "POST /bookings/{id}/counter"

  - priority: 22
    rule: "Adding this showtime keeps the venue's ISO-week first-run share inside its ceiling (weekly_programming_balance)."
    error_id: ERR_WEEKLY_BALANCE_EXCEEDED
    category: business_constraint
    applies_to: "POST /showtimes, POST /showtimes/auto-schedule"

  - priority: 23
    rule: "The candidate pool for POST /showtimes/auto-schedule is non-empty after the eligibility filter of slot_ranking_score."
    error_id: ERR_NO_ELIGIBLE_SLOT
    category: business_constraint
    applies_to: "POST /showtimes/auto-schedule"

  - priority: 24
    rule: "Referenced rows agree with one another: clearance.title_id == booking.title_id == showtime.title_id; dcp_asset.title_id == showtime.title_id; showtime.venue_id == booking.venue_id == dcp_asset.venue_id; kdm_key.venue_id == showtime.venue_id; settlement.booking_id matches the booking whose showtimes are being settled."
    error_id: ERR_REFERENCE_MISMATCH
    category: business_referential
    applies_to: "POST /showtimes, POST /showtimes/auto-schedule, POST /kdm-keys, POST /clearances, POST /settlements, POST /ticket-orders"

  # ---- 25..27 : fiscal ----
  - priority: 25
    rule: "Sales are open: showtime.sale_status is ON_SALE (or SOLD_OUT, which still rejects at priority 19 for lack of seats). A showtime in DRAFT or SALES_CLOSED accepts no orders."
    error_id: ERR_SHOWTIME_SALES_CLOSED
    category: business_fiscal
    applies_to: "POST /ticket-orders"

  - priority: 26
    rule: "A settlement may only be created for a Booking in state CLOSED, and at most one non-VOID settlement may exist per booking per variant."
    error_id: ERR_SETTLEMENT_NOT_PERMITTED
    category: business_fiscal
    applies_to: "POST /settlements"

  - priority: 27
    rule: "Credit redemption is honest: apply_credit is only accepted with a member_id, and applied_credit_cents never exceeds the member's credit_balance_cents at request time."
    error_id: ERR_CREDIT_BALANCE_INSUFFICIENT
    category: business_fiscal
    applies_to: "POST /ticket-orders"

  - priority: 28
    rule: "The offer being accepted is still live: the logical clock is not past the PENDING BookingOffer's expires_at (created_at + OFFER_VALIDITY_HOURS). The offer is moved to EXPIRED and the confirmation refused."
    error_id: ERR_OFFER_EXPIRED
    category: business_temporal
    applies_to: "POST /bookings/{id}/confirm"

  - priority: 29
    rule: "The accepted offer's proposed_house_nut_cents does not exceed venue.base_house_nut_weekly_cents: no engagement may be confirmed above the board-approved weekly house-nut cap."
    error_id: ERR_HOUSE_NUT_ABOVE_CAP
    category: business_fiscal
    applies_to: "POST /bookings/{id}/confirm"

  - priority: 30
    rule: "When the counterparty Distributor has requires_advance_guarantee == true, the booking's guarantee_cents (and every proposed_guarantee_cents lodged against it) must be strictly greater than zero."
    error_id: ERR_GUARANTEE_REQUIRED
    category: business_fiscal
    applies_to: "POST /bookings, POST /bookings/{id}/counter, POST /bookings/{id}/offer"

  - priority: 31
    rule: "A member's email is unique across members whose status is not LAPSED-and-purged; a second POST /members with an email already held by a PENDING or ACTIVE member is refused."
    error_id: ERR_MEMBER_EMAIL_TAKEN
    category: business_constraint
    applies_to: "POST /members"

# =============================================================================
# 1.5 API Endpoint Table
#   api_prefix is "/", so every path below is rooted (flat entity_topology).
#   Headers on every call: X-Role (omit for Anonymous), X-User-ID (opaque
#   operator identity; required wherever segregation of duties applies).
# =============================================================================
endpoints:

  # ---------------------------------------------------------------- Venue ----
  - method: POST
    path: "/venues"
    description: "Register the auditorium and its booth/scheduling parameters."
    roles: [ExecutiveDirector]
    code: 201
    input: [name, seat_capacity, trailer_reel_minutes, turnaround_minutes, dcp_ingest_lane_count, open_local_time, last_start_local_time, supported_formats, "house_hold_seats?", "min_useful_gap_minutes?", "utc_offset_minutes?", "max_first_run_share?", "weekly_repertory_target?", "base_house_nut_weekly_cents?"]
    output: Venue
    side_effects: []

  - method: GET
    path: "/venues/{id}"
    description: "Read one venue."
    roles: [Programmer, RightsManager, TechnicalManager, BoxOfficeManager, ExecutiveDirector, Member, Anonymous]
    code: 200
    output: Venue
    side_effects: []

  # ---------------------------------------------------------- Distributor ----
  - method: POST
    path: "/distributors"
    description: "Register a distributor or licensor with its default booking terms."
    roles: [Programmer, ExecutiveDirector]
    code: 201
    input: [name, contact_email, default_terms_variant, default_min_run_days, default_distributor_share_pct, requires_advance_guarantee]
    output: Distributor
    side_effects: []

  - method: GET
    path: "/distributors/{id}"
    description: "Read one distributor."
    roles: [Programmer, RightsManager, BoxOfficeManager, ExecutiveDirector]
    code: 200
    output: Distributor
    side_effects: []

  # ---------------------------------------------------------------- Title ----
  - method: POST
    path: "/titles"
    description: "Catalogue a film title (first-run or repertory)."
    roles: [Programmer, ExecutiveDirector]
    code: 201
    input: [title_name, release_year, runtime_minutes, is_first_run, native_format, rights_holder_distributor_id]
    output: Title
    side_effects: []

  - method: GET
    path: "/titles/{id}"
    description: "Read one title."
    roles: [Programmer, RightsManager, TechnicalManager, BoxOfficeManager, ExecutiveDirector, Member, Anonymous]
    code: 200
    output: Title
    side_effects: []

  - method: GET
    path: "/titles"
    description: "List titles, optionally narrowed to one rights holder or to first-run only. Reverse-reachability for Title.rights_holder_distributor_id."
    roles: [Programmer, RightsManager, TechnicalManager, BoxOfficeManager, ExecutiveDirector, Member, Anonymous]
    code: 200
    input: ["rights_holder_distributor_id?", "is_first_run?", "limit?", "offset?"]
    output: Title[]
    side_effects: []

  # -------------------------------------------------------------- Booking ----
  - method: POST
    path: "/bookings"
    description: "Open an engagement negotiation. The booking is created directly in OFFERED and negotiation round 1 is lodged as a BookingOffer with proposed_by=CINEMA."
    roles: [Programmer]
    code: 201
    input: [title_id, distributor_id, venue_id, terms_variant, house_nut_cents, distributor_share_pct, guarantee_cents, min_run_days, engagement_start_date, engagement_end_date, "supersedes_booking_id?"]
    output: Booking
    side_effects:
      - "creates BookingOffer round 1 in PENDING with proposed_* mirroring the booking's opening terms and expires_at = created_at + OFFER_VALIDITY_HOURS"
      - "sets round_count = 1"
      - "records created_by_user_id from X-User-ID"
      - "when supersedes_booking_id is supplied, requires that booking to be WITHDRAWN"

  - method: GET
    path: "/bookings/{id}"
    description: "Read one booking with its computed negotiation and compliance fields."
    roles: [Programmer, RightsManager, TechnicalManager, BoxOfficeManager, ExecutiveDirector]
    code: 200
    output: Booking
    side_effects: []

  - method: GET
    path: "/bookings"
    description: "List bookings with FK and status filters. Reverse-reachability for Booking.title_id, Booking.distributor_id, Booking.venue_id and the self-reference Booking.supersedes_booking_id."
    roles: [Programmer, RightsManager, TechnicalManager, BoxOfficeManager, ExecutiveDirector]
    code: 200
    input: ["title_id?", "distributor_id?", "venue_id?", "supersedes_booking_id?", "status?", "limit?", "offset?"]
    output: Booking[]
    side_effects: []

  - method: GET
    path: "/bookings/{id}/offers"
    description: "List the negotiation rounds lodged against this booking, oldest first. Reverse-reachability for BookingOffer.booking_id."
    roles: [Programmer, ExecutiveDirector]
    code: 200
    input: ["limit?", "offset?"]
    output: BookingOffer[]
    side_effects: []

  - method: POST
    path: "/bookings/{id}/counter"
    description: "Record the distributor's counter-proposal as the next negotiation round. Carries the OCC guard expected_booking_version."
    roles: [Programmer]
    code: 201
    input: [expected_booking_version, proposed_house_nut_cents, proposed_distributor_share_pct, proposed_min_run_days, proposed_guarantee_cents]
    output: BookingOffer
    side_effects:
      - "supersedes the PENDING offer: it moves to COUNTERED"
      - "creates a new BookingOffer in PENDING with proposed_by=DISTRIBUTOR and round_index = round_count + 1"
      - "increments Booking.round_count by 1"
      - "moves Booking OFFERED -> COUNTERED, or COUNTERED -> COUNTERED (self-loop)"
      - "increments Booking.version by 1"

  - method: POST
    path: "/bookings/{id}/offer"
    description: "Answer a counter with a fresh cinema offer, returning the booking to OFFERED."
    roles: [Programmer]
    code: 201
    input: [proposed_house_nut_cents, proposed_distributor_share_pct, proposed_min_run_days, proposed_guarantee_cents]
    output: BookingOffer
    side_effects:
      - "supersedes the PENDING offer: it moves to COUNTERED"
      - "creates a new BookingOffer in PENDING with proposed_by=CINEMA and round_index = round_count + 1"
      - "increments Booking.round_count by 1"
      - "moves Booking COUNTERED -> OFFERED"
      - "increments Booking.version by 1"

  - method: POST
    path: "/bookings/{id}/confirm"
    description: "Accept the currently PENDING offer and confirm the engagement."
    roles: [ExecutiveDirector]
    code: 200
    input: []
    output: Booking
    side_effects:
      - "moves the PENDING BookingOffer to ACCEPTED, or to EXPIRED and rejects when the clock is past its expires_at"
      - "overwrites booking.house_nut_cents, distributor_share_pct, min_run_days and guarantee_cents from the accepted offer"
      - "moves Booking OFFERED|COUNTERED -> CONFIRMED"
      - "records confirmed_by_user_id from X-User-ID"

  - method: POST
    path: "/bookings/{id}/close"
    description: "Close the engagement and price the minimum-run shortfall via booking_min_run_compliance."
    roles: [ExecutiveDirector]
    code: 200
    input: []
    output: Booking
    side_effects:
      - "computes actual_playing_days, min_run_compliant and min_run_penalty_cents"
      - "moves Booking CONFIRMED|RUNNING -> CLOSED"

  - method: POST
    path: "/bookings/{id}/withdraw"
    description: "Withdraw the engagement and unwind everything downstream of it."
    roles: [ExecutiveDirector]
    code: 200
    input: [cancel_reason]
    output: Booking
    side_effects:
      - "moves Booking -> WITHDRAWN and the PENDING BookingOffer -> REJECTED"
      - "cancels every SCHEDULED Showtime on the booking with cancel_reason propagated"
      - "voids RESERVED and refunds PAID TicketOrders on those showtimes, crediting member credit_balance_cents"
      - "recomputes each affected clearance's screenings_used / screenings_remaining"

  # ------------------------------------------------------- RightsClearance ----
  - method: POST
    path: "/clearances"
    description: "Lodge a repertory rights clearance against an engagement; created directly in SUBMITTED."
    roles: [RightsManager]
    code: 201
    input: [title_id, booking_id, licensor_name, license_fee_cents, territory, window_start_date, window_end_date, max_screenings, source_format]
    output: RightsClearance
    side_effects:
      - "records submitted_by_user_id from X-User-ID (the segregation-of-duties subject)"
      - "sets screenings_used = 0 and screenings_remaining = max_screenings"

  - method: GET
    path: "/clearances/{id}"
    description: "Read one clearance with its live screening allowance."
    roles: [Programmer, RightsManager, TechnicalManager, ExecutiveDirector]
    code: 200
    output: RightsClearance
    side_effects: []

  - method: GET
    path: "/clearances"
    description: "List clearances by title or engagement. Reverse-reachability for RightsClearance.title_id and RightsClearance.booking_id."
    roles: [Programmer, RightsManager, TechnicalManager, ExecutiveDirector]
    code: 200
    input: ["title_id?", "booking_id?", "status?", "limit?", "offset?"]
    output: RightsClearance[]
    side_effects: []

  - method: POST
    path: "/clearances/{id}/submit"
    description: "Re-lodge a clearance after the licensor answered a change request."
    roles: [RightsManager]
    code: 200
    input: []
    output: RightsClearance
    side_effects:
      - "moves RightsClearance CHANGES_REQUESTED -> SUBMITTED"
      - "overwrites submitted_by_user_id with the acting X-User-ID"

  - method: POST
    path: "/clearances/{id}/clear"
    description: "Clear the licence for exhibition. Segregation of duties: the acting X-User-ID must differ from submitted_by_user_id."
    roles: [RightsManager, ExecutiveDirector]
    code: 200
    input: []
    output: RightsClearance
    side_effects:
      - "moves RightsClearance SUBMITTED -> CLEARED"
      - "records cleared_by_user_id from X-User-ID"

  - method: POST
    path: "/clearances/{id}/request-changes"
    description: "Send the clearance back for licensor amendment."
    roles: [RightsManager, ExecutiveDirector]
    code: 200
    input: [change_request_note]
    output: RightsClearance
    side_effects:
      - "moves RightsClearance SUBMITTED -> CHANGES_REQUESTED"

  - method: POST
    path: "/clearances/{id}/revoke"
    description: "Revoke the licence; every screening standing on it collapses."
    roles: [RightsManager, ExecutiveDirector]
    code: 200
    input: [revoked_reason]
    output: RightsClearance
    side_effects:
      - "moves RightsClearance SUBMITTED|CHANGES_REQUESTED|CLEARED -> REVOKED"
      - "cancels every SCHEDULED Showtime on this clearance"
      - "voids RESERVED and refunds PAID TicketOrders on those showtimes, crediting member credit_balance_cents"
      - "recomputes screenings_used and screenings_remaining"

  # ------------------------------------------------------------- DcpAsset ----
  - method: POST
    path: "/dcp-assets"
    description: "Book an inbound print or digital cinema package and its server ingest window."
    roles: [TechnicalManager]
    code: 201
    input: [title_id, source_distributor_id, venue_id, format, is_encrypted, carrier_ref, ingest_window_start_at, ingest_window_end_at]
    output: DcpAsset
    side_effects:
      - "evaluates ingest_lane_capacity against every occupying asset at the venue"
      - "creates the asset in REQUESTED"

  - method: GET
    path: "/dcp-assets/{id}"
    description: "Read one print-traffic record."
    roles: [Programmer, TechnicalManager, ExecutiveDirector]
    code: 200
    output: DcpAsset
    side_effects: []

  - method: GET
    path: "/dcp-assets"
    description: "List assets by title, shipper or destination venue. Reverse-reachability for DcpAsset.title_id, DcpAsset.source_distributor_id and DcpAsset.venue_id."
    roles: [Programmer, TechnicalManager, ExecutiveDirector]
    code: 200
    input: ["title_id?", "source_distributor_id?", "venue_id?", "status?", "limit?", "offset?"]
    output: DcpAsset[]
    side_effects: []

  - method: POST
    path: "/dcp-assets/{id}/traffic-update"
    description: "Advance print traffic one declared step (IN_TRANSIT, RECEIVED, INGESTING, INGESTED, RETURNED). Only the next step in the chain is accepted."
    roles: [TechnicalManager]
    code: 200
    input: [new_status]
    output: DcpAsset
    side_effects:
      - "stamps received_at from the logical clock on the RECEIVED step"
      - "stamps ingested_at from the logical clock on the INGESTED step"
      - "the INGESTED and RETURNED states release the venue's ingest lane"

  # -------------------------------------------------------------- KdmKey ----
  - method: POST
    path: "/kdm-keys"
    description: "Issue a KDM for an encrypted package on this venue's server. The closed validity interval must be strictly disjoint from every other ISSUED key for the same package/venue pair."
    roles: [TechnicalManager]
    code: 201
    input: [dcp_asset_id, venue_id, server_ref, valid_from, valid_until]
    output: KdmKey
    side_effects:
      - "creates the key in ISSUED"
      - "moves every covered Showtime's playback_status UNVERIFIED|PLAYBACK_FAILED -> KEY_PENDING"

  - method: GET
    path: "/kdm-keys/{id}"
    description: "Read one KDM."
    roles: [TechnicalManager, ExecutiveDirector]
    code: 200
    output: KdmKey
    side_effects: []

  - method: GET
    path: "/kdm-keys"
    description: "List keys by package or venue. Reverse-reachability for KdmKey.dcp_asset_id and KdmKey.venue_id."
    roles: [TechnicalManager, ExecutiveDirector]
    code: 200
    input: ["dcp_asset_id?", "venue_id?", "status?", "limit?", "offset?"]
    output: KdmKey[]
    side_effects: []

  - method: POST
    path: "/kdm-keys/{id}/revoke"
    description: "Revoke a KDM; showtimes left without a covering key fall back to UNVERIFIED and their sales are pulled."
    roles: [TechnicalManager, ExecutiveDirector]
    code: 200
    input: [revoked_reason]
    output: KdmKey
    side_effects:
      - "moves KdmKey ISSUED -> REVOKED"
      - "for each Showtime that now has no covering ISSUED key: playback_status -> UNVERIFIED and sale_status -> SALES_CLOSED"
      - "voids RESERVED TicketOrders on those showtimes and refunds PAID ones, crediting member credit_balance_cents"

  # ------------------------------------------------------------ Showtime ----
  - method: POST
    path: "/showtimes"
    description: "Schedule one screening at an explicit start_at. Carries the OCC guard expected_clearance_version."
    roles: [Programmer]
    code: 201
    input: [venue_id, title_id, booking_id, clearance_id, dcp_asset_id, strand, start_at, base_price_cents, public_sale_opens_at, format, expected_clearance_version, "series_label?"]
    output: Showtime
    side_effects:
      - "computes end_at, blocked_until and the screen_slot_block occupancy interval"
      - "creates the showtime with status=SCHEDULED, sale_status=DRAFT, playback_status=UNVERIFIED"
      - "draws down the clearance's screening allowance (screenings_used +1) and increments RightsClearance.version by 1"
      - "lazily expires the clearance when the clock's venue-local date is past window_end_date"

  - method: POST
    path: "/showtimes/auto-schedule"
    description: "Ask the optimiser to place one screening on target_date at the best-scoring legal slot per slot_ranking_score. Carries the OCC guard expected_clearance_version."
    roles: [Programmer]
    code: 201
    input: [venue_id, title_id, booking_id, clearance_id, dcp_asset_id, strand, target_date, earliest_local_time, latest_local_time, base_price_cents, public_sale_opens_at, format, expected_clearance_version, "series_label?"]
    output: Showtime
    side_effects:
      - "evaluates the SLOT_GRANULARITY_MINUTES candidate grid, filters it, ranks it and stores the winner's slot_score"
      - "creates the showtime with status=SCHEDULED, sale_status=DRAFT, playback_status=UNVERIFIED"
      - "draws down the clearance's screening allowance and increments RightsClearance.version by 1"
      - "rejects with ERR_NO_ELIGIBLE_SLOT when the filtered pool is empty; nothing is created"

  - method: GET
    path: "/showtimes/{id}"
    description: "Read one screening with its three status dimensions and its box-office rollup."
    roles: [Programmer, RightsManager, TechnicalManager, BoxOfficeManager, ExecutiveDirector, Member, Anonymous]
    code: 200
    output: Showtime
    side_effects: []

  - method: GET
    path: "/showtimes"
    description: "List screenings with every FK filter plus a start-instant window. Reverse-reachability for Showtime.venue_id, title_id, booking_id, clearance_id and dcp_asset_id."
    roles: [Programmer, RightsManager, TechnicalManager, BoxOfficeManager, ExecutiveDirector, Member, Anonymous]
    code: 200
    input: ["venue_id?", "title_id?", "booking_id?", "clearance_id?", "dcp_asset_id?", "strand?", "status?", "start_from?", "start_to?", "limit?", "offset?"]
    output: Showtime[]
    side_effects: []

  - method: POST
    path: "/showtimes/{id}/verify-playback"
    description: "Record the booth's playback test. Requires an INGESTED package and an ISSUED KDM covering [start_at, end_at]."
    roles: [TechnicalManager]
    code: 200
    input: [result]
    output: Showtime
    side_effects:
      - "moves playback_status KEY_PENDING -> PLAYBACK_VERIFIED on result=PASS, KEY_PENDING -> PLAYBACK_FAILED on result=FAIL"
      - "lazily expires any candidate KdmKey whose valid_until is earlier than the clock"

  - method: POST
    path: "/showtimes/{id}/open-sales"
    description: "Put the screening on sale. Requires the owning Booking to be CONFIRMED or RUNNING."
    roles: [BoxOfficeManager]
    code: 200
    input: []
    output: Showtime
    side_effects:
      - "moves sale_status DRAFT -> ON_SALE"
      - "recomputes seats_sold and seats_available from the venue's capacity and house hold"

  - method: POST
    path: "/showtimes/{id}/close-sales"
    description: "Close the box office for this screening and void every unpaid hold."
    roles: [BoxOfficeManager]
    code: 200
    input: []
    output: Showtime
    side_effects:
      - "moves sale_status ON_SALE|SOLD_OUT -> SALES_CLOSED"
      - "moves every RESERVED TicketOrder on the showtime to VOID and recomputes the box-office rollup"

  - method: POST
    path: "/showtimes/{id}/cancel"
    description: "Cancel the screening, release its licence allowance and unwind its sales."
    roles: [Programmer, BoxOfficeManager, ExecutiveDirector]
    code: 200
    input: [cancel_reason]
    output: Showtime
    side_effects:
      - "moves status SCHEDULED -> CANCELLED and frees the screen block"
      - "voids RESERVED TicketOrders and refunds PAID ones, crediting member credit_balance_cents"
      - "recomputes the clearance's screenings_used / screenings_remaining"
      - "cancels a PLANNED or CONFIRMED SpecialEvent attached to the showtime"

  - method: POST
    path: "/showtimes/{id}/complete"
    description: "Mark the screening played. The first completion on an engagement moves the Booking CONFIRMED -> RUNNING."
    roles: [BoxOfficeManager, ExecutiveDirector]
    code: 200
    input: []
    output: Showtime
    side_effects:
      - "moves status SCHEDULED -> COMPLETED and freezes gross_cents / admissions_count"
      - "bubbles the owning Booking CONFIRMED -> RUNNING on the first completion"

  # --------------------------------------------------------- SpecialEvent ----
  - method: POST
    path: "/special-events"
    description: "Plan a filmmaker Q and A, festival slot or themed-series event around an existing screening."
    roles: [Programmer]
    code: 201
    input: [showtime_id, event_type, guest_name, extra_minutes, surcharge_cents, guest_fee_cents]
    output: SpecialEvent
    side_effects:
      - "creates the event in PLANNED; the showtime's extra_minutes and surcharge_cents stay at 0 until confirmation"

  - method: GET
    path: "/special-events/{id}"
    description: "Read one special event including the ids it displaced."
    roles: [Programmer, BoxOfficeManager, ExecutiveDirector]
    code: 200
    output: SpecialEvent
    side_effects: []

  - method: GET
    path: "/special-events"
    description: "List special events, optionally for one screening. Reverse-reachability for SpecialEvent.showtime_id."
    roles: [Programmer, BoxOfficeManager, ExecutiveDirector]
    code: 200
    input: ["showtime_id?", "status?", "event_type?", "limit?", "offset?"]
    output: SpecialEvent[]
    side_effects: []

  - method: POST
    path: "/special-events/{id}/confirm"
    description: "Confirm the event. The screening's block grows by extra_minutes; later screenings the enlarged block now collides with are either displaced (displace_conflicts=true) or the request is rejected."
    roles: [ExecutiveDirector]
    code: 200
    input: [displace_conflicts]
    output: SpecialEvent
    side_effects:
      - "moves SpecialEvent PLANNED -> CONFIRMED"
      - "sets Showtime.extra_minutes and Showtime.surcharge_cents from the event and recomputes end_at / blocked_until"
      - "with displace_conflicts=true: cancels each colliding SCHEDULED Showtime, records their ids in displaced_showtime_ids, voids/refunds their orders and restores their clearance allowances"
      - "with displace_conflicts=false: rejects with ERR_SCREEN_SLOT_CONFLICT and changes nothing"

  - method: POST
    path: "/special-events/{id}/cancel"
    description: "Cancel the event. A CONFIRMED event's on-screen minutes and surcharge are compensated back to zero; displaced screenings are NOT resurrected."
    roles: [Programmer, ExecutiveDirector]
    code: 200
    input: [cancel_reason]
    output: SpecialEvent
    side_effects:
      - "moves SpecialEvent PLANNED|CONFIRMED -> CANCELLED"
      - "resets Showtime.extra_minutes and Showtime.surcharge_cents to 0 and recomputes end_at / blocked_until"
      - "already-sold orders keep the price they were sold at; no repricing occurs"

  # ---------------------------------------------------------- TicketOrder ----
  - method: POST
    path: "/ticket-orders"
    description: "Sell seats for a screening. Member pricing, comps, advance access and credit redemption are all resolved here."
    roles: [BoxOfficeManager, Member, Anonymous]
    code: 201
    input: [showtime_id, quantity, purchaser_email, "member_id?", "comp_quantity?", "apply_credit?"]
    output: TicketOrder
    side_effects:
      - "prices the order per ticket_order_pricing (per-ticket rounding, then summation)"
      - "consumes member credit when apply_credit is true and decrements Member.credit_balance_cents"
      - "recomputes the showtime's seats_sold / seats_available and flips ON_SALE -> SOLD_OUT at exactly zero seats"
      - "creates the order in RESERVED"

  - method: GET
    path: "/ticket-orders/{id}"
    description: "Read one order with its pinned price breakdown."
    roles: [BoxOfficeManager, ExecutiveDirector, Member]
    code: 200
    output: TicketOrder
    side_effects: []

  - method: GET
    path: "/ticket-orders"
    description: "List orders by screening or member. Reverse-reachability for TicketOrder.showtime_id and TicketOrder.member_id."
    roles: [BoxOfficeManager, ExecutiveDirector, Member]
    code: 200
    input: ["showtime_id?", "member_id?", "status?", "limit?", "offset?"]
    output: TicketOrder[]
    side_effects: []

  - method: POST
    path: "/ticket-orders/{id}/pay"
    description: "Settle a reserved order; only PAID orders count towards gross and final settlement."
    roles: [BoxOfficeManager, Member]
    code: 200
    input: []
    output: TicketOrder
    side_effects:
      - "moves TicketOrder RESERVED -> PAID"
      - "recomputes the showtime's gross_cents and admissions_count"

  - method: POST
    path: "/ticket-orders/{id}/refund"
    description: "Refund a paid order to cash or to member credit."
    roles: [BoxOfficeManager, ExecutiveDirector]
    code: 200
    input: [refund_destination]
    output: TicketOrder
    side_effects:
      - "moves TicketOrder PAID -> REFUNDED"
      - "with refund_destination=MEMBER_CREDIT: adds total_cents to Member.credit_balance_cents; with CASH it does not"
      - "returns the seats: recomputes seats_sold / seats_available and flips SOLD_OUT -> ON_SALE"
      - "restores the member's comp_tickets_remaining for any comps on the order"

  # --------------------------------------------------------------- Member ----
  - method: POST
    path: "/members"
    description: "Open a membership record; it starts in PENDING with no donation history."
    roles: [BoxOfficeManager, ExecutiveDirector]
    code: 201
    input: [full_name, email, join_date]
    output: Member
    side_effects:
      - "creates the member in PENDING with an empty donations array and every tier field at PROSPECT/zero"

  - method: GET
    path: "/members/{id}"
    description: "Read one member; both standing variants (rolling_tier and fiscal_tier) plus effective_tier are recomputed against the logical clock on every read."
    roles: [BoxOfficeManager, ExecutiveDirector, Member]
    code: 200
    output: Member
    side_effects:
      - "recomputes rolling_donation_cents, fiscal_ytd_donation_cents, both tiers and every derived benefit"

  - method: POST
    path: "/members/{id}/donations"
    description: "Lodge a donation at an explicit received_at instant, re-deriving membership standing."
    roles: [BoxOfficeManager, ExecutiveDirector]
    code: 200
    input: [amount_cents, received_at]
    output: Member
    side_effects:
      - "appends {amount_cents, received_at} to the donations array"
      - "recomputes member_standing (both variants), expires_at, discount_pct, advance_access_hours and comp_tickets_granted"
      - "moves Member PENDING|LAPSED -> ACTIVE"

  - method: POST
    path: "/membership-sweeps"
    description: "Lapse every ACTIVE member whose expires_at is strictly earlier than the logical clock."
    roles: [ExecutiveDirector]
    code: 200
    input: []
    output: "{ swept_count: integer, lapsed_member_ids: string[], evaluated_at: datetime }"
    side_effects:
      - "moves each qualifying Member ACTIVE -> LAPSED (strict `expires_at < clock`; equality does NOT lapse)"
      - "a LAPSED member keeps credit_balance_cents but loses discount_pct and advance_access_hours"

  # ----------------------------------------------------------- Settlement ----
  - method: POST
    path: "/settlements"
    description: "Draft a settlement for a CLOSED engagement in the requested variant. Carries the OCC guard expected_booking_version."
    roles: [BoxOfficeManager]
    code: 201
    input: [booking_id, variant, expected_booking_version]
    output: Settlement
    side_effects:
      - "computes box_office_cents, facility_fee_total_cents, adjusted_gross_cents, playing_days, proration_factor, house_nut_applied_cents, film_rent_cents and cinema_retained_cents for the requested variant"
      - "copies booking.min_run_penalty_cents into the settlement"
      - "creates the settlement in DRAFT and increments Booking.version by 1"

  - method: GET
    path: "/settlements/{id}"
    description: "Read one settlement's stored figures."
    roles: [BoxOfficeManager, ExecutiveDirector]
    code: 200
    output: Settlement
    side_effects: []

  - method: GET
    path: "/settlements"
    description: "List settlements for an engagement. Reverse-reachability for Settlement.booking_id."
    roles: [BoxOfficeManager, ExecutiveDirector]
    code: 200
    input: ["booking_id?", "variant?", "status?", "limit?", "offset?"]
    output: Settlement[]
    side_effects: []

  - method: POST
    path: "/settlements/{id}/submit"
    description: "Send the settlement to the distributor."
    roles: [BoxOfficeManager]
    code: 200
    input: []
    output: Settlement
    side_effects:
      - "moves Settlement DRAFT|DISPUTED -> SUBMITTED"
      - "records submitted_by_user_id from X-User-ID"

  - method: POST
    path: "/settlements/{id}/finalize"
    description: "Lock the remittance. The figures are recomputed with the FINAL inclusion set regardless of the variant the draft was created under."
    roles: [ExecutiveDirector]
    code: 200
    input: []
    output: Settlement
    side_effects:
      - "recomputes every figure under settlement_film_rent's FINAL variant and overwrites variant to FINAL"
      - "moves Settlement SUBMITTED -> RECONCILED"
      - "records finalized_by_user_id from X-User-ID"

  - method: POST
    path: "/settlements/{id}/resolve"
    description: "Record the distributor's disposition: DISPUTED sends it back, PAID closes it."
    roles: [ExecutiveDirector]
    code: 200
    input: [outcome, "dispute_note?"]
    output: Settlement
    side_effects:
      - "with outcome=DISPUTED: moves SUBMITTED|RECONCILED -> DISPUTED and stores dispute_note"
      - "with outcome=PAID: moves RECONCILED -> PAID (terminal)"

  # ------------------------------------------------- test-driving surface ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time; every window, expiry and sweep rule is evaluated against this logical clock."
    roles: [ExecutiveDirector]
    code: 200
    input: [current_utc]
    output: { current_utc: datetime }
    side_effects:
      - "all subsequent window, expiry, advance-access and sweep evaluations read this instant"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:

  # ---- universal ladder ----
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-Role header absent (on an endpoint that does not admit Anonymous) or naming a role not declared in §1.7."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The supplied role is not listed in the target endpoint's §1.5 roles, or X-User-ID is absent on an endpoint under segregation of duties."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed JSON, missing or null required field, wrong type, undeclared enum member, non-ISO timestamp, negative money/minute/day value, quantity outside 1..MAX_TICKETS_PER_ORDER, or an interval whose end is not strictly after its start."

  # ---- existence ----
  - id: ERR_VENUE_NOT_FOUND
    http: 404
    condition: "No Venue exists with the supplied id."
  - id: ERR_DISTRIBUTOR_NOT_FOUND
    http: 404
    condition: "No Distributor exists with the supplied id."
  - id: ERR_TITLE_NOT_FOUND
    http: 404
    condition: "No Title exists with the supplied id."
  - id: ERR_BOOKING_NOT_FOUND
    http: 404
    condition: "No Booking exists with the supplied id (including supersedes_booking_id)."
  - id: ERR_BOOKING_OFFER_NOT_FOUND
    http: 404
    condition: "No BookingOffer exists with the supplied id, or the booking has no PENDING offer to act on."
  - id: ERR_CLEARANCE_NOT_FOUND
    http: 404
    condition: "No RightsClearance exists with the supplied id."
  - id: ERR_DCP_ASSET_NOT_FOUND
    http: 404
    condition: "No DcpAsset exists with the supplied id."
  - id: ERR_KDM_KEY_NOT_FOUND
    http: 404
    condition: "No KdmKey exists with the supplied id."
  - id: ERR_SHOWTIME_NOT_FOUND
    http: 404
    condition: "No Showtime exists with the supplied id."
  - id: ERR_SPECIAL_EVENT_NOT_FOUND
    http: 404
    condition: "No SpecialEvent exists with the supplied id."
  - id: ERR_TICKET_ORDER_NOT_FOUND
    http: 404
    condition: "No TicketOrder exists with the supplied id."
  - id: ERR_MEMBER_NOT_FOUND
    http: 404
    condition: "No Member exists with the supplied id."
  - id: ERR_SETTLEMENT_NOT_FOUND
    http: 404
    condition: "No Settlement exists with the supplied id."

  # ---- optimistic concurrency ----
  - id: ERR_STALE_BOOKING_VERSION
    http: 412
    condition: "expected_booking_version does not equal the referenced Booking's current version (POST /bookings/{id}/counter, POST /settlements)."
  - id: ERR_STALE_CLEARANCE_VERSION
    http: 412
    condition: "expected_clearance_version does not equal the referenced RightsClearance's current version (POST /showtimes, POST /showtimes/auto-schedule)."

  # ---- state ----
  - id: ERR_BOOKING_INVALID_STATE
    http: 409
    condition: "The Booking is not in a state from which the requested transition is declared (e.g. countering a CONFIRMED booking, closing a WITHDRAWN one, confirming a CLOSED one)."
  - id: ERR_CLEARANCE_INVALID_STATE
    http: 409
    condition: "The RightsClearance is not in a state from which the requested transition is declared (e.g. clearing a CHANGES_REQUESTED clearance, requesting changes on a CLEARED one, revoking an EXPIRED one)."
  - id: ERR_DCP_ASSET_INVALID_STATE
    http: 409
    condition: "The requested new_status is not the single declared next step from the asset's current status (print traffic is strictly linear)."
  - id: ERR_KDM_KEY_INVALID_STATE
    http: 409
    condition: "The KdmKey is not ISSUED when a revoke is attempted."
  - id: ERR_SHOWTIME_INVALID_STATE
    http: 409
    condition: "The addressed status dimension does not admit the transition: status is not SCHEDULED on complete/cancel, sale_status is not DRAFT on open-sales or not ON_SALE|SOLD_OUT on close-sales, or playback_status is not KEY_PENDING on verify-playback."
  - id: ERR_SPECIAL_EVENT_INVALID_STATE
    http: 409
    condition: "The SpecialEvent is not PLANNED on confirm, or is already CANCELLED on cancel."
  - id: ERR_TICKET_ORDER_INVALID_STATE
    http: 409
    condition: "The TicketOrder is not RESERVED on pay or not PAID on refund."
  - id: ERR_MEMBER_INVALID_STATE
    http: 409
    condition: "The Member is not in a state from which the requested transition is declared."
  - id: ERR_SETTLEMENT_INVALID_STATE
    http: 409
    condition: "The Settlement is not DRAFT|DISPUTED on submit, not SUBMITTED on finalize, or not SUBMITTED|RECONCILED on resolve; PAID is terminal."

  # ---- rights and technical safety ----
  - id: ERR_CLEARANCE_NOT_CLEARED
    http: 422
    condition: "A Showtime was requested against a RightsClearance that is not in state CLEARED."
  - id: ERR_CLEARANCE_WINDOW_NOT_COVERED
    http: 422
    condition: "The showtime's venue-local date falls outside the clearance's inclusive [window_start_date, window_end_date]."
  - id: ERR_SCREENING_ALLOWANCE_EXHAUSTED
    http: 422
    condition: "The referenced clearance has screenings_remaining == 0."
  - id: ERR_FORMAT_INCOMPATIBLE
    http: 422
    condition: "showtime.format is not in venue.supported_formats, or does not equal dcp_asset.format, or does not equal clearance.source_format; or a DcpAsset's own format is not in its destination venue's supported_formats."
  - id: ERR_DEPENDENCY_STATE_INVALID
    http: 422
    condition: "verify-playback was called while the DcpAsset is not INGESTED, or open-sales was called while the owning Booking is not CONFIRMED|RUNNING."
  - id: ERR_NO_COVERING_KDM
    http: 422
    condition: "No ISSUED KdmKey satisfies valid_from <= showtime.start_at AND valid_until >= showtime.end_at for the showtime's package and venue."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "POST /clearances/{id}/clear was called with an X-User-ID equal to the clearance's submitted_by_user_id."

  # ---- temporal and resource geometry ----
  - id: ERR_SCREEN_SLOT_CONFLICT
    http: 409
    condition: "The candidate half-open block [start_at, blocked_until) overlaps a non-CANCELLED showtime's block at the same venue - including a block enlarged by a special-event confirmation with displace_conflicts=false."
  - id: ERR_KDM_WINDOW_OVERLAP
    http: 409
    condition: "The candidate key's closed [valid_from, valid_until] touches or overlaps another ISSUED key's closed interval for the same package and venue."
  - id: ERR_INGEST_LANE_CAPACITY_EXCEEDED
    http: 409
    condition: "Admitting the candidate ingest window would make more than venue.dcp_ingest_lane_count occupying assets concurrent at some instant inside it."
  - id: ERR_SHOWTIME_WINDOW_INVALID
    http: 422
    condition: "The venue-local start time falls outside [open_local_time, last_start_local_time], or the venue-local date falls outside the booking's inclusive engagement window, or start_at is earlier than the logical clock."
  - id: ERR_ADVANCE_ACCESS_NOT_OPEN
    http: 422
    condition: "Public sales have not opened and the purchaser's advance window (public_sale_opens_at - advance_access_hours) has not been reached."
  - id: ERR_OFFER_EXPIRED
    http: 422
    condition: "The PENDING BookingOffer's expires_at is earlier than the logical clock at confirm time."

  # ---- constraint ----
  - id: ERR_INSUFFICIENT_SEATS
    http: 422
    condition: "quantity exceeds the showtime's seats_available."
  - id: ERR_COMP_ALLOWANCE_EXCEEDED
    http: 422
    condition: "comp_quantity exceeds quantity, exceeds the member's comp_tickets_remaining, or is non-zero on a non-member order."
  - id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED
    http: 422
    condition: "A counter was lodged while booking.round_count already equals MAX_NEGOTIATION_ROUNDS."
  - id: ERR_WEEKLY_BALANCE_EXCEEDED
    http: 422
    condition: "Adding the candidate showtime would push the venue ISO week's FIRST_RUN count above ceil(total_after * venue.max_first_run_share)."
  - id: ERR_NO_ELIGIBLE_SLOT
    http: 422
    condition: "POST /showtimes/auto-schedule found no candidate slot surviving the eligibility filter on target_date."
  - id: ERR_MEMBER_EMAIL_TAKEN
    http: 409
    condition: "A PENDING or ACTIVE Member already holds the supplied email."
  - id: ERR_REFERENCE_MISMATCH
    http: 422
    condition: "Two referenced rows disagree: clearance/booking/showtime title_id mismatch, dcp_asset title or venue mismatch, kdm_key venue mismatch, settlement booking mismatch, or a supersedes_booking_id target that is not WITHDRAWN."

  # ---- fiscal ----
  - id: ERR_SHOWTIME_SALES_CLOSED
    http: 422
    condition: "An order was attempted while the showtime's sale_status is DRAFT or SALES_CLOSED."
  - id: ERR_SETTLEMENT_NOT_PERMITTED
    http: 422
    condition: "A settlement was requested for a Booking that is not CLOSED, or a non-VOID settlement of that variant already exists for the booking."
  - id: ERR_CREDIT_BALANCE_INSUFFICIENT
    http: 422
    condition: "apply_credit was true without a member_id, or the member's credit_balance_cents is zero at request time."
  - id: ERR_HOUSE_NUT_ABOVE_CAP
    http: 422
    condition: "The accepted offer's proposed_house_nut_cents exceeds venue.base_house_nut_weekly_cents."
  - id: ERR_GUARANTEE_REQUIRED
    http: 422
    condition: "The distributor has requires_advance_guarantee == true but the booking's or offer's guarantee is zero."

# =============================================================================
# 1.7 Role & Permission Matrix
# =============================================================================
roles:

  - name: Programmer
    identity: opaque
    description: "Programs the calendar: catalogues titles, negotiates engagements, schedules screenings and plans special events."
    exclusive_operations:
      - "POST /bookings"
      - "POST /bookings/{id}/counter"
      - "POST /bookings/{id}/offer"
      - "POST /showtimes"
      - "POST /showtimes/auto-schedule"
      - "POST /special-events"
    shared_operations:
      - "POST /distributors (with ExecutiveDirector)"
      - "POST /titles (with ExecutiveDirector)"
      - "POST /showtimes/{id}/cancel (with BoxOfficeManager, ExecutiveDirector)"
      - "POST /special-events/{id}/cancel (with ExecutiveDirector)"
      - "read access to venues, distributors, titles, bookings, offers, clearances, dcp-assets, showtimes and special-events"

  - name: RightsManager
    identity: opaque
    description: "Owns repertory rights clearance. Subject to segregation of duties: the user who lodged a clearance may not clear it."
    exclusive_operations:
      - "POST /clearances"
      - "POST /clearances/{id}/submit"
    shared_operations:
      - "POST /clearances/{id}/clear (with ExecutiveDirector; the acting X-User-ID must differ from submitted_by_user_id)"
      - "POST /clearances/{id}/request-changes (with ExecutiveDirector)"
      - "POST /clearances/{id}/revoke (with ExecutiveDirector)"
      - "read access to venues, distributors, titles, bookings, clearances and showtimes"

  - name: TechnicalManager
    identity: opaque
    description: "Runs print traffic, DCP ingest, KDM key management and playback testing in the booth."
    exclusive_operations:
      - "POST /dcp-assets"
      - "POST /dcp-assets/{id}/traffic-update"
      - "POST /kdm-keys"
      - "POST /showtimes/{id}/verify-playback"
    shared_operations:
      - "POST /kdm-keys/{id}/revoke (with ExecutiveDirector)"
      - "read access to venues, titles, bookings, clearances, dcp-assets, kdm-keys and showtimes"

  - name: BoxOfficeManager
    identity: opaque
    description: "Runs ticketing, membership records and settlement drafting."
    exclusive_operations:
      - "POST /showtimes/{id}/open-sales"
      - "POST /showtimes/{id}/close-sales"
      - "POST /settlements"
      - "POST /settlements/{id}/submit"
    shared_operations:
      - "POST /ticket-orders (with Member, Anonymous)"
      - "POST /ticket-orders/{id}/pay (with Member)"
      - "POST /ticket-orders/{id}/refund (with ExecutiveDirector)"
      - "POST /members and POST /members/{id}/donations (with ExecutiveDirector)"
      - "POST /showtimes/{id}/cancel and POST /showtimes/{id}/complete (with ExecutiveDirector)"
      - "read access to venues, distributors, titles, bookings, dcp-assets, showtimes, special-events, ticket-orders, members and settlements"

  - name: ExecutiveDirector
    identity: opaque
    description: "Signs off engagements, event productions, revocations and remittances, and owns the venue record and the logical clock. Distinct from the operational roles - it does NOT inherit Programmer's negotiation-lodging or TechnicalManager's booth operations."
    exclusive_operations:
      - "POST /venues"
      - "POST /bookings/{id}/confirm"
      - "POST /bookings/{id}/close"
      - "POST /bookings/{id}/withdraw"
      - "POST /special-events/{id}/confirm"
      - "POST /membership-sweeps"
      - "POST /settlements/{id}/finalize"
      - "POST /settlements/{id}/resolve"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /distributors, POST /titles (with Programmer)"
      - "POST /clearances/{id}/clear, request-changes, revoke (with RightsManager)"
      - "POST /kdm-keys/{id}/revoke (with TechnicalManager)"
      - "POST /showtimes/{id}/cancel, POST /showtimes/{id}/complete (with BoxOfficeManager)"
      - "POST /special-events/{id}/cancel (with Programmer)"
      - "POST /ticket-orders/{id}/refund, POST /members, POST /members/{id}/donations (with BoxOfficeManager)"
      - "read access to every collection"

  - name: Member
    identity: "entity_backed:Member"
    description: "A cardholder acting on their own behalf. Their X-User-ID is the Member.id, so member-scoped reads and purchases are limited to their own records; discount, advance access and comp entitlements come from Member.effective_tier."
    exclusive_operations: []
    shared_operations:
      - "POST /ticket-orders (with BoxOfficeManager, Anonymous; member_id must equal the acting Member.id)"
      - "POST /ticket-orders/{id}/pay (with BoxOfficeManager; only on own orders)"
      - "GET /members/{id}, GET /ticket-orders, GET /ticket-orders/{id} (own records only)"
      - "GET /venues/{id}, GET /titles, GET /titles/{id}, GET /showtimes, GET /showtimes/{id} (public calendar)"

  - name: Anonymous
    identity: opaque
    description: "Unauthenticated walk-up purchaser or calendar browser; supplied by omitting X-Role. Never receives a member discount, has a zero-hour advance window and may not carry comp_quantity."
    exclusive_operations: []
    shared_operations:
      - "POST /ticket-orders (with BoxOfficeManager, Member; member_id must be absent)"
      - "GET /venues/{id}, GET /titles, GET /titles/{id}, GET /showtimes, GET /showtimes/{id} (public calendar)"
