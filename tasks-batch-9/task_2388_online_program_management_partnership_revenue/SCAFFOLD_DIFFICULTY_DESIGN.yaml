  - rule_id: compensating_invariant
    instances:
      - name: payment_then_equal_refund_conserves_partnership_cash_collected
        grounds:
          - calculations.cash_position_reconciliation
          - entities.Partnership.fields.collected_tuition_cents
          - entities.Enrollment.fields.collected_cents
          - entities.Enrollment.fields.refunded_cents
          - validations[priority=49]
        distinguishing_aspect: |
          Conserved quantity INV-1: cash collected on the Partnership. A PAYMENT of 562500
          followed by a REFUND of 562500 on the same Enrollment must return
          Partnership.collected_tuition_cents to its pre-payment 0 while the gross
          histories collected_cents and refunded_cents both remain 562500 — the ENROLLED ->
          ACTIVE side effect of the payment must not leave any cash drift behind.
        test_recipe:
          setup:
            - "EXECUTED Partnership, LAUNCHED Program, counselor with an APPROVED qualitative plan."
            - "One Enrollment S-2001 of 9 credits, tuition_charged_cents 562500, paid in full 562500 cents on 2026-09-05 so the Enrollment is ACTIVE and Partnership.collected_tuition_cents == 562500."
          setup_api_calls:
            - *c_clock_aug1
            - *c_ps_create
            - *c_ps_submit
            - *c_ps_execute
            - *c_pg_create
            - *c_course_create
            - *c_course_start
            - *c_course_submit
            - *c_course_approve
            - *c_scope_marketing
            - *c_pg_submit
            - *c_pg_approve
            - *c_pg_launch
            - *c_co_create
            - *c_co_plan
            - *c_co_review_approve
            - *c_lead_create
            - *c_lead_contact
            - *c_lead_apply
            - *c_enroll
            - *c_clock_sep5
            - *c_pay_full
          trigger:
            - call: "POST /enrollments/${en_id}/tuition-payments"
              payload: { entry_type: "REFUND", amount_cents: 562500, posted_date: "2026-09-05", reference_note: "Full reversal of duplicate posting" }
              as: UniversityBursar
              as_user_id: "bursar-1"
              captures: { rf_id: $.data.id }
          assert:
            - "TuitionPayment.${rf_id}.entry_type == REFUND"
            - "TuitionPayment.${rf_id}.amount_cents == 562500"
            - "TuitionPayment.${rf_id}.generated_by == BURSAR_POST"
            - "Enrollment.${en_id}.collected_cents == 562500"
            - "Enrollment.${en_id}.refunded_cents == 562500"
            - "Enrollment.${en_id}.status == ACTIVE"
            - "Partnership.${ps_id}.collected_tuition_cents == 0"
            - "EnrollmentCounselor.${co_id}.clawback_pending_cents == 0"

      - name: spend_then_equal_credit_memo_conserves_the_marketing_budget_envelope
        grounds:
          - calculations.marketing_envelope_reconciliation
          - entities.Partnership.fields.marketing_budget_remaining_cents
          - entities.Partnership.fields.unrecouped_marketing_spend_cents
          - entities.Program.fields.marketing_spend_net_cents
          - entities.MarketingSpendEntry.fields.entry_type
        distinguishing_aspect: |
          A different conserved quantity — INV-2, the marketing budget envelope rather than
          collected cash: a SPEND of 300000 followed by a CREDIT_MEMO of 300000 on the same
          Program must restore marketing_budget_remaining_cents to the full 4000000, drive
          Program.marketing_spend_net_cents back to 0 and leave
          unrecouped_marketing_spend_cents at 0, preserving the identity
          marketing_budget_cents == marketing_budget_remaining_cents + posted_net.
        test_recipe:
          setup:
            - "EXECUTED Partnership with marketing_budget_cents 4000000, marketing_budget_remaining_cents 4000000 and no spend posted."
            - "Program 'MBA Online' LAUNCHED with zero enrollments."
            - "Logical clock at 2026-09-05T00:00:00Z."
          setup_api_calls:
            - *c_clock_aug1
            - *c_ps_create
            - *c_ps_submit
            - *c_ps_execute
            - *c_pg_create
            - *c_course_create
            - *c_course_start
            - *c_course_submit
            - *c_course_approve
            - *c_scope_marketing
            - *c_pg_submit
            - *c_pg_approve
            - *c_pg_launch
            - *c_clock_sep5
          trigger:
            - *c_spend_300k
            - call: "POST /programs/${pg_id}/marketing-spend-entries"
              payload: { entry_type: "CREDIT_MEMO", channel: "PAID_SEARCH", amount_cents: 300000, spend_date: "2026-09-05", reversal_note: "Agency credit for undelivered impressions" }
              as: PartnerAccountLead
              as_user_id: "${ps_id}"
              captures: { cm_id: $.data.id }
          assert:
            - "MarketingSpendEntry.${cm_id}.entry_type == CREDIT_MEMO"
            - "MarketingSpendEntry.${cm_id}.amount_cents == 300000"
            - "Program.${pg_id}.marketing_spend_net_cents == 0"
            - "Program.${pg_id}.blended_cac_cents == null"
            - "Partnership.${ps_id}.marketing_budget_remaining_cents == 4000000"
            - "Partnership.${ps_id}.unrecouped_marketing_spend_cents == 0"
