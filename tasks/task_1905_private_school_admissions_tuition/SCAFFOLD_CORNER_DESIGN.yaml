      - name: reenroll_already_accepted_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_REENROLL_ALREADY_ACCEPTED]", state_machines.ReenrollmentOffer.ISSUED_to_ACCEPTED]
        distinguishing_aspect: "After a family ACCEPTS a re-enrollment offer, creating another offer for the same student+cycle is rejected ERR_REENROLL_ALREADY_ACCEPTED — supersede semantics apply only to ISSUED offers. The OCC version used is fresh, so the constraint itself is what fires."
