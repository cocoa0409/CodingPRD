            - "Complaint.${c1_id}.status remains RESOLVED with reopen_count == 0"

      - name: party_response_twice_by_same_party_rejected
        claim_type: Violation → Error
        grounds:
          - state_machines.MediationCase
          - errors.ERR_MEDIATION_INVALID_STATE
        distinguishing_aspect: "Each party may answer an offer once: a second BUSINESS response is a 409 ERR_MEDIATION_INVALID_STATE."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Bureau IA/NE; consumer; LARGE business; c1 UNRESOLVED; m1 OFFERED; business already accepted (case still OFFERED pending consumer)."
