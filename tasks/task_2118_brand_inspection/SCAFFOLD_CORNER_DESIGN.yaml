            - "BrandRegistration.${reg_a}.superseded_by_registration_id == ${reg_new}"
            - "GET /brand-inspection/brand-applications?prior_registration_id=${reg_a} returns total_count 1"

      - name: corner_waive_fee_on_unassessed_order_rejected
        claim_type: Violation to Error
