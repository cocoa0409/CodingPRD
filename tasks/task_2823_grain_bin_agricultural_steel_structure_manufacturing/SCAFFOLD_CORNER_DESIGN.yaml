            - call: "POST /dealer-orders/${o1_id}/cancel"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${dlr_a_id}"
              captures: { o1_prod: $.data.production_status, o1_frt2: $.data.allocated_freight_cents, o1_seq2: $.data.freight_sequence, o1_fl2: $.data.freight_load_id }
            - call: "GET /freight-loads/${fl_id}"
              payload: {}
              as: LogisticsCoordinator
              captures: { t2_cnt: $.data.order_count, t2_w: $.data.assigned_weight_kg, t2_c: $.data.assigned_cube_m3, t2_util: $.data.cube_utilization_pct, t2_lh: $.data.linehaul_cost_cents, t2_status: $.data.status }
            - call: "GET /dealer-orders/${o2_id}"
