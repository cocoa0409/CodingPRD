# =============================================================================
# task_0976_airport_meet_assist_wheelchair — SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8)
# 9 rules × 2 instances each = 18 instances total
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_final_leg_charge_with_delay_surcharge
        grounds:
          - calculations.provisional_leg_charge
          - calculations.final_leg_charge
          - entities.ServiceLeg.fields.provisional_leg_cents
          - entities.ServiceLeg.fields.final_leg_cents
          - entities.FlightSegment.fields.actual_utc
        distinguishing_aspect: |
          Same ServiceLeg, two valid charge algorithms produce different cents: provisional uses
          scheduled_utc + posture-at-submit; final uses actual_utc + posture-at-complete + a
          delay surcharge computed AFTER the per-leg rounding. For the SAME leg the two variants
          diverge because actual_utc differs from scheduled_utc by more than the 20-minute grace.
        test_recipe:
          setup:
            - "Airport SFO (posture NORMAL, meet_buffer_minutes=20) with Terminal T1 (requires_secure_escort=false)"
            - "FlightSegment UA100 ARRIVAL scheduled_utc=2026-06-01T10:00:00Z, status SCHEDULED"
            - "Passenger with mobility_code=WCHR, dob=1990-01-01 (ADULT), private_card_token set, bill_to=PRIVATE"
            - "AssistRequest STANDARD tier, companion_count=0, with one MEET_ARRIVAL leg"
            - "Logical clock advanced to 2026-06-01T09:00:00Z before SUBMIT"
            - "SUBMIT the request: provisional_leg_cents computed using scheduled_utc"
            - "Agent with sufficient credentials, shift covering [08:00, 20:00], tsa_cleared_until far future"
            - "Dispatch the leg (creates Assignment); walk Assignment to COMPLETED"
            - "Before COMPLETE: mark FlightSegment LANDED with actual_utc=2026-06-01T10:50:00Z (50 min delay → 30 min past grace → 30 * 75 = 2250 cents surcharge)"
          setup_api_calls:
            - call: "POST /maa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /maa/airports"
              payload: { iata_code: "SFO", tz_offset_minutes: -420, meet_buffer_minutes: 20 }
              as: PlatformAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /maa/airports/${ap_id}/terminals"
              payload: { code: "T1", requires_secure_escort: false }
              as: PlatformAdmin
              captures: { term_id: $.data.id }
            - call: "POST /maa/airports/${ap_id}/segments"
              payload: { flight_no: "UA100", direction: "ARRIVAL", terminal_id: "${term_id}", scheduled_utc: "2026-06-01T10:00:00Z" }
              as: PlatformAdmin
              captures: { seg_id: $.data.id }
            - call: "POST /maa/passengers"
              payload: { full_name: "Adult P", dob: "1990-01-01", mobility_code: "WCHR", private_card_token: "tok_x" }
              as: Requester
              captures: { pax_id: $.data.id }
            - call: "POST /maa/assist-requests"
              payload: { passenger_id: "${pax_id}", bill_to: "PRIVATE", service_tier: "STANDARD", companion_count: 0 }
              as: Requester
              captures: { req_id: $.data.id }
            - call: "POST /maa/assist-requests/${req_id}/legs"
              payload: { segment_id: "${seg_id}", leg_kind: "MEET_ARRIVAL", pickup_zone: "CURB-A" }
              as: Requester
              captures: { leg_id: $.data.id }
            - call: "POST /maa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "GET /maa/assist-requests/${req_id}"
              as: Requester
              captures: { req_v1: $.data.version }
            - call: "POST /maa/assist-requests/${req_id}/events"
              payload: { event_type: "SUBMIT", expected_assist_request_version: "${req_v1}" }
              as: Requester
              captures: { req_v2: $.data.version, prov_cents: $.data.provisional_charge_cents }
            - call: "POST /maa/airports/${ap_id}/agents"
              payload: { display_name: "Agent A", tsa_cleared_until: "2027-01-01T00:00:00Z", ummr_certified: false, senior_trained: false, wc_certified: true, shift_start_utc: "2026-06-01T08:00:00Z", shift_end_utc: "2026-06-01T20:00:00Z" }
              as: PlatformAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /maa/airports/${ap_id}/wheelchairs"
              payload: { asset_tag: "WC-01", chair_class: "MANUAL", is_wchc_rated: false }
              as: PlatformAdmin
            - call: "GET /maa/assist-requests/${req_id}"
              as: Dispatcher
              captures: { req_v_for_dispatch: $.data.version }
            - call: "POST /maa/legs/${leg_id}/dispatch"
              payload: { expected_assist_request_version: "${req_v_for_dispatch}" }
              as: Dispatcher
              captures: { asg_id: $.data.id }
            - call: "POST /maa/assignments/${asg_id}/events"
              payload: { event_type: "ARRIVE_PICKUP" }
              as: Agent
              as_user_id: "${ag_id}"
            - call: "POST /maa/assignments/${asg_id}/events"
              payload: { event_type: "DEPART_PICKUP" }
              as: Agent
              as_user_id: "${ag_id}"
            - call: "POST /maa/assignments/${asg_id}/events"
              payload: { event_type: "ARRIVE_GATE" }
              as: Agent
              as_user_id: "${ag_id}"
            - call: "POST /maa/assignments/${asg_id}/events"
              payload: { event_type: "HANDOFF" }
              as: Agent
              as_user_id: "${ag_id}"
            - call: "POST /maa/segments/${seg_id}/events"
              payload: { event_type: "LANDED", actual_utc: "2026-06-01T10:50:00Z" }
              as: OpsManager
          trigger:
            - call: "POST /maa/assignments/${asg_id}/events"
              payload: { event_type: "COMPLETE" }
              as: Confirmer
              as_user_id: "confirmer_user_1"
              captures: { asg_after: $.data.version }
          assert:
            - "ServiceLeg.${leg_id}.provisional_leg_cents == 6800   # round_half_up((6000+0+800+0+0+0) * 10000/10000 * 10000/10000) = 6800"
            - "ServiceLeg.${leg_id}.final_leg_cents == 9050         # 6800 + max(0, 50-20)*75 = 6800 + 2250"
            - "ServiceLeg.${leg_id}.final_leg_cents != ServiceLeg.${leg_id}.provisional_leg_cents"
            - "AssistRequest.${req_id}.final_charge_cents == 9050"
            - "AssistRequest.${req_id}.request_status == COMPLETED"

      - name: final_vs_writeoff_baseline_posture_normalization
        grounds:
          - calculations.final_leg_charge
          - calculations.write_off_baseline
          - entities.Invoice.fields.amount_cents
          - entities.Airport.fields.posture
        distinguishing_aspect: |
          The same FINAL charge is recomputed a second time under the at_writeoff variant with
          posture_mult_bp pinned to 10000 (NORMAL) — when the actual completion occurred under
          DEGRADED posture, the write-off baseline differs from the FINAL charge for the same leg,
          exercising dual-variant logic on the Invoice entity domain (not on ServiceLeg).
        test_recipe:
          setup:
            - "Airport OAK in DEGRADED posture before SUBMIT"
            - "One DEPARTURE_ESCORT leg, no delays (actual == scheduled)"
            - "Walk through to COMPLETED → final_charge uses posture_mult_bp = 12500"
            - "BillingClerk#1 created PROVISIONAL invoice at SUBMIT (system records sofia/creator); a DIFFERENT BillingClerk#2 issues WRITE_OFF after DISPUTE"
          setup_api_calls:
            - call: "POST /maa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /maa/airports"
              payload: { iata_code: "OAK", tz_offset_minutes: -420, meet_buffer_minutes: 15 }
              as: PlatformAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /maa/airports/${ap_id}/terminals"
              payload: { code: "T2", requires_secure_escort: false }
              as: PlatformAdmin
              captures: { term_id: $.data.id }
            - call: "POST /maa/airports/${ap_id}/segments"
              payload: { flight_no: "WN200", direction: "DEPARTURE", terminal_id: "${term_id}", scheduled_utc: "2026-06-02T12:00:00Z" }
              as: PlatformAdmin
              captures: { seg_id: $.data.id }
            - call: "POST /maa/passengers"
              payload: { full_name: "P Two", dob: "1985-05-05", mobility_code: "WCHR", airline_pnr: "ABC123" }
              as: Requester
              captures: { pax_id: $.data.id }
            - call: "POST /maa/assist-requests"
              payload: { passenger_id: "${pax_id}", bill_to: "AIRLINE", service_tier: "STANDARD", companion_count: 0 }
              as: Requester
              captures: { req_id: $.data.id }
            - call: "POST /maa/assist-requests/${req_id}/legs"
              payload: { segment_id: "${seg_id}", leg_kind: "DEPARTURE_ESCORT", pickup_zone: "CURB-B" }
              as: Requester
              captures: { leg_id: $.data.id }
            - call: "POST /maa/airports/${ap_id}/posture"
              payload: { posture: "DEGRADED" }
              as: OpsManager
            - call: "POST /maa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T11:00:00Z" }
              as: PlatformAdmin
            - call: "GET /maa/assist-requests/${req_id}"
              as: Requester
              captures: { req_v: $.data.version }
            - call: "POST /maa/assist-requests/${req_id}/events"
              payload: { event_type: "SUBMIT", expected_assist_request_version: "${req_v}" }
              as: Requester
            - call: "POST /maa/airports/${ap_id}/agents"
              payload: { display_name: "Ag", tsa_cleared_until: "2027-01-01T00:00:00Z", ummr_certified: false, senior_trained: false, wc_certified: true, shift_start_utc: "2026-06-02T08:00:00Z", shift_end_utc: "2026-06-02T20:00:00Z" }
              as: PlatformAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /maa/airports/${ap_id}/wheelchairs"
              payload: { asset_tag: "WC-OAK-1", chair_class: "MANUAL", is_wchc_rated: false }
              as: PlatformAdmin
            - call: "GET /maa/assist-requests/${req_id}"
              as: Dispatcher
              captures: { req_v2: $.data.version }
            - call: "POST /maa/legs/${leg_id}/dispatch"
              payload: { expected_assist_request_version: "${req_v2}" }
              as: Dispatcher
              captures: { asg_id: $.data.id }
            - call: "POST /maa/assignments/${asg_id}/events"
              payload: { event_type: "ARRIVE_PICKUP" }
              as: Agent
              as_user_id: "${ag_id}"
            - call: "POST /maa/assignments/${asg_id}/events"
              payload: { event_type: "DEPART_PICKUP" }
              as: Agent
              as_user_id: "${ag_id}"
            - call: "POST /maa/assignments/${asg_id}/events"
              payload: { event_type: "ARRIVE_GATE" }
              as: Agent
              as_user_id: "${ag_id}"
            - call: "POST /maa/assignments/${asg_id}/events"
              payload: { event_type: "HANDOFF" }
              as: Agent
              as_user_id: "${ag_id}"
            - call: "POST /maa/segments/${seg_id}/events"
              payload: { event_type: "DEPARTED", actual_utc: "2026-06-02T12:00:00Z" }
              as: OpsManager
            - call: "POST /maa/assignments/${asg_id}/events"
              payload: { event_type: "COMPLETE" }
              as: Confirmer
              as_user_id: "confirmer_user_9"
            - call: "GET /maa/assist-requests/${req_id}/invoices"
              as: BillingClerk
              captures: { final_inv_id: "$.data[0].id", final_inv_v: "$.data[0].version" }
            - call: "POST /maa/invoices/${final_inv_id}/events"
              payload: { event_type: "DISPUTE", expected_invoice_version: "${final_inv_v}" }
              as: BillingClerk
              as_user_id: "clerk_1"
              captures: { inv_v2: $.data.version }
          trigger:
            - call: "POST /maa/invoices/${final_inv_id}/events"
              payload: { event_type: "WRITE_OFF", expected_invoice_version: "${inv_v2}" }
              as: BillingClerk
              as_user_id: "clerk_2"
          assert:
            # base = (7500 + 0 + 800 + 0 + 0 + 0) = 8300; posture 12500/10000 = 1.25 → 10375
            - "ServiceLeg.${leg_id}.final_leg_cents == 10375"
            # writeoff baseline pins posture_mult_bp=10000 → 8300
            - "Invoice.${final_inv_id}.amount_cents == 10375"
            - "Invoice.${final_inv_id}.status == WRITTEN_OFF"
            - "AssistRequest.${req_id}.billing_status == WRITTEN_OFF"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: tiered_provisional_charge_with_companion_equipment_ummr_senior_tsa
        grounds:
          - calculations.provisional_leg_charge
          - entities.ServiceLeg.fields.provisional_leg_cents
        distinguishing_aspect: |
          Mode (a) combinatorial: >=3 inputs (base, companion_count, mobility equipment, UMNR flag,
          senior flag, TSA flag, service_tier multiplier, posture multiplier) with non-linear
          interaction (conditional fee inclusion THEN two chained multiplicative tiers).
        test_recipe:
          setup:
            - "Airport SJC NORMAL, meet_buffer 25"
            - "Terminal INTL with requires_secure_escort=true (forces tsa_fee)"
            - "DEPARTURE segment scheduled 2026-07-01T14:00:00Z"
            - "Passenger dob=2018-01-01 (UMNR at request time 2026-06) AND mobility_code=WCHC"
            - "service_tier=CONCIERGE (15000 bp = 1.5x), companion_count=2"
            - "Request submitted with one DEPARTURE_ESCORT leg"
          setup_api_calls:
            - call: "POST /maa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /maa/airports"
              payload: { iata_code: "SJC", tz_offset_minutes: -420, meet_buffer_minutes: 25 }
              as: PlatformAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /maa/airports/${ap_id}/terminals"
              payload: { code: "INTL", requires_secure_escort: true }
              as: PlatformAdmin
              captures: { term_id: $.data.id }
            - call: "POST /maa/airports/${ap_id}/segments"
              payload: { flight_no: "BA287", direction: "DEPARTURE", terminal_id: "${term_id}", scheduled_utc: "2026-07-01T14:00:00Z" }
              as: PlatformAdmin
              captures: { seg_id: $.data.id }
            - call: "POST /maa/passengers"
              payload: { full_name: "Kid U", dob: "2018-01-01", mobility_code: "WCHC", airline_pnr: "KID001" }
              as: Requester
              captures: { pax_id: $.data.id }
            - call: "POST /maa/assist-requests"
              payload: { passenger_id: "${pax_id}", bill_to: "AIRLINE", service_tier: "CONCIERGE", companion_count: 2, umnr_handoff_required: true }
              as: Requester
              captures: { req_id: $.data.id }
            - call: "POST /maa/assist-requests/${req_id}/legs"
              payload: { segment_id: "${seg_id}", leg_kind: "DEPARTURE_ESCORT", pickup_zone: "CURB-INTL" }
              as: Requester
              captures: { leg_id: $.data.id }
            - call: "GET /maa/assist-requests/${req_id}"
              as: Requester
              captures: { req_v: $.data.version }
          trigger:
            - call: "POST /maa/assist-requests/${req_id}/events"
              payload: { event_type: "SUBMIT", expected_assist_request_version: "${req_v}" }
              as: Requester
          assert:
            # base = 7500 (DEP_ESCORT) + 2*1500 (companion) + 1800 (WCHC) + 2500 (UMMR) + 0 (not senior) + 1200 (TSA) = 16000
            # tier 15000/10000 = 1.5, posture 10000/10000 = 1.0 → 16000 * 1.5 = 24000
            - "ServiceLeg.${leg_id}.provisional_leg_cents == 24000"
            - "AssistRequest.${req_id}.provisional_charge_cents == 24000"
            - "AssistRequest.${req_id}.billing_status == PROVISIONAL"

      - name: per_leg_rounding_then_sum_vs_sum_then_round_divergence
        grounds:
          - calculations.request_total_charge
          - calculations.provisional_leg_charge
        distinguishing_aspect: |
          Mode (b) nested-rounding-order: the scaffold PINS "round per-leg THEN sum". With two legs
          whose raw per-leg products end in .5 cents, rounding per-leg then summing produces a
          different total than summing then rounding. Divergence is observable at the AssistRequest
          provisional_charge_cents field.
        test_recipe:
          setup:
            - "Airport LAX NORMAL"
            - "Two legs on the same AssistRequest, both DEPARTURE_ESCORT"
            - "Choose base+fees such that each leg's pre-rounding product is X.5 cents (use service_tier=PRIORITY=12500bp and a base 7501-like configuration via companion_count=1 + WCHR equipment)"
            - "Actually: per-leg raw = (7500 + 1500 + 800 + 0 + 0 + 0) * 1.25 = 9800 * 1.25 = 12250 exactly — no fraction. To force .5 fractions, use base with an odd cents value: pick companion_count=1 AND service_tier=PRIORITY AND posture=DEGRADED for one leg at compute time. Per-leg raw = (7500+1500+800) * 1.25 * 1.25 = 9800 * 1.5625 = 15312.5 → rounds to 15313 (round_half_up). Two such legs: per-leg-round-then-sum = 30626; sum-then-round = round(30625.0) = 30625 — divergent by 1 cent."
            - "Set airport posture to DEGRADED BEFORE SUBMIT so both legs pick up posture_mult_bp=12500"
          setup_api_calls:
            - call: "POST /maa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /maa/airports"
              payload: { iata_code: "LAX", tz_offset_minutes: -420, meet_buffer_minutes: 15 }
              as: PlatformAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /maa/airports/${ap_id}/terminals"
              payload: { code: "T3", requires_secure_escort: false }
              as: PlatformAdmin
              captures: { term_id: $.data.id }
            - call: "POST /maa/airports/${ap_id}/segments"
              payload: { flight_no: "AA1", direction: "DEPARTURE", terminal_id: "${term_id}", scheduled_utc: "2026-07-02T10:00:00Z" }
              as: PlatformAdmin
              captures: { seg1_id: $.data.id }
            - call: "POST /maa/airports/${ap_id}/segments"
              payload: { flight_no: "AA2", direction: "DEPARTURE", terminal_id: "${term_id}", scheduled_utc: "2026-07-03T10:00:00Z" }
              as: PlatformAdmin
              captures: { seg2_id: $.data.id }
            - call: "POST /maa/passengers"
              payload: { full_name: "Ad X", dob: "1990-06-01", mobility_code: "WCHR", airline_pnr: "P1" }
              as: Requester
              captures: { pax_id: $.data.id }
            - call: "POST /maa/assist-requests"
              payload: { passenger_id: "${pax_id}", bill_to: "AIRLINE", service_tier: "PRIORITY", companion_count: 1 }
              as: Requester
              captures: { req_id: $.data.id }
            - call: "POST /maa/assist-requests/${req_id}/legs"
              payload: { segment_id: "${seg1_id}", leg_kind: "DEPARTURE_ESCORT", pickup_zone: "Z1" }
              as: Requester
              captures: { leg1_id: $.data.id }
            - call: "POST /maa/assist-requests/${req_id}/legs"
              payload: { segment_id: "${seg2_id}", leg_kind: "DEPARTURE_ESCORT", pickup_zone: "Z2" }
              as: Requester
              captures: { leg2_id: $.data.id }
            - call: "POST /maa/airports/${ap_id}/posture"
              payload: { posture: "DEGRADED" }
              as: OpsManager
            - call: "GET /maa/assist-requests/${req_id}"
              as: Requester
              captures: { req_v: $.data.version }
          trigger:
            - call: "POST /maa/assist-requests/${req_id}/events"
              payload: { event_type: "SUBMIT", expected_assist_request_version: "${req_v}" }
              as: Requester
          assert:
            # per-leg: (7500 + 1500 + 800) = 9800; * 1.25 (PRIORITY) = 12250; * 1.25 (DEGRADED) = 15312.5 → round_half_up → 15313 per leg
            # round-per-leg-then-sum = 15313 + 15313 = 30626
            # round-sum-then-round would give round(2 * 15312.5) = round(30625.0) = 30625
            - "ServiceLeg.${leg1_id}.provisional_leg_cents == 15313"
            - "ServiceLeg.${leg2_id}.provisional_leg_cents == 15313"
            - "AssistRequest.${req_id}.provisional_charge_cents == 30626"
            - "AssistRequest.${req_id}.provisional_charge_cents != 30625"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: assist_request_parallel_dimensions_request_x_billing
        grounds:
          - state_machines.AssistRequest
          - entities.AssistRequest.fields.request_status
          - entities.AssistRequest.fields.billing_status
        distinguishing_aspect: |
          AssistRequest carries TWO independent state dimensions on the same row (request_status
          and billing_status). Request can be COMPLETED on the request axis while billing axis
          independently walks FINALIZED → DISPUTED → PAID. The two evolve in parallel without a
          shared linear pipeline.
        test_recipe:
          setup:
            - "Standard 1-leg setup; walk through COMPLETE so request_status == COMPLETED and billing_status == FINALIZED"
          setup_api_calls:
            - call: "POST /maa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /maa/airports"
              payload: { iata_code: "PHX", tz_offset_minutes: -420, meet_buffer_minutes: 15 }
              as: PlatformAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /maa/airports/${ap_id}/terminals"
              payload: { code: "T4", requires_secure_escort: false }
              as: PlatformAdmin
              captures: { term_id: $.data.id }
            - call: "POST /maa/airports/${ap_id}/segments"
              payload: { flight_no: "DL9", direction: "ARRIVAL", terminal_id: "${term_id}", scheduled_utc: "2026-06-20T10:00:00Z" }
              as: PlatformAdmin
              captures: { seg_id: $.data.id }
            - call: "POST /maa/passengers"
              payload: { full_name: "Para P", dob: "1975-04-04", mobility_code: "WCHR", airline_pnr: "PP1" }
              as: Requester
              captures: { pax_id: $.data.id }
            - call: "POST /maa/assist-requests"
              payload: { passenger_id: "${pax_id}", bill_to: "AIRLINE", service_tier: "STANDARD", companion_count: 0 }
              as: Requester
              captures: { req_id: $.data.id }
            - call: "POST /maa/assist-requests/${req_id}/legs"
              payload: { segment_id: "${seg_id}", leg_kind: "MEET_ARRIVAL", pickup_zone: "Z" }
              as: Requester
              captures: { leg_id: $.data.id }
            - call: "POST /maa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T09:00:00Z" }
              as: PlatformAdmin
            - call: "GET /maa/assist-requests/${req_id}"
              as: Requester
              captures: { req_v: $.data.version }
            - call: "POST /maa/assist-requests/${req_id}/events"
              payload: { event_type: "SUBMIT", expected_assist_request_version: "${req_v}" }
              as: Requester
            - call: "POST /maa/airports/${ap_id}/agents"
