              payload: {}
              as: BrokerOps
            - call: "POST /sales-orders/${ord7_id}/ship"
              payload: {}
              as: BrokerOps
            - call: "POST /sales-orders/${ord7_id}/deliver"
              payload: {}
              as: BrokerOps
