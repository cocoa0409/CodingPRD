            - { call: "POST /api/test-programs", payload: { customer_id: "${cust}", part_number: "PN-237", bin_map: { "1": "PASS", "9": "HARD_FAIL" }, max_retests_per_unit: 1, burn_profile: [ { target_temp_c: 55, ramp_rate_c_per_min: 7, soak_minutes: 30 } ] }, as: TestEngineer, as_user_id: "eng-1", captures: { prog: $.data.id } }
            - { call: "POST /api/fixtures", payload: { program_id: "${prog}", serial_number: "FX-RD", site_count: 2 }, as: TestEngineer, as_user_id: "eng-1", captures: { fix: $.data.id } }
