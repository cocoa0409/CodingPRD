# =============================================================================
# §1.8 Difficulty Design — Timeshare Exchange Network Operations
# Nine difficulty rules, 20 instances. Every literal below was computed from the
# §1.3 constants; none is a placeholder.
#
# Shared assumptions for every recipe:
#   * The database starts empty and the logical clock starts at the mandatory
#     default 2026-08-01T00:00:00Z. A recipe only calls
#     POST /exchange-network/_clock/set_current_utc when it needs a later instant.
#   * Setting the clock has no side effects of its own; every time-driven
#     transition happens inside POST /exchange-network/matching-runs.
#   * Tier PLUS is created with annual_dues_cents 19900, base_exchange_fee_cents
#     20900, priority_surcharge_cents 2500, priority_window_days 365,
#     deposit_first_bonus_pct 10, max_active_requests 3, cancellation_fee_cents
#     8900, reinstatement_fee_cents 10900, extension_fee_cents_per_month 3400.
#   * Dues are paid with amount_cents 100000 and paid_through_date "2030-12-31"
#     unless the recipe is specifically about lapsing, so wallet_credit_cents
#     starts at 100000 - 19900 = 80100.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    rule_summary: >-
      Two named variants of one calculation, evaluated against two different
      as-of snapshots, must diverge on the same row and both be observable.
    instances:

      - name: deposit_power_awarded_vs_settlement_divergence
        calculation: deposit_trading_power
        variants: [AT_DEPOSIT, AT_SETTLEMENT]
        why_hard: >-
          awarded_power is frozen from the resort profile and lead time in force at deposit
          creation; settlement_power is recomputed from the resort profile and lead time in force
          at the matching run that reserves the week. An implementation that stores one number and
          reuses it for both, or that recomputes awarded_power when demand_index is patched, gets
          both the pair (107, 74) and the -33 reconciliation posting wrong. The reconciliation is
          posted to the DEPOSITING owner, not to the exchanging member, which is the second trap.
        test_recipe:
          setup: >-
            Tier PLUS. Resort A "Aspen Ridge Club" with units_per_size 2, demand_index 4,
            required_annual_deposit_units 2, initial_quality_rating GOLD_CROWN and a single GOLD
            band 04-01..06-30, affiliated at the default clock. Members M1 and M2 on PLUS, both
            dues-paid through 2030-12-31. M1 banks a TWO_BR week for 2027-06-15 while demand_index
            is 4; the operator then drops demand_index to 2 and the clock advances to 2027-01-15
            before the matching run settles that same week.
          setup_api_calls:
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "PLUS", annual_dues_cents: 19900, base_exchange_fee_cents: 20900, priority_surcharge_cents: 2500, priority_window_days: 365, deposit_first_bonus_pct: 10, max_active_requests: 3, cancellation_fee_cents: 8900, reinstatement_fee_cents: 10900, extension_fee_cents_per_month: 3400 }
              captures: { plus_tier: "$.data.id" }
            - call: "POST /exchange-network/resorts"
              as: NetworkOperator
              payload: { name: "Aspen Ridge Club", region_code: "US-CO", required_annual_deposit_units: 2, initial_quality_rating: "GOLD_CROWN", units_per_size: 2, demand_index: 4 }
              captures: { resort_a: "$.data.id" }
            - call: "POST /exchange-network/season-bands"
              as: NetworkOperator
              payload: { resort_id: "${resort_a}", band_code: "GOLD", start_month_day: "04-01", end_month_day: "06-30" }
            - call: "POST /exchange-network/resorts/${resort_a}/affiliation"
              as: NetworkOperator
              payload: {}
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m1@example.com", full_name: "Dana Oyelaran", tier_id: "${plus_tier}" }
              captures: { m1: "$.data.id", m1_v: "$.data.version" }
            - call: "POST /exchange-network/members/${m1}/dues-payments"
              as: Member
              as_user_id: "${m1}"
              payload: { amount_cents: 100000, paid_through_date: "2030-12-31", expected_member_version: "${m1_v}" }
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m2@example.com", full_name: "Priya Ravindran", tier_id: "${plus_tier}" }
              captures: { m2: "$.data.id", m2_v: "$.data.version" }
            - call: "POST /exchange-network/members/${m2}/dues-payments"
              as: Member
              as_user_id: "${m2}"
              payload: { amount_cents: 100000, paid_through_date: "2030-12-31", expected_member_version: "${m2_v}" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", resort_id: "${resort_a}", unit_size: "TWO_BR", check_in_date: "2027-06-15" }
              captures: { dep_m1: "$.data.id", dep_m1_awarded: "$.data.awarded_power" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m2}"
              payload: { member_id: "${m2}", resort_id: "${resort_a}", unit_size: "THREE_BR", check_in_date: "2027-05-10" }
              captures: { dep_m2: "$.data.id" }
            - call: "PATCH /exchange-network/resorts/${resort_a}"
              as: NetworkOperator
              payload: { demand_index: 2 }
            - call: "POST /exchange-network/_clock/set_current_utc"
              as: NetworkOperator
              payload: { to_iso8601: "2027-01-15T00:00:00Z" }
            - call: "POST /exchange-network/exchange-requests"
              as: Member
              as_user_id: "${m2}"
              payload: { member_id: "${m2}", requested_resort_id: "${resort_a}", requested_unit_size: "TWO_BR", window_start_date: "2027-06-01", window_end_date: "2027-06-30", deposit_id: "${dep_m2}" }
              captures: { req: "$.data.id" }
          trigger:
            - call: "POST /exchange-network/matching-runs"
              as: NetworkOperator
              payload: { note: "settle the TWO_BR week after the demand downgrade" }
              captures: { run1: "$.data.id" }
            - call: "POST /exchange-network/confirmations"
              as: Member
              as_user_id: "${m2}"
              payload: { exchange_request_id: "${req}" }
              captures: { conf: "$.data.id" }
          assert:
            - "GET /exchange-network/deposits/${dep_m1} — awarded_power == 107 (AT_DEPOSIT: 60 * 1.25 * 1.10 = 82.5 -> 83, +6 = 89, lead 318 -> factor 1.20, 106.8 -> 107)"
            - "GET /exchange-network/deposits/${dep_m1} — settlement_power == 74 (AT_SETTLEMENT: 60 * 1.25 * 0.90 = 67.5 -> 68, +6 = 74, lead 151 -> factor 1.00, 74)"
            - "GET /exchange-network/deposits/${dep_m1}/valuation — awarded_lead_time_days == 318 and settlement_lead_time_days == 151"
            - "GET /exchange-network/confirmations/${conf} — power_debited == 74 and status == \"CONFIRMED\""
            - "GET /exchange-network/members/${m2} — trading_power_balance == 65 (139 credited for the THREE_BR week, 74 debited at settlement)"
            - "GET /exchange-network/members/${m1} — trading_power_balance == 74 (107 credited at deposit, -33 SETTLEMENT_ADJUSTMENT at settlement)"
            - "GET /exchange-network/ledger-entries?member_id=${m1}&entry_type=SETTLEMENT_ADJUSTMENT — total_count == 1 and data[0].power_delta == -33"
            - "GET /exchange-network/ledger-entries?member_id=${m2}&entry_type=SETTLEMENT_ADJUSTMENT — total_count == 0 (the delta is never posted to the exchanging member)"

      - name: resort_obligation_shortfall_stay_year_vs_deposit_date
        calculation: resort_deposit_obligation_shortfall
        variants: [BY_STAY_YEAR, BY_DEPOSIT_DATE]
        why_hard: >-
          The same two deposits produce shortfall_by_stay_year 1 and shortfall_by_deposit_date 0
          because the second week is banked inside the affiliation year for a stay outside it. Only
          the BY_STAY_YEAR figure may drive probation. An implementation that counts on created_at
          (the natural choice) reports 0/0 and never puts a non-performing resort on probation; one
          that counts on check_in_date for both reports 1/1 and mis-reports the operator's
          reconciliation column.
        test_recipe:
          setup: >-
            Tier PLUS. Resort C "Pine Hollow Lodge" with units_per_size 3, demand_index 2,
            required_annual_deposit_units 2, initial_quality_rating STANDARD and one SILVER band
            covering the whole year, affiliated at the default clock 2026-08-01, so the affiliation
            year is [2026-08-01, 2027-08-01). Member M1 on PLUS, dues-paid through 2030-12-31, banks
            one STUDIO week checking in 2027-06-15 (inside the year) and then, with the clock moved
            to 2027-06-01, one TWO_BR week checking in 2027-10-15 (outside the year, but banked
            inside it).
          setup_api_calls:
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "PLUS", annual_dues_cents: 19900, base_exchange_fee_cents: 20900, priority_surcharge_cents: 2500, priority_window_days: 365, deposit_first_bonus_pct: 10, max_active_requests: 3, cancellation_fee_cents: 8900, reinstatement_fee_cents: 10900, extension_fee_cents_per_month: 3400 }
              captures: { plus_tier: "$.data.id" }
            - call: "POST /exchange-network/resorts"
              as: NetworkOperator
              payload: { name: "Pine Hollow Lodge", region_code: "US-MI", required_annual_deposit_units: 2, initial_quality_rating: "STANDARD", units_per_size: 3, demand_index: 2 }
              captures: { resort_c: "$.data.id" }
            - call: "POST /exchange-network/season-bands"
              as: NetworkOperator
              payload: { resort_id: "${resort_c}", band_code: "SILVER", start_month_day: "01-01", end_month_day: "12-31" }
            - call: "POST /exchange-network/resorts/${resort_c}/affiliation"
              as: NetworkOperator
              payload: {}
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m1@example.com", full_name: "Dana Oyelaran", tier_id: "${plus_tier}" }
              captures: { m1: "$.data.id", m1_v: "$.data.version" }
            - call: "POST /exchange-network/members/${m1}/dues-payments"
              as: Member
              as_user_id: "${m1}"
              payload: { amount_cents: 100000, paid_through_date: "2030-12-31", expected_member_version: "${m1_v}" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", resort_id: "${resort_c}", unit_size: "STUDIO", check_in_date: "2027-06-15" }
              captures: { dep_in_year: "$.data.id" }
            - call: "POST /exchange-network/_clock/set_current_utc"
              as: NetworkOperator
              payload: { to_iso8601: "2027-06-01T00:00:00Z" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", resort_id: "${resort_c}", unit_size: "TWO_BR", check_in_date: "2027-10-15" }
              captures: { dep_out_of_year: "$.data.id" }
          trigger:
            - call: "GET /exchange-network/resorts/${resort_c}/compliance"
              as: NetworkOperator
              payload: {}
            - call: "POST /exchange-network/matching-runs"
              as: NetworkOperator
              payload: { note: "no deposit expires, so no probation evaluation runs" }
              captures: { run1: "$.data.id" }
          assert:
            - "GET /exchange-network/resorts/${resort_c}/compliance — affiliation_year_start == \"2026-08-01\" and affiliation_year_end == \"2027-08-01\""
            - "GET /exchange-network/resorts/${resort_c}/compliance — obligation_units == 2 and deposits_committed_count == 2 and committed_nights == 16"
            - "GET /exchange-network/resorts/${resort_c}/compliance — counted_by_stay_year == 1 and shortfall_by_stay_year == 1"
            - "GET /exchange-network/resorts/${resort_c}/compliance — counted_by_deposit_date == 2 and shortfall_by_deposit_date == 0"
            - "GET /exchange-network/deposits/${dep_in_year} — awarded_power == 32 (30 * 1.00 * 0.90 = 27, +0, lead 318 -> factor 1.20, 32.4 -> 32)"
            - "GET /exchange-network/deposits/${dep_out_of_year} — awarded_power == 54 (60 * 1.00 * 0.90 = 54.0 -> 54, +0, lead 136 -> factor 1.00, 54)"
            - "GET /exchange-network/matching-runs/${run1} — expired_deposit_count == 0 and probation_resort_count == 0"
            - "GET /exchange-network/resorts/${resort_c} — affiliation_status == \"ACTIVE\" (a non-zero BY_STAY_YEAR shortfall alone does not trigger probation; only the step 1 expiry cascade evaluates it)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    rule_summary: >-
      A formula whose evaluation order or band-selection key is itself the rule,
      such that the plausible alternative arrangement of the same inputs yields a
      different, wrong answer.
    instances:

      - name: deposit_power_nested_rounding_order
        mode: "(b) pinned intermediate rounding order"
        calculation: deposit_trading_power
        why_hard: >-
          The formula rounds twice — once after base * season_mult * demand_mult and once after the
          lead factor — and adds the quality bonus between the two roundings. With STUDIO,
          PLATINUM, demand_index 4, GOLD_CROWN and a lead of exactly 185 days the pinned order
          gives round(49.5) = 50, +6 = 56, round(61.6) = 62. Collapsing to a single final rounding
          gives round((49.5 + 6) * 1.10) = round(61.05) = 61. Only 62 is correct, and 30 * 1.5 *
          1.1 = 49.5 is deliberately a half-value so the first rounding is load-bearing.
        test_recipe:
          setup: >-
            Tier PLUS. Resort A with units_per_size 2, demand_index 4, initial_quality_rating
            GOLD_CROWN and a PLATINUM band 01-01..03-31, affiliated at the default clock
            2026-08-01. Member M1 on PLUS, dues-paid. M1 banks a STUDIO week checking in
            2027-02-02, which is exactly 185 days out.
          setup_api_calls:
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "PLUS", annual_dues_cents: 19900, base_exchange_fee_cents: 20900, priority_surcharge_cents: 2500, priority_window_days: 365, deposit_first_bonus_pct: 10, max_active_requests: 3, cancellation_fee_cents: 8900, reinstatement_fee_cents: 10900, extension_fee_cents_per_month: 3400 }
              captures: { plus_tier: "$.data.id" }
            - call: "POST /exchange-network/resorts"
              as: NetworkOperator
              payload: { name: "Aspen Ridge Club", region_code: "US-CO", required_annual_deposit_units: 2, initial_quality_rating: "GOLD_CROWN", units_per_size: 2, demand_index: 4 }
              captures: { resort_a: "$.data.id" }
            - call: "POST /exchange-network/season-bands"
              as: NetworkOperator
              payload: { resort_id: "${resort_a}", band_code: "PLATINUM", start_month_day: "01-01", end_month_day: "03-31" }
            - call: "POST /exchange-network/resorts/${resort_a}/affiliation"
              as: NetworkOperator
              payload: {}
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m1@example.com", full_name: "Dana Oyelaran", tier_id: "${plus_tier}" }
              captures: { m1: "$.data.id", m1_v: "$.data.version" }
            - call: "POST /exchange-network/members/${m1}/dues-payments"
              as: Member
              as_user_id: "${m1}"
              payload: { amount_cents: 100000, paid_through_date: "2030-12-31", expected_member_version: "${m1_v}" }
          trigger:
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", resort_id: "${resort_a}", unit_size: "STUDIO", check_in_date: "2027-02-02" }
              captures: { dep: "$.data.id", dep_power: "$.data.awarded_power" }
          assert:
            - "trigger response — awarded_power == 62, NOT 61"
            - "GET /exchange-network/deposits/${dep} — season_band_code == \"PLATINUM\" and remaining_power == 62"
            - "GET /exchange-network/deposits/${dep}/valuation — unit_size_base == 30, season_multiplier == 1.50, demand_multiplier == 1.10, quality_bonus == 6, awarded_lead_time_days == 185"
            - "GET /exchange-network/members/${m1} — trading_power_balance == 62"
            - "GET /exchange-network/ledger-entries?member_id=${m1}&entry_type=DEPOSIT_CREDIT — total_count == 1 and data[0].power_delta == 62"

      - name: exchange_charge_band_keyed_on_subtotal_not_total
        mode: "(c) band selected on the pre-credit subtotal, never on the net"
        calculation: exchange_charge
        why_hard: >-
          Both the deposit-first credit band and the processing-fee band are keyed on the same
          pre-credit subtotal_cents. With subtotal 30400 the credit is 10 percent (3040) and the
          processing fee is 2900 because 30400 exceeds 29999, giving 30260. Re-keying the
          processing-fee band on the post-credit 27360 drops it into the 2000 band and yields
          29360. The 30400 subtotal is chosen to sit 400 cents above the 29999 boundary and 3040
          above it after the credit, so exactly one of the two keying choices survives.
        test_recipe:
          setup: >-
            Tier PLUS. Resort C with units_per_size 3, demand_index 2, initial_quality_rating
            STANDARD, required_annual_deposit_units 2 and a SILVER band covering the whole year,
            affiliated at the default clock. Member M2 on PLUS with wallet 80100. M2 banks a small
            STUDIO week (awarded 27, budget 29) and then asks for a much more valuable ONE_BR week
            (estimate 49), leaving a 20-point gap worth 7000 cents.
          setup_api_calls:
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "PLUS", annual_dues_cents: 19900, base_exchange_fee_cents: 20900, priority_surcharge_cents: 2500, priority_window_days: 365, deposit_first_bonus_pct: 10, max_active_requests: 3, cancellation_fee_cents: 8900, reinstatement_fee_cents: 10900, extension_fee_cents_per_month: 3400 }
              captures: { plus_tier: "$.data.id" }
            - call: "POST /exchange-network/resorts"
              as: NetworkOperator
              payload: { name: "Pine Hollow Lodge", region_code: "US-MI", required_annual_deposit_units: 2, initial_quality_rating: "STANDARD", units_per_size: 3, demand_index: 2 }
              captures: { resort_c: "$.data.id" }
            - call: "POST /exchange-network/season-bands"
              as: NetworkOperator
              payload: { resort_id: "${resort_c}", band_code: "SILVER", start_month_day: "01-01", end_month_day: "12-31" }
            - call: "POST /exchange-network/resorts/${resort_c}/affiliation"
              as: NetworkOperator
              payload: {}
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m2@example.com", full_name: "Priya Ravindran", tier_id: "${plus_tier}" }
              captures: { m2: "$.data.id", m2_v: "$.data.version" }
            - call: "POST /exchange-network/members/${m2}/dues-payments"
              as: Member
              as_user_id: "${m2}"
              payload: { amount_cents: 100000, paid_through_date: "2030-12-31", expected_member_version: "${m2_v}" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m2}"
              payload: { member_id: "${m2}", resort_id: "${resort_c}", unit_size: "STUDIO", check_in_date: "2026-11-01" }
              captures: { dep_m2: "$.data.id" }
          trigger:
            - call: "POST /exchange-network/exchange-requests"
              as: Member
              as_user_id: "${m2}"
              payload: { member_id: "${m2}", requested_resort_id: "${resort_c}", requested_unit_size: "ONE_BR", window_start_date: "2027-06-01", window_end_date: "2027-06-30", deposit_id: "${dep_m2}" }
              captures: { req: "$.data.id", quoted: "$.data.quoted_charge_cents" }
          assert:
            - "GET /exchange-network/deposits/${dep_m2} — awarded_power == 27 (30 * 1.00 * 0.90 = 27, +0, lead 92 -> factor 1.00)"
            - "trigger response — funding_mode == \"DEPOSIT_FIRST\", power_budget == 29 (floor(27 * 110 / 100)) and required_power_estimate == 49 (45 * 0.90 = 40.5 -> 41, +0, lead 304 -> factor 1.20, 49.2 -> 49)"
            - "trigger response — quoted_charge_cents == 30260 (gap 20, shortfall 7000, subtotal 30400, credit 3040 at 10 percent, processing fee 2900), NOT 29360"
            - "GET /exchange-network/members/${m2} — wallet_credit_cents == 49840 (80100 - 30260)"
            - "GET /exchange-network/ledger-entries?member_id=${m2}&entry_type=EXCHANGE_CHARGE — total_count == 1 and data[0].cash_delta_cents == -30260"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    rule_summary: >-
      A state graph with a genuine cycle or fork where re-entry into a
      previously occupied state is observably different from the first entry.
    instances:

      - name: exchange_request_match_decline_rematch_cycle
        entity: ExchangeRequest
        cycle: "SUBMITTED -> MATCHED -> WAITLISTED -> MATCHED"
        why_hard: >-
          Declining an offered match is not a rollback: the held deposit returns to BANKED, the
          request returns to WAITLISTED, and decline_count rises, so the next matching run recomputes
          priority_score 5 points lower (35 -> 30). Re-entering MATCHED therefore lands on a
          different deposit and a different score than the first entry. An implementation that
          treats decline as "cancel and resubmit", that forgets to release the held deposit, or that
          never recomputes priority_score for a WAITLISTED request will diverge on at least three
          asserted fields.
        test_recipe:
          setup: >-
            Tier PLUS. Resort A with units_per_size 2, demand_index 4, GOLD_CROWN and a GOLD band
            04-01..06-30, affiliated at the default clock. Members M1 and M2 on PLUS, dues-paid. M1
            banks two ONE_BR weeks, checking in 2027-06-15 (deposit P) and 2027-06-20 (deposit Q),
            both worth 82. M2 banks a THREE_BR week for 2027-05-10 (worth 139) and uses it to fund a
            DEPOSIT_FIRST ONE_BR request over the window 2027-06-01..2027-06-30, giving a power
            budget of 152.
          setup_api_calls:
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "PLUS", annual_dues_cents: 19900, base_exchange_fee_cents: 20900, priority_surcharge_cents: 2500, priority_window_days: 365, deposit_first_bonus_pct: 10, max_active_requests: 3, cancellation_fee_cents: 8900, reinstatement_fee_cents: 10900, extension_fee_cents_per_month: 3400 }
              captures: { plus_tier: "$.data.id" }
            - call: "POST /exchange-network/resorts"
              as: NetworkOperator
              payload: { name: "Aspen Ridge Club", region_code: "US-CO", required_annual_deposit_units: 2, initial_quality_rating: "GOLD_CROWN", units_per_size: 2, demand_index: 4 }
              captures: { resort_a: "$.data.id" }
            - call: "POST /exchange-network/season-bands"
              as: NetworkOperator
              payload: { resort_id: "${resort_a}", band_code: "GOLD", start_month_day: "04-01", end_month_day: "06-30" }
            - call: "POST /exchange-network/resorts/${resort_a}/affiliation"
              as: NetworkOperator
              payload: {}
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m1@example.com", full_name: "Dana Oyelaran", tier_id: "${plus_tier}" }
              captures: { m1: "$.data.id", m1_v: "$.data.version" }
            - call: "POST /exchange-network/members/${m1}/dues-payments"
              as: Member
              as_user_id: "${m1}"
              payload: { amount_cents: 100000, paid_through_date: "2030-12-31", expected_member_version: "${m1_v}" }
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m2@example.com", full_name: "Priya Ravindran", tier_id: "${plus_tier}" }
              captures: { m2: "$.data.id", m2_v: "$.data.version" }
            - call: "POST /exchange-network/members/${m2}/dues-payments"
              as: Member
              as_user_id: "${m2}"
              payload: { amount_cents: 100000, paid_through_date: "2030-12-31", expected_member_version: "${m2_v}" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", resort_id: "${resort_a}", unit_size: "ONE_BR", check_in_date: "2027-06-15" }
              captures: { dep_p: "$.data.id" }
