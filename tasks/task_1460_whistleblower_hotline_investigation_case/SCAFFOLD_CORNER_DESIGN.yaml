scaffold_corner_design:
  # =====================================================================
  # Section: entities
  # =====================================================================
  - section: entities
    instances:
      - name: staff_member_creation_applies_defaults
        claim_type: creation_defaults
        grounds:
          - 'entities.StaffMember.fields.employment_status'
          - 'endpoints."POST /hotline/staff-members"'
        distinguishing_aspect: "Omitting employment_status applies the default ACTIVE; system stamps version 1 and a UUID id."
        test_recipe:
          setup: ["No preconditions beyond admin role"]
          setup_api_calls: []
          trigger:
            - { call: "POST /hotline/staff-members", payload: { display_name: "Olivia Officer", email: "officer@corp.example", department: "Ethics", capabilities: [OFFICER], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { st_def: $.data.employment_status, st_ver: $.data.version, st_cnt: $.data.active_case_count } }
          assert:
            - "st_def == ACTIVE (default applied)"
            - "st_ver == 1 and st_cnt == 0"

      - name: case_intake_mints_key_and_received_state
        claim_type: system_fields
        grounds:
          - 'entities.HotlineCase.fields.reporter_access_key'
          - 'entities.HotlineCase.fields.received_at'
          - 'endpoints."POST /hotline/cases"'
        distinguishing_aspect: "Intake returns reporter_access_key exactly once (creation response), stamps status RECEIVED and received_at from the logical clock default 2026-08-01T00:00:00Z."
        test_recipe:
          setup: ["Clock untouched (default 2026-08-01T00:00:00Z)"]
          setup_api_calls: []
          trigger:
            - { call: "POST /hotline/cases", payload: { channel: WEB_PORTAL, category: FRAUD, description: "Allegation of expense fraud in Q2", region: NORTH, subject_employee_ids: [] }, as: HotlineReporter, as_user_id: "anon-e1", captures: { c_st: $.data.status, c_key: $.data.reporter_access_key, c_recv: $.data.received_at, c_ver: $.data.version, c_anon: $.data.is_anonymous } }
          assert:
            - "c_st == RECEIVED and c_ver == 1"
            - "c_recv == 2026-08-01T00:00:00Z (logical clock default, not wall clock)"
            - "c_key is a non-empty string; c_anon == true (default)"

      - name: case_create_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds:
          - 'errors[ERR_INVALID_REQUEST]'
          - 'endpoints."POST /hotline/cases"'
        distinguishing_aspect: "Omitting required field description is rejected at priority 6 input validation."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - { call: "POST /hotline/cases", payload: { channel: WEB_PORTAL, category: FRAUD, region: NORTH }, as: HotlineReporter, as_user_id: "anon-e2", captures: { err_id: "$.data.error_id" } }
          assert:
            - "err_id == ERR_INVALID_REQUEST (http 400)"

      - name: case_create_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - 'entities.HotlineCase.fields.category'
          - 'errors[ERR_INVALID_REQUEST]'
        distinguishing_aspect: "category outside the declared enum is rejected."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - { call: "POST /hotline/cases", payload: { channel: WEB_PORTAL, category: THEFT, description: "Allegation of expense fraud in Q2", region: NORTH, subject_employee_ids: [] }, as: HotlineReporter, as_user_id: "anon-e3", captures: { err_id: "$.data.error_id" } }
          assert:
            - "err_id == ERR_INVALID_REQUEST (THEFT not in category enum)"

      - name: identified_report_requires_contact_and_staff_view_redacts
        claim_type: computed_fields
        grounds:
          - 'entities.HotlineCase.fields.reporter_contact'
          - 'entities.HotlineCase.fields.reporter_access_key'
        distinguishing_aspect: "is_anonymous=false requires reporter_contact at intake, and no staff-facing response ever contains reporter_contact or reporter_access_key."
        test_recipe:
          setup: ["Officer staff exists"]
          setup_api_calls:
            - { call: "POST /hotline/staff-members", payload: { display_name: "Olivia Officer", email: "officer@corp.example", department: "Ethics", capabilities: [OFFICER], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_off: $.data.id } }
            - { call: "POST /hotline/cases", payload: { channel: EMAIL, category: HARASSMENT, description: "Allegation of hostile workplace conduct", region: EAST, is_anonymous: false, reporter_contact: "jane.doe@example.com", subject_employee_ids: [] }, as: HotlineReporter, as_user_id: "jane-ext-1", captures: { c1: $.data.id } }
          trigger:
            - { call: "GET /hotline/cases/${c1}", as: ComplianceOfficer, as_user_id: "${s_off}" }
          assert:
            - "GET response data contains neither reporter_contact nor reporter_access_key keys"
            - "GET /hotline/cases list rows likewise omit both keys"

      - name: reporter_status_returns_redacted_inline_view
        claim_type: retrieval
        grounds:
          - 'endpoints."GET /hotline/cases/{id}/reporter-status"'
        distinguishing_aspect: "Reporter self-view returns the inline shape { case_status, severity, closure_summary, monitoring_active } keyed by the access key."
        test_recipe:
          setup: ["One case created"]
          setup_api_calls:
            - { call: "POST /hotline/cases", payload: { channel: WEB_PORTAL, category: FRAUD, description: "Allegation of expense fraud in Q2", region: NORTH, subject_employee_ids: [] }, as: HotlineReporter, as_user_id: "anon-e4", captures: { c1: $.data.id, key1: $.data.reporter_access_key } }
          trigger:
            - { call: "GET /hotline/cases/${c1}/reporter-status", as: HotlineReporter, as_user_id: "${key1}", captures: { rs_st: $.data.case_status, rs_mon: $.data.monitoring_active } }
          assert:
            - "rs_st == RECEIVED and rs_mon == false"
            - "severity and closure_summary are null before triage/closure"

      - name: case_get_nonexistent_returns_not_found
        claim_type: not_found
        grounds:
          - 'errors[ERR_NOT_FOUND]'
        distinguishing_aspect: "Unknown case id yields 404 ERR_NOT_FOUND (existence, priority 5)."
        test_recipe:
          setup: ["Officer staff exists"]
          setup_api_calls:
            - { call: "POST /hotline/staff-members", payload: { display_name: "Olivia Officer", email: "officer@corp.example", department: "Ethics", capabilities: [OFFICER], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_off: $.data.id } }
          trigger:
            - { call: "GET /hotline/cases/11111111-1111-1111-1111-111111111111", as: ComplianceOfficer, as_user_id: "${s_off}", captures: { err_id: "$.data.error_id" } }
          assert:
            - "err_id == ERR_NOT_FOUND (http 404)"

      - name: case_list_pagination_envelope
        claim_type: listing
        grounds:
          - 'endpoints."GET /hotline/cases"'
          - 'response_envelope'
        distinguishing_aspect: "List endpoint honors limit/offset and reports total_count/has_more per the fixed envelope."
        test_recipe:
          setup: ["Officer staff; three cases created"]
          setup_api_calls:
            - { call: "POST /hotline/staff-members", payload: { display_name: "Olivia Officer", email: "officer@corp.example", department: "Ethics", capabilities: [OFFICER], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_off: $.data.id } }
            - { call: "POST /hotline/cases", payload: { channel: WEB_PORTAL, category: FRAUD, description: "Allegation of expense fraud case one", region: NORTH, subject_employee_ids: [] }, as: HotlineReporter, as_user_id: "anon-p1" }
            - { call: "POST /hotline/cases", payload: { channel: PHONE, category: SAFETY, description: "Allegation of unsafe practice case two", region: SOUTH, subject_employee_ids: [] }, as: HotlineReporter, as_user_id: "anon-p2" }
            - { call: "POST /hotline/cases", payload: { channel: EMAIL, category: OTHER, description: "Allegation of policy lapse case three", region: EAST, subject_employee_ids: [] }, as: HotlineReporter, as_user_id: "anon-p3" }
          trigger:
            - { call: "GET /hotline/cases?limit=2&offset=0", as: ComplianceOfficer, as_user_id: "${s_off}" }
          assert:
            - "response_type == array and data length == 2"
            - "total_count == 3 and has_more == true"
            - "GET with limit=2&offset=2 returns 1 row and has_more == false"

  # =====================================================================
  # Section: state_machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: triage_reject_as_duplicate_links_cases
        claim_type: valid_transition
        grounds:
          - 'state_machines.HotlineCase.RECEIVED_to_REJECTED'
          - 'entities.HotlineCase.fields.duplicate_of_case_id'
        distinguishing_aspect: "REJECT with duplicate_of_case_id pointing at a non-terminal case stores the self-referential link and transitions to REJECTED."
        test_recipe:
          setup: ["Intake staff; case1 TRIAGED (non-terminal); case2 RECEIVED"]
          setup_api_calls:
            - { call: "POST /hotline/staff-members", payload: { display_name: "Ingrid Intake", email: "intake@corp.example", department: "Ethics", capabilities: [INTAKE], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_int: $.data.id } }
            - { call: "POST /hotline/cases", payload: { channel: WEB_PORTAL, category: FRAUD, description: "Allegation of expense fraud case one", region: NORTH, subject_employee_ids: [] }, as: HotlineReporter, as_user_id: "anon-d1", captures: { c1: $.data.id } }
            - { call: "POST /hotline/cases/${c1}/triage", payload: { confirmed_category: FRAUD, subject_seniority: STAFF, financial_exposure_band: NONE, reporter_vulnerability: NONE, triage_decision: PROCEED }, as: IntakeSpecialist, as_user_id: "${s_int}" }
            - { call: "POST /hotline/cases", payload: { channel: PHONE, category: FRAUD, description: "Same fraud reported a second time", region: NORTH, subject_employee_ids: [] }, as: HotlineReporter, as_user_id: "anon-d2", captures: { c2: $.data.id } }
          trigger:
            - { call: "POST /hotline/cases/${c2}/triage", payload: { confirmed_category: FRAUD, subject_seniority: STAFF, financial_exposure_band: NONE, reporter_vulnerability: NONE, triage_decision: REJECT, reject_reason: "Duplicate of earlier report", duplicate_of_case_id: "${c1}" }, as: IntakeSpecialist, as_user_id: "${s_int}", captures: { c2_st: $.data.status, c2_dup: $.data.duplicate_of_case_id } }
          assert:
            - "c2_st == REJECTED and c2_dup == ${c1}"
            - "case2 severity remains null (no severity computed on reject)"

      - name: triage_reject_duplicate_terminal_target_rejected
        claim_type: precondition_enforcement
        grounds:
          - 'state_machines.HotlineCase.RECEIVED_to_REJECTED'
          - 'errors[ERR_DUPLICATE_TARGET_INVALID]'
        distinguishing_aspect: "duplicate_of_case_id pointing at a terminal (REJECTED) case is rejected with ERR_DUPLICATE_TARGET_INVALID."
        test_recipe:
          setup: ["Intake staff; caseA already REJECTED; caseB RECEIVED"]
          setup_api_calls:
            - { call: "POST /hotline/staff-members", payload: { display_name: "Ingrid Intake", email: "intake@corp.example", department: "Ethics", capabilities: [INTAKE], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_int: $.data.id } }
            - { call: "POST /hotline/cases", payload: { channel: WEB_PORTAL, category: OTHER, description: "Out of scope complaint about payroll", region: WEST, subject_employee_ids: [] }, as: HotlineReporter, as_user_id: "anon-ta", captures: { ca: $.data.id } }
            - { call: "POST /hotline/cases/${ca}/triage", payload: { confirmed_category: OTHER, subject_seniority: UNKNOWN, financial_exposure_band: NONE, reporter_vulnerability: NONE, triage_decision: REJECT, reject_reason: "Out of scope" }, as: IntakeSpecialist, as_user_id: "${s_int}" }
            - { call: "POST /hotline/cases", payload: { channel: PHONE, category: OTHER, description: "Repeat of the same payroll complaint", region: WEST, subject_employee_ids: [] }, as: HotlineReporter, as_user_id: "anon-tb", captures: { cb: $.data.id } }
          trigger:
            - { call: "POST /hotline/cases/${cb}/triage", payload: { confirmed_category: OTHER, subject_seniority: UNKNOWN, financial_exposure_band: NONE, reporter_vulnerability: NONE, triage_decision: REJECT, reject_reason: "Duplicate", duplicate_of_case_id: "${ca}" }, as: IntakeSpecialist, as_user_id: "${s_int}", captures: { err_id: "$.data.error_id" } }
          assert:
            - "err_id == ERR_DUPLICATE_TARGET_INVALID (target ${ca} is REJECTED = terminal)"

      - name: withdraw_then_terminal_lockdown
        claim_type: terminal_lockdown
        grounds:
          - 'state_machines.HotlineCase.RECEIVED_to_WITHDRAWN'
          - 'errors[ERR_CASE_NOT_WITHDRAWABLE]'
        distinguishing_aspect: "Reporter withdraw works from RECEIVED; a second withdraw on the WITHDRAWN case is rejected."
        test_recipe:
          setup: ["One RECEIVED case with known access key"]
          setup_api_calls:
            - { call: "POST /hotline/cases", payload: { channel: WEB_PORTAL, category: FRAUD, description: "Allegation of expense fraud in Q2", region: NORTH, subject_employee_ids: [] }, as: HotlineReporter, as_user_id: "anon-w1", captures: { c1: $.data.id, key1: $.data.reporter_access_key } }
          trigger:
            - { call: "POST /hotline/cases/${c1}/withdraw", as: HotlineReporter, as_user_id: "${key1}", captures: { st1: $.data.status } }
            - { call: "POST /hotline/cases/${c1}/withdraw", as: HotlineReporter, as_user_id: "${key1}", captures: { err_id: "$.data.error_id" } }
          assert:
            - "st1 == WITHDRAWN"
            - "second withdraw: err_id == ERR_CASE_NOT_WITHDRAWABLE (terminal lockdown)"

      - name: withdraw_forbidden_once_assigned
        claim_type: invalid_transition
        grounds:
          - 'state_machines.HotlineCase.TRIAGED_to_WITHDRAWN'
          - 'errors[ERR_CASE_NOT_WITHDRAWABLE]'
        distinguishing_aspect: "Withdraw is only legal from RECEIVED/TRIAGED; from ASSIGNED it fails even for the key-holding reporter."
        test_recipe:
          setup: ["intake + inv staff; case TRIAGED then ASSIGNED via auto-route"]
          setup_api_calls:
            - { call: "POST /hotline/staff-members", payload: { display_name: "Ingrid Intake", email: "intake@corp.example", department: "Ethics", capabilities: [INTAKE], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_int: $.data.id } }
            - { call: "POST /hotline/staff-members", payload: { display_name: "Ian Vest", email: "investigator@corp.example", department: "Ops", capabilities: [INVESTIGATION], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_inv: $.data.id } }
            - { call: "POST /hotline/cases", payload: { channel: WEB_PORTAL, category: FRAUD, description: "Allegation of expense fraud in Q2", region: NORTH, subject_employee_ids: [] }, as: HotlineReporter, as_user_id: "anon-w2", captures: { c1: $.data.id, key1: $.data.reporter_access_key } }
            - { call: "POST /hotline/cases/${c1}/triage", payload: { confirmed_category: FRAUD, subject_seniority: STAFF, financial_exposure_band: NONE, reporter_vulnerability: NONE, triage_decision: PROCEED }, as: IntakeSpecialist, as_user_id: "${s_int}", captures: { c1_v: $.data.version } }
            - { call: "POST /hotline/cases/${c1}/assignments", payload: { expected_case_version: "${c1_v}" }, as: IntakeSpecialist, as_user_id: "${s_int}" }
          trigger:
            - { call: "POST /hotline/cases/${c1}/withdraw", as: HotlineReporter, as_user_id: "${key1}", captures: { err_id: "$.data.error_id" } }
          assert:
            - "err_id == ERR_CASE_NOT_WITHDRAWABLE (case is ASSIGNED, beyond reporter withdrawal)"

      - name: conflict_screening_waiver_fork
        claim_type: valid_transition
        grounds:
          - 'state_machines.CaseAssignment.PROPOSED_to_CONFLICT_PENDING'
          - 'state_machines.CaseAssignment.CONFLICT_PENDING_to_CLEARED'
          - 'state_machines.CaseAssignment.CLEARED_to_ACTIVE'
        distinguishing_aspect: "Assignment fork: CONFLICT_FOUND branches to CONFLICT_PENDING, a waiver by a third officer rejoins at CLEARED, and activation proceeds — the full conflict path of the fork-join."
        test_recipe:
          setup: ["intake, off1, off2, inv staff; case TRIAGED; override assignment to inv PROPOSED"]
          setup_api_calls:
            - { call: "POST /hotline/staff-members", payload: { display_name: "Ingrid Intake", email: "intake@corp.example", department: "Ethics", capabilities: [INTAKE], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_int: $.data.id } }
            - { call: "POST /hotline/staff-members", payload: { display_name: "Olivia Officer", email: "officer@corp.example", department: "Ethics", capabilities: [OFFICER], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_off: $.data.id } }
            - { call: "POST /hotline/staff-members", payload: { display_name: "Oscar Officer", email: "officer2@corp.example", department: "Ethics", capabilities: [OFFICER], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_off2: $.data.id } }
            - { call: "POST /hotline/staff-members", payload: { display_name: "Ian Vest", email: "investigator@corp.example", department: "Ops", capabilities: [INVESTIGATION], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_inv: $.data.id } }
            - { call: "POST /hotline/cases", payload: { channel: WEB_PORTAL, category: FRAUD, description: "Allegation of expense fraud in Q2", region: NORTH, subject_employee_ids: [] }, as: HotlineReporter, as_user_id: "anon-cf", captures: { c1: $.data.id } }
            - { call: "POST /hotline/cases/${c1}/triage", payload: { confirmed_category: FRAUD, subject_seniority: STAFF, financial_exposure_band: NONE, reporter_vulnerability: NONE, triage_decision: PROCEED }, as: IntakeSpecialist, as_user_id: "${s_int}", captures: { c1_v: $.data.version } }
            - { call: "POST /hotline/cases/${c1}/assignments", payload: { expected_case_version: "${c1_v}", investigator_id: "${s_inv}", override_reason: "Domain expertise" }, as: ComplianceOfficer, as_user_id: "${s_off}", captures: { a1: $.data.id } }
          trigger:
            - { call: "POST /hotline/assignments/${a1}/screen", payload: { outcome: CONFLICT_FOUND, conflict_type: PERSONAL_RELATIONSHIP, notes: "College roommate of subject" }, as: IntakeSpecialist, as_user_id: "${s_int}", captures: { st1: $.data.status } }
            - { call: "POST /hotline/assignments/${a1}/waive-conflict", payload: { waiver_justification: "Conflict is remote and documented; monitoring added." }, as: ComplianceOfficer, as_user_id: "${s_off2}", captures: { st2: $.data.status, wv: $.data.waived_by_id } }
            - { call: "POST /hotline/assignments/${a1}/activate", as: ComplianceOfficer, as_user_id: "${s_off}", captures: { st3: $.data.status } }
          assert:
            - "st1 == CONFLICT_PENDING with conflict_type PERSONAL_RELATIONSHIP"
            - "st2 == CLEARED and wv == ${s_off2} (waiver officer differs from screener ${s_int} and candidate ${s_inv})"
            - "st3 == ACTIVE and case reaches UNDER_INVESTIGATION"

      - name: screen_by_candidate_returns_sod_self_screen
        claim_type: precondition_enforcement
        grounds:
          - 'state_machines.CaseAssignment.PROPOSED_to_CLEARED'
          - 'errors[ERR_SOD_SELF_SCREEN]'
        distinguishing_aspect: "The candidate investigator cannot screen their own assignment."
        test_recipe:
          setup: ["intake, off1, inv staff; assignment PROPOSED to inv"]
          setup_api_calls:
            - { call: "POST /hotline/staff-members", payload: { display_name: "Ingrid Intake", email: "intake@corp.example", department: "Ethics", capabilities: [INTAKE], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_int: $.data.id } }
            - { call: "POST /hotline/staff-members", payload: { display_name: "Olivia Officer", email: "officer@corp.example", department: "Ethics", capabilities: [OFFICER], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_off: $.data.id } }
            - { call: "POST /hotline/staff-members", payload: { display_name: "Ian Vest", email: "investigator@corp.example", department: "Ops", capabilities: [INVESTIGATION], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_inv: $.data.id } }
            - { call: "POST /hotline/cases", payload: { channel: WEB_PORTAL, category: FRAUD, description: "Allegation of expense fraud in Q2", region: NORTH, subject_employee_ids: [] }, as: HotlineReporter, as_user_id: "anon-ss", captures: { c1: $.data.id } }
            - { call: "POST /hotline/cases/${c1}/triage", payload: { confirmed_category: FRAUD, subject_seniority: STAFF, financial_exposure_band: NONE, reporter_vulnerability: NONE, triage_decision: PROCEED }, as: IntakeSpecialist, as_user_id: "${s_int}", captures: { c1_v: $.data.version } }
            - { call: "POST /hotline/cases/${c1}/assignments", payload: { expected_case_version: "${c1_v}", investigator_id: "${s_inv}", override_reason: "Domain expertise" }, as: ComplianceOfficer, as_user_id: "${s_off}", captures: { a1: $.data.id } }
          trigger:
            - { call: "POST /hotline/assignments/${a1}/screen", payload: { outcome: CLEAR }, as: Investigator, as_user_id: "${s_inv}", captures: { err_id: "$.data.error_id" } }
          assert:
            - "err_id == ERR_SOD_SELF_SCREEN (screener == candidate)"

      - name: waive_by_screening_officer_returns_sod_self_waiver
        claim_type: precondition_enforcement
        grounds:
          - 'state_machines.CaseAssignment.CONFLICT_PENDING_to_CLEARED'
          - 'errors[ERR_SOD_SELF_WAIVER]'
        distinguishing_aspect: "The officer who recorded the conflict cannot also waive it (dual control)."
        test_recipe:
          setup: ["off1 (screener), off2, inv staff; assignment CONFLICT_PENDING screened by off1"]
          setup_api_calls:
            - { call: "POST /hotline/staff-members", payload: { display_name: "Olivia Officer", email: "officer@corp.example", department: "Ethics", capabilities: [OFFICER], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_off: $.data.id } }
            - { call: "POST /hotline/staff-members", payload: { display_name: "Oscar Officer", email: "officer2@corp.example", department: "Ethics", capabilities: [OFFICER], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_off2: $.data.id } }
            - { call: "POST /hotline/staff-members", payload: { display_name: "Ian Vest", email: "investigator@corp.example", department: "Ops", capabilities: [INVESTIGATION], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_inv: $.data.id } }
            - { call: "POST /hotline/cases", payload: { channel: WEB_PORTAL, category: FRAUD, description: "Allegation of expense fraud in Q2", region: NORTH, subject_employee_ids: [] }, as: HotlineReporter, as_user_id: "anon-sw", captures: { c1: $.data.id } }
            - { call: "POST /hotline/staff-members", payload: { display_name: "Ingrid Intake", email: "intake@corp.example", department: "Ethics", capabilities: [INTAKE], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_int: $.data.id } }
            - { call: "POST /hotline/cases/${c1}/triage", payload: { confirmed_category: FRAUD, subject_seniority: STAFF, financial_exposure_band: NONE, reporter_vulnerability: NONE, triage_decision: PROCEED }, as: IntakeSpecialist, as_user_id: "${s_int}", captures: { c1_v: $.data.version } }
            - { call: "POST /hotline/cases/${c1}/assignments", payload: { expected_case_version: "${c1_v}", investigator_id: "${s_inv}", override_reason: "Domain expertise" }, as: ComplianceOfficer, as_user_id: "${s_off}", captures: { a1: $.data.id } }
            - { call: "POST /hotline/assignments/${a1}/screen", payload: { outcome: CONFLICT_FOUND, conflict_type: FINANCIAL_INTEREST, notes: "Holds vendor stock" }, as: ComplianceOfficer, as_user_id: "${s_off}" }
          trigger:
            - { call: "POST /hotline/assignments/${a1}/waive-conflict", payload: { waiver_justification: "Attempting to waive my own finding." }, as: ComplianceOfficer, as_user_id: "${s_off}", captures: { err_id: "$.data.error_id" } }
          assert:
            - "err_id == ERR_SOD_SELF_WAIVER (waived_by would equal screened_by ${s_off})"

      - name: evidence_seal_exclude_terminal_path
        claim_type: invalid_transition
        grounds:
          - 'state_machines.EvidenceItem.PRESERVED_to_SEALED'
          - 'state_machines.EvidenceItem.SEALED_to_EXCLUDED'
          - 'errors[ERR_EVIDENCE_NOT_PRESERVED]'
