          assert:
            - "the trigger PUT returns HTTP 200 with exactly 2 rows in data, and GET /otb/option-plans/${op_id}/size-curve-cells then returns total_count == 2: the five XS/S/M/L/XL rows written in setup are gone, not merged"
            - "${first_label} == 'S' - the sub-resource list is ordered by size_sort_order ASC"
            - "row size_sort_order 1 has size_label 'S', pct_bps 4000, raw_units_x10000 == 1104000 and allocated_units == 110; row size_sort_order 2 has size_label 'L', pct_bps 6000, raw_units_x10000 == 1656000 and allocated_units == 166 (target_units 276, delta 0, so no remainder reconciliation runs)"
            - "no SizeCurveCell row in either response carries an id, created_at, updated_at or version key: the entity declares common_fields false and is addressed only through its parent option_plan_id"
            - "§1.5 declares no POST /otb/size-curve-cells, no PATCH and no DELETE on a cell: the wholesale PUT is the only mutation path, which is what makes an individual cell immutable"
            - "OptionPlan.${op_id}.version == ${op_v3} == ${op_v1} + 2 (one bump per PUT), while option_slots_total, option_slots_open and target_units_per_option are all still null because the plan is DRAFT and the option plan is still OPEN - the PUT never writes target_units_per_option"

