              captures: { la_v: $.data.version }
            - call: "POST /kiosk-ops/settlement-statements"
              payload: { license_agreement_id: "${la_id}", period_start: "2026-08-01", period_end: "2026-08-31", expected_license_agreement_version: "${la_v}" }
              as: FranchisorOps
