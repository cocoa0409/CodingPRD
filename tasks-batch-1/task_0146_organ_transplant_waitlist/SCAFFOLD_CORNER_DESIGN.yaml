              payload: { donor_organ_id: "${organ_id}", expected_donor_organ_version: "${organ_v0}", policy_code: "STANDARD" }
              as: OrganProcurementOrg
              as_user_id: "${opo_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "Second match-run returns HTTP 412 ERR_STALE_ORGAN_VERSION (organ version advanced past ${organ_v0})"

