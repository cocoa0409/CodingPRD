            - "clock at 2026-08-10T09:00:00Z; PAR_ONE (BAG_CHECKED_1 q1) and PAR_TWO (SEAT_STANDARD q1) are both PUBLISHED and both IN_PARITY on OTA_SKYDEAL (parity_required true, markup_bp 500)"
