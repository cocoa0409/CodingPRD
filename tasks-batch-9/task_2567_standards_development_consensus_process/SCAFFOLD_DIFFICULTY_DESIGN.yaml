      - name: zero_comment_public_review_closes_at_full_disposition_completeness_not_zero
        grounds:
          - calculations.public_review_disposition_completeness
          - state_machines[PublicReview].CLOSED_to_DISPOSITION_APPROVED
          - endpoints[POST /sdo/public-reviews/{publicReviewId}/close]
          - errors[ERR_INVALID_PUBLIC_REVIEW_STATE]
        distinguishing_aspect: |
          Metric: disposition_completeness_pct on an EMPTY input set. The natural reading of
          100 * disposed_count / comment_count is 0/0, and a naive implementation returns 0.0 or
          null and strands the review in CLOSED forever. The pinned rule is that comment_count == 0
          means 100.0, which fires CLOSED_to_DISPOSITION_APPROVED inside the very same close request
          with disposition_approved_by_participant_id left null — so DISPOSITION_DRAFTED is skipped
          entirely and a later approve-disposition on the review is a state error.
