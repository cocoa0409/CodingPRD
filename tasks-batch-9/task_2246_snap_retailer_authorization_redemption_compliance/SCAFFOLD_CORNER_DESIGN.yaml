            - "RedemptionPeriod.${p_aug_id}.transaction_count == 9 and large_transaction_cents == 120000 and even_dollar_transaction_count == 3"
            - "RedemptionPeriod.${p_aug_id}.pos_derived_total_cents == 1000 (unchanged by the import)"
            - "RedemptionPeriod.${p_aug_id}.status == OPEN (import does not close)"

