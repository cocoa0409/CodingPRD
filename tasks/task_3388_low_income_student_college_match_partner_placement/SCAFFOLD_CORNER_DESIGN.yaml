  # ===========================================================================
  - section: endpoints
    instances:
      - name: regular_decision_admit_creates_unguaranteed_package
        claim_type: side_effect_execution
        grounds: ["endpoints.POST_/applications/{id}/regular-decision", entities.AidPackage.fields.guaranteed_full_need]
        distinguishing_aspect: "ADMIT from the regular pool creates a PROVISIONAL AidPackage with guaranteed_full_need == false and match_id null — the match path's guaranteed package is covered by §1.8; this is the regular-decision twin."
        test_recipe:
          setup: ["Cycle A in REGULAR_DECISION phase; one finalist who never ranked, now in REGULAR_POOL; one ACTIVE NO_LOAN college (coa 8000000)."]
          setup_api_calls:
            - *clock0
            - *mkcycle
            - *adv
            - *adv
            - *mkcol_nl
            - *mkstu
            - *mkapp
            - *submit
            - *adv
            - *review_fin
            - *adv
            - *clock_nov
            - *adv
            - *runmatch
            - *adv
          trigger:
            - call: "POST /applications/${app}/regular-decision"
              payload: { decision: "ADMIT" }
              as: CollegeOfficer
              as_user_id: "${col}"
              captures: { st: $.data.status }
            - call: "GET /aid-packages"
              payload: { application_id: "${app}" }
              as: ProgramAdmin
              captures: { pkg_col: "$.data[0].college_id", pkg_gfn: "$.data[0].guaranteed_full_need", pkg_match: "$.data[0].match_id", pkg_status: "$.data[0].status", pkg_efc: "$.data[0].efc_cents", pkg_grant: "$.data[0].grant_cents" }
          assert:
            - "Application.${app}.status == ADMITTED_REGULAR"
            - "the created package: college_id == ${col}, match_id is null, guaranteed_full_need == false, status == PROVISIONAL"
            - "amounts used the PROVISIONAL variant: efc_cents == 340000, grant_cents == 7360000"

      - name: applications_list_filters_by_status
        claim_type: Listing
        grounds: [endpoints.GET_/applications]
        distinguishing_aspect: "The status filter is exact: with one application decided NOT_FINALIST and one still UNDER_REVIEW, status=UNDER_REVIEW returns exactly the unreviewed one."
        test_recipe:
          setup: ["Cycle A in REVIEW phase; two submitted applications; the first already reviewed NOT_FINALIST."]
          setup_api_calls:
            - *clock0
            - *mkcycle
            - *adv
            - *adv
            - *mkstu
            - *mkapp
            - *submit
            - call: "POST /students"
              payload: { email: "s2@x.com", full_name: "Stu Two", state_code: "TX", source: "SELF" }
              as: Anonymous
              captures: { stu2: $.data.id }
            - call: "POST /applications"
              payload: { cycle_id: "${cyc}", household_income_cents: 6500000, household_size: 4, gpa_scaled: 390, test_score: 1450 }
              as: Student
              as_user_id: "${stu2}"
              captures: { app2: $.data.id }
            - call: "POST /applications/${app2}/submit"
              as: Student
              as_user_id: "${stu2}"
            - *adv
            - call: "POST /applications/${app}/review"
              payload: { decision: "NOT_FINALIST" }
              as: ProgramAdmin
          trigger:
            - call: "GET /applications"
              payload: { cycle_id: "${cyc}", status: "UNDER_REVIEW" }
              as: ProgramAdmin
              captures: { only: "$.data[0].id" }
          assert:
            - "exactly one row is returned and it is ${app2}"
            - "total_count == 1 (the NOT_FINALIST application is filtered out)"

      - name: enroll_matched_student_creates_outcome_record
        claim_type: side_effect_execution
        grounds: ["endpoints.POST_/matches/{id}/enroll", entities.OutcomeRecord]
        distinguishing_aspect: "Enrolling a BINDING match creates the OutcomeRecord in ENROLLED_Y1 with match_id set, bumps enrolled_count, and cascades the application to ENROLLED."
        test_recipe:
          setup: ["Cycle A in REGULAR_DECISION phase; one BINDING match at the NO_LOAN college."]
          setup_api_calls:
            - *clock0
            - *mkcycle
            - *adv
            - *adv
            - *mkcol_nl
            - *mkstu
            - *mkapp
            - *submit
            - *adv
            - *review_fin
            - *adv
            - *clock_rank
            - *rank1
            - *clock_nov
            - *adv
            - *runmatch
            - *adv
            - *getmatch
          trigger:
            - call: "POST /matches/${m_id}/enroll"
              as: CollegeOfficer
              as_user_id: "${col}"
              captures: { m_status: $.data.status }
            - call: "GET /outcomes"
              payload: { match_id: "${m_id}" }
              as: ProgramAdmin
              captures: { o_id: "$.data[0].id", o_status: "$.data[0].status", o_match: "$.data[0].match_id" }
            - call: "GET /colleges/${col}"
              as: ProgramAdmin
              captures: { enr: $.data.enrolled_count }
            - call: "GET /applications/${app}"
              as: ProgramAdmin
              captures: { a_status: $.data.status }
          assert:
            - "Match.${m_id}.status == ENROLLED"
            - "exactly one OutcomeRecord exists for the match: status ENROLLED_Y1, match_id == ${m_id}"
            - "PartnerCollege.${col}.enrolled_count == 1 and Application.${app}.status == ENROLLED"

      - name: outcome_record_stopout_reenrollment_loop
        claim_type: valid_transition
        grounds: [state_machines.OutcomeRecord.STOPPED_OUT_to_PERSISTED_Y2]
        excluded_because:
          difficulty_instance: persistence_on_track_vs_cohort150
          rationale: "The cyclic OutcomeRecord machine (including STOPPED_OUT) is exercised by the named §1.8 instance; only the re-enrollment edge differs, and the §1.8 non_linear_state_machine requirement is met by Application and AidPackage."

