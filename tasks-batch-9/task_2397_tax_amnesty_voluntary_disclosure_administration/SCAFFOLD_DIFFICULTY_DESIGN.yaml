            - "DisclosureReturn.${ret_q2_id}.status == \"DRAFT\""
            - "DisclosureReturn.${ret_q1_id}.status == \"DRAFT\""
            - "GET /amnesty/agreements/${agr_id}/returns returns total_count == 2"

      - name: term_windows_are_half_open_so_touching_endpoints_are_allowed
        grounds:
          - validations[priority=30]
          - entities.ProgramTaxTypeTerm.fields.eligible_period_end
          - errors[ERR_TAX_TYPE_TERM_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Term windows use the OPPOSITE convention to return periods: [2020-01-01, 2023-01-01)
          and [2023-01-01, 2026-07-01) touch at 2023-01-01 and both persist, while a straddling
          [2022-06-01, 2024-01-01) window is refused — and the same straddling window is accepted
          for a DIFFERENT tax type, proving the uniqueness scope is (program, tax_type).
        test_recipe:
          setup:
            - "Clock at 2026-09-15T00:00:00Z"
            - "One DRAFT program already carries a SALES_USE term for the half-open window [2020-01-01, 2023-01-01)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
