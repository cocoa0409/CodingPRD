            - { call: "POST /api/bookings", payload: { campaign_id: "${camp_id}", station_id: "${st_id}", slot_start: "2026-10-01T08:00:00Z", slot_end: "2026-10-01T10:00:00Z", estimated_tons: 40 }, as: MEMBER, as_user_id: "${m1_id}", captures: { b_id: $.data.id } }
            - { call: "POST /api/bookings/${b_id}/confirm", as: SCHEDULER }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T08:30:00Z" }, as: COOP_ADMIN }
            - { call: "POST /api/tickets", payload: { booking_id: "${b_id}" }, as: STATION_OPERATOR, captures: { t1_id: $.data.id } }
            - { call: "POST /api/tickets/${t1_id}/weigh", payload: { gross_weight_lbs: 60000, tare_weight_lbs: 32000 }, as: STATION_OPERATOR }
            - { call: "POST /api/tickets", payload: { booking_id: "${b_id}" }, as: STATION_OPERATOR, captures: { t2_id: $.data.id } }
          trigger:
            - { call: "GET /api/tickets?limit=1", as: POOL_ACCOUNTANT }
            - { call: "GET /api/tickets?status=CREATED", as: POOL_ACCOUNTANT, captures: { only_id: "$.data[0].id" } }
          assert:
            - "limit=1 page: data length == 1, total_count == 2, has_more == true"
            - "filter status=CREATED: exactly one row and only_id == ${t2_id} (T1 is WEIGHED and excluded)"

      - name: response_envelope_shape_on_success
        claim_type: envelope_shape
        grounds: [response_envelope]
        distinguishing_aspect: "Every success response carries meta.api_request_id, meta.api_request_timestamp, response_type, and data; a single-resource GET has response_type object."
        test_recipe:
          setup: ["one member created"]
          setup_api_calls:
            - { call: "POST /api/members", payload: { name: "M1", member_code: "M-1001", haul_distance_miles: 22.5 }, as: COOP_ADMIN, captures: { m_id: $.data.id } }
          trigger:
            - { call: "GET /api/members/${m_id}", as: POOL_ACCOUNTANT, captures: { code: $.data.member_code } }
          assert:
            - "envelope: meta.api_request_id present, meta.api_request_timestamp present, response_type == object"
            - "code == M-1001"

      - name: pile_allocations_filtered_list_reverse_reachability
        claim_type: computed_read
        grounds: [endpoints.GET_/api/pile-allocations, entities.PileAllocation]
        distinguishing_aspect: "Cascade-created PileAllocation (synthesized by accept, present in no creation response) is discoverable via GET /api/pile-allocations?ticket_id= with allocated_lbs == remaining_lbs before any loss."
        test_recipe:
          setup: ["campaign, member, station, pile; booking CONFIRMED; ticket 72000/32000 lab 16.00/2.00 accepted (adjusted 20.0000 t = 40000 lbs)"]
          setup_api_calls:
            - { call: "POST /api/campaigns", payload: { name: "C", window_start: "2026-09-15T00:00:00Z", window_end: "2026-11-20T00:00:00Z", base_price_cents_per_ton: 5500 }, as: COOP_ADMIN, captures: { camp_id: $.data.id } }
            - { call: "POST /api/members", payload: { name: "M1", member_code: "M-1001", haul_distance_miles: 22.5 }, as: COOP_ADMIN, captures: { m1_id: $.data.id } }
            - { call: "POST /api/stations", payload: { name: "ST", booking_capacity_tons: 1000 }, as: COOP_ADMIN, captures: { st_id: $.data.id } }
            - { call: "POST /api/piles", payload: { station_id: "${st_id}", capacity_tons: 200 }, as: STATION_OPERATOR, captures: { pile_id: $.data.id } }
            - { call: "POST /api/bookings", payload: { campaign_id: "${camp_id}", station_id: "${st_id}", slot_start: "2026-10-01T08:00:00Z", slot_end: "2026-10-01T10:00:00Z", estimated_tons: 25 }, as: MEMBER, as_user_id: "${m1_id}", captures: { b_id: $.data.id } }
            - { call: "POST /api/bookings/${b_id}/confirm", as: SCHEDULER }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T08:30:00Z" }, as: COOP_ADMIN }
            - { call: "POST /api/tickets", payload: { booking_id: "${b_id}" }, as: STATION_OPERATOR, captures: { t_id: $.data.id } }
            - { call: "POST /api/tickets/${t_id}/weigh", payload: { gross_weight_lbs: 72000, tare_weight_lbs: 32000 }, as: STATION_OPERATOR }
            - { call: "POST /api/samples", payload: { ticket_id: "${t_id}", sample_type: "LAB_VERIFY" }, as: QUALITY_TECH, captures: { s_id: $.data.id } }
            - { call: "POST /api/samples/${s_id}/record-result", payload: { sugar_pct: 16.00, trash_pct: 2.00 }, as: QUALITY_TECH, as_user_id: "qt-alice" }
            - { call: "POST /api/samples/${s_id}/verify", as: QUALITY_TECH, as_user_id: "qt-bob" }
            - { call: "POST /api/tickets/${t_id}/accept", payload: { pile_id: "${pile_id}" }, as: STATION_OPERATOR }
          trigger:
            - { call: "GET /api/pile-allocations?ticket_id=${t_id}", as: POOL_ACCOUNTANT, captures: { a_alloc: "$.data[0].allocated_lbs", a_rem: "$.data[0].remaining_lbs", a_pile: "$.data[0].pile_id", a_member: "$.data[0].member_id", a_status: "$.data[0].status" } }
          assert:
            - "a_alloc == 40000.0 and a_rem == 40000.0 (no loss events yet)"
            - "a_pile == ${pile_id} and a_member == ${m1_id} and a_status == ACTIVE"

  # ===========================================================================
  # Section: errors (cross-check; stubs where §1.8 already triggers the error)
  # ===========================================================================
  - section: errors
    instances:
      - name: error_slot_overlap_triggered
        claim_type: violation_to_error
        grounds: ["errors[ERR_SLOT_OVERLAP]"]
        excluded_because:
          difficulty_instance: station_slot_half_open_adjacency_vs_overlap
          rationale: "Asserted as bb_err == ERR_SLOT_OVERLAP in the named §1.8 instance."
      - name: error_survey_blackout_triggered
        claim_type: violation_to_error
        grounds: ["errors[ERR_SURVEY_BLACKOUT]"]
        excluded_because:
          difficulty_instance: pile_survey_blackout_inclusive_bounds
          rationale: "Asserted as err == ERR_SURVEY_BLACKOUT at the inclusive window end in the named §1.8 instance."
      - name: error_trash_limit_triggered
        claim_type: violation_to_error
        grounds: ["errors[ERR_TRASH_LIMIT_EXCEEDED]"]
        excluded_because:
          difficulty_instance: trash_accept_boundary_exactly_20_00
          rationale: "Asserted as tb_err == ERR_TRASH_LIMIT_EXCEEDED for trash 20.01 in the named §1.8 instance."
      - name: error_pool_not_accruing_triggered
        claim_type: violation_to_error
        grounds: ["errors[ERR_POOL_NOT_ACCRUING]"]
        excluded_because:
          difficulty_instance: ticket_credit_requires_pool_accruing
          rationale: "Asserted as err == ERR_POOL_NOT_ACCRUING while the pool is OPEN in the named §1.8 instance."
      - name: error_booking_not_confirmed_triggered
        claim_type: violation_to_error
        grounds: ["errors[ERR_BOOKING_NOT_CONFIRMED]"]
        excluded_because:
          difficulty_instance: ticket_create_requires_booking_confirmed_or_in_use
          rationale: "Asserted for both REQUESTED and CANCELLED bookings in the named §1.8 instance."
      - name: error_reversal_not_allowed_triggered
        claim_type: violation_to_error
        grounds: ["errors[ERR_REVERSAL_NOT_ALLOWED]"]
        excluded_because:
          difficulty_instance: ledger_advance_post_then_reverse_conserves_net
          rationale: "Asserted as err2 == ERR_REVERSAL_NOT_ALLOWED on the second reversal in the named §1.8 instance."
      - name: error_member_suspended_triggered
        claim_type: violation_to_error
        grounds: ["errors[ERR_MEMBER_SUSPENDED]"]
        excluded_because:
          difficulty_instance: booking_suspended_member_beats_slot_window
          rationale: "Asserted as err == ERR_MEMBER_SUSPENDED (winning over ERR_SLOT_OUTSIDE_WINDOW) in the named §1.8 instance."
      - name: error_ticket_not_creditable_triggered
