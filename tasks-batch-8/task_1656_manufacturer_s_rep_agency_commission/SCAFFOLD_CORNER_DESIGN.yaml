  # ---------------------------------------------------------------------------
  # Section: rbac
  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: rep_cannot_create_principal_forbidden
        claim_type: role_exclusive_denial
        grounds: ["roles.AgencyAdmin", "validations[priority=2]", "errors[ERR_FORBIDDEN_FOR_ROLE]"]
        distinguishing_aspect: "Principal creation is AgencyAdmin-exclusive: a Rep caller is denied ERR_FORBIDDEN_FOR_ROLE (403) regardless of body validity."
        test_recipe:
          setup: ["rep R1 exists"]
          setup_api_calls:
            - call: "POST /rep-agency/reps"
              payload: { display_name: "R1", territory_codes: ["CA"] }
              as: AgencyAdmin
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /rep-agency/principals"
              payload: { name: "PX", annual_quota_cents: 10000000 }
              as: Rep
              as_user_id: "${r1}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN_FOR_ROLE, http 403"

      - name: principalops_cannot_settle_statement_forbidden
        claim_type: role_exclusive_denial
        grounds: ["roles.AgencyAdmin.exclusive_operations", "roles.PrincipalOps.exclusive_operations", "errors[ERR_FORBIDDEN_FOR_ROLE]"]
        distinguishing_aspect: "Segregation of duties: the principal uploads the statement and responds to disputes, but settle is AgencyAdmin-exclusive — PrincipalOps is denied even on its own principal's statement."
        test_recipe:
          setup: ["principal P1; statement 2026-08 uploaded by P1"]
          setup_api_calls:
            - call: "POST /rep-agency/principals"
              payload: { name: "P1", annual_quota_cents: 10000000 }
              as: AgencyAdmin
              captures: { p1: $.data.id }
            - call: "POST /rep-agency/statements"
              payload: { principal_id: "${p1}", period_label: "2026-08", lines: [{ line_id: "S1", external_order_ref: "PO-1", amount_cents: 100 }] }
              as: PrincipalOps
              as_user_id: "${p1}"
              captures: { st1: $.data.id }
          trigger:
            - call: "POST /rep-agency/statements/${st1}/settle"
              payload: {}
              as: PrincipalOps
              as_user_id: "${p1}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN_FOR_ROLE, http 403 (role check precedes any state check)"

      - name: auditor_is_read_only_forbidden
        claim_type: role_exclusive_denial
        grounds: ["roles.Auditor", "errors[ERR_FORBIDDEN_FOR_ROLE]"]
        distinguishing_aspect: "Auditor can issue any GET but no writes: POST /rep-agency/customers as Auditor is denied ERR_FORBIDDEN_FOR_ROLE."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /rep-agency/customers"
              payload: { name: "C1", spec_territory_code: "CA", ship_to_territory_code: "WA" }
              as: Auditor
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN_FOR_ROLE, http 403"
            - "GET /rep-agency/customers as Auditor returns 200 with total_count == 0"

      - name: principalops_wrong_principal_scope_forbidden
        claim_type: ownership_scope_denial
        grounds: ["validations[priority=4]", "errors[ERR_FORBIDDEN_NOT_OWNER]", "roles.PrincipalOps"]
        distinguishing_aspect: "Entity-backed ownership: PrincipalOps with X-User-ID = P2 cannot ship P1's order — ERR_FORBIDDEN_NOT_OWNER (403), distinct from role denial."
        test_recipe:
          setup: ["BASE for P1 (agreement/schedule/rep/customer, order O1 PLACED); second principal P2 exists"]
          setup_api_calls:
            - call: "POST /rep-agency/principals"
              payload: { name: "P1", annual_quota_cents: 10000000 }
              as: AgencyAdmin
              captures: { p1: $.data.id, p1_v: $.data.version }
            - call: "POST /rep-agency/principals"
              payload: { name: "P2", annual_quota_cents: 5000000 }
              as: AgencyAdmin
              captures: { p2: $.data.id }
            - call: "POST /rep-agency/principals/${p1}/agreements"
              payload: { territory_codes: ["CA"], effective_start: "2026-01-01T00:00:00Z" }
              as: AgencyAdmin
              captures: { a1: $.data.id }
            - call: "POST /rep-agency/agreements/${a1}/activate"
              payload: {}
              as: AgencyAdmin
            - call: "POST /rep-agency/principals/${p1}/rate-schedules"
              payload: { family_rates: [{ family_code: "CONNECTORS", base_rate_bp: 1000 }], attainment_tiers: [{ min_attainment_bp: 0, multiplier_bp: 10000 }], expected_principal_version: "${p1_v}" }
              as: AgencyAdmin
            - call: "POST /rep-agency/reps"
              payload: { display_name: "R1", territory_codes: ["CA"] }
              as: AgencyAdmin
            - call: "POST /rep-agency/customers"
              payload: { name: "C1", spec_territory_code: "CA", ship_to_territory_code: "CA" }
              as: AgencyAdmin
              captures: { c1: $.data.id }
            - call: "POST /rep-agency/orders"
              payload: { customer_id: "${c1}", principal_id: "${p1}", external_order_ref: "PO-1", placed_at: "2026-08-01T00:00:00Z", lines: [{ line_id: "L1", family_code: "CONNECTORS", quantity: 1, unit_price_cents: 5000 }] }
              as: AgencyAdmin
              captures: { o1: $.data.id }
          trigger:
            - call: "POST /rep-agency/orders/${o1}/ship"
              payload: {}
              as: PrincipalOps
              as_user_id: "${p2}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN_NOT_OWNER (403): order belongs to principal ${p1}, caller is ${p2}"
            - "Order.${o1}.fulfillment_status still PLACED"

      - name: rep_cannot_return_foreign_checkout
        claim_type: ownership_scope_denial
        grounds: ["validations[priority=4]", "errors[ERR_FORBIDDEN_NOT_OWNER]", "roles.Rep"]
        distinguishing_aspect: "Entity-backed Rep identity: R2 cannot return R1's checkout — ERR_FORBIDDEN_NOT_OWNER; R1 returns it successfully."
        test_recipe:
          setup: ["principal P1; reps R1 [CA] and R2 [OR]; unit U1; checkout CO1 by R1"]
          setup_api_calls:
            - call: "POST /rep-agency/principals"
              payload: { name: "P1", annual_quota_cents: 10000000 }
              as: AgencyAdmin
              captures: { p1: $.data.id }
            - call: "POST /rep-agency/reps"
              payload: { display_name: "R1", territory_codes: ["CA"] }
              as: AgencyAdmin
              captures: { r1: $.data.id }
            - call: "POST /rep-agency/reps"
              payload: { display_name: "R2", territory_codes: ["OR"] }
              as: AgencyAdmin
              captures: { r2: $.data.id }
            - call: "POST /rep-agency/sample-units"
              payload: { principal_id: "${p1}", serial_number: "S-1", family_code: "CONNECTORS", value_cents: 80000 }
              as: PrincipalOps
              as_user_id: "${p1}"
              captures: { u1: $.data.id }
            - call: "POST /rep-agency/sample-checkouts"
              payload: { sample_unit_id: "${u1}" }
              as: Rep
              as_user_id: "${r1}"
              captures: { co1: $.data.id }
          trigger:
            - call: "POST /rep-agency/sample-checkouts/${co1}/return"
              payload: { condition_on_return: "SELLABLE" }
              as: Rep
              as_user_id: "${r2}"
              captures: { err: $.data.error_id }
            - call: "POST /rep-agency/sample-checkouts/${co1}/return"
              payload: { condition_on_return: "SELLABLE" }
              as: Rep
              as_user_id: "${r1}"
              captures: { st: $.data.status }
          assert:
            - "return by R2 -> error_id == ERR_FORBIDDEN_NOT_OWNER (403)"
            - "return by owning R1 succeeds: status == RETURNED, charge_cents == 0"

  # ---------------------------------------------------------------------------
  # Section: cross-cutting complexity layers
  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: occ_rate_schedule_stale_version
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[rate-schedule-supersede-stale-principal]", "validations[priority=6]", "errors[ERR_STALE_PRINCIPAL_VERSION]"]
        distinguishing_aspect: "OCC on Principal.version: a rate-schedule create carrying the pre-supersede version is rejected 412 ERR_STALE_PRINCIPAL_VERSION; the same create with the fresh version succeeds and supersedes RS1."
        test_recipe:
          setup: ["principal P1 at version 1; RS1 created with expected version 1 (principal version now 2)"]
          setup_api_calls:
            - call: "POST /rep-agency/principals"
              payload: { name: "P1", annual_quota_cents: 10000000 }
              as: AgencyAdmin
              captures: { p1: $.data.id, p1_v: $.data.version }
            - call: "POST /rep-agency/principals/${p1}/rate-schedules"
              payload: { family_rates: [{ family_code: "CONNECTORS", base_rate_bp: 1000 }], attainment_tiers: [{ min_attainment_bp: 0, multiplier_bp: 10000 }], expected_principal_version: "${p1_v}" }
              as: AgencyAdmin
              captures: { rs1: $.data.id }
          trigger:
            - call: "POST /rep-agency/principals/${p1}/rate-schedules"
              payload: { family_rates: [{ family_code: "CONNECTORS", base_rate_bp: 500 }], attainment_tiers: [{ min_attainment_bp: 0, multiplier_bp: 10000 }], expected_principal_version: "${p1_v}" }
              as: AgencyAdmin
              captures: { err: $.data.error_id }
            - call: "GET /rep-agency/principals/${p1}"
              as: AgencyAdmin
              captures: { p1_v2: $.data.version }
            - call: "POST /rep-agency/principals/${p1}/rate-schedules"
              payload: { family_rates: [{ family_code: "CONNECTORS", base_rate_bp: 500 }], attainment_tiers: [{ min_attainment_bp: 0, multiplier_bp: 10000 }], expected_principal_version: "${p1_v2}" }
              as: AgencyAdmin
              captures: { rs2: $.data.id }
          assert:
            - "stale create -> error_id == ERR_STALE_PRINCIPAL_VERSION, http 412 (expected ${p1_v} but principal already advanced)"
            - "fresh create succeeds: RateSchedule.${rs2}.status == ACTIVE"
            - "RateSchedule.${rs1}.status == SUPERSEDED after the second create"
            - "each successful create incremented Principal.version by exactly 1 (1 -> 2 -> 3)"

      - name: occ_put_splits_stale_version
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[order-split-override-stale-order]", "validations[priority=6]", "errors[ERR_STALE_ORDER_VERSION]"]
        distinguishing_aspect: "OCC on Order.version: a second splits override carrying the creation-time version is rejected 412 ERR_STALE_ORDER_VERSION after the first override bumped the version."
        test_recipe:
          setup: ["BASE; O1 PLACED (single line L1) at version 1"]
          setup_api_calls:
            - call: "POST /rep-agency/principals"
              payload: { name: "P1", annual_quota_cents: 10000000 }
              as: AgencyAdmin
              captures: { p1: $.data.id, p1_v: $.data.version }
            - call: "POST /rep-agency/principals/${p1}/agreements"
              payload: { territory_codes: ["CA", "OR", "WA"], effective_start: "2026-01-01T00:00:00Z", specify_share_bp: 6000 }
              as: AgencyAdmin
              captures: { a1: $.data.id }
            - call: "POST /rep-agency/agreements/${a1}/activate"
              payload: {}
              as: AgencyAdmin
            - call: "POST /rep-agency/principals/${p1}/rate-schedules"
              payload: { family_rates: [{ family_code: "CONNECTORS", base_rate_bp: 1000 }], attainment_tiers: [{ min_attainment_bp: 0, multiplier_bp: 10000 }], expected_principal_version: "${p1_v}" }
              as: AgencyAdmin
            - call: "POST /rep-agency/reps"
              payload: { display_name: "R1", territory_codes: ["CA", "OR"] }
              as: AgencyAdmin
              captures: { r1: $.data.id }
            - call: "POST /rep-agency/reps"
              payload: { display_name: "R2", territory_codes: ["WA"] }
              as: AgencyAdmin
              captures: { r2: $.data.id }
            - call: "POST /rep-agency/customers"
              payload: { name: "C1", spec_territory_code: "CA", ship_to_territory_code: "WA" }
              as: AgencyAdmin
              captures: { c1: $.data.id }
            - call: "POST /rep-agency/orders"
              payload: { customer_id: "${c1}", principal_id: "${p1}", external_order_ref: "PO-1", placed_at: "2026-08-01T00:00:00Z", lines: [{ line_id: "L1", family_code: "CONNECTORS", quantity: 10, unit_price_cents: 5000 }] }
              as: AgencyAdmin
              captures: { o1: $.data.id, o1_v: $.data.version }
            - call: "PUT /rep-agency/orders/${o1}/splits"
              payload: { splits: [{ line_id: "L1", rep_id: "${r1}", share_bp: 10000 }], expected_order_version: "${o1_v}" }
              as: AgencyAdmin
          trigger:
            - call: "PUT /rep-agency/orders/${o1}/splits"
              payload: { splits: [{ line_id: "L1", rep_id: "${r2}", share_bp: 10000 }], expected_order_version: "${o1_v}" }
              as: AgencyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "second override with the creation-time version -> error_id == ERR_STALE_ORDER_VERSION, http 412"
            - "first override persisted: split rows are OVERRIDE ${r1} 10000 with is_override == true; Order.${o1}.version == 2"

      - name: cascading_side_effects_excluded
        claim_type: cascade_chain
        grounds: ["complexity_profile.complexity_layers"]
        excluded_because:
          difficulty_instance: rma_receipt_chargeback_balance_hold_cascade
          rationale: "The 3-link cascade (entry -> balance -> hold) plus the termination sweep cascade are asserted hop-by-hop in §1.8."

      - name: rate_threshold_trigger_excluded
        claim_type: threshold_boundary
        grounds: ["complexity_profile.complexity_layers", "calculations.quota_attainment"]
        excluded_because:
          difficulty_instance: attainment_tier_boundary_inclusive
          rationale: "Tier multiplier engagement exactly at attainment 10000bp (inclusive) is asserted in §1.8."

  # ---------------------------------------------------------------------------
  # Section: consistency model (immediate)
  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_consistency_invoice_then_read
        claim_type: immediate_visibility
        grounds: ["complexity_profile.consistency_model", "state_machines.Order.SHIPPED_to_INVOICED"]
        distinguishing_aspect: "Immediate consistency: the invoice response itself carries computed applied_rate_bp/commission_cents, and a follow-up read of the ledger in the same instant already shows both ACCRUAL entries — no async reconciliation lag."
        test_recipe:
          setup: ["BASE; O1 shipped (L1 CONNECTORS 100x5000, L2 CABLES 50x2000)"]
          setup_api_calls:
            - call: "POST /rep-agency/principals"
              payload: { name: "P1", annual_quota_cents: 10000000 }
              as: AgencyAdmin
              captures: { p1: $.data.id, p1_v: $.data.version }
            - call: "POST /rep-agency/principals/${p1}/agreements"
              payload: { territory_codes: ["CA", "OR", "WA"], effective_start: "2026-01-01T00:00:00Z", specify_share_bp: 6000 }
              as: AgencyAdmin
              captures: { a1: $.data.id }
            - call: "POST /rep-agency/agreements/${a1}/activate"
              payload: {}
              as: AgencyAdmin
            - call: "POST /rep-agency/principals/${p1}/rate-schedules"
              payload: { family_rates: [{ family_code: "CONNECTORS", base_rate_bp: 1000 }, { family_code: "CABLES", base_rate_bp: 800 }], attainment_tiers: [{ min_attainment_bp: 0, multiplier_bp: 10000 }], expected_principal_version: "${p1_v}" }
              as: AgencyAdmin
            - call: "POST /rep-agency/reps"
              payload: { display_name: "R1", territory_codes: ["CA", "OR"] }
              as: AgencyAdmin
              captures: { r1: $.data.id }
            - call: "POST /rep-agency/reps"
              payload: { display_name: "R2", territory_codes: ["WA"] }
              as: AgencyAdmin
              captures: { r2: $.data.id }
            - call: "POST /rep-agency/customers"
              payload: { name: "C1", spec_territory_code: "CA", ship_to_territory_code: "WA" }
              as: AgencyAdmin
              captures: { c1: $.data.id }
            - call: "POST /rep-agency/orders"
              payload: { customer_id: "${c1}", principal_id: "${p1}", external_order_ref: "PO-1", placed_at: "2026-08-01T00:00:00Z", lines: [{ line_id: "L1", family_code: "CONNECTORS", quantity: 100, unit_price_cents: 5000 }, { line_id: "L2", family_code: "CABLES", quantity: 50, unit_price_cents: 2000 }] }
              as: AgencyAdmin
              captures: { o1: $.data.id }
            - call: "POST /rep-agency/orders/${o1}/ship"
              payload: {}
              as: PrincipalOps
              as_user_id: "${p1}"
          trigger:
            - call: "POST /rep-agency/orders/${o1}/invoice"
              payload: {}
              as: PrincipalOps
              as_user_id: "${p1}"
              captures: { cs: $.data.commission_status }
            - call: "GET /rep-agency/commission-entries?order_id=${o1}"
              as: Auditor
            - call: "GET /rep-agency/reps/${r1}"
              as: Auditor
          assert:
            - "invoice response: commission_status == ACCRUED and lines carry applied_rate_bp 1000/800 with commission_cents 50000/8000 in the same response"
            - "GET commission-entries?order_id=${o1} immediately: total_count == 2, ACCRUAL 34800 (R1) and 23200 (R2)"
            - "GET reps/${r1} immediately: commission_balance_cents == 34800"
