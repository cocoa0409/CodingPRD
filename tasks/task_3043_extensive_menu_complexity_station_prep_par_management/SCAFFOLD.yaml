  - method: GET
    path: "/api/waste-entries"
    description: "List waste entries"
    roles: [SystemAdmin, MenuAdmin, KitchenManager, PrepCook, LineCook, PastryChef, InventoryController]
    code: 200
    input: ["station_id?", "prep_batch_id?", "recorded_by_cook_id?", "reason?", "limit?", "offset?"]
    output: "WasteEntry[]"
    side_effects: []
  - method: GET
    path: "/api/waste-entries/{id}"
    description: "Get a waste entry"
    roles: [SystemAdmin, MenuAdmin, KitchenManager, PrepCook, LineCook, PastryChef, InventoryController]
    code: 200
    input: []
    output: WasteEntry
    side_effects: []

  # --- ServiceTicket ---
