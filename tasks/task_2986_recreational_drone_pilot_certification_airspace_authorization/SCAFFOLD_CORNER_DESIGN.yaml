              captures: { r1: $.data.id, r1_status: $.data.status }
          trigger:
            - call: "POST /drone-ops/accident-reports"
              payload: { flight_id: "${fid}", occurred_at: "2026-08-01T09:50:00Z", injury_level: "NONE", reported_property_damage_cents: 40000, narrative: "Second filing of the same event." }
              as: Pilot
              as_user_id: "${pid}"
              captures: { e_dupe: $.data.error_id }
            - call: "POST /drone-ops/accident-reports/${r1}/withdraw"
              payload: { probable_cause: "Duplicate of an operator log entry; no damage substantiated." }
              as: InvestigationOfficer
              captures: { withdrawn_status: $.data.status }
            - call: "POST /drone-ops/accident-reports"
              payload: { flight_id: "${fid}", occurred_at: "2026-08-01T09:50:00Z", injury_level: "MINOR", reported_property_damage_cents: 40000, narrative: "Refiled after withdrawal with the correct injury level." }
              as: Pilot
              as_user_id: "${pid}"
              captures: { r2_status: $.data.status }
          assert:
            - "${pf} == \"PASSED\" and ${flight_status} == \"COMPLETED\" - the fixture reaches a completed flight before any report exists"
            - "${r1_status} == \"FILED\" and ${e_dupe} == \"ERR_ACCIDENT_REPORT_DUPLICATE\" at 409 - the blocking set includes FILED"
            - "${withdrawn_status} == \"WITHDRAWN\""
            - "${r2_status} == \"FILED\" - the identical flight_id is accepted once the prior report is WITHDRAWN, so the constraint is status-scoped rather than a unique index on flight_id"
            - "GET /drone-ops/accident-reports?flight_id={fid} returns total_count 2: the withdrawn row is retained, not deleted"

      - name: preflight_not_cleared_is_triggerable_on_launch
        claim_type: triggerable
        grounds:
          - errors.ERR_PREFLIGHT_NOT_CLEARED
        excluded_because:
          difficulty_instance: launch_state_error_precedes_remote_id_safety_error_and_leaves_module_verified
          rationale: |
            That instance launches a PLANNED flight with no passing PreflightCheck and asserts
            the 409 ERR_PREFLIGHT_NOT_CLEARED body, so the code already has a trigger.

      - name: pilot_not_certified_is_triggerable
        claim_type: triggerable
        grounds:
          - errors.ERR_PILOT_NOT_CERTIFIED
        excluded_because:
          difficulty_instance: waiver_submission_depends_on_pilot_certification_state
          rationale: |
            The certification gate is triggered there on waiver submission by an UNCERTIFIED
            pilot and again after the pilot is certified, covering both sides of the code.

      - name: pilot_currency_lapsed_is_triggerable
        claim_type: triggerable
        grounds:
          - errors.ERR_PILOT_CURRENCY_LAPSED
        excluded_because:
          difficulty_instance: authorization_currency_safety_error_precedes_insurance_fiscal_error
          rationale: |
            That instance triggers the currency code on an authorization request and asserts the
            accompanying CERTIFIED -> LAPSED transition.

      - name: remote_id_not_verified_is_triggerable
        claim_type: triggerable
        grounds:
          - errors.ERR_REMOTE_ID_NOT_VERIFIED
        excluded_because:
          difficulty_instance: flight_launch_depends_on_remote_id_module_state
          rationale: |
            The launch is attempted there with the module in VERIFICATION_PENDING, which is
            exactly this code's condition.

      - name: remote_id_expired_is_triggerable
        claim_type: triggerable
        grounds:
          - errors.ERR_REMOTE_ID_EXPIRED
        excluded_because:
          difficulty_instance: flight_launch_depends_on_remote_id_module_state
          rationale: |
            The same instance advances the clock past verified_until and asserts both the
            ERR_REMOTE_ID_EXPIRED body and the VERIFIED -> EXPIRED transition it performs.

      - name: zone_capacity_exceeded_is_triggerable
        claim_type: triggerable
        grounds:
          - errors.ERR_ZONE_CAPACITY_EXCEEDED
        excluded_because:
          difficulty_instance: zone_capacity_half_open_windows_touching_authorizations_do_not_collide
          rationale: |
            Capacity is driven to its limit there and the next approval is refused with this
            code, alongside the touching-window control that must succeed.

      - name: aircraft_schedule_conflict_is_triggerable
        claim_type: triggerable
        grounds:
          - errors.ERR_AIRCRAFT_SCHEDULE_CONFLICT
        excluded_because:
          difficulty_instance: aircraft_turnaround_closed_interval_thirty_minute_gap_collides
          rationale: |
            The turnaround boundary instance triggers the code at an exactly 30-minute gap and
            accepts the 31-minute gap, so both sides are already asserted.

      - name: authorization_invalid_state_is_triggerable
        claim_type: triggerable
        grounds:
          - errors.ERR_AUTHORIZATION_INVALID_STATE
        excluded_because:
          difficulty_instance: zone_slot_conservation_under_revoke_and_under_consume
          rationale: |
            The second revoke of an already REVOKED authorization is refused with this code
            there, as part of the slot-conservation ledger check.

      - name: report_invalid_state_is_triggerable
        claim_type: triggerable
        grounds:
          - errors.ERR_REPORT_INVALID_STATE
        excluded_because:
          difficulty_instance: accident_investigation_remediation_cycle_with_parallel_flight_dimension
          rationale: |
            Closing a REMEDIATION_REQUIRED report and resuming an INVESTIGATING one are both
            attempted there and both answer with this code.

      - name: revision_limit_exceeded_is_triggerable
        claim_type: triggerable
        grounds:
          - errors.ERR_REVISION_LIMIT_EXCEEDED
        excluded_because:
          difficulty_instance: waiver_review_revision_cycle_revisits_under_review
          rationale: |
            The review cycle is walked to MAX_REVISION_ROUNDS there and the next
            request-revision is refused with this code.

  - section: rbac
    instances:
      - name: each_roles_exclusive_operation_is_unauthorized_for_every_other_role
        claim_type: other_roles_denied
        grounds:
          - rbac.Pilot
          - rbac.ComplianceOfficer
          - rbac.AirspaceAuthority
          - rbac.SafetyReviewer
          - rbac.WaiverApprover
          - rbac.InvestigationOfficer
          - errors.ERR_UNAUTHORIZED
          - validations.priority_2
        distinguishing_aspect: |
          One probe per role boundary, all of them aimed at ids that do not exist. The role check
          sits at priority 2 and existence at priority 6, so every probe must answer
          ERR_UNAUTHORIZED and never a NOT_FOUND code - a system that looks the resource up first
          leaks existence to callers who are not allowed on the endpoint at all. The two
          adjacent review roles are probed against each other's step, which is where a single
          "reviewer" permission bucket would show up.
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z."
            - "One Pilot row exists so the Pilot-role probe carries a resolvable X-User-ID."
            - "No AirspaceAuthorization, KnowledgeTest, Waiver, AccidentReport or AirspaceZone referenced by the probes exists."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots"
              payload: { full_name: "Mira Colt", email: "mira.colt@example.com", operator_category: "RECREATIONAL" }
              as: ComplianceOfficer
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /drone-ops/airspace-authorizations/00000000-0000-4000-8000-0000000000a1/decide"
              payload: { decision: "APPROVE" }
              as: Pilot
              as_user_id: "${pid}"
              captures: { e_pilot_decides: $.data.error_id }
            - call: "POST /drone-ops/knowledge-tests/00000000-0000-4000-8000-0000000000a2/grade"
              payload: { raw_score: 90 }
              as: AirspaceAuthority
              captures: { e_authority_grades: $.data.error_id }
            - call: "POST /drone-ops/waivers/00000000-0000-4000-8000-0000000000a3/decide"
              payload: { decision: "APPROVE" }
              as: SafetyReviewer
              captures: { e_reviewer_decides: $.data.error_id }
            - call: "POST /drone-ops/waivers/00000000-0000-4000-8000-0000000000a4/clear-safety-case"
              payload: {}
              as: WaiverApprover
              captures: { e_approver_clears: $.data.error_id }
            - call: "POST /drone-ops/flights"
              payload: { pilot_id: "${pid}", aircraft_id: "00000000-0000-4000-8000-0000000000a5", zone_id: "00000000-0000-4000-8000-0000000000a6", operation_category: "RECREATIONAL", planned_start: "2026-03-10T09:00:00Z", planned_end: "2026-03-10T10:00:00Z", planned_max_altitude_ft: 380, launch_latitude: 48.85, launch_longitude: 2.35 }
              as: ComplianceOfficer
              captures: { e_officer_flies: $.data.error_id }
            - call: "POST /drone-ops/airspace-zones"
              payload: { designator: "ZONE-RBAC-01", class_code: "G", class_ceiling_ft: 400, requires_authorization: false, max_concurrent_authorizations: 1 }
              as: InvestigationOfficer
              captures: { e_investigator_zones: $.data.error_id }
            - call: "POST /drone-ops/accident-reports/00000000-0000-4000-8000-0000000000a7/close"
              payload: { damage_line_items: [{ label: "Airframe", amount_cents: 1000 }], probable_cause: "n/a" }
              as: ComplianceOfficer
              captures: { e_officer_closes: $.data.error_id }
            - call: "POST /drone-ops/pilots/00000000-0000-4000-8000-0000000000a8/suspend"
              payload: { suspension_reason: "Not my call to make." }
              as: SafetyReviewer
              captures: { e_reviewer_suspends: $.data.error_id }
            - call: "GET /drone-ops/pilots/${pid}"
              payload: {}
              as: SafetyReviewer
              captures: { shared_read: $.data.status }
          assert:
            - "all eight probes return HTTP 403 with error_id \"ERR_UNAUTHORIZED\": ${e_pilot_decides}, ${e_authority_grades}, ${e_reviewer_decides}, ${e_approver_clears}, ${e_officer_flies}, ${e_investigator_zones}, ${e_officer_closes}, ${e_reviewer_suspends}"
            - "none of them returns ERR_AUTHORIZATION_NOT_FOUND, ERR_KNOWLEDGE_TEST_NOT_FOUND, ERR_WAIVER_NOT_FOUND, ERR_REPORT_NOT_FOUND, ERR_PILOT_NOT_FOUND, ERR_AIRCRAFT_NOT_FOUND or ERR_ZONE_NOT_FOUND, even though every referenced id is unknown - priority 2 precedes priorities 6 and 9"
            - "the SafetyReviewer probe of POST /drone-ops/pilots/{id}/suspend is 403 while ${shared_read} == \"UNCERTIFIED\" on the shared read of the same aggregate - the denial is per endpoint, not a blanket ban on the role"
            - "no side effects: the zone list is still empty and the pilot's version is unchanged after all eight refusals"

      - name: blank_or_missing_identity_headers_are_rejected_before_any_other_check
        claim_type: unauthenticated
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - validations.priority_1
        distinguishing_aspect: |
          Authentication is priority 1, ahead of role, ownership and existence, so a request with
          an empty identity must fail with ERR_UNAUTHENTICATED even when it is also unauthorized
          and also points at a missing row. The blank probes send a literal empty string and a
          literal whitespace-only string - both are declared invalid - and the fixture must emit
          them verbatim rather than substituting a placeholder or dropping the header, because
          an omitted header and an empty header are two distinct probes of the same rule.
        test_recipe:
          setup:
            - "Logical clock at 2026-03-05T00:00:00Z."
            - "One Pilot row exists, so the only thing wrong with each probe is its identity headers."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots"
              payload: { full_name: "Ise Vahl", email: "ise.vahl@example.com", operator_category: "RECREATIONAL" }
              as: ComplianceOfficer
              captures: { pid: $.data.id }
          trigger:
            - call: "GET /drone-ops/pilots/${pid}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: ""
              captures: { e_blank_id: $.data.error_id, m_blank_id: $.data.message }
            - call: "GET /drone-ops/pilots/${pid}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "   "
              captures: { e_space_id: $.data.error_id }
            - call: "GET /drone-ops/pilots/${pid}"
              payload: {}
              as: ""
              as_user_id: "cx-user-1"
              captures: { e_blank_role: $.data.error_id }
            - call: "GET /drone-ops/certifications/00000000-0000-4000-8000-0000000000b4"
              payload: {}
              as: ""
              as_user_id: ""
              captures: { e_both_blank: $.data.error_id }
          assert:
            - "${e_blank_id} == \"ERR_UNAUTHENTICATED\" at 401 with a non-empty ${m_blank_id} - X-User-ID is present but empty"
            - "${e_space_id} == \"ERR_UNAUTHENTICATED\" - the three-space value is sent verbatim as the header value and is rejected as whitespace-only, not accepted as an opaque identifier"
            - "${e_blank_role} == \"ERR_UNAUTHENTICATED\" and not \"ERR_UNAUTHORIZED\" - an empty role is an authentication failure, not a role that happens to be absent from the endpoint's list"
            - "${e_both_blank} == \"ERR_UNAUTHENTICATED\" and not \"ERR_CERTIFICATION_NOT_FOUND\" - priority 1 runs before the path id is resolved"
            - "every probe is a read, so nothing in the system changes; the same GET with a valid ComplianceOfficer identity returns HTTP 200 for ${pid}"

      - name: a_pilot_cannot_reach_another_pilots_airframe_or_file_flights_in_their_name
        claim_type: ownership
        grounds:
          - errors.ERR_OWNERSHIP_VIOLATION
          - validations.priority_3
        distinguishing_aspect: |
          Ownership is checked two ways on the same endpoint family: by walking the path to the
          owning pilot (a module posted onto someone else's airframe) and by comparing a body
          field against the caller's own id (pilot_id and owner_pilot_id). The control calls pin
          that the rule is scoped to the Pilot role only - a ComplianceOfficer reads the same
          airframe successfully - so an implementation that scopes every role to its own id
          fails here.
        test_recipe:
          setup:
            - "Logical clock at 2026-03-08T00:00:00Z."
            - "Pilot A owns airframe AA (249 g, REGISTERED). Pilot B owns nothing."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-08T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots"
              payload: { full_name: "Ada Wren", email: "ada.wren@example.com", operator_category: "RECREATIONAL" }
              as: ComplianceOfficer
              captures: { pa: $.data.id }
            - call: "POST /drone-ops/pilots"
              payload: { full_name: "Bo Kell", email: "bo.kell@example.com", operator_category: "RECREATIONAL" }
              as: ComplianceOfficer
              captures: { pb: $.data.id }
            - call: "POST /drone-ops/aircraft"
              payload: { owner_pilot_id: "${pa}", model: "Own 1", serial_number: "SN-OWN-01", takeoff_weight_g: 249, max_altitude_ft: 900 }
              as: Pilot
              as_user_id: "${pa}"
              captures: { aa: $.data.id }
            - call: "POST /drone-ops/aircraft/${aa}/register"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /drone-ops/airspace-zones"
              payload: { designator: "ZONE-G-OWN", class_code: "G", class_ceiling_ft: 400, requires_authorization: false, max_concurrent_authorizations: 2 }
              as: AirspaceAuthority
              captures: { zid: $.data.id }
          trigger:
            - call: "GET /drone-ops/aircraft/${aa}"
              payload: {}
              as: Pilot
              as_user_id: "${pb}"
              captures: { e_read: $.data.error_id }
            - call: "POST /drone-ops/aircraft/${aa}/remote-id-modules"
              payload: { module_serial: "MOD-OWN-01", broadcast_protocol: "WIFI_NAN", firmware_version: "1.0.0" }
              as: Pilot
              as_user_id: "${pb}"
              captures: { e_module: $.data.error_id }
            - call: "POST /drone-ops/aircraft"
              payload: { owner_pilot_id: "${pa}", model: "Own 2", serial_number: "SN-OWN-02", takeoff_weight_g: 249, max_altitude_ft: 900 }
              as: Pilot
              as_user_id: "${pb}"
              captures: { e_body_owner: $.data.error_id }
            - call: "POST /drone-ops/flights"
              payload: { pilot_id: "${pa}", aircraft_id: "${aa}", zone_id: "${zid}", operation_category: "RECREATIONAL", planned_start: "2026-03-20T09:00:00Z", planned_end: "2026-03-20T10:00:00Z", planned_max_altitude_ft: 380, launch_latitude: 41.39, launch_longitude: 2.17 }
              as: Pilot
              as_user_id: "${pb}"
              captures: { e_body_pilot: $.data.error_id }
            - call: "GET /drone-ops/aircraft/${aa}"
              payload: {}
              as: ComplianceOfficer
              captures: { officer_read: $.data.registration_status }
            - call: "GET /drone-ops/aircraft/${aa}"
              payload: {}
              as: Pilot
              as_user_id: "${pa}"
              captures: { owner_read: $.data.serial_number }
          assert:
            - "${e_read} == ${e_module} == ${e_body_owner} == ${e_body_pilot} == \"ERR_OWNERSHIP_VIOLATION\" at 403"
            - "the module probe is 403 and not ERR_DUPLICATE_MODULE_SERIAL or ERR_INVALID_REQUEST - ownership is resolved through Aircraft.owner_pilot_id before the body is considered"
            - "the flight probe is 403 and not ERR_PILOT_NOT_CERTIFIED, even though pilot B is UNCERTIFIED: priority 3 precedes priority 16"
            - "${officer_read} == \"REGISTERED\" and ${owner_read} == \"SN-OWN-01\" - the rule binds the Pilot role only, and the owner is unaffected"
            - "GET /drone-ops/remote-id-modules?aircraft_id=${aa} returns total_count 0 - the refused module write persisted nothing"

      - name: every_role_performs_its_exclusive_and_shared_operations_end_to_end
        claim_type: exclusive_operations_allowed
        grounds:
          - rbac.Pilot
          - rbac.ComplianceOfficer
          - rbac.AirspaceAuthority
          - rbac.SafetyReviewer
          - rbac.WaiverApprover
          - rbac.InvestigationOfficer
        distinguishing_aspect: |
          The positive half of the RBAC matrix, walked as one continuous case so that every
          role's exclusive operations are exercised on rows the other roles created: the officer
          certifies and registers, the authority zones and approves, the pilot requests, applies,
          flies and completes, the reviewer reviews, a different approver decides, and the
          investigator files and opens. It also pins two shared operations - POST
          /drone-ops/aircraft (Pilot or officer) and POST /drone-ops/accident-reports (Pilot or
          investigator) - plus two shared reads, so a permission model that collapses the four
          back-office roles into one admin bucket still passes the negative instance but is
          indistinguishable from a model that gives each role only its own step here.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Distinct opaque X-User-IDs per back-office role: cx-user-1 (ComplianceOfficer), aa-user-1 (AirspaceAuthority), sr-user-1 (SafetyReviewer), wa-user-1 (WaiverApprover), io-user-1 (InvestigationOfficer)."
            - "Pilot P: RECREATIONAL, certified via a graded TRUST test. Airframe A: 249 g, max_altitude_ft 900, REGISTERED. Zone Z: class D, class_ceiling_ft 700, requires_authorization true, max_concurrent_authorizations 2."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
