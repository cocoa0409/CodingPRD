        grounds:
          - calculations.meter_read_validation
          - calculations.meter_read_validation.constants.SPIKE_MULTIPLIER
          - endpoints.POST_/_agent/meter-reads
          - state_machines.MeterRead.PENDING_VALIDATION_to_EXCEPTION
        distinguishing_aspect: |
          Boundary metric: the COMBINED (mono + colour) candidate delta against
          SPIKE_MULTIPLIER * rated_monthly_duty_cycle, probed through POST /_agent/meter-reads. Duty cycle
          20000 puts the limit at exactly 60000 pages. A combined delta of exactly 60000 must be ACCEPTED
          (strict `>` test) and a combined delta of 60001 must land in EXCEPTION / IMPLAUSIBLE_SPIKE.
          Implementations that test each meter's delta separately, or that use `>=`, break here.
