              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ordB_v: $.data.version }
          trigger:
            - call: "POST /orders/${ordB_id}/checkout"
              payload: { expected_order_version: "${ordB_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { fulfilB: $.data.fulfillment_status }
            - call: "GET /order-lines/${olB_id}"
              payload: {}
              as: StoreAdmin
              captures: { reservedB: $.data.reserved_qty, backB: $.data.backordered_qty }
          assert:
            - "InventoryItem.${inv_id}.available_qty == 0  # order A holds all 5"
            - "OrderLine.${olB_id}.reserved_qty == 0 and OrderLine.${olB_id}.backordered_qty == 3"
            - "Order.${ordB_id}.fulfillment_status == BACKORDERED"

      - name: return_window_closed_interval_boundary_inclusive_on_returns
        grounds:
          - validations[priority=9]
          - errors[ERR_RETURN_WINDOW_CLOSED]
          - entities.Product.fields.return_window_days
        distinguishing_aspect: |
          [closed time-interval] The return window is the closed interval [delivered_at, delivered_at + window_days].
          Delivered 2026-06-01 with window 30 days: a return at exactly 2026-07-01 (day +30) is inside and accepted,
          but at 2026-07-02 (day +31) it falls outside and is rejected with ERR_RETURN_WINDOW_CLOSED — distinct interval
          semantics (time, inclusive upper bound) from the aggregate-capacity overlap above.
        test_recipe:
          setup:
            - "CAPTURED+DELIVERED order, delivered 2026-06-01, product window 30 days; clock advanced to 2026-07-02 (day +31)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
