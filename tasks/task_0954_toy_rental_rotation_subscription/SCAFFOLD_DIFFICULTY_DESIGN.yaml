      - name: swap_allowance_boundary
        grounds:
          - validations[priority=8]
          - entities.RotationBox.fields.swap_count
          - errors[ERR_SWAP_ALLOWANCE_EXCEEDED]
        distinguishing_aspect: |
          Metric: swap COUNT at the allowance boundary (different metric from
          age-months, different endpoint POST /box-items/{id}/swap): with
          swap_allowance_per_cycle 1, the first swap (count 0 < 1) succeeds and
          the second (count 1 == allowance) fails ERR_SWAP_ALLOWANCE_EXCEEDED.
        test_recipe:
