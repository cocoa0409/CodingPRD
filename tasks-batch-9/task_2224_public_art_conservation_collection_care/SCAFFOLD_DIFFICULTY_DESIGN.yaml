              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { artwork_id: $.data.id }
            - call: "POST /public-art/maintenance-protocols"
              payload: { protocol_code: "WASH-BR", material_class: "BRONZE", method: "WASH", cycle_days: 180, requires_conservator: false }
              as: ChiefConservator
              as_user_id: "chief-1"
              captures: { protocol_id: $.data.id }
            - call: "POST /public-art/maintenance-visits"
              payload: { artwork_id: "${artwork_id}", protocol_id: "${protocol_id}", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-12T17:00:00Z" }
              as: MaintenanceCrew
              as_user_id: "crew-1"
              captures: { visit_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: PublicArtManager
              as_user_id: "mgr-1"
          trigger:
            - call: "POST /public-art/maintenance-visits"
              payload: { artwork_id: "${artwork_id}", protocol_id: "${protocol_id}", window_start: "2026-08-11T08:00:00Z", window_end: "2026-08-13T17:00:00Z" }
              as: MaintenanceCrew
              as_user_id: "crew-1"
          assert:
            - "response status is 409 and error_id == ERR_WINDOW_IN_PAST"
            - "error_id != ERR_SITE_WORK_CAPACITY_CONFLICT even though the window collides with visit ${visit_id}"
            - "GET /public-art/maintenance-visits?artwork_id=${artwork_id} still returns exactly one row, ${visit_id}, in status SCHEDULED"

  - rule_id: boundary_precision_check
    instances:
      - name: condition_index_exactly_at_treatment_trigger_does_not_flag
        grounds:
          - calculations.condition_index_score.constants.TREATMENT_TRIGGER_INDEX
          - state_machines.Artwork.MONITORED_to_TREATMENT_REQUIRED
          - entities.ConditionAssessment.fields.recommendation
          - endpoints["POST /public-art/condition-assessments/{id}/finalize"]
        distinguishing_aspect: |
          Numeric threshold at exactly the boundary on POST .../finalize: an INTERIOR BRONZE work with
          subscores 2/2/2/2/0 scores exactly 55.0, which is NOT below TREATMENT_TRIGGER_INDEX 55.0, so
          conservation_status must stay MONITORED and the recommendation must be ROUTINE; a companion
          work with 2/2/2/2/1 scores 52.5 and does flip to TREATMENT_REQUIRED with recommendation PRIORITY.
        test_recipe:
          setup:
            - "logical clock at its default 2026-08-01T00:00:00Z"
            - "one INTERIOR site with capacity_units 20 holding two BRONZE LANDMARK works of footprint 6 each"
            - "two SUBMITTED ConditionAssessments with three photos each: work A subscores 2/2/2/2/0, work B subscores 2/2/2/2/1, both assessed_on 2026-08-01"
          setup_api_calls:
            - call: "POST /public-art/artists"
              payload: { full_name: "Ada Vance", is_living: true, contact_email: "ada@example.gov" }
              as: CollectionsRegistrar
