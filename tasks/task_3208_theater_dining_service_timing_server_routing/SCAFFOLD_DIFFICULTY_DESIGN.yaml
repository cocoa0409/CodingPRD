            - "the slip then reaches data.status == \"READY\" on the fulfilment axis, with the identification axis still unverified"
            - "delivering a READY slip while the identification axis is PENDING is rejected with data.error_id == \"ERR_ID_CHECK_REQUIRED\""
            - "after verify-id with id_result PASS the identification axis reads VERIFIED and the fulfilment axis still reads READY, so the same row advanced on one axis and stalled on the other"
  # ===========================================================================
  # Rule 4 — transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: unverified_alcohol_cascade_ticket_to_slip_to_server_rollup
        grounds:
          - state_machines.Showtime.SERVICE_to_RUNNING
          - state_machines.OrderSlip.ACCEPTED_to_VOIDED
          - calculations.kitchen_load_rollup
          - calculations.ticket_sequence_position
          - entities.Server.fields.rollup_provisional_cents
          - entities.CheckTab.fields.original_cents
        distinguishing_aspect: |
          Depth 4, each hop caused by the previous one: the feature-start cut
          voids the unverified ticket (hop 1), that void is what drives the slip
          to VOIDED (hop 2), the slip leaving the cohort is what recomputes the
          rollup and renumbers the surviving tickets (hop 3), and the changed
          check plus rollup is what moves the owning server's rollup figure and
          the auditorium's shock liability (hop 4).
        test_recipe:
          setup:
            - "Auditorium A, 60 seats, kitchen_point_rate 1, alcove_point_rate 3. BEVERAGE L1 price 1500 prep 1 is_alcoholic true. Server S1 hired into A."
            - "Showtime X1 on A starts 2026-09-01T20:00:00Z runtime 100. Clock 2026-09-01T19:55:00Z. X1 DINING_OPEN with one section SA1 (S1, LEFT)."
            - "One BEVERAGE slip of 1x L1 at seat 20 on SA1, id_check_required true and id_check_status PENDING. The hot_line ticket exists because X1 was moved into SERVICE."
          setup_api_calls:
            - call: "POST /auditoriums"
              payload: { name: "Theater 4", seat_capacity: 60, screen_lead_time_minutes: 20, kitchen_point_rate: 1, alcove_point_rate: 3 }
              as: PlatformAdmin
              captures: { aud_id: $.data.id }
            - call: "POST /menu-items"
              payload: { catalog_name: "Stout", channel: "BEVERAGE", price_cents: 1500, prep_minutes: 1, is_alcoholic: true }
              as: PlatformAdmin
              captures: { l1_id: $.data.id }
            - call: "POST /servers"
              payload: { display_name: "Tomas", home_auditorium_id: "${aud_id}" }
              as: PlatformAdmin
              captures: { srv1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T19:55:00Z" }
              as: PlatformAdmin
            - call: "POST /showtimes"
              payload: { auditorium_id: "${aud_id}", title: "Sicario", start_at_utc: "2026-09-01T20:00:00Z", runtime_minutes: 100, content_type: "STANDARD" }
              as: ProgrammingCoordinator
              captures: { x1_id: $.data.id, x1_v: $.data.version }
            - call: "POST /showtimes/${x1_id}/open-dining"
              payload: {}
              as: KitchenLead
            - call: "POST /section-assignments"
              payload: { showtime_id: "${x1_id}", server_id: "${srv1_id}", section_label: "LEFT" }
              as: KitchenLead
              captures: { sa1_id: $.data.id }
            - call: "POST /order-slips"
              payload: { showtime_id: "${x1_id}", section_assignment_id: "${sa1_id}", seat_number: 20, lines: [ { menu_item_id: "${l1_id}", quantity: 1 } ], expected_showtime_version: "${x1_v}" }
              as: Server
              as_user_id: "${srv1_id}"
              captures: { slip_id: $.data.id }
            - call: "POST /showtimes/${x1_id}/start-service"
              payload: {}
              as: KitchenLead
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T20:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /showtimes/${x1_id}/start-feature"
              payload: {}
              as: KitchenLead
            - call: "POST /showtimes/${x1_id}/start-feature"
              payload: {}
              as: PlatformAdmin
              captures: { err_already: $.data.error_id }
            - call: "GET /order-slips/${slip_id}"
              payload: {}
              as: Server
            - call: "GET /servers/${srv1_id}"
              payload: {}
              as: KitchenLead
          assert:
            - "hop 1: the hot_line KitchenTicket for the unverified slip leaves the queue and reads VOIDED with data.station == \"hot_line\""
            - "hop 2: the slip reads data.status == \"VOIDED\" and data.id_check_status == \"REFUSED\", and its check reads data.original_cents == 0"
            - "hop 3: the showtime's kitchen_load_rollup drops to 0 for the ENTREE cohort, because the voided slip no longer consumes capacity"
            - "hop 4: the owning server's data.rollup_provisional_cents drops from 1500 to 0, and the auditorium's shock liability read drops to 0 in the same breath"
            - "the second start-feature call is rejected rather than re-running the cascade, so the clock advancing to exactly start_at_utc does not double-charge the void"

      - name: ejection_cascade_event_to_slip_to_server_rotation
        grounds:
          - state_machines.Showtime.RUNNING_to_CANCELLED
          - state_machines.OrderSlip.DELIVERED_to_DELIVERED
          - state_machines.CheckTab.OPEN_to_REFUNDED
          - calculations.section_assignment_points
          - entities.Server.fields.in_rotation
          - entities.Server.fields.status
        distinguishing_aspect: |
          Depth 3, triggered from a different transition than the alcohol void —
          the ejection approval: the disturbance event's approval forces the slip's
          compensating DELIVERED-to-DELIVERED refund (hop 1), that refund drives the
