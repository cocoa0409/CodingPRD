# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Dual Enrollment & Concurrent Credit
# Sections and claim_type values follow references/claim-extraction-guide.md
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: create_high_school_applies_default_status
        claim_type: defaults
        grounds: [entities.HighSchool.fields.status]
        distinguishing_aspect: "Omitting status yields the system default ACTIVE with version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /dual-credit/high-schools", payload: { name: "Northview HS", district_code: "NV-01" }, as: DualCreditAdmin, captures: { hs_id: $.data.id, hs_status: $.data.status, hs_v: $.data.version } }
          assert:
            - "${hs_status} == ACTIVE (system default applied)"
            - "${hs_v} == 1"

      - name: create_term_missing_required_field_rejected
        claim_type: required_fields
        grounds: [entities.AcademicTerm.fields.end_date, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /terms without end_date fails shape validation with ERR_VALIDATION (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /dual-credit/terms", payload: { institution_type: COLLEGE, name: "Fall 2026 College", start_date: "2026-08-15T00:00:00Z", add_deadline: "2026-09-01T00:00:00Z", drop_deadline: "2026-09-15T00:00:00Z", withdraw_deadline: "2026-11-01T00:00:00Z" }, as: DualCreditAdmin, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_VALIDATION"

      - name: create_term_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.AcademicTerm.fields.institution_type, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "institution_type 'UNIVERSITY' is not a declared enum member -> ERR_VALIDATION."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /dual-credit/terms", payload: { institution_type: "UNIVERSITY", name: "X", start_date: "2026-08-15T00:00:00Z", end_date: "2026-12-15T00:00:00Z", add_deadline: "2026-09-01T00:00:00Z", drop_deadline: "2026-09-15T00:00:00Z", withdraw_deadline: "2026-11-01T00:00:00Z" }, as: DualCreditAdmin, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_VALIDATION"

      - name: term_date_ordering_rejected
        claim_type: type_constraints
        grounds: [entities.AcademicTerm.fields.date_ordering, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "add_deadline before start_date violates start < add <= drop <= withdraw <= end -> ERR_VALIDATION."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /dual-credit/terms", payload: { institution_type: COLLEGE, name: "Bad Term", start_date: "2026-08-15T00:00:00Z", end_date: "2026-12-15T00:00:00Z", add_deadline: "2026-08-01T00:00:00Z", drop_deadline: "2026-09-15T00:00:00Z", withdraw_deadline: "2026-11-01T00:00:00Z" }, as: DualCreditAdmin, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_VALIDATION"

      - name: offering_computed_seat_counters_at_creation
        claim_type: computed_fields
        grounds: [entities.CourseOffering.fields.seats_taken, entities.CourseOffering.fields.seats_available, calculations.seat_availability]
        distinguishing_aspect: "A DRAFT offering computes seats_taken == 0 and seats_available == capacity (7) immediately in the create response."
        test_recipe:
          setup: ["school, college term, HS term, course, instructor exist"]
          setup_api_calls:
            - { call: "POST /dual-credit/high-schools", payload: { name: "Northview HS", district_code: "NV-01" }, as: DualCreditAdmin, captures: { hs_id: $.data.id } }
            - { call: "POST /dual-credit/terms", payload: { institution_type: COLLEGE, name: "Fall 2026 College", start_date: "2026-08-15T00:00:00Z", end_date: "2026-12-15T00:00:00Z", add_deadline: "2026-09-01T00:00:00Z", drop_deadline: "2026-09-15T00:00:00Z", withdraw_deadline: "2026-11-01T00:00:00Z" }, as: DualCreditAdmin, captures: { ct_id: $.data.id } }
            - { call: "POST /dual-credit/terms", payload: { institution_type: HIGH_SCHOOL, high_school_id: "${hs_id}", name: "Fall 2026 HS", start_date: "2026-08-20T00:00:00Z", end_date: "2026-12-20T00:00:00Z", add_deadline: "2026-09-05T00:00:00Z", drop_deadline: "2026-09-10T00:00:00Z", withdraw_deadline: "2026-10-25T00:00:00Z" }, as: DualCreditAdmin, captures: { ht_id: $.data.id } }
            - { call: "POST /dual-credit/courses", payload: { course_code: "HIST210", title: "US History", college_credit_hours: 3, hs_credit_units: 1.0, placement_exam_code: "NONE", min_placement_score: 0 }, as: DualCreditAdmin, captures: { crs_id: $.data.id } }
            - { call: "POST /dual-credit/instructors", payload: { full_name: "Pat Quinn", high_school_id: "${hs_id}" }, as: DualCreditAdmin, captures: { ins_id: $.data.id } }
          trigger:
            - { call: "POST /dual-credit/offerings", payload: { course_id: "${crs_id}", college_term_id: "${ct_id}", hs_term_id: "${ht_id}", high_school_id: "${hs_id}", instructor_id: "${ins_id}", capacity: 7 }, as: DualCreditAdmin, captures: { off_status: $.data.status, taken: $.data.seats_taken, avail: $.data.seats_available, mode: $.data.delivery_mode } }
          assert:
            - "${off_status} == DRAFT (initial state) and ${mode} == HS_CAMPUS (default applied when omitted)"
            - "${taken} == 0 and ${avail} == 7 (computed counters at creation)"

      - name: student_gpa_fields_initialize_zero
        claim_type: computed_fields
        grounds: [entities.Student.fields.college_gpa, entities.Student.fields.hs_gpa]
        distinguishing_aspect: "Newly created student carries college_gpa == 0.000 and hs_gpa == 0.000 (empty eligible set rule)."
        test_recipe:
          setup: ["school exists"]
          setup_api_calls:
            - { call: "POST /dual-credit/high-schools", payload: { name: "Northview HS", district_code: "NV-01" }, as: DualCreditAdmin, captures: { hs_id: $.data.id } }
          trigger:
            - { call: "POST /dual-credit/students", payload: { full_name: "Jamie Diaz", high_school_id: "${hs_id}", grade_level: 12 }, as: HsCoordinator, captures: { cg: $.data.college_gpa, hg: $.data.hs_gpa, st: $.data.status } }
          assert:
            - "${cg} == 0.000 and ${hg} == 0.000 and ${st} == ELIGIBLE"

      - name: placement_record_expiry_computed
        claim_type: computed_fields
        grounds: [entities.PlacementRecord.fields.expires_at, calculations.placement_recency]
        distinguishing_aspect: "expires_at == taken_at + 730 days exactly: 2026-08-01T00:00:00Z -> 2028-07-31T00:00:00Z (2028 is a leap year)."
        test_recipe:
          setup: ["school + student exist"]
          setup_api_calls:
            - { call: "POST /dual-credit/high-schools", payload: { name: "Northview HS", district_code: "NV-01" }, as: DualCreditAdmin, captures: { hs_id: $.data.id } }
            - { call: "POST /dual-credit/students", payload: { full_name: "Jamie Diaz", high_school_id: "${hs_id}", grade_level: 12 }, as: HsCoordinator, captures: { stu_id: $.data.id } }
          trigger:
            - { call: "POST /dual-credit/placement-records", payload: { student_id: "${stu_id}", exam_code: "MATH", score: 85, taken_at: "2026-08-01T00:00:00Z" }, as: HsCoordinator, captures: { exp: $.data.expires_at } }
          assert:
            - "${exp} == 2028-07-31T00:00:00Z"
            - "The response carries id and created_at but no version / updated_at (common_fields: false immutable record)"

      - name: get_nonexistent_student_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but unknown student id -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /dual-credit/students/00000000-0000-4000-8000-000000000000", as: Any, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_NOT_FOUND (HTTP 404)"

      - name: list_pagination_envelope_and_bounds
        claim_type: listing
        grounds: [response_envelope.pagination_fields, response_envelope.pagination_defaults, "errors[ERR_INVALID_PAGINATION_PARAMETERS]"]
        distinguishing_aspect: "List responses carry limit/offset/total_count/has_more with defaults limit=10 offset=0; limit=0 is rejected with ERR_INVALID_PAGINATION_PARAMETERS."
        test_recipe:
          setup: ["two students exist"]
          setup_api_calls:
            - { call: "POST /dual-credit/high-schools", payload: { name: "Northview HS", district_code: "NV-01" }, as: DualCreditAdmin, captures: { hs_id: $.data.id } }
            - { call: "POST /dual-credit/students", payload: { full_name: "Alpha One", high_school_id: "${hs_id}", grade_level: 11 }, as: HsCoordinator }
            - { call: "POST /dual-credit/students", payload: { full_name: "Beta Two", high_school_id: "${hs_id}", grade_level: 12 }, as: HsCoordinator }
          trigger:
            - { call: "GET /dual-credit/students?limit=1&offset=0", as: Any, captures: { first_page: $.data } }
            - { call: "GET /dual-credit/students?limit=0", as: Any, captures: { err: $.data.error_id } }
          assert:
            - "First page returns exactly 1 student with pagination fields limit == 1, offset == 0, total_count == 2, has_more == true"
            - "${err} == ERR_INVALID_PAGINATION_PARAMETERS"

      - name: create_student_unknown_school_returns_not_found
        claim_type: parent_relationships
        grounds: [entities.Student.fields.high_school_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Body FK integrity: creating a student against an unknown high_school_id -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /dual-credit/students", payload: { full_name: "Jamie Diaz", high_school_id: "00000000-0000-4000-8000-000000000000", grade_level: 12 }, as: HsCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_NOT_FOUND"

      - name: fk_reverse_reachability_lists
        claim_type: retrieval
        grounds: [entities.Enrollment.fields.offering_id, entities.Invoice.fields.enrollment_id, entities.TranscriptEntry.fields.enrollment_id]
        distinguishing_aspect: "Every child collection is reachable from its parent id via filtered list: enrollments by offering_id, invoices and transcript-entries by enrollment_id (array shape, length 0 before any child exists)."
        test_recipe:
          setup: ["school exists; no children created"]
          setup_api_calls:
            - { call: "POST /dual-credit/high-schools", payload: { name: "Northview HS", district_code: "NV-01" }, as: DualCreditAdmin, captures: { hs_id: $.data.id } }
          trigger:
            - { call: "GET /dual-credit/enrollments?offering_id=00000000-0000-4000-8000-000000000000", as: Any, captures: { enrs: $.data } }
            - { call: "GET /dual-credit/invoices?enrollment_id=00000000-0000-4000-8000-000000000000", as: Any, captures: { invs: $.data } }
          assert:
            - "${enrs} == [] and ${invs} == [] (filtered-list reverse reachability returns empty arrays, not errors)"

  - section: state_machines
    instances:
      - name: term_close_from_closed_rejected
        claim_type: invalid_transition
        grounds: [state_machines.AcademicTerm.OPEN_to_CLOSED, "errors[ERR_TERM_INVALID_STATE]"]
        distinguishing_aspect: "A second close-registration on a CLOSED term is rejected with ERR_TERM_INVALID_STATE and fires no side effects."
        test_recipe:
          setup: ["one college term, opened then closed"]
          setup_api_calls:
            - { call: "POST /dual-credit/terms", payload: { institution_type: COLLEGE, name: "Fall 2026 College", start_date: "2026-08-15T00:00:00Z", end_date: "2026-12-15T00:00:00Z", add_deadline: "2026-09-01T00:00:00Z", drop_deadline: "2026-09-15T00:00:00Z", withdraw_deadline: "2026-11-01T00:00:00Z" }, as: DualCreditAdmin, captures: { ct_id: $.data.id } }
            - { call: "POST /dual-credit/terms/${ct_id}/open-registration", payload: {}, as: DualCreditAdmin }
            - { call: "POST /dual-credit/terms/${ct_id}/close-registration", payload: {}, as: DualCreditAdmin }
          trigger:
            - { call: "POST /dual-credit/terms/${ct_id}/close-registration", payload: {}, as: DualCreditAdmin, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_TERM_INVALID_STATE"

      - name: offering_finalize_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.CourseOffering.GRADING_to_FINALIZED, "errors[ERR_OFFERING_INVALID_STATE]"]
        distinguishing_aspect: "finalize is only valid from GRADING; from DRAFT it fails ERR_OFFERING_INVALID_STATE."
        test_recipe:
          setup: ["DRAFT offering exists"]
          setup_api_calls:
            - { call: "POST /dual-credit/high-schools", payload: { name: "Northview HS", district_code: "NV-01" }, as: DualCreditAdmin, captures: { hs_id: $.data.id } }
            - { call: "POST /dual-credit/terms", payload: { institution_type: COLLEGE, name: "Fall 2026 College", start_date: "2026-08-15T00:00:00Z", end_date: "2026-12-15T00:00:00Z", add_deadline: "2026-09-01T00:00:00Z", drop_deadline: "2026-09-15T00:00:00Z", withdraw_deadline: "2026-11-01T00:00:00Z" }, as: DualCreditAdmin, captures: { ct_id: $.data.id } }
            - { call: "POST /dual-credit/terms", payload: { institution_type: HIGH_SCHOOL, high_school_id: "${hs_id}", name: "Fall 2026 HS", start_date: "2026-08-20T00:00:00Z", end_date: "2026-12-20T00:00:00Z", add_deadline: "2026-09-05T00:00:00Z", drop_deadline: "2026-09-10T00:00:00Z", withdraw_deadline: "2026-10-25T00:00:00Z" }, as: DualCreditAdmin, captures: { ht_id: $.data.id } }
            - { call: "POST /dual-credit/courses", payload: { course_code: "HIST210", title: "US History", college_credit_hours: 3, hs_credit_units: 1.0, placement_exam_code: "NONE", min_placement_score: 0 }, as: DualCreditAdmin, captures: { crs_id: $.data.id } }
            - { call: "POST /dual-credit/instructors", payload: { full_name: "Pat Quinn", high_school_id: "${hs_id}" }, as: DualCreditAdmin, captures: { ins_id: $.data.id } }
            - { call: "POST /dual-credit/offerings", payload: { course_id: "${crs_id}", college_term_id: "${ct_id}", hs_term_id: "${ht_id}", high_school_id: "${hs_id}", instructor_id: "${ins_id}", capacity: 2 }, as: DualCreditAdmin, captures: { off_id: $.data.id } }
          trigger:
            - { call: "POST /dual-credit/offerings/${off_id}/finalize", payload: {}, as: CollegeRegistrar, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_OFFERING_INVALID_STATE"

      - name: confirm_dropped_enrollment_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Enrollment.REGISTERED_to_DROPPED, "errors[ERR_ENROLLMENT_INVALID_STATE]"]
        distinguishing_aspect: "DROPPED is terminal: a later confirm on the same enrollment fails ERR_ENROLLMENT_INVALID_STATE even with a fresh offering version."
        test_recipe:
          setup: ["standard fixture, capacity 2, no-placement course; e1 REGISTERED then dropped at the default clock 2026-08-01"]
          setup_api_calls:
            - { call: "POST /dual-credit/high-schools", payload: { name: "Northview HS", district_code: "NV-01" }, as: DualCreditAdmin, captures: { hs_id: $.data.id } }
            - { call: "POST /dual-credit/terms", payload: { institution_type: COLLEGE, name: "Fall 2026 College", start_date: "2026-08-15T00:00:00Z", end_date: "2026-12-15T00:00:00Z", add_deadline: "2026-09-01T00:00:00Z", drop_deadline: "2026-09-15T00:00:00Z", withdraw_deadline: "2026-11-01T00:00:00Z" }, as: DualCreditAdmin, captures: { ct_id: $.data.id } }
            - { call: "POST /dual-credit/terms", payload: { institution_type: HIGH_SCHOOL, high_school_id: "${hs_id}", name: "Fall 2026 HS", start_date: "2026-08-20T00:00:00Z", end_date: "2026-12-20T00:00:00Z", add_deadline: "2026-09-05T00:00:00Z", drop_deadline: "2026-09-10T00:00:00Z", withdraw_deadline: "2026-10-25T00:00:00Z" }, as: DualCreditAdmin, captures: { ht_id: $.data.id } }
            - { call: "POST /dual-credit/courses", payload: { course_code: "HIST210", title: "US History", college_credit_hours: 3, hs_credit_units: 1.0, placement_exam_code: "NONE", min_placement_score: 0 }, as: DualCreditAdmin, captures: { crs_id: $.data.id } }
            - { call: "POST /dual-credit/instructors", payload: { full_name: "Pat Quinn", high_school_id: "${hs_id}" }, as: DualCreditAdmin, captures: { ins_id: $.data.id } }
            - { call: "POST /dual-credit/credential-applications", payload: { instructor_id: "${ins_id}", course_id: "${crs_id}", qualification_summary: "MA History" }, as: Instructor, as_user_id: "${ins_id}", captures: { cap_id: $.data.id } }
            - { call: "POST /dual-credit/credential-applications/${cap_id}/begin-review", payload: {}, as: CredentialReviewer, as_user_id: "rev-1" }
            - { call: "POST /dual-credit/credential-applications/${cap_id}/approve", payload: {}, as: CredentialReviewer, as_user_id: "rev-1" }
            - { call: "POST /dual-credit/funding-agreements", payload: { high_school_id: "${hs_id}", college_term_id: "${ct_id}", funding_model: STATE_PROGRAM, tuition_cents_per_credit: 40000, state_rate_cents_per_credit: 30000, district_cap_cents: 0 }, as: DualCreditAdmin }
            - { call: "POST /dual-credit/offerings", payload: { course_id: "${crs_id}", college_term_id: "${ct_id}", hs_term_id: "${ht_id}", high_school_id: "${hs_id}", instructor_id: "${ins_id}", capacity: 2 }, as: DualCreditAdmin, captures: { off_id: $.data.id } }
            - { call: "POST /dual-credit/terms/${ct_id}/open-registration", payload: {}, as: DualCreditAdmin }
            - { call: "POST /dual-credit/terms/${ht_id}/open-registration", payload: {}, as: DualCreditAdmin }
            - { call: "POST /dual-credit/offerings/${off_id}/open", payload: {}, as: DualCreditAdmin }
            - { call: "POST /dual-credit/students", payload: { full_name: "Jamie Diaz", high_school_id: "${hs_id}", grade_level: 12 }, as: HsCoordinator, captures: { stu_id: $.data.id } }
            - { call: "POST /dual-credit/enrollments", payload: { student_id: "${stu_id}", offering_id: "${off_id}" }, as: HsCoordinator, captures: { enr_id: $.data.id } }
            - { call: "GET /dual-credit/offerings/${off_id}", as: Any, captures: { off_v: $.data.version } }
            - { call: "POST /dual-credit/enrollments/${enr_id}/confirm", payload: { expected_offering_version: "${off_v}" }, as: HsCoordinator }
            - { call: "POST /dual-credit/enrollments/${enr_id}/drop", payload: {}, as: HsCoordinator }
          trigger:
            - { call: "GET /dual-credit/offerings/${off_id}", as: Any, captures: { off_v2: $.data.version } }
            - { call: "POST /dual-credit/enrollments/${enr_id}/confirm", payload: { expected_offering_version: "${off_v2}" }, as: HsCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_ENROLLMENT_INVALID_STATE (terminal DROPPED never leaves)"

      - name: credential_approve_from_submitted_rejected
        claim_type: invalid_transition
        grounds: [state_machines.CredentialApplication.SUBMITTED_to_UNDER_REVIEW, "errors[ERR_CREDENTIAL_APPLICATION_INVALID_STATE]"]
        distinguishing_aspect: "approve requires UNDER_REVIEW; from SUBMITTED it fails ERR_CREDENTIAL_APPLICATION_INVALID_STATE (the review must be claimed first)."
        test_recipe:
          setup: ["credential application exists in SUBMITTED"]
          setup_api_calls:
            - { call: "POST /dual-credit/high-schools", payload: { name: "Northview HS", district_code: "NV-01" }, as: DualCreditAdmin, captures: { hs_id: $.data.id } }
            - { call: "POST /dual-credit/courses", payload: { course_code: "MATH151", title: "College Algebra", college_credit_hours: 3, hs_credit_units: 1.0, placement_exam_code: "MATH", min_placement_score: 70 }, as: DualCreditAdmin, captures: { crs_id: $.data.id } }
            - { call: "POST /dual-credit/instructors", payload: { full_name: "Pat Quinn", high_school_id: "${hs_id}" }, as: DualCreditAdmin, captures: { ins_id: $.data.id } }
            - { call: "POST /dual-credit/credential-applications", payload: { instructor_id: "${ins_id}", course_id: "${crs_id}", qualification_summary: "MS Mathematics" }, as: Instructor, as_user_id: "${ins_id}", captures: { cap_id: $.data.id } }
          trigger:
            - { call: "POST /dual-credit/credential-applications/${cap_id}/approve", payload: {}, as: CredentialReviewer, as_user_id: "rev-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_CREDENTIAL_APPLICATION_INVALID_STATE"

      - name: withdraw_during_drop_window_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Enrollment.REGISTERED_to_WITHDRAWN, "errors[ERR_ENROLLMENT_INVALID_STATE]"]
        distinguishing_aspect: "At the default clock 2026-08-01 the drop window is still open; withdraw is refused with ERR_ENROLLMENT_INVALID_STATE — the earlier, gentler action must be used."
        test_recipe:
          setup: ["standard fixture, capacity 2, no-placement course; e1 REGISTERED; clock untouched at the 2026-08-01 default (<= min drop 2026-09-10)"]
          setup_api_calls:
            - { call: "POST /dual-credit/high-schools", payload: { name: "Northview HS", district_code: "NV-01" }, as: DualCreditAdmin, captures: { hs_id: $.data.id } }
            - { call: "POST /dual-credit/terms", payload: { institution_type: COLLEGE, name: "Fall 2026 College", start_date: "2026-08-15T00:00:00Z", end_date: "2026-12-15T00:00:00Z", add_deadline: "2026-09-01T00:00:00Z", drop_deadline: "2026-09-15T00:00:00Z", withdraw_deadline: "2026-11-01T00:00:00Z" }, as: DualCreditAdmin, captures: { ct_id: $.data.id } }
            - { call: "POST /dual-credit/terms", payload: { institution_type: HIGH_SCHOOL, high_school_id: "${hs_id}", name: "Fall 2026 HS", start_date: "2026-08-20T00:00:00Z", end_date: "2026-12-20T00:00:00Z", add_deadline: "2026-09-05T00:00:00Z", drop_deadline: "2026-09-10T00:00:00Z", withdraw_deadline: "2026-10-25T00:00:00Z" }, as: DualCreditAdmin, captures: { ht_id: $.data.id } }
            - { call: "POST /dual-credit/courses", payload: { course_code: "HIST210", title: "US History", college_credit_hours: 3, hs_credit_units: 1.0, placement_exam_code: "NONE", min_placement_score: 0 }, as: DualCreditAdmin, captures: { crs_id: $.data.id } }
            - { call: "POST /dual-credit/instructors", payload: { full_name: "Pat Quinn", high_school_id: "${hs_id}" }, as: DualCreditAdmin, captures: { ins_id: $.data.id } }
            - { call: "POST /dual-credit/credential-applications", payload: { instructor_id: "${ins_id}", course_id: "${crs_id}", qualification_summary: "MA History" }, as: Instructor, as_user_id: "${ins_id}", captures: { cap_id: $.data.id } }
            - { call: "POST /dual-credit/credential-applications/${cap_id}/begin-review", payload: {}, as: CredentialReviewer, as_user_id: "rev-1" }
