  - section: validations
    instances:
      - name: channel_code_global_uniqueness_conflict
        claim_type: violation_to_error
        grounds:
          - validations[priority 23]
          - errors[ERR_CHANNEL_CODE_TAKEN]
          - entities.TourChannel.channel_code
        distinguishing_aspect: "channel_code is unique globally while name is not: a second channel carrying OFF_PROPERTY_CONTACT under a different name and different gift value returns 409 ERR_CHANNEL_CODE_TAKEN and writes nothing, whereas a MINI_VAC_PACKAGE channel reusing the very same name is created."
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z; no channels exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /tour-channels"
              payload: { name: "Off-Property Contact", channel_code: "OFF_PROPERTY_CONTACT", incentive_gift_value_cents: 12500, min_age: 30, min_household_income_cents: 5000000, min_qualification_score: 55 }
              as: MarketingManager
              captures: { ch1: $.data.id }
            - call: "POST /tour-channels"
              payload: { name: "Boardwalk Kiosk Team", channel_code: "OFF_PROPERTY_CONTACT", incentive_gift_value_cents: 9900, min_age: 25, min_household_income_cents: 4000000, min_qualification_score: 40 }
              as: MarketingManager
            - call: "POST /tour-channels"
              payload: { name: "Off-Property Contact", channel_code: "MINI_VAC_PACKAGE", incentive_gift_value_cents: 19900, min_age: 30, min_household_income_cents: 5000000, min_qualification_score: 55 }
              as: MarketingManager
              captures: { ch2: $.data.id }
            - call: "GET /tour-channels/${ch1}"
              payload: {}
              as: MarketingManager
          assert:
            - "trigger 2 returns 409 with error_id ERR_CHANNEL_CODE_TAKEN"
            - "trigger 3 returns 201 (the duplicated name is not constrained), and TourChannel.${ch2}.channel_code == MINI_VAC_PACKAGE"
            - "trigger 4 shows TourChannel.${ch1}.incentive_gift_value_cents == 12500, min_age == 30, min_qualification_score == 55 and version == 1 -- the rejected call mutated nothing"
            - "TourChannel.${ch1}.status == ACTIVE and requires_married_household == false (declared default)"

      - name: rotation_position_uniqueness_scoped_to_one_gallery
        claim_type: cross_entity_validation
        grounds:
          - validations[priority 24]
          - errors[ERR_ROTATION_POSITION_TAKEN]
          - entities.SalesRepresentative.rotation_position
        distinguishing_aspect: "rotation_position is unique per gallery_id, not globally: position 1 in the Orlando gallery blocks a second Orlando representative at position 1 even under a different license_number, while position 1 in the Las Vegas gallery is accepted."
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z; two galleries exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sales-galleries"
              payload: { name: "Orlando Sales Gallery", site_code: "ORLGAL", concurrent_tour_capacity: 4, presentation_minutes: 120, buffer_minutes: 30 }
              as: GalleryManager
              captures: { g1: $.data.id }
            - call: "POST /sales-galleries"
              payload: { name: "Las Vegas Sales Gallery", site_code: "LVSGAL", concurrent_tour_capacity: 4, presentation_minutes: 120, buffer_minutes: 30 }
              as: GalleryManager
              captures: { g2: $.data.id }
          trigger:
            - call: "POST /sales-representatives"
              payload: { gallery_id: "${g1}", full_name: "Dana Reyes", license_number: "FL-SL-410077", rotation_position: 1 }
              as: GalleryManager
              captures: { r1: $.data.id }
            - call: "POST /sales-representatives"
              payload: { gallery_id: "${g1}", full_name: "Marco Iyer", license_number: "FL-SL-410078", rotation_position: 1 }
              as: GalleryManager
            - call: "POST /sales-representatives"
              payload: { gallery_id: "${g2}", full_name: "Priya Raman", license_number: "NV-SL-810079", rotation_position: 1 }
              as: GalleryManager
              captures: { r3: $.data.id }
            - call: "GET /sales-representatives"
              payload: { gallery_id: "${g1}" }
              as: GalleryManager
          assert:
            - "trigger 2 returns 409 with error_id ERR_ROTATION_POSITION_TAKEN"
            - "trigger 3 returns 201 and SalesRepresentative.${r3}.rotation_position == 1 with gallery_id == ${g2}"
            - "trigger 4 returns total_count == 1 -- the refused representative left no row in the Orlando gallery"
            - "SalesRepresentative.${r1}.status == ACTIVE, tours_taken_count == 0, compliance_strike_count == 0, cancellation_rate == null"

      - name: prospect_hard_minimum_criteria_precede_score_threshold
        claim_type: priority_ordering
        grounds:
          - validations[priority 31]
          - validations[priority 32]
          - calculations.tour_qualification_evaluation
        distinguishing_aspect: "The three hard minimums are evaluated before any scoring, so a prospect who both fails min_age and would score below the cut returns ERR_PROSPECT_BELOW_MINIMUM_CRITERIA (not ERR_PROSPECT_NOT_QUALIFIED), and a SINGLE prospect scoring 70 against a requires_married_household channel still returns ERR_PROSPECT_BELOW_MINIMUM_CRITERIA; only a prospect clearing all three floors can reach the score gate and receive ERR_PROSPECT_NOT_QUALIFIED at 40 < 55."
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z."
            - "Two channels with identical floors min_age 30 / min_household_income_cents 5000000 / min_qualification_score 55; the MINI_VAC_PACKAGE channel additionally sets requires_married_household true."
            - "Four prospects: 24/3000000/SINGLE, 45/6000000/SINGLE, 45/15000000/SINGLE, 45/10000000/MARRIED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sales-galleries"
              payload: { name: "Orlando Sales Gallery", site_code: "ORLGAL", concurrent_tour_capacity: 4, presentation_minutes: 120, buffer_minutes: 30 }
              as: GalleryManager
              captures: { g1: $.data.id }
            - call: "POST /tour-channels"
              payload: { name: "Off-Property Contact", channel_code: "OFF_PROPERTY_CONTACT", incentive_gift_value_cents: 12500, min_age: 30, min_household_income_cents: 5000000, min_qualification_score: 55 }
              as: MarketingManager
              captures: { ch1: $.data.id }
            - call: "POST /tour-channels"
              payload: { name: "Mini-Vac Package", channel_code: "MINI_VAC_PACKAGE", incentive_gift_value_cents: 19900, min_age: 30, min_household_income_cents: 5000000, min_qualification_score: 55, requires_married_household: true }
              as: MarketingManager
              captures: { ch2: $.data.id }
            - call: "POST /prospects"
              payload: { household_name: "Nolan Household", primary_age: 24, household_income_cents: 3000000, marital_status: "SINGLE" }
              as: MarketingManager
              captures: { p_low: $.data.id }
            - call: "POST /prospects"
              payload: { household_name: "Whitfield Household", primary_age: 45, household_income_cents: 6000000, marital_status: "SINGLE" }
              as: MarketingManager
              captures: { p_mid: $.data.id }
            - call: "POST /prospects"
              payload: { household_name: "Okafor Household", primary_age: 45, household_income_cents: 15000000, marital_status: "SINGLE" }
              as: MarketingManager
              captures: { p_rich: $.data.id }
            - call: "POST /prospects"
              payload: { household_name: "Alvarez Household", primary_age: 45, household_income_cents: 10000000, marital_status: "MARRIED" }
              as: MarketingManager
              captures: { p_ok: $.data.id }
          trigger:
            - call: "POST /tour-bookings"
              payload: { channel_id: "${ch1}", prospect_id: "${p_low}", gallery_id: "${g1}", scheduled_start_utc: "2026-08-14T07:00:00Z" }
              as: MarketingManager
            - call: "POST /tour-bookings"
              payload: { channel_id: "${ch2}", prospect_id: "${p_rich}", gallery_id: "${g1}", scheduled_start_utc: "2026-08-14T07:00:00Z" }
              as: MarketingManager
            - call: "POST /tour-bookings"
              payload: { channel_id: "${ch1}", prospect_id: "${p_mid}", gallery_id: "${g1}", scheduled_start_utc: "2026-08-14T07:00:00Z" }
              as: MarketingManager
            - call: "POST /tour-bookings"
              payload: { channel_id: "${ch1}", prospect_id: "${p_ok}", gallery_id: "${g1}", scheduled_start_utc: "2026-08-14T07:00:00Z" }
              as: MarketingManager
              captures: { b_ok: $.data.id }
            - call: "GET /tour-bookings"
              payload: { gallery_id: "${g1}" }
              as: MarketingManager
          assert:
            - "trigger 1 returns 422 with error_id ERR_PROSPECT_BELOW_MINIMUM_CRITERIA (age 24 < 30 and income 3000000 < 5000000)"
            - "trigger 2 returns 422 with error_id ERR_PROSPECT_BELOW_MINIMUM_CRITERIA even though the score would have been 45 + 25 = 70 >= 55"
            - "trigger 3 returns 422 with error_id ERR_PROSPECT_NOT_QUALIFIED (income tier 15 + age 25 + 0 + 0 + 0 = 40 < 55)"
            - "trigger 4 returns 201 with TourBooking.${b_ok}.qualification_score == 80 (35 + 25 + 20) and qualification_penalty_points == 0"
            - "trigger 5 returns total_count == 1 -- none of the three refused bookings persisted a row"
            - "SalesGallery.${g1}.booked_slot_count == 1"

      - name: booking_lead_time_sixty_minute_inclusive_temporal_gate
        claim_type: temporal_validation
        grounds:
          - validations[priority 21]
          - errors[ERR_TOUR_SLOT_IN_PAST]
          - endpoints[POST /tour-bookings/{id}/reschedule]
        distinguishing_aspect: "MIN_BOOKING_LEAD_MINUTES 60 is an inclusive lead requirement measured from the logical clock: 2026-08-01T00:59:59Z is refused with ERR_TOUR_SLOT_IN_PAST while exactly 2026-08-01T01:00:00Z is accepted, and the identical gate re-applies to new_scheduled_start_utc on reschedule."
