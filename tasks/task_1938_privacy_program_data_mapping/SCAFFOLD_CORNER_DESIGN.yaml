  # ---------------------------------------------------------------------------
  - section: complexity_layers
    instances:
      - name: occ_reclassify_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[element-reclassify-stale-version]"]
        distinguishing_aspect: "Second reclassify carrying the pre-first-reclassify version -> 412 ERR_STALE_VERSION; element keeps the first reclassification's values."
        test_recipe:
          setup: ["element email ACTIVE at version 1"]
          setup_api_calls:
            - call: "POST /privacy/data-elements"
              payload: { element_key: "email", category: BASIC_CONTACT, classification: INTERNAL }
              as: DataSteward
              captures: { e1: $.data.id, e_v1: $.data.version }
          trigger:
            - call: "POST /privacy/data-elements/${e1}/reclassify"
              payload: { category: FINANCIAL, classification: CONFIDENTIAL, expected_element_version: "${e_v1}" }
              as: DataSteward
              captures: { e_v2: $.data.version, e_cat: $.data.category }
            - call: "POST /privacy/data-elements/${e1}/reclassify"
              payload: { category: HEALTH, classification: PUBLIC, expected_element_version: "${e_v1}" }
              as: DataSteward
              captures: { err: $.data.error_id }
            - call: "GET /privacy/data-elements/${e1}"
              payload: {}
              as: DataSteward
              captures: { e_cat_end: $.data.category, e_v_end: $.data.version }
          assert:
            - "first reclassify succeeds: version 1 -> 2, category == FINANCIAL"
            - "stale reclassify (expected_element_version == 1 again) -> error_id ERR_STALE_VERSION (412)"
            - "element unchanged by the loser: category == FINANCIAL, version == 2"

      - name: occ_contract_create_stale_vendor
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[contract-create-stale-vendor]"]
        distinguishing_aspect: "Create-with-supersede on the vendor's contracts: a create carrying the pre-first-create vendor version -> 412; a create with the current version succeeds and supersedes the first DRAFT."
        test_recipe:
          setup: ["vendor at version 1 (ONBOARDING)"]
          setup_api_calls:
            - call: "POST /privacy/vendors"
              payload: { vendor_name: "DataPro", home_region: US, processes_categories: [] }
              as: VendorManager
              captures: { v: $.data.id, v_v1: $.data.version }
          trigger:
            - call: "POST /privacy/vendors/${v}/contracts"
              payload: { provided_clauses: [DPA], expected_vendor_version: "${v_v1}" }
              as: VendorManager
              captures: { c1: $.data.id }
            - call: "GET /privacy/vendors/${v}"
              payload: {}
              as: VendorManager
              captures: { v_v2: $.data.version }
            - call: "POST /privacy/vendors/${v}/contracts"
              payload: { provided_clauses: [DPA], expected_vendor_version: "${v_v1}" }
              as: VendorManager
              captures: { err: $.data.error_id }
            - call: "POST /privacy/vendors/${v}/contracts"
              payload: { provided_clauses: [DPA, BREACH_NOTICE_72H], expected_vendor_version: "${v_v2}" }
              as: VendorManager
              captures: { c2: $.data.id }
            - call: "GET /privacy/vendors/${v}/contracts"
              payload: {}
              as: VendorManager
              captures: { c1_st: "$.data[0].status" }
          assert:
            - "first create bumps Vendor.version 1 -> 2"
            - "create with stale expected_vendor_version == 1 -> error_id ERR_STALE_VERSION (412)"
            - "create with current version == 2 succeeds; the first DRAFT contract -> SUPERSEDED (create-with-supersede)"

      - name: layer_cascading_side_effects
        claim_type: cascading_side_effects
        grounds: [complexity_profile]
        excluded_because:
          difficulty_instance: notice_publish_cascade_depth4
          rationale: "4-level cascade asserted there end-to-end; vendor_offboard_cascade_depth2 and element_reclassify_cascade_depth3 cover the other triggers."

      - name: layer_dual_variant_calculation
        claim_type: dual_variant_calculation
        grounds: [complexity_profile]
        excluded_because:
          difficulty_instance: activity_risk_screening_vs_comprehensive
          rationale: "Variant divergence and selection asserted there and in request_deadline_provisional_vs_final."

      - name: layer_rate_threshold_triggers
        claim_type: rate_threshold_triggers
        grounds: [complexity_profile]
        excluded_because:
          difficulty_instance: applicability_count_at_threshold
          rationale: "Cumulative count threshold boundary asserted there; revenue-share threshold in applicability_revenue_share_rounding_mode_b."

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_consistency_read_after_write
        claim_type: immediate
        grounds: [complexity_profile]
        distinguishing_aspect: "consistency_model immediate: the mutate response already shows the new state, and a subsequent GET within the same test sees it — no lag, no async reconciliation."
        test_recipe:
          setup: ["activity DRAFT with DOCUMENTED purpose"]
          setup_api_calls:
            - call: "POST /privacy/data-elements"
              payload: { element_key: "email", category: BASIC_CONTACT, classification: INTERNAL }
              as: DataSteward
              captures: { e1: $.data.id }
            - call: "POST /privacy/retention-policies"
              payload: { policy_code: "RP-1YR", duration_days: 365, disposal_action: DELETE }
              as: PrivacyAdmin
              captures: { rp1: $.data.id }
            - call: "POST /privacy/processing-activities"
              payload: { activity_name: "Newsletter", business_unit: "Marketing", notice_scope: WEBSITE, data_element_ids: ["${e1}"] }
              as: DataSteward
              captures: { a1: $.data.id }
            - call: "POST /privacy/processing-activities/${a1}/purposes"
              payload: { purpose_type: MARKETING, legal_basis: CONTRACT, retention_policy_id: "${rp1}" }
              as: DataSteward
          trigger:
            - call: "POST /privacy/processing-activities/${a1}/activate"
              payload: {}
              as: DataSteward
              captures: { st_inline: $.data.status, v_inline: $.data.version }
            - call: "GET /privacy/processing-activities/${a1}"
              payload: {}
              as: DataSteward
              captures: { st_get: $.data.status, v_get: $.data.version }
          assert:
            - "activate response itself carries status == ACTIVE and version == 2"
            - "immediate GET confirms status == ACTIVE and version == 2 (no drift between write and read)"
