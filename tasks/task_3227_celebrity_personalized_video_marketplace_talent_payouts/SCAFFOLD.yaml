scenario: |
  Celebrity Personalized Video Marketplace & Talent Payouts (Cameo): talent onboarding with identity verification, pricing setup and turnaround commitments, request intake with occasion details and script instructions plus content policy screening, request acceptance windows with automatic cancellation and refund when a talent does not deliver, content review for policy violations before delivery with re-record requests, payout computation with platform commission, tax documentation and payment schedules, business and advertising use licensing at higher rates with usage rights terms, talent availability pausing, rate changes and demand-based pricing suggestions, dispute handling when a video does not match the request

domain_name: celebrity-video-marketplace
api_prefix: /marketplace

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - optimistic_concurrency
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: hierarchical_override
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Talent
    parent: null
    common_fields: true
    fields:
      - name: stage_name
        type: string
        source: input
        description: Public display name of the talent; unique across the marketplace (case-insensitive).
        constraints: "1..80 chars; unique case-insensitively across all Talent rows"
      - name: legal_name
        type: string
        source: input
        description: Legal name used for tax documentation and payout payee records.
      - name: email
        type: string
        source: input
        description: Login/contact email; unique across Talent rows.
      - name: status
        type: enum
        source: system
        description: "Lifecycle state: PENDING_VERIFICATION, ID_VERIFIED, ACTIVE, PAUSED, SUSPENDED."
        default: PENDING_VERIFICATION
        constraints: "enum PENDING_VERIFICATION|ID_VERIFIED|ACTIVE|PAUSED|SUSPENDED"
      - name: personal_rate_cents
        type: integer
        source: input
        description: Price in cents charged for a PERSONAL video request; set via rate-change endpoint with demand-suggestion bounds.
        constraints: "when set, 100..10000000; on ACCEPT must satisfy suggested bounds"
      - name: business_rate_cents
        type: integer
        source: input
        description: Price in cents charged for a BUSINESS_USE video request.
        constraints: "when set, >= business-rate floor (4x personal floor) and >= personal_rate_cents"
      - name: advertising_rate_cents
        type: integer
        source: input
        description: Price in cents charged for an ADVERTISING_USE video request.
        constraints: "when set, >= advertising-rate floor (8x personal floor) and >= business_rate_cents"
      - name: turnaround_hours
        type: integer
        source: input
        description: Committed delivery turnaround in hours; drives the auto-cancel deadline on requests.
        constraints: "1..336"
      - name: availability
        type: enum
        source: system
        description: "BOOKABLE (accepting new requests) or PAUSED_AVAILABILITY (not bookable; in-flight requests unaffected)."
        default: BOOKABLE
        constraints: "enum BOOKABLE|PAUSED_AVAILABILITY"
      - name: commission_tier
        type: enum
        source: computed
        description: "Current commission tier derived from trailing-365-day confirmed GMV (STANDARD, SILVER, GOLD)."
        default: STANDARD
        constraints: "enum STANDARD|SILVER|GOLD"
      - name: trailing_gmv_cents
        type: integer
        source: computed
        description: Sum of order gross amounts for orders that transitioned to CONFIRMED within the trailing 365-day window (inclusive of window start, exclusive of window end).
        default: 0
      - name: pending_balance_cents
        type: integer
        source: computed
        description: Sum of unsettled PayoutLine net amounts for DELIVERED orders awaiting the weekly payout sweep; debited by reservations, credited by payout and releases.
        default: 0
      - name: paid_out_balance_cents
        type: integer
        source: computed
        description: Cumulative lifetime net earnings actually transferred to the talent via PAID Payouts.
        default: 0
      - name: availability_pause_count_30d
        type: integer
        source: computed
        description: Number of availability pauses started within the trailing 30 days; 4th pause within the window is rejected.
        default: 0
      - name: identity_document_ref
        type: string
        source: input
        description: Opaque reference to the submitted identity document used for verification review.
      - name: identity_submitted_at
        type: datetime
        source: system
        description: Timestamp of the most recent identity document submission; resets the 72-hour auto-reject window.
      - name: suggestion_seed_at
        type: datetime
        source: system
        description: Logical-clock timestamp when the current demand-based pricing suggestion was generated.
      - name: suggested_personal_rate_cents
        type: integer
        source: computed
        description: Demand-based suggested personal rate (see calculation talent_pricing_suggestion).
        default: null
        constraints: "null until first suggestion computed"

  - name: Buyer
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: Buyer account email; unique across Buyer rows.
      - name: display_name
        type: string
        source: input
        description: Public display name shown to talent.
      - name: is_business_account
        type: boolean
        source: input
        description: True when the buyer registered as a business; required to place BUSINESS_USE or ADVERTISING_USE requests.
        default: false
      - name: status
        type: enum
        source: system
        description: "ACTIVE or BLOCKED (blocked buyers cannot place requests but may act on existing ones)."
        default: ACTIVE
        constraints: "enum ACTIVE|BLOCKED"
      - name: wallet_credit_cents
        type: integer
        source: computed
        description: Refund credit balance in cents; refunds land here when refund_destination == WALLET.
        default: 0

  - name: Order
    parent: null
    common_fields: true
    fields:
      - name: talent_id
        type: string
        source: input
        description: "FK -> Talent.id; the talent being booked."
      - name: buyer_id
        type: string
        source: input
        description: "FK -> Buyer.id; the buyer placing the request."
      - name: use_type
        type: enum
        source: input
        description: "PERSONAL, BUSINESS_USE, or ADVERTISING_USE; selects which talent rate is charged and which licensing terms apply."
        constraints: "enum PERSONAL|BUSINESS_USE|ADVERTISING_USE"
      - name: occasion
        type: string
        source: input
        description: Free-text occasion description (birthday, pep talk, product shoutout, ...).
      - name: script_instructions
        type: string
        source: input
        description: Buyer-supplied instructions the talent should follow in the video.
        constraints: "1..2000 chars"
      - name: recipient_name
        type: string
        source: input
        description: Name of the video recipient.
      - name: status
        type: enum
        source: system
        description: "Lifecycle state (see Order state machine): SCREENING, DECLINED, AWAITING_ACCEPTANCE, EXPIRED, ACCEPTED, DELIVERED, RE_RECORD_REQUESTED, CONFIRMED, REFUND_PENDING, REFUNDED, CANCELLED."
        default: SCREENING
        constraints: "enum SCREENING|DECLINED|AWAITING_ACCEPTANCE|EXPIRED|ACCEPTED|DELIVERED|RE_RECORD_REQUESTED|CONFIRMED|REFUND_PENDING|REFUNDED|CANCELLED"
      - name: gross_amount_cents
        type: integer
        source: computed
        description: Frozen charge amount captured at request creation from the talent's rate for this use_type.
      - name: platform_commission_cents
        type: integer
        source: computed
        description: Platform commission on this order, computed at CONFIRMED from the talent's commission tier (see payout_computation).
        default: null
      - name: talent_net_cents
        type: integer
        source: computed
        description: Net earnings attributable to the talent on this order; gross minus commission for delivered orders, business licensing fee credited to talent.
        default: null
      - name: screening_token
        type: string
        source: system
        description: Opaque screening token the buyer echoes back to attest a clear screening result and move the order into AWAITING_ACCEPTANCE.
      - name: screening_flags
        type: array
        source: system
        description: "Server-computed list of content-policy flags raised during screening (empty array when clean). Deterministic rule: a flag POLICY_VIOLATION is raised when script_instructions contains the marker substring 'FLAGGED_POLICY_VIOLATION'; otherwise empty."
      - name: acceptance_deadline
        type: datetime
        source: computed
        description: Logical-clock timestamp at which an AWAITING_ACCEPTANCE order auto-transitions to EXPIRED (entry time + ACCEPTANCE_WINDOW_HOURS).
      - name: delivery_deadline
        type: datetime
        source: computed
        description: Logical-clock timestamp at which an ACCEPTED or RE_RECORD_REQUESTED order auto-transitions to CANCELLED with refund (acceptance time + talent.turnaround_hours).
      - name: delivered_at
        type: datetime
        source: system
        description: Timestamp of the most recent video delivery; null until first delivery.
      - name: re_record_count
        type: integer
        source: computed
        description: Number of re-record requests issued on this order; hard cap MAX_RERECORD_PER_ORDER.
        default: 0
      - name: auto_confirm_at
        type: datetime
        source: computed
        description: Logical-clock timestamp at which a DELIVERED order auto-confirms if the buyer has neither confirmed, requested re-record, nor opened a dispute.
      - name: refund_amount_cents
        type: integer
        source: computed
        description: Refund amount resolved on this order (0 when none).
        default: 0
      - name: platform_absorbed_cents
        type: integer
        source: computed
        description: Platform-absorbed refund component on a buyer-mismatch dispute (refund paid without clawing back the talent share).
        default: 0
      - name: clawback_cents
        type: integer
        source: computed
        description: Talent-share clawback amount on talent-fault dispute resolutions.
        default: 0

  - name: Video
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; the order this video fulfills."
      - name: content_url
        type: string
        source: input
        description: URL of the uploaded video file.
      - name: duration_seconds
        type: integer
        source: input
        description: Video duration in seconds.
        constraints: "5..600"
      - name: version_no
        type: integer
        source: computed
        description: "Monotonic per-order video sequence number: 1 for the first delivery, +1 per re-record delivery."
      - name: moderation_status
        type: enum
        source: system
        description: "PENDING_REVIEW on upload; CLEARED or FLAGGED after moderation decision."
        default: PENDING_REVIEW
        constraints: "enum PENDING_REVIEW|CLEARED|FLAGGED"
      - name: flagged_reason
        type: string
        source: input
        description: Moderator-provided reason when moderation_status == FLAGGED.
        default: null

  - name: ReRecordRequest
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; the order being sent back for re-recording."
      - name: notes
        type: string
        source: input
        description: What the buyer wants changed.
        constraints: "1..1000 chars"
      - name: status
        type: enum
        source: system
        description: "OPEN while awaiting the talent's new delivery; CLOSED once a new video is delivered or the order leaves RE_RECORD_REQUESTED terminally."
        default: OPEN
        constraints: "enum OPEN|CLOSED"

  - name: LicenseGrant
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; the CONFIRMED order whose video is licensed."
      - name: license_type
        type: enum
        source: input
        description: "BUSINESS or ADVERTISING; must be compatible with the order's use_type."
        constraints: "enum BUSINESS|ADVERTISING"
      - name: territory
        type: enum
        source: input
        description: "Geographic scope of the license."
        constraints: "enum DOMESTIC|GLOBAL"
      - name: channels
        type: array
        source: input
        description: Distribution channels covered (e.g., SOCIAL, WEB, TV).
        constraints: "non-empty subset of SOCIAL|WEB|TV|OOH"
      - name: starts_at
        type: datetime
        source: input
        description: License usage window start (inclusive).
      - name: ends_at
        type: datetime
        source: input
        description: License usage window end (exclusive).
      - name: fee_cents
        type: integer
        source: computed
        description: Licensing fee computed by licensing_fee (usage-window overlap and channel/territory rates).
      - name: status
        type: enum
        source: system
        description: "ACTIVE while the window is current, EXPIRED once ends_at passes (derived by the deadline sweep: POST /marketplace/admin/deadline-sweep flips ACTIVE grants whose ends_at <= to_iso8601 to EXPIRED)."
        default: ACTIVE
        constraints: "enum ACTIVE|EXPIRED"

  - name: PayoutLine
    parent: null
    common_fields: true
    fields:
      - name: talent_id
        type: string
        source: computed
        description: "FK -> Talent.id; the talent earning this line (copied from the order)."
      - name: order_id
        type: string
        source: computed
        description: "FK -> Order.id; the order generating this line."
      - name: kind
        type: enum
        source: computed
        description: "VIDEO_EARNING (talent net share), LICENSE_FEE_CREDIT (talent share of licensing fee), or CLAWBACK (negative line from a talent-fault dispute)."
        constraints: "enum VIDEO_EARNING|LICENSE_FEE_CREDIT|CLAWBACK"
      - name: amount_cents
        type: integer
        source: computed
        description: Signed amount in cents; positive for earnings, negative for clawbacks.
      - name: settlement_status
        type: enum
        source: system
        description: "UNSETTLED until swept into a Payout; SETTLED once the payout transitions to PAID."
        default: UNSETTLED
        constraints: "enum UNSETTLED|SETTLED"
      - name: payout_id
        type: string
        source: system
        description: "FK -> Payout.id; null until swept."
        default: null

  - name: Payout
    parent: null
    common_fields: true
    fields:
      - name: talent_id
        type: string
        source: computed
        description: "FK -> Talent.id; payout recipient."
      - name: status
        type: enum
        source: system
        description: "SCHEDULED when the sweep creates it, PROCESSING after initiation, PAID after completion."
        default: SCHEDULED
        constraints: "enum SCHEDULED|PROCESSING|PAID"
      - name: total_cents
        type: integer
        source: computed
        description: Sum of swept PayoutLine amounts; must be >= MIN_PAYOUT_CENTS for the sweep to create a payout.
      - name: period_start
        type: datetime
        source: computed
        description: Inclusive start of the weekly sweep window (logical clock).
      - name: period_end
        type: datetime
        source: computed
        description: Exclusive end of the weekly sweep window (logical clock).
      - name: paid_at
        type: datetime
        source: system
        description: Logical-clock timestamp when the payout transitioned to PAID; null until paid.

  - name: TaxDocument
    parent: null
    common_fields: true
    fields:
      - name: talent_id
        type: string
        source: input
        description: "FK -> Talent.id; the talent this tax form belongs to."
      - name: doc_type
        type: enum
        source: input
        description: "Tax form type (W9 for US persons, W8BEN for non-US persons)."
        constraints: "enum W9|W8BEN"
      - name: tax_id_last4
        type: string
        source: input
        description: Last 4 characters of the taxpayer identification number.
        constraints: "exactly 4 alphanumeric chars"
      - name: status
        type: enum
        source: system
        description: "SUBMITTED on upload; VERIFIED or REJECTED after compliance review."
        default: SUBMITTED
        constraints: "enum SUBMITTED|VERIFIED|REJECTED"
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock timestamp of submission.

  - name: Dispute
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; the DELIVERED order being disputed (video does not match the request)."
      - name: reason
        type: string
        source: input
        description: Buyer-supplied description of the mismatch.
        constraints: "1..1000 chars"
      - name: status
        type: enum
        source: system
        description: "OPEN on creation; RESOLVED_REFUND (full refund, talent clawed back), RESOLVED_PARTIAL (50/50 split refund), RESOLVED_NO_REFUND, or RESOLVED_BUYER_MISMATCH (full refund absorbed by platform, talent keeps share) after admin resolution."
        default: OPEN
        constraints: "enum OPEN|RESOLVED_REFUND|RESOLVED_PARTIAL|RESOLVED_NO_REFUND|RESOLVED_BUYER_MISMATCH"
      - name: refund_to_buyer_cents
        type: integer
        source: computed
        description: Amount credited back to the buyer on resolution (0 for RESOLVED_NO_REFUND).
        default: null
      - name: resolution_notes
        type: string
        source: input
        description: Admin-provided resolution notes.
        default: null

state_machines:
  - entity: Talent
    initial_state: PENDING_VERIFICATION
    terminal_states: [SUSPENDED]
    transitions:
      - from: PENDING_VERIFICATION
        to: ID_VERIFIED
        trigger: "POST /marketplace/talents/{id}/identity/submit"
        actor: Talent
        preconditions:
          - "talent.status == PENDING_VERIFICATION"
          - "X-User-ID == talent.id"
          - "identity_document_ref present and non-empty"
        side_effects:
          - "sets talent.identity_submitted_at to current logical time"
          - "increments talent.version by 1"
      - from: PENDING_VERIFICATION
        to: PENDING_VERIFICATION
        trigger: "system auto-reject sweep: POST /marketplace/admin/verification-sweep with to_iso8601 >= talent.identity_submitted_at + 72h"
        actor: system
        preconditions:
          - "talent.status == PENDING_VERIFICATION"
          - "identity was submitted and logical clock is >= identity_submitted_at + 72 hours without an admin decision"
        side_effects:
          - "clears talent.identity_document_ref and talent.identity_submitted_at"
          - "increments talent.version by 1"
        note: cyclic self-loop on auto-reject; talent may resubmit identity afterward
      - from: ID_VERIFIED
        to: ACTIVE
        trigger: "POST /marketplace/admin/talents/{id}/activate"
        actor: PlatformAdmin
        preconditions:
          - "talent.status == ID_VERIFIED"
          - "talent has at least one TaxDocument with status == VERIFIED"
          - "personal_rate_cents, business_rate_cents, advertising_rate_cents are all set and satisfy rate floors and ordering business_rate_cents >= personal_rate_cents, advertising_rate_cents >= business_rate_cents"
        side_effects:
          - "increments talent.version by 1"
      - from: ID_VERIFIED
        to: PENDING_VERIFICATION
        trigger: "POST /marketplace/admin/talents/{id}/reject-identity"
        actor: PlatformAdmin
        preconditions:
          - "talent.status == ID_VERIFIED"
        side_effects:
          - "clears talent.identity_document_ref and talent.identity_submitted_at"
          - "increments talent.version by 1"
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /marketplace/talents/{id}/pause"
        actor: Talent
        preconditions:
          - "talent.status == ACTIVE"
          - "X-User-ID == talent.id"
          - "talent.availability_pause_count_30d < 3 (a pause that would make it the 4th within 30 days is rejected)"
        side_effects:
          - "sets talent.availability = PAUSED_AVAILABILITY"
          - "increments talent.availability_pause_count_30d by 1"
          - "increments talent.version by 1"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /marketplace/talents/{id}/resume"
        actor: Talent
        preconditions:
          - "talent.status == PAUSED"
          - "X-User-ID == talent.id"
        side_effects:
          - "sets talent.availability = BOOKABLE"
          - "increments talent.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /marketplace/admin/talents/{id}/suspend"
        actor: PlatformAdmin
        preconditions:
          - "talent.status IN {ACTIVE, PAUSED}"
        side_effects:
          - "every Order of this talent in state AWAITING_ACCEPTANCE transitions to EXPIRED with full refund to buyer wallet"
          - "every Order of this talent in state ACCEPTED or RE_RECORD_REQUESTED transitions to CANCELLED with full refund to buyer wallet; any OPEN ReRecordRequest on those orders transitions to CLOSED"
          - "recompute talent.pending_balance_cents (unchanged by refunds of non-confirmed orders)"
          - "increments talent.version by 1"
      - from: PAUSED
        to: SUSPENDED
        trigger: "POST /marketplace/admin/talents/{id}/suspend"
        actor: PlatformAdmin
        preconditions:
          - "talent.status IN {ACTIVE, PAUSED}"
        side_effects:
          - "same cascade as ACTIVE -> SUSPENDED"
          - "increments talent.version by 1"

  - entity: Order
    initial_state: SCREENING
    terminal_states: [REFUNDED, CANCELLED, DECLINED, EXPIRED]
    transitions:
      - from: SCREENING
        to: AWAITING_ACCEPTANCE
        trigger: "POST /marketplace/orders/{id}/screening-attest"
        actor: Buyer
        preconditions:
          - "order.status == SCREENING"
          - "X-User-ID == order.buyer_id"
          - "screening_token matches the order's screening_token"
          - "order.screening_flags is empty"
        side_effects:
          - "sets order.acceptance_deadline = current logical time + 48 hours"
          - "increments order.version by 1"
      - from: SCREENING
        to: DECLINED
        trigger: "POST /marketplace/orders/{id}/screening-decline"
        actor: Buyer
        preconditions:
          - "order.status == SCREENING"
          - "X-User-ID == order.buyer_id"
        side_effects:
          - "sets order.refund_amount_cents = order.gross_amount_cents"
          - "credits buyer.wallet_credit_cents by order.gross_amount_cents"
          - "increments order.version by 1"
      - from: AWAITING_ACCEPTANCE
        to: ACCEPTED
        trigger: "POST /marketplace/orders/{id}/accept"
        actor: Talent
        preconditions:
          - "order.status == AWAITING_ACCEPTANCE"
          - "X-User-ID == order.talent_id"
          - "current logical time < order.acceptance_deadline"
          - "talent.status == ACTIVE"
        side_effects:
          - "sets order.delivery_deadline = current logical time + talent.turnaround_hours"
          - "increments order.version by 1"
      - from: AWAITING_ACCEPTANCE
        to: DECLINED
        trigger: "POST /marketplace/orders/{id}/decline"
        actor: Talent
        preconditions:
          - "order.status == AWAITING_ACCEPTANCE"
          - "X-User-ID == order.talent_id"
        side_effects:
          - "sets order.refund_amount_cents = order.gross_amount_cents"
          - "credits buyer.wallet_credit_cents by order.gross_amount_cents"
          - "increments order.version by 1"
      - from: AWAITING_ACCEPTANCE
        to: EXPIRED
        trigger: "system: deadline sweep POST /marketplace/admin/deadline-sweep with to_iso8601 >= order.acceptance_deadline"
        actor: system
        preconditions:
          - "order.status == AWAITING_ACCEPTANCE"
          - "logical clock >= order.acceptance_deadline"
        side_effects:
          - "sets order.refund_amount_cents = order.gross_amount_cents"
          - "credits buyer.wallet_credit_cents by order.gross_amount_cents"
          - "increments order.version by 1"
      - from: ACCEPTED
        to: DELIVERED
        trigger: "POST /marketplace/orders/{id}/videos (first delivery)"
        actor: Talent
        preconditions:
          - "order.status IN {ACCEPTED, RE_RECORD_REQUESTED}"
          - "X-User-ID == order.talent_id"
          - "current logical time < order.delivery_deadline"
        side_effects:
          - "creates Video with version_no = count of existing videos on this order + 1, moderation_status = PENDING_REVIEW"
          - "sets order.delivered_at to current logical time"
          - "sets order.auto_confirm_at = current logical time + 72 hours"
          - "any OPEN ReRecordRequest on this order transitions to CLOSED"
          - "increments order.version by 1"
      - from: RE_RECORD_REQUESTED
        to: DELIVERED
        trigger: "POST /marketplace/orders/{id}/videos (re-record delivery)"
        actor: Talent
        preconditions:
          - "order.status IN {ACCEPTED, RE_RECORD_REQUESTED}"
          - "X-User-ID == order.talent_id"
          - "current logical time < order.delivery_deadline"
        side_effects:
          - "creates Video with version_no = prior version_no + 1, moderation_status = PENDING_REVIEW"
          - "sets order.delivered_at to current logical time; resets order.auto_confirm_at = current logical time + 72 hours"
          - "the OPEN ReRecordRequest transitions to CLOSED"
          - "increments order.version by 1"
      - from: ACCEPTED
        to: CANCELLED
        trigger: "system: deadline sweep POST /marketplace/admin/deadline-sweep with to_iso8601 >= order.delivery_deadline"
        actor: system
        preconditions:
          - "order.status == ACCEPTED"
          - "logical clock >= order.delivery_deadline"
        side_effects:
          - "sets order.refund_amount_cents = order.gross_amount_cents"
          - "credits buyer.wallet_credit_cents by order.gross_amount_cents"
          - "increments order.version by 1"
      - from: RE_RECORD_REQUESTED
        to: CANCELLED
        trigger: "system: deadline sweep POST /marketplace/admin/deadline-sweep with to_iso8601 >= order.delivery_deadline"
        actor: system
        preconditions:
          - "order.status == RE_RECORD_REQUESTED"
          - "logical clock >= order.delivery_deadline"
        side_effects:
          - "sets order.refund_amount_cents = order.gross_amount_cents"
          - "credits buyer.wallet_credit_cents by order.gross_amount_cents"
          - "the OPEN ReRecordRequest transitions to CLOSED"
          - "increments order.version by 1"
      - from: DELIVERED
        to: RE_RECORD_REQUESTED
        trigger: "POST /marketplace/orders/{id}/re-record-requests"
        actor: Buyer
        preconditions:
          - "order.status == DELIVERED"
          - "X-User-ID == order.buyer_id"
          - "current logical time < order.auto_confirm_at"
          - "order.re_record_count < 2"
          - "the latest Video on this order has moderation_status == CLEARED"
          - "no OPEN Dispute exists for this order"
        side_effects:
          - "creates ReRecordRequest with status OPEN"
          - "increments order.re_record_count by 1"
          - "increments order.version by 1"
      - from: DELIVERED
        to: CONFIRMED
        trigger: "POST /marketplace/orders/{id}/confirm"
        actor: Buyer
        preconditions:
          - "order.status == DELIVERED"
          - "X-User-ID == order.buyer_id"
          - "current logical time < order.auto_confirm_at"
          - "the latest Video on this order has moderation_status == CLEARED"
          - "no OPEN Dispute exists for this order"
        side_effects:
          - "runs payout_computation: sets order.platform_commission_cents and order.talent_net_cents from talent.commission_tier"
          - "creates PayoutLine kind VIDEO_EARNING amount order.talent_net_cents status UNSETTLED"
          - "credits talent.pending_balance_cents by order.talent_net_cents"
          - "adds order.gross_amount_cents to talent.trailing_gmv_cents and recomputes talent.commission_tier"
          - "increments order.version by 1"
      - from: DELIVERED
        to: CONFIRMED
        trigger: "system: deadline sweep POST /marketplace/admin/deadline-sweep with to_iso8601 >= order.auto_confirm_at"
        actor: system
        preconditions:
          - "order.status == DELIVERED"
          - "logical clock >= order.auto_confirm_at"
          - "the latest Video on this order has moderation_status == CLEARED"
          - "no OPEN Dispute exists for this order"
        side_effects:
          - "same as buyer confirm: payout_computation, VIDEO_EARNING PayoutLine, pending_balance credit, trailing_gmv_cents and commission_tier recompute"
          - "increments order.version by 1"
        note: auto-confirm cascade hops Order -> PayoutLine -> Talent(pending_balance, trailing_gmv, tier)
      - from: DELIVERED
        to: REFUND_PENDING
        trigger: "POST /marketplace/orders/{id}/disputes (dispute opens)"
        actor: Buyer
        preconditions:
          - "order.status == DELIVERED"
          - "X-User-ID == order.buyer_id"
          - "current logical time < order.auto_confirm_at"
          - "no existing Dispute for this order"
        side_effects:
          - "creates Dispute with status OPEN"
          - "increments order.version by 1"
      - from: CONFIRMED
        to: REFUND_PENDING
        trigger: "POST /marketplace/orders/{id}/disputes (dispute opens after confirmation)"
        actor: Buyer
        preconditions:
          - "order.status == CONFIRMED"
          - "X-User-ID == order.buyer_id"
          - "no existing Dispute for this order"
        side_effects:
          - "creates Dispute with status OPEN"
          - "increments order.version by 1"
        note: a confirmed order can still be disputed (video does not match the request); no buyer-window deadline applies after confirmation

  - entity: Video
    initial_state: PENDING_REVIEW
    terminal_states: [CLEARED, FLAGGED]
    transitions:
      - from: PENDING_REVIEW
        to: CLEARED
        trigger: "POST /marketplace/admin/videos/{id}/moderate with decision CLEAR"
        actor: PlatformAdmin
        preconditions:
          - "video.moderation_status == PENDING_REVIEW"
        side_effects:
          - "increments video.version by 1"
      - from: PENDING_REVIEW
        to: FLAGGED
        trigger: "POST /marketplace/admin/videos/{id}/moderate with decision FLAG and flagged_reason"
        actor: PlatformAdmin
        preconditions:
          - "video.moderation_status == PENDING_REVIEW"
          - "flagged_reason present when decision == FLAG"
        side_effects:
          - "if order.status == DELIVERED: order transitions DELIVERED -> RE_RECORD_REQUESTED, creates OPEN ReRecordRequest with notes = flagged_reason, increments order.re_record_count (this moderation-driven re-record does NOT count against the buyer's 2-request cap beyond the increment itself)"
          - "increments video.version by 1"
        note: branching fork — CLEAR ends the review branch; FLAG forks the order back into a re-record loop

  - entity: ReRecordRequest
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "cascade from Order delivery (new video) or terminal order transitions (CANCELLED / EXPIRED / REFUNDED / suspend cascade)"
        actor: system
        preconditions:
          - "rerecord.status == OPEN"
        side_effects:
          - "increments rerecord.version by 1"

  - entity: Dispute
    initial_state: OPEN
    terminal_states: [RESOLVED_REFUND, RESOLVED_PARTIAL, RESOLVED_NO_REFUND, RESOLVED_BUYER_MISMATCH]
    transitions:
      - from: OPEN
        to: RESOLVED_REFUND
        trigger: "POST /marketplace/admin/disputes/{id}/resolve with outcome FULL_REFUND"
        actor: PlatformAdmin
        preconditions:
          - "dispute.status == OPEN"
          - "order.status == REFUND_PENDING"
        side_effects:
          - "sets dispute.refund_to_buyer_cents = order.gross_amount_cents"
          - "order transitions REFUND_PENDING -> REFUNDED with refund_amount_cents = gross_amount_cents"
          - "credits buyer.wallet_credit_cents by gross_amount_cents"
          - "creates PayoutLine kind CLAWBACK amount = -(order.talent_net_cents) status UNSETTLED; sets order.clawback_cents = order.talent_net_cents"
          - "debits talent.pending_balance_cents by order.talent_net_cents (floor 0 is NOT applied; clawbacks may not drive the balance negative — rejected via ERR_PENDING_BALANCE_INSUFFICIENT if pending_balance_cents < talent_net_cents)"
          - "subtracts order.gross_amount_cents from talent.trailing_gmv_cents and recomputes talent.commission_tier"
          - "increments dispute.version by 1"
      - from: OPEN
        to: RESOLVED_PARTIAL
        trigger: "POST /marketplace/admin/disputes/{id}/resolve with outcome PARTIAL_REFUND"
        actor: PlatformAdmin
        preconditions:
          - "dispute.status == OPEN"
          - "order.status == REFUND_PENDING"
        side_effects:
          - "refund split is computed on the order GROSS: buyer refund = round_half_up(gross * 0.5), talent keeps remainder (see dispute_refund_split); platform commission is NOT clawed back on partial"
          - "sets dispute.refund_to_buyer_cents = round_half_up(gross * 0.5)"
          - "order transitions REFUND_PENDING -> REFUNDED with refund_amount_cents = dispute.refund_to_buyer_cents"
          - "credits buyer.wallet_credit_cents by refund_to_buyer_cents"
          - "creates PayoutLine kind CLAWBACK amount = -(refund_to_buyer_cents) status UNSETTLED; sets order.clawback_cents = refund_to_buyer_cents"
          - "debits talent.pending_balance_cents by refund_to_buyer_cents"
          - "subtracts refund_to_buyer_cents from talent.trailing_gmv_cents and recomputes talent.commission_tier"
          - "increments dispute.version by 1"
      - from: OPEN
        to: RESOLVED_NO_REFUND
        trigger: "POST /marketplace/admin/disputes/{id}/resolve with outcome NO_REFUND"
        actor: PlatformAdmin
        preconditions:
          - "dispute.status == OPEN"
          - "order.status == REFUND_PENDING"
        side_effects:
          - "sets dispute.refund_to_buyer_cents = 0"
          - "order transitions REFUND_PENDING -> CONFIRMED and payout_computation runs exactly as a normal confirm (VIDEO_EARNING line, pending credit, GMV recompute)"
          - "increments dispute.version by 1"
      - from: OPEN
        to: RESOLVED_BUYER_MISMATCH
        trigger: "POST /marketplace/admin/disputes/{id}/resolve with outcome BUYER_MISMATCH_PLATFORM_ABSORB"
        actor: PlatformAdmin
        preconditions:
          - "dispute.status == OPEN"
          - "order.status == REFUND_PENDING"
        side_effects:
          - "sets dispute.refund_to_buyer_cents = order.gross_amount_cents"
          - "order transitions REFUND_PENDING -> REFUNDED with refund_amount_cents = gross, platform_absorbed_cents = gross, clawback_cents = 0"
          - "credits buyer.wallet_credit_cents by gross_amount_cents"
          - "talent keeps its earnings: NO CLAWBACK PayoutLine is created and talent.pending_balance_cents is unchanged"
          - "talent.trailing_gmv_cents is unchanged (platform absorbed, sale still counts for tier)"
          - "increments dispute.version by 1"

  - entity: TaxDocument
    initial_state: SUBMITTED
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /marketplace/admin/tax-documents/{id}/review with decision VERIFY"
        actor: PlatformAdmin
        preconditions:
          - "taxdoc.status == SUBMITTED"
        side_effects:
          - "increments taxdoc.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /marketplace/admin/tax-documents/{id}/review with decision REJECT"
        actor: PlatformAdmin
        preconditions:
          - "taxdoc.status == SUBMITTED"
        side_effects:
          - "increments taxdoc.version by 1"
        note: a rejected talent may submit a new TaxDocument row; prior REJECTED rows are immutable

  - entity: Payout
    initial_state: SCHEDULED
    terminal_states: [PAID]
    transitions:
      - from: SCHEDULED
        to: PROCESSING
        trigger: "POST /marketplace/admin/payouts/{id}/initiate"
        actor: PlatformAdmin
        preconditions:
          - "payout.status == SCHEDULED"
          - "the talent has at least one TaxDocument with status == VERIFIED"
        side_effects:
          - "increments payout.version by 1"
      - from: PROCESSING
        to: PAID
        trigger: "POST /marketplace/admin/payouts/{id}/complete"
        actor: PlatformAdmin
        preconditions:
          - "payout.status == PROCESSING"
        side_effects:
          - "sets payout.paid_at to current logical time"
          - "every swept PayoutLine on this payout transitions UNSETTLED -> SETTLED"
          - "debits talent.pending_balance_cents by payout.total_cents and credits talent.paid_out_balance_cents by payout.total_cents"
          - "increments payout.version by 1"
        note: conserved-quantity hop — pending_balance + paid_out_balance is invariant across the PAID transition

concurrency_rules:
  - rule_id: order-dispute-stale-version
    parent_entity: Order
    write_endpoint: "POST /marketplace/orders/{id}/disputes"
    occ_field: "expected_order_version"
    description: |
      Opening a Dispute on an Order whose version has advanced since the buyer
      last observed it is rejected, because the order's DELIVERED snapshot the
      buyer disputes (video version, auto-confirm clock) may no longer be the
      one the server holds. The stale request is refused with ERR_STALE_VERSION.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: talent-rate-stale-version
    parent_entity: Talent
    write_endpoint: "POST /marketplace/talents/{id}/rates"
    occ_field: "expected_talent_version"
    description: |
      Setting rates on a Talent whose version has advanced since the caller
      last observed it (e.g., a demand-suggestion refresh or tier recompute
      landed in between) is rejected with ERR_STALE_VERSION, so a rate write
      never silently overwrites a tier or suggestion recompute.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: payout_computation
    trigger: "on Order transition DELIVERED -> CONFIRMED (buyer confirm, auto-confirm sweep, or dispute NO_REFUND resolution)"
    algorithm: tiered_pricing
    formula: |
      tier = talent.commission_tier   # STANDARD | SILVER | GOLD, resolved at confirm time
      rate = COMMISSION_RATE[tier]    # 0.25 | 0.20 | 0.15
      commission = round_half_up(order.gross_amount_cents * rate)
      talent_net = order.gross_amount_cents - commission
      order.platform_commission_cents = commission
      order.talent_net_cents = talent_net
    input_set: "the single order transitioning to CONFIRMED and its talent's current commission_tier"
    constants:
      COMMISSION_STANDARD: 0.25
      COMMISSION_SILVER: 0.20
      COMMISSION_GOLD: 0.15
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional_estimate
        when: "GET /marketplace/orders/{id} while order.status == DELIVERED (pre-confirmation preview)"
        difference: "estimates commission using the talent's commission_tier at read time; not persisted, may differ from the final value if the tier changes before confirmation"
      - name: final_settlement
        when: "at the CONFIRMED transition"
        difference: "freezes commission using the tier at the exact transition instant and persists platform_commission_cents / talent_net_cents; tier changes afterward do NOT retroactively alter the order"

  - name: licensing_fee
    trigger: "on POST /marketplace/orders/{id}/license-grants (create)"
    algorithm: tiered_pricing
    formula: |
      # usage duration in days, half-open window [starts_at, ends_at)
      days = ceil((ends_at - starts_at) / 86400)   # minimum 1
      base = FEE_BASE[license_type]                # BUSINESS 50000, ADVERTISING 150000 cents
      # channel factor: multiply base by per-channel factors, sum across channels
      channel_sum = sum(CHANNEL_FACTOR[c] for c in channels)
      territory_mult = 1.0 if territory == DOMESTIC else 1.5
      # duration tier: windows strictly longer than 90 days get 10% off the
      # portion of day-count beyond 90 (tiered marginal discount)
      if days > 90:
        fee_raw = base * channel_sum * territory_mult * (90 + 0.9 * (days - 90))
      else:
        fee_raw = base * channel_sum * territory_mult * days
      fee_cents = round_half_up(fee_raw)
    input_set: "the new LicenseGrant's license_type, channels, territory, starts_at, ends_at; requires the parent order CONFIRMED and its latest Video CLEARED"
    constants:
      FEE_BASE_BUSINESS: 50000
      FEE_BASE_ADVERTISING: 150000
      TIER_DAY_BOUNDARY: 90
      TIER_DISCOUNT: 0.9
    precision: "integer cents, round_half_up; channel factors SOCIAL=1.0 WEB=1.2 TV=2.0 OOH=1.5; territory GLOBAL multiplier 1.5, DOMESTIC 1.0"
    variants:
      - name: marginal_tier
        when: "default — the 10% discount applies only to the day-count portion beyond 90 days"
        difference: "fee = rate * (90 + 0.9*(days-90)) for days > 90"
      - name: flat_tier_alternative_rejected
        when: "never applied — documented to pin the rejected interpretation"
        difference: "a whole-window 10% discount for days > 90 is explicitly NOT used; the scaffold pins the marginal interpretation"

  - name: talent_pricing_suggestion
    trigger: "on POST /marketplace/admin/talents/{id}/pricing-suggestion (admin-forced refresh, persists the suggestion); GET /marketplace/talents/{id}/pricing-suggestion returns the persisted suggestion and recomputes ONLY when the stored suggestion_seed_at is more than 24 hours stale relative to the logical clock (recompute on read is side-effect-free when fresh)"
    algorithm: weighted_scoring
    formula: |
      # demand = confirmed-order count in trailing 30 days (window [now-30d, now) )
      # utilization = accepted orders still open (ACCEPTED or RE_RECORD_REQUESTED)
      demand = count(Order where talent_id = talent.id and status == CONFIRMED
                     and updated_at in [now - 30 days, now))
      utilization = count(Order where talent_id = talent.id
                          and status IN {ACCEPTED, RE_RECORD_REQUESTED})
      demand_score = min(demand / 20, 1.0)              # saturates at 20
      utilization_score = min(utilization / 5, 1.0)     # saturates at 5
      score = 0.6 * demand_score + 0.4 * utilization_score
      # suggested personal rate: scale current rate by (1 + 0.5 * score),
      # rounded to the nearest 500 cents (round_half_up)
      raw = talent.personal_rate_cents * (1 + 0.5 * score)
      suggested = round_half_up(raw / 500) * 500
      # acceptance bounds: talent may only set a personal rate within
      # [floor(0.5 * suggested), ceil(2.0 * suggested)]
      talent.suggested_personal_rate_cents = suggested
      talent.suggestion_seed_at = now
    input_set: "orders of the talent: CONFIRMED within trailing 30 days for demand; ACCEPTED/RE_RECORD_REQUESTED for utilization"
    constants:
      DEMAND_SATURATION: 20
      UTILIZATION_SATURATION: 5
      W_DEMAND: 0.6
      W_UTILIZATION: 0.4
      SCALE_FACTOR: 0.5
      ROUNDING_STEP_CENTS: 500
      ACCEPT_LOWER_MULT: 0.5
      ACCEPT_UPPER_MULT: 2.0
    precision: "rate rounding to nearest 500 cents, round_half_up; scores unrounded until rate scaling"

  - name: commission_tier_assignment
    trigger: "on every change to talent.trailing_gmv_cents (order confirm adds gross; full/partial refund dispute resolutions subtract); recompute immediately"
    algorithm: threshold
    formula: |
      if talent.trailing_gmv_cents >= GOLD_THRESHOLD_CENTS:
        talent.commission_tier = GOLD
      elif talent.trailing_gmv_cents >= SILVER_THRESHOLD_CENTS:
        talent.commission_tier = SILVER
      else:
        talent.commission_tier = STANDARD
    input_set: "talent.trailing_gmv_cents — sum of gross_amount_cents over this talent's orders whose CONFIRMED transition occurred within the trailing 365-day window [now-365d, now), minus gross refunded by RESOLVED_REFUND and minus refund_to_buyer_cents refunded by RESOLVED_PARTIAL; BUYER_MISMATCH absorption does not subtract"
    constants:
      SILVER_THRESHOLD_CENTS: 500000
      GOLD_THRESHOLD_CENTS: 2000000
    precision: "integer cents; boundary is inclusive (>=)"
    variants:
      - name: trailing_window
        when: "default — GMV counted over a rolling 365-day window from the current logical clock"
        difference: "old confirmations age out of the window as the clock advances; tier may drop without any refund"
      - name: lifetime_cumulative_rejected
        when: "never applied — documented to pin the rejected interpretation"
        difference: "a lifetime cumulative GMV counter is explicitly NOT used"

  - name: dispute_refund_split
    trigger: "on Dispute resolution PARTIAL_REFUND"
    algorithm: waterfall_allocation
    formula: |
      refund_to_buyer = round_half_up(order.gross_amount_cents * 0.5)
      talent_retains = order.gross_amount_cents - refund_to_buyer
      clawback = refund_to_buyer   # platform commission is NOT clawed back
    input_set: "the REFUND_PENDING order's gross_amount_cents"
    constants:
      PARTIAL_REFUND_FRACTION: 0.5
    precision: "integer cents, round_half_up; for odd gross the buyer receives the larger half"

  - name: payout_sweep
    trigger: "on POST /marketplace/admin/payout-sweep (weekly batch, admin-triggered with logical clock)"
    algorithm: chronological
    formula: |
      for each Talent with status IN {ACTIVE, PAUSED}:
        lines = PayoutLine where talent_id = talent.id and settlement_status == UNSETTLED
                and created_at < sweep_period_end
        total = sum(lines.amount_cents)
        if total >= MIN_PAYOUT_CENTS:
          create Payout(status=SCHEDULED, talent_id, total_cents=total,
                        period_start=sweep_period_start, period_end=sweep_period_end)
          attach lines to the payout (set payout_id)
        # processing order across talents: talent.created_at ASC
    input_set: "UNSETTLED PayoutLines with created_at strictly before sweep_period_end, grouped by talent; talents processed in created_at ASC order"
    constants:
      MIN_PAYOUT_CENTS: 2500
    precision: "integer cents; talents whose lines net below MIN_PAYOUT_CENTS are skipped entirely (no payout created)"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "caller role is permitted for this endpoint per the RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every id referenced in the path exists, validated left-to-right (talent, then order, then child resource)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: existence
    check: "required request-body fields are present and well-typed (enums in declared sets, datetimes ISO-8601, integers within declared ranges)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 5
    category: state
    check: "target resource is in a state that permits the requested transition per §1.2 (e.g., accept only from AWAITING_ACCEPTANCE; confirm only from DELIVERED)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version matches the parent's current version on endpoints guarded by §1.2.1"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["POST /marketplace/orders/{id}/disputes", "POST /marketplace/talents/{id}/rates"]
  - priority: 7
    category: business_safety
    check: "order creation content screening: script_instructions and occasion are screened server-side; when flags are raised the order stays in SCREENING until the buyer attests or declines (screening-attest with a non-empty screening_flags is rejected)"
    error_id: ERR_CONTENT_POLICY_FLAGGED
    http_status: 422
    applies_to: ["POST /marketplace/orders/{id}/screening-attest"]
  - priority: 8
    category: business_safety
    check: "video moderation gate: order confirm, auto-confirm, re-record request, and license creation require the latest Video moderation_status == CLEARED"
    error_id: ERR_VIDEO_NOT_CLEARED
    http_status: 409
    applies_to: ["POST /marketplace/orders/{id}/confirm", "POST /marketplace/orders/{id}/re-record-requests", "POST /marketplace/orders/{id}/license-grants"]
  - priority: 9
    category: business_referential
    check: "identity/ownership: X-User-ID must equal the owning entity id (buyer acts only on own orders; talent acts only on own record/orders)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all non-admin endpoints"
  - priority: 10
    category: business_temporal
    check: "accept window: order accept requires logical clock < acceptance_deadline"
    error_id: ERR_ACCEPTANCE_WINDOW_CLOSED
    http_status: 409
    applies_to: ["POST /marketplace/orders/{id}/accept"]
  - priority: 11
    category: business_temporal
    check: "delivery window: video upload requires logical clock < delivery_deadline"
    error_id: ERR_DELIVERY_DEADLINE_PASSED
    http_status: 409
    applies_to: ["POST /marketplace/orders/{id}/videos"]
  - priority: 12
    category: business_temporal
    check: "buyer action window: confirm and re-record request require logical clock < auto_confirm_at; dispute open from DELIVERED also requires it (dispute open from CONFIRMED has no window)"
    error_id: ERR_BUYER_WINDOW_CLOSED
    http_status: 409
    applies_to: ["POST /marketplace/orders/{id}/confirm", "POST /marketplace/orders/{id}/re-record-requests", "POST /marketplace/orders/{id}/disputes"]
  - priority: 13
    category: business_temporal
    check: "license window validity: starts_at < ends_at (half-open [start, end)); a zero-length or inverted window is rejected"
    error_id: ERR_INVALID_LICENSE_WINDOW
    http_status: 422
    applies_to: ["POST /marketplace/orders/{id}/license-grants"]
  - priority: 14
    category: business_temporal
    check: "license window overlap: for a given order, a new LicenseGrant with license_type BUSINESS must not overlap (half-open intersection) any ACTIVE BUSINESS grant on the same order; same for ADVERTISING; cross-type overlaps are allowed"
    error_id: ERR_LICENSE_WINDOW_OVERLAP
    http_status: 409
    applies_to: ["POST /marketplace/orders/{id}/license-grants"]
  - priority: 15
    category: business_constraint
    check: "talent bookability: order creation requires talent.status == ACTIVE and talent.availability == BOOKABLE"
    error_id: ERR_TALENT_NOT_BOOKABLE
    http_status: 409
    applies_to: ["POST /marketplace/orders"]
  - priority: 16
    category: business_constraint
    check: "business licensing eligibility: BUSINESS_USE and ADVERTISING_USE orders require buyer.is_business_account == true"
    error_id: ERR_BUSINESS_ACCOUNT_REQUIRED
    http_status: 403
    applies_to: ["POST /marketplace/orders"]
  - priority: 17
    category: business_constraint
    check: "license type compatibility: LicenseGrant.license_type BUSINESS requires order.use_type IN {BUSINESS_USE, ADVERTISING_USE}; ADVERTISING requires order.use_type == ADVERTISING_USE"
    error_id: ERR_LICENSE_TYPE_INCOMPATIBLE
    http_status: 422
    applies_to: ["POST /marketplace/orders/{id}/license-grants"]
  - priority: 18
    category: business_constraint
    check: "re-record cap: order.re_record_count must be < 2 to open another buyer re-record request"
    error_id: ERR_RERECORD_LIMIT_REACHED
    http_status: 409
    applies_to: ["POST /marketplace/orders/{id}/re-record-requests"]
  - priority: 19
    category: business_constraint
    check: "duplicate dispute: an order may have at most one Dispute ever"
    error_id: ERR_DISPUTE_ALREADY_EXISTS
    http_status: 409
    applies_to: ["POST /marketplace/orders/{id}/disputes"]
  - priority: 20
    category: business_constraint
    check: "uniqueness: talent stage_name and email unique (case-insensitive); buyer email unique (case-insensitive)"
    error_id: ERR_DUPLICATE_UNIQUE_FIELD
    http_status: 409
    applies_to: ["POST /marketplace/talents", "POST /marketplace/buyers"]
  - priority: 21
    category: business_constraint
    check: "rate ordering and floors: personal_rate_cents >= 100; business_rate_cents >= 4 * personal floor and >= personal_rate_cents; advertising_rate_cents >= 8 * personal floor and >= business_rate_cents; when a suggestion exists, personal_rate_cents must lie within [floor(0.5*suggested), ceil(2.0*suggested)]"
    error_id: ERR_RATE_OUT_OF_BOUNDS
    http_status: 422
    applies_to: ["POST /marketplace/talents/{id}/rates", "POST /marketplace/admin/talents/{id}/activate"]
  - priority: 22
    category: business_fiscal
    check: "pause rate limit: talent may not start a 4th availability pause within a trailing 30-day window"
    error_id: ERR_PAUSE_RATE_LIMIT
    http_status: 429
    applies_to: ["POST /marketplace/talents/{id}/pause"]
  - priority: 23
    category: business_fiscal
    check: "payout minimum: payout sweep creates a Payout only when the talent's swept total >= 2500 cents"
    error_id: ERR_PAYOUT_BELOW_MINIMUM
    http_status: 422
    applies_to: ["POST /marketplace/admin/payout-sweep"]
  - priority: 24
    category: business_fiscal
    check: "tax compliance gate: payout initiate requires the talent to hold at least one VERIFIED TaxDocument"
    error_id: ERR_TAX_DOC_MISSING
    http_status: 422
    applies_to: ["POST /marketplace/admin/payouts/{id}/initiate"]
  - priority: 25
    category: business_fiscal
    check: "clawback solvency: dispute FULL_REFUND/PARTIAL_REFUND resolution requires talent.pending_balance_cents >= clawback amount (clawbacks may not drive pending balance negative)"
    error_id: ERR_PENDING_BALANCE_INSUFFICIENT
    http_status: 422
    applies_to: ["POST /marketplace/admin/disputes/{id}/resolve"]

endpoints:
  - method: POST
    path: "/marketplace/talents"
    description: "Register a new talent account (PENDING_VERIFICATION)."
    roles: [Talent]
    code: 201
    input: [stage_name, legal_name, email, identity_document_ref]
    output: Talent
    side_effects: ["talent created with status PENDING_VERIFICATION, availability BOOKABLE, balances 0"]
  - method: GET
    path: "/marketplace/talents/{id}"
    description: "Fetch a talent by id."
    roles: [Talent, Buyer, PlatformAdmin, Moderator]
    code: 200
    input: []
    output: Talent
    side_effects: []
  - method: GET
    path: "/marketplace/talents"
    description: "List talents (paginated)."
    roles: [Talent, Buyer, PlatformAdmin, Moderator]
    code: 200
    input: ["status?", "availability?", "limit?", "offset?"]
    output: Talent[]
    side_effects: []
  - method: POST
    path: "/marketplace/talents/{id}/identity/submit"
    description: "Talent submits identity document; transitions PENDING_VERIFICATION -> ID_VERIFIED."
    roles: [Talent]
    code: 200
    input: [identity_document_ref]
    output: Talent
    side_effects: ["identity_submitted_at set", "version +1"]
  - method: POST
    path: "/marketplace/talents/{id}/rates"
    description: "Set or change talent rates and turnaround (OCC-guarded)."
    roles: [Talent]
    code: 200
    input: [personal_rate_cents, business_rate_cents, advertising_rate_cents, turnaround_hours, expected_talent_version]
    output: Talent
    side_effects: ["rate bounds validated", "increments Talent.version by 1"]
  - method: POST
    path: "/marketplace/talents/{id}/pause"
    description: "Talent pauses availability (status ACTIVE -> PAUSED, availability PAUSED_AVAILABILITY)."
    roles: [Talent]
    code: 200
    input: []
    output: Talent
    side_effects: ["pause count incremented", "increments Talent.version by 1"]
  - method: POST
    path: "/marketplace/talents/{id}/resume"
    description: "Talent resumes availability (PAUSED -> ACTIVE)."
    roles: [Talent]
    code: 200
    input: []
    output: Talent
    side_effects: ["availability BOOKABLE", "increments Talent.version by 1"]
  - method: GET
    path: "/marketplace/talents/{id}/pricing-suggestion"
    description: "Return the talent's persisted demand-based pricing suggestion; recomputes only when the stored suggestion is more than 24h stale (logical clock) — otherwise side-effect-free."
    roles: [Talent, PlatformAdmin]
    code: 200
    input: []
    output: Talent
    side_effects: ["runs talent_pricing_suggestion only when stale (>24h); refreshes suggestion_seed_at on recompute"]
  - method: POST
    path: "/marketplace/talents/{id}/tax-documents"
    description: "Talent submits a tax document (W9/W8BEN)."
    roles: [Talent]
    code: 201
    input: [doc_type, tax_id_last4]
    output: TaxDocument
    side_effects: ["TaxDocument created SUBMITTED"]
  - method: GET
    path: "/marketplace/talents/{id}/tax-documents"
    description: "List a talent's tax documents."
    roles: [Talent, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: TaxDocument[]
    side_effects: []
  - method: GET
    path: "/marketplace/talents/{id}/payouts"
    description: "List a talent's payouts."
    roles: [Talent, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Payout[]
    side_effects: []
  - method: GET
    path: "/marketplace/talents/{id}/payout-lines"
    description: "List a talent's payout lines (filtered-list reverse reachability for PayoutLine.talent_id)."
    roles: [Talent, PlatformAdmin]
    code: 200
    input: ["settlement_status?", "limit?", "offset?"]
    output: PayoutLine[]
    side_effects: []

  - method: POST
    path: "/marketplace/buyers"
    description: "Register a buyer account."
    roles: [Buyer]
    code: 201
    input: [email, display_name, "is_business_account?"]
    output: Buyer
    side_effects: ["buyer created ACTIVE, wallet 0"]
  - method: GET
    path: "/marketplace/buyers/{id}"
    description: "Fetch a buyer by id."
    roles: [Buyer, PlatformAdmin]
    code: 200
    input: []
    output: Buyer
    side_effects: []
  - method: GET
    path: "/marketplace/buyers"
    description: "List buyers (paginated)."
    roles: [PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Buyer[]
    side_effects: []

  - method: POST
    path: "/marketplace/orders"
    description: "Buyer creates a video request; server runs content screening and freezes gross_amount_cents from the talent's rate for use_type. Order starts in SCREENING with screening_token and screening_flags."
    roles: [Buyer]
    code: 201
    input: [talent_id, buyer_id, use_type, occasion, script_instructions, recipient_name]
    output: Order
    side_effects: ["screening_flags computed", "screening_token minted", "gross_amount_cents frozen"]
  - method: GET
    path: "/marketplace/orders/{id}"
    description: "Fetch an order; while DELIVERED the response includes a provisional commission preview (provisional_estimate variant)."
    roles: [Buyer, Talent, PlatformAdmin, Moderator]
    code: 200
    input: []
    output: Order
    side_effects: []
  - method: GET
    path: "/marketplace/orders"
    description: "List orders, filterable by talent_id, buyer_id, status."
    roles: [Buyer, Talent, PlatformAdmin, Moderator]
    code: 200
    input: ["talent_id?", "buyer_id?", "status?", "limit?", "offset?"]
    output: Order[]
    side_effects: []
  - method: POST
    path: "/marketplace/orders/{id}/screening-attest"
    description: "Buyer echoes the screening token to attest a clear screening result; SCREENING -> AWAITING_ACCEPTANCE."
    roles: [Buyer]
    code: 200
    input: [screening_token]
    output: Order
    side_effects: ["acceptance_deadline = now + 48h"]
  - method: POST
    path: "/marketplace/orders/{id}/screening-decline"
    description: "Buyer declines the request during screening; SCREENING -> DECLINED with full wallet refund."
    roles: [Buyer]
    code: 200
    input: []
    output: Order
    side_effects: ["refund to buyer wallet"]
  - method: POST
    path: "/marketplace/orders/{id}/accept"
    description: "Talent accepts the request; AWAITING_ACCEPTANCE -> ACCEPTED."
    roles: [Talent]
    code: 200
    input: []
    output: Order
    side_effects: ["delivery_deadline = now + turnaround_hours"]
  - method: POST
    path: "/marketplace/orders/{id}/decline"
    description: "Talent declines the request; AWAITING_ACCEPTANCE -> DECLINED with full wallet refund."
    roles: [Talent]
    code: 200
    input: []
    output: Order
    side_effects: ["refund to buyer wallet"]
  - method: POST
    path: "/marketplace/orders/{id}/videos"
    description: "Talent uploads a video (initial delivery or re-record); creates Video PENDING_REVIEW and moves order to DELIVERED."
    roles: [Talent]
    code: 201
    input: [content_url, duration_seconds]
    output: Video
    side_effects: ["order ACCEPTED|RE_RECORD_REQUESTED -> DELIVERED", "auto_confirm_at = now + 72h", "OPEN ReRecordRequest closed"]
  - method: GET
    path: "/marketplace/orders/{id}/videos"
    description: "List videos for an order (sub-resource reverse reachability)."
    roles: [Buyer, Talent, PlatformAdmin, Moderator]
    code: 200
    input: ["limit?", "offset?"]
    output: Video[]
    side_effects: []
  - method: POST
    path: "/marketplace/orders/{id}/re-record-requests"
    description: "Buyer requests a re-record; DELIVERED -> RE_RECORD_REQUESTED, creates OPEN ReRecordRequest."
    roles: [Buyer]
    code: 200
    input: [notes]
    output: ReRecordRequest
    side_effects: ["order.re_record_count +1"]
  - method: GET
    path: "/marketplace/orders/{id}/re-record-requests"
    description: "List re-record requests for an order."
    roles: [Buyer, Talent, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: ReRecordRequest[]
    side_effects: []
  - method: POST
    path: "/marketplace/orders/{id}/confirm"
    description: "Buyer confirms the delivered video; DELIVERED -> CONFIRMED, runs payout_computation."
    roles: [Buyer]
    code: 200
    input: []
    output: Order
    side_effects: ["payout_computation", "VIDEO_EARNING PayoutLine", "pending balance credit", "GMV + tier recompute"]
  - method: POST
    path: "/marketplace/orders/{id}/disputes"
    description: "Buyer opens a dispute (video does not match request); DELIVERED -> REFUND_PENDING or CONFIRMED -> REFUND_PENDING, and creates Dispute OPEN. OCC-guarded on order version."
    roles: [Buyer]
    code: 201
    input: [reason, expected_order_version]
    output: Dispute
    side_effects: ["order -> REFUND_PENDING", "increments Order.version by 1"]
  - method: GET
    path: "/marketplace/orders/{id}/disputes"
    description: "List disputes for an order (0 or 1 element)."
    roles: [Buyer, Talent, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Dispute[]
    side_effects: []
  - method: POST
    path: "/marketplace/orders/{id}/license-grants"
    description: "Create a license grant for a CONFIRMED order; computes licensing_fee and credits a LICENSE_FEE_CREDIT PayoutLine (talent receives 100% of the licensing fee)."
    roles: [Buyer]
    code: 201
    input: [license_type, territory, channels, starts_at, ends_at]
    output: LicenseGrant
    side_effects: ["licensing_fee computed", "LICENSE_FEE_CREDIT PayoutLine created UNSETTLED", "talent.pending_balance_cents credited by fee_cents"]
  - method: GET
    path: "/marketplace/orders/{id}/license-grants"
    description: "List license grants for an order."
    roles: [Buyer, Talent, PlatformAdmin]
    code: 200
    input: ["license_type?", "status?", "limit?", "offset?"]
    output: LicenseGrant[]
    side_effects: []

  - method: GET
    path: "/marketplace/payouts/{id}"
    description: "Fetch a payout."
    roles: [Talent, PlatformAdmin]
    code: 200
    input: []
    output: Payout
    side_effects: []
  - method: GET
    path: "/marketplace/payouts/{id}/payout-lines"
    description: "List the payout lines swept into a payout (sub-resource reverse reachability for PayoutLine.payout_id)."
    roles: [Talent, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: PayoutLine[]
    side_effects: []
  - method: GET
    path: "/marketplace/payout-lines/{id}"
    description: "Fetch a single payout line by id."
    roles: [Talent, PlatformAdmin]
    code: 200
    input: []
    output: PayoutLine
    side_effects: []
  - method: GET
    path: "/marketplace/payout-lines"
    description: "List payout lines filtered by payout_id, order_id, or talent_id."
    roles: [PlatformAdmin]
    code: 200
    input: ["payout_id?", "order_id?", "talent_id?", "settlement_status?", "limit?", "offset?"]
    output: PayoutLine[]
    side_effects: []

  - method: POST
    path: "/marketplace/admin/talents/{id}/activate"
    description: "Admin activates an ID_VERIFIED talent (requires verified tax doc and valid rates)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Talent
    side_effects: ["ID_VERIFIED -> ACTIVE"]
  - method: POST
    path: "/marketplace/admin/talents/{id}/reject-identity"
    description: "Admin rejects a submitted identity; ID_VERIFIED -> PENDING_VERIFICATION."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Talent
    side_effects: ["identity fields cleared"]
  - method: POST
    path: "/marketplace/admin/talents/{id}/suspend"
    description: "Admin suspends a talent; cascades refunds on in-flight orders."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Talent
    side_effects: ["ACTIVE|PAUSED -> SUSPENDED", "in-flight order refund cascade"]
  - method: POST
    path: "/marketplace/admin/talents/{id}/pricing-suggestion"
    description: "Admin forces a pricing-suggestion refresh for a talent."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Talent
    side_effects: ["runs talent_pricing_suggestion"]
  - method: POST
    path: "/marketplace/admin/videos/{id}/moderate"
    description: "Admin/Moderator clears or flags an uploaded video."
    roles: [PlatformAdmin, Moderator]
    code: 200
    input: [decision, "flagged_reason?"]
    output: Video
    side_effects: ["CLEARED or FLAGGED; FLAG on a DELIVERED order forks it to RE_RECORD_REQUESTED"]
  - method: POST
    path: "/marketplace/admin/tax-documents/{id}/review"
    description: "Admin verifies or rejects a submitted tax document."
    roles: [PlatformAdmin]
    code: 200
    input: [decision]
    output: TaxDocument
    side_effects: ["VERIFIED or REJECTED"]
  - method: POST
    path: "/marketplace/admin/disputes/{id}/resolve"
    description: "Admin resolves an open dispute with outcome FULL_REFUND | PARTIAL_REFUND | NO_REFUND | BUYER_MISMATCH_PLATFORM_ABSORB."
    roles: [PlatformAdmin]
    code: 200
    input: [outcome, "resolution_notes?"]
    output: Dispute
    side_effects: ["order REFUND_PENDING -> REFUNDED|CONFIRMED", "refund to buyer wallet", "CLAWBACK PayoutLine as applicable", "pending balance debit", "GMV + tier recompute as applicable"]
  - method: POST
    path: "/marketplace/admin/deadline-sweep"
    description: "Ops-run checkpoint: advances all time-based automatic transitions (acceptance expiry, delivery-deadline cancellation, auto-confirm) up to the given logical timestamp; also flips ACTIVE LicenseGrants whose ends_at <= to_iso8601 to EXPIRED."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ expired_count: integer, cancelled_count: integer, auto_confirmed_count: integer, licenses_expired_count: integer }"
    side_effects: ["expiry/cancel/auto-confirm cascades", "license expiry"]
  - method: POST
    path: "/marketplace/admin/verification-sweep"
    description: "Ops-run checkpoint: auto-rejects PENDING_VERIFICATION talents whose identity submission is older than 72 hours at the given logical timestamp."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ auto_rejected_count: integer }"
    side_effects: ["identity fields cleared on stale submissions"]
  - method: POST
    path: "/marketplace/admin/payout-sweep"
    description: "Weekly payout batch: groups UNSETTLED payout lines by talent, creates SCHEDULED payouts for totals >= 2500 cents; response is the paginated envelope whose data array holds the created Payouts."
    roles: [PlatformAdmin]
    code: 200
    input: [period_start, period_end, "limit?", "offset?"]
    output: Payout[]
    side_effects: ["payout_sweep calculation"]
  - method: POST
    path: "/marketplace/admin/payouts/{id}/initiate"
    description: "Start processing a SCHEDULED payout (requires verified tax doc)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Payout
    side_effects: ["SCHEDULED -> PROCESSING"]
  - method: POST
    path: "/marketplace/admin/payouts/{id}/complete"
    description: "Complete a PROCESSING payout; lines settle, balances shift pending -> paid."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Payout
    side_effects: ["PROCESSING -> PAID", "lines SETTLED", "balance conservation"]

  - method: POST
    path: "/marketplace/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock. Before any call, the logical clock reads exactly 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced (monotonic; moving backward is rejected with ERR_INVALID_REQUEST)"]

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing or malformed X-User-Role / X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted for this endpoint per RBAC matrix"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "path-referenced resource id does not exist"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, malformed type, out-of-range value, or non-monotonic clock set"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "target resource is not in a state that permits the requested transition"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the parent's current version (OCC)"
  - id: ERR_CONTENT_POLICY_FLAGGED
    http: 422
    condition: "screening-attest attempted while order.screening_flags is non-empty"
  - id: ERR_VIDEO_NOT_CLEARED
    http: 409
    condition: "confirm / re-record / license creation attempted while latest video is not CLEARED"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "X-User-ID does not match the owning entity id for this resource"
  - id: ERR_ACCEPTANCE_WINDOW_CLOSED
    http: 409
    condition: "talent accept attempted at or after acceptance_deadline"
  - id: ERR_DELIVERY_DEADLINE_PASSED
    http: 409
    condition: "video upload attempted at or after delivery_deadline"
  - id: ERR_BUYER_WINDOW_CLOSED
    http: 409
    condition: "buyer confirm / re-record / dispute attempted at or after auto_confirm_at"
  - id: ERR_INVALID_LICENSE_WINDOW
    http: 422
    condition: "license starts_at >= ends_at"
  - id: ERR_LICENSE_WINDOW_OVERLAP
    http: 409
    condition: "new license grant overlaps an ACTIVE grant of the same license_type on the same order"
  - id: ERR_TALENT_NOT_BOOKABLE
    http: 409
    condition: "order creation against a talent not in ACTIVE status or with availability PAUSED_AVAILABILITY"
  - id: ERR_BUSINESS_ACCOUNT_REQUIRED
    http: 403
    condition: "BUSINESS_USE / ADVERTISING_USE order placed by a non-business buyer"
  - id: ERR_LICENSE_TYPE_INCOMPATIBLE
    http: 422
    condition: "license_type incompatible with the order's use_type"
  - id: ERR_RERECORD_LIMIT_REACHED
    http: 409
    condition: "buyer re-record request when order.re_record_count >= 2"
  - id: ERR_DISPUTE_ALREADY_EXISTS
    http: 409
    condition: "a Dispute already exists for this order"
  - id: ERR_DUPLICATE_UNIQUE_FIELD
    http: 409
    condition: "stage_name/email uniqueness violated (case-insensitive)"
  - id: ERR_RATE_OUT_OF_BOUNDS
    http: 422
    condition: "rates violate floors, ordering, or suggestion bounds"
  - id: ERR_PAUSE_RATE_LIMIT
    http: 429
    condition: "4th availability pause within trailing 30 days"
  - id: ERR_PAYOUT_BELOW_MINIMUM
    http: 422
    condition: "payout sweep attempted with a period that yields no talent meeting the 2500-cent minimum, OR a payout-create attempted for a talent whose swept total < 2500 cents; when at least one talent qualifies the sweep succeeds and returns the created payouts (non-qualifying talents are silently skipped)"
  - id: ERR_TAX_DOC_MISSING
    http: 422
    condition: "payout initiate without a VERIFIED tax document for the talent"
  - id: ERR_PENDING_BALANCE_INSUFFICIENT
    http: 422
    condition: "dispute clawback would drive talent.pending_balance_cents negative"

roles:
  - name: Talent
    description: "A celebrity/creator selling personalized videos; owns its profile, rates, availability, deliveries."
    identity: "entity_backed:Talent"
    exclusive_operations:
      - "submit identity"
      - "set rates (OCC)"
      - "pause/resume availability"
      - "accept/decline orders"
      - "upload videos"
      - "submit tax documents"
    shared_operations:
      - "read own orders, videos, payout lines, payouts, disputes"
  - name: Buyer
    description: "A purchaser of personalized videos (consumer or business account)."
    identity: "entity_backed:Buyer"
    exclusive_operations:
      - "create orders"
      - "screening attest/decline"
      - "confirm delivery"
      - "request re-record"
      - "open dispute (OCC)"
      - "create license grants"
    shared_operations:
      - "read own orders, videos, disputes, license grants"
  - name: Moderator
    description: "Content moderation specialist; may clear or flag videos."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "moderate videos"
      - "read orders and videos"
  - name: PlatformAdmin
    description: "Marketplace operator with override power: activation, suspension, tax review, dispute resolution, sweeps, payout lifecycle, clock control."
    identity: "opaque"
    exclusive_operations:
      - "activate/reject-identity/suspend talents"
      - "review tax documents"
      - "resolve disputes"
      - "run deadline/verification/payout sweeps"
      - "initiate/complete payouts"
      - "set logical clock"
      - "force pricing-suggestion refresh"
    shared_operations:
      - "read all resources"
      - "moderate videos"
