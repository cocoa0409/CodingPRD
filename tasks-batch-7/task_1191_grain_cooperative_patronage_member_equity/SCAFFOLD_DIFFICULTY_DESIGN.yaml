            - call: "POST /coop/fiscal_years"
              payload: { year_code: "FY2026", start_date: "2025-09-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z", net_margin_cents: 100000, retained_reserve_pct: 0.20, qualified_payout_pct: 0.30 }
              as: CoopAccountant
