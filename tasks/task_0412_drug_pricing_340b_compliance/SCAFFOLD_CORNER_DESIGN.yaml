      - name: occ_correct_version_drug_product_reconcile_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[ceiling-reconcile-stale]
          - entities.DrugProduct.fields.version
        distinguishing_aspect: "Reconcile with the current expected_drug_product_version succeeds (201) and bumps DrugProduct.version; the same version replayed afterward would then be stale."
        test_recipe:
          setup:
            - "A drug product with a published ceiling and one overcharging B340B PO; client reads the current drug-product version."
          setup_api_calls:
            - call: "POST /340b/covered-entities"
              payload: { hrsa_id: "DSH020042", legal_name: "OccRec CE", entity_type: "FQHC", medicaid_billing_mode: "CARVE_OUT" }
