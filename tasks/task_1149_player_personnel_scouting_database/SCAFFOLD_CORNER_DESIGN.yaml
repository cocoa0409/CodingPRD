              as: AreaScout
              as_user_id: "${s1}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_GRADE_OUT_OF_RANGE, HTTP 422"

      - name: duplicate_report_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_DUPLICATE_REPORT]"]
        distinguishing_aspect: "One report per (scout, prospect): the same scout's second report on the same prospect is rejected; a different scout's is not."
        test_recipe:
          setup: ["scout s; prospect p with s's report already created"]
