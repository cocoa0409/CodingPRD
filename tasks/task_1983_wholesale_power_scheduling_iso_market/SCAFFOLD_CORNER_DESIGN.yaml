              as: IsoOperator
            - call: "POST /market/generators/${g_id}/telemetry"
              payload:
                operating_day_id: "${d_id}"
                expected_generator_asset_version: "${g_v}"
                readings: [ { interval_index: 1, actual_mw: 10 }, { interval_index: 2, actual_mw: 10 }, { interval_index: 3, actual_mw: 10 }, { interval_index: 4, actual_mw: 10 }, { interval_index: 5, actual_mw: 10 }, { interval_index: 6, actual_mw: 10 }, { interval_index: 7, actual_mw: 10 }, { interval_index: 8, actual_mw: 10 }, { interval_index: 9, actual_mw: 10 }, { interval_index: 10, actual_mw: 10 }, { interval_index: 11, actual_mw: 10 }, { interval_index: 12, actual_mw: 10 }, { interval_index: 13, actual_mw: 10 }, { interval_index: 14, actual_mw: 10 }, { interval_index: 15, actual_mw: 10 }, { interval_index: 16, actual_mw: 10 }, { interval_index: 17, actual_mw: 10 }, { interval_index: 18, actual_mw: 10 }, { interval_index: 19, actual_mw: 10 }, { interval_index: 20, actual_mw: 10 }, { interval_index: 21, actual_mw: 10 }, { interval_index: 22, actual_mw: 10 }, { interval_index: 23, actual_mw: 10 }, { interval_index: 24, actual_mw: 10 } ]
              as: Trader
              as_user_id: "${p_id}"
            - call: "POST /market/operating-days/${d_id}/close-real-time"
              payload: { rt_node_prices_prelim: [ { node_name: "WEST_HUB", rt_prelim_energy_cents_per_mwh: 4000, rt_prelim_congestion_cents_per_mwh: 50, rt_prelim_loss_cents_per_mwh: 25 } ] }
              as: IsoOperator
            - { call: "POST /market/operating-days/${d_id}/run-preliminary-settlement", as: IsoOperator }
            - call: "POST /market/operating-days/${d_id}/run-final-settlement"
              payload: { rt_node_prices_final: [ { node_name: "WEST_HUB", rt_final_energy_cents_per_mwh: 4000, rt_final_congestion_cents_per_mwh: 50, rt_final_loss_cents_per_mwh: 25 } ] }
              as: IsoOperator
            - call: "GET /market/statements"
              payload: { operating_day_id: "${d_id}", market_participant_id: "${p_id}", run_type: "FINAL" }
              as: IsoOperator
              captures: { s_id: "$.data[0].id" }
          trigger:
            - { call: "POST /market/operating-days/${d_id}/close", as: IsoOperator }
            - call: "GET /market/statements/${s_id}"
              as: IsoOperator
              captures: { s_st: $.data.status }
            - call: "GET /market/operating-days/${d_id}"
              as: IsoOperator
              captures: { d_st: $.data.status }
          assert:
            - "OperatingDay.${d_id}.status == CLOSED and SettlementStatement.${s_id}.status == CLOSED (cascade down)"

      - name: award_cancelled_before_settlement_gets_zero_revenue
        claim_type: side_effect_execution
        grounds: [state_machines.AncillaryServiceAward.AWARDED_to_CANCELLED, calculations.ancillary_revenue]
        distinguishing_aspect: "A cancelled award is excluded from the settlement input set — no ANCILLARY line is emitted and revenue_cents stays 0."
