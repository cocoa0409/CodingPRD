            - "Licensee.${br_id}.discipline_status == UNDER_INVESTIGATION and Brokerage.${bkg_id}.supervision_posture == RESTRICTED - the escalated audit no longer counts as overdue, so the posture is driven by the designated broker's discipline status and the 200000 shortage, not by overdue_remediation_count"
            - "TrustAccount.${ta_id}.status is still RESTRICTED with shortage_cents == 200000 - the sweep escalates the audit but never cures the account"
            - "the third sweep, identical to the second, returns all five counts == 0: the audit has left REMEDIATION_ORDERED and the order has left ISSUED, so the sweep is idempotent"
      - name: the_clock_endpoint_mutates_nothing_and_implies_no_sweep
        claim_type: action_endpoint
        grounds:
          - endpoints["POST /commission/_clock/set_current_utc"]
          - state_machines.Licensee.ACTIVE_to_EXPIRED
        distinguishing_aspect: |
          Moving the logical clock past a licence's expiry does NOT expire it: the clock endpoint's
          declared side effect is the clock alone, and only POST /commission/compliance-sweeps applies
          step 1. An implementation that lazily expires rows on read reports EXPIRED before any sweep
          runs and fails the first read.
        test_recipe:
          setup:
            - "Harbor Realty Group is ACTIVE with Dana Broker ACTIVE and self-supervising, so license_expires_at == 2028-07-31T00:00:00Z"
          setup_api_calls:
