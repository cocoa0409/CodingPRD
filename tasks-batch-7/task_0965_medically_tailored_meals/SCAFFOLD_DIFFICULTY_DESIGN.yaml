      - name: freeze_safety_beats_constraint
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - state_machines.MenuCycle.PLANNED_to_FROZEN
        distinguishing_aspect: |
          Error-category pair business_safety-vs-business_constraint (distinct
          from the state-vs-fiscal pair above): the freeze violates BOTH the
          allergen safety rule (Peanut Chicken contains PEANUT, member allergic)
          AND the meal-count constraint (11 meals > 10/week cap); the safety
          error ERR_ALLERGEN_VIOLATION MUST win over ERR_MEAL_COUNT_EXCEEDED.
