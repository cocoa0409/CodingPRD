# =============================================================================
# §1.8 Scaffold Difficulty Design — ship-from-store fulfillment node management
# -----------------------------------------------------------------------------
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 only. All numeric asserts
# were produced by executing the §1.3 formulas with their declared constants.
# Fixture stores (payloads are repeated verbatim per instance):
#   S1 zone 4 cap 120 staff 480 std 12 per 3 rate 42 cutoff 1020  (cold elig 72.00)
#   S2 zone 5 cap  60 staff 300 std 15 per 4 rate 38 cutoff 1080 hazmat (48.75)
#   S3 zone 2 cap 200 staff 600 std 10 per 2 rate 20 cutoff  960  (88.00)
#   S4 zone 4 cap  50 staff  60 std  6 per 3 rate 30 cutoff 1020  (31.75)
#   S5 zone 3 cap 100 staff 400 std 10 per 2 rate 25 cutoff 1020  (63.00)
#   S6 zone 4 cap 100 staff  60 std  6 per 3 rate 30 cutoff 1020  (41.75)
# SKU-A 800 g / 4500 c / MEDIUM ; SKU-B 250 g / 1900 c / SMALL ;
# SKU-H 1200 g / 6900 c / LARGE / hazmat.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: node_posture_score_diverges_from_governance_review_score
        grounds:
          - calculations.store_eligibility_score
          - entities.Store.fields.eligibility_score
          - entities.Store.fields.review_score
          - entities.Store.fields.eligibility_score_basis
          - state_machines.NodePerformanceWindow.OPEN_to_CLOSED
        distinguishing_aspect: |
          Domain 1 = the Store node-governance domain: one ops-run close writes two
          different numbers from store_eligibility_score for the SAME store — review_score
          83.60 (variant governance_blended, computed at step 3 while units_committed_epoch
          is still 2) and eligibility_score 84.00 (variant routing_trailing, computed at
          step 7 after step 4 reset units_committed_epoch to 0).
        test_recipe:
          setup:
            - "Clock at 2026-08-03T09:00:00Z; exactly one store S1 with an OPEN epoch-1 window."
            - "SKU-A stocked at S1 on_hand 12 / safety 2 (ATP 10); MEDIUM_BOX and LARGE_BOX packaging on hand."
            - "One GROUND order to zone 4 for 2 units of SKU-A, committed to S1 (provisional 1336)."
            - "The assignment is accepted at 09:10, picked in full, packed at 09:40 in a LARGE_BOX (30 actual labour minutes) and shipped at 09:40, so cycle_time_minutes = 40 and final_cost_cents = 1900."
          setup_api_calls:
            - call: "POST /fulfillment-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/stores"
              payload: { store_code: "S1-DOWNTOWN", region_code: "WEST", origin_zone: 4, daily_unit_capacity: 120, staffed_labor_minutes: 480, labor_standard_minutes_per_order: 12, pick_labor_minutes_per_unit: 3, labor_rate_cents_per_minute: 42, cutoff_utc_minutes: 1020, hazmat_certified: false }
              as: NetworkPlanner
              captures: { s1: "$.data.id" }
            - call: "POST /fulfillment-network/skus"
              payload: { sku_code: "SKU-A", unit_weight_grams: 800, unit_price_cents: 4500, package_class: "MEDIUM", hazmat_flag: false }
              as: NetworkPlanner
              captures: { sku_a: "$.data.id" }
            - call: "POST /fulfillment-network/store-inventories"
              payload: { store_id: "${s1}", sku_id: "${sku_a}", on_hand_units: 12, safety_stock_units: 2 }
              as: NetworkPlanner
              captures: { inv_a: "$.data.id" }
            - call: "POST /fulfillment-network/packaging-supplies"
              payload: { store_id: "${s1}", package_type: "MEDIUM_BOX", on_hand_units: 20, reorder_point_units: 2 }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/packaging-supplies"
              payload: { store_id: "${s1}", package_type: "LARGE_BOX", on_hand_units: 10, reorder_point_units: 1 }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/stores/${s1}/carrier-pickups"
              payload: { carrier_code: "GRD", window_start_utc: "2026-08-03T09:00:00Z", window_end_utc: "2026-08-03T12:00:00Z", parcel_capacity: 5 }
              as: CarrierCoordinator
              captures: { pk1: "$.data.id", pk1_v: "$.data.version" }
            - call: "POST /fulfillment-network/orders"
              payload: { order_code: "O-1001", customer_ref: "C-1", destination_zone: 4, service_level: "GROUND", promised_ship_by_utc: "2026-08-03T16:00:00Z" }
              as: CustomerCare
              captures: { o1: "$.data.id" }
            - call: "POST /fulfillment-network/orders/${o1}/lines"
              payload: { sku_id: "${sku_a}", quantity: 2, unit_price_cents: 4500 }
              as: CustomerCare
            - call: "GET /fulfillment-network/orders/${o1}"
              payload: {}
              as: NetworkPlanner
              captures: { o1_v: "$.data.version" }
            - call: "POST /fulfillment-network/orders/${o1}/routing-runs"
              payload: { mode: "COMMIT", expected_order_version: "${o1_v}" }
              as: NetworkPlanner
            - call: "GET /fulfillment-network/assignments"
              payload: { order_id: "${o1}" }
              as: NetworkPlanner
              captures: { a1: "$.data[0].id" }
            - call: "GET /fulfillment-network/assignment-lines"
              payload: { assignment_id: "${a1}" }
              as: NetworkPlanner
              captures: { al1: "$.data[0].id" }
            - call: "POST /fulfillment-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:10:00Z" }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/assignments/${a1}/accept"
              payload: {}
              as: StoreAssociate
              as_user_id: "${s1}"
            - call: "POST /fulfillment-network/assignments/${a1}/pick"
              payload: { picked_units: 2, line_picks: [ { assignment_line_id: "${al1}", units_picked: 2 } ] }
              as: StoreAssociate
              as_user_id: "${s1}"
            - call: "POST /fulfillment-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:40:00Z" }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/assignments/${a1}/pack"
              payload: { package_type: "LARGE_BOX" }
              as: StoreAssociate
              as_user_id: "${s1}"
            - call: "POST /fulfillment-network/assignments/${a1}/ship"
              payload: { carrier_pickup_id: "${pk1}", expected_pickup_version: "${pk1_v}" }
              as: StoreAssociate
              as_user_id: "${s1}"
            - call: "POST /fulfillment-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:45:00Z" }
              as: NetworkPlanner
          trigger:
            - call: "POST /fulfillment-network/performance-windows/close"
              payload: {}
              as: NetworkPlanner
              captures: { w1: "$.data[0].id" }
          assert:
            - "NodePerformanceWindow.${w1}.epoch == 1"
            - "NodePerformanceWindow.${w1}.fill_rate == 1.0000"
            - "NodePerformanceWindow.${w1}.cancellation_rate == 0.0000"
            - "NodePerformanceWindow.${w1}.avg_cycle_time_minutes == 40.00"
            - "NodePerformanceWindow.${w1}.store_cost_per_order_cents == 1900"
            - "NodePerformanceWindow.${w1}.dc_cost_per_order_cents == 2090"
            - "NodePerformanceWindow.${w1}.cost_index_bps == 9091"
            - "NodePerformanceWindow.${w1}.breach_flags == []"
            - "NodePerformanceWindow.${w1}.node_action == NONE"
            - "Store.${s1}.review_score == 83.60"
            - "Store.${s1}.eligibility_score == 84.00"
            - "Store.${s1}.review_score != Store.${s1}.eligibility_score"
            - "Store.${s1}.eligibility_score_basis == TRAILING_WINDOW"
            - "Store.${s1}.units_committed_epoch == 0"
            - "Store.${s1}.node_status == ELIGIBLE"

      - name: assignment_provisional_cost_versus_final_cost_at_ship
        grounds:
          - calculations.assignment_fulfillment_cost
          - entities.FulfillmentAssignment.fields.provisional_cost_cents
          - entities.FulfillmentAssignment.fields.final_cost_cents
          - entities.FulfillmentAssignment.fields.labor_minutes_actual
          - state_machines.FulfillmentAssignment.PACKED_to_SHIPPED
        distinguishing_aspect: |
          Domain 2 = the FulfillmentAssignment parcel-cost domain (a different entity domain
          than instance 1's Store governance scores): the same 2-unit allocation costs 1336
          under variant provisional (labour STANDARD 18 min, derived MEDIUM_BOX) and 1900
          under variant final (labour ACTUAL 30 min, associate-recorded LARGE_BOX).
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00Z; store S1 only, SKU-A on_hand 12 / safety 2, MEDIUM_BOX and LARGE_BOX on hand, pickup 09:00-12:00 capacity 5."
            - "GROUND order to zone 4, one line SKU-A x2, COMMIT-routed to S1: assignment provisional_cost_cents 1336 (labour 18 min x 42 = 756, MEDIUM_BOX 130 + 30 = 160, ship 610 + 25*3 = 685 ... per-line 420 at zone_delta 0)."
            - "Accepted 09:10, picked 2/2, packed 09:40 in a LARGE_BOX so labor_minutes_actual = 30; not yet shipped."
          setup_api_calls:
            - call: "POST /fulfillment-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/stores"
              payload: { store_code: "S1-DOWNTOWN", region_code: "WEST", origin_zone: 4, daily_unit_capacity: 120, staffed_labor_minutes: 480, labor_standard_minutes_per_order: 12, pick_labor_minutes_per_unit: 3, labor_rate_cents_per_minute: 42, cutoff_utc_minutes: 1020, hazmat_certified: false }
              as: NetworkPlanner
              captures: { s1: "$.data.id" }
            - call: "POST /fulfillment-network/skus"
              payload: { sku_code: "SKU-A", unit_weight_grams: 800, unit_price_cents: 4500, package_class: "MEDIUM", hazmat_flag: false }
              as: NetworkPlanner
              captures: { sku_a: "$.data.id" }
            - call: "POST /fulfillment-network/store-inventories"
              payload: { store_id: "${s1}", sku_id: "${sku_a}", on_hand_units: 12, safety_stock_units: 2 }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/packaging-supplies"
              payload: { store_id: "${s1}", package_type: "LARGE_BOX", on_hand_units: 10, reorder_point_units: 1 }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/stores/${s1}/carrier-pickups"
              payload: { carrier_code: "GRD", window_start_utc: "2026-08-03T09:00:00Z", window_end_utc: "2026-08-03T12:00:00Z", parcel_capacity: 5 }
              as: CarrierCoordinator
              captures: { pk1: "$.data.id", pk1_v: "$.data.version" }
            - call: "POST /fulfillment-network/orders"
              payload: { order_code: "O-1002", customer_ref: "C-1", destination_zone: 4, service_level: "GROUND", promised_ship_by_utc: "2026-08-03T16:00:00Z" }
              as: CustomerCare
              captures: { o1: "$.data.id" }
            - call: "POST /fulfillment-network/orders/${o1}/lines"
              payload: { sku_id: "${sku_a}", quantity: 2, unit_price_cents: 4500 }
              as: CustomerCare
            - call: "GET /fulfillment-network/orders/${o1}"
              payload: {}
              as: NetworkPlanner
              captures: { o1_v: "$.data.version" }
            - call: "POST /fulfillment-network/orders/${o1}/routing-runs"
              payload: { mode: "COMMIT", expected_order_version: "${o1_v}" }
              as: NetworkPlanner
            - call: "GET /fulfillment-network/assignments"
              payload: { order_id: "${o1}" }
              as: NetworkPlanner
              captures: { a1: "$.data[0].id" }
            - call: "GET /fulfillment-network/assignment-lines"
              payload: { assignment_id: "${a1}" }
              as: NetworkPlanner
              captures: { al1: "$.data[0].id" }
            - call: "POST /fulfillment-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:10:00Z" }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/assignments/${a1}/accept"
              payload: {}
              as: StoreAssociate
              as_user_id: "${s1}"
            - call: "POST /fulfillment-network/assignments/${a1}/pick"
              payload: { picked_units: 2, line_picks: [ { assignment_line_id: "${al1}", units_picked: 2 } ] }
              as: StoreAssociate
              as_user_id: "${s1}"
            - call: "POST /fulfillment-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:40:00Z" }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/assignments/${a1}/pack"
              payload: { package_type: "LARGE_BOX" }
              as: StoreAssociate
              as_user_id: "${s1}"
          trigger:
            - call: "POST /fulfillment-network/assignments/${a1}/ship"
              payload: { carrier_pickup_id: "${pk1}", expected_pickup_version: "${pk1_v}" }
              as: StoreAssociate
              as_user_id: "${s1}"
          assert:
            - "FulfillmentAssignment.${a1}.status == SHIPPED"
            - "FulfillmentAssignment.${a1}.provisional_cost_cents == 1336"
            - "FulfillmentAssignment.${a1}.final_cost_cents == 1900"
            - "FulfillmentAssignment.${a1}.labor_minutes_actual == 30"
            - "FulfillmentAssignment.${a1}.derived_package_type == MEDIUM_BOX"
            - "FulfillmentAssignment.${a1}.package_type == LARGE_BOX"
            - "FulfillmentAssignment.${a1}.cycle_time_minutes == 40"
            - "CustomerOrder.${o1}.provisional_cost_cents == 1416"
            - "CustomerOrder.${o1}.final_cost_cents == 2014"
            - "CustomerOrder.${o1}.cost_variance_cents == 598"
            - "CustomerOrder.${o1}.cost_index_bps == 9636"
            - "CustomerOrder.${o1}.fulfillment_status == SHIPPED"

      - name: order_cost_tier_flips_between_provisional_and_final_pass
        grounds:
          - calculations.order_cost_per_order_comparison
          - entities.CustomerOrder.fields.provisional_cost_cents
          - entities.CustomerOrder.fields.final_cost_cents
          - entities.CustomerOrder.fields.cost_variance_cents
          - endpoints[GET /fulfillment-network/orders/{order_id}/cost-comparison]
        distinguishing_aspect: |
          Domain 3 = the CustomerOrder network-fee domain: the provisional pass keys the fee
          on pre_fee_subtotal 2598 (TIER_2_RATE 0.045 -> 2715) while the final pass keys it on
          1590 (TIER_1_RATE 0.060 -> 1685), so the two variants land in DIFFERENT fee tiers and
          cost_variance_cents is negative (-1030) even though nothing was cancelled.
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00Z; store S1 only with SKU-A on_hand 12 / safety 2 (ATP 10) and MEDIUM_BOX on hand."
            - "GROUND order to zone 4 with one line SKU-A x9 committed to S1: assignment provisional 2598 (labour 39 min x 42 = 1638, pack 265, ship 695), order provisional 2715 at rate 0.045."
            - "Accepted 09:05, picked 9/9, packed 09:20 (labor_minutes_actual 15) in the SAME MEDIUM_BOX, shipped 09:20: assignment final 1590."
          setup_api_calls:
            - call: "POST /fulfillment-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/stores"
              payload: { store_code: "S1-DOWNTOWN", region_code: "WEST", origin_zone: 4, daily_unit_capacity: 120, staffed_labor_minutes: 480, labor_standard_minutes_per_order: 12, pick_labor_minutes_per_unit: 3, labor_rate_cents_per_minute: 42, cutoff_utc_minutes: 1020, hazmat_certified: false }
              as: NetworkPlanner
              captures: { s1: "$.data.id" }
            - call: "POST /fulfillment-network/skus"
              payload: { sku_code: "SKU-A", unit_weight_grams: 800, unit_price_cents: 4500, package_class: "MEDIUM", hazmat_flag: false }
              as: NetworkPlanner
              captures: { sku_a: "$.data.id" }
            - call: "POST /fulfillment-network/store-inventories"
              payload: { store_id: "${s1}", sku_id: "${sku_a}", on_hand_units: 12, safety_stock_units: 2 }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/packaging-supplies"
              payload: { store_id: "${s1}", package_type: "MEDIUM_BOX", on_hand_units: 20, reorder_point_units: 2 }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/stores/${s1}/carrier-pickups"
              payload: { carrier_code: "GRD", window_start_utc: "2026-08-03T09:00:00Z", window_end_utc: "2026-08-03T12:00:00Z", parcel_capacity: 5 }
              as: CarrierCoordinator
              captures: { pk1: "$.data.id", pk1_v: "$.data.version" }
            - call: "POST /fulfillment-network/orders"
              payload: { order_code: "O-1003", customer_ref: "C-1", destination_zone: 4, service_level: "GROUND", promised_ship_by_utc: "2026-08-03T16:00:00Z" }
              as: CustomerCare
              captures: { o1: "$.data.id" }
            - call: "POST /fulfillment-network/orders/${o1}/lines"
              payload: { sku_id: "${sku_a}", quantity: 9, unit_price_cents: 4500 }
              as: CustomerCare
            - call: "GET /fulfillment-network/orders/${o1}"
              payload: {}
              as: NetworkPlanner
              captures: { o1_v: "$.data.version" }
            - call: "POST /fulfillment-network/orders/${o1}/routing-runs"
              payload: { mode: "COMMIT", expected_order_version: "${o1_v}" }
              as: NetworkPlanner
            - call: "GET /fulfillment-network/assignments"
              payload: { order_id: "${o1}" }
              as: NetworkPlanner
              captures: { a1: "$.data[0].id" }
            - call: "GET /fulfillment-network/assignment-lines"
              payload: { assignment_id: "${a1}" }
              as: NetworkPlanner
              captures: { al1: "$.data[0].id" }
            - call: "POST /fulfillment-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:05:00Z" }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/assignments/${a1}/accept"
              payload: {}
              as: StoreAssociate
              as_user_id: "${s1}"
            - call: "POST /fulfillment-network/assignments/${a1}/pick"
              payload: { picked_units: 9, line_picks: [ { assignment_line_id: "${al1}", units_picked: 9 } ] }
              as: StoreAssociate
              as_user_id: "${s1}"
            - call: "POST /fulfillment-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:20:00Z" }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/assignments/${a1}/pack"
              payload: { package_type: "MEDIUM_BOX" }
              as: StoreAssociate
              as_user_id: "${s1}"
            - call: "POST /fulfillment-network/assignments/${a1}/ship"
              payload: { carrier_pickup_id: "${pk1}", expected_pickup_version: "${pk1_v}" }
              as: StoreAssociate
              as_user_id: "${s1}"
          trigger:
            - call: "GET /fulfillment-network/orders/${o1}/cost-comparison"
              payload: {}
              as: NetworkPlanner
          assert:
            - "response.data.variant == FINAL"
            - "response.data.parcel_count == 1"
            - "response.data.component_sum_cents == 1590"
            - "response.data.split_penalty_cents == 0"
            - "response.data.reroute_overhead_cents == 0"
            - "response.data.pre_fee_subtotal_cents == 1590"
            - "response.data.network_fee_rate == 0.060"
            - "response.data.network_fee_cents == 95"
            - "response.data.store_cost_cents == 1685"
            - "response.data.dc_baseline_cost_cents == 2930"
            - "response.data.cost_index_bps == 5751"
            - "response.data.savings_vs_dc_cents == 1245"
            - "CustomerOrder.${o1}.provisional_cost_cents == 2715"
            - "CustomerOrder.${o1}.final_cost_cents == 1685"
            - "CustomerOrder.${o1}.cost_variance_cents == -1030"

  - rule_id: combinatorial_formula
    instances:
      - name: per_line_ship_rounding_before_sum_on_expedited_two_line_assignment
        grounds:
          - calculations.assignment_fulfillment_cost
          - calculations.routing_candidate_evaluation
          - entities.FulfillmentAssignment.fields.provisional_cost_cents
          - entities.RoutingCandidate.fields.cost_estimate_cents
        distinguishing_aspect: |
          Mode (b) instance: ship cost is round-per-line-then-sum, and the pinned order is the
          ONLY thing separating 1405 (635 + 770) from the sum-then-round result 1404, so the
          assignment's provisional_cost_cents must be exactly 1955 and never 1954.
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00Z; store S3 only (origin_zone 2, rate 20 c/min, std 10, per_unit 2)."
            - "SKU-B (250 g, SMALL) on_hand 8 / safety 1 and SKU-A (800 g, MEDIUM) on_hand 12 / safety 2 at S3."
            - "EXPEDITED order to zone 4 (zone_delta 2 -> ZONE_BASE 445, SERVICE_MULTIPLIER 1.35) with line 1 = SKU-B x1 and line 2 = SKU-A x3, both still OPEN."
          setup_api_calls:
            - call: "POST /fulfillment-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/stores"
              payload: { store_code: "S3-SUBURB", region_code: "WEST", origin_zone: 2, daily_unit_capacity: 200, staffed_labor_minutes: 600, labor_standard_minutes_per_order: 10, pick_labor_minutes_per_unit: 2, labor_rate_cents_per_minute: 20, cutoff_utc_minutes: 960, hazmat_certified: false }
              as: NetworkPlanner
              captures: { s3: "$.data.id" }
            - call: "POST /fulfillment-network/skus"
              payload: { sku_code: "SKU-A", unit_weight_grams: 800, unit_price_cents: 4500, package_class: "MEDIUM", hazmat_flag: false }
              as: NetworkPlanner
              captures: { sku_a: "$.data.id" }
            - call: "POST /fulfillment-network/skus"
              payload: { sku_code: "SKU-B", unit_weight_grams: 250, unit_price_cents: 1900, package_class: "SMALL", hazmat_flag: false }
              as: NetworkPlanner
              captures: { sku_b: "$.data.id" }
            - call: "POST /fulfillment-network/store-inventories"
              payload: { store_id: "${s3}", sku_id: "${sku_a}", on_hand_units: 12, safety_stock_units: 2 }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/store-inventories"
              payload: { store_id: "${s3}", sku_id: "${sku_b}", on_hand_units: 8, safety_stock_units: 1 }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/orders"
              payload: { order_code: "O-2001", customer_ref: "C-2", destination_zone: 4, service_level: "EXPEDITED", promised_ship_by_utc: "2026-08-03T14:00:00Z" }
              as: CustomerCare
              captures: { o2: "$.data.id" }
            - call: "POST /fulfillment-network/orders/${o2}/lines"
              payload: { sku_id: "${sku_b}", quantity: 1, unit_price_cents: 1900 }
              as: CustomerCare
            - call: "POST /fulfillment-network/orders/${o2}/lines"
              payload: { sku_id: "${sku_a}", quantity: 3, unit_price_cents: 4500 }
              as: CustomerCare
            - call: "GET /fulfillment-network/orders/${o2}"
              payload: {}
              as: NetworkPlanner
              captures: { o2_v: "$.data.version" }
          trigger:
            - call: "POST /fulfillment-network/orders/${o2}/routing-runs"
              payload: { mode: "COMMIT", expected_order_version: "${o2_v}" }
              as: NetworkPlanner
              captures: { run1: "$.data.id" }
            - call: "GET /fulfillment-network/routing-candidates"
