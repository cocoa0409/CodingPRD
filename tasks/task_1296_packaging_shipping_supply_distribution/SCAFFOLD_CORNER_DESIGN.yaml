  # ==================================================================
  # Section: endpoints
  # ==================================================================
  - section: endpoints
    instances:
      - name: endpoint_inventory_receive_crossing_fires_notification
        claim_type: action_endpoint_side_effects
        grounds:
          - state_machines.RestockNotification.ACTIVE_to_NOTIFIED
          - calculations.calc_same_day_cutoff
        distinguishing_aspect: "POST /inventory/{id}/receive lifting available_qty from below reorder_point to >= reorder_point fires ACTIVE subscriptions exactly once with notified_at from the logical clock."
        test_recipe:
          setup: ["warehouse ATL; account; product inventory on_hand 0 reorder_point 5; ACTIVE subscription; clock 2026-08-05T09:00:00Z"]
          setup_api_calls:
            - call: "POST /packaging-distribution/warehouses"
              payload: { code: "ATL", name: "Atlanta DC", zone: 2, ship_cutoff_time: "15:00", timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { wh_atl: $.data.id }
            - call: "POST /packaging-distribution/accounts"
              payload: { company_name: "Acme Corp", account_type: "CORPORATE", credit_limit_cents: 100000000, default_warehouse_code: "ATL" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /packaging-distribution/products"
              payload: { sku: "V-1", name: "V", category: "TAPE", base_price_cents: 100, uom: "EACH", case_qty: 1, pallet_qty: 10, weight_lbs_per_unit: 1, density_pcf: 20 }
              as: CatalogManager
              captures: { prod: $.data.id }
            - call: "POST /packaging-distribution/inventory"
              payload: { product_id: "${prod}", warehouse_id: "${wh_atl}", on_hand_qty: 0, reorder_point_qty: 5 }
              as: WarehouseOps
              captures: { inv: $.data.id }
            - call: "POST /packaging-distribution/restock-notifications"
              payload: { account_id: "${acct}", product_id: "${prod}" }
              as: Buyer
              as_user_id: "${acct}"
              captures: { notif: $.data.id }
            - call: "POST /packaging-distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /packaging-distribution/inventory/${inv}/receive"
              payload: { qty: 7 }
              as: WarehouseOps
              captures: { onhand: $.data.on_hand_qty, avail: $.data.available_qty }
            - call: "GET /packaging-distribution/restock-notifications/${notif}"
              payload: {}
              as: PlatformAdmin
              captures: { n_status: $.data.status, n_at: $.data.notified_at }
          assert:
            - "receive: on_hand_qty == 7, available_qty == 7 (captured ${onhand}, ${avail})"
            - "subscription fired: status == NOTIFIED, notified_at == 2026-08-05T09:00:00Z (captured ${n_status}, ${n_at})"

      - name: endpoint_order_lifecycle_happy_path_versions
        claim_type: action_endpoint_side_effects
        grounds:
          - state_machines.Order
          - entities.Order.fields.version
        distinguishing_aspect: "Full happy path DRAFT(1) -> submit STOCK_RESERVED(2) -> ship SHIPPED(3) -> invoice pay keeps status SHIPPED but flips invoice_status PAID and bumps version(4); every mutation increments version by exactly 1."
        test_recipe:
          setup: ["warehouse ATL; account; product inventory 100; order qty 2"]
          setup_api_calls:
            - call: "POST /packaging-distribution/warehouses"
              payload: { code: "ATL", name: "Atlanta DC", zone: 2, ship_cutoff_time: "15:00", timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { wh_atl: $.data.id }
            - call: "POST /packaging-distribution/accounts"
              payload: { company_name: "Acme Corp", account_type: "CORPORATE", credit_limit_cents: 100000000, default_warehouse_code: "ATL" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /packaging-distribution/products"
              payload: { sku: "W-1", name: "W", category: "TAPE", base_price_cents: 100, uom: "EACH", case_qty: 1, pallet_qty: 10, weight_lbs_per_unit: 1, density_pcf: 20 }
              as: CatalogManager
              captures: { prod: $.data.id }
            - call: "POST /packaging-distribution/inventory"
              payload: { product_id: "${prod}", warehouse_id: "${wh_atl}", on_hand_qty: 100 }
              as: WarehouseOps
            - call: "POST /packaging-distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /packaging-distribution/orders"
              payload: { account_id: "${acct}", ship_zone: 5 }
              as: Buyer
              as_user_id: "${acct}"
              captures: { ord: $.data.id, v0: $.data.version }
            - call: "POST /packaging-distribution/orders/${ord}/lines"
              payload: { product_id: "${prod}", qty: 2 }
              as: Buyer
              as_user_id: "${acct}"
          trigger:
            - call: "POST /packaging-distribution/orders/${ord}/submit"
              payload: {}
              as: Buyer
              as_user_id: "${acct}"
              captures: { v1: $.data.version, s1: $.data.status }
            - call: "POST /packaging-distribution/orders/${ord}/ship"
              payload: {}
              as: WarehouseOps
              captures: { v2: $.data.version, s2: $.data.status }
            - call: "POST /packaging-distribution/orders/${ord}/invoice/pay"
              payload: {}
              as: AccountApprover
              as_user_id: "${acct}"
              captures: { v3: $.data.version, s3: $.data.status, i3: $.data.invoice_status }
          assert:
            - "versions: create 1, submit 2, ship 3, pay 4 (captured ${v0}, ${v1}, ${v2}, ${v3})"
            - "statuses: STOCK_RESERVED after submit, SHIPPED after ship, SHIPPED after pay (captured ${s1}, ${s2}, ${s3})"
            - "invoice_status == PAID after pay (captured ${i3})"

