    roles: [ProgramAdmin]
    code: 201
    input: [program_id, funder_id, committed_cents]
    output: FundingPool
    side_effects: ["status=PENDING", "disbursed_cents=0", "reserved_cents=0", "available_cents=committed_cents"]
  - method: GET
    path: "/funding-pools/{poolId}"
