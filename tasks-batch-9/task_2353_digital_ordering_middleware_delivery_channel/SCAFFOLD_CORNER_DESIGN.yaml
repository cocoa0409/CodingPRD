            - "The StoreOperator order attempt returns 403 ERR_UNAUTHORIZED and Store.${store_id}.reserved_prep_slots stays 1"
            - "The SettlementAnalyst adjustment with the identical body and the same ${om_v} succeeds: Adjustment.${adj_id}.state == DRAFT and proposed_by_user_id == analyst-1"
            - "Order.${om_id}.open_adjustment_count == 1 and refunded_total_cents == 0"

      - name: rbac_unknown_role_header_returns_401
        claim_type: role_header_validation
        grounds:
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Authentication is separated from authorization: an absent or undeclared X-Role yields 401 on both a read and a write, while a declared-but-wrong role on the same write yields 403."
        test_recipe:
          setup:
            - "MARKETMAX and a DRAFT menu version exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T16:00:00Z" }
              as: PlatformAdmin
            - call: "POST /channels"
              payload: { code: "MARKETMAX", name: "MarketMax", channel_type: "MARKETPLACE", markup_bps: 1500, rounding_mode: "NICKEL", service_fee_cents: 299, commission_bps: 2500, settlement_mode: "NET_MODE", eighty_six_policy: "HONOR_86", throttle_policy: "SUPPRESS_ON_THROTTLE", adjustment_review_mode: "CHANNEL_REVIEW", accepts_delivery: true }
              as: PlatformAdmin
              captures: { ch_mp_id: "$.data.id" }
            - call: "POST /menu-versions"
              payload: { brand_code: "BRD1", version_label: "2026-Q3-CORE" }
              as: PlatformAdmin
              captures: { mv_id: "$.data.id" }
          trigger:
            - call: "GET /channels/${ch_mp_id}"
              payload: {}
              as: MenuRobot
              captures: { err: "$.data.error_id" }
            - call: "POST /menu-versions/${mv_id}/finalize"
              payload: {}
              as: MenuRobot
            - call: "POST /menu-versions/${mv_id}/finalize"
              payload: {}
              as: ChannelPartner
              as_user_id: "${ch_mp_id}"
          assert:
            - "MenuRobot is not one of the five declared roles, so the read returns 401 with data.error_id == ERR_UNAUTHENTICATED rather than being silently downgraded to read-only"
            - "The same GET repeated with the X-Role header omitted entirely also returns 401 ERR_UNAUTHENTICATED"
            - "The undeclared-role finalize returns 401 ERR_UNAUTHENTICATED, while the declared-but-wrong ChannelPartner finalize returns 403 ERR_UNAUTHORIZED, separating authentication from authorization"
            - "MenuVersion.${mv_id}.state is still DRAFT after all of these calls"

      - name: rbac_store_operator_cannot_reach_another_store
        claim_type: Scope enforcement for entity-backed roles
        grounds:
          - roles[StoreOperator].identity
          - errors[ERR_FORBIDDEN_SCOPE]
        distinguishing_aspect: "Scope is checked against the acting entity id rather than the role name: the very same StoreOperator operation succeeds on its own store and fails with ERR_FORBIDDEN_SCOPE on a sibling store, and the same holds for a ChannelPartner reaching another channel's order."
