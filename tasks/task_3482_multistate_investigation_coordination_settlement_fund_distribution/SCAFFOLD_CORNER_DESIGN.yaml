            - "release response: status RELEASED, released_at == 2026-09-01T00:00:00Z"
            - "immediate GET: AllocationLine.${line_ca} shows disbursed_cents == 1000000, remaining_cents == 11937500, status == DISBURSING (cascade visible in the same logical instant)"
