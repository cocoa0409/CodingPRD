      - name: corner_equipment_sizing_selector_ranks_capacity_then_rent_then_created_at
        claim_type: weighted_scoring
        grounds:
          - calculations.equipment_sizing_selector
          - entities.Site.fields.recommended_model_id
          - endpoints[POST /ocs/sites/{site_id}/size-and-plan]
        distinguishing_aspect: "With six catalogued models the selector must reject the too-small brewer and the wrong-band brewer, then pick the SMALLEST sufficient capacity (30, not 60), break the capacity tie on the LOWEST monthly rent (3000, not 4500) and break the rent tie on the EARLIEST created_at - never on id."
        test_recipe:
          setup:
            - "clock at 2026-08-03T08:00:00Z; MON route; one COFFEE product"
            - "six models created in this order: TOO-SMALL (cap 20, rent 100, band 1-250), BIG-RENT (cap 30, rent 4500), TIE-EARLY (cap 30, rent 3000), TIE-LATE (cap 30, rent 3000), CAP-60 (cap 60, rent 2000), WRONG-BAND (cap 90, rent 500, band 200-400)"
            - "one account with one unplanned site at headcount 40, days_per_week 5, so required_peak_cups_per_hour will be 26"
          setup_api_calls:
            - call: "POST /ocs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ocs/routes"
              payload: { name: "Metro MON", service_day: "MON", capacity_minutes: 480, travel_buffer_minutes: 30 }
              as: ProgramAdmin
              captures: { route_id: "$.data.id" }
            - call: "POST /ocs/product-items"
              payload: { sku: "COF-HOUSE-12OZ", category: "COFFEE", base_unit_price_micros: 4500000, pack_units: 6, green_coffee_linked: true }
              as: ProgramAdmin
              captures: { p_cof_id: "$.data.id" }
            - call: "POST /ocs/equipment-models"
              payload: { model_code: "TOO-SMALL", brewer_class: "THERMAL", cups_per_hour_capacity: 20, min_headcount: 1, max_headcount: 250, monthly_rent_cents: 100, descale_interval_days: 90, list_value_cents: 40000 }
              as: ProgramAdmin
              captures: { m_small_id: "$.data.id" }
            - call: "POST /ocs/equipment-models"
              payload: { model_code: "BIG-RENT", brewer_class: "THERMAL", cups_per_hour_capacity: 30, min_headcount: 1, max_headcount: 250, monthly_rent_cents: 4500, descale_interval_days: 90, list_value_cents: 120000 }
              as: ProgramAdmin
              captures: { m_bigrent_id: "$.data.id" }
            - call: "POST /ocs/equipment-models"
              payload: { model_code: "TIE-EARLY", brewer_class: "THERMAL", cups_per_hour_capacity: 30, min_headcount: 1, max_headcount: 250, monthly_rent_cents: 3000, descale_interval_days: 90, list_value_cents: 110000 }
              as: ProgramAdmin
              captures: { m_early_id: "$.data.id" }
            - call: "POST /ocs/equipment-models"
              payload: { model_code: "TIE-LATE", brewer_class: "THERMAL", cups_per_hour_capacity: 30, min_headcount: 1, max_headcount: 250, monthly_rent_cents: 3000, descale_interval_days: 90, list_value_cents: 115000 }
              as: ProgramAdmin
              captures: { m_late_id: "$.data.id" }
            - call: "POST /ocs/equipment-models"
              payload: { model_code: "CAP-60", brewer_class: "AIRPOT", cups_per_hour_capacity: 60, min_headcount: 1, max_headcount: 250, monthly_rent_cents: 2000, descale_interval_days: 90, list_value_cents: 200000 }
              as: ProgramAdmin
              captures: { m_cap60_id: "$.data.id" }
            - call: "POST /ocs/equipment-models"
              payload: { model_code: "WRONG-BAND", brewer_class: "AIRPOT", cups_per_hour_capacity: 90, min_headcount: 200, max_headcount: 400, monthly_rent_cents: 500, descale_interval_days: 90, list_value_cents: 300000 }
              as: ProgramAdmin
              captures: { m_band_id: "$.data.id" }
            - call: "POST /ocs/accounts"
              payload: { legal_name: "Northgate Holdings LLC", billing_mode: "CONSOLIDATED", green_index_baseline_micros: 2000000, price_protection_days: 90 }
              as: AccountManager
              captures: { acct_id: "$.data.id" }
            - call: "POST /ocs/sites"
              payload: { account_id: "${acct_id}", route_id: "${route_id}", site_name: "HQ Floor 3", headcount: 40, days_per_week: 5, consumption_model: "HEADCOUNT_MODEL", service_minutes_estimate: 45 }
              as: AccountManager
              captures: { site_id: "$.data.id" }
          trigger:
            - call: "POST /ocs/sites/${site_id}/size-and-plan"
              payload: { brew_style: "DRIP" }
              as: AccountManager
          assert:
            - "the response is 2xx with required_peak_cups_per_hour == 26 and forecast_cups_per_week == 360"
            - "Site.${site_id}.recommended_model_id == ${m_early_id} (TIE-EARLY)"
            - "it is NOT ${m_small_id}: capacity 20 < 26 fails the eligibility filter even though its rent is the lowest in the catalog"
            - "it is NOT ${m_band_id}: headcount 40 is outside the 200-400 band even though its capacity is the largest"
            - "it is NOT ${m_cap60_id}: rank is capacity ASC, so a sufficient 30-cup brewer beats a cheaper 60-cup brewer"
            - "it is NOT ${m_bigrent_id}: within the capacity-30 tie the lower monthly_rent_cents wins"
            - "it is NOT ${m_late_id}: within the rent-3000 tie the earlier created_at wins, and the tie-break is created_at rather than id"
            - "EquipmentAsset availability is not part of the filter: the recommendation stands although no asset of TIE-EARLY has been registered"

      - name: corner_unreturned_asset_charge_stops_at_the_residual_floor
        claim_type: decay_function
        grounds:
          - calculations.unreturned_asset_charge
          - entities.EquipmentPlacement.fields.unreturned_billed_cents
          - endpoints[POST /ocs/consolidated-invoices]
        distinguishing_aspect: "A brewer 1428 days (47 whole months) in service would depreciate to 10000 - 47*150 == 2950 bps, but RESIDUAL_FLOOR_BPS clamps it at 3000, so the write-off is round_half_up(120000 * 3000 / 10000) == 36000 plus the 7500 trip fee == 43500, and the same 43500 is billed again a month later rather than decaying further."
        test_recipe:
          setup:
            - "clock at 2026-08-03T08:00:00Z; MON route; one COFFEE product; model URN-30 (list_value_cents 120000); one PLACEMENT asset"
            - "one CONSOLIDATED account with a planned site holding a LOAN placement (minimum_purchase_cents 90000, so no rent line ever appears and /evaluate-compliance is never called)"
            - "the account was cancelled with retrieval_due_by 2026-09-30T00:00:00Z and the brewer was never handed back; the clock is then moved to 2030-07-01T12:00:00Z, 1428 days after placement"
          setup_api_calls:
            - call: "POST /ocs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ocs/routes"
              payload: { name: "Metro MON", service_day: "MON", capacity_minutes: 480, travel_buffer_minutes: 30 }
              as: ProgramAdmin
              captures: { route_id: "$.data.id" }
            - call: "POST /ocs/product-items"
              payload: { sku: "COF-HOUSE-12OZ", category: "COFFEE", base_unit_price_micros: 4500000, pack_units: 6, green_coffee_linked: true }
              as: ProgramAdmin
              captures: { p_cof_id: "$.data.id" }
            - call: "POST /ocs/equipment-models"
              payload: { model_code: "URN-30", brewer_class: "THERMAL", cups_per_hour_capacity: 30, min_headcount: 1, max_headcount: 250, monthly_rent_cents: 4500, descale_interval_days: 90, list_value_cents: 120000 }
              as: ProgramAdmin
              captures: { model_id: "$.data.id" }
            - call: "POST /ocs/equipment-assets"
              payload: { model_id: "${model_id}", serial_number: "URN30-0001", asset_role: "PLACEMENT" }
              as: ProgramAdmin
              captures: { asset_id: "$.data.id" }
            - call: "POST /ocs/accounts"
              payload: { legal_name: "Northgate Holdings LLC", billing_mode: "CONSOLIDATED", green_index_baseline_micros: 2000000, price_protection_days: 90 }
              as: AccountManager
              captures: { acct_id: "$.data.id" }
            - call: "POST /ocs/sites"
              payload: { account_id: "${acct_id}", route_id: "${route_id}", site_name: "HQ Floor 3", headcount: 40, days_per_week: 5, consumption_model: "HEADCOUNT_MODEL", service_minutes_estimate: 45 }
              as: AccountManager
              captures: { site_id: "$.data.id" }
            - call: "POST /ocs/sites/${site_id}/size-and-plan"
              payload: { brew_style: "DRIP" }
              as: AccountManager
              captures: { site_v: "$.data.version" }
            - call: "POST /ocs/equipment-placements"
              payload: { site_id: "${site_id}", asset_id: "${asset_id}", terms_type: "LOAN", minimum_purchase_cents: 90000, min_term_months: 24, expected_site_version: "${site_v}" }
              as: AccountManager
              captures: { plc_id: "$.data.id" }
            - call: "POST /ocs/accounts/${acct_id}/cancel"
              payload: { cancel_reason: "Office closed permanently", retrieval_due_by: "2026-09-30T00:00:00Z" }
              as: AccountManager
            - call: "POST /ocs/_clock/set_current_utc"
              payload: { to_iso8601: "2030-07-01T12:00:00Z" }
              as: ProgramAdmin
            - call: "GET /ocs/accounts/${acct_id}"
              payload: {}
              as: BillingSpecialist
              captures: { acct_v: "$.data.version" }
          trigger:
            - call: "POST /ocs/consolidated-invoices"
              payload: { account_id: "${acct_id}", period_start: "2030-06-01T00:00:00Z", period_end: "2030-06-30T23:59:59Z", expected_account_version: "${acct_v}" }
              as: BillingSpecialist
              captures: { inv_id: "$.data.id" }
            - call: "GET /ocs/invoice-lines"
              payload: { invoice_id: "${inv_id}", line_type: "UNRETURNED_ASSET" }
              as: BillingSpecialist
              captures: { wo_line_id: "$.data[0].id" }
          assert:
            - "months_in_service == floor(1428 days / 30) == 47, so the uncapped depreciated_bps would be 10000 - 47 * 150 == 2950"
            - "the floor binds: depreciated_bps == 3000, asset_value_cents == round_half_up(120000 * 3000 / 10000) == 36000"
            - "the UNRETURNED_ASSET line amount_cents == 43500 (36000 + the 7500 RETRIEVAL_TRIP_FEE_CENTS) and EquipmentPlacement.${plc_id}.unreturned_billed_cents == 43500"
            - "the draft carries exactly two lines: the 43500 write-off plus a 2500 FREIGHT line, because pre_freight_total_cents == 43500 < 50000; total_cents == 46000 and line_count == 2"
            - "no RENT line exists (terms_type LOAN) and no SHORTFALL line exists (compliance_status is still MEETING_MINIMUM)"
            - "EquipmentPlacement.${plc_id}.placement_status == UNRETURNED_BILLED and EquipmentAsset.${asset_id}.asset_status == UNRETURNED"
            - "the floor is absorbing: a second draft for 2030-07 assembled at 2030-08-01 still charges 43500, not less"

