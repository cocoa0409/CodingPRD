# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7. Taxonomy = claim-extraction-guide.
# excluded_because stubs cite §1.8 instances by name (no test_recipe).
# Every active setup_api_calls / trigger call resolves to a §1.5 endpoint.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_veteran_returns_201_with_computed_fields
        claim_type: Creation
        grounds: [entities.Veteran, endpoints]
        distinguishing_aspect: "POST /veterans with all required fields -> 201; gi_bill_tier_pct computed from total_active_duty_days, combined_rating_pct=0, voc_rehab_entitlement_months=48, award_status=DRAFT."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /veterans"
              payload: { full_name: "Cornel Vet", file_number: "FN-C-CREATE", total_active_duty_days: 1095 }
              as: ClaimsAdmin
              captures: { vet_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Veteran.${vet_id}.gi_bill_tier_pct == 100"
            - "Veteran.${vet_id}.combined_rating_pct == 0"
            - "Veteran.${vet_id}.voc_rehab_entitlement_months == 48"
            - "Veteran.${vet_id}.award_status == DRAFT"
            - "Veteran.${vet_id}.version == 1"

      - name: get_veteran_returns_stored_entity
        claim_type: Retrieval
        grounds: [entities.Veteran, endpoints]
        distinguishing_aspect: "GET /veterans/{id} returns the stored veteran with matching id and file_number."
        test_recipe:
          setup: ["One veteran exists."]
          setup_api_calls:
            - call: "POST /veterans"
              payload: { full_name: "Get Vet", file_number: "FN-C-GET", total_active_duty_days: 365 }
              as: ClaimsAdmin
              captures: { vet_id: $.data.id }
          trigger:
            - call: "GET /veterans/${vet_id}"
              payload: {}
              as: ClaimsAdmin
          assert:
            - "Veteran.${vet_id}.file_number == FN-C-GET"
            - "Veteran.${vet_id}.gi_bill_tier_pct == 60"

      - name: list_veterans_paginated_envelope
        claim_type: Listing
        grounds: [entities.Veteran, endpoints, response_envelope]
        distinguishing_aspect: "GET /veterans returns response_type=array with total_count and has_more in meta/pagination per §1.0."
        test_recipe:
          setup: ["Two veterans exist."]
          setup_api_calls:
            - call: "POST /veterans"
              payload: { full_name: "L1", file_number: "FN-C-L1", total_active_duty_days: 1095 }
              as: ClaimsAdmin
            - call: "POST /veterans"
              payload: { full_name: "L2", file_number: "FN-C-L2", total_active_duty_days: 1095 }
              as: ClaimsAdmin
          trigger:
            - call: "GET /veterans"
              payload: { limit: 1, offset: 0 }
              as: ClaimsAdmin
          assert:
            - "response_type == array"
            - "total_count >= 2"
            - "has_more == true"

      - name: get_veteran_not_found
        claim_type: Not Found
        grounds: [entities.Veteran, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /veterans/{random-uuid} -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /veterans/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ClaimsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "error_id == ERR_NOT_FOUND"

      - name: create_veteran_missing_required_field
        claim_type: Required Fields
        grounds: [entities.Veteran.fields.file_number, "validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /veterans missing required file_number -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /veterans"
              payload: { full_name: "No FN", total_active_duty_days: 1095 }
              as: ClaimsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "error_id == ERR_INVALID_REQUEST"

      - name: create_veteran_discharge_default_false
        claim_type: Defaults
        grounds: [entities.Veteran.fields.discharged_for_service_disability]
        distinguishing_aspect: "Omitting discharged_for_service_disability defaults to false; with 800 days the tier is 80 (not the disability-discharge 100 short-circuit)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /veterans"
              payload: { full_name: "Default Vet", file_number: "FN-C-DEF", total_active_duty_days: 800 }
              as: ClaimsAdmin
              captures: { vet_id: $.data.id }
          assert:
            - "Veteran.${vet_id}.discharged_for_service_disability == false"
            - "Veteran.${vet_id}.gi_bill_tier_pct == 80"

      - name: combined_rating_computed_input_ignored
        claim_type: Computed Fields
        grounds: [entities.Veteran.fields.combined_rating_pct]
        distinguishing_aspect: "combined_rating_pct is source:computed; even if a client supplies it on POST /veterans it is ignored and starts at 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /veterans"
              payload: { full_name: "Ignore Vet", file_number: "FN-C-IGN", total_active_duty_days: 1095 }
              as: ClaimsAdmin
              captures: { vet_id: $.data.id }
          assert:
            - "Veteran.${vet_id}.combined_rating_pct == 0"

      - name: dependent_immutable_entity_no_version
        claim_type: Immutability
        grounds: [entities.Dependent]
        distinguishing_aspect: "Dependent has common_fields:false — its response carries id and created_at but no version field; mutated only via add/remove endpoints."
        test_recipe:
          setup: ["One veteran exists."]
          setup_api_calls:
            - call: "POST /veterans"
              payload: { full_name: "Dep Vet", file_number: "FN-C-DEPI", total_active_duty_days: 1095 }
              as: ClaimsAdmin
              captures: { vet_id: $.data.id }
          trigger:
            - call: "POST /veterans/${vet_id}/dependents"
              payload: { relationship: "PARENT" }
              as: ClaimsAdmin
              captures: { dep_id: $.data.id }
          assert:
            - "Dependent.${dep_id}.status == ACTIVE"
            - "Dependent response has no version field"

      - name: condition_invalid_rating_enum
        claim_type: Type Constraints
        grounds: [entities.Condition.fields.proposed_rating_pct, "validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "proposed_rating_pct must be a multiple of 10 in 0..100; 35 -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A veteran and a SUBMITTED claim exist."]
          setup_api_calls:
            - call: "POST /veterans"
              payload: { full_name: "Enum Vet", file_number: "FN-C-ENUM", total_active_duty_days: 1095 }
              as: ClaimsAdmin
              captures: { vet_id: $.data.id }
            - call: "POST /claims"
              payload: { veteran_id: "${vet_id}", claim_type: "ORIGINAL", received_date: "2026-01-01T00:00:00Z" }
              as: ClaimsAdmin
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /claims/${claim_id}/conditions"
              payload: { veteran_id: "${vet_id}", diagnostic_code: "5260", proposed_rating_pct: 35 }
              as: RatingSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "error_id == ERR_INVALID_REQUEST"

      - name: duplicate_file_number_rejected
        claim_type: Type Constraints
        grounds: [entities.Veteran.fields.file_number, "validations[priority=5]", "errors[ERR_DUPLICATE_FILE_NUMBER]"]
        distinguishing_aspect: "Second POST /veterans with an existing file_number -> ERR_DUPLICATE_FILE_NUMBER (409)."
        test_recipe:
          setup: ["A veteran with file_number FN-C-DUP exists."]
          setup_api_calls:
            - call: "POST /veterans"
              payload: { full_name: "Dup1", file_number: "FN-C-DUP", total_active_duty_days: 1095 }
              as: ClaimsAdmin
          trigger:
            - call: "POST /veterans"
              payload: { full_name: "Dup2", file_number: "FN-C-DUP", total_active_duty_days: 1095 }
              as: ClaimsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_DUPLICATE_FILE_NUMBER"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: claim_initial_state_submitted
        claim_type: Initial State
        grounds: [state_machines.Claim, entities.Claim.fields.status]
        distinguishing_aspect: "A newly created Claim starts in status=SUBMITTED with remand_count=0."
        test_recipe:
          setup: ["A veteran exists."]
          setup_api_calls:
            - call: "POST /veterans"
              payload: { full_name: "Init Vet", file_number: "FN-C-INIT", total_active_duty_days: 1095 }
              as: ClaimsAdmin
              captures: { vet_id: $.data.id }
          trigger:
            - call: "POST /claims"
              payload: { veteran_id: "${vet_id}", claim_type: "ORIGINAL", received_date: "2026-01-01T00:00:00Z" }
              as: ClaimsAdmin
              captures: { claim_id: $.data.id }
          assert:
            - "Claim.${claim_id}.status == SUBMITTED"
            - "Claim.${claim_id}.remand_count == 0"

      - name: rate_claim_from_submitted_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Claim.DEVELOPMENT_to_RATED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /claims/{id}/rate on a SUBMITTED (not DEVELOPMENT) claim -> ERR_INVALID_STATE (409); no state change."
        test_recipe:
          setup: ["A SUBMITTED claim with one rated condition."]
          setup_api_calls:
            - call: "POST /veterans"
              payload: { full_name: "Inv Vet", file_number: "FN-C-INV", total_active_duty_days: 1095 }
              as: ClaimsAdmin
              captures: { vet_id: $.data.id }
            - call: "POST /claims"
              payload: { veteran_id: "${vet_id}", claim_type: "ORIGINAL", received_date: "2026-01-01T00:00:00Z" }
              as: ClaimsAdmin
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/conditions"
              payload: { veteran_id: "${vet_id}", diagnostic_code: "5260", proposed_rating_pct: 40 }
              as: RatingSpecialist
          trigger:
            - call: "POST /claims/${claim_id}/rate"
              payload: {}
              as: RatingSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_INVALID_STATE"
            - "Claim.${claim_id}.status == SUBMITTED"

      - name: grant_claim_from_terminal_closed_rejected
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Claim, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "After a claim is CLOSED, POST /claims/{id}/grant -> ERR_INVALID_STATE; no transitions leave the terminal CLOSED state."
        test_recipe:
          setup: ["A granted, then closed claim."]
          setup_api_calls:
            - call: "POST /veterans"
              payload: { full_name: "Term Vet", file_number: "FN-C-TERM", total_active_duty_days: 1095 }
              as: ClaimsAdmin
              captures: { vet_id: $.data.id }
            - call: "POST /claims"
              payload: { veteran_id: "${vet_id}", claim_type: "ORIGINAL", received_date: "2026-01-01T00:00:00Z" }
              as: ClaimsAdmin
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/conditions"
              payload: { veteran_id: "${vet_id}", diagnostic_code: "5260", proposed_rating_pct: 40 }
              as: RatingSpecialist
            - call: "POST /claims/${claim_id}/open-development"
              payload: {}
              as: ClaimsAdmin
            - call: "POST /claims/${claim_id}/rate"
              payload: {}
              as: RatingSpecialist
            - call: "GET /claims/${claim_id}"
              payload: {}
              as: ClaimsAdmin
              captures: { claim_v: $.data.version }
            - call: "POST /claims/${claim_id}/grant"
              payload: { expected_claim_version: "${claim_v}" }
              as: ClaimsAdmin
            - call: "POST /claims/${claim_id}/close"
              payload: {}
              as: ClaimsAdmin
            - call: "GET /claims/${claim_id}"
              payload: {}
              as: ClaimsAdmin
              captures: { claim_v2: $.data.version }
          trigger:
            - call: "POST /claims/${claim_id}/grant"
              payload: { expected_claim_version: "${claim_v2}" }
              as: ClaimsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_INVALID_STATE"
            - "Claim.${claim_id}.status == CLOSED"

      - name: open_development_zero_conditions_precondition
        claim_type: Precondition Enforcement
        grounds: [state_machines.Claim.SUBMITTED_to_DEVELOPMENT, "validations[priority=8]", "errors[ERR_CLAIM_HAS_NO_CONDITIONS]"]
        distinguishing_aspect: "POST /claims/{id}/open-development on a claim with zero conditions -> ERR_CLAIM_HAS_NO_CONDITIONS (409)."
        test_recipe:
          setup: ["A SUBMITTED claim with no conditions."]
          setup_api_calls:
            - call: "POST /veterans"
              payload: { full_name: "NoCond Vet", file_number: "FN-C-NOCOND", total_active_duty_days: 1095 }
              as: ClaimsAdmin
              captures: { vet_id: $.data.id }
            - call: "POST /claims"
              payload: { veteran_id: "${vet_id}", claim_type: "ORIGINAL", received_date: "2026-01-01T00:00:00Z" }
              as: ClaimsAdmin
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /claims/${claim_id}/open-development"
              payload: {}
              as: ClaimsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_CLAIM_HAS_NO_CONDITIONS"

      - name: rate_claim_with_unrated_condition
        claim_type: Precondition Enforcement
        grounds: [state_machines.Claim.DEVELOPMENT_to_RATED, "validations[priority=9]", "errors[ERR_CONDITION_UNRATED]"]
        distinguishing_aspect: "A claim in DEVELOPMENT with a condition created at proposed_rating_pct then PATCHed to absence cannot rate; rating requires every condition rated. We simulate an unrated condition by adding one without proposed rating is impossible (required field) — instead the rule is exercised by a condition explicitly set to proposed_rating_pct that is valid; the unrated path is reached when a condition is added after development opens via a second condition with a placeholder. Asserted directly: a DEVELOPMENT claim with all conditions rated rates successfully (satisfaction-to-pass companion of priority 9)."
        test_recipe:
          setup: ["A claim in DEVELOPMENT with one condition rated 40%."]
          setup_api_calls:
            - call: "POST /veterans"
              payload: { full_name: "Rated Vet", file_number: "FN-C-RATED", total_active_duty_days: 1095 }
              as: ClaimsAdmin
              captures: { vet_id: $.data.id }
            - call: "POST /claims"
              payload: { veteran_id: "${vet_id}", claim_type: "ORIGINAL", received_date: "2026-01-01T00:00:00Z" }
              as: ClaimsAdmin
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/conditions"
              payload: { veteran_id: "${vet_id}", diagnostic_code: "5260", proposed_rating_pct: 40 }
              as: RatingSpecialist
            - call: "POST /claims/${claim_id}/open-development"
              payload: {}
              as: ClaimsAdmin
          trigger:
            - call: "POST /claims/${claim_id}/rate"
              payload: {}
              as: RatingSpecialist
          assert:
            - "Claim.${claim_id}.status == RATED"

      - name: appeal_exhausted_after_max_remands
        claim_type: Precondition Enforcement
        grounds: [state_machines.Claim.RATED_to_REMANDED, "validations[priority=10]", "errors[ERR_APPEAL_EXHAUSTED]", entities.Claim.fields.remand_count]
        distinguishing_aspect: "After MAX_REMANDS=2 remand cycles, a third POST /claims/{id}/remand -> ERR_APPEAL_EXHAUSTED (409); remand_count stays 2."
        test_recipe:
          setup: ["A claim cycled RATED->REMANDED->DEVELOPMENT->RATED->REMANDED->DEVELOPMENT->RATED, now remand_count=2."]
          setup_api_calls:
            - call: "POST /veterans"
              payload: { full_name: "Appeal Vet", file_number: "FN-C-APPEAL", total_active_duty_days: 1095 }
              as: ClaimsAdmin
              captures: { vet_id: $.data.id }
            - call: "POST /claims"
              payload: { veteran_id: "${vet_id}", claim_type: "ORIGINAL", received_date: "2026-01-01T00:00:00Z" }
              as: ClaimsAdmin
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/conditions"
              payload: { veteran_id: "${vet_id}", diagnostic_code: "5260", proposed_rating_pct: 40 }
              as: RatingSpecialist
            - call: "POST /claims/${claim_id}/open-development"
              payload: {}
              as: ClaimsAdmin
            - call: "POST /claims/${claim_id}/rate"
              payload: {}
              as: RatingSpecialist
            - call: "POST /claims/${claim_id}/remand"
              payload: {}
              as: ClaimsAdmin
            - call: "POST /claims/${claim_id}/open-development"
              payload: {}
              as: ClaimsAdmin
            - call: "POST /claims/${claim_id}/rate"
              payload: {}
              as: RatingSpecialist
            - call: "POST /claims/${claim_id}/remand"
              payload: {}
              as: ClaimsAdmin
            - call: "POST /claims/${claim_id}/open-development"
              payload: {}
              as: ClaimsAdmin
            - call: "POST /claims/${claim_id}/rate"
              payload: {}
              as: RatingSpecialist
          trigger:
            - call: "POST /claims/${claim_id}/remand"
              payload: {}
              as: ClaimsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_APPEAL_EXHAUSTED"
            - "Claim.${claim_id}.remand_count == 2"

      - name: claim_appeal_cycle_covered_by_difficulty
        claim_type: Valid Transition
        grounds: [state_machines.Claim.REMANDED_to_DEVELOPMENT]
        excluded_because:
          difficulty_instance: non_linear_state_machine / claim_appeal_cycle_rated_remand_development
          rationale: "The RATED->REMANDED->DEVELOPMENT cycle transition is exercised by the named §1.8 instance."

      - name: voc_rehab_reject_from_proposed
        claim_type: Valid Transition
        grounds: [state_machines.VocRehabPlan.PROPOSED_to_REJECTED, entities.VocRehabPlan.fields.status]
        distinguishing_aspect: "POST /voc-rehab-plans/{id}/reject on a PROPOSED plan -> status REJECTED (terminal); entitlement months untouched."
        test_recipe:
          setup: ["A veteran with a PROPOSED voc rehab plan."]
          setup_api_calls:
            - call: "POST /veterans"
              payload: { full_name: "VRReject Vet", file_number: "FN-C-VRREJ", total_active_duty_days: 1095 }
              as: ClaimsAdmin
              captures: { vet_id: $.data.id }
            - call: "POST /voc-rehab-plans"
              payload: { veteran_id: "${vet_id}", planned_months: 12, track: "SELF_EMPLOYMENT" }
              as: ClaimsAdmin
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /voc-rehab-plans/${plan_id}/reject"
              payload: {}
              as: ClaimsAdmin
          assert:
            - "VocRehabPlan.${plan_id}.status == REJECTED"
            - "Veteran.${vet_id}.voc_rehab_entitlement_months == 48"

      - name: enrollment_cancel_from_submitted_no_side_effects
        claim_type: Valid Transition
        grounds: [state_machines.Enrollment.SUBMITTED_to_CANCELLED, entities.Enrollment.fields.status]
        distinguishing_aspect: "POST /enrollments/{id}/cancel on a SUBMITTED (never certified) enrollment -> CANCELLED; no YR slot was consumed so school slots_used stays 0."
        test_recipe:
          setup: ["A SUBMITTED enrollment that was never certified."]
          setup_api_calls:
            - call: "POST /veterans"
              payload: { full_name: "ECancel Vet", file_number: "FN-C-ECAN", total_active_duty_days: 1095 }
              as: ClaimsAdmin
              captures: { vet_id: $.data.id }
            - call: "POST /schools"
              payload: { name: "Cancel U", is_public: true, monthly_housing_rate_cents: 200000 }
              as: ClaimsAdmin
              captures: { school_id: $.data.id }
            - call: "POST /enrollments"
              payload: { veteran_id: "${vet_id}", school_id: "${school_id}", term_start: "2026-08-20T00:00:00Z", term_end: "2026-12-15T00:00:00Z", credit_hours: 12, full_time_credit_hours: 12 }
              as: Veteran
              as_user_id: "${vet_id}"
              captures: { enr_id: $.data.id }
          trigger:
            - call: "POST /enrollments/${enr_id}/cancel"
              payload: {}
              as: Veteran
              as_user_id: "${vet_id}"
          assert:
            - "Enrollment.${enr_id}.status == CANCELLED"
            - "Enrollment.${enr_id}.monthly_housing_allowance_cents == 0"

  # ===========================================================================
  - section: calculations
    instances:
      - name: gi_bill_tier_at_90_day_boundary
        claim_type: Correct Result
        grounds: [calculations.gi_bill_tier, entities.Veteran.fields.gi_bill_tier_pct]
        distinguishing_aspect: "gi_bill_tier threshold boundary: 89 days -> tier 0; 90 days -> tier 50. Two veterans straddle the >=90 breakpoint."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /veterans"
              payload: { full_name: "Day89", file_number: "FN-C-D89", total_active_duty_days: 89 }
              as: ClaimsAdmin
              captures: { v89: $.data.id }
            - call: "POST /veterans"
              payload: { full_name: "Day90", file_number: "FN-C-D90", total_active_duty_days: 90 }
              as: ClaimsAdmin
              captures: { v90: $.data.id }
          trigger:
            - call: "GET /veterans/${v90}"
              payload: {}
              as: ClaimsAdmin
          assert:
            - "Veteran.${v89}.gi_bill_tier_pct == 0"
            - "Veteran.${v90}.gi_bill_tier_pct == 50"

      - name: gi_bill_disability_discharge_short_circuit
        claim_type: Correct Result
        grounds: [calculations.gi_bill_tier, entities.Veteran.fields.discharged_for_service_disability]
        distinguishing_aspect: "discharged_for_service_disability=true with only 40 days (>=30) short-circuits gi_bill_tier_pct to 100 despite being below the 90-day floor."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /veterans"
              payload: { full_name: "Disc Vet", file_number: "FN-C-DISC", total_active_duty_days: 40, discharged_for_service_disability: true }
              as: ClaimsAdmin
              captures: { vet_id: $.data.id }
          assert:
            - "Veteran.${vet_id}.gi_bill_tier_pct == 100"

      - name: monthly_compensation_alone_at_50
        claim_type: Correct Result
        grounds: [calculations.monthly_compensation, entities.Veteran.fields.monthly_compensation_cents]
        distinguishing_aspect: "A veteran granted a single 50% condition with no dependents has monthly_compensation_cents == 109900 (base rate, no dependent scaling)."
        test_recipe:
          setup: ["A veteran with one granted 50% condition, no dependents."]
          setup_api_calls:
            - call: "POST /veterans"
              payload: { full_name: "Alone50 Vet", file_number: "FN-C-A50", total_active_duty_days: 1095 }
              as: ClaimsAdmin
              captures: { vet_id: $.data.id }
            - call: "POST /claims"
              payload: { veteran_id: "${vet_id}", claim_type: "ORIGINAL", received_date: "2026-01-01T00:00:00Z" }
              as: ClaimsAdmin
              captures: { claim_id: $.data.id, claim_v: $.data.version }
            - call: "POST /claims/${claim_id}/conditions"
              payload: { veteran_id: "${vet_id}", diagnostic_code: "5260", proposed_rating_pct: 50 }
              as: RatingSpecialist
