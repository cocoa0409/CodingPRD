# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 1896 Food Ingredient Sourcing & Specification Management
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 elements and is replayable
# from empty-DB via §1.5 endpoints only.
# =============================================================================

scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: coa_deviation_score_provisional_vs_final_diverge
        grounds:
          - calculations.coa_deviation_score
          - state_machines.CertificateOfAnalysis.REGISTERED_to_UNDER_REVIEW
          - state_machines.CertificateOfAnalysis.UNDER_REVIEW_to_ACCEPTED
        distinguishing_aspect: |
          Dual variant on the CertificateOfAnalysis domain: identical finding
          set yields provisional 120.00 (moisture weighted MAJOR=2) vs final
          105.00 (moisture DOWNGRADED_TO_MINOR weighted 1); the variant switch
          is driven by finding disposition, not input data.
        test_recipe:
          setup:
            - "Ingredient ENZ with EFFECTIVE spec (params: moisture MAJOR 0..8 target 4, purity CRITICAL 95..100 target 97)"
            - "Supplier SUP QUALIFIED; ApprovedSource ACTIVE with both CURRENT declarations valid 2026-01-01..2027-01-01"
            - "ACTIVE contract (window 2026-01-01..2027-01-01, index_base 200, pass 0.6, committed 60000)"
            - "Clock at 2026-08-01T00:00:00Z (default)"
            - "CoA lot L1: moisture 9.2, purity 93.5 (two findings), registered by sqe-1"
          setup_api_calls:
            - call: "POST /sourcing/ingredients"
              payload: { ingredient_code: "ENZ-1", name: "Enzyme One", allergen_profile: ["NONE"], requires_dual_source: false }
              as: ProcurementManager
              captures: { ing_id: $.data.id, ing_v: $.data.version }
            - call: "POST /sourcing/ingredients/${ing_id}/specs"
              payload: { spec_version_label: "v1", effective_date: "2026-07-01T00:00:00Z", version_note: "initial spec version", expected_ingredient_version: "${ing_v}" }
              as: SpecAuthor
              as_user_id: author-1
              captures: { spec_id: $.data.id }
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/parameters"
              payload: { parameter_name: "moisture", criticality: "MAJOR", uom: "percent", target_value: 4, min_value: 0, max_value: 8 }
              as: SpecAuthor
              as_user_id: author-1
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/parameters"
              payload: { parameter_name: "purity", criticality: "CRITICAL", uom: "percent", target_value: 97, min_value: 95, max_value: 100 }
              as: SpecAuthor
              as_user_id: author-1
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/submit"
              payload: {}
              as: SpecAuthor
              as_user_id: author-1
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/approve"
              payload: {}
              as: QualityManager
              as_user_id: qm-1
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/make-effective"
              payload: {}
              as: QualityManager
              as_user_id: qm-1
            - call: "POST /sourcing/suppliers"
              payload: { supplier_code: "SUP-1", legal_name: "Supplier One", risk_tier: "TIER_B", country_of_operation: "US" }
              as: ProcurementManager
              captures: { sup_id: $.data.id }
            - call: "POST /sourcing/suppliers/${sup_id}/qualifications"
              payload: { questionnaire_score: 85, document_pack_complete: true }
              as: SupplierQualityEngineer
              as_user_id: sqe-1
              captures: { qual_id: $.data.id }
            - call: "POST /sourcing/suppliers/${sup_id}/qualifications/${qual_id}/evaluate"
              payload: {}
              as: QualityManager
              as_user_id: qm-1
            - call: "POST /sourcing/suppliers/${sup_id}/qualifications/${qual_id}/decide"
              payload: { decision: "APPROVE", decision_note: "all criteria satisfied" }
              as: QualityManager
              as_user_id: qm-1
            - call: "GET /sourcing/ingredients/${ing_id}"
              payload: {}
              as: ProcurementManager
              captures: { ing_v2: $.data.version }
            - call: "POST /sourcing/ingredients/${ing_id}/approved-sources"
              payload: { supplier_id: "${sup_id}", pinned_spec_id: "${spec_id}", expected_ingredient_version: "${ing_v2}" }
              as: ProcurementManager
              captures: { src_id: $.data.id, src_v: $.data.version }
            - call: "POST /sourcing/approved-sources/${src_id}/declarations"
              payload: { declaration_type: "ALLERGEN", payload: { allergen_tags: ["NONE"] }, valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z" }
              as: RegulatoryAffairs
            - call: "POST /sourcing/approved-sources/${src_id}/declarations"
              payload: { declaration_type: "COUNTRY_OF_ORIGIN", payload: { country_codes: ["US"], primary_country: "US" }, valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z" }
              as: RegulatoryAffairs
            - call: "POST /sourcing/ingredients/${ing_id}/approved-sources/${src_id}/activate"
              payload: {}
              as: ProcurementManager
            - call: "POST /sourcing/approved-sources/${src_id}/contracts"
              payload: { annual_committed_volume_kg: 60000, index_base_value: 200, index_pass_through_pct: 0.6, window_start: "2026-01-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z", expected_approved_source_version: "${src_v}" }
              as: ProcurementManager
              captures: { ctr_id: $.data.id }
            - call: "POST /sourcing/approved-sources/${src_id}/contracts/${ctr_id}/activate"
              payload: {}
              as: ProcurementManager
            - call: "POST /sourcing/approved-sources/${src_id}/coas"
              payload: { contract_id: "${ctr_id}", lot_number: "L1", shipped_qty_kg: 1000, received_at: "2026-08-01T00:00:00Z", measured_values: [ { parameter_name: "moisture", observed_value: 9.2 }, { parameter_name: "purity", observed_value: 93.5 } ] }
              as: SupplierQualityEngineer
              as_user_id: sqe-1
              captures: { coa_id: $.data.id }
            - call: "POST /sourcing/approved-sources/${src_id}/coas/${coa_id}/start-review"
              payload: {}
              as: QualityManager
              as_user_id: qm-1
              captures: { prov_score: $.data.provisional_deviation_score }
            - call: "GET /sourcing/approved-sources/${src_id}/coas/${coa_id}/findings"
              payload: {}
              as: QualityManager
              captures: { moist_f: "$.data[0].id", pur_f: "$.data[1].id" }
            - call: "POST /sourcing/approved-sources/${src_id}/coas/${coa_id}/findings/${moist_f}/disposition"
              payload: { disposition: "DOWNGRADED_TO_MINOR", disposition_note: "minor practical impact" }
              as: QualityManager
              as_user_id: qm-1
            - call: "POST /sourcing/approved-sources/${src_id}/coas/${coa_id}/findings/${pur_f}/disposition"
              payload: { disposition: "ACCEPT_AS_IS", disposition_note: "customer waiver on file" }
              as: QualityManager
              as_user_id: qm-1
          trigger:
            - call: "POST /sourcing/approved-sources/${src_id}/coas/${coa_id}/close-review"
              payload: { outcome: "ACCEPT" }
              as: QualityManager
              as_user_id: qm-2
              captures: { final_score: $.data.final_deviation_score, coa_status: $.data.status }
          assert:
            - "provisional_deviation_score == 120.00 (moisture 0.1500x2 + purity 0.3000x3 = 1.2 x 100)"
            - "final_deviation_score == 105.00 (moisture downgraded 0.1500x1 + purity 0.3000x3 = 1.05 x 100)"
            - "provisional_deviation_score != final_deviation_score for identical measured_values"
            - "CoA.status == CONDITIONALLY_ACCEPTED (one ACCEPT_AS_IS finding)"

      - name: annual_rebate_dual_variant_low_vs_high_rate
        grounds:
          - calculations.annual_rebate
          - entities.CertificateOfAnalysis.fields.unit_price_applied
        distinguishing_aspect: |
          Dual variant on the SupplyContract (fiscal) domain — a different
          entity domain than the CoA quality score: the same contract's rebate
          is computed at 1.5% while accepted_value_total < 250000 and at 2.0%
          once the aggregate crosses, and the rate flip re-prices ALL lines
          (first read: 3375.00 at 225000; after two more lots: 5040.00 at
          252000 — not 3375.00 + increments at the old rate).
        test_recipe:
          setup:
            - "Ingredient GUM-1 with EFFECTIVE spec (single param moisture MINOR 0..10 target 5), QUALIFIED supplier, ACTIVE source with declarations valid 2026-01-01..2027-01-01"
            - "Contract: index_base 100, pass 0.5, window 2026-01-01..2027-01-01, committed 100000, ACTIVE"
            - "Index observation INGREDIENT-SPOT 2026-06-01 value 100 => adjustment factor exactly 1.0, tier-1 unit price 4.5000"
          setup_api_calls:
            - call: "POST /sourcing/ingredients"
              payload: { ingredient_code: "GUM-1", name: "Gum One", allergen_profile: ["NONE"], requires_dual_source: false }
              as: ProcurementManager
              captures: { ing_id: $.data.id, ing_v: $.data.version }
            - call: "POST /sourcing/ingredients/${ing_id}/specs"
              payload: { spec_version_label: "v1", effective_date: "2026-07-01T00:00:00Z", version_note: "initial spec version", expected_ingredient_version: "${ing_v}" }
              as: SpecAuthor
              as_user_id: author-1
              captures: { spec_id: $.data.id }
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/parameters"
              payload: { parameter_name: "moisture", criticality: "MINOR", uom: "percent", target_value: 5, min_value: 0, max_value: 10 }
              as: SpecAuthor
              as_user_id: author-1
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/submit"
              payload: {}
              as: SpecAuthor
              as_user_id: author-1
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/approve"
              payload: {}
              as: QualityManager
              as_user_id: qm-1
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/make-effective"
              payload: {}
              as: QualityManager
              as_user_id: qm-1
            - call: "POST /sourcing/price-index-observations"
              payload: { index_name: "INGREDIENT-SPOT", observed_at: "2026-06-01T00:00:00Z", index_value: 100 }
              as: PlatformAdmin
            - call: "POST /sourcing/suppliers"
              payload: { supplier_code: "SUP-A", legal_name: "Supplier A", risk_tier: "TIER_A", country_of_operation: "US" }
              as: ProcurementManager
              captures: { supa_id: $.data.id }
            - call: "POST /sourcing/suppliers/${supa_id}/qualifications"
              payload: { questionnaire_score: 90, document_pack_complete: true }
              as: SupplierQualityEngineer
              as_user_id: sqe-1
              captures: { quala_id: $.data.id }
            - call: "POST /sourcing/suppliers/${supa_id}/qualifications/${quala_id}/evaluate"
              payload: {}
              as: QualityManager
              as_user_id: qm-1
            - call: "POST /sourcing/suppliers/${supa_id}/qualifications/${quala_id}/decide"
              payload: { decision: "APPROVE", decision_note: "qualification approved" }
              as: QualityManager
              as_user_id: qm-1
            - call: "GET /sourcing/ingredients/${ing_id}"
              payload: {}
              as: ProcurementManager
              captures: { ing_v2: $.data.version }
            - call: "POST /sourcing/ingredients/${ing_id}/approved-sources"
              payload: { supplier_id: "${supa_id}", pinned_spec_id: "${spec_id}", expected_ingredient_version: "${ing_v2}" }
              as: ProcurementManager
              captures: { srca_id: $.data.id, srca_v: $.data.version }
            - call: "POST /sourcing/approved-sources/${srca_id}/declarations"
              payload: { declaration_type: "ALLERGEN", payload: { allergen_tags: ["NONE"] }, valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z" }
              as: RegulatoryAffairs
            - call: "POST /sourcing/approved-sources/${srca_id}/declarations"
              payload: { declaration_type: "COUNTRY_OF_ORIGIN", payload: { country_codes: ["US"], primary_country: "US" }, valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z" }
              as: RegulatoryAffairs
            - call: "POST /sourcing/ingredients/${ing_id}/approved-sources/${srca_id}/activate"
              payload: {}
              as: ProcurementManager
            - call: "POST /sourcing/approved-sources/${srca_id}/contracts"
              payload: { annual_committed_volume_kg: 100000, index_base_value: 100, index_pass_through_pct: 0.5, window_start: "2026-01-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z", expected_approved_source_version: "${srca_v}" }
              as: ProcurementManager
              captures: { ctra_id: $.data.id }
            - call: "POST /sourcing/approved-sources/${srca_id}/contracts/${ctra_id}/activate"
              payload: {}
              as: ProcurementManager
            - call: "POST /sourcing/approved-sources/${srca_id}/coas"
              payload: { contract_id: "${ctra_id}", lot_number: "R1", shipped_qty_kg: 50000, received_at: "2026-07-02T00:00:00Z", measured_values: [ { parameter_name: "moisture", observed_value: 5 } ] }
              as: SupplierQualityEngineer
              as_user_id: sqe-1
              captures: { r1: $.data.id }
            - call: "POST /sourcing/approved-sources/${srca_id}/coas/${r1}/start-review"
              payload: {}
              as: QualityManager
              as_user_id: qm-1
            - call: "POST /sourcing/approved-sources/${srca_id}/coas/${r1}/close-review"
              payload: { outcome: "ACCEPT" }
              as: QualityManager
              as_user_id: qm-1
            - call: "GET /sourcing/approved-sources/${srca_id}/contracts/${ctra_id}/rebate"
              payload: {}
              as: ProcurementManager
              captures: { rate_lo: $.data.rebate_rate, tot_lo: $.data.total_rebate }
            - call: "POST /sourcing/approved-sources/${srca_id}/coas"
              payload: { contract_id: "${ctra_id}", lot_number: "R2", shipped_qty_kg: 5000, received_at: "2026-07-03T00:00:00Z", measured_values: [ { parameter_name: "moisture", observed_value: 5 } ] }
              as: SupplierQualityEngineer
              as_user_id: sqe-1
              captures: { r2: $.data.id }
            - call: "POST /sourcing/approved-sources/${srca_id}/coas/${r2}/start-review"
              payload: {}
              as: QualityManager
              as_user_id: qm-1
            - call: "POST /sourcing/approved-sources/${srca_id}/coas/${r2}/close-review"
              payload: { outcome: "ACCEPT" }
              as: QualityManager
              as_user_id: qm-1
            - call: "POST /sourcing/approved-sources/${srca_id}/coas"
              payload: { contract_id: "${ctra_id}", lot_number: "R3", shipped_qty_kg: 1000, received_at: "2026-07-04T00:00:00Z", measured_values: [ { parameter_name: "moisture", observed_value: 5 } ] }
              as: SupplierQualityEngineer
              as_user_id: sqe-1
              captures: { r3: $.data.id }
            - call: "POST /sourcing/approved-sources/${srca_id}/coas/${r3}/start-review"
              payload: {}
              as: QualityManager
              as_user_id: qm-1
            - call: "POST /sourcing/approved-sources/${srca_id}/coas/${r3}/close-review"
              payload: { outcome: "ACCEPT" }
              as: QualityManager
              as_user_id: qm-1
          trigger:
            - call: "GET /sourcing/approved-sources/${srca_id}/contracts/${ctra_id}/rebate"
              payload: {}
              as: ProcurementManager
              captures: { rate_hi: $.data.rebate_rate, tot_hi: $.data.total_rebate, lines: $.data.line_count }
          assert:
            - "After lot R1 (50000 kg x 4.5000 = 225000 accepted value): rebate_rate == 0.015 and total_rebate == 3375.00"
            - "After R2 (22500) + R3 (4500): accepted_value_total == 252000 >= 250000 flips the variant"
            - "Second read: rebate_rate == 0.02; total_rebate == 4500.00 + 450.00 + 90.00 == 5040.00 (rate re-prices ALL lines, not just new ones); line_count == 3"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes a/b/c)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: contract_tier_price_straddling_with_index_adjustment
        grounds:
          - calculations.contract_tier_price
          - entities.SupplyContract.fields.cumulative_shipped_kg
        distinguishing_aspect: |
          Mode (a): tiered-rate selection with 4+ inputs (prior_kg, lot_kg,
          index levels, pass-through) and a non-linear tier-straddle: an
          8000 kg lot at prior 46000 kg splits 4000 kg at adjusted tier-2
          4.4268 and 4000 kg at adjusted tier-3 4.1633, yielding blended
          unit_price_applied 4.2951 — pure tier-2 pricing would give 4.4268.
        test_recipe:
          setup:
            - "Ingredient EFFECTIVE spec (param moisture MINOR 0..10 target 5), QUALIFIED supplier, ACTIVE source with declarations"
            - "Contract: index_base 200, pass 0.6, window 2026-01-01..2027-01-01, committed 60000, ACTIVE"
            - "Index observation INGREDIENT-SPOT 2026-07-01 value 218 (factor 1 + 0.6*18/200 = 1.054)"
            - "cumulative_shipped_kg pre-loaded to 46000 via three accepted lots of 10000 + 10000 + 26000 kg (each accepted with in-spec moisture 5)"
          setup_api_calls:
            - call: "POST /sourcing/ingredients"
              payload: { ingredient_code: "PROT-1", name: "Protein One", allergen_profile: ["MILK"], requires_dual_source: false }
              as: ProcurementManager
              captures: { ing_id: $.data.id, ing_v: $.data.version }
