      - name: corner_panel_sequence_and_uniqueness_violations_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_25_ERR_PANEL_SEQUENCE_INVALID
          - entities.MapPanel.revision_sequence
        distinguishing_aspect: "One rule covers three distinct shapes - a sequence gap, a duplicate (community, panel, sequence) triple, and a sequence > 1 with a null supersedes_panel_id - and all three return the same 409 while the legal successor is accepted."
        test_recipe:
          setup:
            - "FL community with exactly one panel: seq 1, EFFECTIVE, effective_date 2020-06-05"
          setup_api_calls:
            - call: "POST /flood-zone/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAnalyst
            - call: "POST /flood-zone/communities"
              payload: { community_id_code: "125129", name: "Coastal County FL", state_code: "FL", participation_status: "REGULAR" }
              as: ProviderAnalyst
              captures: { c_fl_id: $.data.id }
            - call: "POST /flood-zone/map-panels"
              payload: { community_id: "${c_fl_id}", map_panel_number: "12086C0312K", revision_sequence: 1, zone_code: "AE", base_flood_elevation_ft: 7.75, effective_date: "2020-06-05T00:00:00Z" }
              as: AgencyOfficer
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /flood-zone/map-panels"
              payload: { community_id: "${c_fl_id}", map_panel_number: "12086C0312K", revision_sequence: 3, zone_code: "VE", base_flood_elevation_ft: 12.50, effective_date: "2027-04-28T00:00:00Z", supersedes_panel_id: "${p1_id}" }
              as: AgencyOfficer
            - call: "POST /flood-zone/map-panels"
              payload: { community_id: "${c_fl_id}", map_panel_number: "12086C0312K", revision_sequence: 1, zone_code: "AE", base_flood_elevation_ft: 7.75, effective_date: "2021-06-05T00:00:00Z" }
              as: AgencyOfficer
            - call: "POST /flood-zone/map-panels"
              payload: { community_id: "${c_fl_id}", map_panel_number: "12086C0312K", revision_sequence: 2, zone_code: "VE", base_flood_elevation_ft: 12.50, effective_date: "2027-04-28T00:00:00Z" }
              as: AgencyOfficer
            - call: "POST /flood-zone/map-panels"
              payload: { community_id: "${c_fl_id}", map_panel_number: "12086C0312K", revision_sequence: 2, zone_code: "VE", base_flood_elevation_ft: 12.50, effective_date: "2027-04-28T00:00:00Z", supersedes_panel_id: "${p1_id}", study_case_number: "26-04-1234P" }
              as: AgencyOfficer
              captures: { p2_id: $.data.id, p2_status: $.data.revision_status }
          assert:
            - "the seq 3 attempt returns 409 ERR_PANEL_SEQUENCE_INVALID: revision_sequence must be the superseded panel's sequence + 1 == 2"
            - "the duplicate seq 1 attempt returns 409 ERR_PANEL_SEQUENCE_INVALID on both counts - the (community_id, map_panel_number, revision_sequence) triple already exists AND a second EFFECTIVE panel would coexist"
            - "the seq 2 attempt with supersedes_panel_id omitted returns 409 ERR_PANEL_SEQUENCE_INVALID: only revision_sequence 1 may have a null predecessor"
            - "the fourth call returns 201 with revision_status == PRELIMINARY, revision_sequence == 2, supersedes_panel_id == ${p1_id}; MapPanel.${p1_id} is still EFFECTIVE with .superseded_at == null"
            - "GET /flood-zone/map-panels?community_id=${c_fl_id} returns total_count == 2, so none of the three refusals persisted a row"

