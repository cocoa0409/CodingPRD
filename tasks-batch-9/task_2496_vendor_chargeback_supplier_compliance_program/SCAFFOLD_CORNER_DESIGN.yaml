    instances:
      - name: corner_occ_stale_vendor_version_blocks_a_second_deduction_draft
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.deduction-create-stale-vendor
          - endpoints[POST /compliance/deductions]
          - validations[priority=7]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "Deduction creation is itself a Vendor write (it increments Vendor.version), so the version an accountant read before opening the first draft is already stale for the second: replaying that same expected_vendor_version returns 412 ERR_STALE_VERSION, and the identical payload succeeds once the version is re-read - stacking drafts is legal, stacking them on a stale exposure view is not."
        test_recipe:
          setup:
