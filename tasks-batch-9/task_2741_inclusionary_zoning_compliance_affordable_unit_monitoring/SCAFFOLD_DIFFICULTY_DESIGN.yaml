  # ===========================================================================
  # RULE 6 — boundary precision on two different metrics at two distinct endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: project_size_threshold_inclusive_at_ten_units
        metric: "whole dwelling units compared against Ordinance.min_project_units_threshold"
        endpoint: "POST /iz-compliance/projects/{project_id}/screen"
        grounds:
          - calculations.required_units_and_fraction
          - entities.Ordinance.fields.min_project_units_threshold
          - state_machines.Project.state
        distinguishing_aspect: |
          Metric: an integer unit count at the applicability threshold, observed at the screen
          endpoint. The threshold is inclusive, so total_units == 10 is SUBJECT while
          total_units == 9 is EXEMPT, and the two branches land in different states
          (SCREENED_SUBJECT vs SCREENED_EXEMPT) with disjoint side effects. An off-by-one
          reading (strictly greater than 10) would exempt a project that owes one unit.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ordinance IZ-2024-01 (min_project_units_threshold 10, R-2 set-aside 1000 bps) and AmiSchedule 2026 published."
            - "Project A in R-2 with exactly 10 total_units; Project B in R-2 with 9 total_units. Both approved 2026-01-15, so both pin the same ordinance vintage."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/ordinances", payload: { code: "IZ-2024-01", effective_date: "2024-01-01", min_project_units_threshold: 10, set_aside_bps_by_district: { "R-2": 1000, "R-4": 1500, "C-2": 2000 }, gap_basis_cents_by_level: { "5000": 24000000, "8000": 18000000, "12000": 12000000 }, fee_gap_level_bps: 5000, surcharge_bps: 350, surcharge_cap_cents: 5000000, discount_tiers: [ { min_pre_discount_cents: 0, discount_bps: 0 }, { min_pre_discount_cents: 20000000, discount_bps: 150 }, { min_pre_discount_cents: 100000000, discount_bps: 400 } ], fee_due_days: 45, alternative_paths_allowed: ["IN_LIEU_FEE", "OFFSITE"] }, as: ProgramAdministrator, captures: { ord_id: $.data.id } }
            - { call: "POST /iz-compliance/ami-schedules", payload: { effective_year: 2026, median_income_cents_by_size: { "1": 9868000, "2": 11278000, "3": 12669800, "4": 14082000, "5": 15214000 }, utility_allowance_cents_by_bedrooms: { "0": 8500, "1": 11000, "2": 14500, "3": 18000 } }, as: ProgramAdministrator, captures: { ami26_id: $.data.id } }
            - { call: "POST /iz-compliance/projects", payload: { name: "Threshold House A", zoning_district: "R-2", total_units: 10, approval_date: "2026-01-15" }, as: Developer, as_user_id: "dev-1", captures: { pa_id: $.data.id } }
            - { call: "POST /iz-compliance/projects", payload: { name: "Threshold House B", zoning_district: "R-2", total_units: 9, approval_date: "2026-01-15" }, as: Developer, as_user_id: "dev-1", captures: { pb_id: $.data.id } }
          trigger:
            - call: "POST /iz-compliance/projects/${pa_id}/screen"
              payload: {}
              as: HousingComplianceOfficer
              as_user_id: "hco-1"
            - call: "POST /iz-compliance/projects/${pb_id}/screen"
              payload: {}
              as: HousingComplianceOfficer
              as_user_id: "hco-1"
          assert:
            - "Project.${pa_id}.state == SCREENED_SUBJECT, applicability == SUBJECT, required_affordable_units == 1, fractional_obligation_bps == 0, total_obligation_bps == 10000"
            - "Project.${pa_id}.compliance_posture == DEFICIENT and ordinance_id == ${ord_id}"
            - "Project.${pb_id}.state == SCREENED_EXEMPT, applicability == EXEMPT, required_affordable_units == 0, fractional_obligation_bps == 0, total_obligation_bps == 0"
            - "Project.${pb_id}.compliance_posture == NOT_APPLICABLE and ordinance_id == ${ord_id}"
            - "both projects report screen_count == 1"

      - name: refinance_cap_inclusive_at_exact_ltv_ceiling
        metric: "integer cents compared against AffordableUnit.approved_refinance_cap_cents"
        endpoint: "POST /iz-compliance/affordable-units/{unit_id}/refinance-review"
        grounds:
          - calculations.refinance_capacity
          - validations.priority_45
          - entities.AffordableUnit.fields.approved_refinance_cap_cents
        distinguishing_aspect: |
          A different metric (money, not a unit count) at a different endpoint
          (refinance-review, not screen). The cap is produced by two chained half-up
          roundings — restricted_value_cents 34772471 then cap 31295224 from 31295223.9 —
          and the comparison is inclusive, so a request of exactly 31295224 is approved while
          31295225 is refused with ERR_REFINANCE_EXCEEDS_CAP. Truncating instead of rounding
          the cap would give 31295223 and wrongly refuse the boundary request.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ordinance IZ-2024-01 and AmiSchedule 2026 published."
            - "Project (R-2, 10 units) ONSITE with an AMI_INDEXED agreement whose max_refinance_ltv_bps is 9000, recorded."
            - "One OWNERSHIP 2-bedroom unit with a deed restriction recorded at 32500000, so ami_income_at_purchase_cents is 12669800."
            - "AmiSchedule 2028 published, so the ACTIVE size-3 median becomes 13555700 and restricted_value_cents is 34772471."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/ordinances", payload: { code: "IZ-2024-01", effective_date: "2024-01-01", min_project_units_threshold: 10, set_aside_bps_by_district: { "R-2": 1000, "R-4": 1500, "C-2": 2000 }, gap_basis_cents_by_level: { "5000": 24000000, "8000": 18000000, "12000": 12000000 }, fee_gap_level_bps: 5000, surcharge_bps: 350, surcharge_cap_cents: 5000000, discount_tiers: [ { min_pre_discount_cents: 0, discount_bps: 0 }, { min_pre_discount_cents: 20000000, discount_bps: 150 }, { min_pre_discount_cents: 100000000, discount_bps: 400 } ], fee_due_days: 45, alternative_paths_allowed: ["IN_LIEU_FEE", "OFFSITE"] }, as: ProgramAdministrator, captures: { ord_id: $.data.id } }
            - { call: "POST /iz-compliance/ami-schedules", payload: { effective_year: 2026, median_income_cents_by_size: { "1": 9868000, "2": 11278000, "3": 12669800, "4": 14082000, "5": 15214000 }, utility_allowance_cents_by_bedrooms: { "0": 8500, "1": 11000, "2": 14500, "3": 18000 } }, as: ProgramAdministrator, captures: { ami26_id: $.data.id } }
            - { call: "POST /iz-compliance/projects", payload: { name: "Loanwright Row", zoning_district: "R-2", total_units: 10, approval_date: "2026-01-15" }, as: Developer, as_user_id: "dev-1", captures: { p_id: $.data.id } }
            - { call: "POST /iz-compliance/projects/${p_id}/screen", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/projects/${p_id}/elect-path", payload: { compliance_path: "ONSITE" }, as: Developer, as_user_id: "dev-1" }
            - { call: "POST /iz-compliance/regulatory-agreements", payload: { project_id: "${p_id}", term_years: 45, resale_formula: "AMI_INDEXED", owner_appreciation_share_bps: 2500, max_refinance_ltv_bps: 9000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { a_id: $.data.id } }
            - { call: "POST /iz-compliance/regulatory-agreements/${a_id}/record", payload: { doc_number: "DOC-LR-0001", recorded_at: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/affordable-units", payload: { project_id: "${p_id}", agreement_id: "${a_id}", unit_number: "LR-101", bedrooms: 2, sqft: 950, market_comparable_sqft: 1100, tenure: "OWNERSHIP", affordability_level_bps: 5000 }, as: Developer, as_user_id: "dev-1", captures: { u_id: $.data.id } }
            - { call: "POST /iz-compliance/affordable-units/${u_id}/record-restriction", payload: { original_purchase_price_cents: 32500000, recorded_at: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/ami-schedules", payload: { effective_year: 2028, median_income_cents_by_size: { "1": 10559000, "2": 12067000, "3": 13555700, "4": 15068000, "5": 16279000 }, utility_allowance_cents_by_bedrooms: { "0": 8500, "1": 11000, "2": 14500, "3": 18000 } }, as: ProgramAdministrator, captures: { ami28_id: $.data.id } }
          trigger:
            - call: "POST /iz-compliance/affordable-units/${u_id}/refinance-review"
              payload: { requested_balance_cents: 31295225 }
              as: Developer
              as_user_id: "dev-1"
              captures: { err: $.data.error_id }
            - call: "POST /iz-compliance/affordable-units/${u_id}/refinance-review"
              payload: { requested_balance_cents: 31295224 }
              as: Developer
              as_user_id: "dev-1"
          assert:
            - "the 31295225 request returns HTTP 422 with error_id ERR_REFINANCE_EXCEEDS_CAP and leaves AffordableUnit.${u_id}.last_refinance_balance_cents null"
            - "the 31295224 request succeeds"
            - "AffordableUnit.${u_id}.approved_refinance_cap_cents == 31295224 (from restricted_value_cents 34772471 at 9000 bps, rounding 31295223.9 half up)"
            - "AffordableUnit.${u_id}.last_refinance_balance_cents == 31295224"
            - "AffordableUnit.${u_id}.original_purchase_price_cents is still 32500000 and ami_income_at_purchase_cents is still 12669800 — a refinance never re-bases the unit"

  # ===========================================================================
  # RULE 7 — cross-entity state dependencies on two different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: marketing_plan_approval_requires_project_agreement_recorded
        entity_pair: "MarketingPlan.state depends on Project.state"
        grounds:
          - validations.priority_50
          - state_machines.MarketingPlan.state
          - state_machines.Project.state
        distinguishing_aspect: |
          Entity pair MarketingPlan -> Project: the plan's own state is SUBMITTED and would
          otherwise be approvable, but approval additionally requires the OTHER entity to sit
          in AGREEMENT_RECORDED. While the project is still PATH_ELECTED the same request is
          refused with ERR_PROJECT_NOT_READY_FOR_MARKETING (409); recording the agreement
          moves the project — not the plan — and the identical request then succeeds and
          sweeps the project's PLANNED units to MARKETING.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ordinance IZ-2024-01 and AmiSchedule 2026 published."
            - "Project (R-2, 10 units) screened SUBJECT and ONSITE elected, so project.state is PATH_ELECTED."
            - "One RENTAL 2-bedroom unit created while the project is PATH_ELECTED; occupancy_status PLANNED."
            - "A RegulatoryAgreement created but NOT yet recorded (state DRAFT)."
            - "A MarketingPlan submitted for the window [2026-09-01T00:00:00Z, 2026-10-01T00:00:00Z), so plan.state is SUBMITTED."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/ordinances", payload: { code: "IZ-2024-01", effective_date: "2024-01-01", min_project_units_threshold: 10, set_aside_bps_by_district: { "R-2": 1000, "R-4": 1500, "C-2": 2000 }, gap_basis_cents_by_level: { "5000": 24000000, "8000": 18000000, "12000": 12000000 }, fee_gap_level_bps: 5000, surcharge_bps: 350, surcharge_cap_cents: 5000000, discount_tiers: [ { min_pre_discount_cents: 0, discount_bps: 0 }, { min_pre_discount_cents: 20000000, discount_bps: 150 }, { min_pre_discount_cents: 100000000, discount_bps: 400 } ], fee_due_days: 45, alternative_paths_allowed: ["IN_LIEU_FEE", "OFFSITE"] }, as: ProgramAdministrator, captures: { ord_id: $.data.id } }
            - { call: "POST /iz-compliance/ami-schedules", payload: { effective_year: 2026, median_income_cents_by_size: { "1": 9868000, "2": 11278000, "3": 12669800, "4": 14082000, "5": 15214000 }, utility_allowance_cents_by_bedrooms: { "0": 8500, "1": 11000, "2": 14500, "3": 18000 } }, as: ProgramAdministrator, captures: { ami26_id: $.data.id } }
            - { call: "POST /iz-compliance/projects", payload: { name: "Fernbank Lofts", zoning_district: "R-2", total_units: 10, approval_date: "2026-01-15" }, as: Developer, as_user_id: "dev-1", captures: { p_id: $.data.id } }
            - { call: "POST /iz-compliance/projects/${p_id}/screen", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/projects/${p_id}/elect-path", payload: { compliance_path: "ONSITE" }, as: Developer, as_user_id: "dev-1" }
            - { call: "POST /iz-compliance/regulatory-agreements", payload: { project_id: "${p_id}", term_years: 45, resale_formula: "AMI_INDEXED", owner_appreciation_share_bps: 2500, max_refinance_ltv_bps: 9000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { a_id: $.data.id } }
            - { call: "POST /iz-compliance/affordable-units", payload: { project_id: "${p_id}", agreement_id: "${a_id}", unit_number: "F-101", bedrooms: 2, sqft: 900, market_comparable_sqft: 1000, tenure: "RENTAL", affordability_level_bps: 5000 }, as: Developer, as_user_id: "dev-1", captures: { u_id: $.data.id } }
            - { call: "POST /iz-compliance/marketing-plans", payload: { project_id: "${p_id}", lottery_open_at: "2026-09-01T00:00:00Z", lottery_close_at: "2026-10-01T00:00:00Z", preference_categories: ["LIVE_WORK"] }, as: Developer, as_user_id: "dev-1", captures: { mp_id: $.data.id } }
          trigger:
            - call: "POST /iz-compliance/marketing-plans/${mp_id}/review"
              payload: { decision: "APPROVE" }
              as: HousingComplianceOfficer
              as_user_id: "hco-1"
              captures: { err: $.data.error_id }
            - call: "POST /iz-compliance/regulatory-agreements/${a_id}/record"
              payload: { doc_number: "DOC-FL-0001", recorded_at: "2026-08-01" }
              as: HousingComplianceOfficer
              as_user_id: "hco-1"
            - call: "POST /iz-compliance/marketing-plans/${mp_id}/review"
              payload: { decision: "APPROVE" }
              as: HousingComplianceOfficer
              as_user_id: "hco-1"
          assert:
            - "the first review returns HTTP 409 with error_id ERR_PROJECT_NOT_READY_FOR_MARKETING"
            - "after the refusal MarketingPlan.${mp_id}.state is still SUBMITTED, revision_round is still 0 and AffordableUnit.${u_id}.occupancy_status is still PLANNED"
            - "the record call moves Project.${p_id}.state from PATH_ELECTED to AGREEMENT_RECORDED and RegulatoryAgreement.${a_id}.state to RECORDED"
            - "the second, byte-identical review succeeds: MarketingPlan.${mp_id}.state == APPROVED"
            - "AffordableUnit.${u_id}.occupancy_status == MARKETING"

      - name: disbursement_disburse_requires_source_fee_paid
        entity_pair: "TrustFundDisbursement.state depends on InLieuFee.state"
        grounds:
          - validations.priority_46
          - state_machines.TrustFundDisbursement.state
          - state_machines.InLieuFee.state
          - calculations.trust_fund_ledger
        distinguishing_aspect: |
          A different entity pair — TrustFundDisbursement -> InLieuFee, neither of which is
          MarketingPlan or Project. The draw's own state is REQUESTED and the fund holds a
          189120000-cent balance from a DIFFERENT project's paid assessment, so nothing about
          the draw itself blocks it; the disburse is refused solely because its source
          assessment is still ASSESSED. Paying that source fee in full changes only the
          InLieuFee row, and the identical disburse then succeeds.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ordinance IZ-2024-01 and AmiSchedule 2026 published."
            - "Project P1 (C-2, 40 units, developer dev-1) elects IN_LIEU_FEE; its FULL assessment of 189120000 cents is paid in full, so the fund holds 189120000."
            - "Project P2 (C-2, 40 units, developer dev-2) elects IN_LIEU_FEE; its FULL assessment of 189120000 cents is left ASSESSED."
            - "A 5000000-cent AFFORDABLE_HOUSING_PRODUCTION draw is requested against P2's unpaid assessment, which is admissible at request time because 5000000 is within the unencumbered balance."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/ordinances", payload: { code: "IZ-2024-01", effective_date: "2024-01-01", min_project_units_threshold: 10, set_aside_bps_by_district: { "R-2": 1000, "R-4": 1500, "C-2": 2000 }, gap_basis_cents_by_level: { "5000": 24000000, "8000": 18000000, "12000": 12000000 }, fee_gap_level_bps: 5000, surcharge_bps: 350, surcharge_cap_cents: 5000000, discount_tiers: [ { min_pre_discount_cents: 0, discount_bps: 0 }, { min_pre_discount_cents: 20000000, discount_bps: 150 }, { min_pre_discount_cents: 100000000, discount_bps: 400 } ], fee_due_days: 45, alternative_paths_allowed: ["IN_LIEU_FEE", "OFFSITE"] }, as: ProgramAdministrator, captures: { ord_id: $.data.id } }
            - { call: "POST /iz-compliance/ami-schedules", payload: { effective_year: 2026, median_income_cents_by_size: { "1": 9868000, "2": 11278000, "3": 12669800, "4": 14082000, "5": 15214000 }, utility_allowance_cents_by_bedrooms: { "0": 8500, "1": 11000, "2": 14500, "3": 18000 } }, as: ProgramAdministrator, captures: { ami26_id: $.data.id } }
            - { call: "POST /iz-compliance/projects", payload: { name: "Ironworks One", zoning_district: "C-2", total_units: 40, approval_date: "2026-01-15" }, as: Developer, as_user_id: "dev-1", captures: { p1_id: $.data.id } }
            - { call: "POST /iz-compliance/projects/${p1_id}/screen", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/projects/${p1_id}/elect-path", payload: { compliance_path: "IN_LIEU_FEE" }, as: Developer, as_user_id: "dev-1", captures: { p1_v: $.data.version } }
            - { call: "POST /iz-compliance/in-lieu-fees", payload: { project_id: "${p1_id}", basis: "FULL", expected_project_version: "${p1_v}" }, as: ProgramAdministrator, captures: { f1_id: $.data.id } }
            - { call: "POST /iz-compliance/in-lieu-fees/${f1_id}/payments", payload: { amount_cents: 189120000 }, as: Developer, as_user_id: "dev-1" }
            - { call: "POST /iz-compliance/projects", payload: { name: "Ironworks Two", zoning_district: "C-2", total_units: 40, approval_date: "2026-01-15" }, as: Developer, as_user_id: "dev-2", captures: { p2_id: $.data.id } }
            - { call: "POST /iz-compliance/projects/${p2_id}/screen", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/projects/${p2_id}/elect-path", payload: { compliance_path: "IN_LIEU_FEE" }, as: Developer, as_user_id: "dev-2", captures: { p2_v: $.data.version } }
            - { call: "POST /iz-compliance/in-lieu-fees", payload: { project_id: "${p2_id}", basis: "FULL", expected_project_version: "${p2_v}" }, as: ProgramAdministrator, captures: { f2_id: $.data.id } }
            - { call: "POST /iz-compliance/trust-fund-disbursements", payload: { source_fee_id: "${f2_id}", eligible_use: "AFFORDABLE_HOUSING_PRODUCTION", amount_cents: 5000000 }, as: ProgramAdministrator, captures: { d_id: $.data.id } }
          trigger:
            - call: "POST /iz-compliance/trust-fund-disbursements/${d_id}/disburse"
              payload: {}
              as: ProgramAdministrator
              captures: { err: $.data.error_id }
            - call: "POST /iz-compliance/in-lieu-fees/${f2_id}/payments"
              payload: { amount_cents: 189120000 }
              as: Developer
              as_user_id: "dev-2"
            - call: "POST /iz-compliance/trust-fund-disbursements/${d_id}/disburse"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /iz-compliance/trust-fund-summary"
              payload: {}
              as: FundAuditor
              as_user_id: "aud-1"
          assert:
            - "the first disburse returns HTTP 409 with error_id ERR_SOURCE_FEE_NOT_PAID"
            - "after the refusal TrustFundDisbursement.${d_id}.state is still REQUESTED and disbursed_at is null"
            - "InLieuFee.${f1_id}.state == PAID with paid_amount_cents 189120000, and before the payment InLieuFee.${f2_id}.state == ASSESSED with paid_amount_cents 0"
            - "after the payment InLieuFee.${f2_id}.state == PAID and the identical disburse succeeds: TrustFundDisbursement.${d_id}.state == DISBURSED"
            - "the summary reports total_paid_fees_cents == 378240000, total_recapture_cents == 0, encumbered_cents == 0, disbursed_cents == 5000000 and unencumbered_balance_cents == 373240000"

  # ===========================================================================
  # RULE 8 — resource/temporal overlap: two interval conventions, two resources
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: certification_period_touching_endpoint_collides_on_unit
        resource: "AffordableUnit (RENTAL certification terms)"
        interval_semantics: "CLOSED [effective_date, expires_at] — touching endpoints collide"
        grounds:
          - calculations.certification_period_overlap
          - validations.priority_35
          - entities.IncomeCertification.fields.expires_at
        distinguishing_aspect: |
          The contended resource is the AffordableUnit and the interval is CLOSED on both
          ends. The incumbent term is [2026-08-01, 2027-08-01]; a new term whose
          effective_date is exactly 2027-08-01 shares that single endpoint and is therefore
          REJECTED with ERR_CERTIFICATION_PERIOD_OVERLAP, while 2027-08-02 — one day later,
          the same day recertification would use — is accepted. Half-open reasoning would
          wrongly accept the touching date.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ordinance IZ-2024-01 and AmiSchedule 2026 published."
            - "Project (R-2, 10 units) ONSITE with agreement recorded; one RENTAL 2-bedroom unit at 5000 bps."
            - "Household H1 (size 3, income 6000000) certified with effective_date 2026-08-01, so the term is the closed interval [2026-08-01, 2027-08-01] and the unit is OCCUPIED."
            - "Household H2 (size 3, income 6000000) registered and still in state REGISTERED."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/ordinances", payload: { code: "IZ-2024-01", effective_date: "2024-01-01", min_project_units_threshold: 10, set_aside_bps_by_district: { "R-2": 1000, "R-4": 1500, "C-2": 2000 }, gap_basis_cents_by_level: { "5000": 24000000, "8000": 18000000, "12000": 12000000 }, fee_gap_level_bps: 5000, surcharge_bps: 350, surcharge_cap_cents: 5000000, discount_tiers: [ { min_pre_discount_cents: 0, discount_bps: 0 }, { min_pre_discount_cents: 20000000, discount_bps: 150 }, { min_pre_discount_cents: 100000000, discount_bps: 400 } ], fee_due_days: 45, alternative_paths_allowed: ["IN_LIEU_FEE", "OFFSITE"] }, as: ProgramAdministrator, captures: { ord_id: $.data.id } }
            - { call: "POST /iz-compliance/ami-schedules", payload: { effective_year: 2026, median_income_cents_by_size: { "1": 9868000, "2": 11278000, "3": 12669800, "4": 14082000, "5": 15214000 }, utility_allowance_cents_by_bedrooms: { "0": 8500, "1": 11000, "2": 14500, "3": 18000 } }, as: ProgramAdministrator, captures: { ami26_id: $.data.id } }
            - { call: "POST /iz-compliance/projects", payload: { name: "Overlap Gardens", zoning_district: "R-2", total_units: 10, approval_date: "2026-01-15" }, as: Developer, as_user_id: "dev-1", captures: { p_id: $.data.id } }
            - { call: "POST /iz-compliance/projects/${p_id}/screen", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/projects/${p_id}/elect-path", payload: { compliance_path: "ONSITE" }, as: Developer, as_user_id: "dev-1" }
            - { call: "POST /iz-compliance/regulatory-agreements", payload: { project_id: "${p_id}", term_years: 45, resale_formula: "AMI_INDEXED", owner_appreciation_share_bps: 2500, max_refinance_ltv_bps: 9000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { a_id: $.data.id } }
            - { call: "POST /iz-compliance/regulatory-agreements/${a_id}/record", payload: { doc_number: "DOC-OG-0001", recorded_at: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/affordable-units", payload: { project_id: "${p_id}", agreement_id: "${a_id}", unit_number: "O-101", bedrooms: 2, sqft: 900, market_comparable_sqft: 1000, tenure: "RENTAL", affordability_level_bps: 5000 }, as: Developer, as_user_id: "dev-1", captures: { u_id: $.data.id } }
            - { call: "POST /iz-compliance/households", payload: { applicant_name: "Rosa Delgado", household_size: 3, gross_annual_income_cents: 6000000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { h1_id: $.data.id } }
            - { call: "POST /iz-compliance/income-certifications", payload: { household_id: "${h1_id}", unit_id: "${u_id}", certified_income_cents: 6000000, contract_rent_cents: 140000, effective_date: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { c1_id: $.data.id } }
            - { call: "POST /iz-compliance/households", payload: { applicant_name: "Victor Amaya", household_size: 3, gross_annual_income_cents: 6000000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { h2_id: $.data.id } }
          trigger:
            - call: "POST /iz-compliance/income-certifications"
              payload: { household_id: "${h2_id}", unit_id: "${u_id}", certified_income_cents: 6000000, contract_rent_cents: 140000, effective_date: "2027-08-01" }
              as: HousingComplianceOfficer
              as_user_id: "hco-1"
              captures: { err: $.data.error_id }
            - call: "POST /iz-compliance/income-certifications"
              payload: { household_id: "${h2_id}", unit_id: "${u_id}", certified_income_cents: 6000000, contract_rent_cents: 140000, effective_date: "2027-08-02" }
              as: HousingComplianceOfficer
              as_user_id: "hco-1"
              captures: { c2_id: $.data.id }
          assert:
            - "IncomeCertification.${c1_id}.effective_date == 2026-08-01 and expires_at == 2027-08-01 and state == CERTIFIED"
            - "the effective_date 2027-08-01 attempt returns HTTP 409 with error_id ERR_CERTIFICATION_PERIOD_OVERLAP"
            - "Household.${h2_id}.state is still REGISTERED after the refusal"
            - "the effective_date 2027-08-02 attempt succeeds: IncomeCertification.${c2_id}.state == CERTIFIED and expires_at == 2028-08-01"
            - "IncomeCertification.${c1_id}.state is still CERTIFIED — accepting an abutting term does not retire the incumbent"

      - name: marketing_window_exact_adjacency_accepted_on_project
        resource: "Project (marketing/lottery windows)"
        interval_semantics: "HALF-OPEN [lottery_open_at, lottery_close_at) — exact adjacency is legal"
        grounds:
          - calculations.marketing_window_overlap
          - validations.priority_33
          - entities.MarketingPlan.fields.lottery_open_at
        distinguishing_aspect: |
          A different contended resource — the Project, not the AffordableUnit — under the
          OPPOSITE convention: the window is half-open, so a plan starting exactly at the
          incumbent's lottery_close_at (2026-10-01T00:00:00Z) is ACCEPTED, which is the mirror
          image of the certification case where the touching endpoint is refused. A window
          strictly inside the incumbent's is still refused with ERR_MARKETING_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ordinance IZ-2024-01 and AmiSchedule 2026 published."
            - "Project (R-2, 10 units) screened SUBJECT with ONSITE elected."
            - "MarketingPlan A submitted for [2026-09-01T00:00:00Z, 2026-10-01T00:00:00Z), state SUBMITTED and therefore inside the overlap scan set."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/ordinances", payload: { code: "IZ-2024-01", effective_date: "2024-01-01", min_project_units_threshold: 10, set_aside_bps_by_district: { "R-2": 1000, "R-4": 1500, "C-2": 2000 }, gap_basis_cents_by_level: { "5000": 24000000, "8000": 18000000, "12000": 12000000 }, fee_gap_level_bps: 5000, surcharge_bps: 350, surcharge_cap_cents: 5000000, discount_tiers: [ { min_pre_discount_cents: 0, discount_bps: 0 }, { min_pre_discount_cents: 20000000, discount_bps: 150 }, { min_pre_discount_cents: 100000000, discount_bps: 400 } ], fee_due_days: 45, alternative_paths_allowed: ["IN_LIEU_FEE", "OFFSITE"] }, as: ProgramAdministrator, captures: { ord_id: $.data.id } }
            - { call: "POST /iz-compliance/ami-schedules", payload: { effective_year: 2026, median_income_cents_by_size: { "1": 9868000, "2": 11278000, "3": 12669800, "4": 14082000, "5": 15214000 }, utility_allowance_cents_by_bedrooms: { "0": 8500, "1": 11000, "2": 14500, "3": 18000 } }, as: ProgramAdministrator, captures: { ami26_id: $.data.id } }
            - { call: "POST /iz-compliance/projects", payload: { name: "Adjacency Commons", zoning_district: "R-2", total_units: 10, approval_date: "2026-01-15" }, as: Developer, as_user_id: "dev-1", captures: { p_id: $.data.id } }
            - { call: "POST /iz-compliance/projects/${p_id}/screen", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/projects/${p_id}/elect-path", payload: { compliance_path: "ONSITE" }, as: Developer, as_user_id: "dev-1" }
            - { call: "POST /iz-compliance/marketing-plans", payload: { project_id: "${p_id}", lottery_open_at: "2026-09-01T00:00:00Z", lottery_close_at: "2026-10-01T00:00:00Z", preference_categories: ["LIVE_WORK"] }, as: Developer, as_user_id: "dev-1", captures: { mp_a_id: $.data.id } }
          trigger:
            - call: "POST /iz-compliance/marketing-plans"
              payload: { project_id: "${p_id}", lottery_open_at: "2026-10-01T00:00:00Z", lottery_close_at: "2026-11-01T00:00:00Z", preference_categories: ["DISPLACED"] }
              as: Developer
              as_user_id: "dev-1"
              captures: { mp_b_id: $.data.id }
            - call: "POST /iz-compliance/marketing-plans"
              payload: { project_id: "${p_id}", lottery_open_at: "2026-09-15T00:00:00Z", lottery_close_at: "2026-09-20T00:00:00Z", preference_categories: ["PUBLIC_EMPLOYEE"] }
              as: Developer
              as_user_id: "dev-1"
              captures: { err: $.data.error_id }
          assert:
            - "the exactly-adjacent plan is created: MarketingPlan.${mp_b_id}.state == SUBMITTED with lottery_open_at 2026-10-01T00:00:00Z"
            - "MarketingPlan.${mp_a_id}.state is still SUBMITTED and its window is unchanged"
            - "the enclosed window returns HTTP 409 with error_id ERR_MARKETING_WINDOW_OVERLAP"
            - "exactly two MarketingPlan rows exist for Project.${p_id} after the trigger"
            - "the same touching-endpoint arrangement is refused for RENTAL certification periods, so the two conventions are observably different"

  # ===========================================================================
  # RULE 9 — compensating invariants over two different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: void_disbursed_draw_restores_fund_money_conservation_exactly
        conserved_quantity: "money in cents: unencumbered_balance_cents + encumbered_cents + disbursed_cents == total_inflow_cents"
        grounds:
          - calculations.trust_fund_ledger
          - state_machines.TrustFundDisbursement.state
        distinguishing_aspect: |
          The conserved quantity is MONEY. Requesting a draw moves 5000000 cents from
          unencumbered to encumbered; disbursing moves the same cents from encumbered to
          disbursed and must leave unencumbered untouched at 184120000; voiding the DISBURSED
          draw is the compensating action that returns unencumbered to exactly its
          pre-request value of 189120000, with encumbered and disbursed both back to 0. The
          three-bucket sum equals total_inflow_cents 189120000 at all four observation points,
          and no row is deleted — the VOIDED draw simply stops contributing.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ordinance IZ-2024-01 and AmiSchedule 2026 published."
            - "Project (C-2, 40 units) elects IN_LIEU_FEE and its FULL assessment of 189120000 cents is paid in full, so total_inflow_cents is 189120000 and admin_cap_cents is 18912000."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/ordinances", payload: { code: "IZ-2024-01", effective_date: "2024-01-01", min_project_units_threshold: 10, set_aside_bps_by_district: { "R-2": 1000, "R-4": 1500, "C-2": 2000 }, gap_basis_cents_by_level: { "5000": 24000000, "8000": 18000000, "12000": 12000000 }, fee_gap_level_bps: 5000, surcharge_bps: 350, surcharge_cap_cents: 5000000, discount_tiers: [ { min_pre_discount_cents: 0, discount_bps: 0 }, { min_pre_discount_cents: 20000000, discount_bps: 150 }, { min_pre_discount_cents: 100000000, discount_bps: 400 } ], fee_due_days: 45, alternative_paths_allowed: ["IN_LIEU_FEE", "OFFSITE"] }, as: ProgramAdministrator, captures: { ord_id: $.data.id } }
            - { call: "POST /iz-compliance/ami-schedules", payload: { effective_year: 2026, median_income_cents_by_size: { "1": 9868000, "2": 11278000, "3": 12669800, "4": 14082000, "5": 15214000 }, utility_allowance_cents_by_bedrooms: { "0": 8500, "1": 11000, "2": 14500, "3": 18000 } }, as: ProgramAdministrator, captures: { ami26_id: $.data.id } }
            - { call: "POST /iz-compliance/projects", payload: { name: "Ledgerworks", zoning_district: "C-2", total_units: 40, approval_date: "2026-01-15" }, as: Developer, as_user_id: "dev-1", captures: { p_id: $.data.id } }
            - { call: "POST /iz-compliance/projects/${p_id}/screen", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/projects/${p_id}/elect-path", payload: { compliance_path: "IN_LIEU_FEE" }, as: Developer, as_user_id: "dev-1", captures: { p_v: $.data.version } }
            - { call: "POST /iz-compliance/in-lieu-fees", payload: { project_id: "${p_id}", basis: "FULL", expected_project_version: "${p_v}" }, as: ProgramAdministrator, captures: { fee_id: $.data.id } }
            - { call: "POST /iz-compliance/in-lieu-fees/${fee_id}/payments", payload: { amount_cents: 189120000 }, as: Developer, as_user_id: "dev-1" }
            - { call: "GET /iz-compliance/trust-fund-summary", payload: {}, as: FundAuditor, as_user_id: "aud-1" }
          trigger:
            - call: "POST /iz-compliance/trust-fund-disbursements"
              payload: { source_fee_id: "${fee_id}", eligible_use: "AFFORDABLE_HOUSING_PRODUCTION", amount_cents: 5000000 }
              as: ProgramAdministrator
              captures: { d_id: $.data.id }
            - { call: "GET /iz-compliance/trust-fund-summary", payload: {}, as: FundAuditor, as_user_id: "aud-1" }
            - { call: "POST /iz-compliance/trust-fund-disbursements/${d_id}/disburse", payload: {}, as: ProgramAdministrator }
            - { call: "GET /iz-compliance/trust-fund-summary", payload: {}, as: FundAuditor, as_user_id: "aud-1" }
            - call: "POST /iz-compliance/trust-fund-disbursements/${d_id}/void"
              payload: { void_reason: "Grantee withdrew the production award before drawdown." }
              as: ProgramAdministrator
            - { call: "GET /iz-compliance/trust-fund-summary", payload: {}, as: FundAuditor, as_user_id: "aud-1" }
          assert:
            - "observation 0 (setup, after payment): total_inflow_cents 189120000, encumbered_cents 0, disbursed_cents 0, unencumbered_balance_cents 189120000, admin_cap_cents 18912000, admin_committed_cents 0"
            - "observation 1 (after request): encumbered_cents 5000000, disbursed_cents 0, unencumbered_balance_cents 184120000"
            - "observation 2 (after disburse): encumbered_cents 0, disbursed_cents 5000000, unencumbered_balance_cents still 184120000"
            - "observation 3 (after void): encumbered_cents 0, disbursed_cents 0, unencumbered_balance_cents back to exactly 189120000"
            - "at all four observations unencumbered_balance_cents + encumbered_cents + disbursed_cents == total_inflow_cents == 189120000"
            - "TrustFundDisbursement.${d_id}.state == VOIDED with amount_cents still 5000000 — the row survives and simply stops contributing"
            - "InLieuFee.${fee_id}.state == PAID and paid_amount_cents == 189120000 throughout; admin_committed_cents stays 0 because the draw was not an ADMIN use"

      - name: withdraw_reinstate_cycle_restores_unit_equivalents_exactly
        conserved_quantity: "unit equivalents in bps: onsite_unit_equivalents_bps + fee_covered_equivalents_bps == total_obligation_bps"
        grounds:
          - calculations.project_obligation_equivalents
          - calculations.substitution_fee_selection
          - calculations.project_compliance_posture
          - state_machines.AffordableUnit.occupancy_status
        distinguishing_aspect: |
          A different conserved quantity — UNIT EQUIVALENTS in basis points, not money. The
          withdraw shifts 10000 bps from the onsite bucket to the fee-covered bucket by
          assessing a substitution fee, and the reinstate is the compensating action that
          shifts the same 10000 bps back by superseding that assessment. The sum stays exactly
          equal to total_obligation_bps 10000 at every observation, and the posture returns to
          COMPLIANT_ONSITE. The reinstate is only permitted while the substitution assessment
          has paid_amount_cents == 0, which is precisely what keeps the two buckets from
          double-counting the same obligation.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ordinance IZ-2024-01 and AmiSchedule 2026 published."
            - "Project (R-2, 10 units) screened SUBJECT with total_obligation_bps 10000, ONSITE path, agreement recorded."
            - "One RENTAL 2-bedroom unit created and left PLANNED, so onsite_unit_equivalents_bps is 10000, fee_covered_equivalents_bps is 0 and the posture is COMPLIANT_ONSITE."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/ordinances", payload: { code: "IZ-2024-01", effective_date: "2024-01-01", min_project_units_threshold: 10, set_aside_bps_by_district: { "R-2": 1000, "R-4": 1500, "C-2": 2000 }, gap_basis_cents_by_level: { "5000": 24000000, "8000": 18000000, "12000": 12000000 }, fee_gap_level_bps: 5000, surcharge_bps: 350, surcharge_cap_cents: 5000000, discount_tiers: [ { min_pre_discount_cents: 0, discount_bps: 0 }, { min_pre_discount_cents: 20000000, discount_bps: 150 }, { min_pre_discount_cents: 100000000, discount_bps: 400 } ], fee_due_days: 45, alternative_paths_allowed: ["IN_LIEU_FEE", "OFFSITE"] }, as: ProgramAdministrator, captures: { ord_id: $.data.id } }
            - { call: "POST /iz-compliance/ami-schedules", payload: { effective_year: 2026, median_income_cents_by_size: { "1": 9868000, "2": 11278000, "3": 12669800, "4": 14082000, "5": 15214000 }, utility_allowance_cents_by_bedrooms: { "0": 8500, "1": 11000, "2": 14500, "3": 18000 } }, as: ProgramAdministrator, captures: { ami26_id: $.data.id } }
            - { call: "POST /iz-compliance/projects", payload: { name: "Balance Court", zoning_district: "R-2", total_units: 10, approval_date: "2026-01-15" }, as: Developer, as_user_id: "dev-1", captures: { p_id: $.data.id } }
            - { call: "POST /iz-compliance/projects/${p_id}/screen", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/projects/${p_id}/elect-path", payload: { compliance_path: "ONSITE" }, as: Developer, as_user_id: "dev-1" }
            - { call: "POST /iz-compliance/regulatory-agreements", payload: { project_id: "${p_id}", term_years: 45, resale_formula: "AMI_INDEXED", owner_appreciation_share_bps: 2500, max_refinance_ltv_bps: 9000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { a_id: $.data.id } }
            - { call: "POST /iz-compliance/regulatory-agreements/${a_id}/record", payload: { doc_number: "DOC-BC-9001", recorded_at: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/affordable-units", payload: { project_id: "${p_id}", agreement_id: "${a_id}", unit_number: "BC-101", bedrooms: 2, sqft: 900, market_comparable_sqft: 1000, tenure: "RENTAL", affordability_level_bps: 5000 }, as: Developer, as_user_id: "dev-1", captures: { u_id: $.data.id } }
            - { call: "GET /iz-compliance/projects/${p_id}", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1" }
          trigger:
            - call: "POST /iz-compliance/affordable-units/${u_id}/withdraw"
              payload: { reason: "Unit deleted from the podium plan pending redesign." }
              as: Developer
              as_user_id: "dev-1"
            - { call: "GET /iz-compliance/in-lieu-fees", payload: { project_id: "${p_id}", basis: "SUBSTITUTION" }, as: ProgramAdministrator, captures: { sub_fee_id: "$.data[0].id" } }
            - call: "POST /iz-compliance/affordable-units/${u_id}/reinstate"
              payload: {}
              as: Developer
              as_user_id: "dev-1"
            - { call: "GET /iz-compliance/projects/${p_id}", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1" }
          assert:
            - "observation 0 (setup): Project.${p_id}.onsite_unit_equivalents_bps 10000 + fee_covered_equivalents_bps 0 == total_obligation_bps 10000, compliance_posture COMPLIANT_ONSITE"
            - "observation 1 (after withdraw): onsite_unit_equivalents_bps 0 + fee_covered_equivalents_bps 10000 == 10000, compliance_posture COMPLIANT_BY_FEE"
            - "observation 1: InLieuFee.${sub_fee_id}.basis == SUBSTITUTION, unit_equivalent_bps == 10000, assessed_amount_cents == 24467400, state == ASSESSED, paid_amount_cents == 0"
            - "observation 2 (after reinstate): onsite_unit_equivalents_bps 10000 + fee_covered_equivalents_bps 0 == 10000, compliance_posture back to COMPLIANT_ONSITE"
            - "observation 2: InLieuFee.${sub_fee_id}.state == SUPERSEDED with superseded_by_fee_id null and paid_amount_cents 0 — the assessment row is retired, not deleted"
            - "observation 2: AffordableUnit.${u_id}.occupancy_status == PLANNED and withdrawn_reason == null"
            - "Project.${p_id}.total_obligation_bps and required_affordable_units are unchanged by the whole cycle"
            - "the trust-fund money quantity is untouched by this cycle: the superseded assessment never received a payment, so total_paid_fees_cents stays 0 — the two conserved quantities are independent"
