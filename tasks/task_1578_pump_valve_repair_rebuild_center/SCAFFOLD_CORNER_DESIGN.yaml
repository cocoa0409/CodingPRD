      - name: obsolete_part_without_substitution_rejected_at_issue
        claim_type: violation_to_error
        grounds: ["errors[ERR_PART_OBSOLETE]", state_machines.Quote.DRAFT_to_ISSUED]
        distinguishing_aspect: "A plain part line referencing an OBSOLETE part (no substitution_for_part_id) fails issue with ERR_PART_OBSOLETE."
