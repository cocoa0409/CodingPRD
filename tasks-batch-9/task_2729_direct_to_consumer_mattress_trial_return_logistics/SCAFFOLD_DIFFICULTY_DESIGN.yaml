            - call: "POST /mattress-models"
              payload: { sku: "MDL-Q-MED-T1", name: "Comfort Q Medium", firmness: "MEDIUM", size: "QUEEN", list_price_cents: 120000, break_in_nights: 21, trial_nights: 100 }
