              payload: { decision: "ACCEPT", authorized_visits: 1 }
              as: PelvicHealthCoordinator
              as_user_id: "${coord_id}"
              captures: { e_window: $.data.error_id }
          assert:
            - "${e_ref_transition} == \"ERR_INVALID_REFERRAL_TRANSITION\" at HTTP 409 and ref A stays REQUESTED with every visit counter 0"
            - "trigger call 2: HTTP 200 with status \"ACCEPTED\", visits_authorized 2 (min of requested 2, body 2, cap 6), visits_remaining 2, visits_used 0, visits_forfeited 0, therapy_start_by \"2026-10-14\", waitlist_position null"
            - "${e_void_empty} == \"ERR_VISIT_ALLOCATION_EXHAUSTED\" at HTTP 422 — VOID_LAST is declared on ACCEPTED, so the empty ledger is caught by priority 76 and not by the transition guard; visits_used stays 0"
            - "trigger call 4: HTTP 200 with status still \"ACCEPTED\", visits_used 1, visits_remaining 1, first_visit_date \"2026-09-15\""
            - "trigger call 5: HTTP 200 with status \"COMPLETED\", visits_used 2, visits_remaining 0, first_visit_date still \"2026-09-15\""
            - "${e_log_on_completed} == \"ERR_INVALID_REFERRAL_TRANSITION\" at HTTP 409 — LOG is not declared out of COMPLETED, so priority 22 answers before priority 76 could report the exhausted allocation; visits_used stays 2"
            - "${e_window} == \"ERR_THERAPY_START_WINDOW_MISSED\" at HTTP 422 — 2026-10-15 is one day past completed_at 2026-09-14 plus THERAPY_START_WINDOW_DAYS 30; ref B stays REQUESTED with visits_authorized 0 and therapy_start_by null"

  # ==========================================================================
  # §1.7 declares seven roles, one opaque (PracticeAdmin) and six
  # entity_backed:Provider. role_model is segregation_of_duties, so Table 7's
  # role-model row for it is exercised in rbac_segregation_of_duties_rejected.
  # The other role-model rows (approval_chain, peer_roles,
  # hierarchical_override, delegated_authority) are not this scaffold's model
  # and are therefore not emitted.
  - section: rbac
    instances:

      - name: rbac_exclusive_operations_cross_role_unauthorized
        claim_type: exclusive_operations
        grounds:
          - roles[Scheduler].exclusive_operations
          - roles[Urologist].exclusive_operations
          - roles[ProcedureNurse].exclusive_operations
          - roles[SterileProcessingTech].exclusive_operations
          - roles[PathologyLiaison].exclusive_operations
          - roles[PelvicHealthCoordinator].exclusive_operations
          - roles[PracticeAdmin].exclusive_operations
          - validations[priority 3]
          - validations[priority 4]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "Every role's exclusive operations are closed to the other roles, and the check runs before resource lookup: eight of these calls carry a syntactically valid but non-existent path id and still answer 403 ERR_UNAUTHORIZED rather than 404. The last call shows the argument-level gate at priority 4 — ProcedureNurse shares clearance-review but cannot pass decision WAIVE, which is Urologist's exclusive."
        test_recipe:
          setup:
            - "one provider per entity_backed role; patient; room Cysto A; type CYSTOSCOPY; one DRAFT case"
          setup_api_calls:
            - call: "POST /urology/providers"
              payload: { full_name: "Dr Ada Nour", npi: "1000000001", role_type: "UROLOGIST" }
              as: PracticeAdmin
              captures: { uro_id: $.data.id }
            - call: "POST /urology/providers"
              payload: { full_name: "Sam Reyes", npi: "1000000002", role_type: "SCHEDULER" }
              as: PracticeAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /urology/providers"
