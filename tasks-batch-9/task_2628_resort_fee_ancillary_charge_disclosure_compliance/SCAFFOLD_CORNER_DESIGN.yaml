            - call: "POST /fees/${fee_resort}/inclusions"
              payload: { service_code: "POOL_ACCESS", service_label: "Pool and cabana access", retail_value_cents: 1500, units: 1 }
              as: RevenueManager
              as_user_id: "u-rev-1"
            - call: "POST /fees/${fee_dest}/inclusions"
              payload: { service_code: "SHUTTLE", service_label: "Airport shuttle", retail_value_cents: 1200, units: 1 }
              as: RevenueManager
