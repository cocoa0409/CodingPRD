  - rule_id: non_linear_state_machine
    instances:
      - name: item_unit_rental_cycle
        grounds:
          - state_machines.ItemUnit
          - state_machines.CleaningTicket
        distinguishing_aspect: |
          ItemUnit is CYCLIC (not a linear pipeline): AVAILABLE -> OUT -> CLEANING -> AVAILABLE
          via a full cleaning-ticket rotation, and the same unit becomes assignable to a new
          pull list afterwards — the loop closes on the entity it started from.
        test_recipe:
          setup:
            - "RC published; item COSTUME daily 1000 weekly 5000 with unit U1 (grade B)"
            - "Renter ACTIVE; production CONFIRMED; reservation qty 1 window Sep 1-10 CONFIRMED; pull list dispatched at 2026-08-31 (U1 OUT)"
