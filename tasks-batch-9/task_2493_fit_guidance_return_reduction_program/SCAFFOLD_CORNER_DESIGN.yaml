      - name: expectation_branch_resolve_sets_pdp_review_required
        claim_type: side_effect_execution
        grounds:
          - state_machines.ReturnCase.status.TRIAGE_to_EXPECTATION_REVIEW
          - state_machines.ReturnCase.status.EXPECTATION_REVIEW_to_RESOLVED_REFUNDED
          - calculations.return_case_cost_postings
          - calculations.item_chronic_return_score
          - entities.CatalogItem.fields.pdp_review_required
        distinguishing_aspect: |
          The shopper's requested_reason_code FIT_TOO_SMALL is preserved on the row while the
          auditor recodes reason_code to EXPECTATION_MISMATCH, and it is the auditor's code that
          drives every downstream number.
          The EXPECTATION fork of the classify branching writes a different side-effect set than
          the FIT fork: it raises expectation_return_count and flips pdp_review_required to true
          while leaving fit_return_count at 0, and it charges 11 handling minutes (682) instead
          of 9 (558). On a 2-unit line (gross 4590) resolved RESELLABLE_B the ledger is
          795 + 682 + 184 + 551 + 133 = 2345, and the score is floor(2500 * 5000 / 10000) = 1250,
          which is below WATCH_THRESHOLD_BP so the item stays NORMAL and LISTED.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "Vendor NRTH, one LISTED TOPS item priced 2295, TOPS 30-day default policy with refundable shipping."
            - "One shopper with a delivered line of quantity 2 (gross 4590, delivered_at 2026-05-20)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /fit-program/vendors"
              payload: { name: "Northwind Apparel", brand_code: "NRTH", correction_budget_cents: 250000 }
              as: MerchOpsAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /fit-program/catalog-items"
              payload: { vendor_id: "${vendor_id}", sku: "NRTH-TEE-01", category_code: "TOPS", brand_size_system: "US_ALPHA", unit_price_cents: 2295 }
              as: MerchOpsAdmin
              captures: { item_id: $.data.id }
            - call: "POST /fit-program/catalog-items/${item_id}/list"
              payload: {}
              as: MerchOpsAdmin
            - call: "POST /fit-program/customer-profiles"
              payload: { email: "shopper-s7@example.com" }
              as: MerchOpsAdmin
              captures: { customer_id: $.data.id }
            - call: "POST /fit-program/return-policies"
              payload: { category_code: "TOPS", window_days: 30, restocking_applies: true, non_refundable_shipping: false, effective_from: "2026-01-01T00:00:00Z" }
              as: MerchOpsAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /fit-program/order-lines"
              payload: { customer_profile_id: "${customer_id}", item_id: "${item_id}", size_label: "M", quantity: 2, unit_price_cents: 2295, shipping_allocated_cents: 495, delivered_at: "2026-05-20T00:00:00Z" }
              as: MerchOpsAdmin
              captures: { line_id: $.data.id, gross: $.data.gross_line_cents }
            - call: "POST /fit-program/return-cases"
              payload: { order_line_id: "${line_id}", requested_reason_code: "FIT_TOO_SMALL" }
              as: Customer
              as_user_id: "${customer_id}"
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /fit-program/return-cases/${case_id}/classify"
              payload: { reason_code: "EXPECTATION_MISMATCH" }
              as: ReturnsAuditor
              as_user_id: "auditor-1"
              captures: { classified_status: $.data.status, family: $.data.reason_family }
            - call: "POST /fit-program/return-cases/${case_id}/resolve"
              payload: { item_condition: "RESELLABLE_B" }
              as: ReturnsAuditor
              as_user_id: "auditor-2"
              captures:
                resolved_status: $.data.status
                refund: $.data.refund_amount_cents
                fee: $.data.restocking_fee_cents
                total_cost: $.data.total_cost_cents
            - call: "GET /fit-program/catalog-items/${item_id}"
              payload: {}
              as: MerchOpsAdmin
              captures: { pdp_flag: $.data.pdp_review_required, watch: $.data.fit_watch_state, score: $.data.chronic_return_score_bp }
          assert:
            - "${gross} == 4590"
            - "${classified_status} == \"EXPECTATION_REVIEW\""
            - "${family} == \"EXPECTATION\""
            - "ReturnCase.${case_id}.requested_reason_code == \"FIT_TOO_SMALL\""
            - "ReturnCase.${case_id}.reason_code == \"EXPECTATION_MISMATCH\""
            - "${resolved_status} == \"RESOLVED_REFUNDED\""
            - "${fee} == 0"
            - "${refund} == 4590"
            - "${total_cost} == 2345"
            - "count(ReturnCostPosting where return_case_id == ${case_id}) == 5"
            - "ReturnCostPosting[component == \"PROCESSING_LABOR\"].amount_cents == 682"
            - "ReturnCostPosting[component == \"REFURB_REPACK\"].amount_cents == 184"
            - "ReturnCostPosting[component == \"MARKDOWN_LOSS\"].amount_cents == 551"
            - "ReturnCostPosting[component == \"PAYMENT_FEE_UNRECOVERED\"].amount_cents == 133"
            - "${pdp_flag} == true"
            - "CatalogItem.${item_id}.expectation_return_count == 1"
            - "CatalogItem.${item_id}.fit_return_count == 0"
            - "CatalogItem.${item_id}.total_return_count == 1"
            - "CatalogItem.${item_id}.expectation_return_rate_bp == 5000"
            - "CatalogItem.${item_id}.fit_return_rate_bp == 0"
            - "${score} == 1250"
            - "${watch} == \"NORMAL\""
            - "CatalogItem.${item_id}.listing_status == \"LISTED\""
            - "CatalogItem.${item_id}.return_cost_accrued_cents == 2345"
            - "OrderLine.${line_id}.status == \"RETURNED\""
            - "CustomerProfile.${customer_id}.refunded_total_cents == 4590"
            - "CustomerProfile.${customer_id}.change_of_mind_count == 0"
            - "CustomerProfile.${customer_id}.abuse_strike_count == 0"

      - name: suspended_item_relisted_by_publish_guidance_after_correction_and_void
        claim_type: valid_transition
        grounds:
          - state_machines.CatalogItem.listing_status.SUSPENDED_to_LISTED
          - state_machines.CatalogItem.fit_readiness.UNVERIFIED_to_CHART_MAPPED
          - state_machines.CatalogItem.fit_readiness.CHART_MAPPED_to_GUIDANCE_READY
          - state_machines.MeasurementSpec.status.CORRECTION_REQUESTED_to_SUBMITTED
          - state_machines.ReturnCase.status.RESOLVED_REFUNDED_to_VOIDED
          - calculations.item_chronic_return_score
          - calculations.mapping_coverage
        distinguishing_aspect: |
          The SUSPENDED -> LISTED transition is the only route out of suspension and it is
          guarded on fit_watch_state != CHRONIC plus every CHART_MAPPED -> GUIDANCE_READY
          precondition. After two FIT returns drive the item to CHRONIC (score
          floor(7500 * 10000 / 10000) = 7500, fit_return_count 2) and suspend it, voiding one
          case walks the score back to floor(7500 * 5000 / 10000) = 3750 with fit_return_count 1,
          i.e. WATCH - not NORMAL - and that is already enough to let re-publication relist the
          item, while the specification and listing transitions that already fired are NOT rolled
          back by the void: the spec must be resubmitted and re-verified and a replacement
          mapping created before publish-guidance can run.
