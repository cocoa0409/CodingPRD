            - { call: "POST /closet/donation-batches", payload: { donor_name: "Donor H", item_count_declared: 1 }, as: Volunteer, as_user_id: "${v1_id}", captures: { b_id: $.data.id } }
            - { call: "POST /closet/donation-batches/${b_id}/start-sorting", payload: {}, as: Volunteer, as_user_id: "${v1_id}" }
