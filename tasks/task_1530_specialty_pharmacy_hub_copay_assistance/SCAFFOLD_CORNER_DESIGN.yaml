      assert:
      - within-window report returns 201 (${ae_ok} assigned)
      - 'late report: HTTP 422 and ${err} == ERR_AE_REPORT_WINDOW_MISSED'
  - name: pagination_limit_out_of_bounds_returns_validation
    claim_type: pagination_with_filtering
    grounds:
    - response_envelope
    - errors[ERR_VALIDATION]
    distinguishing_aspect: 'Envelope pagination defaults pin limit min 1 / max 100: limit=0 and limit=101 are both 400 ERR_VALIDATION; limit=100 is accepted.'
    test_recipe:
      setup:
      - one enrollment exists
      setup_api_calls:
      - call: POST /hub/drug-programs
        payload:
          name: ProgPg
          manufacturer_name: Mfr
          diagnosis_code: C50
          requires_injection_training: false
          requires_cold_chain: false
          max_transit_hours: 0
          min_days_between_fills: 20
