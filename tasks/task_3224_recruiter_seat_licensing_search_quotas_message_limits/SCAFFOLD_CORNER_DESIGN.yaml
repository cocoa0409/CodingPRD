          full_name: Con One
          home_contract_id: ${cid}
        as: ContractAdmin
        captures:
          r1: $.data.id
      - call: GET /contracts/${cid}/seats
        as: ContractAdmin
        captures:
          s1: $.data.0.id
          s1v: $.data.0.version
      trigger:
      - call: POST /contracts/${cid}/seats/${s1}/assign
        payload:
          recruiter_id: ${r1}
          expected_seat_version: ${s1v}
        as: SeatAdmin
      - call: GET /contracts/${cid}
        as: ContractAdmin
        captures:
          sa: $.data.seats_assigned
      - call: GET /recruiters/${r1}
