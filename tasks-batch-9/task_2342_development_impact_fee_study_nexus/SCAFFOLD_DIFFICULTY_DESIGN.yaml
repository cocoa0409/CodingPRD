      - name: committed_demand_units_are_conserved_across_reassessment
        grounds:
          - state_machines.DevelopmentApplication.assessment_status=ASSESSED_to_assessment_status=REASSESSED
          - entities.FacilityCategory.fields.committed_demand_units
          - calculations.application_assessment
          - state_machines.CreditClaim.SUBMITTED_to_APPROVED_FULL
        distinguishing_aspect: |
          committed_demand_units is a running total that must be backed out before it
          is re-added: after the first assess PARKS holds 25.0000 and ROADS 10.1000, and an
          identical re-assess must leave them at 25.0000 and 10.1000 rather than doubling
          to 50.0000 and 20.2000. A credit approval then re-assesses the same application
          again and moves the money (net_due 5,189,521 -> 4,159,521) while the demand-unit
          totals stay identical, because credits change what is owed and not how much
          capacity is consumed.
