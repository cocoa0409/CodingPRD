            - { call: "POST /farm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T09:30:00Z" }, as: FarmManager }
            - { call: "POST /farm/sales-days/${day_id}/open-day", payload: {}, as: FarmManager }
            - { call: "POST /farm/fields/${f_id}/open", payload: {}, as: FarmManager }
            - { call: "POST /farm/field-day-windows", payload: { field_id: "${f_id}", date: "2026-08-04", open_time: "09:00", close_time: "17:00", picking_capacity_slots: 30 }, as: FarmManager, captures: { w_id: $.data.id } }
            - { call: "POST /farm/field-day-windows/${w_id}/open", payload: {}, as: FarmManager }
            - { call: "POST /farm/waivers", payload: { season_id: "${s_id}", signer_name: "Ann", signer_email: "ann@x.com", party_member_names: ["Ann"] }, as: Anonymous, captures: { wv_a: $.data.id } }
            - { call: "POST /farm/waivers", payload: { season_id: "${s_id}", signer_name: "Bob", signer_email: "bob@x.com", party_member_names: ["Bob"] }, as: Anonymous, captures: { wv_b: $.data.id } }
            - { call: "POST /farm/visit-sessions", payload: { window_id: "${w_id}", waiver_id: "${wv_a}", party_size: 1, container_count: 1, parking_spaces: 0, origin: "ONLINE" }, as: GateStaff, captures: { vs_a: $.data.id } }
            - { call: "POST /farm/visit-sessions", payload: { window_id: "${w_id}", waiver_id: "${wv_b}", party_size: 1, container_count: 1, parking_spaces: 0, origin: "ONLINE" }, as: GateStaff, captures: { vs_b: $.data.id } }
            - { call: "POST /farm/payments", payload: { session_id: "${vs_a}", kind: "CHARGE", method: "CASH", amount_cents: 850, idempotency_key: "ka" }, as: GateStaff }
            - { call: "POST /farm/payments", payload: { session_id: "${vs_b}", kind: "CHARGE", method: "CASH", amount_cents: 850, idempotency_key: "kb" }, as: GateStaff }
            - { call: "POST /farm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T12:00:00Z" }, as: FarmManager }
          trigger:
            - { call: "POST /farm/sales-days/${day_id}/close-weather", payload: {}, as: FarmManager, captures: { day_closed_at: $.data.closed_at_time } }
            - { call: "GET /farm/visit-sessions/${vs_a}", payload: {}, as: FarmManager, captures: { a_refunded: $.data.total_refunded_cents, a_payst: $.data.payment_status } }
            - { call: "GET /farm/visit-sessions/${vs_b}", payload: {}, as: FarmManager, captures: { b_refunded: $.data.total_refunded_cents } }
          assert:
            - "SalesDay.${day_id}.closed_at_time == '12:00' (pinned from the logical clock)"
            - "VisitSession.${vs_a}.total_refunded_cents == 525 (50% of admission component 650 -> 325, plus container 200 with zero FINALIZED lines)"
            - "VisitSession.${vs_b}.total_refunded_cents == 525"
            - "525 != 850 (the 100% tier does NOT apply at exactly 12:00:00 — lower bound of the half tier is inclusive)"
