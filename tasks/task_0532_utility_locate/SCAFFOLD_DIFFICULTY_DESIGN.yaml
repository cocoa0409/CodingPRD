  - rule_id: compensating_invariant
    instances:
      - name: tech_active_assignment_count_conserved_on_cancel
        grounds:
          - state_machines.LocateAssignment.DISPATCHED_to_CANCELLED
          - entities.LocateTech.fields.active_assignment_count
          - calculations.assignment_sla
        distinguishing_aspect: |
          Conserved quantity #1 (a counter): after dispatch (active_assignment_count += 1) followed
          by its compensating cancel (active_assignment_count -= 1), tech.active_assignment_count
          equals its pre-dispatch value 0 — pinned as count of the tech's DISPATCHED/EN_ROUTE
          assignments.
        test_recipe:
          setup:
            - "Cleared ticket; tech starts with active_assignment_count=0; dispatch then cancel."
          setup_api_calls:
            - call: "POST /excavators"
              payload: { company_name: "DigCo", contact_email: "d17@x.com", state_code: "CA" }
              as: CallCenter
              captures: { exc_id: $.data.id }
            - call: "POST /member-utilities"
              payload: { name: "Gas Co", facility_type: "GAS", service_polygon: { min_x: 0, min_y: 0, max_x: 100, max_y: 100 } }
              as: CallCenter
              captures: { mem_id: $.data.id }
            - call: "POST /locate-techs"
              payload: { full_name: "Tina", member_utility_id: "${mem_id}", certified_facility_types: ["GAS"] }
              as: CallCenter
              captures: { tech_id: $.data.id }
            - call: "POST /locate-tickets"
              payload: { excavator_id: "${exc_id}", ticket_type: "EMERGENCY", dig_polygon: { min_x: 10, min_y: 10, max_x: 20, max_y: 20 }, work_description: "job" }
              as: Excavator
              as_user_id: "${exc_id}"
              captures: { ticket_id: $.data.id }
            - call: "POST /locate-tickets/${ticket_id}/submit"
              payload: {}
              as: Excavator
              as_user_id: "${exc_id}"
            - call: "GET /utility-notifications"
              payload: { ticket_id: "${ticket_id}" }
              as: FacilityOwner
              as_user_id: "${mem_id}"
              captures: { note_id: $.data.0.id }
            - call: "POST /positive-responses"
              payload: { notification_id: "${note_id}", outcome: "CLEAR" }
              as: FacilityOwner
              as_user_id: "${mem_id}"
            - call: "POST /locate-assignments"
              payload: { ticket_id: "${ticket_id}", notification_id: "${note_id}", locate_tech_id: "${tech_id}" }
              as: FacilityOwner
              as_user_id: "${mem_id}"
              captures: { asg_id: $.data.id }
          trigger:
            - call: "POST /locate-assignments/${asg_id}/cancel"
              payload: {}
              as: FacilityOwner
              as_user_id: "${mem_id}"
            - call: "GET /locate-techs/${tech_id}"
              payload: {}
              as: FacilityOwner
              as_user_id: "${mem_id}"
              captures: { cnt: $.data.active_assignment_count }
          assert:
            - "LocateTech.${tech_id}.active_assignment_count == 0"

      - name: ticket_open_response_count_conserved_on_markout_expiry
        grounds:
          - state_machines.MarkOut.COMPLETE_to_SUPERSEDED
          - entities.LocateTicket.fields.markout_completed_at
          - calculations.dig_window
        distinguishing_aspect: |
          Conserved quantity #2 (a timestamp/window, different type than the counter): after a
          refresh mark-out supersedes the first, ticket.markout_completed_at equals exactly the
          refresh's completed_at and the ticket has exactly one active (COMPLETE) mark-out — the
          count of COMPLETE mark-outs for the ticket is conserved at 1 across the refresh (old
          SUPERSEDED, new COMPLETE), leaving no drift.
        test_recipe:
          setup:
            - "Ticket MARKED via mk1 at default clock; clock advanced to 2026-05-02T00:00:00Z; refresh mk2 created & completed."
          setup_api_calls:
            - call: "POST /excavators"
              payload: { company_name: "DigCo", contact_email: "d18@x.com", state_code: "CA" }
              as: CallCenter
              captures: { exc_id: $.data.id }
            - call: "POST /member-utilities"
              payload: { name: "Gas Co", facility_type: "GAS", service_polygon: { min_x: 0, min_y: 0, max_x: 100, max_y: 100 } }
              as: CallCenter
              captures: { mem_id: $.data.id }
            - call: "POST /locate-techs"
              payload: { full_name: "Tina", member_utility_id: "${mem_id}", certified_facility_types: ["GAS"] }
              as: CallCenter
              captures: { tech_id: $.data.id }
            - call: "POST /locate-tickets"
              payload: { excavator_id: "${exc_id}", ticket_type: "EMERGENCY", dig_polygon: { min_x: 10, min_y: 10, max_x: 20, max_y: 20 }, work_description: "job" }
              as: Excavator
              as_user_id: "${exc_id}"
              captures: { ticket_id: $.data.id }
            - call: "POST /locate-tickets/${ticket_id}/submit"
              payload: {}
              as: Excavator
              as_user_id: "${exc_id}"
            - call: "GET /utility-notifications"
              payload: { ticket_id: "${ticket_id}" }
              as: FacilityOwner
              as_user_id: "${mem_id}"
              captures: { note_id: $.data.0.id }
            - call: "POST /positive-responses"
              payload: { notification_id: "${note_id}", outcome: "CLEAR" }
              as: FacilityOwner
              as_user_id: "${mem_id}"
            - call: "POST /locate-assignments"
              payload: { ticket_id: "${ticket_id}", notification_id: "${note_id}", locate_tech_id: "${tech_id}" }
              as: FacilityOwner
              as_user_id: "${mem_id}"
              captures: { asg_id: $.data.id }
            - call: "POST /locate-assignments/${asg_id}/en-route"
              payload: {}
              as: LocateTech
              as_user_id: "${tech_id}"
            - call: "POST /mark-outs"
              payload: { assignment_id: "${asg_id}", ticket_id: "${ticket_id}", marks_count: 3 }
              as: LocateTech
              as_user_id: "${tech_id}"
              captures: { mk1_id: $.data.id }
            - call: "POST /mark-outs/${mk1_id}/complete"
              payload: {}
              as: LocateTech
              as_user_id: "${tech_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T00:00:00Z" }
              as: Admin
            - call: "GET /locate-tickets/${ticket_id}"
              payload: {}
              as: LocateTech
              as_user_id: "${tech_id}"
              captures: { tv: $.data.version }
            - call: "POST /mark-outs"
              payload: { assignment_id: "${asg_id}", ticket_id: "${ticket_id}", marks_count: 7, supersedes_markout_id: "${mk1_id}", expected_ticket_version: "${tv}" }
              as: LocateTech
              as_user_id: "${tech_id}"
              captures: { mk2_id: $.data.id }
          trigger:
            - call: "POST /mark-outs/${mk2_id}/complete"
              payload: {}
              as: LocateTech
              as_user_id: "${tech_id}"
            - call: "GET /locate-tickets/${ticket_id}"
              payload: {}
              as: LocateTech
              as_user_id: "${tech_id}"
              captures: { mca: $.data.markout_completed_at }
          assert:
            - "LocateTicket.${ticket_id}.markout_completed_at == '2026-05-02T00:00:00Z'"
            - "LocateTicket.${ticket_id}.dig_window_expires_at == '2026-05-23T00:00:00Z'"
            - "MarkOut.${mk1_id}.status == 'SUPERSEDED' and MarkOut.${mk2_id}.status == 'COMPLETE'"
