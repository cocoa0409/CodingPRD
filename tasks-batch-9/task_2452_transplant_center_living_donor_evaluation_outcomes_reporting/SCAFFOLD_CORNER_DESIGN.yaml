  - name: newer_improvement_plan_supersedes_the_rejected_one
    claim_type: valid_transition
    grounds:
    - state_machines.ImprovementPlan.SUBMITTED_to_REJECTED
    - state_machines.ImprovementPlan.REJECTED_to_SUPERSEDED
    - concurrency_rules[improvement-plan-create-stale-review]
    - calculations.compliance_posture
    distinguishing_aspect: SUPERSEDED is reached by a SYSTEM transition fired from the creation of a sibling
      row, and it applies to the REJECTED plan (not only to SUBMITTED ones) while the posture stays FROZEN
      because nothing is ACCEPTED yet.
    test_recipe:
      setup:
      - A FINALIZED review (cohort 25, observed 16 -> oe_ratio 0.8000, FLAGGED) has frozen the program.
      - A first improvement plan was filed and then REJECTED by the ProgramAdmin.
      - rev_v2 is the review version read AFTER the first plan creation bumped it.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T00:00:00Z'
        as: ProgramAdmin
      - call: POST /programs
        payload:
          name: Northlake Transplant Center
          center_code: NLT-01
          organ_type: KIDNEY
          cooling_off_days: 7
          follow_up_completeness_threshold_pct: 80
          follow_up_compliance_threshold_pct: 75
          expected_one_year_survival_rate: 0.8
          donor_fund_pool_cents: 5000000
          lost_wage_daily_cap_cents: 30000
          lost_wage_weekly_cap_cents: 150000
        as: ProgramAdmin
        captures:
          prog_id: $.data.id
      - call: POST /staff-members
        payload:
          program_id: ${prog_id}
          full_name: Quality Officer One
          staff_role: QUALITY_OFFICER
          npi: '1000000005'
        as: ProgramAdmin
        captures:
          qo_id: $.data.id
      - call: POST /outcome-reviews
        payload:
          program_id: ${prog_id}
          period_start_on: '2025-01-01'
          period_end_on: '2025-12-31'
          cohort_size: 25
          observed_survivor_count: 16
