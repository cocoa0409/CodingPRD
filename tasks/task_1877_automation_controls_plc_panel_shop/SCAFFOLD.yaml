scenario: |
  1877. Automation Controls & PLC Panel Shop (UL 508A panel builder): panel design &
  UL 508A labeling, component lead time & substitution approval, wiring & point-to-point
  test, program version control & site backup, startup support & remote access policy,
  as-built documentation package, change order for scope creep, warranty on control logic.

domain_name: ul508a-panel-shop
api_prefix: /panel-shop

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: company_name
        type: string
        source: input
        description: Legal company name of the end customer.
      - name: site_state_code
        type: string
        source: input
        description: Two-letter US state code of the installation site; used for freight zone and warranty labor dispatch tier.
      - name: credit_hold
        type: boolean
        source: input
        description: When true, new Jobs for this customer are rejected and open ChangeOrders cannot be approved.
        default: false
      - name: warranty_labor_tier
        type: enum
        source: input
        description: Dispatch tier for warranty labor rate selection.
        constraints: "enum {TIER_LOCAL, TIER_REGIONAL, TIER_NATIONAL}"
        default: TIER_REGIONAL

  - name: Job
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; owning customer of the panel build contract."
      - name: job_number
        type: string
        source: input
        description: Human-readable job number; unique per customer.
        constraints: "unique within (customer_id)"
      - name: status
        type: enum
        source: system
        description: Compound posture derived from child Panels and open ChangeOrders.
        constraints: "enum {OPEN, DESIGN, PROCUREMENT, BUILD, TEST, READY_TO_SHIP, SHIPPED, COMMISSIONED, CLOSED, ON_HOLD}"
        default: OPEN
      - name: quoted_price_cents
        type: integer
        source: input
        description: Original contract price in cents before any approved ChangeOrders.
        constraints: ">= 0"
      - name: approved_co_delta_cents
        type: integer
        source: computed
        description: Running sum of approved ChangeOrder.price_delta_cents; recomputed on every ChangeOrder approval or rescind.
        default: 0
      - name: contract_price_cents
        type: integer
        source: computed
        description: quoted_price_cents + approved_co_delta_cents; recomputed whenever approved_co_delta_cents changes.
      - name: warranty_months
        type: integer
        source: input
        description: Control-logic warranty duration in months, starting at COMMISSIONED transition.
        constraints: ">= 0 and <= 60"
        default: 12
      - name: warranty_expires_at
        type: datetime
        source: computed
        description: Set at COMMISSIONED transition to commissioned_at + warranty_months; null until then.

  - name: Panel
    parent: Job
    common_fields: true
    fields:
      - name: job_id
        type: string
        source: input
        description: "FK -> Job.id; parent job of this panel."
      - name: panel_tag
        type: string
        source: input
        description: Physical nameplate tag, e.g. 'MCC-01'; unique within the job.
        constraints: "unique within (job_id)"
      - name: status
        type: enum
        source: system
        description: Panel lifecycle with cyclic design-review loop and branching test outcome.
        constraints: "enum {DESIGN, DESIGN_REVIEW, DESIGN_APPROVED, PROCUREMENT, WIRING, POINT_TO_POINT, TEST_PASSED, TEST_FAILED, READY_FOR_LABEL, LABELED, SHIPPED, COMMISSIONED}"
        default: DESIGN
      - name: enclosure_rating
        type: enum
        source: input
        description: NEMA enclosure rating driving heat-load derating variant selection.
        constraints: "enum {NEMA_1, NEMA_12, NEMA_4, NEMA_4X}"
      - name: design_engineer_id
        type: string
        source: input
        description: User id of the DesignEngineer who authored the design; recorded for segregation-of-duties checks (designer may not verify own wiring or approve own substitution).
      - name: sccr_rating_ka
        type: integer
        source: computed
        description: Panel short-circuit current rating in kA; computed as the minimum over the weakest-link SCCR chain per calculation sccr_panel_rating.
      - name: label_serial
        type: string
        source: system
        description: UL 508A label serial minted at LABELED transition; format 'UL-<job_number>-<panel_tag>-<seq>'.
      - name: shipped_at
        type: datetime
        source: system
        description: Timestamp of SHIPPED transition; null before.
      - name: commissioned_at
        type: datetime
        source: system
        description: Timestamp of COMMISSIONED transition; null before.

  - name: Component
    parent: null
    common_fields: true
    fields:
      - name: part_number
        type: string
        source: input
        description: Manufacturer part number; globally unique.
        constraints: "unique"
      - name: component_class
        type: enum
        source: input
        description: UL 508A component class used by SCCR weakest-link chain.
        constraints: "enum {DISCONNECT, BRANCH_PROTECTIVE, CONTACTOR, OVERLOAD, CONTROL_POWER, PLC_IO, TERMINAL, WIRE_DUCT, PILOT_DEVICE, POWER_SUPPLY}"
      - name: unit_cost_cents
        type: integer
        source: input
        description: Current purchase cost in cents.
        constraints: ">= 0"
      - name: lead_time_days
        type: integer
        source: input
        description: Vendor-quoted standard lead time in calendar days.
        constraints: ">= 0"
      - name: sccr_ka
        type: integer
        source: input
        description: Component-level short-circuit current rating in kA; null only for classes without a fault rating (WIRE_DUCT, TERMINAL).
        constraints: ">= 1 when present"
      - name: heat_dissipation_w
        type: number
        source: input
        description: Worst-case heat dissipation in watts at full load.
        constraints: ">= 0"
      - name: active
        type: boolean
        source: input
        description: Inactive components may not be added to new BOM lines but remain readable for existing as-built records.
        default: true

  - name: PanelComponent
    parent: Panel
    common_fields: true
    fields:
      - name: panel_id
        type: string
        source: input
        description: "FK -> Panel.id; panel whose BOM this line belongs to."
      - name: component_id
        type: string
        source: input
        description: "FK -> Component.id; catalog component on this BOM line."
      - name: quantity
        type: integer
        source: input
        description: Unit quantity on the BOM line.
        constraints: ">= 1"
      - name: line_status
        type: enum
        source: system
        description: Procurement posture of this BOM line.
        constraints: "enum {PENDING, ORDERED, RECEIVED, SUBSTITUTED}"
        default: PENDING
      - name: substituted_for_id
        type: string
        source: system
        description: "FK -> PanelComponent.id; when this line is the product of an approved substitution, points to the original line it replaces; null otherwise."
      - name: extended_cost_cents
        type: integer
        source: computed
        description: Per-line rounded cost = round_half_up(quantity * unit_cost_snapshot_cents, 0); recomputed when quantity changes or substitution swaps the snapshot.
      - name: unit_cost_snapshot_cents
        type: integer
        source: system
        description: Component.unit_cost_cents captured at line creation (or substitution approval); shields BOM rollup from later catalog price drift.

  - name: SubstitutionRequest
    parent: Panel
    common_fields: true
    fields:
      - name: panel_id
        type: string
        source: input
        description: "FK -> Panel.id; panel whose BOM line needs substitution."
      - name: original_line_id
        type: string
        source: input
        description: "FK -> PanelComponent.id; the BOM line whose component is unavailable."
      - name: proposed_component_id
        type: string
        source: input
        description: "FK -> Component.id; the proposed replacement component."
      - name: status
        type: enum
        source: system
        description: Cyclic negotiation between engineer and customer.
        constraints: "enum {REQUESTED, COUNTERED, APPROVED, REJECTED, WITHDRAWN}"
        default: REQUESTED
      - name: reason
        type: string
        source: input
        description: Free-text reason (lead time, obsolescence, cost).
      - name: requested_by_id
        type: string
        source: system
        description: User id of the requester (DesignEngineer); the approving QAManager or customer must differ (segregation of duties).
      - name: lead_time_delta_days
        type: integer
        source: computed
        description: Signed delta of proposed vs original lead time, per calculation substitution_lead_time_delta (variant depends on Job.status).
      - name: sccr_impact_ka
        type: integer
        source: computed
        description: Panel sccr_rating_ka that WOULD result if substitution is approved; computed at approval time and recorded for audit.

  - name: TestPoint
    parent: Panel
    common_fields: false
    fields:
      - name: panel_id
        type: string
        source: input
        description: "FK -> Panel.id; panel under point-to-point test."
      - name: point_label
        type: string
        source: input
        description: Wire-number / terminal designation, e.g. 'TB1-14 to PLC-I0.3'.
      - name: expected_signal
        type: enum
        source: input
        description: Expected electrical characteristic at this point.
        constraints: "enum {CONTINUITY, VOLTAGE_24VDC, VOLTAGE_120VAC, ANALOG_4_20MA, ISOLATION}"
      - name: sequence_no
        type: integer
        source: input
        description: Execution order of this point within the panel's test plan; unique per panel.
        constraints: "unique within (panel_id), >= 1"
      - name: result
        type: enum
        source: system
        description: Recorded outcome of the most recent TestSession execution for this point.
        constraints: "enum {UNTESTED, PASS, FAIL, SKIPPED}"
        default: UNTESTED

  - name: TestSession
    parent: Panel
    common_fields: true
    fields:
      - name: panel_id
        type: string
        source: input
        description: "FK -> Panel.id; panel under test."
      - name: technician_id
        type: string
        source: input
        description: User id of the TestTechnician executing the session; MUST differ from Panel.design_engineer_id (segregation of duties).
      - name: status
        type: enum
        source: system
        description: Session lifecycle.
        constraints: "enum {OPEN, COMPLETED, ABORTED}"
        default: OPEN
      - name: started_at
        type: datetime
        source: system
        description: Session open timestamp.
      - name: completed_at
        type: datetime
        source: system
        description: Session completion timestamp; null while OPEN.
      - name: pass_count
        type: integer
        source: computed
        description: Count of TestPoints with result == PASS recorded by this session.
        default: 0
      - name: fail_count
        type: integer
        source: computed
        description: Count of TestPoints with result == FAIL recorded by this session.
        default: 0

  - name: ProgramVersion
    parent: Panel
    common_fields: false
    fields:
      - name: panel_id
        type: string
        source: input
        description: "FK -> Panel.id; panel whose PLC program this version belongs to."
      - name: version_tag
        type: string
        source: input
        description: Human tag like 'v1.2.0'; unique per panel.
        constraints: "unique within (panel_id)"
      - name: status
        type: enum
        source: system
        description: Lifecycle with supersede-on-release semantics.
        constraints: "enum {DRAFT, RELEASED, SUPERSEDED, ARCHIVED}"
        default: DRAFT
      - name: content_hash
        type: string
        source: input
        description: SHA-256 hex of the compiled program archive; uniqueness per panel enforced.
        constraints: "unique within (panel_id)"
      - name: site_backup_taken
        type: boolean
        source: input
        description: True once the commissioning engineer has captured a site backup image of this version.
        default: false
      - name: released_at
        type: datetime
        source: system
        description: Timestamp of RELEASED transition; null until released.

  - name: StartupSession
    parent: Panel
    common_fields: true
    fields:
      - name: panel_id
        type: string
        source: input
        description: "FK -> Panel.id; panel being commissioned on site."
      - name: scheduled_start
        type: datetime
        source: input
        description: Start of the commissioning window (UTC).
      - name: scheduled_end
        type: datetime
        source: input
        description: End of the commissioning window (UTC); must be strictly after scheduled_start.
      - name: status
        type: enum
        source: system
        description: Scheduled-window state machine with cancellation and no-show handling.
        constraints: "enum {SCHEDULED, IN_PROGRESS, COMPLETED, NO_SHOW, CANCELLED}"
        default: SCHEDULED
      - name: remote_access_granted
        type: boolean
        source: input
        description: Whether the customer grants VPN/remote access for this session; required for remote support mode.
        default: false
      - name: support_mode
        type: enum
        source: input
        description: ONSITE or REMOTE; REMOTE requires remote_access_granted == true.
        constraints: "enum {ONSITE, REMOTE}"
        default: ONSITE
      - name: engineer_id
        type: string
        source: input
        description: User id of the FieldEngineer performing startup support.
      - name: labor_hours
        type: number
        source: input
        description: Actual labor hours logged at completion; used by startup_labor_billing calculation.
        default: 0
      - name: billable_cents
        type: integer
        source: computed
        description: Billed amount computed by startup_labor_billing at completion; null while not COMPLETED.

  - name: ChangeOrder
    parent: Job
    common_fields: true
    fields:
      - name: job_id
        type: string
        source: input
        description: "FK -> Job.id; job whose scope/price this order amends."
      - name: co_number
        type: integer
        source: system
        description: Monotonic sequence within the job, assigned at creation (1, 2, 3...); ordering by co_number, never id.
      - name: status
        type: enum
        source: system
        description: Cyclic negotiation loop PROPOSED <-> REVISED then terminal.
        constraints: "enum {PROPOSED, REVISED, APPROVED, REJECTED, WITHDRAWN, SUPERSEDED}"
        default: PROPOSED
      - name: description
        type: string
        source: input
        description: Scope-creep description of the change.
      - name: price_delta_cents
        type: integer
        source: input
        description: Signed price delta in cents (positive = customer pays more).
      - name: discount_pct
        type: number
        source: input
        description: Negotiated discount percent applied per calculation change_order_pricing.
        default: 0
        constraints: ">= 0 and <= 0.5"
      - name: computed_delta_cents
        type: integer
        source: computed
        description: Discounted delta after change_order_pricing; this is the value summed into Job.approved_co_delta_cents on approval.
      - name: requested_by_id
        type: string
        source: system
        description: User id of the ProjectManager who drafted the order; approver (Customer) is a different role, and a self-approval check pins requested_by_id != approver's linked identity when roles overlap.
      - name: supersedes_co_id
        type: string
        source: system
        description: "FK -> ChangeOrder.id; set when approval of this order explicitly supersedes a prior PROPOSED/REVISED order named in the approve payload; null otherwise."

  - name: WarrantyClaim
    parent: Job
    common_fields: true
    fields:
      - name: job_id
        type: string
        source: input
        description: "FK -> Job.id; the job whose control logic is claimed defective."
      - name: panel_id
        type: string
        source: input
        description: "FK -> Panel.id; the specific panel whose logic is implicated."
      - name: status
        type: enum
        source: system
        description: Branching triage machine with compensation on denial after provisional accrual.
        constraints: "enum {FILED, TRIAGED, ACCEPTED, DENIED, SETTLED, CLOSED}"
        default: FILED
      - name: defect_description
        type: string
        source: input
        description: Description of the control-logic defect.
      - name: filed_at
        type: datetime
        source: system
        description: Filing timestamp; must be <= job.warranty_expires_at for the claim to be admissible.
      - name: claimed_labor_hours
        type: number
        source: input
        description: Labor hours the customer claims for remediation.
        constraints: ">= 0"
      - name: provisional_liability_cents
        type: integer
        source: computed
        description: Provisional accrual per warranty_liability (provisional variant) at TRIAGED transition.
      - name: final_liability_cents
        type: integer
        source: computed
        description: Final adjudicated liability per warranty_liability (final variant) at ACCEPTED transition; 0 when DENIED.
      - name: liability_delta_cents
        type: integer
        source: computed
        description: final_liability_cents - provisional_liability_cents; reconciles the accrual ledger at acceptance (or reversal at denial).

  - name: AsBuiltPackage
    parent: Panel
    common_fields: true
    fields:
      - name: panel_id
        type: string
        source: input
        description: "FK -> Panel.id; panel this documentation package belongs to (1:1)."
      - name: status
        type: enum
        source: system
        description: Compound posture derived from required document artifacts.
        constraints: "enum {INCOMPLETE, PENDING_REVIEW, APPROVED, RELEASED}"
        default: INCOMPLETE
      - name: has_wiring_diagram
        type: boolean
        source: input
        description: As-built wiring diagram uploaded.
        default: false
      - name: has_program_archive
        type: boolean
        source: input
        description: Released ProgramVersion archive attached.
        default: false
      - name: has_test_report
        type: boolean
        source: input
        description: Signed point-to-point test report attached.
        default: false
      - name: has_ul_label_photo
        type: boolean
        source: input
        description: Photo of the affixed UL 508A label attached.
        default: false
      - name: completeness_pct
        type: integer
        source: computed
        description: Weighted completeness percentage per as_built_completeness calculation; 0-100.
        default: 0

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Job
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: DESIGN
        trigger: "POST /panel-shop/jobs/{id}/advance (first Panel created for the job also advances it)"
        actor: ProjectManager
        preconditions:
          - "Job.status == OPEN"
          - "Customer.credit_hold == false for Job.customer_id"
        side_effects:
          - "Job.version incremented by 1"
      - from: DESIGN
        to: PROCUREMENT
        trigger: "system auto-advance when every Panel of this Job has status in {DESIGN_APPROVED, PROCUREMENT, WIRING, POINT_TO_POINT, TEST_PASSED, READY_FOR_LABEL, LABELED, SHIPPED, COMMISSIONED} and at least one Panel exists"
        actor: system
        preconditions:
          - "count(Panel where panel.job_id == Job.id) >= 1"
          - "all such Panels have status != DESIGN and != DESIGN_REVIEW"
        side_effects:
          - "Job.version incremented by 1"
      - from: PROCUREMENT
        to: BUILD
        trigger: "system auto-advance when every PanelComponent line of every Panel of this Job has line_status in {RECEIVED, SUBSTITUTED}"
        actor: system
        preconditions:
          - "at least one PanelComponent line exists across the Job's Panels"
          - "no PanelComponent line has line_status in {PENDING, ORDERED}"
        side_effects:
          - "Job.version incremented by 1"
      - from: BUILD
        to: TEST
        trigger: "system auto-advance when every Panel of this Job has reached POINT_TO_POINT or beyond"
        actor: system
        preconditions:
          - "all Panels have status in {POINT_TO_POINT, TEST_PASSED, TEST_FAILED, READY_FOR_LABEL, LABELED, SHIPPED, COMMISSIONED}"
        side_effects:
          - "Job.version incremented by 1"
      - from: TEST
        to: READY_TO_SHIP
        trigger: "system auto-advance when every Panel of this Job has status TEST_PASSED or beyond, and every Panel's AsBuiltPackage.status == RELEASED"
        actor: system
        preconditions:
          - "all Panels in {TEST_PASSED, READY_FOR_LABEL, LABELED, SHIPPED, COMMISSIONED}"
          - "every Panel's AsBuiltPackage (matched by AsBuiltPackage.panel_id == Panel.id) has status == RELEASED"
        side_effects:
          - "Job.version incremented by 1"
      - from: READY_TO_SHIP
        to: SHIPPED
        trigger: "POST /panel-shop/jobs/{id}/ship"
        actor: ShippingClerk
        preconditions:
          - "Job.status == READY_TO_SHIP"
        side_effects:
          - "every Panel in {TEST_PASSED, READY_FOR_LABEL, LABELED} transitions to SHIPPED with shipped_at set"
          - "Job.version incremented by 1"
      - from: SHIPPED
        to: COMMISSIONED
        trigger: "system auto-advance when every Panel has status COMMISSIONED"
        actor: system
        preconditions:
          - "all Panels have status == COMMISSIONED"
        side_effects:
          - "Job.warranty_expires_at := max(Panel.commissioned_at) + Job.warranty_months months"
          - "Job.version incremented by 1"
      - from: COMMISSIONED
        to: CLOSED
        trigger: "POST /panel-shop/jobs/{id}/close"
        actor: ProjectManager
        preconditions:
          - "Job.status == COMMISSIONED"
          - "no ChangeOrder of this Job has status in {PROPOSED, REVISED}"
          - "no WarrantyClaim of this Job has status in {FILED, TRIAGED, ACCEPTED}"
        side_effects:
          - "Job.version incremented by 1"
      - from: DESIGN
        to: ON_HOLD
        trigger: "POST /panel-shop/jobs/{id}/hold"
        actor: ProjectManager
        preconditions: ["Job.status in {DESIGN, PROCUREMENT, BUILD, TEST}"]
        side_effects: ["Job.version incremented by 1"]
      - from: PROCUREMENT
        to: ON_HOLD
        trigger: "POST /panel-shop/jobs/{id}/hold"
        actor: ProjectManager
        preconditions: ["Job.status in {DESIGN, PROCUREMENT, BUILD, TEST}"]
        side_effects: ["Job.version incremented by 1"]
      - from: BUILD
        to: ON_HOLD
        trigger: "POST /panel-shop/jobs/{id}/hold"
        actor: ProjectManager
        preconditions: ["Job.status in {DESIGN, PROCUREMENT, BUILD, TEST}"]
        side_effects: ["Job.version incremented by 1"]
      - from: TEST
        to: ON_HOLD
        trigger: "POST /panel-shop/jobs/{id}/hold"
        actor: ProjectManager
        preconditions: ["Job.status in {DESIGN, PROCUREMENT, BUILD, TEST}"]
        side_effects: ["Job.version incremented by 1"]
      - from: ON_HOLD
        to: DESIGN
        trigger: "POST /panel-shop/jobs/{id}/resume — returns to the posture its Panels currently imply, re-evaluated by the posture engine; DESIGN is the floor"
        actor: ProjectManager
        preconditions: ["Job.status == ON_HOLD", "Customer.credit_hold == false"]
        side_effects: ["Job.version incremented by 1", "posture engine immediately re-derives status from children"]

  - entity: Panel
    initial_state: DESIGN
    terminal_states: [COMMISSIONED]
    transitions:
      - from: DESIGN
        to: DESIGN_REVIEW
        trigger: "POST /panel-shop/panels/{id}/submit-review"
        actor: DesignEngineer
        preconditions:
          - "Panel.status == DESIGN"
          - "at least one PanelComponent line exists for this Panel"
          - "Panel.sccr_rating_ka >= 5 (UL 508A minimum labelable SCCR)"
        side_effects: ["Panel.version incremented by 1"]
      - from: DESIGN_REVIEW
        to: DESIGN_APPROVED
        trigger: "POST /panel-shop/panels/{id}/approve-design"
        actor: QAManager
        preconditions:
          - "Panel.status == DESIGN_REVIEW"
          - "acting QAManager user id != Panel.design_engineer_id (segregation of duties)"
        side_effects: ["Panel.version incremented by 1"]
      - from: DESIGN_REVIEW
        to: DESIGN
        trigger: "POST /panel-shop/panels/{id}/reject-design (revision loop)"
        actor: QAManager
        preconditions: ["Panel.status == DESIGN_REVIEW"]
        side_effects: ["Panel.version incremented by 1"]
      - from: DESIGN_APPROVED
        to: PROCUREMENT
        trigger: "POST /panel-shop/panels/{id}/release-procurement"
        actor: ProjectManager
        preconditions:
          - "Panel.status == DESIGN_APPROVED"
          - "Job.status in {DESIGN, PROCUREMENT} (parent gate)"
        side_effects:
          - "every PanelComponent line of this Panel with line_status == PENDING transitions to ORDERED"
          - "Panel.version incremented by 1"
      - from: PROCUREMENT
        to: WIRING
        trigger: "POST /panel-shop/panels/{id}/start-wiring"
        actor: ShopLead
        preconditions:
          - "Panel.status == PROCUREMENT"
          - "every PanelComponent line of this Panel has line_status in {RECEIVED, SUBSTITUTED}"
        side_effects: ["Panel.version incremented by 1"]
      - from: WIRING
        to: POINT_TO_POINT
        trigger: "POST /panel-shop/panels/{id}/begin-test"
        actor: ShopLead
        preconditions:
          - "Panel.status == WIRING"
          - "at least one TestPoint exists for this Panel"
        side_effects: ["Panel.version incremented by 1"]
      - from: POINT_TO_POINT
        to: TEST_PASSED
        trigger: "system auto-transition when a TestSession completes with fail_count == 0 and every TestPoint of the Panel has result == PASS"
        actor: system
        preconditions:
          - "the completing TestSession has fail_count == 0"
          - "all TestPoints of this Panel have result == PASS (no UNTESTED, no SKIPPED)"
        side_effects:
          - "Panel.version incremented by 1"
          - "AsBuiltPackage.has_test_report := true and AsBuiltPackage recomputes completeness_pct"
      - from: POINT_TO_POINT
        to: TEST_FAILED
        trigger: "system auto-transition when a TestSession completes with fail_count >= 1"
        actor: system
        preconditions: ["the completing TestSession has fail_count >= 1"]
        side_effects: ["Panel.version incremented by 1"]
      - from: TEST_FAILED
        to: WIRING
        trigger: "POST /panel-shop/panels/{id}/rework (failure loop back to wiring)"
        actor: ShopLead
        preconditions: ["Panel.status == TEST_FAILED"]
        side_effects:
          - "all TestPoints of this Panel reset result := UNTESTED"
          - "Panel.version incremented by 1"
      - from: TEST_PASSED
        to: READY_FOR_LABEL
        trigger: "POST /panel-shop/panels/{id}/request-label"
        actor: QAManager
        preconditions:
          - "Panel.status == TEST_PASSED"
          - "at least one ProgramVersion of this Panel has status == RELEASED"
          - "no SubstitutionRequest of this Panel has status in {REQUESTED, COUNTERED}"
        side_effects: ["Panel.version incremented by 1"]
      - from: READY_FOR_LABEL
        to: LABELED
        trigger: "POST /panel-shop/panels/{id}/affix-label"
        actor: QAManager
        preconditions:
          - "Panel.status == READY_FOR_LABEL"
          - "acting QAManager user id != Panel.design_engineer_id"
        side_effects:
          - "Panel.label_serial := 'UL-' + Job.job_number + '-' + Panel.panel_tag + '-1'"
          - "AsBuiltPackage.has_ul_label_photo := true and completeness recompute"
          - "Panel.version incremented by 1"
      - from: LABELED
        to: SHIPPED
        trigger: "cascade from Job READY_TO_SHIP -> SHIPPED (POST /panel-shop/jobs/{id}/ship)"
        actor: ShippingClerk
        preconditions: ["Panel.status in {TEST_PASSED, READY_FOR_LABEL, LABELED}"]
        side_effects: ["Panel.shipped_at := now", "Panel.version incremented by 1"]
      - from: SHIPPED
        to: COMMISSIONED
        trigger: "system auto-transition when a StartupSession for this Panel reaches COMPLETED"
        actor: system
        preconditions:
          - "the completing StartupSession has status transition IN_PROGRESS -> COMPLETED"
          - "a RELEASED ProgramVersion with site_backup_taken == true exists for this Panel"
        side_effects:
          - "Panel.commissioned_at := now"
          - "Panel.version incremented by 1"
          - "Job posture re-evaluated (COMMISSIONED when all panels commissioned)"

  - entity: SubstitutionRequest
    initial_state: REQUESTED
    terminal_states: [APPROVED, REJECTED, WITHDRAWN]
    transitions:
      - from: REQUESTED
        to: COUNTERED
        trigger: "POST /panel-shop/substitution-requests/{id}/counter"
        actor: Customer
        preconditions:
          - "SubstitutionRequest.status == REQUESTED"
          - "acting Customer id == Job.customer_id of the owning Panel (ownership check)"
        side_effects: ["SubstitutionRequest.version incremented by 1"]
      - from: COUNTERED
        to: REQUESTED
        trigger: "POST /panel-shop/substitution-requests/{id}/resubmit (cyclic re-negotiation)"
        actor: DesignEngineer
        preconditions: ["SubstitutionRequest.status == COUNTERED"]
        side_effects: ["SubstitutionRequest.version incremented by 1"]
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /panel-shop/substitution-requests/{id}/approve"
        actor: QAManager
        preconditions:
          - "SubstitutionRequest.status == REQUESTED"
          - "acting QAManager user id != SubstitutionRequest.requested_by_id (segregation of duties)"
          - "Component of proposed_component_id has active == true"
          - "if Component of proposed_component_id has sccr_ka not null, then proposed sccr_ka >= original line's Component.sccr_ka when original is not null"
          - "Customer.credit_hold == false for the owning Job"
        side_effects:
          - "new PanelComponent line created: panel_id same, component_id = proposed_component_id, quantity = original quantity, line_status = SUBSTITUTED, substituted_for_id = original_line_id, unit_cost_snapshot_cents = proposed Component.unit_cost_cents"
          - "original PanelComponent line is retired from the active BOM: if original line_status in {PENDING, ORDERED} it is set to SUBSTITUTED (superseded marker); if original line_status == RECEIVED it stays RECEIVED for receipt audit but is excluded from bom_cost_rollup and sccr_panel_rating input sets (the input sets include a line only when no other line references it via substituted_for_id)"
          - "SubstitutionRequest.sccr_impact_ka := recomputed Panel.sccr_rating_ka under proposed component"
          - "Panel.sccr_rating_ka recomputed via sccr_panel_rating"
          - "SubstitutionRequest.lead_time_delta_days := substitution_lead_time_delta under the variant selected by current Job.status"
          - "SubstitutionRequest.version incremented by 1"
      - from: COUNTERED
        to: APPROVED
        trigger: "POST /panel-shop/substitution-requests/{id}/approve"
        actor: QAManager
        preconditions:
          - "SubstitutionRequest.status == COUNTERED"
          - "acting QAManager user id != SubstitutionRequest.requested_by_id"
          - "Component of proposed_component_id has active == true"
          - "if Component of proposed_component_id has sccr_ka not null, then proposed sccr_ka >= original line's Component.sccr_ka when original is not null"
          - "Customer.credit_hold == false for the owning Job"
        side_effects:
          - "same PanelComponent swap side effects as REQUESTED -> APPROVED"
          - "SubstitutionRequest.version incremented by 1"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /panel-shop/substitution-requests/{id}/reject"
        actor: QAManager
        preconditions: ["SubstitutionRequest.status == REQUESTED"]
        side_effects: ["SubstitutionRequest.version incremented by 1"]
      - from: REQUESTED
        to: WITHDRAWN
        trigger: "POST /panel-shop/substitution-requests/{id}/withdraw"
        actor: DesignEngineer
        preconditions:
          - "SubstitutionRequest.status == REQUESTED"
          - "acting DesignEngineer user id == SubstitutionRequest.requested_by_id (only the requester may withdraw)"
        side_effects: ["SubstitutionRequest.version incremented by 1"]

  - entity: TestPoint
    initial_state: UNTESTED
    terminal_states: [PASS]
    transitions:
      - from: UNTESTED
        to: PASS
        trigger: "POST /panel-shop/test-sessions/{id}/record-result with outcome PASS"
        actor: TestTechnician
        preconditions:
          - "parent TestSession.status == OPEN"
          - "TestPoint.result == UNTESTED"
        side_effects:
          - "TestSession.pass_count incremented by 1"
      - from: UNTESTED
        to: FAIL
        trigger: "POST /panel-shop/test-sessions/{id}/record-result with outcome FAIL"
        actor: TestTechnician
        preconditions:
          - "parent TestSession.status == OPEN"
          - "TestPoint.result == UNTESTED"
        side_effects:
          - "TestSession.fail_count incremented by 1"
      - from: UNTESTED
        to: SKIPPED
        trigger: "POST /panel-shop/test-sessions/{id}/record-result with outcome SKIPPED"
        actor: TestTechnician
        preconditions:
          - "parent TestSession.status == OPEN"
          - "TestPoint.result == UNTESTED"
        side_effects: []
      - from: FAIL
        to: UNTESTED
        trigger: "cascade from Panel TEST_FAILED -> WIRING rework"
        actor: system
        preconditions: ["Panel transitions TEST_FAILED -> WIRING"]
        side_effects: []

  - entity: TestSession
    initial_state: OPEN
    terminal_states: [COMPLETED, ABORTED]
    transitions:
      - from: OPEN
        to: COMPLETED
        trigger: "POST /panel-shop/test-sessions/{id}/complete"
        actor: TestTechnician
        preconditions:
          - "TestSession.status == OPEN"
          - "every TestPoint of the Panel has result != UNTESTED (all decided; SKIPPED allowed)"
          - "acting TestTechnician user id == TestSession.technician_id (only the executing technician completes the session)"
        side_effects:
          - "TestSession.completed_at := now"
          - "Panel auto-transitions POINT_TO_POINT -> TEST_PASSED when fail_count == 0 and no SKIPPED points, else POINT_TO_POINT -> TEST_FAILED when fail_count >= 1"
          - "TestSession.version incremented by 1"
      - from: OPEN
        to: ABORTED
        trigger: "POST /panel-shop/test-sessions/{id}/abort"
        actor: TestTechnician
        preconditions:
          - "TestSession.status == OPEN"
        side_effects:
          - "all TestPoints recorded by this session with result in {PASS, FAIL, SKIPPED} reset to UNTESTED; pass_count and fail_count recomputed to 0"
          - "TestSession.version incremented by 1"

  - entity: ProgramVersion
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: RELEASED
        trigger: "POST /panel-shop/panels/{panel_id}/program-versions with expected_panel_version (create-with-release); or POST /panel-shop/program-versions/{id}/release for an existing DRAFT"
        actor: ControlsEngineer
        preconditions:
          - "for create-with-release: OCC check expected_panel_version == Panel.version"
          - "for release: ProgramVersion.status == DRAFT"
          - "no other ProgramVersion of this Panel has identical content_hash"
        side_effects:
          - "every other ProgramVersion of this Panel with status == RELEASED transitions to SUPERSEDED"
          - "ProgramVersion.released_at := now"
          - "Panel.version incremented by 1 (OCC anchor)"
      - from: RELEASED
        to: SUPERSEDED
        trigger: "cascade from a newer ProgramVersion release on the same Panel"
        actor: system
        preconditions: ["a newer ProgramVersion of this Panel transitions DRAFT -> RELEASED"]
        side_effects: []
      - from: SUPERSEDED
        to: ARCHIVED
        trigger: "POST /panel-shop/program-versions/{id}/archive"
        actor: ControlsEngineer
        preconditions: ["ProgramVersion.status == SUPERSEDED"]
        side_effects: []
      - from: DRAFT
        to: ARCHIVED
        trigger: "POST /panel-shop/program-versions/{id}/archive"
        actor: ControlsEngineer
        preconditions: ["ProgramVersion.status == DRAFT"]
        side_effects: []

  - entity: StartupSession
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /panel-shop/startup-sessions/{id}/start"
        actor: FieldEngineer
        preconditions:
          - "StartupSession.status == SCHEDULED"
          - "current logical clock >= StartupSession.scheduled_start and <= StartupSession.scheduled_end"
          - "Panel.status == SHIPPED for the owning Panel"
          - "if support_mode == REMOTE then remote_access_granted == true"
        side_effects: ["StartupSession.version incremented by 1"]
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /panel-shop/startup-sessions/{id}/complete"
        actor: FieldEngineer
        preconditions:
          - "StartupSession.status == IN_PROGRESS"
          - "a ProgramVersion of the owning Panel has status == RELEASED and site_backup_taken == true"
          - "labor_hours > 0 supplied at completion"
        side_effects:
          - "owning Panel auto-transitions SHIPPED -> COMMISSIONED (which may complete Job posture COMMISSIONED and set Job.warranty_expires_at)"
          - "startup_labor_billing computed and stored on the session response as billable_cents (billed separately from the Job ledger; does NOT touch approved_co_delta_cents)"
          - "StartupSession.version incremented by 1"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "system auto-transition when logical clock advances past scheduled_end while still SCHEDULED (evaluated on any read/write of the session or via POST /_clock/set_current_utc sweep)"
        actor: system
        preconditions: ["current logical clock > StartupSession.scheduled_end and status == SCHEDULED"]
        side_effects: ["StartupSession.version incremented by 1"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /panel-shop/startup-sessions/{id}/cancel"
        actor: ProjectManager
        preconditions: ["StartupSession.status == SCHEDULED"]
        side_effects: ["StartupSession.version incremented by 1"]

  - entity: ChangeOrder
    initial_state: PROPOSED
    terminal_states: [APPROVED, REJECTED, WITHDRAWN, SUPERSEDED]
    transitions:
      - from: PROPOSED
        to: REVISED
        trigger: "POST /panel-shop/change-orders/{id}/revise (customer counter-offer loop)"
        actor: Customer
        preconditions:
          - "ChangeOrder.status == PROPOSED"
          - "acting Customer id == Job.customer_id (ownership)"
        side_effects:
          - "price_delta_cents and discount_pct updated from payload; computed_delta_cents recomputed via change_order_pricing"
          - "ChangeOrder.version incremented by 1"
      - from: REVISED
        to: PROPOSED
        trigger: "POST /panel-shop/change-orders/{id}/repropose (PM accepts counter and re-tables; cyclic loop)"
        actor: ProjectManager
        preconditions: ["ChangeOrder.status == REVISED"]
        side_effects: ["ChangeOrder.version incremented by 1"]
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /panel-shop/change-orders/{id}/approve with expected_job_version (OCC)"
        actor: Customer
        preconditions:
          - "ChangeOrder.status == PROPOSED"
          - "OCC: expected_job_version == Job.version"
          - "acting Customer id == Job.customer_id (ownership)"
          - "Customer.credit_hold == false"
          - "Job.status not in {CLOSED}"
        side_effects:
          - "Job.approved_co_delta_cents += ChangeOrder.computed_delta_cents"
          - "Job.contract_price_cents recomputed (= quoted_price_cents + approved_co_delta_cents)"
          - "Job.version incremented by 1 (OCC anchor)"
          - "when payload supersedes_co_id is provided, the referenced ChangeOrder (same Job, status in {PROPOSED, REVISED}) transitions to SUPERSEDED"
          - "ChangeOrder.version incremented by 1"
      - from: REVISED
        to: APPROVED
        trigger: "POST /panel-shop/change-orders/{id}/approve with expected_job_version (OCC)"
        actor: Customer
        preconditions:
          - "ChangeOrder.status == REVISED"
          - "OCC: expected_job_version == Job.version"
          - "acting Customer id == Job.customer_id"
          - "Customer.credit_hold == false"
        side_effects:
          - "same ledger side effects as PROPOSED -> APPROVED"
          - "ChangeOrder.version incremented by 1"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /panel-shop/change-orders/{id}/reject"
        actor: Customer
        preconditions:
          - "ChangeOrder.status == PROPOSED"
          - "acting Customer id == Job.customer_id"
        side_effects: ["ChangeOrder.version incremented by 1"]
      - from: REVISED
        to: REJECTED
        trigger: "POST /panel-shop/change-orders/{id}/reject"
        actor: Customer
        preconditions:
          - "ChangeOrder.status == REVISED"
          - "acting Customer id == Job.customer_id"
        side_effects: ["ChangeOrder.version incremented by 1"]
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /panel-shop/change-orders/{id}/withdraw"
        actor: ProjectManager
        preconditions:
          - "ChangeOrder.status == PROPOSED"
          - "acting ProjectManager user id == ChangeOrder.requested_by_id"
        side_effects: ["ChangeOrder.version incremented by 1"]
      - from: APPROVED
        to: SUPERSEDED
        trigger: "POST /panel-shop/change-orders/{id}/rescind with expected_job_version (compensating action)"
        actor: ProjectManager
        preconditions:
          - "ChangeOrder.status == APPROVED"
          - "OCC: expected_job_version == Job.version"
          - "Job.status not in {CLOSED}"
        side_effects:
          - "Job.approved_co_delta_cents -= ChangeOrder.computed_delta_cents (compensation)"
          - "Job.contract_price_cents recomputed"
          - "Job.version incremented by 1"
          - "ChangeOrder.version incremented by 1"

  - entity: WarrantyClaim
    initial_state: FILED
    terminal_states: [SETTLED, CLOSED]
    transitions:
      - from: FILED
        to: TRIAGED
        trigger: "POST /panel-shop/warranty-claims/{id}/triage"
        actor: QAManager
        preconditions:
          - "WarrantyClaim.status == FILED"
          - "filed_at <= Job.warranty_expires_at (admissibility window; warranty_expires_at must be non-null)"
        side_effects:
          - "WarrantyClaim.provisional_liability_cents := warranty_liability(provisional variant)"
          - "WarrantyClaim.version incremented by 1"
      - from: TRIAGED
        to: ACCEPTED
        trigger: "POST /panel-shop/warranty-claims/{id}/accept"
        actor: QAManager
        preconditions: ["WarrantyClaim.status == TRIAGED"]
        side_effects:
          - "WarrantyClaim.final_liability_cents := warranty_liability(final variant)"
          - "WarrantyClaim.liability_delta_cents := final - provisional (reconciliation ledger entry)"
          - "WarrantyClaim.version incremented by 1"
      - from: TRIAGED
        to: DENIED
        trigger: "POST /panel-shop/warranty-claims/{id}/deny (compensating reversal)"
        actor: QAManager
        preconditions: ["WarrantyClaim.status == TRIAGED"]
        side_effects:
          - "WarrantyClaim.final_liability_cents := 0"
          - "WarrantyClaim.liability_delta_cents := -provisional_liability_cents (reversal)"
          - "WarrantyClaim.version incremented by 1"
      - from: ACCEPTED
        to: SETTLED
        trigger: "POST /panel-shop/warranty-claims/{id}/settle"
        actor: ProjectManager
        preconditions:
          - "WarrantyClaim.status == ACCEPTED"
        side_effects: ["WarrantyClaim.version incremented by 1"]
      - from: DENIED
        to: CLOSED
        trigger: "POST /panel-shop/warranty-claims/{id}/close"
        actor: ProjectManager
        preconditions: ["WarrantyClaim.status == DENIED"]
        side_effects: ["WarrantyClaim.version incremented by 1"]

  - entity: AsBuiltPackage
    initial_state: INCOMPLETE
    terminal_states: [RELEASED]
    transitions:
      - from: INCOMPLETE
        to: PENDING_REVIEW
        trigger: "system auto-transition when completeness_pct == 100 (compound posture from document flags)"
        actor: system
        preconditions: ["completeness_pct == 100"]
        side_effects: ["AsBuiltPackage.version incremented by 1"]
      - from: PENDING_REVIEW
        to: APPROVED
        trigger: "POST /panel-shop/as-built-packages/{id}/approve"
        actor: QAManager
        preconditions:
          - "AsBuiltPackage.status == PENDING_REVIEW"
          - "acting QAManager user id != Panel.design_engineer_id of the owning Panel"
        side_effects: ["AsBuiltPackage.version incremented by 1"]
      - from: PENDING_REVIEW
        to: INCOMPLETE
        trigger: "POST /panel-shop/as-built-packages/{id}/return-for-rework; or system when any has_* flag flips true -> false (document withdrawal)"
        actor: QAManager
        preconditions: ["AsBuiltPackage.status == PENDING_REVIEW"]
        side_effects: ["AsBuiltPackage.version incremented by 1"]
      - from: APPROVED
        to: RELEASED
        trigger: "POST /panel-shop/as-built-packages/{id}/release"
        actor: ProjectManager
        preconditions:
          - "AsBuiltPackage.status == APPROVED"
          - "owning Panel.status in {TEST_PASSED, READY_FOR_LABEL, LABELED}"
        side_effects:
          - "AsBuiltPackage.version incremented by 1"
          - "Job posture re-evaluated (READY_TO_SHIP gate)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: program-release-stale-panel
    parent_entity: Panel
    write_endpoint: "POST /panel-shop/panels/{panel_id}/program-versions"
    occ_field: "expected_panel_version"
    description: |
      Creating a new ProgramVersion with immediate release against a Panel whose
      version has advanced since the client last observed it is rejected. This
      captures the case where another writer has just released a program version
      (which legitimately supersedes the prior RELEASED one and bumps
      Panel.version), leaving the current writer's view of the panel stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: change-order-approve-stale-job
    parent_entity: Job
    write_endpoint: "POST /panel-shop/change-orders/{id}/approve"
    occ_field: "expected_job_version"
    description: |
      Approving a ChangeOrder against a Job whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      approval has just posted to Job.approved_co_delta_cents (advancing
      Job.version), so the current approval would otherwise compute the new
      contract price from a stale baseline.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: change-order-rescind-stale-job
    parent_entity: Job
    write_endpoint: "POST /panel-shop/change-orders/{id}/rescind"
    occ_field: "expected_job_version"
    description: |
      Rescinding an APPROVED ChangeOrder against a Job whose version has advanced
      since the client last observed it is rejected, because the compensation
      must subtract from the exact ledger baseline the client read; any
      intervening ledger mutation (another approval or rescind) invalidates the
      baseline.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: sccr_panel_rating
    trigger: "on PanelComponent create, on SubstitutionRequest approval, and on Panel submit-review"
    algorithm: constraint_propagation
    formula: |
      # UL 508A weakest-link: panel SCCR is the minimum over "power circuit"
      # component SCCRs, with a high-fault short-circuit current rating floor
      # applied to the control-power branch only when it is fed from the power
      # circuit without intermediate protection.
      power_lines = [pc for pc in PanelComponent(panel)
                     if pc.line_status in {PENDING, ORDERED, RECEIVED, SUBSTITUTED}
                     and Component(pc.component_id).component_class
                         in {DISCONNECT, BRANCH_PROTECTIVE, CONTACTOR, OVERLOAD, POWER_SUPPLY}
                     and Component(pc.component_id).sccr_ka is not null]
      if power_lines is empty: sccr = 0
      else:
        branch_min = min(Component(pc.component_id).sccr_ka for pc in power_lines)
        # branch protective device raise: a current-limiting BRANCH_PROTECTIVE
        # with sccr_ka >= 100 raises downstream CONTACTOR/OVERLOAD floor to 25
        has_cl_bpd = any(Component(pc.component_id).component_class == BRANCH_PROTECTIVE
                         and Component(pc.component_id).sccr_ka >= 100 for pc in power_lines)
        if has_cl_bpd:
          raised = [max(Component(pc.component_id).sccr_ka, 25)
                    if Component(pc.component_id).component_class in {CONTACTOR, OVERLOAD}
                    else Component(pc.component_id).sccr_ka
                    for pc in power_lines]
          sccr = min(raised)
        else:
          sccr = branch_min
      Panel.sccr_rating_ka := sccr
    input_set: "PanelComponent lines of the panel with line_status in {PENDING, ORDERED, RECEIVED, SUBSTITUTED}; lines whose Component has component_class in {WIRE_DUCT, TERMINAL, PLC_IO, PILOT_DEVICE} or null sccr_ka are excluded from the min-chain"
    constants:
      CONTROL_BRANCH_FLOOR_KA: 25
      CURRENT_LIMITING_THRESHOLD_KA: 100
    precision: "integer kA, no rounding"
    variants: []

  - name: bom_cost_rollup
    trigger: "on PanelComponent create, quantity change, or substitution approval"
    algorithm: aggregation
    formula: |
      # Mode (b): rounding order is pinned — round PER LINE first, then sum.
      # extended_cost_cents per line = round_half_up(quantity * unit_cost_snapshot_cents)
      # (already integral because both factors are integers, but the line-level
      # rounding pin matters for the discount-bearing change-order interaction:
      # change_order_pricing discounts against the SUM OF LINES, not against a
      # sum-then-round of the total).
      for each line in PanelComponent(panel) where line_status in {PENDING, ORDERED, RECEIVED, SUBSTITUTED}:
        line.extended_cost_cents = round_half_up(line.quantity * line.unit_cost_snapshot_cents, 0)
      panel_bom_total_cents = sum(line.extended_cost_cents for included lines)
    input_set: "PanelComponent lines of the panel with line_status in {PENDING, ORDERED, RECEIVED, SUBSTITUTED}; the RETIRED original line of an approved substitution (line whose id is another line's substituted_for_id AND that has been superseded) is excluded"
    constants: {}
    precision: "integer cents, round_half_up at line level; sum of pre-rounded lines, never round of sum"
    variants: []

  - name: substitution_lead_time_delta
    trigger: "on SubstitutionRequest approval"
    algorithm: forward_looking
    formula: |
      # Signed lead-time impact of the swap.
      delta = Component(proposed).lead_time_days - Component(original).lead_time_days
    input_set: "the proposed and original Components of the SubstitutionRequest"
    constants: {}
    precision: "integer days"
    variants:
      - name: pessimistic
        when: "Job.status in {DESIGN, PROCUREMENT} — early-phase jobs absorb raw vendor deltas plus a risk pad"
        difference: "delta_pessimistic = delta + RISK_PAD_DAYS when delta > 0 else delta (pad only applies to increases)"
      - name: optimistic
        when: "Job.status in {BUILD, TEST, READY_TO_SHIP, SHIPPED, COMMISSIONED} — late-phase jobs assume expediting erases increases"
        difference: "delta_optimistic = min(delta, 0) — increases are reported as 0 because the shop expedites; decreases (negative deltas) are kept as-is"
    constants:
      RISK_PAD_DAYS: 7

  - name: warranty_liability
    trigger: "provisional variant at WarrantyClaim TRIAGED; final variant at WarrantyClaim ACCEPTED"
    algorithm: tiered_pricing
    formula: |
      # Mode (a): >= 3 inputs with non-linear interaction (nested min/max,
      # tiered labor rate selection keyed on Customer.warranty_labor_tier,
      # conditional branch on months-in-service).
      months_in_service = floor((filed_at - Job.commissioned_at_proxy) / 30 days)
        where commissioned_at_proxy = max(Panel.commissioned_at over Job's commissioned panels)
      base_labor_rate = TIER_RATE[Customer.warranty_labor_tier]  # cents/hour
      labor_cents = round_half_up(claimed_labor_hours * base_labor_rate, 0)
      parts_cents = PARTS_ALLOWANCE_CENTS  # flat diagnostic parts allowance
      subtotal = labor_cents + parts_cents
      # age decay: claims filed after HALF the warranty term see labor halved
      if months_in_service * 2 > Job.warranty_months: labor_cents = round_half_up(labor_cents / 2, 0); subtotal = labor_cents + parts_cents
      liability = min(subtotal, CAP_CENTS)
      # customer absorbs the first DEDUCTIBLE_CENTS of every adjudicated claim
      liability = max(liability - DEDUCTIBLE_CENTS, 0)
    input_set: "WarrantyClaim fields claimed_labor_hours, filed_at; Job.warranty_months; Customer.warranty_labor_tier; Panel.commissioned_at over the Job's Panels with status COMMISSIONED"
    constants:
      TIER_RATE: { TIER_LOCAL: 9500, TIER_REGIONAL: 14500, TIER_NATIONAL: 21000 }
      CAP_CENTS: 500000
      DEDUCTIBLE_CENTS: 10000
      PARTS_ALLOWANCE_CENTS: 25000
    precision: "integer cents, round_half_up at each stated step"
    variants:
      - name: provisional
        when: "at TRIAGED — conservative accrual: deductible NOT subtracted, age decay NOT applied (worst-case accrual)"
        difference: "liability = min(labor_cents_full + PARTS_ALLOWANCE_CENTS, CAP_CENTS); no DEDUCTIBLE_CENTS subtraction and no age-decay halving"
      - name: final
        when: "at ACCEPTED — adjudicated amount: age decay and deductible subtraction both applied"
        difference: "full formula above including halving and the DEDUCTIBLE_CENTS subtraction floored at 0"

  - name: change_order_pricing
    trigger: "on ChangeOrder create and on revise"
    algorithm: tiered_pricing
    formula: |
      # Mode (c): circular-looking dependency pinned to explicit evaluation order.
      # The volume discount tier is keyed on the POST-discount total of THIS
      # order, which would be circular; the scaffold pins: tier selection uses
      # the PRE-discount price_delta_cents, then discount applies, then the
      # result is clamped.
      # Order: (1) tier := tier_of(price_delta_cents) using PRE-discount value
      #        (2) effective_discount = max(discount_pct, TIER_FLOOR[tier])
      #        (3) computed_delta = round_half_up(price_delta_cents * (1 - effective_discount), 0)
      #        (4) clamp: if price_delta_cents < 0 (credit), floor computed_delta
      #            at price_delta_cents (discounts never deepen a credit)
      tier_of(d): T0 if d < 100000; T1 if 100000 <= d < 500000; T2 if d >= 500000
      TIER_FLOOR = { T0: 0.00, T1: 0.05, T2: 0.10 }
      if price_delta_cents >= 0:
        computed_delta_cents = round_half_up(price_delta_cents * (1 - max(discount_pct, TIER_FLOOR[tier])), 0)
      else:
        computed_delta_cents = price_delta_cents  # credits pass through undiscounted
    input_set: "the ChangeOrder's own price_delta_cents and discount_pct"
    constants:
      TIER_T1_MIN_CENTS: 100000
      TIER_T2_MIN_CENTS: 500000
      TIER_T1_FLOOR: 0.05
      TIER_T2_FLOOR: 0.10
    precision: "integer cents, round_half_up once at step (3); no double rounding"
    variants: []

  - name: startup_labor_billing
    trigger: "on StartupSession completion"
    algorithm: waterfall_allocation
    formula: |
      # Waterfall: first INCLUDED_BASE_HOURS hours billed at base rate; overtime
      # hours (beyond base, up to OT_CAP_HOURS total) at 1.5x; emergency hours
      # (beyond OT_CAP_HOURS) at 2.0x. Weekend multiplier 1.25 applies to the
      # whole bill when scheduled_start falls on Saturday/Sunday (UTC).
      # ROUNDING ORDER IS PINNED (mode b): the OT hourly rate is rounded to the
      # cent FIRST (round_half_up(BASE_RATE * 1.5)), THEN multiplied by ot_h.
      # Multiplying first and rounding the line total yields different cents
      # (BASE_RATE 18533 * 1.5 = 27799.5 -> rate-first 27800/h; hour-first on
      # 2 OT hours = round(55599.0) = 55599 vs rate-first 55600).
      h = labor_hours
      base_h = min(h, INCLUDED_BASE_HOURS)
      ot_h = min(max(h - INCLUDED_BASE_HOURS, 0), OT_CAP_HOURS - INCLUDED_BASE_HOURS)
      em_h = max(h - OT_CAP_HOURS, 0)
      ot_rate = round_half_up(BASE_RATE * 1.5, 0)
      raw = base_h * BASE_RATE + ot_h * ot_rate + em_h * BASE_RATE * 2
      billable_cents = round_half_up(raw * (WEEKEND_MULT if is_weekend(scheduled_start) else 1), 0)
    input_set: "StartupSession.labor_hours, scheduled_start; constants below"
    constants:
      INCLUDED_BASE_HOURS: 8
      OT_CAP_HOURS: 16
      BASE_RATE: 18533
      WEEKEND_MULT: 1.25
    precision: "integer cents, round_half_up at the OT-rate step and at the final multiplier step"
    variants: []

  - name: as_built_completeness
    trigger: "on AsBuiltPackage create and on any has_* flag change, and cascaded from Panel label affix and test pass"
    algorithm: weighted_scoring
    formula: |
      # Weighted completeness over four required artifacts.
      score = (W_WIRING * has_wiring_diagram + W_PROGRAM * has_program_archive
               + W_TEST * has_test_report + W_LABEL * has_ul_label_photo)
      completeness_pct = round_half_up(score * 100, 0)  # integer percent
      # auto-advance: PENDING_REVIEW when completeness_pct == 100
    input_set: "the AsBuiltPackage's four boolean artifact flags"
    constants:
      W_WIRING: 0.35
      W_PROGRAM: 0.25
      W_TEST: 0.25
      W_LABEL: 0.15
    precision: "integer percent 0-100, round_half_up"
    variants: []

  - name: job_posture_derivation
    trigger: "on every Panel, PanelComponent, AsBuiltPackage, and StartupSession mutation that touches a posture input"
    algorithm: aggregation
    formula: |
      # Compound posture: Job.status is the "weakest" stage implied by its
      # children, evaluated after every child mutation while the Job is not
      # ON_HOLD and not CLOSED.
      if no Panels: posture = OPEN
      elif any Panel in {DESIGN, DESIGN_REVIEW}: posture = DESIGN
      elif any PanelComponent line (any Panel of Job) in {PENDING, ORDERED}: posture = PROCUREMENT
      elif any Panel in {PROCUREMENT, WIRING}: posture = BUILD
      elif any Panel in {POINT_TO_POINT, TEST_FAILED}: posture = TEST
      elif all Panels in {TEST_PASSED, READY_FOR_LABEL, LABELED, SHIPPED, COMMISSIONED}
           and all AsBuiltPackages RELEASED and not all Panels SHIPPED/COMMISSIONED:
        posture = READY_TO_SHIP
      elif all Panels SHIPPED (mix SHIPPED/COMMISSIONED): posture = SHIPPED
      elif all Panels COMMISSIONED: posture = COMMISSIONED
      # Ties in "all X" checks resolved by evaluation order above (top-down);
      # posture changes only ever fire through declared transitions.
    input_set: "all Panels with panel.job_id == Job.id; all PanelComponent lines of those Panels; all AsBuiltPackages of those Panels"
    constants: {}
    precision: "n/a (enum derivation)"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is a declared role name"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "acting role is in the endpoint's roles list (RBAC)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "entity_backed Customer ownership: when X-User-Role == Customer, the target Job/ChangeOrder/SubstitutionRequest chain MUST resolve to customer_id == X-User-ID"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /panel-shop/jobs/{id}/warranty-claims, POST /panel-shop/change-orders/{id}/approve, POST /panel-shop/change-orders/{id}/revise, POST /panel-shop/change-orders/{id}/reject, POST /panel-shop/substitution-requests/{id}/counter"

  - priority: 4
    category: existence
    check: "path-templated resources exist, validated left-to-right (customer, job, panel, child)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 5
    category: existence
    check: "body-referenced foreign keys exist (customer_id, component_id, panel_id, original_line_id, proposed_component_id)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "POST endpoints with FK payloads"

  - priority: 6
    category: state
    check: "target entity is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 7
    category: state
    check: "OCC expected_*_version matches the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /panel-shop/panels/{panel_id}/program-versions, POST /panel-shop/change-orders/{id}/approve, POST /panel-shop/change-orders/{id}/rescind"

  - priority: 8
    category: business_safety
    check: "UL 508A segregation of duties: QAManager approving a design/label/as-built MUST NOT be the panel's design_engineer; TestSession technician MUST NOT be design_engineer; substitution approver MUST NOT be requester"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /panel-shop/panels/{id}/approve-design, POST /panel-shop/panels/{id}/affix-label, POST /panel-shop/as-built-packages/{id}/approve, POST /panel-shop/panels/{id}/test-sessions, POST /panel-shop/substitution-requests/{id}/approve"

  - priority: 9
    category: business_safety
    check: "Panel submit-review requires sccr_rating_ka >= 5 (UL 508A minimum labelable SCCR)"
    error_id: ERR_SCCR_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /panel-shop/panels/{id}/submit-review"

  - priority: 10
    category: business_safety
    check: "Substitution approval: proposed component MUST be active and, when both components carry sccr_ka, proposed sccr_ka >= original sccr_ka"
    error_id: ERR_SUBSTITUTION_DOWNRATED
    http_status: 422
    applies_to: "POST /panel-shop/substitution-requests/{id}/approve"

  - priority: 11
    category: business_temporal
    check: "StartupSession start: logical clock within [scheduled_start, scheduled_end]; complete requires site_backup_taken on a RELEASED ProgramVersion"
    error_id: ERR_OUTSIDE_SCHEDULED_WINDOW
    http_status: 422
    applies_to: "POST /panel-shop/startup-sessions/{id}/start"

  - priority: 12
    category: business_temporal
    check: "WarrantyClaim filing and triage: filed_at <= Job.warranty_expires_at; warranty_expires_at must be non-null (job commissioned)"
    error_id: ERR_WARRANTY_EXPIRED
    http_status: 422
    applies_to: "POST /panel-shop/jobs/{id}/warranty-claims, POST /panel-shop/warranty-claims/{id}/triage"

  - priority: 13
    category: business_temporal
    check: "StartupSession engineer overlap: no two StartupSessions in {SCHEDULED, IN_PROGRESS} for the same engineer_id may have overlapping half-open [scheduled_start, scheduled_end) windows; adjacency (end == start) is permitted"
    error_id: ERR_ENGINEER_DOUBLE_BOOKED
    http_status: 422
    applies_to: "POST /panel-shop/panels/{panel_id}/startup-sessions"

  - priority: 14
    category: business_temporal
    check: "StartupSession panel turnover buffer: a new session for the same Panel must not begin within PANEL_TURNOVER_HOURS (24h) after the scheduled_end of any other {SCHEDULED, IN_PROGRESS} session for that Panel — buffer-inflated interval semantics (gap >= 24h required; gap == 24h exactly is permitted)"
    error_id: ERR_PANEL_TURNOVER_VIOLATION
    http_status: 422
    applies_to: "POST /panel-shop/panels/{panel_id}/startup-sessions"

  - priority: 15
    category: business_referential
    check: "Component with active == false may not be referenced by a new PanelComponent line or a new SubstitutionRequest"
    error_id: ERR_COMPONENT_INACTIVE
    http_status: 422
    applies_to: "POST /panel-shop/panels/{id}/components, POST /panel-shop/panels/{id}/substitution-requests"

  - priority: 16
    category: business_referential
    check: "ProgramVersion content_hash unique per panel; version_tag unique per panel; panel_tag unique per job; part_number globally unique; duplicate component on a panel"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "POST /panel-shop/jobs/{job_id}/panels, POST /panel-shop/panels/{panel_id}/program-versions, POST /panel-shop/panels/{id}/components (same component twice on a panel), POST /panel-shop/components"

  - priority: 17
    category: business_constraint
    check: "Customer.credit_hold blocks Job creation, Job advance, ChangeOrder approval, and SubstitutionRequest approval"
    error_id: ERR_CREDIT_HOLD
    http_status: 402
    applies_to: "POST /panel-shop/jobs, POST /panel-shop/jobs/{id}/advance, POST /panel-shop/change-orders/{id}/approve, POST /panel-shop/substitution-requests/{id}/approve"

  - priority: 18
    category: business_fiscal
    check: "ChangeOrder discount_pct within [0, 0.5]; price_delta_cents present; quoted_price_cents >= 0; warranty_months within [0, 60]"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /panel-shop/jobs/{id}/change-orders, POST /panel-shop/change-orders/{id}/revise, POST /panel-shop/jobs"

  - priority: 19
    category: business_fiscal
    check: "WarrantyClaim admissibility: claimed_labor_hours >= 0; Job has at least one COMMISSIONED panel"
    error_id: ERR_CLAIM_INADMISSIBLE
    http_status: 422
    applies_to: "POST /panel-shop/jobs/{id}/warranty-claims"

  - priority: 20
    category: business_constraint
    check: "Remote startup support requires remote_access_granted == true when support_mode == REMOTE"
    error_id: ERR_REMOTE_ACCESS_REQUIRED
    http_status: 422
    applies_to: "POST /panel-shop/panels/{panel_id}/startup-sessions, POST /panel-shop/startup-sessions/{id}/start"

  - priority: 21
    category: business_constraint
    check: "TestSession completion requires all TestPoints decided (no UNTESTED); TestPoint result recording requires parent session OPEN and point UNTESTED"
    error_id: ERR_TEST_POINTS_UNDECIDED
    http_status: 422
    applies_to: "POST /panel-shop/test-sessions/{id}/complete, POST /panel-shop/test-sessions/{id}/record-result"

  - priority: 22
    category: business_constraint
    check: "required input fields present with correct types and enum membership"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- clock (test-driving, declared) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. Before any call, the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time. Advancing past a StartupSession.scheduled_end fires the NO_SHOW sweep."
    roles: [ProjectManager, QAManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["StartupSession NO_SHOW sweep for sessions whose scheduled_end < to_iso8601"]

  # --- customers ---
  - method: POST
    path: "/panel-shop/customers"
    description: "Register a customer."
    roles: [ProjectManager]
    code: 201
    input: [company_name, site_state_code, "credit_hold?", "warranty_labor_tier?"]
    output: Customer
    side_effects: []
  - method: GET
    path: "/panel-shop/customers/{id}"
    description: "Fetch one customer."
    roles: [ProjectManager, QAManager, DesignEngineer, Customer, ShopLead, TestTechnician, ControlsEngineer, FieldEngineer, ShippingClerk]
    code: 200
    input: []
    output: Customer
    side_effects: []
  - method: GET
    path: "/panel-shop/customers"
    description: "List customers with pagination."
    roles: [ProjectManager, QAManager]
    code: 200
    input: ["limit?", "offset?"]
    output: Customer[]
    side_effects: []
  - method: PATCH
    path: "/panel-shop/customers/{id}"
    description: "Update credit_hold / warranty_labor_tier."
    roles: [ProjectManager]
    code: 200
    input: ["credit_hold?", "warranty_labor_tier?"]
    output: Customer
    side_effects: ["Customer.version incremented by 1"]
  - method: GET
    path: "/panel-shop/customers/{id}/jobs"
    description: "List jobs of a customer (FK reverse reachability)."
    roles: [ProjectManager, QAManager, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: Job[]
    side_effects: []

  # --- jobs ---
  - method: POST
    path: "/panel-shop/jobs"
    description: "Create a panel-build job for a customer."
    roles: [ProjectManager]
    code: 201
    input: [customer_id, job_number, quoted_price_cents, "warranty_months?"]
    output: Job
    side_effects: []
  - method: GET
    path: "/panel-shop/jobs/{id}"
    description: "Fetch a job with computed contract price."
    roles: [ProjectManager, QAManager, Customer, DesignEngineer, ShopLead]
    code: 200
    input: []
    output: Job
    side_effects: []
  - method: GET
    path: "/panel-shop/jobs"
    description: "List jobs with optional customer_id filter."
    roles: [ProjectManager, QAManager, Customer]
    code: 200
    input: ["customer_id?", "status?", "limit?", "offset?"]
    output: Job[]
    side_effects: []
  - method: POST
    path: "/panel-shop/jobs/{id}/advance"
    description: "Manual advance OPEN -> DESIGN."
    roles: [ProjectManager]
    code: 200
    input: []
    output: Job
    side_effects: ["Job.status OPEN -> DESIGN", "Job.version incremented by 1"]
  - method: POST
    path: "/panel-shop/jobs/{id}/hold"
    description: "Put a mid-flight job ON_HOLD."
    roles: [ProjectManager]
    code: 200
    input: []
    output: Job
    side_effects: ["Job.status -> ON_HOLD", "Job.version incremented by 1"]
  - method: POST
    path: "/panel-shop/jobs/{id}/resume"
    description: "Resume from ON_HOLD; posture engine re-derives status."
    roles: [ProjectManager]
    code: 200
    input: []
    output: Job
    side_effects: ["Job.status ON_HOLD -> derived posture", "Job.version incremented by 1"]
  - method: POST
    path: "/panel-shop/jobs/{id}/ship"
    description: "Ship all eligible panels; job READY_TO_SHIP -> SHIPPED."
    roles: [ShippingClerk]
    code: 200
    input: []
    output: Job
    side_effects: ["Panel cascade to SHIPPED", "Job.version incremented by 1"]
  - method: POST
    path: "/panel-shop/jobs/{id}/close"
    description: "Close a commissioned job."
    roles: [ProjectManager]
    code: 200
    input: []
    output: Job
    side_effects: ["Job.status COMMISSIONED -> CLOSED", "Job.version incremented by 1"]
  - method: GET
    path: "/panel-shop/jobs/{id}/panels"
    description: "List panels of a job (FK reverse reachability)."
    roles: [ProjectManager, QAManager, DesignEngineer, ShopLead, TestTechnician, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: Panel[]
    side_effects: []
  - method: GET
    path: "/panel-shop/jobs/{id}/change-orders"
    description: "List change orders of a job (FK reverse reachability)."
    roles: [ProjectManager, QAManager, Customer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ChangeOrder[]
    side_effects: []
  - method: GET
    path: "/panel-shop/jobs/{id}/warranty-claims"
    description: "List warranty claims of a job (FK reverse reachability)."
    roles: [ProjectManager, QAManager, Customer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []

  # --- panels ---
  - method: POST
    path: "/panel-shop/jobs/{job_id}/panels"
    description: "Create a panel under a job. Also auto-advances Job OPEN -> DESIGN."
    roles: [DesignEngineer]
    code: 201
    input: [panel_tag, enclosure_rating, design_engineer_id]
    output: Panel
    side_effects: ["Job OPEN -> DESIGN when first panel created", "AsBuiltPackage auto-created for the panel with all flags false"]
  - method: GET
    path: "/panel-shop/panels/{id}"
    description: "Fetch a panel."
    roles: [ProjectManager, QAManager, DesignEngineer, ShopLead, TestTechnician, ControlsEngineer, FieldEngineer, Customer, ShippingClerk]
    code: 200
    input: []
    output: Panel
    side_effects: []
  - method: GET
    path: "/panel-shop/panels"
    description: "List panels with filters."
    roles: [ProjectManager, QAManager, DesignEngineer, ShopLead]
    code: 200
    input: ["job_id?", "status?", "limit?", "offset?"]
    output: Panel[]
    side_effects: []
  - method: POST
    path: "/panel-shop/panels/{id}/submit-review"
    description: "Panel DESIGN -> DESIGN_REVIEW."
    roles: [DesignEngineer]
    code: 200
    input: []
    output: Panel
    side_effects: ["Panel.version incremented by 1"]
  - method: POST
    path: "/panel-shop/panels/{id}/approve-design"
    description: "Panel DESIGN_REVIEW -> DESIGN_APPROVED (SoD: approver != designer)."
    roles: [QAManager]
    code: 200
    input: []
    output: Panel
    side_effects: ["Panel.version incremented by 1"]
  - method: POST
    path: "/panel-shop/panels/{id}/reject-design"
    description: "Panel DESIGN_REVIEW -> DESIGN (revision loop)."
    roles: [QAManager]
    code: 200
    input: []
    output: Panel
    side_effects: ["Panel.version incremented by 1"]
  - method: POST
    path: "/panel-shop/panels/{id}/release-procurement"
    description: "Panel DESIGN_APPROVED -> PROCUREMENT; BOM lines PENDING -> ORDERED."
    roles: [ProjectManager]
    code: 200
    input: []
    output: Panel
    side_effects: ["PanelComponent cascade PENDING -> ORDERED", "Panel.version incremented by 1"]
  - method: POST
    path: "/panel-shop/panels/{id}/start-wiring"
    description: "Panel PROCUREMENT -> WIRING (requires all lines received/substituted)."
    roles: [ShopLead]
    code: 200
    input: []
    output: Panel
    side_effects: ["Panel.version incremented by 1"]
  - method: POST
    path: "/panel-shop/panels/{id}/begin-test"
    description: "Panel WIRING -> POINT_TO_POINT."
    roles: [ShopLead]
    code: 200
    input: []
    output: Panel
    side_effects: ["Panel.version incremented by 1"]
  - method: POST
    path: "/panel-shop/panels/{id}/rework"
    description: "Panel TEST_FAILED -> WIRING; resets TestPoints to UNTESTED."
    roles: [ShopLead]
    code: 200
    input: []
    output: Panel
    side_effects: ["TestPoint cascade FAIL/PASS/SKIPPED -> UNTESTED", "Panel.version incremented by 1"]
  - method: POST
    path: "/panel-shop/panels/{id}/request-label"
    description: "Panel TEST_PASSED -> READY_FOR_LABEL."
    roles: [QAManager]
    code: 200
    input: []
    output: Panel
    side_effects: ["Panel.version incremented by 1"]
  - method: POST
    path: "/panel-shop/panels/{id}/affix-label"
    description: "Panel READY_FOR_LABEL -> LABELED; mints label_serial."
    roles: [QAManager]
    code: 200
    input: []
    output: Panel
    side_effects: ["label_serial minted", "AsBuiltPackage.has_ul_label_photo := true", "Panel.version incremented by 1"]

  # --- panel BOM components ---
  - method: POST
    path: "/panel-shop/panels/{id}/components"
    description: "Add a BOM line to a panel."
    roles: [DesignEngineer]
    code: 201
    input: [component_id, quantity]
    output: PanelComponent
    side_effects: ["extended_cost_cents computed", "Panel.sccr_rating_ka recomputed", "bom_cost_rollup"]
  - method: GET
    path: "/panel-shop/panels/{id}/components"
