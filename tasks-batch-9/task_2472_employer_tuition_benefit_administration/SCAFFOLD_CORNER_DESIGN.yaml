# =============================================================================
# §1.9 Scaffold Corner Design — task_2472_employer_tuition_benefit_administration
# Walks references/claim-extraction-guide.md against §1.1–§1.7. Rows already
# covered by a §1.8 difficulty instance appear as excluded_because stubs.
# Every instance starts from an empty database; the &k_* anchors below are a
# shared setup fragment (defined once, aliased afterwards).
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: employer_creation_returns_zeroed_rollups_and_default_status
        claim_type: Creation
        grounds: >-
          §1.1 Employer takes legal_name, benefit_admin_contact_email and
          fiscal_year_start_month as input, defaults status to ACTIVE, and declares
          total_disbursed_cents, total_admin_fee_cents and total_imputed_income_cents as computed
          rollups; §1.5 POST /employers returns 201.
        distinguishing_aspect: >-
          Asserts the creation contract of the topology root - every computed rollup starts at 0
          and status defaults - which no other instance observes at creation time.
        test_recipe:
          setup: "Empty database with the logical clock pinned to the mandated default."
          setup_api_calls:
            - &k_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger: >-
            POST /employers with legal_name "Vantage Foods Group",
            benefit_admin_contact_email "benefits@vantage-foods.example" and
            fiscal_year_start_month 1
          assert: >-
            201 with legal_name "Vantage Foods Group",
            benefit_admin_contact_email "benefits@vantage-foods.example",
            fiscal_year_start_month 1, status ACTIVE (the omitted optional defaulted),
            total_disbursed_cents 0, total_admin_fee_cents 0, total_imputed_income_cents 0,
            a generated id, created_at and updated_at, and version 1.

      - name: partner_agreement_retrieval_returns_stored_window_and_pending_status
        claim_type: Retrieval
        grounds: >-
          §1.5 GET /partner-agreements/{id} returns the PartnerAgreement entity, whose §1.1 fields
          include school_id, employer_id, negotiated_discount_pct, direct_bill_enabled,
          effective_from, effective_to, status and terminated_on; §1.2 gives it initial_state
          PENDING with terminated_on null.
        distinguishing_aspect: >-
          Read-back of a junction entity of the graph topology, asserting that both foreign keys and
          the closed effective window survive the round trip unchanged.
        test_recipe:
          setup: "One employer, one school and one freshly created partner agreement."
          setup_api_calls:
            - *k_clock
            - &k_employer
              call: "POST /employers"
              payload:
                legal_name: "Vantage Foods Group"
                benefit_admin_contact_email: "benefits@vantage-foods.example"
                fiscal_year_start_month: 1
              as: PlatformAdmin
              captures: { employer_id: "$.data.id" }
            - &k_school
              call: "POST /schools"
              payload:
                legal_name: "Cascade Valley College"
                state_code: "WA"
                contact_email: "partners@cascadevalley.example"
              as: PlatformAdmin
              captures: { school_id: "$.data.id" }
            - &k_agreement
              call: "POST /partner-agreements"
              payload:
                school_id: "${school_id}"
                employer_id: "${employer_id}"
                negotiated_discount_pct: 0.20
                direct_bill_enabled: true
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
              as: PlatformAdmin
              captures: { agreement_id: "$.data.id" }
          trigger: "GET /partner-agreements/${agreement_id}"
          assert: >-
            200 with school_id ${school_id}, employer_id ${employer_id},
            negotiated_discount_pct 0.20, direct_bill_enabled true, effective_from 2026-01-01,
            effective_to 2026-12-31, status PENDING, terminated_on null and version 1.

      - name: benefit_policy_listing_filters_by_status_and_paginates
        claim_type: Listing
        grounds: >-
          §1.5 GET /employers/{id}/benefit-policies accepts status, limit and offset and returns a
          BenefitPolicy array under the §1.0 envelope with total_count and has_more; §1.0 pins the
          defaults limit 10 / offset 0 and §1.1 pins created_at ASC as the fallback ordering.
        distinguishing_aspect: >-
          The only instance that exercises filter, limit and offset together on the same collection
          and checks has_more on both pages.
        test_recipe:
          setup: >-
            One employer with three drafted policies over disjoint half-open windows, the first of
            which is activated.
          setup_api_calls:
            - *k_clock
            - *k_employer
            - &k_policy
              call: "POST /employers/${employer_id}/benefit-policies"
              payload:
                effective_from: "2026-01-01"
                effective_to: "2027-01-01"
                min_tenure_months: 6
                min_weekly_hours: 20
                eligible_job_families: ["OPERATIONS"]
                annual_cap_cents: 1000000
                funding_model: "HYBRID"
                reimbursement_pct: 0.50
                max_concurrent_credits: 12
                drop_window_days: 14
                service_commitment_months: 12
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { policy_id: "$.data.id" }
            - &k_activate_policy
              call: "POST /benefit-policies/${policy_id}/activate"
              payload: {}
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
            - call: "POST /employers/${employer_id}/benefit-policies"
              payload:
                effective_from: "2027-01-01"
                effective_to: "2028-01-01"
                min_tenure_months: 6
                min_weekly_hours: 20
                eligible_job_families: ["OPERATIONS"]
                annual_cap_cents: 1100000
                funding_model: "HYBRID"
                reimbursement_pct: 0.50
                max_concurrent_credits: 12
                drop_window_days: 14
                service_commitment_months: 12
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { policy_2_id: "$.data.id" }
            - call: "POST /employers/${employer_id}/benefit-policies"
              payload:
                effective_from: "2028-01-01"
                effective_to: "2029-01-01"
                min_tenure_months: 6
                min_weekly_hours: 20
                eligible_job_families: ["OPERATIONS"]
                annual_cap_cents: 1200000
                funding_model: "HYBRID"
                reimbursement_pct: 0.50
                max_concurrent_credits: 12
                drop_window_days: 14
                service_commitment_months: 12
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { policy_3_id: "$.data.id" }
          trigger: "GET /employers/${employer_id}/benefit-policies with status DRAFT, limit 1, offset 0"
          assert: >-
            The trigger returns 200 with response_type array, exactly one element whose id is
            ${policy_2_id} (the older of the two DRAFT rows by created_at ASC), total_count 2 and
            has_more true. Re-reading with status DRAFT, limit 1, offset 1 returns the single
            element ${policy_3_id} with total_count 2 and has_more false. An unfiltered read
            (no status) returns total_count 3, and status ACTIVE returns total_count 1 with id
            ${policy_id}.

      - name: enrollment_fetch_with_unknown_uuid_returns_enrollment_not_found
        claim_type: Not Found
        grounds: >-
          §1.4 priority 11 checks path Enrollment existence and yields ERR_ENROLLMENT_NOT_FOUND
          with http_status 404 on GET /enrollments/{id} among others.
        distinguishing_aspect: >-
          Probes the existence layer with a syntactically valid but unused UUID, so it separates
          404 from the 400 that a malformed identifier would produce.
        test_recipe:
          setup: "Empty database apart from the pinned clock, so no Enrollment exists at all."
          setup_api_calls:
            - *k_clock
          trigger: "GET /enrollments/00000000-0000-4000-8000-000000000000 as BenefitAdministrator"
          assert: >-
            404 with response_type error and data.error_id ERR_ENROLLMENT_NOT_FOUND; the envelope
            still carries meta.api_request_id and meta.api_request_timestamp.

      - name: benefit_policy_draft_missing_annual_cap_is_rejected
        claim_type: Required Fields
        grounds: >-
          §1.5 POST /employers/{id}/benefit-policies declares annual_cap_cents as a required input
          (no "?" marker and no §1.1 default), and §1.4 priority 3 maps a malformed or incomplete
          body to ERR_INVALID_REQUEST with http_status 400.
        distinguishing_aspect: >-
          Targets a required field on the entity that drives every downstream calculation, so the
          rejection must precede any policy row being created.
        test_recipe:
          setup: "One employer with no policies."
          setup_api_calls:
            - *k_clock
            - *k_employer
          trigger: >-
            POST /employers/${employer_id}/benefit-policies with every field except
            annual_cap_cents supplied
          assert: >-
            400 with error_id ERR_INVALID_REQUEST, and
            GET /employers/${employer_id}/benefit-policies returns total_count 0 - the partial body
            created nothing.

      - name: benefit_policy_omitted_optional_flags_take_declared_defaults
        claim_type: Defaults
        grounds: >-
          §1.1 BenefitPolicy declares min_passing_grade_points with default 2.00 and
          non_catalog_approval_required with default true, and §1.5 marks both inputs optional.
        distinguishing_aspect: >-
          The only instance that reads the two policy defaults straight off the creation response
          rather than inferring them from downstream behaviour.
        test_recipe:
          setup: "One employer."
          setup_api_calls:
            - *k_clock
            - *k_employer
          trigger: >-
            POST /employers/${employer_id}/benefit-policies omitting both
            min_passing_grade_points and non_catalog_approval_required
          assert: >-
            201 with min_passing_grade_points 2.00 and non_catalog_approval_required true, status
            DRAFT (the §1.2 initial state) and version 1.

      - name: employee_tenure_and_eligibility_are_derived_not_supplied
        claim_type: Computed Fields
        grounds: >-
          §1.1 Employee declares tenure_months and eligibility_status as computed and §1.5
          POST /employers/{id}/employees does not accept either as input; eligibility depends on the
          employer's current ACTIVE policy (min_tenure_months 6, min_weekly_hours 20,
          eligible_job_families [OPERATIONS]).
        distinguishing_aspect: >-
          Asserts three different eligibility verdicts produced from the same policy by varying only
          hours and job family, isolating the computed-field logic from any state transition.
        test_recipe:
          setup: "One employer with the ACTIVE HYBRID policy from §1.1."
          setup_api_calls:
            - *k_clock
            - *k_employer
            - *k_policy
            - *k_activate_policy
            - &k_employee
              call: "POST /employers/${employer_id}/employees"
              payload:
                full_name: "Rosa Delgado"
                work_email: "rosa.delgado@vantage-foods.example"
                hire_date: "2024-01-15"
                weekly_hours: 40
                job_family: "OPERATIONS"
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { employee_id: "$.data.id" }
            - call: "POST /employers/${employer_id}/employees"
              payload:
                full_name: "Owen Kaur"
                work_email: "owen.kaur@vantage-foods.example"
                hire_date: "2024-01-15"
                weekly_hours: 12
                job_family: "OPERATIONS"
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { part_time_employee_id: "$.data.id" }
          trigger: >-
            POST /employers/${employer_id}/employees for a 40-hour "CORPORATE" hire with
            hire_date 2024-01-15
          assert: >-
            Rosa Delgado reads tenure_months 30 (2024-01-15 to the 2026-08-01 clock) and
            eligibility_status ELIGIBLE with cap_available_cents 1000000; Owen Kaur reads
            tenure_months 30 and eligibility_status INELIGIBLE_HOURS (12 < 20); the trigger returns
            201 with tenure_months 30 and eligibility_status INELIGIBLE_JOB_FAMILY, because
            CORPORATE is not in the policy's eligible_job_families. All three also read
            cap_reserved_cents 0, cap_disbursed_cents 0, cap_clawback_hold_cents 0,
            imputed_income_cents_ytd 0, open_repayment_balance_cents 0 and coaching_hold false.

      - name: partner_agreement_discount_above_sixty_percent_is_rejected
        claim_type: Type Constraints
        grounds: >-
          §1.1 PartnerAgreement.negotiated_discount_pct carries the constraint
          0 <= value <= 0.60, and §1.4 priority 3 maps constraint violations in the body to
          ERR_INVALID_REQUEST (400).
        distinguishing_aspect: >-
          The only instance that probes a numeric range ceiling on an input field, as opposed to an
          enum membership or a business threshold, and it checks the value just above the ceiling.
        test_recipe:
          setup: "One employer and one school."
          setup_api_calls:
            - *k_clock
            - *k_employer
            - *k_school
          trigger: >-
            POST /partner-agreements with negotiated_discount_pct 0.61 and an otherwise valid body
          assert: >-
            400 with error_id ERR_INVALID_REQUEST and GET /partner-agreements?school_id=${school_id}
            returns total_count 0; the same body with negotiated_discount_pct 0.60 is accepted with
            201, so the boundary itself is inclusive.

      - name: academic_outcome_and_tax_ledger_entry_are_append_only
        claim_type: Immutability
        grounds: >-
          §1.1 declares AcademicOutcome, TaxLedgerEntry and CoachingSession with
          common_fields: false, so they carry no version field, and §1.5 exposes no PATCH or DELETE
          endpoint for any of them - only creation and listing.
        distinguishing_aspect: >-
          The only instance that asserts the absence of a mutation surface and of the version field
          on the immutable audit entities, rather than testing a value.
        test_recipe:
          setup: >-
            A confirmed reimbursement enrollment whose PASSED outcome has been posted and whose
            claim has been approved, so at least one AcademicOutcome and one TaxLedgerEntry exist.
          setup_api_calls:
            - *k_clock
            - *k_employer
            - *k_policy
            - *k_activate_policy
            - *k_employee
            - *k_school
            - &k_program
              call: "POST /schools/${school_id}/programs"
              payload:
                name: "Certificate in Food Safety Analytics"
                credential_type: "CERTIFICATE"
                skill_track: "DATA_ANALYTICS"
                list_tuition_per_credit_cents: 50000
                total_credits: 12
                term_length_weeks: 10
              as: SchoolPartner
              as_user_id: "${school_id}"
              captures: { program_id: "$.data.id" }
            - *k_agreement
            - &k_activate_agreement
              call: "POST /partner-agreements/${agreement_id}/activate"
              payload: {}
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { agreement_version: "$.data.version" }
            - &k_listing
              call: "POST /catalog-listings"
              payload:
                employer_id: "${employer_id}"
                program_id: "${program_id}"
                agreement_id: "${agreement_id}"
                expected_agreement_version: "${agreement_version}"
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { listing_id: "$.data.id" }
            - &k_read_employee
              call: "GET /employees/${employee_id}"
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { employee_version: "$.data.version" }
            - &k_enroll
              call: "POST /enrollments"
              payload:
                employee_id: "${employee_id}"
                catalog_listing_id: "${listing_id}"
                term_code: "2026-FA"
                term_start_date: "2026-09-01"
                term_end_date: "2026-12-15"
                credits: 4
                funding_model: "REIMBURSEMENT"
                expected_employee_version: "${employee_version}"
              as: Employee
              as_user_id: "${employee_id}"
              captures: { enrollment_id: "$.data.id" }
            - &k_confirm
              call: "POST /enrollments/${enrollment_id}/confirm-registration"
              payload: {}
              as: SchoolPartner
              as_user_id: "${school_id}"
            - &k_clock_close
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-20T00:00:00Z" }
              as: PlatformAdmin
            - &k_outcome
              call: "POST /enrollments/${enrollment_id}/academic-outcomes"
              payload:
                term_code: "2026-FA"
                completion_status: "PASSED"
                credits_earned: 4
                grade_points: 3.60
              as: SchoolPartner
              as_user_id: "${school_id}"
              captures: { outcome_id: "$.data.id" }
            - &k_claim
              call: "POST /enrollments/${enrollment_id}/reimbursement-claims"
              payload:
                amount_requested_cents: 160000
                receipt_reference: "CVC-2026FA-RDELGADO-01"
              as: Employee
              as_user_id: "${employee_id}"
              captures: { claim_id: "$.data.id" }
            - &k_decide
              call: "POST /reimbursement-claims/${claim_id}/decide"
              payload: { decision: "APPROVE" }
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
          trigger: "GET /enrollments/${enrollment_id}/academic-outcomes and GET /tax-ledger-entries?enrollment_id=${enrollment_id}"
          assert: >-
            The outcome list returns total_count 1 with an element carrying id, created_at and
            posted_on but NO version and NO updated_at field; the tax ledger list returns
            total_count 1 with a BENEFIT entry carrying id and created_at but no version. There is
            no PATCH or DELETE route for either collection in §1.5, so the audit trail can only
            grow: posting a second outcome for the same term does not overwrite the first (the
            enrollment's academic_status is already terminal, so it is rejected with
            ERR_ENROLLMENT_INVALID_ACADEMIC_STATE), and the existing rows keep their original
            created_at.

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: enrollment_starts_registered_and_reserved_with_medium_persistence_tier
        claim_type: Initial State
        grounds: >-
          §1.2 gives Enrollment.academic_status initial_state REGISTERED and
          Enrollment.funding_status initial_state RESERVED, and §1.4 persistence_risk_score is
          computed at POST /enrollments where a certificate program with no coaching sessions scores
          BASE_RISK_BY_CREDENTIAL[CERTIFICATE] 10 + STALENESS_PENALTY 20 = 30, i.e. exactly the
          bottom of the MEDIUM band.
        distinguishing_aspect: >-
          Asserts both initial states plus the initial score on the same response, and lands exactly
          on the LOW/MEDIUM tier boundary (30) which no other instance touches.
        test_recipe:
          setup: "The base fixture up to a curated 40000-per-credit listing and a read employee."
          setup_api_calls:
            - *k_clock
            - *k_employer
            - *k_policy
            - *k_activate_policy
            - *k_employee
            - *k_school
            - *k_program
            - *k_agreement
            - *k_activate_agreement
            - *k_listing
            - *k_read_employee
          trigger: >-
            POST /enrollments for 4 credits of the listing in term 2026-FA
            (2026-09-01 to 2026-12-15) with funding_model REIMBURSEMENT
          assert: >-
            201 with academic_status REGISTERED, funding_status RESERVED, credits_earned 0,
            employer_settled_cents 0, employer_disbursed_cents 0, gross_tuition_cents 160000
            (40000 * 4 where 40000 = 50000 * 0.80), employer_reserved_cents 80000
            (round_half_up(160000 * 0.50)), employee_share_cents 80000, plan_year 2026,
            drop_deadline_date 2026-09-15 (2026-09-01 + 14 days), last_session_date null,
            persistence_risk_score 30 and persistence_tier MEDIUM (30 is the inclusive floor of
            MEDIUM, not the top of LOW); the owning employee still reads coaching_hold false.

      - name: confirm_registration_precondition_requires_curated_listing
        claim_type: Precondition Enforcement
        grounds: >-
          §1.2 Enrollment REGISTERED -> IN_PROGRESS lists the precondition
          "CatalogListing(enrollment.catalog_listing_id).status == CURATED", and §1.4 priority 21
          maps its violation to ERR_LISTING_NOT_CURATED (409) on
          POST /enrollments/{id}/confirm-registration.
        distinguishing_aspect: >-
          Violates a cross-entity precondition on a transition that is otherwise fully satisfied
          (correct actor, correct source state), so only the listing check can explain the refusal.
        test_recipe:
          setup: >-
            The base fixture with a REGISTERED enrollment whose catalog listing is then suspended by
            the benefit administrator.
          setup_api_calls:
            - *k_clock
            - *k_employer
            - *k_policy
            - *k_activate_policy
            - *k_employee
            - *k_school
            - *k_program
            - *k_agreement
            - *k_activate_agreement
            - *k_listing
            - *k_read_employee
            - *k_enroll
            - call: "POST /catalog-listings/${listing_id}/suspend"
              payload: {}
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { suspended_status: "$.data.status" }
          trigger: "POST /enrollments/${enrollment_id}/confirm-registration as SchoolPartner"
          assert: >-
            The suspend call returns status SUSPENDED. The trigger is rejected with 409 and
            error_id ERR_LISTING_NOT_CURATED, and GET /enrollments/${enrollment_id} still shows
            academic_status REGISTERED with funding_status RESERVED, no TuitionInvoice
            (GET /enrollments/${enrollment_id}/invoices returns total_count 0) and an unchanged
            employer_reserved_cents 80000.

      - name: approved_non_catalog_request_materialises_exception_listing
        claim_type: Side Effect Execution
        grounds: >-
          §1.2 ProgramApprovalRequest UNDER_REVIEW -> APPROVED declares a compound side effect: a
          CatalogListing is created with agreement_id null, source_request_id = request.id,
          approval_source APPROVED_EXCEPTION, status CURATED,
          negotiated_tuition_per_credit_cents = the program's list price with no discount, and
          allowed_funding_models [REIMBURSEMENT].
        distinguishing_aspect: >-
          Covers the APPROVE branch of the approval fork, which the §1.8 cyclic instance
          deliberately never reaches, and asserts the undiscounted rate that only this path produces.
        test_recipe:
          setup: >-
            The base fixture plus a second, unlisted program at the same school; the eligible
            employee raises a non-catalog request which is moved to UNDER_REVIEW.
          setup_api_calls:
            - *k_clock
            - *k_employer
            - *k_policy
            - *k_activate_policy
            - *k_employee
            - *k_school
            - *k_program
            - call: "POST /schools/${school_id}/programs"
              payload:
                name: "MS Food Systems Management"
                credential_type: "MASTER"
                skill_track: "BUSINESS_ADMIN"
                list_tuition_per_credit_cents: 75000
                total_credits: 30
                term_length_weeks: 14
              as: SchoolPartner
              as_user_id: "${school_id}"
              captures: { unlisted_program_id: "$.data.id" }
            - call: "POST /program-approval-requests"
              payload:
                employee_id: "${employee_id}"
                program_id: "${unlisted_program_id}"
                justification: "Only local MS aligned with the plant management ladder."
                requested_annual_cost_cents: 900000
              as: Employee
              as_user_id: "${employee_id}"
              captures: { request_id: "$.data.id" }
            - call: "POST /program-approval-requests/${request_id}/review"
              payload: {}
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
          trigger: >-
            POST /program-approval-requests/${request_id}/decide with decision APPROVE and
            decision_note "Approved as an exception for FY2026."
          assert: >-
            200 with status APPROVED and decision_note "Approved as an exception for FY2026." The
            request starts at SUBMITTED with revision_count 0 and moves through UNDER_REVIEW, and
            GET /catalog-listings?source_request_id=${request_id} now returns total_count 1 whose
            element has employer_id ${employer_id}, program_id ${unlisted_program_id},
            agreement_id null, approval_source APPROVED_EXCEPTION, status CURATED,
            negotiated_tuition_per_credit_cents 75000 (the full list price - no agreement means no
            discount) and allowed_funding_models exactly ["REIMBURSEMENT"], so a direct-bill
            enrollment against it would later fail ERR_FUNDING_MODEL_NOT_ALLOWED.

      - name: paying_an_issued_invoice_before_approval_is_rejected
        claim_type: Invalid Transitions
        grounds: >-
          §1.2 TuitionInvoice reaches PAID only from APPROVED_FOR_PAYMENT, and §1.4 priority 25
          requires invoice.status == APPROVED_FOR_PAYMENT on POST /tuition-invoices/{id}/pay,
          yielding ERR_INVOICE_INVALID_STATE (409).
        distinguishing_aspect: >-
          Fires a trigger that is not in the transition list for the invoice's current state
          (ISSUED), verifying that the approval step cannot be skipped even by the PlatformAdmin who
          owns the pay operation.
        test_recipe:
          setup: >-
            The base fixture with a DIRECT_BILL enrollment that has been confirmed, so exactly one
            TuitionInvoice exists in status ISSUED.
          setup_api_calls:
            - *k_clock
            - *k_employer
            - *k_policy
            - *k_activate_policy
            - *k_employee
            - *k_school
            - *k_program
            - *k_agreement
            - *k_activate_agreement
            - *k_listing
            - *k_read_employee
            - &k_enroll_direct
              call: "POST /enrollments"
              payload:
                employee_id: "${employee_id}"
                catalog_listing_id: "${listing_id}"
                term_code: "2026-FA"
                term_start_date: "2026-09-01"
                term_end_date: "2026-12-15"
                credits: 4
                funding_model: "DIRECT_BILL"
                expected_employee_version: "${employee_version}"
              as: Employee
              as_user_id: "${employee_id}"
              captures: { direct_enrollment_id: "$.data.id" }
            - call: "POST /enrollments/${direct_enrollment_id}/confirm-registration"
              payload: {}
              as: SchoolPartner
              as_user_id: "${school_id}"
            - &k_read_invoice
              call: "GET /enrollments/${direct_enrollment_id}/invoices"
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { invoice_id: "$.data[0].id", invoice_status: "$.data[0].status" }
          trigger: "POST /tuition-invoices/${invoice_id}/pay as PlatformAdmin"
          assert: >-
            The invoice list shows exactly one element with amount_cents 160000, due_date
            2026-10-01 and status ISSUED. The trigger is rejected with 409 and error_id
            ERR_INVOICE_INVALID_STATE; the invoice stays ISSUED with paid_on null, the enrollment
            stays (IN_PROGRESS, BILLED), no TaxLedgerEntry is created
            (GET /tax-ledger-entries?enrollment_id=${direct_enrollment_id} returns total_count 0)
            and GET /employers/${employer_id} still shows total_disbursed_cents 0.

      - name: withdrawn_enrollment_rejects_further_outcome_posting
        claim_type: Terminal State Lockdown
        grounds: >-
          §1.2 lists WITHDRAWN among Enrollment.academic_status terminal_states, and §1.4
          priority 23 requires academic_status == IN_PROGRESS to post an outcome, so no transition
          out of WITHDRAWN exists.
        distinguishing_aspect: >-
          Attacks a terminal state that was reached by a compensating withdrawal (not by an outcome),
          and shows the auto-generated WITHDRAWN outcome cannot be superseded.
        test_recipe:
          setup: >-
            The base fixture with a confirmed reimbursement enrollment that is withdrawn inside the
            drop window.
          setup_api_calls:
            - *k_clock
            - *k_employer
            - *k_policy
            - *k_activate_policy
            - *k_employee
            - *k_school
            - *k_program
            - *k_agreement
            - *k_activate_agreement
            - *k_listing
            - *k_read_employee
            - *k_enroll
            - *k_confirm
            - call: "POST /enrollments/${enrollment_id}/withdraw"
              payload: {}
              as: Employee
              as_user_id: "${employee_id}"
              captures: { withdrawn_academic_status: "$.data.academic_status", withdrawn_funding_status: "$.data.funding_status" }
          trigger: >-
            POST /enrollments/${enrollment_id}/academic-outcomes with completion_status PASSED,
            credits_earned 4 and grade_points 3.90
          assert: >-
            The withdrawal returns academic_status WITHDRAWN and funding_status RELEASED (the clock
            2026-08-01 is on or before drop_deadline_date 2026-09-15). The trigger is rejected with
            409 and error_id ERR_ENROLLMENT_INVALID_ACADEMIC_STATE;
            GET /enrollments/${enrollment_id}/academic-outcomes still returns total_count 1 with
            completion_status WITHDRAWN, grade_points null, credits_earned 0 and posted_by_role
            SYSTEM, and the enrollment still reads credits_earned 0 with
            employer_disbursed_cents 0.

      - name: second_activation_of_an_active_policy_is_rejected
        claim_type: Idempotency
        grounds: >-
          §1.2 BenefitPolicy only leaves DRAFT via POST /benefit-policies/{id}/activate, and §1.4
          priority 19 requires status == DRAFT, so replaying the same trigger yields
          ERR_POLICY_NOT_DRAFT (409) rather than a silent no-op.
        distinguishing_aspect: >-
          The only instance that replays an already-consumed transition trigger on the same entity
          and asserts the second call errors instead of being absorbed idempotently.
        test_recipe:
          setup: "One employer with one policy that has been activated once."
          setup_api_calls:
            - *k_clock
            - *k_employer
            - *k_policy
            - *k_activate_policy
            - call: "GET /employers/${employer_id}/benefit-policies"
              payload: { status: "ACTIVE" }
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { active_policy_version: "$.data[0].version" }
          trigger: "POST /benefit-policies/${policy_id}/activate a second time"
          assert: >-
            409 with error_id ERR_POLICY_NOT_DRAFT. The policy's version is unchanged from
            ${active_policy_version} (the rejected write does not bump it) and
            GET /employers/${employer_id}/benefit-policies?status=ACTIVE still returns
            total_count 1.

      - name: valid_transition_coverage_excluded
        claim_type: Valid Transition
        excluded_because:
          difficulty_instance: enrollment_academic_and_funding_axes_advance_independently
          rationale: >-
            That §1.8 instance already walks every happy-path transition of both Enrollment state
            machines (confirm-registration, invoice approve, invoice pay, outcome PASSED, claim
            approve) for both funding models and asserts the resulting combined states, so a
            separate Valid Transition row would duplicate it.

      - name: cyclic_shape_loop_termination_excluded
        claim_type: Precondition Enforcement
        excluded_because:
          difficulty_instance: approval_request_revision_cycle_capped_at_two_rounds
          rationale: >-
            The cyclic shape of ProgramApprovalRequest and its revision_count < 2 loop-termination
            precondition are exactly what that §1.8 instance asserts, including the state after the
            rejected third resubmit.

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: persistence_risk_score_components_combine_with_flag_cap
        claim_type: Correct Result
        grounds: >-
          §1.4 persistence_risk_score sums BASE_RISK_BY_CREDENTIAL[CERTIFICATE] 10,
          OUTCOME_PENALTY, STALENESS_PENALTY 20 and FLAG_WEIGHT 5 * min(FLAG_COUNT_CAP 4, flags over
          the last three sessions), minus min(ENGAGEMENT_CAP 20,
          ENGAGEMENT_PER_SESSION 5 * recent sessions), then clamps to 0..100 and bands the result at
          30 and 60.
        distinguishing_aspect: >-
          The only instance that drives the weighted score through three coaching sessions and makes
          FLAG_COUNT_CAP bite (5 raw flags counted as 4), which no §1.8 instance touches - they all
          observe the untouched base + staleness score.
        test_recipe:
          setup: >-
            The base fixture with a confirmed 4-credit certificate enrollment; the clock stays at
            2026-08-01 so every session is inside COACH_STALE_DAYS.
          setup_api_calls:
            - *k_clock
            - *k_employer
            - *k_policy
            - *k_activate_policy
            - *k_employee
            - *k_school
            - *k_program
            - *k_agreement
            - *k_activate_agreement
            - *k_listing
            - *k_read_employee
            - *k_enroll
            - *k_confirm
            - call: "POST /enrollments/${enrollment_id}/coaching-sessions"
              payload:
                session_date: "2026-08-05"
                modality: "VIDEO"
                risk_flags: ["MISSED_ASSIGNMENTS", "FINANCIAL_STRESS"]
                notes: "First check-in; two risks noted."
              as: Coach
              captures: { score_after_first: "$.data.persistence_risk_score_after" }
            - call: "POST /enrollments/${enrollment_id}/coaching-sessions"
              payload:
                session_date: "2026-08-10"
                modality: "PHONE"
                risk_flags: []
                notes: "Follow-up; no new risks."
              as: Coach
              captures: { score_after_second: "$.data.persistence_risk_score_after" }
          trigger: >-
            POST /enrollments/${enrollment_id}/coaching-sessions dated 2026-08-12 with three
            risk_flags ["MISSED_ASSIGNMENTS", "FINANCIAL_STRESS", "WORK_SCHEDULE_CONFLICT"]
          assert: >-
            After confirm-registration the enrollment scores 30 (base 10 + staleness 20, no
            sessions). The first session removes the staleness penalty and adds two flags:
            10 + 0 + 0 + 5*min(4,2) - min(20, 5*1) = 10 + 10 - 5 = 15, persistence_tier LOW. The
            second session adds engagement but no flags:
            10 + 5*min(4,2) - min(20, 5*2) = 10 + 10 - 10 = 10, still LOW. The trigger's three flags
            push the last-three total to 5, which the cap clips to 4:
            10 + 5*min(4,5) - min(20, 5*3) = 10 + 20 - 15 = 15 with persistence_tier LOW, so
            persistence_risk_score_after is 15 and not 20 (which an uncapped flag count would give).
            GET /enrollments/${enrollment_id} then reads persistence_risk_score 15,
            persistence_tier LOW and last_session_date 2026-08-12,
            GET /enrollments/${enrollment_id}/coaching-sessions returns total_count 3, and
            GET /employees/${employee_id} reads coaching_hold false throughout.

      - name: reimbursement_final_scales_by_earned_credit_ratio
        claim_type: Correct Result
        grounds: >-
          §1.4 benefit_award_computation's reimbursement final variant first computes
          earned_ratio_base_cents = round_half_up(gross * credits_earned / credits) and only then
          applies effective_pct, so a partially completed term must reduce the settlement
          proportionally before the grade bonus is applied.
        distinguishing_aspect: >-
          The only instance where credits_earned is LESS than credits; every §1.8 settlement has
          credits_earned == credits, which makes the earned-ratio step invisible there.
        test_recipe:
          setup: >-
            The base fixture with a confirmed 4-credit reimbursement enrollment (gross 160000,
            reserved 80000) whose PASSED outcome records only 3 earned credits at grade 3.60.
          setup_api_calls:
            - *k_clock
            - *k_employer
            - *k_policy
            - *k_activate_policy
            - *k_employee
            - *k_school
            - *k_program
            - *k_agreement
            - *k_activate_agreement
            - *k_listing
            - *k_read_employee
            - *k_enroll
            - *k_confirm
            - *k_clock_close
            - call: "POST /enrollments/${enrollment_id}/academic-outcomes"
              payload:
                term_code: "2026-FA"
                completion_status: "PASSED"
                credits_earned: 3
                grade_points: 3.60
              as: SchoolPartner
              as_user_id: "${school_id}"
              captures: { partial_outcome_id: "$.data.id" }
            - call: "POST /enrollments/${enrollment_id}/reimbursement-claims"
              payload:
                amount_requested_cents: 160000
                receipt_reference: "CVC-2026FA-RDELGADO-PARTIAL"
              as: Employee
              as_user_id: "${employee_id}"
              captures: { partial_claim_id: "$.data.id" }
          trigger: "POST /reimbursement-claims/${partial_claim_id}/decide with decision APPROVE"
          assert: >-
            earned_ratio_base_cents is round_half_up(160000 * 3 / 4) = 120000, effective_pct is
            0.50 + 0.10 = 0.60 because grade_points 3.60 >= GRADE_BONUS_MIN_POINTS 3.50, so
            approved_amount_cents is 72000 - not 96000 (which ignoring the earned ratio would give)
            and not 90000 (which applying the ratio after the percentage on a 4-credit base would
            give). platform_admin_fee_cents is 3600 (round_half_up(72000 * 0.05); the employer's
            pre-settlement total_disbursed_cents is 0, tier 1). The enrollment reads
            academic_status PASSED, funding_status SETTLED, credits_earned 3,
            employer_settled_cents 72000, employer_disbursed_cents 72000 and
            employee_share_cents 88000; the employee reads cap_reserved_cents 0,
            cap_disbursed_cents 72000 and cap_available_cents 928000, and the BENEFIT
            TaxLedgerEntry has benefit_cents 72000, excluded_cents 72000 and
            imputed_income_cents 0.

      - name: annual_cap_partial_coverage_takes_min_of_reserve_and_headroom
        claim_type: Correct Result
        grounds: >-
          §1.4 benefit_award_computation sets
          employer_reserved_cents = min(uncapped_cents, employee.cap_available_cents), and §1.4
          priority 44 explicitly permits a positive-but-insufficient headroom, so the second
          enrollment must be accepted with partial employer coverage and the shortfall pushed into
          employee_share_cents.
        distinguishing_aspect: >-
          The only instance where the min() actually clips (headroom 20000 below an uncapped reserve
          of 40000); §1.8's cap instances either have ample headroom or exactly zero headroom, so
          neither exercises partial coverage.
        test_recipe:
          setup: >-
            An employer whose ACTIVE HYBRID policy caps the plan year at 100000 cents, with a
            40000-per-credit listing. A 4-credit enrollment reserves 80000, leaving
            cap_available_cents 20000.
          setup_api_calls:
            - *k_clock
            - call: "POST /employers"
              payload:
                legal_name: "Cedar Ridge Dairy"
                benefit_admin_contact_email: "benefits@cedarridge-dairy.example"
                fiscal_year_start_month: 1
              as: PlatformAdmin
              captures: { employer_id: "$.data.id" }
            - call: "POST /employers/${employer_id}/benefit-policies"
              payload:
                effective_from: "2026-01-01"
                effective_to: "2027-01-01"
                min_tenure_months: 0
                min_weekly_hours: 0
                eligible_job_families: ["OPERATIONS"]
                annual_cap_cents: 100000
                funding_model: "HYBRID"
                reimbursement_pct: 0.50
                max_concurrent_credits: 12
                drop_window_days: 14
                service_commitment_months: 12
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { policy_id: "$.data.id" }
            - *k_activate_policy
            - *k_employee
            - *k_school
            - *k_program
            - *k_agreement
            - *k_activate_agreement
            - *k_listing
            - *k_read_employee
            - *k_enroll
            - call: "GET /employees/${employee_id}"
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { employee_version_2: "$.data.version", headroom_after_first: "$.data.cap_available_cents" }
          trigger: >-
            POST /enrollments for 2 credits of the same listing in term 2026-WI
            (2026-12-20 to 2027-03-20) with funding_model REIMBURSEMENT and
            expected_employee_version ${employee_version_2}
          assert: >-
            The first enrollment reserves min(80000, 100000) = 80000 with employee_share_cents
            80000, leaving cap_available_cents 20000 - positive, so priority 44 does not fire.
            The trigger returns 201 with gross_tuition_cents 80000 (40000 * 2),
            employer_reserved_cents 20000 (min(round_half_up(80000 * 0.50) = 40000, 20000)) and
            employee_share_cents 60000; the employee then reads cap_reserved_cents 100000
            (80000 + 20000), cap_disbursed_cents 0, cap_clawback_hold_cents 0 and
            cap_available_cents 0, so the pool identity 100000 == 0 + 100000 + 0 + 0 holds and a
            third enrollment would now be refused with ERR_ANNUAL_CAP_EXCEEDED.

      - name: cap_ledger_excludes_released_enrollment_reserves
        claim_type: Input Set Filtering
        grounds: >-
          §1.4 annual_cap_ledger aggregates cap_reserved_cents only over enrollments with
          funding_status == RESERVED (BILLED counts as reserved capacity too), and §1.2 states that a
          RELEASED enrollment keeps employer_reserved_cents "for audit but excluded from the cap
          ledger".
        distinguishing_aspect: >-
          Isolates the input-set filter itself: a released reserve remains readable on the
          Enrollment row while being absent from the Employee aggregate, which no other instance
          asserts side by side.
        test_recipe:
          setup: >-
            The base fixture (cap 1000000) with a 4-credit enrollment that is withdrawn inside the
            drop window, releasing its 80000 reserve.
          setup_api_calls:
            - *k_clock
            - *k_employer
            - *k_policy
            - *k_activate_policy
            - *k_employee
            - *k_school
            - *k_program
            - *k_agreement
            - *k_activate_agreement
            - *k_listing
            - *k_read_employee
            - *k_enroll
            - call: "POST /enrollments/${enrollment_id}/withdraw"
              payload: {}
              as: Employee
              as_user_id: "${employee_id}"
              captures: { released_reserve: "$.data.employer_reserved_cents" }
            - call: "GET /employees/${employee_id}"
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { employee_version_2: "$.data.version" }
          trigger: >-
            POST /enrollments for 2 credits of the same listing in term 2026-WI
            (2026-12-20 to 2027-03-20) with funding_model REIMBURSEMENT and
            expected_employee_version ${employee_version_2}
          assert: >-
            The withdrawn enrollment reads funding_status RELEASED with employer_reserved_cents
            80000 still present on the row, yet the employee reads cap_reserved_cents 0 and
            cap_available_cents 1000000 immediately after the withdrawal. The trigger returns 201
            with employer_reserved_cents 40000 (round_half_up(80000 * 0.50)), and the employee then
            reads cap_reserved_cents 40000 and cap_available_cents 960000 - the released 80000 is
            excluded from both. GET /enrollments?employee_id=${employee_id}&funding_status=RELEASED
            returns total_count 1.

      - name: direct_bill_variant_settles_before_any_outcome_exists
        claim_type: Variant Selection
        grounds: >-
          §1.4 selects the direct_bill_upfront_final variant at POST /tuition-invoices/{id}/pay,
          where employer_settled_cents = employer_disbursed_cents = invoice.amount_cents with no
          academic input at all - so under the same HYBRID policy the direct-bill path disburses
          100% of negotiated tuition while the reimbursement path would disburse only
          reimbursement_pct.
        distinguishing_aspect: >-
          Asserts variant SELECTION by funding model on a single enrollment with zero
          AcademicOutcome rows in existence; §1.8's variant work compares provisional against final
          on the reimbursement path instead.
        test_recipe:
          setup: >-
            The base fixture with a DIRECT_BILL 4-credit enrollment confirmed and its invoice
            approved for payment.
          setup_api_calls:
            - *k_clock
            - *k_employer
            - *k_policy
            - *k_activate_policy
            - *k_employee
            - *k_school
            - *k_program
            - *k_agreement
            - *k_activate_agreement
            - *k_listing
            - *k_read_employee
            - *k_enroll_direct
            - call: "POST /enrollments/${direct_enrollment_id}/confirm-registration"
              payload: {}
              as: SchoolPartner
              as_user_id: "${school_id}"
            - *k_read_invoice
            - call: "POST /tuition-invoices/${invoice_id}/approve-payment"
              payload: {}
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
          trigger: "POST /tuition-invoices/${invoice_id}/pay as PlatformAdmin"
          assert: >-
            The direct-bill reserve is the FULL gross 160000 (not 80000 = 50%), so the invoice
            amount_cents is 160000. The trigger returns status PAID with paid_on 2026-08-01, and
            GET /enrollments/${direct_enrollment_id} reads funding_status SETTLED,
            employer_settled_cents 160000, employer_disbursed_cents 160000, employee_share_cents 0
            and academic_status IN_PROGRESS while
            GET /enrollments/${direct_enrollment_id}/academic-outcomes returns total_count 0 - no
            grade or earned-credit input participated. The BENEFIT TaxLedgerEntry has benefit_cents
            160000, excluded_cents 160000 and imputed_income_cents 0; the employee reads
            cap_reserved_cents 0, cap_disbursed_cents 160000 and cap_available_cents 840000, and
            GET /employers/${employer_id} reads total_disbursed_cents 160000 with
            total_admin_fee_cents 0 (no platform fee on the direct-bill path).

      - name: admin_fee_constants_excluded
        claim_type: Constants Applied
        excluded_because:
          difficulty_instance: admin_fee_tier_keyed_on_pre_settlement_employer_disbursement
          rationale: >-
            ADMIN_FEE_PCT_TIER_1/2 and ADMIN_FEE_TIER_1_MAX_CENTS are applied and crossed in that
            §1.8 instance, which settles two claims either side of the 5000000-cent tier boundary.

      - name: rounding_precision_excluded
        claim_type: Precision
        excluded_because:
          difficulty_instance: per_credit_discount_rounding_precedes_credit_multiplication
          rationale: >-
            That §1.8 instance pins round_half_up and the rounding ORDER on a value engineered to
            land on a half cent, which is a strictly stronger precision claim than any single
            rounded field could make.

      - name: award_variant_divergence_excluded
        claim_type: Variant Divergence
        excluded_because:
          difficulty_instance: reserve_versus_settled_award_divergence_on_same_enrollment
          rationale: >-
            The provisional-versus-final divergence and its exact 9225-cent delta on identical
            underlying data are the whole subject of that §1.8 instance.

      - name: tax_variant_reconciliation_excluded
        claim_type: Reconciliation
        excluded_because:
          difficulty_instance: chronological_versus_annual_true_up_tax_exclusion_divergence
          rationale: >-
            The switch from the per-event chronological variant to the annual aggregate variant, and
            the compensating TRUE_UP entry that reconciles the ledger, are asserted end to end there.

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: non_catalog_request_rejected_when_policy_disables_approval
        claim_type: Violation → Error
        grounds: >-
          §1.4 priority 42 requires the employer's current BenefitPolicy to have
          non_catalog_approval_required == true before a ProgramApprovalRequest may be filed,
          yielding ERR_NON_CATALOG_APPROVAL_DISABLED (422).
        distinguishing_aspect: >-
          The only instance that flips a policy feature flag off and shows the request surface
          disappearing - a conditional rule that is invisible under the default true.
        test_recipe:
          setup: >-
            An employer whose ACTIVE policy explicitly sets non_catalog_approval_required false, one
            eligible employee, and a program that has no catalog listing.
          setup_api_calls:
            - *k_clock
            - *k_employer
            - call: "POST /employers/${employer_id}/benefit-policies"
              payload:
                effective_from: "2026-01-01"
                effective_to: "2027-01-01"
                min_tenure_months: 6
                min_weekly_hours: 20
                eligible_job_families: ["OPERATIONS"]
                annual_cap_cents: 1000000
                funding_model: "HYBRID"
                reimbursement_pct: 0.50
                max_concurrent_credits: 12
                drop_window_days: 14
                service_commitment_months: 12
                non_catalog_approval_required: false
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { policy_id: "$.data.id" }
            - *k_activate_policy
            - *k_employee
            - *k_school
            - *k_program
          trigger: >-
            POST /program-approval-requests for ${program_id} with justification and
            requested_annual_cost_cents 600000
          assert: >-
            422 with error_id ERR_NON_CATALOG_APPROVAL_DISABLED, and
            GET /program-approval-requests?employee_id=${employee_id} returns total_count 0. All the
            higher-priority checks pass first: the employee exists, is ELIGIBLE with
            tenure_months 30 >= 6, and the employer has exactly one current ACTIVE policy, so only
            the flag can explain the rejection.

      - name: hybrid_policy_admits_both_funding_models
        claim_type: Satisfaction → Pass
        grounds: >-
          §1.4 priority 43 requires the effective funding model to be a member of
          CatalogListing.allowed_funding_models AND to match the policy's funding_model when that is
          not HYBRID; under a HYBRID policy with a direct-bill-enabled agreement, both DIRECT_BILL
          and REIMBURSEMENT therefore satisfy the rule.
        distinguishing_aspect: >-
          The satisfaction side of the funding-model rule: the same listing accepts both models in
          the same plan year, which is only possible because the policy is HYBRID.
        test_recipe:
          setup: >-
            The base fixture (HYBRID policy, agreement with direct_bill_enabled true) with a
            DIRECT_BILL enrollment already created in term 2026-FA.
          setup_api_calls:
            - *k_clock
            - *k_employer
            - *k_policy
            - *k_activate_policy
            - *k_employee
            - *k_school
            - *k_program
            - *k_agreement
            - *k_activate_agreement
            - *k_listing
            - *k_read_employee
            - *k_enroll_direct
            - call: "GET /employees/${employee_id}"
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { employee_version_2: "$.data.version" }
          trigger: >-
            POST /enrollments for 2 credits of the same listing in term 2026-WI
            (2026-12-20 to 2027-03-20) with funding_model REIMBURSEMENT and
            expected_employee_version ${employee_version_2}
          assert: >-
            GET /catalog-listings/${listing_id} shows allowed_funding_models containing both
            DIRECT_BILL and REIMBURSEMENT (the agreement has direct_bill_enabled true). The
            DIRECT_BILL enrollment succeeded with employer_reserved_cents 160000 (100% of gross) and
            the trigger succeeds with 201, funding_model REIMBURSEMENT and employer_reserved_cents
            40000 (round_half_up(80000 * 0.50)); neither call raises
            ERR_FUNDING_MODEL_NOT_ALLOWED. The employee then reads cap_reserved_cents 200000 and
            cap_available_cents 800000.

      - name: agreement_activation_rejected_for_unaccredited_school
        claim_type: Violation → Error
        grounds: >-
          §1.4 priority 34 requires School.accreditation_status != UNACCREDITED when activating a
          PartnerAgreement, yielding ERR_SCHOOL_NOT_ACCREDITED (422); PROBATION is deliberately
          allowed.
        distinguishing_aspect: >-
          A cross-entity validation whose subject is the School rather than the agreement itself,
          and it pins the three-valued enum so that PROBATION passes while UNACCREDITED fails.
        test_recipe:
          setup: >-
            One employer and two schools - one UNACCREDITED and one on PROBATION - each with a
            PENDING agreement.
          setup_api_calls:
            - *k_clock
            - *k_employer
            - call: "POST /schools"
              payload:
                legal_name: "Northgate Career Academy"
                state_code: "NV"
                contact_email: "partners@northgate-academy.example"
                accreditation_status: "UNACCREDITED"
              as: PlatformAdmin
              captures: { unaccredited_school_id: "$.data.id" }
            - call: "POST /schools"
              payload:
                legal_name: "Sunfield Technical College"
                state_code: "AZ"
                contact_email: "partners@sunfield-tech.example"
                accreditation_status: "PROBATION"
              as: PlatformAdmin
              captures: { probation_school_id: "$.data.id" }
            - call: "POST /partner-agreements"
              payload:
                school_id: "${probation_school_id}"
                employer_id: "${employer_id}"
                negotiated_discount_pct: 0.10
                direct_bill_enabled: false
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
              as: PlatformAdmin
              captures: { probation_agreement_id: "$.data.id" }
            - call: "POST /partner-agreements/${probation_agreement_id}/activate"
              payload: {}
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { probation_agreement_status: "$.data.status" }
            - call: "POST /partner-agreements"
              payload:
                school_id: "${unaccredited_school_id}"
                employer_id: "${employer_id}"
                negotiated_discount_pct: 0.10
                direct_bill_enabled: false
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
              as: PlatformAdmin
              captures: { unaccredited_agreement_id: "$.data.id" }
          trigger: "POST /partner-agreements/${unaccredited_agreement_id}/activate"
          assert: >-
            The PROBATION school's agreement activates with 200 and status ACTIVE, proving the check
            is "!= UNACCREDITED" rather than "== ACCREDITED". The trigger is rejected with 422 and
            error_id ERR_SCHOOL_NOT_ACCREDITED; GET /partner-agreements/${unaccredited_agreement_id}
            still shows status PENDING with an unchanged version, and
            GET /partner-agreements?employer_id=${employer_id}&status=ACTIVE returns total_count 1.

      - name: duplicate_listing_blocked_for_same_employer_and_program
        claim_type: Violation → Error
        grounds: >-
          §1.4 priority 38 forbids a second CatalogListing with status == CURATED for the same
          (employer_id, program_id) pair - and equally forbids one while an open
          ProgramApprovalRequest exists for that pair - yielding ERR_DUPLICATE_LISTING (409).
        distinguishing_aspect: >-
          A uniqueness constraint over a composite key across two parents, asserted with a byte
          identical repeat of a request that has already succeeded.
        test_recipe:
          setup: >-
            The base fixture through the curated listing, then a fresh read of the agreement so the
            repeat carries a current expected_agreement_version.
          setup_api_calls:
            - *k_clock
            - *k_employer
            - *k_policy
            - *k_activate_policy
            - *k_school
            - *k_program
            - *k_agreement
            - *k_activate_agreement
            - *k_listing
            - call: "GET /partner-agreements/${agreement_id}"
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { agreement_version_2: "$.data.version" }
          trigger: >-
            POST /catalog-listings again for the same employer_id and program_id with
            expected_agreement_version ${agreement_version_2}
          assert: >-
            409 with error_id ERR_DUPLICATE_LISTING (not a stale-version 412, since the supplied
            version is current), and GET /catalog-listings?employer_id=${employer_id} still returns
            total_count 1 with id ${listing_id}. After
            POST /catalog-listings/${listing_id}/suspend the same body is accepted with 201, because
            the constraint only covers CURATED rows.

      - name: validation_priority_ordering_excluded
        claim_type: Priority Ordering
        excluded_because:
          difficulty_instance: suspended_listing_state_error_outranks_exhausted_annual_cap
          rationale: >-
            That §1.8 instance violates two rules on one request and asserts the lower-priority
            error is suppressed, together with an isolated control proving the suppressed rule is
            live - exactly the Priority Ordering claim.

      - name: aggregate_capacity_validation_excluded
        claim_type: Violation → Error
        excluded_because:
          difficulty_instance: employee_concurrent_credit_ceiling_counts_shared_end_day
          rationale: >-
            The aggregate-validation pattern (each enrollment individually legal, the collective
            credit sum illegal) is asserted there together with the one-day interval boundary.

  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: patch_employee_hours_recomputes_eligibility_both_ways
        claim_type: Standard CRUD
        grounds: >-
          §1.5 PATCH /employees/{id} accepts weekly_hours, job_family, employment_status and
          termination_date, and §1.1 derives eligibility_status from the current ACTIVE policy's
          min_weekly_hours (20) - so eligibility must be re-derived on every update, in both
          directions.
        distinguishing_aspect: >-
          The only instance that mutates an entity and then reverses the mutation, asserting the
          derived field returns to its original value while version keeps increasing.
        test_recipe:
          setup: "The base fixture with one ELIGIBLE 40-hour employee."
          setup_api_calls:
            - *k_clock
            - *k_employer
            - *k_policy
            - *k_activate_policy
            - *k_employee
            - call: "PATCH /employees/${employee_id}"
              payload: { weekly_hours: 15 }
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { reduced_eligibility: "$.data.eligibility_status", version_after_reduction: "$.data.version" }
          trigger: "PATCH /employees/${employee_id} restoring weekly_hours 40"
          assert: >-
            The employee starts ELIGIBLE with weekly_hours 40 and version 1. Reducing hours to 15
            returns eligibility_status INELIGIBLE_HOURS with version 2 and an updated_at later than
            created_at, while hire_date, tenure_months 30 and cap_available_cents 1000000 are
            untouched. The trigger returns weekly_hours 40, eligibility_status ELIGIBLE again and
            version 3 - the version never decreases even though the derived state was restored.

      - name: term_close_auto_completes_and_raises_coaching_hold
        claim_type: Conditional action
        grounds: >-
          §1.5 POST /_ops/term-close and §1.2 Enrollment IN_PROGRESS -> INCOMPLETE state that an
          enrollment of the closing term with no posted outcome is auto-completed with a SYSTEM
          AcademicOutcome; §1.4 persistence_risk_score then scores it
          10 + OUTCOME_PENALTY 30 + STALENESS_PENALTY 20 = 60, which is exactly the HIGH floor, and
          §1.1 coaching_hold is true for an INCOMPLETE enrollment in tier HIGH.
        distinguishing_aspect: >-
          The only instance that runs the operational term-close path, and it lands the risk score
          exactly on the MEDIUM/HIGH boundary (60) so the derived coaching_hold flips - a
          combination no §1.8 instance produces.
        test_recipe:
          setup: >-
            The base fixture with a confirmed 4-credit reimbursement enrollment for term 2026-FA and
            no outcome posted; the clock advances past the term end.
          setup_api_calls:
            - *k_clock
            - *k_employer
            - *k_policy
            - *k_activate_policy
            - *k_employee
            - *k_school
            - *k_program
            - *k_agreement
            - *k_activate_agreement
            - *k_listing
            - *k_read_employee
            - *k_enroll
            - *k_confirm
            - *k_clock_close
          trigger: "POST /_ops/term-close with term_code 2026-FA"
          assert: >-
            200 with closed_enrollment_count 1, obligation_assessed_count 0 (the enrollment was
            RESERVED, never SETTLED, so nothing can be clawed back), superseded_policy_count 0 (the
            policy window [2026-01-01, 2027-01-01) still contains the 2026-12-20 clock),
            true_up_entry_count 0 (run_annual_true_up was omitted) and coaching_hold_employee_count 1.
            GET /enrollments/${enrollment_id} shows academic_status INCOMPLETE with funding_status
            RESERVED, credits_earned 0, persistence_risk_score 60 and persistence_tier HIGH;
            GET /enrollments/${enrollment_id}/academic-outcomes returns total_count 1 with
            completion_status INCOMPLETE, grade_points null, credits_earned 0 and posted_by_role
            SYSTEM; GET /employees/${employee_id} shows coaching_hold true with cap_reserved_cents
            still 80000, and a further POST /enrollments would now be refused with
            ERR_COACHING_HOLD_ACTIVE.

      - name: claim_rejection_releases_reserve_without_disbursing
        claim_type: Action endpoint
        grounds: >-
          §1.2 Enrollment.funding_status RESERVED -> RELEASED is triggered by
          POST /reimbursement-claims/{id}/decide with decision == REJECT, whose side effects set
          employee_share_cents = gross_tuition_cents and free the reserve without any disbursement or
          ledger entry.
        distinguishing_aspect: >-
          Covers the REJECT branch of the claim decision, whose money effects are the exact opposite
          of the APPROVE branch that every §1.8 settlement instance follows.
        test_recipe:
          setup: >-
            The base fixture with a PASSED 4-credit reimbursement enrollment and a SUBMITTED claim
            for the full gross.
          setup_api_calls:
            - *k_clock
            - *k_employer
            - *k_policy
            - *k_activate_policy
            - *k_employee
            - *k_school
            - *k_program
            - *k_agreement
            - *k_activate_agreement
            - *k_listing
            - *k_read_employee
            - *k_enroll
            - *k_confirm
            - *k_clock_close
            - *k_outcome
            - *k_claim
          trigger: >-
            POST /reimbursement-claims/${claim_id}/decide with decision REJECT and decision_note
            "Receipt does not match the enrolled term."
          assert: >-
            200 with status REJECTED, approved_amount_cents 0, platform_admin_fee_cents 0 and
            decision_note "Receipt does not match the enrolled term."
            GET /enrollments/${enrollment_id} shows academic_status PASSED (unchanged) with
            funding_status RELEASED, employer_settled_cents 0, employer_disbursed_cents 0 and
            employee_share_cents 160000; GET /employees/${employee_id} shows cap_reserved_cents 0,
            cap_disbursed_cents 0 and cap_available_cents 1000000;
            GET /tax-ledger-entries?enrollment_id=${enrollment_id} returns total_count 0 and
            GET /employers/${employer_id} shows total_disbursed_cents 0 with
            total_admin_fee_cents 0.

      - name: enrollment_listing_filters_by_academic_status_and_paginates
        claim_type: Standard CRUD
        grounds: >-
          §1.5 GET /enrollments accepts employee_id, academic_status, limit and offset, and §1.0
          pins the envelope's total_count / has_more plus the limit 10 / offset 0 defaults; §1.1
          pins created_at ASC as the fallback ordering.
        distinguishing_aspect: >-
          The only instance that combines a state filter with paging on the busiest collection and
          asserts the ordering is creation order, not identifier order.
        test_recipe:
          setup: >-
            The base fixture with two enrollments in disjoint terms; the first is confirmed so the
            two rows differ in academic_status.
          setup_api_calls:
            - *k_clock
            - *k_employer
            - *k_policy
            - *k_activate_policy
            - *k_employee
            - *k_school
            - *k_program
            - *k_agreement
            - *k_activate_agreement
            - *k_listing
            - *k_read_employee
            - *k_enroll
            - *k_confirm
            - call: "GET /employees/${employee_id}"
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { employee_version_2: "$.data.version" }
            - call: "POST /enrollments"
              payload:
                employee_id: "${employee_id}"
                catalog_listing_id: "${listing_id}"
                term_code: "2026-WI"
                term_start_date: "2026-12-20"
                term_end_date: "2027-03-20"
                credits: 2
                funding_model: "REIMBURSEMENT"
                expected_employee_version: "${employee_version_2}"
              as: Employee
              as_user_id: "${employee_id}"
              captures: { enrollment_2_id: "$.data.id" }
          trigger: "GET /enrollments with employee_id ${employee_id}, academic_status REGISTERED, limit 10, offset 0"
          assert: >-
            The trigger returns total_count 1, has_more false and a single element whose id is
            ${enrollment_2_id} with credits 2 - the confirmed enrollment is IN_PROGRESS and
            therefore filtered out. Re-reading with employee_id only and limit 1, offset 0 returns
            total_count 2, has_more true and the element ${enrollment_id} (created first, so
            created_at ASC puts it on page one); limit 1, offset 1 returns ${enrollment_2_id} with
            has_more false. Adding academic_status IN_PROGRESS returns total_count 1 with
            ${enrollment_id}.

      - name: agreement_lifecycle_action_endpoint_excluded
        claim_type: Action endpoint
        excluded_because:
          difficulty_instance: catalog_listing_creation_gated_by_partner_agreement_lifecycle
          rationale: >-
            The activate and terminate action endpoints, their preconditions and the termination
            cascade into listings are all asserted in that §1.8 instance.

      - name: computed_read_endpoint_excluded
        claim_type: Computed read
        excluded_because:
          difficulty_instance: utilization_report_zero_denominator_boundaries
          rationale: >-
            GET /employers/{id}/utilization-report is read three times at three population sizes
            there, covering the computed-read contract including its empty-collection behaviour.

  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: employer_not_found_on_unknown_path_employer
        claim_type: Error Triggerable
        grounds: >-
          §1.4 priority 4 checks path Employer existence for GET /employers/{id},
          GET /employers/{id}/utilization-report and the employer sub-collections, raising
          ERR_EMPLOYER_NOT_FOUND (404) per §1.6.
        distinguishing_aspect: >-
          Triggers the existence layer on a computed-read sub-path, proving the 404 precedes the
          aggregation rather than the report returning empty zeroes for an unknown employer.
        test_recipe:
          setup: "Empty database apart from the pinned clock."
          setup_api_calls:
            - *k_clock
          trigger: >-
            GET /employers/11111111-1111-4111-8111-111111111111/utilization-report as PlatformAdmin
          assert: >-
            404 with error_id ERR_EMPLOYER_NOT_FOUND and no report body; the same unknown id on
            GET /employers/{id} and on GET /employers/{id}/employees also returns
            ERR_EMPLOYER_NOT_FOUND, so the report does not fall back to the empty-collection
            behaviour.

      - name: program_not_found_when_listing_body_references_unknown_program
        claim_type: Error Triggerable
        grounds: >-
          §1.4 priority 15 validates body-referenced resources in the declared input order and
          raises each missing reference's own error, so an unknown program_id on
          POST /catalog-listings yields ERR_PROGRAM_NOT_FOUND (404) - ahead of the priority-18 OCC
          check and the priority-29 agreement-state check.
        distinguishing_aspect: >-
          The only instance that fails a BODY reference rather than a path segment, and it supplies a
          current expected_agreement_version so the 404 cannot be confused with a 412.
        test_recipe:
          setup: "One employer, one school and one ACTIVE partner agreement."
          setup_api_calls:
            - *k_clock
            - *k_employer
            - *k_school
            - *k_agreement
            - *k_activate_agreement
          trigger: >-
            POST /catalog-listings with employer_id ${employer_id}, agreement_id ${agreement_id},
            expected_agreement_version ${agreement_version} and
            program_id 22222222-2222-4222-8222-222222222222
          assert: >-
            404 with error_id ERR_PROGRAM_NOT_FOUND (not ERR_STALE_AGREEMENT_VERSION and not
            ERR_AGREEMENT_NOT_ACTIVE, both of whose conditions are satisfied), and
            GET /catalog-listings?employer_id=${employer_id} returns total_count 0.

      - name: enrollment_without_any_active_policy_is_refused
        claim_type: Error Triggerable
        grounds: >-
          §1.4 priority 28 requires the employer to have exactly one current BenefitPolicy with
          status == ACTIVE covering the clock date, raising ERR_NO_ACTIVE_POLICY (409); §1.1 also
          derives eligibility_status INELIGIBLE_NO_POLICY in that situation.
        distinguishing_aspect: >-
          The only instance that runs the enrollment path with no policy row at all, separating the
          referential "no policy" failure from the eligibility failures that a policy would produce.
        test_recipe:
          setup: >-
            An employer with one employee, a curated listing and an ACTIVE agreement - but no
            BenefitPolicy has ever been activated.
          setup_api_calls:
            - *k_clock
            - *k_employer
            - *k_employee
            - *k_school
            - *k_program
            - *k_agreement
            - *k_activate_agreement
            - *k_listing
            - *k_read_employee
          trigger: >-
            POST /enrollments for 4 credits of the listing in term 2026-FA with
            expected_employee_version ${employee_version}
          assert: >-
            The employee reads eligibility_status INELIGIBLE_NO_POLICY with cap_plan_year 2026,
            annual headroom cap_available_cents 0 and coaching_hold false. The trigger is rejected
            with 409 and error_id ERR_NO_ACTIVE_POLICY - not ERR_EMPLOYEE_NOT_ELIGIBLE (priority 32
            deliberately excludes INELIGIBLE_NO_POLICY's downstream symptoms) and not
            ERR_ANNUAL_CAP_EXCEEDED, even though cap_available_cents is 0. No Enrollment row is
            created.

      - name: direct_bill_enrollment_cannot_file_a_reimbursement_claim
        claim_type: Error Triggerable
        grounds: >-
          §1.4 priority 31 requires Enrollment.funding_model == REIMBURSEMENT on
          POST /enrollments/{id}/reimbursement-claims, raising ERR_REIMBURSEMENT_NOT_ALLOWED (409);
          priority 24 explicitly stands aside for DIRECT_BILL enrollments so this is the reachable
          path.
        distinguishing_aspect: >-
          The only instance that files a claim against the direct-bill funding path, where the
          employer has already paid the school in full, so double payment must be refused on model
          grounds rather than state grounds.
        test_recipe:
          setup: >-
            The base fixture with a DIRECT_BILL 4-credit enrollment whose invoice has been paid and
            whose PASSED outcome has been posted, so it sits at (PASSED, SETTLED).
          setup_api_calls:
            - *k_clock
            - *k_employer
            - *k_policy
            - *k_activate_policy
            - *k_employee
            - *k_school
            - *k_program
            - *k_agreement
            - *k_activate_agreement
            - *k_listing
            - *k_read_employee
            - *k_enroll_direct
            - call: "POST /enrollments/${direct_enrollment_id}/confirm-registration"
              payload: {}
              as: SchoolPartner
              as_user_id: "${school_id}"
            - *k_read_invoice
            - call: "POST /tuition-invoices/${invoice_id}/approve-payment"
              payload: {}
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
            - call: "POST /tuition-invoices/${invoice_id}/pay"
              payload: {}
              as: PlatformAdmin
            - *k_clock_close
            - call: "POST /enrollments/${direct_enrollment_id}/academic-outcomes"
              payload:
                term_code: "2026-FA"
                completion_status: "PASSED"
                credits_earned: 4
                grade_points: 3.60
              as: SchoolPartner
              as_user_id: "${school_id}"
              captures: { direct_outcome_id: "$.data.id" }
          trigger: >-
            POST /enrollments/${direct_enrollment_id}/reimbursement-claims with
            amount_requested_cents 160000 and receipt_reference "CVC-2026FA-DOUBLE-DIP"
          assert: >-
            409 with error_id ERR_REIMBURSEMENT_NOT_ALLOWED. The higher-priority checks all pass:
            academic_status is PASSED (priority 23) and the latest outcome is PASSED with
            grade_points 3.60 >= 2.00 (priority 30). No ReimbursementClaim is created
            (GET /enrollments/${direct_enrollment_id}/reimbursement-claims returns total_count 0),
            employer_disbursed_cents stays 160000 and GET /employers/${employer_id} still reads
            total_disbursed_cents 160000 with total_admin_fee_cents 0.

      - name: duplicate_enrollment_for_same_listing_and_term_is_refused
        claim_type: Error Triggerable
        grounds: >-
          §1.4 priority 39 forbids a second Enrollment with the same
          (employee_id, catalog_listing_id, term_code) whose academic_status is not WITHDRAWN or
          FAILED, raising ERR_DUPLICATE_ENROLLMENT (409).
        distinguishing_aspect: >-
          A three-part uniqueness key whose exemption list is state-dependent; this instance asserts
          both the refusal and that a withdrawal re-opens the same key.
        test_recipe:
          setup: >-
            The base fixture with one REGISTERED 4-credit enrollment in term 2026-FA and a fresh
            employee version for the retry.
          setup_api_calls:
            - *k_clock
            - *k_employer
            - *k_policy
            - *k_activate_policy
            - *k_employee
            - *k_school
            - *k_program
            - *k_agreement
            - *k_activate_agreement
            - *k_listing
            - *k_read_employee
            - *k_enroll
            - call: "GET /employees/${employee_id}"
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { employee_version_2: "$.data.version" }
          trigger: >-
            POST /enrollments for the same employee, the same listing and the same term_code
            2026-FA with expected_employee_version ${employee_version_2}
          assert: >-
            409 with error_id ERR_DUPLICATE_ENROLLMENT, and
            GET /enrollments?employee_id=${employee_id} still returns total_count 1 with
            cap_reserved_cents unchanged at 80000. After
            POST /enrollments/${enrollment_id}/withdraw the identical body is accepted with 201,
            because WITHDRAWN rows are exempt from the uniqueness key.

      - name: repayment_payment_above_balance_is_refused
        claim_type: Error Triggerable
        grounds: >-
          §1.4 priority 41 requires the payment amount_cents <= RepaymentObligation.balance_cents,
          raising ERR_REPAYMENT_EXCEEDS_BALANCE (422); §1.2 also caps a payment at the balance so no
          overpayment can ever be recorded.
        distinguishing_aspect: >-
          The only instance that probes the obligation payment ceiling, one cent above a balance that
          was itself produced by a full-recovery ACADEMIC_FAILURE clawback.
        test_recipe:
          setup: >-
            The base fixture with a DIRECT_BILL 4-credit enrollment paid in full (160000) and then
            marked FAILED, which assesses a full-recovery obligation.
          setup_api_calls:
            - *k_clock
            - *k_employer
            - *k_policy
            - *k_activate_policy
            - *k_employee
            - *k_school
            - *k_program
            - *k_agreement
            - *k_activate_agreement
            - *k_listing
            - *k_read_employee
            - *k_enroll_direct
            - call: "POST /enrollments/${direct_enrollment_id}/confirm-registration"
              payload: {}
              as: SchoolPartner
              as_user_id: "${school_id}"
            - *k_read_invoice
            - call: "POST /tuition-invoices/${invoice_id}/approve-payment"
              payload: {}
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
            - call: "POST /tuition-invoices/${invoice_id}/pay"
              payload: {}
              as: PlatformAdmin
            - *k_clock_close
            - call: "POST /enrollments/${direct_enrollment_id}/academic-outcomes"
              payload:
                term_code: "2026-FA"
                completion_status: "FAILED"
                credits_earned: 0
                grade_points: 1.20
              as: SchoolPartner
              as_user_id: "${school_id}"
            - call: "GET /enrollments/${direct_enrollment_id}/repayment-obligations"
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { obligation_id: "$.data[0].id", obligation_balance: "$.data[0].balance_cents" }
          trigger: "POST /repayment-obligations/${obligation_id}/payments with amount_cents 160001"
          assert: >-
            The obligation reads trigger_reason ACADEMIC_FAILURE, principal_cents 160000,
            paid_cents 0, waived_cents 0, balance_cents 160000 and status ASSESSED. The trigger is
            rejected with 422 and error_id ERR_REPAYMENT_EXCEEDS_BALANCE; the obligation still reads
            paid_cents 0 and balance_cents 160000, status ASSESSED, and
            GET /employees/${employee_id} still reads open_repayment_balance_cents 160000 with
            cap_clawback_hold_cents 160000. A payment of exactly 160000 is accepted and settles it,
            so the boundary is inclusive.

      - name: employee_on_leave_is_not_eligible_to_enrol
        claim_type: Error Triggerable
        grounds: >-
          §1.1 derives eligibility_status INELIGIBLE_EMPLOYMENT when employment_status is LEAVE or
          TERMINATED, and §1.4 priority 32 refuses POST /enrollments for that status with
          ERR_EMPLOYEE_NOT_ELIGIBLE (422).
        distinguishing_aspect: >-
          Uses LEAVE rather than TERMINATED, so the employee is still on the roster with intact
          tenure and hours - the employment dimension alone must block the enrollment.
        test_recipe:
          setup: >-
            The base fixture with the eligible employee moved to employment_status LEAVE.
          setup_api_calls:
            - *k_clock
            - *k_employer
            - *k_policy
            - *k_activate_policy
            - *k_employee
            - *k_school
            - *k_program
            - *k_agreement
            - *k_activate_agreement
            - *k_listing
            - call: "PATCH /employees/${employee_id}"
              payload: { employment_status: "LEAVE" }
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { leave_eligibility: "$.data.eligibility_status", employee_version_2: "$.data.version" }
          trigger: >-
            POST /enrollments for 4 credits of the listing in term 2026-FA with
            expected_employee_version ${employee_version_2}
          assert: >-
            The PATCH returns employment_status LEAVE, termination_date null,
            eligibility_status INELIGIBLE_EMPLOYMENT, weekly_hours still 40 and tenure_months still
            30. The trigger is rejected with 422 and error_id ERR_EMPLOYEE_NOT_ELIGIBLE (not
            ERR_EMPLOYEE_TENURE_NOT_MET, whose condition is satisfied), and
            GET /enrollments?employee_id=${employee_id} returns total_count 0. Patching
            employment_status back to ACTIVE restores eligibility_status ELIGIBLE and the same
            enrollment then succeeds.

      - name: unknown_path_ids_raise_each_entity_specific_not_found
        claim_type: Error Triggerable
        grounds: >-
          §1.6 declares a distinct 404 for each of the twelve addressable entities
          (ERR_EMPLOYER_NOT_FOUND, ERR_POLICY_NOT_FOUND, ERR_EMPLOYEE_NOT_FOUND,
          ERR_SCHOOL_NOT_FOUND, ERR_PROGRAM_NOT_FOUND, ERR_AGREEMENT_NOT_FOUND,
          ERR_LISTING_NOT_FOUND, ERR_REQUEST_NOT_FOUND, ERR_ENROLLMENT_NOT_FOUND,
          ERR_INVOICE_NOT_FOUND, ERR_CLAIM_NOT_FOUND, ERR_OBLIGATION_NOT_FOUND), and §1.4 priorities
          4-14 resolve path ids before any state or business check.
        distinguishing_aspect: >-
          A sweep that pins the entity-specific error_id for every addressable type, so no endpoint
          collapses to a generic 404 and no path resolves the wrong entity family.
        test_recipe:
          setup: "Empty database apart from the pinned clock."
          setup_api_calls:
            - *k_clock
          trigger: >-
            One canonical GET per entity with the unused uuid
            44444444-4444-4444-8444-444444444444 in the path: /employers/{id},
            /benefit-policies/{id}, /employees/{id}, /schools/{id}, /programs/{id},
            /partner-agreements/{id}, /catalog-listings/{id}, /program-approval-requests/{id},
            /enrollments/{id}, /tuition-invoices/{id}, /reimbursement-claims/{id} and
            /repayment-obligations/{id}, each issued with a role §1.5 permits for that endpoint
          assert: >-
            Every call returns 404 with the entity's own error_id and no data payload - twelve
            distinct codes, never a shared generic one. The sub-collection routes agree with their
            parents: GET /employers/{unknown}/employees returns ERR_EMPLOYER_NOT_FOUND,
            GET /schools/{unknown}/programs returns ERR_SCHOOL_NOT_FOUND, and
            GET /enrollments/{unknown}/invoices returns ERR_ENROLLMENT_NOT_FOUND rather than an
            empty list with total_count 0.

      - name: settled_reimbursement_chain_locks_repeat_operations
        claim_type: Error Triggerable
        grounds: >-
          §1.6 declares ERR_AGREEMENT_INVALID_STATE (409) for activating an agreement that is not
          PENDING, ERR_CLAIM_INVALID_STATE (409) for deciding a ReimbursementClaim that is already
          APPROVED or REJECTED, and ERR_ENROLLMENT_INVALID_FUNDING_STATE (409) when the enrollment's
          funding_status does not admit the operation - all three reachable from one settled chain.
        distinguishing_aspect: >-
          Bundles the three "already past that point" guards of the money path onto a single fixture,
          each on a different entity, so the errors cannot be confused with the not-found or
          eligibility families.
        test_recipe:
          setup: >-
            The base fixture carried all the way through settlement: a REIMBURSEMENT enrollment
            confirmed, PASSED at term close, claimed and APPROVED, leaving the enrollment at
            (PASSED, SETTLED), the claim at APPROVED and the agreement at ACTIVE.
          setup_api_calls:
            - *k_clock
            - *k_employer
            - *k_policy
            - *k_activate_policy
            - *k_employee
            - *k_school
            - *k_program
            - *k_agreement
            - *k_activate_agreement
            - *k_listing
            - *k_read_employee
            - *k_enroll
            - *k_confirm
            - *k_clock_close
            - *k_outcome
            - *k_claim
            - *k_decide
          trigger: >-
            Three repeat operations against the settled fixture:
            POST /partner-agreements/${agreement_id}/activate,
            POST /reimbursement-claims/${claim_id}/decide with decision REJECT, and
            POST /enrollments/${enrollment_id}/reimbursement-claims for amount_requested_cents 1
            with a fresh receipt_reference
          assert: >-
            The re-activation returns 409 ERR_AGREEMENT_INVALID_STATE (priority 20) and the agreement
            stays ACTIVE with an unchanged version. The second decision returns 409
            ERR_CLAIM_INVALID_STATE (priority 26 requires SUBMITTED) and the claim stays APPROVED
            with approved_amount_cents 96000 - the REJECT does not claw the disbursement back. The
            second claim returns 409 ERR_ENROLLMENT_INVALID_FUNDING_STATE (priority 24: funding_status
            is SETTLED, not RESERVED) even though the academic guard at priority 23 passes on PASSED,
            and GET /enrollments/${enrollment_id}/reimbursement-claims still returns total_count 1
            with employer_disbursed_cents 96000, platform_admin_fee_cents 4800 and the employer
            rollups total_disbursed_cents 96000 / total_admin_fee_cents 4800 unchanged.

      - name: decided_approval_request_is_locked_against_a_second_decision
        claim_type: Error Triggerable
        grounds: >-
          §1.6 declares ERR_REQUEST_INVALID_STATE (409) when review, decide or resubmit is called on
          a ProgramApprovalRequest whose status does not admit that transition; §1.2 makes APPROVED
          a terminal state of that machine.
        distinguishing_aspect: >-
          Probes all three triggers of one state machine from its terminal state, distinguishing the
          state guard from the revision-count guard (ERR_REVISION_LIMIT_REACHED) that the §1.8 cyclic
          instance exercises from a non-terminal state.
        test_recipe:
          setup: >-
            The base fixture plus an unlisted program; the employee's non-catalog request is
            reviewed and APPROVED, which is terminal.
          setup_api_calls:
            - *k_clock
            - *k_employer
            - *k_policy
            - *k_activate_policy
            - *k_employee
            - *k_school
            - call: "POST /schools/${school_id}/programs"
              payload:
                name: "MS Supply Chain Analytics"
                credential_type: "MASTER"
                skill_track: "BUSINESS_ADMIN"
                list_tuition_per_credit_cents: 75000
                total_credits: 30
                term_length_weeks: 14
              as: SchoolPartner
              as_user_id: "${school_id}"
              captures: { unlisted_program_id: "$.data.id" }
            - call: "POST /program-approval-requests"
              payload:
                employee_id: "${employee_id}"
                program_id: "${unlisted_program_id}"
                justification: "Regional distribution ladder requires the MS."
                requested_annual_cost_cents: 900000
              as: Employee
              as_user_id: "${employee_id}"
              captures: { request_id: "$.data.id" }
            - call: "POST /program-approval-requests/${request_id}/review"
              payload: {}
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
            - call: "POST /program-approval-requests/${request_id}/decide"
              payload: { decision: "APPROVE" }
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
          trigger: >-
            All three triggers replayed against the APPROVED request:
            POST /program-approval-requests/${request_id}/review,
            POST /program-approval-requests/${request_id}/decide with decision REJECT, and
            POST /program-approval-requests/${request_id}/resubmit
          assert: >-
            Each of the three returns 409 with error_id ERR_REQUEST_INVALID_STATE, never
            ERR_REVISION_LIMIT_REACHED (revision_count is still 0). The request still reads status
            APPROVED with revision_count 0, and
            GET /catalog-listings?source_request_id=${request_id} still returns exactly one
            exception listing - the terminal lockdown does not duplicate the APPROVE side effect.

      - name: waived_obligation_is_locked_against_further_money_movement
        claim_type: Error Triggerable
        grounds: >-
          §1.6 declares ERR_OBLIGATION_INVALID_STATE (409) for paying or waiving a
          RepaymentObligation that is already SETTLED or WAIVED; §1.2 makes both WAIVED and SETTLED
          terminal.
        distinguishing_aspect: >-
          The obligation-side lifecycle guard, reached through a full-recovery ACADEMIC_FAILURE
          clawback and a total waiver, so the refusal is asserted on the WAIVED terminal rather than
          on the balance ceiling that the payment-overshoot instance probes.
        test_recipe:
          setup: >-
            A DIRECT_BILL 4-credit enrollment paid in full (160000) and then FAILED, whose
            160000 obligation is waived outright.
          setup_api_calls:
            - *k_clock
            - *k_employer
            - *k_policy
            - *k_activate_policy
            - *k_employee
            - *k_school
            - *k_program
            - *k_agreement
            - *k_activate_agreement
            - *k_listing
            - *k_read_employee
            - *k_enroll_direct
            - call: "POST /enrollments/${direct_enrollment_id}/confirm-registration"
              payload: {}
              as: SchoolPartner
              as_user_id: "${school_id}"
            - *k_read_invoice
            - call: "POST /tuition-invoices/${invoice_id}/approve-payment"
              payload: {}
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
            - call: "POST /tuition-invoices/${invoice_id}/pay"
              payload: {}
              as: PlatformAdmin
            - *k_clock_close
            - call: "POST /enrollments/${direct_enrollment_id}/academic-outcomes"
              payload:
                term_code: "2026-FA"
                completion_status: "FAILED"
                credits_earned: 0
                grade_points: 1.20
              as: SchoolPartner
              as_user_id: "${school_id}"
            - call: "GET /enrollments/${direct_enrollment_id}/repayment-obligations"
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { obligation_id: "$.data[0].id" }
            - call: "POST /repayment-obligations/${obligation_id}/waive"
              payload: {}
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { waived_status: "$.data.status" }
          trigger: >-
            Two further money movements against the waived obligation:
            POST /repayment-obligations/${obligation_id}/payments with amount_cents 1, and
            POST /repayment-obligations/${obligation_id}/waive a second time
          assert: >-
            The waive call returns status WAIVED with waived_cents 160000 (the whole balance at waive
            time - the endpoint takes no amount input), paid_cents 0 and balance_cents 0, and
            GET /employees/${employee_id} then reads open_repayment_balance_cents 0 while
            cap_clawback_hold_cents REMAINS 160000, because the employer absorbed the cost and a
            waiver does not restore annual headroom (cap_available_cents stays 840000). Both trigger
            calls return 409 with error_id ERR_OBLIGATION_INVALID_STATE - the payment does NOT return
            ERR_REPAYMENT_EXCEEDS_BALANCE even though 1 > balance_cents 0, because the priority-27
            status guard (ASSESSED or PARTIALLY_PAID only) precedes the priority-41 amount check. The
            obligation still reads waived_cents 160000, paid_cents 0 and status WAIVED.

  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: school_partner_cannot_activate_a_partner_agreement
        claim_type: Exclusive Operation Denied
        grounds: >-
          §1.7 lists POST /partner-agreements/{id}/activate among BenefitAdministrator's
          exclusive_operations and §1.5 restricts its roles to [BenefitAdministrator], so §1.4
          priority 2 refuses any other role with ERR_UNAUTHORIZED (403).
        distinguishing_aspect: >-
          Denies a peer role (SchoolPartner) an operation on an entity it partly owns - the agreement
          references its own school - so ownership cannot be mistaken for authority.
        test_recipe:
          setup: "One employer, one school and one PENDING agreement between them."
          setup_api_calls:
            - *k_clock
            - *k_employer
            - *k_school
            - *k_agreement
          trigger: >-
            POST /partner-agreements/${agreement_id}/activate with X-User-Role SchoolPartner and
            X-User-ID ${school_id}
          assert: >-
            403 with error_id ERR_UNAUTHORIZED, and GET /partner-agreements/${agreement_id} still
            shows status PENDING with version 1. The same call as BenefitAdministrator with
            X-User-ID ${employer_id} returns 200 with status ACTIVE, so only the role differed.

      - name: benefit_administrator_cannot_read_another_employers_employee
        claim_type: Peer Isolation
        grounds: >-
          §1.0 declares role_model peer_roles and §1.4 priority 16 requires a
          BenefitAdministrator's X-User-ID to equal the Employer id owning the target, raising
          ERR_UNAUTHORIZED (403); §1.7 marks BenefitAdministrator as
          identity: entity_backed:Employer.
        distinguishing_aspect: >-
          The only instance that exercises tenant isolation between two employers of the same
          platform, distinguishing a 403 ownership failure from the 404 an unknown id would give.
        test_recipe:
          setup: >-
            Two employers, with the ACTIVE policy and the employee belonging to the first.
          setup_api_calls:
            - *k_clock
            - *k_employer
            - *k_policy
            - *k_activate_policy
            - *k_employee
            - call: "POST /employers"
              payload:
                legal_name: "Rival Provisions Co"
                benefit_admin_contact_email: "benefits@rival-provisions.example"
                fiscal_year_start_month: 1
              as: PlatformAdmin
              captures: { other_employer_id: "$.data.id" }
          trigger: >-
            GET /employees/${employee_id} with X-User-Role BenefitAdministrator and X-User-ID
            ${other_employer_id}
          assert: >-
            403 with error_id ERR_UNAUTHORIZED - not 404, because the employee exists. The same read
            with X-User-ID ${employer_id} returns 200 with eligibility_status ELIGIBLE, and
            GET /employers/${other_employer_id}/employees as the second administrator returns
            total_count 0, so neither tenant can observe the other's roster.

      - name: enrollment_read_is_shared_across_four_roles
        claim_type: Shared Operation
        grounds: >-
          §1.5 GET /enrollments/{id} lists roles [Employee, BenefitAdministrator, Coach,
          SchoolPartner] and §1.7 places the read in each of those roles' shared_operations, with
          Coach declared identity: opaque so no ownership scope applies to it.
        distinguishing_aspect: >-
          The only instance that asserts one endpoint succeeding under four different roles,
          including the opaque Coach identity that is exempt from the priority-16 ownership scope.
        test_recipe:
          setup: "The base fixture with one REGISTERED enrollment."
          setup_api_calls:
            - *k_clock
            - *k_employer
            - *k_policy
            - *k_activate_policy
            - *k_employee
            - *k_school
            - *k_program
            - *k_agreement
            - *k_activate_agreement
            - *k_listing
            - *k_read_employee
            - *k_enroll
          trigger: >-
            GET /enrollments/${enrollment_id} four times - as Employee with X-User-ID
            ${employee_id}, as BenefitAdministrator with ${employer_id}, as SchoolPartner with
            ${school_id}, and as Coach with any identifier
          assert: >-
            All four reads return 200 with identical data: gross_tuition_cents 160000,
            employer_reserved_cents 80000, academic_status REGISTERED and funding_status RESERVED.
            The Coach read succeeds with an arbitrary X-User-ID because Coach is opaque, while the
            SchoolPartner read succeeds only for ${school_id}; a SchoolPartner read with a different
            school id returns 403 ERR_UNAUTHORIZED, and a PlatformAdmin read returns 403 because
            PlatformAdmin is not in the endpoint's role list.

      - name: missing_role_header_is_unauthenticated
        claim_type: Authentication
        grounds: >-
          §1.4 priority 1 requires both X-User-Role and X-User-ID to be present with a recognised
          role, raising ERR_UNAUTHENTICATED (401) per §1.6 - ahead of every authorization and
          existence check.
        distinguishing_aspect: >-
          Separates 401 from 403 and from 404 by omitting the headers entirely on a path whose
          target does not exist either, so only the authentication layer can answer.
        test_recipe:
          setup: "One employer."
          setup_api_calls:
            - *k_clock
            - *k_employer
          trigger: >-
            GET /employers/${employer_id} with no X-User-Role header, and
            GET /employers/33333333-3333-4333-8333-333333333333 with no headers at all
          assert: >-
            Both calls return 401 with error_id ERR_UNAUTHENTICATED; the second does NOT return
            ERR_EMPLOYER_NOT_FOUND, proving priority 1 runs before priority 4. Supplying
            X-User-Role "Auditor" (not one of the five declared roles) with a valid X-User-ID also
            returns 401 ERR_UNAUTHENTICATED rather than 403.

  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_employee_version_rejects_enrollment_create
        claim_type: optimistic_concurrency
        grounds: >-
          §1.2.1 concurrency rule enrollment-create-stale-employee declares occ_field
          expected_employee_version on write_endpoint POST /enrollments with error
          ERR_STALE_EMPLOYEE_VERSION (412); §1.1 bumps Employee.version on every write, so a
          concurrent PATCH invalidates a version read a moment earlier.
        distinguishing_aspect: >-
          The OCC guard on the Employee parent, invalidated by an unrelated attribute update
          (weekly_hours) rather than by another enrollment - so the test proves any write bumps the
          version.
        test_recipe:
          setup: >-
            The base fixture; the employee's version is read, then an administrator patches the
            employee's weekly_hours, invalidating that version.
          setup_api_calls:
            - *k_clock
            - *k_employer
            - *k_policy
            - *k_activate_policy
            - *k_employee
            - *k_school
            - *k_program
            - *k_agreement
            - *k_activate_agreement
            - *k_listing
            - *k_read_employee
            - call: "PATCH /employees/${employee_id}"
              payload: { weekly_hours: 38 }
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { bumped_employee_version: "$.data.version" }
          trigger: >-
            POST /enrollments for 4 credits of the listing in term 2026-FA carrying the now-stale
            expected_employee_version ${employee_version}
          assert: >-
            The read version ${employee_version} is 1 and the PATCH returns
            ${bumped_employee_version} 2 with eligibility_status still ELIGIBLE (38 >= 20). The
            trigger is rejected with 412 and error_id ERR_STALE_EMPLOYEE_VERSION, and
            GET /enrollments?employee_id=${employee_id} returns total_count 0 with
            cap_reserved_cents 0. Retrying with expected_employee_version
            ${bumped_employee_version} returns 201, so nothing but the version was wrong.

      - name: stale_agreement_version_rejects_listing_create
        claim_type: optimistic_concurrency
        grounds: >-
          §1.2.1 concurrency rule listing-create-stale-agreement declares occ_field
          expected_agreement_version on write_endpoint POST /catalog-listings with error
          ERR_STALE_AGREEMENT_VERSION (412), and §1.4 places that check at priority 18 - ahead of
          the priority-29 agreement-state check.
        distinguishing_aspect: >-
          The second declared OCC rule, guarding a different parent (PartnerAgreement) on a
          different write endpoint, and invalidated by the activation transition itself rather than
          by an attribute patch.
        test_recipe:
          setup: >-
            One employer, one school, one program and one agreement whose PENDING version is read
            before the agreement is activated.
          setup_api_calls:
            - *k_clock
            - *k_employer
            - *k_school
            - *k_program
            - *k_agreement
            - call: "GET /partner-agreements/${agreement_id}"
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { pending_agreement_version: "$.data.version" }
            - *k_activate_agreement
          trigger: >-
            POST /catalog-listings for ${program_id} carrying the pre-activation
            expected_agreement_version ${pending_agreement_version}
          assert: >-
            ${pending_agreement_version} is 1 and ${agreement_version} (read from the activation
            response) is 2. The trigger is rejected with 412 and error_id
            ERR_STALE_AGREEMENT_VERSION, and GET /catalog-listings?employer_id=${employer_id}
            returns total_count 0. Retrying with expected_agreement_version ${agreement_version}
            returns 201 with status CURATED and negotiated_tuition_per_credit_cents 40000, so the
            version check is the only thing that changed.

      - name: cascading_side_effects_layer_excluded
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: failed_outcome_drives_obligation_then_clawback_then_reversal_then_aggregates
          rationale: >-
            That §1.8 instance verifies a four-level chain end to end and pins each hop's observable
            effect, which is the full cascading_side_effects claim for this scaffold.

      - name: rate_threshold_layer_excluded
        claim_type: rate_threshold_triggers
        excluded_because:
          difficulty_instance: section_127_exclusion_limit_at_limit_versus_first_cent_beyond
          rationale: >-
            The cumulative §127 threshold is tested exactly at the limit and immediately beyond it
            there, which is the boundary claim this layer asks for.

      - name: dual_variant_layer_excluded
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: chronological_versus_annual_true_up_tax_exclusion_divergence
          rationale: >-
            Both tax variants are produced from identical disbursements and the compensating delta is
            asserted there, covering the layer's "both variants plus delta on switch" claim.

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: enrollment_create_response_already_reflects_the_cap_ledger
        claim_type: immediate
        grounds: >-
          §1.0 declares consistency_model immediate, so the derived cap ledger must be visible in
          the same request cycle that changes it - the POST /enrollments response itself carries the
          computed employer_reserved_cents, and an immediately following read of the Employee shows
          the matching aggregates with no lag.
        distinguishing_aspect: >-
          Asserts that no re-read or delay is needed for a denormalised aggregate that lives on a
          DIFFERENT entity (Employee) from the one being written (Enrollment).
        test_recipe:
          setup: "The base fixture, with the employee's ledger read immediately before the write."
          setup_api_calls:
            - *k_clock
            - *k_employer
            - *k_policy
            - *k_activate_policy
            - *k_employee
            - *k_school
            - *k_program
            - *k_agreement
            - *k_activate_agreement
            - *k_listing
            - *k_read_employee
          trigger: >-
            POST /enrollments for 4 credits of the listing in term 2026-FA with funding_model
            REIMBURSEMENT, followed immediately by GET /employees/${employee_id}
          assert: >-
            Before the write the employee reads cap_reserved_cents 0 and cap_available_cents
            1000000. The trigger's own 201 response already carries gross_tuition_cents 160000,
            employer_reserved_cents 80000, employee_share_cents 80000, plan_year 2026,
            drop_deadline_date 2026-09-15 and persistence_risk_score 30 - none of them null or
            pending. The immediately following employee read shows cap_reserved_cents 80000 and
            cap_available_cents 920000 on the first attempt, with no second read required, and
            version incremented from ${employee_version} to that value plus one.

      - name: agreement_termination_cascade_is_visible_immediately
        claim_type: immediate
        grounds: >-
          §1.2 PartnerAgreement ACTIVE -> TERMINATED cascades into suspending its CatalogListings,
          rejecting open ProgramApprovalRequests and withdrawing open Enrollments; under §1.0's
          immediate consistency model every one of those effects must be observable in reads issued
          straight after the terminate response returns.
        distinguishing_aspect: >-
          The only instance that checks immediacy across a multi-entity cascade (agreement ->
          listing -> enrollment -> employee ledger) rather than a single derived field.
        test_recipe:
          setup: >-
            The base fixture with one REGISTERED 4-credit enrollment reserving 80000 against the
            curated listing.
          setup_api_calls:
            - *k_clock
            - *k_employer
            - *k_policy
            - *k_activate_policy
            - *k_employee
            - *k_school
            - *k_program
            - *k_agreement
            - *k_activate_agreement
            - *k_listing
            - *k_read_employee
            - *k_enroll
          trigger: "POST /partner-agreements/${agreement_id}/terminate"
          assert: >-
            The terminate response itself shows status TERMINATED with terminated_on 2026-08-01.
