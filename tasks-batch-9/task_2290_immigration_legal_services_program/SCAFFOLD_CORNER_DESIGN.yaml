      - name: cascading_validation_assignment_activity_is_checked_before_segregation_of_duties
        claim_type: cascading_validation
        grounds:
          - validations[priority 17 ERR_ASSIGNMENT_NOT_ACTIVE]
          - validations[priority 28 ERR_SEGREGATION_OF_DUTIES]
