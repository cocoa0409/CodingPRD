scenario: |
  1861. Science Fair & STEM Competition (regional science fair affiliate): project
  registration & category assignment, research plan & safety/ethics committee approval
  (human/animal subjects), judge recruitment & rubric assignment, judging rounds & score
  normalization across judges, advancement to regional/state & slot allocation, display &
  safety inspection at venue, awards & scholarship distribution, mentor/teacher recognition

domain_name: science-fair
api_prefix: /science-fair

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: FairEdition
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Human-readable edition name, e.g. '2026 Regional Affiliate Fair'" }
      - { name: status, type: enum, source: system, description: "SETUP → REGISTRATION_OPEN → REGISTRATION_CLOSED → JUDGING → ADVANCEMENT_PUBLISHED → AWARDS_FINALIZED; terminal: ARCHIVED", constraints: "enum: SETUP, REGISTRATION_OPEN, REGISTRATION_CLOSED, JUDGING, ADVANCEMENT_PUBLISHED, AWARDS_FINALIZED, ARCHIVED" }
      - { name: normalization_algorithm, type: enum, source: input, description: "Which cross-judge normalization variant this edition uses", constraints: "enum: Z_SCORE, MIN_MAX" }
      - { name: max_judges_per_project, type: integer, source: input, description: "JudgingAssignment rows required per project before its aggregate is FINAL; must be >= 2" }
      - { name: min_quorum_ratio_pct, type: integer, source: input, description: "Percentage of max_judges_per_project that must be SUBMITTED for a provisional aggregate; integer 1..100" }
      - { name: advancement_freeze, type: boolean, source: system, default: false, description: "True once advancement publication is frozen; blocks score submission and quota edits" }

  - name: Category
    parent: null
    common_fields: true
    fields:
      - { name: fair_edition_id, type: string, source: system, description: "FK -> FairEdition.id; edition this category belongs to" }
      - { name: code, type: string, source: input, description: "Short code, e.g. PHYS, CHEM, BME" }
      - { name: name, type: string, source: input, description: "Display name, e.g. 'Physics & Astronomy'" }
      - { name: grade_band, type: enum, source: input, description: "Which grade band this category serves", constraints: "enum: JUNIOR, SENIOR" }
      - { name: advancement_slots, type: integer, source: input, description: "Number of advancement slots this category contributes to the regional/state pool; must be >= 0" }
      - { name: status, type: enum, source: system, description: "OPEN at creation; LOCKED by the close-registration sweep. New projects may only register into OPEN categories (ERR_INVALID_STATE otherwise). Quota PATCHes are gated by edition phase + advancement_freeze, not by this field.", constraints: "enum: OPEN, LOCKED" }

  - name: Mentor
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Teacher / mentor full name" }
      - { name: email, type: string, source: input, description: "Contact email; unique per fair edition is NOT enforced globally" }
      - { name: recognition_points, type: integer, source: computed, description: "STRICT variant: points from ADVANCED results and CONFERRED awards only; drives recognition_tier; starts at 0" }
      - { name: leaderboard_points, type: integer, source: computed, description: "INCLUSIVE variant: STRICT points plus WAITLISTED bonus at double weight (2 pts each); used for the public mentor leaderboard readout; starts at 0" }
      - { name: recognition_tier, type: enum, source: computed, description: "Derived from recognition_points (STRICT): NONE (<10) | BRONZE (>=10) | SILVER (>=25) | GOLD (>=50)", constraints: "enum: NONE, BRONZE, SILVER, GOLD" }

  - name: Project
    parent: null
    common_fields: true
    fields:
      - { name: fair_edition_id, type: string, source: system, description: "FK -> FairEdition.id" }
      - { name: category_id, type: string, source: system, description: "FK -> Category.id; assigned at registration, may be reassigned while registration open" }
      - { name: mentor_id, type: string, source: input, description: "FK -> Mentor.id; supervising teacher/mentor" }
      - { name: title, type: string, source: input, description: "Project title" }
      - { name: team_size, type: integer, source: input, description: "Number of student members; 1..3", constraints: "integer in [1,3]; outside range -> ERR_INVALID_REQUEST at priority 0" }
      - { name: involves_human_subjects, type: boolean, source: input, description: "True if research involves human participants" }
      - { name: involves_animal_subjects, type: boolean, source: input, description: "True if research involves vertebrate animals" }
      - { name: registration_status, type: enum, source: system, description: "DRAFT → SUBMITTED → CONFIRMED | WITHDRAWN", constraints: "enum: DRAFT, SUBMITTED, CONFIRMED, WITHDRAWN" }
      - { name: ethics_status, type: enum, source: system, description: "null while registration_status == DRAFT; set at submit time to PENDING (human/animal subjects) or NOT_REQUIRED (otherwise); APPROVED / REJECTED set by ethics decisions", constraints: "nullable enum: NOT_REQUIRED, PENDING, APPROVED, REJECTED" }
      - { name: inspection_status, type: enum, source: system, description: "NOT_SCHEDULED | SCHEDULED | PASSED | FAILED", constraints: "enum: NOT_SCHEDULED, SCHEDULED, PASSED, FAILED" }
      - { name: judging_status, type: enum, source: system, description: "UNASSIGNED | ASSIGNED | JUDGED", constraints: "enum: UNASSIGNED, ASSIGNED, JUDGED" }
      - { name: provisional_aggregate, type: number, source: computed, description: "Normalized aggregate over currently-submitted ScoreSheets when quorum met; null otherwise" }
      - { name: final_aggregate, type: number, source: computed, description: "Normalized aggregate once max_judges_per_project sheets are SUBMITTED; null until then" }
      - { name: advancement_result, type: enum, source: system, description: "PENDING | ADVANCED | WAITLISTED | NOT_ADVANCED", constraints: "enum: PENDING, ADVANCED, WAITLISTED, NOT_ADVANCED" }
      - { name: advancement_rank, type: integer, source: system, description: "1-based rank within its category after publication; null before" }

  - name: ResearchPlan
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; one active plan per project" }
      - { name: plan_text, type: string, source: input, description: "Research plan narrative" }
      - { name: risk_level, type: enum, source: input, description: "Declared risk level driving committee routing", constraints: "enum: LOW, MODERATE, HIGH" }
      - { name: status, type: enum, source: system, description: "DRAFT → SUBMITTED → UNDER_REVIEW → {APPROVED, REJECTED, REVISION_REQUIRED}; REVISION_REQUIRED loops back to DRAFT on resubmit-with-changes", constraints: "enum: DRAFT, SUBMITTED, UNDER_REVIEW, APPROVED, REJECTED, REVISION_REQUIRED" }
      - { name: review_cycle_count, type: integer, source: system, default: 0, description: "Number of times the plan has entered UNDER_REVIEW; increments on each SUBMITTED→UNDER_REVIEW transition" }
      - { name: approved_plan_version, type: integer, source: system, description: "The ResearchPlan.version value pinned at APPROVED time; stale if current version advances" }

  - name: EthicsReview
    parent: null
    common_fields: true
    fields:
      - { name: research_plan_id, type: string, source: system, description: "FK -> ResearchPlan.id" }
      - { name: reviewer_mentor_id, type: string, source: input, description: "FK -> Mentor.id; committee reviewer. MUST NOT equal the project's mentor_id (segregation of duties)" }
      - { name: decision, type: enum, source: input, description: "Committee decision recorded at submission", constraints: "enum: APPROVE, REJECT, REQUEST_REVISION" }
      - { name: rationale, type: string, source: input, description: "Free-text rationale; required when decision != APPROVE" }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock timestamp when the decision was recorded" }

  - name: Judge
    parent: null
    common_fields: true
    fields:
      - { name: fair_edition_id, type: string, source: system, description: "FK -> FairEdition.id" }
      - { name: full_name, type: string, source: input, description: "Judge full name" }
      - { name: expertise_category_ids, type: array, source: input, description: "Array of Category.id values the judge is expert in; may be empty (generalist)" }
      - { name: max_assignments, type: integer, source: input, description: "Cap on concurrent ACTIVE JudgingAssignments; must be >= 1" }
      - { name: active_assignment_count, type: integer, source: computed, description: "Count of JudgingAssignments for this judge in status ASSIGNED; maintained incrementally" }
      - { name: status, type: enum, source: system, description: "INVITED | ACTIVE | INACTIVE", constraints: "enum: INVITED, ACTIVE, INACTIVE" }

  - name: JudgeConflict
    parent: null
    common_fields: false
    fields:
      - { name: judge_id, type: string, source: system, description: "FK -> Judge.id" }
      - { name: project_id, type: string, source: system, description: "FK -> Project.id" }
      - { name: reason, type: string, source: input, description: "Free-text conflict reason (e.g., 'mentor at same school')" }

  - name: JudgingAssignment
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id" }
      - { name: judge_id, type: string, source: system, description: "FK -> Judge.id" }
      - { name: status, type: enum, source: system, description: "ASSIGNED | SUBMITTED | RECUSED | RELEASED", constraints: "enum: ASSIGNED, SUBMITTED, RECUSED, RELEASED" }
      - { name: assigned_at, type: datetime, source: system, description: "Logical-clock timestamp of assignment" }

  - name: ScoreSheet
    parent: null
    common_fields: false
    fields:
      - { name: judging_assignment_id, type: string, source: system, description: "FK -> JudgingAssignment.id" }
      - { name: project_id, type: string, source: system, description: "FK -> Project.id (denormalized for aggregation)" }
      - { name: judge_id, type: string, source: system, description: "FK -> Judge.id (denormalized for normalization pool)" }
      - { name: raw_score, type: integer, source: input, description: "Raw rubric total 0..100" }
      - { name: normalized_score, type: number, source: computed, description: "Per-edition normalization of raw_score within the judge's submitted pool; 3 decimal places" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of submission" }

  - name: BoothAssignment
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id" }
      - { name: hall, type: string, source: input, description: "Venue hall code, e.g. 'A', 'B'" }
      - { name: booth_number, type: integer, source: input, description: "Booth number within hall; (hall, booth_number) unique per fair edition" }
      - { name: inspection_window_start, type: datetime, source: input, description: "Start of the scheduled display-safety inspection window (logical time)" }
      - { name: inspection_window_end, type: datetime, source: input, description: "End of window; must be strictly greater than start" }

  - name: Award
    parent: null
    common_fields: true
    fields:
      - { name: fair_edition_id, type: string, source: system, description: "FK -> FairEdition.id" }
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; award recipient" }
      - { name: award_type, type: enum, source: input, description: "CATEGORY_FIRST | CATEGORY_SECOND | GRAND_PRIZE | SPECIAL_TOPIC", constraints: "enum: CATEGORY_FIRST, CATEGORY_SECOND, GRAND_PRIZE, SPECIAL_TOPIC" }
      - { name: scholarship_amount_cents, type: integer, source: computed, description: "Scholarship dollars (cents) distributed to this award from the edition pool by the waterfall" }
      - { name: status, type: enum, source: system, description: "PROPOSED | CONFERRED | REVOKED", constraints: "enum: PROPOSED, CONFERRED, REVOKED" }

  - name: ScholarshipPool
    parent: null
    common_fields: true
    fields:
      - { name: fair_edition_id, type: string, source: system, description: "FK -> FairEdition.id; exactly one pool per edition" }
      - { name: total_cents, type: integer, source: input, description: "Total scholarship dollars (cents) available; must be >= 0" }
      - { name: remaining_cents, type: integer, source: computed, description: "total_cents minus CONFERRED award allocations; maintained by the waterfall" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: FairEdition
    initial_state: SETUP
    terminal_states: [ARCHIVED]
    transitions:
      - from: SETUP
        to: REGISTRATION_OPEN
        trigger: "POST /science-fair/fair-editions/{id}/open-registration"
        actor: FairDirector
        preconditions:
          - "edition.status == SETUP"
          - "at least one Category with status OPEN exists for this edition (ERR_NO_OPEN_CATEGORY)"
        side_effects: []
      - from: REGISTRATION_OPEN
        to: REGISTRATION_CLOSED
        trigger: "POST /science-fair/fair-editions/{id}/close-registration"
        actor: FairDirector
        preconditions:
          - "edition.status == REGISTRATION_OPEN"
        side_effects:
          - "All Project rows still in registration_status DRAFT → WITHDRAWN"
          - "All Project rows in SUBMITTED whose ethics_status is APPROVED or NOT_REQUIRED → CONFIRMED"
          - "Project rows in SUBMITTED whose ethics_status is still PENDING at close remain SUBMITTED (neither confirmed nor withdrawn; they can still be approved later but miss this edition's judging unless a later edition phase admits them — for this scaffold they are simply not CONFIRMED and thus excluded from judging/advancement)"
          - "All Category rows in this edition: status OPEN → LOCKED"
      - from: REGISTRATION_CLOSED
        to: JUDGING
        trigger: "POST /science-fair/fair-editions/{id}/begin-judging"
        actor: FairDirector
        preconditions:
          - "edition.status == REGISTRATION_CLOSED"
          - "every Project with registration_status == CONFIRMED has inspection_status IN {SCHEDULED, PASSED} (ERR_PROJECTS_UNINSPECTED)"
        side_effects: []
      - from: JUDGING
        to: ADVANCEMENT_PUBLISHED
        trigger: "POST /science-fair/fair-editions/{id}/publish-advancement"
        actor: FairDirector
        preconditions:
          - "edition.status == JUDGING"
          - "every Project with registration_status == CONFIRMED has judging_status == JUDGED (ERR_UNJUDGED_PROJECTS)"
          - "request body expected_fair_edition_version matches current version (OCC, ERR_STALE_VERSION)"
        side_effects:
          - "runs calculation advancement_allocation (waterfall over categories)"
          - "sets each Project.advancement_result and advancement_rank"
          - "sets edition.advancement_freeze = true"
          - "increments FairEdition.version by 1"
      - from: ADVANCEMENT_PUBLISHED
        to: AWARDS_FINALIZED
        trigger: "POST /science-fair/fair-editions/{id}/finalize-awards"
        actor: FairDirector
        preconditions:
          - "edition.status == ADVANCEMENT_PUBLISHED"
          - "edition's ScholarshipPool exists (ERR_SCHOLARSHIP_POOL_MISSING)"
        side_effects:
          - "runs calculation scholarship_waterfall"
          - "all Award rows PROPOSED → CONFERRED"
          - "ScholarshipPool.remaining_cents reduced by conferred allocations"
          - "mentor recognition_points recomputed (calculation mentor_recognition)"
      - from: AWARDS_FINALIZED
        to: ARCHIVED
        trigger: "POST /science-fair/fair-editions/{id}/archive"
        actor: FairDirector
        preconditions:
          - "edition.status == AWARDS_FINALIZED"
        side_effects: []

  - entity: Project
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    note: "Any transition trigger aimed at a WITHDRAWN project is rejected with ERR_ALREADY_TERMINAL (409), which takes precedence over the generic ERR_INVALID_STATE for terminal sources."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /science-fair/projects/{id}/submit"
        actor: Mentor
        preconditions:
          - "project.registration_status == DRAFT"
          - "parent edition.status == REGISTRATION_OPEN"
          - "acting Mentor.id == project.mentor_id (ERR_FORBIDDEN)"
          - "project.team_size IN 1..3"
          - "if involves_human_subjects OR involves_animal_subjects: project has a ResearchPlan with status SUBMITTED / UNDER_REVIEW / APPROVED (ERR_RESEARCH_PLAN_REQUIRED)"
        side_effects:
          - "if project requires ethics review: project.ethics_status = PENDING"
          - "else: project.ethics_status = NOT_REQUIRED"
      - from: SUBMITTED
        to: CONFIRMED
        trigger: "system (only during edition close-registration sweep)"
        actor: system
        preconditions:
          - "project.registration_status == SUBMITTED"
          - "project.ethics_status IN {APPROVED, NOT_REQUIRED} at the moment close-registration runs"
          - "note: ethics APPROVE while registration is still OPEN does NOT auto-confirm; confirmation happens only in the close-registration sweep (an APPROVE that lands during the sweep window is handled inside the same transition)"
        side_effects: []
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /science-fair/projects/{id}/withdraw"
        actor: Mentor
        preconditions:
          - "project.registration_status == SUBMITTED"
          - "acting Mentor.id == project.mentor_id (ERR_FORBIDDEN)"
          - "project.judging_status == UNASSIGNED (ERR_ALREADY_ASSIGNED)"
        side_effects:
          - "any ResearchPlan for this project in SUBMITTED / UNDER_REVIEW / REVISION_REQUIRED → DRAFT (compensation)"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /science-fair/projects/{id}/withdraw"
        actor: Mentor
        preconditions:
          - "project.registration_status == DRAFT"
          - "acting Mentor.id == project.mentor_id"
        side_effects: []

  - entity: ResearchPlan
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /science-fair/research-plans/{id}/submit"
        actor: Mentor
        preconditions:
          - "plan.status == DRAFT"
          - "parent project.registration_status IN {DRAFT, SUBMITTED} (ERR_PROJECT_LOCKED)"
          - "acting Mentor.id == parent project.mentor_id (ERR_FORBIDDEN)"
        side_effects:
          - "increments ResearchPlan.version by 1"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /science-fair/research-plans/{id}/begin-review"
        actor: EthicsReviewer
        preconditions:
          - "plan.status == SUBMITTED"
        side_effects:
          - "plan.review_cycle_count += 1"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /science-fair/research-plans/{id}/decisions (decision=APPROVE)"
        actor: EthicsReviewer
        preconditions:
          - "plan.status == UNDER_REVIEW"
          - "reviewer_mentor_id != parent project.mentor_id (segregation of duties, ERR_SOD_VIOLATION)"
          - "EthicsReview.decision == APPROVE"
        side_effects:
          - "plan.approved_plan_version = plan.version (version-pinning)"
          - "creates EthicsReview row"
          - "parent Project.ethics_status = APPROVED (Project.version += 1); confirmation to CONFIRMED happens only in the close-registration sweep"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /science-fair/research-plans/{id}/decisions (decision=REJECT)"
        actor: EthicsReviewer
        preconditions:
          - "plan.status == UNDER_REVIEW"
          - "reviewer_mentor_id != parent project.mentor_id (ERR_SOD_VIOLATION)"
          - "EthicsReview.decision == REJECT and rationale non-empty (ERR_RATIONALE_REQUIRED)"
        side_effects:
          - "creates EthicsReview row"
          - "parent Project.ethics_status = REJECTED"
          - "parent Project.registration_status → WITHDRAWN (cascade)"
      - from: UNDER_REVIEW
        to: REVISION_REQUIRED
        trigger: "POST /science-fair/research-plans/{id}/decisions (decision=REQUEST_REVISION)"
        actor: EthicsReviewer
        preconditions:
          - "plan.status == UNDER_REVIEW"
          - "reviewer_mentor_id != parent project.mentor_id (ERR_SOD_VIOLATION)"
          - "rationale non-empty (ERR_RATIONALE_REQUIRED)"
        side_effects:
          - "creates EthicsReview row"
      - from: REVISION_REQUIRED
        to: DRAFT
        trigger: "PUT /science-fair/research-plans/{id} (plan_text change while REVISION_REQUIRED)"
        actor: Mentor
        preconditions:
          - "plan.status == REVISION_REQUIRED"
          - "acting Mentor.id == parent project.mentor_id"
        side_effects:
          - "increments ResearchPlan.version by 1"
          - "clears approved_plan_version to null"

  - entity: Judge
    initial_state: INVITED
    terminal_states: [INACTIVE]
    transitions:
      - from: INVITED
        to: ACTIVE
        trigger: "POST /science-fair/judges/{id}/activate"
        actor: FairDirector
        preconditions:
          - "judge.status == INVITED"
          - "parent edition.status IN {SETUP, REGISTRATION_OPEN, REGISTRATION_CLOSED}"
        side_effects: []
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /science-fair/judges/{id}/deactivate"
        actor: FairDirector
        preconditions:
          - "judge.status == ACTIVE"
          - "judge.active_assignment_count == 0 (ERR_JUDGE_HAS_ASSIGNMENTS)"
        side_effects: []

  - entity: JudgingAssignment
    initial_state: ASSIGNED
    terminal_states: [SUBMITTED, RECUSED, RELEASED]
    transitions:
      - from: ASSIGNED
        to: SUBMITTED
        trigger: "POST /science-fair/judging-assignments/{id}/score-sheets"
        actor: Judge
        preconditions:
          - "assignment.status == ASSIGNED"
          - "acting Judge.id == assignment.judge_id (ERR_FORBIDDEN)"
          - "parent edition.status == JUDGING (ERR_NOT_JUDGING_PHASE; note: publish-advancement requires every CONFIRMED project JUDGED, so a live ASSIGNED assignment on a CONFIRMED project can never outlive the JUDGING phase — the freeze guard lives on quota edits instead)"
        side_effects:
          - "creates ScoreSheet (raw_score) and computes normalized_score per edition.normalization_algorithm"
          - "recomputes parent Project.provisional_aggregate / final_aggregate (calculation project_aggregate)"
          - "judge.active_assignment_count -= 1"
          - "if project now has max_judges_per_project SUBMITTED assignments: project.judging_status = JUDGED"
      - from: ASSIGNED
        to: RECUSED
        trigger: "POST /science-fair/judging-assignments/{id}/recuse"
        actor: Judge
        preconditions:
          - "assignment.status == ASSIGNED"
          - "acting Judge.id == assignment.judge_id"
        side_effects:
          - "judge.active_assignment_count -= 1"
          - "creates JudgeConflict row (judge_id, project_id) if none exists"
          - "if project has zero remaining ASSIGNED assignments: project.judging_status = UNASSIGNED"
      - from: ASSIGNED
        to: RELEASED
        trigger: "POST /science-fair/judging-assignments/{id}/release"
        actor: FairDirector
        preconditions:
          - "assignment.status == ASSIGNED"
          - "parent edition.status == JUDGING (release is a judging-phase operation)"
        side_effects:
          - "judge.active_assignment_count -= 1"
          - "if project has zero remaining ASSIGNED assignments: project.judging_status = UNASSIGNED"

  - entity: Award
    initial_state: PROPOSED
    terminal_states: [CONFERRED, REVOKED]
    transitions:
      - from: PROPOSED
        to: CONFERRED
        trigger: "system (on edition finalize-awards)"
        actor: system
        preconditions:
          - "edition.status == ADVANCEMENT_PUBLISHED"
        side_effects:
          - "scholarship_amount_cents set by scholarship_waterfall"
          - "ScholarshipPool.remaining_cents debited"
      - from: PROPOSED
        to: REVOKED
        trigger: "POST /science-fair/awards/{id}/revoke"
        actor: FairDirector
        preconditions:
          - "award.status == PROPOSED"
          - "edition.status IN {JUDGING, ADVANCEMENT_PUBLISHED}"
        side_effects: []

  - entity: Project
    initial_state: NOT_SCHEDULED
    terminal_states: [PASSED, FAILED]
    note: "Parallel dimension: this machine drives Project.inspection_status, independent of the registration_status machine above (parallel state dimensions on one entity)."
    transitions:
      - from: NOT_SCHEDULED
        to: SCHEDULED
        trigger: "POST /science-fair/projects/{id}/booth-assignments"
        actor: OperationsLead
        preconditions:
          - "project.registration_status == CONFIRMED"
          - "project.inspection_status == NOT_SCHEDULED"
          - "(hall, booth_number) not already taken within this edition (ERR_BOOTH_TAKEN)"
          - "inspection_window_start < inspection_window_end (ERR_INVALID_WINDOW)"
        side_effects:
          - "project.inspection_status = SCHEDULED"
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /science-fair/projects/{id}/inspection-result (result=PASS)"
        actor: SafetyInspector
        preconditions:
          - "project.inspection_status == SCHEDULED"
          - "current logical clock within [inspection_window_start, inspection_window_end] inclusive (ERR_OUTSIDE_WINDOW)"
        side_effects:
          - "project.inspection_status = PASSED"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /science-fair/projects/{id}/inspection-result (result=FAIL)"
        actor: SafetyInspector
        preconditions:
          - "project.inspection_status == SCHEDULED"
          - "current logical clock within [inspection_window_start, inspection_window_end] inclusive (ERR_OUTSIDE_WINDOW)"
        side_effects:
          - "project.inspection_status = FAILED"
          - "project.registration_status → WITHDRAWN (cascade)"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: publish-advancement-stale-edition
    parent_entity: FairEdition
    write_endpoint: "POST /science-fair/fair-editions/{id}/publish-advancement"
    occ_field: "expected_fair_edition_version"
    description: |
      Publishing advancement against a FairEdition whose version has advanced since
      the client last observed it is rejected. Captures the case where another writer
      has legitimately mutated edition-scoped state (e.g., a quota edit that bumps
      the edition version) and the current publish request's view of the edition is
      therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: quota-adjust-stale-edition
    parent_entity: FairEdition
    write_endpoint: "PATCH /science-fair/categories/{id}"
    occ_field: "expected_fair_edition_version"
    description: |
      Adjusting Category.advancement_slots requires the caller's observed edition
      version; if any other mutation has advanced the edition's version in between,
      the PATCH is rejected as stale so slot totals are never silently recomputed
      on a stale base.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: category-reassign-stale-project
    parent_entity: Project
    write_endpoint: "PATCH /science-fair/projects/{id}"
    occ_field: "expected_project_version"
    description: |
      Reassigning a Project's category while its version has advanced (e.g., an
      ethics decision cascaded a mutation onto the project) is rejected so the
      reassignment is never applied against a stale project snapshot.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: normalized_score_per_sheet
    trigger: "when a ScoreSheet is created (JudgingAssignment → SUBMITTED)"
    algorithm: weighted_scoring
    formula: |
      # Variant Z_SCORE (per-judge z-normalization):
      #   pool = all ScoreSheet rows by this judge in this edition with status of parent assignment SUBMITTED
      #   mean = sum(raw_score) / count(pool)
      #   sd   = sqrt( sum((raw - mean)^2) / count(pool) )          # population SD
      #   if sd == 0: normalized = 0.000
      #   else: normalized = round_half_up((raw_score - mean) / sd, 3)
      #
      # Variant MIN_MAX (per-judge min-max rescale):
      #   pool as above
      #   lo = min(raw_score), hi = max(raw_score)
      #   if hi == lo: normalized = 0.500
      #   else: normalized = round_half_up((raw_score - lo) / (hi - lo), 3)
      #
      # IMPORTANT: every previously-computed normalized_score for this judge's pool is
      # RE-DERIVED on each new submission (the pool changed). Normalization is always
      # computed over the judge's full current SUBMITTED pool, not incrementally.
    input_set: "ScoreSheet rows for the acting judge in this edition whose parent JudgingAssignment.status == SUBMITTED"
    constants:
      NORMALIZED_DECIMALS: 3
      MIN_MAX_TIE_VALUE: "0.500"
      Z_SD_ZERO_VALUE: "0.000"
    precision: "3 decimal places, round_half_up"
    variants:
      - name: z_score
        when: "edition.normalization_algorithm == Z_SCORE"
        difference: "Per-judge population z-score; identical (judge pools, raw scores) produce different normalized values than min_max"
      - name: min_max
        when: "edition.normalization_algorithm == MIN_MAX"
        difference: "Per-judge min-max rescale into [0,1]; single-score pools map to 0.500 instead of 0.000"

  - name: project_aggregate
    trigger: "after each ScoreSheet insertion and its pool re-normalization"
    algorithm: aggregation
    formula: |
      # Pinned rounding order: per-sheet normalized_score is already at 3dp.
      # Step 1: collect normalized_score across the project's SUBMITTED sheets.
      # Step 2: provisional_aggregate = round_half_up(mean(step1), 2) if
      #         count(step1) >= ceil(max_judges_per_project * min_quorum_ratio_pct / 100),
      #         else null.
      # Step 3: when count(step1) == max_judges_per_project:
      #         final_aggregate = round_half_up(mean(step1), 2) and provisional_aggregate
      #         is left unchanged (it is the historical provisional snapshot).
      # Rounding order is pinned: normalize-per-sheet FIRST (3dp), then mean, then 2dp.
      # Do NOT average raw scores then normalize.
    input_set: "ScoreSheet rows for this project whose parent JudgingAssignment.status == SUBMITTED"
    constants:
      AGGREGATE_DECIMALS: 2
    precision: "2 decimal places, round_half_up"

  - name: advancement_allocation
    trigger: "POST /science-fair/fair-editions/{id}/publish-advancement"
    algorithm: waterfall_allocation
    formula: |
      # Input set: Projects with registration_status CONFIRMED, judging_status JUDGED,
      # inspection_status PASSED, grouped by category.
      # Per category, rank by:
      #   (1) final_aggregate DESC
      #   (2) tie: higher median of raw_score across SUBMITTED sheets DESC
      #        (even-count median = mean of the two middle values, e.g. [80,82] -> 81)
      #   (3) tie: greater count of SUBMITTED sheets DESC
      #   (4) tie: Project.created_at ASC  (never id)
      # Assign rank 1..N per category.
      # The first Category.advancement_slots projects in each category → ADVANCED.
      # The next waitlist_depth = max(1, floor(advancement_slots / 2)) projects per
      # category → WAITLISTED. All remaining → NOT_ADVANCED.
      # Cross-category fallback: unused slots from a category whose eligible pool is
      # smaller than its slot count flow into a shared at-large pool, allocated to the
      # highest-final_aggregate WAITLISTED projects across all categories (same tie-break),
      # one extra slot each, until the at-large pool is exhausted.
      # advancement_freeze is set true inside the same transaction.
    input_set: "Projects in this edition with registration_status == CONFIRMED AND judging_status == JUDGED AND inspection_status == PASSED"
    constants:
      WAITLIST_DEPTH_DIVISOR: 2
    precision: "integer ranks; no decimals"

  - name: scholarship_waterfall
    trigger: "POST /science-fair/fair-editions/{id}/finalize-awards"
    algorithm: waterfall_allocation
    formula: |
      # Pool = ScholarshipPool.remaining_cents at finalize time.
      # Awards are processed in fixed award_type precedence order:
      #   1. GRAND_PRIZE:      allocation = min(GRAND_PRIZE_CAP_CENTS, remaining)
      #   2. CATEGORY_FIRST:   allocation = min(CATEGORY_FIRST_CAP_CENTS, remaining)
      #   3. CATEGORY_SECOND:  allocation = min(CATEGORY_SECOND_CAP_CENTS, remaining)
      #   4. SPECIAL_TOPIC:    allocation = min(SPECIAL_TOPIC_CAP_CENTS, remaining)
      # Within each award_type tier, multiple awards are processed in
      # Project.final_aggregate DESC order, tie-break Project.created_at ASC
      # (never id).
      # All amounts are integer cents; when remaining < cap the award receives the
      # remaining amount and the pool goes to zero (no fractional cents).
      # Every Award row processed transitions PROPOSED → CONFERRED with its
      # scholarship_amount_cents set; rows that would receive 0 are still CONFERRED
      # with amount 0.
    input_set: "Award rows in this edition with status == PROPOSED"
    constants:
      GRAND_PRIZE_CAP_CENTS: 400000
      CATEGORY_FIRST_CAP_CENTS: 300000
      CATEGORY_SECOND_CAP_CENTS: 150000
      SPECIAL_TOPIC_CAP_CENTS: 100000
    precision: "integer cents, no rounding"

  - name: mentor_recognition
    trigger: "after finalize-awards confers awards (and on any later Award revoke)"
    algorithm: aggregation
    formula: |
      # STRICT variant (recognition_points; drives recognition_tier):
      #   +5  if project.advancement_result == ADVANCED
      #   +0  if WAITLISTED (excluded from STRICT)
      #   +8  if project has a CONFERRED Award with award_type == GRAND_PRIZE
      #   +4  CATEGORY_FIRST;  +2 CATEGORY_SECOND;  +1 SPECIAL_TOPIC
      # INCLUSIVE variant (leaderboard_points; public leaderboard readout):
      #   everything in STRICT, plus +2 per WAITLISTED project at DOUBLE weight
      #   (i.e. +4 per waitlisted project).
      # Both variants are computed from the same input set at the same trigger;
      # they diverge whenever a mentor has >=1 WAITLISTED project.
      # recognition_tier derived from recognition_points (STRICT only):
      #   <10 NONE, >=10 BRONZE, >=25 SILVER, >=50 GOLD.
    input_set: "Projects in this edition grouped by mentor_id, over advancement_result and CONFERRED awards"
    constants:
      POINTS_ADVANCED: 5
      POINTS_WAITLISTED_INCLUSIVE: 4
      POINTS_GRAND_PRIZE: 8
      POINTS_CATEGORY_FIRST: 4
      POINTS_CATEGORY_SECOND: 2
      POINTS_SPECIAL_TOPIC: 1
      TIER_BRONZE_MIN: 10
      TIER_SILVER_MIN: 25
      TIER_GOLD_MIN: 50
    precision: "integer points"
    variants:
      - name: strict
        when: "recognition_points / recognition_tier (official tier decisions)"
        difference: "WAITLISTED projects contribute 0 points"
      - name: inclusive
        when: "leaderboard_points (public leaderboard readout)"
        difference: "WAITLISTED projects contribute +4 each (double-weighted), so identical outcomes yield leaderboard_points > recognition_points whenever any WAITLISTED project exists"

  - name: judge_selector
    trigger: "POST /science-fair/projects/{id}/judging-assignments (auto-assign mode)"
    algorithm: topological
    formula: |
      # Eligibility filter (all must hold):
      #   judge.status == ACTIVE
      #   judge.fair_edition_id == project.fair_edition_id
      #   judge.active_assignment_count < judge.max_assignments
      #   no JudgeConflict row with (judge_id, project_id)
      #   no existing JudgingAssignment with (judge_id, project_id) in non-terminal state
      #   judge.id != project.mentor_id is NOT required (different entity spaces) BUT
      #     a JudgeConflict row auto-created on any prior recusal excludes them.
      # Ranking expression:
      #   (1) expertise match: judge whose expertise_category_ids contains
      #       project.category_id ranks above one without
      #   (2) lower active_assignment_count ASC
      #   (3) tie: judge.created_at ASC
      # Fallback: if the eligible set is empty → ERR_NO_ELIGIBLE_JUDGE (409).
      # The selector assigns exactly one judge per call; repeat the call to add more.
    input_set: "Judge rows in this edition"
    constants: {}
    precision: "n/a (selection, not numeric)"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 0
    category: existence
    check: "request body shape: required fields present, types correct, enum values within declared sets (ERR_INVALID_REQUEST) — evaluated before auth so malformed payloads fail fast"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "acting role is permitted to invoke this endpoint per RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "path-template resources exist (fair edition, category, project, plan, judge, assignment, award), validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: state
    check: "target resource is in a state from which the requested transition is allowed (per state machine tables)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 5
    category: business_safety
    check: "segregation of duties: EthicsReview.reviewer_mentor_id != parent Project.mentor_id; a judge may not score a project for which a JudgeConflict row exists"
    error_id: ERR_SOD_VIOLATION
    http_status: 422
    applies_to: ["POST /science-fair/research-plans/{id}/decisions", "POST /science-fair/judging-assignments/{id}/score-sheets", "POST /science-fair/projects/{id}/judging-assignments"]
  - priority: 6
    category: business_temporal
    check: "temporal validity: inspection result within booth window (ERR_OUTSIDE_WINDOW); booth window inversion start >= end (ERR_INVALID_WINDOW); score submission only while edition in JUDGING"
    error_id: ERR_OUTSIDE_WINDOW
    http_status: 422
    applies_to: ["POST /science-fair/projects/{id}/inspection-result", "POST /science-fair/judging-assignments/{id}/score-sheets", "POST /science-fair/projects/{id}/booth-assignments"]
    note: "On booth-assignments this priority reports ERR_INVALID_WINDOW for inverted windows; both temporal errors sit at priority 6, ahead of the priority-7 (hall, booth_number) uniqueness constraint."
  - priority: 7
    category: business_constraint
    check: "uniqueness and capacity: (hall, booth_number) unique per edition; judge.active_assignment_count < judge.max_assignments; project team_size 1..3; no duplicate non-terminal assignment for (judge, project)"
    error_id: ERR_CONSTRAINT_VIOLATION
    http_status: 422
    applies_to: ["POST /science-fair/projects/{id}/booth-assignments", "POST /science-fair/projects/{id}/judging-assignments", "POST /science-fair/projects"]
  - priority: 8
    category: business_referential
    check: "referential integrity: category_id / mentor_id / judge_id / project_id referenced in payloads must exist and belong to the same fair edition"
    error_id: ERR_REFERENTIAL_INTEGRITY
    http_status: 422
    applies_to: ["POST /science-fair/projects", "PATCH /science-fair/projects/{id}", "POST /science-fair/judges", "POST /science-fair/projects/{id}/judging-assignments", "POST /science-fair/judges/{id}/conflicts"]
  - priority: 9
    category: business_fiscal
    check: "scholarship pool sufficiency: finalize-awards requires an existing ScholarshipPool; slot and quota edits must keep advancement_slots >= 0"
    error_id: ERR_SCHOLARSHIP_POOL_MISSING
    http_status: 422
    applies_to: ["POST /science-fair/fair-editions/{id}/finalize-awards"]

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # ---- logical clock (test-driving) ----
  - method: POST
    path: "/science-fair/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default is 2026-08-01T00:00:00Z; before any set call the clock reads exactly that value and MUST NOT fall back to real wall-clock time."
    roles: [FairDirector]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: []

  # ---- FairEdition ----
  - method: POST
    path: "/science-fair/fair-editions"
    description: "Create a fair edition"
    roles: [FairDirector]
    code: 201
    input: [name, normalization_algorithm, max_judges_per_project, min_quorum_ratio_pct]
    output: FairEdition
    side_effects: []
  - method: GET
    path: "/science-fair/fair-editions"
    description: "List fair editions"
    roles: [FairDirector, EthicsReviewer, Judge, Mentor, OperationsLead, SafetyInspector]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: FairEdition[]
    side_effects: []
  - method: GET
    path: "/science-fair/fair-editions/{id}"
    description: "Get one fair edition"
    roles: [FairDirector, EthicsReviewer, Judge, Mentor, OperationsLead, SafetyInspector]
    code: 200
    input: []
    output: FairEdition
    side_effects: []
  - method: POST
    path: "/science-fair/fair-editions/{id}/open-registration"
    description: "SETUP → REGISTRATION_OPEN"
    roles: [FairDirector]
    code: 200
    input: []
    output: FairEdition
    side_effects: ["edition.status = REGISTRATION_OPEN", "increments FairEdition.version by 1"]
  - method: POST
    path: "/science-fair/fair-editions/{id}/close-registration"
    description: "REGISTRATION_OPEN → REGISTRATION_CLOSED; withdraws DRAFT projects; confirms eligible SUBMITTED projects"
    roles: [FairDirector]
    code: 200
    input: []
    output: FairEdition
    side_effects: ["Project DRAFT → WITHDRAWN", "eligible Project SUBMITTED → CONFIRMED", "increments FairEdition.version by 1"]
  - method: POST
    path: "/science-fair/fair-editions/{id}/begin-judging"
    description: "REGISTRATION_CLOSED → JUDGING"
    roles: [FairDirector]
    code: 200
    input: []
    output: FairEdition
    side_effects: ["increments FairEdition.version by 1"]
  - method: POST
    path: "/science-fair/fair-editions/{id}/publish-advancement"
    description: "JUDGING → ADVANCEMENT_PUBLISHED; runs advancement_allocation waterfall; OCC on edition version"
    roles: [FairDirector]
    code: 200
    input: [expected_fair_edition_version]
    output: FairEdition
    side_effects: ["runs advancement_allocation", "sets Project.advancement_result/rank", "sets advancement_freeze=true", "increments FairEdition.version by 1"]
  - method: POST
    path: "/science-fair/fair-editions/{id}/finalize-awards"
    description: "ADVANCEMENT_PUBLISHED → AWARDS_FINALIZED; runs scholarship_waterfall and mentor_recognition"
    roles: [FairDirector]
    code: 200
    input: []
    output: FairEdition
    side_effects: ["runs scholarship_waterfall", "Award PROPOSED → CONFERRED", "ScholarshipPool.remaining_cents debited", "mentor recognition_points recomputed", "increments FairEdition.version by 1"]
  - method: POST
    path: "/science-fair/fair-editions/{id}/archive"
    description: "AWARDS_FINALIZED → ARCHIVED"
    roles: [FairDirector]
    code: 200
    input: []
    output: FairEdition
    side_effects: ["increments FairEdition.version by 1"]

  # ---- Category ----
  - method: POST
    path: "/science-fair/categories"
    description: "Create a category in an edition"
    roles: [FairDirector]
    code: 201
    input: [fair_edition_id, code, name, grade_band, advancement_slots]
    output: Category
    side_effects: []
  - method: GET
    path: "/science-fair/categories"
    description: "List categories (optionally filter by edition)"
    roles: [FairDirector, EthicsReviewer, Judge, Mentor, OperationsLead, SafetyInspector]
    code: 200
    input: ["limit?", "offset?", "fair_edition_id?"]
    output: Category[]
    side_effects: []
  - method: GET
    path: "/science-fair/categories/{id}"
    description: "Get one category"
    roles: [FairDirector, EthicsReviewer, Judge, Mentor, OperationsLead, SafetyInspector]
    code: 200
    input: []
    output: Category
    side_effects: []
  - method: PATCH
    path: "/science-fair/categories/{id}"
    description: "Update category fields (e.g. advancement_slots). Requires expected_fair_edition_version (OCC against the parent edition). Phase gate: allowed while edition.status IN {SETUP, REGISTRATION_OPEN, REGISTRATION_CLOSED, JUDGING}; when edition.advancement_freeze == true (status ADVANCEMENT_PUBLISHED or later) the phase gate reports the domain-specific ERR_ADVANCEMENT_FROZEN (409) rather than generic ERR_INVALID_STATE; ARCHIVED with freeze false is impossible, so ERR_INVALID_STATE covers no live case here."
    roles: [FairDirector]
    code: 200
    input: ["name?", "advancement_slots?", expected_fair_edition_version]
    output: Category
    side_effects: ["increments Category.version by 1", "increments FairEdition.version by 1"]

  # ---- Mentor ----
  - method: POST
    path: "/science-fair/mentors"
    description: "Register a mentor/teacher"
    roles: [FairDirector]
    code: 201
    input: [full_name, email]
    output: Mentor
    side_effects: []
  - method: GET
    path: "/science-fair/mentors"
    description: "List mentors"
    roles: [FairDirector, EthicsReviewer, Judge, Mentor, OperationsLead, SafetyInspector]
    code: 200
    input: ["limit?", "offset?"]
    output: Mentor[]
    side_effects: []
  - method: GET
    path: "/science-fair/mentors/{id}"
    description: "Get one mentor (includes recognition_points / recognition_tier)"
    roles: [FairDirector, EthicsReviewer, Judge, Mentor, OperationsLead, SafetyInspector]
    code: 200
    input: []
    output: Mentor
    side_effects: []

  # ---- Project ----
  - method: POST
    path: "/science-fair/projects"
    description: "Register a project (registration_status=DRAFT). The target category must exist in the same edition and still be status=OPEN (ERR_INVALID_STATE once the close-registration sweep has LOCKED it); the edition must be REGISTRATION_OPEN."
    roles: [Mentor]
    code: 201
    input: [fair_edition_id, category_id, title, team_size, involves_human_subjects, involves_animal_subjects]
    output: Project
    side_effects: []
  - method: GET
    path: "/science-fair/projects"
    description: "List projects with filters"
    roles: [FairDirector, EthicsReviewer, Judge, Mentor, OperationsLead, SafetyInspector]
    code: 200
    input: ["limit?", "offset?", "fair_edition_id?", "category_id?", "mentor_id?", "registration_status?", "judging_status?", "advancement_result?"]
    output: Project[]
    side_effects: []
  - method: GET
    path: "/science-fair/projects/{id}"
    description: "Get one project"
    roles: [FairDirector, EthicsReviewer, Judge, Mentor, OperationsLead, SafetyInspector]
    code: 200
    input: []
    output: Project
    side_effects: []
  - method: PATCH
    path: "/science-fair/projects/{id}"
    description: "Update project mutable fields (title, team_size, category_id). Category reassignment allowed only while registration_status IN {DRAFT, SUBMITTED} and edition registration open; OCC via expected_project_version."
    roles: [Mentor, FairDirector]
    code: 200
    input: ["title?", "team_size?", "category_id?", expected_project_version]
    output: Project
    side_effects: ["increments Project.version by 1"]
  - method: POST
    path: "/science-fair/projects/{id}/submit"
    description: "Project DRAFT → SUBMITTED"
    roles: [Mentor]
    code: 200
    input: []
    output: Project
    side_effects: ["sets ethics_status PENDING or NOT_REQUIRED", "increments Project.version by 1"]
  - method: POST
    path: "/science-fair/projects/{id}/withdraw"
    description: "Project DRAFT/SUBMITTED → WITHDRAWN; compensates in-flight ResearchPlans"
    roles: [Mentor]
    code: 200
    input: []
    output: Project
    side_effects: ["in-flight ResearchPlan → DRAFT", "increments Project.version by 1"]

  # ---- ResearchPlan ----
  - method: POST
    path: "/science-fair/research-plans"
    description: "Create a research plan for a project (status=DRAFT)"
    roles: [Mentor]
    code: 201
    input: [project_id, plan_text, risk_level]
    output: ResearchPlan
    side_effects: []
  - method: GET
    path: "/science-fair/research-plans"
    description: "List research plans"
    roles: [FairDirector, EthicsReviewer, Mentor]
    code: 200
    input: ["limit?", "offset?", "project_id?", "status?"]
    output: ResearchPlan[]
    side_effects: []
  - method: GET
    path: "/science-fair/research-plans/{id}"
    description: "Get one research plan"
    roles: [FairDirector, EthicsReviewer, Mentor]
    code: 200
    input: []
    output: ResearchPlan
    side_effects: []
  - method: PUT
    path: "/science-fair/research-plans/{id}"
    description: "Update plan_text / risk_level. While status == REVISION_REQUIRED, any plan_text change transitions the plan back to DRAFT (revision loop) and clears approved_plan_version."
    roles: [Mentor]
    code: 200
    input: ["plan_text?", "risk_level?"]
    output: ResearchPlan
    side_effects: ["on REVISION_REQUIRED + plan_text change: status → DRAFT, approved_plan_version = null, version += 1"]
  - method: POST
    path: "/science-fair/research-plans/{id}/submit"
    description: "ResearchPlan DRAFT → SUBMITTED"
    roles: [Mentor]
    code: 200
    input: []
    output: ResearchPlan
    side_effects: ["increments ResearchPlan.version by 1"]
  - method: POST
    path: "/science-fair/research-plans/{id}/begin-review"
    description: "ResearchPlan SUBMITTED → UNDER_REVIEW"
    roles: [EthicsReviewer]
    code: 200
    input: []
    output: ResearchPlan
    side_effects: ["review_cycle_count += 1"]
  - method: POST
    path: "/science-fair/research-plans/{id}/decisions"
    description: "Record an ethics decision (APPROVE / REJECT / REQUEST_REVISION); drives plan and parent project state"
    roles: [EthicsReviewer]
    code: 201
    input: [reviewer_mentor_id, decision, "rationale?"]
    output: EthicsReview
    side_effects: ["plan transition per decision", "parent Project.ethics_status updated", "on APPROVE: approved_plan_version pinned", "on REJECT: project cascades to WITHDRAWN"]

  # ---- EthicsReview readback ----
  - method: GET
    path: "/science-fair/ethics-reviews"
    description: "List ethics reviews (filtered)"
    roles: [FairDirector, EthicsReviewer]
    code: 200
    input: ["limit?", "offset?", "research_plan_id?", "reviewer_mentor_id?"]
    output: EthicsReview[]
    side_effects: []
  - method: GET
    path: "/science-fair/ethics-reviews/{id}"
    description: "Get one ethics review"
    roles: [FairDirector, EthicsReviewer]
    code: 200
    input: []
    output: EthicsReview
    side_effects: []

  # ---- Judge ----
  - method: POST
    path: "/science-fair/judges"
    description: "Recruit a judge into an edition (status=INVITED)"
    roles: [FairDirector]
    code: 201
    input: [fair_edition_id, full_name, "expertise_category_ids?", max_assignments]
    output: Judge
    side_effects: []
  - method: GET
    path: "/science-fair/judges"
    description: "List judges"
    roles: [FairDirector, EthicsReviewer, Judge, Mentor, OperationsLead, SafetyInspector]
    code: 200
    input: ["limit?", "offset?", "fair_edition_id?", "status?"]
    output: Judge[]
    side_effects: []
  - method: GET
    path: "/science-fair/judges/{id}"
    description: "Get one judge"
    roles: [FairDirector, EthicsReviewer, Judge, Mentor, OperationsLead, SafetyInspector]
    code: 200
    input: []
    output: Judge
    side_effects: []
  - method: POST
    path: "/science-fair/judges/{id}/activate"
    description: "Judge INVITED → ACTIVE"
    roles: [FairDirector]
    code: 200
    input: []
    output: Judge
    side_effects: []
  - method: POST
    path: "/science-fair/judges/{id}/deactivate"
    description: "Judge ACTIVE → INACTIVE (requires zero active assignments)"
    roles: [FairDirector]
    code: 200
    input: []
    output: Judge
    side_effects: []

  # ---- JudgeConflict ----
  - method: POST
    path: "/science-fair/judges/{id}/conflicts"
    description: "Declare a judge↔project conflict"
    roles: [FairDirector, Judge]
    code: 201
    input: [project_id, reason]
    output: JudgeConflict
    side_effects: []
  - method: GET
    path: "/science-fair/judges/{id}/conflicts"
    description: "List conflicts for a judge"
    roles: [FairDirector, Judge]
    code: 200
    input: ["limit?", "offset?"]
    output: JudgeConflict[]
    side_effects: []
  - method: GET
    path: "/science-fair/judge-conflicts"
    description: "List judge conflicts across the edition (filtered by judge or project)"
    roles: [FairDirector, Judge]
    code: 200
    input: ["limit?", "offset?", "judge_id?", "project_id?"]
    output: JudgeConflict[]
    side_effects: []
  - method: GET
    path: "/science-fair/judge-conflicts/{id}"
    description: "Get one judge conflict"
    roles: [FairDirector, Judge]
    code: 200
    input: []
    output: JudgeConflict
    side_effects: []

  # ---- JudgingAssignment ----
  - method: POST
    path: "/science-fair/projects/{id}/judging-assignments"
    description: "Assign a judge to a project. Two modes: explicit (judge_id provided) or auto (judge_id omitted → judge_selector runs). Allowed while the parent edition is in REGISTRATION_CLOSED or JUDGING (pre-assignment before the phase opens is legitimate); the project must be CONFIRMED. On success sets project.judging_status=ASSIGNED."
    roles: [FairDirector]
    code: 201
    input: ["judge_id?"]
    output: JudgingAssignment
    side_effects: ["judge.active_assignment_count += 1", "project.judging_status = ASSIGNED"]
  - method: GET
    path: "/science-fair/judging-assignments"
    description: "List judging assignments"
    roles: [FairDirector, Judge]
    code: 200
    input: ["limit?", "offset?", "project_id?", "judge_id?", "status?"]
    output: JudgingAssignment[]
    side_effects: []
  - method: GET
    path: "/science-fair/judging-assignments/{id}"
    description: "Get one judging assignment"
    roles: [FairDirector, Judge]
    code: 200
    input: []
    output: JudgingAssignment
    side_effects: []
  - method: POST
    path: "/science-fair/judging-assignments/{id}/score-sheets"
    description: "Submit a score sheet; assignment ASSIGNED → SUBMITTED; triggers normalization + project aggregate recompute"
    roles: [Judge]
    code: 201
    input: [raw_score]
    output: ScoreSheet
    side_effects: ["creates ScoreSheet", "recomputes judge-pool normalization", "recomputes project provisional/final aggregate", "judge.active_assignment_count -= 1", "maybe project.judging_status = JUDGED"]
  - method: POST
    path: "/science-fair/judging-assignments/{id}/recuse"
    description: "Judge recuses from an assignment; auto-creates JudgeConflict"
    roles: [Judge]
    code: 200
    input: []
    output: JudgingAssignment
    side_effects: ["judge.active_assignment_count -= 1", "JudgeConflict row created if absent", "maybe project.judging_status = UNASSIGNED"]
  - method: POST
    path: "/science-fair/judging-assignments/{id}/release"
    description: "FairDirector releases an assignment (e.g. judge no-show)"
    roles: [FairDirector]
    code: 200
    input: []
    output: JudgingAssignment
    side_effects: ["judge.active_assignment_count -= 1", "maybe project.judging_status = UNASSIGNED"]

  # ---- ScoreSheet readback ----
  - method: GET
    path: "/science-fair/score-sheets"
    description: "List score sheets (filtered by project / judge / assignment)"
    roles: [FairDirector, Judge]
    code: 200
    input: ["limit?", "offset?", "project_id?", "judge_id?", "judging_assignment_id?"]
    output: ScoreSheet[]
    side_effects: []
  - method: GET
    path: "/science-fair/score-sheets/{id}"
    description: "Get one score sheet"
    roles: [FairDirector, Judge]
    code: 200
    input: []
    output: ScoreSheet
    side_effects: []

  # ---- BoothAssignment / inspection ----
  - method: POST
    path: "/science-fair/projects/{id}/booth-assignments"
    description: "Assign a booth; schedules the display-safety inspection window; project.inspection_status → SCHEDULED"
    roles: [OperationsLead]
    code: 201
    input: [hall, booth_number, inspection_window_start, inspection_window_end]
    output: BoothAssignment
    side_effects: ["project.inspection_status = SCHEDULED"]
  - method: GET
    path: "/science-fair/booth-assignments"
    description: "List booth assignments"
    roles: [FairDirector, OperationsLead, SafetyInspector, Mentor]
    code: 200
    input: ["limit?", "offset?", "project_id?", "hall?"]
    output: BoothAssignment[]
    side_effects: []
  - method: GET
    path: "/science-fair/booth-assignments/{id}"
    description: "Get one booth assignment"
    roles: [FairDirector, OperationsLead, SafetyInspector, Mentor]
    code: 200
    input: []
    output: BoothAssignment
    side_effects: []
  - method: POST
    path: "/science-fair/projects/{id}/inspection-result"
    description: "Record display-safety inspection result; PASS → PASSED, FAIL → FAILED and project withdrawn"
    roles: [SafetyInspector]
    code: 200
    input: [result]
    output: Project
    side_effects: ["project.inspection_status updated", "on FAIL: project.registration_status → WITHDRAWN"]

  # ---- Award / ScholarshipPool ----
  - method: POST
    path: "/science-fair/awards"
    description: "Propose an award for a project (status=PROPOSED)"
    roles: [FairDirector]
    code: 201
    input: [fair_edition_id, project_id, award_type]
    output: Award
    side_effects: []
  - method: GET
    path: "/science-fair/awards"
    description: "List awards"
    roles: [FairDirector, Mentor, Judge]
    code: 200
    input: ["limit?", "offset?", "fair_edition_id?", "project_id?", "status?"]
    output: Award[]
    side_effects: []
  - method: GET
    path: "/science-fair/awards/{id}"
    description: "Get one award"
    roles: [FairDirector, Mentor, Judge]
    code: 200
    input: []
    output: Award
    side_effects: []
  - method: POST
    path: "/science-fair/awards/{id}/revoke"
    description: "Revoke a PROPOSED award"
    roles: [FairDirector]
    code: 200
    input: []
    output: Award
    side_effects: ["award.status = REVOKED", "mentor recognition_points recomputed"]
  - method: POST
    path: "/science-fair/scholarship-pools"
    description: "Create the scholarship pool for an edition (exactly one per edition)"
    roles: [FairDirector]
    code: 201
    input: [fair_edition_id, total_cents]
    output: ScholarshipPool
    side_effects: []
  - method: GET
    path: "/science-fair/scholarship-pools"
    description: "List scholarship pools"
    roles: [FairDirector]
    code: 200
    input: ["limit?", "offset?", "fair_edition_id?"]
    output: ScholarshipPool[]
    side_effects: []
  - method: GET
    path: "/science-fair/scholarship-pools/{id}"
    description: "Get one scholarship pool"
    roles: [FairDirector]
    code: 200
    input: []
    output: ScholarshipPool
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role / X-User-ID headers, or undeclared role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Authenticated role is not permitted to invoke this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path-template resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, or enum value outside the declared set" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is not in a state from which the requested transition is allowed" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Entity-backed role attempts to act on a resource it does not own (e.g., Mentor acting on another mentor's project, Judge scoring another judge's assignment)" }
  - { id: ERR_SOD_VIOLATION, http: 422, condition: "Segregation-of-duties breach: ethics reviewer is the project's mentor, or judge has a declared conflict with the project" }
  - { id: ERR_RESEARCH_PLAN_REQUIRED, http: 422, condition: "Project declares human/animal subjects but has no ResearchPlan in SUBMITTED/UNDER_REVIEW/APPROVED at submit time" }
  - { id: ERR_PROJECT_LOCKED, http: 409, condition: "ResearchPlan mutation attempted while parent project is in a locked registration state" }
  - { id: ERR_RATIONALE_REQUIRED, http: 422, condition: "Ethics decision REJECT or REQUEST_REVISION with empty rationale" }
  - { id: ERR_NO_OPEN_CATEGORY, http: 409, condition: "open-registration requires at least one OPEN category in the edition" }
  - { id: ERR_PROJECTS_UNINSPECTED, http: 409, condition: "begin-judging requires every CONFIRMED project to have inspection_status in {SCHEDULED, PASSED}" }
  - { id: ERR_UNJUDGED_PROJECTS, http: 409, condition: "publish-advancement requires every CONFIRMED project to be judging_status == JUDGED" }
  - { id: ERR_NOT_JUDGING_PHASE, http: 409, condition: "Score submission attempted while edition is not in JUDGING" }
  - { id: ERR_ADVANCEMENT_FROZEN, http: 409, condition: "Category quota edit (or other edition-mutating op) attempted after advancement_freeze is true (post publish-advancement)" }
  - { id: ERR_ALREADY_ASSIGNED, http: 409, condition: "Withdraw attempted while project has non-terminal JudgingAssignments" }
  - { id: ERR_NO_ELIGIBLE_JUDGE, http: 409, condition: "Auto-assign selector found an empty eligible-judge pool" }
  - { id: ERR_JUDGE_HAS_ASSIGNMENTS, http: 409, condition: "Deactivate attempted while judge.active_assignment_count > 0" }
  - { id: ERR_BOOTH_TAKEN, http: 422, condition: "(hall, booth_number) already occupied within this edition" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "inspection_window_start >= inspection_window_end" }
  - { id: ERR_OUTSIDE_WINDOW, http: 422, condition: "Inspection result recorded outside the scheduled window (logical clock)" }
  - { id: ERR_CONSTRAINT_VIOLATION, http: 422, condition: "Generic constraint breach: capacity, uniqueness, team_size bounds, duplicate active assignment" }
  - { id: ERR_REFERENTIAL_INTEGRITY, http: 422, condition: "Referenced entity does not exist or belongs to a different fair edition" }
  - { id: ERR_SCHOLARSHIP_POOL_MISSING, http: 422, condition: "finalize-awards requires a ScholarshipPool for the edition" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Transition attempted from a terminal state (e.g., WITHDRAWN project, CONFERRED award, ARCHIVED edition)" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated caller (no valid X-User-Role / X-User-ID). Declared so negative auth tests can name it; every endpoint rejects it with ERR_UNAUTHENTICATED."
    identity: "opaque"
    exclusive_operations: []
    shared_operations: []
  - name: FairDirector
    description: "Regional fair affiliate director; full administrative control over editions, categories, judges, assignments, awards"
    identity: "opaque"
    exclusive_operations:
      - "create/advance fair editions (open-registration, close-registration, begin-judging, publish-advancement, finalize-awards, archive)"
      - "create/patch categories, create scholarship pools"
      - "recruit/activate/deactivate judges, release assignments"
      - "auto/explicit judge assignment"
      - "propose/revoke awards"
      - "set logical clock"
    shared_operations:
      - "read any entity"
      - "PATCH projects (category reassignment override)"
  - name: Mentor
    description: "Teacher/mentor who registers and submits projects and research plans"
    identity: "entity_backed:Mentor"
    exclusive_operations:
      - "create projects (as mentor_id), submit/withdraw own projects, PATCH own projects"
      - "create/edit/submit research plans for own projects"
    shared_operations:
      - "read projects, mentors, editions, categories, awards"
  - name: EthicsReviewer
    description: "Institutional review committee member; decides research plans"
    identity: "opaque"
    exclusive_operations:
      - "begin-review on research plans"
      - "record ethics decisions (subject to segregation-of-duties)"
    shared_operations:
      - "read research plans, ethics reviews, projects, editions"
  - name: Judge
    description: "Competition judge; scores assigned projects"
    identity: "entity_backed:Judge"
    exclusive_operations:
      - "submit score sheets for own assignments"
      - "recuse from own assignments"
      - "declare own conflicts"
    shared_operations:
      - "read judges, assignments, score sheets, projects"
  - name: OperationsLead
    description: "Venue operations; booth and inspection scheduling"
    identity: "opaque"
    exclusive_operations:
      - "create booth assignments (schedules inspection window)"
    shared_operations:
      - "read booth assignments, projects, editions"
  - name: SafetyInspector
    description: "Display & safety inspector at the venue"
    identity: "opaque"
    exclusive_operations:
      - "record inspection results (PASS/FAIL)"
    shared_operations:
      - "read booth assignments, projects, editions"
