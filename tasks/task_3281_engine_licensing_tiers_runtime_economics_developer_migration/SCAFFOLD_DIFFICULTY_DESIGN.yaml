              captures: { inv_final: $.data.0.final_amount_cents }
          assert:
            - "inv_final == 0 (chargeable portion above the threshold is zero at exactly 1,000,000; threshold is crossed only for installs BEYOND it)"
            - "GameProject.${proj_id}.lifetime_installs == 1000000"

      - name: seat_assign_on_empty_pool_zero_available
        grounds:
          - validations[priority=15]
          - entities.SeatSubscription.fields.available_seats
        distinguishing_aspect: |
          Zero-count collection metric on the assign endpoint (different metric and
          endpoint from the install threshold): a subscription with purchased_seats=1
          after one assign has available_seats == 0 and the next assign must fail with
          ERR_SEAT_CAPACITY — the empty-pool edge, not a numeric threshold.
        test_recipe:
          setup:
            - "PRO org with one ACTIVE SeatSubscription purchased_seats=1; one seat already assigned (subscription EXHAUSTED)"
          setup_api_calls:
            - call: "POST /tiers"
              payload: { tier_code: "PERSONAL", revenue_ceiling_cents: 20000000, funding_ceiling_cents: 20000000, seat_minimum: 0, seat_overage_cents: 0, runtime_fee_exempt: true, export_module_allowed: false, marketplace_sell_allowed: false }
              as: PlatformAdmin
