            - "TileBatch.${b1}.allocated_mass_kg == 380 and recycled_content_pct == 100.00 (single all-recycled lot)"
            - "invariant available_kg + allocated_kg == quantity_kg held at every step with zero drift"

      - name: batch_area_conserved_across_order_lifecycle
        grounds:
          - entities.TileBatch.fields.available_m2
          - state_machines.TileBatch.RELEASED_to_EXHAUSTED
          - state_machines.ReplacementOrder.MATCHED_to_CANCELLED
          - endpoints."POST /carpetloop/sites/{site_id}/zones"
          - endpoints."POST /carpetloop/replacement-orders/{order_id}/cancel"
        distinguishing_aspect: "Conserved quantity is batch square-meters, a different quantity than the feedstock-kg invariant: available_m2 + (IN_SERVICE zone areas from the batch) + (MATCHED-order reservations) == produced_m2 (100) across zone-lay, match reservation, cancel compensation, and final exact-fit exhaustion."
        test_recipe:
          setup:
            - "Collection CIR; batch DL-100 (100 m2) RELEASED; site IN_SERVICE under inst-bob."
          setup_api_calls:
            - *k_clock
            - *k_col_grave_none
            - *k_lot_net200
            - *k_lot_vir200
            - *k_qc_lot1
            - *k_qc_lot2
            - *k_batch_b1
            - *k_alloc1
            - *k_alloc2
            - *k_rel_b1
            - *k_site1
            - *k_install1
          trigger:
            - call: "POST /carpetloop/sites/${site1}/zones"
              payload: { batch_id: "${b1}", zone_code: "Z-1", area_m2: 30 }
              as: Installer
              as_user_id: "inst-bob"
              captures: { z1: $.data.id }
            - call: "GET /carpetloop/batches/${b1}"
              payload: {}
              as: PlatformAdmin
              captures: { av1: $.data.available_m2 }
            - *k_get_site
            - *k_ord1
            - call: "POST /carpetloop/replacement-orders/${ord1}/match"
              payload: {}
              as: Installer
              as_user_id: "inst-bob"
            - call: "GET /carpetloop/batches/${b1}"
              payload: {}
              as: PlatformAdmin
              captures: { av2: $.data.available_m2 }
            - call: "POST /carpetloop/replacement-orders/${ord1}/cancel"
              payload: {}
              as: Specifier
              as_user_id: "spec-ada"
            - call: "GET /carpetloop/batches/${b1}"
              payload: {}
              as: PlatformAdmin
              captures: { av3: $.data.available_m2 }
            - call: "POST /carpetloop/sites/${site1}/zones"
              payload: { batch_id: "${b1}", zone_code: "Z-2", area_m2: 70 }
              as: Installer
              as_user_id: "inst-bob"
            - call: "GET /carpetloop/batches/${b1}"
              payload: {}
              as: PlatformAdmin
              captures: { av4: $.data.available_m2, st4: $.data.status }
          assert:
            - "after laying Z-1 (30 m2): av1 == 70 -> 70 + 30 == 100"
            - "after matching ORD-1 (reservation 30, exact dye lot, quote 36000 = 30 x 1200 x 1.00): av2 == 40 -> 40 + 30 zones + 30 reserved == 100"
            - "after cancelling ORD-1: av3 == 70 -> compensation restores the reservation exactly, no drift"
            - "after laying Z-2 (70 m2, exact fit): av4 == 0 and st4 == EXHAUSTED -> 0 + 30 + 70 == 100"
            - "order cancel from MATCHED is the compensating action of the match reservation"
