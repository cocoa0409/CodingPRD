              as: TraumaMedicalDirector
              as_user_id: "u_director_1"
              captures: { pi: $.data.id }
            - call: "POST /pi-events/${pi}/start-review"
              payload: {}
              as: TraumaMedicalDirector
              as_user_id: "u_director_1"
            - call: "POST /pi-events/${pi}/corrective-actions"
              payload: { action_type: "EDUCATION", owner_user_id: "u_director_1", due_at: "2026-09-01T00:00:00Z" }
              as: TraumaMedicalDirector
              as_user_id: "u_director_1"
              captures: { ca: $.data.id }
          trigger:
            - call: "POST /pi-events/${pi}/close-loop"
              payload: { loop_closure_note: "Closing my own action without verification." }
              as: TraumaMedicalDirector
              as_user_id: "u_director_1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 409 and data.error_id == ERR_OPEN_ACTIONS_BLOCK_LOOP_CLOSURE"
            - "data.error_id != ERR_SEGREGATION_OF_DUTIES even though the closer owns the action"
            - "PIEvent.${pi}.status is still ACTION_PLANNED with closed_at null and verified_action_count == 0"
            - "TraumaCenter.${c1}.open_pi_event_count == 1 and closed_pi_event_count == 0"
      - name: role_auth_error_precedes_missing_cycle_existence_check
        grounds:
          - validations[priority=2]
          - validations[priority=12]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - errors[ERR_CYCLE_NOT_FOUND]
        distinguishing_aspect: |
          A RegistryAbstractor submits a verification cycle that does not exist: the auth rule at
          priority 2 and the existence rule at priority 12 are both violated and the response must be
          ERR_ROLE_NOT_PERMITTED (403), so authorisation is decided before any lookup leaks the
          identifier's absence.
        test_recipe:
          setup:
            - "an empty database apart from one trauma center, so the cycle id 00000000-0000-0000-0000-000000000000 cannot exist"
            - "the acting role RegistryAbstractor is absent from the roles list of POST /verification-cycles/{id}/submit"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
