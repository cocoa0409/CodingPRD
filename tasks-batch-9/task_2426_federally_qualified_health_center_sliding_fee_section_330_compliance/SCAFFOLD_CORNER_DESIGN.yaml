            - "Patient.${cp_id}.sliding_fee_status == \"VERIFIED\""

      - name: board_chair_who_is_not_a_seated_member_is_forbidden
        claim_type: entity_backed_identity
        grounds:
          - validations[priority 14]
          - errors[ERR_NOT_SEATED_BOARD_MEMBER]
          - roles.BoardChair.identity
          - endpoints[POST /scope-change-requests/{id}/begin-review]
        distinguishing_aspect: >-
          BoardChair identity is entity_backed:BoardMember, so an X-User-ID that is not a SEATED
          BoardMember of this grantee is refused with ERR_NOT_SEATED_BOARD_MEMBER / 403 even though
          the role itself is on the endpoint's roles list; the seated chair's identical call succeeds.
        test_recipe:
          setup:
            - "BOOT_CORE is executed and an ADD_SITE request is submitted for the PROPOSED annex"
          setup_api_calls:
            - *c_pg26
            - *c_hc
            - *c_site
            - *c_svc
            - *c_chair
            - *c_fs
            - *c_t1
            - *c_t2
            - *c_hcv
            - *c_adopt
            - *c_site2
            - *c_scr_add
            - call: "POST /scope-change-requests/${cscr_id}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /scope-change-requests/${cscr_id}/begin-review"
              payload: {}
              as: BoardChair
              as_user_id: "00000000-0000-4000-8000-0000000000ff"
              captures: { e_notseated: $.data.error_id }
            - call: "POST /scope-change-requests/${cscr_id}/begin-review"
              payload: {}
              as: BoardChair
              as_user_id: "${cchair_id}"
              captures: { seated_status: $.data.status }
          assert:
            - "the impostor call returned HTTP 403 with data.error_id == \"ERR_NOT_SEATED_BOARD_MEMBER\""
            - "after the impostor call ScopeChangeRequest.${cscr_id}.status == \"SUBMITTED\" and reviewed_by_user_id == null"
            - "the seated chair's call returned HTTP 200 with seated_status == \"UNDER_REVIEW\""
            - "ScopeChangeRequest.${cscr_id}.reviewed_by_user_id == ${cchair_id}"

      - name: project_officer_cannot_prepare_a_corrective_action_plan_unauthorized
        claim_type: exclusive_operation_denied
        grounds:
          - roles.ComplianceOfficer.exclusive_operations
          - roles.ProjectOfficer.exclusive_operations
          - validations[priority 3]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: >-
          The findings workflow is split across the two oversight roles: the ProjectOfficer issues the
          finding and adjudicates the plan, but preparing the plan is exclusive to the
          ComplianceOfficer, so the ProjectOfficer's POST is refused with ERR_UNAUTHORIZED / 403.
        test_recipe:
          setup:
            - "BOOT_CORE is executed and a CONDITION finding with cap_due_days 30 is issued"
          setup_api_calls:
            - *c_pg26
            - *c_hc
            - *c_site
            - *c_svc
            - *c_chair
            - *c_fs
            - *c_t1
            - *c_t2
            - *c_hcv
            - *c_adopt
            - *c_find30
          trigger:
            - call: "POST /site-visit-findings/${cfind30_id}/corrective-action-plans"
              payload: { narrative: "Officer-authored plan", milestone_count: 2, target_completion_date: "2026-08-20T00:00:00Z" }
              as: ProjectOfficer
              as_user_id: "po-1"
              captures: { e_po_cap: $.data.error_id }
          assert:
            - "HTTP 403 and data.error_id == \"ERR_UNAUTHORIZED\""
            - "GET /site-visit-findings/${cfind30_id}/corrective-action-plans returns total_count == 0"
            - "SiteVisitFinding.${cfind30_id}.status == \"OPEN\""

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_expected_patient_version_on_income_verification_create_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[income-verification-create-stale-patient]
          - errors[ERR_STALE_PATIENT_VERSION]
          - validations[priority 10]
          - endpoints[POST /patients/{id}/income-verifications]
        distinguishing_aspect: >-
          The first verification bumps Patient.version from 1 to 2, so a second submission that still
          carries expected_patient_version 1 is refused with ERR_STALE_PATIENT_VERSION / 412; the same
          submission with the refreshed version 2 succeeds, which proves the guard is version-based
          and not a duplicate-submission block.
        test_recipe:
          setup:
            - "BOOT_CORE is executed and patient 'Val Osei' is registered at version 1"
            - "One verification is submitted with expected_patient_version 1, taking the patient to version 2"
          setup_api_calls:
            - *c_pg26
            - *c_hc
            - *c_site
            - *c_svc
            - *c_chair
            - *c_fs
            - *c_t1
            - *c_t2
            - *c_hcv
            - *c_adopt
            - *c_p
            - *c_iv
            - call: "GET /patients/${cp_id}"
              payload: {}
              as: PatientServicesRep
              as_user_id: "psr-1"
              captures: { cp_v2: $.data.version }
          trigger:
            - call: "POST /patients/${cp_id}/income-verifications"
              payload: { declared_annual_income_cents: 1100000, household_size: 1, documentation_type: "PAY_STUB", effective_date: "2026-04-01T00:00:00Z", expected_patient_version: "${cp_v}" }
              as: PatientServicesRep
              as_user_id: "psr-1"
              captures: { e_occ_pt: $.data.error_id }
            - call: "POST /patients/${cp_id}/income-verifications"
              payload: { declared_annual_income_cents: 1100000, household_size: 1, documentation_type: "PAY_STUB", effective_date: "2026-04-01T00:00:00Z", expected_patient_version: "${cp_v2}" }
              as: PatientServicesRep
              as_user_id: "psr-1"
              captures: { occ_ok_id: $.data.id }
          assert:
            - "cp_v == 1 and cp_v2 == 2"
            - "the stale call returned HTTP 412 with data.error_id == \"ERR_STALE_PATIENT_VERSION\""
            - "immediately after the stale call GET /income-verifications?patient_id=${cp_id} still returns total_count == 1"
            - "the refreshed call returned HTTP 201 and IncomeVerification.${occ_ok_id}.status == \"SUBMITTED\""
            - "Patient.${cp_id}.version == 3"

      - name: stale_expected_health_center_version_on_fee_schedule_adopt_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[fee-schedule-adopt-stale-health-center]
          - errors[ERR_STALE_HEALTH_CENTER_VERSION]
          - validations[priority 10]
          - endpoints[POST /fee-schedules/{id}/adopt]
        distinguishing_aspect: >-
          A ProjectOfficer suspending a site between the chair's read (version 4) and the chair's
          adopt bumps HealthCenter.version to 5, so the adopt is refused with
          ERR_STALE_HEALTH_CENTER_VERSION / 412 and the schedule stays DRAFT — the concurrency guard
          fires even though nothing about the schedule itself changed.
        test_recipe:
          setup:
            - "The grantee, its baseline site and service, one SEATED seat, and the two-band DRAFT schedule all exist"
            - "The chair reads the grantee at version 4, then the ProjectOfficer suspends the baseline site (version 5)"
          setup_api_calls:
            - *c_pg26
            - *c_hc
            - *c_site
            - *c_svc
            - *c_chair
            - *c_fs
            - *c_t1
            - *c_t2
            - *c_hcv
            - *c_suspend
          trigger:
            - *c_adopt
          assert:
            - "chc_v == 4 and HealthCenter.${chc_id}.version == 5"
            - "HTTP 412 and data.error_id == \"ERR_STALE_HEALTH_CENTER_VERSION\""
            - "FeeSchedule.${cfs_id}.status == \"DRAFT\" and adopted_at == null"
            - "HealthCenter.${chc_id}.in_scope_site_count == 0"

      - name: health_center_version_increments_on_every_scope_and_governance_write
        claim_type: optimistic_concurrency
        grounds:
          - entities.HealthCenter.fields.version
          - endpoints[POST /service-sites/{id}/suspend]
          - endpoints[POST /service-sites/{id}/reinstate]
          - endpoints[POST /health-centers/{id}/lock-scope-baseline]
        distinguishing_aspect: >-
          Every write that touches scope or governance advances the grantee's version by exactly one,
          including writes routed through child resources: BOOT_CORE lands on 5, then suspend 6,
          reinstate 7, lock-scope-baseline 8 — with no skipped or doubled increments.
        test_recipe:
          setup:
            - "BOOT_CORE is executed, leaving HealthCenter.version at 5"
          setup_api_calls:
            - *c_pg26
            - *c_hc
            - *c_site
            - *c_svc
            - *c_chair
            - *c_fs
            - *c_t1
            - *c_t2
            - *c_hcv
            - *c_adopt
            - call: "GET /health-centers/${chc_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { v_after_boot: $.data.version }
          trigger:
            - *c_suspend
            - call: "GET /health-centers/${chc_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { v_after_suspend: $.data.version }
            - call: "POST /service-sites/${csite_id}/reinstate"
              payload: {}
              as: ProjectOfficer
              as_user_id: "po-1"
            - call: "GET /health-centers/${chc_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { v_after_reinstate: $.data.version }
            - call: "POST /health-centers/${chc_id}/lock-scope-baseline"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { v_after_lock: $.data.version }
          assert:
            - "v_after_boot == 5"
            - "v_after_suspend == 6 and v_after_reinstate == 7 and v_after_lock == 8"
            - "HealthCenter.${chc_id}.scope_baseline_locked == true"
            - "HealthCenter.${chc_id}.in_scope_site_count == 1"

      - name: finding_escalates_exactly_when_the_clock_reaches_cap_due_at
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers[rate_threshold_triggers]
          - calculations.compliance_sweep_epoch
          - entities.SiteVisitFinding.fields.cap_due_at
          - endpoints[POST /_ops/compliance-sweep]
        distinguishing_aspect: >-
          cap_due_at is 2026-08-31, so a sweep at 2026-08-30 escalates nothing and the sweep at
          exactly 2026-08-31 escalates the finding: the comparison is inclusive at the boundary
          instant, and only the second sweep freezes the grantee's scope.
        test_recipe:
          setup:
            - "BOOT_CORE is executed and a CONDITION finding with cap_due_days 30 is issued at clock 2026-08-01, so cap_due_at is 2026-08-31"
          setup_api_calls:
            - *c_pg26
            - *c_hc
            - *c_site
            - *c_svc
            - *c_chair
            - *c_fs
            - *c_t1
            - *c_t2
            - *c_hcv
            - *c_adopt
            - *c_find30
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-30T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /_ops/compliance-sweep"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { esc_before: $.data.escalated_finding_count }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-31T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /_ops/compliance-sweep"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { esc_at: $.data.escalated_finding_count }
          assert:
            - "SiteVisitFinding.${cfind30_id}.cap_due_at == \"2026-08-31T00:00:00.000Z\""
            - "esc_before == 0 and after the first sweep SiteVisitFinding.${cfind30_id}.status == \"OPEN\""
            - "after the first sweep HealthCenter.${chc_id}.scope_posture == \"OPEN\""
            - "esc_at == 1 and SiteVisitFinding.${cfind30_id}.status == \"ESCALATED\""
            - "SiteVisitFinding.${cfind30_id}.escalated_at == \"2026-08-31T00:00:00.000Z\""
            - "HealthCenter.${chc_id}.scope_posture == \"FROZEN\" and open_condition_count == 1"

      - name: sweep_checkpoint_never_re_escalates_an_already_escalated_finding
        claim_type: ops_run_checkpoint
        grounds:
          - complexity_profile.complexity_layers[ops_run_checkpoint]
          - calculations.compliance_sweep_epoch
          - endpoints[POST /_ops/compliance-sweep]
          - entities.SiteVisitFinding.fields.escalated_at
        distinguishing_aspect: >-
          The sweep checkpoints per row, not per run: the 2026-08-02 sweep escalates only the
          one-day finding, and the later 2026-08-31 sweep reports exactly one newly escalated row
          (the thirty-day finding) while leaving the first row's escalated_at frozen at 2026-08-02.
        test_recipe:
          setup:
            - "BOOT_CORE is executed"
            - "Two CONDITION findings are issued at clock 2026-08-01 with cap_due_days 1 and 30"
          setup_api_calls:
            - *c_pg26
            - *c_hc
            - *c_site
            - *c_svc
            - *c_chair
            - *c_fs
            - *c_t1
            - *c_t2
            - *c_hcv
            - *c_adopt
            - *c_find1
            - *c_find30
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /_ops/compliance-sweep"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ck_run1: $.data.escalated_finding_count }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-31T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /_ops/compliance-sweep"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ck_run2: $.data.escalated_finding_count }
          assert:
            - "ck_run1 == 1 and ck_run2 == 1"
            - "SiteVisitFinding.${cfind1_id}.escalated_at == \"2026-08-02T00:00:00.000Z\""
            - "SiteVisitFinding.${cfind30_id}.escalated_at == \"2026-08-31T00:00:00.000Z\""
            - "both findings have status \"ESCALATED\" and HealthCenter.${chc_id}.open_condition_count == 2"
            - "HealthCenter.${chc_id}.scope_posture == \"FROZEN\""

      - name: pinned_fee_schedule_and_tier_survive_a_later_adoption
        claim_type: version_pinning_on_approval
        grounds:
          - complexity_profile.complexity_layers[version_pinning_on_approval]
          - entities.Encounter.fields.fee_schedule_id
          - entities.Encounter.fields.pinned_discount_tier_id
          - state_machines.FeeSchedule.DRAFT_to_ADOPTED
        distinguishing_aspect: >-
          Pricing inputs are pinned at encounter creation, so adopting a second schedule for
          [2027-01-01, 2028-01-01) leaves the 2026-03-15 encounter pointing at the original schedule
          and its NOMINAL band with patient_charge_cents still 2500 and charge_adjustment_cents 0 —
          only HealthCenter.version moves, from 5 to 6.
        test_recipe:
          setup:
            - "BOOT_PT is executed and one SELF_PAY encounter on 2026-03-15 is priced at the nominal fee 2500"
          setup_api_calls:
            - *c_pg26
            - *c_hc
            - *c_site
            - *c_svc
            - *c_chair
            - *c_fs
            - *c_t1
            - *c_t2
            - *c_hcv
            - *c_adopt
            - *c_p
            - *c_iv
            - *c_ivv
            - *c_enc
          trigger:
            - &c_fs2
              call: "POST /health-centers/${chc_id}/fee-schedules"
              payload: { fpg_year: 2026, effective_start: "2027-01-01T00:00:00Z", effective_end: "2028-01-01T00:00:00Z", nominal_fee_cents: 2500 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cfs2_id: $.data.id }
            - &c_t1b
              call: "POST /fee-schedules/${cfs2_id}/discount-tiers"
              payload: { tier_label: "NOMINAL_FULL", fpg_min_pct: 0, fpg_max_pct: 100, discount_kind: "NOMINAL", sort_order: 1 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { ct1b_id: $.data.id }
            - &c_t2b
              call: "POST /fee-schedules/${cfs2_id}/discount-tiers"
              payload: { tier_label: "FULL_CHARGE", fpg_min_pct: 100, discount_kind: "NONE", sort_order: 2 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { ct2b_id: $.data.id }
            - &c_hcv2
              call: "GET /health-centers/${chc_id}"
              payload: {}
              as: BoardChair
              as_user_id: "${cchair_id}"
              captures: { chc_v2: $.data.version }
            - &c_adopt2
              call: "POST /fee-schedules/${cfs2_id}/adopt"
              payload: { expected_health_center_version: "${chc_v2}" }
              as: BoardChair
              as_user_id: "${cchair_id}"
              captures: { fs2_status: $.data.status }
          assert:
            - "chc_v2 == 5 and fs2_status == \"ADOPTED\""
            - "Encounter.${cenc_id}.fee_schedule_id == ${cfs_id}"
            - "Encounter.${cenc_id}.pinned_discount_tier_id == ${ct1_id}"
            - "Encounter.${cenc_id}.patient_charge_cents == 2500 and charge_adjustment_cents == 0"
            - "Patient.${cp_id}.patient_balance_cents == 2500"
            - "HealthCenter.${chc_id}.version == 6"

      - name: fee_schedule_selector_picks_the_period_containing_the_encounter_date
        claim_type: selector_policy
        grounds:
          - complexity_profile.complexity_layers[selector_policy]
          - calculations.patient_charge_cents
          - entities.FeeSchedule.fields.effective_end
          - endpoints[POST /encounters]
        distinguishing_aspect: >-
          Two ADOPTED schedules abut at 2027-01-01; an encounter dated 2027-01-15 selects the second
          period (half-open containment) and pins that ladder's NOMINAL band, while the first
          schedule — still ADOPTED — is not consulted.
        test_recipe:
          setup:
            - "BOOT_PT is executed and the second schedule for [2027-01-01, 2028-01-01) is adopted"
            - "The clock is advanced to 2027-02-01T00:00:00Z; the verification window [2026-03-01, 2027-03-01] still covers the new date of service"
          setup_api_calls:
            - *c_pg26
            - *c_hc
            - *c_site
            - *c_svc
            - *c_chair
            - *c_fs
            - *c_t1
            - *c_t2
            - *c_hcv
            - *c_adopt
            - *c_p
            - *c_iv
            - *c_ivv
            - *c_fs2
            - *c_t1b
            - *c_t2b
            - *c_hcv2
            - *c_adopt2
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-02-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /encounters"
              payload: { patient_id: "${cp_id}", service_site_id: "${csite_id}", service_definition_id: "${csvc_id}", encounter_date: "2027-01-15T00:00:00Z", payer_type: "SELF_PAY", gross_charge_cents: 8000 }
              as: BillingSpecialist
              as_user_id: "bs-1"
              captures: { sel_enc_id: $.data.id, sel_fs: $.data.fee_schedule_id, sel_tier: $.data.pinned_discount_tier_id }
          assert:
            - "HTTP 201 and sel_fs == ${cfs2_id}"
            - "sel_tier == ${ct1b_id}"
            - "Encounter.${sel_enc_id}.charge_basis == \"NOMINAL_FEE\" and patient_charge_cents == 2500"
            - "Encounter.${sel_enc_id}.income_verification_id == ${civ_id}"
            - "FeeSchedule.${cfs_id}.status == \"ADOPTED\" and superseded_by_fee_schedule_id == null"
            - "Patient.${cp_id}.patient_balance_cents == 2500"

      - name: five_level_cascade_from_an_approved_site_removal
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: remove_site_approval_cascades_into_void_and_patient_ledger_depth_five
          rationale: >-
            §1.8 already verifies the full five-hop chain (scope approval -> site OUT_OF_SCOPE ->
            encounter VOID -> patient ledger -> grantee counters and receivable) end to end with
            pinned intermediate observables, which is exactly this layer's N-level claim.
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
          - state_machines.ScopeChangeRequest.UNDER_REVIEW_to_APPROVED

      - name: both_fpg_variants_produce_their_own_result
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: fpg_percent_schedule_year_vs_intake_year_divergence
          rationale: >-
            §1.8 already drives the SCHEDULE_YEAR and INTAKE_YEAR variants apart on one verification
            and pins both fpg_percent and uds_fpg_percent plus the resulting tier, covering the
            both-variants and delta claims for this layer.
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
          - calculations.fpg_percent.variants

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: granted_waiver_is_visible_immediately_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.InabilityToPayWaiver.REQUESTED_to_GRANTED
          - calculations.patient_balance_invariant
          - endpoints[POST /waivers/{id}/decide]
        distinguishing_aspect: >-
          The consistency model is immediate, so the decide response itself already carries
          waived_amount_cents 2500 and every dependent read taken in the next request agrees at once:
          the encounter's waived_amount_cents, the patient's balance of 0, and the grantee's
          receivable — no re-read delay and no eventual convergence step.
        test_recipe:
          setup:
            - "BOOT_PT is executed and one SELF_PAY encounter on 2026-03-15 is charged the nominal fee 2500"
            - "The PatientServicesRep psr-1 requests an inability-to-pay waiver on that encounter"
          setup_api_calls:
            - *c_pg26
            - *c_hc
            - *c_site
            - *c_svc
            - *c_chair
            - *c_fs
            - *c_t1
            - *c_t2
            - *c_hcv
            - *c_adopt
            - *c_p
            - *c_iv
            - *c_ivv
            - *c_enc
            - call: "POST /encounters/${cenc_id}/waivers"
              payload: { waiver_reason: "NO_INCOME" }
              as: PatientServicesRep
              as_user_id: "psr-1"
              captures: { cwv_id: $.data.id, cwv_status: $.data.status }
          trigger:
            - call: "POST /waivers/${cwv_id}/decide"
              payload: { decision: "GRANT", decision_note: "Household reports no income this year" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { wv_status: $.data.status, wv_amount: $.data.waived_amount_cents }
          assert:
            - "cwv_status == \"REQUESTED\" and Patient.${cp_id}.patient_balance_cents == 2500 before the decision"
            - "HTTP 200 with wv_status == \"GRANTED\" and wv_amount == 2500 in the decide response itself"
            - "InabilityToPayWaiver.${cwv_id}.decided_by_user_id == \"co-1\""
            - "Encounter.${cenc_id}.waived_amount_cents == 2500 on the very next read"
            - "Patient.${cp_id}.patient_balance_cents == 0 on the very next read"
            - "Encounter.${cenc_id}.patient_charge_cents == 2500 (the charge is unchanged; only the waiver offsets it)"
