# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2920_hospital_sitter_continuous_observation_staffing
# 9 rule_ids x 2 differentiated instances = 18 instances.
# Every literal in `assert:` was computed against the §1.3 formula and its
# constants (round_half_up, half-open intervals, pinned evaluation orders).
# The logical clock starts at exactly 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: assignment_labor_cost_provisional_vs_final_diverge_on_one_watch
        grounds:
          - calculations.assignment_labor_cost
          - entities.SitterAssignment.fields.provisional_cost_cents
          - entities.SitterAssignment.fields.final_cost_cents
          - entities.CostEntry.fields.entry_kind
          - calculations.unit_cost_ledger_head
          - state_machines.SitterAssignment.watch_status.ON_WATCH_to_COMPLETED
        distinguishing_aspect: |
          This instance is cost accounting on the SitterAssignment/CostEntry money domain: the
          `provisional` variant bills the whole scheduled window in one rounding while the `final`
          variant bills only realised segment minutes, so the same watch yields 12000 provisional
          and 11000 final and the unit ledger settles on the final figure.
        test_recipe:
          setup:
            - "One unit UNIT-A with observation_cost_budget_cents 100000, video monitoring disabled."
            - "One admitted patient age 60 on UNIT-A with an ACTIVE ONE_TO_ONE_SITTER order for FALL risk."
            - "One INTERNAL_FLOAT sitter, hourly_rate_cents 3000, ADVANCED competency, certification valid through 2027."
            - "One assignment scheduled 2026-08-01T08:00Z -> 12:00Z (240 scheduled minutes)."
            - "The watch runs 08:00->10:30, breaks 10:30->10:50, then runs 10:50->12:00 and completes."
          setup_api_calls:
            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-A", name: "Medical Telemetry A", observation_cost_budget_cents: 100000, video_monitoring_enabled: false }
              as: NurseManager
              captures: { unit_a: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${unit_a}", mrn: "MRN-1001", full_name: "Pat One", age_years: 60 }
              as: NurseManager
              captures: { p1: $.data.id }
            - call: "POST /observation/staff"
              payload: { home_unit_id: "${unit_a}", full_name: "Sitter One", source_pool: "INTERNAL_FLOAT", hourly_rate_cents: 3000, competency_level: "ADVANCED", deescalation_cert_expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { s1: $.data.id }
            - call: "POST /observation/orders"
              payload: { patient_id: "${p1}", ordering_provider_user_id: "prov-1", risk_categories: ["FALL"], required_modality: "ONE_TO_ONE_SITTER", clinical_rationale: "Unsteady gait, high fall risk" }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { o1: $.data.id, o1_v: $.data.version }
            - call: "POST /observation/sitter-assignments"
              payload: { order_id: "${o1}", staff_id: "${s1}", shift_start_at: "2026-08-01T08:00:00Z", shift_end_at: "2026-08-01T12:00:00Z", expected_order_version: "${o1_v}" }
              as: StaffingCoordinator
              captures: { a1: $.data.id }
            - call: "POST /observation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: SystemAdmin
            - call: "POST /observation/sitter-assignments/${a1}/start-watch"
              payload: {}
              as: Sitter
              as_user_id: "${s1}"
            - call: "POST /observation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T10:30:00Z" }
              as: SystemAdmin
            - call: "POST /observation/sitter-assignments/${a1}/break-start"
              payload: {}
              as: Sitter
              as_user_id: "${s1}"
            - call: "POST /observation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T10:50:00Z" }
              as: SystemAdmin
            - call: "POST /observation/sitter-assignments/${a1}/break-end"
              payload: {}
              as: Sitter
              as_user_id: "${s1}"
            - call: "POST /observation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T12:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /observation/sitter-assignments/${a1}/complete"
              payload: { completion_reason: "SHIFT_END_NO_SUCCESSOR" }
              as: Sitter
              as_user_id: "${s1}"
          assert:
            - "SitterAssignment.${a1}.provisional_cost_cents == 12000"
            - "SitterAssignment.${a1}.final_cost_cents == 11000"
            - "SitterAssignment.${a1}.watch_segment_count == 2"
            - "SitterAssignment.${a1}.watched_minutes == 220"
            - "SitterAssignment.${a1}.watch_status == COMPLETED and documentation_status == WAIVED"
            - "GET /observation/sitter-assignments/${a1}/cost-entries returns exactly 3 rows: the PROVISIONAL row has amount_cents 12000 and status REVERSED; the two FINAL_SEGMENT rows have amount_cents 7500 (segment_index 1, segment_minutes 150) and amount_cents 3500 (segment_index 2, segment_minutes 70), both status POSTED with night_differential_applied false"
            - "Unit.${unit_a}.observed_cost_to_date_cents == 11000"
            - "ObservationOrder.${o1}.coverage_gap_flag == true"

      - name: elopement_risk_score_admission_baseline_vs_rolling_event_weighted
        grounds:
          - calculations.patient_elopement_risk_score
          - calculations.reassessment_interval_hours
          - entities.ObservationOrder.fields.risk_score_variant
          - entities.ObservationOrder.fields.elopement_risk_score
          - state_machines.ObservationOrder.status.ESCALATED_to_ACTIVE
        distinguishing_aspect: |
          This instance is clinical risk scoring on the ObservationOrder/Patient domain, not money on
          an assignment: the `admission_baseline` variant reads no SafetyEvent at all (score 5.0,
          12-hour interval) while `rolling_event_weighted` adds the trailing-24h attempt component to
          the identical order data (score 6.0, 8-hour interval).
        test_recipe:
          setup:
            - "Unit UNIT-B with video monitoring enabled and budget 100000."
            - "Admitted patient age 80 on UNIT-B (the age adjustment is inclusive at 75)."
            - "One ACTIVE order for FALL + ELOPEMENT written at the default clock 2026-08-01T00:00:00Z."
            - "One INTERNAL_FLOAT sitter with ADVANCED competency who reports one ELOPEMENT_ATTEMPT under that order at 2026-08-01T00:00:00Z, which is then escalated and closed."
          setup_api_calls:
            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-B", name: "Geriatric Unit B", observation_cost_budget_cents: 100000, video_monitoring_enabled: true }
              as: NurseManager
              captures: { unit_b: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${unit_b}", mrn: "MRN-2001", full_name: "Pat Two", age_years: 80 }
              as: NurseManager
              captures: { p2: $.data.id }
            - call: "POST /observation/staff"
              payload: { home_unit_id: "${unit_b}", full_name: "Sitter Two", source_pool: "INTERNAL_FLOAT", hourly_rate_cents: 2000, competency_level: "ADVANCED", deescalation_cert_expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { s2: $.data.id }
            - call: "POST /observation/orders"
              payload: { patient_id: "${p2}", ordering_provider_user_id: "prov-1", risk_categories: ["FALL", "ELOPEMENT"], required_modality: "VIDEO_MONITORING", clinical_rationale: "Wandering with exit-seeking behaviour" }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { o2: $.data.id }
            - call: "POST /observation/safety-events"
              payload: { order_id: "${o2}", event_kind: "ELOPEMENT_ATTEMPT", narrative: "Patient attempted to leave the unit through the stairwell door" }
              as: Sitter
              as_user_id: "${s2}"
              captures: { e1: $.data.id }
            - call: "POST /observation/safety-events/${e1}/escalate-response"
              payload: { response_actions: ["VERBAL_REDIRECTION", "FAMILY_PRESENCE"] }
              as: SafetyOfficer
              as_user_id: "safety-1"
          trigger:
            - call: "POST /observation/safety-events/${e1}/close"
              payload: { resolution: "CONTINUE_OBSERVATION" }
              as: SafetyOfficer
              as_user_id: "safety-2"
          assert:
            - "Immediately after order creation the response had ObservationOrder.${o2}.elopement_risk_score == 5.0, risk_score_variant == ADMISSION_BASELINE, reassessment_interval_hours == 12 and next_reassessment_due_at == 2026-08-01T12:00:00Z"
            - "After the close, ObservationOrder.${o2}.elopement_risk_score == 6.0"
            - "ObservationOrder.${o2}.risk_score_variant == ROLLING_EVENT_WEIGHTED"
            - "ObservationOrder.${o2}.reassessment_interval_hours == 8"
            - "ObservationOrder.${o2}.last_reassessed_at == 2026-08-01T00:00:00Z (a close never moves it) and next_reassessment_due_at == 2026-08-01T08:00:00Z"
            - "ObservationOrder.${o2}.status == ACTIVE and SafetyEvent.${e1}.status == CLOSED"
            - "ObservationOrder.${o2}.reassessment_count == 0 (a rolling re-score is not a reassessment)"

  - rule_id: combinatorial_formula
    instances:
      - name: per_segment_rounding_beats_sum_then_round_on_agency_watch
        grounds:
          - calculations.assignment_labor_cost
          - entities.CostEntry.fields.segment_minutes
          - entities.SitterAssignment.fields.final_cost_cents
          - state_machines.SitterAssignment.watch_status.ON_WATCH_to_ON_BREAK
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order matters. The pinned rule rounds each closed watch
          segment to whole cents and then sums (7733 + 8458 = 16191); the natural but wrong
          sum-the-raw-amounts-then-round-once reading gives 16192 on exactly this data, so the two
          readings are separated by one cent.
        test_recipe:
          setup:
            - "Unit UNIT-C, budget 200000, status OPEN (so the AGENCY block does not apply)."
            - "Admitted patient age 60 on UNIT-C with an ACTIVE ONE_TO_ONE_SITTER order for FALL risk."
            - "One AGENCY sitter, hourly_rate_cents 2500 (pool multiplier 1.45), ADVANCED competency."
            - "Assignment scheduled 2026-08-01T08:00Z -> 17:00Z (540 minutes)."
            - "Realised segments are 08:00->10:08 (128 minutes) and 10:30->12:50 (140 minutes); the 22-minute break is never billed and neither segment starts in the night window."
          setup_api_calls:
            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-C", name: "Neuro Unit C", observation_cost_budget_cents: 200000, video_monitoring_enabled: false }
              as: NurseManager
              captures: { unit_c: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${unit_c}", mrn: "MRN-3001", full_name: "Pat Three", age_years: 60 }
              as: NurseManager
              captures: { p3: $.data.id }
            - call: "POST /observation/staff"
              payload: { home_unit_id: "${unit_c}", full_name: "Agency Sitter", source_pool: "AGENCY", hourly_rate_cents: 2500, competency_level: "ADVANCED", deescalation_cert_expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { s3: $.data.id }
            - call: "POST /observation/orders"
              payload: { patient_id: "${p3}", ordering_provider_user_id: "prov-1", risk_categories: ["FALL"], required_modality: "ONE_TO_ONE_SITTER", clinical_rationale: "Post-op delirium with fall risk" }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { o3: $.data.id, o3_v: $.data.version }
            - call: "POST /observation/sitter-assignments"
              payload: { order_id: "${o3}", staff_id: "${s3}", shift_start_at: "2026-08-01T08:00:00Z", shift_end_at: "2026-08-01T17:00:00Z", expected_order_version: "${o3_v}" }
              as: StaffingCoordinator
              captures: { a3: $.data.id }
            - call: "POST /observation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: SystemAdmin
            - call: "POST /observation/sitter-assignments/${a3}/start-watch"
              payload: {}
              as: Sitter
              as_user_id: "${s3}"
            - call: "POST /observation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T10:08:00Z" }
              as: SystemAdmin
            - call: "POST /observation/sitter-assignments/${a3}/break-start"
              payload: {}
              as: Sitter
              as_user_id: "${s3}"
            - call: "POST /observation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T10:30:00Z" }
              as: SystemAdmin
            - call: "POST /observation/sitter-assignments/${a3}/break-end"
              payload: {}
              as: Sitter
              as_user_id: "${s3}"
            - call: "POST /observation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T12:50:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /observation/sitter-assignments/${a3}/complete"
              payload: { completion_reason: "SHIFT_END_NO_SUCCESSOR" }
              as: Sitter
              as_user_id: "${s3}"
          assert:
            - "SitterAssignment.${a3}.provisional_cost_cents == 32625"
            - "The FINAL_SEGMENT CostEntry with segment_index 1 has segment_minutes 128 and amount_cents 7733"
            - "The FINAL_SEGMENT CostEntry with segment_index 2 has segment_minutes 140 and amount_cents 8458"
            - "SitterAssignment.${a3}.final_cost_cents == 16191"
            - "SitterAssignment.${a3}.final_cost_cents != 16192 (the sum-then-round reading is rejected)"
            - "SitterAssignment.${a3}.watched_minutes == 268 and watch_segment_count == 2"
            - "Unit.${unit_c}.observed_cost_to_date_cents == 16191"

      - name: cost_close_surcharge_tier_keyed_on_subtotal_not_on_total
        grounds:
          - calculations.unit_daily_observation_charge
          - calculations.unit_cost_ledger_head
          - entities.CostEntry.fields.posted_at
          - endpoints["POST /observation/units/{id}/cost-close"]
        distinguishing_aspect: |
          Mode (c) — a circular-looking dependency with a pinned evaluation order. The surcharge tier is
          keyed on subtotal_cents ALONE (58000 -> 4%, surcharge 2320, total 60320); keying it on the
          resulting charge_total_cents would land in the 8% tier and return 62640, so the pinned order
          is what makes the value well-defined.
        test_recipe:
          setup:
            - "Unit UNIT-D, budget 200000, OPEN."
            - "Two admitted patients age 60 on UNIT-D, each with an ACTIVE ONE_TO_ONE_SITTER order for FALL risk."
            - "Two INTERNAL_FLOAT sitters: rate 2900 on a 720-minute shift and rate 2320 on a 600-minute shift, so the PROVISIONAL entries are 34800 and 23200 and both post at the default clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-D", name: "Behavioral Unit D", observation_cost_budget_cents: 200000, video_monitoring_enabled: false }
              as: NurseManager
              captures: { unit_d: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${unit_d}", mrn: "MRN-4001", full_name: "Pat Four", age_years: 60 }
              as: NurseManager
              captures: { p4: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${unit_d}", mrn: "MRN-4002", full_name: "Pat Five", age_years: 60 }
              as: NurseManager
              captures: { p5: $.data.id }
            - call: "POST /observation/staff"
              payload: { home_unit_id: "${unit_d}", full_name: "Sitter Four", source_pool: "INTERNAL_FLOAT", hourly_rate_cents: 2900, competency_level: "BASIC", deescalation_cert_expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { s4: $.data.id }
            - call: "POST /observation/staff"
              payload: { home_unit_id: "${unit_d}", full_name: "Sitter Five", source_pool: "INTERNAL_FLOAT", hourly_rate_cents: 2320, competency_level: "BASIC", deescalation_cert_expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { s5: $.data.id }
            - call: "POST /observation/orders"
              payload: { patient_id: "${p4}", ordering_provider_user_id: "prov-1", risk_categories: ["FALL"], required_modality: "ONE_TO_ONE_SITTER", clinical_rationale: "Fall risk after syncope" }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { o4: $.data.id, o4_v: $.data.version }
            - call: "POST /observation/orders"
              payload: { patient_id: "${p5}", ordering_provider_user_id: "prov-1", risk_categories: ["FALL"], required_modality: "ONE_TO_ONE_SITTER", clinical_rationale: "Fall risk after hip fracture" }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { o5: $.data.id, o5_v: $.data.version }
            - call: "POST /observation/sitter-assignments"
              payload: { order_id: "${o4}", staff_id: "${s4}", shift_start_at: "2026-08-01T00:00:00Z", shift_end_at: "2026-08-01T12:00:00Z", expected_order_version: "${o4_v}" }
              as: StaffingCoordinator
              captures: { a4: $.data.id }
            - call: "POST /observation/sitter-assignments"
              payload: { order_id: "${o5}", staff_id: "${s5}", shift_start_at: "2026-08-02T00:00:00Z", shift_end_at: "2026-08-02T10:00:00Z", expected_order_version: "${o5_v}" }
              as: StaffingCoordinator
              captures: { a5: $.data.id }
          trigger:
            - call: "POST /observation/units/${unit_d}/cost-close"
              payload: { close_through_utc: "2026-08-03T00:00:00Z" }
              as: StaffingCoordinator
              captures: { close_total: $.data.charge_total_cents }
          assert:
            - "SitterAssignment.${a4}.provisional_cost_cents == 34800 and SitterAssignment.${a5}.provisional_cost_cents == 23200"
            - "Unit.${unit_d}.observed_cost_to_date_cents == 58000"
            - "response.data.subtotal_cents == 58000"
            - "response.data.coverage_surcharge_pct == 0.04"
            - "response.data.coverage_surcharge_cents == 2320"
            - "response.data.charge_total_cents == 60320"
            - "response.data.charge_total_cents != 62640 (tier keyed on the total would be the wrong reading)"
            - "response.data.unit_status == OPEN"
            - "GET /observation/units/${unit_d}/cost-entries still returns exactly 2 POSTED rows — cost-close creates, mutates and reverses nothing"

  - rule_id: non_linear_state_machine
    instances:
      - name: observation_order_cycles_active_escalated_active_twice
        grounds:
          - state_machines.ObservationOrder.status.ACTIVE_to_ESCALATED
          - state_machines.ObservationOrder.status.ESCALATED_to_ACTIVE
          - state_machines.SafetyEvent.status.REPORTED_to_ESCALATED_RESPONSE
          - calculations.patient_elopement_risk_score
        distinguishing_aspect: |
          Cycle on the ObservationOrder entity: the order returns to ACTIVE after each escalation is
          closed and can be escalated again, and each completed loop leaves an observable trace (the
          rolling score climbs 1.5 -> 2.5 -> 3.5 and the interval drops 24 -> 24 -> 12), so the loop is
          not idempotent even though the status returns to its starting value.
        test_recipe:
          setup:
            - "Unit UNIT-E budget 100000; admitted patient age 60; ACTIVE order for FALL risk at the default clock 2026-08-01T00:00:00Z (baseline score 1.5, interval 24h)."
            - "One INTERNAL_FLOAT sitter with ADVANCED competency who reports both aggression events."
          setup_api_calls:
            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-E", name: "Acute Unit E", observation_cost_budget_cents: 100000, video_monitoring_enabled: false }
              as: NurseManager
              captures: { unit_e: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${unit_e}", mrn: "MRN-5001", full_name: "Pat Six", age_years: 60 }
              as: NurseManager
              captures: { p6: $.data.id }
            - call: "POST /observation/staff"
              payload: { home_unit_id: "${unit_e}", full_name: "Sitter Six", source_pool: "INTERNAL_FLOAT", hourly_rate_cents: 2000, competency_level: "ADVANCED", deescalation_cert_expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { s6: $.data.id }
            - call: "POST /observation/orders"
              payload: { patient_id: "${p6}", ordering_provider_user_id: "prov-1", risk_categories: ["FALL"], required_modality: "ONE_TO_ONE_SITTER", clinical_rationale: "Agitated with fall risk" }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { o6: $.data.id }
            - call: "POST /observation/safety-events"
              payload: { order_id: "${o6}", event_kind: "AGGRESSION", narrative: "Struck at staff during repositioning" }
              as: Sitter
              as_user_id: "${s6}"
              captures: { ev1: $.data.id }
            - call: "POST /observation/safety-events/${ev1}/escalate-response"
              payload: { response_actions: ["VERBAL_REDIRECTION"] }
              as: SafetyOfficer
              as_user_id: "safety-1"
            - call: "POST /observation/safety-events/${ev1}/close"
              payload: { resolution: "CONTINUE_OBSERVATION" }
              as: SafetyOfficer
              as_user_id: "safety-2"
          trigger:
            - call: "POST /observation/safety-events"
              payload: { order_id: "${o6}", event_kind: "AGGRESSION", narrative: "Second aggression episode during hygiene care" }
              as: Sitter
              as_user_id: "${s6}"
              captures: { ev2: $.data.id }
            - call: "POST /observation/safety-events/${ev2}/escalate-response"
              payload: { response_actions: ["DISTRACTION", "FAMILY_PRESENCE"] }
              as: SafetyOfficer
              as_user_id: "safety-1"
            - call: "POST /observation/safety-events/${ev2}/close"
              payload: { resolution: "CONTINUE_OBSERVATION" }
              as: SafetyOfficer
              as_user_id: "safety-2"
          assert:
            - "After the first event was reported ObservationOrder.${o6}.status was ESCALATED; after the first close it was ACTIVE with elopement_risk_score 2.5 and reassessment_interval_hours 24"
            - "After the second event was reported ObservationOrder.${o6}.status was ESCALATED again (the cycle re-enters)"
            - "After the second close ObservationOrder.${o6}.status == ACTIVE"
            - "ObservationOrder.${o6}.elopement_risk_score == 3.5"
            - "ObservationOrder.${o6}.reassessment_interval_hours == 12"
            - "ObservationOrder.${o6}.next_reassessment_due_at == 2026-08-01T12:00:00Z (last_reassessed_at stayed 2026-08-01T00:00:00Z)"
            - "GET /observation/orders/${o6}/safety-events returns 2 rows, both status CLOSED with resolution CONTINUE_OBSERVATION"
            - "ObservationOrder.${o6}.reassessment_count == 0"

      - name: sitter_assignment_documentation_dimension_moves_while_watch_status_frozen
        grounds:
          - state_machines.SitterAssignment.documentation_status.PENDING_to_HANDOFF_DRAFTED
          - state_machines.SitterAssignment.documentation_status.HANDOFF_DRAFTED_to_HANDOFF_SIGNED
          - state_machines.SitterAssignment.watch_status.SCHEDULED_to_ON_WATCH
          - entities.HandoffRecord.fields.countersigned_by_staff_id
        distinguishing_aspect: |
          Parallel state dimensions on one SitterAssignment row (a different entity from instance 1's
          ObservationOrder): documentation_status advances PENDING -> HANDOFF_DRAFTED -> HANDOFF_SIGNED
          across two calls while watch_status stays ON_WATCH for both, and only the later complete call
          moves the watch dimension — the two dimensions never move in the same request.
        test_recipe:
          setup:
            - "Unit UNIT-F budget 200000; admitted patient age 60; ACTIVE order for FALL risk."
            - "Two INTERNAL_FLOAT sitters at rate 2000 with ADVANCED competency, both homed on UNIT-F."
            - "Outgoing assignment 2026-08-01T08:00Z -> 16:00Z on the order; incoming assignment 2026-08-01T16:00Z -> 2026-08-02T00:00Z on the SAME order for the other sitter."
