            - "Hold.${hold11a}.delivery_days_credited == 2"
            - "Hold.${hold11b}.status == SCHEDULED"
            - "Hold.${hold11b}.delivery_days_credited == 1"
            - "Hold.${hold11b}.credit_cents == 225"
            - "Subscription.${sub11}.pending_credit_cents == 675"
            - "Subscription.${sub11}.vacation_days_used_365 == 15"

