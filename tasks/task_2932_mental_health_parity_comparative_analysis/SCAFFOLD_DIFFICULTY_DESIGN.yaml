scaffold_difficulty_design:

  # =========================================================================
  # §0.5 Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: qtl_predominant_level_plan_payments_versus_claims_count_diverge
        grounds:
          - calculations.qtl_predominant_level
          - calculations.qtl_substantially_all_ratio
          - calculations.mh_level_under_test
          - entities.ParityTest.fields.predominant_level
          - entities.ParityTest.fields.advisory_only
          - entities.PlanYear.fields.failing_parity_test_count
        distinguishing_aspect: |
          This variant pair lives in the quantitative-treatment-limitation domain (TreatmentLimitation
          weights rolled up onto a ParityTest): weighting the identical four medical/surgical COPAY
          levels by projected_plan_payments_cents takes the single-level branch and returns
          predominant_level 30 (result PASS), while weighting them by projected_claims_count takes the
          combination branch and returns predominant_level 20 (result FAIL).
        test_recipe:
          setup:
            - "One Administrator and one OPEN PlanYear with 1200 covered participants."
            - "One OUTPATIENT / IN_NETWORK / OFFICE_VISITS BenefitClassification."
            - "Four ACTIVE MEDICAL_SURGICAL COPAY rows: level 30 (5000000 cents / 400 claims), level 20 (3000000 / 400), level 10 (1000000 / 200) and level 0 (1500000 / 100), so the subject weights are 9000000 cents and 1000 claims against totals of 10500000 cents and 1100 claims."
            - "One ACTIVE MENTAL_HEALTH_SUD COPAY row at level 25."
          setup_api_calls:
            - call: "POST /parity/administrators"
              payload: { legal_name: "Northwind Benefit Administrators", contact_email: "ops@northwind.example", contractual_production_days: 45 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { adm_id: $.data.id }
            - call: "POST /parity/plan-years"
              payload: { plan_name: "Acme Group Health Plan", plan_year_label: "2026", administrator_id: "${adm_id}", funding_arrangement: "SELF_FUNDED", covered_participant_count: 1200, remediation_liability_cap_cents: 5000000 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { py_id: $.data.id }
            - call: "POST /parity/plan-years/${py_id}/classifications"
              payload: { benefit_category: "OUTPATIENT", network_tier: "IN_NETWORK", sub_classification: "OFFICE_VISITS", measurement_period_start: "2026-01-01", measurement_period_end: "2026-06-30", mh_su_benefits_covered: true }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { cls_id: $.data.id }
            - call: "POST /parity/classifications/${cls_id}/treatment-limitations"
              payload: { limitation_type: "COPAY", benefit_side: "MEDICAL_SURGICAL", level_value: 30, projected_plan_payments_cents: 5000000, projected_claims_count: 400 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
            - call: "POST /parity/classifications/${cls_id}/treatment-limitations"
              payload: { limitation_type: "COPAY", benefit_side: "MEDICAL_SURGICAL", level_value: 20, projected_plan_payments_cents: 3000000, projected_claims_count: 400 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
            - call: "POST /parity/classifications/${cls_id}/treatment-limitations"
              payload: { limitation_type: "COPAY", benefit_side: "MEDICAL_SURGICAL", level_value: 10, projected_plan_payments_cents: 1000000, projected_claims_count: 200 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
            - call: "POST /parity/classifications/${cls_id}/treatment-limitations"
              payload: { limitation_type: "COPAY", benefit_side: "MEDICAL_SURGICAL", level_value: 0, projected_plan_payments_cents: 1500000, projected_claims_count: 100 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
            - call: "POST /parity/classifications/${cls_id}/treatment-limitations"
              payload: { limitation_type: "COPAY", benefit_side: "MENTAL_HEALTH_SUD", level_value: 25, projected_plan_payments_cents: 900000, projected_claims_count: 120 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
          trigger:
            - call: "POST /parity/classifications/${cls_id}/parity-tests"
              payload: { limitation_type: "COPAY", basis: "PLAN_PAYMENTS" }
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
              captures: { test_pp_id: $.data.id }
            - call: "POST /parity/classifications/${cls_id}/parity-tests"
              payload: { limitation_type: "COPAY", basis: "CLAIMS_COUNT" }
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
              captures: { test_cc_id: $.data.id }
          assert:
            - "ParityTest.${test_pp_id}.total_ms_payments_cents == 10500000"
            - "ParityTest.${test_pp_id}.subject_payments_cents == 9000000"
            - "ParityTest.${test_pp_id}.substantially_all_ratio == 0.857143"
            - "ParityTest.${test_pp_id}.substantially_all_met == true"
            - "ParityTest.${test_pp_id}.predominant_level == 30"
            - "ParityTest.${test_pp_id}.mh_level_value == 25"
            - "ParityTest.${test_pp_id}.result == PASS"
            - "ParityTest.${test_pp_id}.advisory_only == false"
            - "ParityTest.${test_cc_id}.substantially_all_ratio == 0.909091"
            - "ParityTest.${test_cc_id}.substantially_all_met == true"
            - "ParityTest.${test_cc_id}.predominant_level == 20"
            - "ParityTest.${test_cc_id}.result == FAIL"
            - "ParityTest.${test_cc_id}.advisory_only == true"
            - "ParityTest.${test_pp_id}.status == COMPUTED and ParityTest.${test_cc_id}.status == COMPUTED (different basis, so neither supersedes the other)"
            - "PlanYear.${py_id}.failing_parity_test_count == 0 (the FAIL is advisory because basis == CLAIMS_COUNT)"
            - "PlanYear.${py_id}.compliance_posture == COMPLIANT"

      - name: administrator_cooperation_contract_versus_regulatory_basis_diverge
        grounds:
          - calculations.administrator_cooperation_score
          - entities.Administrator.fields.cooperation_score
          - entities.Administrator.fields.regulatory_basis_cooperation_score
          - entities.Administrator.fields.cooperation_status
          - entities.VendorDataRequest.fields.due_at
          - entities.VendorDataRequest.fields.regulatory_due_at
        distinguishing_aspect: |
          This variant pair lives in a different entity domain — vendor-cooperation scoring on the
          Administrator row rather than limitation weighting on a ParityTest: the same two unfulfilled
          production requests score 100.00 under CONTRACT_BASIS (45 contractual days, nothing late) and
          70.00 under REGULATORY_BASIS (30 statutory days, both late), and only the CONTRACT_BASIS
          result drives cooperation_status.
        test_recipe:
          setup:
            - "One Administrator with contractual_production_days 45."
            - "Two OPEN PlanYears under that administrator (two plan years keep the two production windows out of each other's (administrator_id, plan_year_id) overlap scope)."
            - "One OPEN VendorDataRequest per plan year, both issued at the default logical clock 2026-08-01T00:00:00Z, so due_at is 2026-09-15 and regulatory_due_at is 2026-08-31."
          setup_api_calls:
            - call: "POST /parity/administrators"
              payload: { legal_name: "Northwind Benefit Administrators", contact_email: "ops@northwind.example", contractual_production_days: 45 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { adm_id: $.data.id }
            - call: "POST /parity/plan-years"
              payload: { plan_name: "Acme Group Health Plan", plan_year_label: "2026", administrator_id: "${adm_id}", funding_arrangement: "SELF_FUNDED", covered_participant_count: 1200, remediation_liability_cap_cents: 5000000 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { py_a_id: $.data.id }
            - call: "POST /parity/plan-years"
              payload: { plan_name: "Acme Group Health Plan", plan_year_label: "2027", administrator_id: "${adm_id}", funding_arrangement: "SELF_FUNDED", covered_participant_count: 1250, remediation_liability_cap_cents: 5000000 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { py_b_id: $.data.id }
            - call: "POST /parity/vendor-requests"
              payload: { administrator_id: "${adm_id}", plan_year_id: "${py_a_id}", requested_item_count: 2, requested_submission_types: ["DENIAL_RATES", "NETWORK_COMPOSITION"] }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { vr_a_id: $.data.id }
            - call: "POST /parity/vendor-requests"
              payload: { administrator_id: "${adm_id}", plan_year_id: "${py_b_id}", requested_item_count: 1, requested_submission_types: ["REIMBURSEMENT_BENCHMARK"] }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { vr_b_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00Z" }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
            - call: "GET /parity/administrators/${adm_id}"
              payload: {}
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { contract_score: $.data.cooperation_score, regulatory_score: $.data.regulatory_basis_cooperation_score }
          assert:
            - "VendorDataRequest.${vr_a_id}.due_at == 2026-09-15T00:00:00.000Z"
            - "VendorDataRequest.${vr_a_id}.regulatory_due_at == 2026-08-31T00:00:00.000Z"
            - "VendorDataRequest.${vr_a_id}.is_overdue == false"
            - "VendorDataRequest.${vr_b_id}.is_overdue == false"
            - "Administrator.${adm_id}.late_request_count == 0"
            - "Administrator.${adm_id}.regulator_reportable_late_count == 2"
            - "Administrator.${adm_id}.cooperation_score == 100.00"
            - "Administrator.${adm_id}.regulatory_basis_cooperation_score == 70.00"
            - "Administrator.${adm_id}.cooperation_status == COOPERATIVE (derived from the CONTRACT_BASIS variant only)"
            - "Administrator.${adm_id}.outstanding_request_count == 2"
            - "PlanYear.${py_a_id}.compliance_posture == COMPLIANT"

  # =========================================================================
  # §0.5 Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: stringency_index_nested_min_max_with_asymmetry_multiplier
        grounds:
          - calculations.nqtl_stringency_in_operation_index
          - calculations.denial_rate_disparity_index
          - entities.NqtlItem.fields.stringency_in_operation_index
          - entities.NqtlItem.fields.stringency_flag
          - entities.DataSubmission.fields.network_composition_gap
        distinguishing_aspect: |
          Mode (a): five inputs (disparity evidence, network-gap evidence, nqtl_type weight pair,
          applied_to branch, and the factor/evidentiary documentation credit) interact non-linearly
          through max(0, D-1), a conditional 1.5x multiplier, min() credit capping and a final clamp,
          so the pinned order yields 8.45 while clamping before subtracting the credit yields 7.50 and
          an uncapped credit yields 7.45.
        test_recipe:
          setup:
            - "One Administrator, one OPEN PlanYear, one OUTPATIENT / IN_NETWORK / OFFICE_VISITS classification."
            - "One PRIOR_AUTHORIZATION NqtlItem applied_to MENTAL_HEALTH_SUD_ONLY (UM weights 0.6 / 0.4 and the 1.5x asymmetry multiplier)."
            - "One VALIDATED DENIAL_RATES submission for that classification with disparity_ratio 2.0298 and one VALIDATED NETWORK_COMPOSITION submission with network_composition_gap 0.2800."
            - "One DRAFT ComparativeAnalysis on the item with factor_count 4 and evidentiary_standard_count 5, so the raw documentation credit 0.35 is capped at 0.25."
          setup_api_calls:
            - call: "POST /parity/administrators"
              payload: { legal_name: "Northwind Benefit Administrators", contact_email: "ops@northwind.example", contractual_production_days: 45 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { adm_id: $.data.id }
            - call: "POST /parity/plan-years"
              payload: { plan_name: "Acme Group Health Plan", plan_year_label: "2026", administrator_id: "${adm_id}", funding_arrangement: "SELF_FUNDED", covered_participant_count: 1200, remediation_liability_cap_cents: 5000000 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { py_id: $.data.id }
            - call: "POST /parity/plan-years/${py_id}/classifications"
              payload: { benefit_category: "OUTPATIENT", network_tier: "IN_NETWORK", sub_classification: "OFFICE_VISITS", measurement_period_start: "2026-01-01", measurement_period_end: "2026-06-30", mh_su_benefits_covered: true }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { cls_id: $.data.id }
            - call: "POST /parity/nqtl-items"
              payload: { plan_year_id: "${py_id}", classification_id: "${cls_id}", nqtl_type: "PRIOR_AUTHORIZATION", applied_to: "MENTAL_HEALTH_SUD_ONLY", description: "Concurrent prior authorization required for all outpatient MH/SUD office visits." }
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
              captures: { item_id: $.data.id }
            - call: "POST /parity/vendor-requests"
              payload: { administrator_id: "${adm_id}", plan_year_id: "${py_id}", nqtl_item_id: "${item_id}", requested_item_count: 2, requested_submission_types: ["DENIAL_RATES", "NETWORK_COMPOSITION"] }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { vr_id: $.data.id }
            - call: "POST /parity/vendor-requests/${vr_id}/data-submissions"
              payload: { classification_id: "${cls_id}", submission_type: "DENIAL_RATES", mh_denials: 263, mh_adjudicated_claims: 3491, ms_denials: 71, ms_adjudicated_claims: 1913 }
              as: Administrator
              as_user_id: "${adm_id}"
              captures: { sub_dr_id: $.data.id }
            - call: "POST /parity/vendor-requests/${vr_id}/data-submissions"
              payload: { classification_id: "${cls_id}", submission_type: "NETWORK_COMPOSITION", mh_in_network_provider_pct: 0.34, ms_in_network_provider_pct: 0.62 }
              as: Administrator
              as_user_id: "${adm_id}"
              captures: { sub_nc_id: $.data.id }
            - call: "GET /parity/nqtl-items/${item_id}"
              payload: {}
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { item_v1: $.data.version }
          trigger:
            - call: "POST /parity/comparative-analyses"
              payload: { nqtl_item_id: "${item_id}", factor_count: 4, evidentiary_standard_count: 5, stringency_written_finding: "MORE_STRINGENT_MH", stringency_operation_finding: "MORE_STRINGENT_MH", expected_nqtl_item_version: "${item_v1}" }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { ca_id: $.data.id }
            - call: "GET /parity/nqtl-items/${item_id}"
              payload: {}
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { idx: $.data.stringency_in_operation_index }
          assert:
            - "DataSubmission.${sub_dr_id}.mh_denial_rate == 0.075337"
            - "DataSubmission.${sub_dr_id}.ms_denial_rate == 0.037114"
            - "DataSubmission.${sub_dr_id}.disparity_ratio == 2.0298"
            - "DataSubmission.${sub_dr_id}.as_applied_flag == true"
            - "DataSubmission.${sub_nc_id}.network_composition_gap == 0.2800"
            - "NqtlItem.${item_id}.stringency_in_operation_index == 8.45"
            - "NqtlItem.${item_id}.stringency_in_operation_index != 7.50 (the clamp-before-credit order)"
            - "NqtlItem.${item_id}.stringency_in_operation_index != 7.45 (the uncapped-documentation-credit order)"
            - "NqtlItem.${item_id}.stringency_flag == true"
            - "NqtlItem.${item_id}.status == ANALYSIS_DRAFTED"
            - "VendorDataRequest.${vr_id}.fulfillment_status == FULFILLED"

      - name: remediation_liability_rounded_per_plan_then_summed
        grounds:
          - calculations.remediation_liability_cents
          - entities.CorrectiveActionPlan.fields.reprocessing_liability_cents
          - entities.PlanYear.fields.remediation_liability_cents
          - state_machines.CorrectiveActionPlan.DRAFT_to_APPROVED
        distinguishing_aspect: |
          Mode (b): nested rounding where the order changes the cents. Two DESIGN_CHANGE plans whose
          raw liabilities are 1655432.50 and 878797.50 cents sum to 2534231 when each plan is rounded
          first (the pinned order) and to 2534230 when the raw products are summed and rounded once —
          a one-cent divergence that no threshold masks.
        test_recipe:
          setup:
            - "One Administrator, one OPEN PlanYear with remediation_liability_cap_cents 5000000, one classification."
            - "Two NqtlItems in the same classification (PRIOR_AUTHORIZATION and MEDICAL_NECESSITY_CRITERIA, both applied_to MENTAL_HEALTH_SUD_ONLY) each driven to VIOLATION by a shared VALIDATED DENIAL_RATES submission with disparity_ratio 3.0000."
            - "Two DRAFT CorrectiveActionPlans: DESIGN_CHANGE 1327 claims x 4990 cents and DESIGN_CHANGE 881 claims x 3990 cents."
            - "Determinations recorded by user-officer-01, so user-officer-02 must approve (segregation of duties)."
          setup_api_calls:
            - call: "POST /parity/administrators"
              payload: { legal_name: "Northwind Benefit Administrators", contact_email: "ops@northwind.example", contractual_production_days: 45 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { adm_id: $.data.id }
            - call: "POST /parity/plan-years"
              payload: { plan_name: "Acme Group Health Plan", plan_year_label: "2026", administrator_id: "${adm_id}", funding_arrangement: "SELF_FUNDED", covered_participant_count: 1200, remediation_liability_cap_cents: 5000000 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { py_id: $.data.id }
            - call: "POST /parity/plan-years/${py_id}/classifications"
              payload: { benefit_category: "OUTPATIENT", network_tier: "IN_NETWORK", sub_classification: "OFFICE_VISITS", measurement_period_start: "2026-01-01", measurement_period_end: "2026-06-30", mh_su_benefits_covered: true }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { cls_id: $.data.id }
            - call: "POST /parity/nqtl-items"
              payload: { plan_year_id: "${py_id}", classification_id: "${cls_id}", nqtl_type: "PRIOR_AUTHORIZATION", applied_to: "MENTAL_HEALTH_SUD_ONLY", description: "Prior authorization required for outpatient MH/SUD office visits." }
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
              captures: { item_a_id: $.data.id }
            - call: "POST /parity/nqtl-items"
              payload: { plan_year_id: "${py_id}", classification_id: "${cls_id}", nqtl_type: "MEDICAL_NECESSITY_CRITERIA", applied_to: "MENTAL_HEALTH_SUD_ONLY", description: "Proprietary MH/SUD medical necessity criteria applied to outpatient office visits." }
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
              captures: { item_b_id: $.data.id }
            - call: "POST /parity/vendor-requests"
              payload: { administrator_id: "${adm_id}", plan_year_id: "${py_id}", requested_item_count: 1, requested_submission_types: ["DENIAL_RATES"] }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { vr_id: $.data.id }
            - call: "POST /parity/vendor-requests/${vr_id}/data-submissions"
              payload: { classification_id: "${cls_id}", submission_type: "DENIAL_RATES", mh_denials: 300, mh_adjudicated_claims: 1000, ms_denials: 100, ms_adjudicated_claims: 1000 }
              as: Administrator
              as_user_id: "${adm_id}"
              captures: { sub_id: $.data.id }
            - call: "GET /parity/nqtl-items/${item_a_id}"
              payload: {}
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { item_a_v1: $.data.version }
            - call: "POST /parity/comparative-analyses"
              payload: { nqtl_item_id: "${item_a_id}", factor_count: 2, evidentiary_standard_count: 1, stringency_written_finding: "MORE_STRINGENT_MH", stringency_operation_finding: "MORE_STRINGENT_MH", expected_nqtl_item_version: "${item_a_v1}" }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { ca_a_id: $.data.id }
            - call: "POST /parity/comparative-analyses/${ca_a_id}/submit"
              payload: {}
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
            - call: "GET /parity/plan-years/${py_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
              captures: { py_v1: $.data.version }
            - call: "POST /parity/nqtl-items/${item_a_id}/determinations"
              payload: { outcome: "VIOLATION", rationale: "Prior authorization is applied more stringently in operation than to comparable medical/surgical benefits.", expected_plan_year_version: "${py_v1}" }
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
            - call: "GET /parity/nqtl-items/${item_b_id}"
              payload: {}
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { item_b_v1: $.data.version }
            - call: "POST /parity/comparative-analyses"
              payload: { nqtl_item_id: "${item_b_id}", factor_count: 2, evidentiary_standard_count: 1, stringency_written_finding: "MORE_STRINGENT_MH", stringency_operation_finding: "MORE_STRINGENT_MH", expected_nqtl_item_version: "${item_b_v1}" }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { ca_b_id: $.data.id }
            - call: "POST /parity/comparative-analyses/${ca_b_id}/submit"
              payload: {}
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
            - call: "GET /parity/plan-years/${py_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
              captures: { py_v2: $.data.version }
            - call: "POST /parity/nqtl-items/${item_b_id}/determinations"
              payload: { outcome: "VIOLATION", rationale: "Proprietary medical necessity criteria are applied more stringently in operation.", expected_plan_year_version: "${py_v2}" }
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
            - call: "POST /parity/corrective-action-plans"
              payload: { nqtl_item_id: "${item_a_id}", remedy_type: "DESIGN_CHANGE", affected_claims_count: 1327, average_claim_cents: 4990, target_completion_date: "2026-12-31" }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { cap_a_id: $.data.id }
            - call: "POST /parity/corrective-action-plans"
              payload: { nqtl_item_id: "${item_b_id}", remedy_type: "DESIGN_CHANGE", affected_claims_count: 881, average_claim_cents: 3990, target_completion_date: "2026-12-31" }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { cap_b_id: $.data.id }
          trigger:
            - call: "POST /parity/corrective-action-plans/${cap_a_id}/decision"
              payload: { outcome: "APPROVED", decision_note: "Design change approved by the independent reviewer." }
              as: ComplianceOfficer
              as_user_id: "user-officer-02"
            - call: "POST /parity/corrective-action-plans/${cap_b_id}/decision"
              payload: { outcome: "APPROVED", decision_note: "Design change approved by the independent reviewer." }
              as: ComplianceOfficer
              as_user_id: "user-officer-02"
          assert:
            - "CorrectiveActionPlan.${cap_a_id}.reprocessing_liability_cents == 1655433"
            - "CorrectiveActionPlan.${cap_b_id}.reprocessing_liability_cents == 878798"
            - "PlanYear.${py_id}.remediation_liability_cents == 2534231"
            - "PlanYear.${py_id}.remediation_liability_cents != 2534230 (the sum-then-round order)"
