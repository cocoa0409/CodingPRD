      - name: stale_version_occ_rejected_412
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_STALE_VERSION]", "concurrency_rules[site-agreement-create-stale-event]"]
        distinguishing_aspect: "Creating an agreement with expected_event_version one behind the current version is rejected with ERR_STALE_VERSION (412); retrying with the current version succeeds."
        test_recipe:
          setup: ["Event with version advanced to 2 after one mutation; client holds stale version 1"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { site_name: "Arena OCC", site_type: "ARENA", state_code: "TN", square_footage: 30000, has_loading_dock: true, power_capacity_kw: 200.0, sterilization_capable: true }
