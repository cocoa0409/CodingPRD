  # =======================================================================
  # RULE 4 - transitive_cascade
  # =======================================================================
  - rule_id: transitive_cascade
    instances:
      - name: plant_idle_cascades_four_hops_to_pit_formulation_run_and_clay_ledger
        grounds:
          - state_machines.Plant.ACTIVE_to_IDLED
          - state_machines.ClayPit.ACTIVE_to_SUSPENDED
          - state_machines.BodyFormulation.QUALIFIED_to_DRAFT
          - state_machines.ProductionRun.SETTING_to_SCRAPPED
          - calculations.clay_tonnage_commitment
        distinguishing_aspect: |
          The cascade originates at POST /plants/{id}/idle and travels DOWN the
          production side of the graph: plant -> clay pit -> body formulation ->
          production run -> clay ledger, with a second branch reaching the kiln run and
          unwinding a LOADED run back to SET. The other instance in this rule originates
          at POST /orders/{id}/cancel and travels down the ORDER side, and its fourth
          hop RELEASES inventory rather than releasing reserves.
