# =============================================================================
# Task 1749: Scaffold Difficulty Design (Test Targeting Index) — §1.8
# All recipes start from empty-DB with the default logical clock
# 2026-08-01T00:00:00Z unless a /v1/_clock/set_current_utc call says otherwise.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: event_participation_dual_metric
        grounds:
          - calculations.event_participation_metrics
          - entities.ErgEvent.fields.capacity_utilization_pct
          - entities.ErgEvent.fields.member_engagement_pct
        distinguishing_aspect: |
          Same completed event (checked_in_count=8) yields capacity_utilization_pct==20.00
          (denominator event.capacity=40) but member_engagement_pct==80.00 (denominator
          group.active_member_count=10): two valid participation interpretations on the
          ErgEvent domain produce different frozen numbers.
        test_recipe:
          setup:
            - "Program 2027 OPEN; group 'Women In Eng' (AFFINITY) ACTIVE with 10 founding members and sponsor assigned"
            - "Venue 'Main Hall' capacity 100; event 'Kickoff' WORKSHOP capacity 40 on 2026-08-10T10:00:00Z-12:00:00Z, PUBLISHED"
            - "8 employees (emp_e1..emp_e8) REGISTERED and CHECKED_IN; clock advanced to event end"
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { fiscal_year: 2027, pool_total_cents: 100000 }, as: DeiAdmin, captures: { pid: $.data.id } }
            - { call: "POST /v1/programs/${pid}/open", payload: {}, as: DeiAdmin }
            - { call: "POST /v1/sponsors", payload: { employee_id: "emp_sp1", max_groups: 3, max_mentees: 2 }, as: DeiAdmin, captures: { sp: $.data.id } }
            - { call: "POST /v1/groups", payload: { program_id: "${pid}", name: "Women In Eng", mission_statement: "Support women engineers", category: "AFFINITY" }, as: GroupLeader, as_user_id: "emp_lead1", captures: { g: $.data.id, gv: $.data.version } }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f01" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f02" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f03" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f04" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f05" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f06" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f07" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f08" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f09" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f10" }, as: DeiAdmin }
            - { call: "POST /v1/groups/${g}/assign-sponsor", payload: { sponsor_id: "${sp}", expected_group_version: "${gv}" }, as: DeiAdmin }
            - { call: "POST /v1/groups/${g}/submit-charter", payload: {}, as: GroupLeader, as_user_id: "emp_lead1" }
            - { call: "POST /v1/groups/${g}/sponsor-decision", payload: { decision: "ENDORSE" }, as: ExecutiveSponsor, as_user_id: "${sp}" }
            - { call: "POST /v1/groups/${g}/dei-decision", payload: { decision: "APPROVE" }, as: DeiAdmin }
            - { call: "POST /v1/venues", payload: { name: "Main Hall", capacity: 100 }, as: DeiAdmin, captures: { v: $.data.id } }
            - { call: "POST /v1/events", payload: { group_id: "${g}", venue_id: "${v}", title: "Kickoff", category: "WORKSHOP", starts_at: "2026-08-10T10:00:00Z", ends_at: "2026-08-10T12:00:00Z", capacity: 40 }, as: DeiAdmin, captures: { ev: $.data.id } }
            - { call: "POST /v1/events/${ev}/publish", payload: {}, as: DeiAdmin }
            - { call: "POST /v1/rsvps", payload: { event_id: "${ev}" }, as: Employee, as_user_id: "emp_e1", captures: { r1: $.data.id } }
            - { call: "POST /v1/rsvps", payload: { event_id: "${ev}" }, as: Employee, as_user_id: "emp_e2", captures: { r2: $.data.id } }
            - { call: "POST /v1/rsvps", payload: { event_id: "${ev}" }, as: Employee, as_user_id: "emp_e3", captures: { r3: $.data.id } }
            - { call: "POST /v1/rsvps", payload: { event_id: "${ev}" }, as: Employee, as_user_id: "emp_e4", captures: { r4: $.data.id } }
            - { call: "POST /v1/rsvps", payload: { event_id: "${ev}" }, as: Employee, as_user_id: "emp_e5", captures: { r5: $.data.id } }
            - { call: "POST /v1/rsvps", payload: { event_id: "${ev}" }, as: Employee, as_user_id: "emp_e6", captures: { r6: $.data.id } }
            - { call: "POST /v1/rsvps", payload: { event_id: "${ev}" }, as: Employee, as_user_id: "emp_e7", captures: { r7: $.data.id } }
            - { call: "POST /v1/rsvps", payload: { event_id: "${ev}" }, as: Employee, as_user_id: "emp_e8", captures: { r8: $.data.id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T10:00:00Z" }, as: DeiAdmin }
            - { call: "POST /v1/rsvps/${r1}/check-in", payload: {}, as: DeiAdmin }
            - { call: "POST /v1/rsvps/${r2}/check-in", payload: {}, as: DeiAdmin }
            - { call: "POST /v1/rsvps/${r3}/check-in", payload: {}, as: DeiAdmin }
            - { call: "POST /v1/rsvps/${r4}/check-in", payload: {}, as: DeiAdmin }
            - { call: "POST /v1/rsvps/${r5}/check-in", payload: {}, as: DeiAdmin }
            - { call: "POST /v1/rsvps/${r6}/check-in", payload: {}, as: DeiAdmin }
            - { call: "POST /v1/rsvps/${r7}/check-in", payload: {}, as: DeiAdmin }
            - { call: "POST /v1/rsvps/${r8}/check-in", payload: {}, as: DeiAdmin }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T12:00:00Z" }, as: DeiAdmin }
          trigger:
            - { call: "POST /v1/events/${ev}/complete", payload: {}, as: DeiAdmin, captures: { util: $.data.capacity_utilization_pct, eng: $.data.member_engagement_pct, pts: $.data.impact_points, low: $.data.low_attendance_flag } }
          assert:
            - "ErgEvent.${ev}.capacity_utilization_pct == 20.00"
            - "ErgEvent.${ev}.member_engagement_pct == 80.00"
            - "ErgEvent.${ev}.impact_points == 10 (WORKSHOP base 20 x 0.5 tier for utilization < 25, no sponsor bonus)"
            - "ErgEvent.${ev}.low_attendance_flag == true (20.00 < 25.00)"
            - "ErgEvent.${ev}.status == COMPLETED"

      - name: group_standing_provisional_vs_certified
        grounds:
          - calculations.group_standing_score
          - entities.ErgGroup.fields.certified_standing_score
          - entities.ErgGroup.fields.provisional_standing_score
        distinguishing_aspect: |
          Same group, same formula, two evaluation moments: certified_standing_score frozen
          at lock-allocation (members=10, growth 0) stays 0.00 while provisional_standing_score
          recomputed live after 10 more joins becomes 50.00 — dual-variant on the ErgGroup
          domain (distinct from the ErgEvent participation instance).
        test_recipe:
          setup:
            - "Program 2027 pool 100000 OPEN; group 'Beta Network' (PROFESSIONAL) ACTIVE with 10 founding members"
            - "Allocation locked (certifies standing); afterwards 10 additional members join (emp_g01..emp_g10)"
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { fiscal_year: 2027, pool_total_cents: 100000 }, as: DeiAdmin, captures: { pid: $.data.id } }
            - { call: "POST /v1/programs/${pid}/open", payload: {}, as: DeiAdmin }
            - { call: "POST /v1/sponsors", payload: { employee_id: "emp_sp2", max_groups: 3, max_mentees: 2 }, as: DeiAdmin, captures: { sp: $.data.id } }
            - { call: "POST /v1/groups", payload: { program_id: "${pid}", name: "Beta Network", mission_statement: "Professional growth", category: "PROFESSIONAL" }, as: GroupLeader, as_user_id: "emp_lead2", captures: { g: $.data.id, gv: $.data.version } }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f01" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f02" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f03" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f04" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f05" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f06" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f07" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f08" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f09" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f10" }, as: DeiAdmin }
            - { call: "POST /v1/groups/${g}/assign-sponsor", payload: { sponsor_id: "${sp}", expected_group_version: "${gv}" }, as: DeiAdmin }
            - { call: "POST /v1/groups/${g}/submit-charter", payload: {}, as: GroupLeader, as_user_id: "emp_lead2" }
            - { call: "POST /v1/groups/${g}/sponsor-decision", payload: { decision: "ENDORSE" }, as: ExecutiveSponsor, as_user_id: "${sp}" }
            - { call: "POST /v1/groups/${g}/dei-decision", payload: { decision: "APPROVE" }, as: DeiAdmin }
            - { call: "POST /v1/programs/${pid}/lock-allocation", payload: {}, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_g01" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_g02" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_g03" }, as: DeiAdmin }
