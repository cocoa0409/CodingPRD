              as: AdOps
            - call: "POST /adnet/line-items"
              payload: { campaign_id: "${cmp}", show_id: "${sh}", ad_format: "PRODUCED_SPOT", position: "MID_ROLL", reserved_impressions: 100, priority: 1, ad_copy_id: "${cpy}" }
              as: AdOps
              captures: { li: $.data.id }
          trigger:
            - call: "POST /adnet/line-items/${li}/transition"
              payload: { action: "ACTIVATE" }
              as: AdOps
            - call: "GET /adnet/shows/${sh}"
              as: AdOps
          assert:
            - "The ACTIVATE response body has status == ACTIVE (no delayed visibility)"
            - "The immediately following GET shows Show.${sh}.reserved_impressions == 100 and available_impressions == 9400"

