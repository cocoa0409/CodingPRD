          Priority 9 resolves body FKs after body shape (priority 5) and returns the
          referenced entity's own not-found error, not ERR_INVALID_REQUEST — a team
          pointing at a phantom season is 404 ERR_SEASON_NOT_FOUND, and a match
          pointing at a phantom home team is 404 ERR_TEAM_NOT_FOUND.
        test_recipe:
          setup:
