  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: change_order_supersede_releases_draws
        claim_type: conditional_action
        grounds: [state_machines.ChangeOrder.PROPOSED_to_SUPERSEDED, "endpoints.POST /api/projects/{id}/change-orders"]
        distinguishing_aspect: "Creating a second change order supersedes the existing PROPOSED one and releases its allowance reservation (remaining back to budget) — create-with-supersede side effect."
        test_recipe:
          setup: ["project INTAKE with AllowanceLine 100000; CO1 PROPOSED holding a 30000 reservation"]
          setup_api_calls:
            - { call: "POST /api/contractors", payload: { name: "GC E1", license_no: "LIC-E1" }, as: PlatformAdmin, captures: { ctr_id: $.data.id } }
            - { call: "POST /api/homeowners", payload: { name: "H E1", email: "he1@x.com", phone: "e1" }, as: Contractor, as_user_id: "${ctr_id}", captures: { ho_id: $.data.id } }
            - { call: "POST /api/projects", payload: { homeowner_id: "${ho_id}", address: "E1 St", basement_sqft: 800, base_contract_cents: 4000000 }, as: Contractor, as_user_id: "${ctr_id}", captures: { proj_id: $.data.id } }
            - { call: "POST /api/projects/${proj_id}/allowance-lines", payload: { name: "FIXTURES", budgeted_cents: 100000 }, as: Contractor, as_user_id: "${ctr_id}", captures: { al_id: $.data.id } }
            - { call: "GET /api/projects/${proj_id}", payload: {}, as: Contractor, as_user_id: "${ctr_id}", captures: { v1: $.data.version } }
            - { call: "POST /api/projects/${proj_id}/change-orders", payload: { scope_description: "vanity", kind: "ADD", scope_items: [{ description: "vanity", qty: 20, unit_cost_cents: 1500 }], allowance_draws: [{ allowance_line_id: "${al_id}", amount_cents: 30000 }], expected_project_version: "${v1}" }, as: Contractor, as_user_id: "${ctr_id}", captures: { co1: $.data.id } }
            - { call: "GET /api/projects/${proj_id}", payload: {}, as: Contractor, as_user_id: "${ctr_id}", captures: { v2: $.data.version } }
          trigger:
            - { call: "POST /api/projects/${proj_id}/change-orders", payload: { scope_description: "vanity plus mirror", kind: "ADD", scope_items: [{ description: "mirror", qty: 1, unit_cost_cents: 5000 }], allowance_draws: [], expected_project_version: "${v2}" }, as: Contractor, as_user_id: "${ctr_id}", captures: { co2: $.data.id } }
            - { call: "GET /api/projects/${proj_id}/change-orders", payload: {}, as: Contractor, as_user_id: "${ctr_id}" }
            - { call: "GET /api/projects/${proj_id}/allowance-lines", payload: {}, as: Contractor, as_user_id: "${ctr_id}" }
          assert:
            - "ChangeOrder.${co1}.status == SUPERSEDED; ChangeOrder.${co2}.status == PROPOSED"
            - "AllowanceLine.${al_id}: reserved_cents == 0 and remaining_cents == 100000 (supersede released the reservation)"
            - "exactly one PROPOSED change order exists after the second create"

      - name: suspension_cascade_side_effects
        claim_type: side_effect_execution
        grounds: [state_machines.Project.IN_PROGRESS_to_SUSPENDED]
        excluded_because: { difficulty_instance: strike_suspension_cascade, rationale: "All four cascade hops asserted there." }
      - name: certification_cascade_side_effects
        claim_type: side_effect_execution
        grounds: [state_machines.Inspection.REQUESTED_to_PASSED]
        excluded_because: { difficulty_instance: final_pass_certification_cascade, rationale: "Certificate/permit/project hops asserted there." }
      - name: computed_price_read_after_selection
        claim_type: computed_read
        grounds: ["endpoints.GET /api/projects/{id}"]
        excluded_because: { difficulty_instance: project_price_provisional_vs_final, rationale: "Pre/post selection price reads asserted there." }

