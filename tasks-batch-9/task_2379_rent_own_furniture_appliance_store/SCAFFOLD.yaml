  - method: POST
    path: /stores/{id}/day-close
    roles: [PlatformAdmin, StoreManager]
    input: {}
    output:
      store_id: string
      closed_at: datetime
      agreements_scanned: integer
      late_fees_assessed: integer
      late_fee_total_cents: integer
      windows_opened: integer
      windows_expired: integer
      agreements_defaulted: integer
      agreements_marked_adverse: integer
    side_effects:
      - "idempotent per (store, logical-clock instant): a second call at the same clock value re-scans the same agreements and finds every effect already applied, so agreements_scanned still reports the number of agreements inspected while every effect counter (late_fees_assessed, late_fee_total_cents, windows_opened, windows_expired, agreements_defaulted, agreements_marked_adverse) comes back 0 and no row changes"
      - "processes the store's agreements in created_at ASC order; within one agreement the order is fixed: (1) assess an unpaid overdue period's late fee, (2) open a ReinstatementWindow and flip payment_status CURRENT -> DELINQUENT, (3) expire an OPEN ReinstatementWindow whose expires_at is strictly before the clock, (4) on expiry flip payment_status DELINQUENT -> DEFAULTED and collections_stage to ADVERSE"
      - "each late fee assessed writes Agreement.late_fee_assessed_cents, late_fee_balance_cents and late_fee_period_index_last (calculations.late_fee_assessment)"
      - "each window opened writes Agreement.reinstatement_fee_assessed_cents / reinstatement_fee_balance_cents and increments Customer.lifetime_delinquency_count"
      - "each default sets Agreement.collections_stage = ADVERSE (it is already ADVERSE from the delinquency step, so no customer counter moves) and recomputes Customer.adverse_agreement_count as the number of that customer's agreements whose collections_stage == ADVERSE; one agreement is never counted twice"
    notes: "Ops-run checkpoint. Nothing in this scaffold advances a period, assesses a fee or opens a window except this endpoint and payment posting; time passing alone changes no row."

