          assert:
            - "off_window == 30 and sc_shares == 302500000 and proceeds_after_break == 30250000"
            - "nav_price == 1000 (round_half_up(30250000 * 10000 / 302500000))"
            - "p_capacity == 605000 (floor(30250000 * 200 / 10000) beats the 1512500-cent quarterly leg) and p_settled == 605000"
            - "RepurchaseRequest.${req_id}.status == \"PARTIALLY_FULFILLED\" with approved_shares_e4 == 6050000, early_repurchase_deduction_cents == 12100 and net_proceeds_cents == 592900"
            - "partial_error == \"ERR_LOT_PARTIALLY_REPURCHASED\" with response http status == 409"
            - "Sable's lot has remaining_shares_e4 == 293950000 against original_shares_e4 == 300000000 and status == \"OPEN\", and the clock's 2026-08-26 reading is still inside the 2026-08-31 window bound, so the priority-9 rescission-window rule could not pre-empt this priority-12 rule"
            - "Subscription.${sub_a_id}.status == \"ACCEPTED\" (the refused rescission changed nothing)"
            - "clean_status == \"RESCINDED\" with response http status == 200"
            - "Investor.${inv_b_id}.total_shares_e4 == 0 and Investor.${inv_b_id}.account_status == \"CLOSED_NO_POSITION\""
            - "Investor.${inv_a_id}.total_shares_e4 == 293950000 and Investor.${inv_a_id}.cumulative_early_repurchase_deduction_cents == 12100"
            - "final_proceeds == 30000000 and final_aggregate == 29395000"

      - name: breaking_escrow_below_the_minimum_offering_amount
        claim_type: violation_to_error
        grounds:
          - errors[ERR_MINIMUM_OFFERING_NOT_MET]
          - endpoints[POST /offerings/{offering_id}/escrow]
        excluded_because:
          difficulty_instance: escrow_break_at_exact_minimum_offering_threshold
          rationale: |
            The §1.8 instance already drives the break one cent below the
            minimum and asserts ERR_MINIMUM_OFFERING_NOT_MET, then breaks at
            exactly the threshold, so a breadth copy would repeat the identical
            fiscal gate on the identical endpoint.

      - name: accepting_shares_with_no_published_nav_for_the_class
        claim_type: violation_to_error
        grounds:
          - errors[ERR_NO_PUBLISHED_NAV]
          - endpoints[POST /subscriptions/{subscription_id}/status]
        excluded_because:
          difficulty_instance: subscription_acceptance_requires_published_nav_for_its_own_class
          rationale: |
            The §1.8 instance already shows that a sibling class's PUBLISHED NAV
            does not satisfy the gate and that the identical acceptance returns
            ERR_NO_PUBLISHED_NAV until the ticket's own class is priced.

      - name: rescinding_after_the_rescission_window_has_closed
        claim_type: violation_to_error
        grounds:
          - errors[ERR_RESCISSION_WINDOW_EXPIRED]
          - state_machines.Subscription.ACCEPTED_to_RESCINDED
        excluded_because:
          difficulty_instance: rescission_restores_share_and_proceeds_conservation
          rationale: |
            The §1.8 instance already rescinds inside the window, verifies the
            full compensating reversal, and then asserts
            ERR_RESCISSION_WINDOW_EXPIRED once the clock passes the window bound.

  # ===========================================================================
  - section: rbac
    instances:
      - name: each_exclusive_operation_refuses_every_other_role
        claim_type: exclusive_operations
        grounds:
          - roles.SponsorOperator.exclusive_operations
          - roles.ComplianceOfficer.exclusive_operations
          - roles.BoardCommittee.exclusive_operations
          - roles.InvestorUser.exclusive_operations
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: |
          Six operations owned exclusively by one role each return
          ERR_ROLE_NOT_PERMITTED at priority 2 when driven by a wrong role, before
          any state precondition is consulted, and the same calls succeed for their
          owning role.
        test_recipe:
          setup:
            - "Offering 'Quarrenden Income REIT' is EFFECTIVE with one class I; escrow is still COLLECTING and the repurchase plan is ACTIVE."
            - "A LISTING liquidity event sits at PROPOSED (its BOARD_APPROVE precondition escrow_status = BROKEN is deliberately unmet)."
            - "Investor Ulla Sorensen exists so an InvestorUser identity is available; an August period runs 2026-08-01T00:00:00Z to 2026-08-10T00:00:00Z settling 2026-08-12."
            - "The clock stays at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /offerings"
              payload: { name: "Quarrenden Income REIT", minimum_offering_amount_cents: 30000000, maximum_offering_amount_cents: 50000000000, escrow_deadline_date: "2026-12-31", initial_offering_price_cents: 1000 }
              as: SponsorOperator
              captures: { off_id: $.data.id }
            - call: "POST /share-classes"
              payload: { offering_id: "${off_id}", class_code: "I", upfront_selling_commission_bps: 0, dealer_manager_fee_bps: 0, annual_distribution_fee_bps: 0, distribution_fee_cap_bps: 0 }
              as: SponsorOperator
              captures: { sc_id: $.data.id }
            - call: "POST /offerings/${off_id}/registration"
              payload: { action: "DECLARE_EFFECTIVE" }
              as: ComplianceOfficer
            - call: "POST /liquidity-events"
