          rationale: "That instance shows adjudication refused while coordination is unsettled and succeeding after the same claim's axis 2 reaches a settled value, which is exactly the conditional-action claim for this endpoint."

  - section: errors
    instances:

      - name: duplicate_league_code_and_duplicate_sport_code_rejected
        claim_type: error_triggerable
        grounds:
          - errors.ERR_DUPLICATE_LEAGUE_CODE
          - errors.ERR_DUPLICATE_SPORT_CODE
          - validations.priority_33_duplicate_codes
        distinguishing_aspect: "Two separate global uniqueness scopes are probed with the same shape, and each must return its own error_id: a server collapsing both onto one generic conflict code, or scoping league_code per state_code, fails. The re-used codes differ from the originals only in case and surrounding whitespace nowhere: they are exact repeats, while a neighbouring distinct code still succeeds."
        test_recipe:
          setup:
            - "One league with league_code DPL-136 and one sport classification with sport_code BASEBALL_U12 already exist."
          setup_api_calls:
            - call: "POST /leagues"
              payload: { name: "Dunmore Baseball", league_code: "DPL-136", state_code: "CT", governing_body_code: "USYSA", contact_email: "admin@dpl.example" }
              as: ProgramAdministrator
              captures: { league_id: "$.data.id" }
            - call: "POST /sport-classifications"
              payload: { sport_code: "BASEBALL_U12", sport_name: "Baseball U12", hazard_class: "CLASS_2_MODERATE", base_rate_per_participant_cents: 1850, deductible_cents: 25000, per_injury_limit_cents: 2500000, cat_attachment_point_cents: 2500000, aggregate_limit_cents: 25000000, cat_lifetime_max_cents: 100000000, minimum_participants: 25, travel_buffer_minutes: 60, service_category_caps: { EMERGENCY_ROOM: 500000, SURGERY: 3000000, DIAGNOSTIC_IMAGING: 300000, PHYSICAL_THERAPY: 20000, DENTAL: 350000, AMBULANCE: 200000, PHYSICIAN_OFFICE: 50000 } }
              as: ProgramAdministrator
              captures: { sport_id: "$.data.id" }
          trigger:
            - call: "POST /leagues"
              payload: { name: "Dunmore Baseball North", league_code: "DPL-136", state_code: "NY", governing_body_code: "USYSA", contact_email: "north@dpl.example" }
              as: ProgramAdministrator
            - call: "POST /sport-classifications"
              payload: { sport_code: "BASEBALL_U12", sport_name: "Baseball U12 Recreational", hazard_class: "CLASS_1_LOW", base_rate_per_participant_cents: 1200, deductible_cents: 20000, per_injury_limit_cents: 1000000, cat_attachment_point_cents: 1000000, aggregate_limit_cents: 8000000, cat_lifetime_max_cents: 2000000, minimum_participants: 15, travel_buffer_minutes: 45, service_category_caps: { EMERGENCY_ROOM: 300000, SURGERY: 900000, DIAGNOSTIC_IMAGING: 150000, PHYSICAL_THERAPY: 15000, DENTAL: 120000, AMBULANCE: 90000, PHYSICIAN_OFFICE: 40000 } }
              as: ProgramAdministrator
            - call: "POST /leagues"
              payload: { name: "Dunmore Baseball South", league_code: "DPL-137", state_code: "CT", governing_body_code: "USYSA", contact_email: "south@dpl.example" }
              as: ProgramAdministrator
          assert:
            - "trigger call 1 returns HTTP 409 with data.error_id == ERR_DUPLICATE_LEAGUE_CODE, proving league_code is unique globally and not per state_code"
            - "trigger call 2 returns HTTP 409 with data.error_id == ERR_DUPLICATE_SPORT_CODE"
            - "trigger call 3 returns HTTP 201, so the uniqueness check is not rejecting every write in the namespace"
            - "GET /leagues returns meta.total_count == 2 and GET /sport-classifications returns meta.total_count == 1"

      - name: not_found_errors_are_per_entity_and_use_the_error_envelope
        claim_type: error_envelope
        grounds:
          - response_envelope
          - errors.ERR_LEAGUE_NOT_FOUND
          - errors.ERR_CLAIM_NOT_FOUND
          - errors.ERR_BENEFIT_PAYMENT_NOT_FOUND
        distinguishing_aspect: "Four reads on four well-formed but unknown UUIDs must each name their own entity in error_id and each must come back in the declared error envelope (response_type error, data.error_id, data.message, meta.api_request_id). A server with one shared ERR_NOT_FOUND, or one that returns a bare body without the envelope, fails."
        test_recipe:
          setup:
            - "An empty system: no fixture is required, because every probe addresses an identifier that was never minted."
          setup_api_calls: []
          trigger:
            - call: "GET /leagues/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /claims/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: ClaimsExaminer
            - call: "GET /benefit-payments/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: ClaimsExaminer
            - call: "GET /coordination-records/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: ClaimsExaminer
          assert:
            - "trigger call 1 returns HTTP 404 with data.error_id == ERR_LEAGUE_NOT_FOUND"
            - "trigger call 2 returns HTTP 404 with data.error_id == ERR_CLAIM_NOT_FOUND"
            - "trigger call 3 returns HTTP 404 with data.error_id == ERR_BENEFIT_PAYMENT_NOT_FOUND"
            - "trigger call 4 returns HTTP 404 with data.error_id == ERR_COORDINATION_RECORD_NOT_FOUND"
            - "every one of the four responses carries response_type == error, a non-empty string data.message, and a meta.api_request_id; none of them carries a data payload of entity fields"

