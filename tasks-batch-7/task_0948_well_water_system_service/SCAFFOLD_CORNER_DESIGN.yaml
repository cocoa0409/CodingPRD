        claim_type: Correct Result
        grounds: ["calculations.softener_design_grains", "calculations.softener_capacity_selection", "calculations.softener_monthly_salt_lbs", "calculations.treatment_recommendation_expires_at", "entities.TreatmentRecommendation.fields.selected_capacity"]
        distinguishing_aspect: |
          With household_size 4 the design grains are hardness * 4 * 75 * 7 =
          hardness * 2100, so hardness 10.0 gives 21000 -> CAP_24000 -> 6 lbs/regen ->
          round_half_up(6*30/7, 1) = 25.7 lbs/month; 15.0 gives 31500 -> CAP_32000 ->
          9 -> 38.6; 20.0 gives 42000 -> CAP_48000 -> 12 -> 51.4. All three sit BELOW
          the DUAL_TANK step-down, so the chain is strictly increasing here, and every
          expires_at is the WATER TEST's sample_datetime plus 180 days
          (2026-06-01T00:00:00Z -> 2026-11-28T00:00:00Z), never the recommendation's
          own created_at of 2026-06-02T09:00:00Z.
