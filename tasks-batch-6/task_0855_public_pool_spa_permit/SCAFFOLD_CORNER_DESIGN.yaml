              payload: { action: "ISSUE" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
          assert:
            - "The first ISSUE returns 409 with data.error_id == ERR_OPEN_CRITICAL_VIOLATIONS"
            - "Before the correction, Facility.${fac_id}.open_demerit_points == 10 and posture_reason == CRITICAL_VIOLATION_OPEN"
            - "After correction and verification, Facility.${fac_id}.open_demerit_points == 0 and the second ISSUE succeeds"
            - "Permit.${permit_id}.status == ISSUED and Operator.${op_id}.fee_balance_cents == 40000"

      - name: remaining_path_ids_return_their_own_not_found_codes
        claim_type: violation_to_error
        grounds:
          - errors[ERR_VIOLATION_NOT_FOUND]
          - errors[ERR_STAFF_ASSIGNMENT_NOT_FOUND]
          - errors[ERR_INSPECTION_NOT_FOUND]
          - errors[ERR_PLAN_REVIEW_NOT_FOUND]
          - errors[ERR_READING_NOT_FOUND]
        distinguishing_aspect: "Violation, StaffAssignment, Inspection, PlanReview and WaterChemistryReading each surface their own 404 code from the endpoints that address them."
        test_recipe:
          setup: ["A pool facility has an OPEN CHEMICAL closure order so the reopen-request endpoint is reachable; every id used below resolves to nothing."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Blue Lagoon Aquatics", contact_email: "ops@bluelagoon.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "Main Pool", facility_class: "CLASS_B_PUBLIC", surface_area_sqft: 1200, water_volume_gallons: 60000, max_depth_feet: 10, drain_count: 2 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { fac_id: $.data.id, fac_v: $.data.version }
            - call: "POST /closure-orders"
              payload: { facility_id: "${fac_id}", closure_reason: "CHEMICAL", expected_facility_version: "${fac_v}" }
              as: Inspector
              as_user_id: "insp-1"
              captures: { co_id: $.data.id }
          trigger:
            - call: "POST /violations/99999999-9999-4999-8999-999999999999/correct"
              payload: { correction_note: "n/a" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { e_violation: $.data.error_id }
            - call: "POST /staff-assignments/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa/cancel"
              payload: {}
              as: Operator
              as_user_id: "${op_id}"
              captures: { e_assignment: $.data.error_id }
            - call: "GET /inspections/bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb"
              payload: {}
              as: Inspector
              as_user_id: "insp-1"
              captures: { e_inspection: $.data.error_id }
            - call: "GET /plan-reviews/cccccccc-cccc-4ccc-8ccc-cccccccccccc"
              payload: {}
              as: PlanReviewer
              as_user_id: "pr-1"
              captures: { e_plan_review: $.data.error_id }
            - call: "POST /closure-orders/${co_id}/reopen-request"
              payload: { verification_reading_id: "dddddddd-dddd-4ddd-8ddd-dddddddddddd" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { e_reading: $.data.error_id }
          assert:
            - "All five responses are HTTP 404"
            - "error_ids are ERR_VIOLATION_NOT_FOUND, ERR_STAFF_ASSIGNMENT_NOT_FOUND, ERR_INSPECTION_NOT_FOUND, ERR_PLAN_REVIEW_NOT_FOUND and ERR_READING_NOT_FOUND respectively"
            - "ClosureOrder.${co_id}.status is still OPEN"

      - name: error_facility_closed_already_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_FACILITY_CLOSED]"]
        excluded_because:
          difficulty_instance: staff_assignment_facility_closed_outranks_shift_overlap
          rationale: "That §1.8 instance asserts ERR_FACILITY_CLOSED as the winning error on POST /staff-assignments."

      - name: error_inspection_window_conflict_already_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_INSPECTION_WINDOW_CONFLICT]"]
        excluded_because:
          difficulty_instance: inspection_buffered_closed_window_conflicts_at_exact_buffer_edge
          rationale: "That §1.8 instance triggers the conflict at the exact buffer edge and asserts the error id."

      - name: error_staff_shift_overlap_already_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_STAFF_SHIFT_OVERLAP]"]
        excluded_because:
          difficulty_instance: staff_shift_half_open_interval_touching_allowed_overlap_rejected
          rationale: "That §1.8 instance asserts the overlap rejection alongside the accepted touching shift."

      - name: reopen_approved_before_the_remediation_window_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=27]", "errors[ERR_REMEDIATION_INCOMPLETE]", calculations.reopen_remediation_window]
        distinguishing_aspect: "With the clock still at ordered_at, the 60-minute CHEMICAL window has not elapsed, so APPROVE returns ERR_REMEDIATION_INCOMPLETE (409) even though the verification reading is fresh and IN_RANGE."
        test_recipe:
          setup: ["A CHEMICAL closure order opened at 2026-05-01T00:00:00Z has a pending reopen request backed by an IN_RANGE reading sampled at the same instant; the clock has not moved."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Blue Lagoon Aquatics", contact_email: "ops@bluelagoon.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "Main Pool", facility_class: "CLASS_B_PUBLIC", surface_area_sqft: 1200, water_volume_gallons: 60000, max_depth_feet: 10, drain_count: 2 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { fac_id: $.data.id, fac_v: $.data.version }
            - call: "POST /closure-orders"
              payload: { facility_id: "${fac_id}", closure_reason: "CHEMICAL", expected_facility_version: "${fac_v}" }
              as: Inspector
              as_user_id: "insp-1"
              captures: { co_id: $.data.id }
            - call: "POST /facilities/${fac_id}/water-readings"
              payload: { sampled_at: "2026-05-01T00:00:00Z", source: "REOPEN_VERIFICATION", free_chlorine_ppm: 2.5, combined_chloramine_ppm: 0.1, ph: 7.4, water_temp_f: 82.0 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { rd_id: $.data.id }
            - call: "POST /closure-orders/${co_id}/reopen-request"
              payload: { verification_reading_id: "${rd_id}" }
              as: Operator
              as_user_id: "${op_id}"
          trigger:
            - call: "POST /closure-orders/${co_id}/reopen-decision"
              payload: { decision: "APPROVE" }
              as: Inspector
              as_user_id: "insp-2"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409 with data.error_id == ERR_REMEDIATION_INCOMPLETE"
            - "ClosureOrder.${co_id}.earliest_reopen_at == 2026-05-01T01:00:00.000Z while the clock reads 2026-05-01T00:00:00.000Z"
            - "ClosureOrder.${co_id}.status is still REOPEN_REQUESTED and cleared_at == null"
            - "WaterChemistryReading.${rd_id}.compliance_status == IN_RANGE, so the refusal is purely about the elapsed window"

      - name: plan_review_approve_without_starting_review_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=14]", "errors[ERR_INVALID_PLAN_REVIEW_STATE]", state_machines.PlanReview.UNDER_REVIEW_to_APPROVED]
        distinguishing_aspect: "APPROVE is declared only from UNDER_REVIEW, so approving a review still in SUBMITTED returns ERR_INVALID_PLAN_REVIEW_STATE (409) and leaves decided_by_user_id null."
        test_recipe:
          setup: ["A plan review has been filed and is still in SUBMITTED; no reviewer has picked it up."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Blue Lagoon Aquatics", contact_email: "ops@bluelagoon.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "Main Pool", facility_class: "CLASS_B_PUBLIC", surface_area_sqft: 1200, water_volume_gallons: 60000, max_depth_feet: 10, drain_count: 2 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { fac_id: $.data.id }
            - call: "POST /plan-reviews"
              payload: { facility_id: "${fac_id}", project_type: "ALTERATION", drawing_reference: "DR-7" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { pr_id: $.data.id, pr_v: $.data.version }
          trigger:
            - call: "POST /plan-reviews/${pr_id}/transition"
              payload: { action: "APPROVE" }
              as: PlanReviewer
              as_user_id: "pr-1"
              captures: { err_id: $.data.error_id }
            - call: "POST /plan-reviews/${pr_id}/revisions"
              payload: { expected_plan_review_version: "${pr_v}", drawing_reference: "DR-7-rev" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { err_id2: $.data.error_id }
          assert:
            - "The APPROVE returns 409 with data.error_id == ERR_INVALID_PLAN_REVIEW_STATE"
            - "PlanReview.${pr_id}.status == SUBMITTED with decided_at == null and decided_by_user_id == null"
            - "The revision attempt also returns 409 with data.error_id == ERR_INVALID_PLAN_REVIEW_STATE: the supplied version is current so the priority-12 OCC check passes, and the priority-14 state check then rejects it because revisions require CORRECTIONS_REQUIRED"
            - "GET /plan-reviews?supersedes_plan_review_id=${pr_id} returns zero rows"

  - section: cross_cutting_layers
    instances:

      - name: occ_stale_facility_version_rejected_on_closure_create
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[closure-create-stale-facility]", "errors[ERR_STALE_FACILITY_VERSION]", entities.Facility.fields.version]
        distinguishing_aspect: "A second closure order carrying the facility version read before the first order was filed is rejected with ERR_STALE_FACILITY_VERSION (412); re-reading the facility and resubmitting with the fresh version succeeds and advances the version again."
        test_recipe:
          setup: ["A pool facility at version 1 with no closure orders; one CHEMICAL order has just been filed against version 1."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Blue Lagoon Aquatics", contact_email: "ops@bluelagoon.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "Main Pool", facility_class: "CLASS_B_PUBLIC", surface_area_sqft: 1200, water_volume_gallons: 60000, max_depth_feet: 10, drain_count: 2 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { fac_id: $.data.id, fac_v1: $.data.version }
            - call: "POST /closure-orders"
              payload: { facility_id: "${fac_id}", closure_reason: "CHEMICAL", expected_facility_version: "${fac_v1}", note: "Acid spill" }
              as: Inspector
              as_user_id: "insp-1"
              captures: { co1_id: $.data.id }
          trigger:
            - call: "POST /closure-orders"
              payload: { facility_id: "${fac_id}", closure_reason: "EQUIPMENT", expected_facility_version: "${fac_v1}", note: "Pump failure noticed on the same visit" }
              as: Inspector
              as_user_id: "insp-1"
              captures: { err_id: $.data.error_id }
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: Inspector
              as_user_id: "insp-1"
              captures: { fac_v2: $.data.version }
            - call: "POST /closure-orders"
              payload: { facility_id: "${fac_id}", closure_reason: "EQUIPMENT", expected_facility_version: "${fac_v2}", note: "Pump failure noticed on the same visit" }
              as: Inspector
              as_user_id: "insp-1"
              captures: { co2_id: $.data.id }
          assert:
            - "The stale attempt returns 412 with data.error_id == ERR_STALE_FACILITY_VERSION and creates no row"
            - "${fac_v2} is greater than ${fac_v1} because the first closure order incremented Facility.version"
            - "The refreshed attempt returns 201 and ClosureOrder.${co2_id}.closure_reason == EQUIPMENT with status OPEN"
            - "After the second order, Facility.${fac_id}.version is greater than ${fac_v2}"
            - "GET /closure-orders?facility_id=${fac_id} returns exactly two rows, ${co1_id} and ${co2_id}"

      - name: occ_stale_plan_review_version_rejected_on_revision
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[plan-revision-stale-review]", "errors[ERR_STALE_PLAN_REVIEW_VERSION]", entities.PlanReview.fields.version]
        distinguishing_aspect: "A revision filed with the version the client observed at START_REVIEW is stale once REQUEST_CORRECTIONS has bumped the row, so it is rejected with ERR_STALE_PLAN_REVIEW_VERSION (412) and no superseding row is created."
        test_recipe:
          setup: ["A plan review was picked up for review (version captured at that point) and then returned with corrections, which bumped the version again."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Blue Lagoon Aquatics", contact_email: "ops@bluelagoon.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "Main Pool", facility_class: "CLASS_B_PUBLIC", surface_area_sqft: 1200, water_volume_gallons: 60000, max_depth_feet: 10, drain_count: 2 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { fac_id: $.data.id }
            - call: "POST /plan-reviews"
              payload: { facility_id: "${fac_id}", project_type: "NEW_CONSTRUCTION", drawing_reference: "DR-A" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { pr0_id: $.data.id }
            - call: "POST /plan-reviews/${pr0_id}/transition"
              payload: { action: "START_REVIEW" }
              as: PlanReviewer
              as_user_id: "pr-1"
              captures: { pr0_v_early: $.data.version }
            - call: "POST /plan-reviews/${pr0_id}/transition"
              payload: { action: "REQUEST_CORRECTIONS", correction_notes: "Add depth markers" }
              as: PlanReviewer
              as_user_id: "pr-1"
              captures: { pr0_v_now: $.data.version }
          trigger:
            - call: "POST /plan-reviews/${pr0_id}/revisions"
              payload: { expected_plan_review_version: "${pr0_v_early}", drawing_reference: "DR-A-rev1" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { err_id: $.data.error_id }
            - call: "POST /plan-reviews/${pr0_id}/revisions"
              payload: { expected_plan_review_version: "${pr0_v_now}", drawing_reference: "DR-A-rev1" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { pr1_id: $.data.id }
          assert:
            - "The stale attempt returns 412 with data.error_id == ERR_STALE_PLAN_REVIEW_VERSION"
            - "After the refusal PlanReview.${pr0_id}.status is still CORRECTIONS_REQUIRED and GET /plan-reviews?supersedes_plan_review_id=${pr0_id} returns zero rows"
            - "The refreshed attempt returns 201 with PlanReview.${pr1_id}.revision_round == 1"
            - "PlanReview.${pr0_id}.status == SUPERSEDED afterwards"
            - "Operator.${op_id}.fee_balance_cents == 50000 (the rejected revision posted no fee)"

      - name: hazard_trigger_suppressed_while_an_order_is_already_open
        claim_type: rate_threshold_triggers
        grounds: [calculations.water_reading_classification, state_machines.ClosureOrder.null_to_OPEN]
        distinguishing_aspect: "The IMMINENT_HAZARD trigger fires per reading but is suppressed while the facility already holds an OPEN or REOPEN_REQUESTED order, so a second hazardous reading records the classification without creating a duplicate order."
        test_recipe:
          setup: ["A pool facility whose first hazardous reading has already auto-opened a WATER_CHEMISTRY closure order."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Blue Lagoon Aquatics", contact_email: "ops@bluelagoon.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "Main Pool", facility_class: "CLASS_B_PUBLIC", surface_area_sqft: 1200, water_volume_gallons: 60000, max_depth_feet: 10, drain_count: 2 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { fac_id: $.data.id }
            - call: "POST /facilities/${fac_id}/water-readings"
              payload: { sampled_at: "2026-05-01T00:00:00Z", source: "OPERATOR_LOG", free_chlorine_ppm: 0.2, combined_chloramine_ppm: 0.1, ph: 7.4, water_temp_f: 82.0 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { rd1_id: $.data.id }
          trigger:
            - call: "POST /facilities/${fac_id}/water-readings"
              payload: { sampled_at: "2026-05-01T00:00:00Z", source: "OPERATOR_LOG", free_chlorine_ppm: 0.1, combined_chloramine_ppm: 0.1, ph: 6.4, water_temp_f: 82.0 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { rd2_id: $.data.id }
          assert:
            - "WaterChemistryReading.${rd2_id}.compliance_status == IMMINENT_HAZARD with out_of_range_parameters == [FREE_CHLORINE_LOW, PH_LOW]"
            - "WaterChemistryReading.${rd2_id}.triggered_closure_order_id == null"
            - "GET /closure-orders?facility_id=${fac_id} returns exactly one row, the order triggered by ${rd1_id}"

  - section: consistency_model
    instances:

      - name: cascade_effects_are_visible_in_the_same_request_response
        claim_type: immediate
        grounds: [calculations.facility_operating_posture, entities.WaterChemistryReading.fields.triggered_closure_order_id]
        distinguishing_aspect: "The consistency model is immediate: the water-reading 201 already carries triggered_closure_order_id, and the very next facility read shows CLOSED with no intervening reconciliation call."
        test_recipe:
          setup: ["A pool facility with an ISSUED permit and no open closure order."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Blue Lagoon Aquatics", contact_email: "ops@bluelagoon.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
