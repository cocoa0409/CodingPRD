        distinguishing_aspect: "Three re-scores on ONE assessment walk the threshold: min(b,w) == 1 -> UNCONDITIONAL, min(b,w) == 2 with b+w == 6 and d == 500 -> CONDITIONAL (the fall-through else), and the same scores with d == 900 and h == false -> INELIGIBLE; each re-score overwrites recommended_category rather than accumulating."
