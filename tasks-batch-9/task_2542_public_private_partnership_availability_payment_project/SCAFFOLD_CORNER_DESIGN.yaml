        grounds:
          - endpoints[POST /ppp/concessions]
          - validations[priority=30]
          - errors[ERR_INVALID_REQUEST]
          - entities.Concession.fields.indexation_pct
        distinguishing_aspect: |
          indexation_pct is a Decimal constrained to [0, 1]. 1.5 is well-formed JSON and
          would silently produce a 150%-indexed unitary charge, so the range check must
          reject it at priority 30 with ERR_INVALID_REQUEST rather than accepting it.
