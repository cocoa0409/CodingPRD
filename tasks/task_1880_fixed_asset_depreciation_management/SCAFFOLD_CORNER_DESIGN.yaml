          - "errors[ERR_ASSET_NOT_IN_SCOPE]"
        distinguishing_aspect: "A LOCATION-scoped run seeds only matching assets; counting an unseeded asset is rejected rather than creating an ad-hoc line."
        test_recipe:
          setup: ["Asset A-055 in PLANT-2 IN_SERVICE; run scope LOCATION scope_value PLANT-1 seeds zero lines"]
          setup_api_calls:
