          assert:
            - "est_early == 67063 (one second before the deadline -> early bird applies)"
            - "est_late == 65250 (rank1 after_sibling round_half_up(72500 * 0.90) = 65250 with NO early-bird factor — created_at exactly == deadline fails the strict < test; compare rank1-with-discount 60356)"

