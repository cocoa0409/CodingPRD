# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header is missing or malformed" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Caller role not permitted for this endpoint per RBAC matrix" }

  # --- Not Found ---
  - { id: ERR_TOUR_NOT_FOUND, http: 404, condition: "Tour id does not exist" }
  - { id: ERR_VENUE_NOT_FOUND, http: 404, condition: "Venue id does not exist" }
  - { id: ERR_AVAIL_NOT_FOUND, http: 404, condition: "DateAvail id does not exist on the venue" }
  - { id: ERR_POINT_NOT_FOUND, http: 404, condition: "RiggingPoint id does not exist on the venue" }
  - { id: ERR_ENGAGEMENT_NOT_FOUND, http: 404, condition: "Engagement id does not exist on the tour" }
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "RiggingPlan id does not exist on the engagement" }
  - { id: ERR_LABOR_CALL_NOT_FOUND, http: 404, condition: "LaborCall id does not exist on the engagement" }
  - { id: ERR_TRUCK_MOVE_NOT_FOUND, http: 404, condition: "TruckMove id does not exist on the engagement" }
  - { id: ERR_TICKET_SCALE_NOT_FOUND, http: 404, condition: "TicketScale id does not exist on the engagement" }
  - { id: ERR_SETTLEMENT_NOT_FOUND, http: 404, condition: "Settlement does not yet exist for the engagement (reconcile not called)" }
  - { id: ERR_LICENSE_NOT_FOUND, http: 404, condition: "LicenseAgreement id does not exist on the tour" }
  - { id: ERR_INSPECTION_NOT_FOUND, http: 404, condition: "SafetyInspection id does not exist on the engagement" }

  # --- Generic request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, invalid enum value, or wrong type on input payload" }

  # --- State preconditions ---
  - { id: ERR_TOUR_NOT_IN_PLANNING, http: 409, condition: "open-routing requires Tour.status == PLANNING" }
  - { id: ERR_TOUR_NOT_READY_TO_CLOSE, http: 409, condition: "close requires Tour.status == WRAP and all settlements/licenses in terminal-or-active states" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state-machine precondition failure" }
  - { id: ERR_ENGAGEMENT_NOT_IN_HOLD, http: 409, condition: "confirm requires Engagement.status == HOLD" }
  - { id: ERR_PLAN_NOT_SUBMITTED, http: 409, condition: "approve requires RiggingPlan.status == SUBMITTED" }
  - { id: ERR_LABOR_CALL_NOT_DRAFT, http: 409, condition: "post requires LaborCall.status == DRAFT" }
  - { id: ERR_AVAIL_NOT_OPEN, http: 409, condition: "release requires DateAvail.status == OPEN (or HELD for force-release)" }
  - { id: ERR_SETTLEMENT_NOT_RECONCILED, http: 409, condition: "mark-paid requires Settlement.status == RECONCILED" }
  - { id: ERR_LICENSE_NOT_DRAFT, http: 409, condition: "activate requires LicenseAgreement.status == DRAFT" }
  - { id: ERR_VENUE_INACTIVE, http: 409, condition: "Engagement confirm requires Venue.status == ACTIVE" }
  - { id: ERR_ENGAGEMENT_NOT_LABOR_READY, http: 409, condition: "LaborCall post requires Engagement.status IN {CONFIRMED, IN_LOAD}" }

  # --- Temporal / window ---
  - { id: ERR_HOLD_EXPIRED, http: 409, condition: "Logical clock >= engagement.hold_expires_at at confirm time" }
  - { id: ERR_ENGAGEMENT_WINDOW_OUT_OF_AVAIL, http: 422, condition: "load_in_at < opens_at OR load_out_at >= closes_at (half-open containment violated)" }
  - { id: ERR_INVALID_ENGAGEMENT_TIMES, http: 400, condition: "load_in_at >= first_show_at OR first_show_at >= load_out_at" }
  - { id: ERR_INVALID_AVAIL_WINDOW, http: 400, condition: "DateAvail opens_at >= closes_at" }
  - { id: ERR_AVAIL_OVERLAP, http: 409, condition: "New DateAvail overlaps an existing non-RELEASED avail on the venue (adjacency allowed)" }
  - { id: ERR_INSPECTION_WINDOW_INVALID, http: 422, condition: "Inspection scheduled_at not strictly after load_in_at and strictly before first_show_at" }
  - { id: ERR_MARKET_COOLDOWN_VIOLATION, http: 409, condition: "Confirm would violate Tour.market_cooldown_days for the venue" }
  - { id: ERR_NOT_ON_SALE_YET, http: 409, condition: "Clock < TicketScale.on_sale_at" }
  - { id: ERR_LATE_LABOR_CANCEL, http: 409, condition: "Cancel attempted within UNION_CANCEL_NOTICE_HOURS of call_start_at on a FILLED call" }
  - { id: ERR_TOO_LATE_TO_CANCEL, http: 409, condition: "Engagement CONFIRMED → CANCELLED attempted at or after load_in_at" }

  # --- Business safety / capacity ---
  - { id: ERR_POINT_CAPACITY_EXCEEDED, http: 422, condition: "Static or dynamic load exceeds the point's max (or sum across allocations exceeds)" }
  - { id: ERR_POINT_OUT_OF_SERVICE, http: 422, condition: "RiggingPlan approval references a point with status OUT_OF_SERVICE" }
  - { id: ERR_NEEDS_INDEPENDENT_REVIEW, http: 403, condition: "High-risk plan approved by the same X-User-ID that submitted it" }
  - { id: ERR_RIGGING_NOT_APPROVED, http: 409, condition: "mark-show-ready requires an APPROVED RiggingPlan" }
  - { id: ERR_INSPECTION_OUTSTANDING, http: 409, condition: "mark-show-ready requires every SafetyInspection in {PASSED, WAIVED}" }
  - { id: ERR_PERMIT_MISSING, http: 422, condition: "PYRO/ANIMAL/VEHICLE_STUNT inspection pass attempted without permit_number" }
  - { id: ERR_PYRO_NOT_WAIVABLE, http: 422, condition: "PYRO inspection may not transition to WAIVED" }
  - { id: ERR_WAIVE_REASON_REQUIRED, http: 400, condition: "waive attempted with empty waived_reason" }
  - { id: ERR_DOCK_CAPACITY_EXCEEDED, http: 422, condition: "TruckMove dock_doors_needed > Venue.load_in_dock_doors at dispatch" }
  - { id: ERR_EMPTY_RIGGING_PLAN, http: 422, condition: "RiggingPlan submit with zero allocations" }

  # --- Fiscal ---
  - { id: ERR_INSUFFICIENT_SEATS, http: 409, condition: "Ticket sale quantity > remaining seats (seats_allocated - seats_sold)" }
  - { id: ERR_GROUP_MIN_NOT_MET, http: 409, condition: "Group-sales order quantity < min_group_size" }
  - { id: ERR_UNRESOLVED_LABOR_CALLS, http: 409, condition: "Reconcile attempted with LaborCalls in {DRAFT, POSTED, FILLED}" }
  - { id: ERR_VENUE_HAS_OPEN_ENGAGEMENTS, http: 409, condition: "Venue deactivate blocked by engagements in non-terminal status" }

  # --- OCC ---
  - { id: ERR_STALE_AVAIL_VERSION, http: 412, condition: "expected_avail_version does not match DateAvail.version at engagement-create time" }
  - { id: ERR_STALE_SETTLEMENT_VERSION, http: 412, condition: "expected_settlement_version does not match Settlement.version at mark-paid time" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: TourManager
    description: "Owns tour routing, engagement confirmation/cancellation, settlement reconcile and payment, tour close"
    identity: opaque
    exclusive_operations:
      - "POST /tours"
      - "POST /tours/{tourId}/open-routing"
      - "POST /tours/{tourId}/close"
      - "POST /tours/{tourId}/engagements"
      - "POST /tours/{tourId}/engagements/{engagementId}/confirm"
      - "POST /tours/{tourId}/engagements/{engagementId}/cancel"
      - "POST /tours/{tourId}/engagements/{engagementId}/settlement/reconcile"
      - "POST /tours/{tourId}/engagements/{engagementId}/settlement/mark-paid"
      - "POST /tours/{tourId}/engagements/{engagementId}/settlement/resolve-dispute"
    shared_operations:
      - "GET endpoints across tours, venues, engagements, plans, allocations, calls, moves, scales, settlements, licenses, inspections"

  - name: VenueBooker
    description: "Owns venue registration, rigging-point declaration, date-avail declaration and release, settlement dispute"
    identity: opaque
    exclusive_operations:
      - "POST /venues"
      - "POST /venues/{venueId}/rigging-points"
      - "POST /venues/{venueId}/date-avails"
      - "POST /venues/{venueId}/date-avails/{availId}/release"
      - "POST /tours/{tourId}/engagements/{engagementId}/settlement/dispute"
    shared_operations:
      - "GET endpoints"

  - name: ProductionEngineer
    description: "Owns rigging plans, allocations, truck moves, mark-show-ready, mark-point-out-of-service"
    identity: opaque
    exclusive_operations:
      - "POST /tours/{tourId}/engagements/{engagementId}/rigging-plans"
      - "POST /tours/{tourId}/engagements/{engagementId}/rigging-plans/{planId}/submit"
      - "POST /tours/{tourId}/engagements/{engagementId}/rigging-plans/{planId}/approve"
      - "POST /tours/{tourId}/engagements/{engagementId}/rigging-plans/{planId}/reject"
      - "POST /tours/{tourId}/engagements/{engagementId}/rigging-plans/{planId}/revise"
      - "POST /tours/{tourId}/engagements/{engagementId}/rigging-plans/{planId}/allocations"
      - "POST /tours/{tourId}/engagements/{engagementId}/truck-moves"
      - "POST /tours/{tourId}/engagements/{engagementId}/truck-moves/{moveId}/dispatch"
      - "POST /tours/{tourId}/engagements/{engagementId}/truck-moves/{moveId}/mark-arrived"
      - "POST /tours/{tourId}/engagements/{engagementId}/truck-moves/{moveId}/cancel"
      - "POST /tours/{tourId}/engagements/{engagementId}/mark-show-ready"
      - "POST /venues/{venueId}/rigging-points/{pointId}/mark-out-of-service"
    shared_operations:
      - "GET endpoints"

  - name: LaborSteward
    description: "Owns labor calls (post, fill, settle, cancel)"
    identity: opaque
    exclusive_operations:
      - "POST /tours/{tourId}/engagements/{engagementId}/labor-calls"
      - "POST /tours/{tourId}/engagements/{engagementId}/labor-calls/{callId}/post"
      - "POST /tours/{tourId}/engagements/{engagementId}/labor-calls/{callId}/fill"
      - "POST /tours/{tourId}/engagements/{engagementId}/labor-calls/{callId}/settle"
      - "POST /tours/{tourId}/engagements/{engagementId}/labor-calls/{callId}/cancel"
    shared_operations:
      - "GET endpoints"

  - name: BoxOfficeManager
    description: "Owns ticket scales and ticket sales"
    identity: opaque
    exclusive_operations:
      - "POST /tours/{tourId}/engagements/{engagementId}/ticket-scales"
      - "POST /tours/{tourId}/engagements/{engagementId}/ticket-sales"
    shared_operations:
      - "GET endpoints"

  - name: LicensingManager
    description: "Owns license agreements"
    identity: opaque
    exclusive_operations:
      - "POST /tours/{tourId}/license-agreements"
      - "POST /tours/{tourId}/license-agreements/{licId}/activate"
      - "POST /tours/{tourId}/license-agreements/{licId}/terminate"
    shared_operations:
      - "GET endpoints"

  - name: ComplianceOfficer
    description: "Owns safety inspections"
    identity: opaque
    exclusive_operations:
      - "POST /tours/{tourId}/engagements/{engagementId}/safety-inspections"
      - "POST /tours/{tourId}/engagements/{engagementId}/safety-inspections/{inspId}/pass"
      - "POST /tours/{tourId}/engagements/{engagementId}/safety-inspections/{inspId}/fail"
      - "POST /tours/{tourId}/engagements/{engagementId}/safety-inspections/{inspId}/waive"
    shared_operations:
      - "GET endpoints"

  - name: PlatformAdmin
    description: "Super-user for venue deactivation, point out-of-service, clock control"
    identity: opaque
    exclusive_operations:
      - "POST /venues/{venueId}/deactivate"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET endpoints"
      - "POST /venues"
      - "POST /venues/{venueId}/rigging-points"
      - "POST /venues/{venueId}/rigging-points/{pointId}/mark-out-of-service"









