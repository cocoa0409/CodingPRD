              payload: { amount_cents: 12000 }
              as: ComplianceOfficer
              captures: { obl_status: $.data.status }
            - call: "GET /340b/covered-entities/${ce_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { posture: $.data.compliance_posture, open_cents: $.data.open_repayment_cents }
          assert:
            - "RepaymentObligation.${obl_id}.status == SETTLED and remaining_balance_cents == 0"
            - "CoveredEntity.${ce_id}.open_repayment_cents == 0"
            - "CoveredEntity.${ce_id}.compliance_posture == GOOD (flipped from FLAGGED by the settlement cascade)"

  # ==========================================================================
  # RULE 5 — Validation priority conflicts across different error-category pairs
  # ==========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_reverse_outranks_gpo_irrelevant
        grounds:
          - validations[priority=7]
          - validations[priority=10]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_DUPLICATE_DISCOUNT]
        distinguishing_aspect: |
          Pair {state (p7) vs business_safety (p10)}: a MedicaidClaim create against an already-REVERSED 340B
          dispense at a CARVE_OUT CE violates both the state precondition (dispense not DISPENSED) AND the
          duplicate-discount safety rule; the lower-priority state check (p7) wins -> ERR_INVALID_STATE, not
          ERR_DUPLICATE_DISCOUNT.
        test_recipe:
          setup:
            - "A CLASSIFIED_340B dispense at a CARVE_OUT CE, then reversed."
          setup_api_calls:
            - call: "POST /340b/covered-entities"
              payload: { hrsa_id: "DSH010008", legal_name: "PairA CE", entity_type: "FQHC", medicaid_billing_mode: "CARVE_OUT" }
              as: ComplianceOfficer
              captures: { ce_id: $.data.id }
            - call: "POST /340b/covered-entities/${ce_id}/approve"
              payload: {}
              as: HrsaAuditor
            - call: "POST /340b/drug-products"
              payload: { ndc: "00010-0010-10", drug_name: "KappaPair", package_size_units: 30, wac_price_per_unit_cents: 6000 }
              as: ComplianceOfficer
              captures: { dp_id: $.data.id }
            - call: "POST /340b/drug-products/${dp_id}/ceiling-prices"
              payload: { quarter: "2026Q2", amp_per_unit_cents: 4000, ura_per_unit_cents: 1500, is_published: true }
              as: ComplianceOfficer
            - call: "POST /340b/covered-entities/${ce_id}/prescribers"
              payload: { npi: "7777777777", full_name: "Dr Pair", relationship_type: "EMPLOYED" }
              as: ComplianceOfficer
              captures: { presc_id: $.data.id }
            - call: "POST /340b/covered-entities/${ce_id}/patients"
              payload: { mrn: "MRN-PAIR-1", has_ce_care_record: true, ce_retains_responsibility: true, medicaid_ffs_enrolled: true }
              as: ComplianceOfficer
              captures: { pat_id: $.data.id }
            - call: "POST /340b/dispenses"
              payload: { covered_entity_id: "${ce_id}", patient_id: "${pat_id}", prescriber_id: "${presc_id}", drug_product_id: "${dp_id}", quantity_units: 5, quarter: "2026Q2" }
              as: PharmacyOperator
              captures: { disp_id: $.data.id }
            - call: "POST /340b/dispenses/${disp_id}/reverse"
              payload: {}
              as: PharmacyOperator
          trigger:
            - call: "POST /340b/dispenses/${disp_id}/medicaid-claims"
              payload: { medicaid_state_code: "CA" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_STATE (state p7 outranks duplicate-discount safety p10)"
            - "HTTP status == 409"

      - name: cross_entity_referential_vs_ce_not_active_mismatch_outranks
        grounds:
          - validations[priority=5]
          - validations[priority=8]
          - errors[ERR_CROSS_ENTITY_MISMATCH]
          - errors[ERR_CE_NOT_ACTIVE]
        distinguishing_aspect: |
          Different pair {business_referential (p5) vs business_constraint (p8)}: a dispense whose prescriber
          belongs to a DIFFERENT CE AND whose own CE is not ACTIVE violates both; the lower-priority cross-entity
          referential check (p5) wins -> ERR_CROSS_ENTITY_MISMATCH, not ERR_CE_NOT_ACTIVE.
        test_recipe:
          setup:
            - "CE-A is PENDING (not active) with its own patient; CE-B is ACTIVE with an EMPLOYED prescriber; a published ceiling exists for the drug."
          setup_api_calls:
            - call: "POST /340b/covered-entities"
              payload: { hrsa_id: "DSH010009", legal_name: "PairB PendingCE", entity_type: "FQHC", medicaid_billing_mode: "CARVE_OUT" }
              as: ComplianceOfficer
              captures: { ce_a_id: $.data.id }
            - call: "POST /340b/covered-entities"
              payload: { hrsa_id: "DSH010010", legal_name: "PairB ActiveCE", entity_type: "FQHC", medicaid_billing_mode: "CARVE_OUT" }
              as: ComplianceOfficer
              captures: { ce_b_id: $.data.id }
            - call: "POST /340b/covered-entities/${ce_b_id}/approve"
              payload: {}
              as: HrsaAuditor
            - call: "POST /340b/drug-products"
              payload: { ndc: "00011-0011-11", drug_name: "LambdaPair", package_size_units: 30, wac_price_per_unit_cents: 6000 }
              as: ComplianceOfficer
              captures: { dp_id: $.data.id }
            - call: "POST /340b/drug-products/${dp_id}/ceiling-prices"
              payload: { quarter: "2026Q2", amp_per_unit_cents: 4000, ura_per_unit_cents: 1500, is_published: true }
              as: ComplianceOfficer
            - call: "POST /340b/covered-entities/${ce_b_id}/prescribers"
              payload: { npi: "8888888888", full_name: "Dr OtherCE", relationship_type: "EMPLOYED" }
              as: ComplianceOfficer
              captures: { presc_b_id: $.data.id }
            - call: "POST /340b/covered-entities/${ce_a_id}/patients"
              payload: { mrn: "MRN-PAIRB-1", has_ce_care_record: true, ce_retains_responsibility: true, medicaid_ffs_enrolled: false }
              as: ComplianceOfficer
              captures: { pat_a_id: $.data.id }
          trigger:
            - call: "POST /340b/dispenses"
              payload: { covered_entity_id: "${ce_a_id}", patient_id: "${pat_a_id}", prescriber_id: "${presc_b_id}", drug_product_id: "${dp_id}", quantity_units: 5, quarter: "2026Q2" }
              as: PharmacyOperator
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_CROSS_ENTITY_MISMATCH (cross-entity referential p5 outranks CE-not-active p8)"
            - "HTTP status == 409"

  # ==========================================================================
  # RULE 6 — Boundary-precision checks on different metrics/endpoints
  # ==========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: accumulator_package_threshold_29_vs_30_on_dispense
        grounds:
          - calculations.accumulator_replenishment
          - entities.Accumulator.fields.accrued_units
          - entities.Accumulator.fields.replenished_packages_total
        distinguishing_aspect: |
          Threshold metric on the POST /dispenses endpoint: accrued_units of 29 does NOT trigger replenishment
          (replenished_packages_total stays 0, accrued_units 29), whereas exactly 30 (== package_size, inclusive >=)
          DOES (replenished_packages_total 1, accrued_units 0).
        test_recipe:
          setup:
            - "Two parallel accumulators on package_size-30 NDCs: one fed a single 29-unit 340B dispense, the other a single 30-unit 340B dispense."
          setup_api_calls:
            - call: "POST /340b/covered-entities"
              payload: { hrsa_id: "DSH010011", legal_name: "Bound CE", entity_type: "FQHC", medicaid_billing_mode: "CARVE_OUT" }
              as: ComplianceOfficer
              captures: { ce_id: $.data.id }
            - call: "POST /340b/covered-entities/${ce_id}/approve"
              payload: {}
              as: HrsaAuditor
            - call: "POST /340b/drug-products"
              payload: { ndc: "00012-0012-12", drug_name: "MuBound29", package_size_units: 30, wac_price_per_unit_cents: 6000 }
              as: ComplianceOfficer
              captures: { dp29_id: $.data.id }
            - call: "POST /340b/drug-products/${dp29_id}/ceiling-prices"
              payload: { quarter: "2026Q2", amp_per_unit_cents: 4000, ura_per_unit_cents: 1500, is_published: true }
              as: ComplianceOfficer
            - call: "POST /340b/drug-products"
              payload: { ndc: "00013-0013-13", drug_name: "NuBound30", package_size_units: 30, wac_price_per_unit_cents: 6000 }
              as: ComplianceOfficer
              captures: { dp30_id: $.data.id }
            - call: "POST /340b/drug-products/${dp30_id}/ceiling-prices"
              payload: { quarter: "2026Q2", amp_per_unit_cents: 4000, ura_per_unit_cents: 1500, is_published: true }
              as: ComplianceOfficer
            - call: "POST /340b/covered-entities/${ce_id}/prescribers"
              payload: { npi: "9999999999", full_name: "Dr Bound", relationship_type: "EMPLOYED" }
              as: ComplianceOfficer
              captures: { presc_id: $.data.id }
            - call: "POST /340b/covered-entities/${ce_id}/patients"
              payload: { mrn: "MRN-BND-1", has_ce_care_record: true, ce_retains_responsibility: true, medicaid_ffs_enrolled: false }
              as: ComplianceOfficer
              captures: { pat_id: $.data.id }
            - call: "POST /340b/covered-entities/${ce_id}/accumulators"
              payload: { drug_product_id: "${dp29_id}" }
              as: ComplianceOfficer
              captures: { acc29_id: $.data.id }
            - call: "POST /340b/covered-entities/${ce_id}/accumulators"
              payload: { drug_product_id: "${dp30_id}" }
              as: ComplianceOfficer
              captures: { acc30_id: $.data.id }
          trigger:
            - call: "POST /340b/dispenses"
              payload: { covered_entity_id: "${ce_id}", patient_id: "${pat_id}", prescriber_id: "${presc_id}", drug_product_id: "${dp29_id}", quantity_units: 29, quarter: "2026Q2" }
              as: PharmacyOperator
            - call: "POST /340b/dispenses"
              payload: { covered_entity_id: "${ce_id}", patient_id: "${pat_id}", prescriber_id: "${presc_id}", drug_product_id: "${dp30_id}", quantity_units: 30, quarter: "2026Q2" }
              as: PharmacyOperator
            - call: "GET /340b/accumulators/${acc29_id}"
              payload: {}
              as: PharmacyOperator
              captures: { a29: $.data.accrued_units, p29: $.data.replenished_packages_total }
            - call: "GET /340b/accumulators/${acc30_id}"
              payload: {}
              as: PharmacyOperator
              captures: { a30: $.data.accrued_units, p30: $.data.replenished_packages_total }
          assert:
            - "Accumulator.${acc29_id}.accrued_units == 29 and replenished_packages_total == 0 (below threshold)"
            - "Accumulator.${acc30_id}.accrued_units == 0 and replenished_packages_total == 1 (>= threshold inclusive)"

      - name: penny_pricing_boundary_ura_equals_amp_on_ceiling_endpoint
        grounds:
          - calculations.ceiling_price
          - entities.CeilingPriceRecord.fields.pricing_variant
        distinguishing_aspect: |
          Different metric (URA vs AMP equality) on the POST /drug-products/{id}/ceiling-prices endpoint: ura == amp
          (3000 == 3000) is INCLUSIVE of penny pricing -> ceiling 1, PENNY; ura == amp-1 (2999 < 3000) is STANDARD ->
          ceiling 1 but variant STANDARD. The 1-cent value coincides yet the variant differs, isolating the boundary.
        test_recipe:
          setup:
            - "Two drug products: one ceiling record with amp 3000, ura 3000 (boundary equal); one with amp 3000, ura 2999."
          setup_api_calls:
            - call: "POST /340b/drug-products"
              payload: { ndc: "00014-0014-14", drug_name: "XiBoundEq", package_size_units: 30, wac_price_per_unit_cents: 5000 }
              as: ComplianceOfficer
              captures: { dp_eq_id: $.data.id }
            - call: "POST /340b/drug-products"
              payload: { ndc: "00015-0015-15", drug_name: "OmicronBoundLt", package_size_units: 30, wac_price_per_unit_cents: 5000 }
              as: ComplianceOfficer
              captures: { dp_lt_id: $.data.id }
          trigger:
            - call: "POST /340b/drug-products/${dp_eq_id}/ceiling-prices"
              payload: { quarter: "2026Q2", amp_per_unit_cents: 3000, ura_per_unit_cents: 3000, is_published: true }
              as: ComplianceOfficer
              captures: { cpr_eq_id: $.data.id }
            - call: "POST /340b/drug-products/${dp_lt_id}/ceiling-prices"
              payload: { quarter: "2026Q2", amp_per_unit_cents: 3000, ura_per_unit_cents: 2999, is_published: true }
              as: ComplianceOfficer
              captures: { cpr_lt_id: $.data.id }
          assert:
            - "CeilingPriceRecord.${cpr_eq_id}.ceiling_price_per_unit_cents == 1 and pricing_variant == PENNY (ura == amp inclusive)"
            - "CeilingPriceRecord.${cpr_lt_id}.ceiling_price_per_unit_cents == 1 and pricing_variant == STANDARD (ura == amp-1)"

  # ==========================================================================
  # RULE 7 — Cross-entity state dependencies across different entity pairs
  # ==========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: dispense_requires_covered_entity_active
        grounds:
          - state_machines.PrescriptionDispense.DISPENSED_to_DISPENSED
          - validations[priority=8]
          - entities.CoveredEntity.fields.registration_status
        distinguishing_aspect: |
          Pair Dispense->CoveredEntity: a dispense create is rejected with ERR_CE_NOT_ACTIVE while the covered
          entity is PENDING, and succeeds once the same CE is approved to ACTIVE — the dispense's validity depends
          on a sibling CoveredEntity field.
        test_recipe:
          setup:
            - "A PENDING CE with a published-ceiling drug, EMPLOYED prescriber, eligible patient (CE not yet approved)."
          setup_api_calls:
            - call: "POST /340b/covered-entities"
              payload: { hrsa_id: "DSH010012", legal_name: "Cross1 CE", entity_type: "FQHC", medicaid_billing_mode: "CARVE_OUT" }
              as: ComplianceOfficer
              captures: { ce_id: $.data.id }
            - call: "POST /340b/drug-products"
              payload: { ndc: "00016-0016-16", drug_name: "PiCross", package_size_units: 30, wac_price_per_unit_cents: 6000 }
              as: ComplianceOfficer
              captures: { dp_id: $.data.id }
            - call: "POST /340b/drug-products/${dp_id}/ceiling-prices"
              payload: { quarter: "2026Q2", amp_per_unit_cents: 4000, ura_per_unit_cents: 1500, is_published: true }
              as: ComplianceOfficer
            - call: "POST /340b/covered-entities/${ce_id}/prescribers"
              payload: { npi: "1010101010", full_name: "Dr Cross1", relationship_type: "EMPLOYED" }
              as: ComplianceOfficer
              captures: { presc_id: $.data.id }
            - call: "POST /340b/covered-entities/${ce_id}/patients"
              payload: { mrn: "MRN-X1-1", has_ce_care_record: true, ce_retains_responsibility: true, medicaid_ffs_enrolled: false }
              as: ComplianceOfficer
              captures: { pat_id: $.data.id }
          trigger:
            - call: "POST /340b/dispenses"
              payload: { covered_entity_id: "${ce_id}", patient_id: "${pat_id}", prescriber_id: "${presc_id}", drug_product_id: "${dp_id}", quantity_units: 5, quarter: "2026Q2" }
              as: PharmacyOperator
              captures: { err: $.data.error_id }
            - call: "POST /340b/covered-entities/${ce_id}/approve"
              payload: {}
              as: HrsaAuditor
            - call: "POST /340b/dispenses"
              payload: { covered_entity_id: "${ce_id}", patient_id: "${pat_id}", prescriber_id: "${presc_id}", drug_product_id: "${dp_id}", quantity_units: 5, quarter: "2026Q2" }
              as: PharmacyOperator
              captures: { disp_ok_id: $.data.id }
          assert:
            - "First dispense (CE PENDING) error_id == ERR_CE_NOT_ACTIVE (409)"
            - "Second dispense (CE ACTIVE) succeeds with classification_status == CLASSIFIED_340B"

      - name: recertify_blocked_by_open_audit_finding_posture
        grounds:
          - state_machines.CoveredEntity.RECERT_DUE_to_ACTIVE
          - entities.CoveredEntity.fields.compliance_posture
          - entities.AuditFinding.fields.finding_status
        distinguishing_aspect: |
          Different pair CoveredEntity->AuditFinding: recertify (RECERT_DUE->ACTIVE) is blocked while the CE's
          compliance_posture is FLAGGED by an OPEN AuditFinding, and succeeds once that finding is DISMISSED (posture
          back to GOOD) — recertification validity depends on a sibling AuditFinding's state.
        test_recipe:
          setup:
            - "ACTIVE CE flagged to RECERT_DUE; an OPEN HRSA_AUDIT finding against one of its dispenses keeps compliance_posture FLAGGED."
          setup_api_calls:
            - call: "POST /340b/covered-entities"
              payload: { hrsa_id: "DSH010013", legal_name: "Cross2 CE", entity_type: "FQHC", medicaid_billing_mode: "CARVE_OUT" }
              as: ComplianceOfficer
              captures: { ce_id: $.data.id }
            - call: "POST /340b/covered-entities/${ce_id}/approve"
              payload: {}
              as: HrsaAuditor
            - call: "POST /340b/drug-products"
              payload: { ndc: "00017-0017-17", drug_name: "RhoCross", package_size_units: 30, wac_price_per_unit_cents: 6000 }
              as: ComplianceOfficer
              captures: { dp_id: $.data.id }
            - call: "POST /340b/drug-products/${dp_id}/ceiling-prices"
              payload: { quarter: "2026Q2", amp_per_unit_cents: 4000, ura_per_unit_cents: 1500, is_published: true }
              as: ComplianceOfficer
            - call: "POST /340b/covered-entities/${ce_id}/prescribers"
              payload: { npi: "1212121212", full_name: "Dr Cross2", relationship_type: "EMPLOYED" }
              as: ComplianceOfficer
              captures: { presc_id: $.data.id }
            - call: "POST /340b/covered-entities/${ce_id}/patients"
              payload: { mrn: "MRN-X2-1", has_ce_care_record: true, ce_retains_responsibility: true, medicaid_ffs_enrolled: false }
              as: ComplianceOfficer
              captures: { pat_id: $.data.id }
            - call: "POST /340b/dispenses"
              payload: { covered_entity_id: "${ce_id}", patient_id: "${pat_id}", prescriber_id: "${presc_id}", drug_product_id: "${dp_id}", quantity_units: 6, quarter: "2026Q2" }
              as: PharmacyOperator
              captures: { disp_id: $.data.id }
            - call: "POST /340b/audit-findings"
              payload: { covered_entity_id: "${ce_id}", prescription_dispense_id: "${disp_id}", finding_type: "DIVERSION", assessed_units: 6 }
              as: HrsaAuditor
              captures: { af_id: $.data.id }
            - call: "POST /340b/covered-entities/${ce_id}/flag-recert"
              payload: {}
              as: HrsaAuditor
          trigger:
            - call: "POST /340b/covered-entities/${ce_id}/recertify"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
            - call: "POST /340b/audit-findings/${af_id}/dismiss"
              payload: {}
              as: HrsaAuditor
            - call: "POST /340b/covered-entities/${ce_id}/recertify"
              payload: {}
              as: ComplianceOfficer
              captures: { status_ok: $.data.registration_status, recert_idx: $.data.recert_period_index }
          assert:
            - "First recertify (finding OPEN, posture FLAGGED) error_id == ERR_INVALID_STATE (409)"
            - "After dismiss, second recertify succeeds: registration_status == ACTIVE and recert_period_index == 1"

  # ==========================================================================
  # RULE 8 — Resource temporal-overlap conflicts across different interval semantics
  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: contract_pharmacy_half_open_window_overlap_vs_adjacency
        grounds:
          - validations[priority=17]
          - entities.ContractPharmacyArrangement.fields.effective_start
          - entities.ContractPharmacyArrangement.fields.effective_end
          - errors[ERR_CP_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Half-open [start,end) interval semantics on ContractPharmacyArrangement: a second same-NPI arrangement
          whose window [2026-06-01, 2026-12-01) intersects an existing [2026-01-01, 2026-07-01) is rejected, but an
          ADJACENT window [2026-07-01, 2026-12-01) (start == existing.end) is allowed — touching endpoints do not
          collide under half-open arithmetic.
        test_recipe:
          setup:
            - "ACTIVE CE with one ACTIVE ContractPharmacyArrangement (npi 1234567890, window [2026-01-01, 2026-07-01))."
          setup_api_calls:
            - call: "POST /340b/covered-entities"
              payload: { hrsa_id: "DSH010014", legal_name: "Overlap1 CE", entity_type: "FQHC", medicaid_billing_mode: "CARVE_OUT" }
              as: ComplianceOfficer
              captures: { ce_id: $.data.id }
            - call: "POST /340b/covered-entities/${ce_id}/approve"
              payload: {}
              as: HrsaAuditor
            - call: "POST /340b/covered-entities/${ce_id}/contract-pharmacies"
              payload: { pharmacy_name: "MainRx", ship_to_bill_to_npi: "1234567890", effective_start: "2026-01-01", effective_end: "2026-07-01" }
              as: ComplianceOfficer
              captures: { cp1_id: $.data.id }
          trigger:
            - call: "POST /340b/covered-entities/${ce_id}/contract-pharmacies"
              payload: { pharmacy_name: "MainRxOverlap", ship_to_bill_to_npi: "1234567890", effective_start: "2026-06-01", effective_end: "2026-12-01" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
            - call: "POST /340b/covered-entities/${ce_id}/contract-pharmacies"
              payload: { pharmacy_name: "MainRxAdjacent", ship_to_bill_to_npi: "1234567890", effective_start: "2026-07-01", effective_end: "2026-12-01" }
              as: ComplianceOfficer
              captures: { cp_adj_id: $.data.id }
          assert:
            - "Overlapping window create error_id == ERR_CP_WINDOW_OVERLAP (409)"
            - "Adjacent window create (start == prior end) succeeds with arrangement_status == ACTIVE"

      - name: ceiling_quarter_degenerate_point_collision_published_only
        grounds:
          - validations[priority=18]
          - entities.CeilingPriceRecord.fields.quarter
          - entities.CeilingPriceRecord.fields.is_published
          - errors[ERR_CEILING_QUARTER_OVERLAP]
        distinguishing_aspect: |
          Degenerate closed-point [Q,Q] interval semantics on CeilingPriceRecord (a different resource entity and a
          different geometry from the half-open date window): a second PUBLISHED record for the same (NDC, quarter)
          collides on exact quarter equality, but a PROVISIONAL record for the same quarter never collides and may
          coexist with the published one.
        test_recipe:
          setup:
            - "A drug product with one published ceiling record for 2026Q2."
          setup_api_calls:
            - call: "POST /340b/drug-products"
              payload: { ndc: "00018-0018-18", drug_name: "SigmaQtr", package_size_units: 30, wac_price_per_unit_cents: 5000 }
              as: ComplianceOfficer
              captures: { dp_id: $.data.id }
            - call: "POST /340b/drug-products/${dp_id}/ceiling-prices"
              payload: { quarter: "2026Q2", amp_per_unit_cents: 4000, ura_per_unit_cents: 1500, is_published: true }
              as: ComplianceOfficer
              captures: { cpr_pub_id: $.data.id }
          trigger:
            - call: "POST /340b/drug-products/${dp_id}/ceiling-prices"
              payload: { quarter: "2026Q2", amp_per_unit_cents: 4100, ura_per_unit_cents: 1500, is_published: true }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
            - call: "POST /340b/drug-products/${dp_id}/ceiling-prices"
              payload: { quarter: "2026Q2", amp_per_unit_cents: 4200, ura_per_unit_cents: 1500, is_published: false }
              as: ComplianceOfficer
              captures: { cpr_prov_id: $.data.id }
          assert:
            - "Second published record for 2026Q2 error_id == ERR_CEILING_QUARTER_OVERLAP (409)"
            - "Provisional record for the same 2026Q2 succeeds (is_published == false; degenerate point collision applies to published-vs-published only)"

  # ==========================================================================
  # RULE 9 — Compensating-action invariants across different conserved quantities
  # ==========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: reverse_reinstate_conserves_accumulator_accrued_units
        grounds:
          - state_machines.PrescriptionDispense.DISPENSED_to_REVERSED
          - state_machines.PrescriptionDispense.REVERSED_to_DISPENSED
          - entities.Accumulator.fields.accrued_units
        distinguishing_aspect: |
          Conserved quantity = Accumulator.accrued_units (a unit count). A reverse debits accrued_units by the
          dispense quantity and the compensating reinstate re-credits it; the named invariant accrued_units == 17
          (after a prior 17-unit accrual) holds identically before and after the reverse+reinstate pair, with zero drift.
        test_recipe:
          setup:
            - "Accumulator at accrued_units=17 from prior 340B dispenses on a package_size-30 NDC, plus one fresh CLASSIFIED_340B dispense of 7 units pushing it to 24."
          setup_api_calls:
            - call: "POST /340b/covered-entities"
              payload: { hrsa_id: "DSH010015", legal_name: "Inv1 CE", entity_type: "FQHC", medicaid_billing_mode: "CARVE_OUT" }
              as: ComplianceOfficer
              captures: { ce_id: $.data.id }
            - call: "POST /340b/covered-entities/${ce_id}/approve"
              payload: {}
              as: HrsaAuditor
            - call: "POST /340b/drug-products"
              payload: { ndc: "00019-0019-19", drug_name: "TauInv", package_size_units: 30, wac_price_per_unit_cents: 6000 }
              as: ComplianceOfficer
              captures: { dp_id: $.data.id }
            - call: "POST /340b/drug-products/${dp_id}/ceiling-prices"
              payload: { quarter: "2026Q2", amp_per_unit_cents: 4000, ura_per_unit_cents: 1500, is_published: true }
              as: ComplianceOfficer
            - call: "POST /340b/covered-entities/${ce_id}/prescribers"
              payload: { npi: "1313131313", full_name: "Dr Inv1", relationship_type: "EMPLOYED" }
              as: ComplianceOfficer
              captures: { presc_id: $.data.id }
            - call: "POST /340b/covered-entities/${ce_id}/patients"
              payload: { mrn: "MRN-INV1-1", has_ce_care_record: true, ce_retains_responsibility: true, medicaid_ffs_enrolled: false }
              as: ComplianceOfficer
              captures: { pat_id: $.data.id }
            - call: "POST /340b/covered-entities/${ce_id}/accumulators"
              payload: { drug_product_id: "${dp_id}" }
              as: ComplianceOfficer
              captures: { acc_id: $.data.id }
            - call: "POST /340b/dispenses"
              payload: { covered_entity_id: "${ce_id}", patient_id: "${pat_id}", prescriber_id: "${presc_id}", drug_product_id: "${dp_id}", quantity_units: 17, quarter: "2026Q2" }
              as: PharmacyOperator
            - call: "POST /340b/dispenses"
              payload: { covered_entity_id: "${ce_id}", patient_id: "${pat_id}", prescriber_id: "${presc_id}", drug_product_id: "${dp_id}", quantity_units: 7, quarter: "2026Q2" }
              as: PharmacyOperator
              captures: { disp7_id: $.data.id }
          trigger:
            - call: "POST /340b/dispenses/${disp7_id}/reverse"
              payload: {}
              as: PharmacyOperator
            - call: "GET /340b/accumulators/${acc_id}"
              payload: {}
              as: PharmacyOperator
              captures: { accrued_mid: $.data.accrued_units }
            - call: "POST /340b/dispenses/${disp7_id}/reinstate"
              payload: {}
              as: PharmacyOperator
            - call: "GET /340b/accumulators/${acc_id}"
              payload: {}
              as: PharmacyOperator
              captures: { accrued_end: $.data.accrued_units }
          assert:
            - "After reverse: Accumulator.${acc_id}.accrued_units == 17"
            - "After reinstate (compensation undone): Accumulator.${acc_id}.accrued_units == 24 (no drift; conserved unit count restored)"

      - name: remit_then_waive_conserves_repayment_money_balance
        grounds:
          - state_machines.RepaymentObligation.OWED_to_PARTIALLY_PAID
          - state_machines.RepaymentObligation.OWED_to_WAIVED
          - entities.RepaymentObligation.fields.remaining_balance_cents
          - entities.CoveredEntity.fields.open_repayment_cents
        distinguishing_aspect: |
          Conserved quantity = money (CoveredEntity.open_repayment_cents in cents, a different conserved type from
          the accumulator's unit count). The invariant pinned is open_repayment_cents == sum over the CE's
          {OWED, PARTIALLY_PAID} obligations of remaining_balance_cents: after a partial remit of 5000 against a
          12000 obligation open_repayment_cents == 7000; after waiving the remainder it == 0 with no leftover drift.
        test_recipe:
          setup:
            - "ACTIVE CE with one CEILING_RECONCILIATION RepaymentObligation assessed 12000 (open_repayment_cents 12000)."
          setup_api_calls:
            - call: "POST /340b/covered-entities"
              payload: { hrsa_id: "DSH010016", legal_name: "Inv2 CE", entity_type: "FQHC", medicaid_billing_mode: "CARVE_OUT" }
              as: ComplianceOfficer
              captures: { ce_id: $.data.id }
            - call: "POST /340b/covered-entities/${ce_id}/approve"
              payload: {}
              as: HrsaAuditor
            - call: "POST /340b/drug-products"
              payload: { ndc: "00020-0020-20", drug_name: "UpsilonInv", package_size_units: 30, wac_price_per_unit_cents: 6000 }
              as: ComplianceOfficer
              captures: { dp_id: $.data.id }
            - call: "POST /340b/drug-products/${dp_id}/ceiling-prices"
              payload: { quarter: "2026Q2", amp_per_unit_cents: 4000, ura_per_unit_cents: 1500, is_published: true }
              as: ComplianceOfficer
            - call: "POST /340b/purchase-orders"
              payload: { covered_entity_id: "${ce_id}", drug_product_id: "${dp_id}", channel: "B340B", packages_ordered: 2, quarter: "2026Q2", unit_price_paid_cents: 2700 }
              as: PharmacyOperator
            - call: "GET /340b/drug-products/${dp_id}"
              payload: {}
              as: HrsaAuditor
              captures: { dp_ver: $.data.version }
            - call: "POST /340b/drug-products/${dp_id}/reconcile"
              payload: { quarter: "2026Q2", expected_drug_product_version: "${dp_ver}" }
              as: HrsaAuditor
              captures: { obl_id: $.data.id }
          trigger:
            - call: "POST /340b/repayment-obligations/${obl_id}/remit"
              payload: { amount_cents: 5000 }
              as: ComplianceOfficer
              captures: { st_partial: $.data.status, rem_partial: $.data.remaining_balance_cents }
            - call: "GET /340b/covered-entities/${ce_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { open_after_partial: $.data.open_repayment_cents }
            - call: "POST /340b/repayment-obligations/${obl_id}/waive"
              payload: {}
              as: HrsaAuditor
              captures: { st_waived: $.data.status, rem_waived: $.data.remaining_balance_cents }
            - call: "GET /340b/covered-entities/${ce_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { open_after_waive: $.data.open_repayment_cents }
          assert:
            - "After partial remit 5000: RepaymentObligation.${obl_id}.status == PARTIALLY_PAID, remaining_balance_cents == 7000, CoveredEntity.${ce_id}.open_repayment_cents == 7000"
            - "After waive: RepaymentObligation.${obl_id}.status == WAIVED, remaining_balance_cents == 0, CoveredEntity.${ce_id}.open_repayment_cents == 0 (money balance conserved to zero, no drift)"
