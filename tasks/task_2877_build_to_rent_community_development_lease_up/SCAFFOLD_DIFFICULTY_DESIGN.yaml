  - rule_id: transitive_cascade
    instances:
      - name: signature_cascade_propagates_four_hops_to_facility_conversion_pending
        grounds:
          - state_machines.Lease.contract.PENDING_SIGNATURE_to_EXECUTED
          - state_machines.Homesite.occupancy.AVAILABLE_to_LEASED
          - state_machines.Community.lifecycle.LEASE_UP_to_STABILIZED
          - state_machines.Community.facility.ADVANCE_ELIGIBLE_to_CONVERSION_PENDING
          - calculations.community_posture
          - entities.Community.fields.occupancy_ratio
        distinguishing_aspect: |
          One POST /leases/{id}/signature propagates through four distinct entities in a fixed order:
          hop 1 flips the Homesite to LEASED, hop 2 recomputes Phase.leased_homesite_count and
          Community.occupancy_ratio to 0.7500, hop 3 moves Community.lifecycle_status LEASE_UP ->
          STABILIZED because that ratio reached the 0.7500 gate, and hop 4 moves
          Community.facility_status ADVANCE_ELIGIBLE -> CONVERSION_PENDING because hop 3 fired. The
          identical call on the second lease (ratio 0.5000) stops after hop 2, proving hops 3 and 4 are
          consequences of hop 2's recomputed value rather than of the endpoint itself.
        test_recipe:
          setup:
            - "Community 'Ivyhurst' with total_planned_units 4, product_mix {DETACHED: 4, COTTAGE: 0, TOWNHOME: 0}, plat APPROVED, posture OPEN, lifecycle_status LEASE_UP, facility_status ADVANCE_ELIGIBLE."
