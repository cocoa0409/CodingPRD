            - "PriceChangeRequest.${pcr_id}.baseline_price_cents == 559"
            - "PriceChangeRequest.${pcr_id}.uplift_bp == 376"
            - "PriceChangeRequest.${pcr_id}.required_approvals == 1 (was 2 on revision_round 0)"

      - name: bundle_fork_join_requires_both_branches_complete
        grounds:
          - state_machines.ContentBundle.DRAFT_to_VALIDATING
          - state_machines.ContentBundle.VALIDATING_to_VALIDATED
          - state_machines.ContentBundle.VALIDATED_to_VALIDATED
          - state_machines.ContentBundle.VALIDATED_to_PUBLISHED
