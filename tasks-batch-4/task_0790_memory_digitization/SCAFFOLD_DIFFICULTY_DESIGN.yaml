scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: order_estimate_vs_final_total_diverge
        grounds:
          - calculations.order_total
          - calculations.order_subtotal
          - entities.Order.fields.estimate_total_cents
          - entities.Order.fields.final_total_cents
          - state_machines.DamageClaim.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          On the ORDER cost domain, estimate_total_cents is frozen from declared counts at creation
          (2 tapes -> 2400) while final_total_cents recomputes from surviving MediaItems after a
          write-off (1 tape -> 1200); the two persisted fields hold different values.
        test_recipe:
          setup:
            - "Customer with an order declaring 2 tapes; 2 tape MediaItems logged and both driven to OUTPUT_READY (order READY, payment CAPTURED)."
            - "One tape item is written off via an approved damage claim, triggering the final recompute."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "dv1@x.com", full_name: "DV1", state_code: "CA" }
              as: Admin
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", plan_tier: "STANDARD_KIT", turnaround: "STANDARD", output_option: "CLOUD", declared_tape_count: 2 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/authorize-payment"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${ord_id}/capture-payment"
              payload: {}
              as: Admin
            - call: "POST /orders/${ord_id}/receive"
              payload: {}
              as: IntakeTech
            - call: "POST /storage-bins"
              payload: { label: "DV1B", capacity: 10 }
              as: Admin
              captures: { bin_id: $.data.id }
            - call: "POST /orders/${ord_id}/media-items"
              payload: { media_type: "TAPE", bin_id: "${bin_id}" }
              as: IntakeTech
              captures: { mi1: $.data.id }
            - call: "POST /orders/${ord_id}/media-items"
              payload: { media_type: "TAPE", bin_id: "${bin_id}" }
              as: IntakeTech
              captures: { mi2: $.data.id }
            - call: "POST /machines"
              payload: { name: "DV1M", kind: "TAPE_DECK" }
              as: Admin
              captures: { machine_id: $.data.id }
            - call: "POST /batches"
              payload: { machine_id: "${machine_id}", scheduled_start: "2026-03-01T09:00:00Z", scheduled_end: "2026-03-01T10:00:00Z" }
              as: LabTech
              captures: { batch_id: $.data.id }
            - call: "POST /batches/${batch_id}/load"
              payload: { media_item_id: "${mi1}" }
              as: LabTech
            - call: "POST /batches/${batch_id}/load"
              payload: { media_item_id: "${mi2}" }
              as: LabTech
            - call: "POST /batches/${batch_id}/run"
              payload: {}
              as: LabTech
            - call: "POST /media-items/${mi1}/complete-scan"
              payload: { digitized_minutes: 30 }
              as: LabTech
            - call: "POST /media-items/${mi1}/qc-review"
              payload: { decision: "PASS" }
              as: LabTech
            - call: "POST /media-items/${mi2}/complete-scan"
              payload: { digitized_minutes: 30 }
              as: LabTech
            - call: "POST /media-items/${mi2}/qc-review"
              payload: { decision: "PASS" }
              as: LabTech
            - call: "POST /damage-claims"
              payload: { order_id: "${ord_id}", media_item_id: "${mi1}", claim_type: "LOST" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /damage-claims/${claim_id}/review"
              payload: { decision: "APPROVE" }
              as: ClaimsAdjuster
          assert:
            - "Order.${ord_id}.estimate_total_cents == 2400"
            - "Order.${ord_id}.final_total_cents == 1200"
            - "Order.${ord_id}.estimate_total_cents != Order.${ord_id}.final_total_cents"

      - name: customer_risk_provisional_vs_settled_diverge
        grounds:
          - calculations.customer_risk_score
          - entities.Customer.fields.risk_score
          - entities.Customer.fields.approved_claim_count
          - entities.Customer.fields.pending_claim_count
        distinguishing_aspect: |
          On the CUSTOMER risk domain, the persisted settled risk_score counts only APPROVED claims
          (20*1 = 20) and ignores the one still-open SUBMITTED claim, whereas the provisional variant
          would include it (20*1 + 5*1 = 25); risk_score holds 20, not 25.
        test_recipe:
          setup:
            - "Customer with two orders each holding one tape item; two claims filed, one APPROVED and one left SUBMITTED."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "dv2@x.com", full_name: "DV2", state_code: "CA" }
              as: Admin
              captures: { cust_id: $.data.id }
            - call: "POST /storage-bins"
              payload: { label: "DV2B", capacity: 10 }
              as: Admin
              captures: { bin_id: $.data.id }
            - call: "POST /machines"
              payload: { name: "DV2M", kind: "TAPE_DECK" }
              as: Admin
              captures: { machine_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", plan_tier: "STANDARD_KIT", turnaround: "STANDARD", output_option: "CLOUD", declared_tape_count: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_a: $.data.id }
            - call: "POST /orders/${ord_a}/authorize-payment"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${ord_a}/capture-payment"
              payload: {}
              as: Admin
            - call: "POST /orders/${ord_a}/receive"
              payload: {}
              as: IntakeTech
            - call: "POST /orders/${ord_a}/media-items"
              payload: { media_type: "TAPE", bin_id: "${bin_id}" }
              as: IntakeTech
              captures: { mi_a: $.data.id }
            - call: "POST /batches"
              payload: { machine_id: "${machine_id}", scheduled_start: "2026-03-01T09:00:00Z", scheduled_end: "2026-03-01T10:00:00Z" }
              as: LabTech
              captures: { batch_a: $.data.id }
            - call: "POST /batches/${batch_a}/load"
              payload: { media_item_id: "${mi_a}" }
              as: LabTech
            - call: "POST /batches/${batch_a}/run"
              payload: {}
              as: LabTech
            - call: "POST /media-items/${mi_a}/complete-scan"
              payload: { digitized_minutes: 30 }
              as: LabTech
            - call: "POST /media-items/${mi_a}/qc-review"
              payload: { decision: "PASS" }
              as: LabTech
            - call: "POST /damage-claims"
              payload: { order_id: "${ord_a}", media_item_id: "${mi_a}", claim_type: "LOST" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_a: $.data.id }
            - call: "POST /damage-claims/${claim_a}/review"
              payload: { decision: "APPROVE" }
              as: ClaimsAdjuster
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", plan_tier: "STANDARD_KIT", turnaround: "STANDARD", output_option: "CLOUD", declared_tape_count: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_b: $.data.id }
            - call: "POST /orders/${ord_b}/authorize-payment"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${ord_b}/receive"
              payload: {}
              as: IntakeTech
            - call: "POST /orders/${ord_b}/media-items"
              payload: { media_type: "TAPE", bin_id: "${bin_id}" }
              as: IntakeTech
              captures: { mi_b: $.data.id }
          trigger:
            - call: "POST /damage-claims"
              payload: { order_id: "${ord_b}", media_item_id: "${mi_b}", claim_type: "DAMAGED" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_b: $.data.id }
          assert:
            - "Customer.${cust_id}.approved_claim_count == 1"
            - "Customer.${cust_id}.pending_claim_count == 1"
            - "Customer.${cust_id}.risk_score == 20"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: tiered_volume_discount_mode_a
        grounds:
          - calculations.order_subtotal
          - calculations.order_total
          - entities.Order.fields.estimate_total_cents
        distinguishing_aspect: |
          MODE (a) tiered-rate selection with a nonlinear branch on item_count: 20 tape items
          crosses VOL_TIER_1_MIN_ITEMS so a 10% discount applies (24000 - 2400 = 21600).
        test_recipe:
          setup:
            - "One order declaring exactly 20 tapes, STANDARD, no protection, no promo."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "cf1@x.com", full_name: "CF1", state_code: "CA" }
              as: Admin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", plan_tier: "STANDARD_KIT", turnaround: "STANDARD", output_option: "CLOUD", declared_tape_count: 20 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
          assert:
            - "Order.${ord_id}.estimate_total_cents == 21600"

      - name: promo_evaluation_order_mode_c
        grounds:
          - calculations.order_total
          - entities.Order.fields.estimate_total_cents
        distinguishing_aspect: |
          MODE (c) pinned evaluation order: the SAVE5 promo band is selected from pre_discount_total
          (13740 -> 1000), NOT from the subtotal (12000 -> 500); total = 13740 - 1000 = 12740.
          Keying the band off the subtotal would wrongly yield 13240.
        test_recipe:
          setup:
            - "One order declaring 10 tapes, STANDARD, protection ON, promo_code SAVE5."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "cf2@x.com", full_name: "CF2", state_code: "CA" }
              as: Admin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", plan_tier: "STANDARD_KIT", turnaround: "STANDARD", output_option: "CLOUD", lost_damage_protection: true, promo_code: "SAVE5", declared_tape_count: 10 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
          assert:
            - "Order.${ord_id}.estimate_total_cents == 12740"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: order_parallel_payment_and_fulfillment_axes
        grounds:
          - state_machines.Order
          - entities.Order.fields.payment_status
          - entities.Order.fields.fulfillment_status
        distinguishing_aspect: |
          The two axes on ORDER evolve independently: capture-payment advances payment_status to
          CAPTURED while leaving fulfillment_status at AWAITING_MEDIA (unchanged by the payment axis).
        test_recipe:
          setup:
            - "Order authorized (payment AUTHORIZED, fulfillment AWAITING_MEDIA), then captured without any fulfillment progress."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "sm1@x.com", full_name: "SM1", state_code: "CA" }
              as: Admin
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", plan_tier: "STANDARD_KIT", turnaround: "STANDARD", output_option: "CLOUD", declared_tape_count: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/authorize-payment"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /orders/${ord_id}/capture-payment"
              payload: {}
              as: Admin
          assert:
            - "Order.${ord_id}.payment_status == CAPTURED"
            - "Order.${ord_id}.fulfillment_status == AWAITING_MEDIA"

      - name: mediaitem_qc_revision_cycle
        grounds:
          - state_machines.MediaItem.QC_FAIL_to_SCANNING
          - state_machines.MediaItem.QC_PENDING_to_QC_FAIL
          - entities.MediaItem.fields.status
          - entities.MediaItem.fields.qc_attempts
        distinguishing_aspect: |
          MediaItem loops: a FAIL at attempt 1 (< MAX_QC_ATTEMPTS=3) sends it to QC_FAIL, then rescan
          returns it to SCANNING (a genuine A->B->A cycle), with qc_attempts persisted at 1.
        test_recipe:
          setup:
            - "One tape item taken to QC_PENDING; a failing QC review then a rescan."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "sm2@x.com", full_name: "SM2", state_code: "CA" }
              as: Admin
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", plan_tier: "STANDARD_KIT", turnaround: "STANDARD", output_option: "CLOUD", declared_tape_count: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/authorize-payment"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${ord_id}/receive"
              payload: {}
              as: IntakeTech
            - call: "POST /storage-bins"
              payload: { label: "SM2B", capacity: 10 }
              as: Admin
              captures: { bin_id: $.data.id }
            - call: "POST /orders/${ord_id}/media-items"
              payload: { media_type: "TAPE", bin_id: "${bin_id}" }
              as: IntakeTech
              captures: { mi_id: $.data.id }
            - call: "POST /machines"
              payload: { name: "SM2M", kind: "TAPE_DECK" }
              as: Admin
              captures: { machine_id: $.data.id }
            - call: "POST /batches"
              payload: { machine_id: "${machine_id}", scheduled_start: "2026-03-01T09:00:00Z", scheduled_end: "2026-03-01T10:00:00Z" }
              as: LabTech
              captures: { batch_id: $.data.id }
            - call: "POST /batches/${batch_id}/load"
              payload: { media_item_id: "${mi_id}" }
              as: LabTech
            - call: "POST /batches/${batch_id}/run"
              payload: {}
              as: LabTech
            - call: "POST /media-items/${mi_id}/complete-scan"
              payload: { digitized_minutes: 30 }
              as: LabTech
            - call: "POST /media-items/${mi_id}/qc-review"
              payload: { decision: "FAIL" }
              as: LabTech
          trigger:
            - call: "POST /media-items/${mi_id}/rescan"
              payload: {}
              as: LabTech
          assert:
            - "MediaItem.${mi_id}.status == SCANNING"
            - "MediaItem.${mi_id}.qc_attempts == 1"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: claim_approval_writeoff_refund_wallet_depth3
        grounds:
          - state_machines.DamageClaim.SUBMITTED_to_APPROVED
          - state_machines.MediaItem.OUTPUT_READY_to_WRITTEN_OFF
          - state_machines.Order.CAPTURED_to_PARTIALLY_REFUNDED
          - entities.Customer.fields.wallet_credit_cents
          - entities.Order.fields.refunded_total_cents
        distinguishing_aspect: |
          Trigger = claim APPROVE. Link1 claim->MediaItem WRITTEN_OFF; link2 (caused by the write-off)
          Order refunded_total_cents += 4000 and payment_status PARTIALLY_REFUNDED; link3 (caused by the
          order refund) Customer wallet_credit_cents += 4000. Three chained hops.
        test_recipe:
          setup:
            - "Order declaring 3 tapes with protection ON, captured; one tape item logged and driven to OUTPUT_READY (order READY); claim filed on it with declared value omitted (payout = TAPE base 4000)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "tc1@x.com", full_name: "TC1", state_code: "CA" }
              as: Admin
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", plan_tier: "STANDARD_KIT", turnaround: "STANDARD", output_option: "CLOUD", lost_damage_protection: true, declared_tape_count: 3 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/authorize-payment"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${ord_id}/capture-payment"
              payload: {}
              as: Admin
            - call: "POST /orders/${ord_id}/receive"
              payload: {}
              as: IntakeTech
            - call: "POST /storage-bins"
              payload: { label: "TC1B", capacity: 10 }
              as: Admin
              captures: { bin_id: $.data.id }
            - call: "POST /orders/${ord_id}/media-items"
              payload: { media_type: "TAPE", bin_id: "${bin_id}" }
              as: IntakeTech
              captures: { mi_id: $.data.id }
            - call: "POST /machines"
              payload: { name: "TC1M", kind: "TAPE_DECK" }
              as: Admin
              captures: { machine_id: $.data.id }
            - call: "POST /batches"
              payload: { machine_id: "${machine_id}", scheduled_start: "2026-03-01T09:00:00Z", scheduled_end: "2026-03-01T10:00:00Z" }
              as: LabTech
              captures: { batch_id: $.data.id }
            - call: "POST /batches/${batch_id}/load"
              payload: { media_item_id: "${mi_id}" }
              as: LabTech
            - call: "POST /batches/${batch_id}/run"
              payload: {}
              as: LabTech
            - call: "POST /media-items/${mi_id}/complete-scan"
              payload: { digitized_minutes: 30 }
              as: LabTech
            - call: "POST /media-items/${mi_id}/qc-review"
              payload: { decision: "PASS" }
              as: LabTech
            - call: "POST /damage-claims"
              payload: { order_id: "${ord_id}", media_item_id: "${mi_id}", claim_type: "LOST" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /damage-claims/${claim_id}/review"
              payload: { decision: "APPROVE" }
              as: ClaimsAdjuster
          assert:
            - "MediaItem.${mi_id}.status == WRITTEN_OFF"
            - "Order.${ord_id}.refunded_total_cents == 4000"
            - "Order.${ord_id}.payment_status == PARTIALLY_REFUNDED"
            - "Customer.${cust_id}.wallet_credit_cents == 4000"

      - name: batch_run_scan_processing_depth2
        grounds:
          - state_machines.Batch.LOADED_to_RUNNING
          - state_machines.MediaItem.PREPPED_to_SCANNING
          - state_machines.Order.RECEIVED_to_PROCESSING
          - entities.Order.fields.fulfillment_status
        distinguishing_aspect: |
          Trigger = batch run. Link1 batch->MediaItem PREPPED->SCANNING; link2 (caused by the item
          entering SCANNING) Order RECEIVED->PROCESSING. Two chained hops from a different trigger than
          the claim cascade.
        test_recipe:
          setup:
            - "Order RECEIVED with one loaded tape item in a LOADED batch."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "tc2@x.com", full_name: "TC2", state_code: "CA" }
              as: Admin
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", plan_tier: "STANDARD_KIT", turnaround: "STANDARD", output_option: "CLOUD", declared_tape_count: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/authorize-payment"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${ord_id}/receive"
              payload: {}
              as: IntakeTech
            - call: "POST /storage-bins"
              payload: { label: "TC2B", capacity: 10 }
              as: Admin
              captures: { bin_id: $.data.id }
            - call: "POST /orders/${ord_id}/media-items"
              payload: { media_type: "TAPE", bin_id: "${bin_id}" }
              as: IntakeTech
              captures: { mi_id: $.data.id }
            - call: "POST /machines"
              payload: { name: "TC2M", kind: "TAPE_DECK" }
              as: Admin
              captures: { machine_id: $.data.id }
            - call: "POST /batches"
              payload: { machine_id: "${machine_id}", scheduled_start: "2026-03-01T09:00:00Z", scheduled_end: "2026-03-01T10:00:00Z" }
              as: LabTech
              captures: { batch_id: $.data.id }
            - call: "POST /batches/${batch_id}/load"
              payload: { media_item_id: "${mi_id}" }
              as: LabTech
          trigger:
            - call: "POST /batches/${batch_id}/run"
              payload: {}
              as: LabTech
          assert:
            - "MediaItem.${mi_id}.status == SCANNING"
            - "Order.${ord_id}.fulfillment_status == PROCESSING"

  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: output_state_beats_fiscal
        grounds:
          - validations[priority=11]
          - validations[priority=40]
          - errors[ERR_ORDER_NOT_READY]
          - errors[ERR_PAYMENT_NOT_CAPTURED]
        distinguishing_aspect: |
          Category pair STATE (ERR_ORDER_NOT_READY, p11) vs BUSINESS_FISCAL (ERR_PAYMENT_NOT_CAPTURED,
          p40): an order that is neither READY nor CAPTURED returns the state error, not the fiscal one.
        test_recipe:
          setup:
            - "Freshly QUOTED order (fulfillment QUOTED, payment UNPAID); its current version read for the OCC field."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "pc1@x.com", full_name: "PC1", state_code: "CA" }
              as: Admin
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", plan_tier: "STANDARD_KIT", turnaround: "STANDARD", output_option: "CLOUD", declared_tape_count: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "GET /orders/${ord_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_v: $.data.version }
          trigger:
            - call: "POST /orders/${ord_id}/output-artifacts"
              payload: { output_type: "CLOUD", expected_order_version: "${ord_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_ORDER_NOT_READY"

      - name: claim_referential_beats_temporal
        grounds:
          - validations[priority=20]
          - validations[priority=30]
          - errors[ERR_MEDIA_NOT_IN_ORDER]
          - errors[ERR_CLAIM_WINDOW_CLOSED]
        distinguishing_aspect: |
          Category pair BUSINESS_REFERENTIAL (ERR_MEDIA_NOT_IN_ORDER, p20) vs BUSINESS_TEMPORAL
          (ERR_CLAIM_WINDOW_CLOSED, p30): a claim naming a media item from a different order, filed
          long after the window, returns the referential error.
        test_recipe:
          setup:
            - "Order A (any state) and Order B RECEIVED with one logged tape item; logical clock advanced far past any claim window."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "pc2@x.com", full_name: "PC2", state_code: "CA" }
              as: Admin
              captures: { cust_id: $.data.id }
            - call: "POST /storage-bins"
              payload: { label: "PC2B", capacity: 10 }
              as: Admin
              captures: { bin_id: $.data.id }
            - call: "POST /orders"
