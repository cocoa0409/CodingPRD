scenario: |
  2887. Fiber Route Engineering & Permitting (fiber network construction team): route selection
  balancing construction cost, permitting complexity and network topology objectives, field walkout
  with pole condition, conduit availability and obstruction documentation, pole attachment
  applications with make-ready engineering, cost estimates and timelines, permit acquisition across
  municipal right-of-way, railroad, highway and waterway crossings with varying review cycles,
  design production with splice point placement, handhole locations and fiber count allocation for
  future customers, construction method selection across aerial, directional bore and trenching by
  segment conditions, restoration requirements and moratorium constraints in recently paved streets,
  as-built documentation and network records updates
domain_name: fiber-route-engineering-permitting
api_prefix: "/"   # flat topology: every collection is a top-level path segment

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity is a peer addressed at a top-level collection; parentage is carried by
  # FK fields in request bodies, never by nested URL paths.

  state_machine_shape: cyclic
  # Route (SCOPE_LOCKED -> PLANNING via re-walk rejection), FieldWalkout (REJECTED -> OPEN),
  # PoleAttachmentApplication (REVISION_REQUESTED -> SUBMITTED), PermitApplication
  # (REVISION_REQUESTED -> UNDER_REVIEW), DesignPackage (STAMPED -> DRAFT) all loop back;
  # RouteSegment additionally carries two independent state dimensions
  # (engineering_status x permit_status) on the same row.

  relationship_patterns:
    - one_to_many          # Route -> RouteSegment, DesignPackage -> SplicePoint
    - self_referential     # RouteSegment.predecessor_segment_id -> RouteSegment.id
    - cross_aggregate      # SplicePoint references both DesignPackage and RouteSegment
    - polymorphic: false

  role_model: segregation_of_duties
  # The engineer who submits a DesignPackage for review may not stamp it, and the engineer who
  # stamped the design may not certify the AsBuiltRecord produced from it.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Route
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: human-readable route label
        constraints: "1..120 chars, non-blank"
      - name: topology_objective
        type: enum
        source: input
        description: network topology goal this route serves
        constraints: "one of {RING_CLOSURE, SPUR, EXPRESS_BACKBONE}"
      - name: target_in_service_date
        type: string
        source: input
        description: calendar date (YYYY-MM-DD) the route must be in service
      - name: budget_authorized_cents
        type: integer
        source: input
        description: total authorized construction+make-ready budget in integer cents
        constraints: ">= 1"
      - name: budget_committed_cents
        type: integer
        source: computed
        description: sum of make_ready_cost_cents over PoleAttachmentApplication rows on this route's segments whose status == GRANTED
        default: 0
      - name: budget_available_cents
        type: integer
        source: computed
        description: budget_authorized_cents - budget_committed_cents
      - name: status
        type: enum
        source: system
        description: route lifecycle state
        default: PLANNING
        constraints: "one of {PLANNING, SCOPE_LOCKED, PERMITTING, CONSTRUCTION_READY, RECORDS_UPDATED}"
      - name: segment_count
        type: integer
        source: computed
        description: count of RouteSegment rows whose route_id == this Route.id
        default: 0
      - name: planned_complexity_index
        type: integer
        source: computed
        description: PLANNED variant of permitting complexity, in centipoints; frozen at scope lock
        default: null
      - name: live_complexity_index
        type: integer
        source: computed
        description: LIVE variant of permitting complexity, in centipoints; recomputed on every PermitApplication status change
        default: null
      - name: total_preliminary_cost_cents
        type: integer
        source: computed
        description: sum of preliminary_cost_cents over this route's segments, treating null as 0
        default: 0
      - name: total_bid_ready_cost_cents
        type: integer
        source: computed
        description: sum of bid_ready_cost_cents over this route's segments, treating null as 0
        default: 0
      - name: design_total_length_feet
        type: integer
        source: computed
        description: sum of length_feet over this route's segments
        default: 0
      - name: scope_locked_at
        type: datetime
        source: system
        description: logical-clock instant the route entered SCOPE_LOCKED; reset to null when scope reverts to PLANNING
        default: null

  - name: RouteSegment
    parent: null
    common_fields: true
    fields:
      - name: route_id
        type: string
        source: input
        description: "FK -> Route.id; owning route"
      - name: predecessor_segment_id
        type: string
        source: input
        description: "FK -> RouteSegment.id; immediately upstream segment on the same route; null for the head segment"
        default: null
      - name: sequence_index
        type: integer
        source: input
        description: position of this segment along the route
        constraints: ">= 1, unique per route_id"
      - name: street_name
        type: string
        source: input
        description: street the segment runs along; used for moratorium matching
      - name: municipality_code
        type: string
        source: input
        description: municipality code owning the right-of-way; used for moratorium matching
      - name: length_feet
        type: integer
        source: input
        description: constructed length of the segment in feet
        constraints: ">= 1"
      - name: terrain_class
        type: enum
        source: input
        description: field condition class driving cost multiplier and permitting authority
        constraints: "one of {URBAN_PAVED, URBAN_UNPAVED, RURAL_SHOULDER, RAIL_CROSSING, HIGHWAY_CROSSING, WATER_CROSSING}"
      - name: existing_conduit_available
        type: boolean
        source: input
        description: field-confirmed spare conduit exists along the segment
        default: false
      - name: planned_work_start_on
        type: string
        source: input
        description: planned construction start date (YYYY-MM-DD); the moratorium probe date
      - name: planned_work_end_on
        type: string
        source: input
        description: planned construction end date (YYYY-MM-DD)
        constraints: ">= planned_work_start_on"
      - name: construction_method
        type: enum
        source: system
        description: selected construction method for this segment
        default: null
        constraints: "one of {AERIAL, DIRECTIONAL_BORE, TRENCH} or null"
      - name: engineering_status
        type: enum
        source: system
        description: engineering state dimension; evolves independently of permit_status
        default: DRAFT
        constraints: "one of {DRAFT, WALKED, METHOD_SELECTED, DESIGN_LOCKED}"
      - name: permit_status
        type: enum
        source: system
        description: permitting state dimension; evolves independently of engineering_status
        default: NOT_REQUIRED
        constraints: "one of {NOT_REQUIRED, PENDING, CLEARED, BLOCKED}"
      - name: required_authority_type
        type: enum
        source: computed
        description: permitting authority implied by terrain_class, per AUTHORITY_BY_TERRAIN in calculations.route_permitting_complexity_index
        constraints: "one of {MUNICIPAL_ROW, STATE_HIGHWAY, RAILROAD, WATERWAY}"
      - name: accepted_obstruction_count
        type: integer
        source: computed
        description: obstruction_count of the FieldWalkout on this segment with status == ACCEPTED ranked created_at DESC (first row); 0 when no ACCEPTED walkout exists
        default: 0
      - name: moratorium_class
        type: enum
        source: computed
        description: moratorium severity resolved at construction-method selection
        default: NONE
        constraints: "one of {NONE, NO_OPEN_CUT, FULL_RESTORATION}"
      - name: restoration_cost_cents
        type: integer
        source: computed
        description: pavement restoration obligation in cents, from calculations.segment_restoration_cost
        default: 0
      - name: preliminary_cost_cents
        type: integer
        source: computed
        description: PRELIMINARY variant of segment construction cost in cents
        default: null
      - name: bid_ready_cost_cents
        type: integer
        source: computed
        description: BID_READY variant of segment construction cost in cents
        default: null

  - name: FieldWalkout
    parent: null
    common_fields: true
    fields:
      - name: segment_id
        type: string
        source: input
        description: "FK -> RouteSegment.id; segment that was walked"
      - name: walked_on
        type: string
        source: input
        description: calendar date (YYYY-MM-DD) the field walkout was performed
      - name: obstruction_count
        type: integer
        source: input
        description: number of documented obstructions found along the segment
        default: 0
        constraints: ">= 0"
      - name: conduit_available_confirmed
        type: boolean
        source: input
        description: surveyor confirmed usable spare conduit
        default: false
      - name: surveyor_note
        type: string
        source: input
        description: free-text field note
        default: null
      - name: status
        type: enum
        source: system
        description: walkout review state
        default: OPEN
        constraints: "one of {OPEN, SUBMITTED, ACCEPTED, REJECTED}"
      - name: worst_pole_condition_grade
        type: enum
        source: computed
        description: worst condition_grade over PoleObservation rows whose walkout_id == this FieldWalkout.id, ordered D > C > B > A; NONE when zero observations exist
        default: NONE
        constraints: "one of {NONE, A, B, C, D}"
      - name: make_ready_flagged_pole_count
        type: integer
        source: computed
        description: count of PoleObservation rows on this walkout whose requires_make_ready == true
        default: 0
      - name: review_round
        type: integer
        source: system
        description: number of completed REJECTED reviews on this walkout
        default: 0
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the RouteEngineer who last reviewed this walkout
        default: null
      - name: rejection_reason
        type: string
        source: system
        description: reason supplied with the most recent REJECTED review
        default: null

  - name: PoleObservation
    parent: null
    common_fields: false
    fields:
      - name: walkout_id
        type: string
        source: input
        description: "FK -> FieldWalkout.id; walkout that recorded this pole"
      - name: pole_tag
        type: string
        source: input
        description: utility pole tag as stencilled in the field
      - name: pole_owner
        type: enum
        source: input
        description: owning utility of the pole
        constraints: "one of {ELECTRIC_UTILITY, TELCO, MUNICIPAL_LIGHT}"
      - name: condition_grade
        type: enum
        source: input
        description: field condition grade of the pole
        constraints: "one of {A, B, C, D}"
      - name: available_vertical_clearance_in
        type: integer
        source: input
        description: usable vertical communication space in inches
        constraints: ">= 0"
      - name: existing_attachment_count
        type: integer
        source: input
        description: attachments already on the pole
        constraints: ">= 0"
      - name: requires_make_ready
        type: boolean
        source: computed
        description: true when condition_grade IN {C, D} OR available_vertical_clearance_in < 40

  - name: PoleAttachmentApplication
    parent: null
    common_fields: true
    fields:
      - name: segment_id
        type: string
        source: input
        description: "FK -> RouteSegment.id; segment whose poles are being applied for"
      - name: pole_owner
        type: enum
        source: input
        description: pole owner the application is filed with
        constraints: "one of {ELECTRIC_UTILITY, TELCO, MUNICIPAL_LIGHT}"
      - name: pole_count
        type: integer
        source: input
        description: number of poles in the application
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: application lifecycle state
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, REVISION_REQUESTED, MAKE_READY_ESTIMATED, GRANTED, DENIED, WITHDRAWN}"
      - name: submitted_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent submit
        default: null
      - name: revision_round
        type: integer
        source: system
        description: number of completed REVISION_REQUESTED rounds
        default: 0
      - name: make_ready_items_subtotal_cents
        type: integer
        source: computed
        description: step-1 output of calculations.make_ready_cost_and_schedule
        default: null
      - name: make_ready_admin_fee_bp
        type: integer
        source: computed
        description: step-2 tier output of calculations.make_ready_cost_and_schedule, keyed on make_ready_items_subtotal_cents
        default: null
      - name: make_ready_admin_fee_cents
        type: integer
        source: computed
        description: step-3 output of calculations.make_ready_cost_and_schedule
        default: null
      - name: make_ready_cost_cents
        type: integer
        source: computed
        description: step-4 output of calculations.make_ready_cost_and_schedule
        default: null
      - name: make_ready_days
        type: integer
        source: computed
        description: make-ready lead time in days from calculations.make_ready_cost_and_schedule
        default: null
      - name: committed
        type: boolean
        source: system
        description: true while this application's make_ready_cost_cents is counted in Route.budget_committed_cents
        default: false
      - name: owner_note
        type: string
        source: system
        description: note supplied by the PoleOwner on the most recent owner-response
        default: null

  - name: MakeReadyItem
    parent: null
    common_fields: false
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> PoleAttachmentApplication.id; application this make-ready line belongs to"
      - name: pole_tag
        type: string
        source: input
        description: pole the make-ready work applies to
      - name: work_class
        type: enum
        source: input
        description: class of make-ready work
        constraints: "one of {TRANSFER, POLE_REPLACEMENT, GUYING, RISER, CLEARANCE_TRIM}"
      - name: quantity
        type: integer
        source: input
        description: number of work units
        constraints: ">= 1"
      - name: unit_cost_cents
        type: integer
        source: computed
        description: WORK_CLASS_UNIT_COST_CENTS[work_class] from calculations.make_ready_cost_and_schedule
      - name: extended_cost_cents
        type: integer
        source: computed
        description: round_half_up(quantity * unit_cost_cents * OWNER_MULTIPLIER_BP[application.pole_owner] / 10000)
      - name: lead_days
        type: integer
        source: computed
        description: WORK_CLASS_LEAD_DAYS[work_class] from calculations.make_ready_cost_and_schedule

  - name: PermitApplication
    parent: null
    common_fields: true
    fields:
      - name: segment_id
        type: string
        source: input
        description: "FK -> RouteSegment.id; segment the permit covers"
      - name: authority_type
        type: enum
        source: input
        description: reviewing authority class
        constraints: "one of {MUNICIPAL_ROW, RAILROAD, STATE_HIGHWAY, WATERWAY}"
      - name: authority_name
        type: string
        source: input
        description: name of the reviewing agency
      - name: work_window_start_on
        type: string
        source: input
        description: requested occupancy window start date (YYYY-MM-DD), inclusive
      - name: work_window_end_on
        type: string
        source: input
        description: requested occupancy window end date (YYYY-MM-DD), inclusive
        constraints: ">= work_window_start_on"
      - name: status
        type: enum
        source: system
        description: permit lifecycle state
        default: DRAFT
        constraints: "one of {DRAFT, UNDER_REVIEW, REVISION_REQUESTED, APPROVED, DENIED}"
      - name: submitted_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent submit
        default: null
      - name: revision_round
        type: integer
        source: system
        description: number of completed REVISION_REQUESTED rounds
        default: 0
      - name: review_days
        type: integer
        source: computed
        description: review_days output of calculations.permit_review_schedule
        default: null
      - name: decision_due_at
        type: datetime
        source: computed
        description: submitted_at + review_days days, from calculations.permit_review_schedule
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: logical-clock instant of the terminal-or-revision decision
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the AuthorityReviewer who decided; null for deemed decisions
        default: null
      - name: deemed
        type: boolean
        source: system
        description: true when the decision was produced by the lapsed-review-window rule rather than by an AuthorityReviewer
        default: false
      - name: decision_note
        type: string
        source: system
        description: note supplied with the most recent decision
        default: null

  - name: MoratoriumWindow
    parent: null
    common_fields: true
    fields:
      - name: municipality_code
        type: string
        source: input
        description: municipality that enacted the moratorium
      - name: street_name
        type: string
        source: input
        description: street under moratorium
      - name: resurfaced_on
        type: string
        source: input
        description: date (YYYY-MM-DD) the street was last resurfaced
      - name: starts_on
        type: string
        source: input
        description: first date (YYYY-MM-DD) of the moratorium, inclusive
      - name: ends_on
        type: string
        source: input
        description: last date (YYYY-MM-DD) of the moratorium, inclusive
        constraints: ">= starts_on"
      - name: moratorium_class
        type: enum
        source: input
        description: restriction severity
        constraints: "one of {NO_OPEN_CUT, FULL_RESTORATION}"
      - name: ordinance_reference
        type: string
        source: input
        description: municipal ordinance citation

  - name: DesignPackage
    parent: null
    common_fields: true
    fields:
      - name: route_id
        type: string
        source: input
        description: "FK -> Route.id; route this design package covers"
      - name: revision
        type: integer
        source: system
        description: 1 + count of DesignPackage rows already existing on this route_id at creation time
      - name: status
        type: enum
        source: system
        description: design package lifecycle state
        default: DRAFT
        constraints: "one of {DRAFT, IN_REVIEW, STAMPED, SUPERSEDED}"
      - name: fiber_count_allocated
        type: integer
        source: input
        description: total fibers in the cable assigned to this design
        constraints: "one of {48, 96, 144, 240, 288, 432}"
      - name: express_fiber_count
        type: integer
        source: input
        description: fibers reserved for pass-through express traffic, never dropped at a splice point
        constraints: ">= 0 and < fiber_count_allocated"
      - name: assigned_drop_fiber_count
        type: integer
        source: computed
        description: sum of fiber_count_dropped over SplicePoint rows on this design whose status == PLACED
        default: 0
      - name: reserve_fiber_count
        type: integer
        source: computed
        description: fiber_count_allocated - express_fiber_count - assigned_drop_fiber_count; the future-customer reserve
      - name: spare_ratio_bp
        type: integer
        source: computed
        description: round_half_up(reserve_fiber_count * 10000 / fiber_count_allocated), in basis points
      - name: splice_point_count
        type: integer
        source: computed
        description: count of SplicePoint rows on this design whose status == PLACED
        default: 0
      - name: handhole_count
        type: integer
        source: computed
        description: count of SplicePoint rows on this design whose status == PLACED and enclosure_type == HANDHOLE
        default: 0
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the RouteEngineer who last submitted this package for review
        default: null
      - name: stamped_by_user_id
        type: string
        source: system
        description: X-User-ID of the RouteEngineer who stamped this package
        default: null
      - name: stamped_at
        type: datetime
        source: system
        description: logical-clock instant of the stamp
        default: null
      - name: stamp_voided_at
        type: datetime
        source: system
        description: logical-clock instant at which a cascade voided the stamp and returned the package to DRAFT
        default: null
      - name: return_note
        type: string
        source: system
        description: note supplied with the most recent return-to-draft
        default: null

  - name: SplicePoint
    parent: null
    common_fields: true
    fields:
      - name: design_id
        type: string
        source: input
        description: "FK -> DesignPackage.id; design revision this splice point belongs to"
      - name: segment_id
        type: string
        source: input
        description: "FK -> RouteSegment.id; segment the splice point sits on"
      - name: station_feet
        type: integer
        source: input
        description: distance in feet from the segment head where the enclosure is placed
        constraints: ">= 0 and <= segment.length_feet"
      - name: enclosure_type
        type: enum
        source: input
        description: physical enclosure at this splice point
        constraints: "one of {HANDHOLE, AERIAL_SNOWSHOE, CABINET}"
      - name: fiber_count_dropped
        type: integer
        source: input
        description: fibers dropped out of the express core at this splice point
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: placement state
        default: PLACED
        constraints: "one of {PLACED, VOIDED}"
      - name: voided_at
        type: datetime
        source: system
        description: logical-clock instant the placement was voided
        default: null

  - name: AsBuiltRecord
    parent: null
    common_fields: true
    fields:
      - name: route_id
        type: string
        source: input
        description: "FK -> Route.id; route the as-built documents"
      - name: design_revision
        type: integer
        source: input
        description: revision number of the STAMPED DesignPackage this as-built was built from (plain integer, matched against DesignPackage.revision on the same route)
        constraints: ">= 1"
      - name: as_built_length_feet
        type: integer
        source: input
        description: field-measured constructed length in feet
        constraints: ">= 1"
      - name: splice_point_count_field_verified
        type: integer
        source: input
        description: splice enclosures physically verified in the field
        constraints: ">= 0"
      - name: records_system_reference
        type: string
        source: input
        description: external network-records system identifier the as-built was filed under
      - name: status
        type: enum
        source: system
        description: as-built certification state
        default: SUBMITTED
        constraints: "one of {SUBMITTED, ACCEPTED, REJECTED}"
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the FieldSurveyor who filed the as-built
      - name: certified_by_user_id
        type: string
        source: system
        description: X-User-ID of the RouteEngineer who certified the as-built
        default: null
      - name: length_variance_bp
        type: integer
        source: computed
        description: round_half_up(abs(as_built_length_feet - Route.design_total_length_feet) * 10000 / Route.design_total_length_feet), in basis points
      - name: certification_note
        type: string
        source: system
        description: note supplied with the certify decision
        default: null

state_machines:
  - entity: Route
    initial_state: PLANNING
    terminal_states: [RECORDS_UPDATED]
    shape: "compound + cyclic (SCOPE_LOCKED -> PLANNING, CONSTRUCTION_READY -> PERMITTING)"
    transitions:
      - from: PLANNING
        to: SCOPE_LOCKED
        trigger: "POST /routes/{id}/lock-scope"
        actor: RouteEngineer
        preconditions:
          - "route.status == PLANNING"
          - "route.segment_count >= 1 (else ERR_ROUTE_HAS_NO_SEGMENTS)"
          - "every RouteSegment with route_id == route.id has engineering_status IN {WALKED, METHOD_SELECTED, DESIGN_LOCKED} (else ERR_WALKOUT_NOT_ACCEPTED)"
          - "route.budget_authorized_cents >= 1"
        side_effects:
          - "sets route.scope_locked_at := current logical-clock instant"
          - "recomputes route.planned_complexity_index via calculations.route_permitting_complexity_index variant PLANNED"
          - "sets route.live_complexity_index := route.planned_complexity_index"
          - "increments Route.version by 1"
        note: "After SCOPE_LOCKED, POST /segments for this route_id is rejected with ERR_SCOPE_LOCKED."

      - from: SCOPE_LOCKED
        to: PERMITTING
        trigger: "system: first POST /permit-applications/{id}/submit against any segment of this route"
        actor: system
        preconditions:
          - "route.status == SCOPE_LOCKED"
        side_effects:
          - "recomputes route.live_complexity_index via calculations.route_permitting_complexity_index variant LIVE"
          - "increments Route.version by 1"

      - from: PERMITTING
        to: CONSTRUCTION_READY
        trigger: "system: evaluated after every POST /permit-applications/{id}/review, POST /permit-applications/{id}/deemed-decision and POST /design-packages/{id}/stamp"
        actor: system
        preconditions:
          - "route.status == PERMITTING"
          - "every RouteSegment with route_id == route.id has permit_status == CLEARED"
          - "at least one DesignPackage with route_id == route.id has status == STAMPED"
        side_effects:
          - "increments Route.version by 1"

      - from: CONSTRUCTION_READY
        to: PERMITTING
        trigger: "system: cascade hop 5 of calculations-free cascade `permit_denial_cascade` (see PermitApplication UNDER_REVIEW -> DENIED)"
        actor: system
        preconditions:
          - "route.status == CONSTRUCTION_READY"
          - "the cascade demoted at least one DesignPackage on this route from STAMPED to DRAFT"
        side_effects:
          - "increments Route.version by 1"

      - from: CONSTRUCTION_READY
        to: RECORDS_UPDATED
        trigger: "system: POST /as-built-records/{id}/certify with decision == ACCEPTED"
        actor: system
        preconditions:
          - "route.status == CONSTRUCTION_READY"
          - "as_built.status transitions SUBMITTED -> ACCEPTED"
        side_effects:
          - "increments Route.version by 1"
        note: "RECORDS_UPDATED is terminal: no further Route transition is permitted, and POST /segments, POST /design-packages, POST /permit-applications are rejected with ERR_INVALID_ROUTE_STATE."

      - from: SCOPE_LOCKED
        to: PLANNING
        trigger: "system: cascade hop 5 of `rewalk_rejection_cascade` (POST /walkouts/{id}/review with decision == REJECTED)"
        actor: system
        preconditions:
          - "route.status IN {SCOPE_LOCKED, PERMITTING, CONSTRUCTION_READY}"
          - "the cascade set at least one RouteSegment on this route to engineering_status DRAFT"
        side_effects:
          - "sets route.scope_locked_at := null"
          - "sets route.planned_complexity_index := null"
          - "increments Route.version by 1"
        note: "Same transition applies from PERMITTING and from CONSTRUCTION_READY; the destination is always PLANNING."

      - from: PERMITTING
        to: PLANNING
        trigger: "system: cascade hop 5 of `rewalk_rejection_cascade` (POST /walkouts/{id}/review with decision == REJECTED)"
        actor: system
        preconditions:
          - "route.status == PERMITTING"
          - "the cascade set at least one RouteSegment on this route to engineering_status DRAFT"
        side_effects:
          - "sets route.scope_locked_at := null"
          - "sets route.planned_complexity_index := null"
          - "increments Route.version by 1"

      - from: CONSTRUCTION_READY
        to: PLANNING
        trigger: "system: cascade hop 5 of `rewalk_rejection_cascade` (POST /walkouts/{id}/review with decision == REJECTED)"
        actor: system
        preconditions:
          - "route.status == CONSTRUCTION_READY"
          - "the cascade set at least one RouteSegment on this route to engineering_status DRAFT"
        side_effects:
          - "sets route.scope_locked_at := null"
          - "sets route.planned_complexity_index := null"
          - "increments Route.version by 1"

  - entity: RouteSegment
    initial_state: "engineering_status = DRAFT; permit_status = NOT_REQUIRED"
    terminal_states: []
    shape: "parallel dimensions: engineering_status and permit_status evolve independently on the same row"
    transitions:
      # ---- dimension 1: engineering_status ----
      - from: "engineering_status DRAFT"
        to: "engineering_status WALKED"
        trigger: "system: POST /walkouts/{id}/review with decision == ACCEPTED for a walkout whose segment_id == this segment"
        actor: system
        preconditions:
          - "segment.engineering_status == DRAFT"
        side_effects:
          - "sets segment.accepted_obstruction_count := walkout.obstruction_count"
          - "sets segment.existing_conduit_available := walkout.conduit_available_confirmed"
          - "increments RouteSegment.version by 1"

      - from: "engineering_status WALKED"
        to: "engineering_status METHOD_SELECTED"
        trigger: "POST /segments/{id}/construction-method"
        actor: RouteEngineer
        preconditions:
          - "segment.engineering_status IN {WALKED, METHOD_SELECTED}"
          - "expected_route_version == Route.version (else ERR_STALE_ROUTE_VERSION)"
          - "method != TRENCH when the resolved moratorium_class == NO_OPEN_CUT (else ERR_OPEN_CUT_PROHIBITED)"
        side_effects:
          - "sets segment.construction_method := method"
          - "resolves segment.moratorium_class via calculations.segment_restoration_cost candidate selection"
          - "recomputes segment.restoration_cost_cents via calculations.segment_restoration_cost"
          - "recomputes segment.preliminary_cost_cents via calculations.segment_construction_cost variant PRELIMINARY"
          - "sets segment.bid_ready_cost_cents := null"
          - "recomputes Route.total_preliminary_cost_cents and Route.total_bid_ready_cost_cents"
          - "increments Route.version by 1"

      - from: "engineering_status METHOD_SELECTED"
        to: "engineering_status METHOD_SELECTED"
        trigger: "POST /segments/{id}/construction-method (re-selection loop)"
        actor: RouteEngineer
        preconditions:
          - "segment.engineering_status == METHOD_SELECTED"
          - "expected_route_version == Route.version (else ERR_STALE_ROUTE_VERSION)"
        side_effects:
          - "overwrites segment.construction_method, segment.moratorium_class, segment.restoration_cost_cents, segment.preliminary_cost_cents"
          - "sets segment.bid_ready_cost_cents := null"
          - "recomputes Route.total_preliminary_cost_cents and Route.total_bid_ready_cost_cents"
          - "increments Route.version by 1"
        note: "Self-loop: re-selection legitimately supersedes the prior method, which is why the OCC race in concurrency_rules[segment-method-stale-route] is real."

      - from: "engineering_status METHOD_SELECTED"
        to: "engineering_status DESIGN_LOCKED"
        trigger: "POST /segments/{id}/bid-ready-estimate"
        actor: RouteEngineer
        preconditions:
          - "segment.engineering_status == METHOD_SELECTED"
          - "segment.construction_method != null"
        side_effects:
          - "recomputes segment.bid_ready_cost_cents via calculations.segment_construction_cost variant BID_READY"
          - "recomputes Route.total_bid_ready_cost_cents"
          - "increments Route.version by 1"

      - from: "engineering_status DESIGN_LOCKED"
        to: "engineering_status METHOD_SELECTED"
        trigger: "system: cascade hop 3 of `permit_denial_cascade`"
        actor: system
        preconditions:
          - "segment.engineering_status == DESIGN_LOCKED"
          - "segment.permit_status was just set to BLOCKED by hop 2"
        side_effects:
          - "sets segment.bid_ready_cost_cents := null"
          - "recomputes Route.total_bid_ready_cost_cents"
          - "increments RouteSegment.version by 1"

      - from: "engineering_status IN {WALKED, METHOD_SELECTED, DESIGN_LOCKED}"
        to: "engineering_status DRAFT"
        trigger: "system: cascade hop 2 of `rewalk_rejection_cascade`"
        actor: system
        preconditions:
          - "a FieldWalkout whose segment_id == this segment was just set to REJECTED"
        side_effects:
          - "hop 3: sets segment.construction_method := null, segment.moratorium_class := NONE, segment.restoration_cost_cents := 0, segment.preliminary_cost_cents := null, segment.bid_ready_cost_cents := null"
          - "increments RouteSegment.version by 1"

      # ---- dimension 2: permit_status ----
      - from: "permit_status IN {NOT_REQUIRED, CLEARED, BLOCKED}"
        to: "permit_status PENDING"
        trigger: "system: POST /permit-applications/{id}/submit for a permit whose segment_id == this segment"
        actor: system
        preconditions:
          - "the permit transitioned into UNDER_REVIEW"
        side_effects:
          - "increments RouteSegment.version by 1"

      - from: "permit_status PENDING"
        to: "permit_status CLEARED"
        trigger: "system: POST /permit-applications/{id}/review or /deemed-decision resulting in APPROVED"
        actor: system
        preconditions:
          - "at least one PermitApplication with segment_id == this segment has status == APPROVED"
          - "zero PermitApplication rows with segment_id == this segment have status IN {UNDER_REVIEW, REVISION_REQUESTED}"
        side_effects:
          - "increments RouteSegment.version by 1"

      - from: "permit_status IN {PENDING, CLEARED}"
        to: "permit_status BLOCKED"
        trigger: "system: cascade hop 2 of `permit_denial_cascade` (a PermitApplication on this segment reached DENIED)"
        actor: system
        preconditions:
          - "at least one PermitApplication with segment_id == this segment has status == DENIED"
        side_effects:
          - "increments RouteSegment.version by 1"
        note: "permit_status BLOCKED does not change engineering_status by itself; hop 3 does that, and only from DESIGN_LOCKED."

  - entity: FieldWalkout
    initial_state: OPEN
    terminal_states: [ACCEPTED]
    shape: "branching with revert cycle REJECTED -> OPEN"
    transitions:
      - from: OPEN
        to: SUBMITTED
        trigger: "POST /walkouts/{id}/submit"
        actor: FieldSurveyor
        preconditions:
          - "walkout.status == OPEN"
          - "at least one PoleObservation with walkout_id == walkout.id exists (else ERR_WALKOUT_HAS_NO_OBSERVATIONS)"
        side_effects:
          - "increments FieldWalkout.version by 1"

      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /walkouts/{id}/review with decision == ACCEPTED"
        actor: RouteEngineer
        preconditions:
          - "walkout.status == SUBMITTED"
          - "X-User-ID != <no constraint>; any RouteEngineer may review"
        side_effects:
          - "sets walkout.reviewed_by_user_id := X-User-ID"
          - "drives RouteSegment engineering_status DRAFT -> WALKED for walkout.segment_id"
          - "increments FieldWalkout.version by 1"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /walkouts/{id}/review with decision == REJECTED"
        actor: RouteEngineer
        preconditions:
          - "walkout.status == SUBMITTED"
          - "rejection_reason is present and non-blank (else ERR_INVALID_REQUEST)"
        side_effects:
          - "hop 1: sets walkout.status := REJECTED, walkout.rejection_reason := rejection_reason, walkout.review_round += 1, walkout.reviewed_by_user_id := X-User-ID"
          - "hop 2 (because of hop 1): RouteSegment engineering_status -> DRAFT"
          - "hop 3 (because of hop 2): segment.construction_method := null, moratorium_class := NONE, restoration_cost_cents := 0, preliminary_cost_cents := null, bid_ready_cost_cents := null"
          - "hop 4 (because of hop 3): Route.total_preliminary_cost_cents and Route.total_bid_ready_cost_cents recomputed"
          - "hop 5 (because of hop 4): Route.status -> PLANNING, Route.scope_locked_at := null, Route.planned_complexity_index := null"
          - "increments FieldWalkout.version by 1"
        note: "This is `rewalk_rejection_cascade`, depth 5."

      - from: REJECTED
        to: OPEN
        trigger: "POST /walkouts/{id}/submit"
        actor: FieldSurveyor
        preconditions:
          - "walkout.status == REJECTED"
        side_effects:
          - "sets walkout.status := OPEN and immediately re-evaluates the OPEN -> SUBMITTED transition in the same request, so the response shows status == SUBMITTED"
          - "increments FieldWalkout.version by 1"
        note: "Revision loop: a rejected walkout is reopened and resubmitted by the same endpoint; walkout.review_round retains its incremented value."

  - entity: PoleAttachmentApplication
    initial_state: DRAFT
    terminal_states: [DENIED, WITHDRAWN]
    shape: "branching with revision cycle REVISION_REQUESTED -> SUBMITTED"
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /pole-attachment-applications/{id}/submit"
        actor: PermitCoordinator
        preconditions:
          - "application.status IN {DRAFT, REVISION_REQUESTED}"
          - "the segment named by application.segment_id has engineering_status IN {WALKED, METHOD_SELECTED, DESIGN_LOCKED} (else ERR_WALKOUT_NOT_ACCEPTED)"
        side_effects:
          - "sets application.submitted_at := current logical-clock instant"
          - "increments PoleAttachmentApplication.version by 1"

      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /pole-attachment-applications/{id}/submit"
        actor: PermitCoordinator
        preconditions:
          - "application.status == REVISION_REQUESTED"
        side_effects:
          - "sets application.submitted_at := current logical-clock instant"
          - "increments PoleAttachmentApplication.version by 1"
        note: "Revision cycle; application.revision_round retains the value incremented when the owner asked for revisions."

      - from: SUBMITTED
        to: MAKE_READY_ESTIMATED
        trigger: "POST /pole-attachment-applications/{id}/owner-response with outcome == ESTIMATED"
        actor: PoleOwner
        preconditions:
          - "application.status == SUBMITTED"
          - "make_ready_items is present with at least one element (else ERR_INVALID_REQUEST)"
        side_effects:
          - "creates one MakeReadyItem per element of make_ready_items with application_id == application.id"
          - "recomputes application.make_ready_items_subtotal_cents, make_ready_admin_fee_bp, make_ready_admin_fee_cents, make_ready_cost_cents, make_ready_days via calculations.make_ready_cost_and_schedule"
          - "increments PoleAttachmentApplication.version by 1"

      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /pole-attachment-applications/{id}/owner-response with outcome == REVISION_REQUESTED"
        actor: PoleOwner
        preconditions:
          - "application.status == SUBMITTED"
        side_effects:
          - "increments application.revision_round by 1"
          - "sets application.owner_note := owner_note"
          - "increments PoleAttachmentApplication.version by 1"

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /pole-attachment-applications/{id}/owner-response with outcome == DENIED"
        actor: PoleOwner
        preconditions:
          - "application.status == SUBMITTED"
        side_effects:
          - "sets application.owner_note := owner_note"
          - "increments PoleAttachmentApplication.version by 1"

      - from: MAKE_READY_ESTIMATED
        to: GRANTED
        trigger: "POST /pole-attachment-applications/{id}/accept-make-ready"
        actor: PermitCoordinator
        preconditions:
          - "application.status == MAKE_READY_ESTIMATED"
          - "no PoleObservation with condition_grade == D exists on the segment's ACCEPTED walkout unless a MakeReadyItem with work_class == POLE_REPLACEMENT exists on this application (else ERR_MAKE_READY_REQUIRED)"
          - "application.make_ready_cost_cents <= Route.budget_available_cents (else ERR_BUDGET_EXCEEDED)"
        side_effects:
          - "sets application.committed := true"
          - "increases Route.budget_committed_cents by application.make_ready_cost_cents and decreases Route.budget_available_cents by the same amount, preserving invariant budget_authorized_cents == budget_committed_cents + budget_available_cents"
          - "recomputes the segment's bid_ready_cost_cents only when segment.engineering_status == DESIGN_LOCKED, then Route.total_bid_ready_cost_cents"
          - "increments Route.version by 1"
          - "increments PoleAttachmentApplication.version by 1"

      - from: "any of {DRAFT, SUBMITTED, REVISION_REQUESTED, MAKE_READY_ESTIMATED, GRANTED}"
        to: WITHDRAWN
        trigger: "POST /pole-attachment-applications/{id}/withdraw"
        actor: PermitCoordinator
        preconditions:
          - "application.status IN {DRAFT, SUBMITTED, REVISION_REQUESTED, MAKE_READY_ESTIMATED, GRANTED}"
        side_effects:
          - "hop 1: sets application.status := WITHDRAWN and application.committed := false"
          - "hop 2 (because of hop 1): Route.budget_committed_cents drops by the application's make_ready_cost_cents when it was committed, and Route.budget_available_cents rises by the same amount"
          - "hop 3 (because of hop 2): the segment's bid_ready_cost_cents is recomputed without this application's make-ready contribution (only when segment.engineering_status == DESIGN_LOCKED)"
          - "hop 4 (because of hop 3): Route.total_bid_ready_cost_cents is recomputed"
          - "increments Route.version by 1"
          - "increments PoleAttachmentApplication.version by 1"
        note: "This is `attachment_withdrawal_cascade`, depth 4, and the compensating action for the budget invariant."

  - entity: PermitApplication
    initial_state: DRAFT
    terminal_states: [APPROVED, DENIED]
    shape: "branching with revision cycle REVISION_REQUESTED -> UNDER_REVIEW"
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /permit-applications/{id}/submit"
        actor: PermitCoordinator
        preconditions:
          - "permit.status IN {DRAFT, REVISION_REQUESTED}"
          - "Route.status IN {SCOPE_LOCKED, PERMITTING} for the route owning permit.segment_id (else ERR_INVALID_ROUTE_STATE)"
          - "no MoratoriumWindow matching the segment's municipality_code and street_name intersects [work_window_start_on, work_window_end_on] (else ERR_MORATORIUM_WINDOW_CONFLICT)"
        side_effects:
          - "sets permit.submitted_at := current logical-clock instant"
          - "recomputes permit.review_days and permit.decision_due_at via calculations.permit_review_schedule"
          - "drives RouteSegment permit_status -> PENDING"
          - "drives Route SCOPE_LOCKED -> PERMITTING on the first submit for the route"
          - "recomputes Route.live_complexity_index via calculations.route_permitting_complexity_index variant LIVE"
          - "increments Route.version by 1"
          - "increments PermitApplication.version by 1"

      - from: REVISION_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /permit-applications/{id}/submit"
        actor: PermitCoordinator
        preconditions:
          - "permit.status == REVISION_REQUESTED"
          - "Route.status IN {SCOPE_LOCKED, PERMITTING}"
        side_effects:
          - "sets permit.submitted_at := current logical-clock instant"
          - "recomputes permit.review_days and permit.decision_due_at with the incremented permit.revision_round, per calculations.permit_review_schedule"
          - "drives RouteSegment permit_status BLOCKED -> PENDING when applicable"
          - "recomputes Route.live_complexity_index"
          - "increments Route.version by 1"
          - "increments PermitApplication.version by 1"
        note: "Revision cycle: revision_round was already incremented by the REVISION_REQUESTED decision, so resubmission is charged the resubmit penalty."

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /permit-applications/{id}/review with decision == APPROVED"
        actor: AuthorityReviewer
        preconditions:
          - "permit.status == UNDER_REVIEW"
        side_effects:
          - "sets permit.decided_at := current logical-clock instant, permit.decided_by_user_id := X-User-ID, permit.deemed := false"
          - "drives RouteSegment permit_status PENDING -> CLEARED when the segment has no remaining permits IN {UNDER_REVIEW, REVISION_REQUESTED}"
          - "recomputes Route.live_complexity_index"
          - "drives Route PERMITTING -> CONSTRUCTION_READY when every segment is CLEARED and a STAMPED DesignPackage exists"
          - "increments Route.version by 1"
          - "increments PermitApplication.version by 1"

      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /permit-applications/{id}/review with decision == REVISION_REQUESTED"
        actor: AuthorityReviewer
        preconditions:
          - "permit.status == UNDER_REVIEW"
        side_effects:
          - "increments permit.revision_round by 1"
          - "sets permit.decided_at := current logical-clock instant, permit.decided_by_user_id := X-User-ID, permit.decision_note := decision_note"
          - "leaves RouteSegment permit_status at PENDING"
          - "recomputes Route.live_complexity_index"
          - "increments Route.version by 1"
          - "increments PermitApplication.version by 1"

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /permit-applications/{id}/review with decision == DENIED"
        actor: AuthorityReviewer
        preconditions:
          - "permit.status == UNDER_REVIEW"
        side_effects:
          - "hop 1: sets permit.status := DENIED, permit.decided_at, permit.decided_by_user_id, permit.decision_note"
          - "hop 2 (because of hop 1): RouteSegment permit_status -> BLOCKED for permit.segment_id"
          - "hop 3 (because of hop 2): that segment's engineering_status DESIGN_LOCKED -> METHOD_SELECTED and bid_ready_cost_cents := null"
          - "hop 4 (because of hop 3): every DesignPackage on the route with status == STAMPED that owns a PLACED SplicePoint on that segment moves STAMPED -> DRAFT with stamp_voided_at := current logical-clock instant"
          - "hop 5 (because of hop 4): Route CONSTRUCTION_READY -> PERMITTING"
          - "recomputes Route.total_bid_ready_cost_cents and Route.live_complexity_index"
          - "increments Route.version by 1"
          - "increments PermitApplication.version by 1"
        note: "This is `permit_denial_cascade`, depth 5."

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /permit-applications/{id}/deemed-decision when permit.authority_type == MUNICIPAL_ROW"
        actor: PermitCoordinator
        preconditions:
          - "permit.status == UNDER_REVIEW"
          - "current logical-clock instant > permit.decision_due_at, strictly (else ERR_REVIEW_WINDOW_OPEN)"
        side_effects:
          - "sets permit.deemed := true, permit.decided_at := current logical-clock instant, permit.decided_by_user_id := null"
          - "same downstream effects as the AuthorityReviewer APPROVED transition"
          - "increments Route.version by 1"
          - "increments PermitApplication.version by 1"
        note: "Municipal deemed-approval: the ordinance grants the permit when the city lets its own review window lapse."

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /permit-applications/{id}/deemed-decision when permit.authority_type IN {RAILROAD, STATE_HIGHWAY, WATERWAY}"
        actor: PermitCoordinator
        preconditions:
          - "permit.status == UNDER_REVIEW"
          - "current logical-clock instant > permit.decision_due_at, strictly (else ERR_REVIEW_WINDOW_OPEN)"
        side_effects:
          - "sets permit.deemed := true, permit.decided_at := current logical-clock instant, permit.decided_by_user_id := null"
          - "runs the full `permit_denial_cascade` hops 2-5 exactly as the AuthorityReviewer DENIED transition does"
          - "increments Route.version by 1"
          - "increments PermitApplication.version by 1"

  - entity: DesignPackage
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    shape: "cyclic (IN_REVIEW -> DRAFT and STAMPED -> DRAFT)"
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /design-packages/{id}/submit-for-review"
        actor: RouteEngineer
        preconditions:
          - "design.status == DRAFT"
          - "design.splice_point_count >= 1 (else ERR_DESIGN_HAS_NO_SPLICE_POINTS)"
        side_effects:
          - "sets design.submitted_by_user_id := X-User-ID"
          - "increments DesignPackage.version by 1"

      - from: IN_REVIEW
        to: STAMPED
        trigger: "POST /design-packages/{id}/stamp"
        actor: RouteEngineer
        preconditions:
          - "design.status == IN_REVIEW"
          - "X-User-ID != design.submitted_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "every RouteSegment with route_id == design.route_id has permit_status == CLEARED (else ERR_PERMIT_NOT_CLEARED)"
          - "design.spare_ratio_bp >= MIN_SPARE_RATIO_BP (else ERR_SPARE_RATIO_BELOW_MINIMUM)"
        side_effects:
          - "sets design.stamped_by_user_id := X-User-ID, design.stamped_at := current logical-clock instant, design.stamp_voided_at := null"
          - "moves every other DesignPackage on the same route whose status == STAMPED to SUPERSEDED"
          - "drives Route PERMITTING -> CONSTRUCTION_READY when every segment is CLEARED"
          - "increments Route.version by 1"
          - "increments DesignPackage.version by 1"

      - from: IN_REVIEW
        to: DRAFT
        trigger: "POST /design-packages/{id}/return-to-draft"
        actor: RouteEngineer
        preconditions:
          - "design.status == IN_REVIEW"
          - "return_note is present and non-blank (else ERR_INVALID_REQUEST)"
        side_effects:
          - "sets design.return_note := return_note and design.submitted_by_user_id := null"
          - "increments DesignPackage.version by 1"
        note: "Revision loop; the package can be resubmitted for review after edits."

      - from: STAMPED
        to: DRAFT
        trigger: "system: cascade hop 4 of `permit_denial_cascade`"
        actor: system
        preconditions:
          - "design.status == STAMPED"
          - "a segment that owns a PLACED SplicePoint of this design just left DESIGN_LOCKED in hop 3"
        side_effects:
          - "sets design.stamp_voided_at := current logical-clock instant; design.stamped_by_user_id and design.stamped_at are retained for audit"
          - "increments DesignPackage.version by 1"

      - from: STAMPED
        to: SUPERSEDED
        trigger: "system: a later DesignPackage revision on the same route is stamped"
        actor: system
        preconditions:
          - "design.status == STAMPED"
          - "another DesignPackage with the same route_id and a higher revision transitions IN_REVIEW -> STAMPED"
        side_effects:
          - "increments DesignPackage.version by 1"
        note: "SUPERSEDED is terminal."

  - entity: SplicePoint
    initial_state: PLACED
    terminal_states: [VOIDED]
    shape: linear
    transitions:
      - from: PLACED
        to: VOIDED
        trigger: "POST /splice-points/{id}/void"
        actor: RouteEngineer
        preconditions:
          - "splice_point.status == PLACED"
          - "the owning DesignPackage.status IN {DRAFT, IN_REVIEW} (else ERR_INVALID_DESIGN_STATE)"
        side_effects:
          - "sets splice_point.voided_at := current logical-clock instant"
          - "decreases design.assigned_drop_fiber_count by splice_point.fiber_count_dropped and increases design.reserve_fiber_count by the same amount, preserving invariant fiber_count_allocated == express_fiber_count + assigned_drop_fiber_count + reserve_fiber_count"
          - "recomputes design.spare_ratio_bp, design.splice_point_count and design.handhole_count"
          - "increments DesignPackage.version by 1"
          - "increments SplicePoint.version by 1"
        note: "Compensating action for the fiber-conservation invariant."

  - entity: AsBuiltRecord
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REJECTED]
    shape: branching
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /as-built-records/{id}/certify with decision == ACCEPTED"
        actor: RouteEngineer
        preconditions:
          - "as_built.status == SUBMITTED"
          - "X-User-ID != the stamped_by_user_id of the DesignPackage on this route whose revision == as_built.design_revision (else ERR_SEGREGATION_OF_DUTIES)"
          - "as_built.length_variance_bp <= MAX_AS_BUILT_VARIANCE_BP (else ERR_AS_BUILT_VARIANCE_EXCEEDED)"
        side_effects:
          - "sets as_built.certified_by_user_id := X-User-ID and as_built.certification_note := certification_note"
          - "drives Route CONSTRUCTION_READY -> RECORDS_UPDATED"
          - "increments Route.version by 1"
          - "increments AsBuiltRecord.version by 1"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /as-built-records/{id}/certify with decision == REJECTED"
        actor: RouteEngineer
        preconditions:
          - "as_built.status == SUBMITTED"
          - "X-User-ID != the stamped_by_user_id of the DesignPackage on this route whose revision == as_built.design_revision (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "sets as_built.certified_by_user_id := X-User-ID and as_built.certification_note := certification_note"
          - "leaves Route.status unchanged at CONSTRUCTION_READY"
          - "increments AsBuiltRecord.version by 1"
        note: "Both ACCEPTED and REJECTED are terminal; a rejected as-built is replaced by filing a new AsBuiltRecord."

concurrency_rules:
  - rule_id: segment-method-stale-route
    parent_entity: Route
    write_endpoint: "POST /segments/{id}/construction-method"
    occ_field: "expected_route_version"
    description: |
      Selecting a construction method for a segment while the client's view of the owning Route is
      stale is rejected with 412. Method selection is a legitimate supersede — the
      METHOD_SELECTED -> METHOD_SELECTED self-loop lets a later selection overwrite an earlier one
      and re-derive preliminary_cost_cents, restoration_cost_cents and the route's cost rollups — so
      a writer holding an outdated Route.version would silently overwrite cost figures derived from
      state it never observed. The check is a stale-version comparison on Route.version only.
    error_id: ERR_STALE_ROUTE_VERSION
    http_status: 412

  - rule_id: design-package-create-stale-route
    parent_entity: Route
    write_endpoint: "POST /design-packages"
    occ_field: "expected_route_version"
    description: |
      Creating a DesignPackage revision against a Route whose version has advanced since the client
      last observed it is rejected with 412. A newly stamped revision legitimately supersedes the
      prior STAMPED package, so the create itself is always permitted by the product semantics; the
      stale-version check is what stops a writer from minting revision N+1 from an outdated view of
      the route's segment set, permit posture and cost rollups.
    error_id: ERR_STALE_ROUTE_VERSION
    http_status: 412

calculations:
  - name: segment_construction_cost
    trigger: |
      Variant PRELIMINARY runs on POST /segments/{id}/construction-method (engineering_status
      WALKED|METHOD_SELECTED -> METHOD_SELECTED) and writes RouteSegment.preliminary_cost_cents.
      Variant BID_READY runs on POST /segments/{id}/bid-ready-estimate (engineering_status
      METHOD_SELECTED -> DESIGN_LOCKED) and writes RouteSegment.bid_ready_cost_cents; it is
      re-executed by POST /pole-attachment-applications/{id}/accept-make-ready and by
      POST /pole-attachment-applications/{id}/withdraw, but only while the segment is DESIGN_LOCKED.
    algorithm: tiered_pricing
    formula: |
      base_rate   = METHOD_BASE_RATE_CENTS_PER_FOOT[segment.construction_method]
      terrain_bp  = TERRAIN_MULTIPLIER_BP[segment.terrain_class]

      # ---------- variant PRELIMINARY: one multiplication, one rounding ----------
      preliminary_cost_cents =
          round_half_up(segment.length_feet * base_rate * terrain_bp / 10000)

      # ---------- variant BID_READY: round per 100-foot station block, THEN sum ----------
      # Rounding order is PINNED: each station block is rounded to whole cents BEFORE summation.
      # Summing the unrounded block values and rounding once at the end is FORBIDDEN and produces
      # a different number.
      full_blocks     = segment.length_feet // 100          # integer floor division
      remainder_feet  = segment.length_feet % 100
      block_cost      = round_half_up(100 * base_rate * terrain_bp / 10000)
      remainder_cost  = round_half_up(remainder_feet * base_rate * terrain_bp / 10000)
      construction_subtotal = full_blocks * block_cost + remainder_cost

      obstruction_surcharge = OBSTRUCTION_SURCHARGE_CENTS * segment.accepted_obstruction_count
      granted_make_ready    = sum of make_ready_cost_cents over PoleAttachmentApplication rows
                              whose segment_id == segment.id and status == GRANTED
      bid_ready_cost_cents  = construction_subtotal
                            + obstruction_surcharge
                            + segment.restoration_cost_cents
                            + granted_make_ready
    input_set: |
      Both variants read only the segment's own fields plus the constants below. BID_READY
      additionally reads (a) segment.accepted_obstruction_count, which is the obstruction_count of
      the FieldWalkout on this segment with status == ACCEPTED ranked created_at DESC, first row
      (0 when none), (b) segment.restoration_cost_cents from calculations.segment_restoration_cost,
      and (c) PoleAttachmentApplication rows on this segment with status == GRANTED only —
      DRAFT, SUBMITTED, REVISION_REQUESTED, MAKE_READY_ESTIMATED, DENIED and WITHDRAWN rows are
      excluded. The make-ready sum is order-insensitive because each addend is already an integer.
    constants:
      METHOD_BASE_RATE_CENTS_PER_FOOT: { AERIAL: 1237, DIRECTIONAL_BORE: 4615, TRENCH: 2845 }
      TERRAIN_MULTIPLIER_BP:
        URBAN_PAVED: 12750
        URBAN_UNPAVED: 10850
        RURAL_SHOULDER: 9250
        RAIL_CROSSING: 22500
        HIGHWAY_CROSSING: 18250
        WATER_CROSSING: 24750
      OBSTRUCTION_SURCHARGE_CENTS: 75000
      STATION_BLOCK_FEET: 100
    precision: "integer cents; round_half_up at every rounding site named in the formula"
    variants:
      - name: PRELIMINARY
        when: "written at construction-method selection, before any make-ready or restoration commitment is known to the estimator"
        difference: "single rounding over the whole segment length; excludes obstruction surcharge, restoration and make-ready entirely"
      - name: BID_READY
        when: "written at bid-ready estimate, once the walkout, moratorium and granted make-ready are all known"
        difference: "rounds each 100-foot station block separately before summation, then adds obstruction surcharge, restoration and granted make-ready; for AERIAL / URBAN_PAVED / 250 ft the construction component alone is 394295 versus PRELIMINARY 394294"

  - name: segment_restoration_cost
    trigger: "runs inside POST /segments/{id}/construction-method, before segment_construction_cost variant PRELIMINARY; writes RouteSegment.moratorium_class and RouteSegment.restoration_cost_cents"
    algorithm: constraint_propagation
    formula: |
      # ---- step 1: resolve the governing MoratoriumWindow (selector) ----
      candidates = MoratoriumWindow rows where
          mw.municipality_code == segment.municipality_code
          AND mw.street_name == segment.street_name
          AND mw.starts_on <= segment.planned_work_start_on <= mw.ends_on   # closed interval, inclusive
      if candidates is empty:
          segment.moratorium_class = NONE
      else:
          rank candidates by MORATORIUM_SEVERITY[mw.moratorium_class] DESC,
                             then by mw.created_at ASC          # tie-break; never by id
          segment.moratorium_class = first candidate's moratorium_class

      # ---- step 2: rate lookup, then exact multiplication ----
      if segment.construction_method == TRENCH and segment.moratorium_class == NO_OPEN_CUT:
          reject the request with ERR_OPEN_CUT_PROHIBITED (no fields are written)
      rate = RESTORATION_RATE_CENTS_PER_FOOT[segment.construction_method][segment.moratorium_class]
      segment.restoration_cost_cents = segment.length_feet * rate      # exact, no rounding needed
    input_set: |
      All MoratoriumWindow rows are eligible regardless of created_at — there is no time window on
      the candidate set other than the closed-interval containment test on
      segment.planned_work_start_on. Eligibility filter, ranking expression, tie-break and
      empty-set fallback (NONE) are all pinned above.
    constants:
      MORATORIUM_SEVERITY: { FULL_RESTORATION: 2, NO_OPEN_CUT: 1, NONE: 0 }
      RESTORATION_RATE_CENTS_PER_FOOT:
        AERIAL: { NONE: 0, NO_OPEN_CUT: 0, FULL_RESTORATION: 0 }
        DIRECTIONAL_BORE: { NONE: 260, NO_OPEN_CUT: 480, FULL_RESTORATION: 720 }
        TRENCH: { NONE: 940, NO_OPEN_CUT: "prohibited - ERR_OPEN_CUT_PROHIBITED", FULL_RESTORATION: 2150 }
    precision: "integer cents; no rounding occurs because length_feet and rate are both integers"

  - name: route_permitting_complexity_index
    trigger: |
      Variant PLANNED runs on POST /routes/{id}/lock-scope and writes Route.planned_complexity_index
      (and seeds Route.live_complexity_index with the same value). Variant LIVE runs on every
      PermitApplication status change — POST /permit-applications/{id}/submit,
      POST /permit-applications/{id}/review, POST /permit-applications/{id}/deemed-decision — and
      writes Route.live_complexity_index only.
    algorithm: weighted_scoring
    formula: |
      # ---------- variant PLANNED: authority mix implied by terrain ----------
      # Input set: every RouteSegment with route_id == route.id, no status filter, evaluated at the
      # instant of lock-scope. Order-insensitive (plain integer sum).
      planned_weight_sum = sum over those segments of
          AUTHORITY_WEIGHT[AUTHORITY_BY_TERRAIN[segment.terrain_class]]
      planned_complexity_index =
          round_half_up(planned_weight_sum * 100 / route.segment_count)

      # ---------- variant LIVE: actual filed applications and their outcomes ----------
      # Input set: every PermitApplication whose segment_id belongs to this route AND whose
      # status IN {UNDER_REVIEW, REVISION_REQUESTED, APPROVED, DENIED}. DRAFT rows are excluded.
      # No created_at window: all qualifying rows of all revision rounds count once each, by their
      # current status.
      # Rounding order is PINNED: round each term to whole centipoints FIRST, sum the integers,
      # then round the division by segment_count. Summing unrounded terms is FORBIDDEN.
      term(p) = round_half_up(AUTHORITY_WEIGHT[p.authority_type] * STATUS_FACTOR_BP[p.status] * 100 / 10000)
      live_weight_sum = sum of term(p) over the qualifying rows      # order-insensitive: integers
      live_complexity_index =
          0                                              if live_weight_sum has no addends
          round_half_up(live_weight_sum / route.segment_count)   otherwise
    input_set: |
      PLANNED reads RouteSegment.terrain_class only and therefore counts every segment exactly once
      whether or not a permit was ever filed for it. LIVE reads PermitApplication rows only and
      therefore counts nothing for a segment with no filed permit and counts two rows for a segment
      with two filed permits. Divisor is Route.segment_count in both variants.
    constants:
      AUTHORITY_WEIGHT: { MUNICIPAL_ROW: 10, STATE_HIGHWAY: 25, RAILROAD: 40, WATERWAY: 50 }
      AUTHORITY_BY_TERRAIN:
        URBAN_PAVED: MUNICIPAL_ROW
        URBAN_UNPAVED: MUNICIPAL_ROW
        RURAL_SHOULDER: MUNICIPAL_ROW
        HIGHWAY_CROSSING: STATE_HIGHWAY
        RAIL_CROSSING: RAILROAD
        WATER_CROSSING: WATERWAY
      STATUS_FACTOR_BP:
        UNDER_REVIEW: 10000
        REVISION_REQUESTED: 15000
        APPROVED: 2500
        DENIED: 20000
    precision: "integer centipoints; round_half_up per term, then round_half_up on the final division"
    variants:
      - name: PLANNED
        when: "frozen at POST /routes/{id}/lock-scope; never recomputed afterwards except being reset to null by rewalk_rejection_cascade hop 5"
        difference: "scores the authority mix the terrain implies, ignoring whether any permit exists; a 3-segment route of URBAN_PAVED + RAIL_CROSSING + HIGHWAY_CROSSING scores 2500"
      - name: LIVE
        when: "recomputed on every PermitApplication status change"
        difference: "scores only filed applications, weighted by their current status factor; the same 3-segment route with MUNICIPAL_ROW UNDER_REVIEW, RAILROAD DENIED and STATE_HIGHWAY APPROVED scores 3208"

  - name: make_ready_cost_and_schedule
    trigger: "runs on POST /pole-attachment-applications/{id}/owner-response with outcome == ESTIMATED (SUBMITTED -> MAKE_READY_ESTIMATED); writes MakeReadyItem.unit_cost_cents, MakeReadyItem.extended_cost_cents, MakeReadyItem.lead_days and PoleAttachmentApplication.make_ready_items_subtotal_cents, make_ready_admin_fee_bp, make_ready_admin_fee_cents, make_ready_cost_cents, make_ready_days"
    algorithm: threshold
    formula: |
      # The administrative fee is a percentage of a tier that is itself keyed on an amount which
      # LOOKS like the total. The evaluation order below is PINNED and MUST be followed exactly;
      # re-deriving the tier from make_ready_cost_cents is FORBIDDEN and does not converge.

      # step 1 -- per-item rounding, then summation
      owner_bp = OWNER_MULTIPLIER_BP[application.pole_owner]
      for each submitted make-ready line:
          item.unit_cost_cents     = WORK_CLASS_UNIT_COST_CENTS[line.work_class]
          item.lead_days           = WORK_CLASS_LEAD_DAYS[line.work_class]
          item.extended_cost_cents = round_half_up(line.quantity * item.unit_cost_cents * owner_bp / 10000)
      make_ready_items_subtotal_cents = sum of item.extended_cost_cents      # integers, order-insensitive

      # step 2 -- tier keyed on the PRE-FEE subtotal, never on the total
      if   make_ready_items_subtotal_cents <  ADMIN_FEE_TIER_1_CEILING_CENTS: make_ready_admin_fee_bp = 1200
      elif make_ready_items_subtotal_cents <  ADMIN_FEE_TIER_2_CEILING_CENTS: make_ready_admin_fee_bp = 900
      else:                                                                   make_ready_admin_fee_bp = 600

      # step 3
      make_ready_admin_fee_cents = round_half_up(make_ready_items_subtotal_cents * make_ready_admin_fee_bp / 10000)

      # step 4
      make_ready_cost_cents = make_ready_items_subtotal_cents + make_ready_admin_fee_cents

      # schedule
      make_ready_days = min(
          max over items of item.lead_days + POLE_HANDLING_DAYS_PER_POLE * application.pole_count,
          MAKE_READY_DAYS_CAP)
    input_set: |
      Only the make-ready lines supplied on this owner-response are considered; lines created by an
      earlier owner-response on the same application are deleted and replaced, so the item set is
      exactly the payload's set. application.pole_count is read from the application row, not from
      the item lines.
    constants:
      WORK_CLASS_UNIT_COST_CENTS:
        TRANSFER: 42500
        POLE_REPLACEMENT: 585000
        GUYING: 78000
        RISER: 96500
        CLEARANCE_TRIM: 31250
      WORK_CLASS_LEAD_DAYS:
        TRANSFER: 30
        POLE_REPLACEMENT: 90
        GUYING: 45
        RISER: 25
        CLEARANCE_TRIM: 15
      OWNER_MULTIPLIER_BP: { ELECTRIC_UTILITY: 11500, TELCO: 10000, MUNICIPAL_LIGHT: 9500 }
      ADMIN_FEE_TIER_1_CEILING_CENTS: 500000
      ADMIN_FEE_TIER_2_CEILING_CENTS: 2000000
      POLE_HANDLING_DAYS_PER_POLE: 2
      MAKE_READY_DAYS_CAP: 120
    precision: "integer cents; round_half_up per item and once on the admin fee"

  - name: permit_review_schedule
    trigger: "runs on POST /permit-applications/{id}/submit (DRAFT -> UNDER_REVIEW and REVISION_REQUESTED -> UNDER_REVIEW); writes PermitApplication.review_days and PermitApplication.decision_due_at"
    algorithm: threshold
    formula: |
      base_days = REVIEW_CYCLE_DAYS[permit.authority_type]
      penalty   = REVISION_ROUND_PENALTY_DAYS * permit.revision_round

      # non-linear interaction of three inputs: authority class, route topology objective and
      # revision round. Expedite is a conditional branch, and the cap is a hard min().
      expedite_eligible = (route.topology_objective == RING_CLOSURE)
                          AND (permit.authority_type IN {MUNICIPAL_ROW, STATE_HIGHWAY})

      raw_days       = base_days + penalty
      effective_days = ceil(raw_days * EXPEDITE_FACTOR_BP / 10000) if expedite_eligible else raw_days
      review_days    = min(effective_days, AUTHORITY_CAP_DAYS[permit.authority_type])

      decision_due_at = permit.submitted_at + review_days * 24 hours     # exact UTC instant arithmetic
    input_set: |
      Reads the permit row, the Route reached through permit.segment_id -> RouteSegment.route_id, and
      the constants below. permit.revision_round is read AFTER any increment applied by a prior
      REVISION_REQUESTED decision, so the first resubmission is charged exactly one penalty.
    constants:
      REVIEW_CYCLE_DAYS: { MUNICIPAL_ROW: 21, RAILROAD: 90, STATE_HIGHWAY: 45, WATERWAY: 120 }
      AUTHORITY_CAP_DAYS: { MUNICIPAL_ROW: 35, RAILROAD: 120, STATE_HIGHWAY: 60, WATERWAY: 150 }
      REVISION_ROUND_PENALTY_DAYS: 14
      EXPEDITE_FACTOR_BP: 7500
    precision: "whole days; ceil on the expedite multiplication, then min against the cap. Every instant this API emits (decision_due_at, submitted_at, scope_locked_at, stamped_at, stamp_voided_at, voided_at, decided_at, created_at, updated_at) is rendered as ISO-8601 UTC at whole-second precision with a trailing `Z` and NO fractional-second digits, e.g. `2026-09-24T00:00:00Z`; the same form is accepted on input."

  - name: design_fiber_allocation
    trigger: "runs on POST /splice-points (creation) and POST /splice-points/{id}/void; writes DesignPackage.assigned_drop_fiber_count, reserve_fiber_count, spare_ratio_bp, splice_point_count and handhole_count"
    algorithm: aggregation
    formula: |
      placed = SplicePoint rows where design_id == design.id AND status == PLACED
      design.assigned_drop_fiber_count = sum of placed.fiber_count_dropped        # 0 when placed is empty
      design.reserve_fiber_count       = design.fiber_count_allocated
                                       - design.express_fiber_count
                                       - design.assigned_drop_fiber_count
      design.spare_ratio_bp            = round_half_up(design.reserve_fiber_count * 10000 / design.fiber_count_allocated)
      design.splice_point_count        = count of placed
      design.handhole_count            = count of placed with enclosure_type == HANDHOLE

      # conserved quantity, checked before persisting:
      #   fiber_count_allocated == express_fiber_count + assigned_drop_fiber_count + reserve_fiber_count
      # A create whose drop would push reserve_fiber_count below 0 is rejected with
      # ERR_FIBER_ALLOCATION_EXCEEDED and writes nothing.
    input_set: |
      Only SplicePoint rows with status == PLACED on this design_id enter the sum; VOIDED rows are
      excluded, which is what makes void an exact compensating action. Rows on other designs of the
      same route never enter. The sum is order-insensitive (integer addends), so no tie-break applies.
    constants:
      MIN_SPARE_RATIO_BP: 2000
      MIN_SPLICE_SPACING_FEET: 250
    precision: "integer fibers; spare_ratio_bp is integer basis points with round_half_up"

  - name: route_budget_ledger
    trigger: "runs on POST /routes (initialisation), POST /routes/{id}/budget-adjustments, POST /pole-attachment-applications/{id}/accept-make-ready and POST /pole-attachment-applications/{id}/withdraw; writes Route.budget_committed_cents and Route.budget_available_cents"
    algorithm: aggregation
    formula: |
      route.budget_committed_cents = sum of make_ready_cost_cents over PoleAttachmentApplication rows
          whose segment_id belongs to a RouteSegment with route_id == route.id
          AND whose status == GRANTED
      route.budget_available_cents = route.budget_authorized_cents - route.budget_committed_cents

      # conserved quantity, invariant after every forward and compensating action:
      #   route.budget_authorized_cents == route.budget_committed_cents + route.budget_available_cents
      # accept-make-ready is rejected with ERR_BUDGET_EXCEEDED when
      #   application.make_ready_cost_cents > route.budget_available_cents  (strict >, so an exact
      #   fit that drives budget_available_cents to 0 is allowed).
      # budget-adjustments is rejected with ERR_BUDGET_EXCEEDED when the resulting
      #   budget_authorized_cents would be < route.budget_committed_cents.
    input_set: |
      Only GRANTED applications count. WITHDRAWN rows are excluded even though their
      make_ready_cost_cents is retained on the row for audit, which is what makes withdraw an exact
      compensating action. DENIED, DRAFT, SUBMITTED, REVISION_REQUESTED and MAKE_READY_ESTIMATED rows
      never count. The sum is order-insensitive (integer addends).
    constants:
      MIN_AUTHORIZED_BUDGET_CENTS: 1
    precision: "integer cents; no rounding occurs"

  - name: as_built_length_variance
    trigger: "runs on POST /as-built-records (creation); writes AsBuiltRecord.length_variance_bp"
    algorithm: threshold
    formula: |
      design_total = route.design_total_length_feet          # sum of length_feet over route segments
      length_variance_bp = round_half_up(
          abs(as_built.as_built_length_feet - design_total) * 10000 / design_total)
      # POST /as-built-records/{id}/certify with decision == ACCEPTED is rejected with
      # ERR_AS_BUILT_VARIANCE_EXCEEDED when length_variance_bp > MAX_AS_BUILT_VARIANCE_BP
      # (strict >, so exactly MAX_AS_BUILT_VARIANCE_BP is acceptable).
    input_set: "every RouteSegment with route_id == as_built.route_id contributes its length_feet, regardless of engineering_status or permit_status"
    constants:
      MAX_AS_BUILT_VARIANCE_BP: 500
    precision: "integer basis points, round_half_up"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-blank; X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting X-User-Role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_referential
    check: "request body shape: every required field present, no unknown field, enum values inside the declared set, integers within their declared constraints, dates parseable as YYYY-MM-DD, instants parseable as ISO-8601 UTC, and every ordering constraint on a pair of body fields satisfied (planned_work_end_on >= planned_work_start_on, work_window_end_on >= work_window_start_on, ends_on >= starts_on, express_fiber_count < fiber_count_allocated, station_feet <= segment.length_feet)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 4
    category: existence
    check: "path-parameter resources exist, validated left-to-right"
    error_id: "ERR_ROUTE_NOT_FOUND | ERR_SEGMENT_NOT_FOUND | ERR_WALKOUT_NOT_FOUND | ERR_POLE_APPLICATION_NOT_FOUND | ERR_PERMIT_NOT_FOUND | ERR_DESIGN_NOT_FOUND | ERR_SPLICE_POINT_NOT_FOUND | ERR_AS_BUILT_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint carrying a path parameter"

  - priority: 5
    category: existence
    check: "body foreign keys exist, validated in the order the fields are declared on the entity in section 1.1 (route_id before predecessor_segment_id; design_id before segment_id; walkout_id; application_id; segment_id)"
    error_id: "ERR_ROUTE_NOT_FOUND | ERR_SEGMENT_NOT_FOUND | ERR_WALKOUT_NOT_FOUND | ERR_DESIGN_NOT_FOUND"
    http_status: 404
    applies_to: "POST /segments, POST /walkouts, POST /pole-observations, POST /pole-attachment-applications, POST /permit-applications, POST /design-packages, POST /splice-points, POST /as-built-records"

  - priority: 6
    category: business_referential
    check: "predecessor_segment_id, when non-null, names a RouteSegment whose route_id == the new segment's route_id and whose sequence_index < the new segment's sequence_index"
    error_id: ERR_PREDECESSOR_SEGMENT_MISMATCH
    http_status: 422
    applies_to: "POST /segments"

  - priority: 7
    category: business_referential
    check: "sequence_index is not already used by another RouteSegment on the same route_id"
    error_id: ERR_SEQUENCE_INDEX_TAKEN
    http_status: 409
    applies_to: "POST /segments"

  - priority: 8
    category: state
    check: "expected_route_version equals the current Route.version of the route reached from the request"
    error_id: ERR_STALE_ROUTE_VERSION
    http_status: 412
    applies_to: "POST /segments/{id}/construction-method, POST /design-packages"

  - priority: 9
    category: state
    check: "Route.status permits the operation: POST /segments requires PLANNING; POST /permit-applications and POST /permit-applications/{id}/submit require SCOPE_LOCKED, PERMITTING or CONSTRUCTION_READY (a supplemental permit may be filed after the design is construction-ready); POST /design-packages requires SCOPE_LOCKED, PERMITTING or CONSTRUCTION_READY; POST /as-built-records requires CONSTRUCTION_READY; POST /routes/{id}/lock-scope requires PLANNING"
    error_id: "ERR_INVALID_ROUTE_STATE | ERR_SCOPE_LOCKED"
    http_status: 409
    applies_to: "POST /segments, POST /routes/{id}/lock-scope, POST /permit-applications, POST /permit-applications/{id}/submit, POST /design-packages, POST /as-built-records"

  - priority: 10
    category: state
    check: "RouteSegment.engineering_status permits the operation: POST /segments/{id}/construction-method requires WALKED or METHOD_SELECTED; POST /segments/{id}/bid-ready-estimate requires METHOD_SELECTED"
    error_id: ERR_INVALID_SEGMENT_ENGINEERING_STATE
    http_status: 409
    applies_to: "POST /segments/{id}/construction-method, POST /segments/{id}/bid-ready-estimate"

  - priority: 11
    category: state
    check: "the target child resource is in a state the transition allows: FieldWalkout (submit requires OPEN or REJECTED; review requires SUBMITTED); PoleAttachmentApplication (submit requires DRAFT or REVISION_REQUESTED; owner-response requires SUBMITTED; accept-make-ready requires MAKE_READY_ESTIMATED; withdraw requires any non-terminal status); PermitApplication (submit requires DRAFT or REVISION_REQUESTED; review and deemed-decision require UNDER_REVIEW); DesignPackage (submit-for-review requires DRAFT; stamp requires IN_REVIEW; return-to-draft requires IN_REVIEW; POST /splice-points requires DRAFT); SplicePoint (void requires PLACED); AsBuiltRecord (certify requires SUBMITTED)"
    error_id: "ERR_INVALID_WALKOUT_STATE | ERR_INVALID_POLE_APPLICATION_STATE | ERR_INVALID_PERMIT_STATE | ERR_INVALID_DESIGN_STATE | ERR_INVALID_SPLICE_POINT_STATE | ERR_INVALID_AS_BUILT_STATE"
    http_status: 409
    applies_to: "every action endpoint that drives a state machine other than Route"

  - priority: 12
    category: business_safety
    check: "segregation of duties: X-User-ID differs from DesignPackage.submitted_by_user_id on stamp, and from the stamping engineer's user id on as-built certify"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /design-packages/{id}/stamp, POST /as-built-records/{id}/certify"

  - priority: 13
    category: business_safety
    check: "open-cut prohibition: method TRENCH is refused when the resolved moratorium_class == NO_OPEN_CUT"
    error_id: ERR_OPEN_CUT_PROHIBITED
    http_status: 422
    applies_to: "POST /segments/{id}/construction-method"

  - priority: 14
    category: business_safety
    check: "a grade-D pole documented on the segment's ACCEPTED walkout requires a MakeReadyItem with work_class == POLE_REPLACEMENT on the application before make-ready may be accepted"
    error_id: ERR_MAKE_READY_REQUIRED
    http_status: 422
    applies_to: "POST /pole-attachment-applications/{id}/accept-make-ready"

  - priority: 15
    category: business_temporal
    check: "no MoratoriumWindow matching the segment's municipality_code and street_name intersects the permit's [work_window_start_on, work_window_end_on]; both intervals are closed, so touching endpoints collide"
    error_id: ERR_MORATORIUM_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /permit-applications/{id}/submit"

  - priority: 16
    category: business_temporal
    check: "a new MoratoriumWindow's [starts_on, ends_on] does not intersect an existing window on the same municipality_code and street_name (closed intervals)"
    error_id: ERR_MORATORIUM_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /moratorium-windows"

  - priority: 17
    category: business_temporal
    check: "the review window has actually lapsed: current logical-clock instant is strictly greater than PermitApplication.decision_due_at"
    error_id: ERR_REVIEW_WINDOW_OPEN
    http_status: 409
    applies_to: "POST /permit-applications/{id}/deemed-decision"

  - priority: 18
    category: business_constraint
    check: "the new SplicePoint's station_feet is at least MIN_SPLICE_SPACING_FEET from every PLACED SplicePoint with the same design_id and segment_id; the comparison is abs(delta) < 250 rejected, so exactly 250 feet apart is allowed"
    error_id: ERR_SPLICE_SPACING_VIOLATION
    http_status: 422
    applies_to: "POST /splice-points"

  - priority: 19
    category: business_constraint
    check: "empty-collection gates: lock-scope requires at least one segment; walkout submit requires at least one PoleObservation; design submit-for-review requires at least one PLACED SplicePoint"
    error_id: "ERR_ROUTE_HAS_NO_SEGMENTS | ERR_WALKOUT_HAS_NO_OBSERVATIONS | ERR_DESIGN_HAS_NO_SPLICE_POINTS"
    http_status: 422
    applies_to: "POST /routes/{id}/lock-scope, POST /walkouts/{id}/submit, POST /design-packages/{id}/submit-for-review"

  - priority: 20
    category: business_constraint
    check: "walkout readiness: lock-scope requires every segment to have engineering_status IN {WALKED, METHOD_SELECTED, DESIGN_LOCKED}; pole-attachment submit requires the same on its own segment"
    error_id: ERR_WALKOUT_NOT_ACCEPTED
    http_status: 422
    applies_to: "POST /routes/{id}/lock-scope, POST /pole-attachment-applications/{id}/submit"

  - priority: 21
    category: business_constraint
    check: "every RouteSegment on the design's route has permit_status == CLEARED"
    error_id: ERR_PERMIT_NOT_CLEARED
    http_status: 422
    applies_to: "POST /design-packages/{id}/stamp"

  - priority: 22
    category: business_constraint
    check: "DesignPackage.spare_ratio_bp >= MIN_SPARE_RATIO_BP (2000); exactly 2000 passes"
    error_id: ERR_SPARE_RATIO_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /design-packages/{id}/stamp"

  - priority: 23
    category: business_constraint
    check: "the drop would not push DesignPackage.reserve_fiber_count below zero"
    error_id: ERR_FIBER_ALLOCATION_EXCEEDED
    http_status: 422
    applies_to: "POST /splice-points"

  - priority: 24
    category: business_constraint
    check: "a STAMPED DesignPackage on this route with revision == design_revision exists"
    error_id: ERR_DESIGN_NOT_STAMPED
    http_status: 422
    applies_to: "POST /as-built-records"

  - priority: 25
    category: business_constraint
    check: "AsBuiltRecord.length_variance_bp <= MAX_AS_BUILT_VARIANCE_BP (500); exactly 500 passes"
    error_id: ERR_AS_BUILT_VARIANCE_EXCEEDED
    http_status: 422
    applies_to: "POST /as-built-records/{id}/certify with decision == ACCEPTED"

  - priority: 26
    category: business_fiscal
    check: "application.make_ready_cost_cents <= Route.budget_available_cents on accept-make-ready (strict > is the rejection), and a budget adjustment may not drive budget_authorized_cents below budget_committed_cents"
    error_id: ERR_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /pole-attachment-applications/{id}/accept-make-ready, POST /routes/{id}/budget-adjustments"

endpoints:
  # ---------------- Route ----------------
  - method: POST
    path: "/routes"
    description: "Create a fiber route in PLANNING with an authorized budget."
    roles: [RouteEngineer]
    code: 201
    input: [name, topology_objective, target_in_service_date, budget_authorized_cents]
    output: Route
    side_effects:
      - "status := PLANNING, segment_count := 0, design_total_length_feet := 0"
      - "runs calculations.route_budget_ledger: budget_committed_cents := 0, budget_available_cents := budget_authorized_cents"
      - "planned_complexity_index := null, live_complexity_index := null"

  - method: GET
    path: "/routes"
    description: "List routes with optional status / topology filters and pagination."
    roles: [RouteEngineer, FieldSurveyor, PermitCoordinator, AuthorityReviewer, PoleOwner, NetworkRecordsAdmin]
    code: 200
    input: ["status?", "topology_objective?", "limit?", "offset?"]
    output: Route[]
    side_effects: []

  - method: GET
    path: "/routes/{id}"
    description: "Read one route, including the current version needed for optimistic-concurrency writes."
    roles: [RouteEngineer, FieldSurveyor, PermitCoordinator, AuthorityReviewer, PoleOwner, NetworkRecordsAdmin]
    code: 200
    input: []
    output: Route
    side_effects: []

  - method: POST
    path: "/routes/{id}/budget-adjustments"
    description: "Raise or lower the route's authorized budget."
    roles: [NetworkRecordsAdmin]
    code: 200
    input: [delta_cents, reason]
    output: Route
    side_effects:
      - "budget_authorized_cents += delta_cents"
      - "re-runs calculations.route_budget_ledger, preserving budget_authorized_cents == budget_committed_cents + budget_available_cents"
      - "rejects with ERR_BUDGET_EXCEEDED when the result would fall below budget_committed_cents"
      - "increments Route.version by 1"

  - method: POST
    path: "/routes/{id}/lock-scope"
    description: "Freeze the route's segment set and compute the PLANNED permitting-complexity index."
    roles: [RouteEngineer]
    code: 200
    input: []
    output: Route
    side_effects:
      - "Route PLANNING -> SCOPE_LOCKED, scope_locked_at := current logical-clock instant"
      - "runs calculations.route_permitting_complexity_index variant PLANNED, writing planned_complexity_index and seeding live_complexity_index"
      - "increments Route.version by 1"

  - method: GET
    path: "/routes/{id}/segments"
    description: "List the route's segments (reverse lookup for RouteSegment.route_id)."
    roles: [RouteEngineer, FieldSurveyor, PermitCoordinator, AuthorityReviewer, PoleOwner, NetworkRecordsAdmin]
    code: 200
    input: ["engineering_status?", "permit_status?", "limit?", "offset?"]
    output: RouteSegment[]
    side_effects: []

  - method: GET
    path: "/routes/{id}/design-packages"
    description: "List the route's design packages (reverse lookup for DesignPackage.route_id)."
    roles: [RouteEngineer, FieldSurveyor, PermitCoordinator, AuthorityReviewer, PoleOwner, NetworkRecordsAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: DesignPackage[]
    side_effects: []

  - method: GET
    path: "/routes/{id}/as-built-records"
    description: "List the route's as-built records (reverse lookup for AsBuiltRecord.route_id)."
    roles: [RouteEngineer, FieldSurveyor, PermitCoordinator, AuthorityReviewer, PoleOwner, NetworkRecordsAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AsBuiltRecord[]
    side_effects: []

  # ---------------- RouteSegment ----------------
  - method: POST
    path: "/segments"
    description: "Add a segment to a route that is still in PLANNING."
    roles: [RouteEngineer]
    code: 201
    input: [route_id, sequence_index, street_name, municipality_code, length_feet, terrain_class, planned_work_start_on, planned_work_end_on, "predecessor_segment_id?", "existing_conduit_available?"]
    output: RouteSegment
    side_effects:
      - "engineering_status := DRAFT, permit_status := NOT_REQUIRED, construction_method := null"
      - "required_authority_type := AUTHORITY_BY_TERRAIN[terrain_class]"
      - "Route.segment_count += 1 and Route.design_total_length_feet += length_feet"
      - "increments Route.version by 1"

  - method: GET
    path: "/segments/{id}"
    description: "Read one segment with both state dimensions and both cost variants."
    roles: [RouteEngineer, FieldSurveyor, PermitCoordinator, AuthorityReviewer, PoleOwner, NetworkRecordsAdmin]
    code: 200
    input: []
    output: RouteSegment
    side_effects: []

  - method: GET
    path: "/segments/{id}/downstream-segments"
    description: "List segments whose predecessor_segment_id is this segment (reverse lookup for the self-reference)."
    roles: [RouteEngineer, FieldSurveyor, PermitCoordinator, AuthorityReviewer, PoleOwner, NetworkRecordsAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: RouteSegment[]
    side_effects: []

  - method: GET
    path: "/segments/{id}/walkouts"
    description: "List field walkouts for this segment (reverse lookup for FieldWalkout.segment_id)."
    roles: [RouteEngineer, FieldSurveyor, PermitCoordinator, AuthorityReviewer, PoleOwner, NetworkRecordsAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: FieldWalkout[]
    side_effects: []

  - method: GET
    path: "/segments/{id}/pole-attachment-applications"
    description: "List pole attachment applications for this segment (reverse lookup for PoleAttachmentApplication.segment_id)."
    roles: [RouteEngineer, FieldSurveyor, PermitCoordinator, AuthorityReviewer, PoleOwner, NetworkRecordsAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PoleAttachmentApplication[]
    side_effects: []

  - method: GET
    path: "/segments/{id}/permit-applications"
    description: "List permit applications for this segment (reverse lookup for PermitApplication.segment_id)."
    roles: [RouteEngineer, FieldSurveyor, PermitCoordinator, AuthorityReviewer, PoleOwner, NetworkRecordsAdmin]
    code: 200
    input: ["status?", "authority_type?", "limit?", "offset?"]
    output: PermitApplication[]
    side_effects: []

  - method: GET
    path: "/segments/{id}/splice-points"
    description: "List splice points sitting on this segment across all design revisions (reverse lookup for SplicePoint.segment_id)."
    roles: [RouteEngineer, FieldSurveyor, PermitCoordinator, AuthorityReviewer, PoleOwner, NetworkRecordsAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: SplicePoint[]
    side_effects: []

  - method: POST
    path: "/segments/{id}/construction-method"
    description: "Select or re-select the construction method, resolving the moratorium and the PRELIMINARY cost variant. Guarded by optimistic concurrency on Route.version."
    roles: [RouteEngineer]
    code: 200
    input: [method, expected_route_version]
    output: RouteSegment
    side_effects:
      - "engineering_status WALKED|METHOD_SELECTED -> METHOD_SELECTED"
      - "runs calculations.segment_restoration_cost, writing moratorium_class and restoration_cost_cents"
      - "runs calculations.segment_construction_cost variant PRELIMINARY, writing preliminary_cost_cents"
      - "bid_ready_cost_cents := null"
      - "recomputes Route.total_preliminary_cost_cents and Route.total_bid_ready_cost_cents"
      - "increments Route.version by 1"

  - method: POST
    path: "/segments/{id}/bid-ready-estimate"
    description: "Produce the BID_READY cost variant for the segment and lock the design."
    roles: [RouteEngineer]
    code: 200
    input: []
    output: RouteSegment
    side_effects:
      - "engineering_status METHOD_SELECTED -> DESIGN_LOCKED"
      - "runs calculations.segment_construction_cost variant BID_READY, writing bid_ready_cost_cents"
      - "recomputes Route.total_bid_ready_cost_cents"
      - "increments Route.version by 1"

  # ---------------- FieldWalkout / PoleObservation ----------------
  - method: POST
    path: "/walkouts"
    description: "Open a field walkout record on a segment."
    roles: [FieldSurveyor]
    code: 201
    input: [segment_id, walked_on, "obstruction_count?", "conduit_available_confirmed?", "surveyor_note?"]
    output: FieldWalkout
    side_effects:
      - "status := OPEN, review_round := 0, worst_pole_condition_grade := NONE, make_ready_flagged_pole_count := 0"

  - method: GET
    path: "/walkouts/{id}"
    description: "Read one walkout with its derived pole-condition rollups."
    roles: [RouteEngineer, FieldSurveyor, PermitCoordinator, AuthorityReviewer, PoleOwner, NetworkRecordsAdmin]
    code: 200
    input: []
    output: FieldWalkout
    side_effects: []

  - method: GET
    path: "/walkouts/{id}/pole-observations"
    description: "List pole observations recorded on this walkout (reverse lookup for PoleObservation.walkout_id)."
    roles: [RouteEngineer, FieldSurveyor, PermitCoordinator, AuthorityReviewer, PoleOwner, NetworkRecordsAdmin]
    code: 200
    input: ["requires_make_ready?", "limit?", "offset?"]
    output: PoleObservation[]
    side_effects: []

  - method: POST
    path: "/pole-observations"
    description: "Append an immutable pole-condition observation to an OPEN walkout."
    roles: [FieldSurveyor]
    code: 201
    input: [walkout_id, pole_tag, pole_owner, condition_grade, available_vertical_clearance_in, existing_attachment_count]
    output: PoleObservation
    side_effects:
      - "requires_make_ready := condition_grade IN {C, D} OR available_vertical_clearance_in < 40"
      - "recomputes FieldWalkout.worst_pole_condition_grade and FieldWalkout.make_ready_flagged_pole_count"
      - "increments FieldWalkout.version by 1"

  - method: POST
    path: "/walkouts/{id}/submit"
    description: "Submit an OPEN walkout for engineering review, or reopen-and-resubmit a REJECTED one."
    roles: [FieldSurveyor]
    code: 200
    input: []
    output: FieldWalkout
    side_effects:
      - "FieldWalkout OPEN -> SUBMITTED (a REJECTED walkout passes through OPEN inside the same request)"
      - "increments FieldWalkout.version by 1"

  - method: POST
    path: "/walkouts/{id}/review"
    description: "Accept or reject a submitted walkout. Rejection runs rewalk_rejection_cascade."
    roles: [RouteEngineer]
    code: 200
    input: [decision, "rejection_reason?"]
    output: FieldWalkout
    side_effects:
      - "decision ACCEPTED: FieldWalkout -> ACCEPTED and RouteSegment engineering_status DRAFT -> WALKED, copying obstruction_count and conduit_available_confirmed onto the segment"
      - "decision REJECTED: runs rewalk_rejection_cascade hops 1-5 (walkout REJECTED -> segment DRAFT -> segment cost fields cleared -> Route cost rollups recomputed -> Route.status PLANNING)"
      - "increments FieldWalkout.version by 1"

  # ---------------- PoleAttachmentApplication / MakeReadyItem ----------------
  - method: POST
    path: "/pole-attachment-applications"
    description: "Draft a pole attachment application against a segment."
    roles: [PermitCoordinator]
    code: 201
    input: [segment_id, pole_owner, pole_count]
    output: PoleAttachmentApplication
    side_effects:
      - "status := DRAFT, revision_round := 0, committed := false, all make_ready_* fields := null"

  - method: GET
    path: "/pole-attachment-applications/{id}"
    description: "Read one pole attachment application with its make-ready cost breakdown."
    roles: [RouteEngineer, FieldSurveyor, PermitCoordinator, AuthorityReviewer, PoleOwner, NetworkRecordsAdmin]
    code: 200
    input: []
    output: PoleAttachmentApplication
    side_effects: []

  - method: GET
    path: "/pole-attachment-applications/{id}/make-ready-items"
    description: "List the make-ready lines the pole owner returned (reverse lookup for MakeReadyItem.application_id)."
    roles: [RouteEngineer, FieldSurveyor, PermitCoordinator, AuthorityReviewer, PoleOwner, NetworkRecordsAdmin]
    code: 200
    input: ["work_class?", "limit?", "offset?"]
    output: MakeReadyItem[]
    side_effects: []

  - method: POST
    path: "/pole-attachment-applications/{id}/submit"
    description: "Submit (or resubmit after a revision request) the application to the pole owner."
    roles: [PermitCoordinator]
    code: 200
    input: []
    output: PoleAttachmentApplication
    side_effects:
      - "status DRAFT|REVISION_REQUESTED -> SUBMITTED, submitted_at := current logical-clock instant"
      - "increments PoleAttachmentApplication.version by 1"

  - method: POST
    path: "/pole-attachment-applications/{id}/owner-response"
    description: "Pole owner returns a make-ready estimate, requests a revision, or denies the application. make_ready_items is an array of { pole_tag, work_class, quantity } objects."
    roles: [PoleOwner]
    code: 200
    input: [outcome, "make_ready_items?", "owner_note?"]
    output: PoleAttachmentApplication
    side_effects:
      - "outcome ESTIMATED: replaces the application's MakeReadyItem set and runs calculations.make_ready_cost_and_schedule, writing make_ready_items_subtotal_cents, make_ready_admin_fee_bp, make_ready_admin_fee_cents, make_ready_cost_cents and make_ready_days; status -> MAKE_READY_ESTIMATED"
      - "outcome REVISION_REQUESTED: revision_round += 1, status -> REVISION_REQUESTED"
      - "outcome DENIED: status -> DENIED"
      - "increments PoleAttachmentApplication.version by 1"

  - method: POST
    path: "/pole-attachment-applications/{id}/accept-make-ready"
    description: "Accept the make-ready estimate, granting the attachment and committing budget."
    roles: [PermitCoordinator]
    code: 200
    input: []
    output: PoleAttachmentApplication
    side_effects:
      - "status MAKE_READY_ESTIMATED -> GRANTED, committed := true"
      - "runs calculations.route_budget_ledger: Route.budget_committed_cents += make_ready_cost_cents, Route.budget_available_cents -= make_ready_cost_cents"
      - "re-runs calculations.segment_construction_cost variant BID_READY when the segment is DESIGN_LOCKED, then recomputes Route.total_bid_ready_cost_cents"
      - "increments Route.version by 1"

  - method: POST
    path: "/pole-attachment-applications/{id}/withdraw"
    description: "Withdraw the application, releasing any committed make-ready budget. Runs attachment_withdrawal_cascade."
    roles: [PermitCoordinator]
    code: 200
    input: ["reason?"]
    output: PoleAttachmentApplication
    side_effects:
      - "status -> WITHDRAWN, committed := false"
      - "runs attachment_withdrawal_cascade hops 1-4 (release commitment -> re-run route_budget_ledger -> re-run segment BID_READY cost -> recompute Route.total_bid_ready_cost_cents)"
      - "increments Route.version by 1"

  # ---------------- PermitApplication ----------------
  - method: POST
    path: "/permit-applications"
    description: "Draft a permit application against one authority for one segment."
    roles: [PermitCoordinator]
    code: 201
    input: [segment_id, authority_type, authority_name, work_window_start_on, work_window_end_on]
    output: PermitApplication
    side_effects:
      - "status := DRAFT, revision_round := 0, review_days := null, decision_due_at := null, deemed := false"

  - method: GET
    path: "/permit-applications/{id}"
    description: "Read one permit application with its computed review schedule."
    roles: [RouteEngineer, FieldSurveyor, PermitCoordinator, AuthorityReviewer, PoleOwner, NetworkRecordsAdmin]
    code: 200
    input: []
    output: PermitApplication
    side_effects: []

  - method: POST
    path: "/permit-applications/{id}/submit"
    description: "File the permit with its authority, computing the review cycle and decision deadline."
    roles: [PermitCoordinator]
    code: 200
    input: []
    output: PermitApplication
    side_effects:
      - "status DRAFT|REVISION_REQUESTED -> UNDER_REVIEW, submitted_at := current logical-clock instant"
      - "runs calculations.permit_review_schedule, writing review_days and decision_due_at"
      - "RouteSegment permit_status NOT_REQUIRED|CLEARED|BLOCKED -> PENDING"
      - "Route SCOPE_LOCKED -> PERMITTING on the route's first submit"
      - "runs calculations.route_permitting_complexity_index variant LIVE"
      - "increments Route.version by 1"

  - method: POST
    path: "/permit-applications/{id}/review"
    description: "Authority decides the permit: APPROVED, DENIED or REVISION_REQUESTED. Denial runs permit_denial_cascade."
    roles: [AuthorityReviewer]
    code: 200
    input: [decision, "decision_note?"]
    output: PermitApplication
    side_effects:
      - "decision APPROVED: RouteSegment permit_status -> CLEARED when the segment has no permit left IN {UNDER_REVIEW, REVISION_REQUESTED}; Route may advance PERMITTING -> CONSTRUCTION_READY"
      - "decision REVISION_REQUESTED: revision_round += 1, segment stays PENDING"
      - "decision DENIED: runs permit_denial_cascade hops 1-5 (permit DENIED -> segment BLOCKED -> segment DESIGN_LOCKED released -> STAMPED design voided to DRAFT -> Route CONSTRUCTION_READY -> PERMITTING)"
      - "runs calculations.route_permitting_complexity_index variant LIVE"
      - "increments Route.version by 1"

  - method: POST
    path: "/permit-applications/{id}/deemed-decision"
    description: "Claim the statutory outcome after the authority's review window has lapsed. Requires the logical clock to be strictly past decision_due_at."
    roles: [PermitCoordinator]
    code: 200
    input: []
    output: PermitApplication
    side_effects:
      - "authority_type MUNICIPAL_ROW: UNDER_REVIEW -> APPROVED with deemed := true"
      - "authority_type RAILROAD|STATE_HIGHWAY|WATERWAY: UNDER_REVIEW -> DENIED with deemed := true, running permit_denial_cascade hops 2-5"
      - "runs calculations.route_permitting_complexity_index variant LIVE"
      - "increments Route.version by 1"

  # ---------------- MoratoriumWindow ----------------
  - method: POST
    path: "/moratorium-windows"
    description: "Register a paving moratorium on a street."
    roles: [NetworkRecordsAdmin]
    code: 201
    input: [municipality_code, street_name, resurfaced_on, starts_on, ends_on, moratorium_class, ordinance_reference]
    output: MoratoriumWindow
    side_effects:
      - "rejects with ERR_MORATORIUM_WINDOW_OVERLAP when the closed interval intersects an existing window on the same municipality_code and street_name"

  - method: GET
    path: "/moratorium-windows"
    description: "List moratorium windows, optionally filtered by municipality and street."
    roles: [RouteEngineer, FieldSurveyor, PermitCoordinator, AuthorityReviewer, PoleOwner, NetworkRecordsAdmin]
    code: 200
    input: ["municipality_code?", "street_name?", "limit?", "offset?"]
    output: MoratoriumWindow[]
    side_effects: []

  # ---------------- DesignPackage / SplicePoint ----------------
  - method: POST
    path: "/design-packages"
    description: "Create the next design revision for a route. Guarded by optimistic concurrency on Route.version."
    roles: [RouteEngineer]
    code: 201
    input: [route_id, fiber_count_allocated, express_fiber_count, expected_route_version]
    output: DesignPackage
    side_effects:
      - "revision := 1 + count of existing DesignPackage rows on this route_id; status := DRAFT"
      - "runs calculations.design_fiber_allocation with an empty splice-point set: assigned_drop_fiber_count := 0, reserve_fiber_count := fiber_count_allocated - express_fiber_count"
      - "increments Route.version by 1"

  - method: GET
    path: "/design-packages/{id}"
    description: "Read one design package with its fiber-allocation rollups."
    roles: [RouteEngineer, FieldSurveyor, PermitCoordinator, AuthorityReviewer, PoleOwner, NetworkRecordsAdmin]
    code: 200
    input: []
    output: DesignPackage
    side_effects: []

  - method: GET
    path: "/design-packages/{id}/splice-points"
    description: "List splice points on this design revision (reverse lookup for SplicePoint.design_id)."
    roles: [RouteEngineer, FieldSurveyor, PermitCoordinator, AuthorityReviewer, PoleOwner, NetworkRecordsAdmin]
    code: 200
    input: ["status?", "enclosure_type?", "limit?", "offset?"]
    output: SplicePoint[]
    side_effects: []

  - method: POST
    path: "/splice-points"
    description: "Place a splice enclosure at a station on a segment and drop fibers there."
    roles: [RouteEngineer]
    code: 201
    input: [design_id, segment_id, station_feet, enclosure_type, fiber_count_dropped]
    output: SplicePoint
    side_effects:
      - "status := PLACED"
      - "enforces the MIN_SPLICE_SPACING_FEET buffer against PLACED siblings on the same design_id and segment_id"
      - "runs calculations.design_fiber_allocation, updating assigned_drop_fiber_count, reserve_fiber_count, spare_ratio_bp, splice_point_count and handhole_count"
      - "increments DesignPackage.version by 1"

  - method: POST
    path: "/splice-points/{id}/void"
    description: "Void a placed splice point, returning its dropped fibers to the future-customer reserve."
    roles: [RouteEngineer]
    code: 200
    input: []
    output: SplicePoint
    side_effects:
      - "status PLACED -> VOIDED, voided_at := current logical-clock instant"
      - "re-runs calculations.design_fiber_allocation, restoring reserve_fiber_count exactly"
      - "increments DesignPackage.version by 1"

  - method: POST
    path: "/design-packages/{id}/submit-for-review"
    description: "Submit a draft design for peer review, recording the submitting engineer for segregation of duties."
    roles: [RouteEngineer]
    code: 200
    input: []
    output: DesignPackage
    side_effects:
      - "status DRAFT -> IN_REVIEW, submitted_by_user_id := X-User-ID"
      - "increments DesignPackage.version by 1"

  - method: POST
    path: "/design-packages/{id}/stamp"
    description: "Stamp the design. A different engineer than the submitter must stamp; every segment must be permit-cleared and the spare-fiber ratio must meet the minimum."
    roles: [RouteEngineer]
    code: 200
    input: []
    output: DesignPackage
    side_effects:
      - "status IN_REVIEW -> STAMPED, stamped_by_user_id := X-User-ID, stamped_at := current logical-clock instant"
      - "moves any other STAMPED package on the route to SUPERSEDED"
      - "Route PERMITTING -> CONSTRUCTION_READY when every segment is CLEARED"
      - "increments Route.version by 1"

  - method: POST
    path: "/design-packages/{id}/return-to-draft"
    description: "Return a design under review to draft with a note."
    roles: [RouteEngineer]
    code: 200
    input: [return_note]
    output: DesignPackage
    side_effects:
      - "status IN_REVIEW -> DRAFT, return_note := return_note, submitted_by_user_id := null"
      - "increments DesignPackage.version by 1"

  # ---------------- AsBuiltRecord ----------------
  - method: POST
    path: "/as-built-records"
    description: "File field as-built documentation against a stamped design revision."
    roles: [FieldSurveyor]
    code: 201
    input: [route_id, design_revision, as_built_length_feet, splice_point_count_field_verified, records_system_reference]
    output: AsBuiltRecord
    side_effects:
      - "status := SUBMITTED, submitted_by_user_id := X-User-ID"
      - "runs calculations.as_built_length_variance, writing length_variance_bp"

  - method: GET
    path: "/as-built-records/{id}"
    description: "Read one as-built record with its length variance."
    roles: [RouteEngineer, FieldSurveyor, PermitCoordinator, AuthorityReviewer, PoleOwner, NetworkRecordsAdmin]
    code: 200
    input: []
    output: AsBuiltRecord
    side_effects: []

  - method: POST
    path: "/as-built-records/{id}/certify"
    description: "Certify or reject the as-built. The engineer who stamped the design may not certify it."
    roles: [RouteEngineer]
    code: 200
    input: [decision, "certification_note?"]
    output: AsBuiltRecord
    side_effects:
      - "status SUBMITTED -> ACCEPTED|REJECTED, certified_by_user_id := X-User-ID"
      - "decision ACCEPTED: Route CONSTRUCTION_READY -> RECORDS_UPDATED"
      - "increments AsBuiltRecord.version by 1"

  # ---------------- test-driving surface ----------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time; every deadline, moratorium containment test and review-window comparison is evaluated against this logical clock."
    roles: [NetworkRecordsAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "sets the logical clock; no entity is mutated and no auto-transition is evaluated"

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, blank, or naming an undeclared role"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "authenticated role is not listed in the endpoint's roles"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required body field, unknown field, enum value outside the declared set, non-positive integer where >= 1 is required, unparseable date or instant, or a violated field-pair ordering constraint"
  - id: ERR_ROUTE_NOT_FOUND
    http: 404
    condition: "route id in the path or route_id in the body matches no Route"
  - id: ERR_SEGMENT_NOT_FOUND
    http: 404
    condition: "segment id in the path or segment_id / predecessor_segment_id in the body matches no RouteSegment"
  - id: ERR_WALKOUT_NOT_FOUND
    http: 404
    condition: "walkout id in the path or walkout_id in the body matches no FieldWalkout"
  - id: ERR_POLE_APPLICATION_NOT_FOUND
    http: 404
    condition: "application id in the path matches no PoleAttachmentApplication"
  - id: ERR_PERMIT_NOT_FOUND
    http: 404
    condition: "permit id in the path matches no PermitApplication"
  - id: ERR_DESIGN_NOT_FOUND
    http: 404
    condition: "design id in the path or design_id in the body matches no DesignPackage"
  - id: ERR_SPLICE_POINT_NOT_FOUND
    http: 404
    condition: "splice point id in the path matches no SplicePoint"
  - id: ERR_AS_BUILT_NOT_FOUND
    http: 404
    condition: "as-built id in the path matches no AsBuiltRecord"
  - id: ERR_STALE_ROUTE_VERSION
    http: 412
    condition: "expected_route_version does not equal the current Route.version"
  - id: ERR_INVALID_ROUTE_STATE
    http: 409
    condition: "Route.status does not permit the requested operation (for example filing a permit while the route is still PLANNING, or filing an as-built before CONSTRUCTION_READY)"
  - id: ERR_SCOPE_LOCKED
    http: 409
    condition: "POST /segments for a route whose status is no longer PLANNING"
  - id: ERR_SEQUENCE_INDEX_TAKEN
    http: 409
    condition: "another RouteSegment on the same route already uses the requested sequence_index"
  - id: ERR_PREDECESSOR_SEGMENT_MISMATCH
    http: 422
    condition: "predecessor_segment_id names a segment on a different route or with a sequence_index that is not lower than the new segment's"
  - id: ERR_INVALID_SEGMENT_ENGINEERING_STATE
    http: 409
    condition: "the segment's engineering_status does not permit the requested engineering action"
  - id: ERR_INVALID_WALKOUT_STATE
    http: 409
    condition: "the walkout's status does not permit submit or review"
  - id: ERR_INVALID_POLE_APPLICATION_STATE
    http: 409
    condition: "the pole attachment application's status does not permit submit, owner-response, accept-make-ready or withdraw"
  - id: ERR_INVALID_PERMIT_STATE
    http: 409
    condition: "the permit's status does not permit submit, review or deemed-decision"
  - id: ERR_INVALID_DESIGN_STATE
    http: 409
    condition: "the design package's status does not permit submit-for-review, stamp, return-to-draft, or splice-point placement / voiding"
  - id: ERR_INVALID_SPLICE_POINT_STATE
    http: 409
    condition: "the splice point is already VOIDED"
  - id: ERR_INVALID_AS_BUILT_STATE
    http: 409
    condition: "the as-built record is already ACCEPTED or REJECTED"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-ID submitted the design it is trying to stamp, or stamped the design behind the as-built it is trying to certify"
  - id: ERR_OPEN_CUT_PROHIBITED
    http: 422
    condition: "construction method TRENCH selected on a segment whose resolved moratorium_class is NO_OPEN_CUT"
  - id: ERR_MAKE_READY_REQUIRED
    http: 422
    condition: "make-ready acceptance attempted while a grade-D pole documented on the segment's ACCEPTED walkout has no POLE_REPLACEMENT make-ready line"
  - id: ERR_MORATORIUM_WINDOW_CONFLICT
    http: 409
    condition: "the permit's closed work window intersects a moratorium window on the segment's municipality_code and street_name"
  - id: ERR_MORATORIUM_WINDOW_OVERLAP
    http: 409
    condition: "a new moratorium window's closed interval intersects an existing window on the same municipality_code and street_name"
  - id: ERR_REVIEW_WINDOW_OPEN
    http: 409
    condition: "deemed-decision requested while the logical clock is at or before decision_due_at"
  - id: ERR_SPLICE_SPACING_VIOLATION
    http: 422
    condition: "a new splice point sits strictly closer than MIN_SPLICE_SPACING_FEET to a PLACED splice point on the same design and segment"
  - id: ERR_ROUTE_HAS_NO_SEGMENTS
    http: 422
    condition: "lock-scope attempted on a route with zero segments"
  - id: ERR_WALKOUT_HAS_NO_OBSERVATIONS
    http: 422
    condition: "walkout submit attempted with zero PoleObservation rows"
  - id: ERR_DESIGN_HAS_NO_SPLICE_POINTS
    http: 422
    condition: "design submit-for-review attempted with zero PLACED splice points"
  - id: ERR_WALKOUT_NOT_ACCEPTED
    http: 422
    condition: "an operation requiring a field-verified segment ran against a segment whose engineering_status is still DRAFT"
  - id: ERR_PERMIT_NOT_CLEARED
    http: 422
    condition: "design stamp attempted while at least one segment on the route is not permit_status CLEARED"
  - id: ERR_SPARE_RATIO_BELOW_MINIMUM
    http: 422
    condition: "design stamp attempted while spare_ratio_bp is below MIN_SPARE_RATIO_BP"
  - id: ERR_FIBER_ALLOCATION_EXCEEDED
    http: 422
    condition: "a splice point's fiber_count_dropped would push the design's reserve_fiber_count below zero"
  - id: ERR_DESIGN_NOT_STAMPED
    http: 422
    condition: "as-built filed against a design_revision that has no STAMPED DesignPackage on the route"
  - id: ERR_AS_BUILT_VARIANCE_EXCEEDED
    http: 422
    condition: "as-built certification with decision ACCEPTED while length_variance_bp exceeds MAX_AS_BUILT_VARIANCE_BP"
  - id: ERR_BUDGET_EXCEEDED
    http: 402
    condition: "make-ready acceptance whose make_ready_cost_cents exceeds Route.budget_available_cents, or a budget adjustment that would drive budget_authorized_cents below budget_committed_cents"

roles:
  - name: RouteEngineer
    description: "Owns route definition, segment engineering, construction-method selection, design production and as-built certification."
    identity: opaque
    exclusive_operations:
      - "POST /routes"
      - "POST /segments"
      - "POST /routes/{id}/lock-scope"
      - "POST /segments/{id}/construction-method"
      - "POST /segments/{id}/bid-ready-estimate"
      - "POST /walkouts/{id}/review"
      - "POST /design-packages"
      - "POST /splice-points"
      - "POST /splice-points/{id}/void"
      - "POST /design-packages/{id}/submit-for-review"
      - "POST /design-packages/{id}/stamp"
      - "POST /design-packages/{id}/return-to-draft"
      - "POST /as-built-records/{id}/certify"
    shared_operations:
      - "every GET endpoint"
    note: "Segregation of duties is enforced on X-User-ID, not on the role: the engineer who submitted a design may not stamp it, and the engineer who stamped it may not certify the resulting as-built."

  - name: FieldSurveyor
    description: "Performs field walkouts, documents pole condition, conduit availability and obstructions, and files as-built documentation."
    identity: opaque
    exclusive_operations:
      - "POST /walkouts"
      - "POST /pole-observations"
      - "POST /walkouts/{id}/submit"
      - "POST /as-built-records"
    shared_operations:
      - "every GET endpoint"

  - name: PermitCoordinator
    description: "Files pole attachment applications and right-of-way permits, accepts make-ready estimates and claims lapsed-review outcomes."
    identity: opaque
    exclusive_operations:
      - "POST /pole-attachment-applications"
      - "POST /pole-attachment-applications/{id}/submit"
      - "POST /pole-attachment-applications/{id}/accept-make-ready"
      - "POST /pole-attachment-applications/{id}/withdraw"
      - "POST /permit-applications"
      - "POST /permit-applications/{id}/submit"
      - "POST /permit-applications/{id}/deemed-decision"
    shared_operations:
      - "every GET endpoint"

  - name: AuthorityReviewer
    description: "Acts for the municipal, railroad, highway or waterway agency reviewing a permit application."
    identity: opaque
    exclusive_operations:
      - "POST /permit-applications/{id}/review"
    shared_operations:
      - "every GET endpoint"

  - name: PoleOwner
    description: "Acts for the utility that owns the poles, returning make-ready estimates, revision requests or denials."
    identity: opaque
    exclusive_operations:
      - "POST /pole-attachment-applications/{id}/owner-response"
    shared_operations:
      - "every GET endpoint"

  - name: NetworkRecordsAdmin
    description: "Maintains municipal moratorium records, route budget authorizations and the server's logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /moratorium-windows"
      - "POST /routes/{id}/budget-adjustments"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "every GET endpoint"
