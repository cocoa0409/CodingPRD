  - rule_id: compensating_invariant
    instances:
      - name: batch_hour_budget_conserved_across_invalidation_withdrawal
        grounds:
          - calculations.batch_hour_accounting
          - state_machines.DataInvalidation.APPLIED_to_WITHDRAWN
          - entities.DataBatch.fields.valid_hour_count
          - entities.DataBatch.fields.excused_hour_count
          - entities.DataBatch.fields.invalidated_hour_count
          - entities.DataBatch.fields.event_excluded_hour_count
        distinguishing_aspect: |
          Conserved quantity 1 - the quarter's hour budget, an integer count of sampling hours on a single DataBatch:
          scheduled_hour_count == valid_hour_count + invalidated_hour_count + excused_hour_count + event_excluded_hour_count
          holds at 2160 both while a 100-hour QC_FAILURE invalidation is APPLIED alongside a 60-hour excused one and after the
          QC_FAILURE row is withdrawn, with completeness_pct returning from 95.2 to 100.0 and no hour lost to drift.
        test_recipe:
          setup:
            - "logical clock at 2026-01-05T00:00:00Z"
            - "one RAW 2025 Q1 quarter with scheduled_hour_count 2160"
            - "an APPLIED QC_FAILURE invalidation over hours 0..99 and an APPLIED SCHEDULED_MAINTENANCE invalidation over hours 200..259"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /pollutants"
              payload: { code: "PM25", averaging_period_hours: 24, standard_form: "ANNUAL_MEAN", primary_standard_value: 9.0, design_value_years: 3, completeness_threshold_pct: 75.0, rounding_decimals: 1 }
              as: NetworkAdmin
              captures: { pm25_id: "$.data.id" }
            - call: "POST /reference-methods"
              payload: { pollutant_id: "${pm25_id}", method_code: "RFPS-0617-001", designation_type: "FRM", effective_from: "2020-01-01T00:00:00Z", max_span_drift_pct: 5.0, zero_drift_limit: 1.5, required_span_check_interval_days: 14, required_calibration_interval_days: 365 }
              as: NetworkAdmin
              captures: { frm_id: "$.data.id" }
            - call: "POST /monitoring-networks"
              payload: { name: "State Ambient Network", agency_code: "AQ01", metropolitan_population: 1200000 }
              as: NetworkAdmin
              captures: { net_id: "$.data.id" }
            - call: "POST /monitoring-sites"
              payload: { network_id: "${net_id}", site_code: "S-001", site_type: "POPULATION_ORIENTED", latitude: 39.75, longitude: -104.99, population_served: 400000, probe_height_m: 4.0, distance_to_roadway_m: 25.0, distance_to_obstruction_m: 12.0, obstruction_height_m: 6.0, distance_to_source_m: 0.0 }
              as: NetworkAdmin
              captures: { site_a_id: "$.data.id" }
            - call: "POST /monitoring-sites/${site_a_id}/siting-approval"
              payload: { waiver_granted: false }
              as: EpaRegionalReviewer
            - call: "POST /monitoring-sites/${site_a_id}/commence-operations"
              payload: {}
              as: ProgramManager
            - call: "POST /monitors"
              payload: { site_id: "${site_a_id}", reference_method_id: "${frm_id}", poc: 1, is_primary_for_design_value: true, installed_at: "2022-12-20T00:00:00Z" }
              as: NetworkAdmin
              captures: { mon_id: "$.data.id" }
            - call: "POST /monitors/${mon_id}/approve"
              payload: {}
              as: EpaRegionalReviewer
            - call: "POST /monitors/${mon_id}/commission"
              payload: {}
              as: FieldTechnician
            - call: "POST /monitors/${mon_id}/qc-events"
              payload: { event_type: "SPAN_CHECK", performed_at: "2026-01-02T00:00:00Z", span_drift_pct: 2.0 }
              as: FieldTechnician
            - call: "POST /data-batches"
              payload: { monitor_id: "${mon_id}", year: 2025, quarter: 1, scheduled_hour_count: 2160, quarterly_mean_concentration: 9.0 }
              as: QaOfficer
              as_user_id: "qa-1"
              captures: { batch_id: "$.data.id", batch_v0: "$.data.version" }
            - call: "POST /data-batches/${batch_id}/invalidations"
              payload: { start_hour_index: 0, end_hour_index: 100, invalidation_code: "QC_FAILURE", expected_data_batch_version: "${batch_v0}" }
              as: QaOfficer
              as_user_id: "qa-1"
              captures: { inv_fail_id: "$.data.id" }
            - call: "GET /data-batches/${batch_id}"
              payload: {}
              as: QaOfficer
              captures: { batch_v1: "$.data.version" }
            - call: "POST /data-batches/${batch_id}/invalidations"
              payload: { start_hour_index: 200, end_hour_index: 260, invalidation_code: "SCHEDULED_MAINTENANCE", expected_data_batch_version: "${batch_v1}" }
              as: QaOfficer
              as_user_id: "qa-1"
              captures: { inv_exc_id: "$.data.id" }
          trigger:
            - call: "POST /data-invalidations/${inv_fail_id}/withdraw"
              payload: { withdrawn_reason: "Re-analysis showed the analyser was within tolerance" }
              as: QaOfficer
              as_user_id: "qa-1"
          assert:
            - "before the withdrawal: DataBatch.${batch_id}.excused_hour_count == 60 and DataBatch.${batch_id}.invalidated_hour_count == 100"
            - "before the withdrawal: DataBatch.${batch_id}.adjusted_scheduled_hour_count == 2100 and DataBatch.${batch_id}.valid_hour_count == 2000"
            - "before the withdrawal: DataBatch.${batch_id}.completeness_pct == 95.2"
            - "before the withdrawal: 2160 == 2000 + 100 + 60 + 0"
            - "after the withdrawal: DataInvalidation.${inv_fail_id}.status == WITHDRAWN"
            - "after the withdrawal: DataInvalidation.${inv_exc_id}.status == APPLIED"
            - "after the withdrawal: DataBatch.${batch_id}.invalidated_hour_count == 0 and DataBatch.${batch_id}.excused_hour_count == 60"
            - "after the withdrawal: DataBatch.${batch_id}.valid_hour_count == 2100 and DataBatch.${batch_id}.event_excluded_hour_count == 0"
            - "after the withdrawal: DataBatch.${batch_id}.completeness_pct == 100.0 and DataBatch.${batch_id}.regulatory_use_eligible == true"
            - "after the withdrawal: 2160 == 2100 + 0 + 60 + 0"

      - name: network_site_census_conserved_across_suspension_and_reinstatement
        grounds:
          - state_machines.MonitoringSite.OPERATING_to_SUSPENDED
          - state_machines.MonitoringSite.SUSPENDED_to_OPERATING
          - entities.MonitoringNetwork.fields.total_site_count
          - entities.MonitoringNetwork.fields.operating_site_count
          - entities.MonitoringNetwork.fields.suspended_site_count
          - entities.Monitor.fields.out_of_service_day_count
        distinguishing_aspect: |
          Conserved quantity 2 - the network's site census, a partition of row counts across six lifecycle buckets on
          MonitoringNetwork rather than hours on one row: total_site_count == proposed + approved + operating + suspended +
          shutdown + relocated stays 1 through the SEASONAL_SUSPENSION approval and the compensating reinstatement, and the
          bucket the single site occupies returns exactly to operating_site_count 1 with no double count.
