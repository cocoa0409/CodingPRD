            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T10:00:01Z" }, as: SystemAdmin }
            - { call: "POST /api/response-letters/${ly}/issue", payload: {}, as: IntakeCoordinator }
            - { call: "GET /api/patient-cases/${cx}", as: IntakeCoordinator, captures: { tx: $.data.resolution_timeliness } }
            - { call: "GET /api/patient-cases/${cy}", as: IntakeCoordinator, captures: { ty: $.data.resolution_timeliness } }
          assert:
            - "ix_at == '2026-09-02T10:00:00Z' == response_due_calendar_at exactly; tx == 'ON_TIME' (equality is <=, not breach)"
            - "ty == 'LATE' (issued one second after the deadline)"

      - name: recovery_cap_exact_equality_allowed_plus_one_rejected
        grounds:
          - calculations.recovery_cap_check
          - validations[priority=9]
          - errors[ERR_RECOVERY_CASE_CAP_EXCEEDED]
        distinguishing_aspect: |
          Metric = cumulative integer cents on the recovery-action endpoint (different metric,
          different endpoint than the deadline instance): cumulative ISSUED == 50000 exactly is
          ALLOWED (strict > cap); the next 1-cent action pushes to 50001 and is rejected.
        test_recipe:
          setup:
            - "Advocate adv with default issuance limit 10000; case in INTAKE"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/hospital-units", payload: { name: "ED South", category: "EMERGENCY" }, as: SystemAdmin, captures: { u1: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Ally Advocate", capabilities: ["ADVOCATE"] }, as: SystemAdmin, captures: { adv: $.data.id } }
            - { call: "POST /api/patient-cases", payload: { patient_ref: "P-8003", unit_id: "${u1}", received_at: "2026-08-03T09:00:00Z", channel: "IN_PERSON", description: "Parking fee frustration", grievance_category: "BILLING" }, as: IntakeCoordinator, captures: { c1: $.data.id } }
            - { call: "POST /api/patient-cases/${c1}/recovery-actions", payload: { action_type: "PARKING_COMP", value_cents: 10000, justification: "Parking comp for long wait one" }, as: PatientAdvocate, as_user_id: "${adv}" }
            - { call: "POST /api/patient-cases/${c1}/recovery-actions", payload: { action_type: "MEAL_VOUCHER", value_cents: 10000, justification: "Meal voucher during delay two" }, as: PatientAdvocate, as_user_id: "${adv}" }
            - { call: "POST /api/patient-cases/${c1}/recovery-actions", payload: { action_type: "MEAL_VOUCHER", value_cents: 10000, justification: "Meal voucher during delay three" }, as: PatientAdvocate, as_user_id: "${adv}" }
            - { call: "POST /api/patient-cases/${c1}/recovery-actions", payload: { action_type: "GOODWILL_GESTURE", value_cents: 10000, justification: "Goodwill gesture for inconvenience four" }, as: PatientAdvocate, as_user_id: "${adv}" }
          trigger:
            - { call: "POST /api/patient-cases/${c1}/recovery-actions", payload: { action_type: "GOODWILL_GESTURE", value_cents: 10000, justification: "Fifth gesture reaches the cap exactly" }, as: PatientAdvocate, as_user_id: "${adv}", captures: { st5: $.data.status } }
            - { call: "GET /api/patient-cases/${c1}", as: PatientAdvocate, as_user_id: "${adv}", captures: { out_c: $.data.outstanding_recovery_cents } }
            - { call: "POST /api/patient-cases/${c1}/recovery-actions", payload: { action_type: "MEAL_VOUCHER", value_cents: 1, justification: "One cent over the case cap" }, as: PatientAdvocate, as_user_id: "${adv}", captures: { err: $.data.error_id } }
          assert:
            - "st5 == 'ISSUED' (projected 50000 == CASE_CAP is allowed; boundary is strict >)"
            - "out_c == 50000"
            - "err == 'ERR_RECOVERY_CASE_CAP_EXCEEDED' (projected 50001 > 50000)"

      - name: third_grievance_triggers_systemic_escalation
        grounds:
          - calculations.systemic_issue_threshold
          - state_machines.QualityRiskEscalation
          - entities.QualityRiskEscalation.fields.source
        distinguishing_aspect: |
          Metric = rolling 30-day grievance count per unit+category on the classification
          endpoint (third distinct metric/endpoint): the 2nd grievance triggers nothing; the
          3rd (>= 3, inclusive) auto-creates exactly one SYSTEMIC escalation; a 4th does not
          duplicate while the first is open.
        test_recipe:
          setup:
            - "Unit U, category STAFF_CONDUCT; four cases all received 2026-08-05T09:00:00Z; clock 2026-08-10T12:00:00Z (all inside the rolling 30-day window)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T12:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/hospital-units", payload: { name: "Stepdown 3", category: "INPATIENT" }, as: SystemAdmin, captures: { u1: $.data.id } }
            - { call: "POST /api/patient-cases", payload: { patient_ref: "P-8101", unit_id: "${u1}", received_at: "2026-08-05T09:00:00Z", channel: "PHONE", description: "Nurse rudeness one", grievance_category: "STAFF_CONDUCT" }, as: IntakeCoordinator, captures: { c1: $.data.id, c1v: $.data.version } }
            - { call: "POST /api/patient-cases", payload: { patient_ref: "P-8102", unit_id: "${u1}", received_at: "2026-08-05T09:00:00Z", channel: "EMAIL", description: "Nurse rudeness two", grievance_category: "STAFF_CONDUCT" }, as: IntakeCoordinator, captures: { c2: $.data.id, c2v: $.data.version } }
            - { call: "POST /api/patient-cases", payload: { patient_ref: "P-8103", unit_id: "${u1}", received_at: "2026-08-05T09:00:00Z", channel: "PORTAL", description: "Nurse rudeness three", grievance_category: "STAFF_CONDUCT" }, as: IntakeCoordinator, captures: { c3: $.data.id, c3v: $.data.version } }
            - { call: "POST /api/patient-cases", payload: { patient_ref: "P-8104", unit_id: "${u1}", received_at: "2026-08-05T09:00:00Z", channel: "LETTER", description: "Nurse rudeness four", grievance_category: "STAFF_CONDUCT" }, as: IntakeCoordinator, captures: { c4: $.data.id, c4v: $.data.version } }
            - { call: "POST /api/patient-cases/${c1}/classification-decisions", payload: { decision: "GRIEVANCE", rationale_code: "INITIAL_INTAKE", expected_case_version: "${c1v}" }, as: IntakeCoordinator }
            - { call: "POST /api/patient-cases/${c2}/classification-decisions", payload: { decision: "GRIEVANCE", rationale_code: "INITIAL_INTAKE", expected_case_version: "${c2v}" }, as: IntakeCoordinator }
          trigger:
            - { call: "POST /api/patient-cases/${c3}/classification-decisions", payload: { decision: "GRIEVANCE", rationale_code: "INITIAL_INTAKE", expected_case_version: "${c3v}" }, as: IntakeCoordinator }
            - { call: "GET /api/escalations?case_id=${c1}", as: IntakeCoordinator, captures: { n1: $.data } }
            - { call: "GET /api/escalations?case_id=${c3}", as: IntakeCoordinator, captures: { e3_type: "$.data[0].escalation_type", e3_src: "$.data[0].source", e3_st: "$.data[0].status", e3_fb: "$.data[0].filed_by_id" } }
            - { call: "POST /api/patient-cases/${c4}/classification-decisions", payload: { decision: "GRIEVANCE", rationale_code: "INITIAL_INTAKE", expected_case_version: "${c4v}" }, as: IntakeCoordinator }
            - { call: "GET /api/escalations?case_id=${c4}", as: IntakeCoordinator, captures: { n4: $.data } }
          assert:
            - "n1 is an empty array — after the 2nd classification (count 2 < 3) no escalation exists"
            - "e3_type == 'SYSTEMIC' and e3_src == 'AUTO_SYSTEMIC_THRESHOLD' and e3_st == 'FILED' and e3_fb == 'system'"
            - "n4 is an empty array — 4th grievance does not duplicate while a SYSTEMIC escalation is open for the unit+category"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: letter_approval_gated_by_open_escalation
        grounds:
          - state_machines.ResponseLetter.IN_REVIEW_to_APPROVED
          - validations[priority=5.4]
          - errors[ERR_OPEN_ESCALATION_BLOCKS_APPROVAL]
        distinguishing_aspect: |
          Pair (ResponseLetter, QualityRiskEscalation): letter approve is blocked while the
          CASE's escalation is FILED/IN_REVIEW/REVIEWS_COMPLETE and freed only by adjudication
          to a terminal outcome.
        test_recipe:
          setup:
            - "Grievance fully investigated (no care concern), letter IN_REVIEW; QRO q1 then files a manual CARE_CONCERN escalation"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/hospital-units", payload: { name: "Cardiology", category: "INPATIENT" }, as: SystemAdmin, captures: { u1: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Ivy Investigator", capabilities: ["INVESTIGATOR"] }, as: SystemAdmin, captures: { inv: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Dana Director", capabilities: ["DIRECTOR"] }, as: SystemAdmin, captures: { dir: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Quinn One", capabilities: ["QRO"] }, as: SystemAdmin, captures: { q1: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Quinn Two", capabilities: ["QRO"] }, as: SystemAdmin, captures: { q2: $.data.id } }
            - { call: "POST /api/patient-cases", payload: { patient_ref: "P-9001", unit_id: "${u1}", received_at: "2026-08-03T09:00:00Z", channel: "PHONE", description: "Consent process concern", grievance_category: "CARE_QUALITY" }, as: IntakeCoordinator, captures: { c1: $.data.id, c1v: $.data.version } }
            - { call: "POST /api/patient-cases/${c1}/classification-decisions", payload: { decision: "GRIEVANCE", rationale_code: "INITIAL_INTAKE", expected_case_version: "${c1v}" }, as: IntakeCoordinator }
            - { call: "GET /api/patient-cases/${c1}", as: PatientRelationsDirector, as_user_id: "${dir}", captures: { c1v2: $.data.version } }
            - { call: "POST /api/patient-cases/${c1}/assignments", payload: { investigator_id: "${inv}", expected_case_version: "${c1v2}" }, as: PatientRelationsDirector, as_user_id: "${dir}" }
            - { call: "POST /api/patient-cases/${c1}/investigations", payload: {}, as: DepartmentInvestigator, as_user_id: "${inv}", captures: { iv1: $.data.id } }
            - { call: "POST /api/investigations/${iv1}/notes", payload: { note_type: "INTERVIEW", body: "Interview" }, as: DepartmentInvestigator, as_user_id: "${inv}" }
            - { call: "POST /api/investigations/${iv1}/notes", payload: { note_type: "DOCUMENT_REVIEW", body: "Records" }, as: DepartmentInvestigator, as_user_id: "${inv}" }
            - { call: "POST /api/investigations/${iv1}/submit-findings", payload: { care_concern_flag: false, findings_summary: "Process gap found" }, as: DepartmentInvestigator, as_user_id: "${inv}" }
            - { call: "POST /api/investigations/${iv1}/accept-findings", payload: {}, as: PatientRelationsDirector, as_user_id: "${dir}" }
            - { call: "POST /api/patient-cases/${c1}/response-letters", payload: { sections: ["PATIENT_SUMMARY", "INVESTIGATION_STEPS", "FINDINGS", "RESOLUTION", "CONTACT_INFO"], body_summary: "Response letter content here" }, as: DepartmentInvestigator, as_user_id: "${inv}", captures: { l1: $.data.id } }
            - { call: "POST /api/response-letters/${l1}/submit-review", payload: {}, as: DepartmentInvestigator, as_user_id: "${inv}" }
            - { call: "POST /api/patient-cases/${c1}/escalations", payload: { escalation_type: "CARE_CONCERN", review_track: "COMPLIANCE" }, as: QualityRiskOfficer, as_user_id: "${q1}", captures: { e1: $.data.id } }
          trigger:
            - { call: "POST /api/response-letters/${l1}/approve", payload: {}, as: PatientRelationsDirector, as_user_id: "${dir}", captures: { err: $.data.error_id } }
            - { call: "POST /api/escalations/${e1}/triage", payload: { review_track: "COMPLIANCE" }, as: QualityRiskOfficer, as_user_id: "${q1}" }
            - { call: "POST /api/escalations/${e1}/complete-review", payload: { review_branch: "COMPLIANCE" }, as: QualityRiskOfficer, as_user_id: "${q1}" }
            - { call: "POST /api/escalations/${e1}/adjudicate", payload: { outcome: "UNSUBSTANTIATED", outcome_note: "No care defect found" }, as: QualityRiskOfficer, as_user_id: "${q2}" }
            - { call: "POST /api/response-letters/${l1}/approve", payload: {}, as: PatientRelationsDirector, as_user_id: "${dir}", captures: { lst: $.data.status } }
          assert:
            - "err == 'ERR_OPEN_ESCALATION_BLOCKS_APPROVAL' (gate holds while escalation FILED)"
            - "lst == 'APPROVED' after escalation reached ADJUDICATED_UNSUBSTANTIATED (gate clears at terminal adjudication)"

      - name: investigation_requires_active_primary_assignment
        grounds:
          - state_machines.PatientCase.ASSIGNED_to_UNDER_INVESTIGATION
          - errors[ERR_NO_ACTIVE_PRIMARY_ASSIGNMENT]
        distinguishing_aspect: |
          Pair (Investigation, CaseAssignment) — different pair than letter-vs-escalation:
          opening an Investigation is rejected while the case has no ACTIVE PRIMARY assignment,
          and succeeds immediately after one is created.
        test_recipe:
          setup:
            - "Case classified GRIEVANCE, still CLASSIFIED (no assignment yet); investigator inv; director dir"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/hospital-units", payload: { name: "Ortho", category: "SURGICAL" }, as: SystemAdmin, captures: { u1: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Ivy Investigator", capabilities: ["INVESTIGATOR"] }, as: SystemAdmin, captures: { inv: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Dana Director", capabilities: ["DIRECTOR"] }, as: SystemAdmin, captures: { dir: $.data.id } }
            - { call: "POST /api/patient-cases", payload: { patient_ref: "P-9002", unit_id: "${u1}", received_at: "2026-08-03T09:00:00Z", channel: "EMAIL", description: "Post-op instructions unclear", grievance_category: "COMMUNICATION" }, as: IntakeCoordinator, captures: { c1: $.data.id, c1v: $.data.version } }
            - { call: "POST /api/patient-cases/${c1}/classification-decisions", payload: { decision: "GRIEVANCE", rationale_code: "INITIAL_INTAKE", expected_case_version: "${c1v}" }, as: IntakeCoordinator }
          trigger:
            - { call: "POST /api/patient-cases/${c1}/investigations", payload: {}, as: DepartmentInvestigator, as_user_id: "${inv}", captures: { err: $.data.error_id } }
            - { call: "GET /api/patient-cases/${c1}", as: PatientRelationsDirector, as_user_id: "${dir}", captures: { c1v2: $.data.version } }
            - { call: "POST /api/patient-cases/${c1}/assignments", payload: { investigator_id: "${inv}", expected_case_version: "${c1v2}" }, as: PatientRelationsDirector, as_user_id: "${dir}" }
            - { call: "POST /api/patient-cases/${c1}/investigations", payload: {}, as: DepartmentInvestigator, as_user_id: "${inv}", captures: { ivst: $.data.status } }
          assert:
            - "err == 'ERR_NO_ACTIVE_PRIMARY_ASSIGNMENT' (Investigation gated on CaseAssignment state)"
            - "ivst == 'OPEN' after the PRIMARY assignment exists"

      - name: intake_rejected_on_restricted_unit
        grounds:
          - state_machines.HospitalUnit.STANDARD_to_RESTRICTED
          - validations[priority=6]
          - errors[ERR_UNIT_IN_RESTRICTED_POSTURE]
        distinguishing_aspect: |
          Pair (PatientCase, HospitalUnit) — third distinct pair: intake POST /api/patient-cases
          is rejected while the referenced unit's posture is RESTRICTED and accepted again after
          the posture returns to STANDARD.
        test_recipe:
          setup:
            - "Unit U created (STANDARD); Director sets posture RESTRICTED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/hospital-units", payload: { name: "L&D", category: "INPATIENT" }, as: SystemAdmin, captures: { u1: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Dana Director", capabilities: ["DIRECTOR"] }, as: SystemAdmin, captures: { dir: $.data.id } }
            - { call: "PATCH /api/hospital-units/${u1}", payload: { posture: "RESTRICTED" }, as: PatientRelationsDirector, as_user_id: "${dir}" }
          trigger:
            - { call: "POST /api/patient-cases", payload: { patient_ref: "P-9003", unit_id: "${u1}", received_at: "2026-08-03T09:00:00Z", channel: "PHONE", description: "Visitor policy concern", grievance_category: "OTHER" }, as: IntakeCoordinator, captures: { err: $.data.error_id } }
            - { call: "PATCH /api/hospital-units/${u1}", payload: { posture: "STANDARD" }, as: PatientRelationsDirector, as_user_id: "${dir}" }
            - { call: "POST /api/patient-cases", payload: { patient_ref: "P-9004", unit_id: "${u1}", received_at: "2026-08-03T09:00:00Z", channel: "PHONE", description: "Visitor policy concern retry", grievance_category: "OTHER" }, as: IntakeCoordinator, captures: { cid: $.data.id } }
          assert:
            - "err == 'ERR_UNIT_IN_RESTRICTED_POSTURE' (cross-entity posture gate at intake)"
            - "Second create succeeds (201) once posture returns to STANDARD; unit.open_case_count == 1"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: rounding_advocate_half_open_adjacency_rules
        grounds:
          - calculations.rounding_overlap_check
          - errors[ERR_ROUNDING_OVERLAP]
          - entities.RoundingSession.fields.start_at
        distinguishing_aspect: |
          Resource = StaffMember (advocate), semantics = pairwise half-open [start, end):
          adjacency (10:00-12:00 then 12:00-14:00) is ALLOWED; a 1-hour interior overlap
          (13:00-15:00 vs 12:00-14:00) is rejected.
        test_recipe:
          setup:
            - "Advocate adv; unit with default capacity 2; clock 2026-08-03T08:00:00Z; session S1 10:00-12:00 scheduled"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T08:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/hospital-units", payload: { name: "Med-Surg 5", category: "INPATIENT" }, as: SystemAdmin, captures: { u1: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Ally Advocate", capabilities: ["ADVOCATE"] }, as: SystemAdmin, captures: { adv: $.data.id } }
            - { call: "POST /api/rounding-sessions", payload: { unit_id: "${u1}", start_at: "2026-08-03T10:00:00Z", end_at: "2026-08-03T12:00:00Z" }, as: PatientAdvocate, as_user_id: "${adv}", captures: { s1: $.data.id } }
          trigger:
            - { call: "POST /api/rounding-sessions", payload: { unit_id: "${u1}", start_at: "2026-08-03T12:00:00Z", end_at: "2026-08-03T14:00:00Z" }, as: PatientAdvocate, as_user_id: "${adv}", captures: { s2: $.data.id, s2st: $.data.status } }
            - { call: "POST /api/rounding-sessions", payload: { unit_id: "${u1}", start_at: "2026-08-03T13:00:00Z", end_at: "2026-08-03T15:00:00Z" }, as: PatientAdvocate, as_user_id: "${adv}", captures: { err: $.data.error_id } }
            - { call: "POST /api/rounding-sessions", payload: { unit_id: "${u1}", start_at: "2026-08-03T14:00:00Z", end_at: "2026-08-03T15:00:00Z" }, as: PatientAdvocate, as_user_id: "${adv}", captures: { s4st: $.data.status } }
          assert:
            - "s2st == 'SCHEDULED' (adjacency at exactly 12:00 allowed — half-open)"
            - "err == 'ERR_ROUNDING_OVERLAP' ([13:00,15:00) intersects [12:00,14:00))"
            - "s4st == 'SCHEDULED' (adjacent to S2's end 14:00 — boundary not occupied)"

      - name: interview_booking_buffer_gap_boundary
        grounds:
          - calculations.interview_booking_buffer_check
          - errors[ERR_BOOKING_BUFFER_VIOLATION]
          - entities.InterviewBooking.fields.room_id
        distinguishing_aspect: |
          Different resource entity (InterviewRoom) and DIFFERENT interval semantics than the
          half-open advocate rule: a 900-second buffer is mandatory on both sides — gap 600s
          rejected, gap exactly 900s allowed (inclusive buffer boundary).
        test_recipe:
          setup:
            - "Grievance with OPEN investigation run by inv (ACTIVE PRIMARY); room R; clock 2026-08-03T08:00:00Z; booking B1 2026-08-04T10:00-11:00 BOOKED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T08:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/hospital-units", payload: { name: "Neuro", category: "INPATIENT" }, as: SystemAdmin, captures: { u1: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Ivy Investigator", capabilities: ["INVESTIGATOR"] }, as: SystemAdmin, captures: { inv: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Dana Director", capabilities: ["DIRECTOR"] }, as: SystemAdmin, captures: { dir: $.data.id } }
            - { call: "POST /api/interview-rooms", payload: { name: "Room 101", location: "Tower 3F" }, as: SystemAdmin, captures: { r1: $.data.id } }
            - { call: "POST /api/patient-cases", payload: { patient_ref: "P-9101", unit_id: "${u1}", received_at: "2026-08-03T07:00:00Z", channel: "PHONE", description: "MRI scheduling concern", grievance_category: "ACCESS_DELAY" }, as: IntakeCoordinator, captures: { c1: $.data.id, c1v: $.data.version } }
            - { call: "POST /api/patient-cases/${c1}/classification-decisions", payload: { decision: "GRIEVANCE", rationale_code: "INITIAL_INTAKE", expected_case_version: "${c1v}" }, as: IntakeCoordinator }
            - { call: "GET /api/patient-cases/${c1}", as: PatientRelationsDirector, as_user_id: "${dir}", captures: { c1v2: $.data.version } }
            - { call: "POST /api/patient-cases/${c1}/assignments", payload: { investigator_id: "${inv}", expected_case_version: "${c1v2}" }, as: PatientRelationsDirector, as_user_id: "${dir}" }
            - { call: "POST /api/patient-cases/${c1}/investigations", payload: {}, as: DepartmentInvestigator, as_user_id: "${inv}", captures: { iv1: $.data.id } }
            - { call: "POST /api/interview-bookings", payload: { investigation_id: "${iv1}", room_id: "${r1}", start_at: "2026-08-04T10:00:00Z", end_at: "2026-08-04T11:00:00Z" }, as: DepartmentInvestigator, as_user_id: "${inv}", captures: { b1: $.data.id } }
          trigger:
            - { call: "POST /api/interview-bookings", payload: { investigation_id: "${iv1}", room_id: "${r1}", start_at: "2026-08-04T11:10:00Z", end_at: "2026-08-04T12:00:00Z" }, as: DepartmentInvestigator, as_user_id: "${inv}", captures: { err: $.data.error_id } }
            - { call: "POST /api/interview-bookings", payload: { investigation_id: "${iv1}", room_id: "${r1}", start_at: "2026-08-04T11:15:00Z", end_at: "2026-08-04T12:00:00Z" }, as: DepartmentInvestigator, as_user_id: "${inv}", captures: { b3st: $.data.status } }
          assert:
            - "err == 'ERR_BOOKING_BUFFER_VIOLATION' (gap 600s < required 900s)"
            - "b3st == 'BOOKED' (gap exactly 900s satisfies the inclusive buffer boundary)"

      - name: unit_rounding_capacity_aggregate_semantics
        grounds:
          - calculations.rounding_overlap_check
          - errors[ERR_UNIT_ROUNDING_CAPACITY]
          - entities.HospitalUnit.fields.max_concurrent_roundings
        distinguishing_aspect: |
          Third semantics — aggregate occupancy on resource HospitalUnit (not pairwise on
          StaffMember): with max_concurrent_roundings = 1, a second DIFFERENT advocate's
          overlapping session is rejected by capacity even though no pairwise rule fires;
          an adjacent session by that same second advocate is allowed.
        test_recipe:
          setup:
            - "Unit capacity 1; advocates advA and advB; clock 2026-08-03T08:00:00Z; advA session 10:00-12:00 scheduled"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T08:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/hospital-units", payload: { name: "PICU", category: "ICU", max_concurrent_roundings: 1 }, as: SystemAdmin, captures: { u1: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Ally A", capabilities: ["ADVOCATE"] }, as: SystemAdmin, captures: { adva: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Ally B", capabilities: ["ADVOCATE"] }, as: SystemAdmin, captures: { advb: $.data.id } }
            - { call: "POST /api/rounding-sessions", payload: { unit_id: "${u1}", start_at: "2026-08-03T10:00:00Z", end_at: "2026-08-03T12:00:00Z" }, as: PatientAdvocate, as_user_id: "${adva}" }
          trigger:
            - { call: "POST /api/rounding-sessions", payload: { unit_id: "${u1}", start_at: "2026-08-03T11:00:00Z", end_at: "2026-08-03T12:00:00Z" }, as: PatientAdvocate, as_user_id: "${advb}", captures: { err: $.data.error_id } }
            - { call: "POST /api/rounding-sessions", payload: { unit_id: "${u1}", start_at: "2026-08-03T12:00:00Z", end_at: "2026-08-03T13:00:00Z" }, as: PatientAdvocate, as_user_id: "${advb}", captures: { sc_st: $.data.status } }
          assert:
            - "err == 'ERR_UNIT_ROUNDING_CAPACITY' (concurrent == max 1; aggregate rule, different advocate so no pairwise overlap)"
            - "sc_st == 'SCHEDULED' (adjacent window has zero overlapping occupants)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: recovery_issue_revoke_conserves_outstanding_cents
        grounds:
          - state_machines.ServiceRecoveryAction.ISSUED_to_REVOKED
          - entities.PatientCase.fields.outstanding_recovery_cents
          - calculations.recovery_cap_check
        distinguishing_aspect: |
          Conserved quantity = case.outstanding_recovery_cents (fiscal cents): ISSUE 8000 +
          ISSUE 7000 + REVOKE 8000 nets to exactly 7000, and a PENDING_APPROVAL action
          contributes 0 — forward/compensating pairs leave the ledger invariant.
        test_recipe:
          setup:
            - "Advocate adv (limit 10000); case in INTAKE with outstanding_recovery_cents == 0"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/hospital-units", payload: { name: "ED West", category: "EMERGENCY" }, as: SystemAdmin, captures: { u1: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Ally Advocate", capabilities: ["ADVOCATE"] }, as: SystemAdmin, captures: { adv: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Dana Director", capabilities: ["DIRECTOR"] }, as: SystemAdmin, captures: { dir: $.data.id } }
            - { call: "POST /api/patient-cases", payload: { patient_ref: "P-9201", unit_id: "${u1}", received_at: "2026-08-03T09:00:00Z", channel: "IN_PERSON", description: "Cafeteria overcharge", grievance_category: "BILLING" }, as: IntakeCoordinator, captures: { c1: $.data.id } }
            - { call: "POST /api/patient-cases/${c1}/recovery-actions", payload: { action_type: "MEAL_VOUCHER", value_cents: 8000, justification: "Meal voucher for overcharge one" }, as: PatientAdvocate, as_user_id: "${adv}", captures: { a1: $.data.id, a1st: $.data.status } }
            - { call: "POST /api/patient-cases/${c1}/recovery-actions", payload: { action_type: "PARKING_COMP", value_cents: 7000, justification: "Parking comp for long stay two" }, as: PatientAdvocate, as_user_id: "${adv}", captures: { a2: $.data.id } }
            - { call: "POST /api/patient-cases/${c1}/recovery-actions", payload: { action_type: "BILL_ADJUSTMENT", value_cents: 15000, justification: "Bill adjustment above personal limit" }, as: PatientAdvocate, as_user_id: "${adv}", captures: { a3st: $.data.status } }
          trigger:
            - { call: "POST /api/recovery-actions/${a1}/revoke", payload: { revoke_reason: "Voucher returned unused" }, as: PatientRelationsDirector, as_user_id: "${dir}" }
            - { call: "GET /api/patient-cases/${c1}", as: PatientAdvocate, as_user_id: "${adv}", captures: { out_c: $.data.outstanding_recovery_cents } }
          assert:
            - "a1st == 'ISSUED' and a3st == 'PENDING_APPROVAL' (15000 > issuer limit 10000)"
            - "out_c == 7000 — the ISSUE(8000)+REVOKE(8000) pair nets to zero, leaving exactly the 7000 still-ISSUED action"
            - "PENDING_APPROVAL 15000 never entered the ledger (out_c would read 22000 otherwise)"

      - name: assign_release_supersede_conserves_open_count
        grounds:
          - state_machines.CaseAssignment.ACTIVE_to_RELEASED
          - entities.StaffMember.fields.open_assignment_count
          - concurrency_rules[case-assignment-stale-version]
        distinguishing_aspect: |
          Conserved quantity = StaffMember.open_assignment_count (capacity counter, a different
          conserved-quantity type than fiscal cents): assign +1, release -1, and PRIMARY
          supersede moves the count between two staff with no drift — the global sum of ACTIVE
          assignments per investigator always equals the counter.
        test_recipe:
          setup:
            - "inv1, inv2, dir; caseA and caseB both CLASSIFIED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/hospital-units", payload: { name: "Renal", category: "INPATIENT" }, as: SystemAdmin, captures: { u1: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Ivy One", capabilities: ["INVESTIGATOR"] }, as: SystemAdmin, captures: { inv1: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Ivy Two", capabilities: ["INVESTIGATOR"] }, as: SystemAdmin, captures: { inv2: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Dana Director", capabilities: ["DIRECTOR"] }, as: SystemAdmin, captures: { dir: $.data.id } }
            - { call: "POST /api/patient-cases", payload: { patient_ref: "P-9301", unit_id: "${u1}", received_at: "2026-08-03T09:00:00Z", channel: "PHONE", description: "Dialysis scheduling A", grievance_category: "ACCESS_DELAY" }, as: IntakeCoordinator, captures: { ca: $.data.id, cav: $.data.version } }
            - { call: "POST /api/patient-cases/${ca}/classification-decisions", payload: { decision: "GRIEVANCE", rationale_code: "INITIAL_INTAKE", expected_case_version: "${cav}" }, as: IntakeCoordinator }
            - { call: "GET /api/patient-cases/${ca}", as: PatientRelationsDirector, as_user_id: "${dir}", captures: { cav2: $.data.version } }
            - { call: "POST /api/patient-cases/${ca}/assignments", payload: { investigator_id: "${inv1}", expected_case_version: "${cav2}" }, as: PatientRelationsDirector, as_user_id: "${dir}", captures: { asa: $.data.id } }
            - { call: "POST /api/patient-cases", payload: { patient_ref: "P-9302", unit_id: "${u1}", received_at: "2026-08-03T09:00:00Z", channel: "EMAIL", description: "Dialysis scheduling B", grievance_category: "ACCESS_DELAY" }, as: IntakeCoordinator, captures: { cb: $.data.id, cbv: $.data.version } }
            - { call: "POST /api/patient-cases/${cb}/classification-decisions", payload: { decision: "GRIEVANCE", rationale_code: "INITIAL_INTAKE", expected_case_version: "${cbv}" }, as: IntakeCoordinator }
            - { call: "GET /api/patient-cases/${cb}", as: PatientRelationsDirector, as_user_id: "${dir}", captures: { cbv2: $.data.version } }
            - { call: "POST /api/patient-cases/${cb}/assignments", payload: { investigator_id: "${inv1}", expected_case_version: "${cbv2}" }, as: PatientRelationsDirector, as_user_id: "${dir}" }
            - { call: "GET /api/staff-members/${inv1}", as: PatientRelationsDirector, as_user_id: "${dir}", captures: { n_mid: $.data.open_assignment_count } }
          trigger:
            - { call: "POST /api/case-assignments/${asa}/release", payload: { release_reason: "Workload rebalance" }, as: PatientRelationsDirector, as_user_id: "${dir}", captures: { asa_st: $.data.status } }
