              as: ComplianceAdmin
              captures: { sv1: $.data.version }
            - call: "POST /labeling/origin-determinations"
              payload: { style_id: "${style_id}", expected_style_version: "${sv1}" }
              as: LabelingSpecialist
              as_user_id: "user-spec-1"
              captures: { od_id: $.data.id }
            - call: "POST /labeling/origin-determinations/${od_id}/issue"
              payload: { method: "SUBSTANTIAL_TRANSFORMATION" }
              as: ComplianceAdmin
              captures: { det_country: $.data.determined_country }
            - call: "POST /labeling/lab-tests"
              payload: { style_id: "${style_id}", test_type: "CARE_PERFORMANCE", lab_code: "LAB-ATL-1", method: "AATCC_135", specimen_received_at: "2026-08-03T09:00:00Z", results_due_at: "2026-08-05T09:00:00Z", wash_temp_c: 30 }
              as: AccreditedLab
              captures: { c1_id: $.data.id }
            - call: "POST /labeling/lab-tests/${c1_id}/results"
              payload: { cycles_run: 5, dimensional_change_pct: 2.0, colorfastness_grade: 4.0, legibility_cycles: 40 }
              as: AccreditedLab
              captures: { c1_shrink: $.data.dimensional_change_pct }
            - call: "POST /labeling/label-specs"
              payload: { style_id: "${style_id}", market_codes: ["US"], languages: ["en"], placement_code: "NECK_CENTER_INSIDE", durability_cycles_rating: 40, wash_temp_c: 30, bleach_code: "NO_BLEACH", dry_code: "TUMBLE_LOW", iron_code: "IRON_LOW", dryclean_code: "DO_NOT_DRYCLEAN", identity_display_mode: "RN", fiber_content_text: "100.0% COTTON", origin_text: "Made in VN", origin_determination_id: "${od_id}", care_test_id: "${c1_id}" }
              as: LabelingSpecialist
              as_user_id: "user-spec-1"
              captures: { l1_id: $.data.id, l1_ver: $.data.version }
          trigger:
