          assert:
            - "the third amendment and its re-consent both returned HTTP 200, leaving consent_amendment_count == 3 and consent_status == CONSENTED"
            - "the trigger returns HTTP 409 with error_id ERR_CONSENT_AMENDMENT_LIMIT"
            - "the re-read shows consent_status still CONSENTED, consent_amendment_count still 3 and the consent_version reached by the three accepted re-consents unchanged by the refusal"

