            - "t2_state == SANCTIONED with t2_from == 2026-09-20T00:00:00Z and t2_order == 3 — the first instant strictly after the buffer"
            - "case ${case_t2_id} stayed UNDER_REVIEW through all three rejections"
            - "Consultant ${cons_t_id} highest_sanction_order == 3 after the accepted decision"

