      - name: recognition_tier_percentile_cutoff_self_reference
        grounds:
          - calculations.recognition_tier
          - entities.School.fields.recognition_tier
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: each school's tier cutoffs are
          percentiles of a distribution that includes the school's own rate; the
          scaffold pins evaluation order rates -> cutoffs -> tiers, with inclusive
          boundaries (rate == cutoff takes the higher tier).
        test_recipe:
          setup:
            - "Campaign OPEN (min_recognition_seniors=4, min_subgroup_size default 5 — rows suppressed, tiers still computed from raw rates)"
            - "4 schools ENROLLED, each with 4 matched + DATA_SHARE-consented seniors"
            - "SUBMITTED counts per school: A=4 (rate 100.0), B=3 (75.0), C=2 (50.0), D=1 (25.0); all other seniors STARTED"
            - "Distribution [25,50,75,100], N=4: c70 = index ceil(2.8)=3 -> 75; c40 = index ceil(1.6)=2 -> 50"
          setup_api_calls:
            - { call: "POST /fafsa/campaigns", as: CampaignAdmin, payload: { name: "C27", academic_year: "2027-2028", state_grant_deadline: "2027-04-15T00:00:00Z", federal_deadline: "2028-06-30T00:00:00Z", total_budget_cents: 100000, min_recognition_seniors: 4 }, captures: { camp: $.data.id } }
