  - rule_id: transitive_cascade
    instances:
      - name: audit_reconcile_cascades_five_hops_from_observation_to_voided_advance
        grounds:
          - state_machines.FloorPlanAudit.IN_PROGRESS_to_RECONCILED_EXCEPTIONS
          - state_machines.OutOfTrustIncident.initial_state
          - state_machines.InventoryUnit.FLOORED_to_SOT_OPEN
          - state_machines.CreditLine.ACTIVE_to_SUSPENDED
          - state_machines.Dealer.ACTIVE_to_SUSPENDED
          - state_machines.FundingAdvance.REQUESTED_to_VOIDED
          - state_machines.InventoryUnit.PENDING_FUNDING_to_REGISTERED
          - calculations.audit_sot_exposure
          - calculations.dealer_risk_rating
          - calculations.credit_line_availability
          - global_constants.SOT_SUSPENSION_EXPOSURE_CENTS
          - global_constants.SOT_CURE_DAYS
        distinguishing_aspect: |
          A FIVE-HOP chain fired by POST /floorplan/audits/{id}/reconcile:
          observation -> OutOfTrustIncident OPEN -> unit SOT_OPEN and INELIGIBLE ->
          dealer exposure 20000000 crossing SOT_SUSPENSION_EXPOSURE_CENTS -> CreditLine
          and Dealer SUSPENDED -> the unrelated REQUESTED FundingAdvance VOIDED with its
          unit returned to REGISTERED; hop five touches an entity the observation never
          named.
