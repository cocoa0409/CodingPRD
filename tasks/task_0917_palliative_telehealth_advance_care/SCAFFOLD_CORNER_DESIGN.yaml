  # =========================================================================
  # Calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: symptom_distress_self_and_proxy_variants_diverge_on_identical_items
        claim_type: variant_divergence
        grounds:
          - calculations.symptom_distress_score
          - entities.SymptomAssessment.fields.reporter_type
        distinguishing_aspect: "Identical item scores of 6 across all five items give 60 under SELF and 63 under PROXY, because PROXY discounts anxiety and fatigue to 0.6 and then scales by 2.5 instead of 2."
        test_recipe:
          setup:
            - "One Patient in program_status ACTIVE with one ACTIVE CarePlan."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /palliative/patients"
              payload: { mrn: "MRN-2015", full_name: "Otto Salmi", date_of_birth: "1950-01-01", jurisdiction_code: "JUR_TWO_WITNESS", attending_clinician_user_id: "u_attending_1", opioid_status: "OPIOID_TOLERANT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { p_id: $.data.id }
            - call: "POST /palliative/referrals"
              payload: { patient_id: "${p_id}", source: "HOSPITAL_DISCHARGE", prognosis_months: 6, serious_illness_criteria_count: 3 }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { ref_id: $.data.id }
            - call: "POST /palliative/referrals/${ref_id}/decision"
              payload: { decision: "ACCEPT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
            - call: "POST /palliative/care-plans"
              payload: { patient_id: "${p_id}", plan_title: "Plan", problem_list: ["pain"] }
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
              captures: { cp_id: $.data.id }
            - call: "POST /palliative/care-plans/${cp_id}/activate"
              payload: {}
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
          trigger:
            - call: "POST /palliative/symptom-assessments"
              payload: { patient_id: "${p_id}", care_plan_id: "${cp_id}", reporter_type: "SELF", item_pain: 6, item_dyspnea: 6, item_nausea: 6, item_anxiety: 6, item_fatigue: 6 }
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
              captures: { sa_self_id: $.data.id }
            - call: "POST /palliative/symptom-assessments"
              payload: { patient_id: "${p_id}", care_plan_id: "${cp_id}", reporter_type: "PROXY", item_pain: 6, item_dyspnea: 6, item_nausea: 6, item_anxiety: 6, item_fatigue: 6 }
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
              captures: { sa_proxy_id: $.data.id }
          assert:
            - "SymptomAssessment.${sa_self_id}.distress_score == 60"
            - "SymptomAssessment.${sa_proxy_id}.distress_score == 63"
            - "SymptomAssessment.${sa_self_id}.severity_tier == MODERATE"
            - "SymptomAssessment.${sa_proxy_id}.severity_tier == MODERATE"
            - "SymptomAssessment.${sa_self_id}.response_due_at == 2026-06-01T04:00:00.000Z"
            - "Patient.${p_id}.open_symptom_count == 2"

      - name: medication_daily_mme_naive_and_tolerant_variants_diverge_on_identical_dose
        claim_type: variant_divergence
        grounds:
          - calculations.medication_daily_mme
          - entities.Patient.fields.opioid_status
          - entities.MedicationOrder.fields.mme_variant
        distinguishing_aspect: "The same MORPHINE_PO 40 mg per day order yields mme_daily 40.0 for an OPIOID_TOLERANT patient and 30.0 for an OPIOID_NAIVE patient, because the NAIVE variant scales by OPIOID_NAIVE_SAFETY_FACTOR before rounding."
        test_recipe:
          setup:
            - "Two Patients in program_status ACTIVE, one OPIOID_TOLERANT and one OPIOID_NAIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
