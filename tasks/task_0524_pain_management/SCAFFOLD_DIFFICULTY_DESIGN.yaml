  - rule_id: compensating_invariant
    instances:
      - name: med_ledger_prescribe_discontinue_conserves_total
        grounds:
          - state_machines.Prescription.PROPOSED_to_ACTIVE
          - state_machines.Prescription.ACTIVE_to_DISCONTINUED
          - calculations.patient_daily_med_aggregate
          - entities.ControlledSubstanceLedger.fields.discontinued_med_mg
        distinguishing_aspect: |
          Conserved quantity #1 = ledger MED sum. Activating an Rx (provisional 20) puts 20 into total_active_med_mg;
          discontinuing (compensating action) moves it to discontinued_med_mg. The invariant
          total_active_med_mg + suspended_med_mg + discontinued_med_mg == 20.00 holds before and after.
        test_recipe:
          setup:
            - "Patient ACTIVE with routed MEDICATION plan; one below-threshold Rx (provisional 20) activated then discontinued at the same clock"
          setup_api_calls:
            - call: "POST /clinics"
