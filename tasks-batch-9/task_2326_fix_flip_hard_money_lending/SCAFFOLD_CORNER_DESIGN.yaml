          setup:
            - "borrower ba (LLC, score 92.00 TIER_A) created with guarantee_status PENDING and status PROSPECT"
            - "borrower bb (SOLE_PROP, 5 flips in 24mo, 7 lifetime, credit 742, liquidity 20,000,000 against a 20,000,000 target -> score 88.25 TIER_A, guarantee EXECUTED, status APPROVED_SPONSOR)"
            - "borrower bc (LLC, 1 flip in 24mo, 1 lifetime, credit 640, liquidity 500,000, one prior default -> score 2.83 TIER_D) with an executed guarantee"
            - "property p1 available"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /lending/borrowers"
              payload: { legal_entity_name: "Ridgeline Rehab LLC", entity_type: "LLC", guarantor_name: "D. Ruiz", flips_last_24mo: 6, flips_lifetime: 8, credit_score: 760, liquidity_cents: 30000000, prior_default_count: 0, declared_target_loan_cents: 30000000 }
              as: LoanOfficer
              captures: { ba: "$.data.id" }
            - call: "POST /lending/borrowers"
