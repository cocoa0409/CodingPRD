# =============================================================================
# Task 1999 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# All recipes start from empty-DB. Logical clock default: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------- rule 1 ---
  - rule_id: dual_variant_calc
    instances:
      - name: dockage_fee_provisional_vs_final
        grounds:
          - calculations.dockage_fee
          - state_machines.PortCall.TURNAROUND_to_DEPARTED
          - state_machines.PortCall.DEPARTED_to_CLOSED
        distinguishing_aspect: |
          Same call, same physical movement: the PROVISIONAL variant bills
          scheduled hours (12h -> 1425000) while the FINAL variant bills actual
          hours with ceil + overtime multiplier + late penalty (-> 1763438).
          Entity domain: Invoice/billing. Different from the staffing-domain
          instance screening_requirement_projection_vs_actual.
        test_recipe:
          setup:
            - "Terminal T1, berth B1 (1200ft, draft 40), vessel 950ft loa / 30ft draft"
            - "PortCall V1 scheduled 2026-08-10T08:00:00Z -> 2026-08-10T20:00:00Z (12h), booked 100/100"
            - "BerthAssignment [2026-08-10T06:00:00Z, 2026-08-10T22:00:00Z] CONFIRMED"
            - "CustomsCase FILED then CLEARED; lane L1 OPEN with 2 officers"
            - "Call ARRIVED at 08:00, TURNAROUND; PROVISIONAL invoice exists"
          setup_api_calls:
            - { call: "POST /port-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PortAuthorityAdmin }
            - { call: "POST /port-ops/terminals", payload: { name: "T1", max_apron_slots: 4, taxi_dispatch_capacity_per_window: 2 }, as: PortAuthorityAdmin, captures: { term: $.data.id } }
            - { call: "POST /port-ops/berths", payload: { terminal_id: "${term}", berth_code: "B1", length_ft: 1200, max_draft_ft: 40.0 }, as: PortAuthorityAdmin, captures: { b1: $.data.id } }
            - { call: "POST /port-ops/vessels", payload: { terminal_id: "${term}", name: "MV A", loa_ft: 950, draft_ft: 30.0, pax_capacity: 4000, crew_count: 900 }, as: PortAuthorityAdmin, captures: { ves: $.data.id } }
            - { call: "POST /port-ops/port-calls", payload: { terminal_id: "${term}", vessel_id: "${ves}", voyage_ref: "V1", scheduled_eta: "2026-08-10T08:00:00Z", scheduled_etd: "2026-08-10T20:00:00Z", booked_embark_pax: 100, booked_debark_pax: 100 }, as: VesselAgent, as_user_id: "${ves}", captures: { pc: $.data.id, pc_v: $.data.version } }
            - { call: "POST /port-ops/port-calls/${pc}/berth-assignments", payload: { berth_id: "${b1}", window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-10T22:00:00Z", expected_port_call_version: "${pc_v}" }, as: Harbormaster, captures: { ba: $.data.id } }
            - { call: "POST /port-ops/berth-assignments/${ba}/confirm", as: Harbormaster }
            - { call: "POST /port-ops/port-calls/${pc}/customs-cases", as: CustomsOfficer, captures: { cc: $.data.id } }
            - { call: "POST /port-ops/customs-cases/${cc}/file", as: CustomsOfficer }
            - { call: "POST /port-ops/screening-lanes", payload: { terminal_id: "${term}", lane_code: "L1" }, as: PortAuthorityAdmin, captures: { lane: $.data.id } }
            - { call: "POST /port-ops/screening-lanes/${lane}/open", payload: { officers_assigned: 2 }, as: TerminalOperator }
            - { call: "POST /port-ops/port-calls/${pc}/arrive", payload: { actual_eta: "2026-08-10T08:00:00Z" }, as: Harbormaster }
            - { call: "POST /port-ops/port-calls/${pc}/begin-turnaround", as: TerminalOperator }
            - { call: "POST /port-ops/port-calls/${pc}/provisional-invoice", as: BillingClerk, captures: { pinv: $.data.id } }
            - { call: "POST /port-ops/customs-cases/${cc}/clear", as: CustomsOfficer }
          trigger:
            - { call: "POST /port-ops/port-calls/${pc}/depart", payload: { actual_etd: "2026-08-10T20:20:00Z" }, as: Harbormaster }
            - { call: "POST /port-ops/port-calls/${pc}/close", as: BillingClerk }
            - { call: "GET /port-ops/invoices", payload: { port_call_id: "${pc}", kind: "FINAL" }, as: BillingClerk, captures: { fin_dock: "$.data[0].dockage_fee_cents" } }
            - { call: "GET /port-ops/invoices/${pinv}", as: BillingClerk }
          assert:
            - "Invoice.${pinv}.dockage_fee_cents == 1425000 (PROVISIONAL: 950ft x 125c x max(12,10)h)"
            - "FINAL invoice dockage_fee_cents == 1763438 (ceil(12h20m)=13h; overtime 1h x1.5 -> 178125; late penalty round_half_up(1603125 x 10%) = 160313; 1425000+178125+160313)"
            - "FINAL dockage != PROVISIONAL dockage for the same physical call"
      - name: screening_requirement_projection_vs_actual
        grounds:
          - calculations.screening_staffing_requirement
          - entities.ScreeningLane.fields.officers_assigned
        distinguishing_aspect: |
          Same terminal, same lane staffing: PROJECTION uses booked_embark_pax
          (961 -> required 3) while ACTUAL uses live state-filtered manifest rows
          (2 CHECKED_IN -> required 1). Entity domain: ScreeningLane/Terminal
          staffing — distinct from the Invoice/billing domain of
          dockage_fee_provisional_vs_final.
        test_recipe:
          setup:
            - "Terminal with lane L1 (OPEN, 2 officers); call booked_embark_pax=961, 12h turnaround -> embark window 8h"
            - "Two EMBARK manifest entries checked in (live set = 2)"
          setup_api_calls:
            - { call: "POST /port-ops/terminals", payload: { name: "T1", max_apron_slots: 4, taxi_dispatch_capacity_per_window: 2 }, as: PortAuthorityAdmin, captures: { term: $.data.id } }
            - { call: "POST /port-ops/vessels", payload: { terminal_id: "${term}", name: "MV B", loa_ft: 950, draft_ft: 30.0, pax_capacity: 4000, crew_count: 900 }, as: PortAuthorityAdmin, captures: { ves: $.data.id } }
            - { call: "POST /port-ops/port-calls", payload: { terminal_id: "${term}", vessel_id: "${ves}", voyage_ref: "V1", scheduled_eta: "2026-08-10T08:00:00Z", scheduled_etd: "2026-08-10T20:00:00Z", booked_embark_pax: 961, booked_debark_pax: 100 }, as: VesselAgent, as_user_id: "${ves}", captures: { pc: $.data.id } }
            - { call: "POST /port-ops/screening-lanes", payload: { terminal_id: "${term}", lane_code: "L1" }, as: PortAuthorityAdmin, captures: { lane: $.data.id } }
            - { call: "POST /port-ops/screening-lanes/${lane}/open", payload: { officers_assigned: 2 }, as: TerminalOperator }
            - { call: "POST /port-ops/port-calls/${pc}/manifest-entries", payload: { passenger_ref: "P1", direction: "EMBARK", cabin_class: "STANDARD" }, as: VesselAgent, as_user_id: "${ves}", captures: { e1: $.data.id } }
            - { call: "POST /port-ops/port-calls/${pc}/manifest-entries", payload: { passenger_ref: "P2", direction: "EMBARK", cabin_class: "STANDARD" }, as: VesselAgent, as_user_id: "${ves}", captures: { e2: $.data.id } }
            - { call: "POST /port-ops/manifest-entries/${e1}/check-in", as: TerminalOperator }
            - { call: "POST /port-ops/manifest-entries/${e2}/check-in", as: TerminalOperator }
          trigger:
            - { call: "GET /port-ops/terminals/${term}/screening-requirement", payload: { port_call_id: "${pc}" }, as: TerminalOperator, captures: { req_proj: $.data.required_officers, win_proj: $.data.embark_window_hours } }
            - { call: "GET /port-ops/terminals/${term}/screening-requirement", payload: { port_call_id: "${pc}", mode: "ACTUAL" }, as: TerminalOperator, captures: { req_act: $.data.required_officers } }
          assert:
            - "PROJECTION: required_officers == 3 (ceil(961 / (60 x 8))) and embark_window_hours == 8 (min(8, 12-2))"
            - "ACTUAL: required_officers == 1 (ceil(2 / 480)) with identical lanes and call"
            - "assigned_officers == 2 in both responses"

  # ---------------------------------------------------------------- rule 2 ---
  - rule_id: combinatorial_formula
    instances:
      - name: head_tax_per_side_discount_rounding_order
        grounds:
          - calculations.passenger_head_tax
        distinguishing_aspect: |
          Mode (b) nested rounding: the 5% volume discount is rounded half-up
          PER DIRECTION SIDE then summed. With 1501+1501 pax the pinned order
          yields 3850064; the forbidden sum-then-round order yields 3850065 —
          a 1-cent observable divergence.
        test_recipe:
          setup:
            - "Terminal, berth, vessel (pax_capacity 4000); call booked_embark_pax=1501, booked_debark_pax=1501 (total 3002 >= 3000)"
            - "CONFIRMED berth assignment so the provisional invoice can be generated"
          setup_api_calls:
            - { call: "POST /port-ops/terminals", payload: { name: "T1", max_apron_slots: 4, taxi_dispatch_capacity_per_window: 2 }, as: PortAuthorityAdmin, captures: { term: $.data.id } }
            - { call: "POST /port-ops/berths", payload: { terminal_id: "${term}", berth_code: "B1", length_ft: 1200, max_draft_ft: 40.0 }, as: PortAuthorityAdmin, captures: { b1: $.data.id } }
            - { call: "POST /port-ops/vessels", payload: { terminal_id: "${term}", name: "MV C", loa_ft: 950, draft_ft: 30.0, pax_capacity: 4000, crew_count: 900 }, as: PortAuthorityAdmin, captures: { ves: $.data.id } }
            - { call: "POST /port-ops/port-calls", payload: { terminal_id: "${term}", vessel_id: "${ves}", voyage_ref: "V1", scheduled_eta: "2026-08-10T08:00:00Z", scheduled_etd: "2026-08-10T20:00:00Z", booked_embark_pax: 1501, booked_debark_pax: 1501 }, as: VesselAgent, as_user_id: "${ves}", captures: { pc: $.data.id, pc_v: $.data.version } }
            - { call: "POST /port-ops/port-calls/${pc}/berth-assignments", payload: { berth_id: "${b1}", window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-10T22:00:00Z", expected_port_call_version: "${pc_v}" }, as: Harbormaster, captures: { ba: $.data.id } }
            - { call: "POST /port-ops/berth-assignments/${ba}/confirm", as: Harbormaster }
          trigger:
            - { call: "POST /port-ops/port-calls/${pc}/provisional-invoice", as: BillingClerk, captures: { pinv: $.data.id } }
          assert:
            - "Invoice.${pinv}.head_tax_cents == 3850064 (per-side: 1501x1350=2026350, discount round_half_up(101317.5)=101318 per side; (2026350-101318)x2)"
            - "Invoice.${pinv}.total_cents == 5275064 (dockage 1425000 + head_tax 3850064 + service 0)"
      - name: screening_requirement_nested_min_ceil
        grounds:
          - calculations.screening_staffing_requirement
        distinguishing_aspect: |
          Mode (a) formula with >=3 inputs and non-linear interaction: ceil over
          (pax / (60 x min(8, max(1, turnaround-2)))). 960 pax lands exactly on
          2.0 -> 2 officers (ceil edge, not 3); 961 -> 3; a 7h turnaround drives
          the min() arm to 5h -> 4 officers. Different mode than
          head_tax_per_side_discount_rounding_order (mode b).
        test_recipe:
          setup:
            - "Terminal; three calls: X booked 960 pax 12h turnaround, Y booked 961 pax 12h, Z booked 961 pax 7h turnaround"
          setup_api_calls:
            - { call: "POST /port-ops/terminals", payload: { name: "T1", max_apron_slots: 4, taxi_dispatch_capacity_per_window: 2 }, as: PortAuthorityAdmin, captures: { term: $.data.id } }
            - { call: "POST /port-ops/vessels", payload: { terminal_id: "${term}", name: "MV D", loa_ft: 950, draft_ft: 30.0, pax_capacity: 4000, crew_count: 900 }, as: PortAuthorityAdmin, captures: { ves: $.data.id } }
            - { call: "POST /port-ops/port-calls", payload: { terminal_id: "${term}", vessel_id: "${ves}", voyage_ref: "VX", scheduled_eta: "2026-08-10T08:00:00Z", scheduled_etd: "2026-08-10T20:00:00Z", booked_embark_pax: 960, booked_debark_pax: 0 }, as: VesselAgent, as_user_id: "${ves}", captures: { pcx: $.data.id } }
            - { call: "POST /port-ops/port-calls", payload: { terminal_id: "${term}", vessel_id: "${ves}", voyage_ref: "VY", scheduled_eta: "2026-08-12T08:00:00Z", scheduled_etd: "2026-08-12T20:00:00Z", booked_embark_pax: 961, booked_debark_pax: 0 }, as: VesselAgent, as_user_id: "${ves}", captures: { pcy: $.data.id } }
            - { call: "POST /port-ops/port-calls", payload: { terminal_id: "${term}", vessel_id: "${ves}", voyage_ref: "VZ", scheduled_eta: "2026-08-14T08:00:00Z", scheduled_etd: "2026-08-14T15:00:00Z", booked_embark_pax: 961, booked_debark_pax: 0 }, as: VesselAgent, as_user_id: "${ves}", captures: { pcz: $.data.id } }
          trigger:
            - { call: "GET /port-ops/terminals/${term}/screening-requirement", payload: { port_call_id: "${pcx}" }, as: TerminalOperator, captures: { rx: $.data.required_officers, wx: $.data.embark_window_hours } }
            - { call: "GET /port-ops/terminals/${term}/screening-requirement", payload: { port_call_id: "${pcy}" }, as: TerminalOperator, captures: { ry: $.data.required_officers } }
            - { call: "GET /port-ops/terminals/${term}/screening-requirement", payload: { port_call_id: "${pcz}" }, as: TerminalOperator, captures: { rz: $.data.required_officers, wz: $.data.embark_window_hours } }
          assert:
            - "call X: required_officers == 2 (960/480 == 2.0 exactly; ceil does not round up) and embark_window_hours == 8"
            - "call Y: required_officers == 3 (961/480 = 2.002 -> ceil 3)"
            - "call Z: required_officers == 4 and embark_window_hours == 5 (min arm: min(8, 7-2)=5; ceil(961/300)=4)"
      - name: invoice_total_pinned_evaluation_order
        grounds:
          - calculations.invoice_total
          - calculations.dockage_fee
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: the late penalty is 10% of the
          dockage subtotal which itself includes overtime priced from the same
          actual times that trigger the penalty. Only the pinned order
          (dockage -> head tax -> service fees -> gross -> minus adjustments)
          yields 1815488; penalty-on-base-only or pre-overtime variants differ.
        test_recipe:
          setup:
            - "Full turnaround executed: call arrived 08:00, departed 20:20 (12h20m actual vs 12h scheduled -> 1h overtime + late penalty)"
            - "3 EMBARK entries EMBARKED (2 STANDARD taxable + 1 CREW exempt); 1 DEBARK entry CLEARED"
            - "One PROVISIONING order COMPLETED with actual_units 10 (48000 cents, no surcharge)"
          setup_api_calls:
            - { call: "POST /port-ops/terminals", payload: { name: "T1", max_apron_slots: 4, taxi_dispatch_capacity_per_window: 2 }, as: PortAuthorityAdmin, captures: { term: $.data.id } }
            - { call: "POST /port-ops/berths", payload: { terminal_id: "${term}", berth_code: "B1", length_ft: 1200, max_draft_ft: 40.0 }, as: PortAuthorityAdmin, captures: { b1: $.data.id } }
            - { call: "POST /port-ops/vessels", payload: { terminal_id: "${term}", name: "MV E", loa_ft: 950, draft_ft: 30.0, pax_capacity: 4000, crew_count: 900 }, as: PortAuthorityAdmin, captures: { ves: $.data.id } }
            - { call: "POST /port-ops/berths", payload: { terminal_id: "${term}", berth_code: "B2", length_ft: 1100, max_draft_ft: 38.0 }, as: PortAuthorityAdmin }
            - { call: "POST /port-ops/port-calls", payload: { terminal_id: "${term}", vessel_id: "${ves}", voyage_ref: "V1", scheduled_eta: "2026-08-10T08:00:00Z", scheduled_etd: "2026-08-10T20:00:00Z", booked_embark_pax: 100, booked_debark_pax: 100 }, as: VesselAgent, as_user_id: "${ves}", captures: { pc: $.data.id, pc_v: $.data.version } }
            - { call: "POST /port-ops/port-calls/${pc}/berth-assignments", payload: { berth_id: "${b1}", window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-10T22:00:00Z", expected_port_call_version: "${pc_v}" }, as: Harbormaster, captures: { ba: $.data.id } }
            - { call: "POST /port-ops/berth-assignments/${ba}/confirm", as: Harbormaster }
            - { call: "POST /port-ops/port-calls/${pc}/customs-cases", as: CustomsOfficer, captures: { cc: $.data.id } }
            - { call: "POST /port-ops/customs-cases/${cc}/file", as: CustomsOfficer }
            - { call: "POST /port-ops/screening-lanes", payload: { terminal_id: "${term}", lane_code: "L1" }, as: PortAuthorityAdmin, captures: { lane: $.data.id } }
            - { call: "POST /port-ops/screening-lanes/${lane}/open", payload: { officers_assigned: 2 }, as: TerminalOperator }
            - { call: "POST /port-ops/port-calls/${pc}/manifest-entries", payload: { passenger_ref: "P1", direction: "EMBARK", cabin_class: "STANDARD" }, as: VesselAgent, as_user_id: "${ves}", captures: { e1: $.data.id } }
            - { call: "POST /port-ops/port-calls/${pc}/manifest-entries", payload: { passenger_ref: "P2", direction: "EMBARK", cabin_class: "PREMIUM" }, as: VesselAgent, as_user_id: "${ves}", captures: { e2: $.data.id } }
            - { call: "POST /port-ops/port-calls/${pc}/manifest-entries", payload: { passenger_ref: "P3", direction: "EMBARK", cabin_class: "CREW" }, as: VesselAgent, as_user_id: "${ves}", captures: { e3: $.data.id } }
            - { call: "POST /port-ops/port-calls/${pc}/manifest-entries", payload: { passenger_ref: "P4", direction: "DEBARK", cabin_class: "STANDARD" }, as: VesselAgent, as_user_id: "${ves}", captures: { e4: $.data.id } }
            - { call: "POST /port-ops/manifest-entries/${e1}/check-in", as: TerminalOperator }
            - { call: "POST /port-ops/manifest-entries/${e2}/check-in", as: TerminalOperator }
            - { call: "POST /port-ops/manifest-entries/${e3}/check-in", as: TerminalOperator }
            - { call: "POST /port-ops/port-calls/${pc}/arrive", payload: { actual_eta: "2026-08-10T08:00:00Z" }, as: Harbormaster }
            - { call: "POST /port-ops/port-calls/${pc}/begin-turnaround", as: TerminalOperator }
            - { call: "POST /port-ops/customs-cases/${cc}/clear", as: CustomsOfficer }
            - { call: "POST /port-ops/manifest-entries/${e1}/screen", as: TerminalOperator }
            - { call: "POST /port-ops/manifest-entries/${e1}/board", as: TerminalOperator }
            - { call: "POST /port-ops/manifest-entries/${e2}/screen", as: TerminalOperator }
            - { call: "POST /port-ops/manifest-entries/${e2}/board", as: TerminalOperator }
            - { call: "POST /port-ops/manifest-entries/${e3}/screen", as: TerminalOperator }
            - { call: "POST /port-ops/manifest-entries/${e3}/board", as: TerminalOperator }
            - { call: "POST /port-ops/manifest-entries/${e4}/disembark", as: TerminalOperator }
            - { call: "POST /port-ops/manifest-entries/${e4}/customs-release", as: CustomsOfficer }
            - { call: "POST /port-ops/port-calls/${pc}/service-orders", payload: { kind: "PROVISIONING", units: 10, window_start: "2026-08-10T10:00:00Z", window_end: "2026-08-10T12:00:00Z" }, as: VesselAgent, as_user_id: "${ves}", captures: { so: $.data.id } }
            - { call: "POST /port-ops/service-orders/${so}/approve", as: TerminalOperator, as_user_id: "op-1" }
            - { call: "POST /port-ops/service-orders/${so}/start", as: TerminalOperator }
            - { call: "POST /port-ops/service-orders/${so}/complete", payload: { actual_units: 10 }, as: TerminalOperator }
            - { call: "POST /port-ops/port-calls/${pc}/depart", payload: { actual_etd: "2026-08-10T20:20:00Z" }, as: Harbormaster }
          trigger:
            - { call: "POST /port-ops/port-calls/${pc}/close", as: BillingClerk }
            - { call: "GET /port-ops/invoices", payload: { port_call_id: "${pc}", kind: "FINAL" }, as: BillingClerk, captures: { fin: "$.data[0].id" } }
          assert:
            - "Invoice.${fin}.dockage_fee_cents == 1763438"
            - "Invoice.${fin}.head_tax_cents == 4050 (3 taxable: 2 EMBARKED non-CREW + 1 CLEARED; CREW excluded)"
            - "Invoice.${fin}.service_fee_cents == 48000"
            - "Invoice.${fin}.gross_cents == 1815488 and total_cents == 1815488"

  # ---------------------------------------------------------------- rule 3 ---
  - rule_id: non_linear_state_machine
    instances:
      - name: customs_case_refile_cycle
        grounds:
          - state_machines.CustomsCase.HELD_to_FILED
          - state_machines.CustomsCase.FILED_to_HELD
        distinguishing_aspect: |
          Cycle on CustomsCase: FILED -> HELD -> FILED -> CLEARED. The loop is
          legal and observable: during HELD, disembark is blocked; after re-FILE
          it is allowed again. Different entity and shape (pure cycle) than the
          direction-parallel flows of manifest_entry_direction_parallel_flows.
        test_recipe:
          setup:
            - "Call ARRIVED; customs case FILED; DEBARK entry E1 DISEMBARKED, DEBARK entry E2 ABOARD"
          setup_api_calls:
            - { call: "POST /port-ops/terminals", payload: { name: "T1", max_apron_slots: 4, taxi_dispatch_capacity_per_window: 2 }, as: PortAuthorityAdmin, captures: { term: $.data.id } }
            - { call: "POST /port-ops/berths", payload: { terminal_id: "${term}", berth_code: "B1", length_ft: 1200, max_draft_ft: 40.0 }, as: PortAuthorityAdmin, captures: { b1: $.data.id } }
            - { call: "POST /port-ops/vessels", payload: { terminal_id: "${term}", name: "MV F", loa_ft: 950, draft_ft: 30.0, pax_capacity: 4000, crew_count: 900 }, as: PortAuthorityAdmin, captures: { ves: $.data.id } }
            - { call: "POST /port-ops/port-calls", payload: { terminal_id: "${term}", vessel_id: "${ves}", voyage_ref: "V1", scheduled_eta: "2026-08-10T08:00:00Z", scheduled_etd: "2026-08-10T20:00:00Z", booked_embark_pax: 100, booked_debark_pax: 100 }, as: VesselAgent, as_user_id: "${ves}", captures: { pc: $.data.id, pc_v: $.data.version } }
            - { call: "POST /port-ops/port-calls/${pc}/manifest-entries", payload: { passenger_ref: "D1", direction: "DEBARK", cabin_class: "STANDARD" }, as: VesselAgent, as_user_id: "${ves}", captures: { e1: $.data.id } }
            - { call: "POST /port-ops/port-calls/${pc}/manifest-entries", payload: { passenger_ref: "D2", direction: "DEBARK", cabin_class: "STANDARD" }, as: VesselAgent, as_user_id: "${ves}", captures: { e2: $.data.id } }
            - { call: "POST /port-ops/port-calls/${pc}/customs-cases", as: CustomsOfficer, captures: { cc: $.data.id } }
            - { call: "POST /port-ops/customs-cases/${cc}/file", as: CustomsOfficer }
            - { call: "POST /port-ops/port-calls/${pc}/berth-assignments", payload: { berth_id: "${b1}", window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-10T22:00:00Z", expected_port_call_version: "${pc_v}" }, as: Harbormaster, captures: { ba: $.data.id } }
            - { call: "POST /port-ops/berth-assignments/${ba}/confirm", as: Harbormaster }
            - { call: "POST /port-ops/port-calls/${pc}/arrive", payload: { actual_eta: "2026-08-10T08:00:00Z" }, as: Harbormaster }
            - { call: "POST /port-ops/manifest-entries/${e1}/disembark", as: TerminalOperator }
          trigger:
            - { call: "POST /port-ops/customs-cases/${cc}/hold", payload: { reason: "agriculture inspection" }, as: CustomsOfficer }
            - { call: "POST /port-ops/manifest-entries/${e2}/disembark", as: TerminalOperator, captures: { err: $.data.error_id } }
            - { call: "POST /port-ops/customs-cases/${cc}/file", as: CustomsOfficer }
            - { call: "POST /port-ops/manifest-entries/${e2}/disembark", as: TerminalOperator }
            - { call: "POST /port-ops/customs-cases/${cc}/clear", as: CustomsOfficer }
          assert:
            - "After hold: CustomsCase.${cc}.status == HELD"
            - "E2 disembark during HELD rejected: err == ERR_CUSTOMS_HOLD_ACTIVE"
            - "After re-file: CustomsCase.${cc}.status == FILED and ManifestEntry.${e2}.status == DISEMBARKED (cycle hop works)"
            - "After clear: CustomsCase.${cc}.status == CLEARED (terminal)"
      - name: manifest_entry_direction_parallel_flows
        grounds:
          - state_machines.ManifestEntry.BOOKED_to_CHECKED_IN
          - state_machines.ManifestEntry.ABOARD_to_DISEMBARKED
          - validations[priority=7]
        distinguishing_aspect: |
          Parallel direction-conditioned flows on ONE entity: the same row type
          runs BOOKED->CHECKED_IN->SCREENED->EMBARKED (EMBARK) or
          ABOARD->DISEMBARKED->CLEARED (DEBARK); cross-firing an action of the
          wrong flow is rejected with ERR_MANIFEST_DIRECTION. Different entity
          and shape (parallel/branching) than the CustomsCase cycle.
        test_recipe:
          setup:
            - "Call TURNAROUND with customs CLEARED; entry EE (EMBARK) and entry ED (DEBARK)"
          setup_api_calls:
            - { call: "POST /port-ops/terminals", payload: { name: "T1", max_apron_slots: 4, taxi_dispatch_capacity_per_window: 2 }, as: PortAuthorityAdmin, captures: { term: $.data.id } }
            - { call: "POST /port-ops/berths", payload: { terminal_id: "${term}", berth_code: "B1", length_ft: 1200, max_draft_ft: 40.0 }, as: PortAuthorityAdmin, captures: { b1: $.data.id } }
            - { call: "POST /port-ops/vessels", payload: { terminal_id: "${term}", name: "MV G", loa_ft: 950, draft_ft: 30.0, pax_capacity: 4000, crew_count: 900 }, as: PortAuthorityAdmin, captures: { ves: $.data.id } }
            - { call: "POST /port-ops/port-calls", payload: { terminal_id: "${term}", vessel_id: "${ves}", voyage_ref: "V1", scheduled_eta: "2026-08-10T08:00:00Z", scheduled_etd: "2026-08-10T20:00:00Z", booked_embark_pax: 100, booked_debark_pax: 100 }, as: VesselAgent, as_user_id: "${ves}", captures: { pc: $.data.id, pc_v: $.data.version } }
            - { call: "POST /port-ops/port-calls/${pc}/manifest-entries", payload: { passenger_ref: "E1", direction: "EMBARK", cabin_class: "STANDARD" }, as: VesselAgent, as_user_id: "${ves}", captures: { ee: $.data.id } }
            - { call: "POST /port-ops/port-calls/${pc}/manifest-entries", payload: { passenger_ref: "D1", direction: "DEBARK", cabin_class: "STANDARD" }, as: VesselAgent, as_user_id: "${ves}", captures: { ed: $.data.id } }
            - { call: "POST /port-ops/manifest-entries/${ed}/check-in", as: TerminalOperator, captures: { err1: $.data.error_id } }
            - { call: "POST /port-ops/manifest-entries/${ee}/disembark", as: TerminalOperator, captures: { err2: $.data.error_id } }
            - { call: "POST /port-ops/manifest-entries/${ee}/check-in", as: TerminalOperator }
            - { call: "POST /port-ops/port-calls/${pc}/berth-assignments", payload: { berth_id: "${b1}", window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-10T22:00:00Z", expected_port_call_version: "${pc_v}" }, as: Harbormaster, captures: { ba: $.data.id } }
            - { call: "POST /port-ops/berth-assignments/${ba}/confirm", as: Harbormaster }
            - { call: "POST /port-ops/port-calls/${pc}/customs-cases", as: CustomsOfficer, captures: { cc: $.data.id } }
            - { call: "POST /port-ops/customs-cases/${cc}/file", as: CustomsOfficer }
            - { call: "POST /port-ops/screening-lanes", payload: { terminal_id: "${term}", lane_code: "L1" }, as: PortAuthorityAdmin, captures: { lane: $.data.id } }
            - { call: "POST /port-ops/screening-lanes/${lane}/open", payload: { officers_assigned: 2 }, as: TerminalOperator }
            - { call: "POST /port-ops/port-calls/${pc}/arrive", payload: { actual_eta: "2026-08-10T08:00:00Z" }, as: Harbormaster }
            - { call: "POST /port-ops/manifest-entries/${ee}/screen", as: TerminalOperator }
            - { call: "POST /port-ops/port-calls/${pc}/begin-turnaround", as: TerminalOperator }
            - { call: "POST /port-ops/customs-cases/${cc}/clear", as: CustomsOfficer }
          trigger:
            - { call: "POST /port-ops/manifest-entries/${ee}/board", as: TerminalOperator }
            - { call: "POST /port-ops/manifest-entries/${ed}/disembark", as: TerminalOperator }
            - { call: "POST /port-ops/manifest-entries/${ed}/customs-release", as: CustomsOfficer }
          assert:
            - "err1 == ERR_MANIFEST_DIRECTION (check-in on DEBARK entry)"
            - "err2 == ERR_MANIFEST_DIRECTION (disembark on EMBARK entry)"
            - "ManifestEntry.${ee}.status == EMBARKED (embark-flow terminal)"
            - "ManifestEntry.${ed}.status == CLEARED (debark-flow terminal)"
      - name: port_call_delay_revision_cycle
        grounds:
          - state_machines.PortCall.SCHEDULED_to_DELAYED
          - state_machines.PortCall.DELAYED_to_SCHEDULED
        distinguishing_aspect: |
          Cycle on PortCall: SCHEDULED -> DELAYED -> SCHEDULED -> DELAYED ->
          SCHEDULED twice around the loop, with revised times applied on each
          confirm and version stepping 1->5. Third non-linear shape, on the
          aggregate root.
        test_recipe:
          setup:
            - "Bare call V1 (no berth assignment, so the confirm-revised cascade is a no-op)"
          setup_api_calls:
            - { call: "POST /port-ops/terminals", payload: { name: "T1", max_apron_slots: 4, taxi_dispatch_capacity_per_window: 2 }, as: PortAuthorityAdmin, captures: { term: $.data.id } }
            - { call: "POST /port-ops/vessels", payload: { terminal_id: "${term}", name: "MV H", loa_ft: 950, draft_ft: 30.0, pax_capacity: 4000, crew_count: 900 }, as: PortAuthorityAdmin, captures: { ves: $.data.id } }
            - { call: "POST /port-ops/port-calls", payload: { terminal_id: "${term}", vessel_id: "${ves}", voyage_ref: "V1", scheduled_eta: "2026-08-10T08:00:00Z", scheduled_etd: "2026-08-10T20:00:00Z", booked_embark_pax: 10, booked_debark_pax: 10 }, as: VesselAgent, as_user_id: "${ves}", captures: { pc: $.data.id, pc_v0: $.data.version } }
          trigger:
            - { call: "POST /port-ops/port-calls/${pc}/delay", payload: { revised_eta: "2026-08-11T08:00:00Z", revised_etd: "2026-08-11T20:00:00Z", reason: "weather" }, as: VesselAgent, as_user_id: "${ves}" }
            - { call: "POST /port-ops/port-calls/${pc}/confirm-revised", as: Harbormaster }
            - { call: "POST /port-ops/port-calls/${pc}/delay", payload: { revised_eta: "2026-08-12T08:00:00Z", revised_etd: "2026-08-12T20:00:00Z", reason: "congestion" }, as: VesselAgent, as_user_id: "${ves}" }
            - { call: "POST /port-ops/port-calls/${pc}/confirm-revised", as: Harbormaster }
            - { call: "GET /port-ops/port-calls/${pc}", as: Harbormaster, captures: { fin_eta: $.data.scheduled_eta, fin_st: $.data.status, fin_v: $.data.version } }
          assert:
            - "PortCall.${pc}.status == SCHEDULED after two full loop iterations"
            - "PortCall.${pc}.scheduled_eta == 2026-08-12T08:00:00Z (second revision applied)"
            - "PortCall.${pc}.version == 5 (create + 2 delays + 2 confirms)"

  # ---------------------------------------------------------------- rule 4 ---
  - rule_id: transitive_cascade
    instances:
      - name: confirm_revised_window_lost_cascade
        grounds:
          - state_machines.PortCall.DELAYED_to_SCHEDULED
          - state_machines.BerthAssignment.CONFIRMED_to_SUPERSEDED
          - calculations.service_fee
        distinguishing_aspect: |
          Depth-3 chain from confirm-revised: (1) CONFIRMED BerthAssignment
          whose window no longer contains the revised schedule -> SUPERSEDED;
          (2) that supersede rejects the APPROVED ServiceOrder whose window lost
          its container (WINDOW_LOST); (3) that rejection recomputes the DRAFT
          PROVISIONAL invoice's service_fee_cents 48000 -> 0. Each hop is caused
          by the previous hop, not by the original call.
        test_recipe:
          setup:
            - "Call V1 SCHEDULED 2026-08-10T08:00:00Z->20:00Z; CONFIRMED assignment [06:00, 22:00] on 2026-08-10"
            - "PROVISIONING order (10 units, window 10:00-12:00) APPROVED"
            - "PROVISIONAL invoice DRAFT: dockage 1425000, head_tax 270000, service_fee 48000, gross 1743000"
          setup_api_calls:
            - { call: "POST /port-ops/terminals", payload: { name: "T1", max_apron_slots: 4, taxi_dispatch_capacity_per_window: 2 }, as: PortAuthorityAdmin, captures: { term: $.data.id } }
            - { call: "POST /port-ops/berths", payload: { terminal_id: "${term}", berth_code: "B1", length_ft: 1200, max_draft_ft: 40.0 }, as: PortAuthorityAdmin, captures: { b1: $.data.id } }
            - { call: "POST /port-ops/vessels", payload: { terminal_id: "${term}", name: "MV I", loa_ft: 950, draft_ft: 30.0, pax_capacity: 4000, crew_count: 900 }, as: PortAuthorityAdmin, captures: { ves: $.data.id } }
            - { call: "POST /port-ops/port-calls", payload: { terminal_id: "${term}", vessel_id: "${ves}", voyage_ref: "V1", scheduled_eta: "2026-08-10T08:00:00Z", scheduled_etd: "2026-08-10T20:00:00Z", booked_embark_pax: 100, booked_debark_pax: 100 }, as: VesselAgent, as_user_id: "${ves}", captures: { pc: $.data.id, pc_v: $.data.version } }
            - { call: "POST /port-ops/port-calls/${pc}/berth-assignments", payload: { berth_id: "${b1}", window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-10T22:00:00Z", expected_port_call_version: "${pc_v}" }, as: Harbormaster, captures: { ba: $.data.id } }
            - { call: "POST /port-ops/berth-assignments/${ba}/confirm", as: Harbormaster }
            - { call: "POST /port-ops/port-calls/${pc}/service-orders", payload: { kind: "PROVISIONING", units: 10, window_start: "2026-08-10T10:00:00Z", window_end: "2026-08-10T12:00:00Z" }, as: VesselAgent, as_user_id: "${ves}", captures: { so: $.data.id } }
            - { call: "POST /port-ops/service-orders/${so}/approve", as: TerminalOperator, as_user_id: "op-1" }
            - { call: "POST /port-ops/port-calls/${pc}/provisional-invoice", as: BillingClerk, captures: { pinv: $.data.id, gross0: $.data.gross_cents, svc0: $.data.service_fee_cents } }
            - { call: "POST /port-ops/port-calls/${pc}/delay", payload: { revised_eta: "2026-08-11T08:00:00Z", revised_etd: "2026-08-11T20:00:00Z", reason: "storm front" }, as: VesselAgent, as_user_id: "${ves}" }
          trigger:
            - { call: "POST /port-ops/port-calls/${pc}/confirm-revised", as: Harbormaster }
            - { call: "GET /port-ops/berth-assignments/${ba}", as: Harbormaster, captures: { ba_st: $.data.status } }
            - { call: "GET /port-ops/service-orders/${so}", as: Harbormaster, captures: { so_st: $.data.status, so_rr: $.data.reject_reason } }
            - { call: "GET /port-ops/invoices/${pinv}", as: BillingClerk, captures: { svc1: $.data.service_fee_cents, gross1: $.data.gross_cents, tot1: $.data.total_cents } }
          assert:
            - "Pre-cascade: svc0 == 48000 and gross0 == 1743000"
            - "Hop 1: BerthAssignment.${ba}.status == SUPERSEDED (window 2026-08-10 cannot contain revised 2026-08-11 schedule)"
            - "Hop 2: ServiceOrder.${so}.status == REJECTED and reject_reason == WINDOW_LOST"
            - "Hop 3: Invoice.${pinv}.service_fee_cents == 0, gross_cents == 1695000, total_cents == 1695000 (dockage 1425000 + head_tax 270000 + 0)"
      - name: customs_hold_cascade
        grounds:
          - state_machines.CustomsCase.FILED_to_HELD
          - state_machines.ManifestEntry.DISEMBARKED_to_HELD
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (customs hold): the hold mutates
          the CustomsCase (hop 1); that status flip cascades to DISEMBARKED debark
          entries -> HELD (hop 2). Conditional: the still-ABOARD entry is
          untouched. Different trigger and propagation pattern than
          confirm_revised_window_lost_cascade.
        test_recipe:
          setup:
            - "Call ARRIVED; case FILED; E1 DISEMBARKED; E2 ABOARD"
          setup_api_calls:
            - { call: "POST /port-ops/terminals", payload: { name: "T1", max_apron_slots: 4, taxi_dispatch_capacity_per_window: 2 }, as: PortAuthorityAdmin, captures: { term: $.data.id } }
            - { call: "POST /port-ops/berths", payload: { terminal_id: "${term}", berth_code: "B1", length_ft: 1200, max_draft_ft: 40.0 }, as: PortAuthorityAdmin, captures: { b1: $.data.id } }
            - { call: "POST /port-ops/vessels", payload: { terminal_id: "${term}", name: "MV J", loa_ft: 950, draft_ft: 30.0, pax_capacity: 4000, crew_count: 900 }, as: PortAuthorityAdmin, captures: { ves: $.data.id } }
            - { call: "POST /port-ops/port-calls", payload: { terminal_id: "${term}", vessel_id: "${ves}", voyage_ref: "V1", scheduled_eta: "2026-08-10T08:00:00Z", scheduled_etd: "2026-08-10T20:00:00Z", booked_embark_pax: 100, booked_debark_pax: 100 }, as: VesselAgent, as_user_id: "${ves}", captures: { pc: $.data.id, pc_v: $.data.version } }
            - { call: "POST /port-ops/port-calls/${pc}/manifest-entries", payload: { passenger_ref: "D1", direction: "DEBARK", cabin_class: "STANDARD" }, as: VesselAgent, as_user_id: "${ves}", captures: { e1: $.data.id } }
            - { call: "POST /port-ops/port-calls/${pc}/manifest-entries", payload: { passenger_ref: "D2", direction: "DEBARK", cabin_class: "PREMIUM" }, as: VesselAgent, as_user_id: "${ves}", captures: { e2: $.data.id } }
            - { call: "POST /port-ops/port-calls/${pc}/customs-cases", as: CustomsOfficer, captures: { cc: $.data.id } }
            - { call: "POST /port-ops/customs-cases/${cc}/file", as: CustomsOfficer }
            - { call: "POST /port-ops/port-calls/${pc}/berth-assignments", payload: { berth_id: "${b1}", window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-10T22:00:00Z", expected_port_call_version: "${pc_v}" }, as: Harbormaster, captures: { ba: $.data.id } }
            - { call: "POST /port-ops/berth-assignments/${ba}/confirm", as: Harbormaster }
            - { call: "POST /port-ops/port-calls/${pc}/arrive", payload: { actual_eta: "2026-08-10T08:00:00Z" }, as: Harbormaster }
            - { call: "POST /port-ops/manifest-entries/${e1}/disembark", as: TerminalOperator }
          trigger:
            - { call: "POST /port-ops/customs-cases/${cc}/hold", payload: { reason: "manifest discrepancy" }, as: CustomsOfficer }
            - { call: "GET /port-ops/manifest-entries/${e1}", as: CustomsOfficer, captures: { e1_st: $.data.status } }
            - { call: "GET /port-ops/manifest-entries/${e2}", as: CustomsOfficer, captures: { e2_st: $.data.status } }
          assert:
            - "Hop 1: CustomsCase.${cc}.status == HELD and hold_reason == manifest discrepancy"
            - "Hop 2 (conditional cascade): ManifestEntry.${e1}.status == HELD (was DISEMBARKED)"
            - "Untouched by cascade: ManifestEntry.${e2}.status == ABOARD"

  # ---------------------------------------------------------------- rule 5 ---
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: emergency_posture_beats_window_conflict
        grounds:
          - validations[priority=9]
          - validations[priority=14]
          - calculations.terminal_posture
        distinguishing_aspect: |
          Error-category pair business_safety (p8) vs business_temporal (p13):
          the confirm violates BOTH the EMERGENCY posture gate and the
          120-minute buffer rule; the safety error ERR_POSTURE_EMERGENCY must
          win over ERR_BERTH_WINDOW_CONFLICT. Different category pair than
          invalid_state_beats_overpayment (state vs fiscal).
        test_recipe:
          setup:
            - "Call A CONFIRMED assignment [2026-08-10T06:00, 2026-08-10T22:00] on berth B1"
            - "Call B TENTATIVE assignment [2026-08-10T23:00, 2026-08-11T11:00] (60-minute gap -> would violate the buffer)"
            - "EMERGENCY advisory ACTIVE covering logical now 2026-08-10T12:00:00Z -> posture EMERGENCY"
          setup_api_calls:
            - { call: "POST /port-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PortAuthorityAdmin }
            - { call: "POST /port-ops/terminals", payload: { name: "T1", max_apron_slots: 4, taxi_dispatch_capacity_per_window: 2 }, as: PortAuthorityAdmin, captures: { term: $.data.id } }
            - { call: "POST /port-ops/berths", payload: { terminal_id: "${term}", berth_code: "B1", length_ft: 1200, max_draft_ft: 40.0 }, as: PortAuthorityAdmin, captures: { b1: $.data.id } }
            - { call: "POST /port-ops/vessels", payload: { terminal_id: "${term}", name: "MV K", loa_ft: 950, draft_ft: 30.0, pax_capacity: 4000, crew_count: 900 }, as: PortAuthorityAdmin, captures: { ves: $.data.id } }
            - { call: "POST /port-ops/port-calls", payload: { terminal_id: "${term}", vessel_id: "${ves}", voyage_ref: "VA", scheduled_eta: "2026-08-10T08:00:00Z", scheduled_etd: "2026-08-10T20:00:00Z", booked_embark_pax: 10, booked_debark_pax: 10 }, as: VesselAgent, as_user_id: "${ves}", captures: { pca: $.data.id, pca_v: $.data.version } }
            - { call: "POST /port-ops/port-calls/${pca}/berth-assignments", payload: { berth_id: "${b1}", window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-10T22:00:00Z", expected_port_call_version: "${pca_v}" }, as: Harbormaster, captures: { baa: $.data.id } }
            - { call: "POST /port-ops/berth-assignments/${baa}/confirm", as: Harbormaster }
            - { call: "POST /port-ops/port-calls", payload: { terminal_id: "${term}", vessel_id: "${ves}", voyage_ref: "VB", scheduled_eta: "2026-08-11T01:00:00Z", scheduled_etd: "2026-08-11T09:00:00Z", booked_embark_pax: 10, booked_debark_pax: 10 }, as: VesselAgent, as_user_id: "${ves}", captures: { pcb: $.data.id, pcb_v: $.data.version } }
            - { call: "POST /port-ops/port-calls/${pcb}/berth-assignments", payload: { berth_id: "${b1}", window_start: "2026-08-10T23:00:00Z", window_end: "2026-08-11T11:00:00Z", expected_port_call_version: "${pcb_v}" }, as: Harbormaster, captures: { bab: $.data.id } }
            - { call: "POST /port-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T12:00:00Z" }, as: PortAuthorityAdmin }
            - { call: "POST /port-ops/weather-advisories", payload: { terminal_id: "${term}", severity: "EMERGENCY", window_start: "2026-08-10T00:00:00Z", window_end: "2026-08-11T00:00:00Z" }, as: PortAuthorityAdmin, captures: { adv: $.data.id } }
          trigger:
            - { call: "POST /port-ops/berth-assignments/${bab}/confirm", as: Harbormaster, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_POSTURE_EMERGENCY (safety p8 wins) and NOT ERR_BERTH_WINDOW_CONFLICT (temporal p13, also violated)"
            - "BerthAssignment.${bab}.status remains TENTATIVE"
      - name: invalid_state_beats_overpayment
        grounds:
          - validations[priority=8]
          - validations[priority=23]
        distinguishing_aspect: |
          Error-category pair state (p7) vs business_fiscal (p22): settling a
          DRAFT invoice with an overpaying amount must return ERR_INVALID_STATE,
          not ERR_OVERPAYMENT. Different pair than
          emergency_posture_beats_window_conflict (safety vs temporal).
        test_recipe:
          setup:
            - "Call with CONFIRMED assignment; PROVISIONAL invoice DRAFT with total_cents == 1695000 (dockage 1425000 + head tax 270000)"
          setup_api_calls:
            - { call: "POST /port-ops/terminals", payload: { name: "T1", max_apron_slots: 4, taxi_dispatch_capacity_per_window: 2 }, as: PortAuthorityAdmin, captures: { term: $.data.id } }
            - { call: "POST /port-ops/berths", payload: { terminal_id: "${term}", berth_code: "B1", length_ft: 1200, max_draft_ft: 40.0 }, as: PortAuthorityAdmin, captures: { b1: $.data.id } }
            - { call: "POST /port-ops/vessels", payload: { terminal_id: "${term}", name: "MV L", loa_ft: 950, draft_ft: 30.0, pax_capacity: 4000, crew_count: 900 }, as: PortAuthorityAdmin, captures: { ves: $.data.id } }
            - { call: "POST /port-ops/port-calls", payload: { terminal_id: "${term}", vessel_id: "${ves}", voyage_ref: "V1", scheduled_eta: "2026-08-10T08:00:00Z", scheduled_etd: "2026-08-10T20:00:00Z", booked_embark_pax: 100, booked_debark_pax: 100 }, as: VesselAgent, as_user_id: "${ves}", captures: { pc: $.data.id, pc_v: $.data.version } }
            - { call: "POST /port-ops/port-calls/${pc}/berth-assignments", payload: { berth_id: "${b1}", window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-10T22:00:00Z", expected_port_call_version: "${pc_v}" }, as: Harbormaster, captures: { ba: $.data.id } }
            - { call: "POST /port-ops/berth-assignments/${ba}/confirm", as: Harbormaster }
            - { call: "POST /port-ops/port-calls/${pc}/provisional-invoice", as: BillingClerk, captures: { pinv: $.data.id, tot: $.data.total_cents } }
          trigger:
            - { call: "POST /port-ops/invoices/${pinv}/settle", payload: { payment_cents: 1695001 }, as: BillingClerk, captures: { err: $.data.error_id } }
          assert:
            - "tot == 1695000 (sanity on the pinned provisional amounts)"
            - "err == ERR_INVALID_STATE (state p7 wins) and NOT ERR_OVERPAYMENT (fiscal p22, also violated: 1695001 > 1695000)"
            - "Invoice.${pinv}.status remains DRAFT"

  # ---------------------------------------------------------------- rule 6 ---
  - rule_id: boundary_precision_check
    instances:
      - name: head_tax_tier_at_exactly_3000_vs_2999
        grounds:
          - calculations.passenger_head_tax
        distinguishing_aspect: |
          Metric: taxable passenger count; endpoint: provisional-invoice create.
          The volume discount is >= 3000 INCLUSIVE: exactly 3000 booked pax gets
          the 5% discount (3847500), 2999 does not (4048650).
        test_recipe:
          setup:
            - "Call A booked 1500+1500 = 3000 pax; call B booked 1501+1498 = 2999 pax; both with CONFIRMED assignments on different days"
          setup_api_calls:
            - { call: "POST /port-ops/terminals", payload: { name: "T1", max_apron_slots: 4, taxi_dispatch_capacity_per_window: 2 }, as: PortAuthorityAdmin, captures: { term: $.data.id } }
            - { call: "POST /port-ops/berths", payload: { terminal_id: "${term}", berth_code: "B1", length_ft: 1200, max_draft_ft: 40.0 }, as: PortAuthorityAdmin, captures: { b1: $.data.id } }
