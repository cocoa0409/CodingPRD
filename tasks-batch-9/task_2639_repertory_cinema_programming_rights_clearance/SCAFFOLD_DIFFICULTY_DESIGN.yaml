          - errors[ERR_KDM_WINDOW_OVERLAP]
          - state_machines.KdmKey[(none) -> ISSUED]
          - entities.KdmKey.valid_from
        distinguishing_aspect: |
          Resource: the ISSUED key set for one encrypted DcpAsset on one projection server. Interval
          semantics: CLOSED [valid_from, valid_until], and the test is `candidate.valid_from <= K2.valid_until
          AND K2.valid_from <= candidate.valid_until`, so a candidate starting at the exact instant the
          incumbent expires IS an overlap and is refused. This is the deliberate inverse of the screen
          resource, where the identical adjacency is allowed.
