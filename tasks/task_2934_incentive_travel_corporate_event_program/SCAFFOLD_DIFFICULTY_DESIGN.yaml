- rule_id: cross_entity_state_dependency
  instances:
  - name: deposit_milestone_payment_gated_on_parent_contract_executed
    grounds:
    - §1.2 DepositMilestone SCHEDULED -> PAID precondition "the parent SupplierContract.status == EXECUTED"
    - §1.4 priority 12 ERR_CONTRACT_STATE_INVALID (cross-entity state guard)
    - §1.5 POST /deposit-milestones/{milestone_id}/pay
    - §1.3 cancellation_exposure_projection (recomputed on payment)
    distinguishing_aspect: |-
      A DepositMilestone in SCHEDULED cannot be paid while its parent SupplierContract is still PROPOSED — the pay call returns ERR_CONTRACT_STATE_INVALID with HTTP 409 and leaves paid_at null — yet the identical call succeeds the moment the parent reaches EXECUTED, proving the gate lives on the parent entity's state and not on the milestone's own.
    test_recipe:
      setup:
      - Empty database, logical clock at its 2026-08-01T00:00:00Z default.
      - Program SOURCING on budget 5000000 with Lisbon SHORTLISTED.
      - Contract C1 is PROPOSED (round_count 1, proposed by sm-01) and carries three SCHEDULED milestones
        summing to exactly its 2310000 value.
      - Milestone 1 is due 2026-08-15T00:00:00Z, i.e. not yet matured against the logical clock.
      setup_api_calls:
      - call: POST /programs
        payload:
