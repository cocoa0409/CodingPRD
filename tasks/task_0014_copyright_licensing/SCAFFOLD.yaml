# =============================================================================
# Copyright Licensing Trading Platform — SCAFFOLD.yaml
# =============================================================================

scenario: |
  Copyright licensing trading platform: copyright registration with work metadata,
  ownership proof submission, co-owner declaration, registration certificate
  issuance, and rights-chain history; licensing scope negotiation with territory,
  term, media type, exclusive/non-exclusive, sublicense permission, and
  revision-rights configuration, including offer-counteroffer history and
  clause-level comparison; multi-party contract signing with signing-order
  definition, electronic signature, supplementary agreement linkage, and contract
  effective-date management; royalty calculation with fixed fee, revenue-sharing
  percentage, minimum guarantee, advance deduction, multi-period settlement, and
  refund-induced reversal; infringement reporting and arbitration with evidence
  submission, ownership re-verification, alleged infringer response, multi-stage
  review, takedown notice issuance, and compensation enforcement; rights conflict
  detection with overlapping-license check, exclusive-license violation alert,
  and territory/term overlap warning; event-driven synchronization with payment,
  electronic signature, copyright authority, and content distribution platforms;
  audit logging for license changes, contract amendments, and dispute records.

domain_name: copyright-licensing
api_prefix: /works

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - version_pinning_on_approval
    - scheduled_deferred_actions
    - compliance_audit_trail

  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: saga

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Work
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Work title" }
      - { name: work_type, type: enum, source: input, description: "LITERARY | MUSIC | FILM | SOFTWARE | ARTWORK", constraints: "Required at creation" }
      - { name: creation_date, type: datetime, source: input, description: "Original date of creation, ISO 8601 UTC" }
      - { name: primary_owner_id, type: string, source: input, description: "Rights Holder id of the primary owner; entity_backed RightsHolder.id" }
      - { name: co_owners, type: array, source: input, description: "Array of {rights_holder_id, share_bps} where share_bps are integer basis points; sum across array + primary_owner share = 10000" }
      - { name: primary_share_bps, type: integer, source: input, description: "Basis points held by primary_owner (10000 = 100%)" }
      - { name: ownership_proof_doc_id, type: string, source: input, description: "Opaque id of submitted proof document" }
      - { name: registration_status, type: enum, source: system, description: "DRAFT | UNDER_REVIEW | REGISTERED | REJECTED" }
      - { name: certificate_id, type: string, source: system, description: "Issued on REGISTERED transition; null otherwise" }
      - { name: certificate_issued_at, type: datetime, source: system, description: "Timestamp of certificate issuance" }
      - { name: rights_chain_event_count, type: integer, source: computed, description: "Count of RightsChainEvent rows where work_id = self.id" }

  - name: RightsHolder
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Legal name of the rights holder" }
      - { name: holder_type, type: enum, source: input, description: "INDIVIDUAL | ENTITY" }
      - { name: contact_email, type: string, source: input, description: "Primary email" }
      - { name: jurisdiction, type: string, source: input, description: "ISO 3166-1 alpha-2 country code of legal residence" }

  - name: License
    parent: null
    common_fields: true
    fields:
      - { name: work_id, type: string, source: input, description: "FK to Work.id; Work must be REGISTERED" }
      - { name: licensor_id, type: string, source: input, description: "FK to RightsHolder.id; must be primary_owner or a co_owner of the work" }
      - { name: licensee_id, type: string, source: input, description: "FK to RightsHolder.id; must differ from licensor_id" }
      - { name: territory, type: array, source: input, description: "Array of ISO 3166-1 alpha-2 country codes; non-empty; element 'WORLD' is exclusive of all others" }
      - { name: term_start, type: datetime, source: input, description: "ISO 8601 UTC; license effective lower bound (inclusive)" }
      - { name: term_end, type: datetime, source: input, description: "ISO 8601 UTC; license effective upper bound (exclusive)" }
      - { name: media_types, type: array, source: input, description: "Subset of {DIGITAL, PRINT, BROADCAST, MERCHANDISE}; non-empty" }
      - { name: exclusivity, type: enum, source: input, description: "EXCLUSIVE | NON_EXCLUSIVE" }
      - { name: sublicense_allowed, type: boolean, source: input, description: "Whether licensee may sublicense" }
      - { name: revision_rights, type: enum, source: input, description: "NONE | MINOR | FULL — controls derivative-work permissions" }
      - { name: fixed_fee_cents, type: integer, source: input, description: "One-time fixed fee in minor currency units" }
      - { name: revenue_share_bps, type: integer, source: input, description: "Royalty share in basis points (0–10000)" }
      - { name: minimum_guarantee_cents, type: integer, source: input, description: "Minimum guarantee per settlement period in cents" }
      - { name: advance_cents, type: integer, source: input, description: "Advance paid up front in cents; recoupable against royalties" }
      - { name: settlement_period, type: enum, source: input, description: "MONTHLY | QUARTERLY | ANNUAL" }
      - { name: status, type: enum, source: system, description: "OFFERED | COUNTERED | ACCEPTED | SIGNED | EFFECTIVE | TERMINATED | EXPIRED | WITHDRAWN" }
      - { name: current_round, type: integer, source: system, description: "Counter incremented on each counter-offer; starts at 1 on creation" }
      - { name: pinned_work_version, type: integer, source: system, description: "Work.version captured at ACCEPTED transition; null until then" }
      - { name: contract_id, type: string, source: system, description: "FK to Contract.id once a contract is created from this license; null until then" }
      - { name: effective_date, type: datetime, source: system, description: "Set when contract.fully_signed_at exists and now() >= effective_date_target; bounded by term_start" }
      - { name: cumulative_advance_recouped_cents, type: integer, source: computed, description: "Running sum of advance_cents recouped across SETTLED RoyaltyStatements for this license" }

  - name: NegotiationRound
    parent: License
    common_fields: false
    fields:
      - { name: license_id, type: string, source: system, description: "FK to License.id" }
      - { name: round_number, type: integer, source: system, description: "1-indexed; equals License.current_round at creation" }
      - { name: proposed_by_id, type: string, source: input, description: "FK to RightsHolder.id; must be licensor_id or licensee_id of parent License" }
      - { name: clause_diff, type: object, source: input, description: "Object whose keys are License field names and values are {old, new}; pinned at submission time" }
      - { name: action, type: enum, source: input, description: "OFFER | COUNTER | ACCEPT | WITHDRAW" }
      - { name: submitted_at, type: datetime, source: system, description: "Submission timestamp" }

  - name: Contract
    parent: null
    common_fields: true
    fields:
      - { name: license_id, type: string, source: input, description: "FK to License.id; License must be in ACCEPTED state" }
      - { name: signing_order, type: array, source: input, description: "Ordered list of RightsHolder ids defining required signing sequence; first element signs first" }
      - { name: effective_date_target, type: datetime, source: input, description: "Target effective date; must satisfy term_start <= effective_date_target < term_end of License" }
      - { name: status, type: enum, source: system, description: "PENDING_SIGNATURES | FULLY_SIGNED | EFFECTIVE | TERMINATED | SUPERSEDED" }
      - { name: signed_count, type: integer, source: computed, description: "Number of Signature rows for this contract" }
      - { name: fully_signed_at, type: datetime, source: system, description: "Timestamp when last required signer signed" }
      - { name: parent_contract_id, type: string, source: input, description: "Null for primary contract; set on supplementary agreements pointing to the supplemented contract" }

  - name: Signature
    parent: Contract
    common_fields: false
    fields:
      - { name: contract_id, type: string, source: system, description: "FK to Contract.id" }
      - { name: signer_id, type: string, source: input, description: "FK to RightsHolder.id; must equal Contract.signing_order[Contract.signed_count] at submission" }
      - { name: signature_payload, type: string, source: input, description: "Opaque signed payload (e.g., base64 DSA blob)" }
      - { name: signed_at, type: datetime, source: system, description: "Server-stamped timestamp" }

  - name: RoyaltyStatement
    parent: License
    common_fields: true
    fields:
      - { name: license_id, type: string, source: system, description: "FK to License.id; License must be EFFECTIVE at period_end_at" }
      - { name: period_start_at, type: datetime, source: input, description: "Inclusive lower bound of settlement period" }
      - { name: period_end_at, type: datetime, source: input, description: "Exclusive upper bound; (period_end_at - period_start_at) must align with License.settlement_period" }
      - { name: gross_revenue_cents, type: integer, source: input, description: "Reported revenue for this period in cents; non-negative" }
      - { name: variant, type: enum, source: input, description: "PROVISIONAL | FINAL — selects calculation variant" }
      - { name: earned_royalty_cents, type: integer, source: computed, description: "max(gross_revenue_cents * revenue_share_bps / 10000, minimum_guarantee_cents); rounded half-up to nearest cent" }
      - { name: advance_recouped_cents, type: integer, source: computed, description: "min(earned_royalty_cents, License.advance_cents - License.cumulative_advance_recouped_cents)" }
      - { name: net_payable_cents, type: integer, source: computed, description: "earned_royalty_cents - advance_recouped_cents (>= 0)" }
      - { name: status, type: enum, source: system, description: "DRAFT | SETTLED | REVERSED" }
      - { name: settled_at, type: datetime, source: system, description: "Timestamp of SETTLED transition" }
      - { name: reversal_of_id, type: string, source: input, description: "If this row is a reversal entry, points to the SETTLED statement being reversed; null otherwise" }
      - { name: refund_cents, type: integer, source: input, description: "Refund amount that triggered reversal; non-null only when reversal_of_id is set" }

  - name: InfringementCase
    parent: null
    common_fields: true
    fields:
      - { name: work_id, type: string, source: input, description: "FK to Work.id; Work must be REGISTERED" }
      - { name: reporter_id, type: string, source: input, description: "FK to RightsHolder.id; must be primary_owner or a co_owner of the work" }
      - { name: alleged_infringer_id, type: string, source: input, description: "FK to RightsHolder.id" }
      - { name: evidence_doc_ids, type: array, source: input, description: "Non-empty array of opaque evidence document ids" }
      - { name: response_text, type: string, source: input, description: "Alleged infringer's response (set on RESPONSE_RECEIVED transition)" }
      - { name: review_stage, type: enum, source: system, description: "REPORTED | OWNERSHIP_VERIFIED | RESPONSE_RECEIVED | UNDER_ARBITRATION | RESOLVED | DISMISSED" }
      - { name: takedown_issued_at, type: datetime, source: system, description: "Timestamp set on transition that issues takedown notice; null otherwise" }
      - { name: compensation_cents, type: integer, source: input, description: "Compensation enforced at RESOLVED; non-negative; null until RESOLVED" }
      - { name: pinned_certificate_id, type: string, source: system, description: "Work.certificate_id captured at OWNERSHIP_VERIFIED transition" }

  - name: RightsChainEvent
    parent: Work
    common_fields: false
    fields:
      - { name: work_id, type: string, source: system, description: "FK to Work.id" }
      - { name: event_type, type: enum, source: system, description: "REGISTERED | LICENSE_SIGNED | LICENSE_TERMINATED | INFRINGEMENT_RESOLVED | OWNERSHIP_TRANSFERRED" }
      - { name: actor_id, type: string, source: system, description: "RightsHolder.id of actor (or 'system' for auto-events)" }
      - { name: ref_entity, type: string, source: system, description: "Type of referenced entity: License | Contract | InfringementCase | Work" }
      - { name: ref_id, type: string, source: system, description: "Id of referenced entity" }
      - { name: payload, type: object, source: system, description: "Snapshot of relevant fields at the time of event" }

  - name: ExternalEvent
    parent: null
    common_fields: false
    fields:
      - { name: source, type: enum, source: input, description: "PAYMENT | E_SIGN | COPYRIGHT_AUTHORITY | DISTRIBUTION_PLATFORM" }
      - { name: event_type, type: enum, source: input, description: "PAYMENT_RECEIVED | PAYMENT_REFUNDED | SIGNATURE_VERIFIED | SIGNATURE_REJECTED | REGISTRATION_APPROVED | REGISTRATION_REJECTED | TAKEDOWN_ACKED | DISTRIBUTION_REVENUE_REPORTED" }
      - { name: ref_entity, type: string, source: input, description: "Target entity type to mutate (Work | License | Contract | RoyaltyStatement | InfringementCase)" }
      - { name: ref_id, type: string, source: input, description: "Target entity id" }
      - { name: payload, type: object, source: input, description: "Source-specific payload (e.g., {amount_cents, currency} for PAYMENT_RECEIVED)" }
      - { name: external_event_id, type: string, source: input, description: "Idempotency key from the external system; uniqueness enforced per (source, external_event_id)" }
      - { name: applied, type: boolean, source: system, description: "True once the event has been processed and side effects have run; idempotent replays return the original outcome" }
      - { name: applied_at, type: datetime, source: system, description: "Application timestamp; null until applied" }

  - name: AuditLog
    parent: null
    common_fields: false
    fields:
      - { name: actor_id, type: string, source: system, description: "RightsHolder.id or 'system'" }
      - { name: subject_entity, type: string, source: system, description: "Entity type touched (License | Contract | InfringementCase | RoyaltyStatement | Work)" }
      - { name: subject_id, type: string, source: system, description: "Entity id touched" }
      - { name: change_type, type: enum, source: system, description: "LICENSE_CHANGED | CONTRACT_AMENDED | DISPUTE_LOGGED | ROYALTY_REVERSED | RIGHTS_CONFLICT_DETECTED" }
      - { name: before, type: object, source: system, description: "Snapshot of relevant fields before the change" }
      - { name: after, type: object, source: system, description: "Snapshot of relevant fields after the change" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Work
    initial_state: DRAFT
    terminal_states: [REJECTED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /works/{workId}/submit"
        actor: RightsHolder
        preconditions:
          - "primary_share_bps + sum(co_owners.share_bps) == 10000 (ERR_OWNERSHIP_SHARES_INVALID)"
          - "ownership_proof_doc_id is non-empty (ERR_OWNERSHIP_PROOF_MISSING)"
        side_effects:
          - "Append RightsChainEvent{event_type: REGISTERED stub, payload: {snapshot}} deferred until REGISTERED"

      - from: UNDER_REVIEW
        to: REGISTERED
        trigger: "POST /_events/emit with source=COPYRIGHT_AUTHORITY, event_type=REGISTRATION_APPROVED, ref_id={workId}"
        actor: system
        preconditions:
          - "Work.registration_status == UNDER_REVIEW (ERR_INVALID_STATE)"
        side_effects:
          - "certificate_id := server-minted UUID"
          - "certificate_issued_at := now()"
          - "Append RightsChainEvent{event_type: REGISTERED, ref_entity: Work, ref_id: workId}"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /_events/emit with source=COPYRIGHT_AUTHORITY, event_type=REGISTRATION_REJECTED, ref_id={workId}"
        actor: system
        preconditions:
          - "Work.registration_status == UNDER_REVIEW (ERR_INVALID_STATE)"
        side_effects: []

      - from: DRAFT
        to: DRAFT
        trigger: "PATCH /works/{workId}"
        actor: RightsHolder
        preconditions:
          - "Caller X-User-ID == primary_owner_id (ERR_FORBIDDEN)"
        side_effects: ["AuditLog{change_type: LICENSE_CHANGED} appended for the patch diff"]

  - entity: License
    initial_state: OFFERED
    terminal_states: [TERMINATED, EXPIRED, WITHDRAWN]
    transitions:
      - from: OFFERED
        to: COUNTERED
        trigger: "POST /licenses/{licenseId}/rounds with action=COUNTER"
        actor: RightsHolder
        preconditions:
          - "Caller X-User-ID is licensor_id or licensee_id (ERR_FORBIDDEN)"
          - "Caller is the *opposite* party from the one who submitted the previous round (ERR_NOT_YOUR_TURN)"
        side_effects:
          - "current_round += 1"
          - "Persist NegotiationRound{round_number=current_round, action=COUNTER, clause_diff=request.clause_diff}"
          - "AuditLog{change_type: LICENSE_CHANGED}"

      - from: COUNTERED
        to: COUNTERED
        trigger: "POST /licenses/{licenseId}/rounds with action=COUNTER"
        actor: RightsHolder
        preconditions:
          - "Caller is opposite party from previous round submitter (ERR_NOT_YOUR_TURN)"
        side_effects:
          - "current_round += 1"
          - "Persist NegotiationRound; AuditLog{change_type: LICENSE_CHANGED}"

      - from: COUNTERED
        to: ACCEPTED
        trigger: "POST /licenses/{licenseId}/rounds with action=ACCEPT"
        actor: RightsHolder
        preconditions:
          - "Caller is opposite party from previous round submitter (ERR_NOT_YOUR_TURN)"
          - "Work.registration_status == REGISTERED (ERR_WORK_NOT_REGISTERED)"
          - "calc:rights_conflict_check returns no conflicts for {territory, term_start, term_end, media_types, exclusivity} (ERR_EXCLUSIVE_LICENSE_VIOLATION or ERR_TERRITORY_TERM_OVERLAP)"
        side_effects:
          - "pinned_work_version := Work.version snapshot"
          - "Persist NegotiationRound{action: ACCEPT}"
          - "AuditLog{change_type: LICENSE_CHANGED}"

      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /licenses/{licenseId}/rounds with action=ACCEPT"
        actor: RightsHolder
        preconditions:
          - "Caller is the licensee_id (ERR_NOT_YOUR_TURN)"
          - "calc:rights_conflict_check returns no conflicts (ERR_EXCLUSIVE_LICENSE_VIOLATION or ERR_TERRITORY_TERM_OVERLAP)"
        side_effects: ["pinned_work_version := Work.version", "AuditLog"]

      - from: ACCEPTED
        to: SIGNED
        trigger: "Auto-transition when associated Contract.status becomes FULLY_SIGNED"
        actor: system
        preconditions:
          - "License.contract_id is set and Contract.status == FULLY_SIGNED"
          - "Work.version == pinned_work_version (ERR_PINNED_VERSION_STALE)"
        side_effects:
          - "AuditLog{change_type: CONTRACT_AMENDED}"
          - "Append RightsChainEvent{event_type: LICENSE_SIGNED, ref_entity: License, ref_id: licenseId}"

      - from: SIGNED
        to: EFFECTIVE
        trigger: "POST /_clock/advance until now() >= effective_date_target"
        actor: system
        preconditions:
          - "Contract.status == FULLY_SIGNED"
          - "now() >= effective_date_target"
          - "now() >= License.term_start"
        side_effects:
          - "effective_date := max(effective_date_target, term_start)"
          - "Contract.status := EFFECTIVE"

      - from: EFFECTIVE
        to: EXPIRED
        trigger: "POST /_clock/advance until now() >= term_end"
        actor: system
        preconditions: ["now() >= term_end"]
        side_effects:
          - "Append RightsChainEvent{event_type: LICENSE_TERMINATED, payload: {reason: EXPIRED}}"

      - from: EFFECTIVE
        to: TERMINATED
        trigger: "POST /licenses/{licenseId}/terminate"
        actor: RightsHolder
        preconditions:
          - "Caller is licensor_id (ERR_FORBIDDEN)"
          - "All RoyaltyStatements for this license are in {SETTLED, REVERSED} or DRAFT (no PENDING_PAYMENT) (ERR_HAS_PENDING_SETTLEMENTS)"
        side_effects:
          - "AuditLog{change_type: LICENSE_CHANGED}"
          - "Append RightsChainEvent{event_type: LICENSE_TERMINATED, payload: {reason: MANUAL}}"

      - from: OFFERED
        to: WITHDRAWN
        trigger: "POST /licenses/{licenseId}/rounds with action=WITHDRAW"
        actor: RightsHolder
        preconditions: ["Caller is licensor_id (ERR_FORBIDDEN)"]
        side_effects: ["AuditLog"]

      - from: COUNTERED
        to: WITHDRAWN
        trigger: "POST /licenses/{licenseId}/rounds with action=WITHDRAW"
        actor: RightsHolder
        preconditions: ["Caller is licensor_id (ERR_FORBIDDEN)"]
        side_effects: ["AuditLog"]

  - entity: Contract
    initial_state: PENDING_SIGNATURES
    terminal_states: [TERMINATED, SUPERSEDED]
    transitions:
      - from: PENDING_SIGNATURES
        to: PENDING_SIGNATURES
        trigger: "POST /contracts/{contractId}/signatures"
        actor: RightsHolder
        preconditions:
          - "License.status == ACCEPTED (ERR_LICENSE_NOT_ACCEPTED)"
          - "signer_id == signing_order[signed_count] (ERR_SIGNATURE_OUT_OF_ORDER)"
          - "No prior Signature with same signer_id on this contract (ERR_DUPLICATE_SIGNATURE)"
        side_effects:
          - "Persist Signature; signed_count += 1"

      - from: PENDING_SIGNATURES
        to: FULLY_SIGNED
        trigger: "Auto-transition when signed_count == len(signing_order)"
        actor: system
        preconditions: []
        side_effects:
          - "fully_signed_at := now()"
          - "License.status := SIGNED (auto-transition on License)"
          - "AuditLog{change_type: CONTRACT_AMENDED}"

      - from: FULLY_SIGNED
        to: EFFECTIVE
        trigger: "Auto-transition coupled with License OFFERED→SIGNED→EFFECTIVE clock advance"
        actor: system
        preconditions: ["now() >= effective_date_target", "now() >= License.term_start"]
        side_effects: ["License.effective_date set"]

      - from: EFFECTIVE
        to: TERMINATED
        trigger: "License.status := TERMINATED via POST /licenses/{licenseId}/terminate"
        actor: system
        preconditions: ["License.status == TERMINATED"]
        side_effects: ["AuditLog{change_type: CONTRACT_AMENDED}"]

      - from: EFFECTIVE
        to: SUPERSEDED
        trigger: "POST /contracts (with parent_contract_id == this.id) and that supplementary contract reaches FULLY_SIGNED"
        actor: system
        preconditions: ["Supplementary Contract.status == FULLY_SIGNED"]
        side_effects: ["AuditLog{change_type: CONTRACT_AMENDED, before: status=EFFECTIVE, after: status=SUPERSEDED}"]

  - entity: RoyaltyStatement
    initial_state: DRAFT
    terminal_states: [REVERSED]
    transitions:
      - from: DRAFT
        to: SETTLED
        trigger: "POST /_events/emit with source=PAYMENT, event_type=PAYMENT_RECEIVED, ref_id={statementId}"
        actor: system
        preconditions:
          - "External payload.amount_cents == net_payable_cents (ERR_PAYMENT_AMOUNT_MISMATCH)"
          - "License.status == EFFECTIVE (ERR_LICENSE_NOT_EFFECTIVE)"
        side_effects:
          - "settled_at := now()"
          - "License.cumulative_advance_recouped_cents += this.advance_recouped_cents"

      - from: SETTLED
        to: REVERSED
        trigger: "POST /royalty-statements (variant=REVERSAL with reversal_of_id) AND POST /_events/emit source=PAYMENT, event_type=PAYMENT_REFUNDED, ref_id={reversalStatementId}"
        actor: system
        preconditions:
          - "Original statement is SETTLED (ERR_INVALID_STATE)"
          - "External payload.amount_cents == refund_cents of reversal entry (ERR_PAYMENT_AMOUNT_MISMATCH)"
        side_effects:
          - "Original statement.status := REVERSED"
          - "License.cumulative_advance_recouped_cents -= original.advance_recouped_cents (compensating action — see calc:advance_recoupment_invariant)"

  - entity: InfringementCase
    initial_state: REPORTED
    terminal_states: [RESOLVED, DISMISSED]
    transitions:
      - from: REPORTED
        to: OWNERSHIP_VERIFIED
        trigger: "POST /infringement-cases/{caseId}/verify-ownership"
        actor: system
        preconditions:
          - "Work.registration_status == REGISTERED (ERR_WORK_NOT_REGISTERED)"
          - "evidence_doc_ids is non-empty (ERR_EVIDENCE_MISSING)"
        side_effects:
          - "pinned_certificate_id := Work.certificate_id"
          - "AuditLog{change_type: DISPUTE_LOGGED}"

      - from: REPORTED
        to: DISMISSED
        trigger: "POST /infringement-cases/{caseId}/dismiss"
        actor: RightsHolder
        preconditions: ["Caller is reporter_id (ERR_FORBIDDEN)"]
        side_effects: ["AuditLog{change_type: DISPUTE_LOGGED}"]

      - from: OWNERSHIP_VERIFIED
        to: RESPONSE_RECEIVED
        trigger: "POST /infringement-cases/{caseId}/respond"
        actor: RightsHolder
        preconditions:
          - "Caller is alleged_infringer_id (ERR_FORBIDDEN)"
          - "Pinned certificate still matches Work.certificate_id (ERR_PINNED_CERTIFICATE_STALE)"
        side_effects: ["response_text := request.response_text", "AuditLog{change_type: DISPUTE_LOGGED}"]

      - from: RESPONSE_RECEIVED
        to: UNDER_ARBITRATION
        trigger: "POST /infringement-cases/{caseId}/escalate"
        actor: RightsHolder
        preconditions: ["Caller is reporter_id (ERR_FORBIDDEN)"]
        side_effects:
          - "takedown_issued_at := now()"
          - "Append RightsChainEvent{event_type: LICENSE_TERMINATED, ref_entity: InfringementCase} for any EFFECTIVE License where licensee_id == alleged_infringer_id AND work_id == this.work_id; that License.status := TERMINATED"
          - "AuditLog{change_type: DISPUTE_LOGGED}"

      - from: UNDER_ARBITRATION
        to: RESOLVED
        trigger: "POST /infringement-cases/{caseId}/resolve"
        actor: RightsHolder
        preconditions:
          - "Caller is reporter_id (ERR_FORBIDDEN)"
          - "compensation_cents in request, non-negative (ERR_COMPENSATION_INVALID)"
        side_effects:
          - "Append RightsChainEvent{event_type: INFRINGEMENT_RESOLVED, payload: {compensation_cents}}"
          - "AuditLog{change_type: DISPUTE_LOGGED}"

      - from: UNDER_ARBITRATION
        to: DISMISSED
        trigger: "POST /infringement-cases/{caseId}/dismiss"
        actor: RightsHolder
        preconditions: ["Caller is reporter_id (ERR_FORBIDDEN)"]
        side_effects: ["AuditLog{change_type: DISPUTE_LOGGED}"]

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two parties simultaneously submit a NegotiationRound on the same License"
    guarantee: "Exactly one round is persisted; the other party's submission is rejected because it is no longer their turn at the new current_round"
    error_id: ERR_NOT_YOUR_TURN
    http_status: 409
    serialization: "First-writer-wins on License.current_round increment"

  - scenario: "Two signers concurrently submit signatures for the same Contract"
    guarantee: "Signatures are serialized; only the signer matching signing_order[signed_count] at moment of write succeeds"
    error_id: ERR_SIGNATURE_OUT_OF_ORDER
    http_status: 409
    serialization: "First-writer-wins on Contract.signed_count increment"

  - scenario: "Two payment events with the same external_event_id arrive for the same RoyaltyStatement"
    guarantee: "First event applies side effects; replay returns the original outcome and does not double-credit"
    error_id: ERR_DUPLICATE_EXTERNAL_EVENT
    http_status: 409
    serialization: "Uniqueness on (source, external_event_id); replay is idempotent only when payload byte-equals the original"

  - scenario: "Two clients call POST /licenses/{id}/rounds with action=ACCEPT while a third concurrently creates a conflicting EFFECTIVE License"
    guarantee: "At most one license becomes ACCEPTED for the conflicting territory/term/media slice; the second loses on the rights-conflict re-check"
    error_id: ERR_EXCLUSIVE_LICENSE_VIOLATION
    http_status: 409
    serialization: "Re-evaluate calc:rights_conflict_check inside the same transaction that flips status to ACCEPTED"

  - scenario: "Terminate license while a PAYMENT_RECEIVED event for one of its DRAFT statements is being processed"
    guarantee: "Either termination wins (statement stays DRAFT, payment event is rejected with ERR_LICENSE_NOT_EFFECTIVE) or settlement wins (license stays EFFECTIVE because of pending settlement)"
    error_id: ERR_HAS_PENDING_SETTLEMENTS
    http_status: 409
    serialization: "First-writer-wins on License.status"

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: rights_conflict_check
    trigger: "License OFFERED→ACCEPTED, COUNTERED→ACCEPTED, and on every status check during rounds"
    algorithm: interval_merge
    formula: |
      conflict(other_license, candidate):
        if other_license.work_id != candidate.work_id: return false
        if other_license.status not in {ACCEPTED, SIGNED, EFFECTIVE}: return false
        territory_overlap = (set(other_license.territory) ∩ set(candidate.territory)) != ∅
                            OR ('WORLD' in {other_license.territory ∪ candidate.territory})
        media_overlap     = (set(other_license.media_types) ∩ set(candidate.media_types)) != ∅
        # Half-open interval: [term_start, term_end). Adjacency does not overlap.
        term_overlap      = (other_license.term_start < candidate.term_end)
                            AND (candidate.term_start < other_license.term_end)
        return territory_overlap AND media_overlap AND term_overlap

      For candidate license L on Work W:
        any_exclusive_blocker = exists L' such that conflict(L', L) AND L'.exclusivity == EXCLUSIVE
        candidate_exclusive_violation = (L.exclusivity == EXCLUSIVE) AND exists L' such that conflict(L', L)

        if any_exclusive_blocker OR candidate_exclusive_violation:
          raise ERR_EXCLUSIVE_LICENSE_VIOLATION
        if exists L' such that conflict(L', L) AND L'.exclusivity == NON_EXCLUSIVE AND L.exclusivity == NON_EXCLUSIVE:
          # Non-exclusive overlaps are allowed but emit RIGHTS_CONFLICT_DETECTED audit log
          AuditLog.append({change_type: RIGHTS_CONFLICT_DETECTED, before: null, after: candidate})
          return ok
        # Otherwise: territory/term overlap with no exclusivity issue but media disjoint somehow
        return ok
    input_set: "All License rows for the same work_id with status in {ACCEPTED, SIGNED, EFFECTIVE}; SIGNED before effective_date is included"
    constants:
      INTERVAL_SEMANTICS: "half_open_lower_inclusive_upper_exclusive"
    precision: "Dates compared at second granularity, UTC"
    variants: []

  - name: royalty_payable
    trigger: "POST /licenses/{licenseId}/royalty-statements (creation) and on PROVISIONAL→FINAL toggle"
    algorithm: tiered_pricing
    formula: |
      gross = statement.gross_revenue_cents
      revenue_share = floor(gross * License.revenue_share_bps / 10000)   # round half-up to nearest cent
      earned        = max(revenue_share, License.minimum_guarantee_cents)

      remaining_advance = max(0, License.advance_cents - License.cumulative_advance_recouped_cents)
      advance_recouped  = min(earned, remaining_advance)

      net_payable = earned - advance_recouped
      # Rounding order is FIXED: compute revenue_share first (round half-up), then max with MG, then subtract recoupment.
    input_set: "Single License + single RoyaltyStatement; cumulative_advance_recouped_cents read at statement creation time"
    constants:
      ROUNDING_MODE: "round_half_up_to_nearest_cent"
      ROUNDING_ORDER: "share_first_then_max_then_subtract"
    precision: "Integer cents"
    variants:
      - name: PROVISIONAL
        when: "statement.variant == PROVISIONAL"
        difference: "Earned royalty estimate uses revenue_share only (ignores minimum_guarantee). net_payable_provisional = max(0, revenue_share - remaining_advance). Used for mid-period reporting; never settles."
      - name: FINAL
        when: "statement.variant == FINAL"
        difference: "Applies the full formula above (max with MG); only FINAL statements may transition to SETTLED."

  - name: ownership_share_validation
    trigger: "POST /works and PATCH /works/{workId}"
    algorithm: aggregation
    formula: |
      total_bps = primary_share_bps + sum(co_owners[i].share_bps for i in 0..len(co_owners))
      if total_bps != 10000: ERR_OWNERSHIP_SHARES_INVALID
      if any share_bps <= 0 or share_bps > 10000: ERR_OWNERSHIP_SHARES_INVALID
      # Tie-break: when two co_owners array entries reference the same rights_holder_id,
      # collapse to single entry summing share_bps; if the request did not pre-collapse,
      # reject with ERR_DUPLICATE_CO_OWNER.
    input_set: "Work.primary_share_bps + every entry in Work.co_owners[]"
    constants:
      TOTAL_BPS: 10000
    precision: "Integer basis points"
    variants: []

  - name: signing_progress
    trigger: "POST /contracts/{contractId}/signatures"
    algorithm: chronological
    formula: |
      For incoming signature S on Contract C:
        expected_signer = C.signing_order[C.signed_count]   # 0-indexed
        if S.signer_id != expected_signer: ERR_SIGNATURE_OUT_OF_ORDER
        if exists Signature(contract_id=C.id, signer_id=S.signer_id): ERR_DUPLICATE_SIGNATURE
        persist Signature; C.signed_count += 1
        if C.signed_count == len(C.signing_order):
          C.status := FULLY_SIGNED
          C.fully_signed_at := now()
          License.status := SIGNED  (cascade)
    input_set: "Contract.signing_order, Contract.signed_count, existing Signature rows"
    constants: {}
    precision: "Integer ordering"
    variants: []

  - name: contract_effective_date
    trigger: "Auto-evaluation on POST /_clock/advance and immediately after Contract→FULLY_SIGNED"
    algorithm: threshold
    formula: |
      candidate = max(Contract.effective_date_target, License.term_start)
      if Contract.status == FULLY_SIGNED AND now() >= candidate:
        License.effective_date := candidate
        License.status := EFFECTIVE
        Contract.status := EFFECTIVE
      # Boundary: now() >= candidate (>=, not >). At exact equality the transition fires.
    input_set: "Contract.fully_signed_at, Contract.effective_date_target, License.term_start, current clock"
    constants:
      BOUNDARY: "inclusive_lower (>=)"
    precision: "Second granularity"
    variants: []

  - name: advance_recoupment_invariant
    trigger: "On every SETTLED and REVERSED RoyaltyStatement transition"
    algorithm: aggregation
    formula: |
      Invariant per License:
        License.cumulative_advance_recouped_cents == sum(
          stmt.advance_recouped_cents
          for stmt in RoyaltyStatement where stmt.license_id == this.id AND stmt.status == SETTLED
        ) - sum(
          original.advance_recouped_cents
          for reversal in RoyaltyStatement where reversal.license_id == this.id
              AND reversal.status == SETTLED  # the reversal itself is a SETTLED ledger entry
              AND reversal.reversal_of_id IS NOT NULL
          where original = reversal_of (must itself be REVERSED)
        )
      Compensation: when a SETTLED statement S transitions to REVERSED via paired reversal R,
        License.cumulative_advance_recouped_cents -= S.advance_recouped_cents
        which is exactly opposite of the +=S.advance_recouped_cents at S's settlement.
    input_set: "All SETTLED and REVERSED RoyaltyStatements for the License"
    constants: {}
    precision: "Integer cents"
    variants: []

  - name: takedown_termination_cascade
    trigger: "InfringementCase RESPONSE_RECEIVED→UNDER_ARBITRATION (takedown issuance)"
    algorithm: topological
    formula: |
      For each EFFECTIVE License L where L.work_id == case.work_id AND L.licensee_id == case.alleged_infringer_id:
        L.status := TERMINATED
        Append RightsChainEvent{event_type: LICENSE_TERMINATED, payload: {reason: TAKEDOWN, case_id}}
        For each Contract C where C.license_id == L.id AND C.status == EFFECTIVE:
          C.status := TERMINATED
          AuditLog{change_type: CONTRACT_AMENDED}
          For each DRAFT RoyaltyStatement RS where RS.license_id == L.id:
            RS stays DRAFT (NOT cascaded into REVERSED — only SETTLED can revert);
            future PAYMENT_RECEIVED events for RS now fail ERR_LICENSE_NOT_EFFECTIVE.
      Cascade depth: InfringementCase → License → Contract → (gating future RoyaltyStatement payments).
      Order: License first, then Contract; AuditLog rows are appended at each hop.
    input_set: "InfringementCase + all related Licenses, Contracts, RoyaltyStatements"
    constants: {}
    precision: "n/a"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except GET /works/{workId}/rights-chain (public)"

  - priority: 2
    category: auth
    check: "X-User-Role permitted for the endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all mutating endpoints"

  - priority: 3
    category: existence
    check: "Path-parameter ids resolve to live entities, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 4
    category: state
    check: "version field in body matches stored version (OCC)"
    error_id: ERR_VERSION_MISMATCH
    http_status: 409
    applies_to: "PATCH and state-transition endpoints"

  - priority: 5
    category: state
    check: "Resource is in a state that permits the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 6
    category: business_referential
    check: "Cross-entity FK references resolve and refer to valid roles (e.g., licensor must own work)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "POST /licenses, POST /infringement-cases"

  - priority: 7
    category: business_safety
    check: "calc:rights_conflict_check raises no exclusive-license violation on License acceptance"
    error_id: ERR_EXCLUSIVE_LICENSE_VIOLATION
    http_status: 409
    applies_to: "POST /licenses/{licenseId}/rounds with action=ACCEPT"

  - priority: 8
    category: business_temporal
    check: "Territory or term overlap with non-exclusive license still emits warning audit row but does not block acceptance"
    error_id: ERR_TERRITORY_TERM_OVERLAP
    http_status: 409
    applies_to: "POST /licenses/{licenseId}/rounds with action=ACCEPT (only when both candidate and incumbent are EXCLUSIVE-side, otherwise non-blocking)"

  - priority: 9
    category: business_constraint
    check: "Negotiation turn alternation: caller is the *opposite* party from previous round submitter"
    error_id: ERR_NOT_YOUR_TURN
    http_status: 409
    applies_to: "POST /licenses/{licenseId}/rounds"

  - priority: 10
    category: business_constraint
    check: "Signing order: signer_id == signing_order[signed_count]"
    error_id: ERR_SIGNATURE_OUT_OF_ORDER
    http_status: 409
    applies_to: "POST /contracts/{contractId}/signatures"

  - priority: 11
    category: business_constraint
    check: "No duplicate signature: the signer has not already signed this contract"
    error_id: ERR_DUPLICATE_SIGNATURE
    http_status: 409
    applies_to: "POST /contracts/{contractId}/signatures"

  - priority: 12
    category: business_referential
    check: "Co-owner uniqueness: no rights_holder_id appears more than once in Work.co_owners"
    error_id: ERR_DUPLICATE_CO_OWNER
    http_status: 409
    applies_to: "POST /works, PATCH /works/{workId}"

  - priority: 13
    category: business_fiscal
    check: "Ownership shares: primary_share_bps + sum(co_owners.share_bps) == 10000"
    error_id: ERR_OWNERSHIP_SHARES_INVALID
    http_status: 422
    applies_to: "POST /works, PATCH /works/{workId}"

  - priority: 14
    category: business_fiscal
    check: "PAYMENT_RECEIVED amount equals statement.net_payable_cents (or refund_cents for reversal)"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 409
    applies_to: "POST /_events/emit (PAYMENT_RECEIVED, PAYMENT_REFUNDED)"

  - priority: 15
    category: business_temporal
    check: "Contract.effective_date_target >= License.term_start AND < License.term_end"
    error_id: ERR_EFFECTIVE_DATE_OUT_OF_TERM
    http_status: 422
    applies_to: "POST /contracts"

  - priority: 16
    category: business_constraint
    check: "RoyaltyStatement period boundaries: period_start_at < period_end_at AND duration matches License.settlement_period"
    error_id: ERR_INVALID_PERIOD
    http_status: 422
    applies_to: "POST /licenses/{licenseId}/royalty-statements"

  - priority: 17
    category: business_referential
    check: "Reversal entry: reversal_of_id resolves to a SETTLED RoyaltyStatement on the same license"
    error_id: ERR_INVALID_REVERSAL
    http_status: 409
    applies_to: "POST /licenses/{licenseId}/royalty-statements with reversal_of_id"

  - priority: 18
    category: business_constraint
    check: "Pinned-version freshness: at License ACCEPTED→SIGNED, Work.version still equals pinned_work_version"
    error_id: ERR_PINNED_VERSION_STALE
    http_status: 409
    applies_to: "Auto-transition License.SIGNED"

  - priority: 19
    category: business_constraint
    check: "Pinned-certificate freshness: at InfringementCase OWNERSHIP_VERIFIED→RESPONSE_RECEIVED, Work.certificate_id still equals pinned_certificate_id"
    error_id: ERR_PINNED_CERTIFICATE_STALE
    http_status: 409
    applies_to: "POST /infringement-cases/{caseId}/respond"

  - priority: 20
    category: business_referential
    check: "External event idempotency: (source, external_event_id) is unique"
    error_id: ERR_DUPLICATE_EXTERNAL_EVENT
    http_status: 409
    applies_to: "POST /_events/emit"

  - priority: 21
    category: business_safety
    check: "Evidence non-empty: InfringementCase.evidence_doc_ids has at least one element"
    error_id: ERR_EVIDENCE_MISSING
    http_status: 422
    applies_to: "POST /infringement-cases, POST /infringement-cases/{caseId}/verify-ownership"

  - priority: 22
    category: business_fiscal
    check: "Compensation non-negative on RESOLVED transition"
    error_id: ERR_COMPENSATION_INVALID
    http_status: 422
    applies_to: "POST /infringement-cases/{caseId}/resolve"

  - priority: 23
    category: business_temporal
    check: "License.term_start < License.term_end and term_start in the future relative to creation"
    error_id: ERR_INVALID_TERM
    http_status: 422
    applies_to: "POST /licenses, PATCH /licenses/{licenseId}"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- RightsHolder ---
  - method: POST
    path: "/rights-holders"
    description: "Create a rights holder"
    roles: [PlatformAdmin, RightsHolder]
    code: 201
    input: [legal_name, holder_type, contact_email, jurisdiction]
    output: RightsHolder
    side_effects: []

  - method: GET
    path: "/rights-holders/{holderId}"
    description: "Get a rights holder"
    roles: [PlatformAdmin, RightsHolder]
    code: 200
    input: []
    output: RightsHolder
    side_effects: []

  # --- Work ---
  - method: POST
    path: "/works"
    description: "Create a Work in DRAFT"
    roles: [RightsHolder]
    code: 201
    input: [title, work_type, creation_date, primary_owner_id, co_owners, primary_share_bps, ownership_proof_doc_id]
    output: Work
    side_effects: ["Work.registration_status := DRAFT"]

  - method: GET
    path: "/works/{workId}"
    description: "Get Work"
    roles: [PlatformAdmin, RightsHolder]
    code: 200
    input: []
    output: Work
    side_effects: []

  - method: PATCH
    path: "/works/{workId}"
    description: "Patch Work fields (DRAFT only)"
    roles: [RightsHolder]
    code: 200
    input: ["title?", "co_owners?", "primary_share_bps?", "ownership_proof_doc_id?", "version"]
    output: Work
    side_effects: ["AuditLog{change_type: LICENSE_CHANGED}"]

  - method: POST
    path: "/works/{workId}/submit"
    description: "Submit Work for registration (DRAFT → UNDER_REVIEW)"
    roles: [RightsHolder]
    code: 200
    input: ["version"]
    output: Work
    side_effects: ["registration_status := UNDER_REVIEW"]

  - method: GET
    path: "/works/{workId}/rights-chain"
    description: "Get rights-chain history for a Work"
    roles: [PlatformAdmin, RightsHolder]
    code: 200
    input: ["limit?", "offset?"]
    output: "RightsChainEvent[]"
    side_effects: []

  # --- License ---
  - method: POST
    path: "/licenses"
    description: "Create a License in OFFERED"
    roles: [RightsHolder]
    code: 201
    input: [work_id, licensor_id, licensee_id, territory, term_start, term_end, media_types, exclusivity, sublicense_allowed, revision_rights, fixed_fee_cents, revenue_share_bps, minimum_guarantee_cents, advance_cents, settlement_period]
    output: License
    side_effects: ["status := OFFERED, current_round := 1, persist NegotiationRound{action: OFFER, round_number: 1, proposed_by_id: licensor_id}"]

  - method: GET
    path: "/licenses/{licenseId}"
    description: "Get License"
    roles: [PlatformAdmin, RightsHolder]
    code: 200
    input: []
    output: License
    side_effects: []

  - method: GET
    path: "/licenses/{licenseId}/rounds"
    description: "List negotiation rounds in chronological order"
    roles: [PlatformAdmin, RightsHolder]
    code: 200
    input: ["limit?", "offset?"]
    output: "NegotiationRound[]"
    side_effects: []

  - method: POST
    path: "/licenses/{licenseId}/rounds"
    description: "Submit a counter, accept, or withdraw"
    roles: [RightsHolder]
    code: 201
    input: [action, "clause_diff?", "version"]
    output: NegotiationRound
    side_effects: ["License.status transition per state machine; current_round increments on COUNTER; pinned_work_version snapshot on ACCEPT"]

  - method: POST
    path: "/licenses/{licenseId}/terminate"
    description: "Manually terminate an EFFECTIVE License"
    roles: [RightsHolder]
    code: 200
    input: ["version"]
    output: License
    side_effects: ["License.status := TERMINATED; cascade Contract.status := TERMINATED; RightsChainEvent appended"]

  # --- Contract ---
  - method: POST
    path: "/contracts"
    description: "Create a primary or supplementary Contract from an ACCEPTED License"
    roles: [RightsHolder]
    code: 201
    input: [license_id, signing_order, effective_date_target, "parent_contract_id?"]
    output: Contract
    side_effects: ["status := PENDING_SIGNATURES, signed_count := 0"]

  - method: GET
    path: "/contracts/{contractId}"
    description: "Get Contract"
    roles: [PlatformAdmin, RightsHolder]
    code: 200
    input: []
    output: Contract
    side_effects: []

  - method: POST
    path: "/contracts/{contractId}/signatures"
    description: "Submit a signature for the next required signer"
    roles: [RightsHolder]
    code: 201
    input: [signer_id, signature_payload, "version"]
    output: Signature
    side_effects: ["signed_count += 1; on completion FULLY_SIGNED + License.status := SIGNED cascade"]

  # --- RoyaltyStatement ---
  - method: POST
    path: "/licenses/{licenseId}/royalty-statements"
    description: "Create a RoyaltyStatement (provisional, final, or reversal entry)"
    roles: [RightsHolder]
    code: 201
    input: [period_start_at, period_end_at, gross_revenue_cents, variant, "reversal_of_id?", "refund_cents?"]
    output: RoyaltyStatement
    side_effects: ["compute earned_royalty_cents, advance_recouped_cents, net_payable_cents per calc:royalty_payable"]

  - method: GET
    path: "/licenses/{licenseId}/royalty-statements/{statementId}"
    description: "Get RoyaltyStatement"
    roles: [PlatformAdmin, RightsHolder]
    code: 200
    input: []
    output: RoyaltyStatement
    side_effects: []

  - method: GET
    path: "/licenses/{licenseId}/royalty-statements"
    description: "List RoyaltyStatements for a License"
    roles: [PlatformAdmin, RightsHolder]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "RoyaltyStatement[]"
    side_effects: []

  # --- InfringementCase ---
  - method: POST
    path: "/infringement-cases"
    description: "Report an infringement case"
    roles: [RightsHolder]
    code: 201
    input: [work_id, alleged_infringer_id, evidence_doc_ids]
    output: InfringementCase
    side_effects: ["review_stage := REPORTED; AuditLog{DISPUTE_LOGGED}"]

  - method: GET
    path: "/infringement-cases/{caseId}"
    description: "Get InfringementCase"
    roles: [PlatformAdmin, RightsHolder]
    code: 200
    input: []
    output: InfringementCase
    side_effects: []

  - method: POST
    path: "/infringement-cases/{caseId}/verify-ownership"
    description: "REPORTED → OWNERSHIP_VERIFIED"
    roles: [PlatformAdmin]
    code: 200
    input: ["version"]
    output: InfringementCase
    side_effects: ["pinned_certificate_id snapshot; AuditLog"]

  - method: POST
    path: "/infringement-cases/{caseId}/respond"
    description: "OWNERSHIP_VERIFIED → RESPONSE_RECEIVED"
    roles: [RightsHolder]
    code: 200
    input: [response_text, "version"]
    output: InfringementCase
    side_effects: ["response_text persisted; AuditLog"]

  - method: POST
    path: "/infringement-cases/{caseId}/escalate"
    description: "RESPONSE_RECEIVED → UNDER_ARBITRATION (issues takedown notice)"
    roles: [RightsHolder]
    code: 200
    input: ["version"]
    output: InfringementCase
    side_effects: ["takedown_issued_at := now(); calc:takedown_termination_cascade runs"]

  - method: POST
    path: "/infringement-cases/{caseId}/resolve"
    description: "UNDER_ARBITRATION → RESOLVED with compensation"
    roles: [RightsHolder]
    code: 200
    input: [compensation_cents, "version"]
    output: InfringementCase
    side_effects: ["RightsChainEvent{INFRINGEMENT_RESOLVED}; AuditLog"]

  - method: POST
    path: "/infringement-cases/{caseId}/dismiss"
    description: "REPORTED → DISMISSED or UNDER_ARBITRATION → DISMISSED"
    roles: [RightsHolder]
    code: 200
    input: ["version"]
    output: InfringementCase
    side_effects: ["AuditLog"]

  # --- AuditLog ---
  - method: GET
    path: "/audit-logs"
    description: "List audit logs with filters"
    roles: [PlatformAdmin]
    code: 200
    input: ["subject_entity?", "subject_id?", "change_type?", "limit?", "offset?"]
    output: "AuditLog[]"
    side_effects: []

  # --- External Event Synchronization (test-driving + production) ---
  - method: POST
    path: "/_events/emit"
    description: "Inject an external event from a downstream system (PAYMENT, E_SIGN, COPYRIGHT_AUTHORITY, DISTRIBUTION_PLATFORM)"
    roles: [PlatformAdmin]
    code: 200
    input: [source, event_type, ref_entity, ref_id, payload, external_event_id]
    output: ExternalEvent
    side_effects: ["Apply state transition or value mutation per (source, event_type) routing table; idempotent on (source, external_event_id)"]

  # --- Test-driving ---
  - method: POST
    path: "/_clock/advance"
    description: "Advance the system clock (test-only)"
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ now: datetime }"
    side_effects: ["Trigger any time-gated auto-transitions: SIGNED→EFFECTIVE when now() >= effective_date_target; EFFECTIVE→EXPIRED when now() >= term_end"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Required X-User-ID or X-User-Role headers missing"

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Caller lacks role permission or is not an authorized party for the resource"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path resource does not exist"

  - id: ERR_VERSION_MISMATCH
    http: 409
    condition: "OCC version field stale"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource is in a state that does not allow the requested transition"

  - id: ERR_OWNERSHIP_SHARES_INVALID
    http: 422
    condition: "Sum of ownership share basis points != 10000 or any share <= 0 / > 10000"

  - id: ERR_OWNERSHIP_PROOF_MISSING
    http: 422
    condition: "ownership_proof_doc_id is null or empty at submit"

  - id: ERR_DUPLICATE_CO_OWNER
    http: 409
    condition: "Same rights_holder_id appears more than once in Work.co_owners"

  - id: ERR_WORK_NOT_REGISTERED
    http: 409
    condition: "Operation requires Work.registration_status == REGISTERED"

  - id: ERR_NOT_YOUR_TURN
    http: 409
    condition: "Caller is the same party as the previous round submitter"

  - id: ERR_EXCLUSIVE_LICENSE_VIOLATION
    http: 409
    condition: "Acceptance would create or violate an exclusive license overlap"

  - id: ERR_TERRITORY_TERM_OVERLAP
    http: 409
    condition: "Hard overlap between two EXCLUSIVE candidates on territory∩media∩term"

  - id: ERR_LICENSE_NOT_ACCEPTED
    http: 409
    condition: "Contract creation requires License.status == ACCEPTED"

  - id: ERR_LICENSE_NOT_EFFECTIVE
    http: 409
    condition: "PAYMENT_RECEIVED requires License.status == EFFECTIVE"

  - id: ERR_SIGNATURE_OUT_OF_ORDER
    http: 409
    condition: "Submitted signer_id != signing_order[signed_count]"

  - id: ERR_DUPLICATE_SIGNATURE
    http: 409
    condition: "Same signer has already signed this contract"

  - id: ERR_EFFECTIVE_DATE_OUT_OF_TERM
    http: 422
    condition: "Contract.effective_date_target outside [License.term_start, License.term_end)"

  - id: ERR_INVALID_PERIOD
    http: 422
    condition: "RoyaltyStatement period invalid or misaligned with License.settlement_period"

  - id: ERR_INVALID_REVERSAL
    http: 409
    condition: "reversal_of_id does not refer to a SETTLED statement on the same license"

  - id: ERR_PAYMENT_AMOUNT_MISMATCH
    http: 409
    condition: "External payment amount != statement.net_payable_cents (or refund_cents)"

  - id: ERR_PINNED_VERSION_STALE
    http: 409
    condition: "Work.version drifted from pinned_work_version between ACCEPTED and SIGNED"

  - id: ERR_PINNED_CERTIFICATE_STALE
    http: 409
    condition: "Work.certificate_id drifted from pinned_certificate_id between OWNERSHIP_VERIFIED and RESPONSE_RECEIVED"

  - id: ERR_DUPLICATE_EXTERNAL_EVENT
    http: 409
    condition: "(source, external_event_id) seen previously with different payload"

  - id: ERR_EVIDENCE_MISSING
    http: 422
    condition: "InfringementCase.evidence_doc_ids is empty"

  - id: ERR_COMPENSATION_INVALID
    http: 422
    condition: "compensation_cents missing or negative on RESOLVED"

  - id: ERR_INVALID_TERM
    http: 422
    condition: "term_start >= term_end on License creation/patch"

  - id: ERR_HAS_PENDING_SETTLEMENTS
    http: 409
    condition: "License.terminate blocked by pending payment events for DRAFT statements"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: RightsHolder
    description: "Authenticated rights holder acting on behalf of a RightsHolder entity"
    identity: "entity_backed:RightsHolder"
    exclusive_operations:
      - "POST /works (caller becomes primary_owner_id when omitted)"
      - "PATCH /works/{workId} (caller must equal primary_owner_id)"
      - "POST /works/{workId}/submit"
      - "POST /licenses (caller must be primary_owner or co_owner of work_id)"
      - "POST /licenses/{licenseId}/rounds"
      - "POST /licenses/{licenseId}/terminate (caller must equal licensor_id)"
      - "POST /contracts (caller must be a participant in License)"
      - "POST /contracts/{contractId}/signatures (caller must equal signer_id and signer_id must equal signing_order[signed_count])"
      - "POST /licenses/{licenseId}/royalty-statements (caller must equal licensor_id)"
      - "POST /infringement-cases (caller becomes reporter_id and must own the work)"
      - "POST /infringement-cases/{caseId}/respond (caller must equal alleged_infringer_id)"
      - "POST /infringement-cases/{caseId}/escalate (caller must equal reporter_id)"
      - "POST /infringement-cases/{caseId}/resolve (caller must equal reporter_id)"
      - "POST /infringement-cases/{caseId}/dismiss (caller must equal reporter_id)"
    shared_operations:
      - "GET /works/{workId}"
      - "GET /works/{workId}/rights-chain"
      - "GET /licenses/{licenseId}"
      - "GET /licenses/{licenseId}/rounds"
      - "GET /contracts/{contractId}"
      - "GET /licenses/{licenseId}/royalty-statements{/{statementId}}"
      - "GET /infringement-cases/{caseId}"
      - "GET /rights-holders/{holderId}"
      - "POST /rights-holders"

  - name: PlatformAdmin
    description: "Operator role for the platform; emits external events, advances the clock, performs ownership re-verification, and reads audit logs"
    identity: "opaque"
    exclusive_operations:
      - "POST /infringement-cases/{caseId}/verify-ownership"
      - "POST /_events/emit"
      - "POST /_clock/advance"
      - "GET /audit-logs"
    shared_operations:
      - "GET /works/{workId}"
      - "GET /works/{workId}/rights-chain"
      - "GET /licenses/{licenseId}"
      - "GET /licenses/{licenseId}/rounds"
      - "GET /contracts/{contractId}"
      - "GET /licenses/{licenseId}/royalty-statements{/{statementId}}"
      - "GET /infringement-cases/{caseId}"
      - "GET /rights-holders/{holderId}"
      - "POST /rights-holders"
