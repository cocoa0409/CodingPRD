# =============================================================================
# PRD Benchmark Seed Tables — Crowdfunded Board Game Production, Backer Waves & Retail
# =============================================================================

scenario: |
  Crowdfunded Board Game Production, Backer Waves & Retail Release (Stonemaier Games): campaign structure with pledge levels, stretch goals and add-on components affecting final manufacturing specifications, manufacturing quotes and minimum order quantities determined after backer counts are known, freight planning across ocean shipping to regional fulfillment centers with customs and duty handling, backer wave fulfillment sequencing by region with address confirmation and change windows, retail release timing after backer delivery with distributor allocation and price positioning, component defect handling with replacement part requests and spare inventory, reprint decisions balancing demand signals against inventory risk, localization partner agreements for translated editions.

domain_name: crowdfund-boardgame-fulfillment
api_prefix: /

complexity_profile:
  primary_archetype: posture_driven_gating
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - scheduled_actions
  entity_topology: hybrid
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 — Entities (10). Embedded collections on Campaign replace standalone
# PledgeLevel / StretchGoal / AddOn / Backer entities: those concepts are
# modelled as nested structures on Campaign and Pledge to keep the endpoint
# surface lean while preserving every calculation and cascade.
# =============================================================================
entities:

  - name: Campaign
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Display title" }
      - { name: owner_user_id, type: string, source: input, description: "X-User-ID of owning CampaignOwner; immutable" }
      - { name: goal_cents, type: integer, source: input, description: "Funding goal; met when gross_charged_cents >= goal_cents" }
      - { name: currency, type: enum, source: input, description: "ISO 4217", constraints: "enum USD,EUR,GBP" }
      - { name: closes_at, type: datetime, source: input, description: "Logical-clock close time" }
      - { name: pledge_levels, type: array, source: input, description: "Embedded array of pledge level objects {name, price_cents, contents[], quantity_cap|null, late_pledge_premium_pct, status in {OPEN,CLOSED,RETIRED}}; mutated by stretch_goal_unlock cascade" }
      - { name: stretch_goals, type: array, source: input, description: "Embedded array of {goal_id (client-supplied slug), threshold_cents, target_pledge_level_name, bonus_component_sku, status in {LOCKED,UNLOCKED}, unlocked_at|null}; goal_id unique per campaign" }
      - { name: add_on_catalog, type: array, source: input, description: "Embedded array of {sku, price_cents, per_backer_cap, status in {OPEN,RETIRED}}; sku unique per campaign" }
      - { name: gross_charged_cents, type: integer, source: computed, description: "Sum of Pledge.pledge_total_cents over pledges with charge_status == CHARGED", default: 0 }
      - { name: platform_fee_cents, type: integer, source: computed, description: "Tiered platform fee per campaign_platform_fee", default: 0 }
      - { name: payment_fee_cents, type: integer, source: computed, description: "Sum of per-pledge payment fees per campaign_payment_fee", default: 0 }
      - { name: customs_duty_paid_cents, type: integer, source: computed, description: "Sum of customs_duty_cents over FreightShipments in {CLEARED, DELIVERED} for this campaign", default: 0 }
      - { name: net_payable_cents, type: integer, source: computed, description: "= gross - platform - payment - customs_duty_paid; pinned evaluation order in campaign_net_payable", default: 0 }
      - { name: total_backers_charged, type: integer, source: computed, description: "Count of Pledges with charge_status == CHARGED", default: 0 }
      - { name: retail_release_at, type: datetime, source: computed, description: "Earliest retail release instant; null until all waves DISPATCHED; see retail_release_window", default: null }
      - { name: status, type: enum, source: system, description: "Lifecycle", constraints: "enum DRAFT,LIVE,CLOSED_SUCCESS,CLOSED_FAILED,IN_PRODUCTION,FULFILLING,COMPLETE,CANCELLED" }

  - name: Pledge
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "Containing campaign (containment reference, set at creation)" }
      - { name: backer_user_id, type: string, source: input, description: "X-User-ID of the Backer who owns this pledge; ownership checks compare to this" }
      - { name: backer_email, type: string, source: input, description: "Backer's email; unique per campaign" }
      - { name: region_code, type: enum, source: input, description: "Backer region driving wave sequencing", constraints: "enum NA,EU,APAC,ROW" }
      - { name: pledge_level_name, type: string, source: input, description: "Name of an entry in campaign.pledge_levels; resolved at creation against the campaign's current level array" }
      - { name: is_late_pledge, type: boolean, source: input, description: "true if pledged after closes_at (allowed only when campaign is CLOSED_SUCCESS)", default: false }
      - { name: add_on_lines, type: array, source: input, description: "Array of {sku, quantity} referencing entries in campaign.add_on_catalog; each quantity in [1, per_backer_cap]; empty array permitted", default: [] }
      - { name: pledge_total_cents, type: integer, source: computed, description: "Computed by pledge_total_with_late_premium (per-line round_half_up then sum)" }
      - { name: charge_status, type: enum, source: system, description: "PENDING | CHARGED | CHARGE_FAILED | REFUNDED", constraints: "enum PENDING,CHARGED,CHARGE_FAILED,REFUNDED", default: "PENDING" }
      - { name: address_status, type: enum, source: system, description: "UNCONFIRMED | CONFIRMED | LOCKED", constraints: "enum UNCONFIRMED,CONFIRMED,LOCKED", default: "UNCONFIRMED" }
      - { name: fulfillment_status, type: enum, source: system, description: "QUEUED | WAVE_ASSIGNED | PICKED | SHIPPED | DELIVERED", constraints: "enum QUEUED,WAVE_ASSIGNED,PICKED,SHIPPED,DELIVERED", default: "QUEUED" }
      - { name: assigned_wave_id, type: string, source: system, description: "Wave this pledge is currently ASSIGNED to; null when fulfillment_status != WAVE_ASSIGNED/PICKED/SHIPPED", default: null }
      - { name: address_locked_at, type: datetime, source: computed, description: "Logical-clock timestamp when address flipped CONFIRMED → LOCKED", default: null }

  - name: ManufacturingQuote
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "Containing campaign (containment reference)" }
      - { name: factory_name, type: string, source: input, description: "Factory identifier" }
      - { name: tier_breaks, type: array, source: input, description: "Array of {min_units, unit_price_cents}, sorted ascending by min_units; tier_breaks[0].min_units is the MOQ and must be > 0" }
      - { name: provisional_units, type: integer, source: computed, description: "Pledges in {PENDING, CHARGED} + SIGNED localization print commitments at quote creation/revision" }
      - { name: provisional_unit_price_cents, type: integer, source: computed, description: "Tier price at provisional_units" }
      - { name: final_units, type: integer, source: computed, description: "Charged pledges + SIGNED localization commitments + RESERVED distributor units at finalize; null until FINAL", default: null }
      - { name: final_unit_price_cents, type: integer, source: computed, description: "Tier price at final_units; null until FINAL", default: null }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | SUBMITTED | FINAL | SUPERSEDED", constraints: "enum PROVISIONAL,SUBMITTED,FINAL,SUPERSEDED", default: "PROVISIONAL" }

  - name: ProductionRun
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "Containing campaign (containment reference)" }
      - { name: quote_id, type: string, source: input, description: "FK -> ManufacturingQuote.id; must be FINAL at lock" }
      - { name: planned_units, type: integer, source: computed, description: "= quote.final_units at LOCKED transition" }
      - { name: spare_units_by_region, type: object, source: computed, description: "Map region_code -> spare units; floor(0.05 * planned_units / 4) per region per spare_units_allocation", default: {} }
      - { name: status, type: enum, source: system, description: "QUOTED | LOCKED | IN_PRODUCTION | SHIPPED | CANCELLED", constraints: "enum QUOTED,LOCKED,IN_PRODUCTION,SHIPPED,CANCELLED", default: "QUOTED" }

  - name: FreightShipment
    parent: null
    common_fields: true
    fields:
      - { name: production_run_id, type: string, source: input, description: "Containing production run (containment reference)" }
      - { name: region_code, type: enum, source: input, description: "Destination region", constraints: "enum NA,EU,APAC,ROW" }
      - { name: container_count, type: integer, source: input, description: ">= 1" }
      - { name: declared_value_cents, type: integer, source: input, description: "> 0" }
      - { name: departs_at, type: datetime, source: input, description: "Sailing window start (inclusive)" }
      - { name: arrives_at, type: datetime, source: input, description: "Sailing window end (exclusive); half-open [departs_at, arrives_at); must be > departs_at" }
      - { name: customs_duty_cents, type: integer, source: computed, description: "Set by customs_duty_calculation at assess-duty; null until DUTY_ASSESSED", default: null }
      - { name: cost_cents, type: integer, source: computed, description: "Present only on dry_run=true preview responses: the freight_consolidation_cost result; null on persisted shipments", default: null }
      - { name: duty_variant_used, type: enum, source: computed, description: "DECLARED_VALUE | TRANSACTION_VALUE; pinned at DUTY_ASSESSED as the variant with the LOWER duty", default: null, constraints: "enum DECLARED_VALUE,TRANSACTION_VALUE" }
      - { name: status, type: enum, source: system, description: "BOOKED | IN_TRANSIT | CUSTOMS_HOLD | DUTY_ASSESSED | CLEARED | DELIVERED", constraints: "enum BOOKED,IN_TRANSIT,CUSTOMS_HOLD,DUTY_ASSESSED,CLEARED,DELIVERED", default: "BOOKED" }

  - name: Wave
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "Containing campaign (containment reference)" }
      - { name: region_code, type: enum, source: input, description: "Region this wave dispatches to", constraints: "enum NA,EU,APAC,ROW" }
      - { name: sequence_index, type: integer, source: input, description: "1-based dispatch order across the campaign; unique per campaign; lower dispatches first" }
      - { name: capacity, type: integer, source: input, description: "Max pledges this wave will fulfill; >= 1" }
      - { name: assignments, type: array, source: system, description: "Embedded array of {pledge_id, status in {ASSIGNED,REASSIGNED,REMOVED}}; capacity_used = count of entries with status == ASSIGNED", default: [] }
      - { name: capacity_used, type: integer, source: computed, description: "Count of assignments with status == ASSIGNED; conserved invariant across reassign", default: 0 }
      - { name: dispatch_window_start, type: datetime, source: input, description: "Inclusive dispatch window start" }
      - { name: dispatch_window_end, type: datetime, source: input, description: "Exclusive dispatch window end; half-open [start, end); must be > start" }
      - { name: address_lock_at, type: datetime, source: input, description: "When logical clock reaches this, CONFIRMED addresses on assigned pledges flip to LOCKED" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | OPEN | CLOSED | DISPATCHED | CANCELLED", constraints: "enum SCHEDULED,OPEN,CLOSED,DISPATCHED,CANCELLED", default: "SCHEDULED" }

  - name: DistributorAllocation
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "Containing campaign (containment reference)" }
      - { name: distributor_user_id, type: string, source: input, description: "X-User-ID of the acting Distributor; ownership checks compare to this" }
      - { name: distributor_name, type: string, source: input, description: "Distributor legal name" }
      - { name: region_code, type: enum, source: input, description: "Distributor's region", constraints: "enum NA,EU,APAC,ROW" }
      - { name: msrp_positioning_pct, type: number, source: input, description: "Wholesale discount off MSRP; in [0.30, 0.60]" }
      - { name: allocation_priority, type: integer, source: input, description: "Lower number = earlier allocation; ties broken by created_at ASC, never by id" }
      - { name: production_run_id, type: string, source: input, description: "FK -> ProductionRun.id; must belong to same campaign" }
      - { name: units_reserved, type: integer, source: input, description: ">= 1; sum across this run's {RESERVED,CONFIRMED,SHIPPED} allocations must not exceed the allocatable pool (see distributor_allocation_cap)" }
      - { name: status, type: enum, source: system, description: "RESERVED | CONFIRMED | SHIPPED | RELEASED", constraints: "enum RESERVED,CONFIRMED,SHIPPED,RELEASED", default: "RESERVED" }

  - name: ReplacementRequest
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "Containing campaign (containment reference)" }
      - { name: pledge_id, type: string, source: input, description: "FK -> Pledge.id; pledge must be fulfillment_status == DELIVERED at creation" }
      - { name: component_sku, type: string, source: input, description: "Defective component" }
      - { name: quantity, type: integer, source: input, description: ">= 1" }
      - { name: region_code, type: enum, source: computed, description: "Resolved from the pledge's region_code at creation; immutable", constraints: "enum NA,EU,APAC,ROW" }
      - { name: spare_units_debited, type: integer, source: computed, description: "Units earmarked from ProductionRun.spare_units_by_region[region] on APPROVED; reset to 0 on reopen; decrements run pool on ship", default: 0 }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | REJECTED | SHIPPED", constraints: "enum PENDING,APPROVED,REJECTED,SHIPPED", default: "PENDING" }

  - name: LocalizationAgreement
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "Containing campaign (containment reference)" }
      - { name: partner_name, type: string, source: input, description: "Partner legal name" }
      - { name: language_code, type: string, source: input, description: "BCP-47 (e.g. fr, de); unique per campaign" }
      - { name: royalty_pct, type: number, source: input, description: "0 < royalty_pct < 0.25" }
      - { name: print_commitment_units, type: integer, source: input, description: ">= 0; counted into ManufacturingQuote provisional/final unit recompute when status == SIGNED" }
      - { name: print_window_start, type: datetime, source: input, description: "Inclusive" }
      - { name: print_window_end, type: datetime, source: input, description: "Exclusive; half-open [start, end); must not overlap any active freight sailing window on the same campaign at sign time" }
      - { name: status, type: enum, source: system, description: "NEGOTIATING | SIGNED | PRINTED | TERMINATED", constraints: "enum NEGOTIATING,SIGNED,PRINTED,TERMINATED", default: "NEGOTIATING" }

  - name: ReprintDecision
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "Containing campaign (containment reference)" }
      - { name: proposed_units, type: integer, source: input, description: ">= 1" }
      - { name: demand_signal_cents, type: integer, source: input, description: "Trailing-90-day retail sell-through value" }
      - { name: inventory_risk_score, type: integer, source: computed, description: "Computed by reprint_inventory_risk at creation; 0..100" }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | REJECTED | LOCKED", constraints: "enum PROPOSED,APPROVED,REJECTED,LOCKED", default: "PROPOSED" }

# =============================================================================
# §1.2 — State Machines
# =============================================================================
state_machines:

  - entity: Campaign
    initial_state: DRAFT
    terminal_states: [COMPLETE, CANCELLED]
    transitions:
      - from: DRAFT
        to: LIVE
        trigger: "POST /campaigns/{id}/transition with action=launch"
        actor: CampaignOwner
        preconditions:
          - "status == DRAFT (ERR_INVALID_STATE)"
          - "campaign.pledge_levels contains at least one entry with status == OPEN (ERR_NO_PLEDGE_LEVEL)"
          - "closes_at > current logical clock (ERR_CAMPAIGN_ALREADY_CLOSED)"
        side_effects: ["campaign.version += 1"]

      - from: LIVE
        to: DRAFT
        trigger: "POST /campaigns/{id}/transition with action=unlaunch"
        actor: CampaignOwner
        preconditions:
          - "status == LIVE"
          - "no Pledge on this campaign with charge_status == CHARGED (ERR_CHARGED_PLEDGES_EXIST)"
        side_effects:
          - "hard-delete all Pledges in PENDING charge_status (cascade)"
          - "campaign.version += 1"

      - from: LIVE
        to: CLOSED_SUCCESS
        trigger: "system (logical clock >= closes_at AND gross_charged_cents >= goal_cents)"
        actor: system
        preconditions: []
        side_effects:
          - "for each embedded stretch_goal with status == LOCKED and threshold_cents <= gross_charged_cents: status := UNLOCKED, unlocked_at := now"
          - "for each newly UNLOCKED goal: append bonus_component_sku to the matching pledge_levels entry's contents (dedupe)"
          - "for each Pledge on a mutated level: recompute pledge_total_cents via pledge_total_with_late_premium; if pledge.charge_status == CHARGED, gross_charged_cents += (new_total - old_total)"
          - "recompute platform_fee_cents, payment_fee_cents, net_payable_cents"
          - "campaign.version += 1"

      - from: LIVE
        to: CLOSED_FAILED
        trigger: "system (logical clock >= closes_at AND gross_charged_cents < goal_cents)"
        actor: system
        preconditions: []
        side_effects:
          - "all Pledges CHARGED → REFUNDED; PENDING → REFUNDED (cascade refund)"
          - "gross_charged_cents := 0; platform_fee_cents := 0; payment_fee_cents := 0; net_payable_cents := 0; total_backers_charged := 0"
          - "ManufacturingQuotes in {PROVISIONAL, SUBMITTED} → SUPERSEDED"
          - "ProductionRuns in QUOTED → CANCELLED; their DistributorAllocations in RESERVED → RELEASED"
          - "Waves in {SCHEDULED, OPEN} → CANCELLED; their ASSIGNED assignments → REMOVED"
          - "campaign.version += 1"

      - from: CLOSED_SUCCESS
        to: IN_PRODUCTION
        trigger: "POST /campaigns/{id}/transition with action=start-production"
        actor: CampaignOwner
        preconditions:
          - "status == CLOSED_SUCCESS"
          - "at least one ManufacturingQuote in FINAL (ERR_NO_FINAL_QUOTE)"
          - "at least one ProductionRun in LOCKED (ERR_NO_LOCKED_RUN)"
        side_effects:
          - "all LOCKED ProductionRuns → IN_PRODUCTION"
          - "campaign.version += 1"

      - from: IN_PRODUCTION
        to: FULFILLING
        trigger: "system (first Wave transitions SCHEDULED → OPEN)"
        actor: system
        preconditions: []
        side_effects: ["campaign.version += 1"]

      - from: FULFILLING
        to: COMPLETE
        trigger: "POST /campaigns/{id}/transition with action=complete"
        actor: CampaignOwner
        preconditions:
          - "status == FULFILLING"
          - "every Wave is in {DISPATCHED, CANCELLED}"
          - "every Pledge with charge_status == CHARGED has fulfillment_status == DELIVERED"
          - "every FreightShipment is in {CLEARED, DELIVERED}"
        side_effects:
          - "retail_release_at finalized (see retail_release_window)"
          - "campaign.version += 1"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /campaigns/{id}/transition with action=cancel"
        actor: CampaignOwner
        preconditions: ["status in {DRAFT, LIVE}", "no Pledge with charge_status == CHARGED"]
        side_effects: ["campaign.version += 1"]

      - from: LIVE
        to: CANCELLED
        trigger: "POST /campaigns/{id}/transition with action=cancel"
        actor: CampaignOwner
        preconditions: ["status in {DRAFT, LIVE}", "no Pledge with charge_status == CHARGED"]
        side_effects:
          - "all Pledges PENDING → REFUNDED (compensating action)"
          - "campaign.version += 1"

  - entity: Pledge
    initial_state: "composite(PENDING, UNCONFIRMED, QUEUED)"
    terminal_states: ["composite(REFUNDED, any, any)", "composite(CHARGED, any, DELIVERED)"]
    transitions:
      - from: PENDING
        to: CHARGED
        trigger: "POST /pledges/{id}/transition with action=charge (default payment_outcome=SUCCEEDED)"
        actor: CampaignOwner
        preconditions:
          - "charge_status == PENDING"
          - "campaign.status in {LIVE, CLOSED_SUCCESS}"
          - "referenced pledge level's status == OPEN"
          - "level's quantity_cap is null OR count(CHARGED pledges at same level) < quantity_cap (ERR_LEVEL_CAPACITY_EXCEEDED)"
        side_effects:
          - "campaign.gross_charged_cents += pledge_total_cents; total_backers_charged += 1"
          - "recompute platform_fee_cents, payment_fee_cents, net_payable_cents"
          - "evaluate stretch_goal_unlock (may cascade level-contents mutation + sibling pledge repricing)"
          - "campaign.version += 1"

      - from: PENDING
        to: CHARGE_FAILED
        trigger: "POST /pledges/{id}/transition with action=charge and payment_outcome=FAILED"
        actor: CampaignOwner
        preconditions: ["charge_status == PENDING"]
        side_effects: []

      - from: CHARGE_FAILED
        to: PENDING
        trigger: "POST /pledges/{id}/transition with action=charge-retry"
        actor: CampaignOwner
        preconditions: ["charge_status == CHARGE_FAILED"]
        side_effects: []

      - from: CHARGED
        to: REFUNDED
        trigger: "POST /pledges/{id}/transition with action=refund"
        actor: CampaignOwner
        preconditions:
          - "charge_status == CHARGED"
          - "campaign.status in {LIVE, CLOSED_SUCCESS, IN_PRODUCTION, FULFILLING}"
          - "fulfillment_status not in {SHIPPED, DELIVERED} (ERR_ALREADY_SHIPPED)"
        side_effects:
          - "campaign.gross_charged_cents -= pledge_total_cents; total_backers_charged -= 1"
          - "recompute platform_fee_cents, payment_fee_cents, net_payable_cents"
          - "if assigned_wave_id is not null: remove the assignment from that wave (entry status → REMOVED, wave.capacity_used -= 1), assigned_wave_id := null, fulfillment_status := QUEUED"
          - "campaign.version += 1"

      - from: UNCONFIRMED
        to: CONFIRMED
        trigger: "POST /pledges/{id}/transition with action=confirm-address"
        actor: Backer
        preconditions:
          - "address_status == UNCONFIRMED"
          - "acting X-User-ID == pledge.backer_user_id (ERR_FORBIDDEN)"
        side_effects: []

      - from: CONFIRMED
        to: UNCONFIRMED
        trigger: "POST /pledges/{id}/transition with action=change-address"
        actor: Backer
        preconditions:
          - "address_status == CONFIRMED"
          - "acting X-User-ID == pledge.backer_user_id (ERR_FORBIDDEN)"
          - "current logical clock < assigned wave's address_lock_at, or no wave assigned (ERR_ADDRESS_LOCKED)"
        side_effects: []

      - from: CONFIRMED
        to: LOCKED
        trigger: "system (logical clock >= assigned wave.address_lock_at)"
        actor: system
        preconditions: ["assigned_wave_id is not null"]
        side_effects: ["address_locked_at := now"]

      - from: QUEUED
        to: WAVE_ASSIGNED
        trigger: "system (assignment added to a wave with status ASSIGNED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: WAVE_ASSIGNED
        to: PICKED
        trigger: "POST /waves/{id}/transition with action=pick, pledge_id=<pledge>"
        actor: FulfillmentOperator
        preconditions:
          - "wave.status == OPEN"
          - "pledge is ASSIGNED on this wave"
          - "logical clock in [wave.dispatch_window_start, wave.dispatch_window_end)"
        side_effects: []

      - from: PICKED
        to: SHIPPED
        trigger: "POST /waves/{id}/transition with action=ship, pledge_id=<pledge>"
        actor: FulfillmentOperator
        preconditions:
          - "wave.status == OPEN"
          - "pledge.fulfillment_status == PICKED"
          - "every FreightShipment on the same campaign with region_code == wave.region_code is in {CLEARED, DELIVERED} (ERR_FREIGHT_NOT_CLEARED)"
        side_effects: []

      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /waves/{id}/transition with action=deliver, pledge_id=<pledge>"
        actor: FulfillmentOperator
        preconditions: ["pledge.fulfillment_status == SHIPPED"]
        side_effects:
          - "if all ASSIGNED pledges on the wave are DELIVERED: wave auto-transitions OPEN → CLOSED"

      - from: WAVE_ASSIGNED
        to: QUEUED
        trigger: "system (assignment flips ASSIGNED → REMOVED or → REASSIGNED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ManufacturingQuote
    initial_state: PROVISIONAL
    terminal_states: [FINAL, SUPERSEDED]
    transitions:
      - from: PROVISIONAL
        to: SUBMITTED
        trigger: "POST /manufacturing-quotes/{id}/transition with action=submit"
        actor: FactoryCoordinator
        preconditions: ["status == PROVISIONAL", "campaign.status == CLOSED_SUCCESS (ERR_CAMPAIGN_NOT_CLOSED)"]
        side_effects: []

      - from: SUBMITTED
        to: FINAL
        trigger: "POST /manufacturing-quotes/{id}/transition with action=finalize"
        actor: FactoryCoordinator
        preconditions: ["status == SUBMITTED", "no other quote on this campaign is FINAL (ERR_QUOTE_ALREADY_FINAL)"]
        side_effects:
          - "recompute final_units and final_unit_price_cents (final variant)"
          - "sibling quotes in {PROVISIONAL, SUBMITTED} → SUPERSEDED (cascade)"
          - "campaign.version += 1"

      - from: SUBMITTED
        to: PROVISIONAL
        trigger: "POST /manufacturing-quotes/{id}/transition with action=revise"
        actor: FactoryCoordinator
        preconditions: ["status == SUBMITTED", "no ProductionRun referencing this quote is in LOCKED or later"]
        side_effects: ["recompute provisional_units and provisional_unit_price_cents"]

      - from: PROVISIONAL
        to: SUPERSEDED
        trigger: "system (sibling quote finalizes OR campaign LIVE→CLOSED_FAILED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ProductionRun
    initial_state: QUOTED
    terminal_states: [SHIPPED, CANCELLED]
    transitions:
      - from: QUOTED
        to: LOCKED
        trigger: "POST /production-runs/{id}/transition with action=lock"
        actor: FactoryCoordinator
        preconditions:
          - "status == QUOTED"
          - "referenced ManufacturingQuote.status == FINAL (ERR_QUOTE_NOT_FINAL)"
          - "quote.final_units >= quote.tier_breaks[0].min_units (ERR_MOQ_NOT_MET)"
        side_effects:
          - "planned_units := quote.final_units"
          - "spare_units_by_region initialized per spare_units_allocation"
          - "campaign may transition CLOSED_SUCCESS → IN_PRODUCTION via start-production (separate call)"
          - "campaign.version += 1"

      - from: IN_PRODUCTION
        to: SHIPPED
        trigger: "system (all FreightShipments on this run in DELIVERED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: QUOTED
        to: CANCELLED
        trigger: "POST /production-runs/{id}/transition with action=cancel OR system on campaign close-fail"
        actor: "FactoryCoordinator | system"
        preconditions: ["status == QUOTED"]
        side_effects: ["DistributorAllocations on this run in RESERVED → RELEASED"]

  - entity: FreightShipment
    initial_state: BOOKED
    terminal_states: [DELIVERED]
    transitions:
      - from: BOOKED
        to: IN_TRANSIT
        trigger: "POST /freight-shipments/{id}/transition with action=depart"
        actor: FreightBroker
        preconditions:
          - "status == BOOKED"
          - "logical clock >= departs_at (ERR_FREIGHT_NOT_IN_WINDOW)"
          - "no other shipment on same production_run_id with overlapping [departs_at, arrives_at) in {IN_TRANSIT, CUSTOMS_HOLD, DUTY_ASSESSED, CLEARED} (ERR_FREIGHT_WINDOW_OVERLAP; half-open — adjacency allowed)"
        side_effects: []

      - from: IN_TRANSIT
        to: CUSTOMS_HOLD
        trigger: "POST /freight-shipments/{id}/transition with action=arrive"
        actor: FreightBroker
        preconditions: ["status == IN_TRANSIT", "logical clock >= arrives_at (ERR_FREIGHT_NOT_IN_WINDOW)"]
        side_effects: []

      - from: CUSTOMS_HOLD
        to: DUTY_ASSESSED
        trigger: "POST /freight-shipments/{id}/transition with action=assess-duty"
        actor: CustomsAgent
        preconditions: ["status == CUSTOMS_HOLD"]
        side_effects: ["compute customs_duty_cents and duty_variant_used (lower of two variants)"]

      - from: DUTY_ASSESSED
        to: CLEARED
        trigger: "POST /freight-shipments/{id}/transition with action=pay-duty"
        actor: CustomsAgent
        preconditions: ["status == DUTY_ASSESSED"]
        side_effects:
          - "campaign.customs_duty_paid_cents += customs_duty_cents; net_payable_cents recomputed"
          - "campaign.version += 1"

      - from: CUSTOMS_HOLD
        to: BOOKED
        trigger: "POST /freight-shipments/{id}/transition with action=rebook, departs_at, arrives_at"
        actor: FreightBroker
        preconditions: ["status == CUSTOMS_HOLD", "new window must not overlap other active shipments on the run (ERR_FREIGHT_WINDOW_OVERLAP)"]
        side_effects: ["departs_at and arrives_at updated to the new window (cyclic re-entry into BOOKED)"]

      - from: CLEARED
        to: DELIVERED
        trigger: "POST /freight-shipments/{id}/transition with action=deliver-to-warehouse"
        actor: FulfillmentOperator
        preconditions: ["status == CLEARED"]
        side_effects:
          - "gates Wave SCHEDULED → OPEN eligibility for the matching region"
          - "if all shipments on the parent run are DELIVERED: ProductionRun IN_PRODUCTION → SHIPPED"

  - entity: Wave
    initial_state: SCHEDULED
    terminal_states: [DISPATCHED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /waves/{id}/transition with action=open"
        actor: FulfillmentOperator
        preconditions:
          - "status == SCHEDULED"
          - "campaign.status == IN_PRODUCTION"
          - "no other wave on the same campaign with LOWER sequence_index is in {SCHEDULED, OPEN, CLOSED} (ERR_WAVE_OUT_OF_SEQUENCE)"
          - "at least one FreightShipment on this campaign with region_code == wave.region_code is in {CLEARED, DELIVERED} (ERR_FREIGHT_NOT_CLEARED)"
        side_effects:
          - "campaign IN_PRODUCTION → FULFILLING"
          - "campaign.version += 1"

      - from: OPEN
        to: SCHEDULED
        trigger: "POST /waves/{id}/transition with action=rebalance (optional new capacity, dispatch_window_start, dispatch_window_end)"
        actor: FulfillmentOperator
        preconditions: ["status == OPEN", "capacity_used == 0 (ERR_WAVE_NOT_EMPTY)"]
        side_effects: ["wave.capacity and dispatch window may be edited"]

      - from: OPEN
        to: CLOSED
        trigger: "system (all ASSIGNED pledges DELIVERED) OR POST /waves/{id}/transition with action=close"
        actor: "system | FulfillmentOperator"
        preconditions: ["for manual close: capacity_used > 0 AND all ASSIGNED pledges DELIVERED"]
        side_effects: []

      - from: CLOSED
        to: DISPATCHED
        trigger: "POST /waves/{id}/transition with action=dispatch"
        actor: FulfillmentOperator
        preconditions: ["status == CLOSED", "logical clock >= dispatch_window_end"]
        side_effects:
          - "if all waves on campaign are DISPATCHED: campaign.retail_release_at computed via retail_release_window"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /waves/{id}/transition with action=cancel"
        actor: FulfillmentOperator
        preconditions: ["status == SCHEDULED", "capacity_used == 0 (ERR_WAVE_NOT_EMPTY)"]
        side_effects: []

  - entity: DistributorAllocation
    initial_state: RESERVED
    terminal_states: [SHIPPED, RELEASED]
    transitions:
      - from: RESERVED
        to: CONFIRMED
        trigger: "POST /distributor-allocations/{id}/transition with action=confirm"
        actor: Distributor
        preconditions:
          - "status == RESERVED"
          - "acting X-User-ID == allocation.distributor_user_id (ERR_FORBIDDEN)"
          - "campaign.status in {FULFILLING, COMPLETE}"
        side_effects: []

      - from: CONFIRMED
        to: SHIPPED
        trigger: "POST /distributor-allocations/{id}/transition with action=ship"
        actor: FulfillmentOperator
        preconditions:
          - "status == CONFIRMED"
          - "campaign.retail_release_at is not null AND logical clock >= campaign.retail_release_at (ERR_RETAIL_RELEASE_TOO_EARLY)"
        side_effects: []

      - from: RESERVED
        to: RELEASED
        trigger: "POST /distributor-allocations/{id}/transition with action=release"
        actor: Distributor
        preconditions: ["status == RESERVED", "acting X-User-ID == allocation.distributor_user_id (ERR_FORBIDDEN)"]
        side_effects: ["units_reserved returned to the allocatable pool"]

  - entity: ReplacementRequest
    initial_state: PENDING
    terminal_states: [REJECTED, SHIPPED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /replacement-requests/{id}/transition with action=approve"
        actor: CampaignOwner
        preconditions:
          - "status == PENDING"
          - "available spares in request.region_code (initial minus shipped) >= quantity (ERR_INSUFFICIENT_SPARES)"
        side_effects: ["spare_units_debited := quantity"]

      - from: APPROVED
        to: PENDING
        trigger: "POST /replacement-requests/{id}/transition with action=reopen"
        actor: CampaignOwner
        preconditions: ["status == APPROVED"]
        side_effects: ["spare_units_debited := 0 (compensating invariant — available spare pool unchanged after approve+reopen)"]

      - from: PENDING
        to: REJECTED
        trigger: "POST /replacement-requests/{id}/transition with action=reject"
        actor: CampaignOwner
        preconditions: ["status == PENDING"]
        side_effects: []

      - from: APPROVED
        to: SHIPPED
        trigger: "POST /replacement-requests/{id}/transition with action=ship"
        actor: FulfillmentOperator
        preconditions: ["status == APPROVED"]
        side_effects:
          - "ProductionRun.spare_units_by_region[region] -= spare_units_debited (the run is the one referenced by the campaign's most recent LOCKED ProductionRun)"
          - "campaign.version += 1"

  - entity: LocalizationAgreement
    initial_state: NEGOTIATING
    terminal_states: [PRINTED, TERMINATED]
    transitions:
      - from: NEGOTIATING
        to: SIGNED
        trigger: "POST /localization-agreements/{id}/transition with action=sign"
        actor: LocalizationPartner
        preconditions:
          - "status == NEGOTIATING"
          - "[print_window_start, print_window_end) does not overlap any FreightShipment's [departs_at, arrives_at) on the same campaign with shipment.status in {BOOKED, IN_TRANSIT, CUSTOMS_HOLD, DUTY_ASSESSED, CLEARED} (ERR_PRINT_WINDOW_OVERLAP; half-open — adjacency allowed)"
        side_effects: ["print_commitment_units counted into ManufacturingQuote provisional/final recompute", "campaign.version += 1"]

      - from: SIGNED
        to: NEGOTIATING
        trigger: "POST /localization-agreements/{id}/transition with action=renegotiate"
        actor: LocalizationPartner
        preconditions: ["status == SIGNED", "campaign.status in {CLOSED_SUCCESS, IN_PRODUCTION}"]
        side_effects: ["print_commitment_units removed from quote recompute (cyclic loop)"]

      - from: SIGNED
        to: PRINTED
        trigger: "POST /localization-agreements/{id}/transition with action=mark-printed"
        actor: LocalizationPartner
        preconditions: ["status == SIGNED", "logical clock in [print_window_start, print_window_end) (ERR_PRINT_WINDOW_NOT_OPEN)"]
        side_effects: []

      - from: NEGOTIATING
        to: TERMINATED
        trigger: "POST /localization-agreements/{id}/transition with action=terminate"
        actor: LocalizationPartner
        preconditions: ["status == NEGOTIATING"]
        side_effects: []

  - entity: ReprintDecision
    initial_state: PROPOSED
    terminal_states: [REJECTED, LOCKED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /reprint-decisions/{id}/transition with action=approve"
        actor: CampaignOwner
        preconditions: ["status == PROPOSED", "inventory_risk_score < 70 (ERR_INVENTORY_RISK_TOO_HIGH)"]
        side_effects: []

      - from: PROPOSED
        to: REJECTED
        trigger: "POST /reprint-decisions/{id}/transition with action=reject"
        actor: CampaignOwner
        preconditions: ["status == PROPOSED"]
        side_effects: []

      - from: APPROVED
        to: LOCKED
        trigger: "POST /reprint-decisions/{id}/transition with action=lock"
        actor: FactoryCoordinator
        preconditions:
          - "status == APPROVED"
          - "a FINAL ManufacturingQuote exists on this campaign with tier_breaks[0].min_units <= proposed_units (ERR_MOQ_NOT_MET)"
        side_effects: []

# =============================================================================
# §1.2.1 — Concurrency Rules (OCC on Campaign.version)
# =============================================================================
concurrency_rules:
  - rule_id: pledge-create-stale-campaign
    parent_entity: Campaign
    write_endpoint: "POST /pledges"
    occ_field: "expected_campaign_version"
    description: |
      Creating a Pledge against a Campaign whose version has advanced since the
      client last observed it is rejected: a stretch-goal unlock or sibling
      pledge charge in between may have re-priced levels or added contents, so
      the client's quoted pledge_total_cents is stale.
    error_id: ERR_STALE_CAMPAIGN_VERSION
    http_status: 412

  - rule_id: wave-assign-stale-campaign
    parent_entity: Campaign
    write_endpoint: "POST /waves/{id}/transition"
    occ_field: "expected_campaign_version"
    description: |
      Wave assignment actions (action in {assign, auto_populate, reassign,
      remove}) carry expected_campaign_version. A stale view of capacity (e.g.
      after another assignment bumped campaign.version) is rejected.
    error_id: ERR_STALE_CAMPAIGN_VERSION
    http_status: 412

# =============================================================================
# §1.3 — Calculation Rules
# =============================================================================
calculations:

  - name: pledge_total_with_late_premium
    trigger: "pledge creation; stretch_goal_unlock cascade"
    algorithm: aggregation
    formula: |
      Inputs: level.price_cents, level.late_pledge_premium_pct, pledge.is_late_pledge,
              pledge.add_on_lines[{sku, quantity}], catalog entry prices.
      Mode (b) — per-line round_half_up THEN sum (pinned; sum-then-round is wrong):
        level_line_cents = round_half_up(price_cents * (1 + (is_late_pledge ? late_pledge_premium_pct : 0)))
        for each add-on line in array order:
          line_cents = round_half_up(add_on.price_cents * quantity * (1 + (is_late_pledge ? late_pledge_premium_pct : 0)))
        pledge_total_cents = level_line_cents + sum(line_cents)
    input_set: "the pledge being computed; referenced add-on catalog entries must have status == OPEN at compute time"
    precision: "integer cents, round_half_up per line"

  - name: campaign_platform_fee
    trigger: "every charge, refund, campaign close"
    algorithm: tiered_pricing
    formula: |
      Average-rate (NOT marginal brackets) applied to gross_charged_cents:
        if gross < 1_000_000:      rate = 0.08
        elif gross < 10_000_000:   rate = 0.06
        else:                       rate = 0.05
      platform_fee_cents = round_half_up(gross * rate)
    input_set: "campaign.gross_charged_cents as currently recomputed"
    constants:
      TIER1_THRESHOLD: 1000000
      TIER2_THRESHOLD: 10000000
      TIER1_RATE: 0.08
      TIER2_RATE: 0.06
      TIER3_RATE: 0.05
    precision: "integer cents, round_half_up"

  - name: campaign_payment_fee
    trigger: "every charge, refund"
    algorithm: aggregation
    formula: |
      Per-pledge fee = round_half_up(pledge_total_cents * 0.029 + 30)
      campaign.payment_fee_cents = sum over pledges with charge_status == CHARGED of per-pledge fee
      Refunded pledges contribute 0 (they are no longer CHARGED).
    input_set: "pledges with charge_status == CHARGED on this campaign"
    constants:
      PER_PLEDGE_PCT: 0.029
      PER_PLEDGE_FLAT_CENTS: 30
    precision: "integer cents, round_half_up per pledge, then sum"

  - name: campaign_net_payable
    trigger: "every charge, refund, customs duty payment, campaign close"
    algorithm: aggregation
    formula: |
      Mode (c) — pinned evaluation order breaking the apparent circularity:
        1. recompute gross_charged_cents (sum of CHARGED pledge_total_cents)
        2. recompute platform_fee_cents from gross (NOT from net)
        3. recompute payment_fee_cents from CHARGED pledges
        4. recompute customs_duty_paid_cents = sum of customs_duty_cents over shipments on this campaign in {CLEARED, DELIVERED}
        5. net_payable_cents = gross - platform_fee - payment_fee - customs_duty_paid
    input_set: "campaign plus charged pledges plus duty-paid shipments"
    precision: "integer cents"

  - name: stretch_goal_unlock
    trigger: "every successful charge (PENDING → CHARGED); campaign close"
    algorithm: threshold
    formula: |
      For each embedded stretch_goal on the campaign with status == LOCKED,
      evaluated in threshold_cents ASC, goal_id ASC order (goal_id is a
      client-supplied slug — never the server id):
        if campaign.gross_charged_cents >= threshold_cents:    # >= NOT >
          goal.status := UNLOCKED; goal.unlocked_at := now
          append goal.bonus_component_sku to the matching pledge_levels entry's contents (dedupe)
          for each Pledge on that level with charge_status in {PENDING, CHARGED}:
            old_total = pledge.pledge_total_cents
            recompute pledge_total_cents via pledge_total_with_late_premium
            if charge_status == CHARGED:
              campaign.gross_charged_cents += (new_total - old_total)
          # After all matched goals processed, recompute campaign fees once.
      One pass, ordered; goals unlocked later in the same pass see the updated gross.
    input_set: "embedded stretch_goals with status == LOCKED"
    precision: "integer cents"

  - name: manufacturing_tier_price
    trigger: "quote creation, revise, finalize"
    algorithm: tiered_pricing
    formula: |
      Dual-variant:
        PROVISIONAL: units = count(Pledges on campaign with charge_status in {PENDING, CHARGED})
                           + sum(LocalizationAgreement.print_commitment_units where status == SIGNED)
        FINAL:       units = count(Pledges with charge_status == CHARGED)
                           + sum(LocalizationAgreement.print_commitment_units where status == SIGNED)
                           + sum(DistributorAllocation.units_reserved where status == RESERVED)
      unit_price_cents := unit_price of the LAST tier whose min_units <= units.
    variants:
      - name: provisional
        when: "quote.status in {PROVISIONAL, SUBMITTED}"
        difference: "includes PENDING pledges; excludes RESERVED distributor units"
      - name: final
        when: "quote.status == FINAL"
        difference: "excludes PENDING pledges; includes RESERVED distributor units"
    precision: "integer cents"

  - name: customs_duty_calculation
    trigger: "POST /freight-shipments/{id}/transition action=assess-duty"
    algorithm: aggregation
    formula: |
      Dual-variant (compute both, pick the LOWER duty, pin duty_variant_used):
        DECLARED_VALUE:    dutiable = shipment.declared_value_cents
        TRANSACTION_VALUE: dutiable = production_run.planned_units * quote.final_unit_price_cents
                                       * (shipment.container_count / total_containers_for_run)
      duty_rate by region_code: NA 0.040 | EU 0.065 | APAC 0.052 | ROW 0.080
      customs_duty_cents = round_half_up(dutiable * duty_rate)
      duty_variant_used := the variant with the lower result; on tie, DECLARED_VALUE wins.
    variants:
      - name: declared_value
        when: "always computed as candidate"
        difference: "uses client-supplied declared_value_cents"
      - name: transaction_value
        when: "always computed as candidate"
        difference: "computed from run economics pro-rated by container share"
    constants:
      DUTY_RATE_NA: 0.040
      DUTY_RATE_EU: 0.065
      DUTY_RATE_APAC: 0.052
      DUTY_RATE_ROW: 0.080
    precision: "integer cents, round_half_up"

  - name: wave_allocation_order
    trigger: "POST /waves/{id}/transition action=auto_populate"
    algorithm: waterfall_allocation
    formula: |
      Eligibility: Pledges on this campaign where charge_status == CHARGED
                   AND address_status == CONFIRMED
                   AND fulfillment_status == QUEUED
                   AND region_code == wave.region_code
      Ranking:     pledge.created_at ASC; tie-break pledge.updated_at ASC; never id.
      Waterfall:   walk ranked pledges; assign while wave.capacity_used < wave.capacity;
                   halt at first pledge that would exceed capacity (partial fill allowed;
                   remaining pledges NOT deferred to a later wave).
      Empty pool:  success with 0 assignments (no error).
    input_set: "Pledges meeting the eligibility predicate"
    precision: "n/a — discrete allocation"

  - name: spare_units_allocation
    trigger: "ProductionRun QUOTED → LOCKED"
    algorithm: aggregation
    formula: |
      For each region in {NA, EU, APAC, ROW}:
        spare_units_by_region[region] = floor(0.05 * planned_units / 4)
      e.g. planned_units=1000 → floor(50/4)=12 per region (total 48; remainder 2 stays in pool).
    constants:
      SPARE_PCT: 0.05
      REGIONS: ["NA", "EU", "APAC", "ROW"]
    precision: "integer units, floor"

  - name: retail_release_window
    trigger: "campaign final Wave DISPATCHED"
    algorithm: forward_looking
    formula: |
      Dual-variant candidates:
        variant_A = max over pledges with fulfillment_status == DELIVERED of delivered timestamp
                    (approximated by pledge.updated_at at the moment of DELIVERED)
        variant_B = max over waves of wave.dispatch_window_end
      retail_release_at = max(variant_A, variant_B) + 90 days
      Diverges whenever any pledge delivers after its wave's dispatch_window_end.
    input_set: "campaign's DELIVERED pledges and DISPATCHED waves"
    constants:
      RETAIL_DELAY_DAYS: 90
    precision: "datetime ISO-8601 UTC, whole seconds"

  - name: reprint_inventory_risk
    trigger: "ReprintDecision creation"
    algorithm: weighted_scoring
    formula: |
      sell_through_rate     = demand_signal_cents / max(campaign.gross_charged_cents, 1)
      spare_depletion_ratio = 1 - (sum(spare_units_by_region remaining) / max(sum(initial), 1))
      demand_velocity       = demand_signal_cents / 90
      raw = round_half_up(100 * (0.5 * (1 - sell_through_rate) + 0.3 * spare_depletion_ratio + 0.2 * min(demand_velocity / 100000, 1.0)))
      inventory_risk_score = clamp(raw, 0, 100)
      Weights sum to 1.0; rounding at final step only.
    input_set: "campaign aggregate economics + spare units pool + trailing demand"
    constants:
      WEIGHT_SELL_THROUGH: 0.5
      WEIGHT_SPARES: 0.3
      WEIGHT_VELOCITY: 0.2
      VELOCITY_SATURATION_CENTS_PER_DAY: 100000
    precision: "integer score 0..100, round_half_up at final step"

  - name: freight_consolidation_cost
    trigger: "POST /freight-shipments with dry_run=true (preview; does not persist)"
    algorithm: tiered_pricing
    formula: |
      Mode (a) — >=3 inputs, non-linear interaction:
        dimensional_weight_kg = max(total_weight_kg, total_volume_m3 * 250)
        base_per_container_cents by region: NA 350000 | EU 420000 | APAC 280000 | ROW 510000
        weight_surcharge_cents = max(0, dimensional_weight_kg - 22000) * 8
        volume_surcharge_cents = if total_volume_m3 > 67 then (total_volume_m3 - 67) * 4000 else 0
        cost_cents = container_count * base_per_container_cents[region] + weight_surcharge_cents + volume_surcharge_cents
    precision: "integer cents"

  - name: distributor_allocation_cap
    trigger: "POST /distributor-allocations"
    algorithm: waterfall_allocation
    formula: |
      allocatable_pool = production_run.planned_units
                         - count(Pledges on campaign with charge_status == CHARGED)
                         - sum(spare_units_by_region over 4 regions)
                         - sum(units_reserved over allocations on this run in {RESERVED, CONFIRMED, SHIPPED})
      if units_reserved > allocatable_pool OR allocatable_pool == 0: ERR_ALLOCATION_EXCEEDS_POOL
    input_set: "production run, charged pledges, spares, non-released allocations"
    precision: "integer units"

# =============================================================================
# §1.4 — Validations (ordered by priority)
# =============================================================================
validations:
  - { priority: 1,  category: auth,                  check: "X-User-ID and X-User-Role present and well-formed", error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http_status: 400, applies_to: "all" }
  - { priority: 2,  category: auth,                  check: "Role permitted per endpoint's roles: list", error_id: ERR_INSUFFICIENT_PERMISSIONS, http_status: 403, applies_to: "all" }
  - { priority: 3,  category: existence,             check: "Path ids exist; validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all endpoints with path ids" }
  - { priority: 4,  category: existence,             check: "Body FK ids (campaign_id, quote_id, pledge_id, production_run_id) exist and belong to the same campaign where applicable", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "endpoints taking FK fields in body" }
  - { priority: 5,  category: state,                 check: "Target resource status is a valid from-state for the requested action", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all transition endpoints" }
  - { priority: 6,  category: state,                 check: "Composite pledge precondition: pledge satisfies the specific (charge_status, address_status, fulfillment_status) tuple required by the action", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "POST /pledges/{id}/transition, POST /waves/{id}/transition (assignment actions)" }
  - { priority: 7,  category: state,                 check: "Cross-entity posture gate: campaign.status permits the action", error_id: ERR_CAMPAIGN_NOT_READY, http_status: 409, applies_to: "campaign-gated endpoints" }
  - { priority: 8,  category: business_safety,       check: "Address is LOCKED on any assigned wave whose address_lock_at has passed", error_id: ERR_ADDRESS_LOCKED, http_status: 409, applies_to: "POST /pledges/{id}/transition action=change-address" }
  - { priority: 9,  category: business_safety,       check: "Freight windows on same run do not overlap (half-open; adjacency allowed)", error_id: ERR_FREIGHT_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /freight-shipments, POST /freight-shipments/{id}/transition action=depart|rebook" }
  - { priority: 10, category: business_safety,       check: "Localization print window does not overlap any active freight sailing window on the campaign (half-open; adjacency allowed)", error_id: ERR_PRINT_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /localization-agreements/{id}/transition action=sign" }
  - { priority: 11, category: business_constraint,   check: "wave.capacity_used < wave.capacity at assignment (>= boundary rejects)", error_id: ERR_WAVE_CAPACITY_FULL, http_status: 409, applies_to: "POST /waves/{id}/transition action=assign|auto_populate" }
  - { priority: 12, category: business_constraint,   check: "Level capacity: count(CHARGED pledges at level) < quantity_cap (equality rejects)", error_id: ERR_LEVEL_CAPACITY_EXCEEDED, http_status: 409, applies_to: "POST /pledges/{id}/transition action=charge" }
  - { priority: 13, category: business_constraint,   check: "Wave sequencing: no wave may OPEN while a lower sequence_index wave is in {SCHEDULED, OPEN, CLOSED}", error_id: ERR_WAVE_OUT_OF_SEQUENCE, http_status: 409, applies_to: "POST /waves/{id}/transition action=open" }
  - { priority: 14, category: business_constraint,   check: "MOQ: quote.final_units >= tier_breaks[0].min_units at run lock and reprint lock", error_id: ERR_MOQ_NOT_MET, http_status: 422, applies_to: "POST /production-runs/{id}/transition action=lock, POST /reprint-decisions/{id}/transition action=lock" }
  - { priority: 15, category: business_referential,  check: "Ownership: X-User-ID == pledge.backer_user_id for address ops; X-User-ID == allocation.distributor_user_id for confirm/release", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "POST /pledges/{id}/transition action=confirm-address|change-address, POST /distributor-allocations/{id}/transition action=confirm|release" }
  - { priority: 16, category: business_referential,  check: "Replacement precondition: pledge.fulfillment_status == DELIVERED", error_id: ERR_PLEDGE_NOT_DELIVERED, http_status: 409, applies_to: "POST /replacement-requests" }
  - { priority: 17, category: business_fiscal,       check: "units_reserved <= allocatable_pool; zero pool rejects", error_id: ERR_ALLOCATION_EXCEEDS_POOL, http_status: 422, applies_to: "POST /distributor-allocations" }
  - { priority: 18, category: business_fiscal,       check: "Available spares in region >= quantity at approve", error_id: ERR_INSUFFICIENT_SPARES, http_status: 422, applies_to: "POST /replacement-requests/{id}/transition action=approve" }
  - { priority: 19, category: business_fiscal,       check: "inventory_risk_score < 70 to approve reprint", error_id: ERR_INVENTORY_RISK_TOO_HIGH, http_status: 422, applies_to: "POST /reprint-decisions/{id}/transition action=approve" }
  - { priority: 20, category: business_temporal,     check: "closes_at > logical clock at launch", error_id: ERR_CAMPAIGN_ALREADY_CLOSED, http_status: 409, applies_to: "POST /campaigns/{id}/transition action=launch" }
  - { priority: 21, category: business_temporal,     check: "logical clock >= campaign.retail_release_at to ship distributor allocation", error_id: ERR_RETAIL_RELEASE_TOO_EARLY, http_status: 409, applies_to: "POST /distributor-allocations/{id}/transition action=ship" }
  - { priority: 22, category: business_temporal,     check: "logical clock in shipment window for depart; >= arrives_at for arrive", error_id: ERR_FREIGHT_NOT_IN_WINDOW, http_status: 409, applies_to: "POST /freight-shipments/{id}/transition action=depart|arrive" }
  - { priority: 23, category: business_temporal,     check: "logical clock in [print_window_start, print_window_end) at mark-printed", error_id: ERR_PRINT_WINDOW_NOT_OPEN, http_status: 409, applies_to: "POST /localization-agreements/{id}/transition action=mark-printed" }

# =============================================================================
# §1.5 — Endpoints (39 total)
# =============================================================================
endpoints:

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-09-01T00:00:00Z; before any set call the logical clock reads exactly this default and MUST NOT fall back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects: ["advances logical clock; may trigger time-based transitions (campaign close, address lock, stretch-goal re-eval)"]

  # --- Campaign ---
  - method: POST
    path: "/campaigns"
    description: "Create a campaign (status=DRAFT); body includes embedded pledge_levels, stretch_goals, add_on_catalog arrays"
    roles: [CampaignOwner, PlatformAdmin]
    code: 201
    input: [title, owner_user_id, goal_cents, currency, closes_at, pledge_levels, "stretch_goals?", "add_on_catalog?"]
    output: Campaign
    side_effects: ["campaign.version := 1"]

  - method: GET
    path: "/campaigns/{id}"
    description: "Get one campaign"
    roles: [CampaignOwner, Backer, FactoryCoordinator, FreightBroker, CustomsAgent, FulfillmentOperator, Distributor, LocalizationPartner, PlatformAdmin]
    code: 200
    input: []
    output: Campaign
    side_effects: []

  - method: POST
    path: "/campaigns/{id}/transition"
    description: "Campaign state transitions"
    roles: [CampaignOwner]
    code: 200
    input: [action]   # launch | unlaunch | cancel | start-production | complete
    output: Campaign
    side_effects: ["see state_machines.Campaign"]

  # --- Pledge ---
  - method: POST
    path: "/pledges"
    description: "Create a pledge (OCC on campaign.version)"
    roles: [Backer, PlatformAdmin]
    code: 201
    input: [campaign_id, backer_user_id, backer_email, region_code, pledge_level_name, "is_late_pledge?", "add_on_lines?", expected_campaign_version]
    output: Pledge
    side_effects: ["compute pledge_total_cents via pledge_total_with_late_premium", "campaign.version += 1"]

  - method: GET
    path: "/pledges/{id}"
    description: "Get one pledge"
    roles: [CampaignOwner, Backer, FactoryCoordinator, FreightBroker, CustomsAgent, FulfillmentOperator, Distributor, LocalizationPartner, PlatformAdmin]
    code: 200
    input: []
    output: Pledge
    side_effects: []

  - method: GET
    path: "/pledges"
    description: "List pledges (filtered)"
    roles: [CampaignOwner, Backer, FactoryCoordinator, FreightBroker, CustomsAgent, FulfillmentOperator, Distributor, LocalizationPartner, PlatformAdmin]
    code: 200
    input: ["campaign_id?", "backer_user_id?", "charge_status?", "address_status?", "fulfillment_status?", "region_code?", "limit?", "offset?"]
    output: "Pledge[]"
    side_effects: []

  - method: POST
    path: "/pledges/{id}/transition"
    description: "Pledge state transitions across the three parallel dimensions"
    roles: [CampaignOwner, Backer, PlatformAdmin]
    code: 200
    input: [action, "payment_outcome?"]   # charge | charge-retry | refund | confirm-address | change-address
    output: Pledge
    side_effects: ["see state_machines.Pledge; charge/refund recompute campaign aggregates and may cascade stretch_goal_unlock"]

  # --- ManufacturingQuote ---
  - method: POST
    path: "/manufacturing-quotes"
    description: "Create a quote (status=PROVISIONAL); provisional variant computed at creation"
    roles: [FactoryCoordinator]
    code: 201
    input: [campaign_id, factory_name, tier_breaks]
    output: ManufacturingQuote
    side_effects: ["compute provisional_units and provisional_unit_price_cents (provisional variant)", "campaign.version += 1"]

  - method: GET
    path: "/manufacturing-quotes/{id}"
    description: "Get one quote"
    roles: [CampaignOwner, Backer, FactoryCoordinator, FreightBroker, CustomsAgent, FulfillmentOperator, Distributor, LocalizationPartner, PlatformAdmin]
    code: 200
    input: []
    output: ManufacturingQuote
    side_effects: []

  - method: GET
    path: "/manufacturing-quotes"
    description: "List quotes"
    roles: [CampaignOwner, Backer, FactoryCoordinator, FreightBroker, CustomsAgent, FulfillmentOperator, Distributor, LocalizationPartner, PlatformAdmin]
    code: 200
    input: ["campaign_id?", "status?", "limit?", "offset?"]
    output: "ManufacturingQuote[]"
    side_effects: []

  - method: POST
    path: "/manufacturing-quotes/{id}/transition"
    description: "Quote state transitions (cyclic revise allowed)"
    roles: [FactoryCoordinator]
    code: 200
    input: [action]   # submit | revise | finalize
    output: ManufacturingQuote
    side_effects: ["see state_machines.ManufacturingQuote"]

  # --- ProductionRun ---
  - method: POST
    path: "/production-runs"
    description: "Create a production run referencing a quote"
    roles: [FactoryCoordinator]
    code: 201
    input: [campaign_id, quote_id]
    output: ProductionRun
    side_effects: ["campaign.version += 1"]

  - method: GET
    path: "/production-runs/{id}"
    description: "Get one run"
    roles: [CampaignOwner, Backer, FactoryCoordinator, FreightBroker, CustomsAgent, FulfillmentOperator, Distributor, LocalizationPartner, PlatformAdmin]
    code: 200
    input: []
    output: ProductionRun
    side_effects: []

  - method: GET
    path: "/production-runs"
    description: "List runs"
    roles: [CampaignOwner, Backer, FactoryCoordinator, FreightBroker, CustomsAgent, FulfillmentOperator, Distributor, LocalizationPartner, PlatformAdmin]
    code: 200
    input: ["campaign_id?", "quote_id?", "status?", "limit?", "offset?"]
    output: "ProductionRun[]"
    side_effects: []

  - method: POST
    path: "/production-runs/{id}/transition"
    description: "Run state transitions"
    roles: [FactoryCoordinator]
    code: 200
    input: [action]   # lock | cancel
    output: ProductionRun
    side_effects: ["see state_machines.ProductionRun"]

  # --- FreightShipment ---
  - method: POST
    path: "/freight-shipments"
    description: "Book a freight shipment; with dry_run=true returns a cost preview per freight_consolidation_cost without persisting"
    roles: [FreightBroker]
    code: 201
    input: [production_run_id, region_code, container_count, declared_value_cents, departs_at, arrives_at, "dry_run?", "total_weight_kg?", "total_volume_m3?"]
    output: FreightShipment
    side_effects: ["if dry_run=true: no entity persisted, response carries cost_cents preview"]

  - method: GET
    path: "/freight-shipments/{id}"
    description: "Get one shipment"
    roles: [CampaignOwner, Backer, FactoryCoordinator, FreightBroker, CustomsAgent, FulfillmentOperator, Distributor, LocalizationPartner, PlatformAdmin]
    code: 200
    input: []
    output: FreightShipment
    side_effects: []

  - method: GET
    path: "/freight-shipments"
    description: "List shipments"
    roles: [CampaignOwner, Backer, FactoryCoordinator, FreightBroker, CustomsAgent, FulfillmentOperator, Distributor, LocalizationPartner, PlatformAdmin]
    code: 200
    input: ["production_run_id?", "region_code?", "status?", "limit?", "offset?"]
    output: "FreightShipment[]"
    side_effects: []

  - method: POST
    path: "/freight-shipments/{id}/transition"
    description: "Shipment state transitions (incl. cyclic rebook)"
    roles: [FreightBroker, CustomsAgent, FulfillmentOperator]
    code: 200
    input: [action, "departs_at?", "arrives_at?"]   # depart | arrive | assess-duty | pay-duty | rebook | deliver-to-warehouse
    output: FreightShipment
    side_effects: ["see state_machines.FreightShipment"]

  # --- Wave ---
  - method: POST
    path: "/waves"
    description: "Create a wave"
    roles: [FulfillmentOperator]
    code: 201
    input: [campaign_id, region_code, sequence_index, capacity, dispatch_window_start, dispatch_window_end, address_lock_at]
    output: Wave
    side_effects: ["campaign.version += 1"]

  - method: GET
    path: "/waves/{id}"
    description: "Get one wave (includes embedded assignments array)"
    roles: [CampaignOwner, Backer, FactoryCoordinator, FreightBroker, CustomsAgent, FulfillmentOperator, Distributor, LocalizationPartner, PlatformAdmin]
    code: 200
    input: []
    output: Wave
    side_effects: []

  - method: GET
    path: "/waves"
    description: "List waves"
    roles: [CampaignOwner, Backer, FactoryCoordinator, FreightBroker, CustomsAgent, FulfillmentOperator, Distributor, LocalizationPartner, PlatformAdmin]
    code: 200
    input: ["campaign_id?", "region_code?", "status?", "limit?", "offset?"]
    output: "Wave[]"
    side_effects: []

  - method: POST
    path: "/waves/{id}/transition"
    description: "Wave state transitions AND assignment operations (assign, auto_populate, reassign, remove, pick, ship, deliver). Assignment actions carry pledge_id; reassign carries target_wave_id; all assignment actions carry expected_campaign_version (OCC)."
    roles: [FulfillmentOperator]
    code: 200
    input: [action, "pledge_id?", "target_wave_id?", "expected_campaign_version?", "capacity?", "dispatch_window_start?", "dispatch_window_end?"]
      # open | rebalance | close | dispatch | cancel | assign | auto_populate | reassign | remove | pick | ship | deliver
    output: Wave
    side_effects: ["see state_machines.Wave and state_machines.Pledge fulfillment dimension"]

  # --- DistributorAllocation ---
  - method: POST
    path: "/distributor-allocations"
    description: "Reserve units for a distributor on a run"
    roles: [PlatformAdmin]
    code: 201
    input: [campaign_id, distributor_user_id, distributor_name, region_code, msrp_positioning_pct, allocation_priority, production_run_id, units_reserved]
    output: DistributorAllocation
    side_effects: ["validates distributor_allocation_cap", "campaign.version += 1"]

  - method: GET
    path: "/distributor-allocations/{id}"
    description: "Get one allocation"
    roles: [CampaignOwner, Backer, FactoryCoordinator, FreightBroker, CustomsAgent, FulfillmentOperator, Distributor, LocalizationPartner, PlatformAdmin]
    code: 200
    input: []
    output: DistributorAllocation
    side_effects: []

  - method: GET
    path: "/distributor-allocations"
    description: "List allocations"
    roles: [CampaignOwner, Backer, FactoryCoordinator, FreightBroker, CustomsAgent, FulfillmentOperator, Distributor, LocalizationPartner, PlatformAdmin]
    code: 200
    input: ["campaign_id?", "distributor_user_id?", "production_run_id?", "status?", "limit?", "offset?"]
    output: "DistributorAllocation[]"
    side_effects: []

  - method: POST
    path: "/distributor-allocations/{id}/transition"
    description: "Allocation state transitions"
    roles: [Distributor, FulfillmentOperator]
    code: 200
    input: [action]   # confirm | ship | release
    output: DistributorAllocation
