          - entities.ChangeRequest.fields.risk_class
          - state_machines.ChangeRequest.RISK_CLASSIFIED_to_APPROVED
          - validations[priority=27]
        distinguishing_aspect: |
          MEDIUM_CEILING 50 is inclusive on the lower side of HIGH: a change scoring exactly 50 is HIGH
          and therefore still needs a COMPLIANCE approval after TECHNICAL, while the same change with
          one fewer touched subsystem scores 46, is MEDIUM, and reaches APPROVED on TECHNICAL alone.
        test_recipe:
          setup:
            - "Release 2026.08.1 phase OPEN on core-train, clock 2026-08-01T00:00:00Z."
            - "CR_HI: lines_changed 100, touched_subsystem_count 5, has_schema_migration true, INTERNAL => 5 + 20 + 25 + 0 = 50."
            - "CR_MED: identical except touched_subsystem_count 4 => 5 + 16 + 25 + 0 = 46."
            - "Neither change declares a rollback plan or a flag link, so no credit applies to either score."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
            - call: "POST /release-trains"
              payload: { name: "core-train", cadence_days: 14, code_freeze_lead_hours: 48, stabilization_hours: 72, risk_budget_points: 120, max_concurrent_stabilizing: 1 }
