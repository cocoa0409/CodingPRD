      - name: wind_hold_release_inside_the_hysteresis_band_is_rejected_then_recovers_at_the_boundary
        claim_type: guarded_transitions
        grounds:
          - validations[priority=33]
          - errors[ERR_WIND_ABOVE_RELEASE_THRESHOLD]
          - state_machines.Lift.WIND_HOLD_to_OPEN
          - state_machines.TerrainArea.PATROL_HOLD_to_OPEN
        distinguishing_aspect: |
          Wind holds arm at wind > 40.0 but release only at wind <= 35.0, a 5 mph hysteresis band that
          exists so a gusting reading cannot flap the lift. The three triggers walk the band: 55.0 is
          far above, 36.0 is inside the band and must still be refused (the interesting boundary, since
          36.0 is already below the 40.0 arming threshold), and 35.0 exactly on the release limit must
          succeed. The successful release then re-gates the served terrain, returning the area to OPEN
          and the posture to PUBLISHED_FULL.
        test_recipe:
          setup:
            - "An open mountain; a 55.0 mph wind reading has put the lift on WIND_HOLD and the area on PATROL_HOLD."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
