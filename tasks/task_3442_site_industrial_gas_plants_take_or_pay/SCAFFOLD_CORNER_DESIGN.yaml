          assert:
            - "the response status is 409 and ${err_lk} == ERR_INVALID_STATE_TRANSITION"
            - "Delivery.${d_lk}.delivered_quantity_liters remains 30000"

      - name: turnaround_counter_cycles_proposal_round
        claim_type: Valid Transition
        grounds:
          - state_machines.Turnaround.PROPOSED_to_PROPOSED
        distinguishing_aspect: "COUNTER keeps the turnaround in PROPOSED (self-loop), replaces the window, bumps version and increments proposal_round to 2; a subsequent AGREE on the fresh version then succeeds."
        test_recipe:
          setup:
            - "K_FAB ACTIVE; P_FAB OPERATING; turnaround proposed [2026-11-01, 2026-11-05)."
          setup_api_calls:
            - *k_clock
            - *k_cust_fab
            - *k_eval_fab
            - *k_accept_fab
            - *k_contract_fab
            - *k_activate_fab
            - *k_plant_fab
            - *k_adv1
            - *k_adv2
            - *k_adv3
            - call: "POST /gas-supply/onsite-plants/${p_fab}/turnarounds"
              payload: { window_start: "2026-11-01T00:00:00Z", window_end: "2026-11-05T00:00:00Z", scope: "Initial window" }
              as: PlantOperator
              captures: { ta_cy: $.data.id, ta_cy_v: $.data.version }
          trigger:
            - call: "POST /gas-supply/turnarounds/${ta_cy}/respond"
              payload: { decision: "COUNTER", expected_turnaround_version: "${ta_cy_v}", counter_window_start: "2026-11-10T00:00:00Z", counter_window_end: "2026-11-14T00:00:00Z" }
              as: CustomerOps
              as_user_id: "${c_fab}"
              captures: { ta_cy_v2: $.data.version, ta_cy_round: $.data.proposal_round }
            - call: "POST /gas-supply/turnarounds/${ta_cy}/respond"
              payload: { decision: "AGREE", expected_turnaround_version: "${ta_cy_v2}" }
              as: CustomerOps
              as_user_id: "${c_fab}"
              captures: { ta_cy_st: $.data.status }
          assert:
            - "after COUNTER: status == PROPOSED, proposal_round == 2, window_start == \"2026-11-10T00:00:00Z\", version == ${ta_cy_v} + 1"
            - "after AGREE on the fresh version: status == AGREED"

      - name: turnaround_start_before_window_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Turnaround.SCHEDULED_to_IN_PROGRESS
          - errors[ERR_TURNAROUND_NOT_DUE]
        distinguishing_aspect: "Clock at 2026-10-09T23:59:59Z (one second before window_start) makes start fail 422 ERR_TURNAROUND_NOT_DUE; the turnaround stays SCHEDULED."
        test_recipe:
          setup:
            - "K_FAB ACTIVE; P_FAB OPERATING; turnaround [2026-10-10T00:00:00Z, 2026-10-14T00:00:00Z) AGREED then SCHEDULED; clock one second before window start."
          setup_api_calls:
            - *k_clock
            - *k_cust_fab
            - *k_eval_fab
            - *k_accept_fab
            - *k_contract_fab
            - *k_activate_fab
            - *k_plant_fab
            - *k_adv1
            - *k_adv2
            - *k_adv3
            - call: "POST /gas-supply/onsite-plants/${p_fab}/turnarounds"
              payload: { window_start: "2026-10-10T00:00:00Z", window_end: "2026-10-14T00:00:00Z", scope: "Early start check" }
              as: PlantOperator
              captures: { ta_nd: $.data.id, ta_nd_v: $.data.version }
            - call: "POST /gas-supply/turnarounds/${ta_nd}/respond"
              payload: { decision: "AGREE", expected_turnaround_version: "${ta_nd_v}" }
              as: CustomerOps
              as_user_id: "${c_fab}"
            - call: "POST /gas-supply/turnarounds/${ta_nd}/schedule"
              payload: {}
              as: PlantOperator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-09T23:59:59Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /gas-supply/turnarounds/${ta_nd}/start"
              payload: {}
              as: PlantOperator
              captures: { err_nd: $.data.error_id }
          assert:
            - "the response status is 422 and ${err_nd} == ERR_TURNAROUND_NOT_DUE"
            - "Turnaround.${ta_nd}.status remains SCHEDULED and OnsitePlant.${p_fab}.status remains OPERATING"

      - name: turnaround_auto_completes_at_window_end
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Turnaround.IN_PROGRESS_to_COMPLETED
          - state_machines.OnsitePlant.TURNAROUND_to_OPERATING
        distinguishing_aspect: "Setting the clock to exactly window_end completes the IN_PROGRESS turnaround, returns the plant to OPERATING with nameplate capacity, and clears contract failover_active."
        test_recipe:
          setup:
            - "Full failover state: turnaround [2026-10-10, 2026-10-14) IN_PROGRESS (plant TURNAROUND, failover_active true)."
          setup_api_calls:
            - *k_clock
            - *k_cust_fab
            - *k_eval_fab
            - *k_accept_fab
            - *k_contract_fab
            - *k_activate_fab
            - *k_plant_fab
            - *k_adv1
            - *k_adv2
            - *k_adv3
            - call: "POST /gas-supply/onsite-plants/${p_fab}/turnarounds"
              payload: { window_start: "2026-10-10T00:00:00Z", window_end: "2026-10-14T00:00:00Z", scope: "Completion check" }
              as: PlantOperator
              captures: { ta_cp: $.data.id, ta_cp_v: $.data.version }
            - call: "POST /gas-supply/turnarounds/${ta_cp}/respond"
              payload: { decision: "AGREE", expected_turnaround_version: "${ta_cp_v}" }
              as: CustomerOps
              as_user_id: "${c_fab}"
            - call: "POST /gas-supply/turnarounds/${ta_cp}/schedule"
              payload: {}
              as: PlantOperator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /gas-supply/turnarounds/${ta_cp}/start"
              payload: {}
              as: PlantOperator
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-14T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /gas-supply/onsite-plants/${p_fab}"
              payload: {}
              as: PlantOperator
              captures: { p_cp: $.data.status, p_cp_cap: $.data.effective_capacity_nm3h }
            - call: "GET /gas-supply/supply-contracts/${k_fab}"
