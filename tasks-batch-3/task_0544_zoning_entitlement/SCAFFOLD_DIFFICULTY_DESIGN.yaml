              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${app_id}/completeness"
              payload: { determination: "COMPLETE" }
              as: Planner
              as_user_id: "planner-1"
            - call: "POST /applications/${app_id}/notices"
              payload: { notice_kind: "MAILED" }
              as: Clerk
            - call: "POST /hearings"
              payload: { body: "PLANNING_COMMISSION", scheduled_date: "2026-06-11T00:00:00Z", agenda_capacity: 5 }
              as: Clerk
              captures: { hearing_id: $.data.id, h_v: $.data.version }
            - call: "POST /hearings/${hearing_id}/agenda-items"
              payload: { application_id: "${app_id}", expected_hearing_version: "${h_v}" }
              as: Clerk
              captures: { item_id: $.data.id }
            - call: "POST /agenda-items/${item_id}/decide"
              payload: { decision: "APPROVE", findings: [{ finding_code: "F-A", finding_text: "meets code", supports_approval: true }] }
              as: Commissioner
              as_user_id: "commish-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-17T00:00:00Z" }
              as: Admin
            - call: "POST /applications/${app_id}/effectuate"
              payload: {}
              as: Clerk
          trigger:
            - call: "POST /plats"
              payload: { application_id: "${app_id}", fee_schedule_id: "${fs_id}", declared_lot_count: 4, declared_gross_acres: 10, prior_paid_fee_cents: 300000 }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { plat_id: $.data.id }
            - call: "GET /plats/${plat_id}/impact-fee"
              as: Clerk
              captures: { fee_id: "$.data[0].id" }
          assert:
            - "ImpactFeeAssessment.${fee_id}.gross_fee_cents == 2152500"
            - "ImpactFeeAssessment.${fee_id}.credit_cents == 215250"
            - "ImpactFeeAssessment.${fee_id}.provisional_fee_cents == 1937250"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: application_completeness_revision_loop
        grounds:
          - state_machines.EntitlementApplication.SUBMITTED_to_INCOMPLETE
          - state_machines.EntitlementApplication.INCOMPLETE_to_SUBMITTED
          - entities.EntitlementApplication.fields.revision_count
        distinguishing_aspect: "Cycle on EntitlementApplication: SUBMITTED->INCOMPLETE->SUBMITTED returns to SUBMITTED with revision_count incremented to 1 (a true loop, not a linear pipeline)."
        test_recipe:
          setup:
            - "A VARIANCE application deemed INCOMPLETE with a deficiency note, awaiting resubmission."
          setup_api_calls:
            - call: "POST /parcels"
              payload: { apn: "APN-5", zoning_district: "RES", area_acres: 1, neighbor_parcel_count: 5, expanded_neighbor_count: 9, sensitive_area: false }
              as: Admin
              captures: { parcel_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Eve Own", email: "eve@x.com" }
              as: Admin
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: { application_type: "VARIANCE", parcel_id: "${parcel_id}", applicant_id: "${applicant_id}", requested_use: "setback variance" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${app_id}/completeness"
              payload: { determination: "INCOMPLETE", deficiency_notes: "Missing site plan" }
              as: Planner
              as_user_id: "planner-1"
          trigger:
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { st: $.data.status, rc: $.data.revision_count }
          assert:
            - "EntitlementApplication.${app_id}.status == SUBMITTED"
            - "EntitlementApplication.${app_id}.revision_count == 1"

      - name: appeal_fork_upheld_reverses_approval
        grounds:
          - state_machines.Appeal.FILED_to_UPHELD
          - state_machines.Appeal.FILED_to_DENIED
          - state_machines.EntitlementApplication.DECIDED_APPROVED_to_DENIED_ON_APPEAL
        distinguishing_aspect: "Branching fork on Appeal with divergent side-effect sets: UPHELD drives application to DENIED_ON_APPEAL and voids its conditions (vs DENIED/WITHDRAWN which leave the decision standing) — on the Appeal entity, distinct from the Application revision cycle."
        test_recipe:
          setup:
            - "A VARIANCE application DECIDED_APPROVED (decision_at 2026-06-01) with one ACTIVE condition, and an appeal FILED within the window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /parcels"
              payload: { apn: "APN-6", zoning_district: "COMM", area_acres: 2, neighbor_parcel_count: 7, expanded_neighbor_count: 12, sensitive_area: false }
              as: Admin
              captures: { parcel_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Finn Own", email: "finn@x.com" }
              as: Admin
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: { application_type: "VARIANCE", parcel_id: "${parcel_id}", applicant_id: "${applicant_id}", requested_use: "height variance" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${app_id}/completeness"
              payload: { determination: "COMPLETE" }
              as: Planner
              as_user_id: "planner-1"
            - call: "POST /applications/${app_id}/notices"
              payload: { notice_kind: "MAILED" }
              as: Clerk
            - call: "POST /hearings"
              payload: { body: "PLANNING_COMMISSION", scheduled_date: "2026-06-11T00:00:00Z", agenda_capacity: 5 }
              as: Clerk
              captures: { hearing_id: $.data.id, h_v: $.data.version }
            - call: "POST /hearings/${hearing_id}/agenda-items"
              payload: { application_id: "${app_id}", expected_hearing_version: "${h_v}" }
              as: Clerk
              captures: { item_id: $.data.id }
            - call: "POST /agenda-items/${item_id}/decide"
              payload: { decision: "APPROVE", findings: [{ finding_code: "F-A", finding_text: "hardship shown", supports_approval: true }], conditions: [{ condition_code: "COA-1", condition_text: "Install screening" }] }
              as: Commissioner
              as_user_id: "commish-1"
            - call: "POST /appeals"
              payload: { application_id: "${app_id}", appellant_name: "Neighbor", grounds: "spot zoning" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { appeal_id: $.data.id }
          trigger:
            - call: "POST /appeals/${appeal_id}/resolve"
              payload: { resolution: "UPHELD" }
              as: Clerk
              captures: { ast: $.data.status }
          assert:
            - "Appeal.${appeal_id}.status == UPHELD"
            - "EntitlementApplication.${app_id}.status == DENIED_ON_APPEAL"
            - "every ConditionOfApproval for application ${app_id} has status == VOIDED"
            - "Parcel.${parcel_id}.status == AVAILABLE"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: plat_record_cascade_fee_app_parcel
        grounds:
          - state_machines.Plat.PENDING_to_RECORDED
          - state_machines.ImpactFeeAssessment.PROVISIONAL_to_ASSESSED
          - state_machines.EntitlementApplication.EFFECTIVE_to_RECORDED
          - state_machines.Parcel.ENTITLED_to_SUBDIVIDED
        distinguishing_aspect: "Depth-4 cascade from plat recordation: record -> assessment ASSESSED -> (because ASSESSED) application RECORDED -> (because application RECORDED) parcel SUBDIVIDED, each link caused by the previous."
        test_recipe:
          setup:
            - "A SUBDIVISION application EFFECTIVE with a PENDING plat (declared 4 lots / 10 acres)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /parcels"
              payload: { apn: "APN-7", zoning_district: "RES", area_acres: 10, neighbor_parcel_count: 12, expanded_neighbor_count: 20, sensitive_area: false }
              as: Admin
              captures: { parcel_id: $.data.id }
            - call: "POST /fee-schedules"
              payload: { name: "FY26", park_fee_per_lot_cents: 250000, road_fee_tier1_per_acre_cents: 120000, road_fee_tier2_per_acre_cents: 90000, road_fee_tier3_per_acre_cents: 60000, admin_pct: 0.05, affordable_discount_pct: 0.20, credit_pct: 0.10, fee_cap_cents: 10000000 }
              as: Admin
              captures: { fs_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Gina Dev", email: "gina@x.com" }
              as: Admin
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: { application_type: "SUBDIVISION", parcel_id: "${parcel_id}", applicant_id: "${applicant_id}", requested_use: "subdivide" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
