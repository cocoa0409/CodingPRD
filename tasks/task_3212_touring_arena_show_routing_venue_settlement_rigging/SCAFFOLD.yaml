# =============================================================================
# Task 3212 — Touring Arena Show Routing, Venue Settlement & Rigging Logistics
# (Feld Entertainment)
# =============================================================================
scenario: |
  Touring Arena Show Routing, Venue Settlement & Rigging Logistics (Feld Entertainment): tour routing across arenas with market rotation and date avails negotiated against competing events, venue deals structured as rent versus percentage with settlement after each engagement, production logistics moving vehicles, animals, props and rigging with truck counts and load-in windows, rigging point verification against each arena's structural capacity with engineering review, local labor calls with union rules by market, ticket pricing and on-sale timing with family package offers and group sales, licensing arrangements for characters and properties with royalty obligations, insurance, permitting and safety inspections for stunts and equipment.

domain_name: touring-arena-shows
api_prefix: ""

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: approval_chain
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Tour
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Touring production name (e.g. 'Monster Spectacular 2027')" }
      - { name: status, type: enum, source: system, description: "PLANNING | ROUTING | ON_ROAD | WRAP | CLOSED", constraints: "Lifecycle enum" }
      - { name: home_base_city, type: string, source: input, description: "Tour origination city for routing math" }
      - { name: season_start_on, type: datetime, source: input, description: "First allowable performance date (ISO8601)" }
      - { name: season_end_on, type: datetime, source: input, description: "Last allowable performance date (ISO8601)" }
      - { name: market_cooldown_days, type: integer, source: input, default: 180, description: "Min days before the same venue may host this tour again (market rotation)" }
      - { name: royalty_reserve_pct, type: number, source: input, default: 0.0, description: "Percentage of gross ticket sales reserved against LicenseAgreement royalty obligations" }
      - { name: total_gross_cents, type: integer, source: computed, description: "Running sum of settled_engagement.gross_ticket_cents for CLOSED engagements on this tour" }
      - { name: total_settlement_due_cents, type: integer, source: computed, description: "Running sum of settlement_due_cents across the tour's SETTLED engagements" }
      - { name: open_engagement_count, type: integer, source: computed, description: "Count of Engagements on this tour in {HOLD, CONFIRMED, IN_LOAD, SHOW_READY, IN_PERFORMANCE}" }

  - name: Venue
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Arena display name" }
      - { name: market_code, type: string, source: input, description: "Metro market code (e.g. NYC, LA, DAL)" }
      - { name: capacity_seats, type: integer, source: input, description: "Sellable seat count (upper bound for ticket scaling)" }
      - { name: load_in_dock_doors, type: integer, source: input, description: "Simultaneous truck doors available at load-in" }
      - { name: union_rule_set, type: enum, source: input, description: "IATSE | TEAMSTERS | NON_UNION — drives labor-call minimums", constraints: "Closed enum" }
      - { name: standard_load_in_hours, type: integer, source: input, default: 8, description: "Default load-in window length in hours" }
      - { name: default_rent_cents, type: integer, source: input, description: "Flat rent quote used as the floor of the rent-vs-percentage venue deal" }
      - { name: percentage_share_pct, type: number, source: input, description: "Venue's percentage of net ticket revenue under a PERCENTAGE deal (0.0..0.5)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE — INACTIVE venues cannot accept new engagements", constraints: "Closed enum" }

  - name: RiggingPoint
    parent: Venue
    common_fields: true
    fields:
      - { name: venue_id, type: string, source: system, description: "FK -> Venue.id; owning arena" }
      - { name: label, type: string, source: input, description: "Point label (e.g. 'Grid A-3')" }
      - { name: zone, type: string, source: input, description: "Venue zone (GRID, SCOREBOARD, CATWALK)" }
      - { name: max_static_load_kg, type: integer, source: input, description: "Engineering limit for static loads" }
      - { name: max_dynamic_load_kg, type: integer, source: input, description: "Engineering limit for dynamic (stunt/moving) loads" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | OUT_OF_SERVICE", constraints: "Closed enum" }
      - { name: engineering_review_required, type: boolean, source: input, default: true, description: "Whether any allocation on this point requires RiggingPlan engineering sign-off" }

  - name: DateAvail
    parent: Venue
    common_fields: true
    fields:
      - { name: venue_id, type: string, source: system, description: "FK -> Venue.id; owning arena" }
      - { name: opens_at, type: datetime, source: input, description: "Start of available window (inclusive)" }
      - { name: closes_at, type: datetime, source: input, description: "End of available window (exclusive, half-open)" }
      - { name: status, type: enum, source: system, description: "OPEN | HELD | BOOKED | RELEASED", constraints: "Closed enum" }
      - { name: held_for_engagement_id, type: string, source: system, description: "FK -> Engagement.id; the engagement currently holding this avail; null when OPEN or RELEASED" }
      - { name: priority_rank, type: integer, source: input, default: 100, description: "Lower rank wins when two avails overlap in contention resolution" }

  - name: Engagement
    parent: Tour
    common_fields: true
    fields:
      - { name: tour_id, type: string, source: system, description: "FK -> Tour.id" }
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id" }
      - { name: date_avail_id, type: string, source: input, description: "FK -> DateAvail.id; the avail window this engagement occupies" }
      - { name: load_in_at, type: datetime, source: input, description: "Load-in start (must be within date-avail window, half-open)" }
      - { name: first_show_at, type: datetime, source: input, description: "Curtain time of first performance" }
      - { name: load_out_at, type: datetime, source: input, description: "Load-out completion (must be < closes_at)" }
      - { name: deal_type, type: enum, source: input, description: "FLAT_RENT | PERCENTAGE", constraints: "Closed enum" }
      - { name: agreed_rent_cents, type: integer, source: input, description: "FLAT_RENT contract rent; also used as the floor under a PERCENTAGE deal" }
      - { name: status, type: enum, source: system, description: "HOLD | CONFIRMED | IN_LOAD | SHOW_READY | IN_PERFORMANCE | SETTLED | CANCELLED", constraints: "Closed enum" }
      - { name: hold_expires_at, type: datetime, source: system, description: "Clock-driven expiry while HOLD; default clock start 2026-09-01T00:00:00Z plus HOLD_TTL_HOURS" }
      - { name: market_overlap_flag, type: boolean, source: computed, description: "True when a competing Engagement for the same Venue would violate Tour.market_cooldown_days" }

  - name: RiggingPlan
    parent: Engagement
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: system, description: "FK -> Engagement.id; owning engagement" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REJECTED | SUPERSEDED", constraints: "Closed enum; SUPERSEDED when a new plan replaces it" }
      - { name: revision_no, type: integer, source: system, description: "Starts at 1; increments on each resubmit-after-reject" }
      - { name: submitted_at, type: datetime, source: system, description: "Timestamp of last submission" }
      - { name: approved_by_user_id, type: string, source: system, description: "ProductionEngineer X-User-ID at APPROVED" }
      - { name: max_dynamic_point_load_kg, type: integer, source: computed, description: "Max over RiggingAllocation.dynamic_load_kg in this plan; used to gate high-risk engineering review" }
      - { name: aggregate_static_load_kg, type: integer, source: computed, description: "Sum of RiggingAllocation.static_load_kg across allocations in this plan" }
      - { name: high_risk_review_required, type: boolean, source: computed, description: "True if any allocation has dynamic_load_kg > HIGH_RISK_DYNAMIC_KG or if the plan touches a point whose engineering_review_required is true" }

  - name: RiggingAllocation
    parent: RiggingPlan
    common_fields: true
    fields:
      - { name: rigging_plan_id, type: string, source: system, description: "FK -> RiggingPlan.id" }
      - { name: rigging_point_id, type: string, source: input, description: "FK -> RiggingPoint.id" }
      - { name: static_load_kg, type: integer, source: input, description: "Static load requested against the point" }
      - { name: dynamic_load_kg, type: integer, source: input, default: 0, description: "Dynamic load requested (stunts, performer flight)" }
      - { name: purpose, type: string, source: input, description: "Free-form purpose label (e.g. 'aerial rig')" }

  - name: LaborCall
    parent: Engagement
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: system, description: "FK -> Engagement.id" }
      - { name: department, type: enum, source: input, description: "RIGGERS | LOADERS | WARDROBE | ANIMAL_HANDLERS | ELECTRICS", constraints: "Closed enum" }
      - { name: headcount, type: integer, source: input, description: "Crew size requested for this call" }
      - { name: call_start_at, type: datetime, source: input, description: "Call window start" }
      - { name: call_end_at, type: datetime, source: input, description: "Call window end" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Straight-time rate" }
      - { name: status, type: enum, source: system, description: "DRAFT | POSTED | FILLED | SETTLED | CANCELLED", constraints: "Closed enum" }
      - { name: effective_hours, type: number, source: computed, description: "Rounded-up billable hours after union rule_set minimums are applied" }
      - { name: union_minimum_hours, type: integer, source: computed, description: "Minimum billable hours imposed by Venue.union_rule_set for this department" }
      - { name: overtime_hours, type: number, source: computed, description: "Hours beyond UNION_OT_THRESHOLD_HOURS within the same calendar day" }
      - { name: estimated_cost_cents, type: integer, source: computed, description: "Provisional cost: straight-time + overtime premium; superseded by final_cost_cents at SETTLED" }
      - { name: final_cost_cents, type: integer, source: computed, description: "Settled cost after punch-audit adjustment" }

  - name: TruckMove
    parent: Engagement
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: system, description: "FK -> Engagement.id" }
      - { name: cargo_kind, type: enum, source: input, description: "VEHICLES | ANIMALS | PROPS | RIGGING | WARDROBE", constraints: "Closed enum" }
      - { name: truck_count, type: integer, source: input, description: "Number of trucks needed" }
      - { name: arrival_at, type: datetime, source: input, description: "Planned arrival at the venue dock" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | DISPATCHED | ARRIVED | CANCELLED", constraints: "Closed enum" }
      - { name: dock_doors_needed, type: integer, source: computed, description: "ceil(truck_count / TRUCKS_PER_DOOR) — constrained by Venue.load_in_dock_doors during the engagement's load-in window" }

  - name: TicketScale
    parent: Engagement
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: system, description: "FK -> Engagement.id" }
      - { name: tier_label, type: string, source: input, description: "e.g. 'PLATINUM', 'GOLD', 'SILVER', 'FAMILY4'" }
      - { name: base_price_cents, type: integer, source: input, description: "Single-ticket face price" }
      - { name: seats_allocated, type: integer, source: input, description: "Seats in this tier at this engagement" }
      - { name: seats_sold, type: integer, source: system, description: "Starts at 0; incremented by ticket-sale endpoints" }
      - { name: is_family_pack, type: boolean, source: input, default: false, description: "Family-4 bundle tier: base_price_cents is the price of a 4-seat bundle" }
      - { name: is_group_sales_only, type: boolean, source: input, default: false, description: "Tier sold only through the group-sales channel with a min quantity" }
      - { name: min_group_size, type: integer, source: input, default: 1, description: "Minimum seats per group-sales order" }
      - { name: on_sale_at, type: datetime, source: input, description: "When the tier becomes purchasable (drives on-sale timing rules)" }
      - { name: tier_rank, type: integer, source: input, description: "1 is highest-price tier; used for upgrade waterfall ordering" }

  - name: Settlement
    parent: Engagement
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: system, description: "FK -> Engagement.id (1:1)" }
      - { name: status, type: enum, source: system, description: "OPEN | RECONCILED | PAID | DISPUTED", constraints: "Closed enum" }
      - { name: gross_ticket_cents, type: integer, source: system, description: "Sum of ticket-sale revenue for the engagement at reconcile time" }
      - { name: venue_share_cents, type: integer, source: computed, description: "Venue's cut under the deal_type rules" }
      - { name: royalty_withheld_cents, type: integer, source: computed, description: "Amount withheld against LicenseAgreement royalty obligations" }
      - { name: labor_total_cents, type: integer, source: computed, description: "Sum of final_cost_cents across SETTLED LaborCalls" }
      - { name: promoter_net_cents, type: integer, source: computed, description: "gross - venue_share - royalty_withheld - labor_total" }
      - { name: reconciled_at, type: datetime, source: system, description: "Timestamp of reconcile" }

  - name: LicenseAgreement
    parent: Tour
    common_fields: true
    fields:
      - { name: tour_id, type: string, source: system, description: "FK -> Tour.id" }
      - { name: property_code, type: string, source: input, description: "Licensed property/character code" }
      - { name: licensor_name, type: string, source: input, description: "Licensor legal name" }
      - { name: royalty_pct, type: number, source: input, description: "Royalty percentage against gross ticket revenue" }
      - { name: minimum_guarantee_cents, type: integer, source: input, default: 0, description: "Advance guaranteed regardless of gross" }
      - { name: starts_on, type: datetime, source: input, description: "Effective window start" }
      - { name: ends_on, type: datetime, source: input, description: "Effective window end" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | EXPIRED | TERMINATED", constraints: "Closed enum" }

  - name: SafetyInspection
    parent: Engagement
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: system, description: "FK -> Engagement.id" }
      - { name: inspection_kind, type: enum, source: input, description: "RIGGING | PYRO | ANIMAL | VEHICLE_STUNT | ELECTRICAL", constraints: "Closed enum" }
      - { name: scheduled_at, type: datetime, source: input, description: "Planned inspection time; must be after load_in_at and before first_show_at" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | PASSED | FAILED | WAIVED", constraints: "Closed enum" }
      - { name: findings, type: string, source: input, description: "Free-form findings recorded at PASSED/FAILED" }
      - { name: waived_reason, type: string, source: input, description: "Required when status transitions to WAIVED" }
      - { name: permit_number, type: string, source: input, description: "Issuing authority permit reference (mandatory for PYRO, ANIMAL, VEHICLE_STUNT)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Tour
    initial_state: PLANNING
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNING
        to: ROUTING
        trigger: "POST /tours/{tourId}/open-routing"
        actor: TourManager
        preconditions:
          - "Tour.status == PLANNING (ERR_TOUR_NOT_IN_PLANNING)"
        side_effects: []

      - from: ROUTING
        to: ON_ROAD
        trigger: "system (automatic when the earliest CONFIRMED engagement's load_in_at passes the logical clock)"
        actor: system
        preconditions:
          - "At least one Engagement on the tour is CONFIRMED"
        side_effects: []

      - from: ON_ROAD
        to: WRAP
        trigger: "system (automatic when the last non-CANCELLED engagement reaches SETTLED)"
        actor: system
        preconditions:
          - "Every Engagement on the tour is in {SETTLED, CANCELLED}"
          - "At least one Engagement is SETTLED"
        side_effects:
          - "Tour.total_gross_cents recomputed from SETTLED engagements"
          - "Tour.total_settlement_due_cents recomputed"

      - from: WRAP
        to: CLOSED
        trigger: "POST /tours/{tourId}/close"
        actor: TourManager
        preconditions:
          - "Tour.status == WRAP (ERR_TOUR_NOT_READY_TO_CLOSE)"
          - "Every Settlement for engagements on this tour is in {RECONCILED, PAID}"
          - "Every LicenseAgreement on the tour is in {ACTIVE, EXPIRED, TERMINATED}"
        side_effects: []

  - entity: Venue
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /venues/{venueId}/deactivate"
        actor: PlatformAdmin
        preconditions:
          - "No Engagement on this venue in {HOLD, CONFIRMED, IN_LOAD, SHOW_READY, IN_PERFORMANCE} (ERR_VENUE_HAS_OPEN_ENGAGEMENTS)"
        side_effects:
          - "All OPEN DateAvails for the venue transition to RELEASED"

  - entity: DateAvail
    initial_state: OPEN
    terminal_states: [BOOKED, RELEASED]
    transitions:
      - from: OPEN
        to: HELD
        trigger: "system (on Engagement create targeting this avail)"
        actor: system
        preconditions:
          - "Avail status == OPEN"
          - "Engagement load_in_at >= opens_at AND load_out_at < closes_at (half-open containment)"
        side_effects:
          - "held_for_engagement_id := new Engagement.id"

      - from: HELD
        to: BOOKED
        trigger: "system (on Engagement HOLD → CONFIRMED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: HELD
        to: OPEN
        trigger: "system (on Engagement HOLD → CANCELLED, including hold-expiry auto-cancel)"
        actor: system
        preconditions: []
        side_effects:
          - "held_for_engagement_id := null"

      - from: OPEN
        to: RELEASED
        trigger: "POST /venues/{venueId}/date-avails/{availId}/release"
        actor: VenueBooker
        preconditions:
          - "Avail status == OPEN (ERR_AVAIL_NOT_OPEN)"
        side_effects: []

      - from: HELD
        to: RELEASED
        trigger: "POST /venues/{venueId}/date-avails/{availId}/release (force-release by VenueBooker while held)"
        actor: VenueBooker
        preconditions:
          - "Held Engagement is still in HOLD (never after CONFIRMED)"
        side_effects:
          - "Held Engagement cascades to CANCELLED with reason AVAIL_FORCE_RELEASED"
          - "held_for_engagement_id := null"

  - entity: Engagement
    initial_state: HOLD
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: HOLD
        to: CONFIRMED
        trigger: "POST /tours/{tourId}/engagements/{engagementId}/confirm"
        actor: TourManager
        preconditions:
          - "Engagement.status == HOLD (ERR_ENGAGEMENT_NOT_IN_HOLD)"
          - "Logical clock < hold_expires_at (ERR_HOLD_EXPIRED)"
          - "No market_overlap_flag (ERR_MARKET_COOLDOWN_VIOLATION)"
          - "Venue.status == ACTIVE (ERR_VENUE_INACTIVE)"
        side_effects:
          - "DateAvail HELD → BOOKED"
          - "Tour.open_engagement_count unchanged (HOLD already counted)"

      - from: HOLD
        to: CANCELLED
        trigger: "POST /tours/{tourId}/engagements/{engagementId}/cancel  OR system (clock passes hold_expires_at)"
        actor: "TourManager | system"
        preconditions: []
        side_effects:
          - "DateAvail HELD → OPEN"
          - "All RiggingPlans on this engagement in {DRAFT, SUBMITTED} → SUPERSEDED"
          - "All LaborCalls in {DRAFT, POSTED} → CANCELLED"
          - "All TruckMoves in {SCHEDULED, DISPATCHED} → CANCELLED"

      - from: CONFIRMED
        to: IN_LOAD
        trigger: "system (clock reaches load_in_at)"
        actor: system
        preconditions: []
        side_effects: []

      - from: IN_LOAD
        to: SHOW_READY
        trigger: "POST /tours/{tourId}/engagements/{engagementId}/mark-show-ready"
        actor: ProductionEngineer
        preconditions:
          - "Engagement.status == IN_LOAD"
          - "There exists a RiggingPlan in APPROVED status for this engagement (ERR_RIGGING_NOT_APPROVED)"
          - "Every SafetyInspection whose inspection_kind is required by the tour's act profile is in {PASSED, WAIVED} (ERR_INSPECTION_OUTSTANDING)"
        side_effects: []

      - from: SHOW_READY
        to: IN_PERFORMANCE
        trigger: "system (clock reaches first_show_at)"
        actor: system
        preconditions: []
        side_effects: []

      - from: IN_PERFORMANCE
        to: SETTLED
        trigger: "POST /tours/{tourId}/engagements/{engagementId}/settlement/reconcile"
        actor: TourManager
        preconditions:
          - "Engagement.status == IN_PERFORMANCE"
          - "Every LaborCall in {DRAFT, POSTED, FILLED} transitioned to SETTLED or CANCELLED (ERR_UNRESOLVED_LABOR_CALLS)"
        side_effects:
          - "Settlement created (1:1) in OPEN, gross_ticket_cents stamped from ticket sales"
          - "venue_share_cents computed per deal_type dual-variant (flat vs percentage)"
          - "royalty_withheld_cents computed from ACTIVE LicenseAgreements on the parent tour"
          - "labor_total_cents computed from SETTLED LaborCalls"
          - "promoter_net_cents derived"
          - "Settlement OPEN → RECONCILED in the same request"
          - "Tour.open_engagement_count decremented by 1"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /tours/{tourId}/engagements/{engagementId}/cancel"
        actor: TourManager
        preconditions:
          - "Logical clock < load_in_at (ERR_TOO_LATE_TO_CANCEL)"
        side_effects:
          - "DateAvail BOOKED → OPEN"
          - "All LaborCalls in {DRAFT, POSTED, FILLED} → CANCELLED with cancellation fee applied if FILLED"
          - "All TruckMoves in {SCHEDULED, DISPATCHED} → CANCELLED"
          - "RiggingPlans in any non-terminal status → SUPERSEDED"

  - entity: RiggingPlan
    initial_state: DRAFT
    terminal_states: [APPROVED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /tours/{tourId}/engagements/{engagementId}/rigging-plans/{planId}/submit"
        actor: ProductionEngineer
        preconditions:
          - "Plan.status == DRAFT"
          - "At least one RiggingAllocation exists for this plan (ERR_EMPTY_RIGGING_PLAN)"
        side_effects:
          - "submitted_at stamped from logical clock"
          - "high_risk_review_required recomputed"

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /tours/{tourId}/engagements/{engagementId}/rigging-plans/{planId}/approve"
        actor: ProductionEngineer
        preconditions:
          - "Plan.status == SUBMITTED (ERR_PLAN_NOT_SUBMITTED)"
          - "Every RiggingAllocation's rigging_point_id points to a RiggingPoint whose status is AVAILABLE"
          - "For every allocation: static_load_kg <= point.max_static_load_kg AND dynamic_load_kg <= point.max_dynamic_load_kg (ERR_POINT_CAPACITY_EXCEEDED)"
          - "If high_risk_review_required == true, the approver's X-User-ID MUST differ from the submitter's (segregation of duties, ERR_NEEDS_INDEPENDENT_REVIEW)"
        side_effects: []

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /tours/{tourId}/engagements/{engagementId}/rigging-plans/{planId}/reject"
        actor: ProductionEngineer
        preconditions:
          - "Plan.status == SUBMITTED"
        side_effects: []

      - from: REJECTED
        to: DRAFT
        trigger: "POST /tours/{tourId}/engagements/{engagementId}/rigging-plans/{planId}/revise"
        actor: ProductionEngineer
        preconditions:
          - "Plan.status == REJECTED"
        side_effects:
          - "revision_no += 1"

      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (when a new RiggingPlan is created for the same engagement while this one is DRAFT/SUBMITTED/REJECTED, or on engagement cancellation)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system (same as DRAFT → SUPERSEDED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: REJECTED
        to: SUPERSEDED
        trigger: "system (same as DRAFT → SUPERSEDED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: LaborCall
    initial_state: DRAFT
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: DRAFT
        to: POSTED
        trigger: "POST /tours/{tourId}/engagements/{engagementId}/labor-calls/{callId}/post"
        actor: LaborSteward
        preconditions:
          - "Call.status == DRAFT (ERR_LABOR_CALL_NOT_DRAFT)"
          - "Engagement.status ∈ {CONFIRMED, IN_LOAD} (ERR_ENGAGEMENT_NOT_LABOR_READY)"
        side_effects:
          - "union_minimum_hours, effective_hours, overtime_hours, estimated_cost_cents computed per Venue.union_rule_set"

      - from: POSTED
        to: FILLED
        trigger: "POST /tours/{tourId}/engagements/{engagementId}/labor-calls/{callId}/fill"
        actor: LaborSteward
        preconditions:
          - "Call.status == POSTED"
        side_effects: []

      - from: FILLED
        to: SETTLED
        trigger: "POST /tours/{tourId}/engagements/{engagementId}/labor-calls/{callId}/settle"
        actor: LaborSteward
        preconditions:
          - "Call.status == FILLED"
        side_effects:
          - "final_cost_cents computed via punch_audit (chronological variant)"
          - "estimated_cost_cents superseded; delta applied to Settlement.labor_total_cents if Settlement already exists"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /tours/{tourId}/engagements/{engagementId}/labor-calls/{callId}/cancel"
        actor: LaborSteward
        preconditions: []
        side_effects: []

      - from: POSTED
        to: CANCELLED
        trigger: "POST /tours/{tourId}/engagements/{engagementId}/labor-calls/{callId}/cancel"
        actor: LaborSteward
        preconditions: []
        side_effects: []

      - from: FILLED
        to: CANCELLED
        trigger: "POST /tours/{tourId}/engagements/{engagementId}/labor-calls/{callId}/cancel"
        actor: LaborSteward
        preconditions:
          - "Logical clock < call_start_at minus UNION_CANCEL_NOTICE_HOURS (ERR_LATE_LABOR_CANCEL)"
        side_effects:
          - "Cancellation fee = LATE_CANCEL_FEE_PCT × estimated_cost_cents applied against Settlement if any"

  - entity: TruckMove
    initial_state: SCHEDULED
    terminal_states: [ARRIVED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: DISPATCHED
        trigger: "POST /tours/{tourId}/engagements/{engagementId}/truck-moves/{moveId}/dispatch"
        actor: ProductionEngineer
        preconditions:
          - "Move.status == SCHEDULED"
          - "Engagement.status ∈ {CONFIRMED, IN_LOAD}"
          - "dock_doors_needed <= Venue.load_in_dock_doors (ERR_DOCK_CAPACITY_EXCEEDED)"
        side_effects: []

      - from: DISPATCHED
        to: ARRIVED
        trigger: "POST /tours/{tourId}/engagements/{engagementId}/truck-moves/{moveId}/mark-arrived"
        actor: ProductionEngineer
        preconditions:
          - "Move.status == DISPATCHED"
          - "Logical clock >= arrival_at minus TRUCK_ARRIVAL_GRACE_HOURS"
        side_effects: []

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /tours/{tourId}/engagements/{engagementId}/truck-moves/{moveId}/cancel"
        actor: ProductionEngineer
        preconditions: []
        side_effects: []

      - from: DISPATCHED
        to: CANCELLED
        trigger: "POST /tours/{tourId}/engagements/{engagementId}/truck-moves/{moveId}/cancel"
        actor: ProductionEngineer
        preconditions: []
        side_effects: []

  - entity: Settlement
    initial_state: OPEN
    terminal_states: [PAID]
    transitions:
      - from: OPEN
        to: RECONCILED
        trigger: "system (during POST /tours/{tourId}/engagements/{engagementId}/settlement/reconcile)"
        actor: system
        preconditions: []
        side_effects:
          - "All settlement computed fields populated"

      - from: RECONCILED
        to: PAID
        trigger: "POST /tours/{tourId}/engagements/{engagementId}/settlement/mark-paid"
        actor: TourManager
        preconditions:
          - "Settlement.status == RECONCILED (ERR_SETTLEMENT_NOT_RECONCILED)"
        side_effects: []

      - from: RECONCILED
        to: DISPUTED
        trigger: "POST /tours/{tourId}/engagements/{engagementId}/settlement/dispute"
        actor: VenueBooker
        preconditions:
          - "Settlement.status == RECONCILED"
        side_effects: []

      - from: DISPUTED
        to: RECONCILED
        trigger: "POST /tours/{tourId}/engagements/{engagementId}/settlement/resolve-dispute"
        actor: TourManager
        preconditions:
          - "Settlement.status == DISPUTED"
        side_effects:
          - "recompute venue_share_cents, royalty_withheld_cents, promoter_net_cents from current gross"

  - entity: LicenseAgreement
    initial_state: DRAFT
    terminal_states: [EXPIRED, TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /tours/{tourId}/license-agreements/{licId}/activate"
        actor: LicensingManager
        preconditions:
          - "LicenseAgreement.status == DRAFT (ERR_LICENSE_NOT_DRAFT)"
          - "Logical clock >= starts_on AND clock < ends_on"
        side_effects: []

      - from: ACTIVE
        to: EXPIRED
        trigger: "system (clock reaches ends_on)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /tours/{tourId}/license-agreements/{licId}/terminate"
        actor: LicensingManager
        preconditions: []
        side_effects:
          - "Future engagements on the tour stop accruing this royalty; SETTLED engagements unchanged"

  - entity: SafetyInspection
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED, WAIVED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /tours/{tourId}/engagements/{engagementId}/safety-inspections/{inspId}/pass"
        actor: ComplianceOfficer
        preconditions:
          - "Inspection.status == SCHEDULED"
          - "Logical clock >= scheduled_at"
          - "If inspection_kind ∈ {PYRO, ANIMAL, VEHICLE_STUNT}, permit_number must be present (ERR_PERMIT_MISSING)"
        side_effects: []

      - from: SCHEDULED
        to: FAILED
        trigger: "POST /tours/{tourId}/engagements/{engagementId}/safety-inspections/{inspId}/fail"
        actor: ComplianceOfficer
        preconditions:
          - "Inspection.status == SCHEDULED"
        side_effects:
          - "Engagement IN_LOAD/SHOW_READY → IN_LOAD (cannot be SHOW_READY with a FAILED inspection)"

      - from: SCHEDULED
        to: WAIVED
        trigger: "POST /tours/{tourId}/engagements/{engagementId}/safety-inspections/{inspId}/waive"
        actor: ComplianceOfficer
        preconditions:
          - "Inspection.status == SCHEDULED"
          - "waived_reason must be non-empty (ERR_WAIVE_REASON_REQUIRED)"
          - "inspection_kind MUST NOT be PYRO (ERR_PYRO_NOT_WAIVABLE)"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC-only)
# =============================================================================
concurrency_rules:
  - rule_id: engagement-create-stale-avail
    parent_entity: DateAvail
    write_endpoint: "POST /tours/{tourId}/engagements"
    occ_field: "expected_avail_version"
    description: |
      Creating an Engagement against a DateAvail whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just created an Engagement holding the same
      avail (which legitimately flips the avail to HELD), or released it;
      the current writer's view of the avail is therefore stale.
    error_id: ERR_STALE_AVAIL_VERSION
    http_status: 412

  - rule_id: settlement-mark-paid-stale-settlement
    parent_entity: Settlement
    write_endpoint: "POST /tours/{tourId}/engagements/{engagementId}/settlement/mark-paid"
    occ_field: "expected_settlement_version"
    description: |
      Marking a Settlement paid with a stale expected_settlement_version
      (e.g., a dispute-resolve cascade bumped the version between the
      client's read and this call) is rejected. The writer must re-read
      the Settlement and re-issue with the current version.
    error_id: ERR_STALE_SETTLEMENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: venue_share_settlement
    trigger: "Engagement IN_PERFORMANCE → SETTLED (settlement reconcile) AND Settlement DISPUTED → RECONCILED"
    algorithm: dual_variant_waterfall
    formula: |
      Inputs: engagement.deal_type, engagement.agreed_rent_cents,
              venue.percentage_share_pct, gross_ticket_cents G.
      Variant FLAT_RENT:
        venue_share_cents = agreed_rent_cents
      Variant PERCENTAGE (waterfall with floor):
        pct_share = round_half_up( G * venue.percentage_share_pct )
        venue_share_cents = max( agreed_rent_cents, pct_share )
        # agreed_rent_cents acts as the floor: the venue NEVER takes less than the
        # contracted rent, even when G * pct < rent.
      Rounding: round_half_up to integer cents AFTER the multiplication; do NOT round per line.
    input_set: "Gross ticket revenue for the engagement from ticket sales whose TicketScale.engagement_id == engagement.id AND sale recorded before reconcile time."
    constants:
      ROUND_MODE: "round_half_up"
    precision: "integer cents"
    variants:
      - name: flat_rent
        when: "deal_type == FLAT_RENT"
        difference: "Ignores gross; venue_share = agreed_rent_cents regardless of ticket sales."
      - name: percentage
        when: "deal_type == PERCENTAGE"
        difference: "max(agreed_rent_cents, round_half_up(G * pct)); floor applies even on zero-sales engagements."

  - name: royalty_withheld
    trigger: "Same as venue_share_settlement"
    algorithm: aggregation
    formula: |
      Inputs: Set A = LicenseAgreements on the parent tour with
              status == ACTIVE AND starts_on <= reconcile_clock AND reconcile_clock < ends_on.
      If A is empty, royalty_withheld_cents = 0.
      Otherwise:
        pct_part = sum over a in A of round_half_up(G * a.royalty_pct)
        prorate_count = count of engagements on the parent tour with status IN {CONFIRMED, IN_LOAD, SHOW_READY, IN_PERFORMANCE, SETTLED} at reconcile time
        guarantee_part = sum over a in A of round_half_up(a.minimum_guarantee_cents / prorate_count)
        uncapped = max(pct_part, guarantee_part)
        If tour.royalty_reserve_pct > 0:
          royalty_withheld_cents = min( uncapped, round_half_up(G * tour.royalty_reserve_pct) )
        Else:
          royalty_withheld_cents = uncapped
      # Rounding: per-agreement percentages rounded individually; the guarantee divide
      # rounded once; the cap rounded once. Three rounding events, in this order.
    input_set: "LicenseAgreement rows for the parent tour in ACTIVE status within the engagement window."
    constants:
      ROUND_MODE: "round_half_up"
    precision: "integer cents"

  - name: promoter_net_settlement
    trigger: "Same as venue_share_settlement"
    algorithm: waterfall_allocation
    formula: |
      promoter_net_cents = gross_ticket_cents
                         - venue_share_cents
                         - royalty_withheld_cents
                         - labor_total_cents
      # Floor: promoter_net_cents may go NEGATIVE (loss-making engagement).
      # No clamping to zero.
    input_set: "Output of venue_share_settlement, royalty_withheld, and sum of LaborCall.final_cost_cents for calls in SETTLED status."
    constants: {}
    precision: "integer cents"

  - name: labor_call_cost_estimate
    trigger: "LaborCall DRAFT → POSTED"
    algorithm: forward_looking
    formula: |
      Constants by Venue.union_rule_set:
        IATSE:      minimum_hours = 4, ot_threshold = 8, ot_multiplier = 1.5
        TEAMSTERS:  minimum_hours = 5, ot_threshold = 10, ot_multiplier = 1.5
        NON_UNION:  minimum_hours = 1, ot_threshold = 8, ot_multiplier = 1.25
      raw_hours = (call_end_at - call_start_at) in hours (round half up to 0.5-hour increments)
      effective_hours = max(raw_hours, minimum_hours)
      straight_hours = min(effective_hours, ot_threshold)
      overtime_hours = max(0, effective_hours - ot_threshold)
      estimated_cost_cents = round_half_up(headcount * hourly_rate_cents * (straight_hours + overtime_hours * ot_multiplier))
      Rounding order: hours rounded FIRST (to 0.5), the multiplier applied, then the
      final round_half_up to integer cents — headcount is integer and multiplies last.
    input_set: "Single LaborCall; Venue.union_rule_set looked up through engagement."
    constants:
      ROUND_HOURS_STEP: 0.5
    precision: "integer cents"
    variants:
      - name: iatse
        when: "union_rule_set == IATSE"
        difference: "4-hour minimum, OT starts after 8h at 1.5x"
      - name: teamsters
        when: "union_rule_set == TEAMSTERS"
        difference: "5-hour minimum, OT starts after 10h at 1.5x"
      - name: non_union
        when: "union_rule_set == NON_UNION"
        difference: "1-hour minimum, OT starts after 8h at 1.25x"

  - name: labor_call_final_cost
    trigger: "LaborCall FILLED → SETTLED"
    algorithm: chronological
    formula: |
      Inputs: punch_records (array of {punch_in_at, punch_out_at}) for the call,
              sorted by punch_in_at ASC, tie-break by created_at ASC.
      For each punch pair: duration_hours = (punch_out_at - punch_in_at)/3600, rounded to nearest 0.5
      Apply the same minimum-hours / OT-threshold / OT-multiplier rules per Venue.union_rule_set,
      but computed PER WORKER (one pair per worker) rather than per call.
      final_cost_cents = sum over workers of round_half_up((worker_straight + worker_ot * ot_mult) * hourly_rate_cents)
      Difference vs estimate: estimate is per-call; final is per-worker.
      The two numbers legitimately diverge (e.g., one worker leaves early, another stays late).
    input_set: "Punch records for the LaborCall in chronological order."
    constants: {}
    precision: "integer cents"

  - name: truck_dock_doors
    trigger: "TruckMove create"
    algorithm: threshold
    formula: |
      dock_doors_needed = ceil(truck_count / TRUCKS_PER_DOOR)
      # TRUCKS_PER_DOOR = 2: each dock door processes 2 trucks in a load-in window.
      # Boundary precision: truck_count == Venue.load_in_dock_doors * 2 fits exactly.
      # truck_count == load_in_dock_doors * 2 + 1 exceeds by one truck and is rejected at dispatch.
    input_set: "Single TruckMove."
    constants:
      TRUCKS_PER_DOOR: 2
    precision: "integer doors"

  - name: rigging_capacity_check
    trigger: "RiggingPlan SUBMITTED → APPROVED"
    algorithm: aggregation
    formula: |
      For each RiggingAllocation a in the plan:
        lookup point p = a.rigging_point_id
        if p.status != AVAILABLE: reject ERR_POINT_OUT_OF_SERVICE
        if a.static_load_kg > p.max_static_load_kg: reject ERR_POINT_CAPACITY_EXCEEDED (boundary: equal is OK, > rejects)
        if a.dynamic_load_kg > p.max_dynamic_load_kg: reject ERR_POINT_CAPACITY_EXCEEDED
      Two allocations to the SAME point in the same plan: their loads SUM
      against the point's capacity. Boundary: sum == capacity is allowed; sum > capacity rejects.
    input_set: "All RiggingAllocations of the plan; group by rigging_point_id."
    constants: {}
    precision: "integer kg"

  - name: market_cooldown_check
    trigger: "Engagement HOLD → CONFIRMED"
    algorithm: interval_merge
    formula: |
      For the candidate Engagement e on Venue v at first_show_at f:
      Find all sibling engagements e' on the same tour, same venue, e' != e,
      e'.status IN {CONFIRMED, IN_LOAD, SHOW_READY, IN_PERFORMANCE, SETTLED}.
      For each e': gap_days = floor(|f - e'.first_show_at| / 86400)
      if gap_days < tour.market_cooldown_days: e.market_overlap_flag = true, reject with ERR_MARKET_COOLDOWN_VIOLATION
      Boundary: gap_days == market_cooldown_days is ALLOWED (>= semantics); < rejects.
    input_set: "Same-tour, same-venue engagements in non-terminal states."
    constants: {}
    precision: "integer days, floor"

  - name: family_pack_pricing
    trigger: "TicketScale pricing at sale"
    algorithm: tiered_pricing
    formula: |
      Family-pack tier: base_price_cents is the price of a bundle of 4 seats.
      A group-sales order for N seats at a family-pack tier with is_family_pack=true:
        bundle_count = floor(N / 4)
        loose_seats = N - bundle_count * 4
        per_loose_seat_price = round_half_up(base_price_cents / 4)
        total_cents = bundle_count * base_price_cents + loose_seats * per_loose_seat_price
      # Rounding order matters: divide per-seat FIRST (round_half_up), then multiply.
      # This is NOT equivalent to round_half_up(base_price * N / 4) for odd N.
      Boundary: N < min_group_size rejects with ERR_GROUP_MIN_NOT_MET (>= semantics on min_group_size).
    input_set: "Single TicketScale + group order size N."
    constants:
      FAMILY_PACK_SIZE: 4
    precision: "integer cents"

  - name: hold_ttl_expiry
    trigger: "system clock tick AND any read of an Engagement in HOLD"
    algorithm: threshold
    formula: |
      hold_expires_at = engagement.created_at + HOLD_TTL_HOURS
      On read or any write attempt: if logical_clock >= hold_expires_at AND engagement.status == HOLD:
        auto-transition to CANCELLED (side effects as HOLD → CANCELLED)
      Boundary: clock == hold_expires_at triggers expiry (>= semantics).
    input_set: "Single Engagement in HOLD."
    constants:
      HOLD_TTL_HOURS: 72
    precision: "ISO8601 timestamp"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per RBAC matrix"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path-templated resources exist (tour, engagement, plan, call, move, scale, license, inspection) — left-to-right in path"
    error_id: "ERR_TOUR_NOT_FOUND | ERR_VENUE_NOT_FOUND | ERR_ENGAGEMENT_NOT_FOUND | ERR_AVAIL_NOT_FOUND | ERR_PLAN_NOT_FOUND | ERR_LABOR_CALL_NOT_FOUND | ERR_TRUCK_MOVE_NOT_FOUND | ERR_TICKET_SCALE_NOT_FOUND | ERR_LICENSE_NOT_FOUND | ERR_INSPECTION_NOT_FOUND | ERR_SETTLEMENT_NOT_FOUND | ERR_POINT_NOT_FOUND"
    http_status: 404
    applies_to: all nested endpoints

  - priority: 4
    category: existence
    check: "Body-referenced FK ids exist (venue_id, date_avail_id, rigging_point_id, engagement_id for body-supplied refs)"
    error_id: "ERR_VENUE_NOT_FOUND | ERR_AVAIL_NOT_FOUND | ERR_POINT_NOT_FOUND | ERR_ENGAGEMENT_NOT_FOUND"
    http_status: 404
    applies_to: "Endpoints with body-supplied FK references"

  - priority: 5
    category: state
    check: "Target resource is in the correct state for the operation (state-machine precondition)"
    error_id: "ERR_INVALID_STATE (or specific: ERR_TOUR_NOT_IN_PLANNING, ERR_ENGAGEMENT_NOT_IN_HOLD, ERR_PLAN_NOT_SUBMITTED, ERR_LABOR_CALL_NOT_DRAFT, ERR_AVAIL_NOT_OPEN, ERR_SETTLEMENT_NOT_RECONCILED, ERR_LICENSE_NOT_DRAFT, ERR_VENUE_INACTIVE, ERR_CONTRACT_NOT_ACTIVE)"
    http_status: 409
    applies_to: state transition endpoints

  - priority: 6
    category: business_temporal
    check: "Hold TTL: HOLD engagement action must execute before hold_expires_at"
    error_id: ERR_HOLD_EXPIRED
    http_status: 409
    applies_to: "POST /tours/{tourId}/engagements/{engagementId}/confirm"

  - priority: 7
    category: business_temporal
    check: "Engagement load_in_at/load_out_at fit half-open inside the DateAvail window: load_in_at >= opens_at AND load_out_at < closes_at"
    error_id: ERR_ENGAGEMENT_WINDOW_OUT_OF_AVAIL
    http_status: 422
    applies_to: "POST /tours/{tourId}/engagements"

  - priority: 8
    category: business_temporal
    check: "Engagement times internally consistent: load_in_at < first_show_at < load_out_at"
    error_id: ERR_INVALID_ENGAGEMENT_TIMES
    http_status: 400
    applies_to: "POST /tours/{tourId}/engagements"

  - priority: 9
    category: business_temporal
    check: "SafetyInspection.scheduled_at must be after engagement.load_in_at AND before engagement.first_show_at"
    error_id: ERR_INSPECTION_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /tours/{tourId}/engagements/{engagementId}/safety-inspections"

  - priority: 10
    category: business_temporal
    check: "DateAvail window validity: opens_at < closes_at"
    error_id: ERR_INVALID_AVAIL_WINDOW
    http_status: 400
    applies_to: "POST /venues/{venueId}/date-avails"

  - priority: 11
    category: business_temporal
    check: "DateAvail overlap: half-open interval collision with any non-RELEASED DateAvail on the same venue; adjacency (opens_at == another.closes_at) is ALLOWED"
    error_id: ERR_AVAIL_OVERLAP
    http_status: 409
    applies_to: "POST /venues/{venueId}/date-avails"

  - priority: 12
    category: business_temporal
    check: "Market cooldown: same-tour same-venue gap >= tour.market_cooldown_days"
    error_id: ERR_MARKET_COOLDOWN_VIOLATION
    http_status: 409
    applies_to: "POST /tours/{tourId}/engagements/{engagementId}/confirm"

  - priority: 13
    category: business_safety
    check: "Rigging plan approval: every point AVAILABLE; static and dynamic loads within capacity (sum across allocations to same point)"
    error_id: "ERR_POINT_CAPACITY_EXCEEDED | ERR_POINT_OUT_OF_SERVICE"
    http_status: 422
    applies_to: "POST .../rigging-plans/{planId}/approve"

  - priority: 14
    category: business_safety
    check: "Rigging plan approval: high-risk plans require independent approver (different X-User-ID from submitter)"
    error_id: ERR_NEEDS_INDEPENDENT_REVIEW
    http_status: 403
    applies_to: "POST .../rigging-plans/{planId}/approve"

  - priority: 15
    category: business_safety
    check: "Show-ready gate: an APPROVED RiggingPlan must exist AND every SafetyInspection in {PASSED, WAIVED}"
    error_id: "ERR_RIGGING_NOT_APPROVED | ERR_INSPECTION_OUTSTANDING"
    http_status: 409
    applies_to: "POST .../engagements/{engagementId}/mark-show-ready"

  - priority: 16
    category: business_safety
    check: "SafetyInspection pass requires permit_number when inspection_kind IN {PYRO, ANIMAL, VEHICLE_STUNT}; PYRO may not be WAIVED"
    error_id: "ERR_PERMIT_MISSING | ERR_PYRO_NOT_WAIVABLE"
    http_status: 422
    applies_to: "POST .../safety-inspections/{inspId}/pass, POST .../safety-inspections/{inspId}/waive"

  - priority: 17
    category: business_constraint
    check: "Truck dock capacity: dock_doors_needed <= Venue.load_in_dock_doors at dispatch"
    error_id: ERR_DOCK_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST .../truck-moves/{moveId}/dispatch"

  - priority: 18
    category: business_constraint
    check: "Ticket sale: tier seat availability AND (if is_group_sales_only) quantity >= min_group_size AND clock >= on_sale_at"
    error_id: "ERR_INSUFFICIENT_SEATS | ERR_GROUP_MIN_NOT_MET | ERR_NOT_ON_SALE_YET"
    http_status: 409
    applies_to: "POST .../engagements/{engagementId}/ticket-sales"

  - priority: 19
    category: business_constraint
    check: "LaborCall FILLED cancellation: must cancel at least UNION_CANCEL_NOTICE_HOURS before call_start_at"
    error_id: ERR_LATE_LABOR_CANCEL
    http_status: 409
    applies_to: "POST .../labor-calls/{callId}/cancel"

  - priority: 20
    category: business_referential
    check: "Venue deactivation: no open engagements on the venue"
    error_id: ERR_VENUE_HAS_OPEN_ENGAGEMENTS
    http_status: 409
    applies_to: "POST /venues/{venueId}/deactivate"

  - priority: 21
    category: business_referential
    check: "Tour close: every Settlement RECONCILED or PAID; every LicenseAgreement ACTIVE/EXPIRED/TERMINATED"
    error_id: ERR_TOUR_NOT_READY_TO_CLOSE
    http_status: 409
    applies_to: "POST /tours/{tourId}/close"

  - priority: 22
    category: business_fiscal
    check: "Engagement reconcile: every LaborCall must be in SETTLED or CANCELLED before settlement"
    error_id: ERR_UNRESOLVED_LABOR_CALLS
    http_status: 409
    applies_to: "POST .../engagements/{engagementId}/settlement/reconcile"

  - priority: 23
    category: business_fiscal
    check: "Settlement mark-paid and ticket-sale creation: OCC expected_*_version matches server-side version"
    error_id: "ERR_STALE_AVAIL_VERSION | ERR_STALE_SETTLEMENT_VERSION"
    http_status: 412
    applies_to: "POST /tours/{tourId}/engagements, POST .../settlement/mark-paid"

  - priority: 24
    category: business_constraint
    check: "Required-field presence and basic shape on every input field"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Tour ---
  - method: POST
    path: "/tours"
    description: "Create a Tour"
    roles: [TourManager]
    code: 201
    input: [name, home_base_city, season_start_on, season_end_on, "market_cooldown_days?", "royalty_reserve_pct?"]
    output: Tour
    side_effects: ["status=PLANNING; total_gross_cents=0; total_settlement_due_cents=0; open_engagement_count=0"]

  - method: GET
    path: "/tours"
    description: "List Tours"
    roles: [TourManager, VenueBooker, ProductionEngineer, LaborSteward, BoxOfficeManager, LicensingManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Tour[]"
    side_effects: []

  - method: GET
    path: "/tours/{tourId}"
    description: "Get a Tour"
    roles: [TourManager, VenueBooker, ProductionEngineer, LaborSteward, BoxOfficeManager, LicensingManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Tour
    side_effects: []

  - method: POST
    path: "/tours/{tourId}/open-routing"
    description: "Advance Tour PLANNING → ROUTING"
    roles: [TourManager]
    code: 200
    input: []
    output: Tour
    side_effects: ["status → ROUTING; version += 1"]

  - method: POST
    path: "/tours/{tourId}/close"
    description: "Advance Tour WRAP → CLOSED (precondition: all settlements reconciled/paid)"
    roles: [TourManager]
    code: 200
    input: []
    output: Tour
    side_effects: ["status → CLOSED; version += 1"]

  # --- Venue ---
  - method: POST
    path: "/venues"
    description: "Register a Venue"
    roles: [VenueBooker, PlatformAdmin]
    code: 201
    input: [name, market_code, capacity_seats, load_in_dock_doors, union_rule_set, default_rent_cents, percentage_share_pct, "standard_load_in_hours?"]
    output: Venue
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/venues"
    description: "List Venues"
    roles: [TourManager, VenueBooker, ProductionEngineer, LaborSteward, BoxOfficeManager, LicensingManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "status?", "market_code?"]
    output: "Venue[]"
    side_effects: []

  - method: GET
    path: "/venues/{venueId}"
    description: "Get a Venue"
    roles: [TourManager, VenueBooker, ProductionEngineer, LaborSteward, BoxOfficeManager, LicensingManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Venue
    side_effects: []

  - method: POST
    path: "/venues/{venueId}/deactivate"
    description: "Deactivate a Venue (fails if open engagements exist)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Venue
    side_effects: ["status → INACTIVE; OPEN DateAvails → RELEASED; version += 1"]

  # --- RiggingPoint ---
  - method: POST
    path: "/venues/{venueId}/rigging-points"
    description: "Declare a RiggingPoint on a Venue"
    roles: [VenueBooker, PlatformAdmin]
    code: 201
    input: [label, zone, max_static_load_kg, max_dynamic_load_kg, "engineering_review_required?"]
    output: RiggingPoint
    side_effects: ["status=AVAILABLE"]

  - method: GET
    path: "/venues/{venueId}/rigging-points"
    description: "List RiggingPoints on a Venue"
    roles: [TourManager, VenueBooker, ProductionEngineer, LaborSteward, BoxOfficeManager, LicensingManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "RiggingPoint[]"
    side_effects: []

  - method: GET
    path: "/venues/{venueId}/rigging-points/{pointId}"
    description: "Get a RiggingPoint"
    roles: [TourManager, VenueBooker, ProductionEngineer, LaborSteward, BoxOfficeManager, LicensingManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: RiggingPoint
    side_effects: []

  - method: POST
    path: "/venues/{venueId}/rigging-points/{pointId}/mark-out-of-service"
    description: "Mark a RiggingPoint OUT_OF_SERVICE"
    roles: [PlatformAdmin, ProductionEngineer]
    code: 200
    input: []
    output: RiggingPoint
    side_effects: ["status → OUT_OF_SERVICE; version += 1"]

  # --- DateAvail ---
  - method: POST
    path: "/venues/{venueId}/date-avails"
    description: "Declare a DateAvail window on a Venue"
    roles: [VenueBooker]
    code: 201
    input: [opens_at, closes_at, "priority_rank?"]
    output: DateAvail
    side_effects: ["status=OPEN; held_for_engagement_id=null"]

  - method: GET
    path: "/venues/{venueId}/date-avails"
    description: "List DateAvails for a Venue"
    roles: [TourManager, VenueBooker, ProductionEngineer, LaborSteward, BoxOfficeManager, LicensingManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "DateAvail[]"
    side_effects: []

  - method: GET
    path: "/venues/{venueId}/date-avails/{availId}"
    description: "Get a DateAvail"
    roles: [TourManager, VenueBooker, ProductionEngineer, LaborSteward, BoxOfficeManager, LicensingManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: DateAvail
    side_effects: []

  - method: POST
    path: "/venues/{venueId}/date-avails/{availId}/release"
    description: "Release a DateAvail (force-releases HELD avails; cascades engagement cancellation)"
    roles: [VenueBooker]
    code: 200
    input: []
    output: DateAvail
    side_effects: ["status → RELEASED; held engagement → CANCELLED if still HOLD; version += 1"]

  # --- Engagement ---
  - method: POST
    path: "/tours/{tourId}/engagements"
    description: "Create an Engagement in HOLD on a specific DateAvail"
    roles: [TourManager]
    code: 201
    input: [venue_id, date_avail_id, load_in_at, first_show_at, load_out_at, deal_type, agreed_rent_cents, expected_avail_version]
    output: Engagement
    side_effects: ["status=HOLD; DateAvail OPEN → HELD with held_for_engagement_id=this.id; Tour.open_engagement_count += 1; hold_expires_at = created_at + 72h; increments DateAvail.version by 1"]

  - method: GET
    path: "/tours/{tourId}/engagements"
    description: "List Engagements for a Tour"
    roles: [TourManager, VenueBooker, ProductionEngineer, LaborSteward, BoxOfficeManager, LicensingManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "status?", "venue_id?"]
    output: "Engagement[]"
    side_effects: []

  - method: GET
    path: "/tours/{tourId}/engagements/{engagementId}"
    description: "Get an Engagement"
    roles: [TourManager, VenueBooker, ProductionEngineer, LaborSteward, BoxOfficeManager, LicensingManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Engagement
    side_effects: ["Hold TTL check: if status==HOLD AND clock >= hold_expires_at, auto-cancel"]

  - method: POST
    path: "/tours/{tourId}/engagements/{engagementId}/confirm"
    description: "Confirm a held Engagement"
    roles: [TourManager]
    code: 200
    input: []
    output: Engagement
    side_effects: ["status → CONFIRMED; DateAvail HELD → BOOKED; market_cooldown_check; version += 1"]

  - method: POST
    path: "/tours/{tourId}/engagements/{engagementId}/cancel"
    description: "Cancel an Engagement (allowed while HOLD or CONFIRMED with clock < load_in_at)"
    roles: [TourManager]
    code: 200
    input: []
    output: Engagement
    side_effects: ["status → CANCELLED; DateAvail → OPEN; child LaborCalls/TruckMoves CANCELLED; RiggingPlans SUPERSEDED; version += 1"]

  - method: POST
    path: "/tours/{tourId}/engagements/{engagementId}/mark-show-ready"
    description: "Advance Engagement IN_LOAD → SHOW_READY (gated on APPROVED rigging plan + inspections passed)"
    roles: [ProductionEngineer]
    code: 200
    input: []
    output: Engagement
    side_effects: ["status → SHOW_READY; version += 1"]

  # --- RiggingPlan ---
  - method: POST
    path: "/tours/{tourId}/engagements/{engagementId}/rigging-plans"
    description: "Create a new RiggingPlan DRAFT (supersedes prior non-terminal plans)"
    roles: [ProductionEngineer]
    code: 201
    input: []
    output: RiggingPlan
    side_effects: ["status=DRAFT; revision_no=1; prior plans in {DRAFT, SUBMITTED, REJECTED} → SUPERSEDED"]

  - method: GET
    path: "/tours/{tourId}/engagements/{engagementId}/rigging-plans"
    description: "List RiggingPlans"
    roles: [TourManager, VenueBooker, ProductionEngineer, LaborSteward, BoxOfficeManager, LicensingManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "RiggingPlan[]"
    side_effects: []

  - method: GET
    path: "/tours/{tourId}/engagements/{engagementId}/rigging-plans/{planId}"
    description: "Get a RiggingPlan"
    roles: [TourManager, VenueBooker, ProductionEngineer, LaborSteward, BoxOfficeManager, LicensingManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: RiggingPlan
    side_effects: []

  - method: POST
    path: "/tours/{tourId}/engagements/{engagementId}/rigging-plans/{planId}/submit"
    description: "Submit a DRAFT plan"
    roles: [ProductionEngineer]
    code: 200
    input: []
    output: RiggingPlan
    side_effects: ["status → SUBMITTED; submitted_at stamped; high_risk_review_required recomputed; version += 1"]

  - method: POST
    path: "/tours/{tourId}/engagements/{engagementId}/rigging-plans/{planId}/approve"
    description: "Approve a SUBMITTED plan (engineering review)"
    roles: [ProductionEngineer]
    code: 200
    input: []
    output: RiggingPlan
    side_effects: ["status → APPROVED; capacity checks; segregation-of-duties check; version += 1"]

  - method: POST
    path: "/tours/{tourId}/engagements/{engagementId}/rigging-plans/{planId}/reject"
    description: "Reject a SUBMITTED plan"
    roles: [ProductionEngineer]
    code: 200
    input: []
    output: RiggingPlan
    side_effects: ["status → REJECTED; version += 1"]

  - method: POST
    path: "/tours/{tourId}/engagements/{engagementId}/rigging-plans/{planId}/revise"
    description: "Revise a REJECTED plan back to DRAFT"
    roles: [ProductionEngineer]
    code: 200
    input: []
    output: RiggingPlan
    side_effects: ["status → DRAFT; revision_no += 1; version += 1"]

  # --- RiggingAllocation ---
  - method: POST
    path: "/tours/{tourId}/engagements/{engagementId}/rigging-plans/{planId}/allocations"
    description: "Add a RiggingAllocation to a DRAFT plan"
    roles: [ProductionEngineer]
    code: 201
    input: [rigging_point_id, static_load_kg, "dynamic_load_kg?", purpose]
    output: RiggingAllocation
    side_effects: ["Plan's aggregate_static_load_kg, max_dynamic_point_load_kg recomputed; plan.version += 1"]

  - method: GET
    path: "/tours/{tourId}/engagements/{engagementId}/rigging-plans/{planId}/allocations"
    description: "List RiggingAllocations for a plan"
    roles: [TourManager, VenueBooker, ProductionEngineer, LaborSteward, BoxOfficeManager, LicensingManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "RiggingAllocation[]"
    side_effects: []

  # --- LaborCall ---
  - method: POST
    path: "/tours/{tourId}/engagements/{engagementId}/labor-calls"
    description: "Create a LaborCall DRAFT"
    roles: [LaborSteward]
    code: 201
    input: [department, headcount, call_start_at, call_end_at, hourly_rate_cents]
    output: LaborCall
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/tours/{tourId}/engagements/{engagementId}/labor-calls"
    description: "List LaborCalls for an engagement"
    roles: [TourManager, VenueBooker, ProductionEngineer, LaborSteward, BoxOfficeManager, LicensingManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "status?", "department?"]
    output: "LaborCall[]"
    side_effects: []

  - method: GET
    path: "/tours/{tourId}/engagements/{engagementId}/labor-calls/{callId}"
    description: "Get a LaborCall"
    roles: [TourManager, VenueBooker, ProductionEngineer, LaborSteward, BoxOfficeManager, LicensingManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: LaborCall
    side_effects: []

  - method: POST
    path: "/tours/{tourId}/engagements/{engagementId}/labor-calls/{callId}/post"
    description: "Post a LaborCall (computes estimate via union rules)"
    roles: [LaborSteward]
    code: 200
    input: []
    output: LaborCall
    side_effects: ["status → POSTED; union_minimum_hours, effective_hours, overtime_hours, estimated_cost_cents computed; version += 1"]

  - method: POST
    path: "/tours/{tourId}/engagements/{engagementId}/labor-calls/{callId}/fill"
    description: "Mark a LaborCall FILLED"
    roles: [LaborSteward]
    code: 200
    input: []
    output: LaborCall
    side_effects: ["status → FILLED; version += 1"]

  - method: POST
    path: "/tours/{tourId}/engagements/{engagementId}/labor-calls/{callId}/settle"
    description: "Settle a LaborCall with punch records (chronological variant)"
    roles: [LaborSteward]
    code: 200
    input: [punch_records]
    output: LaborCall
    side_effects: ["status → SETTLED; final_cost_cents computed per-worker chronological; version += 1"]

  - method: POST
    path: "/tours/{tourId}/engagements/{engagementId}/labor-calls/{callId}/cancel"
    description: "Cancel a LaborCall"
    roles: [LaborSteward]
    code: 200
    input: []
    output: LaborCall
    side_effects: ["status → CANCELLED; late-cancel fee if FILLED within notice window; version += 1"]

  # --- TruckMove ---
  - method: POST
    path: "/tours/{tourId}/engagements/{engagementId}/truck-moves"
    description: "Schedule a TruckMove"
    roles: [ProductionEngineer]
    code: 201
    input: [cargo_kind, truck_count, arrival_at]
    output: TruckMove
    side_effects: ["status=SCHEDULED; dock_doors_needed computed"]

  - method: GET
    path: "/tours/{tourId}/engagements/{engagementId}/truck-moves"
    description: "List TruckMoves"
    roles: [TourManager, VenueBooker, ProductionEngineer, LaborSteward, BoxOfficeManager, LicensingManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "status?", "cargo_kind?"]
    output: "TruckMove[]"
    side_effects: []

  - method: GET
    path: "/tours/{tourId}/engagements/{engagementId}/truck-moves/{moveId}"
    description: "Get a TruckMove"
    roles: [TourManager, VenueBooker, ProductionEngineer, LaborSteward, BoxOfficeManager, LicensingManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: TruckMove
    side_effects: []

  - method: POST
    path: "/tours/{tourId}/engagements/{engagementId}/truck-moves/{moveId}/dispatch"
    description: "Dispatch a TruckMove (validates dock capacity)"
    roles: [ProductionEngineer]
    code: 200
    input: []
    output: TruckMove
    side_effects: ["status → DISPATCHED; version += 1"]

  - method: POST
    path: "/tours/{tourId}/engagements/{engagementId}/truck-moves/{moveId}/mark-arrived"
    description: "Mark a TruckMove ARRIVED"
    roles: [ProductionEngineer]
    code: 200
    input: []
    output: TruckMove
    side_effects: ["status → ARRIVED; version += 1"]

  - method: POST
    path: "/tours/{tourId}/engagements/{engagementId}/truck-moves/{moveId}/cancel"
    description: "Cancel a TruckMove"
    roles: [ProductionEngineer]
    code: 200
    input: []
    output: TruckMove
    side_effects: ["status → CANCELLED; version += 1"]

  # --- TicketScale ---
  - method: POST
    path: "/tours/{tourId}/engagements/{engagementId}/ticket-scales"
    description: "Create a TicketScale tier"
    roles: [BoxOfficeManager]
    code: 201
    input: [tier_label, base_price_cents, seats_allocated, tier_rank, on_sale_at, "is_family_pack?", "is_group_sales_only?", "min_group_size?"]
    output: TicketScale
    side_effects: ["seats_sold=0"]

  - method: GET
    path: "/tours/{tourId}/engagements/{engagementId}/ticket-scales"
    description: "List TicketScales"
    roles: [TourManager, VenueBooker, ProductionEngineer, LaborSteward, BoxOfficeManager, LicensingManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "TicketScale[]"
    side_effects: []

  - method: GET
    path: "/tours/{tourId}/engagements/{engagementId}/ticket-scales/{scaleId}"
    description: "Get a TicketScale"
    roles: [TourManager, VenueBooker, ProductionEngineer, LaborSteward, BoxOfficeManager, LicensingManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: TicketScale
    side_effects: []

  - method: POST
    path: "/tours/{tourId}/engagements/{engagementId}/ticket-sales"
    description: "Record a ticket sale against a TicketScale (handles family-pack pricing + group-sales min)"
    roles: [BoxOfficeManager]
    code: 201
    input: [ticket_scale_id, quantity]
    output: "{ sale_id: string, total_cents: integer, ticket_scale_id: string, quantity: integer }"
    side_effects: ["TicketScale.seats_sold += quantity; computes total per family_pack_pricing if is_family_pack; gross fed into Settlement at reconcile"]

  # --- Settlement ---
  - method: GET
    path: "/tours/{tourId}/engagements/{engagementId}/settlement"
    description: "Get the Settlement (1:1) for an Engagement"
    roles: [TourManager, VenueBooker, BoxOfficeManager, PlatformAdmin]
    code: 200
    input: []
    output: Settlement
    side_effects: []

  - method: POST
    path: "/tours/{tourId}/engagements/{engagementId}/settlement/reconcile"
    description: "Reconcile the engagement; creates Settlement if absent, populates computed fields, transitions IN_PERFORMANCE → SETTLED and Settlement OPEN → RECONCILED"
    roles: [TourManager]
    code: 200
    input: []
    output: Settlement
    side_effects: ["Engagement IN_PERFORMANCE → SETTLED; Settlement OPEN → RECONCILED; venue_share_settlement, royalty_withheld, promoter_net_settlement all computed; Tour.total_gross_cents and total_settlement_due_cents incremented; version += 1 on both"]

  - method: POST
    path: "/tours/{tourId}/engagements/{engagementId}/settlement/mark-paid"
    description: "Mark a RECONCILED Settlement PAID"
    roles: [TourManager]
    code: 200
    input: [expected_settlement_version]
    output: Settlement
    side_effects: ["status → PAID; increments Settlement.version by 1"]

  - method: POST
    path: "/tours/{tourId}/engagements/{engagementId}/settlement/dispute"
    description: "Open a dispute on a RECONCILED Settlement"
    roles: [VenueBooker]
    code: 200
    input: []
    output: Settlement
    side_effects: ["status → DISPUTED; version += 1"]

  - method: POST
    path: "/tours/{tourId}/engagements/{engagementId}/settlement/resolve-dispute"
    description: "Resolve a DISPUTED Settlement; recomputes venue_share/royalty/net"
    roles: [TourManager]
    code: 200
    input: []
    output: Settlement
    side_effects: ["status → RECONCILED; recomputed; version += 1"]

  # --- LicenseAgreement ---
  - method: POST
    path: "/tours/{tourId}/license-agreements"
    description: "Create a LicenseAgreement DRAFT"
    roles: [LicensingManager]
    code: 201
    input: [property_code, licensor_name, royalty_pct, starts_on, ends_on, "minimum_guarantee_cents?"]
    output: LicenseAgreement
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/tours/{tourId}/license-agreements"
    description: "List LicenseAgreements"
    roles: [TourManager, VenueBooker, ProductionEngineer, LaborSteward, BoxOfficeManager, LicensingManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "LicenseAgreement[]"
    side_effects: []

  - method: GET
    path: "/tours/{tourId}/license-agreements/{licId}"
    description: "Get a LicenseAgreement"
    roles: [TourManager, VenueBooker, ProductionEngineer, LaborSteward, BoxOfficeManager, LicensingManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: LicenseAgreement
    side_effects: []

  - method: POST
    path: "/tours/{tourId}/license-agreements/{licId}/activate"
    description: "Activate a DRAFT LicenseAgreement"
    roles: [LicensingManager]
    code: 200
    input: []
    output: LicenseAgreement
    side_effects: ["status → ACTIVE; version += 1"]

  - method: POST
    path: "/tours/{tourId}/license-agreements/{licId}/terminate"
    description: "Terminate an ACTIVE LicenseAgreement"
    roles: [LicensingManager]
    code: 200
    input: []
    output: LicenseAgreement
    side_effects: ["status → TERMINATED; future engagements stop accruing this royalty; version += 1"]

  # --- SafetyInspection ---
  - method: POST
    path: "/tours/{tourId}/engagements/{engagementId}/safety-inspections"
    description: "Schedule a SafetyInspection"
    roles: [ComplianceOfficer]
    code: 201
    input: [inspection_kind, scheduled_at, "permit_number?"]
    output: SafetyInspection
    side_effects: ["status=SCHEDULED"]

  - method: GET
    path: "/tours/{tourId}/engagements/{engagementId}/safety-inspections"
    description: "List SafetyInspections"
    roles: [TourManager, VenueBooker, ProductionEngineer, LaborSteward, BoxOfficeManager, LicensingManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "status?", "inspection_kind?"]
    output: "SafetyInspection[]"
    side_effects: []

  - method: GET
    path: "/tours/{tourId}/engagements/{engagementId}/safety-inspections/{inspId}"
    description: "Get a SafetyInspection"
    roles: [TourManager, VenueBooker, ProductionEngineer, LaborSteward, BoxOfficeManager, LicensingManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: SafetyInspection
    side_effects: []

  - method: POST
    path: "/tours/{tourId}/engagements/{engagementId}/safety-inspections/{inspId}/pass"
    description: "Pass a SafetyInspection"
    roles: [ComplianceOfficer]
    code: 200
    input: [findings, "permit_number?"]
    output: SafetyInspection
    side_effects: ["status → PASSED; version += 1"]

  - method: POST
    path: "/tours/{tourId}/engagements/{engagementId}/safety-inspections/{inspId}/fail"
    description: "Fail a SafetyInspection"
    roles: [ComplianceOfficer]
    code: 200
    input: [findings]
    output: SafetyInspection
    side_effects: ["status → FAILED; Engagement SHOW_READY → IN_LOAD if applicable; version += 1"]

  - method: POST
    path: "/tours/{tourId}/engagements/{engagementId}/safety-inspections/{inspId}/waive"
    description: "Waive a SafetyInspection (never PYRO)"
    roles: [ComplianceOfficer]
    code: 200
    input: [waived_reason]
    output: SafetyInspection
    side_effects: ["status → WAIVED; version += 1"]

  # --- Test-driving endpoints ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Default before any set call: 2026-09-01T00:00:00Z. The logical clock drives hold TTL expiry, on-sale timing, license window activation/expiry, inspection window gating, and scheduled state transitions. After set, automatic system transitions (HOLD→CANCELLED on TTL expiry, CONFIRMED→IN_LOAD on load_in_at, SHOW_READY→IN_PERFORMANCE on first_show_at, ACTIVE→EXPIRED on license end) fire on the next read or write against the affected entity."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced; on-read/on-write state-machine ticks fire"]

  # --- Flat read aliases (FK reverse-reachability) ---
  # Each child entity exposes a top-level single-resource GET (which establishes
