              as: Metrologist
            - call: "POST /metrology/customers"
              payload: { name: "Cal Cust 10", tier: GENERAL, credit_limit_cents: 1000000 }
              as: ProgramAdmin
              captures: { c_cal10: $.data.id }
            - call: "POST /metrology/calibration-orders"
              payload: { service_id: "${svc10}", artifact_description: "artifact A", measurement_points: 1 }
              as: Customer
              as_user_id: "${c_cal10}"
              captures: { cal_a: $.data.id }
            - call: "POST /metrology/calibration-orders/${cal_a}/transitions"
              payload: { to: SCHEDULED, scheduled_start: "2026-10-05T09:00:00Z", scheduled_end: "2026-10-05T11:00:00Z" }
              as: CalibrationCoordinator
            - call: "POST /metrology/calibration-orders"
              payload: { service_id: "${svc10}", artifact_description: "artifact B", measurement_points: 1 }
              as: Customer
              as_user_id: "${c_cal10}"
              captures: { cal_b: $.data.id }
          trigger:
            - call: "POST /metrology/calibration-orders/${cal_b}/transitions"
              payload: { to: SCHEDULED, scheduled_start: "2026-10-05T10:30:00Z", scheduled_end: "2026-10-08T12:00:00Z" }
              as: CalibrationCoordinator
              captures: { dual_err2: $.data.error_id }
          assert:
            - "dual_err2 == ERR_TRACEABILITY_CHAIN_BROKEN (safety p8.5 wins over temporal p10.5; end 2026-10-08T12:00 > due 2026-10-06T00:00 AND window overlaps order A)"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: homogeneity_f_ratio_exactly_critical
        grounds:
          - calculations.homogeneity_assessment
          - entities.MaterialLot.fields.homogeneity_verdict
        distinguishing_aspect: |
          Metric F-ratio at the exact boundary: f_ratio == F_CRITICAL (3.0)
          passes (<= semantics) while 3.5625 fails — reachable only through
          POST /metrology/material-lots/{id}/transitions.
        test_recipe:
          setup:
            - "program P; lots L1 and L2 in SOURCING, total 20 each"
          setup_api_calls:
            - call: "POST /metrology/programs"
              payload: { program_code: "NIST-RM-11", name: "RM Program 11", material_unit_price_cents: 1000, discount_pct_federal: 0, discount_pct_accredited_lab: 10, discount_pct_general: 0, handling_fee_threshold_cents: 10000, handling_fee_flat_cents: 500, expedite_multiplier_pct: 150, daily_lab_capacity_minutes: 480 }
              as: ProgramAdmin
              captures: { prog11: $.data.id }
            - call: "POST /metrology/material-lots"
              payload: { program_id: "${prog11}", material_code: "SRM-J1", matrix_description: "mJ1", total_units_produced: 20 }
              as: ProgramAdmin
              captures: { lot_j1: $.data.id }
            - call: "POST /metrology/material-lots"
              payload: { program_id: "${prog11}", material_code: "SRM-J2", matrix_description: "mJ2", total_units_produced: 20 }
              as: ProgramAdmin
              captures: { lot_j2: $.data.id }
          trigger:
            - call: "POST /metrology/material-lots/${lot_j1}/transitions"
              payload: { to: HOMOGENEITY_TESTING, bottle_means: [7.0, 7.0, 13.0, 13.0], within_bottle_std: 2.0, replicates_per_bottle: 2 }
              as: Metrologist
              captures: { j1_f: $.data.homogeneity_f_ratio, j1_verdict: $.data.homogeneity_verdict, j1_status: $.data.status, j1_uhom: $.data.homogeneity_u_hom }
            - call: "POST /metrology/material-lots/${lot_j2}/transitions"
              payload: { to: HOMOGENEITY_TESTING, bottle_means: [7.0, 7.0, 13.0, 14.0], within_bottle_std: 2.0, replicates_per_bottle: 2 }
              as: Metrologist
              captures: { j2_f: $.data.homogeneity_f_ratio, j2_verdict: $.data.homogeneity_verdict, j2_status: $.data.status }
          assert:
            - "j1_f == 3.0 and j1_verdict == PASS and j1_status == VALUE_ASSIGNMENT (f == 3.0 passes: <=)"
            - "j1_uhom == 3.162278"
            - "j2_f == 3.5625 and j2_verdict == FAIL and j2_status == HOMOGENEITY_TESTING"

      - name: order_quantity_exactly_empties_lot
        grounds:
          - calculations.shortage_allocation
          - entities.MaterialLot.fields.units_available
          - state_machines.MaterialLot.IN_DISTRIBUTION_to_DEPLETED
        distinguishing_aspect: |
          Metric unit-count at the exact-empty boundary: quantity == units_available
          allocates fully (min semantics, not min-1), leaving units_available == 0
          with the lot still IN_DISTRIBUTION until the explicit DEPLETED transition —
          reachable through POST /metrology/sales-orders, a different endpoint and
          metric than the F-ratio boundary.
        test_recipe:
          setup:
            - "program P; lot L total 8 (qc 4 -> usable 4) in IN_DISTRIBUTION; customer C"
          setup_api_calls:
            - call: "POST /metrology/programs"
              payload: { program_code: "NIST-RM-12", name: "RM Program 12", material_unit_price_cents: 1000, discount_pct_federal: 0, discount_pct_accredited_lab: 10, discount_pct_general: 0, handling_fee_threshold_cents: 10000, handling_fee_flat_cents: 500, expedite_multiplier_pct: 150, daily_lab_capacity_minutes: 480 }
              as: ProgramAdmin
              captures: { prog12: $.data.id }
            - call: "POST /metrology/customers"
              payload: { name: "C12", tier: GENERAL, credit_limit_cents: 1000000 }
              as: ProgramAdmin
              captures: { c_12: $.data.id }
            - call: "POST /metrology/material-lots"
              payload: { program_id: "${prog12}", material_code: "SRM-K", matrix_description: "mK", total_units_produced: 8 }
              as: ProgramAdmin
              captures: { lot_k: $.data.id }
            - call: "POST /metrology/material-lots/${lot_k}/transitions"
              payload: { to: HOMOGENEITY_TESTING, bottle_means: [10.0, 10.0, 10.0, 10.0], within_bottle_std: 0.5, replicates_per_bottle: 2 }
              as: Metrologist
              captures: { lot_k_v: $.data.version }
            - call: "POST /metrology/value-assignment-methods"
              payload: { lot_id: "${lot_k}", method_code: "ID-ICP-MS", method_mean: 100.0, method_std_uncertainty: 2.0 }
              as: Metrologist
              as_user_id: met-1
              captures: { m_k1: $.data.id }
            - call: "POST /metrology/value-assignment-methods"
              payload: { lot_id: "${lot_k}", method_code: "GRAV", method_mean: 104.0, method_std_uncertainty: 1.0 }
              as: Metrologist
              as_user_id: met-2
              captures: { m_k2: $.data.id }
            - call: "POST /metrology/value-assignment-methods/${m_k1}/transitions"
              payload: { to: ACCEPTED }
              as: CertificationOfficer
              as_user_id: co-1
            - call: "POST /metrology/value-assignment-methods/${m_k2}/transitions"
              payload: { to: ACCEPTED }
              as: CertificationOfficer
              as_user_id: co-1
            - call: "POST /metrology/certificates"
              payload: { lot_id: "${lot_k}", certificate_code: "CERT-K", value_assignment_variant: WEIGHTED_MEAN, uncertainty_components: [], validity_days: 365, expected_lot_version: "${lot_k_v}" }
              as: CertificationOfficer
              as_user_id: co-1
              captures: { cert_k: $.data.id }
            - call: "POST /metrology/certificates/${cert_k}/transitions"
              payload: { to: PUBLISHED }
              as: CertificationOfficer
              as_user_id: co-2
            - call: "POST /metrology/material-lots/${lot_k}/transitions"
              payload: { to: IN_DISTRIBUTION }
              as: InventoryManager
          trigger:
            - call: "POST /metrology/sales-orders"
              payload: { lot_id: "${lot_k}", quantity: 4 }
              as: Customer
              as_user_id: "${c_12}"
              captures: { o_k1: $.data.id, o_k1_status: $.data.status, o_k1_alloc: $.data.allocated_quantity }
            - call: "GET /metrology/material-lots/${lot_k}"
              as: InventoryManager
              captures: { k_avail: $.data.units_available, k_status_after: $.data.status }
            - call: "POST /metrology/sales-orders"
              payload: { lot_id: "${lot_k}", quantity: 1 }
              as: Customer
              as_user_id: "${c_12}"
              captures: { o_k2_status: $.data.status, o_k2_alloc: $.data.allocated_quantity }
            - call: "POST /metrology/material-lots/${lot_k}/transitions"
              payload: { to: DEPLETED }
              as: InventoryManager
              captures: { k_final_status: $.data.status }
          assert:
            - "o_k1_status == ALLOCATED and o_k1_alloc == 4 (quantity == units_available succeeds fully)"
            - "k_avail == 0 and k_status_after == IN_DISTRIBUTION (no implicit depletion)"
            - "o_k2_status == BACKORDERED and o_k2_alloc == 0 (zero-quantity edge: order accepted, nothing allocated)"
            - "k_final_status == DEPLETED"

