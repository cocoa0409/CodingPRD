# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Nine §0.5 rules x 2 instances = 18 instances.
scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: asam_placement_total_vs_single_dimension_floor
    grounds:
    - calculations.asam_level_placement
    - entities.ClinicalAssessment.fields.placement_basis
    - entities.ClinicalAssessment.fields.total_score
    - entities.ClinicalAssessment.fields.recommended_level
    - state_machines.TreatmentEpisode.clinical_status.UNDER_ASSESSMENT_to_AWAITING_AUTHORIZATION
    distinguishing_aspect: One set of six ASAM dimension scores total_score == 15 scores places the patient
      at ASAM_2_1 under the dimension_sum_placement variant (15 < 18) but at ASAM_3_1 under the highest_dimension_floor
      variant (emotional_behavioral == 4 supplies an ASAM_2_1 floor and relapse_potential == 3 supplies
      an ASAM_3_1 floor), so the two variants of one placement rule disagree by one full level on identical
      inputs and the ClinicalAssessment domain is where that happens.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z.
      - A licensed MN facility whose STATE_LICENSE permits ASAM_3_5 and whose state credential floor is
        TIER_3_LICENSED.
      - Dr. Lindqvist (TIER_4_INDEPENDENT, medical provider) holds an ACTIVE facility credential.
      - An episode in AWAITING_ASSESSMENT carrying an IN_PROGRESS assessment with dimension_scores withdrawal_risk
        0, biomedical_conditions 0, emotional_behavioral 4, readiness_to_change 0, relapse_potential 3,
        recovery_environment 0.
      setup_api_calls:
      - call: POST /treatment-network/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /treatment-network/facilities
        payload:
          name: Cascade Ridge Recovery Center
          state_code: MN
        as: PlatformAdmin
        captures:
          mew_fac: $.data.id
      - call: POST /treatment-network/clinicians
        payload:
          full_name: Dr. Astrid Lindqvist
          credential_tier: TIER_4_INDEPENDENT
          is_medical_provider: true
        as: PlatformAdmin
        captures:
          mew_clin_A: $.data.id
      - call: POST /treatment-network/facilities/${mew_fac}/beds
        payload:
          unit_name: North Wing
          bed_label: MN-B-01
          level_of_care: ASAM_3_5
          cleaning_turnaround_hours: 24
        as: PlatformAdmin
        captures:
          mew_bed_35: $.data.id
      - call: POST /treatment-network/facilities/${mew_fac}/beds
        payload:
          unit_name: North Wing
          bed_label: MN-B-02
          level_of_care: ASAM_3_1
          cleaning_turnaround_hours: 48
        as: PlatformAdmin
        captures:
          mew_bed_31: $.data.id
      - call: POST /treatment-network/facilities/${mew_fac}/beds
        payload:
          unit_name: North Wing
          bed_label: MN-B-03
          level_of_care: ASAM_2_1
          cleaning_turnaround_hours: 0
        as: PlatformAdmin
        captures:
          mew_bed_21: $.data.id
      - call: POST /treatment-network/facilities/${mew_fac}/service-offerings
        payload:
          service_code: RES_GROUP
          level_of_care: ASAM_3_5
          required_min_credential_tier: TIER_3_LICENSED
          requires_medical_provider: false
        as: PlatformAdmin
        captures:
          mew_svc_g: $.data.id
      - call: POST /treatment-network/facilities/${mew_fac}/service-offerings
        payload:
          service_code: IOP_GROUP
          level_of_care: ASAM_3_1
          required_min_credential_tier: TIER_3_LICENSED
          requires_medical_provider: false
        as: PlatformAdmin
        captures:
          mew_svc_i: $.data.id
      - call: POST /treatment-network/clinicians/${mew_clin_A}/facility-credentials
        payload:
          facility_id: ${mew_fac}
          effective_at: '2026-01-01T00:00:00Z'
          expires_at: '2027-01-01T00:00:00Z'
        as: PlatformAdmin
        captures:
          mew_cred: $.data.id
      - call: POST /treatment-network/facilities/${mew_fac}/accreditations
        payload:
          accreditation_class: ACCREDITATION_BODY
          granting_body: CARF
          effective_at: '2026-01-01T00:00:00Z'
          expires_at: '2027-01-01T00:00:00Z'
        as: PlatformAdmin
        captures:
          mew_acc_body: $.data.id
      - call: POST /treatment-network/facilities/${mew_fac}/accreditations
        payload:
          accreditation_class: STATE_LICENSE
          granting_body: MN-DHS
          effective_at: '2026-01-01T00:00:00Z'
          expires_at: '2027-01-01T00:00:00Z'
          license_level_max: ASAM_3_5
          credential_tier_min: TIER_3_LICENSED
        as: PlatformAdmin
        captures:
          mew_acc_lic: $.data.id
      - call: POST /treatment-network/payers
        payload:
          name: Northlight Health Plan
          initial_authorized_days_by_loc:
            ASAM_3_5: 14
            ASAM_3_1: 10
            ASAM_2_1: 8
          step_down_coverage_map:
            ASAM_3_5:
            - ASAM_3_1
            - ASAM_2_1
            - ASAM_1_0
            ASAM_3_1:
            - ASAM_2_1
            - ASAM_1_0
            ASAM_2_1:
            - ASAM_1_0
            ASAM_1_0: []
          concurrent_review_interval_days: 7
          credential_min_tier_by_loc:
            ASAM_3_5: TIER_3_LICENSED
            ASAM_3_1: TIER_3_LICENSED
            ASAM_2_1: TIER_2_COUNSELOR
            ASAM_1_0: TIER_1_SUPPORT
        as: PlatformAdmin
        captures:
          mew_payer_P: $.data.id
      - call: POST /treatment-network/facilities/${mew_fac}/treatment-episodes
        payload:
          patient_ref: PT-8001
        as: AdmissionsIntakeNurse
        captures:
          mew_ep: $.data.id
      - call: POST /treatment-network/facilities/${mew_fac}/treatment-episodes/${mew_ep}/assessments
        payload:
          assessor_clinician_id: ${mew_clin_A}
          dimension_scores:
            withdrawal_risk: 0
            biomedical_conditions: 0
            emotional_behavioral: 4
            readiness_to_change: 0
            relapse_potential: 3
            recovery_environment: 0
        as: AdmissionsIntakeNurse
        captures:
          mew_asmt_1: $.data.id
      trigger:
      - call: POST /treatment-network/facilities/${mew_fac}/assessments/${mew_asmt_1}/complete
        payload: {}
        as: Clinician
        as_user_id: ${mew_clin_A}
      assert:
      - ClinicalAssessment.${mew_asmt_1}.total_score == 15
      - ClinicalAssessment.${mew_asmt_1}.placement_basis == DIMENSION_SUM
      - ClinicalAssessment.${mew_asmt_1}.recommended_level == ASAM_2_1
      - TreatmentEpisode.${mew_ep}.assigned_level == ASAM_2_1
      - TreatmentEpisode.${mew_ep}.clinical_status == AWAITING_AUTHORIZATION
      - The HIGHEST_DIMENSION_FLOOR reading of the identical dimension_scores is ASAM_3_1, so the two
        variants differ by exactly one level on the same input
  - name: stepdown_urgency_consumed_vs_extended_window
    grounds:
    - calculations.step_down_urgency_score
    - entities.LevelOfCareAuthorization.fields.urgency_score
    - entities.LevelOfCareAuthorization.fields.concurrent_review_count
    - endpoints.GET_/treatment-network/treatment-episodes/{id}/utilization-summary
    distinguishing_aspect: On the LevelOfCareAuthorization / WithdrawalManagementPlan domain, one authorization
      at ASAM_3_5 with days_used 7, authorized_days 14, concurrent_review_count 1 and a MEDICALLY_STABLE
      withdrawal plan persists urgency_score 61.0 (denominator = the original 14-day grant) while the
      same endpoint reports projected_step_down_urgency 51.0 (denominator = the 21-day extended window),
      so the two variants of one urgency rule diverge by 10.0 points for identical state and converge
      only when concurrent_review_count is 0.
    test_recipe:
