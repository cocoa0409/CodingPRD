# purpose: >
# Breadth probe for task 2252 (Cloud Cost Allocation & Chargeback). One instance per
# applicable row of references/claim-extraction-guide.md, walked against §1.1-§1.7 of
# SCAFFOLD.yaml. Corners already carried by a §1.8 difficulty instance appear as
# excluded_because stubs naming that instance, so the two design files together cover
# the guide without duplicating work. Every numeric expectation below is a literal
# pre-computed from the §1.3 formulas; no assert restates a formula.
# logical_clock_note: >
# The suite drives time through POST /_clock/set_current_utc. Unless an instance sets it,
# the clock is the scaffold default 2026-08-01T00:00:00Z. Setup chains that need invoices,
# dispute windows or remediation windows set it explicitly as their first call.
scaffold_corner_design:
    - section: entities
      instances:
        - name: business_unit_creation_persists_inputs_and_zeroes_derived_fields
          claim_type: Creation
          grounds: "§1.1 BusinessUnit — input fields name, cost_center_code, chargeback_enabled, headcount, revenue_cents, status; computed fields resource_count, tracked_run_rate_cents, direct_spend_cents, showback_total_cents, chargeback_balance_cents. §1.5 POST /finops/business-units returns 201."
          distinguishing_aspect: "Plain create path: the five derived money/count fields must come back as 0 on a unit that owns nothing yet, and version must start at 1."
          test_recipe:
            setup:
              - "No prior state."
            setup_api_calls: []
            trigger:
              - call: "POST /finops/business-units"
                payload: { name: "Platform", cost_center_code: "CC-100", chargeback_enabled: true, headcount: 40, revenue_cents: 5000000, status: "ACTIVE" }
                as: PlatformAdmin
                as_user_id: "admin-1"
            assert:
              - "HTTP 201."
              - "data.name == \"Platform\", data.cost_center_code == \"CC-100\", data.chargeback_enabled == true, data.headcount == 40, data.revenue_cents == 5000000."
              - "data.status == \"ACTIVE\"."
              - "data.resource_count == 0 and data.tracked_run_rate_cents == 0 and data.direct_spend_cents == 0 and data.showback_total_cents == 0 and data.chargeback_balance_cents == 0."
              - "data.id, data.created_at, data.updated_at are present and data.version == 1."
              - "data.parent_business_unit_id is null."

        - name: tagging_policy_retrieval_returns_stored_dimension_list
          claim_type: Retrieval
          grounds: "§1.1 TaggingPolicy; §1.5 GET /finops/tagging-policies/{id} returns one policy."
          distinguishing_aspect: "Read-back of an array-typed input field (mandatory_dimensions) — order and membership must survive the round trip untouched."
          test_recipe:
            setup:
              - "One DRAFT tagging policy naming two of the three dimensions."
            setup_api_calls:
              - call: "POST /finops/tagging-policies"
                payload: { name: "Two Dimension Policy", mandatory_dimensions: ["team", "environment"] }
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
                captures: { pol_id: "$.data.id" }
            trigger:
              - call: "GET /finops/tagging-policies/${pol_id}"
                payload: {}
                as: FinOpsController
                as_user_id: "controller-1"
            assert:
              - "HTTP 200."
              - "data.id == ${pol_id} and data.name == \"Two Dimension Policy\"."
              - "data.mandatory_dimensions == [\"team\", \"environment\"] in that order."
              - "data.enforcement_mode == \"ADVISORY\" and data.status == \"DRAFT\"."

        - name: cost_record_listing_filters_by_resource_with_pagination_envelope
          claim_type: Listing
          grounds: "§1.5 GET /finops/cost-records with cloud_resource_id?, limit?, offset?; §1.0 response_envelope.pagination_fields [limit, offset, total_count, has_more] and pagination_defaults limit 10 / offset 0."
          distinguishing_aspect: "Filter and pagination interact on the same read: three records belong to the resource, a fourth untagged record does not, so the filtered total_count must be 3 while the unfiltered one is 4."
          test_recipe:
            setup:
              - "One provisioned resource with three cost records, plus one untagged record carrying no cloud_resource_id."
            setup_api_calls:
              - call: "POST /finops/business-units"
                payload: { name: "Ops", cost_center_code: "CC-400", chargeback_enabled: true, headcount: 10 }
                as: PlatformAdmin
                as_user_id: "admin-1"
                captures: { bu_id: "$.data.id" }
              - call: "POST /finops/tagging-policies"
                payload: { name: "Std", mandatory_dimensions: ["team", "environment", "application"] }
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
                captures: { pol_id: "$.data.id" }
              - call: "POST /finops/tagging-policies/${pol_id}/activate"
                payload: {}
                as: FinOpsController
                as_user_id: "controller-1"
              - call: "POST /finops/provisioning-requests"
                payload: { tagging_policy_id: "${pol_id}", business_unit_id: "${bu_id}", resource_kind: "COMPUTE", requested_tags: { team: "ops", environment: "dev", application: "api" }, monthly_run_rate_cents: 10000, owner_user_id: "owner-4" }
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
                captures: { pr_id: "$.data.id" }
              - call: "POST /finops/provisioning-requests/${pr_id}/approve"
                payload: {}
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
              - call: "POST /finops/provisioning-requests/${pr_id}/provision"
                payload: {}
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
              - call: "GET /finops/cloud-resources?provisioning_request_id=${pr_id}"
                payload: {}
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
                captures: { res_id: "$.data[0].id" }
              - call: "POST /finops/cost-records"
                payload: { billing_period_start: "2026-05-01T00:00:00Z", billing_period_end: "2026-06-01T00:00:00Z", resource_kind: "COMPUTE", list_cost_cents: 1000, cloud_resource_id: "${res_id}" }
                as: PlatformAdmin
                as_user_id: "admin-1"
              - call: "POST /finops/cost-records"
                payload: { billing_period_start: "2026-06-01T00:00:00Z", billing_period_end: "2026-07-01T00:00:00Z", resource_kind: "COMPUTE", list_cost_cents: 2000, cloud_resource_id: "${res_id}" }
                as: PlatformAdmin
                as_user_id: "admin-1"
              - call: "POST /finops/cost-records"
                payload: { billing_period_start: "2026-07-01T00:00:00Z", billing_period_end: "2026-08-01T00:00:00Z", resource_kind: "COMPUTE", list_cost_cents: 3000, cloud_resource_id: "${res_id}" }
                as: PlatformAdmin
                as_user_id: "admin-1"
              - call: "POST /finops/cost-records"
                payload: { billing_period_start: "2026-07-01T00:00:00Z", billing_period_end: "2026-08-01T00:00:00Z", resource_kind: "STORAGE", list_cost_cents: 900 }
                as: PlatformAdmin
                as_user_id: "admin-1"
            trigger:
              - call: "GET /finops/cost-records?cloud_resource_id=${res_id}"
                payload: {}
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
              - call: "GET /finops/cost-records?cloud_resource_id=${res_id}&limit=2&offset=0"
                payload: {}
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
              - call: "GET /finops/cost-records"
                payload: {}
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
            assert:
              - "First call: HTTP 200, response_type == \"array\", meta.total_count == 3, meta.has_more == false, meta.limit == 10, meta.offset == 0, len(data) == 3."
              - "First call: every returned row has cloud_resource_id == ${res_id}; the 900-cent STORAGE record is absent."
              - "Second call: meta.limit == 2, meta.total_count == 3, meta.has_more == true, len(data) == 2."
              - "Third call: meta.total_count == 4 — the filter, not the page size, is what removed the untagged record."

        - name: commitment_fetch_with_unknown_id_returns_commitment_not_found
          claim_type: Not Found
          grounds: "§1.4 priority 10 (every path id exists, validated left-to-right) and §1.6 ERR_COMMITMENT_NOT_FOUND (404)."
          distinguishing_aspect: "Path-id resolution on a read, with a syntactically valid but unknown id — separates 404 from the 400 shape error."
          test_recipe:
            setup:
              - "No commitments exist."
            setup_api_calls: []
            trigger:
              - call: "GET /finops/commitments/00000000-0000-4000-8000-000000000999"
                payload: {}
                as: FinOpsController
                as_user_id: "controller-1"
            assert:
              - "HTTP 404 with data.error_id == \"ERR_COMMITMENT_NOT_FOUND\"."
              - "response_type == \"error\" and meta.api_request_id is present."

        - name: provisioning_request_without_owner_user_id_is_rejected
          claim_type: Required Fields
          grounds: "§1.1 ProvisioningRequest.owner_user_id has source input and no default; §1.4 priority 20 ERR_INVALID_REQUEST (400)."
          distinguishing_aspect: "Omission of a required input that has no default and is not derivable from the policy or the business unit."
          test_recipe:
            setup:
              - "One ACTIVE tagging policy and one ACTIVE business unit."
            setup_api_calls:
              - call: "POST /finops/business-units"
                payload: { name: "Ops", cost_center_code: "CC-400" }
                as: PlatformAdmin
                as_user_id: "admin-1"
                captures: { bu_id: "$.data.id" }
              - call: "POST /finops/tagging-policies"
                payload: { name: "Std", mandatory_dimensions: ["team", "environment", "application"] }
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
                captures: { pol_id: "$.data.id" }
              - call: "POST /finops/tagging-policies/${pol_id}/activate"
                payload: {}
                as: FinOpsController
                as_user_id: "controller-1"
            trigger:
              - call: "POST /finops/provisioning-requests"
                payload: { tagging_policy_id: "${pol_id}", business_unit_id: "${bu_id}", resource_kind: "COMPUTE", requested_tags: { team: "ops", environment: "dev", application: "api" }, monthly_run_rate_cents: 10000 }
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
            assert:
              - "HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\"."
              - "No ProvisioningRequest row is created: GET /finops/provisioning-requests?tagging_policy_id=${pol_id} reports meta.total_count == 0."

        - name: shared_cost_pool_defaults_to_spend_basis_and_open_status
          claim_type: Defaults
          grounds: "§1.1 SharedCostPool.proportional_basis default SPEND, status default OPEN (system), absorbed_record_count default 0; §1.5 POST /finops/allocation-runs/{id}/shared-cost-pools."
          distinguishing_aspect: "An omitted enum with a declared default on a child entity whose parent id is system-assigned from the URL, never from the body."
          test_recipe:
            setup:
              - "One DRAFT allocation run."
            setup_api_calls:
              - call: "POST /finops/business-units"
                payload: { name: "Ops", cost_center_code: "CC-400", headcount: 10 }
                as: PlatformAdmin
                as_user_id: "admin-1"
                captures: { bu_id: "$.data.id" }
              - call: "POST /finops/allocation-runs"
                payload: { mode: "SHOWBACK", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
                captures: { run_id: "$.data.id" }
            trigger:
              - call: "POST /finops/allocation-runs/${run_id}/shared-cost-pools"
                payload: { name: "Network", methodology: "PROPORTIONAL", participant_business_unit_ids: ["${bu_id}"] }
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
            assert:
              - "HTTP 201."
              - "data.proportional_basis == \"SPEND\" (the declared default, not null)."
              - "data.status == \"OPEN\", data.absorbed_record_count == 0, data.pooled_cost_cents == 0."
              - "data.allocation_run_id == ${run_id} — taken from the URL."

        - name: provisioning_request_compliance_fields_are_computed_from_dimension_weights
          claim_type: Computed Fields
          grounds: "§1.1 ProvisioningRequest.missing_dimensions / compliance_score / projected_tag_state all source computed; §1.3 tag_compliance_evaluation with DIMENSION_WEIGHT team 40, environment 35, application 25."
          distinguishing_aspect: "The three computed tag fields are populated at creation from the policy weights, and the request still lands in SUBMITTED because the policy is only ADVISORY."
          test_recipe:
            setup:
              - "One ACTIVE ADVISORY policy demanding all three dimensions."
            setup_api_calls:
              - call: "POST /finops/business-units"
                payload: { name: "Ops", cost_center_code: "CC-400" }
                as: PlatformAdmin
                as_user_id: "admin-1"
                captures: { bu_id: "$.data.id" }
              - call: "POST /finops/tagging-policies"
                payload: { name: "Std", mandatory_dimensions: ["team", "environment", "application"], enforcement_mode: "ADVISORY" }
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
                captures: { pol_id: "$.data.id" }
              - call: "POST /finops/tagging-policies/${pol_id}/activate"
                payload: {}
                as: FinOpsController
                as_user_id: "controller-1"
            trigger:
              - call: "POST /finops/provisioning-requests"
                payload: { tagging_policy_id: "${pol_id}", business_unit_id: "${bu_id}", resource_kind: "COMPUTE", requested_tags: { team: "ops", environment: "dev" }, monthly_run_rate_cents: 10000, owner_user_id: "owner-4" }
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
            assert:
              - "HTTP 201."
              - "data.missing_dimensions == [\"application\"]."
              - "data.compliance_score == 75.00 — the satisfied weight 40 + 35 = 75 over the mandatory weight 100."
              - "data.projected_tag_state == \"PARTIAL\"."
              - "data.status == \"SUBMITTED\" and data.retag_count == 0."

        - name: tagging_policy_status_and_actor_fields_are_system_assigned
          claim_type: System Fields
          grounds: "§1.1 TaggingPolicy.status / created_by_user_id / activated_by_user_id have source system; rejection_count is computed with default 0."
          distinguishing_aspect: "created_by_user_id is lifted from the X-User-ID header rather than the body, and activated_by_user_id stays null until a different controller activates."
          test_recipe:
            setup:
              - "No prior state."
            setup_api_calls: []
            trigger:
              - call: "POST /finops/tagging-policies"
                payload: { name: "Std", mandatory_dimensions: ["team"] }
                as: FinOpsAnalyst
                as_user_id: "analyst-7"
            assert:
              - "HTTP 201."
              - "data.status == \"DRAFT\" — no status field is accepted on input."
              - "data.created_by_user_id == \"analyst-7\"."
              - "data.activated_by_user_id is null and data.rejection_count == 0."
              - "data.version == 1 and data.created_at is present."

        - name: budget_with_inverted_period_and_zero_amount_is_rejected
          claim_type: Type Constraints
          grounds: "§1.1 Budget.amount_cents constrained to integer > 0; §1.4 priority 20 ERR_INVALID_REQUEST (400) covers period_end strictly after period_start and constrained integers."
          distinguishing_aspect: "Two distinct shape constraints on one entity — an inverted interval and a non-positive constrained integer — both land on the same 400 rather than on a business error."
          test_recipe:
            setup:
              - "One ACTIVE business unit."
            setup_api_calls:
              - call: "POST /finops/business-units"
                payload: { name: "Ops", cost_center_code: "CC-400" }
                as: PlatformAdmin
                as_user_id: "admin-1"
                captures: { bu_id: "$.data.id" }
            trigger:
              - call: "POST /finops/budgets"
                payload: { business_unit_id: "${bu_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", amount_cents: 10000, forecast_cents: 10000 }
                as: FinOpsController
                as_user_id: "controller-1"
              - call: "POST /finops/budgets"
                payload: { business_unit_id: "${bu_id}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", amount_cents: 0, forecast_cents: 10000 }
                as: FinOpsController
                as_user_id: "controller-1"
            assert:
              - "Both calls: HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\"."
              - "GET /finops/budgets?business_unit_id=${bu_id} reports meta.total_count == 0 — neither attempt persisted."

        - name: allocation_line_is_immutable_with_no_write_or_version_surface
          claim_type: Immutability
          grounds: "§1.1 AllocationLine declares common_fields: false and every field source system; §1.5 exposes only GET /finops/allocation-lines and GET /finops/allocation-lines/{id}."
          distinguishing_aspect: "The one common_fields: false entity in the scaffold: it is born from a run write, is readable by id, and carries no version / updated_at, so it can never be the parent of an OCC write."
          test_recipe:
            setup:
              - "One COMPUTED_FINAL chargeback run (no cost records, so no DIRECT lines) with one MANUAL_ADJUSTMENT line appended by the controller."
            setup_api_calls:
              - call: "POST /finops/business-units"
                payload: { name: "Ops", cost_center_code: "CC-400", chargeback_enabled: true, headcount: 10 }
                as: PlatformAdmin
                as_user_id: "admin-1"
                captures: { bu_id: "$.data.id" }
              - call: "POST /finops/allocation-runs"
                payload: { mode: "CHARGEBACK", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
                captures: { run_id: "$.data.id" }
              - call: "POST /finops/allocation-runs/${run_id}/compute"
                payload: { variant: "FINAL" }
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
                captures: { run_v: "$.data.version" }
              - call: "POST /finops/allocation-runs/${run_id}/manual-adjustments"
                payload: { expected_allocation_run_version: "${run_v}", business_unit_id: "${bu_id}", allocated_cents: 500, memo: "true-up" }
                as: FinOpsController
                as_user_id: "controller-1"
                captures: { line_id: "$.data.id" }
            trigger:
              - call: "GET /finops/allocation-lines/${line_id}"
                payload: {}
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
            assert:
              - "HTTP 201 on the adjustment; HTTP 200 on the read."
              - "data.id and data.created_at are present, but data has no version and no updated_at key."
              - "data.line_kind == \"MANUAL_ADJUSTMENT\", data.method_applied == \"MANUAL\", data.allocated_cents == 500, data.memo == \"true-up\"."
              - "data.basis_value == 0.0 and data.rounding_remainder_cents == 0."
              - "No PATCH, PUT or DELETE route exists for /finops/allocation-lines/{id} in §1.5."

        - name: shared_cost_pool_creation_requires_an_existing_parent_run
          claim_type: Parent Relationships
          grounds: "§1.1 SharedCostPool.parent == AllocationRun with allocation_run_id source system; §1.4 priority 10 resolves path ids and yields ERR_ALLOCATION_RUN_NOT_FOUND (404)."
          distinguishing_aspect: "The parent id lives only in the URL, so an unknown parent must 404 before any body-level check (participant scope, methodology) is reached."
          test_recipe:
            setup:
              - "One business unit; no allocation run with the id used below."
            setup_api_calls:
              - call: "POST /finops/business-units"
                payload: { name: "Ops", cost_center_code: "CC-400" }
                as: PlatformAdmin
                as_user_id: "admin-1"
                captures: { bu_id: "$.data.id" }
            trigger:
              - call: "POST /finops/allocation-runs/00000000-0000-4000-8000-0000000000aa/shared-cost-pools"
                payload: { name: "Network", methodology: "EVEN_SPLIT", participant_business_unit_ids: ["${bu_id}"] }
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
            assert:
              - "HTTP 404 with data.error_id == \"ERR_ALLOCATION_RUN_NOT_FOUND\"."
              - "The response is not ERR_PARTICIPANT_OUT_OF_SCOPE — path resolution runs at priority 10, ahead of the priority 60 scope check."

        - name: business_unit_self_referential_tree_and_many_to_many_pool_membership
          claim_type: Parent Relationships
          grounds: "§1.0 complexity_profile.entity_topology graph with relationship_patterns self_referential and many_to_many; §1.1 BusinessUnit.parent_business_unit_id points at BusinessUnit; SharedCostPool.participant_business_unit_ids is the many-to-many junction; §1.4 priority 60 restricts participants to the run's scope subtree."
          distinguishing_aspect: "One pool row joins two business units that are themselves in a parent/child relationship, and the run is scoped to the parent — the self-referential edge is what makes the child an in-scope participant."
          test_recipe:
            setup:
              - "Parent business unit with one child; a SHOWBACK run scoped to the parent."
            setup_api_calls:
              - call: "POST /finops/business-units"
                payload: { name: "Engineering", cost_center_code: "CC-500", headcount: 30 }
                as: PlatformAdmin
                as_user_id: "admin-1"
                captures: { parent_id: "$.data.id" }
              - call: "POST /finops/business-units"
                payload: { name: "Engineering / Data", cost_center_code: "CC-501", headcount: 10, parent_business_unit_id: "${parent_id}" }
                as: PlatformAdmin
                as_user_id: "admin-1"
                captures: { child_id: "$.data.id" }
              - call: "POST /finops/allocation-runs"
                payload: { mode: "SHOWBACK", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", scope_business_unit_id: "${parent_id}" }
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
                captures: { run_id: "$.data.id" }
            trigger:
              - call: "POST /finops/allocation-runs/${run_id}/shared-cost-pools"
                payload: { name: "Shared Platform", methodology: "EVEN_SPLIT", participant_business_unit_ids: ["${parent_id}", "${child_id}"] }
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
              - call: "GET /finops/business-units?parent_business_unit_id=${parent_id}"
                payload: {}
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
            assert:
              - "Pool creation: HTTP 201 and data.participant_business_unit_ids has both ids, the scoped parent and its descendant."
              - "Tree walk: HTTP 200, meta.total_count == 1, data[0].id == ${child_id}."
              - "data[0].parent_business_unit_id == ${parent_id} — the self-referential edge is stored as given."

    - section: state_machines
      instances:
        - name: budget_is_born_in_draft_with_empty_forecast_history
          claim_type: Initial State
          grounds: "§1.2 Budget initial_state DRAFT; §1.1 Budget.forecast_history default [], status default DRAFT, accuracy_basis default MAPE_BASIS, accuracy_basis_applied null before the first evaluation."
          distinguishing_aspect: "A freshly created budget has never been evaluated, so accuracy_basis_applied must still be null even though accuracy_basis already carries its default."
          test_recipe:
            setup:
              - "One ACTIVE business unit."
            setup_api_calls:
              - call: "POST /finops/business-units"
                payload: { name: "Ops", cost_center_code: "CC-400" }
                as: PlatformAdmin
                as_user_id: "admin-1"
                captures: { bu_id: "$.data.id" }
            trigger:
              - call: "POST /finops/budgets"
                payload: { business_unit_id: "${bu_id}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", amount_cents: 10000, forecast_cents: 9000 }
                as: FinOpsController
                as_user_id: "controller-1"
            assert:
              - "HTTP 201."
              - "data.status == \"DRAFT\" — the declared initial_state."
              - "data.forecast_history == [] and data.revision_count == 0."
              - "data.accuracy_basis == \"MAPE_BASIS\" but data.accuracy_basis_applied is null."
              - "data.actual_spend_cents == 0, data.variance_cents == 0, data.variance_pct == 0.0, data.forecast_accuracy_pct == 0.0, data.warning_flag == false, data.variance_explanation_text is null."

        - name: commitment_activation_sets_capacity_and_discounts_the_covered_record
          claim_type: Valid Transition
          grounds: "§1.2 Commitment PENDING -> ACTIVE on POST /finops/commitments/{id}/activate with side effects setting committed_capacity_cents and running the waterfall; §1.3 commitment_application_waterfall constants HOURS_PER_PERIOD 720 and DISCOUNT_RATE.RESERVED_INSTANCE 0.4."
