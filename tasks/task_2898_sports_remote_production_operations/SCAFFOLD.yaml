scenario: |
  2898. Sports Remote Production Operations (sports broadcast production unit): production truck and
  crew assignment by event tier with equipment specification and travel logistics, venue survey with
  camera positions, cable runs, power and connectivity requirements, transmission path booking across
  satellite and fiber with backup routes and testing windows, crew calls, freelance hiring and union
  rules on turnaround and meal penalties, graphics, statistics and replay system preparation with data
  feed integration, rehearsal, camera blocking and coordination with the venue and league operations,
  live show execution with contingency for weather delays, extended play and technical failures,
  tear-down, travel to the next event and equipment maintenance cycles

domain_name: sports-remote-production-operations
api_prefix: "/broadcast-ops"

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by FK fields carried in request bodies (production_id, path_id,
  # crew_member_id, data_feed_id). Creation is never nested under a parent path except where the
  # child is meaningless outside its parent (CameraPosition under VenueSurvey, Incident under
  # ShowExecution). Reads use flat filtered lists plus a few sub-resource collections.

  state_machine_shape: cyclic
  # VenueSurvey loops DRAFT->SUBMITTED->CHANGES_REQUESTED->DRAFT (bounded by revision limit),
  # PathBooking loops TEST_SCHEDULED->TEST_FAILED->TEST_SCHEDULED (bounded by attempt limit),
  # ProductionTruck loops AVAILABLE->ASSIGNED->IN_TRANSIT->{AVAILABLE|IN_MAINTENANCE}->AVAILABLE,
  # ShowExecution loops ON_AIR->IN_EXTENDED_PLAY->ON_AIR and additionally carries two independent
  # state dimensions (air_status x signal_status).

  relationship_patterns:
    - one_to_many          # Production -> VenueSurvey / SystemPrep / Rehearsal / ShowExecution
    - many_to_many         # CrewCall junctions Production x CrewMember; PathBooking junctions Production x TransmissionPath
    - cross_aggregate      # SystemPrep -> DataFeed, PathBooking -> TransmissionPath, Production -> ProductionTruck

  role_model: segregation_of_duties
  # Two segregated step pairs enforced on X-User-ID: (1) the operator who submits a VenueSurvey may
  # not be the operator who reviews it; (2) the operator who wraps a Production may not be the
  # operator who settles it.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ProductionTruck
    parent: null
    common_fields: true
    fields:
      - name: truck_code
        type: string
        source: input
        description: Operator-facing identifier of the mobile production unit; unique across trucks
        constraints: non-empty, unique; duplicate -> ERR_INVALID_REQUEST
      - name: tier_rating
        type: enum
        source: input
        description: Highest event tier this truck is rated to cover
        constraints: "TIER_1 | TIER_2 | TIER_3; TIER_1 covers all tiers, TIER_2 covers TIER_2 and TIER_3, TIER_3 covers TIER_3 only"
      - name: camera_channel_capacity
        type: integer
        source: input
        description: Number of camera channels the truck can ingest
        constraints: ">= 1"
      - name: power_draw_amps
        type: integer
        source: input
        description: Amps the truck itself draws from venue power when parked and powered
        constraints: ">= 0"
      - name: home_base_code
        type: string
        source: input
        description: Home garage code used for travel-logistics reporting
      - name: engine_hours_since_service
        type: number
        source: input
        default: 0
        description: Generator/engine hours accumulated since the last completed service; accrues on Production wrap
        constraints: ">= 0"
      - name: service_interval_hours
        type: integer
        source: input
        default: 500
        description: Engine-hour interval at or beyond which the truck must enter maintenance on arrival
        constraints: ">= 1"
      - name: hours_to_service
        type: number
        source: computed
        description: service_interval_hours - engine_hours_since_service; may be zero or negative when overdue
      - name: last_service_completed_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant at which the most recent service-complete was recorded; null until first service
      - name: status
        type: enum
        source: system
        default: AVAILABLE
        description: Truck lifecycle position
        constraints: "AVAILABLE | ASSIGNED | IN_TRANSIT | IN_MAINTENANCE"

  - name: Production
    parent: null
    common_fields: true
    fields:
      - name: event_tier
        type: enum
        source: input
        description: Broadcast tier of the event; drives truck rating, crew headcount, prep count and meal-penalty multiplier
        constraints: "TIER_1 | TIER_2 | TIER_3"
      - name: league_code
        type: string
        source: input
        description: League whose operations department co-signs rehearsal and blocking
      - name: venue_name
        type: string
        source: input
        description: Venue the remote originates from
      - name: venue_power_capacity_amps
        type: integer
        source: input
        description: Total amps the venue can supply to the broadcast compound
        constraints: ">= 1"
      - name: venue_roof_type
        type: enum
        source: input
        description: Roof configuration; recorded for weather-contingency planning
        constraints: "OPEN | DOMED | RETRACTABLE"
      - name: venue_curfew_utc
        type: datetime
        source: input
        description: Hard venue curfew instant; projected off-air must not pass it
        constraints: "must be > scheduled_end_utc"
      - name: scheduled_start_utc
        type: datetime
        source: input
        description: Scheduled first-pitch/tip air instant
      - name: scheduled_end_utc
        type: datetime
        source: input
        description: Scheduled off-air instant
        constraints: "must be > scheduled_start_utc else ERR_INVALID_TIME_WINDOW"
      - name: truck_id
        type: string
        source: system
        default: null
        description: "FK -> ProductionTruck.id; null until POST /productions/{id}/truck-assignment succeeds"
      - name: labor_budget_total_cents
        type: integer
        source: input
        description: Total crew-labor budget authorized for this remote, in cents
        constraints: ">= 0"
      - name: labor_committed_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of provisional_total_cents over CrewCall rows with status IN {OFFERED, ACCEPTED} plus settled_total_cents over CrewCall rows with status == RELEASED, for this production"
      - name: labor_available_cents
        type: integer
        source: computed
        description: "labor_budget_total_cents - labor_committed_cents; conserved quantity: total == committed + available at all times"
      - name: labor_variance_cents
        type: integer
        source: computed
        default: 0
        description: Settlement delta = sum(settled_total_cents) - sum(provisional_total_cents) over RELEASED CrewCall rows; written only by settle
      - name: readiness_score_preflight
        type: number
        source: computed
        description: Forward-looking readiness variant (assumes scheduled tests pass, created preps validate, offers are accepted); 2 decimal places
      - name: readiness_score_certified
        type: number
        source: computed
        description: Airtime-certified readiness variant (counts only confirmed bookings, validated preps, accepted calls); 2 decimal places
      - name: required_crew_positions
        type: integer
        source: computed
        description: "Accepted-crew headcount required for a certified crew component; from REQUIRED_CREW_POSITIONS[event_tier]"
      - name: required_validated_preps
        type: integer
        source: computed
        description: "Validated SystemPrep count required for provisioning; from REQUIRED_VALIDATED_PREPS[event_tier]"
      - name: settlement_total_cents
        type: integer
        source: computed
        default: 0
        description: Final settlement total written by settle; labor subtotal plus overrun fee
      - name: overrun_fee_cents
        type: integer
        source: computed
        default: 0
        description: Overrun fee written by settle; rate bracket keyed on the labor subtotal, never on the settlement total
      - name: wrapped_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the operator who wrapped the production; settle must be performed by a different operator id
      - name: status
        type: enum
        source: system
        default: PLANNED
        description: Production stage; recomputed by recompute_production_stage on every gating change
        constraints: "PLANNED | SURVEYED | PROVISIONED | REHEARSED | ON_AIR | WRAPPED | SETTLED"

  - name: VenueSurvey
    parent: null
    common_fields: true
    fields:
      - name: production_id
        type: string
        source: input
        description: "FK -> Production.id"
      - name: surveyor_name
        type: string
        source: input
        description: Engineer who walked the venue
      - name: fiber_drops_required
        type: integer
        source: input
        description: Number of venue fiber drops the compound needs
        constraints: ">= 0"
      - name: revision
        type: integer
        source: system
        default: 1
        description: Revision counter; incremented each time the survey re-enters DRAFT from CHANGES_REQUESTED
        constraints: "submit is rejected once revision > MAX_SURVEY_REVISIONS"
      - name: submitted_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the operator who submitted this revision; the reviewer must be a different operator id
      - name: reviewed_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the operator who recorded the latest review decision
      - name: camera_position_count
        type: integer
        source: computed
        default: 0
        description: Count of CameraPosition rows whose survey_id equals this survey id
      - name: total_cable_run_feet
        type: integer
        source: computed
        default: 0
        description: Sum of cable_run_feet over all CameraPosition rows of this survey
      - name: total_signal_loss_db
        type: number
        source: computed
        default: 0
        description: Sum of the per-position rounded signal_loss_db values (round per position to 2dp first, then sum, then round to 2dp)
      - name: total_power_draw_amps
        type: integer
        source: computed
        default: 0
        description: Sum of power_draw_amps over all CameraPosition rows of this survey
      - name: power_headroom_amps
        type: integer
        source: computed
        description: Production.venue_power_capacity_amps - total_power_draw_amps for the survey's production
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: Survey review lifecycle
        constraints: "DRAFT | SUBMITTED | CHANGES_REQUESTED | APPROVED | SUPERSEDED"

  - name: CameraPosition
    parent: VenueSurvey
    common_fields: false
    fields:
      - name: survey_id
        type: string
        source: system
        description: "FK -> VenueSurvey.id; taken from the creation path, never from the body"
      - name: label
        type: string
        source: input
        description: Position label used on the camera plot (e.g. HIGH_HOME, LOW_FIRST)
      - name: position_type
        type: enum
        source: input
        description: Physical camera type at this position
        constraints: "HARD | HANDHELD | ROBO | AERIAL"
      - name: cable_run_feet
        type: integer
        source: input
        description: Cable run from the position to the truck in feet
        constraints: ">= 1"
      - name: power_draw_amps
        type: integer
        source: input
        description: Amps this position draws from venue power
        constraints: ">= 0"
      - name: signal_loss_db
        type: number
        source: computed
        description: round_half_up(cable_run_feet * LOSS_DB_PER_100FT / 100, 2)
      - name: requires_operator
        type: boolean
        source: computed
        description: "True when position_type IN {HARD, HANDHELD, AERIAL}; ROBO positions are operated from the truck"

  - name: TransmissionPath
    parent: null
    common_fields: true
    fields:
      - name: path_code
        type: string
        source: input
        description: Carrier-facing circuit or transponder identifier
      - name: path_type
        type: enum
        source: input
        description: Transport medium; decides which interval geometry guards the path
        constraints: "SATELLITE | FIBER"
      - name: carrier_code
        type: string
        source: input
        description: Carrier or teleport operating the path
      - name: capacity_mbps
        type: integer
        source: input
        description: Contracted capacity of the path in Mbps
        constraints: ">= 1"
      - name: guard_band_minutes
        type: integer
        source: input
        default: 10
        description: Guard band applied on both ends of every SATELLITE occupation; ignored for FIBER
        constraints: ">= 0"
      - name: redundancy_class
        type: enum
        source: input
        description: Whether the path may carry a PRIMARY booking or only BACKUP bookings
        constraints: "PRIMARY_ELIGIBLE | BACKUP_ONLY"
      - name: committed_mbps_total
        type: integer
        source: computed
        default: 0
        description: "Conserved quantity: sum of requested_mbps over PathBooking rows on this path with status IN {RESERVED, TEST_SCHEDULED, TEST_FAILED, CONFIRMED, PROMOTED}"
      - name: active_booking_count
        type: integer
        source: computed
        default: 0
        description: "Count of PathBooking rows on this path with status IN {RESERVED, TEST_SCHEDULED, TEST_FAILED, CONFIRMED, PROMOTED}"

  - name: PathBooking
    parent: null
    common_fields: true
    fields:
      - name: production_id
        type: string
        source: input
        description: "FK -> Production.id"
      - name: path_id
        type: string
        source: input
        description: "FK -> TransmissionPath.id"
      - name: booking_role
        type: enum
        source: input
        description: Whether this booking is the show's primary transport or its standby route
        constraints: "PRIMARY | BACKUP"
      - name: window_start_utc
        type: datetime
        source: input
        description: Start of the occupation window (inclusive)
      - name: window_end_utc
        type: datetime
        source: input
        description: End of the occupation window (exclusive)
        constraints: "must be > window_start_utc else ERR_INVALID_TIME_WINDOW"
      - name: requested_mbps
        type: integer
        source: input
        description: Bandwidth requested on the path for this window
        constraints: ">= 1"
      - name: test_window_start_utc
        type: datetime
        source: system
        default: null
        description: Start of the booked transmission-test window; set by schedule-test
      - name: test_window_end_utc
        type: datetime
        source: system
        default: null
        description: End of the booked transmission-test window (exclusive); set by schedule-test
      - name: test_attempt_count
        type: integer
        source: system
        default: 0
        description: Number of test results recorded on this booking; capped by MAX_TEST_ATTEMPTS
      - name: status
        type: enum
        source: system
        default: RESERVED
        description: Booking lifecycle including the retest loop and failover outcomes
        constraints: "RESERVED | TEST_SCHEDULED | TEST_FAILED | CONFIRMED | FAILED_OVER | PROMOTED | RELEASED"

  - name: CrewMember
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Crew member name
      - name: position
        type: enum
        source: input
        description: Craft position this member is called for
        constraints: "TD | EIC | A1 | CAM_OP | REPLAY_OP | GRAPHICS_OP | STATS_OP | UTILITY"
      - name: employment_type
        type: enum
        source: input
        description: Staff members are paid at their card rate; freelance hires require an explicit offer rate
        constraints: "STAFF | FREELANCE"
      - name: union_local
        type: string
        source: input
        description: Union local whose turnaround and meal-penalty rules apply to this member
      - name: certified_tiers
        type: array
        source: input
        description: "Event tiers this member is certified to work; elements from {TIER_1, TIER_2, TIER_3}"
        constraints: non-empty array
      - name: hourly_rate_cents
        type: integer
        source: input
        description: Card rate in cents per hour
        constraints: ">= 1"
      - name: home_base_code
        type: string
        source: input
        description: Home city code used for travel logistics
      - name: lifetime_meal_penalty_units
        type: integer
        source: computed
        default: 0
        description: Sum of meal_penalty_units over this member's CrewCall rows with status == RELEASED

  - name: CrewCall
    parent: null
    common_fields: true
    fields:
      - name: production_id
        type: string
        source: input
        description: "FK -> Production.id"
      - name: crew_member_id
        type: string
        source: input
        description: "FK -> CrewMember.id"
      - name: call_time_utc
        type: datetime
        source: input
        description: Instant the member is called to the compound
      - name: scheduled_release_utc
        type: datetime
        source: input
        description: Scheduled release instant used by the provisional cost variant
        constraints: "must be > call_time_utc else ERR_INVALID_TIME_WINDOW"
      - name: offer_rate_cents
        type: integer
        source: input
        default: null
        description: Negotiated freelance rate in cents per hour; required for FREELANCE members, forbidden for STAFF members
        constraints: ">= 1 when present"
      - name: effective_rate_cents
        type: integer
        source: computed
        description: offer_rate_cents when present, otherwise CrewMember.hourly_rate_cents
      - name: actual_release_utc
        type: datetime
        source: system
        default: null
        description: Actual release instant recorded at release; null until released
      - name: meal_break_start_utc
        type: datetime
        source: system
        default: null
        description: Instant the meal break started, recorded at release; null when no break was taken
      - name: turnaround_minutes_before_call
        type: integer
        source: computed
        default: null
        description: Minutes between the reference release of this member's most recent prior call and call_time_utc; null when there is no prior call
      - name: meal_penalty_units
        type: integer
        source: computed
        default: 0
        description: Meal-penalty units charged on this call under the currently applicable variant
      - name: provisional_total_cents
        type: integer
        source: computed
        description: Forward-looking cost variant computed at creation from call_time_utc and scheduled_release_utc
      - name: settled_total_cents
        type: integer
        source: computed
        default: null
        description: Chronological cost variant computed at release from call_time_utc, actual_release_utc and meal_break_start_utc
      - name: status
        type: enum
        source: system
        default: OFFERED
        description: Crew call lifecycle
        constraints: "OFFERED | ACCEPTED | DECLINED | RELEASED | CANCELLED"

  - name: DataFeed
    parent: null
    common_fields: true
    fields:
      - name: provider_code
        type: string
        source: input
        description: Statistics/scoring data provider code
      - name: feed_kind
        type: enum
        source: input
        description: Kind of data the feed carries
        constraints: "LIVE_STATS | OFFICIAL_SCORING | PLAYER_TRACKING"
      - name: latency_ms
        type: integer
        source: input
        description: Contracted feed latency in milliseconds; above MAX_FEED_LATENCY_MS (250 ms) validation fails the prep instead of erroring
        constraints: ">= 0"
      - name: contract_expiry_utc
        type: datetime
        source: input
        description: Instant the data-rights contract expires; validation is rejected at or after it
      - name: max_concurrent_consumers
        type: integer
        source: input
        default: 2
        description: How many SystemPrep rows may hold this feed in VALIDATED status at once
        constraints: ">= 1"
      - name: active_consumer_count
        type: integer
        source: computed
        default: 0
        description: Count of SystemPrep rows referencing this feed with status == VALIDATED
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: Feed availability
        constraints: "ACTIVE | SUSPENDED"

  - name: SystemPrep
    parent: null
    common_fields: true
    fields:
      - name: production_id
        type: string
        source: input
        description: "FK -> Production.id"
      - name: data_feed_id
        type: string
        source: input
        description: "FK -> DataFeed.id"
      - name: system_kind
        type: enum
        source: input
        description: Which show system is being prepared; at most one row per kind per production
        constraints: "GRAPHICS | STATS | REPLAY"
      - name: replay_channel_count
        type: integer
        source: input
        default: null
        description: Replay channels to be armed; required when system_kind == REPLAY, forbidden otherwise
        constraints: ">= 1 when present"
      - name: feed_validated_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant of the last successful feed validation
      - name: status
        type: enum
        source: system
        default: PENDING
        description: Prep lifecycle; FAILED preps may be re-validated
        constraints: "PENDING | VALIDATED | FAILED"

  - name: Rehearsal
    parent: null
    common_fields: true
    fields:
      - name: production_id
        type: string
        source: input
        description: "FK -> Production.id"
      - name: scheduled_start_utc
        type: datetime
        source: input
        description: Scheduled rehearsal / camera-blocking start instant
      - name: camera_blocking_positions_cleared
        type: integer
        source: input
        default: null
        description: Camera positions blocked and cleared during rehearsal; recorded with the outcome
        constraints: ">= 0"
      - name: venue_signoff
        type: boolean
        source: input
        default: null
        description: Venue operations signed off on the camera plot; recorded with the outcome
      - name: league_ops_signoff
        type: boolean
        source: input
        default: null
        description: League operations signed off on the camera plot; recorded with the outcome
      - name: outcome_notes
        type: string
        source: input
        default: null
        description: Free-text rehearsal notes recorded with the outcome
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: Rehearsal lifecycle; the two outcomes carry divergent side-effect sets
        constraints: "SCHEDULED | COMPLETED | ABORTED"

  - name: ShowExecution
    parent: null
    common_fields: true
    fields:
      - name: production_id
        type: string
        source: input
        description: "FK -> Production.id"
      - name: air_status
        type: enum
        source: system
        default: PRE_SHOW
        description: First independent state dimension - where the show sits relative to air
        constraints: "PRE_SHOW | ON_AIR | IN_EXTENDED_PLAY | OFF_AIR"
      - name: signal_status
        type: enum
        source: system
        default: NOMINAL
        description: Second independent state dimension - which transport is carrying the signal
        constraints: "NOMINAL | ON_BACKUP | LOST"
      - name: readiness_hold
        type: boolean
        source: system
        default: false
        description: Set when a cascade demotes the production below REHEARSED; blocks going ON_AIR until a fresh rehearsal completes
      - name: weather_hold_minutes
        type: integer
        source: computed
        default: 0
        description: Running sum of duration_minutes over this show's WEATHER_HOLD incidents
      - name: extended_play_minutes
        type: integer
        source: computed
        default: 0
        description: Running sum of duration_minutes over this show's EXTENDED_PLAY incidents
      - name: technical_downtime_minutes
        type: integer
        source: computed
        default: 0
        description: Running sum of duration_minutes over this show's TECHNICAL_FAILURE and PATH_LOSS incidents
      - name: on_air_at_utc
        type: datetime
        source: system
        default: null
        description: Logical-clock instant of the PRE_SHOW -> ON_AIR transition
      - name: off_air_at_utc
        type: datetime
        source: system
        default: null
        description: Logical-clock instant of the transition into OFF_AIR
      - name: air_minutes_total
        type: integer
        source: computed
        default: 0
        description: Whole minutes between on_air_at_utc and off_air_at_utc; 0 while either is null

  - name: Incident
    parent: ShowExecution
    common_fields: false
    fields:
      - name: show_execution_id
        type: string
        source: system
        description: "FK -> ShowExecution.id; taken from the creation path, never from the body"
      - name: kind
        type: enum
        source: input
        description: Contingency class; each kind drives a different accrual and a different cascade
        constraints: "WEATHER_HOLD | TECHNICAL_FAILURE | EXTENDED_PLAY | PATH_LOSS"
      - name: started_at_utc
        type: datetime
        source: input
        description: Instant the contingency began
      - name: duration_minutes
        type: integer
        source: input
        description: Duration of the contingency in whole minutes
        constraints: ">= 1"
      - name: severity
        type: enum
        source: input
        description: Severity recorded for the post-event report
        constraints: "MINOR | MAJOR | CRITICAL"
      - name: note
        type: string
        source: input
        default: null
        description: Free-text incident note

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
# Shared system procedure referenced by many side_effects below.
#
# recompute_production_stage(p) — runs synchronously, in this exact order, at the end of every
# request that changed any gate of production p (truck assignment, primary booking status, prep
# status, crew call status, survey status, rehearsal outcome):
#   1. recompute p.labor_committed_cents, p.labor_available_cents,
#      p.readiness_score_preflight, p.readiness_score_certified (see 1.3).
#   2. provisioning_conditions(p) := p.truck_id != null
#        AND exists PathBooking(production_id=p.id, booking_role=PRIMARY, status IN {CONFIRMED, PROMOTED})
#        AND count(SystemPrep(production_id=p.id, status=VALIDATED)) >= p.required_validated_preps
#   3. if p.status IN {PROVISIONED, REHEARSED} AND NOT provisioning_conditions(p):
#        p.status := SURVEYED; every Rehearsal(production_id=p.id, status=SCHEDULED) -> ABORTED;
#        every ShowExecution(production_id=p.id, air_status=PRE_SHOW).readiness_hold := true
#   4. elif p.status == REHEARSED AND p.readiness_score_certified < 100:
#        p.status := PROVISIONED;
#        every ShowExecution(production_id=p.id, air_status=PRE_SHOW).readiness_hold := true
#   5. elif p.status == SURVEYED AND provisioning_conditions(p): p.status := PROVISIONED
#   6. statuses ON_AIR, WRAPPED and SETTLED are never changed by this procedure.
# Every mutation the procedure performs bumps that row's updated_at and version.

state_machines:
  - entity: ProductionTruck
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: ASSIGNED
        trigger: "POST /broadcast-ops/productions/{id}/truck-assignment"
        actor: ProductionManager
        preconditions:
          - "truck.status IN {AVAILABLE, ASSIGNED} else ERR_TRUCK_STATE_INVALID (a truck already ASSIGNED to another remote may be booked for the next event of the same road trip; IN_TRANSIT and IN_MAINTENANCE trucks are refused)"
          - "TIER_ORDER[truck.tier_rating] <= TIER_ORDER[production.event_tier] else ERR_TRUCK_TIER_INSUFFICIENT"
          - "no other Production with truck_id == truck.id has an occupation window overlapping this production's window (see 1.4 priority 46) else ERR_TRUCK_TRAVEL_WINDOW_CONFLICT"
          - "when the production has an APPROVED VenueSurvey: survey.camera_position_count <= truck.camera_channel_capacity else ERR_TRUCK_CHANNEL_CAPACITY_EXCEEDED"
          - "when the production has an APPROVED VenueSurvey: truck.power_draw_amps + survey.total_power_draw_amps <= production.venue_power_capacity_amps else ERR_VENUE_POWER_INSUFFICIENT"
        side_effects:
          - "production.truck_id := truck.id"
          - "increments Production.version by 1"
          - "recompute_production_stage(production) — may auto-advance SURVEYED -> PROVISIONED"
      - from: ASSIGNED
        to: ASSIGNED
        trigger: "POST /broadcast-ops/productions/{id}/truck-assignment for a second, non-overlapping production (road-trip booking)"
        actor: ProductionManager
        preconditions:
          - "truck.status == ASSIGNED and the requesting production is not the one already holding it"
          - "the requesting production's occupation window does not overlap any other holder's window else ERR_TRUCK_TRAVEL_WINDOW_CONFLICT"
        side_effects:
          - "requesting production.truck_id := truck.id; the truck is now held by two future remotes at once"
          - "truck.status stays ASSIGNED (this is the self-loop that makes ERR_TRUCK_TRAVEL_WINDOW_CONFLICT reachable)"
        note: The travel-window rule, not the truck status, is what serialises a truck across events.
      - from: ASSIGNED
        to: AVAILABLE
        trigger: "POST /broadcast-ops/productions/{id}/truck-assignment naming a different truck_id (supersede)"
        actor: ProductionManager
        preconditions:
          - "production.truck_id != null and production.truck_id != requested truck_id"
        side_effects:
          - "previously assigned truck.status := AVAILABLE when no other non-WRAPPED, non-SETTLED production still holds it (released before the new truck is marked ASSIGNED); it stays ASSIGNED when another holder remains"
        note: The supersede path is why truck assignment is OCC-guarded on Production.version (see 1.2.1).
      - from: ASSIGNED
        to: IN_TRANSIT
        trigger: "POST /broadcast-ops/productions/{id}/wrap"
        actor: ProductionManager
        preconditions:
          - "production.status == ON_AIR and its ShowExecution.air_status == OFF_AIR else ERR_PRODUCTION_STATE_INVALID"
        side_effects:
          - "truck.engine_hours_since_service += TRAVEL_HOURS_PER_EVENT + SETUP_TEARDOWN_HOURS + ceil(show.air_minutes_total / 60) (see calculations.truck_service_accrual)"
          - "truck.hours_to_service recomputed"
      - from: IN_TRANSIT
        to: AVAILABLE
        trigger: "POST /broadcast-ops/trucks/{id}/arrive"
        actor: ProductionManager
        preconditions:
          - "truck.status == IN_TRANSIT else ERR_TRUCK_STATE_INVALID"
          - "truck.engine_hours_since_service < truck.service_interval_hours"
        side_effects:
          - "truck becomes eligible for the next truck-assignment"
      - from: IN_TRANSIT
        to: IN_MAINTENANCE
        trigger: "POST /broadcast-ops/trucks/{id}/arrive"
        actor: ProductionManager
        preconditions:
          - "truck.status == IN_TRANSIT else ERR_TRUCK_STATE_INVALID"
          - "truck.engine_hours_since_service >= truck.service_interval_hours (at-threshold sends the truck to maintenance)"
        side_effects:
          - "truck is excluded from truck-assignment until service-complete"
      - from: IN_MAINTENANCE
        to: AVAILABLE
        trigger: "POST /broadcast-ops/trucks/{id}/service-complete"
        actor: ProductionManager
        preconditions:
          - "truck.status == IN_MAINTENANCE else ERR_TRUCK_STATE_INVALID"
        side_effects:
          - "truck.engine_hours_since_service := 0"
          - "truck.hours_to_service := truck.service_interval_hours"
          - "truck.last_service_completed_at := logical clock now"

  - entity: Production
    initial_state: PLANNED
    terminal_states: [SETTLED]
    transitions:
      - from: PLANNED
        to: SURVEYED
        trigger: "POST /broadcast-ops/venue-surveys/{id}/review with decision == APPROVE"
        actor: LeagueOperations
        preconditions:
          - "survey.status == SUBMITTED else ERR_SURVEY_STATE_INVALID"
          - "X-User-ID != survey.submitted_by_user_id else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "survey.status := APPROVED; survey.reviewed_by_user_id := X-User-ID"
          - "recompute_production_stage(production)"
      - from: SURVEYED
        to: PLANNED
        trigger: "system — POST /broadcast-ops/venue-surveys creates a new survey for a production whose current survey is APPROVED"
        actor: system
        preconditions:
          - "the production's existing survey has status == APPROVED"
        side_effects:
          - "previous survey.status := SUPERSEDED"
          - "production.status := PLANNED (no APPROVED survey remains)"
          - "recompute_production_stage(production) — cascades any SCHEDULED Rehearsal to ABORTED and sets readiness_hold on any PRE_SHOW ShowExecution"
      - from: SURVEYED
        to: PROVISIONED
        trigger: "system — recompute_production_stage step 5 after truck-assignment, test-result PASS or validate-feed"
        actor: system
        preconditions:
          - "provisioning_conditions(production) is true"
        side_effects:
          - "production.readiness_score_preflight and readiness_score_certified recomputed"
      - from: PROVISIONED
        to: SURVEYED
        trigger: "system — recompute_production_stage step 3 after a primary booking leaves {CONFIRMED, PROMOTED} or the validated prep count falls below required_validated_preps"
        actor: system
        preconditions:
          - "NOT provisioning_conditions(production)"
        side_effects:
          - "every Rehearsal of this production with status == SCHEDULED -> ABORTED"
          - "every ShowExecution of this production with air_status == PRE_SHOW gets readiness_hold := true"
      - from: PROVISIONED
        to: REHEARSED
        trigger: "POST /broadcast-ops/rehearsals/{id}/outcome with outcome == COMPLETED"
        actor: TechnicalDirector
        preconditions:
          - "production.status == PROVISIONED else ERR_PRODUCTION_STATE_INVALID"
          - "rehearsal.status == SCHEDULED else ERR_REHEARSAL_STATE_INVALID"
          - "camera_blocking_positions_cleared == the production's APPROVED survey.camera_position_count AND venue_signoff == true AND league_ops_signoff == true else ERR_REHEARSAL_SIGNOFF_INCOMPLETE"
        side_effects:
          - "rehearsal.status := COMPLETED"
          - "every ShowExecution of this production with air_status == PRE_SHOW gets readiness_hold := false"
          - "recompute_production_stage(production) then production.status := REHEARSED when the procedure leaves it at PROVISIONED"
      - from: REHEARSED
        to: PROVISIONED
        trigger: "system — recompute_production_stage step 4 after readiness_score_certified drops below 100 (e.g. an ACCEPTED CrewCall is cancelled)"
        actor: system
        preconditions:
          - "provisioning_conditions(production) still true AND readiness_score_certified < 100"
        side_effects:
          - "every ShowExecution of this production with air_status == PRE_SHOW gets readiness_hold := true"
      - from: REHEARSED
        to: SURVEYED
        trigger: "system — recompute_production_stage step 3 after provisioning conditions break (e.g. the data feed backing the only validated prep is suspended)"
        actor: system
        preconditions:
          - "NOT provisioning_conditions(production)"
        side_effects:
          - "every Rehearsal of this production with status == SCHEDULED -> ABORTED"
          - "every ShowExecution of this production with air_status == PRE_SHOW gets readiness_hold := true"
      - from: REHEARSED
        to: ON_AIR
        trigger: "POST /broadcast-ops/show-executions/{id}/air-status with target_air_status == ON_AIR"
        actor: TechnicalDirector
        preconditions:
          - "production.status IN {PROVISIONED, REHEARSED} else ERR_PRODUCTION_STATE_INVALID"
          - "show.air_status == PRE_SHOW else ERR_SHOW_STATE_INVALID"
          - "show.readiness_hold == false AND production.status == REHEARSED AND production.readiness_score_certified == 100 else ERR_READINESS_NOT_CERTIFIED"
          - "logical clock now < production.venue_curfew_utc else ERR_VENUE_CURFEW_EXCEEDED"
        side_effects:
          - "show.air_status := ON_AIR; show.on_air_at_utc := logical clock now"
          - "production.status := ON_AIR"
      - from: ON_AIR
        to: WRAPPED
        trigger: "POST /broadcast-ops/productions/{id}/wrap"
        actor: ProductionManager
        preconditions:
          - "production.status == ON_AIR AND its ShowExecution.air_status == OFF_AIR else ERR_PRODUCTION_STATE_INVALID"
        side_effects:
          - "every CrewCall of this production with status == ACCEPTED -> RELEASED with actual_release_utc := scheduled_release_utc and meal_break_start_utc := null; each such call's settled_total_cents and meal_penalty_units are computed by the settled variant"
          - "each auto-released call adds its meal_penalty_units to CrewMember.lifetime_meal_penalty_units"
          - "assigned truck ASSIGNED -> IN_TRANSIT with engine-hour accrual (see ProductionTruck.ASSIGNED_to_IN_TRANSIT)"
          - "production.wrapped_by_user_id := X-User-ID"
          - "recompute_production_stage(production) recomputes labor_committed_cents from settled totals (step 6 keeps status at WRAPPED)"
      - from: WRAPPED
        to: SETTLED
        trigger: "POST /broadcast-ops/productions/{id}/settle"
        actor: UnionSteward
        preconditions:
          - "production.status == WRAPPED else ERR_PRODUCTION_STATE_INVALID"
          - "X-User-ID != production.wrapped_by_user_id else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "production.labor_variance_cents, overrun_fee_cents and settlement_total_cents written per calculations.production_settlement"
          - "every PathBooking of this production with status IN {RESERVED, TEST_SCHEDULED, TEST_FAILED, CONFIRMED, PROMOTED} -> RELEASED, each decrementing its path's committed_mbps_total by requested_mbps"

  - entity: VenueSurvey
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /broadcast-ops/venue-surveys/{id}/submit"
        actor: TechnicalDirector
        preconditions:
          - "survey.status == DRAFT else ERR_SURVEY_STATE_INVALID"
          - "survey.revision <= MAX_SURVEY_REVISIONS else ERR_SURVEY_REVISION_LIMIT"
          - "survey.camera_position_count >= 1 else ERR_SURVEY_NO_CAMERA_POSITIONS"
          - "survey.total_signal_loss_db <= MAX_SIGNAL_LOSS_BUDGET_DB else ERR_SIGNAL_LOSS_BUDGET_EXCEEDED"
          - "survey.power_headroom_amps >= 0 else ERR_VENUE_POWER_INSUFFICIENT"
        side_effects:
          - "survey.submitted_by_user_id := X-User-ID"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /broadcast-ops/venue-surveys/{id}/review with decision == APPROVE"
        actor: LeagueOperations
        preconditions:
          - "survey.status == SUBMITTED else ERR_SURVEY_STATE_INVALID"
          - "X-User-ID != survey.submitted_by_user_id else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "survey.reviewed_by_user_id := X-User-ID"
          - "production PLANNED -> SURVEYED via recompute_production_stage"
      - from: SUBMITTED
        to: CHANGES_REQUESTED
        trigger: "POST /broadcast-ops/venue-surveys/{id}/review with decision == REQUEST_CHANGES"
        actor: LeagueOperations
        preconditions:
          - "survey.status == SUBMITTED else ERR_SURVEY_STATE_INVALID"
          - "X-User-ID != survey.submitted_by_user_id else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "survey.reviewed_by_user_id := X-User-ID; production.status unchanged"
      - from: CHANGES_REQUESTED
        to: DRAFT
        trigger: "POST /broadcast-ops/venue-surveys/{id}/camera-positions (re-opening the revision loop)"
        actor: TechnicalDirector
        preconditions:
          - "survey.status IN {DRAFT, CHANGES_REQUESTED} else ERR_SURVEY_STATE_INVALID"
        side_effects:
          - "survey.revision += 1"
          - "survey.submitted_by_user_id := null"
          - "survey aggregates (camera_position_count, total_cable_run_feet, total_signal_loss_db, total_power_draw_amps, power_headroom_amps) recomputed"
        note: This is the cyclic edge; the loop is bounded by MAX_SURVEY_REVISIONS at submit time.
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system — POST /broadcast-ops/venue-surveys creates a replacement survey for the same production"
        actor: system
        preconditions:
          - "no other survey of this production is in {DRAFT, SUBMITTED, CHANGES_REQUESTED} else ERR_SURVEY_ALREADY_OPEN"
        side_effects:
          - "production SURVEYED -> PLANNED via recompute_production_stage (which also aborts SCHEDULED rehearsals and sets readiness_hold)"

  - entity: PathBooking
    initial_state: RESERVED
    terminal_states: [RELEASED, FAILED_OVER]
    transitions:
      - from: RESERVED
        to: TEST_SCHEDULED
        trigger: "POST /broadcast-ops/path-bookings/{id}/schedule-test"
        actor: TechnicalDirector
        preconditions:
          - "booking.status IN {RESERVED, TEST_FAILED} else ERR_BOOKING_STATE_INVALID"
          - "test_window_end_utc > test_window_start_utc else ERR_INVALID_TIME_WINDOW"
          - "[test_window_start_utc, test_window_end_utc) is contained in [booking.window_start_utc, booking.window_end_utc) else ERR_TEST_WINDOW_INVALID"
        side_effects:
          - "booking.test_window_start_utc and test_window_end_utc set"
      - from: TEST_FAILED
        to: TEST_SCHEDULED
        trigger: "POST /broadcast-ops/path-bookings/{id}/schedule-test (retest)"
        actor: TechnicalDirector
        preconditions:
          - "booking.test_attempt_count < MAX_TEST_ATTEMPTS else ERR_TEST_ATTEMPT_LIMIT"
          - "[test_window_start_utc, test_window_end_utc) is contained in the booking window else ERR_TEST_WINDOW_INVALID"
        side_effects:
          - "a new test window replaces the previous one"
        note: This is the cyclic edge; the loop is bounded by MAX_TEST_ATTEMPTS.
      - from: TEST_SCHEDULED
        to: CONFIRMED
        trigger: "POST /broadcast-ops/path-bookings/{id}/test-result with outcome == PASS"
        actor: TechnicalDirector
        preconditions:
          - "booking.status == TEST_SCHEDULED else ERR_BOOKING_STATE_INVALID"
          - "logical clock now IN [booking.test_window_start_utc, booking.test_window_end_utc) else ERR_TEST_WINDOW_INVALID"
        side_effects:
          - "booking.test_attempt_count += 1"
          - "recompute_production_stage(production) — a PRIMARY confirmation can auto-advance SURVEYED -> PROVISIONED"
      - from: TEST_SCHEDULED
        to: TEST_FAILED
        trigger: "POST /broadcast-ops/path-bookings/{id}/test-result with outcome == FAIL"
        actor: TechnicalDirector
        preconditions:
          - "booking.status == TEST_SCHEDULED else ERR_BOOKING_STATE_INVALID"
          - "logical clock now IN [booking.test_window_start_utc, booking.test_window_end_utc) else ERR_TEST_WINDOW_INVALID"
        side_effects:
          - "booking.test_attempt_count += 1"
          - "recompute_production_stage(production) — a PRIMARY booking leaving CONFIRMED can demote the production"
      - from: CONFIRMED
        to: FAILED_OVER
        trigger: "system — POST /broadcast-ops/show-executions/{id}/incidents with kind == PATH_LOSS (this booking is the PRIMARY carrying the show)"
        actor: system
        preconditions:
          - "booking.booking_role == PRIMARY AND booking.status == CONFIRMED"
        side_effects:
          - "path.committed_mbps_total -= booking.requested_mbps; path.active_booking_count -= 1"
          - "recompute_production_stage(production) is NOT run for ON_AIR productions (step 6)"
      - from: CONFIRMED
        to: PROMOTED
        trigger: "system — PATH_LOSS failover promotes the standby booking"
        actor: system
        preconditions:
          - "booking.booking_role == BACKUP AND booking.status == CONFIRMED AND its production's PRIMARY booking just moved to FAILED_OVER"
        side_effects:
          - "the promoted booking becomes the transport of record; its path keeps its committed_mbps_total contribution"
      - from: RESERVED
        to: RELEASED
        trigger: "POST /broadcast-ops/path-bookings/{id}/release"
        actor: ProductionManager
        preconditions:
          - "booking.status IN {RESERVED, TEST_SCHEDULED, TEST_FAILED, CONFIRMED} else ERR_BOOKING_STATE_INVALID"
        side_effects:
          - "path.committed_mbps_total -= booking.requested_mbps (exactly the amount committed at creation)"
          - "path.active_booking_count -= 1"
          - "recompute_production_stage(production)"
      - from: CONFIRMED
        to: RELEASED
        trigger: "POST /broadcast-ops/path-bookings/{id}/release, or system release of remaining bookings at settle, or supersede by a new PRIMARY booking on the same production"
        actor: ProductionManager | system
        preconditions:
          - "booking.status IN {RESERVED, TEST_SCHEDULED, TEST_FAILED, CONFIRMED} else ERR_BOOKING_STATE_INVALID"
        side_effects:
          - "path.committed_mbps_total -= booking.requested_mbps; path.active_booking_count -= 1"
          - "recompute_production_stage(production) — releasing the only CONFIRMED PRIMARY demotes PROVISIONED/REHEARSED -> SURVEYED"

  - entity: CrewCall
    initial_state: OFFERED
    terminal_states: [DECLINED, RELEASED, CANCELLED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /broadcast-ops/crew-calls/{id}/respond with decision == ACCEPT"
        actor: CrewMember
        preconditions:
          - "X-User-ID == call.crew_member_id else ERR_NOT_CALL_OWNER"
          - "call.status == OFFERED else ERR_CREW_CALL_STATE_INVALID"
        side_effects:
          - "recompute_production_stage(production) — the certified crew component rises"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /broadcast-ops/crew-calls/{id}/respond with decision == DECLINE"
        actor: CrewMember
        preconditions:
          - "X-User-ID == call.crew_member_id else ERR_NOT_CALL_OWNER"
          - "call.status == OFFERED else ERR_CREW_CALL_STATE_INVALID"
        side_effects:
          - "the call stops contributing to production.labor_committed_cents (its provisional reserve is released in full)"
          - "recompute_production_stage(production)"
      - from: OFFERED
        to: CANCELLED
        trigger: "POST /broadcast-ops/crew-calls/{id}/cancel"
        actor: ProductionManager
        preconditions:
          - "call.status IN {OFFERED, ACCEPTED} else ERR_CREW_CALL_STATE_INVALID"
        side_effects:
          - "production.labor_committed_cents -= call.provisional_total_cents (exact compensation)"
          - "recompute_production_stage(production)"
      - from: ACCEPTED
        to: CANCELLED
        trigger: "POST /broadcast-ops/crew-calls/{id}/cancel"
        actor: ProductionManager
        preconditions:
          - "call.status IN {OFFERED, ACCEPTED} else ERR_CREW_CALL_STATE_INVALID"
        side_effects:
          - "production.labor_committed_cents -= call.provisional_total_cents, restoring labor_available_cents to its pre-offer value"
          - "recompute_production_stage(production) — the certified crew component falls, which can demote REHEARSED -> PROVISIONED, which in turn sets readiness_hold on a PRE_SHOW ShowExecution"
      - from: ACCEPTED
        to: RELEASED
        trigger: "POST /broadcast-ops/crew-calls/{id}/release, or system auto-release of remaining ACCEPTED calls at production wrap"
        actor: ProductionManager | system
        preconditions:
          - "call.status == ACCEPTED else ERR_CREW_CALL_STATE_INVALID"
          - "actual_release_utc > call.call_time_utc else ERR_INVALID_TIME_WINDOW"
          - "when meal_break_start_utc is present it lies in [call_time_utc, actual_release_utc] else ERR_INVALID_TIME_WINDOW"
        side_effects:
          - "call.settled_total_cents and call.meal_penalty_units computed by the settled variant of crew_call_labor_cost"
          - "CrewMember.lifetime_meal_penalty_units += call.meal_penalty_units"
          - "production.labor_committed_cents swaps this call's provisional reserve for its settled total"
          - "recompute_production_stage(production)"

  - entity: SystemPrep
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: VALIDATED
        trigger: "POST /broadcast-ops/system-preps/{id}/validate-feed"
        actor: TechnicalDirector
        preconditions:
          - "prep.status IN {PENDING, FAILED} else ERR_PREP_STATE_INVALID"
          - "feed.status == ACTIVE else ERR_FEED_STATE_INVALID"
          - "logical clock now < feed.contract_expiry_utc else ERR_FEED_CONTRACT_EXPIRED"
          - "feed.active_consumer_count < feed.max_concurrent_consumers else ERR_FEED_CONSUMER_LIMIT"
          - "feed.latency_ms <= MAX_FEED_LATENCY_MS (250 ms) (otherwise the prep transitions to FAILED instead, with HTTP 200)"
        side_effects:
          - "prep.feed_validated_at := logical clock now"
          - "feed.active_consumer_count += 1"
          - "recompute_production_stage(production) — reaching required_validated_preps can auto-advance SURVEYED -> PROVISIONED"
      - from: PENDING
        to: FAILED
        trigger: "POST /broadcast-ops/system-preps/{id}/validate-feed when feed.latency_ms > MAX_FEED_LATENCY_MS (250 ms)"
        actor: TechnicalDirector
        preconditions:
          - "prep.status IN {PENDING, FAILED} else ERR_PREP_STATE_INVALID"
          - "feed.status == ACTIVE, feed not expired, consumer limit not reached"
        side_effects:
          - "prep.feed_validated_at stays null; feed.active_consumer_count unchanged"
        note: A data-driven branch, not an error - the request succeeds with HTTP 200 and status FAILED.
      - from: FAILED
        to: VALIDATED
        trigger: "POST /broadcast-ops/system-preps/{id}/validate-feed (retry after the feed's latency was renegotiated on a different feed row)"
        actor: TechnicalDirector
        preconditions:
          - "same preconditions as PENDING -> VALIDATED"
        side_effects:
          - "same side effects as PENDING -> VALIDATED"
      - from: VALIDATED
        to: PENDING
        trigger: "system — POST /broadcast-ops/data-feeds/{id}/suspend invalidates every prep bound to the feed"
        actor: system
        preconditions:
          - "prep.data_feed_id == the suspended feed and prep.status == VALIDATED"
        side_effects:
          - "prep.feed_validated_at := null; feed.active_consumer_count -= 1"
          - "recompute_production_stage(production) — dropping below required_validated_preps demotes PROVISIONED/REHEARSED -> SURVEYED"

  - entity: Rehearsal
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, ABORTED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /broadcast-ops/rehearsals/{id}/outcome with outcome == COMPLETED"
        actor: TechnicalDirector
        preconditions:
          - "rehearsal.status == SCHEDULED else ERR_REHEARSAL_STATE_INVALID"
          - "production.status == PROVISIONED else ERR_PRODUCTION_STATE_INVALID"
          - "camera_blocking_positions_cleared == APPROVED survey.camera_position_count AND venue_signoff == true AND league_ops_signoff == true else ERR_REHEARSAL_SIGNOFF_INCOMPLETE"
        side_effects:
          - "production PROVISIONED -> REHEARSED"
          - "every ShowExecution of the production with air_status == PRE_SHOW gets readiness_hold := false"
      - from: SCHEDULED
        to: ABORTED
        trigger: "POST /broadcast-ops/rehearsals/{id}/outcome with outcome == ABORTED"
        actor: TechnicalDirector
        preconditions:
          - "rehearsal.status == SCHEDULED else ERR_REHEARSAL_STATE_INVALID"
        side_effects:
          - "production.status is left untouched (the divergent branch: no promotion, no readiness_hold change)"
        note: Fork-join branch - COMPLETED and ABORTED share a trigger endpoint but carry disjoint side-effect sets.
      - from: SCHEDULED
        to: ABORTED
        trigger: "system — recompute_production_stage step 3 demotes the production out of {PROVISIONED, REHEARSED}"
        actor: system
        preconditions:
          - "NOT provisioning_conditions(production)"
        side_effects:
          - "rehearsal.outcome_notes := null; the rehearsal must be re-created to reach REHEARSED again"

  - entity: ShowExecution
    dimension: air_status
    initial_state: PRE_SHOW
    terminal_states: [OFF_AIR]
    transitions:
      - from: PRE_SHOW
        to: ON_AIR
        trigger: "POST /broadcast-ops/show-executions/{id}/air-status with target_air_status == ON_AIR"
        actor: TechnicalDirector
        preconditions:
          - "production.status IN {PROVISIONED, REHEARSED} else ERR_PRODUCTION_STATE_INVALID"
          - "show.readiness_hold == false AND production.status == REHEARSED AND production.readiness_score_certified == 100 else ERR_READINESS_NOT_CERTIFIED"
          - "logical clock now < production.venue_curfew_utc else ERR_VENUE_CURFEW_EXCEEDED"
        side_effects:
          - "show.on_air_at_utc := logical clock now; production.status := ON_AIR"
      - from: ON_AIR
        to: IN_EXTENDED_PLAY
        trigger: "POST /broadcast-ops/show-executions/{id}/air-status with target_air_status == IN_EXTENDED_PLAY"
        actor: TechnicalDirector
        preconditions:
          - "show.air_status == ON_AIR else ERR_SHOW_STATE_INVALID"
          - "show.extended_play_minutes >= 1 (at least one EXTENDED_PLAY incident recorded) else ERR_SHOW_STATE_INVALID"
        side_effects:
          - "no accrual change; the dimension only records that the show is past its scheduled end"
      - from: IN_EXTENDED_PLAY
        to: ON_AIR
        trigger: "POST /broadcast-ops/show-executions/{id}/air-status with target_air_status == ON_AIR"
        actor: TechnicalDirector
        preconditions:
          - "show.air_status == IN_EXTENDED_PLAY else ERR_SHOW_STATE_INVALID"
        side_effects:
          - "show.on_air_at_utc is NOT re-stamped"
        note: The cyclic edge of the air dimension - extended play can end and normal play resume.
      - from: ON_AIR
        to: OFF_AIR
        trigger: "POST /broadcast-ops/show-executions/{id}/air-status with target_air_status == OFF_AIR"
        actor: TechnicalDirector
        preconditions:
          - "show.air_status IN {ON_AIR, IN_EXTENDED_PLAY} else ERR_SHOW_STATE_INVALID"
        side_effects:
          - "show.off_air_at_utc := logical clock now; show.air_minutes_total recomputed"
      - from: IN_EXTENDED_PLAY
        to: OFF_AIR
        trigger: "POST /broadcast-ops/show-executions/{id}/air-status with target_air_status == OFF_AIR"
        actor: TechnicalDirector
        preconditions:
          - "show.air_status IN {ON_AIR, IN_EXTENDED_PLAY} else ERR_SHOW_STATE_INVALID"
        side_effects:
          - "show.off_air_at_utc := logical clock now; show.air_minutes_total recomputed"
      - from: ON_AIR
        to: OFF_AIR
        trigger: "system — cumulative technical_downtime_minutes reaches MAX_TECHNICAL_DOWNTIME_MINUTES on incident creation"
        actor: system
        preconditions:
          - "show.technical_downtime_minutes >= MAX_TECHNICAL_DOWNTIME_MINUTES after applying the new incident"
        side_effects:
          - "show.off_air_at_utc := logical clock now; show.air_minutes_total recomputed; the show is forced off air with production.status left at ON_AIR so wrap remains available"

  - entity: ShowExecution
    dimension: signal_status
    initial_state: NOMINAL
    terminal_states: [LOST]
    transitions:
      - from: NOMINAL
        to: ON_BACKUP
        trigger: "POST /broadcast-ops/show-executions/{id}/incidents with kind == PATH_LOSS when a CONFIRMED BACKUP booking exists"
        actor: system
        preconditions:
          - "exists PathBooking(production_id, booking_role=BACKUP, status=CONFIRMED)"
        side_effects:
          - "the PRIMARY booking CONFIRMED -> FAILED_OVER, which decrements its path's committed_mbps_total by requested_mbps"
          - "the BACKUP booking CONFIRMED -> PROMOTED"
      - from: NOMINAL
        to: LOST
        trigger: "POST /broadcast-ops/show-executions/{id}/incidents with kind == PATH_LOSS when no CONFIRMED BACKUP booking exists"
        actor: system
        preconditions:
          - "no PathBooking(production_id, booking_role=BACKUP, status=CONFIRMED)"
        side_effects:
          - "the PRIMARY booking CONFIRMED -> FAILED_OVER"
          - "show.air_status := OFF_AIR and show.off_air_at_utc := logical clock now (the divergent branch of the same trigger)"
      - from: ON_BACKUP
        to: LOST
        trigger: "POST /broadcast-ops/show-executions/{id}/incidents with kind == PATH_LOSS a second time"
        actor: system
        preconditions:
          - "show.signal_status == ON_BACKUP and no further CONFIRMED BACKUP booking exists"
        side_effects:
          - "the PROMOTED booking -> FAILED_OVER, decrementing its path's committed_mbps_total"
          - "show.air_status := OFF_AIR"

# =============================================================================
# 1.2.1 Concurrency Rules  (OCC on Production.version only)
# =============================================================================
concurrency_rules:
  - rule_id: truck-assignment-stale-production
    parent_entity: Production
    write_endpoint: "POST /broadcast-ops/productions/{id}/truck-assignment"
    occ_field: "expected_production_version"
    description: |
      Assigning a truck to a Production whose version has advanced since the client last read it is
      rejected. A truck assignment legitimately supersedes an earlier one (the previously assigned
      truck is returned to AVAILABLE), so a writer holding a stale view of the production would
      silently discard an assignment it never saw.
    error_id: ERR_STALE_PRODUCTION_VERSION
    http_status: 412
  - rule_id: path-booking-create-stale-production
    parent_entity: Production
    write_endpoint: "POST /broadcast-ops/path-bookings"
    occ_field: "expected_production_version"
    description: |
      Creating a PathBooking against a Production whose version has advanced since the client last
      read it is rejected. A new PRIMARY booking legitimately supersedes the production's existing
      PRIMARY booking (releasing it and its bandwidth), so a stale writer would tear down a transport
      arrangement it never observed.
    error_id: ERR_STALE_PRODUCTION_VERSION
    http_status: 412
  - rule_id: crew-call-create-stale-production
    parent_entity: Production
    write_endpoint: "POST /broadcast-ops/crew-calls"
    occ_field: "expected_production_version"
    description: |
      Offering a CrewCall against a Production whose version has advanced since the client last read
      it is rejected. Every offer commits part of labor_budget_total_cents, so a writer whose view of
      labor_available_cents predates another offer would over-commit the budget.
    error_id: ERR_STALE_PRODUCTION_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: crew_call_labor_cost
    trigger: "On POST /broadcast-ops/crew-calls (writes provisional_total_cents) and on CrewCall ACCEPTED -> RELEASED, whether operator-driven or auto-released at wrap (writes settled_total_cents and meal_penalty_units)"
    algorithm: tiered_pricing
    formula: |
      effective_rate_cents = call.offer_rate_cents if call.offer_rate_cents is not null
                             else crew_member.hourly_rate_cents

      # release_reference depends on the variant (see variants below)
      worked_minutes = max(0, whole_minutes_between(call.call_time_utc, release_reference))

      straight_minutes = min(worked_minutes, STRAIGHT_MINUTES_CAP)                      # 0..600
      ot_minutes       = max(0, min(worked_minutes, DOUBLE_TIME_MINUTES_CAP) - STRAIGHT_MINUTES_CAP)   # 0..120
      dt_minutes       = max(0, worked_minutes - DOUBLE_TIME_MINUTES_CAP)               # beyond 12h

      straight_cents = round_half_up(effective_rate_cents * straight_minutes / 60)
      ot_cents       = round_half_up(effective_rate_cents * OT_MULTIPLIER  * ot_minutes / 60)
      dt_cents       = round_half_up(effective_rate_cents * DT_MULTIPLIER  * dt_minutes / 60)
      labor_cents    = straight_cents + ot_cents + dt_cents      # ROUNDING ORDER PINNED:
                                                                 # each of the three components is
                                                                 # rounded to whole cents FIRST, then
                                                                 # the three are summed. Summing the
                                                                 # unrounded components and rounding
                                                                 # once is the wrong order.

      # meal_penalty_units — variant-specific, see variants below; always capped at MEAL_PENALTY_UNIT_CAP
      penalty_multiplier = TIER_1_PENALTY_MULTIPLIER if production.event_tier == "TIER_1" else 1.0
      penalty_cents = round_half_up(meal_penalty_units * MEAL_PENALTY_UNIT_CENTS * penalty_multiplier)

      total_cents = labor_cents + penalty_cents
    input_set: "Exactly one CrewCall row plus its CrewMember (for hourly_rate_cents) and its Production (for event_tier). No other calls participate."
    constants:
      STRAIGHT_MINUTES_CAP: 600
      DOUBLE_TIME_MINUTES_CAP: 720
      OT_MULTIPLIER: 1.5
      DT_MULTIPLIER: 2.0
      MEAL_WINDOW_MINUTES: 360
      MEAL_PENALTY_INCREMENT_MINUTES: 30
      MEAL_PENALTY_UNIT_CENTS: 3500
      MEAL_PENALTY_UNIT_CAP: 4
      TIER_1_PENALTY_MULTIPLIER: 1.5
    precision: "All money is integer cents; each rounding step is round_half_up to whole cents. Minute differences are whole minutes, truncated toward zero."
    variants:
      - name: provisional_projected
        when: "At CrewCall creation (POST /broadcast-ops/crew-calls); the value written to provisional_total_cents and reserved against the production's labor budget"
        difference: |
          release_reference = call.scheduled_release_utc.
          Meal penalty is a pessimistic forward-looking reserve: the projection assumes NO meal break
          will be taken, so
            meal_penalty_units = 0 if worked_minutes <= MEAL_WINDOW_MINUTES
                                 else min(ceil((worked_minutes - MEAL_WINDOW_MINUTES) / 30), 4)
      - name: settled_actual
        when: "At CrewCall ACCEPTED -> RELEASED; the value written to settled_total_cents"
        difference: |
          release_reference = call.actual_release_utc.
          Meal penalty is chronological, keyed on the break that was actually taken:
            if call.meal_break_start_utc is null:
                meal_penalty_units = 0 if worked_minutes <= 360
                                     else min(ceil((worked_minutes - 360) / 30), 4)
            else:
                delay = whole_minutes_between(call.call_time_utc, call.meal_break_start_utc) - 360
                meal_penalty_units = 0 if delay <= 0 else min(ceil(delay / 30), 4)
          A crew call released early with a timely meal break therefore settles strictly below its
          provisional reserve; the delta lands in Production.labor_variance_cents at settle.

  - name: survey_signal_loss_budget
    trigger: "On POST /broadcast-ops/venue-surveys/{id}/camera-positions (recomputes the survey aggregates) and re-checked as a precondition of POST /broadcast-ops/venue-surveys/{id}/submit"
    algorithm: aggregation
    formula: |
      # per position, evaluated on creation and stored on the CameraPosition row
      position.signal_loss_db = round_half_up(position.cable_run_feet * LOSS_DB_PER_100FT / 100, 2)

      # ROUNDING ORDER PINNED: round per position to 2dp FIRST, then sum the rounded values,
      # then round the sum to 2dp (a no-op given 2dp addends). Summing the unrounded per-position
      # products and rounding once at the end is the WRONG order and yields a smaller total for
      # runs whose exact product ends in a half-cent of a dB.
      survey.total_signal_loss_db = round_half_up(sum over positions of position.signal_loss_db, 2)

      survey.total_cable_run_feet  = sum over positions of position.cable_run_feet
      survey.total_power_draw_amps = sum over positions of position.power_draw_amps
      survey.power_headroom_amps   = production.venue_power_capacity_amps - survey.total_power_draw_amps

      # submit gate (see 1.4 priority 25):
      reject when survey.total_signal_loss_db > MAX_SIGNAL_LOSS_BUDGET_DB   # strictly greater
    input_set: "All CameraPosition rows whose survey_id == this survey, with no status filter (CameraPosition is append-only and has no lifecycle). Summation order is created_at ASC; the sum of 2dp addends is order-independent, and no tie-break is required."
    constants:
      LOSS_DB_PER_100FT: 1.35
      MAX_SIGNAL_LOSS_BUDGET_DB: 10.13
    precision: "signal_loss_db and total_signal_loss_db: 2 decimal places, round_half_up. Amps and feet are integers."

  - name: production_readiness_score
    trigger: "Recomputed by recompute_production_stage on every gating change (survey review, truck-assignment, path test-result, path release, prep validate, feed suspend, crew respond/cancel/release, rehearsal outcome, wrap)"
    algorithm: weighted_scoring
    formula: |
      survey_component       = 40 if exists VenueSurvey(production_id=p.id, status=APPROVED) else 0
      transmission_component = 25 if the variant's transmission predicate holds else 0
      systems_component      = 20 if the variant's validated-prep count >= p.required_validated_preps else 0
      crew_component         = round_half_up(15 * min(1, variant_crew_numerator / p.required_crew_positions), 2)

      score = round_half_up(survey_component + transmission_component
                            + systems_component + crew_component, 2)

      p.required_crew_positions   = REQUIRED_CREW_POSITIONS[p.event_tier]
      p.required_validated_preps  = REQUIRED_VALIDATED_PREPS[p.event_tier]
    input_set: "The production's own VenueSurvey / PathBooking / SystemPrep / CrewCall rows only. Rows belonging to other productions never participate."
    constants:
      REQUIRED_CREW_POSITIONS: { TIER_1: 12, TIER_2: 4, TIER_3: 2 }
      REQUIRED_VALIDATED_PREPS: { TIER_1: 3, TIER_2: 2, TIER_3: 1 }
      SURVEY_WEIGHT: 40
      TRANSMISSION_WEIGHT: 25
      SYSTEMS_WEIGHT: 20
      CREW_WEIGHT: 15
    precision: "2 decimal places, round_half_up, on the crew component and again on the total."
    variants:
      - name: preflight_projection
        when: "Always computed and exposed as Production.readiness_score_preflight; the planning/go-no-go view"
        difference: |
          Forward-looking - assumes scheduled work will succeed:
            transmission predicate: exists PathBooking(booking_role=PRIMARY,
                                    status IN {RESERVED, TEST_SCHEDULED, CONFIRMED, PROMOTED})
            validated-prep count:   count(SystemPrep with status IN {PENDING, VALIDATED})
            crew numerator:         count(CrewCall with status IN {OFFERED, ACCEPTED})
          TEST_FAILED / RELEASED / FAILED_OVER bookings, FAILED preps and DECLINED / CANCELLED calls
          never count in either variant.
      - name: airtime_certified
        when: "Always computed and exposed as Production.readiness_score_certified; the only variant that gates PRE_SHOW -> ON_AIR (must equal 100)"
        difference: |
          Chronologically certified - counts only work that has already succeeded:
            transmission predicate: exists PathBooking(booking_role=PRIMARY,
                                    status IN {CONFIRMED, PROMOTED})
            validated-prep count:   count(SystemPrep with status == VALIDATED)
            crew numerator:         count(CrewCall with status == ACCEPTED)
          For identical data (approved survey, one RESERVED primary booking, one PENDING prep, one
          OFFERED plus one ACCEPTED call against required_crew_positions = 2) the two variants
          diverge: preflight = 100.00 while certified = 47.50.

  - name: production_settlement
    trigger: "On POST /broadcast-ops/productions/{id}/settle (WRAPPED -> SETTLED)"
    algorithm: waterfall_allocation
    formula: |
      # EVALUATION ORDER IS PINNED AND MATTERS - the fee bracket is keyed on the step-1 subtotal,
      # never on the step-3 total, even though the total is the figure the invoice shows.
      # step 1
      labor_subtotal_cents = sum of settled_total_cents over CrewCall(production_id=p.id,
                             status == RELEASED), summed in created_at ASC order
      # step 2
      overrun_minutes = show.weather_hold_minutes + show.extended_play_minutes
                        # TECHNICAL_FAILURE and PATH_LOSS minutes are excluded from the fee base
      overrun_rate_cents_per_minute =
            OVERRUN_RATE_LOW  if labor_subtotal_cents <  OVERRUN_BRACKET_MID
        else OVERRUN_RATE_MID  if labor_subtotal_cents <  OVERRUN_BRACKET_HIGH
        else OVERRUN_RATE_HIGH
      overrun_fee_cents = overrun_rate_cents_per_minute * overrun_minutes
      # step 3
      settlement_total_cents = labor_subtotal_cents + overrun_fee_cents
      # step 4
      labor_variance_cents = labor_subtotal_cents
                             - (sum of provisional_total_cents over the same RELEASED calls)
    input_set: "CrewCall rows of this production with status == RELEASED only (OFFERED / ACCEPTED / DECLINED / CANCELLED rows are excluded), plus the production's single ShowExecution row for the overrun minutes. When the production has no ShowExecution, overrun_minutes = 0."
    constants:
      OVERRUN_BRACKET_MID: 500000
      OVERRUN_BRACKET_HIGH: 2000000
      OVERRUN_RATE_LOW: 1200
      OVERRUN_RATE_MID: 1800
      OVERRUN_RATE_HIGH: 2400
    precision: "Integer cents throughout; no rounding step is required because every input is already an integer."

  - name: path_window_load_mbps
    trigger: "On POST /broadcast-ops/path-bookings, before the booking row is created"
    algorithm: interval_merge
    formula: |
      ACTIVE = {RESERVED, TEST_SCHEDULED, TEST_FAILED, CONFIRMED, PROMOTED}

      if path.path_type == "FIBER":
        # AGGREGATE-CAPACITY GEOMETRY: concurrent bookings share the circuit; half-open windows,
        # so a booking that starts exactly when another ends is NOT concurrent.
        concurrent = PathBooking(path_id=path.id, status IN ACTIVE)
                     where existing.window_start_utc < new.window_end_utc
                       and new.window_start_utc      < existing.window_end_utc
        reject when sum(concurrent.requested_mbps) + new.requested_mbps > path.capacity_mbps
                    -> ERR_PATH_CAPACITY_EXCEEDED     # equality is accepted

      if path.path_type == "SATELLITE":
        # EXCLUSIVE-OCCUPANCY GEOMETRY WITH SYMMETRIC GUARD BAND: a transponder cannot be shared
        # at all, and each occupation is inflated by guard_band_minutes on BOTH ends before the
        # overlap test. requested_mbps plays no part in the decision.
        reject when exists PathBooking(path_id=path.id, status IN ACTIVE) such that
            new.window_start_utc < existing.window_end_utc   + guard_band_minutes
        and existing.window_start_utc - guard_band_minutes < new.window_end_utc
                    -> ERR_PATH_WINDOW_CONFLICT       # a gap of exactly guard_band_minutes is accepted
    input_set: "PathBooking rows on the same path with status IN {RESERVED, TEST_SCHEDULED, TEST_FAILED, CONFIRMED, PROMOTED}. RELEASED and FAILED_OVER bookings are invisible to both geometries."
    constants: {}
    precision: "Whole minutes; window boundaries are compared as instants."

  - name: path_committed_mbps_total
    trigger: "Recomputed on every PathBooking status change (create, release, failover, promotion, settle-time release)"
    algorithm: aggregation
    formula: |
      path.committed_mbps_total = sum of requested_mbps over PathBooking(path_id=path.id,
                                  status IN {RESERVED, TEST_SCHEDULED, TEST_FAILED, CONFIRMED, PROMOTED})
      path.active_booking_count = count of the same row set
      # CONSERVED QUANTITY: for every path,
      #   committed_mbps_total == sum(requested_mbps of its ACTIVE bookings)
      # holds after every request. Creating a booking adds exactly requested_mbps; releasing or
      # failing it over subtracts exactly requested_mbps, so a create/release pair leaves the value
      # bit-identical to its pre-create value.
    input_set: "All PathBooking rows on the path, filtered to the five ACTIVE statuses; summed in created_at ASC order."
    constants: {}
    precision: "Integer Mbps."

  - name: production_labor_commitment
    trigger: "Recomputed by recompute_production_stage step 1 on every crew-call status change and at wrap"
    algorithm: aggregation
    formula: |
      labor_committed_cents = sum of provisional_total_cents over CrewCall(production_id=p.id,
                                  status IN {OFFERED, ACCEPTED})
                            + sum of settled_total_cents over CrewCall(production_id=p.id,
                                  status == RELEASED)
      labor_available_cents = labor_budget_total_cents - labor_committed_cents
      # CONSERVED QUANTITY: labor_budget_total_cents == labor_committed_cents + labor_available_cents
      # after every request. An offer commits exactly provisional_total_cents; DECLINE and CANCEL
      # release exactly that amount, restoring labor_available_cents to its pre-offer value.
      # budget gate (see 1.4 priority 27):
      #   reject a new offer when labor_committed_cents + candidate.provisional_total_cents
      #                           > labor_budget_total_cents   -> ERR_LABOR_BUDGET_EXCEEDED
      #   (equality is accepted)
    input_set: "CrewCall rows of this production in statuses {OFFERED, ACCEPTED, RELEASED}; DECLINED and CANCELLED rows contribute nothing. Summed in created_at ASC order."
    constants: {}
    precision: "Integer cents."

  - name: crew_turnaround_reference
    trigger: "On POST /broadcast-ops/crew-calls, before the row is created"
    algorithm: chronological
    formula: |
      # Candidate set: the member's other calls that still occupy them.
      candidates = CrewCall(crew_member_id = new.crew_member_id,
                            status IN {OFFERED, ACCEPTED, RELEASED})
      reference_release(c) = c.actual_release_utc if c.status == RELEASED
                             else c.scheduled_release_utc
      # Selector: the latest-releasing candidate. Ranking key: reference_release(c) DESC.
      # Tie-break when two candidates share the same reference_release: c.created_at ASC
      # (never c.id). Empty candidate set: no turnaround rule applies and
      # turnaround_minutes_before_call is written as null.
      prior = first(candidates ordered by reference_release DESC, created_at ASC)

      turnaround_minutes_before_call =
          whole_minutes_between(reference_release(prior), new.call_time_utc)   # may be negative

      # INTERVAL GEOMETRY: a DIRECTIONAL MINIMUM-REST GAP on the CrewMember resource, not an
      # overlap test. Any value below the minimum is rejected, including negative values (which is
      # how a genuinely overlapping call is caught).
      reject when turnaround_minutes_before_call < TURNAROUND_MINUTES
                  -> ERR_CREW_TURNAROUND_VIOLATION      # exactly TURNAROUND_MINUTES is accepted
    input_set: "The member's CrewCall rows in statuses {OFFERED, ACCEPTED, RELEASED} across ALL productions; DECLINED and CANCELLED rows are excluded, which is what makes a cancelled call free the member immediately."
    constants:
      TURNAROUND_MINUTES: 600
    precision: "Whole minutes."

  - name: truck_travel_occupation_window
    trigger: "On POST /broadcast-ops/productions/{id}/truck-assignment, before truck_id is written"
    algorithm: interval_merge
    formula: |
      # INTERVAL GEOMETRY: ASYMMETRIC BUFFERS around the event on the ProductionTruck resource -
      # a long travel-in leg and a shorter tear-down leg, half-open at both ends.
      occupation(p) = [ p.scheduled_start_utc - TRAVEL_IN_HOURS hours,
                        p.scheduled_end_utc   + TEARDOWN_OUT_HOURS hours )

      others = Production(truck_id = truck.id, status IN {PLANNED, SURVEYED, PROVISIONED,
                          REHEARSED, ON_AIR})      # WRAPPED and SETTLED productions release the truck
      reject when exists o in others such that
            occupation(new).start < occupation(o).end
        and occupation(o).start   < occupation(new).end
                  -> ERR_TRUCK_TRAVEL_WINDOW_CONFLICT
      # Half-open: an occupation starting exactly when another ends is accepted.
    input_set: "Productions already holding this truck whose status is not WRAPPED or SETTLED."
    constants:
      TRAVEL_IN_HOURS: 24
      TEARDOWN_OUT_HOURS: 12
    precision: "Whole minutes; buffers are exact hour offsets."

  - name: truck_service_accrual
    trigger: "On POST /broadcast-ops/productions/{id}/wrap (ProductionTruck ASSIGNED -> IN_TRANSIT) and re-read on POST /broadcast-ops/trucks/{id}/arrive"
    algorithm: threshold
    formula: |
      accrued_hours = TRAVEL_HOURS_PER_EVENT + SETUP_TEARDOWN_HOURS
                      + ceil(show.air_minutes_total / 60)        # 0 when the show never went on air
      truck.engine_hours_since_service = truck.engine_hours_since_service + accrued_hours
      truck.hours_to_service = truck.service_interval_hours - truck.engine_hours_since_service

      # threshold evaluated on arrive, AT-OR-ABOVE semantics:
      on arrive: truck.status := IN_MAINTENANCE
                 if truck.engine_hours_since_service >= truck.service_interval_hours
                 else AVAILABLE
    input_set: "The single ShowExecution row of the wrapped production (air_minutes_total) plus the truck's own counters."
    constants:
      TRAVEL_HOURS_PER_EVENT: 8
      SETUP_TEARDOWN_HOURS: 4
    precision: "Whole hours; ceil on the air-minutes conversion."

  - name: show_incident_accrual
    trigger: "On POST /broadcast-ops/show-executions/{id}/incidents"
    algorithm: chronological
    formula: |
      # Each incident is appended to the log and folded into exactly one accumulator, in request
      # order (created_at ASC); no incident is ever re-read or re-scaled.
      kind == WEATHER_HOLD       -> show.weather_hold_minutes       += duration_minutes
      kind == EXTENDED_PLAY      -> show.extended_play_minutes      += duration_minutes
      kind == TECHNICAL_FAILURE  -> show.technical_downtime_minutes += duration_minutes
      kind == PATH_LOSS          -> show.technical_downtime_minutes += duration_minutes

      # threshold trigger, AT-OR-ABOVE semantics, evaluated after the accumulator is updated:
      if show.technical_downtime_minutes >= MAX_TECHNICAL_DOWNTIME_MINUTES
         and show.air_status IN {ON_AIR, IN_EXTENDED_PLAY}:
             show.air_status := OFF_AIR; show.off_air_at_utc := logical clock now

      # curfew guard for extended play (see 1.4 priority 24):
      if kind == EXTENDED_PLAY:
          projected_off_air = production.scheduled_end_utc
                              + (show.extended_play_minutes + duration_minutes) minutes
          reject when projected_off_air > production.venue_curfew_utc
                      -> ERR_VENUE_CURFEW_EXCEEDED     # equality is accepted
    input_set: "The single incident being created plus the show's current accumulators; WEATHER_HOLD is the only kind accepted while air_status == PRE_SHOW."
    constants:
      MAX_TECHNICAL_DOWNTIME_MINUTES: 20
    precision: "Whole minutes."

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
# Exactly one error is returned per request: the surviving violation with the LOWEST priority
# number. Every row below is evaluated in this order, and evaluation stops at the first violation.
# Business-rule ordering for this domain (rows 19-50): state -> uniqueness -> regulatory/union
# compliance and broadcast safety -> physical/temporal constraint -> capacity -> fiscal. Union and
# venue-safety rules deliberately outrank money: a turnaround violation is reported even when the
# same request would also blow the labor budget.
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-empty (a header sent as an empty or whitespace-only string counts as absent)"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "The X-User-Role value is one of the five declared roles AND appears in the target endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: |
      Request body and query schema: every required field present; types match; enum values in range;
      integers within their declared bounds (camera_channel_capacity >= 1, cable_run_feet >= 1,
      requested_mbps >= 1, duration_minutes >= 1, labor_budget_total_cents >= 0, limit in 1..100,
      offset >= 0); datetimes are ISO-8601 instants; truck_code is unique across trucks;
      offer_rate_cents is REQUIRED when the referenced CrewMember.employment_type == FREELANCE and
      FORBIDDEN when it is STAFF; replay_channel_count is REQUIRED when system_kind == REPLAY and
      FORBIDDEN otherwise; production.venue_curfew_utc > scheduled_end_utc.
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 4
    category: existence
    check: "The production named by the path {id} or by the body's production_id exists"
    error_id: ERR_PRODUCTION_NOT_FOUND
    http_status: 404
    applies_to: "all /productions/{id}/* endpoints, POST /broadcast-ops/venue-surveys, POST /broadcast-ops/path-bookings, POST /broadcast-ops/crew-calls, POST /broadcast-ops/system-preps, POST /broadcast-ops/rehearsals, POST /broadcast-ops/show-executions"
  - priority: 5
    category: existence
    check: "The truck named by the path {id} or by the body's truck_id exists"
    error_id: ERR_TRUCK_NOT_FOUND
    http_status: 404
    applies_to: "GET /broadcast-ops/trucks/{id}, POST /broadcast-ops/trucks/{id}/arrive, POST /broadcast-ops/trucks/{id}/service-complete, POST /broadcast-ops/productions/{id}/truck-assignment"
  - priority: 6
    category: existence
    check: "The venue survey named by the path {id} exists"
    error_id: ERR_SURVEY_NOT_FOUND
    http_status: 404
    applies_to: "GET /broadcast-ops/venue-surveys/{id}, POST /broadcast-ops/venue-surveys/{id}/camera-positions, GET /broadcast-ops/venue-surveys/{id}/camera-positions, POST /broadcast-ops/venue-surveys/{id}/submit, POST /broadcast-ops/venue-surveys/{id}/review"
  - priority: 7
    category: existence
    check: "The transmission path named by the body's path_id or the path {id} exists"
    error_id: ERR_PATH_NOT_FOUND
    http_status: 404
    applies_to: "GET /broadcast-ops/transmission-paths/{id}, POST /broadcast-ops/path-bookings"
  - priority: 8
    category: existence
    check: "The path booking named by the path {id} exists"
    error_id: ERR_BOOKING_NOT_FOUND
    http_status: 404
    applies_to: "GET /broadcast-ops/path-bookings/{id}, POST /broadcast-ops/path-bookings/{id}/schedule-test, POST /broadcast-ops/path-bookings/{id}/test-result, POST /broadcast-ops/path-bookings/{id}/release"
  - priority: 9
    category: existence
    check: "The crew member named by the body's crew_member_id or the path {id} exists"
    error_id: ERR_CREW_MEMBER_NOT_FOUND
    http_status: 404
    applies_to: "GET /broadcast-ops/crew-members/{id}, POST /broadcast-ops/crew-calls"
  - priority: 10
    category: existence
    check: "The crew call named by the path {id} exists"
    error_id: ERR_CREW_CALL_NOT_FOUND
    http_status: 404
    applies_to: "GET /broadcast-ops/crew-calls/{id}, POST /broadcast-ops/crew-calls/{id}/respond, POST /broadcast-ops/crew-calls/{id}/release, POST /broadcast-ops/crew-calls/{id}/cancel"
  - priority: 11
    category: existence
    check: "The data feed named by the body's data_feed_id or the path {id} exists"
    error_id: ERR_FEED_NOT_FOUND
    http_status: 404
    applies_to: "GET /broadcast-ops/data-feeds/{id}, POST /broadcast-ops/data-feeds/{id}/suspend, POST /broadcast-ops/system-preps"
  - priority: 12
    category: existence
    check: "The system prep named by the path {id} exists"
    error_id: ERR_PREP_NOT_FOUND
    http_status: 404
    applies_to: "GET /broadcast-ops/system-preps/{id}, POST /broadcast-ops/system-preps/{id}/validate-feed"
  - priority: 13
    category: existence
    check: "The rehearsal named by the path {id} exists"
    error_id: ERR_REHEARSAL_NOT_FOUND
    http_status: 404
    applies_to: "POST /broadcast-ops/rehearsals/{id}/outcome"
  - priority: 14
    category: existence
    check: "The show execution named by the path {id} exists"
    error_id: ERR_SHOW_NOT_FOUND
    http_status: 404
    applies_to: "GET /broadcast-ops/show-executions/{id}, POST /broadcast-ops/show-executions/{id}/air-status, POST /broadcast-ops/show-executions/{id}/incidents, GET /broadcast-ops/show-executions/{id}/incidents"
  - priority: 15
    category: auth
    check: "For the CrewMember role, X-User-ID equals the target crew call's crew_member_id"
    error_id: ERR_NOT_CALL_OWNER
    http_status: 403
    applies_to: "POST /broadcast-ops/crew-calls/{id}/respond"
  - priority: 16
    category: auth
    check: |
      Segregation of duties on X-User-ID:
        review  — X-User-ID != survey.submitted_by_user_id
        settle  — X-User-ID != production.wrapped_by_user_id
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /broadcast-ops/venue-surveys/{id}/review, POST /broadcast-ops/productions/{id}/settle"
  - priority: 17
    category: state
    check: "expected_production_version equals the referenced production's current version (OCC; see 1.2.1)"
    error_id: ERR_STALE_PRODUCTION_VERSION
    http_status: 412
    applies_to: "POST /broadcast-ops/productions/{id}/truck-assignment, POST /broadcast-ops/path-bookings, POST /broadcast-ops/crew-calls"
  - priority: 18
    category: business_temporal
    check: |
      Intra-request window sanity, before any cross-entity work:
        booking      — window_end_utc > window_start_utc
        crew call     — scheduled_release_utc > call_time_utc
        crew release  — actual_release_utc > call_time_utc, and when meal_break_start_utc is present
                        it lies within [call_time_utc, actual_release_utc]
        rehearsal     — scheduled_start_utc < production.scheduled_start_utc
        clock         — to_iso8601 is a valid instant
    error_id: ERR_INVALID_TIME_WINDOW
    http_status: 422
    applies_to: "POST /broadcast-ops/path-bookings, POST /broadcast-ops/path-bookings/{id}/schedule-test, POST /broadcast-ops/crew-calls, POST /broadcast-ops/crew-calls/{id}/release, POST /broadcast-ops/rehearsals, POST /broadcast-ops/_clock/set_current_utc"
  - priority: 19
    category: state
    check: |
      The referenced production is in a stage that permits the operation:
        truck-assignment / venue-surveys / path-bookings / crew-calls / system-preps
                          — production.status NOT IN {ON_AIR, WRAPPED, SETTLED}
        rehearsals create — production.status IN {PROVISIONED, REHEARSED}
        rehearsal outcome COMPLETED — production.status == PROVISIONED
        show-executions create — production.status IN {REHEARSED, PROVISIONED}
        air-status ON_AIR — production.status IN {PROVISIONED, REHEARSED} (the REHEARSED
                            requirement itself is enforced at priority 39, so a cascade-demoted
                            production is told about readiness, not about its stage)
        wrap              — production.status == ON_AIR
        settle            — production.status == WRAPPED
    error_id: ERR_PRODUCTION_STATE_INVALID
    http_status: 409
    applies_to: "POST /broadcast-ops/productions/{id}/truck-assignment, POST /broadcast-ops/productions/{id}/wrap, POST /broadcast-ops/productions/{id}/settle, POST /broadcast-ops/venue-surveys, POST /broadcast-ops/path-bookings, POST /broadcast-ops/crew-calls, POST /broadcast-ops/system-preps, POST /broadcast-ops/rehearsals, POST /broadcast-ops/rehearsals/{id}/outcome, POST /broadcast-ops/show-executions, POST /broadcast-ops/show-executions/{id}/air-status"
  - priority: 20
    category: state
    check: |
      The truck is in a status that permits the operation:
        truck-assignment  — truck.status IN {AVAILABLE, ASSIGNED} (an ASSIGNED truck may take a
                            second, non-overlapping remote; the travel-window rule at priority 46
                            is what actually serialises it)
        arrive            — truck.status == IN_TRANSIT
        service-complete  — truck.status == IN_MAINTENANCE
    error_id: ERR_TRUCK_STATE_INVALID
    http_status: 409
    applies_to: "POST /broadcast-ops/productions/{id}/truck-assignment, POST /broadcast-ops/trucks/{id}/arrive, POST /broadcast-ops/trucks/{id}/service-complete"
  - priority: 21
    category: state
    check: |
      The survey is in a status that permits the operation:
        camera-positions add — survey.status IN {DRAFT, CHANGES_REQUESTED}
        submit               — survey.status == DRAFT
        review               — survey.status == SUBMITTED
    error_id: ERR_SURVEY_STATE_INVALID
    http_status: 409
    applies_to: "POST /broadcast-ops/venue-surveys/{id}/camera-positions, POST /broadcast-ops/venue-surveys/{id}/submit, POST /broadcast-ops/venue-surveys/{id}/review"
  - priority: 22
    category: state
    check: |
      The booking is in a status that permits the operation:
        schedule-test — booking.status IN {RESERVED, TEST_FAILED}
        test-result   — booking.status == TEST_SCHEDULED
        release       — booking.status IN {RESERVED, TEST_SCHEDULED, TEST_FAILED, CONFIRMED}
    error_id: ERR_BOOKING_STATE_INVALID
    http_status: 409
    applies_to: "POST /broadcast-ops/path-bookings/{id}/schedule-test, POST /broadcast-ops/path-bookings/{id}/test-result, POST /broadcast-ops/path-bookings/{id}/release"
  - priority: 23
    category: state
    check: |
      The crew call is in a status that permits the operation:
        respond — call.status == OFFERED
        release — call.status == ACCEPTED
        cancel  — call.status IN {OFFERED, ACCEPTED}
    error_id: ERR_CREW_CALL_STATE_INVALID
    http_status: 409
    applies_to: "POST /broadcast-ops/crew-calls/{id}/respond, POST /broadcast-ops/crew-calls/{id}/release, POST /broadcast-ops/crew-calls/{id}/cancel"
  - priority: 24
    category: state
    check: "validate-feed requires prep.status IN {PENDING, FAILED}; an already VALIDATED prep cannot be re-validated"
    error_id: ERR_PREP_STATE_INVALID
    http_status: 409
    applies_to: "POST /broadcast-ops/system-preps/{id}/validate-feed"
  - priority: 25
    category: state
    check: "Cross-entity state dependency: the prep's DataFeed must have status == ACTIVE to create a prep against it or to validate it; suspend requires feed.status == ACTIVE"
    error_id: ERR_FEED_STATE_INVALID
    http_status: 409
    applies_to: "POST /broadcast-ops/system-preps, POST /broadcast-ops/system-preps/{id}/validate-feed, POST /broadcast-ops/data-feeds/{id}/suspend"
  - priority: 26
    category: state
    check: "outcome requires rehearsal.status == SCHEDULED; a COMPLETED or ABORTED rehearsal is terminal"
    error_id: ERR_REHEARSAL_STATE_INVALID
    http_status: 409
    applies_to: "POST /broadcast-ops/rehearsals/{id}/outcome"
  - priority: 27
    category: state
    check: |
      The show execution's air dimension permits the operation:
        air-status ON_AIR            — show.air_status IN {PRE_SHOW, IN_EXTENDED_PLAY}
        air-status IN_EXTENDED_PLAY  — show.air_status == ON_AIR AND show.extended_play_minutes >= 1
        air-status OFF_AIR           — show.air_status IN {ON_AIR, IN_EXTENDED_PLAY}
        incidents of kind TECHNICAL_FAILURE / EXTENDED_PLAY / PATH_LOSS — show.air_status IN {ON_AIR, IN_EXTENDED_PLAY}
        incidents of kind WEATHER_HOLD — show.air_status IN {PRE_SHOW, ON_AIR, IN_EXTENDED_PLAY}
    error_id: ERR_SHOW_STATE_INVALID
    http_status: 409
    applies_to: "POST /broadcast-ops/show-executions/{id}/air-status, POST /broadcast-ops/show-executions/{id}/incidents"
  - priority: 28
    category: business_constraint
    check: "A production may not have two surveys open at once: creating a survey is rejected when an existing survey of the production is in {DRAFT, SUBMITTED, CHANGES_REQUESTED}"
    error_id: ERR_SURVEY_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /broadcast-ops/venue-surveys"
  - priority: 29
    category: business_constraint
    check: "At most one SystemPrep per (production_id, system_kind) in status {PENDING, VALIDATED, FAILED} - i.e. per production per kind, unconditionally"
    error_id: ERR_DUPLICATE_PREP_KIND
    http_status: 409
    applies_to: "POST /broadcast-ops/system-preps"
  - priority: 30
    category: business_constraint
    check: "At most one CrewCall per (production_id, crew_member_id) in status {OFFERED, ACCEPTED, RELEASED}; DECLINED and CANCELLED calls do not block a re-offer"
    error_id: ERR_DUPLICATE_CREW_CALL
    http_status: 409
    applies_to: "POST /broadcast-ops/crew-calls"
  - priority: 31
    category: business_temporal
    check: "The requested test window must satisfy test_window_end_utc > test_window_start_utc and be fully contained in [booking.window_start_utc, booking.window_end_utc); at test-result time, the logical clock must lie in [test_window_start_utc, test_window_end_utc)"
    error_id: ERR_TEST_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /broadcast-ops/path-bookings/{id}/schedule-test, POST /broadcast-ops/path-bookings/{id}/test-result"
  - priority: 32
    category: business_constraint
    check: "submit is rejected once survey.revision > MAX_SURVEY_REVISIONS (3): the DRAFT<->CHANGES_REQUESTED loop is bounded"
    error_id: ERR_SURVEY_REVISION_LIMIT
    http_status: 409
    applies_to: "POST /broadcast-ops/venue-surveys/{id}/submit"
  - priority: 33
    category: business_constraint
    check: "schedule-test is rejected once booking.test_attempt_count >= MAX_TEST_ATTEMPTS (3): the TEST_SCHEDULED<->TEST_FAILED loop is bounded"
    error_id: ERR_TEST_ATTEMPT_LIMIT
    http_status: 409
    applies_to: "POST /broadcast-ops/path-bookings/{id}/schedule-test"
  - priority: 34
    category: business_safety
    check: "Data-rights compliance: validate-feed is rejected when the logical clock is at or after feed.contract_expiry_utc"
    error_id: ERR_FEED_CONTRACT_EXPIRED
    http_status: 422
    applies_to: "POST /broadcast-ops/system-preps/{id}/validate-feed"
  - priority: 35
    category: business_constraint
    check: "validate-feed is rejected when feed.active_consumer_count >= feed.max_concurrent_consumers (equality blocks; the count only includes preps currently in VALIDATED)"
    error_id: ERR_FEED_CONSUMER_LIMIT
    http_status: 409
    applies_to: "POST /broadcast-ops/system-preps/{id}/validate-feed"
  - priority: 36
    category: business_safety
    check: "Union/craft compliance: the production's event_tier must appear in crew_member.certified_tiers"
    error_id: ERR_CREW_TIER_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /broadcast-ops/crew-calls"
  - priority: 37
    category: business_safety
    check: "Union turnaround: minutes between the member's most recent prior reference release and the new call_time_utc must be >= TURNAROUND_MINUTES (600); see calculations.crew_turnaround_reference"
    error_id: ERR_CREW_TURNAROUND_VIOLATION
    http_status: 422
    applies_to: "POST /broadcast-ops/crew-calls"
  - priority: 38
    category: business_safety
    check: "A COMPLETED rehearsal outcome requires camera_blocking_positions_cleared == the production's APPROVED survey.camera_position_count AND venue_signoff == true AND league_ops_signoff == true"
    error_id: ERR_REHEARSAL_SIGNOFF_INCOMPLETE
    http_status: 422
    applies_to: "POST /broadcast-ops/rehearsals/{id}/outcome"
  - priority: 39
    category: business_safety
    check: |
      Going ON_AIR requires show.readiness_hold == false AND production.status == REHEARSED AND
      production.readiness_score_certified == 100 (the certified variant, never the preflight
      variant). Priority 19 admits both PROVISIONED and REHEARSED productions for this endpoint
      precisely so that a production demoted to PROVISIONED by a cascade lands on this rung
      rather than on the stage rung.
    error_id: ERR_READINESS_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /broadcast-ops/show-executions/{id}/air-status"
  - priority: 40
    category: business_safety
    check: "submit is rejected when survey.camera_position_count == 0: an empty camera plot can never be approved"
    error_id: ERR_SURVEY_NO_CAMERA_POSITIONS
    http_status: 422
    applies_to: "POST /broadcast-ops/venue-surveys/{id}/submit"
  - priority: 41
    category: business_safety
    check: "submit is rejected when survey.total_signal_loss_db > MAX_SIGNAL_LOSS_BUDGET_DB (10.13); equality is accepted. The total is the sum of per-position 2dp values (see calculations.survey_signal_loss_budget)"
    error_id: ERR_SIGNAL_LOSS_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /broadcast-ops/venue-surveys/{id}/submit"
  - priority: 42
    category: business_constraint
    check: |
      Venue power headroom, checked against the same amp budget from two directions:
        submit          — survey.power_headroom_amps >= 0
        truck-assignment — truck.power_draw_amps + survey.total_power_draw_amps
                           <= production.venue_power_capacity_amps (equality accepted), evaluated
                           only when the production already has an APPROVED survey
    error_id: ERR_VENUE_POWER_INSUFFICIENT
    http_status: 422
    applies_to: "POST /broadcast-ops/venue-surveys/{id}/submit, POST /broadcast-ops/productions/{id}/truck-assignment"
  - priority: 43
    category: business_safety
    check: "Truck rating: TIER_ORDER[truck.tier_rating] <= TIER_ORDER[production.event_tier] with TIER_ORDER = {TIER_1: 1, TIER_2: 2, TIER_3: 3}; a TIER_3-rated truck cannot cover a TIER_1 event"
    error_id: ERR_TRUCK_TIER_INSUFFICIENT
    http_status: 422
    applies_to: "POST /broadcast-ops/productions/{id}/truck-assignment"
  - priority: 44
    category: business_constraint
    check: "When the production has an APPROVED survey, survey.camera_position_count <= truck.camera_channel_capacity (equality accepted)"
    error_id: ERR_TRUCK_CHANNEL_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /broadcast-ops/productions/{id}/truck-assignment"
  - priority: 45
    category: business_temporal
    check: |
      Venue curfew:
        air-status ON_AIR — logical clock now < production.venue_curfew_utc
        EXTENDED_PLAY incident — production.scheduled_end_utc + (extended_play_minutes + new
                                 duration_minutes) minutes <= production.venue_curfew_utc
                                 (equality accepted)
    error_id: ERR_VENUE_CURFEW_EXCEEDED
    http_status: 422
    applies_to: "POST /broadcast-ops/show-executions/{id}/air-status, POST /broadcast-ops/show-executions/{id}/incidents"
  - priority: 46
    category: business_temporal
    check: "Truck travel logistics: the requested production's occupation window [scheduled_start_utc - 24h, scheduled_end_utc + 12h) must not overlap the occupation window of any other non-WRAPPED, non-SETTLED production already holding this truck (see calculations.truck_travel_occupation_window)"
    error_id: ERR_TRUCK_TRAVEL_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /broadcast-ops/productions/{id}/truck-assignment"
  - priority: 47
    category: business_referential
    check: "A booking with booking_role == PRIMARY requires path.redundancy_class == PRIMARY_ELIGIBLE; a BACKUP_ONLY path may only carry BACKUP bookings"
    error_id: ERR_PATH_REDUNDANCY_INVALID
    http_status: 422
    applies_to: "POST /broadcast-ops/path-bookings"
  - priority: 48
    category: business_temporal
    check: "SATELLITE paths are exclusive: the new window inflated by guard_band_minutes on both ends must not overlap any ACTIVE booking's window on the same path (a gap of exactly guard_band_minutes is accepted). Evaluated only for path_type == SATELLITE"
    error_id: ERR_PATH_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /broadcast-ops/path-bookings"
  - priority: 49
    category: business_constraint
    check: "FIBER paths are shared: sum(requested_mbps) over ACTIVE bookings whose half-open window overlaps the new one, plus the new requested_mbps, must be <= path.capacity_mbps (equality accepted). Evaluated only for path_type == FIBER"
    error_id: ERR_PATH_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /broadcast-ops/path-bookings"
  - priority: 50
    category: business_fiscal
    check: "Labor budget, evaluated last of all: production.labor_committed_cents + the new call's provisional_total_cents <= production.labor_budget_total_cents (equality accepted)"
    error_id: ERR_LABOR_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /broadcast-ops/crew-calls"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
# All paths carry the api_prefix /broadcast-ops. Read endpoints are open to the four operator roles;
# every write endpoint is restricted to the role that owns that step (see 1.7).
endpoints:

  # --- ProductionTruck ------------------------------------------------------
  - method: POST
    path: "/broadcast-ops/trucks"
    description: "Register a mobile production unit with its channel, power and service-interval specification."
    roles: [ProductionManager]
    code: 201
    input: [truck_code, tier_rating, camera_channel_capacity, power_draw_amps, home_base_code, "engine_hours_since_service?", "service_interval_hours?"]
    output: ProductionTruck
    side_effects: ["status := AVAILABLE", "hours_to_service := service_interval_hours - engine_hours_since_service"]
  - method: GET
    path: "/broadcast-ops/trucks/{id}"
    description: "Read one truck including its engine-hour counters and hours_to_service."
    roles: [ProductionManager, TechnicalDirector, LeagueOperations, UnionSteward]
    code: 200
    input: []
    output: ProductionTruck
    side_effects: []
  - method: GET
    path: "/broadcast-ops/trucks"
    description: "List trucks, filterable by lifecycle status and tier rating."
    roles: [ProductionManager, TechnicalDirector, LeagueOperations, UnionSteward]
    code: 200
    input: ["status?", "tier_rating?", "limit?", "offset?"]
    output: ProductionTruck[]
    side_effects: []
  - method: POST
    path: "/broadcast-ops/trucks/{id}/arrive"
    description: "Record the truck's arrival at its next base after a wrap; the engine-hour threshold decides whether it becomes AVAILABLE or IN_MAINTENANCE."
    roles: [ProductionManager]
    code: 200
    input: []
    output: ProductionTruck
    side_effects: ["IN_TRANSIT -> AVAILABLE when engine_hours_since_service < service_interval_hours", "IN_TRANSIT -> IN_MAINTENANCE when engine_hours_since_service >= service_interval_hours"]
  - method: POST
    path: "/broadcast-ops/trucks/{id}/service-complete"
    description: "Close out a maintenance cycle, resetting the engine-hour baseline."
    roles: [ProductionManager]
    code: 200
    input: []
    output: ProductionTruck
    side_effects: ["IN_MAINTENANCE -> AVAILABLE", "engine_hours_since_service := 0", "hours_to_service := service_interval_hours", "last_service_completed_at := logical clock now"]

  # --- TransmissionPath -----------------------------------------------------
  - method: POST
    path: "/broadcast-ops/transmission-paths"
    description: "Register a satellite transponder or fiber circuit with its capacity, guard band and redundancy class."
    roles: [TechnicalDirector]
    code: 201
    input: [path_code, path_type, carrier_code, capacity_mbps, "guard_band_minutes?", redundancy_class]
    output: TransmissionPath
    side_effects: ["committed_mbps_total := 0", "active_booking_count := 0"]
  - method: GET
    path: "/broadcast-ops/transmission-paths/{id}"
    description: "Read one transmission path including its conserved committed_mbps_total."
    roles: [ProductionManager, TechnicalDirector, LeagueOperations, UnionSteward]
    code: 200
    input: []
    output: TransmissionPath
    side_effects: []

  # --- CrewMember -----------------------------------------------------------
  - method: POST
    path: "/broadcast-ops/crew-members"
    description: "Register a staff or freelance crew member with craft position, union local, certified tiers and card rate."
    roles: [ProductionManager]
    code: 201
    input: [full_name, position, employment_type, union_local, certified_tiers, hourly_rate_cents, home_base_code]
    output: CrewMember
    side_effects: ["lifetime_meal_penalty_units := 0"]
  - method: GET
    path: "/broadcast-ops/crew-members/{id}"
    description: "Read one crew member including lifetime meal-penalty units."
    roles: [ProductionManager, TechnicalDirector, LeagueOperations, UnionSteward]
    code: 200
    input: []
    output: CrewMember
    side_effects: []

  # --- DataFeed -------------------------------------------------------------
  - method: POST
    path: "/broadcast-ops/data-feeds"
    description: "Register a statistics / scoring / tracking data feed with its latency, contract expiry and concurrent-consumer ceiling."
    roles: [TechnicalDirector]
    code: 201
    input: [provider_code, feed_kind, latency_ms, contract_expiry_utc, "max_concurrent_consumers?"]
    output: DataFeed
    side_effects: ["status := ACTIVE", "active_consumer_count := 0"]
  - method: GET
    path: "/broadcast-ops/data-feeds/{id}"
    description: "Read one data feed including its active consumer count."
    roles: [ProductionManager, TechnicalDirector, LeagueOperations, UnionSteward]
    code: 200
    input: []
    output: DataFeed
    side_effects: []
  - method: POST
    path: "/broadcast-ops/data-feeds/{id}/suspend"
    description: "League operations pulls a data feed. Every VALIDATED prep bound to it reverts to PENDING, which can demote the affected productions and hold their shows."
    roles: [LeagueOperations]
    code: 200
    input: []
    output: DataFeed
    side_effects: ["feed.status := SUSPENDED", "every SystemPrep with this data_feed_id and status == VALIDATED -> PENDING with feed_validated_at := null", "feed.active_consumer_count decremented once per reverted prep", "recompute_production_stage on each affected production, which can demote PROVISIONED/REHEARSED -> SURVEYED, abort SCHEDULED rehearsals and set readiness_hold on PRE_SHOW shows"]

  # --- Production -----------------------------------------------------------
  - method: POST
    path: "/broadcast-ops/productions"
    description: "Open a remote production for an event, fixing its tier, venue envelope (power, roof, curfew), air window and labor budget."
    roles: [ProductionManager]
    code: 201
    input: [event_tier, league_code, venue_name, venue_power_capacity_amps, venue_roof_type, venue_curfew_utc, scheduled_start_utc, scheduled_end_utc, labor_budget_total_cents]
    output: Production
    side_effects: ["status := PLANNED", "required_crew_positions and required_validated_preps derived from event_tier", "readiness scores computed (both variants start at 0)", "labor_committed_cents := 0; labor_available_cents := labor_budget_total_cents"]
  - method: GET
    path: "/broadcast-ops/productions/{id}"
    description: "Read one production including both readiness variants, the labor ledger and version (for OCC)."
    roles: [ProductionManager, TechnicalDirector, LeagueOperations, UnionSteward]
    code: 200
    input: []
    output: Production
    side_effects: []
  - method: GET
    path: "/broadcast-ops/productions"
    description: "List productions, filterable by assigned truck, stage and event tier."
    roles: [ProductionManager, TechnicalDirector, LeagueOperations, UnionSteward]
    code: 200
    input: ["truck_id?", "status?", "event_tier?", "limit?", "offset?"]
    output: Production[]
    side_effects: []
  - method: POST
    path: "/broadcast-ops/productions/{id}/truck-assignment"
    description: "Assign (or supersede) the production truck for this remote. OCC-guarded on the production version."
    roles: [ProductionManager]
    code: 200
    input: [truck_id, expected_production_version]
    output: Production
    side_effects: ["new truck AVAILABLE -> ASSIGNED (an already-ASSIGNED truck stays ASSIGNED and is simply held by one more remote)", "any previously assigned truck ASSIGNED -> AVAILABLE when no other non-WRAPPED, non-SETTLED production still holds it", "production.truck_id := truck_id", "recompute_production_stage(production)"]
  - method: POST
    path: "/broadcast-ops/productions/{id}/wrap"
    description: "Tear down the show: auto-release every ACCEPTED crew call at its scheduled release, accrue truck engine hours and send the truck on the road."
    roles: [ProductionManager]
    code: 200
    input: []
    output: Production
    side_effects: ["production ON_AIR -> WRAPPED", "every ACCEPTED CrewCall -> RELEASED with actual_release_utc := scheduled_release_utc, meal_break_start_utc := null, settled totals computed by the settled variant", "CrewMember.lifetime_meal_penalty_units updated per auto-released call", "assigned truck ASSIGNED -> IN_TRANSIT with engine-hour accrual", "production.wrapped_by_user_id := X-User-ID"]
  - method: POST
    path: "/broadcast-ops/productions/{id}/settle"
    description: "Union steward settles the remote: labor subtotal, bracketed overrun fee, labor variance, and release of every remaining path booking. Must be a different operator than the one who wrapped."
    roles: [UnionSteward]
    code: 200
    input: []
    output: Production
    side_effects: ["production WRAPPED -> SETTLED", "labor_variance_cents, overrun_fee_cents and settlement_total_cents written per calculations.production_settlement", "every ACTIVE PathBooking of the production -> RELEASED, each decrementing its path's committed_mbps_total"]

  # --- VenueSurvey / CameraPosition ----------------------------------------
  - method: POST
    path: "/broadcast-ops/venue-surveys"
    description: "Open a venue survey for a production. A replacement survey supersedes the production's APPROVED survey and drops the production back to PLANNED."
    roles: [TechnicalDirector]
    code: 201
    input: [production_id, surveyor_name, fiber_drops_required]
    output: VenueSurvey
    side_effects: ["status := DRAFT; revision := 1", "any APPROVED survey of the production -> SUPERSEDED", "recompute_production_stage(production) — SURVEYED -> PLANNED, aborting SCHEDULED rehearsals and setting readiness_hold on PRE_SHOW shows"]
  - method: GET
    path: "/broadcast-ops/venue-surveys/{id}"
    description: "Read one survey including its camera-plot aggregates and power headroom."
    roles: [ProductionManager, TechnicalDirector, LeagueOperations, UnionSteward]
    code: 200
    input: []
    output: VenueSurvey
    side_effects: []
  - method: GET
    path: "/broadcast-ops/productions/{id}/venue-surveys"
    description: "List every survey of a production, current and superseded."
    roles: [ProductionManager, TechnicalDirector, LeagueOperations, UnionSteward]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: VenueSurvey[]
    side_effects: []
  - method: POST
    path: "/broadcast-ops/venue-surveys/{id}/camera-positions"
    description: "Add a camera position with its cable run and power draw. Adding a position to a CHANGES_REQUESTED survey re-opens it as a new DRAFT revision."
    roles: [TechnicalDirector]
    code: 201
    input: [label, position_type, cable_run_feet, power_draw_amps]
    output: CameraPosition
    side_effects: ["position.signal_loss_db computed and rounded to 2dp", "survey aggregates (camera_position_count, total_cable_run_feet, total_signal_loss_db, total_power_draw_amps, power_headroom_amps) recomputed", "CHANGES_REQUESTED -> DRAFT with revision += 1 and submitted_by_user_id := null"]
  - method: GET
    path: "/broadcast-ops/venue-surveys/{id}/camera-positions"
    description: "List the camera plot of a survey with per-position signal loss."
    roles: [ProductionManager, TechnicalDirector, LeagueOperations, UnionSteward]
    code: 200
    input: ["position_type?", "limit?", "offset?"]
    output: CameraPosition[]
    side_effects: []
  - method: POST
    path: "/broadcast-ops/venue-surveys/{id}/submit"
    description: "Submit the survey for league review. Gated on a non-empty plot, the signal-loss budget and venue power headroom."
    roles: [TechnicalDirector]
    code: 200
    input: []
    output: VenueSurvey
    side_effects: ["DRAFT -> SUBMITTED", "survey.submitted_by_user_id := X-User-ID"]
  - method: POST
    path: "/broadcast-ops/venue-surveys/{id}/review"
    description: "League operations approves the survey or requests changes. The reviewer must be a different operator than the submitter."
    roles: [LeagueOperations]
    code: 200
    input: [decision, "notes?"]
    output: VenueSurvey
    side_effects: ["SUBMITTED -> APPROVED (decision == APPROVE) or -> CHANGES_REQUESTED (decision == REQUEST_CHANGES)", "survey.reviewed_by_user_id := X-User-ID", "on APPROVE: recompute_production_stage(production) — PLANNED -> SURVEYED and possibly on to PROVISIONED"]

  # --- PathBooking ----------------------------------------------------------
  - method: POST
    path: "/broadcast-ops/path-bookings"
    description: "Book a transmission window on a satellite or fiber path as the show's PRIMARY transport or its BACKUP route. OCC-guarded on the production version."
    roles: [TechnicalDirector]
    code: 201
    input: [production_id, path_id, booking_role, window_start_utc, window_end_utc, requested_mbps, expected_production_version]
    output: PathBooking
    side_effects: ["status := RESERVED", "path.committed_mbps_total += requested_mbps; path.active_booking_count += 1", "a pre-existing PRIMARY booking of the same production is RELEASED (its bandwidth returned) AFTER all validations pass", "recompute_production_stage(production)"]
  - method: GET
    path: "/broadcast-ops/path-bookings/{id}"
    description: "Read one path booking including its test window and attempt count."
    roles: [ProductionManager, TechnicalDirector, LeagueOperations, UnionSteward]
    code: 200
    input: []
    output: PathBooking
    side_effects: []
  - method: GET
    path: "/broadcast-ops/path-bookings"
    description: "List path bookings, filterable by production, path, status and booking role."
    roles: [ProductionManager, TechnicalDirector, LeagueOperations, UnionSteward]
    code: 200
    input: ["production_id?", "path_id?", "status?", "booking_role?", "limit?", "offset?"]
    output: PathBooking[]
    side_effects: []
  - method: POST
    path: "/broadcast-ops/path-bookings/{id}/schedule-test"
    description: "Book a transmission-test window inside the booking window. Also the retest edge out of TEST_FAILED, bounded by the attempt limit."
    roles: [TechnicalDirector]
    code: 200
    input: [test_window_start_utc, test_window_end_utc]
    output: PathBooking
    side_effects: ["RESERVED -> TEST_SCHEDULED or TEST_FAILED -> TEST_SCHEDULED", "test_window_start_utc and test_window_end_utc written"]
  - method: POST
    path: "/broadcast-ops/path-bookings/{id}/test-result"
    description: "Record the outcome of the booked transmission test. Must be recorded while the logical clock is inside the test window."
    roles: [TechnicalDirector]
    code: 200
    input: [outcome, "notes?"]
    output: PathBooking
    side_effects: ["TEST_SCHEDULED -> CONFIRMED (PASS) or -> TEST_FAILED (FAIL)", "test_attempt_count += 1", "recompute_production_stage(production) — a PRIMARY confirmation can promote SURVEYED -> PROVISIONED"]
  - method: POST
    path: "/broadcast-ops/path-bookings/{id}/release"
    description: "Hand a booked window back to the carrier, returning its bandwidth to the path."
    roles: [ProductionManager]
    code: 200
    input: []
    output: PathBooking
    side_effects: ["-> RELEASED", "path.committed_mbps_total -= requested_mbps; path.active_booking_count -= 1", "recompute_production_stage(production) — releasing the only CONFIRMED PRIMARY demotes the production"]

  # --- CrewCall -------------------------------------------------------------
  - method: POST
    path: "/broadcast-ops/crew-calls"
    description: "Offer a crew call. Checks tier certification, union turnaround and the labor budget, and reserves the provisional cost. OCC-guarded on the production version."
    roles: [ProductionManager]
    code: 201
    input: [production_id, crew_member_id, call_time_utc, scheduled_release_utc, "offer_rate_cents?", expected_production_version]
    output: CrewCall
    side_effects: ["status := OFFERED", "effective_rate_cents, turnaround_minutes_before_call, meal_penalty_units and provisional_total_cents computed by the provisional variant", "production.labor_committed_cents += provisional_total_cents", "recompute_production_stage(production)"]
  - method: GET
    path: "/broadcast-ops/crew-calls/{id}"
    description: "Read one crew call including both cost variants and its turnaround gap."
    roles: [ProductionManager, TechnicalDirector, LeagueOperations, UnionSteward, CrewMember]
    code: 200
    input: []
    output: CrewCall
    side_effects: []
  - method: GET
    path: "/broadcast-ops/crew-calls"
    description: "List crew calls, filterable by production, crew member and status."
    roles: [ProductionManager, TechnicalDirector, LeagueOperations, UnionSteward, CrewMember]
    code: 200
    input: ["production_id?", "crew_member_id?", "status?", "limit?", "offset?"]
    output: CrewCall[]
    side_effects: []
  - method: POST
    path: "/broadcast-ops/crew-calls/{id}/respond"
    description: "The called crew member accepts or declines. Only the member named on the call may respond."
    roles: [CrewMember]
    code: 200
    input: [decision]
    output: CrewCall
    side_effects: ["OFFERED -> ACCEPTED or OFFERED -> DECLINED", "on DECLINE the provisional reserve is released in full", "recompute_production_stage(production)"]
  - method: POST
    path: "/broadcast-ops/crew-calls/{id}/release"
    description: "Release the crew member, recording the actual release and any meal break. Settles the call under the chronological cost variant."
    roles: [ProductionManager]
    code: 200
    input: [actual_release_utc, "meal_break_start_utc?"]
    output: CrewCall
    side_effects: ["ACCEPTED -> RELEASED", "settled_total_cents and meal_penalty_units computed by the settled variant", "CrewMember.lifetime_meal_penalty_units += meal_penalty_units", "production.labor_committed_cents swaps the provisional reserve for the settled total"]
  - method: POST
    path: "/broadcast-ops/crew-calls/{id}/cancel"
    description: "Cancel an offered or accepted call, releasing its provisional reserve exactly and freeing the member's turnaround."
    roles: [ProductionManager]
    code: 200
    input: []
    output: CrewCall
    side_effects: ["OFFERED/ACCEPTED -> CANCELLED", "production.labor_committed_cents -= provisional_total_cents", "recompute_production_stage(production) — a cancelled ACCEPTED call can demote REHEARSED -> PROVISIONED and set readiness_hold"]

  # --- SystemPrep -----------------------------------------------------------
  - method: POST
    path: "/broadcast-ops/system-preps"
    description: "Open the graphics, statistics or replay preparation for a production against a data feed."
    roles: [TechnicalDirector]
    code: 201
    input: [production_id, data_feed_id, system_kind, "replay_channel_count?"]
    output: SystemPrep
    side_effects: ["status := PENDING"]
  - method: GET
    path: "/broadcast-ops/system-preps/{id}"
    description: "Read one system prep."
    roles: [ProductionManager, TechnicalDirector, LeagueOperations, UnionSteward]
    code: 200
    input: []
    output: SystemPrep
    side_effects: []
  - method: GET
    path: "/broadcast-ops/system-preps"
    description: "List system preps, filterable by production, data feed and status."
    roles: [ProductionManager, TechnicalDirector, LeagueOperations, UnionSteward]
    code: 200
    input: ["production_id?", "data_feed_id?", "status?", "limit?", "offset?"]
    output: SystemPrep[]
    side_effects: []
  - method: POST
    path: "/broadcast-ops/system-preps/{id}/validate-feed"
    description: "Integrate and validate the data feed. A feed slower than the latency ceiling fails the prep with HTTP 200 rather than raising an error."
    roles: [TechnicalDirector]
    code: 200
    input: []
    output: SystemPrep
    side_effects: ["PENDING/FAILED -> VALIDATED when feed.latency_ms <= MAX_FEED_LATENCY_MS (250 ms), else -> FAILED", "on VALIDATED: feed_validated_at := logical clock now and feed.active_consumer_count += 1", "recompute_production_stage(production) — reaching required_validated_preps can promote SURVEYED -> PROVISIONED"]

  # --- Rehearsal ------------------------------------------------------------
  - method: POST
    path: "/broadcast-ops/rehearsals"
    description: "Schedule the rehearsal and camera-blocking session for a provisioned production."
    roles: [TechnicalDirector]
    code: 201
    input: [production_id, scheduled_start_utc]
    output: Rehearsal
    side_effects: ["status := SCHEDULED"]
  - method: GET
    path: "/broadcast-ops/rehearsals/{id}"
    description: "Read one rehearsal including its recorded signoffs."
    roles: [ProductionManager, TechnicalDirector, LeagueOperations, UnionSteward]
    code: 200
    input: []
    output: Rehearsal
    side_effects: []
  - method: GET
    path: "/broadcast-ops/productions/{id}/rehearsals"
    description: "List a production's rehearsals, including those aborted by a readiness cascade."
    roles: [ProductionManager, TechnicalDirector, LeagueOperations, UnionSteward]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Rehearsal[]
    side_effects: []
  - method: POST
    path: "/broadcast-ops/rehearsals/{id}/outcome"
    description: "Record the rehearsal outcome. COMPLETED requires the full camera plot blocked plus venue and league-operations signoff and promotes the production; ABORTED records the session without promoting it."
    roles: [TechnicalDirector]
    code: 200
    input: [outcome, "camera_blocking_positions_cleared?", "venue_signoff?", "league_ops_signoff?", "outcome_notes?"]
    output: Rehearsal
    side_effects: ["SCHEDULED -> COMPLETED: production PROVISIONED -> REHEARSED and readiness_hold cleared on PRE_SHOW shows", "SCHEDULED -> ABORTED: production stage untouched"]

  # --- ShowExecution / Incident --------------------------------------------
  - method: POST
    path: "/broadcast-ops/show-executions"
    description: "Open the show record for a production. Both state dimensions start at PRE_SHOW / NOMINAL."
    roles: [ProductionManager]
    code: 201
    input: [production_id]
    output: ShowExecution
    side_effects: ["air_status := PRE_SHOW; signal_status := NOMINAL; readiness_hold := false"]
  - method: GET
    path: "/broadcast-ops/show-executions/{id}"
    description: "Read one show execution: both state dimensions, the three contingency accumulators and air_minutes_total."
    roles: [ProductionManager, TechnicalDirector, LeagueOperations, UnionSteward]
    code: 200
    input: []
    output: ShowExecution
    side_effects: []
  - method: GET
    path: "/broadcast-ops/productions/{id}/show-executions"
    description: "List a production's show executions."
    roles: [ProductionManager, TechnicalDirector, LeagueOperations, UnionSteward]
    code: 200
    input: ["air_status?", "limit?", "offset?"]
    output: ShowExecution[]
    side_effects: []
  - method: POST
    path: "/broadcast-ops/show-executions/{id}/air-status"
    description: "Drive the air dimension: on air, into and out of extended play, and off air. Going ON_AIR is the only certified-readiness gate."
    roles: [TechnicalDirector]
    code: 200
    input: [target_air_status]
    output: ShowExecution
    side_effects: ["PRE_SHOW -> ON_AIR sets on_air_at_utc and production.status := ON_AIR", "ON_AIR <-> IN_EXTENDED_PLAY without re-stamping on_air_at_utc", "-> OFF_AIR sets off_air_at_utc and recomputes air_minutes_total"]
  - method: POST
    path: "/broadcast-ops/show-executions/{id}/incidents"
    description: "Log a weather hold, extended play, technical failure or transmission-path loss. Each kind folds into a different accumulator and drives a different cascade."
    roles: [TechnicalDirector]
    code: 201
    input: [kind, started_at_utc, duration_minutes, severity, "note?"]
    output: Incident
    side_effects: ["the matching accumulator (weather_hold_minutes / extended_play_minutes / technical_downtime_minutes) increases by duration_minutes", "technical_downtime_minutes >= MAX_TECHNICAL_DOWNTIME_MINUTES forces air_status := OFF_AIR", "kind == PATH_LOSS fails over the PRIMARY booking (CONFIRMED -> FAILED_OVER, bandwidth returned) and either promotes a CONFIRMED BACKUP (signal_status := ON_BACKUP) or drives signal_status := LOST with air_status := OFF_AIR"]
  - method: GET
    path: "/broadcast-ops/show-executions/{id}/incidents"
    description: "List the incident log of a show execution."
    roles: [ProductionManager, TechnicalDirector, LeagueOperations, UnionSteward]
    code: 200
    input: ["kind?", "limit?", "offset?"]
    output: Incident[]
    side_effects: []

  # --- test-driving surface -------------------------------------------------
  - method: POST
    path: "/broadcast-ops/_clock/set_current_utc"
    description: "Set the server's logical clock, which every window, curfew, expiry and threshold rule reads. The clock's startup default is exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time before this endpoint is first called."
    roles: [ProductionManager, TechnicalDirector, LeagueOperations, UnionSteward]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["the logical clock used by test-window containment, contract expiry, curfew and every *_at_utc stamp moves to to_iso8601"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role missing, empty, or whitespace-only on any endpoint"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "X-User-Role is not a declared role, or is not listed in the target endpoint's roles"
  - id: ERR_NOT_CALL_OWNER
    http: 403
    condition: "A CrewMember responds to a crew call whose crew_member_id differs from X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The reviewing operator equals the survey's submitted_by_user_id, or the settling operator equals the production's wrapped_by_user_id"
  # --- schema -------------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, wrong type, out-of-range enum or integer, malformed instant, duplicate truck_code, offer_rate_cents present for a STAFF member or absent for a FREELANCE member, replay_channel_count present for a non-REPLAY prep or absent for a REPLAY prep, venue_curfew_utc not after scheduled_end_utc, limit/offset outside their bounds"
  # --- concurrency --------------------------------------------------------
  - id: ERR_STALE_PRODUCTION_VERSION
    http: 412
    condition: "expected_production_version does not equal the referenced production's current version on truck-assignment, path-booking creation or crew-call creation"
  # --- not found ----------------------------------------------------------
  - id: ERR_PRODUCTION_NOT_FOUND
    http: 404
    condition: "No production with the given path id or body production_id"
  - id: ERR_TRUCK_NOT_FOUND
    http: 404
    condition: "No production truck with the given path id or body truck_id"
  - id: ERR_SURVEY_NOT_FOUND
    http: 404
    condition: "No venue survey with the given path id"
  - id: ERR_PATH_NOT_FOUND
    http: 404
    condition: "No transmission path with the given path id or body path_id"
  - id: ERR_BOOKING_NOT_FOUND
    http: 404
    condition: "No path booking with the given path id"
  - id: ERR_CREW_MEMBER_NOT_FOUND
    http: 404
    condition: "No crew member with the given path id or body crew_member_id"
  - id: ERR_CREW_CALL_NOT_FOUND
    http: 404
    condition: "No crew call with the given path id"
  - id: ERR_FEED_NOT_FOUND
    http: 404
    condition: "No data feed with the given path id or body data_feed_id"
  - id: ERR_PREP_NOT_FOUND
    http: 404
    condition: "No system prep with the given path id"
  - id: ERR_REHEARSAL_NOT_FOUND
    http: 404
    condition: "No rehearsal with the given path id"
  - id: ERR_SHOW_NOT_FOUND
    http: 404
    condition: "No show execution with the given path id"
  # --- state --------------------------------------------------------------
  - id: ERR_PRODUCTION_STATE_INVALID
    http: 409
    condition: "The production's stage does not permit the operation (e.g. booking a path on a SETTLED production, wrapping a production that is not ON_AIR, settling one that is not WRAPPED, completing a rehearsal for a production that is not PROVISIONED)"
  - id: ERR_TRUCK_STATE_INVALID
    http: 409
    condition: "Assigning a truck that is IN_TRANSIT or IN_MAINTENANCE, arriving a truck that is not IN_TRANSIT, or servicing a truck that is not IN_MAINTENANCE"
  - id: ERR_SURVEY_STATE_INVALID
    http: 409
    condition: "Adding a camera position to a SUBMITTED/APPROVED/SUPERSEDED survey, submitting a survey that is not DRAFT, or reviewing one that is not SUBMITTED"
  - id: ERR_BOOKING_STATE_INVALID
    http: 409
    condition: "Scheduling a test on a booking that is not RESERVED or TEST_FAILED, recording a result on one that is not TEST_SCHEDULED, or releasing a RELEASED / FAILED_OVER / PROMOTED booking"
  - id: ERR_CREW_CALL_STATE_INVALID
    http: 409
    condition: "Responding to a call that is not OFFERED, releasing one that is not ACCEPTED, or cancelling one that is already DECLINED, RELEASED or CANCELLED"
  - id: ERR_PREP_STATE_INVALID
    http: 409
    condition: "Validating a prep that is already VALIDATED"
  - id: ERR_FEED_STATE_INVALID
    http: 409
    condition: "Creating or validating a prep against a SUSPENDED data feed, or suspending a feed that is already SUSPENDED"
  - id: ERR_REHEARSAL_STATE_INVALID
    http: 409
    condition: "Recording an outcome on a rehearsal that is already COMPLETED or ABORTED"
  - id: ERR_SHOW_STATE_INVALID
    http: 409
    condition: "An air-status target that is not reachable from the show's current air_status (including entering IN_EXTENDED_PLAY with extended_play_minutes == 0), or logging a TECHNICAL_FAILURE / EXTENDED_PLAY / PATH_LOSS incident on a show that is not ON_AIR or IN_EXTENDED_PLAY"
  # --- uniqueness / bounded loops -----------------------------------------
  - id: ERR_SURVEY_ALREADY_OPEN
    http: 409
    condition: "Creating a venue survey while another survey of the same production is DRAFT, SUBMITTED or CHANGES_REQUESTED"
  - id: ERR_DUPLICATE_PREP_KIND
    http: 409
    condition: "Creating a second SystemPrep for the same (production_id, system_kind)"
  - id: ERR_DUPLICATE_CREW_CALL
    http: 409
    condition: "Offering a second crew call to the same member on the same production while an OFFERED, ACCEPTED or RELEASED call already exists"
  - id: ERR_SURVEY_REVISION_LIMIT
    http: 409
    condition: "Submitting a survey whose revision exceeds MAX_SURVEY_REVISIONS (3)"
  - id: ERR_TEST_ATTEMPT_LIMIT
    http: 409
    condition: "Scheduling a retest on a booking whose test_attempt_count has reached MAX_TEST_ATTEMPTS (3)"
  # --- temporal -----------------------------------------------------------
  - id: ERR_INVALID_TIME_WINDOW
    http: 422
    condition: "window_end_utc <= window_start_utc, scheduled_release_utc <= call_time_utc, actual_release_utc <= call_time_utc, a meal break outside [call_time_utc, actual_release_utc], a rehearsal scheduled at or after the production's scheduled_start_utc, or a malformed clock instant"
  - id: ERR_TEST_WINDOW_INVALID
    http: 422
    condition: "The test window is empty or not fully contained in the booking window, or a test result is recorded while the logical clock is outside [test_window_start_utc, test_window_end_utc)"
  - id: ERR_VENUE_CURFEW_EXCEEDED
    http: 422
    condition: "Going ON_AIR at or after venue_curfew_utc, or logging extended play whose projected off-air passes venue_curfew_utc"
  - id: ERR_TRUCK_TRAVEL_WINDOW_CONFLICT
    http: 409
    condition: "The truck's inflated occupation window [scheduled_start_utc - 24h, scheduled_end_utc + 12h) overlaps that of another non-WRAPPED, non-SETTLED production already holding the truck"
  - id: ERR_PATH_WINDOW_CONFLICT
    http: 409
    condition: "A SATELLITE booking whose guard-band-inflated window overlaps an ACTIVE booking on the same transponder"
  # --- safety / compliance ------------------------------------------------
  - id: ERR_CREW_TIER_NOT_CERTIFIED
    http: 422
    condition: "The production's event_tier is not in the crew member's certified_tiers"
  - id: ERR_CREW_TURNAROUND_VIOLATION
    http: 422
    condition: "Fewer than TURNAROUND_MINUTES (600) minutes between the member's most recent reference release and the new call_time_utc, including negative gaps from overlapping calls"
  - id: ERR_REHEARSAL_SIGNOFF_INCOMPLETE
    http: 422
    condition: "A COMPLETED rehearsal outcome with fewer blocked positions than the approved camera plot, or missing venue or league-operations signoff"
  - id: ERR_READINESS_NOT_CERTIFIED
    http: 422
    condition: "Going ON_AIR while readiness_hold is true, or the production sits at PROVISIONED rather than REHEARSED, or readiness_score_certified is below 100"
  - id: ERR_SURVEY_NO_CAMERA_POSITIONS
    http: 422
    condition: "Submitting a survey with an empty camera plot"
  - id: ERR_SIGNAL_LOSS_BUDGET_EXCEEDED
    http: 422
    condition: "Submitting a survey whose total_signal_loss_db exceeds MAX_SIGNAL_LOSS_BUDGET_DB (10.13)"
  - id: ERR_FEED_CONTRACT_EXPIRED
    http: 422
    condition: "Validating a prep at or after the data feed's contract_expiry_utc"
  - id: ERR_TRUCK_TIER_INSUFFICIENT
    http: 422
    condition: "The truck's tier_rating does not cover the production's event_tier"
  - id: ERR_PATH_REDUNDANCY_INVALID
    http: 422
    condition: "A PRIMARY booking on a BACKUP_ONLY transmission path"
  # --- capacity / fiscal --------------------------------------------------
  - id: ERR_VENUE_POWER_INSUFFICIENT
    http: 422
    condition: "Survey power draw exceeds the venue capacity (power_headroom_amps < 0), or truck draw plus survey draw exceeds venue_power_capacity_amps at truck assignment"
  - id: ERR_TRUCK_CHANNEL_CAPACITY_EXCEEDED
    http: 422
    condition: "The approved camera plot has more positions than the truck's camera_channel_capacity"
  - id: ERR_FEED_CONSUMER_LIMIT
    http: 409
    condition: "Validating a prep when the feed's active_consumer_count has reached max_concurrent_consumers"
  - id: ERR_PATH_CAPACITY_EXCEEDED
    http: 409
    condition: "A FIBER booking whose requested_mbps, added to the overlapping ACTIVE bookings on the same circuit, exceeds capacity_mbps"
  - id: ERR_LABOR_BUDGET_EXCEEDED
    http: 422
    condition: "A crew call whose provisional_total_cents, added to labor_committed_cents, exceeds labor_budget_total_cents"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
# Segregation of duties is enforced on X-User-ID within two roles, not across roles:
#   - LeagueOperations reviews a survey, but never the operator id that submitted it (that id
#     belongs to a TechnicalDirector, so the check compares ids across role boundaries);
#   - UnionSteward settles, but never with the operator id that wrapped the production.
roles:
  - name: ProductionManager
    description: "Owns the physical remote: truck registry and maintenance cycles, truck assignment, crew hiring and release, show records, wrap and tear-down."
    identity: opaque
    exclusive_operations:
      - "POST /broadcast-ops/trucks"
      - "POST /broadcast-ops/trucks/{id}/arrive"
      - "POST /broadcast-ops/trucks/{id}/service-complete"
      - "POST /broadcast-ops/crew-members"
      - "POST /broadcast-ops/productions"
      - "POST /broadcast-ops/productions/{id}/truck-assignment"
      - "POST /broadcast-ops/productions/{id}/wrap"
      - "POST /broadcast-ops/path-bookings/{id}/release"
      - "POST /broadcast-ops/crew-calls"
      - "POST /broadcast-ops/crew-calls/{id}/release"
      - "POST /broadcast-ops/crew-calls/{id}/cancel"
      - "POST /broadcast-ops/show-executions"
    shared_operations:
      - "every GET endpoint"
      - "POST /broadcast-ops/_clock/set_current_utc"
  - name: TechnicalDirector
    description: "Owns the engineering surface: transmission paths and their bookings and tests, venue surveys and camera plots, data feeds, graphics/statistics/replay preparation, rehearsal and live air control."
    identity: opaque
    exclusive_operations:
      - "POST /broadcast-ops/transmission-paths"
      - "POST /broadcast-ops/data-feeds"
      - "POST /broadcast-ops/venue-surveys"
      - "POST /broadcast-ops/venue-surveys/{id}/camera-positions"
      - "POST /broadcast-ops/venue-surveys/{id}/submit"
      - "POST /broadcast-ops/path-bookings"
      - "POST /broadcast-ops/path-bookings/{id}/schedule-test"
      - "POST /broadcast-ops/path-bookings/{id}/test-result"
      - "POST /broadcast-ops/system-preps"
      - "POST /broadcast-ops/system-preps/{id}/validate-feed"
      - "POST /broadcast-ops/rehearsals"
      - "POST /broadcast-ops/rehearsals/{id}/outcome"
      - "POST /broadcast-ops/show-executions/{id}/air-status"
      - "POST /broadcast-ops/show-executions/{id}/incidents"
    shared_operations:
      - "every GET endpoint"
      - "POST /broadcast-ops/_clock/set_current_utc"
  - name: LeagueOperations
    description: "The league's operations desk: reviews and approves venue surveys and controls the rights-bearing data feeds. Cannot survey, book, hire or air anything itself."
    identity: opaque
    exclusive_operations:
      - "POST /broadcast-ops/venue-surveys/{id}/review"
      - "POST /broadcast-ops/data-feeds/{id}/suspend"
    shared_operations:
      - "every GET endpoint"
      - "POST /broadcast-ops/_clock/set_current_utc"
  - name: UnionSteward
    description: "Settles the remote's labor and overrun ledger after wrap. Holds no operational authority, and may not settle a production it wrapped."
    identity: opaque
    exclusive_operations:
      - "POST /broadcast-ops/productions/{id}/settle"
    shared_operations:
      - "every GET endpoint"
      - "POST /broadcast-ops/_clock/set_current_utc"
  - name: CrewMember
    description: "A hired crew member acting on their own calls. X-User-ID is the CrewMember row id, and may only respond to calls whose crew_member_id equals it."
    identity: "entity_backed:CrewMember"
    exclusive_operations:
      - "POST /broadcast-ops/crew-calls/{id}/respond"
    shared_operations:
      - "GET /broadcast-ops/crew-calls/{id}"
      - "GET /broadcast-ops/crew-calls"
