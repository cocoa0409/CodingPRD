              as: Family
              as_user_id: "${fam_id}"
              captures: { bk2: $.data.id }
            - call: "POST /marketplace/bookings/${bk2}/confirm"
              payload: {}
              as: Caregiver
              as_user_id: "${cg_id}"
            - call: "POST /marketplace/_clock/set"
              payload: { to_iso8601: "2026-04-02T08:00:00Z" }
              as: PlatformAdmin
            - call: "GET /marketplace/sessions"
              payload: { booking_id: "${bk2}" }
              as: PlatformAdmin
              captures: { s2: "$.data[0].id" }
            - call: "POST /marketplace/sessions/${s2}/clock-in"
              payload: {}
              as: Caregiver
              as_user_id: "${cg_id}"
            - call: "POST /marketplace/_clock/set"
              payload: { to_iso8601: "2026-04-02T16:30:00Z" }
              as: PlatformAdmin
            - call: "POST /marketplace/sessions/${s2}/clock-out"
              payload: {}
              as: Caregiver
              as_user_id: "${cg_id}"
