            - { call: "POST /api/clients/${cidB}/ingredients", payload: { name: "Wafers", allergen_tags: [], kcal_per_100g: 400, fat_g_per_100g: 8.0, satfat_g_per_100g: 2.0, chol_mg_per_100g: 0, sodium_mg_per_100g: 200, carb_g_per_100g: 70, fiber_g_per_100g: 2.0, sugar_g_per_100g: 20.0, protein_g_per_100g: 5.0 }, as: ClientRep, as_user_id: "${cidB}", captures: { i_wafB: $.data.id } }
