    distinguishing_aspect: A request with neither X-User-Role nor X-User-ID is 401 ERR_UNAUTHENTICATED before any role or existence check — even
      on a path with an unknown id.
    test_recipe:
      setup:
      - Empty database.
      setup_api_calls: []
