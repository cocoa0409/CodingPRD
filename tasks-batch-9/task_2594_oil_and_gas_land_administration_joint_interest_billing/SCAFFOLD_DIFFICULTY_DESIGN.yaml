            - "the obligation run also deemed the June statement settled: JibStatement.${stmt_june_id}.statement_status == SETTLED (payment_due_date 2026-08-09 is past and no dispute was filed)"
      - name: allocation_commitment_depends_on_the_leases_tenure_status
        dependent_entity: WellLeaseAllocation
        depended_on_entity: Lease
        grounds:
          - validations[priority=55, error_id=ERR_LEASE_NOT_ACTIVE]
          - state_machines.Well.UNPOOLED_to_POOLED_FORMING
          - state_machines.Lease.PRIMARY_TERM_to_EXPIRED
          - endpoints.POST_/land-admin/wells/{well_id}/lease-allocations
        dependency: |
          A different entity pair and the opposite direction of reference: the allocation being
          created reads the tenure_status of the Lease it points at. An EXPIRED lease conveys no
          right to pool the acreage, so the commitment is refused even though the target Well is
          brand new and in a perfectly legal UNPOOLED state. The lease that expires here carries
          no allocations at all, which is what lets it expire while the base well keeps L-001 alive
          by production - the two leases move independently.
