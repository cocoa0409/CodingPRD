              as: CrewManager
              captures: { emp1_id: $.data.id }
            - call: "POST /api/employees"
              payload: { employee_number: "E0304", full_name: "Cap Cara", craft: "CONDUCTOR", seniority_date: "2008-01-01T00:00:00Z", home_terminal: "CHI" }
              as: CrewManager
              captures: { emp2_id: $.data.id }
            - call: "POST /api/extra-boards"
              payload: { board_code: "CHI-CONDR-C16", craft: "CONDUCTOR", terminal: "CHI", guaranteed_slots: 2 }
              as: CrewManager
              captures: { board_id: $.data.id }
            - call: "POST /api/extra-boards/${board_id}/slots"
              payload: { employee_id: "${emp1_id}" }
              as: CrewManager
            - call: "POST /api/extra-boards/${board_id}/slots"
              payload: { employee_id: "${emp2_id}" }
              as: CrewManager
            - call: "POST /api/jobs"
              payload: { job_symbol: "M-CHI-C16", craft: "CONDUCTOR", origin_terminal: "CHI", report_time: "2026-08-03T08:00:00Z", crew_required: 1 }
              as: CrewManager
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /api/jobs/${job_id}/calls"
              payload: {}
              as: CrewCaller
              captures: { call1_id: $.data.id, call1_emp: $.data.employee_id }
            - call: "POST /api/jobs/${job_id}/calls"
              payload: {}
              as: CrewCaller
              captures: { call2_id: $.data.id, call2_emp: $.data.employee_id }
            - call: "POST /api/calls/${call1_id}/accept"
              payload: { expected_job_version: "${job_v0}" }
              as: Employee
              as_user_id: "${emp1_id}"
              captures: { asg1_id: $.data.id }
          trigger:
            - call: "GET /api/jobs/${job_id}"
              payload: {}
