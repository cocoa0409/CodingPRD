          setup: "Multi-tenant hall CX77 in FIT_OUT with the minimum topology (PDU-A1, PDU-B1, BW-A1, zone CA-1). Tenant TN77 is contracted for 10.00 kW and owns three PLANNED racks of 8.00, 2.00 and 1.00 kW."
