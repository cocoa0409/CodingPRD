              as: RegulatoryAffairsManager
              captures: { ex: $.data.id }
          trigger:
            - call: "POST /regulatory-exams/board-reports"
              payload: { examination_id: "${ex}", reporting_period_start: "2026-07-01T00:00:00Z", reporting_period_end: "2026-07-31T00:00:00Z" }
              as: BoardReporter
              captures: { br: $.data.id, open_ct: $.data.open_issue_count }
            - call: "POST /regulatory-exams/board-reports/${br}/finalize"
              payload: {}
              as: BoardReporter
              captures: { st: $.data.status }
            - call: "POST /regulatory-exams/board-reports"
              payload: { examination_id: "${ex}", reporting_period_start: "2026-07-01T00:00:00Z", reporting_period_end: "2026-07-31T00:00:00Z" }
              as: RegulatoryAffairsManager
              captures: { err_id: $.data.error_id }
          assert:
            - "open_ct == 0 (no issues yet)"
            - "st == FINALIZED"
            - "err_id == ERR_UNAUTHORIZED (RegulatoryAffairsManager cannot create board reports)"

  # ===================================================================
  # Section: cross-cutting layers
  # ===================================================================
  - section: cross_cutting_layers
    instances:
      - name: cascading_side_effects_chain_end_to_end
        claim_type: cascade_n_level
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: transitive_cascade / milestone_complete_cascades_plan_complete_to_validation_transition
          rationale: "Full 3-hop cascade asserted as the difficulty instance."

      - name: derived_field_reconciliation_posture_recomputed
        claim_type: derived_field_consistency
        grounds: [entities.Examination.fields.posture, calculations.exam_posture]
        excluded_because:
          difficulty_instance: transitive_cascade / document_accept_cascades_item_submitted_to_posture_relaxation
          rationale: "Posture derived-field recomputation asserted as part of cascade."

      - name: clock_default_time_is_2026_08_01
        claim_type: scheduled_actions
        grounds: [endpoints]
        distinguishing_aspect: "Server startup default logical clock reads exactly 2026-08-01T00:00:00Z before any set call."
        test_recipe:
          setup: ["empty DB, no set_current_utc call yet"]
          setup_api_calls: []
          trigger:
            - call: "POST /regulatory-exams/agencies"
              payload: { agency_code: "CD", agency_name: "CD", jurisdiction: "FEDERAL", escalation_threshold_days: 30, repeat_finding_multiplier_bp: 20000 }
              as: PlatformAdmin
              captures: { created: $.data.created_at }
          assert:
            - "created reflects logical clock at or after 2026-08-01T00:00:00Z (the default startup time), not real wall-clock"

  # ===================================================================
  # Section: consistency model
  # ===================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_posture_visible_in_same_response
        claim_type: immediate_visibility
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "After an action that triggers posture recomputation, the GET immediately after shows the new posture (no async lag)."
        test_recipe:
          setup: ["exam with 1 item due 2026-07-20"]
          setup_api_calls:
            - call: "POST /regulatory-exams/agencies"
              payload: { agency_code: "IM", agency_name: "IM", jurisdiction: "FEDERAL", escalation_threshold_days: 30, repeat_finding_multiplier_bp: 20000 }
              as: PlatformAdmin
              captures: { ag: $.data.id }
            - call: "POST /regulatory-exams/examinations"
              payload: { agency_id: "${ag}", exam_cycle_code: "IM", exam_type: "IT", scheduled_start_date: "2026-07-06T00:00:00Z", scheduled_end_date: "2026-07-10T00:00:00Z" }
              as: RegulatoryAffairsManager
              captures: { ex: $.data.id }
            - call: "POST /regulatory-exams/examinations/${ex}/first-day-items"
              payload: { request_ref: "F", description: "d", due_date: "2026-07-20T00:00:00Z" }
              as: RegulatoryAffairsManager
            - call: "POST /regulatory-exams/examinations/${ex}/issue-first-day-letter"
              payload: {}
              as: RegulatoryAffairsManager
          trigger:
            - call: "POST /regulatory-exams/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-21T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /regulatory-exams/examinations/${ex}"
              as: RegulatoryAffairsManager
              captures: { post: $.data.posture }
          assert:
            - "post == RESTRICTED (posture recomputed synchronously during set_current_utc)"
