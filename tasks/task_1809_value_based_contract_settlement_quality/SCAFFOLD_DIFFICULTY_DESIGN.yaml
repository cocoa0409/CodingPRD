            - { call: "POST /vbc/performance-years", payload: { contract_id: "${c1}", year_label: 2026, period_start: "2026-01-01", period_end: "2027-01-01" }, as: PayerAdmin, captures: { y1: $.data.id } }
          trigger:
            - { call: "POST /vbc/performance-years", payload: { contract_id: "${c1}", year_label: 2027, period_start: "2027-01-01", period_end: "2028-01-01" }, as: PayerAdmin, captures: { y2: $.data.id } }
