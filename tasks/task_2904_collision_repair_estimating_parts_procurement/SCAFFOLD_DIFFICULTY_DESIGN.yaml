          - calculations.stall_occupancy_rollup
          - entities.Stall.fields.cleanup_buffer_minutes
          - entities.Stall.fields.booked_minutes
          - errors.ERR_STALL_WINDOW_CONFLICT
        distinguishing_aspect: |
          Resource: Stall. Interval semantics: a symmetric CLOSED exclusion zone of
          cleanup_buffer_minutes on both sides, capacity one. A window starting exactly 30 minutes after
          an existing booking ends is still refused; one further minute is accepted. The buffer widens
          the conflict test only - it never enters booked_minutes.
        test_recipe:
          setup:
            - "One BODY stall with cleanup_buffer_minutes 30, booked_minutes 0."
            - "One repair order (locked, single BODY 4.5 h line) to own the bookings."
            - "One SCHEDULED REPAIR assignment 2026-08-01T08:00:00Z - 12:00:00Z, so occupied_minutes 240 and Stall.booked_minutes 240."
