              as: QaManager
              captures: { line: $.data.id }
            - call: "POST /qa/products"
              payload: { sku: "P-SUP", product_name: "t", allergen_set: ["MILK"], rework_class: "NO_REWORK", label_revision: 1 }
              as: QaManager
              captures: { prod: $.data.id }
            - call: "POST /qa/production-runs"
              payload: { line_id: "${line}", product_id: "${prod}", planned_start_utc: "2026-06-01T08:00:00Z", planned_end_utc: "2026-06-01T10:00:00Z" }
              as: QaSupervisor
              captures: { run: $.data.id, run_snapshot: $.data.label_revision_snapshot }
            - call: "POST /qa/products/${prod}/supplier-allergen-change"
              payload: { new_allergen_set: ["MILK"], supplier_notice_ref: "SN-001" }
              as: QaManager
              captures: { new_rev: $.data.label_revision }
          trigger:
            - call: "GET /qa/incidents?product_id=${prod}"
              as: QaManager
              captures: { inc_type: $.data.0.incident_type }
            - call: "POST /qa/label-reconciliations"
              payload: { run_id: "${run}", printed_label_revision: 2, declared_allergens_on_label: ["MILK"] }
              as: QaSupervisor
              captures: { verdict: $.data.verdict }
          assert:
            - "Product.label_revision == 2 after supplier change"
            - "Run.label_revision_snapshot == 1 (pinned at creation)"
            - "Incident with incident_type == SUPPLIER_ALLERGEN_CHANGE exists for the product"
            - "Reconciliation printed with revision 2 against snapshot 1 yields verdict == REVISION_MISMATCH"

  # ===========================================================================
  # Section: consistency_model — immediate visibility of cascading effects.
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: escalate_immediately_creates_incident_and_holds_line
        claim_type: immediate_consistency
        grounds: ["state_machines.LabelReconciliation.OPEN_to_ESCALATED", "calculations.line_posture"]
        distinguishing_aspect: "Escalating an UNDECLARED_ALLERGEN reconciliation immediately (same request) creates a CRITICAL incident and flips line posture to HOLD — observable on subsequent reads with no delay."
        test_recipe:
          setup: ["Run on a WET_WASH line; reconciliation with missing_allergens=[PEANUT] created"]
          setup_api_calls:
            - call: "POST /qa/allergens"
              payload: { code: "PEANUT", display_name: "Peanut", regulatory_class: "MAJOR_9" }
              as: QaManager
              captures: { al: $.data.id }
            - call: "POST /qa/production-lines"
              payload: { line_code: "LINE-CONS", description: "t", sanitation_class: "WET_WASH" }
              as: QaManager
              captures: { line: $.data.id }
            - call: "POST /qa/products"
              payload: { sku: "P-CONS", product_name: "t", allergen_set: ["PEANUT"], rework_class: "NO_REWORK" }
              as: QaManager
              captures: { prod: $.data.id }
            - call: "POST /qa/production-runs"
              payload: { line_id: "${line}", product_id: "${prod}", planned_start_utc: "2026-06-01T08:00:00Z", planned_end_utc: "2026-06-01T10:00:00Z" }
              as: QaSupervisor
              captures: { run: $.data.id }
            - call: "POST /qa/label-reconciliations"
              payload: { run_id: "${run}", printed_label_revision: 1, declared_allergens_on_label: [] }
              as: QaSupervisor
              captures: { rec: $.data.id }
          trigger:
            - call: "POST /qa/label-reconciliations/${rec}/escalate"
              as: QaSupervisor
              captures: { rec_status: $.data.status }
            - call: "GET /qa/incidents?line_id=${line}"
              as: QaSupervisor
              captures: { inc_type: $.data.0.incident_type, inc_sev: $.data.0.severity }
            - call: "GET /qa/production-lines/${line}"
              as: QaSupervisor
              captures: { posture: $.data.posture }
          assert:
            - "LabelReconciliation.${rec}.status == ESCALATED"
            - "Incident incident_type == UNDECLARED_ALLERGEN and severity == CRITICAL"
            - "ProductionLine.posture == HOLD immediately after escalate"

      - name: excluded_stub_swab_boundary
        claim_type: violation_to_error
        grounds: ["calculations.swab_outcome"]
        excluded_because:
          difficulty_instance: "boundary_precision_check / swab_action_level_exact_equality_is_fail"
          rationale: "Asserted as the primary claim of the named §1.8 instance."
