  - rule_id: resource_temporal_overlap
    instances:

      - name: installation_job_buffered_overlap_conflict
        grounds:
          - validations[priority=12]
          - errors[ERR_UNIT_SCHEDULE_CONFLICT]
          - state_machines.InstallationJob.transitions.SCHEDULED_to_IN_PROGRESS
          - entities.MaintenanceVisit.fields.start_at
          - entities.MaintenanceVisit.fields.end_at
        distinguishing_aspect: "Buffered interval semantics: an InstallationJob occupying a unit must clear a 30-minute buffer around its [scheduled_start_at, +ESTIMATED_INSTALL_MINUTES) span, so a start 15 minutes after an existing maintenance visit ends is still rejected — a different geometric treatment from strict half-open overlap."
