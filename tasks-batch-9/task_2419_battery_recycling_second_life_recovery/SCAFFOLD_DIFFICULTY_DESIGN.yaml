              as: ComplianceOfficer
            - call: "POST /recycling/lots/${lot_id}/discharge-events"
              payload: { allotment_id: "${allot_id}", event_date: "2026-08-01T00:00:00.000Z", mass_kg: 500.0, analyte: "FLUORIDE" }
