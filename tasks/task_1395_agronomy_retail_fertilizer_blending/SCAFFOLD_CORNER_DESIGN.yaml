      - name: rbac_agronomist_cannot_manage_permits
        claim_type: rbac_denied
        grounds:
          - roles.ComplianceOfficer
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "Permit creation is ComplianceOfficer-exclusive; Agronomist denied."
        test_recipe:
          setup: ["empty DB"]
