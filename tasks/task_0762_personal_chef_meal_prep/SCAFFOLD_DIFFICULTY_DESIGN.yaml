# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Personal-Chef Weekly Meal-Prep Service — Expert
# 9 rules x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dual_variant_invoice_perweek_vs_permeal
        grounds:
          - calculations.invoice_billed_amount
          - entities.BillingInvoice.fields.gross_amount_cents
          - entities.WeeklyMenu.fields.billing_mode_snapshot
        distinguishing_aspect: |
          On the BillingInvoice (billing) domain, an identical frozen grocery of
          6666 cents bills 6000 under PER_WEEK (base+tiered markup) but 9600 under
          PER_MEAL (per-meal marked-up grocery + per-meal fee) — two valid
          algorithms, different totals.
        test_recipe:
          setup:
            - "Client A billing_mode PER_WEEK, household 2, base 5000; Client B billing_mode PER_MEAL, household 2, per_meal_fee 800."
            - "Each client has an ACTIVE plan and one APPROVED menu with two meals of grocery 3333 each (menu grocery 6666), then cooked."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Ada PW", email: "pw@x.com", household_size: 2, billing_mode: "PER_WEEK", weekly_base_fee_cents: 5000, per_meal_fee_cents: 800, weekly_grocery_budget_cents: 100000, kitchen_open_hour: 0, kitchen_close_hour: 24 }
              as: PlatformAdmin
              captures: { cA: $.data.id, cA_v: $.data.version }
            - call: "POST /clients"
              payload: { full_name: "Ben PM", email: "pm@x.com", household_size: 2, billing_mode: "PER_MEAL", weekly_base_fee_cents: 5000, per_meal_fee_cents: 800, weekly_grocery_budget_cents: 100000, kitchen_open_hour: 0, kitchen_close_hour: 24 }
              as: PlatformAdmin
              captures: { cB: $.data.id, cB_v: $.data.version }
            - call: "POST /chefs"
              payload: { full_name: "Cook", email: "cook@x.com", hourly_rate_cents: 6000 }
              as: PlatformAdmin
              captures: { chef: $.data.id }
            - call: "POST /dietary-plans"
              payload: { client_id: "${cA}", restriction_tags: ["OMNIVORE"], allergen_tags: [], daily_calorie_target: 2000, expected_client_version: "${cA_v}" }
              as: Client
              as_user_id: "${cA}"
              captures: { planA: $.data.id }
            - call: "POST /dietary-plans"
              payload: { client_id: "${cB}", restriction_tags: ["OMNIVORE"], allergen_tags: [], daily_calorie_target: 2000, expected_client_version: "${cB_v}" }
              as: Client
              as_user_id: "${cB}"
              captures: { planB: $.data.id }
            - call: "POST /weekly-menus"
              payload: { client_id: "${cA}", dietary_plan_id: "${planA}", chef_id: "${chef}", week_start_date: "2026-03-09T00:00:00Z" }
              as: Chef
              as_user_id: "${chef}"
              captures: { menuA: $.data.id }
            - call: "POST /menu-meals"
              payload: { weekly_menu_id: "${menuA}", meal_name: "Soup", meal_slot: "LUNCH", servings: 2, ingredients: [{ name: "broth", quantity: 1, unit: "batch", unit_cost_cents: 3333, allergen_tags: [] }] }
              as: Chef
              as_user_id: "${chef}"
            - call: "POST /menu-meals"
              payload: { weekly_menu_id: "${menuA}", meal_name: "Stew", meal_slot: "DINNER", servings: 2, ingredients: [{ name: "beans", quantity: 1, unit: "batch", unit_cost_cents: 3333, allergen_tags: [] }] }
              as: Chef
              as_user_id: "${chef}"
            - call: "POST /weekly-menus/${menuA}/propose"
              payload: {}
              as: Chef
              as_user_id: "${chef}"
            - call: "POST /weekly-menus/${menuA}/approve"
              payload: {}
              as: Client
              as_user_id: "${cA}"
            - call: "POST /cook-sessions"
              payload: { weekly_menu_id: "${menuA}", chef_id: "${chef}", scheduled_start: "2026-03-03T09:00:00Z", scheduled_end: "2026-03-03T12:00:00Z" }
              as: Chef
              as_user_id: "${chef}"
              captures: { sessA: $.data.id }
            - call: "POST /cook-sessions/${sessA}/start"
              payload: {}
              as: Chef
              as_user_id: "${chef}"
            - call: "POST /cook-sessions/${sessA}/complete"
              payload: {}
              as: Chef
              as_user_id: "${chef}"
            - call: "POST /weekly-menus"
              payload: { client_id: "${cB}", dietary_plan_id: "${planB}", chef_id: "${chef}", week_start_date: "2026-03-09T00:00:00Z" }
              as: Chef
              as_user_id: "${chef}"
              captures: { menuB: $.data.id }
            - call: "POST /menu-meals"
              payload: { weekly_menu_id: "${menuB}", meal_name: "Soup", meal_slot: "LUNCH", servings: 2, ingredients: [{ name: "broth", quantity: 1, unit: "batch", unit_cost_cents: 3333, allergen_tags: [] }] }
              as: Chef
              as_user_id: "${chef}"
            - call: "POST /menu-meals"
              payload: { weekly_menu_id: "${menuB}", meal_name: "Stew", meal_slot: "DINNER", servings: 2, ingredients: [{ name: "beans", quantity: 1, unit: "batch", unit_cost_cents: 3333, allergen_tags: [] }] }
              as: Chef
              as_user_id: "${chef}"
            - call: "POST /weekly-menus/${menuB}/propose"
              payload: {}
              as: Chef
              as_user_id: "${chef}"
            - call: "POST /weekly-menus/${menuB}/approve"
              payload: {}
              as: Client
              as_user_id: "${cB}"
            - call: "POST /cook-sessions"
              payload: { weekly_menu_id: "${menuB}", chef_id: "${chef}", scheduled_start: "2026-03-04T09:00:00Z", scheduled_end: "2026-03-04T12:00:00Z" }
              as: Chef
              as_user_id: "${chef}"
              captures: { sessB: $.data.id }
            - call: "POST /cook-sessions/${sessB}/start"
              payload: {}
              as: Chef
              as_user_id: "${chef}"
            - call: "POST /cook-sessions/${sessB}/complete"
              payload: {}
              as: Chef
              as_user_id: "${chef}"
          trigger:
            - call: "GET /billing-invoices?weekly_menu_id=${menuA}"
              payload: {}
              as: PlatformAdmin
              captures: { invA: "$.data[0].gross_amount_cents" }
            - call: "GET /billing-invoices?weekly_menu_id=${menuB}"
              payload: {}
              as: PlatformAdmin
              captures: { invB: "$.data[0].gross_amount_cents" }
          assert:
            - "BillingInvoice(weekly_menu_id=${menuA}).gross_amount_cents == 6000"
            - "BillingInvoice(weekly_menu_id=${menuB}).gross_amount_cents == 9600"
            - "The two totals differ (6000 != 9600) from identical grocery 6666."

      - name: dual_variant_session_payout_provisional_vs_final
        grounds:
          - calculations.chef_session_payout_cents
          - entities.CookSession.fields.provisional_payout_cents
          - entities.CookSession.fields.final_payout_cents
        distinguishing_aspect: |
          On the CookSession/Chef (labor) domain, the same session yields
          provisional_payout 18000 (scheduled 3h) but final_payout 15000
          (actual 2.5h) at 6000/hr — a different domain than the billing dual-variant.
        test_recipe:
          setup:
            - "An APPROVED menu with a session scheduled 09:00-12:00 (3h); chef rate 6000/hr; the cook actually runs 09:00-11:30 (2.5h)."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Cara", email: "cara@x.com", household_size: 2, billing_mode: "PER_WEEK", weekly_base_fee_cents: 5000, per_meal_fee_cents: 800, weekly_grocery_budget_cents: 100000, kitchen_open_hour: 0, kitchen_close_hour: 24 }
              as: PlatformAdmin
              captures: { cid: $.data.id, cv: $.data.version }
            - call: "POST /chefs"
              payload: { full_name: "Cook", email: "cook2@x.com", hourly_rate_cents: 6000 }
              as: PlatformAdmin
              captures: { chef: $.data.id }
            - call: "POST /dietary-plans"
              payload: { client_id: "${cid}", restriction_tags: ["OMNIVORE"], allergen_tags: [], daily_calorie_target: 2000, expected_client_version: "${cv}" }
              as: Client
              as_user_id: "${cid}"
              captures: { plan: $.data.id }
            - call: "POST /weekly-menus"
              payload: { client_id: "${cid}", dietary_plan_id: "${plan}", chef_id: "${chef}", week_start_date: "2026-03-09T00:00:00Z" }
              as: Chef
              as_user_id: "${chef}"
              captures: { menu: $.data.id }
            - call: "POST /menu-meals"
              payload: { weekly_menu_id: "${menu}", meal_name: "Roast", meal_slot: "DINNER", servings: 2, ingredients: [{ name: "chicken", quantity: 1, unit: "kg", unit_cost_cents: 4000, allergen_tags: [] }] }
              as: Chef
              as_user_id: "${chef}"
            - call: "POST /weekly-menus/${menu}/propose"
              payload: {}
              as: Chef
              as_user_id: "${chef}"
            - call: "POST /weekly-menus/${menu}/approve"
              payload: {}
              as: Client
              as_user_id: "${cid}"
            - call: "POST /cook-sessions"
              payload: { weekly_menu_id: "${menu}", chef_id: "${chef}", scheduled_start: "2026-03-03T09:00:00Z", scheduled_end: "2026-03-03T12:00:00Z" }
              as: Chef
              as_user_id: "${chef}"
              captures: { sess: $.data.id, prov: $.data.provisional_payout_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cook-sessions/${sess}/start"
              payload: {}
              as: Chef
              as_user_id: "${chef}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-03T11:30:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /cook-sessions/${sess}/complete"
              payload: {}
              as: Chef
              as_user_id: "${chef}"
              captures: { fin: $.data.final_payout_cents }
          assert:
            - "CookSession.${sess}.provisional_payout_cents == 18000"
            - "CookSession.${sess}.final_payout_cents == 15000"
            - "provisional (18000) != final (15000)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: combinatorial_perweek_tiered_markup_and_surcharge
        grounds:
          - calculations.invoice_billed_amount
          - entities.Client.fields.household_size
          - entities.WeeklyMenu.fields.grocery_cost_cents
        distinguishing_aspect: |
          Mode (a): the PER_WEEK gross combines >=3 non-linearly interacting inputs
          — tier-selected markup on grocery (20000 -> 12%), plus a max(0,household-2)
          surcharge, plus base — yielding 5000 + 2400 + 1000 = 8400.
        test_recipe:
          setup:
            - "PER_WEEK client, household 4, base 5000, budget 100000; one cooked meal of grocery 20000 (tier 2, 12%)."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Dora", email: "dora@x.com", household_size: 4, billing_mode: "PER_WEEK", weekly_base_fee_cents: 5000, per_meal_fee_cents: 800, weekly_grocery_budget_cents: 100000, kitchen_open_hour: 0, kitchen_close_hour: 24 }
              as: PlatformAdmin
              captures: { cid: $.data.id, cv: $.data.version }
            - call: "POST /chefs"
              payload: { full_name: "Cook", email: "cook3@x.com", hourly_rate_cents: 6000 }
              as: PlatformAdmin
              captures: { chef: $.data.id }
            - call: "POST /dietary-plans"
              payload: { client_id: "${cid}", restriction_tags: ["OMNIVORE"], allergen_tags: [], daily_calorie_target: 2000, expected_client_version: "${cv}" }
              as: Client
              as_user_id: "${cid}"
              captures: { plan: $.data.id }
            - call: "POST /weekly-menus"
              payload: { client_id: "${cid}", dietary_plan_id: "${plan}", chef_id: "${chef}", week_start_date: "2026-03-09T00:00:00Z" }
              as: Chef
              as_user_id: "${chef}"
              captures: { menu: $.data.id }
            - call: "POST /menu-meals"
              payload: { weekly_menu_id: "${menu}", meal_name: "Feast", meal_slot: "DINNER", servings: 4, ingredients: [{ name: "steak", quantity: 1, unit: "kg", unit_cost_cents: 20000, allergen_tags: [] }] }
              as: Chef
              as_user_id: "${chef}"
            - call: "POST /weekly-menus/${menu}/propose"
              payload: {}
              as: Chef
              as_user_id: "${chef}"
            - call: "POST /weekly-menus/${menu}/approve"
              payload: {}
              as: Client
              as_user_id: "${cid}"
            - call: "POST /cook-sessions"
              payload: { weekly_menu_id: "${menu}", chef_id: "${chef}", scheduled_start: "2026-03-03T09:00:00Z", scheduled_end: "2026-03-03T10:00:00Z" }
              as: Chef
              as_user_id: "${chef}"
              captures: { sess: $.data.id }
            - call: "POST /cook-sessions/${sess}/start"
              payload: {}
              as: Chef
              as_user_id: "${chef}"
            - call: "POST /cook-sessions/${sess}/complete"
              payload: {}
              as: Chef
              as_user_id: "${chef}"
          trigger:
            - call: "GET /billing-invoices?weekly_menu_id=${menu}"
              payload: {}
              as: PlatformAdmin
              captures: { g: "$.data[0].gross_amount_cents" }
          assert:
            - "BillingInvoice(weekly_menu_id=${menu}).gross_amount_cents == 8400"
            - "WeeklyMenu.${menu}.markup_pct_snapshot == 12"

      - name: combinatorial_permeal_round_each_then_sum
        grounds:
          - calculations.invoice_billed_amount
          - entities.MenuMeal.fields.meal_grocery_cost_cents
          - entities.Client.fields.per_meal_fee_cents
        distinguishing_aspect: |
          Mode (b): PER_MEAL pins round-each-meal-then-sum. Two meals of grocery 3333
          give round(3333*1.20)=4000 each +800 fee -> 9600; sum-then-round would give
          9599. The scaffold pins the per-line order, so 9600 is correct.
        test_recipe:
          setup:
            - "PER_MEAL client, per_meal_fee 800; menu with two meals each grocery 3333, cooked."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Evan", email: "evan@x.com", household_size: 2, billing_mode: "PER_MEAL", weekly_base_fee_cents: 5000, per_meal_fee_cents: 800, weekly_grocery_budget_cents: 100000, kitchen_open_hour: 0, kitchen_close_hour: 24 }
              as: PlatformAdmin
              captures: { cid: $.data.id, cv: $.data.version }
            - call: "POST /chefs"
              payload: { full_name: "Cook", email: "cook4@x.com", hourly_rate_cents: 6000 }
              as: PlatformAdmin
              captures: { chef: $.data.id }
            - call: "POST /dietary-plans"
              payload: { client_id: "${cid}", restriction_tags: ["OMNIVORE"], allergen_tags: [], daily_calorie_target: 2000, expected_client_version: "${cv}" }
              as: Client
              as_user_id: "${cid}"
              captures: { plan: $.data.id }
            - call: "POST /weekly-menus"
              payload: { client_id: "${cid}", dietary_plan_id: "${plan}", chef_id: "${chef}", week_start_date: "2026-03-09T00:00:00Z" }
              as: Chef
              as_user_id: "${chef}"
              captures: { menu: $.data.id }
            - call: "POST /menu-meals"
              payload: { weekly_menu_id: "${menu}", meal_name: "Soup", meal_slot: "LUNCH", servings: 2, ingredients: [{ name: "broth", quantity: 1, unit: "batch", unit_cost_cents: 3333, allergen_tags: [] }] }
              as: Chef
              as_user_id: "${chef}"
            - call: "POST /menu-meals"
              payload: { weekly_menu_id: "${menu}", meal_name: "Stew", meal_slot: "DINNER", servings: 2, ingredients: [{ name: "beans", quantity: 1, unit: "batch", unit_cost_cents: 3333, allergen_tags: [] }] }
              as: Chef
              as_user_id: "${chef}"
            - call: "POST /weekly-menus/${menu}/propose"
              payload: {}
              as: Chef
              as_user_id: "${chef}"
            - call: "POST /weekly-menus/${menu}/approve"
              payload: {}
              as: Client
              as_user_id: "${cid}"
            - call: "POST /cook-sessions"
              payload: { weekly_menu_id: "${menu}", chef_id: "${chef}", scheduled_start: "2026-03-03T09:00:00Z", scheduled_end: "2026-03-03T10:00:00Z" }
              as: Chef
              as_user_id: "${chef}"
              captures: { sess: $.data.id }
            - call: "POST /cook-sessions/${sess}/start"
              payload: {}
              as: Chef
              as_user_id: "${chef}"
            - call: "POST /cook-sessions/${sess}/complete"
              payload: {}
              as: Chef
              as_user_id: "${chef}"
          trigger:
            - call: "GET /billing-invoices?weekly_menu_id=${menu}"
              payload: {}
              as: PlatformAdmin
              captures: { g: "$.data[0].gross_amount_cents" }
          assert:
            - "BillingInvoice(weekly_menu_id=${menu}).gross_amount_cents == 9600"
            - "gross_amount_cents != 9599 (the sum-then-round result)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: cyclic_menu_reject_revision_loop
        grounds:
          - state_machines.WeeklyMenu.PROPOSED_to_DRAFT
          - state_machines.WeeklyMenu.DRAFT_to_PROPOSED
          - state_machines.WeeklyMenu.PROPOSED_to_APPROVED
        distinguishing_aspect: |
          WeeklyMenu is cyclic: DRAFT->PROPOSED->DRAFT->PROPOSED->APPROVED is a legal
          revision loop, distinct from a linear pipeline.
        test_recipe:
          setup:
            - "A drafted menu with one meal, proposed once."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Fay", email: "fay@x.com", household_size: 2, billing_mode: "PER_WEEK", weekly_base_fee_cents: 5000, per_meal_fee_cents: 800, weekly_grocery_budget_cents: 100000, kitchen_open_hour: 0, kitchen_close_hour: 24 }
              as: PlatformAdmin
              captures: { cid: $.data.id, cv: $.data.version }
            - call: "POST /chefs"
              payload: { full_name: "Cook", email: "cook5@x.com", hourly_rate_cents: 6000 }
              as: PlatformAdmin
              captures: { chef: $.data.id }
            - call: "POST /dietary-plans"
              payload: { client_id: "${cid}", restriction_tags: ["OMNIVORE"], allergen_tags: [], daily_calorie_target: 2000, expected_client_version: "${cv}" }
              as: Client
              as_user_id: "${cid}"
              captures: { plan: $.data.id }
            - call: "POST /weekly-menus"
              payload: { client_id: "${cid}", dietary_plan_id: "${plan}", chef_id: "${chef}", week_start_date: "2026-03-09T00:00:00Z" }
              as: Chef
              as_user_id: "${chef}"
              captures: { menu: $.data.id }
            - call: "POST /menu-meals"
              payload: { weekly_menu_id: "${menu}", meal_name: "Bowl", meal_slot: "LUNCH", servings: 2, ingredients: [{ name: "rice", quantity: 1, unit: "batch", unit_cost_cents: 4000, allergen_tags: [] }] }
              as: Chef
              as_user_id: "${chef}"
            - call: "POST /weekly-menus/${menu}/propose"
              payload: {}
              as: Chef
              as_user_id: "${chef}"
          trigger:
            - call: "POST /weekly-menus/${menu}/reject"
              payload: {}
              as: Client
              as_user_id: "${cid}"
            - call: "POST /weekly-menus/${menu}/propose"
              payload: {}
              as: Chef
              as_user_id: "${chef}"
            - call: "POST /weekly-menus/${menu}/approve"
              payload: {}
              as: Client
              as_user_id: "${cid}"
          assert:
            - "After reject: WeeklyMenu.${menu}.status == DRAFT"
            - "After second propose: WeeklyMenu.${menu}.status == PROPOSED"
            - "After approve: WeeklyMenu.${menu}.status == APPROVED"

      - name: branching_session_noshow_divergent_effects
        grounds:
          - state_machines.CookSession.SCHEDULED_to_NO_SHOW
          - state_machines.CookSession.SCHEDULED_to_IN_PROGRESS
          - entities.Chef.fields.no_show_strikes
        distinguishing_aspect: |
          CookSession branches from SCHEDULED: the NO_SHOW branch fires divergent
          side-effects (client wallet +5000, chef strike +1, no menu progression),
          distinct from the COMPLETED branch (payout + cook cascade) — on a different
          entity than the cyclic WeeklyMenu machine.
        test_recipe:
          setup:
            - "An APPROVED menu with a scheduled session; client base fee 5000."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Gil", email: "gil@x.com", household_size: 2, billing_mode: "PER_WEEK", weekly_base_fee_cents: 5000, per_meal_fee_cents: 800, weekly_grocery_budget_cents: 100000, kitchen_open_hour: 0, kitchen_close_hour: 24 }
              as: PlatformAdmin
              captures: { cid: $.data.id, cv: $.data.version }
            - call: "POST /chefs"
              payload: { full_name: "Cook", email: "cook6@x.com", hourly_rate_cents: 6000 }
              as: PlatformAdmin
              captures: { chef: $.data.id }
            - call: "POST /dietary-plans"
              payload: { client_id: "${cid}", restriction_tags: ["OMNIVORE"], allergen_tags: [], daily_calorie_target: 2000, expected_client_version: "${cv}" }
              as: Client
              as_user_id: "${cid}"
              captures: { plan: $.data.id }
            - call: "POST /weekly-menus"
              payload: { client_id: "${cid}", dietary_plan_id: "${plan}", chef_id: "${chef}", week_start_date: "2026-03-09T00:00:00Z" }
              as: Chef
              as_user_id: "${chef}"
              captures: { menu: $.data.id }
            - call: "POST /menu-meals"
              payload: { weekly_menu_id: "${menu}", meal_name: "Bowl", meal_slot: "LUNCH", servings: 2, ingredients: [{ name: "rice", quantity: 1, unit: "batch", unit_cost_cents: 4000, allergen_tags: [] }] }
              as: Chef
              as_user_id: "${chef}"
            - call: "POST /weekly-menus/${menu}/propose"
              payload: {}
              as: Chef
              as_user_id: "${chef}"
            - call: "POST /weekly-menus/${menu}/approve"
              payload: {}
              as: Client
              as_user_id: "${cid}"
            - call: "POST /cook-sessions"
              payload: { weekly_menu_id: "${menu}", chef_id: "${chef}", scheduled_start: "2026-03-03T09:00:00Z", scheduled_end: "2026-03-03T12:00:00Z" }
              as: Chef
              as_user_id: "${chef}"
              captures: { sess: $.data.id }
          trigger:
            - call: "POST /cook-sessions/${sess}/no-show"
              payload: {}
              as: Client
              as_user_id: "${cid}"
          assert:
            - "CookSession.${sess}.status == NO_SHOW"
            - "Client.${cid}.wallet_credit_cents == 5000"
            - "Chef.${chef}.no_show_strikes == 1"
            - "WeeklyMenu.${menu}.status == APPROVED (no menu progression on the NO_SHOW branch)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cascade_session_complete_menu_meal_container_depth3
        grounds:
          - state_machines.CookSession.IN_PROGRESS_to_COMPLETED
          - state_machines.WeeklyMenu.APPROVED_to_COOKED
          - state_machines.MenuMeal.PLANNED_to_COOKED
        distinguishing_aspect: |
          Depth-3 transitive chain from session complete: complete -> WeeklyMenu COOKED
          (caused by complete) -> MenuMeal COOKED (caused by menu COOKED) -> Container
          produced (caused by meal COOKED). Each link is caused by the previous link.
        test_recipe:
          setup:
