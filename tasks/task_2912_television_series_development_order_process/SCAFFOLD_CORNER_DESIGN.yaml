        excluded_because:
          difficulty_instance: transitive_cascade / greenlight_approval_cascade_four_levels_releases_pending_step_money
          rationale: "The four-level approval cascade and its conditional step cut-off are asserted end to end by the named §1.8 instance."

      - name: pilot_shoot_concurrency_guard_corner
        claim_type: guarded_transitions
        grounds: ["validations.ordered.19", "entities.Slate.fields.max_concurrent_pilot_shoots"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / pilot_order_refused_while_a_sibling_pilot_occupies_the_slate_stage
          rationale: "The sibling-pilot shoot guard is the exact gate the named §1.8 instance drives to refusal and then to success."

  # =========================================================================
  # SECTION: calculations
