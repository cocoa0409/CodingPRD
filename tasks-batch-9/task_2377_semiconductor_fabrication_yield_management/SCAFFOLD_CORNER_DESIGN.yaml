            - "WaferStartPlan.${plan_a}.status == DRAFT"
            - "WaferStartPlan.${plan_a}.committed_hours == 0.0"
            - "WaferStartPlan.${plan_a}.surcharge_hours == 0.0"
            - "WaferStartPlan.${plan_a}.commitment_tier == TIER_0"

