        grounds:
          - validations[priority=15]
          - errors[ERR_AGGREGATE_LIMIT_EXHAUSTED]
          - entities.Policy.fields.limit_status
        distinguishing_aspect: |
          Once the tower is spent nothing further can be paid: with the aggregate at 0.00 the second claim's
          proof cannot be accepted, so the proof stays UNDER_REVIEW, the claim stays in PROOF_REVIEW and no
          further payment slice is written.
        test_recipe:
          setup:
            - "Bitwise Systems policy with aggregate 250000.00, retention 0.00 and a two-section tower (FIRST_PARTY_RESPONSE 250000, BUSINESS_INTERRUPTION 250000 at coinsurance 0.00, waiting period 12 hours)."
            - "Claim 1 was settled from a 72-hour outage at margin 1.00: assessed 300000.00, one POSTED payment of 250000.00, unallocated_loss_usd 50000.00, so limit_status is EXHAUSTED and aggregate_limit_remaining_usd is 0.00."
            - "Claim 2 was confirmed and its proof filed BEFORE the exhaustion, so it sits in PROOF_REVIEW with an UNDER_REVIEW proof."
          setup_api_calls:
            - call: "POST /cyber/control-requirements"
