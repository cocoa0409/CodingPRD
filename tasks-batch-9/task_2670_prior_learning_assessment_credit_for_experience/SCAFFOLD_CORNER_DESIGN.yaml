            - "an explicit request for the INACTIVE ${asr1_id} returns 409 ERR_ASSESSOR_INACTIVE"
            - "an explicit request for the MATH assessor ${asr2_id} returns 422 ERR_ASSESSOR_NOT_ELIGIBLE — department must match the course's department_code"
            - "PlaClaim.${claim_id}.assessment_status is still SUBMITTED and hold_reason is null after all three rejections"
            - "GET /assessor-assignments?claim_id=${claim_id} returns an empty list — no PENDING shell row is left behind"
            - "after PATCH /faculty-assessors/${asr1_id} {status: ACTIVE}, the same auto-selection returns 201 selecting ${asr1_id} and the claim moves to UNDER_ASSESSMENT"
            - "requesting ${asr1_id} again after that assignment has been revoked by a revision cycle returns 409 ERR_ASSESSOR_ALREADY_ASSIGNED — prior assignees are permanently excluded from the claim"
            - "an explicit request naming a non-existent assessor id returns 404 ERR_ASSESSOR_NOT_FOUND at priority 7, ahead of every eligibility rule"

      - name: claim_wrong_state_family_after_posting_is_rejected
        claim_type: triggerable
        grounds:
          - validations[priority 14].ERR_CLAIM_ALREADY_TERMINAL
          - validations[priority 15].ERR_CLAIM_NOT_UNDER_ASSESSMENT
          - validations[priority 15].ERR_CLAIM_NOT_SCORED
          - validations[priority 15].ERR_CLAIM_NOT_DENIED
          - validations[priority 15].ERR_CREDIT_ALREADY_POSTED
          - validations[priority 15].ERR_CREDIT_NOT_POSTED
          - endpoints[POST /pla-claims/{claim_id}/transcript-posting]
        distinguishing_aspect: |
          Once the 6 credits are POSTED, every workflow verb reports the state it
          demanded rather than a generic conflict: a repeat posting gives
          ERR_CREDIT_ALREADY_POSTED, request-revision gives
          ERR_CLAIM_NOT_UNDER_ASSESSMENT, award and deny give ERR_CLAIM_NOT_SCORED,
          filing an appeal gives ERR_CLAIM_NOT_DENIED and submit gives
          ERR_CLAIM_ALREADY_TERMINAL — and the reversal that is legal now was
          ERR_CREDIT_NOT_POSTED one call earlier.
        test_recipe:
          setup:
            - "Program BSCS, Course CS150 (6 credits, LOWER), Student S-1001, assessor E-9001 (dept CS, rank 2); clock 2026-08-01T00:00:00Z."
            - "A PORTFOLIO claim with 2 PRIMARY-mapped artifacts, invoice waived, assigned to E-9001, accepted, scored 4/4 on both outcomes, completed PASS, awarded 6 credits and then POSTED to term 2026FA."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Registrar
            - call: "POST /programs"
              payload: { program_code: "BSCS", title: "BS Computer Science", total_credits_required: 120, residency_min_credits: 30, pla_max_credits: 30, pla_max_pct_bp: 2500, pla_upper_division_max_credits: 6, allowed_source_types: ["CREDIT_BY_EXAM", "PORTFOLIO", "MILITARY_TRAINING", "INDUSTRY_CREDENTIAL"], status: "ACTIVE" }
              as: PlaCoordinator
              captures: { prog_id: "$.data.id" }
            - call: "POST /courses"
              payload: { course_code: "CS150", title: "Intro Programming", department_code: "CS", credits: 6, level: "LOWER", pla_eligible: true, learning_outcomes: [{ outcome_code: "OC1", description: "Design a program", weight_bp: 8000, mastery_threshold_bp: 7000 }, { outcome_code: "OC2", description: "Test a program", weight_bp: 2000, mastery_threshold_bp: 7000 }] }
              as: PlaCoordinator
              captures: { course_id: "$.data.id" }
            - call: "GET /learning-outcomes?course_id=${course_id}"
              as: PlaCoordinator
              captures: { oc1_id: "$.data[0].id", oc2_id: "$.data[1].id" }
            - call: "POST /students"
              payload: { student_number: "S-1001", full_name: "Ada Reyes", program_id: "${prog_id}", enrollment_status: "MATRICULATED", transfer_credits_accepted: 0, institutional_credits_earned: 60 }
              as: Registrar
              captures: { stu_id: "$.data.id" }
            - call: "POST /faculty-assessors"
              payload: { employee_number: "E-9001", full_name: "Dr Nia Ford", department_code: "CS", credential_rank: 2, max_concurrent_assignments: 3, appeal_panel_member: false, status: "ACTIVE" }
              as: PlaCoordinator
              captures: { asr1_id: "$.data.id" }
            - call: "POST /pla-claims"
              payload: { student_id: "${stu_id}", course_id: "${course_id}", source_type: "PORTFOLIO", credits_requested: 6 }
