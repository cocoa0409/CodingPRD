      - name: dispatch_technician_availability_error_family
        claim_type: error_triggerable
        grounds:
          - validations.priority_22_business_referential
          - validations.priority_34_business_constraint
          - validations.priority_35_business_constraint
          - errors.ERR_TECHNICIAN_LOCATION_MISMATCH
          - errors.ERR_TECHNICIAN_UNAVAILABLE
          - errors.ERR_NO_TECHNICIAN_AVAILABLE
        distinguishing_aspect: "Three different dispatch failures must be distinguishable: a technician from the wrong location (422), a named technician who is not AVAILABLE (409), and an empty selector pool when no technician_id is given at all (409). Only the third depends on the selector, and the wrong-location error outranks the availability error."
        test_recipe:
          setup:
            - "location A with one technician who is put OFF_DUTY, location B with one AVAILABLE technician"
            - "one fleet, one unit, one OPEN NORMAL call dispatching from location A"
          setup_api_calls:
            - call: "POST /service-locations"
              payload: { name: "Dispatch A", location_code: "DPA", state_code: "OH", road_service_response_minutes_committed: 120, scrap_permit_number: "OH-SCRAP-4036", scrap_permit_expires_on: "2027-06-30" }
              as: DealerAdmin
              captures: { locA_id: $.data.id }
            - call: "POST /service-locations"
              payload: { name: "Dispatch B", location_code: "DPB", state_code: "IN", road_service_response_minutes_committed: 120, scrap_permit_number: "IN-SCRAP-4036", scrap_permit_expires_on: "2027-06-30" }
              as: DealerAdmin
              captures: { locB_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { name: "Dispatch Freight", account_type: "SINGLE_LOCATION", home_location_id: "${locA_id}", billing_mode: "DIRECT" }
              as: DealerAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /fleet-accounts/${fleet_id}/vehicles"
              payload: { unit_number: "T-126", vehicle_type: "TRACTOR", current_odometer_miles: 88000 }
              as: DealerAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /service-locations/${locA_id}/technicians"
              payload: { name: "Alpha Tech", certification_level: "TIA_CERTIFIED" }
              as: DealerAdmin
              captures: { techA_id: $.data.id }
            - call: "POST /service-locations/${locB_id}/technicians"
              payload: { name: "Bravo Tech", certification_level: "TIA_CERTIFIED" }
              as: DealerAdmin
              captures: { techB_id: $.data.id }
            - call: "POST /technicians/${techA_id}/status"
              payload: { status: "OFF_DUTY" }
              as: DealerAdmin
            - call: "POST /road-service-calls"
              payload: { fleet_account_id: "${fleet_id}", vehicle_id: "${veh_id}", service_location_id: "${locA_id}", priority: "NORMAL", complaint: "Tire down", reported_at: "2026-08-29T09:00:00Z" }
              as: DispatchCoordinator
              captures: { call_id: $.data.id }
          trigger:
            - call: "POST /road-service-calls/${call_id}/dispatch"
              payload: { dispatched_at: "2026-08-29T09:10:00Z", dispatch_miles: 4, technician_id: "${techB_id}" }
              as: DispatchCoordinator
              captures: { e1: $.data.error_id }
            - call: "POST /road-service-calls/${call_id}/dispatch"
              payload: { dispatched_at: "2026-08-29T09:15:00Z", dispatch_miles: 4, technician_id: "${techA_id}" }
              as: DispatchCoordinator
              captures: { e2: $.data.error_id }
            - call: "POST /road-service-calls/${call_id}/dispatch"
              payload: { dispatched_at: "2026-08-29T09:20:00Z", dispatch_miles: 4 }
              as: DispatchCoordinator
              captures: { e3: $.data.error_id }
            - call: "POST /technicians/${techA_id}/status"
              payload: { status: "AVAILABLE" }
              as: DealerAdmin
            - call: "POST /road-service-calls/${call_id}/dispatch"
              payload: { dispatched_at: "2026-08-29T09:30:00Z", dispatch_miles: 4 }
              as: DispatchCoordinator
          assert:
            - "naming location B's technician returns 422 with data.error_id == \"ERR_TECHNICIAN_LOCATION_MISMATCH\", even though that technician IS available"
            - "naming location A's OFF_DUTY technician returns 409 with data.error_id == \"ERR_TECHNICIAN_UNAVAILABLE\""
            - "omitting technician_id while location A has no AVAILABLE technician returns 409 with data.error_id == \"ERR_NO_TECHNICIAN_AVAILABLE\""
            - "the call is still OPEN with technician_id null after all three refusals, and Vehicle.${veh_id}.status is still \"IN_SERVICE\""
            - "once Alpha Tech is AVAILABLE the selector picks ${techA_id} and dispatch returns 200 with dispatch_status \"DISPATCHED\""

      - name: invoice_creation_fiscal_precondition_error_family
        claim_type: error_triggerable
        grounds:
          - validations.priority_28_business_temporal
          - validations.priority_36_business_fiscal
          - validations.priority_37_business_fiscal
          - errors.ERR_INVALID_BILLING_PERIOD
          - errors.ERR_NO_ACTIVE_AGREEMENT
          - errors.ERR_NO_BILLABLE_LINES
        distinguishing_aspect: "The three fiscal preconditions fire in ladder order, and each is isolated here: a 93-day window loses to the temporal rule before agreement resolution is attempted; a DRAFT-only agreement loses at priority 36; and with the agreement activated the empty line set loses at priority 37 — so the same request text yields three different error ids as the fixture is repaired step by step."
        test_recipe:
          setup: ["one CROSS_LOCATION fleet with a single DRAFT agreement covering 2026-07-01 to 2026-12-31 and no completed calls"]
          setup_api_calls:
            - call: "POST /service-locations"
              payload: { name: "Fiscal Commercial", location_code: "FSC", state_code: "OH", road_service_response_minutes_committed: 120, scrap_permit_number: "OH-SCRAP-4037", scrap_permit_expires_on: "2027-06-30" }
              as: DealerAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { name: "Fiscal Freight", account_type: "NATIONAL_ACCOUNT", home_location_id: "${loc_id}", billing_mode: "CROSS_LOCATION" }
              as: DealerAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /national-agreements"
              payload: { fleet_account_id: "${fleet_id}", agreement_code: "FSC-2026", effective_from: "2026-07-01", effective_to: "2026-12-31", tier_discount_pct: 0.15, casing_credit_rate_cents: 16000, emergency_response_minutes: 75, emergency_labor_rate_cents_per_hour: 14000 }
              as: DealerAdmin
              captures: { agr_id: $.data.id }
            - call: "GET /fleet-accounts/${fleet_id}"
              payload: {}
              as: BillingClerk
              captures: { fleet_v: $.data.version }
          trigger:
            - call: "POST /cross-location-invoices"
              payload: { fleet_account_id: "${fleet_id}", billing_period_start: "2026-08-01", billing_period_end: "2026-11-02", expected_fleet_account_version: "${fleet_v}" }
              as: BillingClerk
              captures: { e1: $.data.error_id }
            - call: "POST /cross-location-invoices"
              payload: { fleet_account_id: "${fleet_id}", billing_period_start: "2026-08-31", billing_period_end: "2026-08-01", expected_fleet_account_version: "${fleet_v}" }
              as: BillingClerk
              captures: { e2: $.data.error_id }
            - call: "POST /cross-location-invoices"
              payload: { fleet_account_id: "${fleet_id}", billing_period_start: "2026-08-01", billing_period_end: "2026-08-31", expected_fleet_account_version: "${fleet_v}" }
              as: BillingClerk
              captures: { e3: $.data.error_id }
            - call: "POST /national-agreements/${agr_id}/activate"
              payload: {}
              as: DealerAdmin
            - call: "GET /fleet-accounts/${fleet_id}"
              payload: {}
              as: BillingClerk
              captures: { fleet_v2: $.data.version }
            - call: "POST /cross-location-invoices"
              payload: { fleet_account_id: "${fleet_id}", billing_period_start: "2026-08-01", billing_period_end: "2026-08-31", expected_fleet_account_version: "${fleet_v2}" }
              as: BillingClerk
              captures: { e4: $.data.error_id }
          assert:
            - "2026-08-01 to 2026-11-02 spans 94 days inclusive and returns 422 ERR_INVALID_BILLING_PERIOD; the 92-day limit is the binding constraint, not the agreement window"
            - "an inverted period (end before start) also returns 422 ERR_INVALID_BILLING_PERIOD"
            - "the well-formed 31-day period returns 422 ERR_NO_ACTIVE_AGREEMENT while the only agreement is DRAFT"
            - "after activation the identical request returns 422 ERR_NO_BILLABLE_LINES, since no COMPLETED billable call exists in the window"
            - "GET /cross-location-invoices?fleet_account_id=${fleet_id} returns total_count == 0 after all four refusals"

      - name: retread_job_creation_referential_error_family
        claim_type: error_triggerable
        grounds:
          - validations.priority_19_business_referential
          - validations.priority_25_business_temporal
          - errors.ERR_TIRE_POLICY_MISSING
          - errors.ERR_MAX_RETREAD_COUNT_REACHED
          - errors.ERR_INVALID_SLOT_DURATION
        distinguishing_aspect: "Job creation can fail for a missing policy, an exhausted casing or an illegal slot length, and the ladder order matters: the missing-policy error appears at priority 19 even when the slot length is also illegal, because the policy is what the retread-count check needs to read."
        test_recipe:
          setup:
            - "a plant with one AVAILABLE line; a fleet with NO DRIVE policy at first"
            - "casing M created with retread_count 3, collected, and a DRIVE policy with max_retread_count 3 added later"
          setup_api_calls:
            - call: "POST /service-locations"
              payload: { name: "Refer Plant", location_code: "RFP", state_code: "OH", road_service_response_minutes_committed: 120, scrap_permit_number: "OH-SCRAP-4038", scrap_permit_expires_on: "2027-06-30", is_retread_plant: true }
              as: DealerAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /service-locations/${loc_id}/retread-lines"
