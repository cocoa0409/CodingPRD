            - "after trigger[0]: BasicScore(carrier_id=${c1_id}, basic_category=UNSAFE_DRIVING).certified_measure == 1.000"
            - "after trigger[0]: BasicScore(carrier_id=${c1_id}, basic_category=UNSAFE_DRIVING).percentile == 65.0"
            - "after trigger[1]: Violation.${v1_id}.driver_id == ${d1_id}"
            - "after trigger[1]: Driver.${d1_id}.attributed_violation_count == 1"
            - "after trigger[1]: Driver.${d1_id}.strict_attribution_score == 15.00"
            - "after trigger[1]: Driver.${d1_id}.adjudicated_attribution_score == 15.00"
            - "after trigger[1]: Driver.${d1_id}.coaching_required == true"
