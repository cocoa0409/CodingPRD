# =============================================================================
# 1178. Retail Construction Rollout Program Management (national retail rollout GC)
# =============================================================================

scenario: |
  1178. Retail Construction Rollout Program Management (national retail rollout GC): site list & phased schedule, prototype drawing & jurisdiction variance, permit tracking by municipality, GC bid & award per market, vendor sequencing (fixture/IT/signage) & site readiness, punch list & turnover to operations, budget variance & change order, grand-opening date protection

domain_name: retail-construction-rollout
api_prefix: /rollout

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - version_pinning_on_approval
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, self_referential, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: RolloutProgram
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Program name" }
      - { name: fiscal_year, type: integer, source: input, description: "Fiscal year of the rollout" }
      - { name: total_budget_cents, type: integer, source: input, description: "Total program budget, cents" }
      - { name: contingency_pool_cents, type: integer, source: input, description: "Contingency pool carved out of total budget, cents" }
      - { name: committed_cents, type: integer, source: computed, default: 0, description: "Sum of committed_cents over Sites with status != REMOVED (program_budget_rollup)" }
      - { name: actuals_cents, type: integer, source: computed, default: 0, description: "Sum of actuals_cents over Sites with status != REMOVED" }
      - { name: contingency_reserved_cents, type: integer, source: computed, default: 0, description: "Tiered reserve: 25% of over_cents for WATCH sites, 100% for OVERRUN sites (program_budget_rollup)" }
      - { name: contingency_free_cents, type: integer, source: computed, description: "= contingency_pool_cents - contingency_reserved_cents" }
      - { name: budget_posture, type: enum, source: computed, description: "OVERRUN if contingency_free_cents < 0; else GUARDED if contingency_reserved_cents * 2 > contingency_pool_cents; else WITHIN_PLAN" }
      - { name: status, type: enum, source: system, description: "SETUP | ACTIVE | COMPLETE" }

  - name: Market
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> RolloutProgram.id" }
      - { name: name, type: string, source: input, description: "Market (metro) name" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code" }
      - { name: max_concurrent_vendor_crews, type: integer, source: input, description: "Per-day cap on vendor crews working across all sites of this market" }
      - { name: status, type: enum, source: system, description: "REGISTERED | BIDDING | AWARDED" }

  - name: MunicipalityProfile
    parent: null
    common_fields: true
    fields:
      - { name: municipality_code, type: string, source: input, description: "Unique municipality key referenced by Site.municipality_code", constraints: "unique" }
      - { name: statutory_review_days, type: integer, source: input, description: "Statutory permit review duration, days (optimistic forecast)" }
      - { name: observed_avg_review_days, type: integer, source: input, description: "Observed average review duration, days (conservative forecast)" }
      - { name: permit_validity_days, type: integer, source: input, description: "Days an issued permit stays valid" }
      - { name: fee_base_cents, type: integer, source: input, description: "Flat base fee per permit application, cents" }
      - { name: fee_per_sqft_cents, type: integer, source: input, description: "Fee rate in cents per 100 square feet of site area" }

  - name: Site
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> RolloutProgram.id" }
      - { name: market_id, type: string, source: input, description: "FK -> Market.id" }
      - { name: municipality_code, type: string, source: input, description: "Municipality key; must have a MunicipalityProfile before permits can be created" }
      - { name: address, type: string, source: input, description: "Street address" }
      - { name: square_footage, type: integer, source: input, description: "Gross square footage (permit fee basis)" }
      - { name: phase_wave, type: integer, source: input, description: "Phased schedule wave number; matched to BidPackage.phase_wave" }
      - { name: budget_allocation_cents, type: integer, source: input, description: "Planned budget envelope for this site, cents" }
      - { name: target_open_date, type: string, source: input, description: "Committed grand-opening date, ISO date; locked once site leaves LISTED/DESIGN" }
      - { name: base_contract_cents, type: integer, source: system, default: 0, description: "GC base contract, set by BidPackage award; 0 before award" }
      - { name: approved_co_cents, type: integer, source: computed, default: 0, description: "Sum of APPROVED ChangeOrder amount_cents (credits negative)" }
      - { name: proposed_co_cents, type: integer, source: computed, default: 0, description: "Sum of PROPOSED ChangeOrder amount_cents" }
      - { name: committed_cents, type: integer, source: computed, description: "= base_contract_cents + approved_co_cents (site_committed_cost)" }
      - { name: variance_ratio_final_bp, type: integer, source: computed, description: "round_half_up((committed_cents - base_contract_cents) * 10000 / base_contract_cents); 0 when base_contract_cents == 0" }
      - { name: variance_ratio_provisional_bp, type: integer, source: computed, description: "Same formula over committed_cents + proposed_co_cents" }
      - { name: budget_posture, type: enum, source: computed, description: "Final-ratio keyed: <=500 WITHIN; <=1500 WATCH; else OVERRUN" }
      - { name: actuals_cents, type: integer, source: computed, default: 0, description: "Final reconciled actuals; set = committed_cents at turnover acceptance" }
      - { name: permit_fees_paid_cents, type: integer, source: computed, default: 0, description: "Permit fee ledger: debited on file/refile, credited on withdraw" }
      - { name: readiness_posture, type: enum, source: computed, description: "ROUGH | FIXTURE_SET | IT_LIVE | SIGNAGE_HUNG — derived from vendor mobilization completion" }
      - { name: punch_open_critical_count, type: integer, source: computed, default: 0, description: "PunchItems severity=CRITICAL with status in {OPEN, RESOLVED}" }
      - { name: punch_open_total_count, type: integer, source: computed, default: 0, description: "PunchItems with status in {OPEN, RESOLVED}" }
      - { name: status, type: enum, source: system, description: "LISTED | DESIGN | PERMITTING | MOBILIZED | IN_BUILD | PUNCH | TURNOVER | OPEN | REMOVED" }

  - name: DrawingSet
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> RolloutProgram.id" }
      - { name: jurisdiction_code, type: string, source: input, description: "Municipality code this variance set applies to" }
      - { name: revision, type: integer, source: system, description: "1 + max existing revision for (program_id, jurisdiction_code)" }
      - { name: review_round, type: integer, source: system, default: 1, description: "Increments on each revise cycle" }
      - { name: supersedes_set_id, type: string, source: system, description: "FK -> DrawingSet.id; set on approval to the previously APPROVED revision, null otherwise", constraints: "nullable" }
      - { name: variance_notes, type: string, source: input, description: "Jurisdiction variance notes", constraints: "optional" }
      - { name: rejection_reason, type: string, source: system, description: "Recorded on reject", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REJECTED | SUPERSEDED" }

  - name: Permit
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id" }
      - { name: drawing_set_id, type: string, source: input, description: "FK -> DrawingSet.id; pinned application drawing revision" }
      - { name: permit_type, type: enum, source: input, description: "BUILDING | ELECTRICAL | SIGNAGE | HEALTH" }
      - { name: municipality_code, type: string, source: system, description: "Copied from Site.municipality_code at creation" }
      - { name: round_number, type: integer, source: system, default: 1, description: "Filing round; increments on refile" }
      - { name: fee_cents, type: integer, source: computed, default: 0, description: "Current-round fee (permit_fee_schedule); refile rounds cost half" }
      - { name: filed_at, type: datetime, source: system, description: "Clock timestamp of latest filing", constraints: "nullable" }
      - { name: review_due_on, type: string, source: computed, description: "filed date + statutory_review_days", constraints: "nullable" }
      - { name: issued_at, type: datetime, source: system, description: "Clock timestamp of issuance", constraints: "nullable" }
      - { name: expires_on, type: string, source: computed, description: "issue date + permit_validity_days; expired when current date >= expires_on", constraints: "nullable" }
      - { name: rejection_reason, type: string, source: system, description: "Recorded on reject", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "DRAFT | FILED | UNDER_REVIEW | ISSUED | REJECTED | WITHDRAWN | EXPIRED" }

  - name: Contractor
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "GC legal name" }
      - { name: license_no, type: string, source: input, description: "GC license number", constraints: "unique" }
      - { name: license_state, type: string, source: input, description: "License state code" }
      - { name: status, type: enum, source: system, description: "PREQUALIFIED | SUSPENDED" }

  - name: BidPackage
    parent: null
    common_fields: true
    fields:
      - { name: market_id, type: string, source: input, description: "FK -> Market.id" }
      - { name: phase_wave, type: integer, source: input, description: "Wave covered by this package; award applies to matching sites" }
      - { name: scope_description, type: string, source: input, description: "Scope of work" }
      - { name: bid_open_at, type: datetime, source: input, description: "Earliest clock time the package may open" }
      - { name: bid_close_at, type: datetime, source: input, description: "Clock time at/after which the package may close and bids are refused" }
      - { name: evaluation_mode, type: enum, source: input, description: "LOWEST_PRICE | BEST_VALUE" }
      - { name: max_duration_days, type: integer, source: input, description: "Responsiveness cap on bid duration_days" }
      - { name: awarded_bid_id, type: string, source: system, description: "Winning Bid id after award", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | CLOSED | AWARDED" }

  - name: Bid
    parent: null
    common_fields: true
    fields:
      - { name: bid_package_id, type: string, source: input, description: "FK -> BidPackage.id" }
      - { name: contractor_id, type: string, source: input, description: "FK -> Contractor.id; must equal X-User-ID for GCVendor" }
      - { name: amount_cents, type: integer, source: input, description: "Per-store contract price bid, cents" }
      - { name: duration_days, type: integer, source: input, description: "Promised per-store build duration" }
      - { name: tech_score, type: integer, source: input, description: "Technical score 0..100", constraints: "0 <= tech_score <= 100" }
      - { name: is_responsive, type: boolean, source: computed, description: "amount_cents > 0 and 0 < duration_days <= package.max_duration_days" }
      - { name: evaluation_score, type: number, source: computed, description: "BEST_VALUE score (2 dp round_half_up); null under LOWEST_PRICE", constraints: "nullable" }
      - { name: submitted_at, type: datetime, source: system, description: "Clock timestamp of submission" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | WITHDRAWN | AWARDED | REJECTED" }

  - name: VendorMobilization
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id" }
      - { name: vendor_type, type: enum, source: input, description: "FIXTURE | IT | SIGNAGE" }
      - { name: vendor_name, type: string, source: input, description: "Vendor company name" }
      - { name: planned_start_on, type: string, source: input, description: "Planned window start, ISO date; half-open [start, end)" }
      - { name: planned_end_on, type: string, source: input, description: "Planned window end, ISO date (exclusive)" }
      - { name: actual_start_on, type: string, source: system, description: "Set on arrive", constraints: "nullable" }
      - { name: actual_end_on, type: string, source: system, description: "Set on complete", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "PLANNED | SCHEDULED | ON_SITE | COMPLETE | CANCELLED" }

  - name: ChangeOrder
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id" }
      - { name: description, type: string, source: input, description: "Change description" }
      - { name: amount_cents, type: integer, source: input, description: "Signed amount, cents; negative = credit" }
      - { name: cost_category, type: enum, source: input, description: "SCOPE | SCHEDULE | CODE_COMPLIANCE | OWNER_REQUEST" }
      - { name: tier, type: enum, source: computed, description: "Exact rational comparison |amount| * 10000 / base_contract_cents (no rounding): <=200 STANDARD; <=500 ELEVATED; else CRITICAL" }
      - { name: proposed_by_user_id, type: string, source: system, description: "X-User-ID of proposer; approver must differ (segregation of duties)" }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | REJECTED | CANCELLED | RESCINDED" }

  - name: PunchItem
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id" }
      - { name: description, type: string, source: input, description: "Deficiency description" }
      - { name: severity, type: enum, source: input, description: "CRITICAL | MAJOR | MINOR" }
      - { name: reopen_count, type: integer, source: system, default: 0, description: "Increments on each failed verification" }
      - { name: status, type: enum, source: system, description: "OPEN | RESOLVED | VERIFIED | WAIVED" }

  - name: Turnover
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id" }
      - { name: readiness_snapshot, type: object, source: system, description: "Pinned {readiness_posture, punch_open_critical_count, punch_open_total_count, forecast_open_on} at request time" }
      - { name: rejection_reason, type: string, source: system, description: "Recorded on reject", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "REQUESTED | ACCEPTED | REJECTED | SUPERSEDED" }

  - name: OpeningCommitment
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: system, description: "FK -> Site.id; exactly one per site, auto-created with the site", constraints: "unique" }
      - { name: committed_open_on, type: string, source: system, description: "Committed grand-opening date; mirrors Site.target_open_date" }
      - { name: forecast_open_on, type: string, source: computed, description: "Conservative forecast opening date (opening_date_forecast)" }
      - { name: forecast_optimistic_on, type: string, source: computed, description: "Optimistic forecast opening date (opening_date_forecast)" }
      - { name: slip_days, type: integer, source: computed, description: "max(0, forecast_open_on - committed_open_on) in days" }
      - { name: protection_posture, type: enum, source: computed, description: "PROTECTED | WATCH | AT_RISK | BREACHED | MET" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: RolloutProgram
    initial_state: SETUP
    terminal_states: [COMPLETE]
    transitions:
      - from: SETUP
        to: ACTIVE
        trigger: "POST /rollout/programs/{programId}/activate"
        actor: ProgramDirector
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: COMPLETE
        trigger: "POST /rollout/programs/{programId}/complete"
        actor: ProgramDirector
        preconditions:
          - "Every Site with program_id == this program has status in {OPEN, REMOVED} (ERR_ACTIVE_SITES_REMAIN)"
        side_effects: []

  - entity: Market
    initial_state: REGISTERED
    terminal_states: [AWARDED]
    transitions:
      - from: REGISTERED
        to: BIDDING
        trigger: "POST /rollout/markets/{marketId}/open-bidding"
        actor: ProcurementLead
        preconditions:
          - "Parent RolloutProgram status == ACTIVE (ERR_PROGRAM_NOT_ACTIVE)"
        side_effects: []
      - from: BIDDING
        to: AWARDED
        trigger: "system (automatic on BidPackage award for this market)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Contractor
    initial_state: PREQUALIFIED
    terminal_states: [SUSPENDED]
    transitions:
      - from: PREQUALIFIED
        to: SUSPENDED
        trigger: "POST /rollout/contractors/{contractorId}/suspend"
        actor: ProcurementLead
        preconditions: []
        side_effects: []

  - entity: Site
    initial_state: LISTED
    terminal_states: [OPEN, REMOVED]
    transitions:
      - from: LISTED
        to: DESIGN
        trigger: "POST /rollout/sites/{siteId}/advance-design"
        actor: DesignManager
        preconditions: []
        side_effects: ["increments Site.version by 1"]
      - from: DESIGN
        to: PERMITTING
        trigger: "POST /rollout/sites/{siteId}/submit-design"
        actor: DesignManager
        preconditions:
          - "A DrawingSet with program_id == site.program_id, jurisdiction_code == site.municipality_code, status == APPROVED exists (ERR_DRAWING_NOT_APPROVED)"
        side_effects: ["increments Site.version by 1"]
      - from: PERMITTING
        to: MOBILIZED
        trigger: "POST /rollout/sites/{siteId}/mark-permitted"
        actor: PermitCoordinator
        preconditions:
          - "Let p = the site's BUILDING Permit with the latest created_at (any status). If p exists and (p.status == EXPIRED, or p.status == ISSUED with p.expires_on <= current date): ERR_PERMIT_EXPIRED"
          - "Otherwise p must exist with status == ISSUED (ERR_PERMIT_NOT_ISSUED)"
        side_effects: ["increments Site.version by 1"]
      - from: MOBILIZED
        to: IN_BUILD
        trigger: "POST /rollout/sites/{siteId}/start-build"
        actor: SiteSuperintendent
        preconditions:
          - "Site's Market status == AWARDED (ERR_MARKET_NOT_AWARDED)"
        side_effects: ["increments Site.version by 1"]
      - from: IN_BUILD
        to: PUNCH
        trigger: "system (automatic when every vendor_type in {FIXTURE, IT, SIGNAGE} has a COMPLETE VendorMobilization for this site)"
        actor: system
        preconditions: []
        side_effects:
          - "Site.readiness_posture = SIGNAGE_HUNG"
          - "OpeningCommitment forecast recomputed (opening_date_forecast); protection_posture re-evaluated"
          - "increments Site.version by 1"
      - from: PUNCH
        to: TURNOVER
        trigger: "system (automatic on POST /rollout/turnovers for this site)"
        actor: system
        preconditions: []
        side_effects: ["increments Site.version by 1"]
      - from: TURNOVER
        to: PUNCH
        trigger: "system (automatic when the REQUESTED Turnover is rejected)"
        actor: system
        preconditions: []
        side_effects: ["increments Site.version by 1"]
        note: "Branching revert: operations rejection sends the site back to PUNCH"
      - from: TURNOVER
        to: OPEN
        trigger: "POST /rollout/sites/{siteId}/open"
        actor: OperationsLead
        preconditions:
          - "A Turnover for this site with status == ACCEPTED exists (ERR_TURNOVER_NOT_ACCEPTED)"
        side_effects:
          - "OpeningCommitment.protection_posture = MET"
          - "increments Site.version by 1"
      - from: LISTED
        to: REMOVED
        trigger: "POST /rollout/sites/{siteId}/remove"
        actor: ProgramDirector
        preconditions: ["No VendorMobilization for this site in ON_SITE (ERR_ACTIVE_VENDOR_ON_SITE)"]
        side_effects:
          - "VendorMobilizations in {PLANNED, SCHEDULED} -> CANCELLED"
          - "ChangeOrders in PROPOSED -> REJECTED"
          - "REQUESTED Turnover -> SUPERSEDED"
          - "Site excluded from program_budget_rollup aggregates"
          - "increments Site.version by 1"
      - from: DESIGN
        to: REMOVED
        trigger: "POST /rollout/sites/{siteId}/remove"
        actor: ProgramDirector
        preconditions: ["No VendorMobilization for this site in ON_SITE (ERR_ACTIVE_VENDOR_ON_SITE)"]
        side_effects:
          - "ChangeOrders in PROPOSED -> REJECTED"
          - "REQUESTED Turnover -> SUPERSEDED"
          - "Site excluded from program_budget_rollup aggregates"
          - "increments Site.version by 1"
      - from: PERMITTING
        to: REMOVED
        trigger: "POST /rollout/sites/{siteId}/remove"
        actor: ProgramDirector
        preconditions: ["No VendorMobilization for this site in ON_SITE (ERR_ACTIVE_VENDOR_ON_SITE)"]
        side_effects:
          - "ChangeOrders in PROPOSED -> REJECTED"
          - "REQUESTED Turnover -> SUPERSEDED"
          - "Site excluded from program_budget_rollup aggregates"
          - "increments Site.version by 1"
      - from: MOBILIZED
        to: REMOVED
        trigger: "POST /rollout/sites/{siteId}/remove"
        actor: ProgramDirector
        preconditions: ["No VendorMobilization for this site in ON_SITE (ERR_ACTIVE_VENDOR_ON_SITE)"]
        side_effects:
          - "ChangeOrders in PROPOSED -> REJECTED"
          - "REQUESTED Turnover -> SUPERSEDED"
          - "Site excluded from program_budget_rollup aggregates"
          - "increments Site.version by 1"
      - from: IN_BUILD
        to: REMOVED
        trigger: "POST /rollout/sites/{siteId}/remove"
        actor: ProgramDirector
        preconditions: ["No VendorMobilization for this site in ON_SITE (ERR_ACTIVE_VENDOR_ON_SITE)"]
        side_effects:
          - "VendorMobilizations in {PLANNED, SCHEDULED} -> CANCELLED"
          - "ChangeOrders in PROPOSED -> REJECTED"
          - "REQUESTED Turnover -> SUPERSEDED"
          - "Site excluded from program_budget_rollup aggregates"
          - "increments Site.version by 1"
      - from: PUNCH
        to: REMOVED
        trigger: "POST /rollout/sites/{siteId}/remove"
        actor: ProgramDirector
        preconditions: ["No VendorMobilization for this site in ON_SITE (ERR_ACTIVE_VENDOR_ON_SITE)"]
        side_effects:
          - "VendorMobilizations in {PLANNED, SCHEDULED} -> CANCELLED"
          - "ChangeOrders in PROPOSED -> REJECTED"
          - "REQUESTED Turnover -> SUPERSEDED"
          - "Site excluded from program_budget_rollup aggregates"
          - "increments Site.version by 1"
      - from: TURNOVER
        to: REMOVED
        trigger: "POST /rollout/sites/{siteId}/remove"
        actor: ProgramDirector
        preconditions: ["No VendorMobilization for this site in ON_SITE (ERR_ACTIVE_VENDOR_ON_SITE)"]
        side_effects:
          - "VendorMobilizations in {PLANNED, SCHEDULED} -> CANCELLED"
          - "ChangeOrders in PROPOSED -> REJECTED"
          - "REQUESTED Turnover -> SUPERSEDED"
          - "Site excluded from program_budget_rollup aggregates"
          - "increments Site.version by 1"

  - entity: DrawingSet
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /rollout/drawing-sets/{drawingSetId}/submit"
        actor: DesignManager
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /rollout/drawing-sets/{drawingSetId}/approve"
        actor: DesignManager
        preconditions: []
        side_effects:
          - "Any other DrawingSet with same (program_id, jurisdiction_code) in APPROVED -> SUPERSEDED"
          - "This set's supersedes_set_id := id of the superseded set (null if none)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /rollout/drawing-sets/{drawingSetId}/reject"
        actor: DesignManager
        preconditions: []
        side_effects: ["rejection_reason recorded"]
      - from: REJECTED
        to: DRAFT
        trigger: "POST /rollout/drawing-sets/{drawingSetId}/revise"
        actor: DesignManager
        preconditions: []
        side_effects: ["review_round += 1"]
        note: "Cyclic revision loop"

  - entity: Permit
    initial_state: DRAFT
    terminal_states: [WITHDRAWN, EXPIRED]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /rollout/permits/{permitId}/file"
        actor: PermitCoordinator
        preconditions:
          - "Pinned DrawingSet status == APPROVED and revision == max APPROVED revision for its (program_id, jurisdiction_code) (ERR_DRAWING_SUPERSEDED)"
        side_effects:
          - "fee_cents computed (permit_fee_schedule); Site.permit_fees_paid_cents += fee_cents"
          - "filed_at = clock; review_due_on = current date + statutory_review_days"
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /rollout/permits/{permitId}/start-review"
        actor: PermitCoordinator
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: ISSUED
        trigger: "POST /rollout/permits/{permitId}/issue"
        actor: PermitCoordinator
        preconditions: []
        side_effects:
          - "issued_at = clock; expires_on = current date + permit_validity_days"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /rollout/permits/{permitId}/reject"
        actor: PermitCoordinator
        preconditions: []
        side_effects: ["rejection_reason recorded"]
      - from: REJECTED
        to: FILED
        trigger: "POST /rollout/permits/{permitId}/refile"
        actor: PermitCoordinator
        preconditions:
          - "Request drawing_set_id identifies a DrawingSet with status == APPROVED and revision == max APPROVED revision for (site.program_id, site.municipality_code) (ERR_DRAWING_SUPERSEDED)"
        side_effects:
          - "round_number += 1; drawing_set_id re-pinned to request value"
          - "fee_cents = round_half_up(0.5 * permit_fee_schedule base formula); Site.permit_fees_paid_cents += fee_cents"
          - "filed_at = clock; review_due_on recomputed"
        note: "Cyclic resubmission loop with re-validation of the pinned drawing revision"
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /rollout/permits/{permitId}/withdraw"
        actor: PermitCoordinator
        preconditions: []
        side_effects: ["Site.permit_fees_paid_cents -= fee_cents (full current-round refund)"]
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /rollout/permits/{permitId}/withdraw"
        actor: PermitCoordinator
        preconditions: []
        side_effects: ["Site.permit_fees_paid_cents -= fee_cents (full current-round refund)"]
      - from: ISSUED
        to: EXPIRED
        trigger: "system (POST /rollout/_sweeps/time-based, when current date >= expires_on)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: BidPackage
    initial_state: DRAFT
    terminal_states: [AWARDED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /rollout/bid-packages/{bidPackageId}/open"
        actor: ProcurementLead
        preconditions:
          - "Market status == BIDDING (ERR_MARKET_NOT_BIDDING)"
          - "clock >= bid_open_at (ERR_BID_WINDOW_NOT_OPEN)"
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "POST /rollout/bid-packages/{bidPackageId}/close"
        actor: ProcurementLead
        preconditions:
          - "clock >= bid_close_at (ERR_BID_WINDOW_STILL_OPEN)"
        side_effects: []
      - from: CLOSED
        to: AWARDED
        trigger: "POST /rollout/bid-packages/{bidPackageId}/award"
        actor: ProcurementLead
        preconditions:
          - "At least one Bid with status == SUBMITTED and is_responsive == true (ERR_NO_RESPONSIVE_BIDS)"
        side_effects:
          - "Winning bid (per bid_evaluation ranking) -> AWARDED; awarded_bid_id set"
          - "All other SUBMITTED bids -> REJECTED"
          - "Market BIDDING -> AWARDED"
          - "Every Site with market_id == package.market_id, phase_wave == package.phase_wave, status not in {OPEN, REMOVED}: base_contract_cents = winning amount_cents"
          - "site_budget_variance and program_budget_rollup recomputed for affected sites/program"
          - "OpeningCommitment forecasts recomputed for affected sites"

  - entity: Bid
    initial_state: SUBMITTED
    terminal_states: [WITHDRAWN, AWARDED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /rollout/bids/{bidId}/withdraw"
        actor: GCVendor
        preconditions:
          - "Bid.contractor_id == X-User-ID (ERR_FORBIDDEN_IDENTITY)"
          - "BidPackage status != AWARDED (ERR_INVALID_STATE)"
        side_effects: []
      - from: SUBMITTED
        to: AWARDED
        trigger: "system (automatic on package award for the winning bid)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "system (automatic on package award for non-winning bids)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: VendorMobilization
    initial_state: PLANNED
    terminal_states: [COMPLETE, CANCELLED]
    transitions:
      - from: PLANNED
        to: SCHEDULED
        trigger: "POST /rollout/vendor-mobilizations/{mobilizationId}/schedule"
        actor: SiteSuperintendent
        preconditions:
          - "Site status in {IN_BUILD, PUNCH} (ERR_SITE_NOT_IN_BUILD)"
          - "Predecessor rule: IT requires a COMPLETE FIXTURE mobilization on the site; SIGNAGE requires a COMPLETE IT mobilization; FIXTURE none (ERR_VENDOR_PREDECESSOR_INCOMPLETE)"
          - "planned_start_on < planned_end_on and planned_end_on > current date (ERR_SCHEDULE_INFEASIBLE)"
          - "No half-open overlap: no other mobilization on same site with status in {PLANNED, SCHEDULED, ON_SITE} whose [planned_start_on, planned_end_on) intersects this window; end == start adjacency allowed (ERR_VENDOR_WINDOW_OVERLAP)"
          - "Market crew-day capacity: for every day d in window, count of mobilizations (any site in market, status in {SCHEDULED, ON_SITE}) covering d must be < market.max_concurrent_vendor_crews (ERR_MARKET_CAPACITY_FULL)"
        side_effects: []
      - from: SCHEDULED
        to: ON_SITE
        trigger: "POST /rollout/vendor-mobilizations/{mobilizationId}/arrive"
        actor: SiteSuperintendent
        preconditions:
          - "current date >= planned_start_on (ERR_SCHEDULE_INFEASIBLE)"
        side_effects: ["actual_start_on = current date"]
      - from: ON_SITE
        to: COMPLETE
        trigger: "POST /rollout/vendor-mobilizations/{mobilizationId}/complete"
        actor: SiteSuperintendent
        preconditions: []
        side_effects:
          - "actual_end_on = current date"
          - "Site.readiness_posture recomputed: FIXTURE complete -> FIXTURE_SET; IT complete -> IT_LIVE; SIGNAGE complete -> SIGNAGE_HUNG"
          - "When all three vendor types COMPLETE: Site IN_BUILD -> PUNCH (automatic)"
          - "OpeningCommitment forecast recomputed (opening_date_forecast); protection_posture re-evaluated"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /rollout/vendor-mobilizations/{mobilizationId}/cancel"
        actor: SiteSuperintendent
        preconditions: []
        side_effects: ["Market crew-day usage released for every day of the window"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /rollout/vendor-mobilizations/{mobilizationId}/cancel"
        actor: SiteSuperintendent
        preconditions: []
        side_effects: ["Market crew-day usage released for every day of the window"]

  - entity: ChangeOrder
    initial_state: PROPOSED
    terminal_states: [REJECTED, CANCELLED, RESCINDED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /rollout/change-orders/{changeOrderId}/approve"
        actor: FinanceController | ProgramDirector
        preconditions:
          - "Site status not in {OPEN, REMOVED} (ERR_INVALID_STATE / ERR_ALREADY_TERMINAL)"
          - "Tier authority: STANDARD/ELEVATED require FinanceController; CRITICAL requires ProgramDirector (ERR_CO_TIER_ROLE_REQUIRED)"
          - "Approver X-User-ID != proposed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "cost_category == SCHEDULE blocked when site's OpeningCommitment.protection_posture in {AT_RISK, BREACHED} (ERR_OPENING_LOCK_ENGAGED)"
          - "expected_site_version == Site.version (ERR_STALE_VERSION)"
          - "amount_cents <= 0, or Site.committed_cents + amount_cents <= Site.budget_allocation_cents (ERR_BUDGET_HEADROOM_EXCEEDED)"
        side_effects:
          - "Site.approved_co_cents += amount_cents; Site.proposed_co_cents -= amount_cents; committed_cents recomputed"
          - "increments Site.version by 1"
          - "Site variance ratios recomputed; budget_posture re-evaluated (final ratio)"
          - "RolloutProgram.committed_cents and contingency_reserved_cents recomputed; budget_posture re-evaluated"
          - "OpeningCommitment forecast recomputed using provisional-ratio slip factor"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /rollout/change-orders/{changeOrderId}/reject"
        actor: FinanceController | ProgramDirector
        preconditions: []
        side_effects:
          - "Site.proposed_co_cents -= amount_cents; provisional ratio recomputed"
          - "increments Site.version by 1"
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /rollout/change-orders/{changeOrderId}/cancel"
        actor: SiteSuperintendent
        preconditions:
          - "proposed_by_user_id == X-User-ID (ERR_FORBIDDEN_IDENTITY)"
        side_effects:
          - "Site.proposed_co_cents -= amount_cents; provisional ratio recomputed"
          - "increments Site.version by 1"
      - from: APPROVED
        to: RESCINDED
        trigger: "POST /rollout/change-orders/{changeOrderId}/rescind"
        actor: FinanceController
        preconditions:
          - "Site status not in {OPEN, REMOVED} (ERR_INVALID_STATE)"
        side_effects:
          - "Site.approved_co_cents -= amount_cents; committed_cents recomputed (compensation of approve)"
          - "increments Site.version by 1"
          - "Site variance ratios, budget_posture, program rollup, and OpeningCommitment forecast recomputed"

  - entity: PunchItem
    initial_state: OPEN
    terminal_states: [VERIFIED, WAIVED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /rollout/punch-items/{punchItemId}/resolve"
        actor: SiteSuperintendent
        preconditions: []
        side_effects: ["Site punch counts unchanged (RESOLVED still open)"]
      - from: RESOLVED
        to: VERIFIED
        trigger: "POST /rollout/punch-items/{punchItemId}/verify"
        actor: OperationsLead
        preconditions: []
        side_effects: ["Site punch counts recomputed"]
      - from: RESOLVED
        to: OPEN
        trigger: "POST /rollout/punch-items/{punchItemId}/fail-verification"
        actor: OperationsLead
        preconditions: []
        side_effects: ["reopen_count += 1", "Site punch counts recomputed"]
        note: "Cyclic rework loop"
      - from: OPEN
        to: WAIVED
        trigger: "POST /rollout/punch-items/{punchItemId}/waive"
        actor: OperationsLead
        preconditions:
          - "severity in {MAJOR, MINOR} (ERR_PUNCH_NOT_WAIVABLE)"
        side_effects: ["Site punch counts recomputed"]
      - from: RESOLVED
        to: WAIVED
        trigger: "POST /rollout/punch-items/{punchItemId}/waive"
        actor: OperationsLead
        preconditions:
          - "severity in {MAJOR, MINOR} (ERR_PUNCH_NOT_WAIVABLE)"
        side_effects: ["Site punch counts recomputed"]

  - entity: Turnover
    initial_state: REQUESTED
    terminal_states: [ACCEPTED, REJECTED, SUPERSEDED]
    transitions:
      - from: REQUESTED
        to: ACCEPTED
        trigger: "POST /rollout/turnovers/{turnoverId}/accept"
        actor: OperationsLead
        preconditions:
          - "expected_site_version == Site.version (ERR_STALE_VERSION)"
          - "All CRITICAL and MAJOR PunchItems on the site have status == VERIFIED, and (waive_open_minor == true or all MINOR items in {VERIFIED, WAIVED}) (ERR_PUNCH_ITEMS_OUTSTANDING)"
        side_effects:
          - "If waive_open_minor: MINOR PunchItems in {OPEN, RESOLVED} -> WAIVED"
          - "Site.actuals_cents = Site.committed_cents (final reconciliation); program actuals recomputed"
          - "increments Site.version by 1"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /rollout/turnovers/{turnoverId}/reject"
        actor: OperationsLead
        preconditions: []
        side_effects:
          - "rejection_reason recorded"
          - "Site TURNOVER -> PUNCH (automatic revert)"
      - from: REQUESTED
        to: SUPERSEDED
        trigger: "system (automatic when the site is removed)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: OpeningCommitment
    initial_state: PROTECTED
    terminal_states: [MET]
    transitions:
      - from: PROTECTED
        to: WATCH
        trigger: "system (recalculation: slip_days in 1..7)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PROTECTED
        to: AT_RISK
        trigger: "system (recalculation: slip_days in 8..21)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PROTECTED
        to: BREACHED
        trigger: "system (recalculation: slip_days >= 22, or current date >= committed_open_on while site not OPEN)"
        actor: system
        preconditions: []
        side_effects: []
      - from: WATCH
        to: PROTECTED
        trigger: "system (recalculation: slip_days == 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: WATCH
        to: AT_RISK
        trigger: "system (recalculation: slip_days in 8..21)"
        actor: system
        preconditions: []
        side_effects: []
      - from: WATCH
        to: BREACHED
        trigger: "system (recalculation: slip_days >= 22, or current date >= committed_open_on while site not OPEN)"
        actor: system
        preconditions: []
        side_effects: []
      - from: AT_RISK
        to: PROTECTED
        trigger: "system (recalculation: slip_days == 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: AT_RISK
        to: WATCH
        trigger: "system (recalculation: slip_days in 1..7)"
        actor: system
        preconditions: []
        side_effects: []
      - from: AT_RISK
        to: BREACHED
        trigger: "system (recalculation: slip_days >= 22, or current date >= committed_open_on while site not OPEN)"
        actor: system
        preconditions: []
        side_effects: []
      - from: BREACHED
        to: PROTECTED
        trigger: "system (recalculation after committed_open_on moved later by director override: slip_days == 0 and current date < committed_open_on)"
        actor: system
        preconditions: []
        side_effects: []
      - from: BREACHED
        to: WATCH
        trigger: "system (recalculation after director override: slip_days in 1..7)"
        actor: system
        preconditions: []
        side_effects: []
      - from: BREACHED
        to: AT_RISK
        trigger: "system (recalculation after director override: slip_days in 8..21)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PROTECTED
        to: MET
        trigger: "system (automatic when site -> OPEN)"
        actor: system
        preconditions: []
        side_effects: []
      - from: WATCH
        to: MET
        trigger: "system (automatic when site -> OPEN)"
        actor: system
        preconditions: []
        side_effects: []
      - from: AT_RISK
        to: MET
        trigger: "system (automatic when site -> OPEN)"
        actor: system
        preconditions: []
        side_effects: []
      - from: BREACHED
        to: MET
        trigger: "system (automatic when site -> OPEN)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# Concurrency Rules (§1.2.1 — OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: site-patch-stale-version
    parent_entity: Site
    write_endpoint: "PATCH /rollout/sites/{siteId}"
    occ_field: expected_site_version
    description: |
      Updating a Site whose version has advanced since the client last read it
      is rejected. The client's view of budget_allocation_cents / target_open_date
      is stale relative to the server's current record.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: co-approve-stale-site-version
    parent_entity: Site
    write_endpoint: "POST /rollout/change-orders/{changeOrderId}/approve"
    occ_field: expected_site_version
    description: |
      Approving a ChangeOrder against a Site whose version has advanced since
      the approver last observed it is rejected; the headroom and posture the
      approver saw no longer reflect the site's ledger.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: turnover-accept-stale-site-version
    parent_entity: Site
    write_endpoint: "POST /rollout/turnovers/{turnoverId}/accept"
    occ_field: expected_site_version
    description: |
      Accepting a Turnover against a Site whose version has advanced since the
      operations lead last observed it is rejected; punch counts or readiness
      may have changed under the snapshot the decision was based on.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: site_committed_cost
    trigger: "BidPackage award; ChangeOrder approve; ChangeOrder rescind"
    algorithm: aggregation
    formula: |
      Site.committed_cents = Site.base_contract_cents
        + sum(ChangeOrder.amount_cents where site_id == Site.id and status == APPROVED)
      Site.approved_co_cents = that same sum
      Site.proposed_co_cents = sum(amount_cents where status == PROPOSED)
    input_set: "ChangeOrders of the site; REMOVED sites excluded from program rollups"
    precision: "integer cents"

  - name: site_budget_variance
    trigger: "ChangeOrder propose/approve/reject/cancel/rescind; BidPackage award"
    algorithm: threshold
    formula: |
      if base_contract_cents == 0:
        variance_ratio_final_bp = 0; variance_ratio_provisional_bp = 0
      else:
        variance_ratio_final_bp = round_half_up((committed_cents - base_contract_cents) * 10000 / base_contract_cents)
        variance_ratio_provisional_bp = round_half_up((committed_cents + proposed_co_cents - base_contract_cents) * 10000 / base_contract_cents)
      budget_posture: final <= 500 -> WITHIN; final <= 1500 -> WATCH; else OVERRUN
    input_set: "Single site's contract and change-order buckets"
    precision: "integer basis points, round_half_up"
    variants:
      - name: final
        when: "budget_posture, contingency reserve, turnover reconciliation"
        difference: "Uses committed_cents only (APPROVED change orders)"
      - name: provisional
        when: "opening_date_forecast slip factor and headroom display"
        difference: "Uses committed_cents + proposed_co_cents; identical data yields a higher ratio whenever a PROPOSED change order exists"

  - name: permit_fee_schedule
    trigger: "Permit file and refile"
    algorithm: aggregation
    formula: |
      base_fee(permit) = profile.fee_base_cents + round_half_up(site.square_footage * profile.fee_per_sqft_cents / 100)
      On file (round 1): fee_cents = base_fee(permit)
      On refile (round >= 2): fee_cents = round_half_up(0.5 * base_fee(permit))
      Site.permit_fees_paid_cents is a ledger: += fee_cents on file/refile, -= fee_cents on withdraw.
      ROUNDING ORDER PINNED: each permit's fee is rounded to whole cents FIRST (round_half_up),
      then ledger-summed. Summing unrounded per-permit values and rounding once is FORBIDDEN.
    input_set: "Single permit + its site's square_footage + MunicipalityProfile for site.municipality_code"
    precision: "integer cents, round_half_up per permit before summation"

  - name: bid_evaluation
    trigger: "BidPackage award (and evaluation_score display under BEST_VALUE)"
    algorithm: weighted_scoring
    formula: |
      Candidate set: Bids of the package with status == SUBMITTED and is_responsive == true.
      is_responsive = (amount_cents > 0 and duration_days > 0 and duration_days <= package.max_duration_days).
      LOWEST_PRICE mode: rank by amount_cents ASC, tie -> duration_days ASC, tie -> submitted_at ASC (earliest first).
      BEST_VALUE mode:
        min_amount = min(amount_cents over candidate set)
        evaluation_score = round_half_up(0.7 * (min_amount / amount_cents) * 100 + 0.3 * tech_score, 2)
        rank by evaluation_score DESC, tie -> amount_cents ASC, tie -> submitted_at ASC.
      Winner = rank 1. Empty candidate set -> ERR_NO_RESPONSIVE_BIDS.
    input_set: "Bids with status SUBMITTED on the package; WITHDRAWN excluded; non-responsive excluded"
    constants:
      PRICE_WEIGHT: 0.7
      TECH_WEIGHT: 0.3
    precision: "2 decimal places, round_half_up"
    variants:
      - name: lowest_price
        when: "package.evaluation_mode == LOWEST_PRICE"
        difference: "Pure price ranking; evaluation_score is null"
      - name: best_value
        when: "package.evaluation_mode == BEST_VALUE"
        difference: "Weighted score can select a higher-priced bid with superior tech_score"

  - name: opening_date_forecast
    trigger: "POST /rollout/opening-commitments/{id}/recalculate; automatic on vendor complete, permit file/issue, CO approve/rescind, site auto-transition to PUNCH, time-based sweep"
    algorithm: forward_looking
    formula: |
      EVALUATION ORDER PINNED (circular-looking dependency resolved):
      (1) compute Site budget ratios and budget_posture from current CO buckets;
      (2) derive slip_factor_bp from the PROVISIONAL ratio: <=500 -> 0; <=1500 -> 500; else 1500;
      (3) compute forecast dates; (4) derive protection_posture. New-CO gating reads the
      stored protection_posture produced by this order; it never feeds back within one evaluation.
      today = current clock date.
      permit_block_days (optimistic) = max over Permits with status in {FILED, UNDER_REVIEW} of max(0, review_due_on - today); 0 if none.
      permit_block_days (conservative) = max over same set of max(0, filed date + profile.observed_avg_review_days - today); 0 if none.
      vendor chain (types in fixed order FIXTURE, IT, SIGNAGE; skip types having a COMPLETE mobilization):
        for each incomplete type, take its non-terminal mobilization (status in {PLANNED, SCHEDULED, ON_SITE});
        if several, the one with earliest created_at. A required type with NO non-terminal
        mobilization contributes 0 days (the forecast prices only scheduled work).
        optimistic: cursor start = max(cursor, planned_start_on); cursor = start + (planned_end_on - planned_start_on) days.
        conservative: same but duration = round_half_up(planned_days * (1 + slip_factor_bp / 10000)) days.
        (For ON_SITE, optimistic/conservative both use max(0, planned_end_on - cursor) with cursor = max(cursor, today).)
      forecast_open_on = today + permit_block_days(conservative) + conservative vendor chain + PUNCH_BUFFER_DAYS
      forecast_optimistic_on = today + permit_block_days(optimistic) + optimistic vendor chain + PUNCH_BUFFER_DAYS
      slip_days = max(0, forecast_open_on - committed_open_on)
      protection_posture: site OPEN -> MET; today >= committed_open_on -> BREACHED;
        slip 0 -> PROTECTED; 1..7 -> WATCH; 8..21 -> AT_RISK; >=22 -> BREACHED.
    input_set: "Site not in {OPEN, REMOVED}; Permits in {FILED, UNDER_REVIEW}; VendorMobilizations not in {COMPLETE, CANCELLED}"
    constants:
      PUNCH_BUFFER_DAYS: 10
    precision: "whole days; conservative durations round_half_up"
    variants:
      - name: optimistic
        when: "Stored as forecast_optimistic_on"
        difference: "Statutory review days, planned vendor durations, slip factor 0"
      - name: conservative
        when: "Stored as forecast_open_on; drives slip_days and protection_posture"
        difference: "Observed review days, vendor durations padded by provisional-ratio slip factor"

  - name: change_order_tier
    trigger: "ChangeOrder propose"
    algorithm: threshold
    formula: |
      pct_bp = abs(amount_cents) * 10000 / site.base_contract_cents  (exact rational, NO rounding; base_contract_cents > 0 guaranteed by proposal gate)
      pct_bp <= 200 -> STANDARD; pct_bp <= 500 -> ELEVATED; else CRITICAL
      STANDARD and ELEVATED approvable by FinanceController; CRITICAL only by ProgramDirector.
    input_set: "Single change order + site base contract"
    precision: "integer basis points, round_half_up"

  - name: market_crew_day_capacity
    trigger: "VendorMobilization schedule"
    algorithm: threshold
    formula: |
      For each day d in [planned_start_on, planned_end_on):
        concurrent(d) = count of VendorMobilizations m where m != this, m.status in {SCHEDULED, ON_SITE},
          m.site's market_id == this site's market_id, and d in [m.planned_start_on, m.planned_end_on)
      Require for all d: concurrent(d) + 1 <= market.max_concurrent_vendor_crews (at-capacity is allowed).
    input_set: "Non-terminal mobilizations across all sites of the same market"
    precision: "integer crews per day"

  - name: program_budget_rollup
    trigger: "ChangeOrder approve/rescind; BidPackage award; Site remove; Turnover accept"
    algorithm: aggregation
    formula: |
      over S := set of Sites with program_id == program.id and status != REMOVED
      program.committed_cents = sum(S.committed_cents)
      program.actuals_cents = sum(S.actuals_cents)
      over_cents(site) = max(0, site.committed_cents - site.base_contract_cents)
      program.contingency_reserved_cents =
        sum(over_cents(site) * 0.25 for site in S with budget_posture == WATCH)
        + sum(over_cents(site) * 1.0 for site in S with budget_posture == OVERRUN)   (round_half_up each term to cents)
      program.contingency_free_cents = contingency_pool_cents - contingency_reserved_cents
      program.budget_posture: free < 0 -> OVERRUN; reserved * 2 > pool -> GUARDED; else WITHIN_PLAN
    input_set: "Sites with status != REMOVED"
    precision: "integer cents, round_half_up per site term"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per §1.5 roles"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Identity ownership: Bid submit/withdraw contractor_id == X-User-ID; ChangeOrder cancel proposed_by_user_id == X-User-ID"
    error_id: ERR_FORBIDDEN_IDENTITY
    http_status: 403
    applies_to: "POST /rollout/bids; POST /rollout/bids/{bidId}/withdraw; POST /rollout/change-orders/{changeOrderId}/cancel"
  - priority: 4
    category: existence
    check: "Path ids exist, validated left-to-right; body FK ids (program_id, market_id, site_id, drawing_set_id, bid_package_id, contractor_id) exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: state
    check: "Target resource in a valid from-state for the operation; terminal states reject all transitions; domain state gates (program ACTIVE, market BIDDING/AWARDED, package OPEN, contractor PREQUALIFIED, site IN_BUILD, no existing REQUESTED turnover)"
    error_id: "ERR_INVALID_STATE | ERR_ALREADY_TERMINAL | ERR_PROGRAM_NOT_ACTIVE | ERR_MARKET_NOT_BIDDING | ERR_MARKET_NOT_AWARDED | ERR_BID_PACKAGE_NOT_OPEN | ERR_CONTRACTOR_NOT_PREQUALIFIED | ERR_SITE_NOT_IN_BUILD | ERR_TURNOVER_ALREADY_REQUESTED | ERR_ACTIVE_SITES_REMAIN | ERR_TURNOVER_NOT_ACCEPTED"
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 6
    category: business_constraint
    check: "OCC: expected_site_version equals current Site.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PATCH /rollout/sites/{siteId}; POST /rollout/change-orders/{changeOrderId}/approve; POST /rollout/turnovers/{turnoverId}/accept"
  - priority: 7
    category: business_safety
    check: "Compliance gates: segregation of duties on CO approve; tier authority (CRITICAL requires ProgramDirector)"
    error_id: "ERR_SEGREGATION_OF_DUTIES | ERR_CO_TIER_ROLE_REQUIRED"
    http_status: 403
    applies_to: "POST /rollout/change-orders/{changeOrderId}/approve"
  - priority: 8
    category: business_referential
    check: "Cross-entity reference gates: municipality profile exists; drawing set APPROVED and latest revision; vendor predecessor COMPLETE; BUILDING permit ISSUED"
    error_id: "ERR_MUNICIPALITY_PROFILE_MISSING | ERR_DRAWING_NOT_APPROVED | ERR_DRAWING_SUPERSEDED | ERR_VENDOR_PREDECESSOR_INCOMPLETE | ERR_PERMIT_NOT_ISSUED"
    http_status: 409
    applies_to: "permit create/file/refile; site submit-design/mark-permitted; vendor schedule"
  - priority: 9
    category: business_temporal
    check: "Time-window gates: bid open/close windows; vendor window half-open overlap and feasibility; permit expiry; opening-date lock and SCHEDULE-CO opening lock"
    error_id: "ERR_BID_WINDOW_NOT_OPEN | ERR_BID_WINDOW_CLOSED | ERR_BID_WINDOW_STILL_OPEN | ERR_SCHEDULE_INFEASIBLE | ERR_PERMIT_EXPIRED | ERR_VENDOR_WINDOW_OVERLAP | ERR_OPEN_DATE_LOCKED | ERR_OPENING_LOCK_ENGAGED"
    http_status: 409
    applies_to: "bid package open/close; bid submit; vendor schedule/arrive; site mark-permitted/PATCH; CO approve"
  - priority: 10
    category: business_constraint
    check: "Uniqueness and capacity constraints: one non-terminal permit per (site, permit_type); one bid per (contractor, package); market crew-day capacity; no removal with ON_SITE vendor; punch critical mass; punch waiver severity; punch outstanding at turnover accept"
    error_id: "ERR_DUPLICATE_PERMIT_TYPE | ERR_DUPLICATE_BID | ERR_MARKET_CAPACITY_FULL | ERR_ACTIVE_VENDOR_ON_SITE | ERR_PUNCH_CRITICAL_OPEN | ERR_PUNCH_NOT_WAIVABLE | ERR_PUNCH_ITEMS_OUTSTANDING | ERR_NO_RESPONSIVE_BIDS"
    http_status: 409
    applies_to: "permit create; bid submit; vendor schedule; site remove; turnover request/accept; punch waive; package award"
  - priority: 11
    category: business_fiscal
    check: "Budget headroom: positive amount_cents requires committed_cents + amount_cents <= budget_allocation_cents"
    error_id: ERR_BUDGET_HEADROOM_EXCEEDED
    http_status: 422
    applies_to: "POST /rollout/change-orders/{changeOrderId}/approve"
  - priority: 12
    category: business_constraint
    check: "Malformed or missing required fields; enum out of range; numeric range violations (tech_score 0..100)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

# =============================================================================
# Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving ---
  - method: POST
    path: "/rollout/_clock/set_current_utc"
    description: "Set the logical clock. Startup default is 2026-05-01T00:00:00Z; before any call the clock reads exactly this default and never the wall clock."
    roles: [ProgramDirector]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock advanced; nothing else until sweep or gated action"]
  - method: POST
    path: "/rollout/_sweeps/time-based"
    description: "Apply clock-driven transitions: ISSUED permits with current date >= expires_on -> EXPIRED; recompute all non-terminal OpeningCommitments."
    roles: [ProgramDirector]
    code: 200
    input: []
    output: { expired_permit_ids: "string[]", recomputed_commitment_ids: "string[]" }
    side_effects: ["Permit ISSUED -> EXPIRED when due", "opening_date_forecast recompute"]

  # --- RolloutProgram ---
  - method: POST
    path: "/rollout/programs"
    description: "Create a rollout program"
    roles: [ProgramDirector]
    code: 201
    input: [name, fiscal_year, total_budget_cents, contingency_pool_cents]
    output: RolloutProgram
    side_effects: ["status SETUP; computed aggregates zeroed; budget_posture WITHIN_PLAN"]
  - method: GET
    path: "/rollout/programs"
    description: "List programs"
    roles: &all_roles [ProgramDirector, DesignManager, PermitCoordinator, ProcurementLead, GCVendor, SiteSuperintendent, OperationsLead, FinanceController]
    code: 200
    input: ["status?"]
    output: RolloutProgram[]
    side_effects: []
  - method: GET
    path: "/rollout/programs/{programId}"
    description: "Get a program including computed budget rollup"
    roles: *all_roles
    code: 200
    input: []
    output: RolloutProgram
    side_effects: []
  - method: POST
    path: "/rollout/programs/{programId}/activate"
    description: "SETUP -> ACTIVE"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: RolloutProgram
    side_effects: ["status ACTIVE"]
  - method: POST
    path: "/rollout/programs/{programId}/complete"
    description: "ACTIVE -> COMPLETE; all sites must be terminal"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: RolloutProgram
    side_effects: ["status COMPLETE"]

  # --- Market ---
  - method: POST
    path: "/rollout/markets"
    description: "Create a market in a program"
    roles: [ProgramDirector]
    code: 201
    input: [program_id, name, state_code, max_concurrent_vendor_crews]
    output: Market
    side_effects: ["status REGISTERED"]
  - method: GET
    path: "/rollout/markets"
    description: "List markets"
    roles: *all_roles
    code: 200
    input: ["program_id?", "status?"]
    output: Market[]
    side_effects: []
  - method: GET
    path: "/rollout/markets/{marketId}"
    description: "Get a market"
    roles: *all_roles
    code: 200
    input: []
    output: Market
    side_effects: []
  - method: POST
    path: "/rollout/markets/{marketId}/open-bidding"
    description: "REGISTERED -> BIDDING; program must be ACTIVE"
    roles: [ProcurementLead]
    code: 200
    input: []
    output: Market
    side_effects: ["status BIDDING"]

  # --- MunicipalityProfile ---
  - method: POST
    path: "/rollout/municipality-profiles"
    description: "Create municipality fee/review profile"
    roles: [PermitCoordinator]
    code: 201
    input: [municipality_code, statutory_review_days, observed_avg_review_days, permit_validity_days, fee_base_cents, fee_per_sqft_cents]
    output: MunicipalityProfile
    side_effects: []
  - method: GET
    path: "/rollout/municipality-profiles"
    description: "List municipality profiles"
    roles: *all_roles
    code: 200
    input: ["municipality_code?"]
    output: MunicipalityProfile[]
    side_effects: []

  # --- Site ---
  - method: POST
    path: "/rollout/sites"
    description: "Create a site; auto-creates its OpeningCommitment"
    roles: [ProgramDirector]
    code: 201
    input: [program_id, market_id, municipality_code, address, square_footage, phase_wave, budget_allocation_cents, target_open_date]
    output: Site
    side_effects:
      - "status LISTED; readiness_posture ROUGH; base_contract_cents 0"
      - "OpeningCommitment auto-created: committed_open_on = target_open_date, protection_posture PROTECTED"
  - method: GET
    path: "/rollout/sites"
    description: "List sites with filters"
    roles: *all_roles
    code: 200
    input: ["program_id?", "market_id?", "status?", "phase_wave?"]
    output: Site[]
    side_effects: []
  - method: GET
    path: "/rollout/sites/{siteId}"
    description: "Get a site"
    roles: *all_roles
    code: 200
    input: []
    output: Site
    side_effects: []
  - method: PATCH
    path: "/rollout/sites/{siteId}"
    description: "Update mutable site fields; OCC on expected_site_version; target_open_date locked once past DESIGN unless director override"
    roles: [ProgramDirector]
    code: 200
    input: ["target_open_date?", "budget_allocation_cents?", "phase_wave?", "director_override_reason?", expected_site_version]
    output: Site
    side_effects:
      - "increments Site.version by 1"
      - "target_open_date change syncs OpeningCommitment.committed_open_on and recomputes forecast/posture"
      - "target_open_date change while status not in {LISTED, DESIGN} requires director_override_reason (ERR_OPEN_DATE_LOCKED)"
  - method: POST
    path: "/rollout/sites/{siteId}/advance-design"
    description: "LISTED -> DESIGN"
    roles: [DesignManager]
    code: 200
    input: []
    output: Site
    side_effects: ["status DESIGN", "increments Site.version by 1"]
  - method: POST
    path: "/rollout/sites/{siteId}/submit-design"
    description: "DESIGN -> PERMITTING; requires APPROVED drawing set for site municipality"
    roles: [DesignManager]
    code: 200
    input: []
    output: Site
    side_effects: ["status PERMITTING", "increments Site.version by 1"]
  - method: POST
    path: "/rollout/sites/{siteId}/mark-permitted"
    description: "PERMITTING -> MOBILIZED; requires unexpired ISSUED BUILDING permit"
    roles: [PermitCoordinator]
    code: 200
    input: []
    output: Site
    side_effects: ["status MOBILIZED", "increments Site.version by 1"]
  - method: POST
    path: "/rollout/sites/{siteId}/start-build"
    description: "MOBILIZED -> IN_BUILD; market must be AWARDED"
    roles: [SiteSuperintendent]
    code: 200
    input: []
    output: Site
    side_effects: ["status IN_BUILD", "increments Site.version by 1"]
  - method: POST
    path: "/rollout/sites/{siteId}/open"
    description: "TURNOVER -> OPEN; requires ACCEPTED turnover"
    roles: [OperationsLead]
    code: 200
    input: []
    output: Site
    side_effects: ["status OPEN", "OpeningCommitment.protection_posture MET", "increments Site.version by 1"]
  - method: POST
    path: "/rollout/sites/{siteId}/remove"
    description: "Any non-OPEN state -> REMOVED; cascades cancel/reject open work"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: Site
    side_effects:
      - "status REMOVED"
      - "VendorMobilizations {PLANNED, SCHEDULED} -> CANCELLED; PROPOSED ChangeOrders -> REJECTED; REQUESTED Turnover -> SUPERSEDED"
      - "Site excluded from program_budget_rollup"
      - "increments Site.version by 1"

  # --- DrawingSet ---
  - method: POST
    path: "/rollout/drawing-sets"
    description: "Create a drawing set; revision auto-assigned per (program, jurisdiction)"
    roles: [DesignManager]
    code: 201
    input: [program_id, jurisdiction_code, "variance_notes?"]
    output: DrawingSet
    side_effects: ["status DRAFT; revision = 1 + max existing revision for (program_id, jurisdiction_code)"]
  - method: GET
    path: "/rollout/drawing-sets"
    description: "List drawing sets"
    roles: *all_roles
    code: 200
    input: ["program_id?", "jurisdiction_code?", "status?", "supersedes_set_id?"]
    output: DrawingSet[]
    side_effects: []
  - method: GET
    path: "/rollout/drawing-sets/{drawingSetId}"
    description: "Get a drawing set"
    roles: *all_roles
    code: 200
    input: []
    output: DrawingSet
    side_effects: []
  - method: POST
    path: "/rollout/drawing-sets/{drawingSetId}/submit"
    description: "DRAFT -> SUBMITTED"
    roles: [DesignManager]
    code: 200
    input: []
    output: DrawingSet
    side_effects: ["status SUBMITTED"]
  - method: POST
    path: "/rollout/drawing-sets/{drawingSetId}/approve"
    description: "SUBMITTED -> APPROVED; supersedes previously APPROVED revision for the jurisdiction"
    roles: [DesignManager]
    code: 200
    input: []
    output: DrawingSet
    side_effects: ["status APPROVED", "prior APPROVED set for (program_id, jurisdiction_code) -> SUPERSEDED; supersedes_set_id pinned"]
  - method: POST
    path: "/rollout/drawing-sets/{drawingSetId}/reject"
    description: "SUBMITTED -> REJECTED"
    roles: [DesignManager]
    code: 200
    input: [rejection_reason]
    output: DrawingSet
    side_effects: ["status REJECTED"]
  - method: POST
    path: "/rollout/drawing-sets/{drawingSetId}/revise"
    description: "REJECTED -> DRAFT; review_round += 1"
    roles: [DesignManager]
    code: 200
    input: []
    output: DrawingSet
    side_effects: ["status DRAFT", "review_round += 1"]

  # --- Permit ---
  - method: POST
    path: "/rollout/permits"
    description: "Create a permit application pinning a drawing revision"
    roles: [PermitCoordinator]
    code: 201
    input: [site_id, permit_type, drawing_set_id]
    output: Permit
    side_effects: ["status DRAFT; municipality_code copied from site; round_number 1"]
  - method: GET
    path: "/rollout/permits"
    description: "List permits"
    roles: *all_roles
    code: 200
    input: ["site_id?", "drawing_set_id?", "status?", "permit_type?"]
    output: Permit[]
    side_effects: []
  - method: GET
    path: "/rollout/permits/{permitId}"
    description: "Get a permit"
    roles: *all_roles
    code: 200
    input: []
    output: Permit
    side_effects: []
  - method: POST
    path: "/rollout/permits/{permitId}/file"
    description: "DRAFT -> FILED; computes and debits the filing fee"
    roles: [PermitCoordinator]
    code: 200
    input: []
    output: Permit
    side_effects: ["fee_cents computed; Site.permit_fees_paid_cents += fee_cents; filed_at, review_due_on set"]
  - method: POST
    path: "/rollout/permits/{permitId}/start-review"
    description: "FILED -> UNDER_REVIEW"
    roles: [PermitCoordinator]
    code: 200
    input: []
    output: Permit
    side_effects: ["status UNDER_REVIEW"]
  - method: POST
    path: "/rollout/permits/{permitId}/issue"
    description: "UNDER_REVIEW -> ISSUED; sets expires_on"
    roles: [PermitCoordinator]
    code: 200
    input: []
    output: Permit
    side_effects: ["status ISSUED; issued_at set; expires_on = current date + permit_validity_days"]
  - method: POST
    path: "/rollout/permits/{permitId}/reject"
    description: "UNDER_REVIEW -> REJECTED"
    roles: [PermitCoordinator]
    code: 200
    input: [rejection_reason]
    output: Permit
    side_effects: ["status REJECTED"]
  - method: POST
    path: "/rollout/permits/{permitId}/refile"
    description: "REJECTED -> FILED; re-pins drawing revision; half fee"
    roles: [PermitCoordinator]
    code: 200
    input: [drawing_set_id]
    output: Permit
    side_effects: ["round_number += 1; drawing_set_id re-pinned; fee_cents = round_half_up(0.5 * base fee); Site.permit_fees_paid_cents += fee_cents; filed_at/review_due_on reset"]
  - method: POST
    path: "/rollout/permits/{permitId}/withdraw"
    description: "FILED|UNDER_REVIEW -> WITHDRAWN; refunds current-round fee"
    roles: [PermitCoordinator]
    code: 200
    input: []
    output: Permit
    side_effects: ["status WITHDRAWN; Site.permit_fees_paid_cents -= fee_cents"]

  # --- Contractor ---
  - method: POST
    path: "/rollout/contractors"
    description: "Register a prequalified GC"
    roles: [ProcurementLead]
    code: 201
    input: [legal_name, license_no, license_state]
    output: Contractor
    side_effects: ["status PREQUALIFIED"]
  - method: GET
    path: "/rollout/contractors"
    description: "List contractors"
    roles: *all_roles
    code: 200
    input: ["status?"]
    output: Contractor[]
    side_effects: []
  - method: GET
    path: "/rollout/contractors/{contractorId}"
    description: "Get a contractor"
    roles: *all_roles
    code: 200
    input: []
    output: Contractor
    side_effects: []
  - method: POST
    path: "/rollout/contractors/{contractorId}/suspend"
    description: "PREQUALIFIED -> SUSPENDED"
    roles: [ProcurementLead]
    code: 200
    input: []
    output: Contractor
    side_effects: ["status SUSPENDED"]

  # --- BidPackage ---
  - method: POST
    path: "/rollout/bid-packages"
    description: "Create a per-market per-wave bid package"
    roles: [ProcurementLead]
    code: 201
    input: [market_id, phase_wave, scope_description, bid_open_at, bid_close_at, evaluation_mode, max_duration_days]
    output: BidPackage
    side_effects: ["status DRAFT"]
  - method: GET
    path: "/rollout/bid-packages"
    description: "List bid packages"
    roles: *all_roles
    code: 200
    input: ["market_id?", "status?"]
    output: BidPackage[]
    side_effects: []
  - method: GET
    path: "/rollout/bid-packages/{bidPackageId}"
    description: "Get a bid package"
    roles: *all_roles
    code: 200
    input: []
    output: BidPackage
    side_effects: []
  - method: POST
    path: "/rollout/bid-packages/{bidPackageId}/open"
    description: "DRAFT -> OPEN; market BIDDING and clock >= bid_open_at"
    roles: [ProcurementLead]
    code: 200
    input: []
    output: BidPackage
    side_effects: ["status OPEN"]
  - method: POST
    path: "/rollout/bid-packages/{bidPackageId}/close"
    description: "OPEN -> CLOSED; clock >= bid_close_at"
    roles: [ProcurementLead]
    code: 200
    input: []
    output: BidPackage
    side_effects: ["status CLOSED"]
  - method: POST
    path: "/rollout/bid-packages/{bidPackageId}/award"
    description: "CLOSED -> AWARDED; selects winner per evaluation_mode; sets base contracts on wave sites"
    roles: [ProcurementLead]
    code: 200
    input: []
    output: BidPackage
    side_effects:
      - "winning Bid -> AWARDED; awarded_bid_id set; other SUBMITTED bids -> REJECTED"
      - "Market BIDDING -> AWARDED"
      - "Sites (market_id, phase_wave match; status not in {OPEN, REMOVED}): base_contract_cents = winning amount_cents"
      - "site/program budget rollups and opening forecasts recomputed"

  # --- Bid ---
  - method: POST
    path: "/rollout/bids"
    description: "Submit a bid; contractor_id must equal caller X-User-ID"
    roles: [GCVendor]
    code: 201
    input: [bid_package_id, contractor_id, amount_cents, duration_days, tech_score]
    output: Bid
    side_effects: ["status SUBMITTED; is_responsive computed; submitted_at = clock"]
  - method: GET
    path: "/rollout/bids"
    description: "List bids"
    roles: *all_roles
    code: 200
    input: ["bid_package_id?", "contractor_id?", "status?"]
    output: Bid[]
    side_effects: []
  - method: GET
    path: "/rollout/bids/{bidId}"
    description: "Get a bid"
    roles: *all_roles
    code: 200
    input: []
    output: Bid
    side_effects: []
  - method: POST
    path: "/rollout/bids/{bidId}/withdraw"
    description: "SUBMITTED -> WITHDRAWN; own bids only; package not yet awarded"
    roles: [GCVendor]
    code: 200
    input: []
    output: Bid
    side_effects: ["status WITHDRAWN"]

  # --- VendorMobilization ---
  - method: POST
    path: "/rollout/vendor-mobilizations"
    description: "Plan a vendor mobilization window (fixture/IT/signage)"
    roles: [SiteSuperintendent]
    code: 201
    input: [site_id, vendor_type, vendor_name, planned_start_on, planned_end_on]
    output: VendorMobilization
    side_effects: ["status PLANNED"]
  - method: GET
    path: "/rollout/vendor-mobilizations"
    description: "List vendor mobilizations"
    roles: *all_roles
    code: 200
    input: ["site_id?", "vendor_type?", "status?"]
    output: VendorMobilization[]
    side_effects: []
  - method: GET
    path: "/rollout/vendor-mobilizations/{mobilizationId}"
    description: "Get a vendor mobilization"
    roles: *all_roles
    code: 200
    input: []
    output: VendorMobilization
    side_effects: []
  - method: POST
    path: "/rollout/vendor-mobilizations/{mobilizationId}/schedule"
    description: "PLANNED -> SCHEDULED; enforces predecessor, half-open overlap, and market crew-day capacity"
    roles: [SiteSuperintendent]
    code: 200
    input: []
    output: VendorMobilization
    side_effects: ["status SCHEDULED; market crew-day usage consumed for window days"]
  - method: POST
    path: "/rollout/vendor-mobilizations/{mobilizationId}/arrive"
    description: "SCHEDULED -> ON_SITE; current date >= planned_start_on"
    roles: [SiteSuperintendent]
    code: 200
    input: []
    output: VendorMobilization
    side_effects: ["status ON_SITE; actual_start_on = current date"]
  - method: POST
    path: "/rollout/vendor-mobilizations/{mobilizationId}/complete"
    description: "ON_SITE -> COMPLETE; recomputes readiness and may auto-advance site to PUNCH"
    roles: [SiteSuperintendent]
    code: 200
    input: []
    output: VendorMobilization
    side_effects:
      - "status COMPLETE; actual_end_on = current date"
      - "Site.readiness_posture recomputed"
      - "Site IN_BUILD -> PUNCH when all three vendor types COMPLETE"
      - "OpeningCommitment forecast recomputed"
  - method: POST
    path: "/rollout/vendor-mobilizations/{mobilizationId}/cancel"
    description: "PLANNED|SCHEDULED -> CANCELLED; releases crew-day usage"
    roles: [SiteSuperintendent]
    code: 200
    input: []
    output: VendorMobilization
    side_effects: ["status CANCELLED; market crew-day usage released for window days"]

  # --- ChangeOrder ---
  - method: POST
    path: "/rollout/change-orders"
    description: "Propose a change order; site must be building-phase with an awarded market"
    roles: [SiteSuperintendent]
    code: 201
    input: [site_id, description, amount_cents, cost_category]
    output: ChangeOrder
    side_effects: ["status PROPOSED; tier computed; proposed_by_user_id = X-User-ID; Site.proposed_co_cents += amount_cents"]
  - method: GET
    path: "/rollout/change-orders"
    description: "List change orders"
    roles: *all_roles
    code: 200
    input: ["site_id?", "status?", "tier?"]
    output: ChangeOrder[]
    side_effects: []
  - method: GET
    path: "/rollout/change-orders/{changeOrderId}"
    description: "Get a change order"
    roles: *all_roles
    code: 200
    input: []
    output: ChangeOrder
    side_effects: []
  - method: POST
    path: "/rollout/change-orders/{changeOrderId}/approve"
    description: "PROPOSED -> APPROVED; tier authority + segregation + OCC + headroom; cascades budget posture"
    roles: [FinanceController, ProgramDirector]
    code: 200
    input: [expected_site_version, "approval_note?"]
    output: ChangeOrder
    side_effects:
      - "status APPROVED"
      - "Site.approved_co_cents += amount; proposed_co_cents -= amount; committed recomputed; increments Site.version by 1"
      - "Site budget_posture re-evaluated; program rollup recomputed; opening forecast recomputed"
  - method: POST
    path: "/rollout/change-orders/{changeOrderId}/reject"
    description: "PROPOSED -> REJECTED"
    roles: [FinanceController, ProgramDirector]
    code: 200
    input: [rejection_reason]
    output: ChangeOrder
    side_effects: ["status REJECTED; Site.proposed_co_cents -= amount; increments Site.version by 1"]
  - method: POST
    path: "/rollout/change-orders/{changeOrderId}/rescind"
    description: "APPROVED -> RESCINDED; compensates the budget effects of approve"
    roles: [FinanceController]
    code: 200
    input: [rescind_reason]
    output: ChangeOrder
    side_effects: ["status RESCINDED; Site.approved_co_cents -= amount; committed recomputed; increments Site.version by 1; posture/rollup/forecast recomputed"]
  - method: POST
    path: "/rollout/change-orders/{changeOrderId}/cancel"
    description: "PROPOSED -> CANCELLED; proposer only"
    roles: [SiteSuperintendent]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: ["status CANCELLED; Site.proposed_co_cents -= amount; increments Site.version by 1"]

  # --- PunchItem ---
  - method: POST
    path: "/rollout/punch-items"
    description: "Create a punch item; site must be PUNCH or TURNOVER"
    roles: [SiteSuperintendent]
    code: 201
    input: [site_id, description, severity]
    output: PunchItem
    side_effects: ["status OPEN; Site punch counts recomputed"]
  - method: GET
    path: "/rollout/punch-items"
    description: "List punch items"
    roles: *all_roles
    code: 200
    input: ["site_id?", "status?", "severity?"]
    output: PunchItem[]
    side_effects: []
  - method: GET
    path: "/rollout/punch-items/{punchItemId}"
    description: "Get a punch item"
    roles: *all_roles
    code: 200
    input: []
    output: PunchItem
    side_effects: []
  - method: POST
    path: "/rollout/punch-items/{punchItemId}/resolve"
    description: "OPEN -> RESOLVED"
    roles: [SiteSuperintendent]
    code: 200
    input: []
    output: PunchItem
    side_effects: ["status RESOLVED"]
  - method: POST
    path: "/rollout/punch-items/{punchItemId}/verify"
    description: "RESOLVED -> VERIFIED"
    roles: [OperationsLead]
    code: 200
    input: []
    output: PunchItem
    side_effects: ["status VERIFIED; Site punch counts recomputed"]
  - method: POST
    path: "/rollout/punch-items/{punchItemId}/fail-verification"
    description: "RESOLVED -> OPEN; reopen_count += 1"
    roles: [OperationsLead]
    code: 200
    input: [failure_note]
    output: PunchItem
    side_effects: ["status OPEN; reopen_count += 1; Site punch counts recomputed"]
  - method: POST
    path: "/rollout/punch-items/{punchItemId}/waive"
    description: "OPEN|RESOLVED -> WAIVED; MAJOR/MINOR only"
    roles: [OperationsLead]
    code: 200
    input: []
    output: PunchItem
    side_effects: ["status WAIVED; Site punch counts recomputed"]

  # --- Turnover ---
  - method: POST
    path: "/rollout/turnovers"
    description: "Request turnover to operations; site PUNCH with zero open critical punch items"
    roles: [SiteSuperintendent]
    code: 201
    input: [site_id]
    output: Turnover
    side_effects: ["status REQUESTED; readiness_snapshot pinned; Site PUNCH -> TURNOVER; increments Site.version by 1"]
  - method: GET
    path: "/rollout/turnovers"
    description: "List turnovers"
    roles: *all_roles
    code: 200
    input: ["site_id?", "status?"]
    output: Turnover[]
    side_effects: []
  - method: GET
    path: "/rollout/turnovers/{turnoverId}"
    description: "Get a turnover"
    roles: *all_roles
    code: 200
    input: []
    output: Turnover
    side_effects: []
  - method: POST
    path: "/rollout/turnovers/{turnoverId}/accept"
    description: "REQUESTED -> ACCEPTED; OCC on site version; optional minor-waiver sweep; finalizes actuals"
    roles: [OperationsLead]
    code: 200
    input: [expected_site_version, "waive_open_minor?"]
    output: Turnover
    side_effects:
      - "status ACCEPTED"
      - "if waive_open_minor: MINOR items in {OPEN, RESOLVED} -> WAIVED"
      - "Site.actuals_cents = committed_cents; increments Site.version by 1"
  - method: POST
    path: "/rollout/turnovers/{turnoverId}/reject"
    description: "REQUESTED -> REJECTED; site reverts to PUNCH"
    roles: [OperationsLead]
    code: 200
    input: [rejection_reason]
    output: Turnover
    side_effects: ["status REJECTED; Site TURNOVER -> PUNCH; increments Site.version by 1"]

  # --- OpeningCommitment ---
  - method: GET
    path: "/rollout/opening-commitments"
    description: "List opening commitments"
    roles: *all_roles
    code: 200
    input: ["site_id?", "protection_posture?"]
    output: OpeningCommitment[]
    side_effects: []
  - method: GET
    path: "/rollout/opening-commitments/{commitmentId}"
    description: "Get an opening commitment"
    roles: *all_roles
    code: 200
    input: []
    output: OpeningCommitment
    side_effects: []
  - method: POST
    path: "/rollout/opening-commitments/{commitmentId}/recalculate"
    description: "Force recompute of forecast_open_on, forecast_optimistic_on, slip_days, protection_posture"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: OpeningCommitment
    side_effects: ["opening_date_forecast executed; protection_posture re-evaluated"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID header" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_FORBIDDEN_IDENTITY, http: 403, condition: "X-User-ID does not match the required owner (bid contractor, CO proposer)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Change-order approver X-User-ID equals proposed_by_user_id" }
  - { id: ERR_CO_TIER_ROLE_REQUIRED, http: 403, condition: "CRITICAL change order approved by a role other than ProgramDirector" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, malformed value, enum/range violation" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource in a from-state that does not allow the requested transition" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Resource in a terminal state; no further transitions" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_site_version does not match current Site.version" }
  - { id: ERR_PROGRAM_NOT_ACTIVE, http: 409, condition: "Market open-bidding while program not ACTIVE" }
  - { id: ERR_ACTIVE_SITES_REMAIN, http: 409, condition: "Program complete attempted with sites not in {OPEN, REMOVED}" }
  - { id: ERR_MARKET_NOT_BIDDING, http: 409, condition: "Bid package open while market not BIDDING" }
  - { id: ERR_MARKET_NOT_AWARDED, http: 409, condition: "Site start-build or CO proposal while market not AWARDED" }
  - { id: ERR_CONTRACTOR_NOT_PREQUALIFIED, http: 409, condition: "Bid submission by SUSPENDED contractor" }
  - { id: ERR_DUPLICATE_BID, http: 409, condition: "Contractor already has a SUBMITTED bid on this package" }
  - { id: ERR_BID_PACKAGE_NOT_OPEN, http: 409, condition: "Bid submission while package not OPEN" }
  - { id: ERR_BID_WINDOW_NOT_OPEN, http: 409, condition: "Package open attempted before bid_open_at" }
  - { id: ERR_BID_WINDOW_CLOSED, http: 409, condition: "Bid submission at/after bid_close_at" }
  - { id: ERR_BID_WINDOW_STILL_OPEN, http: 409, condition: "Package close attempted before bid_close_at" }
  - { id: ERR_NO_RESPONSIVE_BIDS, http: 409, condition: "Award attempted with zero responsive SUBMITTED bids" }
  - { id: ERR_DRAWING_NOT_APPROVED, http: 409, condition: "Site submit-design without an APPROVED drawing set for the municipality" }
  - { id: ERR_DRAWING_SUPERSEDED, http: 409, condition: "Permit file/refile pinning a drawing revision that is not the latest APPROVED for the jurisdiction" }
  - { id: ERR_MUNICIPALITY_PROFILE_MISSING, http: 422, condition: "No MunicipalityProfile for site.municipality_code at permit creation" }
  - { id: ERR_DUPLICATE_PERMIT_TYPE, http: 409, condition: "Site already has a permit of this type in {DRAFT, FILED, UNDER_REVIEW, ISSUED}" }
  - { id: ERR_PERMIT_NOT_ISSUED, http: 409, condition: "Site mark-permitted without an ISSUED BUILDING permit" }
  - { id: ERR_PERMIT_EXPIRED, http: 409, condition: "Site mark-permitted with BUILDING permit whose expires_on <= current date" }
  - { id: ERR_SITE_NOT_IN_BUILD, http: 409, condition: "Vendor schedule while site not in {IN_BUILD, PUNCH}" }
  - { id: ERR_SCHEDULE_INFEASIBLE, http: 422, condition: "Window start >= end, window fully past, or arrival before planned_start_on" }
  - { id: ERR_VENDOR_PREDECESSOR_INCOMPLETE, http: 409, condition: "IT scheduled before FIXTURE COMPLETE, or SIGNAGE before IT COMPLETE" }
  - { id: ERR_VENDOR_WINDOW_OVERLAP, http: 409, condition: "Half-open window overlap with another non-terminal mobilization on the same site" }
  - { id: ERR_MARKET_CAPACITY_FULL, http: 409, condition: "Scheduling would push some market day above max_concurrent_vendor_crews" }
  - { id: ERR_ACTIVE_VENDOR_ON_SITE, http: 409, condition: "Site removal attempted with an ON_SITE mobilization" }
  - { id: ERR_BUDGET_HEADROOM_EXCEEDED, http: 422, condition: "CO approval would push committed_cents above budget_allocation_cents" }
  - { id: ERR_OPENING_LOCK_ENGAGED, http: 409, condition: "SCHEDULE-category CO approval while protection_posture in {AT_RISK, BREACHED}" }
  - { id: ERR_OPEN_DATE_LOCKED, http: 409, condition: "target_open_date edit past DESIGN without director_override_reason" }
  - { id: ERR_PUNCH_CRITICAL_OPEN, http: 409, condition: "Turnover request with punch_open_critical_count > 0" }
  - { id: ERR_PUNCH_NOT_WAIVABLE, http: 422, condition: "Waive attempted on CRITICAL punch item" }
  - { id: ERR_PUNCH_ITEMS_OUTSTANDING, http: 409, condition: "Turnover accept with unverified CRITICAL/MAJOR items, or MINOR open without waive_open_minor" }
  - { id: ERR_TURNOVER_ALREADY_REQUESTED, http: 409, condition: "Second turnover request while one is REQUESTED" }
  - { id: ERR_TURNOVER_NOT_ACCEPTED, http: 409, condition: "Site open attempted without an ACCEPTED turnover" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: ProgramDirector
    description: "National rollout program owner; budget envelope, site list, date protection overrides"
    identity: opaque
    exclusive_operations:
      - "POST /rollout/programs; activate; complete"
      - "POST /rollout/markets"
      - "POST /rollout/sites; PATCH /rollout/sites/{id}; remove"
      - "Approve CRITICAL change orders"
      - "POST /rollout/_clock/set_current_utc; POST /rollout/_sweeps/time-based"
      - "POST /rollout/opening-commitments/{id}/recalculate"
    shared_operations: ["GET endpoints"]
  - name: DesignManager
    description: "Prototype drawings and jurisdiction variance sets; site design phase"
    identity: opaque
    exclusive_operations:
      - "POST /rollout/drawing-sets and submit/approve/reject/revise"
      - "POST /rollout/sites/{id}/advance-design; submit-design"
    shared_operations: ["GET endpoints"]
  - name: PermitCoordinator
    description: "Municipality profiles and permit lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /rollout/municipality-profiles"
      - "POST /rollout/permits and file/start-review/issue/reject/refile/withdraw"
      - "POST /rollout/sites/{id}/mark-permitted"
    shared_operations: ["GET endpoints"]
  - name: ProcurementLead
    description: "GC prequalification, bid packages, evaluation and award per market"
    identity: opaque
    exclusive_operations:
      - "POST /rollout/contractors; suspend"
      - "POST /rollout/bid-packages; open/close/award"
      - "POST /rollout/markets/{id}/open-bidding"
    shared_operations: ["GET endpoints"]
  - name: GCVendor
    description: "General contractor bidding on packages"
    identity: "entity_backed:Contractor"
    exclusive_operations:
      - "POST /rollout/bids (contractor_id must equal X-User-ID)"
      - "POST /rollout/bids/{id}/withdraw (own bids only)"
    shared_operations: ["GET endpoints"]
  - name: SiteSuperintendent
    description: "GC-side site execution: build start, vendor sequencing, punch resolution, change-order proposals, turnover requests"
    identity: opaque
    exclusive_operations:
      - "POST /rollout/sites/{id}/start-build"
      - "POST /rollout/vendor-mobilizations and schedule/arrive/complete/cancel"
      - "POST /rollout/change-orders; cancel own proposals"
      - "POST /rollout/punch-items; resolve"
      - "POST /rollout/turnovers"
    shared_operations: ["GET endpoints"]
  - name: OperationsLead
    description: "Retail operations: punch verification/waivers, turnover acceptance, store opening"
    identity: opaque
    exclusive_operations:
      - "POST /rollout/punch-items/{id}/verify; fail-verification; waive"
      - "POST /rollout/turnovers/{id}/accept; reject"
      - "POST /rollout/sites/{id}/open"
    shared_operations: ["GET endpoints"]
  - name: FinanceController
    description: "Budget control: approves STANDARD/ELEVATED change orders, rescinds approvals"
    identity: opaque
    exclusive_operations:
      - "Approve STANDARD/ELEVATED change orders"
      - "POST /rollout/change-orders/{id}/reject; rescind"
    shared_operations: ["GET endpoints"]
