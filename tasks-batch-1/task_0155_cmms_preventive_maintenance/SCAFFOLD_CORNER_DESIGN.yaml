scaffold_corner_design:

  # =========================================================================
  # Entities — creation, required fields, defaults, computed/system, not-found
  # =========================================================================
  - section: entities
    instances:
      - name: create_site_returns_201_with_budget_spent_zero
        claim_type: Creation
        grounds: [entities.Site, endpoints]
        distinguishing_aspect: "POST /sites with name + maintenance_budget_cents returns 201; computed budget_spent_cents initialized to 0; timezone defaults to UTC."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /sites"
              payload: { name: "Greenfield", maintenance_budget_cents: 5000000 }
              as: MaintenanceManager
              captures: { sid: $.data.id, spent: $.data.budget_spent_cents, tz: $.data.timezone }
          assert:
            - "response status 201"
            - "Site.budget_spent_cents == 0"
            - "Site.timezone == UTC (default applied)"

      - name: create_asset_missing_site_id_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Asset.fields.site_id, "validations[priority=5]"]
        distinguishing_aspect: "POST /assets without the required site_id field is rejected ERR_INVALID_REQUEST (400) before any FK lookup."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /assets"
              payload: { name: "No Site Asset", criticality: "LOW" }
              as: MaintenanceManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "response status 400"

      - name: create_asset_defaults_criticality_medium_meter_unit_hours
        claim_type: Defaults
        grounds: [entities.Asset.fields.criticality, entities.Asset.fields.meter_unit, entities.Asset.fields.status]
        distinguishing_aspect: "Omitting criticality and meter_unit on POST /assets applies defaults MEDIUM and HOURS; status defaults OPERATIONAL; meter_reading 0."
        test_recipe:
          setup: ["one site"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site D", maintenance_budget_cents: 1000000 }
              as: MaintenanceManager
              captures: { sid: $.data.id }
          trigger:
            - call: "POST /assets"
              payload: { site_id: "${sid}", name: "Default Asset" }
              as: MaintenanceManager
              captures: { crit: $.data.criticality, mu: $.data.meter_unit, st: $.data.status, mr: $.data.meter_reading }
          assert:
            - "Asset.criticality == MEDIUM"
            - "Asset.meter_unit == HOURS"
            - "Asset.status == OPERATIONAL"
            - "Asset.meter_reading == 0"

      - name: get_work_order_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [endpoints, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /work-orders/{id} with a syntactically-valid but non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /work-orders/00000000-0000-4000-8000-000000000000"
              as: Planner
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "response status 404"

      - name: work_order_priority_score_is_computed_input_ignored
        claim_type: Computed Fields
        grounds: [entities.WorkOrder.fields.priority_score, calculations.calc_priority_score]
        distinguishing_aspect: "priority_score is server-computed (calc_priority_score); a CORRECTIVE LOW/ROUTINE order gets 1*1+10=11; clients cannot override it (no priority_score in input)."
        test_recipe:
          setup: ["one site + one LOW asset"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site PS", maintenance_budget_cents: 1000000 }
              as: MaintenanceManager
              captures: { sid: $.data.id }
            - call: "POST /assets"
              payload: { site_id: "${sid}", name: "Low Asset", criticality: "LOW", acquisition_cost_cents: 10000 }
              as: MaintenanceManager
              captures: { aid: $.data.id }
          trigger:
            - call: "POST /work-orders"
              payload: { asset_id: "${aid}", wo_type: "CORRECTIVE", severity: "ROUTINE", estimated_labor_hours: 1 }
              as: Planner
              captures: { ps: $.data.priority_score }
          assert:
            - "WorkOrder.priority_score == 11"

      - name: meter_reading_id_created_at_system_generated
        claim_type: System Fields
        grounds: [entities.MeterReading, endpoints]
        distinguishing_aspect: "MeterReading is common_fields:false; create returns server-minted id and created_at; no version field on the entity."
        test_recipe:
          setup: ["site + asset"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site MR", maintenance_budget_cents: 1000000 }
              as: MaintenanceManager
              captures: { sid: $.data.id }
            - call: "POST /assets"
              payload: { site_id: "${sid}", name: "Meter Asset", acquisition_cost_cents: 10000 }
              as: MaintenanceManager
              captures: { aid: $.data.id }
          trigger:
            - call: "POST /assets/${aid}/meter-readings"
              payload: { value: 50, reading_at: "2026-01-01T00:00:00Z" }
              as: Technician
              captures: { rid: $.data.id, rc: $.data.created_at }
          assert:
            - "MeterReading.id is a server-minted UUID"
            - "MeterReading.created_at present (ISO 8601 UTC)"

      - name: create_asset_invalid_criticality_enum_rejected
        claim_type: Type Constraints
        grounds: [entities.Asset.fields.criticality, "validations[priority=5]"]
        distinguishing_aspect: "POST /assets with criticality not in {LOW,MEDIUM,HIGH,CRITICAL} is rejected ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["one site"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site EN", maintenance_budget_cents: 1000000 }
              as: MaintenanceManager
              captures: { sid: $.data.id }
          trigger:
            - call: "POST /assets"
              payload: { site_id: "${sid}", name: "Bad Enum", criticality: "URGENT" }
              as: MaintenanceManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"

      - name: create_asset_bad_parent_reference_returns_reference_not_found
        claim_type: Parent Relationships
        grounds: [entities.Asset.fields.parent_asset_id, "validations[priority=4]", "errors[ERR_REFERENCE_NOT_FOUND]"]
        distinguishing_aspect: "Self-referential FK: POST /assets with a non-existent parent_asset_id returns ERR_REFERENCE_NOT_FOUND (404)."
        test_recipe:
          setup: ["one site"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site PR", maintenance_budget_cents: 1000000 }
              as: MaintenanceManager
              captures: { sid: $.data.id }
          trigger:
            - call: "POST /assets"
              payload: { site_id: "${sid}", name: "Orphan", parent_asset_id: "11111111-1111-4111-8111-111111111111", acquisition_cost_cents: 1 }
              as: MaintenanceManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_REFERENCE_NOT_FOUND"

      - name: list_assets_filtered_by_parent_self_referential_topology
        claim_type: Listing
        grounds: [entities.Asset.fields.parent_asset_id, endpoints]
        distinguishing_aspect: "graph/self-referential topology: GET /assets?parent_asset_id={id} returns only children of that parent (reverse-reachability for Asset.parent_asset_id)."
        test_recipe:
          setup: ["a parent asset with one child asset"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site Tree", maintenance_budget_cents: 1000000 }
              as: MaintenanceManager
              captures: { sid: $.data.id }
            - call: "POST /assets"
              payload: { site_id: "${sid}", name: "Parent", acquisition_cost_cents: 100 }
              as: MaintenanceManager
              captures: { pid: $.data.id }
            - call: "POST /assets"
              payload: { site_id: "${sid}", name: "Child", parent_asset_id: "${pid}", acquisition_cost_cents: 100 }
              as: MaintenanceManager
              captures: { cid: $.data.id }
          trigger:
            - call: "GET /assets?parent_asset_id=${pid}"
              as: Planner
              captures: { first_id: "$.data[0].id" }
          assert:
            - "list contains exactly the child asset ${cid}"
            - "total_count == 1"

  # =========================================================================
  # State Machines — invalid transitions, terminal lockdown, idempotency
  # =========================================================================
  - section: state_machines
    instances:
      - name: start_work_order_from_draft_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.WorkOrder.ASSIGNED_to_IN_PROGRESS, "validations[priority=6]"]
        distinguishing_aspect: "start is defined only from ASSIGNED; calling start on a DRAFT work order returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["a DRAFT corrective work order"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site IS", maintenance_budget_cents: 1000000 }
              as: MaintenanceManager
              captures: { sid: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Ti", skill_level: "SENIOR", weekly_capacity_hours: 40 }
              as: MaintenanceManager
              captures: { tid: $.data.id }
            - call: "POST /assets"
              payload: { site_id: "${sid}", name: "Asset IS", acquisition_cost_cents: 100 }
              as: MaintenanceManager
              captures: { aid: $.data.id }
            - call: "POST /work-orders"
              payload: { asset_id: "${aid}", wo_type: "CORRECTIVE", severity: "MAJOR", estimated_labor_hours: 2 }
              as: Planner
              captures: { wid: $.data.id }
          trigger:
            - call: "POST /work-orders/${wid}/start"
              as: Technician
              as_user_id: "${tid}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "WorkOrder.${wid}.execution_status == DRAFT"

      - name: cancel_closed_work_order_terminal_lockdown
        claim_type: terminal_no_transition
        grounds: [state_machines.WorkOrder.IN_PROGRESS_to_CLOSED, "validations[priority=6]"]
        distinguishing_aspect: "CLOSED is terminal for execution_status; cancel on a CLOSED work order is rejected ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["a CLOSED work order"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MaintenanceManager
            - call: "POST /sites"
              payload: { name: "Site TL", maintenance_budget_cents: 100000000 }
              as: MaintenanceManager
              captures: { sid: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Ttl", skill_level: "SENIOR", weekly_capacity_hours: 40 }
              as: MaintenanceManager
              captures: { tid: $.data.id }
            - call: "POST /assets"
              payload: { site_id: "${sid}", name: "Asset TL", acquisition_cost_cents: 100 }
              as: MaintenanceManager
              captures: { aid: $.data.id }
            - call: "POST /work-orders"
              payload: { asset_id: "${aid}", wo_type: "CORRECTIVE", severity: "MAJOR", estimated_labor_hours: 2 }
              as: Planner
              captures: { wid: $.data.id }
            - call: "POST /work-orders/${wid}/release-to-queue"
              as: Planner
            - call: "POST /work-orders/${wid}/assign"
              payload: { technician_id: "${tid}" }
              as: Planner
            - call: "POST /work-orders/${wid}/start"
              as: Technician
              as_user_id: "${tid}"
            - call: "POST /work-orders/${wid}/close"
              payload: { actual_cost_cents: 1000 }
              as: Technician
              as_user_id: "${tid}"
          trigger:
            - call: "POST /work-orders/${wid}/cancel"
              as: Planner
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "WorkOrder.${wid}.execution_status == CLOSED"

      - name: resolve_already_resolved_downtime_idempotency_rejected
        claim_type: idempotency_violation
        grounds: [state_machines.DowntimeEvent.OPEN_to_RESOLVED, "validations[priority=6]"]
        distinguishing_aspect: "resolve twice: the second resolve on an already-RESOLVED downtime returns ERR_INVALID_STATE (409); duration_hours is not recomputed."
        test_recipe:
          setup: ["a RESOLVED downtime event"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: MaintenanceManager
            - call: "POST /sites"
              payload: { name: "Site ID", maintenance_budget_cents: 1000000 }
              as: MaintenanceManager
              captures: { sid: $.data.id }
            - call: "POST /assets"
              payload: { site_id: "${sid}", name: "Asset ID", acquisition_cost_cents: 100 }
              as: MaintenanceManager
              captures: { aid: $.data.id }
            - call: "POST /assets/${aid}/downtime-events"
              payload: { reason_code: "OPERATOR_ERROR", started_at: "2026-05-01T00:00:00Z" }
              as: Technician
              captures: { did: $.data.id }
            - call: "POST /downtime-events/${did}/resolve"
              payload: { ended_at: "2026-05-01T02:00:00Z" }
              as: Technician
          trigger:
            - call: "POST /downtime-events/${did}/resolve"
              payload: { ended_at: "2026-05-01T03:00:00Z" }
              as: Technician
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "DowntimeEvent.${did}.duration_hours == 2 (unchanged from first resolve)"

      - name: new_work_order_initial_state_draft_none
        claim_type: initial_state
        grounds: [state_machines.WorkOrder.initial_state, entities.WorkOrder.fields.parts_status]
        distinguishing_aspect: "A freshly created corrective work order starts execution_status DRAFT and parts_status NONE (both parallel dimensions at their initial states)."
        test_recipe:
          setup: ["site + asset"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site Init", maintenance_budget_cents: 1000000 }
              as: MaintenanceManager
              captures: { sid: $.data.id }
            - call: "POST /assets"
              payload: { site_id: "${sid}", name: "Asset Init", acquisition_cost_cents: 100 }
              as: MaintenanceManager
              captures: { aid: $.data.id }
          trigger:
            - call: "POST /work-orders"
              payload: { asset_id: "${aid}", wo_type: "CORRECTIVE", severity: "ROUTINE", estimated_labor_hours: 1 }
              as: Planner
              captures: { es: $.data.execution_status, pps: $.data.parts_status }
          assert:
            - "WorkOrder.execution_status == DRAFT"
            - "WorkOrder.parts_status == NONE"

      - name: parallel_dimensions_parts_committed_while_execution_in_progress
        claim_type: parallel_dimensions_independent
        grounds: [state_machines.WorkOrder.RESERVED_to_COMMITTED, entities.WorkOrder.fields.execution_status, entities.WorkOrder.fields.parts_status]
        distinguishing_aspect: "commit-parts advances parts_status RESERVED->COMMITTED independently while execution_status stays IN_PROGRESS — the two dimensions evolve separately on the same row."
        test_recipe:
          setup: ["IN_PROGRESS work order with one RESERVED reservation"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site Par", maintenance_budget_cents: 100000000 }
              as: MaintenanceManager
              captures: { sid: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tpar", skill_level: "SENIOR", weekly_capacity_hours: 40 }
              as: MaintenanceManager
              captures: { tid: $.data.id }
            - call: "POST /spare-parts"
              payload: { sku: "GASK-7", name: "Gasket", on_hand_qty: 10, unit_cost_cents: 800 }
              as: InventoryClerk
              captures: { pid: $.data.id, pv: $.data.version }
            - call: "POST /assets"
              payload: { site_id: "${sid}", name: "Asset Par", acquisition_cost_cents: 100 }
              as: MaintenanceManager
              captures: { aid: $.data.id }
            - call: "POST /work-orders"
              payload: { asset_id: "${aid}", wo_type: "CORRECTIVE", severity: "MAJOR", estimated_labor_hours: 2 }
              as: Planner
              captures: { wid: $.data.id }
            - call: "POST /work-orders/${wid}/release-to-queue"
              as: Planner
            - call: "POST /work-orders/${wid}/assign"
              payload: { technician_id: "${tid}" }
              as: Planner
            - call: "POST /work-orders/${wid}/reservations"
              payload: { spare_part_id: "${pid}", qty: 2, expected_spare_part_version: "${pv}" }
              as: InventoryClerk
            - call: "POST /work-orders/${wid}/start"
              as: Technician
              as_user_id: "${tid}"
          trigger:
            - call: "POST /work-orders/${wid}/commit-parts"
              as: InventoryClerk
              captures: { es: $.data.execution_status, pps: $.data.parts_status }
          assert:
            - "WorkOrder.${wid}.parts_status == COMMITTED"
            - "WorkOrder.${wid}.execution_status == IN_PROGRESS (unchanged by the parts dimension)"

      - name: commit_parts_with_no_reserved_reservation_invalid_state
        claim_type: precondition_enforcement
        grounds: [state_machines.WorkOrder.RESERVED_to_COMMITTED]
        distinguishing_aspect: "commit-parts requires at least one RESERVED reservation; on an IN_PROGRESS work order with parts_status NONE it is rejected ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["IN_PROGRESS work order with no reservations"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site NC", maintenance_budget_cents: 100000000 }
              as: MaintenanceManager
              captures: { sid: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tnc", skill_level: "SENIOR", weekly_capacity_hours: 40 }
              as: MaintenanceManager
              captures: { tid: $.data.id }
            - call: "POST /assets"
              payload: { site_id: "${sid}", name: "Asset NC", acquisition_cost_cents: 100 }
              as: MaintenanceManager
              captures: { aid: $.data.id }
            - call: "POST /work-orders"
              payload: { asset_id: "${aid}", wo_type: "CORRECTIVE", severity: "MAJOR", estimated_labor_hours: 2 }
              as: Planner
              captures: { wid: $.data.id }
            - call: "POST /work-orders/${wid}/release-to-queue"
              as: Planner
            - call: "POST /work-orders/${wid}/assign"
              payload: { technician_id: "${tid}" }
              as: Planner
            - call: "POST /work-orders/${wid}/start"
              as: Technician
              as_user_id: "${tid}"
          trigger:
            - call: "POST /work-orders/${wid}/commit-parts"
              as: InventoryClerk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "WorkOrder.${wid}.parts_status == NONE"

      - name: retire_asset_deactivates_pm_schedules_cascade
        claim_type: side_effect_execution
        grounds: [state_machines.Asset.OPERATIONAL_to_RETIRED, entities.PMSchedule.fields.active]
        distinguishing_aspect: "Cascade-down: retiring an OPERATIONAL asset (OCC-valid) sets every PMSchedule on it active=false and status RETIRED."
        test_recipe:
          setup: ["an OPERATIONAL asset with one active PM schedule, no active work orders"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site Ret", maintenance_budget_cents: 1000000 }
              as: MaintenanceManager
              captures: { sid: $.data.id }
            - call: "POST /assets"
              payload: { site_id: "${sid}", name: "Asset Ret", acquisition_cost_cents: 100 }
              as: MaintenanceManager
              captures: { aid: $.data.id, av: $.data.version }
            - call: "POST /assets/${aid}/pm-schedules"
              payload: { trigger_type: "CALENDAR", calendar_interval_days: 90, estimated_labor_hours: 2, severity: "ROUTINE" }
              as: Planner
              captures: { schid: $.data.id }
          trigger:
            - call: "POST /assets/${aid}/retire"
              payload: { expected_asset_version: "${av}" }
              as: MaintenanceManager
              captures: { st: $.data.status }
            - call: "GET /pm-schedules/${schid}"
              as: Planner
              captures: { sch_active: $.data.active }
          assert:
            - "Asset.${aid}.status == RETIRED"
            - "PMSchedule.${schid}.active == false"

  # =========================================================================
  # Calculations — input filtering, MTBF, MTTR, schedule gate
  # =========================================================================
  - section: calculations
    instances:
      - name: mtbf_excludes_non_failure_reason_codes
        claim_type: input_set_filtering
        grounds: [calculations.calc_mtbf, entities.Asset.fields.mtbf_hours]
        distinguishing_aspect: "calc_mtbf includes only MECHANICAL_FAILURE/ELECTRICAL_FAILURE rows; with failures at t=0h and t=100h plus an interleaved OPERATOR_ERROR at t=50h, mtbf is the single 100h gap (operator-error excluded)."
        test_recipe:
          setup: ["asset with FAILURE downtimes started at +0h and +100h and an OPERATOR_ERROR at +50h"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: MaintenanceManager
            - call: "POST /sites"
              payload: { name: "Site MB", maintenance_budget_cents: 1000000 }
              as: MaintenanceManager
              captures: { sid: $.data.id }
            - call: "POST /assets"
              payload: { site_id: "${sid}", name: "Asset MB", acquisition_cost_cents: 100 }
              as: MaintenanceManager
              captures: { aid: $.data.id }
            - call: "POST /assets/${aid}/downtime-events"
              payload: { reason_code: "MECHANICAL_FAILURE", started_at: "2026-05-01T00:00:00Z" }
              as: Technician
              captures: { d1: $.data.id }
            - call: "POST /downtime-events/${d1}/resolve"
              payload: { ended_at: "2026-05-01T01:00:00Z" }
              as: Technician
            - call: "POST /assets/${aid}/downtime-events"
              payload: { reason_code: "OPERATOR_ERROR", started_at: "2026-05-01T02:00:00Z" }
              as: Technician
              captures: { d2: $.data.id }
            - call: "POST /downtime-events/${d2}/resolve"
              payload: { ended_at: "2026-05-01T02:30:00Z" }
              as: Technician
            - call: "POST /assets/${aid}/downtime-events"
              payload: { reason_code: "ELECTRICAL_FAILURE", started_at: "2026-05-01T04:00:00Z" }
              as: Technician
              captures: { d3: $.data.id }
          trigger:
            - call: "GET /assets/${aid}"
              as: MaintenanceManager
              captures: { mtbf: $.data.mtbf_hours }
          assert:
            - "Asset.${aid}.mtbf_hours == 4 (single failure-to-failure start gap of 4h between +0h and +4h; the +2h operator error is excluded)"

      - name: mtbf_single_failure_returns_zero
        claim_type: correct_result
        grounds: [calculations.calc_mtbf]
        distinguishing_aspect: "calc_mtbf returns 0 when fewer than 2 FAILURE-class downtimes exist (no consecutive gap to average)."
        test_recipe:
          setup: ["asset with exactly one FAILURE downtime"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: MaintenanceManager
            - call: "POST /sites"
              payload: { name: "Site SF", maintenance_budget_cents: 1000000 }
              as: MaintenanceManager
              captures: { sid: $.data.id }
            - call: "POST /assets"
              payload: { site_id: "${sid}", name: "Asset SF", acquisition_cost_cents: 100 }
              as: MaintenanceManager
              captures: { aid: $.data.id }
            - call: "POST /assets/${aid}/downtime-events"
              payload: { reason_code: "MECHANICAL_FAILURE", started_at: "2026-05-01T00:00:00Z" }
              as: Technician
              captures: { d1: $.data.id }
          trigger:
            - call: "GET /assets/${aid}"
              as: MaintenanceManager
              captures: { mtbf: $.data.mtbf_hours }
          assert:
            - "Asset.${aid}.mtbf_hours == 0"

      - name: mttr_averages_only_resolved_failure_durations
        claim_type: input_set_filtering
        grounds: [calculations.calc_mttr, entities.DowntimeEvent.fields.duration_hours]
        distinguishing_aspect: "calc_mttr averages duration_hours over RESOLVED FAILURE downtimes only; two resolved failures of 4h and 6h give mttr 5h."
        test_recipe:
          setup: ["asset with two RESOLVED failure downtimes of 4h and 6h"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: MaintenanceManager
            - call: "POST /sites"
              payload: { name: "Site MT", maintenance_budget_cents: 1000000 }
              as: MaintenanceManager
              captures: { sid: $.data.id }
            - call: "POST /assets"
              payload: { site_id: "${sid}", name: "Asset MT", acquisition_cost_cents: 100 }
              as: MaintenanceManager
              captures: { aid: $.data.id }
            - call: "POST /assets/${aid}/downtime-events"
              payload: { reason_code: "MECHANICAL_FAILURE", started_at: "2026-05-01T00:00:00Z" }
              as: Technician
              captures: { d1: $.data.id }
            - call: "POST /downtime-events/${d1}/resolve"
              payload: { ended_at: "2026-05-01T04:00:00Z" }
              as: Technician
            - call: "POST /assets/${aid}/downtime-events"
              payload: { reason_code: "ELECTRICAL_FAILURE", started_at: "2026-05-01T10:00:00Z" }
              as: Technician
              captures: { d2: $.data.id }
            - call: "POST /downtime-events/${d2}/resolve"
              payload: { ended_at: "2026-05-01T16:00:00Z" }
              as: Technician
          trigger:
            - call: "GET /assets/${aid}"
              as: MaintenanceManager
              captures: { mttr: $.data.mttr_hours }
          assert:
            - "Asset.${aid}.mttr_hours == 5"

      - name: calendar_pm_generate_due_before_due_returns_not_due
        claim_type: boundary_edge
        grounds: [calculations.calc_pm_next_due, endpoints, "errors[ERR_PM_NOT_DUE]"]
        distinguishing_aspect: "CALENDAR PM with interval 30d anchored at 2026-01-01: generate-due at clock 2026-01-15 (before next_due_date 2026-01-31) returns ERR_PM_NOT_DUE (409); clock < next_due is NOT due."
        test_recipe:
          setup: ["calendar PM schedule anchored 2026-01-01, interval 30d; clock at 2026-01-15"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: MaintenanceManager
            - call: "POST /sites"
              payload: { name: "Site CP", maintenance_budget_cents: 1000000 }
              as: MaintenanceManager
              captures: { sid: $.data.id }
            - call: "POST /assets"
              payload: { site_id: "${sid}", name: "Asset CP", acquisition_cost_cents: 100 }
              as: MaintenanceManager
              captures: { aid: $.data.id }
            - call: "POST /assets/${aid}/pm-schedules"
              payload: { trigger_type: "CALENDAR", calendar_interval_days: 30, estimated_labor_hours: 2, severity: "ROUTINE" }
              as: Planner
              captures: { schid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: MaintenanceManager
          trigger:
            - call: "POST /pm-schedules/${schid}/generate-due"
              as: Planner
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PM_NOT_DUE"

      - name: calendar_pm_generate_due_at_threshold_creates_work_order
        claim_type: correct_result
        grounds: [calculations.calc_pm_next_due, endpoints]
        distinguishing_aspect: "CALENDAR PM becomes due at clock >= next_due_date; at exactly 2026-01-31 generate-due creates a PREVENTIVE work order (inclusive >= boundary on the date axis)."
        test_recipe:
          setup: ["calendar PM schedule anchored 2026-01-01, interval 30d; clock advanced to 2026-01-31"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: MaintenanceManager
            - call: "POST /sites"
              payload: { name: "Site CD", maintenance_budget_cents: 1000000 }
              as: MaintenanceManager
              captures: { sid: $.data.id }
            - call: "POST /assets"
              payload: { site_id: "${sid}", name: "Asset CD", criticality: "MEDIUM", acquisition_cost_cents: 100 }
              as: MaintenanceManager
              captures: { aid: $.data.id }
            - call: "POST /assets/${aid}/pm-schedules"
              payload: { trigger_type: "CALENDAR", calendar_interval_days: 30, estimated_labor_hours: 2, severity: "ROUTINE" }
              as: Planner
              captures: { schid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-31T00:00:00Z" }
              as: MaintenanceManager
          trigger:
            - call: "POST /pm-schedules/${schid}/generate-due"
              as: Planner
              captures: { wid: $.data.id, wt: $.data.wo_type, ps: $.data.priority_score }
          assert:
            - "response status 201"
            - "WorkOrder.wo_type == PREVENTIVE"
            - "WorkOrder.priority_score == 2 (MEDIUM crit 2 * ROUTINE sev 1 * overrun 1.0, no corrective bump)"

  # =========================================================================
  # Validations — each remaining error_id triggered at least once
  # =========================================================================
  - section: validations
    instances:
      - name: pm_schedule_meter_without_interval_config_invalid
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_SCHEDULE_CONFIG_INVALID]"]
        distinguishing_aspect: "trigger_type METER with calendar_interval_days set (and meter_interval missing) violates the field-combo rule -> ERR_SCHEDULE_CONFIG_INVALID (422)."
        test_recipe:
          setup: ["site + asset"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site SC", maintenance_budget_cents: 1000000 }
              as: MaintenanceManager
              captures: { sid: $.data.id }
            - call: "POST /assets"
              payload: { site_id: "${sid}", name: "Asset SC", acquisition_cost_cents: 100 }
              as: MaintenanceManager
              captures: { aid: $.data.id }
          trigger:
            - call: "POST /assets/${aid}/pm-schedules"
              payload: { trigger_type: "METER", calendar_interval_days: 30, estimated_labor_hours: 2 }
              as: Planner
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SCHEDULE_CONFIG_INVALID"

      - name: meter_reading_non_monotonic_value_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_METER_NOT_MONOTONIC]"]
        distinguishing_aspect: "a meter reading whose value (40) is below the asset's current meter_reading (100) is rejected ERR_METER_NOT_MONOTONIC (422)."
        test_recipe:
          setup: ["asset with current meter_reading 100"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: MaintenanceManager
            - call: "POST /sites"
              payload: { name: "Site MM", maintenance_budget_cents: 1000000 }
              as: MaintenanceManager
              captures: { sid: $.data.id }
            - call: "POST /assets"
              payload: { site_id: "${sid}", name: "Asset MM", acquisition_cost_cents: 100 }
              as: MaintenanceManager
              captures: { aid: $.data.id }
            - call: "POST /assets/${aid}/meter-readings"
              payload: { value: 100, reading_at: "2026-01-01T01:00:00Z" }
              as: Technician
          trigger:
            - call: "POST /assets/${aid}/meter-readings"
              payload: { value: 40, reading_at: "2026-01-01T02:00:00Z" }
              as: Technician
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_METER_NOT_MONOTONIC"

      - name: downtime_resolve_ended_before_started_invalid_interval
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_DOWNTIME_INTERVAL_INVALID]"]
        distinguishing_aspect: "resolve with ended_at <= started_at is rejected ERR_DOWNTIME_INTERVAL_INVALID (422)."
        test_recipe:
          setup: ["asset with one OPEN downtime started at +1h"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: MaintenanceManager
            - call: "POST /sites"
              payload: { name: "Site DI", maintenance_budget_cents: 1000000 }
              as: MaintenanceManager
              captures: { sid: $.data.id }
            - call: "POST /assets"
              payload: { site_id: "${sid}", name: "Asset DI", acquisition_cost_cents: 100 }
              as: MaintenanceManager
              captures: { aid: $.data.id }
            - call: "POST /assets/${aid}/downtime-events"
              payload: { reason_code: "MECHANICAL_FAILURE", started_at: "2026-05-01T01:00:00Z" }
              as: Technician
              captures: { did: $.data.id }
          trigger:
            - call: "POST /downtime-events/${did}/resolve"
              payload: { ended_at: "2026-05-01T00:30:00Z" }
              as: Technician
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DOWNTIME_INTERVAL_INVALID"

      - name: reservation_insufficient_stock_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=13]", "errors[ERR_INSUFFICIENT_STOCK]"]
        distinguishing_aspect: "reserving qty 5 against a part with only 4 available units is rejected ERR_INSUFFICIENT_STOCK (422); reserved_qty unchanged."
        test_recipe:
          setup: ["SparePart on_hand 4 reserved 0; UNASSIGNED work order"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site ST", maintenance_budget_cents: 1000000 }
              as: MaintenanceManager
              captures: { sid: $.data.id }
            - call: "POST /spare-parts"
              payload: { sku: "BOLT-3", name: "Bolt", on_hand_qty: 4, unit_cost_cents: 100 }
              as: InventoryClerk
              captures: { pid: $.data.id, pv: $.data.version }
            - call: "POST /assets"
              payload: { site_id: "${sid}", name: "Asset ST", acquisition_cost_cents: 100 }
              as: MaintenanceManager
              captures: { aid: $.data.id }
            - call: "POST /work-orders"
              payload: { asset_id: "${aid}", wo_type: "CORRECTIVE", severity: "ROUTINE", estimated_labor_hours: 1 }
              as: Planner
              captures: { wid: $.data.id }
            - call: "POST /work-orders/${wid}/release-to-queue"
              as: Planner
          trigger:
            - call: "POST /work-orders/${wid}/reservations"
              payload: { spare_part_id: "${pid}", qty: 5, expected_spare_part_version: "${pv}" }
              as: InventoryClerk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INSUFFICIENT_STOCK"
            - "SparePart.${pid}.reserved_qty == 0"

      - name: assign_exceeds_backlog_capacity_rejected
        claim_type: aggregate_validation
        grounds: ["validations[priority=14]", "errors[ERR_BACKLOG_EXCEEDED]", entities.Technician.fields.backlog_hours]
        distinguishing_aspect: "assigning a 5h work order to a technician already at 8h backlog with weekly_capacity_hours 10 (5+8>10) is rejected ERR_BACKLOG_EXCEEDED (422)."
        test_recipe:
          setup: ["technician capacity 10h already carrying an 8h assigned work order; a second 5h UNASSIGNED work order"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site BK", maintenance_budget_cents: 1000000 }
              as: MaintenanceManager
              captures: { sid: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tbk", skill_level: "SENIOR", weekly_capacity_hours: 10 }
              as: MaintenanceManager
              captures: { tid: $.data.id }
            - call: "POST /assets"
              payload: { site_id: "${sid}", name: "Asset BK", acquisition_cost_cents: 100 }
              as: MaintenanceManager
              captures: { aid: $.data.id }
            - call: "POST /work-orders"
              payload: { asset_id: "${aid}", wo_type: "CORRECTIVE", severity: "MAJOR", estimated_labor_hours: 8 }
              as: Planner
              captures: { w1: $.data.id }
            - call: "POST /work-orders/${w1}/release-to-queue"
              as: Planner
            - call: "POST /work-orders/${w1}/assign"
              payload: { technician_id: "${tid}" }
              as: Planner
            - call: "POST /work-orders"
              payload: { asset_id: "${aid}", wo_type: "CORRECTIVE", severity: "MAJOR", estimated_labor_hours: 5 }
              as: Planner
              captures: { w2: $.data.id }
            - call: "POST /work-orders/${w2}/release-to-queue"
              as: Planner
          trigger:
            - call: "POST /work-orders/${w2}/assign"
              payload: { technician_id: "${tid}" }
              as: Planner
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_BACKLOG_EXCEEDED"
            - "WorkOrder.${w2}.execution_status == UNASSIGNED"

      - name: warranty_approve_after_coverage_expired_rejected
        claim_type: temporal_validation
        grounds: ["validations[priority=15]", "errors[ERR_WARRANTY_EXPIRED]"]
        distinguishing_aspect: "work order closed_at 2026-06-01 but asset.warranty_expires_at 2026-05-01: approve is rejected ERR_WARRANTY_EXPIRED (422) since closed_at is not before coverage end."
        test_recipe:
          setup: ["asset warranty_expires_at 2026-05-01; a closed work order closed at 2026-06-01; a SUBMITTED REPAIR claim"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MaintenanceManager
            - call: "POST /sites"
              payload: { name: "Site WE", maintenance_budget_cents: 100000000 }
              as: MaintenanceManager
              captures: { sid: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Twe", skill_level: "MASTER", weekly_capacity_hours: 40 }
              as: MaintenanceManager
              captures: { tid: $.data.id }
            - call: "POST /assets"
              payload: { site_id: "${sid}", name: "Asset WE", acquisition_cost_cents: 500000, warranty_expires_at: "2026-05-01T00:00:00Z" }
              as: MaintenanceManager
              captures: { aid: $.data.id }
            - call: "POST /work-orders"
              payload: { asset_id: "${aid}", wo_type: "CORRECTIVE", severity: "ROUTINE", estimated_labor_hours: 2 }
              as: Planner
              captures: { wid: $.data.id }
            - call: "POST /work-orders/${wid}/release-to-queue"
              as: Planner
            - call: "POST /work-orders/${wid}/assign"
              payload: { technician_id: "${tid}" }
              as: Planner
            - call: "POST /work-orders/${wid}/start"
              as: Technician
              as_user_id: "${tid}"
            - call: "POST /work-orders/${wid}/close"
              payload: { actual_cost_cents: 90000 }
              as: Technician
              as_user_id: "${tid}"
            - call: "POST /warranty-claims"
              payload: { asset_id: "${aid}", work_order_id: "${wid}", claim_type: "REPAIR" }
              as: WarrantyAdmin
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /warranty-claims/${cid}/approve"
              payload: { decision_reason: "late" }
              as: WarrantyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_WARRANTY_EXPIRED"
            - "WarrantyClaim.${cid}.status == SUBMITTED"

      - name: close_with_reserved_uncommitted_parts_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=16]", "errors[ERR_PARTS_NOT_COMMITTED]"]
        distinguishing_aspect: "closing an IN_PROGRESS work order that still has a RESERVED (uncommitted) reservation is rejected ERR_PARTS_NOT_COMMITTED (409)."
        test_recipe:
          setup: ["IN_PROGRESS work order with one RESERVED (never committed) reservation"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: MaintenanceManager
            - call: "POST /sites"
              payload: { name: "Site PC", maintenance_budget_cents: 100000000 }
              as: MaintenanceManager
              captures: { sid: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tpc", skill_level: "SENIOR", weekly_capacity_hours: 40 }
              as: MaintenanceManager
              captures: { tid: $.data.id }
            - call: "POST /spare-parts"
              payload: { sku: "HOSE-2", name: "Hose", on_hand_qty: 10, unit_cost_cents: 500 }
              as: InventoryClerk
              captures: { pid: $.data.id, pv: $.data.version }
            - call: "POST /assets"
              payload: { site_id: "${sid}", name: "Asset PC", acquisition_cost_cents: 100 }
              as: MaintenanceManager
              captures: { aid: $.data.id }
            - call: "POST /work-orders"
              payload: { asset_id: "${aid}", wo_type: "CORRECTIVE", severity: "MAJOR", estimated_labor_hours: 2 }
              as: Planner
              captures: { wid: $.data.id }
            - call: "POST /work-orders/${wid}/release-to-queue"
              as: Planner
            - call: "POST /work-orders/${wid}/assign"
              payload: { technician_id: "${tid}" }
              as: Planner
            - call: "POST /work-orders/${wid}/reservations"
              payload: { spare_part_id: "${pid}", qty: 2, expected_spare_part_version: "${pv}" }
              as: InventoryClerk
            - call: "POST /work-orders/${wid}/start"
              as: Technician
              as_user_id: "${tid}"
          trigger:
            - call: "POST /work-orders/${wid}/close"
              payload: { actual_cost_cents: 1000 }
              as: Technician
              as_user_id: "${tid}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PARTS_NOT_COMMITTED"
            - "WorkOrder.${wid}.execution_status == IN_PROGRESS"

      - name: duplicate_spare_part_sku_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=18]", "errors[ERR_DUPLICATE_SKU]"]
        distinguishing_aspect: "creating a second SparePart with an existing sku is rejected ERR_DUPLICATE_SKU (409)."
        test_recipe:
          setup: ["one spare part with sku PUMP-X"]
          setup_api_calls:
            - call: "POST /spare-parts"
              payload: { sku: "PUMP-X", name: "Pump Kit", on_hand_qty: 3, unit_cost_cents: 9000 }
              as: InventoryClerk
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /spare-parts"
              payload: { sku: "PUMP-X", name: "Dup", on_hand_qty: 1, unit_cost_cents: 100 }
              as: InventoryClerk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DUPLICATE_SKU"

      - name: pagination_limit_over_max_returns_validation
        claim_type: type_constraint
        grounds: ["validations[priority=5]", "errors[ERR_VALIDATION]", response_envelope]
        distinguishing_aspect: "GET /spare-parts?limit=500 exceeds pagination max 100 -> ERR_VALIDATION (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /spare-parts?limit=500"
              as: InventoryClerk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"
            - "response status 400"

  # =========================================================================
  # Endpoints — computed reads, listing envelope, reverse-reachability GETs
  # =========================================================================
  - section: endpoints
    instances:
      - name: list_spare_parts_pagination_envelope
        claim_type: listing_pagination
        grounds: [endpoints, response_envelope]
        distinguishing_aspect: "GET /spare-parts returns response_type array with meta + pagination fields total_count and has_more; default limit 10."
        test_recipe:
          setup: ["two spare parts"]
          setup_api_calls:
            - call: "POST /spare-parts"
              payload: { sku: "A-1", name: "Part A", on_hand_qty: 1, unit_cost_cents: 100 }
              as: InventoryClerk
            - call: "POST /spare-parts"
              payload: { sku: "B-1", name: "Part B", on_hand_qty: 1, unit_cost_cents: 100 }
              as: InventoryClerk
          trigger:
            - call: "GET /spare-parts"
              as: InventoryClerk
              captures: { first_id: "$.data[0].id" }
          assert:
            - "response response_type == array"
            - "total_count == 2 and has_more == false"

      - name: reservations_filtered_by_spare_part_reverse_reachability
        claim_type: reverse_reachability_get
        grounds: [entities.PartReservation.fields.spare_part_id, endpoints]
        distinguishing_aspect: "GET /reservations?spare_part_id={id} returns only reservations for that part (reverse-reachability for PartReservation.spare_part_id, which never appears in a creation response otherwise)."
        test_recipe:
          setup: ["one RESERVED reservation against a part on an UNASSIGNED work order"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site RR", maintenance_budget_cents: 1000000 }
              as: MaintenanceManager
              captures: { sid: $.data.id }
            - call: "POST /spare-parts"
              payload: { sku: "RR-1", name: "RR Part", on_hand_qty: 10, unit_cost_cents: 100 }
              as: InventoryClerk
              captures: { pid: $.data.id, pv: $.data.version }
            - call: "POST /assets"
              payload: { site_id: "${sid}", name: "Asset RR", acquisition_cost_cents: 100 }
              as: MaintenanceManager
              captures: { aid: $.data.id }
            - call: "POST /work-orders"
              payload: { asset_id: "${aid}", wo_type: "CORRECTIVE", severity: "ROUTINE", estimated_labor_hours: 1 }
              as: Planner
              captures: { wid: $.data.id }
            - call: "POST /work-orders/${wid}/release-to-queue"
              as: Planner
            - call: "POST /work-orders/${wid}/reservations"
              payload: { spare_part_id: "${pid}", qty: 2, expected_spare_part_version: "${pv}" }
              as: InventoryClerk
              captures: { rid: $.data.id }
          trigger:
            - call: "GET /reservations?spare_part_id=${pid}"
              as: InventoryClerk
              captures: { first_id: "$.data[0].id" }
          assert:
            - "list contains exactly reservation ${rid}"
            - "total_count == 1"

      - name: downtime_events_filtered_by_work_order_reverse_reachability
        claim_type: reverse_reachability_get
        grounds: [entities.DowntimeEvent.fields.work_order_id, endpoints]
        distinguishing_aspect: "GET /downtime-events?work_order_id={id} returns only downtime tied to that work order (reverse-reachability for DowntimeEvent.work_order_id)."
        test_recipe:
          setup: ["one downtime event referencing a work order"]
