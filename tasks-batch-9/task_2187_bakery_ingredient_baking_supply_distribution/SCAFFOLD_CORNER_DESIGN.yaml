      - name: corner_layer_dual_variant_delta_between_provisional_and_final_pricing
        claim_type: dual_variant_calculation
        grounds:
          - calculations.contract_line_settlement_price.variants
          - state_machines.Order.PROVISIONAL_to_FINAL
        distinguishing_aspect: "The same order row is priced by both variants: provisional_order_date reads the 2026-08-01 quote (110/lb) while final_delivery_date under DELIVERY_DATE_INDEX reads the 2026-09-05 quote published after the order was placed (140/lb), so the delta of 30 cents/lb propagates through the fuel surcharge to a 30750-cent total swing."
        test_recipe:
          setup:
