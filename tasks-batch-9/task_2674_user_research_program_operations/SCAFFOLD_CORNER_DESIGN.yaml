            - call: "POST /research-requests"
              payload: { roadmap_decision_id: "${d2_id}", question: "What share of the base plans weekly?", question_type: "MEASUREMENT", evidence_gap: "PARTIAL" }
              as: Stakeholder
              as_user_id: "u_stake_1"
              captures: { rq_meas_big: $.data.id }
          trigger:
            - call: "POST /research-requests/${rq_disc}/triage"
              payload: { outcome: "APPROVED" }
