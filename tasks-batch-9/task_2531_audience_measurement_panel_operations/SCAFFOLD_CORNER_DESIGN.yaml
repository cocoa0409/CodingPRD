              captures: { e24: "$.data.error_id" }
          assert:
            - "Trigger call 1: HTTP 200 with data.install_status == REMOVED and data.health_status still HEALTHY"
            - "Trigger call 2: data.status is still ENUM_PENDING - removing a device never rewinds the household, and QuotaCell.${c24_id}.intab_count is still 0"
            - "Trigger call 3: HTTP 409 with ${e24} == ERR_NO_INSTALLED_METER - priority 20 passes (ENUM_PENDING is enumerable) and priority 21 is the first to fire"

      - name: removed_meter_rejects_repairs_intervals_and_a_second_removal
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Meter.install_status.terminal_states
          - validations[priority 19, 29]
        distinguishing_aspect: "REMOVED is terminal on the install dimension: repairs, ingest and a repeat removal are all refused, and the refusals come from two different validation rules."
