        grounds: ["entities.School.fields.active_fair_id"]
        distinguishing_aspect: "School.active_fair_id is derived from the logical clock: null before start, set inside [start,end), null at end (exclusive)."
        test_recipe:
          setup: ["School CC3 NORMAL; fair 2026-10-05..2026-10-09"]
          setup_api_calls:
            - call: "POST /club/schools"
              payload: { name: "CC3", address: "72 CC Rd" }
              as: ClubAdmin
              captures: { cc3: $.data.id }
