scaffold_corner_design:
  - section: entities
    instances:
      - name: baker_creation_starts_pending_with_zero_gross_sales
        claim_type: creation
        grounds:
          - entities.Baker.fields.permit_status
          - entities.Baker.fields.annual_gross_sales_cents
          - endpoints[POST /bakery/bakers]
        distinguishing_aspect: "A freshly created Baker has permit_status PENDING, annual_gross_sales_cents 0, version 1, and the defaults annual_cap_cents 8500000 and permitted_radius_km 40.0."
        test_recipe:
          setup:
            - "Empty database, logical clock still at the CLOCK_DEFAULT_UTC 2026-05-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /bakery/customers"
              payload: { baker_id: "00000000-0000-4000-8000-000000000000", display_name: "Placeholder never used", email: "unused@example.com", delivery_distance_km: 1.0 }
              as: PlatformAdmin
              captures: { ignored_err: $.data.error_id }
          trigger:
            - call: "POST /bakery/bakers"
              payload: { display_name: "Hearth and Crumb", jurisdiction_code: "CA-ALAMEDA", payout_period_start: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { baker_id: $.data.id, st: $.data.permit_status, gross: $.data.annual_gross_sales_cents, cap: $.data.annual_cap_cents, radius: $.data.permitted_radius_km, v: $.data.version }
          assert:
            - "HTTP 201"
            - "${st} == PENDING"
            - "${gross} == 0"
            - "${cap} == 8500000"
            - "${radius} == 40.0"
            - "${v} == 1"
            - "Baker.${baker_id}.id is a bare UUID with no type prefix"
            - "the setup call proved ERR_RESOURCE_NOT_FOUND is returned when baker_id does not resolve, so ${ignored_err} == ERR_RESOURCE_NOT_FOUND"

      - name: baker_retrieval_and_listing_are_paginated
        claim_type: listing
        grounds:
          - endpoints[GET /bakery/bakers]
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /bakery/bakers returns response_type array with total_count 3 and has_more true when limit is 2, and GET /bakery/bakers/{baker_id} returns the same stored fields."
        test_recipe:
          setup:
            - "Three ACTIVE bakers exist in different jurisdictions."
          setup_api_calls:
            - call: "POST /bakery/bakers"
              payload: { display_name: "Hearth and Crumb", jurisdiction_code: "CA-ALAMEDA", payout_period_start: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { b1: $.data.id }
            - call: "POST /bakery/bakers"
              payload: { display_name: "Rise and Shine", jurisdiction_code: "CA-SONOMA", payout_period_start: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { b2: $.data.id }
            - call: "POST /bakery/bakers"
              payload: { display_name: "Third Loaf", jurisdiction_code: "CA-MARIN", payout_period_start: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { b3: $.data.id }
          trigger:
            - call: "GET /bakery/bakers"
              payload: { limit: 2, offset: 0 }
              as: PlatformAdmin
              captures: { first_id: "$.data[0].id" }
            - call: "GET /bakery/bakers/${b2}"
              payload: {}
              as: PlatformAdmin
              captures: { got_name: $.data.display_name }
          assert:
            - "the list response carries meta.api_request_id and meta.api_request_timestamp and response_type array"
            - "total_count == 3 and has_more == true and exactly 2 items are returned"
            - "${got_name} == Rise and Shine"
            - "GET /bakery/bakers with limit 2 and offset 2 returns 1 item and has_more == false"

      - name: offer_window_path_id_returns_window_specific_not_found
        claim_type: not_found
        grounds:
          - validations[priority=5]
          - errors[ERR_OFFER_WINDOW_NOT_FOUND]
        distinguishing_aspect: "An unresolvable {offer_window_id} in the path returns ERR_OFFER_WINDOW_NOT_FOUND at priority 5, not the generic ERR_RESOURCE_NOT_FOUND of priority 7."
        test_recipe:
          setup:
            - "An ACTIVE baker exists; no offer window with the probed id exists."
          setup_api_calls:
            - call: "POST /bakery/bakers"
              payload: { display_name: "Hearth and Crumb", jurisdiction_code: "CA-ALAMEDA", payout_period_start: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { baker_id: $.data.id }
            - call: "POST /bakery/bakers/${baker_id}/permit-status"
              payload: { to_status: "ACTIVE" }
              as: PlatformAdmin
          trigger:
            - call: "GET /bakery/offer-windows/11111111-2222-4333-8444-555555555555"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_OFFER_WINDOW_NOT_FOUND with HTTP 404"
            - "${err} != ERR_RESOURCE_NOT_FOUND"

      - name: order_create_missing_handoff_mode_returns_validation
        claim_type: required_fields
        grounds:
          - validations[priority=13]
          - errors[ERR_VALIDATION]
          - endpoints[POST /bakery/orders]
        distinguishing_aspect: "handoff_mode is a required input on POST /bakery/orders with no default, so omitting it returns ERR_VALIDATION at priority 13 with HTTP 400 and no Order is created."
        test_recipe:
          setup:
            - "An ACTIVE baker, a customer, a PUBLISHED recipe, a LISTED cookie and an OPEN window."
          setup_api_calls:
            - call: "POST /bakery/bakers"
              payload: { display_name: "Hearth and Crumb", jurisdiction_code: "CA-ALAMEDA", payout_period_start: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { baker_id: $.data.id }
            - call: "POST /bakery/bakers/${baker_id}/permit-status"
              payload: { to_status: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /bakery/customers"
              payload: { baker_id: "${baker_id}", display_name: "Ada Byron", email: "ada@example.com", delivery_distance_km: 6.0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /bakery/recipes"
              payload: { baker_id: "${baker_id}", name: "Brown Butter Cookie" }
              as: Baker
              as_user_id: "${baker_id}"
              captures: { r_cookie: $.data.id }
            - call: "POST /bakery/recipes/${r_cookie}/components"
              payload: { component_name: "flour and butter", quantity_grams: 500, declared_allergens: ["wheat", "milk"] }
              as: Baker
              as_user_id: "${baker_id}"
            - call: "POST /bakery/recipes/${r_cookie}/publish"
              payload: {}
              as: Baker
              as_user_id: "${baker_id}"
            - call: "POST /bakery/menu-items"
              payload: { baker_id: "${baker_id}", recipe_id: "${r_cookie}", name: "Brown Butter Cookie", product_class: "SHELF_STABLE", pricing_basis: "PER_DOZEN_BAKERS", unit_price_cents: 450, dozen_price_cents: 4600 }
              as: Baker
              as_user_id: "${baker_id}"
              captures: { mi_cookie: $.data.id }
            - call: "POST /bakery/menu-items/${mi_cookie}/listing-status"
              payload: { to_status: "LISTED" }
              as: Baker
              as_user_id: "${baker_id}"
            - call: "POST /bakery/offer-windows"
              payload: { baker_id: "${baker_id}", label: "Wed 6 May", opens_at: "2026-05-04T00:00:00Z", order_cutoff_at: "2026-05-06T12:00:00Z", production_date: "2026-05-07T06:00:00Z", handoff_date: "2026-05-07T15:00:00Z", handoff_window_end_at: "2026-05-07T19:00:00Z" }
              as: Baker
              as_user_id: "${baker_id}"
              captures: { w1: $.data.id }
            - call: "POST /bakery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bakery/offer-windows/${w1}/advance"
              payload: { to_status: "OPEN" }
              as: Baker
              as_user_id: "${baker_id}"
              captures: { w1_v1: $.data.version }
          trigger:
            - call: "POST /bakery/orders"
              payload: { customer_id: "${cust_id}", offer_window_id: "${w1}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_VALIDATION with HTTP 400"
            - "GET /bakery/orders with customer_id ${cust_id} returns 0 orders"

      - name: customer_defaults_applied_when_optional_fields_omitted
        claim_type: defaults
        grounds:
          - entities.Customer.fields.unattended_consent
          - entities.Customer.fields.cooler_provided
          - entities.Customer.fields.allergen_avoidances
        distinguishing_aspect: "Omitting allergen_avoidances, unattended_consent and cooler_provided yields [] , false and false respectively, and credit_balance_cents starts at 0."
        test_recipe:
          setup:
            - "An ACTIVE baker exists."
          setup_api_calls:
            - call: "POST /bakery/bakers"
              payload: { display_name: "Hearth and Crumb", jurisdiction_code: "CA-ALAMEDA", payout_period_start: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { baker_id: $.data.id }
            - call: "POST /bakery/bakers/${baker_id}/permit-status"
              payload: { to_status: "ACTIVE" }
              as: PlatformAdmin
          trigger:
            - call: "POST /bakery/customers"
              payload: { baker_id: "${baker_id}", display_name: "Minimal Customer", email: "min@example.com", delivery_distance_km: 3.5 }
              as: PlatformAdmin
              captures: { c: $.data.id, av: $.data.allergen_avoidances, uc: $.data.unattended_consent, cp: $.data.cooler_provided, cb: $.data.credit_balance_cents }
          assert:
            - "${av} == []"
            - "${uc} == false"
            - "${cp} == false"
            - "${cb} == 0"
            - "Customer.${c}.version == 1"

      - name: order_create_system_fields_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Order.fields.order_status
          - entities.Order.fields.payment_status
          - entities.Order.fields.handoff_status
        distinguishing_aspect: "order_status, payment_status, handoff_status, placed_at and version are all source system, so client-supplied values in the body are ignored and the three axes start DRAFT, UNPAID and NOT_SCHEDULED."
        test_recipe:
          setup:
            - "An ACTIVE baker, a customer, a PUBLISHED recipe, a LISTED cookie and an OPEN window."
          setup_api_calls:
            - call: "POST /bakery/bakers"
              payload: { display_name: "Hearth and Crumb", jurisdiction_code: "CA-ALAMEDA", payout_period_start: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { baker_id: $.data.id }
            - call: "POST /bakery/bakers/${baker_id}/permit-status"
              payload: { to_status: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /bakery/customers"
              payload: { baker_id: "${baker_id}", display_name: "Ada Byron", email: "ada@example.com", delivery_distance_km: 6.0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /bakery/recipes"
              payload: { baker_id: "${baker_id}", name: "Brown Butter Cookie" }
              as: Baker
              as_user_id: "${baker_id}"
              captures: { r_cookie: $.data.id }
            - call: "POST /bakery/recipes/${r_cookie}/components"
              payload: { component_name: "flour and butter", quantity_grams: 500, declared_allergens: ["wheat", "milk"] }
              as: Baker
              as_user_id: "${baker_id}"
            - call: "POST /bakery/recipes/${r_cookie}/publish"
              payload: {}
              as: Baker
              as_user_id: "${baker_id}"
            - call: "POST /bakery/menu-items"
              payload: { baker_id: "${baker_id}", recipe_id: "${r_cookie}", name: "Brown Butter Cookie", product_class: "SHELF_STABLE", pricing_basis: "PER_DOZEN_BAKERS", unit_price_cents: 450, dozen_price_cents: 4600 }
              as: Baker
              as_user_id: "${baker_id}"
              captures: { mi_cookie: $.data.id }
            - call: "POST /bakery/menu-items/${mi_cookie}/listing-status"
              payload: { to_status: "LISTED" }
              as: Baker
              as_user_id: "${baker_id}"
            - call: "POST /bakery/offer-windows"
              payload: { baker_id: "${baker_id}", label: "Wed 6 May", opens_at: "2026-05-04T00:00:00Z", order_cutoff_at: "2026-05-06T12:00:00Z", production_date: "2026-05-07T06:00:00Z", handoff_date: "2026-05-07T15:00:00Z", handoff_window_end_at: "2026-05-07T19:00:00Z" }
              as: Baker
              as_user_id: "${baker_id}"
              captures: { w1: $.data.id }
            - call: "POST /bakery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bakery/offer-windows/${w1}/advance"
              payload: { to_status: "OPEN" }
              as: Baker
              as_user_id: "${baker_id}"
              captures: { w1_v1: $.data.version }
          trigger:
            - call: "POST /bakery/orders"
              payload: { customer_id: "${cust_id}", offer_window_id: "${w1}", handoff_mode: "PICKUP_COUNTER", order_status: "FULFILLED", payment_status: "CAPTURED", version: 99 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { o: $.data.id, os: $.data.order_status, ps: $.data.payment_status, hs: $.data.handoff_status, v: $.data.version }
          assert:
            - "${os} == DRAFT"
            - "${ps} == UNPAID"
            - "${hs} == NOT_SCHEDULED"
            - "${v} == 1"
            - "Order.${o}.placed_at == null and Order.${o}.hold_expires_at == null"

      - name: line_add_invalid_enum_disposition_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=14]
          - errors[ERR_INVALID_ENUM]
          - entities.OrderLine.fields.disposition
        distinguishing_aspect: "disposition is on the exhaustive priority-14 enum routing list, so the value TOASTED returns ERR_INVALID_ENUM with HTTP 400 rather than ERR_VALIDATION."
        test_recipe:
          setup:
            - "An ACTIVE baker, a customer, a PUBLISHED recipe, a LISTED cookie, an OPEN window and a DRAFT order."
          setup_api_calls:
            - call: "POST /bakery/bakers"
              payload: { display_name: "Hearth and Crumb", jurisdiction_code: "CA-ALAMEDA", payout_period_start: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { baker_id: $.data.id }
            - call: "POST /bakery/bakers/${baker_id}/permit-status"
              payload: { to_status: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /bakery/customers"
              payload: { baker_id: "${baker_id}", display_name: "Ada Byron", email: "ada@example.com", delivery_distance_km: 6.0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /bakery/recipes"
              payload: { baker_id: "${baker_id}", name: "Brown Butter Cookie" }
              as: Baker
              as_user_id: "${baker_id}"
              captures: { r_cookie: $.data.id }
            - call: "POST /bakery/recipes/${r_cookie}/components"
              payload: { component_name: "flour and butter", quantity_grams: 500, declared_allergens: ["wheat", "milk"] }
              as: Baker
              as_user_id: "${baker_id}"
            - call: "POST /bakery/recipes/${r_cookie}/publish"
              payload: {}
              as: Baker
              as_user_id: "${baker_id}"
            - call: "POST /bakery/menu-items"
              payload: { baker_id: "${baker_id}", recipe_id: "${r_cookie}", name: "Brown Butter Cookie", product_class: "SHELF_STABLE", pricing_basis: "PER_DOZEN_BAKERS", unit_price_cents: 450, dozen_price_cents: 4600 }
              as: Baker
              as_user_id: "${baker_id}"
              captures: { mi_cookie: $.data.id }
            - call: "POST /bakery/menu-items/${mi_cookie}/listing-status"
              payload: { to_status: "LISTED" }
              as: Baker
              as_user_id: "${baker_id}"
            - call: "POST /bakery/offer-windows"
              payload: { baker_id: "${baker_id}", label: "Wed 6 May", opens_at: "2026-05-04T00:00:00Z", order_cutoff_at: "2026-05-06T12:00:00Z", production_date: "2026-05-07T06:00:00Z", handoff_date: "2026-05-07T15:00:00Z", handoff_window_end_at: "2026-05-07T19:00:00Z" }
              as: Baker
              as_user_id: "${baker_id}"
              captures: { w1: $.data.id }
            - call: "POST /bakery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bakery/offer-windows/${w1}/advance"
              payload: { to_status: "OPEN" }
              as: Baker
              as_user_id: "${baker_id}"
              captures: { w1_v1: $.data.version }
            - call: "POST /bakery/orders"
              payload: { customer_id: "${cust_id}", offer_window_id: "${w1}", handoff_mode: "PICKUP_COUNTER" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { o1: $.data.id }
          trigger:
            - call: "POST /bakery/orders/${o1}/lines"
              payload: { menu_item_id: "${mi_cookie}", quantity: 13, disposition: "TOASTED", expected_offer_window_version: "${w1_v1}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_ENUM with HTTP 400"
            - "${err} != ERR_VALIDATION"
            - "Order.${o1}.order_status == DRAFT and OfferWindow.${w1}.held_units == 0"

      - name: money_movement_is_append_only_and_never_mutated
        claim_type: immutability
        grounds:
          - entities.MoneyMovement.common_fields
          - endpoints[GET /bakery/money-movements]
          - calculations.refund_waterfall
        distinguishing_aspect: "MoneyMovement is declared common_fields false, so it carries only id and created_at, has no mutating endpoint, and a second refund creates a NEW movement while leaving the first movement's four legs byte-identical."
        test_recipe:
          setup:
            - "An ACTIVE baker, a customer, a LISTED cookie, an OPEN window, and a CONFIRMED order of 13 cookies with a CAPTURED payment of 4600 cents and a zero tip."
            - "One 1000-cent refund has already been recorded."
          setup_api_calls:
            - call: "POST /bakery/bakers"
              payload: { display_name: "Hearth and Crumb", jurisdiction_code: "CA-ALAMEDA", payout_period_start: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { baker_id: $.data.id }
            - call: "POST /bakery/bakers/${baker_id}/permit-status"
              payload: { to_status: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /bakery/customers"
              payload: { baker_id: "${baker_id}", display_name: "Ada Byron", email: "ada@example.com", delivery_distance_km: 6.0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /bakery/recipes"
              payload: { baker_id: "${baker_id}", name: "Brown Butter Cookie" }
              as: Baker
              as_user_id: "${baker_id}"
              captures: { r_cookie: $.data.id }
            - call: "POST /bakery/recipes/${r_cookie}/components"
              payload: { component_name: "flour and butter", quantity_grams: 500, declared_allergens: ["wheat", "milk"] }
              as: Baker
              as_user_id: "${baker_id}"
            - call: "POST /bakery/recipes/${r_cookie}/publish"
              payload: {}
              as: Baker
              as_user_id: "${baker_id}"
            - call: "POST /bakery/menu-items"
              payload: { baker_id: "${baker_id}", recipe_id: "${r_cookie}", name: "Brown Butter Cookie", product_class: "SHELF_STABLE", pricing_basis: "PER_DOZEN_BAKERS", unit_price_cents: 450, dozen_price_cents: 4600 }
              as: Baker
              as_user_id: "${baker_id}"
              captures: { mi_cookie: $.data.id }
            - call: "POST /bakery/menu-items/${mi_cookie}/listing-status"
              payload: { to_status: "LISTED" }
              as: Baker
              as_user_id: "${baker_id}"
            - call: "POST /bakery/offer-windows"
              payload: { baker_id: "${baker_id}", label: "Wed 6 May", opens_at: "2026-05-04T00:00:00Z", order_cutoff_at: "2026-05-06T12:00:00Z", production_date: "2026-05-07T06:00:00Z", handoff_date: "2026-05-07T15:00:00Z", handoff_window_end_at: "2026-05-07T19:00:00Z" }
              as: Baker
              as_user_id: "${baker_id}"
              captures: { w1: $.data.id }
            - call: "POST /bakery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bakery/offer-windows/${w1}/advance"
              payload: { to_status: "OPEN" }
              as: Baker
              as_user_id: "${baker_id}"
              captures: { w1_v1: $.data.version }
            - call: "POST /bakery/orders"
              payload: { customer_id: "${cust_id}", offer_window_id: "${w1}", handoff_mode: "PICKUP_COUNTER" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { o1: $.data.id }
            - call: "POST /bakery/orders/${o1}/lines"
              payload: { menu_item_id: "${mi_cookie}", quantity: 13, expected_offer_window_version: "${w1_v1}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_1: $.data.id }
            - call: "POST /bakery/orders/${o1}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /bakery/payments"
              payload: { order_id: "${o1}", tip_mode: "FIXED", tip_fixed_cents: 0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { pay_1: $.data.id }
            - call: "POST /bakery/payments/${pay_1}/capture"
              payload: {}
              as: Baker
              as_user_id: "${baker_id}"
            - call: "GET /bakery/orders/${o1}"
              payload: {}
              as: Baker
              as_user_id: "${baker_id}"
              captures: { o1_v1: $.data.version }
            - call: "POST /bakery/payments/${pay_1}/refunds"
              payload: { amount_cents: 1000, refund_reason: "first goodwill refund", expected_order_version: "${o1_v1}" }
              as: Baker
              as_user_id: "${baker_id}"
              captures: { mv_1: $.data.id, mv1_sub: $.data.leg_subtotal_cents }
          trigger:
            - call: "GET /bakery/orders/${o1}"
              payload: {}
              as: Baker
              as_user_id: "${baker_id}"
              captures: { o1_v2: $.data.version }
            - call: "POST /bakery/payments/${pay_1}/refunds"
              payload: { amount_cents: 600, refund_reason: "second goodwill refund", expected_order_version: "${o1_v2}" }
              as: Baker
              as_user_id: "${baker_id}"
              captures: { mv_2: $.data.id, mv2_sub: $.data.leg_subtotal_cents }
            - call: "GET /bakery/money-movements"
              payload: { order_id: "${o1}", movement_kind: "REFUND" }
              as: Baker
              as_user_id: "${baker_id}"
              captures: { first_listed: "$.data[0].id" }
