        distinguishing_aspect: "The split identity is exact in both directions: one cent short (219999) and one cent long (220001) are both 422s on the same 340000 offer, and the rule is re-checked on a re-offer inside the negotiation cycle, where the new price -- not the original one -- is the reference."
