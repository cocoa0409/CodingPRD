              captures: { appl_v: $.data.version }
            - call: "POST /public-assistance/drawdowns"
              payload: { applicant_id: "${applicant_id}", project_id: "${project_id}", requested_cents: 1000000, expected_applicant_version: "${appl_v}" }
              as: ApplicantAgent
              as_user_id: "${applicant_id}"
              captures: { dd_id: $.data.id }
            - call: "POST /public-assistance/drawdowns/${dd_id}/disburse"
              payload: { decision: "PAY" }
              as: GrantsOfficer
              as_user_id: "officer-2"
          trigger:
            - call: "POST /public-assistance/drawdowns/${dd_id}/refund"
              payload: { refund_cents: 1000000 }
              as: ApplicantAgent
              as_user_id: "${applicant_id}"
          assert:
            - "Drawdown.${dd_id}.status == REFUNDED with approved_cents == 1000000 and refunded_cents == 1000000"
            - "Applicant.${applicant_id}.total_drawn_cents == 1000000 and total_refunded_cents == 1000000"
            - "Applicant.${applicant_id}.cash_on_hand_cents == 0 (back to its pre-disbursement value)"
            - "Applicant.${applicant_id}.available_drawdown_cents == 3420000"
            - "Disaster.${disaster_id}.total_drawn_cents == 0"
            - "Applicant.${applicant_id}.total_obligated_cents == 3420000 (the obligation ledger is untouched by the cash pair)"
            - "Drawdown.${dd_id}.disbursed_by_user_id == officer-2 and Project.${project_id}.obligated_by_user_id == officer-1"
