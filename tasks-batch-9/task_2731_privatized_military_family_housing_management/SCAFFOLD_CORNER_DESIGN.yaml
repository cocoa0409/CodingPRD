              payload: {}
              as: PlatformAdmin
              captures: { dc_status: "$.data.status", dc_rounds: "$.data.round_count" }
            - call: "GET /hazard-cases/${hz1_id}"
              payload: {}
              as: PlatformAdmin
              captures: { hz_status: "$.data.status" }
