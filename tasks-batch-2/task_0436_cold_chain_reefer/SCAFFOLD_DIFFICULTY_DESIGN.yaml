              captures: { posture: $.data.load_integrity_posture }
          assert:
            - "Compartment.${comp_id}.degree_minutes_out == 300 (FINAL)"
            - "Compartment.${comp_id}.impairment == TOTAL_LOSS"
            - "Shipment.${ship_id}.load_integrity_posture == COMPROMISED"

      - name: accept_cascade_assigns_unit_and_bumps_version
        grounds:
          - state_machines.Shipment.TENDERED_to_ACCEPTED
          - state_machines.ReeferUnit.AVAILABLE_to_ASSIGNED
          - entities.ReeferUnit.fields.status
          - entities.Shipment.fields.reefer_unit_id
        distinguishing_aspect: "Depth-2 cascade from a DIFFERENT trigger (ACCEPT): accept sets Shipment.reefer_unit_id and bumps Shipment.version (link 1) -> that acceptance transitions the named ReeferUnit AVAILABLE->ASSIGNED (link 2, caused by the shipment's accept side-effect, not by a direct unit call)."
        test_recipe:
          setup:
            - "TENDERED FOOD shipment with 1 compartment; an AVAILABLE reefer unit of sufficient size."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Accept Carrier", fsma_registered: true, sanitary_training_current: true }
