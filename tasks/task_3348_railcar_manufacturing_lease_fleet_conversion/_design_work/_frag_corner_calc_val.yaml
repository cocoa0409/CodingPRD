          - entities.Lessee.fields.utilization_threshold_pct
        distinguishing_aspect: "A 5-day placement at 2001 cents per day produces a gross of 10005 and a credit of exactly 1200 (floor of 1200.6), so the accrued 8805 is an integer-cent figure produced by flooring rather than rounding the 12-percent credit."
        test_recipe:
          setup:
            - "Empty DB; logical clock pinned to 2026-09-01T00:00:00Z."
            - "Car type FLT-100 (BOXCAR, build_hours 1, regulatory_life_years 25, line_count_family FLT_LINE) with one WS-310 WHEELSET bill-of-material row at qty_per_car 1 and on_hand_qty 1000."
