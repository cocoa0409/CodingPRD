              as: PlatformAdmin
              captures: { x1: $.data.error_id }
            - call: "POST /api/carriers/${car_id}/transition"
              payload: { to_status: "TERMINATED" }
              as: ComplianceOfficer
              captures: { x2: $.data.error_id }
            - call: "POST /api/carriers/${car_id}/transition"
              payload: { to_status: "TERMINATED" }
              as: PlatformAdmin
              captures: { x3: $.data.status }
          assert:
            - "PlatformAdmin -> ACTIVE: ERR_FORBIDDEN_ROLE (403)"
            - "ComplianceOfficer -> TERMINATED: ERR_FORBIDDEN_ROLE (403)"
            - "PlatformAdmin -> TERMINATED: 200, status == TERMINATED"

  - section: cross_cutting_layers
    instances:
      - name: out_of_order_snapshot_keeps_latest_by_effective_date
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.carrier_eligibility_posture
          - entities.Carrier.fields.latest_snapshot_id
          - entities.Carrier.fields.latest_iss_score
        distinguishing_aspect: "Derived-field reconciliation under out-of-order feed: a snapshot with effective_date 2026-08-10 (iss 40) posted first stays latest even after a second snapshot with effective_date 2026-08-05 (iss 95) is posted — latest_* follow max(effective_date) with created_at tie-break, so posture stays ELIGIBLE and no cascade fires."
        test_recipe:
          setup: ["clock 2026-08-10T12:00:00Z; carrier created (v1)"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/carriers"
              payload: { dot_number: "100001", legal_name: "Acme Hauling" }
              as: PlatformAdmin
              captures: { car_id: $.data.id, car_v: $.data.version }
          trigger:
            - call: "POST /api/safety-score-snapshots"
              payload: { carrier_id: "${car_id}", iss_score: 40, safety_rating: "SATISFACTORY", source: "FMCSA_FEED", effective_date: "2026-08-10", expected_carrier_version: "${car_v}" }
              as: SafetyDataFeed
              captures: { snap1: $.data.id }
            - call: "GET /api/carriers/${car_id}"
              payload: {}
              as: SafetyDataFeed
              captures: { car_v2: $.data.version }
            - call: "POST /api/safety-score-snapshots"
              payload: { carrier_id: "${car_id}", iss_score: 95, safety_rating: "UNSATISFACTORY", source: "MANUAL_AUDIT", effective_date: "2026-08-05", expected_carrier_version: "${car_v2}" }
              as: SafetyDataFeed
              captures: { snap2: $.data.id }
            - call: "GET /api/carriers/${car_id}"
              payload: {}
              as: SafetyDataFeed
              captures: { latest_iss: $.data.latest_iss_score, latest_snap: $.data.latest_snapshot_id, posture: $.data.eligibility_status }
          assert:
            - "after out-of-order second snapshot: latest_snapshot_id == ${snap1} (effective 2026-08-10 beats 2026-08-05)"
            - "latest_iss_score == 40 and eligibility_status == ELIGIBLE — the iss-95 row did NOT flip posture to INELIGIBLE"
            - "both snapshots exist in GET /api/safety-score-snapshots?carrier_id (append-only history preserved)"

      - name: override_goes_stale_on_newer_snapshot
        claim_type: version_pinning
        grounds:
          - state_machines.EligibilityOverride.ACTIVE_to_STALE
          - entities.EligibilityOverride.fields.approved_against_snapshot_id
          - calculations.carrier_eligibility_posture
        distinguishing_aspect: "Version-pinning with teeth: an ACTIVE override pins approved_against_snapshot_id; when a NEWER snapshot becomes the carrier's latest, the override flips to STALE (terminal) and posture recomputes without it — ELIGIBLE-by-override collapses back to INELIGIBLE (iss 85)."
        test_recipe:
          setup: ["clock 2026-08-01; carrier ENROLLED with snapshot iss 90 (posture INELIGIBLE); override [2026-08-01, 2026-09-01) REQUESTED then APPROVED (immediately ACTIVE since start <= today) pinning snapshot 1"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/carriers"
              payload: { dot_number: "100001", legal_name: "Acme Hauling" }
              as: PlatformAdmin
              captures: { car_id: $.data.id, car_v: $.data.version }
            - call: "POST /api/safety-score-snapshots"
              payload: { carrier_id: "${car_id}", iss_score: 90, safety_rating: "CONDITIONAL", source: "FMCSA_FEED", effective_date: "2026-08-01", expected_carrier_version: "${car_v}" }
              as: SafetyDataFeed
              captures: { snap1: $.data.id }
            - call: "GET /api/carriers/${car_id}"
              payload: {}
              as: CarrierManager
              as_user_id: "${car_id}"
              captures: { car_v2: $.data.version }
            - call: "POST /api/eligibility-overrides"
              payload: { carrier_id: "${car_id}", reason: "score under formal appeal", start_date: "2026-08-01", end_date: "2026-09-01", expected_carrier_version: "${car_v2}" }
              as: CarrierManager
              as_user_id: "${car_id}"
              captures: { ov_id: $.data.id }
            - call: "POST /api/eligibility-overrides/${ov_id}/decide"
              payload: { outcome: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { ov_status1: $.data.status, ov_pin: $.data.approved_against_snapshot_id }
            - call: "GET /api/carriers/${car_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { posture1: $.data.eligibility_status, car_v3: $.data.version }
          trigger:
            - call: "POST /api/safety-score-snapshots"
              payload: { carrier_id: "${car_id}", iss_score: 85, safety_rating: "CONDITIONAL", source: "FMCSA_FEED", effective_date: "2026-08-01", expected_carrier_version: "${car_v3}" }
              as: SafetyDataFeed
              captures: { snap2: $.data.id }
            - call: "GET /api/eligibility-overrides"
              payload: { carrier_id: "${car_id}" }
              as: ComplianceOfficer
              captures: { ov_status2: "$.data[0].status" }
            - call: "GET /api/carriers/${car_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { posture2: $.data.eligibility_status }
          assert:
            - "after APPROVE: status == ACTIVE (start_date <= today) and approved_against_snapshot_id == ${snap1}; posture forced ELIGIBLE"
            - "second snapshot (same effective_date, later created_at => newer latest): override flips to STALE (terminal)"
            - "posture recomputes from the new snapshot: INELIGIBLE (85 >= 75) — the pinned reference no longer shields the carrier"
            - "a further decide on the STALE override would be ERR_INVALID_STATE_TRANSITION (terminal lockdown)"

      - name: invoice_due_date_boundary_past_due_sweep
        claim_type: rate_threshold_triggers
        grounds:
          - state_machines.Invoice.ISSUED_to_PAST_DUE
          - entities.Invoice.fields.due_date
          - state_machines.VehicleSubscription
        distinguishing_aspect: "Past-due sweep is strict-less-than on due_date: at clock 2026-09-15T23:59:00Z (due date itself) the invoice stays ISSUED; at 2026-09-16T00:00:00Z it flips to PAST_DUE and the subscription's payment_standing follows to PAST_DUE."
        test_recipe:
          setup: ["clock 2026-09-01; carrier with one full-August subscription; period 2026-08 closed (invoice ISSUED amount_due 1799, due_date 2026-09-15)"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/carriers"
