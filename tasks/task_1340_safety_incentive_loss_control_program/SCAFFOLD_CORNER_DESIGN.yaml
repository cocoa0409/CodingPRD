            - { call: "POST /safety/observations/${o4}/triage", payload: { action: "LINK_EXISTING", hazard_id: "${h_id}" }, as: SafetyManager, as_user_id: "${v_id}" }
            - { call: "POST /safety/observations/${o5}/triage", payload: { action: "LINK_EXISTING", hazard_id: "${h_id}" }, as: SafetyManager, as_user_id: "${v_id}" }
            - { call: "POST /safety/controls/${c_id}/implement", payload: {}, as: Supervisor, as_user_id: "${i_id}" }
            - { call: "POST /safety/controls/${c_id}/verify", payload: { outcome: "PASS" }, as: SafetyManager, as_user_id: "${v_id}" }
            - { call: "POST /safety/programs/${p_id}/close", payload: {}, as: EHSAdmin }
          trigger:
            - { call: "GET /safety/incentive-awards", payload: { program_id: "${p_id}", employee_id: "${a_id}" }, as: EHSAdmin, captures: { pts_a: "$.data[0].points_earned", tier_a: "$.data[0].tier", pay_a: "$.data[0].payout_cents" } }
            - { call: "GET /safety/incentive-awards", payload: { program_id: "${p_id}", employee_id: "${i_id}" }, as: EHSAdmin, captures: { pts_i: "$.data[0].points_earned", tier_i: "$.data[0].tier", pay_i: "$.data[0].payout_cents" } }
          assert:
            - "A: points_earned == 50 (5 x OBSERVATION_VALIDATED at 10), tier == SILVER (inclusive lower edge), payout_cents == 10000"
            - "I: points_earned == 19 (CONTROL_VERIFIED on time round(15*1.0*1.25)), tier == BRONZE, payout_cents == 2900 (19*150 = 2850c -> $28.50 -> $29.00)"

      - name: prequal_conditional_band_upper_edge_79_99
        claim_type: boundary_edge
        grounds: [calculations.prequal_score, "errors[ERR_DECISION_CONTRADICTS_SCORE]"]
        distinguishing_aspect: "audit 79.95 with emr 0.50 / trir 0.0 / full insurance gives 24+30+15.99+10 = 79.99 — one cent of score below the APPROVE band: computed_decision CONDITIONAL, and decide APPROVE is rejected as score-contradicting."
        test_recipe:
          setup: ["clock 2026-09-01; contractor with safety_audit_pct 79.95 (all other components as in the 80.00 case); manager M"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: EHSAdmin }
            - { call: "POST /safety/job-roles", payload: { title: "EHS Manager", hazard_class: "LOW" }, as: EHSAdmin, captures: { jr_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Marta M", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /safety/contractor-orgs", payload: { name: "Beta Builders", contact_email: "safety@beta.example", emr: 0.50, trir: 0.0, safety_audit_pct: 79.95, insurance_cert_expires_on: "2026-12-15" }, as: EHSAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /safety/contractor-orgs/${c_id}/submit", payload: {}, as: ContractorRep, as_user_id: "${c_id}", captures: { score: $.data.prequal_score, band: $.data.computed_decision } }
          trigger:
            - { call: "POST /safety/contractor-orgs/${c_id}/decide", payload: { decision: "APPROVE" }, as: SafetyManager, as_user_id: "${m_id}", captures: { err: $.data.error_id } }
            - { call: "POST /safety/contractor-orgs/${c_id}/decide", payload: { decision: "CONDITIONAL" }, as: SafetyManager, as_user_id: "${m_id}", captures: { st: $.data.status } }
          assert:
            - "prequal_score == 79.99 and computed_decision == CONDITIONAL (80.00 band is exclusive from below)"
            - "decide APPROVE -> ERR_DECISION_CONTRADICTS_SCORE; contractor stays UNDER_REVIEW"
            - "decide CONDITIONAL -> status CONDITIONAL"

      - name: claims_free_bonus_withheld_when_claim_exists
        claim_type: variant_selection
        grounds: [calculations.incentive_event_points, entities.IncentiveEvent.fields.source_type]
        distinguishing_aspect: "BALANCED variant with one ACCEPTED claim: the CLAIMS_FREE_BONUS is withheld (not negative) — employee keeps exactly the leading-indicator points, demonstrating the incentive never punishes reported claims beyond forfeiting the bonus."
        test_recipe:
          setup:
            - "ACTIVE BALANCED program; LOW employees A (reporter+implementer) and M (verifier/triager)"
            - "One INDEMNITY claim ACCEPTED; one hazard closed via A's control verified on time; one observation by A validated"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EHSAdmin }
            - { call: "POST /safety/programs", payload: { program_year: 2026, scoring_variant: "BALANCED", incentive_budget_cents: 500000, observation_target_rate: 5.0, exposure_hours: 100000, payroll_by_class: [{ hazard_class: "LOW", payroll_cents: 10000000 }, { hazard_class: "MODERATE", payroll_cents: 10000000 }, { hazard_class: "HIGH", payroll_cents: 10000000 }], elr_by_class: [{ hazard_class: "LOW", elr: 1.0 }, { hazard_class: "MODERATE", elr: 1.0 }, { hazard_class: "HIGH", elr: 1.0 }] }, as: EHSAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /safety/programs/${p_id}/activate", payload: {}, as: EHSAdmin }
            - { call: "POST /safety/job-roles", payload: { title: "Laborer", hazard_class: "LOW" }, as: EHSAdmin, captures: { jr_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Ann A", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Marta M", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /safety/claims", payload: { program_id: "${p_id}", occurred_on: "2026-03-01", kind: "INDEMNITY", incurred_cents: 100000 }, as: SafetyManager, as_user_id: "${m_id}", captures: { cl_id: $.data.id } }
            - { call: "POST /safety/claims/${cl_id}/accept", payload: {}, as: SafetyManager, as_user_id: "${m_id}" }
            - { call: "POST /safety/hazards", payload: { program_id: "${p_id}", location: "L1", description: "Noise", identified_by: "${a_id}" }, as: SafetyManager, as_user_id: "${m_id}", captures: { h_id: $.data.id } }
            - { call: "POST /safety/hazards/${h_id}/assess", payload: { severity: 3, probability: 2 }, as: SafetyManager, as_user_id: "${m_id}" }
            - { call: "POST /safety/hazards/${h_id}/controls", payload: { description: "Enclosure", implementer_id: "${a_id}", due_date: "2026-06-20T00:00:00Z" }, as: SafetyManager, as_user_id: "${m_id}", captures: { c_id: $.data.id } }
            - { call: "POST /safety/observations", payload: { program_id: "${p_id}", reporter_id: "${a_id}", kind: "OBSERVATION", description: "Loud bang", occurred_at: "2026-05-30T00:00:00Z" }, as: Employee, as_user_id: "${a_id}", captures: { o_id: $.data.id } }
            - { call: "POST /safety/observations/${o_id}/triage", payload: { action: "LINK_EXISTING", hazard_id: "${h_id}" }, as: SafetyManager, as_user_id: "${m_id}" }
            - { call: "POST /safety/controls/${c_id}/implement", payload: {}, as: Supervisor, as_user_id: "${a_id}" }
            - { call: "POST /safety/controls/${c_id}/verify", payload: { outcome: "PASS" }, as: SafetyManager, as_user_id: "${m_id}" }
            - { call: "POST /safety/programs/${p_id}/close", payload: {}, as: EHSAdmin }
          trigger:
            - { call: "GET /safety/incentive-events", payload: { program_id: "${p_id}", source_type: "CLAIMS_FREE_BONUS" }, as: EHSAdmin }
            - { call: "GET /safety/incentive-awards", payload: { program_id: "${p_id}", employee_id: "${a_id}" }, as: EHSAdmin, captures: { pts: "$.data[0].points_earned", pay: "$.data[0].payout_cents" } }
          assert:
            - "zero CLAIMS_FREE_BONUS events (one ACCEPTED claim exists)"
            - "A's award: points_earned == 29 (10 observation + 19 on-time control), payout_cents == 4400 (29*150 = 4350c -> $43.50 -> $44.00)"

  - section: validations
    instances:
      - name: program_create_missing_auth_returns_unauthenticated
        claim_type: violation_to_error
        grounds: [ "validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A mutating call with no X-User-Role/X-User-ID headers is rejected 401 ERR_UNAUTHENTICATED before any other check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /safety/programs"
              payload: { program_year: 2026, scoring_variant: "LEADING_ONLY", incentive_budget_cents: 500000, observation_target_rate: 5.0, exposure_hours: 100000, payroll_by_class: [{ hazard_class: "LOW", payroll_cents: 10000000 }, { hazard_class: "MODERATE", payroll_cents: 10000000 }, { hazard_class: "HIGH", payroll_cents: 10000000 }], elr_by_class: [{ hazard_class: "LOW", elr: 1.0 }, { hazard_class: "MODERATE", elr: 1.0 }, { hazard_class: "HIGH", elr: 1.0 }] }
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED and http status 401 (no role/user headers sent)"

      - name: observation_future_occurred_at_rejected
        claim_type: violation_to_error
        grounds: [ "validations[priority=13]", "errors[ERR_FUTURE_DATE_NOT_ALLOWED]"]
        distinguishing_aspect: "occurred_at after the logical now is rejected 422 ERR_FUTURE_DATE_NOT_ALLOWED."
        test_recipe:
          setup: ["clock 2026-06-01; ACTIVE program; reporter A"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EHSAdmin }
            - { call: "POST /safety/programs", payload: { program_year: 2026, scoring_variant: "LEADING_ONLY", incentive_budget_cents: 500000, observation_target_rate: 5.0, exposure_hours: 100000, payroll_by_class: [{ hazard_class: "LOW", payroll_cents: 10000000 }, { hazard_class: "MODERATE", payroll_cents: 10000000 }, { hazard_class: "HIGH", payroll_cents: 10000000 }], elr_by_class: [{ hazard_class: "LOW", elr: 1.0 }, { hazard_class: "MODERATE", elr: 1.0 }, { hazard_class: "HIGH", elr: 1.0 }] }, as: EHSAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /safety/programs/${p_id}/activate", payload: {}, as: EHSAdmin }
            - { call: "POST /safety/job-roles", payload: { title: "Laborer", hazard_class: "LOW" }, as: EHSAdmin, captures: { jr_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Ann A", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { a_id: $.data.id } }
          trigger:
            - { call: "POST /safety/observations", payload: { program_id: "${p_id}", reporter_id: "${a_id}", kind: "OBSERVATION", description: "Tomorrow's spill", occurred_at: "2026-06-02T00:00:00Z" }, as: Employee, as_user_id: "${a_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FUTURE_DATE_NOT_ALLOWED and http status 422"

      - name: contractor_submit_expired_cert_rejected
        claim_type: violation_to_error
        grounds: [ "validations[priority=14]", "errors[ERR_INSURANCE_CERT_EXPIRED]"]
        distinguishing_aspect: "Submitting prequalification with insurance_cert_expires_on before the logical today (2026-05-01 vs clock 2026-06-01) is rejected 422."
        test_recipe:
          setup: ["clock 2026-06-01; contractor whose cert expired 2026-05-01"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EHSAdmin }
            - { call: "POST /safety/contractor-orgs", payload: { name: "Rusty Rigs", contact_email: "ops@rusty.example", emr: 0.9, trir: 1.0, safety_audit_pct: 90, insurance_cert_expires_on: "2026-05-01" }, as: EHSAdmin, captures: { c_id: $.data.id } }
          trigger:
            - { call: "POST /safety/contractor-orgs/${c_id}/submit", payload: {}, as: ContractorRep, as_user_id: "${c_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INSURANCE_CERT_EXPIRED; contractor stays DRAFT"

      - name: duplicate_assigned_training_rejected
        claim_type: violation_to_error
        grounds: [ "validations[priority=11]", "errors[ERR_DUPLICATE_ASSIGNMENT]"]
        distinguishing_aspect: "A second ASSIGNED assignment for the same employee_id + course_id is rejected 409 ERR_DUPLICATE_ASSIGNMENT."
        test_recipe: 
          setup: ["LOW role; HAZCOM course; ACTIVE employee E with one ASSIGNED assignment for the course"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EHSAdmin }
            - { call: "POST /safety/job-roles", payload: { title: "Laborer", hazard_class: "LOW" }, as: EHSAdmin, captures: { jr_id: $.data.id } }
            - { call: "POST /safety/training-courses", payload: { title: "HAZCOM", hazard_class: "LOW", validity_months: 12 }, as: EHSAdmin, captures: { course_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Eli E", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /safety/training-assignments", payload: { employee_id: "${e_id}", course_id: "${course_id}", due_date: "2026-06-20T00:00:00Z" }, as: Supervisor, as_user_id: "${e_id}" }
          trigger:
            - { call: "POST /safety/training-assignments", payload: { employee_id: "${e_id}", course_id: "${course_id}", due_date: "2026-07-01T00:00:00Z" }, as: Supervisor, as_user_id: "${e_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DUPLICATE_ASSIGNMENT; exactly one ASSIGNED assignment exists for the pair"

      - name: lcr_evidence_control_must_be_verified
        claim_type: violation_to_error
        grounds: [ "validations[priority=17]", "errors[ERR_CONTROL_NOT_VERIFIED]"]
        distinguishing_aspect: "Responding with an evidence control still PLANNED is rejected 422 ERR_CONTROL_NOT_VERIFIED; the response is not recorded."
        test_recipe:
          setup: ["ACTIVE program; employees A/M; hazard assessed with one PLANNED control; one ISSUED recommendation"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EHSAdmin }
            - { call: "POST /safety/programs", payload: { program_year: 2026, scoring_variant: "LEADING_ONLY", incentive_budget_cents: 500000, observation_target_rate: 5.0, exposure_hours: 100000, payroll_by_class: [{ hazard_class: "LOW", payroll_cents: 10000000 }, { hazard_class: "MODERATE", payroll_cents: 10000000 }, { hazard_class: "HIGH", payroll_cents: 10000000 }], elr_by_class: [{ hazard_class: "LOW", elr: 1.0 }, { hazard_class: "MODERATE", elr: 1.0 }, { hazard_class: "HIGH", elr: 1.0 }] }, as: EHSAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /safety/programs/${p_id}/activate", payload: {}, as: EHSAdmin }
            - { call: "POST /safety/job-roles", payload: { title: "Laborer", hazard_class: "LOW" }, as: EHSAdmin, captures: { jr_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Ann A", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Marta M", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /safety/hazards", payload: { program_id: "${p_id}", location: "L1", description: "Noise", identified_by: "${a_id}" }, as: SafetyManager, as_user_id: "${m_id}", captures: { h_id: $.data.id } }
            - { call: "POST /safety/hazards/${h_id}/assess", payload: { severity: 3, probability: 2 }, as: SafetyManager, as_user_id: "${m_id}" }
            - { call: "POST /safety/hazards/${h_id}/controls", payload: { description: "Enclosure", implementer_id: "${a_id}", due_date: "2026-06-20T00:00:00Z" }, as: SafetyManager, as_user_id: "${m_id}", captures: { c_id: $.data.id } }
            - { call: "POST /safety/loss-control-recommendations", payload: { program_id: "${p_id}", carrier_name: "Acme Mutual", priority: "HIGH", description: "Reduce press noise", due_date: "2026-09-01T00:00:00Z" }, as: CarrierConsultant, captures: { r_id: $.data.id } }
          trigger:
            - { call: "POST /safety/loss-control-recommendations/${r_id}/respond", payload: { response_text: "Enclosure planned", evidence_control_id: "${c_id}" }, as: SafetyManager, as_user_id: "${m_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CONTROL_NOT_VERIFIED; recommendation stays ISSUED"

      - name: close_blocked_by_open_hazard
        claim_type: violation_to_error
        grounds: [ "validations[priority=18]", "errors[ERR_OPEN_HAZARDS_REMAIN]"]
        distinguishing_aspect: "Program close with one hazard still OPEN (never assessed) is rejected 422 ERR_OPEN_HAZARDS_REMAIN."
        test_recipe:
          setup: ["ACTIVE program; employees A/M; one OPEN hazard"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EHSAdmin }
            - { call: "POST /safety/programs", payload: { program_year: 2026, scoring_variant: "LEADING_ONLY", incentive_budget_cents: 500000, observation_target_rate: 5.0, exposure_hours: 100000, payroll_by_class: [{ hazard_class: "LOW", payroll_cents: 10000000 }, { hazard_class: "MODERATE", payroll_cents: 10000000 }, { hazard_class: "HIGH", payroll_cents: 10000000 }], elr_by_class: [{ hazard_class: "LOW", elr: 1.0 }, { hazard_class: "MODERATE", elr: 1.0 }, { hazard_class: "HIGH", elr: 1.0 }] }, as: EHSAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /safety/programs/${p_id}/activate", payload: {}, as: EHSAdmin }
            - { call: "POST /safety/job-roles", payload: { title: "Laborer", hazard_class: "LOW" }, as: EHSAdmin, captures: { jr_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Ann A", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Marta M", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /safety/hazards", payload: { program_id: "${p_id}", location: "L1", description: "Unassessed", identified_by: "${a_id}" }, as: SafetyManager, as_user_id: "${m_id}" }
          trigger:
            - { call: "POST /safety/programs/${p_id}/close", payload: {}, as: EHSAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_OPEN_HAZARDS_REMAIN; program stays ACTIVE; no awards created"

      - name: close_blocked_by_open_recommendation
        claim_type: violation_to_error
        grounds: [ "validations[priority=19]", "errors[ERR_OPEN_RECOMMENDATIONS_REMAIN]"]
        distinguishing_aspect: "Program close with one recommendation still ISSUED is rejected 422 ERR_OPEN_RECOMMENDATIONS_REMAIN (no hazards exist, so this is the first failing referential check)."
        test_recipe:
          setup: ["ACTIVE program; one ISSUED recommendation due 2026-12-01"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EHSAdmin }
            - { call: "POST /safety/programs", payload: { program_year: 2026, scoring_variant: "LEADING_ONLY", incentive_budget_cents: 500000, observation_target_rate: 5.0, exposure_hours: 100000, payroll_by_class: [{ hazard_class: "LOW", payroll_cents: 10000000 }, { hazard_class: "MODERATE", payroll_cents: 10000000 }, { hazard_class: "HIGH", payroll_cents: 10000000 }], elr_by_class: [{ hazard_class: "LOW", elr: 1.0 }, { hazard_class: "MODERATE", elr: 1.0 }, { hazard_class: "HIGH", elr: 1.0 }] }, as: EHSAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /safety/programs/${p_id}/activate", payload: {}, as: EHSAdmin }
            - { call: "POST /safety/loss-control-recommendations", payload: { program_id: "${p_id}", carrier_name: "Acme Mutual", priority: "MEDIUM", description: "Refresh JHA library", due_date: "2026-12-01T00:00:00Z" }, as: CarrierConsultant }
          trigger:
            - { call: "POST /safety/programs/${p_id}/close", payload: {}, as: EHSAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_OPEN_RECOMMENDATIONS_REMAIN; program stays ACTIVE"

      - name: reconcile_blocked_by_unpaid_awards
        claim_type: violation_to_error
        grounds: [ "validations[priority=21]", "errors[ERR_UNPAID_AWARDS_REMAIN]"]
        distinguishing_aspect: "Reconcile while an award is still CALCULATED is rejected 422 ERR_UNPAID_AWARDS_REMAIN."
        test_recipe:
          setup: ["CLOSED program; committee member A earned 5 points from one held meeting -> one CALCULATED award (800c)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EHSAdmin }
            - { call: "POST /safety/programs", payload: { program_year: 2026, scoring_variant: "LEADING_ONLY", incentive_budget_cents: 500000, observation_target_rate: 5.0, exposure_hours: 100000, payroll_by_class: [{ hazard_class: "LOW", payroll_cents: 10000000 }, { hazard_class: "MODERATE", payroll_cents: 10000000 }, { hazard_class: "HIGH", payroll_cents: 10000000 }], elr_by_class: [{ hazard_class: "LOW", elr: 1.0 }, { hazard_class: "MODERATE", elr: 1.0 }, { hazard_class: "HIGH", elr: 1.0 }], quorum_min: 1 }, as: EHSAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /safety/programs/${p_id}/activate", payload: {}, as: EHSAdmin }
            - { call: "POST /safety/job-roles", payload: { title: "Laborer", hazard_class: "LOW" }, as: EHSAdmin, captures: { jr_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Ann A", job_role_id: "${jr_id}", hired_on: "2026-01-05", committee_member: true }, as: EHSAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Marta M", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { m_id: $.data.id } }
