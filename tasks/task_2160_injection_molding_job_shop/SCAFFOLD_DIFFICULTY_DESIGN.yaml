            - "immediately after the revise call PPAPSubmission.${ppap_id}.status == DRAFT, revision_no == 2, fai_dimensional_pass == null, fai_sample_shots == null, submitted_by_user_id == null, internal_reviewed_by_user_id == null and customer_decided_by_user_id == null"
