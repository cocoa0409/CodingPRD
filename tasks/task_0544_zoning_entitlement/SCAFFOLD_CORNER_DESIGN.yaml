      - name: effectuate_before_appeal_window_closes_returns_window_open
        claim_type: precondition_enforcement
        grounds: [state_machines.EntitlementApplication.DECIDED_APPROVED_to_EFFECTIVE, "errors[ERR_APPEAL_WINDOW_OPEN]"]
