scenario: |
  2835. Pipeline Nomination & Scheduling (refined products pipeline operator): shipper nomination
  submission by cycle with origin, destination and product grade, proration when nominations exceed
  line capacity using historical shipping history rules, batch sequencing and interface management
  between product grades with transmix handling, tariff application, tender minimums and common
  carrier obligations, inventory balancing at origin and destination terminals with linefill
  requirements, scheduling changes for maintenance, pigging and integrity work with shipper
  notification, product quality specification enforcement at injection points with rejection
  rights, imbalance settlement, loss allocation and shipper billing.
domain_name: refined-products-pipeline-nomination-scheduling
api_prefix: "/pipeline"

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by explicit foreign keys; every collection lives at the
  # top level (`/pipeline/nominations`, `/pipeline/batch-tickets`, …) and nothing
  # is nested behind a parent path segment except action sub-paths.

  state_machine_shape: cyclic
  # NominationCycle loops PUBLISHED -> RESEQUENCING -> PRORATED -> SCHEDULED -> PUBLISHED when
  # integrity work derates the line; Nomination loops ACCEPTED/SCHEDULED -> REVISION_REQUESTED ->
  # SUBMITTED -> ACCEPTED. BatchTicket additionally carries two independent state dimensions
  # (movement_status x quality_status) that advance separately on the same row.

  relationship_patterns:
    - one_to_many          # NominationCycle -> Nomination, NominationCycle -> BatchTicket
    - self_referential     # Nomination.supersedes_nomination_id, BatchTicket.predecessor_batch_id
    - cross_aggregate      # BatchTicket -> Nomination -> Shipper; MaintenanceEvent -> PipelineSegment -> NominationCycle

  role_model: segregation_of_duties
  # The operator whose X-User-ID published a cycle's schedule may not certify that cycle's
  # imbalance settlements; certification and invoicing sit with different roles.

  consistency_model: immediate

  difficulty_level: expert

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Shipper
    parent: null
    common_fields: true
    fields:
      - name: shipper_code
        type: string
        source: input
        description: "Unique carrier-assigned shipper code"
        constraints: "unique across all Shipper rows; 3-12 chars"
      - name: name
        type: string
        source: input
        description: "Legal name of the shipper"
      - name: status
        type: enum
        source: system
        description: "Common-carrier standing of the shipper"
        default: ACTIVE
        constraints: "status IN {ACTIVE, SUSPENDED}; ACTIVE at creation, SUSPENDED by POST /pipeline/shippers/{id}/suspend"
      - name: suspended_reason
        type: string
        source: system
        description: "Reason text recorded when status becomes SUSPENDED; null while ACTIVE"
        default: null
      - name: credit_limit_usd
        type: number
        source: input
        description: "Maximum unsettled tariff exposure the carrier extends to this shipper"
        constraints: ">= 0; 2 decimal places"
      - name: exposure_usd
        type: number
        source: computed
        description: "Unsettled tariff exposure; recomputed by calculations.shipper_exposure on every inject, deliver, cancel and settle"
        default: 0

  - name: Terminal
    parent: null
    common_fields: true
    fields:
      - name: terminal_code
        type: string
        source: input
        description: "Unique terminal code"
        constraints: "unique across all Terminal rows"
      - name: name
        type: string
        source: input
        description: "Terminal name"
      - name: role_kind
        type: enum
        source: input
        description: "Whether the terminal can originate, receive, or both"
        constraints: "role_kind IN {ORIGIN, DESTINATION, BOTH}"
      - name: shell_capacity_bbl
        type: number
        source: input
        description: "Total tankage shell capacity in barrels"
        constraints: "> 0"
      - name: min_operating_inventory_bbl
        type: number
        source: input
        description: "Inventory floor that must remain in tank after any injection debit"
        constraints: ">= 0"
      - name: injection_bays
        type: integer
        source: input
        description: "Number of batches that may occupy overlapping injection windows at this terminal"
        default: 1
        constraints: ">= 1"
      - name: inventory_bbl
        type: number
        source: computed
        description: "Current book inventory; moved by inventory adjustments, injections, deliveries and batch cancellations"
        default: 0

  - name: ProductGrade
    parent: null
    common_fields: true
    fields:
      - name: grade_code
        type: string
        source: input
        description: "Unique product grade code (e.g. JET, ULSD, CBOB, TRANSMIX)"
        constraints: "unique across all ProductGrade rows"
      - name: name
        type: string
        source: input
        description: "Human readable grade name"
      - name: sequence_rank
        type: integer
        source: input
        description: "Batch-sequencing rank; 1 = cleanest/lightest product, higher = dirtier. Drives interface transmix volume and batch order."
        constraints: "1 <= sequence_rank <= 9"
      - name: max_sulfur_ppm
        type: number
        source: input
        description: "Injection specification ceiling for sulfur in ppm"
        constraints: "> 0"
      - name: max_rvp_psi
        type: number
        source: input
        description: "Injection specification ceiling for Reid vapour pressure in psi"
        constraints: "> 0"
      - name: is_transmix_grade
        type: boolean
        source: input
        description: "True when the grade is the interface slop cut rather than a shippable product"
        default: false

  - name: PipelineSegment
    parent: null
    common_fields: true
    fields:
      - name: segment_code
        type: string
        source: input
        description: "Unique segment code"
        constraints: "unique across all PipelineSegment rows"
      - name: origin_terminal_id
        type: string
        source: input
        description: "FK -> Terminal.id; injection terminal of this segment; the Terminal must have role_kind IN {ORIGIN, BOTH}"
      - name: destination_terminal_id
        type: string
        source: input
        description: "FK -> Terminal.id; delivery terminal of this segment; the Terminal must have role_kind IN {DESTINATION, BOTH}"
      - name: linefill_grade_id
        type: string
        source: input
        description: "FK -> ProductGrade.id; grade currently standing as linefill; the first batch of every schedule interfaces against this grade"
      - name: capacity_bbl_per_cycle
        type: number
        source: input
        description: "Nameplate throughput of the segment for one nomination cycle, in barrels"
        constraints: "> 0"
      - name: transmix_reserve_bbl
        type: number
        source: input
        description: "Volume held back from nominatable capacity to absorb interface transmix"
        constraints: ">= 0"
      - name: transmix_cut_bbl
        type: number
        source: input
        description: "Transmix cut generated per unit of sequence_rank gap at a grade interface"
        constraints: ">= 0"
      - name: min_tender_bbl
        type: number
        source: input
        description: "Smallest volume the segment will physically batch; enforced at nomination submission"
        constraints: "> 0"
      - name: linefill_requirement_bbl
        type: number
        source: input
        description: "Linefill the segment must hold before a schedule may be published"
        constraints: ">= 0"
      - name: linefill_bbl
        type: number
        source: input
        description: "Linefill currently standing in the line"
        constraints: ">= 0"
      - name: proration_policy
        type: enum
        source: input
        description: "Which allocation algorithm variant calculations.capacity_proration applies for this segment"
        constraints: "proration_policy IN {HISTORY_WEIGHTED, VOLUME_WEIGHTED}"
      - name: operational_status
        type: enum
        source: computed
        description: "Derived from maintenance events; OPERATIONAL when no event with status IN {NOTIFIED, ACTIVE} applies, DERATED when 0 < derate_pct < 1, SHUT when derate_pct == 1"
        default: OPERATIONAL
        constraints: "operational_status IN {OPERATIONAL, DERATED, SHUT}"
      - name: derate_pct
        type: number
        source: computed
        description: "Maximum capacity_derate_pct over MaintenanceEvent rows on this segment with status IN {NOTIFIED, ACTIVE}"
        default: 0
        constraints: "0 <= derate_pct <= 1; 2 decimal places"
      - name: in_transit_bbl
        type: number
        source: computed
        description: "Volume injected but not yet delivered; incremented on inject, decremented on deliver and on cancellation of an INJECTED batch"
        default: 0
      - name: transmix_inventory_bbl
        type: number
        source: computed
        description: "Accumulated interface transmix cut held in the segment's slop account"
        default: 0
      - name: system_loss_bbl
        type: number
        source: computed
        description: "Cumulative injected-minus-delivered shrinkage booked against the segment"
        default: 0

  - name: ShippingHistoryRecord
    parent: null
    common_fields: false
    fields:
      - name: shipper_id
        type: string
        source: input
        description: "FK -> Shipper.id; shipper whose historical movement this row records"
      - name: segment_id
        type: string
        source: input
        description: "FK -> PipelineSegment.id; segment the historical movement ran on"
      - name: cycle_code
        type: string
        source: input
        description: "Code of the historical cycle this record summarises"
      - name: actual_shipped_bbl
        type: number
        source: input
        description: "Barrels actually delivered for this shipper in that historical cycle"
        constraints: ">= 0"
      - name: cycle_end_at
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the historical cycle's ship window ended; the lookback filter of calculations.shipper_history_base tests this field"
      - name: record_status
        type: enum
        source: input
        description: "Only FINAL rows enter calculations.shipper_history_base; PROVISIONAL rows are excluded"
        constraints: "record_status IN {FINAL, PROVISIONAL}"

  - name: Tariff
    parent: null
    common_fields: true
    fields:
      - name: segment_id
        type: string
        source: input
        description: "FK -> PipelineSegment.id; segment this tariff prices"
      - name: grade_id
        type: string
        source: input
        description: "FK -> ProductGrade.id; grade this tariff prices"
      - name: base_rate_usd_per_bbl
        type: number
        source: input
        description: "Rate applied when billable volume < tier1_min_bbl"
        constraints: "> 0; 3 decimal places"
      - name: tier1_min_bbl
        type: number
        source: input
        description: "Inclusive volume breakpoint at which tier1_rate_usd_per_bbl replaces base_rate_usd_per_bbl"
        constraints: "> 0"
      - name: tier1_rate_usd_per_bbl
        type: number
        source: input
        description: "Rate applied when tier1_min_bbl <= billable volume < tier2_min_bbl"
        constraints: "> 0; 3 decimal places"
      - name: tier2_min_bbl
        type: number
        source: input
        description: "Inclusive volume breakpoint at which tier2_rate_usd_per_bbl applies"
        constraints: "> tier1_min_bbl"
      - name: tier2_rate_usd_per_bbl
        type: number
        source: input
        description: "Rate applied when billable volume >= tier2_min_bbl"
        constraints: "> 0; 3 decimal places"
      - name: tender_minimum_bbl
        type: number
        source: input
        description: "Common-carrier tender minimum; nominations below it are rejected at cycle close and billing is floored at it"
        constraints: "> 0"
      - name: imbalance_penalty_rate_usd_per_bbl
        type: number
        source: input
        description: "Per-barrel penalty rate multiplied by the imbalance tier multiplier at settlement"
        constraints: ">= 0"
      - name: effective_from
        type: datetime
        source: input
        description: "ISO 8601 UTC instant from which this tariff may be pinned (inclusive)"
      - name: effective_to
        type: datetime
        source: input
        description: "ISO 8601 UTC instant at which this tariff stops being pinnable (exclusive); null means open-ended"
        default: null
      - name: status
        type: enum
        source: system
        description: "Publication state; DRAFT at creation, EFFECTIVE on activate, SUPERSEDED when a newer overlapping tariff for the same segment_id + grade_id is activated"
        default: DRAFT
        constraints: "status IN {DRAFT, EFFECTIVE, SUPERSEDED}"

  - name: NominationCycle
    parent: null
    common_fields: true
    fields:
      - name: cycle_code
        type: string
        source: input
        description: "Shipping cycle code, unique per segment_id"
        constraints: "unique per (segment_id, cycle_code)"
      - name: segment_id
        type: string
        source: input
        description: "FK -> PipelineSegment.id; segment whose capacity this cycle allocates"
      - name: window_open_at
        type: datetime
        source: input
        description: "ISO 8601 UTC instant nominations open (inclusive)"
      - name: window_close_at
        type: datetime
        source: input
        description: "ISO 8601 UTC instant nominations close (exclusive)"
      - name: ship_start_at
        type: datetime
        source: input
        description: "ISO 8601 UTC start of the physical ship window (inclusive); first batch's injection window starts here"
      - name: ship_end_at
        type: datetime
        source: input
        description: "ISO 8601 UTC end of the physical ship window (exclusive)"
      - name: status
        type: enum
        source: system
        description: "Cycle lifecycle state"
        default: OPEN
        constraints: "status IN {OPEN, CLOSED, PRORATED, SCHEDULED, PUBLISHED, RESEQUENCING, SETTLED}"
      - name: effective_capacity_bbl
        type: number
        source: computed
        description: "Nominatable capacity of the cycle per calculations.effective_capacity; recomputed at close, at prorate and whenever segment.derate_pct changes"
        default: 0
      - name: derate_pct_applied
        type: number
        source: computed
        description: "Snapshot of PipelineSegment.derate_pct used in the most recent effective_capacity computation"
        default: 0
      - name: nominated_total_bbl
        type: number
        source: computed
        description: "Sum of Nomination.nominated_bbl over this cycle's nominations with status IN {SUBMITTED, ACCEPTED, PRORATED, REVISION_REQUESTED, SCHEDULED, COMPLETED}"
        default: 0
      - name: allocated_total_bbl
        type: number
        source: computed
        description: "Sum of Nomination.allocated_bbl over the same status set"
        default: 0
      - name: unallocated_capacity_bbl
        type: number
        source: computed
        description: "effective_capacity_bbl - allocated_total_bbl; the capacity-conservation counterpart tracked by calculations.capacity_conservation"
        default: 0
      - name: proration_factor
        type: number
        source: computed
        description: "allocated_total_bbl / nominated_total_bbl rounded to 6 decimals; exactly 1.000000 when nominated_total_bbl is 0"
        default: 1.000000
        constraints: "6 decimal places, round_half_up"
      - name: total_transmix_bbl
        type: number
        source: computed
        description: "Sum of BatchTicket.transmix_bbl over this cycle's tickets with movement_status != CANCELLED"
        default: 0
      - name: schedule_version
        type: integer
        source: computed
        description: "Incremented by one every time a schedule is published for this cycle"
        default: 0
      - name: schedule_published_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the most recent publish; null before the first publish"
        default: null
      - name: schedule_published_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the PipelineScheduler that published the current schedule; compared against the certifier under the segregation-of-duties rule"
        default: null
      - name: settled_at
        type: datetime
        source: computed
        description: "Logical-clock instant the cycle was settled; null before settlement"
        default: null

  - name: Nomination
    parent: null
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: "FK -> NominationCycle.id; cycle this nomination competes in"
      - name: shipper_id
        type: string
        source: input
        description: "FK -> Shipper.id; nominating shipper, which must equal X-User-ID for role Shipper"
      - name: grade_id
        type: string
        source: input
        description: "FK -> ProductGrade.id; product grade nominated"
      - name: origin_terminal_id
        type: string
        source: input
        description: "FK -> Terminal.id; requested injection terminal, which must equal the cycle's segment origin_terminal_id"
      - name: destination_terminal_id
        type: string
        source: input
        description: "FK -> Terminal.id; requested delivery terminal, which must equal the cycle's segment destination_terminal_id"
      - name: supersedes_nomination_id
        type: string
        source: computed
        description: "FK -> Nomination.id; the row this nomination superseded on creation, null when none existed"
        default: null
      - name: pinned_tariff_id
        type: string
        source: computed
        description: "FK -> Tariff.id; tariff selected by calculations.tariff_pinning at cycle close and frozen for billing"
        default: null
      - name: nominated_bbl
        type: number
        source: input
        description: "Barrels requested for the cycle"
        constraints: "> 0"
      - name: allocated_bbl
        type: number
        source: computed
        description: "Barrels awarded by calculations.capacity_proration; whole barrels"
        default: 0
      - name: history_base_bbl
        type: number
        source: computed
        description: "Historical shipping base from calculations.shipper_history_base, frozen at each proration run"
        default: 0
      - name: allocation_class
        type: enum
        source: computed
        description: "HISTORICAL when the shipper has >= 2 qualifying FINAL history records on the segment, otherwise NEW_SHIPPER"
        default: NEW_SHIPPER
        constraints: "allocation_class IN {HISTORICAL, NEW_SHIPPER}"
      - name: status
        type: enum
        source: system
        description: "Nomination lifecycle state"
        default: SUBMITTED
        constraints: "status IN {SUBMITTED, ACCEPTED, PRORATED, SCHEDULED, COMPLETED, REVISION_REQUESTED, WITHDRAWN, SUPERSEDED, REJECTED}"
      - name: rejection_reason
        type: enum
        source: system
        description: "Why the nomination was rejected; null unless status == REJECTED"
        default: null
        constraints: "rejection_reason IN {BELOW_TENDER_MINIMUM, BELOW_TENDER_AFTER_PRORATION}"
      - name: revision_count
        type: integer
        source: computed
        description: "Number of times this nomination has been pushed back to REVISION_REQUESTED"
        default: 0

  - name: BatchTicket
    parent: null
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: computed
        description: "FK -> NominationCycle.id; cycle whose schedule created this ticket"
      - name: nomination_id
        type: string
        source: computed
        description: "FK -> Nomination.id; nomination this ticket lifts"
      - name: predecessor_batch_id
        type: string
        source: computed
        description: "FK -> BatchTicket.id; ticket immediately ahead of this one in the sequence, null for sequence_position 1"
        default: null
      - name: sequence_position
        type: integer
        source: computed
        description: "1-based position in the published batch order for the cycle"
      - name: volume_bbl
        type: number
        source: computed
        description: "Scheduled batch volume, equal to Nomination.allocated_bbl at schedule build time"
      - name: transmix_bbl
        type: number
        source: computed
        description: "Interface transmix cut generated ahead of this batch per calculations.interface_transmix"
        default: 0
      - name: requires_flush
        type: boolean
        source: computed
        description: "True when the upstream interface is an upgrade of two or more sequence_rank steps and a flush cut is mandated"
        default: false
      - name: injection_window_start
        type: datetime
        source: computed
        description: "ISO 8601 UTC start of the ticket's injection window (inclusive)"
      - name: injection_window_end
        type: datetime
        source: computed
        description: "ISO 8601 UTC end of the ticket's injection window (exclusive)"
      - name: movement_status
        type: enum
        source: system
        description: "Physical movement dimension, independent of quality_status"
        default: PLANNED
        constraints: "movement_status IN {PLANNED, INJECTED, DELIVERED, CANCELLED}"
      - name: quality_status
        type: enum
        source: system
        description: "Specification dimension, independent of movement_status"
        default: PENDING
        constraints: "quality_status IN {PENDING, PASSED, REJECTED}"
      - name: measured_sulfur_ppm
        type: number
        source: system
        description: "Sulfur measured at the most recent injection attempt; null before the first attempt"
        default: null
      - name: measured_rvp_psi
        type: number
        source: system
        description: "Reid vapour pressure measured at the most recent injection attempt; null before the first attempt"
        default: null
      - name: retest_count
        type: integer
        source: computed
        description: "Number of injection attempts rejected on specification for this ticket"
        default: 0
      - name: injected_bbl
        type: number
        source: system
        description: "Barrels actually injected; null until movement_status becomes INJECTED"
        default: null
      - name: delivered_bbl
        type: number
        source: system
        description: "Barrels actually delivered; null until movement_status becomes DELIVERED"
        default: null
      - name: cancel_reason
        type: string
        source: system
        description: "Reason recorded when movement_status becomes CANCELLED; null otherwise"
        default: null

  - name: MaintenanceEvent
    parent: null
    common_fields: true
    fields:
      - name: segment_id
        type: string
        source: input
        description: "FK -> PipelineSegment.id; segment taken out of full service"
      - name: kind
        type: enum
        source: input
        description: "Nature of the integrity work"
        constraints: "kind IN {PIGGING, INTEGRITY_DIG, HYDROTEST, VALVE_REPAIR}"
      - name: window_start
        type: datetime
        source: input
        description: "ISO 8601 UTC start of the outage window (inclusive)"
      - name: window_end
        type: datetime
        source: input
        description: "ISO 8601 UTC end of the outage window (inclusive); overlap arithmetic for this entity is closed-closed with a buffer"
      - name: capacity_derate_pct
        type: number
        source: input
        description: "Fraction of nameplate capacity lost while the event is NOTIFIED or ACTIVE; 1 means the line is SHUT"
        constraints: "0 < capacity_derate_pct <= 1; 2 decimal places"
      - name: status
        type: enum
        source: system
        description: "Event lifecycle state"
        default: PLANNED
        constraints: "status IN {PLANNED, NOTIFIED, ACTIVE, COMPLETED}"
      - name: notified_at
        type: datetime
        source: computed
        description: "Logical-clock instant shipper notification was issued; null while PLANNED"
        default: null
      - name: notified_shipper_count
        type: integer
        source: computed
        description: "Distinct Shipper count notified at the NOTIFIED transition per calculations.shipper_notification_scope"
        default: 0
      - name: notes
        type: string
        source: input
        description: "Free-text operator note"
        default: null

  - name: ImbalanceSettlement
    parent: null
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: computed
        description: "FK -> NominationCycle.id; settled cycle"
      - name: shipper_id
        type: string
        source: computed
        description: "FK -> Shipper.id; billed shipper"
      - name: basis_mode
        type: enum
        source: computed
        description: "Billing basis chosen at settle time; selects which variant of calculations.tariff_charge writes tariff_charge_usd"
        constraints: "basis_mode IN {SCHEDULED, DELIVERED}"
      - name: scheduled_bbl
        type: number
        source: computed
        description: "Sum of BatchTicket.volume_bbl over this shipper's tickets in the cycle with movement_status IN {PLANNED, INJECTED, DELIVERED}"
      - name: delivered_bbl
        type: number
        source: computed
        description: "Sum of BatchTicket.delivered_bbl over this shipper's tickets in the cycle with movement_status == DELIVERED"
      - name: loss_allocation_bbl
        type: number
        source: computed
        description: "Share of the cycle's system loss allocated to this shipper per calculations.loss_allocation"
      - name: imbalance_bbl
        type: number
        source: computed
        description: "delivered_bbl - scheduled_bbl + loss_allocation_bbl, 2 decimal places"
      - name: imbalance_pct
        type: number
        source: computed
        description: "abs(imbalance_bbl) / scheduled_bbl rounded to 6 decimals; 0 when scheduled_bbl is 0"
      - name: imbalance_tier
        type: enum
        source: computed
        description: "Tier chosen from imbalance_pct; TOLERANCE multiplier 0, STANDARD multiplier 1.0, PENALTY multiplier 2.5"
        constraints: "imbalance_tier IN {TOLERANCE, STANDARD, PENALTY}"
      - name: tariff_charge_usd
        type: number
        source: computed
        description: "Transportation charge under basis_mode, per-ticket rounded then summed"
      - name: alt_basis_charge_usd
        type: number
        source: computed
        description: "The same charge computed under the other basis_mode; the dual-variant counterfactual"
      - name: basis_delta_usd
        type: number
        source: computed
        description: "alt_basis_charge_usd - tariff_charge_usd, 2 decimal places"
      - name: imbalance_charge_usd
        type: number
        source: computed
        description: "abs(imbalance_bbl) * pinned tariff imbalance_penalty_rate_usd_per_bbl * tier multiplier, 2 decimal places"
      - name: total_billed_usd
        type: number
        source: computed
        description: "tariff_charge_usd + imbalance_charge_usd, 2 decimal places"
      - name: status
        type: enum
        source: system
        description: "Settlement lifecycle state"
        default: DRAFT
        constraints: "status IN {DRAFT, CERTIFIED, INVOICED}"
      - name: certified_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the PipelineScheduler that certified the settlement; null while DRAFT"
        default: null
      - name: invoice_number
        type: string
        source: input
        description: "Carrier invoice number recorded at invoicing; null before INVOICED"
        default: null

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: NominationCycle
    initial_state: OPEN
    terminal_states: [SETTLED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /pipeline/cycles/{id}/close"
        actor: PipelineScheduler
        preconditions:
          - "cycle.status == OPEN"
          - "every Nomination of this cycle with status == SUBMITTED resolves an EFFECTIVE Tariff under calculations.tariff_pinning, else ERR_NO_EFFECTIVE_TARIFF and the whole close is refused"
        side_effects:
          - "for each Nomination with status == SUBMITTED: pinned_tariff_id = calculations.tariff_pinning result"
          - "for each such Nomination: status -> ACCEPTED when nominated_bbl >= pinned Tariff.tender_minimum_bbl, else status -> REJECTED with rejection_reason = BELOW_TENDER_MINIMUM and allocated_bbl = 0"
          - "recomputes cycle.effective_capacity_bbl and cycle.derate_pct_applied via calculations.effective_capacity"
          - "recomputes cycle.nominated_total_bbl, cycle.allocated_total_bbl, cycle.unallocated_capacity_bbl, cycle.proration_factor"
        note: "Common-carrier obligation: close never discriminates between shippers; only the tender minimum rejects."
      - from: CLOSED
        to: PRORATED
        trigger: "POST /pipeline/cycles/{id}/prorate"
        actor: PipelineScheduler
        preconditions:
          - "cycle.status == CLOSED"
        side_effects:
          - "for each Nomination with status == ACCEPTED: history_base_bbl and allocation_class written from calculations.shipper_history_base"
          - "runs calculations.capacity_proration and writes Nomination.allocated_bbl for every ACCEPTED nomination; each becomes status PRORATED"
          - "cleanup pass: any nomination whose allocated_bbl < pinned Tariff.tender_minimum_bbl gets allocated_bbl = 0, status -> REJECTED, rejection_reason = BELOW_TENDER_AFTER_PRORATION; the released volume stays in cycle.unallocated_capacity_bbl (exactly one cleanup pass, no re-redistribution)"
          - "recomputes cycle.allocated_total_bbl, cycle.unallocated_capacity_bbl and cycle.proration_factor"
      - from: PRORATED
        to: SCHEDULED
        trigger: "POST /pipeline/cycles/{id}/build-schedule"
        actor: PipelineScheduler
        preconditions:
          - "cycle.status == PRORATED"
          - "sum of calculations.interface_transmix over the derived sequence <= segment.transmix_reserve_bbl, else ERR_TRANSMIX_RESERVE_EXCEEDED"
        side_effects:
          - "deletes nothing; creates one BatchTicket per Nomination with status == PRORATED, ordered by calculations.batch_sequencing"
          - "each new ticket: movement_status = PLANNED, quality_status = PENDING, volume_bbl = Nomination.allocated_bbl, sequence_position from the sequence, predecessor_batch_id = previous ticket (null for position 1)"
          - "each new ticket: transmix_bbl and requires_flush from calculations.interface_transmix"
          - "each new ticket: injection_window_start = cycle.ship_start_at + (sequence_position - 1) * 24h, injection_window_end = injection_window_start + 24h"
          - "recomputes cycle.total_transmix_bbl"
        note: "Re-running build-schedule from RESEQUENCING rebuilds the sequence over the surviving PRORATED nominations."
      - from: SCHEDULED
        to: PUBLISHED
        trigger: "POST /pipeline/cycles/{id}/publish-schedule"
        actor: PipelineScheduler
        preconditions:
          - "cycle.status == SCHEDULED"
          - "segment.linefill_bbl >= segment.linefill_requirement_bbl, else ERR_LINEFILL_REQUIREMENT_NOT_MET"
        side_effects:
          - "cycle.schedule_version += 1; cycle.schedule_published_at = logical clock; cycle.schedule_published_by_user_id = X-User-ID of the caller"
          - "every Nomination of this cycle with status == PRORATED -> SCHEDULED"
      - from: PUBLISHED
        to: RESEQUENCING
        trigger: "system: a MaintenanceEvent on cycle.segment_id enters NOTIFIED (or ACTIVE) and its closed window [window_start, window_end] intersects [cycle.ship_start_at, cycle.ship_end_at), and the recomputed effective_capacity_bbl < allocated_total_bbl"
        actor: system
        preconditions:
          - "cycle.status == PUBLISHED"
          - "calculations.effective_capacity re-evaluated with the new segment.derate_pct yields effective_capacity_bbl < cycle.allocated_total_bbl"
        side_effects:
          - "cycle.effective_capacity_bbl and cycle.derate_pct_applied recomputed at the derated capacity"
          - "calculations.capacity_proration re-run over nominations with status == SCHEDULED; each nomination whose new allocation is below its current allocated_bbl gets allocated_bbl = new allocation, status -> REVISION_REQUESTED and revision_count += 1"
          - "every BatchTicket of the cycle with movement_status == PLANNED whose nomination moved to REVISION_REQUESTED -> movement_status = CANCELLED with cancel_reason = 'RESEQUENCING'"
          - "recomputes cycle.allocated_total_bbl, cycle.unallocated_capacity_bbl, cycle.proration_factor, cycle.total_transmix_bbl"
        note: "Third and fourth hops of the maintenance cascade; see calculations.shipper_notification_scope for the notification fan-out."
      - from: RESEQUENCING
        to: PRORATED
        trigger: "POST /pipeline/cycles/{id}/prorate"
        actor: PipelineScheduler
        preconditions:
          - "cycle.status == RESEQUENCING"
        side_effects:
          - "input set is nominations with status IN {SUBMITTED, PRORATED, SCHEDULED, REVISION_REQUESTED}; SUBMITTED rows (resubmitted revisions) and REVISION_REQUESTED rows (never resubmitted) are re-checked against their pinned Tariff.tender_minimum_bbl and rejected with rejection_reason = BELOW_TENDER_MINIMUM when short"
          - "calculations.capacity_proration re-run at the derated cycle.effective_capacity_bbl; surviving rows become status PRORATED with the new allocated_bbl"
          - "recomputes cycle.allocated_total_bbl, cycle.unallocated_capacity_bbl and cycle.proration_factor"
      - from: PUBLISHED
        to: SETTLED
        trigger: "POST /pipeline/cycles/{id}/settle"
        actor: PipelineScheduler
        preconditions:
          - "cycle.status == PUBLISHED"
          - "every BatchTicket of this cycle has movement_status IN {DELIVERED, CANCELLED}; any PLANNED or INJECTED ticket refuses the settle with ERR_BATCHES_IN_TRANSIT"
        side_effects:
          - "creates one ImbalanceSettlement (status DRAFT) per distinct Shipper holding at least one BatchTicket of this cycle with movement_status != CANCELLED, in ascending Shipper.created_at order"
          - "each settlement's scheduled_bbl, delivered_bbl, loss_allocation_bbl, imbalance_bbl, imbalance_pct, imbalance_tier, tariff_charge_usd, alt_basis_charge_usd, basis_delta_usd, imbalance_charge_usd and total_billed_usd written from calculations.loss_allocation, calculations.tariff_charge and calculations.imbalance_charge"
          - "every Nomination of this cycle with status == SCHEDULED whose tickets are all movement_status == DELIVERED -> COMPLETED"
          - "cycle.settled_at = logical clock"
          - "recomputes Shipper.exposure_usd for every billed shipper via calculations.shipper_exposure"

  - entity: Nomination
    initial_state: SUBMITTED
    terminal_states: [WITHDRAWN, SUPERSEDED, REJECTED, COMPLETED]
    transitions:
      - from: null
        to: SUBMITTED
        trigger: "POST /pipeline/nominations"
        actor: Shipper
        preconditions:
          - "cycle.status == OPEN"
          - "logical clock >= cycle.window_open_at and logical clock < cycle.window_close_at, else ERR_NOMINATION_WINDOW_CLOSED"
          - "shipper.status == ACTIVE, else ERR_SHIPPER_NOT_ACTIVE"
          - "origin_terminal_id == segment.origin_terminal_id and destination_terminal_id == segment.destination_terminal_id, else ERR_ROUTE_NOT_SERVED"
          - "nominated_bbl >= segment.min_tender_bbl, else ERR_TENDER_MINIMUM_NOT_MET"
          - "expected_cycle_version == cycle.version, else ERR_STALE_CYCLE_VERSION"
          - "any existing Nomination with the same (cycle_id, shipper_id, grade_id, origin_terminal_id, destination_terminal_id) has status IN {SUBMITTED, ACCEPTED, WITHDRAWN, SUPERSEDED, REJECTED}; a PRORATED, SCHEDULED, REVISION_REQUESTED or COMPLETED twin means ERR_NOMINATION_LOCKED"
        side_effects:
          - "the newest existing twin with status IN {SUBMITTED, ACCEPTED} -> SUPERSEDED with allocated_bbl = 0, and the new row's supersedes_nomination_id points at it"
          - "increments NominationCycle.version by 1"
          - "recomputes cycle.nominated_total_bbl, cycle.allocated_total_bbl and cycle.unallocated_capacity_bbl"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /pipeline/cycles/{id}/close"
        actor: system
        preconditions:
          - "nominated_bbl >= pinned Tariff.tender_minimum_bbl"
        side_effects:
          - "pinned_tariff_id frozen"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /pipeline/cycles/{id}/close"
        actor: system
        preconditions:
          - "nominated_bbl < pinned Tariff.tender_minimum_bbl"
        side_effects:
          - "rejection_reason = BELOW_TENDER_MINIMUM; allocated_bbl = 0; excluded from cycle.nominated_total_bbl"
      - from: ACCEPTED
        to: PRORATED
        trigger: "POST /pipeline/cycles/{id}/prorate"
        actor: system
        preconditions:
          - "cycle.status == CLOSED"
        side_effects:
          - "history_base_bbl, allocation_class and allocated_bbl written by calculations.capacity_proration"
      - from: PRORATED
        to: REJECTED
        trigger: "POST /pipeline/cycles/{id}/prorate"
        actor: system
        preconditions:
          - "allocated_bbl after redistribution < pinned Tariff.tender_minimum_bbl"
        side_effects:
          - "allocated_bbl = 0; rejection_reason = BELOW_TENDER_AFTER_PRORATION"
      - from: PRORATED
        to: SCHEDULED
        trigger: "POST /pipeline/cycles/{id}/publish-schedule"
        actor: system
        preconditions:
          - "cycle.status == SCHEDULED at the moment of publication"
        side_effects:
          - "none beyond updated_at/version"
      - from: SCHEDULED
        to: REVISION_REQUESTED
        trigger: "system (maintenance derate cascade), system (a BatchTicket of this nomination reaches retest_count 2 and is cancelled for QUALITY_RETEST_LIMIT), or POST /pipeline/nominations/{id}/request-revision"
        actor: PipelineScheduler | system
        preconditions:
          - "cycle.status IN {PUBLISHED, RESEQUENCING}"
        side_effects:
          - "revision_count += 1"
          - "allocated_bbl reduced to the re-prorated allocation when the trigger is the derate cascade"
          - "allocated_bbl = 0 when the trigger is the quality retest limit: the refused volume is released back into cycle.unallocated_capacity_bbl so that allocated_total_bbl + unallocated_capacity_bbl == effective_capacity_bbl still holds"
          - "every BatchTicket of this nomination with movement_status == PLANNED -> CANCELLED"
          - "recomputes cycle.allocated_total_bbl and cycle.unallocated_capacity_bbl"
      - from: PRORATED
        to: REVISION_REQUESTED
        trigger: "POST /pipeline/nominations/{id}/request-revision"
        actor: PipelineScheduler
        preconditions:
          - "cycle.status IN {PRORATED, RESEQUENCING}"
        side_effects:
          - "revision_count += 1"
          - "recomputes cycle.allocated_total_bbl and cycle.unallocated_capacity_bbl"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /pipeline/nominations/{id}/resubmit"
        actor: Shipper
        preconditions:
          - "nomination.shipper_id == X-User-ID, else ERR_NOT_RESOURCE_OWNER"
          - "shipper.status == ACTIVE, else ERR_SHIPPER_NOT_ACTIVE"
          - "body nominated_bbl <= nomination.allocated_bbl at the time of revision, else ERR_REVISION_VOLUME_INCREASE"
          - "body nominated_bbl >= segment.min_tender_bbl, else ERR_TENDER_MINIMUM_NOT_MET"
        side_effects:
          - "nominated_bbl = body value; allocated_bbl = 0"
          - "recomputes cycle.nominated_total_bbl, cycle.allocated_total_bbl and cycle.unallocated_capacity_bbl"
        note: "Closes the nomination revision loop: ACCEPTED/SCHEDULED -> REVISION_REQUESTED -> SUBMITTED -> PRORATED."
      - from: SUBMITTED
        to: PRORATED
        trigger: "POST /pipeline/cycles/{id}/prorate"
        actor: system
        preconditions:
          - "cycle.status == RESEQUENCING"
          - "nominated_bbl >= pinned Tariff.tender_minimum_bbl"
        side_effects:
          - "allocated_bbl written by calculations.capacity_proration at the derated capacity"
      - from: REVISION_REQUESTED
        to: PRORATED
        trigger: "POST /pipeline/cycles/{id}/prorate"
        actor: system
        preconditions:
          - "cycle.status == RESEQUENCING"
          - "nominated_bbl >= pinned Tariff.tender_minimum_bbl"
        side_effects:
          - "allocated_bbl written by calculations.capacity_proration at the derated capacity; the shipper never resubmitted, so its original nominated_bbl is still the weight"
        note: "A revision request is an invitation, not an obligation: the scheduler may re-prorate over unresubmitted rows to keep the common carrier obligation intact."
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /pipeline/nominations/{id}/withdraw"
        actor: Shipper
        preconditions:
          - "nomination.shipper_id == X-User-ID, else ERR_NOT_RESOURCE_OWNER"
          - "cycle.status IN {OPEN, CLOSED, PRORATED}, else ERR_NOMINATION_LOCKED"
        side_effects:
          - "allocated_bbl = 0; recomputes cycle.nominated_total_bbl, cycle.allocated_total_bbl, cycle.unallocated_capacity_bbl and cycle.proration_factor"
      - from: ACCEPTED
        to: WITHDRAWN
        trigger: "POST /pipeline/nominations/{id}/withdraw"
        actor: Shipper
        preconditions:
          - "nomination.shipper_id == X-User-ID, else ERR_NOT_RESOURCE_OWNER"
          - "cycle.status IN {CLOSED, PRORATED}, else ERR_NOMINATION_LOCKED"
        side_effects:
          - "allocated_bbl = 0; cycle totals recomputed"
      - from: PRORATED
        to: WITHDRAWN
        trigger: "POST /pipeline/nominations/{id}/withdraw"
        actor: Shipper
        preconditions:
          - "nomination.shipper_id == X-User-ID, else ERR_NOT_RESOURCE_OWNER"
          - "cycle.status == PRORATED, else ERR_NOMINATION_LOCKED"
        side_effects:
          - "allocated_bbl = 0"
          - "cycle.nominated_total_bbl and cycle.proration_factor recomputed (hop 2 of the withdraw cascade)"
          - "because cycle.status == PRORATED, calculations.capacity_proration is re-run and every remaining PRORATED nomination's allocated_bbl is rewritten (hop 3 of the withdraw cascade)"
          - "cycle.allocated_total_bbl and cycle.unallocated_capacity_bbl recomputed so that allocated_total_bbl + unallocated_capacity_bbl == effective_capacity_bbl still holds"
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "POST /pipeline/nominations (twin key)"
        actor: system
        preconditions:
          - "a newer nomination with the same (cycle_id, shipper_id, grade_id, origin_terminal_id, destination_terminal_id) is created while this row is SUBMITTED"
        side_effects:
          - "allocated_bbl = 0; excluded from cycle.nominated_total_bbl"
      - from: ACCEPTED
        to: SUPERSEDED
        trigger: "POST /pipeline/nominations (twin key)"
        actor: system
        preconditions:
          - "a newer nomination with the same twin key is created while this row is ACCEPTED and cycle.status == OPEN"
        side_effects:
          - "allocated_bbl = 0; pinned_tariff_id retained for audit; excluded from cycle.nominated_total_bbl"
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /pipeline/cycles/{id}/settle"
        actor: system
        preconditions:
          - "every BatchTicket of this nomination has movement_status == DELIVERED"
        side_effects:
          - "none beyond updated_at/version"

  - entity: BatchTicket
    initial_state: PLANNED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: PLANNED
        to: INJECTED
        trigger: "POST /pipeline/batch-tickets/{id}/inject"
        actor: TerminalOperator
        preconditions:
          - "ticket.movement_status == PLANNED and ticket.quality_status IN {PENDING, REJECTED}"
          - "cycle.status == PUBLISHED, else ERR_CYCLE_INVALID_STATE"
          - "segment.operational_status IN {OPERATIONAL, DERATED}, else ERR_SEGMENT_UNAVAILABLE"
          - "body measured_sulfur_ppm <= grade.max_sulfur_ppm and body measured_rvp_psi <= grade.max_rvp_psi, else ERR_QUALITY_SPEC_VIOLATION"
          - "origin_terminal.inventory_bbl - (body injected_bbl + ticket.transmix_bbl) >= origin_terminal.min_operating_inventory_bbl, else ERR_INSUFFICIENT_ORIGIN_INVENTORY"
          - "calculations.shipper_exposure result including this ticket <= shipper.credit_limit_usd, else ERR_CREDIT_LIMIT_EXCEEDED"
        side_effects:
          - "quality_status -> PASSED; measured_sulfur_ppm and measured_rvp_psi stored; injected_bbl = body injected_bbl"
          - "origin Terminal.inventory_bbl -= (injected_bbl + transmix_bbl)"
          - "segment.in_transit_bbl += injected_bbl; segment.transmix_inventory_bbl += transmix_bbl"
          - "Shipper.exposure_usd recomputed via calculations.shipper_exposure"
        note: "The movement dimension and the quality dimension advance on the same row but are evaluated independently."
      - from: PENDING
        to: REJECTED
        trigger: "POST /pipeline/batch-tickets/{id}/inject (quality dimension, off-spec measurement)"
        actor: TerminalOperator
        preconditions:
          - "ticket.movement_status == PLANNED"
          - "body measured_sulfur_ppm > grade.max_sulfur_ppm or body measured_rvp_psi > grade.max_rvp_psi"
        side_effects:
          - "quality_status -> REJECTED; measured values stored; retest_count += 1; movement_status stays PLANNED; no inventory moves"
          - "when retest_count reaches 2: movement_status -> CANCELLED with cancel_reason = 'QUALITY_RETEST_LIMIT' (hop 2), the parent Nomination -> REVISION_REQUESTED with revision_count += 1 and allocated_bbl = 0 (hop 3), and cycle.allocated_total_bbl / unallocated_capacity_bbl / total_transmix_bbl recomputed (hop 4)"
        note: "The rejection is returned as ERR_QUALITY_SPEC_VIOLATION (422) while these state writes persist — the shipper's product was physically refused at the injection point."
      - from: REJECTED
        to: PASSED
        trigger: "POST /pipeline/batch-tickets/{id}/inject (quality dimension, retest on-spec)"
        actor: TerminalOperator
        preconditions:
          - "ticket.movement_status == PLANNED and ticket.retest_count < 2"
          - "measurements within grade specification"
        side_effects:
          - "movement_status -> INJECTED with the full inject side-effect set"
      - from: INJECTED
        to: DELIVERED
        trigger: "POST /pipeline/batch-tickets/{id}/deliver"
        actor: TerminalOperator
        preconditions:
          - "ticket.movement_status == INJECTED, else ERR_TICKET_INVALID_STATE"
          - "body delivered_bbl > 0 and body delivered_bbl <= ticket.injected_bbl, else ERR_INVALID_REQUEST"
          - "destination_terminal.inventory_bbl + body delivered_bbl <= destination_terminal.shell_capacity_bbl, else ERR_DESTINATION_CAPACITY_EXCEEDED"
        side_effects:
          - "delivered_bbl stored"
          - "destination Terminal.inventory_bbl += delivered_bbl"
          - "segment.in_transit_bbl -= injected_bbl; segment.system_loss_bbl += (injected_bbl - delivered_bbl)"
          - "Shipper.exposure_usd recomputed"
      - from: INJECTED
        to: CANCELLED
        trigger: "POST /pipeline/batch-tickets/{id}/cancel"
        actor: PipelineScheduler | TerminalOperator
        preconditions:
          - "ticket.movement_status == INJECTED, else ERR_TICKET_INVALID_STATE"
        side_effects:
          - "compensation: origin Terminal.inventory_bbl += (injected_bbl + transmix_bbl)"
          - "segment.in_transit_bbl -= injected_bbl; segment.transmix_inventory_bbl -= transmix_bbl"
          - "cancel_reason stored; cycle.total_transmix_bbl recomputed; Shipper.exposure_usd recomputed"
          - "the conserved quantity of calculations.volumetric_conservation is left unchanged"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /pipeline/batch-tickets/{id}/cancel, the RESEQUENCING cascade, or the second quality rejection"
        actor: PipelineScheduler | system
        preconditions:
          - "ticket.movement_status == PLANNED"
        side_effects:
          - "cancel_reason stored; no inventory moves (nothing was injected); cycle.total_transmix_bbl recomputed"

  - entity: MaintenanceEvent
    initial_state: PLANNED
    terminal_states: [COMPLETED]
    transitions:
      - from: PLANNED
        to: NOTIFIED
        trigger: "POST /pipeline/maintenance-events/{id}/notify"
        actor: PipelineScheduler
        preconditions:
          - "event.status == PLANNED, else ERR_MAINTENANCE_INVALID_STATE"
          - "logical clock + 48h <= event.window_start, else ERR_INSUFFICIENT_NOTICE"
        side_effects:
          - "notified_at = logical clock; notified_shipper_count = calculations.shipper_notification_scope (hop 1)"
          - "segment.derate_pct = max capacity_derate_pct over events on the segment with status IN {NOTIFIED, ACTIVE}; segment.operational_status recomputed to DERATED or SHUT (hop 2)"
          - "every NominationCycle on the segment with status == PUBLISHED whose [ship_start_at, ship_end_at) intersects the closed event window recomputes effective_capacity_bbl and, when the new capacity is short, transitions PUBLISHED -> RESEQUENCING (hop 3), which in turn pushes over-allocated nominations to REVISION_REQUESTED (hop 4) and cancels their PLANNED tickets (hop 5)"
      - from: NOTIFIED
        to: ACTIVE
        trigger: "POST /pipeline/maintenance-events/{id}/start"
        actor: PipelineScheduler
        preconditions:
          - "event.status == NOTIFIED, else ERR_MAINTENANCE_INVALID_STATE"
        side_effects:
          - "segment.derate_pct and segment.operational_status recomputed; operational_status becomes SHUT when the governing derate is exactly 1"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /pipeline/maintenance-events/{id}/complete"
        actor: PipelineScheduler
        preconditions:
          - "event.status == ACTIVE, else ERR_MAINTENANCE_INVALID_STATE"
        side_effects:
          - "segment.derate_pct recomputed over the remaining NOTIFIED/ACTIVE events; segment.operational_status returns to OPERATIONAL when none remain"
          - "cycles in RESEQUENCING recompute effective_capacity_bbl and unallocated_capacity_bbl but keep status RESEQUENCING"

  - entity: Tariff
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: EFFECTIVE
        trigger: "POST /pipeline/tariffs/{id}/activate"
        actor: TariffAdministrator
        preconditions:
          - "tariff.status == DRAFT, else ERR_TARIFF_INVALID_STATE"
        side_effects:
          - "every other Tariff with the same segment_id and grade_id, status == EFFECTIVE, and an overlapping [effective_from, effective_to) interval -> SUPERSEDED"
      - from: EFFECTIVE
        to: SUPERSEDED
        trigger: "system: a newer overlapping tariff for the same segment_id + grade_id is activated"
        actor: system
        preconditions:
          - "tariff.status == EFFECTIVE"
        side_effects:
          - "Nomination.pinned_tariff_id values already frozen on closed cycles are NOT rewritten"

  - entity: ImbalanceSettlement
    initial_state: DRAFT
    terminal_states: [INVOICED]
    transitions:
      - from: DRAFT
        to: CERTIFIED
        trigger: "POST /pipeline/settlements/{id}/certify"
        actor: PipelineScheduler
        preconditions:
          - "settlement.status == DRAFT, else ERR_SETTLEMENT_INVALID_STATE"
          - "X-User-ID != cycle.schedule_published_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "certified_by_user_id = X-User-ID"
      - from: CERTIFIED
        to: INVOICED
        trigger: "POST /pipeline/settlements/{id}/invoice"
        actor: TariffAdministrator
        preconditions:
          - "settlement.status == CERTIFIED, else ERR_SETTLEMENT_INVALID_STATE"
        side_effects:
          - "invoice_number stored; Shipper.exposure_usd recomputed"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent's version — no other mechanism)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: nomination-create-stale-cycle
    parent_entity: NominationCycle
    write_endpoint: "POST /pipeline/nominations"
    occ_field: "expected_cycle_version"
    description: |
      Creating a Nomination against a NominationCycle whose version has advanced since the client
      last read it is refused. Because a new nomination for the same (shipper, grade, origin,
      destination) key legitimately supersedes the shipper's prior row, a submission carrying a
      stale cycle version would otherwise silently retire a nomination the client never saw.
    error_id: ERR_STALE_CYCLE_VERSION
    http_status: 412

  - rule_id: inventory-adjust-stale-terminal
    parent_entity: Terminal
    write_endpoint: "POST /pipeline/terminals/{id}/inventory-adjustments"
    occ_field: "expected_terminal_version"
    description: |
      Posting a book inventory adjustment against a Terminal whose version has advanced since the
      client last read it is refused. Adjustments are legitimately repeatable, so nothing in the
      Terminal's state would reject a second delta on its own; the stale version is the only
      signal that the operator's view of inventory_bbl predates an injection, delivery or a
      previous adjustment.
    error_id: ERR_STALE_TERMINAL_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: effective_capacity
    trigger: "on POST /pipeline/cycles/{id}/close, on POST /pipeline/cycles/{id}/prorate, and whenever PipelineSegment.derate_pct changes through a MaintenanceEvent transition — in that last case ONLY for cycles of that segment whose [ship_start_at, ship_end_at) half-open interval intersects the event's [window_start, window_end) interval; cycles whose shipping window does not intersect the maintenance window keep their existing effective_capacity_bbl and derate_pct_applied"
    algorithm: threshold
    formula: |
      linefill_makeup_bbl = max(0, segment.linefill_requirement_bbl - segment.linefill_bbl)
      effective_capacity_bbl = floor(segment.capacity_bbl_per_cycle * (1 - segment.derate_pct))
                               - linefill_makeup_bbl
                               - segment.transmix_reserve_bbl
      cycle.derate_pct_applied = segment.derate_pct
      # floor() is applied to the derated nameplate BEFORE the two subtractions.
      # effective_capacity_bbl is clamped at 0 when the expression is negative.
    input_set: "the single PipelineSegment referenced by cycle.segment_id; segment.derate_pct is the max capacity_derate_pct over MaintenanceEvent rows on that segment with status IN {NOTIFIED, ACTIVE}"
    constants: {}
    precision: "whole barrels (integer)"

  - name: shipper_history_base
    trigger: "on every POST /pipeline/cycles/{id}/prorate, for each nomination in the proration input set"
    algorithm: aggregation
    formula: |
      qualifying = ShippingHistoryRecord rows where
                     record.shipper_id == nomination.shipper_id
                 AND record.segment_id == cycle.segment_id
                 AND record.record_status == FINAL
                 AND record.cycle_end_at >= cycle.window_open_at - 365 days   # inclusive
                 AND record.cycle_end_at <  cycle.window_open_at              # exclusive
      count = number of qualifying rows
      history_base_bbl = 0                       if count == 0
                       = round(sum(qualifying.actual_shipped_bbl) / count, 2)   otherwise
      allocation_class = HISTORICAL  if count >= MIN_HISTORY_RECORDS
                       = NEW_SHIPPER otherwise
    input_set: "FINAL ShippingHistoryRecord rows only; PROVISIONAL rows are excluded even when inside the lookback window. The divisor is the qualifying row count, never a fixed cycle count."
    constants:
      MIN_HISTORY_RECORDS: 2
      HISTORY_LOOKBACK_DAYS: 365
    precision: "2 decimal places, round_half_up"

  - name: capacity_proration
    trigger: "on POST /pipeline/cycles/{id}/prorate (from CLOSED and from RESEQUENCING), on the maintenance derate cascade, and on withdrawal of a nomination while cycle.status == PRORATED"
    algorithm: waterfall_allocation
    formula: |
      EC = cycle.effective_capacity_bbl                  # from calculations.effective_capacity
      IN_SET = nominations of the cycle with status IN {ACCEPTED, PRORATED, SCHEDULED, SUBMITTED}
               (SUBMITTED only when cycle.status == RESEQUENCING)
      if IN_SET is empty:
          every allocation is 0; cycle.proration_factor = 1.000000;
          cycle.unallocated_capacity_bbl = EC; stop.

      # --- variant switch: segment.proration_policy ---------------------------
      if segment.proration_policy == HISTORY_WEIGHTED:
          new_pool  = floor(EC * NEW_SHIPPER_RESERVE_PCT)
          hist_pool = EC - new_pool
          HIST = [n in IN_SET where n.allocation_class == HISTORICAL]
          NEW  = [n in IN_SET where n.allocation_class == NEW_SHIPPER]
          w(n)  = min(n.nominated_bbl, n.history_base_bbl)
          W     = sum(w(n) for n in HIST)
          for n in HIST:
              raw = 0 if W == 0 else hist_pool * w(n) / W
              alloc(n) = min(n.nominated_bbl, floor(raw))
          leftover_hist = hist_pool - sum(alloc(n) for n in HIST)
          if NEW is non-empty:
              raw_new = new_pool / count(NEW)                     # equal split, common carrier
              for n in NEW: alloc(n) = min(n.nominated_bbl, floor(raw_new))
              leftover_new = new_pool - sum(alloc(n) for n in NEW)
          else:
              leftover_new = new_pool                             # unused reserve spills over
          leftover = leftover_hist + leftover_new
      else:   # VOLUME_WEIGHTED — no class split, no new-shipper reserve
          T = sum(n.nominated_bbl for n in IN_SET)
          for n in IN_SET:
              alloc(n) = min(n.nominated_bbl, floor(EC * n.nominated_bbl / T))
          leftover = EC - sum(alloc(n) for n in IN_SET)

      # --- single redistribution pass (identical under both variants) ---------
      eligible = [n in IN_SET where alloc(n) < n.nominated_bbl]
      sort eligible by (n.nominated_bbl - alloc(n)) DESC, tie-break Nomination.created_at ASC
      for n in eligible:
          give = min(n.nominated_bbl - alloc(n), leftover)
          alloc(n) += give
          leftover -= give
      # exactly one pass; any remainder stays as cycle.unallocated_capacity_bbl

      cycle.nominated_total_bbl     = sum(n.nominated_bbl for n in IN_SET)   # recomputed first
      cycle.allocated_total_bbl     = sum(alloc(n))
      cycle.unallocated_capacity_bbl = EC - cycle.allocated_total_bbl
      cycle.proration_factor = 1.000000 if cycle.nominated_total_bbl == 0
                               else round(cycle.allocated_total_bbl / cycle.nominated_total_bbl, 6)
    input_set: "Nominations of the cycle in the status set above; WITHDRAWN, SUPERSEDED, REJECTED and COMPLETED rows are excluded from both the pools and the redistribution."
    constants:
      NEW_SHIPPER_RESERVE_PCT: 0.10
    precision: "allocations are whole barrels (floor before the redistribution pass); proration_factor is 6 decimal places, round_half_up"
    variants:
      - name: history_weighted
        when: "segment.proration_policy == HISTORY_WEIGHTED"
        difference: "Splits EC into a 10% new-shipper reserve and a historical pool, weights the historical pool by min(nominated_bbl, history_base_bbl), and equal-splits the reserve among NEW_SHIPPER nominations. Identical nominations therefore award more to the shipper with the larger shipping history."
      - name: volume_weighted
        when: "segment.proration_policy == VOLUME_WEIGHTED"
        difference: "Ignores allocation_class, history_base_bbl and the reserve entirely and prorates EC strictly in proportion to nominated_bbl, so the same nomination set produces different per-shipper allocations than history_weighted."

  - name: batch_sequencing
    trigger: "on POST /pipeline/cycles/{id}/build-schedule"
    algorithm: topological
    formula: |
      SEQ_INPUT = nominations of the cycle with status == PRORATED and allocated_bbl > 0
      sort SEQ_INPUT by grade.sequence_rank ASC,
                        then allocated_bbl DESC,
                        then Nomination.created_at ASC
      sequence_position = 1..N in that order
      predecessor_batch_id = the ticket at sequence_position - 1 (null at position 1)
      injection_window_start = cycle.ship_start_at + (sequence_position - 1) * SLOT_HOURS
      injection_window_end   = injection_window_start + SLOT_HOURS
    input_set: "PRORATED nominations with a non-zero allocation; REJECTED, WITHDRAWN and REVISION_REQUESTED rows never receive a ticket"
    constants:
      SLOT_HOURS: 24
    precision: "integer positions; windows are ISO 8601 UTC with three fractional digits, half-open [start, end)"

  - name: interface_transmix
    trigger: "on POST /pipeline/cycles/{id}/build-schedule, per created BatchTicket"
    algorithm: constraint_propagation
    formula: |
      upstream_rank = segment.linefill_grade.sequence_rank      if sequence_position == 1
                    = predecessor ticket's grade.sequence_rank  otherwise
      own_rank  = grade of this ticket's nomination .sequence_rank
      rank_gap  = abs(own_rank - upstream_rank)
      if rank_gap == 0:
          transmix_bbl = 0
          requires_flush = false
      elif own_rank > upstream_rank:                 # downgrade: clean product ahead of dirty
          transmix_bbl = segment.transmix_cut_bbl * rank_gap
          requires_flush = false
      else:                                          # upgrade: dirty product ahead of clean
          transmix_bbl = segment.transmix_cut_bbl * rank_gap * UPGRADE_MULTIPLIER
          requires_flush = (rank_gap >= 2)
      cycle.total_transmix_bbl = sum(transmix_bbl over the cycle's tickets with movement_status != CANCELLED)
    input_set: "the ticket's own grade and the grade immediately upstream in the published sequence; the linefill grade stands upstream of position 1"
    constants:
      UPGRADE_MULTIPLIER: 2
    precision: "whole barrels"

  - name: tariff_pinning
    trigger: "on POST /pipeline/cycles/{id}/close, for each Nomination with status == SUBMITTED"
    algorithm: chronological
    formula: |
      candidates = Tariff rows where
                     tariff.segment_id == cycle.segment_id
                 AND tariff.grade_id   == nomination.grade_id
                 AND tariff.status     == EFFECTIVE
                 AND tariff.effective_from <= cycle.window_close_at          # inclusive
                 AND (tariff.effective_to IS NULL OR tariff.effective_to > cycle.window_close_at)
      ranking   = effective_from DESC
      tie_break = Tariff.created_at DESC
      empty_set = the close is refused with ERR_NO_EFFECTIVE_TARIFF (422)
      pinned_tariff_id = candidates[0].id  and is never rewritten afterwards
    input_set: "EFFECTIVE tariffs only; DRAFT and SUPERSEDED rows are never candidates"
    constants: {}
    precision: "n/a (selector)"

  - name: tariff_charge
    trigger: "on POST /pipeline/cycles/{id}/settle, per ImbalanceSettlement"
    algorithm: tiered_pricing
    formula: |
      TICKETS = this shipper's BatchTickets in the cycle with movement_status IN {PLANNED, INJECTED, DELIVERED}
                (CANCELLED tickets are excluded from billing entirely)
      for each ticket t, with T = t.nomination.pinned_tariff:
          billable(t) = max(t.delivered_bbl or 0, T.tender_minimum_bbl)   # DELIVERED basis
                      = max(t.volume_bbl,        T.tender_minimum_bbl)    # SCHEDULED basis
          rate(t) = T.tier2_rate_usd_per_bbl if billable(t) >= T.tier2_min_bbl
                  = T.tier1_rate_usd_per_bbl if billable(t) >= T.tier1_min_bbl
                  = T.base_rate_usd_per_bbl   otherwise
          line(t) = round(billable(t) * rate(t), 2)      # ROUND PER TICKET FIRST
      charge = sum(line(t) for t in TICKETS)             # THEN SUM — never sum-then-round
      tariff_charge_usd    = charge computed on settlement.basis_mode
      alt_basis_charge_usd = charge computed on the other basis
      basis_delta_usd      = round(alt_basis_charge_usd - tariff_charge_usd, 2)
    input_set: "non-CANCELLED tickets of the shipper in the settled cycle; each ticket prices against the tariff pinned on its own nomination, so a shipper holding two grades prices two tariffs"
    constants: {}
    precision: "2 decimal places per ticket line, round_half_up, then exact summation of the rounded lines"
    variants:
      - name: delivered_basis
        when: "settlement.basis_mode == DELIVERED (body of POST /pipeline/cycles/{id}/settle)"
        difference: "Bills the barrels actually delivered, floored at the tender minimum, so a rejected or undelivered batch bills only the tender minimum."
        # For the standard fixture (tickets of 30000 and 26100 bbl delivering 29901 and 26001 bbl
        # against tier1_rate 1.705): 50981.21 + 44331.71 = 95312.92 USD.
      - name: scheduled_basis
        when: "settlement.basis_mode == SCHEDULED (ship-or-pay)"
        difference: "Bills the scheduled batch volume regardless of delivery, so the same cycle yields a strictly larger charge whenever any batch under-delivers."
        # Same fixture: 51150.00 + 44500.50 = 95650.50 USD, a 337.58 USD divergence on identical data.

  - name: loss_allocation
    trigger: "on POST /pipeline/cycles/{id}/settle, before any charge is computed"
    algorithm: waterfall_allocation
    formula: |
      total_injected  = sum(t.injected_bbl  for tickets of the cycle with movement_status == DELIVERED)
      total_delivered = sum(t.delivered_bbl for tickets of the cycle with movement_status == DELIVERED)
      system_loss_bbl = round(total_injected - total_delivered, 2)      # transmix is NOT part of loss
      if total_delivered == 0:
          loss_allocation_bbl = 0 for every shipper; stop.
      for each billed shipper s (ascending Shipper.created_at):
          share(s) = round(system_loss_bbl * delivered_bbl(s) / total_delivered, 2)
      remainder = round(system_loss_bbl - sum(share(s)), 2)
      the remainder is added to the shipper with the largest delivered_bbl,
      tie-break Shipper.created_at ASC
    input_set: "DELIVERED tickets only; PLANNED and INJECTED tickets block settlement altogether (ERR_BATCHES_IN_TRANSIT), so at settle time every non-DELIVERED ticket is CANCELLED and contributes no volume to either total"
    constants: {}
    precision: "2 decimal places, round_half_up; the remainder pass makes the allocation sum exactly equal system_loss_bbl"

  - name: imbalance_charge
    trigger: "on POST /pipeline/cycles/{id}/settle, per ImbalanceSettlement, strictly after calculations.loss_allocation"
    algorithm: threshold
    formula: |
      # Evaluation order is pinned because the tier depends on the imbalance, the imbalance depends
      # on the loss allocation, and the loss allocation depends on cycle-wide delivered volume.
      # Step 1: scheduled_bbl = sum(volume_bbl of the shipper's tickets with
      #                             movement_status IN {PLANNED, INJECTED, DELIVERED})
      # Step 2: delivered_bbl = sum(delivered_bbl of the shipper's DELIVERED tickets)
      # Step 3: loss_allocation_bbl from calculations.loss_allocation
      # Step 4: imbalance_bbl = round(delivered_bbl - scheduled_bbl + loss_allocation_bbl, 2)
      # Step 5: imbalance_pct = 0 if scheduled_bbl == 0
      #                         else round(abs(imbalance_bbl) / scheduled_bbl, 6)
      # Step 6: tier and multiplier from imbalance_pct:
      #           imbalance_pct <= TOLERANCE_PCT            -> TOLERANCE, multiplier 0
      #           imbalance_pct <= STANDARD_PCT             -> STANDARD,  multiplier 1.0
      #           otherwise                                 -> PENALTY,   multiplier 2.5
      # Step 7: imbalance_charge_usd = round(abs(imbalance_bbl)
      #                                      * pinned_tariff_of_lowest_sequence_position_ticket
      #                                        .imbalance_penalty_rate_usd_per_bbl
      #                                      * multiplier, 2)
      # Step 8: total_billed_usd = round(tariff_charge_usd + imbalance_charge_usd, 2)
    input_set: "the shipper's non-CANCELLED tickets in the settled cycle; the penalty rate comes from the tariff pinned on the nomination of the shipper's ticket with the lowest sequence_position (tie-break BatchTicket.created_at ASC)"
    constants:
      TOLERANCE_PCT: 0.005
      STANDARD_PCT: 0.02
      STANDARD_MULTIPLIER: 1.0
      PENALTY_MULTIPLIER: 2.5
    precision: "imbalance_pct 6 decimal places; currency 2 decimal places, round_half_up"

  - name: shipper_exposure
    trigger: "on POST /pipeline/batch-tickets/{id}/inject (as a precondition and as a side effect), on deliver, on cancel, on settle and on invoice"
    algorithm: aggregation
    formula: |
      OPEN_TICKETS = BatchTickets t where
                       t.nomination.shipper_id == shipper.id
                   AND t.movement_status IN {INJECTED, DELIVERED}
                   AND t.cycle.status != SETTLED
      exposure_usd = sum(round(t.volume_bbl * t.nomination.pinned_tariff.base_rate_usd_per_bbl, 2)
                         for t in OPEN_TICKETS)
      # Credit gate on inject: exposure_usd + round(candidate.volume_bbl
      #   * candidate.nomination.pinned_tariff.base_rate_usd_per_bbl, 2) <= shipper.credit_limit_usd
    input_set: "tickets on cycles that are not yet SETTLED; settled cycles leave exposure and become receivables"
    constants: {}
    precision: "2 decimal places per ticket line, round_half_up, then summed"

  - name: shipper_notification_scope
    trigger: "on POST /pipeline/maintenance-events/{id}/notify"
    algorithm: aggregation
    formula: |
      AFFECTED_CYCLES = NominationCycle rows where
                          cycle.segment_id == event.segment_id
                      AND cycle.status IN {PRORATED, SCHEDULED, PUBLISHED, RESEQUENCING}
                      AND [cycle.ship_start_at, cycle.ship_end_at)
                          intersects [event.window_start, event.window_end]   # closed event window
      notified_shipper_count = count of DISTINCT nomination.shipper_id over nominations of those
                               cycles with status IN {PRORATED, SCHEDULED, REVISION_REQUESTED}
    input_set: "cycles in the four listed statuses only; OPEN, CLOSED and SETTLED cycles are never notified"
    constants: {}
    precision: "integer count"

  - name: terminal_bay_occupancy
    trigger: "on POST /pipeline/batch-tickets/{id}/reschedule-window"
    algorithm: interval_merge
    formula: |
      REQUESTED = [body injection_window_start, body injection_window_end)     # half-open
      PEERS = BatchTickets p where
                p.id != ticket.id
            AND p.nomination.origin_terminal_id == ticket.nomination.origin_terminal_id
            AND p.movement_status == PLANNED
            AND [p.injection_window_start, p.injection_window_end) intersects REQUESTED
      # Half-open arithmetic: p.end == REQUESTED.start (or p.start == REQUESTED.end) is NOT an overlap.
      occupancy = count(PEERS)
      if occupancy >= origin_terminal.injection_bays -> ERR_TERMINAL_BAY_CONFLICT (409)
    input_set: "PLANNED tickets at the same origin terminal across every cycle; INJECTED, DELIVERED and CANCELLED tickets free their bay"
    constants: {}
    precision: "integer count; instants compared at millisecond resolution"

  - name: volumetric_conservation
    trigger: "invariant asserted after every inject, deliver and batch cancellation"
    algorithm: aggregation
    formula: |
      SYSTEM_BBL(segment) = origin_terminal.inventory_bbl
                          + destination_terminal.inventory_bbl
                          + segment.in_transit_bbl
                          + segment.transmix_inventory_bbl
                          + segment.system_loss_bbl
      # POST /pipeline/batch-tickets/{id}/inject followed by
      # POST /pipeline/batch-tickets/{id}/cancel on the same ticket MUST leave SYSTEM_BBL(segment)
      # bit-identical: the cancel returns injected_bbl + transmix_bbl to the origin terminal and
      # unwinds in_transit_bbl and transmix_inventory_bbl by exactly the amounts the inject added.
      # Only POST /pipeline/terminals/{id}/inventory-adjustments may change SYSTEM_BBL.
    input_set: "the two Terminals referenced by the segment plus the segment's own three volume accumulators"
    constants: {}
    precision: "2 decimal places"

  - name: capacity_conservation
    trigger: "invariant asserted after every close, prorate, publish, withdraw, request-revision and derate cascade"
    algorithm: aggregation
    formula: |
      cycle.allocated_total_bbl + cycle.unallocated_capacity_bbl == cycle.effective_capacity_bbl
      # Interface transmix never consumes this identity: it is carved out up front by
      # segment.transmix_reserve_bbl inside calculations.effective_capacity.
      # A withdraw (or a request-revision) releases allocation into unallocated_capacity_bbl and
      # the identity must hold again after the re-proration cascade, with zero drift.
    input_set: "the cycle's own three computed volume fields"
    constants: {}
    precision: "whole barrels"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority; lowest number wins)
# ---------------------------------------------------------------------------
validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty, and X-User-Role is one of the four declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 20
    category: auth
    check: "the acting X-User-Role appears in the called endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 25
    category: auth
    check: "when X-User-Role == Shipper, X-User-ID must equal the Shipper.id that owns the target resource: nomination.shipper_id for nomination endpoints, batch_ticket.nomination.shipper_id for ticket reads, settlement.shipper_id for settlement reads, and the body shipper_id on POST /pipeline/nominations"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /pipeline/nominations, POST /pipeline/nominations/{id}/withdraw, POST /pipeline/nominations/{id}/resubmit, GET /pipeline/nominations/{id}, GET /pipeline/batch-tickets/{id}, GET /pipeline/settlements/{id}"

  - priority: 30
    category: existence
    check: "every id in the path exists, validated left-to-right, before any body reference is resolved"
    error_id: ERR_CYCLE_NOT_FOUND
    http_status: 404
    applies_to: "all /pipeline/cycles/{id}/* endpoints and GET /pipeline/cycles/{id}"

  - priority: 30
    category: existence
    check: "the Nomination named in the path exists"
    error_id: ERR_NOMINATION_NOT_FOUND
    http_status: 404
    applies_to: "all /pipeline/nominations/{id}/* endpoints and GET /pipeline/nominations/{id}"

  - priority: 30
    category: existence
    check: "the BatchTicket named in the path exists"
    error_id: ERR_BATCH_TICKET_NOT_FOUND
    http_status: 404
    applies_to: "all /pipeline/batch-tickets/{id}/* endpoints and GET /pipeline/batch-tickets/{id}"

  - priority: 30
    category: existence
    check: "the MaintenanceEvent named in the path exists"
    error_id: ERR_MAINTENANCE_EVENT_NOT_FOUND
    http_status: 404
    applies_to: "all /pipeline/maintenance-events/{id}/* endpoints and GET /pipeline/maintenance-events/{id}"

  - priority: 30
    category: existence
    check: "the ImbalanceSettlement named in the path exists"
    error_id: ERR_SETTLEMENT_NOT_FOUND
    http_status: 404
    applies_to: "all /pipeline/settlements/{id}/* endpoints and GET /pipeline/settlements/{id}"

  - priority: 30
    category: business_referential
    check: "every FK supplied in a request body resolves to an existing row (shipper_id, grade_id, segment_id, origin_terminal_id, destination_terminal_id, linefill_grade_id, cycle_id, nomination_id, supersedes_nomination_id, tariff_id, terminal_id)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "all POST endpoints that accept FK fields in the body"

  - priority: 35
    category: business_constraint
    check: "required body fields are present, enums are members of their declared sets, volumes and rates are > 0 where required, window_end > window_start, effective_to (when present) > effective_from, sequence_rank is 1..9, capacity_derate_pct is in [0, 1], and instants parse as ISO 8601 UTC"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 40
    category: state
    check: "POST /pipeline/nominations requires the target cycle in status OPEN"
    error_id: ERR_CYCLE_NOT_OPEN
    http_status: 409
    applies_to: "POST /pipeline/nominations"

  - priority: 40
    category: state
    check: "cycle lifecycle actions require the declared from-state: close requires OPEN; prorate requires CLOSED or RESEQUENCING; build-schedule requires PRORATED; publish-schedule requires SCHEDULED; settle requires PUBLISHED. This rule also carries the cycle-status guard on injection: POST /pipeline/batch-tickets/{id}/inject requires cycle.status PUBLISHED and returns ERR_CYCLE_INVALID_STATE (never ERR_TICKET_INVALID_STATE) when it is not"
    error_id: ERR_CYCLE_INVALID_STATE
    http_status: 409
    applies_to: "POST /pipeline/cycles/{id}/close, POST /pipeline/cycles/{id}/prorate, POST /pipeline/cycles/{id}/build-schedule, POST /pipeline/cycles/{id}/publish-schedule, POST /pipeline/cycles/{id}/settle, POST /pipeline/batch-tickets/{id}/inject"

  - priority: 40
    category: state
    check: "nomination actions require the declared from-state: withdraw requires SUBMITTED, ACCEPTED or PRORATED; request-revision requires PRORATED or SCHEDULED; resubmit requires REVISION_REQUESTED"
    error_id: ERR_NOMINATION_INVALID_STATE
    http_status: 409
    applies_to: "POST /pipeline/nominations/{id}/withdraw, POST /pipeline/nominations/{id}/request-revision, POST /pipeline/nominations/{id}/resubmit"

  - priority: 40
    category: state
    check: "ticket actions require the declared from-state: inject requires movement_status PLANNED and quality_status IN {PENDING, REJECTED} with retest_count < 2 (the cycle-status guard on inject belongs to ERR_CYCLE_INVALID_STATE above); deliver requires INJECTED; cancel requires PLANNED or INJECTED; reschedule-window requires PLANNED"
    error_id: ERR_TICKET_INVALID_STATE
    http_status: 409
    applies_to: "POST /pipeline/batch-tickets/{id}/inject, POST /pipeline/batch-tickets/{id}/deliver, POST /pipeline/batch-tickets/{id}/cancel, POST /pipeline/batch-tickets/{id}/reschedule-window"

  - priority: 40
    category: state
    check: "maintenance actions require the declared from-state: notify requires PLANNED; start requires NOTIFIED; complete requires ACTIVE"
    error_id: ERR_MAINTENANCE_INVALID_STATE
    http_status: 409
    applies_to: "POST /pipeline/maintenance-events/{id}/notify, POST /pipeline/maintenance-events/{id}/start, POST /pipeline/maintenance-events/{id}/complete"

  - priority: 40
    category: state
    check: "settlement actions require the declared from-state: certify requires DRAFT; invoice requires CERTIFIED"
    error_id: ERR_SETTLEMENT_INVALID_STATE
    http_status: 409
    applies_to: "POST /pipeline/settlements/{id}/certify, POST /pipeline/settlements/{id}/invoice"

  - priority: 40
    category: state
    check: "POST /pipeline/tariffs/{id}/activate requires the tariff in status DRAFT"
    error_id: ERR_TARIFF_INVALID_STATE
    http_status: 409
    applies_to: "POST /pipeline/tariffs/{id}/activate"

  - priority: 45
    category: state
    check: "expected_cycle_version in the body equals the current NominationCycle.version (§1.2.1 nomination-create-stale-cycle)"
    error_id: ERR_STALE_CYCLE_VERSION
    http_status: 412
    applies_to: "POST /pipeline/nominations"

  - priority: 45
    category: state
    check: "expected_terminal_version in the body equals the current Terminal.version (§1.2.1 inventory-adjust-stale-terminal)"
    error_id: ERR_STALE_TERMINAL_VERSION
    http_status: 412
    applies_to: "POST /pipeline/terminals/{id}/inventory-adjustments"

  - priority: 48
    category: business_referential
    check: "the nomination's origin_terminal_id equals segment.origin_terminal_id and its destination_terminal_id equals segment.destination_terminal_id for the segment of the target cycle"
    error_id: ERR_ROUTE_NOT_SERVED
    http_status: 422
    applies_to: "POST /pipeline/nominations, POST /pipeline/nominations/{id}/resubmit"

  - priority: 50
    category: business_referential
    check: "every SUBMITTED nomination in the closing cycle resolves a candidate under calculations.tariff_pinning; an empty candidate set refuses the whole close"
    error_id: ERR_NO_EFFECTIVE_TARIFF
    http_status: 422
    applies_to: "POST /pipeline/cycles/{id}/close"

  - priority: 52
    category: business_temporal
    check: "the logical clock is within [cycle.window_open_at, cycle.window_close_at) when a nomination is submitted or resubmitted"
    error_id: ERR_NOMINATION_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /pipeline/nominations, POST /pipeline/nominations/{id}/resubmit"

  - priority: 52
    category: business_temporal
    check: "cycle windows are ordered window_open_at < window_close_at <= ship_start_at < ship_end_at; a rescheduled injection window must stay inside [cycle.ship_start_at, cycle.ship_end_at]; a maintenance window must satisfy window_end > window_start"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /pipeline/cycles, POST /pipeline/batch-tickets/{id}/reschedule-window, POST /pipeline/maintenance-events"

  - priority: 52
    category: business_temporal
    check: "notification requires clock + 48h <= event.window_start (common carrier notice obligation)"
    error_id: ERR_INSUFFICIENT_NOTICE
    http_status: 422
    applies_to: "POST /pipeline/maintenance-events/{id}/notify"

  - priority: 55
    category: business_safety
    check: "measured_sulfur_ppm <= grade.max_sulfur_ppm AND measured_rvp_psi <= grade.max_rvp_psi at the injection point; product quality is enforced ahead of every commercial check"
    error_id: ERR_QUALITY_SPEC_VIOLATION
    http_status: 422
    applies_to: "POST /pipeline/batch-tickets/{id}/inject"

  - priority: 55
    category: business_safety
    check: "the user certifying a settlement (X-User-ID) must differ from the user who published the schedule of that cycle (cycle.schedule_published_by_user_id), and the user invoicing must differ from settlement.certified_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /pipeline/settlements/{id}/certify, POST /pipeline/settlements/{id}/invoice"

  - priority: 58
    category: business_constraint
    check: "a new maintenance window must not overlap, within a 24-hour buffer on each side, any existing MaintenanceEvent on the same segment whose status is PLANNED, NOTIFIED or ACTIVE; windows are compared closed-closed"
    error_id: ERR_MAINTENANCE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /pipeline/maintenance-events"

  - priority: 58
    category: business_constraint
    check: "the number of other PLANNED tickets whose half-open injection window overlaps the requested window at the same origin terminal must be strictly less than terminal.injection_bays"
    error_id: ERR_TERMINAL_BAY_CONFLICT
    http_status: 409
    applies_to: "POST /pipeline/batch-tickets/{id}/reschedule-window"

  - priority: 58
    category: business_constraint
    check: "the segment carrying the ticket must not have operational_status SHUT"
    error_id: ERR_SEGMENT_UNAVAILABLE
    http_status: 409
    applies_to: "POST /pipeline/batch-tickets/{id}/inject, POST /pipeline/batch-tickets/{id}/reschedule-window"

  - priority: 58
    category: business_constraint
    check: "withdrawal requires cycle.status IN {OPEN, CLOSED, PRORATED} — once a schedule has been built the nomination is locked; request-revision is refused once any BatchTicket of the nomination has left PLANNED (INJECTED or DELIVERED)"
    error_id: ERR_NOMINATION_LOCKED
    http_status: 409
    applies_to: "POST /pipeline/nominations/{id}/withdraw, POST /pipeline/nominations/{id}/request-revision"

  - priority: 58
    category: business_constraint
    check: "settlement requires every ticket of the cycle to have reached DELIVERED or CANCELLED; any PLANNED or INJECTED ticket blocks it"
    error_id: ERR_BATCHES_IN_TRANSIT
    http_status: 409
    applies_to: "POST /pipeline/cycles/{id}/settle"

  - priority: 60
    category: business_constraint
    check: "the acting or referenced Shipper must have status ACTIVE"
    error_id: ERR_SHIPPER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /pipeline/nominations, POST /pipeline/nominations/{id}/resubmit, POST /pipeline/batch-tickets/{id}/inject"

  - priority: 62
    category: business_constraint
    check: "nominated_bbl must be >= the tender_minimum_bbl of the tariff that would be pinned (common carrier tender minimum); at close, a SUBMITTED nomination below the minimum is rejected with rejection_reason BELOW_TENDER_MINIMUM instead of failing the close"
    error_id: ERR_TENDER_MINIMUM_NOT_MET
    http_status: 422
    applies_to: "POST /pipeline/nominations, POST /pipeline/nominations/{id}/resubmit"

  - priority: 63
    category: business_constraint
    check: "a resubmitted nomination's nominated_bbl must not exceed the nominated_bbl it had when revision was requested"
    error_id: ERR_REVISION_VOLUME_INCREASE
    http_status: 422
    applies_to: "POST /pipeline/nominations/{id}/resubmit"

  - priority: 64
    category: business_constraint
    check: "the sum of transmix_bbl over the cycle's non-cancelled tickets must not exceed segment.transmix_reserve_bbl"
    error_id: ERR_TRANSMIX_RESERVE_EXCEEDED
    http_status: 422
    applies_to: "POST /pipeline/cycles/{id}/build-schedule"

  - priority: 66
    category: business_constraint
    check: "origin_terminal.inventory_bbl - (body injected_bbl + ticket.transmix_bbl) must be >= origin_terminal.min_operating_inventory_bbl"
    error_id: ERR_INSUFFICIENT_ORIGIN_INVENTORY
    http_status: 422
    applies_to: "POST /pipeline/batch-tickets/{id}/inject"

  - priority: 66
    category: business_constraint
    check: "destination_terminal.inventory_bbl + delivered_bbl must not exceed destination_terminal.shell_capacity_bbl"
    error_id: ERR_DESTINATION_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /pipeline/batch-tickets/{id}/deliver"

  - priority: 66
    category: business_constraint
    check: "a segment whose linefill_bbl is below linefill_requirement_bbl cannot publish a schedule; linefill must be restored through a terminal inventory adjustment first"
    error_id: ERR_LINEFILL_REQUIREMENT_NOT_MET
    http_status: 422
    applies_to: "POST /pipeline/cycles/{id}/publish-schedule"

  - priority: 70
    category: business_fiscal
    check: "shipper.exposure_usd plus the injecting ticket's own line value must not exceed shipper.credit_limit_usd (fiscal checks run last, after quality)"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /pipeline/batch-tickets/{id}/inject"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # --- master data -----------------------------------------------------------
  - method: POST
    path: "/pipeline/terminals"
    description: "Register an origin, destination or dual-role tank terminal."
    roles: [TariffAdministrator]
    code: 201
    input: [terminal_code, name, role_kind, shell_capacity_bbl, min_operating_inventory_bbl, "injection_bays?"]
    output: Terminal
    side_effects: ["inventory_bbl initialised to 0", "injection_bays defaults to 1 when omitted", "version initialised to 1"]

  - method: POST
    path: "/pipeline/terminals/{id}/inventory-adjustments"
    description: "Book a physical inventory adjustment at a terminal (receipts from refinery, gauge corrections) or fund a segment's linefill. Repeatable, so it carries the Terminal OCC guard."
    roles: [TerminalOperator]
    code: 200
    input: [expected_terminal_version, adjustment_kind, adjustment_bbl, reason, "segment_id?"]
    output: Terminal
    side_effects:
      - "adjustment_kind INVENTORY adds adjustment_bbl to Terminal.inventory_bbl (negative values withdraw)"
      - "adjustment_kind LINEFILL requires segment_id and adds adjustment_bbl to PipelineSegment.linefill_bbl without touching Terminal.inventory_bbl"
      - "increments Terminal.version by 1"

  - method: POST
    path: "/pipeline/product-grades"
    description: "Define a refined product grade with its sequencing rank and quality specification ceilings."
    roles: [TariffAdministrator]
    code: 201
    input: [grade_code, name, sequence_rank, max_sulfur_ppm, max_rvp_psi, "is_transmix_grade?"]
    output: ProductGrade
    side_effects: ["is_transmix_grade defaults to false"]

  - method: POST
    path: "/pipeline/segments"
    description: "Define a pipeline segment between two terminals, including its cycle capacity, transmix reserve, linefill requirement and proration policy."
    roles: [TariffAdministrator]
    code: 201
    input: [segment_code, origin_terminal_id, destination_terminal_id, linefill_grade_id, capacity_bbl_per_cycle, transmix_reserve_bbl, transmix_cut_bbl, min_tender_bbl, linefill_requirement_bbl, proration_policy]
    output: PipelineSegment
    side_effects: ["operational_status initialised to OPERATIONAL and derate_pct to 0", "linefill_bbl, in_transit_bbl, transmix_inventory_bbl and system_loss_bbl initialised to 0"]

  - method: POST
    path: "/pipeline/segments/{id}/proration-policy"
    description: "Change the segment's proration methodology, as a tariff filing would. Applies to every subsequent prorate call and never rewrites an already-prorated cycle."
    roles: [TariffAdministrator]
    code: 200
    input: [proration_policy]
    output: PipelineSegment
    side_effects: ["proration_policy replaced", "already-PRORATED cycles keep the allocations produced under the previous policy"]

  - method: POST
    path: "/pipeline/shippers"
    description: "Enrol a shipper on the common carrier system with a credit limit."
    roles: [TariffAdministrator]
    code: 201
    input: [shipper_code, name, credit_limit_usd]
    output: Shipper
    side_effects: ["status initialised to ACTIVE", "exposure_usd initialised to 0.00"]

  - method: POST
    path: "/pipeline/shippers/{id}/suspend"
    description: "Suspend a shipper for credit or compliance reasons; suspended shippers cannot nominate or inject."
    roles: [TariffAdministrator]
    code: 200
    input: [suspended_reason]
    output: Shipper
    side_effects: ["status set to SUSPENDED", "suspended_reason stored"]

  - method: POST
    path: "/pipeline/shipping-history"
    description: "Record a completed historical movement used as the proration base; PROVISIONAL rows are excluded from history weighting."
    roles: [TariffAdministrator]
    code: 201
    input: [shipper_id, segment_id, cycle_code, actual_shipped_bbl, cycle_end_at, record_status]
    output: ShippingHistoryRecord
    side_effects: ["immutable row: no update endpoint and no version field"]

  - method: POST
    path: "/pipeline/tariffs"
    description: "Draft a tariff for a segment/grade pair with its tier breaks, tender minimum and imbalance penalty rate."
    roles: [TariffAdministrator]
    code: 201
    input: [segment_id, grade_id, base_rate_usd_per_bbl, tier1_min_bbl, tier1_rate_usd_per_bbl, tier2_min_bbl, tier2_rate_usd_per_bbl, tender_minimum_bbl, imbalance_penalty_rate_usd_per_bbl, effective_from, "effective_to?"]
    output: Tariff
    side_effects: ["status initialised to DRAFT; a DRAFT tariff is never a pinning candidate"]

  - method: POST
    path: "/pipeline/tariffs/{id}/activate"
    description: "Publish a drafted tariff, making it a pinning candidate and superseding any older overlapping EFFECTIVE tariff for the same segment and grade."
    roles: [TariffAdministrator]
    code: 200
    input: []
    output: Tariff
    side_effects: ["status set to EFFECTIVE", "any older overlapping EFFECTIVE tariff for the same segment_id + grade_id is set to SUPERSEDED"]

  # --- nomination cycle lifecycle -------------------------------------------
  - method: POST
    path: "/pipeline/cycles"
    description: "Open a nomination cycle on a segment with its nomination window and its shipping window."
    roles: [PipelineScheduler]
    code: 201
    input: [cycle_code, segment_id, window_open_at, window_close_at, ship_start_at, ship_end_at]
    output: NominationCycle
    side_effects: ["status initialised to OPEN", "schedule_version initialised to 0", "nominated_total_bbl, allocated_total_bbl, unallocated_capacity_bbl and total_transmix_bbl initialised to 0", "proration_factor initialised to null", "version initialised to 1"]

  - method: POST
    path: "/pipeline/cycles/{id}/close"
    description: "Close the nomination window: pin a tariff to every SUBMITTED nomination, reject those below their tender minimum, and compute the cycle's effective capacity."
    roles: [PipelineScheduler]
    code: 200
    input: []
    output: NominationCycle
    side_effects:
      - "each SUBMITTED nomination is pinned per calculations.tariff_pinning and moves to ACCEPTED, or to REJECTED with rejection_reason BELOW_TENDER_MINIMUM"
      - "effective_capacity_bbl and derate_pct_applied set per calculations.effective_capacity"
      - "history_base_bbl and allocation_class set on each ACCEPTED nomination per calculations.shipper_history_base"
      - "nominated_total_bbl recomputed over ACCEPTED nominations"
      - "status set to CLOSED"

  - method: POST
    path: "/pipeline/cycles/{id}/prorate"
    description: "Prorate the cycle's nominations against effective capacity using the segment's proration policy, then reject any allocation that falls below its tender minimum."
    roles: [PipelineScheduler]
    code: 200
    input: []
    output: NominationCycle
    side_effects:
      - "allocated_bbl written on every nomination per calculations.capacity_proration"
      - "proration_factor, allocated_total_bbl and unallocated_capacity_bbl written per calculations.capacity_proration"
      - "nominations whose allocated_bbl falls below their pinned tender_minimum_bbl move to REJECTED with rejection_reason BELOW_TENDER_AFTER_PRORATION and their allocation returns to unallocated_capacity_bbl"
      - "surviving nominations move to PRORATED"
      - "status set to PRORATED"

  - method: POST
    path: "/pipeline/cycles/{id}/build-schedule"
    description: "Sequence the prorated nominations into batch tickets, computing interface transmix cuts against the upstream grade."
    roles: [PipelineScheduler]
    code: 200
    input: []
    output: NominationCycle
    side_effects:
      - "one BatchTicket per PRORATED nomination with allocated_bbl > 0, ordered per calculations.batch_sequencing"
      - "transmix_bbl and requires_flush written per calculations.interface_transmix; total_transmix_bbl aggregated on the cycle"
      - "predecessor_batch_id and injection windows written per calculations.batch_sequencing"
      - "schedule_version incremented by 1"
      - "status set to SCHEDULED"

  - method: POST
    path: "/pipeline/cycles/{id}/publish-schedule"
    description: "Publish the built schedule to shippers; requires linefill to be at requirement."
    roles: [PipelineScheduler]
    code: 200
    input: []
    output: NominationCycle
    side_effects: ["status set to PUBLISHED", "schedule_published_at set to the logical clock and schedule_published_by_user_id set to X-User-ID", "each PRORATED nomination moves to SCHEDULED"]

  - method: POST
    path: "/pipeline/cycles/{id}/settle"
    description: "Settle the cycle: allocate system loss, compute tariff and imbalance charges on the requested basis, and raise one DRAFT settlement per billed shipper."
    roles: [PipelineScheduler]
    code: 200
    input: [basis_mode]
    output: NominationCycle
    side_effects:
      - "one ImbalanceSettlement (DRAFT) per billed shipper with charges per calculations.loss_allocation, calculations.tariff_charge and calculations.imbalance_charge"
      - "segment.system_loss_bbl reconciled and each SCHEDULED nomination moved to COMPLETED"
      - "settled_at set to the logical clock and status set to SETTLED"
      - "Shipper.exposure_usd recomputed per calculations.shipper_exposure"

  # --- nominations -----------------------------------------------------------
  - method: POST
    path: "/pipeline/nominations"
    description: "Submit a nomination into an OPEN cycle. Carries the NominationCycle OCC guard because a submission may supersede an earlier nomination the client read moments ago."
    roles: [Shipper]
    code: 201
    input: [cycle_id, shipper_id, grade_id, origin_terminal_id, destination_terminal_id, nominated_bbl, expected_cycle_version, "supersedes_nomination_id?"]
    output: Nomination
    side_effects:
      - "status initialised to SUBMITTED and revision_count to 0"
      - "when supersedes_nomination_id is supplied the referenced nomination moves to SUPERSEDED"
      - "increments NominationCycle.version by 1"

  - method: POST
    path: "/pipeline/nominations/{id}/withdraw"
    description: "Withdraw a nomination; after proration this releases its allocation and re-prorates the cycle."
    roles: [Shipper]
    code: 200
    input: []
    output: Nomination
    side_effects: ["status set to WITHDRAWN and allocated_bbl set to 0", "when the cycle is PRORATED the cycle is re-prorated per calculations.capacity_proration and capacity_conservation is re-established", "refused with ERR_NOMINATION_LOCKED once cycle.status has reached SCHEDULED, so a withdrawal never invalidates a built schedule"]

  - method: POST
    path: "/pipeline/nominations/{id}/request-revision"
    description: "Send a nomination back to its shipper for revision, e.g. after a maintenance derate or a quality failure."
    roles: [PipelineScheduler]
    code: 200
    input: []
    output: Nomination
    side_effects: ["status set to REVISION_REQUESTED and allocated_bbl set to 0", "revision_count incremented by 1", "cycle allocated_total_bbl and unallocated_capacity_bbl recomputed"]

  - method: POST
    path: "/pipeline/nominations/{id}/resubmit"
    description: "Resubmit a revised nomination at a volume no larger than the original."
    roles: [Shipper]
    code: 200
    input: [nominated_bbl]
    output: Nomination
    side_effects: ["nominated_bbl replaced", "status set back to SUBMITTED"]

  # --- batch tickets ---------------------------------------------------------
  - method: POST
    path: "/pipeline/batch-tickets/{id}/inject"
    description: "Inject a batch at the origin terminal with its measured quality; off-spec measurements are rejected at the injection point."
    roles: [TerminalOperator]
    code: 200
    input: [measured_sulfur_ppm, measured_rvp_psi, injected_bbl]
    output: BatchTicket
    side_effects:
      - "on-spec: quality_status PASSED, movement_status INJECTED, injected_bbl stored, origin inventory reduced by injected_bbl + transmix_bbl, segment.in_transit_bbl and segment.transmix_inventory_bbl increased"
      - "off-spec: quality_status REJECTED and retest_count incremented; the movement dimension stays PLANNED on the first rejection and the ticket is CANCELLED on the second"
      - "Shipper.exposure_usd recomputed per calculations.shipper_exposure"

  - method: POST
    path: "/pipeline/batch-tickets/{id}/deliver"
    description: "Deliver a batch into the destination terminal, booking the volumetric difference as system loss."
    roles: [TerminalOperator]
    code: 200
    input: [delivered_bbl]
    output: BatchTicket
    side_effects: ["movement_status set to DELIVERED and delivered_bbl stored", "destination inventory increased by delivered_bbl, segment.in_transit_bbl reduced by injected_bbl, segment.system_loss_bbl increased by injected_bbl - delivered_bbl", "volumetric_conservation re-asserted"]

  - method: POST
    path: "/pipeline/batch-tickets/{id}/cancel"
    description: "Cancel a planned or in-transit batch, compensating every volumetric side effect the injection applied."
    roles: [PipelineScheduler, TerminalOperator]
    code: 200
    input: [cancel_reason]
    output: BatchTicket
    side_effects: ["movement_status set to CANCELLED and cancel_reason stored", "an INJECTED ticket returns injected_bbl + transmix_bbl to the origin terminal and unwinds in_transit_bbl and transmix_inventory_bbl exactly", "cycle.total_transmix_bbl and Shipper.exposure_usd recomputed"]

  - method: POST
    path: "/pipeline/batch-tickets/{id}/reschedule-window"
    description: "Move a planned batch's injection window, subject to origin terminal bay capacity."
    roles: [PipelineScheduler]
    code: 200
    input: [injection_window_start, injection_window_end]
    output: BatchTicket
    side_effects: ["injection_window_start and injection_window_end replaced after the bay occupancy check in calculations.terminal_bay_occupancy"]

  # --- maintenance -----------------------------------------------------------
  - method: POST
    path: "/pipeline/maintenance-events"
    description: "Plan pigging, integrity or repair work on a segment with the capacity derate it will impose."
    roles: [PipelineScheduler]
    code: 201
    input: [segment_id, kind, window_start, window_end, capacity_derate_pct, "notes?"]
    output: MaintenanceEvent
    side_effects: ["status initialised to PLANNED; a PLANNED event does not yet derate the segment", "notified_shipper_count initialised to 0"]

  - method: POST
    path: "/pipeline/maintenance-events/{id}/notify"
    description: "Issue the common carrier notice for planned work; requires at least 48 hours of notice and cascades the capacity derate into affected cycles."
    roles: [PipelineScheduler]
    code: 200
    input: []
    output: MaintenanceEvent
    side_effects:
      - "status set to NOTIFIED, notified_at set to the logical clock"
      - "notified_shipper_count set per calculations.shipper_notification_scope"
      - "segment.derate_pct and operational_status recomputed; a derate_pct of 1.0 sets operational_status SHUT, otherwise DERATED"
      - "affected PUBLISHED cycles whose recomputed effective capacity falls below their allocated total move to RESEQUENCING, their over-allocated nominations move to REVISION_REQUESTED at the reduced allocation, and those nominations' PLANNED tickets are CANCELLED"

  - method: POST
    path: "/pipeline/maintenance-events/{id}/start"
    description: "Begin notified work."
    roles: [PipelineScheduler]
    code: 200
    input: []
    output: MaintenanceEvent
    side_effects: ["status set to ACTIVE; the derate stays in force"]

  - method: POST
    path: "/pipeline/maintenance-events/{id}/complete"
    description: "Complete work and restore the segment's capacity."
    roles: [PipelineScheduler]
    code: 200
    input: []
    output: MaintenanceEvent
    side_effects: ["status set to COMPLETED", "segment.derate_pct and operational_status recomputed over the remaining NOTIFIED/ACTIVE events"]

  # --- settlement ------------------------------------------------------------
  - method: POST
    path: "/pipeline/settlements/{id}/certify"
    description: "Certify a draft settlement; the certifier must not be the user who published the cycle's schedule."
    roles: [PipelineScheduler]
    code: 200
    input: []
    output: ImbalanceSettlement
    side_effects: ["status set to CERTIFIED", "certified_by_user_id set to X-User-ID"]

  - method: POST
    path: "/pipeline/settlements/{id}/invoice"
    description: "Invoice a certified settlement; the invoicing user must not be the certifier."
    roles: [TariffAdministrator]
    code: 200
    input: [invoice_number]
    output: ImbalanceSettlement
    side_effects: ["status set to INVOICED and invoice_number stored", "Shipper.exposure_usd recomputed"]

  # --- test-driving endpoint -------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock, which every window, notice and expiry rule reads. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [PipelineScheduler, TariffAdministrator, TerminalOperator, Shipper]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["the logical clock is set to current_utc; no entity is mutated"]

  # --- reads: single resource ------------------------------------------------
  - method: GET
    path: "/pipeline/terminals/{id}"
    description: "Read a terminal with its current inventory and version."
    roles: [PipelineScheduler, TariffAdministrator, TerminalOperator]
    code: 200
    input: []
    output: Terminal
    side_effects: []

  - method: GET
    path: "/pipeline/product-grades/{id}"
    description: "Read a product grade with its sequencing rank and specification ceilings."
    roles: [PipelineScheduler, TariffAdministrator, TerminalOperator, Shipper]
    code: 200
    input: []
    output: ProductGrade
    side_effects: []

  - method: GET
    path: "/pipeline/segments/{id}"
    description: "Read a segment with its derate, linefill, in-transit, transmix and system-loss accumulators."
    roles: [PipelineScheduler, TariffAdministrator, TerminalOperator, Shipper]
    code: 200
    input: []
    output: PipelineSegment
    side_effects: []

  - method: GET
    path: "/pipeline/shippers/{id}"
    description: "Read a shipper with its credit limit and current exposure."
    roles: [PipelineScheduler, TariffAdministrator, TerminalOperator]
    code: 200
    input: []
    output: Shipper
    side_effects: []

  - method: GET
    path: "/pipeline/shipping-history/{id}"
    description: "Read one historical movement record."
    roles: [PipelineScheduler, TariffAdministrator]
    code: 200
    input: []
    output: ShippingHistoryRecord
    side_effects: []

  - method: GET
    path: "/pipeline/tariffs/{id}"
    description: "Read a tariff with its tiers, tender minimum and status."
    roles: [PipelineScheduler, TariffAdministrator, Shipper]
    code: 200
    input: []
    output: Tariff
    side_effects: []

  - method: GET
    path: "/pipeline/cycles/{id}"
    description: "Read a nomination cycle with its capacity, proration factor, schedule version and current version (the OCC token for nomination submission)."
    roles: [PipelineScheduler, TariffAdministrator, TerminalOperator, Shipper]
    code: 200
    input: []
    output: NominationCycle
    side_effects: []

  - method: GET
    path: "/pipeline/nominations/{id}"
    description: "Read a nomination with its allocation, history base, pinned tariff and status."
    roles: [PipelineScheduler, TariffAdministrator, TerminalOperator, Shipper]
    code: 200
    input: []
    output: Nomination
    side_effects: []

  - method: GET
    path: "/pipeline/batch-tickets/{id}"
    description: "Read a batch ticket with its sequence position, transmix cut, movement and quality dimensions."
    roles: [PipelineScheduler, TariffAdministrator, TerminalOperator, Shipper]
    code: 200
    input: []
    output: BatchTicket
    side_effects: []

  - method: GET
    path: "/pipeline/maintenance-events/{id}"
    description: "Read a maintenance event with its window, derate and notification counters."
    roles: [PipelineScheduler, TariffAdministrator, TerminalOperator, Shipper]
    code: 200
    input: []
    output: MaintenanceEvent
    side_effects: []

  - method: GET
    path: "/pipeline/settlements/{id}"
    description: "Read a settlement with its basis, loss allocation, imbalance tier and billed totals."
    roles: [PipelineScheduler, TariffAdministrator, Shipper]
    code: 200
    input: []
    output: ImbalanceSettlement
    side_effects: []

  # --- reads: filtered lists (also the FK reverse-reachability channel) ------
  - method: GET
    path: "/pipeline/terminals"
    description: "List terminals, optionally by role kind. Default sort terminal_code ASC."
    roles: [PipelineScheduler, TariffAdministrator, TerminalOperator]
    code: 200
    input: ["role_kind?", "limit?", "offset?"]
    output: Terminal[]
    side_effects: []

  - method: GET
    path: "/pipeline/product-grades"
    description: "List product grades. Default sort sequence_rank ASC."
    roles: [PipelineScheduler, TariffAdministrator, TerminalOperator, Shipper]
    code: 200
    input: ["is_transmix_grade?", "limit?", "offset?"]
    output: ProductGrade[]
    side_effects: []

  - method: GET
    path: "/pipeline/segments"
    description: "List segments, optionally by origin terminal, destination terminal, linefill grade or operational status. Default sort segment_code ASC."
    roles: [PipelineScheduler, TariffAdministrator, TerminalOperator, Shipper]
    code: 200
    input: ["origin_terminal_id?", "destination_terminal_id?", "linefill_grade_id?", "operational_status?", "limit?", "offset?"]
    output: PipelineSegment[]
    side_effects: []

  - method: GET
    path: "/pipeline/shippers"
    description: "List shippers, optionally by status. Default sort shipper_code ASC."
    roles: [PipelineScheduler, TariffAdministrator, TerminalOperator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Shipper[]
    side_effects: []

  - method: GET
    path: "/pipeline/shipping-history"
    description: "List historical movement records, optionally by shipper, segment or record status. Default sort cycle_end_at ASC, then created_at ASC."
    roles: [PipelineScheduler, TariffAdministrator]
    code: 200
    input: ["shipper_id?", "segment_id?", "record_status?", "limit?", "offset?"]
    output: ShippingHistoryRecord[]
    side_effects: []

  - method: GET
    path: "/pipeline/tariffs"
    description: "List tariffs, optionally by segment, grade or status. Default sort effective_from DESC, then created_at DESC."
    roles: [PipelineScheduler, TariffAdministrator, Shipper]
    code: 200
    input: ["segment_id?", "grade_id?", "status?", "limit?", "offset?"]
    output: Tariff[]
    side_effects: []

  - method: GET
    path: "/pipeline/cycles"
    description: "List nomination cycles, optionally by segment or status. Default sort window_open_at ASC, then created_at ASC."
    roles: [PipelineScheduler, TariffAdministrator, TerminalOperator, Shipper]
    code: 200
    input: ["segment_id?", "status?", "limit?", "offset?"]
    output: NominationCycle[]
    side_effects: []

  - method: GET
    path: "/pipeline/nominations"
    description: "List nominations, optionally by cycle, shipper, grade, origin terminal, destination terminal, superseded nomination, pinned tariff or status. Default sort created_at ASC."
    roles: [PipelineScheduler, TariffAdministrator, TerminalOperator]
    code: 200
    input: ["cycle_id?", "shipper_id?", "grade_id?", "origin_terminal_id?", "destination_terminal_id?", "supersedes_nomination_id?", "pinned_tariff_id?", "status?", "limit?", "offset?"]
    output: Nomination[]
    side_effects: []

  - method: GET
    path: "/pipeline/batch-tickets"
    description: "List batch tickets, optionally by cycle, nomination, predecessor, movement status or quality status. Default sort sequence_position ASC, then created_at ASC."
    roles: [PipelineScheduler, TariffAdministrator, TerminalOperator]
    code: 200
    input: ["cycle_id?", "nomination_id?", "predecessor_batch_id?", "movement_status?", "quality_status?", "limit?", "offset?"]
    output: BatchTicket[]
    side_effects: []

  - method: GET
    path: "/pipeline/maintenance-events"
    description: "List maintenance events, optionally by segment or status. Default sort window_start ASC, then created_at ASC."
    roles: [PipelineScheduler, TariffAdministrator, TerminalOperator, Shipper]
    code: 200
    input: ["segment_id?", "status?", "limit?", "offset?"]
    output: MaintenanceEvent[]
    side_effects: []

  - method: GET
    path: "/pipeline/settlements"
    description: "List settlements, optionally by cycle, shipper or status. Default sort Shipper.created_at ASC, then created_at ASC."
    roles: [PipelineScheduler, TariffAdministrator]
    code: 200
    input: ["cycle_id?", "shipper_id?", "status?", "limit?", "offset?"]
    output: ImbalanceSettlement[]
    side_effects: []

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or X-User-Role not one of the four declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the acting role is not listed in the called endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "role Shipper acting on a nomination, ticket or settlement whose shipper_id differs from X-User-ID"
  - id: ERR_CYCLE_NOT_FOUND
    http: 404
    condition: "no NominationCycle exists with the path id"
  - id: ERR_NOMINATION_NOT_FOUND
    http: 404
    condition: "no Nomination exists with the path id"
  - id: ERR_BATCH_TICKET_NOT_FOUND
    http: 404
    condition: "no BatchTicket exists with the path id"
  - id: ERR_MAINTENANCE_EVENT_NOT_FOUND
    http: 404
    condition: "no MaintenanceEvent exists with the path id"
  - id: ERR_SETTLEMENT_NOT_FOUND
    http: 404
    condition: "no ImbalanceSettlement exists with the path id"
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "a foreign key supplied in the request body does not resolve to an existing row"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required body field is missing, an enum value is outside its declared set, a volume or rate is non-positive where positivity is required, an instant fails to parse, or window_end is not after window_start"
  - id: ERR_CYCLE_NOT_OPEN
    http: 409
    condition: "a nomination is submitted into a cycle whose status is not OPEN"
  - id: ERR_CYCLE_INVALID_STATE
    http: 409
    condition: "a cycle lifecycle action is called from a status the transition does not allow, or a batch is injected before its cycle has been published"
  - id: ERR_NOMINATION_INVALID_STATE
    http: 409
    condition: "withdraw, request-revision or resubmit is called from a nomination status the transition does not allow"
  - id: ERR_TICKET_INVALID_STATE
    http: 409
    condition: "inject, deliver, cancel or reschedule-window is called from a movement or quality status the transition does not allow"
  - id: ERR_MAINTENANCE_INVALID_STATE
    http: 409
    condition: "notify, start or complete is called from a maintenance status the transition does not allow"
  - id: ERR_SETTLEMENT_INVALID_STATE
    http: 409
    condition: "certify is called on a non-DRAFT settlement or invoice on a non-CERTIFIED settlement"
  - id: ERR_TARIFF_INVALID_STATE
    http: 409
    condition: "activate is called on a tariff that is not DRAFT"
  - id: ERR_STALE_CYCLE_VERSION
    http: 412
    condition: "expected_cycle_version does not equal the target NominationCycle's current version"
  - id: ERR_STALE_TERMINAL_VERSION
    http: 412
    condition: "expected_terminal_version does not equal the target Terminal's current version"
  - id: ERR_ROUTE_NOT_SERVED
    http: 422
    condition: "the nominated origin/destination pair does not match the cycle's segment endpoints"
  - id: ERR_NO_EFFECTIVE_TARIFF
    http: 422
    condition: "closing a cycle finds no EFFECTIVE tariff covering window_close_at for some nomination's segment and grade"
  - id: ERR_NOMINATION_WINDOW_CLOSED
    http: 422
    condition: "the logical clock is outside [window_open_at, window_close_at) at submission or resubmission"
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "cycle windows are out of order, or a rescheduled injection window falls outside the cycle's shipping window"
  - id: ERR_INSUFFICIENT_NOTICE
    http: 422
    condition: "maintenance notification is issued fewer than 48 hours before window_start"
  - id: ERR_QUALITY_SPEC_VIOLATION
    http: 422
    condition: "measured sulfur or RVP at injection exceeds the grade's specification ceiling"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the certifying user published the cycle's schedule, or the invoicing user certified the settlement"
  - id: ERR_MAINTENANCE_WINDOW_CONFLICT
    http: 409
    condition: "a planned maintenance window overlaps an existing PLANNED, NOTIFIED or ACTIVE window on the same segment within the 24-hour buffer"
  - id: ERR_TERMINAL_BAY_CONFLICT
    http: 409
    condition: "the requested injection window would put more overlapping PLANNED tickets on an origin terminal than it has injection bays"
  - id: ERR_SEGMENT_UNAVAILABLE
    http: 409
    condition: "the ticket's segment has operational_status SHUT"
  - id: ERR_NOMINATION_LOCKED
    http: 409
    condition: "withdraw or request-revision is attempted after the nomination's batch has been injected or delivered"
  - id: ERR_BATCHES_IN_TRANSIT
    http: 409
    condition: "settlement is attempted while any ticket of the cycle is still PLANNED or INJECTED"
  - id: ERR_SHIPPER_NOT_ACTIVE
    http: 409
    condition: "the acting or referenced Shipper has status SUSPENDED"
  - id: ERR_TENDER_MINIMUM_NOT_MET
    http: 422
    condition: "nominated_bbl is below the tender minimum of the tariff that would be pinned"
  - id: ERR_REVISION_VOLUME_INCREASE
    http: 422
    condition: "a resubmitted nomination asks for more barrels than it held when revision was requested"
  - id: ERR_TRANSMIX_RESERVE_EXCEEDED
    http: 422
    condition: "the schedule's total interface transmix would exceed the segment's transmix reserve"
  - id: ERR_INSUFFICIENT_ORIGIN_INVENTORY
    http: 422
    condition: "injecting would take the origin terminal below its minimum operating inventory"
  - id: ERR_DESTINATION_CAPACITY_EXCEEDED
    http: 422
    condition: "delivering would take the destination terminal above its shell capacity"
  - id: ERR_LINEFILL_REQUIREMENT_NOT_MET
    http: 422
    condition: "publishing a schedule while the segment's linefill is below its requirement"
  - id: ERR_CREDIT_LIMIT_EXCEEDED
    http: 402
    condition: "injecting would push the shipper's exposure above its credit limit"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: Shipper
    description: "A common carrier customer that nominates volume, revises it when asked, and reads its own nominations, tickets and settlements."
    identity: "entity_backed:Shipper"
    exclusive_operations:
      - "POST /pipeline/nominations"
      - "POST /pipeline/nominations/{id}/withdraw"
      - "POST /pipeline/nominations/{id}/resubmit"
    shared_operations:
      - "GET /pipeline/nominations/{id} (own only)"
      - "GET /pipeline/batch-tickets/{id} (own only)"
      - "GET /pipeline/settlements/{id} (own only)"
      - "GET /pipeline/cycles/{id}, GET /pipeline/cycles"
      - "GET /pipeline/segments/{id}, GET /pipeline/segments"
      - "GET /pipeline/product-grades/{id}, GET /pipeline/product-grades"
      - "GET /pipeline/tariffs/{id}, GET /pipeline/tariffs"
      - "GET /pipeline/maintenance-events/{id}, GET /pipeline/maintenance-events"
      - "POST /_clock/set_current_utc"

  - name: PipelineScheduler
    description: "Carrier scheduler that runs the cycle lifecycle, prorates capacity, sequences batches, plans maintenance and certifies settlements."
    identity: "opaque"
    exclusive_operations:
      - "POST /pipeline/cycles"
      - "POST /pipeline/cycles/{id}/close"
      - "POST /pipeline/cycles/{id}/prorate"
      - "POST /pipeline/cycles/{id}/build-schedule"
      - "POST /pipeline/cycles/{id}/publish-schedule"
      - "POST /pipeline/cycles/{id}/settle"
      - "POST /pipeline/nominations/{id}/request-revision"
      - "POST /pipeline/batch-tickets/{id}/reschedule-window"
      - "POST /pipeline/maintenance-events"
      - "POST /pipeline/maintenance-events/{id}/notify"
      - "POST /pipeline/maintenance-events/{id}/start"
      - "POST /pipeline/maintenance-events/{id}/complete"
      - "POST /pipeline/settlements/{id}/certify"
    shared_operations:
      - "POST /pipeline/batch-tickets/{id}/cancel (with TerminalOperator)"
      - "every GET under /pipeline"
      - "POST /_clock/set_current_utc"

  - name: TerminalOperator
    description: "Terminal-side operator that books inventory adjustments and executes injections and deliveries with measured quality and volumes."
    identity: "opaque"
    exclusive_operations:
      - "POST /pipeline/terminals/{id}/inventory-adjustments"
      - "POST /pipeline/batch-tickets/{id}/inject"
      - "POST /pipeline/batch-tickets/{id}/deliver"
    shared_operations:
      - "POST /pipeline/batch-tickets/{id}/cancel (with PipelineScheduler)"
      - "GET /pipeline/terminals/{id}, GET /pipeline/terminals"
      - "GET /pipeline/segments, GET /pipeline/cycles, GET /pipeline/nominations, GET /pipeline/batch-tickets, GET /pipeline/maintenance-events and their single-resource forms"
      - "POST /_clock/set_current_utc"

  - name: TariffAdministrator
    description: "Commercial administrator that maintains master data, shipper credit, the tariff catalogue and invoicing. Segregation of duties keeps invoicing away from the certifier."
    identity: "opaque"
    exclusive_operations:
      - "POST /pipeline/terminals"
      - "POST /pipeline/product-grades"
      - "POST /pipeline/segments"
      - "POST /pipeline/segments/{id}/proration-policy"
      - "POST /pipeline/shippers"
      - "POST /pipeline/shippers/{id}/suspend"
      - "POST /pipeline/shipping-history"
      - "POST /pipeline/tariffs"
      - "POST /pipeline/tariffs/{id}/activate"
      - "POST /pipeline/settlements/{id}/invoice"
    shared_operations:
      - "every GET under /pipeline"
      - "POST /_clock/set_current_utc"
