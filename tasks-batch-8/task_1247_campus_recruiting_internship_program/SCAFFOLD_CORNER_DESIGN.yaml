# =============================================================================
# Task 1247: Campus Recruiting & Internship Program — §1.9 Corner Design
# Breadth coverage of every §1.1–§1.7 claim not already covered by §1.8.
# Sections follow the claim-extraction-guide taxonomy.
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  # Entities: creation, defaults, required fields, system fields, enums,
  # not-found, immutability, computed cross-entity fields, pagination
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: season_create_defaults_and_initial_state
        claim_type: defaults
        grounds: [entities.RecruitingSeason]
        distinguishing_aspect: "Omitting exploding_offer_hours_default, deadline_policy_mode and max_extension_hours applies the declared defaults 72 / WALL_CLOCK / 72; new season starts DRAFT at version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /campus-recruiting/seasons"
              payload: { name: "S1", application_open_at: "2026-05-10T00:00:00Z", application_close_at: "2026-05-20T00:00:00Z", interview_window_start_at: "2026-06-01T00:00:00Z", interview_window_end_at: "2026-06-30T23:59:59Z", offer_window_open_at: "2026-07-01T00:00:00Z", offer_window_close_at: "2026-07-31T23:59:59Z", shortlist_score_threshold: 50, stipend_budget_cents: 1000000 }
              as: RecruitingAdmin
              captures: { sid: $.data.id, st: $.data.status, v: $.data.version, eh: $.data.exploding_offer_hours_default, mode: $.data.deadline_policy_mode, meh: $.data.max_extension_hours }
          trigger: []
          assert:
            - "${st} == DRAFT and ${v} == 1"
            - "${eh} == 72 and ${mode} == WALL_CLOCK and ${meh} == 72"
            - "RecruitingSeason.${sid}.stipend_reserved_cents == 0 and stipend_disbursed_cents == 0 and applications_total_count == 0"
      - name: season_create_missing_required_field
        claim_type: required_fields
        grounds: [entities.RecruitingSeason, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting required field name yields ERR_VALIDATION 400 (priority 5 shape check)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /campus-recruiting/seasons"
              payload: { application_open_at: "2026-05-10T00:00:00Z", application_close_at: "2026-05-20T00:00:00Z", interview_window_start_at: "2026-06-01T00:00:00Z", interview_window_end_at: "2026-06-30T23:59:59Z", offer_window_open_at: "2026-07-01T00:00:00Z", offer_window_close_at: "2026-07-31T23:59:59Z", shortlist_score_threshold: 50, stipend_budget_cents: 1000000 }
              as: RecruitingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_VALIDATION"
      - name: candidate_create_extra_field_input_ignored
        claim_type: system_fields
        grounds: [entities.Candidate]
        distinguishing_aspect: "Client-supplied id/version/created_at are ignored; the server mints its own UUID id and version does not exist in the input contract."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /campus-recruiting/candidates"
              payload: { email: "a@x.com", full_name: "Candidate A", expected_graduation_date: "2027-05-15T00:00:00Z", id: "11111111-1111-4111-8111-111111111111", version: 99 }
              as: Anonymous
              captures: { cand_id: $.data.id, v: $.data.version }
          assert:
            - "${cand_id} != 11111111-1111-4111-8111-111111111111 (server-minted id)"
            - "${v} == 1 (client-supplied 99 ignored)"
      - name: offer_get_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Offer, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but nonexistent offer id yields ERR_NOT_FOUND 404 (existence check, priority 4)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /campus-recruiting/offers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: Recruiter
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_NOT_FOUND"
      - name: school_target_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.SchoolTarget, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "tier outside {CORE, TARGET, EXPLORATORY} is rejected with ERR_VALIDATION 400."
        test_recipe:
          setup: ["season exists"]
          setup_api_calls:
            - call: "POST /campus-recruiting/seasons"
              payload: { name: "S1", application_open_at: "2026-05-10T00:00:00Z", application_close_at: "2026-05-20T00:00:00Z", interview_window_start_at: "2026-06-01T00:00:00Z", interview_window_end_at: "2026-06-30T23:59:59Z", offer_window_open_at: "2026-07-01T00:00:00Z", offer_window_close_at: "2026-07-31T23:59:59Z", shortlist_score_threshold: 50, stipend_budget_cents: 1000000 }
              as: RecruitingAdmin
              captures: { sid: $.data.id }
          trigger:
            - call: "POST /campus-recruiting/seasons/${sid}/school-targets"
              payload: { school_name: "StateU", tier: "IVY", application_cap: 10, stipend_region: "REGIONAL" }
              as: RecruitingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_VALIDATION"
      - name: intern_evaluation_immutability
        claim_type: immutability
        grounds: [entities.InternEvaluation]
        distinguishing_aspect: "InternEvaluation is common_fields:false — its GET representation carries id and created_at but no version or updated_at, and no update endpoint exists."
        test_recipe:
          setup:
            - "Season at INTERN_ACTIVE with one ACTIVE assignment (application accepted, project and mentor assigned)"
          setup_api_calls:
            - call: "POST /campus-recruiting/seasons"
              payload: { name: "S1", application_open_at: "2026-05-10T00:00:00Z", application_close_at: "2026-05-20T00:00:00Z", interview_window_start_at: "2026-06-01T00:00:00Z", interview_window_end_at: "2026-06-30T23:59:59Z", offer_window_open_at: "2026-07-01T00:00:00Z", offer_window_close_at: "2026-07-31T23:59:59Z", shortlist_score_threshold: 10, stipend_budget_cents: 1000000 }
              as: RecruitingAdmin
              captures: { sid: $.data.id }
            - call: "POST /campus-recruiting/seasons/${sid}/school-targets"
              payload: { school_name: "StateU", tier: "TARGET", application_cap: 10, stipend_region: "REGIONAL" }
              as: RecruitingAdmin
              captures: { st_id: $.data.id }
            - call: "POST /campus-recruiting/seasons/${sid}/advance"
              payload: {}
              as: RecruitingAdmin
            - call: "POST /campus-recruiting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: RecruitingAdmin
            - call: "POST /campus-recruiting/candidates"
              payload: { email: "a@x.com", full_name: "Candidate A", expected_graduation_date: "2027-05-15T00:00:00Z" }
              as: Anonymous
              captures: { cand_id: $.data.id }
            - call: "POST /campus-recruiting/seasons/${sid}/applications"
              payload: { candidate_id: "${cand_id}", school_target_id: "${st_id}", relocation_distance_miles: 100 }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { app_id: $.data.id }
            - call: "POST /campus-recruiting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-21T00:00:00Z" }
              as: RecruitingAdmin
            - call: "POST /campus-recruiting/seasons/${sid}/advance"
              payload: {}
              as: RecruitingAdmin
            - call: "POST /campus-recruiting/applications/${app_id}/screen"
              payload: { decision: "SHORTLIST" }
              as: Recruiter
            - call: "POST /campus-recruiting/seasons/${sid}/employees"
              payload: { full_name: "Eve", email: "ev@co.com" }
              as: RecruitingAdmin
              captures: { ev_id: $.data.id }
            - call: "POST /campus-recruiting/seasons/${sid}/employees"
              payload: { full_name: "Moe", email: "moe@co.com" }
              as: RecruitingAdmin
              captures: { men_id: $.data.id }
            - call: "POST /campus-recruiting/seasons/${sid}/interview-days"
              payload: { window_start_at: "2026-06-08T09:00:00Z", window_end_at: "2026-06-08T17:00:00Z", capacity: 5 }
              as: Recruiter
              captures: { day_id: $.data.id }
            - call: "POST /campus-recruiting/interview-days/${day_id}/interview-slots"
              payload: { application_id: "${app_id}", evaluator_id: "${ev_id}", start_at: "2026-06-08T10:00:00Z", end_at: "2026-06-08T11:00:00Z" }
              as: Recruiter
              captures: { slot_id: $.data.id }
            - call: "POST /campus-recruiting/interview-slots/${slot_id}/evaluations"
              payload: { score: 4, recommendation: "HIRE" }
              as: Evaluator
              as_user_id: "${ev_id}"
            - call: "POST /campus-recruiting/seasons/${sid}/advance"
              payload: {}
              as: RecruitingAdmin
            - call: "POST /campus-recruiting/applications/${app_id}/offers"
              payload: { weekly_rate_cents: 150000, duration_weeks: 12 }
              as: Recruiter
              captures: { off_id: $.data.id }
            - call: "POST /campus-recruiting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-06T10:00:00Z" }
              as: RecruitingAdmin
            - call: "POST /campus-recruiting/offers/${off_id}/extend"
              payload: {}
              as: Recruiter
            - call: "POST /campus-recruiting/offers/${off_id}/accept"
              payload: {}
              as: Candidate
              as_user_id: "${cand_id}"
            - call: "POST /campus-recruiting/seasons/${sid}/advance"
              payload: {}
              as: RecruitingAdmin
            - call: "POST /campus-recruiting/seasons/${sid}/intern-projects"
              payload: { title: "Project P", capacity: 2 }
              as: Recruiter
              captures: { proj_id: $.data.id }
            - call: "POST /campus-recruiting/intern-projects/${proj_id}/project-assignments"
              payload: { application_id: "${app_id}", mentor_id: "${men_id}" }
              as: Recruiter
              captures: { asg_id: $.data.id }
          trigger:
            - call: "POST /campus-recruiting/project-assignments/${asg_id}/intern-evaluations"
              payload: { eval_type: "MID", rating: 4, would_rehire: true }
              as: Mentor
              as_user_id: "${men_id}"
              captures: { ie_id: $.data.id }
            - call: "GET /campus-recruiting/intern-evaluations/${ie_id}"
              as: Recruiter
          assert:
            - "InternEvaluation.${ie_id} response contains id and created_at but NO version and NO updated_at keys (common_fields: false)"
            - "No PUT/PATCH endpoint exists for /campus-recruiting/intern-evaluations/{id} (append-only record)"
      - name: candidate_is_alumnus_computed
        claim_type: computed_fields
        grounds: [entities.Candidate.fields.is_alumnus]
        distinguishing_aspect: "is_alumnus derives cross-entity: false before, true after the candidate's ProjectAssignment reaches COMPLETED."
        test_recipe:
          setup:
            - "Season at INTERN_ACTIVE; candidate accepted, assigned, MID+FINAL evaluations submitted (FINAL rating 4, would_rehire true)"
          setup_api_calls:
            - call: "POST /campus-recruiting/seasons"
              payload: { name: "S1", application_open_at: "2026-05-10T00:00:00Z", application_close_at: "2026-05-20T00:00:00Z", interview_window_start_at: "2026-06-01T00:00:00Z", interview_window_end_at: "2026-06-30T23:59:59Z", offer_window_open_at: "2026-07-01T00:00:00Z", offer_window_close_at: "2026-07-31T23:59:59Z", shortlist_score_threshold: 10, stipend_budget_cents: 1000000 }
              as: RecruitingAdmin
              captures: { sid: $.data.id }
            - call: "POST /campus-recruiting/seasons/${sid}/school-targets"
              payload: { school_name: "StateU", tier: "TARGET", application_cap: 10, stipend_region: "REGIONAL" }
              as: RecruitingAdmin
              captures: { st_id: $.data.id }
            - call: "POST /campus-recruiting/seasons/${sid}/advance"
              payload: {}
              as: RecruitingAdmin
            - call: "POST /campus-recruiting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: RecruitingAdmin
            - call: "POST /campus-recruiting/candidates"
              payload: { email: "a@x.com", full_name: "Candidate A", expected_graduation_date: "2027-05-15T00:00:00Z" }
              as: Anonymous
              captures: { cand_id: $.data.id }
            - call: "POST /campus-recruiting/seasons/${sid}/applications"
              payload: { candidate_id: "${cand_id}", school_target_id: "${st_id}", relocation_distance_miles: 100 }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { app_id: $.data.id }
            - call: "POST /campus-recruiting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-21T00:00:00Z" }
              as: RecruitingAdmin
            - call: "POST /campus-recruiting/seasons/${sid}/advance"
              payload: {}
              as: RecruitingAdmin
            - call: "POST /campus-recruiting/applications/${app_id}/screen"
              payload: { decision: "SHORTLIST" }
              as: Recruiter
            - call: "POST /campus-recruiting/seasons/${sid}/employees"
              payload: { full_name: "Eve", email: "ev@co.com" }
              as: RecruitingAdmin
              captures: { ev_id: $.data.id }
            - call: "POST /campus-recruiting/seasons/${sid}/employees"
              payload: { full_name: "Moe", email: "moe@co.com" }
              as: RecruitingAdmin
              captures: { men_id: $.data.id }
            - call: "POST /campus-recruiting/seasons/${sid}/interview-days"
              payload: { window_start_at: "2026-06-08T09:00:00Z", window_end_at: "2026-06-08T17:00:00Z", capacity: 5 }
              as: Recruiter
              captures: { day_id: $.data.id }
            - call: "POST /campus-recruiting/interview-days/${day_id}/interview-slots"
              payload: { application_id: "${app_id}", evaluator_id: "${ev_id}", start_at: "2026-06-08T10:00:00Z", end_at: "2026-06-08T11:00:00Z" }
              as: Recruiter
              captures: { slot_id: $.data.id }
            - call: "POST /campus-recruiting/interview-slots/${slot_id}/evaluations"
              payload: { score: 4, recommendation: "HIRE" }
              as: Evaluator
              as_user_id: "${ev_id}"
            - call: "POST /campus-recruiting/seasons/${sid}/advance"
              payload: {}
              as: RecruitingAdmin
            - call: "POST /campus-recruiting/applications/${app_id}/offers"
              payload: { weekly_rate_cents: 150000, duration_weeks: 12 }
              as: Recruiter
              captures: { off_id: $.data.id }
            - call: "POST /campus-recruiting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-06T10:00:00Z" }
              as: RecruitingAdmin
            - call: "POST /campus-recruiting/offers/${off_id}/extend"
              payload: {}
              as: Recruiter
            - call: "POST /campus-recruiting/offers/${off_id}/accept"
              payload: {}
              as: Candidate
              as_user_id: "${cand_id}"
            - call: "POST /campus-recruiting/seasons/${sid}/advance"
              payload: {}
              as: RecruitingAdmin
            - call: "POST /campus-recruiting/seasons/${sid}/intern-projects"
              payload: { title: "Project P", capacity: 2 }
              as: Recruiter
              captures: { proj_id: $.data.id }
            - call: "POST /campus-recruiting/intern-projects/${proj_id}/project-assignments"
              payload: { application_id: "${app_id}", mentor_id: "${men_id}" }
              as: Recruiter
              captures: { asg_id: $.data.id }
            - call: "POST /campus-recruiting/project-assignments/${asg_id}/intern-evaluations"
              payload: { eval_type: "MID", rating: 4, would_rehire: true }
              as: Mentor
              as_user_id: "${men_id}"
            - call: "POST /campus-recruiting/project-assignments/${asg_id}/intern-evaluations"
              payload: { eval_type: "FINAL", rating: 4, would_rehire: true }
              as: Mentor
              as_user_id: "${men_id}"
            - call: "GET /campus-recruiting/candidates/${cand_id}"
              as: Recruiter
              captures: { alum_before: $.data.is_alumnus }
          trigger:
            - call: "POST /campus-recruiting/project-assignments/${asg_id}/complete"
              payload: {}
              as: Recruiter
            - call: "GET /campus-recruiting/candidates/${cand_id}"
              as: Recruiter
              captures: { alum_after: $.data.is_alumnus }
          assert:
            - "${alum_before} == false (assignment still ACTIVE)"
            - "${alum_after} == true (cross-entity derivation fired on COMPLETED)"
      - name: school_targets_list_pagination
        claim_type: listing
        grounds: [response_envelope.pagination_fields, response_envelope.pagination_defaults]
        distinguishing_aspect: "limit/offset/total_count/has_more interact correctly: 3 targets with limit=2 give total_count 3, has_more true on page 1 and false on page 2."
        test_recipe:
          setup: ["season with 3 school targets"]
          setup_api_calls:
            - call: "POST /campus-recruiting/seasons"
              payload: { name: "S1", application_open_at: "2026-05-10T00:00:00Z", application_close_at: "2026-05-20T00:00:00Z", interview_window_start_at: "2026-06-01T00:00:00Z", interview_window_end_at: "2026-06-30T23:59:59Z", offer_window_open_at: "2026-07-01T00:00:00Z", offer_window_close_at: "2026-07-31T23:59:59Z", shortlist_score_threshold: 50, stipend_budget_cents: 1000000 }
              as: RecruitingAdmin
              captures: { sid: $.data.id }
            - call: "POST /campus-recruiting/seasons/${sid}/school-targets"
              payload: { school_name: "StateU", tier: "CORE", application_cap: 10, stipend_region: "METRO" }
              as: RecruitingAdmin
            - call: "POST /campus-recruiting/seasons/${sid}/school-targets"
              payload: { school_name: "TechU", tier: "TARGET", application_cap: 10, stipend_region: "REGIONAL" }
              as: RecruitingAdmin
            - call: "POST /campus-recruiting/seasons/${sid}/school-targets"
              payload: { school_name: "CityU", tier: "EXPLORATORY", application_cap: 10, stipend_region: "REMOTE" }
              as: RecruitingAdmin
          trigger:
            - call: "GET /campus-recruiting/seasons/${sid}/school-targets?limit=2&offset=0"
              as: Recruiter
            - call: "GET /campus-recruiting/seasons/${sid}/school-targets?limit=2&offset=2"
              as: Recruiter
          assert:
            - "Page 1: total_count == 3, has_more == true, data length == 2"
            - "Page 2: total_count == 3, has_more == false, data length == 1"
            - "Default limit is 10, max 100, min 1, offset default 0 per the fixed envelope"

  # ---------------------------------------------------------------------------
  # State Machines: valid transitions, precondition enforcement, cascades,
  # invalid transitions, terminal lockdown
  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: season_advance_happy_path
        claim_type: valid_transition
        grounds: [state_machines.RecruitingSeason.DRAFT_to_OPEN]
        distinguishing_aspect: "DRAFT -> OPEN succeeds once at least one ACTIVE school target exists."
        test_recipe:
          setup: ["season DRAFT with one ACTIVE school target"]
          setup_api_calls:
            - call: "POST /campus-recruiting/seasons"
              payload: { name: "S1", application_open_at: "2026-05-10T00:00:00Z", application_close_at: "2026-05-20T00:00:00Z", interview_window_start_at: "2026-06-01T00:00:00Z", interview_window_end_at: "2026-06-30T23:59:59Z", offer_window_open_at: "2026-07-01T00:00:00Z", offer_window_close_at: "2026-07-31T23:59:59Z", shortlist_score_threshold: 50, stipend_budget_cents: 1000000 }
              as: RecruitingAdmin
              captures: { sid: $.data.id }
            - call: "POST /campus-recruiting/seasons/${sid}/school-targets"
              payload: { school_name: "StateU", tier: "TARGET", application_cap: 10, stipend_region: "REGIONAL" }
              as: RecruitingAdmin
          trigger:
            - call: "POST /campus-recruiting/seasons/${sid}/advance"
              payload: {}
              as: RecruitingAdmin
              captures: { st: $.data.status }
          assert:
            - "${st} == OPEN"
      - name: advance_draft_without_schools_blocked
        claim_type: precondition_enforcement
        grounds: [state_machines.RecruitingSeason.DRAFT_to_OPEN, "errors[ERR_SEASON_ADVANCE_BLOCKED]"]
        distinguishing_aspect: "DRAFT -> OPEN with zero ACTIVE school targets fails with ERR_SEASON_ADVANCE_BLOCKED and leaves the season DRAFT."
        test_recipe:
          setup: ["season DRAFT, no school targets"]
          setup_api_calls:
            - call: "POST /campus-recruiting/seasons"
              payload: { name: "S1", application_open_at: "2026-05-10T00:00:00Z", application_close_at: "2026-05-20T00:00:00Z", interview_window_start_at: "2026-06-01T00:00:00Z", interview_window_end_at: "2026-06-30T23:59:59Z", offer_window_open_at: "2026-07-01T00:00:00Z", offer_window_close_at: "2026-07-31T23:59:59Z", shortlist_score_threshold: 50, stipend_budget_cents: 1000000 }
              as: RecruitingAdmin
              captures: { sid: $.data.id }
          trigger:
            - call: "POST /campus-recruiting/seasons/${sid}/advance"
              payload: {}
              as: RecruitingAdmin
              captures: { err: $.data.error_id }
            - call: "GET /campus-recruiting/seasons/${sid}"
              as: Recruiter
              captures: { st: $.data.status }
          assert:
            - "${err} == ERR_SEASON_ADVANCE_BLOCKED"
            - "${st} == DRAFT"
      - name: advance_open_at_close_instant_blocked
        claim_type: precondition_enforcement
        grounds: [state_machines.RecruitingSeason.OPEN_to_SELECTION, "errors[ERR_SEASON_ADVANCE_BLOCKED]"]
        distinguishing_aspect: "OPEN -> SELECTION requires now strictly greater than application_close_at: at exactly the close instant the advance is blocked."
        test_recipe:
          setup: ["season OPEN, logical clock exactly 2026-05-20T00:00:00Z (== application_close_at)"]
          setup_api_calls:
            - call: "POST /campus-recruiting/seasons"
              payload: { name: "S1", application_open_at: "2026-05-10T00:00:00Z", application_close_at: "2026-05-20T00:00:00Z", interview_window_start_at: "2026-06-01T00:00:00Z", interview_window_end_at: "2026-06-30T23:59:59Z", offer_window_open_at: "2026-07-01T00:00:00Z", offer_window_close_at: "2026-07-31T23:59:59Z", shortlist_score_threshold: 50, stipend_budget_cents: 1000000 }
              as: RecruitingAdmin
              captures: { sid: $.data.id }
            - call: "POST /campus-recruiting/seasons/${sid}/school-targets"
              payload: { school_name: "StateU", tier: "TARGET", application_cap: 10, stipend_region: "REGIONAL" }
              as: RecruitingAdmin
