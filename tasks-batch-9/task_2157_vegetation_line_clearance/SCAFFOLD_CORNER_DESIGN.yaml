        distinguishing_aspect: "Reassigning CRW-1 with a crew version one behind returns 412 ERR_STALE_CREW_VERSION, leaves the crew ASSIGNED and the span IN_PROGRESS, and leaves reassigned_crew_count at 0."
        test_recipe:
          setup:
            - "Circuit CKT-A with an IN_PROGRESS span, CRW-1 holding its ACTIVE booking, and ACTIVE storm STM-1 in the NORTH district at severity 4."
