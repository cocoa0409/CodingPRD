  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      # ---- Instance 1: BP systolic >= 160 boundary on prenatal-visit complete
      - name: bpc_bp_transfer_threshold_160
        grounds:
          - calculations.episode_risk_tier
          - state_machines.PrenatalVisit.transitions.SCHEDULED_to_COMPLETED
          - entities.Episode.fields.risk_tier
        distinguishing_aspect: |
          Numeric-threshold boundary on the BP metric via POST /prenatal-visits/{id}/complete:
          systolic 160 (== BP_TRANSFER_THRESHOLD, inclusive >=) yields risk_tier
          TRANSFER_REQUIRED, while 159 yields only ELEVATED.
        test_recipe:
          setup:
            - "Standard kit+package+client+episode; two visits scheduled to test 159 then 160 on the same episode."
          setup_api_calls:
            - call: "POST /birth-center/supply-kits"
              payload: { sku: "BK1", name: "Birth Kit", on_hand_count: 5 }
              as: CenterAdmin
            - call: "POST /birth-center/care-packages"
              payload: { code: "PKG_BIRTH", package_type: "BIRTH", global_fee_cents: 800000, prenatal_visits_included: 3, postpartum_visits_included: 2, kit_sku: "BK1" }
              as: CenterAdmin
            - call: "POST /birth-center/clients"
              payload: { full_name: "Ada A", date_of_birth: "1994-03-02", parity: 0 }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /birth-center/episodes"
              payload: { client_id: "${client_id}", package_code: "PKG_BIRTH", edd: "2026-08-01" }
              as: IntakeCoordinator
              captures: { ep_id: $.data.id }
            - call: "POST /birth-center/prenatal-visits"
              payload: { episode_id: "${ep_id}", visit_kind: "PRENATAL", scheduled_at: "2026-04-01T10:00:00Z" }
              as: Midwife
              captures: { v1_id: $.data.id }
            - call: "POST /birth-center/prenatal-visits"
              payload: { episode_id: "${ep_id}", visit_kind: "PRENATAL", scheduled_at: "2026-04-15T10:00:00Z" }
              as: Midwife
              captures: { v2_id: $.data.id }
            - call: "POST /birth-center/prenatal-visits/${v1_id}/complete"
              payload: { risk_flag: "NONE", blood_pressure_systolic: 159 }
              as: Midwife
          trigger:
            - call: "POST /birth-center/prenatal-visits/${v2_id}/complete"
              payload: { risk_flag: "NONE", blood_pressure_systolic: 160 }
              as: Midwife
          assert:
            - "after the first complete (bp 159), Episode.${ep_id}.risk_tier == ELEVATED"
            - "after trigger (bp 160 == threshold, inclusive), Episode.${ep_id}.risk_tier == TRANSFER_REQUIRED"

      # ---- Instance 2: kit zero-availability boundary on episode create
      - name: bpc_kit_zero_stock_boundary
        grounds:
          - calculations.supply_kit_counters
          - validations[priority=15]
          - entities.SupplyKit.fields.on_hand_count
        distinguishing_aspect: |
          Zero-count edge on the kit-availability metric via POST /episodes: with on_hand=1 the
          first episode reserves the last unit (available 0) and succeeds; a second episode on the
          same package finds available == 0 and is rejected with ERR_KIT_OUT_OF_STOCK. A distinct
          metric (inventory count) and endpoint from instance 1's BP threshold.
        test_recipe:
          setup:
            - "SupplyKit BK1 on_hand=1; CarePackage PKG_BIRTH uses BK1; two clients."
            - "First episode created (reserves the one unit, available 0)."
          setup_api_calls:
            - call: "POST /birth-center/supply-kits"
              payload: { sku: "BK1", name: "Birth Kit", on_hand_count: 1 }
              as: CenterAdmin
            - call: "POST /birth-center/care-packages"
              payload: { code: "PKG_BIRTH", package_type: "BIRTH", global_fee_cents: 800000, prenatal_visits_included: 3, postpartum_visits_included: 2, kit_sku: "BK1" }
              as: CenterAdmin
            - call: "POST /birth-center/clients"
              payload: { full_name: "Ada A", date_of_birth: "1994-03-02", parity: 0 }
              as: IntakeCoordinator
              captures: { c1_id: $.data.id }
            - call: "POST /birth-center/clients"
              payload: { full_name: "Bea B", date_of_birth: "1992-05-09", parity: 1 }
              as: IntakeCoordinator
              captures: { c2_id: $.data.id }
            - call: "POST /birth-center/episodes"
              payload: { client_id: "${c1_id}", package_code: "PKG_BIRTH", edd: "2026-08-01" }
              as: IntakeCoordinator
              captures: { ep1_id: $.data.id }
          trigger:
            - call: "POST /birth-center/episodes"
              payload: { client_id: "${c2_id}", package_code: "PKG_BIRTH", edd: "2026-09-01" }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "after the first episode, SupplyKit.BK1.reserved_count == 1 and available (on_hand 1 - reserved 1) == 0"
            - "trigger response HTTP status == 409"
            - "trigger response error_id == ERR_KIT_OUT_OF_STOCK"

