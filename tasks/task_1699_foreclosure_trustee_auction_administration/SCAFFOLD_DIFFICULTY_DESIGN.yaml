  - rule_id: transitive_cascade
    instances:
      - name: stay_filing_postponement_overflow_cascade
        grounds:
          - state_machines.ForeclosureCase (hold posture gating)
          - state_machines.NoticeOfTrusteeSale.SALE_SCHEDULED_to_VOIDED
          - state_machines.AuctionSale.SCHEDULED_to_VOIDED
          - entities.ForeclosureCase.fields.hold_status
        distinguishing_aspect: |
          Depth-4 chain from stay filing: StayOrder ACTIVE -> case.hold_status
          BANKRUPTCY_STAY -> auto-postponement attempted on the SCHEDULED sale,
          which overflows the 3-cap -> sale VOIDED and NOTS VOIDED -> case
          lifecycle rewinds SALE_SCHEDULED -> NOD_RECORDED. Each hop is caused
          by the previous hop, not by the filing directly.
        test_recipe:
          setup:
            - "Case LN-X1 at SALE_SCHEDULED (sale 2026-11-23T10:00:00Z, VEN-X1) with postponement_count already 3 (postponed to 11-25, 11-30, 12-05)"
          setup_api_calls:
            - { call: "POST /api/beneficiaries", payload: { name: "Beneficiary Eta", reference_code: "BEN-X1", contact_email: "eta@ben.example" }, as: TrusteeAdmin, captures: { ben_id: $.data.id } }
            - { call: "POST /api/foreclosure-cases", payload: { beneficiary_id: "${ben_id}", loan_reference: "LN-X1", borrower_name: "Borrower X", property_address: "9 Stay St", county_code: "CC01", unpaid_principal_balance_cents: 40000000, monthly_payment_cents: 250000, months_in_arrears: 4, late_fee_per_month_cents: 12500, note_rate_pct: 7.2, last_interest_paid_date: "2026-07-01", distribution_method: "STATUTORY_PRIORITY", prepayment_penalty_applies: false }, as: CaseManager, captures: { case_id: $.data.id } }
            - { call: "POST /api/foreclosure-cases/${case_id}/notices-of-default", payload: { recording_date: "2026-08-01", instrument_number: "NOD-X1" }, as: CaseManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-30T00:00:00Z" }, as: TrusteeAdmin }
            - { call: "POST /api/foreclosure-cases/${case_id}/notices-of-trustee-sale", payload: { recording_date: "2026-10-30", instrument_number: "NOTS-X1" }, as: CaseManager, captures: { nots_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-02T00:00:00Z" }, as: TrusteeAdmin }
            - { call: "POST /api/notices-of-trustee-sale/${nots_id}/publications", payload: { run_date: "2026-11-02", newspaper_name: "Daily Journal" }, as: CaseManager, captures: { p1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-09T00:00:00Z" }, as: TrusteeAdmin }
            - { call: "POST /api/notices-of-trustee-sale/${nots_id}/publications", payload: { run_date: "2026-11-09", newspaper_name: "Daily Journal" }, as: CaseManager, captures: { p2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-16T00:00:00Z" }, as: TrusteeAdmin }
            - { call: "POST /api/notices-of-trustee-sale/${nots_id}/publications", payload: { run_date: "2026-11-16", newspaper_name: "Daily Journal" }, as: CaseManager, captures: { p3: $.data.id } }
            - { call: "POST /api/publications/${p1}/file-affidavit", payload: {}, as: CaseManager }
            - { call: "POST /api/publications/${p2}/file-affidavit", payload: {}, as: CaseManager }
            - { call: "POST /api/publications/${p3}/file-affidavit", payload: {}, as: CaseManager }
            - { call: "POST /api/notices-of-trustee-sale/${nots_id}/schedule-sale", payload: { venue_name: "VEN-X1", scheduled_sale_start_at: "2026-11-23T10:00:00Z" }, as: CaseManager, captures: { sale_id: $.data.id, sv1: $.data.version } }
            - { call: "POST /api/auction-sales/${sale_id}/postponements", payload: { new_sale_start_at: "2026-11-25T10:00:00Z", reason: "MUTUAL_AGREEMENT", announced_via: "ADVANCE", expected_auction_sale_version: "${sv1}" }, as: Auctioneer }
            - { call: "GET /api/auction-sales/${sale_id}", as: Auctioneer, captures: { sv2: $.data.version } }
            - { call: "POST /api/auction-sales/${sale_id}/postponements", payload: { new_sale_start_at: "2026-11-30T10:00:00Z", reason: "MUTUAL_AGREEMENT", announced_via: "ADVANCE", expected_auction_sale_version: "${sv2}" }, as: Auctioneer }
            - { call: "GET /api/auction-sales/${sale_id}", as: Auctioneer, captures: { sv3: $.data.version } }
            - { call: "POST /api/auction-sales/${sale_id}/postponements", payload: { new_sale_start_at: "2026-12-05T10:00:00Z", reason: "MUTUAL_AGREEMENT", announced_via: "ADVANCE", expected_auction_sale_version: "${sv3}" }, as: Auctioneer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-04T10:00:00Z" }, as: TrusteeAdmin }
          trigger:
            - { call: "POST /api/foreclosure-cases/${case_id}/stay-orders", payload: { stay_type: "BANKRUPTCY_CHAPTER_13", court_case_number: "BK-26-0001", filed_at: "2026-12-04T09:00:00Z" }, as: CaseManager, captures: { stay_id: $.data.id } }
            - { call: "GET /api/foreclosure-cases/${case_id}", as: CaseManager, captures: { lc: $.data.lifecycle_status, hold: $.data.hold_status } }
            - { call: "GET /api/auction-sales/${sale_id}", as: Auctioneer, captures: { sale_st: $.data.status } }
            - { call: "GET /api/notices-of-trustee-sale/${nots_id}", as: CaseManager, captures: { nots_st: $.data.status, nots_cnt: $.data.postponement_count } }
          assert:
            - "${hold} == BANKRUPTCY_STAY (hop 1: posture recompute from ACTIVE stay)"
            - "${sale_st} == VOIDED (hop 2-3: auto-postponement overflows the 3-cap, voiding the sale)"
            - "${nots_st} == VOIDED and ${nots_cnt} == 3 (no 4th postponement row created)"
            - "${lc} == NOD_RECORDED (hop 4: NOTS void rewinds the case for re-notice)"
            - "GET /api/auction-sales/${sale_id}/postponements total_count == 3 (overflow creates no Postponement row)"

      - name: payoff_acceptance_terminal_cascade
        grounds:
          - state_machines.ForeclosureCase.SALE_SCHEDULED_to_PAID_OFF
          - state_machines.BiddingInstruction.ACTIVE_to_EXPIRED
          - state_machines.BidderRegistration (QUALIFIED to REFUND_PENDING cascade)
        distinguishing_aspect: |
          Depth-3 chain from a different trigger (quote accept, not stay filing):
          quote ACCEPTED -> case PAID_OFF -> sale VOIDED -> QUALIFIED
          registration REFUND_PENDING (plus NOTS CONCLUDED and instruction
          EXPIRED on the same middle hop).
