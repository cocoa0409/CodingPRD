          trigger:
            - call: "POST /loan-applications/${loan2}/pricing-exceptions"
              payload: { requested_rate_bps: 630, concession_cents: 100000, reason_code: "SERVICE_ISSUE", justification_text: "Appraisal delay caused by our vendor; the concession compensates the borrower for the extension." }
              as: Originator
              as_user_id: "${orig_id}"
              captures: { exc2: $.data.id, exc2_rsa: $.data.requires_second_approval }
            - call: "POST /pricing-exceptions/${exc2}/decisions"
              payload: { decision: "APPROVE", decision_note: "Approval attempted without a second approver." }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
            - call: "POST /pricing-exceptions/${exc2}/decisions"
              payload: { decision: "APPROVE", decision_note: "Approval with the required second approver.", second_approver_user_id: "officer-2" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { st: $.data.status, dec: $.data.decided_by_user_id, dec2: $.data.second_decided_by_user_id }
          assert:
            - "${exc1_rsa} == false and ${exc1_st} == APPROVED"
            - "${score} == 70 and ${mon} == ELEVATED after the first close"
            - "${exc2_rsa} == true"
            - "HTTP status is 422 on the first decision"
            - "${err} == ERR_SECOND_APPROVAL_REQUIRED"
            - "HTTP status is 200 on the second decision"
            - "${st} == APPROVED, ${dec} == officer-1, ${dec2} == officer-2"

