        claim_type: Error Triggerability
        grounds:
          - errors[ERR_PROMO_NOT_CLAIMABLE]
          - validations[priority=13]
          - calculations.vendor_funding_recognition.note
          - entities.MarkdownPlan.fields.plan_type
        distinguishing_aspect: |
          plan_type is checked before plan status and before agreement scope, so an EXECUTING PROMOTIONAL plan
          with a perfectly scoped AGREED agreement is still refused with ERR_PROMO_NOT_CLAIMABLE - promotional
          contra-revenue can never enter the vendor funding waterfall.
        test_recipe:
          setup:
            - "Season FW26-APPAREL is ACTIVE with zone REGION-WEST and store 0101"
            - "Item A-1001's PROMOTIONAL plan had its 2026-10-19 rung applied, so the plan is EXECUTING with gross_markdown_cents 225600 and the item's markdown_state is PROMO_ACTIVE"
