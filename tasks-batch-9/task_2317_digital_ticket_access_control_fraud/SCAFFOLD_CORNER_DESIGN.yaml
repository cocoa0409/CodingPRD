          The check compares X-User-IDs, not roles: the same human (dual-1) may legitimately
          hold both the BoxOfficeAgent and TicketingApprover roles, so raising the request as
          dual-1 and then approving it as dual-1 is ERR_SEGREGATION_OF_DUTIES (403) even
