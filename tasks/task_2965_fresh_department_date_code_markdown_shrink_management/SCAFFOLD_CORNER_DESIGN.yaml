            - call: "POST /fresh/donation-pickups"
              payload: { store_id: "${store_id}", partner_id: "${partner_id}", dock_door_code: "D1", scheduled_window_start: "2026-08-11T14:00:00.000Z", scheduled_window_end: "2026-08-11T15:00:00.000Z" }
