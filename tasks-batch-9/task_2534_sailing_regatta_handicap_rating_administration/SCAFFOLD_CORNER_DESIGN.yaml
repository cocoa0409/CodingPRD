      - name: certificate_reinstate_returns_entries_to_submitted_not_accepted
        claim_type: cyclic
        grounds:
          - state_machines.RatingCertificate.SUSPENDED_to_ISSUED
          - state_machines.Entry.RATING_INVALID_to_SUBMITTED
          - entities.Division.fields.assigned_entry_count
        distinguishing_aspect: |
          The reinstatement loop is deliberately lossy: a RATING_INVALID entry returns to
          SUBMITTED and never straight to ACCEPTED, so the division's assigned_entry_count climbs
          back to 2 while accepted_entry_count stays 0 and the division stays PROVISIONAL - the
          chair must re-accept by hand.
        test_recipe:
          setup:
            - "A regatta with the notice of race published, fleet_minimum 2 and division A (min_entries 2, 150.0-230.0 MONOHULL)."
            - "Boats A and B each carry an ISSUED certificate and each entry is assigned, inspected, crewed and ACCEPTED, so the division is CONFIRMED with assigned 2 / accepted 2."
            - "Boat A's certificate has then been suspended, which moved entry A to RATING_INVALID and reverted the division to PROVISIONAL."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Piers Holt", email: "piers.holt@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_ch: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Mara Vance", email: "mara.vance@yc.test", measurer_license_id: "M-101" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_mea: $.data.id } }
