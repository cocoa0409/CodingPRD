              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /stream-rate-cards"
              payload: { dsp_code: "STRM", territory_code: "US", tier: "PREMIUM", rate_micros_per_stream: 4000, effective_from: "2026-01-01" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /stream-rate-cards"
              payload: { dsp_code: "STRM", territory_code: "US", tier: "AD_SUPPORTED", rate_micros_per_stream: 1200, effective_from: "2026-01-01" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /stream-rate-cards"
              payload: { dsp_code: "STRM", territory_code: "GB", tier: "PREMIUM", rate_micros_per_stream: 3000, effective_from: "2026-01-01" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /dsp-revenue-reports"
