  # ===========================================================================
  # Rule 4 — transitive_cascade (different triggers)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: shortage_allocate_cascades_job_to_request_to_order_hold
        grounds:
          - state_machines.BuildJob.QUEUED_to_SHORTAGE_BLOCKED
          - state_machines.Order."build SUBMITTED"_to_"build ON_HOLD"
          - errors[ERR_INSUFFICIENT_COMPONENT_STOCK]
        distinguishing_aspect: |
          Depth-3 cascade from POST /api/build-jobs/{id}/allocate: the failed
          allocation mutates the BuildJob (SHORTAGE_BLOCKED); that mutation itself
          auto-creates a SubstitutionRequest PENDING; and the job entering
          SHORTAGE_BLOCKED in turn pushes the Order to ON_HOLD — each hop caused by
          the previous link, not by the original call.
        test_recipe:
          setup:
            - "Account A8 (STANDARD, credit 10,000,000c); chassis L8 base 90000c build 24h"
            - "Component PSU8: 6000c, lead 4, stock_on_hand 1; ALLOWED rule"
            - "Configuration C8 (1x PSU8) VALIDATED; Order O8 line qty 2 SUBMITTED; BuildJob J8 QUEUED"
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { company_name: "A8", account_tier: "STANDARD", credit_limit_cents: 10000000 }, as: PlatformAdmin, captures: { a8_id: $.data.id } }
            - { call: "POST /api/chassis-models", payload: { model_code: "L8", category: "DESKTOP", base_price_cents: 90000, build_duration_hours: 24 }, as: PlatformAdmin, captures: { l8_id: $.data.id } }
            - { call: "POST /api/components", payload: { sku: "PSU8", kind: "PSU", price_cents: 6000, lead_time_days: 4, stock_on_hand: 1, revision: "A01" }, as: PlatformAdmin, captures: { psu8_id: $.data.id } }
            - { call: "POST /api/compatibility-rules", payload: { chassis_model_id: "${l8_id}", component_id: "${psu8_id}", rule_type: "ALLOWED" }, as: PlatformAdmin }
            - call: "POST /api/configurations"
              payload:
                account_id: "${a8_id}"
                chassis_model_id: "${l8_id}"
                component_selections: [{ component_id: "${psu8_id}", qty: 1 }]
              as: CustomerUser
              as_user_id: "${a8_id}"
              captures: { c8_id: $.data.id }
            - { call: "POST /api/configurations/${c8_id}/validate", payload: {}, as: CustomerUser, as_user_id: "${a8_id}", captures: { c8_v: $.data.version } }
            - { call: "POST /api/orders", payload: { account_id: "${a8_id}", po_number: "PO-8" }, as: CustomerUser, as_user_id: "${a8_id}", captures: { o8_id: $.data.id } }
            - { call: "POST /api/orders/${o8_id}/lines", payload: { configuration_id: "${c8_id}", qty: 2, ship_to_mode: "SINGLE_ADDRESS" }, as: CustomerUser, as_user_id: "${a8_id}" }
            - { call: "POST /api/orders/${o8_id}/submit", payload: { expected_configuration_version: "${c8_v}" }, as: CustomerUser, as_user_id: "${a8_id}" }
            - call: "GET /api/orders/${o8_id}/build-jobs"
              payload: {}
              as: FactoryOps
              captures:
                j8_id: $.data[0].id
          trigger:
            - { call: "POST /api/build-jobs/${j8_id}/allocate", payload: {}, as: FactoryOps }
          assert:
            - "BuildJob.${j8_id}.status == SHORTAGE_BLOCKED and BuildJob.${j8_id}.shortage_component_id == ${psu8_id}"
            - "exactly one SubstitutionRequest exists for BuildJob.${j8_id} with status PENDING and original_component_id == ${psu8_id}  # hop 2 created by hop 1"
            - "Order.${o8_id}.build_status == ON_HOLD   # hop 3 caused by hop 1, not by the allocate call directly"
            - "Component.${psu8_id}.reserved_units == 0  # no reservation was taken"

      - name: allocation_to_consumption_to_asset_mint_cascade
        grounds:
          - state_machines.BuildJob.ALLOCATED_to_BUILDING
          - state_machines.BuildJob.BUILDING_to_COMPLETE
          - state_machines.Order."build ALLOCATED"_to_"build IN_PRODUCTION"
        distinguishing_aspect: |
          Depth-3 cascade from a different trigger (POST /api/build-jobs/{id}/start):
          start mutates the Component pool (reserved_units -= 2, stock_on_hand -= 2);
          the job's later completion mints Asset rows under the OrderLine; and the
          final job completing bubbles the Order to BUILT — a build-side chain
          distinct from the shortage-side chain.
        test_recipe:
          setup:
            - "Account A9 (STANDARD, credit 10,000,000c); chassis L9 base 70000c build 24h"
            - "Component NIC9: 4000c, lead 2, stock 5; ALLOWED rule"
            - "Configuration C9 (1x NIC9) VALIDATED; Order O9 line qty 2 SUBMITTED; job J9 ALLOCATED (NIC9 reserved 2)"
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { company_name: "A9", account_tier: "STANDARD", credit_limit_cents: 10000000 }, as: PlatformAdmin, captures: { a9_id: $.data.id } }
            - { call: "POST /api/chassis-models", payload: { model_code: "L9", category: "SERVER", base_price_cents: 70000, build_duration_hours: 24 }, as: PlatformAdmin, captures: { l9_id: $.data.id } }
            - { call: "POST /api/components", payload: { sku: "NIC9", kind: "NIC", price_cents: 4000, lead_time_days: 2, stock_on_hand: 5, revision: "A01" }, as: PlatformAdmin, captures: { nic9_id: $.data.id } }
            - { call: "POST /api/compatibility-rules", payload: { chassis_model_id: "${l9_id}", component_id: "${nic9_id}", rule_type: "ALLOWED" }, as: PlatformAdmin }
            - call: "POST /api/configurations"
              payload:
                account_id: "${a9_id}"
                chassis_model_id: "${l9_id}"
                component_selections: [{ component_id: "${nic9_id}", qty: 1 }]
              as: CustomerUser
              as_user_id: "${a9_id}"
              captures: { c9_id: $.data.id }
            - { call: "POST /api/configurations/${c9_id}/validate", payload: {}, as: CustomerUser, as_user_id: "${a9_id}", captures: { c9_v: $.data.version } }
            - { call: "POST /api/orders", payload: { account_id: "${a9_id}", po_number: "PO-9" }, as: CustomerUser, as_user_id: "${a9_id}", captures: { o9_id: $.data.id } }
            - { call: "POST /api/orders/${o9_id}/lines", payload: { configuration_id: "${c9_id}", qty: 2, ship_to_mode: "SINGLE_ADDRESS" }, as: CustomerUser, as_user_id: "${a9_id}", captures: { ol9_id: $.data.id } }
            - { call: "POST /api/orders/${o9_id}/submit", payload: { expected_configuration_version: "${c9_v}" }, as: CustomerUser, as_user_id: "${a9_id}" }
            - call: "GET /api/orders/${o9_id}/build-jobs"
              payload: {}
              as: FactoryOps
              captures:
                j9_id: $.data[0].id
            - { call: "POST /api/build-jobs/${j9_id}/allocate", payload: {}, as: FactoryOps }
          trigger:
            - { call: "POST /api/build-jobs/${j9_id}/start", payload: {}, as: FactoryOps }
            - { call: "POST /api/build-jobs/${j9_id}/complete", payload: {}, as: FactoryOps }
          assert:
            - "after start: Component.${nic9_id}.reserved_units == 0 and Component.${nic9_id}.stock_on_hand == 3  # hop 1: pool consumed 2"
            - "after start: Order.${o9_id}.build_status == IN_PRODUCTION"
            - "after complete: exactly 2 Asset rows exist under OrderLine.${ol9_id}, each STAGED with non-null serial_number  # hop 2"
            - "after complete: Order.${o9_id}.build_status == BUILT   # hop 3 bubble-up"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: substitution_approve_state_outranks_fiscal
        grounds:
          - validations[priority=4]
          - validations[priority=10]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Pair (state vs business_fiscal): a substitution approval attempted when the
          order is no longer ON_HOLD would fail BOTH the state gate (job not
          SHORTAGE_BLOCKED / order not ON_HOLD -> ERR_INVALID_STATE) and the fiscal
          gate (positive price delta would exceed credit limit -> ERR_CREDIT_LIMIT_EXCEEDED);
          priority 4 must win with ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Account A10 (STANDARD, credit_limit_cents 110001); chassis L10 base 100000c build 24h"
            - "Components SSD10 (5000c, lead 3, stock 5) and SSD11 (9999c, lead 3, stock 5); ALLOWED rules for both"
            - "Configuration C10 (1x SSD10) VALIDATED; Order O10 qty 1 SUBMITTED (outstanding == 105000)"
            - "Job allocated/started/completed normally (no shortage); a leftover PENDING-substitution id is unavailable, so the state failure is provoked by approving a request whose job already left SHORTAGE_BLOCKED — modeled here by approving twice: first approval succeeds (delta +4999, outstanding 109999 <= 110001), second approval of the now-APPROVED request violates state AND would push outstanding to 114998 > 110001"
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { company_name: "A10", account_tier: "STANDARD", credit_limit_cents: 110001 }, as: PlatformAdmin, captures: { a10_id: $.data.id } }
            - { call: "POST /api/chassis-models", payload: { model_code: "L10", category: "LAPTOP", base_price_cents: 100000, build_duration_hours: 24 }, as: PlatformAdmin, captures: { l10_id: $.data.id } }
            - { call: "POST /api/components", payload: { sku: "SSD10", kind: "STORAGE", price_cents: 5000, lead_time_days: 3, stock_on_hand: 0, revision: "A01" }, as: PlatformAdmin, captures: { ssd10_id: $.data.id } }
            - { call: "POST /api/components", payload: { sku: "SSD11", kind: "STORAGE", price_cents: 9999, lead_time_days: 3, stock_on_hand: 5, revision: "A01" }, as: PlatformAdmin, captures: { ssd11_id: $.data.id } }
            - { call: "POST /api/compatibility-rules", payload: { chassis_model_id: "${l10_id}", component_id: "${ssd10_id}", rule_type: "ALLOWED" }, as: PlatformAdmin }
            - { call: "POST /api/compatibility-rules", payload: { chassis_model_id: "${l10_id}", component_id: "${ssd11_id}", rule_type: "ALLOWED" }, as: PlatformAdmin }
            - call: "POST /api/configurations"
              payload:
                account_id: "${a10_id}"
                chassis_model_id: "${l10_id}"
                component_selections: [{ component_id: "${ssd10_id}", qty: 1 }]
              as: CustomerUser
              as_user_id: "${a10_id}"
              captures: { c10_id: $.data.id }
            - { call: "POST /api/configurations/${c10_id}/validate", payload: {}, as: CustomerUser, as_user_id: "${a10_id}", captures: { c10_v: $.data.version } }
            - { call: "POST /api/orders", payload: { account_id: "${a10_id}", po_number: "PO-10" }, as: CustomerUser, as_user_id: "${a10_id}", captures: { o10_id: $.data.id } }
            - { call: "POST /api/orders/${o10_id}/lines", payload: { configuration_id: "${c10_id}", qty: 1, ship_to_mode: "SINGLE_ADDRESS" }, as: CustomerUser, as_user_id: "${a10_id}" }
            - { call: "POST /api/orders/${o10_id}/submit", payload: { expected_configuration_version: "${c10_v}" }, as: CustomerUser, as_user_id: "${a10_id}" }
            - call: "GET /api/orders/${o10_id}/build-jobs"
              payload: {}
              as: FactoryOps
              captures:
                j10_id: $.data[0].id
            - { call: "POST /api/build-jobs/${j10_id}/allocate", payload: {}, as: FactoryOps }
            - call: "GET /api/build-jobs/${j10_id}/substitution-requests"
              payload: {}
              as: FactoryOps
              captures:
                sr10_id: $.data[0].id
            - { call: "POST /api/substitution-requests/${sr10_id}/approve", payload: {}, as: CustomerUser, as_user_id: "${a10_id}" }
          trigger:
            - { call: "POST /api/substitution-requests/${sr10_id}/approve", payload: {}, as: CustomerUser, as_user_id: "${a10_id}", captures: { err10: $.data.error_id } }
          assert:
            - "second approve returns error_id == ERR_INVALID_STATE (409)   # state (priority 4) outranks business_fiscal (priority 10)"
            - "error_id != ERR_CREDIT_LIMIT_EXCEEDED even though a hypothetical re-application of delta 4999 would push outstanding 109999 + 4999 = 114998 over the 110001 limit"
            - "Order.${o10_id}.total_cents == 109999   # first approval applied exactly once"

      - name: configuration_lock_state_outranks_program_lock_constraint
        grounds:
          - validations[priority=4]
          - validations[priority=8]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_PROGRAM_LOCK_VIOLATION]
        distinguishing_aspect: |
          Pair (state vs business_constraint — different pair from the first
          instance): locking a Configuration that is still DRAFT while its program is
          also UNLOCKED violates both the state machine (lock undefined from DRAFT ->
          ERR_INVALID_STATE) and the program-lock constraint
          (ERR_PROGRAM_LOCK_VIOLATION); priority 4 must win.
        test_recipe:
          setup:
            - "Account A11 with OPEN (never locked) program P11 and published template T11"
            - "Chassis L11 + component GPU11 ALLOWED; Configuration C11 created from T11 but left in DRAFT (never validated)"
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { company_name: "A11", account_tier: "STANDARD", credit_limit_cents: 10000000 }, as: PlatformAdmin, captures: { a11_id: $.data.id } }
            - { call: "POST /api/accounts/${a11_id}/programs", payload: { name: "P11", asset_tag_prefix: "FE", custom_image_ref: "img-std" }, as: AccountManager, captures: { p11_id: $.data.id } }
            - { call: "POST /api/chassis-models", payload: { model_code: "L11", category: "WORKSTATION", base_price_cents: 150000, build_duration_hours: 24 }, as: PlatformAdmin, captures: { l11_id: $.data.id } }
            - { call: "POST /api/components", payload: { sku: "GPU11", kind: "GPU", price_cents: 50000, lead_time_days: 6, stock_on_hand: 10, revision: "A01" }, as: PlatformAdmin, captures: { gpu11_id: $.data.id } }
            - { call: "POST /api/compatibility-rules", payload: { chassis_model_id: "${l11_id}", component_id: "${gpu11_id}", rule_type: "ALLOWED" }, as: PlatformAdmin }
            - call: "POST /api/programs/${p11_id}/templates"
              payload:
                name: "T11"
                chassis_model_id: "${l11_id}"
                pinned_components: [{ component_id: "${gpu11_id}", revision: "A01", qty: 1 }]
              as: AccountManager
              captures: { t11_id: $.data.id }
            - { call: "POST /api/templates/${t11_id}/publish", payload: {}, as: AccountManager }
            - call: "POST /api/configurations"
              payload:
                account_id: "${a11_id}"
                chassis_model_id: "${l11_id}"
                component_selections: [{ component_id: "${gpu11_id}", qty: 1 }]
                template_id: "${t11_id}"
              as: CustomerUser
              as_user_id: "${a11_id}"
              captures: { c11_id: $.data.id }
          trigger:
            - { call: "POST /api/configurations/${c11_id}/lock", payload: {}, as: AccountManager, captures: { err11: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE (409)   # lock undefined from DRAFT; state gate wins over business_constraint (priority 8)"
            - "error_id != ERR_PROGRAM_LOCK_VIOLATION even though program P11 is also not LOCKED"
            - "Configuration.${c11_id}.status == DRAFT   # no side effects"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (different metrics, distinct endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: allocation_exact_fit_available_equals_required
        grounds:
          - validations[priority=11]
          - calculations.build_queue_sequencing
          - entities.Component.fields.available_units
        distinguishing_aspect: |
          Numeric threshold boundary on the stock metric via POST
          /api/build-jobs/{id}/allocate: required == available (2 == 2) MUST succeed
          (>= semantics, exact fit), driving available_units to exactly 0 without
          error — one unit short (not exercised here) would SHORTAGE_BLOCKED.
        test_recipe:
          setup:
            - "Account A12 (STANDARD, credit 10,000,000c); chassis L12 base 60000c build 24h"
            - "Component MEM12: 3000c, lead 2, stock_on_hand 2; ALLOWED rule"
            - "Configuration C12 (1x MEM12) VALIDATED; Order O12 line qty 2 SUBMITTED; job J12 QUEUED"
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { company_name: "A12", account_tier: "STANDARD", credit_limit_cents: 10000000 }, as: PlatformAdmin, captures: { a12_id: $.data.id } }
            - { call: "POST /api/chassis-models", payload: { model_code: "L12", category: "DESKTOP", base_price_cents: 60000, build_duration_hours: 24 }, as: PlatformAdmin, captures: { l12_id: $.data.id } }
            - { call: "POST /api/components", payload: { sku: "MEM12", kind: "MEMORY", price_cents: 3000, lead_time_days: 2, stock_on_hand: 2, revision: "A01" }, as: PlatformAdmin, captures: { mem12_id: $.data.id } }
            - { call: "POST /api/compatibility-rules", payload: { chassis_model_id: "${l12_id}", component_id: "${mem12_id}", rule_type: "ALLOWED" }, as: PlatformAdmin }
            - call: "POST /api/configurations"
              payload:
                account_id: "${a12_id}"
                chassis_model_id: "${l12_id}"
                component_selections: [{ component_id: "${mem12_id}", qty: 1 }]
              as: CustomerUser
              as_user_id: "${a12_id}"
              captures: { c12_id: $.data.id }
            - { call: "POST /api/configurations/${c12_id}/validate", payload: {}, as: CustomerUser, as_user_id: "${a12_id}", captures: { c12_v: $.data.version } }
            - { call: "POST /api/orders", payload: { account_id: "${a12_id}", po_number: "PO-12" }, as: CustomerUser, as_user_id: "${a12_id}", captures: { o12_id: $.data.id } }
            - { call: "POST /api/orders/${o12_id}/lines", payload: { configuration_id: "${c12_id}", qty: 2, ship_to_mode: "SINGLE_ADDRESS" }, as: CustomerUser, as_user_id: "${a12_id}" }
            - { call: "POST /api/orders/${o12_id}/submit", payload: { expected_configuration_version: "${c12_v}" }, as: CustomerUser, as_user_id: "${a12_id}" }
            - call: "GET /api/orders/${o12_id}/build-jobs"
              payload: {}
              as: FactoryOps
              captures:
                j12_id: $.data[0].id
          trigger:
            - { call: "POST /api/build-jobs/${j12_id}/allocate", payload: {}, as: FactoryOps }
          assert:
            - "BuildJob.${j12_id}.status == ALLOCATED   # exact fit allowed (>= not >)"
            - "Component.${mem12_id}.reserved_units == 2 and Component.${mem12_id}.available_units == 0"
            - "no SubstitutionRequest exists for BuildJob.${j12_id}"

      - name: wave_window_adjacency_end_equals_start
        grounds:
          - validations[priority=13]
          - entities.DeploymentWave.fields.ship_window_start
          - entities.DeploymentWave.fields.ship_window_end
        distinguishing_aspect: |
          Empty-intersection boundary on the time-interval metric via a different
          endpoint (POST /api/orders/{id}/deployment-waves): half-open [start, end)
          semantics mean a wave starting exactly at another wave's end does NOT
          overlap — adjacency is permitted while a one-second overlap is rejected.
        test_recipe:
          setup:
            - "Account A13 (STANDARD, credit 20,000,000c); chassis L13 base 50000c build 24h"
            - "Component WIF13: 2000c, lead 2, stock 10; ALLOWED rule"
            - "Configuration C13 VALIDATED; Order O13 qty 2 SUBMITTED (build not finished; wave creation is allowed pre-BUILT)"
            - "Wave W1 [2026-09-05T00:00:00Z, 2026-09-10T00:00:00Z) created"
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { company_name: "A13", account_tier: "STANDARD", credit_limit_cents: 20000000 }, as: PlatformAdmin, captures: { a13_id: $.data.id } }
            - { call: "POST /api/chassis-models", payload: { model_code: "L13", category: "LAPTOP", base_price_cents: 50000, build_duration_hours: 24 }, as: PlatformAdmin, captures: { l13_id: $.data.id } }
            - { call: "POST /api/components", payload: { sku: "WIF13", kind: "WIFI", price_cents: 2000, lead_time_days: 2, stock_on_hand: 10, revision: "A01" }, as: PlatformAdmin, captures: { wif13_id: $.data.id } }
            - { call: "POST /api/compatibility-rules", payload: { chassis_model_id: "${l13_id}", component_id: "${wif13_id}", rule_type: "ALLOWED" }, as: PlatformAdmin }
            - call: "POST /api/configurations"
              payload:
                account_id: "${a13_id}"
                chassis_model_id: "${l13_id}"
                component_selections: [{ component_id: "${wif13_id}", qty: 1 }]
              as: CustomerUser
              as_user_id: "${a13_id}"
              captures: { c13_id: $.data.id }
            - { call: "POST /api/configurations/${c13_id}/validate", payload: {}, as: CustomerUser, as_user_id: "${a13_id}", captures: { c13_v: $.data.version } }
            - { call: "POST /api/orders", payload: { account_id: "${a13_id}", po_number: "PO-13" }, as: CustomerUser, as_user_id: "${a13_id}", captures: { o13_id: $.data.id } }
