              as: PresortOperator
            - call: "POST /commingle-batches/${batch_id}/containers"
              payload: { container_type: "TRAY", destination_zip3: "021", sort_level: "FIVE_DIGIT", piece_count: 1000 }
              as: PresortOperator
            - call: "POST /commingle-batches/${batch_id}/containers"
