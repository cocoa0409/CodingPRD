      - name: hub_buffered_closed_interval_conflict_with_no_reselection
        grounds:
          - calculations.hub_selector
          - validations[priority=35]
          - errors.ERR_HUB_SLOT_CONFLICT
          - entities.PickupHub.fields.assigned_order_count
        distinguishing_aspect: |
          The hub-level interval is the opposite of the cook-level one: it is expanded by
          COLD_CHAIN_BUFFER_MINUTES (45) on both sides and CLOSED, so windows that are legally
          non-overlapping for the cook still collide on a shared hub. P [16:00,18:00) buffers to
          [15:15,18:45] and Q [18:30,20:00) buffers to [17:45,20:45]: they intersect, so routing
          Q's order onto the hub is refused even though the hub has four free slots. R
          [20:00,21:00) buffers to [19:15,21:45], which misses P's buffer entirely, so R's order
