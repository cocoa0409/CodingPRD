            - "HTTP status 409"

      - name: schedule_donation_safety_beats_referential
        grounds:
          - validations[priority=8]
          - validations[priority=13]
          - state_machines.Donor.APPLICANT_to_DEFERRED_TEMP
        distinguishing_aspect: |
          Error-category pair = business_safety (priority 8, donor eligibility) vs
          business_referential (priority 13, screening-not-cleared). One POST
          /donors/{id}/donation-visits violates both: the donor is DEFERRED_TEMP and
          the referenced screening is still SCHEDULED. The safety error MUST win.
