# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over §1.1–§1.7: required-field validation, invalid-from
# rejection, RBAC denial, FK integrity, response envelope, computed-field
# correctness, OCC, pagination. Corners already exercised by a §1.8 instance
# are emitted as excluded_because stubs (no test_recipe). Every active
# instance's setup_api_calls / trigger chain is executable from empty-DB using
# only §1.5 endpoints; formula-derived asserts are pre-computed literals.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_property_computes_avm_and_initial_state
        claim_type: Creation
        grounds:
          - entities.Property.fields.avm_value
          - entities.Property.fields.status
          - calculations.avm_valuation
          - endpoints[POST /properties]
        distinguishing_aspect: "POST /properties with comp_median_value=500000, market_trend_pct=0.02 returns 201 with avm_value=510000.00, status=VALUED, version=1, condition_score=null."
        test_recipe:
          setup:
            - "A Seller exists."
          setup_api_calls:
            - call: "POST /sellers"
              payload: { email: "c1@x.com", full_name: "C One" }
              as: OperationsAdmin
              captures: { seller_id: $.data.id }
          trigger:
            - call: "POST /properties"
              payload: { seller_id: "${seller_id}", address_line: "100 Oak", zip_code: "90001", bedrooms: 3, living_area_sqft: 1800, comp_median_value: 500000, market_trend_pct: 0.02 }
              as: PricingAnalyst
              captures: { prop_id: $.data.id }
          assert:
            - "Property.${prop_id}.avm_value == 510000.00"
            - "Property.${prop_id}.status == VALUED"
            - "Property.${prop_id}.version == 1"
            - "Property.${prop_id}.condition_score == null"

      - name: create_property_missing_comp_median_value_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Property.fields.comp_median_value
          - validations[priority=17]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /properties without comp_median_value (required input, no default) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "A Seller exists."
          setup_api_calls:
            - call: "POST /sellers"
              payload: { email: "c2@x.com", full_name: "C Two" }
              as: OperationsAdmin
              captures: { seller_id: $.data.id }
          trigger:
            - call: "POST /properties"
              payload: { seller_id: "${seller_id}", address_line: "101 Oak", zip_code: "90001", bedrooms: 3, living_area_sqft: 1800 }
              as: PricingAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: create_property_default_market_trend_pct_zero
        claim_type: Defaults
        grounds:
          - entities.Property.fields.market_trend_pct
          - calculations.avm_valuation
        distinguishing_aspect: "Omitting market_trend_pct defaults it to 0.0, so avm_value == comp_median_value (500000 -> 500000.00)."
        test_recipe:
          setup:
            - "A Seller exists."
          setup_api_calls:
            - call: "POST /sellers"
              payload: { email: "c3@x.com", full_name: "C Three" }
              as: OperationsAdmin
              captures: { seller_id: $.data.id }
          trigger:
            - call: "POST /properties"
              payload: { seller_id: "${seller_id}", address_line: "102 Oak", zip_code: "90001", bedrooms: 3, living_area_sqft: 1800, comp_median_value: 500000 }
              as: PricingAnalyst
              captures: { prop_id: $.data.id }
          assert:
            - "Property.${prop_id}.avm_value == 500000.00"
            - "Property.${prop_id}.market_trend_pct == 0.0"

      - name: seller_create_default_payout_method_ach
        claim_type: Defaults
        grounds:
          - entities.Seller.fields.payout_method
          - endpoints[POST /sellers]
        distinguishing_aspect: "POST /sellers without payout_method defaults to ACH."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /sellers"
              payload: { email: "c4@x.com", full_name: "C Four" }
              as: OperationsAdmin
              captures: { seller_id: $.data.id }
          assert:
            - "Seller.${seller_id}.payout_method == ACH"

      - name: get_property_not_found_returns_404
        claim_type: Not Found
        grounds:
          - endpoints[GET /properties/{id}]
          - validations[priority=3]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /properties/{nonexistent-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /properties/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PricingAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: create_property_invalid_seller_fk_returns_404
        claim_type: Parent Relationships
        grounds:
          - entities.Property.fields.seller_id
          - validations[priority=3]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "POST /properties with a seller_id that does not resolve returns ERR_NOT_FOUND (404) — FK integrity for a flat reference."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /properties"
              payload: { seller_id: "00000000-0000-0000-0000-000000000000", address_line: "103 Oak", zip_code: "90001", bedrooms: 3, living_area_sqft: 1800, comp_median_value: 500000 }
              as: PricingAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: repair_line_item_computes_rounded_amount
        claim_type: Computed Fields
        grounds:
          - entities.RepairLineItem.fields.rounded_amount
          - endpoints[POST /assessments/{id}/repair-line-items]
        distinguishing_aspect: "POST repair line item estimate_amount=2500.555 returns rounded_amount=2500.56 (half-up to cents); the raw estimate is preserved separately."
        test_recipe:
          setup:
            - "Accepted offer -> Transaction + DRAFT Assessment."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: OperationsAdmin
            - call: "POST /sellers"
              payload: { email: "c5@x.com", full_name: "C Five" }
              as: OperationsAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /properties"
              payload: { seller_id: "${seller_id}", address_line: "104 Oak", zip_code: "90001", bedrooms: 3, living_area_sqft: 1800, comp_median_value: 500000, market_trend_pct: 0.02 }
              as: PricingAnalyst
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/offers"
              payload: { service_fee_pct: 0.05 }
              as: PricingAnalyst
              captures: { offer_id: $.data.id }
            - call: "POST /offers/${offer_id}/accept"
              payload: {}
              as: Seller
              as_user_id: "${seller_id}"
            - call: "GET /offers/${offer_id}/assessment"
              payload: {}
              as: OperationsAdmin
              captures: { assess_id: "$.data[0].id" }
          trigger:
            - call: "POST /assessments/${assess_id}/repair-line-items"
              payload: { category: "COSMETIC", estimate_amount: 2500.555 }
              as: OperationsAdmin
              captures: { line_id: $.data.id }
          assert:
            - "RepairLineItem.${line_id}.rounded_amount == 2500.56"

      - name: finalize_assessment_computes_worst_condition_score
        claim_type: Computed Fields
        grounds:
          - entities.Assessment.fields.condition_score
          - entities.Property.fields.condition_score
          - endpoints[POST /assessments/{id}/finalize]
        distinguishing_aspect: "Finalizing with roof=GOOD, hvac=POOR, foundation=EXCELLENT sets Assessment.condition_score=POOR (worst component) and writes Property.condition_score=POOR."
        test_recipe:
          setup:
            - "Accepted offer -> DRAFT Assessment."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: OperationsAdmin
            - call: "POST /sellers"
              payload: { email: "c6@x.com", full_name: "C Six" }
              as: OperationsAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /properties"
              payload: { seller_id: "${seller_id}", address_line: "105 Oak", zip_code: "90001", bedrooms: 3, living_area_sqft: 1800, comp_median_value: 500000, market_trend_pct: 0.02 }
              as: PricingAnalyst
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/offers"
              payload: { service_fee_pct: 0.05 }
              as: PricingAnalyst
              captures: { offer_id: $.data.id }
            - call: "POST /offers/${offer_id}/accept"
              payload: {}
              as: Seller
              as_user_id: "${seller_id}"
            - call: "GET /offers/${offer_id}/assessment"
              payload: {}
              as: OperationsAdmin
              captures: { assess_id: "$.data[0].id" }
          trigger:
            - call: "POST /assessments/${assess_id}/finalize"
              payload: { roof_condition: "GOOD", hvac_condition: "POOR", foundation_condition: "EXCELLENT" }
              as: OperationsAdmin
          assert:
            - "Assessment.${assess_id}.condition_score == POOR"
            - "Assessment.${assess_id}.status == FINALIZED"
            - "Property.${prop_id}.condition_score == POOR"

      - name: system_fields_generated_on_property_create
        claim_type: System Fields
        grounds:
          - entities.Property.fields.status
          - endpoints[POST /properties]
        distinguishing_aspect: "Client-supplied status / avm_value in the body are ignored; server stamps id, created_at, version=1, status=VALUED, and computes avm_value."
        test_recipe:
          setup: ["A Seller exists."]
          setup_api_calls:
            - call: "POST /sellers"
              payload: { email: "c7@x.com", full_name: "C Seven" }
              as: OperationsAdmin
              captures: { seller_id: $.data.id }
          trigger:
            - call: "POST /properties"
              payload: { seller_id: "${seller_id}", address_line: "106 Oak", zip_code: "90001", bedrooms: 3, living_area_sqft: 1800, comp_median_value: 500000, market_trend_pct: 0.02 }
              as: PricingAnalyst
              captures: { prop_id: $.data.id }
          assert:
            - "Property.${prop_id}.status == VALUED"
            - "Property.${prop_id}.avm_value == 510000.00"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: finalize_already_finalized_assessment_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.Assessment.DRAFT_to_FINALIZED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Finalizing an already-FINALIZED assessment a second time returns ERR_INVALID_STATE (409); no side effects re-fire."
        test_recipe:
          setup:
            - "Accepted offer -> Assessment FINALIZED once."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: OperationsAdmin
            - call: "POST /sellers"
              payload: { email: "c8@x.com", full_name: "C Eight" }
              as: OperationsAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /properties"
              payload: { seller_id: "${seller_id}", address_line: "107 Oak", zip_code: "90001", bedrooms: 3, living_area_sqft: 1800, comp_median_value: 500000, market_trend_pct: 0.02 }
              as: PricingAnalyst
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/offers"
              payload: { service_fee_pct: 0.05 }
              as: PricingAnalyst
              captures: { offer_id: $.data.id }
            - call: "POST /offers/${offer_id}/accept"
              payload: {}
              as: Seller
              as_user_id: "${seller_id}"
            - call: "GET /offers/${offer_id}/assessment"
              payload: {}
              as: OperationsAdmin
              captures: { assess_id: "$.data[0].id" }
            - call: "POST /assessments/${assess_id}/finalize"
              payload: { roof_condition: "GOOD", hvac_condition: "GOOD", foundation_condition: "GOOD" }
              as: OperationsAdmin
          trigger:
            - call: "POST /assessments/${assess_id}/finalize"
              payload: { roof_condition: "GOOD", hvac_condition: "GOOD", foundation_condition: "GOOD" }
              as: OperationsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: close_from_scheduled_without_inspection_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Transaction.INSPECTION_to_CLOSED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /transactions/{id}/close while Transaction.status==SCHEDULED (inspection not started) returns ERR_INVALID_STATE (409); close requires INSPECTION."
        test_recipe:
          setup:
            - "Transaction SCHEDULED (assessment finalized, close scheduled) but start-inspection not called."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: OperationsAdmin
            - call: "POST /sellers"
              payload: { email: "c9@x.com", full_name: "C Nine" }
              as: OperationsAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /properties"
              payload: { seller_id: "${seller_id}", address_line: "108 Oak", zip_code: "90001", bedrooms: 3, living_area_sqft: 1800, comp_median_value: 500000, market_trend_pct: 0.02 }
              as: PricingAnalyst
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/offers"
              payload: { service_fee_pct: 0.05 }
              as: PricingAnalyst
              captures: { offer_id: $.data.id }
            - call: "POST /offers/${offer_id}/accept"
              payload: {}
              as: Seller
              as_user_id: "${seller_id}"
              captures: { txn_id: $.data.id }
            - call: "GET /offers/${offer_id}/assessment"
              payload: {}
              as: OperationsAdmin
              captures: { assess_id: "$.data[0].id" }
            - call: "POST /assessments/${assess_id}/finalize"
              payload: { roof_condition: "GOOD", hvac_condition: "GOOD", foundation_condition: "GOOD" }
              as: OperationsAdmin
            - call: "POST /transactions/${txn_id}/schedule-close"
              payload: { close_date: "2026-03-15T00:00:00Z", leaseback_days: 0, final_concession: 0 }
              as: Seller
              as_user_id: "${seller_id}"
          trigger:
            - call: "POST /transactions/${txn_id}/close"
              payload: {}
              as: OperationsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: retrade_twice_returns_already_applied
        claim_type: invalid_transition
        grounds:
          - state_machines.Transaction.INSPECTION_to_INSPECTION
          - validations[priority=12]
          - errors[ERR_RETRADE_ALREADY_APPLIED]
        distinguishing_aspect: "A second POST /transactions/{id}/retrade after one is applied returns ERR_RETRADE_ALREADY_APPLIED (409)."
        test_recipe:
          setup:
            - "Transaction at INSPECTION with a 5000 re-trade already applied."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: OperationsAdmin
            - call: "POST /sellers"
              payload: { email: "c10@x.com", full_name: "C Ten" }
              as: OperationsAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /properties"
              payload: { seller_id: "${seller_id}", address_line: "109 Oak", zip_code: "90001", bedrooms: 3, living_area_sqft: 1800, comp_median_value: 500000, market_trend_pct: 0.02 }
              as: PricingAnalyst
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/offers"
              payload: { service_fee_pct: 0.05 }
              as: PricingAnalyst
              captures: { offer_id: $.data.id }
            - call: "POST /offers/${offer_id}/accept"
              payload: {}
              as: Seller
              as_user_id: "${seller_id}"
              captures: { txn_id: $.data.id }
            - call: "GET /offers/${offer_id}/assessment"
              payload: {}
              as: OperationsAdmin
              captures: { assess_id: "$.data[0].id" }
            - call: "POST /assessments/${assess_id}/finalize"
              payload: { roof_condition: "GOOD", hvac_condition: "GOOD", foundation_condition: "GOOD" }
              as: OperationsAdmin
            - call: "POST /transactions/${txn_id}/schedule-close"
              payload: { close_date: "2026-03-15T00:00:00Z", leaseback_days: 0, final_concession: 0 }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /transactions/${txn_id}/start-inspection"
              payload: {}
              as: OperationsAdmin
            - call: "POST /transactions/${txn_id}/retrade"
              payload: { retrade_amount: 5000 }
              as: PricingAnalyst
          trigger:
            - call: "POST /transactions/${txn_id}/retrade"
              payload: { retrade_amount: 3000 }
              as: PricingAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_RETRADE_ALREADY_APPLIED"
            - "HTTP status == 409"

      - name: cancel_closed_transaction_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Transaction.INSPECTION_to_CLOSED
          - state_machines.Transaction.SCHEDULED_to_CANCELLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Cancelling a CLOSED (terminal) transaction returns ERR_INVALID_STATE (409); CLOSED admits no transitions."
        test_recipe:
          setup:
            - "Transaction CLOSED (full happy path)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: OperationsAdmin
            - call: "POST /sellers"
              payload: { email: "c11@x.com", full_name: "C Eleven" }
              as: OperationsAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /properties"
              payload: { seller_id: "${seller_id}", address_line: "110 Oak", zip_code: "90001", bedrooms: 3, living_area_sqft: 1800, comp_median_value: 500000, market_trend_pct: 0.02 }
              as: PricingAnalyst
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/offers"
              payload: { service_fee_pct: 0.05 }
              as: PricingAnalyst
              captures: { offer_id: $.data.id }
            - call: "POST /offers/${offer_id}/accept"
              payload: {}
              as: Seller
              as_user_id: "${seller_id}"
              captures: { txn_id: $.data.id }
            - call: "GET /offers/${offer_id}/assessment"
              payload: {}
              as: OperationsAdmin
              captures: { assess_id: "$.data[0].id" }
            - call: "POST /assessments/${assess_id}/finalize"
              payload: { roof_condition: "GOOD", hvac_condition: "GOOD", foundation_condition: "GOOD" }
              as: OperationsAdmin
            - call: "POST /transactions/${txn_id}/schedule-close"
              payload: { close_date: "2026-03-15T00:00:00Z", leaseback_days: 0, final_concession: 0 }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /transactions/${txn_id}/start-inspection"
              payload: {}
              as: OperationsAdmin
            - call: "POST /transactions/${txn_id}/close"
              payload: {}
              as: OperationsAdmin
          trigger:
            - call: "POST /transactions/${txn_id}/cancel"
              payload: {}
              as: Seller
              as_user_id: "${seller_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: full_close_sets_property_sold_and_final_proceeds
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Transaction.INSPECTION_to_CLOSED
          - state_machines.Property.IN_TRANSACTION_to_SOLD
          - entities.Transaction.fields.final_net_proceeds
        distinguishing_aspect: "Closing a transaction with avm=510000, repair_credit=6634.57, final_concession=7650.00, no leaseback sets Transaction.status=CLOSED, final_net_proceeds=470215.43 and Property.status=SOLD."
        test_recipe:
          setup:
            - "Transaction at INSPECTION; repair_credit=6634.57; close scheduled with final_concession=7650.00, leaseback_days=0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: OperationsAdmin
            - call: "POST /sellers"
              payload: { email: "c12@x.com", full_name: "C Twelve" }
              as: OperationsAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /properties"
              payload: { seller_id: "${seller_id}", address_line: "111 Oak", zip_code: "90001", bedrooms: 3, living_area_sqft: 1800, comp_median_value: 500000, market_trend_pct: 0.02 }
              as: PricingAnalyst
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/offers"
              payload: { service_fee_pct: 0.05 }
              as: PricingAnalyst
              captures: { offer_id: $.data.id }
            - call: "POST /offers/${offer_id}/accept"
              payload: {}
              as: Seller
              as_user_id: "${seller_id}"
              captures: { txn_id: $.data.id }
            - call: "GET /offers/${offer_id}/assessment"
              payload: {}
              as: OperationsAdmin
              captures: { assess_id: "$.data[0].id" }
            - call: "POST /assessments/${assess_id}/repair-line-items"
              payload: { category: "ROOF", estimate_amount: 1234.567 }
              as: OperationsAdmin
            - call: "POST /assessments/${assess_id}/repair-line-items"
              payload: { category: "HVAC", estimate_amount: 899.991 }
              as: OperationsAdmin
            - call: "POST /assessments/${assess_id}/repair-line-items"
              payload: { category: "FOUNDATION", estimate_amount: 4500.005 }
              as: OperationsAdmin
            - call: "POST /assessments/${assess_id}/finalize"
              payload: { roof_condition: "GOOD", hvac_condition: "FAIR", foundation_condition: "GOOD" }
              as: OperationsAdmin
            - call: "POST /transactions/${txn_id}/schedule-close"
              payload: { close_date: "2026-03-15T00:00:00Z", leaseback_days: 0, final_concession: 7650.00 }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /transactions/${txn_id}/start-inspection"
              payload: {}
              as: OperationsAdmin
          trigger:
            - call: "POST /transactions/${txn_id}/close"
              payload: {}
              as: OperationsAdmin
          assert:
            - "Transaction.${txn_id}.status == CLOSED"
            - "Transaction.${txn_id}.final_net_proceeds == 470215.43"
            - "Property.${prop_id}.status == SOLD"

      - name: accept_expired_offer_returns_expired
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Offer.ISSUED_to_ACCEPTED
          - errors[ERR_OFFER_EXPIRED]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / offer_validity_window_expiry_half_open
          rationale: "The offer-expiry precondition at accept-time is asserted by the named §1.8 half-open-window instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: service_fee_and_preliminary_proceeds_at_issuance
        claim_type: Correct Result
        grounds:
          - calculations.preliminary_net_proceeds
          - entities.Offer.fields.service_fee
          - entities.Offer.fields.estimated_concession
        distinguishing_aspect: "At issuance with avm=510000, service_fee_pct=0.05: service_fee=25500.00, estimated_concession=5100.00, preliminary_net_proceeds=479400.00."
        test_recipe:
          setup: ["Property VALUED with avm=510000."]
          setup_api_calls:
            - call: "POST /sellers"
              payload: { email: "c13@x.com", full_name: "C Thirteen" }
              as: OperationsAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /properties"
              payload: { seller_id: "${seller_id}", address_line: "112 Oak", zip_code: "90001", bedrooms: 3, living_area_sqft: 1800, comp_median_value: 500000, market_trend_pct: 0.02 }
              as: PricingAnalyst
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /properties/${prop_id}/offers"
              payload: { service_fee_pct: 0.05 }
              as: PricingAnalyst
              captures: { offer_id: $.data.id }
          assert:
            - "Offer.${offer_id}.service_fee == 25500.00"
            - "Offer.${offer_id}.estimated_concession == 5100.00"
            - "Offer.${offer_id}.preliminary_net_proceeds == 479400.00"
            - "Offer.${offer_id}.avm_value_snapshot == 510000.00"

      - name: repair_credit_exceeds_cap_rejected
        claim_type: Constants Applied
        grounds:
          - calculations.repair_credit_aggregation
          - validations[priority=13]
          - errors[ERR_REPAIR_CREDIT_EXCEEDS_CAP]
        distinguishing_aspect: "With avm=510000 the repair cap is 51000.00 (10%); a finalized assessment whose repair line items sum to 51000.01 makes schedule-close fail ERR_REPAIR_CREDIT_EXCEEDS_CAP (422)."
        test_recipe:
          setup:
            - "Accepted offer (avm=510000); assessment FINALIZED with two repair line items 50000.00 and 1000.01 (sum 51000.01 > 51000.00 cap)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: OperationsAdmin
            - call: "POST /sellers"
              payload: { email: "c14@x.com", full_name: "C Fourteen" }
              as: OperationsAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /properties"
              payload: { seller_id: "${seller_id}", address_line: "113 Oak", zip_code: "90001", bedrooms: 5, living_area_sqft: 3000, comp_median_value: 500000, market_trend_pct: 0.02 }
              as: PricingAnalyst
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/offers"
              payload: { service_fee_pct: 0.05 }
              as: PricingAnalyst
              captures: { offer_id: $.data.id }
            - call: "POST /offers/${offer_id}/accept"
              payload: {}
              as: Seller
              as_user_id: "${seller_id}"
              captures: { txn_id: $.data.id }
            - call: "GET /offers/${offer_id}/assessment"
              payload: {}
              as: OperationsAdmin
              captures: { assess_id: "$.data[0].id" }
            - call: "POST /assessments/${assess_id}/repair-line-items"
              payload: { category: "FOUNDATION", estimate_amount: 50000.00 }
              as: OperationsAdmin
            - call: "POST /assessments/${assess_id}/repair-line-items"
              payload: { category: "ROOF", estimate_amount: 1000.01 }
              as: OperationsAdmin
            - call: "POST /assessments/${assess_id}/finalize"
              payload: { roof_condition: "POOR", hvac_condition: "POOR", foundation_condition: "POOR" }
              as: OperationsAdmin
          trigger:
            - call: "POST /transactions/${txn_id}/schedule-close"
              payload: { close_date: "2026-03-15T00:00:00Z", leaseback_days: 0, final_concession: 0 }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_REPAIR_CREDIT_EXCEEDS_CAP"
            - "HTTP status == 422"

      - name: leaseback_total_round_daily_then_multiply
        claim_type: Precision
        grounds:
          - calculations.leaseback_charge
          - entities.Transaction.fields.leaseback_daily_rate
          - entities.Transaction.fields.leaseback_total
        distinguishing_aspect: "With avm=510000, leaseback_days=10: leaseback_daily_rate=204.00 (=round(510000*0.0004,2)) and leaseback_total=2040.00 (=round(204.00*10,2)); rounding order is round-daily-then-multiply."
        test_recipe:
          setup:
            - "Accepted offer (avm=510000), assessment FINALIZED with no repairs; schedule-close with leaseback_days=10."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: OperationsAdmin
            - call: "POST /sellers"
              payload: { email: "c15@x.com", full_name: "C Fifteen" }
              as: OperationsAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /properties"
              payload: { seller_id: "${seller_id}", address_line: "114 Oak", zip_code: "90001", bedrooms: 3, living_area_sqft: 1800, comp_median_value: 500000, market_trend_pct: 0.02 }
              as: PricingAnalyst
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/offers"
              payload: { service_fee_pct: 0.05 }
              as: PricingAnalyst
              captures: { offer_id: $.data.id }
            - call: "POST /offers/${offer_id}/accept"
              payload: {}
              as: Seller
              as_user_id: "${seller_id}"
              captures: { txn_id: $.data.id }
            - call: "GET /offers/${offer_id}/assessment"
              payload: {}
              as: OperationsAdmin
              captures: { assess_id: "$.data[0].id" }
            - call: "POST /assessments/${assess_id}/finalize"
              payload: { roof_condition: "GOOD", hvac_condition: "GOOD", foundation_condition: "GOOD" }
              as: OperationsAdmin
          trigger:
            - call: "POST /transactions/${txn_id}/schedule-close"
              payload: { close_date: "2026-03-15T00:00:00Z", leaseback_days: 10, final_concession: 0 }
              as: Seller
              as_user_id: "${seller_id}"
          assert:
            - "Transaction.${txn_id}.leaseback_daily_rate == 204.00"
            - "Transaction.${txn_id}.leaseback_total == 2040.00"
            - "Transaction.${txn_id}.final_net_proceeds == 482460.00"

      - name: leaseback_days_above_max_rejected
        claim_type: Constants Applied
        grounds:
          - calculations.leaseback_charge
          - validations[priority=10]
          - errors[ERR_LEASEBACK_EXCEEDS_MAX]
        distinguishing_aspect: "schedule-close with leaseback_days=61 (> MAX_LEASEBACK_DAYS=60) returns ERR_LEASEBACK_EXCEEDS_MAX (422)."
        test_recipe:
          setup:
            - "Accepted offer, assessment FINALIZED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: OperationsAdmin
            - call: "POST /sellers"
              payload: { email: "c16@x.com", full_name: "C Sixteen" }
              as: OperationsAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /properties"
              payload: { seller_id: "${seller_id}", address_line: "115 Oak", zip_code: "90001", bedrooms: 3, living_area_sqft: 1800, comp_median_value: 500000, market_trend_pct: 0.02 }
              as: PricingAnalyst
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/offers"
              payload: { service_fee_pct: 0.05 }
              as: PricingAnalyst
              captures: { offer_id: $.data.id }
            - call: "POST /offers/${offer_id}/accept"
              payload: {}
              as: Seller
              as_user_id: "${seller_id}"
              captures: { txn_id: $.data.id }
            - call: "GET /offers/${offer_id}/assessment"
              payload: {}
              as: OperationsAdmin
              captures: { assess_id: "$.data[0].id" }
            - call: "POST /assessments/${assess_id}/finalize"
              payload: { roof_condition: "GOOD", hvac_condition: "GOOD", foundation_condition: "GOOD" }
              as: OperationsAdmin
          trigger:
            - call: "POST /transactions/${txn_id}/schedule-close"
              payload: { close_date: "2026-03-15T00:00:00Z", leaseback_days: 61, final_concession: 0 }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_LEASEBACK_EXCEEDS_MAX"
            - "HTTP status == 422"

      - name: net_proceeds_provisional_vs_final_divergence_stub
        claim_type: Variant Divergence
        grounds:
          - calculations.preliminary_net_proceeds
          - calculations.final_net_proceeds
        excluded_because:
          difficulty_instance: dual_variant_calc / net_proceeds_provisional_vs_final_diverge_on_transaction
          rationale: "Provisional-vs-final net-proceeds divergence is the core assertion of the named §1.8 instance."

  # ===========================================================================
  - section: validations
    instances:
      - name: reissue_not_reissuable_after_accept_returns_error
        claim_type: Violation -> Error
        grounds:
          - validations[priority=14]
          - state_machines.Property.UNDER_OFFER_to_UNDER_OFFER
          - errors[ERR_OFFER_NOT_REISSUABLE]
        distinguishing_aspect: "After the active offer is ACCEPTED (property IN_TRANSACTION), a re-issue POST /properties/{id}/offers returns ERR_OFFER_NOT_REISSUABLE (409)."
        test_recipe:
          setup:
            - "Property IN_TRANSACTION with an ACCEPTED offer; observe Property.version."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: OperationsAdmin
            - call: "POST /sellers"
              payload: { email: "c17@x.com", full_name: "C Seventeen" }
              as: OperationsAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /properties"
              payload: { seller_id: "${seller_id}", address_line: "116 Oak", zip_code: "90001", bedrooms: 3, living_area_sqft: 1800, comp_median_value: 500000, market_trend_pct: 0.02 }
              as: PricingAnalyst
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/offers"
              payload: { service_fee_pct: 0.05 }
              as: PricingAnalyst
              captures: { offer_id: $.data.id }
            - call: "POST /offers/${offer_id}/accept"
              payload: {}
              as: Seller
              as_user_id: "${seller_id}"
            - call: "GET /properties/${prop_id}"
              payload: {}
              as: PricingAnalyst
              captures: { prop_v: $.data.version }
          trigger:
            - call: "POST /properties/${prop_id}/offers"
              payload: { service_fee_pct: 0.05, expected_property_version: "${prop_v}" }
              as: PricingAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_OFFER_NOT_REISSUABLE"
            - "HTTP status == 409"

