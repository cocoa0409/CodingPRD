            - "Passholders A and B hold processed ACTIVE BRONZE passes, each with a CONFIRMED reservation for [09:00, 12:00) on that day → 2 overlapping windows, i.e. window capacity is exhausted while day capacity (2 of 4) is not."
            - "Passholder C holds a BRONZE pass that was created but never processed, so its pass_status is PENDING_PROCESSING."
