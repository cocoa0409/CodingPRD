# =============================================================================
# §1.9 Scaffold Corner Design (breadth probe)
# task 2484 — Home Improvement Pro Desk & Contractor Account
#
# Walked row-by-row from references/claim-extraction-guide.md against §1.1–§1.7
# of SCAFFOLD.yaml. `section:` values are the guide's nine sections; `claim_type:`
# values are the guide's per-section rows. Corners already asserted by §1.8 are
# emitted as `excluded_because:` stubs naming the covering difficulty instance.
#
# Fixture conventions reused throughout (all literals, no hidden state):
#   Store HD-101 : region MIDWEST, state IL, distance_rank 1, will_call_bay_slots 2,
#                  lift_gate_available true, tax_rate_pct 0.0825, max_stage_hours 48
#   SKUs         : SHINGLE-BUNDLE list 1999 | MORTAR-BAG list 2000 | TRIM-PACK list 1000
#   Clock        : starts at 2026-08-01T00:00:00Z; moved only via POST /pro/_clock/set_current_utc
#   Fabricated absent id: "00000000-0000-4000-8000-000000000000"
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:

      - name: create_store_returns_declared_fields_and_success_envelope
        claim_type: creation
        grounds:
          - entities.Store
          - endpoints[POST /pro/stores]
          - response_envelope.success
        distinguishing_aspect: "POST /pro/stores with every required field returns 201 with response_type object, echoes all eight input fields and stamps id / created_at / updated_at / version = 1."
        test_recipe:
          setup:
            - "Empty database; the logical clock sits at its default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /pro/stores"
              payload: { store_code: "HD-101", region_code: "MIDWEST", state_code: "IL", distance_rank: 1, will_call_bay_slots: 2, lift_gate_available: true, tax_rate_pct: 0.0825, max_stage_hours: 48 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id" }
          assert:
            - "http_status == 201"
            - "response_type == object"
            - "meta.api_request_id is present and meta.api_request_timestamp is present"
            - "Store.${store_id}.store_code == HD-101"
            - "Store.${store_id}.region_code == MIDWEST"
            - "Store.${store_id}.state_code == IL"
            - "Store.${store_id}.distance_rank == 1"
            - "Store.${store_id}.will_call_bay_slots == 2"
            - "Store.${store_id}.lift_gate_available == true"
            - "Store.${store_id}.tax_rate_pct == 0.0825"
            - "Store.${store_id}.max_stage_hours == 48"
            - "Store.${store_id}.version == 1"
            - "Store.${store_id}.created_at == 2026-08-01T00:00:00Z"

      - name: get_pro_account_returns_stored_and_computed_fields
        claim_type: retrieval
        grounds:
          - entities.ProAccount.fields.tier_code
          - entities.ProAccount.fields.trailing_volume_cents
          - endpoints[GET /pro/pro-accounts/{pro_account_id}]
        distinguishing_aspect: "GET /pro/pro-accounts/{id} on a freshly created PLATINUM-baseline account returns the stored inputs plus the computed tier fields (tier_code PLATINUM, tier_discount_pct 0.08) and an empty tax_exempt_state_codes array."
        test_recipe:
          setup:
            - "Store HD-101 exists; one account created with baseline_volume_cents 20000000."
          setup_api_calls:
            - call: "POST /pro/stores"
              payload: { store_code: "HD-101", region_code: "MIDWEST", state_code: "IL", distance_rank: 1, will_call_bay_slots: 2, lift_gate_available: true, tax_rate_pct: 0.0825, max_stage_hours: 48 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id" }
            - call: "POST /pro/pro-accounts"
              payload: { business_name: "Platinum Builders", home_store_id: "${store_id}", po_required: true, job_name_required: true, tier_review_mode: "PINNED_AT_REVIEW", baseline_volume_cents: 20000000 }
              as: PlatformAdmin
              captures: { acct_id: "$.data.id" }
          trigger:
            - call: "GET /pro/pro-accounts/${acct_id}"
              payload: {}
              as: ProDeskAssociate
          assert:
            - "http_status == 200"
            - "ProAccount.${acct_id}.business_name == Platinum Builders"
            - "ProAccount.${acct_id}.home_store_id == ${store_id}"
            - "ProAccount.${acct_id}.po_required == true"
            - "ProAccount.${acct_id}.job_name_required == true"
            - "ProAccount.${acct_id}.trailing_volume_cents == 20000000"
            - "ProAccount.${acct_id}.tier_code == PLATINUM"
            - "ProAccount.${acct_id}.tier_discount_pct == 0.08"
            - "ProAccount.${acct_id}.rebate_accrued_cents == 0"
            - "ProAccount.${acct_id}.tax_exempt_state_codes == []"
            - "ProAccount.${acct_id}.status == ACTIVE"
            - "ProAccount.${acct_id}.tier_reviewed_at == 2026-08-01T00:00:00Z"

      - name: list_stores_pagination_envelope_and_limit_bounds
        claim_type: listing
        grounds:
          - endpoints[GET /pro/stores]
          - response_envelope.pagination_fields
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "With three stores, GET /pro/stores?limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, the default page (no params) returns all 3 with has_more false, and limit=101 is rejected with ERR_INVALID_REQUEST because the declared max is 100."
        test_recipe:
          setup:
            - "Three stores HD-101, HD-102, HD-103 exist in region MIDWEST."
          setup_api_calls:
            - call: "POST /pro/stores"
              payload: { store_code: "HD-101", region_code: "MIDWEST", state_code: "IL", distance_rank: 1, will_call_bay_slots: 2, lift_gate_available: true, tax_rate_pct: 0.0825, max_stage_hours: 48 }
              as: PlatformAdmin
            - call: "POST /pro/stores"
              payload: { store_code: "HD-102", region_code: "MIDWEST", state_code: "IL", distance_rank: 2, will_call_bay_slots: 2, lift_gate_available: true, tax_rate_pct: 0.0825, max_stage_hours: 48 }
              as: PlatformAdmin
            - call: "POST /pro/stores"
              payload: { store_code: "HD-103", region_code: "MIDWEST", state_code: "IL", distance_rank: 3, will_call_bay_slots: 2, lift_gate_available: false, tax_rate_pct: 0.0825, max_stage_hours: 24 }
              as: PlatformAdmin
          trigger:
            - call: "GET /pro/stores"
              payload: { limit: 2, offset: 0 }
              as: PlatformAdmin
            - call: "GET /pro/stores"
              payload: {}
              as: PlatformAdmin
            - call: "GET /pro/stores"
              payload: { limit: 101, offset: 0 }
              as: PlatformAdmin
              captures: { err_limit: "$.data.error_id" }
          assert:
            - "first list: response_type == array, 2 rows returned, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "second list: 3 rows returned, total_count == 3, has_more == false, limit == 10, offset == 0"
            - "${err_limit} == ERR_INVALID_REQUEST"
            - "third list http_status == 400"

      - name: unknown_ids_return_entity_specific_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_STORE_NOT_FOUND]
          - errors[ERR_PRO_ACCOUNT_NOT_FOUND]
          - errors[ERR_PRO_ORDER_NOT_FOUND]
          - errors[ERR_JOB_QUOTE_NOT_FOUND]
          - errors[ERR_RESERVATION_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "Each single-resource GET given the fabricated id 00000000-0000-4000-8000-000000000000 returns 404 with its own entity-specific error_id — never a generic not-found and never 200."
        test_recipe:
          setup:
            - "Empty database; no row of any entity exists."
          setup_api_calls: []
          trigger:
            - call: "GET /pro/stores/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { e_store: "$.data.error_id" }
            - call: "GET /pro/store-stocks/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { e_stock: "$.data.error_id" }
            - call: "GET /pro/delivery-trucks/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StoreOperations
              captures: { e_truck: "$.data.error_id" }
            - call: "GET /pro/pro-accounts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { e_acct: "$.data.error_id" }
            - call: "GET /pro/credit-lines/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CreditManager
              captures: { e_cl: "$.data.error_id" }
            - call: "GET /pro/tax-exempt-certificates/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: TaxComplianceOfficer
              captures: { e_cert: "$.data.error_id" }
            - call: "GET /pro/job-quotes/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProDeskAssociate
              captures: { e_quote: "$.data.error_id" }
            - call: "GET /pro/quote-lines/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProDeskAssociate
              captures: { e_qline: "$.data.error_id" }
            - call: "GET /pro/pro-orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProDeskAssociate
              captures: { e_order: "$.data.error_id" }
            - call: "GET /pro/order-lines/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProDeskAssociate
              captures: { e_oline: "$.data.error_id" }
            - call: "GET /pro/reservations/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StoreOperations
              captures: { e_resv: "$.data.error_id" }
            - call: "GET /pro/will-call-stagings/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StoreOperations
              captures: { e_staging: "$.data.error_id" }
            - call: "GET /pro/delivery-appointments/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StoreOperations
              captures: { e_appt: "$.data.error_id" }
            - call: "GET /pro/rebate-accruals/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CreditManager
              captures: { e_rebate: "$.data.error_id" }
            - call: "GET /pro/return-requests/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CreditManager
              captures: { e_ret: "$.data.error_id" }
          assert:
            - "every call above returned http_status == 404 with response_type == error"
            - "${e_store} == ERR_STORE_NOT_FOUND"
            - "${e_stock} == ERR_STORE_STOCK_NOT_FOUND"
            - "${e_truck} == ERR_DELIVERY_TRUCK_NOT_FOUND"
            - "${e_acct} == ERR_PRO_ACCOUNT_NOT_FOUND"
            - "${e_cl} == ERR_CREDIT_LINE_NOT_FOUND"
            - "${e_cert} == ERR_TAX_EXEMPT_CERTIFICATE_NOT_FOUND"
            - "${e_quote} == ERR_JOB_QUOTE_NOT_FOUND"
            - "${e_qline} == ERR_QUOTE_LINE_NOT_FOUND"
            - "${e_order} == ERR_PRO_ORDER_NOT_FOUND"
            - "${e_oline} == ERR_ORDER_LINE_NOT_FOUND"
            - "${e_resv} == ERR_RESERVATION_NOT_FOUND"
            - "${e_staging} == ERR_WILL_CALL_STAGING_NOT_FOUND"
            - "${e_appt} == ERR_DELIVERY_APPOINTMENT_NOT_FOUND"
            - "${e_rebate} == ERR_REBATE_ACCRUAL_NOT_FOUND"
            - "${e_ret} == ERR_RETURN_REQUEST_NOT_FOUND"

      - name: create_pro_order_missing_required_fields_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints[POST /pro/pro-orders]
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /pro/pro-orders omitting payment_method (a required input with no declared default) returns ERR_INVALID_REQUEST 400 and persists nothing, while the same body with payment_method present returns 201."
        test_recipe:
          setup:
            - "Store HD-101 and one MEMBER account exist."
          setup_api_calls:
            - call: "POST /pro/stores"
              payload: { store_code: "HD-101", region_code: "MIDWEST", state_code: "IL", distance_rank: 1, will_call_bay_slots: 2, lift_gate_available: true, tax_rate_pct: 0.0825, max_stage_hours: 48 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id" }
            - call: "POST /pro/pro-accounts"
              payload: { business_name: "Corner Handyman", home_store_id: "${store_id}", po_required: false, job_name_required: false, tier_review_mode: "PINNED_AT_REVIEW", baseline_volume_cents: 0 }
              as: PlatformAdmin
              captures: { acct_id: "$.data.id" }
          trigger:
            - call: "POST /pro/pro-orders"
              payload: { pro_account_id: "${acct_id}", fulfillment_store_id: "${store_id}", delivery_mode: "WILL_CALL" }
              as: ContractorAdmin
              as_user_id: "${acct_id}"
              captures: { err_missing: "$.data.error_id" }
            - call: "POST /pro/pro-orders"
              payload: { pro_account_id: "${acct_id}", fulfillment_store_id: "${store_id}", payment_method: "CARD", delivery_mode: "WILL_CALL" }
              as: ContractorAdmin
              as_user_id: "${acct_id}"
              captures: { order_id: "$.data.id" }
          assert:
            - "${err_missing} == ERR_INVALID_REQUEST"
            - "first attempt http_status == 400"
            - "GET /pro/pro-orders?pro_account_id=${acct_id} returns exactly 1 row"
            - "ProOrder.${order_id}.payment_method == CARD"
            - "ProOrder.${order_id}.fulfillment_status == DRAFT"

      - name: create_pro_account_omitting_optional_inputs_applies_declared_defaults
        claim_type: defaults
        grounds:
          - entities.ProAccount.fields.po_required
          - entities.ProAccount.fields.tier_review_mode
          - entities.ProAccount.fields.baseline_volume_cents
          - entities.ProAccount.fields.status
        distinguishing_aspect: "Creating an account with only business_name and home_store_id applies the declared defaults po_required false, job_name_required false, tier_review_mode PINNED_AT_REVIEW, baseline_volume_cents 0, status ACTIVE — and the zero baseline resolves to tier MEMBER with discount 0.00."
        test_recipe:
          setup:
            - "Store HD-101 exists."
          setup_api_calls:
            - call: "POST /pro/stores"
              payload: { store_code: "HD-101", region_code: "MIDWEST", state_code: "IL", distance_rank: 1, will_call_bay_slots: 2, lift_gate_available: true, tax_rate_pct: 0.0825, max_stage_hours: 48 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id" }
          trigger:
            - call: "POST /pro/pro-accounts"
              payload: { business_name: "Bare Minimum LLC", home_store_id: "${store_id}" }
              as: PlatformAdmin
              captures: { acct_id: "$.data.id" }
          assert:
            - "http_status == 201"
            - "ProAccount.${acct_id}.po_required == false"
            - "ProAccount.${acct_id}.job_name_required == false"
            - "ProAccount.${acct_id}.tier_review_mode == PINNED_AT_REVIEW"
            - "ProAccount.${acct_id}.baseline_volume_cents == 0"
            - "ProAccount.${acct_id}.trailing_volume_cents == 0"
            - "ProAccount.${acct_id}.tier_code == MEMBER"
            - "ProAccount.${acct_id}.tier_discount_pct == 0.00"
            - "ProAccount.${acct_id}.status == ACTIVE"

      - name: store_stock_computed_units_start_at_zero_reserved
        claim_type: computed_fields
        grounds:
          - entities.StoreStock.fields.reserved_units
          - entities.StoreStock.fields.available_units
          - endpoints[POST /pro/store-stocks]
        distinguishing_aspect: "A brand-new StoreStock row with on_hand_units 600 reports reserved_units 0 and available_units 600 — both computed, neither accepted from the client (the POST input declares only store_id, sku, on_hand_units, list_unit_price_cents)."
        test_recipe:
          setup:
            - "Store HD-101 exists with no stock rows."
          setup_api_calls:
            - call: "POST /pro/stores"
              payload: { store_code: "HD-101", region_code: "MIDWEST", state_code: "IL", distance_rank: 1, will_call_bay_slots: 2, lift_gate_available: true, tax_rate_pct: 0.0825, max_stage_hours: 48 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id" }
          trigger:
            - call: "POST /pro/store-stocks"
              payload: { store_id: "${store_id}", sku: "SHINGLE-BUNDLE", on_hand_units: 600, list_unit_price_cents: 1999 }
              as: PlatformAdmin
              captures: { stock_id: "$.data.id" }
          assert:
            - "http_status == 201"
            - "StoreStock.${stock_id}.on_hand_units == 600"
            - "StoreStock.${stock_id}.reserved_units == 0"
            - "StoreStock.${stock_id}.available_units == 600"
            - "StoreStock.${stock_id}.list_unit_price_cents == 1999"
            - "StoreStock.${stock_id}.version == 1"

      - name: pro_order_system_fields_are_server_generated_and_input_ignored
        claim_type: system_fields
        grounds:
          - entities.ProOrder.fields.fulfillment_status
          - entities.ProOrder.fields.credit_status
          - endpoints[POST /pro/pro-orders]
        distinguishing_aspect: "A create body that smuggles fulfillment_status RESERVED, credit_status PAID, id, version 99 and total_cents 1 is ignored field-for-field: the row comes back DRAFT / UNBILLED with a server-minted id, version 1 and null money fields."
        test_recipe:
          setup:
            - "Store HD-101 and one MEMBER account exist."
          setup_api_calls:
            - call: "POST /pro/stores"
              payload: { store_code: "HD-101", region_code: "MIDWEST", state_code: "IL", distance_rank: 1, will_call_bay_slots: 2, lift_gate_available: true, tax_rate_pct: 0.0825, max_stage_hours: 48 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id" }
            - call: "POST /pro/pro-accounts"
              payload: { business_name: "Corner Handyman", home_store_id: "${store_id}" }
              as: PlatformAdmin
              captures: { acct_id: "$.data.id" }
          trigger:
            - call: "POST /pro/pro-orders"
              payload: { pro_account_id: "${acct_id}", fulfillment_store_id: "${store_id}", payment_method: "CARD", delivery_mode: "WILL_CALL", fulfillment_status: "RESERVED", credit_status: "PAID", id: "11111111-1111-4111-8111-111111111111", version: 99, total_cents: 1 }
              as: ContractorAdmin
              as_user_id: "${acct_id}"
              captures: { order_id: "$.data.id" }
          assert:
            - "http_status == 201"
            - "${order_id} != 11111111-1111-4111-8111-111111111111"
            - "ProOrder.${order_id}.fulfillment_status == DRAFT"
            - "ProOrder.${order_id}.credit_status == UNBILLED"
            - "ProOrder.${order_id}.version == 1"
            - "ProOrder.${order_id}.total_cents == null"
            - "ProOrder.${order_id}.subtotal_cents == null"
            - "ProOrder.${order_id}.priced_at == null"

      - name: enum_and_positive_integer_constraints_rejected_on_write
        claim_type: type_constraints
        grounds:
          - entities.ProOrder.fields.delivery_mode
          - entities.OrderLine.fields.qty_units
          - entities.WillCallStaging.fields.stage_hours
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Four separate writes are each rejected with ERR_INVALID_REQUEST 400: delivery_mode AIRDROP (enum out of range), qty_units 0, credit limit_cents 0, and jobsite_access_type HELICOPTER."
        test_recipe:
          setup:
            - "Store HD-101 stocking SHINGLE-BUNDLE, one MEMBER account, one DRAFT will-call order."
          setup_api_calls:
            - call: "POST /pro/stores"
              payload: { store_code: "HD-101", region_code: "MIDWEST", state_code: "IL", distance_rank: 1, will_call_bay_slots: 2, lift_gate_available: true, tax_rate_pct: 0.0825, max_stage_hours: 48 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id" }
            - call: "POST /pro/store-stocks"
              payload: { store_id: "${store_id}", sku: "SHINGLE-BUNDLE", on_hand_units: 600, list_unit_price_cents: 1999 }
              as: PlatformAdmin
            - call: "POST /pro/pro-accounts"
              payload: { business_name: "Corner Handyman", home_store_id: "${store_id}" }
              as: PlatformAdmin
              captures: { acct_id: "$.data.id" }
            - call: "POST /pro/delivery-trucks"
              payload: { store_id: "${store_id}", truck_code: "T-1", lift_gate_equipped: true, access_types_supported: ["CURBSIDE"], turnaround_buffer_minutes: 30 }
              as: StoreOperations
              captures: { truck_id: "$.data.id" }
            - call: "POST /pro/pro-orders"
              payload: { pro_account_id: "${acct_id}", fulfillment_store_id: "${store_id}", payment_method: "CARD", delivery_mode: "WILL_CALL" }
              as: ContractorAdmin
              as_user_id: "${acct_id}"
              captures: { order_id: "$.data.id" }
          trigger:
            - call: "POST /pro/pro-orders"
              payload: { pro_account_id: "${acct_id}", fulfillment_store_id: "${store_id}", payment_method: "CARD", delivery_mode: "AIRDROP" }
              as: ContractorAdmin
              as_user_id: "${acct_id}"
              captures: { e_enum: "$.data.error_id" }
            - call: "POST /pro/pro-orders/${order_id}/lines"
              payload: { sku: "SHINGLE-BUNDLE", qty_units: 0 }
              as: ContractorAdmin
              as_user_id: "${acct_id}"
              captures: { e_qty: "$.data.error_id" }
            - call: "POST /pro/credit-lines"
              payload: { pro_account_id: "${acct_id}", limit_cents: 0, terms_days: 30 }
              as: CreditManager
              captures: { e_limit: "$.data.error_id" }
            - call: "POST /pro/delivery-appointments"
              payload: { pro_order_id: "${order_id}", delivery_truck_id: "${truck_id}", window_start: "2026-08-05T09:00:00Z", window_end: "2026-08-05T11:00:00Z", jobsite_access_type: "HELICOPTER" }
              as: StoreOperations
              captures: { e_access: "$.data.error_id" }
          assert:
            - "${e_enum} == ERR_INVALID_REQUEST"
            - "${e_qty} == ERR_INVALID_REQUEST"
            - "${e_limit} == ERR_INVALID_REQUEST"
            - "${e_access} == ERR_INVALID_REQUEST"
            - "all four attempts returned http_status == 400"
            - "GET /pro/pro-orders/${order_id}/lines returns 0 rows"
            - "GET /pro/credit-lines?pro_account_id=${acct_id} returns 0 rows"

      - name: create_credit_line_for_unknown_account_returns_pro_account_not_found
        claim_type: parent_relationships
        grounds:
          - entities.CreditLine.fields.pro_account_id
          - validations[priority=4]
          - errors[ERR_PRO_ACCOUNT_NOT_FOUND]
        distinguishing_aspect: "The flat topology validates FK payload fields: POST /pro/credit-lines naming a non-existent pro_account_id returns ERR_PRO_ACCOUNT_NOT_FOUND 404 and creates no row, and POST /pro/store-stocks naming a non-existent store_id returns ERR_STORE_NOT_FOUND."
        test_recipe:
          setup:
            - "Empty database except one store, so the fabricated FK targets genuinely do not exist."
          setup_api_calls:
            - call: "POST /pro/stores"
              payload: { store_code: "HD-101", region_code: "MIDWEST", state_code: "IL", distance_rank: 1, will_call_bay_slots: 2, lift_gate_available: true, tax_rate_pct: 0.0825, max_stage_hours: 48 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id" }
          trigger:
            - call: "POST /pro/credit-lines"
              payload: { pro_account_id: "00000000-0000-4000-8000-000000000000", limit_cents: 500000, terms_days: 30 }
              as: CreditManager
              captures: { e_acct: "$.data.error_id" }
            - call: "POST /pro/store-stocks"
              payload: { store_id: "00000000-0000-4000-8000-000000000000", sku: "SHINGLE-BUNDLE", on_hand_units: 10, list_unit_price_cents: 1999 }
              as: PlatformAdmin
              captures: { e_store: "$.data.error_id" }
          assert:
            - "${e_acct} == ERR_PRO_ACCOUNT_NOT_FOUND"
