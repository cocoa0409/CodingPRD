        distinguishing_aspect: "GET /api/projects/{id} returns envelope with meta.api_request_id, response_type=object, data=Project"
        test_recipe:
          setup: ["project exists"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
