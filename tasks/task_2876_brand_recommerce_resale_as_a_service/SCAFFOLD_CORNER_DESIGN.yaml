          - errors[ERR_ORDER_RETURN_NOT_SETTLEABLE]
          - calculations.return_refund_settlement
        distinguishing_aspect: "REPLACE requires reason_type WARRANTY_DEFECT: a remorse return is refused with ERR_ORDER_RETURN_NOT_SETTLEABLE (409) even when a perfectly good substitute unit is LISTED, and the same order then settles as REFUND with the remorse deductions applied."
