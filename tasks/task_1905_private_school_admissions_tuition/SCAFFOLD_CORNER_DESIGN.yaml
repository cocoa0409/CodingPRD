        claim_type: precision
        grounds: [calculations.aid_award_amount]
        distinguishing_aspect: "Discretionary income exactly at the tier-1 width (2,500,000) contributes exactly 300,000 EFC with zero tier-2 spill; against tuition 4,000,000 the need 3,700,000 exceeds the 90% cap so the award is exactly 3,600,000."
