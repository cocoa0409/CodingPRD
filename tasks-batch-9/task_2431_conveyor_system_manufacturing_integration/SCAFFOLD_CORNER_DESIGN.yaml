        claim_type: side_effect_execution
        grounds:
          - state_machines.ChangeOrder.SUBMITTED_to_APPROVED
          - state_machines.SimulationRun.COMPLETE_to_STALE
          - state_machines.CutoverWindow.SCHEDULED_to_BLOCKED_STALE_DESIGN
          - state_machines.FabricationLot.FAT_PASSED_to_HOLD
        excluded_because:
          difficulty_instance: transitive_cascade / change_order_approval_cascades_design_simulation_window_lot_hold
          rationale: "That instance asserts all four cascade links plus the untouched control rows in one request."

