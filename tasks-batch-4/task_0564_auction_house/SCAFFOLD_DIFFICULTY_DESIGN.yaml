scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dv_invoice_storage_provisional_vs_final
        grounds:
          - calculations.storage_fee
          - entities.Invoice.fields.storage_fee_cents
          - state_machines.Invoice.fulfillment_PENDING_to_READY
        distinguishing_aspect: "Same Invoice storage fee is 0 (provisional) at hammer but 1500 (final) once readied 10 days later — a buyer-domain (Invoice) dual variant, distinct from the seller-domain settlement variant."
        test_recipe:
          setup:
            - "Clock at 2026-06-10. A lot (reserve 0, starting 200000) is OPEN with one bid of 250000, then hammered, creating an Invoice with storage_start_at=2026-06-10 and provisional storage_fee_cents=0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: AuctionStaff
            - call: "POST /salerooms"
              payload: { name: "Main", location: "NYC", capacity: 100 }
              as: AuctionStaff
              captures: { sr: "$.data.id" }
            - call: "POST /auctions"
              payload: { title: "Spring", sale_type: "LIVE", saleroom_id: "${sr}", scheduled_start: "2026-06-10T10:00:00Z", scheduled_end: "2026-06-10T18:00:00Z" }
              as: AuctionStaff
              captures: { au: "$.data.id" }
            - call: "POST /consignors"
              payload: { display_name: "Estate A", email: "a@x.com" }
              as: AuctionStaff
              captures: { cn: "$.data.id" }
            - call: "POST /consignments"
              payload: { consignor_id: "${cn}", commission_rate: 0.15, estimate_low_cents: 100000, estimate_high_cents: 200000, intake_window_start: "2026-05-02T09:00:00Z", intake_window_end: "2026-05-02T10:00:00Z" }
              as: AuctionStaff
              captures: { cg: "$.data.id" }
            - call: "POST /consignments/${cg}/appraise"
              payload: { appraised_low_cents: 100000, appraised_high_cents: 200000 }
              as: Appraiser
            - call: "POST /consignments/${cg}/decision"
              payload: { outcome: "ACCEPT" }
              as: AuctionStaff
            - call: "POST /lots"
              payload: { consignment_id: "${cg}", auction_id: "${au}", title: "Vase", category: "CERAMICS", reserve_cents: 0, starting_bid_cents: 200000, estimate_low_cents: 100000, estimate_high_cents: 200000, lot_number: 1 }
              as: AuctionStaff
              captures: { lot: "$.data.id" }
            - call: "POST /auctions/${au}/open"
              payload: {}
              as: AuctionStaff
            - call: "POST /lots/${lot}/open"
              payload: {}
              as: AuctionStaff
              captures: { lot_v: "$.data.version" }
            - call: "POST /bidders"
              payload: { display_name: "Buyer", email: "b@x.com", paddle_number: "P1", deposit_cents: 0 }
              as: AuctionStaff
              captures: { bd: "$.data.id" }
            - call: "POST /lots/${lot}/bids"
              payload: { bidder_id: "${bd}", bid_type: "LIVE", amount_cents: 250000, expected_lot_version: "${lot_v}" }
              as: Bidder
              as_user_id: "${bd}"
            - call: "POST /lots/${lot}/hammer"
              payload: {}
              as: AuctionStaff
          trigger:
            - call: "GET /invoices?bidder_id=${bd}&auction_id=${au}"
              payload: {}
              as: AuctionStaff
              captures: { inv: "$.data[0].id", storage_prov: "$.data[0].storage_fee_cents", total_prov: "$.data[0].total_due_cents" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T00:00:00Z" }
              as: AuctionStaff
            - call: "POST /invoices/${inv}/ready"
              payload: { fulfillment_method: "PICKUP" }
              as: AuctionStaff
              captures: { storage_final: "$.data.storage_fee_cents", total_final: "$.data.total_due_cents" }
          assert:
            - "${storage_prov} == 0"
            - "${total_prov} == 312500"
            - "${storage_final} == 1500"
            - "${total_final} == 314000"

      - name: dv_settlement_net_provisional_vs_final
        grounds:
          - calculations.settlement_net_payout
          - entities.Settlement.fields.net_payout_cents
          - state_machines.Dispute.UNDER_REVIEW_to_UPHELD
        distinguishing_aspect: "Settlement net_payout is 637500 provisionally (both lots counted) but 425000 finally after an upheld dispute rescinds L2 — a seller-domain (Settlement) variant on a different metric than the buyer storage variant."
        test_recipe:
          setup:
            - "One consignment (commission 0.15) supplies L1 and L2. Bidder bd wins L1 at 500000 and L2 at 250000; both HAMMERED into one Invoice with two lines. A DRAFT Settlement exists (gross 750000, net 637500). An authenticity dispute on L2's line is UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /salerooms"
              payload: { name: "Main", location: "NYC", capacity: 100 }
              as: AuctionStaff
              captures: { sr: "$.data.id" }
            - call: "POST /auctions"
              payload: { title: "Spring", sale_type: "LIVE", saleroom_id: "${sr}", scheduled_start: "2026-06-10T10:00:00Z", scheduled_end: "2026-06-10T18:00:00Z" }
              as: AuctionStaff
              captures: { au: "$.data.id" }
            - call: "POST /consignors"
              payload: { display_name: "Estate A", email: "a@x.com" }
              as: AuctionStaff
              captures: { cn: "$.data.id" }
            - call: "POST /consignments"
              payload: { consignor_id: "${cn}", commission_rate: 0.15, estimate_low_cents: 100000, estimate_high_cents: 900000, intake_window_start: "2026-05-02T09:00:00Z", intake_window_end: "2026-05-02T10:00:00Z" }
              as: AuctionStaff
              captures: { cg: "$.data.id" }
            - call: "POST /consignments/${cg}/appraise"
              payload: { appraised_low_cents: 100000, appraised_high_cents: 900000 }
              as: Appraiser
            - call: "POST /consignments/${cg}/decision"
              payload: { outcome: "ACCEPT" }
              as: AuctionStaff
            - call: "POST /lots"
              payload: { consignment_id: "${cg}", auction_id: "${au}", title: "L1", category: "ART", reserve_cents: 0, starting_bid_cents: 400000, estimate_low_cents: 100000, estimate_high_cents: 900000, lot_number: 1 }
              as: AuctionStaff
              captures: { lot1: "$.data.id" }
            - call: "POST /lots"
              payload: { consignment_id: "${cg}", auction_id: "${au}", title: "L2", category: "ART", reserve_cents: 0, starting_bid_cents: 200000, estimate_low_cents: 100000, estimate_high_cents: 900000, lot_number: 2 }
              as: AuctionStaff
              captures: { lot2: "$.data.id" }
            - call: "POST /auctions/${au}/open"
              payload: {}
              as: AuctionStaff
            - call: "POST /lots/${lot1}/open"
              payload: {}
              as: AuctionStaff
              captures: { lot1_v: "$.data.version" }
            - call: "POST /lots/${lot2}/open"
              payload: {}
              as: AuctionStaff
              captures: { lot2_v: "$.data.version" }
            - call: "POST /bidders"
              payload: { display_name: "Buyer", email: "b@x.com", paddle_number: "P1", deposit_cents: 0 }
              as: AuctionStaff
              captures: { bd: "$.data.id" }
            - call: "POST /lots/${lot1}/bids"
              payload: { bidder_id: "${bd}", bid_type: "LIVE", amount_cents: 500000, expected_lot_version: "${lot1_v}" }
              as: Bidder
              as_user_id: "${bd}"
            - call: "POST /lots/${lot2}/bids"
              payload: { bidder_id: "${bd}", bid_type: "LIVE", amount_cents: 250000, expected_lot_version: "${lot2_v}" }
              as: Bidder
              as_user_id: "${bd}"
            - call: "POST /lots/${lot1}/hammer"
              payload: {}
              as: AuctionStaff
            - call: "POST /lots/${lot2}/hammer"
              payload: {}
              as: AuctionStaff
            - call: "POST /consignments/${cg}/settlement"
              payload: {}
              as: SettlementOfficer
              captures: { st: "$.data.id" }
            - call: "GET /invoice-lines?lot_id=${lot2}"
              payload: {}
              as: AuctionStaff
              captures: { line2: "$.data[0].id" }
            - call: "POST /disputes"
              payload: { invoice_line_id: "${line2}", reason: "Attribution challenged" }
              as: Bidder
              as_user_id: "${bd}"
              captures: { dsp: "$.data.id" }
            - call: "POST /disputes/${dsp}/review"
              payload: {}
              as: Appraiser
          trigger:
            - call: "GET /settlements/${st}"
              payload: {}
              as: SettlementOfficer
              captures: { gross_prov: "$.data.gross_hammer_cents", net_prov: "$.data.net_payout_cents" }
            - call: "POST /disputes/${dsp}/resolve"
              payload: { outcome: "UPHELD", resolution_notes: "not authentic" }
              as: Appraiser
            - call: "GET /settlements/${st}"
              payload: {}
              as: SettlementOfficer
              captures: { gross_final: "$.data.gross_hammer_cents", net_final: "$.data.net_payout_cents" }
          assert:
            - "${gross_prov} == 750000"
            - "${net_prov} == 637500"
            - "${gross_final} == 500000"
            - "${net_final} == 425000"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: cf_buyers_premium_tiered_marginal
        grounds:
          - calculations.buyers_premium
          - entities.InvoiceLine.fields.buyers_premium_cents
          - state_machines.Lot.OPEN_to_HAMMERED
        distinguishing_aspect: "Mode (a): buyer's premium on hammer 500000 = 0.25*300000 + 0.20*200000 = 115000 via marginal tier selection across three bands (non-linear, >=3 inputs)."
        test_recipe:
          setup:
            - "A lot (reserve 0, starting 400000) is OPEN with one bid of 500000, ready to hammer."
          setup_api_calls:
            - call: "POST /salerooms"
              payload: { name: "Main", location: "NYC", capacity: 100 }
              as: AuctionStaff
              captures: { sr: "$.data.id" }
            - call: "POST /auctions"
              payload: { title: "Spring", sale_type: "LIVE", saleroom_id: "${sr}", scheduled_start: "2026-06-10T10:00:00Z", scheduled_end: "2026-06-10T18:00:00Z" }
