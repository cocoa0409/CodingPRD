            - call: "POST /networks"
              payload: { network_code: "NDC", display_name: "Net DC" }
              as: NetworkAdmin
              captures: { ndc: $.data.id }
            - call: "POST /networks/${ndc}/hubs"
              payload: { hub_code: "HDC", daily_capacity_dozens: 500, territory_region: "RDC" }
              as: NetworkAdmin
              captures: { hdc: $.data.id }
            - call: "POST /networks/${ndc}/hubs/${hdc}/lines"
              payload: { line_kind: "CONTINUOUS_FRYER", rated_dozens_per_hour: 100, service_interval_hours: 100 }
              as: HubManager
              captures: { ldc: $.data.id }
            - call: "POST /networks/${ndc}/doors"
              payload: { door_kind: "SPOKE", ownership: "FRANCHISE", territory_region: "RDC", hub_id: "${hdc}" }
              as: NetworkAdmin
              captures: { ddc1: $.data.id }
            - call: "POST /networks/${ndc}/doors"
              payload: { door_kind: "THEATER", ownership: "COMPANY", territory_region: "RDC" }
              as: NetworkAdmin
              captures: { ddc2: $.data.id }
          trigger:
            - call: "POST /networks/${ndc}/hubs/${hdc}/lines/${ldc}/decommission"
              payload: {}
              as: HubManager
          assert:
            - "EquipmentLine.${ldc}.line_status == DECOMMISSIONED"
            - "Door.${ddc1}.door_status == SUSPENDED (hub left with no OPERATIONAL/DEGRADED line)"
            - "Door.${ddc2}.door_status == ACTIVE (self-supplied theater door unaffected)"

      - name: ops_run_checkpoint_expires_stale_scheduled_batches
        claim_type: ops_run_checkpoint
        grounds: [calculations.network_posture, endpoints]
        distinguishing_aspect: "Ops-run at 2026-09-02 auto-cancels SCHEDULED batches with production_date 2026-09-01 (stale epoch) and reports expired_batch_count; today's SCHEDULED batches survive."
        test_recipe:
          setup: ["Network NOR, hub HOR (cap 500), line LOR; batch BOR1 SCHEDULED for 2026-09-01, batch BOR2 SCHEDULED for 2026-09-02; clock set to 2026-09-02T00:00:00Z"]
          setup_api_calls:
            - call: "POST /networks"
              payload: { network_code: "NOR", display_name: "Net OR" }
              as: NetworkAdmin
              captures: { nor: $.data.id }
            - call: "POST /networks/${nor}/hubs"
              payload: { hub_code: "HOR", daily_capacity_dozens: 500, territory_region: "ROR" }
              as: NetworkAdmin
              captures: { hor: $.data.id }
            - call: "POST /networks/${nor}/hubs/${hor}/lines"
              payload: { line_kind: "GLAZE_WATERFALL", rated_dozens_per_hour: 80, service_interval_hours: 100 }
              as: HubManager
              captures: { lor: $.data.id }
            - call: "POST /networks/${nor}/hubs/${hor}/batches"
              payload: { equipment_line_id: "${lor}", production_date: "2026-09-01", planned_dozens: 40 }
              as: HubManager
              captures: { bor1: $.data.id }
            - call: "POST /networks/${nor}/hubs/${hor}/batches"
              payload: { equipment_line_id: "${lor}", production_date: "2026-09-02", planned_dozens: 40 }
              as: HubManager
              captures: { bor2: $.data.id }
            - call: "POST /networks/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "POST /networks/${nor}/ops-runs"
              payload: {}
              as: NetworkAdmin
              captures: { expired_batches: $.data.expired_batch_count, run_idx: $.data.ops_run_index }
          assert:
            - "ProductionBatch.${bor1}.batch_status == CANCELLED (stale SCHEDULED batch swept)"
            - "ProductionBatch.${bor2}.batch_status == SCHEDULED (same-day batch survives)"
            - "expired_batch_count == 1 and ops_run_index == 1"

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_consistency_committed_dozens_visible_in_response_and_read
        claim_type: immediate
        grounds: [entities.Hub, state_machines.ProductionBatch.SCHEDULED_to_COMMITTED]
        distinguishing_aspect: "Consistency model immediate: after commit, the SAME response reflects the mutation and a subsequent GET shows committed_dozens_today updated with no delay."
        test_recipe:
          setup: ["Network NIC, hub HIC (cap 500), line LIC; batch BIC SCHEDULED planned 60"]
          setup_api_calls:
            - call: "POST /networks"
              payload: { network_code: "NIC", display_name: "Net IC" }
              as: NetworkAdmin
              captures: { nic: $.data.id }
            - call: "POST /networks/${nic}/hubs"
              payload: { hub_code: "HIC", daily_capacity_dozens: 500, territory_region: "RIC" }
              as: NetworkAdmin
              captures: { hic: $.data.id, hic_v: $.data.version }
            - call: "POST /networks/${nic}/hubs/${hic}/lines"
              payload: { line_kind: "CONTINUOUS_FRYER", rated_dozens_per_hour: 100, service_interval_hours: 100 }
              as: HubManager
              captures: { lic: $.data.id }
            - call: "POST /networks/${nic}/hubs/${hic}/batches"
              payload: { equipment_line_id: "${lic}", production_date: "2026-09-01", planned_dozens: 60 }
              as: HubManager
              captures: { bic: $.data.id }
          trigger:
            - call: "POST /networks/${nic}/hubs/${hic}/batches/${bic}/commit"
              payload: { expected_hub_version: "${hic_v}" }
              as: HubManager
            - call: "GET /networks/${nic}/hubs/${hic}"
              payload: {}
              as: NetworkAdmin
              captures: { hic_after: $.data.committed_dozens_today }
          assert:
            - "Commit response batch_status == COMMITTED"
            - "GET hub shows committed_dozens_today == 60 immediately (no reconciliation lag)"
