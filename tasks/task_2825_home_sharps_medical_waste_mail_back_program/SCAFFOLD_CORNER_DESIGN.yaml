            - call: "POST /sharps/patients"
              payload: { full_name: "Cora Diaz", state_rule_id: "${sr_ca}", therapy_type: "INSULIN_PEN_NEEDLES", weekly_sharps_count: 20, contact_email: "cora@example.com" }
              as: ProgramAdmin
              captures: { pat_c: $.data.id }
            - call: "POST /sharps/patients/${pat_c}/eligibility-review"
              payload: { decision: "APPROVE" }
              as: ProgramAdmin
            - call: "POST /sharps/enrollments"
              payload: { patient_id: "${pat_c}", sponsorship_program_id: "${prog}", cadence_days: 30, kits_authorized: 2 }
              as: ProgramAdmin
              captures: { enr_c: $.data.id }
            - call: "POST /sharps/enrollments/${enr_c}/submit"
              payload: {}
              as: ProgramAdmin
            - call: "POST /sharps/enrollments/${enr_c}/sponsor-decision"
              payload: { decision: "APPROVE" }
              as: SponsorRepresentative
              as_user_id: "${sp_nw}"
              captures: { enr_c_v: $.data.version }
            - call: "POST /sharps/enrollments/${enr_c}/kits"
              payload: { expected_enrollment_version: "${enr_c_v}" }
              as: ProgramAdmin
              captures: { kit_c: $.data.id }
            - call: "POST /sharps/kits/${kit_c}/acknowledge-receipt"
              payload: {}
              as: ProgramAdmin
            - call: "POST /sharps/kits/${kit_c}/seal"
              payload: { fill_units: 60, sealed_gross_weight_grams: 1200 }
              as: ProgramAdmin
            - call: "POST /sharps/kits/${kit_c}/return-labels"
              payload: { packaging_spec_id: "${spec_plain}" }
              as: LogisticsCoordinator
              captures: { lbl_c: $.data.id }
          trigger:
            - call: "POST /sharps/return-labels/${lbl_w}/activate"
              payload: { treatment_facility_id: "${fac}", scheduled_intake_date: "2026-08-05", declared_gross_weight_grams: 1200 }
              as: LogisticsCoordinator
              captures: { e_abs: $.data.error_id }
            - call: "POST /sharps/return-labels/${lbl_w}/activate"
              payload: { treatment_facility_id: "${fac}", scheduled_intake_date: "2026-08-05", declared_gross_weight_grams: 1200, absorbent_declared: true }
              as: LogisticsCoordinator
              captures: { e_manifest: $.data.error_id }
            - call: "POST /sharps/return-labels/${lbl_w}/activate"
              payload: { treatment_facility_id: "${fac}", scheduled_intake_date: "2026-08-05", declared_gross_weight_grams: 1200, absorbent_declared: true, state_manifest_number: "WA-MAN-4471" }
              as: LogisticsCoordinator
              captures: { shp_w: $.data.id }
            - call: "POST /sharps/return-labels/${lbl_c}/activate"
              payload: { treatment_facility_id: "${fac}", scheduled_intake_date: "2026-08-05", declared_gross_weight_grams: 1200 }
              as: LogisticsCoordinator
              captures: { shp_c: $.data.id }
          assert:
            - "${e_abs} == \"ERR_ABSORBENT_MATERIAL_REQUIRED\" with HTTP status == 422 (priority 20 is reported even though the manifest is missing too)"
            - "${e_manifest} == \"ERR_STATE_MANIFEST_REQUIRED\" with HTTP status == 422"
            - "the third call returns HTTP 201 with Shipment.${shp_w}.state_manifest_number == \"WA-MAN-4471\" and Shipment.${shp_w}.transport_status == \"TENDERED\""
            - "the fourth call returns HTTP 201: Cora's label activates with absorbent_declared and state_manifest_number both omitted"
            - "Shipment.${shp_c}.state_manifest_number == null"
            - "ReturnLabel.${lbl_w}.status == \"ACTIVATED\" and ReturnLabel.${lbl_c}.status == \"ACTIVATED\""
            - "GET /sharps/shipments?return_label_id=${lbl_w} returns total_count == 1 (the two rejected attempts created nothing)"
            - "TreatmentFacility.${fac}.pending_intake_units == 120 (60 units per activated parcel, counted once each)"
            - "Shipment.${shp_w}.custody_units == 60 and Shipment.${shp_c}.custody_units == 60"

      - name: label_expiry_and_notification_deadline_are_both_inclusive_on_the_last_legal_instant
