      - name: entity_initial_states_on_create_across_all_eight_machines
        claim_type: initial_state
        grounds:
          - state_machines.Contract.null_to_DRAFT
          - state_machines.ClinicalEvidenceReview.null_to_UNDER_REVIEW
          - state_machines.Commitment.election_status.null_to_ELECTED
          - state_machines.Commitment.lop_status.initial_state
          - state_machines.ItemCrossReference.null_to_PROPOSED
          - state_machines.PriceActivation.null_to_DRAFT
          - state_machines.DistributorFile.null_to_RECEIVED
          - state_machines.ComplianceMeasurement.null_to_DRAFT
          - state_machines.AdminFeeDistribution.null_to_ACCRUED
        distinguishing_aspect: "Every declared initial_state is checked on the create response itself: Contract DRAFT, ClinicalEvidenceReview UNDER_REVIEW with revision_round 0, Commitment ELECTED on the election_status dimension and NOT_ISSUED on the lop_status dimension simultaneously, ItemCrossReference PROPOSED, PriceActivation DRAFT, DistributorFile RECEIVED, ComplianceMeasurement DRAFT, AdminFeeDistribution ACCRUED."
        test_recipe:
          setup: ["Clock at 2026-08-01T00:00:00Z. One contract with the short ladder, one item, one member."]
          setup_api_calls:
            - call: "POST /gpo/_clock/set_current_utc"
