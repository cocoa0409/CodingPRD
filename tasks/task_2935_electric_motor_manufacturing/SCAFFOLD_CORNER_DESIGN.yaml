              as: DesignEngineer
              as_user_id: "u_eng_1"
              captures: { d1_id: $.data.id }
            - call: "POST /motor-designs"
              payload: { model_code: "WM-132S-7K5-IE3B", frame_size: "132S", poles: 4, rated_output_kw: 7.5, rated_voltage_v: 400, target_efficiency_class: "IE3", lamination_grade: "M400_50A", lamination_stack_length_mm: 160, winding_copper_kg: 12.0, winding_type: "LAP", insulation_class: "F", stator_bore_id_mm: 135.400, design_air_gap_mm: 0.450, air_gap_tolerance_mm: 0.050, rotor_construction: "DIE_CAST_ALUMINUM", rotor_bar_count: 34, shaft_diameter_mm: 38.000, shaft_tolerance_class: "k6", bearing_spec_de: "6208-2Z", bearing_spec_nde: "6206-2Z", lubrication_spec: "GREASE_REGREASABLE", duty_type: "S1", enclosure: "IP55", mounting: "B3", supersedes_design_id: "${d1_id}" }
              as: DesignEngineer
              as_user_id: "u_eng_1"
