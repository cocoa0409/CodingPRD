  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: unit_window_overlap_with_turnaround_buffer_rejects_back_to_back
        grounds:
          - calculations.window_overlap
          - validations[priority=6]
          - entities.Reservation.fields.pickup_at
          - entities.Reservation.fields.due_at
        distinguishing_aspect: |
          GearUnit interval semantics: half-open [pickup_at, due_at) PLUS a 30-minute additive
          turnaround buffer on the existing window's end, so a back-to-back booking whose
          pickup_at exactly equals the prior due_at still collides (ERR_WINDOW_CONFLICT).
        test_recipe:
          setup:
            - "Unit has an existing CONFIRMED reservation [08:00,10:00). A new reservation [10:00,12:00) touches the prior end exactly."
          setup_api_calls:
            - call: "POST /rental/_clock/set"
              payload: { to_iso8601: "2026-05-14T07:00:00Z" }
              as: ShopAdmin
            - call: "POST /rental/gear-types"
              payload: { category: "KAYAK", name: "Double", size_label: "L" }
