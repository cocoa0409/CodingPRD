              as: Dispatcher
              captures: { ap1: "$.data.id", ap1_v: "$.data.version" }
            - call: "POST /appointments/${ap1}/service-lines"
              payload: { lines: [{ limb_state_id: "${lf}", service_type: "NEW_SHOES", sku_id: "${sku1}" }, { limb_state_id: "${rf}", service_type: "NEW_SHOES", sku_id: "${sku1}" }, { limb_state_id: "${lh}", service_type: "NEW_SHOES", sku_id: "${sku1}" }, { limb_state_id: "${rh}", service_type: "NEW_SHOES", sku_id: "${sku1}" }], expected_appointment_version: "${ap1_v}" }
              as: Dispatcher
            - call: "GET /routes/${rt1}"
              payload: {}
              as: Dispatcher
              captures: { rt1_v: "$.data.version" }
            - call: "POST /route-stops/${st1}/appointments"
              payload: { appointment_id: "${ap1}", expected_route_version: "${rt1_v}" }
              as: Dispatcher
          trigger:
            - call: "POST /routes/${rt1}/stops"
              payload: { barn_id: "${barn_a}", sequence_index: 2, planned_start_minute: 575 }
              as: Dispatcher
              captures: { err: "$.data.error_id" }
          assert:
            - "RouteStop.${st1}.end_minute == 566 and RouteStop.${st1}.travel_minutes == 15"
            - "the trigger responds 409 with error_id ERR_STOP_TIME_CONFLICT"
            - "Route.${rt1}.stop_count == 1"
            - "Route.${rt1}.committed_minutes == 101"

  # =========================================================================
  # Rule 9 — compensating-action invariants over DIFFERENT conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: attach_then_detach_conserves_van_pairs_and_route_capacity
        grounds:
          - conservation_invariants.INV_RESERVE_RELEASE_ROUNDTRIP
          - conservation_invariants.INV_ROUTE_CAPACITY_ROUNDTRIP
          - conservation_invariants.INV_BUCKET_BALANCE
          - state_machines.ShoeReservation.RESERVED_to_RELEASED
          - state_machines.Appointment.SCHEDULED_to_UNROUTED
        distinguishing_aspect: |
          The conserved quantity here is PHYSICAL — shoe pairs in a van bucket plus the route's
          two capacity meters. Attach followed by detach must leave available_pairs, reserved_pairs,
          on_hand_pairs, committed_units and committed_minutes byte-identical to their pre-attach values.
        test_recipe:
          setup:
            - "Van bucket adjusted to 10 pairs; a DRAFT route with one zone A stop starting at 480."
            - "An UNROUTED appointment carrying four NEW_SHOES lines (12 units, 86 minutes, 2 pairs)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /barns"
              payload: { name: "Ridgeview", zone: "A", served_weekdays: ["MON", "TUE", "WED", "THU", "FRI"], access_open_minute: 420, access_close_minute: 1020, blackout_dates: [] }
