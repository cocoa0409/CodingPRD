        grounds: ["validations[priority=3]", "errors[ERR_NOT_RESOURCE_OWNER]", "roles[Customer]"]
        distinguishing_aspect: "Customer is entity_backed by HouseholdAccount: a Customer whose X-User-ID is household B cannot cancel household A's visit; ERR_NOT_RESOURCE_OWNER (403)."
        test_recipe:
          setup: ["households A and B; A has a PLANNED coop and a REQUESTED SETUP_INSTALL visit"]
          setup_api_calls:
            - call: "POST /coopcare/households"
