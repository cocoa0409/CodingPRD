  # --- Loss settlement (business endpoints on the BaggageServiceAgent surface) ---
  - method: POST
    path: "/baggage/reports/{id}/loss-settlement"
    description: "Settle a LOST report directly: authorise the full liability, record the payout and release the bag's Delivery row"
    roles: [BaggageServiceAgent]
    code: 200
    input: [paid_cents]
    output: MishandledReport
    side_effects:
      - "report.status → COMPENSATED and report.claim_status → SETTLED"
      - "report.approved_cents := min(paid_cents, report.compensation_offer_cents, airline.compensation_cap_cents)"
      - "report.compensation_settled_cents := report.approved_cents"
      - "report.final_liability_cents := mishandled_final_liability calculation (REALISED variant)"
      - "when the bag has no Delivery row one is created, then moved straight to COMPENSATED"
      - "station_liability_ledger recomputed"

  - method: POST
    path: "/baggage/bags/{id}/special-items/{itemId}/waive-handling-fee"
    description: |
      Waive one special item's handling fee. bag.handling_charge_cents stays unchanged
      and SpecialItem.waived_fee_cents records the single-item fee that was waived
      (evaluated at the item's own item_type, NOT at the historically lowest one).
    roles: [BaggageServiceAgent, PlatformAdmin]
    code: 200
    input: [expected_bag_version]
    output: Bag
    side_effects:
      - "increments Bag.version by 1"
      - "the item's waived_fee_cents := oversize_handling_fee for that single item, leaving bag.handling_charge_cents untouched"

  # --- Passenger tracking ---
  - method: GET
    path: "/baggage/tracking/{tag_number}"
    description: "Passenger-facing bag tracking lookup by tag number"
    roles: [Passenger, BaggageServiceAgent, PlatformAdmin]
    code: 200
    input: []
    output: "{ tag_number: string, custody_status: string, screening_status: string, last_scan_point: string, last_scan_utc: datetime, onboard: boolean, connection_status: string, manual_sortation_delay_minutes: integer, open_reports: integer }"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header absent, or the role value is not a declared role"

  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The acting role does not permit this operation, or an entity-backed role acts on a resource whose owning foreign key is not its own X-User-ID"

  - id: ERR_BAG_NOT_FOUND
    http: 404
    condition: "No Bag exists for the supplied id, or the bag belongs to a different station's scope"

  - id: ERR_REPORT_NOT_FOUND
    http: 404
    condition: "No MishandledReport exists for the supplied id"

  - id: ERR_FLIGHT_NOT_FOUND
    http: 404
    condition: "No Flight exists for the supplied id"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target resource is not in a state that admits the requested transition"

  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version in the body does not equal the parent entity's current version"

  - id: ERR_STATION_SUSPENDED
    http: 409
    condition: "The station of custody has posture SUSPENDED (an active sortation outage or a full sorter); sortation, loading and delivery writes are rejected"

  - id: ERR_SCREENING_NOT_CLEARED
    http: 409
    condition: "The bag's screening_status is ALARMED, FAILED or IN_INSPECTION, so it may not advance past the screening stage"

  - id: ERR_SCREENING_EVENT_NOT_ALARMED
    http: 409
    condition: "The screening event is not in status ALARMED, so there is no alarm to resolve, claim or inspect"

  - id: ERR_SCREENING_WINDOW_CLOSED
    http: 409
    condition: "The screening event's half-open window has already closed (end_utc <= the current logical clock instant), so it may not be reopened"

  - id: ERR_LANE_OFFLINE
    http: 409
    condition: "The screening lane's status is OFFLINE, so no new screening window may be opened on it"

  - id: ERR_LANE_INTERVAL_CONFLICT
    http: 409
    condition: "The lane already hosts a non-FAILED screening window in the same identity bucket floor_to_20(start_utc)"

  - id: ERR_BAG_OVERWEIGHT
    http: 422
    condition: "weight_lb exceeds airline.max_excess_weight_lb + 20, so the bag is beyond the in-line weight envelope"

  - id: ERR_BAG_OVERSIZE
    http: 422
    condition: "linear_in exceeds 130, or a single declared dimension exceeds the in-line belt envelope"

  - id: ERR_INTERLINE_AGREEMENT_INACTIVE
    http: 422
    condition: "itinerary_type == INTERLINE but the airline's interline_agreement_active is false"

  - id: ERR_DUPLICATE_AIRLINE
    http: 409
    condition: "An Airline with the same two-letter code already exists"

  - id: ERR_DUPLICATE_CONNECTION
    http: 409
    condition: "A Connection already exists for the same (bag_id, onward_flight_id) pair"

  - id: ERR_SORTATION_WINDOW_CLOSED
    http: 409
    condition: "The current logical clock instant is past the flight's sortation_close_utc, so the bag may not be inducted into make-up or loaded"

  - id: ERR_SORTATION_WINDOW_OPEN
    http: 409
    condition: "The current logical clock instant is before the flight's sortation_close_utc, so the flight may not depart"

  - id: ERR_FLIGHT_NOT_SORTING
    http: 409
    condition: "The flight's status is not in {SCHEDULED, SORT_OPEN}, so no bag may be assigned to or re-accommodated onto it"

  - id: ERR_FLIGHT_NOT_ASSIGNED
    http: 409
    condition: "The bag has no flight_id, so it has no sortation window to be inducted against"

  - id: ERR_FLIGHT_NOT_DEPARTED
    http: 409
    condition: "The bag's flight has not reached DEPARTED, so the bag may not be marked delivered"

  - id: ERR_MAKEUP_SLOT_CONFLICT
    http: 409
    condition: "The claimed make-up identity bucket at the area's buffer_granularity is already occupied, or the area's distinct occupied identity buckets have reached capacity_slots"

  - id: ERR_MAKEUP_AREA_CLOSED
    http: 409
    condition: "The make-up area's status is CLOSED"

  - id: ERR_MANUAL_INSPECTION_REQUIRED
    http: 409
    condition: "The bag has an open (QUEUED or IN_PROGRESS) ManualInspectionTask, so it may not advance to make-up or be loaded"

  - id: ERR_MCT_VIOLATION
    http: 409
    condition: "connect_slack_minutes is negative, so the itinerary does not satisfy the airport minimum connect time"

  - id: ERR_RUSH_WINDOW_PASSED
    http: 409
    condition: "connect_slack_minutes is below -15, so the rush-bag procedure can no longer be declared"

  - id: ERR_CONNECTION_MISSED
    http: 409
    condition: "The bag's Connection is in status MISSED, so it may not be loaded without re-accommodation"

  - id: ERR_CLAIM_NOT_APPROVED
    http: 409
    condition: "The report's claim_status is not APPROVED, so compensation may not be paid"

  - id: ERR_CLAIM_PENDING
    http: 409
    condition: "The report carries a filed-but-undecided claim, so it may not be closed"

  - id: ERR_CLAIM_ALREADY_DECIDED
    http: 409
    condition: "The claim has already been approved or denied"

  - id: ERR_COMPENSATION_OVER_CAP
    http: 422
    condition: "The requested claim amount exceeds the airline's compensation_cap_cents"

  - id: ERR_DELIVERY_IN_PAST
    http: 422
    condition: "delivery.scheduled_utc precedes the current logical clock instant"

  - id: ERR_PROOF_OF_DELIVERY_REQUIRED
    http: 409
    condition: "delivery.proof_required is true and no proof_of_delivery was supplied"

  - id: ERR_OUTAGE_NOT_ACTIVE
    http: 409
    condition: "Re-inducting a HELD bag through weigh is permitted only while the station's outage_active is true or the bag's screening_status is ALARMED"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, unknown enum member, missing required field, or a replacement onward flight equal to the current one"

  - id: ERR_MAKEUP_RATE_LIMITED
    http: 409
    condition: "The station is in outage contingency and the cumulative hot-bag allowance of 5 rush-declared loads since outage_started_utc is already exhausted for a non-rush bag"

  - id: ERR_DUPLICATE_BAG_ON_FLIGHT
    http: 409
    condition: "The bag carries duplicate_flag == true — another bag with the same passenger_ref was accepted for the same flight at an earlier created_at"

  - id: ERR_INVALID_ENUM_VALUE
    http: 400
    condition: "A supplied enum member is outside the field's declared value set"

# =============================================================================
# §1.7 RBAC Role Permission Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Airport operations administrator. Owns the reference data (stations, airlines, flights, make-up areas, lanes), the logical clock, and the outage and ops-run checkpoints."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /baggage/stations"
      - "POST /baggage/stations/{id}/outage"
      - "POST /baggage/stations/{id}/outage/clear"
      - "POST /baggage/stations/{id}/run_ops"
      - "POST /baggage/airlines"
      - "POST /baggage/makeup-areas"
      - "POST /baggage/screening-lanes"
      - "POST /baggage/screening-lanes/{id}/offline"
      - "POST /baggage/screening-lanes/{id}/online"
      - "POST /baggage/flights"
      - "POST /baggage/flights/{id}/reschedule"
      - "POST /baggage/flights/{id}/depart"
      - "POST /baggage/flights/{id}/cancel"
    shared_operations:
      - "GET reads across every collection"

  - name: AcceptanceAgent
    description: "Ticket-counter and curbside acceptance agent. Accepts bags, prints tags, weighs and screens weight/size, and registers special items."
    identity: opaque
    exclusive_operations:
      - "POST /baggage/bags"
      - "POST /baggage/bags/{id}/weigh"
    shared_operations:
      - "POST /baggage/bags/{id}/special-items"
      - "PUT /baggage/bags/{id}"
      - "POST /baggage/bags/{id}/scans"
      - "GET /baggage/bags/{id}"
      - "GET /baggage/bags"
      - "GET /baggage/tracking/{tag_number}"

  - name: SortationAgent
    description: "Sortation system operator. Assigns make-up intervals, works the sortation queue and monitors posture."
    identity: opaque
    exclusive_operations:
      - "POST /baggage/bags/{id}/assign-makeup"
      - "POST /baggage/bags/bulk-assign-makeup"
    shared_operations:
      - "POST /baggage/bags/{id}/scans"
      - "GET /baggage/bags/{id}"
      - "GET /baggage/bags"
      - "GET /baggage/makeup-areas"
      - "GET /baggage/flights/{id}/bags"
      - "GET /baggage/connections"

  - name: Screener
    description: "In-line explosive-detection screener. Raises and resolves screening alarms, works the manual inspection queue, and records anomaly notes."
    identity: opaque
    exclusive_operations:
      - "POST /baggage/screenings"
      - "POST /baggage/screenings/{id}/resolve"
      - "POST /baggage/screenings/{id}/reopen"
      - "POST /baggage/inspections/{id}/claim"
      - "POST /baggage/inspections/{id}/resolve"
    shared_operations:
      - "PUT /baggage/bags/{id}"
      - "POST /baggage/bags/{id}/scans"
      - "GET /baggage/bags/{id}"
      - "GET /baggage/inspections"

  - name: LoadAgent
    description: "Make-up and ramp load agent. Loads bags, delivers them to the passenger or reclaim belt, and offloads mis-loaded bags."
    identity: opaque
    exclusive_operations:
      - "POST /baggage/bags/{id}/load"
      - "POST /baggage/bags/{id}/deliver"
      - "POST /baggage/bags/{id}/offload"
    shared_operations:
      - "POST /baggage/bags/{id}/scans"
      - "GET /baggage/bags/{id}"
      - "GET /baggage/flights/{id}/bags"
      - "GET /baggage/makeup-areas"

  - name: TransferAgent
    description: "Transfer-bag desk agent. Confirms connecting itineraries against minimum connect time, declares the rush-bag procedure and re-accommodates missed connections."
    identity: opaque
    exclusive_operations:
      - "POST /baggage/connections"
      - "POST /baggage/connections/{id}/confirm"
      - "POST /baggage/connections/{id}/declare-rush"
      - "POST /baggage/connections/{id}/reaccommodate"
    shared_operations:
      - "GET /baggage/connections"
      - "GET /baggage/bags/{id}"
      - "GET /baggage/flights/{id}/bags"

  - name: BaggageServiceAgent
    description: "Central baggage service office agent. Files and works mishandled bag reports, arranges deliveries, files and decides claims, and pays compensation."
    identity: opaque
    exclusive_operations:
      - "POST /baggage/reports"
      - "POST /baggage/reports/{id}/investigate"
      - "POST /baggage/reports/{id}/arrange-delivery"
      - "POST /baggage/reports/{id}/mark-delivered"
      - "POST /baggage/reports/{id}/compensate"
      - "POST /baggage/reports/{id}/close"
      - "POST /baggage/reports/{id}/reopen"
      - "POST /baggage/reports/{id}/claims"
      - "POST /baggage/claims/{id}/decide"
      - "POST /baggage/deliveries/{id}/dispatch"
      - "POST /baggage/deliveries/{id}/complete"
      - "POST /baggage/reports/{id}/loss-settlement"
      - "POST /baggage/bags/{id}/special-items/{itemId}/waive-handling-fee"
    shared_operations:
      - "GET /baggage/reports"
      - "GET /baggage/reports/{id}"
      - "GET /baggage/deliveries"
      - "GET /baggage/bags/{id}"
      - "POST /baggage/bags/{id}/special-items"

  - name: Passenger
    description: "Travelling passenger. Entity-backed by the Bag row's passenger_ref: X-User-ID must equal the passenger_ref of every bag it reads, so a passenger sees only their own tracking trail and reports."
    identity: entity_backed:Bag
    exclusive_operations: []
    shared_operations:
      - "GET /baggage/tracking/{tag_number}"
      - "GET /baggage/bags/{id}"
      - "GET /baggage/reports/{id}"
      - "GET /baggage/bags/{id}/scans"
      - "GET /baggage/bags/{id}/reports"
      - "GET /baggage/bags/{id}/deliveries"
