# =============================================================================
# Scaffold: Continuing Care Retirement Community (CCRC / Life Plan)
# Difficulty band: EXPERT (§0.4)
# =============================================================================

scenario: |
  Continuing Care Retirement Community (CCRC / Life Plan): entrance fee (refund
  tiers) & monthly service fee, independent→assisted→skilled continuum
  transition, contract type (Type A/B/C life-care), unit inventory & priority
  waitlist, second-person fee, health-center bed reservation, actuarial reserve
  disclosure, resident council

domain_name: ccrc-life-plan-community
api_prefix: /ccrc

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities under one /ccrc prefix, linked by foreign keys. Residency
  # references Unit, ContractPlan, Resident, Community; WaitlistEntry references
  # Residency + a care level; BedReservation references Residency + Unit.

  state_machine_shape: branching
  # Residency forks: DEPOSIT_HELD → {RESERVED, WAITLISTED}; WAITLISTED → RESERVED;
  # ACTIVE → {TERMINATED_VOLUNTARY, TERMINATED_DEATH} with divergent refund
  # side-effects per branch. BedReservation HELD → {OCCUPIED, RELEASED, EXPIRED}.
  # CareTransition advances the independent→assisted→skilled continuum and can
  # step back toward INDEPENDENT.

  relationship_patterns:
    - one_to_many       # Community → Residency; ContractPlan → Residency
    - cross_aggregate   # Residency ↔ Unit, Residency ↔ BedReservation
    - polymorphic       # WaitlistEntry.target_care_level mirrors Unit.care_level

  role_model: peer_roles
  # AdmissionsDirector (units, residents, residency lifecycle, waitlist),
  # CareCoordinator (care continuum + bed reservations), FinanceOfficer
  # (communities, plans, billing, refunds, reserve disclosure, council),
  # Resident (entity_backed; council votes + reads).

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Community
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Community legal name" }
      - { name: current_period_index, type: integer, source: system, default: 0, description: "Deterministic monthly clock; advances only via the clock endpoint" }
      - { name: actuarial_discount_rate_bps, type: integer, source: input, description: "Annual discount rate in basis points used to present-value future obligations (e.g., 600 = 6.00%)" }
      - { name: target_funded_ratio_bps, type: integer, source: input, default: 10000, description: "Regulatory minimum funded ratio in basis points (10000 = 100%); disclosure flags deficiency below this" }
      - { name: reserve_assets_cents, type: integer, source: input, default: 0, description: "Cash + investment assets currently set aside for the actuarial reserve, in cents" }
      - { name: is_admissions_frozen, type: boolean, source: computed, default: false, description: "True once a generated ActuarialReserveReport funded_ratio_bps fell below half of target_funded_ratio_bps; gates unit assignment, waitlist placement, and activation" }

  - name: ContractPlan
    parent: null
    common_fields: true
    fields:
      - { name: community_id, type: string, source: input, description: "FK -> Community.id" }
      - { name: name, type: string, source: input, description: "Marketing name of the plan" }
      - { name: contract_type, type: enum, source: input, description: "TYPE_A | TYPE_B | TYPE_C", constraints: "TYPE_A = life-care (no per-diem health rate increase), TYPE_B = modified (capped discounted health days), TYPE_C = fee-for-service health days" }
      - { name: entrance_fee_cents, type: integer, source: input, description: "Base entrance fee for one occupant in INDEPENDENT, in cents; must be > 0" }
      - { name: refund_plan, type: enum, source: input, description: "DECLINING | FIFTY_REFUNDABLE | NINETY_REFUNDABLE", constraints: "DECLINING amortizes toward 0; FIFTY_REFUNDABLE floors at 50%; NINETY_REFUNDABLE floors at 90%" }
      - { name: declining_monthly_bps, type: integer, source: input, default: 200, description: "Basis points of entrance fee amortized per occupied month under DECLINING (200 = 2.00%/mo); also the monthly decline applied above the FIFTY/NINETY floor" }
      - { name: declining_nonrefundable_bps, type: integer, source: input, default: 400, description: "Basis points of entrance fee retained immediately on move-in under DECLINING (400 = 4.00% admin retention)" }
      - { name: monthly_service_fee_cents, type: integer, source: input, description: "Base monthly service fee for one occupant in INDEPENDENT, in cents; must be > 0" }
      - { name: second_person_fee_cents, type: integer, source: input, description: "Flat monthly surcharge added when a second person shares the unit, in cents; must be >= 0" }
      - { name: assisted_monthly_surcharge_cents, type: integer, source: input, default: 0, description: "Additional monthly service fee when resident is in ASSISTED care level, in cents" }
      - { name: skilled_per_diem_cents, type: integer, source: input, default: 0, description: "Gross fee-for-service per-diem for SKILLED nursing days, in cents" }
      - { name: typeb_discounted_days, type: integer, source: input, default: 0, description: "Number of discounted skilled days granted per residency under TYPE_B before per-diem applies (ignored for TYPE_A/TYPE_C)" }

  - name: Unit
    parent: null
    common_fields: true
    fields:
      - { name: community_id, type: string, source: input, description: "FK -> Community.id" }
      - { name: unit_number, type: string, source: input, description: "Human-readable unit label; unique within a community" }
      - { name: care_level, type: enum, source: input, description: "INDEPENDENT | ASSISTED | SKILLED", constraints: "Determines which residencies/reservations may occupy it" }
      - { name: bed_capacity, type: integer, source: input, default: 1, description: "Number of reservable beds; only meaningful for SKILLED health-center units, defaults to 1" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | OCCUPIED; AVAILABLE on create, OCCUPIED while assigned/reserved, back to AVAILABLE when freed" }

  - name: Resident
    parent: null
    common_fields: true
    fields:
      - { name: community_id, type: string, source: input, description: "FK -> Community.id" }
      - { name: full_name, type: string, source: input, description: "Resident legal name" }
      - { name: date_of_birth, type: datetime, source: input, description: "ISO date of birth" }
      - { name: priority_score, type: integer, source: input, default: 0, description: "Waitlist priority weight; higher wins ties only after enqueue period (see waitlist_ordering calc)" }

  - name: Residency
    parent: null
    common_fields: true
    fields:
      - { name: community_id, type: string, source: input, description: "FK -> Community.id" }
      - { name: primary_resident_id, type: string, source: input, description: "FK -> Resident.id; the contract holder" }
      - { name: contract_plan_id, type: string, source: input, description: "FK -> ContractPlan.id; pins contract_type and fee schedule for the life of the residency" }
      - { name: unit_id, type: string, source: system, required: false, description: "FK -> Unit.id; the assigned independent-living unit (null while DEPOSIT_HELD/WAITLISTED)" }
      - { name: care_level, type: enum, source: computed, default: INDEPENDENT, description: "INDEPENDENT | ASSISTED | SKILLED; mirrors the latest APPLIED CareTransition" }
      - { name: entrance_fee_paid_cents, type: integer, source: computed, default: 0, description: "Entrance fee collected at activation = plan.entrance_fee_cents (frozen at activation)" }
      - { name: occupied_months, type: integer, source: computed, default: 0, description: "Count of community periods the residency has been ACTIVE; drives DECLINING amortization" }
      - { name: skilled_days_used, type: integer, source: computed, default: 0, description: "Cumulative SKILLED nursing days billed; drives TYPE_B discounted-day exhaustion" }
      - { name: has_second_person, type: boolean, source: computed, default: false, description: "True once an ACTIVE SecondPerson exists; drives second_person_fee" }
      - { name: refund_disbursed_cents, type: integer, source: computed, default: 0, description: "Entrance-fee refund issued on termination; 0 until terminated" }
      - { name: status, type: enum, source: system, description: "DEPOSIT_HELD | WAITLISTED | RESERVED | ACTIVE | TERMINATED_VOLUNTARY | TERMINATED_DEATH; DEPOSIT_HELD on create" }

  - name: SecondPerson
    parent: null
    common_fields: true
    fields:
      - { name: residency_id, type: string, source: input, description: "FK -> Residency.id" }
      - { name: full_name, type: string, source: input, description: "Second occupant legal name" }
      - { name: date_of_birth, type: datetime, source: input, description: "ISO date of birth" }
      - { name: status, type: enum, source: system, description: "ACTIVE | REMOVED; ACTIVE on create" }

  - name: WaitlistEntry
    parent: null
    common_fields: true
    fields:
      - { name: community_id, type: string, source: input, description: "FK -> Community.id" }
      - { name: residency_id, type: string, source: input, description: "FK -> Residency.id; the residency awaiting a unit" }
      - { name: target_care_level, type: enum, source: input, description: "INDEPENDENT | ASSISTED | SKILLED; the care level of unit being waited for" }
      - { name: priority_score, type: integer, source: computed, description: "Snapshot of Resident.priority_score at enqueue time; tie-break input" }
      - { name: enqueued_period_index, type: integer, source: computed, description: "Community.current_period_index at enqueue; primary ordering key (earlier wins)" }
      - { name: rank, type: integer, source: computed, description: "1-based position among PENDING entries for the same community + target_care_level (see waitlist_ordering calc)" }
      - { name: status, type: enum, source: system, description: "PENDING | OFFERED | PLACED | WITHDRAWN; PENDING on create" }

  - name: CareTransition
    parent: null
    common_fields: true
    fields:
      - { name: residency_id, type: string, source: input, description: "FK -> Residency.id" }
      - { name: from_level, type: enum, source: computed, description: "INDEPENDENT | ASSISTED | SKILLED; the residency care_level snapshotted at propose time" }
      - { name: to_level, type: enum, source: input, description: "INDEPENDENT | ASSISTED | SKILLED; requested new care level" }
      - { name: effective_period_index, type: integer, source: computed, default: 0, description: "Community.current_period_index when APPLIED; 0 while PROPOSED" }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPLIED | REVERTED; PROPOSED on create" }

  - name: BedReservation
    parent: null
    common_fields: true
    fields:
      - { name: residency_id, type: string, source: input, description: "FK -> Residency.id holding the reservation" }
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; a SKILLED health-center unit" }
      - { name: hold_start_period, type: integer, source: computed, description: "Community.current_period_index when the hold was placed" }
      - { name: hold_expiry_period, type: integer, source: input, description: "Inclusive period index up to which a HELD reservation may still be occupied; must be > current period at hold time" }
      - { name: occupied_start_period, type: integer, source: computed, default: 0, description: "Period the reservation was converted to OCCUPIED; 0 while HELD" }
      - { name: status, type: enum, source: system, description: "HELD | OCCUPIED | RELEASED | EXPIRED; HELD on create" }

  - name: MonthlyInvoice
    parent: null
    common_fields: true
    fields:
      - { name: residency_id, type: string, source: input, description: "FK -> Residency.id billed" }
      - { name: period_index, type: integer, source: computed, description: "Community period the invoice covers" }
      - { name: base_service_fee_cents, type: integer, source: computed, description: "Plan base service fee for the billed care level (includes ASSISTED surcharge)" }
      - { name: second_person_fee_cents, type: integer, source: computed, description: "Second-person surcharge applied this period (0 if no ACTIVE second person)" }
      - { name: care_surcharge_cents, type: integer, source: computed, description: "SKILLED per-diem charges for the period, contract-type dependent (0 unless SKILLED)" }
      - { name: total_cents, type: integer, source: computed, description: "Sum of all charge lines for the period (see monthly_invoice_total calc)" }
      - { name: status, type: enum, source: system, description: "ISSUED; ISSUED on create (invoices are immutable once issued in this version)" }

  - name: RefundDisbursement
    parent: null
    common_fields: true
    fields:
      - { name: residency_id, type: string, source: input, description: "FK -> Residency.id being refunded" }
      - { name: gross_entrance_fee_cents, type: integer, source: computed, description: "Snapshot of residency.entrance_fee_paid_cents at termination" }
      - { name: refundable_cents, type: integer, source: computed, description: "Computed refund per the plan's refund tier schedule (see entrance_fee_refund calc)" }
      - { name: termination_reason, type: enum, source: computed, description: "VOLUNTARY | DEATH; copied from the terminating transition" }
      - { name: settlement_period_index, type: integer, source: computed, default: 0, description: "Community period the refund was settled; 0 while PENDING" }
      - { name: status, type: enum, source: system, description: "PENDING | SETTLED; PENDING on create" }

  - name: ResidentCouncil
    parent: null
    common_fields: true
    fields:
      - { name: community_id, type: string, source: input, description: "FK -> Community.id; exactly one council per community" }
      - { name: name, type: string, source: input, description: "Council name" }
      - { name: quorum_pct_bps, type: integer, source: input, default: 5000, description: "Basis points of ACTIVE residencies that must cast a vote for a resolution to be decidable (5000 = 50%)" }

  - name: CouncilResolution
    parent: null
    common_fields: true
    fields:
      - { name: council_id, type: string, source: input, description: "FK -> ResidentCouncil.id" }
      - { name: title, type: string, source: input, description: "Resolution title" }
      - { name: yes_votes, type: integer, source: computed, default: 0, description: "Count of YES votes cast" }
      - { name: no_votes, type: integer, source: computed, default: 0, description: "Count of NO votes cast" }
      - { name: eligible_voter_count, type: integer, source: computed, default: 0, description: "ACTIVE residency count snapshot at OPEN time; denominator for quorum + majority" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | PASSED | FAILED; DRAFT on create" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Residency
    initial_state: DEPOSIT_HELD
    terminal_states: [TERMINATED_VOLUNTARY, TERMINATED_DEATH]
    transitions:
      - from: DEPOSIT_HELD
        to: RESERVED
        trigger: "POST /ccrc/residencies/{rid}/assign-unit"
        actor: AdmissionsDirector
        preconditions:
          - "Residency.status == DEPOSIT_HELD (ERR_RESIDENCY_NOT_DEPOSIT_HELD)"
          - "Community.is_admissions_frozen == false (ERR_ADMISSIONS_FROZEN)"
          - "Target Unit.status == AVAILABLE (ERR_UNIT_NOT_AVAILABLE)"
          - "Unit.care_level == INDEPENDENT (ERR_UNIT_CARE_LEVEL_MISMATCH)"
        side_effects:
          - "Residency.unit_id := target unit"
          - "Unit.status := OCCUPIED (cross-entity: Residency assign → Unit occupied)"
      - from: DEPOSIT_HELD
        to: WAITLISTED
        trigger: "POST /ccrc/waitlist-entries"
        actor: AdmissionsDirector
        preconditions:
          - "Residency.status == DEPOSIT_HELD (ERR_RESIDENCY_NOT_DEPOSIT_HELD)"
          - "No PENDING WaitlistEntry already exists for this residency (ERR_DUPLICATE_WAITLIST_ENTRY)"
        side_effects:
          - "WaitlistEntry created PENDING; enqueued_period_index := Community.current_period_index"
          - "priority_score snapshotted from Resident.priority_score"
          - "rank computed via waitlist_ordering over the community + target_care_level queue"
          - "Residency.status := WAITLISTED (cross-entity)"
      - from: WAITLISTED
        to: RESERVED
        trigger: "POST /ccrc/waitlist-entries/{wid}/place"
        actor: AdmissionsDirector
        preconditions:
          - "WaitlistEntry.status == OFFERED or PENDING (ERR_WAITLIST_ENTRY_NOT_PLACEABLE)"
          - "WaitlistEntry.rank == 1 among PENDING entries for its community + target_care_level (ERR_WAITLIST_NOT_HEAD)"
          - "Residency.status == WAITLISTED (ERR_RESIDENCY_NOT_WAITLISTED)"
          - "Community.is_admissions_frozen == false (ERR_ADMISSIONS_FROZEN)"
          - "Target Unit.status == AVAILABLE and Unit.care_level == INDEPENDENT (ERR_UNIT_NOT_AVAILABLE)"
        side_effects:
          - "Residency.unit_id := target unit; Unit.status := OCCUPIED"
          - "WaitlistEntry.status := PLACED"
          - "Residency.status := RESERVED (cross-entity)"
          - "Every remaining PENDING WaitlistEntry for the same community + target_care_level re-ranked (gap closed)"
      - from: RESERVED
        to: ACTIVE
        trigger: "POST /ccrc/residencies/{rid}/activate"
        actor: AdmissionsDirector
        preconditions:
          - "Residency.status == RESERVED (ERR_RESIDENCY_NOT_RESERVED)"
          - "Residency.unit_id is set (ERR_NO_UNIT_ASSIGNED)"
          - "Community.is_admissions_frozen == false (ERR_ADMISSIONS_FROZEN)"
          - "expected_residency_version matches current Residency.version (ERR_STALE_VERSION) — checked before state checks"
        side_effects:
          - "entrance_fee_paid_cents := plan.entrance_fee_cents (frozen)"
          - "occupied_months := 0; care_level := INDEPENDENT; skilled_days_used := 0"
          - "Community.reserve_assets_cents += entrance_fee_paid_cents (entrance fee booked into the reserve — ledger sync)"
          - "increments Residency.version by 1"
      - from: ACTIVE
        to: TERMINATED_VOLUNTARY
        trigger: "POST /ccrc/residencies/{rid}/terminate (reason == VOLUNTARY)"
        actor: AdmissionsDirector
        preconditions:
          - "Residency.status == ACTIVE (ERR_RESIDENCY_NOT_ACTIVE)"
          - "reason == VOLUNTARY (ERR_INVALID_REQUEST)"
          - "expected_residency_version matches current Residency.version (ERR_STALE_VERSION) — checked before state checks"
        side_effects:
          - "Assigned Unit.status := AVAILABLE (cascade hop 1: terminate frees the independent unit)"
          - "All ACTIVE SecondPerson rows for this residency := REMOVED; Residency.has_second_person := false (cascade)"
          - "Every HELD or OCCUPIED BedReservation for this residency := RELEASED; each OCCUPIED skilled Unit.status := AVAILABLE (cascade hop 2→3: terminate → reservation RELEASED → skilled Unit freed)"
          - "RefundDisbursement created PENDING; refundable_cents := entrance_fee_refund(VOLUNTARY variant); termination_reason := VOLUNTARY"
          - "Residency.refund_disbursed_cents := refundable_cents"
          - "Community.reserve_assets_cents -= refundable_cents (ledger sync; paired with the activation credit — conserves entrance-fee ledger)"
          - "increments Residency.version by 1"
      - from: ACTIVE
        to: TERMINATED_DEATH
        trigger: "POST /ccrc/residencies/{rid}/terminate (reason == DEATH)"
        actor: AdmissionsDirector
        preconditions:
          - "Residency.status == ACTIVE (ERR_RESIDENCY_NOT_ACTIVE)"
          - "reason == DEATH (ERR_INVALID_REQUEST)"
          - "expected_residency_version matches current Residency.version (ERR_STALE_VERSION) — checked before state checks"
        side_effects:
          - "Assigned Unit.status := AVAILABLE (cascade hop 1)"
          - "All ACTIVE SecondPerson rows for this residency := REMOVED; Residency.has_second_person := false (cascade)"
          - "Every HELD or OCCUPIED BedReservation for this residency := RELEASED; each OCCUPIED skilled Unit.status := AVAILABLE (cascade hop 2→3)"
          - "RefundDisbursement created PENDING; refundable_cents := entrance_fee_refund(DEATH variant); termination_reason := DEATH"
          - "Residency.refund_disbursed_cents := refundable_cents"
          - "Community.reserve_assets_cents -= refundable_cents (ledger sync)"
          - "increments Residency.version by 1"

  - entity: CareTransition
    initial_state: PROPOSED
    terminal_states: [APPLIED, REVERTED]
    transitions:
      - from: PROPOSED
        to: APPLIED
        trigger: "POST /ccrc/care-transitions/{ctid}/apply"
        actor: CareCoordinator
        preconditions:
          - "CareTransition.status == PROPOSED (ERR_CARE_TRANSITION_NOT_PROPOSED)"
          - "Parent Residency.status == ACTIVE (ERR_RESIDENCY_NOT_ACTIVE) — cross-entity gate"
          - "to_level is exactly one step from from_level along INDEPENDENT↔ASSISTED↔SKILLED, in either direction; no skip (ERR_INVALID_CARE_STEP)"
          - "If to_level == SKILLED: an OCCUPIED BedReservation exists for this residency (ERR_NO_BED_OCCUPIED) — cross-entity gate"
        side_effects:
          - "Residency.care_level := to_level (cross-entity)"
          - "effective_period_index := Community.current_period_index"
          - "increments Residency.version by 1"
      - from: PROPOSED
        to: REVERTED
        trigger: "POST /ccrc/care-transitions/{ctid}/revert"
        actor: CareCoordinator
        preconditions:
          - "CareTransition.status == PROPOSED (ERR_CARE_TRANSITION_NOT_PROPOSED)"
        side_effects:
          - "No change to Residency.care_level (compensation: a never-applied proposal leaves the continuum invariant)"

  - entity: BedReservation
    initial_state: HELD
    terminal_states: [OCCUPIED, RELEASED, EXPIRED]
    transitions:
      - from: HELD
        to: OCCUPIED
        trigger: "POST /ccrc/bed-reservations/{brid}/occupy"
        actor: CareCoordinator
        preconditions:
          - "BedReservation.status == HELD (ERR_BED_RESERVATION_NOT_HELD)"
          - "Community.current_period_index <= hold_expiry_period (ERR_BED_RESERVATION_EXPIRED)"
          - "Parent Residency.status == ACTIVE (ERR_RESIDENCY_NOT_ACTIVE) — cross-entity gate"
        side_effects:
          - "occupied_start_period := Community.current_period_index"
          - "Unit.status := OCCUPIED (SKILLED health-center bed consumed — cross-entity)"
      - from: HELD
        to: RELEASED
        trigger: "POST /ccrc/bed-reservations/{brid}/release"
        actor: CareCoordinator
        preconditions:
          - "BedReservation.status == HELD (ERR_BED_RESERVATION_NOT_HELD)"
        side_effects:
          - "No Unit status change (a HELD reservation never consumed the bed)"
      - from: OCCUPIED
        to: RELEASED
        trigger: "POST /ccrc/bed-reservations/{brid}/release"
        actor: CareCoordinator
        preconditions:
          - "BedReservation.status == OCCUPIED (ERR_BED_RESERVATION_NOT_RELEASABLE)"
        side_effects:
          - "Assigned SKILLED Unit.status := AVAILABLE (cross-entity: bed freed)"
      - from: HELD
        to: EXPIRED
        trigger: "system (clock-advance sweep when Community.current_period_index > hold_expiry_period)"
        actor: system
        preconditions:
          - "BedReservation.status == HELD"
          - "Community.current_period_index > hold_expiry_period"
        side_effects:
          - "No Unit status change (a HELD reservation never consumed the bed)"

  - entity: WaitlistEntry
    initial_state: PENDING
    terminal_states: [PLACED, WITHDRAWN]
    transitions:
      - from: PENDING
        to: OFFERED
        trigger: "POST /ccrc/waitlist-entries/{wid}/offer"
        actor: AdmissionsDirector
        preconditions:
          - "WaitlistEntry.status == PENDING (ERR_WAITLIST_ENTRY_NOT_PENDING)"
          - "WaitlistEntry.rank == 1 among PENDING entries for its community + target_care_level (ERR_WAITLIST_NOT_HEAD)"
        side_effects: []
      - from: OFFERED
        to: PLACED
        trigger: "POST /ccrc/waitlist-entries/{wid}/place"
        actor: AdmissionsDirector
        preconditions:
          - "WaitlistEntry.status == OFFERED or PENDING (ERR_WAITLIST_ENTRY_NOT_PLACEABLE)"
          - "WaitlistEntry.rank == 1 among PENDING entries (ERR_WAITLIST_NOT_HEAD)"
          - "Target Unit.status == AVAILABLE and Unit.care_level == INDEPENDENT (ERR_UNIT_NOT_AVAILABLE)"
          - "Parent Residency.status == WAITLISTED (ERR_RESIDENCY_NOT_WAITLISTED) — cross-entity gate"
          - "Community.is_admissions_frozen == false (ERR_ADMISSIONS_FROZEN)"
        side_effects:
          - "Residency.unit_id := unit; Unit.status := OCCUPIED; Residency.status := RESERVED (cross-entity)"
          - "Remaining PENDING WaitlistEntry rows for the same community + target_care_level re-ranked (gap closed)"
      - from: PENDING
        to: WITHDRAWN
        trigger: "POST /ccrc/waitlist-entries/{wid}/withdraw"
        actor: AdmissionsDirector
        preconditions:
          - "WaitlistEntry.status == PENDING or OFFERED (ERR_WAITLIST_ENTRY_NOT_WITHDRAWABLE)"
        side_effects:
          - "Residency.status := DEPOSIT_HELD (cross-entity: returns to pre-waitlist state)"
          - "Remaining PENDING WaitlistEntry rows for the same community + target_care_level re-ranked (gap closed)"

  - entity: CouncilResolution
    initial_state: DRAFT
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /ccrc/council-resolutions/{resid}/open"
        actor: FinanceOfficer
        preconditions:
          - "CouncilResolution.status == DRAFT (ERR_RESOLUTION_NOT_DRAFT)"
        side_effects:
          - "eligible_voter_count := count of Residency with status==ACTIVE and matching community_id (snapshot)"
      - from: OPEN
        to: PASSED
        trigger: "POST /ccrc/council-resolutions/{resid}/close"
        actor: FinanceOfficer
        preconditions:
          - "CouncilResolution.status == OPEN (ERR_RESOLUTION_NOT_OPEN)"
          - "Quorum met: (yes_votes + no_votes) * 10000 >= eligible_voter_count * council.quorum_pct_bps (ERR_QUORUM_NOT_MET)"
          - "yes_votes > no_votes (else FAILED branch is taken instead)"
        side_effects: []
      - from: OPEN
        to: FAILED
        trigger: "POST /ccrc/council-resolutions/{resid}/close"
        actor: FinanceOfficer
        preconditions:
          - "CouncilResolution.status == OPEN (ERR_RESOLUTION_NOT_OPEN)"
          - "Quorum met (ERR_QUORUM_NOT_MET); yes_votes <= no_votes"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: residency-activate-stale
    parent_entity: Residency
    write_endpoint: "POST /ccrc/residencies/{rid}/activate"
    occ_field: "expected_residency_version"
    description: |
      Activating a Residency whose version has advanced since the client last
      observed it is rejected. Adding a second person against the residency
      legitimately bumps its version; an activation carrying a stale version is
      rejected on the OCC check rather than acting on a stale snapshot.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: residency-terminate-stale
    parent_entity: Residency
    write_endpoint: "POST /ccrc/residencies/{rid}/terminate"
    occ_field: "expected_residency_version"
    description: |
      Terminating a Residency whose version has advanced since the client last
      read it is rejected. Because termination sizes a refund off the residency's
      occupied_months and care_level, a stale view would compute the wrong refund
      tier; the OCC check forces the client to re-read first.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: entrance_fee_refund
    trigger: "Residency ACTIVE → TERMINATED_VOLUNTARY or TERMINATED_DEATH (creates RefundDisbursement.refundable_cents)"
    algorithm: tiered_pricing
    formula: |
      Let G = residency.entrance_fee_paid_cents
      Let m = residency.occupied_months
      per_month = floor(G * declining_monthly_bps / 10000)   # compute the per-month amount FIRST, then multiply
      Switch on plan.refund_plan:
        DECLINING:
          nonref = floor(G * declining_nonrefundable_bps / 10000)
          refundable = max(0, G - nonref - per_month * m)
        FIFTY_REFUNDABLE:
          floor_cents = floor(G * 5000 / 10000)              # 50% floor
          refundable = max(floor_cents, G - per_month * m)
        NINETY_REFUNDABLE:
          floor_cents = floor(G * 9000 / 10000)              # 90% floor
          refundable = max(floor_cents, G - per_month * m)
      EVALUATION ORDER IS PINNED: per_month = floor(G*bps/10000) is computed once
      and THEN multiplied by m. This differs in cents from floor(G*bps*m/10000)
      whenever G*declining_monthly_bps is not a multiple of 10000.
    input_set: "single residency at termination; m = residency.occupied_months frozen at terminate time"
    constants:
      FIFTY_FLOOR_BPS: 5000
      NINETY_FLOOR_BPS: 9000
      BPS_DENOM: 10000
    precision: "integer cents; floor on each bps product (round toward zero)"
    variants:
      - name: voluntary
        when: "reason == VOLUNTARY"
        difference: "Full amortization applies; DECLINING refundable can reach 0 once nonref + per_month*m >= G."
      - name: death
        when: "reason == DEATH"
        difference: "FIFTY_REFUNDABLE and NINETY_REFUNDABLE pay the full floor regardless of months occupied — refundable = floor_cents (the amortization term is dropped). DECLINING is unaffected and equals the voluntary value."

  - name: monthly_invoice_total
    trigger: "POST /ccrc/residencies/{rid}/invoices (computes MonthlyInvoice.total_cents)"
    algorithm: tiered_pricing
    formula: |
      base = plan.monthly_service_fee_cents
      IF residency.care_level == ASSISTED: base += plan.assisted_monthly_surcharge_cents
      second = plan.second_person_fee_cents IF residency.has_second_person ELSE 0
      d = skilled_days_in_period (request body; defaults to 0 if omitted)
      IF residency.care_level != SKILLED:
        care_surcharge = 0
      ELSE (care_level == SKILLED), switch on plan.contract_type:
        TYPE_A: care_surcharge = 0                              # life-care: no per-diem
        TYPE_B: remaining_free = max(0, plan.typeb_discounted_days - residency.skilled_days_used)
                billable_days = max(0, d - remaining_free)
                care_surcharge = billable_days * plan.skilled_per_diem_cents
        TYPE_C: care_surcharge = d * plan.skilled_per_diem_cents
      base_service_fee_cents = base
      second_person_fee_cents = second
      care_surcharge_cents = care_surcharge
      total_cents = base + second + care_surcharge
      PIN: the ASSISTED surcharge is folded into base BEFORE second-person is
      added, and second-person is a FLAT plan amount, never scaled by care level.
      skilled_days_used is read BEFORE this invoice's increment (the increment is
      a post-compute side effect).
    input_set: "one residency for one period; skilled_days_in_period in 0..30"
    constants:
      DAYS_IN_MONTH: 30
    precision: "integer cents; no rounding (all inputs are integer cents)"
    variants:
      - name: type_a_lifecare
        when: "plan.contract_type == TYPE_A"
        difference: "SKILLED days add zero per-diem — life-care covers nursing at no marginal monthly cost."
      - name: type_b_modified
        when: "plan.contract_type == TYPE_B"
        difference: "The first typeb_discounted_days skilled days across the residency are free; per-diem applies only after cumulative skilled_days_used exhausts them."
      - name: type_c_feeforservice
        when: "plan.contract_type == TYPE_C"
        difference: "Every skilled day is billed at skilled_per_diem_cents from the first day."

  - name: actuarial_reserve_disclosure
    trigger: "POST /ccrc/reserve-reports (generates disclosure + may freeze admissions)"
    algorithm: aggregation
    formula: |
      monthly_rate = community.actuarial_discount_rate_bps / 10000 / 12
      future_obligation_cents = 0
      refund_liability_cents = 0
      For each Residency r with status == ACTIVE in this community,
      iterated by created_at ASC (created_at is unique; never order by id):
        remaining = max(0, ACTUARIAL_HORIZON_MONTHS - r.occupied_months)
        IF monthly_rate > 0:
          pv_factor = (1 - (1 + monthly_rate) ** (-remaining)) / monthly_rate
        ELSE:
          pv_factor = remaining
        liability = floor(plan(r).monthly_service_fee_cents * pv_factor)
        future_obligation_cents += liability
        refund_liability_cents += entrance_fee_refund(r, VOLUNTARY variant, m = r.occupied_months)
      total_obligation_cents = future_obligation_cents + refund_liability_cents
      IF total_obligation_cents > 0:
        funded_ratio_bps = floor(community.reserve_assets_cents * 10000 / total_obligation_cents)
      ELSE:
        funded_ratio_bps = 10000
      is_deficient = funded_ratio_bps < community.target_funded_ratio_bps
      SIDE EFFECT: if funded_ratio_bps < floor(community.target_funded_ratio_bps / 2):
                   Community.is_admissions_frozen := true
    input_set: "all Residency rows with status == ACTIVE in the community at report time"
    constants:
      ACTUARIAL_HORIZON_MONTHS: 240
      BPS_DENOM: 10000
      DEFICIENCY_FREEZE_DIVISOR: 2
    precision: "integer cents; floor each present-value product and the funded_ratio_bps"

  - name: waitlist_ordering
    trigger: "WaitlistEntry create, place, withdraw (recomputes rank for a community + target_care_level queue)"
    algorithm: chronological
    formula: |
      Candidate set = WaitlistEntry rows with status == PENDING, the same
      community_id, and the same target_care_level.
      Sort ascending by:
        1. enqueued_period_index ASC   (earlier period wins — primary)
        2. priority_score DESC         (higher priority wins ties on period)
        3. created_at ASC              (earliest enqueue timestamp breaks remaining ties)
      Assign rank = 1-based index in this sorted order.
      Only the head (rank == 1) may be offered or placed.
      created_at is the final tie-break; id is NEVER used.
    input_set: "PENDING WaitlistEntry rows scoped to community_id + target_care_level"
    constants: {}
    precision: "integer rank, 1-based"

  - name: occupancy_period_accrual
    trigger: "POST /ccrc/communities/{cid}/clock/advance (per-period accrual on ACTIVE residencies)"
    algorithm: aggregation
    formula: |
      Advancing the clock by N periods: for every Residency r in this community
      with status == ACTIVE at advance time:
        r.occupied_months += N
      Activation sets occupied_months := 0 at the activation period, so a later
      N-step advance adds exactly N. The accrual is a pure counter increment.
    input_set: "all ACTIVE residencies in the community at the moment of the clock advance"
    constants: {}
    precision: "integer months"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_AUTH
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted to perform this operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path-referenced resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: existence
    check: "FK fields in request body reference existing resources"
    error_id: ERR_REFERENCED_ENTITY_NOT_FOUND
    http_status: 422
    applies_to: "create endpoints with FK body fields"

  - priority: 5
    category: business_constraint
    check: "Required body fields present and typed; enum values valid; positive-amount fields (entrance_fee_cents, monthly_service_fee_cents) > 0; second_person_fee_cents >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all write endpoints

  - priority: 6
    category: state
    check: "OCC: when expected_residency_version is supplied it must equal current Residency.version (runs BEFORE state-machine precondition checks)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /ccrc/residencies/{rid}/activate, POST /ccrc/residencies/{rid}/terminate"

  - priority: 7
    category: state
    check: "Target resource is in a state from which the requested transition is defined in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints (specific §1.6 error_ids take precedence over generic)"

  - priority: 8
    category: business_safety
    check: "Community.is_admissions_frozen must be false to assign a unit, place from waitlist, or activate a residency"
    error_id: ERR_ADMISSIONS_FROZEN
    http_status: 403
    applies_to: "assign-unit, waitlist place, activate"

  - priority: 9
    category: business_constraint
    check: "Care transition to_level must be exactly one step along INDEPENDENT↔ASSISTED↔SKILLED (no skip), in either direction"
    error_id: ERR_INVALID_CARE_STEP
    http_status: 422
    applies_to: "POST /ccrc/care-transitions/{ctid}/apply"

  - priority: 10
    category: business_referential
    check: "Applying a SKILLED care transition requires an OCCUPIED BedReservation for the residency"
    error_id: ERR_NO_BED_OCCUPIED
    http_status: 409
    applies_to: "POST /ccrc/care-transitions/{ctid}/apply (to_level == SKILLED)"

  - priority: 11
    category: business_constraint
    check: "A SecondPerson may be added only to a residency that has no ACTIVE second person"
    error_id: ERR_SECOND_PERSON_EXISTS
    http_status: 409
    applies_to: "POST /ccrc/residencies/{rid}/second-persons"

  - priority: 12
    category: business_temporal
    check: "BedReservation hold_expiry_period must be strictly greater than the current community period at hold time"
    error_id: ERR_INVALID_HOLD_WINDOW
    http_status: 422
    applies_to: "POST /ccrc/bed-reservations"

  - priority: 13
    category: business_safety
    check: "A SKILLED unit cannot accept a new reservation when its committed (HELD + OCCUPIED) reservations already equal bed_capacity"
    error_id: ERR_BED_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /ccrc/bed-reservations"

  - priority: 14
    category: business_constraint
    check: "Only the head (rank == 1) PENDING waitlist entry for a community + target_care_level may be offered or placed"
    error_id: ERR_WAITLIST_NOT_HEAD
    http_status: 409
    applies_to: "POST /ccrc/waitlist-entries/{wid}/offer, POST /ccrc/waitlist-entries/{wid}/place"

  - priority: 15
    category: business_constraint
    check: "A residency may cast at most one vote per resolution and must be ACTIVE to vote"
    error_id: ERR_DUPLICATE_VOTE
    http_status: 409
    applies_to: "POST /ccrc/council-resolutions/{resid}/votes"

  - priority: 16
    category: business_constraint
    check: "A resolution may only be closed once quorum is met"
    error_id: ERR_QUORUM_NOT_MET
    http_status: 409
    applies_to: "POST /ccrc/council-resolutions/{resid}/close"

  - priority: 17
    category: business_referential
    check: "A bed reservation may only target a Unit whose care_level == SKILLED"
    error_id: ERR_UNIT_NOT_SKILLED
    http_status: 422
    applies_to: "POST /ccrc/bed-reservations"

  - priority: 18
    category: business_constraint
    check: "skilled_days_in_period, when supplied on invoice issuance, must be an integer in 0..30"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /ccrc/residencies/{rid}/invoices"

  - priority: 19
    category: business_constraint
    check: "by_periods on a clock advance must be an integer >= 1"
    error_id: ERR_INVALID_CLOCK_ADVANCE
    http_status: 422
    applies_to: "POST /ccrc/communities/{cid}/clock/advance"

  - priority: 20
    category: business_constraint
    check: "vote choice must be exactly YES or NO; target_care_level and care_level enum bodies must be members of {INDEPENDENT, ASSISTED, SKILLED}"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /ccrc/council-resolutions/{resid}/votes, POST /ccrc/waitlist-entries, POST /ccrc/care-transitions, POST /ccrc/units"

  - priority: 21
    category: state
    check: "An invoice may only be issued for a residency that is currently ACTIVE"
    error_id: ERR_RESIDENCY_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /ccrc/residencies/{rid}/invoices"

  - priority: 22
    category: business_referential
    check: "A care transition may only be proposed for a residency that is ACTIVE (propose-time guard, mirrored at apply time)"
    error_id: ERR_RESIDENCY_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /ccrc/care-transitions"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Communities ---
  - method: POST
    path: "/ccrc/communities"
    description: "Create a community"
    roles: [FinanceOfficer]
    code: 201
    input: [name, actuarial_discount_rate_bps, "target_funded_ratio_bps?", "reserve_assets_cents?"]
    output: Community
    side_effects: ["current_period_index := 0", "is_admissions_frozen := false"]

  - method: GET
    path: "/ccrc/communities"
    description: "List communities"
    roles: [FinanceOfficer, AdmissionsDirector, CareCoordinator, Resident]
    code: 200
    input: []
    output: "Community[]"
    side_effects: []

  - method: GET
    path: "/ccrc/communities/{cid}"
    description: "Get a community (is_admissions_frozen, reserve_assets_cents)"
    roles: [FinanceOfficer, AdmissionsDirector, CareCoordinator, Resident]
    code: 200
    input: []
    output: Community
    side_effects: []

  - method: POST
    path: "/ccrc/communities/{cid}/clock/advance"
    description: "Advance the community clock by N periods; accrues occupied_months on ACTIVE residencies and sweeps expired bed holds"
    roles: [FinanceOfficer]
    code: 200
    input: [by_periods]
    output: Community
    side_effects:
      - "current_period_index += by_periods"
      - "each ACTIVE residency: occupied_months += by_periods (occupancy_period_accrual)"
      - "each HELD BedReservation with current_period_index > hold_expiry_period := EXPIRED (system sweep)"

  # --- Contract Plans ---
  - method: POST
    path: "/ccrc/contract-plans"
    description: "Create a contract plan (Type A/B/C with refund tier schedule)"
    roles: [FinanceOfficer]
    code: 201
    input: [community_id, name, contract_type, entrance_fee_cents, refund_plan, monthly_service_fee_cents, second_person_fee_cents, "declining_monthly_bps?", "declining_nonrefundable_bps?", "assisted_monthly_surcharge_cents?", "skilled_per_diem_cents?", "typeb_discounted_days?"]
    output: ContractPlan
    side_effects: []

  - method: GET
    path: "/ccrc/contract-plans"
    description: "List contract plans; filter by community_id"
    roles: [FinanceOfficer, AdmissionsDirector, CareCoordinator, Resident]
    code: 200
    input: ["community_id?"]
    output: "ContractPlan[]"
    side_effects: []

  - method: GET
    path: "/ccrc/contract-plans/{pid}"
    description: "Get a contract plan"
    roles: [FinanceOfficer, AdmissionsDirector, CareCoordinator, Resident]
    code: 200
    input: []
    output: ContractPlan
    side_effects: []

  # --- Units ---
  - method: POST
    path: "/ccrc/units"
    description: "Create a unit (INDEPENDENT/ASSISTED/SKILLED inventory)"
    roles: [AdmissionsDirector]
    code: 201
    input: [community_id, unit_number, care_level, "bed_capacity?"]
    output: Unit
    side_effects: ["status := AVAILABLE"]

  - method: GET
    path: "/ccrc/units"
    description: "List units; filter by community_id, care_level, status"
    roles: [FinanceOfficer, AdmissionsDirector, CareCoordinator, Resident]
    code: 200
    input: ["community_id?", "care_level?", "status?"]
    output: "Unit[]"
    side_effects: []

  - method: GET
    path: "/ccrc/units/{uid}"
    description: "Get a unit"
    roles: [FinanceOfficer, AdmissionsDirector, CareCoordinator, Resident]
    code: 200
    input: []
    output: Unit
    side_effects: []

  # --- Residents ---
  - method: POST
    path: "/ccrc/residents"
    description: "Register a prospective resident"
    roles: [AdmissionsDirector]
    code: 201
    input: [community_id, full_name, date_of_birth, "priority_score?"]
    output: Resident
    side_effects: []

  - method: GET
    path: "/ccrc/residents"
    description: "List residents; filter by community_id"
    roles: [FinanceOfficer, AdmissionsDirector, CareCoordinator, Resident]
    code: 200
    input: ["community_id?"]
    output: "Resident[]"
    side_effects: []

  - method: GET
    path: "/ccrc/residents/{resdid}"
    description: "Get a resident"
    roles: [FinanceOfficer, AdmissionsDirector, CareCoordinator, Resident]
    code: 200
    input: []
    output: Resident
    side_effects: []

  # --- Residencies ---
  - method: POST
    path: "/ccrc/residencies"
    description: "Open a residency contract (DEPOSIT_HELD)"
    roles: [AdmissionsDirector]
    code: 201
    input: [community_id, primary_resident_id, contract_plan_id]
    output: Residency
    side_effects: ["status := DEPOSIT_HELD", "care_level := INDEPENDENT"]

  - method: GET
    path: "/ccrc/residencies"
    description: "List residencies; filter by community_id, status, unit_id, contract_plan_id, primary_resident_id"
    roles: [FinanceOfficer, AdmissionsDirector, CareCoordinator, Resident]
    code: 200
    input: ["community_id?", "status?", "unit_id?", "contract_plan_id?", "primary_resident_id?"]
    output: "Residency[]"
    side_effects: []

  - method: GET
    path: "/ccrc/residencies/{rid}"
    description: "Get a residency (care_level, occupied_months, entrance_fee_paid_cents, version)"
    roles: [FinanceOfficer, AdmissionsDirector, CareCoordinator, Resident]
    code: 200
    input: []
    output: Residency
    side_effects: []

  - method: POST
    path: "/ccrc/residencies/{rid}/assign-unit"
    description: "Assign an INDEPENDENT unit directly (DEPOSIT_HELD → RESERVED)"
    roles: [AdmissionsDirector]
    code: 200
    input: [unit_id]
    output: Residency
    side_effects: ["Residency.unit_id := unit", "Unit.status := OCCUPIED", "status := RESERVED"]

  - method: POST
    path: "/ccrc/residencies/{rid}/activate"
    description: "Activate a reserved residency (RESERVED → ACTIVE); freezes entrance fee and books it into reserve"
    roles: [AdmissionsDirector]
    code: 200
    input: [expected_residency_version]
    output: Residency
    side_effects:
      - "entrance_fee_paid_cents := plan.entrance_fee_cents"
      - "occupied_months := 0; skilled_days_used := 0; care_level := INDEPENDENT"
      - "Community.reserve_assets_cents += entrance_fee_paid_cents"
      - "increments Residency.version by 1"

  - method: POST
    path: "/ccrc/residencies/{rid}/terminate"
    description: "Terminate a residency (ACTIVE → TERMINATED_*); creates refund disbursement, cascades unit/second-person/bed release"
    roles: [AdmissionsDirector]
    code: 200
    input: [reason, expected_residency_version]
    output: Residency
    side_effects:
      - "Assigned Unit.status := AVAILABLE"
      - "ACTIVE SecondPerson rows := REMOVED"
      - "HELD/OCCUPIED BedReservation rows := RELEASED (occupied skilled units freed)"
      - "RefundDisbursement created PENDING (entrance_fee_refund)"
      - "Community.reserve_assets_cents -= refundable_cents"
      - "increments Residency.version by 1"

  # --- Second Persons ---
  - method: POST
    path: "/ccrc/residencies/{rid}/second-persons"
    description: "Add a second person to a residency (sets has_second_person)"
    roles: [AdmissionsDirector]
    code: 201
    input: [full_name, date_of_birth]
    output: SecondPerson
    side_effects: ["Residency.has_second_person := true", "increments Residency.version by 1"]

  - method: GET
    path: "/ccrc/second-persons"
    description: "List second persons; filter by residency_id"
    roles: [FinanceOfficer, AdmissionsDirector, CareCoordinator, Resident]
    code: 200
    input: ["residency_id?"]
    output: "SecondPerson[]"
    side_effects: []

  - method: GET
    path: "/ccrc/second-persons/{spid}"
    description: "Get a second person"
    roles: [FinanceOfficer, AdmissionsDirector, CareCoordinator, Resident]
    code: 200
    input: []
    output: SecondPerson
    side_effects: []

  - method: POST
    path: "/ccrc/second-persons/{spid}/remove"
    description: "Remove a second person (ACTIVE → REMOVED)"
    roles: [AdmissionsDirector]
    code: 200
    input: []
    output: SecondPerson
    side_effects: ["Residency.has_second_person := false", "increments Residency.version by 1"]

  # --- Waitlist ---
  - method: POST
    path: "/ccrc/waitlist-entries"
    description: "Enqueue a DEPOSIT_HELD residency onto the priority waitlist (DEPOSIT_HELD → WAITLISTED)"
    roles: [AdmissionsDirector]
    code: 201
    input: [community_id, residency_id, target_care_level]
    output: WaitlistEntry
    side_effects:
      - "status := PENDING; enqueued_period_index := current_period_index"
      - "priority_score snapshotted from Resident.priority_score"
      - "rank computed via waitlist_ordering"
      - "Residency.status := WAITLISTED"

  - method: GET
    path: "/ccrc/waitlist-entries"
    description: "List waitlist entries; filter by community_id, residency_id, target_care_level, status"
    roles: [FinanceOfficer, AdmissionsDirector, CareCoordinator, Resident]
    code: 200
    input: ["community_id?", "residency_id?", "target_care_level?", "status?"]
    output: "WaitlistEntry[]"
    side_effects: []

  - method: GET
    path: "/ccrc/waitlist-entries/{wid}"
    description: "Get a waitlist entry (rank)"
    roles: [FinanceOfficer, AdmissionsDirector, CareCoordinator, Resident]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: []

  - method: POST
    path: "/ccrc/waitlist-entries/{wid}/offer"
    description: "Offer a unit to the head waitlist entry (PENDING → OFFERED)"
    roles: [AdmissionsDirector]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: []

  - method: POST
    path: "/ccrc/waitlist-entries/{wid}/place"
    description: "Place the head waitlist entry into a unit (→ PLACED; residency → RESERVED); re-ranks the queue"
    roles: [AdmissionsDirector]
    code: 200
    input: [unit_id]
    output: WaitlistEntry
    side_effects:
      - "Residency.unit_id := unit; Unit.status := OCCUPIED; Residency.status := RESERVED"
      - "remaining PENDING entries for community + target_care_level re-ranked"

  - method: POST
    path: "/ccrc/waitlist-entries/{wid}/withdraw"
    description: "Withdraw a waitlist entry (→ WITHDRAWN; residency → DEPOSIT_HELD); re-ranks the queue"
    roles: [AdmissionsDirector]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects:
      - "Residency.status := DEPOSIT_HELD"
      - "remaining PENDING entries for community + target_care_level re-ranked"

  # --- Care Transitions ---
  - method: POST
    path: "/ccrc/care-transitions"
    description: "Propose a care-level transition for an ACTIVE residency (PROPOSED)"
    roles: [CareCoordinator]
    code: 201
    input: [residency_id, to_level]
    output: CareTransition
    side_effects: ["status := PROPOSED", "from_level snapshotted from Residency.care_level"]

  - method: GET
    path: "/ccrc/care-transitions"
    description: "List care transitions; filter by residency_id, status"
    roles: [FinanceOfficer, AdmissionsDirector, CareCoordinator, Resident]
    code: 200
    input: ["residency_id?", "status?"]
    output: "CareTransition[]"
    side_effects: []

  - method: GET
    path: "/ccrc/care-transitions/{ctid}"
    description: "Get a care transition"
    roles: [FinanceOfficer, AdmissionsDirector, CareCoordinator, Resident]
    code: 200
    input: []
    output: CareTransition
    side_effects: []

  - method: POST
    path: "/ccrc/care-transitions/{ctid}/apply"
    description: "Apply a proposed care transition (PROPOSED → APPLIED); updates residency care_level"
    roles: [CareCoordinator]
    code: 200
    input: []
    output: CareTransition
    side_effects: ["Residency.care_level := to_level", "effective_period_index := current_period_index", "increments Residency.version by 1"]

  - method: POST
    path: "/ccrc/care-transitions/{ctid}/revert"
    description: "Revert a proposed care transition (PROPOSED → REVERTED); no continuum change"
    roles: [CareCoordinator]
    code: 200
    input: []
    output: CareTransition
    side_effects: []

  # --- Bed Reservations ---
  - method: POST
    path: "/ccrc/bed-reservations"
    description: "Hold a SKILLED health-center bed for a residency (HELD)"
    roles: [CareCoordinator]
    code: 201
    input: [residency_id, unit_id, hold_expiry_period]
    output: BedReservation
    side_effects: ["status := HELD", "hold_start_period := current_period_index", "increments Residency.version by 1"]

  - method: GET
    path: "/ccrc/bed-reservations"
    description: "List bed reservations; filter by residency_id, unit_id, status"
    roles: [FinanceOfficer, AdmissionsDirector, CareCoordinator, Resident]
    code: 200
    input: ["residency_id?", "unit_id?", "status?"]
    output: "BedReservation[]"
    side_effects: []

  - method: GET
    path: "/ccrc/bed-reservations/{brid}"
    description: "Get a bed reservation"
    roles: [FinanceOfficer, AdmissionsDirector, CareCoordinator, Resident]
    code: 200
    input: []
    output: BedReservation
    side_effects: []

  - method: POST
    path: "/ccrc/bed-reservations/{brid}/occupy"
    description: "Convert a HELD bed reservation to OCCUPIED (consumes the SKILLED unit bed)"
    roles: [CareCoordinator]
    code: 200
    input: []
    output: BedReservation
    side_effects: ["occupied_start_period := current_period_index", "Unit.status := OCCUPIED"]

  - method: POST
    path: "/ccrc/bed-reservations/{brid}/release"
    description: "Release a HELD or OCCUPIED bed reservation (→ RELEASED); frees the unit if it was occupied"
    roles: [CareCoordinator]
    code: 200
    input: []
    output: BedReservation
    side_effects: ["if was OCCUPIED: Unit.status := AVAILABLE"]

  # --- Monthly Invoices ---
  - method: POST
    path: "/ccrc/residencies/{rid}/invoices"
    description: "Issue a monthly service-fee invoice for the current period (monthly_invoice_total)"
    roles: [FinanceOfficer]
    code: 201
    input: ["skilled_days_in_period?"]
    output: MonthlyInvoice
    side_effects:
      - "computes base_service_fee_cents, second_person_fee_cents, care_surcharge_cents, total_cents"
      - "if SKILLED: residency.skilled_days_used += skilled_days_in_period (AFTER computing this invoice)"
      - "period_index := current_period_index; status := ISSUED"

  - method: GET
    path: "/ccrc/invoices"
    description: "List monthly invoices; filter by residency_id"
    roles: [FinanceOfficer, AdmissionsDirector, CareCoordinator, Resident]
    code: 200
    input: ["residency_id?"]
    output: "MonthlyInvoice[]"
    side_effects: []

  - method: GET
    path: "/ccrc/invoices/{invid}"
    description: "Get a monthly invoice"
    roles: [FinanceOfficer, AdmissionsDirector, CareCoordinator, Resident]
    code: 200
    input: []
    output: MonthlyInvoice
    side_effects: []

  # --- Refund Disbursements ---
  - method: GET
    path: "/ccrc/refund-disbursements"
    description: "List refund disbursements; filter by residency_id"
    roles: [FinanceOfficer, AdmissionsDirector, CareCoordinator, Resident]
    code: 200
    input: ["residency_id?"]
    output: "RefundDisbursement[]"
    side_effects: []

  - method: GET
    path: "/ccrc/refund-disbursements/{dsbid}"
    description: "Get a refund disbursement (refundable_cents)"
    roles: [FinanceOfficer, AdmissionsDirector, CareCoordinator, Resident]
    code: 200
    input: []
    output: RefundDisbursement
    side_effects: []

  - method: POST
    path: "/ccrc/refund-disbursements/{dsbid}/settle"
    description: "Settle a pending refund (PENDING → SETTLED)"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: RefundDisbursement
    side_effects: ["settlement_period_index := current_period_index", "status := SETTLED"]

  # --- Actuarial Reserve Disclosure ---
  - method: POST
    path: "/ccrc/communities/{cid}/reserve-reports"
    description: "Generate an actuarial reserve disclosure report (actuarial_reserve_disclosure)"
    roles: [FinanceOfficer]
    code: 201
    input: []
    output: "{ future_obligation_cents: integer, refund_liability_cents: integer, total_obligation_cents: integer, funded_ratio_bps: integer, is_deficient: boolean, reserve_assets_cents: integer }"
    side_effects:
      - "computes funded_ratio_bps over ACTIVE residencies"
      - "if funded_ratio_bps < floor(target_funded_ratio_bps / 2): Community.is_admissions_frozen := true"

  # --- Resident Council ---
  - method: POST
    path: "/ccrc/councils"
    description: "Create the resident council for a community"
    roles: [FinanceOfficer]
    code: 201
    input: [community_id, name, "quorum_pct_bps?"]
    output: ResidentCouncil
    side_effects: []

  - method: GET
    path: "/ccrc/councils"
    description: "List councils; filter by community_id"
    roles: [FinanceOfficer, AdmissionsDirector, CareCoordinator, Resident]
    code: 200
    input: ["community_id?"]
    output: "ResidentCouncil[]"
    side_effects: []

  - method: GET
    path: "/ccrc/councils/{coid}"
    description: "Get a council"
    roles: [FinanceOfficer, AdmissionsDirector, CareCoordinator, Resident]
    code: 200
    input: []
    output: ResidentCouncil
    side_effects: []

  - method: POST
    path: "/ccrc/council-resolutions"
    description: "Draft a council resolution (DRAFT)"
    roles: [FinanceOfficer]
    code: 201
    input: [council_id, title]
    output: CouncilResolution
    side_effects: ["status := DRAFT"]

  - method: GET
    path: "/ccrc/council-resolutions"
    description: "List council resolutions; filter by council_id"
    roles: [FinanceOfficer, AdmissionsDirector, CareCoordinator, Resident]
    code: 200
    input: ["council_id?"]
    output: "CouncilResolution[]"
    side_effects: []

  - method: GET
    path: "/ccrc/council-resolutions/{resid}"
    description: "Get a council resolution (yes_votes, no_votes, eligible_voter_count)"
    roles: [FinanceOfficer, AdmissionsDirector, CareCoordinator, Resident]
    code: 200
    input: []
    output: CouncilResolution
    side_effects: []

  - method: POST
    path: "/ccrc/council-resolutions/{resid}/open"
    description: "Open a resolution for voting (DRAFT → OPEN); snapshots eligible_voter_count"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: CouncilResolution
    side_effects: ["eligible_voter_count := count of ACTIVE residencies in the community"]

  - method: POST
    path: "/ccrc/council-resolutions/{resid}/votes"
    description: "Cast a vote on an OPEN resolution as a Resident"
    roles: [Resident]
    code: 201
    input: [residency_id, choice]
    output: CouncilResolution
    side_effects: ["yes_votes or no_votes incremented per choice"]

  - method: POST
    path: "/ccrc/council-resolutions/{resid}/close"
    description: "Close an OPEN resolution (→ PASSED if quorum met and yes>no, else FAILED)"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: CouncilResolution
    side_effects: ["status := PASSED or FAILED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_AUTH, http: 401, condition: "X-User-ID or X-User-Role header missing/malformed" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path-referenced resource does not exist" }
  - { id: ERR_REFERENCED_ENTITY_NOT_FOUND, http: 422, condition: "A body FK references a non-existent resource" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/invalid body field, bad enum, non-positive fee, or bad terminate reason" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_residency_version does not match current Residency.version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic: transition not defined from the resource's current state" }
  - { id: ERR_ADMISSIONS_FROZEN, http: 403, condition: "Community.is_admissions_frozen is true and the op admits/places/activates" }
  - { id: ERR_RESIDENCY_NOT_DEPOSIT_HELD, http: 409, condition: "Assign-unit/waitlist on a residency not in DEPOSIT_HELD" }
  - { id: ERR_RESIDENCY_NOT_RESERVED, http: 409, condition: "Activate on a residency not in RESERVED" }
  - { id: ERR_RESIDENCY_NOT_ACTIVE, http: 409, condition: "Operation requires residency ACTIVE (terminate, care apply, bed occupy)" }
  - { id: ERR_RESIDENCY_NOT_WAITLISTED, http: 409, condition: "Waitlist place targets a residency not in WAITLISTED" }
  - { id: ERR_NO_UNIT_ASSIGNED, http: 409, condition: "Activate attempted with no unit_id assigned" }
  - { id: ERR_UNIT_NOT_AVAILABLE, http: 409, condition: "Target unit is not AVAILABLE" }
  - { id: ERR_UNIT_CARE_LEVEL_MISMATCH, http: 422, condition: "Assigned independent unit care_level is not INDEPENDENT" }
  - { id: ERR_DUPLICATE_WAITLIST_ENTRY, http: 409, condition: "Residency already has a PENDING waitlist entry" }
  - { id: ERR_WAITLIST_ENTRY_NOT_PENDING, http: 409, condition: "Offer on a non-PENDING entry where PENDING required" }
  - { id: ERR_WAITLIST_ENTRY_NOT_PLACEABLE, http: 409, condition: "Place on an entry not in OFFERED or PENDING" }
  - { id: ERR_WAITLIST_ENTRY_NOT_WITHDRAWABLE, http: 409, condition: "Withdraw on an entry not in PENDING or OFFERED" }
  - { id: ERR_WAITLIST_NOT_HEAD, http: 409, condition: "Offer/place on a waitlist entry whose rank is not 1" }
  - { id: ERR_CARE_TRANSITION_NOT_PROPOSED, http: 409, condition: "Apply/revert on a care transition not in PROPOSED" }
  - { id: ERR_INVALID_CARE_STEP, http: 422, condition: "to_level skips a continuum step (e.g., INDEPENDENT→SKILLED direct)" }
  - { id: ERR_NO_BED_OCCUPIED, http: 409, condition: "Applying a SKILLED transition with no OCCUPIED bed reservation" }
  - { id: ERR_SECOND_PERSON_EXISTS, http: 409, condition: "Adding a second person when one is already ACTIVE" }
  - { id: ERR_BED_RESERVATION_NOT_HELD, http: 409, condition: "Occupy or release-from-held on a reservation not in HELD" }
  - { id: ERR_BED_RESERVATION_NOT_RELEASABLE, http: 409, condition: "Release on a reservation not in HELD or OCCUPIED" }
  - { id: ERR_BED_RESERVATION_EXPIRED, http: 409, condition: "Occupy attempted after hold_expiry_period" }
  - { id: ERR_INVALID_HOLD_WINDOW, http: 422, condition: "hold_expiry_period <= current period at hold time" }
  - { id: ERR_BED_CAPACITY_EXCEEDED, http: 409, condition: "SKILLED unit's HELD+OCCUPIED reservations already equal bed_capacity" }
  - { id: ERR_UNIT_NOT_SKILLED, http: 422, condition: "A bed reservation targets a Unit whose care_level is not SKILLED" }
  - { id: ERR_INVALID_CLOCK_ADVANCE, http: 422, condition: "clock advance by_periods is not an integer >= 1" }
  - { id: ERR_RESOLUTION_NOT_DRAFT, http: 409, condition: "Open on a resolution not in DRAFT" }
  - { id: ERR_RESOLUTION_NOT_OPEN, http: 409, condition: "Vote/close on a resolution not in OPEN" }
  - { id: ERR_DUPLICATE_VOTE, http: 409, condition: "Same residency votes twice on one resolution, or a non-ACTIVE residency votes" }
  - { id: ERR_QUORUM_NOT_MET, http: 409, condition: "Close attempted before the quorum threshold is reached" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FinanceOfficer
    description: "Manages communities, contract plans, monthly billing, refund settlement, reserve disclosure, and council governance."
    identity: "opaque"
    exclusive_operations:
      - "POST /ccrc/communities — Create community"
      - "POST /ccrc/communities/{cid}/clock/advance — Advance clock"
      - "POST /ccrc/contract-plans — Create contract plan"
      - "POST /ccrc/residencies/{rid}/invoices — Issue monthly invoice"
      - "POST /ccrc/refund-disbursements/{dsbid}/settle — Settle refund"
      - "POST /ccrc/communities/{cid}/reserve-reports — Generate reserve disclosure"
      - "POST /ccrc/councils — Create council"
      - "POST /ccrc/council-resolutions — Draft resolution"
      - "POST /ccrc/council-resolutions/{resid}/open — Open resolution"
      - "POST /ccrc/council-resolutions/{resid}/close — Close resolution"

  - name: AdmissionsDirector
    description: "Manages units, residents, residency lifecycle, second persons, and the priority waitlist."
    identity: "opaque"
    exclusive_operations:
      - "POST /ccrc/units — Create unit"
      - "POST /ccrc/residents — Register resident"
      - "POST /ccrc/residencies — Open residency"
      - "POST /ccrc/residencies/{rid}/assign-unit — Assign unit"
      - "POST /ccrc/residencies/{rid}/activate — Activate residency"
      - "POST /ccrc/residencies/{rid}/terminate — Terminate residency"
      - "POST /ccrc/residencies/{rid}/second-persons — Add second person"
      - "POST /ccrc/second-persons/{spid}/remove — Remove second person"
      - "POST /ccrc/waitlist-entries — Enqueue waitlist"
      - "POST /ccrc/waitlist-entries/{wid}/offer — Offer waitlist head"
      - "POST /ccrc/waitlist-entries/{wid}/place — Place from waitlist"
      - "POST /ccrc/waitlist-entries/{wid}/withdraw — Withdraw waitlist"

  - name: CareCoordinator
    description: "Manages the care continuum (transitions) and health-center bed reservations."
    identity: "opaque"
    exclusive_operations:
      - "POST /ccrc/care-transitions — Propose care transition"
      - "POST /ccrc/care-transitions/{ctid}/apply — Apply transition"
      - "POST /ccrc/care-transitions/{ctid}/revert — Revert transition"
      - "POST /ccrc/bed-reservations — Hold bed"
      - "POST /ccrc/bed-reservations/{brid}/occupy — Occupy bed"
      - "POST /ccrc/bed-reservations/{brid}/release — Release bed"

  - name: Resident
    description: "A resident; entity-backed by Resident. Reads community data and casts council votes on behalf of their own ACTIVE residency."
    identity: "entity_backed:Resident"
    exclusive_operations:
      - "POST /ccrc/council-resolutions/{resid}/votes — Cast council vote"
    shared_operations:
      - "GET endpoints (lists and reads) shared across all roles"
