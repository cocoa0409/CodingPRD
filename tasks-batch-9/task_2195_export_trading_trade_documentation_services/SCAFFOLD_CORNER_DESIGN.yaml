            - "provisional_buyer_cost_usd == 2816.25 — B4 == 690.00 (max(450.00, 300.00 * 1.15 * 2)), B5 == 96.25 (max(75.00, 0.0035 * 25000.00 * 1.10)), B6 == 295.00, B7 == 110.00, B8 == 1625.00"
