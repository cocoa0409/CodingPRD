            - "${k_enc_c1_pa} == ${k_pa_c_id} and PriorAuthorization.${k_pa_c_id}.injections_used == 1 with status EXHAUSTED"
            - "${k_pa_exhausted} == \"ERR_AUTHORIZATION_EXHAUSTED\" with HTTP 409"
            - "DrugLot.${k_lot_id}.vials_administered == 1 and vials_reserved == 0 — the rejected encounter reserved nothing"

      - name: corner_a_biosimilar_substitution_invalidates_the_reference_drug_authorization
        claim_type: cross_entity_validation
        grounds:
