  - section: validations
    instances:
      - name: missing_role_header_returns_unauthenticated_400
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors.ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
        distinguishing_aspect: "A request without a valid X-User-Role fails 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before any role, shape, or existence check runs."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z."
          setup_api_calls:
            - *k_clock0
          trigger:
            - call: "POST /emissions/regulation-standards"
              payload: { code: "X-1", nox_limit_g_per_bhp_hr: 0.35, pm_limit_g_per_bhp_hr: 0.01, useful_life_miles: 435000, useful_life_hours: 22000, useful_life_years: 10, base_warranty_years: 2, base_warranty_miles: 50000, effective_model_year_first: 2027, effective_model_year_last: 2030 }
              as: PlatformAdmin
              captures: { auth_err: $.data.error_id }
          assert:
            - "the request is sent with the X-User-Role header omitted (or carrying an unknown role name) and returns 400 with error_id ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER via ${auth_err}"
            - "no standard is created: GET /emissions/regulation-standards returns an empty array"

      - name: existence_gate_fires_before_state_gate
        claim_type: Priority Ordering
        grounds:
          - validations[priority=4]
          - validations[priority=7]
          - errors.ERR_NOT_FOUND
        distinguishing_aspect: "begin-testing on a never-allocated family id returns 404 ERR_NOT_FOUND (existence, priority 4), proving existence is evaluated before any state precondition."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; empty database."
          setup_api_calls:
            - *k_clock0
          trigger:
            - call: "POST /emissions/engine-families/00000000-0000-0000-0000-000000000000/begin-testing"
              payload: {}
              as: CertificationEngineer
              captures: { nf_err: $.data.error_id }
          assert:
            - "the response status is 404 with error_id ERR_NOT_FOUND via ${nf_err}"

      - name: supersede_with_earlier_window_rejected
        claim_type: Violation → Error
        grounds:
          - state_machines.RegulationStandard.PUBLISHED_to_SUPERSEDED
          - errors.ERR_SUPERSESSION_WINDOW_INVALID
        distinguishing_aspect: "The successor's first model year must be strictly later: a PUBLISHED 2024-2026 standard cannot succeed the PUBLISHED 2027-2030 standard (2024 < 2027), even though the two published windows never overlapped."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; standard OLD (2024-2026) PUBLISHED first, then standard EPA2027-HD (2027-2030) PUBLISHED."
          setup_api_calls:
            - *k_clock0
            - call: "POST /emissions/regulation-standards"
              payload: { code: "EPA2024-HD", nox_limit_g_per_bhp_hr: 0.40, pm_limit_g_per_bhp_hr: 0.01, useful_life_miles: 435000, useful_life_hours: 22000, useful_life_years: 10, base_warranty_years: 2, base_warranty_miles: 50000, effective_model_year_first: 2024, effective_model_year_last: 2026 }
              as: PlatformAdmin
              captures: { std_old: $.data.id }
            - call: "POST /emissions/regulation-standards/${std_old}/publish"
              payload: {}
              as: RegulatoryOfficer
            - *k_std
            - *k_std_pub
          trigger:
            - call: "POST /emissions/regulation-standards/${std_id}/supersede"
              payload: { successor_standard_id: "${std_old}" }
              as: RegulatoryOfficer
              captures: { sup_err: $.data.error_id }
          assert:
            - "supersede returns 409 with error_id ERR_SUPERSESSION_WINDOW_INVALID via ${sup_err} (successor first year 2024 is not strictly later than 2027)"
            - "RegulationStandard.${std_id}.status remains PUBLISHED and successor_standard_id stays null"

      - name: publish_overlapping_published_window_rejected
        claim_type: Violation → Error
        grounds:
          - state_machines.RegulationStandard.DRAFT_to_PUBLISHED
          - errors.ERR_STANDARD_WINDOW_OVERLAP
        distinguishing_aspect: "Only one PUBLISHED standard may cover any model year: publishing a 2029-2032 candidate fails while 2027-2030 and 2031-2034 are PUBLISHED, and a non-overlapping 2035-2038 candidate publishes cleanly in the same database."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; EPA2027-HD (2027-2030) and EPA2031-HD (2031-2034) both PUBLISHED; candidates OVER (2029-2032) and FAR (2035-2038) in DRAFT."
          setup_api_calls:
            - *k_clock0
            - *k_std
            - *k_std_pub
            - call: "POST /emissions/regulation-standards"
              payload: { code: "EPA2031-HD", nox_limit_g_per_bhp_hr: 0.20, pm_limit_g_per_bhp_hr: 0.005, useful_life_miles: 435000, useful_life_hours: 22000, useful_life_years: 10, base_warranty_years: 2, base_warranty_miles: 50000, effective_model_year_first: 2031, effective_model_year_last: 2034 }
              as: PlatformAdmin
              captures: { std_new: $.data.id }
            - call: "POST /emissions/regulation-standards/${std_new}/publish"
              payload: {}
              as: RegulatoryOfficer
            - call: "POST /emissions/regulation-standards"
              payload: { code: "EPA2029-HD", nox_limit_g_per_bhp_hr: 0.30, pm_limit_g_per_bhp_hr: 0.008, useful_life_miles: 435000, useful_life_hours: 22000, useful_life_years: 10, base_warranty_years: 2, base_warranty_miles: 50000, effective_model_year_first: 2029, effective_model_year_last: 2032 }
              as: PlatformAdmin
              captures: { std_over: $.data.id }
            - call: "POST /emissions/regulation-standards"
              payload: { code: "EPA2035-HD", nox_limit_g_per_bhp_hr: 0.15, pm_limit_g_per_bhp_hr: 0.004, useful_life_miles: 435000, useful_life_hours: 22000, useful_life_years: 10, base_warranty_years: 2, base_warranty_miles: 50000, effective_model_year_first: 2035, effective_model_year_last: 2038 }
              as: PlatformAdmin
              captures: { std_far: $.data.id }
          trigger:
            - call: "POST /emissions/regulation-standards/${std_over}/publish"
              payload: {}
              as: RegulatoryOfficer
              captures: { ovl_err: $.data.error_id }
            - call: "POST /emissions/regulation-standards/${std_far}/publish"
              payload: {}
              as: RegulatoryOfficer
              captures: { far_status: $.data.status }
          assert:
            - "publishing the 2029-2032 candidate returns 409 with error_id ERR_STANDARD_WINDOW_OVERLAP via ${ovl_err} (overlaps both published windows)"
            - "publishing the 2035-2038 candidate succeeds: status == PUBLISHED via ${far_status} with published_at == 2026-09-01T00:00:00Z"
            - "RegulationStandard.${std_over}.status remains DRAFT"

      - name: family_model_year_outside_standard_window_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=10]
          - errors.ERR_MODEL_YEAR_OUTSIDE_STANDARD_WINDOW
        distinguishing_aspect: "A family whose model_year 2031 falls outside the PUBLISHED standard's 2027-2030 window fails 422 ERR_MODEL_YEAR_OUTSIDE_STANDARD_WINDOW — transition planning across model years is enforced at family creation."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; EPA2027-HD PUBLISHED."
          setup_api_calls:
            - *k_clock0
            - *k_std
            - *k_std_pub
          trigger:
            - call: "POST /emissions/engine-families"
              payload: { family_code: "Z-EARLY", model_year: 2031, regulation_standard_id: "${std_id}", displacement_liters: 14.9, architecture: "DOC_DPF_SCR" }
              as: CertificationEngineer
              captures: { win_err: $.data.error_id }
          assert:
            - "the response status is 422 with error_id ERR_MODEL_YEAR_OUTSIDE_STANDARD_WINDOW via ${win_err}"
            - "GET /emissions/engine-families returns an empty array"

      - name: family_create_against_draft_standard_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=7]
          - errors.ERR_STANDARD_NOT_PUBLISHED
        distinguishing_aspect: "A DRAFT standard cannot certify anything: family creation against it fails 409 ERR_STANDARD_NOT_PUBLISHED even though the model year fits the window."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; EPA2027-HD created but never published."
          setup_api_calls:
            - *k_clock0
            - *k_std
          trigger:
            - call: "POST /emissions/engine-families"
              payload: { family_code: "Z-DRAFT", model_year: 2027, regulation_standard_id: "${std_id}", displacement_liters: 14.9, architecture: "DOC_DPF_SCR" }
              as: CertificationEngineer
              captures: { draft_err: $.data.error_id }
          assert:
            - "the response status is 409 with error_id ERR_STANDARD_NOT_PUBLISHED via ${draft_err}"

