  # =================================================================
  # Rule 7 — cross_entity_state_dependency (2 instances, distinct pairs)
  # =================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: publish_requires_provider_effective
        grounds:
          - state_machines.DirectoryListing.DRAFT_to_LISTED
          - state_machines.Provider.PENDING_LOAD_to_EFFECTIVE
        distinguishing_aspect: |
          Entity pair = Provider -> DirectoryListing. Publish is gated on the PROVIDER's state:
          PENDING_LOAD blocks with ERR_PROVIDER_NOT_EFFECTIVE; the clock sweep effectuates the
          provider and the identical publish then succeeds.
        test_recipe:
          setup:
            - "Clock 2026-05-01; provider with contract_effective_date 2026-06-01 (future) -> PENDING_LOAD; location + DRAFT listing + standard all present"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: NetworkManager }
            - { call: "POST /network/regions", payload: { county_fips: "06033", name: "Mendocino", geo_class: "URBAN", enrolled_member_count: 100 }, as: NetworkManager, captures: { reg: "$.data.id" } }
            - { call: "POST /network/standards", payload: { specialty: "CARDIOLOGY", geo_class: "URBAN", max_members_per_provider: 1200, max_travel_minutes: 30, max_travel_miles: 15, max_wait_days_routine: 15, max_wait_days_urgent: 2 }, as: NetworkManager }
            - { call: "POST /network/providers", payload: { npi: "1000000025", legal_name: "Heart 25", specialty: "CARDIOLOGY", contract_effective_date: "2026-06-01" }, as: NetworkManager, captures: { prov: "$.data.id", prov_st: "$.data.status" } }
            - { call: "POST /network/locations", payload: { provider_id: "${prov}", region_id: "${reg}", address_line: "25 Main St", panel_status: "OPEN", avg_travel_minutes: 10, avg_travel_miles: 5 }, as: NetworkManager, captures: { loc: "$.data.id" } }
            - { call: "POST /network/listings", payload: { provider_id: "${prov}", location_id: "${loc}", specialty: "CARDIOLOGY", display_name: "Heart 25", phone: "555-0125", accepts_new_patients: true }, as: NetworkManager, captures: { lst: "$.data.id" } }
          trigger:
            - { call: "POST /network/listings/${lst}/publish", as: NetworkManager, captures: { err: "$.data.error_id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: NetworkManager }
            - { call: "POST /network/listings/${lst}/publish", as: NetworkManager, captures: { st_after: "$.data.status" } }
          assert:
            - "provider created with status == PENDING_LOAD (effective date in the future)"
            - "first publish rejected with error_id == ERR_PROVIDER_NOT_EFFECTIVE (409)"
            - "after clock sweep to 2026-06-01 the provider is EFFECTIVE and the identical publish succeeds: status == LISTED"

      - name: decide_requires_deficiency_open
        grounds:
          - state_machines.AccessPlanRequest.SUBMITTED_to_APPROVED
          - state_machines.DeficiencyRecord.OPEN_to_CLOSED
        distinguishing_aspect: |
          Entity pair = DeficiencyRecord -> AccessPlanRequest (different pair than Provider ->
          DirectoryListing). A SUBMITTED request cannot be approved once its deficiency has CLOSED
          via a later compliant finalize: decide returns ERR_DEFICIENCY_NOT_OPEN.
        test_recipe:
          setup:
            - "Region enrolled 12000, DERMATOLOGY std max 15000, zero providers; E1 (06-01..06-11) finalize opens deficiency D; access plan request created+submitted; then dermatologist published and E2 (06-12..06-21) finalize closes D"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: NetworkManager }
            - { call: "POST /network/regions", payload: { county_fips: "06035", name: "Merced", geo_class: "URBAN", enrolled_member_count: 12000 }, as: NetworkManager, captures: { reg: "$.data.id" } }
            - { call: "POST /network/standards", payload: { specialty: "DERMATOLOGY", geo_class: "URBAN", max_members_per_provider: 15000, max_travel_minutes: 45, max_travel_miles: 30, max_wait_days_routine: 20, max_wait_days_urgent: 3 }, as: NetworkManager }
            - { call: "POST /network/evaluations", payload: { measurement_period: "E1", period_start_date: "2026-06-01", period_end_date: "2026-06-11" }, as: NetworkManager, captures: { ev1: "$.data.id" } }
            - { call: "POST /network/evaluations/${ev1}/finalize", as: NetworkManager }
            - { call: "GET /network/deficiencies", payload: { evaluation_id: "${ev1}", region_id: "${reg}" }, as: NetworkManager, captures: { d1: "$.data[0].id", d1_v: "$.data[0].version" } }
            - { call: "POST /network/deficiencies/${d1}/access-plan-requests", payload: { expected_deficiency_version: "${d1_v}", remedy_summary: "recruiting plan", excuse_start_date: "2026-07-01", excuse_through_date: "2026-07-31" }, as: NetworkManager, captures: { req: "$.data.id" } }
            - { call: "POST /network/access-plan-requests/${req}/submit", as: NetworkManager }
            - { call: "POST /network/providers", payload: { npi: "1000000027", legal_name: "Derm 27", specialty: "DERMATOLOGY", contract_effective_date: "2026-04-01" }, as: NetworkManager, captures: { prov: "$.data.id" } }
            - { call: "POST /network/locations", payload: { provider_id: "${prov}", region_id: "${reg}", address_line: "27 Palm Ave", panel_status: "OPEN", avg_travel_minutes: 20, avg_travel_miles: 10 }, as: NetworkManager, captures: { loc: "$.data.id" } }
            - { call: "POST /network/listings", payload: { provider_id: "${prov}", location_id: "${loc}", specialty: "DERMATOLOGY", display_name: "Derm 27", phone: "555-0127", accepts_new_patients: true }, as: NetworkManager, captures: { lst: "$.data.id" } }
            - { call: "POST /network/listings/${lst}/publish", as: NetworkManager }
            - { call: "POST /network/evaluations", payload: { measurement_period: "E2", period_start_date: "2026-06-12", period_end_date: "2026-06-21" }, as: NetworkManager, captures: { ev2: "$.data.id" } }
            - { call: "POST /network/evaluations/${ev2}/finalize", as: NetworkManager }
          trigger:
            - { call: "POST /network/access-plan-requests/${req}/decide", payload: { decision: "APPROVED" }, as: Regulator, captures: { err: "$.data.error_id" } }
            - { call: "GET /network/deficiencies/${d1}", as: NetworkManager, captures: { d_status: "$.data.status", d_closed: "$.data.closed_date" } }
          assert:
            - "deficiency ${d1} CLOSED by the compliant E2 finalize (closed_date == '2026-06-21')"
            - "decide on the still-SUBMITTED request rejected with error_id == ERR_DEFICIENCY_NOT_OPEN (409)"

  # =================================================================
  # Rule 8 — resource_temporal_overlap (2 instances, different interval semantics)
  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: attestation_cycle_half_open_adjacency_allowed
        grounds:
          - validations[priority=9]
          - entities.AttestationCycle.fields.open_date
          - entities.AttestationCycle.fields.outreach_close_date
        distinguishing_aspect: |
          Resource = AttestationCycle; semantics = HALF-OPEN [open_date, outreach_close_date):
          a new cycle whose open_date equals the prior cycle's outreach_close_date touches without
          overlapping (allowed, 201), while one day earlier (open 06-09 vs close 06-20) is a true
          overlap (409 ERR_CYCLE_WINDOW_OVERLAP).
        test_recipe:
          setup:
            - "Cycle C1 with window [2026-05-01, 2026-05-20) exists (SCHEDULED)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: NetworkManager }
            - { call: "POST /network/attestation-cycles", payload: { cycle_label: "C1", open_date: "2026-05-01", due_date: "2026-05-10", outreach_close_date: "2026-05-20" }, as: NetworkManager, captures: { c1: "$.data.id" } }
          trigger:
            - { call: "POST /network/attestation-cycles", payload: { cycle_label: "C2", open_date: "2026-05-20", due_date: "2026-05-25", outreach_close_date: "2026-05-31" }, as: NetworkManager, captures: { c2: "$.data.id" } }
            - { call: "POST /network/attestation-cycles", payload: { cycle_label: "C3", open_date: "2026-05-30", due_date: "2026-06-05", outreach_close_date: "2026-06-10" }, as: NetworkManager, captures: { err: "$.data.error_id" } }
          assert:
            - "C2 created (201): open 2026-05-20 == C1 outreach_close 2026-05-20 is adjacency, not overlap, under half-open semantics"
            - "C3 rejected with ERR_CYCLE_WINDOW_OVERLAP (409): [05-30, 06-10) overlaps C2's [05-20, 05-31)"

      - name: access_plan_excuse_closed_interval_touching_overlaps
        grounds:
          - validations[priority=9]
          - state_machines.AccessPlanRequest.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Resource = AccessPlanRequest excuse windows (per deficiency); semantics = CLOSED interval
          [excuse_start_date, excuse_through_date]: touching endpoints DO overlap. After a first
          approved window [07-01, 07-31] and a reopen, a second request starting 07-31 is rejected
          with ERR_EXCUSE_WINDOW_OVERLAP, while one starting 08-01 approves cleanly.
        test_recipe:
          setup:
            - "Region enrolled 12000, DERMATOLOGY std max 15000, zero providers; E1 (06-01..06-11) opens D (accrual 149985); R1 [07-01, 07-31] approved -> D EXCUSED, outstanding 0; E2 (06-12..08-15) finalize finds pair still DEFICIENT with excuse lapsed -> D reopens OPEN accruing the tail window 07-31..08-15"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: NetworkManager }
            - { call: "POST /network/regions", payload: { county_fips: "06037", name: "Modoc", geo_class: "URBAN", enrolled_member_count: 12000 }, as: NetworkManager, captures: { reg: "$.data.id" } }
            - { call: "POST /network/standards", payload: { specialty: "DERMATOLOGY", geo_class: "URBAN", max_members_per_provider: 15000, max_travel_minutes: 45, max_travel_miles: 30, max_wait_days_routine: 20, max_wait_days_urgent: 3 }, as: NetworkManager }
            - { call: "POST /network/evaluations", payload: { measurement_period: "E1", period_start_date: "2026-06-01", period_end_date: "2026-06-11" }, as: NetworkManager, captures: { ev1: "$.data.id" } }
            - { call: "POST /network/evaluations/${ev1}/finalize", as: NetworkManager }
            - { call: "GET /network/deficiencies", payload: { evaluation_id: "${ev1}", region_id: "${reg}" }, as: NetworkManager, captures: { d1: "$.data[0].id", d1_v: "$.data[0].version" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-15T00:00:00Z" }, as: NetworkManager }
            - { call: "POST /network/deficiencies/${d1}/access-plan-requests", payload: { expected_deficiency_version: "${d1_v}", remedy_summary: "locum tenens", excuse_start_date: "2026-07-01", excuse_through_date: "2026-07-31" }, as: NetworkManager, captures: { r1: "$.data.id" } }
            - { call: "POST /network/access-plan-requests/${r1}/submit", as: NetworkManager }
            - { call: "POST /network/access-plan-requests/${r1}/decide", payload: { decision: "APPROVED" }, as: Regulator }
            - { call: "POST /network/evaluations", payload: { measurement_period: "E2", period_start_date: "2026-06-12", period_end_date: "2026-08-15" }, as: NetworkManager, captures: { ev2: "$.data.id" } }
            - { call: "POST /network/evaluations/${ev2}/finalize", as: NetworkManager }
            - { call: "GET /network/deficiencies/${d1}", as: NetworkManager, captures: { d_st: "$.data.status", d_v2: "$.data.version", d_out2: "$.data.outstanding_penalty_cents" } }
          trigger:
            - { call: "POST /network/deficiencies/${d1}/access-plan-requests", payload: { expected_deficiency_version: "${d_v2}", remedy_summary: "extension touching prior window", excuse_start_date: "2026-07-31", excuse_through_date: "2026-08-31" }, as: NetworkManager, captures: { r2: "$.data.id" } }
            - { call: "POST /network/access-plan-requests/${r2}/submit", as: NetworkManager }
            - { call: "POST /network/access-plan-requests/${r2}/decide", payload: { decision: "APPROVED" }, as: Regulator, captures: { err: "$.data.error_id" } }
            - { call: "GET /network/deficiencies/${d1}", as: NetworkManager, captures: { d_v3: "$.data.version" } }
            - { call: "POST /network/deficiencies/${d1}/access-plan-requests", payload: { expected_deficiency_version: "${d_v3}", remedy_summary: "clean extension", excuse_start_date: "2026-08-01", excuse_through_date: "2026-08-31" }, as: NetworkManager, captures: { r3: "$.data.id" } }
            - { call: "POST /network/access-plan-requests/${r3}/submit", as: NetworkManager }
            - { call: "POST /network/access-plan-requests/${r3}/decide", payload: { decision: "APPROVED" }, as: Regulator, captures: { st3: "$.data.status" } }
          assert:
            - "after E2 reopen: deficiency status == OPEN and outstanding_penalty_cents == 224978 (tail 07-31..08-15 = 15 days; 9999*15*1.5 = 224977.5 -> 224978)"
            - "R2 decide APPROVED rejected with error_id == ERR_EXCUSE_WINDOW_OVERLAP (409): closed interval [07-31, 08-31] touches approved [07-01, 07-31] at 07-31"
            - "R3 [08-01, 08-31] decides APPROVED (200): 08-01 > 07-31 leaves no shared day"

  # =================================================================
  # Rule 9 — compensating_invariant (2 instances, different conserved quantities)
  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: provider_suspend_reinstate_restores_listed_count
        grounds:
          - calculations.listed_count_invariant
          - state_machines.Provider.EFFECTIVE_to_SUSPENDED
          - state_machines.Provider.SUSPENDED_to_EFFECTIVE
        distinguishing_aspect: |
          Conserved quantity = LISTED listing count per (region, specialty). Suspend suppresses
          exactly the LISTED listings (reason PROVIDER_SUSPENDED); reinstate restores exactly that
          set; the compensating pair leaves listed_count(R, CARDIOLOGY) == 2 with zero drift.
        test_recipe:
          setup:
            - "EFFECTIVE provider with 2 LISTED CARDIOLOGY listings in one region (listed_count == 2)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: NetworkManager }
            - { call: "POST /network/regions", payload: { county_fips: "06039", name: "Mono", geo_class: "URBAN", enrolled_member_count: 100 }, as: NetworkManager, captures: { reg: "$.data.id" } }
            - { call: "POST /network/standards", payload: { specialty: "CARDIOLOGY", geo_class: "URBAN", max_members_per_provider: 1200, max_travel_minutes: 30, max_travel_miles: 15, max_wait_days_routine: 15, max_wait_days_urgent: 2 }, as: NetworkManager }
            - { call: "POST /network/providers", payload: { npi: "1000000029", legal_name: "Heart 29", specialty: "CARDIOLOGY", contract_effective_date: "2026-04-01" }, as: NetworkManager, captures: { prov: "$.data.id" } }
            - { call: "POST /network/locations", payload: { provider_id: "${prov}", region_id: "${reg}", address_line: "29 A St", panel_status: "OPEN", avg_travel_minutes: 10, avg_travel_miles: 5 }, as: NetworkManager, captures: { loc1: "$.data.id" } }
            - { call: "POST /network/locations", payload: { provider_id: "${prov}", region_id: "${reg}", address_line: "29 B St", panel_status: "OPEN", avg_travel_minutes: 10, avg_travel_miles: 5 }, as: NetworkManager, captures: { loc2: "$.data.id" } }
            - { call: "POST /network/listings", payload: { provider_id: "${prov}", location_id: "${loc1}", specialty: "CARDIOLOGY", display_name: "29 A", phone: "555-0129", accepts_new_patients: true }, as: NetworkManager, captures: { lst1: "$.data.id" } }
            - { call: "POST /network/listings", payload: { provider_id: "${prov}", location_id: "${loc2}", specialty: "CARDIOLOGY", display_name: "29 B", phone: "555-0130", accepts_new_patients: true }, as: NetworkManager, captures: { lst2: "$.data.id" } }
            - { call: "POST /network/listings/${lst1}/publish", as: NetworkManager }
            - { call: "POST /network/listings/${lst2}/publish", as: NetworkManager }
          trigger:
            - { call: "PATCH /network/providers/${prov}", payload: { to_status: "SUSPENDED" }, as: NetworkManager }
            - { call: "GET /network/listings", payload: { provider_id: "${prov}", status: "SUPPRESSED" }, as: NetworkManager, captures: { sup1_reason: "$.data[0].suppress_reason" } }
            - { call: "PATCH /network/providers/${prov}", payload: { to_status: "EFFECTIVE" }, as: NetworkManager }
            - { call: "GET /network/listings", payload: { provider_id: "${prov}", status: "LISTED" }, as: NetworkManager, captures: { back1: "$.data[0].status", back1_reason: "$.data[0].suppress_reason" } }
          assert:
            - "while suspended: 2 listings SUPPRESSED with suppress_reason == PROVIDER_SUSPENDED; listed_count == 0"
            - "after reinstate: listed_count restored to 2 with suppress_reason == NONE — compensating pair conserves the count"
            - "listed_count invariant: count before suspend (2) == count after reinstate (2)"

      - name: access_plan_approval_conserves_penalty_outstanding
        grounds:
          - entities.DeficiencyRecord.fields.outstanding_penalty_cents
          - state_machines.DeficiencyRecord.OPEN_to_EXCUSED
          - calculations.evaluation_penalty_rollup
        distinguishing_aspect: |
          Conserved quantity = money: outstanding == accrued - reversed at every step. Accruing
          149985 then approving a full-coverage access plan reverses exactly 149985; outstanding
          returns to 0 and the evaluation rollup decrements by the identical amount (no drift).
        test_recipe:
          setup:
            - "Region enrolled 12000, DERMATOLOGY std max 15000, zero providers; E1 (06-01..06-11) finalize accrues 149985 on new deficiency D; clock 2026-06-15"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: NetworkManager }
            - { call: "POST /network/regions", payload: { county_fips: "06041", name: "Napa", geo_class: "URBAN", enrolled_member_count: 12000 }, as: NetworkManager, captures: { reg: "$.data.id" } }
            - { call: "POST /network/standards", payload: { specialty: "DERMATOLOGY", geo_class: "URBAN", max_members_per_provider: 15000, max_travel_minutes: 45, max_travel_miles: 30, max_wait_days_routine: 20, max_wait_days_urgent: 3 }, as: NetworkManager }
            - { call: "POST /network/evaluations", payload: { measurement_period: "E1", period_start_date: "2026-06-01", period_end_date: "2026-06-11" }, as: NetworkManager, captures: { ev1: "$.data.id" } }
            - { call: "POST /network/evaluations/${ev1}/finalize", as: NetworkManager }
            - { call: "GET /network/deficiencies", payload: { evaluation_id: "${ev1}", region_id: "${reg}" }, as: NetworkManager, captures: { d1: "$.data[0].id", d1_v: "$.data[0].version", d1_acc: "$.data[0].accrued_penalty_cents", d1_out: "$.data[0].outstanding_penalty_cents" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-15T00:00:00Z" }, as: NetworkManager }
            - { call: "POST /network/deficiencies/${d1}/access-plan-requests", payload: { expected_deficiency_version: "${d1_v}", remedy_summary: "full coverage plan", excuse_start_date: "2026-06-15", excuse_through_date: "2026-08-31" }, as: NetworkManager, captures: { r1: "$.data.id" } }
          trigger:
            - { call: "POST /network/access-plan-requests/${r1}/submit", as: NetworkManager }
            - { call: "POST /network/access-plan-requests/${r1}/decide", payload: { decision: "APPROVED" }, as: Regulator }
            - { call: "GET /network/deficiencies/${d1}", as: NetworkManager, captures: { d_st: "$.data.status", d_acc2: "$.data.accrued_penalty_cents", d_rev: "$.data.reversed_penalty_cents", d_out2: "$.data.outstanding_penalty_cents" } }
            - { call: "GET /network/evaluations/${ev1}", as: NetworkManager, captures: { ev_total: "$.data.total_penalty_cents" } }
          assert:
            - "before approval: accrued_penalty_cents == 149985 and outstanding_penalty_cents == 149985"
            - "after approval: status == EXCUSED, accrued unchanged (149985), reversed_penalty_cents == 149985"
            - "invariant holds: outstanding_penalty_cents == accrued - reversed == 0"
            - "evaluation total_penalty_cents decremented by exactly 149985: 149985 -> 0"
