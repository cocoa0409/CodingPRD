          - errors.ERR_CHRONOLOGY_VIOLATION
        distinguishing_aspect: |
          Five distinct chronology clauses, one code: a valuation_date inside the 180-day advance-notice
          window, a statement period_end in the future, a period_start that is not strictly before
          period_end, a lessee-cure payment_at predating served_at, and a sublease term that escapes the
          lease term. Each is measured against the logical clock at 2026-08-01, so the first legal
          valuation_date is 2027-01-28 and 2026-10-01 is refused.
        test_recipe:
          setup:
            - "One lease with a SERVED non-monetary notice; the lease version is captured after the notice bumped it."
          setup_api_calls:
