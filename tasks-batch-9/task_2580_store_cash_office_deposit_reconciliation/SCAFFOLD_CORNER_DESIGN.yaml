            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:05:00Z" }
              as: TreasuryAnalyst
            - call: "POST /cash-ops/safes/${safe_id}/open"
              payload: {}
              as: CashOfficeClerk
              as_user_id: "U-CLERK-2"
            - call: "GET /cash-ops/safes/${safe_id}"
              payload: {}
              as: CashOfficeClerk
              as_user_id: "U-CLERK-1"
              captures: { safe_v: $.data.version }
            - call: "POST /cash-ops/deposits"
              payload: { safe_id: "${safe_id}", sales_journal_id: "${journal_id}", business_date: "2026-08-03", counted_lines: [{ denomination_cents: 2000, quantity: 100 }, { denomination_cents: 500, quantity: 1 }], expected_safe_version: "${safe_v}" }
              as: CashOfficeClerk
