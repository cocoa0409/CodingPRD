            - "Program after issuance: remaining_cap_cents == 0, allocated_credit_cents == 37500000"
            - "Application B issuance (5000000 > 0 remaining): error_id == ERR_PROGRAM_CAP_EXHAUSTED (http 409)"

      - name: transfer_price_exact_floor
        grounds:
          - calculations.transfer_price_floor
          - errors[ERR_TRANSFER_PRICE_BELOW_FLOOR]
        distinguishing_aspect: |
          Metric: price ratio in cents, endpoint: POST /api/transfers. For
          amount 10000001 the floor is floor(0.90 * 10000001) = 9000000
          (floor of a non-integer 9000000.9): price == 9000000 succeeds even
          though 9000000 / 10000001 < 0.90 as a raw ratio; price == 8999999
          fails. Distinct metric and endpoint from the deadline and cap
          boundaries.
        test_recipe:
          setup:
