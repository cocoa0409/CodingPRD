# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage of non-difficulty claims)
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_and_get_holder_roundtrips
        claim_type: Creation
        grounds: [entities.RightHolder, endpoints]
        distinguishing_aspect: "POST /holders returns 201 with a server-minted id; GET /holders/{id} returns the same full_name."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - { call: "POST /cemetery-mgmt/holders", payload: { full_name: "Ada Grave", email: "ada@x.com", phone: "5" }, as: Registrar, captures: { holder_id: "$.data.id" } }
          trigger:
            - { call: "GET /cemetery-mgmt/holders/${holder_id}", payload: {}, as: Registrar, captures: { got: "$.data.full_name" } }
          assert:
            - "RightHolder.${holder_id}.full_name == 'Ada Grave'"

      - name: get_plot_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /plots/{id} with an unknown UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /cemetery-mgmt/plots/00000000-0000-4000-8000-000000000000", payload: {}, as: Registrar, captures: { err: "$.data.error_id" } }
          assert:
            - "data.error_id == ERR_NOT_FOUND"

      - name: decedent_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.Decedent]
        distinguishing_aspect: "Decedent has common_fields:false — no update endpoint and no version field; only id + created_at are server-stamped."
        test_recipe:
          setup: ["Create a decedent."]
          setup_api_calls:
            - { call: "POST /cemetery-mgmt/decedents", payload: { full_name: "Silent Sam", date_of_death: "2025-12-31", date_of_birth: "1950-01-01" }, as: Registrar, captures: { dec_id: "$.data.id" } }
          trigger:
            - { call: "GET /cemetery-mgmt/decedents/${dec_id}", payload: {}, as: Registrar, captures: { yr: "$.data.death_year" } }
          assert:
            - "Decedent.${dec_id}.death_year == 2025"

      - name: create_plot_missing_required_plot_type
        claim_type: Required Fields
        grounds: ["entities.Plot", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /plots without plot_type returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A cemetery exists."]
          setup_api_calls:
            - { call: "POST /cemetery-mgmt/cemeteries", payload: { name: "Oakwood" }, as: CemeteryDirector, captures: { cem_id: "$.data.id" } }
          trigger:
            - { call: "POST /cemetery-mgmt/plots", payload: { cemetery_id: "${cem_id}", section_code: "A", row: "1", plot_number: "1", gis_lat: 1.0, gis_lng: 2.0, interment_capacity: 2 }, as: Registrar, captures: { err: "$.data.error_id" } }
          assert:
            - "data.error_id == ERR_VALIDATION"

      - name: create_plot_bad_enum_plot_type
        claim_type: Type Constraints
        grounds: ["entities.Plot", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /plots with plot_type='MANSION' (not in enum) returns ERR_VALIDATION."
        test_recipe:
          setup: ["A cemetery exists."]
          setup_api_calls:
            - { call: "POST /cemetery-mgmt/cemeteries", payload: { name: "Oakwood" }, as: CemeteryDirector, captures: { cem_id: "$.data.id" } }
          trigger:
            - { call: "POST /cemetery-mgmt/plots", payload: { cemetery_id: "${cem_id}", section_code: "A", row: "1", plot_number: "1", gis_lat: 1.0, gis_lng: 2.0, plot_type: "MANSION", interment_capacity: 2 }, as: Registrar, captures: { err: "$.data.error_id" } }
          assert:
            - "data.error_id == ERR_VALIDATION"

      - name: computed_death_year_ignores_client_value
        claim_type: Computed Fields
        grounds: [entities.Decedent.fields.death_year]
        distinguishing_aspect: "death_year is derived from date_of_death (2019) regardless of any client input."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - { call: "POST /cemetery-mgmt/decedents", payload: { full_name: "Rey Cord", date_of_death: "2019-08-15" }, as: Registrar, captures: { dec_id: "$.data.id" } }
          trigger:
            - { call: "GET /cemetery-mgmt/decedents/${dec_id}", payload: {}, as: Registrar, captures: { yr: "$.data.death_year" } }
          assert:
            - "Decedent.${dec_id}.death_year == 2019"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: cancel_already_cancelled_interment_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.Interment.SCHEDULED_to_CANCELLED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling an already-CANCELLED interment returns ERR_INVALID_STATE; interments_used not decremented twice."
        test_recipe:
          setup: ["A SCHEDULED interment that has been cancelled once."]
          setup_api_calls:
            - { call: "POST /cemetery-mgmt/cemeteries", payload: { name: "Oakwood", crew_team_count: 1 }, as: CemeteryDirector, captures: { cem_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: Registrar }
            - { call: "POST /cemetery-mgmt/plots", payload: { cemetery_id: "${cem_id}", section_code: "A", row: "1", plot_number: "1", gis_lat: 1.0, gis_lng: 2.0, plot_type: "GRAVE", interment_capacity: 2 }, as: Registrar, captures: { plot_id: "$.data.id", plot_v: "$.data.version" } }
            - { call: "POST /cemetery-mgmt/holders", payload: { full_name: "H One", email: "h1@x.com" }, as: Registrar, captures: { holder_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/deeds", payload: { plot_id: "${plot_id}", holder_id: "${holder_id}", purchase_price_cents: 1000000, sale_type: "NEW_SALE", expected_plot_version: "${plot_v}" }, as: Registrar, captures: { deed_id: "$.data.id", saleInv_id: "$.data.sale_invoice_id" } }
            - { call: "POST /cemetery-mgmt/payments", payload: { invoice_id: "${saleInv_id}", amount_cents: 1222500, method: "CARD" }, as: FinanceOfficer }
            - { call: "POST /cemetery-mgmt/decedents", payload: { full_name: "Dec A", date_of_death: "2026-04-01" }, as: Registrar, captures: { dec_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/interments", payload: { plot_id: "${plot_id}", decedent_id: "${dec_id}", deed_id: "${deed_id}", interment_type: "BURIAL", depth_position: 1, scheduled_date: "2026-06-01", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }, as: Registrar, captures: { int_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/interments/${int_id}/cancel", payload: {}, as: Registrar }
          trigger:
            - { call: "POST /cemetery-mgmt/interments/${int_id}/cancel", payload: {}, as: Registrar, captures: { err: "$.data.error_id" } }
          assert:
            - "data.error_id == ERR_INVALID_STATE"
            - "Plot.${plot_id}.interments_used == 0"

      - name: transfer_surrendered_deed_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.Deed.ISSUED_to_SURRENDERED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A SURRENDERED deed is terminal; POST /deeds/{id}/transfer returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["An ISSUED deed with no interments, then surrendered."]
          setup_api_calls:
            - { call: "POST /cemetery-mgmt/cemeteries", payload: { name: "Oakwood", crew_team_count: 1 }, as: CemeteryDirector, captures: { cem_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/plots", payload: { cemetery_id: "${cem_id}", section_code: "A", row: "1", plot_number: "1", gis_lat: 1.0, gis_lng: 2.0, plot_type: "GRAVE", interment_capacity: 2 }, as: Registrar, captures: { plot_id: "$.data.id", plot_v: "$.data.version" } }
            - { call: "POST /cemetery-mgmt/holders", payload: { full_name: "H One", email: "h1@x.com" }, as: Registrar, captures: { holder1_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/holders", payload: { full_name: "H Two", email: "h2@x.com" }, as: Registrar, captures: { holder2_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/deeds", payload: { plot_id: "${plot_id}", holder_id: "${holder1_id}", purchase_price_cents: 1000000, sale_type: "NEW_SALE", expected_plot_version: "${plot_v}" }, as: Registrar, captures: { deed_id: "$.data.id", saleInv_id: "$.data.sale_invoice_id" } }
            - { call: "POST /cemetery-mgmt/payments", payload: { invoice_id: "${saleInv_id}", amount_cents: 1222500, method: "CARD" }, as: FinanceOfficer }
            - { call: "POST /cemetery-mgmt/deeds/${deed_id}/surrender", payload: {}, as: Registrar }
          trigger:
            - { call: "POST /cemetery-mgmt/deeds/${deed_id}/transfer", payload: { new_holder_id: "${holder2_id}" }, as: Registrar, captures: { err: "$.data.error_id" } }
          assert:
            - "data.error_id == ERR_INVALID_STATE"

      - name: record_clearance_twice_already_recorded
        claim_type: Idempotency
        grounds: ["state_machines.DisintermentAuthorization.REQUESTED_to_REQUESTED", "errors[ERR_ALREADY_RECORDED]"]
        distinguishing_aspect: "A second record-clearance on the same authorization returns ERR_ALREADY_RECORDED (health_cleared stays true, single-shot)."
        test_recipe:
          setup: ["A REQUESTED disinterment authorization with health clearance already recorded."]
          setup_api_calls:
            - { call: "POST /cemetery-mgmt/cemeteries", payload: { name: "Oakwood", crew_team_count: 1 }, as: CemeteryDirector, captures: { cem_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: Registrar }
            - { call: "POST /cemetery-mgmt/plots", payload: { cemetery_id: "${cem_id}", section_code: "A", row: "1", plot_number: "1", gis_lat: 1.0, gis_lng: 2.0, plot_type: "GRAVE", interment_capacity: 2 }, as: Registrar, captures: { plot_id: "$.data.id", plot_v: "$.data.version" } }
            - { call: "POST /cemetery-mgmt/holders", payload: { full_name: "H One", email: "h1@x.com" }, as: Registrar, captures: { holder_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/deeds", payload: { plot_id: "${plot_id}", holder_id: "${holder_id}", purchase_price_cents: 1000000, sale_type: "NEW_SALE", expected_plot_version: "${plot_v}" }, as: Registrar, captures: { deed_id: "$.data.id", saleInv_id: "$.data.sale_invoice_id" } }
            - { call: "POST /cemetery-mgmt/payments", payload: { invoice_id: "${saleInv_id}", amount_cents: 1222500, method: "CARD" }, as: FinanceOfficer }
            - { call: "POST /cemetery-mgmt/decedents", payload: { full_name: "Dec A", date_of_death: "2026-04-01" }, as: Registrar, captures: { dec_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/interments", payload: { plot_id: "${plot_id}", decedent_id: "${dec_id}", deed_id: "${deed_id}", interment_type: "BURIAL", depth_position: 1, scheduled_date: "2026-06-01", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }, as: Registrar, captures: { int_id: "$.data.id", svcInv_id: "$.data.service_invoice_id" } }
            - { call: "POST /cemetery-mgmt/payments", payload: { invoice_id: "${svcInv_id}", amount_cents: 96525, method: "CARD" }, as: FinanceOfficer }
            - { call: "POST /cemetery-mgmt/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: Registrar }
            - { call: "POST /cemetery-mgmt/interments/${int_id}/open", payload: {}, as: GroundsForeman }
            - { call: "POST /cemetery-mgmt/interments/${int_id}/complete", payload: {}, as: GroundsForeman }
            - { call: "POST /cemetery-mgmt/disinterment-authorizations", payload: { interment_id: "${int_id}", reason: "removal", disinterment_type: "REMOVAL" }, as: Registrar, captures: { auth_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/disinterment-authorizations/${auth_id}/record-clearance", payload: {}, as: HealthOfficer }
          trigger:
            - { call: "POST /cemetery-mgmt/disinterment-authorizations/${auth_id}/record-clearance", payload: {}, as: HealthOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "data.error_id == ERR_ALREADY_RECORDED"

      - name: approve_without_consent_incomplete
        claim_type: Precondition Enforcement
        grounds: ["state_machines.DisintermentAuthorization.REQUESTED_to_APPROVED", "errors[ERR_CONSENT_INCOMPLETE]"]
        distinguishing_aspect: "Approving with health_cleared=true but nok_consented=false returns ERR_CONSENT_INCOMPLETE (join gate needs both branches)."
        test_recipe:
          setup: ["A REQUESTED authorization with clearance recorded but no next-of-kin consent."]
          setup_api_calls:
            - { call: "POST /cemetery-mgmt/cemeteries", payload: { name: "Oakwood", crew_team_count: 1 }, as: CemeteryDirector, captures: { cem_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: Registrar }
            - { call: "POST /cemetery-mgmt/plots", payload: { cemetery_id: "${cem_id}", section_code: "A", row: "1", plot_number: "1", gis_lat: 1.0, gis_lng: 2.0, plot_type: "GRAVE", interment_capacity: 2 }, as: Registrar, captures: { plot_id: "$.data.id", plot_v: "$.data.version" } }
            - { call: "POST /cemetery-mgmt/holders", payload: { full_name: "H One", email: "h1@x.com" }, as: Registrar, captures: { holder_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/deeds", payload: { plot_id: "${plot_id}", holder_id: "${holder_id}", purchase_price_cents: 1000000, sale_type: "NEW_SALE", expected_plot_version: "${plot_v}" }, as: Registrar, captures: { deed_id: "$.data.id", saleInv_id: "$.data.sale_invoice_id" } }
            - { call: "POST /cemetery-mgmt/payments", payload: { invoice_id: "${saleInv_id}", amount_cents: 1222500, method: "CARD" }, as: FinanceOfficer }
            - { call: "POST /cemetery-mgmt/decedents", payload: { full_name: "Dec A", date_of_death: "2026-04-01" }, as: Registrar, captures: { dec_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/interments", payload: { plot_id: "${plot_id}", decedent_id: "${dec_id}", deed_id: "${deed_id}", interment_type: "BURIAL", depth_position: 1, scheduled_date: "2026-06-01", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }, as: Registrar, captures: { int_id: "$.data.id", svcInv_id: "$.data.service_invoice_id" } }
            - { call: "POST /cemetery-mgmt/payments", payload: { invoice_id: "${svcInv_id}", amount_cents: 96525, method: "CARD" }, as: FinanceOfficer }
            - { call: "POST /cemetery-mgmt/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: Registrar }
            - { call: "POST /cemetery-mgmt/interments/${int_id}/open", payload: {}, as: GroundsForeman }
            - { call: "POST /cemetery-mgmt/interments/${int_id}/complete", payload: {}, as: GroundsForeman }
            - { call: "POST /cemetery-mgmt/disinterment-authorizations", payload: { interment_id: "${int_id}", reason: "removal", disinterment_type: "REMOVAL" }, as: Registrar, captures: { auth_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/disinterment-authorizations/${auth_id}/record-clearance", payload: {}, as: HealthOfficer }
          trigger:
            - { call: "POST /cemetery-mgmt/disinterment-authorizations/${auth_id}/approve", payload: {}, as: CemeteryDirector, as_user_id: "dir-1", captures: { err: "$.data.error_id" } }
          assert:
            - "data.error_id == ERR_CONSENT_INCOMPLETE"

      - name: retire_sold_plot_not_available
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Plot.AVAILABLE_to_RETIRED", "errors[ERR_PLOT_NOT_AVAILABLE]"]
        distinguishing_aspect: "Retiring a SOLD plot returns ERR_PLOT_NOT_AVAILABLE (retire requires AVAILABLE)."
        test_recipe:
          setup: ["A SOLD plot (ISSUED deed)."]
          setup_api_calls:
            - { call: "POST /cemetery-mgmt/cemeteries", payload: { name: "Oakwood", crew_team_count: 1 }, as: CemeteryDirector, captures: { cem_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/plots", payload: { cemetery_id: "${cem_id}", section_code: "A", row: "1", plot_number: "1", gis_lat: 1.0, gis_lng: 2.0, plot_type: "GRAVE", interment_capacity: 2 }, as: Registrar, captures: { plot_id: "$.data.id", plot_v: "$.data.version" } }
            - { call: "POST /cemetery-mgmt/holders", payload: { full_name: "H One", email: "h1@x.com" }, as: Registrar, captures: { holder_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/deeds", payload: { plot_id: "${plot_id}", holder_id: "${holder_id}", purchase_price_cents: 1000000, sale_type: "NEW_SALE", expected_plot_version: "${plot_v}" }, as: Registrar, captures: { deed_id: "$.data.id", saleInv_id: "$.data.sale_invoice_id" } }
            - { call: "POST /cemetery-mgmt/payments", payload: { invoice_id: "${saleInv_id}", amount_cents: 1222500, method: "CARD" }, as: FinanceOfficer }
          trigger:
            - { call: "POST /cemetery-mgmt/plots/${plot_id}/retire", payload: {}, as: CemeteryDirector, captures: { err: "$.data.error_id" } }
          assert:
            - "data.error_id == ERR_PLOT_NOT_AVAILABLE"

      - name: surrender_deed_with_active_interment_occupied
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Deed.ISSUED_to_SURRENDERED", "errors[ERR_PLOT_OCCUPIED]"]
        distinguishing_aspect: "Surrendering a deed whose plot has a SCHEDULED interment returns ERR_PLOT_OCCUPIED."
        test_recipe:
          setup: ["ISSUED deed with one SCHEDULED interment on the plot."]
          setup_api_calls:
            - { call: "POST /cemetery-mgmt/cemeteries", payload: { name: "Oakwood", crew_team_count: 1 }, as: CemeteryDirector, captures: { cem_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: Registrar }
            - { call: "POST /cemetery-mgmt/plots", payload: { cemetery_id: "${cem_id}", section_code: "A", row: "1", plot_number: "1", gis_lat: 1.0, gis_lng: 2.0, plot_type: "GRAVE", interment_capacity: 2 }, as: Registrar, captures: { plot_id: "$.data.id", plot_v: "$.data.version" } }
            - { call: "POST /cemetery-mgmt/holders", payload: { full_name: "H One", email: "h1@x.com" }, as: Registrar, captures: { holder_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/deeds", payload: { plot_id: "${plot_id}", holder_id: "${holder_id}", purchase_price_cents: 1000000, sale_type: "NEW_SALE", expected_plot_version: "${plot_v}" }, as: Registrar, captures: { deed_id: "$.data.id", saleInv_id: "$.data.sale_invoice_id" } }
            - { call: "POST /cemetery-mgmt/payments", payload: { invoice_id: "${saleInv_id}", amount_cents: 1222500, method: "CARD" }, as: FinanceOfficer }
            - { call: "POST /cemetery-mgmt/decedents", payload: { full_name: "Dec A", date_of_death: "2026-04-01" }, as: Registrar, captures: { dec_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/interments", payload: { plot_id: "${plot_id}", decedent_id: "${dec_id}", deed_id: "${deed_id}", interment_type: "BURIAL", depth_position: 1, scheduled_date: "2026-06-01", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }, as: Registrar, captures: { int_id: "$.data.id" } }
          trigger:
            - { call: "POST /cemetery-mgmt/deeds/${deed_id}/surrender", payload: {}, as: Registrar, captures: { err: "$.data.error_id" } }
          assert:
            - "data.error_id == ERR_PLOT_OCCUPIED"

      - name: install_marker_without_completed_interment
        claim_type: guarded transitions
        grounds: ["state_machines.MarkerPermit.APPROVED_to_INSTALLED", "errors[ERR_NO_COMPLETED_INTERMENT]"]
        distinguishing_aspect: "Installing an APPROVED, paid marker permit on a plot with no COMPLETED interment returns ERR_NO_COMPLETED_INTERMENT."
        test_recipe:
          setup: ["An APPROVED marker permit whose MARKER_FOUNDATION invoice is PAID, on a plot with no completed interment."]
          setup_api_calls:
            - { call: "POST /cemetery-mgmt/cemeteries", payload: { name: "Oakwood", crew_team_count: 1 }, as: CemeteryDirector, captures: { cem_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/plots", payload: { cemetery_id: "${cem_id}", section_code: "A", row: "1", plot_number: "1", gis_lat: 1.0, gis_lng: 2.0, plot_type: "GRAVE", interment_capacity: 2 }, as: Registrar, captures: { plot_id: "$.data.id", plot_v: "$.data.version" } }
            - { call: "POST /cemetery-mgmt/holders", payload: { full_name: "H One", email: "h1@x.com" }, as: Registrar, captures: { holder_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/deeds", payload: { plot_id: "${plot_id}", holder_id: "${holder_id}", purchase_price_cents: 1000000, sale_type: "NEW_SALE", expected_plot_version: "${plot_v}" }, as: Registrar, captures: { deed_id: "$.data.id", saleInv_id: "$.data.sale_invoice_id" } }
            - { call: "POST /cemetery-mgmt/payments", payload: { invoice_id: "${saleInv_id}", amount_cents: 1222500, method: "CARD" }, as: FinanceOfficer }
            - { call: "POST /cemetery-mgmt/marker-permits", payload: { plot_id: "${plot_id}", deed_id: "${deed_id}", marker_type: "FLAT", foundation_length_in: 24, foundation_width_in: 12 }, as: Registrar, captures: { permit_id: "$.data.id", fInv_id: "$.data.foundation_invoice_id" } }
            - { call: "POST /cemetery-mgmt/marker-permits/${permit_id}/approve", payload: {}, as: CemeteryDirector }
            - { call: "POST /cemetery-mgmt/payments", payload: { invoice_id: "${fInv_id}", amount_cents: 16088, method: "CARD" }, as: FinanceOfficer }
          trigger:
            - { call: "POST /cemetery-mgmt/marker-permits/${permit_id}/install", payload: {}, as: GroundsForeman, captures: { err: "$.data.error_id" } }
          assert:
            - "data.error_id == ERR_NO_COMPLETED_INTERMENT"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: marker_foundation_fee_flat_lookup
        claim_type: Correct Result
        grounds: [calculations.marker_foundation_fee, entities.MarkerPermit.fields.foundation_fee_cents]
