              as: ProgramAdmin
              captures: { pm: "$.data.id" }
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-6102", owner_name: "Vic Lang", owner_email: "vic@example.com", situs_address: "22 Ridge Rd", structure_present: true, roof_class: "CLASS_C", vegetation_type: "MIXED_CONIFER", slope_pct: 40, lot_area_sqft: 60000, hazard_zone: "VERY_HIGH", access_constraint: "LOCKED_GATE" }
              as: ProgramAdmin
