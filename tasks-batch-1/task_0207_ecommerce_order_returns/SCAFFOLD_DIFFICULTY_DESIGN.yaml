              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /warehouses"
              payload: { code: "W9A", name: "Main", fulfillment_priority: 1 }
              as: StoreAdmin
              captures: { wh_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "S9A", title: "S9A", unit_price_cents: 1000, tax_rate_bps: 0, return_window_days: 30, final_sale: false }
              as: StoreAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /inventory"
              payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", on_hand_qty: 10 }
              as: StoreAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/lines"
              payload: { product_id: "${prod_id}", qty: 4 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /orders/${ord_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_v: $.data.version }
            - call: "POST /orders/${ord_id}/checkout"
