              as: SosAdmin
              as_user_id: "admin-1"
              captures: { alpha_id: $.data.id }
            - call: "POST /voter-records"
              payload: { county_id: "${alpha_id}", voter_id_number: "VA1", full_name: "Ada Adams", signature_on_file_hash: "H-VA1", registration_date: "2020-01-01T00:00:00Z", registration_status: "ACTIVE" }
              as: SosAdmin
              as_user_id: "admin-1"
            - call: "POST /voter-records"
              payload: { county_id: "${alpha_id}", voter_id_number: "VA2", full_name: "Abe Archer", signature_on_file_hash: "H-VA2", registration_date: "2020-01-01T00:00:00Z", registration_status: "INACTIVE" }
              as: SosAdmin
              as_user_id: "admin-1"
            - call: "POST /petitions"
              payload: { standard_id: "${std_id}", proponent_name: "Credibility Committee", submitted_title: "Credibility Measure", measure_subject_codes: ["EDUCATION"] }
              as: Proponent
              as_user_id: "prop-1"
              captures: { pet_id: $.data.id }
            - call: "POST /petitions/${pet_id}/submit"
              payload: {}
              as: Proponent
              as_user_id: "prop-1"
            - call: "POST /petitions/${pet_id}/format-decision"
              payload: { decision: "APPROVE" }
              as: ElectionsExaminer
              as_user_id: "exam-1"
              captures: { pet_v: $.data.version }
            - call: "PUT /petitions/${pet_id}/title-summary"
              payload: { official_title: "Education Funding Act", official_summary: "Raises school funding statewide.", expected_petition_version: "${pet_v}" }
              as: TitleExaminer
              as_user_id: "title-1"
            - call: "POST /petitions/${pet_id}/clear-for-circulation"
              payload: {}
              as: SosAdmin
              as_user_id: "admin-1"
            - call: "POST /circulators"
              payload: { full_name: "Cora Carter", residency_state_code: "CA" }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { circ_id: $.data.id }
            - call: "POST /circulators/${circ_id}/training"
              payload: { training_course_code: "SOS-CIRC-101" }
              as: SosAdmin
              as_user_id: "admin-1"
            - call: "POST /circulators/${circ_id}/affidavit"
              payload: { sworn: true }
              as: SosAdmin
              as_user_id: "admin-1"
