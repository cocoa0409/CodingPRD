  # =========================================================================
  # Section 3 — Calculations
  # =========================================================================
  - section: calculations
    instances:

      - name: addon_proration_ceil_on_add_versus_floor_on_release
        claim_type: Variant Divergence
        grounds:
          - calculations.addon_proration_amount
          - entities.BillingCycle.fields.addon_charge_cents
          - entities.BillingCycle.fields.addon_credit_cents
        distinguishing_aspect: "Identical inputs (305 cents x 1 seat x 21 inclusive remaining days = 213.5) round UP to 214 on the SEAT_ADDED variant and DOWN to 213 on SEAT_RELEASED, so a buy-then-suspend round trip inside one cycle is not value-neutral: it leaves exactly 1 cent on the cycle."
        test_recipe:
          setup:
            - "SOLO plan at 1200 cents; ACTIVE account opened at 2026-05-01T00:00:00Z with its OPEN cycle ending 2026-05-31T00:00:00Z."
            - "Clock moved to 2026-05-11T00:00:00Z, giving remaining_days 20 and remaining_days_inclusive 21."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "SOLO", name: "Solo Shield", monthly_fee_cents: 1200, max_members: 1, profile_quota_per_cycle: 1, scan_quota_per_cycle: 4, removal_quota_per_cycle: 20, per_member_removal_subcap: 20 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_solo_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_solo_id}", primary_member_email: "owner@example.com", primary_member_full_name: "Dana Owner" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct_id: $.data.id, owner_id: $.data.primary_member_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-11T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /accounts/${acct_id}/addons"
              payload: { addon_type: "VPN", seats_total: 1, per_seat_fee_cents: 305 }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { addon_id: $.data.id, charge: $.data.prorated_charge_cents }
            - call: "POST /addons/${addon_id}/suspend"
              payload: {}
              as: AccountOwner
              as_user_id: "${owner_id}"
            - call: "GET /accounts/${acct_id}/billing-cycles"
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { cycle_id: "$.data[0].id" }
          assert:
            - "AddOnSubscription.${addon_id}.prorated_charge_cents == 214 (ceil of 213.5)"
            - "BillingCycle.${cycle_id}.addon_charge_cents == 214"
            - "BillingCycle.${cycle_id}.addon_credit_cents == 213 (floor of 213.5)"
            - "BillingCycle.${cycle_id}.pre_discount_total_cents == 1201 (1200 + 214 - 213)"
            - "BillingCycle.${cycle_id}.loyalty_discount_cents == 0 — 1201 is below LOYALTY_TIER_1_THRESHOLD_CENTS (1500)"
            - "BillingCycle.${cycle_id}.total_charged_cents == 1201"
            - "AddOnSubscription.${addon_id}.status == SUSPENDED"

      - name: broker_compliance_lifetime_versus_current_window_scope
