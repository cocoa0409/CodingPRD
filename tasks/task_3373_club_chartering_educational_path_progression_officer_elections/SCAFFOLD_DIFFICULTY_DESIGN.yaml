            - call: "GET /toastmasters/clubs/${club_id}"
              as: WorldHeadquarters
              captures: { club_v2: "$.data.version" }
            - call: "POST /toastmasters/meetings"
              payload: { club_id: "${club_id}", scheduled_at: "2026-09-12T18:30:00Z", duration_minutes: 90, venue_name: "Riverside Library", expected_club_version: "${club_v2}" }
              as: ClubOfficer
              as_user_id: "${ms_ada_id}"
              captures: { mtg_b_id: "$.data.id", mtg_b_v: "$.data.version" }
            - call: "GET /toastmasters/clubs/${club_id}"
              as: WorldHeadquarters
              captures: { club_v3: "$.data.version" }
            - call: "POST /toastmasters/meetings"
              payload: { club_id: "${club_id}", scheduled_at: "2026-09-14T18:30:00Z", duration_minutes: 90, venue_name: "Riverside Library", expected_club_version: "${club_v3}" }
              as: ClubOfficer
              as_user_id: "${ms_ada_id}"
              captures: { mtg_c_id: "$.data.id", mtg_c_v: "$.data.version" }
            - call: "POST /toastmasters/role-assignments"
              payload: { meeting_id: "${mtg_a_id}", member_id: "${m_ada_id}", role_code: "SPEAKER", expected_meeting_version: "${mtg_a_v}" }
              as: ClubOfficer
              as_user_id: "${ms_ada_id}"
            - call: "POST /toastmasters/role-assignments"
              payload: { meeting_id: "${mtg_b_id}", member_id: "${m_ada_id}", role_code: "SPEAKER", expected_meeting_version: "${mtg_b_v}" }
              as: ClubOfficer
              as_user_id: "${ms_ada_id}"
              captures: { assign_b_id: "$.data.id" }
            - call: "POST /toastmasters/role-assignments"
              payload: { meeting_id: "${mtg_c_id}", member_id: "${m_grace_id}", role_code: "TOASTMASTER", expected_meeting_version: "${mtg_c_v}" }
              as: ClubOfficer
              as_user_id: "${ms_ada_id}"
          trigger:
            - call: "POST /toastmasters/role-assignments"
              payload: { meeting_id: "${mtg_c_id}", member_id: "${m_ada_id}", role_code: "SPEAKER", expected_meeting_version: "${mtg_c_v}" }
              as: ClubOfficer
              as_user_id: "${ms_ada_id}"
              captures: { err: "$.data.error_id" }
            - call: "POST /toastmasters/role-assignments/${assign_b_id}/release"
              payload: { released_reason: "Member moved out of the area" }
              as: ClubOfficer
              as_user_id: "${ms_ada_id}"
              captures: { released_status: "$.data.status" }
            - call: "GET /toastmasters/meetings/${mtg_c_id}"
              as: WorldHeadquarters
              captures: { mtg_c_v2: "$.data.version" }
            - call: "POST /toastmasters/role-assignments"
              payload: { meeting_id: "${mtg_c_id}", member_id: "${m_ada_id}", role_code: "SPEAKER", expected_meeting_version: "${mtg_c_v2}" }
              as: ClubOfficer
              as_user_id: "${ms_ada_id}"
              captures: { retry_id: "$.data.id", retry_status: "$.data.status" }
          assert:
            - "the third SPEECH assignment returns ERR_ROLE_WINDOW_EXCEEDED with HTTP 409 while two prior SPEECH assignments sit inside the window"
            - "RoleAssignment.${assign_b_id}.status == RELEASED after the release"
            - "the identical third assignment then succeeds with HTTP 201 and status ASSIGNED"
            - "MeetingEvent.${mtg_c_id}.filled_role_slots == 2 after both accepted assignments"

  - rule_id: compensating_invariant
    instances:
      - name: dues_payment_and_refund_conserve_paid_roster
        grounds:
          - state_machines.Membership.PAID_to_VOID
          - calculations.dues_quote
          - entities.Club.fields.paid_member_count
          - entities.Membership.fields.dues_paid_through_cycle
        distinguishing_aspect: |
          The conserved quantity is the club's paid-roster count, pinned as
          Club.paid_member_count == count(Membership where dues_paid_through_cycle >=
          Club.dues_cycle_index): renewing then refunding a dues payment must leave that count at
          its pre-pair value of 0.
        test_recipe:
          setup:
            - "Club Riverside Voices is ORGANIZING with club_dues_cents 3000 and one PENDING membership for Ada"
            - "The pinned quantity Club.paid_member_count is 0 before the pair runs"
          setup_api_calls:
            - call: "POST /toastmasters/clubs"
              payload: { club_name: "Riverside Voices", club_type: "COMMUNITY", district_number: "42", division_code: "C", area_code: "C-3", venue_name: "Riverside Library", club_dues_cents: 3000, cycle_opened_at: "2026-09-01T00:00:00Z", organizing_meeting_at: "2026-09-05T18:30:00Z", organizing_meeting_attendees: 9 }
              as: WorldHeadquarters
              captures: { club_id: "$.data.id" }
            - call: "POST /toastmasters/memberships"
              payload: { club_id: "${club_id}", full_name: "Ada Lovelace", email: "ada@example.org", join_date: "2026-09-02T00:00:00Z", first_time_member: true }
              as: WorldHeadquarters
              captures: { ms_ada_id: "$.data.id", m_ada_id: "$.data.member_id" }
            - call: "GET /toastmasters/clubs/${club_id}"
              as: WorldHeadquarters
              captures: { paid_before: "$.data.paid_member_count" }
          trigger:
            - call: "POST /toastmasters/memberships/${ms_ada_id}/renew"
              payload: {}
              as: Member
              as_user_id: "${m_ada_id}"
              captures: { paid_after_payment: "$.data.dues_paid_through_cycle", dues_after_payment: "$.data.dues_status" }
            - call: "GET /toastmasters/clubs/${club_id}"
              as: WorldHeadquarters
              captures: { roster_after_payment: "$.data.paid_member_count" }
            - call: "POST /toastmasters/memberships/${ms_ada_id}/refund-dues"
              payload: {}
              as: ClubOfficer
              as_user_id: "${ms_ada_id}"
              captures: { cycle_after_refund: "$.data.dues_paid_through_cycle", dues_after_refund: "$.data.dues_status" }
            - call: "GET /toastmasters/clubs/${club_id}"
              as: WorldHeadquarters
              captures: { roster_after_refund: "$.data.paid_member_count" }
          assert:
            - "Club.${club_id}.paid_member_count == 0 before the pair, == 1 after the renewal and == 0 after the refund"
            - "Membership.${ms_ada_id}.dues_paid_through_cycle == 0 after the renewal and back to -1 after the refund"
            - "Membership.${ms_ada_id}.dues_status == VOID after the refund"
            - "the invariant Club.paid_member_count == count(Membership where dues_paid_through_cycle >= Club.dues_cycle_index) holds at all three observation points"

      - name: role_assignment_release_conserves_filled_slots
        grounds:
          - state_machines.RoleAssignment.ASSIGNED_to_RELEASED
          - entities.MeetingEvent.fields.filled_role_slots
          - entities.RoleAssignment.fields.credit_awarded
        distinguishing_aspect: |
          The conserved quantity is a different one: occupied role slots, pinned as
          MeetingEvent.filled_role_slots == count(RoleAssignment of this meeting with status in
          ASSIGNED, COMPLETED, NO_SHOW). Adding an assignment and releasing it must leave the slot
          count at its pre-pair value of 1.
        test_recipe:
          setup:
            - "Club Riverside Voices is ORGANIZING with two paid members"
            - "Meeting A is scheduled and Ada holds one ASSIGNED TIMER role, so filled_role_slots is 1"
          setup_api_calls:
            - call: "POST /toastmasters/clubs"
              payload: { club_name: "Riverside Voices", club_type: "COMMUNITY", district_number: "42", division_code: "C", area_code: "C-3", venue_name: "Riverside Library", club_dues_cents: 3000, cycle_opened_at: "2026-09-01T00:00:00Z", organizing_meeting_at: "2026-09-05T18:30:00Z", organizing_meeting_attendees: 9 }
              as: WorldHeadquarters
              captures: { club_id: "$.data.id" }
            - call: "POST /toastmasters/memberships/bulk"
              payload: { club_id: "${club_id}", pay_dues_immediately: true, members: [ { full_name: "Ada Lovelace", email: "ada@example.org" }, { full_name: "Grace Hopper", email: "grace@example.org" } ] }
              as: WorldHeadquarters
              captures: { ms_ada_id: "$.data.memberships[0].id", m_ada_id: "$.data.memberships[0].member_id", m_grace_id: "$.data.memberships[1].member_id" }
            - call: "GET /toastmasters/clubs/${club_id}"
              as: WorldHeadquarters
              captures: { club_v: "$.data.version" }
            - call: "POST /toastmasters/meetings"
              payload: { club_id: "${club_id}", scheduled_at: "2026-09-10T18:30:00Z", duration_minutes: 90, venue_name: "Riverside Library", expected_club_version: "${club_v}" }
              as: ClubOfficer
              as_user_id: "${ms_ada_id}"
              captures: { mtg_id: "$.data.id", mtg_v: "$.data.version" }
            - call: "POST /toastmasters/role-assignments"
              payload: { meeting_id: "${mtg_id}", member_id: "${m_ada_id}", role_code: "TIMER", expected_meeting_version: "${mtg_v}" }
              as: ClubOfficer
              as_user_id: "${ms_ada_id}"
            - call: "GET /toastmasters/meetings/${mtg_id}"
              as: WorldHeadquarters
              captures: { slots_before: "$.data.filled_role_slots", mtg_v2: "$.data.version" }
          trigger:
            - call: "POST /toastmasters/role-assignments"
              payload: { meeting_id: "${mtg_id}", member_id: "${m_grace_id}", role_code: "GRAMMARIAN", expected_meeting_version: "${mtg_v2}" }
              as: ClubOfficer
              as_user_id: "${ms_ada_id}"
              captures: { added_id: "$.data.id" }
            - call: "GET /toastmasters/meetings/${mtg_id}"
              as: WorldHeadquarters
              captures: { slots_after_add: "$.data.filled_role_slots" }
            - call: "POST /toastmasters/role-assignments/${added_id}/release"
              payload: { released_reason: "Member unavailable" }
              as: ClubOfficer
              as_user_id: "${ms_ada_id}"
              captures: { released_status: "$.data.status" }
            - call: "GET /toastmasters/meetings/${mtg_id}"
              as: WorldHeadquarters
              captures: { slots_after_release: "$.data.filled_role_slots" }
          assert:
            - "MeetingEvent.${mtg_id}.filled_role_slots == 1 before the pair, == 2 after the added assignment and == 1 after the release"
            - "RoleAssignment.${added_id}.status == RELEASED"
            - "the released assignment no longer counts toward filled_role_slots while the original TIMER assignment still does"

      - name: approve_and_return_conserve_path_and_club_counters
        grounds:
          - state_machines.ProjectCompletion.APPROVED_to_RETURNED
          - entities.EducationPath.fields.approved_projects_at_level
          - entities.Club.fields.approved_level_completions_this_cycle
          - calculations.education_level_requirements
        distinguishing_aspect: |
          The conserved quantity is the approved-project count on the education path, pinned as
          EducationPath.approved_projects_at_level == count(ProjectCompletion where path_id
          matches, level equals the path's current level and status is APPROVED): approving then
          returning the same completion must leave the counter at its pre-pair value of 0.
        test_recipe:
          setup:
            - "Club Riverside Voices is ORGANIZING with one paid member"
            - "Ada holds a DYNAMIC_LEADERSHIP path at LEVEL_1 with one LEVEL_1 speech completion in status EVALUATED"
          setup_api_calls:
            - call: "POST /toastmasters/clubs"
              payload: { club_name: "Riverside Voices", club_type: "COMMUNITY", district_number: "42", division_code: "C", area_code: "C-3", venue_name: "Riverside Library", club_dues_cents: 3000, cycle_opened_at: "2026-09-01T00:00:00Z", organizing_meeting_at: "2026-09-05T18:30:00Z", organizing_meeting_attendees: 9 }
              as: WorldHeadquarters
              captures: { club_id: "$.data.id" }
            - call: "POST /toastmasters/memberships"
              payload: { club_id: "${club_id}", full_name: "Ada Lovelace", email: "ada@example.org", join_date: "2026-09-02T00:00:00Z", first_time_member: true }
              as: WorldHeadquarters
              captures: { ms_ada_id: "$.data.id", m_ada_id: "$.data.member_id" }
            - call: "POST /toastmasters/memberships/${ms_ada_id}/renew"
              payload: {}
              as: Member
              as_user_id: "${m_ada_id}"
            - call: "GET /toastmasters/memberships/${ms_ada_id}"
              as: WorldHeadquarters
              captures: { ms_ada_v: "$.data.version" }
            - call: "POST /toastmasters/education-paths"
              payload: { membership_id: "${ms_ada_id}", path_code: "DYNAMIC_LEADERSHIP", expected_membership_version: "${ms_ada_v}" }
              as: Member
              as_user_id: "${m_ada_id}"
              captures: { path_id: "$.data.id", path_v: "$.data.version" }
            - call: "POST /toastmasters/project-completions"
              payload: { path_id: "${path_id}", project_code: "L1-ICE-BREAKER", project_kind: "SPEECH", level: 1, speech_minutes: 6, delivered_at: "2026-09-08T18:30:00Z", expected_education_path_version: "${path_v}" }
              as: Member
              as_user_id: "${m_ada_id}"
              captures: { pc_id: "$.data.id" }
            - call: "POST /toastmasters/project-completions/${pc_id}/evaluation"
              payload: { evaluation_summary: "Confident first speech" }
              as: Member
              as_user_id: "${m_ada_id}"
            - call: "GET /toastmasters/education-paths/${path_id}"
              as: WorldHeadquarters
              captures: { approved_before: "$.data.approved_projects_at_level" }
          trigger:
            - call: "POST /toastmasters/project-completions/${pc_id}/review"
              payload: { decision: "APPROVE" }
              as: ClubOfficer
              as_user_id: "${ms_ada_id}"
              captures: { approved_status: "$.data.status" }
            - call: "GET /toastmasters/education-paths/${path_id}"
              as: WorldHeadquarters
              captures: { approved_after_approve: "$.data.approved_projects_at_level" }
            - call: "GET /toastmasters/clubs/${club_id}"
              as: WorldHeadquarters
              captures: { club_after_approve: "$.data.approved_level_completions_this_cycle" }
            - call: "POST /toastmasters/project-completions/${pc_id}/review"
              payload: { decision: "RETURN", return_reason: "Evaluation rubric was not attached" }
              as: ClubOfficer
              as_user_id: "${ms_ada_id}"
              captures: { returned_status: "$.data.status" }
            - call: "GET /toastmasters/education-paths/${path_id}"
              as: WorldHeadquarters
              captures: { approved_after_return: "$.data.approved_projects_at_level" }
            - call: "GET /toastmasters/clubs/${club_id}"
              as: WorldHeadquarters
              captures: { club_after_return: "$.data.approved_level_completions_this_cycle" }
          assert:
            - "EducationPath.${path_id}.approved_projects_at_level == 0 before the pair, == 1 after the approval and == 0 after the return"
            - "Club.${club_id}.approved_level_completions_this_cycle == 0 before the pair, == 1 after the approval and == 0 after the return"
            - "ProjectCompletion.${pc_id}.status == APPROVED after the approval and == RETURNED after the return"
            - "EducationPath.${path_id}.level stays LEVEL_1 because LEVEL_1 has no revert transition in the level machine"
