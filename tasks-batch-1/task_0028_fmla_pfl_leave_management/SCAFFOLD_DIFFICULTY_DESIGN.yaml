            - "c1249_err == ERR_INELIGIBLE (1249 fails >= 1250)"

      - name: fmla_quota_exactly_480_flips_protection
        grounds:
          - calculations.fmla_pfl_pool_charge
          - calculations.fmla_quota_remaining
          - entities.LeaveCase.fields.job_restoration_protected
        distinguishing_aspect: |
          DIFFERENT metric (cumulative FMLA hours quota) on a DIFFERENT
          endpoint (POST /leave/intervals). At exactly cumulative
          fmla_hours_charged == 480, job_restoration_protected flips to
          false; at 479 it remains true. Tests the boundary by chaining
