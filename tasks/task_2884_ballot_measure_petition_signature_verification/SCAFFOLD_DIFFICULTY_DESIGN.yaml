            - call: "POST /petitions/${pet_id}/format-decision"
              payload: { decision: "APPROVE" }
              as: ElectionsExaminer
              as_user_id: "exam-1"
              captures: { pet_v: $.data.version }
            - call: "PUT /petitions/${pet_id}/title-summary"
              payload: { official_title: "Ballot Access Act", official_summary: "Simplifies ballot access.", expected_petition_version: "${pet_v}" }
              as: TitleExaminer
              as_user_id: "title-1"
            - call: "POST /petitions/${pet_id}/clear-for-circulation"
              payload: {}
              as: SosAdmin
              as_user_id: "admin-1"
            - call: "POST /circulators"
              payload: { full_name: "Cora Carter", residency_state_code: "CA" }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { circ_id: $.data.id }
            - call: "POST /circulators/${circ_id}/training"
              payload: { training_course_code: "SOS-CIRC-101" }
              as: SosAdmin
              as_user_id: "admin-1"
            - call: "POST /circulators/${circ_id}/affidavit"
              payload: { sworn: true }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { circ_v1: $.data.version }
            - call: "POST /circulation-assignments"
              payload: { petition_id: "${pet_id}", circulator_id: "${circ_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-10T00:00:00Z", assigned_county_codes: ["ALPHA"], expected_circulator_version: "${circ_v1}" }
              as: SosAdmin
