            - "${auth_status} == REGISTRY_CONFIRMED and DeathReferral.${ref_id}.status == AUTH_PENDING"
            - "${error_2} == ERR_AUTHORIZATION_NOT_OPENABLE with HTTP 409 (a non-terminal packet already exists)"
            - "the authorization list returns exactly 1 row with total_count 1 and ${first_auth} == ${auth_id}"

