      - name: corner_beer_line_create_against_an_unknown_account_is_account_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.BeerLine.fields.account_id
          - validations.priority_6_ERR_LINE_NOT_FOUND
          - endpoints.POST_beer_lines
        distinguishing_aspect: |
          The body FK check at P6 maps each foreign key to its OWN not-found
          code, so an unresolvable account_id yields ERR_ACCOUNT_NOT_FOUND (404)
          - not ERR_LINE_NOT_FOUND, and not the P20/P21 business errors that
          would fire if the account merely existed in the wrong state. Ordering
          matters: P6 sits above every state rule, so the missing parent is
          reported even though the request would also fail the contract check.
        test_recipe:
          setup:
            - "Empty database except the logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /draft-service/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
