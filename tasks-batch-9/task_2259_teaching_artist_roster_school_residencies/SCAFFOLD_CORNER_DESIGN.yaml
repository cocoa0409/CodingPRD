          - validations[priority=9]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_precedes_business_safety_on_confirm_of_cancelled_session
          rationale: "That instance pins the adjacent-priority ordering between the state machine and the child-safety gate on a single request."

