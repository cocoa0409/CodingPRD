scaffold_difficulty_design:

  # =======================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =======================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: price_quote_one_time_vs_series_occurrence_divergence
        grounds:
          - calculations.price_quote
          - entities.Customer.fields.lifetime_booking_count
          - entities.Booking.fields.quoted_price_cents
        distinguishing_aspect: |
          Same home_size/add-ons/supplies but a different loyalty tier read at quote
          time makes the one_time_quote variant and the series_occurrence_quote variant
          price the identical visit at 18000 vs 17100 cents — divergence lives on the
          Booking cost domain.
        test_recipe:
          setup:
            - "PricingPlan active with TWO_BR base 11000, deep_clean 0.50, supplies_fee 1500."
            - "One cleaner ACTIVE serving 94110."
            - "Customer with lifetime_booking_count 0; a second otherwise-identical TWO_BR DEEP_CLEAN CLEANER-supplies booking is created after the customer has completed 5 bookings (tier 0.05)."
          setup_api_calls:
            - call: "POST /cleaning/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cleaning/pricing-plans"
              payload: { name: "2026 Standard", base_price_cents: { STUDIO: 6000, ONE_BR: 8000, TWO_BR: 11000, THREE_BR: 14000, FOUR_PLUS_BR: 18000 }, deep_clean_surcharge_pct: 0.50, move_out_surcharge_pct: 0.75, supplies_fee_cents: 1500 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id, plan_v: $.data.version }
            - call: "POST /cleaning/pricing-plans/${plan_id}/activate"
              payload: { expected_plan_version: "${plan_v}" }
              as: PlatformAdmin
            - call: "POST /cleaning/cleaners"
              payload: { email: "c1@x.com", full_name: "C One", service_postal_codes: ["94110"] }
              as: Anonymous
              captures: { cl_id: $.data.id }
            - call: "POST /cleaning/cleaners/${cl_id}/background-checks"
              payload: { provider_ref: "ext-1" }
              as: PlatformAdmin
              captures: { bc_id: $.data.id }
            - call: "POST /cleaning/background-checks/${bc_id}/adjudicate"
              payload: { result: "CLEAR" }
              as: PlatformAdmin
            - call: "POST /cleaning/cleaners/${cl_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /cleaning/customers"
              payload: { email: "cust@x.com", full_name: "Cust" }
              as: Anonymous
              captures: { cu_id: $.data.id }
            - call: "POST /cleaning/addresses"
              payload: { customer_id: "${cu_id}", line1: "1 A St", postal_code: "94110", home_size: "TWO_BR" }
              as: Customer
              as_user_id: "${cu_id}"
              captures: { ad_id: $.data.id }
          trigger:
            - call: "POST /cleaning/bookings"
              payload: { customer_id: "${cu_id}", address_id: "${ad_id}", pricing_plan_id: "${plan_id}", scheduled_start: "2026-06-10T09:00:00Z", add_ons: ["DEEP_CLEAN"], supplies_provided_by: "CLEANER" }
              as: Customer
              as_user_id: "${cu_id}"
              captures: { bk_id: $.data.id }
          assert:
            - "Booking.${bk_id}.quoted_price_cents == 18000"
            - "Booking.${bk_id}.quoted_price_cents reflects one_time_quote variant (loyalty tier 0.00 at count 0), distinct from the series_occurrence_quote value of 17100 the same inputs would yield at lifetime_booking_count 5."

      - name: cleaner_payout_normal_vs_reclean_zero
        grounds:
          - calculations.cleaner_payout
          - entities.CleanerPayout.fields.base_payout_cents
          - entities.Booking.fields.is_reclean
        distinguishing_aspect: |
          The same completion event produces base_payout_cents 12600 on a normal
          18000-priced booking but 0 on its is_reclean=true guarantee re-visit — the
          dual variant lives on the CleanerPayout domain, a different entity than
          price_quote's Booking cost.
        test_recipe:
          setup:
            - "An 18000-priced TWO_BR DEEP_CLEAN CLEANER booking is completed (payout 12600), then a reclean is requested and scheduled, and the reclean booking (priced 0) is completed."
          setup_api_calls:
            - call: "POST /cleaning/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cleaning/pricing-plans"
              payload: { name: "2026 Standard", base_price_cents: { STUDIO: 6000, ONE_BR: 8000, TWO_BR: 11000, THREE_BR: 14000, FOUR_PLUS_BR: 18000 }, deep_clean_surcharge_pct: 0.50, move_out_surcharge_pct: 0.75, supplies_fee_cents: 1500 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id, plan_v: $.data.version }
            - call: "POST /cleaning/pricing-plans/${plan_id}/activate"
              payload: { expected_plan_version: "${plan_v}" }
              as: PlatformAdmin
            - call: "POST /cleaning/cleaners"
              payload: { email: "c1@x.com", full_name: "C One", service_postal_codes: ["94110"] }
              as: Anonymous
              captures: { cl_id: $.data.id }
            - call: "POST /cleaning/cleaners/${cl_id}/background-checks"
              payload: { provider_ref: "ext-1" }
              as: PlatformAdmin
              captures: { bc_id: $.data.id }
            - call: "POST /cleaning/background-checks/${bc_id}/adjudicate"
              payload: { result: "CLEAR" }
              as: PlatformAdmin
            - call: "POST /cleaning/cleaners/${cl_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /cleaning/customers"
              payload: { email: "cust@x.com", full_name: "Cust" }
              as: Anonymous
              captures: { cu_id: $.data.id }
            - call: "POST /cleaning/addresses"
              payload: { customer_id: "${cu_id}", line1: "1 A St", postal_code: "94110", home_size: "TWO_BR" }
              as: Customer
              as_user_id: "${cu_id}"
              captures: { ad_id: $.data.id }
            - call: "POST /cleaning/bookings"
              payload: { customer_id: "${cu_id}", address_id: "${ad_id}", pricing_plan_id: "${plan_id}", scheduled_start: "2026-06-10T09:00:00Z", add_ons: ["DEEP_CLEAN"], supplies_provided_by: "CLEANER" }
              as: Customer
              as_user_id: "${cu_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /cleaning/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T11:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cleaning/bookings/${bk_id}/complete"
              payload: { rating: 5 }
              as: Cleaner
              as_user_id: "${cl_id}"
            - call: "POST /cleaning/bookings/${bk_id}/request-reclean"
              payload: {}
              as: Customer
              as_user_id: "${cu_id}"
            - call: "POST /cleaning/bookings/${bk_id}/schedule-reclean"
              payload: { scheduled_start: "2026-06-12T09:00:00Z" }
              as: PlatformAdmin
              captures: { reclean_bk_id: $.data.id }
            - call: "POST /cleaning/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-12T11:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /cleaning/bookings/${reclean_bk_id}/complete"
              payload: {}
              as: Cleaner
              as_user_id: "${cl_id}"
          assert:
            - "the CleanerPayout for booking ${bk_id} has base_payout_cents == 12600"
            - "the CleanerPayout for booking ${reclean_bk_id} has base_payout_cents == 0"

  # =======================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =======================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: price_quote_per_component_rounding_order
        grounds:
          - calculations.price_quote
          - entities.PricingPlan.fields.deep_clean_surcharge_pct
          - entities.PricingPlan.fields.move_out_surcharge_pct
        distinguishing_aspect: |
          Mode (b) nested rounding: each surcharge and the loyalty discount are
          round_half_up to whole cents BEFORE summing; with base 14000, deep 0.50,
          move 0.75, supplies 1500, count-40 tier 0.15 the per-component order yields
          28050, distinct from any sum-then-round variant.
        test_recipe:
          setup:
            - "PricingPlan active; THREE_BR base 14000, deep 0.50, move 0.75, supplies_fee 1500."
            - "Customer at lifetime_booking_count 40 (loyalty 0.15) booking a one-time THREE_BR with both DEEP_CLEAN and MOVE_OUT, CLEANER supplies."
            - "lifetime_booking_count is driven to 40 via the _loyalty test endpoint (see setup_api_calls)."
          setup_api_calls:
            - call: "POST /cleaning/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cleaning/pricing-plans"
              payload: { name: "2026 Standard", base_price_cents: { STUDIO: 6000, ONE_BR: 8000, TWO_BR: 11000, THREE_BR: 14000, FOUR_PLUS_BR: 18000 }, deep_clean_surcharge_pct: 0.50, move_out_surcharge_pct: 0.75, supplies_fee_cents: 1500 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id, plan_v: $.data.version }
            - call: "POST /cleaning/pricing-plans/${plan_id}/activate"
              payload: { expected_plan_version: "${plan_v}" }
              as: PlatformAdmin
            - call: "POST /cleaning/cleaners"
              payload: { email: "c1@x.com", full_name: "C One", service_postal_codes: ["94110"] }
              as: Anonymous
              captures: { cl_id: $.data.id }
            - call: "POST /cleaning/cleaners/${cl_id}/background-checks"
              payload: { provider_ref: "ext-1" }
              as: PlatformAdmin
              captures: { bc_id: $.data.id }
            - call: "POST /cleaning/background-checks/${bc_id}/adjudicate"
              payload: { result: "CLEAR" }
              as: PlatformAdmin
            - call: "POST /cleaning/cleaners/${cl_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /cleaning/customers"
              payload: { email: "cust@x.com", full_name: "Cust" }
              as: Anonymous
              captures: { cu_id: $.data.id }
            - call: "POST /cleaning/_loyalty/set_count"
              payload: { customer_id: "${cu_id}", lifetime_booking_count: 40 }
              as: PlatformAdmin
            - call: "POST /cleaning/addresses"
              payload: { customer_id: "${cu_id}", line1: "1 A St", postal_code: "94110", home_size: "THREE_BR" }
              as: Customer
              as_user_id: "${cu_id}"
              captures: { ad_id: $.data.id }
          trigger:
            - call: "POST /cleaning/bookings"
              payload: { customer_id: "${cu_id}", address_id: "${ad_id}", pricing_plan_id: "${plan_id}", scheduled_start: "2026-06-10T09:00:00Z", add_ons: ["DEEP_CLEAN", "MOVE_OUT"], supplies_provided_by: "CLEANER" }
              as: Customer
              as_user_id: "${cu_id}"
              captures: { bk_id: $.data.id }
          assert:
            - "Booking.${bk_id}.quoted_price_cents == 28050"

      - name: price_quote_evaluation_order_loyalty_tier_off_subtotal
        grounds:
          - calculations.price_quote
          - entities.Customer.fields.lifetime_booking_count
          - calculations.price_quote.variants.series_occurrence_quote
        distinguishing_aspect: |
          Mode (c) pinned evaluation order: the loyalty discount is keyed off a tier
          derived from the running subtotal/count, and the count is read once before
          the in-flight booking counts toward itself; base 11000 + deep 5500 + supplies
          1500 = 18000, tier 0.05 discount 900 => 17100, well-defined only because the
          order is pinned.
        test_recipe:
          setup:
            - "PricingPlan active; TWO_BR base 11000, deep 0.50, supplies_fee 1500."
            - "Customer at lifetime_booking_count 5 (loyalty 0.05) booking a one-time TWO_BR DEEP_CLEAN, CLEANER supplies."
          setup_api_calls:
            - call: "POST /cleaning/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cleaning/pricing-plans"
              payload: { name: "2026 Standard", base_price_cents: { STUDIO: 6000, ONE_BR: 8000, TWO_BR: 11000, THREE_BR: 14000, FOUR_PLUS_BR: 18000 }, deep_clean_surcharge_pct: 0.50, move_out_surcharge_pct: 0.75, supplies_fee_cents: 1500 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id, plan_v: $.data.version }
            - call: "POST /cleaning/pricing-plans/${plan_id}/activate"
              payload: { expected_plan_version: "${plan_v}" }
              as: PlatformAdmin
            - call: "POST /cleaning/cleaners"
              payload: { email: "c1@x.com", full_name: "C One", service_postal_codes: ["94110"] }
              as: Anonymous
              captures: { cl_id: $.data.id }
            - call: "POST /cleaning/cleaners/${cl_id}/background-checks"
              payload: { provider_ref: "ext-1" }
              as: PlatformAdmin
              captures: { bc_id: $.data.id }
            - call: "POST /cleaning/background-checks/${bc_id}/adjudicate"
              payload: { result: "CLEAR" }
              as: PlatformAdmin
            - call: "POST /cleaning/cleaners/${cl_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /cleaning/customers"
              payload: { email: "cust@x.com", full_name: "Cust" }
              as: Anonymous
              captures: { cu_id: $.data.id }
            - call: "POST /cleaning/_loyalty/set_count"
              payload: { customer_id: "${cu_id}", lifetime_booking_count: 5 }
              as: PlatformAdmin
            - call: "POST /cleaning/addresses"
              payload: { customer_id: "${cu_id}", line1: "1 A St", postal_code: "94110", home_size: "TWO_BR" }
              as: Customer
              as_user_id: "${cu_id}"
              captures: { ad_id: $.data.id }
          trigger:
            - call: "POST /cleaning/bookings"
              payload: { customer_id: "${cu_id}", address_id: "${ad_id}", pricing_plan_id: "${plan_id}", scheduled_start: "2026-06-10T09:00:00Z", add_ons: ["DEEP_CLEAN"], supplies_provided_by: "CLEANER" }
              as: Customer
              as_user_id: "${cu_id}"
              captures: { bk_id: $.data.id }
          assert:
            - "Booking.${bk_id}.quoted_price_cents == 17100"

  # =======================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =======================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: booking_reschedule_revision_loop
        grounds:
          - state_machines.Booking.SCHEDULED_to_RESCHEDULED
          - state_machines.Booking.RESCHEDULED_to_RESCHEDULED
        distinguishing_aspect: |
          Booking is a cyclic machine: RESCHEDULED -> RESCHEDULED is a self-loop, so a
          twice-rescheduled booking remains RESCHEDULED — non-linear shape on the
          Booking entity.
        test_recipe:
          setup:
            - "A SCHEDULED TWO_BR booking far from start (no fee window)."
          setup_api_calls:
            - call: "POST /cleaning/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cleaning/pricing-plans"
              payload: { name: "2026 Standard", base_price_cents: { STUDIO: 6000, ONE_BR: 8000, TWO_BR: 11000, THREE_BR: 14000, FOUR_PLUS_BR: 18000 }, deep_clean_surcharge_pct: 0.50, move_out_surcharge_pct: 0.75, supplies_fee_cents: 1500 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id, plan_v: $.data.version }
            - call: "POST /cleaning/pricing-plans/${plan_id}/activate"
              payload: { expected_plan_version: "${plan_v}" }
              as: PlatformAdmin
            - call: "POST /cleaning/cleaners"
              payload: { email: "c1@x.com", full_name: "C One", service_postal_codes: ["94110"] }
              as: Anonymous
              captures: { cl_id: $.data.id }
            - call: "POST /cleaning/cleaners/${cl_id}/background-checks"
              payload: { provider_ref: "ext-1" }
              as: PlatformAdmin
              captures: { bc_id: $.data.id }
            - call: "POST /cleaning/background-checks/${bc_id}/adjudicate"
              payload: { result: "CLEAR" }
              as: PlatformAdmin
            - call: "POST /cleaning/cleaners/${cl_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /cleaning/customers"
              payload: { email: "cust@x.com", full_name: "Cust" }
              as: Anonymous
              captures: { cu_id: $.data.id }
            - call: "POST /cleaning/addresses"
              payload: { customer_id: "${cu_id}", line1: "1 A St", postal_code: "94110", home_size: "TWO_BR" }
              as: Customer
              as_user_id: "${cu_id}"
              captures: { ad_id: $.data.id }
            - call: "POST /cleaning/bookings"
              payload: { customer_id: "${cu_id}", address_id: "${ad_id}", pricing_plan_id: "${plan_id}", scheduled_start: "2026-06-20T09:00:00Z" }
              as: Customer
              as_user_id: "${cu_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /cleaning/bookings/${bk_id}/reschedule"
              payload: { scheduled_start: "2026-06-21T09:00:00Z" }
              as: Customer
              as_user_id: "${cu_id}"
          trigger:
            - call: "POST /cleaning/bookings/${bk_id}/reschedule"
              payload: { scheduled_start: "2026-06-22T09:00:00Z" }
              as: Customer
              as_user_id: "${cu_id}"
          assert:
            - "Booking.${bk_id}.status == RESCHEDULED"
            - "Booking.${bk_id}.scheduled_start == 2026-06-22T09:00:00Z"

      - name: cleaner_branch_terminal_failure_and_reinstatement_loop
        grounds:
          - state_machines.Cleaner.CHECK_PENDING_to_CHECK_FAILED
          - state_machines.Cleaner.ACTIVE_to_SUSPENDED
          - state_machines.Cleaner.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          Cleaner is a branching+cyclic machine on a different entity than Booking: one
          applicant adjudicated ADVERSE lands in terminal CHECK_FAILED (the failure
          fork), while a cleared applicant traverses the ACTIVE -> SUSPENDED -> ACTIVE
          reinstatement loop, ending ACTIVE again — non-linear shape distinct from the
          Booking reschedule cycle.
        test_recipe:
          setup:
            - "Two applicants: 'bad' adjudicated ADVERSE -> terminal CHECK_FAILED; 'good' adjudicated CLEAR -> activated -> suspended."
          setup_api_calls:
            - call: "POST /cleaning/cleaners"
              payload: { email: "bad@x.com", full_name: "Bad Apple", service_postal_codes: ["94110"] }
              as: Anonymous
              captures: { bad_id: $.data.id }
            - call: "POST /cleaning/cleaners/${bad_id}/background-checks"
              payload: { provider_ref: "ext-bad" }
              as: PlatformAdmin
              captures: { bad_bc_id: $.data.id }
            - call: "POST /cleaning/background-checks/${bad_bc_id}/adjudicate"
              payload: { result: "ADVERSE" }
              as: PlatformAdmin
            - call: "POST /cleaning/cleaners"
              payload: { email: "good@x.com", full_name: "Good Egg", service_postal_codes: ["94110"] }
              as: Anonymous
              captures: { good_id: $.data.id }
            - call: "POST /cleaning/cleaners/${good_id}/background-checks"
              payload: { provider_ref: "ext-good" }
              as: PlatformAdmin
              captures: { good_bc_id: $.data.id }
            - call: "POST /cleaning/background-checks/${good_bc_id}/adjudicate"
              payload: { result: "CLEAR" }
              as: PlatformAdmin
            - call: "POST /cleaning/cleaners/${good_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /cleaning/cleaners/${good_id}/suspend"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /cleaning/cleaners/${good_id}/activate"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Cleaner.${bad_id}.status == CHECK_FAILED (terminal failure fork)"
            - "Cleaner.${good_id}.status == ACTIVE (reinstated via SUSPENDED -> ACTIVE loop)"

  # =======================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =======================================================================
  - rule_id: transitive_cascade
    instances:
      - name: series_cancel_cascades_to_booking_cancel_to_ledger_refund
        grounds:
          - state_machines.BookingSeries.ACTIVE_to_CANCELLED
          - state_machines.Booking.SCHEDULED_to_CANCELLED
          - entities.LedgerEntry.fields.kind
        distinguishing_aspect: |
          Depth-3 cascade: cancelling the series (A) cancels its child SCHEDULED
          booking (B); B's own cancel transition itself creates a REFUND LedgerEntry
          and credits the customer wallet (C) — each link caused by the prior, not by
          the series cancel directly.
        test_recipe:
          setup:
            - "A WEEKLY series with one generated SCHEDULED booking priced 6000, far from start."
          setup_api_calls:
            - call: "POST /cleaning/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cleaning/pricing-plans"
              payload: { name: "2026 Standard", base_price_cents: { STUDIO: 6000, ONE_BR: 8000, TWO_BR: 11000, THREE_BR: 14000, FOUR_PLUS_BR: 18000 }, deep_clean_surcharge_pct: 0.50, move_out_surcharge_pct: 0.75, supplies_fee_cents: 1500 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id, plan_v: $.data.version }
            - call: "POST /cleaning/pricing-plans/${plan_id}/activate"
              payload: { expected_plan_version: "${plan_v}" }
              as: PlatformAdmin
            - call: "POST /cleaning/cleaners"
              payload: { email: "c1@x.com", full_name: "C One", service_postal_codes: ["94110"] }
              as: Anonymous
              captures: { cl_id: $.data.id }
            - call: "POST /cleaning/cleaners/${cl_id}/background-checks"
              payload: { provider_ref: "ext-1" }
              as: PlatformAdmin
              captures: { bc_id: $.data.id }
            - call: "POST /cleaning/background-checks/${bc_id}/adjudicate"
              payload: { result: "CLEAR" }
              as: PlatformAdmin
            - call: "POST /cleaning/cleaners/${cl_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /cleaning/customers"
              payload: { email: "cust@x.com", full_name: "Cust" }
              as: Anonymous
              captures: { cu_id: $.data.id }
            - call: "POST /cleaning/addresses"
              payload: { customer_id: "${cu_id}", line1: "1 A St", postal_code: "94110", home_size: "STUDIO" }
              as: Customer
              as_user_id: "${cu_id}"
              captures: { ad_id: $.data.id }
            - call: "POST /cleaning/booking-series"
              payload: { customer_id: "${cu_id}", address_id: "${ad_id}", pricing_plan_id: "${plan_id}", cadence: "WEEKLY", first_occurrence_date: "2026-06-20T09:00:00Z" }
              as: Customer
              as_user_id: "${cu_id}"
              captures: { se_id: $.data.id, se_v: $.data.version }
            - call: "POST /cleaning/booking-series/${se_id}/generate"
              payload: { expected_series_version: "${se_v}" }
              as: PlatformAdmin
              captures: { bk_id: $.data.id }
          trigger:
            - call: "POST /cleaning/booking-series/${se_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cu_id}"
          assert:
            - "BookingSeries.${se_id}.status == CANCELLED"
            - "Booking.${bk_id}.status == CANCELLED"
            - "a LedgerEntry exists with booking_id ${bk_id}, kind REFUND, amount_cents 6000"

      - name: schedule_reclean_spawns_booking_and_assigns_cleaner
        grounds:
          - state_machines.Booking.RECLEAN_REQUESTED_to_RECLEAN_SCHEDULED
          - calculations.assign_cleaner
          - entities.Booking.fields.reclean_of_booking_id
        distinguishing_aspect: |
